l_english:
 poland.13.a:0 "[faction_invitee_target.GetNameDefCap] elbette bir dosttur!"
 poland.13.b:0 "[faction_invitee_target.GetLeader]'e güvenemeyiz."
 poland.13.d:0 "[From.GetLeader], [Root.GetAdjective] hükûmetinin [Root.GetFactionName]'e bir davet uzatmasını talep etti ve bir işgal durumunda bir [faction_invitee_target.GetAdjective] ittifakının büyük stratejik faydası olacağını belirtti."
 poland.13.t:0 "[From.GetNameDefCap], [faction_invitee_target.GetAdjective] İşbirliği Arıyor"
 poland.1301.a:0 "Elbette!"
 poland.1301.b:0 "Bu “[From.GetFactionName]” ile ilgilenmiyoruz."
 poland.1301.d:0 "Zaten [From.GetFactionName]'in bir üyesi olan [From.From.GetLeader], bir [GER.GetAdjective] veya [SOV.GetAdjective] işgali durumunda bir [From.From.GetAdjective]-[Root.GetAdjective] ittifakının büyük stratejik faydası olacağını belirterek [Root.GetNameDef] ile askeri işbirliği arıyor."
 poland.1301.t:0 "[From.From.GetNameDefCap] İşbirliği Arıyor"
 poland.1302.a:0 "Eh, denemeye değerdi."
 poland.1302.d:0 "Görünüşe göre [From.GetLeader], [Root.GetLeader]'in inandığı kadar bir [faction_invitee_target.GetAdjective] ittifakının gerekliliğine inanmıyor. Bu kararın kesin gerekçesi belirsiz, ancak açıkça [From.GetAdjective] hükûmeti, [faction_invitee_target.GetNameDef]'in [From.GetFactionName]'in devam eden hayatta kalması için bir nimetten çok bir zarar olduğuna inanıyor."
 poland.1302.t:0 "[From.GetNameDefCap], [faction_invitee_target.GetAdjective] Girişini Reddediyor"
 poland.1303.a:0 "Üzücü."
 poland.1303.d:0 "Bilinmeyen nedenlerle, [From.GetAdjective] hükûmeti özgürlük mücadelemizde [From.From.GetFactionName] tarafında bize katılmamayı tercih etti. Gerekçeleri ne olursa olsun, gelecekteki [Root.GetAdjective]-[From.GetAdjective] işbirliği için gelecek pek parlak görünmüyor."
 poland.1303.t:0 "[From.GetNameDefCap] Reddediyor!"
 poland.15.a:0 "Pekala."
 poland.15.b:0 "Kesinlikle hayır!"
 poland.15.d:0 "Bugün [Root.GetLeader]'in masasına [From.GetAdjective] Başkanından çok endişe verici bir telgraf geldi; bu telgrafta [LIT.GetNameDef]'in sadece eski başkent Vilnius üzerindeki iddiasından vazgeçmesi değil, aynı zamanda silahlarını bırakıp tüm topraklarını [From.GetAdjective] devletine devretmesi talep ediliyor. [From.GetNameDefCap], [Root.GetNameDef]'in başlangıcından beri uzun süredir ölü olan Commonwealth'i restore etmeye çalışıyor ve görünüşe göre şimdi başka bir savaş tehdidinin bile [Root.GetLeader]'in çökmesine neden olacağına inanıyorlar."
 poland.15.d.notlit:0 "Bugün [Root.GetLeader]'in masasına [From.GetAdjective] Başkanından çok endişe verici bir telgraf geldi; bu telgrafta [Root.GetNameDef]'in silahlarını bırakıp tüm topraklarını [From.GetAdjective] devletine devretmesi talep ediliyor. [From.GetNameDefCap], [Root.GetNameDef]'in başlangıcından beri uzun süredir ölü olan Commonwealth'i restore etmeye çalışıyor ve görünüşe göre şimdi uluslarımız arasında bir savaş tehdidinin bile [Root.GetLeader]'in çökmesine neden olacağına inanıyorlar."
 poland.15.t:0 "[From.GetNameDefCap], [Root.GetAdjective] İlhakını Talep Ediyor!"
 poland.1501.a:0 "Commonwealth yeniden doğdu!"
 poland.1501.d:0 "Bugün [Root.GetNameDef] için büyük bir kutlama günü, çünkü [From.GetAdjective] ordusu silahlarını bıraktı ve [Root.GetAdjective] askerlerinin başkente yürümesine ve [Root.GetNameDef] ile [From.GetNameDef]'in yeniden birleştiğini ilan etmesine izin verdi! Yeniden doğan bir Commonwealth, [Root.Capital.GetName] sokakları [Root.GetAdjective] ve [From.GetAdjective] bayraklarını birlikte sallayan erkekler ve kadınlarla dolu, ancak bu tür kutlamalar [From.GetAdjective] başkentinde görülemiyor, orada insanlar garip bir şekilde kasvetli ve yaslı görünüyor."
 poland.1501.t:0 "[From.GetNameDefCap] Kabul Ediyor!"
 poland.1502.a:0 "[Root.GetNameDef] ve [From.GetNameDef] bir olacak!"
 poland.1502.d:0 "Bugün [From.GetAdjective] yüksek komutanlığından, tüm [Root.GetAdjective] taleplerini açıkça reddeden ve “[Root.GetLeader]'in [From.GetAdjective] egemenliğini çiğnemesine izin vermeyeceklerini” iddia eden bir yanıt geldi. Birçokları [From.GetNameDef] ile başka bir savaş durumuna girmek istemese de, eğer [Root.GetLeader] yakında yanıt vermezse, gelecekteki [Root.GetAdjective] taleplerinin ciddiye alınması pek olası değil."
 poland.1502.t:0 "[From.GetNameDefCap] Meydan Okuyor!"
 poland.16.a:0 "Elbette!"
 poland.16.b:0 "Polonyalılarla ittifak kurmak için bir neden görmüyorum."
 poland.16.t:0 "[From.GetNameDefCap] Bizi Międzymorze'ye Davet Ediyor"
 poland.17.a:0 "Güçlü bir hükûmeti sürdür."
 poland.17.b:0 "Sosyal reformu yürürlüğe koy."
 poland.17.d:0 "Walery Sławek nihayet [Root.GetNameDef]'de hükûmet başkanı olarak yerini restore etmeyi başardı ve [Root.GetLeader]'i hükûmet içinde daha danışman bir role itti. Ancak, birçok kişi Sławek'in gerçek siyasi eğilimlerinden sık sık emin olamadı. Bazıları onun reform arayan bir sosyalist olduğuna inanırken, eleştirmenlerinin çoğu onun [Root.GetLeader] veya Rydz-Śmigły'den farklı olmayan başka bir otoriter olduğuna inanıyor. Şimdi nihayet hükûmet başkanı olduğuna göre, Sławek Polonya anayasasını bir kez daha değiştirirken bu soruları sona erdirebilir."
 poland.17.t:0 "Sanation Solunun Zaferi"
 poland.18.a:0 "Diktatörlüğümüz tamamen tarafsızdır."
 poland.18.b:0 "Falanjistleri hükûmete davet et."
 poland.18.d:0 "Edward Rydz-Śmigły ve Sanation Sağındaki takipçileri uzun süredir [Root.GetNameDef]'in arkasındaki gerçek güçtü, ancak [Root.GetLeader]'in Ulusal Birlik Kampı'nı kabul etmesiyle, Rydz-Śmigły'nin fiili gücü nihayet meşrulaştırıldı. Falanjistlerle olan yakın bağlarıyla, bazıları [Root.GetNameDef]'in siyasi çeperlerin aşırı sağıyla çok fazla flört ettiğinden ve Rydz-Śmigły'nin faşist sempatilerinin sonunda [Root.GetNameDef]'i eski müttefiklerinden diplomatik olarak izole edebileceğinden endişe ediyor."
 poland.18.t:0 "OZN'nin Zaferi"
 poland.19.a:0 "Spoczywaj w pokoju."
 poland.19.d:0 "“Hayatıma son veriyorum. Lütfen kimseyi suçlamayın. Tüm özel kağıtları ve bana emanet edilenleri yaktım. Eğer hepsi değilse, lütfen beni affedin. Yüce Tanrı belki de bu sonuncusu da dahil olmak üzere günahlarımı affeder.” Bu not ve bir ateşli silah, dün akşam tam 8:45'te Walery Sławek'in cesedinin yanında bulundu. Piłsudski Askeri Hastanesi'ndeki en usta ve yetenekli doktorlar Sławek'in vücudunun kanamasını durduramadı ve eski Başbakan bu sabah ölü ilan edildi. Notunun yanında sadece [Root.GetLeader]'in gözleri için bir mektup vardı ve içeriği ile Sławek'in bu en şok edici eyleminin nedeni bir sır olarak kalsa da, [Root.Capital.GetName]'deki her erkek ve kadının dilinde spekülasyonlar var. Birçoğu, Sanation Solunun devam eden marjinalleşmesinin ve Sławek'in giderek artan izolasyonunun melankolisine büyük katkıda bulunan faktörler olduğundan şüpheleniyor ve Sol'un en etkili liderinin ölümü şüphesiz birçok kişiyi cesaretsiz ve kaybolmuş hissettirecektir."
 poland.19.t:0 "Walery Sławek'in İntiharı"
 poland.20.a:0 "Lanet olsun!"
 poland.20.b:0 "Mükemmel!"
 poland.20.c:0 "Mükemmel!"
 poland.20.d:0 "Nie ma wolności bez Solidarności!"
 poland.20.desc.a:0 "Son dört yılda neredeyse hiç yatırım yapılmaması, birçok kişinin Dört Yıllık Planı tam bir başarısızlık olarak ilan etmesine yol açtı. Doğu Polonya yoksul çiftçilerin yalıtılmış bir bölgesi olarak kalmaya devam ediyor, sözde ‘merkezi sanayi bölgesi’ birkaç acınası fabrika ve tren istasyonundan başka bir şey değil ve Polonya sanayisi ulus için bir utanç kaynağı. Finans uzmanları, Dört Yıllık Planın mutlak başarısızlığının gelecekteki Polonya sanayi çabaları için kalıcı bir zarar olacağından emin."
 poland.20.desc.b:0 "Mütevazı yatırımlarla, Polonya sanayi sektörünün geleceği parlak görünüyor, ancak hala Batı ve Doğu'daki komşularının fersah fersah gerisinde. [Root.GetLeader]'in vaat ettiği devasa sanayi girişimi olmasa da, hükûmet tarafından yapılan yatırımlar bir sonraki Dört Yıllık Plan için büyük fayda sağlayacaktır!"
 poland.20.desc.c:0 "Raylarda bir lokomotifin tiz çığlığı, havada is ve dumanın keskin kokusu, gözleri yakan sanayinin keskin sisi, bunlar ilerlemenin hisleridir. Bugün Polonya'nın merkezi bölgesine varmak, bir sanayi ve ilerleme dünyasına varmaktır. Fabrikalar, yollar, demiryolları, lokomotifler, otomobiller, Polonya devleti nihayet hepsini başardı. Polonya'nın Kongre, Büyük ve Doğu bölgeleri artık sıkı bir yol ve demiryolu ağıyla birbirine bağlandığı için, Polonya nihayet tek bir sanayi varlığı olarak birleşti ve Kwiatkowski'nin Dört Yıllık Planı nihayet bir başarı olarak adlandırılabilir. Bu, Polonya sanayi yatırımları için son anlamına gelmese de, sanayileşme programının ezici başarısı Polonya halkına istikrar ve istihdam sağladı ve birçok kişi Polonya devletinin dayanacağı gelecekteki zorluklara hazır hissediyor."
 poland.20.e:0 "Mükemmel!"
 poland.20.f:0 "Lanet olsun!"
 poland.20.t:0 "Dört Yıllık Plan Tamamlandı!"
 poland.21.a:0 "Gdansk, Danzig olarak kalacak!"
 poland.21.b:0 "Karışmamalıyız."
 poland.21.d:0 "[DNZ.GetNameDef] sokaklarında savaş yanarken, [DNZ.GetLeader], [POL.GetLeader]'in kuvvetlerine karşı güçlü duruyor, ancak açıkça tek bir şehir tüm [POL.GetNameDef]'in kuvvetlerinin saldırısına dayanamaz. [Root.GetRulingParty] partisinin bir üyesi olarak, [DNZ.GetLeader], [Root.GetLeader]'e karşı sorumludur ve bir [DNZ.GetAdjective] yenilgisi kabul edilemez olurdu. [GER.GetNameDefCap], [DNZ.GetNameDef]'in savunucusu olarak savaşa girebilir ve savunucu gibi görünürken şehri ele geçirmek için eşsiz bir fırsat sunabilir…"
 poland.21.t:0 "[DNZ.GetNameDef], [GER.GetNameDef] ile Entegrasyon Arıyor"
 poland.2101.a:0 "Başka seçeneğimiz yok."
 poland.2101.b:0 "Danzig, Danzig olarak kalacak!"
 poland.2101.d:0 "Almanya'nın [GER.GetRulingParty] partisi, [Root.GetNameDef]'in [From.GetNameDef] tarafından daha doğrudan kontrolü karşılığında Polonyalılara karşı mücadelemizi desteklemeyi teklif etti."
 poland.2101.t:0 "[From.GetNameDefCap] Destek Teklif Ediyor!"
 poland.2102.a:0 "Reich'a hoş geldiniz."
 poland.2102.b:0 "Belki de biraz özerkliği hak ediyorlar."
 poland.2102.d:0 "[DNZ.GetLeader], [POL.GetNameDef]'e karşı kullanışlı bir araç olduğunu kanıtladı, ancak özerk bölge uzun zamandır kullanışlılığını yitirdi ve [DNZ.GetLeader]'in kaderi, [Root.GetNameDef] ile yakından bütünleşmiş olan Reichsgau Danzig-Batı Prusya'nın Gauleiter'ı olmaktır."
 poland.2102.t:0 "Danzig'in İlhakı"
 poland.22.a:0 "En azından denedik."
 poland.22.b:0 "Bu savaş, ben öyle ilan edene kadar bitmedi!"
 poland.22.d:0 "Bu savaş yeterince uzun sürdü ve hatta hain [DNZ.GetLeader] bile [POL.GetNameDef] ile barış istiyor. Gdynia bile [DNZ.GetAdjective] kontrolü altındayken, birçokları Özgür Şehir ile savaşta kalarak kazanacağımızdan daha fazlasını riske attığımızdan endişe ediyor. Şehir kaçınılmaz olarak [GER.GetAdjective] kontrolüne girecek olsa da, bu çatışmaya daha fazla devam etmeyi göze alamayız."
 poland.22.t:0 "[DNZ.GetNameDefCap] Barış Teklif Ediyor"
 poland.23.a:0 "Bu bizi uzun süre geciktiremez."
 poland.23.d:0 "[Root.GetAdjective] birlikleri [poland_state_withdrawn.GetName]'e ilerleyip demiryolları ve sanayinin kontrolünü ele geçirmeye başlarken, şok edici bir şekilde her şey patlamak üzere patlayıcı malzeme ile donatılmıştı. Açıkça [POL.GetAdjective] ordusu tarafından geride bırakılmış bir tuzak, [POL.GetAdjective] sanayisini ele geçirmeye çalıştığımız her seferinde bunun olmasını bekleyebiliriz."
 poland.23.t:0 "[poland_state_withdrawn.GetName]'de Sanayi Sabote Edildi"
 poland.24.a:0 "Köylüler isyan ediyor!"
 poland.24.d:0 "Doğu'da gerilimler doruğa ulaştı. Polis, bu protestocularla başa çıkmak için Doğu'ya konuşlandırıldı, ancak memurların vahşeti halk arasında isyan ateşini körüklemekten başka bir işe yaramıyor.\n\nEğer bu krizi bir an önce çözmezsek, bir iç savaşla karşı karşıya kalabiliriz. Köylü Partisi lideri Stanisław Mikołajczyk tarafından düzenlenen grev, Polonya hükûmetine karşı demokratlar, sosyalistler ve komünistlerden oluşan bir koalisyon oluşturdu ve görmezden gelinirse bir isyanı kışkırtacaktır."
 poland.25.a:0 "Sanation ile bağı olmayan bir vatansever."
 poland.25.b:0 "Bir lejyonere ihtiyacımız var."
 poland.25.c:0 "Bu, Polonya demokrasisini restore etme şansımız."
 poland.25.d:0 "[hosting_country_target.GetNameDef]'in sürgündeki [Root.GetAdjective] hükûmetini ağırlama sözüne rağmen, [hosting_country_target.GetLeader], [Root.GetLeader]'in derhal [Root.GetNameDef] Başkanı olarak [Root.GetLeader.GetHerHis] pozisyonundan istifa etmesini talep etti. Teslimiyet ve sürgün kaosunda, [Root.GetLeader] zaten Avrupa'da tarafsız bir ülkeye kaçtı ve [Root.GetAdjective] hükûmetinden geriye kalan az sayıdaki sürgüne, anavatanı geri alma mücadelesini kimin yöneteceğine karar verme görevi kaldı."
 poland.25.t:0 "[hosting_country_target.GetNameDefCap], [Root.GetLeader]'in İstifasını Talep Ediyor!"
 poland.26.a:0 "Bu hainleri toplamalıyız."
 poland.26.d:0 "[Root.GetAdjective] işgali altındaki Polonya'da yeraltında bir devrimin demlendiğine dair fısıltılar var. Şehir duvarlarına “Niech żyje opór!” ve benzeri sloganlar yapıştırılmış, direnişi [Root.GetAdjective] işgaline karşı savaşmaya çağırıyor. Şimdiye kadar, direniş faaliyetleri propaganda dağıtımı, üretim hatlarının bozulması ve ara sıra bombalama ve sabotajla sınırlıydı, ama şimdi direniş garip bir şekilde sessiz ve Polonya'daki atmosfer ihanet ve güvensizlikle dolu.\n\nPolonya genelindeki [Root.GetAdjective] ajanları, sürgündeki [POL.GetAdjective] hükûmeti tarafından desteklenen tam ölçekli bir isyan öngörüyor. Sadece direnişe baskı uygulayarak [Root.GetNameDef], Polonya üzerinde bir kontrolü sürdürmeyi umabilir."
 poland.26.t:0 "Devrim Fısıltıları"
