 JAP_kodoha_insurgency_decisions:0 "İmparatorluk Yolu"
 JAP_kodoha_insurgency_decisions_desc:0 "İmparatorluk Ordumuz içindeki bir hizip olan Kōdōha, Ağustos 1935'te askeri subay Tetsuzan Nagata'yı öldürmelerinin de kanıtladığı gibi şu anda düşmanlarına karşı harekete geçmiş durumda. Daha büyük ölçekte harekete geçmeye karar verirlerse, bu, subayları Aizawa'nın davası bitene kadar olmayacaktır. Kokutai'yi, ulusumuzun ruhunu tehdit ettiğini iddia ettikleri belirli kişilerin etrafındaki güvenliği artırmak en iyisi olabilir."
 JAP_kwantung_army_decisions:0 "Kwantung Ordusu"
 JAP_kwantung_army_decisions_desc:0 "Mançurya ve Çin'de faaliyet gösteren güçlerimiz, Kantō-gun, şu anda oldukça özerk hareket ediyor ve üst emir onayı olmadan harekete geçmeleriyle biliniyor. Başlangıçta Kwantung kiralanan bölgesinin güvenlik gücü olarak faaliyet göstermek üzere oluşturulan bu güç, şimdi orijinal boyutlarını çok aştı ve durumu sıkı bir şekilde kontrol altına almazsak bizi büyük ölçekli bir çatışmaya sürükleyebilirler."
 JAP_kwantung_army_impatience:0 "Kwantung Ordusu Sabırsızlanıyor"
 JAP_kwantung_army_impatience_desc:0 "Kwantung Ordusu, Çin'deki mevcut statükodan hızla sıkılıyor ve işler böyle devam ederse hükümetin onayı olmadan hakimiyet alanlarını genişletme yollarına devam etmeleri muhtemel görünüyor."
