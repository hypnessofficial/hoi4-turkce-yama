l_english:
 CZE_access_to_the_sea:0 "Denize Erişim"
 CZE_access_to_the_sea_desc:0 "Artık karayla çevrili değiliz! Artık bir sahil şeridimiz olduğuna göre, denizcilik konularını incelemeli ve bir Donanma kurmak için bir plan yapmalıyız."
 CZE_aggressive_wars:0 "Saldırı Savaşları"
 CZE_aggressive_wars_desc:0 "Faşizmin zaferiyle, iktidara yükselişimiz başlayabilir!"
 CZE_air_is_our_sea:0 "Hava Bizim Denizimizdir"
 CZE_air_is_our_sea_desc:0 "Diğer uluslar sınırlarını korumak ve güç yansıtmak için bir donanmaya güvenir, bizim için bu rolü hava kuvvetlerimiz yerine getirir."
 CZE_an_entente_of_our_own:0 "Kendi İtilafımız"
 CZE_an_entente_of_our_own_desc:0 "'Küçük İtilaf' son yıllarda geçerliliğini yitirdi, ancak eski müttefiklerimiz istekliyse yeniden canlanabilir."
 CZE_armour_bonus_1:0 "LT vz. 38"
 CZE_armour_bonus_1_desc:0 "Ordumuz dünyanın en gelişmiş tanklarından bazılarına sahip, ancak bu alandaki teknoloji hızla ilerliyor ve geride kalmayı göze alamayız."
 CZE_armour_bonus_ii:0 "Zırh Modernizasyonu"
 CZE_armour_bonus_ii_desc:0 "Askeri Teknik Enstitü, yeni ve daha iyi tanklar tasarlamak için Skoda Fabrikaları ile yakın çalışmaya devam ediyor."
 CZE_arms_exports_1:0 "Silah İhracatı"
 CZE_arms_exports_1_desc:0 "Skoda Fabrikaları uzun zamandır Avrupa çapında büyük silah tedarikçileri olmuştur ve ulusumuzun tek başına gerektirdiğinden çok daha yüksek bir ölçekte silah üretmektedir. Bu kadar büyük ölçekli üretim, çok az başka üreticinin hayal edebileceği üretim verimliliklerine yol açar."
 CZE_arms_exports_2:0 "İhracat Sübvansiyonları"
 CZE_arms_exports_2_desc:0 "Savaş tehdidi belirirken, giderek daha fazla ulus tank satın almak istiyor. Krediler için hükümet garantileri ve diğer önlemler, diğer ülkeleri Çekoslovakya'dan satın almaya teşvik edebilir ve ölçek ekonomilerini daha da geliştirebilir."
 CZE_arms_exports_3:0 "Eşit Erişim Garantisi"
 CZE_arms_exports_3_desc:0 "Silah talebi tüm zamanların en yüksek seviyesinde ve üretim hatlarımızın çıktısı da öyle. Silah satışlarını desteklemek için, parası olan herkese satacağımızı kamuoyuna ilan edebiliriz - ve sonra parayı kendi yeniden silahlanmamıza yatırmak için kullanabiliriz."
 CZE_balanced_1:0 "Dengeli Sanayi Yatırımları"
 CZE_balanced_1_desc:0 "Çekler ve Slovaklar arasındaki gerilimleri azaltma çabasıyla, gelecekteki endüstriyel büyümenin, genel olarak daha az verimli olmasına rağmen, ülkenin kendi ilgili kısımları arasında eşit olarak bölünmesi önerildi."
 CZE_balanced_2:0 "Ortak Çek-Slovak Planlama Komisyonu"
 CZE_balanced_2_desc:0 "Ulusun her iki bölümünden politikacılardan oluşan birleşik bir organ oluşturarak, herkesin ulusumuzun endüstriyel büyümesinden eşit olarak pay almasını sağlayabiliriz."
 CZE_balanced_3:0 "Yerel Uzmanlaşma"
 CZE_balanced_3_desc:0 "Ülkenin tüm bölgelerinin sanayisine yapılan sürekli yatırımla, bazı alanlar belirli mal ve hizmetlerde uzmanlaşmaya başladı. Bunu daha da teşvik edebiliriz."
 CZE_battleship_catchup_1:0 "Zırhlı Atılımı"
 CZE_battleship_catchup_1_desc:0 "Donanmaya olan yeni ihtiyacımız, ani bir Zırhlı tasarım telaşıyla sonuçlandı."
 CZE_beacon_of_liberty:0 "Özgürlük Meşalesi"
 CZE_beacon_of_liberty_desc:0 "Demokrasiye olan bağlılığımız hem kendi vatandaşlarımızı hem de daha baskıcı rejimlerden kaçmak zorunda kalanları ilham veriyor."
 CZE_bonus_research_slot_1:0 "Çek Teknik Üniversitesi"
 CZE_bonus_research_slot_1_desc:0 "Savaş yaklaşırken, pratik teknolojiye daha fazla odaklanmak bize iyi gelecektir."
 CZE_bonus_research_slot_2:0 "Bilgi Paylaşım Ekipleri"
 CZE_bonus_research_slot_2_desc:0 "Müttefik bilgi paylaşımı o kadar büyük faydalar sağladı ki şimdi kalıcı bir kurum olarak önerildi."
 CZE_capital_focus:0 "Ana Gemi Odağı"
 CZE_capital_focus_desc:0 "Donanmamız doğrudan ve kesin savaşlara odaklanmalıdır."
 CZE_cas_focus:0 "Yakın Hava Desteği Odağı"
 CZE_cas_focus_desc:0 "Askeri Havacılık Enstitüsü'nün testlerinin sonucu, Yakın Hava Desteği uçaklarına odaklanmamız gerektiğini göstermektedir."
 CZE_communism_with_a_human_face:0 "İnsan Yüzlü Komünizm"
 CZE_communism_with_a_human_face_desc:0 "Komünist Parti şemsiyesi altında halkın yerel ve ülke siyasetine daha fazla katılımını talep ederek, Komünizm ideallerine yeni bir soluk getireceğiz."
 CZE_communist_support:0 "Komünist Destek"
 CZE_communist_support_desc:0 "Sola kayışımız ivme kazanıyor. Komünizme destek ülke çapında artıyor ve arkasına daha fazla hükümet desteği attıkça bu oran sadece artacak."
 CZE_cruiser__catchup_1:0 "Kruvazör Atılımı"
 CZE_cruiser__catchup_1_desc:0 "Donanmaya olan yeni ihtiyacımız, ani bir Kruvazör tasarım telaşıyla sonuçlandı."
 CZE_czech_fascism:0 "Çek Faşizmi"
 CZE_czech_fascism_desc:0 "Faşizme destek ülke çapında artıyor ve Faşistlerin eline daha fazla güç geçtikçe direnen muhaliflere daha fazla baskı uygulanabilir."
 CZE_czech_socialism:0 "Çek Sosyalizmi"
 CZE_czech_socialism_desc:0 "Merkezi kontrol kesinlikle ekonomi için harikadır, ama belki de iyi bir şeyin fazlası olabilir. Hem Çek hem de Slovak sovyetlerine hafifçe ademimerkeziyetçilik uygulayarak, daha büyük bir genel birlik hakim olabilir!"
 CZE_czechoslovak_legion:0 "Çekoslovak Lejyonu"
 CZE_czechoslovak_legion_desc:0 "Çekoslovak Lejyonu, Büyük Savaş sırasında Avrupa'nın her yerinde ve iç savaşları sırasında Rusya'nın derinliklerinde savaştı. Şimdi, Avrupa genelinde çatışma yayılırken Lejyon bir kez daha yürüyebilir."
 CZE_deal_with_bulgaria:0 "Bulgaristan'ı Dağıt"
 CZE_deal_with_bulgaria_desc:0 "Bulgaristan yeniden silahlandı ve yine Balkanların güvenliğini tehdit ediyor. Eğer İtilaf Avrupa'da genel bir çatışmaya odaklanacaksa, bu tolere edilemeyecek bir tehdittir."
 CZE_deal_with_hungary:0 "Macar Tehdidini Ortadan Kaldır"
 CZE_deal_with_hungary_desc:0 "Avrupa genelinde barış bozulurken, İtilaf Macaristan'ın tekrar bir tehdit haline gelmesine izin veremez. Sadece kalıcı bir çözüm, elimizdeki daha büyük sorunlara odaklanmamızı sağlayabilir."
 CZE_defensive_preparations:0 "Savunma Hazırlıkları"
 CZE_defensive_preparations_desc:0 "İstesek de istemesek de savaşın geleceği kesin gibi görünüyor. Bu nedenle, ona hazırlıklı olmamız en iyisidir."
 CZE_deliver_sudetenland:0 "Sudetenland'ı Teslim Et"
 CZE_deliver_sudetenland_desc:0 "Almanya bizim Almanlarımızı istiyor. Görünüşe göre savaştan kaçınmak istiyorsak tek yol Sudetenland'ı teslim etmek."
 CZE_democratic_bastion:0 "Demokratik Kale"
 CZE_democratic_bastion_desc:0 "Çekoslovakya, Orta Avrupa'da bir demokrasi kalesidir ve ne olursa olsun öyle kalacaktır!"
 CZE_destroyer_catchup_1:0 "Muhrip Atılımı"
 CZE_destroyer_catchup_1_desc:0 "Donanmaya olan yeni ihtiyacımız, ani bir Muhrip tasarım telaşıyla sonuçlandı."
 CZE_doctrinal_innovation:0 "Doktrinsel Yenilik"
 CZE_doctrinal_innovation_desc:0 "Subay değişimlerinden ve müttefiklerimizle yapılan strateji oturumlarından çok şey öğrendik. Bu kadar farklı bakış açılarını birleştirmek bizi bir atılımın eşiğine getirdi."
 CZE_doctrine_bonus:0 "Doktrin Keşifleri"
 CZE_doctrine_bonus_2:0 "Yenilikçi Savaş"
 CZE_doctrine_bonus_2_desc:0 "Silahlar tek başına bir orduyu güçlü kılmaz, etkili doktrinler de gereklidir. Askeri Teknik Enstitü bunun farkındadır ve birkaç öneride bulunmuştur."
 CZE_doctrine_bonus_desc:0 "Silahlar tek başına bir orduyu güçlü kılmaz, etkili doktrinler de gereklidir. Askeri Teknik Enstitü bunun farkındadır ve birkaç öneride bulunmuştur."
 CZE_exclude_the_slovaks:0 "Çek Konsolidasyonu"
 CZE_exclude_the_slovaks_desc:0 "Ülkemizin kurulduğu günden beri Slovaklar hoşnutsuz. Her zaman daha fazla siyasi güç arayışındalar, her zaman ulusal kaynaklardan adil paylarından fazlasını talep ediyorlar. Artık Yeter! Bundan sonra güç Çeklerin elinde toplanacak. §RBu iç savaşa yol açacaktır.§!"
 CZE_faction_tech_sharing:0 "Organizasyon Paktı"
 CZE_faction_tech_sharing_desc:0 "İyi bir şekilde birlikte çalışabilmek için, İtilaf orduları benzer bir seviyede donatılmalıdır. Bunu başarmak için, ittifakımızın tüm üyelerinin teknolojilerini birbirleriyle özgürce paylaşmalarını öneriyoruz."
 CZE_fallback_line:0 "Geri Çekilme Hatları İnşa Et"
 CZE_fallback_line_desc:0 "Sınır tutulamazsa, batıdan herhangi bir saldırı ana yurdumuza ulaşmadan önce geri çekilecek ikinci bir tahkimat hattına sahip olmak iyi olur."
 CZE_favor_czechs_1:0 "Çek Sanayisi"
 CZE_favor_czechs_1_desc:0 "Ulusumuzda Çekler ve Slovaklar arasında her zaman bir gerilim olmuştur, en azından sanayi gücümüzün çoğunun Bohemya ve Moravya'nın Çek illerinde yoğunlaşması nedeniyle. Bununla birlikte, bu sanayi gücü, Slovakları daha da üzebilecek olmasına rağmen, bu bölgelerde daha fazla fabrika inşa etmeyi çok daha kolaylaştırır."
 CZE_favor_czechs_2:0 "Endüstriyel Kalpgahlar"
 CZE_favor_czechs_2_desc:0 "Bohemya ve Moravya'ya odaklanan daha fazla yatırım, sanayimizi daha geniş bir yaklaşımdan çok daha fazla geliştirecektir."
 CZE_favor_czechs_3:0 "Yeni Sanayi Kasabaları"
 CZE_favor_czechs_3_desc:0 "Bohemya ve Moravya'daki eski sanayi bölgelerini geliştirdikten sonra, şimdi büyüyen sanayilerimiz için işçileri barındıracak yeni kasabalar inşa etme zamanı."
 CZE_fortification_studies:0 "Tahkimat Çalışmaları"
 CZE_fortification_studies_desc:0 "Sınırımızı tahkim etme ihtiyacı açık, ama soru nasıl? Fransızlar son zamanlarda kendi inanılmaz müstahkem hatlarını, Maginot Hattı'nı inşa ettiler ve yöntemlerini incelemek için bir heyet göndererek kendi sınır savunma sorunlarımızı çözmek mümkün olmalı."
 CZE_german_ally:0 "Değerli bir Alman Ortağı"
 CZE_german_ally_desc:0 "Almanya, zafer yolunda bir yoldaş olan bir Faşist güçtür. Birlikte dünyayı Prag-Berlin Ekseni etrafında döndüreceğiz!"
 CZE_german_leanings:0 "Alman Yatıştırma Politikası"
 CZE_german_leanings_desc:0 "Almanya'nın gücü yükseliyor ve belirtilen hedefleri tüm Almanca konuşan halkı tek bir Reich içinde birleştirmek. Önemli bir Alman azınlığa sahip bir ulus olarak, bunlar endişe verici gelişmeler. Kendi güçlü müttefiklerimizi güvence altına alamazsak, Almanya'nın gözüne girmekten fayda görebiliriz."
 CZE_german_minor_ally:0 "Bir Alman Uydusu"
 CZE_german_minor_ally_desc:0 "Almanya yükselen bir güç, zafer için takip edebileceğimiz bir güç. Almanya nereye giderse, biz de takip edecek ve yolda hedeflerimizi toplayacağız."
 CZE_german_minor_ally_tt:0 "Alman teknolojisini lisanslamak için bonuslar veren ancak aynı zamanda Almanya'ya ülkemiz üzerinde hakimiyet veren bir Alman Uydusu ol."
 CZE_german_puppet:0 "Bir Alman Himayesi"
 CZE_german_puppet_desc:0 "Almanya yatıştırılamaz, bize hükmedene kadar durmayacaklar. Ve yine de, belki diz çökerek biraz özerklik koruyabiliriz?"
 CZE_german_technology:0 "Alman Teknolojisi"
 CZE_german_technology_desc:0 "Uluslarımız arasında barışçıl ilişkiler artık güvence altına alındığına göre, karşılıklı teknoloji alışverişinin her iki tarafa da fayda sağlayabileceği öne sürüldü."
 CZE_go_left:0 "Tek Bir İrade Altında Birleşmiş Halk"
 CZE_go_left_desc:0 "Komünizm gelecektir! Tüm çabalar, hükümetimizi ve toplumumuzu Marksist idealleri takip edecek şekilde yeniden şekillendirmeye yönlendirilmelidir."
 CZE_go_right:0 "Ulusal Faşist Ligi Güçlendir"
 CZE_go_right_desc:0 "Çek halkı ancak Faşizm altında büyüklüğe ulaşabilir! Avrupa'da demokrasi yok olmaya mahkumdur ve zayıf devletler bölüşülürken müzakere masalarında sadece güçlü uluslar, faşist uluslar yer alacaktır!"
 CZE_healing_a_divided_nation:0 "Bölünmüş Bir Ulusu İyileştirmek"
 CZE_healing_a_divided_nation_desc:0 "Ulusumuzun halkı artık biliyor ki özgürlükleri söz konusu olduğunda kelimelerimiz eylemlerle destekleniyor. Nihayet ulusumuzu derinden bölen yaraların bir kısmını iyileştirebiliriz."
 CZE_heavy_fighter_focus:0 "Ağır Avcı Uçağı Odağı"
 CZE_heavy_fighter_focus_desc:0 "Askeri Havacılık Enstitüsü, Ağır Avcı Uçaklarının en kullanışlı olduğu ve hava kuvvetlerimizin çekirdeğini oluşturması gerektiği sonucuna varmıştır."
 CZE_hungarian_line:0 "Macar Hattı"
 CZE_hungarian_line_desc:0 "Macar irredantizmi ulusumuza sürekli bir tehdittir, ortak sınırımız boyunca bir tahkimat sistemi güvenliğimizi sağlamaya yardımcı olacaktır."
 CZE_hungarian_situation:0 "Macaristan Durumu"
 CZE_hungarian_situation_desc:0 "Macaristan uzun zamandır başımıza bela olmuştur, ancak arkamızdaki Faşizmin tam gücüyle Macaristan'ın zamanı sona erdi."
 CZE_import_foreign_bombers:0 "Yabancı Bombardıman Uçakları İthal Et"
 CZE_import_foreign_bombers_desc:0 "Çeşitli yabancı bombardıman uçaklarını test etmek ve değerlendirmek için ithal ederek, kendi uçak tasarımcılarımız değerli dersler öğrenecek."
 CZE_import_foreign_fighters:0 "Yabancı Avcı Uçakları İthal Et"
 CZE_import_foreign_fighters_desc:0 "Çeşitli yabancı avcı uçaklarını test etmek ve değerlendirmek için ithal ederek, kendi uçak tasarımcılarımız değerli dersler öğrenecek."
 CZE_industrial_legacy:0 "Büyük Bir Endüstriyel Miras"
 CZE_industrial_legacy_desc:0 "Skoda Fabrikaları, Avusturya-Macaristan'ın en büyük silah üreticisiydi ve bağımsızlığımızdan bu yana birçok sanayi alanında lider olmak için dallandılar. Hem uzmanlık hem de ağır sanayinin bu kadar yüksek bir konsantrasyonuna sahip olmak, tüm endüstriyel çabalara büyük ölçüde yardımcı olur."
 CZE_inf_and_artillery_advancement:0 "Piyade Gelişimi"
 CZE_inf_and_artillery_advancement_2:0 "Topçu Gelişimi"
 CZE_inf_and_artillery_advancement_2_desc:0 "Savaş alanının kraliçesi modern topçu, ordumuzda büyük bir güç çarpanı olacaktır."
 CZE_inf_and_artillery_advancement_desc:0 "Piyade ordumuzun en önemli birimidir, bu yüzden silahlarını geliştirmek başarılı bir ulusal savunmaya yönelik hayati bir adımdır."
 CZE_internal_redoubts:0 "İç Kaleler"
 CZE_internal_redoubts_desc:0 "Herhangi bir tahkimat sistemi kırılabilir. Bu olasılığa karşı korunmak için, en önemli şehirlerimizin etrafına güçlü noktalar inşa edebiliriz, böylece hatlarımızı yaran bir düşman tarafından kolayca ele geçirilemezler."
 CZE_invite_romania:0 "Romanya'yı Davet Et"
 CZE_invite_romania_desc:0 "Romanya'yı İtilaf'a davet et."
 CZE_invite_yugoslavia:0 "Yugoslavya'yı Davet Et"
 CZE_invite_yugoslavia_desc:0 "Yugoslavya'yı İtilaf'a davet et."
 CZE_join_comintern:0 "Komintern'e Katıl"
 CZE_join_comintern_desc:0 "Daha az ilerici eski müttefiklerimize artık güvenilemez. Faşist-Emperyalist saldırganlığa karşı güvenliğimizi sağlamak için SSCB ile bir ittifak imzalama zamanı geldi."
 CZE_light_fighter_focus:0 "Hafif Avcı Uçağı Odağı"
 CZE_light_fighter_focus_desc:0 "Askeri Havacılık Enstitüsü, Hafif Avcı Uçaklarının en kullanışlı olduğu ve hava kuvvetlerimizin çekirdeğini oluşturması gerektiği sonucuna varmıştır."
 CZE_mechanization:0 "Mekanizasyon"
 CZE_mechanization_desc:0 "Motorizasyon askerlerimize hız sunarken, mekanizasyon onlara hız, koruma ve ateş gücü sunar."
 CZE_military_aeronautical_institute:0 "Askeri Havacılık Enstitüsü"
 CZE_military_aeronautical_institute_desc:0 "Askeri Havacılık Enstitüsü, Çekoslovak hava kuvvetlerine araştırma ve tasarım önerileri sunar."
 CZE_military_research_institute:0 "Askeri Teknik Enstitü"
 CZE_military_research_institute_desc:0 "Askeri Teknik Enstitü, Çekoslovak silahlı kuvvetlerine askeri araştırma, geliştirme ve test yetenekleri sağlamak için vardır."
 CZE_motorization_scheme:0 "Motorizasyon Planı"
 CZE_motorization_scheme_desc:0 "Etraftaki en büyük orduya sahip olmasak da, motorizasyon kuvvetlerimizi bir bölgede daha hızlı bir şekilde yoğunlaştırma imkanı sunar."
 CZE_mountain_bonus:0 "Dağ Birlikleri"
 CZE_mountain_bonus_desc:0 "Sınırımızın büyük bir kısmı tepelerden ve dağlardan oluştuğunda, bu bölgeleri denetlemek ve savunmak için özel askerlere olan ihtiyaç açıktır."
 CZE_national_fascism:0 "Ulusal Faşizm"
 CZE_national_fascism_desc:0 "Çekler ve Slovaklar, Faşizm bayrağı altında tamamen birleşmiş durumda. Birlikte ileri yürüyoruz! Birlikte durdurulamazız!"
 CZE_nukes:0 "Nükleer Silahlar"
 CZE_nukes_desc:0 "Çek savaşının geleceği, parçalanmış atomun gücünde ustalaşmakta yatmaktadır!"
 CZE_polish_line:0 "Polonya Hattı"
 CZE_polish_line_desc:0 "Polonya saldırganlığı sınır tanımıyor, ama umarım iyi tahkim edilmiş bir sınır onların daha kolay bir hedef aramasına neden olur."
 CZE_political_direction:0 "Siyasi İklimi Değerlendir"
 CZE_political_direction_desc:0 "Demokrasimiz genç ve henüz güçlü bir şekilde test edilmedi. Avrupa çapında hem Faşizmin hem de Komünizmin yükselişiyle, şu soru sorulmalı: Bu doğru yön mü, yoksa değilse, ne?"
 CZE_raiding_focus:0 "Baskın Odağı"
 CZE_raiding_focus_desc:0 "Donanmamız, savaştan kaçınmanın ve düşmanlarımızın gemiciliğini taciz etmenin dolaylı yaklaşımına odaklanmalıdır."
 CZE_rapprochement_with_hungary:0 "Macaristan ile Yakınlaşma"
 CZE_rapprochement_with_hungary_desc:0 "Macar irredantizmi sürekli bir tehdittir, ama belki de sorunu barışçıl bir şekilde çözmek için son bir çaba daha gösterilebilir?"
 CZE_rule_the_air:0 "Göklere Hükmet"
 CZE_rule_the_air_desc:0 "Hava kuvvetlerine olan bağlılığımız, dikkate değer bir üretim verimliliği oluşturmamızı sağladı."
 CZE_secret_weapons:0 "Gizli Silahlar"
 CZE_secret_weapons_desc:0 "Çek savaşının geleceği, birden fazla ileri teknolojide ustalaşmak ve bunları en iyi avantajımıza kullanmakta yatmaktadır."
 CZE_security_council:0 "Müşterek Güvenlik Konseyi"
 CZE_security_council_desc:0 "İtilaf güvenlik konseyi, ortak askeri operasyonlar planlandığında tüm üyelerin koordine olmasını sağlayacaktır."
 CZE_shipbuilding_legacy:0 "Gemi İnşa Mirası"
 CZE_shipbuilding_legacy_desc:0 "Kendi donanmamıza sahip olmak yeni olsa da, Skoda Fabrikaları'nın Avusturya-Macaristan donanmasının gemileri için bileşenler inşa etme konusunda uzun bir geçmişi var. Şimdi aynı deneyimi kendi donanmamız için gemiler üretmek için kullanabilirler."
 CZE_strategy_decisions:0 "Stratejik Kararlar"
 CZE_strategy_decisions_desc:0 "Avrupa üzerinde bir fırtına toplanıyor, savaş tehdidi beliriyor, ama Çekoslovakya önündeki zorluklarla nasıl başa çıkacak?"
 CZE_sudden_shipyard:0 "Ani Tersane"
 CZE_sudden_shipyard_desc:0 "Bir Donanma bir tersane gerektirir. Bunu planlamamıştık, ama büyük mühendislik projeleri bizim için yeni bir şey değil. Doğru çabayla bir tersane hiç zaman almamalı."
 CZE_sudeten_1:0 "Sudetenland Erken Tahkimatları"
 CZE_sudeten_1_desc:0 "Dağlık Almanya sınırımız olan Sudetenland, sınır tahkimatları için mükemmel bir yerdir. Fransız Maginot hattını inceledikten sonra, kendi benzer bir hattımızı inşa edebiliriz."
 CZE_sudeten_2:0 "Sudetenland İleri Tahkimatları"
 CZE_sudeten_2_desc:0 "Sudetenland şimdi iyi bir savunma hattına sahip, ancak ulusal bekamız söz konusu olduğunda iyi yeterli değildir."
 CZE_sudeten_3:0 "Sudetenland Son Tahkimatları"
 CZE_sudeten_3_desc:0 "Sudetenland güçlü bir tahkimat sistemine sahip, ama yine de daha güçlü olabilirler!"
 CZE_support_bonus:0 "Destek Birimleri"
 CZE_support_bonus_desc:0 "Piyadelerimizin en yüksek verimlilikte performans göstermesi için destekleyici kolların da modernize edilmesi gerekir."
 CZE_tac_focus:0 "Taktik Bombardıman Uçağı Odağı"
 CZE_tac_focus_desc:0 "Askeri Havacılık Enstitüsü'nün testlerinin sonucu, Taktik Bombardıman Uçaklarına odaklanmamız gerektiğini göstermektedir."
 CZE_the_polish_division:0 "Polonya'nın Bölünmesi"
 CZE_the_polish_division_desc:0 "Polonya sadece yardıma ihtiyacımız olması durumunda Sovyet birliklerinin geçişini reddetmekle kalmıyor, aynı zamanda Zaolzie bölgesini kurtarmamızdan dolayı hala kin besliyor ve intikam peşinde olabilir. Önleyici bir savunma akıllıca olacaktır."
 CZE_the_polish_question:0 "Polonya Sorunu"
 CZE_the_polish_question_desc:0 "Polonyalılar Zaolzie için bizi asla affetmedi ve herhangi bir zayıflık gösterirsek şüphesiz üzerimize atlayacaklar. Çekoslovakya gibi büyük bir ulus neden bu tür bir tehdit altında acı çeksin? Artık Yeter! Kararlı adımlar atılmalı!"
 CZE_the_romanian_question:0 "Romanya Sorunu"
 CZE_the_romanian_question_desc:0 "Romanya, dostumuz ve koruyucumuz olan Sovyetler Birliği ile aramızda duruyor. Savunmamıza yardım etmek için Sovyet birliklerinin geçişine izin vermeyecekleri için, daha köklü bir çözüm düşünülmelidir."
 CZE_trust_in_the_west:0 "Batı'ya Güven"
 CZE_trust_in_the_west_desc:0 "Fransa ve Britanya Avrupa'da barışı koruyacaktır. Sonuçta, Büyük Savaş'ı yirmi yıl sonra Almanya'nın egemen ulusları tehdit etmesine ve parçalamasına izin vermek için kazanmadılar!"
 CZE_united_population:0 "Birleşik Nüfus"
 CZE_united_population_desc:0 "Dengeli sanayi büyüme politikamızla birleşen bir dizi son siyasi girişim, ülke çapında Çeklerin ve Slovakların amaç birliği içinde çok daha birleşik hissetmelerine yol açtı."
 CZE_war_college:0 "Harp Akademisi"
 CZE_war_college_desc:0 "Harp Akademisi, ordumuza zafere götürmesi gereken iyi eğitimli liderleri sağlar."
 CZE_war_college_effect_tt:0 "§YEğer zaten 5 araştırma yuvanız varsa fazladan bir tane almayacaksınız.§!\n"
 HUN_FACTION_COMMIE:0 "Komünist Sovyetler Birliği"
 HUN_GREATER_tt:0 "Adınızı §YBüyük Macaristan§! olarak değiştirin.\n"
 HUN_aeronautic_technology_institute:0 "Havacılık Teknolojisi Enstitüsü"
 HUN_aeronautic_technology_institute_desc:0 "Hava, savaşın yeni bir boyutu haline geldi ve birçokları tarafından önemi hafife alınıyor. Bu yeni boyutta ustalaşmayı öğrenmeli ve bunu yapmamızı sağlayacak yeni doktrinler ve teçhizatların geliştirilmesine kaynak ayırmalıyız."
 HUN_alliance_with_italy:0 "İtalya ile İttifak"
 HUN_alliance_with_italy_desc:0 "Roma Protokollerinde yapılan ittifaka yönelik ilk girişimler şimdi genişletilebilir. Hem savunma hem de saldırı amaçlı kapsamlı askeri işbirliği için bağlayıcı bir anlaşmayı görüşmek üzere İtalya'ya bir heyet göndereceğiz."
 HUN_an_unlikely_alliance:0 "Beklenmedik Bir İttifak"
 HUN_an_unlikely_alliance_desc:0 "Ülkemizi temelden değiştirdik. Artık eski savaş çığırtkanları değiliz. Eski düşmanımıza ulaşıp yeni bir kader dövme zamanı geldi - birlikte."
 HUN_announce_the_gyor_program:0 "Győri Programını Duyur"
 HUN_announce_the_gyor_program_desc:0 "Ordumuz tehlikeli bir şekilde zayıf ve büyüklüğünü ve savaş kabiliyetini artırmamız zorunludur. Bunu yapmak için, artan teçhizat taleplerine ayak uydurmak amacıyla sanayimizi önemli ölçüde güçlendirmeliyiz. Beş yıllık Györ Programı, sadece ordunun kendisine değil, aynı zamanda sanayi, tarım, altyapı ve eğitim gibi yan sektörlere de hükümet harcamalarını artıracaktır."
 HUN_armored_warfare:0 "Zırhlı Savaş"
 HUN_armored_warfare_desc:0 "Motorlu tümenlerimiz gerçekten etkili olabilmek için zırhlı desteğe ihtiyaç duyacaktır. Yeni zırh tasarımlarının geliştirilmesine daha fazla kaynak ayırmalıyız."
 HUN_army_maneuvers:0 "Ordu Manevraları"
 HUN_army_maneuvers_desc:0 "Ordumuz, olası gelecekteki silahlı çatışmalar için yeniden şekillendirilmelidir. Onları yeni taktikler ve stratejiler geliştirmeleri için manevralara göndereceğiz."
 HUN_artillery_effort:0 "Topçu Çabası"
 HUN_artillery_effort_desc:0 "Topçu, kuvvetlerimizin etkinliğini artırmak için anahtardır. Sağlayabileceğimiz en iyi topçu desteğine sahip olmaları için modern topçu modelleri geliştireceğiz."
 HUN_assassinate_horthy:0 "Horthy'ye Suikast Düzenle"
 HUN_assassinate_horthy_desc:0 "Eski Büyük Savaş amirali, Macaristan Krallığı Naibi olarak mevcut kapasitesinde çok fazla güç ve nüfuz sahibi ve komünizme karşı duruşu yoldaşlarımızın çabaları için oldukça sorun yaratıyor. Ulusumuzun Devrim'e giden yolu bulması için iktidardan uzaklaştırılmalıdır."
 HUN_assault_gun_focus:0 "Taarruz Topu Odağı"
 HUN_assault_gun_focus_desc:0 "Tam teşekküllü tanklara odaklanmak yerine, daha uygun maliyetli bir alternatif olarak, yarma harekatlarında piyademize yardım etmek için taarruz toplarına güveneceğiz."
 HUN_autarky:0 "Otarşi"
 HUN_autarky_desc:0 "Yabancı petrol kaynaklarına çok fazla bağımlıyız. Sentetik petrol geliştirmede Alman çabalarını taklit etmeliyiz."
 HUN_balanced_budget:0 "Dengeli Bütçe"
 HUN_balanced_budget_desc:0 "Elimizdeki kaynaklarla en iyisini yapmalıyız. İyi planlanmış ve dengeli bir bütçe, hükümetimizin başarısının anahtarıdır."
 HUN_bled_agreement:0 "Bled Anlaşması"
 HUN_bled_agreement_custom_effect_tooltip:0 "§HTrianon Antlaşması§!'nın değiştirilmesine yol açabilir."
 HUN_bled_agreement_desc:0 "Küçük ölçekli gizli yeniden silahlanma yeterli olmayacaktır. Komşularımıza ulaşmalı ve Büyük Savaş'tan sonra bize dayatılan antlaşmanın düzeltilmesini talep etmeliyiz. Macaristan'ın silahlanmaya eşit hakkı vardır."
 HUN_bomber_competition:0 "Bombardıman Uçağı Yarışması"
 HUN_bomber_competition_desc:0 "Lisans altında üretilecek en iyi bombardıman uçağı modelini seçebilmemiz için, yarışmacıları birbirine karşı yarıştırmalıyız. Bir bombardıman uçağı yarışması düzenleyeceğiz ve tüm büyük güçleri en modern bombardıman modellerini göndermeye davet edeceğiz."
 HUN_boost_hungarian_aviation_industry:0 "Macar Havacılık Sanayisini Güçlendir"
 HUN_boost_hungarian_aviation_industry_desc:0 "Hava hakimiyeti kazanmak için yeterli miktarda yeni uçak modellerinin üretilmesine olanak sağlamak amacıyla sanayi tabanımız güçlendirilmelidir."
 HUN_capital_ships:0 "Ana Muharebe Gemileri"
 HUN_capital_ships_desc:0 "Bir donanmanın çekirdeği zırhlıdır. Kaybedilen zamanı telafi etmeli ve mümkün olan en kısa sürede yeni gemilerin inşasına başlamalıyız."
 HUN_carriers:0 "Uçak Gemileri"
 HUN_carriers_desc:0 "Zırhlı, çoktan geçmiş bir zamanın kalıntısıdır. Deniz savaşının geleceği uçak gemisi ve uçaktır. Bu gelişmenin ön saflarında olacağız."
 HUN_cas_focus:0 "Yakın Hava Desteği Odağı"
 HUN_cas_focus_desc:0 "Modern bir ordu, sadece karada değil, havada da araçlardan destek almaya ihtiyaç duyar."
 HUN_civilian_industry:0 "Sivil Sanayi"
 HUN_civilian_industry_desc:0 "Daha fazla askeri sanayiye ihtiyaç duyulmasına rağmen, sivil ihtiyaçlarımızı ihmal etmemeliyiz. Bu nedenle sivil sanayinin genişletilmesi yerindedir."
 HUN_claim_galicia:0 "Galiçya'yı Talep Et"
 HUN_claim_galicia_desc:0 "Polonya devleti yapay bir yapıdan başka bir şey değildir. Gerektiğinde yaratılabilir ve sökülebilir."
 HUN_claim_overlordship_over_slovakia:0 "Slovakya Üzerinde Hakimiyet Talep Et"
 HUN_claim_overlordship_over_slovakia_desc:0 "Slovakya'nın geri kalanı da ya doğrudan ya da bir bağımlı devlet haline gelerek Macar devletine yeniden entegre edilmelidir. Başka bir ültimatom göndereceğiz."
 HUN_claim_the_bucovina:0 "Bukovina'yı Talep Et"
 HUN_claim_the_bucovina_desc:0 "Geniş topraklarımız arasında ekonomik olarak en önemli olanı olmayabilir, ama yine de İmparatorluğumuzun bir parçasıdır. Ve onu geri alacağız."
 HUN_claim_transylvania:0 "Transilvanya'yı Talep Et"
 HUN_claim_transylvania_desc:0 "Siebenbürgen bölgesi son savaştan sonra bizden haksız yere alındı. Onu geri almanın zamanı geldi."
 HUN_council_of_peoples_commissars:0 "Halk Komiserleri Konseyi"
 HUN_council_of_peoples_commissars_desc:0 "Macaristan'ın komünist bir devlete geçişini denetleyebilecek bir yönetim organı oluşturulmalıdır. Bu yapıldıktan sonra, bu Konsey Batı'daki bakanlardan oluşan bir kabine sisteminin benzeri olarak hizmet edecektir."
 HUN_cruisers:0 "Kruvazörler"
 HUN_cruisers_desc:0 "En güçlü kuvvet bile düşmanı bulamazsa veya kendini uçaklara karşı koruyamazsa işe yaramaz. Yeni hafif ve ağır kruvazörler tasarlamak, bir gemi koleksiyonunu gerçek bir filoya dönüştürmemize yardımcı olur."
 HUN_danuvia_submachine_guns:0 "Danuvia Hafif Makineli Tüfekleri"
 HUN_danuvia_submachine_guns_desc:0 "Piyademizin etkinliğini artırmak için iyi silahlara ihtiyacı var. İlk Danuvia 43M prototipleri testlerde iyi performans gösterdi ve geliştirmesi için fonları artırarak yakında silahı seri üretmeye başlayabiliriz."
 HUN_demand_a_referendum:0 "Referandum Talep Et"
 HUN_demand_a_referendum_desc:0 "Avusturya-Macaristan'ın dağılması bir hataydı. Avusturya ve Macaristan birlikte daha güçlüdür ve her ikisinin de büyüklüğe ulaşması için bir kombinasyon gereklidir. Avusturyalılar, iki ulusumuzun barışçıl bir şekilde birleşmesi önerisi üzerine bir referandum yapmaya zorlanmalıdır."
 HUN_demand_southern_slovakia:0 "Güney Slovakya'yı Talep Et"
 HUN_demand_southern_slovakia_desc:0 "Topraklarımızı kan dökmeden geri alabilirsek, o kadar iyi. Çekoslovakya'ya haklı topraklarımızın devredilmesini talep eden bir ültimatom verilecek."
 HUN_demand_the_vojvodina:0 "Voyvodina'yı Talep Et"
 HUN_demand_the_vojvodina_desc:0 "Topraklarımızı kan dökmeden geri alabilirsek, o kadar iyi. Yugoslavya'ya haklı topraklarımızın devredilmesini talep eden bir ültimatom verilecek."
 HUN_demand_transylvania:0 "Transilvanya'yı Talep Et"
 HUN_demand_transylvania_desc:0 "Topraklarımızı kan dökmeden geri alabilirsek, o kadar iyi. Romanya'ya haklı topraklarımızın devredilmesini talep eden bir ültimatom verilecek."
 HUN_demands_tt:0 "Toprak talep ederken, güçlü bir ordunuz varsa karşı tarafın kan dökmeden teslim etmesi daha olasıdır. Ancak, bir ittifak içindelerse hala bize karşı durabileceklerine inanabilirler. \n"
 HUN_destroyer:0 "Muhripler"
 HUN_destroyer_desc:0 "Muhripler, filonun hayati ama genellikle göz ardı edilen bir parçasıdır. Düşük maliyetle birlikte, herhangi bir deniz genişleme programı için iyi bir başlangıçtırlar."
 HUN_develop_tanks:0 "Tank Geliştir"
 HUN_develop_tanks_desc:0 "Etrafımızdaki uluslar tankın önemini anladı ve onları büyük sayılarda üretiyor. Kendi tank tasarımlarımızı geliştirmeli ve müttefiklerimiz ve düşmanlarımızla aynı seviyede kalmaya çalışmalıyız."
 HUN_domestic_arms_industry:0 "Yerli Silah Sanayii"
 HUN_domestic_arms_industry_desc:0 "Silah sanayimiz, sadece endüstriyel ekipman üretimi için değil, aynı zamanda yeni fabrikaların kurulması için de güçlü bir sivil sanayi tabanı tarafından desteklenmelidir."
 HUN_economic_intervention:0 "Ekonomik Müdahale"
 HUN_economic_intervention_desc:0 "Ekonomimizi yönlendirmek için bol miktarda siyasi kaynak ayırmalıyız. Yeterli olsa da, onu daha güçlü ve daha verimli hale getirebiliriz."
 HUN_elect_a_democratic_king:0 "Demokratik Bir Kral Seç"
 HUN_elect_a_democratic_king_desc:0 "Ulusumuzun demokratik ilkelerini ve halkımızın haklarını koruyacak bir Kral aramalıyız."
 HUN_elect_a_fascist_king:0 "Faşist Bir Kral Seç"
 HUN_elect_a_fascist_king_desc:0 "Ulusumuzun önümüzdeki çalkantılı yıllarda yolunu bulması için güçlü bir lidere ihtiyacı var. Hükümdarımız, halkın saygı duyabileceği ve düşmanlarımızın korkabileceği biri olmalı."
 HUN_elect_a_king:0 "Bir Kral Seç"
 HUN_elect_a_king_desc:0 "Ulusun monarşi hükümet biçimine dönmesi için halk desteği artık yeni bir Kral seçme sürecini başlatmayı düşünebileceğimiz kadar yeterli."
 HUN_establish_the_air_force:0 "Hava Kuvvetlerini Kur"
 HUN_establish_the_air_force_desc:0 "Yasal kısıtlamalar artık ortadan kalktığına göre, Macar hava kuvvetlerini resmi olarak kurma zamanı geldi."
 HUN_expand_the_aluminum_industry:0 "Alüminyum Endüstrisini Genişlet"
 HUN_expand_the_aluminum_industry_desc:0 "Hem ihracat hem de yurtiçi kullanım için mevcut tüm kaynaklara ihtiyacımız var. Alüminyum sanayimiz, zaten geniş olmasına rağmen, daha fazla iyileştirme için alana sahip ve bu amaca hemen kaynak yönlendirmeliyiz."
 HUN_expand_the_manfred_weiss_steel_works:0 "Manfred Weiss Çelik Fabrikalarını Genişlet"
 HUN_expand_the_manfred_weiss_steel_works_desc:0 "Devasa Manfed Weiss Çelik Fabrikaları, Büyük Savaş'ın tesislerde büyük bir genişleme görmesinden bu yana ayrılmaz bir savunma müteahhidi olmuştur. Bir sonraki savaşa hazırlık olarak ordumuzu artıracaksak, ulusal sanayimizin gururu bir kez daha büyütülmek zorunda kalacaktır."
 HUN_expand_the_technical_university_of_budapest:0 "Budapeşte Teknik Üniversitesi'ni Genişlet"
 HUN_expand_the_technical_university_of_budapest_desc:0 "Önümüzdeki çatışmalarda bize yardımcı olacak çığır açan keşifler yapacak daha fazla parlak beyne ihtiyacımız var. Başkentimizin üniversitesini genişleterek, askeri sanayimiz için vasıflı mühendis ve bilim adamı havuzunu artırabiliriz."
 HUN_fighter_competition:0 "Avcı Uçağı Yarışması"
 HUN_fighter_competition_desc:0 "Lisans altında üretilecek en iyi avcı uçağı modelini seçebilmemiz için, yarışmacıları birbirine karşı yarıştırmalıyız. Bir avcı uçağı yarışması düzenleyeceğiz ve tüm büyük güçleri en modern avcı modellerini göndermeye davet edeceğiz."
 HUN_form_parachute_battalions:0 "Paraşütçü Taburları Kur"
 HUN_form_parachute_battalions_desc:0 "Hava saldırısıyla indirilen piyade, beklenmedik herhangi bir tehdide veya taktiksel fırsata hızla tepki verme yeteneği kazandıracaktır."
 HUN_heavy_fighter_effort:0 "Ağır Avcı Uçağı Çabası"
 HUN_heavy_fighter_effort_desc:0 "Avcı uçaklarımız, daha savunmasız bombardıman uçaklarını destekleyebilmelidir. Bu, biraz hız ve manevra kabiliyeti pahasına daha ağır silahlanma ve daha uzun menzil gerektirir."
 HUN_home_defense:0 "Yurt Savunması"
 HUN_home_defense_desc:0 "Küçük mobil kuvvetler, saldırı durumunda ulusumuzu savunamayacaktır. Aşılmaz bir cephe hattı oluşturmalı ve böyle bir yaklaşımın etkinliğini artırmak için yeni doktrinler geliştirmeliyiz."
 HUN_indigenous_designs:0 "Yerli Tasarımlar"
 HUN_indigenous_designs_desc:0 "Kendi teknik uzmanlığımız ihtiyaçlarımız için yeterlidir. Kendi tasarım büromuz üzerindeki kontrol, ona daha fazla kaynak ayırmamızı sağlar, böylece yeni tasarımların geliştirilme hızını artırır."
 HUN_industrial_revitalization:0 "Endüstriyel Canlandırma"
 HUN_industrial_revitalization_desc:0 "Sanayi tabanımız son yıllarda tehlikeli bir şekilde çürüdü. Kaybedilen zemini telafi etmek için yeni teknolojileri benimsemek için çaba göstermeliyiz."
 HUN_institute_for_industrial_techniques:0 "Endüstriyel Teknikler Enstitüsü"
 HUN_institute_for_industrial_techniques_desc:0 "Endüstriyel araştırmaların geçici doğası, daha yavaş büyümeye ve daha düşük verimliliğe yol açtı. Yeni endüstriyel yöntemlere yönelik tüm araştırmaları bir araya getiren yeni bir enstitü oluşturmalıyız."
 HUN_intervene_in_czechoslovakia:0 "Çekoslovakya'ya Müdahale Et"
 HUN_intervene_in_czechoslovakia_desc:0 "Çekoslovaklara Trianon Antlaşması'nda bizden alınan toprakların bir kısmı verildi. Aynı zamanda, Almanların onların toprakları üzerindeki emellerini biliyoruz. Belki bir takas ayarlayabiliriz; Alman saldırganlığı durumunda Sovyet askeri desteği garantisi karşılığında haklı topraklarımız."
 HUN_invite_foreign_investors:0 "Yabancı Yatırımcıları Davet Et"
 HUN_invite_foreign_investors_desc:0 "Macaristan, Doğu Avrupa'nın kalbinde yer almaktadır ve merkezi konumumuzu altyapımızı ve sanayimizi geliştirmekle ilgilenen yabancı yatırımcıları çekmek için pekala kullanabiliriz."
 HUN_invite_the_habsburg_prince:0 "Habsburg Prensini Davet Et"
 HUN_invite_the_habsburg_prince_desc:0 "Habsburglar uzun süre Macaristan'ı yönetti ve onların yönetimi altında ülke Avrupa'nın en büyük imparatorluklarından birinin parçasıydı. Bir Habsburg'u tekrar başa getirmek, Macaristan'ı kesinlikle bir kez daha büyüklüğe götürecektir."
 HUN_join_allies:0 "Müttefiklere Katıl"
 HUN_join_allies_desc:0 "Macaristan'ın ve demokratik değerlerinin geleceği, büyük Batı demokrasileri ve onların ittifakıyla yatmaktadır. Bu ittifakın bir üyesi olarak, gücümüzü onlarınkine katabilir ve aynı zamanda onların desteğine güvenebiliriz."
 HUN_join_axis:0 "Mihver'e Katıl"
 HUN_join_axis_desc:0 "Ekonomimiz zaten Almanlara bu kadar bağımlı olduğundan, savaşta onları takip etmemiz sadece mantıklıdır. Onlara Mihver ittifakına resmi giriş için bir talep göndereceğiz."
 HUN_join_comintern:0 "Komintern'e Katıl"
 HUN_join_comintern_desc:0 "Devrim için ileriye giden yol Komintern ile yatmaktadır. Yoldaşlarımızla birlikte durarak, kapitalist adaletsizliği ve Batı'da beliren faşist tehdidi bir kenara süpüreceğiz."
 HUN_joint_air_development:0 "Ortak Hava Geliştirme"
 HUN_joint_air_development_desc:0 "Yeni uçak modelleri geliştirmenin en iyi yolu müttefiklerimizle işbirliği yapmaktır. Tüm uluslarımızın en parlak beyinlerini bir araya getirerek en iyi sonuçları elde edeceğiz."
 HUN_joint_aluminum_mining_company:0 "Ortak Alüminyum Madencilik Şirketi"
 HUN_joint_aluminum_mining_company_desc:0 "Alüminyum modern savaş endüstrisinin ayrılmaz bir parçası olduğundan, ülkemizin kuzeyindeki madenleri genişletmek için kolayca Alman desteği alabiliriz."
 HUN_joint_oil_exploitation_company:0 "Ortak Petrol İşletme Şirketi"
 HUN_joint_oil_exploitation_company_desc:0 "Topraklarımızda olası petrol sahaları beklentisiyle, yabancıların dikkatini çektik. Dost güçler, petrol endüstrimizi teknik bilgileriyle desteklemeye hevesli ve bu, onların ilerlemelerinden öğrenmek için kazançlı bir fırsat olacaktır."
 HUN_joint_tank_procurement:0 "Ortak Tank Tedariki"
 HUN_joint_tank_procurement_desc:0 "Müttefiklerimizle birlikte yeni tank modellerini çok daha etkili bir şekilde geliştirebiliriz. Mühendislerimizin ileriye dönük en iyi tasarımları belirlemek için birlikte çalışabilecekleri ortak bir tedarik bürosu kuracağız."
 HUN_license_foreign_designs:0 "Yabancı Tasarımları Lisansla"
 HUN_license_foreign_designs_desc:0 "Yabancı hava kuvvetleri, zaten çok yüksek kalitede denenmiş ve kanıtlanmış tasarımlara sahip olduklarını göstermiştir. Kaderi zorlamak ve tomurcuklanan havacılık uzmanlığımıza güvenmek yerine, bu yabancı modelleri lisans altında üretmemize izin verilmesini talep etmeliyiz."
 HUN_light_fighter_effort:0 "Hafif Avcı Uçağı Çabası"
 HUN_light_fighter_effort_desc:0 "Kuvvetlerimizin üzerindeki göklerde yerel hava üstünlüğü sağlamak ve ulusumuzu tehdit eden düşman uçaklarını önlemek için avcı uçaklarına ihtiyacımız var."
 HUN_light_infantry_divisions_doctrine:0 "Hafif Piyade Tümenleri Doktrini"
 HUN_light_infantry_divisions_doctrine_desc:0 "Elimizdeki sınırlı insan gücüyle idare etmeliyiz. Daha fazla tümen istiyorsak, zorunlu olarak daha küçük olmaları gerekir. Hafif piyade tümenleri, vuruş gücü ve boyutun optimal bir karışımını sağlar ve bunu ordumuzun bel kemiği yapacağız."
 HUN_light_infantry_divisions_doctrine_tech_tt:0 "§HHafif Piyade Tümenleri Doktrinini§! etkinleştirir.\n§HPiyade\n    Orman§!\n      Saldırı: §G+%2§!\n      Hareket: §G+%5§!\n    §HŞehir§!\n      Saldırı: §G+%5§!\n      Hareket: §G+%5§!\n"
 HUN_light_infantry_divisions_doctrine_unit_tt:0 "\n6 taburlu bir §YPiyade§! birimi kazanın.\n"
 HUN_march_to_the_shore:0 "Kıyıya Yürü"
 HUN_march_to_the_shore_desc:0 "Gerçek bir Büyük Güç, denizlere erişim gerektirir. Adriyatik kıyısı bizim doğuştan gelen hakkımızdır."
 HUN_mobile_corps_doctrine:0 "Mobil Kolordu Doktrini"
 HUN_mobile_corps_doctrine_desc:0 "Hem motorlu hem de zırhlı unsurlar artık üretimde olduğuna göre, bunların savaş alanında nasıl birlikte çalışabileceğine dair yeni teorik yaklaşımlara bakmalıyız."
 HUN_mobile_focus:0 "Mobil Odaklanma"
 HUN_mobile_focus_desc:0 "En çok hasarı vereceği zaman ve yerde saldırma kapasitesine sahip mobil bir ordu, askeri başarının anahtarıdır."
 HUN_motorized_logistics:0 "Motorlu Lojistik"
 HUN_motorized_logistics_desc:0 "Mobil savaşın anahtarı, insanları ve malzemeyi büyük mesafeler boyunca hızlı bir şekilde taşıma yeteneğidir. İkmal edilmezse en iyi tank bile hızla işe yaramaz hale gelir."
 HUN_naval_warfare:0 "Deniz Savaşı"
 HUN_naval_warfare_desc:0 "Bir sahil şeridini geri kazandıktan sonra, çabalarımızı büyük bir güce yakışır bir filo yeniden inşa etmeye odaklamalıyız."
 HUN_pressure_romania:0 "Romanya'ya Baskı Yap"
 HUN_pressure_romania_desc:0 "Batı'daki Faşist tehlikeye odaklanırken, arkamızda potansiyel bir tehdidin var olmaya devam etmesine izin veremeyiz, özellikle de Doğu'daki müttefiklerimizle aramızda yer alıyorken. Romanya, yoldaş bir komünist devlet olarak güvence altına alınmalı veya müttefiklerimize giden önemli kara yolları, onların desteğini alabilmemizi sağlamak için devredilmelidir."
 HUN_proclaim_greater_hungary:0 "Büyük Macaristan'ı İlan Et"
 HUN_proclaim_greater_hungary_desc:0 "Hak ettiğimiz toprağı geri kazandıktan sonra, ülkemizin büyüklüğü tarihi sınırlarımıza ulaştı. Artık tam bir güvenle Büyük Macaristan'ın kuruluşunu dünyaya ilan edebilir ve gözlerimizi yeni hedeflere dikebiliriz."
 HUN_proclaim_the_restoration_of_austria_hungary:0 "Avusturya-Macaristan'ın Restorasyonu"
 HUN_proclaim_the_restoration_of_austria_hungary_desc:0 "İki ulusumuzun yeniden birleşmesi ve tahtta bir Habsburg olmasıyla, şimdi Avusturya-Macaristan'ın restorasyonunu ciddiyetle ilan edebilir ve haklı tarihi illerimizi geri almaya bakabiliriz!"
 HUN_protect_austria:0 "Avusturya'yı Koru"
 HUN_protect_austria_desc:0 "Almanya'ya karşı daha fazla durmak için, Avusturya ile birleşme konusundaki açık emellerine direnmek zorundayız. Onlara bir garanti verebiliriz, bu da mevcut hükümete umarım Alman yanlısı unsurlara karşı durmaları için ihtiyaç duydukları siyasi gücü verir."
 HUN_protect_czechoslovakia:0 "Çekoslovakya'yı Koru"
 HUN_protect_czechoslovakia_desc:0 "Çekoslovakya, bağımsızlığından bu yana güçlü ve sanayileşmiş bir hale geldi, ancak toprakları komşuları tarafından açgözlülükle izleniyor. Onlara bu tehditlere karşı korumamızı sunacağız, ya onları bir kez daha İmparatorluğumuzun ayrılmaz bir parçası olarak karşılayarak ya da onlara ortaklık statüsü vererek."
 HUN_rapproachement_with_little_entente:0 "Küçük İtilaf ile Yakınlaşma"
 HUN_rapproachement_with_little_entente_desc:0 "Düşman ideolojiler etrafımızı sardı ve Küçük İtilaf komşularımızla bağlarımızı yeniden teyit etmeliyiz. Onlara yeniden silahlanmamızı görmek isteyip istemediklerini soracağız."
 HUN_reaffirm_territorial_claims:0 "Toprak Taleplerini Yeniden Teyit Et"
 HUN_reaffirm_territorial_claims_desc:0 "Trianon Antlaşması'nın reddedilmesiyle, şimdi bizden çalınan topraklara olan taleplerimizi yeniden teyit etmeye devam etmeliyiz."
 HUN_reclaim_the_empire:0 "İmparatorluğu Geri Al"
 HUN_reclaim_the_empire_desc:0 "De jure toprak taleplerimizi sonuçlandırmak için, Habsburg hükümdarımızın adına sahip olduğu Almanya, İtalya ve Filistin'deki çeşitli unvanları talep etmeliyiz."
 HUN_reclaim_venetia:0 "Venedik'i Geri Al"
 HUN_reclaim_venetia_desc:0 "İtalyanların Büyük Savaş'taki ihaneti unutulmadı. Onları yerlerine oturtmanın ve İmparatorluğu doğal sınırlarına geri döndürmenin zamanı geldi."
 HUN_reform:0 "Reform"
 HUN_reform_desc:0 "Modası geçmiş fikirlere dayalı bir donanma yaratmanın pek bir anlamı yok. Bize sıfırdan, eskinin yükü olmadan yeni bir donanma yaratma fırsatı verildi. Bunu, elimizden gelen en modern ve yetenekli donanmayı inşa etmek için kullanmalıyız."
 HUN_reintegrate_the_railroads:0 "Demiryollarını Yeniden Entegre Et"
 HUN_reintegrate_the_railroads_desc:0 "Eski Avusturya-Macaristan imparatorluğunu kapsayan demiryolu ağları, bağımsız uluslarda dağılmasından bu yana parçalanmıştır. Diğer eski kurucu devletlere yaklaşmalı ve genel olarak altyapıyı iyileştirmek için demiryolu ağlarımızın yeniden entegrasyonunu önermeliyiz."
 HUN_renew_the_rome_protocols:0 "Roma Protokollerini Yenile"
 HUN_renew_the_rome_protocols_desc:0 "Almanya'nın devam eden revizyonizmi ışığında, 1934'te hazırlanan ve imzalanan Roma Protokollerini yenilemeliyiz. Anlaşmalar sadece Alman ve Yugoslav tehditlerini daha da izole etmeye hizmet etmekle kalmayacak, aynı zamanda gerçek bir ittifakın olası bir öncüsü olarak da hizmet edecektir."
 HUN_renounce_the_treaty_of_trianon:0 "Trianon Antlaşması'nı Tanımadığını Açıkla"
 HUN_renounce_the_treaty_of_trianon_desc:0 "Büyük Savaş'ın sonunda ulusumuza zorla kabul ettirilen, bir zamanların büyük ulusumuzun topraklarının ve nüfusunun üçte ikisini koparan adaletsizlik, Versay Antlaşması'nda Almanya'ya yapılan utançla yarışır ve bu geri alınmalıdır."
 HUN_renounce_the_treaty_of_trianon_tt:0 "§YMiklós Horthy§! veya §YFriedrich Franz of Mecklenburg-Schwerin§! ülke lideri olur.\n"
 HUN_responsible_government:0 "Sorumlu Hükümet"
 HUN_responsible_government_desc:0 "Geleneksel olarak, hükümet nihayetinde krala hesap verirdi, bu da halkın iradesini görmezden gelmesine izin verirdi. Hükümeti sorumlu tutanın hükümdar değil, halk olmasını sağlamak için anayasayı değiştireceğiz."
 HUN_restauration:0 "Restorasyon"
 HUN_restauration_desc:0 "Yeni ve kanıtlanmamış teknolojilerle deney yaparak zaman kaybedemeyiz. Eski İmparatorluk günlerinden denenmiş ve test edilmiş tasarımlara bağlı kalacağız."
 HUN_secret_rearmament:0 "Gizli Yeniden Silahlanma"
 HUN_secret_rearmament_desc:0 "Trianon Antlaşması'nın bize dayattığı kısıtlamalar, ordumuzun büyüklüğünü artırmamızı yasaklıyor. Öyle olsa bile, dünyanın siyasi iklimi giderek daha çalkantılı hale geliyor ve ufukta çatışma beliriyor. Savunmasız kalamayız ve Büyük Savaş'tan sonra bize dayatılan barış antlaşmasının şartlarını gizlice ihlal etmek anlamına gelse bile yeniden silahlanmaya başlamalıyız."
 HUN_secret_rearmament_tt:0 "§G§YKısmi Seferberlik§! yasasının kilidini açar.§!\n"
 HUN_secret_rearmament_tt_2:0 "§RAskerlik hizmeti §YSadece Gönüllü§! seviyesinin ötesine artırıldığında ruh hali kaldırılacaktır.§!\n"
 HUN_soviet_hungarian_military_academy:0 "Sovyet-Macar Askeri Akademisi"
 HUN_soviet_hungarian_military_academy_desc:0 "Ordumuz liderliği olmadan bir hiçtir. Sovyetler askeri konularda çok daha fazla deneyime sahip, bu yüzden en iyi askeri beyinlerimizin eğitiminde onlarla işbirliği yapmak faydalı olabilir. Bu amaçla, her iki ulusumuzdan en yetenekli eğitmenlerle bir askeri akademi kuracağız."
 HUN_strengthen_fascists:0 "Faşistleri Güçlendir"
 HUN_strengthen_fascists_desc:0 "Ülkemizdeki faşist unsurlar güçlendirilmeli ve ideolojilerini yaymaları için onlara bir kamu platformu verilmelidir. Macaristan'ın geleceği hakkındaki görüşleri, ülkeyi bir kez daha büyüklüğe götürme olasılığı en yüksek olanlardır."
 HUN_strengthen_the_monarchists:0 "Monarşistleri Güçlendir"
 HUN_strengthen_the_monarchists_desc:0 "Macaristan'ı eski prestijine döndürmenin ilk adımı, monarşiye dönüş için haykıran partileri güçlendirmektir."
 HUN_submarines:0 "Denizaltılar"
 HUN_submarines_desc:0 "Denizaltılar son savaşta gezegendeki en güçlü donanmayı yenmeye yaklaştı. Kendi denizaltılarımıza sahip olmazsak modern bir donanma olarak ciddiye alınamayız."
 HUN_support_domestic_industry:0 "Yerli Sanayiyi Destekle"
 HUN_support_domestic_industry_desc:0 "Ordu daha fazla teçhizata ihtiyaç duyuyor ve sanayimiz buna ayak uydurmalı. Silah sanayimizin genişletilmesi için yeni kaynaklar yönlendireceğiz."
 HUN_support_urbanization:0 "Kentleşmeyi Destekle"
 HUN_support_urbanization_desc:0 "Giderek daha fazla insan, yeni fabrikalarda iş aramak için köyleri ve daha küçük kasabaları terk edip büyük kent merkezlerine taşınıyor. Onlara hemen istihdam sunamasak bile, daha sonraki bir genişlemeye hazırlık olarak yeni şehir mahalleleri inşa edebiliriz."
 HUN_synthetic_industry:0 "Sentetik Endüstri"
 HUN_synthetic_industry_desc:0 "Artık kömürü sıvılaştırma teknolojisine hakim olduğumuza göre, üretime başlamak için bir pilot tesis inşa edebiliriz."
 HUN_synthetic_oil_tt:0 "Rastgele bir eyalete sentetik bir rafineri ekler. Konum, araştırmanın sentetik petrol üretiminin uygulanabilir olduğunu kanıtlamasından sonra görüntülenecektir.\n"
 HUN_tac_focus:0 "Taktik Bombardıman Uçağı Odağı"
 HUN_tac_focus_desc:0 "Zafer, düşmanın kara kuvvetlerini yok ederek elde edilecektir. Kendi ordularımızı yakın ve derin hedeflere karşı taktik saldırılarla desteklemeye odaklanmalıyız."
 HUN_take_austria_by_force:0 "Avusturya'yı Zorla Al"
 HUN_take_austria_by_force_desc:0 "Macaristan'a zaferi geri getirmenin ilk adımı, Avusturya topraklarını yeniden entegre etmektir. Bunu diplomatik olarak başarmada bir başarısızlığı riske atamayız, bu yüzden bunu güç yoluyla yapmalıyız."
 HUN_the_balkan_pact:0 "Balkan Paktı"
 HUN_the_balkan_pact_desc:0 "Batı'nın demokrasileri bize yardım etmek için çok uzakta, bu yüzden eve daha yakın müttefikler aramalıyız. Balkan Paktı'nın lideri olarak, onlara korumamızı sunacak ve onları zafere taşıyacağız!"
 HUN_the_botond:0 "Botond"
 HUN_the_botond_desc:0 "Tedarik ve nakliye taleplerimizi yeterince karşılamak için yeni bir kamyon tipine ihtiyacımız var. Rába 38M Botond tasarımının ilk denemeleri başarılı oldu ve uygun kaynaklarla tasarımı sonuçlandırıp üretime başlayabiliriz."
 HUN_the_hungarian_red_army:0 "Macar Kızıl Ordusu"
 HUN_the_hungarian_red_army_desc:0 "Tüm vatanseverler, anavatanlarının savunmasında görevlerini yapmalıdır. Doğudaki Sovyetlerin örneğini takip ederek, tomurcuklanan Devrimimizi koruyacak bir Macar Kızıl Ordusu kuracağız."
 HUN_the_revolutionary_council:0 "Devrimci Konsey"
 HUN_the_revolutionary_council_desc:0 "Komintern, emperyalizme karşı mücadeleyi terk etti, bunun yerine bir arada yaşama razı oldu. Eğer dünya işçileri özgür olacaksa, Marx ve Lenin'in meşalesini ileriye taşımalıyız - gerekirse Sovyetler Birliği'ne karşı bile."
 HUN_theoretical_air_efforts:0 "Teorik Hava Çabaları"
 HUN_theoretical_air_efforts_desc:0 "Hava savaşıyla ilgili yeni teoriler geliştirmek için bol miktarda kaynak harcamalıyız. Savaşa gidersek, geliştirilebilecek teoriler paha biçilmez olacaktır."
 HUN_trade_deal_with_germany:0 "Almanya ile Ticaret Anlaşması"
 HUN_trade_deal_with_germany_desc:0 "Almanya ile artan ticaret ilişkilerinin sanayimize faydaları açıktır ve ekonomimizin Almanlara potansiyel aşırı bağımlılığı iddiaları abartılıdır. Devam edip kapsamlı bir ticaret anlaşması imzalayacağız."
 HUN_war_games:0 "Savaş Oyunları"
 HUN_war_games_desc:0 "Küçük ölçekli savaş oyunlarına katılarak, mevcut askeri yapımızdaki kusurları keşfedebilir ve kazanılan deneyimi eksiklikleri gidermek için kullanabiliriz."
 ROM_HUN_aligned:0 "Macaristan hizaya geldi"
 ROM_a_deal_with_the_devil:0 "Şeytanla Anlaşma"
 ROM_a_deal_with_the_devil_desc:0 "[SOU.GetNameDefCap] doğu sınırımıza bir tehdittir ve toprak talepleri ufukta olabilir. Belki de [SOU.GetAdjective]lere savaşmaktansa onlara katılmak daha iyi olur."
 ROM_acquire_fighters:0 "Avcı Uçakları Edin"
 ROM_acquire_fighters_desc:0 "Hava üstünlüğü savunmamız için anahtardır ve bu nedenle avcı kuvvetlerimizi mümkün olan her yolla genişletmemiz esastır."
 ROM_acquire_licenses:0 "Lisans Edin"
 ROM_acquire_licenses_desc:0 "Yabancı havacılık teknolojisi bizimkinden üstündür ve onların yenilikleriyle uçakları kendimiz üretebilmemiz için lisanslar almalıyız."
 ROM_acquire_modern_tanks:0 "Modern Tanklar Edin"
 ROM_acquire_modern_tanks_desc:0 "Tankların gelişimi hızlı bir şekilde devam ediyor ve modası geçmiş modelleri edinmek işe yaramayacaktır."
 ROM_agrarian_reform:0 "Tarımsal Reform"
 ROM_agrarian_reform_desc:0 "Tarımsal sektörümüzün iyileştirilmesi için bolca yer var. Onu modernize etmek ve verimliliğini artırmak, inşaat ve silah üretimi gibi diğer sektörlerde istihdam edilebilecek iş gücünü serbest bırakacaktır."
 ROM_air_defense:0 "Hava Savunması"
 ROM_air_defense_desc:0 "Küçük hava kuvvetlerimiz üzerindeki baskıyı hafifletmek için sınırlarımızı geniş kapsamlı uçaksavar bataryalarıyla korumalıyız."
 ROM_air_superiority:0 "Hava Üstünlüğü"
 ROM_air_superiority_desc:0 "Hava hakimiyeti, askeri operasyonlar için temel bir gerekliliktir ve odaklanmamız gereken hava savaşının bu yönüdür."
 ROM_align_hungary:0 "Macaristan'ı Hizaya Getir"
 ROM_align_hungary_desc:0 "Macaristan bizim bakış açımızı görmeye zorlanmalı. Hükümetleri, ülkeyi sadece yıkıma götürebilecek yanlış yönlendirilmiş unsurlar tarafından yönetiliyor. Bizimle daha güçlü olurlardı."
 ROM_all_parties_must_end:0 "Tüm Partiler Sona Ermeli"
 ROM_all_parties_must_end_desc:0 "Hiçbir parti sonsuza kadar sürmez ve mevcut jeopolitik durum Kralımızın bölünmemiş dikkatini gerektirir. Savaş bittiğinde bir parti verebilir, ama şimdilik hedonist yollarını geride bırakmalı."
 ROM_appoint_allied_friendly_government:0 "Müttefik Yanlısı Hükümet Ata"
 ROM_appoint_allied_friendly_government_desc:0 "Romanya'nın geleceği, Batı'daki eski müttefiklerimizle - Fransa ve müttefikleriyle - iyi ilişkilere bağlıdır. Bu ilişkileri sürdüren bir hükümet atamalıyız."
 ROM_appoint_allied_friendly_government_tooltip:0 "§YDemir Muhafızları§!, §Y$ROM_national_christian_party_in_power$§!'yi ve §YSecuritate§!'yi kaldırır.\n"
 ROM_appoint_german_friendly_government:0 "Mihver Yanlısı Hükümet Ata"
 ROM_appoint_german_friendly_government_desc:0 "Romanya'nın geleceği, Batı'daki yükselen Faşist güçlerle iyi ilişkilere bağlıdır. Bu gerçeği anlayan bir hükümet atamalıyız."
 ROM_appoint_german_friendly_government_tooltip:0 "§YAnayasal Garantileri§!, §Y$ROM_national_christian_party_in_power$§!'yi ve §YSecuritate§!'yi kaldırır.\n"
 ROM_appoint_german_friendly_government_tooltip_ncp:0 "§YAnayasal Garantileri§!, §YDemir Muhafızları§!'nı ve §YSecuritate§!'yi kaldırır.\n"
 ROM_appoint_soviet_friendly_government:0 "Sovyet Yanlısı Hükümet Ata"
 ROM_appoint_soviet_friendly_government_desc:0 "Romanya'nın geleceği, komünist doğu komşumuzla iyi ilişkilere bağlıdır. Bu gerçeği anlayan bir hükümet atamalıyız."
 ROM_appoint_soviet_friendly_government_tooltip:0 "§YAnayasal Garantileri§!, §Y$ROM_national_christian_party_in_power$§!'yi ve §YDemir Muhafızları§!'nı kaldırır.\n"
 ROM_army_maneuvers:0 "Ordu Manevraları"
 ROM_army_maneuvers_desc:0 "Ordumuz, olası gelecekteki silahlı çatışmalar için yeniden şekillendirilmelidir. Onları yeni taktikler ve stratejiler geliştirmeleri için manevralara göndereceğiz."
 ROM_army_war_college:0 "Kara Harp Okulu"
 ROM_army_war_college_desc:0 "Askeri kuvvetlerimizin komutasında en parlak beyinlere ihtiyacımız var, bu da harp okulunun genişletilmesi gerektiği anlamına geliyor."
 ROM_artillery_modernization:0 "Topçu Modernizasyonu"
 ROM_artillery_modernization_desc:0 "Piyade, uygun topçu desteği olmadan işlev görmez. Modern, yüksek kaliteli toplar sağlamak, kuvvetlerimizin etkinliğini artırmada uzun bir yol kat edecektir."
 ROM_balkans_dominance:0 "Balkan Hakimiyeti"
 ROM_balkans_dominance_desc:0 "Müreffeh bir Rumen geleceğinin anahtarı, Doğu'nun devrimcilerinde ya da Batı'nın demokrasilerinde veya faşistlerinde değil, Balkanların Rumen hakimiyetinde yatmaktadır."
 ROM_basing_rights_for_soviet_union:0 "[SOU.GetName] için Üs Hakları"
 ROM_basing_rights_for_soviet_union_desc:0 "[SOU.GetAdjective]lerin toprağımızı arzuladığını biliyoruz, ancak komşumuza üs hakları sunarak herhangi bir düşmanlığı önleyebiliriz."
 ROM_black_sea_dominance:0 "Karadeniz Hakimiyeti"
 ROM_black_sea_dominance_desc:0 "İlk kaynak eksikliğimiz, gelecekteki tam Rumen Karadeniz hakimiyetine bir engel olmamalıdır. Uygun siyasi iradeyle, bunu bir gerçeklik haline getireceğiz."
 ROM_capital_ships:0 "Ana Muharebe Gemileri"
 ROM_capital_ships_desc:0 "Bir deniz gücü olarak ciddiye alınmak istiyorsak, Karadeniz filomuzu yönetecek ana muharebe gemilerine ihtiyacımız olacak."
 ROM_carol_current_leader_trigger:0 "§YII. Carol§! mevcut ülke lideridir."
 ROM_carol_not_leader_trigger:0 "§YII. Carol§! mevcut ülke lideri değildir."
 ROM_cas:0 "Yakın Hava Desteği"
 ROM_cas_desc:0 "Müşterek kuvvetlerimizden en iyi şekilde yararlanmak istiyorsak, özellikle yakın hava desteği için tasarlanmış özel uçak modellerine ihtiyacımız var."
 ROM_civil_works:0 "İnşaat İşleri"
 ROM_civil_works_desc:0 "Büyük Romanya, büyük ölçekli bir askeri yığınağı destekleyecekse, kapsamlı bir endüstriyel gelişim programına ihtiyaç duyacaktır. Şimdi başlayacağız."
 ROM_coastal_defense_navy:0 "Kıyı Savunma Donanması"
 ROM_coastal_defense_navy_desc:0 "Sınırlı kaynaklarımızla, kıyılarımızı güvence altına almaktan fazlasını hedefleyemeyiz. Tüm çaba bu hedefe yönlendirilmelidir."
 ROM_coastal_defense_ships:0 "Kıyı Savunma Gemileri"
 ROM_coastal_defense_ships_desc:0 "Kıyı savunma görevlerinde mükemmel olan gemiler için yeni tasarımlar oluşturulması gerekecektir."
 ROM_coastal_defense_ships_tech_tt:0 "§HKıyı Savunma Gemilerini§! etkinleştirir.\n§HAğır Kruvazörler§!\n    Zırh: §G+%20§!\n    Deniz Ateş Gücü: §G+%10§!\n    Üretim Maliyeti: §G-%10§!"
 ROM_constitutional_guarantees:0 "Anayasal Garantiler"
 ROM_constitutional_guarantees_desc:0 "Kral tarafından uygulanan anayasal değişiklikler geri alınmalı ve bunun tekrar olmamasını sağlamak için garantiler ve dengelemeler getirilmelidir. Aksi takdirde, elimizde kalan tek şey demokrasinin bir taklididir."
 ROM_crack_down_on_extremism:0 "Aşırılığa Karşı Sert Önlemler"
 ROM_crack_down_on_extremism_desc:0 "Siyasi manzaramız Kral'ın yönetimi altında güçlü bir şekilde sağa kaydı. Bununla birlikte, toplumun aşırılıkçı unsurları hala halkımızın kalpleri ve zihinleri üzerinde etkiye sahip. Halkımız için daha ılımlı bir gelecek sağlamak amacıyla bu haydut aktörlere karşı harekete geçmeliyiz."
 ROM_danubian_transport_network:0 "Tuna Ulaşım Ağı"
 ROM_danubian_transport_network_desc:0 "Tuna boyuncaki ulaşım kabiliyetlerimiz, hem nehrin kendisini daha etkili kullanarak hem de karayolu ve demiryolu ağlarımıza bağlanma şekliyle büyük ölçüde geliştirilebilir."
 ROM_demand_a_western_guarantee:0 "Batı Garantisi Talep Et"
 ROM_demand_a_western_guarantee_desc:0 "Hem komünizme hem de faşizme karşı duracaksak, Batı yardımına ihtiyacımız olacak. Böyle bir garantiyi elde etmek için elimizdeki tüm siyasi gücü kullanacağız."
 ROM_demand_transnistria:0 "Transdinyester'i Talep Et"
 ROM_demand_transnistria_desc:0 "Artık güçlüyüz ve Alman desteğimiz var, Transdinyester bölgesini talep etme ve onu Büyük Romanya'ya dahil etme zamanı geldi."
 ROM_divide_yugoslavia:0 "Yugoslavya'yı Böl"
 ROM_divide_yugoslavia_desc:0 "Yugoslavya'yı oluşturan Balkan devletlerinin mevcut düzenlemesi sürdürülebilir değil. Rumen liderliği altında, kurucu devletlerinin yeniden yapılandırılmasını gerektiren bir ültimatom yayınlayacağız."
 ROM_expand_ploiesti_oil_production:0 "Ploiesti Petrol Üretimini Genişlet"
 ROM_expand_ploiesti_oil_production_desc:0 "Ploiesti'de Avrupa'nın en büyük petrol sahalarından bazılarına sahibiz ve bunlar sadece kendimiz için değil, aynı zamanda müttefiklerimiz ve bölgedeki diğer uluslar için de muazzam bir öneme sahiptir. Talepleri daha iyi karşılamak için sahaların üretimini artırmalıyız."
 ROM_expand_the_air_force:0 "Hava Kuvvetlerini Genişlet"
 ROM_expand_the_air_force_desc:0 "Modern savaşlar göklere hakim olmadan kazanılamaz. Rumen hava kuvvetlerini geliştirmek için elimizden gelen her şeyi yapmalıyız!"
 ROM_expand_the_galati_shipyards:0 "Galați Tersanelerini Genişlet"
 ROM_expand_the_galati_shipyards_desc:0 "Gücümüzü Karadeniz'e yansıtmak istiyorsak, Galați'deki mevcut tersane tesislerimiz büyük ölçüde genişletilmelidir."
 ROM_expand_the_marine_regiment:0 "Deniz Piyade Alayını Genişlet"
 ROM_expand_the_marine_regiment_desc:0 "Karadeniz hakimiyeti, yeni saldırı yolları için fırsatlar açar. Deniz çıkarmaları artık uygun bir seçenektir, bu da yeni nakliye modellerinin yaratılmasını ve bu savaş biçiminde uzmanlaşabilecek özel deniz piyade tümenlerini gerektirir."
 ROM_expand_the_university_of_bucharest:0 "Bükreş Üniversitesi'ni Genişlet"
 ROM_expand_the_university_of_bucharest_desc:0 "Üniversitemizin kalitesini ve kapasitesini artırarak, teknolojik ilerlemelerimiz için güvendiğimiz en iyi ve en parlak beyinlerin havuzunu artırabiliriz."
 ROM_exploit_the_baita_mines:0 "Băița Madenlerini İşlet"
 ROM_exploit_the_baita_mines_desc:0 "Uranyumun, ateşli silahın icadından bu yana silahlardaki en köklü teknolojik ilerlemeler için hayati öneme sahip olduğu anlaşılmaya başlanıyor. Şanslıyız ki sınırlarımız içinde büyük bir yatağa sahibiz ve onu işletmek için bir maden kurmalıyız."
 ROM_flexible_foreign_policy:0 "Esnek Dış Politika"
 ROM_flexible_foreign_policy_desc:0 "İlkelerimizi terk etmeli ve kiminle yapmak daha pratikse onunla ilişkiler kurmalıyız. Hayatta kalmamız buna bağlı."
 ROM_force_abdication:0 "Tahttan Çekilmeye Zorla"
 ROM_force_abdication_desc:0 "Kral II. Carol artık gerekli değil ve hatta bir liderden çok bir baş belası olduğunu kanıtlıyor. Hala ulusun hükümeti ve maliyesi üzerinde geniş bir kontrole sahip olsa da, Romanya'nın uzun vadeli iyiliği için tahttan çekilmeye zorlanmalıdır."
 ROM_form_peasant_militias:0 "Köylü Milisleri Kur"
 ROM_form_peasant_militias_desc:0 "Komşumuzdan aldığımız komünist ideallerle birlikte, her insanın yoldaşlarını, ülkesini ve devrimi savunma görevi gelir."
 ROM_fortify_the_borders:0 "Sınırları Tahkim Et"
 ROM_fortify_the_borders_desc:0 "Artık iç durum kontrol altında olduğuna göre, sınırlarımızın dış tehditlere karşı savunmasını iyileştirmeye bakmalıyız."
 ROM_german_romanian_oil_exploitation_company:0 "Alman-Rumen Petrol İşletme Şirketi"
 ROM_german_romanian_oil_exploitation_company_desc:0 "Almanya'nın petrol ihtiyacı muazzamdır, bu da bize petrol rafinerilerimizi genişletmek için kazançlı bir fırsat sunmaktadır."
 ROM_ground_support:0 "Kara Desteği"
 ROM_ground_support_desc:0 "Müşterek silahlar, modern savaşın temel bir ilkesidir. Hava kuvvetleri, gerektiğinde kara kuvvetlerimizi desteklemek için eğitilmelidir."
 ROM_handle_the_king:0 "Kral ile Başa Çık"
 ROM_handle_the_king_desc:0 "Kralın aşırı yaşam tarzını kısıtlamak için yasa çıkarılmalıdır. Ulusal hazine artık kişisel harcamaları için tahsis edilemez."
 ROM_heavy_bombers:0 "Ağır Bombardıman Uçakları"
 ROM_heavy_bombers_desc:0 "Stratejik bombardıman kuvvetlerimiz geniş menzil ve bomba yükü gerektirir. Bu gereksinimleri karşılamak için büyük bombardıman uçakları tek uygun seçenektir."
 ROM_heavy_interceptors:0 "Ağır Önleme Uçakları"
 ROM_heavy_interceptors_desc:0 "Ülkemiz büyük bir hava kuvvetini destekleyemez. Herhangi bir saldırganı yok etmek için her uçağa mümkün olduğunca çok ateş gücü yoğunlaştırmalıyız."
 ROM_his_majestys_loyal_government:0 "Majestelerinin Sadık Hükümeti"
 ROM_his_majestys_loyal_government_desc:0 "İç sadakat her şeyden önemlidir ve ulus Kralının arkasında durduğu sürece pragmatik bir dış politika gereksizdir."
 ROM_hunedoara_steel_works:0 "Hunedoara Çelik Fabrikaları"
 ROM_hunedoara_steel_works_desc:0 "Silah üretimimizin ihtiyaçlarını karşılamak için Transilvanya'daki büyük çelik fabrikaları modernize edilmeli ve büyük ölçüde genişletilmelidir."
 ROM_iar_80:0 "IAR 80"
 ROM_iar_80_desc:0 "Mühendislerimizin yeni bir avcı uçağı tasarımına dökmek için hevesli oldukları mükemmel fikirleri var. Sadece finansmana ve onaya ihtiyaçları var."
 ROM_institute_royal_dictatorship:0 "Kraliyet Diktatörlüğü Kur"
 ROM_institute_royal_dictatorship_desc:0 "Kralın zaten geniş olan yetkilerini daha da artırmanın, ulusa siyasi istikrar getirmenin ve dışarıdan gelen tehditlere odaklanmasını sağlamanın zamanı geldi."
 ROM_invest_in_the_iar:0 "IAR'a Yatırım Yap"
 ROM_invest_in_the_iar_desc:0 "Modern bir hava kuvvetinin taleplerine ayak uydurmak kritik öneme sahiptir. Sanayimiz sadece ihtiyacımız olan makineleri ilk etapta inşa edebilmekle kalmamalı, aynı zamanda operasyonel kayıpları telafi edecek kadar hızlı bir tempoda bunu yapabilmelidir."
 ROM_invite_foreign_motor_companies:0 "Yabancı Motor Şirketlerini Davet Et"
 ROM_invite_foreign_motor_companies_desc:0 "Kanıtlanmamış yerli otomobil tasarımlarının üretimini artırmak için kaynak harcamak yerine, lisans altında denenmiş ve test edilmiş yabancı tasarımları üretmekten daha fazla fayda sağlarız."
 ROM_invite_german_advisors:0 "Alman Danışmanları Davet Et"
 ROM_invite_german_advisors_desc:0 "Ordumuzu modernize etmek istiyorsak Alman yardımı esastır. Gereken teknik bilgiye sahipler ve bu yüzden danışmanlarının yardımını talep etmeliyiz."
 ROM_invite_german_advisors_tt:0 "Almanya'nın Romanya topraklarında asker konuşlandırmasına izin ver.\n"
 ROM_iron_guard:0 "Demir Muhafız"
 ROM_iron_guard_desc:0 "Demir Muhafızlarla ilgili politikamızı yeniden gözden geçirme zamanı geldi. Yeni hükümetimizle, hareket artık resmi duruşlarımızla çok daha uyumlu ve ulusun siyasi istikrarını artırmak için mükemmel bir araç olarak hizmet edebilir."
 ROM_join_allies:0 "Müttefiklere Katıl"
 ROM_join_allies_desc:0 "Bir garanti yeterli değil - Batı demokrasileri için tam olarak tarafımızı belli etme ve özgürlük savunmasında onlarla birlikte durma zamanı geldi."
 ROM_join_axis:0 "Mihver'e Katıl"
 ROM_join_axis_desc:0 "Almanlarla birlikte şanlı bir Rumen geleceği çizmek için Mihver'e katılma zamanı geldi."
 ROM_join_comintern:0 "Komintern'e Katıl"
 ROM_join_comintern_desc:0 "Sonunda Komintern'e üyelik için başvurma zamanı geldi. Bu, toprağımızı Doğu'dan gelen taleplere karşı koruyacak ve komünizm davasını küresel olarak daha aktif bir şekilde savunmamızı sağlayacaktır."
 ROM_joint_allied_staff_college:0 "Müşterek Müttefik Kurmay Koleji"
 ROM_joint_allied_staff_college_desc:0 "Ortak çıkarlarımız ışığında, askeri teçhizat ve taktiklerin geliştirilmesinde Batı güçleriyle işbirliği yapmalıyız."
 ROM_king_michaels_coup:0 "Kral Mihai'nin Darbesi"
 ROM_king_michaels_coup_desc:0 "Mevcut hükümet Romanya'yı yıkıma sürüklüyor. Ulusu felaketten uzaklaştırmak için sağlam bir el gerekiyor - Prens Mihai'nin eli."
 ROM_license_german_equipment:0 "Alman Ekipmanını Lisansla"
 ROM_license_german_equipment_desc:0 "Alman ekipmanı bizimkinden üstündür, ama belki bu silahları kendimiz üretmek için lisansları alabiliriz."
 ROM_local_development:0 "Yerel Geliştirme"
 ROM_local_development_desc:0 "İhtiyacımız olan uçakları üretmek için yerli Rumen havacılık endüstrisine güveneceğiz."
 ROM_malaxa:0 "MALAXA"
 ROM_malaxa_desc:0 "Yerli otomobil sanayimizi, gerektiğinde kolayca askeri amaçlar için dönüştürülebilecek ve tahsis edilebilecek şekilde genişletmeliyiz. Bu amaçla, iş adamlarımızdan birinin kullanabileceğimiz oldukça ilginç fikirleri var..."
 ROM_medium_bombers:0 "Orta Bombardıman Uçakları"
 ROM_medium_bombers_desc:0 "Orduların gökyüzüne bakmadan savaş kazanabildiği dönem geçti. Askerlerimize ihtiyaç duydukları hava desteğini sağlamak için taktik bombardıman uçaklarımızı geliştirmeliyiz."
 ROM_militarize_the_sentinels:0 "Nöbetçileri Militarize Et"
 ROM_militarize_the_sentinels_desc:0 "Paramiliter Nöbetçiler, uygun kaynakları ayırırsak kolayca tam teşekküllü bir askeri örgüte dönüştürülebilir."
 ROM_military_modernization:0 "Askeri Modernizasyon"
 ROM_military_modernization_desc:0 "Batı desteğiyle bile, müttefiklerimizin her şey kaybedilmeden önce bize destek olmak için zamanları olması için orduyu modernize etmeye bakmalıyız."
 ROM_mobile_tank_destroyers:0 "Mobil Tank Avcıları"
 ROM_mobile_tank_destroyers_desc:0 "Düşmanlarımızı tank sayısı açısından geçecek sanayiye sahip değiliz. Bunun yerine, düşmanın zırhlı birimlerdeki üstünlüğünü etkisiz hale getirebilecek silahlar üretmeye odaklanmalıyız."
 ROM_modern_at_guns:0 "Modern AT Topları"
 ROM_modern_at_guns_desc:0 "Tank çağı geldi ve piyadelerimiz kendilerini bu çelik devlere karşı savunmak için güncel araçlara ihtiyaç duyuyor."
 ROM_modern_destroyers:0 "Modern Muhripler"
 ROM_modern_destroyers_desc:0 "Muhripler her donanmanın bel kemiğidir ve bizimki de bir istisna değildir. Donanmamızın bel kemiği günümüz standartlarına uygun hale getirilmelidir."
 ROM_modern_submarines:0 "Modern Denizaltılar"
 ROM_modern_submarines_desc:0 "Denizaltı savaşı, torpido botunun icadından bu yana en heyecan verici deniz gelişmesidir. Sadece denizaltılara karşı korunmakla kalmayıp, aynı zamanda onları düşman gemiciliğine karşı kullanmak da iyi olur."
 ROM_mountain_artillery:0 "Dağ Topçusu"
 ROM_mountain_artillery_desc:0 "Dağcılarımız, mükemmelliklerini korumak istiyorsak, hak ettikleri topçu desteğini almalıdır. Bu nedenle topçularımız dağ kullanımı için uyarlanmalıdır."
 ROM_mountain_artillery_tech_tt:0 "§HDağ Topunu§! etkinleştirir.\n§HTopçu\n    Dağ§!: Hareket: §G+%15§!\n§HAnti-Tank\n    Dağ§!: Hareket: §G+%15§!"
 ROM_national_christian_party:0 "Ulusal Hristiyan Partisi"
 ROM_national_christian_party_desc:0 "Yazar Octavian Goga, Ulusal Hristiyan partisi aracılığıyla ulusumuz üzerinde güçlü bir etkiye sahip. Tarım partisinden kazanılan nüfuzdan doğan bu partinin kırsal topluluklarla güçlü bağları var. Kabinemizin yeniden düzenlenmesi, onun etkisini lehimize kullanmamızı sağlayabilir."
 ROM_national_defense_industry:0 "Ulusal Savunma Sanayii"
 ROM_national_defense_industry_desc:0 "Artan taleplere ayak uydurmak istiyorsak ulusal silah sanayimizi büyük ölçüde genişletmeliyiz."
 ROM_nuclear_bomb_project:0 "Nükleer Bomba Projesi"
 ROM_nuclear_bomb_project_desc:0 "Geleneksel yollarla olası düşmanlarımızı bombalamayı asla umamayız. Bu nedenle, daha azıyla daha fazla yıkım elde etmemizi sağlayacak teknolojik ilerlemelere odaklanmalıyız. Çok, çok daha fazla."
 ROM_preserve_greater_romania:0 "Büyük Romanya'yı Koru"
 ROM_preserve_greater_romania_desc:0 "Sonunda tüm Rumen konuşanları ülkemizde birleştirmeyi başardık. Şimdi, çocuklarımızın tüm Rumenler için bir Romanya mirasımızı devralabilmelerini sağlamalıyız."
 ROM_puppet_bulgaria:0 "Bulgaristan'ı Kukla Yap"
 ROM_puppet_bulgaria_desc:0 "Savaş çığırtkanı Bulgaristan uzun zamandır komşularının başına bela olmuştur. Onları kesin olarak boyunduruk altına almalıyız."
 ROM_renew_the_romanian_polish_alliance:0 "Romanya-Polonya İttifakını Yenile"
 ROM_renew_the_romanian_polish_alliance_desc:0 "Polonya ile eski bağlarımız son yıllarda soğudu. Etrafımızdaki tehditler azalmadığı ve küresel siyasi durum giderek daha çalkantılı hale geldiği için, kuzey komşumuzla ittifakımızı canlandırma zamanı geldi."
 ROM_reserve_divisions:0 "Yedek Tümenler"
 ROM_reserve_divisions_desc:0 "Romanya küçük bir ulustur ve ordumuzun sahada herhangi bir dayanma gücüne sahip olması için yedek tümenlere uygun sayılar ayırmalıyız."
 ROM_revise_the_constitution:0 "Anayasayı Gözden Geçir"
 ROM_revise_the_constitution_desc:0 "Anayasa, Kralın ulusun lideri olarak konumunu sağlamlaştırmak için yeniden yazılmalıdır. Ayrıca, Kralın Vatan Nöbetçisi gençlik örgütünde daha güvenli bir alternatif sunarak tehlikeli aşırı sağ hareketler zayıflatılabilir."
 ROM_romanian_volunteer_brigades:0 "Rumen Gönüllü Tugayları"
 ROM_romanian_volunteer_brigades_desc:0 "Diğer uluslardaki tomurcuklanan devrimleri desteklemek amacıyla gönüllü tugaylar kuracağız."
 ROM_royal_guards_divisions:0 "Kraliyet Muhafızları Tümenleri"
 ROM_royal_guards_divisions_desc:0 "Kraliyet Muhafızlarımız, büyük Kralımıza uygun olarak genişletilmelidir."
 ROM_royal_guards_divisions_tt:0 "§Y7 Piyade§! ve §Y2 Topçu§! taburuna sahip bir birim kazanın.\n"
 ROM_secure_greece:0 "Yunanistan'ı Güvence Altına Al"
 ROM_secure_greece_desc:0 "Yunanistan - geçmişte sık sık bir müttefik olsa da - bölgedeki Rumen hakimiyetini kabul etmeye zorlanmalıdır."
 ROM_secure_the_bosporus:0 "Boğaz'ı Güvence Altına Al"
 ROM_secure_the_bosporus_desc:0 "Deniz erişimimiz şimdilik Karadeniz ile sınırlı. Türkiye, Boğaz'ı kontrol ederek, savaş durumunda Akdeniz'e erişimimizi engelleyebilir ve bu yüzden ihtiyacımız olduğunda serbest geçişi sağlamalıyız."
 ROM_securitate:0 "Securitate"
 ROM_securitate_desc:0 "Yeni hükümetimize yönelik iç tehditleri bastırmak için geniş bir gizli polis teşkilatı kurmalıyız."
 ROM_split_czechoslovakia:0 "Çekoslovakya'yı Böl"
 ROM_split_czechoslovakia_desc:0 "Çekoslovakya, kendi başına hayatta kalamayacak yapay bir yapıdır. Bu parçanın kaosa sürüklenmesine izin veremeyiz ve durum savunulamaz hale gelmeden müdahale etmeliyiz."
 ROM_strategic_bomber_force:0 "Stratejik Bombardıman Gücü"
 ROM_strategic_bomber_force_desc:0 "Askeri operasyonlar, sadece düşmanın sanayisini ve altyapısını yok etmekten sonra ikinci sıradadır. Stratejik bombalama, bunu başaracağımız araçtır."
 ROM_the_armored_division:0 "Zırhlı Tümen"
 ROM_the_armored_division_desc:0 "Tanklar ileriye giden yoldur ve bu yeni silahların gücünü kullanan özel tümenler kurmalıyız."
 ROM_the_armored_division_tt:0 "§Y4 [ROM_UnlockedArmor] Zırhlı§! ve §Y4 Motorlu§! taburlu iki birim kazanın.\n \n Teknoloji araştırılmışsa tümenlere §YKeşif Bölükleri§! ekler."
 ROM_the_cordon_sanitaire:0 "Sıhhi Kordon"
 ROM_the_cordon_sanitaire_desc:0 "Hem doğuda hem de batıda tehlikeli ideolojilerle çevriliyiz. Kuzey ve güneydeki komşularımızla birlikte, bu dogmaları karantinaya alacak ve daha fazla ilerlemelerini önleyecek bir bariyer kuracağız."
 ROM_the_maresal:0 "Mareșal"
 ROM_the_maresal_desc:0 "Mühendislerimiz, kapalı bir kazamata bir Sovyet 122mm obüs yerleştirme fikriyle geldiler. Bu tasarımı daha da geliştirerek, son derece başarılı bir tank modeli yaratma yolunda olabiliriz."
 ROM_the_royal_foundation:0 "Kraliyet Vakfı"
 ROM_the_royal_foundation_desc:0 "Kral, Rumen kültürünü incelemek ve ulusun bilimini yaratmak için kendi adına bir vakıf kurmayı lütfederek kabul etti."
 ROM_the_zb_53:0 "ZB-53"
 ROM_the_zb_53_desc:0 "Modern teçhizat savaşta anahtardır ve piyade silahlarımızı modernize etmeye çalışmalıyız."
 ROM_torpedo_boats:0 "Torpido Botları"
 ROM_torpedo_boats_desc:0 "Torpiller, deniz savaşının büyük dengeleyicisidir. Tüm gemilerimizin onları taşımasını sağlayarak, saf cüret ve torpido ateşi hacmiyle üstün bir gücü şaşırtıp yok edebiliriz."
 ROM_torpedo_bombers:0 "Torpido Bombardıman Uçakları"
 ROM_torpedo_bombers_desc:0 "Deniz zayıflığımızı, hava kuvvetlerimizin bir kısmını deniz görevlerine tahsis ederek telafi edebiliriz. Bu, bir torpido taşıyabilen yeni bir uçak modeli gerektirecektir."
 ROM_trade_treaty_with_germany:0 "Almanya ile Ticaret Antlaşması"
 ROM_trade_treaty_with_germany_desc:0 "Ülkemizdeki Alman ekonomik ilgisini biliyoruz. Petrol gibi malların artan teslimatını ayarlamak, ordumuzu modernize etmede Alman yardımını talep etmemizi sağlayacaktır."
 ROM_vanatori_de_munte:0 "Vânători de Munte"
 ROM_vanatori_de_munte_desc:0 "Vânători de Munte - Dağ Avcıları - seçkin dağ piyadelerimizdir. İtibaraları yurt dışında bile onlardan önce gelir ve bulabildiğimiz en iyilerle sayılarını artırmak iyi olur."
 ROM_vanatori_de_munte_unit_tt:0 "\n9 taburlu bir §YDağcı§! birimi kazanın.\n"
 ROM_war_college_tt:0 " §YBarbu Paraianu§! adında §Y2 Yetenekli§! bir General ortaya çıkacak."
 YUGOSLAV_DEFENCE_LEAGUE:0 "Balkan Savunma Ligi"
 YUG_abolish_the_monarchy:0 "Monarşiyi Kaldır"
 YUG_abolish_the_monarchy_desc:0 "Monarşi, modern zamanlar için pek uygun bir hükümet biçimi değildir, toplumsal görüşlerimizle tamamen uyumsuz olmasından bahsetmiyorum bile. Kaldırılmalı ve kraliyet yönetimi sıradan insanın sesiyle değiştirilmelidir."
 YUG_all_yugoslavian_regiments:0 "Tüm Yugoslav Alayları"
 YUG_all_yugoslavian_regiments_desc:0 "Halklarımız çeşitli olabilir, ancak hepsi ulusumuzu savunmak için hizmet etmelidir. Alaylarımızı düzenlerken etnik köken ayrımı yapmayacağız."
 YUG_allied_air_combat_school:0 "Müttefik Hava Muharebe Okulu"
 YUG_allied_air_combat_school_desc:0 "Yeni müttefiklerimiz hava muharebesi konusunda geniş deneyime sahip. Ortak bir Müttefik Hava Muharebe Okulu için bastırarak, pilot acemilerimizin müttefiklerimizin öğrenmek için kan döktüğü değerli dersleri özgürce öğrenmelerini sağlayabiliriz."
 YUG_anti_tank_defenses:0 "Anti-Tank Savunmaları"
 YUG_anti_tank_defenses_desc:0 "Tank modern savaşta merkez sahneye çıktıkça, piyadelerimizin bu zırhlı devleri alt etmelerini sağlayan tanksavar sahra topları alanında yeni gelişmeler gereklidir."
 YUG_armored_cavalry:0 "Zırhlı Süvari"
 YUG_armored_cavalry_desc:0 "Birlik taşıyıcılarımıza zırh kaplamak, hayatta kalma kabiliyetlerini, savaş güçlerini ve morallerini büyük ölçüde artırır. Ancak bu, kendi silahlarını da taşırken, araziye sıkışmadan ek ağırlığı taşıyabilen en azından kısmen paletli yeni bir araç tipi gerektirir."
 YUG_army_maneuvers:0 "Ordu Manevraları"
 YUG_army_maneuvers_desc:0 "Ordumuzu forma sokmak için yeni manevralar yapılmalıdır. Deneyim şüphesiz modern savaşta yeni anlayışlara da yol açacaktır."
 YUG_army_modernization:0 "Ordu Modernizasyonu"
 YUG_army_modernization_desc:0 "Savaşın yolları son çatışmadan bu yana değişti ve ordumuzun teçhizatını ve taktiklerini modernize ederek zamana ayak uydurmasını sağlamalıyız."
 YUG_arrest_ustasa_flag:0 "Yakın zamanda Ustaşa liderleri tutuklandı"
 YUG_arrest_ustasa_leaders:0 "Ustaşa Liderlerini Tutukla"
 YUG_arrest_ustasa_leaders_cooldown:0 "Ustaşa Liderlerini Tutukla"
 YUG_arrest_ustasa_leaders_cooldown_desc:0 "Ustaşa hareketindeki önemli şahsiyetlerin bir listesi var ve bundan yararlanıp bazı tutuklamalar yapmanın tam zamanı."
 YUG_arrest_ustasa_leaders_desc:0 "Ustaşa hareketindeki önemli şahsiyetlerin bir listesi var ve bundan yararlanıp bazı tutuklamalar yapmanın tam zamanı."
 YUG_artillery_regiments:0 "Topçu Alayları"
 YUG_artillery_regiments_desc:0 "Tümenlerimize güçlü topçu alayları ekleyerek genel savaş güçleri büyük ölçüde artırılacaktır."
 YUG_attract_allied_capital:0 "Müttefik Sermayesini Çek"
 YUG_attract_allied_capital_desc:0 "İngilizlerin ulusumuzu desteklemek için nedenleri var; ilk Büyük Savaş'tan beri uzun zamandır müttefikiz ve Müttefik uluslardan yatırımcıları çekerek, onlara uluslarımız arasındaki ilişkilerin kopmaz olduğuna dair güvence vereceğiz."
 YUG_attract_axis_capital:0 "Mihver Sermayesini Çek"
 YUG_attract_axis_capital_desc:0 "Ekonomimiz perişan bir durumda ve İtalyanların evimizde emelleri olduğu bir sır olmasa da, onlara ekonomik olarak direnmeye hazır olmak istiyorsak komşularımızla ticareti teşvik etmeliyiz."
 YUG_attract_foreign_capital:0 "Yabancı Sermayeyi Çek"
 YUG_attract_foreign_capital_desc:0 "Yakın diplomatik bağlarımızdan, yabancı sermaye ve yatırım akışını kolaylaştırarak faydalanabiliriz."
 YUG_autonomous_transylvania:0 "Slav Transilvanya için Özerklik"
 YUG_autonomous_transylvania_desc:0 "Banat ve Voyvodina bölgesi sadece Sırplara değil, aynı zamanda Rumenlere ve Macarlara da ev sahipliği yapıyor. Bu bölgelere özerklik ve özyönetim sunarak, bu bölgeler üzerindeki Rumen ve Macar iddialarına son verebiliriz."
 YUG_ban_fascists:0 "Faşist Partileri Yasakla"
 YUG_ban_fascists_desc:0 "Şimdi bile, ulusumuzda bir kültürü diğerlerinin üzerine koyan ve Yugoslav birliğinde egemenlik arayan partiler var. Bu insanların ulusumuzda yeri yok ve susturulmalılar."
 YUG_ban_slovene_nationalist_parties:0 "Sloven Milliyetçi Partilerini Yasakla"
 YUG_ban_slovene_nationalist_parties_desc:0 "Ulusumuzun iyiliği için bağımsızlık çığlıkları bastırılmalıdır. Milliyetçi siyasi unsurlar yasa dışı ilan edilecek ve bizi içeriden zayıflatmasınlar diye destekçileri zulüm görecek."
 YUG_banat_for_support:0 "Destek için Banat"
 YUG_banat_for_support_desc:0 "Macarların ve Rumenlerin kuzey Sırbistan'ı ilhak etmek istedikleri bir sır değil ve devletimize dış destek eksikliğiyle, bir dereceye kadar tanınma ve destek karşılığında bu toprakları devredebiliriz."
 YUG_bomber_license:0 "Bombardıman Uçağı Lisansı"
 YUG_bomber_license_desc:0 "Hava, savaşı düşmana taşıma konusunda yeni olanaklar açar ve bu nedenle, tüm lisanslı üretimimizi odaklamamız gereken şey bombardıman uçaklarıdır."
 YUG_bomber_project:0 "Bombardıman Uçağı Projesi"
 YUG_bomber_project_desc:0 "Savaşı düşmana taşımak için bombardıman uçaklarına ihtiyacımız var. Mühendislerimiz bu tipte yeni yerli tasarımlar geliştirmekle görevlendirilmelidir."
 YUG_brigadistas:0 "Tugaycılar"
 YUG_brigadistas_desc:0 "Birçok cesur Yugoslav vatandaşı, devam eden İspanya İç Savaşı'nda ortak düşmanlarımıza karşı savaşmak için haykırıyor."
 YUG_central_management:0 "Merkezi Yönetim"
 YUG_central_management_desc:0 "Yönetimin tüm yönleri üzerinde güçlü merkezi kontrol, üretim kotalarını sürdürme yeteneğimizi artıracaktır."
 YUG_claim_macedonia:0 "Makedonya'yı Talep Et"
 YUG_claim_macedonia_desc:0 "Makedonya'nın bazı kısımları hala sınırlarımızın dışında. Tüm Makedonlar Slav olduğu için, ulusumuza aittirler."
 YUG_coastal_defense:0 "Kıyı Savunması"
 YUG_coastal_defense_desc:0 "Adriyatik'teki rakiplerimizin filolarına meydan okumayı umamayız. Bunun yerine, kıyılarımızı onların deneyebileceği herhangi bir deniz çıkarmasını püskürtmek için hazırlamalıyız."
 YUG_coastal_defense_effect_tt1:0 "Kıyı şeridine §Y2 Kıyı Kalesi§! ekle\n"
 YUG_coastal_defense_effect_tt2:0 "§YDeniz Üssü§! konumlarına §Y1 Kıyı Kalesi§! ekle\n"
 YUG_concessions_for_macedonians:0 "Makedonlar için Tavizler"
 YUG_concessions_for_macedonians_desc:0 "Makedonların önde gelen gruplarına ulaşarak, şikayetlerini ele alacak ve devlete olan sadakatlerini kazanacağız."
 YUG_contest_the_adriatic:0 "Adriyatik'e Meydan Oku"
 YUG_contest_the_adriatic_desc:0 "Kıyılarımızın savunması, ötesinde yatan denizde başlar. Adriyatik Denizi'nin kontrolünü ele geçirmek veya en azından ona meydan okumak için yeni deniz taktikleri ve stratejileri geliştirmeliyiz."
 YUG_coronation:0 "Taç Giyme Töreni"
 YUG_coronation_desc:0 "Halkımız uzun zamandır bir Kraldan yoksundu ve tacın sürekliliğini gösterme zamanı geldi. Kralımızı Beyaz Şehir'in katedralinde taçlandırarak, halkımıza tacın ebedi olduğuna ve yabancı işgalcilere yenilmeyeceğimize dair güvence vereceğiz."
 YUG_croat_concession_flag:0 "Yakın zamanda tavizler verildi"
 YUG_croat_concessions:0 "Hırvatlar için Tavizler"
 YUG_croat_concessions_cooldown:0 "Hırvatlar için Tavizler"
 YUG_croat_concessions_cooldown_desc:0 "Ustaşa'ya karşı sert önlemler alma kararımızdan bu yana genel Hırvat halkına muamelemiz geniş çapta zalim ve insanlık dışı olarak görüldü. Belki de Hırvat halkına biraz hoşgörü göstererek, bize biraz daha olumlu bakmalarını sağlayabiliriz."
 YUG_croat_concessions_desc:0 "Ustaşa'ya karşı sert önlemler alma kararımızdan bu yana genel Hırvat halkına muamelemiz geniş çapta zalim ve insanlık dışı olarak görüldü. Belki de Hırvat halkına biraz hoşgörü göstererek, bize biraz daha olumlu bakmalarını sağlayabiliriz."
 YUG_croat_positive_dis_flag:0 "Yakın zamanda pozitif ayrımcılık tanındı"
 YUG_croat_raid_cooldown:0 "Hırvat Köylerine Baskınlar"
 YUG_croat_raid_cooldown_desc:0 "Ustaşa her yerde ve hiçbir yerde aynı anda ve herkes onların faşizm markasının bir destekçisi olabilir. Hırvatistan bölgesindeki tüm kasaba ve köylere baskın yapmalı ve oradaki hainleri bulup çıkarmalıyız."
 YUG_croatian_recruitment:0 "Hırvat İşe Alım Seferberliği"
 YUG_croatian_recruitment_desc:0 "Bağımsızlık sorusu her Hırvat'ın dilinde, ancak hepsi bir Ustaşa hükümetini bir Yugoslav hükümetine tercih etmiyor. Saflarımıza bir avuç sadık kişiyi katma ve Hırvat halkına Hırvatistan'ın Yugoslavya'nın sıcak kucağında güvenle kalmasını tercih edenler olduğunu gösterme zamanı geldi."
 YUG_crush_the_ustasa:0 "Ustaşa'yı Ez"
 YUG_crush_the_ustasa_desc:0 "Hırvat aşırı milliyetçi hareketi Ustaşa, başımıza giderek daha fazla bela oluyor. Artık bir terör örgütünden başka bir şey olarak kabul edilemez ve ulusun iyiliği için kökü kazınmalıdır."
 YUG_crush_ustasa:0 "Yaklaşan Ustaşa Ayaklanması"
 YUG_crush_ustasa_desc:0 "Hükümetin faşist Ustaşa grubuna karşı sert önlemler alma kararı, Hırvat bağımsızlığı destekçilerini kışkırttı ve Ustaşa, hükümete karşı silahlı bir ayaklanma için hızla hazırlanıyor. Bu faşist örgütü zamanında dağıtamazsak, Ustaşa yerel Hırvat hükümetini alt edebilir ve devletimize karşı isyan bayrağını çekebilir."
 YUG_defence_army_of_yugoslavia:0 "Yugoslavya Savunma Ordusu"
 YUG_defence_army_of_yugoslavia_desc:0 "Birliğimiz için savaşmak ortalama bir vatandaştan istemek zor bir şey, ama kendi evi için savaşmak her insanın görevidir. Ufukta bağımsızlık vaadiyle, birliğimiz düşmanımızla savaşmaya istekli erkeklerle dolup taşıyor; tek ihtiyaçları olan hükümet desteği."
 YUG_defence_league:0 "Yugoslav Savunma Ligi"
 YUG_defence_league_desc:0 "Devletimizin üyelerine büyük düzeyde özerklik verildi; geriye kalan tek şey son adımdır. Tüm Balkan uluslarının bağımsızlığını resmi olarak tanıyarak, Yugoslavya'yı bir ulustan birçok ulusun ekonomik ve askeri bir kooperatifine dönüştüreceğiz."
 YUG_delay_ustasa_uprising:0 "Ayaklanmayı Geciktir"
 YUG_delay_ustasa_uprising_desc:0 "Ustaşa yükselişteyken, hükümetin Hırvat isyanını geciktirmek için önlemler alması zorunludur. Bu tür çabalar aynı zamanda Hırvat milliyetçiliğini kesin olarak sona erdirme operasyonlarımızı da geciktirecek olsa da, ayaklanmayı geciktirmek gerekli olabilir."
 YUG_designer_tt:0 "Bu şirketin kilidini bir uçak tasarımcısı olarak açar.\n"
 YUG_develop_civilian_industry:0 "Sivil Sanayiyi Geliştir"
 YUG_develop_civilian_industry_desc:0 "Sivil sanayimiz, askeri muadiline makine ve diğer temel ihtiyaçları sağlamak için ayak uydurmalıdır."
 YUG_develop_military_industry:0 "Askeri Sanayiyi Geliştir"
 YUG_develop_military_industry_desc:0 "Modern bir ordu, yeni uçakların gerekli üretimini desteklemek için ağır bir sanayi tabanı gerektirir."
 YUG_develop_slovenian_industry:0 "Sloven Sanayisini Geliştir"
 YUG_develop_slovenian_industry_desc:0 "Uzun süredir ihmal edilmiş olsa da, Slovenya yeni bir sanayi merkezi yaratmak için bolca alana sahip. Bu ayrıca Slovenleri büyük ölçüde memnun edecektir."
 YUG_devolved_croatia:0 "Devredilmiş bir Hırvatistan"
 YUG_devolved_croatia_desc:0 "Birliğin muhalefetinde hiçbiri Hırvatlar kadar sesli değil. Şu anda Hırvatistan, kuzeyde Sava Banlığı ile güneyde Kıyı Banlığı arasında bölünmüş durumda. Bu Banlıklara bireysel özerklik verirsek, hem Hırvat muhalefetini yatıştırabilir hem de Hırvatların birlikte çok etkili olmasını önleyebiliriz."
 YUG_dissolve_serbia:0 "Sırbistan Banlığı'nı Dağıt"
 YUG_dissolve_serbia_desc:0 "“Sırbistan” olarak gördüğümüz bölge aslında kendilerini Sırp olarak görmeyen birçok insana ev sahipliği yapıyor. Makedonlar, Arnavutlar ve Karadağlılar, Sırp olduğunu iddia ettiğimiz bölgelerde yaşıyorlar. Kültürlerinin işgalcileri olarak algılanmamıza izin vermemeliyiz ve haklı olarak Sırp olarak gördüğümüz şeyleri yeniden düşünmeliyiz."
 YUG_divide_bosnia:0 "Bosna'yı Böl"
 YUG_divide_bosnia_desc:0 "Bosna bölgesinin manzarasında kültürel ve dini bölünmeler var; Sırplar, Hırvatlar, Müslümanlar, Hristiyanlar ve sayısız başka halk. Bölgenin düzgün bir şekilde savunulmasının tek yolu, birliğimizle uyum içinde çalışan ayrı Bosna ve Hersek devletleri arasında uygun şekilde bölünmesidir."
 YUG_domestic_artillery_production:0 "Yerli Topçu Üretimi"
 YUG_domestic_artillery_production_desc:0 "Modern, yerli topçu modellerinin geliştirilmesini teşvik ederek, kuvvetlerimizin sağlayabileceğimiz en iyi ateş desteğine sahip olmasını sağlayabiliriz."
 YUG_end_recruitment_flag:0 "Yakın zamanda işe alım merkezleri kapatıldı"
 YUG_end_the_regency:0 "Naipliği Sona Erdir"
 YUG_end_the_regency_desc:0 "Prens Pavle tacına yeterince uzun süre hizmet etti. Ufukta savaş varken, halkımızın Kralının ulusumuzu kıracak faşistlere ve komünistlere karşı güçlü durduğunu görmesi gerekiyor."
 YUG_enforced_neutrality:0 "Zorunlu Yugoslav Tarafsızlığı"
 YUG_enforced_neutrality_desc:0 "Balkanların bu çalkantılı küresel çatışmanın bir parçası olmasına izin veremeyiz. Tarafsızlığımızı ilan etmeli ve bizi kavgalı dünya güçleriyle aynı hizaya getirecek herhangi bir eylemden kaçınmalıyız."
 YUG_establish_the_banovina_of_croatia:0 "Hırvatistan Banlığı'nı Kur"
 YUG_establish_the_banovina_of_croatia_desc:0 "Yarı özerk bir Hırvatistan Banlığı kurarak, umarım gerçek bağımsızlık çağrılarını bastırabiliriz."
 YUG_evolution:0 "Evrim"
 YUG_evolution_desc:0 "Bazıları ulusumuzun düşmanlık içinde yaşayan çeşitli kültürlerin istikrarsız bir birliği olduğunu iddia etse de, yabancı işgalcileri püskürtebilmemizin tek yolunun tek bir birim olarak birlikte durmak olduğunu kesin olarak biliyoruz. Halkımızı birleştirmek ve bizi bölmek isteyenleri ezmek için çaba göstermeliyiz."
 YUG_expand_the_mining_industry:0 "Madencilik Sanayisini Genişlet"
 YUG_expand_the_mining_industry_desc:0 "Tomurcuklanan savaş makinemizi beslemek için bol miktarda kaynağa ihtiyacımız var. Yerli madencilik sanayimizi genişletmeye bakmalıyız."
 YUG_expand_the_sarajevo_arsenals:0 "Saraybosna Cephaneliklerini Genişlet"
 YUG_expand_the_sarajevo_arsenals_desc:0 "Ordumuzun artan ihtiyaçlarına ayak uydurmak için daha fazla üretim kapasitesine ihtiyacımız var. Saraybosna cephanelikleri genişleme için birinci sınıf bir adaydır, bu yüzden derhal kaynak ayıracağız."
 YUG_expand_the_serbian_shipyards:0 "Sırp Tersanelerini Genişlet"
 YUG_expand_the_serbian_shipyards_desc:0 "Bölge, daha büyük savaş gemilerinin kolay üretimine izin veren tesislere sahip olmasa da, Karadağ bölgesinde geniş tersaneler kurmak, Hırvat özerkliği konusundaki gelecekteki politikalarımızdan bağımsız olarak onlar üzerindeki kontrolümüzü sürdürmemizi sağlayacaktır."
 YUG_expand_the_split_shipyards:0 "Split Tersanelerini Genişlet"
 YUG_expand_the_split_shipyards_desc:0 "Dalmaçya'daki mevcut gemi inşa sanayimiz genişleme için birinci sınıf bir adaydır ve daha büyük savaş gemileri için bol miktarda tesise sahiptir. Ancak, Hırvatların artan özerklik çığlıkları, sonunda tesisler üzerindeki doğrudan kontrolümüzü kaybetmemize yol açabilir."
 YUG_expand_the_submarine_fleet:0 "Denizaltı Filosunu Genişlet"
 YUG_expand_the_submarine_fleet_desc:0 "Düşmanla zayıf donanmamızla kafa kafaya çarpışmak yerine, düşmanı taciz etmek ve ticari gemilerini hedeflemek için denizaltılara odaklanmalıyız."
 YUG_expand_the_university_of_belgrad:0 "Belgrad Üniversitesi'ni Genişlet"
 YUG_expand_the_university_of_belgrad_desc:0 "En prestijli üniversitemizi büyüterek, araştırma ve geliştirme ekiplerimize parlak beyinlerin akışını artırabiliriz."
 YUG_expand_the_university_of_ljubljana:0 "Ljubljana Üniversitesi'ni Genişlet"
 YUG_expand_the_university_of_ljubljana_desc:0 "Slovenya'daki üniversitemizi genişleterek, nüfusumuzu eğitmek için bir kurum daha elde etmiş olacağız."
 YUG_expand_the_university_of_zagreb:0 "Zagreb Üniversitesi'ni Genişlet"
 YUG_expand_the_university_of_zagreb_desc:0 "Eski Zagreb Üniversitesi uzun zamandır önde gelen yüksek öğrenim kurumlarından biri olmuştur. Ek fonlar, değerli araştırmalar da sunmasını sağlayacaktır."
 YUG_exploit_the_pannonian_deposits:0 "Pannonian Yataklarını İşlet"
 YUG_exploit_the_pannonian_deposits_desc:0 "Topraklarımızda bulunan petrol yataklarını işletmeliyiz. Miktar yetersiz olsa da, savaş makinemiz için elimizden gelen her şeye ihtiyacımız var."
 YUG_federal_defense_council:0 "Federal Savunma Konseyi"
 YUG_federal_defense_council_desc:0 "Tüm bölgeler, büyük ulusumuzun savunmasında bir sese sahip olmalıdır. Bu, pratik olarak mümkün olan en çok sesin duyulmasını ve ayrımcılığın liyakati daha doğmadan engellememesini sağlamada uzun bir yol kat edecektir."
 YUG_fighter_license:0 "Avcı Uçağı Lisansı"
 YUG_fighter_license_desc:0 "Hava kuvvetlerimiz için lisanslı avcı uçağı üretimine odaklanmalıyız, çünkü bombardıman uçakları zaten avcı koruması olmadan işe yaramaz."
 YUG_form_parachute_battalions:0 "Paraşütçü Taburları Kur"
 YUG_form_parachute_battalions_desc:0 "Üçüncü boyutu kullanarak, düşman hatlarının çok gerisinde, beklenmedik yönlerden yerlere saldırabiliriz. Özel hava indirme taburları kurmak, hava gücümüzden en iyi şekilde yararlanmamızı sağlayacaktır."
 YUG_form_peasant_councils:0 "Köylü Konseyleri Kur"
 YUG_form_peasant_councils_desc:0 "Çalışan adam yerel siyasette daha büyük bir varlık kazanmalı. Köylü konseyleri kurmak, seslerinin duyulmasında uzun bir yol kat edecektir."
 YUG_form_the_federal_republic:0 "Federal Cumhuriyeti Kur"
 YUG_form_the_federal_republic_desc:0 "Tüm üye halkların hoş karşılandığı gerçek bir federalist devlet kurma zamanı geldi. Son birkaç on yıldır olduğumuz içten parçalanmış ulus artık olmayacak."
 YUG_fortify_banat:0 "Banat'ı Tahkim Et"
 YUG_fortify_banat_desc:0 "Macarlar ve Rumenler endişe verici bir şekilde düşmanlarımıza yaklaşıyor. Sırbistan'ı ve özerk himayelerini korumak istiyorsak kuzeyde hızlı tahkimatlar gereklidir."
 YUG_fortress_yugoslavia:0 "Kale Yugoslavya"
 YUG_fortress_yugoslavia_desc:0 "Sınırımızdaki Nazi tehdidinin kontrolsüz kalmasına izin veremeyiz! Zara'da İtalyanlar ve Avusturya'da Almanlar varken, sınırlarımızın korunduğundan ve oradaki askerlerin faşistlerle savaşmak için ihtiyaç duydukları her şeye sahip olduğundan emin olmalıyız."
 YUG_friendship_treaty_with_italy:0 "İtalya ile Dostluk Antlaşması"
 YUG_friendship_treaty_with_italy_desc:0 "En güçlü acil komşumuz olarak, İtalya'nın bizi dost olarak görmesi zorunludur. İki ulusumuz arasında bir dostluk ilanı için müzakerelere başlayacağız."
 YUG_german_military_mission:0 "Alman Teknolojik Gözetimi"
 YUG_greater_yugoslavia:0 "Büyük Yugoslavya"
 YUG_greater_yugoslavia_desc:0 "Tüm güney Slavları bayrağımız altında birleşene kadar dinlenemeyiz. Bulgarlar kendilerini ulusumuzun bir parçası olarak görmeyebilirler, ama biz kesinlikle görüyoruz."
 YUG_guarantee_religious_liberties:0 "Dini Özgürlükleri Garanti Et"
 YUG_guarantee_religious_liberties_desc:0 "Herkesin seçtiği dini takip etmesine izin verilmelidir. Bu etkiyi yaratacak yasal garantiler getireceğiz."
 YUG_heavy_cruiser_project:0 "Ağır Kruvazör Projesi"
 YUG_heavy_cruiser_project_desc:0 "Düşman donanmalarına yeterince meydan okumak için daha büyük tonaj ve daha ağır silahlanmaya ihtiyacımız var. Ağır kruvazörler, şimdiye kadar filomuzun temel direkleri olarak kullandığımız hafif kruvazörlerden iyi bir adım olacaktır."
 YUG_heavy_fighter_project:0 "Ağır Avcı Uçağı Projesi"
 YUG_heavy_fighter_project_desc:0 "Avcı uçaklarımız, daha savunmasız bombardıman uçaklarını destekleyebilmelidir. Bu, biraz hız ve manevra kabiliyeti pahasına daha ağır silahlanma ve daha uzun menzil gerektirir."
 YUG_ikarus:0 "Ikarus"
 YUG_ikarus_desc:0 "En eski uçak sanayimiz olan Novi Sad'daki Ikarus tesisleri, yeni hava kuvvetlerimiz için gereken artan üretime hazırlanmak üzere genişletilmelidir."
 YUG_improve_light_industry:0 "Hafif Sanayiyi İyileştir"
 YUG_improve_light_industry_desc:0 "Zaten iç huzursuzluğumuz var ve bu yüzden hafif sanayinin geride kalmasına izin vermek, halkı günlük yaşamda ihtiyaç duydukları temel ihtiyaçlardan mahrum bırakmak olmaz."
 YUG_improve_serbian_rail_network:0 "Sırp Demiryolu Ağını İyileştir"
 YUG_improve_serbian_rail_network_desc:0 "Dış vilayetlerde demiryolu ağları kurmayı ihmal edebiliriz. En önemli alanlar merkez ve doğudur."
 YUG_independent_engineer_regiments:0 "Bağımsız İstihkam Alayları"
 YUG_independent_engineer_regiments_desc:0 "Hareketlilik modern askeri doktrinde anahtardır, ancak arazi her zaman buna izin vermeyebilir. Tümenlerimize yerleştirilmiş özel istihkam alayları, tümenin her türlü arazide hareketini kolaylaştırmak için çalışacaktır."
 YUG_industrialization_program:0 "Sanayileşme Programı"
 YUG_industrialization_program_desc:0 "Komşularımızın yeniden silahlanma programlarına ayak uydurmak istiyorsak hızlı bir sanayileşme programı gereklidir."
 YUG_integrated_rail_network:0 "Entegre Demiryolu Ağı"
 YUG_integrated_rail_network_desc:0 "Ulusal demiryolu ağlarını ülkenin her yerinde eşit olarak genişletmeliyiz. Ulusumuzun hiçbir parçası diğerlerinden daha önemli değildir."
 YUG_invite_albania:0 "Arnavutluk'u Davet Et"
 YUG_invite_albania_desc:0 "Arnavutluk, küçük olmasına rağmen, bizim için stratejik öneme sahip bir bölgeyi yönetiyor. Onları Kongremize dahil ederek, güney sınırımızın çoğunu güvence altına alabilir ve güçlerini bizimkine ekleyebiliriz."
 YUG_invite_bulgaria:0 "Bulgaristan'ı Davet Et"
 YUG_invite_bulgaria_desc:0 "Bulgaristan'daki Slav kardeşlerimizin Komünizme giden yolu bulmaları için liderliğimize ihtiyaçları var. Ayrıca, doğu kanadımızı işgal ettikleri için, onları saflarımıza katmak sınırlarımızın büyük bir bölümü hakkında endişelenmeyi bırakmamızı sağlayacak ve askeri güçleri Devrimi yaymada çok faydalı olacaktır."
 YUG_invite_german_military_mission:0 "Alman Askeri Heyetini Davet Et"
 YUG_invite_german_military_mission_desc:0 "Ordumuzun Almanlara olan hoşnutsuzluğunun üstesinden gelinmelidir. Bir askeri heyet davet etmek, kurmaylarımıza birlikte çalışmanın bolca faydası olduğunu göstermede uzun bir yol kat edecektir."
 YUG_invite_greece:0 "Yunanistan'ı Davet Et"
 YUG_invite_greece_desc:0 "Yunanistan'ın genç erkekleri ve kadınları efendilerinin demir çizmeleri altında acı çekiyor ve ancak yoksullarını ve ezilmişlerini silahlandırarak onları bağlayan zincirleri kırabiliriz."
 YUG_invite_hungary:0 "Macaristan'ı Davet Et"
 YUG_invite_hungary_desc:0 "Macar devleti, Habsburg monarşisinin çöküşünden bu yana belirsiz ve değişken olmuştur. Bizim yardımımızla, Macar halkı devletlerinin gerçek biçimini birleşik bir komünist diktatörlükte bulacaktır!"
 YUG_invite_italian_naval_experts:0 "İtalyan Denizcilik Uzmanlarını Davet Et"
 YUG_invite_italian_naval_experts_desc:0 "Akdeniz müttefiklerimiz gemi tasarımı ve inşası konusunda üstün bilgiye sahiptir. Bilgilerini bize miras bırakmaları için İtalyan uzmanları davet edeceğiz."
 YUG_invite_romania:0 "Romanya'yı Davet Et"
 YUG_invite_romania_desc:0 "Rumenler, aristokrasinin ve kapitalizmin bir ülkeye verebileceği zararı görmüş bir aristokrat toplumda yaşıyorlar. Artık yozlaşmış hükümdarlarının dönek elleri altında acı çekmeyecekler; kendi kaderlerinin efendisi olacaklar!"
 YUG_invite_turkey:0 "Türkiye'yi Davet Et"
 YUG_invite_turkey_desc:0 "Türk halkı on yılı aşkın bir süre önce Halifelerinden kurtarıldı, hâlâ burjuva efendilerinden kurtarılmadı. Türkiye Cumhuriyet Halk Partisi her ne kadar “sosyal demokrasi” olduğunu iddia etse de gerçekte halklarının zincirlerini kırmayı tamamen başaramadılar ve Balkanlardaki tüm emekçileri gerçek anlamda ancak doğrudan Yugoslavya müdahalesiyle özgürleştirebiliriz."
 YUG_join_allies:0 "Kraliyet İttifakı"
 YUG_join_allies_desc:0 "Artık Kralımız mutlu bir şekilde evli olduğuna göre, komşularımızın hedefi olursak askeri güçlerine güvenebilmemiz için bağlılığımızı kamuoyuna duyurmalıyız."
 YUG_join_axis:0 "Üçlü Pakt'ı İmzala"
 YUG_join_axis_desc:0 "Birçoğu Yugoslavya'nın Müttefik güçlerle birleşmesini ve faşizme direnmesini istese de, bunun sadece savaş ve kaosla sonuçlanacak umutsuz bir hırs olduğunu biliyoruz. Almanlar, İtalyanlar ve Japonlarla karşılıklı askeri ve ekonomik işbirliği paktına katılma fırsatı verildi ve bunu derhal değerlendirmeliyiz."
 YUG_join_comintern:0 "Komintern'e Katıl"
 YUG_join_comintern_desc:0 "Devrimin ilerlemesi için en iyi yol, Komintern'deki yoldaş komünist devletlerimizle birlikte durmaktır."
 YUG_license_production:0 "Lisanslı Üretim"
 YUG_license_production_desc:0 "Yeni uçak edinme süreci, onları lisans altında kendimiz üreterek kolaylaştırılabilir. Mümkün olan en kısa sürede böyle bir düzenleme kuracağız."
 YUG_limited_self_government:0 "Sınırlı Özyönetim"
 YUG_limited_self_government_desc:0 "Ulusumuzdaki bölünmeler açıkça basit bir reformla başa çıkılamayacak kadar derin ve çok. Ancak ulusumuzu oluşturan çeşitli halklara özerklik vererek birliğimizi güç kullanmadan bir arada tutabiliriz."
 YUG_listening_post_flag:0 "Yakın zamanda dinleme noktaları kuruldu"
 YUG_listening_posts_cooldown:0 "Hırvatistan'da Dinleme Noktaları Kur"
 YUG_listening_posts_cooldown_desc:0 "Ustaşa şimdi yeraltında faaliyet gösteriyor, tespit edilmekten kaçınıyor ve ihanetlerini kapalı kapılar ardında planlıyor. Belki de bazı Yugoslavya sadıklarını Ustaşa'ya katılmaya ikna ederek, bölgedeki operasyonlarını ve propaganda kampanyalarını dinleyebilir ve bozabiliriz."
 YUG_listening_posts_croatia:0 "Hırvatistan'da Dinleme Noktaları Kur"
 YUG_listening_posts_croatia_desc:0 "Ustaşa şimdi yeraltında faaliyet gösteriyor, tespit edilmekten kaçınıyor ve ihanetlerini kapalı kapılar ardında planlıyor. Belki de bazı Yugoslavya sadıklarını Ustaşa'ya katılmaya ikna ederek, bölgedeki operasyonlarını ve propaganda kampanyalarını dinleyebilir ve bozabiliriz."
 YUG_local_developers:0 "Yerel Geliştiriciler"
 YUG_local_developers_desc:0 "Yerel uçak geliştirme desteğini artırmalıyız, bu da ortaya çıkan uçak modelleri üzerinde daha fazla kontrol sahibi olmamızı ve sanayimiz için bir teşvik sağlamamızı sağlar."
 YUG_local_militias:0 "Yerel Milisler"
 YUG_local_militias_desc:0 "Halk, anavatanlarının savunmasında milisler kurmaya teşvik edilecek. Bu, nüfusun daha büyük bir bölümünün daha sonra askeri hizmete alınmaya uygun olmasını sağlayacaktır."
 YUG_local_self_management:0 "Yerel Özyönetim"
 YUG_local_self_management_desc:0 "Artan yerel özyönetime izin vermek, yerel kaynakların kullanımını ve yeni inşaat projelerinin verimliliğini artıracaktır."
 YUG_medal_for_extreme_bravery:0 "Aşırı Cesaret Madalyası"
 YUG_medal_for_extreme_bravery_desc:0 "Her taraftan saldırı altında çalışan askerlerimizin kahramanca çabaları, onların yiğit ruhunu anmak için yeni bir onur yaratılmasını gerektiriyor."
 YUG_modern_destroyers:0 "Modern Muhripler"
 YUG_modern_destroyers_desc:0 "Muhripler her donanmanın bel kemiğidir ve bizimkilerin rakiplerimizinkinden aşağı olmadığından emin olmalıyız."
 YUG_modern_tanks:0 "Modern Tanklar"
 YUG_modern_tanks_desc:0 "Büyük kalibreli ana silahların eklenmesiyle, zırhlı teknoloji, kuvvetleri A noktasından B noktasına güvenli bir şekilde taşıma niyetinin çok ötesine geçti. Komşularımızla rekabet edebilmek için modern tankların kendi versiyonumuzu geliştirmeliyiz."
 YUG_modernize_the_air_force:0 "Hava Kuvvetlerini Modernize Et"
 YUG_modernize_the_air_force_desc:0 "Hava kuvvetlerimiz feci şekilde modası geçmiş. Kendi topraklarımız üzerindeki hava sahasını savunma konusunda makul bir şansımız olması bir yana, savaşı düşmana taşımak için bile, köklü bir modernizasyon programına ihtiyacımız var."
 YUG_motorize_the_cavalry:0 "Süvariyi Motorize Et"
 YUG_motorize_the_cavalry_desc:0 "Otomotiv mühendisliğindeki yeni gelişmeler, ordu birimlerinin potansiyel hızını ve hareketliliğini devrimleştirdi. Süvari birimlerimiz atı bırakıp yerine kamyonlarla donatılmalıdır."
 YUG_motorized_logistics:0 "Motorlu Lojistik"
 YUG_motorized_logistics_desc:0 "Motorizasyon, temel ihtiyaçların ve özel teçhizatın cephe birliklerine ayak uydurmasını sağlamak için umut verici yeni yollar açar. Bu, kuvvetlerimizin her zaman en iyi savaş koşulunda olmasını sağlar."
 YUG_motorized_recon_companies:0 "Motorlu Keşif Bölükleri"
 YUG_motorized_recon_companies_desc:0 "Düşman oluşumları ve konumları hakkında yeterli bilgi edinmek için, ana gövdemizin ilerlemesinin önünde büyük mesafeleri kat edebilen özel, motorlu keşif bölüklerine ihtiyacımız var."
 YUG_mountain_brigades:0 "Dağ Tugayları"
 YUG_mountain_brigades_desc:0 "Ulusumuzun büyük bir kısmı dağlardan oluşuyor, bu da bu tür arazide savaşta uzmanlaşmış özel tugayların kurulmasını gerektiriyor."
 YUG_mutual_economic_aid:0 "Karşılıklı Ekonomik Yardım"
 YUG_mutual_economic_aid_desc:0 "Sovyetler Birliği ve Yugoslavya'nın birbirine ekonomik olarak sunacağı çok şey var. Karlı ticaret anlaşmaları ve ekonomik yardım düzenlemeleri kurarak birbirimize büyük ölçüde fayda sağlayabiliriz."
 YUG_naval_bombers:0 "Deniz Bombardıman Uçakları"
 YUG_naval_bombers_desc:0 "Adriyatik uzun ama dardır, bu da onu hava alanlarımızdan kalkan uçaklar için kolayca erişilebilir kılar. Özel deniz bombardıman uçağı modelleri geliştirerek, bu donanmamızın daha güçlü rakiplere karşı şansını önemli ölçüde artırabilir."
 YUG_non_discriminating_officer_promotions:0 "Ayrımcı Olmayan Subay Terfileri"
 YUG_non_discriminating_officer_promotions_desc:0 "Ayrımcı politikalarımız geri alınmalı ve bundan sonra tüm etnik kökenlerin subay kadememizde yükselmesine izin verilmelidir. Bu, elde edebileceğimiz en yetenekli askeri liderliği sağlayacaktır."
 YUG_pan_balkan_workers_congress:0 "Pan-Balkan Girişimi"
 YUG_pan_balkan_workers_congress_desc:0 "Yakın Güney komşularımızda sosyalizm ideallerini güvence altına almış olsak da, Balkanlar boyunca monarşist ve burjuva diktatörlükleri altında acı çeken sayısız insan var. Sadece Romanya, Macaristan ve Yunanistan işçilerini kurtararak Balkan işçilerini kurtardığımızı söyleyebiliriz."
 YUG_pan_slavic_workers_congress:0 "Pan-Slav İşçi Kongresi"
 YUG_pan_slavic_workers_congress_desc:0 "Slav işçileri davaları için savaşmak üzere birleşmeli ve Sovyetler Birliği Balkan işçilerinin sıkıntısını anlamadığı için, liderlik görevini kendimiz üstleneceğiz."
 YUG_peasant_uprisings:0 "Köylü Ayaklanmalarını Kışkırt"
 YUG_peasant_uprisings_desc:0 "Balkan halkı emperyalizmin çizmeleri altında yeterince acı çekti! Balkanların acı çeken alt sınıflarına ulaşacak ve burjuvazi haklı olarak dize getirilene kadar onları grevler ve gösteriler halinde örgütleyeceğiz!"
 YUG_positive_discrimination_croat:0 "Hırvatlar için Pozitif Ayrımcılık"
 YUG_positive_discrimination_croat_cooldown:0 "Hırvatlar için Pozitif Ayrımcılık"
 YUG_positive_discrimination_croat_cooldown_desc:0 "Hırvatistan'ın kendisi Hırvatların yanı sıra birçok kültüre ve halka ev sahipliği yapıyor. Belki de Hırvatları iş fırsatları ve vergi kolaylığı konusunda tercih eden yasalar getirerek, onlara Ustaşa'nın vaat ettiği kendi kaderini tayin etme yanılsamalarını verebiliriz."
 YUG_positive_discrimination_croat_desc:0 "Hırvatistan'ın kendisi Hırvatların yanı sıra birçok kültüre ve halka ev sahipliği yapıyor. Belki de Hırvatları iş fırsatları ve vergi kolaylığı konusunda tercih eden yasalar getirerek, onlara Ustaşa'nın vaat ettiği kendi kaderini tayin etme yanılsamalarını verebiliriz."
 YUG_progress_crushing_decisions:0 "Ustaşa'ya Karşı Sert Önlemler"
 YUG_progress_crushing_decisions_desc:0 "Faşist Ustaşa grubunu ortadan kaldırma zamanı geldi ve birçok kişi bu eylemleri kendilerinin de faşizm eylemleri olarak görse de, bu önlemlerin devletimizin devam eden istikrarını sağlamak için kesinlikle gerekli olduğunu biliyoruz."
 YUG_purchase_foreign:0 "Yabancı Satın Al"
 YUG_purchase_foreign_desc:0 "İyi avcı uçakları geliştirmek için bizim harcayabileceğimizden çok daha fazla kaynak harcayan başka uluslar var. Kendi başımıza deneme yanılma yoluyla geliştirme zahmetine girmek yerine onların uçaklarını satın almalıyız."
 YUG_raid_croat_villages:0 "Hırvat Köylerine Baskınlar"
 YUG_raid_croat_villages_desc:0 "Ustaşa her yerde ve hiçbir yerde aynı anda ve herkes onların faşizm markasının bir destekçisi olabilir. Hırvatistan bölgesindeki tüm kasaba ve köylere baskın yapmalı ve oradaki hainleri bulup çıkarmalıyız."
 YUG_raid_villages_flag:0 "Yakın zamanda Hırvat köylerine baskın yapıldı"
 YUG_rare_minerals_exploitation:0 "Nadir Minerallerin İşletilmesi"
 YUG_rare_minerals_exploitation_desc:0 "Daha önce işletilmeyen nadir metal yatakları birdenbire büyük önem kazandı. Onlardan yararlanmak için gerekli madenleri ve altyapıyı derhal inşa etmeliyiz."
 YUG_reclaim_istria_and_zadar:0 "İstirya ve Zadar'ı Geri Al"
 YUG_reclaim_istria_and_zadar_desc:0 "İtalya hala İstirya ve Zadar topraklarını elinde tutuyor. Onları eve getirme zamanı geldi."
 YUG_recognize_the_soviet_union:0 "Sovyetler Birliği'ni Tanı"
 YUG_recognize_the_soviet_union_desc:0 "Tarihsel olarak Doğu'daki Bolşevik devletini tanımayı reddetmiş olsak da, belki de bu konudaki tutumumuzu yeniden gözden geçirme zamanı gelmiştir. Batı Demokrasileri küçük güçleri savunmak için çok zayıf görünürken, Sovyetler Birliği daha güvenilir bir dost olduğunu kanıtlayabilir."
 YUG_recruitment_flag:0 "Zaten Hırvatlar işe alındı"
 YUG_reinforce_old_alliances:0 "Eski İttifakları Güçlendir"
 YUG_reinforce_old_alliances_desc:0 "Ulusumuzun kuruluşundan bu yana Fransa ve Büyük Britanya'nın büyük Avrupa demokrasilerinin desteğini aldık. Gelecekteki ittifaklara hazırlık olarak bu ilişkileri sağlamlaştırma zamanı geldi."
 YUG_replace_the_dalmacija:0 "Dalmacija'yı Değiştir"
 YUG_replace_the_dalmacija_desc:0 "Eski Alman kruvazörü Dalmacija, eski bir tasarıma sahiptir. Onun yerine geçecek ve Adriyatik filomuzun bel kemiği olarak hizmet edecek yeni, modern bir kruvazör tipine ihtiyacımız var."
 YUG_research_collaboration:0 "Araştırma İşbirliği"
 YUG_research_collaboration_desc:0 "Müttefiklerimizin bizimkinden çok daha fazla kaynağı var, bu yüzden teknolojik atılımlarından pay almamızı sağlayacak bir araştırma işbirliği için bastırmalıyız."
 YUG_reunite_the_kingdom:0 "Krallıkları Yeniden Birleştir"
 YUG_reunite_the_kingdom_desc:0 "Birçok kişi bu eylemin Yugoslavya'yı karakterize eden ayrılık ve kültürel çatışmalara geri dönme riski taşıdığından endişe etse de, sınırımızdaki daha büyük tehditlerle yüzleşmek için ulusumuzu yeniden tek bir varlık haline getirmeliyiz."
 YUG_rogozarski:0 "Rogožarski"
 YUG_rogozarski_desc:0 "Ikarus'tan kısa bir süre sonra kurulan 'Živojin Rogožarski'nin İlk Sırp Uçak Fabrikası', mevcut üretim taleplerine ayak uydurmak istiyorsa genişletilmelidir."
 YUG_royal_alliance_tt:0 "Kraliyet evliliği ortağımızın ittifakına katılmaya çalışacağız.\nOrtağımızın Prenses Alexandra olması durumunda, Müttefiklere katılmaya çalışacağız."
 YUG_royal_party:0 "Karađorđević Hanedanı"
 YUG_royal_wedding:0 "Kraliyet Düğünü"
 YUG_royal_wedding_desc:0 "Kraliyet evlilikleri uzun zamandır ittifakları güvence altına almanın bir yolu olmuştur ve birçok prestijli prensesin bir Kralı olmamasıyla, genç bekar Kralımız Petar bize bir dünya gücüyle bir ittifak sağlayabilir."
 YUG_safeguard_bosnia:0 "Bosna'yı Koru"
 YUG_safeguard_bosnia_desc:0 "Sınırımızda Bosnalıların işgal edilip ezilmesini görmek isteyen birçok ulus var. Bunun olmasına izin vermemeliyiz ve Bosnalılar ile Hersekliler kendilerini silahlandırma ve sanayileştirme çabalarında desteklenmelidir."
 YUG_serbian_steel:0 "Sırp Çeliği"
 YUG_serbian_steel_desc:0 "Sırbistan'da çelik üretimine başlamalıyız. Savaş çabası için her zaman daha fazlasına ihtiyacımız var."
 YUG_shut_down_recruitment_centers:0 "Ustaşa İşe Alım Merkezlerini Kapat"
 YUG_shut_down_recruitment_centers_cooldown:0 "Ustaşa İşe Alım Merkezlerini Kapat"
 YUG_shut_down_recruitment_centers_cooldown_desc:0 "Ustaşa'nın da kendi işe alım merkezleri var; davaları için savaşacak ve ölecek kadar aptal olan her yetenekli bedeni eğitiyor ve silahlandırıyorlar. Bu işe alım merkezlerini bulup ortadan kaldırmalı ve Ustaşa'yı saflarına daha fazla kişi katma imkanından mahrum bırakmalıyız."
 YUG_shut_down_recruitment_centers_desc:0 "Ustaşa'nın da kendi işe alım merkezleri var; davaları için savaşacak ve ölecek kadar aptal olan her yetenekli bedeni eğitiyor ve silahlandırıyorlar. Bu işe alım merkezlerini bulup ortadan kaldırmalı ve Ustaşa'yı saflarına daha fazla kişi katma imkanından mahrum bırakmalıyız."
 YUG_slovenia_for_support:0 "Destek için Slovenya"
 YUG_slovenia_for_support_desc:0 "Mihver güçleri ülkemizi kendi aralarında bölmeye karar verdiler. Belki de Slovenya'yı İtalya'ya devrederek, hem Slovenya'daki yıkıcı unsurlardan kurtulabilir hem de Mihver davasına olan dostluğumuzu gösterebiliriz."
 YUG_small_arms:0 "Hafif Silahlar"
 YUG_small_arms_desc:0 "Piyade her ordunun bel kemiğidir ve elimizden gelen en iyi şekilde donatıldıklarından emin olmalıyız. Yeni ve modern silah modellerinin geliştirilmesini teşvik etmeliyiz."
 YUG_something_in_progress_flag:0 "Şu anda Ustaşa'yı etkiliyor"
 YUG_supremacy_of_defense:0 "Savunmanın Üstünlüğü"
 YUG_supremacy_of_defense_desc:0 "Her taraftan düşmanlarla çevrili olarak, müttefiklerimizin üzerimizdeki baskıyı hafifletmesi için yeterince uzun süre dayanmalıyız. Yeni askeri doktrinlerin geliştirilmesi, anavatanımızın savunmasına odaklanmalıdır."
 YUG_supremacy_of_offense:0 "Saldırının Üstünlüğü"
 YUG_supremacy_of_offense_desc:0 "Saldırı eylemi zafere giden anahtardır ve bu nedenle genel stratejimizi ve yeni doktrinlerin geliştirilmesini belirlemelidir."
 YUG_surrender_italian_claims:0 "İtalyan Taleplerini Teslim Et"
 YUG_surrender_italian_claims_desc:0 "Zara ve İstirya İtalyanların elinde kalıyor, ancak haklı olarak bizim oldukları konusunda ısrar etmeye devam ederek [ITA.GetLeader]'ı kızdırma riskini alamayız. Belki de sınırımızın dışındaki talepleri teslim etme karşılığında Mihver'e giriş kazanabiliriz."
 YUG_surrender_macedonia:0 "Makedonya'yı Teslim Et"
 YUG_surrender_macedonia_desc:0 "Bulgaristan'ın da bize rakip olmak için bir nedeni var; güney Sırbistan ve Makedonya bölgelerini kendileri için talep ediyorlar. İddialarını onlara devrederek, hem güney sınırımızdaki tehdidi susturacak hem de Makedon milliyetçiliğini Bulgaristan'ın sorunu haline getireceğiz."
 YUG_tank_conversions:0 "Tank Dönüşümleri"
 YUG_tank_conversions_desc:0 "Şimdi tanklara ihtiyacımız olabilir, ancak gelecek ay aynı şasiye dayalı kundağı motorlu topçu veya tank avcılarına ihtiyacımız olabilir. Zırhlı teçhizatımız esnek ve mevcut ihtiyaçlarımıza uyarlanabilir kalmalıdır."
 YUG_tank_licenses:0 "Tank Lisansları"
 YUG_tank_licenses_desc:0 "Sınırlı kaynaklarımızı kendi tank modellerimizi geliştirmek için harcamak yerine, çok daha verimli bir şekilde sadece yabancı modelleri lisans altında üretebiliriz."
 YUG_the_ik_3:0 "IK-3"
 YUG_the_ik_3_desc:0 "Boş zamanlarında gizlice çalışan bir mühendis üçlüsü, mevcut yabancı yapımı avcı uçağımızın yerine geçecek dikkate değer bir teklifle geldi. Uygun destekle, üretim muhtemelen yakında mümkün olacaktır."
 YUG_towards_independence:0 "Bağımsızlığa Doğru"
 YUG_towards_independence_desc:0 "Artık birliği bir dizi özerk devlete böldüğümüze göre, bir sonraki adımı atmalıyız; bağımsızlık. Artık hemcinslerimizin üzerinde diktatörler olarak hükmedemeyiz, Sırp müdahalesinden arınmış olarak kendilerini yönetmelerine güvenmeliyiz."
 YUG_towards_independence_mod:0 "Yugoslavya bağımsızlık için bastırıyor"
 YUG_traditional_values:0 "Geleneksel Değerler"
 YUG_traditional_values_desc:0 "Ortodoks dininin öğrettiği geleneksel değerler, toplumumuzun temel taşıdır. Bunları teşvik etmek sadece Ortodoks Kilisesi'nin desteğini kazanmakla kalmayacak, aynı zamanda halkımızı bir araya getirecektir."
 YUG_united_autonomous_croatia:0 "Birleşik Özerk Hırvatistan"
 YUG_united_autonomous_croatia_desc:0 "Hırvatistan Banlığı'nı özerk bir devlette birleştirmek, yükselen Hırvat ayrılıkçılığı sorununa uzun zamandır önerilen bir çözümdür. Hırvatistan'a bir dereceye kadar özerklik vererek, potansiyel düşmanımızdan güçlü bir müttefik edinebiliriz."
 YUG_united_kingdom:0 "Birleşik Krallık"
 YUG_united_kingdom_desc:0 "Artık halkımızın bağımsızlığı tatma ve birliğimizde düzgün bir şekilde temsil edildiğini hissetme fırsatı olduğuna göre, eski devletimizde eksik olan o pan-milliyetçilik ve birlik duygusunu yaratmak için adımlar atma zamanı geldi."
 YUG_ustasa_crushed_mission:0 "Ustaşa Ayaklanmasını Engelle"
 YUG_ustasa_crushed_mission_desc:0 "Hırvatistan üzerindeki kontrolümüzü artırabilirsek, Ustaşa ayaklanması engellenecek ve Hırvat milliyetçileriyle olan tüm zorluklar şimdilik bastırılacak."
 YUG_ustasa_uprising:0 "Ustaşa Ayaklanması"
 YUG_ustasa_uprising_desc:0 "Ustaşa ayaklanmasını zamanında bastıramazsak, devletimize karşı büyük bir Hırvat isyanıyla karşı karşıya kalacağız."
 YUG_western_focus:0 "Batı Odağı"
 YUG_western_focus_desc:0 "Yugoslavya'nın geleceğinin anahtarı, hem coğrafi hem de ekonomik olarak ulusumuza daha yakın olan Batı'daki Güçlerle yatmaktadır."
 YUG_yugoslavian_path_to_communism:0 "Komünizme Giden Yugoslav Yolu"
 YUG_yugoslavian_path_to_communism_desc:0 "İşçilerin davası için mücadelemizde hiçbir rehberliğe ihtiyacımız yok. Liderliğimizi kabul edenleri toplayacak ve birlikte Devrimin kendi versiyonumuzu yayacağız."
 YUG_zara_for_axis:0 "Mihver Üyeliği için Zara"
 YUG_zara_for_axis_desc:0 "İtalyanlar, Zara'daki hükümetin Dalmaçya'nın haklı kontrolörü olduğunu iddia ediyor, ama belki de İtalyanlara aynı dava için savaştığımızı temin ederek, Zara'yı bize geri vermeye ve en azından şimdilik Balkan emellerinden vazgeçmeye istekli olabilirler."
 YUG_zmaj:0 "Zmaj"
 YUG_zmaj_desc:0 "Belgrad'ın Zmaj uçak atölyelerine genişlemek için yeni alanlar tahsis edilmelidir. Diğer şirketlerimizden daha genç olmasına rağmen, Zmaj genişletilirse üretim ihtiyaçlarımızı karşılama potansiyeline sahiptir."
