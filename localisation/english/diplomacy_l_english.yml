 AI_MESSAGE_CAT3_MES1:0 "$OTHER|U$ bir hileci! Beni yasal yollarla yenmesinin imkanı yok!"
 AI_MESSAGE_CAT3_MES10:0 "Evet, RNG o savaşı $OTHER$ için benim adıma kaybetti. Ne yazık ki bu oyunda yetenek hiçbir şey ifade etmiyor."
 AI_MESSAGE_CAT3_MES2:0 "Bu oyun çok dengesiz! $OTHER_ADJ$ uzay piyadelerini yenmek imkansızken $US_ADJ$ birlikleri sadece ıslak kağıt."
 AI_MESSAGE_CAT3_MES3:0 "Heh, sanki zaten bu aptal oyunu oynamaktan daha iyi işlerim yokmuş gibi."
