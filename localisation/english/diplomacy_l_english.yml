 ACTIVE_THREATS:0 "Aktif tehditler:"
 AI_MESSAGE_CAT1_MES1:0 "Orada ilhak edilmek harika işti, $OTHER$. Hepimiz seninle gurur duyuyoruz."
 AI_MESSAGE_CAT1_MES10:0 "Lebensraum'umu genişletmek güzel hissettiriyor, değil mi, $OTHER$?"
 AI_MESSAGE_CAT1_MES2:0 "Hahahaha $OTHER$ bu oyunda berbat."
 AI_MESSAGE_CAT1_MES3:0 "Oynamayı öğren, $OTHER_ADJ$ acemi."
 AI_MESSAGE_CAT1_MES4:0 "$OTHER$ ülkesini o kadar fena yendim ki, neredeyse onlar için üzülüyorum."
 AI_MESSAGE_CAT1_MES5:0 "Belki bu oyun senin için fazla zor, $OTHER$. Europa Universalis gibi pis bir sıradan oyuncu oyununu denemelisin."
 AI_MESSAGE_CAT1_MES6:0 "Bahse girerim $OTHER$ OOB'sini yapılandırmak için 2 saat bile harcamadı. Ezik!"
 AI_MESSAGE_CAT1_MES7:0 "Oh, şimdi sahip olduğum tüm bu $OTHER_ADJ$ toprağına bak. Sanırım ona ihtiyaçları yoktu!"
 AI_MESSAGE_CAT1_MES8:0 "Hey $OTHER$, belki bir dahaki sefere karşı koymayı denersin? Çünkü eğer deniyorsan, hiç belli olmuyordu!"
 AI_MESSAGE_CAT1_MES9:0 "$OTHER$ neden ağlıyor? Çünkü az önce ezildiler!"
 AI_MESSAGE_CAT2_MES1:0 "Krieg'inin içinden geçeceğim, $OTHER$!"
 AI_MESSAGE_CAT2_MES10:0 "Teslim ol artık, $COUNTRY$! Gerçekten burada sadece zamanımı boşa harcıyorsun."
 AI_MESSAGE_CAT2_MES2:0 "Yakında $OTHER$ ülkesindeki herkes $US_ADJ$ konuşacak."
 AI_MESSAGE_CAT2_MES3:0 "Şu $OTHER_ADJ$ eziğine bak, benim üstün $US_ADJ$ birliklerimi yenmeye çalışıyor. Çok üzücü olmasaydı komik olurdu!"
 AI_MESSAGE_CAT2_MES4:0 "Buna savaş mı diyorsun, $OTHER$? Ben buna çocuk oyuncağı diyorum."
 AI_MESSAGE_CAT2_MES5:0 "O $OTHER_ADJ$ fabrikalarını güzel ve parlak tuttuğundan emin ol, yakında onları kullanacağım!"
 AI_MESSAGE_CAT2_MES6:0 "Duyuyor musun, $OTHER$? Bu, şu anda seni ne kadar fena yendiğimin sesi."
 AI_MESSAGE_CAT2_MES7:0 "Hey $OTHER$, belki kaçmayı bırakıp gerçekten savaşmaya çalışsaydın bu kadar kötü durumda olmazdın?"
 AI_MESSAGE_CAT2_MES8:0 "LOL, $COUNTRY$ ülkesinin benimle savaşmaya çalışmasına bak! Sanki biri komadaki bir gelinciği bir ordunun başına koymuş gibi!"
