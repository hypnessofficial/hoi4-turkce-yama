 NORDIC_efficient_resource_extraction:0 "Verimli Kaynak Çıkarma"
 NORDIC_investing_in_neighbor_ns:0 "Komşuya Yatırım"
 NORDIC_investing_in_neighbor_ns_desc:0 "Sermayemizi komşularımızdan daha iyi bir yere yatırmanın ne yolu olabilir? Sadece yakın değil, aynı zamanda uzun süredir devam eden bağlarımız ve ortak mirasımızla, sonunda bize de yatırım yapacaklarından emin olabiliriz."
