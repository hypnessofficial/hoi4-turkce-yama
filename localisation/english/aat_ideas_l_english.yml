 FIN_valtionrautatiet:0 "Valtionrautatiet"
 FIN_we_are_the_white_death_idea:0 "Biz Beyaz Ölümüz"
 FIN_we_are_the_white_death_idea_desc:0 "Ünlü keskin nişancımız Simo Häyhä, savaş alanındaki cesur eylemleriyle silahlı kuvvetlerimizin moralini yükseltti. Birlikler şimdi 'beyaz ölüm' kolektif adı etrafında toplanıyor. Ulusumuzu işgal etmeye cüret edecek kadar aptal olan tüm düşmanları yok etme konusundaki sarsılmaz bağlılıklarını yakalamak için tüyler ürpertici bir isim."
 FIN_weapon_caches_modifier:0 "Silah Depoları"
 FIN_weapon_caches_modifier_desc:0 "Gizli bir askeri operasyonun ardından, Fin Direniş unsurlarının işgalcilere karşı mücadeleye devam edebilmesi için büyük miktarda Fin Ordusu silahı ve teçhizatı eyaletin dört bir yanına dağılmış depolarda saklandı."
 ICE_christian_x:0 "Christian X"
 ICE_christian_x_desc:0 "Christian X, Danimarka ve İzlanda'nın ortak Kralıdır. İki ülke arasındaki son bağlantı."
 ICE_civil_defence_organization:0 "Sivil Savunma Teşkilatı"
 ICE_civil_defence_organization_desc:0 "Her İzlanda vatandaşı, ülkesini korumak, halkına yardım etmek veya altyapısını kurtarmak için yapılması gereken her şeyi her an yapmaya hazırdır."
 ICE_civilian_fleet:0 "Sivil Filoyu Büyüt"
 ICE_compensation_purchase_idea:0 "Tazminat Ödemeleri"
 ICE_compensation_sale_idea:0 "Tazminat Ödemeleri"
 ICE_conscription_idea:0 "Herþjónustu"
 ICE_conscription_idea_desc:0 "İzlanda'daki her genç yetişkinin, uluslarının egemenliğini korumak için 18 ila 22 yaşları arasında 4 yıllık bir askerlik hizmeti yapması gerekmektedir."
 ICE_dissent_in_the_working_class:0 "İşçi Sınıfında Muhalefet"
 ICE_eimskip:0 "Eimskip"
 ICE_esso:0 "Esso"
 ICE_fascist_tech_sharing_group_desc:0 "İzlanda devleti, teknoloji gelişimini ilerletmek amacıyla kendisi ve ideolojik olarak hizalanmış devletleri arasında bir araştırma işbirliği programı düzenlemiştir."
 ICE_fascist_tech_sharing_group_name:0 "İzlanda Araştırma Organizasyonu"
 ICE_fishing_industry:0 "Balıkçılık Endüstrisini Genişlet"
 ICE_fishing_industry_2:0 "Balıkçılık Endüstrisini Genişlet"
 ICE_greyshirts:0 "Gri Gömlekliler"
 ICE_greyshirts_desc:0 "Gençlikten eğitilmiş iyi silahlanmış bir milis, gençleri yetiştirmek ve onları yeni dünyamıza uydurmak için faydalı bir araç olabilir. Ek olarak, yarı askeri eğitim aynı zamanda silahlı kuvvetlerin yeteneklerini güçlendirmek anlamına gelir, bu da haklı olarak bizim olanı geri alırken faydalı olabilir."
 ICE_home_defence_corps:0 "Yurt Muhafızları"
 ICE_hosting_american_soldiers:0 "Amerikan Askerlerini Ağırlamak"
 ICE_hosting_american_soldiers_desc:0 "Adamızda Amerikan Askerlerini ağırlamak, onları ulusumuza katılmaya ikna etmemizi sağlar, bu da bize birleşik davamız için savaşmaya istekli yetenekli adamlar kazandırır."
 ICE_knud_i:0 "İzlanda Kralı Knud I"
 ICE_landsvirkjun:0 "Landsvirkjun"
 ICE_marine_corps:0 "Kraliyet İzlanda Deniz Piyadeleri"
 ICE_professional_army_idea:0 "Víkingasveitin"
 ICE_professional_army_idea_desc:0 "İzlanda ordusu, en cesur ve yürekli adamlardan oluşur ve İzlanda ulusunu ne pahasına olursa olsun savunmaya hazırdır."
 ICE_siemens:0 "Siemens İzlanda"
 ICE_the_icelandic_economy_modifier:0 "İzlanda Ekonomisi"
 ICE_the_icelandic_economy_modifier_desc:0 "Büyük Savaş sırasında İzlanda dünyanın geri kalanından izole edildiğinde ekonomimiz büyük zarar gördü. Sonra buhran vurdu ve anakara Avrupa biraz toparlanmış olsa da, İzlanda ekonomisi acı çekmeye devam ediyor. Ama belki bir gün dünyayı şaşırtacağız... "
 ICE_the_icelandic_economy_modifier_tt:0 "§Y$ICE_the_icelandic_economy_modifier$§! etkenini değiştirir:"
 ICE_transformation_of_nature_state_modifier:0 "Verimli Enerji Üretimi"
 ICE_travel_guide:0 "$ICE_bjorn_olafsson$"
 ICE_vifilfell:0 "Vífilfell"
 ICE_viking_spirit:0 "Ásatrú"
 ICE_viking_spirit_desc:0 "Korkusuz ve ölümcül, eski vikinglerle ilişkilendirilen kelimelerdi. Ötesinde ne olduğunu bilmeden okyanusları aştılar ve sadece güçlü olanlar başarılı oldu. Korkusuz ve cesur, İzlandalıların bugün olması gereken şeydir, çünkü ancak cüret ve cesaretle ülke bir zamanlar olanı geçecek ve Kuzey Denizi'ni bir kez daha yönetecek."
