l_english:
 DEN_aalborg_portland:0 "Aalborg Portland"
 DEN_communist_propaganda_ns:0 "Komünist Propaganda"
 DEN_communist_propaganda_ns_desc:0 "Aldatıcı ve dürüst olmayan Komünistler, yönetimimizi baltalamak amacıyla hükümetimiz hakkında kötü niyetli söylentiler yayıyor."
 DEN_danish_licensing_ns:0 "Ticaret Anlaşması"
 DEN_danish_licensing_ns_desc:0 "İşlemlerin ve ticaretin ülkeler arasında bir zorunluluk olduğu bir dünyada, yakın ticaret ortaklarına sahip olmak iyidir. Bu anlaşma her iki ülkeye de fayda sağlayacak ve aramızdaki bağı güçlendirecektir."
 DEN_danish_licensing_ns_no_DOD_desc:0 "$DEN_danish_licensing_ns_desc$"
 DEN_danish_produce:0 "Danimarka Ürünü"
 DEN_danish_produce_desc:0 "Pastırma ve süt ürünleri Danimarka ihracatının temelini oluşturmuştur, o kadar ki Büyük Savaş sırasında Büyük Britanya ve Almanya ile ticaret yaparak kar edenleri ifade eden 'Gulaş Baronları' terimi ortaya çıkmıştır."
 DEN_danske_stalvalsevaerket_ns:0 "Det Danske Stålvalseværket"
 DEN_declaration_of_neutrality:0 "Tarafsızlık Bildirgesi"
 DEN_declaration_of_neutrality_desc:0 "Danimarka on yıllardır savaşlardan uzak durmayı başardı ve bu sadece tarafsızlık politikamız sayesinde mümkün oldu. Bize iyi hizmet etti ve etmeye de devam edecek."
 DEN_denmark_becomes_a_puppet_tt:0 "[DEN.GetFlag]§Y[DEN.GetNameDefCap]§!, daha güçlü bir yakındaki ülke işgal ederse, mevcut hükümet biçimini korurken bir kukla olmaya çalışma seçeneğine sahip olacak\n\n"
 DEN_designer_can_be_improved_tt:0 "Bu tasarımcı, §Y$DEN_aalborg_portland_cement_plant$§! Odağını tamamlayarak geliştirilebilir!"
 DEN_development_projects_mainland_state_modifier:0 "$DEN_development_projects_state_modifier$"
 DEN_development_projects_mainland_state_modifier_desc:0 "$DEN_development_projects_state_modifier_desc$"
 DEN_development_projects_state_modifier:0 "Sanayi Geliştirme Projeleri"
 DEN_development_projects_state_modifier_desc:0 "Sanayi sektörünün daha uygun maliyetli süreçler ve ürünler geliştirmesi ve genişlemesi gerekiyor. Sanayilerin gelişip devlet ekonomisinin büyümesine yardımcı olması için buraya kaynak yatırdık."
 DEN_economic_crisis_dynamic_modifier:0 "Ekonomik Kriz"
 DEN_economic_crisis_dynamic_modifier_desc:0 "Büyük Buhran bizi tüm gücüyle vurdu. Sonuç olarak, tarım ürünlerine olan talebin düşmesi birçok çiftçi için borç ve haciz anlamına geldi ve fırlayan işsizlik siyasi uçlardaki aşırılık yanlısı hareketler için bir üreme alanı haline geldi. "
 DEN_fascist_propaganda_ns:0 "Faşist Propaganda"
 DEN_fascist_propaganda_ns_desc:0 "Aldatıcı ve dürüst olmayan Faşistler, yönetimimizi baltalamak amacıyla hükümetimiz hakkında kötü niyetli söylentiler yayıyor."
 DEN_flyvevabnet_dynamic_modifier:0 "Flyvevåbnet"
 DEN_flyvevabnet_dynamic_modifier_desc:0 "Hava savaşı, savaşmanın en yeni yoludur ve modern bir ordunun ölçütüdür. Danimarka ordusunun en yeni kolu olan Flyvevåbnet'in kurulmasıyla, artık gerçekten hesaba katılması gereken modern bir gücüz."
 DEN_flyvevabnet_dynamic_modifier_improved:0 "$DEN_flyvevabnet_dynamic_modifier$"
 DEN_flyvevabnet_dynamic_modifier_improved_desc:0 "$DEN_flyvevabnet_dynamic_modifier_desc$"
 DEN_flyvevabnet_dynamic_modifier_max_improved:0 "$DEN_flyvevabnet_dynamic_modifier$"
 DEN_flyvevabnet_dynamic_modifier_max_improved_desc:0 "$DEN_flyvevabnet_dynamic_modifier_desc$"
 DEN_foreign_influence_ns:0 "Yabancı Kamuoyu Nüfuzu"
 DEN_fromandskorpset_ns:0 "$DEN_fromandskorpset$"
 DEN_fromandskorpset_ns_desc:0 "Özel amfibi kuvvetlerimiz kurulduğunda, askeri güçlerimizi uzaklara ve geniş alanlara - suların üzerine ve yabancı kıyılara - yansıtmaya hazırız."
 DEN_haeren_dynamic_modifier:0 "Hæren"
 DEN_haeren_dynamic_modifier_desc:0 "Danimarka geçmiş çağlarda İskandinavya'yı yönetti ve bölgedeki baskın güçtü. Ordularımız Baltık Denizi bölgesinde engelsiz ve rakipsiz yürüdü. Ordu, eski halinin sadece bir gölgesi, ama sınırlarımızı ve halkımızı korumak için gücümüzü ve askeri kudretimizi yeniden inşa edebiliriz."
 DEN_haeren_dynamic_modifier_improved:0 "$DEN_haeren_dynamic_modifier$"
 DEN_haeren_dynamic_modifier_improved_desc:0 "Danimarka geçmiş çağlarda İskandinavya'yı yönetti ve bölgedeki baskın güçtü. Ordularımız Baltık Denizi bölgesinde engelsiz ve rakipsiz yürüdü. Ordu, eski gücünün bir kısmını geri kazandı, ancak onu eski ihtişamına geri döndürmek için ilk adımları attık."
 DEN_haeren_dynamic_modifier_max_improved:0 "$DEN_haeren_dynamic_modifier$"
 DEN_haeren_dynamic_modifier_max_improved_desc:0 "Danimarka geçmiş çağlarda İskandinavya'yı yönetti ve bölgedeki baskın güçtü. Ordularımız Baltık Denizi bölgesinde engelsiz ve rakipsiz yürüdü. Ordularımız bir kez daha hayranlık uyandıran ve korkulan bir şey! Gücünü yeniden inşa etmeyi başardık ve gelebilecek her şeye hazırız."
 DEN_home_guard_state_modifier:0 "Hjemmeværnet"
 DEN_home_guard_state_modifier_desc:0 "Yurt Muhafızları bu eyalette aktiftir ve düşman ilerlemelerini yavaşlatmaktadır."
 DEN_improved_designer_tt:0 "Bu tasarımcı geliştirildi"
 DEN_improved_logistics:0 "Geliştirilmiş Lojistik"
 DEN_improved_logistics_desc:0 "Danimarka zengin ve bereketli bir ülkedir ve bu kaynakları kullanarak birliklerimiz için yiyecek sağlayacak ve askeri yeteneklerimizi güçlendireceğiz."
 DEN_industrial_capability_dynamic_modifier:0 "Danimarka Sanayi Yetenekleri"
 DEN_industrial_capability_dynamic_modifier_desc:0 "Danimarka geleneksel olarak bir tarım toplumu ve üreticisi olmuştur, ancak sanayileri önem ve ekonomik anlamda büyümüştür. Modern çağdaki hızlı gelişime ayak uydurmak için sanayileşmeli ve modernleşmeliyiz."
 DEN_industrial_capability_dynamic_modifier_improved:0 "$DEN_industrial_capability_dynamic_modifier$"
 DEN_industrial_capability_dynamic_modifier_improved_desc:0 "Danimarka geleneksel olarak bir tarım toplumu ve üreticisi olmuştur, ancak sanayileri önem ve ekonomik anlamda büyümüştür. Sanayilerimizi modernize etmek ve geliştirmek için ilk adımları attık, bu da bizi daha rekabetçi ve üretken kılıyor."
 DEN_industrial_capability_dynamic_modifier_light_regulation:0 "$DEN_industrial_capability_dynamic_modifier$"
 DEN_industrial_capability_dynamic_modifier_light_regulation_desc:0 "$DEN_industrial_capability_dynamic_modifier_desc$"
 DEN_industrial_capability_dynamic_modifier_light_regulation_improved:0 "$DEN_industrial_capability_dynamic_modifier$"
 DEN_industrial_capability_dynamic_modifier_light_regulation_improved_desc:0 "$DEN_industrial_capability_dynamic_modifier_improved_desc$"
 DEN_industrial_capability_dynamic_modifier_light_regulation_max_improved:0 "$DEN_industrial_capability_dynamic_modifier$"
 DEN_industrial_capability_dynamic_modifier_light_regulation_max_improved_desc:0 "$DEN_industrial_capability_dynamic_modifier_max_improved_desc$"
 DEN_industrial_capability_dynamic_modifier_max_improved:0 "$DEN_industrial_capability_dynamic_modifier$"
 DEN_industrial_capability_dynamic_modifier_max_improved_desc:0 "Danimarka geleneksel olarak bir tarım toplumu ve üreticisi olmuştur, ancak sanayileri önem ve ekonomik anlamda büyümüştür. Sanayilerimiz tamamen modernize edilmiş ve geliştirilmiştir, gece gündüz tam kapasite çalışmaktadır."
 DEN_light_market_regulation_research_bonus:0 "$DEN_industrial_capability_dynamic_modifier$"
 DEN_military_projects_state_modifier:0 "Askeri Geliştirme Projeleri"
 DEN_military_projects_state_modifier_desc:0 "Bunun, ulusun güvenliğini sağlamak için askeri yeteneklerini korumak ve geliştirmek için gerekli bir eyalet olduğuna karar verildi."
 DEN_monarchist_discontent_ns:0 "Monarşist Hoşnutsuzluk"
 DEN_monarchist_discontent_ns_desc:0 "Kral'ın modası geçmiş sembolünün arkasında toplanan vatansever bir hareket başladı. Halkın, halk tarafından, halk için olan hükümetimizden memnun değiller ve bunun yerine Kral'ın kendisinin gücü eline almasını tercih ediyorlar."
 DEN_neglected_military_dynamic_modifier:0 "İhmal Edilmiş Ordu"
 DEN_neglected_military_dynamic_modifier_desc:0 "Almanları kışkırtmamak için yıllardır silahsız tarafsızlık politikası izledik. Ordu, egemenliğimizi sembolik olarak korumak için bir simgeden biraz daha fazlasıdır. Silahlı kuvvetler yıllar boyunca sürekli fon kesintileri aldı - bu da onları herhangi bir potansiyel çatışmaya tamamen hazırlıksız bıraktı."
 DEN_neutrality_flag:0 "[DEN.GetFlag]§Y[DEN.GetNameDefCap]§! bağımsız ve savaşta değil"
 DEN_occupation_laws_dynamic_modifier:0 "İşgal Yasaları"
 DEN_occupation_laws_dynamic_modifier_desc:0 "[?DEN.DEN_overlord_nation.GetAdjective] hakim devletlerimiz, savaşlarında onlara yardım etmemiz için bizi görevlendirdi ve uymamızı sağlamak için birkaç yasa dayattı."
 DEN_overlord_licensing_ns_desc:0 "$DEN_danish_licensing_ns_desc$"
 DEN_overlord_licensing_ns_no_DOD_desc:0 "$DEN_danish_licensing_ns_desc$"
 DEN_pan_scandinavianism_modifier:0 "Pan-İskandinavizm Ruhu"
 DEN_pan_scandinavianism_modifier_desc:0 "Pan-İskandinavizm coşkusu bu eyaleti sarmış, nüfusun kararlılığını ve bağlılığını güçlendirmiştir."
 DEN_political_edicts_dynamic_modifier:0 "Siyasi Fermanlar"
 DEN_political_edicts_dynamic_modifier_desc:0 "Her Danimarkalı, bu sıkıntılı zamanlarda kendilerinden ne beklendiğini ve ne istendiğini bilmelidir. Ulusumuza karşı düşmanca eylemlere karşı uyanık olmalı ve ortak bir hedefe doğru birlikte çalışmalıyız."
 DEN_resistance_dynamic_modifier:0 "Modstandsbevægelsen"
 DEN_resistance_dynamic_modifier_desc:0 "Ancak birleşerek ve [?DEN.DEN_overlord_nation.GetAdjective] işgal güçlerine direnerek özgür bir [DEN.GetNameDef] görmeyi umabiliriz. Direniş Hareketi bunun merkezindedir ve bir gün özgürlüğümüzü geri kazanmak için kritik olacaktır."
 DEN_resistance_dynamic_modifier_improved:0 "$DEN_resistance_dynamic_modifier$"
 DEN_resistance_dynamic_modifier_improved_desc:0 "$DEN_resistance_dynamic_modifier_desc$"
 DEN_rule_the_north_sea:0 "Kuzey Denizi'ni Yönet"
 DEN_rule_the_north_sea_desc:0 "Kuzey Denizi emellerimizi gerçekleştirmek için, varlıklarımızı güvence altına almak ve diğer ulusları onları almaktan caydırmak için üstün ateş gücüne sahip bir Büyük Filo oluşturmalıyız."
 DEN_sahnefront:0 "Tereyağı Cephesi"
 DEN_sahnefront_desc:0 "Danimarka, zengin bir tarım geleneğine sahip bereketli bir ülkedir ve bağlı devletlerimiz olarak bu faydaları biz de toplayacağız. Danimarka'ya sahip olmak askeri kuvvetlerimizi ve yeteneklerimizi güçlendirecektir."
 DEN_securing_finland_ns:0 "[FIN.GetNameDef] ülkesini Güvence Altına Almak"
 DEN_securing_finland_ns_desc:0 "Onlar üzerinde hiçbir zaman doğrudan güç kullanmasak da, Finler Kalmar Birliği altında bize itaat ettiler. Şimdi Finlandiya'yı doğrudan Danimarka yönetimi altına alma zamanı. Ordumuz bu gün için hazırlandı ve herhangi bir düşman Fin kuvvetini savaşmak ve yok etmek için özenle eğitildi."
 DEN_securing_norway_ns:0 "[NOR.GetNameDef] ülkesini Güvence Altına Almak"
 DEN_securing_norway_ns_desc:0 "Norveçliler yüzlerce yıldır Krallığımızın bir parçasıydı. Norveç'i bir kez daha [DEN.GetNameDefCap] içine dahil etme zamanı geldi. Ordumuz bu gün için hazırlandı ve herhangi bir düşman Norveç kuvvetini savaşmak ve yok etmek için özenle eğitildi."
 DEN_securing_sweden_ns:0 "[SWE.GetNameDef] ülkesini Güvence Altına Almak"
 DEN_securing_sweden_ns_desc:0 "İsveçliler bir zamanlar Kalmar Birliği'nin bir parçasıydı ve Danimarka yönetimi altındaydı. İsveç'i tekrar Krallığımıza dahil etme zamanı geldi. Ordumuz bu gün için hazırlandı ve herhangi bir düşman İsveç kuvvetini savaşmak ve yok etmek için özenle eğitildi."
 DEN_sovaernet_dynamic_modifier:0 "Søværnet"
 DEN_sovaernet_dynamic_modifier_desc:0 "Danimarka bir zamanlar Baltık Denizi'nde büyük bir güçtü ve kudretli filolarımızla dalgalara hükmediyordu - ama bundan önce bile uzun bir denizcilik geçmişimiz vardı. Vikingler korku salmak ve toprakları fethetmek için uzaklara yelken açtılar. Azim ve kararlılıkla, denizleri bir kez daha yönetmek için donanmamızı yeniden inşa edebiliriz."
 DEN_sovaernet_dynamic_modifier_improved:0 "$DEN_sovaernet_dynamic_modifier$"
 DEN_sovaernet_dynamic_modifier_improved_desc:0 "Danimarka bir zamanlar Baltık Denizi'nde büyük bir güçtü ve kudretli filolarımızla dalgalara hükmediyordu - ama bundan önce bile uzun bir denizcilik geçmişimiz vardı. Vikingler korku salmak ve toprakları fethetmek için uzaklara yelken açtılar. Önümüzde hala çok iş olsa da, donanma eski ihtişamının ve gücünün büyük bir kısmını geri kazandı."
 DEN_sovaernet_dynamic_modifier_max_improved:0 "$DEN_sovaernet_dynamic_modifier$"
 DEN_sovaernet_dynamic_modifier_max_improved_desc:0 "Danimarka bir zamanlar Baltık Denizi'nde büyük bir güçtü ve kudretli filolarımızla dalgalara hükmediyordu - ama bundan önce bile uzun bir denizcilik geçmişimiz vardı. Vikingler korku salmak ve toprakları fethetmek için uzaklara yelken açtılar. Donanmamızı kurduk ve bir kez daha denizleri yönetmek için yelken açmaya hazırız."
 DEN_war_preparations_dynamic_modifier:0 "Savaş Hazırlıkları"
 DEN_war_preparations_dynamic_modifier_desc:0 "Ancak hazır olarak fırtınayı atlatabiliriz. İhtiyaç duyulduğunda hammadde ve diğer malzemelerle stoklarımızı oluşturmalı ve sanayilerimizi savaş çabalarına yardımcı olacak şekilde hazırlamalıyız."
 FIN_academic_karelian_society_ns_1:0 "$FIN_academic_karelian_society$"
 FIN_anti_soviet_sentiment:0 "Sovyet Karşıtı Duygu"
 FIN_anti_soviet_sentiment_desc:0 "Bu eyaletin halkı, [SOU.GetNameDef] ülkesine karşı derin bir kin besliyor ve onu yeniden markalanmış bir Rus İmparatorluğu'ndan veya geleneksel değerlerine yönelik bir tehditten başka bir şey olarak görmüyor."
 FIN_baltic_sea_focus:0 "Baltık Denizi Odağı"
 FIN_baltic_sea_focus_desc:0 "Baltık Denizi, ulusun savunması için büyük bir endişe kaynağıdır. Donanmamıza, bölgedeki hedeflerini olabildiğince etkili bir şekilde yerine getirmeleri için gereken eğitimi ve kaynakları vermeliyiz."
 FIN_bank_of_aland_ns:0 "$FIN_bank_of_aland$"
 FIN_bank_of_aland_ns_desc:0 "$FIN_bank_of_aland_desc$"
 FIN_coastal_batteries_effort:0 "Kıyı Bataryaları Çabası"
 FIN_coastal_batteries_effort_desc:0 "$FIN_coastal_defense_desc$"
 FIN_commitment_from_construction_workers:0 "İnşaat İşçilerinden Taahhüt"
 FIN_commitment_from_construction_workers_desc:0 "İnşaat işçileri kapitalist sömürünün zalimliklerine yabancı değildir. Bu nedenle birçoğu devrimci hareketimizin ateşli destekçileri haline geldi. Bazıları silahlı kuvvetlere katılmış olsa da, birçoğu devletin savaşı yürütmek için ihtiyaç duyabileceği her türlü inşaat operasyonunda uzmanlıklarını kullanmaya kararlıdır."
 FIN_commitment_from_the_trade_unions:0 "Sendikalardan Taahhüt"
 FIN_commitment_from_the_trade_unions_desc:0 "Sendikalar, işyerindeki kapitalist baskının adaletsizliklerine karşı on yıllardır acı bir şekilde mücadele etti ve halk arasında sınıf bilincini yükseltmede hayati bir rol oynadı. Şimdi, kapitalizmi kesin olarak sona erdirmek için devrimci hareketimize tüm kalpleriyle katılıyorlar."
 FIN_compensation_for_side_switch_bad:0 "Savaş Tazminatları"
 FIN_compensation_for_side_switch_good:0 "Finlandiya'dan Tazminat"
 FIN_confederation_of_finno_russian_republics_dm:0 "Fin-Rus Cumhuriyetleri Konfederasyonu"
 FIN_confederation_of_finno_russian_republics_dm_desc:0 "$FIN_confederated_finno_russian_republics$"
 FIN_conversion_of_civilian_vessels_dynamic_modifier_no_mtg_tt:0 "§Y$screen_ship$§!: $production_cost_tt$ §G-10.00%§!\n"
 FIN_conversion_of_civilian_vessels_dynamic_modifier_tt:0 "§Y$screen_ship$§! ve §Y$ship_hull_cruiser_coastal_defense_ship$§!: $production_cost_tt$ §G-10.00%§!\n"
 FIN_dominate_the_skies_dynamic_modifier_tt:0 "§YTüm $light_fighter$§!: $production_cost_tt$ §G-5.00%§!\n"
 FIN_dominate_the_skies_improved_dynamic_modifier_tt:0 "§YTüm $light_fighter$§!: $production_cost_tt$ §G-10.00%§!\n"
 FIN_embraced_by_the_white_death:0 "Beyaz Ölüm Tarafından Kucaklandı"
 FIN_embraced_by_the_white_death_desc:0 "Simo Häyhä, ölüme birden fazla kez kıl payı yaklaşmasına rağmen, düşmanlarımıza soğuk ölüm kucağını ve korkuyu salmaya devam ediyor."
 FIN_fascist_regime:0 "Faşist Rejim"
 FIN_fascist_regime_desc:0 "$FIN_a_fascist_regime$"
 FIN_finnish_airforce:0 "Fin Hava Kuvvetleri"
 FIN_finnish_airforce_desc:0 "Küçük boyutuna ve sınırlı kaynaklarına rağmen, Fin Hava Kuvvetleri, yıllarca süren deney ve doğaçlama yoluyla zanaatlarını geliştiren yetenekli pilotlar ve yenilikçi tasarımcılardan oluşan bir kadroya sahiptir. Salt kararlılık ve değişen koşullara uyum sağlama isteği sayesinde, Fin Hava Kuvvetleri, anavatanını kara birliklerinin tüm cesareti ve azmiyle savunacak, hesaba katılması gereken bir güç olarak ün kazanmıştır."
 FIN_finnish_airforce_dynamic_modifier_tt:0 "[GetCasOrFighterDesignsTooltip][GetNavalAirforceTooltip]"
 FIN_finnish_army:0 "Fin Ordusu"
 FIN_finnish_army_desc:0 "Gururlu ve bağımsız mirasının bir ürünü olarak, Fin Ordusu, dış saldırganlığa karşı yıllarca süren mücadelenin sertleştirdiği zorlu bir güç olarak durmaktadır. Anavatanlarını savunma konusundaki şiddetli bir kararlılıkla, Finlandiya askerleri yetenekli nişancılar ve en zorlu düşmanlara bile dayanmaya hazır, dirençli savaşçılardır. Sınırlı kaynaklara rağmen, Fin Ordusu kolayca kırılamayacak inatçı ve boyun eğmez bir ruhu temsil eder."
 FIN_finnish_army_dynamic_modifier_tt:0 "[GetMolotovCocktailsTooltip]"
 FIN_finnish_goods:0 "Fin Malları"
 FIN_finnish_goods_desc:0 "Zeki bir manevrayla, Kuusinen'in [FIN.GetName] ülkesiyle sağlam bir ticaret anlaşması kurduk, bu da bize onların değerli mallarına ayrıcalıklı erişim sağladı ve tedarikleri için son derece uygun koşullar güvence altına aldı."
 FIN_finnish_navy:0 "Fin Donanması"
 FIN_finnish_navy_desc:0 "Fin Donanması, anavatanını tüm tehditlere karşı savunmaya hazır, küçük ama gururlu bir güçtür. Kıyı savunması ve deniz yollarının korunmasına odaklanan Fin Donanması, Fin bağımsızlığının güçlü bir sembolü ve ülkenin genel savunma stratejisinin kilit bir unsurudur. Ezici zorluklarla karşılaşabilse de, Fin Donanması'nın denizcileri, karadaki meslektaşlarının tüm cesareti ve azmiyle savaşmaya kararlıdır."
 FIN_finnish_navy_dynamic_modifier_tt:0 "[GetConvoyTooltip][GetConversionTooltip]"
 FIN_fortification_effort:0 "Tahkimat Çabası"
 FIN_fortification_effort_desc:0 "$FIN_defense_in_depth_desc$"
 FIN_hydro_electric_expansion:0 "Hidro-Elektrik Genişlemesi"
 FIN_hydro_electric_expansion_desc:0 "[ROOT.GetName] ülkesinin bol nehirlerinin doğal kaynaklarından yararlanarak, hidroelektrik altyapımızın anlamlı bir şekilde genişletilmesi devam etmektedir. Yeni hidroelektrik santrallerinin inşasına yatırım yapmak, sanayi kapasitemizi büyük ölçüde genişletme ve ulusumuzun büyümesini sağlama imkanı verecektir."
 FIN_imprisoned_right_wing_leaders:0 "Hapsedilmiş Sağcı Liderler"
 FIN_imprisoned_right_wing_leaders_desc:0 "Politikacılar ve iş adamları gibi çeşitli sağcı fraksiyonların liderleri, karşı devrimci faaliyetler yürütmelerini önlemek için önceden hapsedildi."
 FIN_infiltrated_assets:0 "Sızdırılmış Varlıklar"
 FIN_infiltrated_assets_desc:0 "Diğer uluslarla yeni kurduğumuz ticaret anlaşmalarıyla, ortaklarımıza sızma fırsatı da yakaladık. Bu, umarım onların güdülerini ve hedeflerini daha iyi anlamamıza yol açacak, bu da sırayla kendimizi daha iyi korumamıza olanak tanıyacaktır."
 FIN_infrastructure_effort:0 "Altyapı Çabası"
 FIN_infrastructure_effort_desc:0 "$FIN_industrial_development_desc$"
 FIN_international_volunteers:0 "Uluslararası Gönüllüler"
 FIN_international_volunteers_desc:0 "Dünyanın dört bir yanından gönüllüler kuvvetlerimize katılmak için Finlandiya'ya seyahat ediyor. Finler bu savaşı yalnız savaşmayacak!"
 FIN_lotta_svard:0 "Lotta Svärd"
 FIN_lotta_svard_desc:0 "Lotta Svärd, silahlı kuvvetlerimizi yıllardır yardımcı bir kapasitede desteklemiştir. Ulusun şimdi bu kadar vahim koşullarla karşı karşıya kalmasıyla, onları silahlandırarak ve üyelerin ulusun savunmasını desteklemede daha ön saflarda bir rol almasına izin vererek rollerini genişlettik."
 FIN_lotta_svard_support_battalions_bonus_tt:0 "§Y$category_support_battalions$:§! Organizasyon: §G+10§!, HP: §G+5§!"
 FIN_low_army_morale:0 "Düşük Ordu Morali"
 FIN_low_army_morale_desc:0 "Silahlı kuvvetlerimiz, bir önceki iç savaştan bu kadar kısa bir süre sonra bir tane daha savaşma ihtimalinden pek de hevesli değil. Özellikle moral, düşmanlıkların başlamasından bu yana silahlı kuvvetlerimizde ağır bir darbe aldı."
 FIN_mannerheim_line_expansion_modifier:0 "Mannerheim Hattı Genişlemesi"
 FIN_mannerheim_line_expansion_modifier_desc:0 "Mannerheim Hattı'nı güçlendirerek ve genişleterek, Finlandiya'nın hafife alınmayacağına ve Finlerin bağımsızlıklarını ellerindeki tüm araçlarla savunmaya hazır olduğuna dair net bir mesaj göndereceğiz."
 FIN_militarized_society_requirement_tt:0 "§Y$all_adults_serve$§! veya §Y$scraping_the_barrel$§! Askerlik Yasası altında değilse §Rgeçici olarak kaldırılacak§!."
 FIN_motti_tactics_modifier:0 "Motti Taktikleri"
 FIN_motti_tactics_modifier_desc:0 "Fin birlikleri, eyalette Motti taktikleri uygulayarak, lojistik ve iletişim hatlarını felç etme amacıyla düşman birimlerini kuşatıp izole ediyor."
