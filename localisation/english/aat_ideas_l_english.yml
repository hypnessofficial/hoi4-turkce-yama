 FIN_pohjolan_voima:0 "Pohjolan Voima"
 FIN_popular_support_for_the_revolution:0 "Devrime Halk Desteği"
 FIN_popular_support_for_the_revolution_desc:0 "[FIN.GetAdjective] proletaryası nihayet ayaklandı ve burjuva baskısının zincirlerini kırdı. Birlikte, hareketimiz sadece [FIN.GetNonIdeologyName]'de değil, tüm dünyada emperyalizmin temellerini sarsacak!"
 FIN_public_opposition_to_the_winter_war:0 "Kış Savaşı'na Halk Muhalefeti"
 FIN_public_opposition_to_the_winter_war_desc:0 "Halk, [FIN.GetNonIdeologyName] ülkesine karşı savaşımızın gerekliliği konusunda şüpheci hale geldi. Bir zamanlar güvenlik servislerimiz tarafından kontrol altında tutulan marjinal bir görüş, kontrolümüzün ötesinde ana akım bir duygu haline geldi."
 FIN_repurposed_small_industries:0 "Yeniden Amaçlandırılmış Küçük Sanayiler"
 FIN_repurposed_small_industries_desc:0 "Küçük sanayilerin kontrolünü ele alarak ve onları savaş çabalarının taleplerini karşılamak üzere yeniden amaçlandırarak, Fin hükümeti artık kaynaklarını toplayabilir ve ekonomisini hem sivil hem de askeri ihtiyaçlar için tam olarak seferber edebilir."
 FIN_sami_pathfinders:0 "Sámi İzicileri"
 FIN_sami_pathfinders_desc:0 "Uzman izciler ve vahşi doğa rehberleri olan Sámi, Finlandiya'nın kuzeyinin engebeli arazisinde kolaylıkla gezinebilir ve Fin kuvvetlerine hayati istihbarat sağlayabilir. \nİster savaşın sıcağında ister ormanın sessiz derinliklerinde olsun, Sámi izcileri artık Fin Ordusu'nun kilit bir varlığı ve ülkenin gururlu mirasının kalıcı bir sembolüdür."
 FIN_sami_pathfinders_recon_bonus_tt:0 "§YKeşif ve $long_range_patrol_support$:§! Keşif: §G+100.0%§!, §Y$snow$§!: Hareket: §G+10%§!, §Y$forest$§!, §Y$hills$§!, §Y$mountain$§!, §Y$marsh$§!, §Y$plains$§! ve §Y$river$§!: Hareket: §G+5%§!"
