 NORDIC_economic_cooperation_ns:0 "Ekonomik İşbirliği"
 NORDIC_economic_cooperation_ns_desc:0 "Böyle zamanlarda komşularımıza karşı yabancılaşma ve düşmanlıklara kurban gidemeyiz. Bu yüzden komşumuza yatırım yapıyoruz ki gelgit tüm teknelerimizi yükseltsin. Hem de temiz bir kar elde ederken."
