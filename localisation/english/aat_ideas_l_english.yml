 NORDIC_receiving_investments_fake_ns:0 "Nordik Yatırımları"
 NORDIC_receiving_investments_fake_ns_desc:0 "Başka bir Nordik ülkesi ülkemizin ekonomisine yatırım yapıyor."
 NORDIC_sending_investments_ns:0 "$NORDIC_receiving_investments_fake_ns$"
 NORDIC_sending_investments_ns_desc:0 "Başka bir Nordik ülkesinin ekonomisine yatırım yapıyor."
 NORDIC_the_nordic_march_ns:0 "Nordik Yürüyüşü"
 NORDIC_the_nordic_march_ns_desc:0 "Çevremizdeki uluslar henüz görmüyorlar, ama onların tiranlık dedikleri şey değişim rüzgarlarından başka bir şey değil ve yollarındaki her şeyi yok ettikten sonra, küllerinden yeni bir Nordik düzeni yükselecek ve biz o gücü ele geçirecek konumda olacağız."
 NORDIC_to_arms_against_tyranny_ns:0 "Zorbalığa Karşı Silah Başına"
 NORDIC_to_arms_against_tyranny_ns_desc:0 "Zorbalığın pençeleri Nordik komşularımızın bağımsızlığını tehdit ederken, onları savunmaya hazır olmalıyız, yoksa tiranın bir sonraki yemeği biz oluruz."
 NOR_XU_ns:0 "XU"
 NOR_XU_ns_desc:0 "Faşist işgaline direnen birçok Norveçli, zalimlerini engellemek için kendi paylarına düşeni yapmak istiyor. XU, tüm bu unsurları kendi çatısı altında organize edebilir ve casusluk yapma, yavaşlatma ve nihayetinde bu davetsiz misafirleri kovma çabalarını destekleyebilir."
 NOR_aat_norsk_hydro:0 "$NOR_norsk_hydro$"
 NOR_abandoning_nynorsk_ns:0 "$NOR_abandoning_nynorsk$"
 NOR_abandoning_nynorsk_ns_desc:0 "Nasjonal Samling liderleri, Nynorsk'a tolerans gösterilmeyeceğini ve her vatandaşın Norveç Dili'nin Bokmål versiyonunu kullanması gerektiğini kararlaştırdı."
 NOR_administrative_council_dmod:0 "İdari Konsey"
 NOR_administrative_council_dmod_desc:0 "Ülkemiz işgal altındayken, bu erkekler ve kadınlar daha küçük meselelerle görevlendirilen grup olacak, büyük kararlar ise çok uzakta Faşist hakim devletlerimiz tarafından alınacaktır."
 NOR_anti_communist_sentiment_ns:0 "Anti-Komünist Duygu"
 NOR_anti_communist_sentiment_ns_desc:0 "[SOU.GetNameDefCap] ve yurtdışındaki komünistler birçok [NOR.GetAdjective] insanda korku uyandırdı, o kadar ki faşizm, kırmızı tehditle başa çıktıkları sürece nispeten gerçek bir endişe değil."
 NOR_army_air_force_dmod:0 "Hærens Flyvevaaben"
 NOR_army_air_force_dmod_desc:0 "Şimdilik, yeni kurulan hava kuvvetlerimizin görevi, kara ordularımızı nereye giderlerse gitsinler desteklemek olacak, bu yüzden şimdilik ayrı bir hiyerarşiye gerek yok."
 NOR_attack_denmark_ns:0 "Danimarka'ya Saldır"
 NOR_attack_denmark_ns_desc:0 "[DEN.GetNonIdeologyName] Avrupa'nın geri kalanına köprümüzdür. Ne yazık ki bu aynı zamanda düşmanımızın İskandinavya'ya fırlatma rampası olabileceği anlamına da gelir. Onu korumasız bırakamayız."
 NOR_attack_sweden_ns:0 "İsveç'e Saldır"
 NOR_attack_sweden_ns_desc:0 "[SWE.GetNonIdeologyName] işgal edilmeden bırakılamayacak kadar önemli bir hedeftir. Eğer onların kaynaklarını önce biz ele geçirmezsek, düşmanın eline veya daha kötüsü, [SWE.GetAdjective] savaş vurguncularının eline geçebilirler."
 NOR_broken_gun_ns:0 "Kırık Silah"
 NOR_broken_gun_ns_desc:0 "Kırık Silah politikamız, barış ve refahın [NOR.GetName] ve ötesine yayılmasını sağlayacaktır. Parayı vatandaşlarımızın hayatlarını iyileştirmek için kullanabilir ve komşularımıza zarar verme niyetinde olmadığımızı gösterebiliriz."
 NOR_communist_education_centers_ns_1:0 "Komünist Eğitim Merkezleri"
 NOR_communist_education_centers_ns_1_desc:0 "Bu merkezler yurtdışındaki yoldaşlarımız tarafından kuruldu ve [NOR.GetAdjective] halkını gelecek olan yeni [NOR.GetNonIdeologyName] için hazırlama çabalarımızın ön saflarında yer alıyorlar."
 NOR_complacent_cabinet_ns:0 "Kaygısız Kabine"
 NOR_complacent_cabinet_ns_desc:0 "Johan Nygaardsvold'un istikrarlı bir hükümet kurmayı başarması küçük bir başarı değil, o ve kabinesi bunun son engel olduğunu düşünüyor gibi görünüyor, ama henüz bilmedikleri şey, bunun sadece birçok engelden ilki olduğu."
 NOR_contested_leadership_ns:0 "Tartışmalı Liderlik"
 NOR_contested_leadership_ns_desc:0 "[get_NOR_contested_leadership_ns_desc]"
 NOR_contested_leadership_ns_desc_generic:0 "Quisling darbesini başarmış olmasına rağmen, gerçek şu ki, güç hiyerarşisi çok karışıktır, çünkü silahlı kuvvetler içindeki herkes, hatta kendi yönetimi bile, onun devralmasını onaylamamaktadır."
 NOR_contested_leadership_ns_desc_ger:0 "Quisling'in darbesiyle neyi başarmayı umduğuna bakılmaksızın, [GER.GetNameDef] ülkesinin [NOR.GetNonIdeologyName] fethedildiğinde kurulması gereken hükümet hakkında kendi planları vardı. Gerçek şu ki, Reich'taki çok az insan Quisling'in iş için uygun olduğunu düşünüyor, Hitler'in kendisi hariç, o da [NOR.GetAdjective] küçük tiranına tuhaf bir şekilde düşkün görünüyor."
 NOR_coordinating_committee:0 "Koordinasyon Komitesi"
 NOR_coordinating_committee_desc:0 "Sivil direniş çabasının merkezinde, sürgündeki hükümeti [NOR.GetName] ülkesindeki sivil direnişin farklı unsurlarıyla bağlamakla görevli Koordinasjonskomiteen yatmaktadır."
 NOR_crumbling_fortifications_ns:0 "Yıkılan Tahkimatlar"
 NOR_crumbling_fortifications_ns_desc:0 "Bazı durumlarda, onlara tahkimat demek cömertlik olur. Sadece hizmet dışı bırakılmakla kalmıyorlar, aynı zamanda modern savaşa hiç de hazır değiller."
 NOR_crush_hitler_ns:0 "Hitler'i Ez"
 NOR_crush_hitler_ns_desc:0 "Çok az rejim Hitler'inki kadar acımasız ve insanlık dışıdır. Bu manyağın bizim nöbetimizde başıboş dolaşmasına izin veremeyiz. Onunla ve onun Nazi [GER.GetNonIdeologyName] ülkesiyle hızlı ve kararlı bir şekilde ilgilenelim."
 NOR_crush_stalin_ns:0 "Stalin'i Ez"
 NOR_crush_stalin_ns_desc:0 "Stalin ve sözde [SOU.GetName] ülkesi, Komünizmin neyi temsil ettiğinin bir ölçüsü olarak kullanılıyor. Buna devam etmesine izin veremeyiz, çünkü bu haydutun rejimi, kırmızı bir boya katıyla eski Rus İmparatorluğu'ndan başka bir şey değildir."
 NOR_defend_state_dmod:0 "Eyaleti Savun"
 NOR_defend_state_dmod_desc:0 "Haklı olarak bizim olanı elimizdeki her şeyle savunacağız. İşgalciler ölmeli."
 NOR_defensive_rearmament_ns:0 "Savunmacı yeniden silahlanma"
 NOR_defensive_rearmament_ns_desc:0 "Dünyanın geri kalanının bizi savaş çığırtkanı sanmasına ve bize önleyici saldırı yapmasına izin veremeyiz. Yeniden silahlanma konusundaki her çabanın açık bir savunma amacı olmalıdır."
 NOR_disjointed_cabinet_conscription_law_TT:0 "§RAskerlik Yasası artırılamaz§!"
 NOR_efficient_production_ns:0 "Verimli Üretim"
 NOR_efficient_production_ns_desc:0 "Verimliliğe yönelik hiçbir gelişme göz ardı edilemez. Elimizdekiyle en fazlasını yapabildiğimizden emin olmalıyız, yoksa daha fazla üretilme riskiyle karşı karşıya kalırız."
 NOR_expanded_conscription_ns:0 "Genişletilmiş Askerlik"
 NOR_expanded_conscription_ns_desc:0 "Zor zamanlarda seyrek nüfuslu bir ülke olarak, hiçbir [NOR.GetAdjective] vatandaşı boş oturma lüksüne sahip değildir. Hedeflerimize ulaşılacaksa asgari gereksinimleri karşılayan herkes askere alınmalıdır."
 NOR_flexible_officers_academy_spirit:0 "Esnek Subaylar"
 NOR_flexible_officers_academy_spirit_desc:0 "Bu yeni nesil subaylar [NOR.GetAdjective] ordularını zafere taşıyacak, çünkü sadece tozlu kitaplardan ve eski barış zamanı profesörlerinden daha fazlasını öğrenebilirler."
 NOR_folks_hydro:0 "Folks Hydro"
 NOR_improved_training_ns:0 "Geliştirilmiş Eğitim"
 NOR_improved_training_ns_desc:0 "Yeni eğitim programımız, adamları hayatta kalmak ve düşmanlarımızı yok etmek için bilmeleri gereken her şeyi öğretirken daha hızlı bir şekilde savaş alanına getirmemizi sağlıyor."
 NOR_independent_norway_dmod:0 "Bağımsız bir Norveç"
 NOR_independent_norway_dmod_desc:0 "1905'ten beri İsveç'ten bağımsızız ve o zamandan beri çok yol kat ettik. Şimdi atalarımızın hayalini kurduğu [NOR.GetNonIdeologyName] ülkesini yaratmak bizim elimizde."
 NOR_investing_in_norway_ns:0 "Norveç'e Yatırım"
 NOR_investing_in_norway_ns_desc:0 "Sermayemizin bir kısmını [NOR.GetName] ülkesine yatırmak sadece ülkelerimizi bir araya getirmekle kalmayacak, aynı zamanda gelecekte yardımlarına ihtiyacımız olması durumunda bir müttefiki güçlendirecektir."
 NOR_ketsen_plus_KK_fake_ns:0 "$NOR_kretsen_ns$ §Wve§! $NOR_coordinating_committee$"
 NOR_king_haakon_vii_ns:0 "Kral Haakon VII"
 NOR_king_haakon_vii_ns_desc:0 "13. yüzyıldan beri ilk [NOR.GetAdjective] hükümdarı olarak, Kral Haakon VII bir demokrasi örneğidir. Sadece bir referandumdan sonra tacı kabul etti ve [NOR.GetName] yönetimini danışmanlarına ve diğer yüksek rütbeli soylulara bıraktı."
 NOR_kingdom_of_norway_dmod:0 "$NOR_the_kingdom_of_norway$"
 NOR_kingdom_of_norway_dmod_desc:0 "O demokrasi cephesinin ne anlamı var? Şimdi Storting nihayet feshedildiğine göre, krallığımız kralımızın müşfik eli ve Lord Naibimiz Peder Anker Wedel-Jarlsberg'in adil yumruğu altında gelişebilir."
 NOR_kretsen_ns:0 "Kretsen"
 NOR_kretsen_ns_desc:0 "İşgalcilerimizin bağırsaklarının derinliklerine yerleşmiş ve Grimelund çiftliğinde gizli toplantılar düzenleyen bu grubun görevi, hem dışarıdan hem de faşist işgalin içinden sivil direnişi ellerinden geldiğince yönetmektir."
 NOR_kungens_garde_ns:0 "Hans Majestet Kongens Garde"
 NOR_kungens_garde_ns_desc:0 "Kralın 3 milyon koruması olabilir ama sadece bir kuvvet, [NOR.GetAdjective] ordusunun seçkinleri, düşmanlarımıza karşı kafa kafaya mücadele edebilir."
 NOR_liberate_finland_ns:0 "Finlandiya'yı Kurtar"
 NOR_liberate_finland_ns_desc:0 "[FIN.GetName] işçilerinin açıkça kurtarılmaya ihtiyacı var. Kendileri veya Fin kardeşleri için değil, toprak ağaları ve sanayicileri için çalışıyorlar. Yoldaşlarımıza bu toprağı kurtarmalarında yardım edelim ki devrim için çalışabilsinler."
 NOR_new_haeren_ns_1:0 "Yeni Hæren"
 NOR_new_haeren_ns_1_desc:0 "Geçmişin [NOR.GetAdjective] ordusu bu tehlikeli zamanlar için yeterli değildi. Bu, modern bir savaş için modern bir ordudur."
 NOR_new_haeren_ns_2_desc:0 "$NOR_new_haeren_ns_1_desc$"
 NOR_new_high_king:0 "Yeni bir Yüce Kral"
 NOR_new_high_king_desc:0 "Naip Peder Anker Wedel-Jarlsberg, kendisini Norveç'in yeni Yüce Kralı ilan ederek, doğrudan Kral Haakon unvanını almadan kendisini hükümdar olarak kabul ettirdi. Ancak bu hamle, ulusun komşuları arasında oldukça popüler değil."
 NOR_norwegian_regency:0 "Norveç Naipliği"
 NOR_norwegian_regency_desc:0 "Naip Peder Anker Wedel-Jarlsberg, sadece kralı Haakon VII'nin iradesini ve emirlerini yerine getirmeyi amaçladığını ilan etti. Bu nedenle, komşu İskandinav monarşileriyle yakınlaşma arayışındadır."
 NOR_obsolete_armed_forces_ns_1:0 "Eski Silahlı Kuvvetler"
 NOR_obsolete_armed_forces_ns_1_desc:0 "Norveç uzun zamandır silahlı kuvvetleriyle ilgilenmedi ve şimdi savaşta olmaktan çok bir müzede daha faydalı olurlardı."
 NOR_oppressed_civilians_dmod:0 "Ezilen Siviller"
 NOR_oppressed_civilians_dmod_desc:0 "Norveç vatandaşları, Nasjonal Samling tarafından yabancı tiranlar adına dayatılan faşist rejime karşı her türlü muhalefeti bastırmak için geniş kapsamlı bir dizi önlemle karşı karşıya."
 NOR_permanent_revolution_ns:0 "Kalıcı Devrim"
 NOR_permanent_revolution_ns_desc:0 "Lev Troçki'nin bize öğrettiği gibi, devrim dünya çapındaki her işçi kurtarılana ve emeklerinin meyveleriyle yeniden birleşene kadar sona ermeyecektir. Sınırlar işçi sınıfı için anlamsızdır."
 NOR_prep_fasc_dmod_1:0 "Faşist Destekçiler"
 NOR_prep_fasc_dmod_2:0 "$NOR_prep_fasc_dmod_1$"
 NOR_prep_fasc_dmod_3:0 "$NOR_prep_fasc_dmod_1$"
 NOR_prep_his_dmod_1:0 "Gelişiyor"
 NOR_prep_his_dmod_1_desc:0 "Bu eyaleti geri kalmış bir yerden küçük bir sivil sanayiye sahip olacak şekilde geliştirmek için çalışıyoruz."
 NOR_prep_his_dmod_2:0 "Gelişmiş"
 NOR_prep_his_dmod_2_desc:0 "#Bu eyalet makul ölçüde gelişmiş, ancak hala bir sanayi merkezi olarak kabul edilmek için uzun bir yolu var."
 NOR_prep_his_dmod_3:0 "yüksek derecede Gelişmiş"
 NOR_prep_his_dmod_3_desc:0 "Bu eyalet, Norveç'teki sivil sanayi davasına tamamen adanmıştır."
 NOR_prep_resistance_dmod:0 "Ekilen Direniş"
 NOR_prep_resistance_dmod_desc:0 "İşgalcilerimiz bizim hakkımızda ne düşünürse düşünsün, [NOR.GetNonIdeologyName] halkı o kadar kolay teslim olmayacak. Bu korkunç işgalcilere daha iyi direnebilmeleri için kullanabilecekleri insanlar ektik, aletler sakladık ve kaynaklar dağıttık."
 NOR_printing_money_ns:0 "Para Basma"
 NOR_printing_money_ns_desc:0 "On yıl gerçekten bitmeden Zor Otuzlar'dan çıkmak istiyorsak, paraya ve hem de çok paraya ihtiyaç olacak!"
 NOR_reduced_workers_rights_ns:0 "Azaltılmış İşçi Hakları"
 NOR_reduced_workers_rights_ns_desc:0 "Yaklaşan savaş ve kıyamet gerekçesiyle, şimdilik işçilerimizin haklarını sınırlama fedakarlığında bulunduk. Umarım savaş bittiğinde anlayacaklardır."
 NOR_royal_air_force_dmod:0 "Luftforsvaret"
 NOR_royal_air_force_dmod_desc:0 "Hava kuvvetlerimiz, sadece [NOR.GetAdjective] göklerinin efendileri olarak değil, aynı zamanda kendi kaderlerinin de efendileri olarak kabul edilebilecek bir noktaya geldi."
 NOR_royal_defenses:0 "Kraliyet Savunmaları"
 NOR_royal_defenses_desc:0 "Kraliyet Sarayı'nın emriyle, bu eyalet krallığı korumak için gerekli savunmaları inşa etmeye odaklanacaktır."
 NOR_royal_navy_dmod:0 "Sjøforsvaret"
 NOR_royal_navy_dmod_desc:0 "Gururlu donanmamız [NOR.GetName] çevresindeki ve ötesindeki denizlerde yelken açacak. Ne de olsa, ülkemize giden en geniş otoyol Kuzey Denizi'nin kendisidir."
 NOR_second_north_sea_empire:0 "İkinci Kuzey Denizi İmparatorluğu"
 NOR_second_north_sea_empire_desc:0 "Naip Peder Anker Wedel-Jarlsberg, Norveç'i eski ihtişamına geri döndürmeyi amaçladığını ve yeni bir Norveç İmparatorluğu'nun yükselmesinin sadece bir zaman meselesi olduğunu ilan etti."
 NOR_sivorg_ns:0 "Sivorg"
 NOR_sivorg_ns_desc:0 "Koordinasyon Komitesi ve Kretsen dahil sivil direniş gruplarının koleksiyonu. Onlar, faşizmi yeneceğimiz ve özgürlüğü [NOR.GetName] ülkesine geri getireceğimiz umuduna tutunması gereken iç cephenin erkekleri ve kadınlarıdır."
 NOR_the_hard_thirties_ns:0 "Zor Otuzlar"
 NOR_the_hard_thirties_ns_desc:0 "1929 Büyük Buhranı hala Norveç'teki her evde ve işyerinde hissediliyor. Bu on yılı atlatmak için bir mucize gerekebilir."
 NOR_ulfhedhnar_ns:0 "$NOR_ulfhedhnar_wolf_coats$"
 NOR_ulfhedhnar_ns_desc:0 "Geleneksel viking berserkerlerimiz olan Kurtpostluları yeniden canlandırdık. Bu adamlar savaşa hevesli ve dünya çapındaki fetihlerimize öncülük etmeye hazır."
