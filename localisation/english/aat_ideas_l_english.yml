 SWE_defense_in_depth_2:0 "Kamuflaj Uzmanları"
 SWE_economic_deregulation_idea:0 "Ekonomik Kuralsızlaştırma"
 SWE_economic_deregulation_idea_desc:0 "Hükümet, ekonomiye mümkün olduğunca müdahale etmekten kaçınmaya, bunun yerine onu serbest piyasanın iradesine bırakmaya karar verdi."
 SWE_economic_strain:0 "Ekonomik Gerginlik"
 SWE_economic_strain_desc:0 "Nordljus zırhlısının inşası, sivil ekonomi üzerinde ciddi bir ekonomik yük oluşturdu"
 SWE_en_svensk_lyder_lar:0 "En Svensk Lyder"
 SWE_en_svensk_lyder_lar_2:0 "$SWE_en_svensk_lyder_lar$"
 SWE_en_svensk_tiger_aat_lar:0 "$en_svensk_tiger$"
 SWE_en_svensk_tiger_aat_no_lar:0 "$en_svensk_tiger$"
 SWE_ericsson:0 "Ericsson"
 SWE_escaping_the_mainland:0 "Anakaradan kaçış"
 SWE_fascist_counter_revolution_0:0 "Karşı-devrim fısıltıları"
 SWE_fascist_counter_revolution_0_desc:0 "Nihayet iktidardayız, ancak sağcı totaliterlerden hala muhalefet fısıltıları var. Bu sadece bir yankı gibi kaybolacak muhalif fısıltılar mı, yoksa bir çığ başlatacak bir kükremeye mi dönüşecekler?"
 SWE_fascist_counter_revolution_1:0 "Ordu Muhalefeti"
 SWE_fascist_counter_revolution_1_desc:0 "Askeri liderlerimizden birden fazlası liderliğimize muhalefetini dile getirdi, hatta Kral bile görüşünü belirtti. Bu kalıntılar toplumumuzda ne rol oynadıklarını bilmeli ve orada kalmalıdırlar. Yine de bu sesler her geçen gün daha da cüretkarlaşıyor..."
 SWE_fascist_counter_revolution_2:0 "Geniş çaplı itaatsizlik"
 SWE_folkhemmet:0 "Folkhemmet"
 SWE_folkhemmet_army_status_text:0 "[SWE_rearmament_status_text_army]"
 SWE_folkhemmet_communism:0 "$SWE_folkhemmet$"
 SWE_folkhemmet_communism_desc:0 "Sosyal Demokratlar, yıllar içinde ‘Folkhemmet’ veya ‘halkın evi’ olarak bilinen bir dizi reform başlattı. Reformlar, askeri bütçe pahasına kitleler için bir sosyal güvenlik ağı, daha iyi konut ve eğitime daha fazla erişim yarattı. İşçi diktatörlüğü kurulduğunda, politikayı genişletme fırsatımız var."
 SWE_folkhemmet_desc:0 "$SWE_per_albin_hansson$ ve Sosyal Demokratlar, yıllar içinde ‘Folkhemmet’ veya ‘halkın evi’ olarak bilinen bir dizi reform başlattı. Reformlar, askeri bütçe pahasına kitleler için bir sosyal güvenlik ağı, daha iyi konut ve eğitime daha fazla erişim yarattı. Birçok kişi bu reformları değerli bulurken, daha varlıklı veya militarist bir duruşa sahip olanlar onlara küçümsemeyle bakıyor."
 SWE_folkhemmet_intactness_eroding:0 "§YAşınıyor§!"
 SWE_folkhemmet_intactness_gone:0 "§RAşınmış§!"
 SWE_folkhemmet_intactness_intact:0 "§GBoşver§!"
 SWE_folkhemmet_intactness_value:0 "§YFolkhemmet durumu:§! [SWE_folkhemmet_status_text] ([?SWE.folkhemmet_intactness]/[?SWE.folkhemmet_max_intactness])"
 SWE_folkhemmet_pdx_tooltip:0 "Her yıl [SWE.GetnameDef] ülkesinin yeniden silahlanması veya silahsızlanması için politikalar belirleyebiliyoruz. Toplumu yeniden silahlanmaya ne kadar itersek, §YSavaş Desteği§!, §YAskeri Fabrika§! ve §YTersane§! inşaat hızı bonusları o kadar güçlenirken, §Yİstikrar§! ve §YSivil Fabrika§! inşaat hızı o kadar zayıflayacaktır.\n0 §YBütünlüğe§! sahip bir §YFolkhemmet§!, sivil bonusların §Rnegatif§! ve askeri bonusların §Gpozitif§! olduğu bir tersine çevrilmedir. \n\nYeniden silahlanma komitesi toplandığında, politikaları serbestçe değiştirmek için bir süremiz olacak, ancak komite sona erdiğinde bu seçimler bir sonraki yıla kadar kilitlenecektir."
 SWE_folkhemmet_system_desc:0 "Dünya küresel bir çatışmaya her zamankinden daha fazla yaklaşırken, İsveç, refah sisteminin pahasına yeniden silahlanıp silahlanmayacağı ya da onu sağlam tutup gelecekteki bir çatışmaya hazırlıksız yakalanma riski arasında sıkışıp kalmıştır."
 SWE_foreign_communist_influence:0 "İsveç Sosyalist Nüfuzu"
 SWE_foreign_minister:0 "Dışişleri Bakanı"
 SWE_foreign_minister_no_bba:0 "$SWE_foreign_minister$"
 SWE_formation_flying_idea:0 "Formasyon uçuşu"
 SWE_full_capacity_furnaces:0 "Tam kapasiteli fırınlar"
 SWE_full_capacity_furnaces_desc:0 "Rakibimize ambargo uyguladıktan sonra şimdi hammadde fazlamız var. Daha önce kaynak kotalarıyla sınırlı olan ağır sanayi, şimdi gece gündüz çalışmak için ihtiyaç duydukları her şeye sahip. Yine de stoklarımız hızla doluyor ve küresel pazarın daha iyi savaşı sürdürmek için gereken kaynakları sağlamaya istekli olduğumuzu bildiğinden emin olmalıyız."
 SWE_gateway_to_peace:0 "Barışa Açılan Kapı"
 SWE_gateway_to_peace_decision:0 "Finlandiya'yı Savun"
 SWE_gateway_to_peace_decision_tt:0 "\n§YLeningrad§! kontrolünü ele geçirmek, [SOV.GetName] ülkesini bizimle ve [FIN.GetName] ile beyaz barış yapmaya zorlayacak veya ciddi sonuçlarla karşı karşıya bırakacaktır."
 SWE_gateway_to_peace_instant_desc:0 "Kızıl Ordu'ya karşı zafer kazanmamızın tek makul yolu, teslim olmaya zorlayacak kadar kesin ve hızlı bir darbe indirmektir.\n§YLeningrad§! kontrolünü ele geçirmek böyle bir darbe indirecek ve hatta barışla sonuçlanabilecektir."
 SWE_ger_defense:0 "Askeri Bağımsızlığı Koru"
 SWE_gotaverken_retooled_for_rapid_repairs:0 "Hızlı onarımlar için yeniden donatılmış Götaverken"
 SWE_gustaf_v_idea:0 "Kral Gustaf V"
 SWE_gustaf_v_idea_desc:0 "Gustaf V tahta çıktığında, İsveç siyaseti üzerinde hala büyük bir otoriteye sahipti. Yıllar içinde, otoritesi parlamenter bir demokrasinin kurulmasıyla aşındı. Düzenlemeyi nominal olarak desteklese de, Riksdag ile Kral arasında düzenli olarak sürtüşmeler yaşanır. "
 SWE_gustaf_v_idea_upgraded:0 "$SWE_gustaf_v_idea$"
 SWE_gustaf_v_idea_upgraded_desc:0 "$SWE_gustaf_v_idea_desc$"
 SWE_hedgehog_of_the_baltic:0 "Baltık'ın Kirpisi"
 SWE_historical_trade_with_Germany:0 "[GER.GetnameDef] ile tarihi ticaret"
 SWE_hungershield:0 "Hungersköld"
 SWE_hungershield_instant_desc:0 "İsveç, istikrar §Y68%§! altındaysa grev veya isyan riskiyle karşı karşıyadır. §YAşağıdakilerden biri doğruysa kaldırılacaktır:§!\nTicaret dahil §Y45§!'ten fazla sivil fabrikaya sahip \nTicaret hariç §Y14§!'ten fazla sivil fabrika inşa etmiş\nKaldırıldığında §G120§! §Ysiyasi güç§! kazan"
