l_english:
 BALTIC_align_paramilitarists:0 "Paramiliterleri Yeniden Hizala"
 BALTIC_align_paramilitarists_desc:0 "[Root.GetNameDef] genelinde çoğu yalnızca [Root.GetAdjective] kendi kaderini tayin hakkının korunmasına adanmış birçok paramiliter grup var. Takdire şayan olsa da, bu grupların bizi [SOV.GetAdjective] kuklaları olarak değil, [Root.GetAdjective] devletinin mantıksal devamı olarak görmeleri tercih edilir."
 BALTIC_allied_shipments:0 "Müttefik Sevkiyatlarını Artır"
 BALTIC_allied_shipments_desc:0 "1918'den beri [Root.GetNonIdeologyAdjective] ordusu Büyük Britanya'dan bize gönderilen sevkiyatlarla donatılmıştır ve Müttefiklere sevkiyatlar büyük ölçüde artırılmazsa [Root.GetNonIdeologyName]'in başka bir Sovyet kukla hükûmetine tabi olabileceğini anlatmak için çaba göstermeliyiz."
 BALTIC_arm_baltic_reds:0 "Baltık Kızıllarını Silahlandır"
 BALTIC_arm_baltic_reds_desc:0 "Sahne hazır, komünist şevk tüm Baltık'ta yanıyor. Kızılların şimdi tek ihtiyacı olan bizden gelen sinyal ve kaynaklar ve Baltık devrimini ateşleyeceğiz!"
 BALTIC_arm_the_nation:0 "Ulusu Silahlandır"
 BALTIC_arm_the_nation_desc:0 "[Root.GetNonIdeologyName]'in her yerinde bir Sovyet işgali tehdidiyle yüzleşmeye hazır ancak bunu yapacak ekipmandan yoksun adamlar var. Piyade teçhizatının hızlı üretimi için silah sanayimizi hazırlamalıyız."
 BALTIC_arms_industry:0 "Silahlanmayı Tamamla"
 BALTIC_arms_industry_desc:0 "Sanayimizin modernizasyonu tamamlandığına ve ülkemizde faaliyet gösteren sayısız yerli askerî sanayi kuruluşu olduğuna göre, [Root.GetAdjective] silah sanayisi nihayet gerçek potansiyeline ulaşabilir!"
 BALTIC_attract_workers_to_capital:0 "İşçileri [Root.Capital.GetName]'e Çek"
 BALTIC_attract_workers_to_capital_desc:0 "[Root.GetNonIdeologyName]'in işçileri kırsal kesimde dağınık bir şekilde yayılmış durumdalar ve genellikle modası geçmiş tarım sektöründe çalışıyorlar. Ulusumuzu savaş için sanayileştirmek istiyorsak, işçileri [Root.Capital.GetName]'deki fabrikalara çekmeliyiz!"
 BALTIC_autobahn:0 "[Root.GetAdjective] Otobanı"
 BALTIC_autobahn_desc:0 "Eğer altyapısı hızlı ve sürekli bir işgücü akışını kolaylaştırmıyorsa, [Root.GetNonIdeologyName]'in ne kadar iyi sanayileşmiş olduğu pek önemli değil. Altyapı sektörümüzü Reich'ınkine göre modelleyerek, onların sahip olduğu verimliliği elde edebiliriz."
 BALTIC_axis_investments:0 "[GetBalticAxisInvesmentsAdj] Yatırımları Ara"
 BALTIC_axis_investments_desc:0 "[GetBalticAxisInvesmentsDesc]"
 BALTIC_axis_investments_desc_fasc_eur:0 "Faşizm Avrupa'da güçlü bir varlığa sahiptir ve bazı anlaşılır çekinceler olsa da, Faşist ticaretinin ve yatırımlarının [ROOT.GetNonIdeologyAdjective] ekonomisini ölçülemez derecede güçlendireceği inkar edilemez."
 BALTIC_axis_investments_desc_fasc_int:0 "Faşizm dünya çapında güçlü bir varlığa sahiptir ve bazı anlaşılır çekinceler olsa da, Faşist ticaretinin ve yatırımlarının [ROOT.GetNonIdeologyAdjective] ekonomisini ölçülemez derecede güçlendireceği inkar edilemez."
 BALTIC_axis_investments_desc_ger:0 "Almanya'nın ticaret limanları Baltık boyunca mevcuttur ve bir zamanlar düşman olsak da, Mihver ticaretinin ve yatırımlarının [ROOT.GetNonIdeologyAdjective] ekonomisini ölçülemez derecede güçlendireceği inkar edilemez."
 BALTIC_axis_investments_desc_jap:0 "[JAP.GetName] ekonomik ve askerî gücünü kanıtladı ve tam olarak komşu olmasalar da, [JAP.GetAdjective] ticaretinin ve yatırımlarının [ROOT.GetNonIdeologyAdjective] ekonomisini ölçülemez derecede güçlendireceği inkar edilemez."
 BALTIC_baltic_fleet:0 "Baltık Filosu"
 BALTIC_baltic_fleet_desc:0 "[Root.GetNonIdeologyAdjective] filosu dünyanın gıpta ettiği bir filo olmasa da, doğru yatırımla [Root.GetNonIdeologyName]'i denizdeki herhangi bir işgal girişimine karşı savunabileceğini kanıtlayabilir."
 BALTIC_balticwall:0 "Baltık Duvarı"
 BALTIC_balticwall_desc:0 "Doğu'daki tahkimatlar, düşmanlarımız bunun yerine denizden bir saldırı gerçekleştirmeyi seçerse işe yaramaz! İngilizlere, Almanlara veya Sovyetlere rakip olabilecek bir donanma asla inşa edemeyebiliriz, ancak kıyı savunmalarımıza karşı onları çaresiz bırakmak için elimizden geleni yapabiliriz."
 BALTIC_belarus_ssr:0 "[Root.GetNonIdeologyName]-Belarus SSC"
 BALTIC_belarus_ssr_desc:0 "Belarus ve Baltık'ı birleştirme kavramı yabancı bir kavram değildir. Uzun zaman önce Litvanya-Belarus Sovyet Sosyalist Cumhuriyeti, bu iki görünüşte farklı halkın uyumlu bir birleşimi olarak var oldu. Sosyalizm kültür ve dil sınırları tanımaz ve [Root.GetAdjective] ve Belaruslu işçilerin bir arada yaşayamaması için çok az neden görüyoruz."
 BALTIC_british_aircraft:0 "[GetBritAircraftManufTitle]"
 BALTIC_british_aircraft_alt:0 "Yabancı Uçak İmalatı"
 BALTIC_british_aircraft_default:0 "İngiliz Uçak İmalatı"
 BALTIC_british_aircraft_desc:0 "[GetBritAircraftManufDesc]"
 BALTIC_british_aircraft_desc_alt:0 "Yerli havacılık tasarımlarına yönelik çabalar şimdiye kadar en iyi ihtimalle ılımlı kaldı. Hava kuvvetleri şimdiye kadar Alman ve Sovyet kuvvetlerinden ele geçirilen uçaklara güvendi, ancak hayatta kalmak istiyorsak yerli uçak üretimine başlamalıyız ve yabancı bir hava kuvvetlerinden gelen yardım zafer kazanmanın anahtarı olabilir..."
 BALTIC_british_aircraft_desc_default:0 "Yerli havacılık tasarımlarına yönelik çabalar şimdiye kadar en iyi ihtimalle ılımlı kaldı. Hava kuvvetleri şimdiye kadar Alman ve Sovyet kuvvetlerinden ele geçirilen uçaklara güvendi, ancak hayatta kalmak istiyorsak yerli uçak üretimine başlamalıyız ve İngiliz hava kuvvetleri zafer kazanmanın anahtarı olabilir..."
 BALTIC_british_designers:0 "İngiliz Tasarımcıları Davet Et"
 BALTIC_british_designers_desc:0 "İngiliz tasarımlarını kapsamlı bir şekilde inceledik ve [Root.Capital.GetName]-Crossley Motorları'nın başarılı bir girişim olduğu kanıtlandığından, İngiliz tasarımcıları [Root.GetNonIdeologyAdjective] Mühendislik Şirketi'ne katılmaya resmî davetiyeler göndermek bizim için iyi olacaktır."
 BALTIC_communist_opposition:0 "Muhalefete Geç"
 BALTIC_communist_opposition_desc:0 "Sovyetler Birliği'nin ne [Root.GetNameDef]'e ne de halkına dost olmadığı kanıtlanmıştır ve [Root.GetNameDef]'in anahtarlarını, [Root.GetAdjective]'i yağmalamaktan başka bir şey istemeyen Kızıl Ordu'nun akbabalarına teslim etmek aptallık olur. Onlar kapitalistlerden daha güvenilir değiller ve eğer [Root.GetCommunistParty] başarılı olacaksa, bu tek başına yapılmalıdır!"
 BALTIC_concessions_for_catholics:0 "Katolikler İçin Tavizler"
 BALTIC_concessions_for_catholics_desc:0 "[Root.GetNameDef]'in alt sınıflarının çoğu dindar Katoliktir ve ilk İşçi Cumhuriyeti'nde dinî uygulama Kızıl Ordu tarafından sert bir şekilde bastırılmıştır. Bu durum [Root.GetNameDef]'in yoksullarının çoğunu devrime karşı çevirdi, bu yüzden eğer gerçekten halkın cumhuriyeti olacaksak, onlara inançlarının korunacağına dair kesin bir güvence vermeliyiz."
 BALTIC_crossley_motors:0 "[Root.Capital.GetName]-Crossley Motorları"
 BALTIC_crossley_motors_desc:0 "Ulusumuzda artık yabancı yatırım yaygınlaşmış ve otomobil üretimi makul bir verimlilikteyken, [Root.GetNonIdeologyAdjective] ordusu içinde kullanılmak üzere orijinal tasarımlar oluşturmak için Crossley Motor Şirketi ile işbirliği yapabiliriz!"
 BALTIC_crush_forest_brothers:0 "Orman Kardeşlerini Ez"
 BALTIC_crush_forest_brothers_desc:0 "Orman Kardeşleri, yönetimi ele geçirmemizden bu yana ulusumuz için bir bela oldular; sanayilerimizi, demiryollarımızı sabote ediyor ve resmî hükûmet gösterilerini bozuyorlar. [Root.GetNonIdeologyName]'in ormanlarına girmeli ve bu yanlış yönlendirilmiş bireyleri kökünden sökmeliyiz."
 BALTIC_defence_of_our_nation:0 "Ulusumuzun Savunması"
 BALTIC_defence_of_our_nation_desc:0 "Sivil sanayi, savunmamız için silah sanayisi kadar önemlidir. Makine seslerinin sürekli uğultusu, vatansever halkı ulusumuzu sanayileştirme görevini yaparken tüm [Root.GetNonIdeologyName] boyunca yankılanacak."
 BALTIC_direct_intervention:0 "Doğrudan Sovyet Müdahalesi"
 BALTIC_direct_intervention_desc:0 "Hükûmeti tek başımıza geri alamadığımızı kanıtladık ve mücadelemizde bize yardım etmeleri için [SOV.GetNameDef]'deki müttefiklerimizi çağırmalıyız."
 BALTIC_domestic_motors:0 "Yerli Bir Motor Şirketi"
 BALTIC_domestic_motors_desc:0 "Yabancı tasarımlar iyidir, ancak onlara sonsuza kadar güvenemeyiz. [Root.GetNonIdeologyName] gururlu bir ulustur ve dünyaya tasarımcılarımızın ve düşünürlerimizin Batı'dakiler kadar yeterli olduğunu göstermeliyiz."
 BALTIC_eastwall:0 "Doğu Duvarı"
 BALTIC_eastwall_desc:0 "Almanlar da en az bizim kadar Doğu'dan bir saldırı bekliyor ve Alman yetkililere kendi sınırları kadar bizim sınırımızı da kuvvetle tahkim etmeleri tavsiye edilir."
 BALTIC_end_bourgeouis_dictatorships:0 "Burjuva Diktatörlüklerine Son Ver"
 BALTIC_end_bourgeouis_dictatorships_desc:0 "Baltıklar sözde “tarafsız” diktatörler tarafından domine ediliyor. Ordunun desteğiyle ve halklarının rızası olmadan, Baltık proletaryası kapitalist diktatörlük altında eziliyor. Sadece özgürleşmiş [Root.GetAdjective] işçilerinin elleriyle, haksız sınırlar tarafından ayrı tutulan bu işçiler şanlı kurtuluşumuzu paylaşabilir!"
 BALTIC_end_swedish_neutrality:0 "İsveç Tarafsızlığına Son Ver"
 BALTIC_end_swedish_neutrality_desc:0 "İsveçlilerin tarafsızlık dediği şey zayıflıktan başka bir şey değildir; sınırları ötesindeki alt sınıfların refahına çok az önem vererek, o an en güçlü görünen gücün kaprislerine boyun eğmek. Böylesine zayıf iradeli ve dayanıksız bir hükûmet, sınırımızı paylaşmaya layık değildir ve halkını tiranlıktan koruyacak omurgaya sahip yeni bir İsveç yaratmalıyız."
 BALTIC_finnish_invasion:0 "Finlandiya İşgali"
 BALTIC_finnish_invasion_desc:0 "Finlandiya bizim için kapitalizmin prangaları altına bağlanmış kayıp bir kardeştir. Finlandiya ancak şiddetli bir devrimle, tıpkı Baltıkların özgürleştiği gibi özgürleşebilir."
 BALTIC_focus_on_the_interior:0 "İç Meselelere Odaklan"
 BALTIC_focus_on_the_interior_2:0 "Almanlara Hazırlan"
 BALTIC_focus_on_the_interior_2_desc:0 "Freikorps'un [Root.GetNameDef]'e bunca yıl önce getirdiği mutlak vahşeti unutmamamız hayati önem taşıyor. Köylüler ve işçiler hayvan gibi katledildi, tüm köyler küle ve harabeye döndü ve [Root.GetAdjective] halkının bir daha asla böyle bir vahşete maruz kalmasına izin veremeyiz."
 BALTIC_focus_on_the_interior_desc:0 "Birçok işçi komşularımıza yürümeye ve şanlı devrimimizi tüm Baltık halklarına getirmeye hevesli olsa da, bunun yerine ulusumuzun içine odaklanmalıyız; devrimin ardından rejimi istikrara kavuşturmalıyız."
 BALTIC_ford_motors:0 "[Root.Capital.GetName] Ford Sanayisi"
 BALTIC_ford_motors_desc:0 "Ford motor şirketi, dünya çapında Amerikalılara ve diğer Müttefik uluslara seri üretilen uygun fiyatlı motorlu taşıtlar sağlama konusunda iyi bir iş çıkardı. Eğer [Root.Capital.GetName]'de bir Ford fabrikası kurarsak, hem kendi ordumuz için araç sağlayabilir hem de onları Batı'ya ihraç ederek güzel bir kâr elde edebiliriz."
 BALTIC_forment_disloyalty:0 "Muhalefeti Birleştir"
 BALTIC_forment_disloyalty_desc:0 "Hem [Root.GetAdjective] hükûmetinin içinde hem de dışında birçok hareket var ve eğer [Root.GetNameDef]'i rahatsız eden mevcut tiranlığı devireceksek, [Root.GetNeutralParty]'e karşı muhalefetin birleştirici sesi olmalıyız!"
 BALTIC_free_the_workers_of_poland:0 "Polonya İşçilerini Özgürleştir"
 BALTIC_free_the_workers_of_poland_desc:0 "Polonyalılar bir zamanlar Baltık'ı yönetmiş olsalar da, şimdi [GER.GetNameDef]'in yırtıcı rejimine karşı savunmasız bir av durumundalar. Güney'deki yoldaşlarımızı savunmalı ve onları bir Polonya Sosyalist Cumhuriyeti altında birleştirmeliyiz!"
 BALTIC_german_baltic_industry:0 "Mihver-Baltık Sanayisi"
 BALTIC_german_baltic_industry_desc:0 "[GetGermanBalticIndustryDesc]"
 BALTIC_german_baltic_industry_desc_alt:0 "Ulusumuz şimdi yabancı faşist yatırımı açısından zengin. Diğer faşist hamilerimizin ve [Root.GetNonIdeologyName]'in özel sektörleri neredeyse ayırt edilemez, aynı şirketlerin birçoğu [Root.GetNonIdeologyAdjective]lere ve halklarına aynı şekilde iş sağlıyor."
 BALTIC_german_baltic_industry_desc_default:0 "Ulusumuz şimdi Alman yatırımı açısından zengin. Almanya'nın ve [Root.GetNonIdeologyName]'in özel sektörleri neredeyse ayırt edilemez, aynı şirketlerin birçoğu [Root.GetNonIdeologyAdjective]lere ve Almanlara aynı şekilde iş sağlıyor."
 BALTIC_german_tank_licences:0 "[GetBalticAxisInvesmentsAdj] Tank Lisansları"
 BALTIC_german_tank_licences_desc:0 "[GetGermanTankLicencesDesc]"
 BALTIC_german_tank_licences_desc_alt:0 "Faşist hamilerimizin tankları, hedeflerine doğru ilerlerken düşmanlarını dağınık ve şaşkın bırakma yeteneklerini kanıtladılar. [Root.GetNonIdeologyName], Doğu'ya yönelik yaklaşan savaşlarda bu taktikleri taklit etmekten büyük fayda sağlayacaktır."
 BALTIC_german_tank_licences_desc_default:0 "Alman tankları, hedeflerine doğru ilerlerken düşmanlarını dağınık ve şaşkın bırakma yeteneklerini kanıtladılar. [Root.GetNonIdeologyName], Doğu'ya yönelik yaklaşan savaşlarda bu taktikleri taklit etmekten büyük fayda sağlayacaktır."
 BALTIC_german_war_economics:0 "[GetBalticAxisInvesmentsAdj] Savaş Ekonomisini Benimse"
 BALTIC_german_war_economics_desc:0 "[GetGermanWarEconomicsDesc]"
 BALTIC_german_war_economics_desc_alt:0 "Faşist hamilerimiz, daha önce birkaç kez gördüğümüz türden hızlı bir askerî sanayileşme sürecindeler ve onları taklit etmek ve onlardan yatırım aramak bizim için iyi olacaktır."
 BALTIC_german_war_economics_desc_default:0 "Almanlar, Avrupa'nın daha önce birkaç kez gördüğü türden hızlı bir askerî sanayileşme sürecindeler ve onları taklit etmek ve Reichsbank'tan yatırım aramak bizim için iyi olacaktır."
 BALTIC_influence_neighbours:0 "Komşuları Etkile"
 BALTIC_influence_neighbours_desc:0 "Bağımsızlık savaşlarından önce olduğu kadar popüler olmasa da, sosyalizm altında özgür bir Baltık kavramı, Baltık'ın kendi kaderini tayin etme kavramı kadar eskidir. Devletimiz, Baltık diktatörlüklerinin baskıcı rejimleri altında yaşayanlar tarafından modellenecek bir şey olarak durabilir ve bunu silahlandırarak Devrimi komşularımıza kansız bir şekilde yayma şansımız var."
 BALTIC_invest_in_baltic_trade:0 "Baltık Ticaretine Yatırım Yap"
 BALTIC_invest_in_baltic_trade_desc:0 "Baltık Denizi, İskandinavya, Almanya ve Rusya'dan gelen ticaretle zengindir ve limanlarımız hepsini zorlukla barındırabilir. Daha parlak ve müreffeh bir [Root.GetNonIdeologyName] için bu denizi bizimle paylaşan dostlarımızla yeni ticaret hatları açmalıyız!"
 BALTIC_investments:0 "Baltık Yatırımları"
 BALTIC_military_support_tt:0 "§Yİç savaş§! başladığında, §YKomünistler§! §G%20§! §Ydaha büyük bir askerî paya§! sahip olacaklar."
 BALTIC_modernize_industry:0 "Sanayimizi Modernleştir"
 BALTIC_modernize_industry_desc:0 "Çok uzun zamandır, [Root.GetNonIdeologyName]'in üretimi tarımla tanımlandı ama artık değil. [Root.GetNonIdeologyName]'i modern bir ekonomiye dönüştüreceksek, sanayimizi her eyaletteki büyük şehir merkezleri etrafında yoğunlaştırmalıyız."
 BALTIC_natural_resources:0 "Doğal Kaynakları Geliştir"
 BALTIC_natural_resources_desc:0 "[Root.GetNaturaResource_BAL], Sovyetler, Müttefikler ve diğer Baltık devletleriyle yaptığımız ticaret sayesinde ülkemizi zenginleştirdi ve ülke genelinde [Root.GetExtraction_BAL]'a yatırım yaparak bu endüstriye daha fazla yatırım yapmak bizim için iyi olacaktır!"
 BALTIC_original_designs:0 "Orijinal Tasarımlar"
 BALTIC_original_designs_desc:0 "Ulusumuzun 1918'deki doğumundan günümüze kadar, [Root.GetNonIdeologyName] ordularını İngilizlerden gelen silahlarla donattı, ama artık değil. Artık İngilizlere güvenemeyiz, ileriye bakmalı ve [Root.GetNonIdeologyAdjective] menşeli silah üretmeye başlamalıyız."
 BALTIC_overthrow_the_government:0 "[Root.GetNeutralParty]'i Devir"
 BALTIC_overthrow_the_government_desc:0 "[Root.GetLeader]'i ve [Root.GetLeader.GetHerHis] rejimini devirmek için yeterli desteği topladık! Tek yapmamız gereken başkente yürümek ve yeni bir İşçi Cumhuriyeti ilan etmek!"
 BALTIC_path_to_the_north_sea:0 "Kuzey Denizi'ne Bir Yol"
 BALTIC_path_to_the_north_sea_desc:0 "Danimarkalılar bu tırmanan küresel çatışmada ne yazık ki tarafsız kaldılar ve Danimarka boğazları, sosyalist dünyayı Kuzey Denizi'nden ayıran tek şey."
 BALTIC_purge_of_our_own:0 "Kendi Tasfiyemiz"
 BALTIC_purge_of_our_own_desc:0 "Tüm direnişi ezmek için gösterdiğimiz en iyi çabalara rağmen, hala gölgelerde örgütlenen, [Root.GetNonIdeologyName]'de kapitalist bir diktatörlüğü yeniden kurmak için proletaryaya karşı komplo kuranlar var. Popüler bir tasfiye yapmalıyız; eski hükûmetin tüm üyelerini ve onları destekleyen herkesi kökünden sökmeliyiz."
 BALTIC_reached_out:0 "Diplomatik Temas"
 BALTIC_rebuild_forts:0 "[Root.Capital.GetName] Kalelerini Yeniden İnşa Et"
 BALTIC_rebuild_forts_desc:0 "Bağımsızlık savaşları sırasında, [Root.Capital.GetName] bir şehirden çok bir kaleydi. Tahkimatlar büyük ölçüde sökülmüş ve unutulmuş olsa da, yeniden inşa edilmeli, bakımı yapılmalı ve savaşa hazır hale getirilmelidir."
 BALTIC_red_army:0 "[Root.GetAdjective] Kızıl Tüfekliler"
 BALTIC_red_army_desc:0 "Ordumuz, yalnızca [Root.GetNameDef] içinde sosyalizmi savunmaya ve onu dünya halkı arasında yaymaya istekli olanlardan oluşmalıdır ve bu ancak [Root.GetAdjective] Kızıl Tüfeklileri geri getirerek başarılabilir."
 BALTIC_rejoin_the_railways:0 "Demiryollarını Yeniden Birleştir"
 BALTIC_rejoin_the_railways_desc:0 "Bizi işgal eden Ruslar ve Almanlar bizi kırsal bir taşradan başka bir şey olarak görmediler, ama artık değil. [ROOT.GetNonIdeologyName], demiryollarımızın ve altyapımızın bir yükseltmesiyle başlayarak maksimum potansiyeline kadar sanayileştirilecektir."
 BALTIC_renew_allied_trade:0 "[GetBalticRenewAlliedTradeTitle]"
 BALTIC_renew_allied_trade_alt:0 "Yabancı Yatırımlar Ara"
 BALTIC_renew_allied_trade_default:0 "Müttefik Ticaretini Yenile"
 BALTIC_renew_allied_trade_desc:0 "[GetBalticRenewAlliedTradeDesc]"
 BALTIC_renew_allied_trade_desc_allied:0 "Devletimizin kuruluşundan bu yana Müttefiklere ticaret ve askerî destek için bağımlı olduk ve şimdi bundan vazgeçmek bizim için ahmakça olur. Sınırlarımıza tecavüz eden Almanların ve Rusların saldırısından bir kez daha kurtulacaksak, ulusumuza Müttefik yatırımlarını çekmeliyiz."
 BALTIC_renew_allied_trade_desc_default:0 "Devletimizin kuruluşundan bu yana İngiliz ticaretine ve askerî desteğine bağımlı olduk ve şimdi bundan vazgeçmek bizim için ahmakça olur. Sınırlarımıza tecavüz eden Almanların ve Rusların saldırısından bir kez daha kurtulacaksak, ulusumuza müttefik yatırımlarını çekmeliyiz."
 BALTIC_renew_allied_trade_desc_international:0 "Devletimizin kuruluşundan bu yana diğer uluslara ticaret ve askerî destek için bağımlı olduk ve şimdi bundan vazgeçmek bizim için ahmakça olur. Sınırlarımıza tecavüz eden Almanların ve Rusların saldırısından bir kez daha kurtulacaksak, ulusumuza yabancı yatırımlarını çekmeliyiz."
 BALTIC_request_german_support:0 "[GetBalticAxisInvesmentsAdj] Desteği İste"
 BALTIC_request_german_support_desc:0 "[GetRequestGermanSupportDesc]"
 BALTIC_request_german_support_desc_alt:0 "Faşist hamilerimizin endüstriyel kapasitesinden yoksunuz, ancak belki de yetkililerini, Doğu'ya yönelik yaklaşan Komünist tehdide karşı kendimizi daha iyi savunmak için bize fazladan stoklanmış ekipman vermeye ikna edebiliriz."
 BALTIC_request_german_support_desc_default:0 "Almanya'nın endüstriyel kapasitesinden yoksunuz, ancak belki de Alman yetkilileri, Doğu'ya yönelik yaklaşan Komünist tehdide karşı kendimizi daha iyi savunmak için bize fazladan stoklanmış ekipman vermeye ikna edebiliriz."
 BALTIC_restore_workers_republic:0 "İşçi Cumhuriyetini Geri Getir"
 BALTIC_restore_workers_republic_desc:0 "Bağımsızlık mücadelemiz sırasında, Sovyetler bir [Root.GetAdjective] İşçi Cumhuriyeti'nin kurulmasına yardım etti. Cumhuriyet başarısız olsa da, liderleri hem [Root.GetNameDef] hem de [SOV.GetNameDef]'de hayatta kalmaya devam ediyor, bu nedenle işçi cumhuriyeti umudu hala var!"
 BALTIC_revolutionary_cabinet:0 "Devrimci Bir Kabine"
 BALTIC_revolutionary_cabinet_desc:0 "Şimdi alt sınıfın yılmaz bekçileri olarak hak ettiğimiz yere geri döndüğümüze göre, yeni devletimizin ideolojisiyle uyumlu bir bakanlar kurulunu yeniden toplayabiliriz."
 BALTIC_school_of_aviation:0 "Baltık Havacılık Okulu"
 BALTIC_school_of_aviation_desc:0 "Bağımsızlık savaşı sırasında hava ve denizin kontrolü mücadelesi bizim adımıza İngilizler tarafından verildi, ancak İngilizler Nazi tehdidine taviz üstüne taviz vermeye devam ederken bizi tekrar savunacaklarına güvenemeyiz. Gökyüzüne kendimiz çıkmalıyız!"
 BALTIC_school_of_aviation_tech_bonus:0 "Havacılık Okulu"
 BALTIC_secure_military_support:0 "Askerî Destek Sağla"
 BALTIC_secure_military_support_desc:0 "Ordudaki birçok kişi ulusu [Root.GetLeader]'den kurtarmak istiyor, tek yapmamız gereken onlara yaklaşmak. Şan ve şöhret arayan bir general, halkın kahramanı olma vaadiyle davamıza kesinlikle çekilecektir."
 BALTIC_seek_support_of_soviets:0 "Sovyetlerin Desteğini Ara"
 BALTIC_seek_support_of_soviets_desc:0 "Kızıl Ordu [Root.GetNameDef]'i yerle bir edip ulusumuzu yeni bir Rus emperyalizmi çağına sokmuş olsa da, onların yardımı olmadan [Root.GetNameDef]'e sosyalizmi getirme şansımız yok."
 BALTIC_seek_support_of_soviets_tt:0 "§R[SOV.GetAdjective] nüfuzunu kabul etmek, devrim başladığında onların kuklası olmamıza yol açacaktır.§!"
 BALTIC_sieze_the_means_of_production:0 "Üretim Araçlarına El Koy"
 BALTIC_sieze_the_means_of_production_desc:0 "Eski hükûmet, [Root.GetAdjective] halkının emeğini sömürmek için denizaşırı yatırımcıları davet etti. Proletaryanın ellerinin yabancı burjuva efendilerine hizmet etmeye devam etmesine izin veremeyiz ve bu çok uluslu şirketler tarafından inşa edilen tüm fabrikalar [Root.GetNameDef]'in velayeti altına alınmalıdır."
 BALTIC_soviet_equipment:0 "Sovyet Ekipmanı"
 BALTIC_soviet_equipment_desc:0 "Milislerimizi silahlandırmak için gerekli silah ve malzemelere erişmeden hükûmeti devirmeyi umut edemeyiz. Ruslardan yardım için temas kurarak, eski hükûmet devrimi durdurmaya çalışırsa ordularımızı desteklemek için fazladan silah kazanacağız."
 BALTIC_soviet_military_staff:0 "Sovyet Askerî Personeli"
 BALTIC_soviet_military_staff_desc:0 "[Root.GetAdjective] İşçi Cumhuriyeti dağıtıldıktan sonra, askerî personelimiz büyük ölçüde SSCB'ye sürgüne gitti. Eve getirilmeleri gerekiyor."
 BALTIC_soviet_volunteer_forces:0 "Sovyet Gönüllü Kuvvetleri"
 BALTIC_soviet_volunteer_forces_desc:0 "SSCB, dünya devrimi için savaşmaya ve ölmeye hazır adamlarla adeta taşıyor. [Root.GetNameDef] komünist bir dünya mücadelesinde sadece bir basamak taşı olsa da, davamız için ölmeye hazır cesur Rus sosyalistlerinin sıkıntısı yok."
 BALTIC_soviet_volunteers_tt:0 "§Yİç savaş§! başladığında, §Y5 Piyade Tümeni§! kazan!"
 BALTIC_squash_resistance:0 "Tüm Direnişi Ez"
 BALTIC_squash_resistance_desc:0 "Hala sosyalizmin [Root.GetAdjective] egemenliğinin düşmanı olduğuna inanan insanlar var ve devrimi ilerleteceksek bu insanlar kökünden sökülmelidir."
 BALTIC_supported_fascism:0 "Baltık Milliyetçiliğini Destekledi"
 BALTIC_tech_sharing_tt:0 "İttifakımızın tüm üyeleriyle bir §Yteknoloji paylaşım anlaşması§! yapacağız."
 BALTIC_technology_sharing:0 "Teknoloji Paylaşımı"
 BALTIC_technology_sharing_desc:0 "Halihazırda ortağımızın birçok ekipmanını üretiyoruz, ancak belki de tasarımlarını inceleyerek yerli [Root.GetNonIdeologyAdjective] tasarımlarını önemli ölçüde geliştirebiliriz."
 BALTIC_trade:0 "Baltık ticaretine yatırım yaptı"
 BALTIC_trade_with_neighbors:0 "Komşularla Ticaret Yap"
 BALTIC_trade_with_neighbors_desc:0 "Almanlara veya Sovyetlere her ticaret yatırımı yaptığımızda, kendi kıyametimize katkıda bulunuyoruz. Düşman birliklerinin erzaklarında Litvanya tahılı ve tanklarında Letonya çeliğinden yapılmış Estonya petrolü ile [Root.GetNonIdeologyName]'i işgal etmesine izin veremeyiz. Bunun yerine ortak düşmanımızı yenmek için birbirimize yardım etmeliyiz."
 BALTIC_unchain_education:0 "Eğitimimizin Zincirlerini Kır"
 BALTIC_unchain_education_desc:0 "[Root.GetNonIdeologyAdjective] eğitim sistemi uzun zamandır dağınık nüfus merkezlerimiz tarafından kısıtlanmıştır, ancak şimdi kırsal halkın şehirlere daha yakınlaşmasıyla, [Root.GetNonIdeologyAdjective] gençliğini daha verimli bir şekilde eğitebileceğiz."
 BALTIC_united_baltic_ssr:0 "Birleşik bir Baltık SSC"
 BALTIC_united_baltic_ssr_desc:0 "Kültür, dil ve kimlik açısından farklı olsalar da, üç Baltık Devleti arasında uzun zamandır bir kardeşlik ve yoldaşlık vardır. Komşularımızın da diğer [Root.GetAdjective]ler kadar yoldaş olduğu kabul edilmelidir ve tek bir işçi cumhuriyetinde birleşmezsek işçiler sadece kaybeder."
 BALTIC_western_revolution:0 "Devrimi Batı'ya Taşı"
 BALTIC_western_revolution_desc:0 "Devrim Baltık'ta durmuyor. Neredeyse tüm Avrupa'nın alt sınıfları, kapitalizmin katı çizmeleri altında fabrikalarda köle gibi çalışıyor ve onları yalnızca [Root.GetAdjective] işçileri kurtarabilir."
 BALTIC_will_be_at_war_with_EST:0 "Eğer kabul ederlerse, §Y[Root.GetNameWithFlag]§! derhal §Y[EST.GetNameWithFlag]§! ile §Rsavaşa§! girecektir."
 BALTIC_will_be_at_war_with_LAT:0 "Eğer kabul ederlerse, §Y[Root.GetNameWithFlag]§! derhal §Y[LAT.GetNameWithFlag]§! ile §Rsavaşa§! girecektir."
 BALTIC_will_be_at_war_with_LIT:0 "Eğer kabul ederlerse, §Y[Root.GetNameWithFlag]§! derhal §Y[LIT.GetNameWithFlag]§! ile §Rsavaşa§! girecektir."
 BALT_belarus_claims_tooltip:0 "Mevcut §YBaltık Talepleri§! §Y[?BALTIC_claims]§!."
 BALT_claims_no_greater_than_2_tt:0 "§YBaltık Talepleri§!, §Y2§!'den büyük değil."
 BALT_claims_no_less_than_2_tt:0 "§YSovyet Talepleri§!, §Y2§!'den büyük değil."
 BALT_current_claims_tt:0 "[Root.GetBelarusClaimStrength]"
 BLT_you_can_ban_communism_tt:0 "§YKomünizmi Yasakla§! kararını uygulayarak, §Yyabancı Baltık Devletleri§! artık ulusumuzda komünizmi destekleyemeyecek."
 CHI_overlordship_over_indochina_tt:0 "Onlara karşı bir savaş hedefi kazanırız."
 EST_anti_communist_militia:0 "Anti-Komünist Milisler"
 EST_anti_communist_militia_desc:0 "Ulus, doğumuzdaki Bolşevik tehdidiyle savaşmaya istekli ancak eski hükûmet tarafından çok radikal oldukları için reddedilen adamlarla dolu. Vaps'lar için hiçbir miktarda anti-komünist düşünce çok radikal değildir ve bu adamlar ordumuzda diğerleri kadar bir yeri hak ediyor."
 EST_baltic_defence_army:0 "Baltık Savunma Ordusu"
 EST_baltic_defence_army_desc:0 "Silahlı kuvvetlerimiz birlikte çalışıyor ancak esasen ayrı varlıklar. Uluslarımız arasındaki bağlar güçlendikçe, aynı anda hiçbir Baltık Devleti tarafından kontrol edilmeyen ancak hepsinin bir müttefiki olan ayrı bir varlık olan Birleşik Baltık Silahlı Kuvvetleri'ni kurabiliriz."
 EST_baltic_economic_union:0 "Baltık Ekonomik Birliği"
 EST_baltic_economic_union_desc:0 "Şimdi liberal demokrasi ulusumuza geri döndüğüne ve komşularımızla yakın diplomatik bağlar kurduğumuza göre, diğer Baltık Devletleriyle bir ekonomik birliğe girmek mantıklı. Ekonomilerimiz küçük olsa da, birlikte güçlenebilirler!"
 EST_baltic_shield:0 "Baltık Kalkanı"
 EST_baltic_shield_desc:0 "Sovyetler, Estonya'yı emperyalizmin çizmeleri altında ezmek istiyor, ancak bunun olmasına izin veremeyiz. Sınır boyunca sığınaklar inşa edilmeli, Sovyetleri yenemeyebiliriz, ama en azından başka biri gelene kadar ayakta kalabiliriz."
 EST_baltic_stronger_together:0 "Birleşik ama Ayrı"
 EST_baltic_stronger_together_desc:0 "Baltık Devletleri arasında uzun zamandır bir kardeşlik ve yoldaşlık duygusu var, ama her zaman sınırlar ve siyasetle ayrıldık. Bağımsızlığımızı koruma isteğimizle diplomatik olarak birbirimize bağlıyız ve bu yüzden dostlarımız için savaşmaya ve birleşik Baltık silahlı kuvvetlerini genişletmeye kararlı olmalıyız!"
 EST_baltic_unification:0 "Baltık Birleşmesi"
 EST_baltic_unification_desc:0 "Baltık Devletleri arasında uzun zamandır bir kardeşlik ve yoldaşlık duygusu var, ama her zaman sınırlar ve siyasetle ayrıldık. Bağımsız kimliklerimiz güçlü olsa da, varlığımızı korumak için savaşma isteğimiz bizi birbirimize bağlıyor. Belki de Baltık Birliği'nin kendi başına bir ulusa dönüşme zamanı gelmiştir."
 EST_beyond_the_baltic:0 "Baltık'ın Ötesi"
 EST_beyond_the_baltic_desc:0 "Bazıları Baltık Antantı'nın küçük ulusumuzu işgalden korumak için yeterli olduğu konusunda ısrar etse de, hepimiz bunun bir yanılgı olduğunu biliyoruz. Müttefikler 1918'de kendi kaderimizi tayin etme mücadelemizde bize yardım ettiler ve belki de tekrar yardımımıza gelmelerini beklemek o kadar da ahmakça olmaz!"
 EST_break_the_silence:0 "Sessizliği Boz"
 EST_break_the_silence_desc:0 "Konstantin Päts, bu diktatörlüğü Estonya'yı faşizm ve komünizmden koruma bahanesiyle kurdu. Şimdi bu ideolojiler önemsizliğe itildiğine göre, diktatörlüğün devam etmesi için çok az neden var ve serbest seçimler yeniden açılmalıdır."
 EST_cave_to_enemy_pressure:0 "Düşman Baskısına Boyun Eğ"
 EST_cave_to_enemy_pressure_desc:0 "Hem ulusumuzun hem de halkımızın hayatta kaldığı bir geleceğin olmadığı açıkça ortaya çıktı. Akrabalarımızı korumak için çok şey yapmış olsak da, [Root.GetNonIdeologyName]'in halkına büyük bir kayıp vermeden bağımsızlığını sürdürmesinin hiçbir yolu olmadığı açıkça görülüyor."
 EST_chamber_of_deputies:0 "Mebuslar Meclisini Güvence Altına Al"
 EST_chamber_of_deputies_desc:0 "Ulusal Konsey artık Isamaaliit'in sıkı kontrolü altındayken, geriye kalan tek şey Mebuslar Meclisi'nin kontrolünü ele geçirmektir. Sivil hükûmetin tüm meclisleri partinin mutlak çoğunluğu altına girdiğinde, diktatörlük ulusun ve sanayisinin üzerinde tartışmasız bir kontrol sahibi olacaktır."
 EST_corporate_chambers:0 "Şirket Odaları"
 EST_corporate_chambers_desc:0 "Solcular uzun zamandır korporatizm fikrine karşı çıktılar, ancak şimdi Riigikogu onların aralıksız seslerinden kurtulduğuna göre, nihayet Şirket Odalarını kurabiliriz. İşçiler ideolojiye göre değil, mesleğe göre bölünecek ve özel işverenler çıkarlarını diktatörlüğe temsil edecekler. Ne ters gidebilir ki?"
 EST_empower_finnish_militants:0 "Fin Militanları Güçlendir"
 EST_empower_finnish_militants_desc:0 "Vaps Hareketi, kuzeydeki Finli gazilerin yardımı olmadan mümkün olmazdı. Fin gönüllüler Estonya'nın bağımsızlığını kazanmasına yardım etti ve şimdi bu gaziler, bizim gibi, zayıf iradeli hükûmetlerini devirmek ve Finler için çalışan birini kurmak istiyorlar."
 EST_era_of_silence:0 "Sessizlik Dönemi"
 EST_era_of_silence_desc:0 "Şiddet yanlısı aşırı milliyetçi Vaps hareketinin Saaremaa'dan Võrumaa'ya yayılmasıyla birlikte, Devlet Başkanı Estonya için yeni bir dönem başlatmalıdır; seçimlerin, muhalefetin ve direnişin olmadığı bir dönem. Ulus bir sessizlik dönemine girmelidir."
 EST_establish_the_rahvuskogu:0 "Rahvuskogu'yu Kur"
 EST_establish_the_rahvuskogu_desc:0 "Eski Estonya Anayasası'nın halkını faşizm ve tiranlıktan koruyamadığı kanıtlandığından, ulusu güvence altına almak ve zamanla Estonya halkının 1918'de uğruna savaşıp öldüğü demokratik gelenekleri yeniden tesis etmek için yeni bir anayasa taslağı hazırlanmasına karar verilmiştir."
 EST_exploit_the_banks:0 "Bankaları Sömür"
 EST_exploit_the_banks_desc:0 "Konstantin Päts, Estonya bankacılık sektöründe uzun süredir nüfuzlu bir figürdür. Bazıları Päts'in bankaları yozlaştırmada ve Estonya'nın emekçi halkını sömürmede parmağı olduğu yönünde haince bir iddiada bulunsa da, Päts'in özel sektördeki bağlantıları diktatörlüğümüzü kendi sömürümüz için mükemmel bir konuma yerleştiriyor."
 EST_fight_against_communism:0 "Teslim Olmak Yok"
 EST_fight_against_communism_desc:0 "Düşman işgali altındaki hayatın nasıl bir şey olduğuna zaten tanık olduk ve birçok adamımız bir daha bunu görmek zorunda kalmamak için savaşırken öldü. Saflarımızda vatanseverlik yaygınken, ordularımız sessizce düşmeyecek."
 EST_fight_the_vaps:0 "Vaps'lerle Savaş"
 EST_fight_the_vaps_desc:0 "Sağcı Vapsid hareketi Estonya'nın istikrarını bozmaya çalışıyor. Hareket gaziler ve ulusal kahramanlardan oluşan bir grup olarak başlamış olsa da, hızla [EST.GetLeader]'in Nazilerle karşılaştıracağı aşırı milliyetçi bir harekete dönüştü. Estonya için istikrarlı bir gelecek yaratacaksak, ulusumuzdaki bu haydut unsurlar temizlenmelidir."
 EST_finno_estonian_supremacy_league:0 "Fin-Estonya Üstünlük Birliği"
 EST_finno_estonian_supremacy_league_desc:0 "Artık eski Fin hükûmeti geçmişte kaldığına göre, yeni Fin hükûmetinde kurduğumuz yakın iç içe geçmiş bağlantıları, özyönetim ve anti-Bolşevik duyguya dayalı kalıcı bir dostluğun temelini oluşturmak için kullanabiliriz."
 EST_forest_brothers:0 "Orman Kardeşleri"
 EST_forest_brothers_desc:0 "Baltık Devletleri'nin her yerinde, kışın ağaçlarda saklanan ve işgalci ordulara art arda baskınlar düzenleyen komünizm karşıtı militanların hikayelerini duyuyoruz. Bu özgürlük savaşçılarıyla iletişim kurmalı ve Baltık topraklarındaki çabalarını desteklemek için elimizden geleni yapmalıyız."
 EST_form_scandinavia:0 "Estonya İskandinavya'dır"
 EST_form_scandinavia_desc:0 "Kuzeydeki pek çok kişi Estonya'nın İskandinav kimliği iddiasını bir şakadan ibaret görüyor, ama şimdi alt kıtanın tamamı bizim kontrolümüz altındayken, gülecek kim kaldı? İsveç, Norveç ve Danimarka Estonya'nın çizmeleri altında sıkıca dururken, kimse bizi İskandinavya'yı talep etmekten alıkoyamaz!"
 EST_formalize_baltic_entente:0 "Baltık Antantı'nı Resmîleştir"
 EST_formalize_baltic_entente_desc:0 "Baltık Antantı, savaş zamanlarında birbirimizi korumak için kendimizle Baltık kardeşlerimiz arasında yapılan bir anlaşmadır, ancak bu anlaşmaya ne kadar sadık kalındığı en iyi ihtimalle şüphelidir. Almanlar ve Sovyetler toplu olarak ensemizde nefes alıp verirken ve İngilizler kıyılarımızdan çok uzaktayken, işbirliği kırılgan bağımsızlığımızı korumak için hiç bu kadar hayati olmamıştı."
 EST_fortify_tallinn:0 "Tallinn'i Tahkim Et"
 EST_fortify_tallinn_desc:0 "Birçoğu Estonya sınırının tamamını tutabileceğimize inanmak istese de, gerçekçi olarak hayatta kalacaksak bazı yerlerden vazgeçmemiz gerektiğini biliyoruz. Başkentin etrafındaki kaleler, bedeli ne olursa olsun altyapımızın çekirdeğini korumamızı sağlayacaktır."
 EST_fortify_the_border:0 "Sınırı Tahkim Et"
 EST_fortify_the_border_desc:0 "Düşmanlarımızla sınırda buluşacağız ve Letonya ve Litvanya'daki kardeşlerimizin düşmeyeceğine inanacağız. Bu plan ne kadar iddialı olursa olsun, tek bir karış toprağın bile bir daha asla Sovyet veya Alman işgaline maruz kalmasına izin vermemeliyiz."
 EST_glory_of_war:0 "Savaşın Zaferi"
 EST_glory_of_war_desc:0 "Biz bir gaziler hükûmetiyiz, ancak birçok Vapsid üyesi aktif hizmete geri dönemeyecek kadar yaşlı veya yaralanmalarından dolayı yıpranmış durumda. Belki de bu eski savaş köpekleri, yeni nesil Estonyalı askerleri savaşın yollarında eğitmek için yeni bir amaç bulabilirler."
 EST_hold_saaremaa:0 "Saaremaa'yı Tut"
 EST_hold_saaremaa_desc:0 "Uzun ve çetin bir direnişe hazır olmalıyız. Estonya takımadaları anakaranın sanayisinden yoksun olsa da, adaları son bir direniş için hazırlamak bize direniş savaşçılarını destekleyebileceğimiz ve zamanla yurdumuzu geri alabileceğimiz bir operasyon üssü sağlayacaktır."
 EST_ismaaliit:0 "Isamaaliit"
 EST_ismaaliit_desc:0 "Päts'in kendi partisi bile ülkedeki tüm siyasi makamlardan men edilmişken, diktatörlüğün etrafında örgütleneceği yeni bir partiye ihtiyacı var. Vatanseverler Birliği, ulusu Estonya'nın sınırları içindeki ve dışındaki tüm tehditlerden koruyacaktır."
 EST_join_the_allies:0 "Müttefiklere Katıl"
 EST_join_the_allies_desc:0 "Müttefikler, [ROOT.GetAdjective] bağımsızlığının bir dostu olduklarını kanıtladılar ve şimdi geriye kalan tek şey, [ROOT.GetNameDef]'in Müttefik ittifakına resmî girişiyle bu dostluğu resmîleştirmektir."
 EST_join_the_axis:0 "Mihver'e Katıl"
 EST_join_the_axis_desc:0 "Artık Almanlar niyetimizden emin olduğuna göre, Estonya'nın Mihver'e girişinin tamamen makul olması gerektiğinden eminiz."
 EST_long_push_east:0 "Uzun İlerleme"
 EST_long_push_east_desc:0 "Seferimizin bu kadar iyi gideceğini beklemiyorduk, ama işte buradayız; tüfekler elimizde ve düşmanımızın çekirdek topraklarına doğru ilerliyoruz. Onların toprakları geniş, bizimki küçük ve hazırlanmamız gereken çetin bir yolculuk olacak."
 EST_look_north:0 "Kuzeye Bak"
 EST_look_north_desc:0 "Tek başına Baltık Devletleri'nin sınırımızdaki Nazilerin ve Sovyetlerin belasına direnmek için yeterli olmayabileceğinin farkındayız, ancak saldırganlarımızın İskandinavya hırsları göz önüne alındığında, belki de kuzeyli müttefiklerimizi Baltık Antantı'na katılmaya ikna edebiliriz."
 EST_march_on_talinn:0 "Tallinn Yürüyüşü"
 EST_march_on_talinn_desc:0 "Estonya'daki pek çok gazi derneği ve paramiliter grup zaten bizim yanımızda olduğundan, Tallinn'e indiğimizde Konstantin Päts'in bize direnemeyeceğinden eminiz. Riigikogu'ya yürüyeceğiz ve kesin bir dille Artur Sirk altında birleşmiş bir Vapsid hükûmeti ilan edeceğiz."
 EST_mobilize_the_vets:0 "Gazileri Seferber Et"
 EST_mobilize_the_vets_desc:0 "Birçok Estonyalı gaziye, Vaps hareketiyle olan ilişkileri nedeniyle aktif hizmete kaydolma hakkı reddedildi. Şimdi hükûmeti ele geçirdiğimize göre, bu adamlara hizmet etme hakkını verebiliriz."
 EST_modernize_capital:0 "Tallinn'i Modernleştir"
 EST_modernize_capital_desc:0 "Büyük Tallinn şehri çok uzun zamandır Alman ve Rus baskıcılarının sefil pençelerinde tutuldu ve henüz Baltık'ın gıpta edilen potansiyeline ulaşamadı. Büyük şehrimiz asla yabancı ordular tarafından yakılmadı ve kirletilmedi ve Avrupa'nın diğer şehirleriyle rekabet edebilmek için modernleştirilmelidir."
 EST_national_council:0 "Ulusal Konseyi Güvence Altına Al"
 EST_national_council_desc:0 "Ulusal Konsey, hükûmetimizin yerel belediyeleri, şehirleri ve şirket odalarını temsil eden koludur. Bu insanların çıkarlarını düzgün bir şekilde temsil edeceksek, temsilcilerinin yalnızca sadık Isamaaliit partisi üyeleri ve askerî personel olmasını sağlamalıyız; çünkü yalnızca onlar Estonya halkının egemenliğini savunma yeteneğine sahiptir."
 EST_national_pride_in_finland:0 "Finlandiya'da Ulusal Gurur Yürüyüşleri"
 EST_national_pride_in_finland_desc:0 "Fin gaziler bizim sahip olduğumuz organizasyondan yoksunlar, bu yüzden belki de onlara sadece pasif desteğimiz Estonya'da gördüğümüz değişimi getirmek için yeterli değil. Finlandiya'da yürüyüşler düzenleyerek, bir gün iki ulusumuzu son savaşın kahramanları altında birleşmiş görebiliriz."
 EST_new_economic_policy:0 "Ekonomi Politikasını Gözden Geçir"
 EST_new_economic_policy_desc:0 "Ekonomimiz neredeyse tamamen SSCB ile ticarete bağımlı. Ruslar, Estonya'nın kendi kaderini tayin etmesinin açık düşmanlarıdır ve onlara herhangi bir şey için bağımlı olduğumuz sürece gerçekten özgür değiliz. Daha gerçekten bağımsız bir ekonomi için kendimizi zalimlerimizden ayırmalıyız."
 EST_occupy_norway:0 "Norveç'i İşgal Et"
 EST_occupy_norway_desc:0 "İsveç ve Finlandiya cebimizdeyken, tek yapmamız gereken Norveçlileri boyunduruk altına almak ve İskandinavya anakarasının tamamı Estonya kontrolüne girecek."
 EST_pan_baltic_bank:0 "Pan-Baltık Bankası"
 EST_pan_baltic_bank_desc:0 "Ekonomik birlik artık yürürlükte olduğuna göre, pan-Baltık bir banka ve ortak bir para birimi kurma olasılığımız var."
 EST_prepare_covert_resistance:0 "Gizli Bir Direniş Hazırla"
 EST_prepare_covert_resistance_desc:0 "Direniş, adam ve tüfekten daha fazlasıdır; ikmal hatlarını sabote etmek, direnişle temas kurmak ve mermilerimiz hedeflerini bulurken düşmanlarımızı dağınık ve şaşkın hale getirmektir. Vatanı geri alacaksak [Root.GetAdjective] istihbaratına yatırım yapmalıyız."
 EST_prepare_for_the_inevitable:0 "Kaçınılmaz Olana Hazırlan"
 EST_prepare_for_the_inevitable_desc:0 "Sonsuza kadar dayanamayız; hükûmetimizi sürgüne gitmeye ve [Root.GetAdjective] direniş çabalarını uzaktan desteklemeye hazırlamamız çok önemlidir."
 EST_prepare_underground_resistance:0 "Endüstriyel Bir Direniş Hazırla"
 EST_prepare_underground_resistance_desc:0 "[Root.GetNonIdeologyName] genelindeki büyük fabrikalar kapanıyor ve düşman tarafından ele geçiriliyor, bu nedenle direnişimiz için silah üretmeye devam edebilmemiz için yurtdışından endüstriyel yatırımlar ve ekipman aramak hayati önem taşıyor; gizlice savaşmak zorunda kalsak bile."
 EST_proclaim_finno_ugra:0 "Fin-Ugor Ülküsünü İlan Et"
 EST_proclaim_finno_ugra_desc:0 "Finlandiya artık kontrolümüz altında olduğuna göre, devletimiz içinde Fin kimliğini pekiştirmek için eşsiz bir konumdayız. Kuzey Avrupa'da sayısız Fin-Ugor halkı var ve bu kimliği birleştirerek, Vapsid davası için savaşacak sayısız yeni askeri yanımıza çekebiliriz."
 EST_propose_baltic_union:0 "Bir Baltık Birliği Öner"
 EST_propose_baltic_union_desc:0 "Uluslarımız arasında artık tüm bu farklı varlıklar iç içe geçmişken, resmî bir Baltık Birliği'nin kurulması kaçınılmaz görünüyor. Birlik, tüm üye uluslara birlik içinde oy ve veto hakkı tanıyacak ve uluslarımızı daha da yakınlaştıracaktır."
 EST_rally_the_nation:0 "Ulusu Topla"
 EST_rally_the_nation_desc:0 "Vaps Hareketi, Estonya bağımsızlık savaşından gazilerin oluşturduğu bir harekettir ve Konstantin Päts rejimi altında haksız yere bastırıldık. Estonyalılar için çalışan bir Estonya yaratacaksak, kendimizi dünyaya duyurmalıyız. Ulus boyunca yürümeliyiz ve herkese bilmelerini sağlamalıyız, biz buradayız. Biz Estonya'nın varlığı için savaşan adamlarız ve duyulmayı hak ediyoruz."
 EST_reach_out_to_germany:0 "Almanya ile Temas Kur"
 EST_reach_out_to_germany_desc:0 "Sovyetlerle sadece ruh ve şevkle savaşabilseydik, SSCB yarın dağılırdı, ancak ne yazık ki Estonya bu kadar ezici bir tehdide karşı kendini savunacak insan gücünden yoksun. Belki de Almanlarla aynı safta yer alarak önümüzdeki on yıla kadar hayatta kalabiliriz."
 EST_republican_defence_league:0 "Cumhuriyetçi Savunma Birliği"
 EST_republican_defence_league_desc:0 "Vaps'lerin önemi azaldıkça, birçok paramiliter grup artık kayboldu ve uğruna savaşacak bir davaları kalmadı. Bu paramiliterleri tek bir resmî Estonya grubunda birleştirmeye çalışarak, Estonya bağımsızlığı için savaşmaya ve ölmeye hazır cesur adamlardan oluşan yeni bir kaynak yaratmış olacağız."
 EST_secure_the_straits:0 "Boğazları Güvence Altına Al"
 EST_secure_the_straits_desc:0 "Danimarka, Atlantik'e geçişimizi engelliyor ve Estonya gemilerinin Kuzey Denizi'nde tur atması için ortadan kaldırılmalıdır."
 EST_sieze_swedish_assets:0 "İsveç Varlıklarına El Koy"
 EST_sieze_swedish_assets_desc:0 "İsveçliler, kendilerine en korkutucu görünen güce tedarik etmekten başka bir şey yapmadan varlıklarının üzerinde oturuyorlar. İskandinav kaynaklarının bu israfı daha fazla devam edemez, Estonya'nın velayeti altına alınmalıdırlar."
 EST_squash_the_opposition:0 "Muhalefeti Ez"
 EST_squash_the_opposition_desc:0 "Sivil hükûmet üzerindeki kontrolümüz tamamlandığına göre, kabinemizdeki ve yerel yönetimlerdeki tüm kara ihanet tohumlarını temizlemeliyiz. Liderliğimize karşı çıkanlar, Isamaaliit'e karşı çıkmanın Estonya'ya karşı çıkmak olduğunu yakında öğreneceklerdir."
 EST_support_independent_militaries:0 "Bağımsız Orduları Destekle"
 EST_support_independent_militaries_desc:0 "Ulusun her yerinde, bağımsız askerî gruplar Estonya'yı yeniden yabancı emperyalizminden korumak için savaşa girmeye can atıyor, ancak bu orduların ruhen sahip oldukları kaynaklardan yoksunlar. İyi ulusumuzu savunmak için gereken kaynaklarla resmî olsun ya da olmasın tüm askerleri donatmalıyız."
 EST_the_brotherhood:0 "Kardeşlik"
 EST_the_brotherhood_desc:0 "Estonya bir boşlukta var olmuyor ve güneyimizde, Estonya devletine entegre olurlarsa hayatta kalma şansları muhtemelen daha iyi olacak iki çok savunmasız ulus yatıyor. Baltık Devletleri kardeştir ve kardeşler olarak birlikte durmalıyız."
 EST_threat_on_our_border:0 "Sınırımızdaki Tehdit"
 EST_threat_on_our_border_desc:0 "Ufukta savaş görünüyor. Ne için olduğunu bilmiyoruz ve kiminle savaşacağımızı bilmiyoruz, ama savaş şahininin pençelerinin [Root.Capital.GetName] için hazırlandığını ve yaklaşan mücadelede bağlılıklarımızın nerede olduğuna karar vermemiz gerektiğini biliyoruz. Güneydeki Nazilere veya Doğudaki Sovyetlere odaklanılarak planlar yapılmalıdır."
 EST_unite_karelia:0 "Karelya'yı Birleştir"
 EST_unite_karelia_desc:0 "Karelya, Fin halkıyla doludur; Karelyalıların kendisinden Doğu Sámi halkına kadar. Finlandiya kontrolümüz altındayken, devletimizi Karelya'ya genişletebilir ve oradaki Fin halkını birleştirebiliriz."
 EST_unite_our_nations:0 "Uluslarımızı Birleştir"
 EST_unite_our_nations_desc:0 "Finlandiya şimdi gazilerinin elinde ve nüfuzumuz yeni Fin hükûmetinin dokusuna sıkıca örülmüşken, tek yapmamız gereken birkaç ipi çekmek ve halkımızı tek bir ulus halinde birleştirebileceğiz."
 EST_unite_the_finnic_identity:0 "Fin Kimliğini Birleştir"
 EST_unite_the_finnic_identity_desc:0 "İskandinav alt kıtasındaki tüm büyük Finlerin kontrolümüz altında olmasıyla, Fin kimliğini birleştirebilir ve Estonyalıların, Finlerin, Samilerin, Nenetlerin ve diğer tüm Fin-Ugor halklarının evi diyebileceği yeni bir devlet ilan edebiliriz."
 EST_unite_the_sami:0 "Sámi'leri Birleştir"
 EST_unite_the_sami_desc:0 "Sámi'ler, Finlandiya, İsveç, Norveç ve Rusya'da var olan dağınık ve yaygın olarak ezilen bir halktır. Çok uzun zamandır, Sámi halkının Fin dillerini konuşma hakkı reddedildi ve zalimlerine karşı savaşmak için gereken insan gücünden yoksunlar. Onları İskandinav emperyalizminden korumak için Sámi'leri devletimiz içinde birleştirmeliyiz."
 EST_vapsid_youth:0 "Vapsid Gençliği"
 EST_vapsid_youth_desc:0 "Vaps'ların çoğunluğu en parlak dönemlerini çoktan geride bıraktı, ancak gençler birkaç on yıl önce Estonya'yı karakterize eden tarihi bağımsızlık mücadelesine tamamen hayran kalmış durumdalar. Bir Vapsid Gençliği kurarak, bu hevesli genç adamlara babalarının ve büyükbabalarının zaferini yeniden yakalamayı umabilecekleri bir yer vereceğiz."
 EST_veterans_government:0 "Gaziler Hükûmeti"
 EST_veterans_government_desc:0 "Önceki bakanlar kurulu zayıf iradeliydi ve Konstantin Päts'in iradelerine boyun eğdi. Vapsid davasına sempati duyan yeni bir bakanlar kuruluna ihtiyacımız var."
 EST_womens_defence_league:0 "Kadın Savunma Birliği"
 EST_womens_defence_league_desc:0 "Naiskodukaitse, evlerini ve ailelerini savunmak için üzerlerine düşeni yapmaya istekli vatansever kadınlar için Cumhuriyetçi Savunma Birliği'nin bir alt örgütüdür. Vatanımızı bir garnizonla ve birliklerimizi sağlık personeliyle donatmak için Kadın Savunma Birliği'nin uygun şekilde donatılması ve yatırım yapılması hayati önem taşımaktadır."
 EST_you_can_ban_fascism_tt:0 "§YFaşizmi Yasakla§! kararını uygulayarak, §Y[EST.GetNameWithFlag]§! artık ulusumuzda faşizmi destekleyemeyecek."
 FOURTH_INTERNATIONAL_FACTION:0 "4. Enternasyonal"
 FROM_gets_belarus_tt:0 "Sahip olduğumuz ve §Y[BLR.GetNameWithFlag]§!'in çekirdeği olan tüm eyaletlerin mülkiyeti §Y[FROM.GetNameWithFlag]§!'e devredilecek."
 GER_soviet_treaty_research_nsb_tt:0 "\n\n§YTemel Orta Tank Şasisi§! araştırmasını tamamlamak, bu anlaşmadan yararlanmamızı ve iki yeni tank tasarımını kullanmamızı sağlayacaktır:\n"
 GER_wont_ally_tt:0 "§Y[GER.GetNameWithFlag]§!, §Y[Root.GetNameWithFlag]§!'in kendi ittifakına katılmasına daha az izin verecektir."
 HUN_crowned_habsburg_tt:0 "§Y[HUN.GetNameWithFlag]§!, §YOtto von Habsburg§!'u taçlandırdı."
 LAT_aizsargi:0 "Aizsargi'yi Fonla"
 LAT_aizsargi_desc:0 "1919'da geçici hükûmet tarafından oluşturulan Aizsargi, hükûmetin resmî paramiliter örgütüdür ve Ulmanis'in darbesine verdikleri destek, destekle bolca ödüllendirilmelidir."
 LAT_alignment_with_germany:0 "Almanya ile Uyum Arayışı"
 LAT_alignment_with_germany_desc:0 "Almanlar, solcu ve zayıf olan her şeye karşı bizimle aynı küçümsemeyi paylaşıyor. Geçmişte Letonya'yı boyunduruk altına almak için yanlış yönlendirilmiş girişimlerde bulunmuş olsalar da, hükûmetlerimiz uyumlu olursa böyle bir şeyi tekrar yapmayacaklarından eminiz."
 LAT_anti_german_propaganda:0 "Alman Karşıtı Propaganda"
 LAT_anti_german_propaganda_desc:0 "Ulusumuzun faşizm ideallerini benimsese de, [GER.GetLeader]'in oyuncaklarından biri olmadığımızı ve halkımızı yüzyıllardır ezen aynı adamlarla işbirliği yapma niyetinde olmadığımızı açıkça belirtmeliyiz."
 LAT_appease_democrats:0 "Demokratları Yatıştır"
 LAT_appease_democrats_desc:0 "Yöntemlerimiz demokratik olmasa da, motivasyonumuz cumhuriyet içindir. Demokratik muhalefete sadece Letonya için en iyisini düşündüğümüzü göstermeliyiz ve belki de Saeima'yı yeniden toplamak onları gerçek niyetlerimizden haberdar edebilir."
 LAT_avenge_the_ancestors:0 "Ataların İntikamını Al"
 LAT_avenge_the_ancestors_desc:0 "Letonya, Baltık kabileleri zamanından beri bağımsızlık ışığını görmedi ve hepsi Almanlar, İsveçliler ve Ruslar tarafından sonsuz boyun eğdirilmesinden kaynaklanıyor. Bir bin yıl daha vahşet ve baskı riske atamayız, tüm bu yabancı emperyalistleri Letonya'nın önünde diz çöktürmeliyiz!"
 LAT_baltic_defence_army:0 "Baltık Savunma Ordusu"
 LAT_baltic_defence_army_desc:0 "Silahlı kuvvetlerimiz birlikte çalışıyor ancak esasen ayrı varlıklar. Uluslarımız arasındaki bağlar güçlendikçe, aynı anda hiçbir Baltık Devleti tarafından kontrol edilmeyen ancak hepsinin bir müttefiki olan ayrı bir varlık olan Birleşik Baltık Silahlı Kuvvetleri'ni kurabiliriz."
 LAT_baltic_economic_union:0 "Baltık Ekonomik Birliği"
 LAT_baltic_economic_union_desc:0 "Şimdi liberal demokrasi ulusumuza geri döndüğüne ve komşularımızla yakın diplomatik bağlar kurduğumuza göre, diğer Baltık Devletleriyle bir ekonomik birliğe girmek mantıklı. Ekonomilerimiz küçük olsa da, birlikte güçlenebilirler!"
 LAT_baltic_stronger_together:0 "Birleşik ama Ayrı"
 LAT_baltic_stronger_together_desc:0 "Baltık Devletleri arasında uzun zamandır bir kardeşlik ve yoldaşlık duygusu var, ama her zaman sınırlar ve siyasetle ayrıldık. Bağımsızlığımızı koruma isteğimizle diplomatik olarak birbirimize bağlıyız ve bu yüzden dostlarımız için savaşmaya ve birleşik Baltık silahlı kuvvetlerini genişletmeye kararlı olmalıyız!"
 LAT_baltic_unification:0 "Baltık Birleşmesi"
 LAT_baltic_unification_desc:0 "Baltık Devletleri arasında uzun zamandır bir kardeşlik ve yoldaşlık duygusu var, ama her zaman sınırlar ve siyasetle ayrıldık. Bağımsız kimliklerimiz güçlü olsa da, varlığımızı korumak için savaşma isteğimiz bizi birbirimize bağlıyor. Belki de Baltık Birliği'nin kendi başına bir ulusa dönüşme zamanı gelmiştir."
 LAT_banish_clemens:0 "Celmiņš'i Sürgün Et"
 LAT_banish_clemens_desc:0 "Gustavs Celmiņš, diktatörlüğün istikrarını ve büyük ulusumuzdaki Letonyalı azınlıkların güvenliğini tehdit eden tehlikeli bir faşisttir. Pērkonkrusts'u ulusumuza daha fazla zarar vermeden ülkeden kovulmalıdır."
 LAT_beyond_the_baltic:0 "[Root.Get_Beyond_Baltic_Focus_Loc]"
 LAT_beyond_the_baltic_desc:0 "[Root.Get_Beyond_Baltic_Focus_desc_Loc]"
 LAT_cave_to_enemy_pressure:0 "[Root.Get_Enemy_Pressure_Focus_Loc]"
 LAT_cave_to_enemy_pressure_desc:0 "[Root.Get_Enemy_Pressure_Focus_desc_Loc]"
 LAT_consecrate_the_brotherhood:0 "Kardeşliği Kutsallaştır"
 LAT_consecrate_the_brotherhood_custom_tt:0 "\"§Y[LAT.GetNameDef]§! bizi kendi gruplarına davet eder\" etkinliğini alır."
 LAT_consecrate_the_brotherhood_desc:0 "Birçok yönden farklı olsalar da, Baltıklar yine de kardeştir. Kültürlerimiz farklıdır, ancak yüzyıllardır aynı düşmanları ve aynı sorunları paylaştık. Boyun eğmeyi önleyeceksek, Kardeşliği birleşik bir koalisyon halinde bir araya getirmeliyiz."
 LAT_dievs_keepers:0 "Diev'in Muhafızları"
 LAT_dievs_keepers_desc:0 "İyi Letonyalı paganlar, Celmiņš'i bir tür dinî lider olarak görerek davamız etrafında giderek daha militan hale gelmeye başlıyor. Yönetimimizdeki daha muhafazakar Katolikler, Baltık paganizmine olan bu hayranlığın Celmiņš'in karizmatik lideri olduğu bir tarikata dönüşmesinden korkuyorlar, ancak bu hevesli genç adamlara bir tüfek vermekten fayda sağlayacağımız kesin."
 LAT_empower_paramilitarists:0 "Paramiliterleri Güçlendir"
 LAT_empower_paramilitarists_desc:0 "Letonya ordusu yararlıdır ve elbette herhangi bir uç paramiliter gruptan daha büyüktür, ancak ödül veya tanınma vaadi olmadan Letonya için hayatlarını riske atacak bu bireyleri görmezden gelmeye devam edemeyiz."
 LAT_establish_chambers_of_professions:0 "Meslek Odalarını Kur"
 LAT_establish_chambers_of_professions_desc:0 "Saeima, insanları bölgesel eksende bölerdi, ancak insanların bölünebileceği tek yolun bu olmadığını biliyoruz. Meslek Odalarını kurarak, insanlar yerelliklerine göre değil, mesleklerine göre temsil edilecek."
 LAT_fanatic_recruitment:0 "Fanatikleri İşe Al"
 LAT_fanatic_recruitment_desc:0 "Geçmişte, silahlı kuvvetlerimize radikalleri almaya tereddüt ederdik çünkü güdüleri Letonya'dan çok ideolojilerine aitti, ama Celmiņš ve takipçileri şüphesiz Letonya'yı ve bağımsızlığını herkes kadar korumak istiyorlar."
 LAT_formalize_baltic_entente:0 "[Root.Get_Baltic_Entente_Focus_Loc]"
 LAT_formalize_baltic_entente_desc:0 "[Root.Get_Baltic_Entente_Focus_desc_Loc]"
 LAT_free_the_ugonskrusts:0 "Ugunskrusts'u Özgürleştir"
 LAT_free_the_ugonskrusts_desc:0 "Pērkonkrusts olmadan önce, önceki Letonya rejimi tarafından ezilen ve boyunduruk altına alınan Ugunskrusts idik. Şimdi özgür olduğumuza göre, sadece daha güçlü bir Letonya devleti isteyen sayısız siyasi mahkumu özgür bırakabiliriz."
 LAT_free_the_ugonskrusts_tt:0 "Eyalette 6 §YMilis§! Tümeni belirir."
 LAT_improve_military_life:0 "Askerî Yaşamı İyileştir"
 LAT_improve_military_life_desc:0 "Eğer adamların Letonya için savaşmasını ve ölmesini istiyorsak, onlara savaşmaya ve ölmeye değer bir yaşam tarzı vermeliyiz. Bu, daha iyi erzaklarla ve savaş kazanıldığında iyi bir yaşam vaadiyle başarılabilir."
 LAT_integrate_farmers_party:0 "Çiftçi Partisini Entegre Et"
 LAT_integrate_farmers_party_desc:0 "Bu demokratik maskaralık yeterince uzun sürdü. Çiftçi Partisi'ni Diktatörlüğe entegre etme ve diğer tüm partileri hükûmetten çıkarma zamanı geldi."
 LAT_join_the_allies:0 "[Root.Get_Join_Allies_Focus_Loc]"
 LAT_join_the_allies_desc:0 "[Root.Get_Join_Allies_Focus_desc_Loc]"
 LAT_latvia_for_latvians:0 "Letonya Letonyalılarındır"
 LAT_latvia_for_latvians_desc:0 "Ulusumuz Almanları veya Rusları yatıştırmak için var değil, ulusumuz Letonyalılar ve sadece Letonyalılar için var. Bazıları Pērkonkrusts'u aşırı milliyetçi olarak görse de, Letonya'nın hayatta kalmasını güvence altına alacaksak onlarla çalışmamız gerektiğini biliyoruz."
 LAT_lift_ban_on_perkonkrusts:0 "Pērkonkrusts Yasağını Kaldır"
 LAT_lift_ban_on_perkonkrusts_desc:0 "Resmî olarak, Pērkonkrusts grubu yasa dışıdır, ancak sayıları her geçen gün artmaktadır. Grup üzerindeki yasağı kaldırarak, diktatörlüğün onların ideallerine dostane olduğunu göstereceğiz."
 LAT_lightning_strike:0 "Yıldırım Düşüyor"
 LAT_lightning_strike_desc:0 "Komşularımız zayıf ve kolayca sömürülebilir. Litvanya ve Estonya'yı Letonya'nın velayetine almak, elbette kendi korumaları için akıllıca olacaktır."
 LAT_look_north:0 "[Root.Get_Look_North_Focus_Loc]"
 LAT_look_north_desc:0 "[Root.Get_Look_North_Focus_desc_Loc]"
 LAT_martial_prime_minister:0 "Asker Kökenli Bir Başbakan"
 LAT_martial_prime_minister_desc:0 "Kviesis barış zamanlarında yararlıydı, ama şimdi ufukta savaş var ve halkı yönetmek için bir asker adama ihtiyacımız var. Jānis Balodis bu rol için ideal bir aday olurdu."
 LAT_merge_presidential_titles:0 "Cumhurbaşkanlığı Unvanlarını Birleştir"
 LAT_merge_presidential_titles_desc:0 "Balodis hükûmette tehlikeli bir şekilde nüfuzlu hale geliyor ve belki de eş hükümdarlık zamanı sona erdi. Letonya devletini güvence altına almanın yolunu sadece Ulmanis biliyor."
 LAT_military_diarchy:0 "Askerî Diarşi"
 LAT_military_diarchy_desc:0 "Balodis'in hükûmetteki nüfuzu o kadar büyüdü ki, birçok kişi diktatörlüğün aslında ordu ve Ulmanis'in bir diarşisi olduğuna inanıyor. Bu yanlış kanıyı gerçekleştirmek ve Balodis'e hükûmet üzerinde daha fazla kontrol vermek akıllıca olacaktır."
 LAT_military_dictatorship:0 "Askerî Diktatörlük"
 LAT_military_dictatorship_desc:0 "Ulmanis yararlı ve popüler bir figürandır, bu inkar edilemez, ama belki de bu artan çatışma zamanlarında sadece bu olması en iyisi olurdu; bir figüran. Yönetim sadece orduya bırakılmalıdır."
 LAT_military_industrial_complex:0 "Letonya Askerî Kompleksi"
 LAT_military_industrial_complex_desc:0 "Pērkonkrusts'u ihtiyaç duydukları her şeyle donatmak için, Letonya bir devletten çok bir silah fabrikası haline gelmelidir."
 LAT_multicultural_latvia:0 "Çok Kültürlü Bir Letonya"
 LAT_multicultural_latvia_desc:0 "Ulusumuz sayısız grup ve bireyden oluşuyor; Letonyalılar, Baltık Almanları, Yahudiler ve sayısız diğerleri. Tüm bu gruplara uğruna savaşmaya değer bir yuva vermeli ve çeşitli kültürel manzaramızın korunmasını sağlamalıyız."
 LAT_nationalised_industry:0 "Kamulaştırılmış Sanayi"
 LAT_nationalised_industry_desc:0 "Kapitalist ekonomilerin zamanı geçti, bunlar savaş zamanları ve hükûmetin ekonomi üzerinde sıkı bir kontrole sahip olmasını sağlamalıyız."
 LAT_ostland:0 "Ostland"
 LAT_ostland_desc:0 "Almanların Baltıkların ve Doğu Polonya'nın bazı bölgelerinin tek bir birleşik devleti için bir tasarımı var. Ostland vizyonları hiyerarşinin en tepesine Baltık Almanlarını yerleştirse de, bu plandan yararlanıp Letonya tasarımında bir Ostland yaratmamamız için hiçbir neden yok."
 LAT_pan_baltic_bank:0 "Pan-Baltık Bankası"
 LAT_pan_baltic_bank_desc:0 "Ekonomik birlik artık yürürlükte olduğuna göre, pan-Baltık bir banka ve ortak bir para birimi kurma olasılığımız var."
 LAT_perkonkrust_war_tt:0 "§YPērkonkrusts§! popülaritesi bir §Riç savaştan§! kaçınmak için §Y%55§!'in altında tutulmalıdır!!"
 LAT_prepare_covert_resistance:0 "[Root.Get_Covert_Resistance_Focus_Loc]"
 LAT_prepare_covert_resistance_desc:0 "[Root.Get_Covert_Resistance_Focus_desc_Loc]"
 LAT_prepare_underground_resistance:0 "[Root.Get_Underground_Resistance_Focus_Loc]"
 LAT_prepare_underground_resistance_desc:0 "[Root.Get_Underground_Resistance_Focus_desc_Loc]"
 LAT_propose_baltic_union:0 "Bir Baltık Birliği Öner"
 LAT_propose_baltic_union_desc:0 "Uluslarımız arasında artık tüm bu farklı varlıklar iç içe geçmişken, resmî bir Baltık Birliği'nin kurulması kaçınılmaz görünüyor. Birlik, tüm üye uluslara birlik içinde oy ve veto hakkı tanıyacak ve uluslarımızı daha da yakınlaştıracaktır."
 LAT_ready_the_resistance:0 "[Root.Get_Ready_Resistance_Focus_Loc]"
 LAT_ready_the_resistance_desc:0 "[Root.Get_Ready_Resistance_Focus_desc_Loc]"
 LAT_renew_kviesis_term:0 "Kviesis'in Görev Süresini Yenile"
 LAT_renew_kviesis_term_desc:0 "Alberts Kviesis şimdiye kadar yetkin bir Başbakan olduğunu kanıtladı ve eski demokratik hükûmetin bir kalıntısı olmasına rağmen, kendi kabinesinden herhangi biri kadar Ulmanis'e itaatkâr ve sadıktır. Demokratlar muhtemelen görev süresini yenilediğimizi görmekten memnun olacaklardır."
 LAT_renew_the_constitution:0 "Letonya Anayasasını Yenile"
 LAT_renew_the_constitution_desc:0 "Kārlis Ulmanis, Letonya'ya yaklaşan faşizm ve komünizm fırtınasına dayanabilecek güçlü bir hükûmet getirdi, ancak şimdi sivil hükûmet Çiftçi Partisi üyeleriyle dolduğuna göre, halk seçimlerini yeniden açmamak için çok az neden var."
 LAT_reorganize_forest_brothers:0 "Orman Kardeşlerini Yeniden Düzenle"
 LAT_reorganize_forest_brothers_desc:0 "Orman Kardeşleri, Letonya kimliğinin ve kendi kaderini tayin hakkımızın savunucularıdır, ancak onları rahatsız eden şey, aynı zamanda Litvanyalıların ve Estonyalıların bağımsızlığını savunma tutkularıdır. Bu devam edemez, Letonya Orman Kardeşleri kendilerini Letonya'yı, Celmiņš'i ve Pērkonkrusts Partisi'ni savunmaya adamalıdır!"
 LAT_restore_saeima:0 "Saeima'yı Geri Getir"
 LAT_restore_saeima_desc:0 "Saeima, Letonya'daki yerel temsilciler meclisidir ve artık hükûmetimizi yönetmese de, Saeima'yı diktatörlüğe daha çok danışmanlık rolünde yeniden açabiliriz; halka demokrasi yanılsaması vererek."
 LAT_state_paganism:0 "Devlet Paganizmi"
 LAT_state_paganism_desc:0 "Ordudaki “Dievturība”nın nüfuzu, diğer tüm dinî inançları neredeyse tamamen gölgede bıraktı. Celmiņš'in etrafında, Eski Tanrılar için savaşmaya ve ölmeye hazır olduklarını iddia eden fanatikler var, ancak gerçekte fanatizmlerinin konusu Celmiņš'tir. Dievturība'yı resmî devlet dini olarak kurarak, Pērkonkrusts'un ideolojisini ülke genelindeki kiliselerde ve tapınaklarda yaymaya başlayabiliriz."
 LAT_supply_forest_brothers:0 "[Root.Get_Forest_Focus_Loc]"
 LAT_supply_forest_brothers_desc:0 "[Root.Get_Forest_Focus_desc_Loc]"
 LAT_support_baltic_fascists:0 "Baltık Faşistlerini Destekle"
 LAT_support_baltic_fascists_desc:0 "Baltıklar kardeştir ve kardeşler yakın kalmalıdır. Üçümüz de yabancı saldırganlığın hedefiyiz ve Baltık halkını yöneten zayıf iradeli hükûmetlere sahip olmayı göze alamayız. Litvanya, Estonya ve Polonya'daki aşırı sağ hareketleri destekleyerek, birleşik ve dünyaya karşı savaşmaya hazır bir Baltık bloğu oluşturma şansımız var."
 LAT_suspend_the_constitution:0 "Letonya Anayasasını Askıya Al"
 LAT_suspend_the_constitution_desc:0 "Letonya Anayasası, demokratik haklarımızı yasayla güvence altına almak için 1922'de imzalandı. Ancak, ufukta savaş varken, anayasanın kullanışlılığını yitirdiği ve bu krizden sağ çıkacaksak askıya alınması gerektiği açıktır."
 LAT_the_old_ways:0 "Eski Yollar"
 LAT_the_old_ways_desc:0 "Pērkonkrusts, İsa'ya ve öğretilerine bağlılık yemini etmez, bunun yerine çok daha eski başka tanrılara yemin eder. Muhafazakarlar, Celmiņš'in antik tanrılara olan hayranlığını ürkütücü ve doğal olmayan olarak adlandırırlardı, ancak Pērkonkrusts daha gerçek bir Letonya için savaşıyor; yabancı Tanrıların nüfuzundan arınmış."
 LAT_the_sun_shines_equally:0 "Güneş Eşit Parlar"
 LAT_the_sun_shines_equally_desc:0 "Letonya'nın güneşi herkesin üzerinde eşit parlar, bu diktatörlüğün ilkesidir. Yıllardır Letonya'nın sosyal sınıfları kültürel ve etnik temellere göre bölünmüştür ancak bunun devam etmesine izin verilemez; tüm insanlar için eşit fırsatlar için çabalamalıyız ve ideallerimize karşı çıkan paramiliterleri destekleyemeyiz."
 LAT_the_thunder_strikes_alone:0 "Yıldırım Yalnız Kükrer"
 LAT_the_thunder_strikes_alone_desc:0 "Yabancılardan yardıma ihtiyacımız yok. Letonya bağımsızlığını savunma yeteneğinden fazlasına sahip, ancak yalnızca Pērkonkrusts'un rehberliğinde."
 LAT_threat_on_our_border:0 "[Root.Get_Threat_Border_Focus_Loc]"
 LAT_threat_on_our_border_desc:0 "[Root.Get_Threat_Border_Focus_desc_Loc]"
 LAT_united_baltic_empire:0 "Birleşik bir Baltık İmparatorluğu"
 LAT_united_baltic_empire_desc:0 "Tek bir birleşik Baltık devleti fikri biraz tuhaf bir kavram olsa da, kardeşliğimizin sadece sınırların ötesine uzandığı inkar edilemez. Litvanya ve Estonya kontrolümüz altındayken, sadece yönetimlerini bizimkiyle entegre etmemiz gerekiyor ve Baltık hegemonyası hırsımız gerçeğe dönüşecek."
 LAT_what_is_capitalism:0 "Devlet Kapitalizmi"
 LAT_what_is_capitalism_desc:0 "Meslek Odaları sağlam bir şekilde kurulduğuna göre, ekonominin doğrudan kontrolünü ele almamızın zamanı geldi. Ekonomimiz doğası gereği kapitalist kalsa da, diktatörlüğün kilit endüstrilerin kontrolünü ele almasının zamanı geldi."
 LAT_what_is_socialism:0 "Letonya Sosyalizmi"
 LAT_what_is_socialism_desc:0 "Letonya Sosyal Demokrat partisi şu anda Saeima'da açık ara en popüler parti ve Fricis Menders'in takipçileri çok ve sesli. Belki de onun bazı reformlarını uygulayarak Letonyalı işçilere daha iyi ve daha üretken çalışma ortamları sağlanabilir."
 LAT_womens_aizsargi:0 "Kadın Aizsargi'yi Genişlet"
 LAT_womens_aizsargi_desc:0 "Daha alt seviye uluslar kadınların askerlik hizmetini yasaklardı, ama Letonya'da, bir tüfek tutmaya istekli ve muktedir olan herkes hizmetimizde hoş karşılanır."
 LAT_wrath_of_the_old_gods:0 "Eski Tanrıların Gazabı"
 LAT_wrath_of_the_old_gods_desc:0 "Yabancı din tarafından lekelenen tek yer Baltık değil. Dünyanın çoğu İsa'nın öğretilerini takip ediyor ve bu değişmeli. Kendi haçlı seferimizi ilan etmeliyiz; Hristiyanlığa karşı bir haçlı seferi!"
 LIT_POL_union:0 "Milletler Topluluğu'nu Geri Getir"
 LIT_POL_union_desc:0 "[Root.GetLeader]'in hem Polonya hem de Litvanya Kralı olmasıyla, geriye kalan tek şey Seimas'ı Sejm ile bir kez daha birleştirmek ve Polonya-Litvanya Milletler Topluluğu yeniden doğmuş olacak."
 LIT_a_corporatist_economy:0 "Korporatist Bir Ekonomi"
 LIT_a_corporatist_economy_desc:0 "Batı, Litvanya devleti içinde hızlı bir ekonomik liberalizm bekliyor. Ancak Antanas Smetona, korporatist bir modelin getirdiği kontrol ve merkezileşmeyi çok daha fazla tercih ediyor."
 LIT_a_king_for_our_people:0 "Halkımız İçin Bir Kral"
 LIT_a_king_for_our_people_desc:0 "Antanas Smetona tek başına Litvanya'yı yönetemez ve birçok kişi Cumhurbaşkanının bir Başbakan atamasını beklerken, başka bir seçenek daha var. Karl Gero von Urach, Mindaugas II'nin meşru oğludur ve artık Litvanya'nın başı üzerinde Alman yönetimi kefeni olmadığına göre, Kralımızı taçlandırmamızı engelleyen hiçbir şey yoktur."
 LIT_a_martial_prime_minister:0 "Asker Kökenli Bir Başbakan"
 LIT_a_martial_prime_minister_desc:0 "Başbakanlık makamı genellikle seçilmiş bir siyasi yetkili tarafından doldurulur, ancak bu savaş zamanlarında ve Cumhurbaşkanının artan yetkileriyle, [ROOT.GetLeader]'in sağ kolu olacak güçlü bir lider seçmeliyiz!"
 LIT_a_new_noble_class:0 "Yeni Bir Soylu Sınıfı"
 LIT_a_new_noble_class_desc:0 "Ulusumuz çok uzun zamandır politikacılar ve oligarklar tarafından yönetildi. Kralın Litvanya'ya hizmet edebilmesi için, başkanlık edeceği sadık bir soyluluk mahkemesine sahip olması gerekir."
 LIT_a_priestly_prime_minister:0 "Rahip Kökenli Bir Başbakan"
 LIT_a_priestly_prime_minister_desc:0 "Eski konsey üyesi ve şimdi bir rahip olan Vladas Mironas, Ulusal Parti'yi Başbakanı olarak temsil etmek için ideal bir adaydır. Katolik kilisesindeki konumu ve köylülüğe ve tarıma olan bağlılığı, onu Litvanyalı alt sınıflar arasında popüler bir aday yapıyor."
 LIT_abolish_the_presidency:0 "Cumhurbaşkanlığını Kaldır"
 LIT_abolish_the_presidency_desc:0 "Şimdiye kadar Smetona ulusun yönetimini elinde tuttu, ancak Mindaugas III'ün artan popülaritesi ile Cumhurbaşkanlığı makamının kaldırılması ve Kralın mutlak yönetimiyle değiştirilmesi ihtiyatlı görünüyor. Smetona, genç Mindaugas III'e danışmanı olarak hizmet ederek Başbakanlık görevine çekilecektir."
 LIT_anti_communist_militia:0 "Anti-Komünist Milisler"
 LIT_anti_communist_militia_desc:0 "Ulusumuzu solcu unsurlardan arındırmak bizim hırsımızdır ve neyse ki ülke genelinde hırsımızı paylaşan gönüllüler zaten var. Tek yapmamız gereken bu sol karşıtı örgütleri desteklemek ve onlar bizim için Sovyetlere karşı koruma işinin tamamını yapacaklar!"
 LIT_anti_soviet_opinion:0 "Sovyet karşıtı diplomasi"
 LIT_appease_nazis:0 "Almanları Yatıştır"
 LIT_appease_nazis_desc:0 "Savaşa hazırlanmak için her türlü çabayı göstermiş olsak da, Litvanyalıların hayatlarını korumak için yenilgiyi kabul etmeliyiz."
 LIT_appease_opinion:0 "Yatıştırma"
 LIT_appease_soviets:0 "Rusları Yatıştır"
 LIT_appease_soviets_desc:0 "Savaşa hazırlanmak için her türlü çabayı göstermiş olsak da, Litvanyalıların hayatlarını korumak için yenilgiyi kabul etmeliyiz."
 LIT_arm_monarchist_militants:0 "Monarşist Militanları Silahlandır"
 LIT_arm_monarchist_militants_desc:0 "Sınırlarımızın ötesinde [Root.GetLeader]'in uluslarına düzen ve refah getirmesini isteyenler olduğunu biliyoruz, tıpkı [Root.GetLeader.GetSheHe]'nin bizim için yaptığı gibi! Bu monarşist militanları silahlandırmaya istekli olmalıyız ki, haklı hükümdarlarını tahtlarına getirmek için savaşabilsinler."
 LIT_arrest_nazis_in_memel:0 "Memel'deki Nazileri Tutukla"
 LIT_arrest_nazis_in_memel_desc:0 "Memel, Naziler ve faşist sempatizanlarıyla dolu ve bu durum bir Alman işgali için bir emsal oluşturuyor. Memel bölgesini elimizde tutmak istiyorsak, Nazi partisi üyeliğini hapisle cezalandırılan bir suç haline getirmeli ve olası bir Nazi işgaline karşı yeterli hazırlıkları yapmalıyız."
 LIT_arrested_party_members:0 "Tutuklanan parti üyeleri"
 LIT_baltic_defence_army:0 "Baltık Savunma Ordusu"
 LIT_baltic_defence_army_desc:0 "Silahlı kuvvetlerimiz birlikte çalışıyor ancak esasen ayrı varlıklar. Uluslarımız arasındaki bağlar güçlendikçe, aynı anda hiçbir Baltık Devleti tarafından kontrol edilmeyen ancak hepsinin bir müttefiki olan ayrı bir varlık olan Birleşik Baltık Silahlı Kuvvetleri'ni kurabiliriz."
 LIT_baltic_economic_union:0 "Baltık Ekonomik Birliği"
 LIT_baltic_economic_union_desc:0 "Şimdi liberal demokrasi ulusumuza geri döndüğüne ve komşularımızla yakın diplomatik bağlar kurduğumuza göre, diğer Baltık Devletleriyle bir ekonomik birliğe girmek mantıklı. Ekonomilerimiz küçük olsa da, birlikte güçlenebilirler!"
 LIT_baltic_stronger_together:0 "Birleşik ama Ayrı"
 LIT_baltic_stronger_together_desc:0 "Baltık Devletleri arasında uzun zamandır bir kardeşlik ve yoldaşlık duygusu var, ama her zaman sınırlar ve siyasetle ayrıldık. Bağımsızlığımızı koruma isteğimizle diplomatik olarak birbirimize bağlıyız ve bu yüzden dostlarımız için savaşmaya ve birleşik Baltık silahlı kuvvetlerini genişletmeye kararlı olmalıyız!"
 LIT_baltic_unification:0 "Baltık Birleşmesi"
 LIT_baltic_unification_desc:0 "Baltık Devletleri arasında uzun zamandır bir kardeşlik ve yoldaşlık duygusu var, ama her zaman sınırlar ve siyasetle ayrıldık. Bağımsız kimliklerimiz güçlü olsa da, varlığımızı korumak için savaşma isteğimiz bizi birbirimize bağlıyor. Belki de Baltık Birliği'nin kendi başına bir ulusa dönüşme zamanı gelmiştir."
 LIT_beyond_the_baltic:0 "[Root.Get_Beyond_Baltic_Focus_Loc]"
 LIT_beyond_the_baltic_desc:0 "[Root.Get_Beyond_Baltic_Focus_desc_Loc]"
 LIT_claim_greater_lithuania:0 "Büyük Litvanya Üzerinde Hak İddia Et"
 LIT_claim_greater_lithuania_desc:0 "Bugün bildiğimiz Litvanya, ondan önce gelen Litvanya Büyük Dükalığı'nın sadece bir gölgesidir. Milletler Topluluğu, sadece Polonya ve Litvanya'nın bir birliğinden daha fazlasını, Polonyalıların, Litvanyalıların, Ukraynalıların ve Belarusluların bir birliğini tanımlar."
 LIT_claim_lithuania_minor:0 "Aşağı Litvanya Üzerinde Hak Talep Et"
 LIT_claim_lithuania_minor_desc:0 "Almanların yanlış bir şekilde “Königsberg” olarak adlandırdığı bölge aslında Litvanyalıların ata yurdudur. Küçük Litvanya, Baltık Haçlı Seferleri'nden beri Almanların işgali altında varlığını sürdürmüştür ve geri alınmalıdır."
 LIT_claim_livonia:0 "Livonya Üzerinde Hak İddia Et"
 LIT_claim_livonia_desc:0 "Kuzeyde yüzyıllardır bağımsızlık görmemiş iki genç devlet var. Kesinlikle Litvanya'nın elleri tarafından daha iyi yönlendirilirlerdi..."
 LIT_claim_livonia_monarchy:0 "Livonya Üzerinde Hak İddia Et"
 LIT_claim_livonia_monarchy_desc:0 "Baltık ulusları arasında kırılmaz bir kardeşlik ve yoldaşlık duygusu vardır ve şimdi tahtımızda bir Kral olduğuna göre, bu kardeşlik duygusunu ilahi hakkımız olarak talep etme hakkımız vardır."
 LIT_claim_prussia:0 "Doğu Prusya'yı Ele Geçir"
 LIT_claim_prussia_desc:0 "Doğu Prusya, sayısız Litvanyalı ve Polonyalı azınlığa ev sahipliği yapmaktadır ve bu adamların [Root.GetNameDef]'deki yoldaşlarıyla birleşme zamanı gelmiştir."
 LIT_defence_from_above:0 "Yukarıdan Savunma"
 LIT_defence_from_above_desc:0 "Eğer düşman onları gökyüzünden bombalamaya devam ederse tahkimatlarımız tamamen işe yaramaz. Bir savunma hazırlamalı ve yukarıdan atılan her bomba ve mermi için havaya ateşle karşılık vermeliyiz."
 LIT_demand_vilnius:0 "Vilnius'u Talep Et"
 LIT_demand_vilnius_desc:0 "Çok uzun zamandır geleneksel Litvanya başkenti Polonya'daki düşmanlarımız tarafından tutuldu ve hükûmetimiz bu konuda bir şey yapamayacak kadar zayıf iradeliydi, ama artık değil. Vilnius tekrar Litvanyalı olacak!"
 LIT_enforce_military_rule:0 "Askerî Yönetimi Uygula"
 LIT_enforce_military_rule_desc:0 "Litvanya, bağımsızlık mücadelesinde yalnız değildir. Letonya ve Estonya da bizimkiyle aynı düşmanlarla çevrili, ancak hükûmetleri halklarını savunmak için gerekli olanı yapacak omurgadan yoksun. Tüm Baltık'ta ordunun yönetimini uygulamalıyız."
 LIT_exile_voldemares:0 "Voldemaras'ı Sürgün Et"
 LIT_exile_voldemares_desc:0 "Augustinas Voldemaras güvenli bir şekilde parmaklıklar ardındayken, Demir Kurt'un havlamasının ısırığı olmayacağını düşünebilirsiniz, ancak örgütü hala onun serbest bırakılması için ajitasyon yapıyor ve ulus için aktif bir tehdit oluşturuyor. Eğer Voldemaras serbest bırakılır ancak bir daha asla Litvanya'ya girmesi yasaklanırsa, Demir Kurt hareketi kaçınılmaz olarak ivme kaybedecek ve biz de onların oluşturduğu tehditten kurtulacağız."
 LIT_expand_lithuanian_shipyards:0 "Litvanya Tersanelerini Genişlet"
 LIT_expand_lithuanian_shipyards_desc:0 "Polonya'nın kontrolümüz altında olmasıyla, deniz kapasitemizi büyük ölçüde genişletme ve Baltık Denizi'nde hakimiyet için rekabet etme fırsatı verildi."
 LIT_expand_military_budget:0 "Askerî Bütçeyi Genişlet"
 LIT_expand_military_budget_desc:0 "Ordu mensupları arasındaki yaygın bir şikayet, sivil hükûmet içinde çalışanlara kıyasla nispeten düşük maaşlarıdır. Raštikis'in Başbakanlık makamını işgal etmesiyle, orduya ihtiyaç duyduğu bütçeyi verme zamanı geldi."
 LIT_exploit_the_international_bank:0 "Uluslararası Bankayı Sömür"
 LIT_exploit_the_international_bank_desc:0 "Uluslararası Banka'nın bir üyesi olarak Antanas Smetona, devletin yararına bankacılık sektörünü sömürmek için birinci sınıf bir konumdadır. Bu yaklaşan savaş zamanlarında başka ne seçeneğimiz var?"
 LIT_formalize_baltic_entente:0 "[Root.Get_Baltic_Entente_Focus_Loc]"
 LIT_formalize_baltic_entente_desc:0 "[Root.Get_Baltic_Entente_Focus_desc_Loc]"
 LIT_fortify_memel:0 "Memel'i Tahkim Et"
 LIT_fortify_memel_desc:0 "Almanlara Litvanya egemenliğini savunmaları konusunda, bir tilkiye bir kümese bekçilik etmesi konusunda güvenilebileceğinden daha fazla güvenilemez! [GER.GetLeader] Litvanya devletinin bir düşmanıdır ve Memel'in bizi Alman saldırganlığı için bir hedef haline getirdiği sır değildir!"
 LIT_free_voldemares:0 "Voldemaras'ı Serbest Bırak"
 LIT_free_voldemares_desc:0 "Belki de Smetona eski Başbakanını tutuklamakta çok aceleci davrandı. Voldemaras açıkça Litvanya bağımsızlığının bir dostudur ve onun becerilerini ve sadık kamuoyu desteğini hükûmetimiz içinde kullanmamak aptallık olur."
 LIT_greater_commonwealth:0 "Büyük Milletler Topluluğu"
 LIT_greater_commonwealth_desc:0 "Milletler Topluluğu'nun hırsları, uzun zamandır kaybolmuş Krallığın sadece tarihi sınırlarının çok ötesine uzanıyor. Polonyalıların kalbindeki Milletler Topluluğu, büyük bir emperyal güç, denizden denize parlayan çok kültürlü bir imparatorluktur!"
 LIT_indivisible_power_of_the_state:0 "Devletin Bölünmez Gücü"
 LIT_indivisible_power_of_the_state_desc:0 "Ben devletim, devlet benim. Diktatörlüğün yasaları ve kuralları sağlam bir şekilde kurulduğuna göre, geriye kalan tek şey diktatörün gücünün mutlak olmasını sağlamaktır. Bazıları demokrasiye dönmeyi arzulasa da, ayı ve kartalın toplu nefesi Litvanya'nın ensesindeyken bunun tehlikeli ve ahmakça bir fikir olduğunu biliyoruz."
 LIT_infiltrate_homeland:0 "[Root.Get_Covert_Resistance_Focus_Loc]"
 LIT_infiltrate_homeland_desc:0 "[Root.Get_Covert_Resistance_Focus_desc_Loc]"
 LIT_institute_royal_guards:0 "Kraliyet Muhafızlarını Kur"
 LIT_institute_royal_guards_desc:0 "Tahtta oturan bir hükümdar varken, sevgili hükümdarımızın kişisel korunmasıyla görevlendirilecek Litvanya ordusu saflarındaki en seçkinleri bulmamız hayati önem taşımaktadır."
 LIT_integrate_the_opposition:0 "Muhalefeti Entegre Et"
 LIT_integrate_the_opposition_desc:0 "Antanas Smetona eski hükûmeti beceriksiz politikacılar ve Sovyet sempatizanlarından oluşan bir kabine olarak görse de, saflarında bir dizi yetkin adam olduğunu inkar etmek zordur ve onları yeni Seimas'ta kullanmamak aptallık olur."
 LIT_invade_poland:0 "Polonya'yı İşgal Et"
 LIT_invade_poland_desc:0 "Yüzyıllar boyunca Litvanya, Polonya'nın gücün çoğunluğunu elinde tuttuğu sözde bir “Milletler Topluluğu” içinde zincirlenmişti. Polonyalılar bu duruma geri dönmek için susamışlardı ve belki de onlara arzuladıkları Milletler Topluluğu'nu verme zamanı gelmiştir."
 LIT_join_the_allies:0 "Müttefiklere Katıl"
 LIT_join_the_allies_desc:0 "[Root.Get_Join_Allies_Focus_desc_Loc]"
 LIT_king_of_poland:0 "Polonya Krallığı"
 LIT_king_of_poland_desc:0 "Zamanı geldi; Polonya halkı [POL.GetLeader]'e karşı kışkırtıldı ve monarşist destekçiler hükûmete taleplerini iletmeye hazır. Litvanya desteğiyle, [Root.GetLeader]'i Tanrı tarafından atanmış hükümdarları olarak görecekler."
 LIT_lithuanian_activist_front:0 "Litvanya Aktivist Cephesi"
 LIT_lithuanian_activist_front_desc:0 "Litvanya'nın her yerinde aktivistler ve paramiliter gruplar var, ancak bunlar dağınık ve ideolojiye göre ayrılmış durumdalar, ama hepsinin ortak noktası Litvanya için savaşma ve bağımsızlığını koruma ruhudur. Litvanya Aktivist Cephesi'ni kurarak, Litvanya'yı emperyalist güçler tarafından yağmalanacak kadar kolay bir hedef olmaktan çıkaracağız."
 LIT_lithuanian_preservationism:0 "Litvanya Korumacılığı"
 LIT_lithuanian_preservationism_desc:0 "Litvanya Cumhuriyeti genç ve hala dünyadaki yerini bulmaya çalışıyor. Birçoğu onun Komünizme, Faşizme veya Liberalizme boyun eğdiğini görmek ister, ancak bu yabancı nüfuzlara boyun eğme dürtüsünden kaçınmalıyız. Gerçekten bağımsız bir Litvanya, yolunu yalnız bulmalıdır."
 LIT_lithuanian_rail:0 "Polonya-Litvanya Demiryolları"
 LIT_lithuanian_rail_desc:0 "Eğer Polonya ve Litvanya gerçekten birleşecekse, birlik arasındaki seyahat önemsiz bir mesele olmalıdır. Demiryollarımızı birleştirerek, tedarik zincirlerimizi ve endüstriyel kapasitemizi büyük ölçüde geliştireceğiz."
 LIT_lithuanian_youth:0 "Demir Kurt Gençliği"
 LIT_lithuanian_youth_desc:0 "Ordunun adamlara ihtiyacı var, ama bu ideoloji zamanlarında, oğlanlarımızın kafasına vatansever fikirler ekmeliyiz ki, yeterince büyüdüklerinde, tek ihtiyaçları olan bir tüfek olsun ve tek bir karış Litvanya toprağı için seve seve ölsünler."
 LIT_look_north:0 "[Root.Get_Look_North_Focus_Loc]"
 LIT_look_north_desc:0 "[Root.Get_Look_North_Focus_desc_Loc]"
 LIT_martial_law:0 "Sıkıyönetim"
 LIT_martial_law_desc:0 "Özgürlük, barışın tadını çıkaran uluslara tanınan bir lükstür, ancak etrafımızdaki düşmanlarla Litvanya böyle bir lüksün tadını çıkaramaz."
 LIT_merge_civilian_industries:0 "Sivil Sanayileri Birleştir"
 LIT_merge_civilian_industries_desc:0 "Uluslarımız artık birleştiğine göre, Litvanya'nın sadece Litvanya için ve Polonya'nın sadece Polonya için inşa etmesi pek mantıklı değil. Sanayilerimiz, ulusun iyiliği için bir olmalıdır."
 LIT_merge_the_arms_industries:0 "Silah Sanayilerini Birleştir"
 LIT_merge_the_arms_industries_desc:0 "Polonyalı ve Litvanyalı silah üreticileri on yıllardır ayrı ayrı silah üretiyorlardı, ancak şimdi uluslarımız bir olduğuna göre, sanayilerimizi uzmanlaştırma ve Polonyalı ve Litvanyalı fabrikalar arasında işbirliği yaratma fırsatımız var."
 LIT_merge_the_military_and_civilian_governments:0 "Askerî ve Sivil Hükûmetleri Birleştir"
 LIT_merge_the_military_and_civilian_governments_desc:0 "Ordu ile Cumhurbaşkanı arasında paylaşılan güç bir süre için yararlıydı, ancak Smetona hızla kullanışlılığını yitiriyor. Sadece acil durum yetkilerinin orduya devri Litvanya'nın devam eden güvenliğini sağlayabilir."
 LIT_new_kind_of_iron_wolf:0 "Yeni Bir Tür Demir Kurt"
 LIT_new_kind_of_iron_wolf_desc:0 "Demir Kurt tehdidi artık ortadan kalktığına göre, ulusal sembolümüzü geri alabilir ve silahlı kuvvetlerimiz boyunca gururla sergileyebiliriz."
 LIT_occupation:0 "İşgal"
 LIT_occupation_desc:0 "Bizim için çok geç. Ülke, her an bize karşı dönebilecek düşman askerleriyle dolu. Belki de liderlerimizin ve hükûmetimizin istifa etme ve düşmanlarımızın bizimle istediklerini yapmalarına izin verme zamanı gelmiştir."
 LIT_occupation_tt:0 "§Y[LIT.GetNameDef]§! §Y$LIT_occupation$'yi tamamladığı için efektler:"
 LIT_offer_military_basing:0 "Üs Hakları Teklif Et"
 LIT_offer_military_basing_desc:0 "İstediğimiz son şey başka bir savaş. Litvanya hem Almanlar hem de Sovyetler için stratejik bir ilgi sunuyor ve bu yüzden belki de ulusumuzun içinde erişim ve üs hakları ile sığınak inşa etme ve kullanma imkânı sunarak işgalden kaçınabiliriz."
 LIT_offer_military_basing_tt_1:0 "§GKimin yatıştırıldığına bağlı olarak:§!\n"
 LIT_offer_military_basing_tt_2:0 "§RVEYA§!\n"
 LIT_organize_the_iron_wolf:0 "Demir Kurt'u Organize Et"
 LIT_organize_the_iron_wolf_desc:0 "Demir Kurt dağınık ve düzensiz kalmaya devam ediyor ve Voldemaras'ın kendisi gibi, hükûmeti destekleyip desteklemeyecekleri veya onu devirmek isteyip istemedikleri konusunda kararsızlar. Demir Kurt'a kesin bir vizyon ve hedef sağlayarak, bu kayıp çocuklardan adamlar yaratacağız."
 LIT_pan_baltic_bank:0 "Pan-Baltık Bankası"
 LIT_pan_baltic_bank_desc:0 "Ekonomik birlik artık yürürlükte olduğuna göre, pan-Baltık bir banka ve ortak bir para birimi kurma olasılığımız var."
 LIT_patriotic_education:0 "Vatansever Eğitim"
 LIT_patriotic_education_desc:0 "Litvanya'daki eğitim sektörü daha iyi günler gördü, ancak fikirlerin gençlerimiz arasında başıboş dolaşmasına izin veremeyiz. Gençler, Rytas gibi iyi kurumlarda vatansever Litvanyalı Katolikler olarak düzgün bir şekilde eğitilmelidir."
 LIT_patriotic_socialism:0 "Vatansever Sosyalizm"
 LIT_patriotic_socialism_desc:0 "Demokratik hükûmet büyük ölçüde Sosyal Demokratlar ve merkezcilerden oluşuyordu ve sosyalizm idealleri Litvanyalı işçilerin zihinlerini kirletiyor. Kazys Grinius açıkça bir sosyalist olsa da, vatansever ruhunu inkar etmek mümkün değil ve belki de onun bazı fikirlerini uygulayarak Litvanyalı işçi hem daha üretken hem de Diktatörlüğe daha destekleyici olabilir."
 LIT_peace_with_poland:0 "Polonya ile Barış"
 LIT_peace_with_poland_desc:0 "Resmî olarak, Polonya ile Litvanya arasındaki savaş on yıllardır sürüyor, ancak savaşın büyük bir bölümünde iki taraf da çatışmaya girmedi. Vilnius hala onların elinde olmasına rağmen, Doğu ve Batı'daki gerçek düşmanlarımıza odaklanmak için bu çıkmazı resmî bir barışa dönüştürmeliyiz."
 LIT_peasants_reform:0 "Köylü Reformu"
 LIT_peasants_reform_desc:0 "Köylülük, ekonomik zenginliğimizin çoğunluğunu oluşturmalarına rağmen Litvanya'nın en fakir insanları arasındadır. Vladas Mironas'ın Başbakan ve tarım şefi olmasıyla, köylü sınıfımıza çok daha iyi yaşam koşulları sağlayabiliriz."
 LIT_prepare_forest_brothers:0 "[Root.Get_Forest_Focus_Loc]"
 LIT_prepare_forest_brothers_desc:0 "[Root.Get_Forest_Focus_desc_Loc]"
 LIT_prepare_resistance:0 "[Root.Get_Ready_Resistance_Focus_Loc]"
 LIT_prepare_resistance_desc:0 "[Root.Get_Ready_Resistance_Focus_desc_Loc]"
 LIT_presidential_reform:0 "[GetLithuanianPowerIdeaAdj] Reformu"
 LIT_presidential_reform_desc:0 "Parti siyaseti Litvanya devletini o kadar uzun süre rahatsız etti ki, [GetLithuanianLeaderTitle]'in yetkilerini kısıtladı. Yeni Litvanyalı [GetLithuanianLeaderTitle], siyasi partilerin çekişmelerinin üstünde olmalı ve bunun yerine yalnızca Litvanya'nın kendisine ait olmalıdır."
 LIT_proclaim_greater_lithuania:0 "Büyük Litvanya'yı İlan Et"
 LIT_proclaim_greater_lithuania_desc:0 "Litvanya bir zamanlar Avrupa'nın en büyük güçlerinden biriydi, ancak yüzyıllar önce Polonyalılar tarafından kesilip hadım edildiğimizden beri eski ihtişamımızı geri getiremedik, ama artık değil. Litvanya bir kez daha Avrupa'nın en büyük gücü olacak!"
 LIT_propose_baltic_union:0 "Bir Baltık Birliği Öner"
 LIT_propose_baltic_union_desc:0 "Uluslarımız arasında artık tüm bu farklı varlıklar iç içe geçmişken, resmî bir Baltık Birliği'nin kurulması kaçınılmaz görünüyor. Birlik, tüm üye uluslara birlik içinde oy ve veto hakkı tanıyacak ve uluslarımızı daha da yakınlaştıracaktır."
 LIT_purge_popular_resistance:0 "Halk Direnişini Temizle"
 LIT_purge_popular_resistance_desc:0 "Halkımız arasında Smetona'ya ve diktatörlüğüne karşı çıkacak haydut unsurlar var. Bu insanlar Litvanya bağımsızlığının düşmanıdır ve ulusumuzun devam eden istikrarını ve hayatta kalmasını sağlamak için ortadan kaldırılmalıdır."
 LIT_push_for_ruthenia:0 "Ruthenia Boyunca İlerle"
 LIT_push_for_ruthenia_desc:0 "Ukrayna ve Belarus'un demiryolu ağları ne yazık ki ihmal edildi, ancak bu topraklar da Milletler Topluluğu'nun diğerleri kadar bir parçasıdır. Sovyetlerin içinden geçip bizim olanı geri alacaksak, Doğu raylarına yatırım yapmalıyız."
 LIT_rapid_fortifications_in_the_east:0 "Doğuda Hızlı Tahkimatlar"
 LIT_rapid_fortifications_in_the_east_desc:0 "Devam eden bağımsızlığımıza yönelik en acil tehdidin komünistler olduğu açıktır ve ulusumuzu onların oluşturduğu tehditten korumak için elimizden gelen her şeyi yapmalıyız."
 LIT_rastikis_military_reforms:0 "Rastikis'in Askerî Reformları"
 LIT_rastikis_military_reforms_desc:0 "Ordu, başka bir Alman işgalinin getireceği büyüklükte ve ciddiyette bir tehditle yüzleşmeye hazırlıksızdır ve hükûmetin askerî kanadının Litvanya ordusunun vatansever adamlarına yetkin bir liderlik getirmesi hayati önem taşımaktadır."
 LIT_reminder_of_true_enemy:0 "Gerçek Düşmanın Hatırlatıcısı"
 LIT_reminder_of_true_enemy_desc:0 "1918 savaşı sırasında Kızıl Ordu ve Freikorps tarafından acımasız bir baskıya maruz kaldık ve ufukta savaş belirirken, bu anıların acı sızısı Litvanyalı bakanların zihinlerini yakıyor. Gecikemeyiz, bu güçlerden hangisinin en büyük tehdidimiz olduğuna karar vermeli ve savaşa yeterli hazırlıkları yapmalıyız!"
 LIT_request_polish_occupation:0 "Polonya İşgali Talep Et"
 LIT_request_polish_occupation_desc:0 "Son birkaç on yıldır, Litvanya'yı içermeyen bir Polonya devleti fikri düşünülemez olarak tanımlandı ve Litvanya egemenliği çağdaş Polonyalı politikacılar için bir şaka gibi bir şeydi, bu yüzden belki de acınası uluslarının bir Litvanya işgaliyle tamamen tatmin olurlardı."
 LIT_restore_greater_lithuania:0 "Büyük Litvanya'yı Geri Getir"
 LIT_restore_greater_lithuania_desc:0 "Doğu'da sayısız işbirlikçi şimdi bizim adımıza görev almaya hevesliyken, geriye kalan tek şey yerel yönetimleri sadıklarla doldurmak ve Ruthenia üzerinde yeni bir Litvanya hakimiyeti dönemini ilan etmektir!"
 LIT_restore_order:0 "Düzeni Geri Getir"
 LIT_restore_order_desc:0 "Çok uzun zaman önce, Litvanya sözde “Milletler Topluluğu”nda daha büyük bir ortaktı ve Polonya sınırımızda ince bir devlet şeridinden başka bir şey değildi. Dünyayı olması gerektiği gibi yeniden kurmanın zamanı geldi."
 LIT_restore_public_elections:0 "Halk Seçimlerini Geri Getir"
 LIT_restore_public_elections_desc:0 "Litvanya üzerindeki diktatörlük yönetimi bir süre için yararlı oldu, ancak devlet şimdi istikrara kavuştuğuna göre, halk duyulmayı hak ediyor. Litvanyalı olmanın ne anlama geldiği konusunda kendi aramızda tartıştık, ama belki de halka sormalıyız."
 LIT_root_out_the_iron_wolf:0 "Demir Kurt'u Kökünden Sök"
 LIT_root_out_the_iron_wolf_desc:0 "Voldemaras'ı sürgün etmek, Demir Kurt'un hükûmeti devirme çabalarını durdurmuş olsa da, örgüt hala var ve bu adamlar Litvanya ordusu için istikrarlı bir gelecek sağlamak amacıyla siyasi olarak çok uzaklara itilmelidir."
 LIT_secure_a_loyal_cabinet:0 "Seimas'ı Yeniden Topla"
 LIT_secure_a_loyal_cabinet_desc:0 "Darbe güvence altına alındığına ve Antanas Smetona'nın hükûmet üzerindeki kontrolü mutlak olduğuna göre, ulusu daha verimli bir şekilde yönetmek için, Diktatörün yanında sadık bakanlarla Seimas'ı yeniden toplama zamanı gelmiştir."
 LIT_seek_ties_with_germany:0 "Almanya ile Bağlantı Kur"
 LIT_seek_ties_with_germany_desc:0 "Resmî olarak Litvanya devletinin bir düşmanı olmasına rağmen, Almanya düşmanımızı paylaşıyor; Polonya. Almanlarla temas kurarak, belki de şu anda Polonyalılar tarafından işgal edilen kayıp Litvanyalı kardeşlerimizi geri alabiliriz."
 LIT_soviet_mutual_assistance:0 "[SOV.GetAdjective] Karşılıklı Yardımlaşma"
 LIT_soviet_mutual_assistance_desc:0 "Polonya hem Sovyetlerin hem de Almanların birincil hedefidir ve bunu herkes bilir. İki güç arasında Polonya'yı paylaşma planları olduğuna dair fısıltılar duyduk ve belki de Sovyetleri, Vilnius'un hak sahiplerine iadesi karşılığında çabalarında Litvanya desteği aramaya ikna edebiliriz."
 LIT_state_media:0 "Devlet Medyası"
 LIT_state_media_desc:0 "Çok sık olarak gazetelerin yayınları ağzına kadar faşist ve komünist propaganda ile doludur. Bunun yerine genel halk, devlet onaylı yayınları okumaya teşvik edilmelidir; gerçek için tek güvenilir kaynak."
 LIT_strength_in_unity:0 "Birlikten Güç Doğar"
 LIT_strength_in_unity_desc:0 "Birlikteyken güçlüyüz ve hiçbir iki ulus Polonya ve Litvanya gibi bir bağa sahip olmadı. Kendimizi bir daha asla bir Milletler Topluluğu'na hapsetmemize izin vermeyecek olsak da, belki iki ulusumuz kırılgan bağımsızlıklarını koruyarak dost olarak işbirliği yapabilirler."
 LIT_support_monarchism_in_POL:0 "Polonya'da Monarşizmi Destekle"
 LIT_support_monarchism_in_POL_desc:0 "Tıpkı Litvanya gibi, Polonya'nın da kendine yeni bir Kral seçmesi gerekiyordu. Ancak Litvanya'nın aksine, Polonyalılar tahtları için uygun bir Kral bulamadılar, ama biz Polonya halkına vaat edilen güçlü hükümdarı sağlayabiliriz; Polonya'yı Alman emperyalizminden koruyacak birini."
 LIT_support_polish_fascists:0 "Polonyalı Faşistleri Destekle"
 LIT_support_polish_fascists_desc:0 "Polonya bizimle ortak düşmanları paylaşıyor ve Polonya-Litvanya tarihini karakterize eden yılların akrabalığını unutmamalıyız ve Polonya devleti içinde faşizmi desteklemeliyiz."
 LIT_the_nation_and_its_power:0 "Ulus ve Gücü"
 LIT_the_nation_and_its_power_desc:0 "Seimas'ın çekişmesi, [GetLithuanianLeaderTitle]'in gücüne bir engel olmaktan başka bir şey değildir. Kendini savunma yeteneğine sahip bir ulus inşa edeceksek, mutlak gücü [GetLithuanianLeaderTitle]'e vermeliyiz."
 LIT_the_nationalist_council:0 "Milliyetçi Konsey"
 LIT_the_nationalist_council_desc:0 "Cumhurbaşkanımız zaten resmî olarak herhangi bir siyasi partinin parçası değil, ama Seimas hala kendi aralarında iktidarsız çocuklar gibi çekişiyor. [ROOT.GetRulingParty] ile işbirliği yapmaya teşvik edilmelidirler, yoksa hızlı bir istifa beklemelidirler."
 LIT_underground_production_centers:0 "[Root.Get_Underground_Resistance_Focus_Loc]"
 LIT_underground_production_centers_desc:0 "[Root.Get_Underground_Resistance_Focus_desc_Loc]"
 LIT_unify_the_military:0 "Orduyu Birleştir"
 LIT_unify_the_military_desc:0 "Litvanya ordusunun bir kısmı Voldemaras ve onun Demir Kurt paramiliter grubuna tamamen hayran kalmış durumda. O kadar ki, tek gereken bir davet ve neredeyse Litvanya ordusunun tamamı Demir Kurt nüfuzu altına girecektir. Bununla, nihayet Smetona'yı hükûmetten atıp Litvanya'yı geri alabiliriz!"
 LIT_victory_in_trust:0 "Zafer Güvendedir"
 LIT_victory_in_trust_desc:0 "Hükûmetimizde güvenebileceğimiz kimse yok; ne Kazys Grinius, ne Augustinas Voldemaras, ne de Rastiki. Güçlü adamlar korkak ve haindir, ama bir tüfek ve onu ateşleyecek iyi bir adam? İşte buna güvenebiliriz ve bu bize zafer getirecektir."
 LIT_warsaw_to_crimea_railway:0 "Varşova'dan Kırım'a Demiryolu"
 LIT_warsaw_to_crimea_railway_desc:0 "Denizden denize hükmetme hırsımızda, aldığımız her toprağın ulusumuzun tam entegre bir parçası haline gelmesi hayati önem taşımaktadır. Doğal sınırlarımız Kuzey'den Güney'e, Doğu'dan Batı'ya uzanıyor ve Kırım'ı demiryolumuzla birleştirme hırsı, bölgedeki hakimiyetimizi sağlamlaştıracaktır."
 NSB_soviet_soviet_german_trade_agreement_tech_bonus_name:0 "Sovyet-Alman Ticaret Anlaşması"
 NSB_soviet_soviet_german_trade_agreement_tech_bonus_name_alt:0 "Rus-Alman Ticaret Anlaşması"
 POL_KPP_focus:0 "Solcu Bir Kabine Topla"
 POL_KPP_focus_desc:0 "KPP, Polonya'ya sosyalizmi getirmek için gerekli olan radikal eylemi yapmaya hazır devrimcilerden oluşan bir partidir. Sanasyon'a sadık olanlardan bazıları o zamandan beri bağlılıklarını değiştirmiş olsa da, kabinemizi doldurmak için onlara güvenemeyiz ve onların yerine devrimci yoldaşlarımız getirilmelidir."
 POL_LIT_union:0 "Milletler Topluluğu'nu Geri Getir"
 POL_LIT_union_desc:0 "[Root.GetLeader]'in hem Polonya hem de Litvanya Kralı olmasıyla, geriye kalan tek şey Seimas'ı Sejm ile bir kez daha birleştirmek ve Polonya-Litvanya Milletler Topluluğu yeniden doğmuş olacak."
 POL_ROM_join_allies:0 "Müttefiklere Katıl"
 POL_ROM_join_allies_desc:0 "Polonya ve Romanya tahtları artık birleştiğine göre, diplomatik odağımızı Batı'daki müttefiklerimize geri kaydırmalıyız."
 POL_a_leftist_sejm:0 "Solcu Sejm"
 POL_a_leftist_sejm_desc:0 "Polonya Halk Partisi, Sanasyon'a tercih edilse de, sosyal demokratlar Polonya proletaryasını gerçekten özgürleştirmek için gerekli olan radikal reformları yapacak omurgadan yoksundur. Polonya halkının zincirlerini sonsuza dek kırması ancak Komünist Parti'nin doğrudan liderliğiyle mümkündür."
 POL_added_to_strike_flag:0 "Bu eyalet zaten Köylü Grevi'ne katılıyor."
 POL_align_with_habsburgs:0 "Bir Habsburg İttifakı"
 POL_align_with_habsburgs_desc:0 "Habsburglar Polonya ve Macaristan tahtlarında oturuyor, belki de aile bağlarımızı bir ittifaka dönüştürme zamanı gelmiştir."
 POL_anti_blitz_tactics:0 "Yıldırım Harbi Karşıtı Taktikler"
 POL_anti_blitz_tactics_desc:0 "Almanlar, ulusumuzu hızlı ve ezici bir güçle istila etmeye çalışıyorlar, ama belki de bu savaş makinesi sadece bir camdan bir toptur. İnsanlar geri çekilmeden tehlikeyle yüzleşmeye zorlanabilir ve bir tank, ancak ona hazırlanmazsak heybetlidir."
 POL_anti_capitalist_revolution:0 "Anti-Kapitalist Devrim"
 POL_anti_capitalist_revolution_desc:0 "Polonya'nın Batı ile uyumunu diplomatik çıkar uğruna sürdürme cazibesi olsa da, inançlarımızı yabancı kapitalistlere satamayız. Dünya devrimi burjuvaziye karşı bir mücadeleyi gerektirir ve kendilerine “faşist” ya da “demokratik” desinler, tam olarak bunu yapmaya niyetliyiz."
 POL_anti_fascist_military_desc:0 "Sosyalist bir hükûmet Polonyalıları bir şekilde bölse de, Batı ile olan uyumumuz bize siyasi yelpazenin her tarafında ortak bir hedef veriyor ve bu, faşizme ve Alman emperyalizmine karşı şiddetli muhalefetimizdir. Destek ve propaganda ile, ordumuz yükselen küresel faşizm karşısında güçlü ve birleşik olacaktır."
 POL_anti_germans_abroad:0 "Yurtdışındaki Alman Karşıtlarını Destekle"
 POL_anti_germans_abroad_desc:0 "Baltık Devletleri, Bolşevizm ve Nazizm'e karşı bu mücadelede kardeşlerimizdir. Dağınık, zavallı ve zayıf olsalar da, arkalarında güçlü bir Polonya hükûmetiyle, bu devletleri işlevsel savaş makinelerine dönüştürebiliriz."
 POL_anti_imperialism:0 "Anti-Emperyalizm"
 POL_anti_imperialism_desc:0 "Emperyalist savaşa karşı çıkmak takdire şayan bir ilkedir, ancak sadece emperyal savaşı kınamak yeterli değildir, bir dünya devrimi emperyalizmin kendisine karşı çıkmayı gerektirir!"
 POL_arm_monarchist_militants:0 "Monarşist Militanları Silahlandır"
 POL_arm_monarchist_militants_desc:0 "Sınırlarımızın ötesinde [Root.GetLeader]'in uluslarına düzen ve refah getirmesini isteyenler olduğunu biliyoruz, tıpkı [Root.GetLeader.GetSheHe]'nin bizim için yaptığı gibi! Bu monarşist militanları silahlandırmaya istekli olmalıyız ki, haklı hükümdarlarını tahtlarına getirmek için savaşabilsinler."
 POL_arm_peasant_militia:0 "Köylü Milislerini Silahlandır"
 POL_arm_peasant_militia_desc:0 "Polonya köylülüğü, zalimlerinden ancak tek bir yolla kurtulacaktır ve bu yol, silahlanıp burjuvaziyle savaşmaktır. Morges Cephesi'nin siyasi sermayesini Sanasyon'dan ekipman çalmak için kullanarak, savaşa tamamen eğitimli ve silahlı köylülerle başlayacağız."
 POL_armia_ludowa:0 "Armia Ludowa (Halk Ordusu)"
 POL_armia_ludowa_desc:0 "Yabancı emperyalistleri silah gücüyle yenemeyiz, ancak ne olursa olsun mücadelede ölmeye istekli solcu militanları örgütleyebiliriz. Armia Ludowa'yı partimizin askerî kolu olarak kurarak, sosyalist devrimimizin hırslarına sadık bir orduya her zaman sahip olacağımızı garanti edeceğiz!"
 POL_assemble_the_regency_council:0 "Naiplik Konseyini Topla"
 POL_assemble_the_regency_council_desc:0 "5 Kasım Yasası, Merkezi Güçler tarafından Rus İmparatorluğu'nun küllerinden özgür ve bağımsız bir Polonya Krallığı çıkarma vaadiydi. Ortaya çıkan naiplik, tüm yetkileri Piłsudski'ye devretmeden önce bir hükümdar bulmayı başaramadı, ancak Sanasyoncular istikrarlı bir hükûmet kuramadığından, belki de Polonya'ya hak ettiği Kralı bulmak için naipliği yeniden kurma zamanı gelmiştir."
 POL_assert_eastern_claims:0 "Doğu'daki Hak İddialarını İleri Sür"
 POL_assert_eastern_claims_desc:0 "Polonya şu anki haliyle bir zamanlar olduğu İmparatorluğun bir gölgesidir. Polonya sadece Polonyalıların yaşadığı yer değil, Polonya Milletler Topluluğu'nun mirasıdır ve Doğu'daki eski sınırları geri getirmeliyiz."
 POL_assert_eastern_claims_pavel:0 "Doğu'daki Hak İddialarını İleri Sür"
 POL_assert_eastern_claims_pavel_desc:0 "Milletler Topluluğu, eski Rus İmparatorluğu'nun birçok bölümünü içerir ve şüphesiz, Pavel onları ilhak ederse bir hain olarak görülecektir. Ancak, Rus İmparatorluğu artık yok ve eski Rus topraklarını Sovyetlerden korumak Pavel'in bir Beyaz olarak görevidir."
 POL_assert_western_claims:0 "Batı'daki Hak İddialarını İleri Sür"
 POL_assert_western_claims_desc:0 "Polonya'nın sınırları tesadüfen, o zamandan beri büyük sanayi merkezleri haline gelen eski topraklarının çoğunu dışarıda bırakıyor gibi görünüyor. Onların Polonya kontrolüne geri alınması Bermontiyalıların davası için yararlı olacaktır."
 POL_assurance_of_loyalty:0 "Savaş Sonrası Sınırları Belirle"
 POL_assurance_of_loyalty_desc:0 "Almanlar bizden önemli topraklar aldılar ve savaşı destekleme çabalarımız tartışılamaz. Yeterince boyun eğdik, teslim ettiklerimiz için bir miktar tazminat talep etme zamanı geldi."
 POL_baltic_socialism:0 "Baltık Sosyalizmini Uygula"
 POL_baltic_socialism_desc:0 "Baltık halkının iradesi diktatörler, kapitalistler ve faşistler tarafından bastırılıyor. Eğer işçiler kendilerini özgürleştireceklerse, bu doğrudan Polonya müdahalesiyle yapılmalıdır."
 POL_beck_ribbentrop:0 "Beck-Ribbentrop Paktı"
 POL_beck_ribbentrop_desc:0 "Almanların Gdansk ve diğer eski Alman topraklarını ilhak etme susuzluğu bir sır değil, ama belki de bu kanlı bir çatışma yoluyla olmak zorunda değil. Belki de Józef Beck, sınırımızdaki çekişmeye diplomatik bir çözüm yaratabilir."
 POL_can_boost_in_benelux_tt:0 "§YBenelüks'te Falanjizmi Teşvik Et§! kararlarının kilidini açar."
 POL_can_boost_in_latin_america_tt:0 "§YLatin Amerika'da Falanjizmi Teşvik Et§! kararlarının kilidini açar."
 POL_claim_greater_lithuania:0 "Büyük Litvanya Üzerinde Hak İddia Et"
 POL_claim_greater_lithuania_desc:0 "Bugün bildiğimiz Litvanya, ondan önce gelen Litvanya Büyük Dükalığı'nın sadece bir gölgesidir. Milletler Topluluğu, sadece Polonya ve Litvanya'nın bir birliğinden daha fazlasını, Polonyalıların, Litvanyalıların, Ukraynalıların ve Belarusluların bir birliğini tanımlar."
 POL_claim_livonia:0 "Livonya Üzerinde Hak İddia Et"
 POL_claim_livonia_desc:0 "Baltık ulusları arasında kırılmaz bir kardeşlik ve yoldaşlık duygusu vardır ve şimdi Litvanya'nın çıkarlarını temsil ettiğimize göre, bu kardeşlik duygusunu kendimiz için talep etme ve Baltıkları büyüyen imparatorluğumuza birleştirme hakkımız var."
 POL_claim_prussia:0 "Doğu Prusya'yı Ele Geçir"
 POL_claim_prussia_desc:0 "Doğu Prusya, sayısız Litvanyalı ve Polonyalı azınlığa ev sahipliği yapmaktadır ve bu adamların Milletler Topluluğu'ndaki yoldaşlarıyla birleşme zamanı gelmiştir."
 POL_claim_russia:0 "Rusya Üzerinde Hak İddia Et"
 POL_claim_russia_desc:0 "Kral Anastasia Romanov, Çar II. Nikolay'ın yaşayan son varisidir ve bu nedenle Rus tahtı üzerindeki iddiası sadece meşru değil, aynı zamanda Tanrı'nın iradesidir. Rus soyluları onun iddiasını desteklerken, Anastasia Rusya İmparatoriçesi olarak doğum hakkını geri almaya hazırdır."
 POL_claiming_lithuania:0 "Milletler Topluluğu Talibi"
 POL_claiming_lithuania_desc:0 "Polonya ve Litvanya'ya eşit derecede hak iddia eden bir dizi kişi var ve her Polonyalının Milletler Topluluğu'nu yeniden kurma hırsında, bunu her ikisi üzerinde de ilahi hak iddia edebilen bir Kralın hükümdarlığı altında yaparsak son derece yardımcı olur."
 POL_com_independence:0 "Bağımsızlık"
 POL_com_independence_desc:0 "[SOV.GetNameDef] tarafından yeterince uzun süre sömürüldük! Polonyalı devrimcilerin bir kez daha silahlanıp kendilerini yönetme hakları için savaşma zamanı geldi!"
 POL_committee_of_national_liberation:0 "Ulusal Kurtuluş Komitesi"
 POL_committee_of_national_liberation_desc:0 "Almanya ve Rusya arasında sıkışmış, onların emperyalist entrikalarına maruz kalmış tehlikeli bir konumdayız. Ulusal Kurtuluş Komitesi'nin kurulmasıyla, tüm kuşatılmış Polonyalılar direniş faaliyetlerini organize etmek için merkezi bir otoriteye sahip olacak."
 POL_communal_governance:0 "Komünal Yönetim"
 POL_communal_governance_desc:0 "Köylü Savaşı, gerekli olmasına rağmen, kırsalımızda yıkım ve tahribata yol açtı. Şimdi yeniden inşa etme zamanı ve kırsal topluluklarımızda yerel komünal yönetimler kurmak savaşın yaralarını saracaktır."
 POL_complete_plan_east_tt:0 "Eğer zaten tamamlanmamışsa §YBatı Planı§!'na erişim sağlar.\n§YDoğu Planı§! dalındaki odakları daha fazla tamamlamayı engeller."
 POL_complete_plan_west_tt:0 "Eğer zaten tamamlanmamışsa §YDoğu Planı§!'na erişim sağlar.\n§YBatı Planı§! dalındaki odakları daha fazla tamamlamayı engeller."
 POL_complete_the_bermontian_mission:0 "Bermontiya Misyonunu Tamamla"
 POL_complete_the_bermontian_mission_desc:0 "Beyazlarla birlikte savaşma ve Rusya'yı Çar için geri alma misyonumuz, Litvanya'ya başarısız işgalimizle ezildi, ancak şimdi komutamız altında güçlü bir Milletler Topluluğu var. Atlarımıza binmeli ve SSCB'yi küle çevirmeliyiz!"
 POL_cossack_king:0 "Kazak-Kral"
 POL_cossack_king_desc:0 "1918'de, Prens, Kazak ve Savaş Lordu Pavel Bermondt-Avalov'a Rusya'daki Beyazlar için savaşması talimatı verildi, ancak bunun yerine Bermontiyalı ordularını Litvanya ve Letonya'ya karşı çevirdi. Popüler olmamasına ve Katolik olmamasına rağmen, Bermondt Almanların desteğine ve arkasında bir Beyaz Rus ordusu olasılığına sahip."
 POL_dabrowszczacy:0 "Dąbrowszczacy"
 POL_dabrowszczacy_desc:0 "Dünya çapında sosyalist ve demokratik hareketler için savaşan Polonyalı gönüllü kuvvetlerinin uluslararası tugayları var ve şimdi Polonya'nın kontrolünde sosyalist bir hükûmet varken, Polonya devletinin desteğini bu cesur gönüllülerin arkasına alabiliriz."
 POL_declare_independence:0 "Bağımsızlık İlan Et"
 POL_declare_independence_desc:0 "Almanlar [SOV.GetNameDef] tehdidini sona erdirmede yararlı bir araç oldular ama şimdi Polonya'yı zincirler içinde görmek isteyenlere karşı dönme zamanımız geldi. Reich'a saldırma zamanı geldi."
 POL_delay_strike_70_days_tt:0 "§YKöylü Grevi§! bu odak seçildiğinde §Y70 gün§! ertelenecek."
 POL_demand_LIT:0 "Litvanya'yı Talep Et"
 POL_demand_LIT_desc:0 "Litvanya hükûmeti parçalanmış, zayıf ve kötü ekonomik ve askerî liderlikle karakterize edilmiştir. Polonya devleti tebaası olmadan eksiktir ve belki de sadece talep ederek Litvanyalılar birleşmeyi kabul edecektir."
 POL_demand_LIT_pavel:0 "Litvanya'yı Talep Et"
 POL_demand_LIT_pavel_desc:0 "Geçen sefer, Bermontiyalılar Litvanya'yı ilhak edemediler, ama şimdi arkasında Polonya ordusu varken, Pavel o kadar güçlü bir konumda ki Litvanyalıları kendilerini gümüş bir tepside sunmaya kadar korkutabilir. Bir Kral, Krallığı için yalvarmaz ve dilenmez, hakkı olduğu gibi alır."
 POL_demand_pomerania:0 "Pomeranya'yı Talep Et"
 POL_demand_pomerania_desc:0 "Pomeranya bir zamanlar Polonya devletinin bir parçasıydı ve şimdi Almanların elinde. Çok az kişi bir şansımız olduğuna inansa da, zarı atmalı ve bizim olanı almalıyız."
 POL_demand_slovakia:0 "Slovakya'yı Talep Et"
 POL_demand_slovakia_desc:0 "Çekoslovakya zayıf ve toprakları komşularının gıpta ettiği bir yer. Eğer Almanlar sadece sorarak Sudeten'i alabiliyorsa, biz de Slovakya'yı aynı şekilde alamaz mıyız?"
 POL_demand_slovakia_pavel:0 "Slovakya'yı Talep Et"
 POL_demand_slovakia_pavel_desc:0 "Çekoslovakya zayıf ve toprakları komşularının gıpta ettiği bir yer. Eğer Almanlar sadece sorarak Sudeten'i alabiliyorsa, biz de Slovakya'yı aynı şekilde alamaz mıyız?"
 POL_demand_yugoslav_subjugation:0 "Yugoslav Boyunduruğunu Talep Et"
 POL_demand_yugoslav_subjugation_desc:0 "Pan-Slav birleşmesi arzumuzun gerçekleşmesi için Güney Slavlarını ihmal etmemeliyiz. Aramızda ulusal sınırlar ve büyük dağlar dursa da, hepimiz aynı Slav'ız."
 POL_dismantle_capitalist_empires:0 "Kapitalist İmparatorlukları Dağıt"
 POL_dismantle_capitalist_empires_desc:0 "Kapitalizm, sosyalizmin doğal düşmanıdır ve şimdi devrim Polonya'da zafer kazandığına göre, konumumuzu tüm sömürge imparatorluklarının tamamen dağıtılmasıyla başlayarak dünya çapında kapitalist emperyalizmi dağıtmak için bir araç olarak kullanmalıyız."
 POL_dismantle_fascist_empires:0 "Faşist İmparatorlukları Dağıt"
 POL_dismantle_fascist_empires_desc:0 "Faşizm dünya için bir beladır. Sınıf mücadelesi dilini, proletaryayı sınır ötesindeki yoldaşlarına karşı çevirmek için kullanırlar. Onlar KPP'nin yeminli düşmanlarıdır ve hızla bertaraf edilmelidirler."
 POL_dismantle_soviet_empire:0 "[SOV.GetAdjective] İmparatorluğunu Dağıt"
 POL_dismantle_soviet_empire_desc:0 "[GetDismantleSovietEmpireDesc]"
 POL_dismantle_soviet_empire_desc_alt:0 "SSCB'nin kırmızı boyası döküldü ve şimdi [SOV.GetNameDef]'in gerçek renklerini görebiliyoruz, bu yüzden emperyal hırsları her zamankinden daha açık. Polonya'nın bir düşmanı olarak, çok geç olmadan onunla başa çıkılmalıdır."
 POL_dismantle_soviet_empire_desc_default:0 "[SOV.GetNameDefCap] kendine bağımsız cumhuriyetler federasyonu diyor, ama kırmızı bir boya tabakasıyla Rus İmparatorluğu'ndan biraz daha fazlası. Tüm imparatorluklar gibi, Polonya'nın düşmanıdır."
 POL_divide_lit:0 "Litvanya'yı Böl"
 POL_divide_lit_desc:0 "Biz Milletler Topluluğu'nun restorasyonunu istiyoruz, Almanlar Memel'i istiyor, belki de karşılıklı bir anlaşmaya varabilir ve Litvanyalılara ortak bir ültimatom verebiliriz."
 POL_ease_sanationist_tensions:0 "Sanasyon Gerilimlerini Yatıştır"
 POL_ease_sanationist_tensions_desc:0 "Morges Cephesi'nin birçok üyesi Sanasyon içinde yüksek rütbeli askerî pozisyonlarda bulunuyor ve belki de onları siyasi sermayelerini hükûmetin greve yönelik baskılarını engellemek için kullanmaya ikna edebiliriz, bu da bize Polonya içindeki hareketimizi büyütmek için hayati zaman kazandırır."
 POL_elect_a_PSL_leader:0 "Bir PSL Lideri Seç"
 POL_elect_a_PSL_leader_desc:0 "Komünistler hükûmetimizde güç için yarışsa da, ordu PSL'yi destekliyor. Liderliğimizi şimdi sağlamlaştırırsak, KPP hükûmetin kontrolünü ele geçiremez."
 POL_empower_falangist_militants:0 "Falanjist Militanları Güçlendir"
 POL_empower_falangist_militants_desc:0 "Falanjistler arasında Komünistlerle kaçınılmaz savaşa hazırlanmak için silahlanan bir dizi paramiliter örgüt var. Hükûmet desteğiyle, bu hevesliler Falanjist partinin müthiş bir silahlı kanadına dönüşürdü."
 POL_empower_the_morges:0 "Morges'i Güçlendir"
 POL_empower_the_morges_desc:0 "Morges Cephesi, demokrasiye bir müttefik olduğunu kanıtladı ve şimdiye kadar başardığımız hiçbir şey onların desteği olmadan mümkün olmazdı. Belki de bu generaller ordunun kendi kollarını yönetme hakkını kazanmışlardır."
 POL_expand_lithuanian_shipyards:0 "Litvanya Tersanelerini Genişlet"
 POL_expand_lithuanian_shipyards_desc:0 "Artık Gdynia ve Gdansk limanlarıyla sınırlı kalmamalıyız. Litvanya kontrolümüz altındayken, deniz kapasitemizi büyük ölçüde genişletme ve Baltık Denizi'nde hakimiyet için rekabet etme fırsatı verildi."
 POL_falangist_international:0 "Falanjist Enternasyonal"
 POL_falangist_international_desc:0 "Nazizm ve İtalyan Faşizmine karşı durmak bizi savunmasız bir konuma sokuyor, ancak Almanlara karşı mücadelemizde müttefikler aramalıyız. Belki de Falanjizmi bir alternatif olarak sunarak, benzer düşünen uluslardan bir ittifak kurabiliriz."
 POL_find_a_king_tt:0 "§YBu odak tamamlandığında§!, Polonya tahtı için potansiyel adaylar [Root.GetFlag] §YPolonya§!'nın §YKralı§! olmak için §Yolay§! yoluyla kendilerini sunacaklardır.\nBir aday seçildiğinde, uygun odak §Ytamamlanacaktır§!."
 POL_force_polish_upper_class:0 "Bir Polonyalı Üst Sınıfı Teşvik Et"
 POL_force_polish_upper_class_desc:0 "Yakın zamanda özgürleşmiş genç bir ulus olarak, birçok Polonyalı toplumun sadece alt ekonomik katmanlarını işgal ediyor. Neredeyse doğumdan itibaren ülkeyi yönetmek için eğitilmiş bir elit sınıf yaratmazsak ulusumuz dayanamaz."
 POL_fulfil_fifth_of_november:0 "5 Kasım Yasasını Yerine Getir"
 POL_fulfil_fifth_of_november_desc:0 "Naiplik konseyi yeniden toplandığına göre, Polonya tahtını talep etmeye çalışan tüm kraliyet başvuru sahiplerine kapıları açma zamanı geldi."
 POL_german_staff:0 "Volksdeutscher Selbstschutz"
 POL_german_staff_desc:0 "Polonya'nın hatırı sayılır bir Alman azınlığı var ve Almanlar bu genç adamları bize karşı kullanmaya çalışsa da, Almanya ile mevcut işbirliği durumumuz Polonya'daki Alman topluluklarını davamıza daha dostane hale getirebilir."
 POL_german_training:0 "Alman Askerî Personeli"
 POL_german_training_desc:0 "Alman “ortaklarımız” askerî sırlarını oldukça sıkı tutuyorlar, ama belki de onları bazı iç askerî işlerimizi yönetmeye davet ederek, bize bazı askerî sırları sızdırmaktan başka seçenekleri kalmaz."
 POL_governorate_livonia:0 "Livonya Genel Valiliği"
 POL_governorate_livonia_desc:0 "Pavel onca yıl önce Litvanya ve Letonya'yı işgal ettiğinde, Livonya Genel Valiliği'ni kendi kişisel tımarı olarak geri alma konumundaydı. Şimdi, Letonya zayıf ve Polonya'nın gücü Pavel'in arkasında, Livonya Genel Valiliği'nin restorasyonunu durduracak çok az şey var."
 POL_greater_commonwealth:0 "Büyük Milletler Topluluğu"
 POL_greater_commonwealth_desc:0 "Milletler Topluluğu'nun hırsları, uzun zamandır kaybolmuş Krallığın sadece tarihi sınırlarının çok ötesine uzanıyor. Polonyalıların kalbindeki Milletler Topluluğu, büyük bir emperyal güç, denizden denize parlayan çok kültürlü bir imparatorluktur!"
 POL_greater_polish_SSR:0 "Büyük Polonya SSC"
 POL_greater_polish_SSR_desc:0 "Şimdiye kadar SSCB için yararlı olduğumuzu kanıtladık ve Doğu Polonya'nın kontrolünün ulusumuza geri verilmesini talep etmek akıllıca olacaktır, devrim için sağladığımız büyük hizmetler için bir miktar tazminatla birlikte."
 POL_habsburg:0 "Habsburg"
 POL_habsburg_desc:0 "Karl Albrecht von Habsburg bir Polonya vatanseveridir ve neyse ki bir kraliyet mensubudur. Belki de onu doğumundan beri hazırlandığı tahta çıkmaya davet etmeliyiz."
 POL_habsburg_monarchist_militants:0 "Habsburg Militanlarını Silahlandır"
 POL_habsburg_monarchist_militants_desc:0 "Çekoslovakya'da mutlak kalıtsal yönetimin geri dönüşünü özleyenler var ve tek yapmamız gereken onlara silah vermek ve onlar da Habsburg davasını zorla destekleyecekler!"
 POL_hohenzollern:0 "Hohenzollern"
 POL_hohenzollern_desc:0 "Almanlar, yeni Polonya Krallığı'nı yönetmek için bir Hohenzollern tasavvur ettiler ve Romanya ile yakın diplomatik bağlarımız, Rumen kraliyet ailesini Polonya'nın kralı olmak için ideal adaylar haline getiriyor."
 POL_hungary_exists_no_vojvodina_tt:0 "§Y$HUN$§! $TRIGGER_EXISTS$"
 POL_hungary_scope_no_vojvodina_tt:0 "@HUN §Y$HUN$§!:"
 POL_institute_royal_guards:0 "Kraliyet Muhafızlarını Kur"
 POL_institute_royal_guards_desc:0 "Tahtta oturan bir hükümdar varken, sevgili hükümdarımızın kişisel korunmasıyla görevlendirilecek Polonya ordusu saflarındaki en seçkinleri bulmamız hayati önem taşımaktadır."
 POL_integrate_greater_kashubia:0 "Pomeranya'yı Entegre Et"
 POL_integrate_greater_kashubia_desc:0 "Slav Kaşup halkı, Pomeranya'nın tamamını uluslarının haklı sınırları olarak görüyor ve birçok Polonyalı da onu haklı Polonya toprağı olarak görüyor. Topraklar şimdi elimizdeyken, tek yapmamız gereken onu hükûmetimize entegre etmek ve Doğu Almanya Batı Polonya olacak."
 POL_integrate_the_endecja:0 "Endecja'yı Entegre Et"
 POL_integrate_the_endecja_desc:0 "Ulusal-Demokratik partinin Siódemki kolu Sanacja ile bir koalisyon kurmak için müzakere masasında olsa da, partinin çoğunluğu hala karşı çıkıyor. Endecja'nın kilit üyelerini hükûmete davet ederek, Polonya Milliyetçiliği altında birleşmiş bir hükûmet kurabiliriz."
 POL_integrate_the_falanga:0 "Falanga'yı Entegre Et"
 POL_integrate_the_falanga_desc:0 "ONR-Falanga şiddetli ve yıkıcı bir örgüttür, ancak hükûmet içindeki artan milliyetçilik Falanjistleri Polonya'nın geleceği için bizimle birleşmeye teşvik edebilir."
 POL_interacting_with_peasants_flag:0 "Bir Köylü Grevi kararı aktif"
 POL_internal_romanian_support:0 "İç Rumen Desteği Ara"
 POL_internal_romanian_support_desc:0 "Romanya Kralı, aşırı harcamaları ve yolsuzluğuyla ülkeyi yıkımın eşiğine sürüklüyor. Bu talihsiz bir durum, ancak Kral Michael'ın Romanya'nın hayatta kalmasını sağlamak için babasının aleyhtarlarıyla işbirliği yapmaktan başka seçeneği olmayabilir."
 POL_invest_in_the_peasantry:0 "Köylü Topluluklarına Yatırım Yap"
 POL_invest_in_the_peasantry_desc:0 "Köylüler, kırsaldaki yaşamı iyileştireceğimiz vaadiyle bizim için savaştılar ve bu sözü yerine getirmeye niyetliyiz. Uygun demiryolu ve altyapı ağları, kimsenin geride kalmamasını sağlayacaktır."
 POL_invite_exiled_nobility:0 "Sürgündeki Soyluları Davet Et"
 POL_invite_exiled_nobility_desc:0 "Birçok Rus soylusu Kral Anastasia'mızın haklı mirasını tanımayı reddetse de, onları soylu unvanları vaadiyle geri davet etmek, pozisyonlarını değiştirmeye ve onu Çar II. Nikolay'ın yaşayan tek gerçek doğumlu kızı olarak tanımaya teşvik edebilir."
 POL_invite_romania_to_morges:0 "Romanya'yı Pakta Davet Et"
 POL_invite_romania_to_morges_desc:0 "Tek başına bir Fransız-Polonya ittifakı, Mihver güçlerinin tam gücüne dayanmak için yeterli değildir. İttifakımızı denizler arasına genişletmeliyiz."
 POL_invite_the_baltics:0 "Baltıkları Davet Et"
 POL_invite_the_baltics_desc:0 "Bolşevik işgali riski altındaki çoğunlukla Katolik uluslar olarak, Baltıklar Falanjist davasına doğal müttefiklerdir ve korunmalıdırlar."
 POL_invite_the_lowlands:0 "Aşağı Ülkeleri Davet Et"
 POL_invite_the_lowlands_desc:0 "Benelüks'te Falanjizm siyasi olarak marjinal olsa da, zaman ve kaynaklara yapılacak ılımlı bir yatırım, onları bu ülkelerle bir ittifakı mümkün kılacak kadar ana akım haline getirebilir."
 POL_join_CZE_industry:0 "Çek Sanayisine Katıl"
 POL_join_CZE_industry_desc:0 "Bohemya ve Polonya sanayileri bağlantısız ve uyumsuz, şimdi birleşmiş uluslarımızdan en iyi şekilde yararlanmak için bunu düzeltmek için çalışmalıyız."
 POL_join_CZE_military:0 "Çek Ordusuna Katıl"
 POL_join_CZE_military_desc:0 "Askerî sanayilerimiz ayrılmış ve birleşik bir davadan yoksun, Çek sanayi kompleksini Polonya silahlı kuvvetlerine değerlendirmeli ve entegre etmeliyiz."
 POL_join_CZE_rails:0 "Demiryollarını Birleştir"
 POL_join_CZE_rails_desc:0 "Sudeten dağlarından malzeme geçirmek maliyetli ve verimsiz bir iştir. Yeni ulusumuzun tamamını savunacaksak, demiryollarımızın kilit alanlarını birleştirmeliyiz."
 POL_keep_looking_tt:0 "§YTaht için diğer adayları değerlendireceğiz§!."
 POL_keep_resistance_low_tt:0 "Eğer §Y[POL.GetNameWithFlag]§!'daki §RDireniş§! §R%50 veya daha yüksekse§!, §Y[POL.GetNameWithFlag]§! §RVarşova Ayaklanmasını§! başlatabilecektir!!"
 POL_king_michaels_coup:0 "Kral Michael'in Darbesi"
 POL_king_michaels_coup_desc:0 "Kral Michael'ın mevcut Rumen hükûmetini gasp etme ve doğum hakkı olduğu üzere kendini Kral olarak taçlandırma zamanı geldi. Bir zamanlar müttefik olan Polonya ve Romanya şimdi tek olarak birleşecek."
 POL_king_of_bohemia:0 "Bohemya Kralı"
 POL_king_of_bohemia_desc:0 "Çekoslovakya'da monarşist duygu yüksek; tek yapmamız gereken Bohemya tahtı üzerindeki iddiamızı ileri sürmek ve Çek hükûmeti şüphesiz taleplerimize boyun eğecektir."
 POL_king_of_lithuania:0 "Litvanya Krallığı"
 POL_king_of_lithuania_desc:0 "Zamanı geldi; Litvanya halkı [LIT.GetLeader]'e karşı kışkırtıldı ve monarşist destekçiler hükûmete taleplerini iletmeye hazır. Polonya desteğiyle, [Root.GetLeader]'i Tanrı tarafından atanmış hükümdarları olarak görecekler."
 POL_kings_guard:0 "Kralın Muhafızları"
 POL_kings_guard_desc:0 "Kralın askerî liderlik hırsları var ve onun için kendi kişisel kraliyet muhafızından daha iyi kim liderlik edebilir?"
 POL_konfederacja_narodu:0 "Konfederacja Narodu"
 POL_konfederacja_narodu_desc:0 "Konfederacja Narodu, Polonya'yı işgal etmeye yönelik herhangi bir Alman çabasına karşı çıkan küçük bir Polonyalı milliyetçi grubudur. Belki de Almanlara karşı çıkma niyetimizi açıklayarak, bu militanlar davamızla aynı hizaya gelebilir."
 POL_leftist_economics:0 "Sosyalist Bir Ekonomi Kur"
 POL_leftist_economics_desc:0 "Kapitalist bir ekonomide, sermaye seçkinlere hizmet etmek için vardır. Şimdi hükûmette sosyalistler varken, ekonomiyi bu devrim için kan döken köylülerin ihtiyaçlarına hizmet etmek üzere yeniden düzenlemeliyiz."
 POL_lithuanian_rail:0 "Polonya-Litvanya Demiryolları"
 POL_lithuanian_rail_desc:0 "Eğer Polonya ve Litvanya gerçekten birleşecekse, birlik arasındaki seyahat önemsiz bir mesele olmalıdır. Demiryollarımızı birleştirerek, tedarik zincirlerimizi ve endüstriyel kapasitemizi büyük ölçüde geliştireceğiz."
 POL_lower_class_education:0 "Alt Sınıf Eğitimi"
 POL_lower_class_education_desc:0 "Çok uzun zamandır eğitime erişim zenginlik ve ayrıcalık tarafından engellendi, ancak sosyalizm altında, birinin kişisel sermaye sahipliği eğitim sistemi için alakasız hale geliyor."
 POL_merge_civilian_industries:0 "Sivil Sanayileri Birleştir"
 POL_merge_civilian_industries_desc:0 "Uluslarımız artık birleştiğine göre, Litvanya'nın sadece Litvanya için ve Polonya'nın sadece Polonya için inşa etmesi pek mantıklı değil. Sanayilerimiz, ulusun iyiliği için bir olmalıdır."
 POL_merge_internal_governments:0 "İç Hükûmetleri Birleştir"
 POL_merge_internal_governments_desc:0 "Polonya ve Romanya'nın şimdi hükûmetlerinin başında aynı hükümdar olmasına rağmen, hala iç hükûmetleri tarafından ayrılmış durumdalar. Rumen yerlilere Sejm'de temsilciler sunmalı ve diğer tüm Rumen idarelerini Polonyalı eşdeğerleriyle birleştirmeliyiz."
 POL_merge_the_arms_industries:0 "Silah Sanayilerini Birleştir"
 POL_merge_the_arms_industries_desc:0 "Polonyalı ve Litvanyalı silah üreticileri on yıllardır ayrı ayrı silah üretiyorlardı, ancak şimdi uluslarımız bir olduğuna göre, sanayilerimizi uzmanlaştırma ve Polonyalı ve Litvanyalı fabrikalar arasında işbirliği yaratma fırsatımız var."
 POL_morges_divisions_tt:0 "§Y8 Piyade§! taburlu ve §YDestek Topçusu§! olan 3 birlik kazan.\n"
 POL_morges_economic_union:0 "Fransız-Polonya Ekonomik Paktı"
 POL_morges_economic_union_desc:0 "Fransa ve Polonya arasındaki ilişkiler güçlendiğine göre, savaş zamanlarında karşılıklı ekonomik yardım sağlayabiliriz."
 POL_morges_pact:0 "Morges Paktı"
 POL_morges_pact_desc:0 "Polonya'da demokrasi yeniden tesis edildiğine göre, Morges Cephesi'nin hırsları neredeyse tamamlandı. Geriye kalan tek şey Fransa ile ilişkimizi güçlendirmek ve Fransız-Polonya ittifakını yeniden kurmak."
 POL_motors_become_free_tt:0 "Yabancı motor şirketleri artık tüketim mallarına mal olmuyor."
 POL_nationalist_constitution:0 "Milliyetçi Bir Anayasa"
 POL_nationalist_constitution_desc:0 "Nisan Anayasası henüz Polonya kimliğini sağlamlaştıramadı, ancak Ulusal Demokrat Parti ve Falanjist Parti'nin bazı üyeleri, ulusumuzun kimliğini her şeyin üstüne koymak için anayasayı değiştirme konusunda desteklerini sundular."
 POL_niech_zyje_opor:0 "W imieniu Polski Podziemnej"
 POL_niech_zyje_opor_desc:0 "Polonya'nın her yerinde isyan ve özgürlük fısıltıları var. Kiliselerimizde ve yeraltında, cesur ve vatansever Polonyalılar bağımsız bir Polonya devleti kurmak istiyor ve doğru provokasyon ve ekipmanla, Varşova'nın kendini özgürleştirdiğini görebiliriz!"
 POL_niech_zyje_opor_no_mtg:0 "$POL_niech_zyje_opor$"
 POL_niech_zyje_opor_no_mtg_desc:0 "$POL_niech_zyje_opor_desc$"
 POL_non_discriminatory_recruitment:0 "Ayrımcı İşe Alımı Kaldır"
 POL_non_discriminatory_recruitment_desc:0 "Polonyalı Katolikler, Sanasyon politikaları nedeniyle silahlı kuvvetlerimizde orantısız bir şekilde fazla temsil ediliyor. Bundan sonra, silahını faşizme doğrultmaya istekli her vatansever veya sosyaliste yer vereceğiz."
 POL_organize_the_peasants_strike:0 "Köylü Grevini Organize Et"
 POL_organize_the_peasants_strike_desc:0 "Polonya köylülerin kanıyla bölünmüş durumda. Polonya kırsalının her yerinde, köylüler kötü niyetli hükûmet ihmali tarafından radikalleştiriliyor. [POL.GetLeader] kaçınılmaz olarak grevleri şiddete sürükleyecek, bu yüzden proletaryayı zalimlerine karşı ayaklanmaya hazırlamalıyız."
 POL_pan_slavism:0 "Pan-Slav Revizyonizmi"
 POL_pan_slavism_desc:0 "Pan-Slav hareketi şimdiye kadar Rusların tüm Slavlar üzerinde hegemonya iddia etmesi için yararlı bir araçtan biraz daha fazlasıydı, ancak aynı zamanda Yugoslavya ve Çekoslovakya gibi dağınık Slav halklarını birleşik devletlere birleştirmede de yararlı oldu. O zaman Polonya neden bir istisna olsun ki? Polonya da bu Pan-Slavizm dalgasından yararlanmamalı mı?"
 POL_peasant_division_tt:0 "§Y6 Piyade§! taburlu 4 birlik kazan.\n"
 POL_polish_path_to_socialism:0 "Sosyalizme Giden Polonya Yolu"
 POL_polish_path_to_socialism_desc:0 "1918'deki kuruluşundan bu yana, Polonya Komünist Partisi Bolşevizasyona maruz kaldı ve şimdi üyelerinin birçoğu Stalin'in uşaklarından biraz daha fazlası. Ancak, Maria Koszutska ve bir dizi diğer önde gelen KPP üyesi, partiden Stalinist unsurları çıkarmayı ve Polonya'yı Moskova'ya karşı çevirmeyi amaçlıyor."
 POL_polish_peoples_republic:0 "Polonya Sovyet Sosyalist Cumhuriyeti"
 POL_polish_peoples_republic_desc:0 "[GetSovietPolishPeoplesRepublicDesc]"
 POL_polish_peoples_republic_desc_alt:0 "Polonya, göreceli sanayileşmesi ve farklı ideolojisi sayesinde [SOV.GetAdjective] nüfuz alanındaki diğer ülkelerden ayrılıyor, bu yüzden daha yüksek bir özerklik derecesinden yararlanmamız doğaldır."
 POL_polish_peoples_republic_desc_default:0 "Polonya, SSCB üye devletleri arasında en sanayileşmiş ve bağımsız olarak güçlü olanlardan biridir, bu yüzden daha yüksek bir özerklik derecesinden yararlanmamız doğaldır."
 POL_polish_shock_battallions:0 "Uderzeniowe Bataliony Kadrowe"
 POL_polish_shock_battallions_desc:0 "Özel olarak eğitilmiş şok taburları olan Uderzeniowe Bataliony Kadrowe, Varşova'yı düşman elinden uzak tutmak için ölmeye hazır Konfederacja Narodu'nun silahlı bir kanadıdır."
 POL_prepare_german_line:0 "Alman Hattını Hazırla"
 POL_prepare_german_line_desc:0 "Almanya'ya karşı olan sınır, ulusumuzun en savunmasız kısmıdır. Eğer Varşova'yı Almanların elinden uzak tutacaksak, onlarla doğrudan sınırda buluşmalı ve irademizi kırmaya çalışırken gülmeliyiz."
 POL_preserve_baltic_independence:0 "Baltık Bağımsızlığını Koru"
 POL_preserve_baltic_independence_desc:0 "Baltık hükûmetleri büyük ölçüde antidemokratik ve kapitalist olsalar da, bizim gibi Doğu ve Batı'dan tehditlerle karşı karşıyalar ve onların burjuva diktatörlüklerini sürdürmek, Almanya ve Rusya'nın emperyalist hırslarına düşmelerini görmekten daha iyidir."
 POL_preserve_bougoise_democracy:0 "Burjuva Demokrasisini Koru"
 POL_preserve_bougoise_democracy_desc:0 "KPP'nin nihai hedefi dünya çapında sosyalizmi yaymak olsa da, bu karanlık zamanlarda yükselen küresel faşizm, burjuva demokrasisini korumak için kapitalistlerle birlikte savaşmamızı zorunlu kılıyor. Sadece faşizmden arınmış bir dünyada maddi koşullar küresel bir sosyalist devrimi kolaylaştırır."
 POL_press_for_liberia:0 "Liberya İçin Baskı Yap"
 POL_press_for_liberia_desc:0 "1932'de Polonya ve Liberya hükûmetleri, Liberya'yı Polonya'nın velayeti altına alma konusunda anlaştılar. Amerikalılar, Liberya'daki varlığımızı bir hakaret olarak görüyorlar, ancak ulus savunmasız ve Polonya korumasına şiddetle ihtiyaç duyuyor."
 POL_press_the_habsburg_claim:0 "Habsburg İddiasını İleri Sür"
 POL_press_the_habsburg_claim_desc:0 "Macaristan çok uzun zamandır Kralsız kaldı ve Arşidük Otto von Habsburg kendi diyebileceği bir taht olmadan kaldı. Akrabamızın taht üzerindeki iddiasını ileri sürmeli ve Avrupa'da Habsburg yönetimini güvence altına almalıyız!"
 POL_pressure_for_the_west:0 "Batı İçin Baskı Yap"
 POL_pressure_for_the_west_desc:0 "Polonya ile Almanya arasındaki kesin sınırlar, Büyük Savaş'ı takip eden on yıllarda bir tartışma konusuydu. Bu tartışmada Almanlar sanayi merkezlerinin çoğunu elinde tuttu ve Polonya'ya bir sanayiye benzer çok az şey bıraktı. Doğu [SOV.GetNameDef]'e teslim edildiğinde, bu toprakların Silezya ve Pomeranya ile değiştirilmesi gerekiyor."
 POL_privatize_education:0 "Yabancı İşletmelere El Koy"
 POL_privatize_education_desc:0 "Yabancı yatırımcılar bizim için oldukça yararlı olsa da, kurdukları işletmeler Polonya'nın elinde çok daha iyi olurdu. Bu, asıl sahiplerini üzecektir, ancak bu gerekli bir vatanseverlik eylemidir."
 POL_pro_allied_government:0 "Müttefik Yanlısı Bir Hükûmet Ata"
 POL_pro_allied_government_desc:0 "Birçok Sejmik zaten Polonya'nın Batı ile uyumunu sürdürmekten yana ve bu temsilcileri yönetimde daha yüksek rütbelere terfi ettirerek, kendimizi Müttefiklerin davasına daha açık bir şekilde dostane hale getiriyoruz."
 POL_proclaim_slavic_unity:0 "Slav Birliğini İlan Et"
 POL_proclaim_slavic_unity_desc:0 "Tüm Rus ve Polonya toprakları kontrolümüz altındayken, bizden önce hiçbir Çar'ın başaramadığını başarma şansımız var. Hem Rusların hem de Polonyalıların rızası ve onayıyla, Slav halklarının birleşmesini ilan edebiliriz."
 POL_push_for_ruthenia:0 "Ruthenia Boyunca İlerle"
 POL_push_for_ruthenia_desc:0 "Ukrayna ve Belarus'un demiryolu ağları ne yazık ki ihmal edildi, ancak bu topraklar da Milletler Topluluğu'nun diğerleri kadar bir parçasıdır. Sovyetlerin içinden geçip bizim olanı geri alacaksak, Doğu raylarına yatırım yapmalıyız."
 POL_radicalize_poles_in_germany:0 "Almanya'daki Polonyalı Militanları Radikalleştir"
 POL_radicalize_poles_in_germany_desc:0 "Almanya'nın her yerinde radikalleşmeye hazır Polonyalı azınlıklar var. Belki onlara Almanya'nın Polonya için tasarımlarını açıklarsak, davamızla uyum için hazırlanmış bir militanlığa kışkırtılırlar."
 POL_raise_the_black_madonna:0 "Siyah Madonna'yı Yücelt"
 POL_raise_the_black_madonna_desc:0 "Siyah Madonna, Polonya'nın ve alt sınıflarının koruyucusu olarak Polonya'nın alt sınıfları arasında popüler olan Kutsal Bakire'nin kutsal bir portresidir. Siyah Madonna'yı hareketimizin sembolü olarak benimseyerek, zamanı geldiğinde halkımız Kutsal Bakire'nin bizim tarafımızda olduğunu bilecek."
 POL_reach_out_to_underground_state:0 "Yeraltı Devletine Ulaş"
 POL_reach_out_to_underground_state_desc:0 "Polonya Yeraltı Devleti, kapalı kapılar ardında gizlice faaliyet gösteriyor. Onlara ulaşarak ve desteğimizi vererek, bir gün eski efendilerimizi alt etmeyi umabiliriz."
 POL_reassemble_the_sejm:0 "Sejm'i Yeniden Topla"
 POL_reassemble_the_sejm_desc:0 "Polonya'da demokratik uygulamalar yeniden tesis edildiğine göre, Sanasyon tarafından dışlanan Sejmik'leri hükûmete yeniden davet etme zamanı geldi."
 POL_reassert_silesian_claims:0 "Silezya Hak İddialarını Yeniden İleri Sür"
 POL_reassert_silesian_claims_desc:0 "Silezya'nın kaderi, Polonya Cumhuriyeti'nin ilk günlerinde büyük bir çekişme noktasıydı ve o zamanki hükûmet Silezya'nın çoğunluğunu devretmeyi ve nispeten küçük olan Yukarı Silezya ile yetinmeyi kabul etti. Güçlü bir hükûmet böyle bir taviz vermezdi ve iddiamız ileri sürülmelidir."
 POL_reclaim_west_slavia:0 "Batı Slavya'yı Geri Al"
 POL_reclaim_west_slavia_desc:0 "Kaşuplar, Polabyalılar ve Sorblar da Batı-Slav halklarıdır ve yine de birçoğu sınırlarımızın ve nüfuzumuzun ötesinde kalmaktadır. Eğer Batı Slav halkının koruyucuları olacaksak, tüm Batı Slav Halkını korumalıyız."
 POL_remove_colony_purchase_tt:0 "Kararı kaldır: §Y[POL_colony_purchase.GetName] Satın Al§!"
 POL_reopen_national_elections:0 "Ulusal Seçimleri Yeniden Aç"
 POL_reopen_national_elections_desc:0 "Endecja'nın hedefi, aynı anda hükûmetin Polonya milliyetçiliğinin çıkarlarına hizmet etmesini sağlarken Polonya'da demokrasiyi yeniden tesis etmektir. Seçimleri yeniden açmalıyız, ancak vatansever olmayan partilerin oy pusulasında olamayacağı bir şekilde."
 POL_reopen_the_maritime_and_colonial_league:0 "Polonya Sömürge Birliğini Yeniden Aç"
 POL_reopen_the_maritime_and_colonial_league_desc:0 "Kıtalararası Polonya varlığı hırsları, Polonya'nın Filistin'i elde etme başarısızlığıyla sona erdi, ancak yeni yakın Batı bağlantılarımız ve sosyalist bir hükûmetle, sermayemizi sömürgelerin işçilerini yeni Polonya yönetimi altında Avrupalı sömürgecilerden kurtarmak için kullanma konumundayız."
 POL_request_autonomous_status:0 "Özerk Statü Talep Et"
 POL_request_autonomous_status_desc:0 "Alman nüfuzunun ağırlığı altında eziliyoruz, eğer bir geleceğimiz olacaksa daha fazla endüstriyel özerklik talep etmeliyiz."
 POL_restoration_of_the_royal_sejm:0 "Kraliyet Sejm'inin Restorasyonu"
 POL_restoration_of_the_royal_sejm_desc:0 "Polonya Krallığı'nın eski günlerinde, Sejm halkın ve tacın sadık hizmetkarlarıydı. Sejm'in restorasyonu ve İkinci Cumhuriyet'in yıkılmasıyla, tüm Sejmiklerin taca sadık olmasını ve Polonya'yı Sanasyon yönetimine geri döndürmeye çalışmayacaklarını sağlamalıyız."
 POL_restore_bermontians:0 "Bermontiyalıları Geri Getir"
 POL_restore_bermontians_desc:0 "Batı Rusya Gönüllü Ordusu, Pavel Bermondt Avalov başkanlığında Rusya'nın batı topraklarında monarşizmi ve düzeni yeniden kurmayı amaçlayan bir güçtü. Polonya şimdi Pavel'in birincil endişesi olsa da, Rus komünizminin yok edilmesi hala Bermontiya misyonudur ve tüm Beyaz Ruslar bunu Bermontiya Ordusu için savaşma görevleri olarak görmelidir!"
 POL_restore_poland_hungary:0 "Polonya-Macaristan'ı Geri Getir"
 POL_restore_poland_hungary_desc:0 "Yüzyıllar önce, Polonya ve Macaristan taçları birleşmiş ve Doğu Avrupa'nın hakimiyeti ulus için güvence altına alınmıştı. Şimdi, Transilvanya ve Nytria Polonya kontrolündeyken, Polonya-Macaristan mirasını geri almamızı engelleyen tek şey Macaristan'ın varlığını sürdürmesidir."
 POL_restore_poland_hungary_tt:0 "Eğer Macaristan kabul ederse, nominal olarak bağımsız kalırken bizimle bir §YKişisel Birlik§!'e katılacaklar."
 POL_restore_the_diet_of_galicia:0 "Galiçya Diyetini Geri Getir"
 POL_restore_the_diet_of_galicia_desc:0 "Galiçya ve Lodomeria Diyeti, Polonya üzerindeki Habsburg yönetimini temsil ediyordu ve şimdi tahtımızda bir Habsburg oturduğuna göre, diyetin Polonya Diyeti olarak restore edilmesi doğru görünüyor."
 POL_riot_of_37:0 "Varşova Ayaklanması"
 POL_riot_of_37_desc:0 "Sanacja, gücü barışçıl bir şekilde Falanjistlere devretmeyi asla kabul etmeyecektir, ancak Falanjist nüfuzu Sanacja'nın kontrolünün çok ötesine büyüyor. Varşova'daki bir şiddetli gösteri, Falanga'yı ulusun doğrudan kontrolüne geçirmek için yeterli olabilir."
 POL_romanov:0 "Romanov"
 POL_romanov_desc:0 "Beklenmedik bir aday olmasına rağmen, kendine Anastasia Romanov diyen genç bayan, Polonya'nın son hükümdarının Çar II. Nikolay olduğunu ve bu nedenle Polonya üzerindeki iddiasının Tanrı tarafından emredildiğini iddia ediyor."
 POL_royal_dictatorship:0 "Bir Kraliyet Diktatörlüğü Kur"
 POL_royal_dictatorship_desc:0 "Sejm, Kral tarafından alınan herhangi bir kararı veto etme yürütme hakkına sahiptir ve bu şimdiye kadar bize iyi hizmet etmiş olsa da, dünya değişiyor ve bürokrasinin Kralımızın ilahi yönetme hakkının önünde durmasına izin veremeyiz."
 POL_royal_hussars:0 "Kraliyet Hüssarlarını Kur"
 POL_royal_hussars_desc:0 "Kanatlı hüssarlar Polonya'nın en ünlü askerleri arasındaydı ve hüssar muharebesi çağı çoktan sona ermiş olsa da, süvari muharebesi uygulaması Polonya'da güçlü kalmaya devam ediyor ve dünyanın gıptası olmak için sadece biraz desteğe ihtiyacı var."
 POL_royal_officer_corps:0 "Kraliyet Subay Kolordusu"
 POL_royal_officer_corps_desc:0 "Bir Kral ve bir general olarak Karl Albrecht, bir Polonyalı beyefendinin olması gereken her şeyin parlak bir örneği olarak duruyor. Belki de tüm subaylarımız, Kralımızın yaptığı gibi savaş sanatında eğitilmelidir; siperlerde."
 POL_seek_an_alliance_with_kaiser:0 "Kayzer ile İttifak Arayışı"
 POL_seek_an_alliance_with_kaiser_desc:0 "Polonya Krallığı varlığını, Rus işgalindeki Kongre Polonyası'ndan yeni bir Polonya krallığı kurma sözü veren Alman Kayzeri tarafından yapılan bir bildiri olan 5 Kasım Yasası'na borçludur. Kayzer'in Polonya için planlarının ne olduğu henüz bilinmiyor, ancak belki de Alman İmparatorluğu'nun bildirisinin nazik bir hatırlatıcısı, beklenmedik bir ittifak için tohumları ekebilir."
 POL_seek_german_alignment:0 "Almanlarla Uyum Arayışı"
 POL_seek_german_alignment_desc:0 "[GER.GetLeader]'in bir hayranı ve bir Nasyonal Sosyalist olan Pavel, kendini dünyanın faşist güçlerinin bilinen bir müttefiki haline getirdi ve geriye kalan tek şey faşistlere yaklaşıp Bermontiyalı kontrolündeki bir Polonya'yı Mihverlerine kabul edip etmeyeceklerini görmek."
 POL_sideline_the_sanacja:0 "Sanacja'yı Kenara Çek"
 POL_sideline_the_sanacja_desc:0 "Falanga ve Endecja, Polonya hükûmetinde o kadar nüfuzlu hale geldi ki, eğer ikisi daha yakın işbirliği yaparsa, Sanasyoncular önemli siyasi sermaye kaybedebilir ve kendilerini bir darbeye karşı savunmasız bırakabilirler..."
 POL_siodemki:0 "Anayasaları Birleştir"
 POL_siodemki_desc:0 "Sanacja Nisan Anayasasını desteklerken, Endecja onu kendilerininkiyle değiştirmek istiyor. Partilerimiz artık işbirliği içinde olduğuna göre, daha fazla kafa karışıklığına tahammül edemeyiz ve Polonya Cumhuriyeti'nin geleceği için bu rakip vizyonları birleştirmeyi kabul etmeliyiz."
 POL_social_commonwealth:0 "Sosyalist Cumhuriyetler Topluluğu"
 POL_social_commonwealth_desc:0 "Polonya-Litvanya'yı yeniden kurma hırsları devrimimizin hedeflerine aykırı olsa da, Polonya, Litvanya ve Milletler Topluluğu'nun birçok eski üye devletinin ortak bir tarihi ve ortak düşmanları olduğu inkar edilemez. Karşılıklı mücadelelerimiz ışığında, yeni bir Milletler Topluluğu gereklidir; sosyalizm altında işçilerinin güvenliğini ve kurtuluşunu önceliklendiren bir tane."
 POL_soldier_king:0 "Asker Kral"
 POL_soldier_king_desc:0 "Kralımız ülkesi için cephede savaşmayı özlüyor, ancak hükümdarımız olarak onun bu kadar ölümcül bir tehlikeye atılmasına izin veremeyiz. Belki de ona bir mareşal olarak bir pozisyon vererek, savaş açlığını tatmin ederken krizdeki ulusumuza birleştirici bir sembol olarak hizmet edebilir."
 POL_soviet_industry:0 "[GetSovietIndustrialInvestmentTitle]"
 POL_soviet_industry_alt:0 "Sanayi Genişlemesi"
 POL_soviet_industry_default:0 "Sovyet Sanayi Yatırımları"
 POL_soviet_industry_desc:0 "[GetSovietIndustrialInvestmentDesc]"
 POL_soviet_industry_desc_alt:0 "[SOV.GetNameDef]'in ellerinde maruz kaldığımız boyunduruğa rağmen, kendi sanayimizi geliştirmeye devam etmeliyiz. Bir gün zincirlerimizi kırmaya karar verirsek işe yarayabilir."
 POL_soviet_industry_desc_default:0 "SSCB'ye katılmanın bir avantajı, güçlü bir devletler birliğine girmemizdir; artık ulusumuzu yatırımlarla zenginleştiren bir sanayi gücümüz var. Sanayimizin bir kısmı SSCB'nin iyileştirilmesine adanmış olsa da, karşılığında aldığımız sanayi yatırımları üretim kapasitemizi büyük ölçüde artırıyor."
 POL_soviet_military_staff:0 "Sovyet Askerî Personeli"
 POL_soviet_military_staff_desc:0 "İkinci Polonya Cumhuriyeti'nin kurulmasıyla birlikte, birçok solcu Polonyalı general dünya devrimi için savaşmaya devam etmek üzere SSCB'ye kaçtı. Şimdi, iktidarda Sovyet yanlısı bir hükûmet varken, bu cesur sürgünler eve dönebilir."
 POL_state_catholicism:0 "Devlet Katolikliği"
 POL_state_catholicism_desc:0 "Katolik kimliği, Falanjist ideolojinin ayrılmaz bir parçasıdır ve bu nedenle Kilise ve Devlet bir ve aynı olmalıdır."
 POL_state_national_council:0 "Devlet Ulusal Konseyi"
 POL_state_national_council_desc:0 "Sanasyoncuların inançlarını yasalaştırmak için Nisan Anayasası var ve bizim de aynısını yapmamızın zamanı çoktan geçti. Devlet Ulusal Konseyi, Polonya'nın dört bir yanından sosyalist politikacıları bir araya getirerek Sanasyon'un gerici yasalarını düzeltmek için kurulacaktır."
 POL_support_colonial_workers_strikes:0 "Sömürge İşçi Grevlerini Destekle"
 POL_support_colonial_workers_strikes_desc:0 "Avrupa sömürgelerindeki işçiler, kendilerine hiçbir şey vermeyen bir imparatorluğu sürdürmek için efendilerinin ağırlığı altında ezilerek acı çekiyor ve mücadele ediyorlar. Bu işçiler kendilerini özgürleştirmek için gerekli maddi koşullardan yoksunlar ve eğer gerçekten küresel bir devrim getireceksek, ezilenleri sömürgeci seçkinlerine karşı silahlandırmalıyız."
 POL_support_falangists_in_the_americas:0 "Amerikalı Falanjistleri Destekle"
 POL_support_falangists_in_the_americas_desc:0 "Amerika kıtası, özellikle Latin Amerika ülkeleri olmak üzere Falanjist hareketlerle doludur. İttifakımızı Amerika'ya genişletmek, yalnızca dünya çapında Falanjist çıkarları güvence altına almak için değil, aynı zamanda dostlarımızı Amerikan nüfuzundan korumak için de gereklidir."
 POL_support_global_falangism:0 "Küresel Falanjizmi Destekle"
 POL_support_global_falangism_desc:0 "Ulusumuza Falanjizmi getirme mücadelemizde yalnız değiliz. Polonya'nın dört bir yanında dünya çapındaki Falanjist hareketleri desteklemek isteyen gönüllüler var ve devlet bu bireyleri desteklemelidir."
 POL_support_monarchism_in_LIT:0 "Litvanya'da Monarşizmi Destekle"
 POL_support_monarchism_in_LIT_desc:0 "Tıpkı Polonya gibi, Litvanya'nın da kendine yeni bir Kral seçmesi gerekiyordu. Ancak Polonya'nın aksine, adil seçim Almanlar tarafından gayrimeşru ilan edildi, ancak Litvanyalılara vaat edilen güçlü hükümdarı sağlayabiliriz; Litvanya'yı Alman emperyalizminden koruyacak birini."
 POL_support_monarchy_in_CZE:0 "Çekoslovakya'da Monarşizmi Destekle"
 POL_support_monarchy_in_CZE_desc:0 "Çekoslovakya üzerindeki Habsburg yönetimi hızla uzak bir anıya dönüşüyor, ancak şimdi tahtımızda bir Habsburg varken ve Polonya kimliği güçlü dururken, Batı-Slav kimliğini teşvik etme ve Bohemya üzerindeki Habsburg iddiasını ileri sürme konumundayız."
 POL_surrender_the_east:0 "Doğu'yu Teslim Et"
 POL_surrender_the_east_desc:0 "SSCB, Doğu Polonya'yı Ukrayna ve Belarus'un haklı parçaları olarak görüyor ve SSCB de bunları temsil ettiğini iddia ediyor. Belki de bu toprakları Sovyetlere devrederek müttefik olabiliriz."
 POL_the_national_commonwealth:0 "Ulusal Milletler Topluluğu"
 POL_the_national_commonwealth_desc:0 "Eski Milletler Topluluğu, büyük topraklara ve halklara başkanlık eden Polonyalıların bir İmparatorluğuydu. Litvanya elimizdeyken, Polonya İmparatorluğu bir kez daha yeniden doğdu!"
 POL_trust_in_the_west:0 "Batı'ya Güven"
 POL_trust_in_the_west_desc:0 "Avusturya Habsburgları Büyük Savaş'ta batı güçlerine karşı savaşmış olsa da, Polonya Batı'nın bir dostudur. Geçmişte birçok kez olduğu gibi, denizaşırı müttefiklerimizin bize yardım etmeye devam edeceğine güvenmeliyiz."
 POL_underground_conscripts:0 "Yeraltı Askerleri"
 POL_underground_conscripts_desc:0 "Polonya Yeraltı Devleti hücrelerinden askere alma, birliklerimizin zalimlerimize karşı savaşma yeteneğini büyük ölçüde artıracaktır."
 POL_unite_west_slavia:0 "Bohemya ile Birleş"
 POL_unite_west_slavia_desc:0 "Kralımız hem Polonya hem de Bohemya tahtındayken, tek yapmamız gereken Polonya ve Bohemya'nın iç idaresini birleştirmek ve Batı Slavya rüyası gerçekleşmiş olacak."
 POL_warsaw_to_crimea_railway:0 "Varşova'dan Kırım'a Demiryolu"
 POL_warsaw_to_crimea_railway_desc:0 "Denizden denize hükmetme hırsımızda, aldığımız her toprağın ulusumuzun tam entegre bir parçası haline gelmesi hayati önem taşımaktadır. Doğal sınırlarımız Kuzey'den Güney'e, Doğu'dan Batı'ya uzanıyor ve Kırım'ı demiryolumuzla birleştirme hırsı, bölgedeki hakimiyetimizi sağlamlaştıracaktır."
 POL_woo_morges_staff:0 "Morges Cephesini Davet Et"
 POL_woo_morges_staff_desc:0 "İsyanımız, ordunun en azından bir kısmının desteği olmadan bir yere varamaz. Çoğu Sanasyon'un üç kanadından birine sadık kalsa da, Morges Cephesi Polonya'ya demokrasiyi geri getirmekle ilgileniyor ve bu amaçla bizimle işbirliğine dostane olabilir."
 SOV_ARTICLE_124_DESC_COMMUNIST:0 "Marksist-Leninist ideallerin peşinde koşarken dine zulmetmekte... aşırı gayretli olmuş olabiliriz. Belki de Sovyet toplumunda hala bir rolü vardır. Yeni anayasamız, tüm Sovyet vatandaşları için din özgürlüğünü garanti eden bir madde içerecektir."
 SOV_ARTICLE_124_DESC_EXILES:0 "Komünistler sadece kilise ve devleti ayırdıklarını iddia ettiler, ama gerçekte, Kilise'yi insanların hayatlarından çıkarmayı amaçladılar. Yüzyıllardır, Kilise Rus toplumunun ayrılmaz bir parçası olmuştur ve bu yüzden bir kez daha öyle olmalıdır."
 SOV_CHURCH_CANDIDATES_DESC_FASCIST:0 "Toplumumuzdaki dinin önemi küçümsenemez. Devletin bu önceliği kabul etme ve destekleme zamanı geldi - ve kilise ile devletin birleşmesine yönelik ilk adımları atma zamanı."
 SOV_CHURCH_CANDIDATES_DESC_TSARIST:0 "Kilise, Zemsky Sobor'daki gelecekteki seçimlere kendi adaylarını göndermek için izin istedi. Patrikhane'nin Rus toplumundaki önemli rolünü kabul ederek, kabul etmeye karar verdik, bu da Tanrı'nın iradesi ile hükümdarımızın iradesinin gerçek bir birleşme olasılığının yolunu açıyor."
 SOV_CHURCH_CANDIDATES_NAME_FASCIST:0 "Dinî Öncelik"
 SOV_CHURCH_CANDIDATES_NAME_TSARIST:0 "Kilise Adayları"
 SOV_REBUILD_THE_SAVIOR_CATHEDRAL_DESC_COMMUNIST:0 "1931 yılında, gösterişli Kurtarıcı İsa Katedrali, büyük bir \"Sovyetler Sarayı\"na yer açmak için havaya uçuruldu. Savaş hayaleti Avrupa'nın üzerinde belirirken, bu devi inşa edecek kaynaklara sahip olmamız pek mümkün değil. Eski Katedralin restore edilmesi, nüfusumuzun dini kesimleri için uygun bir zeytin dalı olacaktır."
 SOV_REBUILD_THE_SAVIOR_CATHEDRAL_DESC_EXILES:0 "1931 yılında, güzel Kurtarıcı İsa Katedrali, cafcaflı bir \"Sovyetler Sarayı\"na yer açmak için havaya uçuruldu. Eşitlik fikri üzerine inşa edildiği varsayılan bir toplumun tam olarak neden bir Saray'a ihtiyaç duyacağı açık bir soru olarak kalıyor. Artık iktidara döndüğümüze göre, bu korkunç suçu geri almalı ve Katedralin yeniden inşasına başlamalıyız."
 SOV_REFORMALIZE_THE_ROLE_OF_THE_PATRIARCHATE_DESC_COMMUNIST:0 "Madde 124 ile atılan ilk adımlardan bu yana, Birliğimizdeki Kilise'nin konumu çok yol kat etti. Sovyet toplumundan çıkarılamayacağı açıktır - bu yüzden belki de onu benimsemeli ve bir kez daha Sovyet İşçisi'nin hayatında merkezi bir yer vermeliyiz."
 SOV_REFORMALIZE_THE_ROLE_OF_THE_PATRIARCHATE_DESC_EXILES:0 "Çok uzun zamandır Patrikhane Komünizmin gölgelerine itildi. Bir kez daha Rus toplumunun ve kültürünün merkezindeki haklı yerini resmen alma zamanı geldi."
 SOV_THE_DECLARATION_DESC_COMMUNIST:0 "1927'deki ünlü 'Deklarasyonu'nda Patrik Sergius, kilise ve devlet arasındaki dinî farklılıklara rağmen Sovyetler Birliği'ne sadakat yemini etti. Belki de bu deklarasyonu destekleyen çeşitli Metropolitlerin daha kamusal bir rol oynamalarına izin verme zamanı gelmiştir."
 SOV_THE_DECLARATION_DESC_EXILES:0 "Patrik Sergius'un 1927'deki kötü şöhretli 'Deklarasyonu', dinî farklılıklarına rağmen Sovyetler Birliği'ne sadakat yemini etti. Bu korkakça eyleme rağmen, Rus Ortodoks Kilisesi'nin altyapısı bu Deklarasyonu destekleyen insanlara dayanıyor ve bu yüzden onları tekrar saflara kabul etmekten başka seçeneğimiz yok."
 SOV_THE_LONELY_ISLAND_DESC_INDEPENDENCE:0 "İç savaşımızdaki [JAP.GetAdjective] yardımı için ödediğimiz bedel çok, çok yüksekti. Artık yeter! Bağımsızlığımızı ne pahasına olursa olsun geri kazanacağız."
 SOV_THE_LONELY_ISLAND_DESC_NORMAL:0 "Japonların 1905'te bize yaptıkları hakareti düzeltme zamanı geldi. Bu sefer, Japonya Denizi'ne hükmetmemizi ve onları diz çöktürmemizi engelleyecek hiçbir şey olmayacak!"
 SOV_THE_LONELY_ISLAND_NAME_INDEPENDENCE:0 "Büyük Vatansever Bağımsızlık Savaşı"
 SOV_THE_LONELY_ISLAND_NAME_NORMAL:0 "Yalnız Ada"
 SOV_a_global_class_struggle:0 "Küresel Bir Sınıf Mücadelesi"
 SOV_a_global_class_struggle_decision_tt:0 "Avrupalı komşuları istikrarsızlaştırmak ve onlara karşı savaşı haklı çıkarmak için §YProletaryayı Kışkırt§! kararlarının kilidini açar."
 SOV_a_global_class_struggle_desc:0 "İşçi sınıfını kurtarma mücadelesi tanım gereği küresel bir mücadele olmalıdır. Kapitalist sistemi destekleyen tek bir ülke bile olduğu sürece, devrim güvende değildir. Dünya çapındaki işçiler devrimin tekrar yürüyüşte olduğunu anladıklarında, sancağımıza akın edecek ve çabalarımızda bizi destekleyecekler."
 SOV_a_new_theory_of_revolution:0 "Yeni Bir Devrim Teorisi"
 SOV_a_new_theory_of_revolution_desc:0 "Marksist devrim teorisi 19. yüzyılda doğruydu, ancak 20. yüzyılın gerçekleri teorinin gözden geçirilmesini gerektiriyor. Devrimin başladığı her zaman en gelişmiş uluslar değildir ve bu nedenle yaklaşımımızı ayarlamalıyız."
 SOV_a_sustainable_economy:0 "Sürdürülebilir Bir Ekonomi"
 SOV_a_sustainable_economy_desc:0 "Yeni Ekonomik Politika'ya geçiş, genel sanayileşme hızının yavaşlaması pahasına tüketim malları üretimine yönelik belirgin bir kayma ile geldi. Uzun vadede rekabetçi olacaksak, ekonomiyi daha sürdürülebilir bir modele kaydırmalıyız."
 SOV_addressing_internal_affairs:0 "İç Meseleleri Ele Alma"
 SOV_addressing_internal_affairs_desc:0 "Devrimin hala dünya çapında birçok düşmanı varken ve milyonlarca işçi hala özgürleşmeyi özlerken, evde bizi bekleyen birçok soruna gözlerimizi çevirmeyi unutmamalıyız."
 SOV_adjoined_battle_priests:0 "Eklenmiş Savaş Rahipleri"
 SOV_adjoined_battle_priests_desc:0 "Ülkedeki gücü ve nüfuzu son zamanlarda artan Kilise'nin, askerî meselelere dahil olmasına izin verme zamanı gelmiş olabilir. Askerî birimlerimiz içinde Savaş Rahipleri rolünü üstlenerek, din adamları birliklerin Tanrı'nın bizim tarafımızda olduğunu bilmelerini sağlayacak, bu da potansiyel olarak morali artıracak ve sıradan askerin ülkeleri için daha ateşli savaşmasını sağlayacaktır."
 SOV_administrative_reforms:0 "İdari Reformlar"
 SOV_administrative_reforms_desc:0 "Stalin her şeyden çok sadakate değer verirdi. Sonuç olarak, yönetimimizde çalışan insanlar başlarını belaya sokabilecek çok fazla inisiyatif veya bağımsız düşünce göstermiyorlar. Bu değerleri onlara aşılamalıyız ya da onları bu değerlere sahip insanlarla değiştirmeliyiz."
 SOV_advanced_maneuvers:0 "Gelişmiş Manevralar"
 SOV_advanced_maneuvers_desc:0 "Mürettebatlarının onları nasıl kullanacağı hakkında hiçbir fikri yoksa büyük ve modern gemilere sahip olmak anlamsızdır. Mürettebatımızı ve subaylarımızı modern deniz savaşında eğitmek için düzenli, büyük ölçekli deniz tatbikatları başlatmalıyız."
 SOV_advanced_maneuvers_ns_tt:0 "$SOV_modify_red_fleet_ns_intro$ \nFilo Koordinasyonu: §G+%10§! \n Görünürlük: §G-%5.00§! \nPerdeleme Verimliliği: §G+%10.0§! \nKonumlandırma: §G+%10.0§! \n\n"
 SOV_aid_republican_spain_tt:0 "\n[SPR.GetFlag] [SPR.GetNameDefCap]: \n"
 SOV_align_the_zinovyevites:0 "Zinovyevcileri Hizala"
 SOV_align_the_zinovyevites_desc:0 "$SOV_grigory_zinovyev$ bir zamanlar Troçki'ye karşı Stalin'in yanında yer aldı. Hemen ardından, Stalin ona ihanet etti ve onu herhangi bir güç konumundan uzaklaştırdı. Bu hakareti unutmuş olamaz ve eğer $SOV_grigory_zinovyev$'e intikam fırsatı verirsek, bunu alacaktır."
 SOV_align_the_zinovyevites_factionalism_tt:0 " §Y$SOV_factionalism_modifier$§!'ı §R-%5§! Siyasi Güç Faktörü ile değiştirir."
 SOV_align_the_zinovyevites_tt:0 "§Y$SOV_grigory_zinovyev$§! ve §Y$SOV_lev_kamenev$§! hapisten kurtarılıp sürgüne gönderilecek (§Gsürgündeki karakterler tasfiye edilemez§!). İç savaş başladığında danışman olarak kullanılabilir hale gelecekler.\nİç Savaş'ın patlak vermesiyle kilit eyaletlerde partizan eklemek için §YKararların§! kilidini açar.\n"
 SOV_all_power_to_the_soviets:0 "Tüm İktidar Sovyetlere"
 SOV_all_power_to_the_soviets_desc:0 "Devrim basit bir fikirle başladı - halkın, işçi, asker, köylü konseyleri kurarak kendi kaderini belirlemesine izin verilmesi gerektiği. Ancak daha sonra bu sistem, seçilmemiş bürokratların uzaktan kararlar aldığı bir sisteme geri döndürüldü. Bu kararlar kaçınılmaz olarak geri teptiğinde, genellikle cezalandırılan işçiler oldu. Artık değil!"
 SOV_an_adaptable_army:0 "Uyum Sağlayabilen Bir Ordu"
 SOV_an_adaptable_army_desc:0 "Bu savaş birkaç iklim kuşağına ve çok çeşitli arazilere yayılıyor. Bu savaşı kazanmak istiyorsak her arazide ve hava durumu ne olursa olsun savaşabilmeliyiz."
 SOV_an_adaptable_army_ns_tt:0 "$SOV_modify_the_red_army_ns_intro$ \nKış Zayiatı: §G-%10.0§! \nSıcak Zayiatı: §G-%10.0§! \nSoğuk iklime alışma kazanım faktörü: §G+%15.0§! \nSıcak iklime alışma kazanım faktörü: §G+%15.0§! \nArazi Özellikleri DP Kazanımı: §G+%15.0§! \n\n"
 SOV_an_empire_in_the_pacific:0 "Pasifik'te bir İmparatorluk"
 SOV_an_empire_in_the_pacific_desc:0 "İmparatorluğumuz Pasifik'e yayılmaya başladıkça, gücümüzü ve nüfuzumuzu bu geniş okyanus alanları boyunca kullanabilmek için gemi tasarımımız da buna uymalıdır."
 SOV_an_empire_in_the_pacific_tt:0 "§YBüyük Çin§!'deki tüm eyaletlerde §Ghak iddiaları§! kazan."
 SOV_an_oceangoing_navy:0 "Okyanusa Açılan Bir Donanma"
 SOV_an_oceangoing_navy_desc:0 "$SOV_ocean_going_navy_desc$"
 SOV_an_oceangoing_navy_shbb_tt:0 "Teknoloji ekle: §Y$ship_hull_super_heavy_1$§!."
 SOV_anti_capitalist_policies:0 "Anti-Kapitalist Politikalar"
 SOV_anti_capitalist_policies_desc:0 "Kapitalist ülkelerin çoğunun, hatta hepsinin, genişlemelerini planlarken faşistleri başka bir yöne yönlendirmekten tamamen memnun olduğu açıktır. Seçim verildiğinde, Burjuvazi her zaman, nihayetinde proletaryayı ezmeyi seçecektir. Bu nedenle onlara güvenemeyiz ve onlarla savaşa hazırlanmalıyız."
 SOV_anti_fascist_policies:0 "Anti-Faşist Politikalar"
 SOV_anti_fascist_policies_desc:0 "Faşistlerle barışçıl bir arada yaşama olamaz. Bulabildiğimiz tüm müttefiklere ulaşmalı ve kaçınılmaz çatışmaya hazırlanmalıyız."
 SOV_approach_germany:0 "Almanya'ya Yaklaş"
 SOV_approach_germany_desc:0 "Almanya ile bir uzlaşmaya varamamamız için hiçbir neden yok. Elbette onlarla sonsuza kadar barış içinde bir arada yaşayamayacağız, ancak Almanlar batı Müttefikleri arkalarında var olduğu sürece bize saldırmayacaklar - ve Almanları önce onlarla başa çıkmaya teşvik etmeliyiz."
 SOV_approach_primakov:0 "Primakov'a Yaklaş"
 SOV_approach_primakov_desc:0 "Vitaly Primakov önde gelen süvari komutanlarımızdan biridir ve ülkeyi güvence altına alma çabamızda desteği çok değerli olacaktır."
 SOV_approach_primakov_tt:0 "§Y$SOV_vitaly_primakov$§!, İç Savaş'ta Sol Muhalefet'in yanında yer alacak, birlikler ve sadık generaller getirecek."
 SOV_approach_semyonov:0 "Semyonov'a Yaklaş"
 SOV_approach_semyonov_desc:0 "$SOV_grigory_semyonov$, [MAN.GetName]'de danışman olarak bir pozisyon aldı. Dava saatler geçtikçe güçlenirken, onu geri dönmeye ikna etmeliyiz. İlk görevi, yeni Rus İmparatorluğu için büyük bir süvari ordusu organize etmek olacaktır."
 SOV_approach_semyonov_tt:0 "§Y$SOV_grigory_semyonov$§!, [GetSovietCivilWarName] başladığında bir danışman ve general olarak kullanılabilir hale gelir.\nEkstra süvari tümenleri toplamak için §Ykararların§! kilidini açar."
 SOV_approach_tukhachevsky:0 "Tuhaçevski'ye Yaklaş"
 SOV_approach_tukhachevsky_desc:0 "Mihail Tuhaçevski şüphesiz en büyük askerî düşünürlerimizden biridir. Düşmanın gerisine derinlemesine vuran hızlı hareket eden birleşik silah birimleri teorileri eleştirisiz olmasa da, hala çok yetenekli Generallerin desteğini alıyor. Onu davamızı desteklemeye ikna edebilirsek, paha biçilmez bir varlık olur."
 SOV_approach_tukhachevsky_tt:0 "§Y$SOV_mikhail_tukhachevsky$§!, İç Savaş'ta Sol Muhalefet'in yanında yer alacak, birlikler ve sadık generaller getirecek."
 SOV_architect_of_communism:0 "Komünizmin Mimarı"
 SOV_architect_of_communism_desc:0 "Yoldaş Stalin'in devrim ideallerine olan sarsılmaz bağlılığı, Tek Ülkede Sosyalizm inşa etmenin zorluklarını görmesini sağladı. Sosyalizm inşa etme çalışmaları iyi bir şekilde devam ederken, bir sonraki büyük adıma yönelebilir: Sosyalizmden tam Komünizme nasıl geçilir."
 SOV_aristocratic_investments:0 "Aristokratik Yatırımlar"
 SOV_aristocratic_investments_desc:0 "Hala dünyanın dört bir yanına dağılmış, birçoğu önemli servete sahip olan eski Rus soylularından birçoğu var. Bu servetin bir kısmı, silah ve teçhizat satın almamız için bize sunulabilir."
 SOV_article_124:0 "Madde 124"
 SOV_article_124_desc:0 "[SOV.GetArticle124Desc]"
 SOV_autonomous_soviet_republics:0 "Özerk Sovyet Cumhuriyetleri"
 SOV_autonomous_soviet_republics_desc:0 "Devrimi takip eden yıllarda, Stalinistler bölgesel kimlikleri ortadan kaldırmak ve birliğin bazı bölgelerinde işçilerin kendi kaderini tayin hakkını bastırmak için çok çalıştılar. Bu eylemlerin karşı-devrimci karakteri apaçıktır. Eğer bazı Sovyet cumhuriyetlerindeki işçiler daha büyük bir özerklik derecesi istiyorsa, tereddüt etmeden bunu vermeliyiz."
 SOV_autonomous_soviet_republics_tt:0 "Ülkeleri serbest bırakmayı etkinleştirir."
 SOV_back_to_the_nep:0 "NEP'e Geri Dön"
 SOV_back_to_the_nep_desc:0 "Sosyalist bir toplum inşa etmeden önce, temelleri oluşturmalı ve ekonomimizi daha da geliştirmeliyiz. Devrimin ilk yıllarında, ekonomiyi büyütmek için serbest piyasa mekanizmalarına izin veren Yeni Ekonomik Politika'yı kurduk. Bu politika, meyvelerini vermeden çok önce hızla tersine çevrildi. Şimdi tekrar başa geçtiğimize göre, daha iyi bir topluma doğru bu yarım kalmış süreci yeniden başlatabiliriz."
 SOV_back_to_the_nep_new_economy_law:0 "Yeni Ekonomi Kanununun kilidini açar: §Y$new_economic_policy$§!"
 SOV_baltic_security:0 "Baltık Güvenliği"
 SOV_baltic_security_desc:0 "Baltık Denizi çevresindeki ülkelerin kaderi bizimkiyle yakından bağlantılıdır. Sınırlarımızda düşman bir hükûmete izin veremeyiz."
 SOV_ban_excessive_hero_worship:0 "Aşırı Kahraman Tapınmasını Yasakla"
 SOV_ban_excessive_hero_worship_dec_cost_tt:0 " §YDiplomasi§! kategorilerine ait kararlar için karar maliyeti: §G-%50§!"
 SOV_ban_excessive_hero_worship_desc:0 "Yoldaş Stalin'in özel hayatı ve çocukluğu hakkında hayal ürünü ve çılgınca abartılı hesaplar yayınlama eğilimi olmuştur. Ancak ne kadar iyi niyetli olursa olsun, bu hesaplar karşı-devrimcidir ve Sovyet halkının zihninde bir kahramanlık kültü oluşturmayı amaçlar ve Yoldaş Stalin'in teorilerinin güçlü bir şekilde incelenmesini sadece kör bir putperestlikle değiştirmeyi amaçlar."
 SOV_barrier_troops:0 "Bariyer Birlikleri"
 SOV_barrier_troops_desc:0 "Savaş genellikle kaotiktir ve bazen askerlerin daha yüksek karargahlarla temasını kaybetmesi anlaşılabilir bir durumdur. Bu başıboşları toplayan ve onları tekrar savaşa yönlendiren - ve görevlerinden kaçmaya çalışarak yoldaşlarına ihanet edenleri tutuklayan - cephenin çok gerisinde birimler kurmalıyız."
 SOV_barrier_troops_ns_tt:0 "$SOV_modify_the_red_army_ns_intro$ \nOrdu Organizasyonu Yenilenmesi: §G+%10.00§! \n\n"
 SOV_beaten_but_not_defeated:0 "Yenilmiş, ama Mağlup Değil"
 SOV_beaten_but_not_defeated_desc:0 "Komünistlerin bir zamanlar gururlu olan ülkemizi hain bir yola sürüklediği açıktır. Er ya da geç, sınırlarımızdaki ülkeler rejimdeki zayıflığı hissedecek ve saldıracaktır. Sevgili anavatanımızı kurtaracaksak, Komünistleri iktidardan indirmeliyiz!"
 SOV_beaten_but_not_defeated_tt:0 "[ROOT.GetNameDef]'de Komünistler ve Sürgündeki Muhalefet arasında §Y[GetSovietCivilWarName]§! sürecini başlatır."
 SOV_behead_the_snake:0 "Yılanın Başını Ez"
 SOV_behead_the_snake_desc:0 "Birliğin, Troçkist bir darbe tehdidi tamamen ortadan kalkana kadar güvende olmayacağı kesinlikle açık. Troçki'yi anti-sovyet faaliyetlerini ifşa etmek için yargılamak iyi olsa da, bu lükse sahip değiliz. Tek seçeneğimiz, hükûmete karşı komplonun liderini ve baş kışkırtıcısını yoksun bırakmak için onu suikastla öldürmektir."
 SOV_behead_the_snake_lar_has_agency:0 ""
 SOV_behead_the_snake_lar_no_agency:0 "§R(Bir İstihbarat Teşkilatı inşa etmeyi gerektirir)§!."
 SOV_behead_the_snake_lar_tt:0 "Troçki'ye suikast düzenlemek için operasyonların kilidini açar. [GetAgencyRequirement]"
 SOV_behead_the_snake_no_lar_tt:0 "Troçki'ye suikast düzenlemek için kararların kilidini açar."
 SOV_behead_the_snake_ns_tt:0 "$SOV_modify_the_politburo_ns_intro$ \nOperatif yuvaları: §G+1§! \n\n"
 SOV_belarus_claims_tooltip:0 "Mevcut §YSovyet Talepleri§! §Y[?BALTIC_claims_printed]§!."
 SOV_brilliant_genius:0 "Parlak Dâhi"
 SOV_brilliant_genius_academies_of_sciences_tt:0 "§Y$SOV_national_academy_of_sciences_dec_cat$§! karar maliyeti: §G-%50§!\n"
 SOV_brilliant_genius_desc:0 "Şüphesiz yaşayan en parlak adam olan Yoldaş Stalin, ulusumuzu yeni bilimsel gelişme yüksekliklerine yönlendirecek ve tüm insanlığın ilerlemesini sıçramalarla ileriye taşıyacaktır."
 SOV_bring_old_trotskyists_back:0 "Eski Troçkistleri Geri Getir"
 SOV_bring_old_trotskyists_back_desc:0 "Devrimin ilk yıllarında, parti içindeki çeşitli fraksiyonlar arasında birçok hararetli tartışma yaşandı. Karl Radek ve Yevgeny Preobrazhensky gibi parti çizgisine tam olarak uymayan bazı kişiler, küçük anlaşmazlıklar nedeniyle bile ihraç edildi. Belki de bu uzun süredir hizmet veren parti üyelerinden bir pişmanlık jesti, onları tekrar saflara katmak için yeterli olabilir."
 SOV_bring_old_trotskyists_back_effect_tt:0 "§Y$SOV_karl_radek$§! ve §Y$SOV_yevgeny_preobrazhensky$§!, danışman olarak kullanılabilir hale gelir."
 SOV_bring_old_trotskyists_back_trigger_tt:0 "§Y$SOV_karl_radek$§! ve §Y$SOV_yevgeny_preobrazhensky$§!, Stalin tarafından tasfiye edildi."
 SOV_bringing_breakaways_back_to_the_fold:0 "Ayrılıkçıları Geri Döndür"
 SOV_bringing_breakaways_back_to_the_fold_desc:0 "Ülkenin çoğunluğunu geri kazandıktan sonra, şimdi ayrılıkçı ülkelerle ilgilenmeliyiz. Rus İmparatorluk topraklarının kaybını sonsuza dek kabul etmemizi bekleyemezler, değil mi?"
 SOV_call_for_aid:0 "Yardım Çağrısı"
 SOV_call_for_aid_desc:0 "Rusya'daki Komünizme karşı mücadele, her yerdeki Komünizme karşı daha büyük bir mücadelenin parçasıdır. Ancak Rusya'daki Komünizme karşı bir zafer, dünya çapındaki komünist harekete bir ölüm darbesi olacaktır ve bu yüzden bize yardım etmeye hevesli birçok ülke vardır."
 SOV_capital_of_the_tsars:0 "Çarların Başkenti"
 SOV_capital_of_the_tsars_desc:0 "St. Petersburg tarih boyunca gururlu ulusumuzun başkenti olmuştur. Şimdi, Kışlık Saray bir kez daha bir Romanov tarafından işgal edildiğine göre, resmî başkentin bir kez daha bu muhteşem şehre taşınma ve tüm çabanın onun ihtişamını artırmaya adanma zamanı geldi."
 SOV_capital_of_the_tsars_tt:0 "Şunları verir:\nYerel İnşaat Hızı: §G+%25§!"
 SOV_carry_revolution_east:0 "Devrimi Doğu'ya Taşı"
 SOV_carry_revolution_east_decision_tt:0 "Asyalı komşularda §YBeşinci Kol Organize Et§! ve §YProletaryayı Kışkırt§! kararlarının kilidini açar."
 SOV_carry_revolution_east_desc:0 "Afrika sömürgelerinin acımasız sömürüsü, bu toplumları devrimin kolayca başarılı olabileceği seviyeye geliştiremez hale getirdi. Bu durum, büyük bir devrimci potansiyelin var olduğu ve serbest bırakılmayı beklediği Asya'daki daha gelişmiş toplumlar için geçerli değildir."
 SOV_church_candidates:0 "[SOV.GetChurchCandidatesName]"
 SOV_church_candidates_desc:0 "[SOV.GetChurchCandidatesDesc]"
 SOV_claim_on_bessarabia:0 "Besarabya Üzerinde Talep"
 SOV_claim_on_bessarabia_desc:0 "1918'de, Rumenler iç sorunlarımızdan utanmazca yararlandılar ve Besarabya'yı ilhak ettiler. Onlara yasal olarak bize ait olan toprağı tuttuklarını hatırlatmanın zamanı geldi ve eğer doğru sınırları geri getirmeye istekli değillerse, onları askerî yollarla zorla çıkaracağız."
 SOV_claims_in_baltic:0 "Baltık'ta Talepler"
 SOV_claims_in_baltic_desc:0 "Baltık Devletleri bir zamanlar Rusya'nın bölünmez bir parçasıydı. Halkları, onları sömürüden koruyabilecek büyük bir devletin korumasına ihtiyaç duyuyor. Eğer Baltık Devletleri bu şartları kabul etmezse, korumamızı sağlamak için güce başvurmak zorunda kalabiliriz."
 SOV_claims_on_poland:0 "Polonya Üzerinde Talepler"
 SOV_claims_on_poland_desc:0 "Polonya, yüzyıllardır Rus olan toprakları elinde tutuyor, Ukrayna ve Belarus'u uluslarımız arasında bölüyor. Bu kabul edilemez bir durumdur. 1921'de bizi yenmiş olabilirler, ama onlara zamanın değiştiğini hatırlatmalıyız."
 SOV_clandestine_cells:0 "Gizli Hücreler"
 SOV_clandestine_cells_desc:0 "Stalinistler her yerde sabotajcılar, casuslar ve muhripler görüyor. Bunu o kadar uzun süredir yapıyorlar ki, çoğu insan artık kurt diye bağırdıklarında onlara inanmıyor. Bunu, Stalin'in devralmamıza karşı çıkması durumunda sabotaj eylemlerinde bulunmak için büyük sanayi işlerinde hücreler oluşturmak için kullanabiliriz."
 SOV_clandestine_cells_tt:0 "İç savaş sırasında sanayiyi sabote etmek için §Ykararların§! kilidini açar."
 SOV_cohesion_first:0 "Önce Uyum"
 SOV_cohesion_first_desc:0 "Bu durumda ihtiyacımız olan son şey standartlarımızı düşürmektir. Orduda hizmet etmek isteyen herkes hoş karşılanır - ancak mevcut birliklerde hizmet edecekler ve uygun askerî standartlara göre eğitilecekler."
 SOV_cohesion_first_ns_tt:0 "$SOV_modify_the_red_army_ns_intro$ \nTümen Organizasyonu: §G+%5.0§! \nEğitim süresi: §R+%10.00§! \n\n"
 SOV_collectivist_propaganda:0 "Kolektivist Propaganda"
 SOV_collectivist_propaganda_desc:0 "Karşılaştığımız birçok zorluk hiçbir vatandaşı tek başına karşılamaz. Tüm mücadelelerimiz ortak mücadelelerdir, dolayısıyla tüm başarılarımız ortak başarılardır."
 SOV_comecon_alt_name:0 "$SOV_common_economic_space_name$"
 SOV_comecon_communist_name:0 "$SOV_comecon_name$"
 SOV_committee_in_exile:0 "Sürgündeki Komite"
 SOV_committee_in_exile_desc:0 "Stalin'in çılgın bakışlarının bir sonraki kime yöneleceğinden asla emin olamayız. Bazı destekçilerimizin başka bir tasfiye tarafından hedeflendiğini öğrenirsek, insanları ülkeden kaçırmak için gizli yollar ve güvenli evler hazırlamalıyız."
 SOV_committee_in_exile_tt:0 "Sempati duyanları sürgüne göndermemize olanak tanıyan §Y$SOV_send_supporters_abroad$§! kararının kilidini açar (§Gsürgündeki karakterler tasfiye edilemez§!). Sürgündeki karakterler İç Savaş patlak verdiğinde kullanılabilir hale gelecektir."
 SOV_concessions_to_foreign_powers:0 "Yabancı Güçlere Tavizler"
 SOV_concessions_to_foreign_powers_desc:0 "Ülkeyi kurtarma mücadelemizde yabancı yardımı için yalvarmamız istenmesi son derece aşağılayıcı, ancak Stalin'in tiranlığı ve paranoyası bizi buna zorladı."
 SOV_concessions_to_foreign_powers_tt:0 "Tavizler karşılığında yabancı güçlerden yardım talep etmek için §YKararların§! kilidini açar."
 SOV_consolidate_power:0 "İktidarı Pekiştir"
 SOV_consolidate_power_desc:0 "Ulusumuzu parçalayan savaş şimdi kazanıldı. Konumumuzu güçlendirmeli ve bize karşı çıkmaya cüret edenleri metodik olarak ortadan kaldırmalıyız."
 SOV_consolidate_power_tt:0 "§Y$SOV_nikolay_ustryalov$§! danışman olarak kullanılabilir hale gelir."
 SOV_control_scandinavia:0 "İskandinavya'yı Kontrol Et"
 SOV_control_scandinavia_decisions_tt:0 "İskandinav ülkelerinde §YHükûmete Baskı Yap§! ve §Yİdeolojik Mitingleri Teşvik Et§! kararlarını etkinleştirir."
 SOV_control_scandinavia_desc:0 "Kuzey sınırımıza yönelik son tehdit, İskandinav yarımadasındaki hükûmetlerdir. Onlara, barışçıl bir arada yaşamanın karşılıklı güven gerektirdiği gerçeğini ve ideolojisi bizimkiyle uyuşmayan bir hükûmete güvenemeyeceğimizi vurgulamalıyız."
 SOV_cooperation_against_stalin:0 "Stalin'e Karşı İşbirliği"
 SOV_cooperation_against_stalin_desc:0 "Farklılıklarımız ne olursa olsun, mücadelenin bu aşamasında Stalin'e karşı muhalefetimizde birleşmiş olmalıyız."
 SOV_cooperation_against_stalin_factionalism_tt:0 "§Y$SOV_factionalism_modifier$§!'ı §G-%15§! Siyasi Danışman Maliyeti, §R-%10§! Parti Popülerliği İstikrar Faktörü ve §R-%5§! Siyasi Güç Faktörü ile değiştirir."
 SOV_cooperation_against_stalin_left_tt:0 "§Y$SOV_nikolay_bukharin$§! ve §Y$SOV_aleksey_rykov$§! danışman olarak kullanılabilir hale gelir."
 SOV_cooperation_against_stalin_other_tt:0 "Yeni danışmanlar kullanılabilir hale gelir."
 SOV_cooperation_against_stalin_right_tt:0 "§Y$SOV_karl_radek$§! ve §Y$SOV_yevgeny_preobrazhensky$§! danışman olarak kullanılabilir hale gelir."
 SOV_coup_detat:0 "Darbe"
 SOV_coup_detat_civil_war_tt:0 "Ordu, Donanma ve Hava Kuvvetlerinde Sağ Muhalefet için destek ekler.\n§YSovyet İç Savaşı'nı§! başlatır. "
 SOV_coup_detat_desc:0 "Ülkenin yönetimini ele geçirme saati geldi. Her şey yolunda giderse, hızlı bir şekilde vuracak ve en büyük engelleri kansız bir darbeyle ortadan kaldıracağız. İşler yolunda gitmezse, ülkemiz için savaşmak zorunda kalacağız."
 SOV_coup_detat_success_tt:0 "§YSağ Muhalefet§! bir darbeyle kontrolü ele alır. §Y$SOV_lavrenty_beriya$§! kaldırılır."
 SOV_covert_operations:0 "Gizli Operasyonlar"
 SOV_covert_operations_desc:0 "Komünistler güvensizliğe ve iç çekişmeye yatkındır. Oyunu doğru oynarsak, birbirlerini yemelerini sağlayabiliriz."
 SOV_covert_operations_tt:0 "Parti üyelerini ve askerî personeli suçlamak için §Ykararların§! kilidini açar."
 SOV_covert_support_for_spanish_poum:0 "İspanyol POUM'a Gizli Destek"
 SOV_covert_support_for_spanish_poum_desc:0 "İspanya'da karşı-devrim tüm hızıyla devam ediyor. Faşistler ve gerici güçler İspanyol Milliyetçilerini destekliyor. İspanyol Cumhuriyetçileri bolca şevke sahip olsalar da, bu maalesef silah ve mühimmatın yerini tutmaz, ne de iyi gelişmiş bir siyasi bilince sahip olmanın yerini tutar. Üçünü de sağlayabiliriz."
 SOV_covert_support_for_spanish_poum_tt:0 "Gizli destek sağlamak, İspanyol iç savaşındaki Anarşist ayaklanması sırasında POUM'un baskın hizip haline gelmesini sağlayacak, bu da onu bir $neutrality$ ayaklanması yerine bir §Y$communism$§! ayaklanması yapacaktır.\n\n"
 SOV_curtailment_of_the_collective_farms:0 "Kolektif Çiftliklerin Kısıtlanması"
 SOV_curtailment_of_the_collective_farms_desc:0 "Devasa kolektif çiftlikler, tipik bir bürokratik Stalinist devasalık örneğidir. Köylüyü emeğinin ürününden yabancılaştırır ve onu etkili bir şekilde tarlalarda bir sanayi işçisine dönüştürür. Aynı zamanda, üretim önemli ölçüde düştü ve gıda üretimindeki aksama zaten felakete yol açtı. Bu ahmaklığı acilen tersine çevirmeliyiz."
 SOV_curtailment_of_the_collective_farms_tt:0 "Beş Yıllık Plan odaklarını kilitler"
 SOV_demand_balkan_submission:0 "Balkanların Teslimiyetini Talep Et"
 SOV_demand_balkan_submission_decisions_tt:0 "Balkan ülkelerine §YÜltimatom Gönder§! kararlarını etkinleştirir."
 SOV_demand_balkan_submission_desc:0 "Geçmiş deneyimler, çevremizdeki ülkelerin gösterdiğimiz herhangi bir zayıflığı sömüreceğini göstermiştir. Avrupa'da savaş demlenirken, şüpheli bağlılıkları olan komşulara sahip olmayı göze alamayız. Balkanlar ve Küçük Asya'daki ülkeler, bizimle mi yoksa bize karşı mı duracaklarını seçmek zorunda kalacaklar."
 SOV_demand_eastern_poland:0 "Doğu Polonya'yı Talep Et"
 SOV_demand_eastern_poland_desc:0 "Büyük savaşın sonunda, Curzon hattı Polonya'nın doğu sınırı olarak kuruldu ve kabul edildi. Bu hat, Polonya'nın mevcut sınırının yaklaşık 200 kilometre batısından geçiyor. Onlara bu temel tarihsel gerçeği hatırlatmalı ve sınırın olması gerektiği yerde olmasını sağlamalıyız."
 SOV_depoliticize_the_military:0 "Orduyu Depolitize Et"
 SOV_depoliticize_the_military_desc:0 "Ordunun birincil amacı işçi sınıfını korumaktır. Askerlerimiz büyük ölçüde zaten işçi sınıfının üyeleridir ve bu nedenle onları denetleyecek birine ihtiyaçları yoktur. Daha da önemlisi, Kızıl Ordu'nun birincil görevine odaklanması ve siyasette oynamasına izin verilmemesidir."
 SOV_depoliticize_the_military_ns_tt:0 "$SOV_modify_the_red_army_ns_intro$ \nAzami Komuta Gücü Çarpanı Artışı: §G+10§! \n\n"
 SOV_desperate_measures:0 "Çaresiz Tedbirler"
 SOV_desperate_measures_decisions_unlocked_tt:0 "Birkaç §Y$SOV_great_patriotic_war$§! kararının kilidini açar."
 SOV_desperate_measures_desc:0 "Bu çaresiz durumda, daha önce imkansız olduğunu düşündüğümüz önlemleri almalıyız. İstilayı durdurmak için yapılabilecek her şey yapılmalıdır."
 SOV_develop_the_urals:0 "Uralları Geliştir"
 SOV_develop_the_urals_desc:0 "Ulusumuza yönelik en büyük tehdit muhtemelen Avrupa'daki bir ulustan gelecektir. Ural dağlarının ötesindeki alanları geliştirerek, en uzun menzilli bombardıman uçağının bile ulaşması zor olacak bir endüstriyel kapasite rezervi yaratacağız."
 SOV_development_aid_for_eastern_allies:0 "Doğu Müttefikleri İçin Kalkınma Yardımı"
 SOV_development_aid_for_eastern_allies_desc:0 "Yüzyıllardır batı Emperyalizmi ve Sömürgeciliği, Asya'daki ülkeleri acımasızca sömürdü. Bizden mütevazı bir yatırım, Asya'daki müttefiklerimizin daha fazla kapitalist tecavüze çok daha etkili bir şekilde direnmelerini sağlayacaktır."
 SOV_development_aid_for_eastern_allies_tt:0 "Başkent eyaletlerine §G2§! İnşaat Yuvası ve §Y2 Sivil Fabrika§! ekler. Rastgele bir başkent olmayan eyalete §G1§! İnşaat Yuvası ve §Y1 Sivil Fabrika§! ekler."
 SOV_development_of_tankograd:0 "Tankograd'ın Gelişimi"
 SOV_development_of_tankograd_desc:0 "Ülkemiz geniş mesafelere yayılıyor, bu da alt bileşenleri fabrikadan fabrikaya göndermeyi pratik hale getirmiyor. Bunun yerine tank fabrikalarımızı dikey olarak entegre etmeliyiz - bir uçtan çelik giriyor, diğer uçtan bitmiş tanklar çıkıyor."
 SOV_development_of_tankograd_factories_tt:0 " Urallar'da veya Uzak Doğu'da en az 3 askerî fabrikası olan her eyalete §G1§! İnşaat Yuvası ve §Y1 Askerî Fabrika§! ekler. (Maks. 10)"
 SOV_development_of_tankograd_ns_tt:0 "$SOV_modify_defense_industry_ns_intro$ \n Kara Teçhizatı Deneyim Maliyeti: §G-%10§! \n\n"
 SOV_dismantle_the_zemsky_sobor:0 "Zemsky Sobor'u Dağıt"
 SOV_dismantle_the_zemsky_sobor_desc:0 "Zemsky Sobor amacına hizmet etti. 1917'de gösterildiği gibi, çok fazla demokrasi tehlikeli bir şey olabilir. Geçmişin hatalarını tekrarlamamalıyız."
 SOV_dismantle_the_zemsky_sobor_tt:0 "Mevcut §YFaşist olmayan§! desteğin yarısı bir §Rİstikrar§! cezası olarak uygulanır:\n"
 SOV_dissent_in_the_party:0 "Partideki Muhalefet"
 SOV_dissent_in_the_party_desc:0 "Stalin'i parti üzerindeki kontrolünü baltalamak için birkaç cepheden itmeliyiz. Bir yaklaşım açısı, parti gazetelerinde bir dizi eleştirel makale ve deneme yayınlamak, reform talep etmek ve kararlarındaki kusurları işaret etmektir. Stalin bunu çok rahatsız edici bulacak olsa da, bu aynı zamanda çeşitli muhalefet gruplarıyla olan konumumuzu da iyileştirecektir."
 SOV_divert_attention_towards_military:0 "Dikkati Orduya Yönelt"
 SOV_divert_attention_towards_military_desc:0 "Eğer Stalin silahlı kuvvetlerin ondan memnun olmadığını düşünürse, bize değil onlara saldıracaktır. Ve sonunda, silahlı kuvvetler ondan memnun olmayacak..."
 SOV_divert_purge_attention_tt:0 "Orduya karşı rastgele bir tasfiye başlatır. \nAskerî subayları suçlamak için §Ykararların§! kilidini açar.\nMerkez için §Y$SOV_the_zinovyevite_terrorist_center$§! odağını atlayacaktır."
 SOV_eastern_development:0 "Doğu'nun Gelişimi"
 SOV_eastern_development_desc:0 "Ural dağlarının ötesindeki Uzak Doğu bölgeleri, geniş, dokunulmamış kaynaklar ve endüstriyel gelişim için geniş alanlar sunuyor. Daha büyük projeleri güçlendirmeye hazır olduklarından emin olmalıyız."
 SOV_eastern_expansion:0 "Doğu Genişlemesi"
 SOV_eastern_expansion_desc:0 "Rusya'nın Geleceği Doğu'da yatıyor. Sibirya'yı evcilleştirdikten sonra, burada daha da fazla toprak ve kaynak kazanmaya çalışmamız sadece uygundur."
 SOV_eliminate_opposition_factionalism_tt:0 "§Y$SOV_factionalism_modifier$§!'ı değiştirir:\n Siyasi Güç Kazancı: §G+%5§!."
 SOV_eliminate_the_left:0 "Solu Tasfiye Et"
 SOV_eliminate_the_left_desc:0 "Birincil rakibimiz Stalin olsa da, partide sadece zamanını bekleyen ve ülkenin kontrolünü ele geçirme çabalarımızı bitmek bilmeyen tartışmalarıyla baltalayacak birçok kişi olduğunu kabul etmeliyiz. Stalin'in eylemlerimiz konusunda giderek daha paranoyaklaşmasıyla, bir taşla iki kuş vurma fırsatı ortaya çıkıyor."
 SOV_eliminate_the_left_tt:0 "§Y$SOV_karl_radek$§!, §Y$SOV_ivar_smilga$§! ve §Y$SOV_yevgeny_preobrazhensky$§!, Stalin tarafından bir tasfiye için potansiyel hedefler haline gelir."
 SOV_embrace_the_black_hundreds:0 "Kara Yüzleri Kucakla"
 SOV_embrace_the_black_hundreds_desc:0 "Eski günlerde, Devrim'in kaosundan önce, inanan bir grup adam vardı. Güçlü bir Rusya'ya, birleşik bir Rusya'ya, kendinden korkmayan bir Rusya'ya inanıyorlardı. Onlara Kara Yüzler deniyordu. Hayatta kalan üyeleri şimdi birçok farklı ülkeye dağılmış olsa da, hala inanıyorlar. Ve biz onları bulup geri getirebiliriz."
 SOV_embrace_the_black_hundreds_tt:0 "§Y[GetSovietCivilWarName]§! başladığında eyaletleri kontrol altına almak için eyaletlere sızmak üzere §Yon-map kararlarının§! kilidini açar."
 SOV_end_the_khalkhin_gol_conflict:0 "Halhin Gol Çatışmasını Sonlandır"
 SOV_end_the_khalkhin_gol_conflict_desc:0 "Japonya ile sınır çatışması yeterince uzun sürdü. Eğer bir Japon hükûmetinin tanınmış bir sınıra saygı göstereceğine güvenemiyorsak, o zaman o hükûmeti değiştirmek zorunda kalacağız."
 SOV_end_the_khalkhin_gol_conflict_wargoal_tt:0 "§Y[JAP.GetFlag][JAP.GetNameDef]§! ve §YÇin'den her [JAP.GetAdjective] müttefikine§! karşı §YKukla (Odak)§! savaş hedefi kazanır."
 SOV_eradicate_western_fascism:0 "Batı Faşizmini Yok Et"
 SOV_eradicate_western_fascism_desc:0 "Batı Avrupa'daki faşist rejimlerin seçtikleri anda bize saldırmaya tenezzül etmelerini bekleyemeyiz. Faşistlerle başa çıkmanın en iyi yolu, ilk ve sert vurmaktır."
 SOV_estonian_claimed_states_tt:0 "[ROOT.GetNameDefCap], §Ytüm [EST.GetAdjective] çekirdekleri§! üzerinde hak iddia eder."
 SOV_exiled_advisors_available_tt:0 "§YSürgündeki karakterler kullanılabilir hale gelecek.§!"
 SOV_exiles_civil_war_name:0 "2. Rus İç Savaşı"
 SOV_exiles_name:0 "Rus Sürgünleri"
 SOV_expand_aviation_institutes:0 "Havacılık Enstitülerini Genişlet"
 SOV_expand_aviation_institutes_desc:0 "Hava kuvvetlerimizin boyutunu artırmadaki en büyük darboğaz, pilot eğitimi kapasitemizdir. Pilot okullarımızı genişleterek, daha büyük ve daha yetkin bir hava kuvvetinin temelini atacağız."
 SOV_expand_aviation_institutes_ns_tt:0 "$SOV_modify_airforce_ns_intro$ \nÖldürüldüğünde Hava Filosu Deneyim kaybı: §G-%15§! \nHava Filosu Eğitim Deneyimi Kazancı: §G+%5§! \nHava Kazası Olasılığı: §G-%25.0§! \nKötü Hava Cezası: §G-%10.00§! \n\n"
 SOV_expand_shipbuilding_plants:0 "Gemi İnşa Tesislerini Genişlet"
 SOV_expand_shipbuilding_plants_desc:0 "Coğrafyamız, çeşitli filolarımızı desteklemek için geniş bir alana yayılmış tersanelere sahip olmamızı zorunlu kılıyor. Bu nedenle gemi inşa kapasitemizi artırmaya yönelik her türlü girişim de yayılmak zorundadır."
 SOV_expand_shipbuilding_plants_tt:0 " Önceki odaklar tarafından donanma üsleri güçlendirilen her eyalete §Y1 inşaat yuvası§! ve §Y1 Tersane§! ekle."
 SOV_expand_the_agitprop:0 "Ajitpropu Genişlet"
 SOV_expand_the_agitprop_desc:0 "Birliğimizdeki milyonlarca işçiye ulaşmak için onların dilini konuşmalıyız. Argümanlarımızı basit ve kolay anlaşılır hale getirmeliyiz ki sıradan vatandaşın hafızasında kalsın. Bu alandaki çabalarımızı daha da genişletmeliyiz."
 SOV_expand_the_aircraft_industry:0 "Havacılık Sanayisini Genişlet"
 SOV_expand_the_aircraft_industry_desc:0 "Gelecek savaşlarda, hava kuvvetlerimiz en modern teçhizatla donatılmış düşmanlara karşı gökleri güvence altına almak zorunda kalacak. Sadece karşılaştırılabilir uçaklara sahip olmalarını değil, aynı zamanda yeterli sayıda olmalarını da sağlamalıyız."
 SOV_expand_the_aircraft_industry_ns_tt:0 "$SOV_modify_airforce_ns_intro$ \n$aircraft_manufacturer_cost_factor$: §G-%25§! \n\n"
 SOV_expand_the_morskaya_aviatsiya:0 "Morskaya Aviatsiya'yı Genişlet"
 SOV_expand_the_morskaya_aviatsiya_desc:0 "Uçaklar kara savaşının doğasını zaten dramatik bir şekilde değiştirdi. Gelecekte, en modern su üstü gemilerine bile önemli tehlikeler oluşturacaklar. Diğer gemilerimizi desteklemek için her zaman modern bir deniz havacılık koluna sahip olduğumuzdan emin olmalıyız."
 SOV_expand_the_red_fleet:0 "[GetSovietArmyAdjectiveBasedOnIdeology] Filosunu Genişlet"
 SOV_expand_the_red_fleet_desc:0 "[GetExpandTheRedFleetDesc]"
 SOV_expand_the_red_fleet_desc_alt:0 "[GetSovietArmyAdjectiveBasedOnIdeology] Filosu, diğer büyük güçlerin donanmalarına kıyasla acınacak derecede zayıf. Genişlemesini ulusal bir öncelik haline getirmeliyiz!"
 SOV_expand_the_red_fleet_desc_default:0 "$SOV_expand_red_fleet_desc$"
 SOV_experts_in_camouflage:0 "Kamuflaj Uzmanları"
 SOV_experts_in_camouflage_desc:0 "Sürpriz unsurunu elde etmek ve sürdürmek için, düşmanın birlik pozisyonlarımızı veya hareketlerimizi çok geç olana kadar fark etmediğinden kesinlikle emin olmalıyız. Her asker kamuflaj sanatında eğitilmelidir."
 SOV_experts_in_camouflage_ns_tt:0 "$SOV_modify_the_red_army_ns_intro$ \nMevzilenme hızı: §G+%5.0§! \nAzami Mevzilenme: §G+5.0§! \nCAS'a Karşı Hasar Azaltma: §G+%5.0§! \n\n"
 SOV_far_east_fortification:0 "Uzak Doğu Tahkimatı"
 SOV_far_east_fortification_desc:0 "1905'teki Japonya ile savaştan bu yana, bölgeye endişeyle bakıyoruz. Japon ordusunun unsurlarının uzak doğu mülklerimize utanmaz bir açgözlülükle baktığı bir sır değil. O bölgede bir çatışmaya hazırlanmalıyız ve herhangi bir düşman saldırısını yavaşlatmak için adımlar atmalıyız, böylece batı Rusya'dan bölgeye kuvvet konuşlandırmak için zaman kazanabiliriz."
 SOV_far_east_fortification_forts_10:0 "Japon sınırına §Y10 Kara Kalesi§! ekle.\n"
 SOV_far_east_fortification_forts_4:0 "Japon sınırına §Y4 Kara Kalesi§! ekle.\n"
 SOV_fascist_womens_movement_tt:0 "[GetSovietCivilWarName] başladığında:"
 SOV_fascist_youth_union:0 "Faşist Gençlik Birliği"
 SOV_fascist_youth_union_desc:0 "Geçmişe bakmak yerine, geleceğe, gençlere ve modern teknolojiye bakmalıyız. Genç Faşistler, Rusya'yı eski görkemine kavuşturma arzusuyla yanıyorlar. Deneyimde eksik oldukları şeyi, sırf şevkle fazlasıyla telafi edeceklerdir."
 SOV_fascist_youth_union_tt:0 "§Y[GetSovietCivilWarName]§! başladığında yanınıza katılacak Gençlik Birliği motorize piyade birimlerini toplar."
 SOV_father_of_nations:0 "Milletlerin Babası"
 SOV_father_of_nations_desc:0 "Birliğimiz birçok farklı insanın büyük bir ailesidir ve her ailenin bir başa ihtiyacı vardır. Yoldaş Stalin o baştır, birçok çocuğunun Sosyalist düşüncede eğitilmesini sağlar ve çabalarımızı parlak bir geleceğe yönlendirir. Sert olması gerektiği yerde serttir, ama her zaman adalet ve hakkaniyet duygusuyla yönlendirilir."
 SOV_finish_the_five_year_plan:0 "[GetFinishTheFiveYearPlanName]"
 SOV_finish_the_five_year_plan_alt:0 "Beş Yıllık Planı Kaldır"
 SOV_finish_the_five_year_plan_default:0 "Beş Yıllık Planı Bitir"
 SOV_finish_the_five_year_plan_desc:0 "[GetFinishTheFiveYearPlanDesc]"
 SOV_finish_the_five_year_plan_desc_alt:0 "Sovyet rejiminin beş yıllık planları, ülkenin yoğun sanayileşmesini her şeyin üzerinde önceliklendirdi, o kadar ki Bolşevik baskısının en büyük sembollerinden biri haline geldi. Bu projeyi ortadan kaldırmalı ve sanayileşme için yeni bir ulusal plan hazırlamalıyız."
 SOV_finish_the_five_year_plan_desc_default:0 "İkinci Beş Yıllık Plan, ağır sanayinin gelişimine öncelik veriyor. Sovyetler Birliği, Batı'nın Kapitalist ve Faşist güçleriyle eşleşmek için hızla gelişmelidir."
 SOV_first_moscow_trial_flag:0 "§Y$SOV_the_zinovyevite_terrorist_center$§! odağını tamamladı!"
 SOV_focus_complete_effect_tt:0 "\nOdak tamamlandığında etkiler:"
 SOV_focus_select_effect_tt:0 "Odak başlangıcında anında etki:"
 SOV_for_the_common_good:0 "Ortak İyilik İçin"
 SOV_for_the_common_good_desc:0 "Müttefiklerimizin aldığı kararların temel ilkesi, mümkün olduğunca en iyisini yapmak olmalıdır. Başlangıçta fedakarlıklar anında bir iyileşme ile karşılanmasa bile, uzun vadede bunun en iyisini yaptığı açıkça belirtilmelidir."
 SOV_for_the_common_good_relation:0 "$SOV_for_the_common_good$"
 SOV_foreign_experts:0 "Yabancı Uzmanlar"
 SOV_foreign_experts_desc:0 "Ekonomimizi nasıl iyileştireceğimiz konusunda bize çok şey öğretebilecek birçok yabancı uzman var. Neyse ki, birçoğu kapitalist ve bu nedenle satın alınabilirler."
 SOV_fortify_mongolian_border:0 "Moğol Sınırını Tahkim Et"
 SOV_fortify_mongolian_border_desc:0 "Japon şahinleri şu anda Çin'e gözlerini dikmiş olsalar da, bize saldırarak kazanımlarını genişletmek istemeyeceklerini göz ardı edemeyiz. Moğol Müttefiklerimizin açık bir kanat haline gelmemesini sağlamalıyız."
 SOV_fortify_mongolian_border_forts_tt:0 "[MON.GetFlag]§Y[MON.GetNameDefCap]§!:\n Başkent iline §Y1 Kara Kalesi§! ekle.\n [JAP.GetNameDef] veya bir [JAP.GetAdjective] müttefiki tarafından kontrol edilen bir Çin devletiyle sınırı olan her ile §Y2 Kara Kalesi§! ekle."
 SOV_foster_flying_clubs:0 "Uçuş Kulüplerini Teşvik Et"
 SOV_foster_flying_clubs_desc:0 "Yeni pilotları, eğitime başlamadan önce hiç uçak görmemişlerse eğitmek pahalıdır. Ancak birçok genç insan uçmaktan büyülenir ve biraz destekle, bir uçağı pilotluk yapmanın temellerini zaten biliyorlarsa, hava muharebesinin inceliklerini çok hızlı bir şekilde kavrayabilecek çok yetenekli pilotlara dönüşebilirler."
 SOV_foster_flying_clubs_ns_tt:0 "$SOV_modify_airforce_ns_intro$ \nAs olma şansı: §G+%25.00§! \nHava Filosu Eğitim Deneyimi Kazancı: §G+%10§! \nHava Kazası Olasılığı: §G-%25.0§! \nKötü Hava Cezası: §G-%10.00§! \n\n"
 SOV_found_the_comecon:0 "COMECON'u Kur"
 SOV_found_the_comecon_desc:0 "Savaş, işbirliğimizi ve dostlarımızın ve ortaklarımızın ekonomik gelişimini iyileştirmemiz gerektiğini göstermiştir. Bu amaçla, uluslarımız arasındaki ticareti ve ekonomik gelişimi koordine etmek için bir örgüt kuracağız."
 SOV_found_the_comecon_program_tt:0 "\n§Y[ROOT.GetFlag][ROOT.GetNameDefCap]§! ve §Yher [ROOT.GetAdjective] bağlı devleti§! §Y[GetComeconName]§!'e katılır!\n\n"
 SOV_found_the_comecon_subjects_tt:0 "\nHer [ROOT.GetAdjective] bağlı devleti:\n"
 SOV_found_the_jet_institute:0 "Jet Enstitüsünü Kur"
 SOV_found_the_jet_institute_desc:0 "Mevcut pistonlu motorlar ancak bir yere kadar zorlanabilir. Gelecekteki uçaklar yeni tahrik yöntemlerine güvenmek zorunda kalacak. Yabancı gelişmeler tarafından geçilmediğimizden emin olmak için jet motorları üzerine araştırma yapacak bir enstitü kurmalıyız."
 SOV_found_the_pcdi:0 "[GetFoundThePcdiName]"
 SOV_found_the_pcdi_desc:0 "[GetFoundThePcdiDesc]"
 SOV_found_the_pcdi_desc_alt:0 "Silahlanma sanayimiz çok büyüdü ve daha da büyümesi için artık koordine edecek özel bir devlet dairesine ihtiyacı var. Bir Savunma Sanayii Bakanlığı kuracağız."
 SOV_found_the_pcdi_desc_default:0 "Silahlanma sanayimiz çok büyüdü ve daha da büyümesi için artık koordine edecek özel bir devlet dairesine ihtiyacı var. Savunma Sanayii Halk Komiserliği'ni kuracağız."
 SOV_found_the_pcdi_name_alt:0 "Savunma Sanayii Bakanlığını Kur"
 SOV_found_the_pcdi_name_default:0 "PCDI'yi Kur"
 SOV_found_the_pcdi_ns_tt:0 "(Sivilden Askerî Fabrikaya dönüştürme maliyeti: §G-%20.00§!, Üretim Verimliliği Koruması: §R-%10.00§!, £prod_eff_cap Üretim Verimliliği Sınırı: §G+%5.00§!, £prod_eff Üretim Verimliliği artışı: §R-%5.00§!) veren §Y$SOV_defense_industry_dynamic_modifier$§!'i ekle \n\n"
 SOV_found_the_warsaw_pact:0 "Varşova Paktı'nı Kur"
 SOV_found_the_warsaw_pact_desc:0 "Değişim rüzgarları Avrupa üzerinde eserken, yozlaşmış batıdan gelen herhangi bir saldırıyı savuşturmak için kolektif bir savunma antlaşmasına ihtiyacımız olacağı giderek daha açık hale geliyor. Bu amaçla, COMECON'un askeri tamamlayıcısı olan Varşova Paktı Örgütü'nü resmileştirmeliyiz."
 SOV_fourth_five_year_plan:0 "[GetFourthFiveYearPlanName]"
 SOV_fourth_five_year_plan_alt:0 "Yeni Bir Başlangıç"
 SOV_fourth_five_year_plan_available_tt:0 "[ROOT.GetFlag][ROOT.GetNameDefCap], Üçüncü Beş Yıllık Planı bozan büyük güçle barış içinde. \n§GKoşul karşılandığında bu odak otomatik olarak tamamlanacaktır§!."
 SOV_fourth_five_year_plan_default:0 "Dördüncü Beş Yıllık Plan"
 SOV_fourth_five_year_plan_desc:0 "Savaşın aksaklıklarının tamamen giderilmesi biraz zaman alacak, ancak doğru hedefleri belirleyerek şimdiden bazı verimlilik artışları elde edebiliriz."
 SOV_fourth_five_year_plan_ns_tt:0 "$SOV_modify_fyp_ns_intro$ \nTüketim Malları Fabrikaları Faktörü: §Y-%5.0§! \nFabrika Tamir Hızı: §G+%5.00§! \n£prod_eff_cap Üretim Verimliliği Sınırı: §G+%2.00§! \n\n"
 SOV_freedom_of_debate_unity_of_action:0 "Tartışma Özgürlüğü - Eylem Birliği"
 SOV_freedom_of_debate_unity_of_action_desc:0 "Bir ülkeyi yönetmenin ve onu doğru yolda yönlendirmenin karmaşıklıkları çoktur ve bu nedenle alternatiflerin açıkça tartışılabilmesi gerekir. Ancak bir karar verildikten sonra, politbüronun her üyesinin ve aslında tüm partinin bu kararı çekincesiz desteklemesi görevidir."
 SOV_freedom_of_debate_unity_of_action_ns_tt:0 "$SOV_modify_the_politburo_ns_intro$ \nSiyasi Güç Kazancı: §G+%5§! \nSiyasi Danışman Maliyeti: §G-%15§! \n\n"
 SOV_funds_for_the_cause:0 "Dava İçin Fonlar"
 SOV_funds_for_the_cause_desc:0 "$SOV_lev_trotsky$ ve diğerlerinin yurtdışında olması kesinlikle bizim avantajımıza olabilir. Dünya çapında sosyalist bağış toplama etkinlikleri düzenlemeli ve aynı zamanda hükûmetleri gizlice silahlarla bizi desteklemeye ikna etmeye çalışmalıyız."
 SOV_funds_for_the_cause_tt:0 "İç Savaş başladığında 365 gün boyunca §Y$SOV_foreign_funds_idea$§! fikrini ekler."
 SOV_fyp_controlled_factories_tier_1_tt:0 "$TRIGGER_NUM_OF_TOTAL_CONTROLLED_FACTORIES_MORE_THAN$§Y[?ROOT.SOV_fyp_factory_requirement_tier_1]§! (Şu anda §[GetColorControlledFactoriesTier1][?ROOT.num_of_controlled_factories]§!)"
 SOV_fyp_controlled_factories_tier_2_tt:0 "$TRIGGER_NUM_OF_TOTAL_CONTROLLED_FACTORIES_MORE_THAN$§Y[?ROOT.SOV_fyp_factory_requirement_tier_2]§! (Şu anda §[GetColorControlledFactoriesTier2][?ROOT.num_of_controlled_factories]§!)"
 SOV_fyp_controlled_factories_tier_3_tt:0 "$TRIGGER_NUM_OF_TOTAL_CONTROLLED_FACTORIES_MORE_THAN$§Y[?ROOT.SOV_fyp_factory_requirement_tier_3]§! (Şu anda §[GetColorControlledFactoriesTier3][?ROOT.num_of_controlled_factories]§!)"
 SOV_fyp_controlled_factories_tier_4_tt:0 "$TRIGGER_NUM_OF_TOTAL_CONTROLLED_FACTORIES_MORE_THAN$§Y[?ROOT.SOV_fyp_factory_requirement_tier_4]§! (Şu anda §[GetColorControlledFactoriesTier4][?ROOT.num_of_controlled_factories]§!)"
 SOV_fyp_controlled_factories_tier_5_tt:0 "$TRIGGER_NUM_OF_TOTAL_CONTROLLED_FACTORIES_MORE_THAN$§Y[?ROOT.SOV_fyp_factory_requirement_tier_5]§! (Şu anda §[GetColorControlledFactoriesTier5][?ROOT.num_of_controlled_factories]§!)"
 SOV_gain_support_from_party_members:0 "Parti Üyelerinden Destek Kazan"
 SOV_gain_support_from_party_members_desc:0 "Stalin'in kuklalarından bazıları, sadece korktukları için öyledir. Planımızın başarılı olacağına ve gerçekten çok ağır bir iş yapmadan kahraman olabileceklerine onları ikna etmeliyiz. Yolları var..."
 SOV_gain_support_from_party_members_tt:0 "§Y$SOV_vsevolod_merkulov$§!, §Y$SOV_mikhail_kalinin$§! ve §Y$SOV_nikita_khrushchyov$§!, İç Savaş başladığında muhalefete katılır.\nİç Savaş başladığında §G+%10§! İstikrar"
 SOV_great_commander:0 "Büyük Komutan"
 SOV_great_commander_desc:0 "Yoldaş Stalin'in askerî teori ve liderlikteki başarıları saymakla bitmez. Hain Troçki Kızıl Ordu'yu kurmuş olabilir, ancak onu işçi sınıfının başarılarını savunmak için etkili bir güce dönüştüren Yoldaş Stalin'dir."
 SOV_ground_support:0 "Yer Desteği"
 SOV_ground_support_desc:0 "Hava kuvvetlerimizin birincil görevi, kara kuvvetlerimizin desteği olmalıdır. Bu temel gerçek, alınan her kararı etkilemelidir."
 SOV_ground_support_ns_tt:0 "$SOV_modify_airforce_ns_intro$ \nYer desteği: §G+%10.00§! \n\n"
 SOV_heavy_industry:0 "Ağır Sanayi"
 SOV_heavy_industry_desc:0 "Sanayileşme projelerimiz hız kazanmaya devam ederken, daha fazla savaş malzemesi üretmeye hazırlanmak için ağır sanayiye daha fazla önem verme zamanı geldi."
 SOV_if_poum_wins_tt:0 "\nEğer §YPOUM'cu $SPC_communism_DEF$§! İspanyol İç Savaşı'nı kazanırsa, kendi iç savaşımızda bize yardım etmek için bir dizi İspanyol tümeni gelecektir."
 SOV_impregnable_forts:0 "Aşılmaz Kaleler"
 SOV_impregnable_forts_desc:0 "[ROOT.GetAdjective] mühendisliği şimdi gerçekten korkunç tahkimatlar yaratma yeteneğine sahip, en ağır bombardımana bile kolayca dayanabilen ve bir saldırıda alınması neredeyse imkansız olan. Geniş mühimmat ve malzeme stoklarıyla, bu kaleler gerekirse yıllarca düşman saldırısına karşı dayanacaktır."
 SOV_improve_the_stalin_line:0 "[GetImproveTheStalinLineName]"
 SOV_improve_the_stalin_line_desc:0 "Batı sınırımız bütünüyle tahkim etmek için çok uzun. Ancak herhangi bir düşman saldırısını tahmin edilebilir alanlara yönlendiren bir dizi tahkimat inşa edebiliriz, burada onlara toplu kuvvetlerle kolayca karşı saldırı yapabiliriz."
 SOV_improve_the_stalin_line_name_alt:0 "Batı Savunma Hattını Güçlendir"
 SOV_improve_the_stalin_line_name_default:0 "Stalin Hattını İyileştir"
 SOV_incorporate_local_organizations:0 "Yerel Organizasyonları Dahil Et"
 SOV_incorporate_local_organizations_desc:0 "Yerel organizasyonlar genellikle işçilerin karşılaştığı sorunları başkentteki insanlardan daha iyi anlar. Bakanların ve diğer üst düzey parti üyelerinin rolünü azaltmalı ve yerellere daha fazla güç vermeliyiz."
 SOV_increase_aircraft_production:0 "Uçak Üretimini Artır"
 SOV_increase_aircraft_production_desc:0 "Son zamanlarda güvenliğe aşırı bir vurgu yapıldı ve bu, yeni uçakların üretim sayılarını olumsuz etkilemeye başladı. En aşırı güvenlik sistemlerini ortadan kaldırarak önemli miktarda kaynak tasarrufu yapabiliriz, aynı zamanda çok güvenli ve yetenekli bir hava kuvveti sürdürebiliriz."
 SOV_increase_aircraft_production_ns_tt:0 "$SOV_modify_airforce_ns_intro$ \nHava Kazası Olasılığı: §R+%5.0§! \n §YTüm uçak türleri§!:  Üretim Maliyeti: §G-%5.00§! \n\n"
 SOV_increase_state_reserves:0 "Devlet Rezervlerini Artır"
 SOV_increase_state_reserves_desc:0 "Büyüyen sanayimiz giderek daha fazla kaynağa aç. Kaynak üretimindeki artışın ayak uydurduğundan her zaman emin olamayız ve elimizden geldiğince rezervler oluşturmalıyız."
 SOV_increase_state_reserves_ns_tt:0 "$SOV_modify_fyp_ns_intro$ \n Kaynak Kazanma Verimliliği: §G+%10§!"
 SOV_increase_state_reserves_silo_tt:0 "\nÜç rastgele eyalet: \n§G1§! İnşaat Yuvası Ekle. \n§Y1 Yakıt Silosu§! Ekle."
 SOV_increase_weekly_paranoia_in_trait_tt:0 "§Y[ROOT.GetLeader]§!: §Y$stalin_political_paranoia$§! özelliğini değiştir: \n£SOV_paranoia_text_icon Haftalık Siyasi Paranoya: §R+1§!"
 SOV_industrial_modernization:0 "Sanayi Modernizasyonu"
 SOV_industrial_modernization_desc:0 "Batı ülkeleri hızla yeni üretim yöntemleri uyguluyor ve yeni teknolojiler tanıtıyor. Onlarla sadece ayak uydurmakla yetinemeyiz - onları geçmeliyiz!"
 SOV_industrial_modernization_ns_tt:0 "$SOV_modify_fyp_ns_intro$ \n£prod_eff_cap Üretim Verimliliği Sınırı: §G+%5.00§! \nÜretim Verimliliği Koruması: §G+%10.00§! \n\n"
 SOV_infiltrate_the_nkvd:0 "NKVD'ye Sız"
 SOV_infiltrate_the_nkvd_coup_tt:0 "Stalin'e yönelik başarılı bir suikast girişiminin şansını artırır."
 SOV_infiltrate_the_nkvd_desc:0 "NKVD'nin er ve erbaşları, Stalin'in kirli işlerini yapan ve genellikle onun sadık hizmetkârları olarak hareket edenlerdir. Ama bir duvarın bile çatlakları vardır. Mümkün olduğunca çoğunun bizim için çalışmasını sağlamalıyız, böylece tirana yanlış bilgi besleyebilirler."
 SOV_infiltrate_the_nkvd_tt:0 "NKVD kuvvetlerinin bir kısmının §Y[GetSovietCivilWarName]§!'de davanıza katılmasını sağlayacaktır.\n $SOV_expand_nkvd_opposition$ §Ykararının§! kilidini açar"
 SOV_infrastructure_effort_nsb:0 "Altyapı Çabası"
 SOV_infrastructure_effort_nsb_desc:0 "$SOV_infrastructure_effort_desc$"
 SOV_inheritor_of_the_mantle_of_lenin:0 "Lenin'in Mirasının Vârisi"
 SOV_inheritor_of_the_mantle_of_lenin_desc:0 "Yoldaş Stalin her zaman Lenin'in en yakın yoldaşı ve en güvendiği müridi olmuştur. Lenin'in öğretilerinin en sadık takipçisi olarak, ulusu Komünizme doğru yönlendirme ve kaçınılmaz küresel işçi devrimine hazırlanma gibi ağır görevi devralması doğaldır."
 SOV_integrate_smirnovs_bloc:0 "Smirnov'un Bloğunu Entegre Et"
 SOV_integrate_smirnovs_bloc_desc:0 "Stalinist baskıya muhalefetleri nedeniyle yakın zamanda tutuklanıp hapse atılan bir avuç eski Troçkistimiz var. Doğru kulaklara birkaç iyi seçilmiş sözle, serbest bırakılıp sürgüne gönderilmelerini sağlayabiliriz, burada Siyasi Paranoyadan güvende olurken organize olabilirler. Kimin kaçmalarına yardım ettiğini unutmayacaklar."
 SOV_integrate_smirnovs_bloc_tt:0 "§Y$SOV_ivan_smirnov$§!, §Y$SOV_ivar_smilga$§! ve §Y$SOV_aleksandr_shlyapnikov$§! hapisten kurtarılıp sürgüne gönderilecek (§Gsürgündeki karakterler tasfiye edilemez§!). İç Savaş patlak verdiğinde danışman olarak kullanılabilir hale gelecekler.\nİki eyalette Sol Muhalefet desteği ekler."
 SOV_intensify_pilot_training_program:0 "Pilot Eğitim Programını Yoğunlaştır"
 SOV_intensify_pilot_training_program_desc:0 "Rekabetçi olmak için, Hava Kuvvetlerimiz her koşulda uçabilmeli ve savaşabilmelidir. Bunu başarmanın en iyi yolu, pilotlarımızı en yüksek standarda göre eğitmektir. Sayı veya teknik gelişmişlikte eksik olabileceklerimizi, sırf beceriyle telafi edeceğiz."
 SOV_intensify_pilot_training_program_ns_tt:0 "$SOV_modify_airforce_ns_intro$ \nAs olma şansı: §G+%15§! \nÖldürüldüğünde Hava Filosu Deneyim kaybı: §G-%15§! \nHava Kazası Olasılığı: §G-%25.0§! \nGece Operasyonları Cezası: §G-%10.00§! \nKötü Hava Cezası: §G-%15.00§! \nHava Yakıt Tüketimi: §R+%10.00§!\n\n"
 SOV_international_revolutionary_marxist_centre:0 "Uluslararası Devrimci Marksizm"
 SOV_international_revolutionary_marxist_centre_allies_tt:0 "\n[ROOT.GetName] ile barış içinde olan her bağımsız, Stalinist olmayan komünist ulus: "
 SOV_international_revolutionary_marxist_centre_desc:0 "Üçüncü Enternasyonal, Stalinist totalitarizme düştü ve muhtemelen kurtarılamaz. Dünya komünist partilerine koordine olmak ve işbirliği yapmak için yeni bir yol sunmalıyız."
 SOV_international_revolutionary_marxist_centre_faction_name:0 "Uluslararası Devrimci Marksist Merkez"
 SOV_international_revolutionary_marxist_centre_marxism_tt:0 "Ülke liderleri $marxism$ alt ideolojisini benimser."
 SOV_international_revolutionary_marxist_centre_no_allies_tt:0 "\n[ROOT.GetName] ile barış içinde olan her bağımsız, Stalinist olmayan komünist ulus: \n  §Y$SOV_international_socialist_association$§! kazanır (§Y[ROOT.GetFlag][ROOT.GetName]§! görüşü §G+40§!.)\n  '§Y[ROOT.GetNameDefCap] bizi [ROOT.GetFactionName]'e davet ediyor§!' olayını alır."
 SOV_international_revolutionary_marxist_centre_stalinists_lacking_tt:0 "Her Stalinist ulus: \n §Y$SOV_international_socialist_association$§! kazanır (§Y[ROOT.GetFlag][ROOT.GetName]§! görüşü §R-40§!.)"
 SOV_international_revolutionary_marxist_centre_stalinists_tt:0 "Her Stalinist ulus: "
 SOV_international_union_of_soviet_republics:0 "Uluslararası Sovyet Cumhuriyetleri Birliği"
 SOV_international_union_of_soviet_republics_desc:0 "Devrimimize yönelik en büyük ihanet, sosyalizmin tek bir ülkede inşa edilebileceği - veya gerçekten de inşa edilmesi gerektiği - fikriydi. Ya tüm ülkelerdeki tüm işçiler birlikte sosyalizmi başaracak ya da hiçbiri başaramayacak. Devrim farklı ülkelerde farklı aşamalarda olsa da, işçilerin hükûmeti kontrol ettiği tüm müttefik ülkelerde ilerlemesini sağlamak için kaynaklarımızı paylaşacağız."
 SOV_international_union_of_soviet_republics_puppet_tt:0 "Başkent eyaletine §Y1 Sivil Fabrika§! ekle."
 SOV_international_union_of_soviet_republics_tt:0 "§Y$SOV_factionalism_modifier$§!'ı değiştirir:\nEfendi ticaret maliyeti: §G-%10§!\nParti Popülerliği İstikrar Etkeni: §G+%10§!\n"
 SOV_intervention_in_china:0 "Çin'e Müdahale"
 SOV_intervention_in_china_chi:0 "[CHI.GetFlag][CHI.GetNameDef]"
 SOV_intervention_in_china_default:0 "desteklenen Çinli fraksiyon"
 SOV_intervention_in_china_desc:0 "Çin'deki durum, güvenliğimiz için bir tehdit haline gelecek noktaya kadar kötüleşti. Müdahale etmeli ve bölgeye güvenilir bir hükûmet yerleştirmeliyiz."
 SOV_intervention_in_china_prc:0 "[PRC.GetFlag][PRC.GetNameDef]"
 SOV_intervention_in_china_sik:0 "[SIK.GetFlag][SIK.GetNameDef]"
 SOV_intervention_in_china_wargoal_tt:0 "§Y[GetAppropriateSupportedChineseFaction]§! §Gdışındaki§! her Çinli fraksiyona karşı §Y$puppet_wargoal_focus$§! savaş hedefi kazanır."
 SOV_intervention_in_the_americas:0 "Amerika'ya Müdahale"
 SOV_intervention_in_the_americas_desc:0 "Karayipler'in ve genel olarak Latin Amerika'nın birçok küçük ulusu uzun zamandır istikrarsız hükûmetlerden muzdarip. Siyasi kaslarımızı esnetme ve onların iç siyasi evrimlerini güç ve istikrar yönünde 'teşvik etme' zamanı geldi. Bizimkine benzer hükûmetler geliştirdiklerinde, büyüyen askerî ittifakımızda onlara bir yer teklif edilecek."
 SOV_intervention_in_the_americas_tt:0 "Etkilenen ülkelerin Faşist olma olasılığı daha yüksektir.\nBu etkinin bir sonucu olarak Faşist olan ülkeler ittifakımıza davet edilecektir."
 SOV_into_central_asia:0 "Orta Asya'ya"
 SOV_into_central_asia_desc:0 "Orta Asya'nın fethi bizi Hindistan'ı tehdit etme konumuna getirecek, aynı zamanda Basra Körfezi'ne erişim sağlayacaktır. Stratejik gereklilik açıktır ve bizimki burada mezarını bulmayacak bir imparatorluktur."
 SOV_japanese_overtures:0 "Japon Girişimleri"
 SOV_japanese_overtures_desc:0 "Şimdi batı kanadımız güvence altına alındığına göre, doğu kanadımıza bakmalıyız. Japonların Almanlarla çok ortak noktası var ve kendi yeni hükûmetimizle kabul etmek isteyebileceklerinden daha fazla ortak noktaları var. Almanlara onlara bir davetiye uzatma konusunda ne düşündüklerini soralım."
 SOV_keep_commissars_organization:0 "Komiserler Organizasyonunu Koru"
 SOV_keep_commissars_organization_desc:0 "Yeni organizasyonumuzda bile, ordunun hükûmete kesinlikle sadık kalmasını sağlayacak insanlara ihtiyaç var. Eğer askerler hükûmete olan güvenlerini kaybederse, bu savaşı kaybederiz ve hızla kaybederiz."
 SOV_keep_commissars_organization_ns_tt:0 "$SOV_modify_the_red_army_ns_intro$ \nTümen Organizasyonu: §G+%5.0§! \nTümen Toparlanma Oranı: §R-%10.0§! \nAzami Komuta Gücü Artışı: §G+50§! \n\n"
 SOV_last_purge_focus_days_cult_tt:0 "Mevcut günler: [?SOV_third_moscow_trial_flag:days|Y0]"
 SOV_last_purge_focus_days_military_tt:0 "Mevcut günler: [?SOV_second_moscow_trial_flag:days|Y0]"
 SOV_last_purge_focus_days_rights_tt:0 "Mevcut günler: [?SOV_trial_of_the_generals_flag:days|Y0]"
 SOV_last_purge_focus_days_tt:0 "Mevcut günler: [?SOV_first_moscow_trial_flag:days|Y0]"
 SOV_latvian_claimed_states_tt:0 "[ROOT.GetNameDefCap], §Ytüm [LAT.GetAdjective] çekirdekleri§! üzerinde hak iddia eder."
 SOV_leader_of_the_party_and_the_people:0 "Partinin ve Halkın Lideri"
 SOV_leader_of_the_party_and_the_people_desc:0 "Yoldaş Stalin ağır görevlerini titizlik ve beceriyle yerine getirdi ve hem partinin hem de halkın çekincesiz ve bölünmemiş desteğine sahiptir. Herhangi bir kibir veya kendini beğenmişlik ipucu ona yabancıdır; o belki de yaşayan en alçakgönüllü kişidir."
 SOV_leader_of_the_party_and_the_people_trait_tt:0 "§Y[ROOT.GetLeader]§!: Uygun özelliği (§Y$stalin_inheritor_of_lenin$§! veya §Y$stalin_servant_of_lenin$§!) değiştir: \nParti Popülerliği İstikrar Etkeni: §G+%15.00§! \nSavunma Savaşı Cezası İstikrar Etkeni: §G+%40.00§! \nSiyasi Danışman Maliyeti: §G-%25§!\n"
 SOV_left_eliminate_right:0 "Sağı Tasfiye Et"
 SOV_left_eliminate_right_desc:0 "Parti içinde birbiriyle tamamen uyumsuz fraksiyonlar var. Hükûmeti devralıp devrimi tekrar rayına oturtacaksak, onların müdahaleleriyle dikkatimizin dağılmasını göze alamayız. Ama eğer 'Yoldaş' Stalin savaşacak iç düşmanlar arıyorsa, ona bakması için bazı insanları suçlayabiliriz..."
 SOV_left_eliminate_right_tt:0 "§Y$SOV_nikolay_bukharin$§!, §Y$SOV_aleksey_rykov$§! ve §Y$SOV_mikhail_tomsky$§!, Stalin tarafından bir tasfiye için potansiyel hedefler haline gelir."
 SOV_left_opposition_civil_war_name:0 "Sovyet İç Savaşı"
 SOV_left_opposition_coup:0 "Alevleri Ateşle"
 SOV_left_opposition_coup_desc:0 "Zaman geldi. Zalime karşı sancakları yükseltelim. Devrim yeniden başlayacak!"
 SOV_left_opposition_coup_tt:0 "Ordu, Donanma ve Hava Kuvvetlerinde Sol Muhalefet için destek ekler.\n§YSovyet İç Savaşı'nı§! başlatır. "
 SOV_left_opposition_name:0 "Sol Muhalefet"
 SOV_left_purges:0 "Karşı-Devrimcileri Ortadan Kaldır"
 SOV_left_purges_desc:0 "Stalin'e karşı kin besleyen birçok kişi daha var. Kuralımızı hala pekiştirirken, bu insanların karşı-devrimci hücreler oluşturmaya başlamalarına izin vermemeliyiz, yoksa kısa sürede başka bir iç savaşla karşı karşıya kalırız."
 SOV_left_purges_tt:0 "Sağ Muhalefet danışmanları kaldırılacak"
 SOV_left_right_purges_factionalism_tt:0 "§Y$SOV_factionalism_modifier$§!'dan Siyasi Güç Etkenini kaldırır!"
 SOV_leningrad_polytechnical_institute:0 "[195.GetName] Politeknik Enstitüsü"
 SOV_leningrad_polytechnical_institute_desc:0 "En önde gelen mühendislik okulumuz olarak, [195.GetName] Politeknik Enstitüsü uzun zamandır ülkemize mühendisler ve endüstriyel tasarımcılar sağlamıştır. Büyüyen endüstrilerimizdeki herhangi bir yeni pozisyonu doldurmak için her zaman en iyi insanlara sahip olduğumuzdan emin olmak için onu daha da genişletmeliyiz."
 SOV_lessons_of_war:0 "Savaşın Dersleri"
 SOV_lessons_of_war_cowed_trait_tt:0 "\n§Y$trait_SOV_cowed_by_stalin_army$§! özelliğine sahip §Yher ordu ve donanma lideri§!: \n  §Y$trait_SOV_cowed_by_stalin_army$§!'ı kaybeder:\n   - Tümen Toparlanma Oranı: §R-%10.0§! \n   - Takviye Oranı: §R-%2.0§!\n"
 SOV_lessons_of_war_desc:0 "Savaştan önce sahip olduğumuz planların çoğu, düşmanla temasta hayatta kalmadı. Bu savaşın bize öğrettiği derslere açık olmalı ve modası geçmiş dogmalara bağlı kalmamalıyız. Ancak o zaman geri çekilmemizi durdurabilir ve tekrar taarruza geçebiliriz."
 SOV_lessons_of_war_ns_tt:0 "§Y$SOV_the_red_army_dynamic_modifier$§! öğesini şu şekilde değiştir: \nTümen Organizasyonu: §G+5.0%§! \nDeneyimli asker kayıpları: §G-25.0%§!\n"
 SOV_lessons_of_war_unlock_military_operations_tt:0 "§Y$SOV_order_227$§!'i etkinleştirmek, sırayla §YAskerî Taarruzlar§! hazırlama ve yürütme kararlarının kilidini açacaktır."
 SOV_liberate_ryutin:0 "Ryutin'i Kurtar"
 SOV_liberate_ryutin_desc:0 "Yoldaş Ryutin, Stalin'in birçok kusurunu ve eksikliğini dile getirmekten asla çekinmedi. Stalin'in ondan bir örnek çıkarmaya karar vermesi belki de şaşırtıcı değil. Ancak şimdi, Stalin gidene kadar onu yurtdışına taşımak için bazı ipleri çekmeliyiz ki, Stalin gittikten sonra ülkeyi yönetmemize yardımcı olabilsin."
 SOV_liberate_ryutin_tt:0 "§Y$SOV_martemyan_ryutin$§! hapisten kurtarılıp sürgüne gönderilecek (§Gsürgündeki karakterler tasfiye edilemez§!). İç savaş başladığında danışman olarak kullanılabilir hale gelecek ve destekçileri muhalefete katılacak."
 SOV_liberation_of_the_european_proletariat:0 "Avrupa Proletaryasının Kurtuluşu"
 SOV_liberation_of_the_european_proletariat_desc:0 "Batı Avrupa'daki omurgasız burjuva hükûmetleri, faşizme karşı durmaya tamamen isteksiz olduklarını gösterdiler. Gelecek olan faşizm ve komünizm arasındaki büyük mücadelede, onlar bir rol oynamayacaklar. Ancak, bu ülkelerdeki işçiler, faşizm belasına karşı bizimle savaşmaya istekliler. Onlara sadece savaşmaya istekli hükûmetler vermeliyiz."
 SOV_lithuanian_claimed_states_tt:0 "[ROOT.GetNameDefCap], §Ytüm [LIT.GetAdjective] çekirdekleri§! üzerinde hak iddia eder."
 SOV_long_live_the_workers_government:0 "Yaşasın İşçi Hükûmeti"
 SOV_long_live_the_workers_government_desc:0 "Şimdi işçi sınıfının gerçek kurtuluşuna giden uzun yola başladığımıza göre, bir seçkinler hükûmetini diğeriyle değiştirme cazibesine kapılmamalıyız. Birliğimizin hükûmeti her zaman işçilerin, işçiler tarafından ve işçiler için gerçek bir hükûmet olmalıdır."
 SOV_long_range_aircraft:0 "Uzun Menzilli Uçak"
 SOV_long_range_aircraft_desc:0 "Teknoloji, bombardıman uçaklarımızın düşmanın vatanındaki her noktaya ulaşabileceği ve kısa sürede savaşma kapasitelerini yok edebileceği noktaya kadar ilerledi. Ordu öncelikle bu başarılana kadar hattı tutmak için var."
 SOV_long_range_aircraft_ns_tt:0 "$SOV_modify_airforce_ns_intro$ \nStratejik bombardıman görünürlüğü: §G-%10§! \n\n"
 SOV_long_range_raiders:0 "Uzun Menzilli Akıncılar"
 SOV_long_range_raiders_desc:0 "Donanma üslerimizden ana nakliye yollarına olan mesafe nedeniyle, mevcut denizaltılarımız zengin avlanma alanlarına ulaşmakta zorlanacaktır. Düşmanlarımıza en çok zarar veren yerlerde saldırabilmemizi sağlamak için daha uzun menzilli denizaltılar geliştirmeliyiz."
 SOV_major_purge_tt:0 "En az bir büyük tasfiye gerçekleşti."
 SOV_memories_of_1905:0 "1905 Anıları"
 SOV_memories_of_1905_desc:0 "1905 savaşı hala halkımızın kolektif hafızasında kara bir lekedir. Bundan yararlanmalı ve işçileri Pasifik'e hükmedebileceğimiz yeni bir filo yaratmak için anıtsal bir çabaya teşvik etmeli ve eski düşmanlarımıza karşı intikamımızı almak için kullanma çağrısı yapmaları için nefretlerinin alevlerini körüklemeliyiz."
 SOV_merge_aircraft_plants:0 "Uçak Tesislerini Birleştir"
 SOV_merge_aircraft_plants_desc:0 "Tasarımcılar arasındaki rekabet sürekli gelişmek için doğal bir teşvik yaratsa da, aynı zamanda göze alamayacağımız yinelenen çabalarla kaynakları tüketir. Bu israfı ortadan kaldırmak için tasarım bürolarımızı birleştirmeliyiz."
 SOV_merge_aircraft_plants_tt:0 "Uçak Tasarımcıları için §YTesis Birleştir§! kararlarının kilidini açar, bu da bonuslarını iyileştirmek için farklı tesisleri aktif Uçak Tasarımcısına birleştirmemize olanak tanır."
 SOV_merge_naval_plants:0 "Donanma Tesislerini Birleştir"
 SOV_merge_naval_plants_desc:0 "Donanma inşaatı ve gemi tasarımı, aşırı rekabetin basitçe verimsiz olduğu zaman alıcı bir süreçtir. Bu çaba israfını ortadan kaldırmak için tasarım bürolarımızı birleştirmeliyiz."
 SOV_merge_naval_plants_tt:0 "Donanma Tasarımcıları için §YTesis Birleştir§! kararlarının kilidini açar, bu da bonuslarını iyileştirmek için farklı tesisleri aktif Donanma Tasarımcısına birleştirmemize olanak tanır."
 SOV_merge_tank_and_materiel_plants:0 "Tank ve Malzeme Tesislerini Birleştir"
 SOV_merge_tank_and_materiel_plants_desc:0 "Tanklar ve topçu, muhtemelen ölçek ekonomisinden yararlanarak seri üretime en uygun olanlardır. Bu nedenle, bundan yararlanmak için tank ve malzeme üreticilerinin bir konsolidasyonunu zorlamalıyız."
 SOV_merge_tank_and_materiel_plants_tt:0 "Tank ve Malzeme Tasarımcıları için §YTesis Birleştir§! kararlarının kilidini açar, bu da bonuslarını iyileştirmek için farklı tesisleri aktif Tank veya Malzeme Tasarımcısına birleştirmemize olanak tanır."
 SOV_middle_east_diplomacy:0 "Orta Doğu Diplomasisi"
 SOV_middle_east_diplomacy_desc:0 "Arap yarımadasında ve Asya'da konumumuzu geliştirmek için birçok fırsat var. İngilizlerle büyük oyun bir başka tura çıkmak üzere."
 SOV_military_engineering_university:0 "Askerî Mühendislik Üniversitesi"
 SOV_military_engineering_university_desc:0 "Birçoğu tank ve uçağın gelişmesinin ardından siper savaşının sonunu ilan ederken, askerî mühendisliğin modern savaş alanında hala bir yeri olduğu açıktır. Modern saha tahkimatları inşa etmenin modern yöntemlerini incelemek için bir enstitü kurmalıyız."
 SOV_military_engineering_university_ns_tt:0 "$SOV_modify_defense_industry_ns_intro$ \nAzami Mevzilenme: §G+%5.0§! \n §YKara Kalesi§! inşaat hızı: §G+%5.00§! \n §YKıyı Kalesi§! inşaat hızı: §G+%5.00§! \n\n"
 SOV_military_reorganization:0 "Askerî Yeniden Düzenleme"
 SOV_military_reorganization_desc:0 "Büyük bir mekanize ordu kurma girişimlerimiz asil idi, ancak karşılayabileceğimizden daha fazlasıydı. Bu savaşı kazanmak için, yüzyıllardır Rus ordularını zafere taşıyan silahlara odaklanmamız gerekecek: Piyade ve Topçu. Bu, mevcut oluşumları bir dereceye kadar bozmamızı zorunlu olarak gerektirecektir."
 SOV_military_reorganization_ns_tt:0 "\n$SOV_modify_the_red_army_ns_intro$ \nPiyade Birimi Tasarım Maliyeti: §G-%10.00§! \nTopçu Birimi Tasarım Maliyeti: §G-%10.00§! \n\n"
 SOV_military_support:0 "Askerî Destek"
 SOV_military_support_desc:0 "Silahlı kuvvetler içinden destek almak değerli olabilir, bu Stalin'in muhbirlerinin komplomuzu haber alması riskini taşısa bile. Umarım bu olduğunda onun için zaten çok geç olur."
 SOV_military_support_tt:0 "İç Savaş durumunda Silahlı kuvvetlerden gelen destek miktarını artırır.\nDaha fazla destek toplamak için Kararların kilidini açar."
 SOV_mine_warfare:0 "Mayın Harbi"
 SOV_mine_warfare_desc:0 "Tüm kıyı şeridimizi gemilerle savunmaya çalışmak ekonomik değildir. Stratejik konumlara mayın tarlaları döşeyerek kıyılarımıza yaklaşmaya çalışan herhangi bir düşman filosunu caydırabilir veya en azından hasar verebiliriz."
 SOV_modernize_aircraft_facilities:0 "Havacılık Tesislerini Modernleştir"
 SOV_modernize_aircraft_facilities_desc:0 "Dünyanın en iyi uçağı, engebeli pistlerden kalkmak ve sızdıran hangarlarda bakım görmek zorunda kalırsa yakında işe yaramaz hale gelecektir. Mümkün olan en iyi performansı sağlamak için, mümkün olan en iyi altyapıya da sahip olmalıyız."
 SOV_modernize_aircraft_facilities_ns_tt:0 "$SOV_modify_airforce_ns_intro$ \nHava Menzili: §G+%5§! \nHava Çevikliği: §G+%5§! \nHava Yakıt Tüketimi: §G-%5.00§! \n\n"
 SOV_modernize_aircraft_facilities_tt:0 "Eğer §Y[260.GetName]§!'de başka §YDeneysel Tesis§! yoksa, §Y[260.GetName]§!'de §G1§! §YAerodinamik ve Aviyonik Tesisi§! kazanacağız."
 SOV_modernize_the_far_eastern_fleet:0 "Uzak Doğu Filosunu Modernleştir"
 SOV_modernize_the_far_eastern_fleet_desc:0 "Tsuşima bize sayıların ağırlığına güvenemeyeceğimizi öğretti. Bir deniz angajmanında günü gerçekten kazanmak için, iyi eğitimli mürettebatlara ve onların yelken açacağı kusursuz, modern savaş gemilerine ihtiyacımız var. İnşa ettiğimiz yeni filo, Pasifik'teki teknolojik olarak gelişmiş rakiplerimizle başa çıkabilmelidir."
 SOV_modify_airforce_ns_intro:0 "[GetSovietAirforceNsName]'i şu şekilde değiştir:"
 SOV_modify_airforce_ns_intro_name_alt:0 "§Y$SOV_soviet_airforce_dynamic_modifier_alt$§!"
 SOV_modify_airforce_ns_intro_name_default:0 "§Y$SOV_soviet_airforce_dynamic_modifier$§!"
 SOV_modify_defense_industry_ns_intro:0 "§Y$SOV_defense_industry_dynamic_modifier$§!'ı şu şekilde değiştir:"
 SOV_modify_fyp_ns_intro:0 "§Y[GetAppropriateFYPName]§!'i değiştir:"
 SOV_modify_fyp_ns_intro_alt_ns_name:0 "$SOV_third_five_year_plan_dynamic_modifier_alt$"
 SOV_modify_fyp_ns_intro_default_ns_name:0 "$SOV_third_five_year_plan_dynamic_modifier$"
 SOV_modify_red_fleet_ns_intro:0 "§Y[GetAppropriateRedFleetNsName]§!'i şu şekilde değiştir:"
 SOV_modify_the_politburo_ns_intro:0 "§Y$SOV_the_politburo_good_dynamic_modifier$§!'ı şu şekilde değiştir:"
 SOV_modify_the_red_army_ns_intro:0 "§Y[GetAppropriateRedArmyNsName]§!'i şu şekilde değiştir:"
 SOV_modify_the_red_army_ns_name_alt:0 "$SOV_the_red_army_dynamic_modifier_alt$"
 SOV_modify_the_red_army_ns_name_default:0 "$SOV_the_red_army_dynamic_modifier$"
 SOV_molotov_line_forts_2:0 "§Y2 Kara Kalesi§! $SOV_molotov_line_forts_where$ ekle"
 SOV_molotov_line_forts_3:0 "§Y3 Kara Kalesi§! $SOV_molotov_line_forts_where$ ekle"
 SOV_molotov_line_forts_4:0 "§Y4 Kara Kalesi§! $SOV_molotov_line_forts_where$ ekle"
 SOV_molotov_line_forts_5:0 "§Y5 Kara Kalesi§! $SOV_molotov_line_forts_where$ ekle"
 SOV_molotov_line_forts_6:0 "§Y6 Kara Kalesi§! $SOV_molotov_line_forts_where$ ekle"
 SOV_molotov_line_forts_where:0 "sınırda.\n"
 SOV_move_industry_to_the_urals:0 "Sanayiyi Urallara Taşı"
 SOV_move_industry_to_the_urals_desc:0 "Savaş bize geldi ve vatan tehdit altında. Kuvvetlerimiz son kurşuna kadar bir karış toprak vermeden savaşacak olsa da, bize karşı dizilen kuvvetler göz önüne alındığında bunun yeterli olacağını garanti edemeyiz. Fabrikaları ele geçirilmeden önce güvenliğe tahliye etmeliyiz."
 SOV_move_industry_to_the_urals_trains_tt:0 "Bu odağın süresi boyunca §R[?SOV_industrial_relocation_trains_focus] $train_equipment$§! kullanılacaktır.\n\n"
 SOV_muster_the_old_guard:0 "Eski Muhafızları Topla"
 SOV_muster_the_old_guard_desc:0 "Hala bir zamanlar Çar ve ülke için savaşmış olan birçok kişi var. Yaşlanmış ve yumuşamış olabilirler, ama savaşın öğrettiği deneyim yeri doldurulamaz. Eğer onlara ulaşabilirsek, ülkeyi geri alma zamanı geldiğinde yeni bir ordu için deneyimli bir çekirdek oluştururlardı."
 SOV_muster_the_old_guard_tt:0 "§Y[GetSovietCivilWarName]§! başladığında yanınıza katılacak Eski Muhafız birimlerini toplar."
 SOV_my_brothers_keeper:0 "Kardeşimin Bekçisi"
 SOV_my_brothers_keeper_desc:0 "Eski Romanov Hanedanı'nın birçok diğer soylu aileyle hanedan bağları vardı. Bazıları hala iktidarda, bazıları tahtlarını kaybetti. Şimdi kendi monarşimizi restore ettiğimize göre, bu diğer ülkelerde de doğru hükümdarların yerine konulmasını sağlamalıyız."
 SOV_national_academies_of_sciences:0 "Ulusal Bilimler Akademileri"
 SOV_national_academies_of_sciences_alt_tt:0 "Müttefik, kukla veya entegre İmparatorluk topraklarında Bilimler Akademileri inşa etmemize olanak tanıyan §Y$SOV_national_academy_of_sciences_dec_cat$§! kararlarının kilidini açar, bu da §Y$SOV_ussr_academy_of_sciences_dynamic_modifier_alt$§! Ulusal Ruhu tarafından sağlanan §Garaştırma hızı bonusunu§! artırır."
 SOV_national_academies_of_sciences_available_tt:0 "En az §Y[?ROOT.SOV_academies_required_for_atomic_bomb_project] Bilimler Akademisi§! inşa etti."
 SOV_national_academies_of_sciences_desc:0 "Kendi Bilimler Akademimizden model alarak, ortak uluslarımız da kendi araştırma yeteneklerini artırmak için benzer enstitüler kurmaya teşvik edilmelidir."
 SOV_national_academies_of_sciences_tt:0 "Müttefik, kukla veya entegre Sovyet cumhuriyetlerinde Bilimler Akademileri inşa etmemize olanak tanıyan §Y$SOV_national_academy_of_sciences_dec_cat$§! kararlarının kilidini açar, bu da §Y$SOV_ussr_academy_of_sciences_dynamic_modifier$§! Ulusal Ruhu tarafından sağlanan §Garaştırma hızı bonusunu§! artırır."
 SOV_national_specialists:0 "Ulusal Uzmanlar"
 SOV_national_specialists_desc:0 "Ekonomik gelişimimiz öncelikle içinde bulunduğu duruma aşina olan insanlar tarafından yönlendirilmelidir. Yabancıların bu bilgiyi edinmesi uzun zaman alacaktır ve belki de daha da kötüsü - ayrıldıklarında onu yanlarında götüreceklerdir."
 SOV_national_specialists_tt:0 " Sanayi Kuruluşu Maliyeti: §G-%50§!."
 SOV_national_unification:0 "Ulusal Birleşme"
 SOV_national_unification_desc:0 "Gelecek savaşlardan sağ çıkacaksak, bölünmüş olmayı göze alamayız. Ne kadar farklı siyasi görüşlere sahip olursak olalım, nihayetinde hepimiz Rus'uz."
 SOV_national_unification_tt:0 "§Y[GetSovietCivilWarName]§! başladığında başkente iki §Y$arms_factory$§! binası ekler."
 SOV_naval_infantry:0 "Deniz Piyadesi"
 SOV_naval_infantry_desc:0 "[GetNavalInfantryDesc]"
 SOV_naval_infantry_desc_alt:0 "Sınırlarımızı genişleteceksek, adanmış bir deniz piyadesi kuvveti düşman kıyı tesislerine baskın yapmak, düşmanın kıyı şeridini tehdit etmek ve ana işgal gücünü desteklemek için çok yararlı olabilir."
 SOV_naval_infantry_desc_default:0 "Emperyalist çabalarla düşman kıyılarını işgal etme niyetimiz olmasa da, adanmış bir deniz piyadesi kuvveti düşman kıyı tesislerine baskın yapmak ve düşmanın kıyı şeridini tehdit etmek için çok yararlı olabilir."
 SOV_naval_infantry_ns_tt:0 "$SOV_modify_red_fleet_ns_intro$ \nİstila Hazırlık Süresi: §G-%10.0§! \nDeniz İstila Kapasitesi: §G+10§! \nÖzel Kuvvetler Kapasite Çarpanı: §G+%10.0§! \n\n"
 SOV_night_witches_nsb_tt:0 "§Y588. Gece Bombardıman Alayı§!, §Y587. Bombardıman Alayı§! ve §Y586. Hava Savunma Avcı Alayı§! Moskova'da aktif hale gelir."
 SOV_nkvd_primacy:0 "NKVD Önceliği"
 SOV_nkvd_primacy_desc:0 "Devletin tüm düşmanlarının hesaba katıldığından emin olana kadar, devrimi korumak için NKVD'ye güvenmeye devam etmeliyiz."
 SOV_no_major_purge_tt:0 "Büyük Tasfiye gerçekleşmedi"
 SOV_no_time_for_peace:0 "Barışa Zaman Yok"
 SOV_no_time_for_peace_desc:0 "Ne kadar istesek de, kalıcı bir barış için çok az umut var. Yeni silahlar ve teknolojiler savaşı eskisinden daha da yıkıcı hale getirecek ve ne yazık ki, düşmanlarımızla başa çıkabildiğimizden emin olmak için zor kazanılmış kaynaklarımızı yatırmalıyız."
 SOV_offensive_maritime_strategy:0 "Taarruzi Deniz Stratejisi"
 SOV_offensive_maritime_strategy_desc:0 "Geriye yaslanıp düşmanın bize gelmesini bekleyemeyiz. İnisiyatifi ele almalı ve düşmana elimizden geldiğince her yerde saldırmalıyız."
 SOV_offensive_maritime_strategy_ns_tt:0 "$SOV_modify_red_fleet_ns_intro$ \n$SOV_the_red_fleet_surface_2_bonus_tt$ \n\n"
 SOV_offer_autonomy_to_former_soviet_republics:0 "Eski Sovyet Cumhuriyetlerine Özerklik Teklif Et"
 SOV_offer_autonomy_to_former_soviet_republics_desc:0 "Hedeflerimize ulaşmak için bazı İmparatorluk topraklarının kaybını kabul etmek zorunda kaldık, ancak herkes bu alanların gerçekten de İmparatorluk Rusya'sının bir parçası olduğunu anlamalıdır. Ama imparatorluğu geri almamıza yardım ettikleri için, minnettarlığımızı göstermek adına onlara biraz özerklik teklif etmeliyiz."
 SOV_offer_poland_protection:0 "Polonya'ya Koruma Teklif Et"
 SOV_offer_poland_protection_desc:0 "Polonya ve Polonya halkı yüzyıllar boyunca birçok yoksunluk ve aşağılanma yaşadı. Almanların Büyük Savaş'tan sonra Polonya'ya verilen toprakları geri istediği ve onları almak için şiddet kullanmaya istekli olduğu açık bir sırdır. Polonya hükûmetine korumamızı teklif etmeliyiz, ortak sınırımız sorununu tartışmaya istekli oldukları sürece."
 SOV_oil_production:0 "Petrol Üretimi"
 SOV_oil_production_desc:0 "Endüstriyel gelişimimizin ve askerî modernizasyonumuzun bir sonraki mantıksal adımı motorizasyonu artırmaktır. Bu, büyük miktarda yağlayıcı ve yakıt stoğu gerektirecektir. Neyse ki, gerekli endüstrileri geliştirirsek bunun için kullanılabilecek bol miktarda petrol rezervine sahibiz."
 SOV_oil_production_ns_tt:0 "$SOV_modify_fyp_ns_intro$ \n Sentetik Petrol: §G+%5.00§! \nRafinerilerden Yakıt Kazancı: §G+%5.00§! \n\n"
 SOV_oil_production_silo_tt:0 "Bu eyaletlerden ikisine §Y1 $fuel_silo$§! ekle."
 SOV_optimize_production_lines:0 "Üretim Hatlarını Optimize Et"
 SOV_optimize_production_lines_desc:0 "Diğer ülkeler üretimi en üst düzeye çıkarmak için fabrikalarında \"Fordizm\"i başarıyla uyguladılar. Onların örneğinden ders almalıyız."
 SOV_optimize_production_lines_ns_tt:0 "$SOV_modify_fyp_ns_intro$ \nFabrika Çıktısı: §G+%2.00§! \n£prod_eff Üretim Verimliliği artışı: §G+%5.00§! \nÜretim Verimliliği Tabanı: §G+%5.00§! \n\n"
 SOV_organization_centralization_discipline:0 "Merkezileştirme ve Disiplin"
 SOV_organization_centralization_discipline_desc:0 "Bu belirsizlik zamanında, halk istikrar ve rehberlik için Politbüro'ya bakıyor. Bu karar alma organının sadece Yoldaş Stalin'in kararlarını desteklemekle kalmayıp, aynı zamanda arkasında birleştiğinden emin olmalıyız."
 SOV_organization_centralization_discipline_ns_tt:0 "$SOV_modify_the_politburo_ns_intro$ \nAzami Komuta Gücü Artışı: §G+20§! \nSeferberlik hızı: §G+%5.00§! \n\n"
 SOV_organization_of_the_partisans:0 "Partizanların Organizasyonu"
 SOV_organization_of_the_partisans_desc:0 "Ele geçirildikten sonra, düşman hatlarının gerisinde kalan birçok asker, aşağılayıcı esaret yerine savaşa devam etmeyi seçiyor. İşgal altındaki bölgelerin köylüleri ve işçileriyle birlikte, işgalciye karşı mücadeleye devam ettiler. Onlara destek göndermeliyiz ki daha fazla düşman birimini bağlayabilsinler."
 SOV_organization_of_the_partisans_ns_tt:0 "$SOV_modify_the_red_army_ns_intro$ \nOperatif yuvaları: §G+1§! \n\n"
 SOV_organize_the_wreckers:0 "Sabotajcıları Organize Et"
 SOV_organize_the_wreckers_desc:0 "Stalin ve yardakçıları, devrim için en iyisi olanı yapıp istifa etmek yerine savaşmaya karar verirlerse, savaşmaya hazır olmalıyız. Böylesine çaresiz bir durumda, halkın mülküne karşı sabotaj bile düşünülmelidir. Gerektiği yerde hedeflendiğinden ve Sovyet işçilerinin büyük başarılarını yok etmediğinden emin olmalıyız."
 SOV_organize_the_wreckers_tt:0 "İç savaş sırasında sanayiyi sabote etmek için §Ykararların§! kilidini açar."
 SOV_organize_uprisings_in_the_country:0 "Ülkede Ayaklanmalar Organize Et"
 SOV_organize_uprisings_in_the_country_desc:0 "Stalin'i iktidardan bir tür silahlı mücadele olmadan indiremeyeceğimiz açık. Stalin'in dikkatini hazırlıklarımızdan uzak tutarak, kesintisiz bir şekilde ilerlemelerini sağlayabiliriz."
 SOV_organize_uprisings_in_the_country_tt:0 "Sovyet İç Savaşı'nda daha fazla destek sağlayacak olan ülkenin çeşitli yerlerinde ayaklanmalar başlatır"
 SOV_organize_wreckers:0 "Sabotajcıları Organize Et"
 SOV_organize_wreckers_desc:0 "Sovyetler zaten casuslardan ve sınıf düşmanlarından çok fazla sabotaj bekliyor. En küçük çelik fabrikasındaki güvenlik tiyatrosu ironik bir şekilde birçok işçiyi hayal kırıklığına uğrattı ve bu yüzden onlara bunu yapma imkanı verirsek, fabrikalarının küçük tiranlarından intikam almaya çalışacak bazı insanlar kolayca bulabiliriz."
 SOV_organize_wreckers_tt:0 "§Y[GetSovietCivilWarName]§! sırasında sanayiyi sabote etmek için §Ykararların§! kilidini açar."
 SOV_our_slavic_commitments:0 "Slav Taahhütlerimiz"
 SOV_our_slavic_commitments_desc:0 "Bir zamanlar tüm Slavların koruyucusuyduk, hatta daha zayıf Slav kardeşlerimizi savunmak için Büyük Savaş'a girdik. Bir kez daha bu mantoyu giyme ve askerî gücümüzü onların savunmasına verme zamanı geldi."
 SOV_paced_industrialization:0 "Dengeli Sanayileşme"
 SOV_paced_industrialization_desc:0 "Stalin'in ağır sanayiye tek odaklanması birçok sektörde önemli bir az gelişmişliğe yol açmış olsa da, kendi planlamamızda bu sektörü göz ardı edemeyiz. Diğer sektörlerin modernleşmesine ve mekanize olmasına izin vermek için, onu destekleyecek endüstriyel tabana sahip olmalıyız."
 SOV_pacify_the_rim:0 "Kenar Bölgeyi Yatıştır"
 SOV_pacify_the_rim_desc:0 "1905 savaşının bir tekrarına izin veremeyiz, o zaman uzak doğu mülklerimiz saldırıya uğramış ve saldırıya karşı ne yazık ki hazırlıksız bulunmuştu. İhtiyaç ortaya çıkarsa birlikleri hızla kaydırabilmek için yerel altyapıya yatırım yapmalıyız."
 SOV_panslavic_nationalism:0 "Pan-Slav Milliyetçiliği"
 SOV_panslavic_nationalism_desc:0 "Rusya uzun zamandır Slav ailemizin en büyük ve en yaşlı ağabeyi olmuştur. Eğer uzun zaman önce öğrenmemiz gereken bir ders varsa, o da Slavların bir arada durmadıkça her zaman saldırıya uğrayacakları, zorbalığa maruz kalacakları ve ezilecekleridir."
 SOV_panslavic_nationalism_tt:0 "§RBonusların etkili olması için ülkelerin anlaşmayı onaylaması gerekir.§!\n"
 SOV_paranoia_system_active_flag:0 "£SOV_paranoia_text_icon Siyasi Paranoya aktif"
 SOV_patriarch_of_all_russia:0 "Tüm Rusya'nın Patriği"
 SOV_patriarch_of_all_russia_desc:0 "Aydınlanmış, Komünist bir toplumda geri kalmış batıl inançlar için çok az neden olsa da, birçok insanın zor zamanlarda inançlarında güç ve teselli bulduğunu da kabul etmeliyiz. Yeni bir tür toplum inşa etmek zorluklardan yoksun değildir ve bu nedenle belki de bu dinî kurumların, devlete sadık kaldıkları sürece işlev görmeye devam etmelerine izin vermeliyiz."
 SOV_pc_of_mechanical_engineering:0 "[GetPcOfMechanicalEngineeringName]"
 SOV_pc_of_mechanical_engineering_desc:0 "Sanayimiz, giderek daha büyük ve karmaşık makine aletleri ve diğer ağır makineler yaratma yeteneğine sahip oldu, o kadar ki bu projeleri koordine etmek için ayrı bir devlet kurumu oluşturmak haklı olacaktır."
 SOV_pc_of_mechanical_engineering_name_alt:0 "Makine Mühendisliği Bakanlığı"
 SOV_pc_of_mechanical_engineering_name_default:0 "Makine Mühendisliği HK"
 SOV_pc_of_mechanical_engineering_ns_tt:0 "$SOV_modify_defense_industry_ns_intro$ \n £prod_eff_cap Üretim Verimliliği Sınırı: §G+%5.00§! \n £prod_eff Üretim Verimliliği artışı: §R-%5.00§! \n\n"
 SOV_pc_of_mortar_armament:0 "[GetPcOfMortarArmamentName]"
 SOV_pc_of_mortar_armament_desc:0 "Mütevazı havan, hızla birimlerimizin ana dolaylı ateş desteği şekli haline geliyor. Bu nedenle, mümkün olduğunca çok sayıda her boyutta havan üretmeye çalışmalı ve tek amacı bunu yapmak olan bir devlet kurumu oluşturmalıyız."
 SOV_pc_of_mortar_armament_name_alt:0 "Havan Silahları Bakanlığı"
 SOV_pc_of_mortar_armament_name_default:0 "Havan Silahları HK"
 SOV_pc_of_mortar_armament_ns_tt:0 "$SOV_modify_defense_industry_ns_intro$ \nYarma: §G+%5.00§! \nTopçu Savunması: §G+%5.0§! \n\n"
 SOV_pc_of_the_ussr_navy:0 "[GetPcOfTheUssrNavyName]"
 SOV_pc_of_the_ussr_navy_alt:0 "Rus Donanması Bakanlığı"
 SOV_pc_of_the_ussr_navy_default:0 "SSCB Donanması Halk Komiserliği"
 SOV_pc_of_the_ussr_navy_desc:0 "Donanmamız daha modern ve daha yetenekli hale geldikçe, onu Ordu ile önem açısından eşit bir muharebe kolu olarak tanıma zamanı geldi. İlk adım, Donanma'nın Ordu'dan ayrı bir yönetim kurmasına izin vermektir."
 SOV_pc_of_the_ussr_navy_ns_name_alt:0 "$SOV_the_red_fleet_dynamic_modifier_alt$"
 SOV_pc_of_the_ussr_navy_ns_name_default:0 "$SOV_the_red_fleet_dynamic_modifier$"
 SOV_pc_of_the_ussr_navy_ns_tt:0 "($MODIFIER_INDUSTRIAL_REFIT_IC_COST_FACTOR$: §G-%5§!, $MODIFIER_REPAIR_SPEED_FACTOR$: §G+%5§!) veren §Y[GetAppropriateRedFleetNsName]§!'i ekle \n\n"
 SOV_penal_battalions:0 "Ceza Taburları"
 SOV_penal_battalions_desc:0 "Geri çekilmeler sırasında, birçok aksi takdirde yetenekli asker, mevzi kaybedilmeden önce geri çekilerek veya ordumuzun iyi davranışlarına aykırı hareket ederek kendilerini utandırdılar. Ancak bu durumda, onları sadece hapsetmek veya idam etmek bizi çok yetenekli savaşçılardan mahrum bırakacaktır. Bu insanların savaş yoluyla kendilerini affettirebilecekleri özel birimler oluşturmalıyız."
 SOV_penal_battalions_spawn_tt:0 "§Y4 Ceza Tümeni§! §Y[ROOT.Capital.GetName]§!'de oluşturulacak. Yıllık olarak §Y4 Ceza Tümeni§! oluşturmaya izin veren §Y$SOV_raise_penal_units$§! kararının kilidini açar."
 SOV_penal_units_raised_flag:0 "Ceza Birlikleri en son oluşturulduğunda"
 SOV_planned_economy:0 "Planlı Ekonomi"
 SOV_planned_economy_desc:0 "Kusurları olsa da, NEP'in bir dizi başarıya sahip olduğu da açıktır. Tam bir Sosyalist topluma geçebilmekten hala çok uzağız, ancak şimdi ekonomimizi daha resmi bir şekilde planlamaya doğru ilerleyebiliriz. Özellikle, ortaklarımızın ve müttefiklerimizin yeteneklerini dikkate alan ve daha birbirine bağımlı bir ekonomi yaratan bir ekonomi politikası oluşturmalıyız."
 SOV_planned_economy_dynamic_modifier_tt:0 "\n(Fabrika Çıktısı: §G+[?SOV_planned_economy_industrial_capacity_factory_extra|2+%]§!, Kaynak Yetersizliği Cezası: §G[?SOV_planned_economy_production_lack_of_resource_penalty_factor_extra|2-%]§!) veren §Y$SOV_planned_economy_dynamic_modifier$§!'ı ekle \n§Y$new_economic_policy$§!'ı benimseyen her bağlı devlet için ek olarak şunları verir: \nFabrika Çıktısı: §G+[?SOV_planned_economy_industrial_capacity_factory_extra|2+%]§! \nKaynak Yetersizliği Cezası: §G[?SOV_planned_economy_production_lack_of_resource_penalty_factor_extra|2-%]§! \n(Maksimuma kadar uygulanan ekstra bonuslar: Fabrika Çıktısı: §Y+%10.00§!, Kaynak Yetersizliği Cezası: §Y-%10.00§!)\n\n"
 SOV_planned_economy_subjects_tt:0 "Her bağlı devlet:"
 SOV_policy_of_collective_security:0 "Kolektif Güvenlik Politikası"
 SOV_policy_of_collective_security_desc:0 "Kapitalist ve genellikle gerici olsalar da, Avrupa'daki demokratik hükûmetler, faşistlerin onları zayıf ve yozlaşmış olarak gördüğünü biliyorlar. Savaş gelirse, faşizmin tüm öfkesi devrimin evine yönelmeden önce ilk düşecek olanlar onlar olacaktır. Bunu fark edecek kadar ileri görüşlü olan politikacılar, Moskova'da sempatik bir kulak bulacaklarını bilmelidirler."
 SOV_policy_of_individual_security:0 "Bireysel Güvenlik Politikası"
 SOV_policy_of_individual_security_desc:0 "Dünyada çok az dostumuz ve çok sayıda düşmanımız var. Kiminle anlaşma yaptığımız konusunda aşırı endişelenmemeliyiz - ya onlar ya da biz, amaçlarına hizmet ettikten sonra bu anlaşmaları zaten bozacağız."
 SOV_positive_heroism:0 "Pozitif Kahramanlık"
 SOV_positive_heroism_desc:0 "İşçi sınıfının üyelerinin tüm başarıları işçi sınıfının tüm üyeleri tarafından paylaşılırken, yine de başkalarının taklit etmesi gereken örnekler olarak bireylere işaret edebiliriz."
 SOV_poum_exists_tt:0 "§Y$SPC_communism$§!:\n   Var\n   §Y$SPR_the_anti_fascist_workers_revolution$§! odağını tamamladı!"
 SOV_preemptive_invasion_of_iran:0 "İran'a Önleyici İşgal"
 SOV_preemptive_invasion_of_iran_desc:0 "[PER.GetNameDef] hükûmetinin savaş gelirse bizi destekleyeceğine güvenilemez, ne de bize karşı bir savaşa girmeyeceklerine tam olarak güvenemeyiz. Bekleyip görmek yerine, sorunu zorlamalı ve durumu açıklığa kavuşturmalıyız."
 SOV_preemptive_invasion_of_iran_tt:0 "[PER.GetNameDef] teslim olduğunda, ülkeyi kukla yapacağız, sınırımızdaki birkaç eyaleti entegre edeceğiz ve petrol zengini [PER.GetAdjective] eyaletlerinde kaynak hakları alacağız. Ortak bir operasyon yürütmek için [ENG.GetAdjective] müdahalesi talep edebileceğiz."
 SOV_prepare_a_war_with_japan:0 "Japonya ile Savaşa Hazırlan"
 SOV_prepare_a_war_with_japan_desc:0 "Japonya'ya saldırmadan önce, bizi bekleyen sürprizlerin olmadığından emin olmalı ve keşif çabalarımızı yoğunlaştırmalıyız."
 SOV_proclaim_soviet_hegemony:0 "Sovyet Hegemonyasını İlan Et"
 SOV_proclaim_soviet_hegemony_desc:0 "Sovyet hükûmet sisteminin, sovyet ekonomisinin ve sovyet toplumunun, kendinden önceki sistemlere her yönden çok daha üstün olduğu açıktır. Bu modası geçmiş sistemler dünyanın diğer bölgelerinde varlığını sürdürürken, onlara karşı çıkmaya istekli insanlar her zaman olacaktır ve biz onları kullanmalıyız."
 SOV_propaganda_campaigns_taken_10_or_greater_tt:0 "En az §Y10§! Propaganda Kampanyası gerçekleştirdi. (Şu anda $SOV_propaganda_campaigns_taken_current_10$ propaganda kampanyası yapıldı)"
 SOV_propaganda_campaigns_taken_15_or_greater_tt:0 "En az §Y15§! Propaganda Kampanyası gerçekleştirdi. (Şu anda $SOV_propaganda_campaigns_taken_current_15$ propaganda kampanyası yapıldı)"
 SOV_propaganda_campaigns_taken_20_or_greater_tt:0 "En az §Y20§! Propaganda Kampanyası gerçekleştirdi. (Şu anda $SOV_propaganda_campaigns_taken_current_20$ propaganda kampanyası yapıldı)"
 SOV_propaganda_campaigns_taken_5_or_greater_tt:0 "En az §Y5§! Propaganda Kampanyası gerçekleştirdi. (Şu anda $SOV_propaganda_campaigns_taken_current_5$ propaganda kampanyası yapıldı)"
 SOV_propaganda_campaigns_taken_current_10:0 "§[GetPropagandaCampaignRequirementColor_10][?SOV_propaganda_campaigns_taken]§!"
 SOV_propaganda_campaigns_taken_current_15:0 "§[GetPropagandaCampaignRequirementColor_15][?SOV_propaganda_campaigns_taken]§!"
 SOV_propaganda_campaigns_taken_current_20:0 "§[GetPropagandaCampaignRequirementColor_20][?SOV_propaganda_campaigns_taken]§!"
 SOV_propaganda_campaigns_taken_current_5:0 "§[GetPropagandaCampaignRequirementColor_5][?SOV_propaganda_campaigns_taken]§!"
 SOV_propaganda_campaigns_taken_requirement_color_green:0 "G"
 SOV_propaganda_campaigns_taken_requirement_color_red:0 "R"
 SOV_protect_the_white_sea_baltic_canal:0 "Beyaz Deniz - Baltık Kanalını Koru"
 SOV_protect_the_white_sea_baltic_canal_desc:0 "Baltık Denizi ile Beyaz Deniz arasındaki kanal modern mühendisliğin bir harikasıdır ve düşman eline geçmesine izin verilemez."
 SOV_raskovas_aviation_group:0 "[GetRaskovasAviationGroupName]"
 SOV_raskovas_aviation_group_alt:0 "İlk Tamamı Kadın İmparatorluk Havacılık Grubu"
 SOV_raskovas_aviation_group_default:0 "Raskova'nın Havacılık Grubu"
 SOV_raskovas_aviation_group_desc:0 "[GetRaskovasAviationGroupDesc]"
 SOV_raskovas_aviation_group_desc_alt:0 "Son derece yetenekli kadın seyrüsefercilerimiz ve pilotlarımız var. Mevcut savaşta kaynaklarımız kısıtlıyken, bu kadar deneyimli insanların kenarda oturmasına izin veremeyiz. Mücadeleyi desteklemek için bir dizi tamamı kadın havacılık birimi kurmalıyız."
 SOV_raskovas_aviation_group_desc_default:0 "Marina Raskova, son derece yetenekli bir seyrüseferci ve pilot olduğunu kanıtladı. Mevcut savaşta kaynaklarımız kısıtlıyken, onun gibi deneyimli birinin kenarda oturmasına izin veremeyiz. Mücadeleyi desteklemek için bir dizi havacılık birimi kurması için ona kaynakları vermeliyiz."
 SOV_raskovas_aviation_group_ns_tt:0 "$SOV_modify_airforce_ns_intro$ \nÖldürüldüğünde Hava Filosu Deneyim kaybı: §G-%10§! \nGece stratejik bombardıman cezası: §G-%10.00§! \nGece Operasyonları Cezası: §G-%20.00§! \n\n"
 SOV_rebuild_the_far_eastern_fleet:0 "Uzak Doğu Filosunu Yeniden İnşa Et"
 SOV_rebuild_the_far_eastern_fleet_desc:0 "Uzak Doğu çıkarlarımızı güvence altına alacaksak, bırakın taarruza geçmeyi, bu bölgedeki gemi inşa ve onarım kapasitemizi büyük ölçüde genişletmeliyiz."
 SOV_rebuild_the_nation:0 "Ulusu Yeniden İnşa Et"
 SOV_rebuild_the_nation_desc:0 "Savaşın harap ettiği ülkemiz şimdi yeniden inşa edilmelidir. Propaganda kampanyalarıyla her erkek, kadın ve çocuğun yeniden inşa çabasına katkıda bulunmasını sağlayabiliriz."
 SOV_rebuild_the_savior_cathedral:0 "Kurtarıcı Katedralini Yeniden İnşa Et"
 SOV_rebuild_the_savior_cathedral_desc:0 "[SOV.GetRebuildtheSaviorCathedralDesc]"
 SOV_reclaim_uryankhay_krai:0 "Uryankhay Krayı'nı Geri Al"
 SOV_reclaim_uryankhay_krai_desc:0 "1911 Moğol Devrimi'nde Uryankhay Cumhuriyeti ve Moğolistan Bogd Hanlığı Çing İmparatorluğu'ndan ayrıldı ve biz onları korumak için devreye girerek Uryankhay bölgesini bir [ROOT.GetAdjective] toprağına çevirdik. Ancak son iç savaş kargaşasıyla, bizden bağımsızlık istiyor gibi görünüyorlar, ki bunu onlara vermemeliyiz, yoksa dünya güçleri yüzyıllarca bize tepeden bakar!"
 SOV_recognized_country_tt:0 "§Y[ROOT.GetNameDefCap]§! uluslararası toplum tarafından tanınır:"
 SOV_reconcile_japan:0 "Japonya ile Uzlaş"
 SOV_reconcile_japan_desc:0 "Bize yönelik ana tehdit Avrupa'dan gelecek. Batı sınırlarımıza odaklanmamızı ve arkadan bıçaklanma korkusu yaşamamamızı sağlamak için Japonya ile olan tüm sorunlarımızı ortadan kaldırmalıyız."
 SOV_reconvene_the_zemsky_sobor:0 "Zemsky Sobor'u Yeniden Topla"
 SOV_reconvene_the_zemsky_sobor_desc:0 "Geçmiş çağlarda, Rus halkı meseleleri tartışmak ve konulara karar vermek için Zemsky Sobor adı verilen bir tür parlamentoda toplanırdı. Ülkemizi hangi yola götüreceğimize karar verene kadar, halkın kendilerini ilgilendiren konulara karar vermesine izin vermeliyiz."
 SOV_reconvene_the_zemsky_sobor_tt:0 "§Y$SOV_aleksandr_kazembek$§! ve §Y$SOV_anastasy_vonsyatsky$§! sürgünden döner."
 SOV_recover_alaska:0 "Alaska'yı Geri Al"
 SOV_recover_alaska_desc:0 "Alaska'nın Amerikalılara satışı, liderleri tarafından Rus halkına bir ihanetti. Bu ihanetin tersine çevrilmesinin ve toprağın geri alınmasının zamanı çoktan geçti. Nüfus, şu anda yaşadıkları sömürücü sistemin bir parçası olmaktansa, birliğimizin bir parçası olarak çok daha mutlu olurdu."
 SOV_recover_the_kuril_islands:0 "Kuril Adalarını Geri Al"
 SOV_recover_the_kuril_islands_decisions_tt:0 "\n[SOV.GetNameDef], §Y[537.GetName]§! ve §Y[555.GetName]§!'i kontrol ettiğinde, [JAP.GetNameDef] ile barış yapmak ve bu toprakları elinde tutmak için bir karar mevcut olacaktır."
 SOV_recover_the_kuril_islands_desc:0 "Kuril adaları 1905 felaketinden sonra kaybedildi. Hızlı ve sert vurursak, onları geri alabilir ve Japonya'ya çatışmayı tırmandırmanın onlar için değmeyeceği bir durum sunabiliriz."
 SOV_reformalize_the_role_of_the_patriarchate:0 "Patrikhane'nin Rolünü Yeniden Resmîleştir"
 SOV_reformalize_the_role_of_the_patriarchate_desc:0 "[SOV.GetReformalizetheRoleofthePatriarchateDesc]"
 SOV_regional_development:0 "Bölgesel Kalkınma"
 SOV_regional_development_desc:0 "Az sayıda merkezi tesise sahip olmak ve ülkenin geri kalanını aç bırakmak yerine, sanayinin gelişiminin tüm birliğe yayılmasını sağlamalıyız."
 SOV_rehabilitated_military:0 "İtibarı Geri Kazandırılmış Ordu"
 SOV_rehabilitated_military_desc:0 "[GetRehabilitatedMilitaryName]"
 SOV_rehabilitated_military_desc_alt:0 "Bolşevikler ordu üzerinde son derece gayretli bir denetim tuttular ve bunun onlara ne faydası oldu? Komünist etkili düşüncelerin yok edilmesini sağlamak için siyasi subay figürünü korumamız gerekse de, savaş sırasında askerî subayların siyasi mülahazalara değil, askerî duruma dayalı kararlar vermesine izin vermeliyiz."
 SOV_rehabilitated_military_desc_default:0 "Ordu üzerinde tuttuğumuz sıkı denetimin belki de biraz fazla gayretli olduğu şimdi açık. Barış zamanında tamamen haklı olsa da, savaş sırasında profesyonellerin siyasi mülahazalara değil, askerî duruma dayalı kararlar vermesine izin vermeliyiz. Siyasi subayları biraz dizginlemenin ve komutanlara işleri nasıl yürütecekleri konusunda daha fazla serbestlik vermenin zamanı geldi."
 SOV_rehabilitated_military_ns_tt:0 "$SOV_modify_the_red_army_ns_intro$ \nTümen Organizasyonu: §G+%5.0§! \n"
 SOV_reigniting_the_revolutionary_spirit:0 "Devrimci Ruhu Yeniden Ateşlemek"
 SOV_reigniting_the_revolutionary_spirit_desc:0 "Yıllarca süren Stalinist yönetim, halkımızın devrimci şevkini köreltti. İşçilerimize devrimin eninde sonunda olacağı söylendi. Bunun böyle olmadığını biliyoruz - mevcut küresel gelişme düzeyinde, devrim o kadar gelişmemiş diğer ülkelerde ateşlenmelidir. Ve biz onu ateşleyeceğiz."
 SOV_reinforce_eastern_naval_bases:0 "Doğu Donanma Üslerini Güçlendir"
 SOV_reinforce_eastern_naval_bases_desc:0 "1905'in aşağılanmasından sonra bile, Japonlar topraklarımıza tecavüz etme konusunda gürültü yapmayı bırakmadılar. Onlara karşı savaşa hazır olmalıyız ve bu da bölgedeki donanma üslerimizi güçlendirmek anlamına geliyor."
 SOV_reinforce_northern_naval_bases:0 "Kuzey Donanma Üslerini Güçlendir"
 SOV_reinforce_northern_naval_bases_desc:0 "Kuzey Kutup Dairesi'nin kuzeyinde yer almasına rağmen, Murmansk ironik bir şekilde tüm yıl boyunca buz tutmayan ve açık okyanuslara erişimi olan tek limanımızdır. Dünyanın geri kalanına daha iyi erişim sağlamak için onu daha da geliştirmeliyiz."
 SOV_reinforce_southern_naval_bases:0 "Güney Donanma Üslerini Güçlendir"
 SOV_reinforce_southern_naval_bases_desc:0 "Karadeniz ikincil bir harekât alanı gibi görünebilir. Ama eğer kontrolünü kaybedersek, Kırım Savaşı'nda olduğu gibi tüm güney topraklarımızı düşman işgaline açmış oluruz. Bunun tekrar olmasına izin vermemeliyiz ve bölgedeki donanma üslerini güçlendirmeliyiz."
 SOV_reinforce_western_naval_bases:0 "Batı Donanma Üslerini Güçlendir"
 SOV_reinforce_western_naval_bases_desc:0 "Baltık Filosu üslerinde çok savunmasız. Demirleme yerlerini korumak ve onarım kapasitelerini iyileştirmek için bazı kaynaklar yatırmalıyız."
 SOV_reinforce_western_naval_bases_other_states_tt:0 "Ayrıca §Y[111.GetName]§!, §Y[812.GetName]§!, §Y[808.GetName]§! veya §Y[189.GetName]§!'e, [SOV.GetNameDef] bu eyaletlerden herhangi birinin tam kontrolüne sahipse, §Y2 Uçaksavar§! ve §Y2 Kıyı Kalesi§! ekleyecektir."
 SOV_reinforce_western_naval_bases_radar_tt:0 "Eğer §Y$radio_detection$§! teknolojisi araştırılmışsa: §Y1 Radar İstasyonu§! ekler\n"
 SOV_reinstitute_the_mestnichestvo:0 "Mestniçestvo'yu Yeniden Kur"
 SOV_reinstitute_the_mestnichestvo_desc:0 "Eski günlerde, en eski ve en seçkin aileler devlet işlerini yürütürdü. Bu, Elitin yönettikleri devlete sadık olmasını ve her yeni neslin eskinin katı standartlarına göre yetiştirilmesini sağlardı. Yeni rejimimizi güvence altına almak için bu sistemi yeniden kurmalıyız."
 SOV_religious_primacy:0 "Dinî Öncelik"
 SOV_religious_primacy_desc:0 "Toplumumuzdaki dinin önemi küçümsenemez. Devletin bu önceliği kabul etme ve destekleme zamanı geldi - ve kilise ile devletin birleşmesine yönelik ilk adımları atma zamanı."
 SOV_reopen_novodevichi:0 "Novodevichi'yi Yeniden Aç"
 SOV_reopen_novodevichi_desc:0 "Kilise'nin uzun süredir yeni rahipler yetiştirme yeteneği reddedildi. Kilise'yi canlandırmak için, yeni nesil rahipleri ve keşişleri eğitebileceği bir yer yaratmalıyız. Novodevichi'nin eski manastırı bariz bir seçim gibi görünüyor."
 SOV_reorganize_the_pc_of_heavy_industry:0 "[GetReorganizeThePcOfHeavyIndustryName]"
 SOV_reorganize_the_pc_of_heavy_industry_desc:0 "Ağır sanayiye önceki geçişimiz, yönetimdeki bazı verimsizliklerin ortaya çıkmasına neden oldu. Operasyonların tekrar sorunsuz yürümesi için doğru kişilerin doğru yerlere konulmasını sağlamalıyız."
 SOV_reorganize_the_pc_of_heavy_industry_name_alt:0 "Sanayi Bakanlığını Yeniden Düzenle"
 SOV_reorganize_the_pc_of_heavy_industry_name_default:0 "Ağır Sanayi Halk Komiserliğini Yeniden Düzenle"
 SOV_reorganize_the_pc_of_heavy_industry_ns_tt:0 "$SOV_modify_fyp_ns_intro$ \nTüketim Malları Fabrikaları Faktörü: §Y-%5.0§! \n\n"
 SOV_request_imperial_protection:0 "İmparatorluk Koruması İste"
 SOV_request_imperial_protection_desc:0 "Çaresiz zamanlar çaresiz önlemler gerektirir. Eğer komünizmi yenmenin tek yolu Hirohito'ya boyun eğmekse, öyle olsun. Rusya'nın kendi başına bir İmparatorluk olacağı zaman gelecek. Ama şimdilik, başka birinin yardımına ihtiyacımız var."
 SOV_request_imperial_protection_tt:0 "Kabul edilirse: §Y[JAP.GetNameDef]§! savaşa katılır. §Y[ROOT.GetNameDefCap]§!, §Y[JAP.GetNameDef]§!'in bir kuklası olur."
 SOV_respect_baltic_self_determination:0 "Baltık Kendi Kaderini Tayin Hakkına Saygı Duy"
 SOV_respect_baltic_self_determination_desc:0 "Her halkın kendi işlerini demokratik bir şekilde belirlemesine izin verilmelidir. Elbette, batıdaki birçok burjuva demokrasisinde, bu süreç büyük miktarda para ile hemen saptırılır. Estonya, Letonya ve Litvanya işçilerinin hükûmetlerinde adil bir temsile sahip olmasını sağlayacağız."
 SOV_restoration_and_development:0 "Restorasyon ve Geliştirme"
 SOV_restoration_and_development_desc:0 "Savaş sona erdiğine göre, barış içinde sanayilerimizi geliştirmeye ve halkımızın hayatını iyileştirmeye geri dönebiliriz."
 SOV_restore_cossack_units:0 "Kazak Birliklerini Geri Getir"
 SOV_restore_cossack_units_desc:0 "İhtiyaç anında, anavatan onu savunmak isteyenlerin kim olduğu hakkında ayrıntı sormaz. İşgalciye karşı silahlanmaya istekli herkes hoş karşılanır ve yeteneklerinin en iyisine göre istihdam edilir."
 SOV_restore_cossack_units_ns_tt:0 "$SOV_modify_the_red_army_ns_intro$ \nSüvari Saldırısı: §G+%5.0§! \nSüvari Hızı: §G+%5.0§! \n\n"
 SOV_restore_cossack_units_spawn_tt:0 "§Y4 Süvari Tümeni§! ve §Y1 Piyade Tümeni§! §Y[ROOT.Capital.GetName]§!'de oluşturulacak."
 SOV_restore_the_glory_of_the_motherland:0 "Anavatanın Görkemini Geri Getir"
 SOV_restore_the_glory_of_the_motherland_desc:0 "Yeni liderliğimiz altında, Rusya'nın eskisinden daha görkemli olmasını sağlayacağız! Her türlü büyük bir inşaat programına başlayacak ve ulusumuzu Batı dünyasının gıpta ettiği bir yer haline getireceğiz!"
 SOV_restore_the_old_eastern_empire:0 "Eski Doğu İmparatorluğunu Geri Getir"
 SOV_restore_the_old_eastern_empire_desc:0 "Bir zamanlar şanlı imparatorluğumuz Pasifik'in kenarına kadar uzanır, Amerika'ya kadar derinlere inerdi. O zamandan beri düşüncesizce alınan kararlar, bu mülkleri kısa vadeli parasal kazançlar için takas etti. Ama bizim liderliğimiz altında, Rusya bir kez daha Amerikan mülklerini geri alabilir. Sadece mevcut sahiplerini onlardan çekilmeye zorlamamız gerekecek."
 SOV_return_democracy_to_the_party:0 "Partiye Demokrasiyi Geri Getir"
 SOV_return_democracy_to_the_party_desc:0 "Devrim sırasında, en iyi ileriye gidiş yolu hakkında sonsuz tartışmalara saplanmayı göze alamayacağımız bir nokta vardı. Ama zaman değişti ve işçilere vaat edilen hayatın her alanında demokrasi vaadini yerine getirme zamanı geldi. Bu aynı zamanda, bir zamanlar iyi niyetli eleştirileri sabotaj olarak görülen insanları tekrar partiye alabileceğimiz anlamına da geliyor."
 SOV_return_democracy_to_the_party_factionalism_tt:0 " §Y$SOV_factionalism_modifier$§!'ı §R-%5§! Siyasi Güç Faktörü ile değiştirir."
 SOV_return_democracy_to_the_party_unlock_left_tt:0 "§YSol Muhalefet danışmanları§! kullanılabilir hale gelir."
 SOV_return_democracy_to_the_party_unlock_right_tt:0 "§YSağ Muhalefet danışmanları§! kullanılabilir hale gelir."
 SOV_return_of_the_rocor:0 "ROCOR'un Dönüşü"
 SOV_return_of_the_rocor_desc:0 "Rusya Dışındaki Rus Ortodoks Kilisesi, inançlarını ve ilkelerini terk etmek yerine Rus İç Savaşı'ndan sonra sürgünü seçen sürgünlerden oluşur. Şimdi, sürgünlerini zorlayan komünist hükûmetin yenilgisiyle, nihayet onları eve kabul etme ve eski görevlerine iade etme zamanı geldi."
 SOV_reverse_the_collectivization_process:0 "Kolektifleştirme Sürecini Tersine Çevir"
 SOV_reverse_the_collectivization_process_desc:0 "Kolektifleştirmeler, bir zamanlar ülkenin ekmek sepeti olan bölgelerde yoksulluk ve kıtlık yaratan tam bir felaket olmuştur. Acilen tersine çevrilmeleri gerekiyor."
 SOV_reverse_the_collectivization_process_tt:0 "İç Savaş sırasında Kendi Kendine Sahip Olan Çiftçilerden destek ekler\n§Y$SOV_factionalism_modifier$§!'ı değiştirir:\nEyaletteki Azami Fabrika: §R-%10§!\nParti Popülerliği İstikrar Faktörü: §G+%10§!\n"
 SOV_revive_the_stakhanovite_movement:0 "Stahanovcu Hareketi Canlandır"
 SOV_revive_the_stakhanovite_movement_desc:0 "Acımasız sömürü kapitalist ülkelerdeki işçiyi kendini daha fazla zorlamaya ve fabrika sahipleri için daha fazla üretmeye iter. Ülkemizde ise Alexey Stahanov gibi işçiler, döşenen her ekstra tuğlanın, çıkarılan her ekstra ton kömürün, yerine konan her ekstra perçinin, işçilerin sömürüden sonsuza dek kurtulduğu bir dünya inşa etmeye yardımcı olduğunu bildikleri için kendilerini daha da ileriye iterler."
 SOV_right_opposition_civil_war_name:0 "Sovyet İç Savaşı"
 SOV_right_opposition_name:0 "Sağ Muhalefet"
 SOV_right_purges:0 "Devlet Düşmanları"
 SOV_right_purges_desc:0 "Hala yönetimimizi tam olarak kabul etmemiş bir avuç parti üyesi var. Geri kalanları hizaya getirmek için onlardan bir örnek çıkarmamız gerekecek."
 SOV_right_purges_tt:0 "Sol Muhalefet danışmanları kaldırılacak"
 SOV_romanov_reconstruction:0 "Romanov Yeniden İnşası"
 SOV_romanov_reconstruction_desc:0 "Nihayet ulusumuzun onu yönetecek bir Çar'ı var. Ülkemizin son haklı hükümdarlarının zulmünden yirmi yıl sonra, şimdi yönetici hanedanımızı bir kez daha benimseme ve Çarımızın iradesinin uygulanmasındaki küçük engelleri ortadan kaldırma zamanı."
 SOV_russian_corporate_state:0 "Rus Korporatif Devleti"
 SOV_russian_corporate_state_desc:0 "Rusya'nın geleceği sınıf çatışmasında değil, sınıf işbirliğinde yatmaktadır. Bu amaçla devlet, emek ve sermaye çıkarlarını uzlaştırmak için ulusal sendikalar kuracak ve bunlar aracılığıyla üretimi düzenleyecektir."
 SOV_sabotage_behind_enemy_lines:0 "Düşman Hatlarının Gerisinde Sabotaj"
 SOV_sabotage_behind_enemy_lines_desc:0 "Onlarca yıllık Komünist kötü yönetimi, birçok insanı Komünist hükûmetten öfkeli ve hayal kırıklığına uğramış bıraktı. Komünistlerin hala iktidara tutunduğu yerlerde, yenilgilerini hızlandırmak için bu insanları kullanabiliriz."
 SOV_second_moscow_trial_flag:0 "§Y$SOV_the_anti_soviet_trotskyist_center$§! odağını tamamladı!"
 SOV_secure_finland:0 "Finlandiya'yı Güvence Altına Al"
 SOV_secure_finland_desc:0 "Finlandiya Büyük Dükalığı, iç savaşta ayrılana kadar bir yüzyıldan fazla bir süredir kuzey sınırlarımızı korudu. Finlandiya'yı anavatanla yeniden birleştirme günü geldi."
 SOV_secure_leningrad:0 "[195.GetName]'i Güvence Altına Al"
 SOV_secure_leningrad_desc:0 "Finlandiya ile mevcut sınırımız, rahatlık için [195.GetName]'e çok yakın. Finlandiya'dan bir sürpriz saldırı birkaç saat içinde şehre ulaşabilir. Konum ayrıca Baltık Filomuzu ablukaya almayı çok kolaylaştırıyor. Bu kabul edilemez bir durumdur ve bunu Fin hükûmetine açıkça belirtmeliyiz."
 SOV_secure_the_administration:0 "Yönetimi Güvence Altına Al"
 SOV_secure_the_administration_desc:0 "Terörist Zinovyev ve müttefiklerinin itiraflarının şokuyla, partinin diğer üyelerinin sadakatleri hakkında sorular sormalıyız. Politbüro'nun her üyesinin nerede durduğunu bilmemiz zorunludur."
 SOV_secure_the_administration_ns_tt:0 "$SOV_modify_the_politburo_ns_intro$ \nEkonomi Kanunları Maliyeti: §G-%20§! \nTicaret Kanunları Maliyeti: §G-%20§! \nAskerlik Kanunları Maliyeti: §G-%20§! \n\n"
 SOV_secure_the_baltics:0 "Baltıkları Güvence Altına Al"
 SOV_secure_the_baltics_desc:0 "Baltık bölgesi uzun zamandır Rusya'nın ayrılmaz bir parçası olmuştur. Ulusal bir zayıflık anında ayrıldılar ve mümkün olan en kısa sürede geri alınmalıdırlar."
 SOV_seek_a_defense_pact_with_the_allies:0 "Müttefiklerle Bir Savunma Paktı Ara"
 SOV_seek_a_defense_pact_with_the_allies_desc:0 "Batı demokrasileriyle gayri resmî temaslar olmasına rağmen, somut ve yasal olarak bağlayıcı çok az şey üzerinde anlaşmaya varıldı. Mürekkebi kağıda dökme ve dünyaya batı demokrasilerinin faşist genişlemeye karşı bizimle birleşik bir cephe oluşturmaya istekli olduğunu ilan etme zamanı geldi."
 SOV_seek_a_defense_pact_with_the_allies_event_effects_tt:0 "Eğer [GetCollectiveSecurityTarget] kabul ederse, her ulus bir Saldırmazlık Paktı imzalayacak ve birbirlerini garanti edecektir."
 SOV_seek_a_defense_pact_with_the_allies_poland_tt:0 "[GetCollectiveSecurityTargetCaps], pakta [POL.GetFlag]§Y[POL.GetNameDef]§!'in dahil edilmesi için ısrar edebilir."
 SOV_seek_a_defense_pact_with_the_allies_target_eng:0 "[ENG.GetFlag]§Y[ENG.GetNameDef]§!"
 SOV_seek_a_defense_pact_with_the_allies_target_eng_caps:0 "[ENG.GetFlag]§Y[ENG.GetNameDefCap]§!"
 SOV_seek_a_defense_pact_with_the_allies_target_fallback:0 "hükûmetleri"
 SOV_seek_a_defense_pact_with_the_allies_target_fallback_caps:0 "Onlar"
 SOV_seek_a_defense_pact_with_the_allies_target_fra:0 "[FRA.GetFlag]§Y[FRA.GetNameDef]§!"
 SOV_seek_a_defense_pact_with_the_allies_target_fra_caps:0 "[FRA.GetFlag]§Y[FRA.GetNameDefCap]§!"
 SOV_seek_balkan_cooperation:0 "Balkan İşbirliği Ara"
 SOV_seek_balkan_cooperation_decisions_tt:0 "Balkan ülkelerinde §YHükûmete Baskı Yap§! ve §Yİdeolojik Mitingleri Teşvik Et§! kararlarını etkinleştirir."
 SOV_seek_balkan_cooperation_desc:0 "Balkan yarımadası ve Küçük Asya'daki ülkeler, ideolojik görüşlerini bizimkiyle daha yakından hizalamalarını sağlayabilirsek güçlü müttefikler olabilirler."
 SOV_send_military_advisors_to_spain:0 "İspanya'ya Askerî Danışman Gönder"
 SOV_send_military_advisors_to_spain_desc:0 "İspanya'daki yoldaşlarımız, demokratik bir seçim kazandıktan sonra şimdi gerici bir karşı-devrimle karşı karşıyalar. Onları desteklemeliyiz, yoksa yenilgileri diğer ülkelerdeki faşistleri teşvik eder."
 SOV_send_military_advisors_to_spain_generals_tt:0 "\nEğer [GetAppropriateSupportedSpanishFaction], İspanyol İç Savaşı'nı kaybederse, [GetAppropriateSpanishExiledGeneral], §Y[ROOT.GetNameDef]§!'e katılacak."
 SOV_shift_to_armaments_production:0 "Silah Üretimine Geç"
 SOV_shift_to_armaments_production_desc:0 "Savaş yaklaşıyor. Kimin ilk saldıracağını bilmiyoruz, ama er ya da geç kendimizi saldırı altında bulacağız. Zamanı geldiğinde hazır olmak için şimdi hazırlanmalıyız."
 SOV_shift_to_armaments_production_ns_tt:0 "$SOV_modify_fyp_ns_intro$ \n§YSivil Fabrika§! inşaat hızı: §R-%5.00§! \n§YAskerî Fabrika§! inşaat hızı: §G+%10.00§! \n\n"
 SOV_sinikiang_influence_refuse_tt:0 "Eğer istersek §Y[SIK.GetFlag] [SIK.GetNameDef]§!'e karşı bir savaş hedefi oluşturabileceğiz.\n"
 SOV_sinkiang_decisions_available_tt:0 "[SIK.GetAdjective]'in kaynaklarını, altyapısını ve ordusunu geliştirmek için kararların kilidini açar."
 SOV_smersh:0 "SMERŞ"
 SOV_smersh_desc:0 "Her bir vatandaşa, casusların ve düşman ajanlarının her yerde mevcut olduğunu ve herhangi bir boş konuşmanın düşmana onlara bir avantaj sağlayan önemli bir bilgi parçası verebileceğini açıkça belirtmeliyiz."
 SOV_socialism_in_one_country:0 "Tek Ülkede Sosyalizm"
 SOV_socialism_in_one_country_desc:0 "Dünya devrimi nihai hedefimiz olarak kalsa da - ve gerçekten de bilimsel olarak kaçınılmaz olduğu kanıtlanmış olsa da - önce ülkemizde Sosyalizmi güvence altına almalıyız, yoksa biz yenildiğimiz için dünyanın diğer bölgelerindeki işçi kurtuluşu gecikebilir."
 SOV_socialism_in_one_country_ns_tt:0 "$SOV_modify_the_politburo_ns_intro$ \nİdeoloji kayması savunması: §G+%5.0§! \nGünlük Komünizm Desteği: §G+0.05§! \nSavunma Savaşı Cezası İstikrar Etkeni: §G+%25.00§! \n\n"
 SOV_socialist_emulation:0 "Sosyalist Taklit"
 SOV_socialist_emulation_desc:0 "Kapitalist sistem altında, işçiler günlük ekmeklerini kazanmak için birbirleriyle rekabet etmek zorundadır, fabrika sahipleri ise işçilerin verimliliği artıran herhangi bir iyileştirmesinden kâr eder. Bu israflı ve insanlık dışıdır. Sosyalist bir sistem, henüz en iyi olmayanlara, başarılı olanlardan öğrenerek yeteneklerini geliştirmeleri için ihtiyaç duydukları desteği sağlayacaktır."
 SOV_socialist_humanism:0 "Sosyalist Hümanizm"
 SOV_socialist_humanism_desc:0 "İnsanların kendi kaderlerinde hiçbir iradeye sahip olmadıklarına ve hayatlarının tamamen maddi faktörler tarafından belirlendiğine inanan bazı Marksist teorisyenler vardır. Bu açıkça yanlıştır ve aslında işçi sınıfına yönelik burjuva bir görüşü gösterir. İnsanlar sadece bir dizi organdan daha fazlasıdır ve onlara öyle davranmalıyız."
 SOV_socialist_realism:0 "Sosyalist Gerçekçilik"
 SOV_socialist_realism_desc:0 "Parlak bir Sosyalist geleceğe giden yol uzun ve genellikle virajlıdır. Bazı insanlar bu hedefe ulaşılabileceğine dair umudunu bile kaybedebilir. Onlara tam olarak ne için çalıştıklarını göstermeliyiz, sosyalist bir ülkede hayatın gerçekte nasıl olacağını gösteren bir sanat tarzını teşvik ederek."
 SOV_south_manchuria_railway:0 "Güney Mançurya Demiryolu"
 SOV_south_manchuria_railway_desc:0 "Japon Güney Mançurya Demiryolu Şirketi, [MAN.GetName]'de devlet içinde bir devlettir. Onların desteğiyle, yaklaşan mücadele için ihtiyaç duyduğumuz tedarik ağını hazırlayabilmeliyiz."
 SOV_soviet_artillery:0 "[ROOT.GetAdjective] Topçusu"
 SOV_soviet_artillery_desc:0 "Bugünün savaşları, doğru noktalara ateş gücünün bilimsel uygulanmasıyla kazanılıyor. Sadece daha iyi toplar geliştirmeye değil, aynı zamanda onları mümkün olan en etkili şekilde kullanmaya odaklanacağız."
 SOV_soviet_artillery_tech_bonus_name_alt:0 "Rus Topçusu"
 SOV_soviet_artillery_tech_bonus_name_default:0 "Sovyet Topçusu"
 SOV_soviet_atomic_bomb_project:0 "[ROOT.GetAdjective] Atom Bombası Projesi"
 SOV_soviet_atomic_bomb_project_desc:0 "Diğer ülkelerdeki bilim adamlarının evrendeki en temel güçleri yeni bir silah türüne dönüştürmek için yöntemler geliştirmek için çok çalıştıklarını biliyoruz. Geride olsak da, kendi çalışmalarımızı ilerletmek için onların çalışmalarını kullanabilir ve yıkım paritesinin devam etmesini sağlayabiliriz."
 SOV_soviet_atomic_bomb_project_tech_bonus_name:0 "Ulusal Atom Bombası Projesi"
 SOV_soviet_atomic_bomb_project_tt:0 "Eğer §Y[588.GetName]§!'de başka §YDeneysel Tesis§! yoksa, §Y[588.GetName]§!'de §G1§! §YNükleer Araştırma Tesisi§! kazanacağız."
 SOV_soviet_atomic_bomb_project_unlock_operation_tt:0 "Büyük ülkelerin atom programlarına sızmak için operasyonların kilidini açar. [GetAgencyRequirement]"
 SOV_soviet_chinese_relations:0 "Sovyet-Çin İlişkileri"
 SOV_soviet_civil_war:0 "İç Savaş başladı"
 SOV_soviet_civil_war_name:0 "Sovyet İç Savaşı"
 SOV_soviet_civil_war_over:0 "İç Savaş bitti"
 SOV_soviet_japanese_pact_against_usa_focus:0 "ABD'ye Karşı Sovyet-Japon Paktı"
 SOV_soviet_japanese_pact_against_usa_focus_desc:0 "Japonlar büyüyen ekonomilerini beslemek için daha fazla genişleme isteyecekler. Bu genişlemeyi bizden mümkün olduğunca uzağa yönlendirmek ve aynı zamanda güçlü bir deniz gücünün desteğini kazanmak bizim çıkarımızadır. Birlikte, Amerika Birleşik Devletleri'ni dünya sahnesinden kaldırabiliriz!"
 SOV_spanish_general_campesino:0 "§Y$SPR_valentin_gonzalez$§! ([SPD.GetFlag])"
 SOV_spanish_general_default:0 "§Ybir İspanyol generali§!"
 SOV_spanish_general_lister:0 "§Y$SPR_enrique_lister$§! ([SPD.GetFlag])"
 SOV_spanish_general_rovira:0 "§Y$SPR_jose_rovira$§! ([SPC.GetFlag])"
 SOV_spanish_supported_faction_default:0 "desteklenen İspanyol fraksiyonu"
 SOV_spanish_supported_faction_poum_post:0 "[SPC.GetFlag] [SPC.GetNameDef]"
 SOV_spanish_supported_faction_poum_pre:0 "[SPC.GetFlag] $SPR_anarchist_spain_neutrality_def$ veya [SPC.GetFlag] $SPR_anarchist_spain_communism_def$"
 SOV_spanish_supported_faction_republic_post:0 "[SPD.GetFlag] [SPD.GetNameDef]"
 SOV_spanish_supported_faction_republic_pre:0 "[SPR.GetFlag] [SPR.GetNameDef]"
 SOV_spheres_of_influence_in_china:0 "Çin'de Nüfuz Alanları"
 SOV_spheres_of_influence_in_china_desc:0 "Aramızdaki son çekişme noktası Çin'deki durum. Bölgedeki kendi çıkarlarımız sınırlıdır ve eğer ilgi alanları hakkında bir anlaşma ile Japon desteğini satın alabilirsek, o zaman bunu tereddüt etmeden yapmalıyız."
 SOV_stalins_cult_of_personality:0 "Stalin'in Kişilik Kültü"
 SOV_stalins_cult_of_personality_desc:0 "Birliğe karşı şok edici komplonun ifşa edilmesinin ardından, sadece Yoldaş Stalin'in ileri görüşlü liderliğinin bir iç savaşa veya daha kötüsüne sürüklenmeyi önlediği açıktır. Her bir Sovyet vatandaşı ve aslında küresel işçi sınıfının her üyesi, devrimi savunmadaki yorulmak bilmez çalışması için Yoldaş Stalin'e sonsuz şükran borçludur."
 SOV_stalins_cult_of_personality_tt:0 "£SOV_paranoia_text_icon Siyasi Paranoya oyundan kaldırıldı."
 SOV_steel_casting_industry:0 "Çelik Döküm Sanayisi"
 SOV_steel_casting_industry_desc:0 "Metalurji sanayilerimiz endüstriyel büyümemizin ön saflarında yer aldı, ancak yeni üretim yöntemlerinin benimsenmesiyle daha da ileriye götürülebilirler."
 SOV_steel_casting_industry_ns_tt:0 "$SOV_modify_fyp_ns_intro$ \nFabrika Çıktısı: §G+%5.00§! \nTersane Çıktısı: §G+%5.00§! \n\n"
 SOV_strengthen_heavy_industry:0 "Ağır Sanayiyi Güçlendir"
 SOV_strengthen_heavy_industry_desc:0 "Ağır sanayi ekonomimizin kalbidir. Devrimin sadece hayatta kalmasını değil, aynı zamanda gelişmesini sağlamak istiyorsak, bu sektörü daha da güçlendirmeliyiz."
 SOV_strengthen_the_mobilization_plan:0 "Seferberlik Planını Güçlendir"
 SOV_strengthen_the_mobilization_plan_desc:0 "En büyük askerî avantajımız her zaman ülkemizin genişliği ve içinde yaşayan insan sayısı olmuştur. Ancak askerleri cepheye getirmeye gelince, bu iki şey birbirine karşı çalışabilir. Savaş durumunda güçlerimizi hızla yoğunlaştırabildiğimizden emin olmak için seferberlik planlarımızı sürekli olarak iyileştirmeli ve güncellemeliyiz."
 SOV_strengthen_the_mobilization_plan_ns_tt:0 "$SOV_modify_the_red_army_ns_intro$ \nSeferberlik hızı: §G+%5.00§! \nAskere Alınabilir Nüfus Etkeni: §G%3§! \n"
 SOV_strengthen_the_trade_unions:0 "Sendikaları Güçlendir"
 SOV_strengthen_the_trade_unions_desc:0 "Stalin liderliğinde, sendikalar işçileri yönetime karşı temsil eden bir araçtan, yönetimin işçileri yönlendiren bir aracına dönüştürüldü. Bu onun daha az suçlarından biri gibi görünse de, işçilerin demokratik özyönetim fikrini tamamen baş aşağı çevirdi ve işçilerin devrimin faydalarından yararlanmasını etkili bir şekilde engelledi."
 SOV_submarine_warfare:0 "Denizaltı Harbi"
 SOV_submarine_warfare_desc:0 "Denizaltılar deniz savaşında önemli avantajlar sunar. İyi tasarlanmış modern bir denizaltı, torpidolarını ateşlemeden önce pratik olarak tespit edilemez ve potansiyel olarak kendisinden kat kat büyük ve pahalı bir ana gemiyi sakat bırakabilir. Bu gemileri donanmamızın ana taarruz gücü olarak geliştirmeye odaklanmalıyız."
 SOV_submarine_warfare_ns_tt:0 "$SOV_modify_red_fleet_ns_intro$ \n$SOV_the_red_fleet_submarine_1_bonus_tt$ \n\n"
 SOV_superior_war_machines:0 "Üstün Savaş Makineleri"
 SOV_superior_war_machines_desc:0 "Tanklar ve zırhlı araçlar son on yılda önemli ölçüde gelişti. Onları üretmek ve tedarik etmek için büyük bir silah sanayisiyle, üstün araçlar yaratabilir ve onları düşmana karşı toplu halde kullanabiliriz."
 SOV_superior_war_machines_ns_tt:0 "$SOV_modify_defense_industry_ns_intro$ \n$tank_manufacturer_cost_factor$: §G-%25§! \n\n"
 SOV_support_afghan_ideology:0 "Afgan [GetIdeologyNameWithCaps]ını Destekle"
 SOV_support_afghan_ideology_desc:0 "Afganistan, gururlu ulusların alçaltıldığı yerdir. Ülkede bir askerî operasyon en iyi ihtimalle maliyetli olur ve başarılı bile olmayabilir. Afganistan'da bizimle ideolojik olarak daha yakın hizalanmış bir hükûmet kurmak isteyen birkaç temasımız var. Bu çabayı desteklemeliyiz."
 SOV_support_the_kuomintang:0 "Kuomintang'ı Destekle"
 SOV_support_the_kuomintang_desc:0 "Çin komünistleri askerî olarak zayıf ve daha büyük bir ordu kurabilecekleri bir sanayi üssüne sahip değiller. Kuomintang'ın Çin'i kontrol etmeye ve başarılı bir komünist devrim için bir ön koşul olarak gerekli olan burjuva toplumunu yaratmaya en uygun olduğu açıktır."
 SOV_surface_warfare:0 "Suüstü Harbi"
 SOV_surface_warfare_desc:0 "Ana gemiler önemli bir zaman ve kaynak yatırımı gerektirir ve genellikle inşa edilmeleri bitmeden önce bile modası geçmiş olurlar. Daha küçük gemiler çok daha hızlı inşa edilebilir ve sonuç olarak teknolojik gelişmelerle çok daha kolay ayak uydurabilirler. Deniz savaşının birincil kolu olarak hafif kuvvetlerimizi geliştirmeye odaklanmalıyız."
 SOV_surface_warfare_ns_tt:0 "$SOV_modify_red_fleet_ns_intro$ \n$SOV_the_red_fleet_surface_1_bonus_tt$ \n\n"
 SOV_swap_to_political_advisors:0 "Askerî Siyasi Danışmanlar"
 SOV_swap_to_political_advisors_desc:0 "Savaşımız sadece uluslar arasında kaynaklar için bir yarışma değil. Bu bir siyasi sistemler yarışmasıdır. Siyasi mülahazaların askerî kararları dikte etmesine izin vermememiz gerekse de, karar verildiğinde bu siyasi mülahazaların dikkate alındığından emin olmalıyız."
 SOV_swap_to_political_advisors_ns_tt:0 "$SOV_modify_the_red_army_ns_intro$ \nTümen Organizasyonu: §R-%5.0§! \nTümen Toparlanma Oranı: §G+%10.0§! \nGünlük Komuta Gücü Kazanım Çarpanı: §G+%10§! \n\n"
 SOV_sway_the_railway_workers:0 "Demiryolu İşçilerini İkna Et"
 SOV_sway_the_railway_workers_desc:0 "Bir devrimin malzemeye ihtiyacı vardır. Demiryolu işçilerini davamıza kazanmalıyız. Bu bize operasyon üssümüz etrafında tedarik depoları hazırlama ve saklama fırsatı verecektir."
 SOV_sway_the_railway_workers_tt:0 "§Y[GetSovietCivilWarName]§! başladığında karargâh eyaleti etrafına §YDemiryolu§! ve §YTedarik merkezleri§! ekler."
 SOV_synthetic_rubber:0 "Sentetik Kauçuk"
 SOV_synthetic_rubber_desc:0 "Yabancı kauçuk ithalatına artık güvenemeyeceğimiz gün gelecek. O gün geldiğinde, kauçuk ihtiyaçlarımızı yerli üretimle karşılamaya hazır olmalıyız."
 SOV_system_decentralization:0 "Sistem Ademi Merkeziyetçiliği"
 SOV_system_decentralization_desc:0 "Stalin sadece partiyi değil, tüm ülkeyi kendi üzerine merkezileştirdi. Bu açıkça karşı-devrimci bir yaklaşımdır, gücü işçilerden alıp yozlaşmış bir seçkinlerin eline verir. Bu yönü tersine çevirmeli ve işçilerin tekrar kendi kaderlerini belirlemelerine izin vermeliyiz."
 SOV_the_anti_soviet_trotskyist_center:0 "Sovyet Karşıtı Troçkist Merkezi"
 SOV_the_anti_soviet_trotskyist_center_desc:0 "Zinovyevci komplosuyla ilgili soruşturmamız, yönetimimizde geniş bir anti-sovyet terörist ağı olduğunu ortaya çıkardı. Bazı üyeler kime yardım ettiklerinin bile tam olarak farkında değiller! Bu komplo kökünden sökülmeli ve bunu başarmak için sert önlemler alınması gerekebilir."
 SOV_the_berlin_moscow_axis:0 "Berlin-Moskova Mihveri"
 SOV_the_berlin_moscow_axis_desc:0 "Yeni hükûmetimiz şimdi Alman ve İtalyan modellerine göre sıkıca kurulduğuna göre, batı komşularımızla eski ilişkileri onarmak için ulaşmalıyız. Paylaştığımız görüşlere odaklanırsak, kendimizle [GER.GetName] arasında güçlü ve kalıcı bir ittifak kurabiliriz."
 SOV_the_bloc_of_rights_and_trotskyites:0 "Sağcılar ve Troçkistler Bloğu"
 SOV_the_bloc_of_rights_and_trotskyites_desc:0 "Nihayet, aramızdaki komplonun tam kalbine ulaştık. Nikolay Buharin aslında Troçkist-Zinovyevci bloğun bir üyesiydi ve büyük olasılıkla bir karşı-devrim gerçekleştirmeye çalışan hükûmet içindeki insanların lideriydi. Şimdi bunun çürütülemez kanıtlarına sahibiz ve son bir duruşmada bu gerçekleri gün ışığına çıkarabiliriz."
 SOV_the_builder_of_the_red_army:0 "Kızıl Ordu'nun Mimarı"
 SOV_the_builder_of_the_red_army_desc:0 "Bu arada ne hale gelmiş olursa olsun, Kızıl Ordu her zaman $SOV_lev_trotsky$'nin beyninin ürünü olacaktır. Eski görevine dönme ve yeni ve yeniden canlanmış bir Kızıl Ordu'yu savaşa götürme zamanı geldi."
 SOV_the_centre:0 "Merkez"
 SOV_the_centre_desc:0 "Yoldaş Stalin ulusumuz için en büyük savaşçı olmuştur. Devrimin geleceğini onun fazlasıyla yetenekli ellerine bırakmalıyız."
 SOV_the_centre_ns_tt:0 "(Günlük Komünizm Desteği: §G+0.05§!) veren §Y$SOV_the_politburo_good_dynamic_modifier$§!'ı ekle \n\n"
 SOV_the_collectivization_process:0 "Kolektifleştirme Süreci"
 SOV_the_collectivization_process_desc:0 "Yapılacak çok iş olmasına ve bazı bölgelerde kötü bir şekilde ele alınmış olmasına rağmen, Sovyetler Birliği'ndeki çiftlikleri kolektifleştirme süreci neredeyse tamamlandı ve yakında tarım sektöründen artan üretim sağlayacak."
 SOV_the_collectivization_process_ns_tt:0 "$SOV_modify_the_politburo_ns_intro$ \nTüketim Malları Fabrikaları: §Y-%2.0§! \nBir Eyaletteki Azami Fabrika Sayısı: §G+%10§! \nİnşaat Hızı: §G+%5.00§! \n\n"
 SOV_the_comintern:0 "Komintern"
 SOV_the_comintern_desc:0 "İşçinin kurtuluş mücadelesi herhangi bir ülkeyle sınırlı değildir; bu küresel bir mücadeledir. Dünyanın herhangi bir ulusundaki yoldaşlara yardım etmeli ve gericilik ve karşı-devrim güçleriyle nerede bulunurlarsa bulunsunlar savaşmalıyız."
 SOV_the_common_economic_space_initiative:0 "Ortak Ekonomik Alan Girişimi"
 SOV_the_common_economic_space_initiative_desc:0 "Mallarımız için yeni pazarlara erişimimiz olsaydı ve ekonomimizin ihtiyaç duyduğu kaynakları daha az ticaret engeliyle elde etseydik, ekonomimizi büyütmek daha kolay olurdu. Bunu teşvik etmek için bir örgüt kurmalıyız."
 SOV_the_construction_of_communism:0 "Komünizmin İnşası"
 SOV_the_construction_of_communism_desc:0 "Komünizmin İnşası kendi zorlukları ve engelleriyle gelecektir. Politbüro Yoldaş Stalin'in arkasında birleşmişken, Komünizm inşa etmek için ilk adımları atabiliriz."
 SOV_the_construction_of_communism_ns_tt:0 "$SOV_modify_the_politburo_ns_intro$ \nAynı ideoloji aylık görüşü: §G+%25.00§! \n\n"
 SOV_the_construction_of_communism_puppet_autonomy_tt:0 "Her bağlı devlet: \n £autonomy_texticon §Y-100.00§! ekle\n\n"
 SOV_the_construction_of_communism_railways_tt:0 "§YMoskova§!'dan kara yoluyla erişilebilen §Yher bağlı devletin başkentine§! kadar seviye §Y1§! bir demiryolu inşa et."
 SOV_the_declaration:0 "Deklarasyon"
 SOV_the_declaration_desc:0 "[SOV.GetTheDeclarationDesc]"
 SOV_the_declaration_tt:0 "§Y$SOV_patriarch_sergy$§!, §Y$SOV_metropolitan_nikolay$§! ve §Y$SOV_metropolitan_aleksy$§! danışman olarak kullanılabilir hale gelir."
 SOV_the_defense_of_moscow:0 "Moskova Savunması"
 SOV_the_defense_of_moscow_desc:0 "Düşman Moskova kapılarında duruyor. Burası bizim direniş noktamız ve onları geri çekilmeye ve yenilgiye uğratma yerimiz, tıpkı Napolyon'a yaptığımız gibi!"
 SOV_the_end_of_the_imperialist_era:0 "Emperyalist Çağın Sonu"
 SOV_the_end_of_the_imperialist_era_decision_tt:0 "Amerikan ve Okyanusya komşularında §YBeşinci Kol Organize Et§! ve §YProletaryayı Kışkırt§! kararlarının kilidini açar."
 SOV_the_end_of_the_imperialist_era_desc:0 "Belki de emperyalizmin en çıplak ifadesi, tek bir ülkenin iki koca kıtayı kendi özel bölgesi ilan ettiği sözde Monroe Doktrini'nde yatmaktadır. Bu böyle gitmez. Devrim Amerika'da bir yer bulacak ve batı yarımkürenin işçileri nihayet özgürce nefes alacak."
 SOV_the_enemies_of_the_people:0 "Halkın Düşmanları"
 SOV_the_enemies_of_the_people_desc:0 "Gerici güçler hala orada, başardığımız her şeyi geri alabilecekleri günü planlıyorlar. Biz ve müttefiklerimiz bu tehdide karşı sonsuza dek uyanık olmalı ve devrimi savunmak için savaşmak zorunda kalacağımız ihtimale hazırlanmalıyız."
 SOV_the_eyes_fear:0 "Gözler Korkar..."
 SOV_the_eyes_fear_desc:0 "Önümüzdeki görev kolay değil. Kendini on yıllardır sağlamlaştırmış ve nüfusun önemli bir yüzdesi tarafından desteklenecek bir hükûmetle başa çıkmak zorundayız. Ama ne yapılması gerektiğini biliyoruz, geriye kalan tek şey bunu yapmak."
 SOV_the_eyes_fear_tt:0 "§Y[GetSovietCivilWarName]§! başladığında Komünist'e karşı ayaklanacak birimleri toplar."
 SOV_the_faithful_servant_of_lenin:0 "Lenin'in Sadık Hizmetkârı"
 SOV_the_faithful_servant_of_lenin_desc:0 "Lenin bize dünya tarihindeki en büyük görevi bıraktı: Tüm insanların gerçekten eşit olduğu, baskı, acı veya maddi yokluk olmayan bir toplum inşa etmek. Bu vizyonu gerçekleştirecek, her adımda Lenin'in yanında olan ve şimdi devrimde verilen sözü yerine getirmeye hazır olan Yoldaş Stalin'den daha iyi bir adam olamaz."
 SOV_the_fate_of_romania:0 "Romanya'nın Kaderi"
 SOV_the_fate_of_romania_desc:0 "Romanya'nın önemli bir Slav azınlığı var ve Balkanlar'daki Slav halklarına kara erişimimizi engelliyor. Her iki sorunu da tek bir hamlede çözmek için, Romanya'nın bağımsızlığı, gerekirse askerî güçle sona ermelidir."
 SOV_the_fight_for_the_pacific:0 "Pasifik İçin Savaş"
 SOV_the_fight_for_the_pacific_desc:0 "Karadaki gücümüz ne olursa olsun, Pasifik bölgesindeki düşmanlarımızla başa çıkmak için suyu geçmek zorunda kalacağız. Bu nedenle, dünyanın o bölgesinde etkili bir savaş yürütmeden önce kıyı altyapımızı ve gemi inşa sanayimizi geliştirmeliyiz."
 SOV_the_fourth_international:0 "Dördüncü Enternasyonal"
 SOV_the_fourth_international_desc:0 "Sözde Üçüncü Enternasyonal'deki Stalinist kuklalar, devrimi ileriye taşıma konusunda tamamen yetersiz olduklarını kanıtladılar. Onların Komünizm vizyonunun Marx ve Lenin tarafından yazılan teorilerle çok az ilgisi var ve bunun yerine demokratik olarak kontrol edilen bir işçi devletinin rüyasını distopik bir kabusa çeviriyor. Devrimi savunacak yeni bir Enternasyonal'e ihtiyacımız var!"
 SOV_the_glory_of_the_red_army:0 "[GetSovietArmyAdjectiveBasedOnIdeology] Ordusunun Zaferi"
 SOV_the_glory_of_the_red_army_alt:0 "$SOV_the_glory_of_the_red_army$"
 SOV_the_glory_of_the_red_army_alt_desc:0 "$SOV_the_glory_of_the_red_army_desc$"
 SOV_the_glory_of_the_red_army_desc:0 "Düşman saldırısına başarıyla dayandık. Şimdi taarruza geçme ve savaşı geldiği yere geri götürme zamanı!"
 SOV_the_glory_of_the_red_army_masterful_blitz_tactic_tt:0 "\nTaktik etkinleştirir: §Y$tactic_masterful_blitz$§!"
 SOV_the_glory_of_the_red_army_name_communism:0 "Kızıl"
 SOV_the_glory_of_the_red_army_name_democratic:0 "Rus"
 SOV_the_glory_of_the_red_army_name_exiles:0 "İmparatorluk"
 SOV_the_glory_of_the_red_army_name_neutrality:0 "$SOV_the_glory_of_the_red_army_name_exiles$"
 SOV_the_glory_of_the_red_army_ns_tt:0 "$SOV_modify_the_red_army_ns_intro$ \nÖzel Kuvvetler Kapasite Çarpanı: §G+%10.0§! \nKara Doktrini Maliyeti: §G-%10.00§! \n\n"
 SOV_the_gobi_gambit:0 "Gobi Gambiti"
 SOV_the_gobi_gambit_desc:0 "Japonya ile Çin arasındaki çatışma kızışırken, bize Çin'in geleceğinde söz hakkı ve masada bir koltuk verecek olan Gobi çölü çevresindeki alanı ele geçirme fırsatımız var."
 SOV_the_hands_do:0 "...Eller Yapar"
 SOV_the_hands_do_desc:0 "Saat geldi. Bu kutsal göreve kendimizi adamalıyız: Sovyet hükûmet sistemini Anavatanımızdan kaldırmak. Böylece çocuklarımız bir gün Komünizm hayaletinden kurtulabilir."
 SOV_the_hands_do_tt:0 "§Y$SOV_metropolitan_meletius$§! danışman olarak kullanılabilir hale gelir."
 SOV_the_iron_wall_of_russian_resolve:0 "Rus Kararlılığının Demir Duvarı"
 SOV_the_iron_wall_of_russian_resolve_desc:0 "Çar, mevcut tankları gölgede bırakacak ve savaş alanında eşi benzeri olmayacak canavarca savaş silahlarının lejyonlarının inşasını öngörüyor. Rus halkı yenilmemiştir; yenilmezdir! Bu makineler bu kararlılığın somutlaşmış hali olacak ve üzerimize atılan her ordu onlar üzerinde kırılacaktır."
 SOV_the_khakimov_proposal:0 "Hakimov Önerisi"
 SOV_the_khakimov_proposal_desc:0 "Khakimov, [SAU.GetNameDef] hükümeti ile itibarımızı iyileştirmek için yorulmadan çalıştı. Uzmanlar, bölgenin kapitalistlerin şüphesiz sömürmeye hevesli olduğu büyük miktarda doğal kaynağa ev sahipliği yaptığını düşünüyor. [SAU.GetNameDef] ülkesini herhangi bir düşman bloktan uzak tutmak ve potansiyel kaynaklar üzerinde ilk hakları bize sağlamak için karşılıklı güven ilişkisi kurmaya devam etmeliyiz."
 SOV_the_komsomol:0 "Komsomol"
 SOV_the_komsomol_desc:0 "Sosyalizmi bugünün yetişkinleri için inşa etmiyoruz, çocuklar ve henüz doğmamış nesiller için inşa ediyoruz. Onlara yapacağımız başarıları nasıl geliştireceklerini ve üzerine nasıl inşa edeceklerini öğretmeliyiz ki, başladığımız işi tamamlayabilsinler. Onları sadece eğitmekle kalmayıp aynı zamanda toplumun iyi, komünist üyeleri olmayı öğreten özel bir gençlik örgütü kurmalıyız."
 SOV_the_last_break_southward:0 "Güneye Son Hamle"
 SOV_the_last_break_southward_desc:0 "Son bir dizi fetih, nihayet Batı Asya'nın geri kalanını ve Boğazları güvence altına alacak ve kanadımız güvende iken Hindistan'dan kontrolü ele geçirmemizi sağlayacaktır. Yakındaki Akdeniz'den Hint Okyanusu'na kadar denizlere nihayet tartışmasız erişim elde edeceğiz."
 SOV_the_left_opposition:0 "Sol Muhalefet"
 SOV_the_left_opposition_desc:0 "Sovyetler Birliği'nin vaat ettiği yoldan saptığı açıktır. Şimdi tek ülkede Sosyalizm inşa etme konuşmaları bile var, dünya işçilerini kaderlerine terk edip onlarla dayanışma içinde olmak yerine. Eğer Yoldaş Stalin harekete geçmezse, başkaları kesinlikle geçecektir."
 SOV_the_left_opposition_tt:0 "[ROOT.GetNameDef]'de bir §Yİç Savaş§! sürecini başlatır."
 SOV_the_lonely_island:0 "[SOV.GetLonelyIslandName]"
 SOV_the_lonely_island_desc:0 "[SOV.GetLonelyIslandDesc]"
 SOV_the_means_to_wage_war:0 "Savaş Yürütme Araçları"
 SOV_the_means_to_wage_war_desc:0 "Ordudaki uçaklar, toplar ve tanklar genellikle en yüksek ilgiyi çeker ve geçit törenlerinde en iyi görünse de, sıradan asker tüfeğinin kalitesine ve çizmelerinin rahatlığına çok daha fazla önem verir. Bu şeylerin herhangi bir savaş uçağı veya ağır obüs kadar savaş yürütmek için en az o kadar önemli olduğunu kabul etmeliyiz."
 SOV_the_means_to_wage_war_ns_tt:0 "$SOV_modify_defense_industry_ns_intro$ \n$materiel_manufacturer_cost_factor$: §G-%25§! \n\n"
 SOV_the_military_conspiracy:0 "Askerî Komplo"
 SOV_the_military_conspiracy_desc:0 "Ülkemizdeki Troçkist komplosu orduya ulaştı. Şimdi önde gelen Generallerin ve hatta Mareşallerin hükûmeti devirmek için yabancı istihbarat servisleriyle komplo kurduğuna dair kanıtlarımız var! Sadakatleri hafif şüpheli olan subayların, ordumuzu daha da zayıflatabilecekleri pozisyonlarda kalmalarına izin veremeyiz."
 SOV_the_modern_war_in_the_skies:0 "Gökyüzündeki Modern Savaş"
 SOV_the_modern_war_in_the_skies_desc:0 "Hava Muharebesi, siperler üzerinde düello yapan çift kanatlıların günlerinden bu yana çok yol kat etti. Bugün, endüstriyel nitelikte, düşman üzerinde günün her saati baskıyı sürdürmek için yüksek bir operasyonel tempoya sahip. Bu gerçeği kabul etmeli ve buna göre plan yapmalıyız."
 SOV_the_modern_war_in_the_skies_ns_tt:0 "$SOV_modify_airforce_ns_intro$ \nHava Görevi Verimliliği: §G+%10.0§! \nGece Operasyonları Cezası: §G+%10.0§! \n\n"
 SOV_the_molotov_line:0 "[GetTheMolotovLineName]"
 SOV_the_molotov_line_desc:0 "Avrupa'nın siyasi coğrafyasındaki son değişiklikler batı sınırımızı oldukça batıya kaydırdı. Eski tahkimat planları artık güncel değil. Herhangi bir düşman saldırısını, kuvvetlerimizi bir karşı saldırı için seferber edene kadar yavaşlatmak için yeni sınırlarımız boyunca yeni bir hat oluşturmalıyız."
 SOV_the_molotov_line_name_default:0 "Molotov Hattı"
 SOV_the_molotov_line_name_exiles:0 "Çar Hattı"
 SOV_the_molotov_line_name_left:0 "Troçki Hattı"
 SOV_the_molotov_line_name_right:0 "Buharin Hattı"
 SOV_the_molotov_line_tt:0 "Tam kontrol altındaki Litvanya, Polonya ve Romanya eyaletlerinde bir tahkimat hattı inşa et.\n\n"
 SOV_the_need_for_policy_changes:0 "Politika Değişiklikleri İhtiyacı"
 SOV_the_need_for_policy_changes_desc:0 "Ülkenin yanlış yöne gittiği son derece açık hale geldi. Stalin ve müttefikleri çok fazla şeyi çok hızlı denediler. Koşmadan önce yürümeliyiz. Bizi tekrar yola sokmak için Sovyetler Birliği'nin ilk yıllarında büyük işler yapmış olan Yoldaş Sokolnikov'u geri getirmeliyiz."
 SOV_the_need_for_policy_changes_tt:0 "§Y$SOV_grigory_sokolnikov$§! danışman olarak kullanılabilir hale gelir."
 SOV_the_new_soviet_woman:0 "Yeni Sovyet Kadını"
 SOV_the_new_soviet_woman_desc:0 "Siyasi devrim Birliğimizdeki milyonlarca insana özgürlük getirdi, bunların başında artık sadece eş ve anne olmakla sınırlı kalmayan, aynı zamanda işyerinde de tam olarak eşit durabilen milyonlarca kadın geliyor."
 SOV_the_old_enemy:0 "Eski Düşman"
 SOV_the_old_enemy_desc:0 "Yıllarca, İsveç İmparatorluğun böğründe bir dikendi. Defalarca Rusya'ya saldırdılar ve bize karşı koalisyonlar kurmaya çalıştılar. Çar I. Petro önce onları geri püskürtmeye başladı, Poltava'da onları yendi. 1809'da onları tekrar yendik ve bunun onlara yerlerini bildirdiğini düşünebilirdi. Ama Baltık bölgesindeki çıkarlarımızı sorgulamaya devam ettiler. Bu küçük ulusu bir kez ve herkes için ezmenin zamanı geldi."
 SOV_the_onslaught_on_colonialism:0 "Sömürgeciliğe Saldırı"
 SOV_the_onslaught_on_colonialism_decision_tt:0 "Afrikalı komşularda §YBeşinci Kol Organize Et§! ve §YProletaryayı Kışkırt§! kararlarının kilidini açar."
 SOV_the_onslaught_on_colonialism_desc:0 "Emperyalizm ve sömürgeci sömürü, geç dönem kapitalizminin hayati parçalarıdır. Ancak milyonlarca insanı kölelikte tutmak, bize kolayca sömürebileceğimiz devasa bir devrimci potansiyel sağlar. Sömürge imparatorluklarındaki ezilen kitleler özgürce nefes almayı özlüyor - ve biz onların zincirlerini kıracağız."
 SOV_the_path_of_marxism_leninism:0 "Marksizm Leninizm Yolu"
 SOV_the_path_of_marxism_leninism_desc:0 "Marx, Engels ve Lenin'in yanılmaz öğretileri ulusumuzu en derin geri kalmışlıktan teknolojik ve endüstriyel eşitliğe yükseltti. Şimdi yön değiştirmek en büyük ahmaklık olur. İşçinin kurtuluşunun yenilmez sancağı daima ileriye yürüyor!"
 SOV_the_peoples_revolution:0 "Halkın Devrimi"
 SOV_the_peoples_revolution_desc:0 "Eğer devrim sürecekse, toplumun her yönüne nüfuz etmelidir. Ancak tüm halk kendini devrimin bir parçası ve taşıyıcısı olarak görürse, karşılaştığı birçok tehdide dayanabilir."
 SOV_the_permanent_revolution:0 "Sürekli Devrim"
 SOV_the_permanent_revolution_decisions_tt:0 "Düşman Avrupa komşularında devrimci ayaklanmaları ateşlemek için §YBeşinci Kol Organize Et§! kararlarının kilidini açar."
 SOV_the_permanent_revolution_desc:0 "Marksist teori, koşullar uygunsa devrimin kaçınılmaz olduğunu öğretir. Ancak, koşullar açıkça uygun değil veya her yerde uygun değil. Kayıtsız kalmamalı ve yüzyıllar uzakta olabilecek bir dünya devrimini beklememeliyiz. Dünya çapındaki işçiler ve köylüler şu anda, bugün acı çekiyor ve onların kurtuluşu bekleyemez."
 SOV_the_permanent_revolution_trotsky_trait_tt:0 "Eğer §Y$SOV_lev_trotsky$§! ülke lideriyse:"
 SOV_the_plan_for_the_coup:0 "Darbe Planı"
 SOV_the_plan_for_the_coup_desc:0 "Bu güç mücadelesi açık bir şiddete dönüşmek zorunda değil. Kartlarımızı doğru oynarsak ve doğru insanları doğru pozisyonlara koyarsak, Stalin'i iktidardan dondurup sonra onu ortadan kaldırabiliriz."
 SOV_the_plan_for_the_coup_tt:0 "NKVD başkanını davanıza hizalamak için §Ykarar§! kilidini açar, böylece Stalin'i kansız bir darbeyle devirmeyi mümkün kılar."
 SOV_the_power_of_the_peasantry:0 "Köylülüğün Gücü"
 SOV_the_power_of_the_peasantry_desc:0 "Marksist ortodoksi devrimci potansiyeli sanayi işçilerine yüklerken, ülkemizde bunun büyük kısmını köylülerin oluşturduğu açıktır. Milyonlarca çiftçiyi eğitmeli ve sınıf bilinçlerini geliştirmeliyiz ki saldırı altındayken devrimi savunmaya hevesli olsunlar."
 SOV_the_return_of_the_rocor_tt:0 "§Y$SOV_metropolitan_anastasy$§! danışman olarak kullanılabilir hale gelir."
 SOV_the_right_opposition:0 "Sağ Muhalefet"
 SOV_the_right_opposition_desc:0 "Stalin'in paranoyak liderliği ülkeyi yok ediyor. Toplu kolektifleştirme ve sert sanayileşmeye geçişi daha da çok. Bir şeyler yapılmalı ve yakında. Bu ülkeyi zafere taşıyabilecek, kötü yönetimden kaynaklanan yaraları iyileştirebilecek ve ekonomiyi restore edebilecek olanlar, Buharin liderliğindeki Sağ muhalefetin üyeleridir."
 SOV_the_right_opposition_tt:0 "[ROOT.GetNameDef]'de Merkezciler ve Sağ Muhalefet arasında bir §Yİç Savaş§! sürecini başlatır."
 SOV_the_rightful_heir_to_the_empire:0 "İmparatorluğun Haklı Vârisi"
 SOV_the_rightful_heir_to_the_empire_desc:0 "Eski Bizans İmparatorluğu çoktan gitmiş olsa da, birinin hala Kutsal Topraklara giden hacıları koruması gerekiyor. İngilizlerin ve Fransızların bu göreve uygun olmadığı açıktır, bu yüzden bu görev açıkça bize düşmelidir."
 SOV_the_road_of_life:0 "Hayat Yolu"
 SOV_the_road_of_life_desc:0 "Birkaç şehrimiz tehdit altında ve kuşatma altındayken, bu yerlerdeki savaşan kuvvetlere ne pahasına olursa olsun dayanmaları için ihtiyaç duydukları desteği sağlamaya odaklanmalıyız."
 SOV_the_socialist_bulwark:0 "Sosyalist Siper"
 SOV_the_socialist_bulwark_desc:0 "İspanyol yoldaşlarımızla omuz omuza duruyoruz. Uluslararası bir dayanışma örneği olarak, onların mücadelesi bizim mücadelemizdir ve bizim mücadelemiz onlarınkidir. Birlikte, Avrupa'nın zıt uçlarında iki sosyalist devrimci merkez oluşturacağız."
 SOV_the_socialist_bulwark_join_war_tt:0 "§Y[ROOT.GetFlag][ROOT.GetNameDefCap]§!, diğer tüm İspanyol fraksiyonlarına karşı iç savaşlarında §Y[SPC.GetFlag]İspanyol POUM§!'a katılacak."
 SOV_the_southern_thrust:0 "Güney İttirmesi"
 SOV_the_southern_thrust_desc:0 "Güney sınırımız, düşmanların herhangi bir zayıflığı sömürebileceği geniş açık bir kanattır. Buna tahammül edemeyiz, ne de bölgedeki barışçıl değişimi bekleyemeyiz."
 SOV_the_stalin_constitution:0 "Stalin Anayasası"
 SOV_the_stalin_constitution_desc:0 "1924 anayasası İç Savaş'ın ardından bir devlet düzenlemek için iyi bir girişimdi, ancak amacına hizmet etti. Yeni bir anayasaya ihtiyaç var. Öncelikle, Birliği güçlü ve güvende tutmada Yoldaş Stalin'in yorulmak bilmez çalışmasını ve dehası ve bilgeliğinin komünizm davasını ileriye götürmede etkili olduğunu kabul etmeliyiz."
 SOV_the_stalin_constitution_ns_tt:0 "$SOV_modify_the_politburo_ns_intro$ \nİdeoloji kayması savunması: §G+%5.0§! \nSiyasi Güç Kazancı: §G+%5§! \n\n"
 SOV_the_supreme_soviet:0 "Yüksek Sovyet"
 SOV_the_supreme_soviet_desc:0 "Tek bir kişinin tüm bir ülkeyi temsil etmesi doğası gereği antidemokratiktir ve bu nedenle karşı-devrimcidir. Bunun yerine, bu tür kült benzeri davranışlardan vazgeçeceğiz ve birliğimizin sonsuza dek Yüksek Sovyet'te toplanan halkın kolektif iradesiyle temsil edileceğini ilan edeceğiz."
 SOV_the_synod:0 "Sinod"
 SOV_the_synod_desc:0 "Novodevichi'deki Seminer yeniden açıldığına göre, son kez böyle bir meclis yapmalarına izin verildiğinden beri ortaya çıkan inanç meselelerini tartışmak için bir Sinod düzenlemeye teşvik edilmelidirler."
 SOV_the_third_rome:0 "Üçüncü Roma"
 SOV_the_third_rome_desc:0 "Kutsal Yerlerin koruyucuları olarak rolümüz güvende olduğuna göre, inancın tartışmasız savunucularıyız. Kendimizi buna göre şekillendirmemiz sadece geçerlidir. Konstantinopolis'in Düşüşü'nden sonra, Moskova şüphesiz Üçüncü Roma olmuştur."
 SOV_the_third_rome_tt:0 "§Y$SOV_metropolitan_meletius$§! artık danışman olarak kullanılamayacak."
 SOV_the_third_rome_tt_2:0 "§YMetropolit Meletius§! artık §YBaş Patrik Meletius§! olarak bilinecektir."
 SOV_the_threat_from_the_land_of_the_rising_sun:0 "Yükselen Güneşin Ülkesinden Gelen Tehdit"
 SOV_the_threat_from_the_land_of_the_rising_sun_desc:0 "Japonya'nın Çin'e hükmetmek istediği açıktır. Bunu başardıklarında, şüphesiz Sibirya'daki geniş kaynakları almak için kuzeye dönecekler. Çin'de meşgul oldukları sürece, bize karşı hareket etmeyi tercih etmeyecekler ve bu yüzden Çin'deki savaşın Japonlara karşı koymaya hazır olana kadar sürmesini sağlamalıyız."
 SOV_the_trade_union_as_labor_organizer:0 "İşçi Organizatörü Olarak Sendika"
 SOV_the_trade_union_as_labor_organizer_desc:0 "Kapitalizm altında, sendikalar işçiler için temel insan haklarını sağlamak ve fabrika sahiplerinin sömürüsünü savuşturmak için vardır. Bu yeni sistemde açıkça artık gerekli değildir ve bu nedenle İşçi Sendikası'nın rolü, üretimi optimize etmek amacıyla emeği organize etmeye doğru kaymalıdır."
 SOV_the_triple_entente:0 "Üçlü İtilafı Yeniden Kur"
 SOV_the_triple_entente_desc:0 "Orta Avrupa'daki eski düşmanlarımız kontrol altına alınmalıdır. Bu amaçla bir zamanlar bir ittifak vardı, ancak Büyük Savaş'tan onursuzca çekilmemiz onun sonunu getirdi. Şimdi bu bağları yeniden kurma zamanı."
 SOV_the_true_tsars:0 "Gerçek Çarlar"
 SOV_the_true_tsars_desc:0 "Rus halkının her zaman güçlü bir lidere ihtiyacı olmuştur, yoksa giderek daha fazla ayrışır, kardeş kardeşe ve oğullar babalarına karşı savaşır. Ama eski Çarlar rollerine uygun değildi, zayıf ve kararsızdı. Gelecekte, üzerine yüklenen ağır yükü taşıyabilecek bir Çar'a ihtiyacımız olacak."
 SOV_the_true_tsars_tt:0 "[GetSovietCivilWarName] başladığında:"
 SOV_the_ussr_academy_of_sciences:0 "[GetTheUssrAcademyOfSciencesName]"
 SOV_the_ussr_academy_of_sciences_alt:0 "İmparatorluk Bilimler Akademisi"
 SOV_the_ussr_academy_of_sciences_default:0 "SSCB Bilimler Akademisi"
 SOV_the_ussr_academy_of_sciences_desc:0 "Uygulamalı bilimler alanlarında rekabetçi kalmak için, teorik bilimlerin de ön saflarında olmalıyız. Zaten iyi kurulmuş bir bilimler akademimiz var, ancak bazı ek fonlarla bize gerçekten dünya standartlarında bir araştırma altyapısı sağlayacaktır."
 SOV_the_vanguard_of_the_true_revolution:0 "Gerçek Devrimin Öncüsü"
 SOV_the_vanguard_of_the_true_revolution_desc:0 "Dünya devrimimizi duysun. Dünya çapındaki tüm devrimcilere sancaklarımıza akın etmeleri için bir çağrı yapacağız. Birlikte Stalin'i yenebiliriz. Birlikte devrimi zafere taşıyabiliriz."
 SOV_the_workers_dictatorship:0 "İşçi Diktatörlüğü"
 SOV_the_workers_dictatorship_desc:0 "Birliğimizdeki tüm güç nihayetinde işçilerde olmalıdır. hizipçiliğe bölünmeyi göze alamayız ve bu nedenle işçilerin iradesinin her zaman Politbüro kararlarında ifade edilmesini sağlamalıyız."
 SOV_the_workers_dictatorship_ns_tt:0 "$SOV_modify_the_politburo_ns_intro$ \nSiyasi Güç Kazancı: §G+%5§! \nAsgari Teslim Olma Limiti: §G+%5.00§! \n\n"
 SOV_the_zinovyevite_terrorist_center:0 "Zinovyevci Terörist Merkezi"
 SOV_the_zinovyevite_terrorist_center_desc:0 "1934'teki Yoldaş Kirov suikastı, partinin üyeleri arasında açıkça Yoldaş Stalin'e ve bir bütün olarak Birliğe karşı komplo kuranlar olduğunu gösteriyor. Birkaç suç ortağından itiraflar aldık, bu da birkaç kişiyi daha suçluyor. Bu Zinovyevci komplo - şüphesiz Troçki veya batılı ajanlar tarafından organize edilmiş, muhtemelen birlikte çalışıyorlar - yayılmadan önce bir kanser gibi kesilip atılmalıdır."
 SOV_they_will_know_fear:0 "Korkuyu Bilecekler"
 SOV_they_will_know_fear_desc:0 "Düşmanlarımız Kızıl Ordu'dan ve Sovyet halkından korkmayı öğrendi. İlk saldırıya dayandık ve geri savaşma zamanı. En tahkim edilmiş düşman savunma hatlarını bile kırabilecek korkunç yeni savaş makineleri geliştirmeliyiz. Bu tür savaş makineleri, sadece adlandırılarak düşmanın kalbine kadar terör salmalıdır..."
 SOV_third_five_year_plan:0 "[GetThirdFiveYearPlanName]"
 SOV_third_five_year_plan_alt:0 "Ulusal Sanayileşme İçin Yeni Proje"
 SOV_third_five_year_plan_available_tt:0 "[ROOT.GetFlag][ROOT.GetNameDefCap] büyük bir güçle savaşta değil. \n§RBu odak, [ROOT.GetNameDef] büyük bir güce karşı savaşa girdiğinde kalıcı olarak kilitlenecektir.§!"
 SOV_third_five_year_plan_default:0 "Üçüncü Beş Yıllık Plan"
 SOV_third_five_year_plan_desc:0 "[GetThirdFiveYearPlanDesc]"
 SOV_third_five_year_plan_desc_alt:0 "Hem askerî hem de sivil üretimimizi uzun vadede artırmamızı sağlayacak, nüfusu ezmeden veya temel ihtiyaçlarını riske atmadan ulusal bir sanayileşme programı tasarladık."
 SOV_third_five_year_plan_desc_default:0 "Barış sürdüğü sürece, halkımızın ve ordumuzun ihtiyaçlarını karşılamak için sanayileşmemizi daha da ileriye ve daha hızlı götürmeliyiz."
 SOV_third_five_year_plan_ns_alt_tt:0 "§Y$SOV_third_five_year_plan_dynamic_modifier$§!'i §Y$SOV_third_five_year_plan_dynamic_modifier_alt$§! ile değiştir.\n Etkili değişiklik: \n£prod_eff Üretim Verimliliği artışı: §G+%5.00§! \nSanayi Kuruluşu Maliyeti: §G-%15§! \nTüketim Malları Fabrikaları Faktörü: §Y+%10.0§!\n\n"
 SOV_third_five_year_plan_ns_tt:0 "$SOV_modify_fyp_ns_intro$ \n£prod_eff Üretim Verimliliği artışı: §G+%5.00§! \nSanayi Kuruluşu Maliyeti: §G-%15§! \nTüketim Malları Fabrikaları Faktörü: §Y+%10.0§!\n\n"
 SOV_third_moscow_trial_flag:0 "§Y$SOV_the_bloc_of_rights_and_trotskyites$§! odağını tamamladı!"
 SOV_tolkachi:0 "Tolkachi"
 SOV_tolkachi_desc:0 "Sovyet ekonomisinde, işi üretim planındaki sayıların endüstrinin gerçekten sağlayabileceği sayılarla eşleşmesini sağlamak olan belirli bir tür insan vardır. Eğer bu insanları bizim için çalışmaya ikna edebilirsek, Sovyetlere bir sayı ve fabrika müdürlerine başka bir sayı verebilir ve üretimdeki farkı zamanı gelene kadar saklanabileceği bir yere taşıyabiliriz."
 SOV_tolkachi_tt:0 "§Y[GetSovietCivilWarName]§! başladığında §Y$infantry_equipment$§!, §Y$support_equipment$§! ve §Y$artillery_equipment$§! ekler"
 SOV_transformation_of_nature:0 "Doğanın Dönüşümü"
 SOV_transformation_of_nature_alt:0 "$SOV_transformation_of_nature$"
 SOV_transformation_of_nature_alt_desc:0 "$SOV_transformation_of_nature_desc$"
 SOV_transformation_of_nature_desc:0 "Bilimsel topluluğumuz daha önce mümkün olduğu düşünülenin sınırlarını zorlarken, en büyük, en istilacı projeler bile uygulanabilir hale geliyor."
 SOV_trial_of_the_generals_flag:0 "§Y$SOV_the_military_conspiracy$§! odağını tamamladı!"
 SOV_trigger_first_moscow_trial_tt:0 "'§YBirinci Moskova Duruşması§!' olayını alır."
 SOV_trigger_second_moscow_trial_tt:0 "'§Yİkinci Moskova Duruşması§!' olayını alır."
 SOV_trigger_third_moscow_trial_tt:0 "'§YÜçüncü Moskova Duruşması§!' olayını alır."
 SOV_two_red_flags:0 "İki Kırmızı Bayrak"
 SOV_two_red_flags_desc:0 "Devrim Çin'de tam olarak başarılı olmasa da, bu beklenmedik bir durum değil. Ülke henüz uygun bir sosyalist devrim için gerekli olan sanayileşmiş bir topluma sahip değil. Yine de, komünist parti Çin halkının komünist bir geleceğe ulaşması için en iyi şansı temsil ediyor."
 SOV_undermine_stalins_authority:0 "Stalin'in Otoritesini Baltala"
 SOV_undermine_stalins_authority_desc:0 "Stalin'i iktidarda tutan tek şey insanların ondan ve yapabileceklerinden korkmasıdır. İnsanların korkularını henüz tam olarak ortadan kaldıramayız, ama Stalin'in başkalarına zarar verme yeteneğini azaltabiliriz. İşler çok iyi giderse, onu bir kez daha sadece bir adam olduğu bir dereceye kadar izole edebiliriz."
 SOV_undermine_stalins_authority_paranoia_tt:0 "£SOV_paranoia_text_icon Haftalık Paranoya Artışı: §R+1§!"
 SOV_unification_of_the_exiles:0 "Sürgünlerin Birleşmesi"
 SOV_unification_of_the_exiles_desc:0 "Devrimden ve iç savaştan sonra, birçok insan yeni rejimin sözde adaletinden ziyade sürgünü tercih etti. Onlar hala orada, Rusya'nın bir kez daha özgür olacağı günü hayal ediyorlar. O Rusya'nın siyasi sisteminin neye benzediği onlar için ikinci planda. Ülkenin ihtiyaç duyduğu hükûmeti yaratmadan önce, önce iktidarı ele geçirmemiz gerekecek ve bunu birlikte daha iyi yapabiliriz."
 SOV_unification_of_the_exiles_tt:0 "Bir Karargâh oluşturulduğunda §Y[GetSovietCivilWarName]§! sırasında yardım için Yabancı Güçlerle etkileşime izin verir"
 SOV_upgrade_industrial_designer_tt:0 "Aşağıdaki Endüstriyel Tasarımcıları değiştir: \n\n§Y$stalingrad_tractor_factory$§!: Endüstriyel Araştırma Hızı: §G+%10§!, Tüketim Malları Fabrikaları Faktörü: §Y-%5.0§! \n\n§Y$leningrad_polytechnical_institute$§!: Elektronik Araştırma Hızı: §G+%10§!, Tedarik Tüketimi: §G-%2.0§! \n\n§Y$SOV_soviet_railways$§!: Trenler ve Demiryolları Araştırma Hızı: §G+%10§!, Seferberlik Hızı: §G+%2.0§!"
 SOV_vengeance_for_the_yoke:0 "Boyunduruğun İntikamı"
 SOV_vengeance_for_the_yoke_desc:0 "Birçok yüzyıl önce Moğollar Rus topraklarına acımasız işgallerini başlattılar. Rusya'yı gerçekten fethetmiş olduğu söylenebilecek tek halk onlardır. Şimdi zayıf görünebilirler, ama bir daha asla Tatar Boyunduruğu'nu hissetmememiz için eski güçlerine asla dönmemelerini sağlamalıyız."
 SOV_victory_over_devastation:0 "Yıkım Üzerine Zafer"
 SOV_victory_over_devastation_desc:0 "Halkımızın kolektif çabaları, iç savaşın neden olduğu yıkımdan ileriye gitmemizi sağladı. Ülkenin yeniden inşa edilme hızı, işçilerimizin becerilerine ve bağlılığına bir anıt olarak sonsuza dek kalacaktır."
 SOV_victory_over_devastation_industrial_relocation_tt:0 "§Y$SOV_industry_relocation$§! karar süresi: §G-%50§!"
 SOV_victory_over_devastation_tt:0 "§Y$SOV_planned_economy_dynamic_modifier$§!'ı şu şekilde değiştir: \nTüketim Malları Fabrikaları: §Y-%2.0§! \nParti Popülerliği İstikrar Etkeni: §G+%15.00§! \nAsgari Teslim Olma Limiti: §G+%10.00§! \nFabrika Tamir Hızı: §G+%10.00§! \n\n"
 SOV_volunteers_allowed_kuomintang_tt:0 "$volunteers_allowed_intro$ §Y[CHI.GetNameDef]§!."
