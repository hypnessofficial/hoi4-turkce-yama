 SOV_volunteers_allowed_sinkiang_tt:0 "$volunteers_allowed_intro$ §Y[SIK.GetNameDef]§!."
 SOV_war_economy:0 "Savaş Ekonomisi"
 SOV_war_economy_desc:0 "Sınırlarımızdaki kapitalist ve gerici ulusların zayıflık anımızda saldırmayı planladıkları açıktır. Ekonomimizi ne kadar erken bir savaş durumuna geçirirsek o kadar iyi olur."
 SOV_war_economy_stability_tt:0 "[ROOT.GetNameDef] savaşta değilse bir §Yİstikrar§! cezası alacak:"
 SOV_war_economy_stability_war_tt:0 "§G[ROOT.GetNameDefCap] savaşta ve herhangi bir §Yİstikrar§! cezası almayacak.§!\n\n"
 SOV_war_heroes:0 "Savaş Kahramanları"
 SOV_war_heroes_desc:0 "Ruslar her zaman anavatanın herhangi bir işgalcisini yenmek uğruna aşırı cesaret eylemleri gerçekleştirmeye muktedir ve istekli olmuşlardır. Düşmana karşı mücadelemizde birleşmiş olsak da, ordumuzda görev çağrısının çok ötesine geçen bazı askerlerin olmadığını iddia etmemeliyiz."
 SOV_war_measures_in_the_east:0 "Doğu'da Savaş Tedbirleri"
 SOV_war_measures_in_the_east_desc:0 "Faşizm ve diğer karşı-devrimci ideolojilere karşı küresel mücadele, çok geçmeden kesinlikle Asya'ya ulaşacaktır. Müttefiklerimize, çaresiz zamanlarda çaresiz önlemlerin gerekebileceğini açıkça belirtmeliyiz."
 SOV_war_measures_scope_tt:0 "Asya'daki her küçük müttefik:"
 SOV_warsaw_pact_faction:0 "Varşova Paktı"
 SOV_westward_bound:0 "Batıya Yöneliş"
 SOV_westward_bound_desc:0 "Batı mülklerimizin çoğu, devrimin neden olduğu imparatorluğumuzun çöküşüyle kaybedildi. Haklı mülklerimizi geri almaya hazırlanmak için altyapımızı inşa etme zamanı geldi."
 SOV_will_trigger_a_great_purge_tt:0 "Stalin bir Büyük Tasfiye başlatacak. §RBu tasfiyeden kaçınılamayacak.§!"
 SOV_women_in_aviation:0 "Havacılıkta Kadınlar"
 SOV_women_in_aviation_desc:0 "Geçmişte, toplumdaki geri unsurlar uçmayı bir erkek alanı olarak ilan ettiler. Ancak, dünyanın dört bir yanındaki kadınlar bunu görmezden geldi ve erkek meslektaşları kadar iyi olduklarını gösterdiler. Kadınlarımızı uçmayı denemeye teşvik etmeliyiz, aralarından en yetenekli pilotları seçmek için."
 SOV_women_in_aviation_ns_tt:0 "$SOV_modify_airforce_ns_intro$ \nAs olma şansı: §G+%25.00§! \nHava Filosu Eğitim Deneyimi Kazancı: §G+%5§! \nHava Filosu Görev Deneyimi Kazancı: §G+%5§! \nKötü Hava Cezası: §G-%5.00§! \n\n"
 SOV_womens_fascist_movement:0 "Kadınların Faşist Hareketi"
 SOV_womens_fascist_movement_desc:0 "Kadının rolü doğal olarak kocasına dinlenmesi için rahat bir ev ve savaşması için bir aile sağlamak olsa da, birçok erkek ülkelerine ve halklarına ne borçlu olduklarını unuttu. Birkaç adanmış kadın, belki de kocalarına neyin tehlikede olduğunu hatırlatmak ve yapılması gerekeni yapmaya teşvik etmek için kullanılabilir."
