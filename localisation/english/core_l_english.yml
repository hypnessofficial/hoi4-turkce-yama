 SUPPLY_FLOW_SHOW_RANGE:0 "§Hİkmal Merkezleri§! yakındaki illere ikmal dağıtır. Menzilleri ve verimlilikleri hava durumuna, zemin koşullarına, altyapıya, demiryolu seviyesine ve motorizasyona bağlıdır.\n\nBir §Hİkmal Merkezi§! tarafından sağlanan menzili ve ikmali artırmak için §HDemiryollarını Yükselt§! komutunu kullanmayı, §HMotorizasyon Seviyesini§! değiştirmeyi veya §HAltyapı Seviyesini§! yükseltmeyi düşünün.\n\nMenzili göstermek için §GShift tuşunu basılı tutun§!.\nMotorizasyonu açıp kapatmak için §GShift-tıklayın§!.\nMüttefik ikmalini açıp kapatmak için §GCtrl-tıklayın§!."
