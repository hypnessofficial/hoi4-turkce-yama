 UNITS_VIEW_BTN_AREA_DEFENSE:0 "§HBölge Savunması§!\nSavunulacak eyaletleri eklemek veya çıkarmak için üzerlerine §Gtıklayın§!. Bu emri alan bir orduya aynı anda başka türde emir verilemez.\n\nTümenler; önemli şehirleri, limanları ve diğer stratejik noktaları korumak, küçük düşman birliklerine karşı koymak için seçilen bölgeye yayılır."
