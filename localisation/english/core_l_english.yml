 NAVAL_MISSION_NAME_STRIKE_FORCE:0 "Saldırı Gücü"
 NAVAL_MISSION_NAME_STRIKE_FORCE_DESC:0 "Görev gücüne, bir düşman görev gücü tespit edilene kadar en yakın deniz üssünde beklemesini emret.\nBir düşman devriye görev güçlerinizden biri tarafından tespit edildiğinde, vurucu gücünüz onu engellemek için harekete geçecektir.\n\nDüşmanlarla aktif olarak çatışmadığında, bu görev $PERCENT|%0G$ yakıt tüketir."
 NAVAL_MISSION_NAME_TRAINING:0 "Donanma Tatbikatları"
 NAVAL_MISSION_NAME_TRAINING_DESC:0 "Bir görev gücüne en yakın donanma üssüne bitişik bölgede tatbikat yapma emri verin.\nBu, zamanla gemilere hasar verme şansına sahiptir.\nMürettebat, Kıdemli seviyesine ulaştığında deneyim kazanmaz.\nEğitim sırasında §YDonanma Deneyimi§! kazanacaksınız.\n§YFilonun Gururu§! olan geminin bir kaza geçirme olasılığı daha düşüktür.\n\nTüm gemiler tamamen eğitilene kadar §HDonanma Tatbikatlarını§! etkinleştirmek için §HShift§! tuşuna basılı tutun ve tıklayın."
