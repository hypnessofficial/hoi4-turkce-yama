 NAVAL_MISSION_NAME_NONE:0 "Emir Bekliyor"
 NAVAL_MISSION_NAME_PATROL:0 "Devriye"
 NAVAL_MISSION_NAME_PATROL_DESC:0 "Görev gücüne filonun operasyon bölgesinde devriye gezme emri verin.\n\nBir görev gücü aynı anda yalnızca bir bölgede devriye gezebilir.\nAktif bölgesindeki düşman filolarını tespit etmeye çalışacaktır. Radar ve Hava Üstünlüğü düşmanı daha hızlı tespit etmesine yardımcı olacaktır.\n\nUnutmayın ki düşman sizi sizden önce tespit edip angaje olabilir."
