 NAVAL_MISSION_MISSED_REQUIREMENT_WARN_SURFACE_VISIBILITY_DESC:0 "Görev gücü çok görünür ve bir düşman tarafından kolayca tespit edilebilir ve/veya kaçınılabilir. Daha düşük Su Yüzeyi Görünürlüğüne sahip daha küçük veya daha az zırhlı gemiler kullanmayı düşünün."
