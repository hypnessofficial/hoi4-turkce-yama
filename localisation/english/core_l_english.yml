 SUPPLY_FLOW_DELAYED_DESC:0 "§HKalan İkmal§! bu ile ne kadar ikmal sağlandığını gösterir ve eyalet ikmali ile menzil içindeki merkezlerden oluşur. Merkez menzili hava durumu, zemin koşulları, altyapı, demiryolu seviyesi ve motorizasyondan etkilenir. \n\n§HTümenler§!, ikmal ağırlıklarına göre il ikmalini tüketecektir. §HDepolanan İkmalleri§! bulundukları yerdeki ikmal oranının üzerindeyse, depolanan ikmal yerel ikmalle aynı seviyeye gelene kadar iç depolarından tüketeceklerdir.\n\nAkış kaynaklarını göstermek için §GCtrl tuşunu basılı tutun§!."
