 NAVAL_MISSION_NAME_HOLD:0 "Bekle"
 NAVAL_MISSION_NAME_HOLD_DESC:0 "§GTıklayın§! veya £h \nMevcut görevi iptal eder ve en yakın limana gider.\n\n§GCtrl+Tıklayın§! veya £ctrl  +£h \nMevcut görevi iptal eder ve bulunduğu yerde kalır.\n--------------\nKara muharebesine komşu bir deniz bölgesinde Bekle görevindeki büyük savaş gemileri §HKıyı Bombardımanı§! ile destek verebilir.\nDenizde Bekle görevindeki uçak gemilerinin hava kanatları standart hava görevlerinde kullanılabilir."
 NAVAL_MISSION_NAME_INVASION:0 "Nakliye/Çıkarma"
 NAVAL_MISSION_NAME_INVASION_DESC:0 "Bir görev gücüne seçilen §YÇıkarma emirlerinde§! asker nakliyesini ve çıkarmaları aktif olarak destekleme emri verin.\nBu görevi etkinleştirmek için §GTıklayın§!, ardından bir çıkarma oku çizdiyseniz üzerine §GTıklayın§!."
