 UNITS_VIEW_BTN_DRAW_BLITZ:0 "§HYarma Taarruzu§!\nHaritada §Gsağ tıklayıp sürükleyerek§! bir §Yyarma taarruzu hattı§! çizin. Hat, bir §Ycephe hattına§! veya §Ydeniz çıkarmasına§! atanmış bölgede çizilebilir.\n\nNormal §Ytaarruz hattından§! farklı olarak tümenler, durum değiştikçe planı genişletmek yerine ilk çizilen güzergâhtaki bütün illeri ele geçirmeye çalışır. Bu emir; düşmanı kuşatmak, ikmal bağlantılarını kesmek ve dar bir alanda kontrollü ilerlemek için uygundur.\n\nOrdudaki hava indirme tümenlerine hat çizildiğinde otomatik olarak §Yhava indirme emirleri§! atanır. Bunu önlemek için çizerken §GAlt§! tuşunu basılı tutun."
 UNITS_VIEW_BTN_DRAW_BLITZ_FRONT_LINE_FIRST:0 "§RÖnce bir cephe hattı oluşturmalısınız.§!"
 UNITS_VIEW_BTN_DRAW_DEFENCE:0 "§HCephe Hattı§!\n- Başka bir ülkeyle olan sınırın tamamına cephe atamak için sınıra §Gtıklayın§!.\n- Sınırın yalnızca bir bölümüne cephe atamak için §Gsağ tıklayıp sürükleyin§!.\n- Mevcut cephenin uçlarını düzenlemek için uç noktalara §Gsağ tıklayıp sürükleyin§!.\n\n§YCephe hatları§!, tümenleri bir sınır boyunca konuşlandırır ve §Ytaarruz hatlarına§! doğru ilerleyen saldırıların başlangıç noktasını belirler."
 UNITS_VIEW_BTN_DRAW_DEFENCE_ARMY_GROUP:0 "§HCephe Hattı§!\n- Sınırın tamamına cephe atamak için sınıra §Gtıklayın§!.\n- Alt ordular için ayrı cepheler oluşturmadan cephe atamak için §GShift + tıklayın§!.\n- Sınırın yalnızca bir bölümüne cephe atamak için §Gsağ tıklayıp sürükleyin§!.\n- Alt ordu cepheleri oluşturmadan bir bölüm seçmek için §GShift + sağ tıklayıp sürükleyin§!.\n- Mevcut cephenin uçlarını düzenlemek için uç noktalara §Gsağ tıklayıp sürükleyin§!.\n\n§YCephe hatları§!, tümenleri bir sınır boyunca konuşlandırır ve §Ytaarruz hatlarına§! doğru ilerleyen saldırıların başlangıç noktasını belirler."
 UNITS_VIEW_BTN_DRAW_FALLBACK:0 "§HGeri Çekilme Hattı§!\nDost topraklarda §Gsağ tıklayıp sürükleyerek§! sabit bir savunma hattı çizin.\n\n§YGeri çekilme hatları§!, tümenleri bir nehrin gerisinde veya dost topraklardaki başka bir savunma mevzisinde konuşlandırmak için kullanılır."
 UNITS_VIEW_BTN_DRAW_NAVAL_INV:0 "§HDeniz Çıkarması Emri§!\n1. Çıkış limanını seçmek için işaretli illerden birine §Gtıklayın§!.\n2. Çıkarma yapılacak kıyı illerine §Gsağ tıklayın§!.\nPlan etkinleştirildiğinde hazırlıklar başlar ve ülkenizin konvoylarından gerekli miktar ayrılır."
 UNITS_VIEW_BTN_DRAW_NAVAL_INV_WITH_HARBOR:0 "§HDeniz Çıkarması Emri — Yüzer Liman Desteği§!\n1. Çıkış limanını seçmek için işaretli illerden birine §Gtıklayın§!.\n2. Çıkarma yapılacak kıyı illerine §Gsağ tıklayın§!.\nPlan etkinleştirildiğinde hazırlıklar başlar; stoktan konvoylar ve bir yüzer liman ayrılır."
