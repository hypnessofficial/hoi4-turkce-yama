 UNITS_VIEW_BTN_DRAW_OFFENCE:0 "§HTaarruz Hattı§!\nHaritada §Gsağ tıklayıp sürükleyerek§! bir §Ytaarruz hattı§! çizin. Hat, bir §Ycephe hattına§! veya §Ydeniz çıkarmasına§! atanmış bölgede çizilebilir.\n\nBu plana atanan tümenler, cephelerini taarruz hattına taşımak için aradaki düşman topraklarını ele geçirmeye çalışır.\n\nOrdudaki hava indirme tümenlerine hat çizildiğinde otomatik olarak §Yhava indirme emirleri§! atanır. Bunu önlemek için çizerken §GAlt§! tuşunu basılı tutun.\n\nPlanın uygulama biçimini değiştirmek için §Gfare düğmesini basılı tutup§! uygun uygulama düğmesinin üzerinde §Gbırakın§!."
