 heavy_tank_chassis:0 " Ağır Tank"
 heavy_tank_chassis_0:0 "Savaş Arası Ağır Tank"
 heavy_tank_chassis_1:0 "Temel Ağır Tank"
 heavy_tank_chassis_2:0 "Geliştirilmiş Ağır Tank"
 heavy_tank_chassis_3:0 "Gelişmiş Ağır Tank"
 heavy_tank_chassis_desc:0 "Ağır bir top, kalın bir zırh veya her ikisini birden taşıyabilen büyük bir şasi."
 heavy_tank_destroyer_chassis:0 " Ağır Tank Avcısı"
 heavy_tank_destroyer_chassis_0:0 "Savaş Arası Ağır Tank Avcısı"
 heavy_tank_destroyer_chassis_1:0 "Temel Ağır Tank Avcısı"
 heavy_tank_destroyer_chassis_2:0 "Geliştirilmiş Ağır Tank Avcısı"
 heavy_tank_destroyer_chassis_3:0 "Gelişmiş Ağır Tank Avcısı"
 heavy_tank_destroyer_chassis_desc:0 "Düşman zırhını yok etmek için güçlü bir top taşıyan büyük bir araç."
 heavy_tank_destroyer_equipment_0:0 "SA Ağır Tank Avcısı"
 heavy_tank_equipment_0:0 "SA Ağır Tank"
 heavy_tank_flame_chassis:0 " Ağır Alev Tankı"
 heavy_tank_flame_chassis_0:0 "Savaş Arası Ağır Alev Tankı"
 heavy_tank_flame_chassis_1:0 "Temel Ağır Alev Tankı"
 heavy_tank_flame_chassis_2:0 "Geliştirilmiş Ağır Alev Tankı"
 heavy_tank_flame_chassis_3:0 "Gelişmiş Ağır Alev Tankı"
 heavy_tank_flame_chassis_desc:0 "Tahkimatlara ve evlere saldırmak için taretinde bir alev makinesi taşıyan büyük bir araç."
 heavy_tank_flame_equipment_0:0 "SA Ağır Alev Tankı"
 improved_heavy_tank_chassis:0 "Geliştirilmiş Ağır Tank"
 improved_heavy_tank_chassis_desc:0 "Savaşın doğası değişmiş olsa da, düşman hatlarında bir yarık açmak veya bir düşman saldırısına karşı savunmayı güçlendirmek için kalın zırhlı ağır bir araca hala yer var."
 improved_heavy_tank_chassis_short:0 "1940 Ağır"
 improved_light_tank_chassis:0 "Geliştirilmiş Hafif Tank"
 improved_light_tank_chassis_desc:0 "Önceki hafif tanklarla kazanılan deneyimlere dayanan bir başka yineleme olan bu şasi, daha iyi güvenilirlik ve bakım sağlar."
 improved_light_tank_chassis_short:0 "1936 Hafif"
 improved_medium_tank_chassis:0 "Geliştirilmiş Orta Tank"
 improved_medium_tank_chassis_desc:0 "Önceki nesil orta tankların deneyimlerine dayanarak, güncel kalabilmek için daha büyük taşıma kapasitesine sahip yeni bir tasarıma ihtiyaç olduğu açıktır."
 improved_medium_tank_chassis_short:0 "1940 Orta"
 land_cruiser_chassis:0 " Kara Kruvazörü Şasisi"
 land_cruiser_chassis_1:0 "Kara Kruvazörü Şasisi"
 land_cruiser_chassis_desc:0 "Devasa bir şasi, ağır zırhlı ve süper ağır silahları desteklemek ve muazzam savaş alanı cezalarına dayanmak üzere tasarlanmış, ancak devasa boyutu nedeniyle yüksek yakıt tüketimi ve yavaş hıza sahip."
 lc_aircraft_catapult:0 "Uçak Mancınığı"
 lc_aircraft_catapult_desc:0 "Küçük keşif uçakları için bir fırlatma sistemi, Kara Kruvazörünün uzak bölgeleri keşfetmesini ve gerçek zamanlı savaş alanı istihbaratı sağlamasını sağlar."
 lc_armored_skirts:0 "Zırhlı Etekler"
 lc_armored_skirts_desc:0 "Savunmasız paletleri ve süspansiyon sistemlerini tanksavar silahlarından ve hafif silah ateşinden korumak için yanlara monte edilmiş güçlendirilmiş zırh kaplaması."
 lc_assault_gun:0 "Saldırı Topu"
 lc_assault_gun_desc:0 "Yakın mesafeli şehir savaşı ve sığınak imhası için tasarlanmıştır. Bu silah, piyadeleri ve sertleştirilmiş hedefleri temizlemek için güçlü, yüksek patlayıcılı mermiler atar."
 lc_bunker_emplacement:0 "Sığınak Mevzisi"
 lc_bunker_emplacement_desc:0 "Kara Kruvazörünü mobil bir sığınağa dönüştüren dahili bir tahkim edilmiş yapı. Mürettebatın ağır ateş altındayken bile savunma pozisyonlarını tutmasına ve düşmana karşılık vermesine olanak tanır."
 lc_command_center:0 "Komuta Merkezi"
 lc_command_center_desc:0 "Kara Kruvazörünü, büyük ölçekli askeri operasyonları koordine etmek için gelişmiş iletişim sistemleriyle donatılmış bir mobil karargaha dönüştüren tam entegre bir komuta merkezi."
 lc_flamethrower_turret:0 "Alev Makinesi Dizisi"
 lc_flamethrower_turret_desc:0 "Tahkim edilmiş mevzileri, piyadeleri ve pusu noktalarını temizlemek için mükemmel olan bir ateş akışı püskürten özel bir taret. Yoğun kentsel ortamlarda yakın mesafe çatışmalar için idealdir."
 lc_heavy_anti_air_battery:0 "Ağır Uçaksavar Bataryası"
 lc_heavy_anti_air_battery_desc:0 "Yüksek hızlı ve yüksek irtifalı uçakları hedeflemek için büyük kalibreli toplarla donatılmış bir uçaksavar bataryası, aracın etrafında bir savunma balonu sağlar."
 lc_heavy_anti_air_platform:0 "Ağır Uçaksavar Platformu"
 lc_heavy_anti_air_platform_desc:0 "Kara Kruvazörünü tehdit eden düşman bombardıman uçaklarına ve keşif uçaklarına karşı savunmak için tasarlanmış, çok sayıda yüksek kalibreli uçaksavar topu monte edilmiş bir platform."
 lc_heavy_high_velocity_cannons:0 "Ağır Yüksek Hızlı Toplar"
 lc_heavy_high_velocity_cannons_desc:0 "Nokta atışı hassasiyetiyle düşman zırhını vurmak ve yok etmek için tasarlanmış tanksavar topları. Yüksek hızlı mermileri, uzun menzillerde mükemmel delme sağlar."
 lc_heavy_naval_guns:0 "Ağır Deniz Topları"
 lc_heavy_naval_guns_desc:0 "Böylesine devasa bir zırhlı araç için standart ana silah donanımı olan bu güçlü, denizcilik sınıfı toplar, hem zırhlı hem de tahkim edilmiş hedeflere karşı yıkıcı ateş gücü sağlayarak doğrudan çatışma için uyarlanmıştır."
 lc_helipad:0 "Helikopter Pisti"
 lc_helipad_desc:0 "Gelişmiş hava keşfi sağlamak ve savaş alanında durumsal farkındalığı artırmak için tasarlanmış helikopter fırlatma platformu."
 lc_high_impact_obliterator_cannon:0 "Yüksek Etkili İmha Topu"
 lc_high_impact_obliterator_cannon_desc:0 "Aşırı kalın zırhı delmek için özel olarak tasarlanan bu silahın yüksek kinetik enerjisi, onu diğer süper ağır tanklara karşı zorlu bir karşı koyma aracı yapar."
 lc_high_velocity_cannon_turret:0 "Eş Eksenli Yüksek Hızlı Top"
 lc_high_velocity_cannon_turret_desc:0 "Düşman zırhına saldırmak için yüksek hızlı bir topla donatılmış bir taret. Daha küçük boyutu, daha hafif zırhlı tehditlere karşı hızlı ve duyarlı ateş desteği sağlamasına olanak tanır."
 lc_hull_mounted_railway_gun:0 "Gövdeye Monte Demiryolu Topu"
 lc_hull_mounted_railway_gun_desc:0 "Maksimum stabilite için doğrudan gövdeye inşa edilmiş yeniden tasarlanmış bir demiryolu topu, ağır ateş desteği sağlar ve uzak hedeflere yüksek hassasiyetle saldırabilir."
 lc_internal_ammunition_compartments:0 "Dahili Mühimmat Bölmeleri"
 lc_internal_ammunition_compartments_desc:0 "Ek mühimmat taşımak için güçlendirilmiş depolama alanları, Kara Kruvazörünün ikmal yapmadan uzun süreli çatışmaları sürdürmesini sağlar."
 lc_internal_fuel_tanks:0 "Dahili Yakıt Tankları"
 lc_internal_fuel_tanks_desc:0 "Gövde içindeki genişletilmiş yakıt bölmeleri, aracın operasyonel menzilini artırır ve uzun süreli seferler sırasında sık yakıt ikmali ihtiyacını azaltır."
 lc_light_anti_air_battery:0 "Hafif Uçaksavar Bataryası"
 lc_light_anti_air_battery_desc:0 "Alçaktan uçan uçakları hedeflemek ve aracı alçak uçuş saldırılarından ve pike bombardıman uçaklarından korumak için tasarlanmış hafif bir uçaksavar bataryası."
 lc_medium_cannon_turret:0 "Eş Eksenli Orta Top"
 lc_medium_cannon_turret_desc:0 "Piyade ve hafif araçlara saldırabilen standart bir tarete monte top. Kompakt tasarımı, onu yakın mesafe çatışmalar ve ikincil roller için çok yönlü kılar."
 lc_medium_naval_guns:0 "Orta Deniz Topları"
 lc_medium_naval_guns_desc:0 "Ateş hızı ve ateş gücünün dengeli bir birleşimini sunan bu toplar, daha hafif araçlara saldırmada ve zırhsız hedeflere karşı destek sağlamada etkilidir."
 lc_obstacle_clearance_gear:0 "Engel Temizleme Donanımı"
 lc_obstacle_clearance_gear_desc:0 "Enkazları temizlemek, zorlu arazide yollar açmak ve siper kazma operasyonlarına yardımcı olmak için tasarlanmış devasa buldozer bıçakları ve vinçler gibi ağır hizmet ataşmanları."
 lc_radar:0 "Radar"
 lc_radar_desc:0 "Düşman uçakları ve yakındaki kuvvetler hakkında farkındalığı artıran, Kara Kruvazörünün potansiyel hava veya kara tehditlerine hazırlanmasını sağlayan bir erken tespit sistemi."
 lc_radio_1:0 "$tank_radio_1$"
 lc_radio_1_desc:0 "$tank_radio_1_desc$"
 lc_radio_2:0 "$tank_radio_2$"
 lc_radio_2_desc:0 "$tank_radio_2_desc$"
 lc_radio_3:0 "$tank_radio_3$"
 lc_radio_3_desc:0 "$tank_radio_3_desc$"
 lc_rocket_launcher:0 "Roketatar"
 lc_rocket_launcher_desc:0 "Kara Kruvazörüne monte edilmiş, düşman savunmasını bastırmak ve büyük oluşumları ezmek için yıkıcı roket salvoları atan modüler bir roket sistemi."
 lc_smoke_generators:0 "Sis Jeneratörleri"
 lc_smoke_generators_desc:0 "Aracın hareketlerini maskeleyen ve hem kara hem de hava tabanlı tehditlere karşı görünürlüğünü azaltan kalın sis perdeleri dağıtmak için tasarlanmış bir sistem."
 lc_stabilizers:0 "Stabilizatörler"
 lc_stabilizers_desc:0 "Ateş ederken geri tepmeyi azaltan ve top hizasını koruyan mekanik cihazlar, kısa duraklamalar sırasında daha hızlı hedef tespiti ve daha isabetli atış yapılmasına olanak tanır."
 lc_super_heavy_howitzer:0 "Süper Ağır Obüs"
 lc_super_heavy_howitzer_desc:0 "Tahkimatları ve şehir savunmalarını ezmek için tasarlanmış devasa bir obüs. Bu varyant, siperli mevzileri temizlemek ve tahkim edilmiş yapıları yok etmek için ideal olan yüksek patlayıcılı mermiler atmada uzmanlaşmıştır."
 lc_super_heavy_railway_gun:0 "Süper Ağır Demiryolu Topu"
 lc_super_heavy_railway_gun_desc:0 "Aslen demiryolu platformları için inşa edilen bu devasa top, eşsiz yıkıcı güçle aşırı menzillerden hedefleri bombalayabilir."
 lc_wet_ammunition_storage:0 "Sulu Mühimmat Deposu"
 lc_wet_ammunition_storage_desc:0 "Düşman isabetlerinden kaynaklanan mühimmat patlama riskini en aza indirmek için sıvı soğutucu ile doldurulmuş özel bölmeler, mürettebat güvenliğini büyük ölçüde artırır."
 light_flame_tank:0 "Hafif Alev Tankı Bölüğü"
 light_flame_tank_desc:0 "Şehirlere ve tahkimatlara saldırırken destek sağlamak için hafif, alev makinesi donanımlı araçlardan oluşan bir bölük."
