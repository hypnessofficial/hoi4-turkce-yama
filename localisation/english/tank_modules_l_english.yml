 main_battle_tank_chassis:0 "Modern Tank"
 main_battle_tank_chassis_desc:0 "Deneyimler, hafif, orta ve ağır tank tasarımlarının giderek daha fazla birbirine yaklaştığını göstermiştir. Ağır tanklar daha hareketli hale gelirken, hafif tanklar hayatta kalmak için daha ağır silah ve zırh taşıyor. Bu nedenle, üç tasarımı da evrensel bir Ana Muharebe Tankı olacak tek bir tipte birleştirmekte fayda vardır."
