 super_heavy_tank_destroyer_chassis_desc:0 "En ağır zırhı ve en büyük topu taşıyabilen, ancak sonuç olarak oldukça yavaş ve güvenilmez olan devasa bir araç."
 tank_anti_air_cannon:0 "Temel Uçaksavar Topu"
 tank_anti_air_cannon_2:0 "Geliştirilmiş Uçaksavar Topu"
 tank_anti_air_cannon_2_desc:0 "Uçaklara saldırmak için tasarlanmış hızlı ateş eden otomatik bir top. Kara hedeflerine karşı ateş destek silahı olarak sınırlı potansiyele sahiptir."
 tank_anti_air_cannon_3:0 "Gelişmiş Uçaksavar Topu"
 tank_anti_air_cannon_3_desc:0 "Uçaklara saldırmak için tasarlanmış hızlı ateş eden otomatik bir top. Kara hedeflerine karşı ateş destek silahı olarak sınırlı potansiyele sahiptir."
 tank_anti_air_cannon_desc:0 "Uçaklara saldırmak için tasarlanmış hızlı ateş eden otomatik bir top. Kara hedeflerine karşı ateş destek silahı olarak sınırlı potansiyele sahiptir."
 tank_auto_cannon:0 "Otomatik Top"
 tank_auto_cannon_2:0 "Geliştirilmiş Otomatik Top"
 tank_auto_cannon_2_desc:0 "Hızlı ateş eden bir uçaksavar topundan uyarlanan bu otomatik top, yumuşak hedeflere karşı yıkıcı bir ateş yağmuru indirebilir. Küçük kalibresi, zırh karşıtı performansını sınırlar."
 tank_auto_cannon_desc:0 "Hızlı ateş eden bir uçaksavar topundan uyarlanan bu otomatik top, yumuşak hedeflere karşı yıkıcı bir ateş yağmuru indirebilir. Küçük kalibresi, zırh karşıtı performansını sınırlar."
 tank_bogie_suspension:0 "Boji Süspansiyonu"
 tank_bogie_suspension_desc:0 "Yol tekerleklerinin ayrı ayrı monte edildiği basit ve oldukça ucuz bir süspansiyon türü, bu sayede hasar gördüklerinde kolayca değiştirilebilirler."
 tank_cast_armor:0 "Döküm Zırh"
 tank_cast_armor_desc:0 "Zırh da dahil olmak üzere tüm Şasi, tek bir birim olarak dökülür. Daha az zayıf noktayla çok daha kalın zırha izin veren pahalı ve zaman alıcı bir süreçtir."
 tank_christie_suspension:0 "Christie Süspansiyonu"
 tank_christie_suspension_desc:0 "Amerikalı bir mucit tarafından geliştirilen bu süspansiyon, olağanüstü yüksek hızlara izin verir."
 tank_close_support_gun:0 "Yakın Destek Topu"
 tank_close_support_gun_desc:0 "Piyadenin saldırısına yardımcı olmak için düşman sahra tahkimatlarına karşı yüksek patlayıcılı mermiler ateşlemek üzere tasarlanmış küçük bir silah. Tanklara saldırabilse de, kısa namlusu ve sınırlı mühimmatı, daha güçlü düşman tanklarıyla başa çıkmasını engeller."
 tank_diesel_engine:0 "Dizel Motor"
 tank_diesel_engine_desc:0 "Dizel yakıtla çalışan bir Motor, benzinli bir motordan daha güvenilirdir, ancak aynı Motor Boyutu için o kadar hızlı değildir."
 tank_gas_turbine_engine:0 "Gaz Türbini"
 tank_gas_turbine_engine_desc:0 "Jet motorlarından geliştirilmiş bir türbin. Yüksek yakıt tüketimi, ancak belirli bir Motor Boyutunda herhangi bir motorun en yüksek hızı."
 tank_gasoline_engine:0 "Benzinli Motor"
 tank_gasoline_engine_desc:0 "Benzinle çalışan bir Motor, belirli bir Motor Boyutu için daha hızlı olacaktır, ancak yakıtın alev alma olasılığı çok daha yüksektir."
 tank_half_track_suspension:0 "Yarı Paletli Süspansiyon"
 tank_half_track_suspension_desc:0 "Tam paletli bir araç ile normal tekerlekli süspansiyon arasında bir melez olan bu düzenek, direksiyon için önde bir çift tekerleğe ve arazi performansını artırmak için paletli bir arka aksa sahiptir. Taşıma kapasitesi sınırlı olsa da, tam paletli bir tasarımdan daha ucuzdur."
 tank_heavy_cannon:0 "Temel Ağır Top"
 tank_heavy_cannon_2:0 "Geliştirilmiş Ağır Top"
 tank_heavy_cannon_2_desc:0 "Büyük bir mermi ateşleyebilen bir silah. Olağanüstü zırh delme ve yumuşak hedeflere karşı yeterli performansıyla, en büyük dezavantajları, onu taşımak için özel olarak tasarlanmamış çoğu araca monte edilmesini zorlaştıran devasa boyutu ve maliyetidir."
 tank_heavy_cannon_3:0 "Gelişmiş Ağır Top"
 tank_heavy_cannon_3_desc:0 "Büyük bir mermi ateşleyebilen bir silah. Olağanüstü zırh delme ve yumuşak hedeflere karşı yeterli performansıyla, en büyük dezavantajları, onu taşımak için özel olarak tasarlanmamış çoğu araca monte edilmesini zorlaştıran devasa boyutu ve maliyetidir."
 tank_heavy_cannon_desc:0 "Büyük bir mermi ateşleyebilen bir silah. Olağanüstü zırh delme ve yumuşak hedeflere karşı yeterli performansıyla, en büyük dezavantajları, onu taşımak için özel olarak tasarlanmamış çoğu araca monte edilmesini zorlaştıran devasa boyutu ve maliyetidir."
 tank_heavy_fixed_superstructure_turret:0 "Ağır Sabit Üst Yapı"
 tank_heavy_fixed_superstructure_turret_desc:0 "Sabit bir üst yapı, ana silahın tüm aracı döndürmeden yalnızca küçük bir yayda dönmesine izin verir. Ancak, aracın genel olarak daha küçük boyutlu olurken daha büyük bir silah taşımasına olanak tanır, bu da aracı pusular için mükemmel hale getirir."
 tank_heavy_howitzer:0 "Ağır Obüs"
 tank_heavy_howitzer_desc:0 "Bir araca monte edilmek üzere uyarlanmış bir ağır sahra obüsü. Birincil amacı yumuşak hedeflere karşı dolaylı ateş desteğidir, ancak gerekirse doğrudan bir hedefe ateş edilebilir. Sadece az miktarda zırh delici mühimmat taşıdığı için tanksavar görevleri için uygun değildir."
 tank_heavy_machine_gun:0 "Ağır Makineli Tüfek"
 tank_heavy_machine_gun_desc:0 "Bir makineli tüfek, düşük maliyetle yeterli piyade karşıtı yetenek sağlar. Özel zırh delici mühimmatla bile, zırh karşıtı performansı arzulananın çok gerisindedir."
 tank_heavy_three_man_tank_turret:0 "Üç Kişilik Taret"
 tank_heavy_three_man_tank_turret_desc:0 "Üç mürettebat üyesinin ana silahı doldurma ve nişan alma görevlerini bölüşmesine ve çevrelerindeki durumun farkında kalmasına yetecek kadar büyük bir taret."
 tank_heavy_two_man_tank_turret:0 "İki Kişilik Taret"
 tank_heavy_two_man_tank_turret_desc:0 "İki mürettebat üyesinin silahı kullanma ve durumu gözlemleme işini paylaşmasına olanak tanıyan bir taret. Yine de mürettebat arasında etkili bir iş bölümüne izin vermez."
 tank_high_velocity_cannon:0 "Temel Yüksek Hızlı Top"
 tank_high_velocity_cannon_2:0 "Geliştirilmiş Yüksek Hızlı Top"
 tank_high_velocity_cannon_2_desc:0 "Yüksek namlu çıkış hızı elde etmek için özel olarak tasarlanmış bir top. Özel mühimmat kullanarak, üstün zırh karşıtı özelliklere sahiptir, ancak yumuşak hedeflere karşı performansı düşüktür."
 tank_high_velocity_cannon_3:0 "Gelişmiş Yüksek Hızlı Top"
 tank_high_velocity_cannon_3_desc:0 "Yüksek namlu çıkış hızı elde etmek için özel olarak tasarlanmış bir top. Özel mühimmat kullanarak, üstün zırh karşıtı özelliklere sahiptir, ancak yumuşak hedeflere karşı performansı düşüktür."
 tank_high_velocity_cannon_desc:0 "Yüksek namlu çıkış hızı elde etmek için özel olarak tasarlanmış bir top. Özel mühimmat kullanarak, üstün zırh karşıtı özelliklere sahiptir, ancak yumuşak hedeflere karşı performansı düşüktür."
 tank_interleaved_suspension:0 "İç İçe Geçmiş Tekerlekler"
 tank_interleaved_suspension_desc:0 "Yol tekerleklerini üst üste bindirerek, gövdenin aynı uzunluğuna daha fazlası sığdırılabilir, böylece hareket kabiliyeti artırılır ve yanlarda ek koruma sağlanır."
 tank_light_fixed_superstructure_turret:0 "Hafif Sabit Üst Yapı"
 tank_light_fixed_superstructure_turret_desc:0 "Sabit bir üst yapı, ana silahın tüm aracı döndürmeden yalnızca küçük bir yayda dönmesine izin verir. Ancak, aracın genel olarak daha küçük boyutlu olurken daha büyük bir silah taşımasına olanak tanır, bu da aracı pusular için mükemmel hale getirir."
 tank_light_one_man_tank_turret:0 "Tek Kişilik Taret"
 tank_light_one_man_tank_turret_desc:0 "Ana silahı nişanlamak ve doldurmakla görevli tek bir mürettebat üyesini zar zor alacak kadar küçük bir taret. Bu kişi aynı zamanda hedefleri ve tehditleri gözlemekle de sorumludur."
 tank_light_three_man_tank_turret:0 "Üç Kişilik Taret"
 tank_light_three_man_tank_turret_desc:0 "Üç mürettebat üyesinin ana silahı doldurma ve nişan alma görevlerini bölüşmesine ve çevrelerindeki durumun farkında kalmasına yetecek kadar büyük bir taret."
 tank_light_two_man_tank_turret:0 "İki Kişilik Taret"
 tank_light_two_man_tank_turret_desc:0 "İki mürettebat üyesinin silahı kullanma ve durumu gözlemleme işini paylaşmasına olanak tanıyan bir taret. Yine de mürettebat arasında etkili bir iş bölümüne izin vermez."
 tank_medium_cannon:0 "Orta Top"
 tank_medium_cannon_2:0 "Geliştirilmiş Orta Top"
 tank_medium_cannon_2_desc:0 "Çok çeşitli görevler için uygun olan genel amaçlı bir silah. Ne piyade karşıtı ne de tanksavar işinde mükemmeldir, ancak bir araca çok fazla esneklik sağlar."
 tank_medium_cannon_desc:0 "Çok çeşitli görevler için uygun olan genel amaçlı bir silah. Ne piyade karşıtı ne de tanksavar işinde mükemmeldir, ancak bir araca çok fazla esneklik sağlar."
 tank_medium_fixed_superstructure_turret:0 "Orta Sabit Üst Yapı"
 tank_medium_fixed_superstructure_turret_desc:0 "Sabit bir üst yapı, ana silahın tüm aracı döndürmeden yalnızca küçük bir yayda dönmesine izin verir. Ancak, aracın genel olarak daha küçük boyutlu olurken daha büyük bir silah taşımasına olanak tanır, bu da aracı pusular için mükemmel hale getirir."
 tank_medium_howitzer:0 "Orta Obüs"
 tank_medium_howitzer_2:0 "Geliştirilmiş Orta Obüs"
 tank_medium_howitzer_2_desc:0 "Bir araca monte edilmek üzere uyarlanmış bir orta sınıf sahra obüsü. Birincil amacı yumuşak hedeflere karşı dolaylı ateş desteğidir, ancak gerekirse doğrudan bir hedefe ateş edilebilir. Sadece az miktarda zırh delici mühimmat taşıdığı için tanksavar görevleri için uygun değildir."
 tank_medium_howitzer_desc:0 "Bir araca monte edilmek üzere uyarlanmış bir orta sınıf sahra obüsü. Birincil amacı yumuşak hedeflere karşı dolaylı ateş desteğidir, ancak gerekirse doğrudan bir hedefe ateş edilebilir. Sadece az miktarda zırh delici mühimmat taşıdığı için tanksavar görevleri için uygun değildir."
 tank_medium_one_man_tank_turret:0 "Tek Kişilik Taret"
 tank_medium_one_man_tank_turret_desc:0 "Ana silahı nişanlamak ve doldurmakla görevli tek bir mürettebat üyesini zar zor alacak kadar küçük bir taret. Bu kişi aynı zamanda hedefleri ve tehditleri gözlemekle de sorumludur."
 tank_medium_three_man_tank_turret:0 "Üç Kişilik Taret"
 tank_medium_three_man_tank_turret_desc:0 "Üç mürettebat üyesinin ana silahı doldurma ve nişan alma görevlerini bölüşmesine ve çevrelerindeki durumun farkında kalmasına yetecek kadar büyük bir taret."
 tank_medium_two_man_tank_turret:0 "İki Kişilik Taret"
 tank_medium_two_man_tank_turret_desc:0 "İki mürettebat üyesinin silahı kullanma ve durumu gözlemleme işini paylaşmasına olanak tanıyan bir taret. Yine de mürettebat arasında etkili bir iş bölümüne izin vermez."
 tank_modern_tank_turret:0 "Modern Taret"
 tank_modern_tank_turret_desc:0 "İyi düzenlenmiş bir taret, üç mürettebat üyesinin ana silahı verimli bir şekilde kullanmasına ve çevrelerini takip etmesine olanak tanır."
 tank_petrol_electric_engine:0 "Petrol-Elektrikli Motor"
 tank_petrol_electric_engine_desc:0 "Bir elektrik motoruna güç sağlayan benzinli bir motorun birleşimi. Karmaşık, pahalı ve güvenilmez olmasına rağmen, taktik hareketlerde eşsiz performans sunar."
 tank_radio_1:0 "Temel Telsiz"
 tank_radio_1_desc:0 "Temel bir iki yönlü telsiz, tankların taktik manevralarını küçük ölçekte koordine etmelerini sağlar."
 tank_radio_2:0 "Geliştirilmiş Telsiz"
 tank_radio_2_desc:0 "Geliştirilmiş bir telsiz, komutanların daha büyük tank oluşumları üzerinde etkili kontrol sağlamasına olanak tanır ve büyük ölçekli operasyonel manevralara izin verir."
 tank_radio_3:0 "Gelişmiş Telsiz"
 tank_radio_3_desc:0 "Daha güçlü bir verici ve daha iyi alım ile bu telsiz, düzinelerce kilometre üzerinden ve düşman karıştırması karşısında iletişime olanak tanır."
 tank_riveted_armor:0 "Perçinli Zırh"
 tank_riveted_armor_desc:0 "Çerçeveye cıvatalanmış ve kenarlarına çakılan perçinlerle bir arada tutulan Zırh Plakaları. Oldukça ucuz, kanıtlanmış bir teknoloji, ancak perçinli kenarlar zırhta zayıf noktalar oluşturur ve perçinler vurulursa mürettebata zarar verebilir."
 tank_rocket_launcher:0 "Roketatar"
 tank_rocket_launcher_2:0 "Geliştirilmiş Roketatar"
 tank_rocket_launcher_2_desc:0 "İsabette bir dizi iyileştirme olmasına rağmen, bu geliştirilmiş roketatarın ana avantajı, düşmana ateşlemek için daha fazla roket tutabilmesidir."
 tank_rocket_launcher_desc:0 "Güdümsüz, yüksek patlayıcılı roketler için çok namlulu bir fırlatıcı. Yüksek atış hacmi, yumuşak hedeflere karşı mükemmel performans sağlar, ancak doğrudan isabetler bile zırhlı hedeflere karşı çok az etki eder."
 tank_small_cannon:0 "Küçük Top"
 tank_small_cannon_2:0 "Geliştirilmiş Küçük Top"
 tank_small_cannon_2_desc:0 "Hem piyade karşıtı hem de zırh karşıtı mermiler ateşleyebilen küçük ve ucuz bir top. Küçük kalibresi kullanışlılığını sınırlar."
 tank_small_cannon_desc:0 "Hem piyade karşıtı hem de zırh karşıtı mermiler ateşleyebilen küçük ve ucuz bir top. Küçük kalibresi kullanışlılığını sınırlar."
 tank_super_heavy_cannon:0 "Süper Ağır Top"
 tank_super_heavy_cannon_desc:0 "Eşsiz performansa sahip absürt derecede büyük bir silah. Bu silahın yok edemeyeceği çok az şey vardır ve bunların hiçbiri bir tanka ateş etme işinde olmamalıdır."
 tank_super_heavy_four_man_tank_turret:0 "Dört Kişilik Taret"
 tank_super_heavy_four_man_tank_turret_desc:0 "Ana topa hizmet vermek için ikinci bir yükleyiciye ek alan sağlayan devasa bir taret."
 tank_super_heavy_three_man_tank_turret:0 "Üç Kişilik Taret"
 tank_super_heavy_three_man_tank_turret_desc:0 "Üç mürettebat üyesinin ana silahı doldurma ve nişan alma görevlerini bölüşmesine ve çevrelerindeki durumun farkında kalmasına yetecek kadar büyük bir taret."
 tank_torsion_bar_suspension:0 "Torsiyon Çubuğu"
 tank_torsion_bar_suspension_desc:0 "Araç şasisine sabitlenmiş metal çubuklardan oluşan oldukça güvenilir bir süspansiyon sistemi, diğer süspansiyon türlerine göre daha yumuşak bir sürüş sağlar."
 tank_welded_armor:0 "Kaynaklı Zırh"
 tank_welded_armor_desc:0 "Zırh plakaları şasiye kaynaklanır. Dökümden daha hızlı bir süreçtir ve yine de iyi koruma sağlar."
 tank_wheeled_suspension:0 "Tekerlekli Süspansiyon"
 tank_wheeled_suspension_desc:0 "Bir kamyon şasisinden türetilen bu süspansiyon, taşıma kapasitesi açısından çok sınırlıdır ve arazi performansı sınırlıdır, ancak yapımı çok ucuz olma avantajına sahiptir."
 wet_ammo_storage:0 "Sulu Mühimmat Deposu"
 wet_ammo_storage_desc:0 "Mühimmat raflarına eklenen su ceketleri, tank vurulduktan sonra mühimmatın patlama riskini önemli ölçüde azaltır, bu da mürettebat tarafından büyük takdir görür."
