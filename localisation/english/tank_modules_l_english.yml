 heavy_tank_aa_chassis_3:0 "Gelişmiş Ağır KM Uçaksavar"
 heavy_tank_aa_chassis_desc:0 "Düşman uçaklarına karşı savunma yapmak için bir uçaksavar topu taşıyan büyük bir araç."
