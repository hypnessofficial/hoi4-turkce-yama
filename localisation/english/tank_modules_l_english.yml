 NOR_rikstanken_turret:0 "Doğaçlama Taret"
 NOR_rikstanken_turret_desc:0 "Topu barındırır ve dönebilir. İstediği zaman."
 NOR_tank_rikstanken_armor:0 "Derme Çatma Zırh"
 NOR_tank_rikstanken_armor_desc:0 "Paradan tasarruf etmek için çelik yerine demir levhalardan yapılmıştır. Hiç zırh olmamasından iyidir... Muhtemelen."
 additional_machine_guns:0 "Ek Makineli Tüfekler"
 additional_machine_guns_desc:0 "Gövde yanı ve özel kule montajlarındaki bir dizi makineli tüfek, araca yakın mesafedeki piyade saldırılarına karşı gelişmiş savunma sağlar."
 advanced_flamethrower:0 "Gelişmiş Alev Makinesi"
 advanced_flamethrower_desc:0 "Tahkim edilmiş mevzileri temizlemek ve yakın mesafe çatışmalarda yıkıcı hasar vermek için ideal olan geliştirilmiş alev makinesi sistemleri."
 advanced_heavy_tank_chassis:0 "Gelişmiş Ağır Tank"
 advanced_heavy_tank_chassis_desc:0 "Zırh ve ateş gücündeki gelişmelerle, modern bir tankın etkili olabilmesi için kalın zırh ve büyük bir top taşıması gerekir. Bu da büyük bir aracı zorunlu kılar."
 advanced_heavy_tank_chassis_short:0 "1943 Ağır"
 advanced_light_tank_chassis:0 "Gelişmiş Hafif Tank"
 advanced_light_tank_chassis_desc:0 "Orta tankların savaşta giderek daha fazla merkez sahneye çıkmasıyla, hafif tanklar büyük ölçüde destekleyici rollere indirgenmiştir. Bu rollerin ihtiyaçlarını dikkate alan yeni bir şasi tasarımı gereklidir."
 advanced_light_tank_chassis_short:0 "1941 Hafif"
 advanced_medium_tank_chassis:0 "Gelişmiş Orta Tank"
 advanced_medium_tank_chassis_desc:0 "Silah sistemlerindeki ve zırh gücündeki hızlı büyüme, daha da büyük bir şasi gerektirerek, önceki ağır tankların boyutunda bir araç yaratıyor."
 advanced_medium_tank_chassis_short:0 "1943 Orta"
 amphibious_drive:0 "Amfibi Sürüş"
 amphibious_drive_desc:0 "Bir dizi yüzdürme cihazı ve küçük bir pervane, bu tankın gemiden kıyıya veya bir nehir boyunca suyu geçmek için hızla donatılmasını sağlar."
 amphibious_tank_chassis:0 " Amfibi Tank"
 amphibious_tank_chassis_1:0 "Amfibi Tank"
 amphibious_tank_chassis_desc:0 "Özellikle yüzmek için tasarlanmış küçük bir tank gövdesi. Bunu başarmak için, aracın taşıdığı silahın boyutuna ve zırhın kalınlığına katı sınırlar konulmalıdır."
 armor_skirts:0 "Zırh Etekleri"
 armor_skirts_desc:0 "Aracın yanına monte edilen bir dizi ince metal plaka, tanksavar tüfeklerine ve şekilli patlayıcılara karşı ek koruma sağlar."
 armor_tech_1:0 "Temel Zırh Koruması"
 armor_tech_1_desc:0 "Büyük Savaş sırasındaki tanklar sadece düşman hafif silahlarıyla başa çıkmak zorundaydı. Bu nedenle, oldukça ince bir zırhla idare ettiler. Yeni nesil tanksavar silahları, savaş alanını bir tank için çok daha tehlikeli bir yer haline getirdi ve çok daha ağır koruma gerekiyor."
 armor_tech_1_tt:0 "5 ve üzeri Zırh Yükseltme değerlerini etkinleştirir."
 armor_tech_2:0 "Geliştirilmiş Zırh Koruması"
 armor_tech_2_desc:0 "Dünya çapında giderek daha ağır tanksavar silahlarının sahaya sürülmesiyle, yeni nesil tanklar daha da iyi korumaya ihtiyaç duyacaktır."
 armor_tech_2_tt:0 "10 ve üzeri Zırh Yükseltme değerlerini etkinleştirir."
 armor_tech_3:0 "Gelişmiş Zırh Koruması"
 armor_tech_3_desc:0 "Konuşlandırılmış tanksavar toplarının sınırına muhtemelen ulaşılmış olsa da, yeni nesil tanklar, mevcut herhangi bir koruma seviyesini uzun menzilden delebilen daha gelişmiş silahlar taşıyacaktır."
 armor_tech_3_tt:0 "15 ve üzeri Zırh Yükseltme değerlerini etkinleştirir."
 armor_tech_4:0 "Modern Zırh Koruması"
 armor_tech_4_desc:0 "Savaş sırasında, tankların karşılaştığı tehditler katlanarak arttı: düşman tankları, tanksavar topları, özel tank avcıları ve hatta ağır zırhı bile delebilen şekilli patlayıcılar ateşleyen modern piyade silahları. Kendi tanklarımızı bu tehditler karşısında hayatta tutmak için yeni koruma yöntemleri geliştirmeliyiz."
 armor_tech_4_tt:0 "18 ve üzeri Zırh Yükseltme değerlerini etkinleştirir."
 auto_loader:0 "Otomatik Yükleyici"
 auto_loader_desc:0 "Mermileri yükleyen ve tankın uzun bir süre boyunca yüksek atış hızını korumasını sağlayan otomatik bir mekanizma."
 basic_heavy_tank_chassis:0 "Temel Ağır Tank"
 basic_heavy_tank_chassis_desc:0 "Büyük Savaş'ın kapsamlı bir analizi, düşman siper hattını kırmak ve daha hafif kuvvetlerin yarığı sömürmesi için yol açmak üzere ağır bir araca ihtiyaç olduğunu göstermiştir. Böyle bir araç ağır silahlı ve iyi zırhlı olmalı, ancak çok hızlı olmak zorunda değildir."
 basic_heavy_tank_chassis_short:0 "1934 Ağır"
 basic_light_tank_chassis:0 "Temel Hafif Tank"
 basic_light_tank_chassis_desc:0 "Teknolojik gelişmeler, savaş sonrası dönemin tasarımlarını etkili bir şekilde geçersiz kılmıştır. Modern savaş alanı, metalurji ve iç düzendeki gelişmeleri içeren yeni, temiz bir tasarım gerektirir."
 basic_light_tank_chassis_short:0 "1934 Hafif"
 basic_medium_tank_chassis:0 "Temel Orta Tank"
 basic_medium_tank_chassis_desc:0 "Hafif tanklar geçmiş yıllarda mekanize oluşumların bel kemiğini oluşturmuş olsa da, büyüme potansiyellerinin neredeyse tükendiği açıkça görülmektedir. Gelecekte, yüksek hareket kabiliyetini koruyan daha büyük bir araca ihtiyacımız olacak."
 basic_medium_tank_chassis_short:0 "1938 Orta"
 dozer_blade:0 "Dozer Bıçağı"
 dozer_blade_desc:0 "Bir dozer bıçağı, aracın mühendis desteği olmadan sahada hızla bir muharebe mevzii inşa etmesini sağlar."
 easy_maintenance:0 "Kolay Bakım"
 easy_maintenance_desc:0 "Aracın etrafındaki kapaklar, aracın birçok farklı bileşenine erişim sağlar ve mürettebatın karmaşık bakımları bile oldukça kolay bir şekilde yapmasına olanak tanır."
 engine_tech_1:0 "Temel Motor"
 engine_tech_1_desc:0 "Büyük Savaş'ın tankları yavaş, hantal canavarlar iken, modern tank zafer elde etmek için büyük ölçüde hıza ve hareket kabiliyetine dayanır."
 engine_tech_1_tt:0 "5 ve üzeri Motor Yükseltme değerlerini etkinleştirir."
 engine_tech_2:0 "Geliştirilmiş Motor"
 engine_tech_2_desc:0 "Daha büyük toplar ve daha ağır zırhlarla, yeni nesil tankların hareketli kalabilmek için daha güçlü bir motora ihtiyacı var."
 engine_tech_2_tt:0 "10 ve üzeri Motor Yükseltme değerlerini etkinleştirir."
 engine_tech_3:0 "Gelişmiş Motor"
 engine_tech_3_desc:0 "Mekanize savaş, hızlı karar verme ve birliklerin ve malzemelerin hızlı hareketini gerektiren bir savaş şeklidir. Tanklarımızın modern silahları ve savaş alanında hayatta kalmak için yeterli zırhı taşıması gerekiyorsa, motorlu piyadeye ayak uydurmak için güçlü motorlara ihtiyaçları vardır."
 engine_tech_3_tt:0 "15 ve üzeri Motor Yükseltme değerlerini etkinleştirir."
 engine_tech_4:0 "Modern Motor"
 engine_tech_4_desc:0 "Modern savaşın gerektirdiği çok sayıda yeni eklenti, aracın ağırlığını önemli ölçüde artırdı. Tüm bu kütleyi hareket ettirmek için, arkasında çok fazla güç olan motorlara ihtiyacımız var."
 engine_tech_4_tt:0 "18 ve üzeri Motor Yükseltme değerlerini etkinleştirir."
 expanded_fuel_tank:0 "Yakıt Varili"
 expanded_fuel_tank_desc:0 "Zırhlı bir aracın operasyonel menzilini uzatmak için tasarlanmış harici olarak monte edilmiş bir yakıt varili."
 extra_ammo_storage:0 "Ek Mühimmat Deposu"
 extra_ammo_storage_desc:0 "Ek hazır mühimmat rafları, tankın ikmal yapmadan çok daha uzun süre savaşta kalmasını sağlar. Ancak, zırh delinirse sonuçlar muhtemelen felaket olacaktır. Bu özellikle saldırı sırasında sorunludur."
 flamethrower:0 "Alev Makinesi"
 flamethrower_desc:0 "Yanan bir sıvı akışı püskürten bir cihaz. Şehir çatışmalarında ve tahkimatlara karşı çok faydalı olsa da, zırh karşıtı bir yeteneği yoktur ve etkili olabilmesi için özel eğitimli bir mürettebat tarafından ayrı bir birimde kullanılması gerekir."
 gwtank_chassis:0 "Savaş Arası Tank Geliştirme"
 gwtank_chassis_desc:0 "Tank, Büyük Savaş'ta kendini güçlü bir silah olarak kanıtlamıştır. Aradan geçen yıllarda gelişim yavaşlamış olsa da, şüphesiz gelecek savaşlarda önemli bir rol oynayacaktır."
 heavy_flame_tank:0 "Ağır Alev Tankı Bölüğü"
 heavy_flame_tank_desc:0 "Şehirlere ve tahkimatlara saldırırken destek sağlamak için ağır, alev makinesi donanımlı araçlardan oluşan bir bölük."
 heavy_tank_aa_chassis:0 " Ağır KM Uçaksavar"
