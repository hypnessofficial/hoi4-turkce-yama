 modern_tank_aa_chassis_desc:0 "Düşman hava saldırısına karşı hareketli ve iyi korunan bir savunma sağlamak üzere tasarlanmış modern bir araç."
 modern_tank_artillery_chassis:0 " Modern KM Topçu"
 modern_tank_artillery_chassis_1:0 "Modern KM Topçu"
 modern_tank_artillery_chassis_desc:0 "Modern tanklara ayak uydurabilen ve savaş alanında bulunan herhangi bir tehdide karşı korunabilen, tamamen işlevsel bir topçu parçası olarak tasarlanmış modern bir araç."
 modern_tank_chassis:0 " Modern Tank"
 modern_tank_chassis_1:0 "Modern Tank"
 modern_tank_chassis_desc:0 "Önceki orta tanklardan büyük ölçüde ödünç alan, ancak hız ve manevra kabiliyetine çok daha büyük bir vurgu yapan modernize edilmiş bir şasi. Aynı zamanda genellikle orta tanklarda taşınandan daha fazla zırh ve daha büyük toplara izin verir. Sonuç, çok çeşitli rolleri doldurabilen bir araçtır."
 modern_tank_destroyer_chassis:0 " Modern Tank Avcısı"
 modern_tank_destroyer_chassis_1:0 "Modern Tank Avcısı"
 modern_tank_destroyer_chassis_desc:0 "Düşman tank saldırılarına hızlı bir yanıt sağlamak üzere tasarlanmış, karşılaştırılabilir koruma seviyelerine sahip modern bir araç."
 secondary_turret_close_support_gun:0 "Yakın Destek Topu"
 secondary_turret_close_support_gun_desc:0 "İkincil bir tarette yakın destek topu. Taretin yerleşimi ateş yayını sınırlar, bu da topun genel etkinliğini düşürür, ancak tankın daha fazla hedefe saldırmasına olanak tanır. Bu özellikle saldırıdayken kullanışlıdır."
 secondary_turret_hmg:0 "Ağır Makineli Tüfek"
 secondary_turret_hmg_desc:0 "İkincil bir tarette ağır makineli tüfek. Taretin yerleşimi ateş yayını sınırlar, bu da topun genel etkinliğini düşürür, ancak tankın daha fazla hedefe saldırmasına olanak tanır. Bu özellikle saldırıdayken kullanışlıdır."
 secondary_turret_small_cannon:0 "Küçük Top"
 secondary_turret_small_cannon_desc:0 "İkincil bir tarette küçük bir top. Taretin yerleşimi ateş yayını sınırlar, bu da topun genel etkinliğini düşürür, ancak tankın daha fazla hedefe saldırmasına olanak tanır. Bu özellikle saldırıdayken kullanışlıdır."
 sloped_armor:0 "Eğimli Zırh"
 sloped_armor_desc:0 "Gelen bir mermiye açılı olarak yerleştirilen zırh, dikey olarak yerleştirilen aynı miktardaki zırhtan çok daha fazla etkili kalınlığa sahiptir. Ayrıca merminin zararsızca sekme şansını da artırır. Ancak, tüm tankın etrafında tasarlanmasını gerektirir, bu da aracın montajını daha zor hale getirir."
 smoke_launchers:0 "Sis Havanları"
 smoke_launchers_desc:0 "Tankı gizlemek için kalın bir duman bulutu oluşturmak üzere tankın içinden tetiklenebilen bir dizi piroteknik cihaz. Savunmadayken veya bir pusuya düştükten sonra çok kullanışlıdır."
 squeezebore_adaptor:0 "Sıkma Namlu Adaptörü"
 squeezebore_adaptor_desc:0 "Topun ucundaki özel bir adaptör, namlunun çapını düşürür ve bir mermiyi daha küçük bir kalibreye sıkıştırır. Bu, namlu çıkış hızını ve dolayısıyla topun delme gücünü önemli ölçüde artırır. Ancak nadir malzemelerden yapılmış özel mühimmat gerektirir."
 stabilizer:0 "Stabilizatör"
 stabilizer_desc:0 "Tank hareket halindeyken topu aynı yönde tutan mekanik bir cihaz. Hareket halindeyken isabetli ateş etmeye yetecek kadar gelişmiş olmasa da, nişancının hedefi yeniden bulmak zorunda kalmadan kısa bir duraklama sırasında isabetli ateş etmesine olanak tanır."
