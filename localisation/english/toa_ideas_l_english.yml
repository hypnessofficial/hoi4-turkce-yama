 idea_CHL_near_anarchic_society:0 "Anarşiye Yakın Toplum"
 idea_CHL_near_anarchic_society_desc:0 "Ulusumuz şu anda sık sık darbe girişimleri ve isyanların yanı sıra günlük sıradan protestolardan muzdariptir. Ayrıca politikacılar, ordu ve hükümet kurumları arasındaki büyük düşmanlıktan kaynaklanan hiçbir şey yeterince etkili çalışmıyor. Ülkeyi kesin olarak istikrara kavuşturmak istiyorsak bu sorunları onarmalıyız."
 idea_CHL_repubican_guard:0 "Cumhuriyet Muhafızları"
 idea_CHL_repubican_guard_desc:0 "Mevcut durumda, cumhuriyet büyük bir tehlike altında ve çöküşün eşiğinde. Ancak, başkan Arturo Alessandri 1925'ten bu yana durumun çoğunu istikrara kavuşturdu ve şimdi bu gizli milise olan bağımlılık, orduya gitmesi gereken fonları yönlendirerek düzenli kuvvetlerin genişlemesini engelliyor."
 idea_CHL_the_Hacienda_inquilinaje_system:0 "Hacienda - Inquilinaje Sistemi"
 idea_CHL_the_Hacienda_inquilinaje_system_desc:0 "Toprak sahipleri ve kiracılardan oluşan Hacienda - Inquilinaje Sistemi, eski Roma ve İmparatorluk İspanyol yönetim tarzlarından kaynaklanmaktadır ve beklenebileceği gibi son derece modası geçmiş ve baskıcıdır. Mevcut Şili haciendaları, işçilerin kötü koşulları ve bugüne kadar pratik olarak serfliği kullanmaları nedeniyle ekonominin geri kalmış bir parçası olmasıyla öne çıkıyor. Bu sorundan düzgün bir şekilde kurtulmanın tek yolu, ekonomimizi restore etmek istiyorsak ana öncelik olması gereken §YToprak Reformu§!'dur."
