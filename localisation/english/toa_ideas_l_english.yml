 BRA_growing_state_dynamic_modifier:0 "Gelişen Eyalet"
 BRA_growing_state_dynamic_modifier_desc:0 "Merkezi hükümet tarafından yapılan yoğun yatırım ve kalkınma sayesinde, bu eyalet şimdi önümüzdeki yıllarda tam sanayileşme yolunda olan büyüyen bir ekonomiye sahiptir."
