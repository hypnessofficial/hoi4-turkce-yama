l_english:
 ARG_FJC_empowered_idea:0 "FJC Güçlendirildi"
 ARG_FJC_empowered_idea_desc:0 "Federación Juvenil Comunista de la Argentina, ülke tarihindeki en etkili gençlik siyasi örgütlerinden biridir. PCA ile aynı çizgideki gençlik örgütüdür ve partinin politikalarını Arjantin gençliği arasında teşvik etmek için 1921'de kurulmuştur. PCA şimdi hükümetin tam komutasında olduğuna göre, FJC Arjantin gençliğini tam teşekküllü devrimciler haline getirmeye ve geliştirmeye devam edebilir!"
 ARG_agrarian_reforms_idea:0 "Tarımsal Reformlar"
 ARG_agrarian_reforms_idea_desc:0 "$ARG_support_the_farmers_decisions_desc$"
 ARG_airforce_modifier:0 "$SMB_air_force_ARG$"
 ARG_american_allyship_idea:0 "Washington ile Yakın Bağlar"
 ARG_american_allyship_idea_desc:0 "Amerikan İşbirliği ruhuyla, [USA.GetNameDef] ile daha yakın siyasi bağlar kurduk. Monroe Doktrini'nin anlamlı sözleri altında birlikte dururken, Avrupa'daki güçlerden hiçbir şey birleşik cephemizin arasına giremez."
 ARG_anti_american_idea:0 "Anti-Amerikan Duyguları"
 ARG_anti_american_idea_desc:0 "$ARG_red_scare_idea_desc$"
 ARG_anti_american_propaganda_idea:0 "Anti-Amerikan Propagandası"
 ARG_anti_american_propaganda_idea_desc:0 "[USA.GetNameDefCap], rejimimize yönelik kayda değer bir tehdittir. Uyuyan dev olarak bilinmelerine rağmen, ne zaman uyanıp dikkatlerini bize çevireceklerini asla bilemeyiz. Birliklerimiz, propaganda departmanımız sayesinde, kuzeydeki [USA.GetAdjective] tehlikesine karşı koymaya hazırdır."
 ARG_anti_british_sentiment_idea:0 "Anti-İngiliz Duygusu"
 ARG_anti_british_sentiment_idea_desc:0 "[ENG.GetNameDef] ile bağlarımızı kopardığımızdan beri, hükümetimize bir Anti-İngiliz duygu dalgası girdi. Artık onların antlaşmaları ve ticaret anlaşmalarıyla bağlı değiliz! Şimdi daha önemli olana odaklanabiliriz: savaş."
 ARG_anti_corruption_modifier:0 "Yolsuzlukla Mücadele Politikası"
 ARG_anti_corruption_modifier_desc:0 "Ulusumuzun hükümetini rahatsız eden yolsuzluk kesinlikle kabul edilemezdi. Marcelo T. de Alvear'in politikaları sayesinde nihayet politikacılarımızın katıldığı bariz hileli faaliyetlere son vermeye başlayabildik."
 ARG_anti_soviet_idea:0 "Anti-Sovyet Duyguları"
 ARG_anti_soviet_idea_desc:0 "Komünizm tehdidi ve ulusumuza oluşturduğu tehlike görmezden gelinemeyecek kadar önemlidir. [SOV.GetNameDefCap], bildiğimiz yaşam tarzımızı yok etme yeteneğine sahip bir güç olduğunu kanıtlamaya devam ediyor. İnsanlar kızıl tehditten korkuyor ve korkmalılar da!"
 ARG_argentina_first_idea:0 "$ARG_argentina_first$"
 ARG_argentina_first_idea_desc:0 "Tek başına gitmek asla kolay değil, özellikle de Güney Amerika kıtasında bu kadar yüce fetih hedeflerimiz varken. Ancak, Avrupa'daki faşist hareketlerle kendimizi bağlarsak, gerçek hedefimizin ne olduğunu gözden kaçırabiliriz: birleşik bir Güney Amerika."
 ARG_argentina_for_all_idea:0 "Herkes için Arjantin"
 ARG_argentina_for_all_idea_desc:0 "Büyük ulusumuzun sınırları içinde yaşayan çok çeşitli insanları var ve uzun bir süredir nüfusumuzu tek bir bayrak altında birleştirmek neredeyse imkansızdı. Yaklaşımımızı değiştirme zamanı geldi. [ARG.GetNameDef], onu evi olarak gören herkes için erişilebilir ve kabul edici bir ülke olmalı."
 ARG_argentine_beef_idea:0 "Arjantin Sığır Eti"
 ARG_argentine_beef_idea_desc:0 "Sığırlar 1536'da İspanyol Fatihler tarafından [ARG.GetNameDef]'e ilk getirildiğinden beri, sığır eti geleneksel Arjantin mutfağında temel bir besin olmuştur. Bu nedenle, sığır etimiz dünya çapında tanınır hale geldi ve bu nedenle ihracatına büyük bir talep var."
 ARG_argentine_beef_trade_idea:0 "Arjantin Sığır Eti Ticareti"
 ARG_argentine_metropole_idea:0 "Arjantin Metropolü"
 ARG_argentine_metropole_idea_desc:0 "Yakın zamana kadar, ülkemiz kırsal tarım ve madencilik topluluklarının omurgası üzerinde gelişti. Ancak, 20. yüzyıl boyunca gelişmeye devam ettikçe, zaman değişti ve ideal bir [ARG.GetAdjective] yaşamının ne olduğu fikri de gelişti. Birçoğu şimdi genişlemiş ve gelişen şehirlerimize kök salma ve metropol bir yaşam tarzına uyum sağlama umuduyla akın ediyor."
 ARG_argentine_nationalism_idea:0 "Arjantin Milliyetçiliği"
 ARG_argentine_nationalism_idea_desc:0 "[ARG.GetAdjective]ler olarak gurur duyacağımız çok şeyimiz var ve bu nedenle sınırlarımız içindekileri ulusumuzun çıkarlarını tanımlamaya ve desteklemeye teşvik etmeye devam ediyoruz. Bize sert düzenlemeler uygulamak veya savaşla tehdit etmek isteyenlerin yardımına ihtiyacımız yok. [ARG.GetNameDefCap], kendi ayakları üzerinde duran egemen bir ülkedir."
 ARG_army_modifier:0 "$SMB_army_ARG$"
 ARG_arsenales_de_marina_manufacturer:0 "$ARG_arsenales_de_marina_organization$"
 ARG_astarsa_manufacturer:0 "$ARG_astarsa_organization$"
 ARG_british_argentine_agreement:0 "[ENG.GetAdjective]-[ARG.GetAdjective] Anlaşması"
 ARG_british_argentine_agreement_desc:0 "Biz ve [ENG.GetAdjective] arasında daha iyi ticaret koşulları için bir anlaşmaya varıldı. Bundan sonra [ENG.GetAdjective] ile ticaretimizde hafif bir indirimden yararlanıyoruz."
 ARG_british_cooperation_idea:0 "$ARG_british_cooperation$"
 ARG_british_cooperation_idea_desc:0 "[ENG.GetNameDefCap] en uzun süreli ticaret ortaklarımızdan biri olmuştur. Birçok antlaşma ve anlaşmamızı sürdürmeye devam ederken, ideolojimizin onlarınkiyle eşleşecek şekilde değiştiğini görebiliriz."
 ARG_buying_the_islands_idea:0 "Güney Atlantik Adaları Satın Alındı"
 ARG_buying_the_islands_idea_desc:0 "Anlaşılan o ki, iki koca adayı satın almak oldukça pahalı. Bu borcu bir süre daha ödeyeceğiz."
 ARG_chade_cade:0 "CHADE-CADE"
 ARG_civilian_economy_boost_idea:0 "Gelişmiş Sivil Ekonomi"
 ARG_civilian_economy_boost_idea_desc:0 "Dikkatli planlama ve iyi yerleştirilmiş bağışlarla, sivil ekonomimizi tamamen geliştirmeyi başardık. Vatandaşlarımıza sunulan artan olanaklar, ulusal mutluluk endeksinin zamanla yavaş yavaş artacağı anlamına geliyor."
 ARG_committee_of_state_security_idea_lar:0 "Devlet Güvenlik Komitesi"
 ARG_committee_of_state_security_idea_lar_desc:0 "Rus İstihbarat teşkilatlarından modellenen Arjantin Devlet Güvenlik Komitesi, dış istihbarat, karşı istihbarat ve gizli polis işlevlerini yerine getirmek üzere kurulmuştur."
 ARG_committee_of_state_security_idea_no_lar:0 "$ARG_committee_of_state_security_idea_lar$"
 ARG_committee_of_state_security_idea_no_lar_desc:0 "$ARG_committee_of_state_security_idea_lar_desc$"
 ARG_construction_guilds_idea:0 "Arjantin İnşaat Loncaları"
 ARG_corruption_crackdown_modifier:0 "$ARG_crack_down_on_corruption$"
 ARG_corruption_crackdown_modifier_desc:0 "Ulusumuzun hükümetini rahatsız eden yolsuzluk kesinlikle kabul edilemezdi. Roberto María Ortiz'in politikaları sayesinde nihayet politikacılarımızın katıldığı bariz hileli faaliyetlere son vermeye başlayabildik."
 ARG_counter_interlligence_program_idea:0 "Arjantin Karşı İstihbarat Programı"
 ARG_counter_interlligence_program_idea_desc:0 "Casusluk, bu küresel çatışmada yüzleşmek zorunda olduğumuz birçok cepheden biridir ve bu nedenle kendi karşı istihbarat programımızı verimli bir şekilde yürütebilmek bu savaştan sağ çıkmak için çok önemlidir. Saldırgan gizli taktikler yerine savunma politikalarına odaklanma konusunda bir tavır aldık."
 ARG_cut_ties_with_britain_idea:0 "Britanya ile Bağları Kopar"
 ARG_cut_ties_with_britain_idea_desc:0 "[ARG.GetNameDefCap] bizimle bağlarını kopardı."
 ARG_disrupt_bolivar_lar:0 "Bolívar Operasyonuna Karşı Çalışma"
 ARG_disrupt_bolivar_lar_desc:0 "Bolívar Operasyonu uzun yıllardır başımıza bela olmuştur ve bu iğrenç düşmanca casusluk eylemine karşı bir duruş sergilemek bize düşüyor."
 ARG_disrupt_bolivar_no_lar:0 "Bolívar Operasyonu Bozuldu"
 ARG_disrupt_bolivar_no_lar_desc:0 "$ARG_disrupt_bolivar_lar_desc$"
 ARG_economic_reactivation_idea:0 "Ekonomik Canlandırma"
 ARG_economic_reactivation_idea_desc:0 "Ekonomik Canlandırma yasası, daha fazla hükümet parasının ekonomik ve endüstriyel sektörlerin geliştirilmesini finanse etmeye yönlendirilmesini sağlamak için yürürlüğe konulan bir yasadır."
 ARG_eden_malbran_treaty_idea:0 "Eden-Malbrán Antlaşması"
 ARG_eden_malbran_treaty_idea_desc:0 "Roca-Runciman Anlaşması'nda dayatılan sert kısıtlamalara bir yanıt olarak, Eden-Malbrán antlaşması adı altında yeni bir anlaşma müzakere edildi. Bu, [ENG.GetNameDef]'in buğday üzerindeki navlun oranlarını düşürürken ek tavizler almasını sağladı."
 ARG_eliminate_american_imperialism_idea:0 "Operación Ocaso Escarlata"
 ARG_eliminate_american_imperialism_idea_desc:0 "Kuzeydeki dev, uzun zamandır Kapitalizmin bir kalesi olarak duruyor. Amerikan Emperyalizmine son verme ve Kızıl Günbatımı'nı getirme zamanı geldi."
 ARG_envoy_to_london_idea:0 "Londra ile Yakın Bağlar"
 ARG_envoy_to_london_idea_desc:0 "Birbirimizi desteklemeye devam ettiğimiz sürece, [ENG.GetNameDev] [ARG.GetNameDef]'de bir dosta sahip olacaktır. İki ulusumuzun siyasi olarak bağlantılı kalması ve hedeflerimizin aynı hizada kalmasını sağlamak önemlidir."
 ARG_fabricaciones_militares:0 "$ARG_fabricaciones_militares_organization$"
 ARG_fabricaciones_militares_art_manufacturer:0 "$ARG_fabricaciones_militares_art_organization$"
 ARG_fabricaciones_militares_epartamento_de_tanques_del_ejercito_manufacturer:0 "$ARG_fabricaciones_militares_epartamento_de_tanques_del_ejercito_organization$"
 ARG_ferrocarriles_argentinos:0 "Ferrocarriles Argentinos"
 ARG_fma_manufacturer:0 "$ARG_fma_organization$"
 ARG_free_association_idea:0 "Üreticilerin Serbest Birliği"
 ARG_free_association_idea_desc:0 "Serbest Birlik, bireyler arasında devlet, sosyal sınıf, hiyerarşi veya üretim araçlarının özel mülkiyetinin olmadığı bir ilişkidir. İktidardaki Anarko-Sendikalistlere göre, bu bireylerin kendi varoluş koşullarını üretmek ve yeniden üretmek için sosyal kısıtlama olmaksızın serbestçe bir araya gelmelerini sağlayacaktır."
 ARG_growing_nationalism_modifier:0 "Büyüyen Milliyetçi Hareket"
 ARG_growing_nationalism_modifier_desc:0 "Arjantin Milliyetçi partisi ülke genelinde dalgalar yarattı ve bu nedenle, giderek daha fazla insan büyüyen ideolojilerini desteklemek için saflarına akın ediyor. Arjantin milliyetçiliği, [ARG.GetAdjective] kimliğini restore etme ve kendimizi Güney Amerika'da baskın bir güç olarak pekiştirme fikrini takip ediyor."
 ARG_hispano_argentina_manufacturer:0 "$ARG_hispano_argentina_organization$"
 ARG_improved_cooperation_idea:0 "Geliştirilmiş İşbirliği"
 ARG_improved_cooperation_idea_desc:0 "[ARG.GetNameDefCap] ve [ENG.GetNameDef] çıkarları doğrultusunda aynı hizaya geliyor."
 ARG_infamous_decade_2_idea:0 "$ARG_infamous_decade_idea$"
 ARG_infamous_decade_2_idea_desc:0 "$ARG_infamous_decade_idea_desc$"
 ARG_infamous_decade_3_idea:0 "$ARG_infamous_decade_idea$"
 ARG_infamous_decade_3_idea_desc:0 "$ARG_infamous_decade_idea_desc$"
 ARG_infamous_decade_4_idea:0 "$ARG_infamous_decade_idea$"
 ARG_infamous_decade_4_idea_desc:0 "$ARG_infamous_decade_idea_desc$"
 ARG_infamous_decade_idea:0 "Rezalet On Yılı"
 ARG_infamous_decade_idea_desc:0 "Rezalet On Yılı, Arjantin tarihinde Başkan Hipólito Yrigoyen'e karşı 1930 darbesiyle başlayan bir dönemdi. İki şeyle damgasını vurdu. Bir yandan, Büyük Buhran'ı takiben önemli kırsal göç ve diğer yandan, muhafazakar hükümetleri iktidarda tutmak için bariz seçim hileleri."
 ARG_integrate_operation_bolivar_idea_lar:0 "Bolívar Operasyonunu Entegre Etme"
 ARG_integrate_operation_bolivar_idea_lar_desc:0 "Mihver güçleriyle daha yakın bağlantımız sayesinde, Bolívar Operasyonunu başarıyla entegre etmeye başladık ve kendi casusluk programımızla Güney Amerika sahnesine yardım etmeye çalışıyoruz"
 ARG_integrate_operation_bolivar_idea_no_lar:0 "Bolívar Operasyonunu Entegre Etme"
 ARG_integrate_operation_bolivar_idea_no_lar_desc:0 "$ARG_integrate_operation_bolivar_idea_lar_desc$"
 ARG_international_loan_modifier:0 "Uluslararası Kredi"
 ARG_international_loan_modifier_desc:0 "Kriz zamanlarında ülkelerin dünyanın dört bir yanındaki diğer uluslardan mali yardım istemesi alışılmadık bir durum değildir. [ROOT.GetNameDef]'in ekonomisinin mevcut durumu göz önüne alındığında, bu çatışma sırasında oyunda olan büyük güçlerden yardım kabul etmek son derece mantıklıdır."
 ARG_invest_in_railways_idea:0 "Demiryollarına Yatırım Yapıldı"
 ARG_invest_in_railways_idea_desc:0 "Modern çağda, her sanayi ulusal bir demiryolu hizmetinin her zaman destekleyici omurgasına güvenir. Ülke genelinde demiryolu hatlarımızı genişlettikçe, kırsal topluluklarımızdan şehirlere doğru sağlam bir mal transferinin temellerini attık."
 ARG_invest_in_roads_idea:0 "Yollara Yatırım Yapıldı"
 ARG_invest_in_roads_idea_desc:0 "Ulusun otoyolları, [ARG.GetNameDef]'in ekonomik, endüstriyel ve askeri yetenekleri için çok önemlidir. İnşaatlarına ve bakımlarına yaptığımız yatırım, önümüzdeki yıllarda bize iyi hizmet edecektir."
 ARG_liberation_theology_idea:0 "Kurtuluş Teolojisi"
 ARG_liberation_theology_idea_desc:0 "Kurtuluş teolojisi, ezilenlerin kurtuluşunu vurgulayan bir Hristiyanlık markasıdır. Bir din olarak, yoksullar için sosyal endişe ve ezilen halklar için siyasi kurtuluş ile sosyo-ekonomik analizlere girişir. Kurtuluş Teolojisi, halkımızın dini özgürlük arzusu ve devrimci hedeflerimize destekleriyle oluşmuştur."
 ARG_maintain_neutrality_idea:0 "Kendimize Adanmış"
 ARG_maintain_neutrality_idea_desc:0 "Dünya genelinde devam eden daha büyük çatışmalara ilgi duymadığımızı gösterdik. Öncelikle kendi endişelerimizi düşünmeliyiz. Bu, [ARG.GetNameDef]'in kendi hedeflerine odaklanacağına dair herkese bir beyan olsun."
 ARG_military_government_idea:0 "Askeri Hükümet"
 ARG_military_government_idea_desc:0 "Pedro Pablo Ramírez hükümeti devraldı ve yerine askeri yönetimli bir devlet kurdu. Bu rejim değişikliği, daha önce yozlaşmış ve hileli olan Concordancia'dan gelen birçok değişim çığlığıyla tetiklendi. [ARG.GeAdjective] yayılmacılığına odaklanan bir manifestoyla, ülkemizin gelecekte birçok çatışmayla yüzleşeceği kesindir."
 ARG_modify_argentine_airforce_ns_intro:0 "§Y$ARG_airforce_modifier$§!'yi şununla değiştir"
 ARG_modify_argentine_army_ns_intro:0 "§Y$ARG_army_modifier$§!'yi şununla değiştir"
 ARG_modify_argentine_navy_ns_intro:0 "§Y$ARG_navy_modifier$§!'yi şununla değiştir"
 ARG_modify_corruption_ns_intro:0 "§Y$ARG_political_corruption_modifier$§!'yi şununla değiştir"
 ARG_modify_growing_nationalism_ns_intro:0 "§Y$ARG_growing_nationalism_modifier$§!'yi şununla değiştir"
 ARG_modify_international_loan_intro:0 "§Y$ARG_international_loan_modifier$§!'yi şununla değiştir"
 ARG_monroe_doctrine_idea:0 "Monroe Doktrini ile Aynı Hizada"
 ARG_monroe_doctrine_idea_desc:0 "Monroe Doktrini uzun zamandır batı yarımküresini sömürgeci güçlerin dış müdahalesinden korumanın bir yolu olarak duruyor. Savaşın saldırısından sağ çıkmak istiyorsak bunu sürdürmemiz çok önemli."
 ARG_navy_modifier:0 "$SMB_navy_ARG$"
 ARG_no_gods_no_masters_idea:0 "¡Liberación!"
 ARG_no_gods_no_masters_idea_desc:0 "Kıtadaki diğer ülkeler hükümetimizle aynı fikirde olmasa da, oturup öfkeli, kavgacı saldırganlar tarafından fethedilmelerine izin vermek ideolojimize aykırı olur. Komşularımızdan herhangi biri bir işgalciye düşerse, onları kurtarmak için silahlanmalıyız."
 ARG_our_own_path_idea:0 "$ARG_our_own_path$"
 ARG_our_own_path_idea_desc:0 "Buraya gelmek için katlandığımız tüm zorluklara rağmen, [ARG.GetNameDef] diğer uluslara, ittifaklara ve holdinglere diz çökmeden kendi ayakları üzerinde durabiliyor. Bu çalkantılı zamanlarda kendi yolumuzu seçiyoruz."
 ARG_political_corruption_modifier:0 "Siyasi Yolsuzluk"
 ARG_political_corruption_modifier_desc:0 "[ARG.GetNameDef] uzun yıllardır hükümetindeki ateşli yolsuzlukla boğuşuyor. Concordancia'nın kurulmasına izin verilerek bunun azalabileceği düşünülse de, hileli oylar ve seçmen gözdağı devam etti."
 ARG_preparing_for_war_idea:0 "Savaşa Hazırlanma"
 ARG_preparing_for_war_idea_desc:0 "Güney Amerika kıtası üzerimizde, alınmaya hazır bir şekilde duruyor. Ordularımız savaşa hazırlanırken, politikacılarımız ve diplomatlarımız fethimize hazırlık olarak belgeler ve ültimatomlar hazırlıyor. Engerek yılanı saldırmak için hazır bekliyor."
 ARG_public_works_investment_idea:0 "Kamu İşleri Yatırımı"
 ARG_public_works_investment_idea_desc:0 "[ARG.GetAdjective] hükümetinin rekreasyon, istihdam, sağlık ve güvenlik kullanımları için kamu işleri projelerini finanse etmesi ve tedarik etmesi önemlidir. Bu, daha büyük [ARG.GetAdjective] topluluğunda yaşam kalitesini artırmaya hizmet edecektir."
 ARG_raf_cooperation_idea:0 "RAF İşbirliği"
 ARG_raf_cooperation_idea_desc:0 "Dünya genelindeki çatışmalar devam ederken, müttefiklerimizi elimizden gelen her şeyle desteklemek için elimizden gelenin en iyisini yapmalıyız. [ENG.GetNameDef]'in Kraliyet Hava Kuvvetleri ile daha yakın işbirliği, şüphesiz kendi pilotlarımızı daha modern bir standarda getirecektir."
 ARG_rapid_militarization_idea:0 "Hızlı Militarizasyon"
 ARG_rapid_militarization_idea_desc:0 "Hızlı Militarizasyon, bir toplumun askeri çatışma ve şiddet için kendini örgütlediği süreçtir. Askeri Sanayi Kompleksimizi tamamen geliştirmeyi ve gelecek kavgalara hazırlanmayı üstlendik."
 ARG_red_scare_idea:0 "Kızıl Korku'nun Etkileri"
 ARG_red_scare_idea_desc:0 "İdeoloji ile ilgili gerilimler bu iki ulus arasında iyice arttı."
 ARG_refused_embargo_idea:0 "Ambargo Talebi Reddedildi"
 ARG_refused_embargo_idea_desc:0 "[ARG.GetNameDefCap], Mihver'e ambargo uygulama talebimizi reddetti."
 ARG_regulated_salaries:0 "Düzenlenmiş Maaşlar"
 ARG_regulated_salaries_desc:0 "Çalışan vatandaşlarımızın yerli sanayimiz tarafından düşük ücret almasını önlemek için önlemler aldık. Hem sanayi hem de işçilerle varılan anlaşma, ülke olarak bizim için en faydalı olduğunu kanıtladı."
 ARG_resource_extration_focus:0 "Kaynak Çıkarımına Odaklan"
 ARG_roca_runciman_new_partner_idea:0 "La Plata Antlaşması"
 ARG_roca_runciman_treaty_idea:0 "Roca-Runciman Antlaşması"
 ARG_roca_runciman_treaty_idea_desc:0 "Roca-Runciman Anlaşması, Mayıs 1933'te imzalanan [ARG.GetNameDef] ve [ENG.GetNameDef] arasında önemli bir ticaret paktıdır ve [ARG.GetNameDef]'e [ENG.GetAdjective] et pazarında sabit bir pay garanti etmiştir. Karşılığında, [ARG.GetNameDef] ticaret ve döviz kuru ile ilgili kısıtlamaları kabul ederek [ENG.GetNameDef]'in ülkedeki ticari çıkarlarını korumuştur."
 ARG_siam_di_tella:0 "SIAM Di Tella"
 ARG_social_welfare_fund_ns:0 "[ARG.GetAdjective] Sosyal Refah Fonu"
 ARG_social_welfare_fund_ns_desc:0 "[ARG.GetNameDef]'de sosyal refah önlemlerine yönelik harcamalar artırıldı. Şu anda bu artan bütçeden, daha memnun bir nüfus ve hükümete karşı giderek daha olumlu bir tutum şeklinde olumlu etkiler görüyoruz."
 ARG_socialist_unification_idea:0 "Sosyalist Birleşme"
 ARG_socialist_unification_idea_desc:0 "Şanlı devrimimizin gücüyle, nihayet kendimizi Güney Amerika Kıtası'nda baskın ideoloji olarak kurmayı başardık. Kan ve yiğitlikle kazanılan bu savaş, halkımızı Güney Amerika Sosyalist Cumhuriyetleri için daha büyük bir anavatan arzusuyla doldurdu."
 ARG_socialist_volunteers_idea:0 "$ARG_socialist_volunteers$"
 ARG_socialist_volunteers_idea_desc:0 "Uluslararası devrimi güvence altına almak için, ihtiyaç duyulduğunda yoldaş sosyalist devletlerimize yardım teklif etmeliyiz. Eğer insan gücümüzü ayırabilirsek, dünya genelindeki burjuvaziyle savaşmak için gönüllüler göndermeliyiz!"
 ARG_spirit_of_the_cisplatine_war_idea:0 "Cisplatine Savaşı'nın Ruhu"
 ARG_spirit_of_the_cisplatine_war_idea_desc:0 "Cisplatine Savaşı, yaygın olarak Arjantin-Brezilya Savaşı olarak da bilinirdi. 1820'lerde gerçekleşen silahlı bir çatışmaydı ve o zamandan beri iki ulusumuz arasında gergin ve huzursuz bir barış oluştu. Artık durum böyle değil. [BRA.GetNameDefCap] başa çıkılması gereken bir tehdittir. Birliklerimiz, arkalarında geçmişimizin ruhuyla yürüyor."
 ARG_spirit_of_the_conquistadors_idea:0 "Fatihlerin Ruhu"
 ARG_spirit_of_the_conquistadors_idea_desc:0 "Halkımızı buraya, güzel gümüş diyarına getiren Fatihlerin şanına borçluyuz. Tarihimizde önemli bir rol oynuyorlar ve şimdi Nimio de Anquín'in yeni milliyetçi hükümetine ilham kaynağı oluyorlar. [ARG.GetNameDefCap], zayıf komşularımızı fethettikçe büyüyecek ve Güney Amerika'da baskın güç haline gelecektir."
 ARG_state_atheism_idea:0 "Devlet Ateizmi"
 ARG_state_atheism_idea_desc:0 "Devlet ateizmi, katı ateizmin siyasi rejimlere dahil edilmesidir. Birçoğu tarafından teolojinin tam karşıtı olarak kabul edilen bu, ilk iktidara geldiğinde Sovyetler Birliği'nin izinden giden komünist devletler tarafından benimsenen yaygın bir politikadır."
 ARG_state_unions_idea:0 "Devlet Sendikaları"
 ARG_state_unions_idea_desc:0 "İşçi sendikaları, istihdam koşullarını sürdürmeye ve iyileştirmeye niyetli işçi örgütleridir. Bu koşulların birçoğu daha iyi ücretler ve yan haklar, iyileştirilmiş güvenlik ve çalışma koşulları ile sıradan işçinin yönetimi tarafından haksız yere muamele görmemesini sağlamayı içerir."
 ARG_subdue_dissension_idea:0 "Bastırılmış Muhalefet"
 ARG_subdue_dissension_idea_desc:0 "Devam eden askeri muhalefet nihayet bastırıldı. Bu, gelecekte hükümetimizin birçok kolundaki daha fazla huzursuzluğa karşı dikkatli olmamız için bir ders olmalı."
 ARG_towards_a_greater_argentina_idea:0 "$ARG_towards_a_greater_argentina$"
 ARG_towards_a_greater_argentina_idea_desc:0 "[ARG.GetNameDefCap], 20. yüzyılın başlarında hem Büyük Buhran'ın saldırısıyla hem de ardından gelen Rezalet On Yılı'nın başlangıcıyla büyük acılar çekti. Sürekli hileli seçimlere, darbe girişimlerine ve yozlaşmış hükümet yetkililerine rağmen, istikrarlı ve verimli bir ulus olarak zirveye çıkmayı başardık."
 ARG_united_workers_idea:0 "Birleşik İşçiler"
 ARG_united_workers_idea_desc:0 "İşçi, sosyalist devrimin bel kemiğidir. Proletarya, kapitalizmin [ARG.GetNameDef] boyunca yaydığı yolsuzluk ve sahtekarlığa karşı birleşmiş durumda"
 ARG_us_army_training_idea:0 "$ARG_us_army_training$"
 ARG_us_army_training_idea_desc:0 "[USA.GetNameDef] ile daha yakın bağlarla, onların eğitim rejimlerini ordumuza benimsedik. Birliklerimizi [USA.GetNameDef] gibi eğitirsek daha güçlü ve daha dirençli bir orduya sahip olacağız."
 ARG_war_division_idea:0 "Savaş Tümeni"
 ARG_war_division_idea_desc:0 "Artık ulusumuz hükümetini sağlamlaştırdığına ve güçlü bir ekonomi kurduğuna göre, halkımızdan yayılmacı hedeflerimizi gerçekleştirmeye hazırlanmak için yeterli desteği nihayet topladık."
 ARG_women_in_industry_idea:0 "$ARG_women_in_industry$"
 ARG_women_in_industry_idea_desc:0 "[ARG.GetNameDef]'in lideri olarak bir kadın olmasıyla, kadınların diğer sanayilerde de çalışma hakkına sahip olması gerektiğine dair bir emsal teşkil ediyor. İş gücümüze bu büyük eklemeyle, ülkemiz için büyük bir ekonomik ilerleme bekleyebiliriz."
 BOL_empresa_nacional_ferrocarriles_del_estado:0 "Empresa Nacional Ferrocarriles del Estado"
 BOL_era_of_national_regression:0 "Ulusal Gerileme Dönemi"
 BOL_era_of_national_regression_desc:0 "Son on yıllar Bolivya için zor geçti. Önce 1879'dan 1883'e kadar Pasifik Savaşı, sonra 1899'dan 1903'e kadar Acre Savaşı ve son olarak ulusun en son yenilgisi, 1932'den 1935'e kadar Chaco Savaşı."
 BOL_era_of_national_regression_tt:0 "Büyük Bolivya restore edilirse kaldırılacak:\n§YAcre§!, §YAntofagasta§!, §YChaco Boreal§!'in tam kontrolüne sahip."
 BOL_plurinational_democracy:0 "Demokratik Çokulusluluk"
 BOL_plurinational_democracy_desc:0 "Devletimiz, bir siyasi yapı içinde çok sayıda mühürlenmiş veya korunmuş ulusal grubun bir arada yaşamasıyla tanımlanır. [BOL.GetNameDef]'de milliyet fikri çoğuldur, yani organize bir topluluk veya halklar bütünü içinde birçok ulusal vardır."
 BOL_toll_of_the_chaco_war:0 "Chaco Savaşı'nın Bedeli"
 BOL_toll_of_the_chaco_war_2:0 "Chaco Savaşı'nın Bedeli"
 BOL_toll_of_the_chaco_war_2_desc:0 "Chaco Savaşı 1932'den 1935'e kadar sürdükten sonra yeni sona erdi. Hem Bolivya'da hem de Paraguay'da yayılmacılığın en ateşli destekçilerinden bile savaşma isteği tamamen tükendi ve hala tartışmalı olan Chaco Boreal bölgesinde birçok kişi ölü yatıyor."
 BOL_toll_of_the_chaco_war_desc:0 "Chaco Savaşı 1932'den 1935'e kadar sürdükten sonra yeni sona erdi. Hem Bolivya'da hem de Paraguay'da yayılmacılığın en ateşli destekçilerinden bile savaşma isteği tamamen tükendi ve hala tartışmalı olan Chaco Boreal bölgesinde birçok kişi ölü yatıyor."
 BRA_accepted_washington_accords:0 "Washington Anlaşmaları Kabul Edildi"
 BRA_aftermath_of_the_coup:0 "Olağanüstü Hal"
 BRA_aftermath_of_the_coup_desc:0 "Komünistler tam ölçekli bir iç savaşa dönüşme tehdidi taşıyan bir darbe başlattığında Kasım 1935'te olağanüstü hal ilan edildi. Darbe engellenmiş olsa da, Başkan henüz olağanüstü hali sona erdirmedi. Siyasi yelpazenin her kesiminden birçok kişi şimdi rejimin daha fazla muhalefeti bastırmak için acil durum yetkilerini kullanmaya devam edeceğinden endişe ediyor. "
