 CHL_arsenales_de_marina:0 "Arsenales de Marina"
 CHL_banco_central_de_chile:0 "Banco Central de Chile"
 CHL_banco_central_de_chile_desc:0 "Şili Merkez Bankası, Ağustos 1925'te, aynı zamanda bankanın altın standardı rejimi altında banknot basma tekelini de kuran 486 sayılı Kanun Hükmünde Kararname ile kuruldu. Arturo Alessandri'nin başkan olarak ilk döneminde oluşturuldu."
 CHL_can_not_have_anarchy_tt:0 "$idea_CHL_near_anarchic_society$'a sahip değil"
 CHL_carabineros_de_chile_fascist:0 "Carabineros de Chile"
 CHL_carabineros_de_chile_fascist_desc:0 "Carabineros de Chile, tüm ulus üzerinde yargı yetkisine sahip ulusal kanun uygulayıcı jandarmamızdır. Eski başkanımız Carlos Ibáñez del Campo tarafından 1927'de oluşturulan misyonları, düzeni sağlamak ve Şili yasalarını uygulamaktır."
 CHL_carabineros_de_chile_neutrality:0 "Carabineros de Chile"
 CHL_carabineros_de_chile_neutrality_desc:0 "Carabineros de Chile, tüm ulus üzerinde yargı yetkisine sahip ulusal kanun uygulayıcı jandarmamızdır. Büyük başkanımız Carlos Ibáñez del Campo tarafından 1927'de oluşturulan misyonları, düzeni sağlamak ve Şili yasalarını uygulamaktır."
 CHL_catholic_church_holding_political_power:0 "Siyasi Güç Sahibi Katolik Kilisesi"
 CHL_catholic_church_holding_political_power_desc:0 "Katolik Kilisesi'ne şu anda resmi hükümet politikasında söz hakkı veriliyor, bu da sol kanadın bize karşı güçlü bir koalisyon kurmasını engelliyor."
 CHL_cattle_and_wool:0 "Mapuçe Sığırları ve Yünü"
 CHL_cattle_and_wool_desc:0 "Mapuçe halkının mükemmel gütme ve hayvancılık teknikleri sayesinde, ulus elindeki az şeyden en iyi şekilde yararlanabilir."
 CHL_chile_payments_from_peru:0 "Peru'dan Ödemeler"
 CHL_chile_payments_from_peru_desc:0 "[951.GetName]'i yakın zamanda satın almaları nedeniyle, [PRU.GetNameDef] bize her ay büyük bir miktar para ödüyor ve ekonomimizi canlandırıyor."
 CHL_chilean_economy_dynamic_modifier:0 "Şili Ekonomisi"
 CHL_chilean_economy_dynamic_modifier_desc:0 "Bakır ve nitrat ihracatına aşırı bağımlılık nedeniyle, en büyük ticaret ortağı olan ABD'nin Şili'den ithalatı durdurmasıyla büyük çöküşten sonra Şili ekonomisi büyük darbe aldı ve ülke ekonominin tamamen çökmemesi için toprak parçalarını satmak zorunda kaldı. Durumu çözmek için çabalar gösterildi, ancak daha fazlasının yapılması gerekiyor. Şili ekonomisi bir gün yeniden büyük olacak!"
 CHL_claims_patagonia:0 "Patagonya'yı Kendilerinin Olduğunu İddia Etti"
 CHL_communist_party_in_power:0 "Partido Comunista"
 CHL_compania_electro_industrial_valdivia:0 "Electro-Siderúrgica ve Industrial de Valdivia Şirketi"
 CHL_compania_electro_industrial_valdivia_desc:0 "ESVAL, Şili'nin Valdivia şehrinde bulunan bir demir-çelik sanayisidir. İşletme, Valdivia'dan girişimciler tarafından oluşturulduğunda 1926'da altyapısını satın aldığı Altos Hornos y Acerías de Corral'ın mirasçısı olarak kabul edilir."
 CHL_compania_general_electricidad:0 "Compañía General de Electricidad"
 CHL_compania_general_electricidad_desc:0 "CGE, 21 Şubat 1905'te mühendisler Francisco Huneeus Gana ve Raúl Claro Solar liderliğindeki bir grup profesyonel tarafından kuruldu. [ROOT.GetName]'deki en büyük elektronik geliştiricisidir."
 CHL_compania_manufacura_cartones:0 "Compañía Manufacturera de Papeles y Cartones"
 CHL_compania_manufacura_cartones_desc:0 "CMPC, Santiago merkezli bir [CHL.GetAdjective] kağıt hamuru ve kağıt şirketidir. Ülkenin en büyük kağıt üreticisidir ve şirket 1920'de Cartón del Maipo ve Esperanza arasındaki fabrikaların birleşmesi ve iş adamı Luis Matte Larraín ile Alman mühendis Germán Ebbinghaus'un birleşmesiyle kuruldu."
 CHL_compania_sudamerica_vapores:0 "Compañía Sudamericana de Vapores"
 CHL_compania_sudamerica_vapores_desc:0 "CSAV, şu anda Latin Amerika'daki türünün en büyük şirketi olan ve aynı zamanda 1872'de kurulmuş olmasıyla en eskilerinden biri olan bir [CHL.GetAdjective] nakliye şirketidir. Sivil deniz taşıtlarının üretimini artırmak için kullanılabilir."
 CHL_comptroller_general_of_chile:0 "Contraloría General de la República"
 CHL_comptroller_general_of_chile_desc:0 "Cumhuriyetin Sayıştayı, Şili'nin üst denetim kurumudur, özerk karakterli ve anayasal rütbelidir, Kamu Yönetimi eylemlerinin yasallığının kontrolünü kullanmakla, mali, belediye ve yasalarla belirlenen diğer kuruluş ve hizmetlerin gelir ve yatırımlarını denetlemekle, mali ve belediye varlıklarından sorumlu kişilerin hesaplarını incelemek ve yargılamakla, Ulusun genel muhasebesini tutmakla ve yasa tarafından emanet edilen diğer işlevleri yerine getirmekle görevlidir."
 CHL_conservative_party_in_power:0 "Partido Conservador"
 CHL_corporacion_fomento_production:0 "Corporación de Fomento de la Producción de Chile"
 CHL_corporacion_fomento_production_desc:0 "Chillán depreminin ardından, CORFO etkilenenlere mal dağıtmak ve [ROOT.GetAdjective] içindeki mal kontrolü, dağıtımı ve hareketine yardımcı olmak amacıyla kuruldu."
 CHL_crusade_against_imperialism_idea:0 "Emperyalizme Karşı Büyük Haçlı Seferi"
 CHL_crusade_against_imperialism_idea_desc:0 "Sonunda emperyalist ve sömürgeci güçleri kıtamızdan atma ve Amerikan Yerlileri ile Polinezya halklarını yabancı baskısından kurtarma zamanı geldi!"
 CHL_crusading_against_imperialism:0 "Emperyalizme Karşı Haçlı Seferi"
