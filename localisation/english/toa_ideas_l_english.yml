 URG_terra_dictatorship:0 "Terra Diktatörlüğü"
 URG_terra_dictatorship_desc:0 "31 Mart 1933 Devrimi'nden bu yana, Gabriel Terra ve Batllismo'yu takip edenler de dahil olmak üzere destekçileri, Beyaz Parti ve lideri Luis Alberto de Herrera ile birlikte iktidarda olup, kararlarına meydan okuyacak hiçbir otorite kalmamıştır. Uruguay için bu, Terra'nın hem Güney Amerika'da hem de Atlantik okyanusunun ötesindeki öngörülemeyen savaşlarda taraf seçmek yerine iç kalkınma ve kontrol istediği için katı bir tarafsızlık anlamına gelir."
 USA_monroe_doctrine_enforcer:0 "Monroe Doktrini Uygulayıcısı"
 USA_monroe_doctrine_enforcer_desc:0 "19. yüzyılın ortalarından beri, batı yarımküresini sömürgeci güçlerin dış müdahalesinden korumak için çaba gösterdik. Bu doktrinin parametreleri zamanla gelişmiş olsa da, özü Kuzey ve Güney Amerika'daki komşularımızın çatışma zamanlarında onlara yardım etmemizi bekleyeceği anlamına gelir. Elbette doktrini ne zaman ve nasıl uygulayacağımızı belirlemek kendi hükümetimize bağlıdır."
 USA_monroe_doctrine_idea:0 "Monroe Doktrini"
 USA_monroe_doctrine_idea_desc:0 "Amerika Birleşik Devletleri uzun zamandır batı yarımküresini sömürgeci güçlerin dış müdahalesinden korumaya söz vermiştir, bu da topraklarımıza herhangi bir tecavüzün muhtemelen ABD'nin yardımımıza geleceği anlamına gelir. Ancak, politikalarımız artık Amerika Birleşik Devletleri'ninkilerle aynı hizada değilse, kendimizi korumasız bulabiliriz."
