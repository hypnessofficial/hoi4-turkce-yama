 CHL_deeper_mines_modifier:0 "Geniş Maden Ağları"
 CHL_democratic_alliance_in_power:0 "Alianza Democrática"
 CHL_democratic_volunteer_corps:0 "Demokrasinin Uluslararası Koruması"
 CHL_democratic_volunteer_corps_desc:0 "Otoriterliğin çirkin yüzünü göstermeye cüret ettiği her yerde, askerlerimiz onu bir an bile tereddüt etmeden yok etmeye hazır ve gururlu duracaktır."
 CHL_devalue_the_franc_idea:0 "Frank'ı Devalüe Etme"
 CHL_devalue_the_franc_idea_desc:0 "Ekonomimizin büyümesi için ihtiyaç duyduğu gücü kazanması için, popüler olmayan bir önlem olmasına rağmen Frank devalüe ediliyor."
 CHL_devalue_the_peso_idea:0 "Peso'yu Devalüe Etme"
 CHL_devalue_the_peso_idea_desc:0 "Ekonomimizin büyümesi için ihtiyaç duyduğu gücü kazanması için, popüler olmayan bir önlem olmasına rağmen Peso devalüe ediliyor."
 CHL_development_inwards_idea:0 "İçe Dönük Gelişim"
 CHL_development_inwards_idea_desc:0 "İçe Dönük Gelişim olarak adlandırılan yeni ekonomik doktrin, uzun yıllar süren acı ve eylemsizlikten sonra yeniden yapılanmamıza yardımcı olacaktır."
 CHL_empowered_preparations_department:0 "Güçlendirilmiş Hazırlıklar Departmanı"
 CHL_empowered_preparations_department_desc:0 "Nacista Hazırlıklar Departmanı şu anda parti tarafından önceliklendiriliyor ve grup liberal hükümete karşı bir darbe için hazırlanıyor."
 CHL_empresa_ferrocarries_del_estado:0 "Empresa de los Ferrocarriles del Estado"
 CHL_empresa_ferrocarries_del_estado_desc:0 "EFE, Şili'nin ulusal demiryolu ve en eski devlet teşebbüsüdür. Ülkedeki altyapıyı ve işletme demiryolu hizmetlerini yönetir."
