 BRA_anaue_idea:0 "Anauê"
 BRA_anaue_idea_desc:0 "Yerli selamı Anauê, integralist hareketin toplanma çığlığı olarak yeni bir hayat kazandı. Partinin yeşil üniformalı üyeleri tarafından sokaklarda atılan bu slogan, milliyetçi eğilimli olanlara gurur, muhaliflerine ise endişe veriyor."
