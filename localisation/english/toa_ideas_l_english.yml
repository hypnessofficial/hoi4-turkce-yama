 BRA_brown_water_navy_idea_desc:0 "$SMB_brown_water_navy_desc$"
 BRA_cangaceiro_state:0 "Eyalette Cangaço Aktif"
 BRA_cangaceiro_state_desc:0 "Bir zamanlar Brezilya'nın Kuzeydoğusunda bir güç boşluğu vardı ve bu da Cangaço olarak bilinen haydutların yükselişine yol açtı. Bu haydutlar on yıllardır bölgeyi rahatsız ediyor ve genellikle sempatik yerliler tarafından destekleniyor. Bölgenin kontrolünü tamamen kaybetmeden önce onların devam eden yağma ve cinayetleri hakkında bir şeyler yapmalıyız."
 BRA_cbc_manufacturer:0 "$BRA_cbc_organization$"
 BRA_collaboration_with_the_church:0 "Kilise ile İşbirliği"
 BRA_collaboration_with_the_church_desc:0 "Kilise birçok Brezilyalı için hayati öneme sahiptir. Politikalar konusunda onlarla istişare ederek, yönetimimiz için kitlesel desteklerini kazanabiliriz."
 BRA_collectivized_agriculture:0 "Kolektifleştirilmiş Tarım"
 BRA_collectivized_agriculture_desc:0 "Tarım sanayimizi kolektifleştirerek verimliliğini artırdık ve halkımız arasında komünist ideolojiyi güçlendirdik."
 BRA_commonwealth_idea:0 "Portekizce Konuşan Ülkeler Topluluğu Üye Devleti"
 BRA_commonwealth_idea_desc:0 "Bu ulus, Portekizce'nin genellikle en çok kullanılan dil olduğu güçlü tarihi bağlara sahip bir topluluk olan Portekizce Konuşan Ülkeler Topluluğu'nun bir üyesidir. Üye devletler, teknoloji ve dış politika gibi karşılıklı endişe konularında birbirleriyle işbirliği yapmayı kabul ettiler."
 BRA_court_the_military_idea:0 "Orduyu Tavlama"
 BRA_court_the_military_idea_desc:0 "Kurulmuş nüfuzu ve kaynakları olmadan iktidardaki tutuşumuzu sürdüremeyiz. En azından şimdilik, onları yanımızda tutmaya çalışmalıyız."
