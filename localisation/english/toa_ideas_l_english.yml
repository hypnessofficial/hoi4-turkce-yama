 CHL_hydroelectric_power:0 "Hidroelektrik Güç"
 CHL_hydroelectric_power_desc:0 "Araucanía bölgesine yapılan yatırımlar sayesinde, nihayet elektrik üreten ve nehir akışlarını düzenleyen bir baraj ağı inşa ettik."
 CHL_ibanez_foriegn_support:0 "Yabancı Ekonomik Yatırımlar"
 CHL_ibanez_foriegn_support_desc:0 "Büyük miktarda yeni kredi sayesinde, yeni para sanayilerimizin eline akarken ülke yavaş yavaş tekrar yoluna girebilir."
 CHL_impose_new_taxes_tt:0 "Ulusal ruh §Y$CHL_imposed_new_taxes$§! kaldırıldığında, §Y$CHL_chilean_economy_dynamic_modifier$§!'yi şu şekilde değiştir:\n $MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+%5§! \n $MODIFIER_CONSUMER_GOODS_FACTOR$: §Y-%10§!"
 CHL_imposed_new_taxes:0 "Yeni Vergiler Konuldu"
 CHL_introduced_the_franc_idea:0 "Frank Tanıtıldı"
 CHL_introduced_the_franc_idea_desc:0 "Ülkenin yaralarından kurtulması ve dünya sahnesindeki yerini bulması için, daha büyük Frankofon alanının bir parçası olması gerekiyor. Eski Peso'yu Araucanía Frankı ile değiştirerek büyük bir adım atıldı."
 CHL_invited_french_academia:0 "Fransız Akademisi"
 CHL_invited_french_academia_desc:0 "Frankofon alanında olmanın önemli bir parçası, aynı düşünmektir ve bunu yapmak için Fransız akademisini [CHL.GetNameDef]'e taşınmaya teşvik edeceğiz."
 CHL_lack_of_funds:0 "Fon Eksikliği"
 CHL_lack_of_funds_desc:0 "Liberal hükümet, ülkede bulunan fonların büyük bir kısmını çaldı ve yurtdışına kaçtı. Bu ekonomik kayıptan kurtulmamız uzun zaman alacak."
 CHL_laissez_faire:0 "Laissez-Faire"
 CHL_laissez_faire_desc:0 "Piyasa serbestçe akmalı ve ancak hükümetin endüstriyel işler üzerindeki etkisinden kaçınarak ekonomimiz toparlanabilir."
 CHL_lar_encryption:0 "Şifreleme Bonusu"
 CHL_legacy_of_caupolican:0 "Caupolicán'ın Mirası"
 CHL_legacy_of_caupolican_desc:0 "Caupolicán'ın mirası bugün hala bizi etkiliyor ve onun ruhu ve iradesi birliklerimizin zihinlerinde ve eylemlerinde ileriye taşınacak."
 CHL_liberal_party_in_power:0 "Partido Liberal"
 CHL_ligas_patrioticas:0 "Ligas Patrióticas"
 CHL_ligas_patrioticas_desc:0 "Ligas Patrióticas, [CHL.GetNameDef]'de faaliyet gösteren, herhangi bir muhalefeti bastırmamıza ve kimsenin askerlikten kaçmasını engellememize yardımcı olan aşırı sağcı bir para-polis sivil örgütüdür."
 CHL_local_mapuche_defense_groups:0 "Yerel Mapuçe Savunma Grupları"
 CHL_machi_in_the_army:0 "Orduda Machi Organizasyonu"
 CHL_machi_in_the_army_desc:0 "Machi şamanlarımızın birliklerimizle birlikte yürümesini sağlayarak, onların her zaman canlanmış ve motive kalmalarını sağlayabiliriz."
 CHL_mapuche_ancestral_resistance_good:0 "Resistencia Ancestral Mapuche"
 CHL_mapuche_conflict_down_tt:0 "Mapuçe anlaşmazlığını §GAzaltır§!.\n"
 CHL_mapuche_conflict_up_tt:0 "Mapuçe anlaşmazlığını §RKötüleştirir§!.\n"
 CHL_mapuche_nationalism_dynamic_modifier:0 "Mapuçe Milliyetçiliği"
 CHL_mapuche_nationalism_dynamic_modifier_desc:0 "Mapuçe Milliyetçiliği, ulusumuzda mevcut olmasına rağmen çok uzun süredir yaygın değildi. Bu nedenle, en çok arzu ettiğimiz şekli almasını sağlamak için onu kendimiz şekillendirmeliyiz."
 CHL_mapuche_social_classes:0 "Mapuçe Sosyal Sınıfları ve Ortak Cinsiyetli Kimlikler"
 CHL_mapuche_social_classes_desc:0 "Eski toplumumuzun sosyal sınıflarını ve normlarını yenisinde uygulayarak, onu bir kez daha refaha kavuşturabiliriz."
 CHL_modify_chilean_airforce_ns_intro:0 "§Y$CHL_airforce_modifier$§!'yi şununla değiştir"
 CHL_modify_chilean_army_ns_intro:0 "§Y$CHL_army_modifier$§!'yi şununla değiştir"
 CHL_modify_chilean_economy_ns_intro:0 "§Y$CHL_chilean_economy_dynamic_modifier$§!'yi şununla değiştir"
 CHL_modify_chilean_navy_ns_intro:0 "§Y$CHL_navy_modifier$§!'yi şununla değiştir"
 CHL_modify_mapuche_nationalism_ns_intro:0 "§Y$CHL_mapuche_nationalism_dynamic_modifier$§!'yi şununla değiştir"
 CHL_national_falange:0 "Falange Nacional"
 CHL_national_falange_desc:0 "Hristiyan siyasi partisi Falange Nacional, 1935'te muhafazakar partiden ayrılan ilerici ve reformist bir partidir ve mevcut siyasi koalisyonumuzu desteklemeye fazlasıyla isteklidirler."
 CHL_naval_mutiny:0 "Deniz İsyanı"
 CHL_naval_mutiny_desc:0 "Hareketlerimizin iktidara yükselişine protesto olarak başka bir deniz isyanı devam ediyor ve bu ulusumuzu ciddi şekilde sakatlıyor."
 CHL_navy_modifier:0 "$SMB_navy_CHL$"
 CHL_non_lar_encryption:0 "Şifreleme Bonusu"
 CHL_oppressed_working_class:0 "Ezilmiş İşçi Sınıfı"
 CHL_oppressed_working_class_desc:0 "Komünist olan her şeye yönelik acımasız baskımızla, sendikalar artık ülkede hareket edemez ve işçi sınıfı, Kalıcı Savunma Yasası'nı ihlal etmedikçe düzgün bir şekilde protesto edemeden bizim emirlerimizi yerine getirmeye komuta edilebilir."
 CHL_pan_hispanic_rhetoric:0 "Pan-Hispanik Retorik"
 CHL_pan_hispanic_rhetoric_2:0 "Pan-Hispanik Retorik"
 CHL_pan_hispanic_rhetoric_2_desc:0 "Yakında, Hispanik halkların dönemi gelecek ve kıtaya hükmedeceğiz. Anglo hegemonyasını kırma ve Hispanik halkı birleştirme zamanı geldi!"
 CHL_pan_hispanic_rhetoric_3:0 "Pan-Hispanik Retorik"
 CHL_pan_hispanic_rhetoric_3_desc:0 "Yakında, Hispanik halkların dönemi gelecek ve kıtaya hükmedeceğiz. Anglo hegemonyasını kırma ve Hispanik halkı birleştirme zamanı geldi!"
 CHL_pan_hispanic_rhetoric_desc:0 "Yakında, Hispanik halkların dönemi gelecek ve kıtaya hükmedeceğiz. Anglo hegemonyasını kırma ve Hispanik halkı birleştirme zamanı geldi!"
 CHL_patagonian_giants:0 "Patagonya Devleri"
 CHL_patagonian_giants_desc:0 "Bir zamanlar Patagonlar en cesur Avrupalı kaşiflerin bile kalplerine korku salardı. Ordumuzun bu hayali insanların ruhunu somutlaştırmasını sağlamalı ve etrafımızdaki herkesin saygısını kazanmalıyız."
