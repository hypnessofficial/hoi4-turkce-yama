 BRA_navy_modifier:0 "$SMB_navy_BRA$"
 BRA_navy_reward:0 "Donanma Sadakatini Ödüllendirme"
 BRA_neglected_state_dynamic_modifier:0 "İhmal Edilmiş Eyalet"
 BRA_neglected_state_dynamic_modifier_desc:0 "Bu eyalet, birbirini izleyen hükümetler tarafından kronik olarak yetersiz yatırım yapılmasına maruz kalmış, bu da altyapı eksikliğine, işsizliğe ve merkezi hükümete karşı kızgınlığa yol açmıştır. "
 BRA_new_capital_modifier:0 "Yeni Başkent İnşaatı"
 BRA_new_capital_modifier_desc:0 "Kırsal eyaletler arasındaki izolasyon duygularını azaltmak için ulusun kalbinde yeni bir başkent kurma sürecindeyiz."
 BRA_port_investment:0 "Liman Yatırımı"
 BRA_port_investment_desc:0 "$BRA_invest_in_ports_desc$"
 BRA_presidential_republic:0 "Başkanlık Cumhuriyeti"
 BRA_presidential_republic_desc:0 "Ulusun, halkı birleştirebilecek ve sınırlarımızı savunabilecek güçlü, kararlı bir liderliğe ihtiyacı var. Bunu yapmak için, siyasi otoriteyi Cumhuriyetin Başkanında yoğunlaştırıyoruz, ancak başka bir Vargas'ın gücü ele geçirmeye çalışmasını önlemek için güçlü kontrol ve denge mekanizmalarının yerinde olduğundan emin olmalıyız."
 BRA_proletarian_equality:0 "Proleter Eşitliği"
 BRA_proletarian_equality_desc:0 "$BRA_equality_for_women_desc$"
 BRA_promoting_communism:0 "Yükselişteki Komünizm"
 BRA_promoting_communism_desc:0 "Brezilya, çeşitli komünist hizalı grupları destekleyerek politikamızı etkilemeye çalışıyor."
 BRA_propaganda_idea:0 "Departamento de Propaganda"
 BRA_propaganda_idea_desc:0 "Böylesine hassas zamanlarda, halkın sadece işlerine devam etmeleri ve hükümeti desteklemeleri için ihtiyaç duydukları bilgileri aldığından emin olmalıyız."
 BRA_psad_idea:0 "Departamento Administrativo do Serviço Público"
 BRA_psad_idea_desc:0 "DASP, çeşitli selef departmanlarını tek, uyumlu, modern bir departmanda birleştirerek ve yeniden düzenleyerek hükümetin iyi işleyen bir rejim ve ekonomi sürdürmesine yardımcı olmak için kuruldu."
 BRA_radicalized_proletariat:0 "Radikalleşmiş Proletarya"
 BRA_radicalized_proletariat_desc:0 "Komünist fikirler [BRA.GetNameDef]'in işçi sınıfı içinde kök saldı. Onları memnun etmekle Orduyu memnuniyetsiz bırakmamak arasında ince bir çizgide yürüyoruz."
 BRA_radio_nacional_idea:0 "Radio Nacional"
 BRA_radio_nacional_idea_desc:0 "Ulusal bir radyo istasyonunun kurulmasıyla, hükümetin artık halkla doğrudan iletişim kurma yöntemi var. Bunu, onlara en objektif, güncel bilgileri almalarını sağlamak veya sadece bilmelerini istediğimiz bilgileri vermek için kullanabiliriz."
 BRA_rail_investment:0 "Demiryolu Yatırımı"
 BRA_rail_investment_desc:0 "$BRA_invest_in_railways_desc$"
 BRA_rejected_washington_accords:0 "Washington Anlaşmaları Reddedildi"
 BRA_road_investment:0 "Yol Yatırımı"
 BRA_road_investment_desc:0 "$BRA_invest_in_road_infrastructure_desc$"
 BRA_romanticize_the_old_empire_idea:0 "İmparatorluk Duyguları"
 BRA_romanticize_the_old_empire_idea_desc:0 "Brezilya hükümetine karşı şikayetleri olan insan sıkıntısı yok. İmparatorluk duygularını ve nostaljisini yeniden canlandırarak, bu farklı grupları tek bir uyumlu güç haline getireceğiz."
 BRA_rossi_manufacturer:0 "$BRA_rossi_organization$"
 BRA_secure_our_borders_idea:0 "Sınırlarımızı Güvence Altına Al"
 BRA_secure_our_borders_idea_desc:0 "$BRA_secure_our_borders$"
 BRA_separatism_idea:0 "Ayrılıkçı Duygular"
 BRA_separatism_idea_desc:0 "Ulusun dört bir yanında Brezilya merkezi hükümetine karşı şikayetleri olan veya ulusun daha az varlıklı eyaletlerini desteklemekten rahatsız olan birçok kişi var. Geçmişte bu duygular, eyaletlerini ulustan ayıran kısa ömürlü ayrılıkçı hareketlere yol açtı. Siyasi durumu yakında istikrara kavuşturamazsak, bu tür hareketler Brezilya'nın parçalanmasına neden olabilir."
 BRA_stability_and_unity:0 "Düzen ve İlerleme"
 BRA_stability_and_unity_desc:0 "Dikkatli siyasi manevralarla, daha güçlü ve giderek daha birleşik bir cumhuriyet yaratmayı başardık. Bu temel üzerine, büyük ulusumuzun vatandaşlarını korumaya devam edeceğiz."
 BRA_supporting_operation_bolivar:0 "Bolivar Operasyonunu Destekleme"
 BRA_sway_the_neighbors_lar:0 "Komşuları Etkileme İstihbarat Kampanyası"
 BRA_tax_haven:0 "Gelişen Vergi Cenneti"
 BRA_tax_haven_desc:0 "Şirketler için düşük vergilendirme ve bir dizi yasal boşluk, Brezilya'ya taşınan çok uluslu şirketlerin sayısında bir artışa yol açtı. Sonuçta onlardan hiç vergi almamaktansa biraz vergi geliri elde etmemiz daha iyi."
 BRA_undermine_democracy_idea:0 "Demokrasiyi Zayıflat"
 BRA_undermine_democracy_idea_desc:0 "$BRA_undermine_democracy_desc$"
 BRA_undiversified_economy_modifier:0 "Çeşitlendirilmemiş Ekonomi"
 BRA_undiversified_economy_modifier_desc:0 "Kahve ihracatına aşırı bağımlılık, büyük buhran vurduğunda ve dünya ulusları bağımlılık yaratan uyarıcıyı satın almayı bıraktığında Brezilya ekonomisini felce uğrattı. Eğer ulus gelişecekse, herhangi bir hükümet ekonomiyi yeni alanlara çeşitlendirmek zorunda kalacaktır."
 BRA_undiversified_economy_modifier_dummy_idea:0 "$BRA_undiversified_economy_modifier$"
 BRA_undiversified_economy_modifier_dummy_idea_desc:0 "$BRA_undiversified_economy_modifier_desc$"
 BRA_unwilling_subjects:0 "İsteksiz Tebaalar"
 BRA_unwilling_subjects_desc:0 "Monarşinin ulusun siyasi sistemini giderek daha fazla ele geçirmesiyle, halk bir kez daha bir otokratın tebaası olmaktan rahatsız ve hayal kırıklığına uğradı."
 BRA_us_of_brazil:0 "Özgürlüğün Savunması"
 BRA_us_of_brazil_desc:0 "Özgürlük ve demokrasi idealleri, cumhuriyetimizin üzerine kurulduğu temellerdir. Gerekirse bu değerleri yurt içinde ve yurt dışında savunmak için her şeyi yapacağız."
 BRA_us_of_south_america:0 "Güney'in Savunucusu"
 BRA_us_of_south_america_desc:0 "Sınırlarımız kıtanın çoğunu kapsayacak şekilde genişledi. Bu nedenle, Güney Amerika'yı evi olarak gören herkesin haklarını savunmayı kutsal görevimiz haline getireceğiz."
 BRA_washington_accords_idea:0 "Washington Anlaşmaları"
 BRA_washington_accords_idea_desc:0 "$BRA_washington_accords$"
 BRA_weak_government:0 "Zayıf Hükümet"
 BRA_weak_government_desc:0 "Yıllar boyunca devrimler ve darbe girişimleri Brezilya hükümetinin otoritesini zayıflattı. Durum, uzlaşmadan doğan ve az destekçi bulan 1934 anayasasıyla daha da kötüleşiyor. Brezilya'nın geleceği ne olursa olsun, mevcut siyasi düzenlemenin sürdürülemez olduğu kesindir. "
 BRA_weak_government_dummy_idea:0 "$BRA_weak_government$"
 BRA_weak_government_dummy_idea_desc:0 "$BRA_weak_government_desc$"
