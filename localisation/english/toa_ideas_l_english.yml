 CHL_anti_communist_action_desc:0 "Yerli komünist tehditle düzgün bir şekilde mücadele etmek için, herhangi bir solcu hareketi bastırmaya hazır vatansever gruplar düzenlemeliyiz."
 CHL_araucanian_aristocracy:0 "Yeni Araucanía Aristokrasisi"
