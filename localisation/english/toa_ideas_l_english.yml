 CHL_popular_front_in_power:0 "Frente Popular"
 CHL_popular_resistance:0 "Halk Direnişi"
 CHL_popular_resistance_desc:0 "Ülkede hala onun dehasına, kral Antoine Bernard'ın gücüne inanmayan birçok insan var. Onlarla derhal ilgilenilmeli!"
 CHL_public_works_modifier:0 "Kamu İşleri Programları"
 CHL_puppeteering_idea:0 "Gölgeden Yönetim"
 CHL_puppeteering_idea_desc:0 "İnsan sadece her şeyi fethedip kendini kral ilan etmeye çalışarak hükmetmez. Bunun yerine sadık tebaalar bulmalı ve onları fethettiği düşmanlarının tahtlarına yerleştirmelidir, tıpkı büyük Napolyon Bonapart'ın bir zamanlar yaptığı gibi!"
 CHL_radical_party_in_power:0 "Partido Radical"
 CHL_relief_efforts_idea:0 "Yardım Çabaları"
 CHL_relief_efforts_idea_desc:0 "Hükümet, 1939 Chillán depreminden sonra yardım ve yeniden yapılanma çabalarını daha iyi organize etmek ve desteklemek amacıyla Yeniden Yapılanma ve Yardım Kurumu'nu kurdu."
 CHL_relief_efforts_idea_tt:0 "Ulusal ruh §Y$CHL_relief_efforts_idea$§! kaldırıldığında:"
 CHL_republican_guards_in_exile:0 "Sürgündeki [CHL.GetAdjective] Cumhuriyet Muhafızları"
 CHL_republican_guards_in_exile_desc:0 "[CHL.GetAdjective] Liberal hükümeti, ülkelerindeki faşist tehditle başa çıkmalarına yardımcı olacak silahlı paramiliter güçler kurdu, eğer onlarla savaşa girersek."
 CHL_royal_mountaineers:0 "Les Montagnards Royaux"
 CHL_royal_mountaineers_desc:0 "Patagonya olmayabilir, ama Araucanía kesinlikle dağların ve ormanların bir ülkesidir. Kral bu nedenle bu zorlu arazide savaşmakta uzmanlaşmış bir kraliyet dağcı birliğinin kurulmasını istedi."
 CHL_siphoning_funds:0 "Fonları Sifonlama"
 CHL_siphoning_funds_desc:0 "Nacista partisinin propaganda departmanı, [CHL.GetAdjective] nüfusu üzerindeki hakimiyetini artırmak için şu anda kamu sektöründen fonları sifonluyor."
 CHL_socialist_land_reform:0 "Sosyalist Toprak Reformu"
 CHL_socialist_land_reform_desc:0 "Hacendadoların dönemi bitti ve köylülerimiz artık serflik içinde yaşamak zorunda kalmayacak. [CHL.GetNameDef]'de gerçekten yeni bir dönem başladı!"
 CHL_socialist_youth_idea:0 "Sosyalist Gençlik"
 CHL_socialist_youth_idea_desc:0 "Sosyalist gençlik örgütleri, savaşta askerlerimize yardım edebilecek paramiliter kanatlar düzenlememize yardımcı olacaktır."
 CHL_spanish_refugees:0 "İspanyol Entelektüel Mülteciler"
 CHL_spirit_of_the_conquistadors:0 "Fatihlerin Ruhu"
 CHL_spirit_of_the_conquistadors_desc:0 "Halkımızı buraya, Güney Atlantik'teki büyük krallığımıza getiren Fatihlerin şanına borçluyuz. Tarihimizde önemli bir rol oynuyorlar ve şimdi halkımıza ilham kaynağı oluyorlar ve iradeleri bizi geleceğe taşıyacak. [CHL.GetNameDefCap], zayıf komşularımızı fethettikçe büyüyecek ve Güney Amerika'da baskın güç haline gelecektir."
 CHL_spirit_of_the_pacific_war:0 "Pasifik Savaşı'nın Ruhu Canlandı"
 CHL_spirit_of_the_pacific_war_desc:0 "Bir zamanlar [BOL.GetAdjective] ve [PRU.GetAdjective] ordularını sayıca çok az olmamıza rağmen yendik. Şimdi bunu askerlerimizi ilerlemeye teşvik etmek için propaganda olarak kullanıyoruz!"
 CHL_state_catholicism_idea:0 "Devlet Katolikliği"
 CHL_state_catholicism_idea_desc:0 "Frankofon alanına doğru bir başka adım olarak, [CHL.GetNameDef] Katolikliği yeni devlet dini olarak benimsedi."
 CHL_state_supporting_resistance_modifier:0 "Şili Destekli Direniş"
 CHL_state_supporting_resistance_modifier_desc:0 "Şili, yerel direniş ve gerilla gruplarına gizlice silah ve teçhizat temin etmenin yanı sıra askeri eğitim de vermektedir."
 CHL_strict_secularism:0 "Katı Laiklik"
 CHL_strict_secularism_desc:0 "Kilisenin siyasette söz hakkı yoktur ve ondan tamamen ayrı kabul edilmelidir. Politikacılarımızın dinlerini parlamentoya getirmeyeceklerine dair yemin etmelerini istemeliyiz."
 CHL_stricter_labor_laws:0 "Daha Sıkı İş Kanunları"
 CHL_stubbornly_maintaining_neutrality:0 "İnatla Tarafsızlığı Sürdürme"
 CHL_the_francoist_model:0 "Frankocu Model"
 CHL_the_francoist_model_conquest:0 "Frankocu Model"
 CHL_the_francoist_model_conquest_desc:0 "İspanyol general Francisco Franco'nun vaat ettiği gibi tarafsız diktatörlerin doktrinlerini takip ederek, küresel çatışmadan uzak durabilir ve bunun yerine kendi nüfuz alanımıza odaklanabiliriz."
 CHL_the_francoist_model_desc:0 "İspanyol general Francisco Franco'nun vaat ettiği gibi tarafsız diktatörlerin doktrinlerini takip ederek, küresel çatışmadan uzak durabilir ve bunun yerine kendi nüfuz alanımıza odaklanabiliriz."
 CHL_the_grand_chilean_armada:0 "Büyük Şili Donanması"
 CHL_the_grand_chilean_armada_desc:0 "[CHL.GetNameDef]'deki son tonal değişim nedeniyle, kendi Büyük Donanmamızı yaratarak İspanyol mirasımızı güçlendirme süreci başladı."
 CHL_the_international_revolution:0 "Uluslararası Devrim"
 CHL_the_international_revolution_desc:0 "Yurtdışında bir kez başlayan devrimci alevin söndürülmesine izin verilemeyeceğinden emin olmalıyız."
 CHL_the_kings_scouts:0 "Kralın İzcileri"
 CHL_the_kings_scouts_desc:0 "Kralımız küçükken, Fransız izci hareketinin paramiliter eylemlerine katılmaktan hoşlanırdı. Şimdi, aynı sevinci ve tutkuyu [CHL.GetAdjective] gençliğine getirecek."
 CHL_the_mapuche_conflict:0 "Mapuçe Anlaşmazlığı"
 CHL_the_mapuche_conflict_desc:0 "Araucanía'nın pasifikasyonundan ve toprakların ve halkının Şili devletine zorla entegrasyonundan bu yana, yerli Mapuçeler yerinden edilmiş, gözden düşürülmüş ve memnuniyetsiz kalmıştır. Aralarında işbirliği ve entegrasyon için çabalayan gruplar olsa da, devleti mümkün olan her şekilde yıkmak için mücadele edenler de vardır."
 CHL_the_true_enemy_idea:0 "Gerçek Düşmana Karşı Saldır"
 CHL_unified_in_spirit_idea:0 "Ruhta Birleşmiş"
 CHL_unified_in_spirit_idea_desc:0 "Amerikan Yerlileri ve Polinezya halkı, ordularını koordine etme ve eğitme konusunda işbirliği yapıyor, bu da onları çok daha verimli hale getiriyor."
 CHL_veteran_legionaries:0 "Gazi Lejyonerler"
 CHL_veteran_legionaries_desc:0 "Fransız Yabancı Lejyonlarının birçok üyesi, Antoine Bernard'a ülkemize yaptığı seyahatte katıldı ve şanlı fetihlerinde ona yardım edecek."
 CHL_via_trans_radio:0 "Vía Trans Radio Chilena Compañía de Radiotelegrafía"
 CHL_via_trans_radio_desc:0 "VTR, 26 Eylül 1928'de Radio Corporation of America, Marconi Wireless Telegraph Company, Compagnie Generale de Telegraphie sans Fils ve Telefunken Gesellschaft tarafından yapılan ortak yatırımdan kuruldu. Şirket, ülke içinde ve dışında radyotelgraf hizmetleri sunmakta olup, [ROOT.GetName]'deki ilk özel telekomünikasyon şirketlerinden biridir."
