 BRA_atheist_state:0 "Ateist bir Devlet"
 BRA_atheist_state_desc:0 "Bilimsel ilerlemeye odaklanmış bir devlet olarak zamanımızı ruhban sınıfının gönlünü hoş etmekle geçiremeyiz. Bir ülkenin yönetimi ile halkının dini karıştırılmamalıdır ve biz bunu böyle tutmaya niyetliyiz."
