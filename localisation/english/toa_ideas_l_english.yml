 BRA_liberated_by_communist_brazil:0 "[BRA.GetNameDefCap] Tarafından Kurtarıldı"
 BRA_liberated_by_communist_brazil_desc:0 "Ülkemiz nihayet sömürgecilerden haklı bağımsızlığını kazandı. [BRA.GetNameDef]'in yardımıyla tekrar özgür bir ülkeyiz. Eylemleri bize bu kadar açık bir şekilde yardımcı olurken, vaaz ettikleri komünist fikirler halkımız içinde kök salmaya başlıyor."
