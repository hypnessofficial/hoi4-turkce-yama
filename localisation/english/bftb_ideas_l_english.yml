 GRE_debt_to_the_ifc_2:0 "I.F.C.'ye Olan Borç"
 GRE_debt_to_the_ifc_2_desc:0 "Yunanistan, bir zamanlar etkili olan ancak şimdi sadece Birleşik Krallık, Fransa ve İtalya'nın başkanlık ettiği Uluslararası Mali Komisyon'a (I.F.C.) büyük ölçüde borçludur. I.F.C.'nin şişirilmiş durumuna rağmen, bağlı ülkeler hala Yunanistan'dan olan borçlarının tamamının ödenmesini arzu etmektedir - bu da borçlarımızı ödeyene veya başka bir yolla onlardan kurtulana kadar, I.F.C.'nin bizi avucunun içinde tuttuğu anlamına gelir."
