 GRE_martyrs_of_the_anatolian_catastrophe:0 "Anadolu Felaketinin Şehitleri"
 GRE_martyrs_of_the_anatolian_catastrophe_desc:0 "Sadece 1922'de Türklerle savaşırken hayatını kaybedenlere değil, aynı zamanda evlerinden zorla çıkarılıp burada sefalet içinde yaşamaya mecbur bırakılanlara da kendimizi adıyoruz. Bu, ancak tek bir yolla intikamı alınabilecek bir başarısızlıktı: Konstantinopolis'in fethi. Büyük bir devlet adamı bir zamanlar şöyle demişti: 'Konstantinopolis büyük başkenttir, Şehir'dir, tüm Yunanların rüyası ve umududur.' Biz, Yunan halkının ebedi rüyasını nihayet gerçekleştiren büyük liderler olarak hatırlanacağız ve bunu yaparken 1922 olaylarından kendimizi aklayacağız."
