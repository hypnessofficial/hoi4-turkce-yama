l_english:
 BUL_aircraft_repair_facilities:0 "Uçak Onarım Tesisleri"
 BUL_aircraft_repair_facilities_desc:0 "Terem Georgi Benkovski'nin uçak onarım tesislerini genişletme projesini geliştirdik, bu da hava kuvvetlerimizin uçaklarında en uygun bakım ve onarım görevlerini yerine getirmesine olanak tanıyor."
 BUL_anti_capitalism:0 "Anti-Kapitalizm"
 BUL_anti_capitalism_desc:0 "[GetAntiCapitalismFocusLoc]"
 BUL_anti_capitalism_tt:0 "§YAvrupa'daki büyük demokrasilere§! karşı saldırı bonusu: §G%10.0§!, §YAvrupa'daki büyük demokrasilere§! karşı savunma bonusu: §G%10.0§!"
 BUL_army_restrictions:0 "Ordu Kısıtlamaları"
 BUL_army_restrictions_desc:0 "Neuilly-sur-Seine Antlaşması'nın bir başka sonucu da ordumuza uygulanan ağır kısıtlamalardır; sadece zorunlu askerlik hizmetini yasaklamakla, kuvvetlerimizdeki asker ve subay miktarını sınırlamakla ve herhangi bir gelişmiş teçhizatı muhafaza etmemizi engellemekle kalmazlar, aynı zamanda herhangi bir askeri manevrayı veya sefer planlamasını da yasaklarlar ve hatta kullanabileceğimiz tüfek sayısını bile belirtirler."
 BUL_army_restrictions_mobilization_law_tt:0 "§RZorunlu askerlik yasasını artıramaz veya savaş ilan edemez.\nBirimleri eğitemez, dağıtamaz veya birim şablonlarını düzenleyemez.\nZırhlı, uçak veya gemi üretemez§!."
 BUL_back_from_the_scw_flag:0 "İspanya İç Savaşı'ndan döndü"
 BUL_balkan_federation_project_propaganda:0 "Balkan Federasyonu Propagandası"
 BUL_balkan_federation_project_propaganda_desc:0 "Yeni Bulgar projesi olan bir Balkan federasyonu için halk desteği, Bulgar hükümeti tarafından finanse edilen ülke çapındaki propaganda kampanyası sayesinde hızla yayılıyor."
 BUL_brannik:0 "Brannik"
 BUL_brannik_desc:0 "Bogdan Filov tarafından kurulan bu faşist yanlısı ulusal gençlik örgütü giderek kitleselleşiyor ve kuruluşundan bu yana bize askeri kuvvetlerimize katılmaya hevesli önemli sayıda üye sağladı."
 BUL_buhovo_uranium_mines:0 "Buhovo Uranyum Madenleri"
 BUL_buhovo_uranium_mines_desc:0 "Sofya yakınlarındaki bir Bulgar şehri olan Buhovo'da önemli uranyum yatakları bulundu. Madenlerimiz, yeni ve güçlü askeri silahların geliştirilmesi için hayati önem taşıdığı kanıtlanan bu değerli kaynağın çıkarılmasını gerçekleştiriyor."
 BUL_bulgarian_army_01:0 "Bulgar Ordusu"
 BUL_bulgarian_army_01_desc:0 "Tarihin bize acı bir şekilde öğrettiği gibi, potansiyel düşmanlarla çevriliyiz ve gelecekteki herhangi bir çatışmada galip gelmek istiyorsak güçlü bir ordu kurmamız ve modern taktikler geliştirmemiz çok önemlidir."
 BUL_bulgarian_capital_injection:0 "Bulgar Sermaye Enjeksiyonu"
 BUL_bulgarian_capital_injection_desc:0 "[BUL.GetAdjective] hükümeti, ülkemizin finansal sektörlerini istikrara kavuşturmak ve [ROOT.GetName]’ın ekonomisi üzerindeki kontrollerini artırmak için zor durumdaki [ROOT.GetAdjective] şirketlerine mali destek sağladı."
 BUL_bulgarian_patriarchate_restored:0 "Bulgar Patrikhanesi"
 BUL_bulgarian_patriarchate_restored_desc:0 "Sonunda Bulgar Ortodoks Kilisesi'nin onurunu restore ettik ve halk şimdi 1393'te Tırnovo'nun Osmanlı yönetimi altına girmesinden bu yana ilk Bulgar Patriği'nin seçilmesinden dolayı seviniyor."
 BUL_dar:0 "DAR"
 BUL_dar_desc:0 "Darzhavna Aeroplanna Rabotilnitsa - Devlet Uçak Atölyeleri"
 BUL_defender_of_the_balkans:0 "Balkanların Savunucusu"
 BUL_defender_of_the_balkans_desc:0 "Bulgar efendilerimiz, Balkanların savunmasına yardımcı olmak için yeni savunma sistemleri inşa etme ve askeri altyapımızı iyileştirme çabalarımızı yoğunlaştırmamızı emrediyor."
 BUL_defying_moscow:0 "Moskova'ya Meydan Okumak"
 BUL_defying_moscow_desc:0 "[GetDefyingMoscowFocusLoc]"
 BUL_dvf:0 "Darzhavna Voenna Fabrika"
 BUL_dvf_desc:0 "Darzhavna Voenna Fabrika - Devlet Askeri Fabrikası"
 BUL_dvf_sopot:0 "DVF - Sopot"
 BUL_dvf_sopot_desc:0 "Darzhavna Voenna Fabrika Sopot - Devlet Askeri Fabrikası Sopot"
 BUL_elites_crushed:0 "Elitler Ezildi"
 BUL_elites_crushed_desc:0 "Bulgar üst sınıflarının büyük ayrıcalıklarından birçoğunu ellerinden aldık, ama sonuç olarak önemli siyasi ve askeri pozisyonlarda çok sayıda düşman edindik. Bulgaristan'daki sosyal ilerlemeyi engellemekten başka bir şey yapmayan bu bireylerden kurtulmalıyız."
 BUL_fatherland_front_negative_desc:0 "Vatan Cephesi, başlangıçta komünist Bulgar İşçi Partisi tarafından kurulan bir siyasi direniş hareketidir, ancak şimdi Bulgaristan'daki Alman yanlısı askeri diktatörlüğe karşı birleşmiş, geniş ölçüde zıt ideolojilere sahip çok sayıda grup ve örgütü içermektedir."
 BUL_fatherland_front_positive:0 "Vatan Cephesi"
 BUL_fatherland_front_positive_desc:0 "Başlangıçta Bulgar İşçi Partisi tarafından Bulgaristan'daki baskı ve faşizmle yüzleşmek için bir siyasi direniş hareketi olarak kurulan Vatan Cephesi, şimdi Bulgar proletaryasını boyunduruk altına almak isteyenlere karşı birleşmiş çok sayıda örgütten üyelerden oluşmaktadır."
 BUL_ferdinands_puppet:0 "Çar Ferdinand'ın Kuklası"
 BUL_ferdinands_puppet_desc:0 "[ROOT.GetNameDef], [BUL.GetNameDef]'den Çar I. Ferdinand tarafından boyunduruk altına alındı; Ferdinand, [ROOT.GetAdjective] hükümeti üzerinde büyük bir nüfuz uygulayarak ülkenin siyasetini, ekonomisini ve sanayisini tam kontrolü altında tutuyor."
 BUL_foreign_industrial_concern_requirements_eng_tt:0 "Bulgaristan, §YYabancı Anlaşmalar§! kararları aracılığıyla en az [?BUL.BUL_industrial_investments_medium_cap|Y0] [ENG.GetAdjective] sivil fabrikası inşa etti."
 BUL_foreign_industrial_concern_requirements_ger_tt:0 "Bulgaristan, §YYabancı Anlaşmalar§! kararları aracılığıyla en az [?BUL.BUL_industrial_investments_medium_cap|Y0] [GER.GetAdjective] sivil fabrikası inşa etti."
 BUL_foreign_industrial_concern_requirements_sov_tt:0 "Bulgaristan, §YYabancı Anlaşmalar§! kararları aracılığıyla en az [?BUL.BUL_industrial_investments_medium_cap|Y0] [SOV.GetAdjective] sivil fabrikası inşa etti."
 BUL_foreign_industrial_concern_requirements_tt:0 "Bulgaristan, §YYabancı Anlaşmalar§! kararları aracılığıyla en az [?BUL.BUL_industrial_investments_medium_cap|Y0] [THIS.GetAdjective] sivil fabrikası inşa etti."
 BUL_foreign_industry_dynamic_modifier:0 "Yabancı Sanayi"
 BUL_foreign_industry_dynamic_modifier_desc:0 "Kendi başımıza güçlü ve verimli bir sanayi kurma imkanımız yok, bu yüzden en iyi seçeneğimiz, işlerini genişletmeye ve Bulgaristan'da faaliyet göstermeye istekli yabancı yatırımcılara başvurmaktır."
 BUL_government_reforms_communists_01:0 "Hükümet Reformları"
 BUL_government_reforms_communists_01_desc:0 "Hükümetin tarım ve sanayi konularında uyguladığı reformlar, şüphesiz Bulgar ulusunun gelişimi ve ilerlemesi için gereklidir."
 BUL_imro_01:0 "IMRO"
 BUL_imro_01_desc:0 "İç Makedon Devrimci Örgütü tarafından işlenen sürekli kardeş katli suçları, uluslararası ilişkilerimizi ciddi şekilde zedeledi ve 1934'te Petrich'teki IMRO kalesinin askeri olarak bastırılmasına yol açarak örgüte kritik bir darbe vurdu ve liderlerinin çoğunu yurtdışına kaçmaya zorladı. Ancak, bazı devrimci hücreler hala Bulgaristan'da aktif ve diplomatik ilişkilerimizin çoğu kötü bir durumda."
 BUL_imro_02:0 "IMRO"
 BUL_imro_02_desc:0 "İç Makedon Devrimci Örgütü tarafından işlenen sürekli kardeş katli suçları, uluslararası ilişkilerimizi çok uzun süredir ciddi şekilde zedeledi, ama en azından şimdi yabancı güçler nihayet Balkanlar'da barışı korumak adına örgütü yok etme çabalarımızı kabul ediyor."
 BUL_imro_04:0 "IMRO"
 BUL_imro_04_desc:0 "İç Makedon Devrimci Örgütü ile işbirliğimiz sadece komşularımız tarafından değil, aynı zamanda çok sayıda yabancı güç ve hatta nüfusumuzun bazı kesimleri tarafından da geniş çapta eleştirildi."
 BUL_international_pilot_training_program:0 "Uluslararası Pilot Eğitim Programı"
 BUL_international_pilot_training_program_desc:0 "Hava kuvvetlerimiz için yetenekli pilot ve mürettebat havuzumuzu önemli ölçüde artıran devam eden bir uluslararası pilot eğitim programımız var."
 BUL_ira:0 "IRA"
 BUL_liberal_trade_policies:0 "Liberal Ticaret Politikaları"
 BUL_liberal_trade_policies_desc:0 "Bulgar ekonomisi, Osmanlı İmparatorluğu'ndan bağımsızlığından bu yana bir krizden diğerine savruluyor. Otarşik politikaların geçmişte yetersiz olduğu kanıtlandı, bu yüzden ekonomik serbestleşmeye doğru ilerleme zamanı."
 BUL_national_industrial_concern_upgrade_tt:0 "\n§YAzami Optimizasyon§! odağını tamamlamak bu tasarımcıyı yükseltecektir."
 BUL_national_industry_01:0 "Ulusal Sanayi"
 BUL_national_industry_01_desc:0 "Sanayi imalatımıza sağlamak için modern aletler edindik, belki sadece küçük bir adım, ama güçlü bir ulusal sanayi geliştirme yolunda gerekli bir adım."
 BUL_national_industry_02:0 "Ulusal Sanayi"
 BUL_national_industry_02_desc:0 "Ulusal sanayi geliştirme projemiz maliyetli oldu, ama aynı zamanda önemli ölçüde başarılı oldu, çünkü birkaç yeni sanayinin kurulmasına ve mevcut olanlardan bazılarının modernizasyonuna olanak sağladı."
 BUL_national_military_designer_upgrade_tt:0 "\n§YBalkanların Prusyası§! odağını tamamlamak bu tasarımcıyı yükseltecektir.\n"
 BUL_national_naval_designer_upgrade_tt:0 "\n§YBir Ege Denizi Filosu§! odağını tamamlamak bu tasarımcıyı yükseltecektir.\n"
 BUL_nationalized_industry:0 "Millileştirilmiş Sanayi"
 BUL_nationalized_industry_desc:0 "Bulgaristan'daki her yabancı fabrikayı kamulaştırdık, sanayi üretim kapasitemizi önemli ölçüde artırdık."
 BUL_our_duty_in_the_balkans_dynamic_modifier:0 "Balkanlar'daki Görevimiz"
 BUL_paramilitary_organizations:0 "Paramiliter Örgütler"
 BUL_paramilitary_organizations_desc:0 "Paramiliter örgütlerin üyeleri, zaten bir tür askeri disipline sahip sadık bireylerdir ve ülkemizin daha büyük zaferi için savaşmaya hazır olacaklardır. Davamıza olan sadakatlerini kazandığımızdan beri, güvenilir bir insan gücü kaynağı olduklarını kanıtladılar."
 BUL_petrol_ad:0 "Petrol AD"
 BUL_pirin:0 "Pirin"
 BUL_prussia_of_the_balkans_01:0 "Balkanların Prusyası"
 BUL_prussia_of_the_balkans_01_desc:0 "İlk yıllarında, Bulgaristan Çarlığı, büyük ve iyi donanımlı bir orduya sahip, ağır bir şekilde askerileştirilmiş bir devletti ve Balkanların Prusyası olarak tanımlanıyordu, ta ki eski, hain müttefikleri tarafından ihanete uğrayana kadar. Ancak, geçmişin aşağılayıcı yenilgilerinden sonra ülkemizi yeniden inşa ettik ve şimdi Bulgaristan'ın eski ihtişamını geri kazanma zamanı geldi. Dünya bizi bir kez daha Balkanların Prusyası olarak adlandıracak!"
 BUL_ratniks:0 "Ratnikler"
 BUL_ratniks_desc:0 "[GetIntegrateTheRatniksFocusLoc]"
 BUL_second_national_catastrophe:0 "İkinci Ulusal Felaket"
 BUL_second_national_catastrophe_desc:0 "Büyük Savaş'taki yenilgimizin ardından, Neuilly-sur-Seine Antlaşması bizi şimdi Yugoslavya, Yunanistan ve Romanya'ya ait olan geniş toprakları terk etmeye zorladı ve yakın zamana kadar Milletler Cemiyeti, ekonomimizi sakatlayan ve kaçınılmaz olarak ülkemizin borcunu artıran büyük miktarda savaş tazminatının ödenmesini önceliklendirmemizi gerektirdi. Ulusal ruh bu darbeden asla tam olarak kurtulamadı, bu yüzden bu antlaşmanın Bulgaristan'da halk arasında İkinci Ulusal Felaket olarak bilinmesi şaşırtıcı değil..."
 BUL_second_national_catastrophe_tt:0 "Büyük Bulgaristan restore edilirse kaldırılacak:\nŞunların tam kontrolüne sahip: §YSofya§!, §YFilibe§!, §YMoesia§!, §YBurgaz§!, §YGüney Sırbistan§!, §YMakedonya§!, §YOrta Makedonya§!, §YTrakya§!, §YDobruca§!, §YKuzey Dobruca§!."
 BUL_the_balkans_united:0 "Balkanlar Birleşti"
 BUL_the_balkans_united_desc:0 "[GetUnitedWeShallPrevailFocusLoc]"
 BUL_the_bulgarian_threat:0 "Bulgar Tehdidi"
 BUL_the_bulgarian_threat_desc:0 "[BUL.GetNameDef]'in Balkanlar'daki iddialı özlemleri, [ROOT.GetNameDef]'in bütünlüğüne ve [ROOT.GetAdjective] halkının özgürlüğüne önemli bir tehdit oluşturuyor."
 BUL_the_fight_against_bolshevism:0 "Bolşevizme Karşı Savaş"
 BUL_the_fight_against_bolshevism_desc:0 "[GetObliterateTheBolshevikThreatFocusLoc]"
 BUL_the_fight_against_bolshevism_ns_target_tt:0 "§YAvrupa'daki büyük komünist ülkelere§! karşı saldırı bonusu: §G%10.0§!, §YAvrupa'daki büyük komünist ülkelere§! karşı savunma bonusu: §G%10.0§!"
 BUL_the_fight_against_tyranny:0 "Zorbalığa Karşı Savaş"
 BUL_the_fight_against_tyranny_desc:0 "[GetFightTyrannyFocusLoc]"
 BUL_third_bulgarian_state:0 "Üçüncü Bulgar Devleti"
 BUL_third_bulgarian_state_desc:0 "[GetConsolidateTheThirdBulgarianStateFocusLoc]"
 BUL_tobacco_exports:0 "Tütün İhracatı"
 BUL_tobacco_exports_desc:0 "Tahıl üretimimizi aktif olarak daha değerli tütün ürünleriyle değiştiriyoruz, bu da bize önemli bir gelir sağlıyor."
 BUL_toppling_giants_ns_target_tt:0 "Bulgaristan'a komşu büyük Avrupa ülkelerine karşı saldırı bonusu: §G%10.0§!, Bulgaristan'a komşu büyük Avrupa ülkelerine karşı savunma bonusu: §G%10.0§!"
 BUL_trained_youth_wings:0 "Eğitilmiş Gençlik Kolları"
 BUL_trained_youth_wings_desc:0 "[GetTrainTheYouthWingsFocusLoc]"
 BUL_tsar_boris_negative_01:0 "Çar III. Boris"
 BUL_tsar_boris_negative_01_desc:0 "III. Boris, diktatörlük rejiminin sona erdiğini biliyor ve şaşırtıcı olmayan bir şekilde, bakanlarımızın önerdiği herhangi bir değişikliği kabul etmeyi reddediyor, hükümetteki sadık üyelere başvurarak tüm tekliflerimizi raydan çıkarmaya ve Bulgar siyasetinin kontrolünü elinden geldiğince uzun süre elinde tutmaya çalışıyor."
 BUL_tsar_boris_positive_01:0 "Çar III. Boris"
 BUL_tsar_boris_positive_01_desc:0 "Boris'in politikaları Bulgaristan için çok faydalı oldu ve bu nedenle Çar sadece elitler ve en ayrıcalıklı çevreler içinde değil, aynı zamanda en mütevazı sınıflar arasında da çok iyi bir halk görüşüne sahip."
 BUL_uranium_concession_agreement_ns:0 "Uranyum İmtiyaz Anlaşmaları"
 BUL_uranium_concession_agreement_ns_desc:0 "Toprağımızdaki uranyum yataklarından en iyi şekilde yararlanamıyoruz ve sadece bizim için değil, aynı zamanda [FROM.GetAdjective] müttefiklerimiz için de, yerli sanayimiz ve tarımımız için faydalı malzemeler ve ürünler karşılığında onlara işletme hakları tanıyan bir sözleşme imzalamak daha faydalı olacaktır."
 BUL_varna_naval_dockyard:0 "Varna Deniz Tersanesi"
 BUL_volunteers_in_spain_nationalist:0 "İspanya'daki Gönüllüler"
 BUL_volunteers_in_spain_nationalist_desc:0 "[GetSupportTheSpanishCoupFocusLoc]"
 BUL_volunteers_in_spain_republican:0 "İspanya'daki Gönüllüler"
 BUL_volunteers_in_spain_republican_desc:0 "[GetSpanishStruggleFocusLoc]"
 BUL_vulkan_cement:0 "Vulkan Cement"
 BUL_worker_strikes:0 "İşçi Grevleri"
 BUL_worker_strikes_desc:0 "Geniş sosyalistler, sanayi işçileri arasında ulusal grevleri ateşleme çabalarında komünistlere katıldılar, üretimimizi ciddi şekilde engelliyorlar ve onlarla yetkililer arasında çatışmalara neden oluyorlar."
 BUL_zveno_ns:0 "Zveno"
 BUL_zveno_ns_desc:0 "Askeri Birliğin feshedilmesi gerekli bir meseleydi, ama sonuçları oldu: nihayet komuta zincirini engellemekten başka bir şey yapmayan birkaç Zveno bireyinden kurtulduk, ama aynı zamanda askeri akademilerimizde değerli eğitmenler ve deneyimli subaylar kaybettik."
 GRE_COOPERATIVE_FOREIGN_MONOPOLIES_FOCUS_NAME_COMMUNIST:0 "Millileştirilmiş Yabancı Monopoller"
 GRE_COOPERATIVE_FOREIGN_MONOPOLIES_FOCUS_NAME_STANDARD:0 "İşbirlikçi Yabancı Monopoller"
 GRE_DEFENSIVE_FORT_SPIRIT_METAXAS:0 "Metaksas Hattını Modernize Etmek"
 GRE_DEFENSIVE_FORT_SPIRIT_STANDARD:0 "Leonidas Hattını Modernize Etmek"
 GRE_PROTECTORS_MEDITERRANEAN_SPIRIT_NAME_MONARCHIST:0 "Akdeniz'in Şampiyonları"
 GRE_PROTECTORS_MEDITERRANEAN_SPIRIT_NAME_STANDARD:0 "Akdeniz'in Savunucuları"
 GRE_aekkea:0 "AEKKEA"
 GRE_aete:0 "AETE"
 GRE_agrarian_society:0 "Tarım Toplumu"
 GRE_agrarian_society_desc:0 "Yunanistan geleneksel olarak tarıma ve hafif sanayiye dayanmıştır ve tütün gibi ticari ürünler Yunanistan'ın birincil ihracatıdır. Daha geleneksel imalat biçimlerine olan bağımlılığımız, inşaat projeleri için daha büyük güçlerin ağır sanayisine bağımlı hale gelmemize neden oldu. Çatışma yaklaşıyor ve yenilik yapmamız gerekiyor - hem de hızlı."
 GRE_agricultural_communes_idea:0 "Kolektifleştirilmiş Tarım"
 GRE_agricultural_communes_idea_desc:0 "Yunanistan geleneksel olarak tarıma ve hafif sanayiye dayanmıştır ve tütün gibi ticari ürünler Yunanistan'ın birincil ihracatıdır. Daha geleneksel imalat biçimlerine olan bağımlılığımız, inşaat projeleri için daha büyük güçlerin ağır sanayisine bağımlı hale gelmemize neden oluyordu, ancak tüm çiftliklerin bir kolektifleştirme planı altında organize edilmesiyle, gelecekteki ve daha iddialı projelere daha iyi hazırlanabiliriz."
 GRE_alexandros_papagos:0 "Aleksandros Papagos"
 GRE_alexandros_papagos_theorist:0 "Aleksandros Papagos"
 GRE_ancient_talents:0 "Antik Yetenekler"
 GRE_ancient_talents_desc:0 "Tunç Çağı günlerinden beri denizciliğe her zaman bir yatkınlığımız olmuştur. Güçlü bir denizcilik geleneğini teşvik ederek, kanımızda akan zamanla onurlandırılmış bir geleneğe saygı gösteriyoruz."
 GRE_aristeidis_dimitratos:0 "Aristeidis Dimitratos"
 GRE_aristotle_onassis:0 "Aristoteles Onassis"
 GRE_astilleros_onassis:0 "Astilleros Onassis"
 GRE_basileiades:0 "Basileiades"
 GRE_battle_for_the_bosporus:0 "Boğaziçi Muharebesi"
 GRE_battle_for_the_bosporus_desc:0 "Boğaziçi Muharebesi başladı ve avantaj bizde! Zaferin kesinleşmesi için elimizden geldiğince sert bastırmalıyız!"
 GRE_befriending_faction:0 "Siyasi Uvertürler Yapmak"
 GRE_biamax:0 "Biamax"
 GRE_booming_tourism:0 "Canlanan Turizm Endüstrisi"
 GRE_booming_tourism_desc:0 "Yurtdışından [ROOT.GetNameDef]'e, kayıtlı tarihin herhangi bir noktasından daha fazla insan geliyor!"
 GRE_byzantine_army:0 "Bizans Ordusu"
 GRE_byzantine_army_desc:0 "Çok da uzun olmayan bir zaman önce sınırlarımızı koruyup savunabilecek bir orduya sahip olma takıntımız vardı, ama bugün bir imparatorluğu geri alma teklifimizi yerine getirmek için dünyanın yarısını yürümeye hazır askerler donatıp eğitiyoruz. Bizimki dünyadaki hiçbir orduya benzemez ve onunla nihayet bizden alınanı geri alacağız."
 GRE_command_economy:0 "Komuta Ekonomisi"
 GRE_command_economy_desc:0 "Savaş makineleri çağında yaşıyoruz ve Yunan işçilerinin çoğunluğunun hayatlarını işe yaramaz lüks ürünlerin tarlalarında çalışarak geçirmesine artık tahammül edilemez. Yunanistan'ı ve Yunan halkını temelden yeniden şekillendirecek bir geçiş başlattık ve devlet tarafından yönetilen bir ekonomi aracılığıyla Yunan halkını doğru yöne yönlendireceğiz."
 GRE_communist_protests:0 "Komünist Protestoları"
