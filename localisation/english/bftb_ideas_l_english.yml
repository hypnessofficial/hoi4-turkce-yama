 GRE_stylianos_gonatas:0 "Stylianos Gonatas"
 GRE_venerate_the_ancient_hellenes_2:0 "Antik Helenlere Hürmet Et"
 GRE_venerate_the_ancient_hellenes_2_desc:0 "Sparta hegemonyasını güç ve bilgelikle deviren Tebalı savaşçıların yaratıcılığından öğreneceğiz."
 GRE_venerate_the_ancient_hellenes_3:0 "Antik Helenlere Hürmet Et"
 GRE_venerate_the_ancient_hellenes_3_desc:0 "Bugün bildiğimiz demokrasi kavramını tasarlayan Atina filozoflarından öğreneceğiz."
 GRE_venerate_the_ancient_hellenes_4:0 "Antik Helenlere Hürmet Et"
 GRE_venerate_the_ancient_hellenes_4_desc:0 "Bilinen dünyanın yarısını mütevazı Makedonya'dan fetheden Argeadların örneğinden öğreneceğiz."
 GRE_venerate_the_ancient_hellenes_5:0 "Antik Helenlere Hürmet Et"
 GRE_venerate_the_ancient_hellenes_5_desc:0 "Sparta hegemonyasını deviren Tebalı savaşçıların yaratıcılığından ve bugün bildiğimiz demokrasi kavramını tasarlayan Atina filozoflarından öğreneceğiz."
 GRE_venerate_the_ancient_hellenes_6:0 "Antik Helenlere Hürmet Et"
 GRE_venerate_the_ancient_hellenes_6_desc:0 "Sparta hegemonyasını deviren Tebalı savaşçıların yaratıcılığından ve bilinen dünyanın yarısını mütevazı Makedonya'dan fetheden Argeadların örneğinden öğreneceğiz."
 GRE_venerate_the_ancient_hellenes_7:0 "Antik Helenlere Hürmet Et"
 GRE_venerate_the_ancient_hellenes_7_desc:0 "Bugün bildiğimiz demokrasi kavramını tasarlayan Atina filozoflarından ve bilinen dünyanın yarısını mütevazı Makedonya'dan fetheden Argeadların örneğinden öğreneceğiz."
 GRE_venerate_the_ancient_hellenes_8:0 "Antik Helenlere Hürmet Et"
 GRE_venerate_the_ancient_hellenes_8_desc:0 "Atalarımızı bu kadar büyük yapan tüm nitelikleri hala koruyoruz ve sadece küçük bir itişle bu nitelikleri halkımızda tekrar ortaya çıkarabiliriz."
 GRE_venerate_the_ancient_hellenes_spirit:0 "Antik Helenlere Hürmet Et"
 GRE_venerate_the_ancient_hellenes_spirit_desc:0 "Bizler eski saygıdeğer Helenlerin torunları değil miyiz? Polemikte, felsefede ve savaşta o ustalarla kan bağımız yok mu? Halkımıza tekrar güçlü bir gurur duygusu aşılayacağız, böylece Avrupa'nın yol gösterici yıldızı olarak yerimizi tekrar alabiliriz."
 GRE_vickers_armstrong:0 "Vickers-Armstrong"
 GRE_xenophon_giosmas:0 "Xenophon Giosmas"
 TUR_a_monopoly_has_been_formed_tt:0 "§YKoç Ticaret§!'e [ROOT.GetNameDef]'nin gelişmekte olan sanayi tabanı üzerinde bir tekel verildi."
 TUR_absolutism:0 "Mutlakiyetçilik"
 TUR_absolutism_desc:0 "Bastığınız toprağı sadece toprak olarak görmeyin, tanıyın! Ve altınızda soylu bir şekilde yatan kefensiz binlerce insanı düşünün. Sen bir şehidin şanlı oğlusun; utan, atalarını üzme! Size dünyalar vaat edilmiş olsa bile bu cennet vatanı elinizden bırakmayın."
 TUR_adnan_menderes:0 "Adnan Menderes"
 TUR_ahmet_ali_celikten:0 "Ahmet Ali Çelikten"
 TUR_ali_ihsan_sabis:0 "Ali İhsan Sâbis"
 TUR_arctic_wolves_training:0 "Arktik Kurtlar Eğitimi"
 TUR_arctic_wolves_training_desc:0 "Askerlerimiz, kuzey ormanlarında av peşindeki kurtlar gibi karda gezinecekler. Eğitimimiz sayesinde, düşman buzlu rüzgarlarda soğuktan daha fazlasından korkmaya başlayacak."
 TUR_balkan_defense_council_spirit:0 "Balkan Savunma Konseyi"
 TUR_balkan_defense_council_spirit_desc:0 "Balkan Antantı'nın her üyesinden gelen heyetler, dünyadaki olaylar hakkında anekdotlar ve kendi savunma durumları hakkındaki güncellemeleri paylaşmak için düzenli olarak toplanır. Ortak askeri bilgi havuzumuz hepimiz için büyük bir nimettir."
 TUR_balkan_pact_innovative_transport_techniques:0 "Balkan Çapında Yenilikçi Ulaşım Teknikleri"
 TUR_balkan_pact_innovative_transport_techniques_desc:0 "Ordularımızın birçok sınırımız arasında kolay taşınmasını daha iyi koordine etmek ve kolaylaştırmak için, bir uluslar topluluğu olarak altyapımızı iyileştirmeliyiz. Bu girişim, umarım bu engeli hafifletmede bir miktar yol kat edecektir."
 TUR_can_only_have_one_prime_minister_tt:0 "Hükümetin sadece bir §YBaşbakanı§! olabilir."
 TUR_cannot_form_kurdish_collaboration_government_tt:0 "§Y[TUR.GetNameDef]§! asla bir Kürt İşbirliği Hükümeti kuramaz."
 TUR_celal_bayar:0 "Celâl Bayar"
 TUR_cemil_cahit_toydemir:0 "Cemil Cahit Toydemir"
 TUR_central_balkan_bank:0 "Balkan Merkez Bankası"
 TUR_central_balkan_bank_desc:0 "Balkan Merkez Bankası, Balkan Paktı'ndaki tüm uluslar için malzeme, emtia ve ticaretle ilgili konuların serbest akışı için bir forum olacaktır. İzmir, zamanla Frankfurt, Şanghay ve New York gibi iş ve ticaret merkezleriyle rekabet edecektir."
 TUR_central_balkan_bank_wealthy_greece:0 "Atina Merkez Balkan Bankası"
 TUR_central_balkan_bank_wealthy_greece_desc:0 "Hiç kimse, tüm ülkeler arasında [GRE.GetNameDef]'nın mali işlerini bu kadar kusursuz bir şekle sokan ilk ülke olacağını tahmin edemezdi. [GRE.GetAdjective]'nın mali yönetimdeki mükemmelliği ışığında, Balkan Merkez Bankası'nın Selanik'te kurulması oybirliğiyle kabul edildi."
 TUR_construct_a_red_navy:0 "Kızıl Bir Donanma"
 TUR_construct_a_red_navy_desc:0 "Güçlü bir donanma desteği olmadan, küresel bir devrim yayma girişimleri başarısızlığa mahkumdur."
 TUR_debt_council:0 "Borçlar Konseyi"
 TUR_debt_council_desc:0 "Osmanlı İmparatorluğu nihayet tarih kitaplarına gömüldüğünde, bize bir veda hediyesi bıraktı: devasa borcu. Batılı güçlere büyük miktarda para ve varlık borçluyuz, ama en aşağılayıcı olanı, borcumuzun ülkemizde bile yönetilmemesidir. Borçlar Konseyi, tüm sonsuz bilgeliğiyle Fransa'da toplanıyor."
 TUR_debt_council_has_no_sway_tt:0 "§YBorçlar Konseyi§!'nin [ROOT.GetAdjective] ekonomik işleri üzerinde hiçbir etkisi yoktur."
 TUR_debt_council_reined_in_flag:0 "Yabancı Borçlar Konseyi ulusal bir kuruma dönüştürüldü"
 TUR_disorganised_armed_forces:0 "Düzensiz Silahlı Kuvvetler"
 TUR_disorganised_armed_forces_1:0 "Düzensiz Silahlı Kuvvetler"
 TUR_disorganised_armed_forces_10:0 "Düzensiz Silahlı Kuvvetler"
 TUR_disorganised_armed_forces_10_desc:0 "Türk Silahlı Kuvvetleri, tıpkı Türkiye'nin kendisi gibi gençtir. Ordularımız Kurtuluş Savaşı'ndan İtilaf Devletleri ve Osmanlılara karşı galip çıksa da, ulusumuz özgürlüğün bedelini kanla ödedi. Büyük Savaş'ta nüfusumuzun neredeyse dörtte birini kaybettikten sonra savaşa pek heves kalmadı, ancak savaş hayaleti bir kez daha dünyanın üzerine çökerken, görünüşe göre ya kuvvetlerimizi hızla modernize etmek ya da savaşın sınırlarımıza asla ulaşmamasını sağlamaktan başka seçeneğimiz olmayacak."
 TUR_disorganised_armed_forces_11:0 "Düzensiz Silahlı Kuvvetler"
 TUR_disorganised_armed_forces_11_desc:0 "Türk Silahlı Kuvvetleri, tıpkı Türkiye'nin kendisi gibi gençtir. Ordularımız Kurtuluş Savaşı'ndan İtilaf Devletleri ve Osmanlılara karşı galip çıksa da, ulusumuz özgürlüğün bedelini kanla ödedi. Büyük Savaş'ta nüfusumuzun neredeyse dörtte birini kaybettikten sonra savaşa pek heves kalmadı, ancak savaş hayaleti bir kez daha dünyanın üzerine çökerken, görünüşe göre ya kuvvetlerimizi hızla modernize etmek ya da savaşın sınırlarımıza asla ulaşmamasını sağlamaktan başka seçeneğimiz olmayacak."
 TUR_disorganised_armed_forces_12:0 "Düzensiz Silahlı Kuvvetler"
 TUR_disorganised_armed_forces_12_desc:0 "Türk Silahlı Kuvvetleri, tıpkı Türkiye'nin kendisi gibi gençtir. Ordularımız Kurtuluş Savaşı'ndan İtilaf Devletleri ve Osmanlılara karşı galip çıksa da, ulusumuz özgürlüğün bedelini kanla ödedi. Büyük Savaş'ta nüfusumuzun neredeyse dörtte birini kaybettikten sonra savaşa pek heves kalmadı, ancak savaş hayaleti bir kez daha dünyanın üzerine çökerken, görünüşe göre ya kuvvetlerimizi hızla modernize etmek ya da savaşın sınırlarımıza asla ulaşmamasını sağlamaktan başka seçeneğimiz olmayacak."
