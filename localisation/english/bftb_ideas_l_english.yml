 kemalist_neutrality_idea_desc:0 "Yurtta Sulh, Cihanda Sulh - Atatürk bunu emretti ve biz şimdi bunu dış politikamızın temeli olarak kodladık. Barışı korumalıyız ve eğer dünyada barış sağlayamazsak, o zaman sadece yurtta barışla yetinmek zorunda kalacağız."
