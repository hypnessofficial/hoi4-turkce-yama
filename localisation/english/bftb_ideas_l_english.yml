 TUR_elyesa_bazna:0 "Elyesa Bazna"
 TUR_emergency_deployment_of_defensive_bases:0 "Acil Savunma Üsleri Konuşlandırması"
 TUR_emergency_deployment_of_defensive_bases_desc:0 "Ulusumuzun savunma üsleri feci şekilde modası geçmiş ve modern bir savaşta sonuçta değersiz olurdu. Savunmalarımızı modernize etmek ve olası işgalcileri caydırmak için büyük bir ulusal çaba göstermeliyiz."
 TUR_emergency_fortification_directive:0 "Acil Tahkimat Direktifi"
 TUR_emergency_fortification_directive_desc:0 "Zor zamanlar zorlu önlemler gerektirir ve biz de hızla tahkimat inşa etmek için kaynak ayırmak zorunda kaldık. Varlığımız tehlikede olabilir."
 TUR_etatism:0 "Devletçilik"
 TUR_etatism_2:0 "Devletçilik"
 TUR_etatism_2_desc:0 "Karma ekonomimiz dünyadaki hiçbirine benzemez: İngiliz liberalizmi, İtalyan korporatizmi ve Sovyet merkezi planlamasının unsurlarını barındırır. Bu, ekonomik modellerin nihai sentezi ve Kemalist sistemin taç mücevheridir, ancak aynı anda bir savaş ekonomisini sürdürmeye çalışarak üzerine çok fazla baskı yapmadığımızdan emin olmalıyız. \n\n§REkonomi yasamızı ilerletirsek, uyumsuz ekonomik modellerimiz arasında ek sürtünme gelişmesine hazırlıklı olmalıyız.§!"
 TUR_etatism_3:0 "Devletçilik"
 TUR_etatism_3_desc:0 "Karma ekonomimiz dünyadaki hiçbirine benzemez: İngiliz liberalizmi, İtalyan korporatizmi ve Sovyet merkezi planlamasının unsurlarını barındırır. Bu, ekonomik modellerin nihai sentezi ve Kemalist sistemin taç mücevheriydi, ancak aynı anda bir savaş ekonomisini sürdürmeye çalışarak onu zorladık. Beklentilerimizi yeniden gözden geçirmemiz ve Devletçilik deneyini sona erdirmemiz gerekebilir. \n\n§REkonomi yasamızı ilerletirsek, uyumsuz ekonomik modellerimiz arasında ek sürtünme gelişmesine hazırlıklı olmalıyız.§!"
 TUR_etatism_4:0 "Devletçilik"
 TUR_etatism_4_desc:0 "Karma ekonomimiz dünyadaki hiçbirine benzemiyordu: İngiliz liberalizmi, İtalyan korporatizmi ve Sovyet merkezi planlamasının unsurlarından oluşuyordu. Pervasız ve açgözlü davrandık ve bir savaş ekonomisi yürütürken Devletçi modelimizi korumaya çalışarak ülkemizin ekonomisini yok etme riskiyle karşı karşıyayız. Hiçbir şey için her şeyi riske atıyoruz: Çok geç olmadan Devletçiliği kaldırmalıyız. \n\n§REğer Devletçiliği kaldırmadan ekonomi yasamızı tekrar ilerletirsek, bir buhranı tetikleriz!§!"
 TUR_etatism_desc:0 "Karma ekonomimiz dünyadaki hiçbirine benzemez: İngiliz liberalizmi, İtalyan korporatizmi ve Sovyet merkezi planlamasının unsurlarını barındırır. Bu, ekonomik modellerin nihai sentezi ve Kemalist sistemin taç mücevheridir. \n\n§REkonomi yasamızı ilerletirsek, uyumsuz ekonomik modellerimiz arasında sürtünme gelişmesine hazırlıklı olmalıyız.§!"
 TUR_etatism_stabilisation:0 "Devletçi İstikrarı"
 TUR_etatism_stabilisation_desc:0 "Karma bir ekonominin güzelliği, ihtiyaç ortaya çıktığında acil durum önlemleri uygulama kapasitesine ve gücüne sahip olmamızdır ve tam olarak bunu yaptık. Bir sonraki ekonomik değişimden önce zaman kazandık, ama bu sonsuza kadar sürmeyecek. Zamanımızı dikkatli kullanmalıyız."
 TUR_fahrettin_altay:0 "Fahrettin Altay"
 TUR_fakhri_pasha:0 "Fahri Paşa"
 TUR_fethi_okyar:0 "Fethi Okyar"
 TUR_fevzi_cakmak_command:0 "Fevzi Çakmak"
 TUR_financing_private_enterprise:0 "Özel Girişimi Finanse Etmek"
 TUR_financing_private_enterprise_desc:0 "Devletin amacı, halkımızın en girişimci olanlarına teşvik ve ödül sağlamaktır. Ulusumuzu daha iyi hale getireceklere yatırım yaparak, ülkemizin geleceğine yatırım yapmış oluruz."
 TUR_first_five_year_plan:0 "Birinci Beş Yıllık Sanayi Planı"
 TUR_first_five_year_plan_desc:0 "[SOV.GetAdjective] Beş Yıllık Planları model alınarak ve hem [SOV.GetAdjective] hem de [USA.GetAdjective] uzmanlarının rehberliğinde hazırlanan birinci beş yıllık planımız 17 Nisan 1934'te yürürlüğe girdi. Bu plan aracılığıyla, ikinci plan uygulanana kadar 20 yeni fabrika inşa etmeyi hedefliyoruz."
 TUR_fundamentalism:0 "Aşırı Muhafazakarlık"
 TUR_fundamentalism_desc:0 "Ruhumun senden, İlâhî, şudur ancak emeli: Değmesin ma’bedimin göğsüne nâ-mahrem eli!"
 TUR_funkplan:0 "Funkplan"
 TUR_funkplan_desc:0 "Hjalmar Schacht'ın Schachtplan'ından modellenen Walther Funk'ın Funkplan'ı, Almanların [TUR.GetAdjective] mineral cevherlerine erişimini garanti ederken, aynı zamanda [TUR.GetAdjective]'nin Alman ticari ürünleri pazarına erişimini kolaylaştırır. Funkplan'daki gizli maddeler ayrıca, ağır sanayimizi büyütmemize yardımcı olmak için gereken asgari malzeme miktarını da garanti eder."
 TUR_german_advisors:0 "Alman Danışmanlar"
 TUR_german_advisors_desc:0 "Resmi olarak büyükelçiler ve iş danışmanları olarak hareket eden, şimdi ordumuzu modernize etmemize ve onu olabildiğince etkili bir savaş gücü haline getirmemize yardımcı olmaya hazır önemli bir grup Alman subayını ağırlıyoruz."
 TUR_golden_age_of_the_wolf:0 "Kurdun Altın Çağı"
 TUR_golden_age_of_the_wolf_desc:0 "Alman ve [TUR.GetAdjective] kurtları Avrupa'ya hükmediyor. Düşmanlarımız tavşanlardır ve kaçabilseler de saklanabilseler de, büyük ve kudretli çenelerimizden birine yakalanmaları kaçınılmazdır!"
 TUR_halide_edib_adivar:0 "Halide Edip Adıvar"
 TUR_halil_kut:0 "Halil Kut"
 TUR_has_a_prime_minister_tt:0 "§Y[TUR.GetNameDef]§!'nin bir Başbakanı var."
 TUR_hasan_saka:0 "Hasan Saka"
 TUR_hilmi_uran:0 "Hilmi Uran"
 TUR_inanc_vergisi_spirit:0 "İnanç Vergisi"
 TUR_inanc_vergisi_spirit_desc:0 "'İnanç Vergisi', Kemalist laik doktrinin nihai sonucudur; birçoğunun devlet ateizmine doğru büyük bir adım olarak göreceği agresif bir hamledir. Maalesef, bu olamayacak bir rüyadır - ve gelecekte vergiyi yürürlükten kaldırmayı düşünmek zorunda kalacağız."
 TUR_infrastructure_privatised_idea:0 "Özelleştirilmiş Altyapı"
 TUR_infrastructure_privatised_idea_desc:0 "Devletimizin altyapısı üzerinde özel çıkarlara bir miktar kontrol vermek, başka yerlere tahsis etmek için bize daha fazla kaynak sağlıyor, ancak ek altyapı inşa etmeyi şimdilik sinir bozucu derecede kademeli bir iş haline getiriyor."
 TUR_integrated_german_officers:0 "Entegre Alman Subayları"
 TUR_integrated_german_officers_desc:0 "Ülkemizdeki Alman askeri yetkililerin rolünü artık gizlemeye gerek kalmadığından, onları [GER.GetLeader]'in açık rızasıyla resmi olarak komuta zincirimize entegre ettik."
 TUR_inventive_genius_electronics_modifier_tt:0 "$electronics$ Araştırma Hızı: §G+%10§!"
 TUR_inventive_genius_hidden_idea:0 "$TUR_kamil_tolon$"
 TUR_investment_financing_spirit:0 "Yatırımı Finanse Etmek"
 TUR_investment_financing_spirit_desc:0 "Dünya, ihtiyaçların karşılanması için malların değişimi etrafında döner. Kesinlikle ihtiyacımız var, ama sırtımızın kaşınması için önce bizim de biraz sırt kaşımamız gerekiyor."
 TUR_ismet_inonu:0 "İsmet İnönü"
 TUR_italo_turkish_merchant_fleet:0 "İtalyan-[TUR.GetAdjective] Ticaret Filosu"
 TUR_italo_turkish_merchant_fleet_desc:0 "[ENG.GetAdjective]'in Akdeniz denizlerine hükmettiği günler sona erdi. Akdeniz [ITA.GetAdjective]lara ve [GRE.GetAdjective]lara aittir!"
 TUR_izzettin_calislar:0 "İzzettin Çalışlar"
 TUR_joint_fortification_budget:0 "Ortak Tahkimat Bütçesi"
 TUR_joint_fortification_budget_desc:0 "Balkan Antantı bir domino taşı yığını gibidir: birimiz düştüğünde, geri kalanı da hızla onu takip edecektir. Hepimiz savunmamız için sorumluluk almalı ve sınırlarımızı olası saldırılara karşı hazırlamalıyız."
 TUR_kamil_tolon:0 "Kamil Tolon"
 TUR_kazim_karabekir:0 "Kâzım Karabekir"
 TUR_kemalism_with_socialist_characteristics:0 "Sosyalist Nitelikli Kemalizm"
 TUR_kemalism_with_socialist_characteristics_desc:0 "Kemalizm'den kurtulmak gibi bir niyetimiz yok, yerli ve ilerici ideolojimizden kurtularak dünyaya kötülük yapmış oluruz. Kemalizm, temellerini tamamen aşındırmadan Marksist değerlere daha fazla uyacak şekilde değiştirilebilecek kadar dinamiktir."
 TUR_kemalist_army_officers_decreased_power_disloyal:0 "Kemalist Subaylar"
 TUR_kemalist_army_officers_decreased_power_disloyal_desc:0 "Türk subay kadrosu, Kemalist değerlerin en sadık koruyucularından bazılarıdır. Kemalizm, halkın desteğini kazanmada bazı aksaklıklar yaşadı, ki subay kadrosu bunu büyük ölçüde mevcut yönetimin politikalarına ve eylemlerine bağlıyor."
 TUR_kemalist_army_officers_decreased_power_loyal:0 "Kemalist Subaylar"
 TUR_kemalist_army_officers_decreased_power_loyal_desc:0 "Türk subay kadrosu, Kemalist değerlerin en sadık koruyucularından bazılarıdır. Kemalizm, halkın desteğini kazanmada bazı aksaklıklar yaşadı, ancak subay kadrosu mevcut yönetimi desteklemeye kararlı."
 TUR_kemalist_army_officers_decreased_power_neutral:0 "Kemalist Subaylar"
 TUR_kemalist_army_officers_decreased_power_neutral_desc:0 "Türk subay kadrosu, Kemalist değerlerin en sadık koruyucularından bazılarıdır. Kemalizm, halkın desteğini kazanmada bazı aksaklıklar yaşadı ve subaylar ulusun ruh halini endişeyle gözlemliyor."
 TUR_kemalist_army_officers_extended_power_disloyal:0 "Kemalist Subaylar"
 TUR_kemalist_army_officers_extended_power_disloyal_desc:0 "Seçkin Türk subay kadrosu, Kemalist değerlerin en sadık koruyucularından bazılarıdır. Kemalizm, Türkiye genelinde istikrarlı bir şekilde kalpleri ve zihinleri kazanıyor ve subay kadrosu, Kemalist değerlerin korunmasını garanti altına almak için mevcut yönetime karşı aktif olarak çalışıyor."
 TUR_kemalist_army_officers_extended_power_loyal:0 "Kemalist Subaylar"
 TUR_kemalist_army_officers_extended_power_loyal_desc:0 "Seçkin Türk subay kadrosu, Kemalist değerlerin en sadık koruyucularından bazılarıdır. Kemalizm, Atatürk'ün umduğu gibi Türkiye genelinde kalpleri ve zihinleri istikrarlı bir şekilde kazanıyor ve subay kadrosu, Türk egemenliğine yönelik tüm tehlikelere karşı mevcut yönetimle dayanışma içindedir."
 TUR_kemalist_army_officers_extended_power_neutral:0 "Kemalist Subaylar"
 TUR_kemalist_army_officers_extended_power_neutral_desc:0 "Seçkin Türk subay kadrosu, Kemalist değerlerin en sadık koruyucularından bazılarıdır. Kemalizm, Atatürk'ün umduğu gibi Türkiye genelinde kalpleri ve zihinleri istikrarlı bir şekilde kazanıyor ve subay kadrosu, Kemalist değerlerin onları saptıracak olanlara karşı korunmasını sağlamaya hazır."
 TUR_kemalist_army_officers_limited_power_disloyal:0 "Kemalist Subaylar"
 TUR_kemalist_army_officers_limited_power_disloyal_desc:0 "Türk subay kadrosu, Kemalist değerlerin en sadık koruyucularından bazılarıdır. Kemalizm bir ideoloji olarak zorlanmaya devam ediyor ve subay kadrosu, ideoloji ve yönetim konularında mevcut yönetimin duruşuna kesin bir şekilde karşı çıkıyor."
 TUR_kemalist_army_officers_limited_power_loyal:0 "Kemalist Subaylar"
 TUR_kemalist_army_officers_limited_power_loyal_desc:0 "Türk subay kadrosu, Kemalist değerlerin en sadık koruyucularından bazılarıdır. Kemalizm bir ideoloji olarak zorlanmaya devam ediyor, ancak subay kadrosu devletin korunmasıyla ilgili her konuda hükümete yardım etmeye hazır."
 TUR_kemalist_army_officers_limited_power_neutral:0 "Kemalist Subaylar"
 TUR_kemalist_army_officers_limited_power_neutral_desc:0 "Türk subay kadrosu, Kemalist değerlerin en sadık koruyucularından bazılarıdır. Kemalizm bir ideoloji olarak zorlanmaya devam ediyor ve subay kadrosu Kemalist ilkeleri korumak için özenle çalışıyor."
 TUR_kemalist_army_officers_minimal_power_disloyal:0 "Kemalist Subaylar"
 TUR_kemalist_army_officers_minimal_power_disloyal_desc:0 "Türk subay kadrosu, Kemalist değerlerin en sadık koruyucularından bazılarıydı, ama şimdi Kemalist sadıkların bu acınası derecede küçülmüş kliği, mevcut yönetim hakkında üstünkörü kınamalar yapmaktan başka pek bir şey yapamıyor."
 TUR_kemalist_army_officers_minimal_power_loyal:0 "Kemalist Subaylar"
 TUR_kemalist_army_officers_minimal_power_loyal_desc:0 "Türk subay kadrosu, Kemalist değerlerin en sadık koruyucularından bazılarıydı, ama şimdi Kemalist sadıkların bu kayıtsız kliği, mevcut yönetim hakkında üstünkörü değerlendirmeler yapmaktan başka pek bir şey yapamıyor."
 TUR_kemalist_army_officers_minimal_power_neutral:0 "Kemalist Subaylar"
 TUR_kemalist_army_officers_minimal_power_neutral_desc:0 "Türk subay kadrosu, Kemalist değerlerin en sadık koruyucularından bazılarıydı, ama şimdi büyük ölçüde törensel bir role indirgendiler."
 TUR_kemalist_army_officers_powerful_disloyal:0 "Kemalist Subaylar"
 TUR_kemalist_army_officers_powerful_disloyal_desc:0 "Seçkin Türk subay kadrosu, Kemalist değerlerin en sadık koruyucularından bazılarıdır. Kemalizm daha önce Türkiye'de hiç bu kadar kökleşmemişti ve subay kadrosu, Kemalizm'in bu kadar çok kişi tarafından saygı gördüğü bir zamanda Kemalist değerlere bu kadar çelişkili davrandığımız için bizden kesinlikle nefret ediyor."
 TUR_kemalist_army_officers_powerful_loyal:0 "Kemalist Subaylar"
 TUR_kemalist_army_officers_powerful_loyal_desc:0 "Seçkin Türk subay kadrosu, Kemalist değerlerin en sadık koruyucularından bazılarıdır. Kemalizm daha önce Türkiye'de hiç bu kadar kökleşmemişti ve devletimiz mevcut yönetim altında olduğundan daha güvenli ellerde hiç olmamıştı."
 TUR_kemalist_army_officers_powerful_neutral:0 "Kemalist Subaylar"
 TUR_kemalist_army_officers_powerful_neutral_desc:0 "Seçkin Türk subay kadrosu, Kemalist değerlerin en sadık koruyucularından bazılarıdır. Kemalizm daha önce Türkiye'de hiç bu kadar kökleşmemişti."
 TUR_legacy_of_ataturk_defiled:0 "Atatürk'ün Mirası"
 TUR_legacy_of_ataturk_defiled_desc:0 "Onu hayal kırıklığına uğrattık: Türklerin Babası, [ROOT.GetNameDef]'nin bugünkü halini hor görmekten ve küçümsemekten başka ne yapabilirdi ki? Artık tek çaremiz, onun bu ulus için beslediği emellerin yanlış, bizimkilerin ise doğru olduğuna inanmak..."
 TUR_legacy_of_ataturk_fulfilled:0 "Atatürk'ün Mirası"
 TUR_legacy_of_ataturk_fulfilled_desc:0 "[ROOT.GetAdjective] devletini meşru bir çok partili liberal demokratik devlete dönüştürerek Mustafa Kemal Atatürk'ün en yüksek emellerini savunduk ve yerine getirdik. Atatürk'ün ömür boyu süren rüyasını savunduk ve bu yüzden saltanatımız halkın gözünde önemli ölçüde daha güvenli hale geldi."
 TUR_legacy_of_ataturk_preserved:0 "Atatürk'ün Mirası"
 TUR_legacy_of_ataturk_preserved_desc:0 "Kemalist idealleri teşvik eden otoriter bir rejimi sürdürerek eskinin statükosunu uzattık. Mustafa Kemal Atatürk'ün [ROOT.GetAdjective] devleti için olan özlemlerini yıkmadık, ama bu hedefleri ilerletmek için de pek bir şey yapmadık. Kemalizm'in mantosunu gasp edebilmeleri için bıraktığımız temelleri kullanmak gelecek nesillere kalacaktır..."
 TUR_liberalism:0 "Özgürlükçülük"
 TUR_liberalism_desc:0 "Ben ezelden beridir hür yaşadım, hür yaşarım. Hangi çılgın bana zincir vuracakmış? Şaşarım! Hakkıdır, hür yaşamış bayrağımın hürriyet!"
 TUR_mehmet_emin_yurdakul:0 "Mehmet Emin Yurdakul"
 TUR_mehmet_fahri_engin:0 "Mehmet Fahri Engin"
 TUR_mehmet_salih_omurtak:0 "Salih Omurtak"
 TUR_mustafa_kemal_ataturk_figurehead:0 "Mustafa Kemal Atatürk"
 TUR_mustafa_kemal_ataturk_figurehead_desc:0 "Emekliliğinde bile, Gazimiz ulusumuzun siyasetine karışmaktan kendini alamıyor. Artık resmi olarak cumhurbaşkanı olmayabilir, ama Mustafa Kemal Atatürk'ün sözü hala kanundur - şimdi bile."
 TUR_muzaffer_goksenin:0 "Muzaffer Göksenin"
 TUR_nationalism:0 "Milliyetçilik"
 TUR_nationalism_desc:0 "Korkma, sönmez bu şafaklarda yüzen al sancak; Sönmeden yurdumun üstünde tüten en son ocak. O benim milletimin yıldızıdır, parlayacak; O benimdir, o benim milletimindir ancak."
 TUR_nazim_hikmet:0 "Nâzım Hikmet"
 TUR_nejdet_sancar:0 "Nejdet Sançar"
 TUR_nihal_atsiz:0 "Nihal Atsız"
 TUR_nuri_demirag:0 "Nuri Demirağ"
 TUR_nuri_demirag_prime_minister:0 "Nuri Demirağ"
 TUR_nuri_killigil:0 "Nuri Killigil"
 TUR_objectors_flocking_to_military_service:0 "Askerlikten Kaçanlar Askerlik Hizmetine Akın Ediyor"
 TUR_objectors_flocking_to_military_service_desc:0 "Bir zamanlar askerlikten kaçan her türden [TUR.GetAdjective] vatandaşı, silahlı kuvvetlerimizde hizmet etmek için kaydoluyor. Halk, hükümetin Önce Vatan yaklaşımını iyi karşıladı ve birçoğu daha önce kendilerini yabancı hissettikleri ülkemizin dokusundaki yerlerini anlamaya başlıyor."
 TUR_ottoman_officers_invited_back:0 "§YOsmanlı Sadıkları§! aktif hizmete geri dönmeye davet edildi."
 TUR_political_landscape_shifting:0 "Siyasi Manzara Değişiyor"
 TUR_political_landscape_shifting_desc:0 "Çok uzun zamandır, Kemalizm'in nihai amacı [TUR.GetNameDef]'de çok partili bir liberal demokrasi kurmaktı... ama zaman değişir. Modern ideolojilerin dünya düzeni üzerinde üstünlük için birbirleriyle savaştığı heyecan verici zamanlarda yaşıyoruz ve görünüşe göre ideolojik savaş alanı şimdi burada da kendine yer bulmuş."
 TUR_populism:0 "Halkçılık"
 TUR_populism_desc:0 "Kim bu cennet vatanın uğruna olmaz ki fedâ? Şühedâ fışkıracak, toprağı sıksan şühedâ!"
 TUR_reappropriated_exploitative_finance:0 "Yeniden Tahsis Edilmiş Sömürücü Finans"
 TUR_reappropriated_exploitative_finance_desc:0 "Yabancı tefecilerin ve kendi aşağılık yerli kapitalist parazitlerimizin servetini, [TUR.GetNameDef]'nin işçi sınıfına gerçekten hizmet eden bir toplum inşa etmek için yeniden kullanacağız."
 TUR_rearmament_scheme:0 "Hazırlanmış Yeniden Silahlanma Planı"
 TUR_rearmament_scheme_desc:0 "Kapsamlı bir yeniden silahlanma planı bir süredir hazırlık aşamasındaydı, ancak planı uygulama ihtiyacı pek yoktu - ama şimdi dünya başka bir savaşın eşiğinde ve Türkiye hazırlıksız yakalanmayacak."
 TUR_rebuilding_our_home:0 "Evimizi Yeniden İnşa Etmek"
 TUR_rebuilding_our_home_desc:0 "Ulusumuz Kemalist köpekler tarafından maddi, fiziksel ve ruhsal olarak harap edildi, ama nihayet onların tiranlığına son verildi. Halkımız için yeni bir çağın eşiğindeyiz: geçmişin yanlışlarını nihayet düzeltebileceğimiz bir çağ. Geçmişi diriltmek için gelecek için inşa etmeliyiz."
 TUR_recep_peker:0 "Recep Peker"
 TUR_red_officers:0 "Kızıl Subaylar"
 TUR_red_officers_desc:0 "Tıpkı Kemalist subayların kendi ideolojilerini temsil edip korumaları gibi, yeni subaylarımız da [TUR.GetNameDef]'de Marksizm'in koruyucuları olarak hizmet edecekler."
 TUR_refet_bele:0 "Refet Bele"
 TUR_reformism:0 "Reformculuk"
 TUR_reformism_desc:0 "Batının ufukları çelikten duvarlarla çevrili olabilir ama benim sınırlarım bir müminin kudretli göğsü tarafından korunuyor. Bırakın bağırsın, korkmayın! Ve düşünün: Medeniyet dediğiniz o hırpalanmış, tek dişli canavar bu ateşli inancı nasıl söndürebilir?"
 TUR_refugees_from_the_fascist_menace:0 "Faşist Tehdidinden Mülteciler"
 TUR_refugees_from_the_fascist_menace_desc:0 "Faşistler dışlayıcılık politikaları uygular ve her fırsatta insanın devredilemez haklarını ihlal ederler. Eylemleri canavarca ve faşist önyargıdan kaçanları korumak ve kollamak yapabileceğimiz en az şeydir."
 TUR_republicanism:0 "Cumhuriyetçilik"
 TUR_republicanism_desc:0 "Hakkıdır, Hakk’a tapan, milletimin istiklâl."
 TUR_revolutionary_brigades_from_abroad:0 "Yurtdışından Devrimci Tugaylar"
 TUR_revolutionary_brigades_from_abroad_desc:0 "Marksizm temelde enternasyonalist bir inançtır ve bu yüzden dünyanın dört bir yanından devrimcilerin ortak küresel mücadelemizde savaşmak için ulusumuza akın etmesi sadece doğaldır."
 TUR_revolutionism:0 "İnkılapçılık"
 TUR_revolutionism_desc:0 "Dalgalan sen de şafaklar gibi ey şanlı hilâl; Olsun artık dökülen kanlarımın hepsi helâl. Ebediyen sana yok, ırkıma yok izmihlâl!"
 TUR_rising_islamist_dissidence:0 "Yükselen İslamcı Muhalefet"
 TUR_rising_islamist_dissidence_desc:0 "[TUR.GetNameDef]'de ne zaman serbest seçim kavramı gündeme gelse, dinci aşırı muhafazakarlar CHP'ye karşı herhangi bir muhalefet platformunu ele geçirmeye çalıştılar. Görünüşe göre bu sefer de farklı olmayacak. İdeolojik düşmanlarımız, onlara sağladığımız oy sandığını kirleterek ülkemiz üzerindeki yönetimimizi devirmek için toplanırken, ulus genelinde yükselen bir aşırı muhafazakar bilinç var."
 TUR_riza_nur:0 "Rıza Nur"
 TUR_sadik_altincan:0 "Sadık Altıncan"
 TUR_said_i_nursi:0 "Said-i Nursî"
 TUR_salih_omurtak:0 "Salih Omurtak"
 TUR_second_five_year_plan_cakmak:0 "Çakmak'ın Beş Yıllık Planı"
 TUR_second_five_year_plan_cakmak_desc:0 "Alman yeniden silahlanma modeline dayanan Fevzi Çakmak, [ROOT.GetNameDef]'deki ağır sanayi miktarını artırmayı ve ulus genelindeki altyapıyı modernize etmeyi bir öncelik haline getirdi."
 TUR_second_five_year_plan_inonu:0 "İnönü'nün Beş Yıllık Planı"
 TUR_second_five_year_plan_inonu_desc:0 "Sovyet sanayileşme modeline dayanan İsmet İnönü, [ROOT.GetNameDef]'deki hafif sanayi miktarını artırmayı ve ulus genelindeki altyapıyı modernize etmeyi bir öncelik haline getirdi."
 TUR_sectarian_woes:0 "Mezhepsel Sorunlar"
 TUR_sectarian_woes_1:0 "Mezhepsel Sorunlar"
 TUR_sectarian_woes_1_desc:0 "§W[TUR.GetNameDefCap]'ın iç bölünmeleri coğrafi olarak§! §YEyalet Etkenleri§! aracılığıyla temsil edilir§W:§! £faction_tur_kemalist §YKemalistler§! §Wbatıda ve kuzeyde bulunabilir, dindar§! £faction_tur_traditionalist §YGelenekselciler§! §Wmerkezi iç bölgelerde ve güneyde bulunabilirken,§! £faction_tur_kurdish §YKürt halkı§! §Wulusun güneydoğusunda bulunabilir.§! \n\n§WFarklı§! §YGruplar§! §Wile etkileşimlere§! §YKararlar Sekmesi§!§W aracılığıyla, ayrıca bazı§! §YOdak Etkileri§! §Wve§! §YOlay Seçenekleri§!§W aracılığıyla erişilebilir.§! \n\nTürkiye, ideolojik, dini ve etnik hatlar boyunca çizilen iç bölünmelerle kuşatılmıştır. Kemalistler, Türkiye'yi laik bir devlete dönüştürmeyi umuyor, ancak nüfusun büyük bir yüzdesi laiklik kavramının kendisine temelden karşı çıkmaya devam ediyor. Ülkemizin iç bölünmelerini onarmak için, bu konulara ya nazik bir elle ya da demir bir yumrukla yaklaşmamız gerekecek."
 TUR_sectarian_woes_2:0 "Mezhepsel Sorunlar"
 TUR_sectarian_woes_desc:0 "§W[TUR.GetNameDefCap]'nin iç bölünmeleri coğrafi olarak§! §YEyalet Etkenleri§! aracılığıyla temsil edilir§W:§! £faction_tur_kemalist §YKemalistler§! §Wbatıda ve kuzeyde bulunabilir, dindar§! £faction_tur_traditionalist §YGelenekselciler§! §Wmerkezi iç bölgelerde ve güneyde bulunabilirken,§! £faction_tur_kurdish §YKürt halkı§! §Wulusun güneydoğusunda bulunabilir.§! \n\n§WFarklı§! §YGruplar§! §Wile etkileşimlere§! §YKararlar Sekmesi§!§W aracılığıyla, ayrıca bazı§! §YOdak Etkileri§! §Wve§! §YOlay Seçenekleri§!§W aracılığıyla erişilebilir.§! \n\nTürkiye, ideolojik, dini ve etnik hatlar boyunca çizilen iç bölünmelerle kuşatılmıştır. Kemalistler, Türkiye'yi laik bir devlete dönüştürmeyi umuyor, ancak nüfusun büyük bir yüzdesi laiklik kavramının kendisine temelden karşı çıkıyor. Doğuda, Kürt halkı Türk hükümetine büyük sorunlar çıkardı ve asimilasyon yerine isyan yolunu seçmeye kararlı görünüyor. Ülkemizin iç bölünmelerini onarmak için, bu konulara ya nazik bir elle ya da demir bir yumrukla yaklaşmamız gerekecek."
 TUR_sectarian_woes_desc_2:0 "§W[TUR.GetNameDefCap]'ın iç bölünmeleri coğrafi olarak§! §YEyalet Etkenleri§! aracılığıyla temsil edilir§W:§! £faction_tur_kemalist §YKemalistler§! §Wbatıda ve kuzeyde bulunabilir, dindar§! £faction_tur_traditionalist §YGelenekselciler§! §Wmerkezi iç bölgelerde ve güneyde bulunabilirken,§! £faction_tur_kurdish §YKürt halkı§! §Wulusun güneydoğusunda bulunabilir.§! \n\n§WFarklı§! §YGruplar§! §Wile etkileşimlere§! §YKararlar Sekmesi§!§W aracılığıyla, ayrıca bazı§! §YOdak Etkileri§! §Wve§! §YOlay Seçenekleri§!§W aracılığıyla erişilebilir.§! \n\nTürkiye, ideolojik, dini ve etnik hatlar boyunca çizilen iç bölünmelerle kuşatılmıştır. Doğuda, Kürt halkı Türk hükümetine büyük sorunlar çıkardı ve asimilasyon yerine isyan yolunu seçmeye kararlı görünüyor. Ülkemizin iç bölünmelerini onarmak için, bu konulara ya nazik bir elle ya da demir bir yumrukla yaklaşmamız gerekecek."
 TUR_sefik_husnu:0 "Şefik Hüsnü"
 TUR_sevket_sureyya_aydemir:0 "Şevket Süreyya Aydemir"
 TUR_sheltered_foreign_outcasts:0 "Barındırılan Yabancı Sürgünler"
 TUR_sheltered_foreign_outcasts_desc:0 "Gücümüz dahilinde olduğunda dünyanın zulüm gören halklarına yardım etmek ahlaki zorunluluğumuzdur ve şimdiye kadar bu kesinlikle gücümüz dahilindeydi. Onları vatandaşlığa alacak, koruyacak ve [TUR.GetNameDef]'nin yerli oğulları ve kızlarıymış gibi besleyip büyüteceğiz."
 TUR_socialism:0 "Sosyalizm"
 TUR_socialism_desc:0 "Arkadaş! Yurduma alçakları uğratma sakın; Siper et gövdeni, dursun bu hayâsızca akın."
 TUR_sub_zero_survival_training:0 "Sıfırın Altında Hayatta Kalma Eğitimi"
 TUR_sub_zero_survival_training_desc:0 "Avrasya'nın bazı acı soğuklarını taklit etmek kolay bir iş değil, ama idare etmek zorunda kaldık. Askerlerimizin tüm yıl boyunca alpin ve buzul benzeri koşullarda eğitim alabilmesi için Erzurum'daki Palandöken Dağı'nın zirvesine bir tesis ve Ağrı Dağı çevresinde daha küçük ek bir tesis inşa etmeyi seçtik."
 TUR_sukru_okan:0 "Şükrü Okan"
 TUR_sukru_saracoglu:0 "Şükrü Saraçoğlu"
 TUR_sukru_saracoglu_prime_minister:0 "Şükrü Saraçoğlu"
 TUR_the_antalya_naval_academy:0 "Antalya Deniz Harp Okulu"
 TUR_the_antalya_naval_academy_desc:0 "[ITA.GetAdjective]larla birlikte çalışarak, dünyada eşi benzeri olmayan, gelecek vadeden amiraller ve deniz subayları için bir okul kurduk."
 TUR_the_battle_for_our_nations_survival:0 "Ulusumuzun Hayatta Kalma Savaşı"
 TUR_the_battle_for_our_nations_survival_desc:0 "Düşünülemez olan oldu: [SOV.GetNameDef] ulusumuzu işgal etti ve şimdi [TUR.GetAdjective] devletinin geleceği tehlikede. [TUR.GetAdjective] halkı [TUR.GetLeader]'in çağrısına koştu, ama tartışmasız daha güçlü bir tehdide karşı topyekûn bir savaş karşısında bu şevk ne kadar sürebilir?"
 TUR_the_coordinated_armed_forces_of_the_balkan_pact:0 "Balkan Antantı'nın Koordineli Silahlı Kuvvetleri"
 TUR_the_coordinated_armed_forces_of_the_balkan_pact_desc:0 "Gücümüz birliğimizden kaynaklanır. Birlikte koordine oluruz, birlikte savaşırız, birlikte düşeriz. Toz duman dağıldığında ve toplar sustuğunda, Balkan Antantı hala ayakta olacaktır."
 TUR_the_redshirts:0 "Kızılgömlekliler"
 TUR_the_redshirts_desc:0 "Kızılgömlekliler, şehirlerimizin sokaklarında devriye gezen ve insanların Kemalizm ilkelerine sıkı sıkıya uymasını sağlayan kendi paramiliter faşist milislerimizdir. Bazen biraz şiddetli olabilirler, demir gibi kalpleri ve devrimci idealizmle dolu kafalarıyla, ama en azından davaları haklı!"
 TUR_the_revolutionary_officer_college_of_kars:0 "Kars Devrimci Subay Koleji"
 TUR_the_revolutionary_officer_college_of_kars_desc:0 "Kars, hikayeli bir tarihe sahip bir şehirdir ve [SOV.GetNameDef]'e yakınlığı, onu yeni bir siyasallaşmış subay okulu kurmak için ideal bir konum haline getirir. Subaylarımıza sadece savaşın temelleri değil, aynı zamanda Marksist doktrinin incelikleri de öğretilecektir."
 TUR_three_year_plan_balkans:0 "Paylaşılan Üç Yıllık Plan"
 TUR_three_year_plan_balkans_desc:0 "Balkan Antantı, sanayi üslerimizin kolektif olarak bir büyük gücün saldırısına dayanacak kadar güçlü olmasını sağlamak için ortak finanse edilen çok uluslu merkezi planlı bir ekonomik planı destekleyerek tarihin en cesur sanayileşme projelerinden birini üstlendi."
 TUR_tpda:0 "TKBİ"
 TUR_tpda_absorbed:0 "Türk Kamu Borçları İdaresi"
 TUR_tpda_absorbed_desc:0 "Sadece bir kalem darbesiyle, Türk Kamu Borçları İdaresi özel bir kurumdan devlete ait bir kamu kurumuna dönüştü. Borcumuzu biz yönetiyoruz, borcumuzu biz kontrol ediyoruz ve borcumuzu azaltabiliriz. Dünyada yükseldik."
 TUR_tpda_desc:0 "Sonunda, dizginleri emperyalistlerden kopardık ve kendi borçlarımızı başkentimizden organize edip yönetebiliriz. Borçlar Konseyi artık yok, şimdi ayrıcalıklı köpekbalıkları, tazminat veya teslimiyet aradıklarında bize gelmekten başka seçenekleri olmayacak."
 TUR_turkic_volunteers_from_abroad:0 "Yurtdışından Türk Gönüllüler"
 TUR_turkic_volunteers_from_abroad_desc:0 "Türk kardeşlerimiz, ortak mücadelemize destek vermek için Avrasya'nın her köşesinden geliyor. Birlikte, Kurt Çağı'nı güvence altına alacağız."
 TUR_turkish_bolshevism:0 "Türk Bolşevizmi"
 TUR_turkish_bolshevism_desc:0 "Kemalizm amacına hizmet etti ve şimdi tarih kitaplarına havale edilecek... pekala, en azından bazı yasadışı tarih kitaplarına. [TUR.GetNameDef] artık revizyonist gerici Mustafa Kemal Atatürk ve onun ezilmiş hareketinden ziyade Vladimir Lenin'in devrimi üzerine modellenmiştir."
 TUR_turkish_interventionism:0 "Türk Müdahaleciliği"
 TUR_turkish_interventionism_desc:0 "Yurtta Sulh, Cihanda Sulh - Atatürk bunu emretti ve biz şimdi bunu dış politikamızın temeli olarak kodladık. Artık kenarda durup dünyanın kargaşaya düşmesine izin veremeyiz ve hiçbir şey yapamayız. Yurtta barışımızı sağlamanın tek yolu, dünyada barış için savaşmaktır."
 TUR_turkish_workers_militia:0 "Türk İşçi Milisleri"
 TUR_turkish_workers_militia_desc:0 "İşçilerin haklarını korumak için en iyi konumda olanlar işçilerin kendileridir. Elbette, hükümetimizden biraz yönlendirme ve Moskova'dan gelen ara sıra bir not, onların bir işçi milisi olarak etkinliğini ancak artırır."
 TUR_tuz_golu_training_facility:0 "Tuz Gölü Eğitim Tesisi"
 TUR_tuz_golu_training_facility_desc:0 "Ulusumuzun Akdeniz iklimi, askerlerimizi kurak iklimlerde yeterince faaliyet gösterebilecek şekilde eğitmek için uygun bir ortam değildir. Askerlerimizin kurak ortamlarda savaşmaya daha iyi hazırlanabilmesi için Tuz Gölüne yakın bir eğitim tesisi kurmayı seçtik."
 TUR_ultranationalism:0 "Aşırı Milliyetçilik"
 TUR_ultranationalism_desc:0 "Cânı, cânânı, bütün varımı alsın da Hudâ, Etmesin tek vatanımdan beni dünyâda cüdâ. Bu ezanlar-ki şehâdetleri dînin temeli Ebedî yurdumun üstünde benim inlemeli."
 TUR_united_balkan_security_forces:0 "Birleşik Balkan Güvenlik Güçleri"
 TUR_united_balkan_security_forces_desc:0 "Paylaşılan güvenlik taburları, üst komuta üyelerimizin sık sık savaş planları ve istihbarat alışverişinde bulunmasının doğal bir devamıdır. İç sınırlarımızı denetleme baskısını biraz hafifleterek, ulusal ordularımızın yükünü azaltıyor ve savaşa daha iyi hazırlanıyoruz."
 TUR_varlik_vergisi_spirit:0 "Varlık Vergisi"
 TUR_varlik_vergisi_spirit_desc:0 "Bu 'Varlık Vergisi', Cizye vergisinin sadece üstü kapalı bir şekilde yeniden uygulanmasıdır ve laik bir cumhuriyeti yönetme yanılsamasını bile kaybetmeden önce onu yürürlükten kaldırmayı düşünmemiz gerekebilir."
 TUR_vecihi_hurkus:0 "Vecihi Hürkuş"
 TUR_victory_at_all_costs:0 "Ne Pahasına Olursa Olsun Zafer"
 TUR_victory_at_all_costs_desc:0 "Kurtuluş Savaşımız sırasında bir millet olarak, birkaç on yıl sonra yok edilmek için dişimizle tırnağımızla savaşmadık. Hayır, [TUR.GetNameDef]'nin hikayesi burada bitmiyor - düşmemeliyiz, düşmeyeceğiz!"
 TUR_widespread_illiteracy_idea:0 "Yaygın Cehalet"
 TUR_widespread_illiteracy_idea_desc:0 "Atatürk'ün okuryazarlık seferberliği ve milli eğitim kampanyaları sayesinde, harf ve dil devrimlerinin ilk uygulamalarından bu yana ulusumuzdaki okuryazarlık, kendisine başöğretmen unvanını kazandıracak kadar büyük ölçüde artmış olsa da hâlâ yapılacak çok şey var."
