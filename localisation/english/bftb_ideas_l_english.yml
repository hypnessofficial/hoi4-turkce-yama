 GRE_foreign_monopolies_1:0 "Yabancı Monopoller"
 GRE_foreign_monopolies_1_desc:0 "Yabancı güçlerin ağır sanayilerine olan bağımlılığımız, gelişmekte olan birçok sektörümüzü sıkı bir şekilde sadece yabancı hükümetlere karşı sorumlu olan güçlü şirketlerin ellerine bıraktı. Ya bu monopollere bir anlaşma yapana ya da onları ülkemizden kalıcı olarak atana kadar modernleşme sürecimizi tam olarak hızlandırmayı bekleyemeyiz."
