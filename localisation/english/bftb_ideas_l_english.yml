 GRE_political_instability:0 "Siyasi İstikrarsızlık"
 GRE_political_instability_communist:0 "Siyasi İstikrarsızlık"
 GRE_political_instability_communist_desc:0 "§W£faction_gre_monarchist §YMonarşistler§!, [Root.GetMonarchistLoyaltyLevel] durumundalar.§! [ROOT.GetMonarchistLoyaltyEffects] \n\n§W£faction_gre_venezelist §YCumhuriyetçiler§!, [Root.GetRepublicanLoyaltyLevel] durumundalar.§! [ROOT.GetRepublicanLoyaltyEffects] \n\n§W£faction_gre_communist §YKomünistler§!, [Root.GetCommunistLoyaltyLevel] durumundalar.§! [ROOT.GetCommunistLoyaltyEffects] \n\n§W£faction_gre_fascist §YFaşistler§!, [Root.GetFascistLoyaltyLevel] durumundalar.§! [ROOT.GetFascistLoyaltyEffects] \n\n1924 ile 1935 arasında yirmi üç hükümet değişikliği, on üç darbe ve bir diktatörlük yaşadık! Çok uzun bir süredir ilk kez, Yunanistan nihayet Yunan halkını ilk sıraya koyan bir hareketin ulusun başında olduğu bir duruma geldi. Ama hareketimiz genç ve halkın yönetimimize gerçekten güvenmesinden önce kanıtlamamız gereken çok şey var."
 GRE_political_instability_desc:0 "§W£faction_gre_monarchist §YMonarşistler§!, [Root.GetMonarchistLoyaltyLevel] durumundalar.§! [ROOT.GetMonarchistLoyaltyEffects] \n\n§W£faction_gre_venezelist §YCumhuriyetçiler§!, [Root.GetRepublicanLoyaltyLevel] durumundalar.§! [ROOT.GetRepublicanLoyaltyEffects] \n\n§W£faction_gre_communist §YKomünistler§!, [Root.GetCommunistLoyaltyLevel] durumundalar.§! [ROOT.GetCommunistLoyaltyEffects] \n\n§W£faction_gre_fascist §YFaşistler§!, [Root.GetFascistLoyaltyLevel] durumundalar.§! [ROOT.GetFascistLoyaltyEffects] \n\n1924 ile 1935 arasında yirmi üç hükümet değişikliği, on üç darbe ve bir diktatörlük yaşadık! Halk artık yoruldu ve hükümetlerinde bir miktar istikrar istiyor, ama aynı zamanda herhangi bir hükümetin çok uzun süre hayatta kalma olasılığı konusunda da temkinli bir şüphecilik içindeler. Onları haksız çıkarmalı ve siyasi düşmanlarımızı dize getirerek sürekli iç çekişmelere bir son vermeliyiz."
 GRE_political_instability_dummy_desc:0 "1924 ile 1935 arasında yirmi üç hükümet değişikliği, on üç darbe ve bir diktatörlük yaşadık! Halk artık yoruldu ve hükümetlerinde bir miktar istikrar istiyor, ama aynı zamanda herhangi bir hükümetin çok uzun süre hayatta kalma olasılığı konusunda da temkinli bir şüphecilik içindeler. Onları haksız çıkarmalı ve siyasi düşmanlarımızı dize getirerek sürekli iç çekişmelere bir son vermeliyiz."
 GRE_political_instability_fascism:0 "Siyasi İstikrarsızlık"
 GRE_political_instability_fascism_desc:0 "§W£faction_gre_monarchist §YMonarşistler§!, [Root.GetMonarchistLoyaltyLevel] durumundalar.§! [ROOT.GetMonarchistLoyaltyEffects] \n\n§W£faction_gre_venezelist §YCumhuriyetçiler§!, [Root.GetRepublicanLoyaltyLevel] durumundalar.§! [ROOT.GetRepublicanLoyaltyEffects] \n\n§W£faction_gre_communist §YKomünistler§!, [Root.GetCommunistLoyaltyLevel] durumundalar.§! [ROOT.GetCommunistLoyaltyEffects] \n\n§W£faction_gre_fascist §YFaşistler§!, [Root.GetFascistLoyaltyLevel] durumundalar.§! [ROOT.GetFascistLoyaltyEffects] \n\n1924 ile 1935 arasında yirmi üç hükümet değişikliği, on üç darbe ve bir diktatörlük yaşadık! Faşizm her şeyden önce birliği savunur - eğer Yunan halkını etkili bir şekilde seferber edemez ve faşizmin Yunanistan'ın sıkıntılarına açık bir cevap olduğunu görmelerine yardımcı olamazsak, o zaman yönetmeyi hak etmiyoruz."
 GRE_political_instability_metaxas:0 "Siyasi İstikrarsızlık"
 GRE_political_instability_metaxas_desc:0 "§W£faction_gre_monarchist §YMonarşistler§!, [Root.GetMonarchistLoyaltyLevel] durumundalar.§! [ROOT.GetMonarchistLoyaltyEffects] \n\n§W£faction_gre_venezelist §YCumhuriyetçiler§!, [Root.GetRepublicanLoyaltyLevel] durumundalar.§! [ROOT.GetRepublicanLoyaltyEffects] \n\n§W£faction_gre_communist §YKomünistler§!, [Root.GetCommunistLoyaltyLevel] durumundalar.§! [ROOT.GetCommunistLoyaltyEffects] \n\n§W£faction_gre_fascist §YFaşistler§!, [Root.GetFascistLoyaltyLevel] durumundalar.§! [ROOT.GetFascistLoyaltyEffects] \n\n1924 ile 1935 arasında yirmi üç hükümet değişikliği, on üç darbe ve bir diktatörlük yaşadık! Metaksas'ın liderliği altında, tüm düşmanlarımızı ezerek güç yoluyla birliği sağlayacağız! Yunan halkı, bu kanunsuz ülkede düzeni kurma iradesine sahip bir hükümetin nasıl işlediğini öğrenecek."
 GRE_political_instability_republican:0 "Siyasi İstikrarsızlık"
 GRE_political_instability_republican_2:0 "Siyasi İstikrarsızlık"
 GRE_political_instability_republican_2_desc:0 "§W£faction_gre_monarchist §YMonarşistler§!, [Root.GetMonarchistLoyaltyLevel] durumundalar.§! [ROOT.GetMonarchistLoyaltyEffects] \n\n§W£faction_gre_venezelist §YCumhuriyetçiler§!, [Root.GetRepublicanLoyaltyLevel] durumundalar.§! [ROOT.GetRepublicanLoyaltyEffects] \n\n§W£faction_gre_communist §YKomünistler§!, [Root.GetCommunistLoyaltyLevel] durumundalar.§! [ROOT.GetCommunistLoyaltyEffects] \n\n§W£faction_gre_fascist §YFaşistler§!, [Root.GetFascistLoyaltyLevel] durumundalar.§! [ROOT.GetFascistLoyaltyEffects] \n\n1924 ile 1935 arasında yirmi üç hükümet değişikliği, on üç darbe ve bir diktatörlük yaşadık! Biz Venizelosçular, bunda oynamış olabileceğimiz... küçük rolü inkâr edemeyiz. En azından halk bizi bildikleri Şeytan olarak tanıyor! Şimdi mirasımızı yerine getirmek ve Yunanistan'ın 1919'da Konstantinopolis'i geri almaya çalıştığımızda başlattığı yolculuğu bitirmek bize düşüyor..."
 GRE_political_instability_republican_desc:0 "§W£faction_gre_monarchist §YMonarşistler§!, [Root.GetMonarchistLoyaltyLevel] durumundalar.§! [ROOT.GetMonarchistLoyaltyEffects] \n\n§W£faction_gre_venezelist §YCumhuriyetçiler§!, [Root.GetRepublicanLoyaltyLevel] durumundalar.§! [ROOT.GetRepublicanLoyaltyEffects] \n\n§W£faction_gre_communist §YKomünistler§!, [Root.GetCommunistLoyaltyLevel] durumundalar.§! [ROOT.GetCommunistLoyaltyEffects] \n\n§W£faction_gre_fascist §YFaşistler§!, [Root.GetFascistLoyaltyLevel] durumundalar.§! [ROOT.GetFascistLoyaltyEffects] \n\n1924 ile 1935 arasında yirmi üç hükümet değişikliği, on üç darbe ve bir diktatörlük yaşadık! Biz Venizelosçular, bunda oynamış olabileceğimiz... küçük rolü inkâr edemeyiz. En azından halk bizi bildikleri Şeytan olarak tanıyor! Maalesef, Anadolu Felaketi'nin anıları Yunan halkının zihninde hala taze ve bunda oynadığımız rolü de unutmadılar."
 GRE_protectors_of_the_mediterranean_spirit:0 "[Root.GetProtectorsMediterraneanSpiritName]"
 GRE_protectors_of_the_mediterranean_spirit_desc:0 "Akdeniz, başka herhangi birinin evi olmasından çok daha uzun süredir bizim evimizdir. Bu bölgeye ve içindeki insanlara karşı bir sorumluluğumuz var - ve bu kutsal görevi terk etmeye niyetimiz yok."
 GRE_pyrkal:0 "Pyrkal"
 GRE_red_militias_2:0 "Kızıl Ordu"
 GRE_red_militias_2_desc:0 "Gerçek bir komünist devlet, işçilerin iradesini cezasız bir şekilde uygulayabilecek bir halk ordusu gerektirir."
 GRE_red_militias_3:0 "Kızıl İnfazcılar"
 GRE_red_militias_3_desc:0 "Parti'ye karşı komplo kuran yıkıcı ajanlar her yerdeler, ama onları bulup kökünü kazımak için sadece küçük bir yetenekli insan grubunu eğitmeniz yeterli..."
 GRE_red_militias_spirit:0 "Kızıl Milisler"
 GRE_red_militias_spirit_desc:0 "Yunan toplumunu modernize etme çabalarımızı engellemeye çalışacak birçok kişi var, ancak Devrimi korumaya adanmış milislerin organizasyonuyla bizi durdurmaları çok daha zor olacak."
 GRE_republicans_friendly_or_loyal:0 "£faction_gre_venezelist §YCumhuriyetçiler§! dost veya sadık."
 GRE_reviving_the_double_headed_eagle_2:0 "Çift Başlı Kartalın Ruhunu Canlandırmak"
 GRE_reviving_the_double_headed_eagle_2_desc:0 "Venizelosçular, Yunanistan'ın gerçek kayıp zaferini – Bizans'ın zaferini – geri getirmesine izin vermeyi reddeden korkaklardı! İmparatorluğun tüm kayıp topraklarını geri alabilecekken neden Türkiye'nin kıyılarıyla yetinelim? Yunanistan için yeni bir zafer çağı başladı!"
 GRE_reviving_the_double_headed_eagle_spirit:0 "Çift Başlı Kartalın Ruhunu Canlandırmak"
 GRE_reviving_the_double_headed_eagle_spirit_desc:0 "Venizelosçular, Yunanistan'ın gerçek kayıp zaferini – Bizans'ın zaferini – geri getirmesine izin vermeyi reddeden korkaklardı! İmparatorluğun tüm kayıp topraklarını geri alabilecekken neden Türkiye'nin kıyılarıyla yetinelim? Yunanistan için yeni bir zafer çağı başladı!"
 GRE_rheinmetall:0 "Rheinmetall"
 GRE_royal_hellenic_naval_shipyard:0 "Kraliyet Helen Donanma Tersanesi"
 GRE_rsaf_enfield:0 "RSAF Enfield"
 GRE_rural_exodus:0 "Kırsal Göç"
 GRE_rural_exodus_Desc:0 "Sanayileşmeye yönelik hamlemizle birlikte, insanlar ülkenin kırsal bölgelerindeki evlerini terk edip daha büyük şehir merkezlerine akın ediyor."
 GRE_schachtplan:0 "Schachtplan"
 GRE_schachtplan_desc:0 "Alman iktisatçı Hjalmar Schacht'ın buluşu olan Schachtplan, Yunanistan'dan Almanya'ya artan hammadde ithalatı karşılığında Yunanistan'ın Alman pazarlarına erişimini garanti eder. Almanlar cömertçe bizi ayakta tutuyorlar, ancak onların cömertliğine bu kadar bağımlı hale gelerek doğrudan onların tuzağına düşmüş olabiliriz."
 GRE_schachtplan_fascistised:0 "Gotzamanis-Schachtplanı"
 GRE_schachtplan_fascistised_desc:0 "Hjalmar Schacht'ın orijinal Schachtplan'ına dayanan yeni Schachtplan, Almanya ve Yunanistan'ın en büyük korporatist iktisatçıları tarafından titizlikle bir araya getirildi: Nasyonal Sosyalizm ilkelerine dayanan yeni bir ekonomik pakt oluşturuldu. Bu ekonomik anlaşma uzun vadede güvenilir olmasa da, bu çekişme yıllarında bize yeterince iyi hizmet edecektir."
 GRE_schachtplan_modified:0 "Schachtplan"
 GRE_schachtplan_modified_desc:0 "Zeki Hjalmar Schacht'ın buluşu olan Schachtplan, Yunanistan'ın hammaddelerine öncelikli pazar erişimi karşılığında Yunanistan'ın Alman pazarlarına erişimini garanti eder. Almanlar geçmişte cömertçe bizi ayakta tuttular ve birlikte gerçekten özel bir ekonomik ilişki kurduk."
 GRE_security_batallions:0 "Güvenlik Taburları"
 GRE_security_batallions_desc:0 "İşgal altındaki topraklarda ve kendi ülkemizde barışı korumak için, ulusumuzun sunabileceği en ateşli faşistlerden oluşan güvenlik taburları kurmak zorunda kaldık."
 GRE_siemens:0 "Siemens"
 GRE_small_investment:0 "[GRE.GetNameDef]'e Küçük Yatırım"
 GRE_small_investment_desc:0 "[GRE.GetNameDef]'in ekonomisine mütevazı bir yatırım yaptık."
 GRE_socialist_economy_2:0 "Yunan Sosyalizmi"
 GRE_socialist_economy_2_desc:0 "Yunan halkı, sahte kralın otokratik yönetimi ve savaş çığırtkanı Venizelosçuların altında çok uzun süre kan döktü, artık halkın onları ilk sıraya koyan bir hükümet altında nihayet refaha erme zamanı!"
 GRE_socialist_economy_3:0 "Yunan Stalinizmi"
 GRE_socialist_economy_3_desc:0 "Parti her şeyden önce gelir; eğer biri Parti'ye sadık değilse, o zaman o yıkıcı bir hain ve tüm ulusumuz için bir tehlikedir."
 GRE_socialist_economy_4:0 "Yunan Komünizmi"
 GRE_socialist_economy_4_desc:0 "İşçi her şeyden önce gelir; eğer biz, işçiler tarafından iktidara getirilen ve işçilerden oluşan bir hükümet olarak işçilerin en iyi çıkarlarını temsil edemezsek, o zaman kim edebilir ki?"
 GRE_socialist_economy_spirit:0 "Yunan Sosyalizmi"
 GRE_socialist_economy_spirit_desc:0 "İnsanları kârdan önce koyan bir ekonomi uyguladık. Yurtdışından gelen sömürücü kapitalistlerde ve [ROOT.GetAdjective] işçisini hak ettiği paydan dolandırmaya çalışan yerel fırsatçı haşerelerde açık bir düşmanımız var."
 GRE_sophistry_and_science_idea:0 "Safsata ve Bilim"
 GRE_sophistry_and_science_idea_desc:0 "Politikacılar ve bilim insanları arasında bir karşılıklı bağımlılık geliştirerek, kendimizi modernliğe bir adım daha yaklaştıracağız."
 GRE_sophoklis_venizelos:0 "Sophoklis Venizelos"
 GRE_spyridon_avgeris:0 "Spyridon Avgeris"
