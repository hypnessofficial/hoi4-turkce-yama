 sp_naval_nuclear_missile_submarine_unique_reward_a_desc:0 "Planladığımız nükleer saldırı hakkındaki bilgiler düşmanlarımıza ulaşırsa, nükleer füze denizaltılarımız için büyük bir arama başlatacaklar. Avcılardan kaçmak için..."
 sp_naval_nuclear_submarine:0 "Nükleer Denizaltı"
 sp_naval_nuclear_submarine_desc:0 "Nükleer motorları özel bir denizaltıya sığacak kadar küçültebilmeliyiz, bu da gemiyi sessiz hale getirir ve ona aşırı menzil sağlar."
