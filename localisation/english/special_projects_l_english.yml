 sp_naval_proximity_fuze:0 "Yakınlık Tapası"
 sp_naval_proximity_fuze_desc:0 "Geliştirilmiş ve daha güvenilir radyo teknolojisi ile, sadece hedefin yakınında bulunarak patlayan ve ona zarar veren yeni tür tapalar geliştirebiliriz."
