 sp_naval_escort_carrier_unique_reward_a_desc:0 "Refakatçi uçak gemisi, oldukça küçük bir gövdeye çok fazla yetenek sığdırmaya çalışır. Menzil, dayanıklılık veya hız arasında bir seçim yapmalıyız."
