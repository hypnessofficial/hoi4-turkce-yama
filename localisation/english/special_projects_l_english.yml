 sp_naval_nuclear_torpedo:0 "Nükleer Torpido"
 sp_naval_nuclear_torpedo_desc:0 "Düşük verimli taktik savaş başlıklarının ortaya çıkmasıyla, bu savaş başlıklarına sahip uzun menzilli torpidolar teorik olarak herhangi bir konvansiyonel denizaltı tarafından konuşlandırılabilir."
