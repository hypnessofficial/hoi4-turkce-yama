 sp_naval_nuclear_missile_submarine:0 "Nükleer Füze Denizaltısı"
 sp_naval_nuclear_missile_submarine_desc:0 "Bir denizaltıyı yüzeye çıkarabilir, nükleer yüklü bir füze ateşleyebilir ve sonra tekrar dalabilirsek, ilk vuruş potansiyelimiz neredeyse sınırsız hale gelir."
