 sp_land_generic_reward_option_armor_tech_bonus_name:0 "Deneysel Tank Araştırması"
 sp_land_generic_reward_option_armor_tech_desc:0 "[Character.GetName] liderliğindeki [SpecialProject.GetName] projesindeki son gelişmeler, ilgili alanlarda önemli ilerlemeler sağladı. Bu atılımlar, askeri yetenekleri devrim niteliğinde değiştirerek daha etkili ve zorlu kara harbi stratejilerinin önünü açtı."
 sp_land_generic_reward_option_army_xp_desc:0 "[Character.GetName], [SpecialProject.GetName] projesinin potansiyelini tartışmak üzere seçkin bir grup subayla bir araya gelerek, yeni teknolojinin kara harbinde kullanımı konusunda kritik bilgiler edindi. Bu işbirliği, gelecekteki çatışmalara hazır olmayı temin ederek askeri kabiliyetlerimizi artırdı."
 sp_land_generic_reward_option_artillery_tech_bonus_name:0 "Deneysel Topçu Araştırması"
 sp_land_generic_reward_option_engine_bonus_desc:0 "Bu geliştirilmiş motorları üretmeye başla!"
 sp_land_generic_reward_option_major_breakthrough_desc:0 "[Character.GetName] büyük bir atılım gerçekleştirerek projeyi önemli ölçüde ileriye taşıdı, [Character.GetHerHis] uzmanlığını doğruladı ve araştırma ekibini canlandırdı. Bu ilerleme sayesinde proje hedefine daha da yaklaşıyor ve [Character.GetName]'in bir çığır açan olarak mirasını pekiştiriyor."
 sp_land_generic_reward_option_resource_scarcity_desc:0 "[Character.GetName]'in ekibi, [SpecialProject.GetName] projesinin geliştirilmesi için kritik malzeme sıkıntısıyla karşılaştı, bu da [Character.GetHerHim]'i talepleri karşılamak için alternatif kaynaklar bulmaya ve yeni üretim yöntemleri geliştirmeye zorladı."
 sp_land_generic_reward_option_scientist_xp:0 "Bilgi Güçtür!"
 sp_land_generic_reward_option_scientist_xp_desc:0 "[Character.GetName], bir atılım gerçekleştirerek ilerlemeyi hızlandırdı ve gelişmiş silahlarda bir öncü olarak [Character.GetHerHis] rolünü pekiştirdi."
 sp_land_generic_reward_option_test_failure_desc:0 "Test sırasında küçük bir aksilik meydana geldi ve [Character.GetName]'in prototipinde beklenmedik kusurlar ortaya çıktı. Bu aksaklık, yaklaşımın yeniden değerlendirilmesini ve tekniklerin rafine edilmesini teşvik etti. İlerlemeyi geçici olarak geciktirirken, öğrenilen bu dersler uzun vadede daha güçlü ve daha dayanıklı bir projeye katkıda bulunur."
 sp_land_generic_reward_resource_scarcity:0 "Kaynak Kıtlığı"
 sp_land_generic_reward_resource_scarcity_desc:0 "[Character.GetName]'in ekibi, [SpecialProject.GetName] projesinin geliştirilmesi için kritik malzeme sıkıntısıyla karşı karşıya, bu da [Character.GetHerHim]'i talepleri karşılamak için alternatif kaynaklar bulmaya ve yeni üretim yöntemleri geliştirmeye zorluyor."
 sp_land_generic_reward_scientist_xp_1:0 "Yeni Öğrenimler"
 sp_land_generic_reward_scientist_xp_1_desc:0 "[Character.GetName], bir atılım gerçekleştirerek ilerlemeyi hızlandırdı ve gelişmiş silahlarda bir öncü olarak [Character.GetHerHis] rolünü pekiştirdi. Her keşifle birlikte, [Character.GetHerHis] mühendislikteki ustalığı artıyor ve askeri teknolojinin geleceğini şekillendiriyor."
 sp_land_generic_reward_scientist_xp_2:0 "Geliştirilmiş Uzmanlık"
 sp_land_generic_reward_scientist_xp_3:0 "Aydınlatıcı Keşif"
 sp_land_generic_reward_test_failure_1:0 "Test Sonuçsuz"
 sp_land_generic_reward_test_failure_1_desc:0 "Test sırasında küçük bir aksilik meydana geldi ve [Character.GetName]'in prototipinde beklenmedik kusurlar ortaya çıktı. Bu aksaklık, yaklaşımın yeniden değerlendirilmesini ve tekniklerin rafine edilmesini teşvik ediyor. İlerlemeyi geçici olarak geciktirirken, öğrenilen bu dersler uzun vadede daha güçlü ve daha dayanıklı bir projeye katkıda bulunur."
 sp_land_generic_reward_test_failure_2:0 "Tasarım Hatası Tespit Edildi"
 sp_land_generic_reward_test_failure_3:0 "Küçük Test Hatası"
 sp_land_land_cruiser:0 "Kara Kruvazörü"
 sp_land_land_cruiser_desc:0 "Savaş alanına hükmetmek için tasarlanmış devasa bir zırhlı canavar. Eşsiz boyutu ve ateş gücü ile bu araç, zırhlı savaşın zirvesini temsil eder."
 sp_land_large_caliber_kinetic_energy_sabot:0 "Büyük Kalibre Kinetik Enerji Sabotu"
 sp_land_large_caliber_kinetic_energy_sabot_desc:0 "Tahkimatları delmek için tasarlanmış zırh delici topçu mühimmatının daha büyük kalibreli bir versiyonu."
 sp_land_military_engineering_vehicles:0 "Askeri Mühendislik Araçları"
 sp_land_military_engineering_vehicles_desc:0 "Savaş koşullarında savaş alanı hareketliliğini, tahkimat inşasını ve engel temizliğini artırmak için özel araçlar."
 sp_land_multi_charge_large_caliber_gun:0 "Çok Kademeli Büyük Kalibreli Top"
 sp_land_multi_charge_large_caliber_gun_desc:0 "Çok kademeli itki sistemi ve büyük kalibresi ile bu silah, geniş mesafelere yıkıcı bombardıman yapabilir."
 sp_land_reward_land_cruiser_ammunition:0 "Mühimmat Depolama Çözümü"
 sp_land_reward_land_cruiser_ammunition_desc:0 "Test sırasında, [SpecialProject.GetName] aracının yüksek kalibreli mühimmatının güvenli bir şekilde depolanması ve taşınmasıyla ilgili endişeler ortaya çıktı, çünkü standart raflar patlayıcı mermi ağırlığını güvenli bir şekilde kaldıramıyordu. Güçlendirilmiş perdeler ve hidrolik yükleyiciler kullanan yeni bir bölmeli depolama sistemi önerildi, bu da savaş koşullarında daha güvenli kullanım ve daha hızlı mermi yükleme sağlıyor."
 sp_land_reward_land_cruiser_assembly:0 "Hassas Montaj"
 sp_land_reward_land_cruiser_assembly_desc:0 "Montaj aşamasında mühendisler, [SpecialProject.GetName] aracının taret halkası ve gövde kaplaması gibi devasa bileşenlerini takmak için hassas bir hizalama tekniğini başarıyla geliştirdiler, bu da mekanik gerilim kırılmaları riskini önemli ölçüde azalttı. Bu yenilikçi tekniği, genel olarak yapısal güvenilirliği artırmak için proje boyunca entegre edebiliriz. Bunu nasıl uygulamalıyız?"
 sp_land_reward_land_cruiser_chassis:0 "Şasi Gerilim Arızası"
 sp_land_reward_land_cruiser_chassis_desc:0 "Gerilim testi sırasında, [SpecialProject.GetName] şasisinin muazzam ağırlığı kaldıramadığı ve yapısal deformasyonlara neden olduğu tespit edildi. Tasarım ekibi, aracın ağırlığını daha da artıracak ek takviye eklemek veya potansiyel olarak dayanıklılıktan ödün vererek daha hafif malzemeler kullanmak arasında bölünmüş durumda."
 sp_land_reward_land_cruiser_communication:0 "İletişim Sistemi Sorunu"
 sp_land_reward_land_cruiser_communication_desc:0 "[SpecialProject.GetName] aracının devasa boyutu, mürettebatını koordine etmek için karmaşık bir iç iletişim sistemi gerektiriyor. Mevcut sistem yetersiz kalıyor, emirler gecikiyor veya kayboluyor. Ekip, iletişim akışını iyileştirmek için iç düzeni yeniden tasarlamayı veya daha gelişmiş, ancak test edilmemiş bir sistem kurmayı öneriyor."
 sp_land_reward_land_cruiser_engine:0 "Motor Çıkışı Yetersiz"
 sp_land_reward_land_cruiser_engine_desc:0 "İlk denemeler, prototipin devasa çerçevesinin mevcut motor üzerinde bir yük oluşturduğunu ve [SpecialProject.GetName] aracını hantal ve tepkisiz hale getirdiğini gösteriyor. Ekip iki seçenek öneriyor: yeni, daha güçlü bir motor geliştirmek veya mevcut motorun çıkışını artırmak için modifikasyonlar denemek, bu da motor arızası riski taşıyor."
 sp_land_reward_land_cruiser_overheating:0 "Denemeler Sırasında Aşırı Isınma"
 sp_land_reward_land_cruiser_suspension:0 "Hidropnömatik Süspansiyon Sistemi"
 sp_land_reward_land_cruiser_suspension_desc:0 "Ekip, [SpecialProject.GetName] aracının muazzam ağırlığını dengeleyen, engebeli arazide bile stabilite sağlayan ve paletler üzerindeki gerilimi azaltan son teknoloji bir hidropnömatik süspansiyon sistemini mükemmelleştirdi. [Character.GetName], bu süspansiyonun sahada daha iyi performans için güvenilir bir şekilde uygulanabileceğinden emin."
 sp_land_reward_land_cruiser_track:0 "Palet Sistemi Arızası"
 sp_land_reward_land_cruiser_track_desc:0 "[SpecialProject.GetName] aracının ağırlığı palet sistemini aşırı yükledi ve test sırasında sürekli arızalara yol açtı. Seçenekler, önemli bir yeniden mühendislik gerektirecek olan paletleri güçlendirmek veya yükü hafifletmek için aracın zırhını azaltmaktır."
 sp_land_reward_land_cruiser_turret:0 "Karmaşık Taret Mekanizması"
 sp_land_reward_land_cruiser_turret_desc:0 "Devasa çoklu taret tasarımı, ciddi hizalama ve nişan alma sorunlarına neden oluyor ve silah entegrasyonunu geciktiriyor. Mühendislik ekibi, güvenilirliği artırmak için taret düzenini basitleştirmeyi öneriyor, ancak bunu yapmak [SpecialProject.GetName] aracının planlanan ateş gücünü azaltacaktır."
 sp_land_reward_multi_charge_large_caliber_gun_breakthrough_in_propulsion_technology:0 "İtki Teknolojisinde Atılım"
 sp_land_reward_multi_charge_large_caliber_gun_breakthrough_in_propulsion_technology_desc:0 "[Character.GetName], itki teknolojisinde önemli bir atılım yaparak [SpecialProject.GetName]'in mermilerinin hızını ve gücünü önemli ölçüde artırdı. Bu ilerleme, silahın savaş alanındaki etkinliği için yeni olanaklar açıyor ve projeyi tamamlama yolunda ilerlemeyi hızlandırıyor."
 sp_land_reward_multi_charge_large_caliber_gun_successful_test_firing:0 "Başarılı Ateşleme Testi"
 sp_land_reward_multi_charge_large_caliber_gun_successful_test_firing_desc:0 "[SpecialProject.GetName] topu, etkileyici menzilini ve isabetliliğini gösteren bir dönüm noktası test atışını başarıyla tamamladı. Bu başarı, araştırma ekibi arasında morali yükseltti ve üst düzey yetkililerin dikkatini çekti, projeye ivme kazandırdı ve başarısı için yenilenmiş bir iyimserlik sağladı."
 sp_land_reward_multi_charge_large_caliber_gun_test_failure:0 "Feci Patlama"
 sp_land_reward_multi_charge_large_caliber_gun_test_failure_desc:0 "Kritik bir test denemesi sırasında, test sahasını sarsan feci bir patlama meydana geldi, topu havaya uçurdu ve yakındaki altyapıya önemli hasar verdi. [Character.GetName]'in ekibi patlamanın nedenini araştırıyor ve halkın incelemesi ve proje takvimindeki potansiyel aksaklıklar dahil olmak üzere olayın sonuçlarını yönetiyor."
