 sp_land_reward_option_stronghold_network_breakthrough_in_concrete_reinforcement_01_apply_and_document_discovery:0 "Keşfi Uygula ve Belgele"
 sp_land_reward_option_stronghold_network_breakthrough_in_concrete_reinforcement_01_use_in_current_project:0 "Mevcut Projede Kullan"
 sp_land_reward_option_stronghold_network_collapse_01:0 "Tünel İnşaatı Sırasında Çökme"
 sp_land_reward_option_stronghold_network_collapse_01_continue_without_delay:0 "Gecikmeden Devam Et"
 sp_land_reward_option_stronghold_network_collapse_01_desc:0 "Ana sığınaklardan birinin altındaki bir tünel beklenmedik bir şekilde çöktü, operasyonları denetleyen baş bilim insanı [Character.GetName] ve birkaç işçi enkaz altında kaldı. Mahsur kalan personeli kurtarmak için acil önlemler alınmalıdır, ancak olay genel ilerlemede zaten bir gecikmeye neden oldu."
 sp_land_reward_option_stronghold_network_collapse_01_prioritize_safety:0 "İşçilerin Güvenliğine Öncelik Ver"
 sp_land_reward_option_stronghold_network_collapse_01_prioritize_scientist:0 "Baş Bilim İnsanımıza Öncelik Ver"
 sp_land_reward_option_stronghold_network_collapse_02:0 "$sp_land_reward_option_stronghold_network_collapse_01$"
 sp_land_reward_option_stronghold_network_collapse_02_desc:0 "Ana sığınaklardan birinin altındaki bir tünel beklenmedik bir şekilde çöktü, birkaç işçi mahsur kaldı ve inşaat durdu. Durumu ele almak ve mahsur kalan personeli güvenli bir şekilde çıkarmak için acil önlemler alınmalıdır, ancak olay genel ilerlemede zaten bir gecikmeye neden oldu."
 sp_land_reward_option_stronghold_network_communication_system_overhaul_further_study:0 "Daha Fazla Çalışma"
 sp_land_reward_option_stronghold_network_communication_system_overhaul_standardize:0 "Standardize Et"
 sp_land_reward_option_stronghold_network_leadership_approach_office_planning:0 "Ofis Planlaması"
 sp_land_reward_option_stronghold_network_leadership_approach_oversee_work_personally:0 "Çalışmayı Şahsen Denetle"
 sp_land_reward_option_super_heavy_howitzer_focus_preference_balance:0 "Dengeyi Koru"
 sp_land_reward_option_super_heavy_howitzer_focus_preference_firepower:0 "Ateş Gücüne Odaklan"
 sp_land_reward_option_super_heavy_howitzer_focus_preference_production:0 "Hızlı Üretime Odaklan"
 sp_land_reward_self_propelled_super_heavy_howitzer_focus_preference:0 "$sp_land_reward_super_heavy_howitzer_focus_preference$"
 sp_land_reward_self_propelled_super_heavy_howitzer_focus_preference_desc:0 "$sp_land_reward_super_heavy_howitzer_focus_preference_desc$"
 sp_land_reward_stronghold_network_breakthrough_in_concrete_reinforcement_01:0 "Beton Güçlendirmede Atılım"
 sp_land_reward_stronghold_network_breakthrough_in_concrete_reinforcement_01_desc:0 "Genç mühendislerden biri, standart tahkimatlara uygulanabilecek yeni bir güçlendirme yöntemi keşfetti. Bunu şimdi belgelemek, bilim insanlarımıza ve mühendislerimize gelecekteki araştırmalarda bir avantaj sağlayabilir."
 sp_land_reward_stronghold_network_breakthrough_in_concrete_reinforcement_02:0 "$sp_land_reward_stronghold_network_breakthrough_in_concrete_reinforcement_01$"
 sp_land_reward_stronghold_network_breakthrough_in_concrete_reinforcement_02_desc:0 "Genç mühendislerden biri tarafından keşfedilen yeni bir güçlendirme yöntemi, daha fazla değerlendirme için harici bir araştırma ekibine iletildi. Bulgular hala incelenmekte olsa da, uygun görülürse teknik mevcut projeye hala uygulanabilir."
 sp_land_reward_stronghold_network_communication_system_overhaul:0 "İletişim Sistemi Revizyonu"
 sp_land_reward_stronghold_network_communication_system_overhaul_desc:0 "Test kompleksinin iç iletişim ağını test ederken, ekip, geleneksel kale tasarımlarında benzer sistemleri geliştirmek için kullanılabilecek verimsizlikler tespit etti."
 sp_land_reward_stronghold_network_delayed_by_concrete_shortage:0 "Beton Kıtlığı Nedeniyle Gecikti"
 sp_land_reward_stronghold_network_integration_of_anti_blast_doors:0 "Patlama Önleyici Kapıların Entegrasyonu"
 sp_land_reward_stronghold_network_leadership_approach:0 "Liderlik Yaklaşımı"
 sp_land_reward_stronghold_network_leadership_approach_desc:0 "Proje ilerledikçe, baş bilim insanı [Character.GetName], [Character.GetSheHe] günlük operasyonlara ne kadar dahil olacağına karar vermelidir. [Character.GetSheHeCap], hassas uygulamayı sağlayarak inşaatı doğrudan sahada denetlemeyi veya strateji ve planlamaya odaklanarak ofiste kalmayı seçebilir."
 sp_land_reward_stronghold_network_structural_weakness_discovered:0 "Yapısal Zayıflık Keşfedildi"
 sp_land_reward_stronghold_network_underground_rail_systems:0 "Yeraltı Ray Sistemleri"
 sp_land_reward_super_heavy_howitzer_focus_preference:0 "Tasarım Odağı"
 sp_land_reward_super_heavy_howitzer_focus_preference_desc:0 "Geliştirme ilerledikçe, kritik bir karar verilmelidir: Hızlı üretime ve daha küçük kalibreli toplara öncelik verebiliriz veya eşsiz ateş gücü ve yıkıcı etki için üretim verimliliğinden feragat ederek daha büyük ve daha ağır toplara yatırım yapabiliriz."
 sp_land_self_propelled_super_heavy_howitzer:0 "KMT Süper Ağır Obüs"
 sp_land_self_propelled_super_heavy_howitzer_desc:0 "Çekili muadiline göre savaş alanında daha fazla manevra kabiliyetine sahip, kendi kendine hareket eden devasa bir topçu parçası, aynı zamanda daha da büyük bir kalibreyi barındırır."
 sp_land_stronghold_network:0 "Tahkimat Ağı"
 sp_land_stronghold_network_desc:0 "Yoğun saldırılara dayanmak ve kritik stratejik konumları düşman saldırılarından korumak için inşa edilmiş, ağır şekilde tahkim edilmiş sığınaklar ve direnek noktalarından oluşan karmaşık bir ağ."
 sp_land_super_heavy_howitzer:0 "Süper Ağır Obüs"
 sp_land_super_heavy_howitzer_desc:0 "Geniş bir kalibreye sahip, eşi benzeri görülmemiş yıkıcı güçle düşman savunmalarına büyük zarar verebilecek müthiş bir topçu parçası."
