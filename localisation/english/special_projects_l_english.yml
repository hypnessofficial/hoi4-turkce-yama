 sp_naval_super_heavy_battleship_preference_c_b:0 "Torpido Karşı Tedbirleri"
 sp_naval_super_heavy_battleship_tt:0 "Teknoloji ekle: §YSüper Ağır Gövde§!"
 sp_naval_super_heavy_battleship_unique_reward_a:0 "Öncelikler Meselesi - Saldırı"
 sp_naval_super_heavy_battleship_unique_reward_a_desc:0 "Yeni bir zırhlı sınıfı tasarlamak, bize deniz savaş alanına hükmetme yeteneğimizi geliştirme fırsatı veriyor. Neye öncelik vermeliyiz?"
 sp_naval_super_heavy_battleship_unique_reward_b:0 "Öncelikler Meselesi - Savunma"
 sp_naval_super_heavy_battleship_unique_reward_b_desc:0 "En üst düzey deniz komutanlarımız bize imkansız bir görev verdi, bu gemiyi neredeyse yenilmez yapmak - ve bunun imkansız olduğunu bilsek de, en azından öyle yapmaya çalışabiliriz. Bu sefer önceliğimiz ne olmalı?"
 sp_naval_support_ships:0 "Destek Gemileri"
 sp_naval_support_ships_desc:0 "Destek Gemileri, filolarımızı uzun süreli konuşlandırmalar sırasında bile yüzer ve etkili tutarak denizdeki üstünlüğümüzü korumaya yardımcı olacaktır."
 sp_naval_support_ships_preference_a_a:0 "Azınlığın ihtiyacı"
 sp_naval_support_ships_preference_a_b:0 "Daha Geniş Kapsama"
 sp_naval_support_ships_preference_b_a:0 "Dengeyi bul"
 sp_naval_support_ships_preference_b_b:0 "Dengeyi bul"
 sp_naval_support_ships_preference_c_a:0 "Çoğunluğun ihtiyacı"
 sp_naval_support_ships_preference_c_b:0 "Konsantre Çabalar"
 sp_naval_support_ships_unique_reward_a:0 "Yardımcı Gemiler - Destek Odaklı"
 sp_naval_support_ships_unique_reward_a_desc:0 "Destek gemilerinin değeri tartışılmaz olsa da, operasyonel odaklarının ne olacağına karar vermeliyiz: az sayıda geminin odaklanmış ikmali mi, yoksa tüm filonun depolarının genel olarak doldurulması mı."
 sp_naval_support_ships_unique_reward_b:0 "Yardımcı Gemiler - Onarım Çabaları"
 sp_naval_support_ships_unique_reward_b_desc:0 "Onarım gemisi organizasyonumuz için kilit soru: ya çok sayıda gemiye yavaşça hizmet verebilen çok sayıda küçük onarım ekibi ya da daha az gemiyi daha kapsamlı bir şekilde onarabilen daha az sayıda daha donanımlı ekip."
 sp_naval_torpedo_cruiser:0 "Torpido Kruvazörü"
 sp_naval_torpedo_cruiser_desc:0 "Geçen yüzyılın konsepti olan Jeune École'ye göre Torpido Kruvazörlerini kullanarak düşmanlarımızın en önemli ve pahalı gemilerine önemli hasar verebiliriz."
 sp_naval_torpedo_cruiser_free_design:0 "Torpido Kruvazörü"
 sp_naval_torpedo_cruiser_preference_a:0 "Güç - Torpidolar"
 sp_naval_torpedo_cruiser_preference_b:0 "Zayıflık - Muhripler"
 sp_naval_torpedo_cruiser_unique_reward_a:0 "İkinci Şans - Torpido Kruvazörü"
 sp_naval_torpedo_cruiser_unique_reward_a_desc:0 "Eski bir Torpido Kruvazörü konseptinin yeniden canlandırılmasıyla, filomuzdaki rolü hakkında önemli bir karar vermemiz gerekiyor: güçlerine - torpidolara mı odaklanmalıyız; yoksa birincil zayıflıklarını - Muhriplerle savaşmayı mı ele almalıyız?"
 sp_naval_underway_replenishment:0 "Seyir Halinde İkmal"
 sp_naval_underway_replenishment_desc:0 "Donanmaları ana üslerinden uzakta ikmal etmek her zaman sınırlayıcı bir faktör olmuştur. Filolarımız aşırı menzillerde faaliyet gösterirken, ikmal için yeni yöntemler geliştirmemiz gerekiyor."
 sp_naval_underway_replenishment_preference_a:0 "Daha Uzun Menzil"
 sp_naval_underway_replenishment_preference_b:0 "Daha Düşük Konvoy Kullanımı"
 sp_naval_underway_replenishment_preference_c:0 "Bir Denge Bul"
 sp_naval_underway_replenishment_unique_reward_a:0 "İkmal Ölçeği"
 sp_naval_underway_replenishment_unique_reward_a_desc:0 "Seyir halinde ikmal sistemini mümkün olduğunca sorunsuz çalıştırmak için hala çalışırken, bir karar daha vermemiz gerekiyor - orijinal tahminlerimizi değiştirmek istiyor muyuz, istemiyor muyuz?"
 sp_no_nukes_available_tt:0 "$sp_thermonuclear_bomb_test_reward_option_no$"
 sp_nuclear_bomb:0 "Nükleer Fisyon Bombası Projesi"
 sp_nuclear_bomb_accident_generic_reward:0 "Kaza Yangını"
 sp_nuclear_bomb_accident_generic_reward_desc:0 "Tesisteki depolardan birinde bir yangın çıktı. İlk incelemeler bunun bir kaza olduğuna işaret ediyor. Ama gerçekten öyle miydi?"
 sp_nuclear_bomb_breakthrough_plutonium_reward:0 "Plütonyum Üretiminde Atılım"
 sp_nuclear_bomb_breakthrough_plutonium_reward_desc:0 "Bilim insanlarımız, Plütonyum üretim tekniklerinde önemli bir atılım yaparak bomba üretiminin verimliliğini artırdı. Bu, umarız geliştirme takvimini hızlandırır."
 sp_nuclear_bomb_critical_mass_generic_reward:0 "Kritik Kütle Deneyi Ters Gitti"
 sp_nuclear_bomb_critical_mass_generic_reward_desc:0 "Kritik kütleyi belirleme deneyleri sırasında kritik bir kaza meydana geldi, bu da kilit personel arasında radyasyona maruz kalmaya ve kayıplara yol açtı."
 sp_nuclear_bomb_desc:0 "Atomun depolanmış enerjisini tek bir kıyamet anında serbest bırakmak için nükleer fisyon sürecini kullanan bir bomba. Cephaneliğimizde böyle bir silah varken, kim bize karşı çıkmaya cüret edebilir?"
 sp_nuclear_bomb_design_choice_reward:0 "Basit mi Karmaşık mı Bomba Tasarımı"
 sp_nuclear_bomb_design_choice_reward_desc:0 "Bilim insanlarımız tarafından takip edilen iki atom silahı tasarımı var ve bunlarla nasıl ilerleneceği konusunda bir tartışma ortaya çıktı. 'Gun type' olarak bilinen bir tasarım, yaratması çok daha basit ancak nükleer malzeme kullanımında daha az verimlidir. Diğeri ise 'implosion' tipi, çok daha zorlu bir tasarım ancak teorik olarak nükleer malzeme kullanımında daha verimlidir."
 sp_nuclear_bomb_design_choice_reward_gun_type:0 "'Gun' tipi daha güvenli bir bahis."
 sp_nuclear_bomb_design_choice_reward_implosion:0 "'Implosion' üstün bir tasarımdır."
 sp_nuclear_bomb_espionage_threats_reward:0 "Casusluk Tehditleri"
 sp_nuclear_bomb_espionage_threats_reward_desc:0 "Güvenlik görevlileri, ¨[SpecialProject.GetName] projesinin sahasında ve çevresindeki tüm faaliyetlerde güvenliği artırma ihtiyacı olduğunu savunuyor. Araştırmacılar, [Character.GetName] önderliğinde, serbestçe hareket etme ve iletişim kurma özgürlüğünün ilerleme için hayati olduğunu savunuyor."
 sp_nuclear_bomb_espionage_threats_reward_increase_security:0 "Güvenliği Artır"
 sp_nuclear_bomb_espionage_threats_reward_increase_security_tt:0 "Artırılmış Güvenlik, bilgi hırsızlığı riskini azaltır"
 sp_nuclear_bomb_espionage_threats_reward_no:0 "Güvenliği artırma"
 sp_nuclear_bomb_information_leak_reward:0 "Bilgi Sızıntısı"
 sp_nuclear_bomb_information_leak_reward_desc:0 "[SpecialProject.GetName] projesindeki işçilerden birinin yabancı ajanlara bilgi sızdırdığı anlaşılıyor. Bunun kasıtlı olup olmadığı henüz bilinmiyor. Aynı şekilde bunun projeye ne kadar zarar verdiğini belirlemek de zor."
 sp_nuclear_bomb_information_leak_reward_tt:0 "Proje ilerlemesi kazanır"
 sp_nuclear_bomb_test_prototype_reward:0 "Prototip Bomba"
 sp_nuclear_bomb_test_prototype_reward_desc:0 "[Character.GetName]'in ekibi tarafından bir Prototip Bomba üretildi. Başarılı bir test yapmak ve değerlendirmek, ilerlememizi önemli ölçüde artıracaktır. Öte yandan, şimdi bir nükleer bombamız var..."
 sp_nuclear_bomb_test_prototype_reward_keep_bomb:0 "Bunu düşmanlarımıza karşı kullanabiliriz"
 sp_nuclear_bomb_test_prototype_reward_test_bomb:0 "Kontrollü bir şekilde test et"
 sp_nuclear_bomb_theoretical_breakthrough_generic_reward:0 "Teorik Atılım"
 sp_nuclear_bomb_theoretical_breakthrough_generic_reward_desc:0 "[Character.GetName], en son prototiple çalışırken karmaşık bir teorik problemi çözmeyi başardı. Bu, bomba tasarımının kolaylaştırılmasına yol açtı, bu da üretimini daha az zor hale getirecektir."
 sp_nuclear_bomb_tt:0 "Nükleer reaktörler §YNükleer Bomba§! üretmeye başlar."
 sp_nuclear_design_choice_reward:0 "Reaktör Tasarımı"
 sp_nuclear_design_choice_reward_desc:0 "Bir reaktör tasarlamaya çalışırken, moderatör için hangi malzemeyi kullanacağımızı seçmemiz gerekiyor. Bu, tüm reaktörün tasarımını belirleyecektir. Ağır Su kullanabiliriz veya Grafit kullanabiliriz, her ikisinin de artıları ve eksileri var..."
 sp_nuclear_design_choice_reward_graphite:0 "Saf grafit daha iyi bir moderatördür"
 sp_nuclear_design_choice_reward_heavy_water:0 "Ağır su daha ucuz olacaktır"
 sp_nuclear_engines:0 "Sonsuza dek çalışabilen motorlar - yakıt ikmaline gerek duymadan. Bu, atom enerjisinin vaadidir. Mühendislerimizin yerine getirmeye çok yakın olduğumuzu söylediği bir vaat."
 sp_nuclear_engines_desc:0 "Sonsuza kadar çalışabilen motorlar - yakıt ikmaline gerek duymadan. Bu, atom enerjisinin vaadidir. Mühendislerimizin yerine getirmeye çok yakın olduğumuzu söylediği bir vaat."
 sp_nuclear_generic_electronics_tech_reward:0 "Teknolojik Yenilik"
 sp_nuclear_generic_electronics_tech_reward_desc:0 "Projenin son yinelemesinde önemli öğrenimler elde edildi. Umarım bunu pratik kullanıma sokabiliriz, bu da ilgili alanlardaki araştırmaları hızlandırmamızı sağlamalıdır."
 sp_nuclear_generic_industry_tech_reward:0 "Teknolojik Gelişmeler"
 sp_nuclear_generic_industry_tech_reward_desc:0 "Proje üzerindeki çalışma sırasında, mühendislerimiz diğer alanlarda da kullanılabilecek birçok yeni icat yaptı."
 sp_nuclear_generic_reward_option_electronics_tech_bonus_name:0 "Gelişmiş Elektronik Araştırması."
 sp_nuclear_generic_reward_option_industry_tech_name:0 "Gelişmiş Endüstriyel Araştırma"
 sp_nuclear_isotope_separation_choice_reward:0 "İzotop Ayırma Tesisleri"
 sp_nuclear_isotope_separation_choice_reward_centrifugal:0 "Santrifüjler uzun vadede daha verimli olacaktır."
 sp_nuclear_isotope_separation_choice_reward_desc:0 "Reaktörlerimize nükleer yakıt sağlamak için, uranyumun faydalı izotoplarını geri kalanından ayırmak için bir süreç belirlememiz gerekiyor. Ayırma tesisleri için bir dizi öneri var ancak önde gelen iki tanesi gazlı ve santrifüjlü."
 sp_nuclear_isotope_separation_choice_reward_gaseous:0 "Gazlı, kanıtlanmış bir tekniktir."
 sp_nuclear_major_breakthrough_reward:0 "Nükleer Reaksiyonlarda Büyük Atılım"
 sp_nuclear_major_breakthrough_reward_desc:0 "Sınırlı nükleer malzememizle yapılan kontrollü bir deney, amaçlanan tasarımımızın fizibilitesini göstermiştir. Bu, projeyi yenilenmiş bir coşkuyla ileriye taşımıştır."
 sp_nuclear_major_political_interference_generic_reward:0 "Büyük Siyasi Müdahale"
 sp_nuclear_major_political_interference_generic_reward_desc:0 "[SpecialProject.GetName] projesi, siyasi liderlerin artan incelemesi ve müdahalesi altına girdi, bu da gecikmelere neden oldu ve potansiyel olarak proje liderliğinde değişiklikleri zorladı. Bu durum [Character.GetName] adlı kişiyi öfkelendirdi. Projeyi yolunda tutmak için bu siyasi zorluklarla başa çıkmalıyız."
 sp_nuclear_major_political_interference_generic_reward_option_fire:0 "[(Character?.GetName:'CAP_SCIENTIST)] görevden alınsın"
 sp_nuclear_major_political_interference_generic_reward_option_keep:0 "[(Character?.GetName:'CAP_SCIENTIST)] kalsın"
 sp_nuclear_minor_progress_generic_reward:0 "Küçük Atılım"
 sp_nuclear_minor_progress_generic_reward_desc:0 "Bilim insanlarımız en son prototip üzerinde çalışırken gerçekten çığır açan bazı keşifler yaptılar. Bulguları, alandaki bilgimizi ve araştırmamızı önemli ölçüde ilerletti."
 sp_nuclear_missile_submarine_eq_bonus_stealth:0 "Nükleer Füze Denizaltısı - Gizlilik Odağı"
 sp_nuclear_missile_submarine_eq_bonus_strength:0 "Nükleer Füze Denizaltısı - Artırılmış Dayanıklılık"
 sp_nuclear_project_events.1.a:0 "Bu faydalı olabilir"
 sp_nuclear_project_events.1.desc:0 "Tamamen tesadüfi olmasına rağmen, [FROM.GetNameDef] ülkesindeki ajanlarımız gizli bir proje hakkında bilgi edinmeyi başardılar. Gizli bir silah, bir atom bombası geliştirilmesinde yer alan bir işçi, ajanlarımızdan birinin de katıldığı küçük bir sosyal toplantıda işinden bahsetti."
 sp_nuclear_project_events.1.t:0 "Bilgi Sızıntısı"
 sp_nuclear_reactor:0 "Nükleer Reaktör"
 sp_nuclear_reactor_desc:0 "Deneyler, atomları fisyon yoluyla bölmenin büyük miktarda enerji açığa çıkardığını kanıtladı; bu enerji, güç üretimi için kullanılabilir. Ya da belki de bombalar için yakıt olarak..."
 sp_nuclear_reactor_minor_explosion_reward:0 "Küçük Patlama, Yaralanma Yok"
 sp_nuclear_reactor_minor_explosion_reward_desc:0 "Nükleer reaktör prototipinin son yinelemesi üzerinde çalışırken küçük bir olay yaşandı. Küçük bir patlama meydana geldi, laboratuvarın bazı kısımlarına zarar verdi, ancak çıkan yangın kolayca söndürülebildi. Laboratuvar onarıldıktan sonra, çalışmalar sadece hafif bir gecikmeyle planlandığı gibi devam edebilmelidir."
 sp_nuclear_reactor_radioactive_leak_stabilized_reward:0 "Radyoaktif Sızıntı - Kontrol Altında"
 sp_nuclear_reactor_radioactive_leak_stabilized_reward_desc:0 "Maalesef reaktörle çalışırken ciddi bir olay yaşandı. Personelin hızlı müdahalesi sayesinde hasar kontrol altına alındı ve ekip olaydan değerli veriler elde edebildi."
 sp_nuclear_reactor_tested_reward:0 "İlk Başarılı Nükleer Reaktör Testi"
 sp_nuclear_reactor_tested_reward_desc:0 "İlk nükleer reaktörümüz başarıyla test edildi ve kontrollü nükleer fisyonun fizibilitesi kanıtlandı. Bu atılım, yeni bir enerji üretim çağını ve potansiyel olarak çok daha fazlasını vaat ediyor."
 sp_nuclear_reactor_tested_reward_public:0 "Başarıyı halka açık bir şekilde kutla"
 sp_nuclear_reactor_tested_reward_public_tt:0 "Diğer ülkeler bundan faydalanabilir"
 sp_nuclear_reactor_tested_tech_bonus:0 "Nükleer Testler Hakkında Bilgi Alındı"
 sp_nuclear_scientist_xp_generic_reward:0 "Yeni Öğrenimler"
 sp_nuclear_scientist_xp_generic_reward_desc:0 "TODO_TA"
 sp_nuclear_submarine_eq_bonus_ic_reduction:0 "Nükleer Denizaltı - Daha Ucuz İnşaat"
 sp_nuclear_submarine_eq_bonus_quality:0 "Nükleer Denizaltı - Kalite Odağı"
 sp_nuclear_war_support_generic_reward:0 "Halk Desteği"
 sp_nuclear_war_support_generic_reward_desc:0 "Başarılı bir test ve ilgili, sıkı bir şekilde kontrol edilen medya kapsamı, halkın tüm düşmanları yenmek için kullanılabilecek bir tür süper silah geliştirmeye yaklaştığımızı anlamasına yol açtı."
 sp_nuclear_warheads:0 "Nükleer Savaş Başlıkları"
 sp_nuclear_warheads_desc:0 "Yoğunlaştırılmış nükleer silahlar yaratarak, bunları geniş bir yelpazedeki roket tabanlı fırlatma sistemlerinde bir yük olarak kullanabileceğiz, bu da bize geniş mesafelerden saldırma olanağı sağlayacak."
 sp_rocket_design_choice_reward:0 "Menzil mi Yük mü?"
 sp_rocket_design_choice_reward_balanced:0 "Dengeli"
 sp_rocket_design_choice_reward_desc:0 "Uçan bombamızı tasarlarken, mühendislerimiz bombanın tasarımının ana amacının ne olduğuna karar vermenin önemli olduğunu savunuyorlar. Menzili en üst düzeye çıkarmak mı istiyoruz, yoksa yük en önemli konu mu?"
 sp_rocket_design_choice_reward_payload:0 "Yük"
 sp_rocket_design_choice_reward_range:0 "Menzil"
 sp_rocket_glass_wool_choice_reward:0 "Yeniden Girişte Buzlanma"
 sp_rocket_glass_wool_choice_reward_accept:0 "Talihsiz, ama gerekli."
 sp_rocket_glass_wool_choice_reward_desc:0 "Roketin uçuşunun yeniden giriş aşamasında, yakıt tanklarının etrafında buz oluştuğu ve roketin iç kısımlarına müdahale ettiği görülüyor. Bir aksilik olmasına rağmen, mühendislerimiz gelecekte bunun olmasını önlemek için tankların etrafına cam yünü eklemeyi önerdiler."
 sp_rocket_guidance_system_choice_reward:0 "Güdüm Sistemi"
 sp_rocket_guidance_system_choice_reward_desc:0 "Mühendislerimiz roketin güdüm sistemi üzerinde tartışıyorlar. Bazıları test edilmiş bir mekanik bilgisayarda kalmak isterken, diğerleri fırlatma sonrası roketi kontrol etmek ve izlemek için yeni radyo teknolojilerinden yararlanmak istiyor."
 sp_rocket_guidance_system_choice_reward_mechanical:0 "Mekanik güvenilirdir."
 sp_rocket_guidance_system_choice_reward_radio:0 "Radyo gelecektir!"
 sp_rocket_interceptor:0 "Roket Önleme Uçağı"
 sp_rocket_interceptor_desc:0 "Bir roketin gücünü küçük bir şasinin manevra kabiliyeti ile birleştirerek, eşsiz bir önleme uçağı yaratacağız."
 sp_rocket_launch_site_choice_reward:0 "Fırlatma Üssü Sorunları"
 sp_rocket_launch_site_choice_reward_accept:0 "Yeni bir tesise yatırım yapacağız."
 sp_rocket_launch_site_choice_reward_desc:0 "Yeni roketin devasa ölçeği, amaçlanan fırlatma sahasında kısıtlamalara neden oluyor. Proje yöneticileri bu nedenle başka bir yerde inşa edilecek yeni, amaca yönelik bir saha için fon talep ediyorlar."
 sp_rocket_launch_site_choice_reward_reject:0 "Mevcut sahayı çalıştırmanın bir yolunu bulun."
 sp_rocket_outercoating_reward:0 "Roket Pası"
 sp_rocket_outercoating_reward_accept:0 "Belki bir yağlayıcı uygulanabilir?"
 sp_rocket_outercoating_reward_desc:0 "Roketin dış kaplamasıyla ilgili endişeler dile getirildi. Uzun bir süre bırakıldığında, malzemeler genellikle paslanıyor ve aşınıyor. Bir çözüm bulunmazsa bu, roketi çalışmaz hale getirebilir."
 sp_rocket_relay_failure_reward:0 "Röle Arızası"
 sp_rocket_relay_failure_reward_accept:0 "Şu röleleri tamir ettirin."
 sp_rocket_relay_failure_reward_desc:0 "Test fırlatmamıza hazırlanırken roketin iç kontrol sistemleri için kullanılan arızalı bir röle tespit edildi. Mühendisler devam etmeden önce röleyi değiştirmemiz gerektiğine inanıyorlar, ancak bir gecikmenin siyasi sonuçları konusundaki endişeler artıyor."
 sp_rocket_relay_failure_reward_reject:0 "Daha fazla gecikemeyiz."
 sp_rocket_submarine_eq_bonus_range_increase:0 "Füze Fırlatan Denizaltı - Genişletilmiş Menzil"
 sp_rocket_submarine_eq_bonus_reliability:0 "Füze Fırlatan Denizaltı - Güvenilirlik Odağı"
 sp_rocket_submarine_eq_bonus_stealth:0 "Füze Fırlatan Denizaltı - Gizlilik Odağı"
 sp_rocket_turbo_pump_froth_reward:0 "Turbopompa Köpürme Sorunu"
 sp_rocket_turbo_pump_froth_reward_accept:0 "Bunu çözmeliyiz!"
 sp_rocket_turbo_pump_froth_reward_desc:0 "Yüksek irtifa testi sırasında, turbopompa ile ilgili bir sorun tespit edildi. Görünüşe göre pompaların içindeki yağlayıcı, zorlu koşullar altında köpürmeye başlıyor, bu da mevcut tasarımın genel performansını ve güvenilirliğini etkiliyor."
 sp_rocket_wind_tunnel_choice_reward:0 "Mühendisler Rüzgar Tüneli Talep Ediyor"
 sp_rocket_wind_tunnel_choice_reward_agree:0 "Kaynakları tahsis et."
 sp_rocket_wind_tunnel_choice_reward_desc:0 "Balistik füze projesindeki mühendisler, tasarımlarının ölçekli modellerini daha erken test etmek için süpersonik bir rüzgar tüneli inşa edilmesini talep ettiler. Bu, yineleme süreçlerini hızla hızlandıracak ve uzun vadede kaynak tasarrufu sağlayacaktır."
 sp_rocket_wind_tunnel_choice_reward_reject:0 "Kaynaklara başka yerde ihtiyaç var."
 sp_rockets_ballistic_missile:0 "Balistik Füze"
 sp_rockets_ballistic_missile_desc:0 "Eşi benzeri görülmemiş bir hız ve isabetle büyük mesafelerden bir savaş başlığı taşıyabilen güdümlü bir balistik füze."
 sp_rockets_experimental_rockets:0 "Deneysel Roketler"
 sp_rockets_experimental_rockets_desc:0 "$experimental_rockets_desc$"
 sp_rockets_experimental_rockets_improved_accuracy_reward:0 "İsabet İyileştirmeleri"
 sp_rockets_experimental_rockets_stability_improvements_reward:0 "Geliştirilmiş Roket Uçuş Stabilitesi"
 sp_rockets_flying_bomb:0 "Uçan Bomba"
 sp_rockets_flying_bomb_desc:0 "Bir roket motoru kullanan, önemli bir yük taşıyan insansız bir hava aracı, düşmanlarımızın kalbine korku salarak onları demoralize edebilmelidir."
 sp_rockets_flying_bomb_engine_optimization_breakthrough_reward:0 "Motor Optimizasyonu Atılımı"
 sp_rockets_flying_bomb_engine_optimization_breakthrough_reward_desc:0 "Mühendislerimiz, darbe jetinin menzilini ve güvenilirliğini önemli ölçüde iyileştirerek füzenin operasyonel kabiliyetini artırmayı başardı."
 sp_rockets_flying_bomb_launch_ramp_innovations_reward:0 "Fırlatma Rampası Yenilikleri"
 sp_rockets_flying_bomb_launch_ramp_innovations_reward_desc:0 "Mühendislerimiz, füzelerin konuşlandırılması için gerekli olan özel fırlatma rampalarında önemli iyileştirmeler yaptı."
 sp_rockets_flying_bomb_launch_ramp_innovations_reward_option:0 "İyi haber"
 sp_rockets_flying_bomb_mass_production_scaling_reward:0 "Seri Üretime Geçiş"
 sp_rockets_flying_bomb_mass_production_scaling_reward_desc:0 "Seri üretime çok daha hızlı geçmemizi sağlayacak üretim iyileştirmeleri bulmayı başarıyla başardık."
 sp_rockets_flying_bomb_technical_breakthrough_in_pulsejet_design_reward:0 "Darbe Jet Tasarımında Teknik Atılım"
 sp_rockets_flying_bomb_technical_breakthrough_in_pulsejet_design_reward_desc:0 "Mühendislerimiz, füzenin menzili ve hızı için hayati olan darbe jet motorunun tasarımında önemli engelleri aştı."
 sp_rockets_flying_bomb_technological_innovation_in_guidance_systems_reward:0 "Güdüm Sistemlerinde Teknolojik Yenilik"
 sp_rockets_flying_bomb_technological_innovation_in_guidance_systems_reward_desc:0 "En son prototip turunda, güdüm sisteminin isabetliliğinde ve karıştırmaya karşı direncinde önemli iyileştirmeler yapıldı, bu da teknolojik avantajımızı artırdı."
 sp_rockets_flying_bomb_test_flight_failures_reward:0 "Test Uçuşu Hataları"
 sp_rockets_flying_bomb_test_flight_failures_reward_desc:0 "İlk test uçuşları, güdüm sistemi arızaları ve yapısal zayıflıklar nedeniyle başarısızlıkla sonuçlandı. Bilim insanlarımız bundan çok şey öğrendi, ancak bir adım geri atıp yeniden düşünmemiz gerekiyor."
 sp_rockets_generic_avionics_advancements_reward:0 "Aviyonik Gelişmeler"
 sp_rockets_generic_avionics_advancements_reward_desc:0 "Çalışmalarımız sırasında, genel Aviyonik ve Aerodinamik alanında uçak üretimimize fayda sağlayabilecek birçok bulgu elde ettik."
 sp_rockets_generic_major_breakthrough_reward:0 "Büyük Atılım"
 sp_rockets_generic_major_breakthrough_reward_desc:0 "Son prototip yinelemesi sırasında, büyük bir atılım yapmayı başardık."
 sp_rockets_ground_control_improvements_reward:0 "Yer Kontrolü İyileştirmeleri"
 sp_rockets_ground_control_improvements_reward_desc:0 "[Character.GetName], füzenin yerden takibi ve kontrolü ile ilgili birkaç önemli sorunu çözmeyi başardı. Bu, düşman yüksek irtifa uçaklarını hedefleme yeteneğine doğru önemli bir adım anlamına geliyor."
 sp_rockets_ground_to_air_missile:0 "Karadan Havaya Füzeler"
 sp_rockets_ground_to_air_missile_desc:0 "Tek bir vuruşla bir bombardıman uçağını gökyüzünden indirebilen büyük, roketle çalışan bir uçaksavar füzesi. Bu, kesinlikle hava savunmasının geleceğini şekillendirecektir."
 sp_rockets_high_speed_flight_control_bonus:0 "Yüksek Hızlı Uçuş Kontrolleri"
 sp_rockets_high_speed_flight_control_reward:0 "Yüksek Hızlı Uçuş Kontrolü"
 sp_rockets_high_speed_flight_control_reward_desc:0 "Nihayet yüksek hızlarda çalışabilen ve değişen uçuş dinamiklerine tepki verebilen bir çalışma kontrol sistemi elde etmeyi başardık. Bu bilgi kesinlikle diğer alanlarda da faydalı olabilir."
 sp_rockets_long_range_ballistic_missile:0 "KABF"
 sp_rockets_long_range_ballistic_missile_desc:0 "Muhtemelen inşa etmemiz gereken en büyük füze olan kıtalararası bir balistik füze, kürenin hemen hemen her yerine büyük bir isabetle bir savaş başlığı taşıyabilir."
 sp_rockets_medium_range_ballistic_missile:0 "OABF"
 sp_rockets_medium_range_ballistic_missile_desc:0 "Orta menzilli balistik füzeler, bir kıta boyunca şaşırtıcı bir isabet ve yıkıcı bir etki ile bir savaş başlığı taşımamızı sağlayacaktır."
 sp_rockets_onsite_explosion_generic_reward:0 "Sahada Patlama"
 sp_rockets_onsite_explosion_generic_reward_desc:0 "Testlerden biri sırasında meydana gelen büyük bir patlama, tesisin bazı kısımlarında ciddi hasara yol açtı, ancak aynı zamanda bilim insanlarımız için yeni bilgiler de sağladı"
 sp_rockets_political_interference_generic_reward:0 "Siyasi Müdahale"
 sp_rockets_political_interference_generic_reward_desc:0 "Politikacıların olmamaları gereken yerlere karışması, projenin zaten yapılmış olan şeyleri kimsenin anlamadığı nedenlerle yeniden yapmaya zorlanmasına yol açtı."
 sp_rockets_scientist_xp_generic_reward:0 "Yeni Öğrenimler"
 sp_rockets_scientist_xp_generic_reward_desc:0 "Bilim İnsanlarımız, en son prototip ile yapılan çalışmalar sırasında birkaç yeni öğrenim elde etti"
 sp_rockets_vertical_launch_reward:0 "Dikey Fırlatma Sistemi"
 sp_rockets_vertical_launch_reward_desc:0 "Birkaç başarısız denemeden sonra, [Character.GetName] nihayet bu füzelerin dikey fırlatılmasıyla ilgili sorunları çözmeyi başardı. Yeni sistem, füzelerin sorunsuz bir şekilde fırlatılmasına ve gecikmeden yüksek irtifalara ulaşmasına olanak sağlamalıdır."
 sp_rockets_warhead_detonation_mechanisms_reward:0 "Savaş Başlığı Patlatma Mekanizmaları"
 sp_rockets_warhead_detonation_mechanisms_reward_desc:0 "Tüm geliştirmenin önemli bir parçası, silahın doğru noktada patlamasını sağlamaktır. Görünüşe göre [Character.GetName], onu mümkün olan en elverişli zamanda patlatmamızı sağlayan bir çözüm bulmayı başardı."
