 sp_thermonuclear_bomb_test_reward_desc:0 "Bir termonükleer bombanın arkasındaki teoriyi doğrulamak için, bilim insanlarımız bir test patlaması yapma fırsatı talep ettiler. Bu, zincirleme reaksiyonu başlatmak için mevcut bir atom bombasının tahsis edilmesini gerektirecek ancak projenin ilerlemesini önemli ölçüde hızlandıracaktır."
