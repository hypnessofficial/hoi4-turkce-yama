 sp_naval_submarine_carrier_unique_reward_a:0 "Dalgıç Taşıyıcıları İyileştirme"
 sp_naval_submarine_carrier_unique_reward_a_desc:0 "Denizaltı uçak gemilerimiz deniz mühendisliğinin sınırlarını zorluyor ve her alanda eşit derecede güçlü olamazlar. Menzile mi, gövde dayanıklılığına mı yoksa gizliliğe mi öncelik vermeliyiz?"
 sp_naval_super_heavy_battleship:0 "Süper Ağır Zırhlı"
 sp_naval_super_heavy_battleship_desc:0 "Deniz silahlanma yarışı son yıllarda çeşitlenmiş olabilir, ancak zırhlının salt haşmetini ve daha da büyük devler inşa etme potansiyelini inkar etmek zordur."
 sp_naval_super_heavy_battleship_free_design:0 "Süper Ağır Zırhlı"
 sp_naval_super_heavy_battleship_preference_a_a:0 "Ağır Toplar"
 sp_naval_super_heavy_battleship_preference_a_b:0 "Güçlendirilmiş Zırh ve Gövde"
