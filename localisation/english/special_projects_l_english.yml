 sp_naval_proximity_fuzes_unique_reward_a_desc:0 "Yakınlık Tapaları, düşman uçaklarına karşı bir isabet kaydetmek için gereken mermi miktarını büyük ölçüde azaltır. Bunları mobil uçaksavar birimlerimizde kullanmaya hazırlanırken, beklenen günlük 'isabet' oranını korurken sağlanan mühimmat miktarını ayarlayabiliriz."
 sp_naval_rocket_launching_submarine:0 "Füze Fırlatan Denizaltı"
 sp_naval_rocket_launching_submarine_desc:0 "Denizaltılarımızı füzelerle ve fırlatma sistemleriyle donatarak, düşmanlarımızın stratejik hedeflerini her yerde ve önceden uyarı olmaksızın vurabilmeliyiz."
