l_english:
 AUS_is_forming_hre:0 "Arşidükümüz [ROOT.GetLeader]'in ihtişamının sınırı yoktur ve ulusumuzun sınırları da yoktur. Bunlar şimdi eski Kutsal Roma İmparatorluğu'nun sınırlarını kapsayacak şekilde büyüdü ve yolumuzdaki uluslar artık politikalarımıza itiraz edecek konumda değiller. Arşidük, mevcut fırsatın değerlendirilmesini ve ulusun Kutsal Roma İmparatorluğu'nun manevi halefi olarak rolünü benimsemesini kararlaştırdı. Aquila Elegit Iovis Omnia Vincit!"
 CAN_women_in_the_workforce:0 "Bren Silahı Kızı Ronnie"
 CAN_women_in_the_workforce_desc:0 "Ronnie diyor ki: \"Gelmeye devam edin!\" Erkeklerimizin askerlik yapmasıyla askeri üretimimizin yükü milletimizin kadınlarının omuzlarına biniyor. Savaş boyunca 800.000 Kanadalı kadın, askere alınanların geride bıraktığı işleri üstlendi ve sonsuza kadar kadınların da bu işi erkekler kadar iyi yapabileceğini kanıtladı."
