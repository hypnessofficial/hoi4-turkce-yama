 hold_blood_toil_tears_sweat_speech:0 "'Kan, Emek, Gözyaşı ve Ter' Konuşmasını Yap"
 hold_blood_toil_tears_sweat_speech_desc:0 "'Kan, emek, gözyaşı ve terden başka sunacak bir şeyim yok. [...] Soruyorsunuz, politikamız nedir? Diyeceğim ki: Denizde, karada ve havada, tüm gücümüzle ve Tanrı'nın bize verebileceği tüm güçle savaşmak; insan suçlarının karanlık ve acıklı kataloğunda asla aşılmamış korkunç bir tiranlığa karşı savaşmak. Politikamız budur. Soruyorsunuz, amacımız nedir? Tek kelimeyle cevap verebilirim: Zafer. Ne pahasına olursa olsun zafer—Tüm teröre rağmen zafer—Yol ne kadar uzun ve zor olursa olsun zafer, çünkü zafer olmadan hayatta kalmak yoktur.'"
 hold_fight_on_the_beaches_speech:0 "'Sahillerde Savaşacağız' Konuşmasını Yap"
 hold_fight_on_the_beaches_speech_desc:0 "'Sonuna kadar gideceğiz. Fransa'da savaşacağız, denizlerde ve okyanuslarda savaşacağız, artan bir güven ve artan bir güçle havada savaşacağız, adamızı ne pahasına olursa olsun savunacağız. Sahillerde savaşacağız, iniş alanlarında savaşacağız, tarlalarda ve sokaklarda savaşacağız, tepelerde savaşacağız; asla teslim olmayacağız...'"
 hold_the_communist_national_referendum:0 "Ulusal Referandum Düzenle"
 hold_the_communist_national_referendum_desc:0 "Yeterli destekle, şimdi kansız bir şekilde bir hükûmet değişikliğini etkilemek için güvenli bir şekilde bir referandum düzenleyebiliriz."
