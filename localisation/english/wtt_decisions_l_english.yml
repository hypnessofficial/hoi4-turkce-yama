 modernize_the_succession_laws:0 "Veraset Kanunlarını Modernleştir"
 modernize_the_succession_laws_desc:0 "Mevcut Kaiser'in oğlu, müstakbel IV. Wilhelm'in varis olarak sadece iki kızı var. Veraset sırasını güvence altına almalıyız ve bu nedenle veraset kanunları, zamanı geldiğinde Prenses Felicitas'ın hüküm sürmesine izin verecek şekilde modernize edilmelidir."
