 GER_reichskommissariats_desc:0 "Yeni toprakların ele geçirilmesiyle birlikte direniş ve etkili bir yönetim ihtiyacı ortaya çıkıyor. Bu nedenle Reichsminister Alfred Rosenberg, Reichskommissariatlar olarak adlandırdığı özel işgal rejimlerinin oluşturulmasını önerdi; bu rejimler, yerel halkı kontrol etmeye ve direniş savaşçılarıyla düzenli kuvvetlerimizin yapabileceğinden daha yerel bir düzeyde ilgilenmeye yardımcı olacaktır."
 GER_reichsprotektorat_bohemia_moravia:0 "Reichsprotektorat Bohemya ve Moravya"
 GER_renew_mefos:0 "MEFO Bonolarını Yenile"
 GER_renew_mefos_desc:0 "Reichsbank, ulusumuzu yeniden inşa etmede ve yeniden silahlandırmada çok önemlidir. Borçlarımızı ödeme kararımızda bir hata yaptığımız açık ve MEFO Bonolarını birkaç ay daha uzatmalıyız."
 GER_request_polish_war_participation:0 "Polonya'nın Savaşa Katılımını Talep Et"
 GER_request_polish_war_participation_desc:0 "[SOV.GetName] ile savaşta olduğumuz için, ordularımızın [POL.GetAdjective] topraklarından geçmesi gerekiyor. Onları korumaya yemin ettiğimiz için, savaşımıza katılmaları doğaldır."
 GER_sharpen_air_safety_regulations:0 "Hava Güvenliği Yönetmeliklerini Sıkılaştır"
 GER_sharpen_air_safety_regulations_desc:0 "Daha katı güvenlik düzenlemeleriyle, hava gemileri de dahil olmak üzere felaketle sonuçlanan kazaların daha yaygın nedenlerinden bazılarını önleyebiliriz."
 GER_weserubung_nord:0 "Weserübung-Nord"
 GER_weserubung_nord_desc:0 "Norveç kritik bir stratejik noktadır ve İsveç ile çelik ticaretimizi bozmak isteyen herhangi bir düşman için bariz bir saldırı noktası olacaktır. Düşmanlarımızın bu bölgede üsler kurma riskini alamayız."
 GER_weserubung_sud:0 "Weserübung-Süd"
 GER_weserubung_sud_desc:0 "Norveç'i işgal etmek için iyi bir hazırlık alanı elde etmek amacıyla önce Danimarka'ya hareket etmeliyiz."
 JAP_border_conflict_back_out_of_conflict:0 "Geri çekil"
 JAP_border_conflict_back_out_of_conflict_desc:0 "Bu çatışmanın kontrolden çıkıp ülkelerimiz arasında tam ölçekli bir savaşa dönüşme tehlikesi çok büyük. Şimdi kayıplarımızı kesmeli ve karşı tarafa diplomatik temaslar göndermeliyiz."
 JAP_border_conflict_escalate_conflict:0 "Çatışmayı Tırmandır"
 JAP_border_conflict_escalate_conflict_desc:0 "[FROM.GetNameDef] ile olan sınırdaki çatışma durma noktasına geldi. Belki daha da tırmandırarak ve harekât alanına daha fazla birlik göndererek hala bir zafer elde edebiliriz."
 JAP_border_conflict_escalate_to_war:0 "Savaş İlan Et"
 JAP_border_conflict_escalate_to_war_desc:0 "Tartışmalı bölgedeki çatışmalar bir süredir devam ediyor ve durma belirtisi göstermiyor. Bir sonraki adımı atmaya ve bu çatışmayı genel bir savaşın ilk adımı olarak görmeye hazır olmalıyız."
 JAP_border_conflict_escalation_warning_SOV:0 "Japon hazırlıkları"
 JAP_border_conflict_escalation_warning_SOV_desc:0 "Hava keşfi, sınırın Japon tarafında büyük birlik hareketlerini doğruladı. Japonların ne zaman saldıracağına karar verip vermediklerini bilmiyoruz, ama hazır olmalıyız."
 JAP_border_conflict_time_until_cancelled:0 "Çatışmayı sonlandır"
 JAP_border_conflict_time_until_cancelled_desc:0 "Mevcut hızda, savaşı bırakmadan önce savaş operasyonlarını ancak bu kadar uzun süre sürdürebiliriz."
 JAP_border_conflict_warning_SOV:0 "Japon Sınırında Sınır Provokasyonu"
 JAP_border_conflict_warning_SOV_desc:0 "Kore'deki ortak sınırımızda sınır muhafızlarımızla Japon askerleri arasında bir çatışma yaşandı. Japonya'daki istihbarat kaynakları, bunun daha büyük bir çatışmanın sadece ilk adımı olabileceğini bildiriyor. Japonya ile sınırı derhal güçlendirmeliyiz."
 JAP_border_incident_forgotten:0 "Fırsat Penceresi"
 JAP_border_incident_forgotten_desc:0 "Eğer Sovyet sınırındaki olayı Kore'ye karşı kullanmak istiyorsak, hızla saldırmalıyız."
 JAP_break_the_london_naval_treaty:0 "Londra Deniz Antlaşması'nı Boz"
 JAP_break_the_london_naval_treaty_desc:0 "Londra Deniz Antlaşması'nın çirkin kısıtlamaları ulusumuzun güvenliğine bir tehdittir. Haklı olarak bizim olan şeye meydan okuyacak herhangi bir ulusa karşı durabilecek bir donanma inşa etme özgürlüğüne sahip olmalıyız."
 JAP_china_step_up_war_effort:0 "Çin'deki Savaşı Tırmandır"
 JAP_colonial_independence:0 "Sömürge Bağımsızlığı"
 JAP_colonial_independence_desc:0 "Eski imparatorluk mülklerinin geri alınmasıyla, halklarını özgürleştirmenin ve onlara hak ettikleri bağımsızlığı vermenin zamanı geldi."
