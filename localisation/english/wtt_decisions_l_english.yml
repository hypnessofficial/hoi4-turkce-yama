 USA_women_in_the_workforce:0 "Perçinci Rosie"
 USA_women_in_the_workforce_desc:0 "Elektrikli bir mikser kullanabilir misin? Eğer öyleyse, bir matkap kullanmayı öğrenebilirsin. Savaş boyunca, altı milyondan fazla Amerikalı kadın fabrikalarda, inşaatlarda ve diğer fiziksel işlerde çalıştı ve kadınların işi erkekler kadar iyi yapabildiğini sonsuza dek kanıtladı."
 anti_communist_raids:0 "Anti-Komünist Baskınlar"
 anti_communist_raids_desc:0 "Uzun vadeli iç istikrar adına ulusumuzdaki komünist unsurlara karşı sert önlemler almalıyız. Nüfuzları çok büyük ve potansiyel olarak hükûmet için bir sorun haline gelebilir."
 anti_democratic_raids:0 "Anti-Demokratik Baskınlar"
 anti_democratic_raids_desc:0 "Uzun vadeli iç istikrar adına ulusumuzdaki demokratik unsurlara karşı sert önlemler almalıyız. Nüfuzları çok büyük ve potansiyel olarak devlet için bir sorun haline gelebilir."
 anti_fascist_raids:0 "Anti-Faşist Baskınlar"
 anti_fascist_raids_desc:0 "Uzun vadeli iç istikrar adına ulusumuzdaki faşist unsurlara karşı sert önlemler almalıyız. Nüfuzları çok büyük ve potansiyel olarak hükûmet için bir sorun haline gelebilir."
 anti_neutrality_raids:0 "Siyasi Muhaliflere Baskın Yap"
 anti_neutrality_raids_desc:0 "Uzun vadeli iç istikrar adına ulusumuzdaki muhalif faaliyetlere karşı sert önlemler almalıyız. Siyasi idealleri bizimkinden çok uzak ve potansiyel olarak hükûmet için bir sorun haline gelebilir."
 army_support_TT:0 "Ordu desteği her artırıldığında, iç savaştaki fraksiyonunuzun gücüne %10 eklenir, maksimum toplam güç %70'e kadar.\n"
