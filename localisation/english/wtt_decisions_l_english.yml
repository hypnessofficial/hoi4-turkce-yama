 request_restoration_of_british_titles:0 "İngiliz Unvanlarının Geri Verilmesini Talep Et"
 request_restoration_of_british_titles_desc:0 "1917'de İngiliz parlamentosu, Alman Kraliyet ve Prens ailelerinden tüm İngiliz soyluluk ve kraliyet unvanlarını iptal etmek için oy kullandı. Şimdi müttefik olduğumuza ve mükemmel ilişkilere sahip olduğumuza göre, belki de bu kararın tersine çevrilmesini talep etme zamanı gelmiştir."
