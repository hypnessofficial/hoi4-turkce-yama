 USA_arsenal_of_democracy_decision:0 "Demokrasinin Cephaneliği"
 USA_arsenal_of_democracy_decision_desc:0 "Henüz çatışmaya sürüklenmeyecek olsak da, dostlarımıza onların cephaneliği olarak yardım edebiliriz. Halkın bunun neden gerekli olduğunu anlamasını sağlayalım."
 USA_battle_domestic_isolationism:0 "İç İzolasyonizmle Mücadele Et"
 USA_battle_domestic_isolationism_desc:0 "Eğer izolasyonist unsurların dediği olsaydı, herhangi bir düşman ulusa karşı savunmasız olurduk. Kendi iyiliğimiz için, yaygın izolasyonist söylemi yapısöküme uğratmaya başlamalıyız."
 USA_emergency_arms_deliveries:0 "Acil Silah Teslimatları"
 USA_emergency_arms_deliveries_desc:0 "Fransa düştü ve Britanya şimdi saldırgana karşı tek başına duruyor, kıyılarını işgale karşı savunmak için mücadele ediyor. Ateşli söylemlerle kararlılıklarının her zamanki kadar güçlü olduğunu ve geceye sessizce gitmeye niyetli olmadıklarını belirttiler. Özgürlüklerini savunma araçlarının onlara verilmesini sağlamak demokrasiye borcumuzdur."
 USA_establish_personal_communication_with_former_naval_person:0 "Eski Denizci Kişiyle Yazışma"
 USA_establish_personal_communication_with_former_naval_person_desc:0 "[ENG.GetName]'da yeni bir lider Başbakanlık rolünü üstlendi. Savaşa kaçınılmaz girişimize hazırlanmamıza ve koordine olmamıza yardımcı olması için onunla kişisel bir diyalog açmalıyız."
 USA_guns_for_the_anti_fascist_war:0 "Anti-Faşist Savaş için Silahlar"
 USA_homeland_defense:0 "Anavatan Savunması Acil Durum Yasası"
 USA_homeland_defense_desc:0 "Düşman gururlu ulusumuzun toprağına ayak bastı. Amerikan halkı ayaklanacak ve işgalcileri denize geri püskürtecek!"
