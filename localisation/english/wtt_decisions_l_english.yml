 form_rattanakosin_kingdom_category:0 "Rattanakosin Mirasını Güçlendir"
 form_rattanakosin_kingdom_category_desc:0 "Son yıllarda ulusumuzun başlangıçta kurulduğu geleneksel değerlerden uzaklaştık. Şimdi zafer günlerimizin toprak genişliğine ulaştığımıza göre, belki de tarihimizi daha sıkı bir şekilde kucaklama zamanı gelmiştir."
 form_roman_empire:0 "Mare Nostrum!"
 form_roman_empire_category:0 "Roma Hırslarını Gerçekleştir"
 form_roman_empire_category_desc:0 "Akdeniz'i kapsayan bir İmparatorluk fikri son yıllarda halkın zihninde yeniden canlandı. Şimdi, askerî seferlerimiz en ateşli destekçilerimizin bile en çılgın hayallerini aştı ve bu hırsları gerçekleştirmenin eşiğinde buluyoruz kendimizi. Roma invicta!"
 form_scandinavia:0 "Kalmar Birliği'ni Geri Getir"
 form_scandinavia_category:0 "Kalmar Birliği'ni Geri Getir"
 form_scandinavia_category_desc:0 "Tüm İskandinav topraklarının fethiyle, Kalmar Birliği'nin ruhunu geri getirme zamanı geldi. Tüm İskandinavya bizim yönetimimiz altında refaha kavuşacak."
