 object_to_attaches:0 "Ataşeye İtiraz Et"
 object_to_attaches_desc:0 "Düşmanlarımız yabancı yardım alıyor! Güçlü bir itirazda bulunmalı ve herhangi bir ataşenin kaldırılmasını talep etmeliyiz."
 open_up_political_discourse_communist:0 "Siyasi Söylemi Aç"
 open_up_political_discourse_communist_desc:0 "Hükümette farklı bakış açılarının kabulünü açmalıyız. Belki de bu, ulusumuzdaki siyasetteki barışçıl değişimi etkilemeyi mümkün kılacaktır."
 open_up_political_discourse_democratic:0 "Siyasi Söylemi Aç"
 open_up_political_discourse_democratic_desc:0 "Hükûmette farklı bakış açılarının kabulünü açmalıyız. Belki bu, sonunda ulusumuzun siyasetinde barışçıl bir değişikliği etkilemeyi mümkün kılacaktır."
 open_up_political_discourse_fascism:0 "Siyasi Söylemi Aç"
 open_up_political_discourse_fascism_desc:0 "Hükûmette farklı bakış açılarının kabulünü açmalıyız. Belki bu, sonunda ulusumuzun siyasetinde barışçıl bir değişikliği etkilemeyi mümkün kılacaktır."
 operation_fork:0 "Fork Harekâtı"
 operation_fork_desc:0 "Yeni bağımsız İzlanda ulusu, Kuzey Atlantik'te son derece stratejik öneme sahip bir konum işgal ediyor. Norveç'in kaybı, savunmasız adayı savunmasız bir konuma sokacaktır. Düşmanlarımızdan önce İzlanda'yı işgal etmeli ve ele geçirmeliyiz, yoksa tedarik hatlarımızı tehlikeye atabilecekleri adanın stratejik üslerini elde ederler. İzlandalılar ancak bizim korumamız altında düşmanlarımızdan güvende olacaklar."
