 form_majapahit_empire:0 "Insulindia'yı Birleştir"
 form_majapahit_empire_category:0 "Birleşik bir Nusantara Hayalleri"
 form_majapahit_empire_category_desc:0 "Birçok yüzyıl önce, büyük bir imparatorluk Endonezya takımadalarını kaplar ve ticaretine hükmederdi. Sınırlarımızı bu imparatorluğun kapsamını içerecek şekilde genişletmeyi başardık ve onları yeni bir ulus devlet için bir temel olarak kullanmak, bölgenin birliğinin bir sembolü olarak hizmet edebilir."
 form_majapahit_malaya_required_states_tt:0 "Tüm §YMalay§! eyaletlerini kontrol eder."
 form_majapahit_nei_required_states_tt:0 "Tüm §YEndonezya§! eyaletlerini kontrol eder."
 form_mutapa:0 "Zimbabve İmparatorluğu'nu Yeniden Yarat"
 form_mutapa_category:0 "Zimbabve İmparatorluğu'nu Yeniden Yarat"
 form_mutapa_category_desc:0 "Kıtanın güney kısımlarını sömürgeci etkilerden arındırdıktan sonra, belki de halkı geçmişimizden güçlü bir imparatorluk kavramı etrafında toplama zamanı gelmiştir. Bu bölgede birden fazla imparatorluk var olmuştur ve bize bir sembol olarak hizmet edecek bir isme ihtiyacımız var."
 form_nordic_league:0 "Kuzey Birliği'ni İlan Et"
 form_nordic_league_category:0 "Kuzey Birliği'ni İlan Et"
 form_nordic_league_category_desc:0 "Kuzeyliler uzun zamandır birbirlerine karşı bir yakınlık hissetmişlerdir. Şimdi bir zamanlar Kuzey kurucu devletlerine ait olan tüm toprakları kontrol ettiğimize göre, bu akrabalığı yeni zirvelere taşımak mümkün."
 form_ottoman_britain_coring_states_tt:0 "Mısır, Orta Doğu ve Doğu Akdeniz'deki tüm §Yİngiliz§! eyaletlerinde çekirdek topraklar kazan.\n"
 form_ottoman_empire:0 "Osmanlı İmparatorluğu'nu Yeniden Kur"
 form_ottoman_empire_category:0 "Osmanlı İmparatorluğu'nu Yeniden Kur"
 form_ottoman_empire_category_desc:0 "Silah zoruyla Büyük Savaş'taki zayıflığımızın bir sonucu olarak uğradığımız kayıpları telafi etmeyi başardık. Bu tarihi olayı kutlamak için, Osmanlı İmparatorluğu'nun restorasyonunu ilan etmekten daha iyi bir hizmet olamaz."
 form_ottoman_italy_coring_states_tt:0 "Kuzey Afrika ve Doğu Akdeniz'deki tüm §Yİtalyan§! eyaletlerinde çekirdek topraklar kazan.\n"
 form_ottoman_syria_coring_states_tt:0 "Tüm §YSuriye§! eyaletlerinde asli eyalet hakkı kazan.\n"
 form_pan_tai_empire:0 "Pan-Tai İmparatorluğu'nu kurun"
 form_pan_tai_empire_category:0 "Pan-Tai İmparatorluğu'nu kurun"
 form_pan_tai_empire_category_desc:0 "Büyük Tayland İmparatorluğu, ulusumuzu görkemli günlerinin sınırlarına geri getirdi, ancak Tai halkları bunların çok ötesine uzanıyor. Shan tepelerinden Yunnan'ın Dai'sine, Guangxi'nin Zhuang'ına ve uzaktaki Assam'ın Ahom'una kadar soydaşlarımız bölünmüş durumda. Artık bu ata toprakları bayrağımızı dalgalandırdığına göre, tüm Tai için tek bir imparatorluk ilan edelim."
