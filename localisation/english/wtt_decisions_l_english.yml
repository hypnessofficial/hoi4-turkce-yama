 hold_the_fascist_national_referendum_desc:0 "Yeterli destekle, şimdi kansız bir şekilde bir hükûmet değişikliğini etkilemek için güvenli bir şekilde bir referandum düzenleyebiliriz."
 hold_this_was_their_finest_hour_speech:0 "'Bu Onların En Güzel Saatiydi' Konuşmasını Yap"
 hold_this_was_their_finest_hour_speech_desc:0 "'Öyleyse kendimizi görevlerimize hazırlayalım ve kendimizi öyle taşıyalım ki, eğer Britanya İmparatorluğu ve Milletler Topluluğu bin yıl daha yaşarsa, insanlar hala 'Bu onların en güzel saatiydi' diyecektir.'"
