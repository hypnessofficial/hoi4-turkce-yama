 PRC_border_clashes:0 "Sınır Çatışmaları"
 PRC_border_clashes_desc:0 "Çin'in arazisi herkesi savaşlarını dikkatli seçmeye zorluyor. Bu bize, topyekûn savaşa girmeden bazı savunmasız arazileri ele geçirme fırsatı veriyor."
