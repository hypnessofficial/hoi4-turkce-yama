 form_european_union_category_desc:0 "Siyasi olarak birleşik bir Avrupa kavramı son birkaç on yılda ancak bir miktar ilgi kazanmış olsa da, en güçlü kıta Avrupası uluslarını son zamanlarda fethetmemiz bizi bu beklenmedik gerçekle karşı karşıya bırakıyor. Belki de ulusun sunduğu fırsatlardan tam olarak yararlanmak için bir yeniden yapılanma gereklidir."
 form_gran_colombia:0 "Bolívar'ın Mirasını Canlandır"
 form_gran_colombia_category:0 "Bolívar'ın Mirasını Canlandır"
 form_gran_colombia_category_desc:0 "Gran Kolombiya deneyi bir asır önce sadece kısa ömürlü olmasına rağmen, şimdi bir kez daha kurucu topraklarının kontrolünü ele geçirmeyi başardık. Bir kez daha Bolívar'ın rüyasını gerçekleştirebiliriz."
 form_greater_german_reich:0 "Yeni Düzeni İlan Et"
 form_greater_german_reich_category:0 "Alman Ulusunun Büyük Cermen Reich'ı"
 form_greater_german_reich_category_desc:0 "Düşmanlarımız önümüzde diz çöktürüldü ve Doğu'ya genişleme hedeflerimiz gerçekleştirildi. Şimdi dünyaya ulusumuzun büyüklüğünü anlama ve başkentimizi herkesin gururla bakabileceği bir şeye dönüştürmeye başlama zamanı."
 form_greater_german_state_category:0 "Yeni Proleter Düzen"
 form_greater_german_state_category_desc:0 "Her taraftan gelen muhalefete rağmen, Batı Avrupa'nın yozlaşmış hükûmetlerini alt etmeyi başardık. Artık işçileri ezmeye devam edemezler, onları şimdi serbest bıraktık ve tam şu anda davamıza topluyoruz. Kapitalizmin prangaları kırıldı ve Avrupa - ve dünya - üzerinde yeni bir düzen doğuyor."
 form_greater_proletarian_state:0 "Büyük Alman Proleter Devletini İlan Et"
 form_hre:0 "Kutsal Roma İmparatorluğu'nu Canlandır"
