 recall_von_lettow_vorbeck_desc:0 "Hohenzollern'in tahta geri dönmesiyle, eski Doğu Afrika Aslanı bir kez daha hizmetlerini sunuyor."
 refuse_the_tribute:0 "Haracı ödemeyi reddet"
 refuse_the_tribute_desc:0 "Sovyet talepleri ülkemizin kanını kurutuyor. Sözde \"yoldaşlarımızın\" bizi bu şekilde sömürmesine izin veremeyiz."
 reinstate_wilhelm_iv_succession_rights:0 "Prens Wilhelm'in Veraset Hakkını Geri Getir"
 reinstate_wilhelm_iv_succession_rights_desc:0 "Kaiser III. Wilhelm'in oğlu, o zamanki aile reisi II. Wilhelm'in onayı olmadan evlenmek istemesi nedeniyle veraset hakkından feragat etmek zorunda kalmıştı. III. Wilhelm şimdi o rolü devraldığına göre, sürgündeki babasına bu kararın tersine çevrilmesini desteklemesi için baskı yapabilir."
 reinstate_wilhelm_iv_succession_rights_tt:0 "Veraset sırası değiştirildi.\n"
