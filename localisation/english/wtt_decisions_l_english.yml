 FRA_scuttle_the_fleet_desc:0 "Yabancı güçler donanma kuvvetlerimizin kontrolünü zorla ele geçirmek için bir hamle yapıyor. Bunun olmasına izin veremeyiz ve gemilerimizi batırmalıyız!"
