 form_united_central_america_category:0 "Federal Cumhuriyeti Yeniden Kur"
 form_united_central_america_category_desc:0 "Ulusumuzun bir asır önce kurucu bir parçası olduğu güçlü devletin ömrü çok kısaydı. Şimdi onun çöküşüne neden olan ayrılıkçı devletleri fethettiğimize göre, federal cumhuriyeti yeniden kurmaya ve birleşik bir Orta Amerika'nın gücünü yansıtmaya başlayabiliriz."
 form_united_netherlands:0 "Londra Antlaşması'nı Reddet"
 form_united_netherlands_category:0 "Londra Antlaşması'nı Reddet"
 form_united_netherlands_category_desc:0 "1839'daki Londra Antlaşması, çok kısa bir birlik döneminden sonra alçak toprakların Kuzey ve Güney'ini utanç verici bir şekilde ayırdı. Şimdi, bizim liderliğimiz altında, o günleri yeniden yaratabilir ve Fransa ve Almanya'ya karşı denge unsuru olarak hedeflenen yerimizi alabiliriz."
