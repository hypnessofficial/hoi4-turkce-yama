 macdonald_proposal:0 "Macdonald Önerisi"
 macdonald_proposal_desc:0 "Konvoylarımızın güvenliğini sağlamalıyız ve bunu başarmak için İrlanda hava ve deniz üsleri son derece önemlidir. İrlanda'nın savaşa derhal bizim tarafımızda girmesi karşılığında Kuzey İrlanda'yı takas etmeyi teklif etmek için bir elçi göndereceğiz."
 mers_el_kebir_raid:0 "Katapult Harekâtı"
 mers_el_kebir_raid_desc:0 "Fransız filosu Vichy Fransası'nın eline geçti ve Almanların eline geçmesine izin veremeyiz. Ne kadar mide bulandırıcı olursa olsun, eski müttefikimizin donanmasının bombardıman tehdidi altında derhal teslim olmasını talep etmeliyiz."
