 JAP_escalate_incident_to_border_conflict_SOV:0 "Olayı Tırmandır"
 JAP_escalate_incident_to_border_conflict_SOV_desc:0 "Görünüşe göre Sovyetler çatışmadan geri adım atmıyor. Bu noktada, ya silahlı bir çatışmaya tırmandırmalı ya da kendimiz geri adım atmalıyız."
 JAP_everybody_serves:0 "Ayrımsız Askere Almayı Uygula"
 JAP_favor_army:0 "Orduyu Destekle"
 JAP_favor_navy:0 "Donanmayı Destekle"
 JAP_guardian_of_INS:0 "Endonezya Üzerinde Vesayet Üstlen"
 JAP_guardian_of_MAL:0 "Malaya Üzerinde Vesayet Üstlen"
 JAP_guardian_of_indochina:0 "Hindistan Üzerinde Vesayet Üstlen"
 JAP_ichi_go:0 "Ichi Go"
 JAP_ichi_go_desc:0 "Savaşın sonu göründü. Son bir itme ve kararlı bir çabayla çatışmayı hızlı bir sonuca ulaştırabiliriz. Ancak, önümüzdeki yıl içinde zaferi yakalayamazsak, artan savaş çabasına karşı kamuoyu yükseldikçe iç istikrarsızlık yaşayabiliriz..."
 JAP_interservice_rivalry:0 "Birimler Arası Rekabet"
 JAP_interservice_rivalry_desc:0 "İmparatorluk Donanması ve İmparatorluk Ordusu, sınırlı kaynaklarımız üzerinde şiddetli bir çatışma içindedir. Kaynaklarımızın doğru yerde harcanmasını sağlamak için düzenli konferanslar başlattık. Birini diğerine tercih etmek, geniş kapsamlı sonuçlara yol açacaktır."
 JAP_intervene_in_china_level_down:0 "Çin'e Müdahale Seviyesini Düşür"
 JAP_liberate_manchuria_alliance_tt:0 "Bir ittifak teklifi gönderir."
 JAP_nuke_1:0 "Japonya'ya ilk nükleer saldırı gerçekleştirildi"
 JAP_nuke_2:0 "Japonya'ya ikinci nükleer saldırı gerçekleştirildi"
 JAP_pressure_france:0 "Hindistan'ı Talep Et"
 JAP_prioritize_army_aircraft_construction:0 "Kara Uçağı İnşaatını Önceliklendir"
 JAP_prioritize_naval_aircraft_construction:0 "Donanma Uçağı İnşaatını Önceliklendir"
 JAP_raiding_regiments:0 "Akıncı Alayları Kur"
 JAP_release_korea:0 "Kore Bağımsızlığı"
 JAP_request_soviet_support:0 "Sovyet Desteği Talep Et"
 JAP_request_soviet_support_desc:0 "Mevcut iç savaşımızda yardıma ihtiyacımız var ve davamızın en olası destekçileri kuzeyimizdeki Sovyetler. Belki de bir grup Sovyet gönüllü tümeni karşılığında Güney Sahalin Yarımadası'nı takas edebiliriz."
 JAP_return_manchuria:0 "Mançurya'yı Geri Ver"
 JAP_southern_expansion:0 "Güney Genişlemesi"
 JAP_southern_expansion_desc:0 "Donanma'nın Nanshin-ron doktrinini sürdürerek, güneydeki emperyalist ve sömürgecilerin topraklarına tecavüz etmemizin ve hakimiyet alanımızı güney yolunun tamamını kapsayacak şekilde genişletmemizin zamanı geldi."
 JAP_special_air_landing_force:0 "Özel Hava İndirme Kuvvetleri Kur"
 JAP_steel_for_guns:0 "Çeliği Silahlara Önceliklendir"
 JAP_steel_for_ships:0 "Çeliği Gemilere Önceliklendir"
 JAP_sue_for_peace_CHI:0 "[From.GetNameDef]'e Teslimiyet Şartları Sun"
 JAP_sue_for_peace_CHI_desc:0 "Anakaradaki hakimiyetimizi kaybettik. Ordu, kaybedilen toprakları geri alabileceğimizin pek olası olmadığını düşünüyor. Sivil hükûmet, en azından adalar üzerindeki egemenliğimizi korumak için şartlar aramamız gerektiğini öneriyor."
 JAP_sue_for_peace_MAN:0 "[From.GetNameDef]'e Teslimiyet Şartları Sun"
 JAP_sue_for_peace_MAN_desc:0 "Anakaradaki hakimiyetimizi kaybettik. Ordu, kaybedilen toprakları geri alabileceğimizin pek olası olmadığını düşünüyor. Sivil hükûmet, en azından adalar üzerindeki egemenliğimizi korumak için şartlar aramamız gerektiğini öneriyor."
 JAP_sue_for_peace_TT:0 "Hiçbir anakara §YÇin§! veya §YKore§! çekirdek toprağı §YJaponya§! veya herhangi bir bağlı devleti tarafından kontrol edilmiyor."
 JAP_sue_for_peace_nuke:0 "Koşulsuz Teslimiyet Sun"
 JAP_sue_for_peace_nuke_desc:0 "Düşman yeni ve en zalim bir bomba kullandı. Savaş bizim lehimize gelişmiyor. Dayanılmaz olana dayanmalıyız."
 JAP_sue_for_peace_nuke_mission:0 "Japon topraklarında nükleer saldırılar gerçekleştir"
 JAP_sue_for_peace_nuke_mission_desc:0 "Nükleer bir bombanın son başarılı testi, Japon Ana Adaları'na tam ölçekli bir işgale bir alternatif sunuyor. İstihbarat, Okinawa ve Iwo Jima'nın kontrolünü Japonlardan alırsak ve filolarını sadece 30 gemiye düşürürsek, Ana Adalar'da iki yere art arda nükleer bombalarla saldırmanın Japon hükûmetini koşulsuz teslim olmaya zorlayacağını öne sürüyor."
 JAP_test_the_soviets:0 "[SOV.GetAdjective]leri Sına"
 JAP_test_the_soviets_desc:0 "Kore ve Mançurya'da [SOV.GetNameDef] ile uzun bir sınır paylaşıyoruz. Kuvvetlerimizin her an çatışabileceği çok sayıda potansiyel parlama noktası var. Bizim için bu, [SOV.GetAdjective] tepkisini küçük bir provokasyona karşı test etme fırsatı yaratıyor."
 JAP_tora_tora_tora:0 "Tora! Tora! Tora!"
 JAP_tora_tora_tora_desc:0 "İlk darbe bekliyor. Ardından, kazandığımız ivmeyi kullanarak düşmanlarımızı ne olduğunu anlamadan önce sakatlamak için hızla devam etmeliyiz."
 JAP_war_conferences_cd:0 "İmparatorluk Savaş Konferansı son 6 ay içinde toplandı"
 JAP_war_with_soviet_union:0 "[SOV.GetNameDef]'e Savaş İlan Et"
 JAP_war_with_soviet_union_desc:0 "Avrupa'daki müttefiklerimiz [SOV.GetNameDef] ile bir saldırmazlık paktı imzaladı. Ancak, savaşımız bekleyemez; müttefiklerimizi yabancılaştırma riski olsa bile, Komünistlerle tek taraflı bir çatışma izlemeliyiz."
 LUX_anti_neutrality_raids:0 "Anti-Monarşist Baskınlar"
 LUX_ban_neutrality_party:0 "Monarşist Faaliyetleri Yasakla"
 MAN_bandit_raids:0 "Haydut Baskınları"
 MAN_bandit_raids_desc:0 "Dolaşan haydutlar ve teröristler çivilenmemiş her şeyi çalıyor ve geri kalanını yakıyor! Daha fazla birlik toplayın ve onları durdurun!"
 MAN_banditry_category:0 "Haydutluk"
 MAN_banditry_category_desc:0 "Kwantung Ordusu, Mançurya sakinlerine yardım etmekle pek ilgilenmiyor, bunu ulus inşasından ziyade bir askerî işgal olarak görüyor. Mançukuo hükûmetine, olduğu gibi, düzeni sağlamak için Japonlar tarafından çok az kaynak verildi. Bu güç boşluğuna her türden haydut doluşuyor: bazen 'ulusal kurtuluş' veya 'proleter enternasyonalizmi' gibi soyut idealler adına cinayet işleyip hırsızlık yapan 'özgürlük savaşçıları' olarak kendilerini şekillendiriyorlar, ama daha sık olarak istismarlarını maskeleyecek belirtilmiş bir ideolojileri olmadan."
 MAN_can_prepare_more_tt:0 "Ek depoları ele geçirmek için hala daha fazla hazırlık yapılabilir.\n"
 MAN_develop_kirin_aluminium_deposits:0 "Kirin Boksit Yataklarını Geliştir"
 MAN_develop_liaotung_iron_ore_deposits:0 "Liaotung Demir Cevheri Yataklarını Geliştir"
 MAN_disband_the_banners:0 "Sancakları Dağıt"
 MAN_disband_the_banners_desc:0 "Hizmetleri tamamlandığında, Mançu sancakları bir kez daha evlerine ve ailelerine gönderilebilir - bir kez daha gerekene kadar."
 MAN_divert_machine_tools:0 "Takım Tezgahlarını Yönlendir"
 MAN_divert_machine_tools_desc:0 "Demiryolları kontrolümüz altındayken, bazı takım tezgahı sevkiyatlarının bir 'idari hata' ile 'kaybolmasını' sağlayabiliriz."
 MAN_eastern_bandits:0 "Haydutlar Doğu'da dolaşıyor."
 MAN_fund_underground_gun_shops:0 "Yeraltı Atölyeleri Oluştur"
 MAN_fund_underground_gun_shops_desc:0 "Büyük fabrikalarla aynı ölçek ekonomisini elde edemeseler de - ve çok karışık bir kalite kontrolüne sahip olsalar da - silah üretimini ülke geneline yayılmış daha küçük atölyelere dağıtmak, aceleyle üretimi artırmanın en iyi yoludur."
 MAN_hunt_down_eastern_bandits:0 "Doğulu Haydutları Avla"
 MAN_hunt_down_eastern_bandits_tt:0 "Doğulu haydutları ortadan kaldırır.\n"
 MAN_hunt_down_northern_bandits:0 "Kuzeyli Haydutları Avla"
 MAN_hunt_down_northern_bandits_tt:0 "Kuzeyli haydutları ortadan kaldırır.\n"
 MAN_hunt_down_western_bandits:0 "Batılı Haydutları Avla"
 MAN_hunt_down_western_bandits_tt:0 "Batılı haydutları ortadan kaldırır.\n"
 MAN_maintain_eastern_control:0 "Doğu Kontrolünü Sürdür"
 MAN_maintain_northern_control:0 "Kuzey Kontrolünü Sürdür"
 MAN_maintain_western_control:0 "Batı Kontrolünü Sürdür"
 MAN_northern_bandits:0 "Haydutlar Kuzey'de dolaşıyor."
 MAN_pacify_bandits_in_the_eastern_countryside:0 "Doğu Kırsalındaki Haydutları Yatıştır"
 MAN_pacify_bandits_in_the_northern_countryside:0 "Kuzey Kırsalındaki Haydutları Yatıştır"
 MAN_pacify_bandits_in_the_western_countryside:0 "Batı Kırsalındaki Haydutları Yatıştır"
 MAN_pacify_bandits_mission_explanation:0 "Bölgedeki haydutları yatıştırmak için [?Root.MAN_maintain_control_timer|H0] gün boyunca eyalette tümenleri koru.\n"
 MAN_prepare_to_seize_arms:0 "Japon Silah Depolarını Ele Geçirmeye Hazırlan"
 MAN_prepare_to_seize_arms_desc:0 "Ülke geneline yayılmış depolar ve tedarik yığınakları zayıf korunuyor. İyi planlanmış ve zamanlanmış bir saldırı, onları minimum zayiatla alabilir, bize modern silahlara erişim sağlarken aynı zamanda Japonları mühimmat ve malzemeden mahrum bırakabilir. Buna daha fazla zaman ve kaynak harcamak, daha fazla depo ele geçirmemizi sağlayacaktır."
 MAN_raise_manchu_banner:0 "Sancakları Kaldır"
 MAN_raise_manchu_banner_desc:0 "Eski günlerde, Çing İmparatorları savaşlarında savaşmak için sancaktarlarını çağırabilirlerdi. Zaman değişmiş olsa da, aynı ilkeler geçerlidir. Çing hanedanı bir kez daha sancaklarının hizmetlerine ihtiyaç duyuyor."
 MAN_recruit_bandits_east:0 "Doğulu Haydutları İşe Al"
 MAN_recruit_bandits_east_desc:0 "Haydutları avlamak için harcanan her kurşun, gelecek savaş için bir eksik demektir. Kendi tebaamızla savaşmak yerine, onlara İmparator'a hizmet yoluyla kendilerini affettirme yolu sunmalıyız."
 MAN_recruit_bandits_generic:0 "Haydut Kalıntılarını İşe Al"
 MAN_recruit_bandits_generic_desc:0 "Hapishanelerimiz ve çalışma kamplarımız bir zamanlar bize karşı savaşanlarla dolu. Özgürlüğümüz için savaşta her askere ve her tüfeğe ihtiyacımız var. İmparator, bu suçlulara hizmet yoluyla kendilerini affettirme yolu vererek efsanevi merhametini ve lütfunu gösterebilir."
 MAN_recruit_bandits_north:0 "Kuzeyli Haydutları İşe Al"
 MAN_recruit_bandits_north_desc:0 "Haydutları avlamak için harcanan her kurşun, gelecek savaş için bir eksik demektir. Kendi tebaamızla savaşmak yerine, onlara İmparator'a hizmet yoluyla kendilerini affettirme yolu sunmalıyız."
 MAN_recruit_bandits_west:0 "Batılı Haydutları İşe Al"
 MAN_recruit_bandits_west_desc:0 "Haydutları avlamak için harcanan her kurşun, gelecek savaş için bir eksik demektir. Kendi tebaamızla savaşmak yerine, onlara İmparator'a hizmet yoluyla kendilerini affettirme yolu sunmalıyız."
 MAN_release_bandits:0 "Haydutları Serbest Bırak"
 MAN_release_bandits_desc:0 "Eski suçlular ve serseriler, İmparatorları için fedakarlık yapmaya istekli olduklarını gösterdiler ve şimdi güvenle topluma geri bırakılabilirler."
 MAN_remove_underground_gun_shops:0 "Yeraltı Atölyelerini Kapat"
 MAN_remove_underground_gun_shops_desc:0 "Oluşturduğumuz silah atölyeleri amacına hizmet etti. Daha organize bir silah üretimi biçimine dönme zamanı geldi."
 MAN_seize_arms:0 "Planı Yürüt"
 MAN_seize_arms_desc:0 "Hızla saldırın! İMPARATOR İÇİN!"
 MAN_war_preparations:0 "Bağımsızlık Savaşı"
 MAN_western_bandits:0 "Haydutlar Batı'da dolaşıyor."
