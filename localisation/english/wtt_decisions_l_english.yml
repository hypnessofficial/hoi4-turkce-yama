 GER_barbarossa_mission:0 "Führer Direktifi 21"
 GER_barbarossa_mission_desc:0 "Alman Silahlı Kuvvetleri, Sovyet Rusya'yı hızlı bir seferde ezmeye hazır olmalıdır. Rus Ordusu'nun büyük kısmı, zırhlı öncüler tarafından yönetilen cüretkar operasyonlarla imha edilecektir."
 GER_can_delay_mefo_payment:0 "MEFO Bonoları ödemesini geciktirebilir."
 GER_cancel_mefos:0 "MEFO Bonolarını İptal Et"
 GER_cancel_mefos_desc:0 "Silah endüstrimizin yeniden inşası için çok uzun süre Reichsbank'a güvendik. Silah üreticilerimizle olan taahhüt anlaşmamızı düzeltmenin ve bu \"MEFO Tasarısı\" maskaralığına son vermenin zamanı geldi."
 GER_case_anton:0 "Case Anton'u Yürüt"
 GER_case_anton_category:0 "Case Anton"
 GER_case_anton_category_desc:0 "Vichy Fransası'nı yaratmanın amacı her zaman Fransız sömürgelerini ve Fransız filosunu müttefiklerin elinden uzak tutmaktı. Ancak, bu, istediğimiz zaman feshedebileceğimiz bir anlaşmadır. Bölgeyi zorla entegre etmek ve Fransız filosunun Toulon'daki üssüne yıldırım hızıyla bir hamle yapmak için bir planımız var."
 GER_case_anton_desc:0 "Fransa'daki kukla devletimiz kullanışlılığını yitirdi. [Root.GetName]'e entegrasyona derhal başlayacağız ve yeterince hızlı hareket edersek, Fransız filosunun kalıntılarını bile ele geçirebiliriz."
 GER_case_anton_tt:0 "7 gün içinde Vichy Fransası'nı ilhak eder ve Fransız filosunu ele geçirir.\n\n§RAlman birlikleri 2 gün içinde Toulon'da olmazsa Fransa filosunu batırabilecek!§!\n"
 GER_case_anton_tt2:0 "Kuzey Afrika'daki Fransız eyaletlerinin çoğunluğunu kontrol etmiyor."
 GER_case_red:0 "Fall Rot"
 GER_case_yellow_belgium_luxembourg:0 "Fall Gelb - Belçika ve Lüksemburg"
 GER_case_yellow_belgium_luxembourg_desc:0 "Maginot Hattı üzerinden bir saldırı intihardır. En ağır tahkimatları atlamak için onu kuzeyden kuşatacak ve Ardenler'den geçeceğiz."
 GER_case_yellow_netherlands:0 "Fall Gelb - Hollanda"
 GER_case_yellow_netherlands_desc:0 "Belçika üzerinden bir saldırı bizi çok dar bir cepheden geçmeye zorluyor. 1914'te yapılan hataları önlemek için savaş planımızı Hollanda'yı da içerecek şekilde genişletmeliyiz."
 GER_extend_mefo_bills:0 "MEFO Bonoları"
 GER_extend_mefo_bills_desc:0 "MEFO Bonolarının vadesini 3 ay daha uzatarak, bu süre boyunca faydalarından yararlanmaya devam etmemizi sağlayın. Ancak bu, nihai ödemelerimizin maliyetini de artıracaktır."
 GER_extend_mefo_bills_tt:0 "'§YMEFO Bonoları§!'nı uzatıp uzatmayacağınıza veya ödemelere başlayıp başlamayacağınıza karar verin.\n"
 GER_generalgouvernement:0 "Genel Hükûmeti Kur"
 GER_is_forming_hre:0 "Kaiserinimizin ihtişamının sınırı yoktur ve ulusumuzun sınırları da yoktur. Bunlar şimdi eski Kutsal Roma İmparatorluğu'nun sınırlarını kapsayacak şekilde büyüdü ve yolumuzdaki uluslar artık politikalarımıza itiraz edecek konumda değiller. Kaiserin, mevcut fırsatın değerlendirilmesini ve ulusun Kutsal Roma İmparatorluğu'nun manevi halefi olarak rolünü benimsemesini kararlaştırdı. Aquila Elegit Iovis Omnia Vincit!"
 GER_is_forming_hre_without_victoria:0 "Hükûmetimizin ihtişamının sınırı yoktur ve ulusumuzun sınırları da yoktur. Bunlar şimdi eski Kutsal Roma İmparatorluğu'nun sınırlarını kapsayacak şekilde büyüdü ve yolumuzdaki uluslar artık politikalarımıza itiraz edecek konumda değiller. Şimdi mevcut fırsatın değerlendirilmesi ve ulusun Kutsal Roma İmparatorluğu'nun manevi halefi olarak rolünü benimsemesi kararlaştırıldı. Aquila Elegit Iovis Omnia Vincit!"
 GER_mefo_bills_category:0 "MEFO Bonoları"
 GER_mefo_bills_category_desc:0 "Büyüyen askerî sanayimizi finanse etmek ve bunu İngiliz ve Fransız gözlerinden gizli tutmak için, ödemeleri senet şeklinde yönlendirmek amacıyla bir bilanço şirketi kullanmak zorunda kaldık. Eğer bu senetlerin vadelerini uzatmak için siyasi bağlantılarımızı kullanmazsak, onları geri ödemek zorunda kalacağız ve artık faydalarından yararlanamayacağız."
 GER_mefo_bills_effect_in_days:0 "Aşağıdakiler [?Root.days_mission_timeout@GER_mefo_bills_mission|H0] gün içinde gerçekleşecek:\n"
 GER_mefo_bills_extended:0 "Uzatılmış MEFO Bonoları"
 GER_mefo_bills_extension:0 "MEFO Bonoları uzatılalı 60 günden az oldu."
 GER_mefo_bills_extension_timer:0 "MEFO Bonolarının vadesi dolmadan önce."
 GER_mefo_bills_mission:0 "MEFO Bonolarının Vadesi Doldu"
 GER_mefo_bills_mission_desc:0 "Çıkardığımız bonoların vadesi yakında doluyor. Onları uzatıp uzatmayacağımıza veya ödemelere başlayıp başlamayacağımıza karar vermeliyiz."
 GER_mefo_bills_mission_tt:0 "Mevcut MEFO bonoları grubunun vadesi dolduğunda yürürlüğe girecek olan '§YMEFO Bonoları§!'nın altı aylık bir uzatmasını yayınlayın.\n\nHer uzatmanın maliyeti, savaş çıkana kadar aşamalı olarak artacaktır; bu noktada MEFO bonolarına olan bağımlılık ortadan kalkar ve ödeme savaşın bitiminden sonraya ertelenir.\n\n"
