 political_actions:0 "Siyasi Eylemler"
 prepare_for_communist_civil_war:0 "İç Savaşa Hazırlan"
 prepare_for_communist_civil_war_desc:0 "Halkın zihnindeki yavaş değişiklikleri bekleyecek zamanımız yok. Kendi iyilikleri için, bu meseleyi hızla zorlamalıyız, süreçte bazıları hayatını kaybetse bile. Barışçıl bir referandumun aksine, bir iç savaş silahlı kuvvetlerimize ve ülkenin sanayi ve altyapısına muazzam bir yıkım getirecektir, ama aynı zamanda daha hızlıdır ve sonrasında irademizi daha güçlü bir şekilde zorlayabilmemizi sağlar."
 prepare_for_democratic_civil_war:0 "İç Savaşa Hazırlan"
 prepare_for_democratic_civil_war_desc:0 "Halkın zihnindeki yavaş değişiklikleri bekleyecek zamanımız yok. Kendi iyilikleri için, bu meseleyi hızla zorlamalıyız, süreçte bazıları hayatını kaybetse bile. Barışçıl bir referandumun aksine, bir iç savaş silahlı kuvvetlerimize ve ülkenin sanayi ve altyapısına muazzam bir yıkım getirecektir, ama aynı zamanda daha hızlıdır ve sonrasında irademizi daha güçlü bir şekilde zorlayabilmemizi sağlar."
 prepare_for_fascist_civil_war:0 "İç Savaşa Hazırlan"
 prepare_for_fascist_civil_war_desc:0 "Halkın zihnindeki yavaş değişiklikleri bekleyecek zamanımız yok. Kendi iyilikleri için, bu meseleyi hızla zorlamalıyız, süreçte bazıları hayatını kaybetse bile. Barışçıl bir referandumun aksine, bir iç savaş silahlı kuvvetlerimize ve ülkenin sanayi ve altyapısına muazzam bir yıkım getirecektir, ama aynı zamanda daha hızlıdır ve sonrasında irademizi daha güçlü bir şekilde zorlayabilmemizi sağlar."
 prestigious_projects:0 "Ulusal Prestij"
 promises_of_peace:0 "Barış Vaatleri"
 promises_of_peace_desc:0 "Tarih bize savaşın dehşetini öğretti. Bunun bir daha asla olmasına izin vermemeliyiz. Ulusumuzun barış ve refahı bilme zamanı geldi."
 propaganda_efforts:0 "Propaganda Çabaları"
 prospect_for_resources:0 "Kaynak Ara"
 prospect_for_resources_desc:0 "Jeologlarımız topraklarımızda bir dizi umut verici kaynak yatağı buldu. Bu alanları geliştirmek için biraz sermaye harcayabiliriz. Çıkarma teknolojisindeki ilerlemeler, daha fazla yatağı sömürü için uygun hale getirebilir."
 rebuild_panama_canal:0 "Panama Kanalı'nı Tamir Et"
 rebuild_panama_canal_desc:0 "Panama Kanalı, savaş çabamız için son derece önemlidir. Bu büyük kanalı yeniden inşa etmek için gereken tüm kaynakları ayırmalıyız, böylece Pasifik ve Atlantik Okyanusları arasında gemi ve birlikleri serbestçe geçirmek için kullanabiliriz."
 rebuild_suez_canal:0 "Süveyş Kanalı'nı Tamir Et"
 rebuild_suez_canal_desc:0 "Süveyş Kanalı, savaş çabamız için son derece önemlidir. Bu büyük kanalı yeniden inşa etmek için gereken tüm kaynakları ayırmalıyız, böylece Akdeniz ve Hint Okyanusu arasında gemi ve birlikleri serbestçe geçirmek için kullanabiliriz."
 rebuild_the_nation_communism:0 "Ulusu Yeniden İnşa Et"
 rebuild_the_nation_communism_desc:0 "İç savaştan sonra, şimdi yıkılmış ulusumuzu yeniden inşa etme zamanı geldi."
