 form_persian_empire_category:0 "Pers İmparatorluğu'nu Yeniden Yarat"
 form_persian_empire_category_desc:0 "Son fetihlerimiz eski Pers İmparatorluğu'nun sınırlarına ulaştı. Bölgemizin zengin tarihiyle, bu fırsatı krallığımızı eski imparatorlukların bir devamı olarak tanımlamak için nasıl kullanmayabiliriz?"
