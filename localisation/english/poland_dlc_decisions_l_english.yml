 POL_four_year_plan_mission:0 "Bir Sonraki Dört Yıllık Plan için Hazırlan"
 POL_four_year_plan_mission_desc:0 "Dört Yıllık Plan devam ediyor, kendimizi önümüzdeki dört yıla yeterince hazırlayacaksak, ülkeyi reforme etme ve sanayileştirme sözlerimizi yerine getirdiğimizden emin olmalıyız."
 POL_invite_ford:0 "Ford Motors'u Davet Et"
 POL_invite_ford_desc:0 "Ucuz, verimli ve Amerikalı olan Ford Motors, rakipsiz bir oranda seri motorlu teçhizat üretebilir."
 POL_invite_foreign_motor_decisions:0 "Yabancı Motor Şirketlerini Davet Et"
 POL_invite_foreign_motor_decisions_desc:0 ""
 POL_invite_somua:0 "SOMUA'yı Davet Et"
 POL_invite_somua_desc:0 "Fransız motorlu ve zırhlı araçları diğerlerinden daha dayanıklıdır ve neredeyse hiç hasar almadan düşman araçlarından gelen mermileri alabilir. Bunlar savaştan sağ çıkmak için ihtiyacımız olan araç türleridir."
 POL_invite_vauxhall:0 "Vauxhall'u Davet Et"
 POL_invite_vauxhall_desc:0 "İngilizler, motorlu teçhizatlarının yolda dünyadaki diğerlerinden çok daha hızlı ve daha kaliteli olduğunu kanıtladılar."
 POL_looming_peasants_strike_mission:0 "Yaklaşan Köylü Grevi"
 POL_looming_peasants_strike_mission_desc:0 "Köylüler mutsuz, daha yüksek ücret ve önemli ölçüde düşürülmüş gıda fiyatları talep ediyorlar. Polonya'nın Doğu'daki zayıf demiryolu bağlantıları, bölgeye yiyecek ve teçhizat tedarikini pahalı bir girişim haline getiriyor, ancak daha fazla demiryolu yatırımıyla, köylülerin talep ettiklerini yerine getirebiliriz."
 POL_miedzymorze_decisions:0 "Międzymorze"
 POL_miedzymorze_decisions_desc:0 ""
 POL_military_appeasement:0 "Askeri Yatıştırma"
 POL_military_appeasement_desc:0 "Özgür Danzig Şehri sadece kaba kuvvetle entegre edilemez, bir dereceye kadar yatıştırma Danzig milislerini Polonya'nın şehir için vizyonuyla daha uyumlu hale getirebilir."
 POL_peasant_strike_category:0 "Köylülerin Grevi"
 POL_peasant_strike_category_desc:0 ""
 POL_peasants_strike:0 "Köylülerin Grevi"
 POL_peasants_strike_desc:0 "Doğu'da gerilimler doruğa ulaştı. Bu krizi bir an önce çözmezsek, bir iç savaşla karşı karşıya kalabiliriz. Köylü Partisi lideri Stanisław Mikołajczyk tarafından düzenlenen grev, Polonya hükûmetine karşı demokratlar, sosyalistler ve komünistlerden oluşan bir koalisyon oluşturdu ve görmezden gelinirse bir isyanı kışkırtacaktır."
 POL_raid_nazi_resistance:0 "Nazi Direnişine Baskın Yap"
 POL_raid_nazi_resistance_desc:0 "Şehirde özgürlüklerinin anahtarlarını Nazilere teslim edecek ve şehri Berlin'e bağımlı kılacak olanlar var. Bu unsurlar ne pahasına olursa olsun şehirden temizlenmelidir, ancak sert askeri harekatın yerel halk tarafından nasıl algılandığımız üzerinde olumsuz etkileri olabilir."
 POL_sanation_decisions:0 "Polonya Sanation Hükûmeti"
 POL_sanation_decisions_desc:0 "Sanationistler, her ikisi de yönetimimizi bozmaya çalışan sol ve sağ kamplara bölünmüştür. Polonya'nın geleceği için istikrarlı bir hükûmet yaratabilmemiz için partileri uygun şekilde yatıştırmalı ve kenara itmeliyiz!"
 POL_sanation_left_irritation:0 "Sanation Solunun Rahatsızlığı"
 POL_sanation_left_irritation_desc:0 "Mościcki'nin rejimi altında marjinalleştirilmekten ve kenara itilmekten bıkan Sanation Solu, eski Başbakan Walery Sławek'in hükûmetini restore etmeye çalışıyor."
 POL_sanation_right_irritation:0 "Sanation Sağının Rahatsızlığı"
 POL_sanation_right_irritation_desc:0 "Ordunun çoğunluğu kendi tarafında olan Sanation Sağı, diktatörlüğü baltalamaya ve Edward Rydz-Śmigły tarafından yönetilen bir Askeri Cunta kurmaya çalışıyor. Hem orduyla hem de Falanjist paramiliterlerle bağları olan Sanation Sağı, tehlikeli bir siyasi gruptur."
 POL_sending_deligates_flag:0 "Zaten bir diplomatik görevde."
 POL_sideline_the_left:0 "Solu Kenara İt"
 POL_sideline_the_left_desc:0 "Sağdakilerin yardımıyla, Solu kenara itebilir ve onları toplumumuzun siyasi dış çeperlerine daha da derinlere itebiliriz."
 POL_sideline_the_right:0 "Sağı Kenara İt"
 POL_sideline_the_right_desc:0 "Güçlü olmalarına rağmen, Sağ, Sol ve Kale'nin ortak bir çabasıyla siyasi olarak önemsiz hale getirilebilir."
 POL_tighten_control:0 "Kontrolü Sıkılaştır"
 POL_tighten_control_desc:0 "Sivil huzursuzluğa neden olmadan kontrolümüzü daha da sıkılaştırmak için şehirde yeterli uyum sağladık. Bununla, Danzig kaynaklarına daha fazla erişim sağlayacak ve şehirde birliğe ulaşmaya daha da yaklaşacağız."
 POL_unification_propaganda:0 "Birleşme Propagandası"
 POL_unification_propaganda_desc:0 "Danzig, Polonyalılar, Almanlar ve sayısız diğer azınlıklardan oluşan kültürel açıdan çeşitli bir şehirdir ve Nazi Partisi bu çok kültürlü işbirliğini bozmaya çalışmaktadır. Etkili propaganda, şehrin azınlıklarını bizim tarafımıza çekmek için kullanılabilir ve onlara Nazilerin vermektense ölmeyi tercih edeceği eşitliği vaat edebilir."
