l_english:
 POL_danzig_decisions:0 "'Özgür' Danzig Şehri"
 POL_danzig_decisions_desc:0 "Danzig çok uzun zamandır Polonya ekonomisinin başına bela olmuştur! Şehrin kontrolünü ele almamızın zamanı geldi, ancak böyle bir şey ancak yerel halkla bir dereceye kadar işbirliği ile başarılabilir…"
 POL_defend_in_east_state:0 "[From.GetName] Savunma Planı"
 POL_defend_in_east_state_desc:0 "Doğu uzak ve az gelişmiş, doğa ona bizim kadar hükmediyor. Adamlarımızı çevrelerini kendi avantajlarına kullanmaları için eğitmeli ve bizi işgal eden Rusları dağınık ve şaşkın bırakmalıyız."
 POL_defend_in_west_state:0 "[From.GetName] Savunma Planı"
 POL_defend_in_west_state_desc:0 "Batı, sanayimizin çoğunun bulunduğu yerdir ve onu Almanlardan korumamız hayati önem taşır. Sınırımızdaki ezici sayılarla mücadele edeceksek, Batı'da yerel savunma stratejileri geliştirmeliyiz."
 POL_defensive_plans:0 "Savunma Planlaması"
 POL_defensive_plans_desc:0 ""
 POL_diplomatic_mission_to_AUS:0 "[AUS.GetNameDef]'e Diplomatik Misyon"
 POL_diplomatic_mission_to_AUS_desc:0 "Eğer diğer ulusları Intermarium'a katılmaya ikna edeceksek, bunun onların en iyi çıkarına olduğunu onlara ikna etmeliyiz. Józef Beck'i diplomatik misyonlara göndererek, hayalini kurduğumuz savunma ittifakını kurma şansımız çok daha yüksek olacaktır."
