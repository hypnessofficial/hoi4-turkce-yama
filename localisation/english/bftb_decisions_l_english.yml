 BUL_macedonian_revolutionary_organizations_foreign_desc:0 "Çok uzun zamandır Balkanlar'da bir bela olan Bulgar yanlısı bir örgüt olan IMRO, şimdi Bulgaristan tarafından destekleniyor ve silahlandırılıyor, bu da ülkemizi istikrarsızlaştırma ve bölgedeki Bulgar duygusunu yayma niyetindedir. Bu örgütü ve terör saltanatını kesin olarak sona erdirmeliyiz."
 BUL_macedonian_revolutionary_organizations_hostile_desc:0 "IMRO çok uzun zamandır Balkanlar'da bir bela olmuştur. Bulgaristan'da hala aktif olan kalan hücrelerle başa çıkmalı, devrimcilerden çok gangsterlere benzeyen üyelerini hapsetmeli ve nihayet terör saltanatlarına son vermeliyiz."
