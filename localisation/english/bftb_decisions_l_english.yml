 GRE_pay_back_debt_to_the_ifc_category:0 "U.M.K.'ye Olan Borcu Yönetme"
 GRE_pay_back_debt_to_the_ifc_category_desc:0 "Yunanistan, 1829'daki Bağımsızlık Savaşımızdan bu yana mali borçlarla boğuşuyor ve Büyük Savaş mali sıkıntılarımızı hafifletmeye pek yardımcı olmadı. Eğer borçlarımızı ödeyebilirsek, bu kesinlikle Yunanistan'da bir miktar ekonomik istikrar sağlamada uzun bir yol kat edecektir. Alternatif olarak, bazı radikal hareketlerin hem siyasi hem de ekonomik gelenekleri yıktığı bilinmektedir. Bu hareketlerden birine boyun eğersek veya dünyanın zamanla çözülmesine izin verirsek, çok daha sert eylem rotaları kendini gösterebilir...\n\n§Yİngilizlere§! olan §YBorç§!: [ROOT.GetDebtPercentageBritain]\n\n§YFransızlara§! olan §YBorç§!: [ROOT.GetDebtPercentageFrance] \n\n§Yİtalyanlara§! olan §YBorç§!: [ROOT.GetDebtPercentageItaly] \n\nÖdenen Toplam §YBorç§!: [ROOT.GetDebtPercentagePaidTotal]"
