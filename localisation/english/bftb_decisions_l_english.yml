 GRE_1936_election_category:0 "1936 Seçimi"
 GRE_1936_election_category_desc:0 "II. Georgios'un tahta dönmesinden bu yana ilk seçimler bu ayın sonundan önce yapılacak. II. Georgios, bir daha tahtından indirilmemeye kararlı ve yönetimini güvende tutmak için gereken her şeyi yapmaya hazır olduğu söyleniyor. \n\nAncak, ordumuzun bazı unsurları hâlâ popüler sürgün Eleftherios Venizelos'a gizli bağlılıklar besliyor ve oldukça... sert taktikler kullanarak Yunanistan için özgür ve adil bir seçim sağlayabilirler."
 GRE_1936_election_tt:0 "Eğer Kral §YII. Georgios§! tutuklanmazsa, Ocak ayındaki seçimlere müdahale edecek ve monarşist destekçilerinin hükûmet yetkilerini korumasını sağlayacaktır.\n"
