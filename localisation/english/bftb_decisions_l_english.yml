 TUR_kurdish_resistance_escalation_mission:0 "£faction_tur_kurdish Kürt Direnişi, Hükûmet Karşıtı Eylemlerini Şiddetlendiriyor"
 TUR_kurdish_resistance_escalation_mission_desc:0 "Kürt isyancılar, ulusumuzun güneydoğusundaki hükûmet karşıtı çabalarını bir kez daha yoğunlaştırıyor."
 TUR_kurdish_state_management_category:0 "Kürt Eyalet Yönetimi"
 TUR_kurdish_state_management_category_desc:0 "Kürt sorunu, Cumhuriyet'in kuruluşundan bile öncesinden beri peşimizi bırakmayan bir meseledir ve o zamandan bu yana durum şüphesiz daha da kötüleşmiştir. Dizginsiz milliyetçilik ve başarısız olmaya mahkum ulus kurma girişimleri, Kurtuluş Savaşı'nın mirasını yok etmekle tehdit etmektedir. Kendi ulusumuzun gövdesinden koparak doğacak özgür bir K*rdistan senaryosuna ise asla müsamaha gösteremeyiz."
 TUR_kurdish_state_management_map_category_name:0 "Bunlar Kürt isyancıları içeren eyaletlerdir."
 TUR_liberalism_decision:0 "Özgürlükçülük"
 TUR_liberalism_decision_desc:0 "Kendi geleceğine karar verme özgürlüğü, bu ulusun geleceği için hayallerimizin bir temel taşıdır. Serbest ticaret, serbest seçimler, din özgürlüğü, fırsat özgürlüğü - bunlar sürekli olarak arzu etmemiz gerekenlerdir."
 TUR_modernise_the_general_directorate_of_military_factories:0 "Askerî Fabrikalar Genel Müdürlüğünü Modernleştir"
 TUR_modernise_the_general_directorate_of_military_factories_desc:0 "Potansiyel sanayi projelerini her durumu kendi içinde değerlendirmek, hükûmetin sorumluluğudur."
 TUR_modernize_our_tactics:0 "Taktiklerimizi Modernleştir"
 TUR_modernize_our_tactics_desc:0 "Silahlı kuvvetlerimize katılanların birçoğu Kurtuluş Savaşı gazileridir, ancak gelecekteki herhangi bir savaşın 1922 savaşı gibi olmayacağını fark edemiyorlar."
 TUR_nationalism_decision:0 "Milliyetçilik"
 TUR_nationalism_decision_desc:0 "Daha önce ülkemiz için savaştık ve öldük ve hepimiz bunu tekrar yapmaya istekli olmalıyız."
 TUR_no_current_integration_targets_available_tt:0 "Bir £faction_tur_kurdish §YKürt§! eyaleti çekirdek yapılmadan önce §YUyum§! en az §Y%70§!'e yükseltilmeli ve §YDireniş§! en az §Y%30§!'a düşürülmelidir."
 TUR_no_longer_has_etatism_tt:0 "Artık §YDevletçilik§! sürdürülmüyor."
 TUR_offer_conscription_exceptions_to_kurdish_groups:0 "£faction_tur_kurdish Kürt Gruplarına Askerlik Muafiyeti Teklif Et"
 TUR_offer_conscription_exceptions_to_kurdish_groups_desc:0 "Birçok Kürt grubu tam bağımsızlık değil, sadece bir dereceye kadar özerkliğin tanınmasını talep ediyor. Yaygın askerlik muafiyetleri sunarak barış adına küçük bir özerklik sağlayabiliriz."
 TUR_open_the_nazilli_callico_factory:0 "Nazilli Basma Fabrikasını Aç"
 TUR_open_the_nazilli_callico_factory_desc:0 "Potansiyel sanayi projelerini her durumu kendi içinde değerlendirmek, hükûmetin sorumluluğudur."
 TUR_pacify_kurdish_state_effect_tt:0 "§Y[TUR_kurdish_state_event_target.GetName]§!'daki £faction_tur_kurdish §YKürt isyancılar§! sakinleştirilecek."
 TUR_pay_off_our_debts:0 "Borçlarımızı Öde"
 TUR_pay_off_our_debts_desc:0 "Osmanlı İmparatorluğu varlığı boyunca büyük bir borç biriktirdi ve biz de ulusumuzu yeniden inşa ederken oldukça fazla harcama yaptık. Şu anda, bu borcun bir kısmını ödemek için iyi bir konumdayız!"
 TUR_petrol_ofisi_formed:0 "Petrol Ofisi'nin kuruluşu desteklendi.\n"
 TUR_placate_kurdish_state_effect_tt:0 "§Y[TUR_kurdish_state_event_target.GetName]§!'daki £faction_tur_kurdish §YKürt isyancılar§! yatıştırılacak."
 TUR_populism_decision:0 "Halkçılık"
 TUR_populism_decision_desc:0 "Halk, herhangi bir sorumlu hükûmetin her zaman bir numaralı önceliği olmalıdır. Konu hakkında tartışmaya yer yoktur."
 TUR_put_new_safety_regulations_regarding_the_operation_of_aircraft_into_effect:0 "Yeni Uçak Güvenlik Yönetmeliklerini Yasallaştır"
 TUR_put_new_safety_regulations_regarding_the_operation_of_aircraft_into_effect_desc:0 "Avrupa'daki havacılık yeniliklerinin ön saflarında olmaktan her zaman gurur duyduk, ancak pilotlarımızın başına buyruk davranma konusunda haklı bir ünü var."
 TUR_reforming_our_armed_forces_category:0 "Silahlı Kuvvetlerimizde Reform"
 TUR_reforming_our_armed_forces_category_desc:0 "Silahlı kuvvetlerimiz Kurtuluş Savaşı'ndan sonra harap oldu: emperyalistlerden özgürlüğümüzü kazanmak için sahip olduğumuz her şeyi ve daha fazlasını aldı ve askeri reform bir süre ertelenebilecek bir şey olsa da, dünya şimdi hızla çok daha tehlikeli bir yer haline geliyor."
 TUR_reformism_decision:0 "Reformculuk"
 TUR_reformism_decision_desc:0 "Halkımız her zaman yeniliklerin öncüsü olmuştur - Osmanlılar bile zaman zaman yaptıkları siyasi veya sosyal reformlarla sınırları zorlamalarıyla tanınırdı. [FROM.GetAdjective] halkının dinamizmi, en büyük niteliklerimizden biridir."
 TUR_repeal_the_faith_tax:0 "İnanç Vergisini Kaldır"
 TUR_repeal_the_faith_tax_desc:0 "Dini kurumlara yönelik bu vergi sürdürülemez bir uygulamadır. Niyetimiz ne kadar iyi olursa olsun, gerçek şu ki [ROOT.GetNameDef] böylesine radikal bir politikaya henüz hazır değil. Bu durumda yapılacak en mantıklı şey, vergiyi kaldırmak olacaktır."
 TUR_repeal_the_wealth_tax:0 "Varlık Vergisini Kaldır"
 TUR_repeal_the_wealth_tax_desc:0 "Gayrimüslimlere yönelik bu vergi sürdürülebilir değildir ve Kemalist sicilimizde bir lekedir; yapılacak doğru şey, vergiyi derhal kaldırmaktır."
 TUR_republicanism_decision:0 "Cumhuriyetçilik"
 TUR_republicanism_decision_desc:0 "Bu ülke, başarısız Osmanlı Sultanlığı'nın küllerinden doğdu. Şimdi, ne Sultanlara ne Halifelere ne de tanrılara hesap veriyoruz - özgürüz ve bu özgür olma hakkı için acı çektik."
 TUR_retire_ataturk:0 "Atatürk'ü Emekli Et"
 TUR_retire_ataturk_desc:0 "Düşünmesi acı bir şey, ama belki de Gazimiz son günlerini ailesiyle ve kendi takdirine göre kıtayı gezerek geçirse daha iyi olur. Bu ulus ve halkı için zaten çok şey feda ettikten sonra, bencilce hayatında hak iddia etmeye devam edemeyiz."
 TUR_revolutionism_decision:0 "İnkılapçılık"
 TUR_revolutionism_decision_desc:0 "Osmanlı boyunduruğunu söküp atmak ve Türk ulus devletini kurmak bir devrimdi. Ulusal başkalaşımımızda tökezleyerek, her zaman olmaya yazgılı olduğumuz halka doğru ilerlerken değiştik ve değişmeye devam ediyoruz..."
 TUR_root_out_kemalists_in_state:0 "£faction_tur_traditionalist Eyaletteki Kemalistlerin Kökünü Kazı"
 TUR_root_out_kemalists_in_state_desc:0 "Bu ulusu hala rahatsız eden tanrısız Kemalist belasının kalbine korku salacağız."
 TUR_secularism_decision:0 "Laiklik"
 TUR_secularism_decision_desc:0 "Orta Çağ'da sıkışıp kalmış köhne inançların dogmalarının, yönetimimize ve hayat tarzımıza yön vermesine müsaade edersek, dünyanın büyük güçleri arasında eşit sayılmak için gereken kabiliyetleri asla geliştiremeyiz."
 TUR_seek_treatment_for_ataturk:0 "Atatürk için Tedavi Ara"
 TUR_seek_treatment_for_ataturk_desc:0 "Eğer Gazimiz önümüzdeki birkaç yıl hayatta kalacaksa, ulusumuzu yönetmenin stresli işinden bir süre uzaklaşması hayati önem taşır. Onu dünyanın en modern sanatoryumlarında tedavi görmesi ve dünyanın en iyi tatil yerlerinde dinlenmesi için dünyanın dört bir yanına göndereceğiz."
 TUR_socialism_decision:0 "Sosyalizm"
 TUR_socialism_decision_desc:0 "Eski krallığımızı devirdik ve şimdi kibirli kapitalistleri devirmek için işçi sınıfıyla birlikte çalışmalıyız."
 TUR_sponsor_petrol_olfisis_formation:0 "Petrol Ofisi'nin Kuruluşuna Sponsor Ol"
 TUR_sponsor_petrol_olfisis_formation_desc:0 "Hükûmet üzerinde, petrol arama ve çıkarma faaliyetleri ile petrol kaynaklı enerji meselelerine odaklanacak bir devlet teşkilatı kurulması yönünde bir baskı oluşmuştur."
