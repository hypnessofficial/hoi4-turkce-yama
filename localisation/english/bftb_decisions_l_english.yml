 BUL_rearmament:0 "Bulgar Yeniden Silahlanması"
 BUL_rearmament_desc:0 "Büyük Savaş'taki yenilgimizden ve Neuilly Antlaşması'nın dayatılmasından sonra, ordumuz muazzam sınırlamalara maruz kaldı. Ama şimdi Avrupa üzerinde çalkantılı zamanlar beliriyor ve eğer Bulgaristan'ın toprak bütünlüğünü ve halkının özgürlüğünü koruyacaksak, bu kısıtlamaları geride bırakmanın ve ordumuzu yeniden inşa etmeye başlamanın bir yolunu bulmalıyız."
 BUL_rearmament_main_factors_tt:0 "\n[ENG.GetAdjective] kararını etkileyecek ana faktörler: \n§G- IMRO'yu alenen kınamak \n- §Y[ENG.GetNameWithFlag]§! ile iyi ilişkilere sahip olmak \n- §Yebedi Dostluk Antlaşması§! veya §Y Selanik Anlaşması§! odağını tamamlamak \n- Demokrasiye yönelmek \n- §Y[ENG.GetNameWithFlag]§! ile aynı hükûmete sahip olmak§! \n§R- §Y[ENG.GetNameWithFlag]§! ile kötü ilişkilere sahip olmak \n- IMRO'yu desteklemek \n- Bogdan Filov'u danışman veya ülke lideri olarak atamak§!"
