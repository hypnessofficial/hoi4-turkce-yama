 TUR_traditionalist_infiltration_mission_desc:0 "Görünüşe göre toplumumuzdaki dini unsurlar, yalnızca sınırlı desteğe sahip oldukları bölgelerde bile takipçilerini daha da kökleştirmeye çalışıyor."
