 BUL_the_balkan_federation_dream_desc:0 "[ROOT.GetNameDefCap], proletaryanın birçok düşmanıyla yüzleşmek için güçlü bir Balkan Federasyonu'nun oluşumunu savunmalı ve Balkan uluslarına mücadelemizde galip gelmenin tek yolunun halklarımız arasında işbirliği ve dayanışma geliştirmek olduğunu anlamalarını sağlamalıdır, bu da nihayetinde Balkanların birleşmesine yol açacaktır..."
 BUL_the_fate_of_the_balkans_dec_cat:0 "Balkanların Kaderi"
 BUL_the_fate_of_the_balkans_dec_cat_desc:0 "Bulgaristan uzun zamandır yabancı güçlerin çıkarlarına ve kaprislerine tabi olmuştur... \nAncak zaman değişti, ülkemiz güçlendi ve [ROOT.GetNameDef] şimdi Balkanlar'da üstünlüğünü ortaya koyacak bir konumda."
 BUL_the_fatherland_front_dec_cat:0 "Vatan Cephesi"
 BUL_the_fatherland_front_dec_cat_desc:0 "[GetFfDecisionCategoryDesc]"
 BUL_the_fatherland_front_desc_coup:0 "Vatan Cephesi liderleri darbeyi planladı ve şimdi saldırmak için doğru anı bekliyorlar.\nDarbenin gerçekleşme olasılığı:\nTemel §Y%10§! [GetAtWarFfPercentage] [GetAllyAtWarFfPercentage] [GetSovNeighborFfPercentage] [GetCommunistSovFfPercentage]"
 BUL_the_fatherland_front_desc_planning:0 "§YVatan Cephesi§!'nin liderleri bir darbe hazırlığı yapıyorlar.\nSonunda, [GetZvenoName], [GetBsName] ve [GetBznsName]'den destek arayacaklar.\nHazırlıklarını engellemek ve hükûmeti devirme girişimlerini zayıflatmak için birkaç eylemde bulunabiliriz:\n-§YVatan Cephesi§! sempatizanlarını ve liderlerini kökünden kazıyıp tutuklayın.\n-Yaklaşabilecekleri herhangi bir ittifakı yok edin veya entegre edin.\n-1'den az §YKomünist Desteği§! olması, §YVatan Cephesi§!'ne son darbeyi vurmamızı sağlayacaktır."
