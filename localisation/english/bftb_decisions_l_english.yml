 TUR_the_enemy_within:0 "İçimizdeki Düşman"
 TUR_the_enemy_within_desc:0 "Ülkemiz, siyasi, etnik ve dini çizgiler boyunca bölünmüş durumda ve bu ayrılıklar, ulusumuzu kaosa sürükleyip parçalanma tehdidi yaratıyor. Kötü niyetli güçler yurdumuzda yoğun bir şekilde çalışıyor: bu güçlerin [ROOT.GetNameDef]’nin meşru hükümeti karşısında zafer kazanmasına asla izin verilmemeli."
 TUR_the_fading_father_category:0 "Solan Baba"
 TUR_the_fading_father_category_desc:0 "Türklerin Babası, Mustafa Kemal Atatürk, giderek daha sık hastalanıyor. Ulusumuzun mesihvari kurucu babasının, dünyanın karşı karşıya olduğu mevcut krizin sonuna kadar [ROOT.GetNameDef]'nin dayandığını göremeyebileceği talihsiz gerçeğiyle yüzleşmeliyiz.\n\nAtatürk'ün mevcut sağlık durumu: [ROOT.GetAtaturkHealthBar].\n"
 TUR_thwarting_kemalist_infiltration:0 "£faction_tur_traditionalist Kemalist Sızma Girişimlerini Engelleme"
 TUR_thwarting_kemalist_infiltration_desc:0 "Kemalistlerin zehirlerini daha fazla yaymalarını durdurmak sadece bir yurttaşlık sorumluluğundan daha fazlasıdır, ilahi bir görevdir."
 TUR_thwarting_traditionalist_infiltration:0 "£faction_tur_kemalist Gelenekselci Sızma Girişimlerini Engelleme"
 TUR_thwarting_traditionalist_infiltration_desc:0 "Bu ulusun laikliğini baltalayacak olanların batıya kontrolsüz bir şekilde yayılmasına izin vermemeliyiz; onları durdurma görevimiz var."
