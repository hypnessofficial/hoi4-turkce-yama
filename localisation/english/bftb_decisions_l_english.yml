 BUL_balkan_confederation:0 "Balkan Konfederasyonu"
 BUL_balkan_confederation_ai_tt:0 "§Y[FROM.GetNameWithFlag]§! diplomatik tekliflerimizi kabul etmeye daha meyilli olacaktır."
 BUL_balkan_confederation_balkan_summit:0 "Bir Balkan Zirvesi Düzenle"
 BUL_balkan_confederation_balkan_summit_cooldown_tt:0 "[GetDecisionCooldownTooltip] §Y365 gün§!.\n"
 BUL_balkan_confederation_balkan_summit_desc:0 "Balkanlar'daki tüm özgür ulusları bir Balkan Zirvesi'ne katılmaya davet edeceğiz. Bu etkinlik, fikirlerimizi ustaca tanıtmamıza ve bölge uluslarındaki Bulgar nüfuzunu artırmamıza olanak tanıyacaktır."
 BUL_balkan_confederation_capital_injection:0 "[FROM.GetNameDef]'e Sermaye Enjeksiyonu"
 BUL_balkan_confederation_capital_injection_desc:0 "Zor durumdaki [FROM.GetAdjective] şirketlerine mali destek sağlayarak ülkenin mali sektörlerini istikrara kavuşturacak ve [FROM.GetNameDef]’in ekonomisi üzerindeki [BUL.GetAdjective] kontrolünü artıracağız."
 BUL_balkan_confederation_cooldown_tt:0 "[GetDecisionCooldownTooltip] §Y365 gün§!.\n"
 BUL_balkan_confederation_desc:0 "[GetABalkanConfederationFocusLoc]"
 BUL_balkan_confederation_industrial_investment:0 "[FROM.GetNameDef]'e Sanayi Yatırımı"
 BUL_balkan_confederation_industrial_investment_desc:0 "[FROM.GetAdjective] hükümetini etkilemek amacıyla, [BUL.GetAdjective] sanayi patronlarını [FROM.GetNameDef]’de [BUL.GetAdjective] yan kuruluşlarının geliştirilmesini sağlayacak bir dizi yatırıma teşvik edeceğiz. Bu, hem onların ulusal endüstrisini güçlendirecek hem de üzerlerindeki nüfuzumuzu artıracaktır."
 BUL_balkan_federation_demand_turkish_territory:0 "Türk Topraklarını Talep Et"
 BUL_balkan_federation_demand_turkish_territory_desc:0 "[TUR.GetLeader] ile, [TUR.GetAdjective] Balkan topraklarının [BUL.GetNameDef]’e devri konusunda müzakere etmek üzere diplomatik bir heyet göndereceğiz."
 BUL_balkan_federation_economic_aid:0 "[FROM.GetNameDef] için Ekonomik Yardım"
 BUL_balkan_federation_economic_aid_desc:0 "[ROOT.GetFactionName]'e katılmadan önce, [FROM.GetNameDef]'in sıkıntılı ekonomisinin çökmesini önlemek için [FROM.GetAdjective] hükûmetine mali yardım sağlıyoruz."
 BUL_balkan_federation_industrial_aid:0 "[FROM.GetNameDef] için Sanayi Yardımı"
 BUL_balkan_federation_industrial_aid_desc:0 "[ROOT.GetFactionName]'e katılmadan önce, [FROM.GetNameDef]'in eksik ulusal sanayisini canlandırmak için [FROM.GetAdjective] hükûmetine yardım sağlıyoruz."
 BUL_balkan_federation_military_aid:0 "[FROM.GetNameDef] için Askerî Yardım"
 BUL_balkan_federation_military_aid_desc:0 "[ROOT.GetFactionName]'e katılmadan önce, [FROM.Capital.GetName] çevresindeki çeşitli kırsal kasabalardaki birkaç muhalif hücreyi kökünden kazımak için bir operasyon yürütmek üzere [FROM.GetAdjective] hükûmetine askeri yardım sağlıyoruz."
 BUL_balkan_federation_project_ready_flag:0 "Balkan Federasyonu Projesi hazır."
 BUL_balkan_federation_propaganda:0 "Balkan Federasyonu Propagandası"
 BUL_balkan_federation_propaganda_desc:0 "Balkan Federasyonu projemiz için [FROM.GetAdjective] proleter kitlelerinin halk desteğini kazanmak için [FROM.GetNameDef]'de büyük bir propaganda kampanyası düzenleyeceğiz."
