l_english:
 BUL_BS_TOOLTIP:0 "£faction_bul_bs §YGeniş Sosyalistler§!, geniş sınıf ittifaklarını destekleyen sosyal-demokratlardır. \n£faction_bul_bs §YGeniş Sosyalistler§!, sanayi işçileri ve Sendikalar arasında büyük bir nüfuza sahiptir ve hükûmete karşı sadakatsiz olurlarsa genel grev çağrısı yapacaklardır."
 BUL_BZNS_TOOLTIP:0 "£faction_bul_bzns §YÇiftçi Birliği§!, 1934'te yasaklanan ve tarımla ilgili sorulara adanmış siyasi bir örgüttür. \n£faction_bul_bzns §YÇiftçi Birliği§!, ülkenin kırsal bölgelerinde büyük bir nüfuza sahiptir ve çiftçiler arasında popülerlik kazanmaya çalışacaktır."
 BUL_LOYALTY_TOOLTIP:0 "§YSadakat§!, ittifakın hükûmetle işbirliği yapma arzusunu temsil eder. \n§YSadakat§! ne kadar yüksek olursa, bir ittifakın hükûmetle karşı karşıya gelme olasılığı o kadar düşüktür. \nBir ittifakı hükûmete entegre etmeden önce, üyelerini hükûmetle hizalamak ve §YSadakatlerini§! 100'e çıkarmak için belirli kararları tamamlamak gerekir."
 BUL_NSM_TOOLTIP:0 "£faction_bul_nsm §YUlusal Sosyal Hareket§!, eski Zveno üyesi Aleksandar Tsankov tarafından yönetilen aşırı sağcı bir örgüttür. \n£faction_bul_nsm §YUlusal Sosyal Hareket§!, ülke çapında gösteriler ve protestolar düzenleyerek kitleler arasında popülerlik kazanmaya çalışacaktır."
 BUL_POPULARITY_TOOLTIP:0 "§YPopülerlik§!, bir ittifakın nüfusun belirli kesimlerinden (askeri, proleter, köylü veya sağcı radikaller olsun) aldığı desteği temsil eder. \n§YPopülerlik§! ne kadar yüksek olursa, bir ittifakın hükûmetle karşı karşıya gelme olasılığı o kadar artar. \nBir ittifakı yok etmeden önce, onu zayıflatmak ve §YPopülerliğini§! 0'a düşürmek için belirli kararları tamamlamak gerekir."
 BUL_ZVENO_TOOLTIP:0 "£faction_bul_zveno §YZveno§!, ordu subayları tarafından kurulan ve şu anda Kimon Georgiev tarafından yönetilen milliyetçi bir örgüttür. \n£faction_bul_zveno §YZveno§!, ordu subaylarına örgütlerine katılmaları için çağrıda bulunacak ve zamanla hükûmete darbe yapmaya ve askeri bir diktatörlük kurmaya bile teşebbüs edebilir."
 BUL_a_royal_visit:0 "[GetDestinationName]'a Kraliyet Ziyareti"
 BUL_a_royal_visit_desc:0 "Halk arasındaki popülerliğini artırmak için, Çar Boris [GetDestinationName] belediyesini ziyaret edecek. Gezintisi sırasında kalabalıkla kaynaşacak ve biz de etkinliğin bolca fotoğrafının çekilip basına gönderilmesini sağlayacağız."
 BUL_aircraft_agreements:0 "[FROM.GetNameDef] ile Havacılık İşbirliği Anlaşması"
 BUL_aircraft_agreements_ongoing_flag:0 " Şu anda başka bir ülkeyle havacılık işbirliği anlaşması üzerinde çalışıyor"
 BUL_align_bulgaria:0 "Bulgaristan'ı Hizala"
 BUL_align_bulgaria_desc:0 "Bulgaristan ile diplomatik ilişkilerimiz on yıllardır dostane olmuştur ve mali yardımımız sayesinde Bulgar hükûmeti ezici borcunu yönetebilmiştir. Şimdi onları resmi olarak [GER.GetNameDef] müttefikleri olmaya ikna etme zamanı geldi."
 BUL_appoint_georgiev:0 "Kimon Georgiev'i Başbakan Olarak Ata"
 BUL_appoint_georgiev_desc:0 "Kimon Georgiev, Vatan Cephesi'nin en önemli figürlerinden biri haline geldi, liyakatini tanıma ve ona [ROOT.GetNameDef] Başbakanı pozisyonunu teklif etme zamanı geldi."
 BUL_appoint_tsankov:0 "Aleksandar Tsankov'u Başbakan Olarak Ata"
 BUL_appoint_tsankov_desc:0 "Daha radikal politikalara doğru bir rota değişikliği zamanı geldi. Aleksandar Tsankov ve onun Ulusal Sosyal Hareketi, ülkeyi yönetmek için en uygun olanlardır."
