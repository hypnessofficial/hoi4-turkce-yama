 denmark_expansion_event.231.t:0 "[FROM.GetNameDefCap], [NOR.GetAdjective] İddialarımızı Kabul Ediyor"
 denmark_expansion_event.232.a:0 "Belki saldırganlık onları daha uysal yapar."
 denmark_expansion_event.232.desc:0 "Maalesef onlar için, [FROM.GetAdjective] hükümeti iddialarımızı çürüttü. Görünüşe göre haklı olarak [DEN.GetAdjective] olanı güvence altına almak için kapılarına savaş getirmekten başka seçeneğimiz yok."
 denmark_expansion_event.232.t:0 "[FROM.GetNameDefCap], [NOR.GetAdjective] İddialarımızı Reddediyor"
 denmark_expansion_event.24.a:0 "Mükemmel."
 denmark_expansion_event.24.desc:0 "Görünüşe göre [SWE.GetAdjective] hükümeti aklını başına topladı! [NOR.GetNameDef]'in mülkiyetini bize devretmeyi kabul ettiler. Bizi o toprakların haklı yöneticileri olarak gördüklerini duymaktan memnuniyet duyuyoruz."
 denmark_expansion_event.24.t:0 "[FROM.GetNameDefCap], [NOR.GetNameDef] için Taleplerimizi Kabul Etti"
 denmark_expansion_event.25.a:0 "Ne yazık ki, savaş olsun."
 denmark_expansion_event.25.desc:0 "Maalesef, [SWE.GetNameDef], [NOR.GetNameDef] üzerindeki mülkiyet taleplerimizi reddetti. Bu çok hayal kırıklığı yaratıyor, özellikle de ülkeyi geçmişte onların kontrolüne devrettiğimiz için. Onların da iyiliğe karşılık vereceğini umuyorduk."
 denmark_expansion_event.25.t:0 "[FROM.GetNameDefCap], [NOR.GetNameDef] için Taleplerimizi Reddetti"
 denmark_expansion_event.3.a:0 "Savaşa..."
 denmark_expansion_event.3.desc:0 "Maalesef [ICE.GetAdjective] hükümeti yeniden bütünleşme teklifimizi reddetmiş gibi görünüyor. En hafif tabirle aptalca bir karar, ama bu bizi o ada üzerindeki hakkımızı kullanmaktan alıkoymayacak."
 denmark_expansion_event.3.t:0 "[FROM.GetNameDefCap] Yeniden Bütünleşme Teklifimizi Reddetti"
 denmark_expansion_event.300.a:0 "Bu cömert teklifi kabul ediyoruz!"
 denmark_expansion_event.300.b:0 "Buna ihtiyacımız yok."
 denmark_expansion_event.300.desc:0 "[DEN.GetAdjective] hükümeti bugün bize yeni fethettikleri $STATE_666$ toprağının kaynak haklarını teklif ederek başvurdu. Söz konusu bölge mineral zenginlikleriyle doludur. Belki de bu dikkate değer bir tekliftir?"
 denmark_expansion_event.300.t:0 "[FROM.GetNameDefCap] Kaynak Hakları Teklif Ediyor"
 denmark_expansion_event.301.a:0 "Mükemmel!"
 denmark_expansion_event.301.desc:0 "[FROM.GetNameDefCap], yeni elde edilen [SWE.GetAdjective] kaynakları konusundaki teklifimizi lütfederek kabul etti. Belki de bu, iki ülkemizin ileriye dönük olumlu bir ilişkiye sahip olabileceği anlamına gelir."
 denmark_expansion_event.301.t:0 "[FROM.GetNameDefCap] Kaynak Hakları Teklifimizi Kabul Etti"
 denmark_expansion_event.302.a:0 "Ne Kadar Kaba."
 denmark_expansion_event.302.desc:0 "Maalesef, [FROM.GetNameDef], cömert [SWE.GetAdjective] kaynakları teklifimizi reddetti. Belki de müzakerelerimizi başka bir yere taşımak daha iyidir?"
 denmark_expansion_event.302.t:0 "[FROM.GetNameDefCap] Kaynak Hakları Teklifimizi Reddetti"
 denmark_expansion_event.4.a:0 "Bu kabul edilebilir."
 denmark_expansion_event.4.b:0 "Kabul edilemez."
 denmark_expansion_event.4.desc:0 "Bu sabah, [DEN.GetAdjective] hükümetinin [ICE.GetNameDef]'in mülkiyetini onlara devretmemizi istediğine dair haber aldık. Onlara göre, bu ada toprağı haklı olarak onların sınırları içinde yer alıyor."
 denmark_expansion_event.4.t:0 "[FROM.GetNameDefCap], [ICE.GetNameDef] ülkesini talep ediyor"
 denmark_expansion_event.400.a:0 "Artık faşist olmadıklarına göre, [GER.GetNameDef] ile aynı safta yer alabiliriz."
 denmark_expansion_event.400.b:0 "Kendi ittifakımızı kuralım ve başkalarını da davet edelim."
 denmark_expansion_event.400.c:0 "Belki de şimdilik bunun dışında kalmamız en iyisidir..."
 denmark_expansion_event.400.desc:0 "[ROOT.GetNameDef], yıllardır dünyayı kasıp kavuran pek çok çatışmada genel olarak tarafsız kalmıştır. Ancak Avrupa'da gerilim bir kez daha tırmanırken, nihayet tarafsız olmanın ne anlama geldiğini sorgulamalıyız. Büyük İskandinavya ve Baltık Denizi, geçtiğimiz birkaç yüzyıldır ülkemiz için odak noktaları olmuştur ve onlarla olan ilişkilerimizde gelecekte nasıl ilerlemek istediğimize karar vermemiz çok önemlidir."
 denmark_expansion_event.400.t:0 "Tarafsızlık Sorunu"
 denmark_expansion_event.401.desc:0 "[FROM.GetNameDefCap] Büyük Savaş sırasında tarafsız kalmış ve o zamandan beri bu konumunu korumuştur, ancak bu sabah aldığımız bir Danimarka [FROM.GetAdjective] heyeti, bu duruşu terk etmeyi düşündüklerini şiddetle ima etti. Bu, onları yanımıza çekmek için uygun bir an olabilir."
 denmark_expansion_event.401.t:0 "[FROM.GetNameDefCap] İttifak Arıyor"
 denmark_expansion_event.5.a:0 "[DEN.GetAdjective] iddiası mutlaktır!"
 denmark_expansion_event.5.desc:0 "Görünüşe göre [FROM.GetNameDefCap], [ICE.GetNameDef] üzerindeki kontrol için anlaşılır taleplerimizi kabul etti. Kardeş uluslarımızın makul davrandığını görmek teşvik edici."
 denmark_expansion_event.5.t:0 "[FROM.GetNameDefCap], [ICE.GetNameDef] için Taleplerimizi Kabul Etti"
 denmark_expansion_event.500.a:0 "[FROM.GetNameDef]'e katılacağız!"
 denmark_expansion_event.500.b:0 "Bugün bir ittifaka ihtiyacımız yok."
 denmark_expansion_event.500.desc:0 "[FROM.GetNameDef], Avrupa'nın küçük uluslarına bir miktar güvenlik sağlamanın yanı sıra dayanışma gösterme çabasıyla bize bir ittifak teklifiyle yaklaştı. [FROM.GetAdjective] dostlarımızla aynı safta mı yer almalıyız? Yoksa kendi başımıza durmamız mı en iyisi?"
 denmark_expansion_event.500.t:0 "İttifak Teklifi"
 denmark_expansion_event.501.a:0 "Mükemmel!"
 denmark_expansion_event.501.desc:0 "[FROM.GetNameDefCap] ittifak teklifimizi kabul etti ve beyannamelerini resmen imzaladı. Fırtınaya karşı birlikte duralım ve gelecek yıllar boyunca birbirimizin güvenliğini sağlayalım."
 denmark_expansion_event.501.t:0 "[DEN.GetNameDefCap] Bir Müttefik Kazanıyor"
 denmark_expansion_event.502.a:0 "Çok Talihsiz."
 denmark_expansion_event.502.desc:0 "Maalesef [FROM.GetNameDef] ittifak teklifimizi reddetti. Görünüşe göre ortak bir güvenlik garantisi onların çıkarına değilmiş."
 denmark_expansion_event.502.t:0 "[FROM.GetNameDefCap] İttifakı Reddediyor"
 denmark_expansion_event.6.a:0 "Kuvvetlerimizi toplayın!"
 denmark_expansion_event.6.desc:0 "[FROM.GetNameDef]'in taleplerimizi reddetmesi inanılmaz! O ada üzerinde haklı bir iddiamız var ve eğer bize barışçıl bir şekilde devredilmezse, o zaman zorla almalıyız!"
 denmark_expansion_event.6.t:0 "[FROM.GetNameDefCap], [ICE.GetNameDef] için Taleplerimizi Reddetti"
 denmark_expansion_event.600.a:0 "Kabul et. Bu sadece ikimizin de güçlenmesine yardımcı olacaktır."
 denmark_expansion_event.600.b:0 "Bunun için zamanımız yok."
 denmark_expansion_event.600.desc:0 "İki ulusumuz arasındaki işbirliği ruhunu artırmak amacıyla, [FROM.GetAdjective] hükümeti teknolojik yeteneklerimizi birbirimizle paylaşabilmemiz için bir araştırma anlaşması yapmamızı talep etti."
 denmark_expansion_event.600.t:0 "[FROM.GetNameDefCap] Araştırma Anlaşması Talep Ediyor"
 denmark_expansion_event.601.a:0 "Birlikte daha güçlüyüz!"
 denmark_expansion_event.601.desc:0 "Harika haber! [FROM.GetNameDefCap] bizimle işbirliğine dayalı bir teknoloji paylaşım programına girmeyi kabul etti. Bu, onların teknolojik gelişmelerine erişimimiz olacağı ve bu ülkenin geleceği için planımızı uygulamaya koyarken bize kesinlikle yardımcı olacağı anlamına geliyor."
 denmark_expansion_event.601.t:0 "[FROM.GetNameDefCap] Araştırma Anlaşmamıza Katılıyor"
 denmark_expansion_event.602.a:0 "Bu çok talihsiz..."
 denmark_expansion_event.602.desc:0 "Tüm çabalarımıza rağmen, [FROM.GetAdjective] hükümeti teknolojilerini kendilerine saklamaya karar verdi. Bu talihsiz bir durum, çünkü birlikte teknolojik yeteneklerimizi şu anda olduğundan çok daha ileriye taşıyabilirdik."
 denmark_expansion_event.602.t:0 "[FROM.GetNameDefCap] Teklifimizi Reddetti"
 denmark_expansion_event.700.desc:0 "[ROOT.GetNameDef] içinde kamuoyunu etkilemeye çalışan [FROM.GetAdjective] hilelerine dair kanıtlar ortaya çıkardık. Danimarkalıların bu faaliyete devam etmesine izin vermek bizim için ciddi sonuçlar doğuracaktır."
 denmark_expansion_event.700.t:0 "[FROM.GetAdjective] Müdahalesi"
 denmark_expansion_event.701.desc:0 "[FROM.GetAdjective], kamuoyunu davamıza karşı daha dostane bir zihniyete sahip olacak şekilde etkileme planlarımızı boşa çıkardı."
 denmark_expansion_event.701.t:0 "[FROM.GetNameDefCap] Planlarımızı Bozuyor"
 denmark_expansion_event.800.desc:0 "Bir [FROM.GetAdjective] heyeti bize yaklaşarak, bizi korumak için askeri yeteneklerinin tüm gücünü teklif etti. Karşılığında istedikleri tek şey diz çökmemiz..."
 denmark_expansion_event.800.t:0 "[FROM.GetNameDefCap] Koruma Teklif Ediyor"
 denmark_expansion_event.801.desc:0 "[FROM.GetAdjective] hükümetinden onları layıkıyla koruma teklifimizle ilgili bir yanıt aldık ve tam korumamızı memnuniyetle kabul ediyorlar!"
 denmark_expansion_event.801.t:0 "[FROM.GetNameDefCap] Korumamızı Kabul Ediyor"
 denmark_expansion_event.802.desc:0 "[FROM.GetAdjective] hükümetinden onları layıkıyla koruma teklifimizle ilgili bir yanıt aldık ve ne yazık ki diz çökmeyi reddediyorlar. Zamanla bunun ne kadar aptalca bir hata olduğunu görecekler."
 denmark_expansion_event.802.t:0 "[FROM.GetNameDefCap] Korumamızı Reddediyor"
 denmark_fascist_event.1.a:0 "İktidara yükselişlerini destekleyeceğiz!"
 denmark_fascist_event.1.b:0 "Şu anda daha büyük endişelerimiz var."
 denmark_fascist_event.1.desc:0 "Bu sabah, ülkelerinde güç toplama girişimlerinde desteğimizi arayan [FROM.GetAdjective] faşist partisinden bir heyeti ağırladık. Onlara yardım edersek, davamız için değerli bir müttefik olabilecek başka bir ulusumuz daha olur."
 denmark_fascist_event.1.t:0 "[FROM.GetNameDefCap] Desteğimizi Arıyor"
 denmark_fascist_event.2.a:0 "Harika!"
 denmark_fascist_event.2.desc:0 "Görünüşe göre dış destek talebimiz, [FROM.GetNameDef]'in hükümet içinde iktidarı ele geçirme girişimimize yardım etmeyi kabul etmesiyle yanıt buldu. Bu, siyasi hareketimiz için doğru yönde atılmış bir adımdır."
 denmark_fascist_event.2.t:0 "[FROM.GetNameDefCap] Desteğini Gönderiyor"
 denmark_fascist_event.20.a:0 "Kabul et. Bu sadece ikimizin de güçlenmesine yardımcı olacaktır."
 denmark_fascist_event.20.b:0 "Bunun için zamanımız yok."
 denmark_fascist_event.20.desc:0 "İki ulusumuz arasındaki işbirliği ruhunu artırmak amacıyla, [FROM.GetAdjective] hükümeti, teknolojik yeteneklerimizi birbirimizle paylaşabilmemiz için bir araştırma anlaşması yapmamızı talep etti."
 denmark_fascist_event.20.t:0 "[FROM.GetNameDefCap] Araştırma Anlaşması Talep Ediyor"
 denmark_fascist_event.21.a:0 "Ordumuz İskandinavların gıptası olacak!"
 denmark_fascist_event.21.desc:0 "Harika haber! [FROM.GetNameDefCap] bizimle işbirliğine dayalı bir teknoloji paylaşım programına girmeyi kabul etti. Bu, onların teknolojik gelişmelerine erişimimiz olacağı ve bu ülkenin geleceği için planımızı uygulamaya koyarken bize kesinlikle yardımcı olacağı anlamına geliyor."
 denmark_fascist_event.21.t:0 "[FROM.GetNameDefCap] Teklifimizi Kabul Etti"
 denmark_fascist_event.22.a:0 "Pekala o zaman, sırlarınızı kendinize saklayın."
 denmark_fascist_event.22.desc:0 "Nazik olma çabalarımıza rağmen, [FROM.GetAdjective] hükümeti teknolojilerini kendilerine saklamaya karar verdi. Bu talihsiz bir durum, çünkü birlikte teknolojik yeteneklerimizi şu anda olduğundan çok daha ileriye taşıyabilirdik."
 denmark_fascist_event.22.t:0 "[FROM.GetNameDefCap] Teklifimizi Reddetti"
 denmark_fascist_event.3.a:0 "Lanet olsun!"
 denmark_fascist_event.3.b:0 "Kendi yolumuzu bulacağız!"
 denmark_fascist_event.3.desc:0 "Maalesef, [FROM.GetAdjective] hükümeti Rigsdagen'i devirme girişimimize destek göndermeyi reddetti. Mevcut durumda, darbemize karşı silahlı bir direniş potansiyeliyle karşı karşıyayız ve bu da iktidara yükselişimizi zorlaştırıyor. Bu son derece hayal kırıklığı yaratıcı."
 denmark_fascist_event.3.t:0 "[FROM.GetNameDefCap] Talebimizi Reddetti"
 denmark_occupation_event.1.a:0 "Bu savaşı kazanamayız"
 denmark_occupation_event.1.b:0 "Durup savaşmalıyız!"
 denmark_occupation_event.1.desc:0 "Açıkça tarafsız olduğumuzu ilan etmemize rağmen, savaş [DEN.GetNameDef] ülkesine geldi. Eğer erken pes edip teslim olursak, halkı savaşın dehşetinden henüz koruyabiliriz. Bu şekilde, uygun tavizler elde edebilir ve yarı bağımsız olarak faaliyet göstermeye devam edebiliriz."
 denmark_occupation_event.1.t:0 "Savaş ya da Teslim Ol"
 denmark_occupation_event.10.a:0 "Ne kadar... beklenmedik"
 denmark_occupation_event.10.desc:0 "İşgale karşı protesto amacıyla [DEN.GetNameDef] genelinde grevler başladı. Bu, hoşnutsuzluk ve direnişi göstermenin barışçıl bir yoludur, ancak [?DEN.DEN_overlord_nation.GetNameDef] ile ilişkimize kesinlikle zarar verecektir."
 denmark_occupation_event.10.t:0 "İşgal Karşıtı Grevler Başladı"
 denmark_occupation_event.100.a:0 "Silah kardeşlerimize hoş geldiniz!"
 denmark_occupation_event.100.b:0 "Onların cılız ordusu olmadan da idare ederiz"
 denmark_occupation_event.100.desc:0 "Görünüşe göre Danimarka hükümeti çıkarlarının nerede yattığını fark etti ve politikasını bizimkiyle uyumlu hale getirmek için yeniden hizaladı. [FROM.GetLeader]'dan askeri yeteneklerini ilerletme ve bizimle güçlerini birleştirme izni için bir talep aldık. Bu, onlara bizden daha bağımsız, daha saldırgan bir dış politika izleme izni verecektir."
 denmark_occupation_event.100.t:0 "Danimarka'nın Yeniden Hizalanması"
 denmark_occupation_event.101.a:0 "Gerçekten de şanlı bir gün!"
 denmark_occupation_event.101.desc:0 "Bilge [FROM.GetLeader], bizi bir müttefik olarak lütfederek kabul etti ve savaş çabalarına katkıda bulunma yeteneğimizi tanıdı. Ayrıca askeri yeteneklerimizi ilerletme izni de aldık. Bütün bunlar, daha saldırgan bir dış politika izlememize ve Nordikleri [FROM.GetAdjective] hakim devletlerimiz için güvence altına almamıza olanak tanıyacaktır."
 denmark_occupation_event.101.t:0 "[FROM.GetNameDefCap] İttifak Teklifimizi Kabul Etti"
 denmark_occupation_event.102.a:0 "Gücümüzü hafife alıyorlar!"
 denmark_occupation_event.102.desc:0 "[FROM.GetLeader], ülkelerimiz arasında daha derin bir işbirliği başlatma talebimizi aptalca reddetti, ki bu işbirliğinde [FROM.GetNameDef]'e yardım edebilir ve yardım teklif edebilirdik. Görünüşe göre müttefiklerine güvenmek yerine tek başlarına gitmeyi tercih ediyorlar."
 denmark_occupation_event.102.t:0 "[FROM.GetNameDefCap] İttifak Teklifimizi Reddetti"
 denmark_occupation_event.11.a:0 "Bu sadece bir başlangıç"
 denmark_occupation_event.11.desc:0 "[?DEN.DEN_overlord_nation.GetAdjective] işgaline karşı ülke çapındaki grevler sona erdi. Danimarka halkı, işgalcilere özgürlük ve hürriyet arzumuzu her zamanki gibi güçlü olduğunu gösterdi."
 denmark_occupation_event.11.t:0 "İşgal Karşıtı Grevler Sona Erdi"
 denmark_occupation_event.110.a:0 "Onları kollarımızı açarak kabul et"
 denmark_occupation_event.110.b:0 "Onların Sadakatine ihtiyacımız yok"
 denmark_occupation_event.110.desc:0 "[FROM.GetLeader]'in bizzat liderliğindeki bir Danimarka heyeti, [ROOT.GetLeadr]'a ve [ROOT.GetAdjective] davasına kişisel olarak sadakat yemini etmek için başkentimize geldi. Danimarka hükümeti işbirliğimizi tam olarak benimsemeye ve ellerinden gelenin en iyisini yapmaya kararlı görünüyor."
 denmark_occupation_event.110.t:0 "[FROM.GetNameDefCap] Sadakatlerini Sunuyor"
 denmark_occupation_event.111.a:0 "Büyük bir güven işareti"
 denmark_occupation_event.111.desc:0 "[FROM.GetLeader], [ROOT.GetLeader]'ı kollarını açarak karşıladı ve değerimizi ve ortaklığa getirdiğimiz katkıyı tanıdı. Bu, ülkelerimizi daha da yakınlaştıracak ve ikimizi de daha güçlü kılacaktır."
 denmark_occupation_event.111.t:0 "[FROM.GetNameDefCap] Sadakatimizi Memnuniyetle Karşılıyor"
 denmark_occupation_event.112.a:0 "Onlara alçakgönüllülük dersi vereceğiz!"
 denmark_occupation_event.112.desc:0 "[FROM.GetLeader] akılsızca [ROOT.GetLeader]'ı geri çevirdi ve sadakatimizi reddetti, yeteneklerimize ve büyüyen gücümüze dudak büktü. Bu, eğer bir gün özgürlüğümüzü geri kazanmak istersek tek bir seçenek bırakıyor; savaş."
 denmark_occupation_event.112.t:0 "[FROM.GetNameDefCap] Sadakatimizi Reddetti"
 denmark_occupation_event.2.a:0 "Onları koruyacağız"
 denmark_occupation_event.2.b:0 "Bu sadece küçük bir engel"
 denmark_occupation_event.2.desc:0 "Danimarka hükümetinden ve [DEN.GetLeader]'den teslimiyet şartlarını belirten bir telgraf aldık. Eğer egemenliklerini ve toprak bütünlüklerini tanımaya ve saygı göstermeye istekliysek, silahlarını bırakmayı ve fiilen bizim altımızda bir himaye olmayı kabul ediyorlar."
 denmark_occupation_event.2.t:0 "[DEN.GetNameDefCap] Teslim Oldu"
 denmark_occupation_event.20.a:0 "Bu silahlar işe yarayacak"
 denmark_occupation_event.20.desc:0 "Dikkatli bir planlama ve cesur bir operasyondan sonra, bir grup direniş üyesi, nominal hakim devletlerimiz için tasarlanmış silahlarla başarılı bir baskından döndü. Bu eylem, özgürlük için devam eden mücadelemizi güçlendirecektir!"
 denmark_occupation_event.20.t:0 "Başarılı Silah Depoları Baskını"
 denmark_occupation_event.3.a:0 "En azından biraz bağımsızlığımızı koruyacağız"
 denmark_occupation_event.3.desc:0 "Savaşın başlarında [FROM.GetNameDef] ile uygun bir barış anlaşması imzalayarak, bağımsızlığımızın bir kısmını korumayı ve hükümet biçimimizi sürdürmeyi başardık. Bu göreceli özgürlüğü fiili bir [FROM.GetAdjective] himayesi olarak korumak için, onlarla işbirliği yapmaya ve geniş bir işbirliği politikası oluşturmaya zorlanıyoruz. Şimdilik."
 denmark_occupation_event.3.t:0 "[FROM.GetNameDefCap] Teslimiyetimizi Kabul Etti"
 denmark_occupation_event.30.a:0 "Büyük bir başarı!"
 denmark_occupation_event.30.desc:0 "Bu operasyona dikkatli bir planlama yapıldı, ancak tüm hazırlıklar ve doğru koşulların ortaya çıkmasını uzun süre beklemek buna değdi. [?DEN.DEN_overlord_nation.GetNameDef]'e Danimarka malları tedarik eden kritik sanayi altyapılarını başarıyla sabote ettik. Bu cüretkar eylem, nominal hakim devletimizin bizden aldığı ürünleri sınırlayacaktır."
 denmark_occupation_event.30.t:0 "Sivil Sanayiler Başarıyla Sabote Edildi"
 denmark_occupation_event.40.a:0 "Büyük bir başarı!"
 denmark_occupation_event.40.desc:0 "Direniş Hareketi üyeleri aylardır bir dizi sabotaj planlıyor ve sonunda planlarını uyguladılar. Hayati önem taşıyan askeri-endüstriyel altyapıyı sabote etmek, [?DEN.DEN_overlord_nation.GetNameDef]'in Danimarka topraklarında üretilen daha az silah alacağı anlamına geliyor."
 denmark_occupation_event.40.t:0 "Askeri Sanayiler Başarıyla Sabote Edildi"
 denmark_occupation_event.5.a:0 "Til modstand, alle danske!"
 denmark_occupation_event.5.desc:0 "[FROM.GetNameDefCap] cömert teslimiyet teklifimizi reddetti ve şiddet ile kanı seçti. [FROM.GetAdjective] birliklerinin kanını kurutacak ve onlara o kadar kolay fethedilmediğimizi göstereceğiz!"
 denmark_occupation_event.5.t:0 "[FROM.GetNameDefCap] Teklifimizi Reddetti"
 denmark_occupation_event.6.a:0 "Nankör arkadan vuranlar"
 denmark_occupation_event.6.b:0 "Onların bir önemi yok"
 denmark_occupation_event.6.desc:0 "[DEN.GetDanishIndependenceDesc]"
 denmark_occupation_event.6.desc_asks_for_independence:0 "Sadık bağlı devletimiz [FROM.GetNameDef]'den, bizzat [FROM.GetLeader] liderliğinde bir heyet aldık. Görünüşe göre, boyunduruklarının sona ermesini görüşmek ve özgürlüklerinin geri verilmesini istemek için doğrudan [ROOT.GetLeader]'a geldiler."
 denmark_occupation_event.6.desc_declares_independence:0 "Görünüşe göre Danimarkalılar kendilerini bağımsız ilan ettiler ve artık hegemonyamızı tanımadıklarını belirtiyorlar. Onlara korumamız altında istikrar ve güvenlik verdik ve aldığımız teşekkür bu mu?"
 denmark_occupation_event.6.t:0 "[DEN.GetDanishIndependenceTitle]"
 denmark_occupation_event.6.t_asks_for_independence:0 "[DEN.GetNameDefCap] Bağımsızlık Talep Ediyor"
 denmark_occupation_event.6.t_declares_independence:0 "[DEN.GetNameDefCap] Bağımsızlığını İlan Etti!"
 denmark_occupation_event.7.a:0 "Til modstand, alle danske!"
 denmark_occupation_event.7.b:0 "Haklılık galip gelecektir!"
 denmark_occupation_event.7.desc:0 "[FROM.GetLeader] bir kez daha mantığı reddediyor ve bağımsızlığımızı tanımayı reddediyor. Özgürlüğümüzü talep etmeli ve onun için savaşmalıyız, çünkü bu kölelikten başka bir çıkış yolu yok gibi görünüyor. Kan dökülecek, ama [ROOT.GetNameDef] bir kez daha özgür olacak!"
 denmark_occupation_event.7.t:0 "Danimarka Bağımsızlık Savaşı"
 denmark_occupation_event.8.a:0 "Bu... Beklenmedik bir şekilde kolaydı"
 denmark_occupation_event.8.desc:0 "[FROM.GetLeader] nihayet aklını başına topladı ve bağımsızlığımızı tanıdı. Görünüşe göre köleliğimiz hiç kan dökülmeden sona erdi."
 denmark_occupation_event.8.t:0 "Danimarka Bağımsızlığı"
 denmark_overlord_events.1.a:0 "Özür dile ve durumu kurtarmaya çalış"
 denmark_overlord_events.1.b:0 "[?DEN.DEN_overlord_nation.GetLeader]'e en iyi dileklerimizi gönder"
 denmark_overlord_events.1.desc:0 "Ülkemiz ile [?DEN.DEN_overlord_nation.GetNameDef] arasında, Kralımızın gönderdiği bir telgraftan kaynaklanan bir diplomatik kriz yaşanıyor. Mesaj sadece 'En iyi teşekkürlerimi sunarım' diyordu, ancak [?DEN.DEN_overlord_nation.GetLeader]'in, Kral'ın [?DEN.DEN_overlord_nation.GetAdjective] liderinin Kral'ın doğum günü vesilesiyle yaptığı tebriklere verdiği baştan savma yanıttan rahatsız olduğu söylendi. \nUluslarımız arasındaki ilişki bir süredir gergindi ve bu, hakim devletimizin bağımsızlığımız ve hükümetimiz üzerindeki hakimiyetini sıkılaştırmak için aradığı bahane olabilir."
 denmark_overlord_events.1.t:0 "Telgraf Krizi"
 denmark_overlord_events.10.a:0 "Uymak zorundayız"
 denmark_overlord_events.10.b:0 "Bu onların işi değil!"
 denmark_overlord_events.10.desc:0 "Ülkelerimiz arasındaki kötüleşen ilişki, [FROM.GetAdjective] Dışişleri Bakanlığı'ndan [ROOT.GetLeader]'ın istifası için resmi bir talebe yol açtı. \n[FROM.GetAdjective] 'koruması' altında benzersiz bir özerklik verilmiş olsak da, ülkelerimiz arasındaki ilişkileri daha da zayıflatmak akıllıca olmayabilir."
 denmark_overlord_events.10.t:0 "[FROM.GetNameDefCap], [ROOT.GetLeader]'ın İstifasını Talep Ediyor"
 denmark_overlord_events.11.a:0 "Demokratik bir lider"
 denmark_overlord_events.11.b:0 "$DEN_knud_bach$"
 denmark_overlord_events.11.c:0 "$DEN_aksel_larsen$"
 denmark_overlord_events.11.d:0 "Faşist bir lider"
 denmark_overlord_events.11.desc:0 "Sadece [ROOT.GetNameDef]'i kimin yöneteceğini değil, aynı zamanda [FROM.GetAdjective] işgal gücüyle kimin ilgileneceğini seçme zamanı geldi."
 denmark_overlord_events.11.t:0 "Yeni Başbakanın Seçimi"
 denmark_overlord_events.12.a:0 "Bir Sosyal Demokrat"
 denmark_overlord_events.12.b:0 "Bir Liberal"
 denmark_overlord_events.12.c:0 "Bir Muhafazakar"
 denmark_overlord_events.12.d:0 "Bir Dışlanmış"
 denmark_overlord_events.12.desc:0 "Demokrasinin güzelliği, sunduğu birçok liderlik seçeneğidir."
 denmark_overlord_events.13.a:0 "$DEN_frits_clausen$"
 denmark_overlord_events.13.b:0 "$DEN_cay_lembcke$"
 denmark_overlord_events.13.desc:0 "Sadece sağlam bir el [ROOT.GetNameDef]'i ileriye götürebilir."
 denmark_overlord_events.14.a:0 "İyi"
 denmark_overlord_events.14.desc:0 "Danimarka hükümeti talebimize uydu ve yeni bir Başbakan seçti."
 denmark_overlord_events.14.t:0 "[FROM.GetNameDefCap] Yeni bir Başbakan Seçiyor"
 denmark_overlord_events.15.a:0 "Şimdi zamanı değil"
 denmark_overlord_events.15.b:0 "Onlara bir ders ver"
 denmark_overlord_events.15.c:0 "Sadık bir işbirlikçi ata"
 denmark_overlord_events.15.desc:0 "Görünüşe göre Danimarka hükümeti, her iki ülke arasında daha iyi bir işbirliği olması için [FROM.GetLeader]'ın Başbakanlıktan istifa etmesi yönündeki samimi talebimizi dinlemeyi reddetti. Danimarka halkıyla ilişkimizi bozan bu tür bir küstahlıktır! Hükümetler arasındaki devam eden işbirliğini kurtarmak için bir şeyler yapılması gerekiyor."
 denmark_overlord_events.15.t:0 "[FROM.GetLeader] İstifa Etmeyi Reddediyor"
 denmark_overlord_events.16.a:0 "Bir gün onlara gerçek alçakgönüllülüğü öğreteceğiz...."
 denmark_overlord_events.16.desc:0 "[FROM.GetAdjective]'in [ROOT.GetLeader]'ın istifa etmesi yönündeki taleplerine boyun eğmeyi reddetmemize yanıt olarak, hakim devletlerimiz bize alçakgönüllülük ve itaat dersi vermek için yeni bir dizi yasa dayatmaya karar verdi."
 denmark_overlord_events.17.a:0 "Başka seçeneğimiz yok..."
 denmark_overlord_events.17.b:0 "Frihed eller død!"
 denmark_overlord_events.17.desc:0 "[FROM.GetNameDefCap], [ROOT.GetLeader]'ın Başbakanlıktan istifa etmeyi reddetmesine yanıt olarak daha [FROM.GetAdjective] yanlısı bir hükümet kurmayı hedeflediklerini açıkça belirtti. Bu, şimdi ayaklanmazsak bizim için daha az bağımsızlık anlamına gelecektir - hazır olsak da olmasak da..."
 denmark_overlord_events.17.t:0 "[FROM.GetAdjective], Sadık bir Hükümet Kurmayı Planlıyor"
 denmark_overlord_events.2.a:0 "Özrü kabul et"
 denmark_overlord_events.2.b:0 "Kabalıkları için onları cezalandır"
 denmark_overlord_events.2.desc:0 "Lütufkar liderimiz [ROOT.GetLeader], [FROM.GetNameDef] kralına mutlu bir doğum günü dileyen içten bir telgraf gönderdi ancak karşılığında kısa ve soğuk bir yanıt aldı. Danimarkalılar şimdi hakaretlerinin ciddiyetini anlıyor ve veliaht prens Frederik'i bizzat [ROOT.GetLeader]'den özür dilemesi için göndermeyi öneriyorlar. \nAncak bu vesileyle, yargı yetkimiz altında oldukça liberal ayrıcalıklardan yararlanan bağlı devletimiz üzerinde daha sıkı bir kontrol uygulayabiliriz."
 denmark_overlord_events.20.a:0 "Halkın iyiliği için yapmak zorundayız..."
 denmark_overlord_events.20.b:0 "Asla boyun eğmeyeceğiz!"
 denmark_overlord_events.20.desc:0 "[FROM.GetnameDef]'in [FROM.GetRulingIdeologyNoun]'un şiddetli bir savunucusu olduğu ve [ROOT.GetRulingIdeologyNoun]'u son derece küçümsediği bir sır değil. Bu nedenle, artık bağlı devletlerinden birinin bu ideolojiye bağlı kalmasına tahammül edememeleri belki de büyük bir sürpriz değil. [ROOT.GetRulingIdeologyNoun]'u terk etmemizi istediklerini kesin bir dille acı bir şekilde açıkça belirttiler."
 denmark_overlord_events.20.t:0 "[FROM.GetnameDefCap] Yeni bir Hükümet Talep Ediyor"
 denmark_overlord_events.21.a:0 "Taban Demokrasisi"
 denmark_overlord_events.21.b:0 "Kral ve Ülke için"
 denmark_overlord_events.21.c:0 "Devrimsiz Komünizm"
 denmark_overlord_events.21.d:0 "Kan dökülmeden Faşizm"
 denmark_overlord_events.21.desc:0 "Hakim devletimizin isteklerine uymaktan başka seçeneğimiz olmadığı için, şimdi yeni bir hükümet kurmalıyız."
 denmark_overlord_events.21.t:0 "Yeni Hükümet"
 denmark_overlord_events.22.desc:0 "Demokrasinin güzelliği, sunduğu birçok liderlik seçeneğidir."
 denmark_overlord_events.22.t:0 "Demokrasi ve Özgürlük Birçok Seçenek Demektir"
 denmark_overlord_events.23.a:0 "İyi. İyi!"
 denmark_overlord_events.23.desc:0 "Danimarkalıları yanlış yollarını terk etmeye ve [FROM.GetRulingIdeologyNoun]'u benimsemeye ikna etmeyi başardık."
 denmark_overlord_events.23.t:0 "[FROM.GetNameDefCap] Boyun Eğiyor ve Hükümeti Değiştiriyor"
 denmark_overlord_events.24.a:0 "Onlarla daha sonra ilgileneceğiz"
 denmark_overlord_events.24.b:0 "O zaman onları zorlayacağız"
 denmark_overlord_events.24.desc:0 "[FROM.GetRulingIdeology] lideri [FROM.GetLeader] of [FROM.GetNameDef], mantığı dinlemeyi ve ülkesi için en iyisini yapmayı reddediyor. Bu tür bir iktidar açlığı davranışı [FROM.GetRulingIdeologyNoun]'un göstergesidir ve Danimarka'nın tepkisine çok şaşırmamalıyız. Onlardan bir örnek yapmamız gerekebilir..."
 denmark_overlord_events.24.t:0 "[FROM.GetLeader] İktidarı Bırakmayı Reddediyor"
 denmark_overlord_events.25.a:0 "Halkı savaştan korumak için uymalıyız"
 denmark_overlord_events.25.desc:0 "[FROM.GetAdjective] talebini [ROOT.GetRulingIdeologyNoun]'u terk etmeyi kesin bir dille reddettik, ancak cevabımızdan memnun kalmayacaklarını anlamalıydık.  [FROM.GetAdjective] [FROM.GetRulingIdeologyNoun] sınır tanımıyor ve her zaman iktidara gelmek için zorlayacaktır."
 denmark_overlord_events.25.t:0 "[FROM.GetNameDefCap], [FROM.GetRulingIdeology] Hükümeti kurmayı planlıyor"
 denmark_overlord_events.26.a:0 "Komünizmi Yasakla"
 denmark_overlord_events.26.b:0 "Özgür iradeyi yasaklamaya zorlanmayacağız!"
 denmark_overlord_events.26.desc:0 "[FROM.GetNameDef]'den ülke çapında her türlü komünist faaliyeti yasaklamamız yönünde talepler aldık. Kararlı [FROM.GetAdjective] hakim devletlerimiz, komünizmi yürekten benimsemiş bir ülkeye karşı cesurca kendini ve özgür dünyayı savunurken bu zararlı ideolojinin gelişmesine izin vermenin vatana ihanetle eşdeğer olduğunu belirtiyorlar."
 denmark_overlord_events.26.t:0 "[FROM.GetNameDefCap] Komünizmi Yasaklamamızı Talep Ediyor"
 denmark_overlord_events.27.a:0 "Zafere Doğru!"
 denmark_overlord_events.27.desc:0 "Danimarka hükümetini, tam da o ideolojiyle ölümüne bir mücadele içinde olduğumuz için komünizmi yasaklamaya başarıyla ikna ettik. Sadece bir galip olabilir ve [ROOT.GetAdjective] halkının refahı için biz galip gelmeliyiz!"
 denmark_overlord_events.27.t:0 "[FROM.GetNameDefCap] Komünizmi Yasaklıyor"
 denmark_overlord_events.28.a:0 "Galip geleceğiz!"
 denmark_overlord_events.28.desc:0 "Tüm ricalarımıza ve ikna çabalarımıza rağmen, Danimarka hükümeti mantığı görmeyi ve komünizmi yasaklamayı reddediyor. Bu yozlaştırıcı ideoloji, tam da komünizm fikriyle ölümüne bir mücadele içinde olduğumuz sırada Danimarka halkının kalbinde pençelerini çoktan geçirmiş gibi görünüyor. Sadece bir galip olabilir ve [ROOT.GetAdjective] halkının refahı için biz galip gelmeliyiz!"
 denmark_overlord_events.28.t:0 "[FROM.GetNameDefCap] Komünizmi Yasaklamayı Reddediyor"
 denmark_overlord_events.29.a:0 "Faşizmi Yasakla"
 denmark_overlord_events.29.desc:0 "[FROM.GetNameDef]'den ülke çapında her türlü faşist faaliyeti yasaklamamız yönünde talepler aldık. Kararlı [FROM.GetAdjective] hakim devletlerimiz, faşizmi yürekten benimsemiş bir ülkeye karşı cesurca kendini ve özgür dünyayı savunurken bu zararlı ideolojinin gelişmesine izin vermenin vatana ihanetle eşdeğer olduğunu belirtiyorlar."
 denmark_overlord_events.29.t:0 "[FROM.GetNameDefCap] Faşizmi Yasaklamamızı Talep Ediyor"
 denmark_overlord_events.3.a:0 "Bir kriz atlatıldı"
 denmark_overlord_events.3.desc:0 "[FROM.GetLeader]'ı yatıştırma çabalarımız şimdilik işe yaramış gibi görünüyor."
 denmark_overlord_events.3.t:0 "[FROM.GetLeader] Özrümüzü Kabul Ediyor"
 denmark_overlord_events.30.desc:0 "Danimarka hükümetini, tam da o ideolojiyle ölümüne bir mücadele içinde olduğumuz için faşizmi yasaklamaya başarıyla ikna ettik. Sadece bir galip olabilir ve [ROOT.GetAdjective] halkının refahı için biz galip gelmeliyiz!"
 denmark_overlord_events.30.t:0 "[FROM.GetNameDefCap] Faşizmi Yasaklıyor"
 denmark_overlord_events.31.desc:0 "Tüm ricalarımıza ve ikna çabalarımıza rağmen, Danimarka hükümeti mantığı görmeyi ve faşizmi yasaklamayı reddediyor. Bu yozlaştırıcı ideoloji, tam da faşizm fikriyle ölümüne bir mücadele içinde olduğumuz sırada Danimarka halkının kalbinde pençelerini çoktan geçirmiş gibi görünüyor. Sadece bir galip olabilir ve [ROOT.GetAdjective] halkının refahı için biz galip gelmeliyiz!"
 denmark_overlord_events.31.t:0 "[FROM.GetNameDefCap] Faşizmi Yasaklamayı Reddediyor"
 denmark_overlord_events.32.a:0 "Silahları teslim et"
 denmark_overlord_events.32.b:0 "Elimizdeki az şeyi savaş bize ulaşırsa diye saklamalıyız..."
 denmark_overlord_events.32.desc:0 "Görünüşe göre [FROM.GetAdjective] stokları tükeniyor ve devam eden çatışmalarını beslemek için bizden silah tedarik etmemizi talep ediyorlar. \nBu aynı zamanda, [FROM.GetAdjective] boyunduruğundan kurtulup ayaklanmamızı engellemek için ulusumuzu sinsi bir şekilde silahsızlandırma hilesi de olabilir."
 denmark_overlord_events.32.t:0 "[FROM.GetNameDefCap] Silah Sevkiyatı Talep Ediyor"
 denmark_overlord_events.33.desc:0 "Danimarka silah sevkiyatı talebimiz, ilk partiyi aldığımızda dikkate alındı."
 denmark_overlord_events.33.t:0 "[FROM.GetNameDefCap] Silah Sağlıyor"
 denmark_overlord_events.34.a:0 "Bu seferlik görmezden geleceğiz..."
 denmark_overlord_events.34.b:0 "Bizi o kadar kolay kandıramayacaklar!"
 denmark_overlord_events.34.desc:0 "Danimarka silah sevkiyatı talebimiz, Danimarka hükümetinin, savaş onlara ulaşırsa diye sahip oldukları az miktardaki silaha ihtiyaç duyduklarına dair dayanıksız bir yanıt vermesiyle reddedildi. Ayrıca tarafsız bir ülke olduklarını ve silah göndermenin bu tarafsızlığı ihlal edeceğini söylediler..."
 denmark_overlord_events.34.t:0 "[FROM.GetNameDefCap] Silah Sağlamayı Reddediyor"
 denmark_overlord_events.35.a:0 "O silahlara bizim çok ihtiyacımız vardı"
 denmark_overlord_events.35.desc:0 "[FROM.GetNameDefCap] blöfümüzü gördü ve fabrikalarımızdan doğrudan onlara sürekli bir silah akışını öngören yeni yasalar dayattı"
 denmark_overlord_events.36.a:0 "Efendimizin emrini yerine getirmeliyiz..."
 denmark_overlord_events.36.b:0 "Hiçbir Danimarkalı yabancı topraklarda ölmeyecek!"
 denmark_overlord_events.36.desc:0 "Görünüşe göre [FROM.GetAdjective] insan gücü tükeniyor ve devam eden çatışmalarını beslemek için bizden adam tedarik etmemizi talep ediyorlar. \nBu aynı zamanda, [FROM.GetAdjective] boyunduruğundan kurtulup ayaklanmamızı engellemek için ulusumuzu sinsi bir şekilde silahsızlandırma hilesi de olabilir."
 denmark_overlord_events.36.t:0 "[FROM.GetNameDefCap] Asker Talep Ediyor"
 denmark_overlord_events.37.desc:0 "Danimarka asker talebimiz, devam eden çatışmalarımızda bize yardımcı olmak için ilk birlikleri gönderdiklerinde hükümetleri tarafından kabul edildi."
 denmark_overlord_events.37.t:0 "[FROM.GetNameDefCap] Asker Sağlamayı Kabul Ediyor"
 denmark_overlord_events.38.b:0 "O zaman onları zorla alırız!"
 denmark_overlord_events.38.desc:0 "Danimarka asker talebimiz, Danimarka hükümetinin, vatandaşlarını yabancı bir ülkede yabancı bir savaşta ölmek üzere göndermeyi reddettiklerine dair dayanıksız bir yanıt vermesiyle reddedildi. Ayrıca tarafsız bir ülke olduklarını ve asker göndermenin bu tarafsızlığı ihlal edeceğini söylediler..."
 denmark_overlord_events.38.t:0 "[FROM.GetNameDefCap] Asker Göndermeyi Reddediyor"
 denmark_overlord_events.39.a:0 "Rezalet!"
 denmark_overlord_events.39.desc:0 "[FROM.GetNameDefCap], Danimarkalı erkekleri yabancı bir savaşta ölüme göndermeyi reddetmemizi görmezden geldi ve tüm yetişkin erkeklerin belirli bir miktarının [FROM.GetAdjective] silahlı kuvvetlerinde hizmet etmesini öngören yeni yasalar dayattı."
 denmark_overlord_events.4.a:0 "Üzücü"
 denmark_overlord_events.4.desc:0 "[FROM.GetLeader] mantığı görmeyi reddediyor ve Kral'ın tebrikine verdiği kısa telgraf yanıtını kişisel bir hakaret olarak kabul etti ve bu talihsiz yanlış anlaşılma için bizi cezalandırmaya kararlı görünüyor."
 denmark_overlord_events.4.t:0 "[FROM.GetLeader] Özrümüzü Reddediyor"
 denmark_overlord_events.40.a:0 "Bu, adı konmamış bir [FROM.GetAdjective] hükümeti olacak"
 denmark_overlord_events.40.b:0 "[ROOT.GetAdjective] halkı buna asla boyun eğmeyecek!"
 denmark_overlord_events.40.desc:0 "[FROM.GetAdjective] Dışişleri Bakanlığı'ndan bir yönerge, [FROM.GetAdjective] liderliğinin ülkelerimiz arasındaki zayıf işbirliğinden ve gergin ilişkiden bıktığını bize bildirdi. Bu nedenle, yasal hükümetimizi bir tam yetkili temsilciyle - [FROM.GetNameDef] sadık bir valisiyle - değiştirmeye karar verdiler. \nBu, kalan özerkliğimizi ve egemenliğimizi ciddi şekilde sınırlayacak ve onarılamaz hasara neden olabilir."
 denmark_overlord_events.40.t:0 "Bir [FROM.GetAdjective] Tam Yetkili Temsilci"
 denmark_overlord_events.41.a:0 "Her şey plana uygun"
 denmark_overlord_events.41.desc:0 "Tam da öngördüğümüz gibi, Danimarka hükümeti baskımıza boyun eğdi ve [FROM.GetNameDef] ülkesini yönetmek için başarılı bir şekilde bir tam yetkili temsilci atadık. Bu, ülke üzerindeki hakimiyetimizi sıkılaştıracak ve onları davamıza daha da yakınlaştıracaktır."
 denmark_overlord_events.41.t:0 "[ROOT.GetAdjective] Tam Yetkili Temsilcisi İktidarı Devralıyor"
 denmark_overlord_events.42.a:0 "Meseleyi daha fazla zorlamayacağız"
 denmark_overlord_events.42.b:0 "Değişim nadiren isteyerek gelir"
 denmark_overlord_events.42.desc:0 "[FROM.GetNameDef] ülkesini yönetmek için sadık bir tam yetkili temsilci atama planlarımız, Danimarka hükümetinin ve halkının katıksız inatçılığı ve aptallığı yüzünden boşa çıktı! Davamıza sadık bir hükümet kurmak, ülke üzerindeki hakimiyetimizi sıkılaştırır ve onları bize daha da yakınlaştırırdı."
 denmark_overlord_events.42.t:0 "Danimarka Hükümeti İstifa Etmeyi Reddediyor"
 denmark_overlord_events.43.a:0 "Meseleyi daha fazla zorlamaya cesaret edemeyiz"
 denmark_overlord_events.43.b:0 "Özgürlüğümüz için savaşacağız!"
 denmark_overlord_events.43.desc:0 "[FROM.GetNameDefCap], güvenilmez olduklarını ve Danimarka bağımsızlığını sona erdirmeye çalıştıklarını bir kez daha gösterdi. [FROM.GetLeader], bir tam yetkili temsilcinin hükümetimizi devralmasına izin vermeyi reddetmemizi görmezden geldi ve yine de bir tane atadı."
 denmark_overlord_events.43.t:0 "[FROM.GetNameDefCap] bir Tam Yetkili Temsilci Hükümetini Zorluyor"
 denmark_overlord_events.44.desc:0 "[FROM.GetAdjective]'in Jutland'ın tamamını ilhak etme yönündeki çirkin bir planını yeni ortaya çıkardık. Bu böyle devam etmeyecek!"
 denmark_overlord_events.44.t:0 "[FROM.GetNameDefCap] Jutland'ı ilhak etmeye çalışıyor!"
 denmark_overlord_events.45.desc:0 "Jutland'ın korunmasını devralma teklifimiz görünüşe göre [FROM.GetLeader]'ın içinde bir şeyleri kırdı, çünkü talebimizi aldıktan sonra sandalyesine yığıldı ve sadece başını salladı."
 denmark_overlord_events.45.t:0 "[FROM.GetNameDefCap] Jutland'ı devrediyor"
 denmark_overlord_events.46.b:0 "Yine de al"
 denmark_overlord_events.46.desc:0 "Jutland'ın korunmasını devralma talebimiz görünüşe göre [FROM.GetLeader]'ı bir öfke nöbetine soktu ve cömert teklifimizi reddetti."
 denmark_overlord_events.46.t:0 "[FROM.GetNameDefCap] Jutland'ı devretmeyi reddediyor"
 denmark_overlord_events.47.desc:0 "[FROM.GetCapitalVictoryPointName]'den bir heyet geldi ve tüm [ROOT.GetNameDef] ülkesinin resmi olarak daha büyük [FROM.GetNameDef] alanına dahil edileceğine dair resmi bildiriyi teslim etti."
 denmark_overlord_events.47.t:0 "[FROM.GetNameDefCap] topraklarımızın geri kalanını talep ediyor!"
 denmark_overlord_events.48.b:0 "Onların zayıf güçleri bize rakip olamaz!"
 denmark_overlord_events.48.desc:0 "[FROM.GetLeader] bize içinde tek bir kelime olan kısa bir telgraf gönderdi - 'asla'. Görünüşe göre tam korumamızı istemiyorlar."
 denmark_overlord_events.48.t:0 "[FROM.GetNameDefCap] İlhakı Reddediyor"
 denmark_overlord_events.5.a:0 "Katılmamız gereken daha acil meseleler var..."
 denmark_overlord_events.5.b:0 "Bu küstahlık cezalandırılmalı!"
 denmark_overlord_events.5.desc:0 "Lütufkar liderimiz [ROOT.GetLeader], [FROM.GetNameDef] kralına mutlu bir doğum günü dileyen içten bir telgraf gönderdi ancak karşılığında kısa ve soğuk bir yanıt aldı. Daha da kötüsü, Danimarkalılar şimdi krallarının gafletini tanımayı ve düzgün bir şekilde özür dilemeyi reddediyor. \nBu, bağlı devletlerimizi yerlerine oturtmak ve yargı yetkimiz altındaki benzersiz ayrıcalıklarının hafife alınmaması gerektiğini onlara hatırlatmak için harika bir fırsat olabilir."
 denmark_overlord_events.6.a:0 "Hatanın sadece kendilerine ait olduğunu kabul etmiş olmalılar"
 denmark_overlord_events.6.desc:0 "Görünüşe göre, [FROM.GetLeader]'in Kralımızın doğum günü telgrafına verdiği kısa ama özlü cevaptan kişisel olarak nasıl hakarete uğradığına dair özür dilemeyi reddetmemiz ya fark edilmedi ya da görmezden gelindi."
 denmark_overlord_events.6.t:0 "Telgraf Krizi Kendiliğinden Çözülüyor"
 denmark_overlord_events.7.a:0 "Bu yasalar sadece geçici - bunu göreceğiz!"
 denmark_overlord_events.7.desc:0 "'Telgraf Krizi' olarak bilinen şeyin ve [FROM.GetLeader]'ın mantığı görememesinin doğrudan bir sonucu olarak, yeni, sert yasalar çıkarıldı ve bize dayatıldı."
 denmark_overlord_events.7.t:0 "[FROM.GetNameDefCap] Sert Yeni Yasalar Uyguluyor"
 denmark_political_events.1.a:0 "Güvensizlik oyu"
 denmark_political_events.1.b:0 "Erken seçim çağrısı yap!"
 denmark_political_events.1.desc:0 "[DEN.GetLeader]'ın liderliği son zamanlarda ağır bir inceleme ve eleştiri altına girdi ve Rigsdag, Başbakan'ın istifa etmesini talep ediyor."
 denmark_political_events.1.t:0 "Güvensizlik Oyu"
 denmark_political_events.10.a:0 "Faşist Yalanları!"
 denmark_political_events.10.b:0 "Komünist Yalanları!"
 denmark_political_events.10.desc:0 "Son seçimdeki başarımızdan sonra, hükümetimizi baltalamak için kötü niyetli yalanlar yayılıyor. Bu söylentilerin arkasında kimin olduğu açık, ama bu konuda yapabileceğimiz çok az şey var. Siyasi muhalefetin bu yalanlar etrafında toplanmasına şaşırmamalıyız!"
 denmark_political_events.10.t:0 "Siyasi Muhalefet"
 denmark_political_events.11.a:0 "Geldiğiniz gölgeye geri dönün!"
 denmark_political_events.11.desc:0 "[ROOT.GetNameDef] devletinde çürümüş bir şeyler var! Sonunda halk tarafından, halk için yönetilen bir hükümet var, ama herkes mutlu değil. Kendini vatansever ilan eden bir hareket ortaya çıktı ve monarşi olan modası geçmiş kurumun arkasında toplanıyor. Biraz ilgi görüyorlar, ama bir tehdit oluşturmuyor gibi görünüyorlar. Henüz."
 denmark_political_events.11.t:0 "Monarşist Hareket"
 denmark_political_events.2.a:0 "Sosyal demokratlar ya da kaos!"
 denmark_political_events.2.b:0 "Liberal bir hükümete ihtiyacımız var"
 denmark_political_events.2.c:0 "Kan dökülmeden bir halk devrimi"
 denmark_political_events.2.d:0 "Gelenek ve istikrara ihtiyacımız var"
 denmark_political_events.2.desc:0 "Rigsdag, Başbakan [DEN.GetLeader] liderliğine karşı bir güvensizlik oylaması için harekete geçmeye karar verdi. Şimdi soru şu, onun yerini kim dolduracak?"
 denmark_political_events.2.e:0 "Yeni bir şeyler denemeliyiz"
 denmark_political_events.2.t:0 "Yeni Liderlik için Oy Ver"
 denmark_political_events.3.a:0 "Demokrasi ya da Kaos"
 denmark_political_events.3.b:0 "Komünist Kampanyayı Planla"
 denmark_political_events.3.c:0 "Bondepartiet'in Kampanyasını Planla"
 denmark_political_events.3.d:0 "Faşist Kampanyayı Planla"
 denmark_political_events.3.desc:0 "[GetElectionCampaignDesc]"
 denmark_political_events.3.desc_annual_election:0 "[DEN.GetNameDef] için yeniden seçim yapma zamanı geldi. Farklı partiler, takipçilerini toplamak ve seçmenleri kendi davalarına seferber etmek için yaklaşan kampanyalarını planlıyorlar."
 denmark_political_events.3.desc_snap_election:0 "Erken seçim çağrısı, [DEN.GetNameDef]’in partilerini seçmenleri kendi davalarına çekmek için aceleyle bir kampanya düzenlemeye sevk etti."
 denmark_political_events.3.t:0 "Seçim Kampanyası Planlaması"
 denmark_political_events.4.a:0 "Medeni olalım"
 denmark_political_events.4.b:0 "Saldırıya geç"
 denmark_political_events.4.c:0 "Rakiplerimize saldır"
 denmark_political_events.4.desc:0 "Farklı Demokratik partiler arasında kampanyalarını nasıl düzenleyecekleri konusunda ortak bir anlaşmazlık var gibi görünüyor. Bazıları zaten yüksek olan gerilimi artırmak istemiyor ve kampanya boyunca medeni bir ton tutmak istiyor. Diğerleri ise tam da bu yüzden ezici bir zafer kazanmak için saldırıya geçmeleri gerektiğini savunuyor - karanlık alt akıntıyı uzak tutmak için. Yine de diğerleri, rakiplerini iktidardan uzak tutmak için onlara aktif olarak saldırmaları gerektiğini savunuyor."
 denmark_political_events.4.t:0 "Demokratik Kampanyayı Başlatma"
 denmark_political_events.5.desc:0 "$DEN_communism_party_long$ saflarında yaklaşan seçim kampanyasıyla ilgili bir anlaşmazlık ortaya çıktı. Bazıları zaten yüksek olan gerilimi artırmak istemiyor ve kampanya boyunca medeni bir ton tutmak istiyor. Diğerleri ise tam da bu yüzden kötülükleri uzak tutmak için saldırıya geçmemiz gerektiğini savunuyor. Yine de diğerleri, rakiplerini iktidardan uzak tutmak için onlara aktif olarak saldırmamız gerektiğini savunuyor."
 denmark_political_events.5.t:0 "$DEN_communism_party$'ın Kampanyasını Başlatma"
 denmark_political_events.6.desc:0 "$DEN_neutrality_party_long$ saflarında yaklaşan seçim kampanyasıyla ilgili bir anlaşmazlık ortaya çıktı. Bazıları zaten yüksek olan gerilimi artırmak istemiyor ve kampanya boyunca medeni bir ton tutmak istiyor. Diğerleri ise [DEN.GetNameDef] için vizyonumuzu uygulamak için saldırıya geçmemiz gerektiğini savunuyor. Ve yine de diğerleri, rakiplerini baltalamanın ve bizi güçlendirmenin tek yolunun onlara saldırmak olduğunu savunuyor."
 denmark_political_events.6.t:0 "$DEN_neutrality_party$'ın Kampanyasını Başlatma"
 denmark_political_events.7.desc:0 "$DEN_fascism_party_long$ içinde yaklaşan seçim kampanyasıyla ilgili bir anlaşmazlık ortaya çıktı. Bazıları zaten yüksek olan gerilimi artırmaktan çekiniyor ve medeni bir ton tutmayı savunuyor. Diğerleri ise [DEN.GetNameDef] için vizyonumuzu uygulamak için saldırıya geçmemiz gerektiğini savunuyor. Ve yine de diğerleri, rakiplerini baltalamanın ve bizi güçlendirmenin tek yolunun onlara saldırmak olduğunu savunuyor."
 denmark_political_events.7.t:0 "$DEN_fascism_party$'ın Kampanyasını Başlatma"
 denmark_political_events.8.a:0 "Demokratik bir Başbakan seç"
 denmark_political_events.8.b:0 "$DEN_aksel_larsen$ bizi yeni bir çağa taşıyacak!"
 denmark_political_events.8.c:0 "$DEN_knud_bach$ bizi doğru yola yönlendirecek"
 denmark_political_events.8.d:0 "$DEN_frits_clausen$ Yükselsin"
 denmark_political_events.8.desc:0 "Danimarka seçimi sona erdi. Farklı partiler, insanları kendi davalarına oy vermeye ikna etmek için ellerinden geleni yaptılar. Kampanya bitmiş olabilir - ama bazıları en zor kısmın şimdi başladığını iddia edecektir; bir hükümet kurmak. Başbakanın seçimi, öngörülebilir gelecek için [DEN.GetNameDef] ülkesinin yolunu belirleyecektir."
 denmark_political_events.8.t:0 "Yeni bir Hükümet Kurma"
 denmark_political_events.9.a:0 "Socialdemokratiet bizi kaostan koruyacak"
 denmark_political_events.9.b:0 "Venstre bizi özgür ve mantıklı tutacak"
 denmark_political_events.9.c:0 "Konservative Folkepartiet bizi koruyacak"
 denmark_political_events.9.desc:0 "Danimarka seçimi bittiğinde, açık kazanan demokrasidir. Tek fikirli Komünistlerin veya tek tip Faşistlerin aksine, Demokratik partiler tek bir blok değildir. Farklı partilerin, [DEN.GetNameDef] ülkesini ilerideki çalkantılı zamanlarda en iyi nasıl yönlendirecekleri konusunda kendi vizyonları vardır. Soru şu ki, yeni bir hükümet kurmasına kimin izin verilmeli?"
 denmark_political_events.9.t:0 "Demokratik bir Başbakan"
 denmark_protection_event.1.a:0 "Antlaşmayı imzalayacağız."
 denmark_protection_event.1.b:0 "Bu şu anda bizim çıkarımıza değil."
 denmark_protection_event.1.desc:0 "Bu sabah [FROM.GetAdjective] hükümetinden bir elçi aldık ve onlarla bir saldırmazlık paktı imzalamayı teklif ettiler. Bu anlaşmayı imzalamayı seçmek, [FROM.GetAdjective] ile daha yakın bir ortaklık geliştirmek anlamına gelecektir."
 denmark_protection_event.1.t:0 "[FROM.GetNameDefCap] bir Saldırmazlık Paktı Teklif Ediyor"
 denmark_protection_event.10.a:0 "Anlaşmayı kabul et."
 denmark_protection_event.10.b:0 "Buna ihtiyacımız yok."
 denmark_protection_event.10.desc:0 "Garanti elde etme çabasıyla, [FROM.GetNameDef] bize topraklarının bir kısmını satmayı teklif etti. Bu oldukça önemli bir teklif ve bu anlaşmayla nasıl ilerleyeceğimizi dikkatlice düşünmeliyiz."
 denmark_protection_event.10.t:0 "[FROM.GetNameDefCap] Toprak Satmayı Teklif Ediyor"
 denmark_protection_event.100.a:0 "Pekala, kabul ediyoruz"
 denmark_protection_event.100.b:0 "Bu işte bir bit yeniği var"
 denmark_protection_event.100.desc:0 "[FROM.GetLeader] of [FROM.GetNameDef], güçlerini birleştirme teklifiyle bize başvurdu ve eğer birlikte durursak, dünyanın büyük güçleriyle bile rekabet edebileceğimizi iddia ediyor. Ne dersiniz?"
 denmark_protection_event.100.t:0 "[FROM.GetNameDefCap] bir İttifak Arıyor"
 denmark_protection_event.101.a:0 "Doğru seçimi yaptılar"
 denmark_protection_event.101.desc:0 "[FROM.GetLeader]'ı temsil eden diplomatlar, son ittifak teklifimize [FROM.GetNameDef]'in yanıtını bize sundular. Savunmalarımızı desteklemez ve birlikte çalışmazsak, savaş dalgası bize ulaştığında ikimizin de düşeceğinin açık olduğunu belirtiyorlar."
 denmark_protection_event.101.t:0 "[FROM.GetNameDefCap] Teklifimizi Kabul Etti"
 denmark_protection_event.102.a:0 "Eylemlerinin sonuçları olduğunu fark etmiyorlar"
 denmark_protection_event.102.desc:0 "[FROM.GetLeader]'ı temsil eden diplomatlar, son ittifak teklifimize [FROM.GetNameDef]'in yanıtını bize sundular. Eğer bize katılırlarsa, haksız yere siyasetlerini etkilemeye çalışacağımızı ve bu tekliften hiçbir kazançları olmadığını, bu nedenle teklifimizi reddettiklerini belirtiyorlar."
 denmark_protection_event.102.t:0 "[FROM.GetNameDefCap] Teklifimizi Reddediyor"
 denmark_protection_event.11.a:0 "Dejligt!"
 denmark_protection_event.11.desc:0 "Harika haber! [FROM.GetNameDefCap], garanti karşılığında toprak satma teklifimizi kabul etti. Anlaşmanın kendi payımıza düşeni yerine getirmek için elimizden gelenin en iyisini yapmalı ve tapuların mülkiyetini [FROM.GetAdjective] hükümeti adına devretmeye hazırlanmalıyız."
 denmark_protection_event.11.t:0 "[FROM.GetNameDefCap] Toprak Satma Teklifimizi Kabul Etti"
 denmark_protection_event.110.a:0 "Daha iyisi için"
 denmark_protection_event.110.b:0 "Bunun için zamanımız yok"
 denmark_protection_event.110.desc:0 "[FROM.GetAdjective] diplomatları, [DEN.GetNameDef] ülkesinin geleceğe daha iyi hazırlanması ve iki ulusumuz arasındaki işbirliğini güçlendirmesi için ortak [ROOT.GetAdjective]-[FROM.GetAdjective] ordu tatbikatları düzenleme talebiyle bize başvurdular."
 denmark_protection_event.110.t:0 "Ortak [ROOT.GetAdjective]-[FROM.GetAdjective] Ordu Tatbikatları"
 denmark_protection_event.111.a:0 "Perfekt!"
 denmark_protection_event.111.desc:0 "[FROM.GetNameDefCap], [ROOT.GetAdjective]-[FROM.GetAdjective] askeri tatbikatları düzenleme teklifimizi kabul etti ve sonuç olarak ikimiz de daha güçlü oluyoruz."
 denmark_protection_event.111.t:0 "Ortak [ROOT.GetAdjective]-[FROM.GetAdjective] Ordu Tatbikatları"
 denmark_protection_event.112.a:0 "Onların kaybı"
 denmark_protection_event.112.desc:0 "[FROM.GetNameDefCap] umutlarımızı boşa çıkardı ve ortak [ROOT.GetAdjective]-[FROM.GetAdjective] askeri tatbikatlarımızı reddediyor. Bizi daha fazla zaman ve çaba harcamak için çok önemsiz gördüler..."
 denmark_protection_event.112.t:0 "[ROOT.GetAdjective]-[FROM.GetAdjective] Tatbikatı Olmayacak"
 denmark_protection_event.12.a:0 "Onların kaybı."
 denmark_protection_event.12.desc:0 "Görünüşe göre [FROM.GetNameDef] ülkesine toprak satma teklifimiz reddedildi. Belki bir dahaki sefere müzakerelerimizde başarılı olmak için anlaşmayı tatlandırmamız gerekecek."
 denmark_protection_event.12.t:0 "[FROM.GetNameDefCap] Toprak Satma Teklifimizi Reddetti"
 denmark_protection_event.120.a:0 "Harika bir başlangıç!"
 denmark_protection_event.120.b:0 "Bizden sızdırmak istiyorlar"
 denmark_protection_event.120.desc:0 "[FROM.GetNameDefCap] birçok bölümde diğerlerine göre geride kalmış olabilir, ancak belirli alanlarda üstündürler. Laboratuvarlarımız arasında daha fazla işbirliğinin her iki tarafta da faydalı atılımlara yol açabileceğini iddia ediyorlar. Kabul ediyor muyuz?"
 denmark_protection_event.120.t:0 "[FROM.GetLeader] Teknoloji Paylaşımı İstiyor"
 denmark_protection_event.121.a:0 "Birlikte daha güçlüyüz"
 denmark_protection_event.121.desc:0 "Minnettar [FROM.GetLeader] of [FROM.GetNameDef], teknoloji paylaşımı talebimizi memnuniyetle kabul etti ve bilim insanlarımız şimdiden çabalarını koordine etmeye başladı."
 denmark_protection_event.121.t:0 "[FROM.GetName] Teknoloji Paylaşımını Kabul Ediyor"
 denmark_protection_event.122.a:0 "Peki o zaman, sırlarınızı saklayın"
 denmark_protection_event.122.desc:0 "Nankör [FROM.GetLeader] of [FROM.GetNameDef], teknoloji paylaşımı teklifimizi reddederek, takastan hiçbir kazançları olmadığını ve sadece bilimsel uzmanlıklarından sızdırmak istediğimizi iddia etti."
 denmark_protection_event.122.t:0 "[FROM.GetName] Teknoloji Paylaşımını Reddediyor"
 denmark_protection_event.130.a:0 "Birlikte duracağız"
 denmark_protection_event.130.b:0 "Yalnız bir yolda yürüyoruz"
 denmark_protection_event.130.desc:0 "[FROM.GetAdjective] diplomatları bize ilgi çekici bir teklifle yaklaşıyor. Birlikte bir fraksiyona katılabileceğimizi, böylece barışı ve karşılıklı korumayı sağlayabileceğimizi ve hiçbirimize zarar gelmemesini sağlayabileceğimizi iddia ediyorlar. Ne dersiniz?"
 denmark_protection_event.130.t:0 "[FROM.GetNameDefCap] Bizi İttifaklarına Davet Ediyor"
 denmark_protection_event.131.a:0 "Perfekt!"
 denmark_protection_event.131.desc:0 "[FROM.GetLeader] of [FROM.GetNameDef], bir fraksiyonda bir araya gelme talebimizi kabul etti ve ihtiyaç duyduğumuzda bize yardım etmeye hazır, tabii ki ihtiyaç anında biz de onlara aynısını yaparsak."
 denmark_protection_event.131.t:0 "[FROM.GetNameDefCap] İttifakımıza Katılıyor"
 denmark_protection_event.132.a:0 "Peki, onların kaybı"
 denmark_protection_event.132.desc:0 "[FROM.GetLeader] of [FROM.GetNameDef], şeytanla bu tür anlaşmalardan çok az kazançları olduğunu belirterek fraksiyonumuza katılma teklifimizi reddetti. Bölgeyi istikrarsızlaştırıyorlar ve aceleyle halledilmeliler!"
 denmark_protection_event.132.t:0 "[FROM.GetNameDefCap] İttifakımıza Katılmıyor"
 denmark_protection_event.2.a:0 "Harika!"
 denmark_protection_event.2.desc:0 "[FROM.GetNameDef]'e gönderdiğimiz elçi iyi haberlerle döndü! [FROM.GetAdjective] hükümeti antlaşmamızı imzalamaya karar verdi ve şimdi ikimiz de bir saldırmazlık paktına girdik. Bu, her iki ulusumuz için de harika bir gün."
 denmark_protection_event.2.t:0 "[FROM.GetNameDefCap] Saldırmazlık Paktını İmzaladı"
 denmark_protection_event.200.a:0 "Dejligt!"
 denmark_protection_event.200.desc:0 "Savaş karşısında, orduyu başlarına gelebilecek her şeye hazırlamak önemlidir. Bu tatbikatları yaparak, birliklerimiz gerektiğinde [DEN.GetNameDef]'in sınırlarını savunmaya fazlasıyla hazır olacak."
 denmark_protection_event.200.t:0 "Ordu Tatbikatları"
 denmark_protection_event.201.a:0 "Dejligt!"
 denmark_protection_event.201.desc:0 "Savaş karşısında, donanmayı başlarına gelebilecek her şeye hazırlamak önemlidir. Bu tatbikatları yaparak, denizcilerimiz gerektiğinde [DEN.GetNameDef]'in sularını savunmaya fazlasıyla hazır olacak."
 denmark_protection_event.201.t:0 "Donanma Tatbikatları"
 denmark_protection_event.202.a:0 "Dejligt!"
 denmark_protection_event.202.desc:0 "Savaş karşısında, hava kuvvetlerini başlarına gelebilecek her şeye hazırlamak önemlidir. Bu tatbikatları yaparak, pilotlarımız gerektiğinde [DEN.GetNameDef]'in gökyüzünü savunmaya fazlasıyla hazır olacak."
 denmark_protection_event.202.t:0 "Hava Kuvvetleri tatbikatları"
 denmark_protection_event.3.a:0 "Zaman kaybı..."
 denmark_protection_event.3.desc:0 "[FROM.GetNameDef]'e gönderdiğimiz elçi kötü haberlerle döndü. [FROM.GetAdjective] hükümeti, bir saldırmazlık paktının şu anda kendi çıkarlarına olmadığına karar verdi. Bu talihsiz bir durum, ancak onları ikna etmek için yapabileceğimiz bir şey yok."
 denmark_protection_event.3.t:0 "[FROM.GetNameDefCap] Saldırmazlık Paktını Reddetti"
 denmark_protection_event.4.a:0 "Artan ticaret ikimize de fayda sağlar."
 denmark_protection_event.4.b:0 "Buna ihtiyacımız yok."
 denmark_protection_event.4.desc:0 "[FROM.GetNameDef]'den iki ülke arasındaki ticareti artırmak istediklerine dair haber aldık. Bunu kabul ederek, şüphesiz [FROM.GetAdjective] ile daha yakın bir bağ geliştireceğiz."
 denmark_protection_event.4.t:0 "[FROM.GetNameDefCap] bir Ticaret Anlaşması Teklif Ediyor"
 denmark_protection_event.5.a:0 "Şartları hazırlamaya başlayın!"
 denmark_protection_event.5.desc:0 "[FROM.GetAdjective] hükümetine sunduğumuz anlaşma kabul edildi! Şimdi bu yeni ticaret anlaşmasını uygulamak için hazırlıklara başlayacağız."
 denmark_protection_event.5.t:0 "[FROM.GetNameDefCap] Ticaret Anlaşmasını Kabul Etti"
 denmark_protection_event.6.a:0 "Çok talihsiz."
 denmark_protection_event.6.desc:0 "Maalesef artan ticaret teklifimiz, tüm çabalarımıza rağmen [FROM.GetNameDef] tarafından reddedildi. Teklifimizi başka bir yere götürmemiz gerekecek gibi görünüyor."
 denmark_protection_event.6.t:0 "[FROM.GetNameDefCap] Ticaret Anlaşmasını Reddetti"
 denmark_protection_event.7.a:0 "Antlaşmayı imzala!"
 denmark_protection_event.7.b:0 "Bunun için zamanımız yok."
 denmark_protection_event.7.desc:0 "[FROM.GetNameDef]'den, her iki ülkemizin de bir araştırma anlaşmasında bir araya gelmesi için bir teklif geldi. Bunu yapmak, teknolojik ilerlemelerimizi birbirimizle paylaşacağımız anlamına gelir. Nasıl ilerlemeliyiz?"
 denmark_protection_event.7.t:0 "[FROM.GetNameDefCap] bir Araştırma Anlaşması Teklif Ediyor"
 denmark_protection_event.8.a:0 "Dejligt!"
 denmark_protection_event.8.desc:0 "Bu sabah [FROM.GetNameDef]'den ortak bir araştırma anlaşması teklifimizi kabul etmeye karar verdiklerine dair haber aldık. Bu harika bir haber ve teknolojik ilerlemelerimizin bundan sonra sadece hızlanacağı anlamına geliyor."
 denmark_protection_event.8.t:0 "[FROM.GetNameDefCap] Araştırma Anlaşmasını Kabul Etti"
 denmark_protection_event.9.a:0 "Hayal kırıklığı."
 denmark_protection_event.9.desc:0 "Bu sabah [FROM.GetNameDef]'den ortak bir araştırma anlaşması teklifimizi reddetmeye karar verdiklerine dair haber aldık. Maalesef bu, [FROM.GetAdjective] hükümetiyle herhangi bir teknoloji paylaşımından faydalanamayacağımız anlamına geliyor."
 denmark_protection_event.9.t:0 "[FROM.GetNameDefCap] Araştırma Anlaşmasını Reddetti"
 denmark_resistance_event.1.a:0 "Özgür bir [DEN.GetNameDef] için!"
 denmark_resistance_event.1.b:0 "Kendi hataları"
 denmark_resistance_event.1.desc:0 "[DEN.GetNameDef] ülkesinden son derece gizli bir şekilde teslim edilen bir mesaj aldık. Gün geldiğinde bağımsızlık iddialarını destekleyebilecek ve egemenliklerini [?DEN.DEN_overlord_nation.GetNameDef] ülkesinden geri almak istediklerinde onlara destek olabilecek müttefikler arıyorlar. Bu çatışmada taraf tutmak istiyor muyuz?"
 denmark_resistance_event.1.t:0 "[DEN.GetNameDefCap] Desteğimizi Arıyor"
 denmark_resistance_event.10.a:0 "Bu tüm ittifakı güçlendirecektir"
 denmark_resistance_event.10.b:0 "Onların anlaşmasını onurlandırmakla yükümlü değiliz"
 denmark_resistance_event.10.desc:0 "[FROM.GetNameDef]'in görünüşe göre [DEN.GetNameDef] ile bağımsızlık ilanlarını desteklemek ve birlikte güçlerini birleştirmek için bir anlaşma imzaladığına dair yeni bir haber aldık. [FROM.GetLeader] şimdi Danimarkalılarla yaptıkları anlaşmanın kendi taraflarını onurlandırmamız ve sürdürmemiz konusunda ısrar ediyor."
 denmark_resistance_event.10.t:0 "[FROM.GetNameDefCap], [DEN.GetNameDefCap]'in İttifakımıza Katılmasını Talep Ediyor"
 denmark_resistance_event.11.a:0 "Düşmanımın düşmanı, dedikleri gibi..."
 denmark_resistance_event.11.b:0 "Onların yardımına ihtiyacımız yok"
 denmark_resistance_event.11.desc:0 "İstihbarat servisimizin üyelerine, ülkelerimiz arasında istihbarat paylaşmak isteyen Danimarkalı meslektaşları tarafından yaklaşıldı. Bu şüphesiz kendi gizli operasyonlarımızı güçlendirecek ve her iki ulusa da fayda sağlayacaktır."
 denmark_resistance_event.11.t:0 "[DEN.GetNameDefCap] İstihbarat Teklif Ediyor"
 denmark_resistance_event.12.a:0 "Akıllıca bir karar"
 denmark_resistance_event.12.desc:0 "[FROM.GetAdjective] istihbarat teşkilatı, ülkelerimiz arasında istihbarat paylaşmanın faydalarını gördü ve teklifimizi kabul etti. "
 denmark_resistance_event.12.t:0 "[FROM.GetNameDefCap] İstihbarat Değişimimizi Kabul Ediyor"
 denmark_resistance_event.13.a:0 "Ne kadar akılsızca bir karar"
 denmark_resistance_event.13.desc:0 "[FROM.GetNameDef] İstihbarat Teşkilatı, akılsız olduğu kadar ileriyi göremeyen biridir, [FROM.GetAdjective] istihbarat başkanı ülkelerimiz arasında istihbarat paylaşmanın faydalarını göremiyor ve teklifimizi reddetti."
 denmark_resistance_event.13.t:0 "[FROM.GetNameDefCap] İstihbarat Değişimini Reddediyor"
 denmark_resistance_event.2.a:0 "Strålende!"
 denmark_resistance_event.2.desc:0 "Cesur [FROM.GetLeader], özgürlüğümüzü geri kazanma mücadelemizde gizlice [FROM.GetAdjective] desteği vermeye karar verdi! Bu, zalim hakim devletlerimizden bağımsızlığımızı ilan etme zamanı geldiğinde kesinlikle çok yardımcı olacaktır."
 denmark_resistance_event.2.t:0 "[FROM.GetNameDefCap] Bizi Desteklemeyi Kabul Etti"
 denmark_resistance_event.20.a:0 "Onları ağırlayacağız"
 denmark_resistance_event.20.b:0 "Hakim devletlerini kızdırmayı göze alamayız"
 denmark_resistance_event.20.desc:0 "[DEN.GetLeader]'den, [ROOT.GetAdjective] topraklarında Danimarkalı birlikleri eğitmek ve donatmak için ağırlama ilgimizi yoklayan gizli bir soruşturma aldık, bu hazırlık [DEN.GetNameDef] ülkesinin tam kurtuluşu içindir. Onları “askeri polis” olarak etiketleyerek sayılarını ve gerçek amaçlarını gizleyebiliriz."
 denmark_resistance_event.20.t:0 "Danimarka'nın Birlik Ağırlama Sorgusu"
 denmark_resistance_event.21.desc:0 "[FROM.GetNameDefCap], zamanı geldiğinde [DEN.GetNameDef] ülkesinin kurtuluşu için onları hazırlamak üzere sürgündeki Danimarka Tugaylarımızı ağırlamayı lütfederek kabul etti."
 denmark_resistance_event.21.t:0 "[FROM.GetNameDefCap] Birliklerimizi Ağırlamayı Kabul Ediyor"
 denmark_resistance_event.22.desc:0 "[FROM.GetNameDefCap], sürgündeki Danimarka Tugaylarımızı ağırlamayı utanç verici bir şekilde reddetti ve zamanı geldiğinde onları [DEN.GetNameDef] ülkesinin kurtuluşu için hazırlamayacak. İhtiyacımız olan yardımı bulmak için başka yerlere bakmalıyız."
 denmark_resistance_event.22.t:0 "[FROM.GetNameDefCap] Birliklerimizi Reddediyor"
 denmark_resistance_event.23.a:0 "Onlara birkaç eski muhrip ver"
 denmark_resistance_event.23.b:0 "Hakim devletlerini kızdırmayı göze alamayız"
 denmark_resistance_event.23.desc:0 "Bir Danimarka heyeti bize gizli bir ziyarette bulundu ve onlara eski Muhriplerimizden bazılarını satmaya istekli olup olmadığımızı sordu. [DEN.GetNameDefCap] kendisini [?DEN.DEN_overlord_nation.GetNameDef] boyunduruğu altında buluyor ve bu, bağımsızlık ilan etmek için güç topladıklarının açık bir göstergesi olabilir. Onlara bağımsızlıklarını geri kazanmalarında yardım etmeye istekli miyiz?"
 denmark_resistance_event.23.t:0 "[DEN.GetAdjective] Eski Gemileri Satın Alma Sorgusu"
 denmark_resistance_event.24.desc:0 "[FROM.GetNameDefCap] akıllıca bir karar vererek eski Muhriplerinden bazılarını bize satmayı kabul etti! Onları [?DEN.DEN_overlord_nation.GetNameDef]'den gizli tutmalı ve sadece saldırma zamanı geldiğinde konuşlandırmalıyız."
 denmark_resistance_event.24.t:0 "[FROM.GetNameDefCap], Bize Muhrip Satmayı Kabul Etti"
 denmark_resistance_event.25.desc:0 "[FROM.GetNameDefCap], eski Muhriplerinden bazılarını bize satma sorgumuzu akılsızca reddetti. Aptalca eylemleri, sularımızı güvence altına alabilmemiz için filomuzu güçlendirmemizi engellemeyecektir. Daha dostane uluslar için başka yerlere bakacağız."
 denmark_resistance_event.25.t:0 "[FROM.GetNameDefCap] Bize Muhrip Satmayı Reddediyor"
 denmark_resistance_event.3.a:0 "Fordømt!"
 denmark_resistance_event.3.desc:0 "Korkak [FROM.GetLeader], özgürlüğümüzü geri kazanma mücadelemizde [FROM.GetAdjective] desteğini esirgemeye karar verdi. İhtiyacımız olan desteği bulmak için başka yerlere yönelmeliyiz."
 denmark_resistance_event.3.t:0 "[FROM.GetNameDefCap] Yardım Çağrımızı Reddetti"
 denmark_resistance_event.30.a:0 "Ne kadar cesur!"
 denmark_resistance_event.30.desc:0 "Kral, işgalci güce karşı sessiz bir protesto olarak her gün Kopenhag'da korumasız gezme alışkanlığı edindi ve [?DEN.DEN_overlord_nation.GetAdjective] işgaline karşı tüm ulusun bir sembolü haline geldi."
 denmark_resistance_event.30.t:0 "Kralın Günlük Gezintileri"
 denmark_resistance_event.4.a:0 "Elimizdekilerle onlara tedarik sağla"
 denmark_resistance_event.4.b:0 "Ayıracak hiçbir şeyimiz yok..."
 denmark_resistance_event.4.desc:0 "[DEN.GetNameDef]'den, direniş hareketlerini silahlandırmak ve özgürlüklerini geri kazanma mücadelelerine yardımcı olmak için silah teslimatı isteyen bir talep aldık."
 denmark_resistance_event.4.t:0 "[DEN.GetNameDefCap] Silah Talep Ediyor"
 denmark_resistance_event.5.desc:0 "[FROM.GetAdjective]ler silah ricalarımıza kulak vermeye karar verdiler ve malzemeyi havadan atmayı planlıyorlar. Direniş üyeleri, teslimatlar için [FROM.GetAdjective] istihbarat servisi üyeleriyle zaten bir buluşma yeri ve zamanı koordine ettiler."
 denmark_resistance_event.5.t:0 "[FROM.GetNameDefCap] Silah Teslim Etmeyi Kabul Etti"
 denmark_resistance_event.6.desc:0 "[FROM.GetAdjective] müttefiklerimizden silah talebimiz reddedildi. Özür dileyerek şu anda ayıracak ekipmanları olmadığını söylediler."
 denmark_resistance_event.6.t:0 "[FROM.GetNameDefCap] Silah Talebimizi Reddetti"
 denmark_resistance_event.7.a:0 "Onlarla güçlerini birleştir!"
 denmark_resistance_event.7.b:0 "Koşullar değişti..."
 denmark_resistance_event.7.c:0 "Buna karar verecek konumda değiliz"
 denmark_resistance_event.7.desc:0 "[DEN.GetNameDefCap], baskıcı hakim devletlerinden bağımsızlıklarını ilan etti. Raporlara göre, [?DEN.DEN_overlord_nation.GetAdjective] lideri [?DEN.DEN_overlord_nation.GetLeader], haberi aldığında öfkeyle köpürdü ve küfürler savurdu. Danimarkalılar şimdi anlaşmamızı onurlandırmamız ve ittifaklarına girmemize izin vermemiz için bize çağrıda bulunuyorlar."
 denmark_resistance_event.7.t:0 "[DEN.GetNameDefCap] Desteğimize Başvuruyor"
 denmark_resistance_event.8.desc:0 "[From.GetLeader] anlaşmamızı onurlandırdı ve ittifaklarına katılmamız için bize bir davetiye uzattı."
 denmark_resistance_event.8.t:0 "[FROM.GetNameDefCap] Bizi İttifaklarına Davet Ediyor"
 denmark_resistance_event.9.a:0 "Hain arkadan vuranlar!"
 denmark_resistance_event.9.desc:0 "Onursuz [From.GetLeader] anlaşmamızdan caydı ve bizi ittifaklarına davet etmeyi reddetti!"
 denmark_resistance_event.9.t:0 "[FROM.GetNameDefCap] Anlaşmamızdan Geri Adım Atıyor"
 denmark_trade_deal.1.a:0 "Bu faydalı olabilir"
 denmark_trade_deal.1.b:0 "Danimarka ürünlerine ihtiyacımız yok"
 denmark_trade_deal.1.desc:0 "Bir Danimarka heyeti bize bir ticaret teklifiyle yaklaştı. Danimarka büyük miktarda gıda ürünü üretiyor ve biz tarihsel olarak bunlardan oldukça fazla ithal ettik. Yakın zamanda yerel para birimleri olan Kronu devalüe ederek tarım ürünlerini çok daha rekabetçi hale getirdiler. Bu ticaret anlaşması, halkımız için gıda güvencesi sağlayacağı ve ikmal hatlarımızı güçlendireceği için bizim için oldukça faydalı olabilir."
 denmark_trade_deal.1.t:0 "[FROM.GetNameDefCap] Bir Ticaret Teklifi Sunuyor"
 denmark_trade_deal.2.a:0 "Her iki taraf için de harika bir karar!"
 denmark_trade_deal.2.desc:0 "Ticaret heyetimiz [FROM.GetName]'dan olumlu sonuçlarla döndü! [FROM.GetAdjective] halkı, tarım sektörümüzü güçlendirecek ve yeni işler ile fırsatlar yaratacak olan önerilen ticaret anlaşmasını imzaladı."
 denmark_trade_deal.2.t:0 "[FROM.GetNameDefCap] Ticaret Teklifimizi Kabul Etti"
 denmark_trade_deal.3.a:0 "O zaman aç kalsınlar!"
 denmark_trade_deal.3.desc:0 "Ticaret heyetimiz [FROM.GetName]'dan hayal kırıklığı içinde döndü. Görünüşe göre [FROM.GetAdjective] halkı, çok sayıda olmasına rağmen, ticaret teklifimizin faydalarını göremedi. Bu, tarım sektörü için bir gerileme olacak, ancak yönetemeyeceğimiz bir şey değil."
 denmark_trade_deal.3.t:0 "[FROM.GetNameDefCap] Ticaret Teklifimizi Reddetti"
 denmark_trade_deal.4.a:0 "Harika bir teklif!"
 denmark_trade_deal.4.b:0 "Zaten ihtiyacımız olan şeye sahibiz"
 denmark_trade_deal.4.desc:0 "[FROM.GetLeader] bize bir ticaret heyeti göndererek tarım ürünleri için mevcut ticaret anlaşmamızı genişletmemizi istedi. Görünüşe göre ürünlerimize doyamıyorlar. Bu anlaşmayı genişletmek daha fazla iş yaratacak ve çiftçilerimizi daha da güçlendirecektir."
 denmark_trade_deal.4.t:0 "Ticaret Anlaşmasını Genişletme Talebi"
 denmark_trade_deal.5.desc:0 "Ticaret heyetimiz [FROM.DetName]'dan gerçekten harika haberlerle döndü! Heyet lideri bize [FROM.GetLeader]'ın anlaşmayı genişletme yönündeki ticaret teklifimizi imzalamaya çok hevesli olduğunu söyledi."
 denmark_trade_deal.6.a:0 "Ne kadar boşa harcanmış bir fırsat!"
 denmark_trade_deal.6.desc:0 "Ticaret heyetimiz [FROM.DetName]'dan endişe verici haberlerle döndü. Heyet lideri bize [FROM.GetLeader]'ın mevcut ticaret anlaşmamızı genişletme konusunda oldukça küçümseyici olduğunu ve ülkelerimiz arasındaki bağları güçlendirmenin faydasını göremediğini söyledi."
 denmark_trade_deal.7.a:0 "O zaman bize daha çok kalır!"
 denmark_trade_deal.7.b:0 "Onların ürünleri olmadan da idare ederiz"
 denmark_trade_deal.7.desc:0 "[ROOT.GetLeader], [FROM.GetLeader]'dan her iki ülke arasındaki tarımsal ticaret anlaşmasının sona ereceğini bildiren kişisel bir telgraf aldı. Hiçbir açıklama yapılmadı, bu da herkesi bu ani kararın arkasındaki anlam hakkında tahmin yürütmeye bıraktı."
 denmark_trade_deal.7.t:0 "[FROM.GetNameDefCap] Ticaret Anlaşmasını İptal Ediyor"
 denmark_trade_deal.8.a:0 "Talihsiz Olaylar"
 denmark_trade_deal.8.b:0 "Anlaşma her halükarda sona ermişti"
 denmark_trade_deal.8.c:0 "Ürünlerimizi hak etmiyorlar!"
 denmark_trade_deal.8.desc:0 "[GetCanceledTradeDesc]"
 denmark_trade_deal.8.desc_subjugation_cancelation:0 "[DEN.GetNameDef]'in [?DEN.DEN_overlord_nation.GetAdjective] istilası ve boyunduruğu altına girmesi nedeniyle Danimarka ürünleriyle yapılan tüm ticaret durdu."
 denmark_trade_deal.8.desc_war_cancelation_denmark:0 "Ülkelerimiz arasındaki son düşmanlıklar nedeniyle [FROM.GetNameDef] ile olan ticaret anlaşması sona erdi."
 denmark_trade_deal.8.desc_war_cancelation_partner:0 "Ülkelerimiz arasındaki son düşmanlıklar nedeniyle [DEN.GetNameDef] ile olan ticaret anlaşması sona erdi."
 denmark_trade_deal.8.t:0 "[GetCanceledTradeTitle]"
 denmark_trade_deal.8.t_subjugation_cancelation:0 "İşgal Danimarka Ticaretini Kesintiye Uğratıyor"
 denmark_trade_deal.8.t_war_cancelation_denmark:0 "Savaş [FROM.GetAdjective] Ticaretini Kesintiye Uğratıyor"
 denmark_trade_deal.8.t_war_cancelation_partner:0 "Savaş Danimarka Ticaretini Kesintiye Uğratıyor"
 friendly_norwegian_monarchy:0 "Nordik Kardeşlerimiz"
 generic_could_lead_to_tt:0 "Şuna yol açabilir:"
 iceland_events.1.a:0 "Geçici olup olmadığını göreceğiz"
 iceland_events.1.desc:0 "[?ICE.overlord_attacker.GetAdjective] kuvvetleri Danimarka'ya saldırdı. [ROOT.getName] umarız tüm taraflarca saygı duyulacak bir tarafsızlık bildirisi yayınladı.\nBir kralın yokluğunda $ICE_sveinn_bjornsson$ naip ilan edildi ve [ROOT.GetName]'ın dış politikasını fiilen devraldı. Bu elbette, işler istikrara kavuşana ve dünya daha barışçıl bir yer olana kadar geçici bir önlem olarak görülmelidir, ancak şimdilik [ROOT.GetName] kelimenin her anlamıyla egemen bir ulus olarak hareket etmektedir."
 iceland_events.1.t:0 "Danimarka Saldırı Altında"
 iceland_events.10.a:0 "O zaman cumhuriyet sanırım"
 iceland_events.10.desc:0 "Danimarka sarayıyla yaptığımız görüşmeler sonuçsuz kaldı. [ROOT.GetName]'ın artık [DEN.GetName]'ın bir bağlı devleti olmak istememesinden hala incinmiş durumdalar. Belki de yolumuza devam etme zamanı gelmiştir."
 iceland_events.10.t:0 "Müzakerelerde Şans Yok"
 iceland_events.11.a:0 "İleriye dönük yolumuz belli"
 iceland_events.11.desc:0 "Tüm çabalarımıza rağmen, [FROM.GetName], [ROOT.GetName]'ın artık [FROM.Capital.GetCapitalVictoryPointName]'dan yönetilmek istemediği gerçeğini kabul etmeyi reddediyor. Hatta güç kullanmakla tehdit edecek kadar ileri gittiler. Ancak, [ROOT.GetName] bir savunma gücü oluşturmaya başladığı için şimdi başarılı olmaları pek olası değil."
 iceland_events.11.t:0 "[FROM.GetName] Üzgün"
 iceland_events.12.a:0 "[101.GetName] ve [337.GetName]'ı da alabilirler"
 iceland_events.12.b:0 "Hayır, bunu hak edecek kadar bir şey yapmadılar"
 iceland_events.12.c:0 "Onlara bir ada vermenin muhtemelen bir zararı olmaz"
 iceland_events.12.desc:0 "[FROM.GetLeader], [FROM.GetAdjective]'in yıllar boyunca ve özellikle son zor zamanlarda [ROOT.GetName]'a yardım etme çabaları için tazminat talep etti. [FROM.GetLeader]'a göre bu, [FROM.GetNameDef]'in büyümesine ve gelecekte [ROOT.GetName]'ı destekleme yeteneğini sürdürmesine ve [FROM.GetName]'ın bu adaları savunmak için daha iyi bir konumda olmasına yardımcı olacaktır."
 iceland_events.12.t:0 "[FROM.GetLeader] Tazminat İstiyor"
 iceland_events.13.a:0 "İmparatorluğumuz büyüyor"
 iceland_events.13.desc:0 "[FROM.GetLeader] haklı tazminat talebimizi tamamen anladı ve destekledi. [FROM.GetName], hem [101.GetName]'ı hem de [337.GetName]'ı [ROOT.GetName]'a devretmeye karar verdi. Adaları savunmak için daha iyi bir konumda olduğumuzu ve daha güçlü bir [ROOT.GetName] yaratmanın herkesin çıkarına olacağını kabul ettiler."
 iceland_events.13.t:0 "[101.GetName] ve [337.GetName] [ROOT.GetAdjective] Olacak"
 iceland_events.14.a:0 "Bizim olanı zorla almak zorunda kalacağız"
 iceland_events.14.desc:0 "Maalesef, yıllar boyunca [FROM.GetName]'a verdiğimiz tüm yardımlar için haklı ve mütevazı tazminat talebimiz sağır kulaklara düştü. [FROM.GetLeader], [FROM.GetName]'ın çıkarına olmasına rağmen bize hiçbir şey vermeyi reddediyor."
 iceland_events.14.t:0 "[FROM.GetLeader] Reddediyor"
 iceland_events.15.a:0 "Bu [ROOT.GetName] için gurur verici bir gün"
 iceland_events.15.desc:0 "Neyse ki [FROM.GetAdjective] hükümeti ihtiyaçlarımızı anladı ve toprak tazminatı talebimizi onayladı. [ROOT.GetName] elbette [FROM.GetName]'ı tazmin etmek için küçük bir miktar para ödemek zorunda kalacak ama bu şu anda küçük bir endişe."
 iceland_events.15.t:0 "[FROM.GetName]'dan Tazminat"
 iceland_events.17.a:0 "Daha acil endişelerimiz var"
 iceland_events.17.b:0 "Zamanı gelince bununla ilgileneceğiz"
 iceland_events.17.desc_generic:0 "[FROM.getAdjective] meclisi, [FROM.GetNameDef]'i başka hiçbir ulusla bağı olmayan, tamamen bağımsız ve egemen bir ülke olarak ilan etti. Bu, bizimle resmi olarak bağlarını kopardıkları ve tek taraflı olarak bağımsızlık ilan ettikleri anlamına geliyor."
 iceland_events.17.desc_kingdom:0 "[FROM.getAdjective] meclisi, X. Christian ile olan ilişkisini geçersiz ve hükümsüz ilan etti. Artık Danimarka Kralı'nı İzlanda Kralı olarak görmüyorlar. Sonuç olarak, Danimarka'nın artık [FROM.getName]'ın iç veya dış politikası üzerinde herhangi bir nüfuzu olmadığını belirttiler."
 iceland_events.17.t:0 "[FROM.GetNameDefCap] Bağımsızlığını İlan Ediyor"
 iceland_events.18.a:0 "Güzel"
 iceland_events.18.desc:0 "[FROM.GetNameDefCap] sadece küçük bir protestoda bulundu. [ROOT.GetAdjective] halkını daha fazla kışkırtmaya cesaret edemediler. [ROOT.GetNameDefCap] şimdi [FROM.GetName] ile olan ilişkiden daha acil konulara odaklanabilir."
 iceland_events.18.t:0 "[FROM.GetNameDefCap], [ROOT.GetAdjective] Bağımsızlığını Kabul Ediyor"
 iceland_events.19.a:0 "Deneyebilirler"
 iceland_events.19.desc:0 "[FROM.GetNameDefCap]'ın savaş çığırtkanları, kendilerine sunulan bağımsızlık antlaşmasını onaylamamaya karar verdiler. Bunun yerine, [ROOT.GetName]'ın [FROM.GetName]'ın bir parçası olduğunda ısrar ediyorlar ve güç kullanarak bağlılığı yeniden kurmakla tehdit ediyorlar. Şimdi gelecek fırtınaya hazırlanmalıyız."
 iceland_events.19.t:0 "[FROM.GetNameDefCap], [ROOT.GetAdjective] Bağımsızlığını Kabul Etmeyi Reddediyor"
 iceland_events.2.a:0 "Harika Bir Fırsat"
 iceland_events.2.b:0 "Hayır, kendi sorunlarıyla kendileri başa çıkmalılar"
 iceland_events.2.c:0 "[ROOT.GetAdjective]-[FROM.OVERLORD.GetAdjective] ilişkilerine zarar vermeyelim"
 iceland_events.2.desc:0 "[ROOT.Capital.GetCapitalVictoryPointName]'daki [ICE.GetAdjective] büyükelçisi, [FROM.GetName]'a asker göndermemizi istedi. Aslında olası bir istilaya karşı [ROOT.GetAdjective] koruması istiyorlar. Bu koruma karşılığında dış politikalarının yönetimini bize devretmeyi teklif ediyorlar."
 iceland_events.2.t:0 "[FROM.GetName], [ROOT.GetAdjective] Koruması İstiyor"
 iceland_events.20.a:0 "Uğruna savaşmaya değmez..."
 iceland_events.20.b:0 "Bunu talep etmek için uygun bir gerekçeleri yok!"
 iceland_events.20.desc:0 "[ICE.GetNameDef]'den [ICE.GetLeader], eski Vikinglerin sınırlarına dayanan yeni bir Kuzey Denizi İmparatorluğu'nun kurulduğunu duyurdu. Grönland bu toprakların bir parçası olduğu için, şimdi adayı nazikçe onlara teslim etmemiz isteniyor."
 iceland_events.20.t:0 "[ICE.GetName] Grönland'ı Geri Vermemizi Talep Ediyor"
 iceland_events.21.a:0 "Bu harika bir haber"
 iceland_events.21.desc:0 "[FROM.GetNameDef]'deki zayıf liderler, bizimle çatışma riskine girmek istemedikleri için Grönland'ın kontrolünü bize vermeye karar verdiler. Bu, şan zamanımızın bir kez daha geldiğini kanıtlıyor!"
 iceland_events.21.t:0 "Grönland Geri Döndü!"
 iceland_events.22.a:0 "Yok olacaklar!"
 iceland_events.22.desc:0 "[FROM.GetNameDef]'den [FROM.GetLeader], Grönland konusunda meydan okumaya devam ediyor. Kılıçlarımızla yok olmayı istedikleri için, istedikleri gibi olacak."
 iceland_events.22.t:0 "[FROM.GetName] Meydan Okumaya Devam Ediyor"
 iceland_events.23.a:0 "Birkaç çorak ada için savaşmaya değmez"
 iceland_events.23.b:0 "Böyle bir şey olmayacak"
 iceland_events.23.desc:0 "[ICE.GetLeader], [ICE.GetNameDef]'i kamuoyuna Kuzey Denizi'nin koruyucusu olarak ilan etti. [ICE.GetNameDefCap] daha sonra Kuzey Denizi adaları nüfusunun güvenliğinin garantörü olarak hareket edecek.\nBu nedenle, [ICE.GetLeader]'a göre, [ROOT.GetNameDef] Kuzey Denizi'ndeki mülklerimizin kontrolünü [ICE.GetName]'e devretmelidir."
 iceland_events.23.t:0 "[ICE.GetName] Kendisini \"Kuzey Denizi Geçidinin Koruyucusu\" ilan ediyor"
 iceland_events.24.a:0 "İmparatorluğumuz Büyüyor"
 iceland_events.24.desc:0 "[FROM.GetNameDef]'deki zayıf liderler, bizimle çatışma riskine girmek istemedikleri için Kuzey Denizi'ndeki mülklerinin kontrolünü bize vermeye karar verdiler."
 iceland_events.24.t:0 "[FROM.GetNameDefCap] Taleplerimize Boyun Eğdi"
 iceland_events.25.a:0 "O zaman zorla olmalı"
 iceland_events.25.desc:0 "[FROM.GetNameDef]'den [FROM.GetLeader], Kuzey Denizi'ndeki mülklerini bize devretmeyi reddediyor. Talebimizle alay ettiler ve adaları istiyorsak zorla almamız gerektiğini söylediler."
 iceland_events.25.t:0 "[FROM.GetName] Meydan Okumaya Devam Ediyor"
 iceland_events.26.a:0 "Eh, olan oldu..."
 iceland_events.26.desc:0 "Açık denizdeki rafinerilerimiz [ICE.GetName] çevresinde daha fazla petrol bulunamadığını bildirdi. Kurudular ve gelecekte daha fazla petrol veya gaz cebi bulunmasını beklemiyorlar ve operasyona devam etmenin sadece kaynak israfı olacağını düşünüyorlar."
 iceland_events.26.t:0 "Petrolümüz Tükendi!"
 iceland_events.3.a:0 "Şimdilik güvendeyiz sanırım"
 iceland_events.3.desc:0 "[FROM.GetAdjective] hükümeti, [ROOT.GetName]'ın savunmasını devralma talebimizi kabul etti. Umarız ülkemiz bundan sadece istila riskiyle karşı karşıya kalmayarak değil, aynı zamanda [FROm.GetAdjective] taahhüdünün ada üzerindeki etkisinden mali olarak da fayda sağlar."
 iceland_events.3.t:0 "[FROM.GetNameDefCap] Kabul Ediyor"
 iceland_events.4.a:0 "O zaman başka çözümler bulmamız gerekecek."
 iceland_events.4.desc:0 "Maalesef, [FROM.GetLeader] [ROOT.GetName]'ı savunmak istemedi. [FROM.GetNameDef]'in zaten yeterince kendi sorunu olduğu gerçeğini ana neden olarak gösteren [FROM.GetLeader], [FROM.GetNameDef]'i [ROOT.GetNameDef]'in koruyucusu olarak ilan etmeye cesaret edemedi."
 iceland_events.4.t:0 "[FROM.GetNameDefCap] Reddediyor"
 iceland_events.45.a:0 "$ICE_sveinn_bjornsson$ mükemmel bir lider"
 iceland_events.45.b:0 "$ICE_hermann_jonasson$ geçmişte ülkeye büyük hizmetlerde bulundu"
 iceland_events.45.c:0 "$ICE_olafur_thors$ bizi geleceğe taşıyabilir"
 iceland_events.45.d:0 "$ICE_brynjolfur_bjarnason$ halkı birleştirebilecek kişidir"
 iceland_events.45.desc:0 "[ROOT.GetName] için Monarşinin prangalarından kurtulma zamanı geldi. İleriye giden yol halkla ve onların seçtiği bir başkanla yatmaktadır."
 iceland_events.45.e:0 "$ICE_gisli_sigurbjornsson$ [ROOT.GetName]'a zafer getirecek"
 iceland_events.45.t:0 "Başkanlık Seçimleri"
 iceland_events.5.a:0 "Bu bir alamet"
 iceland_events.5.b:0 "Son yakın!"
 iceland_events.5.c:0 "Ekonomi, aptallar!"
 iceland_events.5.d:0 "Keşke daha aydınlanmış zamanlarda yaşasaydım"
 iceland_events.5.desc:0 "İspanya'da düşmanlıkların patlak vermesi, İzlanda'nın bölgeye ihracatını önemli ölçüde azalttı. Ülke, İzlanda'nın kurutulmuş balıklarının ana ithalatçısıydı. Bu sadece balıkçılık endüstrisi için değil, tüm İzlanda için talihsiz bir durum, çünkü bu, savaştan ve büyük buhrandan sonra toparlanmaya başlayan birkaç sektörden biriydi."
 iceland_events.5.t:0 "İspanya Savaşı"
 iceland_events.6.a:0 "Dürüst olmak gerekirse, bu konuda yapabileceğimiz pek bir şey yok"
 iceland_events.6.b:0 "Bu küstahlık, bu savaş bittiğinde onlarla ilgileneceğiz"
 iceland_events.6.desc:0 "[FROM.GetLeader] resmi bir bildiri yayınlayarak, [FROM.GetName]'ın Danimarka ile birlikte savaştığını ve kendi sorumluluğunu yerine getirdiğini, bu nedenle dış politikada -veya [FROM.GetAdjective] politikasını ilgilendiren diğer konularda- Danimarka'nın herhangi bir yönlendirmesine artık ihtiyaç kalmadığını belirtti. Bu, her yönüyle fiili bir bağımsızlık ilanıdır."
 iceland_events.6.t:0 "Eşit Ortaklar"
 iceland_events.7.a:0 "Bir Krala ihtiyacımız yok"
 iceland_events.7.b:0 "Danimarka'da daha çok kraliyet üyesi var..."
 iceland_events.7.desc:0 "Danimarka meclisinde yapılan birkaç homurdanma dışında, Danimarka ile eşit statüdeki deklarasyonumuz gerçek bir muhalefetle karşılaşmadı. Danimarkalılar konumumuzu anlıyor ve birlikte savaştığımız gerçeğini göz önünde bulundurarak gelecekteki işbirliğinin eski feodal kurumlardan ve milliyetçi gururdan daha önemli olduğunu düşünüyorlar. Kral Christian, isteğimiz üzerine İzlanda Kralı rolünden feragat etti. Artık tamamen egemen bir ulusuz. Ancak, Monarşi sorunuyla nasıl başa çıkacağımıza karar vermemiz gerekiyor. Şu anda Kralsız bir Monarşiyiz..."
 iceland_events.7.t:0 "[FROM.GetName] Bağımsızlığımızı Kabul Ediyor"
 iceland_events.8.a:0 "Bir kez daha - Prens Knud için"
 iceland_events.8.b:0 "Bunun iyi bir fikir olduğunu sanmıyorum"
 iceland_events.8.desc:0 "Denizdeki küçük kardeşimiz, Kralsız bir monarşinin tuhaf bir şey olduğunu fark etti. Şimdi bize Danimarka kraliyet Prenslerinden birinin İzlanda Kralı olarak taç giymesi talebiyle geri döndüler. Gelecekteki dostluğun bir nişanesi olarak, diyorlar."
 iceland_events.8.t:0 "İzlanda'dan bir talep"
 iceland_events.9.a:0 "Çok yaşa Kral Knud, [ROOT.GetName]'ın hükümdarı!"
 iceland_events.9.b:0 "Harika, yetkilerinin sınırlı olduğundan emin olmalıyız"
 iceland_events.9.desc:0 "[FROM.GetAdjective] sarayıyla yaptığımız müzakereler verimli oldu. Prens Knud'a İzlanda tacı teklif edildi ve kabul etti."
