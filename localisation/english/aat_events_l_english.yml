 Sweden_rearnament.1.a:0 "Silahsızlan"
 Sweden_rearnament.1.b:0 "Düşük bütçe"
 Sweden_rearnament.1.c:0 "Orta bütçe"
 Sweden_rearnament.1.d:0 "Yüksek bütçe"
 Sweden_rearnament.1.desc:0 "Kara kuvvetlerimiz, kıyılarımızı, şehirlerimizi ve sınırlarımızı korumakla görevli ordumuzun ana kas gücüdür.\nYine de, sıradan insan için kabul edilemez olabilecek büyük bir toplumsal parasal maliyete de neden olurlar"
 Sweden_rearnament.1.t:0 "Ordu bütçesi"
 Sweden_rearnament.2.desc:0 "Uzmanlar ve yorumcular, savaşın geleceğinin karada ve denizde olduğu kadar göklerde de yapılacağını söylüyor. Bu yeni savaş türü, büyük güçler tarafından artan bir ilgi gördü ve gelecekteki herhangi bir savunmada kritik olacağı kesin.\nBu savaşma şekli gelecek olsa da, ekmek kıt olduğunda sıradan fabrika işçisi bunu anlayacak mı?"
 Sweden_rearnament.2.t:0 "Hava bütçesi"
 Sweden_rearnament.3.desc:0 "Yüzyıllar boyunca Baltık çevresindeki ülkeler onun girişinin kontrolünü aradılar, İsveç de farklı değil. Uzak kuzeyden batı kıyısına, Kuzey Atlantik Okyanusu'na bakan geniş ve sürekli bir kıyı şeridiyle.\nLeningrad'daki Kızıl Filo ve güneydeki Kreigsmarine'den gelen tehditlerle karşı karşıyayız.\nGüçlü bir donanma savunmamız için kritik olsa da, gereken büyük metal gövdeler ucuz değildir. Bu nedenle dikkatle düşünülmüş bir bütçe önemlidir."
 Sweden_rearnament.3.t:0 "Donanma bütçesi"
 Sweden_rearnament.4.desc:0 "Talep üzerine, bir sonraki yeniden silahlanma komitesinin ne zaman toplanacağını size hatırlatmamızı istediniz. O zaman şimdi ve önümüzdeki yıl için silahlanma politikasını belirleme fırsatımız var.\nDünya bir dönüm noktasına doğru ilerlerken, bu bizi öngörülebilir gelecek için bir plana kilitleyeceği için dikkat ve düşünce netliği gereklidir."
 Sweden_rearnament.4.desc.a:0 "Netlik, gerçekten de"
 Sweden_rearnament.4.t:0 "Yeniden silahlanma komitesi şu anda toplanıyor"
 Sweden_rearnament_delta_low:0 "Etkili değişiklik: [?folkhemmet_air_part_delta_low_tooltip]"
 Sweden_rearnament_delta_medium:0 "Etkili değişiklik: [?folkhemmet_air_part_delta_medium_tooltip]"
 aat_news.1.a:0 "Tarafsızlık Danimarka'yı kurtarmadı"
 aat_news.1.desc:0 "İzlanda Althing'i, Danimarka ve [?ICE.overlord_attacker.GetName] arasındaki çatışmada İzlanda'nın tarafsızlığını ilan eden bir bildiri yayınladı. \nMeclis ayrıca Kral'ın yokluğunda $ICE_sveinn_bjornsson$'ı naip ilan etti ve $ICE_sveinn_bjornsson$ İzlanda'nın dış politikasını yönetecek. Açıklama, bunun geçici bir önlem olduğunu ve çatışma sona erdiğinde Danimarka ile savaş öncesi ilişkilerin yeniden kurulacağını belirtiyor. Ancak o güne kadar İzlanda fiilen bağımsızdır."
 aat_news.1.t:0 "İzlanda Tarafsızlığını İlan Etti"
 aat_news.100.a:0 "Nihai zafere doğru ileri!"
 aat_news.100.b:0 "Ve yalnız savaşmayacaklar!"
 aat_news.100.c:0 "Finler bunun bedelini ödeyecek!"
 aat_news.100.d:0 "[GER.GetLeader]'in bir kuklası daha savaşa katılıyor..."
 aat_news.100.desc:0 "[SOV.GetAdjective] hükümetine karşı önceki savaşlarındaki yenilgilerinin ardından, [FIN.GetAdjective] halkı şimdi seferber oldu ve kaybettikleri toprakları geri almaya ve [FIN.GetAdjective] ile [KAR.GetAdjective] halkını yabancı baskıdan kurtarmaya hazır, [FIN.GetAdjective] Bağımsızlık Savaşı ve Heimosodat'ın manevi bir halefi olarak."
 aat_news.100.desc.2:0 "[SOV.GetAdjective] hükümetinin onları [146.GetName]'den vazgeçmeye zorladığı bir ültimatomun ardından, [FIN.GetAdjective] halkı şimdi harekete geçti ve kaybettikleri bölgeleri geri almak ve [FIN.GetAdjective] ve [KAR.GetAdjective] halkını yabancı baskıdan kurtarmak için manevi bir varis olarak harekete geçti. [FIN.GetAdjective] Bağımsızlık Savaşı ve Heimosodat."
 aat_news.100.desc.3:0 "[SOV.GetAdjective]'nin [FIN.GetNameDef] konusundaki hırsları açıkça görüldüğünde, [FIN.GetAdjective] çalışanları şimdi harekete geçti ve [FIN.GetAdjective] Bağımsızlık Savaşı ve Heimosodat'ın manevi halefi olarak bu planlara önleyici bir şekilde son vermeye hazır durumda."
 aat_news.100.t:0 "[FIN.GetAdjective] Devam Savaşı"
 aat_news.101.a:0 "Bu gerekli bir önlemdir."
 aat_news.101.b:0 "Bu bizi durdurmayacak."
 aat_news.101.c:0 "Barış sürmez..."
 aat_news.101.desc:0 "Kırım Savaşı'ndaki Rus yenilgisinin ardından, Åland adaları askerden arındırıldı ve sakinleri her türlü zorunlu askerlikten muaf tutuldu. Bu statü birçok kez tartışılmış olsa da, hala dünyanın büyük güçlerinin birçoğu tarafından uygulanmaktadır. Ancak şimdi, [FIN.GetAdjective] Kilpapurjehdus Harekatı'nın ardından, adalar yeniden askerileştirildi."
 aat_news.101.t:0 "Åland Adalarının Yeniden Askerileştirilmesi"
 aat_news.105.a:0 "Bu propaganda için iyi bir fırsat!"
 aat_news.105.b:0 "Ölüm adamlarımızı almaya geldi, ama savaşmadan pes etmeyeceğiz!"
 aat_news.105.c:0 "Nasıl savaşacaklarını iyi biliyorlar"
 aat_news.105.desc:0 "Savaş [FIN.GetNameDef]'e geldiğinde, birçok avcı, Suojeluskunta milisi ve atıcılık kulübü nişancısı zalimlerine karşı savaşmak için silaha sarıldı. [FIN.GetAdjective] Sisu'su, [FIN.GetAdjective] doğasını kendi avantajlarına kullanarak düşman saldırılarını durdururken içlerinden akıyor, bu durum düşman askerleri tarafından Beyaz Ölüm olarak bilinmeye başlandı."
 aat_news.105.t:0 "Beyaz Ölüm"
 aat_news.120.a:0 "Yapılması gerekiyordu..."
 aat_news.120.b:0 "Silah arkadaşlığı göstermediğiniz için teşekkürler!"
 aat_news.120.c:0 "İleri yürüyoruz!"
 aat_news.120.d:0 "Kesinlikle ilginç bir gelişme..."
 aat_news.120.desc:0 "Uzun görüşmelerin ardından, [FIN.GetLeader] ve [SOV.GetLeader]'ı temsil eden subaylar ve yetkililer derhal yürürlüğe girecek bir mütareke imzalamayı kabul ettiler. Ancak bu mütareke [FIN.GetNameDef] için ağır bir bedelle geliyor ve [FIN.GetName]'ın müttefikleri kesinlikle ihanetten başka bir şey hissedemezler."
 aat_news.120.t:0 "Moskova Mütarekesi İmzalandı"
 aat_news.121.a:0 "Onları kovalayacağız!"
 aat_news.121.b:0 "Gerçek yüzlerini gösterdiler..."
 aat_news.121.c:0 "Bizim için başka bir zafer"
 aat_news.121.d:0 "Savaşın gidişatı değişti"
 aat_news.121.desc:0 "[FIN.GetAdjective] kuvvetleri, Moskova Mütarekesi sırasında [SOV.GetNameDef] ile imzalanan antlaşmaya uygun olarak [GER.GetAdjective] askerlerini ülkelerinden silahsızlandırmaya ve kovmaya çalışırken [FIN.GetNameDef] ile [GER.GetNameDef] arasında çatışmalar çıktı. [GER.GetAdjective]lerin zamanla [FIN.GetName]'dan kovulacağına şüphe yok, ama soru ne pahasına olduğudur."
 aat_news.121.t:0 "Laponya Savaşı"
 aat_news.2.a:0 "İlginç bir hamle"
 aat_news.2.desc:0 "Biraz şaşırtıcı bir hamleyle, [USA.GetAdjective] hükümeti [ICE.GetName]'ı kendi nüfuz alanı içinde ilan etti ve [ICE.GetAdjective] hükümetinin bir talebi üzerine [ICE.GetName]'ın korunmasına asker göndermeyi kabul etti. Bundan sonra tüm İzlanda dış politikası [USA.GetAdjective] hükümeti tarafından yönetilecek ve [ICE.GetName] fiili bir [USA.GetAdjective] kukla devleti haline gelecektir."
 aat_news.2.t:0 "[ICE.GetAdjective]-[USA.GetAdjective] İşbirliği"
 aat_news.666.a:0 "Görünüşe göre Vikingler geri döndü"
 aat_news.666.desc:0 "Bir zamanlar Büyük Knud tarafından yönetilen tüm toprakları geri alan [From.GetOldAdjective] hükümeti, şimdi yeni fethedilen toprakların entegrasyonuna yönelik hamlelerini artırmaya başladı. Sonuç olarak, halkı devletin arkasında toplama girişiminde, hükümetten açık destek alan pan-milliyetçi propaganda artmıştır.\n\n[FROM.GetOldAdjective] lideri [FROM.GetLeader], [DEN.GetOldNameDef], [NOR.GetOldNameDef] ve İngiltere'nin birleşik Krallıklarının bundan böyle '[From.GetNameDef]' olarak bilineceğini ilan etti."
 aat_news.666.t:0 "Kuzey Denizi İmparatorluğu'nun Restorasyonu"
 aat_news.777.a:0 "Dominium maris baltici"
 aat_news.777.desc:0 "Baltık Denizi bölgesinin çoğunu fethetmeyi başaran [From.GetOldAdjective] hükümeti, şimdi yeni fethedilen toprakların entegrasyonuna yönelik hamlelerini artırmaya başladı. Sonuç olarak, halkı devletin arkasında toplama girişiminde, hükümetten açık destek alan pan-milliyetçi propaganda artmıştır.\n\n[FROM.GetOldAdjective] lideri [FROM.GetLeader], [FROM.GetOldNameDef]'in başka hiçbir ülkenin yapamadığını nasıl başardığı ve Baltık Denizi'ni kendi yönetimi altına aldığı hakkında bir konuşma yaptı. [FROM.GetSheHeCap], konuşmasını '[From.GetNameDef]'nin kurulduğunu ilan ederek bitirdi."
 aat_news.777.t:0 "Baltık Denizi İmparatorluğu'nun Kuruluşu"
 air_budget_event_active:0 "Hava bütçe komitesi aktif"
 army_budget_event_active:0 "Ordu bütçe komitesi aktif"
 denmark_events.1.a:0 "Doğru yönde ilerliyoruz"
 denmark_events.1.desc:0 "Nihayet, yıllarca süren ekonomik zorlukların ardından, Büyük Buhran'ın getirdiği acılar artık geride kaldı. Kriz yılları boyunca, [DEN.GetAdjective] ekonomisini istikrara kavuşturmak ve çöküşün ülkemize verdiği zararı telafi etmek için çok çalıştık."
 denmark_events.1.t:0 "Kriz Yıllarının Sonu"
 denmark_events.100.a:0 "Onu içeri alın, krallığını yeniden kurmak için çalışabiliriz."
 denmark_events.100.b:0 "Burada kral sevgisi yok."
 denmark_events.100.desc:0 "[DEN.GetNameDef]'i kasıp kavuran topyekun devrimden sonra, Danimarka Kralı ve ailesinin ülkemize sığınmak istediğine dair haber aldık. Sürgündeki bir hükümdarı ağırlamak kolay bir karar değil ve bu nedenle bu kadar önemli bir karar vermeden önce seçeneklerimizi tartmalıyız. Danimarka Kralı'na yardım edecek miyiz? Yoksa onu başka bir yere mi göndereceğiz?"
 denmark_events.100.t:0 "Danimarka Kralı Sığınma Talep Ediyor!"
 denmark_events.2.a:0 "Her şeyden önce güvenlik"
 denmark_events.2.desc:0 "Sınırlarımızı güçlendirmek için kaynak aktarma çabasına girdiğimizden beri, halktan, özellikle Avrupa'da büyüyen fırtına konusunda kendilerini daha güvende hissetmeye başladıklarına dair raporlar alıyoruz. Umarım bu savunmalar gelecekte [DEN.GetNameDef]'i işgal etme planları olanları engelleyebilir."
 denmark_events.2.t:0 "Halk Kendini Güvende Hissediyor"
 denmark_events.200.a:0 "Huzur içinde yatsın"
 denmark_events.200.desc:0 "Önde gelen siyasetçi Thorvald Stauning hayatını kaybetti. Danimarka'da birkaç dönem başbakanlık yapmış ve birçok kişi tarafından takdir edilmiştir. Hayatının sonlarına doğru Avrupa'da sosyal demokrasinin geleceği konusunda giderek daha fazla endişelenmeye başladı."
 denmark_events.200.t:0 "Thorvald Stauning Öldü"
 denmark_events.201.a:0 "Yaşasın Kral"
 denmark_events.201.desc:0 "Otuz beş yıl boyunca Danimarkalı tebaasına hükmeden ve ülkeye Avrupa'nın en çalkantılı zamanlarından bazılarında rehberlik eden Kral X. Christian, dün gece sessizce vefat etti. Yerine oğlu IX. Frederik geçti."
 denmark_events.201.t:0 "Kral X. Kristian Öldü"
 denmark_events.300.a:0 "Leg Godt"
 denmark_events.300.desc:0 "Tuğla tuğla ekonomimizi yeniden inşa etmeyi başardık ve neredeyse her gün yeni şirketler kuruluyor ve ülke refaha kavuşuyor. Bazı şirketlerin plastiklerle neler yapabileceklerini denemeye başlamasıyla teknolojik bir değişim de yaşanıyor."
 denmark_events.300.t:0 "Yeni Şirketler Kuruluyor"
 denmark_events.666.a:0 "Bırakın dünya ihtişamımızla yıkansın!"
 denmark_events.666.b:0 "Bu biraz aşırı görünüyor..."
 denmark_events.666.desc:0 "Uzun bir süredir, en büyük günlerimizin geride kaldığına inanarak sönük bir varoluş yaşadık. Büyüklük hayallerini hiç düşünmeden reddettik - ama artık değil. Önümüzde yeni bir Altın Çağ var! Gücümüz ve nüfuzumuz her geçen gün artıyor ve Büyük Danimarka'yı ilan etme zamanı geldi."
 denmark_events.666.t:0 "Büyük Danimarka Yükseliyor"
 denmark_expansion_event.1.a:0 "Kabul etmekten başka çaremiz yok."
 denmark_expansion_event.1.b:0 "Danimarkalılara boyun eğemeyiz!"
 denmark_expansion_event.1.desc:0 "[DEN.GetAdjective] hükümeti bize, [ICE.GetNameDef] ülkesinin onlara teslim olmasını ve uluslarının katına alınmasını talep eden bir ültimatom gönderdi. Dikkatli olmalıyız, çünkü cevabımız [ICE.GetNameDefCap]'nın egemen bir ülke olarak geleceğini belirleyebilir veya en kötü ihtimalle bizi savaşa daha da yakınlaştırabilir."
 denmark_expansion_event.1.t:0 "[FROM.GetNameDefCap] İlhakımızı Talep Ediyor"
 denmark_expansion_event.10.a:0 "Komşumuzla bir savaşa sürüklenmemeliyiz."
 denmark_expansion_event.10.b:0 "[DEN.GetNameDefCap]'in topraklarımızda hiçbir hakkı yok."
 denmark_expansion_event.10.desc:0 "Görünüşe göre [DEN.GetAdjective] hükümeti çizmelerini boynumuza basmaya hevesli. 'Teklifleri', kaynak edinme temelinde tamamen onların yönetimine boyun eğmemizi talep ediyor. Kan dökülmesini önlemek istiyorsak, belki de boyun eğmeliyiz, aksi takdirde bize savaş ilan edebilirler."
 denmark_expansion_event.10.t:0 "[FROM.GetNameDefCap] Boyun Eğmemizi Talep Ediyor"
 denmark_expansion_event.100.a:0 "Buna izin vermekten başka seçeneğimiz yok."
 denmark_expansion_event.100.desc:0 "[DEN.GetLeader], ülkemizi daha geniş [DEN.GetAdjective] Krallığı'na gerçekten entegre etme sürecini başlattığını bize bildirdi."
 denmark_expansion_event.100.t:0 "[FROM.GetNameDefCap] Entegrasyon Sürecini Başlattı"
 denmark_expansion_event.11.a:0 "[DEN.GetNameDefCap] daha da büyüyecek!"
 denmark_expansion_event.11.desc:0 "Harika haber! Görünüşe göre [SWE.GetNameDef], kaynaklarının bizimle paylaşılmasının daha iyi olduğunu anlıyor. En azından şimdi, ülkeleri yeni modern askeri kuvvetlerimiz tarafından korunabilir!"
 denmark_expansion_event.11.t:0 "[FROM.GetNameDefCap] Boyun Eğme Teklifimizi Kabul Etti"
 denmark_expansion_event.12.a:0 "Boğazı geçmeye hazırlanın!"
 denmark_expansion_event.12.desc:0 "[SWE.GetAdjective] hükümetindeki o aptallar, makul boyun eğme teklifimizi reddetmeye karar verdiler! Peki, bize kaynaklarını vermezlerse, o zaman kendimiz almak zorunda kalacağız."
 denmark_expansion_event.12.t:0 "[FROM.GetNameDefCap] Boyun Eğme Teklifimizi Reddetti"
 denmark_expansion_event.13.a:0 "Onları kızdırmayalım."
 denmark_expansion_event.13.b:0 "[SWE.GetNameDefCap] bizim korumamız altında!"
 denmark_expansion_event.13.desc:0 "Bu sabah [DEN.GetAdjective] hükümetinden, [SWE.GetNameDef] ülkesini kontrollerine devretmemizi talep eden bir talep aldık. Hükümdarlarımız arasındaki ailevi bağlar nedeniyle [DEN.GetNameDef]'e sadakatimiz var, ancak reddetmenin kan bağına bakılmaksızın [DEN.GetNameDef] ile savaşa yol açabileceğini de göz önünde bulundurmalıyız."
 denmark_expansion_event.13.t:0 "[FROM.GetNameDefCap], [SWE.GetNameDef] ülkesini talep ediyor"
 denmark_expansion_event.14.a:0 "[DEN.GetAdjective] dökümhaneleri için [SWE.GetAdjective] metali."
 denmark_expansion_event.14.desc:0 "[NOR.GetAdjective]ler aklını başına topladı ve taleplerimize boyun eğdi. [SWE.GetNameDefCap] bizimdir ve kaynakları artık yeni ordumuzu finanse etmek için sömürülebilir."
 denmark_expansion_event.14.t:0 "[FROM.GetNameDefCap], [SWE.GetNameDef] için Taleplerimizi Kabul Etti"
 denmark_expansion_event.15.a:0 "O zaman savaş olsun."
 denmark_expansion_event.15.desc:0 "[NOR.GetNameDefCap], [SWE.GetAdjective] ilhakı taleplerimizi reddetmeye karar verdi. Bu çok hayal kırıklığı yaratıyor, ancak bu bizi haklı olarak o kaynakları talep etmekten alıkoyamaz."
 denmark_expansion_event.15.t:0 "[FROM.GetNameDefCap], [SWE.GetNameDef] için Taleplerimizi Reddetti"
 denmark_expansion_event.2.a:0 "Mantığı görebildiklerine sevindim."
 denmark_expansion_event.2.desc:0 "Bu sabah [ICE.GetAdjective] hükümetinin topraklarını [DEN.GetNameDefCap] ile yeniden bütünleştirme teklifimizi lütfederek kabul ettiğine dair haber aldık. Bu, her iki ulusumuzun da düşmanlarımıza karşı daha güçlü durmasına yardımcı olacaktır."
 denmark_expansion_event.2.t:0 "[FROM.GetNameDefCap] Yeniden Bütünleşme Teklifimizi Kabul Etti"
 denmark_expansion_event.20.a:0 "Diz çökmekten başka çaremiz yok."
 denmark_expansion_event.20.b:0 "Bir daha asla başka bir ulus tarafından yönetilmeyeceğiz!"
 denmark_expansion_event.20.desc:0 "[DEN.GetNameDef] ülkesinin [NOR.GetNameDefCap]'in boyun eğmesini ve 1814'ten beri ilk kez tekrar [DEN.GetAdjective] yönetimi altına girmemizi talep etmesiyle güneyden acı haberler geldi. İsveçlilerden bağımsızlığımızı kazanmak için çok savaşmış olabiliriz, ama gerçekten Danimarkalılarla savaşıp ayakta kalmaya hazır mıyız?"
 denmark_expansion_event.200.a:0 "Taleplerine boyun eğmeliyiz..."
 denmark_expansion_event.200.b:0 "[ROOT.GetNameDefCap] Danimarkalılara asla boyun eğmeyecek!"
 denmark_expansion_event.200.desc:0 "[DEN.GetNameDefCap], [ICE.GetAdjective] toprağımız üzerinde tarihi iddiaları olduğu izlenimine kapılmış görünüyor. Eğer buna göz yumarsak, topraklarımızı [DEN.GetAdjective] yayılmacılığına kaybetme riskiyle karşı karşıya kalırız. Reddederseniz, o zaman topyekün savaş olur."
 denmark_expansion_event.200.t:0 "[FROM.GetNameDefCap], [ICE.GetAdjective] Mülklerimizi Talep Ediyor"
 denmark_expansion_event.201.a:0 "Müzakereler kısa sürdü."
 denmark_expansion_event.201.desc:0 "[FROM.GetNameDefCap], toprakları üzerindeki haklı iddiamızı kabul etme yönünde akıllıca bir karar verdi. Hükümetleri tarafından akıllıca bir hamle, şüphesiz."
 denmark_expansion_event.201.t:0 "[FROM.GetNameDefCap], [ICE.GetAdjective] İddialarımızı Kabul Ediyor"
 denmark_expansion_event.202.a:0 "Belki saldırganlık onları daha uysal yapar."
 denmark_expansion_event.202.desc:0 "Maalesef onlar için, [FROM.GetAdjective] hükümeti iddialarımızı çürüttü. Görünüşe göre haklı olarak [DEN.GetAdjective] olanı güvence altına almak için kapılarına savaş getirmekten başka seçeneğimiz yok."
 denmark_expansion_event.202.t:0 "[FROM.GetNameDefCap], [ICE.GetAdjective] İddialarımızı Reddediyor"
 denmark_expansion_event.21.a:0 "Kuzey Cephesi güvende."
 denmark_expansion_event.21.desc:0 "[NOR.GetNameDefCap], kuvvetlerimiz tarafından işgal edilme teklifimizi akıllıca kabul etti. Kuzeydeki topraklar güvende olduğuna göre, şimdi sınırlarımızı başka yerlerde genişletmeye odaklanabiliriz."
 denmark_expansion_event.210.a:0 "Taleplerine boyun eğmeliyiz..."
