 denmark_expansion_event.23.a:0 "[DEN.GetNameDef] ile bir sorunumuz yok. Bırakın alsınlar."
 denmark_expansion_event.23.b:0 "[NOR.GetNameDefCap] bize aittir!"
 denmark_expansion_event.23.desc:0 "[NOR.GetNameDef]'in mevcut işgalcileri olarak, [DEN.GetNameDef]'in bu topraklar için taleplerle gelmesi sadece bir zaman meselesiydi. [NOR.GetNameDef]'in teknik olarak [DEN.GetAdjective] toprağı olduğunu iddia ediyorlar. Bir seçeneğimiz var: Danimarkalıların [NOR.GetNameDef] ülkesini almasına izin verin veya taleplerini reddedip savaş olasılığına hazırlanın."
 denmark_expansion_event.23.t:0 "[FROM.GetNameDefCap], [NOR.GetNameDef] ülkesini talep ediyor"
