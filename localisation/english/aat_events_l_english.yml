 NOR_exiled_monarchy_to_desc_DEN:0 "Danimarka'daki adıyla Prens Carl olarak geri dönen, kardeşi Kral Frederick tarafından [DEN.GetName] ülkesinde karşılanacak ve burada Danimarka toplumunda kraliyet mensuplarının ne rolü varsa onu yerine getirecektir."
 NOR_exiled_monarchy_to_desc_ENG:0 "Anavatanı [DEN.GetName] ülkesine dönme seçeneği olmadığı için, eski kral Haakon ve ailesi şimdi [ENG.GetName] ülkesinde sürgünü kabul etmek zorunda kaldı, bir zamanlar Danimarka Prensi Carl ve Galler Prensesi Maud'un, yani eski kraliyet çiftinin eski benliklerinin düğününe ev sahipliği yapan topraklarda."
 NOR_exiled_monarchy_to_desc_NONE:0 "Dünya 1905'tekinden çok farklı bir yer. Yeni kurulan Norveç Monarşisi, hükmedecek bir ülke olmadan ve sürgünlerini geçirecek bariz bir yer olmadan kendini buluyor. Dünyada monarşizm yakında sona erecek."
 NOR_exiled_monarchy_to_desc_SWE:0 "Ne Kral Haakon'un ne de Kraliçe Maud'un anavatanlarına dönemeyen eski Kraliyet Ailesi, gururlarını bir kenara bırakıp bizde bir yer aramayı seçti. Ailevi bağların olmamasına rağmen, bir İskandinav monarşisini yok olmaktan korumak bizim görevimizdir."
