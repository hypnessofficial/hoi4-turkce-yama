 denmark_expansion_event.22.a:0 "[NOR.GetNameDefCap] bir kez daha [DEN.GetAdjective] olacak!"
 denmark_expansion_event.22.desc:0 "[NOR.GetAdjective]'ler, egemenliklerini güvence altına alma bahanesiyle ilhak teklifimizi reddettiler. Bu bahane, yapmamız gerekeni yapmamızı engellemeyecektir."
