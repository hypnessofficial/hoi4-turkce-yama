l_english:
 AAT_MIO_events.2.a:0 "$CZE_skoda_shipyards$'ne yatırım yap"
 AAT_MIO_events.2.b:0 "$CZE_skoda_armor$'na yatırım yap"
 AAT_MIO_events.2.c:0 "$CZE_skoda_artillery$'na yatırım yap"
 AAT_MIO_events.2.desc:0 "$CZE_skoda_works$'daki sanayiciler yatırım için can atıyor, ancak şirket içindeki üç şubeden sadece birine para yatırabiliyoruz. Bunu yapmak, gemi, tank veya topçu ekipmanlarının geliştirilmesine öncelik vermelerini sağlayacaktır."
 AAT_MIO_events.2.t:0 "$CZE_skoda_works$ Yatırımları"
 AAT_Sweden.1.a:0 "Çiftçi partisi en iyi seçenektir"
 AAT_Sweden.1.b:0 "Per-Albin'in istifa etmesi için bir neden yok"
 AAT_Sweden.1.b_tt:0 "§RBunun olumsuz siyasi yansımaları olacak§!"
 AAT_Sweden.1.c:0 "Açıkçası sağdaki muhalefet partisi"
 AAT_Sweden.1.desc:0 "1930'da devlet, İsveç'in gelecekteki savunma harcamaları için rehberlik sağlamak üzere bir parlamento soruşturması atadı. Çiftçi partisi, ılımlılarla birlikte artan harcamaları zorlarken, Sosyal demokratların Başbakanı Per-Albin Hansson, böyle bir hareketin sosyal reform vizyonunu baltalayacağını söyleyerek buna şiddetle karşı çıkıyor.\nKomşularından gelen giderek daha tehditkar söylemlerin ortasında, soruşturma şimdi sağ eğilimli partilerin yanında yer alıyor. Belirterek ki \"savunmada bir ihmal devletin ve halkının çıkarlarına aykırı olur\".\n\nBu, Per-Albin Hansson'un yaklaşan 1936 seçimlerinde tabanını sağlamlaştırana kadar istifa tehdidinde bulunmasıyla bir hükümet krizine neden oldu.\nBu arada, yaklaşan seçime kadar liderlik edecek birini atamalıyız."
 AAT_Sweden.1.t:0 "Hükümet komisyonu yeniden silahlanmayı tavsiye ediyor"
 AAT_Sweden.10.a:0 "Hükümette ona hala ihtiyaç var"
 AAT_Sweden.10.b:0 "Bırakın gitsin"
 AAT_Sweden.10.desc:0 "Bugün Herman Eriksson, Vin och Sprit AB'nin genel müdürlük görevini üstlenmek üzere emekli olmak istediğini belirten istifa mektubunu teslim etti.\nİsteklerine rağmen hükümette hala ona ihtiyaç duyulabilir, ancak devletin sahip olduğu bir likör üreticisinin CEO'su olarak onun olması faydalı olabilir."
 AAT_Sweden.10.t:0 "Herman Eriksson istifa mektubunu teslim etti"
 AAT_Sweden.11.a:0 "Belki de [GER.GetNameDef] mülkiyetindeki askeri komplekslere sahip olmak iyi bir fikir değildi"
 AAT_Sweden.11.desc:0 "[SWE.GetNameDef] ve [GER.GetNameDef] arasındaki düşmanlıkların patlak vermesinden sonra, Alman personeli Landsverk fabrikalarını geçici olarak ele geçirmeyi ve komplekslerin içinde barikat kurmayı başardı. Ordunun kompleksi zamanında ele geçirmesi beklense de, çatışma sırasında bir miktar hasar bekleniyor ve bu nedenle fabrikalar bir süre tam olarak faaliyete geçemeyecek.\nAlmanya'daki Landsverk fabrikası hakkında çok az şey biliniyor, ancak İsveç makamları misilleme olarak [GER.GetNameDef] hükümeti tarafından ele geçirileceğinden şüphe duymuyor."
 AAT_Sweden.11.t:0 "[GER.GetNameDef] işçileri Landsverk fabrikalarının kontrolünü ele geçirdi"
 AAT_Sweden.12.a:0 "Gerçekten bir trajedi"
 AAT_Sweden.12.desc:0 "Bugün [?SWE.bus_capture_tag.GetAdjective] yetkilileri, [?SWE.GetLeader]'in yakalanmasını ve ardından ölümünü duyurdu. [?SWE.bus_capture_tag.GetAdjective] komandolarının, başbakanın cephe hattına yakın bir yerde sıkışıp kalmış mobil karargahını kısmen kuşatmayı başardığını belirtiyorlar.\n[?SWE.GetLeader] ve personelinin içinde bulunduğu otobüsle temas kurulduğunda, komandolar başbakanın araçtan çıkarken tökezleyip yere düştüğünü iddia ediyor. Devam eden düşmanlıklara rağmen [?SWE.bus_capture_tag.GetAdjective] yetkilileri, merhum Başbakan'ın cenazesini devlet töreni için lütfederek iade etti. Otopsi, başbakanın kalp krizi geçirdiğini ve ardından kalp durması yaşadığını ortaya çıkardı.\nOrtaya çıkan kaosa rağmen, Tage Erlander uygun seçimler yapılana kadar acil durum Başbakanı olarak kontrolü ele aldı."
 AAT_Sweden.12.t:0 "[?ROOT.GetLeader] kalp krizinden öldü"
 AAT_Sweden.13.a:0 "İyi bir anlaşma gibi görünüyor"
 AAT_Sweden.13.b:0 "Hepsi [THIS.GetNameDef] ülkesine ait"
 AAT_Sweden.13.desc:0 "İsveç hükümeti Narvik çevresindeki bölgenin kontrolünü talep etti. Bunun sadece insani olduğunu ve Norveç halkını devam eden çatışmadan koruma arzusundan kaynaklandığını iddia ediyorlar. Bir güvenlik garantisi olarak bölgeyi askerden arındırmayı teklif ettiler ve çatışmanın sonuna kadar gerekli tüm polislik faaliyetlerini yerine getireceklerdi.\nNorveç halkı muhtemelen bir İsveç işgal bölgesi altında daha mutlu olurdu, bu da cephedeki birliklerimiz için daha fazla kaynak serbest bırakırdı."
 AAT_Sweden.13.t:0 "[SWE.GetNameDefCap] Kuzey Norveç'in kontrolünü talep ediyor"
 AAT_Sweden.13.tt:0 "§R[SWE.GetName] savaşı tırmandırabilir§!"
 AAT_Sweden.14.a:0 "Yardım göndererek başlayalım"
 AAT_Sweden.14.a_tt:0 "§Y[NOR.GetNameDefCap] savaşın sonunda topraklarını geri isteyecektir§!"
 AAT_Sweden.14.desc:0 "[FROM.GetNameDefCap], Narvik çevresinde askerden arındırılmış bir bölge teklifimizi kabul etti. Birlikleri bölgeyi terk etti ve şimdi burayı çatışmasız bölge ilan edeceğiz. [NOR.GetAdjective] hükümetinin savaşın sonunda toprakları geri isteyeceğini bekliyoruz, ama şimdilik [NOR.GetAdjective] halkını güvende tutacağız."
 AAT_Sweden.14.t:0 "[FROM.GetNameDefCap] boyun eğiyor"
 AAT_Sweden.15.a:0 "Bunun için ülkemizi riske atamayız"
 AAT_Sweden.15.a_tt:0 "§YBu, reddederlerse [FROM.GetNameDef] ülkesine karşı bir savaş hedefi verecektir§!"
 AAT_Sweden.15.b:0 "[NOR.GetName] ülkesini yalnız bırakamayız"
 AAT_Sweden.15.desc:0 "[FROM.GetNameDefCap], Narvik çevresinde askerden arındırılmış bir bölge teklifimizi reddetti. Nordik kardeşlerimizin yararına böyle bir bölgede ısrar ederek veya onları karanlıkta bırakarak nasıl yanıt vereceğimize karar vermeliyiz."
 AAT_Sweden.15.t:0 "[FROM.GetNameDefCap] teklifimizi reddediyor"
 AAT_Sweden.16.a:0 "Daha fazla düşman riske atamayız"
 AAT_Sweden.16.b:0 "Gelsinler bakalım"
 AAT_Sweden.16.desc:0 "Narvik çevresindeki bölgeleri teslim etmeyi reddettikten sonra [SWE.GetAdjective] hükümeti, kuzey [NOR.GetAdjective] topraklarını teslim etmeyi reddedersek ülkelerimiz arasında düşmanlıkların patlak vereceğini belirsiz olmayan bir şekilde tehdit etti"
 AAT_Sweden.16.t:0 "[SWE.GetNameDef] Narvik yüzünden düşmanlık tehdidinde bulunuyor"
 AAT_Sweden.17.a:0 "Nu har du skitit i det blå skåpet [FROM.GetName]"
 AAT_Sweden.17.desc:0 "Narvik üzerinde düşmanlık tehdidinde bulunmamıza rağmen [FROM.GetName] taleplerimizden vazgeçmeyi reddetti. [NOR.GetAdjective] halkının insanlık dışı koşullarda sığır gibi muamele görmesine izin veremeyiz ve vermeyeceğiz. İşgalci güçleri kesmek ve [NOR.GetAdjective] halkını özgürleştirmek için [NOR.GetAdjective] limanlarını güvence altına almalıyız."
 AAT_Sweden.17.t:0 "[FROM.GetNameDefCap] inatla Narvik'i teslim etmeyi reddediyor"
 AAT_Sweden.18.a:0 "Elbette, Narvik [NOR.GetName] ülkesine aittir"
 AAT_Sweden.18.b:0 "Çabalarımızın karşılığı olarak Narvik'i talep edeceğiz"
 AAT_Sweden.18.desc:0 "Yeniden kurulan [NOR.GetAdjective] hükümeti, savaş sırasında onları ve vatandaşlarını koruduktan sonra Narvik ve komşu topraklarının devredilmesini talep ediyor. Bildirilerinde, savaş sırasında hükümetimiz tarafından yapılan eylemler için derin şükranlarını belirttiklerini ve bizimle daha fazla işbirliği yapmayı dört gözle beklediklerini ifade ediyorlar. Savaşın karanlık gecesinde bu [NOR.GetAdjective] bağımsızlık kırıntısını koruyan adamları onurlandırmak için bir kutlama töreni düzenlenecek."
 AAT_Sweden.18.t:0 "[NOR.GetName] Narvik'i geri istiyor"
 AAT_Sweden.19.a:0 "Norveç bir kez daha bütün"
 AAT_Sweden.19.desc:0 "Sonunda [NOR.GetName] ülkesinin bir kez daha birleştiği parlak bir gün. [SWE.GetName], savaş sırasında [SWE.GetAdjective] hükümeti tarafından korunan bir alan olan Narvik'in bize iade edilmesi talebimizi lütfederek kabul etti. [SWE.GetAdjective] hükümetine en derin teşekkürlerimizi sunduk, gerçekten de bu, ülkelerimiz arasında bir çağ sürecek daha derin bir bağın habercisidir"
 AAT_Sweden.19.t:0 "[SWE.GetNameDefCap] Narvik'i iade ediyor"
 AAT_Sweden.19_tt:0 "§Y[ROOT.GetNameDefCap]§! artık §YSaha Subayları§!'na §YNorveç Savunma Onur Haçı§! verebilecek."
 AAT_Sweden.2.a:0 "Bu nasıl bitecek?"
 AAT_Sweden.2.desc:0 "Per-Albin'in bütçe konusunda geri adım atmayı reddederken aynı zamanda başka bir aday lehine istifa etmeyi de reddetmesi üzerine, Çiftçi partisi ve ılımlılardan oluşan bir koalisyon, Başbakan'a bir güvensizlik oyu sunmaya karar verdi.\n\nBu iki partinin bir araya gelmesiyle Per-Albin'in istifa etmekten başka çaresi kalmadı ve Başbakanlık koltuğu boş kaldı. Bu, hiçbir partinin iktidara gelmek için siyasi nüfuza sahip olmadığı bir hükümet krizine neden oldu.\n\nKral'ın kendisi de ortaya çıkan kaosa karşı konuştu, bu da resmi siyasi gücü olmayan hükümdar için olağanüstü bir adımdı."
 AAT_Sweden.2.t:0 "Bir güvensizlik oyu"
 AAT_Sweden.20.a:0 "O zaman savaş olsun"
 AAT_Sweden.20.desc:0 "Savaş sırasında [SWE.GetNameDef], \"Norveç halkını daha da kötü bir işgalden kurtarma\" bahanesiyle ülkemizin bazı kısımlarını küstahça işgal etti. Bu, [SWE.GetAdjective] hükümetinin kendi toprak emellerini genişletmek için sadece bir hile olduğu ortaya çıktı, çünkü işgal altındaki toprakları \"savaş sonrası dünya çapında devam eden istikrarsızlık sorunları ve huzursuzluk\" gerekçesiyle geri vermeyi reddettiler. Bunun arkasını görüyoruz, açıkçası bu en temel unsurunda fırsatçılıktır, devletimizin özgürlüğünü ve bütünlüğünü tehdit eden bariz bir aldatmacadır. Narvik Norveç'indir ve gerekirse zorla öyle kalacaktır."
 AAT_Sweden.20.t:0 "[SWE.GetNameDefCap] Narvik'i iade etmeyi reddediyor"
 AAT_Sweden.21.a:0 "Bu teklif çıkarlarımıza uygun değil."
 AAT_Sweden.21.b:0 "Mükemmel bir teklif."
 AAT_Sweden.21.desc:0 "Muzaffer güçler arasındaki savaş sonrası gerilimlere ilişkin endişeleri dile getiren [FROM.GetName], başarısız olmuş izole tarafsızlık politikalarına geri dönmememiz gerektiğini, aslında gelecekte saldırganlığı daha iyi caydırabilmek için askeri ve dış politikamızı bölge genelinde koordine etmemiz gerektiğini savunuyor."
 AAT_Sweden.21.t:0 "[FROM.GetName] bizi $scandinavian_defense_union$ ittifakına davet ediyor"
 AAT_Sweden.22.a:0 "Çok hayal kırıklığı."
 AAT_Sweden.22.desc:0 "[FROM.GetAdjective] diplomatları bugün bize hükümetlerinin $scandinavian_defense_union$ birliğine katılmaya devam etmek istemediğini bildirdi. Çıkarlarının, en azından şimdilik, böyle bir örgütün dışında daha iyi hizmet göreceğini savunuyorlar."
 AAT_Sweden.22.t:0 "[FROM.GetName] Savunma Birliği Teklifini Reddetti"
 AAT_Sweden.23.a:0 "Güvenliğimiz için bir yük olurlardı."
 AAT_Sweden.23.b:0 "Bize katılırlarsa çok memnun oluruz."
 AAT_Sweden.23.desc:0 "[FROM.GetName], muzaffer güçler arasındaki potansiyel savaş sonrası gerilimlere ilişkin endişeler nedeniyle ittifakımıza katılmayı talep etti. [FROM.GetName] ülkesinin ittifakımızda olması, bölgelerindeki nüfuzumuzu genişletir, ancak elbette daha fazla çatışma çıkması durumunda onları savunmayı taahhüt etmemizi gerektirir."
 AAT_Sweden.23.t:0 "[FROM.GetName] İttifaka Katılmayı Talep Ediyor"
 AAT_Sweden.24.a:0 "Çok hayal kırıklığı. "
 AAT_Sweden.24.desc:0 "[FROM.GetName] şimdilik ittifaklarına üyeliğimizi kabul etmeyi reddetti. Bu noktada ittifakı genişleterek daha fazla çatışmaya karışma endişelerini dile getirdiler. Şimdilik, kendi başımızın çaresine bakacağız gibi görünüyor."
 AAT_Sweden.24.t:0 "[FROM.GetName] İttifak Üyeliğini Reddetti"
 AAT_Sweden.25.a:0 "Arazimiz göz önüne alındığında Korucular en etkili olacaktır."
 AAT_Sweden.25.b:0 "Deniz Piyadeleri Baltık'ı domine etmemize yardımcı olabilir."
 AAT_Sweden.25.c:0 "Paraşütçüler en çok yönlü kuvvetler olacaktır."
 AAT_Sweden.25.desc:0 "Ordunun üst düzey personelinin yeni özel kuvvetler için fonların nasıl tahsis edileceği konusundaki uzun tartışmalarından sonra, süreç durma noktasına geldi. Görünüşe göre çıkmazı kırmanın tek yolu, hükümetin devreye girip tekliflerden birinin arkasına ağırlığını koymasıdır."
 AAT_Sweden.25.t:0 "Özel Kuvvetlere Yatırım"
 AAT_Sweden.26.a:0 "Barış istemek zorundayız"
 AAT_Sweden.26.b:0 "Böyle bir utancı göze alamayız"
 AAT_Sweden.26.desc:0 "Düşünülemez olan oldu. Silahlı kuvvetlerimiz [195.GetnameDef] kontrolünü kaybetti, Rus halkının önemli bir anıtı şimdi düşmanın elinde. Bu sadece stratejik bir kayıp değil, aynı zamanda ulusal gururumuz ve ordumuz için büyük bir moral kaybıdır.  Zaten sıradan asker arasında önemli bir moral düşüşü var ve firar fısıltıları bol; bu savaşa devam edersek, artık hayatlarının boşuna bir savaşta boşa harcanmaya değmeyeceğine inanmayan askerlerle yapacağız."
 AAT_Sweden.26.t:0 "[?195.GetName] kaybedildi."
 AAT_Sweden.27.a:0 "Bu kesinlikle ordunun moralini yükseltecektir"
 AAT_Sweden.27.desc:0 "Koalisyonumuz [?146.GetName] şehrini ele geçirdikten sonra Kızıl Ordu'ya verilen hasar o kadar yıkıcı oldu ki Moskova saldırganlığını yeniden gözden geçirmek zorunda kaldı. Beyaz bir barışı kabul ettiler ve iddialarını daha fazla ileri sürmeyeceklerine söz verdiler. Hem Stockholm hem de Helsinki'de halk coşkulu, Kızıl Ayı'nın kağıttan yapıldığını kim düşünebilirdi ki?"
 AAT_Sweden.27.t:0 "[SOV.GetNameDefCap], [?146.GetName] üzerindeki iddiasından vazgeçiyor"
 AAT_Sweden.28.a:0 "Kesinlikle hayır"
 AAT_Sweden.28.b:0 "Bir müttefik için ödenecek bedel"
 AAT_Sweden.28.desc:0 "[SWE.GetLeader]'ın söylemi giderek daha emperyalist bir hal alırken, [SWE.GetLeader.GetSheHe]'nin şimdi kayıp imparatorluk topraklarının iadesini talep etmesi belki de şaşırtıcı olmamalı. Herhangi bir hak iddiası görünümünün vadesi açıkça dolmuştur ve en iyi ihtimalle sahtedir, ancak çatışma sırasında müttefik kaybetmeyi göze alamayız. Belki bir iyi niyet gösterisi liderlerini mutlu eder?"
 AAT_Sweden.28.t:0 "[SWE.GetNameDefCap] kaybedilen toprakların iadesini talep ediyor"
 AAT_Sweden.29.a:0 "Onlara göstereceğiz"
 AAT_Sweden.29.desc:0 "[FROM.GetNameDefCap], eski kolonilerimizi devretme talebimizi reddederek, iddiamızın modern jeopolitikle o kadar ilgisiz olduğunu ve düz bir ret dışında herhangi bir şeyin bu saçmalığı çok uzun süre eğlendireceğini belirtti."
 AAT_Sweden.29.t:0 "[FROM.GetNameDefCap] toprak devretmeyi reddediyor"
 AAT_Sweden.3.a:0 "Per Albin-Hansson halkın yetkisine sahiptir."
 AAT_Sweden.3.axel_is_leader:0 "Axel şimdiye kadar iyi iş çıkardı, devam etsin."
 AAT_Sweden.3.axel_is_not_leader:0 "Çiftçi partisinin bir şansı olmalı."
 AAT_Sweden.3.b:0 "[AAT_Sweden_3_b_loc]"
 AAT_Sweden.3.bagge_is_leader:0 "Açıkçası Bagge bizi geleceğe taşıyacak."
 AAT_Sweden.3.bagge_is_not_leader:0 "Ilımlılar, Bu zorlu zamanlarda yeni bir liderliğe ihtiyacımız var"
 AAT_Sweden.3.c:0 "[AAT_Sweden_3_c_loc]"
 AAT_Sweden.3.d:0 "P-A bu kaosa neden oldu, Wigforss bunun yerine Sosyal demokratları yönetmeli"
 AAT_Sweden.3.desc:0 "Bugün, [ROOT.GetNameDef] genelinde insanlar ulusal seçimde oylarını kullanmak için toplanıyor. Sosyal Demokratların Riksdag'da birkaç sandalye kazanacağı tahmin edildiğinden bir geri dönüş yapması bekleniyor.\nAncak, hem Bondeförbundet hem de Högern partisi, beklenmedik bir değişimin kendilerinden birini iktidara getirebileceğini umuyor. Ancak huzursuz bir dünya durumunda daha marjinal partilerin küçük kazanımlar elde etmesi beklenirken, her şey mümkün."
 AAT_Sweden.3.t:0 "1936 İsveç Genel Seçimi"
 AAT_Sweden.30.a:0 "Yanlışlar düzeltildi"
 AAT_Sweden.30.desc:0 "[FROM.GetNameDefCap] talebimizi kabul etti ve şimdi eski kolonilerimizi devrediyor, bu da daha fazla geri itme bekleyen hükümetimizi şaşırttı. Bu, yeni topraklarımızda protestolara neden oldu, ancak zamanla kesinlikle sakinleşecektir."
 AAT_Sweden.30.t:0 "[FROM.GetNameDefCap] kolonileri devrediyor"
 AAT_Sweden.31.a:0 "[FROM.GetName] ile bir kavgayı göze alamayız"
 AAT_Sweden.31.a_tt:0 "§RBu, nihayetinde [FROM.GetName] ülkesinin bizi kukla yapabilmesine yol açabilir§!"
 AAT_Sweden.31.b:0 "Bu sadece saçmalık"
 AAT_Sweden.31.desc:0 "[FROM.GetAdjective] büyükelçisi acı bir mesaj getirdi. Bornholm'u onlara geri vermemizi talep ediyorlar ve adanın bir isyanla kaybedildiği için hiçbir zaman yasal olarak [DEN.GetName]'e devredilmediğini iddia ediyorlar. Bu 17. yüzyılda olduğu için, bu açıkça [FROM.GetAdjective] yayılmacılığı için üstü kapalı bir bahanedir"
 AAT_Sweden.31.t:0 "[FROM.GetNameDefCap] Bornholm'u talep ediyor"
 AAT_Sweden.32.a:0 "Benzeri görülmemiş olmasına lanet olsun"
 AAT_Sweden.32.desc:0 "[FROM.GetNameDefCap], Bornholm üzerindeki iddiamıza itiraz etmeyeceğini bize bildirdi, ancak bunun Nordiklerin istikrarını tehdit eden benzeri görülmemiş bir hamle olduğunu bize bildiriyor"
 AAT_Sweden.32.t:0 "[FROM.GetName] Bornholm'dan vazgeçiyor"
 AAT_Sweden.33.a:0 "Bizim olacak"
 AAT_Sweden.33.desc:0 "[FROM.GetAdjective] hükümeti, Bornholm üzerindeki iddiamızı dikkate almayacağını ve sahip olduğumuzu iddia ettiğimiz her türlü iddianın geçerliliğini yüzyıllar önce yitirdiğini belirterek bize bildirdi. Eğer onu teslim etmezlerse, tıpkı yüzyıllar önce yaptığımız gibi zorla almak zorunda kalacağız."
 AAT_Sweden.33.t:0 "[FROM.GetName] Bornholm'dan vazgeçmeyi reddediyor"
 AAT_Sweden.34.a:0 "Başka seçeneğimiz yok"
 AAT_Sweden.34.a_tt:0 "§RBu, [FROM.GetName] ülkesinin bizi kukla yapabilmesine yol açacaktır§!"
 AAT_Sweden.34.b:0 "Bunu göze alamayız"
 AAT_Sweden.34.desc:0 "[FROM.GetAdjective] büyükelçisi, uluslararası düzenin yeniden tanımlandığı bu dönemde [SWE.GetAdjective] hükümetinin, [THIS.GetAdjective] hükümetinin artık denizaşırı topraklarını gerektiği gibi koruyamadığı görüşünde olduğunu bize bildirdi. Eğer [THIS.GetName] topraklarını layıkıyla savunamıyorsa, hükümetinin bu toprakları savunabilecek birine devretmesi kendi yararına olacaktır; ve bu konuda tercih edilen seçenek [FROM.GetAdjective] olacaktır."
 AAT_Sweden.34.t:0 "[FROM.GetName] özerk topraklar talep ediyor"
 AAT_Sweden.35.a:0 "Harika"
 AAT_Sweden.35.desc:0 "[FROM.GetName] gönülsüzce özerk topraklarını devretmeye karar verdi. Bu kesinlikle [FROM.GetName] ile ilişkilerimize zarar veriyor, ama uzun vadede önemli olmayacak çünkü çok yakında bizim etki alanımıza girecekler"
 AAT_Sweden.35.t:0 "[FROM.GetName], [DEN.GetAdjective] denizaşırı topraklarını devrediyor"
 AAT_Sweden.36.a:0 "O zaman zorla alacağız"
 AAT_Sweden.36.desc:0 "[FROM.GetName], yeni bir dünya düzeni vizyonumuzu kabul etmeyeceğini bize bildirdi. İddiayı bastırmamıza rağmen [FROM.GetAdjective] hükümeti haklı topraklarımızı geri vermeyi inatla reddediyor."
 AAT_Sweden.36.t:0 "[FROM.GetName], [DEN.GetAdjective] denizaşırı topraklarını devretmeyi reddediyor"
 AAT_Sweden.37.a:0 "Onları bir tampon bölge olarak kullanacağız"
 AAT_Sweden.37.b:0 "$AAT_Sweden.37.a$"
 AAT_Sweden.37.desc:0 "[DEN.GetAdjective] hükümeti, artık bizim onlar üzerindeki hakimiyetimizi kurma yönündeki toplu bir çabamıza karşı koyamayacak kadar zayıfladı. Bir zamanlar biz Danimarkalılara nasıl bağlı bir devlet idiysek, şimdi de onlar bizim bağlı devletimiz olacak. Ültimatomumuzu vermeden önce onlarla ne yapacağımıza karar vermemiz yeterli."
 AAT_Sweden.37.t:0 "[DEN.GetName]'in Kaderi"
 AAT_Sweden.38.a:0 "Forpulet"
 AAT_Sweden.38.desc:0 "Benzeri görülmemiş bir hamleyle [FROM.GetName], hükümetimizin tüm işlevlerini ve kurumlarını kendilerine devretmesini talep etti. Devlet başkanımız büyükelçilerine şiddetle protesto etti, ancak tam o sırada [SWE.GetAdjective] savaş gemileri Kopenhag'dan çok da uzak olmayan bir yerde görüldü. [DEN.GetAdjective] hükümeti böyle bir tehdide yanıt veremeyecek kadar güçsüz ve 6 saat sonra resmi bir teslimiyet imzalandı."
 AAT_Sweden.38.t:0 "[FROM.GetName], [DEN.GetName] ülkesini kukla yapmak için harekete geçti"
 AAT_Sweden.39.a:0 "Bir daha asla buzu geçemeyecekler!"
 AAT_Sweden.39.b:0 "$AAT_Sweden.38.a$"
 AAT_Sweden.39.desc:0 "Benzeri görülmemiş bir hamleyle [FROM.GetName], hükümetimizin tüm işlevlerini ve kurumlarını kendilerine devretmesini talep etti. Bize yardım etmeye çalışmak yerine, [FROM.GetAdjective] hükümetinin, kontrolünü üzerimizde hissettiği kadar rahat hissedene kadar bütünlüğümüzü aşındırdığı şimdi açık."
 AAT_Sweden.39.t:0 "$AAT_Sweden.38.t$"
 AAT_Sweden.4.a:0 "Umarım yakında bir Başbakan buluruz"
 AAT_Sweden.4.desc:0 "Riksdag'daki bir tartışma, Başbakanlık koltuğuna kimin oturacağı konusundaki bir argümanın kişisel saldırılara dönüşmesiyle bugün alevlendi. Karl Sjöblom, bir tartışma sırasında Glenn Werner'ı hedef alarak, \"iyi olduğun tek şey köpeğini gezdirmek\" dedi.\n\nGlenn'in bir sözcüsü, onun hiç köpeği olmadığını açıkladı."
 AAT_Sweden.4.t:0 "Politikacı rakibini \"utanç verici derecede yeteneksiz\" olarak nitelendirdi "
 AAT_Sweden.40.a:0 "[FROM.GetName] ile savaşamayız"
 AAT_Sweden.40.b:0 "Onları asla devretmeyeceğiz"
 AAT_Sweden.40.desc:0 "1919'da yaptıkları gibi, [FROM.GetAdjective] hükümeti yine Åland adası üzerinde baltayı sallıyor. Milletler Cemiyeti'nin adaların egemenliğini bize devreden kararına rağmen, [FROM.GetName] rahat duramıyor gibi görünüyor. Belki de bizi zayıf bir konumda gördüklerine ve Cemiyet'in çöküşüyle birlikte suda kan kokusu aldıklarına inanıyorlar; hepsi de kasıtlı fırsatçılar."
 AAT_Sweden.40.t:0 "[FROM.GetName], [145.GetName] adasını talep ediyor"
 AAT_Sweden.41.a:0 "Harika"
 AAT_Sweden.41.desc:0 "[FROM.GetName] pes etti ve Åland adalarını bize devretti. Sonunda geçmişin adaletsizlikleri ortadan kaldırıldı ve uygun statüsü geri verildi."
 AAT_Sweden.41.t:0 "[FROM.GetName] pes ediyor!"
 AAT_Sweden.42.a:0 "Bizim olacak"
 AAT_Sweden.42.desc:0 "[FROM.GetName], [145.GetName] adasını devretmeyi şiddetle reddettiğini, konunun zaten Milletler Cemiyeti tarafından karara bağlandığını belirterek bize bildirdi. Açıkçası [FROM.GetName], sahip oldukları etkiyi abartıyor. [FROM.GetName]'e yollarının yanlış olduğunu göstermeliyiz."
 AAT_Sweden.42.t:0 "[FROM.GetName], [145.GetName] adasını devretmeyi reddediyor"
 AAT_Sweden.43.a:0 "Küçük bir jest gerilimi azaltabilir"
 AAT_Sweden.43.b:0 "Bu egemenliğimizi ihlal ediyor"
 AAT_Sweden.43.desc:0 "[FROM.GetName], kuzey sınırımızı askerden arındırmamızı talep etti. Madencilik operasyonlarına yönelik tehditlerden endişe duyuyorlar, aynı zamanda akla gelebilecek herhangi bir tehdidin Batı'dan değil Doğu'dan geleceğini vurguluyorlar. Bu, Åland krizinden bu yana yükselen [FROM.GetName] ile aramızdaki gerilimi düşürür."
 AAT_Sweden.43.t:0 "[FROM.GetName], [148.GetName] adasının askerden arındırılmasını talep ediyor"
 AAT_Sweden.44.a:0 "Planlandığı gibi"
 AAT_Sweden.44.desc:0 "İyi niyet göstergesi olarak [FROM.GetName], [148.GetName]'i askerden arındırmayı kabul etti. Doğu krallığını restore etmemizde bizim için büyük bir adım taşı, yavaş yavaş [FROM.GetName] üzerindeki nüfuzumuz artıyor."
 AAT_Sweden.44.t:0 "[FROM.GetName], [148.GetName] adasını askerden arındırmayı kabul ediyor"
 AAT_Sweden.45.a:0 "İşbirlikçiler mi?"
 AAT_Sweden.45.desc:0 "[FROM.GetName], [148.GetName]'i askerden arındırmayı reddederek, [FROM.GetName]'in kendi sınırları içinde ne yapacağına karar verme yetkimizin olmadığını belirtti. Bu kesinlikle bize karşı aktif olarak komplo kurdukları anlamına mı geliyor? İlk saldıranın biz olmamız zorunludur."
 AAT_Sweden.45.t:0 "[FROM.GetName], [148.GetName] adasını askerden arındırmayı reddediyor"
 AAT_Sweden.46.a:0 "Onları kukla yap"
 AAT_Sweden.46.b:0 "$AAT_Sweden.46.a$"
 AAT_Sweden.46.desc:0 "Herkesin bildiği gibi [FIN.GetName], [SOV.GetAdjective] tehdidine karşı duramaz. Finler egemenliklerinden bahsediyorlar, bağımsızlık olarak algıladıkları şeyin herhangi bir siyasi veya askeri güç tarafından verilmediğini, Rus iç savaşından kaynaklanan kaosun bir sonucu olarak var olduğunu fark edemiyorlar. O günden beri bir saat işliyor ve yakında sıfıra vuracak ve eski düşman yine çirkin yüzünü gösterecek. Bu nedenle, [SOV.GetAdjective]ler yapmadan önce [FIN.GetAdjective] meselelerinin kontrolünü ele geçirmemiz zorunludur."
 AAT_Sweden.46.t:0 "[FIN.GetName] sorunu"
 AAT_Sweden.47.a:0 "Umalım ki yeni hakim devletlerimiz merhametli olsun."
 AAT_Sweden.47.desc:0 "Komşularımızın güvenlikleri konusundaki \"endişelerinin\" tamamen bir hile olduğu açık. İrademizden yoksun ve stratejik avantajımızı kaybederek, ordumuz yeni coğrafi gerçekliklere göre organize edilmedi. Gafil avlanan [FROM.GetAdjective] savaş gemileri başkentimizin dışında görüldü, [FROM.GetAdjective] birlikleri kuzeydeki askerden arındırılmış bölgeyi geçti ve bize bir teslimiyet ültimatomu gönderildi. Uluslararası toplum bizi terk etti."
 AAT_Sweden.47.t:0 "[FROM.GetName] bizi kukla yapmak için harekete geçti"
 AAT_Sweden.48.a:0 "Kaderimiz bir daha asla başkası tarafından belirlenmeyecek"
 AAT_Sweden.48.b:0 "$AAT_Sweden.47.a$"
 AAT_Sweden.48.desc:0 "Komşularımızın güvenlikleri konusundaki \"endişelerinin\" tamamen bir hile olduğu açık. [FROM.GetName] hükümeti şimdi Doğudan gelen ortak düşmana karşı onlarla hizalanmamızı talep ediyor. Taleplerine boyun eğmek, bizi bir kez daha sağlam bir şekilde [FROM.GetAdjective] etki alanına sokacak ve bağımsızlığımızı baltalayacaktır. Soru şu ki, alternatif daha mı kötü?"
 AAT_Sweden.48.t:0 "$AAT_Sweden.47.t$"
 AAT_Sweden.49.a:0 "Diplomasi başarısız olduğunda..."
 AAT_Sweden.49.desc:0 "[FROM.GetName] taleplerimizi reddederek onları kesin bir dille geri çevirdi. Bu, madencilik operasyonlarımızı tehdit ederken aynı zamanda endişelerimize bariz bir saygısızlıktır. Tek bir yanıt olabilir."
 AAT_Sweden.49.t:0 "[FROM.GetName] eğilmeyi reddediyor"
 AAT_Sweden.5.a:0 "Bu sadece saçmalık"
 AAT_Sweden.5.desc:0 "Lennart Jansson bugün Riksdag yakınlarında bir çalının içinde saklanırken bulundu. Fark edildiğinde, aslında bir çalının içinde saklanmadığını, daha ziyade özellikle güzel bir uğur böceğine hayran olduğunu iddia etti. Sonra hemen Riksdag'a girdi.\nAslında çalıda saklandığı, saniyeler önce girdiği görülen siyasi bir rakibinden, daha fazla Başbakanlık müzakeresi için kaçınmak istediği tahmin ediliyor."
 AAT_Sweden.5.t:0 "Politikacı bir çalının içinde saklanırken bulundu"
 AAT_Sweden.50.a:0 "Savaşmaya değmez"
 AAT_Sweden.50.a_tt:0 "§RBu, [SWE.GetName] ülkesinin bizi kukla yapabilmesine yol açacaktır§!"
 AAT_Sweden.50.b:0 "Bu saçmalık"
 AAT_Sweden.50.desc:0 "[SWE.GetName], Narvik limanının tam kontrolünü talep etti. Hükümetleri bu söylemi, bir düşmanın Narvik'e çıkarma yapıp İsveç demir cevheri madenlerine saldırması endişesi nedeniyle meşrulaştırıyor. Anlaşmazlık, çatışmanın daha da tırmanmasına yol açabilir."
 AAT_Sweden.50.t:0 "[SWE.GetName], [144.GetName] limanını talep ediyor"
 AAT_Sweden.51.a:0 "Mükemmel"
 AAT_Sweden.51.desc:0 "[FROM.GetName] pes etti ve Narvik'i bize devretti. Bu, Gällivare ve Kiruna'dan gelen demir cevherini güvence altına alırken, aynı zamanda [FROM.GetName]'i zayıflatıyor"
 AAT_Sweden.51.t:0 "[FROM.GetName] pes ediyor"
 AAT_Sweden.52.a:0 "$AAT_Sweden.49.a$"
 AAT_Sweden.52.desc:0 "$AAT_Sweden.49.desc$"
 AAT_Sweden.52.t:0 "$AAT_Sweden.49.t$"
 AAT_Sweden.53.a:0 "Asla! Silah başına"
 AAT_Sweden.53.b:0 "Direnecek gücümüz yok"
 AAT_Sweden.53.desc:0 "[SWE.GetAdjective] hükümeti, kışkırtma olmaksızın ordumuzu geri çekmemizi ve yeni bir Nordik devletiyle hizalanmamızı talep etti. Bunun bir işbirliği programı olduğunu belirtirken, kimin tabi olacağı ve kimin efendi olacağı açık. Bu, etkili bir şekilde eski Birlik günlerine bir dönüştür."
 AAT_Sweden.53.t:0 "[NOR.GetName] Sorunu"
 AAT_Sweden.6.a:0 "Artık höpürdetmek yok!"
 AAT_Sweden.6.desc:0 "Konuşmacı, Agda Sörlp'ün başka bir politikacının yeni bir Başbakan seçmek için yaptığı konuşma sırasında çorbayı \"çok yüksek sesle\" höpürdetmesinin ardından Riksdag'da yemekle ilgili yeni kurallar çağrısında bulundu. Bunu \"kasıtlı bir dikkat dağıtma\" olarak nitelendirdi, ancak Bayan Sörlp, son zamanlardaki uzun müzakereler nedeniyle normal saatlerde öğle yemeği için yeterli zaman olmadığını söyledi."
 AAT_Sweden.6.t:0 "Höpürdetme skandalı"
 AAT_Sweden.7.a:0 "Aman tanrım"
 AAT_Sweden.7.desc:0 "Bugün Riksdag dışında, görünüşe göre zorla içeri girmeye çalışan 12 kişi tutuklandı. Polis tarafından yakalandıklarında, sadece bir kararın daha hızlı alınmasını zorlamak istediklerini, güvendikleri sosyal hizmetlerin siyasi kargaşada buharlaştığını belirttiler.\n12 kişiden biri olan Rikard Persson'un yasadışı tütün kaçakçılığından polis tarafından aranması nedeniyle lobide durduruldular. Persson halka açık tuvaleti kullanmak zorunda kaldı, tuvaletteki bir memur tarafından tanındı ve sonra yakalandı.\nPersson'un 2 yıl hapis cezası alması, geri kalan 11 kişinin ise 6 aya kadar hapis ve kabahat para cezası alması bekleniyor."
 AAT_Sweden.7.t:0 "Riksdag dışında 12 kişi tutuklandı"
 AAT_Sweden.8.a:0 "Umarım bu serseriler yeni bir sayfa açarlar"
 AAT_Sweden.8.desc:0 "Bugün Riksdag'a baskın yapmaya çalıştıkları için tutuklanan 11 kişi denetimli serbestlikle serbest bırakıldı, 1 kişi ise kaçakçılık suçlamasıyla hala hapiste."
 AAT_Sweden.8.t:0 "Riksdag'da tutuklanan 11 kişi serbest bırakıldı"
 AAT_Sweden.9.a:0 "Gerçekten ilham verici"
 AAT_Sweden.9.desc:0 "Rikard Persson, 11 kişiyle birlikte Riksdag'a baskın yapmaya çalışırken tutuklandı. Tütün kaçakçılığından arandığı için 2 yıl hapis yattı. Şimdi nerede olduğunu takip ettik ve cezasından sonra hayatını değiştirmeye karar verdiğini ve derhal Donanma'ya katıldığını bildirmekten mutluluk duyuyoruz.\nYüksek komutadaki üstleri, seçkin ve azimli genç bir kişi buldular ve o zamandan beri sıkı çalışması ve doğal yeteneği nedeniyle terfi ettirildi."
 AAT_Sweden.9.t:0 "Tütün Kaçakçısı Hayatını Değiştiriyor"
 AAT_Sweden_BoP.10.a:0 "Ekonomi, işçi sınıfı tarafından ve işçi sınıfı için işletilmelidir."
 AAT_Sweden_BoP.10.b:0 "Kapitalizm ve komünizmin aşırılıkları arasında bir orta yol bulmalıyız."
 AAT_Sweden_BoP.10.c:0 "Toplumdaki en başarılıları bu kadar aşırı vergilendirmeyle neden boğuyoruz?"
 AAT_Sweden_BoP.10.d:0 "Ordunun genişlemesi işsizliği düşürecek ve ulusal güvenliği artıracaktır."
 AAT_Sweden_BoP.10.desc:0 "Seçim sezonu bir kez daha kapımızda ve Riksdag'ın kontrolü için yarışan partiler tüm güçleriyle kampanya yürütüyor. Seçmenlerin dikkatini çekmiş gibi görünen ana konu ekonomi. Bazıları mevcut politikaların devamını savunurken, diğerleri radikal değişiklik istiyor, ancak sadece bir seçenek konuda ilgi çekiyor gibi görünüyor."
 AAT_Sweden_BoP.10.t:0 "Seçim Kampanyası - Ekonomi Politikası"
 AAT_Sweden_BoP.11.a:0 "Burjuvazi iktidardan uzaklaştırılmadıkça sosyal eşitlik olamaz."
 AAT_Sweden_BoP.11.b:0 "Eğitim ve tıbbi bakıma daha iyi erişim, insanları yoksulluktan kurtarmaya yardımcı olacaktır."
 AAT_Sweden_BoP.11.c:0 "Büyük şehirlerin dışındakileri desteklemek için daha fazlasını yapmalıyız."
 AAT_Sweden_BoP.11.d:0 "[ROOT.GetAdjective] olmanın ne demek olduğunu unuttuk ve daha fazla vatansever eğitime ihtiyacımız var."
 AAT_Sweden_BoP.11.desc:0 "Seçim kampanyası sosyal politikaya geçmiş gibi görünüyor, partiler şimdi toplumun dertlerini nasıl çözeceklerini ilan ediyorlar. Bazı partiler sorunları çözmek için hükümetin radikal bir şekilde yeniden şekillendirilmesini savunurken, diğerleri parça parça değişiklikle daha dikkatli bir yaklaşım benimsiyor. Ancak, seçmenle sadece bir mesaj rezonans kuruyor gibi görünüyor."
 AAT_Sweden_BoP.11.t:0 "Seçim Kampanyası - Sosyal Politika"
 AAT_Sweden_BoP.12.a:0 "Dünya işçileri, emperyalist saldırı savaşlarına karşı birleşmelidir."
 AAT_Sweden_BoP.12.b:0 "Güçlü bir askeri caydırıcılık geliştirirken tarafsızlığımızı korumalıyız."
 AAT_Sweden_BoP.12.c:0 "Zayıf ve savunmasızız, savaşa daha iyi hazırlanmalıyız."
 AAT_Sweden_BoP.12.d:0 "Bölgede barışı sağlamanın tek yolu, üzerindeki kontrolümüzü sağlamlaştırmaktır."
 AAT_Sweden_BoP.12.desc:0 "Seçim günü yaklaştıkça, tartışmalar ulusal güvenlik ve dış politikanın acil meselesine kaydı. Birçok parti ulusu güvende tutmak için tarafsızlık ve izolasyonizmi savunurken, diğerleri daha iddialı bir dış politika yönü için bastırıyor. Dünya bu kadar tehlikeli bir durumdayken, seçmene sadece bir mesaj umut veriyor gibi görünüyor."
 AAT_Sweden_BoP.12.t:0 "Seçim Kampanyası - Dış Politika"
 AAT_Sweden_BoP.14.a:0 "Seçmen konuştu. "
 AAT_Sweden_BoP.14.d_democratic:0 "Seçim günü geldi ve seçmenler tercihlerini yaptı. $SWE_democratic_party_long$ önümüzdeki günlerde çoğunluk hükümeti kuracak. Bazıları Folkhemmet vaatlerinin seçmen nezdinde bayatladığına inanırken, bu sonuç onların yanıldığını kanıtlıyor. Geriye kalan tek şey başladıkları işi bitirmeleri."
 AAT_Sweden_BoP.14.d_fascist:0 "Seçim günü geldi ve seçmenler tercihlerini yaptı. $SWE_fascism_party_long$ önümüzdeki günlerde çoğunluk hükümeti kuracak ve sonuçtan kendileri kadar şaşıran kimse yok gibi görünüyor. [ROOT.GetName] ülkesinin demokratik aygıtının yeni rejim altında ne kadar süreceği belirsiz. "
 AAT_Sweden_BoP.14.d_left:0 "Seçim günü geldi ve partilerin tüm çabalarına rağmen hiçbiri Riksdag'da çoğunluk sandalyesi kazanamadı. Ancak, Sosyalistler ve Sosyal Demokratlar bir koalisyon hükümeti kurmak için bir anlaşmaya varmayı başardılar. Koalisyonun tam dönem süreceği belirsiz, ama belki de sağ korkusu onu bir arada tutacaktır."
 AAT_Sweden_BoP.14.d_non_aligned:0 "Seçim günü geldi ve seçmenler tercihlerini yaptı. $SWE_neutrality_party_long$ önümüzdeki günlerde çoğunluk hükümeti kuracak. Ulusal savunmayı güçlendirme planları ve kırsal seçmenleri etkileme politikaları açıkça başarılı oldu. Şimdi seçim sırasında tanıttıkları [ROOT.GetName] ülkesinin romantikleştirilmiş versiyonunu üretmeleri gerekiyor."
 AAT_Sweden_BoP.14.d_right:0 "Seçim günü geldi ve partilerin tüm çabalarına rağmen hiçbiri Riksdag'da çoğunluk sandalyesi kazanamadı. Ancak, Muhafazakarlar ve Faşistler bir koalisyon hükümeti kurmak için bir anlaşmaya varmayı başardılar. Koalisyonun tam dönem süreceği belirsiz, ama belki de sol korkusu onu bir arada tutacaktır."
 AAT_Sweden_BoP.14.d_socialist:0 "Seçim günü geldi ve seçmenler tercihlerini yaptı. $SWE_communism_party_long$ önümüzdeki günlerde çoğunluk hükümeti kuracak. Görünüşe göre millileştirme, sınıf dayanışması ve yabancı emperyalist angajmanların reddi gibi radikal politikaları halkı kazandı. Vaatlerinin ne kadarının şimdi yerine getirileceği ise görülecek."
 AAT_Sweden_BoP.14.t:0 "Seçim Sonuçları"
 AAT_Sweden_ball_bearing.1.a:0 "Gıda maddelerini güvence altına almalıyız"
 AAT_Sweden_ball_bearing.1.a_tt:0 "\n$we_will_gain_tt$\n  İstikrar: §G+2%§!\n  Haftalık İnsan Gücü: §G+15§!. \nBu birikebilir."
 AAT_Sweden_ball_bearing.1.b:0 "Askeri uzmanlıklarına ihtiyacımız var"
 AAT_Sweden_ball_bearing.1.c:0 "Bilgi paylaşımı iste"
 AAT_Sweden_ball_bearing.1.c_tt:0 "\nKabul edilirse [SWE.GetNameDef], §YGemiler§!, §YRadar§!, §YSentetik kaynaklar§! veya §YDestek teknolojisi§! için §G+25%§! araştırma bonusu seçebilecektir!"
 AAT_Sweden_ball_bearing.1.d:0 "Müzakereleri şimdilik durdur"
 AAT_Sweden_ball_bearing.1.desc:0 "Bilyalı Rulmanlarımız en üst düzeydedir ve dünyanın büyük güçleri tarafından savaş makineleri için aranmaktadır. Bu paha biçilmez ürünleri takas etmek için [FROM.GetName] ile müzakerelere giriyoruz, ancak önce karşılığında ne istediğimize karar vermeliyiz."
 AAT_Sweden_ball_bearing.1.t:0 "[FROM.FROM.GetName] için Bilyalı Rulman Ticaret Şartlarını Belirle"
 AAT_Sweden_ball_bearing.2.a:0 "Karşılıklı yarar sağlayan bir ticaret"
 AAT_Sweden_ball_bearing.2.b:0 "Bunu karşılayamayız"
 AAT_Sweden_ball_bearing.2.desc:0 "[SWE.GetNameDefCap], savaş çabalarımız için önemli bir kaynak olacak olan paha biçilmez Bilyalı Rulmanlarını gıda ithalatına karşı takas etmeyi talep etti. [SWE.GetAdjective] hükümeti, Büyük Savaş ablukası sırasında bu büyük bir sorun olduğu için, potansiyel bir gelecekteki çatışmada bu hayati ithalatı güvence altına almanın yollarını arıyor gibi görünüyor."
 AAT_Sweden_ball_bearing.2.t:0 "[SWE.GetNameDefCap], Bilyalı Rulmanlar için gıda ticareti talep ediyor"
 AAT_Sweden_ball_bearing.3.a:0 "$AAT_Sweden_ball_bearing.2.a$"
 AAT_Sweden_ball_bearing.3.b:0 "$AAT_Sweden_ball_bearing.2.b$"
 AAT_Sweden_ball_bearing.3.desc:0 "[SWE.GetNameDefCap], savaş çabalarımız için önemli bir kaynak olacak olan paha biçilmez Bilyalı Rulmanlarını, askeri uzmanlığımızı onlarla paylaşmamız karşılığında takas etmeyi talep etti. [SWE.GetAdjective] hükümeti, potansiyel bir gelecekteki çatışmada daha askeri açıdan gelişmiş Avrupa güçleriyle oyun alanını eşitlemenin yollarını arıyor gibi görünüyor."
 AAT_Sweden_ball_bearing.3.t:0 "[SWE.GetNameDefCap], Bilyalı Rulmanlar için askeri uzmanlık ticareti talep ediyor"
 AAT_Sweden_ball_bearing.4.a:0 "$AAT_Sweden_ball_bearing.2.a$"
 AAT_Sweden_ball_bearing.4.b:0 "$AAT_Sweden_ball_bearing.2.b$"
 AAT_Sweden_ball_bearing.4.desc:0 "[SWE.GetNameDefCap], savaş çabalarımız için önemli bir kaynak olacak olan paha biçilmez Bilyalı Rulmanlarını bilimsel bilgi birikimimiz ve ilerlemelerimiz karşılığında takas etmeyi talep etti. [SWE.GetAdjective] hükümeti, bilim ilerlemesi yoluyla potansiyel bir çatışmada üstünlük sağlamanın yollarını arıyor gibi görünüyor, bu da kesinlikle onlara yardımcı olabileceğimiz bir şey."
 AAT_Sweden_ball_bearing.4.t:0 "[SWE.GetNameDefCap], Bilyalı Rulmanlar için bilgi paylaşımı ticareti talep ediyor"
 AAT_Sweden_ball_bearing.5.a:0 " Destek Teknolojisi"
 AAT_Sweden_ball_bearing.5.b:0 "Radar Teknolojisi"
 AAT_Sweden_ball_bearing.5.c:0 "Sentetik Yağ Teknolojisi"
 AAT_Sweden_ball_bearing.5.d:0 "Gemi Teknolojisi"
 AAT_Sweden_ball_bearing.5.desc:0 "$AAT_Sweden.25.desc$\nŞimdi, diğer büyük güçlerle aramızdaki farkı kapatmak için daha fazla bilgi edinmek istediğimiz teknoloji türüne odaklanmamız gerekiyor."
 AAT_Sweden_ball_bearing.5.t:0 "[FROM.GetNameDefCap] Bilyalı Rulman ticaretini kabul ediyor"
 AAT_Sweden_ball_bearing.6.a:0 "Harika haber"
 AAT_Sweden_ball_bearing.6.desc:0 "[FROM.GetNameDefCap] ticaret teklifimizi lütfederek kabul etti. Bu anlaşma kesinlikle ikimize de karşılıklı fayda sağlayacaktır. Giderek daha güvensiz bir dünyada ticaret, egemen devletler arasındaki gerilimi azaltmak için hayati bir araç haline geliyor."
 AAT_Sweden_ball_bearing.6.t:0 "[FROM.GetNameDefCap] Bilyalı Rulman ticaretini kabul ediyor"
 AAT_Sweden_ball_bearing.7.a:0 "Ne yazık"
 AAT_Sweden_ball_bearing.7.desc:0 "[FROM.GetNameDefCap], karşılıklı bir ticaret anlaşması için her türlü teklifi reddetti. Küresel siyasi iklimdeki hızlı bir düşüşü ve sonuç olarak herhangi bir büyük askeri anlaşmanın ertelenmesi gerektiğini belirtiyorlar."
 AAT_Sweden_ball_bearing.7.t:0 "[FROM.GetNameDefCap] Bilyalı Rulman ticaretini reddediyor"
 AAT_Sweden_ball_bearing.8.a:0 "Bu bir kaçınılmazlık mıydı?"
 AAT_Sweden_ball_bearing.8.desc:0 "Ülkelerimiz arasında savaşın patlak vermesi üzerine Bilyalı Rulman ticaretinin her iki hükümet tarafından da zorla iptal edilmesi şaşırtıcı olmadı. Bir zamanlar küresel bir savaşa doğru yavaş yürüyüşü azaltmada bir basamak olarak selamlanan bu ticaret anlaşması şüphesiz bir başarısızlıktı.\nŞimdi bu kilit araçlar, sonunda kan, acı ve ıstıraptan başka bir şey getirmeyecek savaş makinelerine dönüştürülecek."
 AAT_Sweden_ball_bearing.8.t:0 "Savaşın patlak vermesiyle Bilyalı Rulman Ticareti iptal edildi"
 AAT_Sweden_communism.1.a:0 "Endişe verici"
 AAT_Sweden_communism.1.desc:0 "Nihayet hükümette iktidarı ele geçirdik ve [ROOT.GetDemocraticParty] seçmenlerin iradesini demokrasinin hak ettiği zarafetle kabul ederken, aşırı sağ eğilimli partiler bu süreci çok daha az kabul ediyor ve oyun meşruiyetini sorguluyorlar. Şimdilik bunlar sadece muhalifler, ama bunun daha fazla yayılmaması için dikkatli olmalıyız."
 AAT_Sweden_communism.1.t:0 "Faşist bir karşı devrim mırıltıları"
 AAT_Sweden_communism.2.a:0 "Daha da Endişe Verici"
 AAT_Sweden_communism.2.desc:0 "Hükümetin ordu üzerindeki bir soruşturması, birkaç üst düzey komutanı seçilmiş hükümeti baltalamak için yeraltı faşist bir hareketle ilişkilendiren bir dosya ile sonuçlandı. Rapor, ordunun ülkenin siyasi rotası hakkındaki söyleminin daha da cesur hale geldiğini belirtiyor ve bu tür söylemlere karşı eylemlerin ele alınmasını tavsiye ediyor"
 AAT_Sweden_communism.2.t:0 "Ordu muhalefeti"
 AAT_Sweden_communism.3.a:0 "Bu ancak yüksek rütbeli birinden gelen bir iç işi olabilir."
 AAT_Sweden_communism.3.desc:0 "Bir hükümet soruşturması, yüksek dereceli askeri silahların askeri envanterlerden kaybolduğunu ortaya çıkardı. Rapor, envanterlerin şu anda nerede olduğunu henüz belirleyemediğini, ancak birisi fark etmeden önce %60'a varan oranda kaybolduğunu belirtiyor."
 AAT_Sweden_communism.3.t:0 "Silah envanterleri kayıp"
 AAT_Sweden_communism.4.a:0 "Geri döneceğiz."
 AAT_Sweden_communism.4.desc:0 "[?global.date.GetDateStringShortMonth] tarihinde Riksdag'dan birkaç yüksek sesli patlama duyuldu ve başkentte kahverengi gömlekli bilinmeyen silahlı adamlar ortaya çıktı. Hükümet tahliye edildi ve düzeni sağlamak için yerel polise ve ulusal muhafızlara çağrıda bulundu, ancak bu talep sessizlikle karşılandı. Faşist kahverengi gömleklilerin, geçici bir hükümet kurma teklifinde üst düzey generallerle bir koalisyon içinde müttefik olduklarına dair söylentiler var. Hala gerçek hükümete sadık olan bireysel askerler sayesinde tüm personel yanan başkentten kaçmayı başardı"
 AAT_Sweden_communism.4.t:0 "[ROOT.GetFascistParty] ve ordu Stockholm'ün kontrolünü ele geçiriyor"
 AAT_Sweden_communism.5.a:0 "Onları yargıla."
 AAT_Sweden_communism.5.b:0 "Elebaşıları iktidardan \"terfi ettirerek\" uzaklaştır."
 AAT_Sweden_communism.5.desc:0 "[ROOT.GetName] ülkesindeki kent merkezlerindeki depolarda ağır hizmet silahlarının gizli zulaları bulundu. Bu depolar için kimin ödeme yaptığına dair kayıtların hepsi [ROOT.GetFascistParty] ile bağlantılı ve partiye bağlı paramiliterlerin liderleri olan Kahverengi Gömlekliler'in hepsi yakalandı.\nBu depolardan birinde bulunan mektuplar, bu silahları ilk başta zimmetine geçiren ve envanter numaralarını karıştıran bu komplodaki generalleri de ifşa ediyor. Bu elebaşıların silahlı kuvvetlerin önemsiz olmayan bir kısmı üzerinde etkileri olabileceğinden, burada incelik son derece önemlidir."
 AAT_Sweden_communism.5.t:0 "Elebaşılar ifşa oldu"
 AAT_Sweden_communism.6.a:0 "Varlıklarına el koyun, herkes gibi çalışabilirler"
 AAT_Sweden_communism.6.desc:0 "Bu aydınlanmış çağda, özellikle de gücü olmayan bir monarşiye hala tutunmak garip görünüyor. Yine de eski kral, bu tür davranışların uygunsuz ve anayasaya aykırı olduğuna dair birkaç uyarıya rağmen burnunu siyasete sokmaktan vazgeçemiyor. Daha da kötüsü, siyasi yelpazenin aşırı sağıyla giderek daha fazla aynı hizaya gelerek Çarların, Kayzerlerin ve Kralların eski ihtişamını arıyor. Bu toplumun geleceği değil ve bir hükümdara ihtiyacımız çoktan geçti; varlıklarını halkın iyiliği için ele geçirip normal insanlar gibi yaşamalarına izin verme zamanı geldi; ki onlar da öyleler."
 AAT_Sweden_communism.6.t:0 "Bernadotte Hanedanı'nın Kaderi."
 AAT_Sweden_communism.7.a:0 "Kilbom bizi geleceğe götürecek"
 AAT_Sweden_communism.7.b:0 "Cevap Flyg'dır"
 AAT_Sweden_communism.7.c:0 "Aslında, Stalinizm o kadar da kötü bir fikir olmayabilir"
 AAT_Sweden_communism.7.desc:0 "Karl Kilbom partinin kontrolünü ele geçirmek için harekete geçiyor. Bu, partiyi ikiye böldü, bir taraf Flyg'ı desteklerken diğer yarısı Kilbom'u destekliyor. Bu, zaten elde ettiğimiz siyasi zaferi istikrarsızlaştırma riski taşıyor ve bu devam ederse iktidarı tamamen kaybedebiliriz. [SWE.GetName] ülkesini parlak bir geleceğe kimin götüreceğine karar vermeliyiz."
 AAT_Sweden_communism.7.t:0 "Kilbom, Flyg'ı devirmek için harekete geçti"
 AAT_Sweden_communism__7_tt_1:0 "Bu bizi müttefiklerle aynı hizaya getirecek"
 AAT_Sweden_communism__7_tt_2:0 "Bu bizi Almanlarla aynı hizaya getirecek"
 AAT_Sweden_flashpoints.10.a:0 "Dünya bu saldırganlık eylemini duymalı."
 AAT_Sweden_flashpoints.10.b:0 "Tırmanışı önlemek için [SOV.GetAdjective] büyükelçiliğine dikkatle yaklaşacağız."
 AAT_Sweden_flashpoints.10.c:0 "Sovyetlerle yüzleşmekten kazanılacak çok az şey var."
 AAT_Sweden_flashpoints.10.desc:0 "[FIN.GetAdjective] sınırına yakın bir köy olan Pajala sakinleri, bugün birden fazla bina ve aracın yıkılmasına neden olan bir dizi patlamayla irkildi. Neyse ki, kimse ciddi şekilde yaralanmadı. Kanıtlar, patlamaların [SOV.GetAdjective] bombardıman uçaklarının bölgeyi [FIN.GetName]'deki hedeflerle karıştırmasından kaynaklandığını açıkça gösteriyor. \n\nHalkın duyarlılığı kontrolden çıkmadan önce duruma hakim olmalıyız. Ancak, [SOV.GetNameDef] ile daha geniş bir çatışmayı kışkırtmaktan da sakınmalıyız. "
 AAT_Sweden_flashpoints.10.t:0 "Kuzey [SWE.GetName] ülkesinde [SOV.GetAdjective] Hava Saldırısı"
 AAT_Sweden_flashpoints.11.a:0 "Daha geniş bir çatışmaya sürüklenme riskini göze alamayız. [SWE.GetAdjective] hükümetinden özür dileyeceğiz."
 AAT_Sweden_flashpoints.11.b:0 "Dahlimizi inkar et ve [SWE.GetAdjective] ülkesini saldırıyı kendilerinin düzenlemekle suçla."
 AAT_Sweden_flashpoints.11.desc:0 "[SOV.GetAdjective] pilotları, [FIN.GetName]'deki bir hedefle karıştırdıktan sonra yanlışlıkla bir [SWE.GetAdjective] köyüne hava saldırısı düzenledi. [SWE.GetAdjective] hükümeti şimdi öfkeyle hareket ediyor ve dünyanın dikkatini talihsiz kazaya çekiyor. \n\nOlayı kabul edip hasar için tazminat ödemeyi teklif edebiliriz, ancak bu vatandaşlarımızın [FIN.GetName]'deki askeri eylemlerimizi sorgulamasına yol açabilir ve diğer uluslar tarafından bir zayıflık işareti olarak görülebilir."
 AAT_Sweden_flashpoints.11.t:0 "[SWE.GetName] Pajala Bombalamasına Öfkeli"
 AAT_Sweden_flashpoints.12.a:0 "Hasar için [SWE.GetName] ülkesine tazminat ödeyeceğiz."
 AAT_Sweden_flashpoints.12.b:0 "Dahlimizi inkar et ve [SWE.GetAdjective] ülkesini saldırıyı kendilerinin düzenlemekle suçla."
 AAT_Sweden_flashpoints.12.desc:0 "[SOV.GetAdjective] pilotları, [FIN.GetName]'deki bir hedefle karıştırdıktan sonra yanlışlıkla bir [SWE.GetAdjective] köyüne hava saldırısı düzenledi. [SWE.GetAdjective] büyükelçiliğinden büyükelçiler bize saldırı hakkında bir açıklama ve onları nasıl tazmin etmeyi planladığımızı sormak için başvurdular. \n\nNeyse ki, kazanın haberi yayılmadı ve bu nedenle durum daha da tırmanmadan önce hızla çözme fırsatımız var."
 AAT_Sweden_flashpoints.12.t:0 "[SWE.GetAdjective] Diplomatları Pajala Bombalaması Hakkında Açıklama İstiyor"
 AAT_Sweden_flashpoints.13.a:0 "Meseleyi çözülmüş kabul edeceğiz."
 AAT_Sweden_flashpoints.13.desc:0 "[SOV.GetNameDef] yetkilileri, Pajala'daki son saldırı için özür diledi ve bunun pilotlarının gerçek bir hatası olduğunu ısrarla belirtti. Ayrıca neden olunan hasarı tazmin etmeyi de kabul ettiler. Görünüşe göre [SOV.GetAdjective]ler aramızda daha fazla tırmanışı önleme umuduyla ilişkilerde daha işbirlikçi bir ton tutturmaya çalışıyorlar."
 AAT_Sweden_flashpoints.13.t:0 "[SOV.GetNameDefCap] Pajala Bombalaması için Özür Diliyor"
 AAT_Sweden_flashpoints.14.a:0 "Alınacak çirkin bir tavır. Onlara acı çektireceğiz."
 AAT_Sweden_flashpoints.14.b:0 "Durumu tırmandıracak eylemleri riske atamayız."
 AAT_Sweden_flashpoints.14.desc:0 "Diplomatlarımızın Pajala olayını [SOV.GetAdjective] yetkilileriyle takip etme girişimleri, dahil olmanın reddedilmesiyle karşılaşıyor. Ayrıca, bombalamayı [FIN.GetName]'deki askeri operasyonlarımıza müdahale etmek için bir bahane olarak bizi suçlamaya çalışıyorlar. "
 AAT_Sweden_flashpoints.14.t:0 "[SOV.GetNameDefCap] Pajala'ya Dahil Olmayı Kabul Etmiyor"
 AAT_Sweden_flashpoints.15.a:0 "Trajik, [SWE.GetAdjective] komşularımıza minnettarız."
 AAT_Sweden_flashpoints.15.desc:0 "[SOV.GetAdjective] bombardıman uçakları yakın zamanda hava sahamızı [SWE.GetName]'e geçerek bir köyü bombalarken görüldü, bunun bir [FIN.GetAdjective] hedefi olduğuna inanıyorlardı. O zamandan beri, [SOV.GetNameDef] ve [SWE.GetName] arasında bir diplomatik kriz patlak verdi ve şimdi [SWE.GetName]'in [SOV.GetAdjective]lere karşı savaşmak için bize aktif olarak silah tedarik etmeye karar verdiği noktaya kadar tırmandı. [SOV.GetAdjective]lerin nasıl yanıt vereceği henüz belli değil."
 AAT_Sweden_flashpoints.15.t:0 "[SWE.GetName] Askeri Yardım Gönderiyor"
 AAT_Sweden_flashpoints.16.a:0 "Geri adım atmalarının zamanı gelmişti."
 AAT_Sweden_flashpoints.16.desc:0 "[SWE.capital.GetCapitalVictoryPointName] ve [SOV.capital.GetCapitalVictoryPointName] arasındaki bir dizi tırmanan gerilimden sonra, gerilim nihayet azalmaya başlıyor gibi görünüyor. [SWE.GetAdjective] hükümeti, Pajala olayı etrafındaki saldırgan söylemlerinden geri adım attı ve onları kabul etmemiz için yapabilecekleri çok az şey olduğunu kabul etmiş görünüyor. "
 AAT_Sweden_flashpoints.16.t:0 "[SWE.GetName] ile Gerilim Azalıyor"
 AAT_Sweden_flashpoints.17.a:0 " Durmazlarsa savaş tehdidinde bulunarak gerilimi azaltmak için tırmandıracağız."
 AAT_Sweden_flashpoints.17.b:0 " Şimdilik [SWE.GetAdjective] ülkesini yatıştırmalıyız."
 AAT_Sweden_flashpoints.17.desc:0 "[SWE.GetName]’in Pajala bombalaması konusundaki itibarımızı lekeleme girişimi başarısız olunca, şimdi [FIN.GetAdjective] ordusunu açıkça piyade teçhizatıyla silahlandırıyorlar. Bu, saldırıya katılımımızı kabul etmemiz için bize şantaj yapma veya daha fazla Sovyet askerinin ölme riskini göze alma girişimidir. \n\n[SWE.GetAdjective]lerin bir [FIN.GetAdjective] müttefiki olarak savaşa tamamen karışmasını önlemek için bir sonraki hamlemizi dikkatlice değerlendirmeliyiz."
 AAT_Sweden_flashpoints.17.t:0 "[SWE.GetName], [FIN.GetName]'i Silahlandırarak Gerilimi Tırmandırıyor"
 AAT_Sweden_flashpoints.18.a:0 "[SOV.GetLeader] blöf yapıyor ve biz buna kanmayacağız. Sevkiyatlara devam edin."
 AAT_Sweden_flashpoints.18.b:0 "Sovyetlerle daha fazla gerilimi riske atamayız."
 AAT_Sweden_flashpoints.18.desc:0 " [FIN.GetName] ülkesine kasıtlı olarak kışkırtıcı silah sevkiyatlarımız [SOV.GetNameDef] ülkesinin dikkatini çekti. Moskova'dan diplomatlar, [SOV.GetLeader]'in eylemlerimizi [SOV.GetNameDef] ülkesine karşı savaşa katılmakla eşdeğer gördüğünü ve bize karşı gerekli tüm adımların atılacağını bildirdi."
 AAT_Sweden_flashpoints.18.t:0 "[SOV.GetNameDefCap] Silah Sevkiyatının Sona Erdirilmesini Talep Ediyor"
 AAT_Sweden_flashpoints.19.a:0 "Bize başka seçenek bırakmıyorlar."
 AAT_Sweden_flashpoints.19.b:0 "Şimdilik [SWE.GetAdjective] ülkesini yatıştırmalıyız."
 AAT_Sweden_flashpoints.19.desc:0 "[SWE.GetAdjective] diplomatları, Pajala bombalamasındaki dahlimizi kabul edip tazminat ödeyene kadar silah sevkiyatlarını durdurma niyetinde olmadıklarını açıkça belirttiler. Tehditlerimize göre hareket etmezsek, bölgedeki diğer güçler bizi kendi saldırgan eylemleri için kolay bir hedef olarak görebilir. Ancak, [FIN.GetAdjective] askeri operasyonumuza birden fazla ulusu dahil etmek, çatışmanın küresel boyutlara tırmanmasını sağlayabilir."
 AAT_Sweden_flashpoints.19.t:0 "[SWE.GetName] Ültimatomu Reddetti"
 AAT_Sweden_flashpoints.20.a:0 "Birlikte, [SOV.GetAdjective] tehdidini yenebiliriz."
 AAT_Sweden_flashpoints.20.b:0 "Kendi başımıza idare ediyoruz."
 AAT_Sweden_flashpoints.20.desc:0 "[SWE.GetName] ve [SOV.GetNameDef] arasındaki son gerilim tırmanışının açık bir çatışmaya dönüşmesiyle, [SWE.GetAdjective] büyükelçileri ortak düşmanımıza karşı askeri bir ittifakta onlarla daha yakın çalışmayı önerdiler."
 AAT_Sweden_flashpoints.20.t:0 "[SWE.GetName], Anti-[SOV.GetAdjective] İttifakı Teklif Ediyor"
 AAT_Sweden_flashpoints.21.a:0 "Uluslarımız arasında daha fazla işbirliğini teşvik etmeliyiz."
 AAT_Sweden_flashpoints.21.b:0 "[SOV.GetLeader]'ı [FIN.GetAdjective] desteği olmadan yenebiliriz."
 AAT_Sweden_flashpoints.21.desc:0 "[SWE.GetName] ve [SOV.GetNameDef] arasındaki son gerilim tırmanışının açık bir çatışmaya dönüşmesiyle, diplomatlar [FIN.GetAdjective] meslektaşlarına ulaşıp ortak düşmanımıza karşı askeri bir ittifak kurmamızı öneriyorlar."
 AAT_Sweden_flashpoints.21.t:0 "[SWE.GetAdjective]-[FIN.GetAdjective] İttifakı"
 AAT_Sweden_flashpoints.22.a:0 "Talihsiz bir karar."
 AAT_Sweden_flashpoints.22.desc:0 "[FIN.GetAdjective] diplomatları, [SOV.GetNameDef] ülkesinde ortak bir düşmanı paylaşmamıza rağmen, hükümetlerinin stratejik hedeflerinin bizimkinden çok farklı olduğunu bize bildirdi. Bu nedenle, maalesef ittifak teklifimizi reddettiler."
 AAT_Sweden_flashpoints.22.t:0 "[FIN.GetName] İttifak Teklifini Reddetti"
 AAT_Sweden_flashpoints.30.a:0 "Demiryolu ağları üzerinden insani transit talebiyle [SWE.GetName] ülkesine yaklaşın."
 AAT_Sweden_flashpoints.30.b:0 "[SWE.GetAdjective] altyapısına ihtiyacımız yok."
 AAT_Sweden_flashpoints.30.desc:0 "İskandinavya'da başarılı bir şekilde bir yer edinmiş olsak da, Danimarka Boğazları üzerinden asker ve teçhizat taşımak tehlikeli olabilir. Konvoylar açık denizdeyken genellikle düşman hava ve deniz saldırılarına kurban gidebilir. Bu nedenle, deniz yollarının kullanımını mümkün olduğunca en aza indirmek savaş çabalarımıza faydalı olacaktır. \n\nBu nedenle, komşu [SWE.GetName] ülkesine tren ve iletişim ağlarına erişim izni vermesi için baskı yapmaya değer olabilir. Ancak, düşmanlarımız için bir operasyon üssü haline gelmelerini önlemek istiyorsak, tarafsızlıklarını kademeli olarak aşındırmalı ve dikkatli olmalıyız."
 AAT_Sweden_flashpoints.30.t:0 "[SWE.GetName] ülkesinde Transit Hakları"
 AAT_Sweden_flashpoints.31.a:0 "Hayatta kalmak tarafsızlıktan daha önemlidir."
 AAT_Sweden_flashpoints.31.b:0 "Talebi reddet ve onlara tarafsızlığımızı hatırlat."
 AAT_Sweden_flashpoints.31.desc:0 "[GER.GetAdjective] hükümetinden üyeler, yaralı birliklerin ve izinli olanların [SWE.GetName] ve [DEN.GetName] üzerinden [GER.GetNameDef] ülkesine gidip gelmelerine izin vermek için demiryolu ağımızın sınırlı kullanımı için bir talepte bulundular. Talebin tamamen insani nedenlerle olduğunu ısrarla belirtmelerine rağmen, bunu tarafsızlığımızı kademeli olarak aşındırmak için kullanacaklarını hayal etmek zor değil."
 AAT_Sweden_flashpoints.31.t:0 "[GER.GetName] Yaralılar için Transit Hakları Talep Ediyor"
 AAT_Sweden_flashpoints.32.a:0 "Onlara [GER.GetLeader]'in tarafsızlıklarından şüphe duymaya başladığını bildirin."
 AAT_Sweden_flashpoints.32.b:0 "Meseleyi bırak, düşmana katılmalarını riske atamayız. "
 AAT_Sweden_flashpoints.32.desc:0 "[SWE.GetName], tarafsızlığa olan bağlılıklarını gerekçe göstererek altyapımıza erişimimize izin vermeyi inatla reddetti. Belki de sürekli bağımsızlıklarının, Avrupa'yı yeniden organize ederken uyumları için bizden bir ödül olduğunu onlara hatırlatmak için daha sert bir yanıt gerekir. "
 AAT_Sweden_flashpoints.32.t:0 "[SWE.GetName] Talebi Reddediyor"
 AAT_Sweden_flashpoints.33.a:0 "Hayatta kalmak tarafsızlıktan daha önemlidir."
 AAT_Sweden_flashpoints.33.b:0 "[GER.GetLeader] tarafından zorlanmayacağız, kuvvetlerimizi seferber etmeye başlayın. "
 AAT_Sweden_flashpoints.33.desc:0 "[GER.Capital.GetCapitalVictoryPointName] şehrinden, [GER.GetLeader]'in son talebimizi reddetmemizden duyduğu üzüntüyü bildiren sert bir telgraf aldık. Görünüşe göre [GER.GetAdjective] lideri tarafsızlığımızı sorgulamaya başlıyor ve son eylemlerimizin [GER.GetName]’in düşmanlarıyla taraf tutmaya doğru bir kaymanın göstergesi olduğuna inanıyor. \n\nGerekirse durumu çatışmaya tırmandırmaya istekli olabilirler gibi görünüyor. Bu nedenle, mevcut duruşumuzu yeniden değerlendirme zamanı gelmiş olabilir."
 AAT_Sweden_flashpoints.33.t:0 "[GER.GetLeader] [SWE.GetAdjective] Tarafsızlığını Sorguluyor"
 AAT_Sweden_flashpoints.34.a:0 "[SWE.GetName] ülkesine saldırmak için hazırlıklara başlayın ve onlara bir ültimatom gönderin."
 AAT_Sweden_flashpoints.34.b:0 "Bu riske değmez."
 AAT_Sweden_flashpoints.34.desc:0 "[SWE.GetAdjective] ordusu, muhtemelen onlara baskı yapmamıza direnme isteklerini göstermek için kasıtlı olarak kışkırtıcı bir şekilde yüksek bir hazırlık durumuna geçirildi. Dikkatli adım atmalıyız, yoksa kendimizi İskandinavya'da bir başka çatışmaya bulaştırma riskiyle karşı karşıya kalırız."
 AAT_Sweden_flashpoints.34.t:0 "[SWE.GetName] Askeri Hazırlığı Artırıyor"
 AAT_Sweden_flashpoints.35.a:0 "Hayatta kalmak tarafsızlıktan daha önemlidir."
 AAT_Sweden_flashpoints.35.b:0 "Savaş kaçınılmazsa, kendi şartlarımızda savaşmalıyız."
 AAT_Sweden_flashpoints.35.c:0 "Tarafsızlığımızdan vazgeçmeyeceğiz."
 AAT_Sweden_flashpoints.35.desc:0 "[GER.GetNameDefCap], altyapımıza erişim için en son taleplerimize boyun eğmemizi talep eden sert bir ültimatom yayınladı. Bunu yapmazsak, bizi [GER.GetNameDef] ülkesinin bir düşmanı olarak göreceklerini ve İskandinavya'daki çıkarlarını güvence altına almak için gerekli tüm gücü kullanacaklarını belirtiyor."
 AAT_Sweden_flashpoints.35.t:0 "[GER.GetName] Ültimatom Veriyor"
 AAT_Sweden_flashpoints.36.a:0 "Umarım tarafsızlığımızı koruyabiliriz."
 AAT_Sweden_flashpoints.36.desc:0 "[GER.GetNameDef] ile son zamanlardaki gerilimler neyse ki dağılmaya başlıyor. Tüm blöflerine rağmen, çok zor bir diplomatik durumu idare etmeyi başarmış gibi görünüyoruz. Ancak, son eylemlerimizin muhtemelen [GER.Capital.GetCapitalVictoryPointName] şehrinde bize karşı büyük bir kin uyandırdığı için dikkatli olmalıyız."
 AAT_Sweden_flashpoints.36.t:0 "[GER.GetNameDef] ile Gerilim Azalıyor"
 AAT_Sweden_flashpoints.37.a:0 "Orduyu aşırı zorlama riskini alamayız."
 AAT_Sweden_flashpoints.37.b:0 "[SWE.GetName] işgaline başla."
 AAT_Sweden_flashpoints.37.desc:0 "[SWE.GetAdjective] hükümeti, tarafsızlıklarını bir zayıflık veya hazırlıksızlık kabulü olarak yanlış yorumlamamamız gerektiğini belirterek ültimatomumuzu sert bir şekilde reddetti. [SWE.GetName] ülkesine karşı pervasızca bir eylemde bulunulması durumunda ordumuzun ciddi can kaybına hazırlıklı olması gerektiğini belirtmeye devam ediyorlar. \n\nBu sadece askeri eylemi caydırmak için bir blöf olabilir, ancak İsveç birliklerinin gözlemleri, bağımsızlıkları için savaşmaya istekli olduklarını gösteriyor."
 AAT_Sweden_flashpoints.37.t:0 "[SWE.GetName] Ültimatomu Reddetti"
 AAT_Sweden_flashpoints.38.a:0 "[SWE.GetName] tarihimizde bir dipnot olacak."
 AAT_Sweden_flashpoints.38.desc:0 "Görünüşe göre [SWE.GetAdjective] savaşma isteğini ciddi şekilde yanlış değerlendirmişiz. Yüzyılı aşkın bir tarafsızlığa rağmen, [SWE.GetAdjective] silahlı kuvvetleri bugün Norveç'teki kuvvetlerimize karşı onları gafil avlayan önleyici bir saldırı başlattı. Çatışmanın sonucu kesin olmaktan uzak olsa da, [SWE.GetAdjective] meslektaşlarımızın cüretine istemeyerek de olsa saygı duymamak zor."
 AAT_Sweden_flashpoints.38.t:0 "[SWE.GetName] Önleyici Saldırı Başlattı"
 AAT_Sweden_flashpoints.39.a:0 "Mükemmel, onları daha fazla sinirlendirmekten kaçınacağız."
 AAT_Sweden_flashpoints.39.b:0 "İtmeye devam et, iletişim ağlarına erişim sağlayabiliriz."
 AAT_Sweden_flashpoints.39.desc:0 "[SWE.GetName], yaralı birliklerimizin ve izinli olanların demiryolu ağları üzerinden [GER.GetNameDef] ülkesine geri dönmelerine izin verdi. Ancak sadece silahsız personelin bunu yapabileceğini ve İsveç'te herhangi bir zamanda çok fazla asker olmamasını sağlamak için katı kotaların uygulanacağını ısrarla belirtiyorlar. "
 AAT_Sweden_flashpoints.39.t:0 "[SWE.GetName] Yaralıların Geçişine İzin Veriyor"
 AAT_Sweden_flashpoints.40.a:0 "Hayatta kalmak tarafsızlıktan daha önemlidir."
 AAT_Sweden_flashpoints.40.b:0 "Bunu kendi lehimize kullanabiliriz."
 AAT_Sweden_flashpoints.40.c:0 "Tarafsızlığımızdan vazgeçemeyiz."
 AAT_Sweden_flashpoints.40.desc:0 "Korktuğumuz gibi, Almanya'nın demiryolu ağımıza erişim için son talebi şimdi genişledi. [GER.Adjective] hükümeti, [NOR.GetName] ve [GER.GetNameDef] arasında doğrudan iletişim kurmak için telgraf ve telefon ağlarımızı kullanma yetkisi talep ediyor.\n\nBu talebe boyun eğmek tarafsızlığımıza bir darbe daha vuracaktır, ancak [GER.GetAdjective] ordusunun ne planladığını casusluk yapmak için iletişim hatlarını dinlemeyi araştırabiliriz."
 AAT_Sweden_flashpoints.40.t:0 "[GER.GetName], Telefon ve Telgraf Ağlarına Erişim Talep Ediyor"
 AAT_Sweden_flashpoints.41.a:0 "Mükemmel, onlardan alabileceğimiz kadarını aldık."
 AAT_Sweden_flashpoints.41.b:0 "Tam askeri erişim için son bir hamle yapmalıyız."
 AAT_Sweden_flashpoints.41.desc:0 "[GER.Capital.GetCapitalVictoryPointName] ve [NOR.GetName] ülkesindeki kuvvetlerimiz arasındaki iletişim, İsveç hükümetinin işbirliği sayesinde önemli ölçüde kolaylaştı.  Belki de imtiyazlarımızı kaybetme riskini göze almamak için onları daha fazla düşmanlaştırmaktan kaçınmalıyız. "
 AAT_Sweden_flashpoints.41.t:0 "[SWE.GetName] Telefon ve Telgraf Ağlarına Erişime İzin Veriyor"
 AAT_Sweden_flashpoints.42.a:0 "[GER.GetName] ile savaşacak gücümüz yok."
 AAT_Sweden_flashpoints.42.b:0 "Bu savaşa sürüklenmekten kaçınmak istiyorsak bu talebe direnmeliyiz."
 AAT_Sweden_flashpoints.42.desc:0 "Bizden önceki imtiyazlarından memnun olmayan [GER.GetNameDef]’in hükümeti, İskandinavya'daki askeri operasyonlarının yükünü hafifletmek için askeri erişim talep etti. Bunun her zaman [GER.GetAdjective] niyeti olduğu ve tarafsızlığımızın son kalıntılarını teslim etmemenin [GER.GetLeader] tarafından [SWE.GetName] işgali için bir gerekçe olarak kullanılacağı aşikar. Ancak, erişime izin verirsek, komşularımız ve [GER.GetNameDef]’in düşmanları muhtemelen bizi [NOR.GetName] işgaline suç ortağı olarak göreceklerdir."
 AAT_Sweden_flashpoints.42.t:0 "[GER.GetName] Askeri Erişim Talep Ediyor"
 AAT_Sweden_flashpoints.43.a:0 "Sadece isim olarak değil, tamamen bizim kontrolümüz altındalar."
 AAT_Sweden_flashpoints.43.desc:0 "[SWE.GetName] bize ülkelerine tam askeri erişim verdi. Bu sadece İskandinavya'daki operasyonlarımıza yardımcı olmakla kalmıyor, aynı zamanda [SWE.GetName] üzerindeki nüfuzumuzu artırıyor ve düşmanlarımıza kolayca katılmalarını engelliyor."
 AAT_Sweden_flashpoints.43.t:0 "[SWE.GetName] Askeri Erişime İzin Veriyor"
 AAT_Sweden_flashpoints.50.a:0 "Sorun çıkarmalarını riske atamayız. Onları kilitleyin."
 AAT_Sweden_flashpoints.50.b:0 "Bu demokratik bir toplumda kabul edilemez. "
 AAT_Sweden_flashpoints.50.desc:0 "Aşırı solun faaliyetlerini her zaman göz önünde bulundurmuş olsak da, komünistlerin askeri tesislerimizi sabote etmesini veya kilit sanayilerde hoşnutsuzluk ekerek [SOV.GetAdjective] birliklerinin [SWE.GetName] ülkesine sızmasını kolaylaştırmasını öngörmek imkansız değil. Bu nedenle, [SOV.GetNameDefCap] sempatizanı olarak bilinenleri veya daha genel olarak aşırı sol bir duruşa sahip olanları gözaltına alarak bu tür faaliyetleri önlemeliyiz."
 AAT_Sweden_flashpoints.50.t:0 "İçimizdeki Düşman"
 AAT_Sweden_flashpoints.51.a:0 "Polisi desteklemek için orduyu gönderin."
 AAT_Sweden_flashpoints.51.b:0 "Bu bir hataydı, zaten tutukladıklarımızı serbest bırakmalıyız."
 AAT_Sweden_flashpoints.51.desc:0 "[SWE.GetName] genelinde radikal solcuları gözaltına alma kararımızın ardından, bu amacı yerine getirmek için polisin yaptığı baskınlar ve tutuklamalar, çalışan insanlar tarafından şiddetli bir muhalefetle karşılandı. Birçok kişi, radikallerin yakalanmaktan kaçmasına yardım etmeye veya doğrudan polis memurlarına saldırmaya kadar gitti. Böyle toplu bir tutuklamanın bir polis devleti yaratmaya eşdeğer olduğunu iddia ediyorlar. Nasıl ilerleyeceğimize dikkat etmeliyiz, yoksa işler çok çabuk kontrolden çıkabilir."
 AAT_Sweden_flashpoints.51.t:0 "Gözaltı Kararına Karşı Öfke"
 AAT_Sweden_flashpoints.52.a:0 "Bu güruhun ulusumuzu yok etmesine izin veremeyiz. "
 AAT_Sweden_flashpoints.52.b:0 "Tutuklamaları durdurmalıyız, ulusu yok ediyoruz."
 AAT_Sweden_flashpoints.52.desc:0 "Radikal solcuların tutuklanmasında polise destek olmak için orduyu görevlendirme kararımız, ulusu iç savaşa sürükleme tehdidi taşıyan bir şiddet sarmalına neden oldu. İşçiler ve polis arasındaki çatışmalar bir dizi ölüm ve yaralanmaya yol açtı. Tutuklayamadığımız radikaller, işçileri bize karşı topluyor ve hükümetin tamamen feshedilmesi çağrısında bulunuyorlar. Ayrıca, bir dizi askerin emirleri yerine getirmeyi reddettiğini ve hatta ordudan tamamen firar ettiğini gördük. Bu, ulusun bir yüzyıldan fazla bir süredir içinde bulunduğu en vahim durum olabilir."
 AAT_Sweden_flashpoints.52.t:0 "Solcu Tutuklamaları Nedeniyle Kitlesel Protestolar ve Şiddet Patlak Verdi"
 AAT_Sweden_flashpoints.53.a:0 "Bu devrim çok gecikti."
 AAT_Sweden_flashpoints.53.b:0 "Bu [SOV.GetNameDef] ajanlarını ezeceğiz."
 AAT_Sweden_flashpoints.53.desc:0 "Son haftalardaki düzensiz şiddet şimdi ülke çapında organize hareketlere dönüşüyor. Bu hareketlerin çoğu $SWE_communism_party_long$ ile aynı çizgide ve hatta [SOV.GetNameDef] ile bağlantılı olabilir.\n\nKomünist milisler bir dizi kentsel alanı ele geçirdi ve solcuları gözaltına alma yönündeki son planlarımızla bağlantılı herkesi tutuklamaya başladı. Bu arada, kasabalarının da komünistlerin eline geçmesini önlemek için genellikle yerel polisin desteğiyle milliyetçiler tarafından da milisler oluşturuluyor. Her iki grup ile ordumuz arasındaki şiddet, iç savaştan başka bir şey olarak kabul edilemeyecek bir noktaya tırmandı."
 AAT_Sweden_flashpoints.53.t:0 "[SWE.GetAdjective] İç Savaşı Patlak Verdi"
 AAT_Sweden_flashpoints.54.a:0 "Felaketten kıl payı kurtulduk."
 AAT_Sweden_flashpoints.54.desc:0 "Yetkililer ile solcu aktivistleri gözaltına almamıza karşı çıkanlar arasındaki son gerilimler azalmaya başladı. Hükümet ile halk arasında büyük bir güven kaybı yaşanmış olsa da, durumun mezhep çatışmasına dönüşme riskimiz artık yok gibi görünüyor."
 AAT_Sweden_flashpoints.54.t:0 "[SWE.GetName] ülkesindeki Gerilimler Azalıyor"
 AAT_Sweden_flashpoints.56.a:0 "Anakarayı terk edemeyiz."
 AAT_Sweden_flashpoints.56.b:0 "Mükemmel bir teklif."
 AAT_Sweden_flashpoints.56.desc:0 "Birçok üst düzey ordu subayının komünist devrimcilere katılmasıyla, donanma dışındaki herhangi bir kola olan güven en düşük seviyededir. Son olayların Kral'ın güvenliğini tehlikeye atmasıyla, hayatta kalmasını sağlamak için sert önlemler öneriliyor. Amirallik, Kral'ı Gotland adasına taşıyarak ve ulusu daha verimli ve göreceli bir güvenlik içinde yönetmek için sadık bir askeri yönetim kurarak durumu yeniden kontrol altına almak için cüretkar bir plan önerdi."
 AAT_Sweden_flashpoints.56.t:0 "Gotland Teklifi"
 AAT_Sweden_flashpoints.57.a:0 "Ne karmaşık bir karmaşa"
 AAT_Sweden_flashpoints.57.desc:0 "Sabahın erken saatlerinde İsveç hükümeti kralı başkentten tahliye etmeye ve Gotland'da daha güvenli bir yere taşımaya karar verdi. Konvoy partizanlar tarafından durduruldu ve kralın aracı vuruldu, ön camı kırıldı.\nSonraki çatışmada kral ağır yaralandı ve sol gözü kalıcı olarak hasar gördü. Hükümet adaya kaçarken İsveç'in meşru hükümeti olarak kontrolü geri almaya yemin ettiler, ancak kralın hükümetin kontrolünü etkili bir şekilde ele geçirdiği ve yaralanmasından sonra yeni bir şevk kazandığı yönünde söylentiler bol miktarda."
 AAT_Sweden_flashpoints.57.t:0 "İsveç Kralı tahliye girişimi sırasında yaralandı"
 AAT_Sweden_flashpoints.60.a:0 "O zaman biz de [THIS.GetNameDef] ülkesindeki [SWE.GetAdjective] varlıklarına el koyarız."
 AAT_Sweden_flashpoints.60.b:0 "Landsverk zaten amacını doldurmuştu."
 AAT_Sweden_flashpoints.60.desc:0 "[SWE.GetName], zırhlı araçlar geliştirmek için [SWE.GetAdjective] ile birlikte işlettiğimiz bir şirket olan Landsverk'in kontrolünü ele geçirdi. Landsverk’in bize olan faydası son yıllarda azalmış olsa da, bu [SWE.GetName]'in [GER.GetNameDef]'den uzaklaşmak istediğinin açık bir işaretidir."
 AAT_Sweden_flashpoints.60.t:0 "[SWE.GetName] Landsverk'e El Koydu"
 AAT_Sweden_flashpoints.61.a:0 "Bakalım bizden hiç ticaret yapmadan nasıl idare edecekler."
 AAT_Sweden_flashpoints.61.b:0 "Şaşırtıcı değil, ama talihsizlik."
 AAT_Sweden_flashpoints.61.desc:0 "Landsverk'e el koymamızın ardından yaşanan sert bir tırmanışla, [GER.GetNameDef] hükümeti, ülkelerindeki [SWE.GetAdjective] vatandaşlarıyla bağlantılı çok sayıda varlığa el koyarak yanıt verdi. [GER.GetNameDef]'den yavaşça uzaklaşmak istemiş olsak da, bu karar [SWE.GetAdjective] halkı arasında öfkeye neden oldu."
 AAT_Sweden_flashpoints.61.t:0 "[FROM.GetName] İsveç Varlıklarına El Koydu"
 AAT_Sweden_flashpoints.62.a:0 "Eğer bizimle ticaret yapmazlarsa, artık onların sınırlarına saygı duymayacağız."
 AAT_Sweden_flashpoints.62.b:0 "Bunu tırmandırmak sadece bizi küçük uluslara bağımlı gibi gösterir."
 AAT_Sweden_flashpoints.62.desc:0 "[SWE.GetNameDef], bugün [GER.GetNameDef] ülkesine bir ticaret ambargosu uygulayarak son gerilimleri yeni bir zirveye taşıdı. Bu karar, silah sanayii için demir üretme yeteneğimizi önemli ölçüde etkileyecektir. "
 AAT_Sweden_flashpoints.62.t:0 "[FROM.GetName], [GER.GetNameDef] ülkesine Ticaret Ambargosu Uyguluyor"
 AAT_Sweden_flashpoints.63.a:0 "Ültimatomlarını reddet."
 AAT_Sweden_flashpoints.63.b:0 "Böyle bir çatışmayı riske atamayız."
 AAT_Sweden_flashpoints.63.desc:0 "[GER.GetNameDef] ülkesine ambargo uygulama kararımız [GER.Capital.GetCapitalVictoryPointName] şehrinde öfkeyle karşılandı. Muhtemelen [SWE.GetAdjective] demir cevherine olan tarihsel bağımlılıkları nedeniyle panikleyerek bir ültimatom yayınladılar. Ambargomuzu derhal kaldırmazsak, savaş da dahil olmak üzere bize karşı sert önlemler almak zorunda kalacaklarını belirtiyor."
 AAT_Sweden_flashpoints.63.t:0 "[FROM.GetNameDefCap] Savaş Tehdidinde Bulunuyor"
 AAT_Sweden_flashpoints.64.a:0 "Bunu kendi başlarına getirdiler."
 AAT_Sweden_flashpoints.64.b:0 "Onlarsız da idare edebiliriz."
 AAT_Sweden_flashpoints.64.desc:0 "[SWE.GetNameDef] ültimatomumuzu kesin bir dille reddetti. Onlara karşı herhangi bir saldırının, ordumuz onları işgal etmeden çok önce maden kuyularını yok edecekleri için [SWE.GetAdjective] cevher rezervlerine erişimlerini iyileştirmeyeceğini belirttiler."
 AAT_Sweden_flashpoints.64.t:0 "[FROM.GetNameDefCap] Ültimatomu Reddediyor"
 AAT_Sweden_flashpoints.65.a:0 "Şimdi dünyadaki yerlerini anlıyorlar."
 AAT_Sweden_flashpoints.65.desc:0 "[SWE.GetAdjective] hükümeti sonunda aklını başına topladı ve bize karşı ambargolarını kaldırmaya karar verdi. Uluslarımız arasında ticaretin tamamen normalleşmesi zaman alabilir, ancak gerekirse onları hala diz çöktürebilecek kapasitemiz olduğunu onlara açıkça belirttik."
 AAT_Sweden_flashpoints.65.t:0 "[FROM.GetNameDefCap] Ambargoyu Kaldırıyor"
 AAT_Sweden_flashpoints.70.a:0 "Yolunuz açık olsun."
 AAT_Sweden_flashpoints.70.desc:0 "[ITA.GetName] ülkesinden yeni satın aldığımız gemiler şimdi limandan ayrıldı. Yolda yakıt ikmali yapma ihtiyacı nedeniyle [SWE.GetNameDef] ülkesine yolculukları yaklaşık bir ay sürecek."
 AAT_Sweden_flashpoints.70.t:0 "Satın Alınan Gemiler [ITA.GetAdjective] Limanlarından Ayrılıyor"
 AAT_Sweden_flashpoints.71.a:0 "Bu gemileri daha iyi kullanabiliriz."
 AAT_Sweden_flashpoints.71.b:0 "[SWE.GetName] ile ilişkileri bozmak istemiyoruz"
 AAT_Sweden_flashpoints.71.desc:0 "Dört eski [ITA.GetAdjective] muhribi bugün limanlarımızdan birine geldi. Gemiler [SWE.GetAdjective] hükümeti tarafından satın alındı ve [SWE.GetName]'e transfer edilme sürecindeler. Yakıt ikmali yaparken, gemilerin kontrolünü ele alabilir ve potansiyel olarak kendimiz kullanabiliriz. Ancak bu muhtemelen [SWE.GetName] ile ilişkilerimize zarar verecektir."
 AAT_Sweden_flashpoints.71.t:0 "Eski [ITA.GetAdjective] Gemileri [SWE.GetName] ülkesine Yöneldi "
 AAT_Sweden_flashpoints.72.a:0 "Bu bir savaş eylemidir. Onları serbest bırakmalı veya sonuçlarına katlanmalılar."
 AAT_Sweden_flashpoints.72.b:0 "[ENG.GetName] ile bir savaşı riske atamayız."
 AAT_Sweden_flashpoints.72.desc:0 "Bir [ENG.GetAdjective] kontrolündeki limanda duraklarken, dört yeni gemimiz donanmaları tarafından ele geçirildi. Görünüşe göre el koyma için 'angary' hakkını bir bahane olarak kullanıyorlar. Savaşa neden olmadan gemileri geri alacaksak dikkatli adım atmalıyız."
 AAT_Sweden_flashpoints.72.t:0 "[ENG.GetName] Yeni Gemilerimizi Ele Geçiriyor"
 AAT_Sweden_flashpoints.73.a:0 "Onları serbest bırakma niyetimiz yok."
 AAT_Sweden_flashpoints.73.b:0 "Gemileri tutmaktan kazanılacak çok az şey var."
 AAT_Sweden_flashpoints.73.desc:0 "[SWE.GetAdjective] hükümeti, gemilerinin ele geçirilmesini bir savaş eylemi olarak gördüklerini ve derhal serbest bırakmazsak misliyle karşılık vermek zorunda kalacaklarını açıkça belirtti. "
 AAT_Sweden_flashpoints.73.t:0 "[SWE.GetName] Gemilerin Serbest Bırakılmasını Talep Ediyor"
 AAT_Sweden_flashpoints.74.a:0 "Başka seçenekleri yoktu."
 AAT_Sweden_flashpoints.74.desc:0 "[SWE.GetAdjective] hükümeti gemilerini geri alma girişiminden vazgeçmiş görünüyor. Birkaç küçük değişiklikten sonra, gemiler artık donanmamızla hizmete hazır."
 AAT_Sweden_flashpoints.74.t:0 "[SWE.GetName] Gemi Enterne Edilmesini Kabul Ediyor"
 AAT_Sweden_flashpoints.75.a:0 "Yeni bir düşman edindiler."
 AAT_Sweden_flashpoints.75.b:0 "Bu, uğruna savaşa girmeye değmez."
 AAT_Sweden_flashpoints.75.desc:0 "[ENG.GetAdjective] hükümeti, enterne edilmiş gemilerimizi serbest bırakmayı inatla reddetti. Görünüşe göre o gemileri geri almanın tek yolu onlar için savaşmak olacak. "
 AAT_Sweden_flashpoints.75.t:0 "[ENG.GetName] Gemileri Serbest Bırakmayı Reddediyor"
 AAT_Sweden_flashpoints.76.a:0 "Sonunda onları görmeyi dört gözle bekliyoruz."
 AAT_Sweden_flashpoints.76.desc:0 "Gemilerimizin serbest bırakılmasının ardından [ENG.GetName] ve [SWE.GetName] arasındaki gerilim nihayet yatıştı. Açıkçası [ENG.GetAdjective], bazı eski gemiler yüzünden bizimle bir çatışmaya girmekten kaçınmak istedi."
 AAT_Sweden_flashpoints.76.t:0 "[ENG.GetName] Gemileri Serbest Bırakıyor"
 AAT_Sweden_flashpoints.77.a:0 "Bize çok faydaları dokunacak."
 AAT_Sweden_flashpoints.77.desc:0 "[ITA.GetNameDef] ülkesinden satın aldığımız gemiler, yolculukları boyunca herhangi bir büyük sorun olmadan geldi. Mürettebat, yolda limanlarda yakıt ikmali yaparken büyük bir denetime maruz kaldıklarını bildiriyor."
 AAT_Sweden_flashpoints.77.t:0 "Yeni Gemiler Güvenle Geldi"
 AAT_Sweden_flashpoints.78.a:0 "Åland bizimdir ve öyle kalacaktır"
 AAT_Sweden_flashpoints.78.b:0 "Bu doğru bir seçim"
 AAT_Sweden_flashpoints.78.c:0 "Eğer [SWE.GetName] bizi tazmin ederse"
 AAT_Sweden_flashpoints.78.desc:0 "[SWE.GetName], Baltık denizi üzerinde kontrol sağlamak için kullanılabilecek stratejik konumdaki Åland adaları konusunda giderek daha fazla endişe duymaya başladı.\nMevcut durumumuz ve adaların nüfusunun çoğunluğunun [SWE.GetAdjective] olması göz önüne alındığında, hükümetleri dünya istikrara kavuşana kadar adaları devretmeye istekli olup olmadığımızı soruyor. Adaların düşman eline geçmesini önleme arzularını ve [SWE.GetAdjective] vatandaşlarını koruma ihtiyacını gerekçe gösteriyorlar."
 AAT_Sweden_flashpoints.78.t:0 "[SWE.GetName] Åland'ın kontrolünü istiyor"
 AAT_Sweden_flashpoints.79.a:0 "Ne yazık"
 AAT_Sweden_flashpoints.79.desc:0 "[FIN.GetName], Åland adalarının kontrolünün devredilmesi sorusuyla ilgili olarak bize çok net bir 'hayır' cevabı verdi."
 AAT_Sweden_flashpoints.79.t:0 "[FIN.GetName] reddediyor"
 AAT_Sweden_flashpoints.80.a:0 "Harika"
 AAT_Sweden_flashpoints.80.desc:0 "İçinde bulundukları tehlikeli durumu gerekçe göstererek, adaların kontrolünü yabancı bir işgalci yerine bizde görmeyi tercih ediyorlar. Hali hazırda çoğunluğu [SWE.GetAdjective] konuşan yerliler bunu olumlu karşıladı ve hayatları normal seyrinde devam ediyor."
 AAT_Sweden_flashpoints.80.t:0 "[FIN.GetName] kabul ediyor"
 AAT_Sweden_flashpoints.81.a:0 "Buna değer"
 AAT_Sweden_flashpoints.81.b:0 "Hayır"
 AAT_Sweden_flashpoints.81.desc:0 "[FIN.GetName], Åland adalarından vazgeçmeye istekli olduğunu kabul ediyor ancak şu anda paraya oldukça sıkışık olduklarını vurguluyor.\nKaybettikleri geliri telafi etmek amacıyla, devlet rezervlerimizden bir miktar karşılığında adanın kontrolünü bize bırakmaya hazırlar."
 AAT_Sweden_flashpoints.81.t:0 "[FIN.GetName] kabul ediyor, bir bedel karşılığında"
 AAT_Sweden_flashpoints.82.a:0 "Gerekli bir maliyet"
 AAT_Sweden_flashpoints.82.desc:0 "[SWE.GetName], Åland için bizi mali olarak tazmin etmeyi kabul etti. İşlem devam ederken küçük bir tören düzenlendi ve bazı Ålandlılar gelecekleri için anlaşılır bir şekilde endişeli olsalar da, [SWE.GetAdjective] yetkilileri geçişin mümkün olduğunca sorunsuz yapılacağını ve yaşam tarzlarına saygı duyduklarını belirtti."
 AAT_Sweden_flashpoints.82.t:0 "[SWE.GetName] kabul ediyor"
 AAT_Sweden_flashpoints.83.a:0 "O zaman yeterince istememişler"
 AAT_Sweden_flashpoints.83.desc:0 "[SWE.GetName] Åland'ın devri için rezervlerinin o kadarını harcamaya istekli olmadığına karar verdi."
 AAT_Sweden_flashpoints.83.t:0 "[SWE.GetName] reddediyor"
 AAT_Sweden_flashpoints_civil_war_tt:0 "§R[SWE.GetFlag][SWE.GetName]’in istikrarını düşürmek, komünistler yüksek desteği sürdürürse bir iç savaşa yol açabilir!§!"
 AAT_Sweden_flashpoints_tt_arne_beurling:0 "Danışman olarak §YArne Beurling§!'i ($MODIFIER_DECRYPTION_POWER$: §G+15§!) açar"
 AAT_Sweden_nationalists.1.a:0 " Asker ayıramayız, ama onlara biraz destek gönderebiliriz."
 AAT_Sweden_nationalists.1.b:0 "Onları destekleyeceğiz."
 AAT_Sweden_nationalists.1.desc:0 "[SWE.GetName] ülkesindeki önde gelen Nasyonel Sosyalist partisinden temsilciler bize bir fırsatla başvurdu. Mevcut hükümetlerini devirme sürecindeler ve bu girişimlerinde destek için bize başvurdular. Askeri destek karşılığında, ülkeyi sağlam bir şekilde etki alanımıza yerleştirmeyi kabul ettiler."
 AAT_Sweden_nationalists.1.t:0 "[SWE.GetAdjective] Nasyonel Sosyalistleri Müdahale İstiyor"
 AAT_Sweden_nationalists.10.a:0 "[SWE.GetName] bir kez daha büyük bir güç olacak."
 AAT_Sweden_nationalists.10.desc:0 "Mevcut yönetim altındaki ulusun savunmalarının kötü yönetiminden rahatsız olan askeri subay sıkıntısı yok. Bu nedenle ordu ve donanmadan birçok üst düzey subay, iktidara geldiğimizde savunma bütçesini güçlendirme karşılığında milliyetçi davaya yardım etmeyi kabul etti. "
 AAT_Sweden_nationalists.10.t:0 "Askeri Subaylar Destek Teklif Ediyor"
 AAT_Sweden_nationalists.11.a:0 "Kırsal halk ulusun bel kemiğidir."
 AAT_Sweden_nationalists.11.desc:0 "[SWE.GetName]'in kent merkezlerinin dışındaki birçok kişi, Sosyal-Demokratların politikaları tarafından geride bırakılmış hissediyor. Ayrıca, sanayileşmeden tehdit altında hissediyorlar ve geleneksel yaşam tarzlarının aşındığından endişe ediyorlar. Aralarında hoşnutsuzluk tohumları ekerek, kırsala yatırım yapmayı ve geleneksel değerleri geri getirmeyi vaat eden milliyetçi hareketler için bir taban desteği yaratmayı başardık."
 AAT_Sweden_nationalists.11.t:0 "Kırsal Destek Artıyor"
 AAT_Sweden_nationalists.12.a:0 "Umarız yolumuza çıkmazlar."
 AAT_Sweden_nationalists.12.desc:0 "Hukuk uzmanları dışındaki hiç kimse, son reformlarımızın esasen aristokratik ayrıcalıkların restorasyonu anlamına geldiğinin farkında değildi. Elbette, medyanın kontrolümüz altında olmasıyla, bu tür uzmanların halk arasında hoşnutsuzluk yayma yolu yoktu. Bu arada, aristokrasi üyeleri reformlardan dolayı coşkulu ve son on yılların yanlışlarını düzeltmeyi dört gözle bekliyorlar."
 AAT_Sweden_nationalists.12.t:0 "Aristokratlar Reformları Memnuniyetle Karşılıyor"
 AAT_Sweden_nationalists.13.a:0 "Bu tür reformlar çok gecikmişti."
 AAT_Sweden_nationalists.13.desc:0 "Önde gelen sanayiciler, sendikaların suç sayılmasının ardından önümüzdeki yıllarda rekor kıran karlar ve temettüler bekliyorlar. Sendikaların yasaklanmasıyla, sanayiciler son yıllarda Sosyal Demokratlar tarafından yollarına konulan bürokrasiyi aşabilecek ve karşılığında ekonomik büyümeyi artırabilecekler."
 AAT_Sweden_nationalists.13.t:0 "Sanayiciler Ekonomik Reformlardan Cesaret Aldı"
 AAT_Sweden_nationalists.14.a:0 "Orduyu yanımızda tutmak her zaman bir öncelik olacaktır."
 AAT_Sweden_nationalists.14.desc:0 "Savaş bakanı, ulusun kendini savunmak için yetersiz donanımlı olduğunu uzun süredir savunan önde gelen subayların tavsiyelerine dayanarak askeri bütçenin artırılacağını duyurdu. Artan bütçeyle, ordunun yeni rejimimize olan sadakati bozulmamış görünüyor."
 AAT_Sweden_nationalists.14.t:0 "Ordu Genişleme Planlıyor"
 AAT_Sweden_nationalists.15.a:0 "Bu tür bir destek iktidardaki hakimiyetimizi sağlamlaştıracaktır."
 AAT_Sweden_nationalists.15.desc:0 "Kırsal altyapıya yapılan büyük yatırımların ardından, kırsaldaki işçiler hükümetimizin en sesli destekçilerinden bazıları haline geldi. Onların desteği ve ulusun gıda zinciri üzerindeki etkileriyle, şimdi gelecekte kentli işçileri kontrol altında tutabilecek sağlam bir destek bloğumuz var."
 AAT_Sweden_nationalists.15.t:0 "Kırsal İşçiler Destekleyici Kalmaya Devam Ediyor"
 AAT_Sweden_nationalists.16.a:0 "Sıradan halkın üstlerine saygısı yok."
 AAT_Sweden_nationalists.16.desc:0 "Bir grup anti-monarşist, bugün Kral'ın [FROM.FROM.GetName]'e yaptığı ziyareti bozmayı başardı. Polisin protestocuları kontrol altına alma çabalarına rağmen, Kral'ın arabasının planlanan rotasını ablukaya almayı başardılar ve daha tehlikeli bir duruma sürüklenme korkusuyla geziyi iptal etmek zorunda kaldılar."
 AAT_Sweden_nationalists.16.t:0 "[FROM.FROM.GetName] şehrinde Feci Kraliyet Ziyareti"
 AAT_Sweden_nationalists.17.a:0 "Destek oluşturmak için buna devam etmesi gerekiyor"
 AAT_Sweden_nationalists.17.desc:0 "[FROM.FROM.GetName]'e yapılan kraliyet ziyareti oldukça sıkıcı bir olaydı. Kral kalabalıkların kendisini karşılamak için toplanacağını umarken, sokakları sadece bir avuç destekçi doldurdu. Kral'ın durumdan son derece rahatsız ve utanmış olduğu ve gelecekte bu tür anlamsız faaliyetlere katılmayacağına yemin ettiği duyuldu."
 AAT_Sweden_nationalists.17.t:0 "[FROM.FROM.GetName] şehrinde Olayasız Kraliyet Ziyareti"
 AAT_Sweden_nationalists.18.a:0 "Bu tür bir destekle Kral'ın otoritesini yeniden tesis edebiliriz."
 AAT_Sweden_nationalists.18.desc:0 "Kral'ın [FROM.FROM.GetName]'e yaptığı bir kraliyet ziyareti, hükümdarın popülaritesine büyük bir destek oldu. Coşkulu destekçiler sokakları doldurdu, [SWE.GetAdjective] bayrakları salladı ve Kral'ın önüne çiçekler attı. Bazı muhalifler olsa da, yerel polis gücü tarafından alaydan uzak tutuldular. "
 AAT_Sweden_nationalists.18.t:0 "[FROM.FROM.GetName] şehrinde Başarılı Kraliyet Ziyareti"
 AAT_Sweden_nationalists.19.a:0 "Krala büyük ulusumuz için çok geç olmadığını göstermeliyiz."
 AAT_Sweden_nationalists.19.desc:0 "[SWE.Capital.GetCapitalVictoryPointName]'deki Kral'ın sarayında gizli bir toplantı sırasında, çeşitli milliyetçi hareketlerin liderleri, [SWE.GetName]'i eski ihtişamına geri döndürme arzularını tartışmak için hükümdarla bir araya geldi. Çeşitli hareketleri tek bir bütün halinde nasıl koordine edileceği üzerine uzun bir tartışmanın ardından, zamanı geldiğinde Kral Gustaf'ın bir kukla yerine hükümdar olarak kendini yeniden ortaya koyması gerektiğine karar verildi. Kral bu tür planlara kendini adamaktan çekiniyor, ancak siyasi işlerde daha aktif bir rol almayı kabul etti ve halk arasındaki desteği ölçmek için krallık turuyla başlıyor. "
 AAT_Sweden_nationalists.19.t:0 "Kralla Fika"
 AAT_Sweden_nationalists.2.a:0 "Hiç yoktan iyidir."
 AAT_Sweden_nationalists.2.desc:0 "[GER.GetAdjective] hükümeti, aşırı gerilmiş orduları için başka bir cephe oluşturmak istemedikleri gerekçesiyle teklifimizi reddetti. Ancak, iyi niyet göstergesi olarak bir dizi tüfek ve gönüllü gönderdiler."
 AAT_Sweden_nationalists.2.t:0 "[FROM.GetNameDefCap] Teklifi Reddediyor"
 AAT_Sweden_nationalists.20.a:0 "İyi bir plan"
 AAT_Sweden_nationalists.20.b:0 "Tüm topraklar Reich'a aittir!"
 AAT_Sweden_nationalists.20.desc:0 "Sadık bağlı devletimiz [FROM.GetName], kuzey [SOV.GetName]'deki toprakları onlara vererek sorumluluklarını genişletmemizi talep etti. Bu, işgal yükünü bağlı devletlerimize hafifletmemizi ve çabalarımızı büyük düşmana odaklamamızı sağlayacaktır."
 AAT_Sweden_nationalists.20.t:0 "[FROM.GetName] kontrolünü genişletmek istiyor"
 AAT_Sweden_nationalists.21.a:0 "Nüfuzumuz artıyor"
 AAT_Sweden_nationalists.21.desc:0 "Berlin, kuzey topraklarının daha büyük bir payını devrederek bize daha fazla sorumluluk vermeye karar verdi ve etkili bir şekilde uygun bir Reichskommissariat Nordland oluşturdu"
 AAT_Sweden_nationalists.21.t:0 "[FROM.GetName] kontrolü bize devrediyor"
 AAT_Sweden_nationalists.22.a:0 "Belki de bu bir hataydı.."
 AAT_Sweden_nationalists.22.desc:0 "Berlin, böyle büyük bir toprak değişimiyle gelen büyük sorumluluklara hazır olmadığımızı belirterek talebimizi kabul etmemeye karar verdi. Belki de bir Reichskommissariat'a çok fazla güç vermekten korkuyorlar?"
 AAT_Sweden_nationalists.22.t:0 "[FROM.GetName] teklifimizi reddediyor"
 AAT_Sweden_nationalists.23.a:0 "Bu mükemmel bir fikir"
 AAT_Sweden_nationalists.23.a_tt:0 "§Y[SWE.GetName]§! zamanı gelince hakim devletine isyan edecek ve mücadelede bize katılacak"
 AAT_Sweden_nationalists.23.b:0 "Tüm faşistler hesap vermeli"
 AAT_Sweden_nationalists.23.desc:0 "[GER.GetAdjective] kukla devleti [SWE.GetName], hakim devletinin haberi olmadan gizli bir görevle bize bir elçi gönderdi. [SWE.GetAdjective] devleti duvardaki yazıyı görüyor ve şimdi bu çatışmadan bir çıkış yolu arıyor ve bize bir teklifle geliyor. Şu anda kuvvetleri başka yerlerde meşgulken [GER.GetAdjective] anakarasını ele geçirme girişimi için büyük çaplı bir taraf değiştirme hazırlığı yapıyor, ancak bize ve hakim devletlerine karşı iki cepheli bir savaşı sürdüremeyeceklerini vurguluyorlar. Şimdilik oyunu sürdürmemizi, ancak taraf değiştirdiklerinde beyaz bir barış antlaşması imzalayıp yan yana savaşmamızı öneriyorlar.\nBazen karanlıkta bir bıçak, güpegündüz bir koçbaşından daha etkilidir."
 AAT_Sweden_nationalists.23.t:0 "Karanlıkta bir bıçak"
 AAT_Sweden_nationalists.24.a:0 "Kesinlikle umutsuz bir önlem, ama gerekli bir tane."
 AAT_Sweden_nationalists.24.desc:0 "[FROM.GetName] teklifimizi kabul etti. Zamanı geldiğinde, [GER.GetName] ülkesini birlikte devirebilmemiz için beyaz bir barış üzerinde anlaşacaklar."
 AAT_Sweden_nationalists.24.t:0 "[FROM.GetName] teklifimizi kabul ediyor"
 AAT_Sweden_nationalists.25.a:0 "Görünüşe göre yalnızız"
 AAT_Sweden_nationalists.25.desc:0 "[FROM.GetName] teklifimizi reddetti. Uzun bir atıştı, ama içinde bulunduğumuz umutsuz durum nedeniyle buna değdi"
 AAT_Sweden_nationalists.25.t:0 "[FROM.GetName] teklifimizi reddediyor"
 AAT_Sweden_nationalists.26.a:0 "Verdammt"
 AAT_Sweden_nationalists.26.desc:0 "Sabahın erken saatlerinde [FROM.GetName] ülkesindeki elçilerimizle temasımızı kaybettik ve nöbet tutan birkaç tugay da teslim olmuş gibi görünüyor. [SWE.GetAdjective] hükümetini bir açıklama için aramak sessizlikle karşılandı, şimdi asi kuklamızın bizi dışlayan daha büyük planları olduğu aşikar."
 AAT_Sweden_nationalists.26.t:0 "[FROM.GetName] isyan ediyor"
 AAT_Sweden_nationalists.27.a:0 "Harika bir fikir"
 AAT_Sweden_nationalists.27.desc:0 "Sadık bağlı devletimiz [FROM.GetName], [FIN.GetName] ülkesindeki toprakları onlara vererek sorumluluklarını genişletmemizi talep etti. Bu, işgal yükünü bağlı devletlerimize hafifletmemizi ve çabalarımızı büyük düşmana odaklamamızı sağlayacaktır."
 AAT_Sweden_nationalists.27.t:0 "[FROM.GetName], [FIN.GetAdjective] toprağında hak iddia ediyor"
 AAT_Sweden_nationalists.28.a:0 "$AAT_Sweden_nationalists.21.a$"
 AAT_Sweden_nationalists.28.desc:0 "$AAT_Sweden_nationalists.21.desc$"
 AAT_Sweden_nationalists.28.t:0 "$AAT_Sweden_nationalists.21.t$"
 AAT_Sweden_nationalists.29.a:0 "$AAT_Sweden_nationalists.22.a$"
 AAT_Sweden_nationalists.29.desc:0 "$AAT_Sweden_nationalists.22.desc$"
 AAT_Sweden_nationalists.29.t:0 "$AAT_Sweden_nationalists.22.t$"
 AAT_Sweden_nationalists.3.a:0 "Küllerimizden yeniden doğacağız, eskisinden daha güçlü!"
 AAT_Sweden_nationalists.3.desc:0 "[GER.GetAdjective] liderliği, ulusun kontrolünü sağlamada bize askeri olarak destek vermeyi kabul etti. Destekleri karşılığında, kıtadaki daha geniş etki alanlarının bir parçası olmayı kabul ettik. Umarız bir gün bizi eşit olarak görürler."
 AAT_Sweden_nationalists.3.t:0 "[FROM.GetNameDefCap] Teklifi Kabul Ediyor"
 AAT_Sweden_nationalists.30.a:0 "Aşağılık bir hile"
 AAT_Sweden_nationalists.30.desc:0 "[GER.GetAdjective] kukla devleti [SWE.GetName], Adolf Hitler'den topraklarımız üzerindeki iddialarını tanımasını istedi. Sadece her iki tarafın da dizginlenemeyen yayılmacılığına hizmet eden sahte bir iddia."
 AAT_Sweden_nationalists.30.t:0 "[FROM.GetName], [FIN.GetAdjective] toprağında hak iddia ediyor"
 AAT_Sweden_nationalists.4.a:0 "$SWE_sven_olov_lindholm$ çeşitli milliyetçi fraksiyonları birleştirebilir."
 AAT_Sweden_nationalists.4.b:0 "$SWE_birger_furugard$, [SWE.GetName]'in lideri olmaya mukadderdir."
 AAT_Sweden_nationalists.4.desc:0 "Nasyonel Sosyalist hareket, [SWE.GetName] ülkesinde iktidarı ele geçiremeyecek kadar parçalanmış durumda. Eğer bu değişecekse, hareket küçük çekişmeleri bırakmalı ve tek gerçek liderimizin arkasında toplanmalıdır."
 AAT_Sweden_nationalists.4.t:0 "Nasyonel Sosyalist Hareketi Birleştir"
 AAT_Sweden_nationalists.5.a:0 "İvme kaybediyorlar."
 AAT_Sweden_nationalists.5.desc:0 "[FROM.FROM.GetName]'deki bir Stormtrupper yürüyüşünü bozan karşı protestocuların korkuları, bugün iki grubun sokaklarda şiddetli bir şekilde çatışmasıyla doruğa ulaştı. Her iki tarafta da birçok kişi yaralandı ve öldü, ancak sonuçta kamuoyu, Stormtrupper'ın polis gelene kadar yerel bir mağazaya sığınmak zorunda kalmasıyla anti-faşistlerin tarafında gibi görünüyordu."
 AAT_Sweden_nationalists.5.t:0 "[FROM.FROM.GetName] şehrinde Feci Stormtrupper Yürüyüşü"
 AAT_Sweden_nationalists.6.a:0 "Yavaş yavaş ivme kazanıyorlar."
 AAT_Sweden_nationalists.6.desc:0 "Bugünkü [FROM.FROM.GetName]'deki Stormtrupper yürüyüşü şaşırtıcı derecede sıkıcı bir olaydı. Sadece bir avuç üye toplayabilen organizatörler, insanlar işlerine devam ederken ana caddelerden geçen derme çatma bir alayı yönettiler. Sönük katılıma rağmen, Stormtrupper'lar [SWE.GetAdjective] siyasetinin temel bir unsuru haline geliyor."
 AAT_Sweden_nationalists.6.t:0 "[FROM.FROM.GetName] şehrinde Olayasız Stormtrupper Yürüyüşü"
 AAT_Sweden_nationalists.7.a:0 "[SWE.GetName]'i yeniden inşa edecekler"
 AAT_Sweden_nationalists.7.desc:0 "Yerel polisin karşı protestocuları uzakta tutmasıyla, Stormtrupper'lar [FROM.GetName]'de büyük bir yürüyüş gerçekleştirmeyi başardı. Yerel ana caddeden geçerken, yürüyüşçüler sokakları dolduran coşkulu halk tarafından alkışlandı. "
 AAT_Sweden_nationalists.7.t:0 "[FROM.FROM.GetName] şehrinde Başarılı Stormtrupper Yürüyüşü"
 AAT_Sweden_nationalists.8.a:0 " Ulusu büyüklüğe geri döndürmek için küçük bir bedel."
 AAT_Sweden_nationalists.8.desc:0 "Aristokrasi üyeleri, ulusal meseleler üzerindeki etkilerinin seçilmiş yetkililer lehine kısıtlanmasından uzun süredir hoşnutsuzdur. Bu nedenle birçoğu, kalan kaynaklarını milliyetçi hareketimizi desteklemek için kullanmayı kabul etti. Karşılığında, hareket Riksdag'ın kontrolünü ele geçirdiğinde bazı siyasi tavizler bekleyecekler."
 AAT_Sweden_nationalists.8.t:0 "Aristokrasi Üyeleri Destek Teklif Ediyor"
 AAT_Sweden_nationalists.9.a:0 "Sendikalar ortadan kaldırılacak. "
 AAT_Sweden_nationalists.9.desc:0 " [SWE.GetAdjective] sanayisi, Sosyal-Demokratlar ve Landsorganisationen'in müdahalesi nedeniyle yabancı rakiplerle giderek daha rekabetçi hale geldi. Bu nedenle bir dizi önde gelen sanayici, sendikaları kesin olarak feshetmemiz halinde milliyetçi hareketimizi desteklemeyi kabul etti. "
 AAT_Sweden_nationalists.9.t:0 "Sanayiciler Destek Teklif Ediyor"
 AAT_Sweden_nordic_defense_council.1.a:0 "Başka planlarımız var"
 AAT_Sweden_nordic_defense_council.1.b:0 "İttifak üyesi olarak katılacağız"
 AAT_Sweden_nordic_defense_council.1.c:0 "Entegre konsey üyeleri olarak katılacağız"
 AAT_Sweden_nordic_defense_council.1.desc:0 "Dünya büyük Avrupa güçleri arasındaki kaçınılmaz çatışmaya hazırlanırken, Nordik ülkeleri yaklaşan saldırıda ezilme riskiyle karşı karşıya. [FROM.GetAdjective] hükümeti, biz Nordik ülkeleri olarak birlikte daha uyumlu bir savunma oluşturabilmemiz için birleşik bir ordu kurmamızı öneriyor."
 AAT_Sweden_nordic_defense_council.1.t:0 "İsveç bizi Nordik savunma konseyine davet ediyor"
 AAT_Sweden_nordic_defense_council.2.a:0 "Harika"
 AAT_Sweden_nordic_defense_council.2.desc:0 "[FROM.GetName] birliğimize katılmaya karar verdi. En azından şimdi, düşünülemez olan olursa yalnız değiliz."
 AAT_Sweden_nordic_defense_council.2.t:0 "[FROM.GetName] Nordik savunma birliğine katılıyor"
 AAT_Sweden_nordic_defense_council.3.a:0 "Ne yazık"
 AAT_Sweden_nordic_defense_council.3.desc:0 "[FROM.GetName], dünyadaki devam eden gerilimlere rağmen birliğimize katılmayı reddetti. Başka bir politikayı tercih ediyor gibi görünüyorlar, umarım dünya sahnesindeki duruşumuzu olumsuz etkileyecek bir politika değildir"
 AAT_Sweden_nordic_defense_council.3.t:0 "[FROM.GetName] Nordik savunma birliği teklifini reddediyor"
 AAT_Sweden_strike.1.a:0 "Şu anda beklemekten başka yapabileceğimiz bir şey yok"
 AAT_Sweden_strike.1.b:0 "İnsanların moralini yükseltmek ve bu durumu sakinleştirmek için yatırım yapmalıyız"
 AAT_Sweden_strike.1.desc:0 "Büyük Savaş sırasında yaşanan gibi bir gıda ablukası potansiyeli, [SWE.GetAdjective] iş gücü arasında protestolara yol açtı. Yerel kışkırtıcılar tarafından teşvik edilen huzursuzluk, fabrikalardan yayılarak ülke çapında bir sorun haline geldi. Durumu istikrara kavuşturmalı ve hükümetin bu belirsiz zamanlarda güçlü bir lider el olarak algılandığından emin olmalıyız."
 AAT_Sweden_strike.1.t:0 "[?SWE.GetNameDef] ülkesinde Huzursuzluk"
 AAT_Sweden_strike.2.a:0 "Akl-ı selim galip gelecektir"
 AAT_Sweden_strike.2.b:0 "Bunu derhal durdurmalıyız"
 AAT_Sweden_strike.2.desc:0 "Ne yazık ki, protestoları durdurma çabalarımız başarısız oldu. Neredeyse her fabrika işçisi, terzi ve marangoz, hükümetin politikalarını protesto etmek için sokaklarda görünüyor. Daha da kötüsü, birçok protesto hem sivillerin hem de kolluk kuvvetlerinin yaralandığı şiddet olaylarına dönüşüyor."
 AAT_Sweden_strike.2.t:0 "Ülke çapında isyanlar"
 AAT_USA_events.01.a:0 "En azından sonra geri verecekler..."
 AAT_USA_events.01.desc:0 "[USA.GetLeader] liderliğindeki [USA.GetAdjective] hükümeti, Havana Konferansı'nda kararlaştırıldığı üzere Kuzey Amerika'yı yabancı tehditlerden ve nüfuzdan koruma operasyonu olan yeni Grönland Devriyesi'nin bir parçası olarak Grönland'ın işgal edildiğini duyurdu. Dünyadaki mevcut durum sakinleştiğinde bize geri vereceklerine söz verdiler."
 AAT_USA_events.01.t:0 "[USA.GetNameDefCap] Grönland'ı İşgal Ediyor"
 AAT_USA_events.02.a:0 "En azından halkımız emin ellerde..."
 AAT_USA_events.02.desc:0 "[FROM.GetAdjective]ler, şu anda Danimarka'ya ait olan ve yüksek stratejik öneme sahip bir nokta olan Faroe Adaları'nı işgal ettiklerini belirttiler. Faroe Adaları'nı savaşın tüm şiddetinden koruyacaklarını ve adalar bize geri verilene kadar, [?DEN.DEN_overlord_nation.GetAdjective] saldırganlığı tarafından içine sürüklendikleri iğrenç esaretten kurtarılana kadar orada deniz ve hava yoluyla uygun bir şekilde yerleşeceklerini iddia ediyorlar."
 AAT_USA_events.02.t:0 "[FROM.GetNameDefCap] Faroe Adaları'nı İşgal Ediyor"
 AAT_USA_events.03.a:0 "Söz Verdik"
 AAT_USA_events.03.b:0 "Aslında fikrimizi değiştirdik"
 AAT_USA_events.03.desc:0 "[FROM.GetNameDef]'den [FROM.GetLeader], sözlerimizi tutmamızı ve kararlaştırıldığı gibi Faroe Adaları'nı, artık baskıdan kurtuldukları için onlara geri vermemizi istiyor."
 AAT_USA_events.03.t:0 "[FROM.GetName] Faroe Adaları'nı Geri İstiyor"
 AAT_USA_events.04.a:0 "Zaten onlara meydan okuyamayız"
 AAT_USA_events.04.b:0 "Hak ettiklerini bulacaklar"
 AAT_USA_events.04.desc:0 "[FROM.GetNameDef]'den [FROM.GetLeader], bir referandumdan sonra Faroe Adaları halkının açıkça [FROM.getAdjective] yönetiminden başka bir yönetim altında olmak istemediğini iddia ederek talebimizi reddetti."
 AAT_USA_events.04.t:0 "[FROM.GetName] Taleplerimizi Reddediyor"
 AAT_USA_events.05.desc:0 "[FROM.GetNameDef]'den [FROM.GetLeader], sözlerimizi tutmamızı ve kararlaştırıldığı gibi Grönland'ı, artık baskıdan kurtuldukları için onlara geri vermemizi istiyor."
 AAT_USA_events.05.t:0 "[FROM.GetName] Grönland'ı Geri İstiyor"
 AAT_USA_events.06.desc:0 "[FROM.GetNameDef]'den [FROM.GetLeader], bir referandumdan sonra Grönland halkının açıkça [FROM.getAdjective] yönetiminden başka bir yönetim altında olmak istemediğini iddia ederek talebimizi reddetti."
 AAT_USA_events.06.t:0 "[FROM.GetName] Taleplerimizi Reddediyor"
 AAT_USA_events.07.a:0 "Grönland Geri Dönüyor!"
 AAT_USA_events.07.b:0 "Faroe Adaları Geri Dönüyor!"
 AAT_USA_events.07.desc:0 "[FROM.GetNameDef]'den [FROM.GetLeader] sözünü tuttu ve emanet olarak tuttukları toprakları, artık baskıdan kurtulduğumuz için geri vermeyi kabul etti."
 AAT_USA_events.07.t:0 "[FROM.GetName] Toprakları İade Ediyor"
 AAT_USA_events.08.a:0 "Toprakları iade edin"
 AAT_USA_events.08.b:0 "Zalimlere boyun eğmeyeceğiz!"
 AAT_USA_events.08.desc:0 "[FROM.GetNameDef]'den [FROM.GetLeader], yasa dışı olarak tutulan Danimarka toprağını hak sahibine iade etme talebi gönderdi."
 AAT_USA_events.08.t:0 "[FROM.GetNameDefCap] Danimarka Toprağı Talep Ediyor"
 AAT_USA_events.09.a:0 "Ne kadar düşünceli"
 AAT_USA_events.09.desc:0 "[FROM.GetNameDef]'den [FROM.GetLeader], yasa dışı olarak tutulan Danimarka toprağını hak sahibine iade etmeyi kabul etti."
 AAT_USA_events.09.t:0 "[FROM.GetNameDefCap] Danimarka Toprağını İade Ediyor"
 AAT_britain_narvik.1.a:0 "Çekil"
 AAT_britain_narvik.1.b:0 "Seferberliğe devam et"
 AAT_britain_narvik.1.desc:0 "[SWE.GetAdjective] madenlerini başarıyla havaya uçurduk ve [GER.GetNameDef]'i en önemli ithalat kaynaklarından birinden mahrum bıraktık. Bu girişimin ana motivasyonu olarak [FIN.GetName]'a yardım vaadine rağmen, [SOV.GetNameDef] ile doğrudan çatışmaya girmek hiçbir zaman gerçekten bir olasılık değildi ve ana düşmanımıza büyük bir darbe vurduk. [SWE.GetNameDefCap]'te gerçek bir düşmanımız yok ve şimdi ne yapacağımıza karar vermemiz gerekiyor."
 AAT_britain_narvik.1.t:0 "[SWE.GetAdjective] madenleri havaya uçuruldu"
 AAT_britain_narvik.2.a:0 "Buna nasıl cüret ederler?!"
 AAT_britain_narvik.2.b:0 "Onları durdurmalıyız!"
 AAT_britain_narvik.2.desc:0 "[ENG.GetAdjective] birlikleri [SWE.GetName]'a sınırı geçti. [ENG.GetAdjective] hükümetinden savaş ilanı olmaksızın sessizlik sürerken, [SWE.GetAdjective] yetkilileri [SWE.GetAdjective] egemenliğine saygı gösterilmemesine öfkelidir. Bunun en olası açıklaması, [ENG.GetAdjective] birliklerinin Gällivare ve Kiruna'daki madenlere ulaşarak yüksek dereceli cevherin [GER.GeName]'e ulaşmasını önlemek için onları sabote etmeye çalıştığıdır, ki bu hem [GER.GetAdjective] hem de [SWE.GetAdjective] ekonomilerine büyük bir darbe ve [SWE.GetAdjective] tarafsızlığının büyük bir ihlali olur."
 AAT_britain_narvik.2.t:0 "[ENG.GetName], [SWE.GetName]'ı işgal ediyor"
 AAT_britain_narvik.3.a:0 "Bu bir rezalet"
 AAT_britain_narvik.3.desc:0 "[ENG.GetNameDefCap], [SWE.GetName]'ı yasadışı bir şekilde işgal etti ve uygun bir savaş ilanı olmadan madenlerini yok etti. [SWE.GetAdjective] ekonomisinin kilit bir ekonomik motoru şimdi sadece harap bir taş ocağı. [ENG.GetAdjective] hükümeti, [GER.GetNameDefCap] ile ticaret yapmanın onlarla aynı safta yer almak kadar kötü olduğunu ve eylemlerin haklı olduğunu savunarak eylemlerini savundu, ancak kendi iç halkının bile hükümetlerinin açıklamasından rahatsız olduğu görülüyor."
 AAT_britain_narvik.3.t:0 "[ENG.GetName], [SWE.GetAdjective] madenlerini sabote ediyor"
 AAT_britain_narvik.4.a:0 "Bu hala bir rezalet"
 AAT_britain_narvik.4.desc:0 "[ENG.GetName], [SWE.GetName]'daki stratejik hedefinin başarıldığını ve birliklerini çektiğini duyurdu. Hükümeti ayrıca, [SWE.GetAdjective] devletine karşı gerçek bir düşmanlığı olmadığını ve [SWE.GetName]'daki eyleminin tamamen demokrasinin savunulması çıkarına olduğunu yineler. Hem [GER.GetAdjective] hem de [SWE.GetAdjective] büyükelçiliği bir protesto mektubu teslim etti; [GER.GetAdjective] tarafı [ENG.GetName]'ın tarafsızlığı ihlal ettiğini ve bir savaş bölgesinde yabancı bir ulusu işgal ettiğini savunurken, [SWE.GetAdjective], [ENG.GetAdjective] hükümetini [FIN.GetName]'a yardım etme konusundaki yüce hedeflerine rağmen, şimdi kendi amaçlarına ulaşmak için kötü kurgulanmış bir hile olduğu ve bunun [SWE.GetAdjective] hayatlarına mal olduğu açıkça görülmektedir."
 AAT_britain_narvik.4.t:0 "[ENG.GetName], [SWE.GetName]'dan çekiliyor"
 AAT_finland_continuation_war.01.a:0 "Elbette, sadece bu anlaşmanın hiçbir kaydı olmadığından emin olun!"
 AAT_finland_continuation_war.01.b:0 "[FROM.GetAdjective] önemsiz işleri bizi ilgilendirmez."
 AAT_finland_continuation_war.01.desc:0 "[FROM.GetName]'ın yönetici çevresinin üyeleri, Doğudaki [SOV.GetAdjective] tehdidine karşı askeri işbirliği olasılığı konusunda bizimle temasa geçti. Teklifleri, birbirimizin sınırlarını korumamız ve [SOV.GetAdjective] topraklarına yapılacak herhangi bir saldırgan müdahalede birlikte çalışmamız koşuluyla [FROM.GetName] içinde askeri varlıkların konuşlandırılmasına izin verecektir."
 AAT_finland_continuation_war.01.t:0 "Devam Savaşı için [FROM.GetAdjective] Teklifi"
 AAT_finland_continuation_war.01.t.2:0 "[FROM.GetAdjective] Finno-[SOV.GetAdjective] Savaşı Önerisi"
 AAT_finland_continuation_war.02.a:0 "Bu anlaşmanın hiçbir kaydı olmadığından emin olun!"
 AAT_finland_continuation_war.02.desc:0 "[FROM.GetLeader], [SOV.GetNameDef]'e karşı askeri işbirliği teklifimiz için [FROM.GetLeader.GetHerHis] onay mührünü verdi. Silahlı kuvvetlerimizden subaylar şimdi birleşik kuvvetlerimizin koordinasyonuna başlamak üzere [FROM.Capital.GetCapitalVictoryPointName]'a davet ediliyor."
 AAT_finland_continuation_war.02.t:0 "Devam Savaşı için Fin-[FROM.GetAdjective] Paktı"
 AAT_finland_continuation_war.02.t.2:0 "Finno-[FROM.GetAdjective] Savaşı için Finno-[SOV.GetAdjective] Paktı"
 AAT_finland_continuation_war.03.a:0 "Ne kadar boşa harcanmış bir fırsat..."
 AAT_finland_continuation_war.03.desc:0 "[FROM.GetLeader] aptalca bir şekilde askeri işbirliği teklifimizi reddetti. Belki de [FROM.GetAdjective]ler, [SOV.GetAdjective]lerle mevcut olan kırılgan anlaşmaları riske atmak istemiyorlardır, ama bu aynı zamanda bizim için alternatif planları olduğunun da bir göstergesi olabilir. Her iki durumda da, dikkatli ilerlemeli ve potansiyel destek için başka yerlere bakmaya başlamalıyız."
 AAT_finland_continuation_war.03.t:0 "[FROM.GetName] Teklifimizi Reddediyor"
 AAT_finland_continuation_war.04.a:0 "Bunun üstesinden geleceğiz."
 AAT_finland_continuation_war.04.desc:0 "[FROM.GetNameDef] ile [SOV.GetNameDef]'e karşı işbirliği planlarımız, jeo-politikteki son değişim nedeniyle şimdi paramparça oldu. Ortak operasyonlar için planlar oluşturmak için büyük çaba sarf etmiştik, ama şimdi hem askeri hem de dış politika açısından başa dönmek zorunda kalacağız."
 AAT_finland_continuation_war.04.t:0 "Devam Savaşı Paktı Bozuldu"
 AAT_finland_continuation_war.04.t.2:0 "Finno-[SOV.GetAdjective] Savaşı İçin Anlaşma Bozuldu"
 AAT_finland_continuation_war.05.a:0 "Silah arkadaşlarımıza katılalım!"
 AAT_finland_continuation_war.05.desc:0 "Dikkatli diplomatik manevralarımızın ve askeri planlamamızın meyveleri, [GER.GetNameDef]'in nihayet [SOV.GetNameDef]'in işgali olan Barbarossa Harekatı'nı başlatmasıyla ortaya çıkıyor. Şimdi taahhütlerimizi yerine getirmeli ve planın bizim payımıza düşen kısmını uygulamalıyız."
 AAT_finland_continuation_war.05.t:0 "[FIN.GetAdjective] Devam Savaşı"
 AAT_finland_continuation_war.05.t.2:0 "Finno-[SOV.GetAdjective] Savaşı"
 AAT_finland_continuation_war.06.a:0 "Zafer yakındır!"
 AAT_finland_continuation_war.06.desc:0 "[FIN.GetAdjective] askeri kuvvetleri, işbirliği anlaşmamıza uygun olarak [SOV.GetAdjective] mevzilerine karşı planlı saldırılarını başlattı. [FIN.GetAdjective] silah arkadaşlarımızın yardımıyla, Sovyet cephesini daha da geniş bir alana yayarak onları kırılma noktasına getirmeyi başardık."
 AAT_finland_continuation_war.07.a:0 "Tıpkı korktuğumuz gibi..."
 AAT_finland_continuation_war.07.desc:0 "[GER.GetNameDef] ve [FIN.GetNameDef]'in birbiriyle işbirliği yapmasını engellemek için gösterdiğimiz tüm diplomatik çabalara rağmen, çabalarımız boşa çıkmış görünüyor. [FIN.GetAdjective] ordusu, [GER.GetAdjective]lerle birlikte bize karşı o kadar hassas saldırılar başlattı ki, bu operasyonu uzun bir süredir koordine ediyor olmalılar."
 AAT_finland_continuation_war.08.a:0 "Moskova Mütarekesi'ni imzalayalım"
 AAT_finland_continuation_war.08.b:0 "Bu sefer kolay kurtulamayacaklar!"
 AAT_finland_continuation_war.08.desc:0 "[FROM.GetNameDef]'deki hükümet, bize daha fazla toprak tavizi ve [GER.GetNameDef] ile tüm ilişkileri kesme sözü vererek onlarla bir mütareke imzalamamızı talep etti. Bunu kabul ederek, dikkatimizi tamamen [GER.GetAdjective]lere odaklayabilir ve onları geldikleri yere geri püskürtebiliriz."
 AAT_finland_continuation_war.08.t:0 "[FROM.GetName] Mütareke İstiyor"
 AAT_finland_continuation_war.09.a:0 "Kader tarafından terk edildik!"
 AAT_finland_continuation_war.09.desc:0 "[FROM.GetNameDef]'den [FROM.GetLeader] talebimizi reddetti ve kendimizi yıkıma hazırlamamız gerektiğini, çünkü [FROM.GetAdjective] ordusunun bu sefer bizi kolay bırakmayacağını belirtti. Bu en kötü senaryo!"
 AAT_finland_continuation_war.09.t:0 "[FROM.GetNameDef] Barış Teklifimizi Reddediyor"
 AAT_finland_continuation_war.10.a:0 "Uymalıyız, yoksa başımıza başka bir savaş açarız"
 AAT_finland_continuation_war.10.desc:0 "Sovyet temsilcileri, mütarekeye uymadığımızı fark ettiler, çünkü açıkça herhangi bir düşman birliğini kovmamız gerektiğini belirtiyor ve [GER.GetAdjective]ler, Birliğe teslim etmek zorunda olduğumuz silahlarımızı ve kaynaklarımızı çekiyor. Birliklerimiz [GER.GetAdjective] askerlerini silahsızlandırmaya çalışmaya başladığında, çatışmalar başladı ve [GER.GetAdjective]ler toprağımızı yakıp sularımızı mayınlıyor."
 AAT_finland_continuation_war.10.t:0 "Sovyetler Bizi [GER.GetAdjective] Birliklerini Kovmaya Zorluyor"
 AAT_finland_continuation_war.11.a:0 "Birke Harekatı'nı başlatın"
 AAT_finland_continuation_war.11.b:0 "Nordlicht Harekatı'nı başlatın"
 AAT_finland_continuation_war.11.desc:0 "Başlangıçta tereddütlü olmalarına rağmen, [FIN.GetAdjective] hükümeti şimdi Sovyetlerin baskısı altında orada konuşlanmış askerlerimizi kovmaya ve silahsızlandırmaya başladı. Subaylarımız bu nedenle tam da bu senaryo için hazırlanan planları başlatmaya başladılar, ancak hangi yinelemeye devam edecekleri konusunda tereddütlüler. Daha önemli olan ne?"
 AAT_finland_continuation_war.11.t:0 "Subaylarımız [FIN.GetNameDef]'den Çekilmeye Başlıyor"
 AAT_finland_continuation_war.12.a:0 "Pekala, umarım [SOV.GetLeader] için sorun olmaz..."
 AAT_finland_continuation_war.12.b:0 "Sovyetler Birliği'ni kışkırtma riskini alamayız!"
 AAT_finland_continuation_war.12.desc:0 "[FIN.GetNameDef]'den [FIN.GetLeader] bugün bize çok ilginç bir teklifle yaklaştı. [FIN.GetName]'ın, savaşın giderek aleyhlerine dönmesiyle [SOV.GetNameDef] ile savaşlarını bitirmeye hazır olduğunu iddia ediyor ve Petsamo'ya çıkmamıza izin vermeyi, [GER.GetAdjective]leri İskandinavya'dan ortaklaşa atmak ve [GER.GetNameDef]'i sonsuza dek bitirmek için ittifakımıza katılmayı teklif etti. Ne diyoruz?"
 AAT_finland_continuation_war.12.t:0 "[FIN.GetName] Taraf Değiştirmek İstiyor"
 AAT_finland_continuation_war.13.a:0 "Pekala, ama sadece tazminat alırsak"
 AAT_finland_continuation_war.13.desc:0 "Görünüşe göre [FIN.GetNameDef]'den temsilciler büyük demokrasilere yaklaşarak, [GER.GetAdjective]lere karşı savaşlarında onlara katılmayı teklif ederek bize karşı savaştan sıyrılmaya çalışıyorlar, esasen taraf değiştiriyorlar. Eğer Müttefikler bunu kabul ederse, şikayet etmek ve tazminat talep etmekten başka yapabileceğimiz pek bir şey olmazdı, ama en azından faşizme karşı mücadelemizde yeni bir ortak anlamına gelirdi."
 AAT_finland_continuation_war.13.t:0 "[FIN.GetName] Müttefiklere Katılmak İstiyor"
 AAT_finland_diplomacy.01.a:0 "İyi bir fikir gibi görünüyor!"
 AAT_finland_diplomacy.01.b:0 "Özerkliğimizi korurken işbirliği yapabiliriz."
 AAT_finland_diplomacy.01.c:0 "İlgilenmiyorum."
 AAT_finland_diplomacy.01.desc:0 "Karşılıklı koruma ve refah amacıyla ulusal birleşme fikrini gündeme getiren [FROM.GetNameDef] diplomatları tarafından ziyaret edildik. Bu, güvenliğimizi tehdit edebileceklere karşı daha güçlü, daha birleşik bir cephe sunmak için hükümetlerimizi, ordularımızı ve endüstrilerimizi birleştirmek anlamına gelecektir. \n\nBu uluslararası istikrarsızlık zamanında bir araya gelmenin bir yararı olabilir, ancak seçim nihayetinde bize aittir."
 AAT_finland_diplomacy.01.t:0 "[FROM.GetAdjective]'den Birleşme Teklifi"
 AAT_finland_diplomacy.02.a:0 "Birlikte daha güçlüyüz!"
 AAT_finland_diplomacy.02.desc:0 "Muzaffer diplomatlarımız [FROM.capital.GetCapitalVictoryPointName]'daki görevlerinden döndüler ve yanlarında [FROM.GetName]'ın karşılıklı rakiplerimize karşı daha birleşik bir cephe sunma ihtiyacını gördüğü ve bu nedenle birlik teklifimizin kabul edildiği haberini getirdiler. \n\nHükümet yetkilileri, bu yeni toprakların sorunsuz entegrasyonu için düzenlemeler yapmak üzere başkentimize doğru yola çıktılar."
 AAT_finland_diplomacy.02.t:0 "[FROM.GetAdjective]-[ROOT.GetAdjective] Birliği"
 AAT_finland_diplomacy.03.a:0 "Yeterince iyi..."
 AAT_finland_diplomacy.03.desc:0 "Diplomatlarımız [FROM.GetName]'daki görevlerinden döndüler ve daha birleşik bir cephe ihtiyacı kabul edilmekle birlikte, bunu yapmak için tüm egemenliklerinden vazgeçmeye istekli değillerdi. Görüşmeler ilk başta iyi gitti, ancak [FROM.GetName]'ın tarihi bağımsızlık mücadeleleri göz önüne alındığında, [GetDiplomacyDescriptionNiceNotNice] \n\nBirlik yerine, ittifakımıza bağımsız bir devlet olarak katılmaya karar verdiler."
 AAT_finland_diplomacy.03.t:0 "[FROM.GetName], [ROOT.GetFactionName]'na Katılıyor"
 AAT_finland_diplomacy.04.a:0 "Kararlarına saygı duyacağız."
 AAT_finland_diplomacy.04.b:0 "Kaderlerini seçtiler."
 AAT_finland_diplomacy.04.desc:0 "Diplomatlarımız [FROM.GetName]'daki görevlerinden döndüler, ancak görünüşe göre [FROM.GetAdjective] hükümetini birlikte durmanın mantığını görmeye ikna edemediler. Kararları için çok az neden verildi ve yetkililerimiz bunun yansımalarının ne olacağını merak ederek kaldılar. \n\nBelki de niyetleri kötü niyetli olursa kendi savunmalarımıza bakmaya başlamalıyız veya belki de onların... işbirliğini sağlamak için kendi imkanlarımıza bakmalıyız."
 AAT_finland_diplomacy.04.t:0 "[FROM.GetName] Teklifimizi Reddediyor"
 AAT_finland_diplomacy.05.a:0 "Asil bir amaç için bir fedakarlık!"
 AAT_finland_diplomacy.05.b:0 "[FROM.GetAdjective] liderliği aklını kaçırmış."
 AAT_finland_diplomacy.05.desc:0 "Görünüşe göre [FROM.GetName], Kuzey Avrupa'nın yerli topluluğu olan Sámi halkının özgürlüğünü ve kültürünü korumayı kendi üzerine almış. \n\n[FROM.GetNameDefCap], geleneksel olarak Sámi halkının elinde bulunan toprakları onlara bırakmamız için bize dilekçe veriyor, böylece bu grubu birleşik bir halk olarak daha iyi koruyabilirler."
 AAT_finland_diplomacy.05.t:0 "[FROM.GetAdjective]'den Sápmi'nin Korunması İçin Dilekçe"
 AAT_finland_diplomacy.06.a:0 "Halk [FROM.GetLeader]'ın kararını övüyor"
 AAT_finland_diplomacy.06.desc:0 "Mükemmel haber! [FROM.GetNameDefCap], Sámi halkının tarihi anavatanlarını bizim himayemize emanet etmeyi kabul etti. Artık bu toprakların halkını korumak ve beslemek bizim sorumluluğumuzda olacak. Sámi liderlerinden, kültürlerine ve geleneklerine saygıyla davranmaya devam edeceğimize dair umutlarını da pekiştiren tebrik mektupları aldık."
 AAT_finland_diplomacy.06.t:0 "[FROM.GetAdjective]'den Sámi Topraklarının Terki"
 AAT_finland_diplomacy.07.a:0 "Bu konuda yapabileceğimiz hiçbir şey yok."
 AAT_finland_diplomacy.07.b:0 "Sámi halkına göz kulak olmalıyız!"
 AAT_finland_diplomacy.07.desc:0 "[From.GetNameDef]'in emperyalistleri, Sámi halkının topraklarını birleştirme yönündeki aydınlanmış dilekçemizi reddettiler. Resmi yanıtlarında, yerel halkın kültürünü ve onurunu koruma niyetimizle ilgili endişelerini dile getiriyorlar, ancak bu reddin arkasındaki asıl motivasyonun ülkelerini haritada daha büyük göstermek olduğunu anlıyoruz."
 AAT_finland_diplomacy.07.t:0 "[FROM.GetName] Dilekçemizi Reddediyor"
 AAT_finland_diplomacy.08.a:0 "Taleplerine karşı koyacak gücümüz yok."
 AAT_finland_diplomacy.08.b:0 "Bu topraklar üzerindeki [ROOT.GetAdjective] egemenliğini savunacağız."
 AAT_finland_diplomacy.08.desc:0 "[FROM.GetNameDefCap], demir cevheri üretimimiz konusunda bize baskı yapıyor. Artan küresel gerilimlerden endişe duyuyorlar ve kendilerini İskandinavya'daki en yetenekli askeri ulus olarak görüyorlar. Bu nedenle, hem onları koruyabilmeleri hem de barındırdıkları kaynakların savaş çabaları için en iyi şekilde kullanılabilmesi için kaynak zengini kuzey eyaletlerinin kontrolünü talep ettiler."
 AAT_finland_diplomacy.08.t:0 "[FROM.GetAdjective] Demir Cevheri Akışını Kontrol Etme Baskısı"
 AAT_finland_diplomacy.09.a:0 "[FROM.GetAdjective] liderliği halkı için en iyisini yaptı."
 AAT_finland_diplomacy.09.desc:0 "[From.GetName]'ın kaynak zengini eyaletlerinin doğrudan kontrolünü bize vermeye akıllıca karar verdiği haberini aldık. Ordumuz bölgeyi garnizonlamak için hazırlanıyor ve sanayi liderlerimiz bölgeden sağlanan hammaddeleri kendi üretim sistemlerimize en iyi nasıl dahil edeceklerine dair planlar hazırlamaya başladılar."
 AAT_finland_diplomacy.09.t:0 "[FROM.GetName] Talep Edilen Toprakları Teslim Ediyor"
 AAT_finland_diplomacy.10.a:0 "O kadar dar görüşlüler ki vahim hatalarını göremiyorlar."
 AAT_finland_diplomacy.10.b:0 "Zorla kontrolü ele almamız gerekecek, birlikleri seferber edin!"
 AAT_finland_diplomacy.10.desc:0 "Maalesef, görünüşe göre [FROM.GetAdjective] lideri [FROM.GetLeader] çok dar görüşlü ve İskandinavya'nın zenginliğini kendileri için ele geçirmeyi planlayan çakallar hakkında endişelenmiyor. [FROM.GetLeader.GetHerHis] hükümetinden, birliklerimizin sınırımızın bizim tarafımızda kalması gerektiğine ve ayrıca bu konuda devam eden baskıya karşı uyardıklarına dair kesin terimlerle haber aldık. \n\nTabii ki kendi hedeflerimiz değişmedi ve iddia ettiklerinin aksine, kendi güvenliğimizi ve bölgedeki herkesin güvenliğini sağlamak için mevcut hammaddelere hala ihtiyacımız var."
 AAT_finland_diplomacy.10.t:0 "[FROM.GetName] Taleplerimizi Reddediyor"
 AAT_finland_diplomacy.11.a:0 "Bu asil amaç için [ROOT.GetAdjective] topraklarından vazgeçeceğiz."
 AAT_finland_diplomacy.11.b:0 "[ROOT.GetAdjective] toprağı [ROOT.GetAdjective] olarak kalacak!"
 AAT_finland_diplomacy.11.desc:0 "[FIN.GetAdjective] ulusu genç ve halkı dağınık ve birçok farklı ulusun sınırları içinde yaşıyor. Fin halkından daha fazlasını birleştirmek amacıyla, şimdi bize Doğu Karelya ve Kola Yarımadası'nı [FIN.GetAdjective] ulusuna entegre etme talebiyle yaklaştılar."
 AAT_finland_diplomacy.11.t:0 "Kola ve Karelya'nın Entegrasyonu için [FROM.GetAdjective] Teklifi"
 AAT_finland_diplomacy.12.a:0 "[FROM.GetLeader], Kola ve Karelya halkı için en iyisini yaptı."
 AAT_finland_diplomacy.12.desc:0 "Büyük [FROM.GetLeader], Doğu Karelyalılarla birleşme teklifimizi kabul etti ve bölgedeki topraklarını bize devretti. Büyük [FROM.GetAdjective] halkı Finlerin iyi bir dostudur!"
 AAT_finland_diplomacy.12.t:0 "[FROM.GetName] Toprak Taleplerimizi Kabul Ediyor"
 AAT_finland_diplomacy.13.a:0 "Şu anda [FROM.GetLeader]'ı karşımıza alamayız..."
 AAT_finland_diplomacy.13.b:0 "Ahmak bunun bedelini ödeyecek!"
 AAT_finland_diplomacy.13.desc:0 "[FROM.GetLeader], Doğu Karelya topraklarını bize devretmeyeceklerini açıkladı ve toprak talebimizin karşılığında onlara hiçbir şey vermeyeceğini ve sadece bölgede yaşayan [FROM.GetAdjective] halkına yıkım getireceğini iddia etti."
 AAT_finland_diplomacy.13.t:0 "[FROM.GetLeader] Taleplerimizi Reddediyor"
 AAT_finland_diplomacy.14.a:0 "Eğer öyle diyorlarsa..."
 AAT_finland_diplomacy.14.b:0 "Kim olduklarını sanıyorlar?"
 AAT_finland_diplomacy.14.desc:0 "Hakim devletimiz [FIN.GetNameDef], uluslarına tam olarak entegre olmamızı talep etti. Baltık topraklarını kendilerinin olarak iddia ediyorlar ve bölgeciliğimizin nihayetinde krallıklarının istikrarsızlaşmasına yol açacağını iddia ediyorlar."
 AAT_finland_diplomacy.14.t:0 "[ROOT.GetName]'ın Entegrasyonu için [FROM.GetAdjective] Talepleri"
 AAT_finland_diplomacy.15.a:0 "Akıllıca Seçim"
 AAT_finland_diplomacy.15.desc:0 "[FROM.GetAdjective] hükümeti, devletimize entegre olma teklifimizi kabul etti ve yasalarını bağımsız bir ülke yerine özerk bir bölge için çalışacak şekilde yeniden düzenlemeye başladı."
 AAT_finland_diplomacy.15.t:0 "[FROM.GetName], [ROOT.GetNameDef]'in Bir Parçası Oluyor"
 AAT_finland_diplomacy.16.a:0 "Kararlarına saygı duyacağız"
 AAT_finland_diplomacy.16.b:0 "Kendilerini rezil ediyorlar!"
 AAT_finland_diplomacy.16.desc:0 "[FROM.GetAdjective] hükümeti, yeni tekliflerimizin uluslarımız arasında daha önce imzalanan anlaşmalara aykırı olduğunu belirtti ve yeni birleşme fikirlerimizin yasadışı ve adaletsiz olduğunu belirtirken uluslararası hukuka atıfta bulundu."
 AAT_finland_diplomacy.16.t:0 "[FROM.GetAdjective] Liderliği Taleplerimizi Reddediyor"
 AAT_finland_diplomacy.17.a:0 "Elbette"
 AAT_finland_diplomacy.17.b:0 "Kafaları çok büyüdü"
 AAT_finland_diplomacy.17.desc:0 "[FIN.GetNameDefCap], geleneksel [GetBalticOrNordic] ülkelerinde sahip olduğumuz tüm toprakları, büyük [FIN.GetAdjective] halklar federasyonunun bir parçası olarak [GetBalticOrNordic] bölgesini elinde tutma ve koruma yeni gündemlerinin bir parçası olarak onlara devretmemizi talep etti."
 AAT_finland_diplomacy.17.t:0 "[GetBalticOrNordic] Toprakları için [FROM.GetAdjective] Talepleri"
 AAT_finland_diplomacy.18.a:0 "Doğru seçimi yaptılar"
 AAT_finland_diplomacy.18.desc:0 "[FROM.GetLeader], iddialarımıza itiraz etme zahmetine değmeyeceğini düşündükleri için [GetBalticOrNordic] topraklarını bize devretmeyi akıllıca kabul etti."
 AAT_finland_diplomacy.18.t:0 "[FROM.GetName] [GetBalticOrNordic] Topraklarını Devrediyor"
 AAT_finland_diplomacy.19.a:0 "Bu konuda yapılabilecek bir şey yok"
 AAT_finland_diplomacy.19.b:0 "Geldiğimizi bilsinler"
 AAT_finland_diplomacy.19.desc:0 "[FROM.GetLeader], [GetBalticOrNordic] topraklarını bize devretmeyi reddetti ve bölge üzerinde herkesten daha güçlü bir iddiamız olmadığını açıkça belirtti. Bu utanç verici karara nasıl yanıt vermeliyiz?"
 AAT_finland_diplomacy.19.t:0 "[FROM.GetAdjective] Hükümeti Taleplerimizi Reddediyor"
 AAT_finland_diplomacy.20.a:0 "Bundan bir zarar gelmez"
 AAT_finland_diplomacy.20.b:0 "Onlar için ne planladığımızı bilmiyorlar"
 AAT_finland_diplomacy.20.desc:0 "[FIN.GetLeader], uluslarımız arasında bir saldırmazlık ve daimi barış paktı imzalamamızı istedi. Bu teklif, [FIN.GetAdjective] hükümetinin komşularıyla uzlaşmak ve ulusumuza yeniden yaklaşmak için yeni bir yöneliminin bir parçası olarak geliyor."
 AAT_finland_diplomacy.20.t:0 "Fin-[ROOT.GetAdjective] Paktı için [FROM.GetAdjective] Teklifi"
 AAT_finland_diplomacy.21.a:0 "Bizi daha parlak bir gelecek bekliyor"
 AAT_finland_diplomacy.21.desc:0 "[FROM.GetNameDef]'in büyük [FROM.GetLeader]'ı, önümüzdeki yıllar boyunca uluslarımız arasında daimi ve uzun süreli barış için çalışmaya yemin etti. Onlar gerçekten [FIN.GetAdjective] halkının büyük bir dostu."
 AAT_finland_diplomacy.21.t:0 "[FROM.GetName], Fin-[FROM.GetAdjective] Paktı İmzalamayı Kabul Ediyor"
 AAT_finland_diplomacy.22.a:0 "Buna nasıl cüret ederler!"
 AAT_finland_diplomacy.22.desc:0 "Güvenilmez [FROM.GetLeader], uluslarımız arasında barışı garanti edemeyeceklerini belirtti, açıkça ulusumuza karşı bir tür saldırı planlıyor, bunun için kendimizi olabildiğince hazırlamalıyız."
 AAT_finland_diplomacy.22.t:0 "[FROM.GetLeader], Fin-[FROM.GetAdjective] Paktı Teklifimizi Reddediyor"
 AAT_finland_diplomacy.23.a:0 "Onları kanatlarımızın altına alacağız"
 AAT_finland_diplomacy.23.b:0 "Ve bunu neden yapalım?"
 AAT_finland_diplomacy.23.desc:0 "[FROM.GetNameDef]'den [FROM.GetLeader], [SOV.GetNameDef] tarafından olası herhangi bir saldırıya karşı savunmada onlara yardım etmemizi istedi. Yakında saldırıya uğrayabileceklerinin farkında olduklarını ve böyle bir gün gelirse hayatta kalmak için tek umutlarının biz olduğumuzu belirtiyorlar."
 AAT_finland_diplomacy.23.t:0 "[FROM.GetNameDefCap], [SOV.GetNameDef]'e Karşı Koruma Arıyor"
 AAT_finland_diplomacy.24.a:0 "Kurtarıcılarımız"
 AAT_finland_diplomacy.24.desc:0 "[FROM.GetAdjective] hükümeti talebimizi kabul etti ve [SOV.GetAdjective] tarafından yapılacak herhangi bir saldırı durumunda bizi korumaya yemin etti. Nihayet rahat bir nefes alabiliriz."
 AAT_finland_diplomacy.24.t:0 "[FROM.GetAdjective] Hükümeti, [ROOT.GetNameDef]'i Korumaya Yemin Ediyor"
 AAT_finland_diplomacy.25.a:0 "Kader tarafından terk edildik!"
 AAT_finland_diplomacy.25.desc:0 "[FROM.GetAdjective] hükümeti, [SOV.GetAdjective]'lerden korunma talebimizi reddetti. Korktuğumuz senaryo gerçekleştiği için, savunmalarımızı mümkün olduğunca kararlılıkla savunmak için hazırlamalıyız."
 AAT_finland_diplomacy.25.t:0 "[FROM.GetNameDef] Koruma Talebimizi Reddediyor"
 AAT_finland_diplomacy.26.a:0 "Onların yardımına koşacağız!"
 AAT_finland_diplomacy.26.b:0 "Bizim sorunumuz değil."
 AAT_finland_diplomacy.26.desc:0 "[FIN.GetNameDef]'den [FIN.GetLeader], Rus iç savaşından bu yana ilk kez komşularını yeniden gözüne kestirmeye başlayan [SOV.GetNameDef]'den korunma arıyor. Bu tehdide karşı koruma karşılığında, bize çeşitli [FIN.GetAdjective] doğal kaynaklarının haklarını ödemeyi teklif ediyorlar."
 AAT_finland_diplomacy.26.t:0 "[FROM.GetName], [ROOT.GetAdjective] Koruması Arıyor"
 AAT_finland_diplomacy.27.a:0 "Birlikte duracağız!"
 AAT_finland_diplomacy.27.desc:0 "[GER.GetNameDefCap], koruma karşılığında kaynak alışverişi teklifimizi kabul etti ve savaş bizi seçerse yardımımıza geleceğine söz verdi. Halkımız nihayet rahat bir nefes alabilir, çünkü gelecekleri artık çok daha güvenli."
 AAT_finland_diplomacy.27.t:0 "[FROM.GetNameDefCap] Bizi Koruyacak"
 AAT_finland_diplomacy.28.a:0 "O zaman kendi başımızayız!"
 AAT_finland_diplomacy.28.desc:0 "[GER.GetNameDef]'in hain [GER.GetLeader]'ı, koruma karşılığında kaynak teklifimizi reddetti ve böylece geleceğimizi bir hevesle mahvetti. Bencil egoist doğalarının gelecekte onlara nasıl hizmet edeceğini göreceğiz."
 AAT_finland_diplomacy.28.t:0 "[ROOT.GetName], [FROM.GetAdjective] Korumasına Güvenemez"
 AAT_finland_diplomacy_baltic:0 "Baltık"
 AAT_finland_diplomacy_nordic:0 "İskandinav"
 AAT_finland_kinship_war.01.a:0 "Herhangi bir isyancıyla başa çıkılacaktır!"
 AAT_finland_kinship_war.01.desc:0 "Karelya'da artan Sovyet karşıtı duyarlılığın ortasında, oradaki sadık vatandaşlarımız Heimosodat (Akrabalık Savaşları) ve Doğu Karelya Ayaklanması'nın tekrarına doğru gidiyor olabileceğimizden korktuklarını dile getirdiler. Amaç ister bağımsız bir Karelya, ister birleşik bir Fin halkı, ister basit bir kabilecilik, hatta Fin emperyalist hayalleri olsun, Fin kışkırtıcılığının sorumlu olduğu açıktır."
 AAT_finland_kinship_war.01.t:0 "Doğu Karelya'da [FROM.GetAdjective] Kışkırtıcıları"
 AAT_finland_kinship_war.02.a:0 "Karelyalı kardeşlerimizi tamamen destekliyoruz!"
 AAT_finland_kinship_war.02.b:0 "Fin kışkırtıcıların sınırı geçmesine izin vereceğiz."
 AAT_finland_kinship_war.02.desc:0 "[SOU.GetName]'a karşı hoşnutsuzluk yaratma çabalarımız büyük bir başarıyla karşılandı. Doğu Karelya Ayaklanması sırasında 20.000 Doğu Karelyalı Finlandiya'ya kaçtı ve kaybettiklerinin anısını yaşatmak için Akademik Karelya Derneği içinde özenle çalıştılar. Ne Heimosodat unutuldu ne de Karelyalıların Sovyet yetkilileri elindeki muamelesi. \n\nSonuç olarak, Doğu Karelya halkı zalimlerine karşı ayaklanmaktan açıkça bahsetmeye başladı. Bölgeye bir süredir silah ve malzeme akıyor, ancak şimdi yerinden edilenlerin geri dönüp silahlanmaları için çağrıda bulunuyorlar. \n\nŞimdi soru şu: [ROOT.GetName] bir kez daha onların mücadelesine katılacak mı?"
 AAT_finland_kinship_war.02.t:0 "Doğu Karelya Ayaklanması!"
 AAT_finland_kinship_war.03.a:0 "Kuvvetlerimize karşı hiç şansları yok!"
 AAT_finland_kinship_war.03.desc:0 "Bu sabah Doğu Karelya'daki isyancılar, [FIN.GetAdjective] unsurları tarafından sert eylemlere teşvik edilerek hükümet mevzilerine saldırdığında ilk kurşunlar atıldı. Bölgede bir süredir sorunlar demleniyordu, çünkü buradaki isyancı grupları desteklemek için sorunlu komşumuzdan silah kaçırılıyordu. [FIN.GetName], 1920'de imzalanan Tartu Barışı'ndan asla memnun kalmadı ve o zamandan beri Doğu Karelya'daki isyancı grupları destekliyor. \n\nŞimdiye kadar, müdahaleleri bununla sınırlıydı, ancak, [FIN.GetName]'ın nihayet daha doğrudan dahil olduğu görülüyor. [FIN.GetAdjective] kuvvetleri sınırı geçerek çatışmayı genişlettiğinde ve iki ulusumuzu savaş durumuna getirdiğinde durum daha da tırmandı."
 AAT_finland_kinship_war.04.a:0 "Doğu Karelya'yı başka yollarla özgürleştirmek zorunda kalacağız."
 AAT_finland_kinship_war.04.desc:0 "Son birkaç aydır, [FROM.GetAdjective] kuvvetleri bölgeyi istikrarsızlaştırmanın ve yerel garnizonları kaosa sürüklemenin yollarını bulmaya çalışarak Doğu Karelya kasabalarını araştırdı, ancak savunan [SOV.GetAdjective] birliklerinin karşı koyması çok güçlüydü. \n\nBirçok Fin kışkırtıcı ve Doğu Karelyalı isyancı, gerçek bir ayaklanma planlanamadan tutuklandı, sınır dışı edildi veya Finlandiya'ya geri kaçmak zorunda kaldı. Halk korkuyor ve bu artık bir olasılık değil."
 AAT_finland_kinship_war.04.t:0 "Doğu Karelya İsyanı Bastırıldı!"
 AAT_finland_kinship_war.05.a:0 "Umarım son Akrabalık Savaşı'dır, bu sefer gerçekten..."
 AAT_finland_kinship_war.05.desc:0 "Son birkaç aydır, [FIN.GetAdjective] kuvvetleri bölgeyi istikrarsızlaştırmanın ve yerel garnizonlarımızı kaosa sürüklemenin yollarını bulmaya çalışarak Doğu Karelya kasabalarını araştırdı, ancak savunan [SOV.Adjective] birliklerinin cesur karşı koyması elbette çok güçlüydü. \n\nBirçok Fin kışkırtıcı ve Doğu Karelyalı isyancı, gerçek bir ayaklanma kışkırtılamadan tutuklandı, sınır dışı edildi veya Finlandiya'ya geri kaçmak zorunda kaldı. Halk, bölgeye nihayet barışın geri gelmesinden seviniyor!"
 AAT_finland_kinship_war.06.a:0 "Onlara adam ve malzeme göndermeliyiz"
 AAT_finland_kinship_war.06.b:0 "Uyuyan ayıyı uyandırmamak gerek..."
 AAT_finland_kinship_war.06.desc:0 "Sovyetler Birliği'nde sivil kurumlar çökerken, birçok yerel milliyetçi hükümet bağımsızlığını ilan ediyor, [KAR.GetNameDef] de bunlardan biri. Karelyalı irredentistler ve militaristler elimizde ikinci bir Akrabalık Savaşı olduğunu ilan ederken, ılımlılar ve sosyalistler Sovyet işlerine karışmamamız gerektiğini iddia ediyor."
 AAT_finland_kinship_war.06.t:0 "İkinci Bir Heimosodat"
 AAT_finland_kinship_war_dynamic_modifier_tt:0 "Eyalet Etkeni §Y$FIN_anti_soviet_sentiment$§!, §Y[215.GetName]§!, §Y[216.GetName]§!, §Y[146.GetName]§! veya §Y[147.GetName]§!'de mevcutken, [FROM.GetNameDef] bir Karelya ayaklanmasını kışkırtabilir."
 AAT_finland_kinship_war_rebellion_crushed_fin_tt:0 "§RKarelyalı isyancılar bir ayaklanma organize edilemeden ezildi§!."
 AAT_finland_kinship_war_rebellion_crushed_sov_tt:0 "§GKarelyalı isyancılar bir ayaklanma organize edilemeden ezildi§!."
 AAT_finland_misc_events.01.a:0 "Çocuklarımızı kurtarın!"
 AAT_finland_misc_events.01.desc:0 "[GetFinnishWinterWarOrNot] şiddetlenirken, [ROOT.GetAdjective] hükümeti ulusumuzun çocuklarını güvenlikleri için [GetFinnishChildrenDestination]'a tahliye etme gibi zor bir karar aldı. Bu yürek parçalayıcı karar, çatışma sırasında sivillerin karşılaştığı sürekli tehlike ışığında alındı.\n\nTahliye çabaları, sayısız ailenin ayrılması ve çocukların evlerini geride bırakmasıyla büyük bir girişim oldu. Ama onların güvenliğinin son derece önemli olduğunu unutmamalı ve onları zarardan korumak için elimizden gelen her şeyi yapmalıyız.\n\n[ROOT.GetAdjective] halkı savaşın sert gerçeklerine katlanırken, umuda tutunmalı ve çocuklarımızın bu zor zamanda güvende olacağına ve onlara bakılacağına inanmalıyız. Önümüzdeki yol uzun ve zorlu olabilir, ancak sebat etmeli ve zorluklar karşısında güçlü durmalıyız."
 AAT_finland_misc_events.01.t:0 "Çocukların Tahliyesi"
 AAT_finland_misc_events.02.a:0 "Bu zorlu zamanlarda hepimiz fedakarlık yapmalıyız, ne kadar aptalca görünse de."
 AAT_finland_misc_events.02.b:0 "Bu düpedüz aptalca."
 AAT_finland_misc_events.02.desc:0 "Savaş devam ederken, giderek artan sayıda politikacı ve diğer önde gelen şahsiyetler, cephedeki askerlerimize saygı ve dayanışma göstermek amacıyla halka açık dans yasağı için baskı yapıyor.\n\nBu kişiler bu kriz zamanında dans etmeyi uygunsuz buluyorlar. Askerlerimizi desteklemenin ve bu tür faaliyetlerden kaçınarak savaş çabalarına olan bağlılığımızı göstermenin görevimiz olduğunu söylüyorlar ve bunu yapmamanın para cezaları veya hatta hapisle sonuçlanması gerektiğini iddia ediyorlar.\n\nAncak, diğer birçok kişi böyle bir teklife karşı tiksintilerini dile getirerek, diğer ülkelerde insanların savaşın zorlu koşullarına dayanmalarına yardımcı olmak için dans etmenin bile teşvik edildiğini iddia ediyor."
 AAT_finland_misc_events.02.t:0 "Dans Yasağı"
 AAT_finland_misc_events.03.a:0 "Evet, daha fazla yatırım için [?FIN_faction_leader_recieving_resource_rights.GetNameDef]'e ulaşmalıyız."
 AAT_finland_misc_events.03.b:0 "Hayır, başkalarına minnettar olmak istemiyoruz."
 AAT_finland_misc_events.03.desc:0 "Maden çıkarma altyapısına yaptığımız sürekli yatırım bizi giderek artan verimle ödüllendirmeye devam ediyor, ancak daha büyük ulusların kaynaklarına ve uzmanlığına başvursaydık daha da fazlasını elde edebileceğimizi düşünmeden edemiyoruz. \n\n[?FIN_faction_leader_recieving_resource_rights.GetNameDef]'e ulaşmalı ve madencilik operasyonlarımızı bir sonraki seviyeye taşımak için yatırım ve uzmanlarla bize yardımcı olmaları durumunda elde edilen malzemelerden bir pay teklif etmeliyiz. Bunu yaparak, ikimiz de fayda sağlarız."
 AAT_finland_misc_events.03.t:0 "[?FIN_faction_leader_recieving_resource_rights.GetAdjective] Geliştirme Projesi için Yardım"
 AAT_finland_misc_events.03_tt:0 "+1 ekler"
 AAT_finland_misc_events.04.a:0 "[929.GetName]'da maden işletme hakları tahsis edin."
 AAT_finland_misc_events.04.b:0 "[722.GetName]'da nikel işletme hakları sağlayın."
 AAT_finland_misc_events.04.c:0 "[926.GetName]'da hammadde haklarını yeniden yönlendirin."
 AAT_finland_misc_events.04.d:0 "[148.GetName]'da arama hakları verin."
 AAT_finland_misc_events.04.desc:0 "[?FIN_faction_leader_recieving_resource_rights.GetNameDef] ile devam eden müzakerelerimizin ilk turlarının iyi ilerlemesinden sonra, şimdi önemli bir ilgi noktasında, yani karşılığında ne alacakları konusunda durdular. [?FIN_faction_leader_recieving_resource_rights.GetNameDef] ülkemizdeki bir dizi işletmeye göz dikti, sadece hangisini alacaklarını teklif etmemiz gerekiyor.\n\nOulu'daki Makola madeninin üretiminden bir pay teklif edebilir, Petsamo madenlerinden nikel sağlayabilir, Turku tersanelerimize giden hammaddelerin bir kısmını yeniden yönlendirebilir veya Lappi'de arama hakları verebiliriz."
 AAT_finland_misc_events.04.t:0 "Yardım Karşılığında Geri Ödeme"
 AAT_finland_misc_events.05.a:0 "Güzel"
 AAT_finland_misc_events.05.desc:0 "Harika haber! Birkaç sanayi kuruluşu toplu olarak [FROM.GetAdjective] madencilik sektörüne para, ekipman ve uzman yatırımı yaptı ve bu yatırım işletme hakları yoluyla temettü ödemeye başladı. [?FROM.FIN_state_given_for_resource_rights.GetName]'da bulunan üretimin bir kısmı bize verildi. \n\nBu yeni kaynakları bir an önce iyi bir şekilde kullanmalıyız!"
 AAT_finland_misc_events.05.t:0 "[FROM.GetName] Bize Kaynak Hakları Veriyor"
 AAT_finland_misc_events.06.a:0 "Bunu iyi kullanacağız!"
 AAT_finland_misc_events.06.desc:0 "[FROM.GetName], İskandinav bölgesinin ne kadar gelişirse, halkımızın o kadar refah içinde olacağını ve hepimizin ortak savunma ve ticaretten o kadar çok fayda sağlayacağını kabul etti. Bu rüyayı gerçekleştirmenin ilk adımı, dış tehditleri savuşturmak için kolektif savunma yeteneklerimizi artırmaktır. \n\nSonuç olarak, [FROM.GetName] askeri üretimimizi artırmamıza yardımcı olmak için bize cömertçe endüstriyel ekipman ve uzmanlar teklif etti."
 AAT_finland_misc_events.06.t:0 "[ROOT.GetName]'da [FROM.GetAdjective] Askeri Yatırımları"
 AAT_finland_misc_events.07.a:0 "Harika bir girişim!"
 AAT_finland_misc_events.07.desc:0 "Giderek karanlığa ve belirsizliğe gömülen bir dünyada, [FROM.GetName] bunun yerine yolu aydınlatmak için bilim ve teknoloji fenerine döndü. Bu küçük ulus, bizim de yaptığımız gibi, son yıllarda büyük adımlar attı. Bilimsel topluluklarımızı birleştirmemizi ve hepimizin iyiliği için bildiklerimizi paylaşmamızı önerdiler. Başkalarının karanlıkta takip edeceği kaderin ışığı olarak parlayalım."
 AAT_finland_misc_events.07.t:0 "[FROM.GetAdjective] Araştırma ve Geliştirme Programı"
 AAT_finland_motti.01.a:0 "Tetikte olun ve savaşa hazırlanın!"
 AAT_finland_motti.01.desc:0 "[FROM.GetAdjective] birlikleri [FROM.FROM.GetName] sahasında motti taktikleri uygulamaya başladı. Motti taktikleri, [FROM.GetAdjective] kuvvetlerinin düşman birliklerini kuşattığı ve ikmal hatlarını kestiği, onları saldırıya karşı savunmasız bırakan yıkıcı bir tekniktir. Bu, işgalci güçleri [FROM.GetAdjective] saldırılarına karşı son derece savunmasız hale getirir ve Finlandiya'ya ilerlemek istiyorsak üstünlük sağlamalarını önlemek için hızlı hareket etmeliyiz."
 AAT_finland_motti.01.t:0 "[FROM.GetAdjective] Motti Taktikleri"
 AAT_finland_motti_tt:0 "\n§RBundan sonra, [FROM.GetNameDefCap] diğer ana eyaletlerde Motti Taktikleri hazırlayabilecek.§!"
 AAT_finland_national_defense.01.a:0 "Boşuna bir önlem."
 AAT_finland_national_defense.01.desc:0 "İstihbarat servislerimiz, Fin silah depolarının [?FIN_state_with_weapon_caches.GetName]'da gizlendiğini bildiriyor. Oradaki askeri operasyonların önemli ölçüde engelleneceğini bekleyebiliriz ve yerel direniş tarafından daha saldırgan taktiklere karşı dikkatli olmalıyız. Bu operasyonların algılanan başarısına bağlı olarak, diğer Fin eyaletlerinde de benzer sürprizlerle karşılaşabiliriz."
 AAT_finland_national_defense.01.t:0 "[?FIN_state_with_weapon_caches.GetName]'da [FROM.FROM.GetAdjective] Silah Depoları"
 AAT_finland_national_defense.02.a:0 "Mükemmel haber."
 AAT_finland_national_defense.02.b:0 "İyi, ama beni daha fazla depo raporuyla rahatsız etmeyin."
 AAT_finland_national_defense.02.desc:0 "[FROM.FROM.GetName]'daki gizli Fin silah depoları raporlarının ardından, birliklerimiz sahayı tarıyor. Binaların altına gömülmüş, devrilmiş ağaçlara yerleştirilmiş ve göllere yağlı torbalara sarılmış olarak batırılmış depolar bulduklarını bildirdiler. Bulduklarımızı ele geçirdik ve en azından önemsememiz gereken sayılarda daha fazla olduğuna inanmıyoruz."
 AAT_finland_national_defense.02.t:0 "[FROM.FROM.GetName]'da [FIN.GetAdjective] Silah Depoları Ele Geçirildi"
 AAT_finland_national_defense.03.a:0 "Korkunç haber!"
 AAT_finland_national_defense.03.b:0 "İlgilenmemiz gereken daha önemli konular var."
 AAT_finland_national_defense.03.desc:0 "[FROM.FROM.GetName]'daki silah depolarımızı düşmanlarımızdan gizlemek için gösterdiğimiz tüm çabalara rağmen, düşman ajanları onları bulup ele geçirmeyi başardı. Hala bazıları kalmış olabilir, ancak bu sahada anlamlı bir fark yaratacak kadar yüksek sayılarda değil."
 AAT_finland_national_defense.03.t:0 "[FROM.GetName], [FROM.FROM.FROM.GetName]'daki Silah Depolarımızı Ele Geçirdi"
 AAT_finland_political.01.a:0 "Kallio'nun yapacak işi var!"
 AAT_finland_political.01.desc:0 "Bugün [Root.GetLeader], [ROOT.GetAdjective] Parlamentosu olan eduskunta'da hakkında verilen güvensizlik oylamasından galip ayrılmak için [ROOT.GetLeader.GetSheHe]'nin ihtiyaç duyduğu oyları almayı başaramadı.\n\n1931'den beri başkan olarak görev yapmasına ve halk nezdinde popüler bir yönetim geçmişine sahip olmasına rağmen, Sosyal Demokratları kabineye dahil etmeyi reddetmesi ve bunu yapacağına dair [ROOT.GetLeader.GetHerHis] sözlerini tutmaması, [ROOT.GetLeader.GetHerHis] saygınlığını önemli ölçüde azalttı. Bu siyasi pot, [ROOT.GetLeader.GetSheHe]'nin de artık kurbanı olduğu bir siyasi krize dönüştü."
 AAT_finland_political.01.t:0 "[ROOT.GetLeader]'e Karşı Güvensizlik Oyu"
 AAT_finland_political.02.a:0 "Svinhufvud kitlelerin güvenini kazanmalı."
 AAT_finland_political.02.b:0 "Kyosti Kallio'yu atayın, merkezcilerin ve demokratların desteğine sahip!"
 AAT_finland_political.02.desc:0 "Bugün, zor durumdaki [ROOT.GetLeader]'in başkan olarak yerini bir kez daha sağlamlaştırması gereken gün.\n\n1931'den beri başkan olarak görev yapmasına ve halk nezdinde popüler bir yönetim geçmişine sahip olmasına rağmen, Sosyal Demokratları kabineye dahil etmeyi reddetmesi ve bunu yapacağına dair [ROOT.GetLeader.GetHerHis] sözlerini tutmaması, [ROOT.GetLeader.GetHerHis] saygınlığını önemli ölçüde azalttı. Bu siyasi pot, [ROOT.GetLeader.GetHerHis]'in yeniden seçilme şansını ciddi şekilde baltaladı ve bunun [GetPoliticsDescriptionOldManPete]'i devirmeye yetip yetmeyeceğini bugün öğreneceğiz."
 AAT_finland_political.02.t:0 "Başkanlık Dönemi Sona Eriyor"
 AAT_finland_political.03.a:0 "Risto Ryti'yi atayın, zaten Kallio'nun görevlerini devralıyor!"
 AAT_finland_political.03.desc:0 "Maalesef, [ROOT.GetLeader]'in sağlığının hiç de iyi olmadığı gerçeğiyle yüzleşmek zorundayız. [ROOT.GetLeader], [ROOT.GetLeader.GetHerHis] sağ kolunun felç kalmasına neden olan bir inme geçirmişti ve doktorlar, [ROOT.GetLeader.GetSheHe]'nin derhal görevden alınmaması halinde [ROOT.GetLeader.GetHerHis] sağlığının hızla kötüleşeceğinden endişe ediyor.\n\nBu nedenle, Finlandiya Parlamentosu olan eduskunta, Başkanı kendi sağlığı için görevden almak amacıyla bir Güvensizlik Oylaması sunmak için acil bir oturum çağrısı yaptı. Başbakan Risto Ryti, başkanın bir dizi sorumluluğunu çoktan devralmış durumda ve makamı devralmak için hazır bekliyor."
 AAT_finland_political.04.a:0 "Huzur içinde yatsın!"
 AAT_finland_political.04.desc:0 "Trajik bir haberimiz var, [ROOT.GetName]'nın çok sevilen Başkanı [ROOT.GetLeader] hayatını kaybetti. [ROOT.GetLeader.GetSheHeCap], bir süredir sağlık sorunları yaşıyordu ve daha önce [ROOT.GetLeader.GetHerHis] sağ kolunu felç bırakan bir inme geçirmişti.\n\n[ROOT.GetLeader.GetSheHeCap], sağlık sorunları nedeniyle [ROOT.GetLeader.GetHerHis] istifasını yeni sunduktan sonra evine dönerken, [ROOT.GetLeader.GetSheHe] ölümcül bir kalp krizi geçirdi ve orada, Helsinki Merkez Tren İstasyonu'nda hayatını kaybetti. Hayatını kaybettiği sırada tören mangası, makamına veda olarak vatansever Fin marşı Porilaisten marssi'yi çalıyordu."
 AAT_finland_political.04.t:0 "[ROOT.GetLeader]'in Ölümü"
 AAT_finland_political.05.a:0 "$FIN_risto_ryti$ sıradaki!"
 AAT_finland_political.05.desc:0 "Bugün [ROOT.GetLeader]'in istifa mektubunu aldık. Mektupta [ROOT.GetLeader.GetSheHe], [ROOT.GetLeader.GetHerHis] sağlığıyla ilgili süregelen endişeler olduğunu ve bu nedenle [ROOT.GetLeader.GetSheHe]'nin basiretli bir karar alarak [ROOT.GetLeader.GetHerHis] istifasını sunmaya karar verdiğini belirtmiştir.\n\n[GetPoliticsDescriptionKallioWinterWar]"
 AAT_finland_political.05.t:0 "[ROOT.GetLeader]'in İstifası"
 AAT_finland_political.06.a:0 "Ülkenin artık Ryti gibi bir adama ihtiyacı yok."
 AAT_finland_political.06.desc:0 "Hükümet, [ROOT.GetLeader]'den gelen ve sağlık sorunlarını gerekçe gösteren istifa mektubunu bir miktar şaşkınlıkla karşıladı. Ancak [ROOT.GetLeader.GetSheHe] sağlığın timsaliydi, bu yüzden başka nedenler olabileceğinden şüphelenenler de var.\n\nBaşkan, yakın zamanda bir siyasi skandala karışmıştı. Bu skandalda, [ROOT.GetLeader.GetSheHe]'nin [GER.GetLeader]'e gönderdiği kişisel bir mektupta [ROOT.GetLeader.GetSheHe]'nin gerçek ve varsayılan düşmanlarımıza karşı askeri yardım için yalvardığı ortaya çıktı.\n\nAnlaşılır bir şekilde, kabinedeki daha milliyetçi unsurlardan bazıları egemenliğimize yönelik bu bariz saldırıyı kınadı ve istifa etmesi için [ROOT.GetLeader.GetHerHim]'e baskı yapmış olabilirler."
 AAT_finland_political.07.a:0 "Mannerheim durumu halledecektir."
 AAT_finland_political.07.desc:0 "[ROOT.GetName]'ın varlığı bu savaşla tehdit altındayken, [ROOT.GetLeader]'ı [ROOT.GetAdjective] Kurtuluş Savaşı'nın kahramanı Mareşal Carl G. Mannerheim liderliğindeki bir askeri hükümetle değiştirme gibi zor bir karar almalıyız. İşgalcinin boyunduruğundan kurtulma ve vatanımızı kurtarma umudumuz varsa, onun askeri deneyimine ihtiyacımız var. \n\nMannerheim yeni sorumluluklarına şevkle sarıldı ve şöyle dedi: 'Bu savaş, Bağımsızlık Savaşımızın devamı ve son perdesinden başka bir şey değildir. Evlerimiz, inancımız ve ülkemiz için savaşıyoruz.'"
 AAT_finland_political.07.t:0 "$FIN_carl_mannerheim$ Başkan Olarak Atandı"
 AAT_finland_political.08.a:0 "[ROOT.GetAdjective] halkı hizmetiniz için teşekkür eder, Mareşal Baron Mannerheim!"
 AAT_finland_political.08.b:0 "Mannerheim'ın hala görevine ihtiyacı var!"
 AAT_finland_political.08.desc:0 "[ROOT.GetLeader]'ın başarılarını minnetle kabul ediyoruz, çünkü [ROOT.GetLeader.GetHerHis] liderliği olmasaydı, fırtınayı atlatamazdık ve ulusumuz şimdi kaybolmuş olurdu. \n\nAncak zor bir karar vermemiz gerekiyor, Mareşal'den görevine devam etmesini mi istemeliyiz, yoksa görevini bırakıp halkın iradesine boyun eğerek sivil bir hükümeti yeniden mi getirmeliyiz?"
 AAT_finland_political.08.t:0 "Mannerheim'ın Görevleri Tamamlandı"
 AAT_finland_political.09.a:0 "[ROOT.GetAdjective] halkı hizmetiniz için teşekkür eder, Mareşal Baron Mannerheim!"
 AAT_finland_political.09.desc:0 "[ROOT.GetLeader]'ın başarılarını minnetle kabul ediyoruz, çünkü [ROOT.GetLeader.GetHerHis] liderliği olmasaydı, fırtınayı atlatamazdık ve ulusumuz şimdi kaybolmuş olurdu. \n\nAncak, şimdi savaşın ötesine, onu takip etmesi gereken barışa ve yeniden yapılanmaya bakma zamanıdır. Yaraları düzgün bir şekilde sarmak ve gelecekle yüzleşmek için sivil bir hükümeti yeniden kurmalıyız."
 AAT_finland_the_white_death.1.a:0 "Mükemmel!"
 AAT_finland_the_white_death.1.b:0 "Avcılara daha fazla silah dağıtmalıyız"
 AAT_finland_the_white_death.1.desc:0 "Keskin nişancılarımızın ormanlarımıza giren düşman kuvvetleriyle savaşmada son derece etkili olduğuna dair raporlar geldi. Bu, savaş propagandası için iyi bir fırsat, çünkü Beyaz Ölüm terimi düşman askerleri arasında Finlandiya'nın doğası ve insanlarının oluşturduğu tehlikelere atıfta bulunarak ortaya çıkıyor ve halkı bir araya getirmek için ortaya çıkması durumunda bunu belirli bir kişiye atfedebiliriz."
 AAT_finland_the_white_death.1.t:0 "Keskin Nişancılarımız Son Derece Etkili"
 AAT_finland_the_white_death.10.a:0 "Gerçek korkuyu tadacaklar"
 AAT_finland_the_white_death.10.desc:0 "Sayısız tehlikeli durum ve yanlış iddiaya rağmen, Simo Häyhä yara almadı ve kendisinden talep edildiği sürece savaşmaya devam edecek. Beyaz Ölüm düşmanlarımızı kucaklıyor!"
 AAT_finland_the_white_death.10.t:0 "Beyaz Ölüm Avını Takip Etmeye Devam Ediyor"
 AAT_finland_the_white_death.11.a:0 "Yine de, o gerçek bir Fin Kahramanı!"
 AAT_finland_the_white_death.11.desc:0 "Häyhä'nın düşman bir asker tarafından ateşlenen patlayıcı bir merminin sol alt çenesine isabet etmesinden sonra ağır yaralandığına ve öldüğü düşünülürken, güvenliğini bildirmek için yakındaki bir ana kampa geri döndüğüne dair raporlar geldi. Ancak savaşmaya devam edemez, ama [FIN.GetAdjective] halkından sonsuz bir minnettarlık için yeterince hizmet etti."
 AAT_finland_the_white_death.11.t:0 "Simo Häyhä yaralandı ve savaş alanından çıkarıldı"
 AAT_finland_the_white_death.12.a:0 "Ruhu eski kahramanların arasında huzur bulsun"
 AAT_finland_the_white_death.12.desc:0 "Häyhä'nın çatışma sırasında düşman bir asker tarafından ateşlenen patlayıcı bir mermiyle vurulduktan sonra öldürüldüğüne dair raporlar geldi. Cesedi Jaegerlerimiz tarafından başarıyla alındı ve başkente getirildi. [FIN.GetNameDef]'in sonsuza dek minnettar halkı tarafından sonsuza dek hatırlanacak."
 AAT_finland_the_white_death.12.t:0 "Simo Häyhä öldürüldü!"
 AAT_finland_the_white_death.2.a:0 "Onlar hakkında endişelenmeye gerek yok"
 AAT_finland_the_white_death.2.b:0 "Onları avlayın!"
 AAT_finland_the_white_death.2.desc:0 "Askerlerimiz, [FIN.GetNameDef] ormanlarında bütün bir insan sütununun pusuya düşürülüp paramparça edildiğini bildiriyor. [FIN.GetNameDef]'in katı soğuğunun bir cisimleşmesi ve [FIN.GetAdjective] Ordusu'nun ölümcül nişancılarından oluşan Beyaz Ölüm'den bahsetmeye başladılar. İstersek, daha fazla hasara yol açmadan önce bu engellerden kurtulmak için kapsamlı bir çaba gösterebiliriz."
 AAT_finland_the_white_death.2.t:0 "[FIN.GetAdjective] Keskin Nişancıları Askerlerimizin Kalbine Korku Salıyor"
 AAT_finland_the_white_death.4.a:0 "Bu Modern Fin Kahramanının hikayelerini yaymalıyız"
 AAT_finland_the_white_death.4.b:0 "Beyaz Ölüm, bir kişi değil, Finlandiya'nın Vücut Bulmuş Halidir!"
 AAT_finland_the_white_death.4.desc:0 "Etkileyici nişancılığı nedeniyle diğer askerlerimiz tarafından sık sık Taika-Ampuja, Büyülü Nişancı olarak anılan Viipuri keskin nişancısı Simo Häyhä, şimdiye kadar düşmanlarımız tarafından Fin doğasının ve halkının sertliğine atıfta bulunan Beyaz Ölüm olarak da tanımlanıyor ve basın bu yeni anlatıyı güçlü bir şekilde zorluyor. Resmi tutumumuz ne olmalı?"
 AAT_finland_the_white_death.4.t:0 "Simo Häyhä, Beyaz Ölüm Olarak Tanımlandı"
 AAT_finland_the_white_death.5.t:0 "Simo Häyhä, Beyaz Ölüm Olarak Tanımlandı"
 AAT_finland_the_white_death.6.t:0 "Simo Häyhä, Beyaz Ölüm Olarak Tanımlandı"
 AAT_finland_the_white_death.7.a:0 "Bu kötü..."
 AAT_finland_the_white_death.7.desc:0 "Askerlerimizin tüm çabalarına rağmen, Beyaz Ölüm yakalanmaktan çok uzak ve haftalardır askerlerimizi terörize ediyor, subaylarımızın gösterecek hiçbir şeyi yok. Bu devam ettikçe, askerlerimiz tereddüt ediyor ve moralleri düştü..."
 AAT_finland_the_white_death.7.t:0 "Beyaz Ölüm Bizi Kucaklıyor!"
 AAT_finland_the_white_death.8.a:0 "Baş belası bir sinekten kurtulduk!"
 AAT_finland_the_white_death.8.desc:0 "[FIN.GetNameDef]'deki subaylarımızdan Beyaz Ölüm'ün başarıyla yaralandığına dair raporlar geldi. Ancak bu, birçok askerin öldürülmesi ve yol boyunca daha fazlasının yaralanmasıyla büyük bir bedele mal oldu. Yine de, onunla savaş alanında tekrar karşılaşmak zorunda kalmamalıyız."
 AAT_finland_the_white_death.8.t:0 "Ağır Kayıplara Rağmen, Birliklerimiz Beyaz Ölüm'ü Başarıyla Yaraladı"
 AAT_finland_the_white_death.9.a:0 "Aslında, bize karşı hiç şansı yoktu"
 AAT_finland_the_white_death.9.desc:0 "[FIN.GetNameDef]'deki subaylarımızdan, Beyaz Ölüm olarak bilinen [FIN.GetAdjective] keskin nişancısının başarıyla ortadan kaldırıldığına dair raporlar geldi. Ağır kayıplarla birlikte gelse de, [ROOT.GetNameDef]'in büyük bir düşmanı ortadan kaldırıldı ve askerlerimiz artık rahat bir nefes alabilir."
 AAT_finland_the_white_death.9.t:0 "Ağır Kayıplara Rağmen, Birliklerimiz Beyaz Ölüm'ü Öldürmeyi Başardı!"
 AAT_finland_winter_war.02.a:0 "Barış zamanı gelmiş olabilir..."
 AAT_finland_winter_war.02.desc:0 "Cepheden müjdeli haberler getiriyoruz! Kuvvetlerimiz yakın zamanda [195.GetName] kuşatmasını kazandı ve şehri güvence altına almayı başardı. [SOV.GetNameDef]'e karşı vurulan bu kesin darbe ile kendimizi barış görüşmelerini başlatmak için güçlü bir konumda buluyoruz. \n\n[SOV.GetAdjective] işgalinin belirtilen hedeflerinden biri [195.GetName] etrafındaki tampon bölgeyi artırmaktı ve şimdi sadece bu hedefe ulaşmada başarısız olmakla kalmayıp, aslında şehrin kendisini kaybettikleri inkar edilemez bir gerçektir. Bu nedenle, bu çatışmadan kendilerini kurtarmak için can atacaklarını düşünüyoruz. \n\nŞimdi görüşmelere ne zaman başlayacağımıza karar vermek bizim elimizde, savaşa devam edip daha fazlasını alıp alamayacağımızı görebilir veya mümkün olan en kısa sürede beyaz bir barışı hedefleyebiliriz."
 AAT_finland_winter_war.02.t:0 "[ROOT.GetAdjective] Barış Talepleri"
 AAT_finland_winter_war.03.a:0 "Yenilgiyi kabul etmekten başka seçeneğimiz yok..."
 AAT_finland_winter_war.03.b:0 "Savaşın gidişatını değiştireceğiz!"
 AAT_finland_winter_war.03.desc:0 "[FROM.GetNameDef]'deki düşmanlarımızdan yeni haber aldık. Beyaz bir barış için şartlar sundular, buna göre kuvvetlerimiz derhal tüm saldırı önlemlerini durduracak ve sınırımızın bizim tarafımıza çekilecek. Toprak bütünlüğü konusunda, [FROM.GetNameDef] sınırlarımızın savaş öncesi konumlarına dönmesini, her iki tarafın da herhangi bir kazanç sağlamamasını yeterli görüyor gibi görünüyor. \n\nSon kayıplarımız göz önüne alındığında, halkımızın savaşa devam etme konusunda ne kadar destekleyici olacağından emin değiliz. Kısa vadede onları yaklaşan bir zafere ikna edebiliriz, ancak işler kötüleşmeye devam ederse yönetimimize karşı artan bir hoşnutsuzlukla karşılaşabiliriz."
 AAT_finland_winter_war.03.t:0 "[FROM.GetAdjective] Barış Talepleri"
 AAT_finland_winter_war.04.a:0 "Bizi bir daha denemeseler iyi olur."
 AAT_finland_winter_war.04.desc:0 "Barış anlaşmasını kabul ettiler! Zafer haberimiz yayılırken sokaklarda kendiliğinden kutlamalar başladı. [FROM.GetAdjective] birlikleri şimdiden topraklarımızdan çekilmeye, evlerine perişan bir halde dönmeye başladılar. \n\nBu kesinlikle ulusumuz için bir gurur günü olarak kalacak, ancak kendimizi rehavete kaptırmamalıyız, çünkü hala pusuda bekleyen çok sayıda yılan var."
 AAT_finland_winter_war.04.t:0 "[FROM.GetNameDefCap] Barış Taleplerimizi Kabul Ediyor"
 AAT_finland_winter_war.05.a:0 "Aptallar bunun bedelini ödeyecek!"
 AAT_finland_winter_war.05.desc:0 "[FROM.GetNameDef]'deki o aptallar cömert barış teklifimizi reddettiler. Onların hayal ürünü iddiası, kuvvetlerinin maruz kaldığı son kayıpların yakında üstesinden gelecekleri kısa vadeli talihsizlikler olduğudur. Bunun, hükümetlerini halklarının öfkesinden korumak için uydurulmuş tamamen bir yalan olduğunu biliyoruz, ama yakında gerçek ortaya çıkacak. \n\nAskerlerimiz sahada kalmaya devam ediyor, dayanıklı ruhları yüksek, doğru mücadeleye devam ettiklerinin bilinciyle güvende, gelecek daha fazla savaşa kendilerini hazırlıyorlar."
 AAT_finland_winter_war.05.t:0 "[FROM.GetNameDefCap] Barış Taleplerimizi Reddediyor"
 AAT_finland_winter_war.06.a:0 "Yenilgiyi kabul etmekten başka seçeneğimiz yok..."
 AAT_finland_winter_war.06.b:0 "Buna nasıl cüret ederler!?"
 AAT_finland_winter_war.06.desc:0 "[FROM.GetAdjective] rakiplerimizden yeni bir teslimiyet talebi aldık. Barış şartlarının bir parçası olarak, Karelya-Kola bölgesindeki bir dizi farklı toprağı teslim etmemizi istiyorlar ve bu toprakları mümkün olan en kısa sürede boşaltmamızda ısrar ediyorlar."
 AAT_finland_winter_war.06.t:0 "Barış için [FROM.GetAdjective] Toprak Talepleri"
 AAT_finland_winter_war.07.a:0 "Umarım nihayet derslerini almışlardır."
 AAT_finland_winter_war.07.desc:0 "Barış anlaşmasını kabul ettiler! Zafer haberimiz yayılırken sokaklarda kendiliğinden kutlamalar başladı. [FROM.GetAdjective] birlikleri şimdiden topraklarımızdan çekilmeye, evlerine perişan bir halde dönmeye başladılar. \n\nBu kesinlikle ulusumuz için bir gurur günü olarak kalacak, çünkü sadece işgalcileri yenmekle kalmadık, onları o kadar kesin bir şekilde yendik ki, onların zararına kendi topraklarımızı genişletebildik!"
 AAT_finland_winter_war.08.a:0 "Aptallar bunun bedelini ödeyecek!"
 AAT_finland_winter_war.08.desc:0 "[FROM.GetNameDef]'deki o aptallar cömert barış teklifimizi reddettiler. Giderek çaresizleşen hükümetleri, savaşın durumu hakkındaki gerçeğin ortaya çıkması durumunda kitlesel ayaklanmalarla ve hatta evde bir devrimle yüzleşmek zorunda kalacaklarının farkında olarak, hala kazanabilecekleri hayaline tutunuyorlar. \n\nAskerlerimiz sahada kalmaya devam ediyor, dayanıklı ruhları yüksek, doğru mücadeleye devam ettiklerinin bilinciyle güvende, gelecek daha fazla savaşa kendilerini hazırlıyorlar, zaferin yakın olduğundan eminler."
 AAT_nordic_cooperation.1.a:0 "Bu çatışmayı daha fazla tırmandırmayı göze alamayız"
 AAT_nordic_cooperation.1.b:0 "Onlar zaten ölü, sadece henüz bilmiyorlar"
 AAT_nordic_cooperation.1.desc:0 "Defalarca, [?GLOBAL.NORDIC_country_to_defend.GetName] ülkesine karşı savaş çabalarımızın [FROM.GetName]'in gizli desteğiyle engellendiğine dair kanıtlar bulduk. \n\nBelki de onlara gerçek savaşın nasıl yapılacağına dair bir ders verme zamanı gelmiştir."
 AAT_nordic_cooperation.1.t:0 "[FROM.GetNameDef] Çizgiyi Aştı!"
 AAT_nordic_cooperation.2.a:0 "Yardımları memnuniyetle karşılanır"
 AAT_nordic_cooperation.2.b:0 "Bu işi onlarsız da halledebiliriz"
 AAT_nordic_cooperation.2.desc:0 "Bu hain zamanlarda, bizi [FROM.GetNonIdeologyName] ülkesine bağlayan bağlar paha biçilmez oldu. [?NORDIC_attacker.GetName] ülkesine karşı savaşımızda desteklerini sağladılar ve şimdi bir adım daha ileri giderek ülkemizin savunmasına katılmayı teklif ettiler. Sonuçta, birimize yapılan bir saldırı, tüm Nordik Uluslarına yapılmış bir saldırıdır."
 AAT_nordic_cooperation.2.t:0 "[FROM.GetName] Savaş Çabalarımızda Yardım Teklif Ediyor"
 AAT_nordic_cooperation.3.a:0 "Peki o zaman..."
 AAT_nordic_cooperation.3.desc:0 "En iyi niyetlerimize rağmen, [FROM.GetNameDef] yardımımıza ihtiyaç duymuyor veya istemiyor gibi görünüyor. Bu şaşırtıcı kararın arkasındaki mantığı sadece onlar biliyor.\n\nBu, onlara başka yollarla destek vermeyi bırakmamız gerektiği veya [?FROM.NORDIC_attacker.GetName] ülkesinin bizi bir savaşan taraf olarak görmeye karar verebileceği anlamına gelmez."
 AAT_nordic_cooperation.3.t:0 "[FROM.GetName] Yardım Teklifimizi Reddetti"
 AAT_nordic_cooperation.4.a:0 "Bu ikimize de fayda sağlar"
 AAT_nordic_cooperation.4.b:0 "Riske değmez"
 AAT_nordic_cooperation.4.desc:0 "Nordik komşularımız, ekonomilerini daha da geliştirmek için yatırım arayan bir heyet gönderdi. Bu kesinlikle bizim sanayi sektörümüz için de faydalı olacaktır, ancak potansiyel bir düşman yerine dost bir komşuyu desteklediğimizden emin olmalıyız."
 AAT_nordic_cooperation.4.t:0 "[FROM.GetName] Yatırım Arıyor"
 AAT_nordic_cooperation.5.a:0 "Harika haber!"
 AAT_nordic_cooperation.5.desc:0 "Nordik komşularımız ekonomimize yatırım yapma davetimizi kabul edecek kadar lütufkar davrandılar. Güvenleri için elbette ödüllendirilecekler, ama daha da önemlisi, ekonomimizin daha hızlı bir tempoda büyümesini sağlayacak."
 AAT_nordic_cooperation.5.t:0 "[FROM.GetName]'in Yatırımları Gelmeye Başladı"
 AAT_nordic_cooperation.6.a:0 "Talihsizlik"
 AAT_nordic_cooperation.6.desc:0 "Tüm çabalarımıza rağmen, Nordik komşularımızı ekonomimizi daha da geliştirmemize yardımcı olmaya ikna edemedik. Tabii ki her zaman başka bir ülkeyle tekrar deneyebiliriz."
 AAT_nordic_cooperation.6.t:0 "[FROM.GetName] Ekonomimize Yatırım Yapmayı Reddetti"
 AAT_nordic_cooperation.7.a:0 "Adil bir anlaşma"
 AAT_nordic_cooperation.7.b:0 "Şüpheli görünüyor"
 AAT_nordic_cooperation.7.desc:0 "Nordik komşularımız, ekonomik ve endüstriyel işbirliği için karşılıklı yarar sağlayan bir antlaşma kurmak amacıyla ortak bir zemin bulmak istiyor. Eğer doğru yapılırsa, ki umuyoruz öyle olur, bu eşitler olarak gireceğimiz için her iki ekonomimizi de eşit şekilde canlandıracaktır.\n\nBölgemizin tarihsel düşmanlık gelgitleri göz önüne alındığında, bize sırtlarını dönerlerse gelecekteki bir rakibe fayda sağlamaktan sakınmalıyız."
 AAT_nordic_cooperation.7.t:0 "[FROM.GetName] Ekonomik İşbirliği Arıyor"
 AAT_nordic_cooperation.8.a:0 "Harika Haber!"
 AAT_nordic_cooperation.8.desc:0 "[FROM.GetAdjective] liderlerinin karşılıklı yarar sağlayan anlaşmamızı kabul ettiğini az önce öğrendik. Bu, hem ekonomilerimiz hem de genel olarak Nordik bölgesi için harika olacak."
 AAT_nordic_cooperation.8.t:0 "[FROM.GetName] anlaşmamızı kabul etti"
 AAT_nordic_cooperation.9.a:0 "Şaşırtıcı"
 AAT_nordic_cooperation.9.desc:0 "[FROM.GetName] ile eşit şartlarda anlaşma hedefimize rağmen, bize böyle bir düzenlemeyle ilgilenmediklerini bildirdiler.\n\nHer zaman tekrar deneyebiliriz, ya da başka bir Nordik dostumuzla."
 AAT_nordic_cooperation.9.t:0 "[FROM.GetName] liderleri teklifimizi reddetti!"
 AAT_nordic_shared.1.a:0 "Yakın işbirliği hayatta kalmanın yoludur"
 AAT_nordic_shared.1.b:0 "Bu çok tehlikeli görünüyor, uzak durmamız daha iyi olur"
 AAT_nordic_shared.1.desc_faction_member:0 "[FROM.GetNameDefCap], ittifakımızı bir adım öteye taşımak ve işbirliğimizi çeşitli düzeylerde derinleştirmek istiyor. Askeri ittifakı, daha güçlü ve birleşik bir Nordik bölgesine giden yolda sadece bir ilk adım olarak görüyorlar."
 AAT_nordic_shared.1.desc_non_faction_member:0 "[FROM.GetNameDefCap], tüm Nordik ülkeleri arasında derin bir işbirliği kurmak için çalışıyor. [NORDIC_get_alliance_name] ittifakını kurmak ve bizi de buna katılmaya davet etmek istiyorlar."
 AAT_nordic_shared.1.t:0 "[FROM.GetName], [NORDIC_get_alliance_name] ittifakına katılmamızı teklif ediyor"
 AAT_nordic_shared.2.a:0 "Hayatta kalmanın tek yolu bu olabilir"
 AAT_nordic_shared.2.b:0 "Bizi de peşlerinden sürüklemelerine izin vermeyeceğiz"
 AAT_nordic_shared.2.desc:0 "Dünya genelinde gerilim artarken, güvenilir müttefikler bulmak giderek zorlaşıyor. [FROM.GetAdjective] hükümeti, Nordik ülkeleri olarak, [ROOT.GetName] ve [FROM.GetName] ülkelerinin bir yabancı işgali durumunda birbirlerinin yanında olacağını dünyaya duyurmamızı öneriyor. Bu taahhütte bulunmakta rahat mıyız?"
 AAT_nordic_shared.2.t:0 "[FROM.GetName] Karşılıklı Garantiler Teklif Ediyor"
 AAT_nordic_shared.3.a:0 "Harika haber!"
 AAT_nordic_shared.3.desc:0 "[FROM.GetAdjective] halkının [ROOT.GetName]'in bağımsızlığını savunacağı ve bizim de karşılığında onlarınkini savunacağımız haberini aldık. Nordik ülkeleri, dağınık küçük uluslar yerine birleşik bir güç olarak her türlü işgali püskürtmeye hazır olmalıdır."
 AAT_nordic_shared.3.t:0 "[FROM.GetName] Bizimle Duracak!"
 AAT_nordic_shared.4.a:0 "Üzücü haber"
 AAT_nordic_shared.4.desc:0 "Yüzyıllardır süren ortak tarihimiz, [FROM.GetAdjective] hükümetini halklarımızın yabancı tiranlara karşı birlikte durması gerektiğine ikna etmede pek etkili olmamış gibi görünüyor. Umalım ki çok geç olmadan fikirlerini değiştirirler."
 AAT_nordic_shared.4.t:0 "Teklifimiz [FROM.GetName] tarafından reddedildi"
 AAT_norway.1.a:0 "Beladan uzak tutulmalı"
 AAT_norway.1.b:0 "Bir taşla iki kuş vurabiliriz"
 AAT_norway.1.c:0 "Bu adama bir makam verin!"
 AAT_norway.1.d:0 "Geçmişi ihtiyacımız olan tek kanıt, onu hapsedin!"
 AAT_norway.1.desc:0 "Tartışmalı devrimci, ev sahibiyle balık tutma gezisindeyken, Nasjonal Samling partisine bağlı faşistler, Trotskij'in kaldığı Konrad Knudsen'in evine girdi.\n\nHırsızlar, sürgündeki komünistten kurtulmayı meşrulaştıracak suçlayıcı kanıtlar arıyorlardı, ancak neyse ki önemli bir şey alamadan Knudsen'in kızı Hjørdis tarafından mülkten korkutularak kaçırıldılar."
 AAT_norway.1.t:0 "Faşistler [NOR_lev_trotsky.GetName]'i Taciz Ediyor"
 AAT_norway.10.a:0 "Düşüşümüz ne kadar hızlı olacak?"
 AAT_norway.10.desc:0 "Avrupa'da savaş giderek daha kaçınılmaz hale gelirken, [NOR.GetAdjective] parlamentosu veya Storting, kaos ve anlaşmazlık dalgalarıyla sarsılıyor. Nygaardsvold kabinesinin bir istikrar dönemi getireceğine dair işaretler çoktan unutuldu, çünkü parlamento üyeleri [NOR.GetName] ülkesini yaklaşan fırtınadan güvenli bir şekilde geçirmek için herhangi bir tutarlı önlem üzerinde anlaşamıyor gibi görünüyor.\n\nBu arada, halkın düşmanları kavgadan beslenmek için bıçaklarını biliyorlar, [NOR.GetName] savaş alevleri tarafından tüketilene kadar büyüyorlar."
 AAT_norway.10.t:0 "Storting Tökezliyor"
 AAT_norway.11.a:0 "Bu kadim toprakların halkı artık uykuda değil!"
 AAT_norway.11.desc:0 "Yüzyıllardır diğer İskandinav güçleri tarafından boyunduruk altına alındıktan, sonra da kapitalist sanayicilerin insafına bırakıldıktan sonra, [ROOT.GetNonIdeologyName] halkı zalimlerine karşı birlikte durmayı ve hegemonyalarını reddetmeyi öğreniyor.\n\nŞimdi [ROOT.GetAdjective]ler devrimleri için bir ilham kaynağı arıyor!"
 AAT_norway.11.t:0 "[ROOT.GetName] Halkı Uyanıyor!"
 AAT_norway.12.a:0 "Nygaardsvold gitti, Andresen geldi"
 AAT_norway.12.desc:0 "İlk vaatlerine rağmen, Johan Nygaardsvold'un geçen yıl kurduğu hükümetin sadece başarısız olmakla kalmayıp, aynı zamanda silahsızlanmaya da kararlı olduğu anlaşılıyor. Parlamentonun birçok üyesi, [ROOT.GetName] ülkesinin, yabancı bir gücün işgalini caydırmak amacıyla sanayisini [NOR.GetAdjective] silahlı kuvvetlerine yatırım yapmaya olanak tanıyacak şekilde geliştirmesi gerektiğine inanıyordu.\n\nVe böylece, muhafazakar parti Høyre üyeleri tarafından bir güvensizlik oyu tetiklendi. Her ne kadar başkanı, sanayici Johan H. Andresen zaten emekli olmayı düşünse de, Norveç'i yeni bir yöne götürmek için fırsatı yakaladı; kendisini Nygaardsvold'un sosyal ilerleme hayallerine karşı pragmatik ve verimli bir alternatif olarak sundu."
 AAT_norway.12.t:0 "Johan Nygaardsvold'a Karşı Güvensizlik Oyu"
 AAT_norway.13.a:0 "Quisling'in zamanı nihayet geldi!"
 AAT_norway.13.b:0 "[ROOT.GetNonIdeologyName] halkı seni asla affetmeyecek, hain."
 AAT_norway.13.c:0 "Onları geciktirmek için elimizden gelen her şeyi yapmalıyız!"
 AAT_norway.13.desc:0 "Biz ekonomimizi ilerletmekle ve yurtdışındaki faşistleri gözlemlemekle meşgulken, yerli faşizmin burnumuzun dibinde yeşermesine izin verdik. Azalan destek tabanına ve partisi Nasjonal Samling'in storting'de tek bir sandalye bile kazanamamasına rağmen, Vidkun Quisling [?NOR.NOR_cw_fascist_attacker.GetAdjective] destekli bir hükümet kurdu ve [ROOT.GetNonIdeologyName] ülkesinde iktidar dizginlerini ele geçirdiğini iddia ediyor."
 AAT_norway.13.t:0 "Quisling'in Darbesi"
 AAT_norway.14.a:0 "Faydalı olacaktır"
 AAT_norway.14.b:0 "Bu soytarı mı? [NOR.GetNonIdeologyName] ülkesini kendimiz hallederiz."
 AAT_norway.14.desc:0 "Yıllardır [NOR.GetNonIdeologyName] ülkesinde Faşizmin en büyük savunucusu olan Vidkun Quisling, anavatanının işgalinde yardımını teklif etti.\n\nOslo'da desteğimizle bir darbe başlatmak ve [ROOT.GetNameDef] ülkesine dost bir rejim kurmak istiyor. Yerleştikten sonra, işgalimizin önünü açacak ve [ROOT.GetAdjective] işgalini [NOR.GetName] ülkesinde meşrulaştıracaktır."
 AAT_norway.14.t:0 "Kullanışlı bir işbirlikçi"
 AAT_norway.15.a:0 "[NOR.GetName] geleceği ne yazık ki Quisling'in olabilir"
 AAT_norway.15.b:0 "Savaşmaya devam edeceğiz!"
 AAT_norway.15.desc:0 "Tüm çabalarımıza rağmen, Vidkun Quisling Oslo'da iktidarı ele geçirme girişimini başlattı. İşgalci faşistlerin desteğiyle, düşmanlarımızla işbirliğine adanmış yeni bir hükümetin ilanını yayınlıyor.\n\nBunu süslemenin bir yolu yok, daha önce de kaybediyorduk ve bu darbe sadece savaş çabalarımızı daha da kötüleştirecek."
 AAT_norway.15.t:0 "Quisling'in Darbesi Artık Kaçınılmaz!"
 AAT_norway.16.a:0 "Geri döneceğiz!"
 AAT_norway.16.desc:0 "[NOR.GetName]'den trajik bir şekilde geri çekilmemize rağmen, en azından liderlerimizin en kötüsüne hazırlanma öngörüsüne sahip olmaları ve [NOR.GetAdjective] topraklarını geri almak için bize hizmet edecek kaynakları ayırmaları gerçeğinde teselli bulabiliriz.\n\nBu araçlar, eski kıyılarımıza olan odisemize başlamayı kolaylaştırmalıdır."
 AAT_norway.16.t:0 "Sürgündeyiz ama eli boş değiliz"
 AAT_norway.17.a:0 "Başka seçeneğimiz yok"
 AAT_norway.17.b:0 "Saçmalık!"
 AAT_norway.17.desc_denmark:0 "Norveç Kralı Haakon VII'den veya bir zamanlar bildiğimiz adıyla Danimarka Prensi Carl'dan bir saray mensubu, ciddi bir taleple bize yaklaştı. Onlara göre ve şüpheli kökenli bir dizi eski belgeye göre, Danimarka aslında Norveç Krallığı'nın bir parçasıdır, Danimarka'nın değil.\n\nAyrıca, kendi güvenliğimiz için olduğunu iddia ederek, reddedersek zorla alacaklarını ima ettiler."
 AAT_norway.17.desc_fascist:0 "[NOR.GetNameDef] lideri, topraklarımızın bir kısmını onlara devretmemizi talep ediyor ve bunu halkının atalarının topraklarını geri alma meselesi olarak adlandırıyor. Beklendiği gibi, reddedersek savaşla tehdit ediyorlar.\n\nSöz konusu toprak [GetNorwegianClaims]."
 AAT_norway.17.desc_monarchist:0 "Yüzyıllar öncesine ait belgelere atıfta bulunarak, [FROM.GetAdjective] tacı, Norveç Kralı Haakon VII tarafından miras alınan kraliyet unvanlarının De Jure parçası olan toprakların kontrolümüzde olduğunu iddia ediyor.\n\nDaha spesifik olarak, [GetNorwegianClaims] konusuna atıfta bulunuyorlar."
 AAT_norway.17.t:0 "[NOR.GetAdjective] Toprak Talepleri"
 AAT_norway.18.a:0 "Sürüye hoş geldiniz"
 AAT_norway.18.desc_fascist:0 "Zayıf [FROM.GetAdjective] hükümeti geri adım attı ve böylece zorla veya hakla bize ait olan toprağı devralmamıza izin verecek."
 AAT_norway.18.desc_monarchist:0 "[FROM.GetAdjective] devletine iddialarımızın haklı olduğunu göstermeyi başardık ve böylece, iddia ettiğimiz toprakları tacımıza devretmeyi kabul ettiler."
 AAT_norway.18.t:0 "[FROM.GetName] Taleplerimizi Kabul Etti"
 AAT_norway.19.a:0 "Küstahlıklarının bedelini ödeyecekler"
 AAT_norway.19.desc_fascist:0 "Açıkçası, [FROM.GetAdjective] devleti kimi reddettiğinin farkında değil. Haklı topraklarımız onlar tarafından işgal edilirken boş durmayacağız. Tek seçeneğimiz artık zorla almak."
 AAT_norway.19.desc_monarchist:0 "[FROM.GetName] haklı toprak iddialarımızı reddettiği için tacımızın prestiji büyük bir darbe aldı. Bu, [ROOT.GetAdjective] Tacı'na bir hakaretle eşdeğerdir ve hoş görülmeyecektir."
 AAT_norway.19.t:0 "[FROM.GetName] Taleplerimizi Reddetti!"
 AAT_norway.2.a:0 "Şimdilik yapabileceğimizin en iyisi bu"
 AAT_norway.2.desc:0 "Sürgünü sırasında siyasi katılımdan kaçınma anlaşmasını ihlal ettiğini ve faşist hırsızların çaldığı dayanıksız kanıtları gerekçe göstererek, [NOR_lev_trotsky.GetName]'i Hurum'da bir çiftliğe gönderdik, burada polis gözetiminde olacak ve dış dünyadan izole tutulacaktır.\n\nBu sert bir ceza, ancak [SOU.GetNameDef] ve yerel faşistlerden gelen baskılar onu tehlikeli bir toplanma noktası haline getiriyor."
 AAT_norway.2.t:0 "Trotskij Bir Çiftlikte Ev Hapsinde"
 AAT_norway.20.desc:0 "İngiltere'deki ailesini ziyareti sırasında, uykusunda trajik bir şekilde kalp yetmezliğinden öldü.\n\nAslen Galler Prensesi Maud unvanına sahip olan Norveç Kraliçesi eşi, sadece Kral Haakon ve zaten İngiltere'ye doğru yola çıkmış olan Prens Olav tarafından değil, tüm Norveçliler tarafından da hayatta bırakılmıştır, çünkü krallığın her yerinde çok seviliyordu."
 AAT_norway.20.t:0 "Kraliçemiz Öldü!"
 AAT_norway.3.a:0 "Bu, Norveç'in hayatta kalması için"
 AAT_norway.3.desc:0 "Knudsen'in villasındaki tartışmadan sonra, Komünistler ve Faşistlerin birbirlerinin boğazına sarılması sayesinde siyasi durumun tehlikelerle dolu olduğu açıkça ortaya çıktı.\n\nBu çekişme ve siyasi kargaşa ile başa çıkılmalıdır. Trotskij'in varlığı [SOU.GetNameDef]'in öfkesini üzerimize çekme riski taşıyor ve aynı zamanda Nasjonal Samling'in ilk fırsatta ülkeyi [FGR.GetLeader]'e teslim edeceği kesin, bu yüzden nüfuzları ne pahasına olursa olsun kısıtlanmalıdır.\n\nEn iyi hareket tarzı, [MEX.GetLeader]'in ülkeye girmesine izin verdiği Meksika'ya göndermektir."
 AAT_norway.3.t:0 "[ROOT.GetLeader.GetName]'in muhalefete genel baskısı"
 AAT_norway.4.a:0 "Bir ulusun sürgünü, diğerinin kurtarıcısıdır!"
 AAT_norway.4.desc:0 "[NOR.GetAdjective] halkının dertlerinin çözümü burnumuzun dibindeydi. [NOR_lev_trotsky.GetName] sadece zamanımızın en büyük Marksist yazarlarından biri değil, aynı zamanda karizmatik bir devrimci ve olağanüstü bir generaldir.\n\nBu kesinlikle [SOV.GetNameDef] ile biraz gerginliğe neden olacak, ama buna değecek. Ne de olsa, onun deneyimi genç ulusumuzu ve İskandinavya işçilerini büyüklüğe götürebilir."
 AAT_norway.4.t:0 "Trotskij hükümetimize katılıyor!"
 AAT_norway.5.a:0 "Durdurulmalıydı"
 AAT_norway.5.desc:0 "Başkaları Knudsen'in evinde bulunan kanıtları dayanıksız, önemsiz veya hatta uydurma olarak adlandırabilir ve haklı da olabilirler, ama belki bir noktada, belirli koşullar altında bir yargıç geçerliliğini kabul edecektir. Ayrıca, şu anda Nasjonal Samling'i yabancılaştırma riskini alamayacağımız gerçeği de var. Bu yüzden [NOR_lev_trotsky.GetName] derhal gözaltına alındı.\n\nNe zaman veya nasıl gün ışığına çıkacağı şu anda pek önemli değil, ama en azından Sibirya'da olduğundan daha iyi bir konaklaması olmasını sağlayacağız."
 AAT_norway.5.t:0 "[NOR_lev_trotsky.GetName] hapsedildi!"
 AAT_norway.6.a:0 "Meksika güneşinin tadını çıkaracaktır"
 AAT_norway.6.b:0 "Stalin bunun için bizi sevecektir!"
 AAT_norway.6.desc:0 "[NOR_lev_trotsky.GetName]'i Hurum'da bir çiftlikte ev hapsine koyduğumuzdan beri bir süre geçti ve bu, ilgili taraflardan hiçbiri için iyi bir düzenleme gibi görünmüyor. [SOV.GetNameDefCap] iade istiyor, Nasjonal Samling asılmasını istiyor ve sıkı bir troçkist olmayan herkes onun gitmesini istiyor. Bu zahmetli sürgünle ne yapacağımıza karar vermeliyiz.\n\nMeksika Devlet Başkanı [MEX.GetLeader], sürgününe devam etmesine izin verirsek onu almayı teklif etti, ama onu dostluk nişanesi olarak [SOV.GetLeader]'e de gönderebiliriz."
 AAT_norway.6.t:0 "Trotskij'in Kaderi"
 AAT_norway.7.a:0 "Nihayet biraz huzur"
 AAT_norway.7.desc:0 "Ülkemizde yıllarca süren garip sürgünden sonra, zahmetli sürgün [NOR_lev_trotsky] Meksika'ya vardı, burada ressam Frida Kahlo ve kocası Diego Rivera tarafından ağırlanacak, ki onlar kesinlikle kendisi ve karısıyla çok iyi anlaşacaklardır.\n\nMuhtemelen [SOV.GetNameDef] ülkesindeki düşmanlarından güvende olacak, ama en önemlisi, artık bizim sorunumuz olmayacak."
 AAT_norway.7.t:0 "[get_trotsky_lastname] Meksika'ya Varır"
 AAT_norway.8.a:0 "Sonunda!"
 AAT_norway.8.b:0 "Kurtulduk!"
 AAT_norway.8.desc_NOR:0 "Zahmetli eski devrimci [NOR_lev_trotsky.GetName], Moskova'ya götürüldü, burada [SOU.GetLeader]'in keyfine bağlı olarak kontrol altında tutulacak veya belki de idam edilecek.\n\nKaderi ne olursa olsun, nihayet bu uzun meseleden ellerimizi yıkayabiliriz, üstelik [SOU.GetNameDef] ile daha da yakınlaşmanın ek faydasıyla."
 AAT_norway.8.desc_SOV:0 "Bu anı yıllardır hayal ediyorduk. Hain yılan [SOV_lev_trotsky.GetName] elimizde. Devrime ve en önemlisi yoldaş Stalin'e karşı işlediği suçların bedelini ödeyecek. Proletaryanın gözünde ikisi arasında bir fark olduğu söylenemez."
 AAT_norway.8.t:0 "[get_trotsky_lastname] Moskova'ya Varır"
 AAT_norway.9.a:0 "Önümüzde sadece barış ve istikrar var!"
 AAT_norway.9.desc:0 "İşçi Partisi liderliğindeki ve [NOR_johan_nygaardsvold.GetName]'in başında olduğu hükümet, genç ulusumuzun sahip olduğu ilk istikrarlı ve net çoğunluğa sahip hükümettir. Kabine, geçen yıl boyunca [NOR.GetName] ülkesini şu anda içinde bulunduğu derin ekonomik krizden çıkarmaya yardımcı olacak, albeit yavaş da olsa, önlemler için çok çalıştı ve içinde yaşayan insanların refahını güvence altına aldı.\n\nElbette, bu önlemler, savaşa girmemiz durumunda ihtiyaç duyabileceğimiz herhangi bir askeri hazırlık pahasına geliyor. Sadece bunlara ihtiyaç duyulmayacağını umabiliriz."
 AAT_norway.9.t:0 "Nygaardsvold'un Kabinesi"
 AAT_norway_allied.1.a:0 "Gelecekteki bir müttefike yardım etmekten zarar gelmez"
 AAT_norway_allied.1.b:0 "Tehlikeli olabilir"
 AAT_norway_allied.1.desc:0 "[NOR.GetAdjective] hükümeti, bizim yardımımızla sanayilerini geliştirmek istiyor. Bu, kar için harika bir fırsat olurdu ve elbette savaş çıkarsa gelecekte potansiyel bir müttefik olarak onları geliştirmek için de."
 AAT_norway_allied.1.t:0 "[FROM.GetName] yatırım arıyor"
 AAT_norway_allied.2.a:0 "Bu bir ilerlemedir"
 AAT_norway_allied.2.desc:0 "[FROM.GetAdjective] hükümetine yönelik girişimlerimiz başarılı oldu ve ekonomimize yatırım yapmayı kabul ettiler. Bu aynı zamanda onlarla daha da yakınlaşacağımız ve hatta gelecekte onları müttefikimiz olarak sayabileceğimiz anlamına da gelecektir."
 AAT_norway_allied.2.t:0 "[FROM.GetNameDefCap] gelişimimize yatırım yapacak"
 AAT_norway_allied.3.a:0 "Başka yerlere bakmamız gerekecek"
 AAT_norway_allied.3.desc:0 "Çabalarımıza rağmen, [FROM.GetAdjective] yönetimi, savaş durumunda kendimizi savunmak için ihtiyaç duyduğumuz sanayi kapasitesini geliştirmemize yardımcı olmayacaktır.\n\nBunu hatırlamalıyız."
 AAT_norway_allied.3.t:0 "[FROM.GetName] Ekonomimize Yatırım Yapmayacak"
 AAT_norway_allied.4.a:0 "[NOR.NOR_carl_gustav_fleischer.GetName] cesur bir seçim olacaktır"
 AAT_norway_allied.4.b:0 "[NOR.NOR_wilhelm_von_tangen_hansteen.GetName]'in potansiyeli var"
 AAT_norway_allied.4.c:0 "[NOR.NOR_otto_ruge.GetName] güvenli seçenektir"
 AAT_norway_allied.4.desc:0 "Kristian Laake, [NOR.GetAdjective] Ordusu'nda uzun süre hizmet etti ve neredeyse on yıl önce, barış zamanında ve ülkemize yönelik riskin belirginleşmesinden yıllar önce Komutan General olarak atandı.\n\nBir savaş çabasını yönetmesi gerekirse yeteneklerine olan güvenimizi kaybettiğimiz için, değiştirilmesi gerekecek, soru şu ki, [NOR.GetName]'in kuvvetlerini zafere kim götürecek?"
 AAT_norway_allied.4.t:0 "Laake'nin Yerine Geçen"
 AAT_norway_communist.1.a:0 "Barents Denizi gemicilikle dolup taşacak!"
 AAT_norway_communist.1.b:0 "Ticaret burjuva bir kavramdır!"
 AAT_norway_communist.1.desc:0 "Devrimimizi başarmadan yüzyıllar önce, Kuzey Rusya'nın Pomorları, ülkelerinin Kuzeyindeki [NOR.GetAdjective] yoldaşlarımızla hayati ticaret yapmak için Barents Denizi'ni aştılar.\nŞimdi bu uzun süredir devam eden geleneği canlandırmamızı öneriyorlar, bu kesinlikle karşılıklı yarar sağlayacak ve Komünist Uluslarımızı birbirine daha da yakınlaştıracaktır."
 AAT_norway_communist.1.t:0 "[FROM.GetName] Pomor Ticaretini Canlandırmak İstiyor!"
 AAT_norway_communist.2.a:0 "İleri!"
 AAT_norway_communist.2.desc:0 "Ataları gibi, [FROM.GetNameDef] ülkesindeki yoldaşlarımız da en kuzey kıyılarımız üzerinden bizimle ticaret yapmaya hevesli. Bu, her iki ulusumuzun işçilerine komünist yoldaşlığımızın faydalarını gösterecek karşılıklı yarar sağlayan bir düzenleme olacaktır."
 AAT_norway_communist.2.t:0 "Yeni Pomor Ticareti"
 AAT_norway_communist.3.a:0 "Peki o zaman..."
 AAT_norway_communist.3.desc:0 "Barents Denizi üzerinden ortak ticaret geçmişimize rağmen, [FROM.GetNameDef] bunu canlandırmaya değmeyeceğini düşünüyor. En kuzey kıyılarımızı geliştirmek için başka yollar denemeliyiz."
 AAT_norway_communist.3.t:0 "[FROM.GetName] Ticaret Teklifimizi Reddetti"
 AAT_norway_communist.4.a:0 "Silahları düşmanlarımıza karşı savaşacak!"
 AAT_norway_communist.4.b:0 "Silahlarını bize karşı kullanma riskini alamayız"
 AAT_norway_communist.4.desc:0 "[FROM.GetName] ülkesindeki yoldaşlarımızın yardımımıza ihtiyacı var. Devrimleri onları bize yaklaştırdığı için, ordularını modernize etme çabalarını desteklememiz mantıklı.\n\nBir komünist ulusu desteklerken görülmek bizim için siyasi bir zafer olur ve onların işçilerine [ROOT.GetNameDef] ülkesinin bunu nasıl yaptığını gösterir. "
 AAT_norway_communist.4.t:0 "[FROM.GetName] Askeri Sanayilerini Geliştirmemize Yardım Etmemizi İstiyor"
 AAT_norway_communist.5.a:0 "Bu silahları ortak düşmanlarımızla savaşmak için kullanacağız!"
 AAT_norway_communist.5.desc:0 "Yoldaşlarımız mütevazı yardım talebimizi kabul etti ve şimdi askeri sanayimizin Devrimimizin savunma ihtiyaçlarını karşılayacak şekilde genişlemesini sağlayacaklar."
 AAT_norway_communist.5.t:0 "[FROM.GetNameDefCap] kabul etti!"
 AAT_norway_communist.6.a:0 "Korkaklar!"
 AAT_norway_communist.6.desc:0 "Görünüşe göre bize olan güvenlerini çok abartmışız. [FROM.GetName], askeri üretimimizi artırmamıza yardımcı olmaya isteksiz görünüyor."
 AAT_norway_communist.6.t:0 "[FROM.GetNameDefCap] Destek ricalarımızı reddetti!"
 AAT_norway_communist.7.a:0 "Kurtulduk!"
 AAT_norway_communist.7.desc:0 "[NOR.GetAdjective] Monarşisinin kıtadaki en sevilen kraliyet ailelerinden biri olduğu günler çok geride kaldı. Kral Haakon'un sadece bir referandumdan sonra tahta çıkma ısrarı ve iyi niyetli ihmal taahhüdü asil arayışlar olsa da, bir monarşi bir monarşidir ve [ROOT.GetNonIdeologyName] ülkesinde kurmayı umduğumuz eşit toplumda yeri yoktur. \n\nKral Haakon VII ve Prens Olav, Kraliyet Ailesinin geri kalanıyla birlikte tutuklandı ve barışçıl bir şekilde yola çıkarıldı, el konulan varlıkları komünist projemizin inşasında kullanılacak.\n\n[NOR_GetExiledMonarchyLastParagraph]"
 AAT_norway_communist.7.t:0 "Norveç Kraliyet Ailesinin Düşüşü"
 AAT_norway_communist.8.a:0 "Burada hoş karşılanırlar!"
 AAT_norway_communist.8.b:0 "Kalabilirler, ama hoş karşılanmazlar."
 AAT_norway_communist.8.desc_DEN:0 "Norveç'te kendi kraliyet ailesini kurmak için ayrıldıktan sonra, Prens Carl'ımız veya uzun yıllar adıyla anıldığı gibi Haakon VII, [ROOT.GetName] ülkesine geri döndü.\n\nKorkunç bir Komünist Devrim'den sonra aniden tahttan indirildi ve sürgün edildi ve şimdi ailesiyle birlikte ülkemizde bir sürgün hayatını kabul etmek zorunda."
 AAT_norway_communist.8.desc_ENG:0 "Norveç Kraliyet Ailesi yıllardır bizimkiyle bağlantılıdır, Kraliçe Victoria torunu Maud'un gelecekteki Kral Haakon VII, o zamanki Danimarka Prensi Carl ile evliliğine ev sahipliği yapmıştır.\n\nNe yazık ki, bir Devrim onları tahttan indirdi ve Danimarka artık bir seçenek olmadığı için, burada [ROOT.GetName] ülkesinde sığınma aramak zorunda kaldılar."
 AAT_norway_communist.8.desc_SWE:0 "Norveç Kraliyet Ailesi sürgüne gönderildi ve şu anda Danimarka ve Birleşik Krallık'taki akrabalarıyla sığınma bulmak imkansız olduğu için, gururlarını bir kenara bırakıp bizde bir yer aramayı seçtiler.\n\nAilevi bağların olmamasına rağmen, bir İskandinav monarşisini yok olmaktan korumak bizim görevimizdir."
 AAT_norway_communist.8.t:0 "Norveç Kraliyet Ailesi Geldi"
 AAT_norway_fascist.1.a:0 "[FROM.GetName] bize katılacak!"
 AAT_norway_fascist.1.b:0 "İktidarı yerlilerle paylaşmayacağız"
 AAT_norway_fascist.1.desc:0 "Davamıza bağlı [FROM.GetAdjective] milliyetçileri ve faşistlerden oluşan bir koalisyon, [NOR.GetName] ülkesini fethetmede yardımlarını sunuyor. Hükümeti ele geçirmek ve [FROM.GetAdjective] topraklarını bizim adımıza yönetmek için temel hazırlıkları yapmışlar.\n\nEğer bu doğruysa, fırsat kaçırılmayacak kadar iyi olabilir, ancak saldırmaya hazır olduğumuzdan emin olmalıyız."
 AAT_norway_fascist.1.t:0 "[FROM.GetName]'in Nasjonal Samling'i Ülkelerini İşgal Etmemizi İstiyor!"
 AAT_norway_fascist.2.a:0 "Pişman olacaklar!"
 AAT_norway_fascist.2.desc:0 "Cömert teklifimize rağmen, [FROM.GetAdjective] ülkesi, eğer [ROOT.GetName] ülkesini işgal edeceklerse, yardımımıza ihtiyaç duymadıklarını veya istemediklerini bildirdi. Öyle görünüyor ki, [ROOT.GetNameDef] hükümetinin kontrolünü ele geçirme görevimizde yalnızız."
 AAT_norway_fascist.2.t:0 "[FROM.GetNameDefCap] Bizi Reddetti!"
 AAT_norway_fascist.3.a:0 "Zamanı geldi!"
 AAT_norway_fascist.3.desc:0 "[FROM.GetAdjective] faşist partisinden temsilciler bizimle temasa geçti ve [FROM.GetNameDef] ülkesinin hükümetin kontrolünü ele geçirmemiz için ihtiyaç duyduğumuz desteği sağlayacağına dair güvence verdi.\n\nBu, gölgelerden çıkıp [ROOT.GetName] ülkesinde gücü ele geçirmemizi sağlayabilir."
 AAT_norway_fascist.3.t:0 "[FROM.GetNameDefCap] Bize Yardım Edecek!"
 AAT_norway_fascist.4.a:0 "Faşist yoldaşlarımıza yardım edeceğiz"
 AAT_norway_fascist.4.b:0 "Bundan bir kazancımız olmaz"
 AAT_norway_fascist.4.desc:0 "[NOR.GetName] ülkesindeki Faşizm temsilcileri, zayıf ve beceriksiz hükümetlerine rağmen [NOR.GetAdjective] Devletinin kontrolünü ele geçirmek ve bir destek tabanı oluşturmak için büyük bir mücadele verdiklerini söylüyorlar.\n\nAçıkçası, gelecekte faydalı bir müttefik olabilecek bir ulusta iktidar dizginlerini ellerine almaları için onlara yardım etmemiz gerekiyor."
 AAT_norway_fascist.4.t:0 "[NOR.GetAdjective] Meslektaşlarımız Desteğimizi İstiyor"
 AAT_norway_fascist.5.a:0 "$AAT_norway_fascist.3.a$"
 AAT_norway_fascist.6.a:0 "Bir yolunu bulacağız!"
 AAT_norway_fascist.6.desc:0 "[FROM.GetAdjective] faşist partisinden temsilciler bize korkunç haberler getirdi. [FROM.GetNameDefCap] yardım çağrılarımızı reddetti.\n\nBu, [ROOT.GetNonIdeologyName] ülkesinde bizim tarafımızdan kontrol edilen bir faşist rejim arayışımızda yalnız olduğumuz anlamına geliyor."
 AAT_norway_fascist.6.t:0 "[FROM.GetNameDefCap] Reddetti!"
 AAT_norway_monarchist.1.a:0 "Gündemi ne olabilir?"
 AAT_norway_monarchist.1.desc:0 "Kral Haakon'un Storting'in bağımsızlığını koruma ve sorunlarını kendi içinde çözmesine izin verme konusundaki ısrarına rağmen, Mabeyincisi Peder Anker Wedel-Jarlsberg, Norveç Tacı'nın tehlikeli derecede istikrarsız duruma müdahale etmesini öneriyor.\n\nBelirsiz bir yabancı işgal tehdidini gerekçe göstererek, [ROOT.GetName] halkını krala olan güvenlerini ülke çapında göstermeye ve yeminli hükümdarlarından eylem talep etmeye çağırıyor.\n\nKral'ın en yakın sırdaşı ve [NOR.GetName] ülkesindeki en güçlü soylu ailenin iyi bağlantıları olan bir üyesi olduğu için, bu gelişme dikkatli olunmasını gerektirmelidir."
 AAT_norway_monarchist.1.t:0 "Kraliyet Mabeyincisinin Uvertürü"
 AAT_norway_monarchist.2.a:0 "Gelecek başka ne gibi trajediler getirebilir?"
 AAT_norway_monarchist.2.desc:0 "Hayal edilemez olan oldu. Bir kayak kazasından sonra başarılı görünen bir ameliyatın ardından, sevgili Kralımız Haakon VII tıbbi komplikasyonlardan dolayı hayatını kaybetti.\n\nÜlkemiz şimdi tarihinin en karanlık dönemlerinden birini yaşıyor, umalım ki Prens Olav ülkemizi güvenli bir limana yönlendirmek için en kısa sürede tahta çıkar."
 AAT_norway_monarchist.2.t:0 "Kral Öldü! "
 AAT_norway_monarchist.3.a:0 "Umutsuz zamanlar alışılmadık önlemler gerektirir"
 AAT_norway_monarchist.3.b:0 "Dengeyi bozamayız"
 AAT_norway_monarchist.3.desc:0 "Ulusumuz sevgili kralı Haakon VII'nin ölümünü yas tutarken, Prens Olav'ın dikkatinin savaş alanında olduğu ve olmasa bile, adamlarımızı zafere götürmekten başka bir şeye çok üzgün olduğu bildiriliyor. Bu çalkantılı zamanlarda [NOR.GetNameDef] ülkesini kimin yöneteceğini merak ediyoruz. En azından Markis Jarlsberg'in istikrarlı eli için minnettar olabiliriz."
 AAT_norway_monarchist.3.t:0 "Ülkemizin veraseti"
 AAT_norway_monarchist.4.a:0 "Çok Yaşa Kraliçe Mathilde!"
 AAT_norway_monarchist.4.desc:0 "Kraliyet Sarayı'nda kapalı kapılar ardında ne olduğunu asla bilemeyebiliriz, ancak Kraliyet Norveç Hükümeti, merhum Kral Haakon'un Kraliçe Eşi Kraliçe Maude'nin bundan sonra Krallığı Mathilde I adını alarak yöneteceğini duyurdu. Bu özellikle alışılmadık bir durum, çünkü Prens Olav tahtın bir sonraki varisiydi, ancak görünüşe göre bu düzenlemeyi tercih ediyor ki dikkatini savaş çabalarına odaklamaya devam edebilsin. Ayrıca, sonuçta Kraliçe Victoria'nın torunudur, bu yüzden sadece onun adımlarını ve anavatanının veraset yasalarını takip ediyor olacaktı.\n\nÖzellikle, Markis Wede-Jarlsberg'in adı herhangi bir kamu duyurusunda geçmedi, yeni rejimdeki rolü ve nerede olduğu bilinmiyor."
 AAT_norway_monarchist.4.t:0 "Norveç Kraliçesi Mathilde I"
 AAT_norway_monarchist.5.a:0 "Jarlsberg ulusu gerçek kralı olarak yönetecek"
 AAT_norway_monarchist.5.b:0 "Komşularımızla iyi geçinmek en iyisi olacaktır"
 AAT_norway_monarchist.5.c:0 "Nihai hedef, Norveç'i eski ihtişamına geri döndürmektir!"
 AAT_norway_monarchist.5.desc:0 "Yeni naibimiz kralın yerine yetkileri devraldığında, ulus için gerçek niyetlerinin ne olduğu sorgulanmaya başlandı. Uzun vadede Kral Haakon'un yerini mi almak istiyor, yoksa sadece saltanatında ona yardım etmeye mi kararlı? Sadece zaman onun gerçek hırslarının ne olduğunu gösterebilir."
 AAT_norway_monarchist.5.t:0 "Naibin Niyetleri"
 AAT_norway_news.1.a:0 "İlginç..."
 AAT_norway_news.1.desc:0 "Yıllarca süren zorlu sürgünden sonra, ünlü devrimci Lev Troçki [NOR.GetNonIdeologyName] ülkesinden [MEX.GetNonIdeologyName] ülkesine geldi. Ünlü ressam Frida Kahlo ve kocası Diego Rivera tarafından karşılandı, onlar onu Mexico City'deki evlerinde ağırlayacaklar ve kesinlikle Trotski ve karısıyla harika bir uyum içinde olacaklar.\n\nDaha da önemlisi, [SOV.GetNameDef] ülkesindeki düşmanlarının oluşturduğu herhangi bir tehlikeden uzakta olacak ve belki de Latin Amerika ülkesinde sessiz bir sürgünün tadını çıkaracak."
 AAT_norway_news.1.sov:0 "Onunla ilgilenilmeli!"
 AAT_norway_news.2.a:0 "Hepimiz için bir kayıp"
 AAT_norway_news.2.b:0 "Uğraşacak bir kraliyet mensubu daha azaldı!"
 AAT_norway_news.2.desc:0 "Ailesini ve kardeşi Birleşik Krallık Kralı V. George'u görmek için İngiltere'yi ziyareti sırasında, Norveç Kraliçesi Eşi ve ondan önce Galler Prensesi, uykusunda kalp yetmezliğinden öldü. Bu hafta başlarında yapılan bir karın ameliyatından sonra bir komplikasyonun suçlu olduğuna inanılıyor.\n\nNorveç'te çok sevilen bir figürdü ve oğlu Prens Olav ve kocası Norveç kralı Haakon VII tarafından kesinlikle özlenecektir."
 AAT_norway_news.2.t:0 "Norveç Kraliçesi Maud öldü"
 AAT_norway_news.3.desc:0 "Bir kayak kazasından sonra başarılı görünen bir ameliyatın ardından, sevgili Norveç Kralı Haakon VII tıbbi komplikasyonlardan dolayı hayatını kaybetti.\n\nNorveç şimdi tarihinin en karanlık dönemlerinden birini yaşıyor, umarım Prens Olav ülkeyi güvenli bir limana yönlendirmek için en kısa sürede tahta çıkar."
 AAT_norway_news.3.t:0 "Norveç Kralı Haakon VII öldü"
 AAT_norway_news.99.a:0 "Bu iş çığırından çıkıyor!"
 AAT_norway_news.99.desc:0 "Dünyanın çoğu tarafından göz ardı edilmesine rağmen, Topçu ve Tahtın Taşıyıcısı kral Wojtek, bu arktik adanın potansiyelini gördü. \n\nYerel ve yeni gelen kutup ayılarının yardımıyla, Jan Mayen yeniden iskan ediliyor ve her türlü zorluğa göğüs gerebilecek uygun bir ulusa dönüştürülüyor. Gerçekten de Viktorya döneminden beri görülmemiş bir manzara.\n\nVatandaşları arasında, eski adının önemi olmayan, ancak bundan sonra Büyük Amiral Johan Mayen olarak bilinecek olan kutuplaştırıcı bir figür öne çıkıyor."
 AAT_norway_news.99.t:0 "Kral Wojtek, Jan Mayen'i Sürüsüne Kattı"
 AAT_norway_rikstanken.1.a:0 "Komşumuz [?NOR_nordic_tank_seller.GetName]"
 AAT_norway_rikstanken.1.b:0 "[?NOR_communist_tank_seller.GetName] kesinlikle imkanlara sahip"
 AAT_norway_rikstanken.1.c:0 "[?NOR_fascist_tank_seller.GetAdjective] tankları umut verici"
 AAT_norway_rikstanken.1.desc:0 "Tanklar hiçbir zaman [ROOT.GetAdjective] cephaneliğinin bir parçası olmadı ve kendi başımıza yetişmemiz için çok geç olsa da, bu onları tamamen terk etmemiz gerektiği anlamına gelmez.\n\nİlk adım, zırhlı kuvvetlerimizi geliştirmek için ya satın almak ya da işbirliği yapmak üzere uygun bir ortak bulmaktır. Bariz cevap, Avrupa'nın büyük askeri güçlerinden biri olacaktır, ancak belki de eve daha yakın bir sağlayıcı bulmanın uzun vadeli faydaları olabilir."
 AAT_norway_rikstanken.1.t:0 "[ROOT.GetAdjective] Tank Programı"
 AAT_norway_rikstanken.10.a:0 "Sonunda, Norveç tankları!"
 AAT_norway_rikstanken.10.desc:0 "[FROM.GetAdjective] elçileri, elbette ülkelerimiz ideolojik olarak hizalanmaya devam ettiği sürece kendi tanklarımızı geliştirmemize yardımcı olmaya istekli olduklarını doğruladılar. İşbirliğimizin getireceği tank geliştirmeye yönelik yeni yaklaşımlardan onların da faydalanacağından eminiz."
 AAT_norway_rikstanken.10.t:0 "[FROM.GetNameDefCap] Araştırma Anlaşmasını Kabul Etti"
 AAT_norway_rikstanken.11.a:0 "Daha fazla tank!"
 AAT_norway_rikstanken.11.b:0 "Tanklara ihtiyacımız yok"
 AAT_norway_rikstanken.11.desc:0 "Krallığımızın bir süredir bir tankı var ve bu tanka sevgiyle Rikstanken veya ulusun tankı adı verildi. Nasıl çalıştığını ve onunla neler yapabileceğimizi gördük, bu yüzden belki bunu bir adım daha ileri götürüp tankı parçalara ayırarak sonunda kendi tankımızı tasarlayıp üretebiliriz. Ne de olsa, tek bir tankta pek bir savaş avantajı yok."
 AAT_norway_rikstanken.11.t:0 "Rikstanken'den Öğrenebileceklerimiz"
 AAT_norway_rikstanken.12.a:0 "Başka bir yol bulacağız"
 AAT_norway_rikstanken.12.desc:0 "[FROM.GetNonIdeologyName] ülkesinin yardımıyla [ROOT.GetAdjective] tank programını başlatma hevesimize rağmen, talebimizi reddettiler. Bu, silahlı kuvvetlerimizi modernize etme umutlarımıza bir darbe olacaktır."
 AAT_norway_rikstanken.12.t:0 "[FROM.GetName] Teklifimizi Reddetti"
 AAT_norway_rikstanken.2.a:0 "Tek bir tankla deneme yapacağız"
 AAT_norway_rikstanken.2.b:0 "Rekabet edebilmek için sayılara ihtiyacımız var"
 AAT_norway_rikstanken.2.c:0 "Bir ticaret paktı ülkelerimizi ideolojik olarak daha da yakınlaştırabilir"
 AAT_norway_rikstanken.2.d:0 "Kendi tanklarımızı geliştirmek için yardım isteyelim"
 AAT_norway_rikstanken.2.desc_GER:0 "[?NOR_fascist_tank_seller.GetAdjective] Panzerlerinin gücü inkar edilemez ve endüstriyel güçleri, tank kuvvetlerimizi herhangi bir hedefe uygun hale getirmemizi sağlayacaktır. Ayrıca kendi tanklarımızı geliştirmek ve mühendislerine elimizden gelen her şekilde yardımcı olmak için onlarla güçlerimizi birleştirebiliriz.\n\nElbette, bu yaklaşıma nasıl yaklaştığımızdan bağımsız olarak ideolojik olarak onlarla hizalanmamızı bekleyeceklerdir."
 AAT_norway_rikstanken.2.desc_NORDIC:0 "Komşumuz ve diğer Nordik ülke olan [?NOR_nordic_tank_seller.GetName], zırhlı kuvvetlerimizi tedarik etmek için kullanabileceğimiz gelişmiş bir askeri sanayiye kesinlikle sahiptir, ancak küçük ulusumuz için çok maliyetli olacaktır.\n\nAyrıca tek bir tank satın alıp oradan nereye gidebileceğimizi görme seçeneğimiz de var."
 AAT_norway_rikstanken.2.desc_SOV:0 "[?NOR_communist_tank_seller.GetName] üretim araçlarını ele geçirdi, bu da onların büyük miktarlarda tank üretebilecek kapasiteye sahip oldukları anlamına geliyor, bu da düşmanlarımıza yetişmemizi sağlayacaktır.\n\nAyrıca bu fırsatı ulusumuzun işçilerine komünist bir devletin neler yapabileceğini göstermek ve [ROOT.GetName] ülkesinde Komünizme olan desteği artırmak için de kullanabiliriz."
 AAT_norway_rikstanken.2.t:0 "[NOR.GetAdjective] Zırh Programına Yaklaşımımız"
 AAT_norway_rikstanken.3.a:0 "Tek bir tanktan zarar gelmez"
 AAT_norway_rikstanken.3.b:0 "Bu zamanımıza değmez"
 AAT_norway_rikstanken.3.desc:0 "[FROM.GetName] hükümeti, bir tank satın alma izni talep ederek bize başvurdu. İşin garip tarafı, bütçe nedenleriyle, sadece tek bir hafif tank alabiliyorlar... Tareti hariç.\n\nKesinlikle şüpheli olacak kadar sıra dışı bir talep, ancak zırhlı kuvvetlerini nasıl inşa edeceklerine karar vermeden önce denemek istediklerini iddia ediyorlar."
 AAT_norway_rikstanken.3.t:0 "[FROM.GetName] Bir [ROOT.GetAdjective] Tankı Satın Almak İstiyor"
 AAT_norway_rikstanken.4.a:0 "Ticaret Anlaşmasını kuralım"
 AAT_norway_rikstanken.4.b:0 "Bu tanklara ihtiyacımız var"
 AAT_norway_rikstanken.4.desc:0 "[FROM.GetAdjective] hükümeti, zırhlı savaşa ilk adımlarını atmak için tanklarımızı satın almak istiyor.\n\nBu, ekonomimiz ve silah sanayimiz için iyi olurdu, ancak önce kendi tank stoğumuzu ve onlara bir zırhlı kuvvetle güvenip güvenemeyeceğimizi düşünmeliyiz."
 AAT_norway_rikstanken.4.t:0 "[FROM.GetName] Tanklarımızı Satın Almak İstiyor"
 AAT_norway_rikstanken.5.a:0 "İlgilerini memnuniyetle karşılıyoruz"
 AAT_norway_rikstanken.5.b:0 "Bu zamanımıza değmez"
 AAT_norway_rikstanken.5.desc_GER:0 "[FROM.GetAdjective] yönetiminden temsilciler, üstün hafif tanklarımızdan büyük miktarda satın almak istiyor.\n\nBunun yanı sıra, ideolojimizin ilkelerine ilgi gösterdiler ve kendi ülkelerinde yaymak için halklarına zirve [ROOT.GetRulingIdeologyNoun]'un neye benzediğini göstermek istiyorlar."
 AAT_norway_rikstanken.5.desc_SOV:0 "[FROM.GetAdjective] hükümeti, bizden büyük miktarda hafif tank satın alma talebiyle bize başvurdu ve sadece bir ticaret anlaşması değil, aynı zamanda iki halkımız arasında daha yakın ilişkiler de istiyorlar.\n\nBu, [FROM.GetName] halkına üretim araçları ele geçirildiğinde neler başarılabileceğini göstermek için bir fırsat ve gelecekte daha yakın işbirliğine yol açacaktır."
 AAT_norway_rikstanken.5.t:0 "[FROM.GetName] Daha Yakın İlişkiler ve Tanklar Arıyor"
 AAT_norway_rikstanken.6.a:0 "Tankları durdurulamaz olacak"
 AAT_norway_rikstanken.6.b:0 "Buna ihtiyacımız yok"
 AAT_norway_rikstanken.6.desc:0 "[FROM.GetAdjective] hükümeti kendi tank programını geliştirmek istiyor ve yardım için bize bakıyorlar. Sadece teknolojik ve ideolojik bilgi birikimi kazanabileceklerini değil, aynı zamanda kendi tank programımızın da bu düzenlemeden fayda sağlayacağını iddia ediyorlar. "
 AAT_norway_rikstanken.6.t:0 "[FROM.GetName] Tank Araştırmasında İşbirliği Yapmak İstiyor"
 AAT_norway_rikstanken.7.a:0 "Krallığın en iyi fikri!"
 AAT_norway_rikstanken.7.desc:0 "Komşumuz [FROM.GetName], [ROOT.GetName]'in ilk tankının satışını kabul etti. Elbette, pek bir zırhı, hatta bir tareti bile yok, ama biraz çalışmayla, bu [ROOT.GetAdjective] tank kuvvetlerinin başlangıcı olabilir."
 AAT_norway_rikstanken.7.t:0 "Yeni Milli Tankımızı Memnuniyetle Karşılıyoruz"
 AAT_norway_rikstanken.8.a:0 "Sonunda!"
 AAT_norway_rikstanken.8.desc:0 "[FROM.GetAdjective] hükümeti, ulusumuza büyük sayıda tank satma anlaşmasını kabul etti. Bu, ordumuzun gerçekten büyük güçlerle rekabet etmesini sağlayacaktır."
 AAT_norway_rikstanken.8.t:0 "[FROM.GetNameDefCap] Bize Tank Sağlayacak"
 AAT_norway_rikstanken.9.a:0 "Şimdi [FROM.GetRulingIdeologyNoun] galip gelecek"
 AAT_norway_rikstanken.9.desc:0 "[FROM.GetAdjective] liderleri bize tanklarını satmayı kabul ettiler ve onlarla birlikte, [ROOT.GetName] ülkesini [FROM.GetAdjective] [FROM.GetRulingIdeologyNoun] ile daha uyumlu hale getirecek ve böylece daha da yakınlaştıracak resmi bir antlaşma geliyor."
 AAT_norway_rikstanken.9.t:0 "[ROOT.GetAdjective] ve [FROM.GetAdjective] Ulusları Tanklarla Yakınlaşıyor"
 AAT_rikstanken_program_tech_bonus:0 "Norveç Tank Programı"
