 AFG_pashtunwali:0 "Peştunvali"
 AFG_pashtunwali_desc:0 "Peştunlar, nüfusun en büyük ve siyasi açıdan en güçlü kesimini oluşturuyor. Peştunların önemli bir kısmı, Peştunvali olarak bilinen geleneksel etik kuralları ve kurallarına göre yaşıyor. Bu durum, hükümetlerin gücü elinde tutmasını, hatta reform yapmasını zorlaştırıyor, özellikle de geleneksel kodlarla çeliştikleri zaman."
 AFG_placated_graduates:0 "Yatıştırılmış Mezunlar"
 AFG_placated_graduates_desc:0 "Kamu hizmetini genişleterek, aksi takdirde radikalleşebilecek işsiz mezunların büyük bir kısmını istihdam etmeyi başardık."
