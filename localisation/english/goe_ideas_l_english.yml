 AFG_economic_regionalism_desc:0 "Afganistan'ın çeşitli bölgeleri, uygun altyapının olmaması nedeniyle ulusal hükümet veya ekonomiyle güçlü bir bağlantıya sahip değil. Bu durum, ekonomik yüklerin veya kazançların ilgili bölgeler dışında paylaşılmasını zorlaştırıyor ve devam eden izolasyonlarına katkıda bulunuyor."
