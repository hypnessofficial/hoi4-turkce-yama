 AFG_republic_idea:0 "Yeni Cumhuriyet"
 AFG_republic_idea_desc:0 "Yeni cumhuriyetimiz, halkımıza daha önce görülmemiş bir özgürlük ve eşitlik sunacak. Artan istikrar ile birlikte, şimdi eğitim ve ekonomiyi geliştirmeye odaklanabiliriz."
