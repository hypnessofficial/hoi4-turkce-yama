 KUR_resistance_modifier:0 "Kürt Direnci"
 KUR_resistance_modifier_desc:0 "Tüm çabalarımıza rağmen, ülkemizdeki Kürt halkı huzursuzlaştı ve öfkelendi. Yavaş ama emin adımlarla bize karşı isyan etmeye başlıyorlar."
 KUR_united_idea:0 "Birleşik K*rdistan"
 OMA_modernization_initiatives_idea:0 "Modernizasyon Girişimleri"
 PER_a_modern_iran_idea:0 "Modern Bir İran"
 PER_a_modern_iran_idea_desc:0 "Önemli yatırımlar ve çabalar sonucunda nihayet modern bir [PER.GetName] hedefimize ulaştık."
 PER_adult_literacy_idea:0 "Yetişkin Okuryazarlığı Kampanyası"
 PER_adult_literacy_idea_desc:0 "Kendi dillerinde okuryazarlık, insanların kendilerini özgür ve güçlü hissetmelerinin en önemli yollarından biridir. Yetişkinleri eğitim programlarına geri döndürmek için ülke çapında bir kampanya finanse ettikten sonra, [PER.GetNameDef]'ın gelişiminde bir süreliğine artış görmeliyiz."
 PER_aid_communists_cw:0 "Uluslararası Dayanışma"
 PER_aid_communists_cw_desc:0 "Artık emperyalizmin zincirlerini kırdığımıza göre, hala sömürge boyunduruğu altında acı çeken dünyadaki diğer uluslara yardım göndermeye hazır olmalıyız."
 PER_airforce_modifier:0 "İran Hava Kuvvetleri"
 PER_airforce_modifier_desc:0 "İran Hava Kuvvetleri her zaman en yüksek önceliğimiz olmadı, ancak bölümümüzü mükemmelleştirmek ve pilotlarımızı eğitmek için zaman ve kaynak harcamanın zamanı geldiğine inanıyoruz. Dünyaya göklere ne kadar hakim olabileceğimizi göstereceğiz."
 PER_anglo_iranian_oil_ns:0 "Anglo-İran Petrol Şirketi"
 PER_anglo_iranian_oil_ns_desc:0 "Anglo-Pers Petrol Şirketi olarak bilinen AIOC, 1909'da [ENG.GetNameDef] tarafından Mescid-i Süleyman'da önemli bir petrol sahasının keşfedilmesinin ardından kuruldu. [PER.GetNameDefCap]'daki birçok kişi, bu şirketin ülkemizin kaynaklarını ve işgücünü sömürdüğünü ve üzerinde anlaştıkları birçok sözü yerine getirmediklerini düşünüyor."
 PER_anti_soviet_idea:0 "Anti-Sovyet Duygular"
 PER_anti_soviet_idea_desc:0 "İran'ın işgali sırasında topraklarımızı aldıktan sonra, bu savaş çığırtkanlarına karşılık verme ve bize ait olanı geri alma zamanı geldi. Eski topraklarımız bir kez daha bize ait olana kadar durmayacağız."
 PER_azadi_idea:0 "Azadi Ruhu"
 PER_azadi_idea_desc:0 "Azadi veya Farsça'da 'Özgürlük', topraklarımızı işgal eden güçlere karşı ayaklanmaya çalışırken bizi bir araya getirecek çağrımız olacak. İradelerine boyun eğmeyecek, bunun yerine ne kadar sürerse sürsün özgürlüğümüz için savaşacağız."
 PER_azerbaijan_resistance_idea:0 "Azerbaycan Direnci"
 PER_azerbaijan_resistance_idea_desc:0 "[PER.GetNameDefCap], bir zamanlar Azerbaycan halkına ait olan bazı toprakları kapsamaktadır. Bu nedenle, yönetimimizden memnun olmayan önemli bir diaspora bulunmaktadır. Önceki yıllarda hükümetimiz, [PER.GetNameDef] bölgesinde birçok isyanı bastırmayı başarmış olsa da, isyancı duygu hâlâ varlığını sürdürmektedir."
 PER_bofors:0 "Bofors"
 PER_celebration_idea:0 "Kutlama Sonrası Patlama"
 PER_celebration_idea_desc:0 "Eski Pers İmparatorluğu'nun kutlaması bir başarıydı ve bu nedenle ülkenin ekonomisinde büyük bir patlama yaşadık. Yeni kurulan dostluklarımızdan gelen artan turizm ve ticaretle, böyle görkemli bir gösterinin etkisini bir yıl boyunca sürdürebilmeliyiz."
 PER_clash_of_titans_idea:0 "Titanların Çarpışması"
 PER_coastal_fortifications_idea:0 "Sahil Tahkimat Girişimi"
 PER_coastal_fortifications_idea_desc:0 "Donanmamız her zaman en güçlü varlığımız olmadı, bu yüzden [PER.GetNameDef]'ı deniz istilalarından korumak için, sahil şeridimizin herhangi bir çatışma süresince güvende kalmasını sağlamak için sahil tahkimat girişimini uygulamalıyız."
 PER_communist_industrialization_idea:0 "Hızlı Sanayileşme"
 PER_communist_industrialization_idea_desc:0 "Yeni sosyalist hükümetimizin zamanın testine dayanabilmesi için hızla sanayileşmesi gerekecek. Sonuçta, muhtemelen proletaryanın yükselişinden korkanlar için bir tehdit haline geldik."
 PER_compliant_subject_idea:0 "Uyumlu Bağlı Devlet"
 PER_compliant_subject_idea_desc:0 "[ROOT.OVERLORD.GetNameDef] gibi bir güce karşı durarak kazanılacak bir zafer yok. Bunun yerine, bir uyruk olarak rolümüzü oynamalı ve güçlü bir vasal olmaya layık olduğumuzu göstermeliyiz."
 PER_complient_king:0 "Uyumlu Kral"
 PER_conscription_idea:0 "Her Adam Hizmet Eder"
 PER_conscription_idea_desc:0 "Çaresiz zamanlar, çaresiz önlemler gerektirdi. Tamamen profesyonel bir ordu oluşturmak için zaman ve kaynak ayıramasak da, bunun yerine her sağlıklı erkeğin ülkesini savunmak için silah alabileceğinden emin olabiliriz."
 PER_constitutional_shah:0 "Rıza Şah Pehlevi"
 PER_constitutional_shah_desc:0 "[PER.GetNameDef]'da inanılmaz değişikliklerin yüzü olmasına rağmen, Rıza Şah Pehlevi artık anayasal monark pozisyonuna indirgendi. Yeni hükümetimiz ülkenin kontrolünü ele aldığı için artık sadece bir figürden ibaret."
 PER_defensive_maneuvers_modifier:0 "Savunma Manevraları"
 PER_defensive_maneuvers_modifier_desc:0 "Savunmalarımız, düşmanın şehirlerimizi tehdit etmesini engellemek için bir dağ silsilesi kadar sarsılmaz olmalı. Yeni uygulamaya koyduğumuz savunma manevralarımız, umarız ki düşman kuvvetlerini yerlerinde tutacaktır!"
 PER_deposed_shah_trait:0 "Tahttan İndirilmiş Şah"
 PER_desert_training_idea:0 "Özel Çöl Eğitimi"
 PER_desert_training_idea_desc:0 "Uzun tatbikatlar ve kumlu ovalarda yürüyüşlerden sonra, nihayet birliklerimize çöl savaş alanlarında hayatta kalma şansını daha iyi vermek için tasarlanmış etkili bir eğitim programı oluşturduk."
 PER_disinherited_heir_trait:0 "Mirastan Mahrum Varis"
 PER_enemy_war_reparations_idea:0 "Savaş Tazminatları"
 PER_enemy_war_reparations_idea_desc:0 "[PER.GetNameDef]'daki operasyonumuzun başarısızlığı nedeniyle, şimdi işgalimizin büyük maliyetini ödemek zorundayız. Bu ideal olmasa da, tazminatlarımızı iki yıl içinde tamamlayabilmeliyiz."
 PER_fascism_sway_the_rich_idea:0 "Elitleri İkna Et"
 PER_fascism_sway_the_rich_idea_desc:0 "Yeni hükümetimizin gelişebilmesi için, ulus üzerindeki kontrolümüzü sürdürebilmek adına mümkün olduğunca çok İranlı elitin yanımızda yer almasını sağlamalıyız."
 PER_feat_of_engineering_idea:0 "Mühendislik Harikası"
 PER_feat_of_engineering_idea_desc:0 "Nihayet, Trans-İran Demiryolu'nu tamamladık. Bu hayati bağlantıyı engebeli arazimizden geçirerek şehirlerimizin iyi bir şekilde bağlantılı kalmasını sağladık. Bu [PER.GetAdjective] mühendisliğinin güzel bir örneğiyle gurur duymalıyız."
 PER_food_for_all_idea:0 "Her [PER.GetAdjective] İçin Gıda"
 PER_food_for_all_idea_desc:0 "Kıtlık, ülkemizde çok uzun zamandır bir sorun oldu. Vatandaşlarımızın temel gıdaya erişimini sağlayan yeni bir program başlattıktan sonra, bir daha böyle karanlık bir çukura düşmekten kaçınabiliriz."
 PER_foreign_retraining_idea:0 "Yabancı Yeniden Eğitim Girişimi"
 PER_foreign_retraining_idea_desc:0 "Yabancı subaylara ulaşarak birliklerimizi eğitmelerini sağlayarak, şu anda kötü eğitimli ve düzensiz olan ordumuzu iyileştirmek için gerekli ilk adımları attık."
 PER_fund_state_intelligence_idea:0 "Devlet İstihbaratını Fonlama"
 PER_fund_state_intellignece_idea_desc:0 "Devlet güvenliğini izleme yeteneğimizi geliştirmek için, kaynaklarımızı devlet istihbarat programı üzerinde daha büyük bir kontrol oluşturmaya yönlendirdik."
 PER_future_of_war_idea:0 "Savaşın Geleceği"
 PER_future_of_war_idea_desc:0 "Tankın, savaşın geleceğinin bir simgesi olduğu gerçeği inkar edilemez. Kaynaklarımızı zırhlı teknolojimizi geliştirmeye yönlendirerek, modern bir savaşa katılmak için kendimizi başarılı bir şekilde hazırladık."
 PER_glory_of_cyrus_trait:0 "Büyük Kiros'un Zaferi"
 PER_gulf_hegemony_idea:0 "Körfez Hegemonyası"
 PER_gulf_hegemony_idea_desc:0 "Dikkatli manevralarla, nihayet kendimizi Körfez bölgesindeki ana güç olarak konumlandırdık."
 PER_heistant_king_trait:0 "Tereddütlü Kral"
 PER_hellmand_altered_adopted_treaty:0 "Afgan-İran Su Anlaşması"
 PER_hellmand_altered_no_treaty:0 "Afgan Helmand Nehri Projeleri"
 PER_homeland_not_fall_idea:0 "Savaşçı Ruhumuz"
 PER_homeland_not_fall_idea_desc:0 "Yurdumuzu tehdit edenlere karşı metanetimizi gösterme zamanı geldi. Askerleri seferber edin, kardeşlerinize inanın ve ülkemizin geleceği için savaşmaya hazırlanın. [PER.GetNameDefCap] bu savaşçılara düşmeyecek! Kuyruklarını bacaklarının arasına alıp kaçmalarını sağlayın!"
 PER_idea_comintern_research_collaboration:0 "[ROOT.GetFactionName] Araştırma İşbirliği"
 PER_idea_comintern_research_collaboration_desc:0 "[ROOT.GetAdjective] bilim insanları, becerilerini eve götürmeden önce [SOU.GetAdjective] uzmanları tarafından eğitilecek ve ulusumuzu [SOU.GetAdjective] modeline göre yeniden inşa edecekler."
 PER_idea_one_for_all_all_for_one:0 "Hepimiz Birimiz, Birimiz Hepimiz İçin"
 PER_idea_one_for_all_all_for_one_desc:0 "Üstümüze düşeni fazlasıyla yapmalı ve her [ROOT.GetAdjective] vatandaşının [ROOT.GetNameDefCap]'ı bir anda savunmaya hazır olduğundan emin olmalıyız. Ancak bu şekilde dünya güçlerine karşı bir şansımız olabilir ve Büyük Oyun'dan sonra egemenliğimizi ve kimliğimizi koruyabiliriz."
 PER_idea_reject_foreign_dominance:0 "[ROOT.GetAdjective] Dayanışması"
 PER_idea_reject_foreign_dominance_desc:0 "Yabancı güçler sınırlarımızda tehditkar bir şekilde beklerken, boyun eğmeyecek, aksine sonuna kadar direnecek ve savunacağız. [ROOT.GetAdjective] egemenliği ve kimliği, bedeli ne olursa olsun hayatta kalacak."
 PER_imperial_expansionism_idea:0 "İmparatorluk Yayılmacılığı"
 PER_imperial_expansionism_idea_desc:0 "Dünyaya [PER.GetNameDef]'ın ne kadar yetenekli olduğunu gösterme zamanı geldi. Fabrika hatlarını ateşledik, halkı seferber ettik. Yakında, zafer ve ihtişam için savaşa yürüyeceğiz!"
 PER_invite_foreign_investors:0 "Yabancı Yatırım"
 PER_invite_foreign_investors_desc:0 "Dünyadaki diğer demokrasilere ulaşarak, filizlenen ekonomimize kaynak enjekte edebildik ve onu canlandırabildik."
 PER_iranian_oil_company:0 "Sherkat-e Melli-ye Naft-e Īrān"
 PER_iranian_radio_idea:0 "Ulusal İran Radyosu"
 PER_iranian_radio_idea_desc:0 "Ulusal radyo yayın sistemimiz, halkın tam olarak aynı çizgide olmadığı konularda devlet görüşünü teşvik etmeye yardımcı olacak."
 PER_islamic_traditions_ns:0 "İslami Gelenekler"
 PER_islamic_traditions_ns_desc:0 "Geleneksel olarak İran, nesiller boyu İslam'ı takip etmiştir. Devlet dini olarak kabul edilir ve nüfusun çoğunluğu tarafından benimsenir. Hükümette din ve devleti laikleştirmeyi amaçlayanlar olsa da, bunu yapmak büyük bir çaba gerektirecek ve büyük bir direnişle karşılaşacaktır."
 PER_kurdistan_resistance_idea:0 "Kürt Direnci"
 PER_kurdistan_resistance_idea_desc:0 "[PER.GetNameDefCap], bir zamanlar Kürt halkına ait olan bazı toprakları kapsamaktadır. Bu nedenle, yönetimimizden memnun olmayan önemli bir diaspora bulunmaktadır. Önceki yıllarda hükümetimiz, [PER.GetNameDef] bölgesinde birçok isyanı bastırmayı başarmış olsa da, isyancı düşünceler hâlâ varlığını sürdürmektedir."
 PER_legacy_of_greatness_modifier:0 "Büyüklük Mirası"
 PER_legacy_of_greatness_modifier_desc:0 "Pehlevi Hanedanı, [PER.GetNameDef]'ı büyüklüğe ve ötesine götürmek için kaderinde olan bir kraliyet ailesi olarak kendini kanıtladı. Reformları bazıları tarafından sevilmemesine rağmen, ülkeye getirdikleri radikal değişimin, dünyanın geri kalanının bizi bu noktadan sonra nasıl göreceğini etkileyeceğine şüphe yok."
 PER_lingering_islamic_beliefs:0 "Kalıcı İslami İnançlar"
 PER_metropolitan_iran_idea:0 "[PER.GetAdjective] Metropol"
 PER_metropolitan_iran_idea_desc:0 "[PER.GetAdjective] metropolünü yalnızca Tahran'ın sınırlarıyla sınırlı olmaktan çıkararak başarıyla genişlettik. Şehirlerimiz, kapsamlı modernleşme çabalarımız sayesinde büyüyüp gelişiyor. Bu gerçekten görkemli bir gün!"
 PER_military_excellency_idea:0 "[PER.GetAdjective] Askeri Mükemmellik"
 PER_military_excellency_idea_desc:0 "Nihayetinde, ayakta duran ordumuz söz konusu olduğunda katı ve profesyonel eğitime odaklanmaya karar verdik. Günün sonunda, iyi disiplinli birlikler savaşı kazanacak. Nicelik değil nitelik!"
 PER_modernizing_iran_idea:0 "Modernizasyon Girişimi"
 PER_modernizing_iran_idea_desc:0 "[PER.GetNameDef]'ı modernleştirmek, dünyanın büyük uluslarıyla yan yana durabilmemiz için çok önemli. Bu girişimi yürüterek, büyük ulusumuzun altyapısını iyileştirmeye ve vatandaşlarının yaşamlarını geliştirmeye kendimizi adadığımızın bir işaretidir."
 PER_modify_iranian_airforce_ns_intro:0 "§Y$PER_airforce_modifier$§! şu şekilde değiştir"
 PER_modify_special_forces_ns_intro:0 "§Y$PER_special_units_division_idea$§! şu şekilde değiştir"
 PER_motorization_investments_idea:0 "Motorizasyon Yatırımları"
 PER_motorization_investments_idea_desc:0 "Motorlu silah endüstrimizi geliştirmeye yaptığımız yatırımlar, birliklerimizin savaş alanlarında hız ve hassasiyetle hareket ettiğinde karşılığını verecek."
 PER_national_bank_iran:0 "Bânk-e Melli-ye Irân"
 PER_offensive_tactics_modifier:0 "Saldırı Taktikleri"
 PER_offensive_tactics_modifier_desc:0 "[PER.GetNameDef]'ı korumanın tek yolu hemen saldırıya geçmektir. Bu yeni taktiklerle uygulamaya konduğunda, düşmanı geri püskürtmek için iyi bir konumda olacağız!"
 PER_oil_baron_idea:0 "[PER.GetAdjective] Petrol Baronu"
 PER_oil_baron_idea_desc:0 "Ülkemiz, özellikle de [ENG.GetAdjective] etkisini kaynaklarımız üzerinden kaldırmak için attığımız adımlardan sonra, kesinlikle petrolle dolu. Tüm bu petrolle ne yapacağız? Kendimiz için biriktireceğiz."
 PER_old_ways_idea:0 "Yeniden Canlanan Zerdüştlük"
 PER_old_ways_idea_desc:0 "Zerdüştlük, dünyanın en eski tek tanrılı dinlerinden biridir ve MÖ 6. yüzyılda eski Pers'te kurulmuştur. Bu dinin eski Pers İmparatorluklarının kültürü için ne kadar hayati olduğu göz önüne alındığında, geçmiş ihtişamın görüntüsünü koruyacağını umarak onu yeniden canlandırdık."
 PER_opposition_cell:0 "Muhalefet Hücresi Aktif"
 PER_opposition_modifier:0 "Yükselen Muhalefet"
 PER_opposition_modifier_desc:0 "Pehlevi Rejimine duyulan nefret arttıkça, giderek daha fazla insan mevcut hükümete karşı çıkmak için bir araya geliyor. Bu durum devam ederse, ülke huzursuz bir gelecekle karşı karşıya kalabilir."
 PER_paying_for_baluchistan_idea:0 "Belucistan İçin Ödeme Yapılıyor"
 PER_paying_for_baluchistan_idea_desc:0 "Ne yazık ki, [RAJ.GetNameDef] bu toprakların bedelsiz gitmesine izin vermeyecek. Borcumuzu bir yıl boyunca ödemek zorunda kalacağız."
 PER_persepolis_idea:0 "Persepolis Yeniden İnşa Edildi"
 PER_persepolis_idea_desc:0 "Yeni bir emperyal güç olarak gücümüzün bir göstergesi olarak, Ahameniş İmparatorluğu'nun tören başkentini başarıyla yeniden inşa ettik. Persepolis, sonsuza kadar [PER.GetAdjective] mükemmelliğinin bir simgesi olarak kalacak."
 PER_persian_german_trade_idea:0 "Pers-Alman Ticaret Odası"
 PER_persian_german_trade_idea_desc:0 "[PER.GetNameDef] ve [GER.GetNameDef] arasında olumlu ticaret ilişkilerini teşvik etmek ve dünyanın en önde gelen sanayi güçlerinden birinin modelini kullanarak endüstrimizin modernizasyonunu sağlamak için kurulan bir organizasyon."
 PER_preemtive_strike_idea:0 "İlk Vuruş"
 PER_preemtive_strike_idea_desc:0 "İşgal edilmek için bekleyecek zamanımız yok! Demir sıcakken vurmanın ve egemenliğimizi tehdit eden daha büyük uluslarla aramıza bazı tampon devletler koyabilmenin kritik önemi var!"
 PER_price_stabilization_idea:0 "Fiyat İstikrarı"
 PER_price_stabilization_idea_desc:0 "Çok uzun zamandır fabrika sahipleri ve büyük zincir işletmeleri, işçilerinden ve müşterilerinden mantıksız bir şekilde kâr elde ediyor. [PER.GetNameDef] genelinde fiyatları istikrara kavuşturarak ülke çapında mal fiyatlarını sabitlemeliyiz."
 PER_promoting_resistance_here:0 "Burada Direnci Teşvik Ediyor"
 PER_qorkhaneh:0 "Qorkhaneh"
 PER_rapid_appeasement_idea:0 "Hızlı Yatıştırma"
 PER_rapid_appeasement_idea_desc:0 "Potansiyel bir İslam Devrimini engellemek için, muhalefeti yatıştırmak amacıyla tazminat teklif ettik. Bu, gelişmemizi yavaşlatsa da, ülkemizi bir süreliğine istikrarlı tutmaya yardımcı olmalı."
 PER_resist_gharbzadegi_idea:0 "Gharbzadegi'ye Direniş"
 PER_resist_gharbzadegi_idea_desc:0 "Aşırı batılılaşma, büyük ulusumuz için bir bela oldu. Bölgemizi yüzyıllardır sömürenlerin kaprislerine uymak yerine, kendi ayakları üzerinde durabilen demokratik bir rejim oluşturmak için çalışmalıyız."
 PER_resistance_modifier:0 "Direnç Hücreleri"
 PER_resistance_modifier_desc:0 "Bu bölge, [PER.GetNameDef] tarafından düzenlenen direnç hücreleri tarafından rahatsız ediliyor."
 PER_restoring_the_nation_idea:0 "Ulusu Yeniden İnşa Etme"
 PER_restoring_the_nation_idea_desc:0 "Hükümeti yeniden yapılandırarak ulusumuzda istikrarsızlık ve bölünme yarattık, planlarımızla ilerlemeden önce ulusumuzun istikrarını ve birliğini yeniden sağlamalıyız."
 PER_rightful_king_trait:0 "Haklı Kral"
 PER_rural_feudalism_ns:0 "Kırsal Feodalizm"
 PER_rural_feudalism_ns_desc:0 "Feodalizm, toprak sahipliği karşılığında hizmet ve emek üzerine kurulu, modası geçmiş bir toplum yapılandırma sistemidir. Ortaçağ kavramı olmasına rağmen, [PER.GetNameDef]'ın birçok kırsal bölgesinde hala geçerliliğini koruyor."
 PER_savak_idea_no_lar:0 "SAVAK Kuruldu"
 PER_savak_idea_no_lar_desc:0 "SAVAK, [PER.GetNameDef]'a hizmet eden özel bir ajans ve gizli polistir. Logodaki Pers Aslanı ile güçlendirilen subaylarımız, büyük ülkemizin ulusal güvenliğini sağlamak için durmaksızın çalışıyor."
 PER_savak_lar:0 "$PER_savak_idea_no_lar$"
 PER_savak_lar_desc:0 "$PER_savak_idea_no_lar_desc$"
 PER_savior_of_iran:0 "[PER.GetNameDefCap]'ın Kurtarıcısı"
 PER_secularized_state_democratic_idea:0 "Laik Bir Devlet"
 PER_secularized_state_idea:0 "Laik Devlet"
 PER_secularized_state_idea_desc:0 "Pehlevi hanedanı altında, dünyanın diğer büyük uluslarıyla birlikte ayakta durabilmek için [PER.GetNameDef]'ın modernleşmesi gerektiği kararlaştırıldı. Bu, din ve devletin ayrılmasını da içeriyor. İnsanlar İslam'ı uygulamaya devam edebilir, ancak artık ülkemizin siyasetinde söz sahibi olmayacak."
 PER_shahanshah_trait:0 "Şehinşah"
 PER_sold_baluchistan_idea:0 "Belucistan Satıldı"
 PER_sold_baluchistan_idea_desc:0 "[PER.GetNameDef] Belucistan topraklarını talep ettiğinde, başımızı ağrıttıkları için onlardan biraz para sızdırabildik. Yaklaşık bir yıl boyunca ödeme alacağız."
 PER_special_units_division_idea:0 "Özel Birlikler Bölümü"
 PER_special_units_division_idea_desc:0 "Askeri kuvvetlerimiz artık bir özel birlikler bölümü ile destekleniyor. Artık yeni birimleri sahaya sürmemize izin verecek şekilde kuvvetlerimizi genişletebilir ve aynı zamanda bir istihbarat programının oluşturulmasının yolunu açabiliriz."
 PER_spoils_of_war_idea:0 "Savaş Ganimetleri"
 PER_spoils_of_war_idea_desc:0 "Müttefiklerimize savaşlarında başarıyla yardım ettikten sonra, çatışmanın doğrudan bir sonucu olarak kendi topraklarımızı güvence altına alabildik. Artık bu toprakları büyüyen etki alanımıza katma zamanı."
 PER_stand_with_giants_modifier:0 "Devlerle Birlikte Ayakta Durmak"
 PER_stand_with_giants_modifier_desc:0 "Rıza Şah Pehlevi iktidara geldiğinden beri, [PER.GetNameDef]'ı modernleştirmek ve dünyanın diğer büyük uluslarıyla aynı seviyeye getirmek istedi. Bu, [PER.GetNameDef]'da birçok yeni sosyal, ekonomik ve siyasi reformun başlangıcıdır ve bu yönde ilerledikçe gelişecektir."
 PER_state_atheism_idea:0 "Tam Laikleşme"
 PER_state_atheism_idea_desc:0 "Batıdaki ulusları taklit etmek ve [PER.GetNameDef]'ı modern çağa getirmek nihai hedefimizdir. Artık kendimizi dini doktrinler tarafından geri tutulmaya izin veremeyiz. Ülkemizin din adamlarını üzse de, [PER.GetNameDef] için vatandaşlarımız arasında ateizmi teşvik etmek iyidir."
 PER_state_local_defensive_dynamic_modifier:0 "Yerel Savunma Prosedürleri"
 PER_technological_modifier:0 "Teknolojik Yatırımlar"
 PER_tehran_armor_manufacturer:0 "Tahran Zırh"
 PER_tehran_power_grid_idea:0 "Genişletilmiş Tahran Elektrik Şebekesi"
 PER_tehran_power_grid_idea_desc:0 "Tahran'da yeni bir dizi Enerji Santralinin kurulmasıyla, elektrik kapsamını artırarak ülkemizi modernleştirmeye devam ediyoruz."
 PER_the_new_economy_idea:0 "Yeni Ekonomi"
 PER_the_new_economy_idea_desc:0 "Yeni ekonomimiz, piyasa eğilimlerini takip etmek yerine nüfusumuzun ihtiyaçları üzerine inşa edildi. Sonuçta, kapitalizmin işçi sınıfımıza verdiği zarardan kaçınmak istiyoruz."
 PER_trans_iranian_railway_idea:0 "Trans-İran Demiryolu İnşası"
 PER_trans_iranian_railway_idea_desc:0 "Trans-İran Demiryolu, ülkemizdeki mühendislik alanındaki en büyük başarılarımızdan biri olacak. Bu ulusal demiryolunun inşasına çabalarımızı odaklayarak, savaş zamanlarında seferberlik çabalarımızı artırabileceğiz."
 PER_transfer_officer_idea_lar:0 "Subaylar İstihbarata Transfer Edildi"
 PER_transfer_officer_idea_lar_desc:0 "İstihbarat ajansımız büyüdükçe, bazı yeni subayları saflarına transfer etme ihtiyacı hissettik. Bunu yapmak, departmandaki verimliliği artırdı ve ulusumuzun güvenliğini sağlayacak."
 PER_transfer_officer_idea_no_lar:0 "$PER_transfer_officer_idea_lar$"
 PER_transfer_officer_idea_no_lar_desc:0 "$PER_transfer_officer_idea_lar_desc$"
 PER_trial_fifty_three_idea:0 "Elli Üç'e Karşı Dava Açıldı"
 PER_trial_fifty_three_idea_desc:0 "Komünist siyasi faaliyetlerde bulundukları gerekçesiyle elli üç İranlıyı tutukladıktan sonra, onları hükümet karşıtı görüşleri nedeniyle yargılayabildik. Ülkemiz için böyle kritik bir zamanda böyle bir muhalefetin kök salmasına izin veremezdik."
 PER_unification_initiative_idea:0 "Birleşme Girişimi"
 PER_unification_initiative_idea_desc:0 "Ülkemizin kısmen parçalanmış olduğu bir sır değil. Yönetimimiz, Kürtler ve Azerbaycanlıların yanı sıra kendi hükümetimiz içinden gelebilecek isyanlarla tehdit altında. Birleşme Girişimi, bu tehditleri ortadan kaldırmak ve [PER.GetNameDef] üzerindeki hegemonyamızı sağlamlaştırmak için hizmet edecek."
 PER_venerated_islam_idea:0 "İslam Yüceltildi"
 PER_venerated_islam_idea_desc:0 "Devlet ve dinin ayrılması konusundaki başlangıçtaki görüşümüze rağmen, artık halkın iradesini görmezden gelemeyiz. İslam, [PER.GetAdjective] kültürünün birçok yıldır önemli bir parçası olmuştur ve bu geleneklerden kendimizi arındırmak aptalca olurdu."
 PER_war_plan_cambyses_idea:0 "Cambyses Savaş Planı"
 PER_war_plan_cambyses_idea_desc:0 "II. Cambyses, Ahameniş İmparatorluğu'nun ikinci Kralıydı. MÖ 530'dan itibaren hüküm sürdü ve saltanatı, özellikle Mısır'da Firavun olduğu Kuzey Afrika'daki fetihleriyle damgasını vurdu. Onun izinden giderek batıya ilerlemeli ve eski topraklarını geri almalıyız."
 PER_war_plan_darius_idea:0 "Darius Savaş Planı"
 PER_war_plan_darius_idea_desc:0 "Büyük Darius, Ahameniş İmparatorluğu'nun üçüncü Kralıydı. İmparatorluğu toprak zirvesinde yönetti ve modern Pakistan'daki İndus Vadisi'ne kadar Pers etkisini yaydı. Onun yayılmacı ideallerini benimseyerek doğudaki düşmanlarımıza karşı ilerleyelim!"
 PER_war_plan_xerxes_idea:0 "Xerxes Savaş Planı"
 PER_war_plan_xerxes_idea_desc:0 "Büyük Xerxes, Ahameniş İmparatorluğu'nun dördüncü Kralıydı. En çok MÖ 480'de Yunanistan'ı işgaliyle tanınır ve bu Pers yenilgisiyle sonuçlansa da, bu sefer biz galip geleceğiz. Ege'ye doğru ilerleyelim ve Türk yarımadasını geri alalım."
 PER_white_revolution_idea:0 "Beyaz Devrim Başlatıldı"
 PER_white_revolution_idea_desc:0 "Ülkemizin modernizasyonunu hızlandırmak için agresif reformlar gerekiyor. Beyaz Devrim veya Şah ve Halk Devrimi, [PER.GetNameDef]'ı batıdaki büyük ulusların seviyesine getirmeye hizmet edecek."
