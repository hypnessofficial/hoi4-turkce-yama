 IRQ_agrarian_society_desc:0 "Irak'ın endüstrisi tarım sektörü etrafında dönüyor ve bölgedeki muhafazakar liderlik, toprakları geliştirme ve sanayileştirme konusunda hiçbir ilgi göstermedi. Devletteki sorunları çözmek için uygun zaman ve çaba harcanması gerekecek."
