 AFG_turkish_military_mission:0 "Türk Askeri Misyonu"
 AFG_turkish_military_mission_desc:0 "1933'ten beri Türk askeri personeli, Afgan askerlerinin yeni neslini eğitmeye yardımcı oluyor. Belki zamanla bu düzenleme, iki büyük ulusu birbirine daha da yakınlaştırmak için genişletilebilir."
