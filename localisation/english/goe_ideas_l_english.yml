 IRQ_royal_army_modifier_KUR:0 "Kürt Ordusu"
 IRQ_royal_army_modifier_desc:0 "1921'de [ENG.GetAdjective]'nin gözetimi altında kurulan Irak Ordusu, komşu devletlerden gelebilecek saldırılara karşı bir caydırıcı olarak hizmet etti. Ancak, ordunun üst düzey subayları, yalnızca komşuları caydırmakla kalmayıp onlara hakim olmak için kuvvetlerini genişletme ve modernize etme fırsatı arzuluyor."
