 AFG_subsistence_economy_modifier:0 "Geçimlik Ekonomi"
 AFG_subsistence_economy_modifier_desc:0 "Nüfusun büyük çoğunluğu kırsal alanlarda yaşıyor ve yalnızca kendileri ile ailelerinin sert kış aylarını geçirebileceği kadar gıda üretiyor. Kabul'de kimin gücü elinde tuttuğuna bakılmaksızın, kâr getiren endüstrilere uyum sağlamak için yaşam tarzlarını değiştirmeye pek ilgi duymuyorlar ve bu zihniyetlerini değiştirmeleri de olası görünmüyor."
