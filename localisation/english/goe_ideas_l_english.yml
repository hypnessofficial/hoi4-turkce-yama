 AFG_mohammad_zahir_shah_ns:0 "Kral Zahir Şah"
 AFG_mohammad_zahir_shah_ns_desc:0 "Kral Zahir Şah, 1933'te babasının ölümünün ardından tahta çıktı. Ancak genç yaşı ve kendine ait bir siyasi tabanının olmaması nedeniyle, hükümette gerçek güç amcalarının elinde bulunuyor ve kendisi yalnızca sembolik bir figür olarak kalıyor. Zahir Şah, kendi gündemini takip etmek istiyorsa, zamanını beklemek ya da amcalarını hızla görevden uzaklaştırmak arasında bir seçim yapmak zorunda kalacak."
