 IRQ_anglo_iraqi_treaty:0 "İngiliz-Irak Anlaşması"
 IRQ_anglo_iraqi_treaty_desc:0 "1930'da yeniden müzakere edilmiş olsa da, İngiliz-Irak anlaşması, Irak'ı fiilen Britanya İmparatorluğu'nun bir müşteri devleti olarak bırakan tek taraflı bir anlaşma olmaya devam ediyor. Anlaşma, Irak'ın petrol kaynakları üzerinde İngilizlere tercihli haklar veriyor ve ülke genelindeki askeri tesisleri kullanmalarına izin veriyor. Bu durum, gerçek bağımsızlık özlemi çeken Iraklılar arasında büyük bir hoşnutsuzluğa neden olmaya devam ediyor. İktidara gelen herhangi bir hükümet, anlaşmayı yeniden müzakere etmek ya da yırtıp atmak ve İngiliz ordusunun öfkesini riske atmak arasında bir seçim yapmak zorunda kalacak."
