 IRQ_al_muthanna_club_idea:0 "El-Müsanna Kulüpleri"
 IRQ_al_muthanna_club_idea_desc:0 "El-Müsanna Kulüpleri, Irak toplumunda Arap milliyetçiliğini ve anti-emperyalist duyguları teşvik eden güçlü bir güçtür. Irak gençliği arasında birlik ve gurur ilham verirken, radikal retorikleri ve siyaset üzerindeki etkileri, kırılgan devletteki bölünmeleri derinleştirme ve istikrarsızlaştırma riski taşıyor."
