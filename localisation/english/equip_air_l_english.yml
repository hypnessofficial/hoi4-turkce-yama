 CAS_equipment:0 " Yakın Hava Desteği"
 CAS_equipment_1:0 "Yakın Hava Desteği I"
 CAS_equipment_1_desc:0 "YHD doktrinimiz, hassas yüzey saldırısı yapabilen bir uçak gerektirir. Bu uçaklar daha büyük Taktik Bombardıman Uçaklarımıza kıyasla daha az yük taşıyabilir, ancak tarama ve dalış bombardımanı ile küçük fırsat hedeflerine saldırıp yok edebilirler."
 CAS_equipment_1_short:0 "YHD I"
 CAS_equipment_2:0 "Yakın Hava Desteği II"
 CAS_equipment_2_desc:0 "Erken savaş deneyimleri, artırılmış hız, zırh ve manevra kabiliyetinin YHD uçaklarının düşman avcı uçaklarına ve yer ateşine karşı hayatta kalması için gerekli olduğunu göstermiştir. Bu yeni nesil kara saldırı uçakları, hedeflerine daha fazla zarar vermek için daha büyük bombalar, toplar ve makineli tüfekler de kullanacaktır."
 CAS_equipment_2_short:0 "YHD II"
 CAS_equipment_3:0 "Yakın Hava Desteği III"
 CAS_equipment_3_desc:0 "Hedef uçaksavar ve düşman avcı uçaklarının sürekli artan yetenekleri, YHD uçaklarımızın daha da evrim geçirmesini gerektirir. Yeni tasarım, artırılmış motor gücü, dalış yeteneği ve koruma için uçak gövdesi iyileştirmeleri ve daha da büyük yükler içerir."
 CAS_equipment_3_short:0 "YHD III"
 CAS_equipment_desc:0 "Yakın Hava Desteği uçakları, kara savaşında destek sağlamak için tasarlanmıştır."
