 tac_bomber:0 " Taktik Bombardıman Uçağı"
 tac_bomber_equipment:0 " Taktik Bombardıman Uçağı"
 tac_bomber_equipment_0:0 "Savaşlar Arası Bombardıman Uçağı"
 tac_bomber_equipment_0_desc:0 "Bir sonraki savaşın tamamen düşmanı bombalayarak kazanılacağına yaygın olarak inanılıyor. Ağır yükleri yeterli hızda taşıyabilen kendi bombardıman uçağımızı tasarlamaya başlamamız zorunludur."
 tac_bomber_equipment_0_short:0 "Bombardıman"
 tac_bomber_equipment_1:0 "Taktik Bombardıman Uçağı I"
 tac_bomber_equipment_1_desc:0 "Orta bombardıman uçakları çok yönlü ve hızlı olmalı, bir dizi görevi yerine getirebilmelidir. Nispeten hafif kalan çift motorlu bir tasarım, gelecek yıllarda da kullanılmaya devam edebilir."
 tac_bomber_equipment_1_short:0 "Tak Bomb I"
 tac_bomber_equipment_2:0 "Taktik Bombardıman Uçağı II"
 tac_bomber_equipment_2_desc:0 "Taktik bombardıman uçaklarının daha ağır tasarımları, uçakların çok çeşitli görevleri yerine getirme kapasitesini korurken menzili, yükü ve hızı artırabilir."
 tac_bomber_equipment_2_short:0 "Tak Bomb II"
 tac_bomber_equipment_3:0 "Taktik Bombardıman Uçağı III"
 tac_bomber_equipment_3_desc:0 "Avcı uçaklarındaki gelişmelerden bir sayfa alarak, alışılmadık malzemeler ve şekiller, yeni tasarımları şimdiye kadar yapılmış en hızlı ve en iyi performans gösteren çift motorlu uçaklardan bazıları yapabilir."
 tac_bomber_equipment_3_short:0 "Tak Bomb III"
 tac_bomber_equipment_desc:0 "Taktik Bombardıman Uçakları, daha küçük ve hızlı bombardıman uçaklarıdır ve kara birliklerine yardımcı olabilir ve düşman binalarını bombalayabilir."
