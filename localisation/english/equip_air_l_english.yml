 rocket_interceptor_equipment_1_desc:0 "Güvenilmez bir kimyasal roket motoruyla çalışan kısa menzilli deneysel avcı uçağı."
 rocket_interceptor_equipment_1_short:0 "Roket Avcı I"
 rocket_interceptor_equipment_2:0 "Roket Avcısı II"
 rocket_interceptor_equipment_2_desc:0 "Biraz daha güvenilir bir kimyasal roket motoruyla çalışan kısa menzilli avcı uçağı."
