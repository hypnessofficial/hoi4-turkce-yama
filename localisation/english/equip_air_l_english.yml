 scout_plane:0 " Keşif Uçağı"
 scout_plane_equipment:0 " Keşif Uçağı"
 scout_plane_equipment_1:0 "Keşif Uçağı I"
 scout_plane_equipment_1_desc:0 "Düşman birlik hareketleri hakkında istihbarat toplamak ve düşman deniz konuşlanmaları hakkında raporlar sağlamak, uçakların Büyük Savaş'taki ilk konuşlanmalarından bu yana orijinal görevi olmuştur ve hala önemli bir görevdir."
 scout_plane_equipment_2:0 "Keşif Uçağı II"
 scout_plane_equipment_2_desc:0 "Hava gözetimi ve uzun menzilli keşif için özel uçaklar geliştirerek, rakibimizin niyetleri ve yetenekleri hakkında doğru bir resim elde ettiğimizden ve koruduğumuzdan emin oluyoruz."
 scout_plane_equipment_desc:0 "Özellikle fotoğraf keşfi için geliştirilmiş bir uçak. Hayatta kalmak için öncelikle hız ve gizliliğe güvenir ve herhangi bir düzgün mücadelede kaybeder."
 strat_bomber:0 "Stratejik Bombardıman Uçağı"
 strat_bomber_equipment:0 " Stratejik Bombardıman Uçağı"
 strat_bomber_equipment_1:0 "Stratejik Bombardıman Uçağı I"
 strat_bomber_equipment_1_desc:0 "Büyük Savaş'tan ve sonrasındaki çalışmalardan elde edilen deneyimler, düşmanın askeri hedeflerini ve büyük şehirlerini bombalamanın bir sonraki savaşı kazanacağını gösteriyor. En azından, böyle bir yıkımı gerçekleştirebilecek bir bombardıman uçağına sahip olmalıyız. Yüksek irtifada ve iyi bir hızda uçabilmeli ve büyük bir yük taşıyabilmelidir. Bu, çok motorlu büyük bir uçak gövdesi gerektirecektir. Ayrıca bazı savunma yeteneklerine de sahip olacaktır."
 strat_bomber_equipment_1_short:0 "Strat Bomb I"
 strat_bomber_equipment_2:0 "Stratejik Bombardıman Uçağı II"
 strat_bomber_equipment_2_desc:0 "Bombardımanın düşmanın savaşma kapasitesini azaltmada etkili olduğu kanıtlanmıştır. Daha fazla savunma silahı ve artırılmış hız, yeni bir tasarımın yok olmasını önlerken, yük ve menzilin artırılması onu daha etkili hale getirecektir."
 strat_bomber_equipment_2_short:0 "Strat Bomb II"
 strat_bomber_equipment_3:0 "Stratejik Bombardıman Uçağı III"
 strat_bomber_equipment_3_desc:0 "Düşman avcı uçaklarına ve yer ateşine karşı kayıpları önlemek için bir sonraki tasarımımız çok yüksek irtifada uçacaktır. Hem büyük bir yük hem de daha fazla yakıt taşımak için daha büyük olacak ve menzili artıracaktır."
 strat_bomber_equipment_3_short:0 "Strat Bomb III"
 strat_bomber_equipment_desc:0 "Stratejik Bombardıman Uçakları, düşman binalarına ve altyapısına saldırarak onları değerli sanayilerinden mahrum bırakır."
 strategic_bomber1:0 "$strat_bomber_equipment_1$"
