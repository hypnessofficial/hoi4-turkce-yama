 rocket_interceptor_equipment_3_desc:0 "Sonunda roket motorlarıyla ilgili çoğu sorunu çözdük ve Roket Avcısı artık tesislerin sağlam bir kısa menzilli savunucusudur."
 rocket_interceptor_equipment_3_short:0 "Roket Avcı III"
 rocket_interceptor_equipment_desc:0 "Kimyasal roket motoruyla çalışan kısa menzilli avcı uçağı."
