 fighter:0 " Avcı Uçağı"
 fighter_equipment:0 " Avcı Uçağı"
 fighter_equipment_0:0 "Savaşlar Arası Avcı Uçağı"
 fighter_equipment_0_desc:0 "Avcı uçakları Büyük Savaş boyunca ve sonrasında birçok değişiklik geçirdi, ancak çift kanatlı tasarım artık modası geçmiş durumda. Sivil teknolojik gelişmeleri askeri uygulamalara dönüştürmeye başlamalıyız."
 fighter_equipment_0_short:0 "Avcı"
 fighter_equipment_1:0 "Avcı Uçağı I"
 fighter_equipment_1_desc:0 "Hafif uçak gövdeleri, radyal motorların, tek kanatlı tasarımların ve tamamen metal yapıların tanıtılmasıyla devrim geçirdi. Bu tasarım, ilk modern avcı uçağımızı yaratma girişimimizdir."
 fighter_equipment_1_short:0 "Avcı I"
 fighter_equipment_2:0 "Avcı Uçağı II"
 fighter_equipment_2_desc:0 "Avcı uçaklarındaki gelişmelerin hızı şaşırtıcıdır ve bu nedenle, teknolojiyi dahil etmeye ve mevcut konseptleri geliştirmeye devam etmeliyiz. Yeni avcı uçağı tasarımımız yüksek hıza, irtifada yüksek performansa ve mümkün olan en iyi menzile sahip olmalıdır. Ayrıca çok iyi silahlandırılmış olmalıdır."
 fighter_equipment_2_short:0 "Avcı II"
 fighter_equipment_3:0 "Avcı Uçağı III"
 fighter_equipment_3_desc:0 "Önceki nesil avcı uçaklarımız değerli olsa da, daha iyi bir tasarımın sağladığı herhangi bir avantaj değerlendirilmelidir. Bu uçak, piston motorlu avcı uçaklarının zirvesi olacak ve mükemmel güce, yüksek çevikliğe, ölümcül silahlara ve iyi menzile sahip olacaktır."
 fighter_equipment_3_short:0 "Avcı III"
 fighter_equipment_desc:0 "Avcı uçakları hızlı ve çeviktir, birçok görevi yerine getirebilirler. Hava üstünlüğü için savaşmaktan, bombardıman uçaklarını korumaya ve düşman bombardıman uçaklarını engellemeye kadar her şeyi yapabilirler."
 guided_missile:0 "Roket"
 heavy_fighter:0 "Ağır Avcı Uçağı"
 heavy_fighter1:0 "$heavy_fighter_equipment_1$"
 heavy_fighter_equipment:0 " Ağır Avcı Uçağı"
 heavy_fighter_equipment_1:0 "Ağır Avcı Uçağı I"
 heavy_fighter_equipment_1_desc:0 "Bombardıman uçaklarımızın, hedeflerine gidiş ve dönüşte düşman avcı uçaklarından korunmaya ihtiyacı var. Bu eskortu sağlamak için, bombardıman uçaklarıyla aynı menzile sahip avcı uçakları tasarlamalıyız. Zorunluluktan dolayı bu uçaklar hafif avcı uçaklarından daha büyük, daha yavaş ve daha az çeviktir, ancak önemli silahlar taşıyabilirler."
 heavy_fighter_equipment_1_short:0 "Ağır Avcı I"
 heavy_fighter_equipment_2:0 "Ağır Avcı Uçağı II"
 heavy_fighter_equipment_2_desc:0 "Savaş bize ağır avcı tasarımımızın daha çevik avcı uçaklarına karşı savunmasız olduğunu, ancak ağır silahları sayesinde düşman bombardıman uçaklarını engellemede oldukça iyi olduğunu öğretti. Bu yeni tasarım, düşman uçaklarına ve hatta kara hedeflerine karşı saldırı yeteneğini artırmaya odaklanacaktır. Hızı ve menzili de iyileştirilecektir."
 heavy_fighter_equipment_2_short:0 "Ağır Avcı II"
 heavy_fighter_equipment_3:0 "Ağır Avcı Uçağı III"
 heavy_fighter_equipment_3_desc:0 "Ağır avcı uçaklarımız çeşitli görevlerde yetenekli olsa da, düşman avcı uçaklarına göre yeteneğini artıran ve giderek daha hızlı ve daha iyi savunulan düşman bombardıman uçaklarını engellemeye devam etmesini sağlayan yeni bir tasarım düşünmeliyiz."
 heavy_fighter_equipment_3_short:0 "Ağır Avcı III"
 heavy_fighter_equipment_desc:0 "Ağır Avcı Uçakları uzun menzilli ve güçlü silahlara sahiptir. Hem bombardıman uçaklarını uzun mesafelerde korumak hem de düşman bombardıman uçaklarını engellemek için iyidirler. Ancak daha düşük çeviklikleri nedeniyle normal avcı uçaklarına karşı zorlanırlar."
 jet_fighter:0 "Jet Avcı Uçağı"
 jet_fighter_equipment:0 "Jet Avcı Uçağı"
 jet_fighter_equipment_1:0 "Jet Avcı Uçağı I"
 jet_fighter_equipment_1_desc:0 "Önceki hız artışları, ilk jet avcı uçaklarının tanıtılmasıyla karşılaştırıldığında soluk kalır. Bu motorlar için en iyi uçakları nasıl inşa edeceğimizi henüz öğrenmemiş olsak da, normal avcı uçakları rekabet edemez."
 jet_fighter_equipment_1_short:0 "Jet Avcı I"
 jet_fighter_equipment_2:0 "Jet Avcı Uçağı II"
 jet_fighter_equipment_2_desc:0 "Yeni süpürülü kanat tasarımları ve daha hafif malzeme seçenekleri, devrimci jet avcı uçaklarının menzilini ve hızını daha da artırmamıza izin verecektir."
 jet_fighter_equipment_2_short:0 "Jet Avcı II"
 jet_fighter_equipment_desc:0 "Avcı uçakları hızlı ve çeviktir, birçok görevi yerine getirebilirler. Hava üstünlüğü için savaşmaktan, bombardıman uçaklarını korumaya ve düşman bombardıman uçaklarını engellemeye kadar her şeyi yapabilirler."
 jet_strat_bomber:0 "Jet Stratejik Bombardıman Uçağı"
 jet_strat_bomber_equipment:0 "Jet Stratejik Bombardıman Uçağı"
 jet_strat_bomber_equipment_1:0 "Jet Stratejik Bombardıman Uçağı I"
 jet_strat_bomber_equipment_1_desc:0 "Çoklu jet motorları, yeni tasarımlara büyük bir yük ve uzun menzil sağlarken benzeri görülmemiş bir hız sunar. Bu uçaklar, kitle imha silahlarının yeni bir çağı için inşa edilmiştir."
 jet_strat_bomber_equipment_1_short:0 "Jet Strat Bomb I"
 jet_strat_bomber_equipment_desc:0 "Stratejik Bombardıman Uçakları, düşman binalarına ve altyapısına saldırarak onları değerli sanayilerinden mahrum bırakır."
 jet_tac_bomber:0 "Jet Taktik Bombardıman Uçağı"
 jet_tac_bomber_equipment:0 "Jet Taktik Bombardıman Uçağı"
 jet_tac_bomber_equipment_1:0 "Jet Taktik Bombardıman Uçağı I"
 jet_tac_bomber_equipment_1_desc:0 "Jet avcı uçaklarının ortaya çıkışı, onlardan kaçabilecek veya en azından hızlarını eşleştirebilecek bombardıman uçaklarını gerektirir. Jet motorlarıyla donatılmış birinci nesil orta bombardıman uçakları ve bombardıman-avcı uçakları bu rolü dolduracaktır."
 jet_tac_bomber_equipment_1_short:0 "Jet Tak Bomb I"
 jet_tac_bomber_equipment_2:0 "Jet Taktik Bombardıman Uçağı II"
 jet_tac_bomber_equipment_2_desc:0 "Hızla yetinmeyen geleceğin jet bombardıman uçakları, yük taşıma ve kıtalararası görevlerde keşif yapma konusunda irtifa ve menzil rekorları kıracaktır."
 jet_tac_bomber_equipment_2_short:0 "Jet Tak Bomb II"
 jet_tac_bomber_equipment_desc:0 "Taktik Bombardıman Uçakları, daha küçük ve hızlı bombardıman uçaklarıdır ve kara birliklerine yardımcı olabilir ve düşman binalarını bombalayabilir."
 nav_bomber:0 " Deniz Bombardıman Uçağı"
 nav_bomber_equipment:0 " Deniz Bombardıman Uçağı"
 nav_bomber_equipment_1:0 "Deniz Bombardıman Uçağı I"
 nav_bomber_equipment_1_desc:0 "Deniz havacılığı, deniz savaşında denizaltıların artan önemi gibi yeni gelişmelerle yüzleşmek için gelecek on yılda hayati önem taşıyacaktır. Pike bombardıman uçağı ve keşif aracı olarak çalışabilen deniz uçakları faydalı olacaktır."
 nav_bomber_equipment_1_short:0 "DEN I"
 nav_bomber_equipment_2:0 "Deniz Bombardıman Uçağı II"
 nav_bomber_equipment_2_desc:0 "Yeni motor teknolojisi ve aerodinamik olarak rafine edilmiş tasarımlar, deniz uçaklarının hızını ve dalış saldırı yeteneğini önemli ölçüde artıracaktır."
 nav_bomber_equipment_2_short:0 "DEN II"
 nav_bomber_equipment_3:0 "Deniz Bombardıman Uçağı III"
 nav_bomber_equipment_3_desc:0 "Tamamen metal tasarımlar ve güçlü hava frenleri, daha karmaşık deniz havacılığına izin verir. Ancak geleceğin uçakları, bu gelişmiş sistemleri çalıştırmak için daha büyük bir mürettebat gerektirecektir."
 nav_bomber_equipment_3_short:0 "DEN III"
 nav_bomber_equipment_desc:0 "Deniz Bombardıman Uçakları, düşman gemilerine saldırı gerçekleştirebilir."
