 IRQ_ghazi_i_desc:0 "1933'te I. Faysal'ın ölümünün ardından tahta çıkan Kral Gazi, Haşimi hanedanı ile Birleşik Krallık arasındaki on yıllara dayanan bağlara rağmen Irak'taki İngiliz nüfuzuna karşı çıkan biri olarak ün kazandı. Genç Kral'ın İngilizleri zorla devirmek ve ordusunu komşu stratejik bölgelere sürmek için fırsat kolladığına dair şüpheler dolaşıyor."
