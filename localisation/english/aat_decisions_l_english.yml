 ICE_a_monument_to_leif:0 "Leifur Eiríksson'a bir Anıt Dik"
 ICE_a_monument_to_leif_desc:0 "Güneylilerin Christopher Columbus'un Amerika'yı keşfeden ilk Avrupalı olduğu yönündeki yaygın efsanesine rağmen, büyük atamız Leifur Eiríksson şüphesiz bunu yapan ilk kişidir. Onun anısını onurlandırmak için, toprakları kendimiz için fethederken Vinland'da ona adanmış bir anıt dikmeliyiz."
 ICE_a_new_yggdrasill:0 "Modern bir Yggdrasil"
 ICE_a_new_yggdrasill_desc:0 "Artık halk büyük atalarını bildiğine göre, büyük projeler inşa etmeye ve İzlanda adasını geliştirmeye çalışmalıyız ki Efsanedeki Miðgarður ve Yggdrasil'e layık olabilsin!"
