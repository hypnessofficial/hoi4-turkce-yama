 DEN_bop_ban_all_political_uniforms:0 "£BoP_left_texticon Tüm Siyasi Üniformaları Yasakla"
 DEN_bop_ban_all_political_uniforms_desc:0 "Avrupa'nın her yerinde, sanki bir askeri geçit töreniymiş gibi saflar halinde yürüyen siyasi üniformalar görülebilir. Ve Avrupa'nın her yerinde, siyasi huzursuzluk ve istikrarsızlığın ilerlediği, kıtayı kaosa sürüklediği görülebilir. Bu gelişmenin çok geç olmadan [ROOT.GetNameDef] ülkesine ulaşmasını önlemeliyiz."
 DEN_bop_ban_elections:0 "Seçimleri Yasakla"
 DEN_bop_ban_oppositions_uniforms:0 "£BoP_right_texticon Muhalefetin Siyasi Üniformalarını Yasakla"
 DEN_bop_ban_oppositions_uniforms_desc:0 "Siyasi rakiplerimizin üniformalarıyla etrafta dolaşıp gösteriş yapmalarına izin veremeyiz. Bu sadece hoşnutsuzluk ve anlaşmazlık yayar. İktidardakiler hariç tabii ki tüm siyasi üniformaları yasaklamalıyız."
 DEN_bop_criticize_our_preparedness:0 "£BoP_right_texticon Hazırlığımızı Eleştir"
 DEN_bop_criticize_our_preparedness_desc:0 "Avrupa üzerinde yine kara bulutlar toplanıyor ve yaklaşan fırtınaya hiç de hazır değiliz! Bu fırtınayı atlatacaksak mümkün olan en kısa sürede hazırlıklara başlamalıyız."
 DEN_bop_criticize_the_country_leader:0 "[DEN.GetLeader]'ı Eleştir"
 DEN_bop_criticize_the_country_leader_desc:0 "Rigsdagen üyeleri, [ROOT.GetLeader]'ın liderliğini kapalı kapılar ardında sorguluyor, ancak kimse bunu açıkça yapmaya istekli görünmüyor. Birisi onu açıkça eleştirmeli ve bir güvensizlik oylaması için yolu açmak üzere Rigsdagen'in çoğunluğunu toplamalı!"
 DEN_bop_defend_our_chosen_path:0 "Seçtiğimiz Yolu Savun"
 DEN_bop_defend_our_chosen_path_neutrality:0 "£BoP_left_texticon Seçtiğimiz Yolu Savun"
 DEN_bop_defend_our_chosen_path_neutrality_desc:0 "İyi ya da kötü, şimdi sapmanın çok akılsızca olacağı bir yola girdik. Bizi buraya getiren kararlarımıza güvenmeli ve bu seçilen yolun doğru yol olduğunu ummalıyız."
 DEN_bop_defend_our_chosen_path_rearmament:0 "£BoP_right_texticon Seçtiğimiz Yolu Savun"
 DEN_bop_defend_our_chosen_path_rearmament_desc:0 "$DEN_bop_defend_our_chosen_path_neutrality_desc$"
 DEN_bop_defend_the_policy_of_neutrality:0 "£BoP_left_texticon Tarafsızlık Politikasını Savun"
 DEN_bop_defend_the_policy_of_neutrality_desc:0 "Tarafsızlık bize iyi hizmet etti, özellikle de Büyük Savaş sırasında Avrupa'nın her yerinde savaşlar şiddetlenirken. Ama burada değil, Danimarka'da değil. Kurtulduk, bağışlandık. Tarafsızlık bize gerçekten iyi hizmet etti."
 DEN_bop_exile_royal_family:0 "Kraliyet Ailesini Sürgün Et"
 DEN_bop_expand_the_welfare:0 "£BoP_left_texticon Refah Sistemini Genişlet"
 DEN_bop_expand_the_welfare_desc:0 "Savaş çığırtkanlığı yapmak ve yakınımızdaki büyük güçlerden herhangi birinin saldırısına dayanamayacak bir savunmaya para harcamak yerine, gelişmekte olan refah sistemimize harcamaları artırmalıyız!"
 DEN_bop_hold_a_military_parade:0 "£BoP_right_texticon Askeri Geçit Töreni Düzenle"
 DEN_bop_hold_a_military_parade_desc:0 "Bir askeri geçit töreni düzenleyerek, halkın [ROOT.GetNameDef] ülkesini savunma yeteneğimize olan inancını artıracağız. Birliklerimizin motivasyonunu görmek kesinlikle morallerini ve kararlılıklarını güçlendirecektir."
 DEN_bop_landstorm:0 "£BoP_right_texticon Landstorm'u Yeniden Kur"
 DEN_bop_landstorm_desc:0 "Çevremizdeki kargaşa demlenirken, topraklarımızı savunmak için Landstorm'u yeniden kurmanın tam zamanı. En iyi kalitede olmasalar da, bu birlikler son savunma hattı olabilir."
 DEN_bop_motion_of_no_confidence:0 "Güvensizlik Oyu"
 DEN_bop_motion_of_no_confidence_desc:0 "Mevcut hükümet, [DEN.GetNameDef] ülkesini ve halkını kurtarmak için herhangi bir mantıklı eylemde bulunamıyor gibi görünüyor. Yeni, kararlı bir liderliğe ihtiyaç var! Rigsdagen, [DEN.GetLeader]'ın liderliğine karşı bir “güvensizlik oyu” için harekete geçmelidir."
 DEN_bop_occupation_allow_communism:0 "£BoP_left_texticon Komünizme İzin Ver"
 DEN_bop_occupation_allow_communism_desc:0 "Komünist hakim devletlerimiz [ROOT.GetNameDef] ülkesinde ideolojilerini yasaklamış olmamızdan hoşnut değiller. Komünizme tekrar izin vermek bizim çıkarımıza olacaktır."
 DEN_bop_occupation_allow_democratism:0 "£BoP_left_texticon Demokratik Partilere İzin Ver"
 DEN_bop_occupation_allow_democratism_desc:0 "Tekrarlanan seçimler yapmak, vatandaşlar arasında bir güven işaretidir ve bir ülke için bir güçtür. Demokratik seçimlere izin vermemek ulusumuza bir hakarettir."
 DEN_bop_occupation_allow_fascism:0 "£BoP_left_texticon Faşizme İzin Ver"
 DEN_bop_occupation_allow_fascism_desc:0 "Faşist hakim devletlerimiz [ROOT.GetNameDef] ülkesinde ideolojilerini yasaklamış olmamızdan hoşnut değiller. Faşizme tekrar izin vermek bizim çıkarımıza olacaktır."
 DEN_bop_occupation_ban_communism:0 "£BoP_left_texticon Komünizmi Yasakla"
 DEN_bop_occupation_ban_communism_desc:0 "[?DEN.DEN_overlord_nation.GetAdjective] hakim devletlerimiz kendilerini Komünist ideolojinin kendisiyle savaşta görüyorlar ve ülkemizdeki tüm Komünist örgütleri yasaklarsak devam eden işbirliğimize daha da değer verirler."
 DEN_bop_occupation_ban_elections:0 "£BoP_left_texticon Seçimleri Yasakla"
 DEN_bop_occupation_ban_elections_desc:0 "[?DEN.DEN_overlord_nation.GetAdjective] hakim devletlerimizi özgür seçimleri yasaklayarak yatıştırmalıyız"
 DEN_bop_occupation_ban_fascism:0 "£BoP_left_texticon Faşizmi Yasakla"
 DEN_bop_occupation_ban_fascism_desc:0 "[?DEN.DEN_overlord_nation.GetAdjective] hakim devletlerimiz kendilerini Faşist ideolojinin kendisiyle savaşta görüyorlar ve ülkemizdeki tüm Faşist örgütleri yasaklarsak devam eden işbirliğimize daha da değer verirler."
 DEN_bop_occupation_censor_the_media:0 "£BoP_left_texticon Medyayı Sansürle"
 DEN_bop_occupation_censor_the_media_desc:0 "Bu hassas durumda medyanın [?DEN.DEN_overlord_nation.GetAdjective] işgal gücünü açıkça eleştirmesine izin veremeyiz. Hala sahip olduğumuz azıcık özgürlüğü riske atmamak için yayınlayabilecekleri şeyleri sınırlamalıyız."
 DEN_bop_occupation_criticize_collaboration:0 "£BoP_right_texticon İşbirliği Politikasını Eleştir"
 DEN_bop_occupation_criticize_collaboration_desc:0 "Bu onursuz teslimiyet ve [ROOT.GetNameDef] ile [?DEN.DEN_overlord_nation.GetNameDef] arasındaki bu kutsal olmayan işbirliği, üzerine yazıldığı kağıda değmez!"
 DEN_bop_occupation_defend_collaboration:0 "£BoP_left_texticon İşbirliği Politikasını Savun"
 DEN_bop_occupation_defend_collaboration_desc:0 "[?DEN.DEN_overlord_nation.GetNameDef] ülkesine teslim olmak ve onlarla işbirliği yapmak tek doğru seçimdi! Bizi hayal bile edemeyeceğimiz dehşetlerden ve yıkımdan kurtardı."
 DEN_bop_occupation_funnel_resources_danish_brigade:0 "£BoP_right_texticon Danimarka Tugaylarına Kaynak Aktar"
 DEN_bop_occupation_funnel_resources_danish_brigade_desc:0 "[?DEN.hosts_danish_brigades.GetNameDefCap], zamanı geldiğinde [ROOT.GetNameDef] ülkesinin kurtuluşuna yardımcı olabilecek Danimarkalı birlikleri kabul etmeyi ve eğitmeyi lütfetmiştir. Ancak bu birliklerin ülkemizi kurtarma görevinde başarılı olma şanslarının en iyi şekilde olmasını sağlamak için para ve malzeme ile yardım etmeliyiz."
 DEN_bop_occupation_raid_depots:0 "£BoP_right_texticon Silah Depolarına Baskın Yap"
 DEN_bop_occupation_raid_depots_desc:0 "Yerli silah fabrikalarımız [?DEN.DEN_overlord_nation.GetNameDef] ülkesine silah üretiyor ve yardım ediyor, onların savaşlarında kullanılan silahlar. Silah depolarına baskın yapmak, silah tedarikini azaltırken aynı zamanda direniş hareketimizi güçlendirecektir."
 DEN_bop_occupation_remove_political_agitator:0 "£BoP_left_texticon Siyasi Kışkırtıcıları Kaldır"
 DEN_bop_occupation_remove_political_agitator_desc:0 "Bazı önde gelen politikacılar, ülkelerimiz arasındaki gerilimi artıran [?DEN.DEN_overlord_nation.GetAdjective] hakim devletlerimizi eleştirmekten çekinmiyor. [?DEN.DEN_overlord_nation.GetNameDef] bizi zorlamadan önce bu baş belalarını siyasi görevlerinden almalıyız."
 DEN_bop_occupation_resistance_coordination:0 "£BoP_right_texticon Direniş Hareketini Koordine Et"
 DEN_bop_occupation_resistance_coordination_desc:0 "Özgürlüğümüzü geri kazanmak istiyorsak, ortak bir direniş hareketinde toplanmalı ve aynı hedef için savaşmalıyız; [ROOT.GetNameDef] ülkesinin kurtuluşu."
 DEN_bop_occupation_sabotage_civ_industry:0 "£BoP_right_texticon Sivil Sanayileri Sabote Et"
 DEN_bop_occupation_sabotage_civ_industry_desc:0 "Yerli fabrikalarımız ve sanayilerimiz [?DEN.DEN_overlord_nation.GetNameDef] ülkesine çeşitli malzemeler üretmeye ve yardım etmeye zorlanıyor, onların savaşında kullanılan malzemeler. Bu fabrikaları sabote ederek, malzeme tedariki azalacak, bu da Alman savaş çabalarına zarar verecektir."
 DEN_bop_occupation_sabotage_mil_industry:0 "£BoP_right_texticon Askeri Sanayileri Sabote Et"
 DEN_bop_occupation_sabotage_mil_industry_desc:0 "Yerli silah fabrikalarımız [?DEN.DEN_overlord_nation.GetNameDef] ülkesine silah üretiyor ve yardım ediyor, onların savaşlarında kullanılan silahlar. Bu fabrikaları sabote etmek silah tedarikini azaltacak, Alman savaş çabalarına zarar verirken potansiyel müttefiklerimize yardımcı olacaktır."
 DEN_bop_occupation_strikes:0 "£BoP_right_texticon Grevleri Gizlice Koordine Et"
 DEN_bop_occupation_strikes_decs:0 "Şu anda yapabileceğimiz en iyi şey, ülke çapında grevleri koordine ederek [?DEN.DEN_overlord_nation.GetAdjective] işgalini pasif bir şekilde protesto etmektir."
 DEN_bop_occupation_switch_ideology:0 "[?DEN.DEN_overlord_nation.GetRulingIdeologyNoun]'u benimse"
 DEN_bop_occupation_switch_ideology_desc:0 "Eğer gerçekten [?DEN.DEN_overlord_nation.GetNameDef] ile hizalanmak ve onların desteğini kazanmak istiyorsak, onların ideolojilerini ve inançlarını benimsemeliyiz."
 DEN_bop_occupation_underground_factories:0 "£BoP_right_texticon Yeraltı Silah Fabrikaları"
 DEN_bop_occupation_underground_factories_desc:0 "Egemenliğimizi geri kazanma şansımızı artırmak için uygun silah stoklarına ihtiyacımız var. Özgürlüğümüz için savaşmamız gerekebileceği gün geldiğinde halkı silahlandırabilmek için gizli silah fabrikaları inşa etmeliyiz."
 DEN_bop_question_our_defenses:0 "£BoP_right_texticon Savunmalarımızı Sorgula"
 DEN_bop_question_our_defenses_desc:0 "Uzun süredir devam eden tarafsızlık politikası Danimarka'yı tüm savunmalardan mahrum bıraktı! Eğer yabancı bir güç tarafından saldırıya uğrarsak, onların şu anda doğrudan København'a yürümesini engelleyecek hiçbir şey olmaz. Bir ülke olarak hayatta kalacaksak savunmamıza bakmalıyız!"
 DEN_bop_speak_out_against_warfare:0 "£BoP_left_texticon Askeri Yeniden Silahlanmaya Karşı Konuş"
 DEN_bop_speak_out_against_warfare_desc:0 "Şimdi yeniden silahlanmak, yakındaki güçler tarafından kolayca düşmanca bir eylem olarak görülebileceği için ülkemize ciddi bir tehlike oluşturacaktır. Çok daha güçlü bir orduya karşı kendimizi savunma yolumuz olmadığı için şu anda daha büyük bir komşuyu kızdırma riskini alamayız."
 DEN_bop_speak_out_against_welfare:0 "£BoP_right_texticon Refah Sistemine Karşı Konuş"
 DEN_bop_speak_out_against_welfare_desc:0 "Bağımsızlığımızı güvence altına almak için başka bir şeye para harcamadan önce savunmamıza bakmalıyız. Bir Danimarka ulusu olmadan, o parayı harcayacak Danimarkalıların olmadığı aşikardır."
 DEN_bop_speak_out_in_favor_of_disarmament:0 "£BoP_left_texticon Silahsızlanma Lehine Konuş"
 DEN_bop_speak_out_in_favor_of_disarmament_desc:0 "Büyük güçlerle çevrili küçük bir ulus olarak, işgalci bir gücü geri püskürtme umudumuz yok, öyleyse neden bize asla yardım etmeyecek, ancak potansiyel olarak çok daha büyük komşularımızı kızdırabilecek bir savunmaya para harcayalım?"
 DEN_bop_speak_out_in_favor_of_rearmament:0 "£BoP_right_texticon Yeniden Silahlanma Lehine Konuş"
 DEN_bop_speak_out_in_favor_of_rearmament_desc:0 "Avrupa'nın geri kalanı bir silahlanma yarışındayken ve önümüzde belirsiz zamanlar varken boş duramayız. Savunmalarımızı hazırlamalı ve mümkün olan en kısa sürede, tercihen dün, yeniden silahlanmaya başlamalıyız!"
 DEN_bop_unban_all_political_uniforms:0 "£BoP_right_texticon Tüm Siyasi Üniformalara İzin Ver"
 DEN_bop_unban_all_political_uniforms_desc:0 "Siyasi üniformalar üzerindeki yasağın halkın haklarını kısıtladığı için devam etmesine izin veremeyiz!"
 DEN_bop_unban_oppositions_uniforms:0 "£BoP_left_texticon Muhalefetin Siyasi Üniformalarına İzin Ver"
 DEN_bop_unban_oppositions_uniforms_desc:0 "Destekçilerimiz bir askeri geçit törenindeki katılımcılar gibi sokaklarda yürürken başka bir partinin siyasi üniforma kullanmasını yasaklayamayız. Bu sansürü kaldırmalıyız."
