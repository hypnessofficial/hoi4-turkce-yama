 ICE_the_ferocity_of_the_fenrir:0 "Fenrisúlfr'un Vahşeti"
 ICE_the_ferocity_of_the_fenrir_desc:0 "Fenrisúlfr, Hel ve Dünya Yılanı ile birlikte Loki ve dev Angrboða'nın bir çocuğudur. Ragnarök sırasında Óðinn'i öldürmesi gerekiyordu, ancak büyük gücüne ve vahşetine rağmen başaramadı. Askerlerimiz, hem sahada hem de zihinde düşmanı yenmek için onun özünü savaş alanında benimsemelidir."
 ICE_the_fertility_of_freya:0 "Freyja'nın Bereketi"
 ICE_the_fertility_of_freya_desc:0 "Freyja, diğer şeylerin yanı sıra aşk, güzellik ve bereket tanrıçasıdır. Halkımızın bir gün büyük savaşçılara dönüşebilecek çocukları olması için onun adını anmalıyız."
 ICE_the_guidance_of_aegir_and_ran:0 "Ægir ve Rán'ın Rehberliği"
 ICE_the_guidance_of_aegir_and_ran_desc:0 "Denizin kişileştirilmiş hali olan Rán ve onun jötunn kocası Ægir'in rehberliğinde, gemilerimiz kuzey denizlerinde üstünlük sağlayacaktır."
 ICE_the_might_of_thor:0 "Þór'un Kudreti"
 ICE_the_might_of_thor_desc:0 "Þór, gök gürültüsü, güç ve insanlığın korunması tanrısıdır. Çekici Mjölnir'i kullanarak fırtına çıkarmak için bulutlara vurdu ve ordumuz da aynı gök gürültüsünü ve korkuyu rakiplerimize salacak!"
 ICE_the_wisdom_of_odin:0 "Óðinn'in Bilgeliği"
 ICE_the_wisdom_of_odin_desc:0 "Óðinn bilgelik, şifa, ölüm, krallık, darağacı, bilgi, savaş, muharebe, zafer, büyü, şiir ve çılgınlıktan runik alfabeye kadar her şeyle ilişkilendirilen bir tanrıdır. Şimdiki, gelecek ve geçmiş hakkında sonsuz bilgi yeteneği veren Mímisbrunnr'dan içmek için gözünü feda ettiğinde muazzam bilgeliğine kavuştu. Onun ruhunu benimsemeye ve mirasını geleceğe taşımaya çalışmalıyız!"
