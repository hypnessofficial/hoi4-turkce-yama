 SWE_train_the_sheltered_short_desc:0 "Şu anda polis kılığında Nordik askerler eğitiyoruz. Savaş durumunda orduya hizmet etmek üzere çağrılacaklar ve insan gücü havuzunu yedeklerimize ekleyecekler.\nGerekirse daha da fazlasını eğitmek için tesislerimizi genişletebiliriz"
 SWE_train_the_sheltered_tt:0 "Sürgündeki Nordik askerlerini eğitmek için kararlar açar. Bu insan gücü, zamanla bir sınıra kadar büyüyecek ayrı bir insan gücü havuzuna eklenir. Saldırıya uğrarsak o insan gücü havuzu kendi insan gücümüze eklenecektir.\nBu sınırı daha da artırmak için kaynak harcayabiliriz.\nSavaşta bu havuz büyümeyi durduracaktır"
