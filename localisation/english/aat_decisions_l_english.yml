 FIN_resignation_of_kallio:0 "$FIN_kyosti_kallio$'nun İstifası"
 FIN_resignation_of_kallio_desc:0 "$FIN_kyosti_kallio$ en büyük devlet adamı olmamıştır ve son zamanlardaki başarısızlıkları, ülkeyi doğru yöne yönlendiremeyeceğini açıkça ortaya koymuştur. Şimdi, dünya gerilimi yüksekken ve sağlığı sürekli ortaya çıkan ciddi sorunlarla başa çıkmasına izin vermiyorken, istifa etmesi en iyisidir."
 FIN_resignation_of_mannerheim:0 "$FIN_carl_mannerheim$'ın İstifası"
