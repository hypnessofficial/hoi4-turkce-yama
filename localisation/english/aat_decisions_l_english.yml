 FIN_appeal_to_the_finnish_spirit:0 "Fin Ruhuna Başvur"
 FIN_appeal_to_the_finnish_spirit_cost_increase_tt:0 "\n§Y$FIN_appeal_to_the_finnish_spirit$§! kararlarının maliyeti §Y[?FIN_bop_decision_cost_multiplier]§! ile §Rçarpılacaktır§!.\n"
 FIN_appeal_to_the_finnish_spirit_desc:0 "Finlerin zorluklar karşısındaki olağanüstü kararlılığına, direncine ve dayanıklılığına başvurmalıyız. Fin Halkı, tüm zorluklara karşı galip gelmek için birlikte çalışmalıdır. Sisu'muz bizi güçlü kılar!"
 FIN_appeal_to_the_middle_class:0 "Orta Sınıfa Başvur"
 FIN_appeal_to_the_middle_class_dec_tt:0 "Tarafımız toplam toprak ve askeri birimlerin §G+10%§!'unu alacak."
 FIN_appeal_to_the_middle_class_desc:0 "Fin sağcı örgütlere ana destek orta sınıftan geliyor. Zengin çiftçilere, eğitimli burjuvaziye, memurlara, din adamlarına ve üniversite öğrencilerine hareketimize katılmaları ve ilkelerimizi ve ideolojimizi halk arasında yaymaları için başvurmalıyız."
 FIN_appoint_yrjo_leino_as_president:0 "Yrjö Leino'yu Başkan Olarak Ata"
 FIN_appoint_yrjo_leino_as_president_desc:0 "Yrjö Leino, halkımızı gerçekten refaha götürebilecek kişidir ve onu mümkün olan en kısa sürede Başkan yapmak düşünülmelidir."
