 NOR_allied_democratic_deploy_prep_decisions_category_desc:0 "Tam beklediğimiz gibi savaş sonunda kapımızda, ama korkacak bir şey yok. Son birkaç yıldır tüm çabalarımızı [ROOT.GetName] ülkesini düşmanlarımızın bize atacağı her şeye karşı hazır hale getirmeye odakladık. Onlara neyden yapıldığımızı gösterelim.\n\nUlusal Hazırlık: [?NOR.NOR_country_preparedness]/30"
 NOR_allied_democratic_preparation_decisions_category:0 "Norveç'i Savaşa Hazırlamak"
 NOR_allied_democratic_preparation_decisions_category_desc:0 "Bu hükümet, düşmanlarımızın her an saldıracağından emindir. Bir işgali önlemek için [NOR.GetName] halkını silahlandırma gayretimizde kararlı olmalıyız. Bu, önleyici saldırı anlamına gelse bile. Öyleyse ülkemizi toplayalım ve düşmanlarımıza karşı kesin bir zafer kazanmak için ihtiyacımız olan gücü alalım.\n\nUlusal Hazırlık: [?NOR.NOR_country_preparedness]/30"
 NOR_alt_dem_economic_relief_measures:0 "Ekonomik Yardım Önlemleri"
 NOR_alt_dem_economic_relief_measures_desc:0 "Halk, askeri birikimimizden yoruluyor. Bizim gördüğümüzü görmeyebilirler ve fedakarlıklarının zaferi güvence altına almak için savaş makinemizin ilerlemesi için gerekli olduğunu bilmeyebilirler. Önemli değil, şimdilik onların ihtiyaçlarını yatıştıracağız."
 NOR_alt_dem_expedite_training:0 "Eğitimi Hızlandır"
 NOR_alt_dem_expedite_training_desc:0 "Vahim bir durumdayız. Yakında yeni birlikler eğitmezsek hepimiz mahvolabiliriz."
 NOR_alt_dem_focus_on_defense:0 "Savunmaya Odaklan"
 NOR_alt_dem_focus_on_defense_desc:0 "Çok yakın zamana kadar [NOR.GetName] barışçıl ve silahsız bir ulustu, kendimizi çok zorladık. Şimdilik sahip olduklarımızı savunmaya odaklanmalıyız."
 NOR_alt_dem_focus_on_training:0 "$NOR_focus_on_training$"
 NOR_alt_dem_focus_on_training_desc:0 "$NOR_focus_on_training_desc$"
 NOR_alt_dem_integrate_militias:0 "$NOR_dem_his_integrate_militias$"
 NOR_alt_dem_integrate_militias_desc:0 "$NOR_dem_his_integrate_militias_desc$"
 NOR_alt_dem_military_industry_expansion:0 "Askeri Sanayiyi Genişlet"
 NOR_alt_dem_military_industry_expansion_desc:0 "Ekipmanımızı sağlamak için diğer ülkelere bağımlı olamayız, ne de olsa bugünün savaş tüccarları yarının savaş düşmanları olabilir. Savaşmak için ihtiyacımız olan malzemeyi üretmek için sanayi kapasitemizi genişletmeliyiz."
 NOR_alt_dem_modernize_armed_forces_decision:0 "$NOR_modernize_armed_forces_decision$"
 NOR_alt_dem_modernize_armed_forces_decision_desc:0 "$NOR_modernize_armed_forces_decision_desc$"
 NOR_alt_dem_naval_expansion:0 "Donanma Genişlemesi"
 NOR_alt_dem_naval_expansion_desc:0 "Donanmamızı geliştirmek hayati önem taşır, sadece heybetli derecede büyük kıyı şeridimizi işgalcilere karşı savunmak anlamına geldiği için değil, aynı zamanda savaşı onların anavatanlarına taşımak için bir fırlatma rampası olarak kullanılabileceği için."
 NOR_alt_dem_offensive_push:0 "Saldırı İtişi"
 NOR_alt_dem_offensive_push_desc:0 "Her şey boşver, saldırma zamanı. İlerleyelim ve neye uğradıklarını anlamadan düşmanlarımızı ezelim."
 NOR_alt_dem_prioritize_production:0 "Üretime Öncelik Ver"
 NOR_alt_dem_prioritize_production_desc:0 "Savaş makinemizin ekipmana ihtiyacı var ve hemen şimdi ihtiyacı var! Fabrikalar sürekli çalışmalarıyla uğuldasın ki cesur askerlerimiz ne pahasına olursa olsun düşmanlarımızı yenme imkanına sahip olsun."
 NOR_alt_dem_public_investment_drive:0 "$NOR_public_investment_drive$"
 NOR_alt_dem_public_investment_drive_desc:0 "$NOR_public_investment_drive_desc$"
 NOR_bring_soldiers_from_norway:0 "[NOR.GetNonIdeologyName] ülkesinden asker getir"
 NOR_bring_soldiers_from_norway_desc:0 "Ülkemizin savunması için savaşanların birçoğu anavatanımızda mahsur kaldı. Onlardan bazılarını ve henüz savaşmamış ama yine de ülkelerini geri almak isteyen başkalarını da bulunduğumuz yere getirmek için çaba gösterebiliriz."
 NOR_communist_preparation_decisions_category:0 "Proletaryayı Ayaklandırmak"
 NOR_communist_preparation_decisions_category_desc:0 "[GetRousingProletariatDesc]"
 NOR_communist_preparation_decisions_category_desc_other:0 "Devrim aşağıdan yukarıya, hayatlarını bir toprak sahibi veya bir sanayici için harcayan kitlelerden gelmelidir.\n\nProleter kardeşlerimizin birçoğu sahip oldukları gücü bilmiyor, bu yüzden ileri gitmeli ve proletaryayı ayaklandırmalıyız ki Oslo'ya karşı birleşip kapitalizmin zincirlerini tek tek her eyalette kırabilsinler.$NOR_revolution_support_counter$"
 NOR_communist_preparation_decisions_category_desc_stalinist:0 "[ROOT.GetName] halkının gözleri çok uzun zamandır kapalıydı, artık [SOU.GetNameDef] ülkesindeki kardeşlerimizin çağrısına kulak verme zamanı geldi.\n\nOnları, [ROOT.GetName] ülkesinin üretim araçlarını ele geçirdikten ve onları Oslo'nun zorbalığına karşı savaşmaya yönlendirecek tek bir bayrak ve tek bir lider altında birleştikten sonra neler başarabileceğinin bir örneği olarak kullanarak.$NOR_revolution_support_counter$"
 NOR_communist_preparation_decisions_category_desc_trostkyist:0 "[NOR.GetName] halkının Marx ve Troçki'nin öğretilerini dinleme ve ulusumuzu İskandinavya'da Komünizmin öncüsü haline getirecek kaçınılmaz çatışmaya hazırlanma zamanı geldi.\n\nKalıcı Devrimin ateşini ve kükürdünü kucaklayalım ve ülkeyi Oslo'da ikamet eden kapitalizmin güçlerine karşı birleştirelim.$NOR_revolution_support_counter$"
 NOR_communist_propaganda_campaign:0 "Komünist Propaganda Kampanyası"
 NOR_decision_defend_state_title:0 "[FROM.GetName] Eyaletini Savun"
 NOR_decision_deploy_emergency_militias_title:0 "[FROM.GetName] Eyaletinde Milisleri Konuşlandır"
 NOR_decision_emergency_production_title:0 "[FROM.GetName] Eyaletinde Acil Durum Üretimi"
 NOR_decision_industrial_takeover_title:0 "[FROM.GetName] Eyaletinde Sanayi Devralımı"
 NOR_decision_military_takeover_title:0 "[FROM.GetName] Eyaletinde Askeri Devralım"
 NOR_decision_take_over_state_title:0 "[FROM.GetName] Eyaletinde yönetimi devral"
 NOR_dem_his_integrate_militias:0 "Milisleri Entegre Et"
 NOR_dem_his_integrate_militias_desc:0 "Milislerimizi oluşturan adamlar cesaretlerini kanıtladıklarına göre, onları orduya, düzenli taburlara ve tümenlere daha iyi entegre edebiliriz."
 NOR_democratic_preparation_decisions_category:0 "Ulusumuzu İnşa Etmek"
 NOR_democratic_preparation_decisions_category_desc:0 "Genç ulusumuzun, dünya genelinde rekabet etmek istiyorsak yapması gereken çok şey var. Onlarca yıllık ihmal ve büyük buhranın içindeki yıllar, sanayimizi düzeltmek için ortak bir çaba gerektirecek acınası bir durumda bıraktı.\n\nNe yazık ki bu, askeri hazırlığımızın ve savunma yeteneklerimizin pahasına olacaktır, ancak iyi niyetimizi göstermek ve herhangi bir düşmanın topraklarımızı güvenle göz ardı etmesini sağlamak için tam ve silahsız tarafsızlık politikamıza güveniyoruz. \n\n\n[NOR.GetName] Toplam Gelişimi: [?NOR.NOR_country_preparedness]/30"
 NOR_deploy_state_preparation_fascist:0 "[get_deploy_prep_decision_name_fascist]"
 NOR_deploy_state_preparation_historical:0 "[get_deploy_prep_decision_name]"
 NOR_exile_decisions_category:0 "[ROOT.GetName] Hükümetinin Sürgünü"
 NOR_exile_decisions_category_desc:0 "En vahim koşullarda buluyoruz kendimizi. Topraklarımızı düşmana kaybettikten sonra, sürgünde yaşamaktan başka çaremiz kalmadı. En azından lütufkar ev sahibimize minnettar olabiliriz ve umarım bir gün onların yardımıyla sevdiğimiz [NOR.GetNonIdeologyName] topraklarında tekrar olacağız."
 NOR_expand_industrial_capacity:0 "Sanayi Kapasitesine Yatırım Yap"
 NOR_expand_industrial_capacity_desc:0 "Sürgünde olabiliriz ama bu çaresiz olduğumuz anlamına gelmez. Dünyanın en büyük ticaret filolarından birine sahibiz ve bunu anavatanımızı geri alma çabalarımızı beslemek için gereken sanayi kapasitesini tedarik etmek için kullanabiliriz."
 NOR_expedite_training:0 "Eğitimi Hızlandır"
 NOR_expedite_training_desc:0 "Birliklerimizi elimizden geldiğince iyi eğitmek hayatta kalmamız için hayati önem taşır, ancak eğitimlerini bitirip savunacak bir [NOR.GetName] kalmazsa boşuna olacaktır. Ulusumuzdan atılmadan önce olabildiğince hızlı ilerlemeliyiz."
 NOR_fascist_deploy_prep_decisions_category:0 "Gölgelerden Yükselmek"
 NOR_fascist_deploy_prep_decisions_category_desc:0 "Saklanma zamanı bitti, [NOR.GetName] ülkesini ele geçirmemizi başlatmak için yeterli destek topladık. Şimdi hazırlıklarımızı Anavatanımızın her bir toprağında konuşlandırmalıyız.\n\nDesteğimizi sıfırdan inşa ettik ve büyük Fører'imizin emriyle kendi topraklarını devralmaya ve Demokrasinin korkak güçlerine karşı koymaya hazır hücreler ektik."
 NOR_fascist_preparation_decisions_category:0 "Gölgelerde Gizlenmek"
 NOR_fascist_preparation_decisions_category_desc:0 "Nasjonal Samling partisi tarihsel olarak [NOR.GetAdjective] toplumunda çok sınırlı bir desteğe sahipti, bu yüzden ülke çapında propaganda yapmak ve bir destek tabanı oluşturmak önemlidir.\n\nFaşizmin tohumlarını ekerek, doğru fırsat geldiğinde, planlamamızın meyvelerini toplayabilecek ve [ROOT.GetName] ülkesini ele geçirebileceğiz.\n\n\n[NOR.GetName] ülkesinin Nasjonal Samling'e toplam desteği: [?NOR.NOR_country_preparedness]/30"
 NOR_focus_on_training:0 "Eğitime Odaklan"
 NOR_focus_on_training_desc:0 "Yedeklerimizi ve acemilerimizi mümkün olan en kısa sürede askere dönüştürüp savaş cephesine sokmak için tüm çabamızı harcamalıyız, çünkü çok daha uzun süre bir cephe olmayabilir."
 NOR_foment_resistance_in_state:0 "[FROM.GetName] Eyaletinde Direnişi Kışkırt"
 NOR_foment_resistance_in_state_desc:0 "[FROM.GetName] halkının içinde direniş ruhu var ve düşmanımıza karşı savaşıyorlar! Sadece belirleyici olması için ekstra bir itmeye ihtiyaçları var."
 NOR_historical_deploy_prep_decisions_category:0 "Fırtınaya Hazırlanmak"
 NOR_historical_deploy_prep_decisions_category_desc:0 "Tüm çabalarımıza rağmen savaş kıyılarımıza ulaştı. Şimdiye kadar enerjimizi topraklarımızın sanayisini, ekonomisini ve altyapısını geliştirmeye odakladık, ancak şimdi bunu [NOR.GetNameDef] savunması için kullanmanın yollarını bulmamız zorunludur.\n\n\n[NOR.GetName] Potansiyel Hazırlığı: [?NOR.NOR_country_preparedness]/30"
 NOR_invite_fascist_to_invade:0 "[GER.GetNameDef] ülkesini [NOR.GetNonIdeologyName] ülkesini işgal etmeye davet et"
 NOR_joint_training_exercise:0 "[FROM.GetNameDef] ile Ortak Eğitim Tatbikatları"
 NOR_joint_training_exercise_desc:0 "Zafer elde etmeyi umuyorsak, kuvvetlerimiz [FROM.GetNameDef]'in kuvvetleriyle bir olmalıdır. Bu ancak müttefiklerimizle eğitim ve derin işbirliği ile yapılabilir."
 NOR_lobby_for_parliamentary_support:0 "[FROM.GetAdjective] Hükümetinde destek için lobi yap"
 NOR_lobby_for_parliamentary_support_desc:0 "Ev sahiplerimiz şimdiye kadar çok cömert davrandılar, ama belki de halkımızın neler yaşadığını onlara hatırlatmamız gerekiyor ki bizim için nelerin tehlikede olduğunu asla unutmasınlar."
 NOR_make_assurances_to_the_people:0 "[NOR.GetNonIdeologyName] Halkına Güvence Ver"
 NOR_make_assurances_to_the_people_desc:0 "[NOR.GetName] için kesinlikle korkutucu bir zaman, bu yüzden medya aracılığıyla bunun üstesinden geleceğimize ve diğer tarafa geçtiğimizde lütufkar kralımızın hayatta kalma mücadelemize öncülük edeceğine dair güvence vermeliyiz."
 NOR_modernize_armed_forces_decision:0 "Silahlı Kuvvetleri Modernize Et"
 NOR_modernize_armed_forces_decision_desc:0 "[ROOT.GetAdjective] ordusu o kadar uzun süredir ihmal edildi ki, silahlı kuvvetlerimiz bir savaş alanından çok bir müzeye daha uygun görünüyor."
 NOR_monarchist_preparation_decisions_category:0 "Kral Haakon'a Saltanatına Desteğimizi Göster"
 NOR_monarchist_preparation_decisions_category_desc:0 "Tahta çıkmasından önce bile, mütevazı Kralımız Haakon VII, yetkilerini Storting'e ve seçmenlerine devretmiştir. Bu o zamanlar iyiydi, ama ona [ROOT.GetName] ülkesinin doğrudan kontrolünü ele geçirmesini desteklediğimizi, kontrol edecek bir şey kalmadan önce göstermeliyiz.\n\n\nMonarşiye Toplam Destek:  [?NOR.NOR_country_preparedness]/30"
 NOR_move_government_headquarters_decision:0 "Hükümeti [FROM.GetName] Eyaletine Taşı"
 NOR_move_government_headquarters_decision_desc:0 "Hükümetimiz düşmanın eline geçerse, bu bizim ve Kralımızın ve Prens'imizin sonu olur. Tek seçenek hareket halinde kalmak ve kaçınılmaz olanı olabildiğince uzun süre ertelemektir."
 NOR_naval_expanion:0 "Donanma Genişlemesi"
 NOR_naval_expanion_desc:0 "Hayatta kalacaksak kıyı şeridimizi savunmalıyız ve bunun için gemilere ihtiyacımız olacak. Her fiyortu bir tersane yapmalıyız."
 NOR_prepare_communist_unlock_TT:0 "Komünist Devrim başladığında §GTerritory ve Birlikler§! veren, ancak eyaletteki §Rbinalara zarar veren§! §YDevlette Proletaryayı Ayaklandır§! kararını açar."
 NOR_prepare_exile:0 "Sürgüne Hazırlan"
 NOR_prepare_exile_desc:0 "Gerçek inkar edilemez. Ulusumuz düşmanlarımızı sonsuza dek püskürtemez, ancak başka bir gün savaşmak için ülkeden olabildiğince çok şey çıkarmak için yeterince uzun süre savunabiliriz."
 NOR_prepare_fascist_unlock_TT:0 "§GFaşizm Desteğini Artıran§! ve İç Savaş başladığında §GTerritory ve faydalar§! veren, ancak §RSivil Sanayiye§! ceza veren §YDevlette Destek Oluştur§! kararlarını açar."
 NOR_prepare_historical_unlock_TT:0 "§GCivilian İnşaatını§! hızlandıran ancak §RAskeri İnşaat ve Savunmalara§! ceza veren §YGeliştirme Eyaleti§! kararlarını açar."
 NOR_prepare_state_alt_dem:0 "[FROM.GetName] Eyaletini Savaşa Hazırla"
 NOR_prepare_state_alt_dem_desc:0 "Gelecek olan için feci şekilde hazırlıksızız. Savaş patlak verdiğinde, [FROM.GetName] eyaletinin savaş çabalarına katkıda bulunabilmesi için uygun önlemleri almalıyız. Bazı insanlar anlamayacak, ama seçimimizi yaptık. Geri dönüş yok."
 NOR_prepare_state_communist:0 "[FROM.GetName] Eyaletinde Proletaryayı Ayaklandır"
 NOR_prepare_state_communist_desc:0 "[FROM.GetName] halkı uykularında çok uzun süre sömürüldü. Devrimimizin coşkulu tohumlarını ekelim."
 NOR_prepare_state_fascist:0 "[FROM.GetName] Eyaletinde destek oluştur"
 NOR_prepare_state_historical:0 "[?FROM.GetName] Eyaletini Geliştir"
 NOR_prepare_state_historical_desc:0 "Sanayi tabanımız harabe halinde, ancak [ROOT.GetName] halkının durumunu iyileştirmek ve en kötüsü olursa hayatta kalma şansımızı artırmak için gereken çabayı göstermeye hazırız."
 NOR_prepare_state_monarchist:0 "[FROM.GetName] Eyaletinde Monarşist Gösteri"
 NOR_prepare_state_monarchist_desc:0 "[FROM.GetName] halkına 1905 seçimini ve neden ezici bir çoğunlukla kralını bu makama seçtiklerini hatırlatmak gerekiyor. Kısa sürede kralın doğrudan müdahalesini talep edeceklerdir."
 NOR_promote_the_armed_defense_of_the_country:0 "[NOR.GetName] Silahlı Savunmasını Teşvik Et"
 NOR_promote_the_armed_defense_of_the_country_desc:0 "[NOR.GetName] halkına ülkemizi savunmazlarsa ne olacağı hatırlatılmalıdır. Yaklaşan çatışmada herkes kendi payına düşeni yapmalıdır."
 NOR_prop_up_the_economy:0 "Ekonomiyi Destekle"
 NOR_prop_up_the_economy_desc:0 "Halk açsa siyasi hedeflerimize ulaşamayacağız. Bağlı Devletlerimizin ve onların ihtiyaçlarının çaresine bakmak için monarşist seferimize ara vermeliyiz."
 NOR_public_investment_drive:0 "Kamu Yatırım Hamlesi"
 NOR_public_investment_drive_desc:0 "[ROOT.GetName] ülkesinde yapılması gereken çok iş var ve görünüşe göre kamu sektörünün doğrudan yatırımı olmadan yapılmayacak. Ülkeyi altyapı ve inşaat projeleriyle dolduralım."
 NOR_request_reinstatement:0 "[FROM.GetNameDef] ülkesinden yeniden göreve getirilme iste"
 NOR_request_reinstatement_desc:0 "Düşmanımız [NOR.GetName] topraklarında zemin kaybediyor ve hükümetimizin hak ettiği yere bir kez daha geri getirilme zamanının geldiğini düşünüyoruz."
 NOR_revolution_support_counter:0 "\n\n\nDevrimimize Toplam Destek:  [?NOR.NOR_country_preparedness]/[?NOR.NOR_comm_prep_max_preparedness]"
 NOR_support_rebellion:0 "[FROM.GetName] Eyaletinde İsyanı Destekle"
 NOR_support_rebellion_desc:0 "[FROM.GetName] eyaletindeki direniş çabalarımız sonuç verdi. Oradaki halk, zalimlerine karşı harekete geçmeye hazır. Onlar savaşı başlatsın, ve onlar yapar yapmaz, biz de eve dönüp savaşmaya hazır olacağız."
 NOR_unity_parade:0 "[FROM.Capital.GetCapitalVictoryPointName] şehrinde Birlik Geçit Töreni"
 NOR_unity_parade_desc:0 "O büyük şehrin halkına bizim mücadelemizle onların mücadelesinin bir ve aynı olduğunu hatırlatmak için [FROM.Capital.GetCapitalVictoryPointName] sokaklarını seslerimizle dolduralım."
 NOR_weapons_for_the_resistance:0 "Silah Tedarik Et ve Dağıt"
 NOR_weapons_for_the_resistance_desc:0 "Geniş ticaret filomuzu hem buradaki çabalarımız hem de anavatanımızdaki direnişçiler için silah tedarik etmek üzere kullanabiliriz. Oradaki silahlar düşmanımızın [NOR.GetNonIdeologyName] üzerindeki hakimiyetini zayıflatacak ve buradaki silahlar onların tiranlığına son darbeyi indirecektir."
 SWE_activate_all_home_guard:0 "Tüm Yurt Muhafızları tümenlerini etkinleştir"
 SWE_activate_all_home_guard_tt:0 "Tüm ülkedeki tüm Hemvärn tümenlerini aynı anda etkinleştirir"
 SWE_activate_home_guard:0 "Hemvärn'ı Etkinleştir"
 SWE_activate_home_guard_tt:0 "Bu eyaletteki Yurt Muhafızları tümenlerini etkinleştirir"
 SWE_air_raid_shelters:0 "[SWE_air_raid_shelters_loc]"
 SWE_air_raid_shelters_activate:0 "Hava saldırısı sığınakları"
 SWE_air_raid_shelters_revoke:0 "$SWE_air_raid_shelters_activate$ kararını geri al"
 SWE_appeal_for_support_cat:0 "Destek İçin Başvur"
 SWE_appeal_for_support_dec_tt:0 "§RDestekçiler gelecekte karşılığını bekleyecek ve yükümlülükler yerine getirilmezse istikrar büyük ölçüde etkilenecektir!§!"
 SWE_appeal_to_aristocracy:0 "Aristokrasiye yaklaş"
 SWE_appeal_to_industrialists:0 "Sanayicilerle buluş"
 SWE_appeal_to_military:0 "Orduyla buluş"
 SWE_appeal_to_rural_people:0 "Kırsal halkı topla"
 SWE_ball_bearing_trade_tt:0 "Yabancı uluslara Bilyalı Rulman ticareti yapılmasına izin verir, bu da onların §YTanks§! ve §YPlanes§! üretimini artırır.\nBu ticareti kabul ederlerse, bize ya\n  §YOrdu§!, §YHava§! ve §YDonanma§! Deneyimi: §G+20§!\n  İstikrar: §G+2%§!, §G+15§! Haftalık İnsan Gücü (Her ek ticaret için birikir) \n  §G+25%§! §YGemi§!, §YRadar§!, §YSentetik Kaynaklar§! veya §YDestek Teknolojileri§! için Araştırma Bonusu sağlanma seçeneği verilecektir!"
 SWE_ball_bearings_cat:0 "Bilyalı Rulman Ticareti"
 SWE_blow_up_the_mines:0 "Madenleri havaya uçur"
 SWE_bop_suspend_riksdag:0 "Riksdag'ı Askıya Al"
 SWE_bop_suspend_riksdag_desc:0 "İktidardaki hakimiyetimiz sağlam bir şekilde kurulduğuna göre, nihayet modası geçmiş Riksdag kurumunu ve ilgili seçimleri ortadan kaldırabiliriz."
 SWE_coalition_war_cabinet_cat:0 "Demokratik Savaş Kabinesi"
 SWE_coax_countries_that_rejected:0 "[FROM.GetName] ülkesini Nordik Savunma Konseyi'ne katılmaya ikna et"
 SWE_coax_nordic_defense_council_cat:0 "Nordik Ülkelerini Nordik Savunma Konseyi'ne katılmaya ikna et"
 SWE_communist_foreign_influence:0 "Yabancı Sosyalist Nüfuz"
