 FIN_finnish_resistance_category_desc:0 "Gizli bir askeri operasyonun parçası olarak, [ROOT.GetAdjective] Ordu'suna ait büyük miktarda silah ve teçhizat, [ROOT.GetAdjective] Direniş unsurlarının birliklerimize karşı mücadeleye devam etmelerine yardımcı olmak amacıyla Finlandiya'ya dağılmış depolardaydı."
 FIN_finno_soviet_kinship_war:0 "Fin-[ROOT.GetAdjective] Akrabalık Savaşı"
 FIN_finno_soviet_kinship_war_desc:0 "Rus iç savaşı sırasında Finler, topraklarımızı bizden çalmak için topraklarımıza girdikleri akrabalık savaşlarına giriştiler ve şimdi yine aynısını yapmaya başladılar."
 FIN_foreign_politics_decision_category:0 "Dış Politika"
 FIN_form_a_military_government:0 "Bir Askeri Hükümet Kur"
 FIN_form_a_military_government_desc:0 "Mevcut sivil hükümet, düşmanlık ve zorluklar karşısında zayıflık göstermiştir. $FIN_carl_mannerheim$ daha önce ülkemize iyi hizmet etti ve kesinlikle tekrar edecektir. Her düşmanımızı püskürtmek için bir Askeri Hükümet kurmalıdır."
 FIN_gather_funds_for_womens_shelters:0 "Kadın Sığınma Evleri için Fon Topla"
 FIN_gather_funds_for_womens_shelters_desc:0 "$FIN_miina_sillanpaa$ son on yıldır çalışan ve bekar kadınların hakları için kampanya yürüterek ve kadın sığınma evleri kurarak çok çalıştı. Hükümet onun faaliyetlerini desteklerse daha da iyi sonuçlar elde edebilirdi."
 FIN_gather_popular_support:0 "Halk Desteği Topla"
 FIN_gather_popular_support_dec_tt:0 "Tarafımız toplam toprak ve askeri birimlerin §G+10%§!'unu alacak. \nEkstra Komünist §YMilis§! Tümenleri ortaya çıkacak."
 FIN_gather_popular_support_desc:0 "Halk, herhangi bir devrim veya hükümet için hayati önem taşır ve onlardan alabileceğimiz tüm desteği toplamak için elimizden gelenin en iyisini yapmalıyız."
 FIN_hold_leningrad_mission:0 "[195.GetName] Eyaletini Tut"
 FIN_hold_leningrad_mission_desc:0 "[195.GetName], kuvvetlerimiz tarafından ele geçirilmiş olabilir, ancak taleplerimizi uygulamak için, [SOV.GetAdjective] kuvvetleri düzgün bir şekilde moral bozukluğuna uğrayana kadar bölgeyi tutmalıyız."
 FIN_infiltrate_soviet_commandos:0 "Sovyet Komandolarını Finlandiya'ya Sızdır"
 FIN_infiltrate_soviet_commandos_dec_tt:0 "§G3 Tümen§! 6 §YPiyade§! taburu, 2 §YTopçu Tugayı§! ve 4 §YDestek Taburu§! ile başkentimizde ortaya çıkacak."
 FIN_infiltrate_soviet_commandos_desc:0 "Sovyet Komandoları en büyük askerlerden bazılarıdır ve devrimimiz için faydalı olabilirler."
 FIN_instigate_a_new_karelian_uprising:0 "Yeni bir Karelya Ayaklanması Başlat"
 FIN_instigate_a_new_karelian_uprising_desc:0 "Heimosodat ruhunu canlandırarak, yeni bir Karelya ayaklanması yaratmaya çalışmalı ve Karelya halkının arzu ettikleri bağımsızlığı aramasına izin vermeliyiz."
 FIN_integrate_ingria_additional_states:0 "[FROM.GetName] ülkesini Ingria Cumhuriyeti'ne ekle"
 FIN_integrate_ingria_additional_states_desc:0 "Yeni kurulan Ingria Cumhuriyetimize entegre edilebilecek daha fazla bölge var ve [FROM.GetName] onlardan biri."
 FIN_integrate_ingria_states:0 "[FROM.GetName] ülkesini Ingria Cumhuriyeti olarak entegre et"
 FIN_integrate_ingria_states_desc:0 "Yeni kurulan Ingria Cumhuriyetimize entegre edilebilecek daha fazla bölge var ve [FROM.GetName] onlardan biri."
 FIN_integrate_karelia_additional_states:0 "[FROM.GetName] ülkesini Karelya Cumhuriyeti'ne ekle"
 FIN_integrate_karelia_additional_states_desc:0 "Karelya Cumhuriyeti hala Karelyalıların yaşadığı tüm toprakları kapsamıyor ve [FROM.GetName]'i entegre ederek durumu çözmeye çalışabiliriz."
 FIN_integrate_karelia_puppet:0 "[FROM.GetName] ülkesini bir Cumhuriyet olarak entegre et"
 FIN_integrate_karelia_puppet_desc:0 "Karelya'yı kanatlarımız altına alabileceğimiz yeni bir Cumhuriyet olarak kurma zamanı geldi."
