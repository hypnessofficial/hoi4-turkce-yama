 TRADE_AUTO_IMPORT_ACCEPTED_SHORTAGE_ADD_DESC:0 "§HKabul edilen açık§!\nOtomatik İthalat, bu kaynakta en fazla belirtilen miktarda açık bırakır.\n\n§Y+1§! eklemek için §Gtıkla§!\n§Y+5§! eklemek için §GCtrl+Tıkla§!\n§Y+10§! eklemek için §GShift+Tıkla§!"
 TRADE_AUTO_IMPORT_ACCEPTED_SHORTAGE_DESC:0 "§HKabul edilen açık§!\nOtomatik İthalat, bu kaynakta en fazla belirtilen miktarda açık bırakır."
 TRADE_AUTO_IMPORT_ACCEPTED_SHORTAGE_SUB_DESC:0 "§HKabul edilen açık§!\nOtomatik İthalat, bu kaynakta en fazla belirtilen miktarda açık bırakır.\n\n§Y1§! çıkarmak için §Gtıkla§!\n§Y5§! çıkarmak için §GCtrl+Tıkla§!\n§Y10§! çıkarmak için §GShift+Tıkla§!"
 TRADE_AUTO_IMPORT_BLOCKS_CANCEL:0 "§ROtomatik İthalat etkin. Ticareti elle değiştirmeden önce devre dışı bırakılmalıdır.§!"
 TRADE_AUTO_IMPORT_BLOCKS_PROPOSE:0 "§ROtomatik İthalat etkin; ticaret teklif etmek için devre dışı bırak§!"
 TRADE_AUTO_IMPORT_BUDGET_DESC:0 "Otomatik ithalatın kullanabileceği azami §Hsivil fabrika§! sayısı.\n\nTicaret için kullanılabilir fabrikalarımızın üzerine çıkarılamaz.\n\n§RBu değeri değiştirmek için Otomatik İthalat etkin olmalıdır.§!"
 TRADE_AUTO_IMPORT_DESC:0 "Etkinleştirildiğinde, eksikliğini çektiğin stratejik kaynakları ithal etmek için otomatik olarak §Hsivil fabrika§! kullanılır. Otomatik İthalat, kaynakların açığa düşmesini önlemek üzere ticaret başlatır ve sonlandırır. Kuvvetlerimizin tükettiği §Hyakıt§! üretimimizi aşıyorsa bunu karşılamak için §Hpetrol§! ithal edilir. §HYakıt azaldığında petrole öncelik ver§! seçiliyse ve yakıt stoku %50'nin altına düşerse önce petrol ithal edilir; bütçede kalan fabrikalar da stok dolana kadar ek petrol ithal eder.\n\nOtomatik ithalat önce ihtiyacımızın tamamını karşılayabilecek ortakları, ardından §Hittifak üyelerini§!, sonra en fazla kaynak sağlayabilecek ülkeleri ve son olarak §Hkonvoy§! gerektirmeyen rotaları tercih eder. Bir ticaret ortağı ödediğimiz kaynakları artık sağlayamıyorsa ve daha iyi bir ortak açığı kapatabiliyorsa mevcut ithalat azaltılır veya başka bir ortakla değiştirilir.\n\n§gOtomatik İthalat etkinken ithalatı elle yönetemezsin.§!"
 TRADE_AUTO_IMPORT_PRIORITIZE_FUEL:0 "Yakıt azaldığında petrole öncelik ver"
 TRADE_AUTO_IMPORT_PRIORITIZE_FUEL_DESC:0 "§HYakıt§! stoku azaldığında, diğer tüm kaynaklardan önce §Hpetrol§! ithal edilir ve bütçede kalan fabrikalar stok dolana kadar ek petrol ithal eder.\n\nİşaretlenmezse petrol de diğer kaynaklar gibi listedeki sırasını korur."
 TRADE_AUTO_IMPORT_PRIORITY_DESCRIPTION:0 "İthalat önceliğini değiştirmek için kaynakları sürükle. Kabul edilecek açığı belirlemek için §H-§! ve §H+§! düğmelerini kullan."
