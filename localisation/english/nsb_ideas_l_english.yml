 SOV_politicized_military:0 "Siyasallaşmış Ordu"
 SOV_politicized_military_battle_priests:0 "Orduda Savaş Rahipleri"
 SOV_politicized_military_battle_priests_desc:0 "Askerî birimlerimiz içinde Savaş Rahipleri rolünü üstlenerek, din adamları şimdi saflar arasında morali yüksek tutmaktan ve birliklerin Kilise'nin ve Tanrı'nın bizim tarafımızda olduğunu bilmelerini sağlamaktan sorumludur."
 SOV_politicized_military_desc:0 "Askerî komiserler genellikle saflar arasında ateşli ideolojik konuşmalar ve siyasi tartışmalar yapar, ancak birçok durumda aşırı yönetim, askerî subayların aşırı gayretli denetimi ve hatta birlik komutanlarının emirlerinin engellenmesi gibi faaliyetlerde de bulunurlar."
 SOV_politicized_military_swap:0 "Askerî Siyasi Danışmanlar"
