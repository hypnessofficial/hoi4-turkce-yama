 SOV_purged_junior_army_officers_1:0 "Genç Ordu Subayları Tasfiye Edildi"
 SOV_purged_junior_army_officers_1_desc:0 "Önemli sayıda genç Ordu subayı, kışkırtma, sabotaj ve anti-sovyet düşünce suçlamalarıyla NKVD tarafından tutuklandı. Geçmiş savaşlardan bu kadar çok deneyimli subay ve gazinin kaybı, Kızıl Ordu'yu tehlikeli bir düzensizlik içinde bıraktı."
