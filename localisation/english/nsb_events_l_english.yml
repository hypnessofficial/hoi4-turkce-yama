l_english:
 BALTIC_entente_events.1.a:0 "Birlikte daha güçlü büyüyoruz."
 BALTIC_entente_events.1.b:0 "Demokrasiyi yeniden kurmak için bir fırsat!"
 BALTIC_entente_events.1.d:0 "Baltık Birliği'nin lideri olarak [From.GetNameDef], birliğin üye devletleri için yeni bir girişim başlattı. Bu fon, [Root.GetNameDef] ve [From.GetNameDef] için karşılıklı fayda sağlıyor ve uluslarımızın sürekli özgürlüğüne ve gelişimine olan bağlılığı gösteriyor!"
 BALTIC_entente_events.1.t:0 "[From.GetNonIdeologyName], Baltık Birliği'ne Yatırım Yapıyor"
 BALTIC_entente_events.6.a:0 "Mükemmel bir girişim!"
 BALTIC_entente_events.6.b:0 "Kesinlikle olmaz!"
 BALTIC_entente_events.6.d:0 "Baltık Antantı, Baltık devletleri arasında gevşek bir ittifak olarak ilk kurulduğundan bu yana oldukça gelişti. Şimdi, Baltık Devletleri siyasi olarak o kadar iç içe geçmiş durumda ki, neredeyse aynı ulus gibiler. Görünen o ki [From.GetLeader], bu birliğin kendi başına tam bir ulus haline gelmesini, Baltık Devletlerini hem askeri hem de sivil hükûmetlerde birleştirmeyi teklif ediyor."
 BALTIC_entente_events.6.t:0 "[From.GetNonIdeologyName] Birleşme Teklif Ediyor"
 BALTIC_events.1.a:0 "[From.GetAdjective] dostlarımızı savunacağız."
 BALTIC_events.1.b:0 "[From.GetLeader]'i veya [From.GetLeader.GetHerHis] hükûmetini desteklemiyoruz."
 BALTIC_events.1.d:0 "[From.GetNameDef]'den [Root.GetLeader]'ye bu sabah [Root.GetNameDef]'nin [From.GetAdjective] bağımsızlığına ilişkin garantilerini yenilemesini talep eden bir telgraf teslim edildi. [Root.GetNameDef] ve [From.GetNameDef] arasında eyaletin 1918'deki kuruluşundan bu yana uzun süredir devam eden dostluğa atıfta bulunan [From.GetLeader], [From.GetLeader.GetHerHis] ulusunun hayatta kalmasının Doğu Avrupa'da barışın devamı için zorunlu olduğu konusunda ısrar ediyor.\n\nAralarında artan gerilimlerle birlikte [From.GetNameDef] ve [SOV.GetNameDef], [From.GetLeader]'nin teklifini kabul etmek, [Root.GetNameDef]'yi [SOV.GetAdjective]'lerle çatışmaya getirebilir..."
 BALTIC_events.1.t:0 "[From.GetNameDefCap] Garanti İstiyor"
 BALTIC_events.101.a:0 "Güvendeyiz."
 BALTIC_events.101.d:0 "[From.GetLeader], devam eden [Root.GetAdjective] bağımsızlığına [From.GetHerHis] desteğini ilan etti ve [Root.GetNameDef]'in varlığını tehdit eden tüm çatışmalara katılacak."
 BALTIC_events.101.t:0 "[From.GetNameDefCap] Kabul Ediyor!"
 BALTIC_events.102.a:0 "Başka bir çözüm bulmak zorunda kalacağız."
 BALTIC_events.102.d:0 "[Root.GetLeader]'in büyük hayal kırıklığına rağmen, [From.GetAdjective] dışişleri bakanlığı [Root.GetNameDef] ile askeri bir ilişki kurmamaya karar verdi."
 BALTIC_events.102.t:0 "[From.GetNameDefCap] Reddediyor!"
 BALTIC_events.11.a:0 "Hainler!"
 BALTIC_events.11.d:0 "Bir dizi anti-komünist yayın, ulusumuzun dört bir yanındaki [Root.GetAdjective] vatandaşlarının eline geçti. Bu propaganda, [Root.GetLeader]'in karakterine saldırıyor, [Root.GetLeader.GetHerHim]'i bir hain ve bir [SOV.GetAdjective] piyonu olarak nitelendiriyor. Bu yayınların doğası, komünist devrimin uluslararası değerlerini reddederek [Root.GetAdjective] milliyetçiliğini yüceltiyor. Hiç şüphe yok ki, bu yayınların yeraltında dağıtılmasıyla milliyetçi duygular güçlenmiştir."
 BALTIC_events.11.t:0 "Orman Kardeşleri Propagandası"
 BALTIC_events.12.a:0 "Hepsi sınıf haini."
 BALTIC_events.12.d:0 "Sanki yoktan var oldular, [forest_brothers_raid_state_target.GetName]'daki birkaç büyük sanayi bölgesine saldırdılar ve oradaki teçhizata ciddi hasar verdiler. Neyse ki, saldırı gece fabrikalar kapalıyken gerçekleşti, ancak devlet mülküne verilen hasar çok büyüktü."
 BALTIC_events.12.t:0 "[forest_brothers_raid_state_target.GetName]'da Büyük Orman Kardeşleri Baskını"
 BALTIC_events.13.a:0 "Kahretsin onları!"
 BALTIC_events.13.d:0 "[forest_brothers_raid_state_target.GetName]'da devriye gezerken, garnizon kuvvetleri bir Orman Kardeşleri baskınına uğradı. Bizim tarafımızdan alınan hasar büyük ölçüde önemsiz olsa da, çatışma haberi yerel halk arasında hızla yayıldı ve birçok kişi Orman Kardeşleri'ni [Root.GetAdjective] milliyetçiliğinin şampiyonları olarak görmeye başladı ve [Root.GetLeader]'in lider olarak meşruiyetini sorguluyor."
 BALTIC_events.13.t:0 "Orman Kardeşleri ile Çatışma"
 BALTIC_events.14.a:0 "Bu hainlere son vereceğiz!"
 BALTIC_events.14.d:0 "Geçtiğimiz birkaç hafta içinde, bir dizi tüfek ve diğer askeri teçhizat üretim hatlarından kayboldu ve [Root.GetAdjective] Kızıl Ordusu'nun eline hiç ulaşmadan fabrikalardan çıktı. Bu kayıp teçhizatın kaynağının Orman Kardeşleri olduğu ortaya çıktı. Hükûmet şimdi bu suçun failinin farkında olsa da, üretim hatlarındaki dizginleri sıkılaştırmak ve tek bir merminin bile bir Orman Kardeşi'nin tüfeğinin namlusuna girmemesini sağlamak birkaç hafta sürecek."
 BALTIC_events.14.t:0 "Orman Kardeşleri Teçhizat Sızdırıyor"
 BALTIC_events.18.a:0 "[Root.GetNameDefCap] asla komünist olmayacak!"
 BALTIC_events.18.d:0 "[From.GetNameDefCap], sokaklarımızda komünist propaganda yayarak ve muhalifleri silahlandırarak [Root.GetAdjective] siyasetini etkilemeye başladı. Ancak bu propagandaya karşı koyarak onu tamamen yasaklama ve kendimizi [From.GetAdjective] tehdidinden kurtarma umudumuz olabilir."
 BALTIC_events.18.t:0 "Propaganda Savaşı"
 BALTIC_events.19.a:0 "Bu doğal bir seçim!"
 BALTIC_events.19.desc:0 "[ROOT.GetNameDef] için harika bir gün! Yoldaşlarımızın cesur mücadelesinden sonra, [SOV.GetNameDefCap] haklı olarak yeni kurtarılan [BALTIC_country_to_transfer.GetNonIdeologyName]'ın, cesur işçileriyle birlikte bizim yetki alanımıza gireceğini ilan etti.[GetExtraBalticTerritories]\n\nBu bizi, işçi sınıfının düşmanlarıyla savaşacak kadar güçlü birleşik bir Baltık Devleti'ne bir adım daha yaklaştırıyor."
 BALTIC_events.19.extra:0 "Ayrıca, işgal ettikleri [BALTIC_loose_territory_country.GetNonIdeologyAdjective] topraklarının kontrolünü de bize devrettiler, bu yüzden [BALTIC_loose_territory_country.GetNonIdeologyName]'ın daimi denetçileri olmaya layık olduğumuzu kanıtlamaya devam etmeliyiz."
 BALTIC_events.19.t:0 "[SOV.GetNameDefCap] bize [BALTIC_country_to_transfer.GetNonIdeologyName]'ı emanet ediyor."
 BALTIC_events.2.a:0 "Katılacağız!"
 BALTIC_events.2.b:0 "Bence daha iyi seçeneklerimiz var."
 BALTIC_events.2.d_baltic:0 "[From.GetLeader] ve [From.GetHerHis] kabinesi, gevşek bir şekilde organize olmuş Baltık Antantı'nı askeri bir ittifaka dönüştürme teklifiyle [Root.GetAdjective] hükûmetine başvurdu. Anlaşmayı imzalamak, savaş zamanlarında ordularımızın birleşeceği ve egemenliğimize yönelik tehdide birlikte karşı koyacağımız anlamına gelecektir.\n\nDoğası gereği savunmacı olsa da, [From.GetLeader] sonunda Baltık Antantı'nı Riga'dan Oslo'ya uzanan bir ittifak haline getirmeyi umuyor, ancak böyle bir hırs pek olası görünmüyor."
 BALTIC_events.2.d_scandi:0 "[From.GetLeader] ve [From.GetHerHis] kabinesi, gevşek bir şekilde organize olmuş Baltık Antantı'nı askeri bir ittifaka dönüştürme teklifiyle [Root.GetAdjective] hükûmetine başvurdu. Anlaşmayı imzalamak, savaş zamanlarında ordularımızın birleşeceği ve egemenliğimize yönelik tehdide birlikte karşı koyacağımız anlamına gelecektir.\n\n[From.GetLeader], sınırlarındaki tehdit Baltıklardan alacağını aldıktan sonra, savaş hırslarında sıradakinin kesinlikle İskandinavya olduğu ve bu küresel çatışma zamanlarında birlikte güçlü durmamızın akıllıca olacağı konusunda ısrar ediyor."
 BALTIC_events.2.t:0 "[From.GetNameDefCap] Baltık İşbirliği Arıyor"
 BALTIC_events.202.a:0 "Bizi reddetmeye nasıl cüret ederler!"
 BALTIC_events.203.a:0 "Hayal kırıklığı."
 BALTIC_events.203.d:0 "[SOV.GetAdjective] bir işgaline karşı koymak için yeterli destek toplayamayan [From.GetLeader], Baltık Antantı fikrinden vazgeçmeye ve bunun yerine başka seçenekler aramaya karar verdi. Ulusumuzun toplu hayal kırıklığına rağmen, [From.GetNameDef]'deki dostlarımızla birlikte [SOV.GetAdjective] ordusuna karşı durma hayali sadece bir hayal olarak kalacak."
 BALTIC_events.203.t:0 "Baltık Antantı Terk Edildi!"
 BALTIC_events.3.a:0 "Doğrudan eylem gerekli!"
 BALTIC_events.3.b:0 "Proletarya ancak kendini kurtarabilir."
 BALTIC_events.3.d:0 "[From.GetLeader]'in [From.GetAdjective] halk ordusu ile [From.GetNonIdeologyName]'in burjuva diktatörlüğü adına savaşan yanılgı içindeki proletarya arasındaki iç savaş devam ediyor, ancak görünen o ki [From.GetLeader] devrimi tek başına zafere götürmekte yetersiz kaldı. [Root.GetLeader]'in masasına [From.GetNonIdeologyName]'daki [Root.GetAdjective] büyükelçisinden, [From.GetAdjective] devrimcilerinin geleceğiyle ilgili endişeleri ifade eden bir mesaj ulaştı. Kendisi, bu iç savaş kaybedilirse, [From.GetNonIdeologyName]'da sosyalizmin başarılı olma umudunun sona ereceğine inanıyor."
 BALTIC_events.3.t:0 "[From.GetNameDefCap] Doğrudan Müdahale İstiyor"
 BALTIC_events.301.a:0 "[From.GetLeader.GetSheHeCap] haklı."
 BALTIC_events.301.d:0 "[From.GetNameDef]'deki dostlarımız ve müttefiklerimiz, [Root.GetLeader]'in doğrudan müdahale çağrısına katılmayı reddederek cevap verdiler. [From.GetLeader], eğer [Root.GetAdjective] işçileri kurtarılacaksa, bunu kendilerinin yapması gerektiğini ve [From.GetNameDef] adına yapılacak herhangi bir doğrudan müdahalenin bir emperyalizm eylemi olarak kabul edileceğini iddia ediyor."
 BALTIC_events.301.t:0 "[From.GetNameDefCap] Müdahale Etmeyi Reddediyor"
 BALTIC_events.4.a:0 "Başka seçeneğimiz yok."
 BALTIC_events.4.b:0 "Tahttan çekilmek mi? Asla!"
 BALTIC_events.4.d:0 "[Root.GetAdjective] halkı hükûmetten giderek daha fazla rahatsız oluyor ve bugün [Root.Capital.GetName] sokaklarında gerilim doruk noktasına ulaştı. Rejimden ve alt sınıf vatandaşların muamelesinden duyulan memnuniyetsizliği dile getiren protestolar, [Root.GetAdjective] askeri polisiyle birkaç şiddetli çatışmaya yol açtı ve protestocular sonunda [Root.GetLeader] ve [Root.GetRulingParty] Partisi'nin birkaç kilit üyesinin düzenlediği bir oturum sırasında [Root.Capital.GetName]'ın parlamento binasına ulaştı. Protestocular taleplerinde oldukça netler; [Root.GetLeader]'i ve [Root.GetLeader.GetHerHis] [Root.GetRulingParty] Partisi'ni hükûmetten uzaklaştırın ya da şiddetli bir devrimle yüzleşin."
 BALTIC_events.4.t:0 "Komünistler [Root.Capital.GetName] Üzerine Yürüyor!"
 BALTIC_events.5.a:0 "İlham verici bir fikir!"
 BALTIC_events.5.b:0 "Belarus, [Root.GetAdjective] kalacak."
 BALTIC_events.5.d:0 "Geçmişteki kısa ömürlü Litvanya-Belarus SSC'sinden ilham alan [From.GetLeader], [From.GetNameDef]'i Belarus SSC ile birleştirmek istiyor. [From.GetLeader.GetSheHeCap], iki ulusun birleşmesinin, Doğu ile Batı arasındaki engeli ortadan kaldırarak [From.GetNameDef]'in küresel devrime hizmet etme yeteneğini büyük ölçüde genişleteceğini iddia ediyor."
 BALTIC_events.5.t:0 "[From.GetNameDefCap], [From.GetNonIdeologyName]-Belarus Kurmak İstiyor"
 BALTIC_events.501.a:0 "[Root.GetNonIdeologyName] büyüyor!"
 BALTIC_events.501.d:0 "[From.GetNameDef]'den birleşik bir [Root.GetNonIdeologyName]-Belarus SSC kurma konusundaki [Root.GetAdjective] talebiyle ilgili haber geldi. [From.GetLeader], anakara Doğu Avrupa ile bir Baltık ülkesi arasındaki bu birleşmenin sunduğu fırsatlardan heyecan duyuyor ve böyle bir birliğin kaçınılmaz olarak Doğu ile Batı arasındaki boşlukları kapatacağını, kıta genelinde devrimi yayma yeteneğini kolaylaştıracağını iddia ediyor."
 BALTIC_events.501.t:0 "[From.GetNameDefCap] Kabul Ediyor!"
 BALTIC_events.502.a:0 "En azından denedik."
 BALTIC_events.502.d:0 "Orijinal Litvanya-Belarus SSC'si Doğu ile Batı arasındaki boşluğu kapatmak için kurulmuş olsa da, görünen o ki [From.GetLeader] artık böyle bir şeyin gerekli olduğuna inanmıyor ve Belarus'un SSCB'nin [Root.GetNameDef]'e devredilemeyecek ayrılmaz bir parçası olduğunu iddia etti."
 BALTIC_events.502.t:0 "[From.GetNameDefCap] Reddediyor!"
 BALTIC_events.503.a:0 "Bunu yakında halledeceğiz."
 BALTIC_events.503.d:0 "Litvanya-Belarus SSC'sinin mirasını geri alma girişiminde bulunan [From.GetNameDef], Belarus hükûmetinin üyelerini [From.GetNonIdeologyName]'e iltica etmeye teşvik ederek Belarus'taki hükûmeti istikrarsızlaştırmaya çalışıyor!"
 BALTIC_events.503.t:0 "Belarus'ta Propaganda Savaşı"
 BALTIC_events.6.a:0 "[From.GetLeader] haklı, birleşmeliyiz!"
 BALTIC_events.6.b:0 "Söz konusu bile olamaz! [Root.GetNonIdeologyName], [Root.GetAdjective] kalacak!"
 BALTIC_events.6.d:0 "Baltık Devletleri uzun zamandır yabancı emperyalizmin çizmeleri altında ortak acı ve baskı geçmişini paylaştı, ama artık yeter. [Root.GetNameDefCap] ve [From.GetNameDef] her ikisi de sosyalizm altında özgürleşti, ancak [From.GetLeader] bunun Baltıkların hayatta kalmaya devam edeceğinin bir garantisi olmadığını iddia ediyor. [From.GetLeader.GetSheHeCap], Baltıklar ulusal hatlar üzerinde bölünmüş kaldıkça kendimizi zayıf ve emperyalizm ile kapitalizme karşı savunmasız kıldığımızı ve ancak Birleşik bir Baltık Cumhuriyeti'ne birleşerek yabancı işgalcilerin saldırısına dayanabileceğimizi iddia ediyor."
 BALTIC_events.6.t:0 "[From.GetNameDefCap] Baltık Birleşmesi İstiyor"
 BALTIC_events.601.a:0 "Onları kendilerinden kurtaracağız."
 BALTIC_events.601.b:0 "Sonuçta kendi kaderlerini tayin etme hakları var."
 BALTIC_events.601.d:0 "[From.GetLeader], [Root.GetAdjective]'in birleşme talebine açık bir tiksinti ve ret ile yanıt verdi. Birçoğu [From.GetNameDef]'in kendi kendini yönetme hakkına saygı duysa da, Baltıkların bölünmüş bir güçten ziyade birleşik bir güç olarak daha iyi durumda olacağı yadsınamaz."
 BALTIC_events.601.t:0 "[From.GetNameDefCap] Reddediyor!"
 BALTIC_events.7.a:0 "İlham verici!"
 BALTIC_events.7.b:0 "Devrim bekleyebilir."
 BALTIC_events.7.d:0 "[Root.GetAdjective]'in Batı Avrupa'ya açılan kapısı olan [From.GetNameDefCap], bugün [Root.GetNameDefCap] adına [baltic_wargoal_target.GetNameDef]'i işgal etme planı önerdi. [From.GetLeader], bir [baltic_wargoal_target.GetAdjective] işgalinin, devrimi Avrupa geneline yayma ortak çabamızda paha biçilmez olacağını ve [baltic_wargoal_target.GetAdjective] hükûmeti dağıtıldıktan sonra daha fazla genişleme fırsatı açacağını iddia ediyor."
 BALTIC_events.7.t:0 "[From.GetNameDefCap], [baltic_wargoal_target.GetAdjective] İşgali Talep Ediyor"
 BALTIC_events.701.a:0 "Ne yapalım artık..."
 BALTIC_events.701.d:0 "[Root.GetAdjective]'in [baltic_wargoal_target.GetNonIdeologyName]'ı işgal etme talebi [From.GetNameDef] tarafından engellendi. Bir işgalin maliyetli olacağını ve [From.GetAdjective] ve [Root.GetAdjective] hayatlarına hiç de değmeyeceğini belirten [baltic_wargoal_target.GetNameDef], bugün herhangi bir komünist devrimci güçle karşı karşıya kalmayacak."
 BALTIC_events.701.t:0 "[From.GetNameDefCap], [baltic_wargoal_target.GetAdjective] İşgalini Engelliyor"
 BALTIC_events_10_tt:0 "'§Y[Root.GetNameDefCap], Polonya İşgali Talep Ediyor§!' olayını alır."
 BALTIC_events_15_tt:0 "'§Y[Root.GetNameDefCap], Litvanya İşgali Talep Ediyor§!' olayını alır."
 BALTIC_events_16_tt:0 "'§Y[Root.GetNameDefCap], Letonya İşgali Talep Ediyor§!' olayını alır."
 BALTIC_events_17_tt:0 "'§Y[Root.GetNameDefCap], Estonya İşgali Talep Ediyor§!' olayını alır."
 BALTIC_events_7_tt:0 "'§Y[Root.GetNameDefCap], Finlandiya İşgali Talep Ediyor§!' olayını alır."
 BALTIC_events_8_tt:0 "'§Y[Root.GetNameDefCap], Danimarka İşgali Talep Ediyor§!' olayını alır."
 BALTIC_events_9_tt:0 "'§Y[Root.GetNameDefCap], İsveç İşgali Talep Ediyor§!' olayını alır."
 ENG_operation_1:0 "Rapier Operasyonu"
 ENG_operation_2:0 "Sweetfish Operasyonu"
 ENG_operation_3:0 "Jester Operasyonu"
 ENG_operation_4:0 "Prominence Operasyonu"
 EST_events.1.a:0 "İyi bir öneri."
 EST_events.1.b:0 "[From.GetNameDef] için başka planlarımız var."
 EST_events.1.d:0 "Bir [SOV.GetAdjective] işgalinden korkan [From.GetLeader], [Root.GetNameDef] ve [From.GetNameDef] arasında bir anlaşma için resmi bir talepte bulundu. Anlaşma, bir saldırmazlık garantisinin yanı sıra [Root.GetNonIdeologyName] ve [From.GetNonIdeologyName] arasında işbirliği kurmayı amaçlayan bir dizi dostane düzenlemeyi içerecektir."
 EST_events.1.t:0 "[From.GetNameDefCap] Dostluk Anlaşmaları Arıyor"
 EST_events.10.a:0 "Gaziler yine omuz omuza savaşıyor!"
 EST_events.10.b:0 "Büyük bir gönüllü kuvveti yeterli olacaktır."
 EST_events.10.d:0 "[FIN.GetNonIdeologyName]'da iç savaş başladı, ancak [Root.GetNameDef]'in bu çatışmada ne rol oynayacağı sorusu devam ediyor. Şu anda, Vapsid'in [FIN.GetNonIdeologyAdjective] faşistleriyle işbirliği sadece onları silahlandırmak ve kendi başlarına iktidarı ele geçirmeleri için organize etmekti, ancak geçmişte [EST.GetAdjective] bağımsızlığını güvence altına almak için savaştıkları gibi, belki de [Root.GetLeader] bunu [EST.GetNonIdeologyName]'in Finlere olan borcunu ödeme fırsatı olarak görecektir."
 EST_events.10.t:0 "Müdahale Sorunu"
 EST_events.101.a:0 "Mükemmel."
 EST_events.101.d:0 "[From.GetLeader] açıkça [Root.GetNameDef] ve [From.GetNameDef] arasında potansiyel bir gelecek ittifakının değerini görüyor ve ulusumuzla dostane ilişkiler sürdürmeyi kabul etti."
 EST_events.101.t:0 "[From.GetNameDefCap] Kabul Ediyor"
 EST_events.102.a:0 "Kahretsin."
 EST_events.102.d:0 "[Root.GetLeader]'in en iyi çabalarına rağmen, [From.GetNameDef]'in [Root.GetNonIdeologyName]'e düşman olarak kaldığı anlaşılıyor. Reddetmeleri pek bir anlam ifade etmese de, bir [SOV.GetAdjective] işgali durumunda [From.GetNameDef]'in izlemekten başka bir şey yapmayacağı anlamına gelebilir."
 EST_events.102.t:0 "[From.GetNameDefCap] Reddediyor"
 EST_events.11.a:0 "İş bilmez yeni yetmeler."
 EST_events.11.d:0 "Artık Estonya'da yetkilendirilen Vaps, [Root.GetFascistParty] ile bir işbirliği anlaşması imzalamayı kabul etti. Vaps zaten Fin faşist gruplarını propaganda ve ulusal gösterilerle destekliyor, ancak hükümetin bu faşist unsurları yasaklamak için hızlı ve kararlı bir eyleme geçmesi bu sorunu tamamen ortadan kaldırabilir."
 EST_events.11.t:0 "Vaps ve [Root.GetFascistParty]"
 EST_events.2.a:0 "Başka seçeneğimiz yok."
 EST_events.2.b:0 "Vaps'ları derhal sürgün edin!"
 EST_events.2.d:0 "[From.GetLeader] bugün [From.GetNameDef] ve [Root.GetNameDef]'in birleşmesi için bir teklifte bulundu. [From.GetAdjective] hükûmeti ile [Root.GetNameDef]'in ayrılmaz bir şekilde iç içe olduğu yadsınamaz. Vaps'lar olmadan, [Root.GetFascistParty]'nin [Root.GetNonIdeologyName]'in kontrolünü ele geçirmesi neredeyse imkansız olurdu ve şimdi bile Vapsid sempatileri ordumuzda güçlü kalmaya devam ediyor. [From.GetLeader], Finlandiya ve Estonya'nın bir birliğinin, uluslarımızı yaklaşan [SOV.GetAdjective] işgaline karşı daha iyi savunacağını iddia ediyor."
 EST_events.2.t:0 "[From.GetNameDefCap] Birleşme Arıyor"
 EST_events.201.a:0 "Harika!"
 EST_events.201.d:0 "[From.GetLeader], iki ulusumuzun birleşmesine izin verme gibi akıllıca bir karar verdi. [From.GetLeader], [From.GetAdjective] hükûmetinin başı olarak [Root.GetLeader] lehine görevden çekildi ve yeni birleşmiş [Root.GetAdjective]-[From.GetAdjective] hükûmetinde daha çok bir yardımcı rol üstlendi."
 EST_events.201.t:0 "[From.GetNameDefCap] Birleşmeyi Kabul Ediyor"
 EST_events.202.a:0 "Uzun sürmez!"
 EST_events.202.d:0 "[Root.GetNonIdeologyName]'ın Vapsid hükûmetinin [From.GetNameDef] üzerindeki ezici etkisine rağmen, [From.GetLeader] [Root.GetAdjective]'in birleşme çabalarını reddetti."
 EST_events.202.t:0 "[From.GetNameDefCap], [Root.GetAdjective] Birleşmesini Reddediyor"
 EST_events.4.a:0 "Belki de farklı olduğumuzdan daha çok benziyoruz."
 EST_events.4.b:0 "Pan-Baltık kimliği mi? Öyle bir şey yok!"
 EST_events.4.d:0 "Baltık Devletleri genellikle yabancı güçler altında bastırılma geçmişini paylaştı; Lehler, Almanlar, Ruslar, ama [From.GetLeader] buna artık yeter diyor! Milliyetçilik ve kendi kaderini tayin etme erdemleri tüm Baltık halklarının kalbinde yansa da, [From.GetLeader] yabancı egemenlik tarihimizin tek başına birlik eksikliğimize atfedilebileceği ve ne kadar çok bağımsızlık arzusu olsa da, artan [SOV.GetAdjective] işgali tehdidinin hükûmetlerimiz tarafından bir tür pan-milliyetçiliğin benimsenmesini gerektirdiği iddiasında bulunuyor.\n\n[From.GetLeader.GetSheHeCap], halkımızı bizi köleleştirmeye cüret edecek yabancılara karşı güvende ve güçlü tutmak için bir [BAL_UNIFIED_fascism] öneriyor."
 EST_events.4.t:0 "[From.GetNameDefCap] Baltık Birleşmesi Arıyor"
 EST_events.401.a:0 "[From.GetNonIdeologyName] sadece bir başlangıç."
 EST_events.401.d:0 "[From.GetLeader], [Root.GetAdjective]'in pan-Baltık ulusal kimliği aşılama çabaları tarafından başarıyla etkilenmiş ve [From.GetFascistParty] Partisi'ni [Root.GetFascistParty] ile birleştirmeyi kabul etmiştir. Baltıkları birleştirme hedefinde [Root.GetLeader] için kesin bir zafer olan [Root.GetNameDef], [SOV.GetAdjective] işgalinden kendini savunmak için kesinlikle çok daha iyi bir konumda olacaktır."
 EST_events.401.t:0 "[From.GetNameDefCap] Kabul Ediyor!"
 EST_events.402.a:0 "Yoksa [SOV.GetAdjective]lere mi katılmayı tercih ederler? Hainler!"
 EST_events.402.d:0 "[Root.GetLeader]'in Baltık dayanışması söyleminden etkilenmeyen [From.GetNameDef], birleşmemizin [From.GetAdjective] halkının [From.GetNonIdeologyAdjective]ler için bir [From.GetNonIdeologyName] hakkını engellemeye yönelik bir emperyalizm eyleminden başka bir şey olmadığına inanarak [Root.GetNameDef] ile birleşmeyi reddetti."
 EST_events.402.t:0 "[From.GetNameDefCap] Birleşmeyi Reddediyor"
 EST_events.5.a:0 "[From.GetLeader] boşboğazın teki."
 EST_events.5.d:0 "[From.GetLeader] bugün, zayıf ve kendi halkını yabancı emperyalistlerden savunmakta etkisiz olduğunu iddia ederek [Root.GetAdjective] hükûmetine açık bir saldırı ilan etti. Bu şu anda pek bir anlam ifade etmese de, ufukta bir [From.GetAdjective] işgali bekleyebiliriz."
 EST_events.5.t:0 "[From.GetNameDefCap], [Root.GetAdjective] Bağımsızlığına Tecavüz Ediyor"
 EST_events.6.a:0 "Ne iyi bir fikir!"
 EST_events.6.b:0 "Ne saçmalık."
 EST_events.6.d:0 "[From.GetNameDefCap] bugün [FIN.GetNonIdeologyName] için [Root.GetFactionName]'e bir davetiye uzatılmasını talep etti. Uluslarındaki milliyetçiliğin ezici başarısını ve Fin-Estonya işbirliği için doğuştan gelen arzuyu gerekçe gösteren [From.GetLeader], [Root.GetAdjective] hükûmetinin [FIN.GetLeader]'i milliyetçi davaya müttefik olarak görmesi için tutkulu bir teklifte bulundu."
 EST_events.6.t:0 "[From.GetNameDefCap], [FIN.GetAdjective]'in [Root.GetFactionName]'e Girişini Talep Ediyor"
 EST_events.601.a:0 "[From.GetLeader] deli mi yoksa sadece beceriksiz mi?"
 EST_events.601.d:0 "[Root.GetNameDef], [From.GetFactionName]'e kucak açarak kabul edilmiş olsa da, görünüşe göre [From.GetLeader], [From.GetLeader.GetHerHis] kalbinde [FIN.GetNameDef]'in kendini savunma hakkına dair hiçbir merhamet beslemiyor. Finlere yaptığımız davetimiz reddedildi ve görünüşe göre uluslarımız şimdilik ayrı kalacak."
 EST_events.601.t:0 "[From.GetNameDefCap], [FIN.GetAdjective]'in [From.GetFactionName]'e Girişini Reddediyor"
 EST_events.7.a:0 "[Root.GetNonIdeologyName] için!"
 EST_events.7.d:0 "Şehrin her yerindeki sürekli yürüyüşler ve gösteriler sonunda [Root.GetNonIdeologyName]'da var olmaya devam eden azıcık birliği de kırdı ve ulus topyekûn bir iç savaşa bölündü. [Root.GetFascistParty] gruplarına yönelik önemsiz bir hükûmet baskını olması gereken şey dün protestocularla şiddetli bir çatışmaya dönüştü, gaziler bir zamanlar uğruna savaştıkları [Root.GetAdjective] ordusunun üyeleriyle çatıştı. Bir tarafta [Root.GetFascistParty] üyeleri ve diğer tarafta hükûmet sadıklarıyla, günün sonunda [Root.Capital.GetName]'da kimin oturacağı görülecek; [Root.GetLeader] mı yoksa [neutral_EST_civil_war.GetLeader] mı..."
 EST_events.7.t:0 "Vapsid İç Savaşı"
 EST_events.701.a:0 "Estonya daha güçlü duruyor."
 EST_events.701.d:0 "Vapsid göstericilerinin ülke genelindeki yürüyüşleri bugün, [Root.GetLeader]'in hükûmet temsilcileri ile Vaps'lar arasındaki çatışmaların şiddetli bir sonuca varmasıyla doruk noktasına ulaştı. Artur Sirk'in sesi eşliğinde, protestocular Riigikogu'nun kapılarını yıktılar ve orada hızla derme çatma barikatlar kurarak kolluk kuvvetlerinin binaya girmesini engellediler\nBirçok Estonyalı, [Root.GetLeader]'in protestoculara güçle karşılık vermesini bekliyordu, ancak ulusun şaşkınlığına, Riigikogu binası bugün [Root.GetLeader]'in istifa mektubunu aldı ve diktatörlük konumunu Artur Sirk'e devretti."
 EST_events.701.t:0 "[Root.GetLeader] Görevden Çekiliyor"
 EST_events.801.a:0 "Bu bir felaket."
 EST_events.801.b:0 "Bu isyancıları derhal bastırmalıyız!"
 EST_events.801.d:0 "[?ROOT.vaps_from.GetName]'daki [Root.GetFascistParty] gösterisi halktan karışık bir tepki ve yerel yetkililerden şiddetli bir tepkiyle karşılaştı. Kalabalıktakilerin çok azı yürüyüşün ne hakkında olduğunu bile anlayabildi, protestocular ve karşı protestocular arasındaki şiddet gösterinin merkezinde yer aldı. [Root.GetAdjective] hükûmeti zaten [Root.GetFascistParty]'i ortadan kaldırmak için çalışıyor ve bugünkü olaylar muhtemelen bu süreci hızlandırırken kalabalığı kazanmak için pek bir işe yaramadı."
 EST_events.801.t:0 "[?ROOT.vaps_from.GetName]'da Kaotik Yürüyüş"
 EST_events.802.a:0 "İlginç."
 EST_events.802.d:0 "[?ROOT.vaps_from.GetName] boyunca [Root.GetFascistParty] yürüyüşü nispeten olaysız geçti. Büyük nüfus merkezlerinden kaçınan ve bunun yerine [?ROOT.vaps_from.GetName]'ın daha kırsal bölgelerine odaklanan [Root.GetFascistParty], [Root.GetAdjective] yetkililerinden intikam almaktan kaçınırken [Root.GetName] halkına hareketin neyi temsil ettiğini gösterebildi."
 EST_events.802.t:0 "[?ROOT.vaps_from.GetName]'daki Yürüyüş"
 EST_events.803.a:0 "Çok ilginç."
 EST_events.803.d:0 "[?ROOT.vaps_from.GetName] eyaletinin her yerinde, [Root.GetFascistParty] göstericileri güçlü bir milliyetçi devlete desteklerini göstermek için akın akın ortaya çıktı. Yetkililer göstericilerin büyük nüfus merkezlerine yürümesini engellemeye çalışsa da, bu memurlar silahlarını bıraktı ve [Root.GetFascistParty] adamlarının sokaklarda barışçıl bir şekilde yürümesine izin verdi. Karşılaşacak büyük karşı protestocular olmadan, bu [Root.GetFascistParty] hareketi için yankı uyandıran bir zaferdi."
 EST_events.803.t:0 "[?ROOT.vaps_from.GetName]'da Ezici Faşist Yürüyüş"
 EST_events.9.b:0 "Belki de en iyisi sadece teslim olmaktır..."
 EST_events.901.a:0 "Peki, bu beklenmedikti!"
 EST_events.901.d:0 "Şaşırtıcı bir şekilde, [FROM.GetFascistParty] kuvvetleri bugün [From.GetAdjective] başkentine ilerlediğinde, beklendiği gibi bir iç savaş başlatmak yerine, eski [From.GetAdjective] hükûmeti gücünü teslim edeceğini ve [FROM.GetFascistParty] partisinin otoritesine boyun eğeceğini ilan etti."
 EST_events.901.t:0 "[?FIN.EST_previous_finnish_leader.GetName] Görevden Çekiliyor"
 FIN_karelian_uprising_supported_by_finland:0 "\n\nDurum, [FIN.GetAdjective] kuvvetlerinin sınırı geçerek çatışmayı genişletmesi ve [FIN.GetNameDef]'i [SOS.GetNameDef]'e karşı çatışmaya sokmasıyla daha da tırmandı."
 FIN_putting_down_insurgents_tt:0 "Eyalet, §YVapsid İsyancılarına§! sadık olmayacak!"
 GER_operation_1:0 "Walküre Operasyonu"
 GER_operation_2:0 "Schleifstein Operasyonu"
 GER_operation_3:0 "Stierkampf Operasyonu"
 GER_operation_4:0 "Erzengel Operasyonu"
 LAT_events.1.a:0 "[SOV.GetNameDefCap] gerçek tehdittir!"
 LAT_events.1.b:0 "[GER.GetNameDef]'e güvenemeyiz."
 LAT_events.1.d:0 "Bağımsız olmasına rağmen, [Root.GetNameDef] hiçbir zaman emperyalizmin zincirlerini ulusundan tam olarak sarsmayı başaramadı. Hem [GER.GetAdjective]ler hem de [SOV.GetAdjective]ler, [Root.GetNameDef]'in kendi kaderini tayin etme hakkına çok az veya hiç ilgi göstermeden [Root.GetNameDef]'i kendi imparatorluklarına hapsetme hırslarına ve tasarılarına sahipler. Birçoğu [Root.GetAdjective] bağımsızlığını korumak için her cephede savaşmaya hevesli olsa da, bu iki güç arasında en acil tehdidin kim olduğuna karar vermeli ve bir işgale hazırlanmak için uygun önlemleri almalıyız."
 LAT_events.1.t:0 "Gerçek Düşman"
 LAT_events.2.a:0 "Bir seçeneğimiz var mı?"
 LAT_events.2.b:0 "Kesinlikle olmaz!"
 LAT_events.2.d:0 "Baltık'taki artan baskıyı gerekçe gösteren [From.GetLeader], Baltık birleşmesinin üç devletin hayatta kalmaya devam etmesi için mutlak bir zorunluluk olduğunu ilan etti. Ancak, [From.GetNameDef] dışişleri bakanının talepleri sadece [Root.GetLeader]'i görevden almakla kalmayacak, aynı zamanda tüm [Root.GetRulingParty] partisini esasen [From.GetLeader] ve [From.GetLeader.GetHerHis] yönetimine tamamen tabi kılacaktır."
 LAT_events.2.t:0 "[From.GetNameDefCap], [Root.GetAdjective] İlhakını Talep Ediyor"
 LAT_events.3.a:0 "İlginç."
 LAT_events.3.d:0 "Baltık dayanışmasının doğasını ele alan etkileyici bir konuşmada, [From.GetLeader], yükselen Bolşevik tehdidi karşısında milliyetçiliğe olan [Root.GetLeader.GetHerHis] bağlılığından dolayı [Root.GetLeader]'ı övdü. [From.Getleader.GetSheHe]'in [From.GetAdjective] ve [Root.GetAdjective] kimliklerine saygı duyduğunu iddia etmesine rağmen, [From.Getleader.GetSheHe], bağımsızlıklarını koruma ortak hedeflerinde [From.GetNonIdeologyName] ve [Root.GetNonIdeologyName] arasında işbirliği çağrısında bulundu. Bu şimdilik pek bir anlam ifade etmese de, birçok kişi ufukta bir ittifak teklifinin olduğuna dair spekülasyon yapıyor."
 LAT_events.3.t:0 "[From.GetNameDefCap], [Root.GetAdjective] Milliyetçiliğini Destekliyor"
 LAT_events.5.a:0 "İlham verici!"
 LAT_events.5.b:0 "Hayır."
 LAT_events.5.d:0 "Batı Belarus şimdi sıkı bir şekilde [Root.GetFactionName] kontrolü altında olduğuna göre, [From.GetNonIdeologyName] diktatörü [From.GetAdjective] yönetimi altında Ostland işgal bölgesini kurma ilgisini açıkladı. Böyle bir teklifin arkasındaki mantık, Baltıklar ve Belarus genelinde faşist ideolojiyi teşvik etmek ve Doğu'daki [Root.GetFactionName] çıkarlarını ilerletmek olacaktır."
 LAT_events.5.t:0 "[From.GetLeader] Ostland Birleşmesi Arıyor"
 LAT_events.501.a:0 "Mükemmel!"
 LAT_events.501.d:0 "Ostland topraklarının [Root.GetAdjective] ellerine devredilmesi bir başarıydı ve [From.GetNameDef], Baltık devletleri ve batı Belarus'un işgalinin [Root.GetNameDef]'in tek egemenliği olması gerektiği konusunda anlaştı."
 LAT_events.501.t:0 "[From.GetNameDefCap] Ostland'ı Devrediyor"
 LAT_events.502.a:0 "Letonya için üzücü bir gün."
 LAT_events.502.d:0 "[Root.GetAdjective]'in Ostland işgali üzerinde egemenlik talebi [From.GetNameDef] tarafından kesin bir şekilde reddedildi. Ostland işgalinin kontrolünü ele geçirme girişimi, [Root.GetLeader]'in büyük Doğu nüfus merkezlerini kontrol etme ve [From.GetNameDef]'i baltalama girişimi olarak göz ardı edildi."
 LAT_events.502.t:0 "[From.GetNameDefCap] Reddediyor"
 LAT_events.6.a:0 "Ne iyi bir fikir!"
 LAT_events.6.b:0 "Ne saçmalık."
 LAT_events.6.d_both:0 "[From.GetNameDefCap] bugün tüm Baltık devletleri için [Root.GetFactionName]'e bir davetiye uzatılmasını talep etti. [LIT.GetNameDef] ve [EST.GetNameDef]'deki milliyetçiliğin ezici başarısını ve Baltık işbirliği için doğuştan gelen arzuyu gerekçe gösteren [From.GetLeader], [Root.GetAdjective] hükûmetinin [LIT.GetLeader] ve [EST.GetLeader]'i milliyetçi davaya müttefik olarak görmesi için tutkulu bir teklifte bulundu."
 LAT_events.6.d_estonia:0 "[From.GetNameDefCap] bugün [EST.GetNonIdeologyName] için [Root.GetFactionName]'e bir davetiye uzatılmasını talep etti. [EST.GetNameDef]'deki milliyetçiliğin ezici başarısını ve Baltık işbirliği için doğuştan gelen arzuyu gerekçe gösteren [From.GetLeader], [Root.GetAdjective] hükûmetinin [EST.GetLeader]'i milliyetçi davaya müttefik olarak görmesi için tutkulu bir teklifte bulundu."
 LAT_events.6.d_lithuania:0 "[From.GetNameDefCap] bugün [LIT.GetNonIdeologyName] için [Root.GetFactionName]'e bir davetiye uzatılmasını talep etti. [LIT.GetNameDef]'deki milliyetçiliğin ezici başarısını ve Baltık işbirliği için doğuştan gelen arzuyu gerekçe gösteren [From.GetLeader], [Root.GetAdjective] hükûmetinin [LIT.GetLeader]'i milliyetçi davaya müttefik olarak görmesi için tutkulu bir teklifte bulundu."
 LAT_events.6.t_both:0 "[From.GetNameDefCap], Baltık'ın [Root.GetFactionName]'e Girişini Talep Ediyor"
 LAT_events.6.t_estonia:0 "[From.GetNameDefCap], [EST.GetAdjective]'in [Root.GetFactionName]'e Girişini Talep Ediyor"
 LAT_events.6.t_lithuania:0 "[From.GetNameDefCap], [LIT.GetAdjective]'in [Root.GetFactionName]'e Girişini Talep Ediyor"
 LAT_events.601.a:0 "Ne yapalım artık."
 LAT_events.601.d:0 "[Root.GetNameDef], [From.GetFactionName]'e kucak açarak kabul edilmiş olsa da, görünüşe göre [From.GetLeader] [From.GetLeader.GetHerHis] kalbinde Baltık kardeşlerimizin kendilerini savunma hakkına dair hiçbir merhamet beslemiyor. Baltık dostlarımıza yaptığımız davetimiz reddedildi ve görünüşe göre uluslarımız şimdilik ayrı kalacak."
 LAT_events.601.t:0 "[From.GetNameDefCap], Baltık'ın [From.GetFactionName]'e Girişini Reddediyor"
 LAT_events.7.a:0 "Bu ayaktakımını dağıtın!"
 LAT_events.7.b:0 "Belki de [Root.GetLeader] istifa etmelidir."
 LAT_events.7.d:0 "[From.GetNameDef]'in faşist hükûmetinden ağır destek alan [Root.GetFascistParty] destekçileri, şiddet niyetiyle [Root.Capital.GetName] sokaklarında toplandı. İsyancılar sonunda [Root.GetLeader] ve [Root.GetRulingParty] Partisi'nin birkaç kilit üyesinin düzenlediği bir oturum sırasında [Root.Capital.GetName]'ın parlamento binasına ulaştı ve [Root.GetLeader]'in istifası için sloganlar attı."
 LAT_events.7.t:0 "[Root.GetFascistParty], [Root.Capital.GetName] Üzerine Yürüyor!"
 LAT_events.8.a:0 "Bu hainleri ezeceğiz!"
 LAT_events.8.b:0 "Daha güçlü bir Letonya için!"
 LAT_events.8.d:0 "Hükûmetin faşist Yıldırım Haçı grubuna yönelik yasağı kaldırma kararı, Gustavs Celmiņš ve destekçilerini cesaretlendirdi ve Letonya genelinde daha da aktif ve şiddetli hale getirdi. Bugün, bu şiddet, Pērkonkrusts'un kendilerini silahlandırıp Rīga'ya yürümesiyle ve Letonya hükûmetinin derhal teslim olmasını talep etmesiyle doruk noktasına ulaştı.\n\nHükûmetin Pērkonkrusts ile işbirliği yapma niyetinde olduğu açık olsa da, grubun rejimlerinde [Root.GetLeader]'i dahil etme niyetinde olmadığı anlaşılıyor."
 LAT_events.8.t:0 "Letonya Alevler İçinde"
 LIT_events.1.a:0 "Harika bir öneri!"
 LIT_events.1.b:0 "[LIT.GetLeader] ile herhangi bir anlaşma imzalamayacağız."
 LIT_events.1.d:0 "[LIT.GetLeader]'in [LIT.GetAdjective] devletini eski başkenti Vilnius ile yeniden birleştirmek istediği çok açık. [POL.GetNameDef]'e kendi başlarına çok az tehdit oluşturan [LIT.GetAdjective]ler, ulusu [Root.GetNameDef] ile paylaşmak istiyor; [POL.GetAdjective] Ukrayna ve Belarus'un [Root.GetNameDefCap] ile birleşmesi ve Vilnius'un [LIT.GetNameDef]'e geri dönmesiyle.\n\n[POL.GetNameDefCap] elbette ortak ültimatomu reddedebilir ve böyle bir ret, [POL.GetNameDef] ile [Root.GetNameDef] arasında bir savaş durumuyla sonuçlanacaktır."
 LIT_events.1.t:0 "[POL.GetNameDef]'in [SOV.GetAdjective]-[LIT.GetAdjective] Paylaşımı"
 LIT_events.10.t:0 "Falanjist İç Savaşı"
 LIT_events.101.a:0 "Teslim oluyoruz!"
 LIT_events.101.b:0 "Savaşmadan olmaz!"
 LIT_events.101.d:0 "1920'den beri Wilno, [Root.GetNameDef]'in kontrolü altında, şehri uluslarının haklı başkenti olarak gören [LIT.GetNameDef]'in sürekli öfkesine rağmen. Ancak gerilimler doruk noktasına ulaştı ve [SOV.GetLeader]'in yardımıyla Litvanyalılar şimdi Doğu Polonya'nın [SOV.GetAdjective]ler ve Litvanya arasında paylaşılmasını talep ediyor. Kabul edersek, Doğu Polonya'nın tamamını teslim edeceğiz, ancak reddedersek; kendimizi bir [SOV.GetAdjective]-[LIT.GetAdjective] koalisyonunun ana hedefi olarak bulacağız."
 LIT_events.101.t:0 "[SOV.GetAdjective]-[LIT.GetAdjective] Ültimatomu"
 LIT_events.102.a:0 "Vilnius avucumuzun içinde!"
 LIT_events.102.d:0 "[SOV.GetNameDefCap], [POL.GetNameDef]'i paylaşma konusunda bize katılmayı kabul etti ve şimdi geriye sadece taleplerimizi [POL.GetAdjective]lere iletmek kaldı."
 LIT_events.102.t:0 "[From.GetNameDefCap] Kabul Ediyor!"
 LIT_events.103.a:0 "Kahretsin onları!"
 LIT_events.103.d:0 "[SOV.GetNameDefCap], [POL.GetNameDef]'i paylaşma konusunda bize katılmayı reddetti ve [POL.GetNameDef] ile savaş durumuna girmekte hala özgür olsak da, bakanlarımız böyle bir savaşın yenilgiyle sonuçlanacağından emin."
 LIT_events.103.t:0 "[From.GetNameDefCap] Reddediyor!"
 LIT_events.104.a:0 "Öyleyse savaş!"
 LIT_events.104.b:0 "Bu, değeceğinden daha fazla çaba gerektiriyor."
 LIT_events.104.d:0 "Kendilerine karşı ezici üstünlüğe rağmen, [POL.GetNameDef] taleplerimize boyun eğmeyi reddetti!"
 LIT_events.104.t:0 "[POL.GetNameDefCap] Reddediyor!"
 LIT_events.2.a:0 "[From.GetLeader.GetSheHeCap] haklı."
 LIT_events.2.b:0 "Sanmıyorum."
 LIT_events.2.d:0 "Birkaç yıldır silahlı bir çatışma olmamasına rağmen, [Root.GetNonIdeologyName] ve [From.GetNonIdeologyName] teknik olarak hiçbir zaman resmi bir barış anlaşması imzalamadı. [From.GetLeader] bugün, [From.GetNameDef] ve [Root.GetNameDef]'in düşmanlıklarına son vermelerini ve ortak sınırlarında artan tehdide karşı müttefik olarak ilerlemelerini talep etti. [From.GetLeader] hala Wilno'nun [From.GetNonIdeologyName]'ın haklı başkenti olduğunu iddia etse de, [From.GetLeader.GetSheHe] her iki ulusun da çıkarları için resmi olarak silahlarını bırakıp bir barış durumu ilan etmenin en iyisi olduğunu ifade etti."
 LIT_events.2.t:0 "[From.GetNameDefCap] Barış İstiyor"
 LIT_events.201.a:0 "Mükemmel!"
 LIT_events.201.d:0 "[From.GetLeader], [Root.GetAdjective] bakanlarının benimsediği duyguya katılıyor gibi görünüyor ve şimdilik [Root.GetNameDef] ile dostane bir barış durumuna girmeye karar verdi. Bu barışla birlikte karşılıklı bir bağımsızlık garantisi de geliyor. Savaş zamanlarında, [From.GetNameDef]'deki dostlarımızın yardımımıza koşacağına güvenebiliriz!"
 LIT_events.202.a:0 "Peki, belki de hayır cevabını kabul etmeyeceğiz."
 LIT_events.202.d:0 "[From.GetNameDefCap], [Root.GetNameDef] ile herhangi bir resmi barış antlaşması imzalamayı reddetti. Bu soğuk savaş, göründüğü kadarıyla süresiz olarak devam edecek."
 LIT_events.3.a:0 "Mantıklı görünüyor."
 LIT_events.3.b:0 "Ne kadar saçma."
 LIT_events.3.d:0 "[Root.GetNonIdeologyName] ve [From.GetNonIdeologyName] arasındaki son on yılın çekişme noktası, [Root.GetAdjective]'in [From.GetNonIdeologyName]'ın geleneksel başkenti Vilnius'u işgali olmuştur. Şimdi iki ulus dostane ilişkiler içinde olduğuna göre, [From.GetLeader], [Root.GetNameDef]'in Vilnius'un kontrolünü teslim etmesi ve [From.GetAdjective] topraklarına yönelik tüm iddialarından vazgeçmesi koşuluyla sürekli bir barış durumu teklif ediyor. Reddetmek bir hayal kırıklığı olurdu, ancak [From.GetNonIdeologyName]'in [Root.GetNameDef] ile savaş peşinde koşmasına neden olmazdı, diyor [From.GetLeader]."
 LIT_events.3.t:0 "[From.GetNameDefCap] Kalıcı Barış Talep Ediyor"
 LIT_events.301.a:0 "Zamanımızda barış!"
 LIT_events.301.d:0 "Sonunda, [Root.GetNonIdeologyName] ve [From.GetNonIdeologyName] arasında barışçıl anlaşmalara varıldı ve [Root.GetNameDef]'in kuruluşundan bu yana genellikle göreceli bir sessizlik içinde süren çatışma sona ermiş gibi görünüyor. Birçok [From.GetAdjective] kalbinde hala bir Birlik hırsları olsa da, bunun yeni bir tür Birlik olduğundan eminiz; müttefikler arasında karşılıklı saygıya dayalı bir birlik."
 LIT_events.302.a:0 "Hayal kırıklığı."
 LIT_events.302.d:0 "[From.GetLeader], [Root.GetNameDef]'in tarihi [Root.GetAdjective] başkentine yönelik iddiasını tanımayı reddetti. Bu, iki ulus arasındaki barışçıl ilişkileri sona erdirmeyecek olsa da, [Root.GetNameDef]'in eski düşmanına karşı güvensizlik duygusunu yeniden alevlendirdiği şüphesizdir."
 LIT_events.4.a:0 "Altın bir fırsat gibi görünüyor!"
 LIT_events.4.b:0 "Sanmıyorum."
 LIT_events.4.d:0 "Bir işgalden korkan [From.GetNameDef] bakanları, [Root.GetAdjective] birliklerinin [From.GetNonIdeologyName]'ın sınırları içinde üslenmesine izin vermeyi teklif etti. Karşılığında, [From.GetAdjective] hükûmeti [Root.GetNameDef]'in egemenliklerini tehdit edecek herkesten onları korumasını bekliyor, ancak sınırları içinde zaten birlikler varken, [From.GetNameDef] herhangi bir [Root.GetAdjective] talebine karşı koymakta oldukça güçsüz kalacaktır…"
 LIT_events.4.t:0 "[From.GetNameDefCap] Üs Hakları Teklif Ediyor!"
 LIT_events.401.d:0 "[From.GetNameDefCap], [Root.GetNonIdeologyName]'ın adına herhangi bir çatışmaya sürüklenmek istemediklerini belirterek cömert teklifimizi reddetti."
 LIT_events.5.a:0 "İşe yaramaz bir şehir. Alın."
 LIT_events.5.b:0 "Asla teslim olmayacağız."
 LIT_events.5.desc:0 "1919'daki Vilna taarruzundan bu yana, Litvanya'nın geleneksel başkenti [Root.GetNameDef]'in elindedir ve bu, takip eden on yıllarda iki ulusumuz arasında bir çekişme noktası olmuştur.\n\nŞehir üzerinde bir soğuk savaş yürütüldü ve bugün [From.GetLeader], eğer şehir [From.GetNameDef]'e devredilmezse savaşın kaçınılmaz olacağını tehdit etti.\n\nŞehrin bizim için sınırlı bir kullanımı var, ancak eski Birlik'in son nefeslerini temsil ediyor ve gerçekten de barış için Polonya-Litvanya hayalinden vazgeçmeye hazır mıyız?"
 LIT_events.5.t:0 "[From.GetNameDefCap], [784.GetName]'ı Talep Ediyor"
 LIT_events.501.desc:0 "[From.GetNameDefCap], Vilnius'un barışçıl bir şekilde geri verilmesini kabul etti ve bu, uluslarımız arasında var olan on yıllık soğuk savaşa resmi bir son verdi. Vilnius'un geri dönmesiyle, Litvanya nihayet tekrar bir bütün oldu."
 LIT_events.501.t:0 "Vilnius Geri Döndü!"
 LIT_events.502.a:0 "Savaş mı? Ben ona agresif müzakereler derim."
 LIT_events.502.desc:0 "Şaşırtıcı olmayan bir şekilde, [From.GetNameDef], [Root.GetLeader]'in Vilnius'u [Root.GetNameDef]'e geri devretme taleplerini reddetti. Diplomasi başarısız olsa da, [Root.GetLeader] henüz savaş olasılığını dışlamadı ve sınırda artan gerilimlerle savaş kaçınılmaz görünüyor."
 LIT_events.6.a:0 "Ne kadar ilham verici!"
 LIT_events.6.b:0 "Sanmıyorum."
 LIT_events.6.d:0 "Bugün [From.Capital.GetName]'dan, [Root.GetNonIdeologyName] ve [From.GetNonIdeologyName]'in hem [GER.GetNameDef] hem de [SOV.GetNameDef]'e rakip olabilecek yeni bir ittifaka birleşmelerini öneren bir telgraf geldi. Bu iki güç arasında sıkışmış milliyetçi devletler olarak, her iki ulus da Avrupa'nın büyük güçlerinden diplomatik olarak izole edilmiş durumda ve batının demokratik güçleri iki faşist ulusun savunmasında bir çatışmaya katılmakta isteksiz olacaktır.\n\n[From.GetLeader], devletlerinin kuruluşundan bu yana [Root.GetAdjective]-[From.GetAdjective] ilişkilerini karakterize eden yılların çatışmasına bir alternatif öneriyor. [From.GetLeader.GetSheHeCap], uluslarımızın Lehistan-Litvanya Üstünlük Ligi'ne birleşmesini öneriyor; Birlik ilkelerine dayanan, ancak milliyetçiliğin erdemlerine değer veren bir ittifak."
 LIT_events.6.t:0 "[From.GetNameDefCap], Lehistan-Litvanya Üstünlük Ligi'ni Teklif Ediyor"
 LIT_events.601.a:0 "Her şey yoluna giriyor."
 LIT_events.601.d:0 "Şaşırtıcı olmayan bir şekilde, Lehler Lehistan-Litvanya Üstünlük Ligi'ne katılmayı kabul etti. Bu, Litvanya'nın Polonya'nın kaderi için nihai vizyonu olmasa da, bu, Baltık'ın geleceğini güvence altına almada hayati bir ilk adımdır."
 LIT_events.601.t:0 "[From.GetNameDef] Lige Katılıyor"
 LIT_events.602.a:0 "Belki de ikna edilmeleri gerekecek."
 LIT_events.602.d:0 "[Root.GetAdjective] bakanlarının şaşkınlığına, [From.GetNameDef] Lehistan-Litvanya Üstünlük Ligi'ne katılmayı reddetti. Görünüşe göre iki ulus arasındaki gerilimlerin dağılmaya hiç niyeti yok ve bu işbirliği reddi yakın gelecekte şiddetli çatışmaya bir geri dönüşle sonuçlanabilir."
 LIT_events.602.t:0 "[From.GetNameDefCap] Ligi Reddediyor"
 LIT_events.7.a:0 "Harika bir öneri!"
 LIT_events.7.b:0 "Polonya için başka planlarımız var."
 LIT_events.7.d:0 "[From.GetAdjective]-[POL.GetAdjective] işbirliği arayışlarında aktif olan [From.GetAdjective] dışişleri bakanı, bugün [Root.GetAdjective] yetkililerine başvurarak [POL.GetNameDef]'in [Root.GetFactionName]'e davet edilmesini talep etti."
 LIT_events.7.t:0 "[From.GetNameDefCap], [POL.GetAdjective]'in [Root.GetFactionName]'e Girişini Talep Ediyor"
 LIT_events.701.a:0 "Ne yapalım artık."
 LIT_events.701.d:0 "Ne yazık ki, [From.GetFactionName] liderleri [POL.GetAdjective]'in [From.GetFactionName]'e girişini ittifakın en iyi çıkarlarına aktif olarak engelleyici olarak görüyor gibi görünüyor. Açıkça, [From.GetNameDef]'in [POL.GetNameDef] için başka planları var."
 LIT_events.701.t:0 "[From.GetNameDefCap], [POL.GetAdjective]'in [From.GetFactionName]'e Girişini Engelliyor"
 LIT_events.8.a:0 "Bu, yapmaya razı olduğum bir fedakarlık."
 LIT_events.8.b:0 "Asla olmaz."
 LIT_events.8.d:0 "[Root.GetAdjective] yetkilileri uzun zamandır eski Birlik'i yeniden yaratmaya çalıştılar, ancak her zaman Litvanyalılar tarafından reddedildiler. Ancak, [From.GetLeader] bugün Polonya ve Litvanya'nın yeniden birleşmesini önerme gibi tarihi bir karar aldı. Şaşırtıcı bir şekilde, bu teklif Lehler ve Litvanyalıları eşit temellere oturtmuyor, aslında teklif [From.GetLeader]'i her iki ulusun da mutlak diktatörü yapacak."
 LIT_events.8.t:0 "[From.GetNameDefCap] Birleşme Çağrısı Yapıyor"
 LIT_events.801.a:0 "Mükemmel."
 LIT_events.801.d:0 "[From.GetLeader], Polonya diktatörlüğünden çekilerek ve yetkileri [Root.GetLeader]'e devrederek [Root.GetAdjective]'in yeniden birleşme talebine yanıt verdi. Yeniden birleşmiş bir Birlik, bu, şimdi [From.GetNameDef] ve [Root.GetNameDef]'in paylaştığı gelecekte tarihi bir evrimi işaret ediyor."
 LIT_events.801.t:0 "[From.GetNameDefCap] Kabul Ediyor!"
 LIT_events.802.a:0 "Belki de Lehler ikna edilmek zorunda kalacak."
 LIT_events.802.d:0 "Görünüşe göre Lehler henüz [Root.GetNameDef] ile yeniden birleşmeye hazır değiller. [Root.GetNameDefCap]'in birliği eski Birlik'in bir restorasyonu olarak çerçeveleme çabalarına rağmen, [From.GetAdjective] bakanları tamamen etkilenmemiş görünüyor."
 LIT_events.802.t:0 "[From.GetNameDefCap] Reddediyor"
 LIT_events.9.a:0 "Neden olmasın."
 LIT_events.9.b:0 "Aynı fikirde değiliz."
 LIT_events.9.d:0 "Polonya ve Litvanya arasındaki uzun işbirliği geçmişine atıfta bulunan [From.GetLeader], eğer [Root.GetFactionName]'in Polonya işgali [From.GetNameDef]'in tek yönetimi altına alınırsa olaysız olacağını öne sürdü. Bunu yapmak, Polonya'nın sağladığı değerli kaynakları feda etmek anlamına gelecektir, ancak Polonya direnişinin bir Litvanya sorunu haline geleceği anlamına gelecektir."
 LIT_events.9.t:0 "[From.GetNameDefCap] Polonya İşgali Talep Ediyor"
 LIT_events.901.a:0 "Litvanya'ya şan olsun!"
 LIT_events.901.d:0 "[Root.GetAdjective]'in Polonya işgali üzerinde egemenlik talebi [From.GetNameDef] tarafından başarıyla karşılandı. [From.GetAdjective] generalleri ve askerleri, savaş çabası boyunca yeniden dağıtılmak üzere [From.GetNonIdeologyName]'e geri dönerken, [Root.GetAdjective] askerleri eskiden Polonya tarafından tutulan bölgeleri garnizon etmek için onların yerini alıyor."
 LIT_events.901.t:0 "[From.GetNameDefCap] Polonya İşgalini Devrediyor"
 LIT_events.902.a:0 "Denemeye değerdi."
 LIT_events.902.d:0 "[Root.GetAdjective]'in Polonya işgali üzerinde egemenlik talebi [From.GetNameDef] tarafından kesin bir şekilde reddedildi. Polonya işgalinin kontrolünü ele geçirme girişimi, [Root.GetLeader]'in büyük Polonya sanayi bölgelerini kontrol etme ve [From.GetAdjective]'in Polonya topraklarına yönelik iddialarını baltalama girişimi olarak göz ardı edildi."
 LIT_events.902.t:0 "[From.GetNameDefCap] Reddediyor"
 LIT_monarchy_events.1.a:0 "Bir ittifak tercih edilir görünüyor."
 LIT_monarchy_events.1.b:0 "Sadece bir tane olabilir!"
 LIT_monarchy_events.1.desc:0 "Hem Polonya hem de Litvanya tahtlarında krallar otururken, Birlik'in barışçıl bir şekilde birleşme hırsları pek olası görünmüyor. Ancak, iki ulus şimdi ideolojik olarak hizalanmışken, belki de başka bir yol vardır. İstersek, [POL_or_LIT_target.GetLeader]'e iki ulusumuzun bir ittifakını, Birlik'in bir tür diplomatik yeniden tasavvuru olarak sunabiliriz. Birlikte, dost olarak ilerleyebiliriz, ancak ayrı olarak biri düşman olarak düşmelidir."
 LIT_monarchy_events.1.t:0 "İki Kral İkilemi"
 LIT_monarchy_events.101.a:0 "Ne kadar da medeniyetsizce."
 LIT_monarchy_events.101.desc:0 "Barışçıl bir çözüme ulaşma çabalarımıza rağmen, [From.GetLeader] ulusumuzla dostane ilişkilere girmeyi reddetti ve “[From.GetNonIdeologyName]'ın tek bir Kralı vardır” dedi. Görünüşe göre [From.GetNameDef] ile savaş artık kaçınılmaz."
 LIT_monarchy_events.101.t:0 "[From.GetLeader] Barışı Reddediyor"
 LIT_monarchy_events.2.a:0 "Çok yaşa Kral!"
 LIT_monarchy_events.2.desc:0 "4 Haziran 1918'de, Wilhelm Karl von Urach, ezici bir destekle Litvanya Kralı olarak demokratik bir şekilde seçildi, ancak Alman İmparatorluğu'nun müdahalesi referandumun geçersiz ilan edilmesi ve Litvanya'nın Kralı ile hiçbir zaman birleşememesi anlamına geliyordu. Ancak, merhum Kral'ın bir oğlu vardı ve Litvanya üzerindeki Alman egemenliği artık uzak bir anı haline gelirken, [Root.GetLeader] Karl Gero von Urach'ı Litvanya'nın yeni kralı olması için davet etti!\n\nGenç kraliyet, Mindaugas III olarak taç giydi ve şu anda törensel bir rolle sınırlı olsa da, yeni Litvanya monarşisini güçlendirmek için planlar yapılıyor."
 LIT_monarchy_events.2.t:0 "Kral Mindaugas III"
 LIT_monarchy_events.2_tt:0 "§YMindaugas III§!, [Root.GetNonIdeologyName]'ın Kralı olur. §Y[Root.GetLeader]§! ise [Root.GetRulingParty]'nin lideri olarak kalır"
 NSB_Soviet_fascist_civil_war.001.a:0 "Silah başına!"
 NSB_Soviet_fascist_civil_war.001.desc:0 "Siyasi manevra zamanı bitti. Komünistlere karşı silahlı mücadele yeniden başladı. Bize bu savaşta rehberlik edecek bir komite kuruldu. Bu sefer sonuna kadar birleşik savaşacağız. Bu sefer yenilgi olmayacak. Bu sefer imparatorluğu geri alacağız!"
 NSB_Soviet_fascist_civil_war.001.t:0 "[GetSovietCivilWarName]!"
 NSB_Soviet_fascist_civil_war.002.a:0 "Mükemmel"
 NSB_Soviet_fascist_civil_war.002.desc:0 "Ruki tümenleri, Komünist zalimlere karşı ayaklanmaya ve savaşmaya hazır."
 NSB_Soviet_fascist_civil_war.002.t:0 "Acemilerimiz Hazır"
 NSB_Soviet_fascist_civil_war.003.a:0 "Gitmesi gerekiyor sanırım"
 NSB_Soviet_fascist_civil_war.003.desc:0 "Rus İç Savaşı bir kez daha patlak verdi. Kızıllardan kaçtığından beri burada ikamet eden $SOV_grigory_semyonov$, [SOV.GetNameDef]'deki komünistlere karşı mücadeleye katılmak için bir kez daha [ROOT.GetName]'den ayrılmaya karar verdi."
 NSB_Soviet_fascist_civil_war.003.t:0 "$SOV_grigory_semyonov$, [ROOT.GetName]'den Ayrılıyor"
 NSB_poland_communist_events.1.a:0 "[POL.GetNameDefCap] tek başına duruyor."
 NSB_poland_communist_events.1.b:0 "Polonya SSCB'ye aittir."
 NSB_poland_communist_events.1.desc:0 "Polonya Komünist Partisi, Polonya'nın SSCB ile aynı çizgide olmasını isteyenler ile SSCB'nin kendisinden önceki monarşist rejim kadar emperyalist olduğuna inananlar arasında uzun süredir devam eden bir çatışmaya ev sahipliği yapıyor.\nSovyet karşıtlarını temsil eden kişi ise, Sovyet yanlısı yoldaşlarını “kemiksiz” ve devrim düşmanı olmakla suçlayan, iddia edilen [Root.GetStalinistOrTrotskyite] Maria Koszutska'dır.\nDe-facto lider olarak hareket eden Władysław Gomułka, partinin Sovyet yanlısı kanadını temsil ediyor. Parti içinde zaten popüler olmasına rağmen Gomułka, Rus yanlısı diplomatik duruşu nedeniyle Polonya halkı arasında giderek daha az popüler hale geliyor.\nŞu anda Polonya'nın kontrolünü elinde bulundurmasına rağmen, parti bu adaylardan hangisinin liderliklerini temsil etmesi gerektiği konusunda bölünmüş durumda. Kararsızlıkları sonrasında Moskova'nın Koszutska'ya sadece liderlikten men edilmesi değil, aynı zamanda [Root.GetStalinistOrTrotskyite] ve anti-devrimci olarak yargılanması yönündeki baskısı artıyor."
 NSB_poland_communist_events.1.nosov.desc:0 "Polonya Komünist Partisi, Polonya'nın SSCB ile aynı çizgide olmasını isteyenler ile SSCB'nin kendisinden önceki monarşist rejim kadar emperyalist olduğuna inananlar arasında uzun süredir devam eden bir çatışmaya ev sahipliği yapmıştır.\nAncak, SSCB'nin çöküşünden bu yana, bu soru oldukça tartışmalı bir konu haline gelmiştir. Stalin'in iktidardan düşmesinin ardından, Sovyet yanlısı lider Władysław Gomułka'nın önemi de azaldı ve parti lideri olarak Sovyet karşıtı Maria Koszutska'nın atanmasına tanıklık edecek kimse kalmadı."
 NSB_poland_communist_events.1.t:0 "KPP'deki Çatışmalar"
 NSB_poland_communist_events.2.a:0 "Elimizdeki en iyi şans bu."
 NSB_poland_communist_events.2.b:0 "Hayır!"
 NSB_poland_communist_events.2.desc:0 "[From.GetNameDefCap], [Root.GetNonIdeologyName] üzerindeki hakimiyet karşılığında bize tam askeri koruma teklif etti. Rusya ve Almanya'nın [Root.GetNonIdeologyName]'a yönelik acil ve ömür boyu varoluşsal tehdidini gerekçe gösteren [From.GetNameDef]'den politikacılar bize bir himaye konumu sunuyor. Kabul etmek [Root.GetNonIdeologyName]'i bir kukla yapacaktır, ancak [From.GetNonIdeologyName]'in hayır cevabını kabul etmeyeceği anlaşılıyor."
 NSB_poland_communist_events.2.t:0 "[From.GetNameDefCap] Koruma Teklif Ediyor"
 NSB_poland_communist_events.201.a:0 "Mükemmel."
 NSB_poland_communist_events.201.desc:0 "[From.GetNameDefCap], [Root.GetNameDef]'in bir bağlı devleti haline geldi. [From.GetAdjective] hükûmeti şimdi doğrudan [Root.Capital.GetName]'a cevap verdiğine göre, Baltık hegemonyası hedeflerimiz kaçınılmaz hale geliyor."
 NSB_poland_communist_events.201.t:0 "[From.GetNameDefCap] Kabul Ediyor!"
 NSB_poland_communist_events.202.a:0 "Her zaman orduya güvenebiliriz."
 NSB_poland_communist_events.202.desc:0 "[From.GetNameDefCap] koruma teklifimizi reddetti ve bağımsızlığını sürdürmekte ısrar ediyor. [Root.GetAdjective] yüksek komutanlığı, dışişleri bakanlığının başarısız olduğu yerde bir başarı elde etmek için hazırlıklara başladı ve [Root.GetLeader]'in sadece komut vermesi gerekiyor ve [From.GetNameDef]'e tam bir saldırı başlayacak."
 NSB_poland_communist_events.202.t:0 "[From.GetNameDefCap] Reddediyor"
 NSB_poland_communist_events.3.a:0 "[Root.GetNonIdeologyName] ve [From.GetNonIdeologyName] İşçileri Birleşin!"
 NSB_poland_communist_events.3.b:0 "Bu kabul edilemez."
 NSB_poland_communist_events.3.desc:0 "[From.GetNameDefCap], [Root.GetNameDef]'in derhal ilhak edilmesini talep etti. İlhak, [From.GetLeader]'in “Sosyalist Cumhuriyetler Birliği” kurma hırsının bir parçasıdır. Kabul etmek, bağımsızlığımızın derhal terk edilmesi anlamına gelecek ve [Root.GetNonIdeologyName]'i [From.GetAdjective] devletinin doğrudan bir parçası haline getirecektir."
 NSB_poland_communist_events.3.t:0 "[From.GetNameDefCap], [Root.GetAdjective] Entegrasyonunu Arıyor"
 NSB_poland_communist_events.301.a:0 "Ne kadar yazık."
 NSB_poland_communist_events.301.desc:0 "[From.GetNameDefCap], Sosyalist Cumhuriyetler Birliği'ne ilhak edilmeyi reddetti. Bu, bölgedeki [Root.GetAdjective] hırslarının sonu anlamına gelmese de, [From.GetNameDef] ile barışçıl ilişkilerin imkansız hale geldiği anlamına geliyor."
 NSB_poland_communist_events.301.t:0 "[From.GetNameDefCap] Reddediyor"
 NSB_poland_communist_events.302.a:0 "Mükemmel."
 NSB_poland_communist_events.302.desc:0 "[Root.GetLeader]'in [From.GetNameDef]'in Sosyalist Cumhuriyetler Birliği'ne girme hırsı, [From.GetAdjective] hükûmetinin doğrudan [Root.GetAdjective] liderliğine boyun eğmeyi kabul etmesiyle meyvesini verdi."
 NSB_poland_communist_events.302.t:0 "[From.GetNameDefCap] İlhakı Kabul Ediyor"
 NSB_poland_communist_events.4.a:0 "Kabul ediyoruz."
 NSB_poland_communist_events.4.b:0 "Hazır değiller."
 NSB_poland_communist_events.4.desc:0 "[From.GetNameDefCap], himaye statüsü ve SSCB ile yakın entegrasyon karşılığında Doğu Polonya'yı bize devretmeyi teklif etti. Kabul edersek, [From.GetNameDef] [Root.GetNameDef]'in bir kukla devleti olacak ve şu anda Polonya tarafından işgal edilen Belarus ve Ukrayna devletleri SSCB'ye devredilecektir.\n\nBu bariz bir seçim gibi görünse de, Polonya'daki Alman hırsı [Root.GetNameDef] ve [GER.GetNameDef] arasında savaşın kaçınılmaz olabileceği anlamına gelebilir."
 NSB_poland_communist_events.4.t:0 "[From.GetNameDefCap] Doğu'yu Teklif Ediyor"
 NSB_poland_communist_events.401.a:0 "Gerekli bir fedakarlık."
 NSB_poland_communist_events.401.desc:0 "[From.GetNameDefCap], bizi bir himaye olarak almayı kabul etti ve SSCB'ye bir bağlı devlet olarak entegre edildik. Ülke genelinde birçok kişi kararımızdan dolayı ihanete uğramış hissetse de, [Root.GetLeader] Polonya halkına [From.GetLeader]'in Polonya'nın bir dostu olduğunu ve şimdi doğrudan SSCB'ye entegre olan etnik Lehler'in yeni [From.GetAdjective] efendilerinden tamamen memnun olacağını garanti etti."
 NSB_poland_communist_events.401.t:0 "[From.GetNameDefCap] Kabul Ediyor!"
 NSB_poland_communist_events.402.a:0 "Pekala."
 NSB_poland_communist_events.402.desc:0 "[From.GetLeader], [Root.GetNameDef]'i SSCB'ye kabul etmeyi reddetti ve [Root.GetLeader]'in “hazır olmadığını” belirtti. Resmi neden bu olsa da, birçok kişi Polonya'daki Alman hırsının bu reddin gerçek nedeni olduğundan şüpheleniyor."
 NSB_poland_communist_events.402.t:0 "[From.GetNameDefCap] Reddediyor"
 NSB_poland_communist_events.5.a:0 "Bağımsızlık sadece bir seçenek değil."
 NSB_poland_communist_events.5.b:0 "Daha büyük endişelerimiz var."
 NSB_poland_communist_events.5.desc:0 "[From.GetNameDefCap] artık bir [Root.GetAdjective] kuklası değil ve küçük devlet kendini bağımsız bir sosyalist cumhuriyet ilan etti. Şimdilik durum barışçıl ve [From.GetNameDef] [Root.GetFactionName]'in bir üyesi olarak kalıyor."
 NSB_poland_communist_events.5.t:0 "[From.GetNameDefCap] Bağımsızlığını İlan Ediyor!"
 NSB_poland_communist_events.501.a:0 "O zaman savaş!"
 NSB_poland_communist_events.501.desc:0 "Tahmin edilebileceği gibi, [From.GetLeader] [Root.GetAdjective] bağımsızlık ilanına iyi tepki vermedi ve bunu bir savaş eylemi ilan etti."
 NSB_poland_communist_events.501.t:0 "[From.GetNameDefCap] Savaş İlan Ediyor"
 NSB_poland_communist_events.502.a:0 "[From.GetFactionName]'de kalacağız"
 NSB_poland_communist_events.502.b:0 "Tam bağımsızlığımızı ilan ediyoruz."
 NSB_poland_communist_events.502.desc:0 "[From.GetNameDefCap] bağımsızlık ilanımızı kabul etti ve şimdilik uluslarımız arasında barış var gibi görünüyor. Şimdi tamamen bağımsız olsak da, [From.GetNameDef] ile ilişkili kalabilir veya ittifaktan ayrılıp alternatif seçenekleri keşfedebiliriz."
 NSB_poland_communist_events.502.t:0 "[From.GetNameDef], [Root.GetAdjective] Bağımsızlığını Kabul Ediyor"
 NSB_poland_communist_events.6.a:0 "Bunun pek bir önemi yok."
 NSB_poland_communist_events.6.b:0 "Bunlar bizim topraklarımız."
 NSB_poland_communist_events.6.desc:0 "Doğu Polonya, [From.GetNameDef]'i [Root.GetFactionName]'e getiren anlaşmanın bir parçası olmasına rağmen, küçük devlet, devletlerinin uluslararası davaya olan sadakatini gerekçe göstererek geri istedi. Batı Belarus ve Ukrayna halkının on yıllardır Polonya devletinin bir parçası olduğunu ve Polonya'da sosyalizmin yükselişine yol açan köylü grevinde hayati önem taşıdığını iddia ediyorlar."
 NSB_poland_communist_events.6.t:0 "[From.GetNameDefCap] Doğu Polonya'yı İstiyor"
 NSB_poland_communist_events.601.a:0 "Ulusumuz yeniden bir bütün."
 NSB_poland_communist_events.601.desc:0 "Doğu Polonya, [Root.GetNameDef]'in çekirdek bir parçası olarak geri döndü. Şimdiden, topraklar [Root.GetAdjective] yönetimiyle yeniden bütünleştiriliyor ve eski rejimi devirmede çok önemli olan bölge, halkının uğruna savaştığı devletle yeniden birleşti."
 NSB_poland_communist_events.601.t:0 "[From.GetNameDefCap] Doğu Polonya'yı Geri Veriyor!"
 NSB_poland_communist_events.602.a:0 "Pekala."
 NSB_poland_communist_events.602.b:0 "O zaman bağımsızlık!"
 NSB_poland_communist_events.602.desc:0 "[From.GetNameDefCap], Doğu Polonya'yı [Root.GetNameDef]'e geri devretmeyi reddetti. Tahmin edilebilir bir sonuç olsa da, birçok Polonyalı yine de hayal kırıklığına uğradı ve [From.GetNameDef]'den ayrılma duygusu artıyor."
 NSB_poland_communist_events.602.t:0 "[From.GetNameDefCap] Reddediyor"
 NSB_poland_democratic_events.1.a:0 "Witos'un deneyimi var, o bizim liderimiz."
 NSB_poland_democratic_events.1.b:0 "Mikołajczyk halkın şampiyonudur, o bizim liderimiz."
 NSB_poland_democratic_events.1.desc:0 "Sanationistler hükûmetten temizlendiğine göre, geriye yeni Polonya Köylü Partisi'nin liderinin kim olacağı sorusu kalıyor. Köylülüğün en ateşli ve sesli destekçisi olan Stanisław Mikołajczyk, şu anda bu rolü işgal ediyor, ancak iç savaştaki zaferin Front Morges'un desteği olmadan imkansız olacağı göz ardı edilemez.\n\nPolonya'da serbest seçimlerin yeniden kurulmasını destekleyen generalleri temsil eden Front Morges, uzun süredir eski Polonya Başbakanı olan Wincenty Witos'u destekliyor.\n\nWitos'u parti lideri olarak atamak Front Morges'u yatıştıracak olsa da, Mikołajczyk'i görevden almak, demokratik davamız için ön saflarda savaşan birçok köylünün partiden dışlanmış ve ihanete uğramış hissetmesine neden olabilir."
 NSB_poland_democratic_events.1.t:0 "Liderlik Sorunu"
 NSB_poland_events.1.a:0 "Başka seçeneğimiz yok."
 NSB_poland_events.1.b:0 "Polonya'nın önünde eğilmeyeceğiz!"
 NSB_poland_events.1.desc:0 "[Root.GetNameDef]'in bariz savunma yetenekleri eksikliğini gerekçe gösteren [From.GetNameDef] yetkilileri, tüm Slovakya bölgesinin doğrudan Polonya işgali altına girmesini talep etti. Kesin bir dille, eğer boyun eğmezsek işgalin kaçınılmaz olduğunu talep ediyorlar. Nasıl cevap vermeliyiz?"
 NSB_poland_events.1.t:0 "[From.GetNameDefCap] Slovakya'yı Talep Ediyor"
 NSB_poland_events.101.a:0 "İşe yaradığına inanamıyorum!"
 NSB_poland_events.101.desc:0 "[From.GetNameDefCap], tüm Slovak bölgesini devretme yönündeki son talebimizi kabul etti. [Root.GetAdjective] birlikleri, ortaya çıkmadan önce herhangi bir yerel direnişi bastırmak için bölgeyi şimdiden dolduruyor. Bu zafer küçük olsa da, dünyanın en azından [Root.GetAdjective] savaş makinesinden bir nebze korktuğunu gösteriyor!"
 NSB_poland_events.101.t:0 "[From.GetNameDefCap] Kabul Ediyor!"
 NSB_poland_events.102.a:0 "Peki, o zaman savaş!"
 NSB_poland_events.102.desc:0 "Şok edici bir şekilde, [From.GetAdjective] hükûmeti Slovak bölgesini devretme talebimizi reddetti. Diplomatik bir çözüm bulma girişimlerimiz başarısız oldu ve bu artık askeri bir mesele haline geldi."
 NSB_poland_events.102.t:0 "[From.GetNameDefCap] Reddediyor!"
 NSB_poland_events.2.a:0 "Sanırım kabul etmeliyiz."
 NSB_poland_events.2.b:0 "Bu “hak iddiası” anlamsız."
 NSB_poland_events.2.d:0 "Görünüşe göre [Root.GetNameDef]'deki uzun süredir devam eden naiplik, [From.GetLeader]'ı [From.GetLeader.GetHerselfHimself]'i Macaristan Kralı ilan etmesi için cesaretlendirmiş. Bu hak iddiası, ortaçağ Polonya-Macaristan krallığından pek de fazlasına dayanmıyor ve bu, apaçık bir toprak genişletme girişimidir."
 NSB_poland_events.2.t:0 "[From.GetLeader], [Root.GetAdjective] Tahtını Talep Ediyor!"
 NSB_poland_events.201.a:0 "Mükemmel."
 NSB_poland_events.201.desc:0 "Bugün, [Root.GetLeader]'in Macaristan Kralı olarak adlandırılmasıyla Macar tahtına talip olan herkesin reddedildiği anlaşılıyor. [Root.GetLeader] şimdi hem Polonya hem de Macaristan Kralı olduğuna göre, [Root.GetAdjective]'in Balkan hegemonyası hırsları daha da gerçekleşiyor."
 NSB_poland_events.201.t:0 "Macaristan Devrediyor"
 NSB_poland_events.202.a:0 "Bize başka seçenek bırakmıyorlar."
 NSB_poland_events.202.desc:0 "[From.GetAdjective] hükûmetinin liderleri, [Root.GetLeader]'in [From.GetAdjective] tahtına yönelik iddiasını tanımayacaklarını açıkladılar. Bu, [From.GetNameDef]'in barışçıl bir şekilde ilhak edilme olasılığını sona erdirse de, iddianın hala savaş yoluyla zorlanabileceği anlamına geliyor."
 NSB_poland_events.202.t:0 "[From.GetNameDefCap], [Root.GetLeader]'in Hak İddiasını Reddediyor"
 NSB_poland_events.3.a:0 "Kabul ediyoruz!"
 NSB_poland_events.3.b:0 "[From.GetNonIdeologyName] hala düşmanımız."
 NSB_poland_events.3.c:0 "Danzig'i devredin, o zaman anlaşma tamam!"
 NSB_poland_events.3.desc:0 "[From.GetNameDef] yetkilileri, yeni Alman İmparatorluğu ile bir ittifak imzalamaya ilgi duyduklarını açıkladılar. Kaiser [Root.GetLeader]'in [From.GetAdjective] bağımsızlığına [Root.GetHerHis] selefinden daha dostane yaklaştığına inanarak ve [From.GetNameDef]'in modern yapısının Merkezi Güçler tarafından imzalanan 5 Kasım Yasası'na doğrudan atfedilebileceğini gerekçe göstererek, [From.GetNameDef] iki devletin resmi bir ittifak imzalamasını teklif ediyor.\nKabul etmek, [Root.GetNonIdeologyName]-[From.GetNonIdeologyName] ilişkileri tarihinde anıtsal bir anomali olarak kayda geçecek ve iki ulus için potansiyel parlak bir geleceğe işaret edecektir."
 NSB_poland_events.3.t:0 "[From.GetNameDefCap] Bir İttifak Teklif Ediyor"
 NSB_poland_events.301.a:0 "Polonya için harika bir gün!"
 NSB_poland_events.301.desc:0 "Şaşırtıcı bir şekilde, [From.GetNameDef] [Root.GetNameDef] ile resmi bir ittifak imzalamayı kabul etti! Bir zamanlar ebedi düşman olmalarına rağmen, [Root.GetNonIdeologyName] ve [From.GetNonIdeologyName] arasındaki çatışma günlerinin nihayet sona erdiği ve iki ulusun artık aşırılıkçı ideolojinin yükselen dalgasına karşı müttefik olarak ilerleyebileceği anlaşılıyor.\nAlmanların [Root.GetAdjective] topraklarını bağımsız bir krallık olarak serbest bırakmayı kabul ettiği 5 Kasım Yasası ile başlayan şey, şimdi bundan böyle “Kasım İttifakı” olarak bilinecek tarihi bir ittifaka dönüştü."
 NSB_poland_events.301.t:0 "Kaiser Kabul Ediyor!"
 NSB_poland_events.302.a:0 "Ne kadar da hayal kırıklığı."
 NSB_poland_events.302.desc:0 "En iyi diplomatik çabalarımıza ve ulusumuzun görünüşte hizalanmış çıkarlarına rağmen, Kaiser herhangi bir resmi ittifak imzalamayı reddetti. Görünüşe göre Almanya ister bir kraliyetin ister bir faşistin elinde olsun, ulusumuzu hala doğal düşmanı olarak görüyor."
 NSB_poland_events.302.t:0 "Savaşçı bir Kaiser"
 NSB_poland_events.303.a:0 "O baş belası şehri bir orduyla takas etmek faydalı görünüyor."
 NSB_poland_events.303.desc:0 "[From.GetNameDefCap], her iki taraf için de karşılıklı fayda sağlayacağını iddia ettikleri şartlı bir teklifle bize geri döndü. 5 Kasım Yasası'nın, Gdansk ve Gdynia'nın tartışmalı bölgelerini yeni kurulan [Root.GetAdjective] krallığına devretmeyi hiçbir zaman resmi olarak kabul etmediğini iddia ediyorlar. Almanya'nın kabul ettiği şartların ihlali olduğunu iddia ettikleri şey düzeltilirse ancak bir ittifak imzalayacaklarını iddia ediyorlar."
 NSB_poland_events.303.t:0 "Garantiler Karşılığında Danzig"
 NSB_poland_events.304.a:0 "Onu zorla alacağız."
 NSB_poland_events.304.desc:0 "Maalesef Lehlerle bir anlaşmaya varılamayacak gibi görünüyor ve Danzig'i bir ittifak karşılığında devretme teklifimizi reddettiler. [From.GetAdjective] sınırında gerilimler zaten artıyor ve bazıları ufukta savaş olmasından korkuyor."
 NSB_poland_events.304.t:0 "[From.GetNameDefCap] Reddediyor"
 NSB_poland_events.4.a:0 "Onların olacak!"
 NSB_poland_events.4.b:0 "[POL_colony_purchase.GetName], [Root.GetAdjective] İmparatorluğu'nun ayrılmaz bir parçasıdır!"
 NSB_poland_events.4.desc:0 "Polonya Denizcilik ve Sömürge Ligi bugün [From.Capital.GetName]'daki [Root.GetAdjective] büyükelçisine [POL_colony_purchase.GetName] denizaşırı toprağını satın alma teklifiyle başvurdu. [POL_colony_purchase.GetName]'ı Lehlerle takas etmek [Root.GetNameDef] için kesinlikle büyük bir bütçe fazlası sağlayacaktır, ancak [From.GetNameDef]'i [POL_colony_purchase.GetName]'ın tamamı ve değerli ham kaynakları ile sivil nüfusu üzerinde egemen kılacaktır."
 NSB_poland_events.4.t:0 "Polonya, [POL_colony_purchase.GetName]'ı Satın Almak İstiyor"
 NSB_poland_events.401.a:0 "Hoş geldiniz, [POL_colony_purchase.GetName] halkı"
 NSB_poland_events.401.desc:0 "[From.GetNameDefCap] bugün bize geri döndü ve [POL_colony_purchase.GetName] denizaşırı toprağını satmayı kabul etti. Geriye sadece [From.GetNameDef]'e olan borçlarımızı ödemek kalıyor ve koloni büyüyen [Root.GetAdjective] sömürge imparatorluğunun ayrılmaz bir parçası olacak."
 NSB_poland_events.401.desc.com:0 "[From.GetNameDefCap] bugün bize geri döndü ve [POL_colony_purchase.GetName] denizaşırı toprağını satmayı kabul etti. Geriye sadece [From.GetNameDef]'e olan borçlarımızı ödemek kalıyor, ama şimdiden [POL_colony_purchase.GetName] halkı [From.GetAdjective] sömürgeciliğinin pençesinden kurtarıldı."
 NSB_poland_events.401.desc.dem:0 "[From.GetNameDefCap] bugün bize geri döndü ve [POL_colony_purchase.GetName] denizaşırı toprağını satmayı kabul etti. Şimdi [From.GetNameDef]'e borçlu olsak da, bu satış [Root.GetNameDef] için daha vahim bir ihtiyaç zamanında gelemezdi. [POL_colony_purchase.GetName] şimdi doğrudan kontrolümüz altında olduğuna göre, hükûmetimizin sürgünde var olmaya devam edebileceği başka bir kale daha verilmiş oldu."
 NSB_poland_events.401.t:0 "[POL_colony_purchase.GetName]'ın Başarılı Satışı"
 NSB_poland_events.402.a:0 "Denemeye değerdi."
 NSB_poland_events.402.desc:0 "Maalesef, [From.GetAdjective] hükûmeti şu anda [POL_colony_purchase.GetName]'ı devretmekle hiç ilgilenmiyor. Bu, [Root.GetAdjective]'in denizaşırı hırslarını sona erdirmese de, bu başarısızlık [POL_colony_purchase.GetName]'ın barışçıl bir şekilde devredilme olasılığını tamamen imkansız kılıyor."
 NSB_poland_events.402.t:0 "[From.GetNameDefCap], [POL_colony_purchase.GetName]'ı Satmayı Reddediyor"
 NSB_poland_events.6.a:0 "Kurnazca bir öneri."
 NSB_poland_events.6.b:0 "Hayır."
 NSB_poland_events.6.desc:0 "1932 sonbaharında Polonya, Milletler Cemiyeti tarafından Liberya'nın tek koruyucusu olarak tanındı, ancak bu karar Amerika Birleşik Devletleri'nin müdahalesi nedeniyle hiçbir zaman uygulamaya konulmadı. Buna rağmen, ulusumuz Polonya Denizcilik ve Sömürge Ligi tarafından işletilen yerleşim yerleri ve işletmelerle doluydu.\nBu düzenleme her iki ulus için de karlı oldu, ama şimdi görünüşe göre [From.GetNameDef] daha iddialı hale geliyor ve [From.GetLeader], [Root.GetNameDef]'in bir [From.GetAdjective] himayesi olmasını resmen talep etti.\nKabul edersek, bunun getirebileceği tüm fayda ve zararlarla birlikte bir [From.GetAdjective] bağlı devleti olacağız, ancak reddedersek, görünüşe göre [From.GetLeader] [From.GetLeader.GetHerHis] hırsını zorla kabul ettirebilir."
 NSB_poland_events.6.t:0 "[From.GetNameDefCap] Himaye Statüsü Teklif Ediyor"
 NSB_poland_events.601.a:0 "O zaman zorla alacağız."
 NSB_poland_events.601.b:0 "Bu işi daha fazla tırmandırmayalım."
 NSB_poland_events.601.desc:0 "1932'de himaye statüsünü kabul etmemize rağmen, [From.GetAdjective] hükûmetinin artık ulustaki [Root.GetAdjective] çıkarlarını sürdürmekle ilgilenmediği anlaşılıyor."
 NSB_poland_events.601.t:0 "[From.GetNameDefCap] Reddediyor"
 NSB_poland_events.7.a:0 "Harika bir öneri!"
 NSB_poland_events.7.b:0 "Bu bir ölüm tuzağı gibi görünüyor."
 NSB_poland_events.7.desc:0 "Polonya'da demokrasinin yeniden kurulmasıyla birlikte, yeni Polonya hükûmeti Fransız-Leh ilişkilerini güçlendirmeyi ve Alman sınırının her iki tarafında bir ittifak kurmayı hedefliyor. Polonya son iç çatışmasından hala zayıf düşmüş olsa da, [GER.GetNameDef]'in sınırının her iki tarafında savaşılan bir savaşta zorlanacağı şüphesizdir."
 NSB_poland_events.7.t:0 "Polonya, Morges Paktı'nı Teklif Ediyor"
 NSB_poland_events.701.a:0 "Belki İngilizler bizi kabul eder."
 NSB_poland_events.701.desc:0 "[From.GetNameDef] hükûmeti bu zamanda bizimle resmi bir ittifak imzalamayı reddetti. Bu acı diplomatik yenilgi, Front Morges'un Fransız-Leh ittifakı planını sadece bir fantezi olarak bırakıyor ve biz bunun yerine destek için başkalarına bakmalıyız."
 NSB_poland_events.8.a:0 "Kanıtları gömün, dünya asla bilmeyecek"
 NSB_poland_events.8.b:0 "Polonya tacını başka biri taşımalı!"
 NSB_poland_events.8.d:0 "Moskova'nın [From.GetNameDefCap] ve müttefikleri tarafından ele geçirilmesinin ardından, ajanlarımız NKVD arşivlerinden Romanov ailesinin korkunç kaderini ortaya çıkaran notlar buldu. Rapor, Anastasia da dahil olmak üzere tüm İmparatorluk Ailesi'nin Temmuz 1918'de Bolşevikler tarafından idam edildiği sonucuna varıyor. Hızlı hareket etmezsek, dünya yakında kraliçemizin iddia ettiği kişi olmadığını öğrenecek."
 NSB_poland_events.8.t:0 "Anastasia Romanov'un Kaderi"
 NSB_poland_monarchist_events.1.a:0 "Direnmeliyiz."
 NSB_poland_monarchist_events.1.desc:0 "[From.GetLeader] şimdi [From.GetNonIdeologyName]'in Kralı olarak taç giydiğine göre, [From.GetAdjective] hükûmeti bunu [Root.GetNonIdeologyName] üzerinde bir hak iddiası için kullanıyor gibi görünüyor! Bir propaganda ve duruş savaşı yoluyla, [From.GetNameDef], [Root.GetLeader]'in rejimine muhalefeti silahlandırmaya ve bir iç darbeyi desteklemeye çalışacak.\nBu propaganda etkili olursa, [Root.GetLeader] bir darbeyle karşı karşıya kalabilir ve [Root.GetNonIdeologyName], bir [From.GetAdjective] kuklasından biraz daha fazlasına indirgenecektir."
 NSB_poland_monarchist_events.1.t:0 "[From.GetNameDefCap] Tahtımızı Talep Ediyor"
 NSB_poland_monarchist_events.2.a:0 "Ne yapalım artık."
 NSB_poland_monarchist_events.2.desc:0 "Maalesef, [From.GetNonIdeologyName] üzerindeki iddiamıza artık itiraz edemeyiz. Mevcut [From.GetAdjective] hükûmeti, [Root.GetLeader]'in iddiasından bahsedildiğinde kahkaha ve alayla karşılanacak noktaya kadar propaganda savaşını kesin olarak kazanmıştır."
 NSB_poland_monarchist_events.2.t:0 "[Root.GetNameDefCap]'in Hak İddiası Reddedildi"
 NSB_poland_monarchist_events.3.a:0 "Lanet olsun!"
 NSB_poland_monarchist_events.3.desc:0 "[From.GetLeader] bugün [Root.GetNonIdeologyName]'in yeni Kralı olarak taç giydi. Uzun bir dizi propaganda kampanyası, birçok [Root.GetAdjective] bakanını eski rejime karşı çevirdi ve kansız bir darbeye neden oldu. Bu darbe, [Root.GetNonIdeologyName]'i [From.GetNameDef]'in bir kuklasından biraz daha fazlası haline getirdi ve gelecekteki [Root.GetAdjective] özerkliği için gelecek kasvetli görünüyor."
 NSB_poland_monarchist_events.3.t:0 "[From.GetLeader]'in Darbesi!"
 NSB_poland_monarchist_events.4.a:0 "Hainler!"
 NSB_poland_monarchist_events.4.desc:0 "[Root.GetNonIdeologyName] sokakları bugün, monarşi yanlısı ve karşıtı milislerin ulusu iç savaşa sürüklemesiyle alevlendi! [Root.GetLeader] ve [From.GetLeader] destekçileri ülke genelinde çatışmalara giriyor ve [From.GetNameDef] bakanları ulusal egemenliğimize yönelik bu suçlamadaki rollerini tanımayı reddediyor. Geriye sadece bu çatışmanın hangi tarafının galip çıkacağını bekleyip görmekten başka bir şey kalmadı."
 NSB_poland_monarchist_events.4.t:0 "Monarşist İç Savaş"
 NSB_poland_monarchist_events.5.a:0 "Teslim oluyoruz!"
 NSB_poland_monarchist_events.5.b:0 "Bir [From.GetAdjective] kuklası olmaktansa savaş daha iyidir."
 NSB_poland_monarchist_events.5.desc:0 "[From.GetLeader] ve [From.GetLeader.GetHerHis] hükûmeti tarafından başlatılan uzun bir kraliyet propagandası kampanyasının ardından, [Root.GetLeader] sadıkları ile [Root.GetNonIdeologyName]-[From.GetNonIdeologyName] birleşmesini görmek isteyenler arasındaki gerilim, barışçıl bir arada yaşamanın artık bir seçenek olmadığı bir noktaya ulaştı. Monarşist destekçiler, kesin bir dille, [Root.GetLeader]'in tahttan çekilmesini ve [From.GetLeader]'i [Root.GetNonIdeologyName]'in tek gerçek Kralı olarak tanımasını talep etti.\n\nKabul etmek [Root.GetNonIdeologyName]'i bir [From.GetAdjective] bağlı devletinden biraz daha fazlası yapacaktır, ancak reddetmek neredeyse kesinlikle bir iç savaşla sonuçlanacaktır."
 NSB_poland_monarchist_events.5.t:0 "[From.GetLeader] Destekçileri Tahttan Çekilme Talep Ediyor"
 NSB_poland_monarchist_events.6.a:0 "Teslim olmalıyız."
 NSB_poland_monarchist_events.6.b:0 "Saçmalık! Reddediyoruz!"
 NSB_poland_monarchist_events.6.desc:0 "[Root.GetNameDef]'in bariz savunma yetenekleri eksikliğini gerekçe gösteren [From.GetNameDef] yetkilileri, [Root.GetNameDef]'in tamamının doğrudan Polonya işgali altına girmesini talep etti. Açıkça kralları “Anastasia”nın anlamsız zırvalarından cesaret alan Polonya devleti, Slav birleşmesi için doyumsuz bir hırs kazanmış görünüyor. Kesin bir dille, eğer boyun eğmezsek işgalin kaçınılmaz olduğunu belirttiler. Nasıl cevap vermeliyiz?"
 NSB_poland_monarchist_events.6.t:0 "[From.GetNameDefCap] İlhakımızı Talep Ediyor"
 NSB_poland_monarchist_events.601.a:0 "Bu gerçekten işe yaradı mı?"
 NSB_poland_monarchist_events.601.desc:0 "[From.GetNameDefCap], [Root.GetNameDef]'e katılma yönündeki son talebimizi kabul etti. [Root.GetAdjective] birlikleri, ortaya çıkmadan önce herhangi bir yerel direnişi bastırmak için bölgeyi şimdiden dolduruyor. Bu büyük zafer sayesinde, Slav birleşmesi hırsımıza daha da yaklaşıyoruz."
 NSB_poland_monarchist_events.601.t:0 "[From.GetNameDefCap] Kabul Ediyor!"
 NSB_poland_monarchist_events.602.a:0 "O zaman savaş."
 NSB_poland_monarchist_events.602.desc:0 "Şok edici bir şekilde, [From.GetAdjective] hükûmeti Balkan bölgesinin kontrolünü [Root.GetNameDef]'e devretme talebimizi reddetti. Diplomatik bir çözüm bulma girişimlerimiz başarısız oldu ve bu artık askeri bir mesele haline geldi."
 NSB_poland_monarchist_events.602.t:0 "[From.GetNameDefCap] Reddediyor!"
 NSB_poland_royal_election.1.a:0 "O bizim Kralımız!"
 NSB_poland_royal_election.1.b:0 "Hayır, aklımızda başka biri var..."
 NSB_poland_royal_election.1.desc:0 "Meissen Uçbeyi ve Saksonya Prensi, Albert Leopold Friedrich Christian Sylvester Anno Macarius, Polonya Kralı unvanını birçok prestijli unvanına eklemek istiyor. Lehistan-Litvanya Birliği'nin birçok büyük hükümdarı Wettin Hanedanı'nın ve Sakson elektörlerinin üyesiydi ve ulusumuz şimdi bir Kral ararken, Friedrich Christian Kral için en bariz ve meşru aday gibi görünüyor.\nYanında Birlik üzerinde bir hak iddiası varken, Friedrich'i seçmek şüphesiz hükûmetimizin tüm eski Birlik toprakları üzerindeki iddiasını güçlendirecektir. Litvanya üzerinde bir hak sahibi, tarihi bir Polonya kraliyet ailesinin bir üyesi ve arkasında prestijli bir soy hattı olan Friedrich Christian, beraberinde Polonya Krallığı üzerinde güçlü bir hak iddiası getiriyor."
 NSB_poland_royal_election.1.t:0 "Friedrich Christian Tahtı Talep Ediyor"
 NSB_poland_royal_election.2.a:0 "Tahtlarımızı birleştirmek mi? Harika bir fikir!"
 NSB_poland_royal_election.2.b:0 "Romanya ile ilişkilerimizi riske atamayız."
 NSB_poland_royal_election.2.desc:0 "Hohenzollern'lerin Polonya üzerindeki iddiası, mevcut Polonya devletinin varlığı kadar eskiye dayanır. Şimdi, Polonya-Romanya ilişkileri her iki devletin hayatta kalması için giderek daha hayati hale gelirken, tahtımızı eski Romanya Kralı ve varisi I. Mihai'ye sunmak mantıklı geliyor.\n1930'da kendi babası lehine tahttan indirilen Kral Mihai, Polonya ve Romanya tahtlarının potansiyel bir birliği için bir fırsat sunuyor. Romanya'da faşist Demir Muhafızlar'ın etkisi artarken, anti-faşist duyguları Kral Carol'u bir kez daha tahttan indirmek ve yerine Kral olarak Mihai'yi getirmek için bir araç olarak kullanabiliriz. Böyle bir başarı, uluslarımız arasında ayrılmaz bir birlik yaratacak ve birleşik irademiz [SOV.GetNameDef] ve [GER.GetNameDef]'deki düşmanlarımızın başa çıkması gereken güçlü bir kuvvet olacaktır."
 NSB_poland_royal_election.2.t:0 "Romanya Veliaht Prensi Mihai"
 NSB_poland_royal_election.3.a:0 "Çılgınca bir fikir, ama bunlar çılgın zamanlar. Kralımız var!"
 NSB_poland_royal_election.3.b:0 "Pavel de neyin nesi?"
 NSB_poland_royal_election.3.desc:0 "Bugün naiplik konseyine alışılmadık bir aday kendini sundu. Gürcistan Prensi, kazak ve eski Beyaz Rus generali Pavel Bermondt-Avalov, sadece Polonya Krallığı'nı değil, aynı zamanda Lehistan-Litvanya Birliği'ni de talep ederek konseye başvurdu.\nUzun yıllar önce, kazak bilinmeyen nedenlerle Baltıkları işgal etmeye çalışmıştı ve görünüşe göre prensin hırsları o zamandan beri daha da artmış.\nÇoğu sıradan Polonyalı arasında popüler olmasa da, taç için bu beklenmedik aday arkasında bir Beyaz sürgün ordusu getirecek, [SOV.GetNameDef]'i düşmanlaştıracak, ancak sayılarımızı artıracak ve potansiyel olarak bizi Avrupa'nın faşist güçleriyle hizalayacaktır."
 NSB_poland_royal_election.3.t:0 "Kazak Kral"
 NSB_poland_royal_election.4.a:0 "Kralımız son Romanov olacak. Muhtemelen."
 NSB_poland_royal_election.4.b:0 "Belki de Friedrich Christian'ı çok çabuk gözden çıkardık..."
 NSB_poland_royal_election.4.desc:0 "“Varşova kalesi, boyalı kartallar, evet hatırlıyorum. Polonya'nın tek gerçek Kralı benim.” Anastasia Romanov adının ünlü talibi, bugün Varşova Kalesi'ne yayıncısıyla birlikte gelerek Romanov ailesinin hala Polonya tahtı üzerinde hak iddia ettiğini ve son Romanov olarak mantıken Kral olduğunu iddia etti. Anastasia'nın iddiası sadece bir Romanov'un Polonya üzerindeki iddiasının gücüne değil, aynı zamanda soyunun meşruiyetine de dayanıyor.\nBirçok eski Rus soylusu onun gerçekten Anastasia olduğunu iddia etse de, birçok kişi onu aşırı medya ilgisi olan eksantrik biri olarak görüyor.\nİddiası şüpheli olsa da, adaylar listesinin sonuncusu ve onu şimdi geri çevirmek Polonya'yı başladığı yere geri bırakacaktır; toz toplayan boş bir taht."
 NSB_poland_royal_election.4.t:0 "Anastasia Romanov Polonya'ya Geliyor"
 NSB_poland_royal_election.5.a:0 "Habsburg Polonyası doğdu!"
 NSB_poland_royal_election.5.b:0 "Başkasını arzu ediyoruz..."
 NSB_poland_royal_election.5.desc:0 "Bir kraliyet, bir Habsburg ve bir Polonya vatanseveri olan Karl Albrecht von Habsburg, neredeyse böyle bir örgütün var olduğu sürece Polonya ordusunun hizmetinde olmuştur. Soyu bu topraklara özgü olmasa da, Polonya için savaşma ve ölme isteği onu taht için ideal bir aday yapıyor.\n\nArşidük'ün yöneticilik için pek bir hırsı yok gibi görünse de, belki de Polonya'ya silahla değil, liderlikle hizmet etmeye ikna edilebilir."
 NSB_poland_royal_election.5.t:0 "Habsburg Adayı"
 NSB_polish_fascist_events.1.a:0 "Kendilerini teslim ederken neden işgal edelim ki?"
 NSB_polish_fascist_events.1.b:0 "Polonya için başka tasarılarımız var."
 NSB_polish_fascist_events.1.desc:0 "[From.GetAdjective] hükûmeti, küresel hegemonya hedeflerimizi desteklemek için bir pakt önerdi. Açıkça, [From.GetLeader], [Root.GetLeader]'in Polonya ile Almanya arasında çizilen sınır bölümlerinden memnun olmadığını biliyor ve bu nedenle Polonya dışişleri bakanı Józef Beck bu anlaşmaya bir değişiklik önermek üzere gönderildi.\n\nPolonya, karşılıklı saldırmazlık paktları ve herhangi bir [SOV.GetAdjective] işgal girişimine karşı Alman koruması ve rehberliği karşılığında Poznan, Danzig ve Yukarı Silezya'nın batı topraklarını devretmeyi kabul ediyor. Pakt, Polonya'yı esasen bir Alman kuklasından biraz daha fazlası haline getirecek ve sınırımızdaki tartışmalı toprakları devredecektir. Kabul etmeli miyiz?"
 NSB_polish_fascist_events.1.t:0 "Beck-Ribbentrop Paktı"
 NSB_polish_fascist_events.101.a:0 "Güvende, ama ne pahasına?"
 NSB_polish_fascist_events.101.desc:0 "[From.GetNameDefCap] şartlarımızı kabul etti ve [Root.GetNameDef] artık resmi olarak [From.GetAdjective] koruması altında. [From.GetAdjective] askerleri şimdiden [Root.GetAdjective] kırsalını askerlerle dolduruyor ve bakanlarımız doğrudan Berlin'e cevap veriyor."
 NSB_polish_fascist_events.101.t:0 "[From.GetNameDefCap] Paktı İmzalıyor"
 NSB_polish_fascist_events.102.a:0 "Rota değişikliği zamanı."
 NSB_polish_fascist_events.102.desc:0 "Teklifimiz ulusumuzun anahtarlarını doğrudan [From.GetLeader]'e teslim etmesine rağmen, [From.GetAdjective] hükûmetinin başka planları olduğu ve teklifimizi kesin olarak reddettiği anlaşılıyor."
 NSB_polish_fascist_events.102.t:0 "[From.GetNameDefCap] Paktı Reddediyor"
 NSB_polish_fascist_events.2.a:0 "Ültimatomu verin."
 NSB_polish_fascist_events.2.b:0 "Pekala."
 NSB_polish_fascist_events.2.c:0 "Hayır."
 NSB_polish_fascist_events.2.desc:0 "Bir [Root.GetAdjective] uşağı olarak mevcut konumlarına rağmen, [From.GetNameDef] hala Birlik hegemonyası için hırslara sahip gibi görünüyor. Memel'deki iddiamızı kabul eden [From.GetLeader], ulusu bölmemizi öneriyor; Memel bölgesi [Root.GetAdjective] kontrolüne girerken, ülkenin geri kalanı [From.GetAdjective] oluyor."
 NSB_polish_fascist_events.2.t:0 "[From.GetNameDefCap] Litvanya'yı Bölmek İstiyor"
 NSB_polish_fascist_events.201.a:0 "Başka seçeneğimiz yok."
 NSB_polish_fascist_events.201.b:0 "Reddediyoruz!"
 NSB_polish_fascist_events.201.desc:0 "[POL.GetNameDef] ve [GER.GetNameDef] arasında beklenmedik bir ittifaktan ortak bir ilhak talebi geldi. Memel bölgesinin Almanya'ya devredilmesini ve ulusumuzun geri kalanının Polonya tarafından tamamen ilhak edilmesini talep ediyorlar."
 NSB_polish_fascist_events.201.t:0 "Almanya ve Polonya Litvanya'nın İlhakını Talep Ediyor"
 NSB_polish_fascist_events.202.a:0 "Ne kadar talihsiz."
 NSB_polish_fascist_events.202.desc:0 "Görünüşe göre Almanların Litvanya için başka planları var, çünkü ilhak teklifimiz oybirliğiyle reddedildi."
 NSB_polish_fascist_events.202.t:0 "[From.GetNameDefCap] Reddediyor"
 NSB_polish_fascist_events.203.a:0 "Mükemmel."
 NSB_polish_fascist_events.203.desc:0 "[From.GetNameDefCap] taleplerimizi kabul etti ve eski Litvanya toprakları şimdiden Polonya ile Almanya arasında bölünüyor. Tek bir kurşun atmadan, Litvanya artık bizim."
 NSB_polish_fascist_events.203.t:0 "[From.GetNameDefCap] Kabul Ediyor"
 NSB_polish_fascist_events.204.a:0 "O zaman zorla alacağız."
 NSB_polish_fascist_events.204.desc:0 "Görünüşe göre Litvanya makul taleplerimizi reddetti. Diplomasi başarısız olsa da, bu artık askeri bir mesele haline geldi."
 NSB_polish_fascist_events.204.t:0 "[From.GetNameDefCap] Meydan Okuyor!"
 NSB_polish_fascist_events.3.a:0 "Bu makul görünüyor."
 NSB_polish_fascist_events.3.b:0 "Hayır. Polonya bizimdir."
 NSB_polish_fascist_events.3.desc:0 "Polonya fabrikalarını kullanmamızın savaş çabalarına engel olduğunu iddia eden [From.GetNameDef] bakanları, ulusları üzerindeki taleplerimizi gevşetmemizi talep ettiler. Anlaşma Polonya'nın bir [Root.GetAdjective] himayesi statüsünü koruyacak olsa da, siyasi ve ekonomik bağımsızlıklarını büyük ölçüde artıracaktır."
 NSB_polish_fascist_events.3.t:0 "[From.GetNameDefCap] Özerklik Talep Ediyor"
 NSB_polish_fascist_events.301.a:0 "Mükemmel"
 NSB_polish_fascist_events.301.desc:0 "[From.GetNameDefCap], devletimizin sahip olduğu özerkliği büyük ölçüde artırmayı kabul etti. Hala bir [From.GetAdjective] bağlı devleti olsak da, şimdi çok daha fazla endüstriyel ve diplomatik olarak bağımsızız."
 NSB_polish_fascist_events.301.t:0 "[From.GetNameDefCap] Özerklik Veriyor"
 NSB_polish_fascist_events.302.a:0 "Maalesef."
 NSB_polish_fascist_events.302.b:0 "Belki Yeraltı Devleti yardımcı olabilir..."
 NSB_polish_fascist_events.302.desc:0 "Özerklik talebimiz [From.GetNameDef] tarafından agresif bir şekilde reddedildi, [From.GetAdjective] danışmanları böyle bir şeyin önerilmesinden bile rahatsız oldu. Sürekli boyun eğmemizin savaş çabasının gerekli bir parçası olduğunu iddia ediyorlar ve görünüşe göre öngörülebilir gelecekte onların bağlı devleti olarak kalacağız."
 NSB_polish_fascist_events.302.t:0 "[From.GetNameDefCap] Dizginleri Sıkıyor"
 NSB_polish_fascist_events.4.a:0 "Baltıkları almalıyız."
 NSB_polish_fascist_events.4.b:0 "Belarus ve Ukrayna bizim yurdumuz olacak."
 NSB_polish_fascist_events.4.c:0 "Intermarium'u tamamlamalıyız."
 NSB_polish_fascist_events.4.desc.first:0 "Bolşevizmi ortadan kaldırma çabalarımızda çok şey feda ettik; Batı sınırımızı, bağımsızlığımızı ve sayısız askerin hayatını. Artık karşılığında bir şey isteme zamanı geldi. [SOV.GetNameDef] ile olan savaşımızın bir zafer olacağı kesin olduğuna göre, Doğu'da Polonya'nın genişlemesi için sayısız fırsat görüyoruz."
 NSB_polish_fascist_events.4.desc.rejected:0 "[From.GetNameDefCap] savaş sonrası sınırlar için teklifimizi reddetti, ancak savaş sonrası bir Polonya devleti için çok sayıda başka vizyon varken bunun pek bir önemi yok."
 NSB_polish_fascist_events.4.t:0 "Savaş Sonrası Polonya"
 NSB_polish_fascist_events.401.a:0 "Bu tatmin edici."
 NSB_polish_fascist_events.401.b:0 "Hayır."
 NSB_polish_fascist_events.401.desc.baltics:0 "Polonya, savaştan sonraki gelecek sınırları için bir teklifle bize başvurdu. Beck-Ribbentrop paktında [Root.GetNameDef]'e kaybettikleri toprakları gerekçe gösteren [From.GetAdjective] hükûmeti, savaştan sonra bazı toprak revizyonlarına hakları olduğuna inanıyor.\n\nEski Birlik uydu devleti Kurlandiya'yı gerekçe göstererek kuzeye, Baltık Devletleri'ne doğru ilerlemek istiyorlar."
 NSB_polish_fascist_events.401.desc.blacksea:0 "Polonya, savaştan sonraki gelecek sınırları için bir teklifle bize başvurdu. Beck-Ribbentrop paktında [Root.GetNameDef]'e kaybettikleri toprakları gerekçe gösteren [From.GetAdjective] hükûmeti, savaştan sonra bazı toprak revizyonlarına hakları olduğuna inanıyor.\n\nDenizden denize uzanan bir Polonya'nın uzun süredir devam eden hırsını gerekçe göstererek güneye, Kırım'a doğru ilerlemek istiyorlar."
 NSB_polish_fascist_events.401.desc.ukraine:0 "Polonya, savaştan sonraki gelecek sınırları için bir teklifle bize başvurdu. Beck-Ribbentrop paktında [Root.GetNameDef]'e kaybettikleri toprakları gerekçe gösteren [From.GetAdjective] hükûmeti, savaştan sonra bazı toprak revizyonlarına hakları olduğuna inanıyor.\n\nDoğu'daki eski Birlik topraklarını gerekçe göstererek doğuya, Belarus ve Ukrayna'ya doğru ilerlemek istiyorlar."
 NSB_polish_fascist_events.402.a:0 "Polonya'nın geleceği güvende."
 NSB_polish_fascist_events.402.desc:0 "Polonya'nın gelecek sınırları için teklifimiz [From.GetNameDef] tarafından kabul edildi ve iddia ettiğimiz bölgeler şimdiden sivil yönetimimizle bütünleşiyor. Batı'nın geri dönüşünü hiçbir zaman göremesek de, bu yeni topraklar birkaç yıl önce bizden alınan fiziki toprakları fazlasıyla telafi etti."
 NSB_polish_fascist_events.5.a:0 "Mükemmel bir girişim."
 NSB_polish_fascist_events.5.b:0 "Sanmıyorum."
 NSB_polish_fascist_events.5.desc:0 "Falanjizm ve Katolik kimliği ilkelerine dayanan bir ittifak olan [From.GetNameDef], bizi Falanjist Enternasyonal'e davet etti. Kabul etmek, iki ulusumuzun savaş zamanlarında birlikte savaşacağı anlamına gelecek ve aynı zamanda hükûmetimiz içindeki Falanjist unsurları cesaretlendirecek ve güçlendirecektir. Kabul etmeli miyiz?"
 NSB_polish_fascist_events.5.t:0 "[From.GetNameDefCap] Bizi Falanjist Enternasyonal'e Davet Ediyor"
 NSB_polish_fascist_events.6.a:0 "Her şey plana göre."
 NSB_polish_fascist_events.6.desc:0 "Falanjistlerin sürekli olarak güçlendirilmesi ve kışkırtılması, Varşova sokaklarında bir dizi milliyetçi isyana dönüştü. [Root.GetLeader]'in aşırı sağcılarla işbirliği yapma ve onları destekleme isteğinden açıkça cesaret alan isyancılar, Varşova sokaklarında yürüdüler ve Varşova Kalesi'nde bir çatışmayla sonuçlandı. Hükûmetin Sanacja fraksiyonuna sadık askeri yetkililer, başkenti basan ve [Root.GetLeader]'i binadan fiziksel olarak çıkaran kalabalığı durdurmakta yetersiz kaldılar.\n\nKale şimdiden tüm Sanacja liderliğinden boşaltıldı ve Bolesław Piasecki kendini yeni Polonya devletinin lideri ilan etti."
 NSB_polish_fascist_events.6.t:0 "Varşova Ayaklanmaları"
 NSB_polish_fascist_events.7.a:0 "Demokrasiyi seviyorum."
 NSB_polish_fascist_events.7.desc:0 "Sanacja'nın giderek Ulusal-Demokrat partinin politikalarını ve inançlarını benimsemesiyle, birçok kişi cumhuriyetin bir kez daha ulusal seçimleri açmasının sadece bir zaman meselesi olduğunu gördü. Üçüncü Polonya Ulusal Anayasası'nın imzalanmasıyla seçimler bir kez daha yeniden başladı, ancak vatansever olmadığı düşünülen partilerin yönetmesine izin verilmemesi şartıyla.\n\n“Vatansever olmayan” partiler, diğer birçok büyük sol ve merkezci partiyle birlikte PSL'yi de içeriyor ve bu da seçmenlere Ulusal-Demokratlar dışında çok az seçenek bırakıyor. Ulusal-Demokratlar seçimlerden galip çıktı, Sanacja gibi rakip partiler oyların sadece bir kısmını alarak ND'ye cumhuriyet üzerinde neredeyse tam kontrol sağladı."
 NSB_polish_fascist_events.7.t:0 "Polonya Ulusal Seçimi"
 NSB_soviet_academy_of_sciences.1.a:0 "İleriye doğru büyük bir adım!"
 NSB_soviet_academy_of_sciences.1.desc:0 "Bugün görkemli bir törenle, [THIS.GetLeader] ve [SOV.GetAdjective] büyükelçisi [THIS.GetAdjective] Bilimler Akademisi'ni resmen açtı. [SOV.GetAdjective] Bilimler Akademisi'nden modellenen bu yeni enstitü, [SOV.GetNameDef]'den uzmanlar tarafından yönlendirilen çok yüksek düzeyde ileri araştırmalar yapmamızı sağlayacaktır."
 NSB_soviet_academy_of_sciences.1.t:0 "[THIS.GetAdjective] Bilimler Akademisi'nin kuruluşu"
 NSB_soviet_atomic_bomb_project.1.a:0 "Barış için bir zafer daha."
 NSB_soviet_atomic_bomb_project.1.desc:0 "Yabancı bir nükleer araştırma programına sızmakla görevli ajanlarımızdan biri, santrifüj tasarımlarından savaş başlığı boyutlarının hesaplamalarına kadar bilim adamlarının üzerinde çalıştığı çeşitli farklı kalemlere ait çok sayıda çok gizli belge taşıyarak elçiliğimize geri döndü. Bu veriler şüphesiz kendi nükleer silah programımızı ilerletmede çok değerli olacaktır."
 NSB_soviet_atomic_bomb_project.1.t:0 "Ajan nükleer sırlarla geri dönüyor"
 NSB_soviet_atomic_bomb_project.2.a:0 "Saçmalık! Bu kişiyle hiçbir bağlantımız yok."
 NSB_soviet_atomic_bomb_project.2.desc:0 "Bir nükleer silah programına sızmakla görevli Ajanlarımızdan biri bugün güvenli bir tesisten ayrılmaya çalışırken yakalandı. Çantasında yapılan bir aramada bir dizi gizli belge bulundu. Maalesef, bizim için çalıştığını itiraf ettiği anlaşılıyor, çünkü büyükelçimiz acil istişareler için çağrıldı ve kanıtlarla karşı karşıya bırakıldı."
 NSB_soviet_atomic_bomb_project.2.t:0 "Ajan Nükleer Tesiste Yakalandı"
 NSB_soviet_atomic_bomb_project.3.a:0 "En azından hiçbir şey çalınmadı."
 NSB_soviet_atomic_bomb_project.3.desc:0 "Bugün erken saatlerde, nükleer araştırma tesislerimizden birinde bir çalışan rutin bir denetimde durduruldu. Eşyalarının kapsamlı bir şekilde aranması, çantasında gizli bir bölme buldu. O bölmenin içinde nükleer teknolojilerle ilgili bir dizi yüksek derecede gizli belge vardı. \n\nŞüpheli karşı-istihbarata teslim edildi ve tam bir itirafta bulundu. Görünüşe göre [SOV.GetAdjective] elçiliğiyle temas halindeydi ve planları ve diğer araştırma verilerini çalmak için nükleer araştırma programımıza sızmakla görevlendirilmişti."
 NSB_soviet_atomic_bomb_project.3.t:0 "Nükleer Araştırma Tesisinde Güvenlik İhlali"
 NSB_soviet_civil_war_common.001.a:0 "Yola devam etme zamanı"
 NSB_soviet_civil_war_common.001.desc_exiles:0 "Komünist rejim düştü. Muzaffer birliklerimiz başkenti kontrol ediyor. Halk nihayet kızıl zorbalıktan kurtuldu. Yeni bir Rusya, iki iç savaşın ve aradaki yılların kötü yönetiminin neden olduğu yıkımdan doğacak."
 NSB_soviet_civil_war_common.001.desc_left:0 "Stalin'e karşı savaş bitti. Diktatör devrildi. [ROOT.GetLeader] bizi zafere taşıdı.\nDevrimci ateşi yeniden alevlendirme ve dünya genelindeki işçi sınıfına özgürlük getirme zamanı geldi."
 NSB_soviet_civil_war_common.001.desc_right_concessions:0 "Ülke kazanıldı, [ROOT.GetLeader] bizi zafere taşıdı. Şimdi ülkeyi iyileştirme ve yeniden şekillendirme zamanı. Kazanmak için ne gerekiyorsa yapmaya hazır olduğumuzu gösterdik. Ancak zafer her zaman bir bedelle gelir ve kahraman askerlerimizin fedakarlığının yanı sıra, tarihimizin bu bölümünü kapatmadan önce ödememiz gereken borçlarımız da var."
 NSB_soviet_civil_war_common.001.desc_right_no_concessions:0 "Muzaffer ordularımız Kremlin'in önünden geçit töreni yapıyor. Zafer bizimdir!\n[ROOT.GetNameDef] için yeni bir dönem bugün başlıyor. [ROOT.GetLeader]'in bilge liderliği altında ülke yeniden inşa edilecek ve eskisinden daha güçlü çıkacak."
 NSB_soviet_civil_war_common.001.t:0 "Zafer"
 NSB_soviet_civil_war_common.002.a:0 "Moskova en önemli şehir"
 NSB_soviet_civil_war_common.002.b:0 "Leningrad devrimin başladığı yer"
 NSB_soviet_civil_war_common.002.c:0 "Petrograd olmalı"
 NSB_soviet_civil_war_common.002.d:0 "[?SOV_civil_war_start_state.GetName]'ı koruyalım"
 NSB_soviet_civil_war_common.002.desc:0 "Savaş bitti. Ülkenin gelecekteki başkentiyle ilgili bir karar alınması gerekiyor."
 NSB_soviet_civil_war_common.002.e:0 "Vladivostok yeni Doğu Başkentimiz olacak"
 NSB_soviet_civil_war_common.002.f:0 "St. Petersburg İmparatorluğun başkentiydi"
 NSB_soviet_civil_war_common.002.t:0 "[ROOT.GetNameDef]'in Başkenti"
 NSB_soviet_civil_war_common.003.a:0 "O zaman savaş"
 NSB_soviet_civil_war_common.003.desc:0 "Operasyonlarımız artık gizlice devam edemez. [ROOT.GetLeader] orduyu ve NKVD'yi seferber etti ve devlete karşı komplo kurduğundan şüphelenilen herkesi toplamaya başladı. Şimdi harekete geçmezsek, uğruna savaştığımız her şey boşa gidecek."
 NSB_soviet_civil_war_common.003.t:0 "[ROOT.GetLeader] Silahlı Kuvvetleri Seferber Ediyor"
 NSB_soviet_civil_war_common.006.a:0 "Güzel"
 NSB_soviet_civil_war_common.006.desc:0 "[SOS.GetLeader]'in ülke üzerindeki hakimiyeti zayıflıyor. [SOS.GetNameDef]'in her yerinde, insanlar [SOS.GetLeader]'in zorbalığına karşı ayaklanıyor. Mücadelemizde bize yardımcı olacak partizan birimleri oluşuyor."
 NSB_soviet_civil_war_common.006.t:0 "Partizanlar Ayaklanmaya Katılıyor"
 NSB_soviet_civil_war_common.010.a:0 "Volgograd uygun bir isim olurdu"
 NSB_soviet_civil_war_common.010.b:0 "Tsaritsyn'di, Tsaritsyn olmalı"
 NSB_soviet_civil_war_common.010.c:0 "Troçki devrimin gerçek kahramanıdır"
 NSB_soviet_civil_war_common.010.d:0 "Onu Buharin'in anısına yeniden adlandırmalıyız"
 NSB_soviet_civil_war_common.010.t:0 "De-Stalinizasyon"
 NSB_soviet_civil_war_common.010_exiles:0 "Bolşevikler devlet dinini komünizme değiştirmeye çalıştılar ve liderleri etrafında kişisel bir kült yarattılar. Hatta Rusya'nın şehirlerini yeniden adlandıracak kadar ileri gittiler. İmparatorluk çevresinde düzen yeniden sağlanmalı ve Stalingrad olarak yeniden adlandırılan eski Tsaritsyn şehrinden daha uygun bir başlangıç yeri yok."
 NSB_soviet_civil_war_common.010_left_opposition:0 "Devrim muzaffer. Diktatör düştü ve bir kez daha proletarya ülkeyi yönetiyor. Stalin'in kültist davranışı durdurulmalı ve tüm sembolleri kaldırılmalı. Stalin ve takipçilerinin adını taşıyan şehirler daha uygun bir şeyle yeniden adlandırılmalı. Bu özellikle Stalingrad şehri için geçerlidir."
 NSB_soviet_civil_war_common.010_right_opposition:0 "Diktatör düştü. Stalin kültünü yıkma, kalan takipçilerini sevdikleri ikonlardan mahrum bırakma ve halka eski zamanların artık olmadığını gösterme zamanı geldi. Anıtlar kaldırılmalı ve şehirler yeniden adlandırılmalı. Belki de Stalin'in en değerli mücevheri Stalingrad şehriydi."
 NSB_soviet_civil_war_common.100.a:0 "Bu mükemmel"
 NSB_soviet_civil_war_common.100.b:0 "İnsan gücü ayıramayız"
 NSB_soviet_civil_war_common.100.desc:0 "[FROM.GetNameDef]'deki muhalefet grupları [FROM.GetLeader]'e karşı bir ayaklanma planlıyor. Baş müzakerecileri, bir iç savaş durumunda destek karşılığında [FROM.GetLeader]'i yendikten sonra Vladivostok'u devretmeyi teklif etti."
 NSB_soviet_civil_war_common.100.t:0 "Destek Karşılığında Vladivostok"
 NSB_soviet_civil_war_common.100_exiles.desc:0 "Mançurya'daki Rus muhalefet grupları [FROM.GetLeader]'e karşı bir ayaklanma planlıyor. Baş müzakerecileri $SOV_konstantin_rodzayevsky$, iç savaş sırasında beyaz kuvvetlere Japon desteği karşılığında [FROM.GetLeader]'i yendikten sonra Vladivostok'u devretmeyi teklif etti."
 NSB_soviet_civil_war_common.101.a:0 "Bu arkamızı güvence altına almalı."
 NSB_soviet_civil_war_common.101.desc:0 "[FROM.GetAdjective] rejimi talebimizi kabul etti ve işler sarpa sararsa Stalinistlere karşı davamızı güçlü bir seferi kuvvetiyle destekleyecek. Savaş bittiğinde Vladivostok onların olacak."
 NSB_soviet_civil_war_common.101.desc_exiles:0 "[FROM.GetAdjective] dostlarımız talebimizi kabul etti ve ayaklandığımızda Bolşeviklere karşı mücadelemizi güçlü bir seferi kuvvetiyle destekleyecek. Vladivostok'u devretmek ağır bir bedel, ama bazen fedakarlık yapmanız gerekir - en azından geçici olarak."
 NSB_soviet_civil_war_common.101.t:0 "[FROM.GetName] Davamızı Destekliyor"
 NSB_soviet_civil_war_common.102.a:0 "Bunlar ilginç zamanlar"
 NSB_soviet_civil_war_common.102.desc:0 "Oldukça beklenmedik bir olaylar zincirinde, [FROM.GetAdjective] hükûmeti Stalin'e karşı aktif destek karşılığında liman ve Vladivostok çevresindeki alanı alma teklifini geri çevirdi."
 NSB_soviet_civil_war_common.102.t:0 "Japonlar Vladivostok'u Reddediyor"
 NSB_soviet_civil_war_common.103.a:0 "Eğer bir şansları olacaksa, alabilecekleri tüm yardıma ihtiyaçları olacak"
 NSB_soviet_civil_war_common.103.b:0 "Muhtemelen bir şeyler ayırabiliriz"
 NSB_soviet_civil_war_common.103.c:0 "En azından onlar için biraz silah satın alabiliriz"
 NSB_soviet_civil_war_common.103.d:0 "O çatışmaya sürüklenme riskine değmez"
 NSB_soviet_civil_war_common.103.desc:0 "Stalin'e karşı bir isyanı teçhizatla destekleme karşılığında, Sovyet muhalefeti Sahalin dedikleri adanın tamamını [ROOT.GetName]'e geri vermeye hazır."
 NSB_soviet_civil_war_common.103.desc_exiles:0 "Mançurya'daki Rus Göçmen topluluğundan bir temsilci, ikinci bir Rus İç Savaşı durumunda malzeme talebiyle bize başvurdu. Bunun karşılığında, [ROOT.GetNameDef]'in Karafuto adasının tamamı üzerindeki haklarını tanımaya hazır olduklarını söylüyorlar."
 NSB_soviet_civil_war_common.103.t:0 "Silah Karşılığında Kuzey Sahalin"
 NSB_soviet_civil_war_common.104.a:0 "Ağır bir bedel, ama umarım değer"
 NSB_soviet_civil_war_common.104.desc:0 "[FROM.GetAdjective] ile yapılan müzakereler başarılı oldu. [FROM.GetName], Sahalin'in Kuzey kısmının kontrolü karşılığında davamızı silahlarla tedarik etme sözü verdi."
 NSB_soviet_civil_war_common.104.t:0 "[FROM.GetNameDefCap] Silah Tedarik Edecek"
 NSB_soviet_civil_war_common.105.a:0 "Bu kötü"
 NSB_soviet_civil_war_common.105.desc:0 "[FROM.GetLeader]'e kesinlikle [FROM.GetAdjective] çıkarlarına olacak bir anlaşma teklif etmemize rağmen, heyet eli boş döndü."
 NSB_soviet_civil_war_common.105.t:0 "[FROM.GetNameDefCap] Silah Tedarik Etmeyi Reddediyor"
 NSB_soviet_civil_war_common.106.a:0 "Sovyetler Birliği'ni istikrarsızlaştıran her şey iyi bir şeydir"
 NSB_soviet_civil_war_common.106.b:0 "Bu çok iyi geliyor. Hatta bazı askeri danışmanlar bile göndermeliyiz"
 NSB_soviet_civil_war_common.106.c:0 "Bulaşmayalım"
 NSB_soviet_civil_war_common.106.desc_exiles_before:0 "Mançurya'daki anti-komünist gruplar [SOV.GetLeader]'e karşı komplo kuruyor. Başka bir iç savaşla Bolşevikleri devirmeyi planlıyorlar. Bu gruptan temsilciler, gelecekteki Bakü petrol sahalarındaki petrol hakları karşılığında gizli askeri yığınakla yardım istemek için bize başvurdular."
 NSB_soviet_civil_war_common.106.desc_exiles_civil_war:0 "Rus beyaz kuvvetleri [SOS.GetLeader]'e karşı ayaklandı ve Rusya'da başka bir iç savaş başlattı. İsyancılar, askeri kapasitelerini inşa etmede yardım karşılığında gelecekteki Bakü petrol sahalarındaki hakları teklif ederek bize başvurdular."
 NSB_soviet_civil_war_common.106.desc_right_opp_before:0 "[FROM.GetNameDef]'deki muhalefet grupları Stalin'e karşı bir darbe planlıyor. Gelecekteki Bakü petrol sahalarındaki petrol hakları karşılığında gizli askeri yığınakla yardım istemek için bize başvurdular."
 NSB_soviet_civil_war_common.106.desc_right_opp_civil_war:0 "[SOV.GetLeader] liderliğindeki [SOV.GetNameDefCap], [SOS.GetLeader]'e karşı ayaklandı ve umutsuz bir iç savaş veriyor. İsyancılar, askeri kapasitelerini inşa etmede yardım karşılığında gelecekteki Bakü petrol sahalarındaki hakları teklif ederek bize başvurdular."
 NSB_soviet_civil_war_common.106.t:0 "Bakü Petrol Sahaları Karşılığında Gizli Yardım"
 NSB_soviet_civil_war_common.107.a:0 "İyi haber"
 NSB_soviet_civil_war_common.107.desc_advisors:0 "[FROM.GetAdjective] hükümeti, gelecekteki petrol hakları karşılığında askeri sanayinin inşasına yardım etmeyi kabul etti. Ayrıca iç savaş süresince bizimle kalacak birkaç askeri \"danışman\" göndermeyi de kabul ettiler."
 NSB_soviet_civil_war_common.107.desc_normal:0 "Askeri kapasitemizi inşa etme konusundaki yardım talebimiz [FROM.GetNameDef] tarafından iyi karşılandı. [FROM.GetAdjective] hükûmeti, gelecekteki Kafkasya'daki petrol hakları karşılığında askeri fabrikalar inşa etmeye yardımcı olacak."
 NSB_soviet_civil_war_common.107.t:0 "[FROM.GetNameDefCap], Bakü Petrol Sahaları Karşılığında Yardım Etmeyi Kabul Ediyor"
 NSB_soviet_civil_war_common.108.a:0 "O zaman kendi başımızın çaresine bakmak zorunda kalacağız"
 NSB_soviet_civil_war_common.108.desc:0 "[FROM.GetNameDef] ile müzakerelerimiz sonuçsuz kaldı. Gelecekteki petrol haklarını teklif etmemize rağmen, daha fazla askeri sanayi inşa etmemize yardımcı olmayacaklar."
 NSB_soviet_civil_war_common.108.t:0 "[FROM.GetNameDefCap] Yardım Etmeyi Reddediyor"
 NSB_soviet_civil_war_common.109.a:0 "Bu çok ilginç olacak"
 NSB_soviet_civil_war_common.109.desc:0 "Rusya'da bir kez daha iç savaş patlak verdi. [SOV.GetLeader], [SOS.Getleader]'e karşı savaşı yönetiyor ve eğer isyancılar başarılı olursa, kazanacak çok şeyimiz var. Onlara destek sözü verdik ve [?ROOT.SOV_foreign_military_advisor_1.GetName] ile [?ROOT.SOV_foreign_military_advisor_2.GetName], savaşı planlamaya yardımcı olmak ve [SOV.GetAdjective] askeri kabiliyeti hakkında değerli bilgiler edinmek için [SOV.GetName]'e gitmeye hazır."
 NSB_soviet_civil_war_common.109.t:0 "[SOV.GetNameDef]'ye \"Danışmanlar\" gönderiliyor"
 NSB_soviet_civil_war_common.110.a:0 "Bu reddedilemeyecek kadar iyi bir teklif "
 NSB_soviet_civil_war_common.110.b:0 "Buna bulaşmayalım"
 NSB_soviet_civil_war_common.110.desc:0 "Sovyet Muhalefeti, iktidar mücadelelerinde bizden yardım istedi. Bağımsız bir Ukrayna'da gelecekteki kaynak hakkı karşılığında gizlice Ukrayna milislerini eğitmemizi istiyorlar."
 NSB_soviet_civil_war_common.110.t:0 "Bir Ukrayna İsyanını Kışkırtmaya Yardım Et"
 NSB_soviet_civil_war_common.111.a:0 "Bu işe yarasa iyi olur"
 NSB_soviet_civil_war_common.111.desc:0 "[FROM.GetNameDefCap] Ukrayna milislerini eğitmeye başlamayı kabul etti. Birimler daha sonra hazır olduklarında Ukrayna'ya kaçırılacak ve stalinist rejime karşı bir ayaklanma başlatacak."
 NSB_soviet_civil_war_common.111.t:0 "[FROM.GetNameDefCap] Ukrayna Milislerini eğitecek"
 NSB_soviet_civil_war_common.112.a:0 "Çok kötü"
 NSB_soviet_civil_war_common.112.desc:0 "Birkaç günlük tartışmalardan sonra, [FROM.GetLeader] aniden bir Ukrayna isyanını desteklemeye karşı karar verdi ve müzakerecilerimize tekliflerinin neden reddedildiğine dair hiçbir ipucu bırakmadı."
 NSB_soviet_civil_war_common.112.t:0 "[FROM.GetNameDefCap] Ukrayna Teklifini Reddediyor"
 NSB_soviet_civil_war_common.113.a:0 "[SOS.GetLeader] için bir düşman daha"
 NSB_soviet_civil_war_common.113.b:0 "Bunu bilmek güzel"
 NSB_soviet_civil_war_common.113.c:0 "Bekle, ne?"
 NSB_soviet_civil_war_common.113.desc_before:0 "Alman temaslarımız, eğittikleri Ukrayna milislerinin saldırmaya hazır olduğunu bildiriyor. Birimler teçhiz edildi ve eğitildi ve savaşın patlak vermesini bekleyerek gizlice Ukrayna'da konuşlandırılacak."
 NSB_soviet_civil_war_common.113.desc_started:0 "Alman temaslarımız, eğittikleri Ukrayna milislerinin saldırmaya hazır olduğunu bildiriyor. Birimler teçhiz edildi ve gizlice stratejik konumlara taşındı. Gitme emri verildi ve ayaklanma her an başlayacak."
 NSB_soviet_civil_war_common.113.t:0 "Ukrayna Milisleri Hazır"
 NSB_soviet_civil_war_common.114.a:0 "Bu kabul edilemez!"
 NSB_soviet_civil_war_common.114.b:0 "Peki, sonuçta bunu kabul etmiştik"
 NSB_soviet_civil_war_common.114.c:0 "Bu, [SOS.GetLeader]'e ciddi bir darbe vuracak"
 NSB_soviet_civil_war_common.114.desc:0 "Alman eğitimli Ukraynalı askerler, Ukrayna genelindeki kilit şehirlerin kontrolünü sağladı. [UKR.GetLeader] liderliğinde geçici bir hükûmet kuruldu ve [UKR.GetNameDef] kendini bağımsız bir ülke ilan etti."
 NSB_soviet_civil_war_common.114.t:0 "Ukrayna İsyanı"
 NSB_soviet_civil_war_common.115.a:0 "Harika bir fikir"
 NSB_soviet_civil_war_common.115.b:0 "Zaten yeterince kendi sorunumuz var"
 NSB_soviet_civil_war_common.115.desc:0 "Sovyet muhalefeti, gizli destek talebiyle bize başvurdu. Malzeme ve askeri yığınak yardımı karşılığında, sürgündeki [BLR.GetAdjective] hükûmetinin geri dönüşünü kabul etmeye hazırlar."
 NSB_soviet_civil_war_common.115.t:0 "Destek Karşılığında Belarus'a Gelecekte Bağımsızlık"
 NSB_soviet_civil_war_common.116.a:0 "Güzel"
 NSB_soviet_civil_war_common.116.desc:0 "[FROM.GetAdjective] ile müzakerelerimiz başarılı oldu. Savaştan sonra sürgündeki [BLR.GetAdjective] hükûmetinin geri dönmesine izin verme karşılığında, [FROM.GetAdjective] hükûmeti bizi askeri yığınak ve teçhizatla destekleyecek."
 NSB_soviet_civil_war_common.116.t:0 "[FROM.GetNameDefCap] Davamızı Destekliyor"
 NSB_soviet_civil_war_common.117.a:0 "Onların yardımı olmadan idare etmek zorunda kalacağız"
 NSB_soviet_civil_war_common.117.desc:0 "[FROM.GetAdjective] ile müzakerelerimiz somut bir sonuç vermedi. [FROM.GetLeader] teklifimizi geri çevirdi, bu yüzden [FROM.GetName]'den yardım gelmeyecek."
 NSB_soviet_civil_war_common.117.t:0 "[FROM.GetNameDef]'den Destek Yok"
 NSB_soviet_civil_war_common.118.a:0 "Onlara tüfek tedarik edelim"
 NSB_soviet_civil_war_common.118.b:0 "En azından birkaç tüfek ayırabiliriz"
 NSB_soviet_civil_war_common.118.c:0 "Bizde hiç yok, ama belki onlar için biraz satın alırsak"
 NSB_soviet_civil_war_common.118.d:0 "Bulaşmanın bir anlamı yok"
 NSB_soviet_civil_war_common.118.desc:0 "Anti-Stalinist Sovyet muhalefetinin üyeleri şu anda Stalinist rejime karşı kampanya yürütüyor. Bir dizi Stalin karşıtı miting düzenlendi ve burada [ROOT.GetName]'da bağış toplama kampanyaları yürütüyorlar.\nDavası için halk desteği toplamanın yanı sıra, ayaklanmayı desteklemek için silah talebiyle gizlice bize başvurdular."
 NSB_soviet_civil_war_common.118.t:0 "Sovyet Muhalefeti Destek İstiyor"
 NSB_soviet_civil_war_common.119.a:0 "Harika"
 NSB_soviet_civil_war_common.119.desc:0 "[FROM.GetAdjective] hükûmeti bize gizlice silah tedarik etmeyi kabul etti."
 NSB_soviet_civil_war_common.119.t:0 "[FROM.GetNameDefCap] Davamızı Destekliyor"
 NSB_soviet_civil_war_common.120.a:0 "Çok kötü"
 NSB_soviet_civil_war_common.120.desc:0 "[FROM.GetNameDef]'deki bağış toplama faaliyetimiz başarılı oldu. Ancak, hükûmet bize silah tedarik etmeyi reddetti."
 NSB_soviet_civil_war_common.120.t:0 "[FROM.GetAdjective] Hükûmeti Bizi Desteklemeyecek"
 NSB_soviet_civil_war_common.121.a:0 "Beklediğimiz şey buydu"
 NSB_soviet_civil_war_common.121.b:0 "Buna bulaşmayalım"
 NSB_soviet_civil_war_common.121.desc:0 "[FROM.GetLeader], [SOS.GetNameDef]'e karşı desteğimizi talep eden bir heyet gönderdi. \n[FROM.GetAdjective] hükûmeti, savaşa [ROOT.GetAdjective] girişi karşılığında egemenliğini devretmeye istekli."
 NSB_soviet_civil_war_common.121.t:0 "[FROM.GetName] Korumamızı İstiyor"
 NSB_soviet_civil_war_common.122.a:0 "Zafere"
 NSB_soviet_civil_war_common.122.desc:0 "Bunun böyle olması ne kadar utanç verici. Ama kaybettiğimiz şeyin kontrolünü yeniden kazanmak için fedakarlıklar yapmalıyız. Bu sadece geçici bir acil durum önlemidir.\nBolşevikler gittikten sonra, tam bağımsızlık elde etmek için çabalayacağız."
 NSB_soviet_civil_war_common.122.t:0 "[FROM.GetName] Teklifimizi Kabul Ediyor"
 NSB_soviet_civil_war_common.123.a:0 "Bu unutulmayacak!"
 NSB_soviet_civil_war_common.123.desc:0 "En umutsuz anımızda, [FROM.GetLeader], [FROM.GetNameDef]'in söz verdiği desteği geri çekmeye karar verdi, oysa biz onu güvence altına almak için aşırı çaba göstermeye hazırdık."
 NSB_soviet_civil_war_common.123.t:0 "[FROM.GetName] Bizi Terk Ediyor"
 NSB_soviet_civil_war_common.124.a:0 "Güzel"
 NSB_soviet_civil_war_common.124.desc:0 "[?SOV_civil_war_start_state.GetName]'da inşa edilen fabrikalar faaliyete geçmeye hazır. Bu, hem şimdi hem de gelecekte savaş çabamıza büyük ölçüde yardımcı olacaktır."
 NSB_soviet_civil_war_common.124.t:0 "[FROM.GetAdjective] Fabrikaları Tamamlandı"
 NSB_soviet_civil_war_common.125.a:0 "Harika"
 NSB_soviet_civil_war_common.125.desc:0 "[?SOV.SOV_defections_army_state.GetName]'ı ele geçirmemizden sonra, [SOS.GetLeader]'in ordusu cesaretini kaybediyor. Askerler toplu halde firar ediyor, bazıları sadece silahlarını bırakıyor, diğerleri ise gerçekten davamıza katılıyor."
 NSB_soviet_civil_war_common.125.t:0 "Düşman Firarları"
 NSB_soviet_civil_war_common.126.a:0 "Bunu iyi bir şekilde kullanabiliriz"
 NSB_soviet_civil_war_common.126.desc:0 "[?SOV.SOV_captured_stockpile_state.GetName]'da muzaffer birliklerimiz tarafından bir [SOS.GetAdjective] ordu deposu ele geçirildi. Geri çekilen [SOS.GetAdjective]ler onu yok etmeye çalışmıştı, ancak askerlerimiz teçhizatın bir kısmını ele geçirmeyi başardı."
 NSB_soviet_civil_war_common.126.t:0 "[?SOV.SOV_captured_stockpile_state.GetName]'da Ordu Stokları Ele Geçirildi"
 NSB_soviet_civil_war_common.127.a:0 "Hediye atın dişine bakılmaz"
 NSB_soviet_civil_war_common.127.desc:0 "[?SOV.SOV_defections_navy_state.GetName]'daki zaferimizden sonra, birkaç donanma subayı kayıp bir dava için savaştıklarını fark etti. Sonuç olarak, bir dizi gemi Kızıl Filo'dan ayrıldı ve mürettebatları bizim tarafımıza katılmayı teklif etti."
 NSB_soviet_civil_war_common.127.t:0 "Donanma firarları"
 NSB_soviet_civil_war_common.128.a:0 "Bunu kazanacağız"
 NSB_soviet_civil_war_common.128.desc:0 "Raporlar, [?SOV.SOV_civilian_unrest_state.GetName]'ın ele geçirilmesi gibi sahadaki son zaferlerimizin [SOS.GetNameDef] genelinde protestolara yol açtığını gösteriyor. Doğal olarak, [SOS.GetLeader]'in yandaşları bu protestoları acımasızca bastırıyor, ancak ne olursa olsun, [SOS.GetAdjective] savaş çabasını olumsuz etkileyeceği kesindir."
 NSB_soviet_civil_war_common.128.t:0 "[SOS.GetNameDef]'de Huzursuzluk"
 NSB_soviet_civil_war_common.129.a:0 "İnsan görevini yapmalı"
 NSB_soviet_civil_war_common.129.desc:0 "Rusya'da iç savaş devam ederken, sözlerimizi tutma zamanı geldi. [?SOV.SOV_japanese_general.GetName], [ROOT.GetAdjective] seferi kuvvetini zafere ve şana taşıyacak ve [ROOT.GetNameDef]'in onurunu koruyacaktır."
 NSB_soviet_civil_war_common.129.t:0 "[?SOV.SOV_japanese_general.GetName] Ayrılıyor"
 NSB_soviet_comecon.1.a:0 "Karşılıklı yardım pratikte böyle görünür!"
 NSB_soviet_comecon.1.desc:0 "COMECON ekonomik koordinasyon örgütünün bir parçası olarak, [FROM.GetAdjective] hükûmeti ekonomimize yatırım yapmaya başladı. Bu, önümüzdeki birkaç ay içinde ekonomimizi önemli ölçüde büyütmemizi sağlayacak."
 NSB_soviet_comecon.1.t:0 "[ROOT.GetNameDef]'de [FROM.GetAdjective] Sanayileşme Projesi"
 NSB_soviet_comecon.2.a:0 "Sizinle savaşmaya hazır olacağız, yoldaşlar!"
 NSB_soviet_comecon.2.desc:0 "[FROM.GetAdjective] hükûmeti geniş kapsamlı bir manevra ve tatbikat serisine karar verdi. Bu, askeri yeteneklerimizi artıracak ve diğer müttefiklerimizle birlikte çalışmamızı sağlayacaktır. Bu tatbikatlardan edindiğimiz deneyimleri gerekli askeri reformları yürütmek için kullanmalıyız."
 NSB_soviet_comecon.2.t:0 "COMECON Ülkeleri için [FROM.GetAdjective] Askeri Gelişim Programı"
 NSB_soviet_comecon_effect_duration_tt:0 "Bu etkiler §Y180§! gün sürecek, ardından Ulusal Ruhumuz eski haline geri dönecektir."
 NSB_soviet_communist_civil_war.001.a:0 "Troçki her zaman Stalin'in ana rakibiydi"
 NSB_soviet_communist_civil_war.001.b:0 "Smirnov halkı zafere taşıyacak"
 NSB_soviet_communist_civil_war.001.c:0 "Askeri deneyimi olan birine ihtiyacımız var"
 NSB_soviet_communist_civil_war.001.d:0 "Zinovyev doğal bir lider"
 NSB_soviet_communist_civil_war.001.desc:0 "Yoldaşlar, sancakları yükseltme ve devrim için savaşa gitme zamanı bir kez daha geldi. Proletaryayı kurtarmadan önce, [ROOT.GetNameDef]'in kontrolünü yeniden ele geçirmeliyiz. Tıpkı beyaz orduları yendiğimiz gibi, şimdi de anavatandaki gerçek devrimin önünde duranları yenmeliyiz.\nBu mücadelede liderimizin kim olacağına da karar vermeliyiz."
 NSB_soviet_communist_civil_war.001.e:0 "Kamenev iyi bir göstermelik lider olacak"
 NSB_soviet_communist_civil_war.001.t:0 "[GetSovietCivilWarName]"
 NSB_soviet_communist_civil_war.002.a:0 "Buharin mükemmel bir aday"
 NSB_soviet_communist_civil_war.002.b:0 "Rykov olmalı"
 NSB_soviet_communist_civil_war.002.c:0 "Ordunun sadakatini sağlayabilecek biri"
 NSB_soviet_communist_civil_war.002.d:0 "Zinovyev doğal bir lider"
 NSB_soviet_communist_civil_war.002.desc:0 "$SOV_lavrenty_beriya$ ordu subayları tarafından tutuklandı ve davasını beklemek üzere esir tutuluyor. Ordu tümenleri, destekçilerinin ayaklanma girişimlerine karşı güvence altına almak için başkente girdi. Beriya'nın en yakın ortaklarının tutuklamaları şu anda gerçekleştiriliyor. [ROOT.GetNameDef] için yeni bir lider bulma zamanı geldi."
 NSB_soviet_communist_civil_war.002.e:0 "Kamenev iyi bir göstermelik lider olacak"
 NSB_soviet_communist_civil_war.002.t:0 "Beriya Ordu Tarafından Ele Geçirildi"
 NSB_soviet_communist_civil_war.003.a:0 "Buharin bizi yönetecek"
 NSB_soviet_communist_civil_war.003.b:0 "Halk Rykov'un arkasında toplanabilir"
 NSB_soviet_communist_civil_war.003.c:0 "Askeri deneyimi olan birine ihtiyacımız var"
 NSB_soviet_communist_civil_war.003.d:0 "Zinovyev doğal bir lider"
 NSB_soviet_communist_civil_war.003.desc:0 "Savaş bir kez daha üzerimizde. Bu ülkeyi yoldan çıkaran diktatöre karşı silaha sarılmalıyız. Stalin, Sovyetler Birliği'ni çok uzun süredir yanlış yöne yönlendirdi. Bunun bu şekilde yapılması talihsizlik, ancak seçeneklerimiz tükendi."
 NSB_soviet_communist_civil_war.003.e:0 "Kamenev iyi bir göstermelik lider olacak"
 NSB_soviet_communist_civil_war.003.t:0 "[GetSovietCivilWarName]"
 NSB_soviet_communist_civil_war.004.a:0 "Bu teşvik edilmeli"
 NSB_soviet_communist_civil_war.004.b:0 "Bu durdurulmalı!"
 NSB_soviet_communist_civil_war.004.c:0 "Ah"
 NSB_soviet_communist_civil_war.004.desc:0 "[FROM.GetLeader], [SOS.GetLeader]'e karşı mücadelede gönüllüler için bir çağrı yaptı. Çağrıya çeşitli gruplar tarafından cevap verildi ve uluslararası tugaylar oluşuyor."
 NSB_soviet_communist_civil_war.004.t:0 "Uluslararası Devrimci Tugaylar Çağrısı"
 NSB_soviet_communist_civil_war.005.a:0 "Memnuniyetle karşılanan bir ek"
 NSB_soviet_communist_civil_war.005.desc:0 "Dünyanın dört bir yanından devrimciler, gerçek devrimin düşmanlarına karşı savaşmak için geldi. Gönüllüler, yakında [ROOT.GetNameDef]'in düşmanları üzerine salınabilecek uluslararası tugaylar halinde oluşturuluyor."
 NSB_soviet_communist_civil_war.005.t:0 "Uluslararası Tugaylar Geliyor"
 NSB_soviet_communist_civil_war.006.a:0 "Bırakın protesto etsinler"
 NSB_soviet_communist_civil_war.006.b:0 "Bu, kontrolden çıkmadan önce durdurulmalı"
 NSB_soviet_communist_civil_war.006.desc:0 "[?SOV_uprising_state.GetName]'daki işçiler kitlesel bir miting için sokaklara döküldü. Sendikalar için artan etki çağrıları yaygın, ancak diğer sloganlar ve protesto işaretleri de yaygındı. Hatta doğrudan Stalin karşıtı sloganlar atıldığına dair bazı raporlar bile var."
 NSB_soviet_communist_civil_war.006.t:0 "[?SOV_uprising_state.GetName]'da Kitlesel Protestolar"
 NSB_soviet_communist_civil_war.008.a:0 "İşler çirkinleşebilir"
 NSB_soviet_communist_civil_war.008.desc:0 "Stalin'in hayatına başarısız bir girişimde bulunuldu. Yalnız bir silahlı kişi Stalin'in daçasına girmişti ancak genel sekreterin odasına ulaşamadan keşfedildi. Suikastçı adayı, Stalin'in korumaları tarafından olay yerinde vurularak öldürüldü. Başkent şimdi bu işin arkasında kimin olabileceğiyle ilgili söylentilerle çalkalanıyor."
 NSB_soviet_communist_civil_war.008.t:0 "Stalin Suikast Girişiminden Kurtuldu"
 NSB_soviet_communist_civil_war.009.a:0 "Önümüzde ilginç zamanlar var."
 NSB_soviet_communist_civil_war.009.desc:0 "[SOV.GetNameDef]'in tartışmasız lideri $SOV_iosif_stalin$, bilinmeyen suikastçılar tarafından öldürüldü. Görünüşe göre, [SOV.GetNameDef] lideri eylem gerçekleştirildiğinde daçasında yalnızdı.\nStalin'in güvendiği, evrensel olarak sevilmeyen $SOV_lavrenty_beriya$ liderliğindeki bir troyka, ülkenin kontrolünü ele geçirdi, ancak durum istikrarsız ve [SOV.GetNameDef]'in geleceği belirsiz."
 NSB_soviet_communist_civil_war.009.t:0 "Stalin'in Ölümü"
 NSB_soviet_communist_civil_war.010.a:0 "Fazlasıyla hoş karşılanırlar!"
 NSB_soviet_communist_civil_war.010.desc:0 "Stalin'in muamelesinden memnun olmayan [?SOS.SOV_general_to_desert.GetName], diktatörü terk etmeye ve haklı mücadelemize katılmaya karar verdi. Az sayıda birlik, [SOS.GetLeader] ile kalmak yerine generallerini takip etmeye karar verdi."
 NSB_soviet_communist_civil_war.010.t:0 "[?SOS.SOV_general_to_desert.GetName] Taraf Değiştiriyor"
 NSB_soviet_fascist_tsarist.1.a:0 "Slav halklarının bu büyük birleşmesine katılacağız!"
 NSB_soviet_fascist_tsarist.1.b:0 "Onların koruması bağımsızlığımıza değmez."
 NSB_soviet_fascist_tsarist.1.desc:0 "Etrafımızdaki dünya şiddete sürüklenirken, [FROM.GetNameDef] harekete geçti ve tüm Slav halklarını bize zarar vermek isteyenlere karşı savunacağına söz verdi. Tüm Slav halklarının adil ve adaletli bir şekilde temsil edileceğini ve büyük [FROM.GetAdjective] ordusu tarafından korunacağını iddia ettikleri yeni bir \"Pan-Slav Birliği\"ne üye olmamız için bizi davet ettiler."
 NSB_soviet_fascist_tsarist.1.t:0 "Pan-Slav Birliği Üyeliği"
 NSB_soviet_fascist_tsarist.10.desc:0 "[FROM.GetNameDef] nihayet bir faşist güç haline geldi. Ancak, faşist partilerini iktidara getirmedeki tüm yardımımıza ve onlara ittifakımıza üyelik teklif etmemize rağmen, davetimizi reddettiler ve tek başlarına durmayı seçtiler."
 NSB_soviet_fascist_tsarist.11.a:0 "Şüphesiz hegemonyamıza meydan okumayı amaçlıyorlar."
 NSB_soviet_fascist_tsarist.11.desc:0 "Bize ulaşan raporlara göre [FROM.GetNameDef], Uzak Doğu'daki donanma altyapısını büyük ölçüde genişletiyor. Bu, Uzak Doğu'daki statüko için kötüye alamet..."
 NSB_soviet_fascist_tsarist.11.t:0 "[FROM.GetAdjective] Donanma Yığınağı"
 NSB_soviet_fascist_tsarist.12.a:0 "Eski hasmımızla savaşa hazırlansak iyi olur..."
 NSB_soviet_fascist_tsarist.12.desc:0 "[FROM.GetAdjective] gazetelerinin, [ROOT.GetAdjective]'nin Uzak Doğu'daki istismarlarını eleştiren artan sayıda makale bastığı görüldü ve siyasetçileri, bizi suçlayan ve [FROM.GetAdjective]'ye 1905 savaşındaki öfkeli kayıplarını hatırlatan giderek daha kışkırtıcı bir dil kullanıyor. Zaten en sesli ajitatörler \"Tsushima'nın intikamını alma\" çağrısı yapıyor!"
 NSB_soviet_fascist_tsarist.12.t:0 "[FROM.GetAdjective] Japon Karşıtı Propaganda"
 NSB_soviet_fascist_tsarist.13.a:0 "Bu bilgiye göre hareket etsek iyi olur..."
 NSB_soviet_fascist_tsarist.13.desc:0 "Raporlar, [FROM.GetNameDef]'in Kamçatka'daki askeri altyapısını büyük ölçüde genişletme sürecinde olduğunu gösteriyor. Askeri analistler, bu tesislerin yalnızca Alaska'daki güçlerimize karşı [FROM.GetAdjective] güç projeksiyonunu artırmayı amaçlayabileceğini ve en kötü durumda doğrudan bir işgal sıçrama tahtası olarak kullanılabileceğini öne sürüyor!"
 NSB_soviet_fascist_tsarist.13.t:0 "[FROM.GetAdjective] Kamçatka Yığınağı"
 NSB_soviet_fascist_tsarist.14.a:0 "Görkemli!"
 NSB_soviet_fascist_tsarist.14.desc:0 "Onlarca yıl önce ulusumuza yapılan haksızlık şimdi nihayet giderildi. Uspenski Katedrali'ndeki görkemli ve şatafatlı bir törenle, Büyük Dük Vladimir Kirilloviç, kalabalıkların dizginlenemez coşkusuyla Çar I. Vladimir olarak taç giydi.\n\nBuradan, Çar ilk iş olarak Kremlin kapılarından bir alay yönetti, coşkulu kitleleri selamladı ve onuruna düzenlenen etkileyici askeri geçit törenlerine bizzat katıldı.\n\nMuhteşem bir konuşmada, yeni Çar Rus halkının erdemlerini övdü ve ulusu bir kez daha eski şanına kavuşturma yolunda yönetmeye yemin etti."
 NSB_soviet_fascist_tsarist.14.t:0 "Çar'ın Dönüşü"
 NSB_soviet_fascist_tsarist.15.a:0 "Fiat voluntas tua, sicut in caelo, et in terra."
 NSB_soviet_fascist_tsarist.15.desc:0 "Din'in önemi ulusumuzda giderek daha fazla hissedilirken ve kilisenin statüsü bir kez daha eski haline ulaştığında - hatta aştığında - Tanrı'ya olan bağlılığımızı O'nun en önde gelen temsilcisini ulusal lider konumuna yükselterek sağlamlaştırmamız doğaldır.\n\nBugün, Moskova'daki Kurtarıcı Katedrali ve Uspenski Katedrali'nde düzenlenen çifte görkemli törenlerle, Sürgün davasına hizmetinden dolayı seçilen Harbin ve Mançurya'lı Meletius, hem Moskova ve Tüm Rusya Patriği olarak tahta çıkarıldı, hem de tüm Rusların Çarı olarak taç giydi.\n\nKilise ve devletin bu nihai, son birleşmesiyle, Tanrı'nın İradesinin bu dünyevi sahnede icra edilmesinin önünde hiçbir engel kalmadı..."
 NSB_soviet_fascist_tsarist.15.t:0 "Patrik Meletius'un Taç Giyme Töreni"
 NSB_soviet_fascist_tsarist.16.a:0 "Mükemmel bir fikir!"
 NSB_soviet_fascist_tsarist.16.b:0 "Geçen sefer sözlerinin ne kadar değerli olduğunu unutmadık."
 NSB_soviet_fascist_tsarist.16.desc:0 "İç kargaşalarından bize dost yeni bir hükûmet kurarak çıkan [SOV.GetNameDef], şimdi Avrupa'daki [GER.GetAdjective] saldırganlığını kontrol altına alarak eski ittifakımızı yeniden kurma teklifini bize uzattı."
 NSB_soviet_fascist_tsarist.16.t:0 "Üçlü İtilaf"
 NSB_soviet_fascist_tsarist.17.a:0 "Bu, Almanlara endişelenecek bir şeyler verecektir."
 NSB_soviet_fascist_tsarist.17.desc:0 "[FROM.GetNameDefCap], ittifak teklifimizi kabul ettiklerini ve diplomatik bağlarımızı genişletmek için derhal adımlar attıklarını bildiriyor."
 NSB_soviet_fascist_tsarist.17.t:0 "Üçlü İtilaf - Teklif Kabul Edildi"
 NSB_soviet_fascist_tsarist.18.a:0 "Diplomaside acı bir başarısızlık..."
 NSB_soviet_fascist_tsarist.18.desc:0 "[FROM.GetNameDef], bu zamanda bizimle bir ittifakta herhangi bir fayda görmediklerini bildirdi."
 NSB_soviet_fascist_tsarist.18.t:0 "Üçlü İtilaf - Teklif Reddedildi"
 NSB_soviet_fascist_tsarist.19.a:0 "Avrupa'nın gelecekteki istikrarı için kabul edeceğiz."
 NSB_soviet_fascist_tsarist.19.b:0 "Onların \"Üçlü İtilafları\" ne yazık ki ikili olacaktır."
 NSB_soviet_fascist_tsarist.19.desc:0 "[FROM.GetAdjective] ve [SOV.GetAdjective] hükûmetleri, bir zamanlar güçlerimiz arasında var olan Üçlü İtilaf ittifakını yeniden yaratmak için görüşmelere başladı. Şimdi bu planla ilerlemek ve bize katılmaları için bir davetiye göndermek niyetindeler."
 NSB_soviet_fascist_tsarist.2.a:0 "Akıllıca bir karar."
 NSB_soviet_fascist_tsarist.2.desc:0 "Az önce [FROM.GetAdjective] hükûmetinden haber aldık: [FROM.GetNameDef], Pan-Slav Birliği üyeliği davetimizi kabul etti."
 NSB_soviet_fascist_tsarist.2.t:0 "Pan-Slav Birliği: [FROM.GetNameDef] Kabul Ediyor"
 NSB_soviet_fascist_tsarist.20.a:0 "Birlikte en güçlüyüz!"
 NSB_soviet_fascist_tsarist.21.a:0 "En azından Ruslar yanımızda."
 NSB_soviet_fascist_tsarist.22.a:0 "Bu yeni Mihver, dünyanın etrafında döneceği mihverdir!"
 NSB_soviet_fascist_tsarist.22.b:0 "İttifak mı? Sanmıyoruz."
 NSB_soviet_fascist_tsarist.22.desc:0 "[SOV.GetAdjective] temsilcileri bir ittifak teklifiyle bize ulaştı. Yeni hükûmetlerinin ve bizim benzer dünya görüşlerine ve çıkarlara sahip olduğumuz için, ekonomik ve askeri alanlarda daha yakın işbirliği yapmamızın akıllıca olacağını öne sürüyorlar."
 NSB_soviet_fascist_tsarist.22.t:0 "Berlin-Moskova Mihveri"
 NSB_soviet_fascist_tsarist.23.desc:0 "[SOV.GetAdjective] hükûmeti, yeni diplomatik Mihverimizin oluşturulmasına memnuniyetle katılacaklarını bildiriyor. Zaten diplomatik ve askeri irtibat görevlileri göndermek için hazırlık yapıyorlar."
 NSB_soviet_fascist_tsarist.23.t:0 "Berlin-Moskova Mihveri: Teklif Kabul Edildi"
 NSB_soviet_fascist_tsarist.24.a:0 "Çok talihsiz... Kesinlikle kötü niyet belirtisi değildir?"
 NSB_soviet_fascist_tsarist.24.desc:0 "[SOV.GetAdjective] diplomatları bugün bize hükûmetlerinin teklifimizi reddettiğini bildirdi."
 NSB_soviet_fascist_tsarist.24.t:0 "Berlin-Moskova Mihveri: Teklif Reddedildi"
 NSB_soviet_fascist_tsarist.25.a:0 "Derhal elçiler göndereceğiz."
 NSB_soviet_fascist_tsarist.25.b:0 "Çıkarlarımızın Japonlarınkiyle uyuşmadığından korkuyoruz."
 NSB_soviet_fascist_tsarist.25.desc:0 "[SOV.GetAdjective] temsilcileri, ittifakımıza [JAP.GetNameDef]'i dahil etme teklifinde bulundu. [SOV.GetName] ve [JAP.GetName] arasında gergin ilişkiler geçmişi göz önüne alındığında, onlarla temas kuran ve iki güç arasında arabuluculuk yapanların biz olmamız gerektiğini öneriyorlar."
 NSB_soviet_fascist_tsarist.25.t:0 "Tokyo Mihveri"
 NSB_soviet_fascist_tsarist.26.a:0 "Mükemmel haber - doğu kanadımız güvende!"
 NSB_soviet_fascist_tsarist.26.desc:0 "Şimdi [GER.GetAdjective] hükûmetinden haber aldık: bize kendimizle Japonlar arasında arabuluculuk yaptıklarını ve Japonların teklifi kabul ettiğini bildiriyorlar!"
 NSB_soviet_fascist_tsarist.26.t:0 "Tokyo Mihveri - [JAP.GetName] Kabul Etti"
 NSB_soviet_fascist_tsarist.27.a:0 "Büyük bir aksilik..."
 NSB_soviet_fascist_tsarist.27.desc:0 "[GER.GetAdjective] hükûmeti bize, en iyi çabalarına rağmen, Japonların maalesef ittifak teklifimizi reddettiğini bildiriyor."
 NSB_soviet_fascist_tsarist.27.t:0 "Tokyo Mihveri - [JAP.GetName] Reddetti"
 NSB_soviet_fascist_tsarist.28.a:0 "Ne yazık! Kesinlikle iyi nedenleri vardır."
 NSB_soviet_fascist_tsarist.28.desc:0 "[GER.GetAdjective] hükûmeti, ittifakımıza Japon üyeliği teklifimizi değerlendirdi, ancak üzülerek bize şu anda böyle bir ittifakın kendi çıkarlarına olduğunu görmediklerini bildiriyorlar."
 NSB_soviet_fascist_tsarist.28.t:0 "Tokyo Mihveri - [GER.GetName] Reddetti"
 NSB_soviet_fascist_tsarist.29.a:0 "Bu ittifak diplomaside son söz olsun!"
 NSB_soviet_fascist_tsarist.29.b:0 "Tarih bize üçlü yönetimlerin kaderini anlatıyor... Reddediyoruz."
 NSB_soviet_fascist_tsarist.29.desc:0 "[GER.GetAdjective], üç gücümüz arasında bir [SOV.GetAdjective] ittifak teklifi olduğunu söyledikleri bir şeyle bize başvurdu. Üçümüz birleştiğimizde, dünyanın geri kalanının bize karşı durmayı umamayacağını savunuyorlar."
 NSB_soviet_fascist_tsarist.3.a:0 "Pan-Slav Birliği bir gerçek olacak - onların rızasıyla ya da rızası olmadan."
 NSB_soviet_fascist_tsarist.3.desc:0 "[FROM.GetAdjective] hükûmetinden temsilciler, Pan-Slav Birliğimize gönüllü katılımlarının herhangi bir olasılığını kategorik olarak reddettiklerini bildirdiler."
 NSB_soviet_fascist_tsarist.3.t:0 "Pan-Slav Birliği: [FROM.GetNameDef] Reddediyor"
 NSB_soviet_fascist_tsarist.30.a:0 "Görkemli!"
 NSB_soviet_fascist_tsarist.30.desc:0 "[JAP.GetName], [SOV.GetAdjective] teklifini kabul etmeyi seçtiklerini ve en kısa sürede ittifakımıza katılmaya hazır olduklarını bildiriyor."
 NSB_soviet_fascist_tsarist.31.a:0 "Onlarsız da idare ederiz."
 NSB_soviet_fascist_tsarist.31.desc:0 "[JAP.GetName] üzülerek bize [SOV.GetAdjective] teklifinin şu anda kendi çıkarlarına olmadığına inandıklarını ve bu nedenle reddetmek zorunda olduklarını bildiriyor."
 NSB_soviet_fascist_tsarist.32.a:0 "Bolşevizme karşı her müttefik kabulümüzdür."
 NSB_soviet_fascist_tsarist.32.b:0 "Ona güvenemeyiz!"
 NSB_soviet_fascist_tsarist.32.desc:0 "En son düşman geri çekilmesi sırasında [SOV.GetAdjective] yüksek rütbeli bir general güçlerimiz tarafından ele geçirildi. Bizim gözetimimizde olan bu general, Andrey Vlasov, \"Bolşevizm karşıtlığını\" açıkça ifade etti ve şimdi \"Stalinizm\"e karşı bizimle birlikte savaşmak üzere yakalanan Ruslardan oluşan bazı tümenleri oluşturmayı teklif ediyor."
 NSB_soviet_fascist_tsarist.32.t:0 "Vlasov Yakalandı"
 NSB_soviet_fascist_tsarist.33.a:0 "Talihsizlik, ama şu anda endişelenecek daha büyük şeyler var!"
 NSB_soviet_fascist_tsarist.33.desc:0 "Generalimiz [SOV_andrey_vlasov.GetName]'in düşman kuvvetleri tarafından yakalandığına dair haber aldık. Kaderi hakkında sadece tahmin yürütebiliriz..."
 NSB_soviet_fascist_tsarist.4.a:0 "Savaşmadan fethedilmeyelim diye tetikte olmalıyız."
 NSB_soviet_fascist_tsarist.4.desc:0 "[FROM.GetAdjective] kışkırtıcılarının ülkemiz içinde faşist propaganda yaydığına ve ayrıca [FROM.GetAdjective] parasının yerli faşist parti faaliyetlerini ve siyasi harcamalarını sübvanse ettiğine dair rahatsız edici raporlar bize ulaştı."
 NSB_soviet_fascist_tsarist.4.t:0 "[FROM.GetNameDef] Siyasetimizi Etkiliyor"
 NSB_soviet_fascist_tsarist.5.a:0 "[FROM.GetAdjective] liderliği altında daha güçlüyüz."
 NSB_soviet_fascist_tsarist.5.b:0 "Güçlü olmak için Ruslara ihtiyacımız yok!"
 NSB_soviet_fascist_tsarist.5.desc:0 "Benzer dünya görüşlerimizi tanıyan [FROM.GetNameDef], ulusumuz için şanlı bir gelecek ararken bize askeri ve ekonomik desteklerini sunarak bizi [FROM.GetFactionName]'e davet etti!"
 NSB_soviet_fascist_tsarist.5.t:0 "[FROM.GetFactionName]'e Katılma Daveti"
 NSB_soviet_fascist_tsarist.6.a:0 "Artık Amerika'daki köprübaşımızı oluşturuyorlar."
 NSB_soviet_fascist_tsarist.6.desc:0 "[FROM.GetNameDef] ittifak teklifimizi kabul etti ve derhal ittifakımıza katıldı!"
 NSB_soviet_fascist_tsarist.6.t:0 "[FROM.GetNameDef], [ROOT.GetFactionName]'e Katılıyor"
 NSB_soviet_fascist_tsarist.7.a:0 "Aptallar!"
 NSB_soviet_fascist_tsarist.7.desc:0 "[FROM.GetAdjective] hükûmeti bize ittifak teklifimizi reddettiklerini bildirdi. Amerika'da tek başlarına durmayı tercih ediyorlar."
 NSB_soviet_fascist_tsarist.7.t:0 "[FROM.GetNameDef] Daveti Reddediyor"
 NSB_soviet_fascist_tsarist.8.desc:0 "Nihayet benzer dünya görüşlerini paylaştığımızı kabul eden [FROM.GetNameDef], ulusumuz için şanlı bir gelecek ararken bize devam eden askeri ve ekonomik desteklerini sunarak bizi [FROM.GetFactionName]'e davet etti, tıpkı [ROOT.GetNameDef]'de partimizin iktidara yükselişini destekledikleri gibi!"
 NSB_soviet_fascist_tsarist.9.desc:0 "[FROM.GetNameDef] nihayet bir faşist güç haline geldi. Buna göre, kendilerine ittifakımıza üyelik teklif edildi ve kabul ettiler."
 NSB_soviet_five_year_plan.01.a:0 "Kahrolsunlar!"
 NSB_soviet_five_year_plan.01.desc:0 "Anavatana yönelik mevcut saldırı ile, önceki ekonomik büyüme planlarımızın artık uygulanabilir olmadığı açıktır. Barış yeniden sağlandığında onlara geri dönebiliriz, ancak şimdilik askeri üretime odaklanmalıyız."
 NSB_soviet_five_year_plan.01.t:0 "Üçüncü Beş Yıllık Plan Aksadı"
 NSB_soviet_five_year_plan_tt:0 "§Y$SOV_third_five_year_plan$§! ile ilgili her endüstriyel odak artık mevcut değil."
 NSB_soviet_for_the_common_good.1.a:0 "Ortak iyilik için!"
 NSB_soviet_for_the_common_good.1.desc:0 "Kolektif, bireyden daha güçlüdür. Bu, ekonomiler için de geçerlidir. [SOV.GetNameDefCap], tüm müttefiklerinin ekonomilerini, bireysel ülke yerine kolektife daha iyi hizmet edecek şekilde yeniden organize etmeye karar verdi. Bu, şimdi yaptığımız şeylerde değişiklikler ve muhtemelen başlangıçta bazı zorluklar anlamına gelecektir, ancak sonunda herkese daha iyi hizmet edecektir."
 NSB_soviet_for_the_common_good.1.t:0 "Ortak İyilik İçin"
 NSB_soviet_foreign_politics_events.1.a:0 "Anayasamızı koruyabilirsek onların ittifakına katılmaya hazırız."
 NSB_soviet_foreign_politics_events.1.b:0 "Hükûmetimizi onlarınkiyle hizalamalıyız."
 NSB_soviet_foreign_politics_events.1.c:0 "Bir santim bile taviz vermeyeceğiz."
 NSB_soviet_foreign_politics_events.1.desc:0 "[FROM.GetAdjective] dışişleri bakanı, [THIS.GetLeader] ile acil istişarelerde bulunmak üzere başkente geldi. [FROM.GetAdjective] heyeti, sınır güvenliğinden yerel basında [FROM.GetLeader]'nin hiç de hoş olmayan tasvirlerine kadar, öne çıkan sorunların uzun bir listesiyle geldi. Bir basın açıklamasında Dışişleri Bakanı, işbirliğinin ve barışçıl işbirliğinin önemini vurguladı, ancak [FROM.GetLeader]'nin \"düşmanca veya düşmanca olmayan bir [THIS.GetNameDef]'yi kabul etmenin zor olacağını\" belirtti."
 NSB_soviet_foreign_politics_events.1.t:0 "[FROM.GetAdjective] Hükûmete Baskısı"
 NSB_soviet_foreign_politics_events.10.a:0 "Teşekkürler yoldaşlar!"
 NSB_soviet_foreign_politics_events.10.b:0 "Bu sadece [FROM.GetNameDef]'e olan bağımlılığımızı artırır"
 NSB_soviet_foreign_politics_events.10.desc:0 "[FROM.GetAdjective] hükûmeti, ekonomiye kapsamlı bir yatırım programı başlattı. Bu programın bir parçası olarak, başkentte ve başka yerlerde bir köprü, tünel ve yol ağı inşaatı için fon ayırdılar. İnşaat endüstrimiz için kapasitedeki karşılık gelen artış şüphesiz gelecekte de kar getirmeye devam edecektir.\n\nAncak, hükûmetteki bazı kişiler [FROM.GetAdjective] mühendisleri ve fonlarını davet etmenin bizi gelecekte sadece onların uzmanlığına daha bağımlı hale getireceğinden endişe ediyor."
 NSB_soviet_foreign_politics_events.10.t:0 "[FROM.GetNameDefCap] Ekonomimize Yatırım Yapmak İstiyor"
 NSB_soviet_foreign_politics_events.11.a:0 "Kesinlikle haklılar."
 NSB_soviet_foreign_politics_events.11.b:0 "Kendimizi en iyi nasıl savunacağımıza biz karar vereceğiz."
 NSB_soviet_foreign_politics_events.11.desc:0 "Savaş giderek daha olası görünürken, [FROM.GetAdjective] hükûmeti savaş yeteneklerimizi geliştirmemiz için bize baskı yapmaya başladı. Daha fazla tümeni ön cephe görevine hazır hale getirmek ve [FROM.GetAdjective] tümenlerini serbest bırakmak için eğitim süresini kısaltırken insan gücü rezervlerimizi büyük ölçüde artırmamızı istiyorlar."
 NSB_soviet_foreign_politics_events.11.t:0 "[FROM.GetNameDefCap] Savaş Tedbirleri Talep Ediyor"
 NSB_soviet_foreign_politics_events.12.a:0 "Girişimi memnuniyetle karşılıyoruz."
 NSB_soviet_foreign_politics_events.12.b:0 "Bu gereksiz bir tırmanış olurdu."
 NSB_soviet_foreign_politics_events.12.desc:0 "[JAP.GetNameDef]'den artan tehdidi belirten [FROM.GetAdjective] hükûmeti, [JAP.GetNameDef] ile olan sınırımızı derhal tahkim etmeye başlamamız gerektiğini şiddetle önerdi. Savunmamız için yapmaları gereken insan gücü taahhüdünü azaltmak için bunun için malzeme ve lojistik destek sözü verdiler."
 NSB_soviet_foreign_politics_events.12.t:0 "[FROM.GetNameDefCap] Sınır Tahkimatlarını Genişletmek İstiyor"
 NSB_soviet_foreign_politics_events.13.a:0 "Cidden, [FROM.GetLeader]'in nesi var?"
 NSB_soviet_foreign_politics_events.13.desc:0 "Beklenmedik bir şekilde, [FROM.GetAdjective] hükûmeti yönergelerimizi reddetti ve yetkililerimiz tarafından sunulan planları takip etmeyi reddetti. Sanki [FROM.GetLeader]'in [ROOT.GetNameDef]'e karşı düşmanca niyetleri varmış gibi görünüyor..."
 NSB_soviet_foreign_politics_events.13.t:0 "[FROM.GetNameDef], [ROOT.GetAdjective] Yönergelerini Reddediyor"
 NSB_soviet_foreign_politics_events.150.a:0 "Çok akıllıca."
 NSB_soviet_foreign_politics_events.150.desc:0 "Sabahın erken saatlerine kadar süren bir kabine oturumunun ardından, [FROM.GetLeader] taleplerimizi resmen kabul etti. [FROM.GetNameDef] Büyükelçimiz, [FROM.GetAdjective] hükûmetinin herhangi bir dış veya iç politika konusunda bizimle yakın koordinasyon içinde olmasını sağlayacaktır."
 NSB_soviet_foreign_politics_events.150.t:0 "[FROM.GetNameDefCap] boyun eğiyor"
 NSB_soviet_foreign_politics_events.151.a:0 "En azından doğru tarafta savaşacaklar."
 NSB_soviet_foreign_politics_events.151.desc:0 "[FROM.GetAdjective] hükûmeti içindeki müzakereler bir çıkmaza girdikten sonra, [FROM.GetLeader] bir uzlaşma çözümü önerdi: [THIS.GetAdjective] kuvvetlerini [FROM.GetAdjective] topraklarında kabul etmeye istekli olsalar da, hükûmet sistemlerine herhangi bir müdahaleyi kabul etmeyecekler. \n\nAyrıca, [FROM.GetAdjective] ordusu aktif kalacak, [FROM.GetAdjective] subayları ve erleri tarafından görevlendirilecek ve sadece [FROM.GetAdjective] hükûmetine cevap verecektir. Ancak, [FROM.GetLeader] karşılıklı savunma planlarını tartışmaya isteklidir."
 NSB_soviet_foreign_politics_events.151.t:0 "[FROM.GetNameDefCap] İttifakımıza Katılıyor"
 NSB_soviet_foreign_politics_events.152.a:0 "Daha kötü bir kader seçtiler."
 NSB_soviet_foreign_politics_events.152.b:0 "Onları daha fazla zorlamayacağız... şimdilik."
 NSB_soviet_foreign_politics_events.152.c:0 "[FROM.GetNameDef] işgaline hazırlanın!"
 NSB_soviet_foreign_politics_events.152.d:0 "[ENG.GetAdjective] ile ortak bir işgal hazırlamalıyız"
 NSB_soviet_foreign_politics_events.152.desc:0 "[FROM.GetNameDef] ile bekleyen sorunlarımızı diplomatik olarak çözme girişimlerimiz başarısız olmuş gibi görünüyor. Büyükelçimiz başka bir müzakere turu için [FROM.GetLeader]'i aradığında, [FROM.GetAdjective]'in pozisyonunu netleştirdiği ve tartışılacak başka bir şey olmadığı kaba bir şekilde söylendi."
 NSB_soviet_foreign_politics_events.152.t:0 "[FROM.GetNameDefCap] Reddediyor"
 NSB_soviet_foreign_politics_events.153.a:0 "İran Koridorunu güvence altına almalıyız!"
 NSB_soviet_foreign_politics_events.153.b:0 "[PER.GetAdjective] bağımsızlığına saygı duyacağız."
 NSB_soviet_foreign_politics_events.153.desc:0 "[FROM.GetNameDef]'den, [PER.GetNameDef]'e karşı ortak bir askeri operasyon öneren diplomatik bir nota aldık. [FROM.GetAdjective] Komutanlığı, bu operasyonun İran petrol sahalarını ve [FROM.GetNameDef]'e olan ikmal hatlarımızı güvence altına almamızı sağlarken, aynı zamanda [TUR.GetNameDef]'den [PER.GetName] üzerinden Bakü petrol sahalarına ve [RAJ.GetNameDef]'e yönelik potansiyel bir düşman ilerlemesini önleyeceğini doğruluyor."
 NSB_soviet_foreign_politics_events.153.t:0 "İran'ın Anglo-[SOV.GetAdjective] İşgali"
 NSB_soviet_foreign_politics_events.153_soviets_alone_tt:0 "[FROM.GetAdjective]ler, [PER.GetNameDef] ile kendileri başa çıkmak zorunda kalacak."
 NSB_soviet_foreign_politics_events.154.a:0 "Hazırlıklara başlayın!"
 NSB_soviet_foreign_politics_events.154.desc:0 "[FROM.GetAdjective] büyükelçisi, [FROM.GetNameDef]'in [PER.GetNameDef]'e karşı ortak bir askeri operasyon düzenlemeyi ve yürütmeyi kabul ettiği bir nota iletti. Hem [ROOT.GetAdjective] hem de [FROM.GetAdjective] Komutanlıkları, bunun sayıca az ve teknolojik olarak geride kalmış bir düşmana karşı hızlı ve etkili bir operasyon olacağından ve İran petrol sahalarını ve [FROM.GetAdjective]'in [ROOT.GetNameDef]'e olan ikmal hatlarını güvence altına almamızı sağlarken, aynı zamanda [TUR.GetNameDef]'den [PER.GetName] üzerinden Bakü petrol sahalarına ve [RAJ.GetNameDef]'e yönelik potansiyel bir düşman ilerlemesini önleyeceğinden eminler."
 NSB_soviet_foreign_politics_events.154.t:0 "İran'ın Anglo-[SOV.GetAdjective] İşgali"
 NSB_soviet_foreign_politics_events.155.a:0 "Her zamanki gibi güvenilmezler..."
 NSB_soviet_foreign_politics_events.155.desc:0 "[ROOT.GetAdjective] ve [FROM.GetAdjective] diplomatları arasındaki birkaç yorucu toplantıdan sonra, [FROM.GetNameDef] [PER.GetNameDef] için planlarımıza dahil olmamaya karar verdi. [FROM.GetLeader]'in kendisi bile bu teklifin toprak hırslarımızı meşrulaştırma girişiminden başka bir şey olmadığını ima etmeye cüret etti. \nGörünüşe göre [PER.GetNameDef] ile kendimiz başa çıkmak zorunda kalacağız."
 NSB_soviet_foreign_politics_events.155.t:0 "[FROM.GetAdjective] Hükûmeti Reddediyor."
 NSB_soviet_foreign_politics_events.158.a:0 "nihayet, [FROM.GetNameDef]'den daha fazla işbirliği bekleyebiliriz."
 NSB_soviet_foreign_politics_events.158.desc:0 "Elçilerimizle yapılan başarısız müzakerelerden sonra ve medya ile halktan gelen büyük baskı altında, [FROM.GetAdjective] hükûmetinin eski lideri görevinden istifa etmeye ve yeni seçimler yapmaya karar verdi. Beklendiği gibi, bu seçimleri çıkarlarımıza çok daha yakın bir parti olan [FROM.GetRulingParty] kazandı ve başında [FROM.GetLeader] var."
 NSB_soviet_foreign_politics_events.158.t:0 "Yeni Bir [FROM.GetAdjective] Hükûmeti"
 NSB_soviet_foreign_politics_events.2.a:0 "Peki, bu kesinlikle onların hakkı."
 NSB_soviet_foreign_politics_events.2.b:0 "Birkaç kafa kırmak için polisi gönderin!"
 NSB_soviet_foreign_politics_events.2.desc:0 "Bir dizi siyasi grup bu hafta başkentte mitingler duyurdu. [FROM.GetNameDef] ile ilişkilerimizi geliştirmeye çalışmamız ve [FROM.GetAdjective] yönetimine eleştirel yaklaşan herhangi bir politikacıyı herhangi bir güç konumundan kaldırmamız gerektiği genel kanısı dışında, dile getirmek istedikleri belirli bir şikayetleri yok gibi görünüyor.\n\nBu gösterilerin sadece halkın görüşünün spontane tezahürleri olması mümkün olsa da, bir dizi kilit organizatörün son zamanlarda [FROM.GetCapitalVictoryPointName]'a seyahat etmesi ve geri döndüklerinde bunun için ajitasyona başlamış gibi görünmeleri en azından dikkat çekicidir."
 NSB_soviet_foreign_politics_events.2.t:0 "Başkentte [FROM.GetAdjective] Sponsorluğunda Mitingler"
 NSB_soviet_foreign_politics_events.20.a:0 "Omuz omuza duruyoruz!"
 NSB_soviet_foreign_politics_events.20.desc:0 "Demokrasiyi koruma konusundaki umutsuz mücadelemizi desteklemek için, [FROM.GetLeader] bir grup [FROM.GetAdjective] askeri danışmanı gönderdi. Çeşitli çatışmalardan zengin bir deneyimle gelen bu danışmanlar, ordumuzu yeniden inşa etmede şüphesiz çok değerli olacaklardır. Teçhizatları ve taktikleriyle, sahadaki çeşitli faşist güçlerin sözde gönüllü tümenleriyle de başa çıkabileceklerdir."
 NSB_soviet_foreign_politics_events.20.t:0 "[FROM.GetNameDefCap] Askeri Danışmanlar Gönderiyor"
 NSB_soviet_foreign_politics_events.200.a:0 "Başka seçeneğimiz yok."
 NSB_soviet_foreign_politics_events.200.b:0 "Belki bir uzlaşmaya varabiliriz?"
 NSB_soviet_foreign_politics_events.200.c:0 "Özgürlüğümüz için savaşacağız!"
 NSB_soviet_foreign_politics_events.200.desc:0 "[FROM.GetAdjective] elçisi, [THIS.GetLeader] ile derhal istişarede bulunulmasını talep eden bir not gönderdi. Nota göre, [FROM.GetAdjective] hükümeti artık ülkemizdeki \"belirsiz güvenlik durumuna\" tahammül etmeye istekli değil. Bunun ne anlama geldiği hemen belli değil, ancak bize fiilen üç seçenek verildiği açık: [FROM.GetAdjective] birliklerinin topraklarımızda konuşlandırılmasını kabul etmek; hükümetimizi [FROM.GetNameDef]'nin ihtiyaçlarına uygun bir hükümetle değiştirmek veya muhtemelen [FROM.GetNameDef]'nin askeri saldırısı."
 NSB_soviet_foreign_politics_events.200.t:0 "[FROM.GetNameDefCap] taleplerde bulunuyor"
 NSB_soviet_foreign_politics_events.210.a:0 "Savaşmak boşuna olurdu."
 NSB_soviet_foreign_politics_events.210.c:0 "Gelsinler bakalım!"
 NSB_soviet_foreign_politics_events.210.desc:0 "Görünüşe göre [FROM.GetAdjective] hükümeti diplomatik durumumuz konusunda giderek daha fazla tedirgin oluyor. Geçen hafta, [FROM.GetAdjective] elçisi [THIS.GetLeader] ile en az altı kez görüştü ve müzakerelerin son turunda fiilen bir ültimatom verdi. \n\nEYa [FROM.GetNameDef]'ye savunma paktına katılırız ve \"iç meselelerde belli düzeyde istişarede bulunmayı\" kabul ederiz, ya da [FROM.GetNameDef] büyük ihtimalle ülkemize askeri müdahaleye başvurur."
 NSB_soviet_foreign_politics_events.210.t:0 "[FROM.GetNameDef]'den Baskı"
 NSB_soviet_foreign_politics_events.211.a:0 "Hakimov'un teklifi dostane olabilir, ancak Sovyet hırsları konusunda uyanık olmalıyız."
 NSB_soviet_foreign_politics_events.211.desc:0 "Sovyet Başkonsolosu Kerim Hakimov, daha sıcak bir Sovyet-Arap ilişkisi geliştirmek için çabalarını iki katına çıkarıyor. Tatar kökenli bir Sovyet Müslümanı olan Hakimov, Şubat 1926'da kendisini Hicaz Kralı ve Necd Sultanı olarak tanıyan resmi bir notu teslim etmek için Cidde'den çöldeki sultanın konutuna ateş altında kişisel arabasını sürdüğünde İbn Suud'un saygısını ve dostluğunu kazandı. O zamandan beri, bu adam Sovyet-Arap ilişkilerinin ana destekçisi olmuştur. Gerçek bir Sovyetlerin Arabistanlı Lawrence'ı."
 NSB_soviet_foreign_politics_events.211.t:0 "Hakimov Teklifi"
 NSB_soviet_foreign_politics_events.250.desc:0 "Bir [FROM.GetAdjective] konvoyu, bir miktar tüfek ve diğer malzemeleri taşıyarak hatlarımıza ulaştı. Bir sonraki konvoyun ne zaman geleceği belli değil, bu yüzden bununla idare etmek zorunda kalacağız."
 NSB_soviet_foreign_politics_events.250.t:0 "[FROM.GetNameDefCap] Askeri Yardım Gönderiyor"
 NSB_soviet_foreign_politics_events.251.a:0 "Hazır olacağız."
 NSB_soviet_foreign_politics_events.251.desc:0 "Görünüşe göre [FROM.GetLeader], [JAP.GetNameDef] ile savaşın kaçınılmaz olduğu ve yakın gelecekte patlak verme olasılığının yüksek olduğu sonucuna vardı. Bu nedenle, başkentimizdeki [FROM.GetAdjective] temsilcisi, yakın [JAP.GetAdjective] saldırısına hazırlık olarak sınır kuvvetlerimizi uyarmamızı ve ordumuzu seferber etmemizi istedi."
 NSB_soviet_foreign_politics_events.251.t:0 "[FROM.GetNameDefCap], [JAP.GetNameDef] ile Savaş Hazırlığı Yapıyor"
 NSB_soviet_foreign_politics_events.252.a:0 "Hesaplaşma günü geldi!"
 NSB_soviet_foreign_politics_events.252.desc:0 "[JAP.GetNameDef] ile uzun zamandır beklenen savaş geldi. Bugün erken saatlerde, [FROM.GetAdjective] kuvvetleri Çin genelindeki [JAP.GetAdjective] pozisyonlarına saldırılara başladı ve şimdi onlara katılma zamanı geldi. [FROM.GetAdjective] müttefiklerimizle omuz omuza, [JAP.GetAdjective] kuvvetlerini topraklarımızdan süpüreceğiz!"
 NSB_soviet_foreign_politics_events.252.t:0 "[JAP.GetNameDef] ile Savaş"
 NSB_soviet_foreign_politics_events.260.a:0 "Acı verici, ama katlanılabilir."
 NSB_soviet_foreign_politics_events.260.b:0 "Savaş hala lehimize dönebilir."
 NSB_soviet_foreign_politics_events.260.desc:0 "Kurilleri ve Güney Sahalin'i istila ettikten sonra, [FROM.GetAdjective] komutanı, bir barış antlaşmasına hazırlık olarak mevcut hatlarda bir ateşkes teklif etti. Bu barış antlaşmasının en azından kuzey adalarını yeni sınırlar olarak tanıyacağı ve Kurilleri ve Güney Sahalin'i etkili bir şekilde [FROM.GetNameDef]'e devredeceği söylenmedi."
 NSB_soviet_foreign_politics_events.260.t:0 "[FROM.GetNameDefCap] Barış Teklif Ediyor"
 NSB_soviet_foreign_politics_events.261.desc:0 "Kurilleri ve Güney Sahalin'i istila ettikten ve Hokkaido'ya çıkarma yaptıktan sonra, [FROM.GetAdjective] komutanı, bir barış antlaşmasına hazırlık olarak mevcut hatlarda bir ateşkes teklif etti. Bu barış antlaşmasının [FROM.GetAdjective]'in Kuriller ve Sahalin üzerindeki mülkiyetini tanıyacağı ve Hokkaido'yu [FROM.GetAdjective] yönetimi altına sokacağı muhtemel görünüyor."
 NSB_soviet_foreign_politics_events.262.b:0 "Ne kadar da saçma bir öneri!"
 NSB_soviet_foreign_politics_events.263.a:0 "Bu, güç dengesini önemli ölçüde değiştirecek."
 NSB_soviet_foreign_politics_events.263.b:0 "Sözlerini tutacaklarına güvenemeyiz."
 NSB_soviet_foreign_politics_events.263.desc:0 "[FROM.GetLeader]'den bir elçi cesur bir teklifle bize başvurdu - [FROM.GetAdjective] hükûmeti bizimle bir ittifak anlaşması imzalamaya istekli! Ayrıntıların hala üzerinde çalışılması gerekse de, bu ittifakın öncelikle Pasifik okyanusundaki [USA.GetNameDef]'in etkisini azaltmaya veya ortadan kaldırmaya yönelik olacağı açıktır. Tek bir hamlede, Çin'deki konumumuza yönelik en büyük tehdidi ortadan kaldıracak, aynı zamanda başka yerlerde kullanılmak üzere birçok kuvveti serbest bırakacaktır.\n\nDonanma'daki çoğu subay bu olasılıktan heyecan duyarken, birçok Ordu subayı tekliften derin şüphe duyuyor ve [FROM.GetNameDef]'in sırtımızı döner dönmez bizi arkadan bıçaklayacağından endişe ediyor."
 NSB_soviet_foreign_politics_events.263.t:0 "[FROM.GetNameDefCap] Bir İttifak Teklif Ediyor"
 NSB_soviet_foreign_politics_events.264.a:0 "[FROM.GetLeader]'den akıllıca bir karar."
 NSB_soviet_foreign_politics_events.264.desc:0 "[GetAppropriateSovietProgressInJapan]'den sonra, [FROM.GetLeader] barış teklifimizi kabul etti ve ülkelerimiz arasındaki düşmanlıkların derhal sona ermesi karşılığında toprak taleplerimize uydu.\nŞimdi [537.GetName], [555.GetName] ve [536.GetName]'ın bölgesel yönetimlerini [ROOT.GetNameDef]'e devredecekler."
 NSB_soviet_foreign_politics_events.264.desc_default:0 "[GetAppropriateRedArmyNsName] tarafından [FROM.GetAdjective] Kuzey adalarının [ROOT.GetAdjective] işgali,"
 NSB_soviet_foreign_politics_events.264.desc_hokkaido:0 "[536.GetName] dahil olmak üzere [FROM.GetAdjective] Kuzey topraklarında [GetAppropriateRedArmyNsName]'in ilerlemesi,"
 NSB_soviet_foreign_politics_events.264.t:0 "[FROM.GetNameDef] Barış Şartlarımıza Uyuyor"
 NSB_soviet_foreign_politics_events.265.a:0 "[FROM.GetLeader], bunun ülkesi için nasıl sonuçlanacağını göremiyor mu?"
 NSB_soviet_foreign_politics_events.265.desc:0 "[From.GetNameDef], barış teklifimizi reddetti ve [FROM.GetAdjective] topraklarının [ROOT.GetAdjective] işgali ortadan kalkana ve savaş kendi topraklarımıza geri dönene kadar savaşmaya devam edeceğine yemin etti."
 NSB_soviet_foreign_politics_events.265.t:0 "[FROM.GetNameDef] Barış Şartlarımızı Reddediyor"
 NSB_soviet_foreign_politics_events.266.a:0 "Tavizlerimiz gelecekte meyvesini verecek."
 NSB_soviet_foreign_politics_events.266.desc:0 "[FROM.GetAdjective] hükûmeti uzlaşmacı tavrımızdan memnun kaldı ve teklifimizi kabul etti. \nSadece birkaç saat önce, [FROM.GetAdjective] ve [ROOT.GetAdjective] diplomatları, [FROM.GetAdjective] büyükelçisinin sözleriyle, Doğu'da yeni bir işbirliği dönemini başlatabilecek bir Saldırmazlık Paktı imzaladılar."
 NSB_soviet_foreign_politics_events.266.t:0 "[ROOT.GetAdjective]-[FROM.GetAdjective] Dostluk Paktı"
 NSB_soviet_foreign_politics_events.267.a:0 "Planlarımızı yeniden ayarlamamız gerekecek..."
 NSB_soviet_foreign_politics_events.267.desc:0 "[FROM.GetAdjective] hükûmeti uzlaşma teklifimizden etkilenmedi ve teklifimizi kesin olarak reddetti. \nGörünüşe göre [FROM.GetLeader]'in Uzak Doğu'daki hırsları konusunda uyanık kalmalıyız..."
 NSB_soviet_foreign_politics_events.267.t:0 "[FROM.GetNameDef], Savunma Paktı Teklifimizi Reddediyor"
 NSB_soviet_foreign_politics_events.268.a:0 "[USA.GetAdjective] emperyalizmini durduracağız!"
 NSB_soviet_foreign_politics_events.268.desc:0 "[FROM.GetAdjective] hükûmeti, [USA.GetNameDef]'e karşı bir saldırı paktı teklifimize gerçek bir ilgi gösterdi ve [FROM.GetLeader]'in diplomatları kendilerine sunulan anlaşmayı yeni imzaladı. [FROM.GetAdjective] silahlı kuvvetleri şu anda yeni duruma yeniden ayarlanıyor ve Yüksek Komutanlıkları, birlikte, [USA.GetNameDef]'i yeneceğimizden ve uluslararası sahnedeki etkilerini sonsuza dek sona erdireceğimizden emin."
 NSB_soviet_foreign_politics_events.268.t:0 "[USA.GetNameDef]'e Karşı [ROOT.GetAdjective]-[FROM.GetAdjective] Paktı"
 NSB_soviet_foreign_politics_events.269.a:0 "Bu üzücü..."
 NSB_soviet_foreign_politics_events.269.desc:0 "[FROM.GetAdjective] hükûmeti teklifimizi reddetti. Görünüşe göre [FROM.GetLeader], [ROOT.GetAdjective] ve [FROM.GetAdjective] kuvvetlerini [USA.GetNameDef]'e karşı bir saldırı paktında birleştirme önerimizle ilgilenmiyor."
 NSB_soviet_foreign_politics_events.269.t:0 "[FROM.GetNameDef], Saldırı Paktı Teklifimizi Reddediyor"
 NSB_soviet_foreign_politics_events.270.a:0 "Bu girişimin lehindeyiz!"
 NSB_soviet_foreign_politics_events.270.b:0 "[SOV.GetAdjective] tüccarları ülkemize karışmayacak."
 NSB_soviet_foreign_politics_events.270.desc:0 "Rus Trans-Hazar demiryolu hattı, doğu terminali Taşkent'te olmak üzere Orta Asya'dan geçiyor. [FROM.GetAdjective] hükûmeti şimdi bunu genişletmeyi planlıyor ve daha iyi ticaret ilişkileri kurmak için hattı başkentimize bağlama teklifi gönderdi. Görünüşe göre [FROM.GetAdjective] yetkilileri Sincan pazarına genişlemekle ilgileniyor ve bunun kalkınma ve mübadeleye yönelik karşılıklı yararlı bir yolda ilk adım olabileceğini iddia ediyor."
 NSB_soviet_foreign_politics_events.270.t:0 "[FROM.GetAdjective] Trans-Hazar Demiryolu Genişlemesi"
 NSB_soviet_foreign_politics_events.271.a:0 "Yeni bir ekonomik pazara kapılar açılıyor!"
 NSB_soviet_foreign_politics_events.271.desc:0 "Semipalatinsk'te konuşlanmış [SIK.GetAdjective] konsolosu, [SIK.GetAdjective] hükûmetinin Trans-Hazar hattını genişletme ve Urumçi'yi buna bağlama [ROOT.GetAdjective] girişimini isteyerek kabul ettiğini iletmek için diplomatlarımızla temasa geçti. Ayrıca [SIK.GetNameDef] eyalet hükûmetinin ülkemizle yeni ekonomik ve diplomatik ilişkiler geliştirmeye açık olduğunu belirtti."
 NSB_soviet_foreign_politics_events.271.t:0 "[FROM.GetNameDefCap] Teklifimizi Kabul Ediyor"
 NSB_soviet_foreign_politics_events.272.a:0 "Bu beklenmedik ve çok talihsiz bir olaylar zinciri."
 NSB_soviet_foreign_politics_events.272.b:0 "Ateşle oynuyorlar!"
 NSB_soviet_foreign_politics_events.272.desc:0 "Semipalatinsk'te konuşlanmış [SIK.GetAdjective] konsolosu, [SIK.GetAdjective] hükûmetinin Trans-Hazar hattını genişletme ve [SIK.GetAdjective] başkenti Urumçi'yi buna bağlama [ROOT.GetAdjective] girişimini reddetme kararı aldığını iletmek için diplomatlarımızla temasa geçti."
 NSB_soviet_foreign_politics_events.272.t:0 "[FROM.GetNameDefCap] Teklifimizi Reddediyor"
 NSB_soviet_foreign_politics_events.273.a:0 "Bu her iki taraf için de faydalı bir anlaşma."
 NSB_soviet_foreign_politics_events.273.b:0 "Sadece ülkemizdeki [FROM.GetAdjective] etkisini artırmak istiyorlar."
 NSB_soviet_foreign_politics_events.273.desc:0 "Dihua'daki [FROM.GetAdjective] temsilcisi, [619.GetName]'da kaynak aramak ve işletmeyi kolaylaştırmak için bölgenin altyapısını iyileştirmek üzere yeni bir teklif sundu. Karşılığında, [FROM.GetAdjective] ticaret kuruluşlarının Altay'dan altın ve nadir mineraller gibi emtia ihracatıyla geri ödenmesini istiyorlar."
 NSB_soviet_foreign_politics_events.273.t:0 "[619.GetName]'da [FROM.GetAdjective] Maden Araması"
 NSB_soviet_foreign_politics_events.274.a:0 "Bu yeni ticaret fırsatları açıyor!"
 NSB_soviet_foreign_politics_events.274.desc:0 "Dihua'daki [ROOT.GetAdjective] temsilcisine [SIK.GetAdjective] diplomatları tarafından, [619.GetName]'da kaynak arama ve işletmeyi kolaylaştırmak için bölgenin altyapısını iyileştirme teklifimizi kabul ettikleri bildirildi. Karşılığında, [SIK.GetAdjective] ticaret kuruluşları Altay'dan altın ve nadir mineraller gibi emtia ihracatıyla geri ödenecek."
 NSB_soviet_foreign_politics_events.274.t:0 "[FROM.GetNameDefCap] Teklifimizi Kabul Ediyor"
 NSB_soviet_foreign_politics_events.275.a:0 "Akılsızca bir karar..."
 NSB_soviet_foreign_politics_events.275.b:0 "Aslında izin istemiyorduk."
 NSB_soviet_foreign_politics_events.275.desc:0 "Dihua'daki [ROOT.GetAdjective] temsilcisine [SIK.GetAdjective] diplomatları tarafından, hükûmetlerinin ülkeye yatırım yapma teklifimizi reddettiği bildirildi. Görünüşe göre [SIK.GetNameDef] artık [ROOT.GetNameDef] ile ticaret açmak ve daha iyi iş ve diplomatik ilişkiler geliştirmekle ilgilenmiyor."
 NSB_soviet_foreign_politics_events.275.t:0 "[FROM.GetNameDefCap] Teklifimizi Reddediyor"
 NSB_soviet_foreign_politics_events.276.a:0 "Bu kaynaklar bizim için önemsiz. Altına ihtiyacımız var!"
 NSB_soviet_foreign_politics_events.276.b:0 "[ROOT.GetAdjective] toprağındaki kaynaklar [ROOT.GetName]'e aittir!"
 NSB_soviet_foreign_politics_events.276.desc:0 "Diplomatlarımıza yeni bir [FROM.GetAdjective] teklifi iletildi. Görünüşe göre [FROM.GetNameDefCap], ülkemizin kuzey kesiminde mineral ve petrol kaynakları bulma konusunda büyük bir ilgi geliştirdi ve kaynak işletme hakları karşılığında bölgede bir maden araması ve altyapı tesislerinin genişletilmesini yürütmeyi teklif ediyorlar. [FROM.GetAdjective] temsilcileri, bu endüstriyel yatırımın doğal olarak bölgedeki altın ve gümüş ulusal işletmemizi artıracağını doğruluyor."
 NSB_soviet_foreign_politics_events.276.t:0 "[618.GetName]'da [FROM.GetAdjective] Maden Araması"
 NSB_soviet_foreign_politics_events.277.a:0 "Böyle bir teklifi reddedemezlerdi!"
 NSB_soviet_foreign_politics_events.277.desc:0 "[SIK.GetNameDef]'deki [ROOT.GetAdjective] diplomatları, [SIK.GetNameDef]'in kuzey kesiminde mineral ve petrol yatakları arama teklifimizin kabul edildiğini bildirdi. [SIK.GetName] eyalet hükûmeti, bölgedeki altın ve gümüş işletmesini doğal olarak artıracak olan [618.GetName]'daki altyapı tesislerinin genişletilmesini görmeye hevesli, bu nedenle [ROOT.GetAdjective] yatırımını geri ödemenin bir yolu olarak [618.GetName]'da bulabileceğimiz her türlü stratejik kaynağı işletme hakkını bize vermeyi kabul ediyorlar."
 NSB_soviet_foreign_politics_events.277.t:0 "$NSB_soviet_foreign_politics_events.274.t$"
 NSB_soviet_foreign_politics_events.278.a:0 "Bu gerçekten cömert bir teklif."
 NSB_soviet_foreign_politics_events.278.b:0 "[FROM.GetAdjective] ekonomik işgaline direnmek zorundayız!"
 NSB_soviet_foreign_politics_events.278.desc:0 "Diplomatlarımıza [FROM.GetAdjective] büyükelçisinden bir mektup teslim edildi; komşumuz, görünüşe göre [ROOT.GetName] askeri yeteneklerinden endişe duyarak, [ROOT.GetAdjective] ordusunun yeniden inşasını yürütmek için ülkemize teçhizat ve eğitmenler göndererek askeri yardım teklif ediyor. Uçak ve havacılık için teçhizat, birliklerimiz için tüfek ve makineli tüfekler alacağız, topçu atölyeleri ve tahkimatlar inşa edilecek ve yerel havacıları eğitmek için pilot okulları açılacak. Karşılığında, [FROM.GetAdjective] hükûmeti ticaretteki engelleri azaltmayı ve yün, pamuk, kürk ve deri gibi emtia mallarının [ROOT.GetAdjective] ihracatını artırmayı hedefliyor."
 NSB_soviet_foreign_politics_events.278.t:0 "[FROM.GetAdjective] Askeri Yardım"
 NSB_soviet_foreign_politics_events.279.a:0 "Akıllıca bir karar!"
 NSB_soviet_foreign_politics_events.279.desc:0 "[SIK.GetNameDef]'deki diplomatlarımız, [SIK.GetName]'a askeri yardım sağlama teklifimizin [SIK.GetLeader] tarafından kabul edildiğini bildirdi. Görünüşe göre, Çinli lider ordusunu ve askeri savunmasını güçlendirmeye hevesli ve [ROOT.GetAdjective] yardımıyla [SIK.GetNameDef]'in doğudan gelen düşman güçlere karşı durabileceğine inanıyor."
 NSB_soviet_foreign_politics_events.279.t:0 "[FROM.GetNameDefCap] Askeri Yardımımızı Kabul Ediyor"
 NSB_soviet_foreign_politics_events.280.a:0 "Bu adil bir teklif."
 NSB_soviet_foreign_politics_events.280.b:0 "Bu kadarı yeter, onlara ihtiyacımız yok!"
 NSB_soviet_foreign_politics_events.280.desc:0 "Doğuya doğru toprak genişlememizin ardından, [FROM.GetAdjective] hükûmeti büyümemizi desteklemeye ve yeni kazanılan topraklarımızda altyapı ve askeri savunma inşaatına yardım etmeye ilgi gösterdi. [FROM.GetNameDefCap] ayrıca, doğuya doğru askeri ilerlememizde kilit rol oynayabileceğini belirttikleri [756.GetName]'daki petrol sahalarını geliştirmekle de ilgileniyor. \nYine, [FROM.GetAdjective] hükûmeti, pazarımızdaki ticaret kuruluşları için daha fazla mali fayda ve ödeme olarak artan ihracat talep ediyor."
 NSB_soviet_foreign_politics_events.280.t:0 "Toprak Genişlemesi için [FROM.GetAdjective] Desteği"
 NSB_soviet_foreign_politics_events.281.a:0 "Yardım etmekten her zaman memnuniyet duyarız!"
 NSB_soviet_foreign_politics_events.281.desc:0 "[SIK.GetLeader], doğuya doğru toprak genişlemesi için lojistik ve askeri yardım sağlama teklifimizi kabul etti. Yeni kazanılan topraklarında altyapı ve askeri savunma inşa etmemize ve [756.GetName]'daki petrol sahalarını geliştirmemize izin verilecek. Karşılığında, [SIK.GetAdjective] hükûmeti pazarımızdaki ticaret kuruluşlarımız için daha büyük mali faydalar sağlayacak ve ülkemize olan ihracat miktarını artıracaktır."
 NSB_soviet_foreign_politics_events.281.t:0 "[FROM.GetNameDefCap] Yardımımızı Kabul Ediyor"
 NSB_soviet_foreign_politics_events.282.a:0 "Başka seçeneğimiz yok."
 NSB_soviet_foreign_politics_events.282.b:0 "Bu maskaralığa bir son vermeliyiz!"
 NSB_soviet_foreign_politics_events.282.desc:0 "[FROM.GetNameDef]'den, [ROOT.GetNameDef]'in [FROM.GetNameDef] hükûmetine bağlı, Bağımsız bir Sovyet Sosyalist Cumhuriyeti olarak entegrasyonunu talep eden resmi bir bildiri aldık. [FROM.GetLeader]'in kendisi, ulusumuzun belirli bir derecede özerkliğe sahip olacağına ve Kızıl Ordu'nun Sincan'ı Sovyet toprağıymış gibi savunmaya hazır olacağına söz verdi. Ona göre, bunlar bu zor zamanlarda ülkelerimiz arasında verimli bir işbirliği sağlamak için gerekli önlemlerdir. \n[FROM.GetNameDef]'in ülkemizdeki büyük yatırımları ve ekonomimiz üzerindeki artan [FROM.GetAdjective] etkisi göz önüne alındığında, bir cevap vermeden önce dikkatlice düşünmek en iyisidir."
 NSB_soviet_foreign_politics_events.282.t:0 "[SOV.GetNameDefCap], [ROOT.GetNameDef]'in Sovyet Cumhuriyeti'nin Resmîleştirilmesini Talep Ediyor"
 NSB_soviet_foreign_politics_events.283.a:0 "Birliğe hoş geldiniz, yoldaşlar!"
 NSB_soviet_foreign_politics_events.283.desc:0 "[FROM.GetLeader]'den, Çin'in Sincan eyaletinin [ROOT.GetNameDef] hükûmetine bağlı, Bağımsız bir Sovyet Sosyalist Cumhuriyeti olarak entegrasyonunu kabul eden resmi bir bildiri aldık. Bölgedeki büyük kalkınma projelerimiz, müttefiklerimizle iyi ilişkiler kurma ve gerektiğinde yardım sağlama konusundaki [ROOT.GetAdjective] iyi niyetini göstermiştir. Bu eylemler, [FROM.GetLeader]'in taleplerimizin bu zor zamanlarda ülkelerimiz arasında verimli bir işbirliği sağlamak için gerekli önlemler olduğunu anlamasına yardımcı oldu."
 NSB_soviet_foreign_politics_events.283.t:0 "[SIK.GetNameDefCap]"
 NSB_soviet_foreign_politics_events.284.a:0 "Ülkelerimiz arasındaki işbirliğini engelliyorlar."
 NSB_soviet_foreign_politics_events.284.b:0 "Bu hakaretin cezasız kalmasına izin vermeyeceğiz!"
 NSB_soviet_foreign_politics_events.284.desc:0 "[FROM.GetLeader]'den, [FROM.GetNameDef]'in Bağımsız bir Sovyet Sosyalist Cumhuriyeti olarak entegrasyonu taleplerimizi reddeden resmi bir bildiri aldık. Görünüşe göre bölgeyi geliştirmek ve Çinli komşularımıza yardım etmek için yaptığımız büyük yatırımlar, hala [ROOT.GetNameDef]'e güvensiz gözlerle bakan [FROM.GetLeader] için hiçbir anlam ifade etmiyor."
 NSB_soviet_foreign_politics_events.284.t:0 "[FROM.GetNameDefCap] Taleplerimizi Reddediyor"
 NSB_soviet_foreign_politics_events.285.a:0 "Düşmanlarımıza karşı birlikte karşı koyuyoruz!"
 NSB_soviet_foreign_politics_events.285.b:0 "Başka yerlerde yeni arkadaşlar arama zamanı!"
 NSB_soviet_foreign_politics_events.285.desc:0 "Savaşta korkunç kayıplar verdikten sonra, [SOV.GetNameDef]'in çöküşünün onların bize düşündürmek istediğinden daha yakın olabileceği anlaşılıyor. Hükûmetimizin birkaç üyesi, ülkemizin bu olaylar zincirinden kaçınılmaz olarak tehdit altında olduğunu doğruluyor ve [SOV.GetAdjective] anlaşmalarını derhal iptal etmemizi ve bunun yerine Çinli yetkililerle ilişkileri güçlendirmeye başlamamızı öneriyor. [ROOT.GetNameDef]'in güvenliğini sağlamak için, bizi destekleyebilecek güçlü müttefikler bulmak için ne gerekiyorsa yapmamız gerektiğini ve mevcut durum göz önüne alındığında [SOV.GetNameDef]'in misilleme olarak bir şey yapmasının pek olası olmadığını belirtiyorlar."
 NSB_soviet_foreign_politics_events.285.t:0 "[SOV.GetName] Çöküşün Eşiğinde"
 NSB_soviet_foreign_politics_events.286.a:0 "Acınası bir durum..."
 NSB_soviet_foreign_politics_events.286.b:0 "O geveze hainlerle başa çıkmalıyız!"
 NSB_soviet_foreign_politics_events.286.desc:0 "Dün resmi bir açıklamada, [SIK.GetLeader] Sincan'ın [ROOT.GetNameDef]'e olan sadakatini ve ülkelerimiz arasında işbirliğini sürdürme kişisel arzusunu yeniden teyit etti. Ancak, [SIK.GetNameDef]'deki alarmist unsurların [ROOT.GetNameDef]'in imajını ciddi şekilde zedelediği ve [SIK.GetLeader]'in [SIK.GetRulingParty] içindeki desteğinin ağır darbe aldığı açıktır."
 NSB_soviet_foreign_politics_events.286.t:0 "Sincan, Sovyet'in Savaş Kayıplarından Tehdit Altında"
 NSB_soviet_foreign_politics_events.287.a:0 "Bırak gitsinler! İlgilenmemiz gereken daha acil meseleler var."
 NSB_soviet_foreign_politics_events.287.b:0 "Bunun bedelini onlara ödetmeliyiz!"
 NSB_soviet_foreign_politics_events.287.desc:0 "Dün resmi bir açıklamada, [SIK.GetLeader] Sincan'ın [ROOT.GetFactionName]'den ayrıldığını ve tüm [ROOT.GetAdjective] anlaşmalarını derhal yürürlükten kaldırdığını duyurdu. \nKonuşmasına göre, çöküşün eşiğindeki ve doğu ve batıdaki düşmanlarla çevrili bir [ROOT:GetName] ile, Sincan'ın doğudaki Çinli komşuları ve kardeşleriyle bağlarını güçlendirme ve yabancı işgalcilere karşı koyma zamanı geldi."
 NSB_soviet_foreign_politics_events.287.t:0 "[SIK.GetNameDefCap], [ROOT.GetFactionName]'den Ayrılıyor"
 NSB_soviet_foreign_politics_events.30.a:0 "O donmuş çorak araziyi alabilirler."
 NSB_soviet_foreign_politics_events.30.b:0 "Bu gerçekten iyi bir şaka."
 NSB_soviet_foreign_politics_events.30.desc:0 "Birkaç hafta önce, [FROM.GetAdjective] propagandası ve [FROM.GetAdjective] uyumlu medya, Alaska meselesini yeniden masaya yatırmak için açık ve uyumlu bir girişim başlattı. Prensip olarak, 1867'de Alaska'nın satın alınmasının ya hileli olduğunu ya da baskı altında yapıldığını iddia ediyorlar. Ayrıca, hem yerli hem de yerleşimci olan Alaskalıların, [FROM.GetNameDef] vatandaşları olarak açıkça daha iyi durumda olacaklarını beyan ediyorlar.\n\nBugün, [FROM.GetAdjective] büyükelçisi, sözde \"Sürgündeki Alaska Özerk Cumhuriyeti Hükümeti\"nin resmi olarak bir parçası olmayı talep ettiğini belirten resmi bir not sundu. [FROM.GetNameDef] ve [FROM.GetLeader]'nin isteklerini onayladığı. Ona göre geriye kalan tek şey, yetki devrinin ayrıntılarını müzakere etmek."
 NSB_soviet_foreign_politics_events.30.t:0 "[FROM.GetNameDefCap] Alaska'nın Geri Verilmesini Talep Ediyor"
 NSB_soviet_foreign_politics_events.31.a:0 "Çarların bir hatası daha ortadan kaldırıldı."
 NSB_soviet_foreign_politics_events.31.desc:0 "Fort Sitka'daki resmi bir törenle, [FROM.GetNameDef] Alaska üzerindeki egemenliği bize geri devretti. Alaska sakinlerinin çoğu bu devir hakkında karışık duygulara sahip olsa da, yurttaki halk kutlama yapıyor."
 NSB_soviet_foreign_politics_events.31.t:0 "Alaska Geri Verildi"
 NSB_soviet_foreign_politics_events.32.a:0 "Ah, blöf yaptığımızı mı sandılar?"
 NSB_soviet_foreign_politics_events.32.b:0 "İhtiyacımız olan son şey daha fazla donmuş toprak."
 NSB_soviet_foreign_politics_events.32.desc:0 "[FROM.GetAdjective] Dışişleri Bakanı, taleplerimize şahsen cevap verme zahmetine girmedi. Bunun yerine, elçiliğimize Kültürel Gelişimden Sorumlu Müsteşar tarafından imzalanmış bir mektup teslim edildi; mektupta, tam bir tarihi kurgu yazma konusundaki hırsımıza saygı duymakla birlikte, bunu yapmak için resmi kanalları kullanmamamızı takdir edeceklerini belirtiyor."
 NSB_soviet_foreign_politics_events.32.t:0 "[FROM.GetNameDefCap] reddediyor"
 NSB_soviet_great_patriotic_war.01.a:0 "Aramıza hoş geldin Yoldaş!"
 NSB_soviet_great_patriotic_war.01.desc:0 "[?ROOT.SOV_invader_of_ukraine.GetAdjective] Ukrayna işgalinin ardından, Nikolay Kuznetsov vatanını savunmak için NKVD'ye katılmak üzere resmen talepte bulundu. Eşsiz yetenekleriyle, bölgedeki partizan operasyonlarını desteklemek için büyük bir varlık olacaktır."
 NSB_soviet_great_patriotic_war.01.t:0 "Nikolay İvanoviç Kuznetsov Görev İstiyor"
 NSB_soviet_nationalist.001.a:0 "Düşmanımın düşmanı dostumdur"
 NSB_soviet_nationalist.001.b:0 "Burası haklı olarak [ROOT.GetAdjective] toprağıdır!"
 NSB_soviet_nationalist.001.desc:0 "[?SOV.SOV_nationalist_country.GetLeader], bağımsız bir [?SOV.SOV_nationalist_country.GetName] ilan etti. [SOS.GetLeader] bunu bir ihanet eylemi olarak adlandırıyor ve isyancıların yakalanıp vurulmasını emretti. Sonuç olarak, [SOS.GetNameDef] ve [?SOV.SOV_nationalist_country.GetNameDef] şimdi bir savaş durumundadır.[GetFinnishCommittmentInKareliaOrNot]"
 NSB_soviet_nationalist.001.t:0 "[?SOV.SOV_nationalist_country.GetNameDef]'de milliyetçi ayaklanma"
 NSB_soviet_nationalist.002.a:0 "Sovyetler Birliği'ni yendik, onları da yenebiliriz."
 NSB_soviet_nationalist.002.b:0 "Belki de en iyisi budur."
 NSB_soviet_nationalist.002.desc:0 "[FROM.GetAdjective] büyükelçisi, [FROM.GetNameDef]'yi [ROOT.GetName]'nin gerçek ve üstün hükümeti olarak kabul etmemiz yönünde bir \"talep\" ile hükümetimize yaklaştı. Bunun karşılığında da \"belirli derecede özerklik\" sunuyorlar."
 NSB_soviet_nationalist.002.t:0 "[FROM.GetNameDefCap] Boyun Eğme Talep Ediyor"
 NSB_soviet_nationalist.003.a:0 "Rusya için harika bir gün"
 NSB_soviet_nationalist.003.desc:0 "[FROM.GetLeader], haklı taleplerimizi kabul etmemek için hiçbir neden görmedi. [FROM.GetNameDef], bir miktar kendi kendini yönetme hakkıyla İmparatorluğa geri dönecek."
 NSB_soviet_nationalist.003.t:0 "[FROM.GetNameDefCap] Kabul Ediyor"
 NSB_soviet_nationalist.004.a:0 "Onları boyun eğdirmeliyiz!"
 NSB_soviet_nationalist.004.b:0 "Sanırım biraz beklemek zorunda kalacağız"
 NSB_soviet_nationalist.004.desc:0 "Baskıya rağmen ve [FROM.GetLeader.GetHerHis] ülkesinin tehlikeli durumunun tamamen farkında olmasına rağmen, [FROM.GetLeader] yeniden inşa edilen Rus İmparatorluğu içinde cömert özerklik teklifimizi kabul etmeyi reddetti."
 NSB_soviet_nationalist.004.t:0 "[FROM.GetNameDefCap] Reddediyor"
 NSB_soviet_paranoia_system_events.01.a:0 "Endişelerinde gerçekten bir haklılık payı var mı?"
 NSB_soviet_paranoia_system_events.01.desc:0 "Merkez Komitesi'nin son oturumunda, Yoldaş [Root.GetLeader] parti içindeki artan hizipçiliğe dikkat çekti. Komitenin tüm üyeleri ona tam ve koşulsuz desteklerini temin etmekte gecikmese de, bu onun endişelerini pek de gidermemiş gibi görünüyor. Yoldaş [Root.GetLeader]'e göre, devlete karşı komplo kuran sabotajcılara ve yıkıcılara karşı, hangi konumda olurlarsa olsunlar, her zaman uyanık olmalıyız.\n\nBu haber, parti bölünmesi tehdidinin Troçki'nin sürgünüyle sona erdiğine inanan partideki birçok kişi için biraz sürpriz oldu."
 NSB_soviet_paranoia_system_events.01.t:0 "[Root.GetLeader] Hizipçilikten Endişeli"
 NSB_soviet_paranoia_system_events.11.a:0 "Kalbe bu kadar yakın bir tümör merhametsizce kesilip atılmalıdır."
 NSB_soviet_paranoia_system_events.11.b:0 "Birini bu kadar dayanıksız kanıtlarla mahkum edemeyiz!"
 NSB_soviet_paranoia_system_events.11.desc:0 "İsimsiz bir ihbar üzerine hareket eden NKVD, [?ROOT.SOV_purged_character_for_loc.GetName]'i casusluk, sabotaj ve devlete karşı komplo kurma suçlamalarıyla tutukladı. Adam masumiyetini ilan etmeye devam ederken, müfettişler birkaç hafta içinde ona karşı bir dava oluşturabileceklerinden eminler. Ya sorgu altında çökecek ya da etrafındaki suçları hakkında tanıklık etmeye istekli insanlardan yeterli kanıt toplanacak. Her durumda, bu suçlamaların cezası kesinlikle ölüm veya ömür boyu ağır işçilik olmalı."
 NSB_soviet_paranoia_system_events.11.t:0 "Danışman İhanetle Suçlanıyor"
 NSB_soviet_paranoia_system_events.12.a:0 "Bu yolsuzluğun kökü kazınmalı."
 NSB_soviet_paranoia_system_events.12.b:0 "Bu saçma bir aşırı tepki."
 NSB_soviet_paranoia_system_events.12.desc:0 "NKVD, sivil yönetim içinde büyük ölçekli bir komplonun kanıtlarını keşfetti. Görünüşe göre Devlet Planlama Komitesi'ndeki bazı bürokratlar, bazı fabrika müdürleriyle çok samimi olmuş ve beş yıllık plandaki üretim rakamlarını aşağı doğru ayarlamışlar. Bu, NKVD'ye göre, anti-sovyet sabotajının ve sovyet sisteminin kasıtlı olarak zayıflatılmasının açık bir kanıtıdır. \n\n Tutuklanan komplocular, sorgu altında hızla komplonun diğer üyelerini ortaya çıkarıyor."
 NSB_soviet_paranoia_system_events.12.t:0 "Devlet Memurları Arasında Komplo"
 NSB_soviet_paranoia_system_events.13.a:0 "Bu anlatılamaz suçlar ağır bir şekilde cezalandırılmalı."
 NSB_soviet_paranoia_system_events.13.b:0 "Bu suçlamalar açıkça uydurma."
 NSB_soviet_paranoia_system_events.13.desc:0 "Bir grup genç NKVD subayı, mevcut NKVD başkanının 'büyük bir huzursuzluk durumunda' başkentin kontrolünü ele geçirme planları yaptığına dair kanıtlarla [Root.GetLeader]'e başvurdu. Bunun sadece bir hile olduğuna ve bu planların aslında hükûmeti zorla ele geçirmeyi amaçladığına inanıyorlar. \n\nBu kanıtlarla karşı karşıya kaldığında, NKVD başkanı başlangıçta bunların yıllardır var olan ve sadece son zamanlarda güncellenen rutin planlar olduğunu açıklamaya çalıştı. Ancak daha fazla soruşturma ve kapsamlı sorgulamanın ardından, NKVD içinde, hükûmeti devirmek için yabancı ajanslarla komplo kuran geniş bir yabancı ajanlar ağının varlığını ortaya çıkardı."
 NSB_soviet_paranoia_system_events.13.t:0 "NKVD'de Sadakatsizlik mi?"
 NSB_soviet_paranoia_system_events.19.a:0 "Adalete teslim edilen bir başka hain grubu."
 NSB_soviet_paranoia_system_events.19.b:0 "Devrimin kendi çocuklarını yemesine izin verilmemeli."
 NSB_soviet_paranoia_system_events.19.desc_1:0 "1934'te Yoldaş Kirov'un öldürülmesiyle ilgili soruşturma, Zinoviev ve Troçki arasında bir komploya işaret eden birçok ipucu ortaya çıkardı. Bir dizi tutuklama ve sorgulamanın ardından, kanıtlar daha da somutlaştı. \n\n[Root.GetLeader] ile bir toplantıdan sonra, Zinoviev ve Kamenev nihayet hükûmeti devirmek, Sovyet liderlerine suikast düzenlemek ve nihayetinde Sovyetler Birliği'nde kapitalizmi restore etmek için Troçki ile birlikte çalıştıklarını itiraf ettiler. Şimdi 14 suç ortağıyla birlikte yargılanıyorlar. Onlara yönelik suçlamalar ağır - bir mahkumiyet kesin ölüm anlamına gelecektir."
 NSB_soviet_paranoia_system_events.19.desc_2:0 "İlk Troçkist ve terörist grubunun yargılanmasının ardından, NKVD tarafından yapılan soruşturmalar devam etti ve daha fazla kanıt ortaya çıkardı. Karl Radek tutuklandı ve sonunda sorgu altında çözüldü. Hükûmetin hemen hemen her alanında, ordu da dahil olmak üzere, tamamen veya kısmen Troçki ile çalışan geniş bir insan ağının varlığını ortaya çıkardı. Elebaşları zaten tutuklandı ve sorgu altında itiraf etti.\n\nŞimdi Radek de dahil olmak üzere bu elebaşları yargılanıyor. Suçları son duruşmada suçlananlardan daha az - ancak ölüm cezası kesinlikle bir olasılık."
 NSB_soviet_paranoia_system_events.19.desc_3:0 "İkinci Moskova Duruşması'ndan önceki soruşturmalar, Buharin liderliğindeki ordu ve üst parti liderliğinde geniş bir Troçkist ağı da ortaya çıkardı. Bu insanlar tutuklandı ve sorgulandı, burada planlı sabotajdan suikast girişimine, yabancı güçlerle komplo kurmaya ve hatta sıradan Sovyet vatandaşlarını yaralamak veya öldürmek için tereyağına çivi karıştırmaya kadar en ciddi ve iğrenç suçları itiraf ettiler.\n\nMahkum edilirlerse, bu suçların cezası neredeyse kesinlikle kurşuna dizilerek ölüm olacaktır."
 NSB_soviet_paranoia_system_events.19.desc_4:0 "NKVD ajanları, partimizin birkaç üyesini içeren rahatsız edici yeni bir komplo ortaya çıkardı. Daha da endişe verici olanı, birkaç tutuklama ve kapsamlı sorgulamadan sonra, birkaç eski Bolşevik'in isimlerinin ortaya çıkmasıdır. Daha fazla soruşturma, bu iddia edilen komplocuların birçoğunun gerçekten de sabotaj, hizipçilik ve anti-sovyet davranış eylemlerine karıştığına dair kanıtlar ortaya çıkardı. Bu adamlar yargılandı ve şimdi kararı bekliyorlar. Onlara yönelik suçlamalara bakılırsa, mahkumiyet şüphesiz çok ağır bir ceza anlamına gelecektir."
 NSB_soviet_paranoia_system_events.19.t:0 "[GetMoscowTrialPurgeName]"
 NSB_soviet_paranoia_system_events.21.a:0 "Ordu'da böyle adamlara yer yok."
 NSB_soviet_paranoia_system_events.21.b:0 "Açıkçası soruşturmada aşırı bir gayret vardı."
 NSB_soviet_paranoia_system_events.21.desc:0 "Ordudaki Troçkistlere yönelik soruşturmaların bir parçası olarak, NKVD, General [?ROOT.SOV_purged_character_for_loc.GetName]'in geçmişte Yoldaş [Root.GetLeader]'e yönelik birkaç eleştirel yorumda bulunduğuna ve Lev Troçki'nin iç savaş sırasında devrime yaptığı büyük katkılara işaret ettiğine dair kanıtlar ortaya çıkardı. Sorgu sırasında, [?ROOT.SOV_purged_character_for_loc.GetName] başlangıçta [ROOT.GetLeader]'e olan hayranlığını ve sadakatini beyan etti, ancak sonunda çözüldü ve Troçkist ajanlar tarafından Kızıl Ordu'ya karşı sabotaj eylemleri gerçekleştirecek karşı-devrimci bir hücre oluşturmak için temasa geçildiğini ortaya çıkardı."
 NSB_soviet_paranoia_system_events.21.t:0 "General [?ROOT.SOV_purged_character_for_loc.GetName] İhanetle Suçlanıyor"
 NSB_soviet_paranoia_system_events.22.a:0 "Tüm gelecekteki liderlerin sadakatini sağlamalıyız."
 NSB_soviet_paranoia_system_events.22.b:0 "Akademi soru sormak için bir yerdir ve bunu engellememeliyiz."
 NSB_soviet_paranoia_system_events.22.desc:0 "İsimsiz bir muhbir, en prestijli askeri akademilerimizden birinde bir grup öğrencinin varlığını ortaya çıkardı. Bu grup, görünüşe göre, onaylanmış ders çalışmalarından daha fazlasını incelemeye karar vermiş ve gözden düşmüş ve gerici teorisyenlerin fikirlerini tartışmış. Bu insanların yazılarını nereden buldukları henüz belli değil, ancak elebaşlarının kapsamlı bir şekilde soruşturulması ve sorgulanması şüphesiz hızla isimler üretecektir."
 NSB_soviet_paranoia_system_events.22.t:0 "Akademide Komplo"
 NSB_soviet_paranoia_system_events.23.a:0 "Failleri yakalamak için tam bir soruşturma başlatmalıyız!"
 NSB_soviet_paranoia_system_events.23.b:0 "Bunlar modern bir orduda sık görülen olaylardır."
 NSB_soviet_paranoia_system_events.23.desc:0 "Son büyük tatbikatlardan gelen raporlar, mekanik arızalar nedeniyle önemli bir oranda aracın devre dışı kaldığını ve acemi erlerin yaralandığını göstermiştir. Bu raporlar Yoldaş [Root.GetLeader]'in masasına ulaştı, kendisi silahlı kuvvetler üyeleri tarafından sabotaj olasılığı konusunda büyük endişe duymaktadır. Bu yeni tankların sahada sadece birkaç gün sonra bakım olmadan nasıl mekanik kusurlar yaşayabildiğini öğrenmek istiyor."
 NSB_soviet_paranoia_system_events.23.t:0 "Anti-Sabotajcı Kampanyası"
 NSB_soviet_paranoia_system_events.24.a:0 "[?ROOT.SOV_accused_character_for_loc.GetName] adaletle yüzleşmeli."
 NSB_soviet_paranoia_system_events.24.b:0 "Bu, [?ROOT.SOV_accuser_character_for_loc.GetName]'in kendi derisini kurtarmak için şeffaf bir hilesidir."
 NSB_soviet_paranoia_system_events.24.c:0 "Soruşturmayı bir karara varmadan sonlandır."
 NSB_soviet_paranoia_system_events.24.desc:0 "Ordu yüksek komutanlığına bir rapor ulaştı. O raporda, [?ROOT.SOV_accuser_character_for_loc.GetName], meslektaşı General [?ROOT.SOV_accused_character_for_loc.GetName]'in çok ağır görev ihmalleri olduğunu iddia ediyor. [?ROOT.SOV_accuser_character_for_loc.GetName]'e göre, [?ROOT.SOV_accused_character_for_loc.GetName] yabancı istihbarata bilgi sızdırmak için yabancı ve gerici unsurlarla komplo kurdu. Ayrıca [?ROOT.SOV_accused_character_for_loc.GetName]'in komutası altında meydana gelen çok sayıda eğitim kazasına dikkat çekiyor ve bunların aslında aldatıcı general ve Ordu'daki suç ortakları tarafından yapılan sabotaj eylemleri olduğunu iddia ediyor. Söz konusu suç ortakları, kapsamlı sorgulamadan sonra iddiaları doğrulamıştır."
 NSB_soviet_paranoia_system_events.24.t:0 "[?ROOT.SOV_accuser_character_for_loc.GetName], [?ROOT.SOV_accused_character_for_loc.GetName]'i Suçluyor"
 NSB_soviet_paranoia_system_events.24_paranoia_accused_decrease_tt:0 "£SOV_paranoia_text_icon Siyasi Paranoya, tasfiye edilen birlik liderinin seviyesine göre azalır: §G[?SOV.SOV_accused_unit_leader_level]§!"
 NSB_soviet_paranoia_system_events.24_paranoia_accused_increase_tt:0 "£SOV_paranoia_text_icon Siyasi Paranoya, tasfiye edilen birlik liderinin seviyesine göre artar: §R[?SOV.SOV_accused_unit_leader_level]§!"
 NSB_soviet_paranoia_system_events.24_paranoia_both_decrease_tt:0 "£SOV_paranoia_text_icon Siyasi Paranoya, tasfiye edilen birlik liderlerinin seviyesine göre azalır: §G[?SOV.SOV_combined_unit_leader_level]§!"
 NSB_soviet_paranoia_system_events.24_paranoia_both_increase_tt:0 "£SOV_paranoia_text_icon Siyasi Paranoya, tasfiye edilmeyen birlik liderlerinin seviyesine göre artar: §R[?SOV.SOV_combined_unit_leader_level]§!"
 NSB_soviet_paranoia_system_events.28.a:0 "Çürümenin başlamasına izin veremeyiz."
 NSB_soviet_paranoia_system_events.28.b:0 "Bu suçlamalar küçük meselelerin büyük abartılarıdır."
 NSB_soviet_paranoia_system_events.28.desc:0 "Raporlar, [Root.GetLeader]'in askeri meseleleri ele alışını derinden eleştiren geniş bir subay ağının varlığına işaret ediyor. Ayaklanma, sabotaj ve anti-sovyet düşünce suçlamalarıyla tutuklananlar, sorgu sırasında ağdaki diğerlerinin isimlerini hızla açıklıyorlar. Generallerin sadakati konusunda uzun zamandır şüpheler olsa da, bu, belki de Binbaşıların ve Albayların bile güvenilmez olduğunu ortaya koyuyor."
 NSB_soviet_paranoia_system_events.28.t:0 "Ordu Genç Subaylarının Büyük Tasfiyesi"
 NSB_soviet_paranoia_system_events.29.a:0 "Tüm hainler en ağır bedeli ödemeli."
 NSB_soviet_paranoia_system_events.29.b:0 "Bu anlamsız bir katliam!"
 NSB_soviet_paranoia_system_events.29.desc:0 "Ordu içinde büyük bir Troçkist ağı olduğuna dair kanıtlar hızla artıyor. Her gün, NKVD önceki itiraflarda adı geçen yeni şüphelileri tutukluyor. Bu insanlar da genellikle diğer suç ortaklarının isimlerini veriyor. Bu komplonun bir parçası olan tüm Generalleri bulmak zaman alacak, ancak aşağıdaki listenin bunun önemli bir bölümünü temsil ettiği ve suçluluklarının itiraflarıyla kanıtlandığı açıktır."
 NSB_soviet_paranoia_system_events.29.t:0 "Büyük Temizlik - Generallerin Yargılanması"
 NSB_soviet_paranoia_system_events.30.t:0 "Donanma Düzenli Tasfiyesi"
 NSB_soviet_paranoia_system_events.31.a:0 "Donanma'da böyle adamlara yer yok."
 NSB_soviet_paranoia_system_events.31.desc:0 "Amiral [?ROOT.SOV_purged_character_for_loc.GetName]'in personelinden bir subay, bir dizi şüpheli faaliyeti bildirmek için NKVD ile temasa geçti. Subaya göre, [?ROOT.SOV_purged_character_for_loc.GetName] son bir yurtdışı liman ziyareti sırasında donanma subayları tarafından çok sıcak karşılandı ve bu fırsatı onlara gizli bilgi sızdırmak için kullanmış olabilir. Ayrıca, Amiral'in ziyaret ettiği birkaç limanda Troçkist hücrelerin kanıtları bulunmuştur, bu da isteseydi devlete karşı Troçki ile komplo kurmasına olanak tanırdı."
 NSB_soviet_paranoia_system_events.31.t:0 "Amiral [?ROOT.SOV_purged_character_for_loc.GetName] İhanetle Suçlanıyor"
 NSB_soviet_paranoia_system_events.33.desc:0 "Çeşitli deniz üslerinden, bazı gemilerimizin acil onarımları için talep edilen yedek parça miktarında hafif bir artış olduğunu belirten raporlar geldi. Raporlar bu hasarların normal aşınma ve yıpranmanın yanı sıra eğitim tatbikatlarında meydana geldiğini iddia etse de, NKVD o kadar emin değil. [Root.GetLeader] konuyla kişisel olarak ilgilendi ve herhangi bir sabotaj iddiasının kapsamlı bir şekilde araştırılmasını istiyor."
 NSB_soviet_paranoia_system_events.38.desc:0 "Siyasi subaylardan filodaki olağandışı faaliyetler hakkında gelen raporların ardından, NKVD tam bir soruşturma başlattı ve Sovyet sistemine derinden eleştirel, hatta düşmanca olan geniş bir subay ağının kanıtlarını buldu. Çoğu [Root.GetLeader]'e ve Sovyetler Birliği'ne sadakatlerini beyan etse de, yabancı ajanslar tarafından kolayca casusa dönüştürülebilecekleri açıktır. Gerçekten de, sorgulama, birçoğunun zaten bize karşı casusluk yapmak için kapitalist devletlerin hizmetinde olduğunu ortaya çıkardı ve hızla daha fazla isim veriyorlar."
 NSB_soviet_paranoia_system_events.38.t:0 "Donanma Genç Subaylarının Büyük Tasfiyesi"
 NSB_soviet_paranoia_system_events.39.desc:0 "Ordu içindeki Troçkist merkeze yönelik soruşturma, özellikle Donanma'da iyi bir şekilde yerleştiğini açıkça göstermiştir. Donanma'daki Amirallerin tamamı olmasa da çoğu, yurtdışında görevliyken yabancı unsurlarla komplo kurma fırsatına sahip oldukları için derin bir şüphe altındadır. Şimdiye kadar, NKVD tarafından tutuklanan her üst rütbeli Amiral, sadece birkaç günlük sorgulamadan sonra casusluk ve sabotaj da dahil olmak üzere çok ağır suçları itiraf etti. Bu komploya giderek daha fazla Donanma subayının karıştığı göz önüne alındığında, kökünü kazımanın çok kapsamlı bir soruşturma gerektireceği açıktır."
 NSB_soviet_paranoia_system_events.39.t:0 "Büyük Temizlik - Amirallerin Yargılanması"
 NSB_soviet_paranoia_system_events.42.desc:0 "Hava Kuvvetleri'nde yapılan son bir teftiş, eğitim sırasında şok edici bir dizi kaza ve kaza ortaya çıkardı. Bunun ötesinde, en modern uçaklarımızın büyük bir kısmı tam olarak görev yapamaz durumda ve bakım bekliyor. Bu durumun nasıl olduğu belirsiz, ancak sabotajdan endişe duyan [Root.GetLeader], tam bir soruşturma talep etti."
 NSB_soviet_paranoia_system_events.48.a:0 "Yıkıcı unsurların bu şekilde toplanmasına izin veremeyiz."
 NSB_soviet_paranoia_system_events.48.b:0 "Onların işi çok önemli."
 NSB_soviet_paranoia_system_events.48.desc:0 "NKVD, tasarım bürolarımızdan birinin liderliğindeki üyelerin yabancı ajanslara bilgi sızdırdığına dair kanıtlar ortaya çıkardı. Ayrıca, son tasarım çalışmaları o kadar kusurlarla doluydu ki, bir prototipin uçabilmesi için kapsamlı bir yeniden çalışma ve yineleme gerektirdi, bu da bunun bir sabotaj eylemi olduğu spekülasyonlarına yol açtı. NKVD şu anda tasarımcıları ve mühendisleri sorguluyor ve baş müfettiş birkaç gün içinde itiraflar alacağından emin."
 NSB_soviet_paranoia_system_events.48.t:0 "Tasarım Bürosunu Dağıt"
 NSB_soviet_paranoia_system_events.49.a:0 "Hesap vermeliler."
 NSB_soviet_paranoia_system_events.49.b:0 "Sadece işlerini yapıyorlardı."
 NSB_soviet_paranoia_system_events.49.desc:0 "Hava Kuvvetleri üzerindeki artan denetim sonuç verdi. NKVD müfettişleri, kötü hava koşullarında tekrarlanan eğitim seferleri emreden ve öngörülebilir kazalara ve Hava Kuvvetleri'nin genel hazır olma durumunu azaltan artan bakıma yol açan üst düzey Generallere işaret eden bir dizi genç subaydan itiraflar almayı başardı. Bunu neden yaptıkları henüz belli değil, ancak NKVD müfettişleri birkaç gün içinde cevapları alacaklarına inanıyor."
 NSB_soviet_paranoia_system_events.49.t:0 "Hava Kuvvetleri Generalleri Suçlanıyor"
 NSB_soviet_permanent_revolution.1.a:0 "Bu temel olarak bir saldırganlık eylemidir"
 NSB_soviet_permanent_revolution.1.desc:0 "[FROM.GetNameDef]'den Troçkistler, devrimci propagandayla kitleleri kışkırtıyor. Hatta devlete karşı ayaklanırlarsa [ROOT.GetAdjective] proletaryasının yardımına koşacaklarına dair sözler bile veriyorlar. Durum kontrolden çıkma tehlikesiyle karşı karşıya."
 NSB_soviet_permanent_revolution.1.t:0 "Troçkist Devrimciler Kitleleri Kışkırtıyor"
 NSB_soviet_planned_economy.1.a:0 "Buna uymalıyız"
 NSB_soviet_planned_economy.1.desc:0 "[SOV.GetLeader] ortak, planlı bir ekonomi için yeni şemayı sundu. \nKusursuz olmasa da, [FROM.GetAdjective] hükûmeti NEP'in de bir dizi başarıya sahip olduğuna inanıyor ve [FROM.GetNameDef] ile ortakları arasında daha fazla birbirine bağımlı bir ekonomi yaratan ve tam bir Sosyalist topluma giden yolu açan planlı bir ekonomi modeli kurmaya kararlı."
 NSB_soviet_planned_economy.1.t:0 "Planlı Ekonomi için [SOV.GetAdjective] Programı"
 NSB_soviet_policies_of_collective_security.1.a:0 "Orijinal şartları kabul edeceğiz."
 NSB_soviet_policies_of_collective_security.1.b:0 "Polonya ile temas kurmalıyız."
 NSB_soviet_policies_of_collective_security.1.c:0 "Bu bizim çıkarımıza değil."
 NSB_soviet_policies_of_collective_security.1.desc:0 "Her iki ulusumuzun da karşı karşıya olduğu tehditleri belirten [FROM.GetAdjective] hükûmeti, bir karşılıklı yardım paktı önerdi. Şartlara göre, birbirimize karşı düşmanca eylemlerde bulunmayacağız.\n\nÖnemli bir sorun, [POL.GetNonIdeologyName]'in uluslarımız arasında yer almasıdır. Her iki tarafın da diğerinin yardımına koşma girişimi zorunlu olarak Polonya üzerinden gelmek zorunda kalacaktır. Diplomatik servisin bazı üyeleri, birbirimizi doğrudan destekleyebilmemiz için Polonya'yı bu pakta dahil etmemiz gerektiğine şiddetle inanıyor."
 NSB_soviet_policies_of_collective_security.1.t:0 "[FROM.GetNameDefCap] Karşılıklı Yardım Paktı Teklif Ediyor"
 NSB_soviet_policies_of_collective_security.10.a:0 "En azından teklifi aldılar."
 NSB_soviet_policies_of_collective_security.10.desc:0 "Beklenmedik bir olaylar zincirinde, [POL.GetLeader] hükûmeti önerilen Pakta katılmayı reddetti. Verilen resmi neden inandırıcı tehditlerin olmaması olsa da, özel olarak, [POL.GetAdjective] hükûmeti Sovyetlerin Polonya'yı savunmak için Polonya'ya girmeye hevesli olabileceğini - ancak daha sonra ayrılmakta isteksiz olacaklarını belirtti."
 NSB_soviet_policies_of_collective_security.10.t:0 "[FROM.GetNameDefCap] Paktı Reddediyor"
 NSB_soviet_policies_of_collective_security.11.a:0 "Ne kadar zaman kaybı."
 NSB_soviet_policies_of_collective_security.11.desc:0 "[POL.GetAdjective] hükûmeti, kendilerine karşı inandırıcı tehditlerin olmamasını ve ittifaklara karışmak istememelerini gerekçe göstererek Karşılıklı Yardım Paktı'na katılmayı reddetti.\n\nDiplomatik çevrelerde bunun sadece yüz kurtarma önlemi olduğu ve asıl nedenin bize güvenmemeleri olduğu söylentileri dolaşıyor."
 NSB_soviet_policies_of_collective_security.11.t:0 "[POL.GetNameDefCap] Karşılıklı Yardım Paktımıza Katılmayı Reddediyor"
 NSB_soviet_policies_of_collective_security.12.a:0 "Bu, ittifakı daha da güçlendirecek."
 NSB_soviet_policies_of_collective_security.12.desc:0 "[FROM.GetAdjective] hükûmeti prensipte Pakta katılmayı kabul etti. Hala üzerinde çalışılması gereken bazı ayrıntılar olsa da, bunlar anlaşmanın onaylanmasını engellemeyecektir."
 NSB_soviet_policies_of_collective_security.12.t:0 "[FROM.GetNameDefCap] Karşılıklı Yardım Paktımıza Katılmayı Kabul Ediyor"
 NSB_soviet_policies_of_collective_security.13.a:0 "Şimdi, mürekkebi kağıda dökelim!"
 NSB_soviet_policies_of_collective_security.13.desc:0 "[POL.GetNonIdeologyName] meselesi çözüldüğüne göre, [FROM.GetAdjective] hükûmeti başlangıçta anlaşılan şartlar altında anlaşmayı resmi olarak onaylamaya devam etmeye isteklidir."
 NSB_soviet_policies_of_collective_security.2.a:0 "Birlikte duruyoruz."
 NSB_soviet_policies_of_collective_security.2.desc:0 "[FROM.GetNameDef] hükûmeti, önerdiğimiz Karşılıklı Yardım Paktı'nı prensipte kabul etti. Uygulamanın daha ince ayrıntılarına karar vermek için bir diplomat heyeti geldi."
 NSB_soviet_policies_of_collective_security.2.t:0 "[FROM.GetNameDefCap] Paktı İmzalamayı Kabul Ediyor"
 NSB_soviet_policies_of_collective_security.3.a:0 "Çok basiretsiz bir karar."
 NSB_soviet_policies_of_collective_security.3.desc:0 "Birkaç uzun gece süren gergin müzakerelerin ardından, [FROM.GetAdjective] heyeti bir anlaşma imzalanmadan ayrıldı. Diplomatik servisin bazı üyeleri hala paktın kurtarılabileceği umudunu taşısa da, [FROM.GetAdjective] hükûmetinin konuyu kapattığı anlaşılıyor."
 NSB_soviet_policies_of_collective_security.3.t:0 "[FROM.GetNameDefCap] Teklifimizi Reddediyor"
 NSB_soviet_policies_of_collective_security.4.a:0 "Haklılar."
 NSB_soviet_policies_of_collective_security.4.b:0 "Teklif bir nedenle sadece aramızdaydı."
 NSB_soviet_policies_of_collective_security.4.desc:0 "Karşılıklı yardım paktına temel olarak açık olsa da, [FROM.GetAdjective] hükûmetinin Polonya'nın konumuyla ilgili bazı endişeleri var. [FROM.GetAdjective] hükûmetinin pozisyonu, Polonya'nın pakta dahil edilmesi gerektiği yönünde görünüyor. \n\nBu, [FROM.GetAdjective] heyetinin taviz vermeyeceği bir konudur ve bizden [POL.GetNonIdeologyName]'i resmen pakta davet etmemizi istediler."
 NSB_soviet_policies_of_collective_security.4.t:0 "[FROM.GetNameDefCap], [POL.GetAdjective]'in Pakta Dahil Edilmesini Zorluyor"
 NSB_soviet_policies_of_collective_security.5.a:0 "Bu anlaşmayı batırmamalı."
 NSB_soviet_policies_of_collective_security.5.b:0 "O zaman anlaşma biter."
 NSB_soviet_policies_of_collective_security.5.desc:0 "[FROM.GetAdjective] heyetini, [POL.GetNonIdeologyName]'nin Pakt'a dahil edilmesinin gerekliliği konusunda ikna etme girişimlerimiz çok az sonuç vermiş gibi görünüyor. \n\nAOnlara göre, [POL.GetNonIdeologyName] meselesinin mevcut anlaşmayla alakası yok ve konuyu daha fazla tartışmayı açıkça reddettiler. Şimdi müzakereleri burada mı bitireceğimize yoksa \"küçük\" anlaşma çözümüyle devam mı edeceğimize karar vermemiz gerekiyor."
 NSB_soviet_policies_of_collective_security.5.t:0 "[FROM.GetNameDefCap], [POL.GetNameDef]'i Pakta Dahil Etmeyi Reddediyor"
 NSB_soviet_policies_of_collective_security.6.a:0 "Şimdi, gidip Lehlerle konuşalım."
 NSB_soviet_policies_of_collective_security.6.desc:0 "Ek bir müzakere turunun ardından, [FROM.GetAdjective] heyeti [POL.GetNonIdeologyName]'i pakta dahil etmeyi kabul etti. Ayrıntılar üzerinde çalışılır çalışılmaz, [POL.GetAdjective] hükûmetine bizimle aynı şartlar altında Pakta katılmalarını teklif eden bir mesaj göndereceğiz."
 NSB_soviet_policies_of_collective_security.6.t:0 "[FROM.GetNameDefCap], [POL.GetNameDef]'i Pakta Dahil Etmeyi Kabul Ediyor"
 NSB_soviet_policies_of_collective_security.7.a:0 "Bunun üçüncü tarafı olmaktan mutluluk duyarız."
 NSB_soviet_policies_of_collective_security.7.b:0 "Sovyetlere güvenemeyeceklerini bilmiyorlar mı?"
 NSB_soviet_policies_of_collective_security.7.desc:0 "[FROM.GetAdjective] Büyükelçisi, ülkesinin az önce [SOV.GetNameDef] ile bir karşılıklı yardım anlaşması imzaladığını bildirdi. Anlaşma şartlarına göre, hiçbir taraf diğerine saldırmayacak ve savaş zamanlarında diğerini desteklemeye çalışacaktır. \n\nİstersek pakta katılmamıza izin verilmesi şartıyla bu anlaşmayı imzaladıklarını ayrıca belirtti."
 NSB_soviet_policies_of_collective_security.7.t:0 "[SOV.GetAdjective]-[FROM.GetAdjective] Karşılıklı Yardım Paktı"
 NSB_soviet_policies_of_collective_security.8.a:0 "Ne kadar yersiz bir sadakat."
 NSB_soviet_policies_of_collective_security.8.desc:0 "[FROM.GetNameDef] ile bir anlaşma müzakere etme girişimlerimiz başarısızlıkla sonuçlandı. Görünüşe göre [POL.GetNonIdeologyName] meselesi ve pakta dahil edilmesi, üzerinde hiçbir uzlaşma sağlanamayan kritik bir konuydu."
 NSB_soviet_policies_of_collective_security.8.t:0 "[FROM.GetNameDefCap], [POL.GetNameDef]'i Hariç Tutan bir Paktı İmzalamayı Reddediyor"
 NSB_soviet_policies_of_collective_security.9.a:0 "Mantıklı davrandılar."
 NSB_soviet_policies_of_collective_security.9.desc:0 "Daha fazla müzakerenin ardından, [FROM.GetAdjective] hükûmeti Polonya'nın dışlanması konusundaki önceki tereddütlerine rağmen paktı imzalamayı kabul etti. [FROM.GetAdjective] heyetinde hala bazı homurdanmalar olsa da, anlaşmayı onaylamaya devam etmeye istekli görünüyorlar."
 NSB_soviet_policies_of_collective_security.9.t:0 "[FROM.GetNameDefCap] Paktı İmzalamayı Kabul Ediyor"
 NSB_soviet_policies_of_collective_security_agreed_effects_tt:0 "Pakt gerçekleşirse, aşağıdaki koşulları kabul edeceğiz:"
 NSB_soviet_policies_of_collective_security_condition_effects_tt:0 "Hem [FROM.GetAdjective] hem de [POL.GetAdjective] hükûmetleri [POL.GetNameDef]'i Pakta dahil etmeyi kabul ederse, aynı etkiler [POL.GetNameDef]'e de uygulanacaktır."
 NSB_soviet_policies_of_collective_security_poland_included_effects_from_tt:0 "[SOV.GetFlag]§Y[SOV.GetNameDefCap]§!, [ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§! ve [FROM.GetFlag]§Y[FROM.GetNameDefCap]§! birbirlerine karşı her türlü hak iddiasından veya savaş hedefinden vazgeçecek, bir saldırmazlık paktı imzalayacak ve birbirlerini garanti altına alacaklar."
 NSB_soviet_policies_of_collective_security_poland_included_effects_root_tt:0 "[SOV.GetFlag]§Y[SOV.GetNameDefCap]§!, [ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§! ve [POL.GetFlag]§Y[POL.GetNameDefCap]§! birbirlerine karşı herhangi bir hak iddiasından veya savaş hedefinden feragat edecek, bir saldırmazlık paktı imzalayacak ve birbirlerini garanti altına alacaklardır."
 NSB_soviet_policies_of_collective_security_refusing_poland_inclusion_tt:0 "[FROM.GetAdjective]'in [POL.GetNameDef]'i pakta dahil etme teklifini reddedeceğiz. [FROM.GetNameDefCap], orijinal teklifimizi kabul etmekle karşılıklı yardım konusunda bir kolektif anlaşma fikrini terk etmek arasında seçim yapmak zorunda kalacak."
 NSB_soviet_policies_of_collective_security_tt:0 "[POL.GetAdjective] hükûmeti razı olursa, [POL.GetNameDef], [FROM.GetNameDef] ve [ROOT.GetNameDef] ile birlikte karşılıklı yardım konusundaki kolektif anlaşmaya dahil edilecektir."
 NSB_soviet_propaganda_capmaign_events.1.a:0 "Kendi, daha parlak geleceklerini inşa edecekler."
 NSB_soviet_propaganda_capmaign_events.1.desc:0 "[SOV.GetNameDef]'deki dostlarımız ve rehberlerimiz, şimdi büyüyen neslin onlardan ne beklendiğini tam olarak anlamasını sağlamak için bir program başlattı. İyi bir komünist, daha iyi bir dünya inşa etmek için gereken işi yapmak için hem fiziksel olarak güçlü olmalı, hem de ne yapılması gerektiğini tam olarak anlamak için iyi eğitimli olmalıdır. \n\nUlusumuzdaki coşkulu gençler bunu benimsedi ve şimdi bu yaklaşımı mümkün olduğunca taklit etmeye çalışıyorlar."
 NSB_soviet_propaganda_capmaign_events.1.t:0 "Komünizmin Genç İnşaatçıları"
 NSB_soviet_propaganda_capmaign_events.2.a:0 "Zamanlama çok talihsiz."
 NSB_soviet_propaganda_capmaign_events.2.desc:0 "Devam eden güvenliğimizi sağlamak için proaktif bir adım atma kararımız, son zamanlarda yaptığımız bazı açıklamalarla ilgili olarak bizi zor bir duruma soktu. Çoğu insan durumu çok açık bir şekilde sorgulamasa da, gizli polisimiz birçok kişinin özel olarak neden açıkça savaşa hazırlanırken barış vaat ettiğimizi sorduğunu bildiriyor. \n\nYaptığımız şeye kimse yalan demeye cesaret edemiyor, ancak genel halktan çok fazla güven kaybettiğimiz açık."
 NSB_soviet_propaganda_capmaign_events.2.t:0 "Barış Vaadi Bozuldu"
 NSB_soviet_propaganda_capmaign_events.3.a:0 "Ama biz bu savaşı hiç istemedik!"
 NSB_soviet_propaganda_capmaign_events.3.desc:0 "Savaşın patlak vermesi kamuoyu nezdindeki konumumuzu biraz zor duruma soktu. Çoğu kişi mağdur tarafın biz olduğumuz ve halkın öfkesinin haklı olarak işgalcilere odaklandığı konusunda hemfikir olsa da, pek çok kişi özel olarak [THIS.GetLeader]'nin neden bu saldırıyı öngöremediğini merak ediyor. Gizli polisimiz, birkaç vakada insanların bir adım daha ileri giderek [THIS.GetLeader]'yi \"tehlikeli derecede saf ya da suç açısından beceriksiz\" olarak adlandırdığını bildirdi."
 NSB_soviet_soviet_german_trade_agreement.1.a:0 "Hammaddelere ihtiyacımız var"
 NSB_soviet_soviet_german_trade_agreement.1.b:0 "Donanma sırlarımızı onlarla paylaşmayacağız!"
 NSB_soviet_soviet_german_trade_agreement.1.desc:0 "[FROM.GetAdjective] büyükelçisi, ülkelerimiz arasında bir ticaret anlaşması önererek diplomatlarımızla temasa geçti. Teklife göre, [FROM.GetNameDef] bize tahıl, pamuk, petrol, metal cevherleri ve kauçuk gibi hammaddeler gönderecek. Karşılığında, [FROM.GetAdjective]ler eksik bir Hipper Sınıfı kruvazör, diğer askeri gemiler için planlar, ağır donanma topları ve [ROOT.GetAdjective] uçak örnekleri alacak. \nBu anlaşma şüphesiz Avrupa'daki düşman uluslara karşı savaş çabamızda bize yardımcı olacak ve [GetTradeAgreementBlockadeWarPeace] ablukasından kaçınmanın yollarını bulmamızı sağlayacak."
 NSB_soviet_soviet_german_trade_agreement.1.desc_peace:0 "potansiyel bir düşman"
 NSB_soviet_soviet_german_trade_agreement.1.desc_war:0 "düşman"
 NSB_soviet_soviet_german_trade_agreement.1.desc_war_eng:0 "[ENG.GetAdjective]"
 NSB_soviet_soviet_german_trade_agreement.1.t:0 "Sovyet-Alman Ticaret Anlaşması"
 NSB_soviet_soviet_german_trade_agreement.2.a:0 "Kızıl Filo bundan faydalanacak."
 NSB_soviet_soviet_german_trade_agreement.2.desc:0 "[FROM.GetAdjective] diplomatları, teklifimizi kabul ettiklerini bildirdi. Ülkelerimiz, [ROOT.GetNameDef]'in [FROM.GetNameDef]'e tahıl, pamuk, petrol, metal cevherleri ve kauçuk gibi hammaddeler göndereceği bir ticaret paktına girdi. Karşılığında, eksik bir Hipper sınıfı kruvazör, diğer askeri gemiler için planlar, ağır donanma topları ve [FROM.GetAdjective] uçak örnekleri alacağız. \nBu anlaşma kesinlikle modern askeri teknolojinin geliştirilmesinde bize yardımcı olacaktır."
 NSB_soviet_soviet_german_trade_agreement.2.t:0 "[GER.GetNameDefCap], $NSB_soviet_soviet_german_trade_agreement.1.t$'nı imzaladı"
 NSB_soviet_soviet_german_trade_agreement.3.a:0 "İnatçı aptallar!"
 NSB_soviet_soviet_german_trade_agreement.3.desc:0 "Elçimizin [FROM.GetAdjective] yetkililerini ülkelerimiz arasında bir ticaret paktının karşılıklı faydaları konusunda ikna etme yönündeki birkaç girişiminden sonra, [FROM.GetAdjective] diplomatları az önce [ROOT.GetNameDef] ile bir ticaret anlaşması kurmakla ilgilenmediklerini bildirdiler."
 NSB_soviet_soviet_german_trade_agreement.3.t:0 "[GER.GetNameDefCap], $NSB_soviet_soviet_german_trade_agreement.1.t$'nı reddediyor"
 NSB_soviet_spanish_civil_war.1.a:0 "Tüm İspanyol mültecilere hoş geldiniz diyoruz."
 NSB_soviet_spanish_civil_war.1.desc:0 "Dün Kronstadt'a, iç savaşta hükûmetlerinin yakın düşüşü nedeniyle ülkeden kaçan İspanyol mültecilerle dolu bir gemi geldi. [ROOT.Capital.GetName]'dan gelen heyetimiz tarafından karşılandılar; heyet, çoğunlukla çocuklardan oluşan ama aynı zamanda birkaç İspanyol politikacı ve askerden de oluşan grupla ilgilendi. \nAralarında, temsilcilerimizin bir görüşme yaptığı büyük Komünist savaşçı [?SOV.SOV_spanish_general.GetName] de vardı. Eski İspanyol ordu subayı, İspanyolların yaralarını sarmak ve İspanyol halkını özgürleştirme görevleri için dayanışma bulmak üzere [ROOT.GetNameDef]'e geldiklerini belirtti ve [ROOT.GetAdjective] hükûmetinden askeri rütbesini tanımasını ve faşizm ve emperyalizme karşı mücadeleye devam edebilmesi için onu hizmete geri döndürmesini istedi."
 NSB_soviet_spanish_civil_war.1.t:0 "[?SOV.SOV_spanish_general.GetName], [ROOT.GetNameDef]'e Katılıyor"
 NSB_soviet_spanish_civil_war.2.a:0 "Bu küresel devrimin başlangıcıdır!"
 NSB_soviet_spanish_civil_war.2.desc:0 "Sovyetler Birliği'nden gelen sempatizanlar, devrimi terk etmeden savaşı kazanma davamızı destekleyen yüzlerce uluslararası tugay üyesinin seferberliğini ve eğitimini organize ediyor. Uluslararası proletaryanın ve köylülüğün bu cesur üyeleri, faşizme ve burjuvaziye karşı savaşta hayatlarını vermeye hazırlar."
 NSB_soviet_spanish_civil_war.2.t:0 "Uluslararası Marksist Tugaylar [ROOT.capital.GetName]'a Varır"
 NSB_soviet_spanish_civil_war.3.a:0 "Onları iyi kullanacağız."
 NSB_soviet_spanish_civil_war.3.desc:0 "Sovyet anti-Stalinist komandoları, davamıza sempati duyan bir dizi yüksek eğitimli ajan ve operatörle birlikte gizlice Barselona'ya geldi. Sovyetler Birliği'ndeki bağlantılarımıza göre, bu takviyeler düşman hatlarını kırmak veya düşman saldırılarını durdurmak için elit tugaylar oluşturmamızı ve aynı zamanda yetenekli ajanları ve subayları komuta zincirimize dahil etmemizi sağlayacaktır."
 NSB_soviet_spanish_civil_war.3.t:0 "Sovyet Komandoları [ROOT.capital.GetName]'a Varır"
 NSB_soviet_spanish_civil_war.4.a:0 "Birleşirsek, galip geleceğiz!"
 NSB_soviet_spanish_civil_war.4.desc:0 "Sovyetler Birliği'ndeki sağ kanat muhalefet hareketinin karizmatik üyeleri, POUM, CNT ve FAI'den yerel hatiplerle birlikte, [ROOT.GetNameDef]'in proleter ve köylü kitlelerinin devrimci ruhunu ateşlemek için bir bilgilendirme ve ajitasyon kampanyası yürüttüler. Sayısız yerde yapılan ateşli konuşmalarla, kitleler güçlü bir sınıf bilinci geliştirdi ve şimdi davaya her zamankinden daha fazla bağlılar."
 NSB_soviet_spanish_civil_war.4.t:0 "Sovyet Destekli Halk Konuşmaları"
 NSB_soviet_spanish_civil_war.5.a:0 "Son darbeyi vurma zamanı geldi!"
 NSB_soviet_spanish_civil_war.5.desc:0 "Yakın zamanda burjuva cumhuriyetçi hükûmetine yardım etmek için yeni bir grup Sovyet askeri ataşesi ve danışmanı İspanya'ya geldi. \nBu grubun arasında, [FROM.GetLeader] tarafından gönderilen askeri danışmanların yardımcıları olarak sızdırılmış birkaç Sovyet anti-Stalinist ajan var. \nBu ajanlar, şu anda burjuva cumhuriyetçi tarafındaki birimlerde savaşan POUM sempatizanı çok sayıda yetkili, asker, uluslararası Tugaycı ve milis ile temas kurdu ve onları saflarına kattı, düşman komuta zinciri tarafından planlanan hareketler hakkında ilk elden bilgi edinmemizi sağlayan etkileyici bir muhbir ağı oluşturdu."
 NSB_soviet_spanish_civil_war.5.t:0 "Sovyet Ajanları Stalinist Komutaya Sızıyor"
 NSB_soviet_spanish_civil_war.6.a:0 "Devrim Rusya'da da zafer kazanacak!"
 NSB_soviet_spanish_civil_war.6.b:0 "Devrim ya da Ölüm!"
 NSB_soviet_spanish_civil_war.6.desc_1:0 "Bu sabah örgütümüze [SPC.GetLeader]'in kendisi tarafından yazılmış bir mektup teslim edildi. Bu mektupta, İspanyol lideri İspanyol halkının gerçek Sovyet devrimcilerinden aldığı desteği asla unutmayacağını ve Stalinist olan zalim monolithle yüzleşmek zorunda kaldığımızda, POUM'un Sovyet halkının özgürlük ve gerçek devrim mücadelesinde onlara yardım etmek için ellerinden gelen her şeyi yapacağından emin olabileceğimizi beyan ediyor."
 NSB_soviet_spanish_civil_war.6.desc_2:0 "İspanya'daki faşist ve burjuva düşmanlarını yendikten ve Sovyet halkının Stalinist karşı-devrime karşı mücadelesindeki durumunun farkında olan POUM, karargahımıza önemli sayıda gönüllü tugay getirmek için etkileyici bir operasyon düzenledi. Bu cesur erkek ve kadınlar sadece İspanya'dan değil, dünyanın her yerinden geliyor ve çoğu, deneyim ve becerileri Sovyet mücadelesinin dengesini lehimize çevirmeye yardımcı olabilecek İspanya İç Savaşı'nın tecrübeli gazileridir."
 NSB_soviet_spanish_civil_war.6.t:0 "İspanya'da Muzaffer Devrim"
 POL_habsburg_events.1.a:0 "Bir Habsburg kralımız olacak."
 POL_habsburg_events.1.b:0 "Reddediyoruz."
 POL_habsburg_events.1.desc:0 "Polonya tahtında [From.GetLeader] varken, Kral bugün [Root.GetLeader]'e Macaristan hükümdarlığından Otto von Habsburg lehine çekilmesi için bir ültimatom verdi. Böyle bir karar Trianon Antlaşması'nın bir ihlali olarak görülebilse de, [From.GetLeader]'in hayır cevabını kabul etme niyeti yok gibi görünüyor."
 POL_habsburg_events.1.t:0 "[From.GetNameDefCap] Habsburg Yönetimi Talep Ediyor!"
 POL_habsburg_events.101.a:0 "Oh evet, her şey yoluna giriyor."
 POL_habsburg_events.101.desc:0 "Görünüşe göre [From.GetNameDef]'e verdiğimiz ültimatom, onları Otto von Habsburg'u Macaristan Kralı olarak taçlandırmaya ikna etti! Şimdi hem Macaristan hem de Polonya taçlarında Habsburglar varken, Avrupa genelinde yeni bir Habsburg yönetimi dönemi üzerimizde."
 POL_habsburg_events.101.t:0 "[From.GetNameDefCap] Bir Habsburg Taçlandırıyor"
 POL_habsburg_events.102.a:0 "Agresif müzakereler zamanı."
 POL_habsburg_events.102.desc:0 "Macar hükûmeti, Otto von Habsburg'u Macaristan Kralı olarak atama ültimatomundan tamamen etkilenmemiş görünüyor. Ültimatomumuz başarısız olsa da, bu mesele artık ordunun elindedir."
 POL_habsburg_events.102.t:0 "[From.GetNameDefCap] Reddediyor"
 POL_habsburg_events.2.a:0 "Elbette katılacağız."
 POL_habsburg_events.2.b:0 "İlgilenmiyoruz."
 POL_habsburg_events.2.desc:0 "Her iki ulusumuz da Habsburg ailesi tarafından yönetilirken, [From.GetLeader], [Root.GetNameDef] ve [From.GetNameDef]'in Avrupa genelindeki Habsburg kraliyetinin çıkarlarını korumak için güçlerini birleştirmesini önerdi."
 POL_habsburg_events.2.t:0 "[From.GetNameDefCap] Bir İttifak Teklif Ediyor"
 POL_habsburg_events.201.a:0 "Belki de Müttefiklere yönelmeliyiz."
 POL_habsburg_events.201.desc:0 "Aile bağlarımıza rağmen, [From.GetNameDef]'in [Root.GetNameDef] ile bir ittifak peşinde koşmakla hiç ilgilenmediği anlaşılıyor."
