 nsb_coup.0.a:0 "Bu işin aslını öğrenmeliyiz."
 nsb_coup.0.desc:0 "Generallerimizden bazılarının [Root.GetNameDef]'deki durumdan memnun olmadığı herkesin bildiği bir sır olsa da, bazıları farklılıklarımızı çözmek için daha sert adımlar atmayı düşünmeye başlamış gibi görünüyor. [?.Root.meeting_location.GetName]'da bir yerlerde olduğuna inanılan bilinmeyen bir yerde çeşitli subaylar arasında bir dizi toplantı yapıldı. \n\nAyrıntılar yetersiz, ancak [coup_member_1.GetName] ve [coup_member_2.GetName]'in grup arasında olduğuna inanmak için nedenimiz var. İkincisinin [coup_member_3.GetName] ile temas halinde olduğuna inanılıyor, ancak ilişkilerinin tam doğası belirsiz."
 nsb_coup.0.t:0 "Subay Kadrosunda Bir Komplo mu?"
 nsb_coup.1.a:0 "Ben, şahsen, yeni yöneticilerimizi memnuniyetle karşılıyorum."
 nsb_coup.1.desc:0 "Haftalar süren titiz planlamanın ardından, [Root.GetLeader] komutasındaki bir grup subay bugün, hükûmetin kontrolünü ele geçirme planı olan [Root.GetOperationName]'ı uyguladı. \n\nUzun hazırlık dönemi meyvesini verdi, çünkü [Root.GetLeader]'e sadık birimler tüm önemli hükûmet binalarının kontrolünü hızla ele geçirmeyi başardı. Ezici bir üstünlükle karşı karşıya kalan yerel muhafızlar ve polis birimleri, tek bir kurşun atmadan teslim oldu. Başkent çevresindeki barikatlar, kaçmaya çalışan tüm hükûmet bakanlarını yakaladı. \n\nÖnceki hükûmet artık güvenli bir şekilde gözaltında olduğuna göre, [Root.GetLeader] [Root.GetNameDef]'in geri kalanına bir emrivaki sundu. Yerel yetkililerin hızla hizaya gelmesi bekleniyor."
 nsb_coup.1.t:0 "[Root.GetLeader] Hükûmeti Ele Geçiriyor"
 nsb_coup.2.a:0 "Ve bu insanlar ülkeyi yönetmek mi istiyordu?"
 nsb_coup.2.desc:0 "Haftalar süren planlamanın ardından, dün gece bir grup subay, hükûmetin kontrolünü ele geçirme planı olan [Root.GetOperationName]'ın uygulanmasını emretti. \n\nGörünüşe göre planlarını erken uygulamak zorunda kaldılar, çünkü operasyonları aceleci ve kötü koordine edilmiş görünüyor. Nöbet programındaki değişikliklerden habersiz oldukları anlaşılan darbeye sadık bir grup asker, [Root.GetLeader]'in ofisine tutuklama veya öldürme emirleriyle geldi - tam da nöbet değişimi sırasında, böylece beklediklerinin iki katı muhafızla karşılaştılar. Ardından gelen çatışma kısa ve acımasızdı, her iki taraftan da birkaç asker ölü veya yaralı kalırken [Root.GetLeader] kaçmayı başardı.\n\n[Root.GetLeader] o zamandan beri hem halka açık olarak hem de radyoda göründü ve suikast girişiminin başarısız olduğunu gösterdi. Darbenin çökmesiyle birlikte, ordumuzdaki bir dizi subay tutuklanmaktan kaçmak için intihar etti veya tutuklanmaları için birimler gönderildiğinde savaşarak ölmeye karar verdi, çeşitli garnizonların komutanları ise [Root.GetLeader]'e sadakatlerini bildirdiler."
 nsb_coup.2.t:0 "Darbe Girişimi Başarısız Oldu"
 nsb_coup.3.a:0 "Bu isyanı ezeceğiz!"
 nsb_coup.3.desc:0 "Haftalar süren planlamanın ardından, dün gece bir grup subay, hükûmetin kontrolünü ele geçirme planı olan [Root.GetOperationName]'ın uygulanmasını emretti. \n\nGörünüşe göre planlarını erken uygulamak zorunda kaldılar ve olaylar hızla kontrolden çıktı. [Root.GetLeader]'i tutuklama veya öldürme girişimi ikisini de başaramadı ve başkent çevresindeki barikat ağı, çok sayıda hükûmet yetkilisi kaçtığında henüz kapanmamıştı.\n\n[Root.GetNameDef] hükûmeti bir gün daha savaşmak için yaşıyor ve [Root.GetLeader] hainleri adalete teslim etmek için yemin etti - ne pahasına olursa olsun."
 nsb_coup.3.t:0 "Subaylar Darbe Girişiminde Bulundu"
 nsb_news.1.a:0 "Polonya işçileri ayaklanıyor!"
 nsb_news.1.b:0 "Bu yeni yetmeleri ezeceğiz!"
 nsb_news.1.c:0 "Madonna, bizi koru."
 nsb_news.1.d:0 "Polonya'nın kendi kendini nasıl böldüğünü izleyin."
 nsb_news.1.desc:0 "Genç Polonya devleti iç savaşa sürüklendi! Onlarca yıllık hükûmet içi çekişmeler ve kırsal Doğu Polonya'daki altyapıya yapılan yatırımın tamamen olmaması, bu yılın başlarında ulusun alt sınıflarından genel bir greve yol açtı ve grevcilere polis ve ordu tarafından devam eden acımasız muamele ulusu ikiye böldü.\n\n[peasant_poland_target.GetLeader] başkanlığındaki köylü hükûmeti, Polonya ordusunun demokratik Front Morges fraksiyonu ve Marksistler, sosyalistler ve liberallerden oluşan bir koalisyon tarafından destekleniyor.\n\nSadık güçler Polonya'nın endüstriyel kalbinde toplanmışken ve köylüler kırsal Doğu'dayken, Polonya köylülerin kanıyla bölünmüş durumda."
 nsb_news.1.e:0 "Bu, Polonya için ne anlama gelecek?"
 nsb_news.1.t:0 "[peasant_poland_target.Capital.GetName]'da Köylü Ayaklanması"
 nsb_news.10.a:0 "Galibiz!"
 nsb_news.10.b:0 "Komünist devrime ciddi bir darbe."
 nsb_news.10.c:0 "Gerçekten de şaşırtıcı."
 nsb_news.10.d:0 "Stalin'in Rusyası bir kağıt ev gibi çöktü."
 nsb_news.10.desc_communist_opposition:0 "[SOS.GetLeader]'e sadık kalan son birliklerin teslim olması, [GetSovietCivilWarName]'in sonunu işaret ediyor. [SOV.GetLeader], [SOV.GetLeader.GetHerselfHimself]'i muzaffer ilan etti ve [SOV.GetNameDef]'i iç savaşın ve yıkımın küllerinden yeniden doğurmaya yemin etti. Önümüzdeki görev çok büyük ve dünya durumu belirsiz, ancak [SOV.GetLeader.GetSheHe], [SOV.GetNameDef] ve dünya için yeni bir dönemin yeni başladığı konusunda kararlı. [SOV.GetLeader.GetSheHe]'in bu beyanların hakkını verip veremeyeceği zamanla görülecek."
 nsb_news.10.desc_exiles:0 "İmkansız bir girişim gibi görünen, sürgündeki beyaz hareket tarafından Bolşeviklere karşı mücadelenin yenilenmesi, tüm zorluklara rağmen zafere dönüştü. [SOV.GetLeader], [SOS.GetNameDef]'in yenildiğini ilan etti ve Rusya'yı eski şanına kavuşturacağına yemin etti. Savaş, Rusya'nın büyük bir bölümünü harap etti ve ülkeye pahalıya mal oldu.\n\n[SOS.GetLeader]'in nerede olduğu şimdiye kadar bilinmiyor. Söylentilere göre [SOS.GetLeader.GetSheHe] teslimiyetten günler önce ülkeden kaçtı ve [SOS.GetLeader.GetSheHe] Güney Amerika'da bir yerlerde saklanıyor olabilir."
 nsb_news.10.desc_exiles_puppet:0 "Japon yardımıyla, geçici Rusya hükûmeti [SOS.GetLeader]'i yenmeyi ve [GetSovietCivilWarName]'de zafer kazanmayı başardı. Ancak [JAP.GetNameDef]'e esasen bir bağlı devlet haline gelmek ağır bir bedel ve birçok kişinin bunun gerçekten beyaz dava için bir zafer olup olmadığını sorgulamasına neden oluyor."
 nsb_news.10.desc_stalinist:0 "Son isyancı birimlerin teslim olmasıyla, [GetSovietCivilWarName] resmen sona erdi. Ulusa yönelik gösterişli bir konuşmada, [SOS.GetLeader] kendini bu zaferin mimarı ilan etti ve Kızıl Ordu'nun cesaretini ve sadakatini alkışladı. \n\nİç düşmanlar nihayet yok edildiğine göre, [SOV.Getleader] başka yerlere bakmaya başlayabilir. Sanayinin yaygın bir şekilde tahrip edilmesinin ve can kaybının uzun vadeli etkileri henüz görülmedi."
 nsb_news.10.e:0 "Stalin'den kurtulmak muhtemelen en iyisiydi."
 nsb_news.10.f:0 "Bu yeni liderlere güvenmek zor olacak."
 nsb_news.10.g:0 "Belki de [SOV.GetLeader] ile anlaşmak daha kolaydır."
 nsb_news.10.t:0 "[GetSovietCivilWarName]'in Sonu!"
 nsb_news.100.desc:0 "Bir zamanlar Vladimir İlyiç Lenin'in en üst düzey yardımcısı ve muhtemel varisi olan Lev Troçki, bugün evinde villasına baskın düzenleyen silahlı bir grup tarafından saldırıya uğradı. Saldırganlar Bolşevik'in bulunduğu odaya daldı, hemen ateş açtıktan sonra aceleyle ortadan kayboldu. Arkalarında ölümcül şekilde yaralanmış bir Troçki bıraktılar, Troçki birkaç saat sonra Mexico City'deki bir hastanede hayatını kaybetti. \n\nSovyetler Birliği Komünist Partisi'nin kontrolü için $SOV_iosif_stalin$ ve müttefikleriyle başarısız bir güç mücadelesinden sonra, Troçki otuzlu yılları sürgünde, Türkiye, Fransa ve Norveç'te yaşadıktan sonra nihayet Meksika'ya yerleşti. \nStalin'in ve Sovyetler Birliği'nin 'yozlaşmış 'işçi' devleti'nin sürekli bir eleştirmeni olarak kaldı."
 nsb_news.101.desc:0 "Eski Bolşevik Lev Troçki, bugün evinde villasına baskın düzenleyen silahlı bir grup tarafından saldırıya uğradı. Saldırganlar bulunduğu odaya daldı, çılgınca ve hedefsizce ateş ettikten sonra aceleyle ortadan kayboldu ve karısı ve torunuyla yatağın arkasına saklanmayı başaran yara almamış bir Troçki'yi geride bıraktı. \n\nTroçki bir zamanlar Vladimir Lenin'in en üst düzey yardımcısı ve muhtemel varisiydi, ancak başarısız bir güç mücadelesinden sonra $SOV_iosif_stalin$ tarafından Sovyetler Birliği'nden sürgüne zorlandı. Basına konuşan Troçki, hayatına yönelik girişimi 'Stalin'in eleştirmenlerini susturmak için uydurduğu bir başka korkakça komplo' olarak kınadı."
 nsb_news.102.a:0 "Alışılmadık bir ittifak..."
 nsb_news.102.b:0 "Kolektif güvenlik uğruna."
 nsb_news.102.desc_default:0 "[SOV.GetNameDef] ve [SOV_collective_security_pact_integrant.GetNameDef] arasında bir karşılıklı yardım paktı dün [SOV.Capital.GetCapitalVictoryPointName]'da her iki ülkeden diplomatlar tarafından imzalandı. \n\nBu anlaşma, [SOV.GetAdjective] Dışişleri Halk Komiseri [SOV.SOV_maksim_litvinov.GetName] tarafından önerilen Kolektif Güvenlik politikalarının bir parçasıdır. Bu pakt uyarınca, [SOV.GetNameDef] ve [SOV_collective_security_pact_integrant.GetNameDef], düşman güçlerin saldırısı durumunda birbirlerini savunma sözü verdiler."
 nsb_news.102.desc_poland:0 "[SOV.GetNameDef], [SOV_collective_security_pact_integrant.GetNameDef] ve [POL.GetNameDef] arasında bir karşılıklı yardım paktı dün [SOV.Capital.GetCapitalVictoryPointName]'da üç ülkeden diplomatlar tarafından imzalandı. \n\nBu anlaşma, [SOV.GetAdjective] Dışişleri Halk Komiseri [SOV.SOV_maksim_litvinov.GetName] tarafından önerilen Kolektif Güvenlik politikalarının bir parçasıdır. Bu pakt uyarınca, [SOV.GetNameDef], [SOV_collective_security_pact_integrant.GetNameDef] ve [POL.GetNameDef] aralarındaki herhangi bir toprak iddiasından feragat ettiler ve düşman güçlerin saldırısı durumunda birbirlerini savunma sözü verdiler."
 nsb_news.102.t:0 "[SOV.GetAdjective]-[SOV_collective_security_pact_integrant.GetAdjective][GetPolandIncludedOrNot] Paktı"
 nsb_news.103.a:0 "Bu, [ROOT.GetNameDef]'e fayda sağlayacak"
 nsb_news.103.b:0 "Ne kadar sürecek?"
 nsb_news.103.desc:0 "[SOV.GetNameDef] ve [GER.GetNameDef] aralarında bir ticari anlaşma imzaladılar. Bu anlaşmayla, [SOV.GetAdjective]ler endüstriyel gelişimlerini ve askeri araştırmalarını artırmayı hedeflerken, [GER.GetAdjective]ler tahıl, petrol ve demir cevheri gibi çok ihtiyaç duyulan hammaddelerin ithalatını arıyor."
 nsb_news.103.t:0 "[SOV.GetAdjective]-[GER.GetAdjective] Ticaret Anlaşması"
 nsb_news.104.a:0 "Bu gerekli bir önlemdir."
 nsb_news.104.b:0 "[ENG.GetLeader] ve [SOV.GetLeader]'in bir başka kurbanı."
 nsb_news.104.c:0 "Adil bir dövüş değil..."
 nsb_news.104.desc:0 "Haftalar süren planlamanın ardından, [ENG.GetNameDef] ve [SOV.GetNameDef], sayıca az ve teknolojik olarak geride kalmış bir düşmana karşı hızlı bir işgal gerçekleştirmek amacıyla [PER.GetName]'de ortak bir askeri operasyon başlattı. [ENG.GetLeader]'e göre, bu operasyon [PER.GetAdjective] petrol sahalarını ve [SOV.GetNameDef]'e olan [ENG.GetAdjective] ikmal hatlarını güvence altına almalarını sağlarken, aynı zamanda [TUR.GetNameDef]'den [PER.GetName] üzerinden Bakü petrol sahalarına ve [RAJ.GetNameDef]'e yönelik potansiyel bir düşman ilerlemesini önleyecektir."
 nsb_news.104.t:0 "[PER.GetName]'in Anglo-[SOV.GetAdjective] İşgali"
 nsb_news.11.a:0 "Belki de NKVD gerçekten bir şekilde işin içindedir?"
 nsb_news.11.b:0 "Olamaz!"
 nsb_news.11.desc:0 "Kişisi etrafında aşırı bir güvenlik aygıtı olmasına rağmen, [SOV.GetNameDef]'in lideri $SOV_iosif_stalin$ villasında ölü bulundu, muhtemelen öldürüldü. [SOV.GetAdjective] başkenti söylentilerle çalkalanıyor ve görünüşe göre $SOV_lavrenty_beriya$ liderliğindeki bir troyka en azından geçici olarak iktidarı ele geçirdi. Ancak yeni lider pek popüler değil, bu yüzden konumu tehdit altına girerse iktidara tutunmayı başarıp başaramayacağı henüz görülmedi. NKVD'nin her yönde soruşturma yürüttüğü ve Beriya'nın cinayetten sorumlu olanları bulmaya yemin ettiği bildiriliyor."
 nsb_news.11.t:0 "$SOV_iosif_stalin$'e Suikast Düzenlendi"
 nsb_news.12.a:0 "Bunlar ilginç zamanlar."
 nsb_news.12.b:0 "İşler kötüden daha kötüye gidiyor."
 nsb_news.12.desc:0 "Yıldırım hızında bir hamleyle, [SOV.GetAdjective] muhalefeti Beriya liderliğindeki troykayı tutukladı ve görevden aldı. Kızıl ordu kuvvetleri şafak saatlerinde başkenti kuşattı, özel kuvvetler gizlice $SOV_lavrenty_beriya$'yı tutukladı ve kişisel koruması ne olduğunu anlamadan onu güvenli bir yere kaçırdı. [SOV.GetLeader]'in ülkenin yeni görünen lideri olduğu yeni bir hükûmet ilan edildi ve $SOV_lavrenty_beriya$, [SOV.GetNameDef]'e ihanetle suçlandı."
 nsb_news.12.t:0 "[SOV.GetAdjective] Darbesi"
 nsb_news.2.a:0 "Bu bir hakaret!"
 nsb_news.2.b:0 "Ben, şahsen, yeni Polonyalı efendilerimizi memnuniyetle karşılıyorum."
 nsb_news.2.c:0 "Liberya sadece bir başlangıç."
 nsb_news.2.d:0 "Afrika'da Polonya mı?"
 nsb_news.2.desc.com:0 "Polonya bugün Liberya'nın hakimiyetini ele aldı! 1932'den beri Liberya, Polonya'yı tercih ettiği yatırım ortağı olarak görüyor ve ulusun çok az sömürge hırsı olduğuna inanıyordu. Ancak, bu anlaşma şimdi Liberya'yı bir Polonya kuklasından biraz daha fazlası haline getirdi.\n\nABD yetkilileri, Liberya bağımsızlığını ulusun kurucu ilkelerinin gerekli bir bileşeni olarak görerek kararı kınadı.\n\n[POL.GetLeader], diğer KPP üyeleri tarafından sömürgecilikle uğraşmakla suçlanıyor, [POL.GetLeader.GetSheHe] bunun sadece Liberya'yı potansiyel sömürgecilerden korumak için olduğunu taahhüt ediyor, ancak birçok kişi ikna olmuş değil."
 nsb_news.2.desc.dem:0 "Polonya bugün Liberya'nın hakimiyetini ele aldı! 1932'den beri Liberya, Polonya'yı tercih ettiği yatırım ortağı olarak görüyor ve ulusun çok az sömürge hırsı olduğuna inanıyordu. Ancak, Polonya, Liberya ve Milletler Cemiyeti arasında imzalanan anlaşma şimdi Liberya'yı bir Polonya kuklasından biraz daha fazlası haline getirdi.\n\nABD yetkilileri, Liberya bağımsızlığını ulusun kurucu ilkelerinin gerekli bir bileşeni olarak görerek kararı kınadı.\n\nPolonya Denizcilik ve Sömürge Ligi bunu Polonya'nın sömürge hırsları için muazzam bir zafer olarak görüyor ve bunun Afrika'daki Polonyalıların hırsının tamamına yakın bile olmadığını iddia ediyor."
 nsb_news.2.e:0 "Bu… kesinlikle emperyalizme benziyor."
 nsb_news.2.f:0 "Yine anlamsız bir emperyalizm eylemi."
 nsb_news.2.t:0 "[LIB.GetAdjective] Himayesi İlan Edildi"
 nsb_news.3.a:0 "Artık bölünmüş değiliz."
 nsb_news.3.b:0 "İlginç."
 nsb_news.3.desc:0 "Tüm Orta Asya bölgesi sıkı bir şekilde [From.GetOldAdjective] kontrolü altında olduğuna göre, Türk halkları [From.GetLeader]'in liderliği altında birleşti. Yeni Türk yönetimi, [From.GetOldNameDef]'in artık [From.GetNameDef] olarak bilineceğini ve tüm Türk halklarının haklı yurdu olduğunu ilan etti.\n\nBu yeni ulusun sınırlarının ötesinde bile, birçok Türk halkı [From.GetNameDef]'i gerçek evleri olarak görmeye başlıyor ve [From.GetLeader] bu fırsatı büyüyen uluslarını genişletmek için kullanabilir."
 nsb_news.3.t:0 "Türkistan Birleşti!"
 nsb_news.301.a:0 "Artık Bölünmüş Değiliz!"
 nsb_news.301.b:0 "İlginç"
 nsb_news.301.d:0 "Tapa Tchermoeff ruhuyla, Dağlı Cumhuriyetleri bir kez daha [FROM.GetLeader]'in liderliği altında Birleşti. Kuzey Kafkasya topraklarına giren her yabancı işgalciyle savaşacaklarını ve tarihin yıllıklarında yerlerini alacaklarını iddia ediyorlar. Ve böylece, Kuzey Kafkasya Dağlı Cumhuriyeti doğdu!"
 nsb_news.301.t:0 "Dağlı Cumhuriyetleri Birleşiyor"
 nsb_news.302.a:0 "Üçüncüsü Uğurlu Gelir"
 nsb_news.302.b:0 "Yine mi?"
 nsb_news.302.d:0 "İlk kez Rus İç Savaşı'nın başında hızla dağıldı. İkinci kez bir Sovyet Cumhuriyeti olarak, 1936 Sovyet Anayasası'ndan sonra bölündü. Şimdi üçüncü kez, [FROM.GetLeader] Transkafkasya ülkelerini yeniden birleştirme çabası gösterdi ve bir kez daha sadece topraklarını savunmaya değil, aynı zamanda diğer topraklara da genişlemeye hazırlar. Sadece zaman ne yapacaklarını gösterecek."
 nsb_news.302.t:0 "Transkafkasya Yeniden Birleşiyor"
 nsb_news.303.a:0 "Sonunda, Sibirya Emperyalizmin dizginlerinden kurtuldu!"
 nsb_news.303.b:0 "Rusya'nın Doğu üzerindeki Hakimiyeti Azalıyor..."
 nsb_news.303.d:0 "Yüzyıllar süren Rus egemenliğinden sonra, Sibirya artık sadece bir yabancı güç içindeki bir bölge değil, aynı zamanda birleşmiş ve hakları için ne pahasına olursa olsun savaşmaya hazır siyasi bir varlıktır. Sibirya halkı seviniyor, çünkü Emperyalizm günleri artık sona erdi, çünkü yabancı müdahalesi olmadan bağımsız bir devlette yaşıyorlar. Cumhuriyet, boş durmayacağını ilan etti, çünkü korunması ve kurtarılması gereken daha fazla Sibirya halkı var, ne pahasına olursa olsun!"
 nsb_news.303.t:0 "Sibirya Birleşti"
 nsb_news.304.a:0 "Bu sefer bir arada kalacak!"
 nsb_news.304.b:0 "Peki, o da neredeymiş?"
 nsb_news.304.d:0 "Rus İç Savaşı'ndan bu yana ilk kez, Volga Ural bölgesini oluşturan uluslar, İdil-Ural adını verdikleri bir devlette yeniden birleştiler. Bu sefer, Rusya tarafından engellenmeyeceklerini ve bağımsızlıklarını ne pahasına olursa olsun koruyacaklarını ilan ediyorlar. Sadece gelecek, devletin hayatta kalmaya mahkum olup olmadığını söyleyecek..."
 nsb_news.304.t:0 "İdil-Ural Geri Döndü"
 nsb_news.4.a:0 "Artık 'hür' bir şehir değil."
 nsb_news.4.b:0 "Sırada ne var? Renanya'nın yeniden askerileştirilmesi mi?"
 nsb_news.4.c:0 "Polonya'dan daha iyisini beklemiştik."
 nsb_news.4.d:0 "Şehri uzun süre tutamayacaklar."
 nsb_news.4.desc:0 "1920'de Versay Antlaşması ile kurulan Hür Danzig Şehri, bugüne kadar Polonya devletinin koruması altında bağımsız bir ulus olmuştur. Ancak, Alman-Leh sınırı çevresinde artan gerilimler ve Danzig hükûmetinin Polonya ticaretinin şehir limanından geçmesine izin vermemesi üzerine, Polonya hükûmeti bugün Danzig'in artık hür bir şehir olmadığını ilan etti.\n\nŞimdiden Danzig sokakları, devletin şehir üzerindeki gücünü artırma tek göreviyle Polonyalı askerlerle doluyor. Albert Forster ve diğer birçok Nazi partisi üyesi saklandı ve bir isyan ve sonunda [GER.GetNameDef]'e iltica etme söylentileri var."
 nsb_news.4.e:0 "İlginç."
 nsb_news.4.t:0 "[POL.GetNameDefCap] Danzig'i Ele Geçiriyor!"
 nsb_news.400.a:0 "Muhteşem bir olay!"
 nsb_news.400.b:0 "Savaş çığırtkanlığı!"
 nsb_news.400.c:0 "Bir kepazelik!"
 nsb_news.400.desc:0 "Neredeyse otuz yıldır Bolşevikler tarafından yönetildikten sonra, [SOV.GetName] bugün Moskova'daki Uspenski Katedrali'nde görkemli bir törenle Çar III. Vladimir'in taç giymesiyle Çarlığa geri döndü. Kalabalıkların arasından kraliyet alayından sonra, yeni Çar onu tanıklık etmeye gelen halka konuştu, Rus halkının ruhunu övdü ve 'ulusu eski şanına geri döndürmeye' yemin etti."
 nsb_news.400.t:0 "III. Vladimir'in Taç Giyme Töreni"
 nsb_news.401.a:0 "Şanlı ulusumuzun güçlü liderlere ihtiyacı var!"
 nsb_news.401.b:0 "Bunun durumu iyileştirip iyileştirmeyeceği görülecek."
 nsb_news.401.c:0 "Yeni bir müttefik mi yükseliyor?"
 nsb_news.401.desc:0 "Hükûmetlerini Zemsky Sobor'un yeniden kurulmasıyla meşrulaştırdıktan sadece birkaç ay sonra, [SOV.GetAdjective] hükûmetindeki faşist unsurlar yeni parlamentoyu zaten feshetti ve ulusu [SOV.GetLeader]'in kontrolüne verdi. Henüz, yeni taç giymiş Çar hala bir göstermelik rol oynuyor, ancak ona çok az gerçek güç kaldığı açık.\n\nRejim değişikliğinin ardından, milliyetçi söylem zaten ölçülebilir bir şekilde arttı, 'slav halklarının' kardeşliğini öven konuşmaların yanı sıra komşu güçlerin geçmiş 'ihlallerini' kınayan konuşmalar yapılıyor."
 nsb_news.401.t:0 "Zemsky Sobor Dağıtıldı"
 nsb_news.402.a:0 "Şanlı ittifakımız yükseliyor!"
 nsb_news.402.b:0 "Doğu'daki yeni müttefiklerimizden mükemmel bir fikir."
 nsb_news.402.c:0 "Yeni bir Dünya Düzeni mi şekillendiriyorlar?"
 nsb_news.402.d:0 "Artık Avrupa onların keyfine kalmış..."
 nsb_news.402.desc:0 "Bugün erken saatlerde ortak bir açıklamada, [GER.GetNameDef] ve [SOV.GetNameDef] sözcüleri bir 'Berlin-Moskova Mihveri'nin kurulduğunu duyurdu. İki güç, 'çıkarlarını korumak' için ekonomik, siyasi ve askeri olarak işbirliği yapacaklarını ve 'Doğu ve Orta Avrupa'nın istikrarını kalplerinde tuttuklarını' beyan ettiler.\n\nBunun gerçek motivasyonlarını yansıtıp yansıtmadığı görülecek."
 nsb_news.402.t:0 "Berlin-Moskova Mihveri"
 nsb_news.403.a:0 "Müdahalemizin ortaya çıkması talihsizlik."
 nsb_news.403.b:0 "Kapımızın önünde mi müdahale ediyorlar?!"
 nsb_news.403.c:0 "Yakında güçlü liderliğin avantajlarını görecekler."
 nsb_news.403.d:0 "Faşizmin yayılması kontrolden çıktı!"
 nsb_news.403.desc:0 "Güney ve Orta Amerika'daki çok sayıda ulusun iç siyasi işlerine yaygın [SOV.GetAdjective] müdahalesine dair kanıtlar ortaya çıktı. Sağ eğilimli siyasi örgütlerin ve paramiliter grupların finanse edilmesi, rüşvet, kandırma ve dezenformasyonun yayılması yoluyla, bu ulusların iç istikrarı giderek daha istikrarsız hale geldi.\n\nBu gizli [SOV.GetAdjective] faaliyeti durdurulmadıkça, uzmanlar bu ulusların en azından bazılarının Amerika'da [SOV.GetName] için ideolojik bir dayanak noktası haline gelmesinin kaçınılmaz olduğu konusunda hemfikir. Bu gerçekleşirse, [SOV.GetAdjective]'in bu uluslara desteğinin yalnızca artması ve daha açık hale gelmesi muhtemeldir."
 nsb_news.403.t:0 "[SOV.GetAdjective]'in Amerikalara Müdahalesi"
 nsb_news.404.a:0 "Muhteşem!"
 nsb_news.404.b:0 "Ciddi olamazlar!"
 nsb_news.404.desc:0 "Ülkeyi son iç savaş sarstığından beri, Rusya'daki Ortodoks Kilisesi istikrarlı bir şekilde güç kazandı. Şimdi, eski Bizans'ın fethini tamamlamalarıyla, kilise ve devletin tam birleşmesine yönelik son adımları attılar.\n\nYüce Patrik olarak çifte tahta çıkma ve tüm Rusların Çarı olarak taç giyme töreninden sonra, [SOV.GetLeader] şimdi 'Tanrı'nın iradesi' olarak adlandırdığı şeyin peşinde '[SOV.GetNameDef]' olarak vaftiz ettiği ülkeyi yönetiyor."
 nsb_news.404.t:0 "Üçüncü Roma'nın Yükselişi"
 nsb_news.405.a:0 "Birleşmiş Slavlar yenilemez!"
 nsb_news.405.b:0 "Hesaba katılması gereken bir güç."
 nsb_news.405.desc:0 "Bir kez daha 'Tüm Slavların Savunucusu' unvanını üstlenen Rusya, bunu yapmanın en iyi yolunun tüm Slav halklarını tek bir ulusta toplamak olduğuna karar verdi.\n\nBu birleşmenin nihayet gerçekleşmesiyle birlikte, [SOV.GetLeader] şimdi [SOV.GetNameDef] oluşumunu duyurdu ve \"yeni ulusun kullanabileceği tüm kaynakların faydaya dönüştürüleceğine\" söz verdi. halkını koruyun ve onu dış tehditlerden koruyun.\""
 nsb_news.405.t:0 "[SOV.GetNameDefCap]"
 nsb_news.406.a:0 "Kardeşlerimize verdiğimiz sözleri tutarız."
 nsb_news.406.b:0 "Bağımsızlığımıza saygı duydukları sürece..."
 nsb_news.406.c:0 "Slavların Ağabeyi geri döndü..."
 nsb_news.406.desc:0 "[SOV.GetNameDef], Avrupa'daki diğer Slav halklarına garantiler vererek bir kez daha \"Slavların Koruyucusu\" rolünü üstlendi. [SOV.GetLeader], \"[SOV.GetNameDef] ülkesinin bütün kaynaklarının Slav halklarının yararına ve onları dış tehditlerden korumak için kullanılacağını\" açıkladı.\n\n[SOV.GetAdjective] hükûmeti, sözünü tutan bir ülke olduklarını göstermek için özellikle Büyük Savaş'a katılımlarını örnek verdi. Verilen garantilerin doğurabileceği sonuçların farkında oldukları ve sorumluluklarından kaçınmayacakları anlaşılıyor."
 nsb_news.406.t:0 "Slavların Koruyucusu"
 nsb_news.407.a:0 "İstikrarlı bir Avrupa'ya doğru bir adım."
 nsb_news.407.b:0 "Geçmişten bir kalıntı..."
 nsb_news.407.desc:0 "[From.GetNameDefCap] ve [SOV.GetNameDef], eski Üçlü İtilaf'ın sona ermesinden otuz yıl sonra yenilenmiş askeri işbirliğini duyurdu.\n\nAçıkça belirtilmese de, bu yeni ittifakın belirli Orta Avrupa güçlerinin genişlemesini engelleme çabasıyla kurulduğu muhtemeldir. İttifakın genişlemeye devam edip etmeyeceği henüz görülmedi."
 nsb_news.407.t:0 "Üçlü İtilaf mı?"
 nsb_news.408.a:0 "Bir kez daha birlikte duruyoruz."
 nsb_news.408.b:0 "Bakalım ne kadar sürede parçalanacak."
 nsb_news.408.desc:0 "[From.GetNameDefCap] şimdi, Orta Avrupa'daki yayılmacı güçlere karşı kesin bir şekilde hedeflenen yenilenmiş bir Üçlü İtilaf'a eski müttefiklerine katılma kararını açıkladı."
 nsb_news.408.t:0 "Üçlü İtilaf"
 nsb_news.409.a:0 "Güçlü bir diplomatik hamle."
 nsb_news.409.b:0 "Beklenmedik bir gelişme!"
 nsb_news.409.desc:0 "Üç taraflı bir açıklamada [GER.GetNameDef], [SOV.GetNameDef] ve [JAP.GetNameDef] hükûmetleri, [JAP.GetNameDef]'in Mihver ittifakının bir sonraki üyesi olacağını duyurdu.\n\n[SOV.GetAdjective] ve [JAP.GetNameDef] hükûmetleri arasındaki son gerilimler ışığında beklenmedik olsa da (ve muhtemelen bol [GER.GetAdjective] müzakerelerinin bir sonucu olarak), bu yeni gelişme esasen [SOV.GetAdjective] doğu kanadını güvence altına alırken, [JAP.GetNameDef]'in dikkatini Pasifik'e odaklamasına olanak tanıyacak."
 nsb_news.409.t:0 "Berlin-Moskova Mihveri: Tokyo Katılıyor"
 nsb_news.5.a:0 "Çok yaşa Kral!"
 nsb_news.5.b:0 "Bir krallık geldi."
 nsb_news.5.c:0 "Bu ne çılgınlık?"
 nsb_news.5.desc.cossack:0 "5 Kasım 1916'da, Almanya'dan II. Wilhelm ve Avusturya'dan Franz Joseph, Rusya'daki Polonya işgal altındaki topraklardan yeni bir Krallık doğacağına dair ortak bir bildiri imzaladılar; Polonya Krallığı. Ancak, genç devlet zamanında bir Kral bulamadı ve o zamanki Cumhurbaşkanı İkinci Polonya Cumhuriyeti'ni ilan etti.\n\nAncak, görünüşe göre Polonya nihayet [POL.GetLeader]'de bir Kral buldu! Bir kazak, bir soylu ve bir savaş beyi olan [POL.GetLeader], Polonya tahtı için beklenmedik bir talip, ancak şüphesiz Baltık'ta kişisel bir tımar için bitmeyen hırsı, hala kalplerinde restore edilmiş bir Birlik hırsları taşıyan Polonyalı bakanlar için büyük bir çekiciliğe sahip."
 nsb_news.5.desc.habsburg:0 "5 Kasım 1916'da, Almanya'dan II. Wilhelm ve Avusturya'dan Franz Joseph, Rusya'daki Polonya işgal altındaki topraklardan yeni bir Krallık doğacağına dair ortak bir bildiri imzaladılar; Polonya Krallığı. Ancak, genç devlet zamanında bir Kral bulamadı ve o zamanki Cumhurbaşkanı İkinci Polonya Cumhuriyeti'ni ilan etti.\n\nAncak, görünüşe göre Polonya nihayet [POL.GetLeader]'de bir Kral buldu! Habsburg soyluluğuna doğan Karl Albrecht, neredeyse Polonya devletinin var olduğu sürece Polonya ordusu için savaşıyor ve bugün tezahürat yapan kalabalıkların gürültüsüyle, Polonya'nın ilk Habsburg Kralı olarak seçildi."
 nsb_news.5.desc.romania:0 "5 Kasım 1916'da, Almanya'dan II. Wilhelm ve Avusturya'dan Franz Joseph, Rusya'daki Polonya işgal altındaki topraklardan yeni bir Krallık doğacağına dair ortak bir bildiri imzaladılar; Polonya Krallığı. Ancak, genç devlet zamanında bir Kral bulamadı ve o zamanki Cumhurbaşkanı İkinci Polonya Cumhuriyeti'ni ilan etti.\n\nAncak, görünüşe göre Polonya nihayet [POL.GetLeader]'de bir Kral buldu! Polonya ile Romanya arasında uzun süredir devam eden bir dostluk ve ittifak varken, Polonya naiplik konseyinin [ROM.GetNameDef] ile çok daha yakın ilişkiler kurma hırsı olduğu anlaşılıyor. Romanya tahtının varisi olarak, iki ulusun geri dönülmez bir şekilde iç içe geçmesi sadece bir zaman meselesi."
 nsb_news.5.desc.romanov:0 "5 Kasım 1916'da, Almanya'dan II. Wilhelm ve Avusturya'dan Franz Joseph, Rusya'daki Polonya işgal altındaki topraklardan yeni bir Krallık doğacağına dair ortak bir bildiri imzaladılar; Polonya Krallığı. Ancak, genç devlet zamanında bir Kral bulamadı ve o zamanki Cumhurbaşkanı İkinci Polonya Cumhuriyeti'ni ilan etti.\n\nAncak, görünüşe göre Polonya nihayet [POL.GetLeader]'de bir Kral buldu! Tıpkı ondan önceki Jadwiga gibi, Hükümdar Kraliçe unvanı olarak ‘Kral’ı benimsedi. Birçoğu onun Çar II. Nikolay'ın gerçek kızı olduğundan şüphe duysa da, yine de Varşova'da Polonya Kralı Anastasia Romanov olarak taç giydi."
 nsb_news.5.desc.saxon:0 "5 Kasım 1916'da, Almanya'dan II. Wilhelm ve Avusturya'dan Franz Joseph, Rusya'daki Polonya işgal altındaki topraklardan yeni bir Krallık doğacağına dair ortak bir bildiri imzaladılar; Polonya Krallığı. Ancak, genç devlet zamanında bir Kral bulamadı ve o zamanki Cumhurbaşkanı İkinci Polonya Cumhuriyeti'ni ilan etti.\n\nAncak, görünüşe göre Polonya nihayet [POL.GetLeader]'de bir Kral buldu! Meissen Uçbeyi şimdi Polonya'nın Kralı I. Friedrich. Almanlarla yaklaşan savaş korkularına rağmen, Polonya naiplik konseyi, Polonya ile Saksonya soyluları arasındaki uzun süredir devam eden tarihi bağ nedeniyle Uçbeyi'ne tahtı teklif etti."
 nsb_news.5.t:0 "[POL.GetNameDefCap] Bir Kral Taçlandırıyor!"
 nsb_news.6.a:0 "Polonya daha güçlü bir şekilde yeniden doğuyor."
 nsb_news.6.b:0 "Ne kadar korkunç."
 nsb_news.6.desc:0 "Endecja ve Falanga'nın Polonya hükûmetiyle uzun süredir devam eden bir ilişkisi vardı, ancak Ignacy Mościcki'nin bu aşırı sağ unsurlarla devam eden işbirliği sonunda onun çöküşü oldu. Polonya hükûmeti içindeki artan etkileriyle, [POL.GetLeader] şimdi Mościcki'nin yerine Polonya'nın yeni Cumhurbaşkanı oldu.\n\nBu yeni milliyetçi hükûmetin bir şekilde toprakları için rekabet eden yabancı güçleri yatıştırabileceğine inanıp inanmadığı veya belki de Polonya için ufukta yeni ittifaklar olup olmadığı görülecek."
 nsb_news.6.t:0 "Milliyetçiler Polonya Hükûmetini Ele Geçiriyor"
 nsb_news.7.a:0 "Yakında bir olacağız."
 nsb_news.7.b:0 "İlginç."
 nsb_news.7.desc:0 "Garip bir olaylar zincirinde, hem [From.GetNameDef] hem de [POL.GetNameDef] her ikisi de [POL.GetLeader]'in yönetimi altına girdi. İki ulus şimdilik ayrı kalsa da, ortak devlet başkanı diplomatik olarak ayrılmaz bir şekilde bağlı oldukları anlamına geliyor.\n\nBu kişisel birliğin yakında [FROM.GetAdjective] ve [POL.GetAdjective] devletlerinin bir birleşmesine dönüşmesi muhtemel görünüyor, ancak şimdilik birlik tamamen diplomatik."
 nsb_news.7.t:0 "[POL.GetAdjective] ve [From.GetAdjective] tahtları birleşiyor"
 nsb_news.8.a:0 "Bir başka ulus monarşizme yenik düştü."
 nsb_news.8.b:0 "Bu bizim için ne anlama gelecek?"
 nsb_news.8.c:0 "Krallık yeniden yaşıyor!"
 nsb_news.8.d:0 "İlginç."
 nsb_news.8.desc:0 "4 Haziran 1918'de, Wilhelm Karl von Urach, ezici bir destekle Litvanya Kralı olarak demokratik bir şekilde seçildi, ancak Alman İmparatorluğu'nun müdahalesi referandumun geçersiz ilan edilmesi ve Litvanya'nın Kralı ile hiçbir zaman birleşememesi anlamına geliyordu. Buna rağmen, Litvanya Cumhurbaşkanı bugün kendi ofisini lağvetti ve Kral Midaugas III'ü yeni Litvanya Krallığı'nın devlet başkanı ilan etti.\n\nAntanas Smetona şimdi Litvanya'nın Başbakanı olarak hizmet verirken, ulus mutlak bir monarşi haline geldi ve ulus genelinde yeni bir Litvanya vatanseverliği ve şovenizmi dalgasının yayıldığı anlaşılıyor."
 nsb_news.8.t:0 "Litvanya Krallığı"
 nsb_news.9.a:0 "Zafere!"
 nsb_news.9.b:0 "Bunun böyle olacağı varmış."
 nsb_news.9.c:0 "Komünistler kendilerini yok ediyor."
 nsb_news.9.d:0 "[SOS.GetLeader] kesinlikle galip gelecek."
 nsb_news.9.desc_exiles:0 "Oldukça beklenmedik bir şekilde, beyaz kuvvetler bir kez daha Bolşeviklere karşı ayaklandı. Davaları kaybolmuş gibi görünse de, son aylarda Mançurya ve Sibirya'da askeri bir yığınak yapıldığına dair birkaç rapor vardı ve bu sabah erken saatlerde [SOV.capital.GetName]'da geçici bir Rusya hükûmeti ilan edildi. \n\n[SOS.GetAdjective] hükûmeti derhal Kızıl Ordu'yu seferber etti ve Rusya bir kez daha iç savaşa sürüklendi. Batı güçleri şimdiye kadar çatışmaya müdahale etme konusunda hiçbir ilgi göstermedi. Ancak Japonların bu olaylar karşısında nasıl tepki vereceği henüz görülmedi."
 nsb_news.9.desc_left:0 "Rusya'da bir kez daha iç savaş patlak verdi. Son iç savaşın anıları herkesin zihninde hala tazeyken, işlerin bu noktaya gelmesi biraz sürpriz oldu. Stalinist ve Troçkist ittifaklar arasında yıllarca süren siyasi çekişmelerden sonra Sovyet hükûmeti nihayet bölündü ve iki grup şimdi ülkenin kontrolü için sokaklarda savaşıyor. \n\n[SOV.GetLeader], [SOV.GetLeader.GetSheHe]'in [SOV.GetNameDef] olarak adlandırdığı oluşumun lideri olarak [SOV.GetLeader.GetHerselfHimself]'i ilan etti ve [SOS.Getleader]'e karşı savaşı [SOV.Capital.GetName]'daki [SOV.GetLeader.GetHerHis] üssünden yönetiyor."
 nsb_news.9.desc_right:0 "Sovyet Rusya'da bir kez daha açık çatışma var. Ancak bu sefer, Bolşevikler ve Beyazlar arasında bir savaş değil, komünist parti içindeki rakip fraksiyonlar arasında bir savaş. [SOS.GetLeader] başkenti elinde tutarken, [SOV.GetLeader] liderliğindeki isyancılar [SOV.Capital.GetName] çevresinde üslenmiş durumda. [SOV.GetLeader]'in isyanının yabancı güçler tarafından desteklendiği söylentileri dolaşıyor, ancak bu söylentilerin geçerliliği henüz görülmedi."
 nsb_news.9.e:0 "Bu, komünist dava için ne anlama gelecek?"
 nsb_news.9.f:0 "Şimdi sistemin içindeki şiddeti görüyoruz!"
 nsb_news.9.g:0 "Bu sefer kendi başlarına."
 nsb_news.9.h:0 "Bir kez yenildiler, kesinlikle ezilecekler!"
 nsb_news.9.i:0 "Asil bir dava, ama gerçekten bunu kazanabilirler mi?"
 nsb_news.9.t:0 "[GetSovietCivilWarName]!"
 pavel_events.1.a:0 "Don Kazakları bağımsız olmalı."
 pavel_events.1.b:0 "Doğrudan bize cevap verecekler."
 pavel_events.1.desc:0 "Tüm Don Vadisi şimdi [Root.GetLeader] ve [Root.GetLeader.GetHerHis] kuvvetlerinin kontrolü altında olduğuna göre, Don Cumhuriyeti'ni yeniden kurma ve liderlerini bir kez daha Don Kazaklarını Kızıllara karşı yönetmeleri için geri davet etme konumundayız!\nGeriye kalan tek soru, ev sahibinin bağımsız bir ulus olarak sadık kalacağına güvenilip güvenilemeyeceği veya [Root.GetLeader]'in doğrudan bir kukla hükûmeti olarak hizmet edip etmemesi gerektiğidir."
 pavel_events.1.t:0 "Don Cumhuriyeti'nin Restorasyonu"
 pavel_events.2.a:0 "Pekala."
 pavel_events.2.b:0 "Onlara güvenilemez, bizim bağlı devletimiz olacaklar."
 pavel_events.2.desc:0 "Bir zamanlar Kuban Halk Cumhuriyeti, Beyazlar ve sonra Kızıllar için savaşan dönek bir ulus olan [Root.GetLeader], Kuban Cumhuriyeti'ni yeni beyaz yanlısı liderlikle restore etmeye karar verdi.\nKuban halkı bir zamanlar Beyaz davaya ihanet etmiş olsa da, yeni liderlik eski hükûmete olan her türlü desteği ezmek için elinden gelen her şeyi yapacağına dair bize güvence veriyor."
 pavel_events.2.t:0 "Kuban Cumhuriyeti'nin Restorasyonu"
 pavel_events.3.a:0 "Eğer savaşı önleyecekse..."
 pavel_events.3.b:0 "Bu bir şaka mı? Hayır!"
 pavel_events.3.desc:0 "[From.GetNameDef]'den “eski Polonya topraklarının” derhal devredilmesini talep eden endişe verici bir telgraf geldi. Bahsettikleri alanlar Pomeranya, Prusya ve Silezya'yı içeriyor.\n\nTaht [From.GetLeader] tarafından alındığından beri Polonya devleti biraz öngörülemezdi, ancak çok az kişi [From.GetLeader.GetSheHe]'in [Root.GetNameDef]'den toprak talep edecek kadar cüretkar olacağını tahmin edebilirdi."
 pavel_events.3.t:0 "[From.GetNameDefCap] Doğu Almanya'yı Talep Ediyor!"
 pavel_events.301.a:0 "Bekle, gerçekten mi?"
 pavel_events.301.desc:0 "Kimsenin tahmin edemeyeceği bir olaylar zincirinde, [From.GetNameDef] [Root.GetLeader]'in taleplerine boyun eğdi ve Silezya, Pomeranya ve Prusya bölgelerini [Root.GetNameDef]'e devretti."
 pavel_events.301.t:0 "[From.GetNameDefCap] Boyun Eğiyor"
 pavel_events.302.a:0 "Taleplerimiz savaş alanında karşılanacak."
 pavel_events.302.desc:0 "Tahmin edildiği gibi, Almanlar [Root.GetLeader]'in taleplerini, bir tür ayrıntılı eşek şakası olduğuna inanarak reddettiler. Diplomasi [From.GetNameDef]'i etkilemekte başarısız olunca, [Root.GetLeader] atına bindi ve sınıra doğru sürdü, bu meseleyi kişisel olarak ordunun ellerine aldı."
 pavel_events.302.t:0 "[From.GetNameCap] Toprak Devretmeyi Reddediyor"
 sakhalin_concession_tt:0 "[655.GetName], [SOV.GetNameDef]'deki İç Savaşın sonunda [ROOT.getName]'e devredilecek"
 vladivostock_concession_tt:0 "§Y[?SOV.SOV_japanese_general.GetName]§! liderliğindeki bir [ROOT.GetAdjective] seferi kuvveti, muhalefet güçlerini desteklemek için gönderilecek.\n§Y[408.GetName]§!, [SOV.GetNameDef]'deki İç Savaşın sonunda §Y[ROOT.GetName]§!'e devredilecek"
