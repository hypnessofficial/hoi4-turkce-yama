 MTG_naval_treaty.1.a:0 "Bu şartlar kabul edilebilir."
 MTG_naval_treaty.1.b:0 "Hırslarımızda sınırlanmayacağız!"
 MTG_naval_treaty.1.desc:0 "Daha büyük bir filo inşa etme yönündeki son çabalarımız, bizi büyük deniz güçleri arasına soktu. [From.GetNameDefCap], genişletilmiş filomuzdan açıkça tehdit altında hissediyor ve başkentimize karşılıklı bir silah sınırlama antlaşması müzakere etmek için bir heyet gönderdi. \n\nAntlaşma, İkinci Londra Denizcilik Antlaşması üzerine modellenecek ve ana gemilerimizin boyutunu kısıtlayacak ve ayrıca ana gemilerdeki genel filo boyutumuzun [ENG.GetNameDef] filosunu aşmamasını sınırlayacaktır."
 MTG_naval_treaty.1.t:0 "[From.GetNameDefCap] Donanma Yeniden Silahlanmasını Sınırlamak İstiyor"
 MTG_naval_treaty.11.a:0 "Barışı korumak için asil bir girişimdi."
 MTG_naval_treaty.11.desc:0 "Savaşın patlak vermesiyle, [From.GetAdjective] hükûmeti, Londra Denizcilik Antlaşması'nın geri kalan imzacılarina, 24. Madde uyarınca, Denizcilik Antlaşması'nın kısıtlamalarını artık ulusal çıkarlara uygun görmediğini resmi olarak bildirdi. [From.GetAdjective] büyükelçisi bu nedenle Denizcilik Antlaşması'nın savaş süresince askıya alınacağını duyurdu. Kısıtlamaların savaştan sonra yeniden yürürlüğe girip girmeyeceği henüz belli değil, ancak şimdilik, gemi tasarlama ve inşa etme konusunda kendimizi antlaşma yükümlülüklerine bağlı görmemeliyiz."
 MTG_naval_treaty.11.t:0 "Denizcilik Antlaşması Feshedildi"
 MTG_naval_treaty.2.a:0 "Bir başka silahlanma yarışı önlendi."
 MTG_naval_treaty.2.desc:0 "[From.GetLeader] hükûmeti, donanma yeniden silahlanmasında karşılıklı bir sınırlamayı kabul etti. Antlaşmanın mürekkebi zar zor kururken, bir Kontrol Komisyonu tüm yeni inşaatların antlaşma kısıtlamalarına uyduğunu onaylamak için çalışmalarına başladı."
 MTG_naval_treaty.2.t:0 "[From.GetNameDefCap] Deniz Silahsızlanma Antlaşmasını İmzalıyor"
 MTG_naval_treaty.3.a:0 "\"Karmakarışık\" çok güçlü bir kelimedir."
 MTG_naval_treaty.3.desc:0 "[From.GetNameDef] heyeti, \"diğer tarafın [From.GetNameDef] ülkesinin karşı karşıya bulunduğu siyasi ve stratejik gerçekleri tanımayı bütünüyle reddetmesini\" gerekçe göstererek müzakereleri terk etti.\n\nSilahlanma denetimi hedefinin açıkça başarısızlığa uğraması üzerine birçok gözlemci, antlaşmanın diğer taraflarının silahlanma sınırlamalarına daha ne kadar bağlı kalacağını sorguluyor."
 MTG_naval_treaty.3.t:0 "[From.GetNameDefCap] müzakereleri kesiyor"
 MTG_naval_treaty.4.a:0 "Bu önlemlerin ne olduğunu öğrenmemeyi tercih ederiz."
 MTG_naval_treaty.4.b:0 "Şeffaf bir blöf."
 MTG_naval_treaty.4.desc:0 "Ülkemizin [From.GetAdjective] büyükelçisi bugün [This.GetLeader]'den hükümetinden bir notu teslim etmesini istedi. Devam eden deniz genişlememizi büyük bir endişeyle izliyorlar ve artık donanmamızı \"bölgede istikrarı bozan bir faktör\" olarak görüyorlar. \n\nMevcut deniz genişletme programımıza devam edersek, not şöyle devam ediyor: [From.GetAdjective] hükümet olası tüm önlemleri değerlendirmek zorunda kalacak."
 MTG_naval_treaty.4.t:0 "[From.GetNameDefCap] sert bir uyarı yayınlıyor"
 MTG_naval_treaty.5.a:0 "Şimdi bakalım buna uyacaklar mı."
 MTG_naval_treaty.5.desc:0 "[From.GetAdjective] hükûmetine verdiğimiz kesin mesajın istenen etkiyi yarattığı açıkça görülüyor. Uzun bir gece süren iç müzakerelerin ardından, büyükelçimize [From.GetLeader] tarafından, donanma bakanının huzurunda, kabinenin [From.GetNameDef]'i bir dizi ana gemiyi hurdaya çıkarmaya ve gelecekte sadece yıpranmış gemiler için yedek parça finanse etmeye zorlayacak bir donanma harcamalarında azalmayı onayladığı temin edildi."
 MTG_naval_treaty.5.t:0 "[From.GetNameDefCap] silahsızlanmayı taahhüt ediyor"
 MTG_naval_treaty.6.a:0 "Bakalım [From.GetAdjective] gemileri [Root.GetAdjective] çeliği olmadan ne kadar iyi yüzüyor."
 MTG_naval_treaty.6.b:0 "Antlaşmalar, onları sürdürme iradesi kadar güçlüdür..."
 MTG_naval_treaty.6.desc:0 "[From.GetNameDef]'in dışişleri bakanıyla yapılan görüşme umduğumuz kadar iyi gitmedi. Büyükelçimize göre, [From.GetAdjective] Hükûmeti, yayınlayabileceğimiz herhangi bir uyarıyı reddetmeye zaten karar vermişti. Buna göre kendisine, [From.GetLeader] hükûmetinin şu anda tartışılacak bir şey olduğuna inanmadığını belirten basit bir not sunuldu."
 MTG_naval_treaty.6.t:0 "[From.GetNameDefCap] Uyarıyı reddediyor"
 MTG_naval_treaty.7.a:0 "Antlaşmadaki kendi katılımımızı gözden geçirmeliyiz."
 MTG_naval_treaty.7.desc:0 "[From.GetLeader] bugün, [From.GetNameDef]'in artık imzaladığı denizcilik antlaşmalarına bağlı kalmayacağını duyurdu. Dünya durumunun, dedi, seçimi kaçınılmaz kıldığını söyledi. [From.GetNameDefCap], görünüşe göre birkaç komşu ülkenin bölgedeki meşru [From.GetAdjective] çıkarlarını tehdit eden agresif donanma genişletme programlarına başladığına dair güvenilir raporlar aldı.\n\n[From.GetAdjective] Amiralliği, şu anda yapım aşamasında olan birkaç geminin zaten antlaşma kısıtlamaları düşünülmeden planlandığı söylentileri hakkında yorum yapmayı reddetti."
 MTG_naval_treaty.7.t:0 "[From.GetNameDefCap] Denizcilik Antlaşmasını terk ediyor"
 MTG_naval_treaty.8.a:0 "Başından beri başarısızlığa mahkum bir fikir."
 MTG_naval_treaty.8.b:0 "Doğru seçimi yaptık."
 MTG_naval_treaty.8.c:0 "Bu yeni bir Dreadnought Yarışının başlangıcı mı?"
 MTG_naval_treaty.8.desc:0 "Sadece iki ulusun hala Londra Denizcilik Antlaşması'na bağlı kalmasıyla, onlardan birinin antlaşmayı terk etmesi ve böylece onu tamamen sona erdirmesi sadece bir zaman meselesiydi. [From.GetNameDef] hükûmeti, antlaşmanın belirtilen amacında artık etkili olmadığına ve donanma silahlanmalarını kısıtlamanın ulusal güvenliğe bir tehdit olduğuna açıkça karar verdi.\n\nDünya çapında birçok uzman şimdi, birçok ülkenin on yıllardır süren katı antlaşma kısıtlamalarını telafi etmek isteyeceği için donanma bütçelerinde hızlı bir artış öngörüyor."
 MTG_naval_treaty.8.t:0 "Londra Denizcilik Antlaşması'nın Sonu"
 MTG_naval_treaty.9.a:0 "Bu, barışı herhangi bir Süper-Zırhlıdan daha iyi koruyacaktır!"
 MTG_naval_treaty.9.b:0 "Neden kendilerini böyle kısıtlasınlar ki?"
 MTG_naval_treaty.9.c:0 "O zaman ordu için daha fazla para."
 MTG_naval_treaty.9.d:0 "Donanmaları kim takar ki..."
 MTG_naval_treaty.9.desc:0 "Britanya, Fransa, İtalya, Japonya ve ABD'den heyetler, kruvazörlerin ve denizaltıların sayısını ve boyutunu kısıtlayan Birinci Londra Denizcilik Antlaşması'nın yenilenmesini görüşmek üzere Aralık 1935'te bir araya geldi. Müzakereler, İtalya'nın Etiyopya'daki savaşı ve Japonya'nın Britanya ve ABD'ye eşit görülme arzusu üzerine oldukça hararetli geçti.\n\nŞimdi müzakereler sona erdiğinde, imzacı uluslar başka bir yıkıcı silahlanma yarışını önleme umuduyla zırhlıların ve uçak gemilerinin boyutuna sınırlar getirmeyi kabul ettiler."
 MTG_naval_treaty.9.t:0 "İkinci Londra Denizcilik Antlaşması imzalandı"
 USA_hilt_candidate:0 "\n\n Kafa karışıklığına ek olarak, daha önce siyasi olarak bilinmeyen, dünyaca ünlü Hilt & Partner mimarlık firmasının başkanı olan - eskiden Berlin'den ama Alman İç Savaşı sırasında Brownow, Arkansas'a tahliye edilen - Bay Adam Hilt, yakın zamanda doğduğu ülkeye hizmet etme isteğini alenen duyurdu. Bazı muhalifler, Bay Hilt'in belirgin Alman aksanı hakkında sorular sordular, Bay Hilt bunun Almanya'da uzun yıllar sanat çalışması ve okumasından kaynaklandığını iddia ediyor. Hilt'e göre, bu tür küçük ayrıntılar sadece büyük sorunlardan dikkat dağıtmaya hizmet ediyor ve bir vatansevere ve doğal doğumlu bir vatandaşa iftira atmak için korkakça girişimlerden başka bir şey değil."
 USA_lindbergh_candidate:0 "\n\n Son savaşa giden yolda ülkeye yaptığı hizmetlere ve genel olarak havacılığa atıfta bulunan ünlü havacı Charles Lindbergh de yarışa katıldı. İki ana adayın bölücü doğasına dikkat çeken Lindbergh, ülkeyi birleştirmek ve farklılıklarının üstesinden gelip eski büyüklüğüne geri dönmesi için ilham verecek en iyi kişi olduğuna inanıyor."
 broken_naval_treaty_opinion_mod:0 "Antlaşma Yaptırımlarını Görmezden Geldi"
 citizen_militia_tt:0 "Eyaletteki Vatandaşlar, savaş patlak verdiğinde aktif hale gelecek Milis Birimleri oluşturur."
