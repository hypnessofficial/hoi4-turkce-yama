 mexico.1.a:0 "Hain!"
 mexico.1.desc:0 "Bir süredir, generaller ve valiler, merkezi hükûmetin asi kaudilloları kontrol altında tutmada daha iyi hale gelmesiyle kişisel güçlerinin dağıldığını gördüler. Meksika'nın bölgesel savaş ağaları tarafından yapılan isyanlar tarihi sona eriyor gibiydi. Ne yazık ki, San Luis Potosi'den General Cedillo'ya karşı harekete geçemedik ve o, merkezi hükûmeti devirmek, [Root.GetLeader]'i tahttan indirmek ve parmaklarının arasından daha fazla güç kaymasını önlemek için yeterli sayıda affedilmiş isyancı ve acımasız haydutun hizmetini elinde tuttu."
 mexico.1.title:0 "General Cedillo İsyan Ediyor"
 mexico.10.a:0 "[Root.GetLeader] teklifi kabul ediyor."
 mexico.10.b:0 "Amerikalılar böyle bir plana müsamaha göstermeyecektir."
 mexico.10.desc:0 "[From.GetLeader], [Root.GetNameDef]'i [From.GetFactionName]'e katılmaya davet etti. Bu sağ kanat ülkeler bloğu, Latin Amerika'yı Komünist sızmasından korurken, yozlaşmış Yankilerden bağımsız bir yol izleyecektir."
 mexico.10.title:0 "[From.GetFactionName]"
 mexico.11.a:0 "[Root.GetLeader] teklifi kabul ediyor."
 mexico.11.b:0 "Amerikalılar böyle bir plana müsamaha göstermeyecektir."
 mexico.11.desc:0 "[From.GetLeader], [Root.GetNameDef]'i [From.GetFactionName]'e katılmaya davet etti. Bu sol kanat ülkeler bloğu, Latin Amerika'yı Faşist tiranlığından korurken, baskıcı Yankilerden bağımsız bir yol izleyecektir."
 mexico.11.title:0 "[From.GetFactionName]"
 mexico.12.a:0 "[Root.GetLeader] teklifi kabul ediyor."
 mexico.12.b:0 "O toprak bir donanma üssü olarak kullanışlı."
 mexico.12.desc:0 "[From.GetLeader], [Root.GetNameDef]'in bazen Belize olarak da adlandırılan küçük Britanya Hondurası toprağını satmasını talep etti. İspanyol imparatorluğu bölgeyi talep etti ancak hiç yerleşmedi, bu yüzden Meksika'nın toprağa pek gerçek bir iddiası yok. Ancak, iyi niyet göstergesi olarak toprağı Meksikalı dostlarımıza satabiliriz."
 mexico.12.title:0 "Britanya Hondurası'nın Satışı"
 mexico.13.a:0 "[From.GetNameDef] gerçekten de bizim dostumuz."
 mexico.13.desc:0 "[From.GetLeader], iyi niyet göstergesi olarak eski Britanya Hondurası sömürgesinin kontrolünü bize devretmeyi kabul etti. Devlet küçük, gelişmemiş ve kereste dışında doğal kaynaklardan yoksundur, ancak bu Meksika'nın uluslararası sahnedeki artan konumunu gösteriyor."
 mexico.13.title:0 "Britanya Belize'yi Devrediyor"
 mexico.14.a:0 "Belki de [From.GetAdjective]ler sonuçta dostumuz değildir."
 mexico.14.desc:0 "[From.GetLeader], Britanya Hondurası sömürgesini bize satmayı reddetti. Bir donanma üssü olarak kullanışlılığını gerekçe gösteren [From.GetAdjective] hükûmeti, sömürgeyi elinde tutmayı tercih ettiğini belirtiyor. Sakinlerin çoğu İngilizce konuşuyor, bu yüzden ret hayal kırıklığı yaratsa da anlaşılabilir."
 mexico.14.title:0 "Britanya Belize'nin Satışını Reddediyor"
 mexico.15.a:0 "Requiescat in pace."
 mexico.15.b:0 "Cehennemde yan, hain."
 mexico.15.desc:0 "Meksika Şehri Başpiskoposu, Çok Muhterem Pascual Díaz y Barreto, bugün kolit nedeniyle vefat etti. 59 yaşındaydı. Mirası, hükûmetin sosyalist politikalarına sert bir muhalefetle birlikte, Cristero Savaşı'nın sonuna doğru uzlaşma girişimleridir.\n\nHalefi, bir sosyal reformcu ve Başkan Cárdenas'ın kişisel dostu olan Luis María Martínez'dir. Halef muhtemelen Papa tarafından Meksika'da Kilise ve hükûmet arasında devam eden barışı sağlamak için seçildi."
 mexico.15.title:0 "Başpiskopos Pascual Díaz Vefat Etti"
 mexico.16.a:0 "Kabul edilemez! Bu sömürü etik dışıdır ve sona ermelidir!"
 mexico.16.b:0 "İşte bu kapitalizm."
 mexico.16.desc:0 "Petrol işçileri 1935'te Başkan Cárdenas'ın onayıyla sendikalaştı ve Sindicato Único de Trabajadores Petroleros'u kurdu. Hemen daha yüksek ücretler ve daha iyi çalışma koşulları müzakere etmeye başladılar, ancak Royal Dutch Shell ve Standard Oil of California gibi güçlü uluslararası petrol firmaları tarafından reddedildiler. Mesele bir tahkim komitesine geçti ve sonunda mahkemelere gitti, yanan soru petrol firmalarının daha yüksek ücretleri karşılayıp karşılayamayacağıydı.\n\nSon araştırmalara göre, Meksika yan kuruluşları Amerika Birleşik Devletleri'ndeki petrol şirketlerinden bile daha fazla kar ediyor, ancak hala işçilerle bir anlaşmaya varmayı reddediyorlar. Görünüşe göre güçlü bölgesel ağaların desteğine sahipler ve kendilerini yasanın üstünde görüyorlar."
 mexico.16.title:0 "Petrol İşçisi Grevi"
 mexico.17.a:0 "Biz Stalin'in kuklası değiliz, ona sığınma hakkı verin."
 mexico.17.b:0 "Devrimci devlete karşı işlediği suçlar için yargılanmak üzere onu Sovyetler Birliği'ne iade edin."
 mexico.17.c:0 "O bir organizasyon dehası, onu hükûmete katılmaya davet edin."
 mexico.17.desc:0 "Stalin'in yükselişine karşı çıktığı için Sovyetler Birliği'nden sürgün edilen, askeri aksaklıklardan endüstriyel kazalara kadar her türlü sorundan sorumlu tutulan ve siyasi baskıyla ülkeden ülkeye sürülen Komünist devrimci ve yazar Lev Troçki, bir petrol tankerinde Norveç'ten yaptığı bir yolculuktan sonra Meksika'ya geldi."
 mexico.17.title:0 "Troçki Geliyor"
 mexico.18.a:0 "Bu anayasa reformu ülkenin istikrarı için elzemdir."
 mexico.18.b:0 "Saçmalık! [Root.GetLeader] en iyisini bilir, ikinci bir dönem hizmet edecektir!"
 mexico.18.desc:0 "Bir sonraki Başkan için seçim kampanyası önümüzdeki birkaç gün içinde başlayacak. 1933 anayasa reformu, Calles'in ikinci bir dönem başkan olma fikrine yönelik öfkeye yanıt olarak getirildi ve böyle bir ikinci dönem arayan Calles'in selefi Álvaro Obregón'un açıkça suikasta kurban gitmesinden sonra. Bu reform, bir seçilmiş yetkilinin, sadece geçici veya vekil bir bakıcı olsa bile, iki kez hizmet etmesini engeller. Bu, diktatör Porfirio Díaz'ın otuz yıllık bir sürede yedi dönem hizmet ettiği ve 1910 Meksika Devrimi'ne ilham vererek ülkeyi on yıllık bir iç çekişmeye sürükleyen Porfiriato'nun tekrarını önlemeye yardımcı olur.\n\nBu yasanın, parti dışındaki himaye ağlarını sürdürmeyi zorlaştırma faydası vardır, ancak aynı zamanda yetkililerin seçmenlere doğrudan sorumlu olmasını da engeller, çünkü dönemlerinden sonra farklı bir hükûmet kademesine geçecekler ve bu da onları parti içindeki himayeye bağımlı hale getirecektir."
 mexico.18.title:0 "Seçim Kampanyası Başlıyor"
 mexico.19.a:0 "Francisco Múgica, Devrimci general ve sosyal reformcu."
 mexico.19.b:0 "Manuel Ávila Camacho, Gazi Genelkurmay Başkanı."
 mexico.19.c:0 "Saturnino Cedillo, sağcı kaudillo."
 mexico.19.d:0 "Juan Andreu Almazán, sağcı iş adamı."
 mexico.19.desc:0 "[Root.GetLeader]'in halefi parti içinde tartışılıyor. Meksika'da rekabetçi seçimler hala sallantılı bir zeminde ve iktidardaki [Root.GetRulingPartyLong], ordu ve güvenlik güçleriyle koordinasyon içinde, genel seçimi kesinlikle kazanacaktır."
 mexico.19.e:0 "Vicente Lombardo, radikal sendikacı."
 mexico.19.f:0 "Francisco Múgica, Devrimci general ve sosyal reformcu."
 mexico.19.g:0 "Manuel Ávila Camacho, Gazi Genelkurmay Başkanı."
 mexico.19.h:0 "Juan Andreu Almazán, sağcı iş adamı ve general."
 mexico.19.i:0 "Vicente Lombardo, radikal sendikacı."
 mexico.19.j:0 "Francisco Múgica, Devrimci general ve sosyal reformcu."
 mexico.19.k:0 "Dionisio Encina, Stalinist parti sadığı."
 mexico.19.l:0 "Hernán Laborde, Troçkist parti lideri."
 mexico.19.m:0 "Lev Troçki, Ekim Devrimi'nin kahramanı."
 mexico.19.n:0 "Saturnino Cedillo, Devrimci general ve devam adayı."
 mexico.19.o:0 "Juan Andreu Almazán, sağcı iş adamı ve Devrimci general."
 mexico.19.p:0 "Jesús Degollado Guízar, Cristero generali."
 mexico.19.q:0 "Salvador Abascal, katı Sinarkist lider."
 mexico.19.r:0 "Valentín Campa, Laborde'ye yakın bir demiryolu sendikalisti."
 mexico.19.title:0 "[Root.GetRulingParty] Halefi"
 mexico.2.a:0 "Bu bir emrivaki, yapabileceğimiz bir şey yok."
 mexico.2.b:0 "Akılları başlarına gelene kadar Meksika ile ticarete ambargo koyacağız."
 mexico.2.c:0 "Seçeneklerimiz sınırlı ve silah gücü düşünülmelidir."
 mexico.2.desc:0 "[From.GetLeader], Meksika'daki ekonomik çıkarlarımıza yönelik popülist saçmalıklar yayıyor ve şimdi [From.GetRulingPartyLong], Royal Dutch Shell, Standard Oil of California ve diğer birçok uluslararası petrol firmasının varlıklarını millileştirmek için bir yasa çıkardı! Anayasaları bu eyleme izin verse de, uluslararası adalet firmaların uğradığı kayıplar için tazminat talep ediyor. Petrol baronları harekete geçmemizi talep ediyor."
 mexico.2.title:0 "[From.GetAdjective] Petrolü Millileştirildi"
 mexico.20.a:0 "Hadi, Yankilere koş."
 mexico.20.desc:0 "Sağcı iş adamı ve Devrimci general Juan Andreu Almazán, son seçimin sonucunu kınadı. Desteğinin daha büyük olduğunu ve [Root.GetLeader]'in sadece sonucu manipüle ederek kazandığını iddia ediyor. Bu doğru olabilirse de, Juan Andreu kesinlikle mızıkçı bir kaybeden gibi davranıyor. Amerika'da kendi kendine sürgüne gitti ve [Root.GetRulingPartyLong]'a karşı bir darbe girişimi organize etmeye çalışıyor. Amerika ile iyi ilişkileri sürdürmek akıllıca olacaktır."
 mexico.20.title:0 "Juan Andreu Seçimi Kınıyor"
 mexico.21.a:0 "Ondan bir itiraf alıp vurun! Tümgeneral Blokhin'i çağırın!"
 mexico.21.desc:0 "Birkaç ay önce Meksika hükûmeti tarafından sığınma sözü verilmiş olmasına rağmen, ülkeye varışında Lev Troçki kendisini [From.GetRulingPartyLong]'un devlet güvenliği tarafından tutuklanmış buldu ve devrimci devlete karşı işlediği birçok suç için yargılanmak üzere derhal Sovyetler Birliği'ne geri gönderildi. [From.GetLeader] ayrıca gelecekte Meksika ve Sovyetler Birliği'nin daha yakın ilişkilerden keyif alabileceği umudunu dile getirdi."
 mexico.21.title:0 "Meksika Troçki'yi İade Ediyor"
 mexico.22.a:0 "Dasvidaniya."
 mexico.22.desc:0 "Sovyetler Birliği'ndeki artan anti-Stalinist duyguların ardından, o ülkenin yönetici kliği Troçki'yi sürgünden geri çağırmaya ve onu hükûmetin tepesinde bir figüran olarak yerleştirmeye karar verdi. İstihbarat personelimiz onun büyük ölçüde Rusya içindeki diğer güçlerin bir kuklası olacağını öne sürüyor, ancak Lev Troçki Ekim Devrimi'nin doğduğu yere dönmekte kararlı."
 mexico.22.title:0 "Lev Troçki SSCB'ye Geri Dönüyor"
 mexico.23.a:0 "Düşmanlarımızla ticaret yapmak, açıkça savaşçılıkla eşdeğerdir."
 mexico.23.b:0 "Gereğinden fazla düşman edinmesek iyi olur."
 mexico.23.desc:0 "Düşman konvoy koruması zayıflamış ve denizaltılarımız okyanuslarda rahatsız edilmeden dolaşırken, izole ticari gemileri neredeyse istediğimiz gibi yok edebiliyoruz. Denizaltı kaptanlarımız bunlara 'Mutlu Zamanlar' demeye başladı. Tarafsız Meksika petrol tankerleri gibi birçok cazip hedef var. Amirallerimiz bu tankerlere saldırmak için izin istiyor, ancak dışişleri bakanlığı bunun Meksika ile ilişkiler üzerinde olumsuz sonuçları olabileceği konusunda uyarıyor."
 mexico.23.title:0 "Sınırsız Denizaltı Savaşı"
 mexico.24.a:0 "Hak ettiğini bulacaksın, [From.GetLeader]."
 mexico.24.b:0 "Ne yapabiliriz ki?"
 mexico.24.desc:0 "Meksika petrol tankerleri 'Potrero del Llano' ve 'Faja de Oro', 'sınırsız denizaltı savaşı' doktrini altında faaliyet gösteren Alman kurt sürüleri tarafından Karayipler'in dibine gönderildi. Tarafsız gemilere yapılan bu saldırı bir savaş eylemidir. Denizde karşılaştığımız Alman gemilerine saldırmak hakkımızdır.\n\nAyrıca Almanlarla savaşan Amerikan fraksiyonuna katılmayı da düşünmeliyiz. Bu, Yankileri bize borçlu bırakacak ve dünyaya Meksika'nın uluslararası bir oyuncu olduğunu gösterecektir."
 mexico.24.title:0 "Alman U-Bot Saldırıları"
 mexico.25.a:0 "Ufak da olsa her yardımın faydası olur."
 mexico.25.b:0 "Meksikalılardan kesinlikle daha iyi müttefikler bulabiliriz."
 mexico.25.desc:0 "[From.GetLeader], Almanların sınırsız denizaltı savaşı politikasının, Meksika açıklarında seyreden birkaç tarafsız Meksika petrol tankerini batırmasıyla sonuçlanmasının ardından Almanya'ya karşı savaşa katılmak istiyor."
 mexico.25.title:0 "Meksika İttifak Arıyor"
 mexico.26.a:0 "Meksika bunun için savaşa girmekte tamamen haklıdır."
 mexico.26.b:0 "Meksika'nın ordusu var mı ki?"
 mexico.26.c:0 "Tarafsız gemiciliğe saldırı, savaş yasalarına göre ağır bir suçtur."
 mexico.26.desc:0 "[From.GetLeader], Meksika Başkanının Almanya'ya karşı savaşta destek teklifini memnuniyetle karşıladı. Alman kurt sürüleri yakın zamanda tarafsız Meksika petrol tankerleri 'Potrero del Llano' ve 'Faja de Oro'yu batırdı, bu sivil can kaybıyla sonuçlanan bir savaş eylemiydi ve Meksika hükûmeti Karayipler'deki Alman U-bot faaliyetinin tamamen sona erdirilmesini istediğini belirtti.\n\nMeksika hükûmeti bir süredir dünya güçlerinden daha fazla tanınma arıyordu ve Amerika'ya ve [From.GetFactionName]'e destek vermenin uluslararası bir oyuncu olduklarını kanıtlayacağına inanıyorlar."
 mexico.26.title:0 "Meksika [From.GetFactionName]'e Katılıyor"
 mexico.27.a:0 "Kilise karşıtı şiddetin sona ermesi iyi oldu."
 mexico.27.b:0 "Batıl inanç propagandası, bu ihanetin yayınlanmasını önleyin!"
 mexico.27.desc:0 "Papa XI. Pius, Meksika durumuna değinen bir Papalık Genelgesi yayınladı. Cristiada müzakere masasında çözülmüş ve açık kan dökülmesi sona ermiş olsa da, Kilise hala Meksika'nın gittiği yön konusunda endişeli.\n\nGenelge, Meksikalı seçmenleri seçimlerde dini adayların yanında yer almaya teşvik ediyor ve Katolik Eylem gibi Meksikalı dini partileri, daha fazla devrimci şiddeti önlemek için yoksulluk gibi sosyal sorunları ele almaya çağırıyor."
 mexico.27.title:0 "Firmissimam Constantiam"
 mexico.28.a:0 "Bu ihaneti daha önce kökünden kazımalıydık!"
 mexico.28.desc:0 "Hain Kiliseye yönelik saldırılarımız anlaşılan yeterince şiddetle gerçekleştirilmemiş. Hainler, onlara verdiğimiz özgürlüğü bir darbe girişimi organize etmek için kullanmakla meşgullerdi. Yıllar önce haklı olarak yendiğimiz beyhude Cristero Savaşı'nı hatırlayarak, bu batıl inançlı aptallar haçlı sancaklarını kaldırdılar ve yalancı rahiplerin arkasında toplandılar ve şimdi modernleşmeye doğru attığımız ilerlemeyi geri almaya çalışıyorlar."
 mexico.28.title:0 "Dini Ayaklanma"
 mexico.29.a:0 "Bunak rahiplerin liderliğindeki saf aptalları katletmek kolay olacak."
 mexico.29.b:0 "'Yaşasın Kral İsa ve Kutsal Guadalupe Meryemi!'"
 mexico.29.c:0 "Meksika durumu bir dışarının anlaması için çok karmaşık görünüyor."
 mexico.29.desc:0 "Meksika'da Kilise ve Devrim güçleri bir kez daha çatışmaya girdi. Hükûmetin Kiliseye yönelik saldırılarını yenilemesiyle, kuşatılmış Katolik partiler ve sosyal hareketler Meksika'nın kontrolünü ele geçirmek için silahlı bir isyan başlatıyor. Cristero milisleri on yıllık bir hareketsizlikten sonra yeniden oluşuyor ve federal ordudan ayrılanlarla destekleniyor. Birkaç kırsal eyaleti ele geçirdiler ve bunları faaliyet göstermek için bir üs olarak kullanıyorlar.\n\nİlk Cristiada, üst düzey Devrimci ve Kilise yetkilileri arasında Amerikan hükûmetinin arabuluculuğu sayesinde müzakere edilen bir anlaşmayla sona erdi, ancak bu şiddetin ancak savaşanlardan birinin tamamen yok edilmesiyle sona ermesi muhtemel görünüyor."
 mexico.29.title:0 "İkinci Cristiada"
 mexico.3.a:0 "Meksika halkı buna katlanmayacak!"
 mexico.3.desc:0 "Petrol imtiyazlarımızı millileştirmemize yanıt olarak, [From.GetLeader], petrol şirketlerinin taleplerini kabul etmeye karar verdi ve ülkemize bir ambargo koydu. [From.GetNameDef] artık bizimle kaynak alıp satmayacak. Ya petrol firmalarını tazmin etmeyi ya da uluslararası statükoyu terk edip servetimizi liberal kapitalizmin düşmanlarıyla aramayı düşünmeliyiz."
 mexico.3.title:0 "[From.GetAdjective] Ambargosu"
 mexico.30.a:0 "'Bu sizin saatiniz ve karanlığın gücü.'"
 mexico.30.desc1:0 "Yendiğimizi sandığımız kötü adamlar, Tanrı'nın Hizmetkarlarına karşı son, beyhude bir savaş için toplandılar. Plutarco Calles ve onun zalim 'devrimci' uşakları gibi Şeytan'ın ajanları, İmanlıları şişlemek için tüfekler ve süngülerle donanmış kötülük yuvalarından akıyorlar. Mesih'in Vücuduna yapılan bu saldırıyı bastırmalıyız, yoksa dindarlık ateşini canlı tutmak ve artırmak için yaptığımız iş sona erecek ve Kurtarıcımız ve Kralımızın yasalarının yirmi asırlık bilgisi unutulacaktır."
 mexico.30.desc2:0 "Yendiğimizi sandığımız kötü adamlar, Tanrı'nın Hizmetkarlarına karşı son, beyhude bir savaş için toplandılar. Vicente Lombardo ve onun zalim 'devrimci' uşakları gibi Şeytan'ın ajanları, İmanlıları şişlemek için tüfekler ve süngülerle donanmış kötülük yuvalarından akıyorlar. Mesih'in Vücuduna yapılan bu saldırıyı bastırmalıyız, yoksa dindarlık ateşini canlı tutmak ve artırmak için yaptığımız iş sona erecek ve Kurtarıcımız ve Kralımızın yasalarının yirmi asırlık bilgisi unutulacaktır."
 mexico.30.title:0 "Ateist Ayaklanması"
 mexico.31.a:0 "Yaşasın Kral İsa ve Kutsal Guadalupe Meryemi!"
 mexico.31.b:0 "Bunak rahiplerin liderliğindeki saf aptalları katletmek kolay olacak."
 mexico.31.c:0 "Meksika durumu bir dışarının anlaması için çok karmaşık görünüyor."
 mexico.31.desc:0 "Meksika'da Kilise ve Devrim güçleri bir kez daha çatışmaya girdi. Katolik partiler ve sosyal hareketler güç kazanırken, laik güçler hükûmetin kontrolünü geri almak için silahlı bir isyan başlatıyor. 'Kızıl Tugaylar' on yıllık bir hareketsizlikten sonra yeniden oluşurken, federal ordudan ayrılanlar hala Kilise karşıtı valiler tarafından kontrol edilen eyaletlerde toplanıyor.\n\nCristiada, üst düzey Devrimci ve Kilise yetkilileri arasında Amerikan hükûmetinin arabuluculuğu sayesinde müzakere edilen bir anlaşmayla sona erdi, ancak bu şiddetin ancak savaşanlardan birinin tamamen yok edilmesiyle sona ermesi muhtemel görünüyor."
 mexico.31.title:0 "İkinci Meksika Devrimi"
 mexico.32.a:0 "Bu pek olası görünmüyor. Bu ajanlara ne kadar ödüyoruz?"
 mexico.32.b:0 "Yine de zoot suit giyenleri tutuklayın. Ayaklanmalar savaş çabamıza bir tehdittir."
 mexico.32.desc:0 "Abartılı kıyafetler giyen Hispanik gençler - 'zoot suit'ler - Los Angeles'ta bir gencin ölümü üzerine yapılan sansasyonel haberlerden kaynaklanan, Güney'deki sınır şehirlerinde ırksallaştırılmış isyanların hedefi oldu. Olayla ilgili dokuz Meksikalı-Amerikalı genç cinayetten mahkum edildi.\n\nİstihbarat ajanları, zoot suit giyenlerin aslında faşist ajanlar olduğunu, Meksika'daki aşırı Katolik Sinarquistalarla işbirliği yaparak Amerika'ya bir Japon-Alman işgaline yardım ettiklerini belirten raporlar derlediler."
 mexico.32.title:0 "'Zoot Suit' Ayaklanmaları"
 mexico.33.a:0 "Sinarquistalar hem Amerika hem de Meksika için bir tehdittir."
 mexico.33.b:0 "Onlar sadece çocuklar! Bu bir adaletsizlik!"
 mexico.33.desc:0 "Abartılı kıyafetler giyen Hispanik gençler - 'zoot suit'ler - Kuzeyimizdeki sınır şehirlerinde, Los Angeles'ta bir gencin ölümü üzerine yapılan sansasyonel haberlerden kaynaklanan ırksallaştırılmış isyanların hedefi oldu. Olayla ilgili dokuz Meksikalı-Amerikalı genç cinayetten mahkum edildi.\n\nAmerikan istihbarat ajanları, zoot suit giyenlerin aslında faşist ajanlar olduğunu, Meksika'daki aşırı Katolik Sinarquistalarla işbirliği yaparak Amerika'ya bir Japon-Alman işgaline yardım ettiklerini belirten raporlar derlediler."
 mexico.33.title:0 "'Zoot Suit' Ayaklanmaları"
 mexico.34.a:0 "Bu anlaşma hem Almanya'ya hem de Meksika'ya yardımcı olacaktır."
 mexico.34.b:0 "Gönderdiğimiz herhangi bir tasarım muhtemelen Amerikalıların eline geçecektir."
 mexico.34.desc:0 "[From.GetLeader], eğer [Root.GetLeader] geliştirdiğimiz en son hafif ve orta tank tasarımlarını Meksika'ya göndermeyi kabul ederse, Almanya ile bir ticaret anlaşması teklif etti. Bu, daha yakın Meksika-Alman ilişkilerinin ilk aşaması gibi görünüyor, bu yüzden askeri bir amacı olmasa bile jeopolitik olarak bizim için yararlı olabilir. Elbette, bu son teknoloji tank tasarımları gelecekteki bir düşmanın eline geçebilir..."
 mexico.34.title:0 "Meksika Kaynak Değişimi"
 mexico.35.a:0 "Çok iyi."
 mexico.35.desc:0 "[From.GetLeader], en son Alman hafif ve orta tank tasarımları için bize lisans vermeyi kabul etti. Bu, umarım daha yakın Meksika-Alman ilişkilerinin ilk aşaması olarak hizmet edecek ve aynı zamanda yararlı bir askeri bilgi olacaktır."
 mexico.35.title:0 "Alman Tank Tasarımları"
 mexico.36.a:0 "Kahretsin."
 mexico.36.desc:0 "Almanya'nın gelişmiş tank tasarımlarının düşman eline geçme olasılığını gerekçe gösteren [From.GetLeader], bir kaynak değişimi teklifimizi reddetti. Yerli tank tasarımları geliştirmek veya Almanlara lisansları için ödeme yapmak zorunda kalacağız..."
 mexico.36.title:0 "Almanya Teklifi Reddediyor"
 mexico.4.a:0 "Güzel, bu şartlarda ticaret yapabiliriz."
 mexico.4.b:0 "Ambargoyu yerinde tutun, daha iyi bir anlaşma için direniyoruz."
 mexico.4.desc:0 "[From.GetLeader] hükûmeti, petrol sahalarının millileştirilmesi sırasında firmaların uğradığı kayıplar karşılığında tazminat için Royal Dutch Shell ve Standard Oil of California'dan gelen talepleri kabul etti. [From.GetNameDef] herhangi bir petrol imtiyazını geri vermeyecek olsa da, en azından ulusal prestijimiz ve mali çıkarlarımız tatmin oldu."
 mexico.4.title:0 "[From.GetAdjective] Tazminatı"
 mexico.40.a:0 "Orta Amerika, Amerikan saldırganlığına karşı güvende olacak."
 mexico.40.desc:0 "Panamá'daki Yanki üssüne yaptığımız sürpriz saldırı başarılı oldu. Emperyalistleri kovduk ve şimdi çürümüş Kuzey imparatorluğunun tepkisini bekliyoruz. Eğer kendilerini savunmalarımıza atarlarsa, onlara bedelini ödeteceğiz."
 mexico.40.title:0 "Operation Just Cause Başarılı Oldu"
 mexico.41.a:0 "Maalesef daha acil endişelerimiz var. Bir ambargo yeterli olmalı."
 mexico.41.b:0 "Egemenliğimiz tehdit edildi. Bu askeri bir yanıt gerektirir."
 mexico.41.desc:0 "Meksika diktatörü [From.GetLeader], yakındaki hazırlık alanlarından Panama Kanalı gücümüze büyük bir saldırı başlatma cüretini gösterdi. 'Operation Just Cause'ları başarılı oldu ve birliklerimiz karışıklık içinde geri çekiliyor. Meksikalılar kıta Amerika Birleşik Devletleri'ne geçmiyorlar, bu yüzden bu genel bir işgalin başlangıcı değildi, ancak saldırı dünya çapında güç yansıtma yeteneğimizi zayıflattı ve bizi uluslararası sahnede küçük düşürdü."
 mexico.41.title:0 "[From.GetAdjective] Panama Kanalı'nı Ele Geçirdi"
 mexico.42.a:0 "Orta Amerika hala Amerikan saldırganlığı tarafından tehdit ediliyor."
 mexico.42.desc:0 "Panamá'daki Yanki üssüne yaptığımız sürpriz saldırı ters gitti. Belki yeterli asker konuşlandırmadık ya da komutan basitçe beceriksizdi. Her iki durumda da, emperyalistler tarafından kovulduk ve şimdi çürümüş Kuzey imparatorluğunun tepkisini bekliyoruz. Eğer kendilerini savunmalarımıza atarlarsa, onlara bedelini ödeteceğiz."
 mexico.42.title:0 "Operation Just Cause Başarısız Oldu"
 mexico.43.a:0 "Maalesef daha acil endişelerimiz var. Bir ambargo yeterli olmalı."
 mexico.43.b:0 "Egemenliğimiz tehdit edildi. Bu askeri bir yanıt gerektirir."
 mexico.43.desc:0 "Meksika diktatörü [From.GetLeader], yakındaki hazırlık alanlarından Panama Kanalı gücümüze büyük bir saldırı başlatma cüretini gösterdi. Neyse ki, cesur birliklerimiz 'Operation Just Cause'larını püskürtmeyi ve işgalcileri geri atmayı başardı. Meksikalılar kıta Amerika Birleşik Devletleri'ne geçmiyorlar, bu yüzden bu genel bir işgalin başlangıcı değildi, ancak saldırı artık Amerika'nın efendisi olmadığımızı gösterdi ve bizi uluslararası sahnede küçük düşürdü."
 mexico.43.title:0 "[From.GetAdjective] Panama Kanalı'na Saldırısı"
 mexico.44.a:0 "Gel de al!"
 mexico.44.b:0 "Amerika'nın egemenliğine yönelik çirkin bir saldırı."
 mexico.44.c:0 "Cesur küçük... Meksika mı?"
 mexico.44.desc1:0 "[From.GetAdjective] birliklerinin Panama Kanalı'ndaki Amerikan askeri üssüne girmesinin ardından, sınırın her iki tarafındaki birlikler savaş için seferber oldu. Meksikalılar ilk saldıran taraf olsa ve stratejik olarak önemli Kanal Bölgesi'ni ele geçirseler de, küstah komşularını cezalandırmak için bir taarruz başlatmayı amaçlayanlar Amerikalılar gibi görünüyor. 'Bayağı basın', [From.GetRulingPartyLong]'u uluslararası hukuka saygısı olmayan bir haydutlar kliği olarak kınıyor ve rejim değişikliği çağrısında bulunuyor.\n\nMeksika Kesimi'nden önce gelen 1847'deki küçük sürtüşmeden çok daha büyük can kaybıyla, dağların ve çöllerin sert ve affetmez arazisinde bir İkinci Meksika-Amerika Savaşı çıkarsa."
 mexico.44.desc2:0 "[From.GetAdjective] birliklerinin Panama Kanalı'ndaki Amerikan askeri üssüne girdiği raporları [From.GetLeader] tarafından doğrulandı, kendisi Amerika Birleşik Devletleri'ndeki iç çalkantıların ardından Orta Amerika'daki [From.GetAdjective] çıkarlarını korumak için hareket ettiğini iddia ediyor. [From.GetRulingPartyLong] propaganda bakanlığı, bölgedeki kalan tüm Amerikan askerlerinin silahlarını bırakmasını ve Kanal Bölgesi'ndeki 'barışçıl güç devrini' saygıyla karşılamasını talep etti. Amerikan başkanı, bölgedeki ulusal çıkarları korumak için daha sert savaşmadığı ve [From.GetAdjective] saldırısını [From.GetNameDef]'e karşı genel bir seferberlikle takip etmediği için 'bayağı basın' tarafından ağır bir şekilde eleştirildi."
 mexico.44.title:0 "Meksika Panama Kanalı'nı Ele Geçiriyor"
 mexico.45.a:0 "Gel de al!"
 mexico.45.b:0 "Amerika'nın egemenliğine yönelik çirkin bir saldırı."
 mexico.45.c:0 "Meksika o kumarla büyük bir risk aldı."
 mexico.45.desc1:0 "Güney sınırındaki Amerikan birlikleri, [From.GetAdjective]'in Panama Kanalı'ndaki Amerikan askeri üssüne yönelik son saldırganlığının iki komşu arasında büyük ölçekli bir savaş olasılığını artırması nedeniyle yüksek alarma geçirildi. [From.GetLeader]'in sürpriz saldırısı başarısız olsa da, Amerikan başkanının küstah Güney komşusunu cezalandırmaya karar verdiği bildiriliyor. 'Bayağı basın', [From.GetRulingPartyLong]'u uluslararası hukuka saygısı olmayan bir haydutlar kliği olarak kınıyor ve rejim değişikliği çağrısında bulunuyor.\n\nMeksika Kesimi'nden önce gelen 1847'deki küçük sürtüşmeden çok daha büyük can kaybıyla, dağların ve çöllerin sert ve affetmez arazisinde bir İkinci Meksika-Amerika Savaşı çıkarsa."
 mexico.45.desc2:0 "Güney sınırındaki Amerikan birlikleri, [From.GetAdjective]'in Panama Kanalı'ndaki Amerikan askeri üssüne yönelik son saldırganlığının çoğu gözlemci için bir sürpriz olması nedeniyle yüksek alarma geçirildi, ancak Latin Amerika'daki bazı uzmanlar [From.GetAdjective]'in Orta Amerika devletlerine yönelik saldırılarının nihayetinde bölgedeki karşıt çıkarlar nedeniyle Amerika ile çatışmalarla sona ereceği konusunda uyarıda bulunmuşlardı. [USA.GetLeader], Kanal'ın ele geçirilmesinin ardından Meksika'ya ambargo koydu ancak aksi takdirde askeri eylemden kaçındı. Böyle bir yol, saldırgan [From.GetRulingPartyLong] hükûmetini uzlaştırmaya yardımcı olabilir veya belki de onları daha fazla eylemde bulunmaya teşvik edebilir."
 mexico.45.title:0 "[MEX.GetAdjective]-Amerikan Sınır Çatışmaları"
 mexico.46.a:0 "Sadık müttefiklerle, Anavatan yenilmez olacak!"
 mexico.46.b:0 "Sadece sayılar bu iddialı aptalları kurtaramaz."
 mexico.46.c:0 "Bu, daha fazla çatışmanın başlangıcı mı?"
 mexico.46.desc:0 "Meksika'nın [From.GetRulingPartyLong] partisinin Başkanı [From.GetLeader], Batı Yarımküre'de yeni bir uluslar bloğunun kurulduğunu duyurdu. [From.GetFactionName], solcu ajitasyon ve yabancı müdahalenin, bölgeyi diğer fraksiyonlara karşı güçlü bir karşı ağırlık oluşturacak şekilde yeniden düzenleyecek otokratik güçlü adamların revanşist bir ittifakının kurulmasıyla yenileceğini ilan etti."
 mexico.46.title:0 "[From.GetFactionName]"
 mexico.47.desc:0 "Meksika'nın [From.GetRulingPartyLong] partisinin Başkanı [From.GetLeader], Batı Yarımküre'de yeni bir uluslar bloğunun kurulduğunu duyurdu. [From.GetFactionName], adını şimdi bir ittifakta bir araya gelen Latin Amerika uluslarının çoğuna özgürlük kazanmada yardımcı olan bir bağımsızlık savaşçısı olan Simón Bolívar'dan alıyor. İlan ettikleri hedef, kıtanın eski Avrupa ve Amerikan imparatorlukları tarafından egemenliğine, ekonomik ve diplomatik olarak birbirine bağlı güçlü sosyalist devletler inşa ederek bir son vermektir."
 mexico.47.title:0 "[From.GetFactionName]"
 mexico.50.a:0 "[From.GetLeader], İspanyol halkının gerçek bir dostudur."
 mexico.50.desc:0 "Hedefimize desteklerini ilan eden [From.GetRulingPartyLong]'daki ideolojik kuzenlerimiz, nefret edilen düşmanımıza karşı mücadelemizde bize yardımcı olmak için bir tüfek sevkiyatı gönderdi."
 mexico.50.title:0 "Meksika Silah Sevkiyatı"
 mexico.51.a:0 "Ne israf."
 mexico.51.desc:0 "İspanyol kıyıları çevresindeki denizler, İspanyol sadıkları ve isyancılarının gemileri, İtalyan kruvazörleri, Rus denizaltıları ve hatta İç Savaşın Avrupa'ya yayılmasını önlemek amacıyla bir silah yasağını uygulamak için gönderilen Milletler Cemiyeti gemileri tarafından devriye geziliyor. Son silah sevkiyatımızın durdurulup kaybedilmesi şaşırtıcı değil."
 mexico.51.title:0 "Silah Sevkiyatı Kayboldu"
 mexico.52.a:0 "Nihayet hatalarımızı görüyoruz."
 mexico.52.b:0 "Marx'ın vizyonuna dair bizim yorumumuz tek meşru olanıdır."
 mexico.52.desc_not_trotsky:0 "[MEX.GetFactionName] kongresinde, [MEX.GetLeader], Troçki'nin Marx, Engels ve Lenin yorumunun, Stalinizm gibi Devrimin hatalı yorumları üzerindeki üstünlüğünü ilan etti. 3. Enternasyonal'in (Komintern olarak da bilinir) çöküşüyle, dünya çapındaki komünist liderler özeleştiri yapmaya davet ediliyor. Gerçek devrimci ruha karşı siyasi körlüklerini itiraf ettikten sonra, 4. Enternasyonal'e davet edilecekler ve dünya sosyalist devriminin gelişine yardımcı olacaklar."
 mexico.52.desc_trotsky:0 "[MEX.GetFactionName] kongresinde, [MEX.GetLeader], kendi Marx, Engels ve Lenin yorumunun, Stalinizm gibi Devrimin teorilerinin hatalı yorumları üzerindeki üstünlüğünü ilan etti. 3. Enternasyonal'in (Komintern olarak da bilinir) çöküşüyle, tüm komünist liderler özeleştiri yapmaya davet ediliyor. Gerçek devrimci ruha karşı siyasi körlüklerini itiraf ettikten sonra, 4. Enternasyonal'e davet edilecekler ve dünya sosyalist devriminin gelişine yardımcı olacaklar."
 mexico.52.title:0 "[MEX.GetLeader], Tüm Komünist Hareketlerin Birliğini İlan Ediyor"
 mexico.53.a:0 "Nihayet hatalarımızı görüyoruz."
 mexico.53.b:0 "Marx'ın vizyonuna dair bizim yorumumuz tek meşru olanıdır."
 mexico.53.desc:0 "Uzun zamandır mevcut liderlerimizin Marx, Engels ve Lenin'in gerçek yorumunu yaydığına inandık, ama şimdi 'özeleştiri' yapmaya zorlandılar ve alenen Lenin'in Troçkist yorumunun Sosyalizmin zaferine giden tek doğru yol olduğunu itiraf ettiler. Sonuç olarak, aniden kendimizi izole bulduk. İttifakımız çöktü ve bir Kornelyen ikilemle karşı karşıyayız: Troçkist görüşlerin doğruluğunu tanımak veya izole olup [MEX.GetFactionName] ile anlaşmazlığa düşmek."
 mexico.53.title:0 "[MEX.GetLeader], Tüm Komünist Hareketlerin Birliğini İlan Ediyor"
 mexico.54.a:0 "Taleplerini kabul et."
 mexico.54.b:0 "Devrimcilerle pazarlık yapmayız!"
 mexico.54.desc:0 "[MEX.GetLeader], 4 saatten fazla süren hararetli konuşmasında Karayip bölgesindeki tüm kolonilerimizi, kendisine göre \"Bölge üzerindeki emperyalist baskımızın en görünür kanıtları\" olarak terk etmemizi talep etti. Bazıları şu anda Meksika'yı kızdırmayı göze alamayacağımızı savunurken, daha kararlı danışmanlar onlara karşı tamamen direnebileceğimizi ve toprak bütünlüğümüzün asla tehlikeye atılmaması gerektiğini vurguluyor."
 mexico.54.title:0 "[MEX.GetLeader], Karayipler'den Çekilmemizi Talep Ediyor"
 mexico.55.a:0 "Dünya Proletaryasının özgürlüğü için mücadele devam ediyor."
 mexico.55.desc:0 "Emperyalist çelişkileriyle yüzleştirilen [From.GetAdjective] hükûmeti, Karayip mülklerinden sömürgesizleşti. Bu işçiler için harika bir gün ama mücadele bitmekten çok uzak. Süreç, işçilerin hala baskıcı kurumlara tabi olmaları nedeniyle tam özgürlükle sonuçlanmadı."
 mexico.55.title:0 "[From.GetNameDef], Karayipler'den Çekildi!"
 mexico.56.a:0 "Silahlı proletaryanın gazabını çekecekler!"
 mexico.56.desc:0 "Emperyalist zalimlere özgü kibirli bir yanıtla, [From.GetNameDef], Karayipler üzerindeki açgözlü kontrollerini bırakma taleplerimizi reddetti! Proletaryaları şimdi hükûmetlerinin çelişkisiyle yüzleşmeli ve Tiranlar için çalıştıklarını görmelidir."
 mexico.56.title:0 "[From.GetNameDef], Taleplerimizi Reddediyor"
 mexico.8.a:0 "Meksika'nın [Root.GetFactionName]'e girişine sponsor olacağız."
 mexico.8.b:0 "Meksika için başka planlarımız var."
 mexico.8.desc:0 "[From.GetLeader], [Root.GetFactionName]'e katılmak için bir talepte bulundu. Karşılıklı koruma mı yoksa dış genişleme mi aradığı bilinmiyor, ancak Meksika'nın petrolü bizim tarafımızda olması kazançlı bir varlıktır."
 mexico.8.title:0 "[From.GetAdjective] [Root.GetFactionName]'e Girişi"
 mexico.9.a:0 "Meksika'nın [Root.GetFactionName]'e girişine sponsor olacağız."
 mexico.9.b:0 "Meksika için başka planlarımız var."
 mexico.9.desc:0 "[From.GetLeader], Meksika'dan [Root.GetFactionName]'e giriş için bir talebe sponsor oldu. Meksika'nın karşılıklı koruma mı yoksa dış genişleme mi aradığı bilinmiyor, ancak Meksika'nın petrolü bizim tarafımızda olması kazançlı bir varlıktır."
 mexico.9.title:0 "Meksika'nın [Root.GetFactionName]'e Girişi"
 mexico_communist_menace:0 "Komünist Tehdidi"
 mexico_extradited_trotsky:0 "Troçki İade Edildi"
 mexico_snubbed_stalin:0 "Stalin'i Küçümsedi"
 mexico_trotskyite_wreckers:0 "Troçkist Yıkıcılar"
 mtg_britain.1.a:0 "Kraliyet evliliğinde ısrar et."
 mtg_britain.1.b:0 "Morganatik bir evlilikte uzlaş."
 mtg_britain.1.c:0 "Eğer fikrini değiştirmezse, Kral tahttan çekilmeli."
 mtg_britain.1.d:0 "Bir süredir Kral VIII. Edward, Amerikalı Wallis Simpson ile evlenme umutları besliyordu. Bayan Simpson'ın sadece önceki kocasından boşanmış olması değil, aynı zamanda aslında şu anki kocasıyla hala evli olması ve şu anda ikinci bir boşanma davası peşinde olması nedeniyle şimdi bir anayasal kriz ortaya çıktı. Kral olarak ve İngiltere Kilisesi'nin başı olarak, Edward'ın boşanmış bir kadınla evlenemeyeceği gerekçesiyle genel bir öfke patlak verdi.\n\nAncak Kral, Bayan Simpson'a çok aşık olduğunu ve hükûmetlerinin veya tebaasının görüşlerine bakılmaksızın onunla evlenmeyi planladığını bolca açıkça belirtti. Bu nedenle, ona açık kalan sadece üç seçenek var.\n\nBritanya hükûmeti ve Dominyonların hükûmetleri, tahttan çekilmeye alternatif herhangi bir şeyin kabul edilemez olacağını ve bir evliliği zorla kabul ettirmeye çalışmanın, hatta bir uzlaşma girişiminin bile, sadece Britanya'nın kendisi için değil, aynı zamanda Commonwealth ile olan bağları için de muhtemelen vahim sonuçları olacağını zaten belirtti. Kral'ın en yakın danışmanları onu ikna etme girişimlerine devam ederken, halk nefesini tutarak bu çatışmanın Kral ile kabinesi arasındaki çözümünü bekliyor."
 mtg_britain.1.t:0 "VIII. Edward'ın Tahttan Çekilme Krizi"
 mtg_britain.10.a:0 "Politikacılar aşktan ne anlar ki zaten."
 mtg_britain.10.d:0 "Bugün çeşitli parlamento üyeleri, Kral'ın Bayan Simpson ile evlenme planlarına karşı güçlü bir şekilde konuştular ve bir dizi meslektaşını kendi davalarına çektiler. Böylece Kral'ın evliliğine yönelik siyasi muhalefet belirgin bir şekilde arttı."
 mtg_britain.10.t:0 "Parlamento Evliliğe Karşı"
 mtg_britain.100.a:0 "Birlikte daha güçlü olacağız."
 mtg_britain.100.b:0 "Bağımsızlığımızı asla teslim etmeyeceğiz!"
 mtg_britain.100.d:0 "[From.GetAdjective] hükûmeti, bir kez daha tüm Britanya İmparatorluğu'nu kapsayan, tüm üye devletlerin dış ve iç politikada söz sahibi olacağı bir federal süper devletin kurulmasını önerdi. Bu, diyorlar ki, sonunda tam bağımsız olmamızı görecek olan 'özyönetim' kavramına geçerli bir alternatif olacaktır."
 mtg_britain.1000.a:0 "Kral öldü. Yaşasın Kraliçe!"
 mtg_britain.1000.d:0 "Bu sabah, Kral VI. George'un ölüm haberi duyuldu. Son zamanlarda, savaşın stresi Kral'ın sağlığını giderek daha fazla etkilemişti ve sonunda ağır sigara içmesi ve ardından gelişen arterioskleroz ve Buerger hastalığı, kızı Elizabeth'in zaten babasının kraliyet görevlerinin çoğunu üstlenmesine neden olmuştu.\n\nŞimdi, Elizabeth babasının tahtına çıkacak ve II. Elizabeth kraliyet adını taşıyacak. Genç olmasına rağmen, amcasının morganatik evliliğinin gelecekteki veraset hattını netleştirdiği andan beri bu an için hazırlandı ve yaşına rağmen iyi bir Kraliçe olması bekleniyor."
 mtg_britain.1000.t:0 "Kral VI. George Öldü"
 mtg_britain.100_tt:0 "§RKabul edilirse, §!§Y[FROM.GetNameDef]§!§R bir §!§Yİmparatorluk Federasyonu§!§R kurabilir ve bizi ilhak edebilir§!\n\nKarar onaylanırsa şunları alacaksınız:\n"
 mtg_britain.101.a:0 "Bir olarak daha güçlü olacağız."
 mtg_britain.101.d:0 "[From.GetAdjective] hükûmeti, bir İmparatorluk Federasyonu teklifimizi kabul ettiklerini bize bildirdi. Bizi tamamen destekliyorlar ve eğer önerge kabul edilirse entegrasyona hazırlanmak için çaba gösterecekler."
 mtg_britain.101.t:0 "İmparatorluk Konferansı: Federasyon - [From.GetName] Kabul Ediyor"
 mtg_britain.102.a:0 "Geleceği göremiyorlar..."
 mtg_britain.102.d:0 "[From.GetAdjective] hükûmeti, bir İmparatorluk Federasyonu teklifimizi reddettiklerini bize bildirdi. Kavramı, halklarının haklarına kabul edilemez bir tecavüz olarak görüyorlar. Halkın devredilemez kendi kaderini tayin hakkı peşinde, özyönetim ileriye dönük tek olası yoldur."
 mtg_britain.102.t:0 "İmparatorluk Konferansı: Federasyon - [From.GetName] Reddediyor"
 mtg_britain.103.a:0 "İmparatorluk için anıtsal bir olay!"
 mtg_britain.103.d:0 "İmparatorluk Federasyonu önergesi oybirliğiyle başarılı oldu. Şimdi, ilgili tüm taraflar, nihayetinde topraklarımızın tam entegrasyonunu kolaylaştırmak için hükûmetlerini federal düzeyde yeniden şekillendirme ve entegre etme sürecine başlamak zorunda kalacaklar."
 mtg_britain.103.t:0 "İmparatorluk Konferansı: Federasyon - Başarı"
 mtg_britain.104.a:0 "O zaman yollarımız burada ayrılmalı."
 mtg_britain.104.b:0 "Hindistan olmadan biz bir hiçiz."
 mtg_britain.104.d:0 "İmparatorluk Federasyonu önergesi bir çıkmaza girdi. [CAN.GetNameDef], [SAF.GetNameDef], [AST.GetNameDef] ve [NZL.GetNameDef] kabul etmiş olsa da, [RAJ.GetAdjective] hükûmeti, temel kültürel farklılıkları ve Hint devletinin haklarına yetersiz saygıyı gerekçe göstererek önergemizi reddetti.\n\nŞimdi kabul eden o Dominyonlarla ilerleyip ilerlemeyeceğimize ve bunu yaparken [RAJ.GetNameDef]'e bağımsızlığını verip vermeyeceğimize ya da teklifi tamamen rafa kaldırıp kaldırmayacağımıza karar vermeliyiz."
 mtg_britain.104.t:0 "İmparatorluk Konferansı: Federasyon - Kısmi Başarı"
 mtg_britain.105.a:0 "O zaman bunun yerine daha ulaşılabilir hedeflere odaklanalım."
 mtg_britain.105.d:0 "Oybirliğiyle destek olmadan, İmparatorluk Federasyonu önergesi yenilgiye uğradı. Özyönetime bu alternatife olan ilginin artmak yerine azaldığı görüldüğünden, teklif şimdi kesinlikle gelecekteki İmparatorluk Konferanslarının bir konusu olarak rafa kaldırılacaktır. Bunun yerine, nihai olarak tam bağımsızlığın gerçekleştirilmesine doğru çalışmaya devam edeceğiz."
 mtg_britain.105.t:0 "İmparatorluk Konferansı: Federasyon - Başarısızlık"
 mtg_britain.106.a:0 "Bizden korkuyorlar."
 mtg_britain.106.d:0 "[From.GetNameDefCap], bizi Washington Denizcilik Antlaşması'nın şartlarına geri döndürmek için ana gemi miktarını derhal azaltmamızı talep eden bir ültimatom yayınladı. 60 gün içinde uymazsak, ana gemilerimizin sayısını askeri güç kullanarak azaltmaya istekli olduklarını eklediler."
 mtg_britain.106.t:0 "[From.GetName] Antlaşma Uyumunu Talep Ediyor"
 mtg_britain.107.a:0 "Bir daha olmasın."
 mtg_britain.107.d:0 "[From.GetAdjective] temsilcileri, Washington Denizcilik Antlaşması'nı ihlal ettikleri için bolca özür dilediler ve antlaşma şartlarına geri dönmek için ana gemi sayılarını azalttıklarını bize temin ediyorlar."
 mtg_britain.107.t:0 "[From.GetName] Antlaşmaya Uyuyor"
 mtg_britain.108.a:0 "Bize bir daha meydan okumayacaklar."
 mtg_britain.108.d:0 "[From.GetAdjective], antlaşma yükümlülükleri konusunda ölümcül bir sessizliğe büründü. Ana gemi sayılarını azaltmaya dair hiçbir belirti verilmedi."
 mtg_britain.108.t:0 "[From.GetName] Antlaşmaya Meydan Okuyor"
 mtg_britain.109.a:0 "Kabul etmekten başka çaremiz yok."
 mtg_britain.109.d:0 "Son olaylar ışığında, Birmanyalılar kendi bağımsızlıklarını ilan ettiler, Pakistanlılarla ellerimizin dolu olmasını ve dolayısıyla onlarla başa çıkamayacağımızı tamamen bekleyerek."
 mtg_britain.109.t:0 "Burma Ayrılıyor"
 mtg_britain.11.a:0 "Sadece aşkı bulduğu için kıskanıyorlar."
 mtg_britain.11.d:0 "Aristokrasi arasındaki önemli kişiler, hiç de nazik olmayan bir dille, Kral'ın 'sıradan bir sürtük' olarak gördükleri biriyle evlenme ihtimalinden duydukları tiksintiyi açıkça belirttiler. Gelenek ve törene gösterdiği görünen küçümseme, ulusun en güçlü bireylerinden birçoğunu gücendirmiş görünüyor."
 mtg_britain.11.t:0 "Üst Sınıflar Evliliğe Karşı"
 mtg_britain.113.a:0 "Onları yeniden aramıza hoş karşılıyoruz."
 mtg_britain.113.d:0 "İç savaşı kazanıp anavatanlarını yeniden birleştirdikten sonra, [From.GetNameDef] liderleri şimdi İmparatorluğa yeniden katılmayı talep ettiler ve gelecek olanlar için rehberliğimizi ve korumamızı arzuluyorlar."
 mtg_britain.113.t:0 "[From.GetName] İmparatorluğa Yeniden Katılıyor"
 mtg_britain.12.a:0 "Bir roman için kazanan bir formül, kesinlikle."
 mtg_britain.12.d:0 "Kral'a destek, halkın alt sınıfları arasında artıyor gibi görünüyor. Kral'ın 'halktan biriyle' evlenmesinde sadece bir yanlışlık görmemekle kalmıyor, hatta 'halktan doğma bir kadının' Kral'ın kalbini kazanıp kraliyetle evlenmesinin masalsı hikayesine hayran görünüyorlar."
 mtg_britain.12.t:0 "İşçi Sınıfları Evliliği Destekliyor"
 mtg_britain.13.a:0 "Görünüşe göre 'hikayenin kendi tarafı' oldukça ikna ediciydi."
 mtg_britain.13.d:0 "Kral Edward nihayet hükûmeti bir radyo konuşması yapmasına izin vermeye ikna etti ve 'hikayenin kendi tarafı' olarak adlandırdığı şeyi açıkladı. Bunun, insanların neden böyle davranması gerektiğini hissettiğini daha iyi anlamalarını sağlayacağı umudunu dile getirdi."
 mtg_britain.13.t:0 "VIII. Edward Radyo Konuşması Yapıyor"
 mtg_britain.15.a:0 "Bizim hiçbir Kralımız boşanmış bir halktan biriyle evlenemez."
 mtg_britain.15.b:0 "Ne olursa olsun o bizim Kralımız olacak."
 mtg_britain.15.d:0 "Britanya hükûmeti, Kral'ın alt tabakadan boşanmış Wallis Simpson ile evlenmek istediğini duyurmasıyla temelden sarsıldı. Bu, hem parlamento üyeleri arasında hem de halk arasında öfkeye neden oldu, çünkü muhalifler Kral'ın görevinin her şeyden önce halkına ve ülkesine, ikinci olarak da kendi mutluluğuna olduğunu savunuyor. Boşanmışların evlenmesine izin vermeyen İngiltere Kilisesi'nin lideri olarak Kral'ın bu nedenle Bayan Simpson ile evlenemeyeceği savunuluyor.\n\nTartışma şimdi Dominyonlara sıçradı ve Kral, kabinesinin tavsiyesini dinlemeye dair hiçbir belirti vermediği için, evlilik planlarının değişmeyeceğini varsaymalıyız. Eğer iradesini zorla kabul ettirirse, nasıl yanıt vereceğiz?"
 mtg_britain.15.t:0 "VIII. Edward'ın Tahttan Çekilme Krizi"
 mtg_britain.15_tt:0 "Eğer VIII. Edward fikrini değiştirmezse bağımsız olup Müttefiklerden ayrılacağız.\n"
 mtg_britain.15_tt_2:0 "VIII. Edward, Wallis Simpson ile evlense bile İngilizlerle kalacağız.\n"
 mtg_britain.16.a:0 "O zaman Taç ile bağlarımızı koparmalıyız."
 mtg_britain.16.d:0 "Korktuğumuz gibi, Kral VIII. Edward, şimdi Windsor Düşesi Wallis olarak bilinen Wallis Simpson ile evliliğe devam etmeye karar verdi."
 mtg_britain.16.t:0 "VIII. Edward Evlilik İçin İlerliyor"
 mtg_britain.17.a:0 "Yardımlarından en iyi şekilde yararlanalım."
 mtg_britain.17.d:0 "Bizi bağımsızlığa hazırlama çabasıyla, [ENG.GetNameDef], geçişimiz sırasında bize rehberlik etmeye karar verdi. Kendi ayaklarımız üzerinde durana kadar onların desteğine güvenebileceğiz."
 mtg_britain.17.t:0 "Britanya Rehberliğinde"
 mtg_britain.18.a:0 "Çok mükemmel bir haber!"
 mtg_britain.18.d:0 "İlk geçiş tamamlandı ve [ENG.GetAdjective] hükûmeti bize şimdi tam egemenliğin devri için hazırlıklara başladıklarını bildirdi."
 mtg_britain.18.t:0 "Dominyon Bağımsızlığına Doğru"
 mtg_britain.19.d:0 "Bizi bağımsızlığa hazırlama çabasıyla, [ENG.GetNameDef], geçişimiz sırasında bize rehberlik etmeye karar verdi. Hükûmetimizi olgunlaştırmada ve ülkedeki sanayileşme seviyesini artırmada, kendi ayaklarımız üzerinde durana kadar onların desteğine güvenebileceğiz."
 mtg_britain.19.t:0 "Bir Hint Devleti için Temeller"
 mtg_britain.1_tt:0 "Evlilik için hazırlıklara başla.\n"
 mtg_britain.2.a:0 "Güzel. Bir tarih belirleyeceğiz."
 mtg_britain.2.b:0 "Belki de halk haklıdır - Kral tahttan çekilmeli."
 mtg_britain.2.d:0 "Kral'ın kararının neden olduğu muazzam öfkenin ortasında, Kral Edward'ı destekleyen bazı sesler yükseliyor. Ana siyasi partilerden izole olsalar da, isimleri yine de ağırlık taşıyor: Winston Churchill, Oswald Mosley ve David Lloyd George.\n\nBaşlangıçta tereddütle de olsa, bu beklenmedik siyasi müttefikler grubu halk arasında tutunmaya başlıyor ve onların liderliğini takip ederek giderek daha fazla kişi Edward'ı kararında alenen desteklemeye cesaret ediyor.\n\nBöylece kararlılığında güçlenen Kral, bu konuda fikrini değiştirme niyetinde olmadığını açıkça belirtti. Evlilik planlandığı gibi devam edecektir."
 mtg_britain.2.t:0 "VIII. Edward için Destek Oluşuyor"
 mtg_britain.20.a:0 "İlgili taraflardan herhangi birini tatmin etmesi pek olası değil."
 mtg_britain.20.d:0 "Barışın çıkarı için, [ENG.GetAdjective] hükûmeti alt kıtayı dini ve kültürel ayrımlar boyunca bölmeye karar verdi. Ortaya çıkan teklif üç ayrı devleti içerecektir; Hindistan, Pakistan ve Bangladeş ve bu çözümün herhangi bir potansiyel yıkıcı iç savaşı önlemesi umulmaktadır."
 mtg_britain.20.t:0 "Üç Uluslu Çözüm"
 mtg_britain.200.a:0 "Kabul etmek daha güvenli."
 mtg_britain.200.b:0 "Cesedimizi çiğnemeniz lazım!"
 mtg_britain.200.d:0 "Şaşırtıcı bir gelişmeyle, [FROM.GetLeader] hükümeti, iktidar partimizi [FROM.GetRulingIdeology] olarak değiştirmek için [ROOT.GetName] içinde destek toplamaya çalıştı."
 mtg_britain.200.t:0 "[FROM.GetNameDefCap] [FROM.GetRulingIdeology] Rejimi Kurmaya Çalışıyor"
 mtg_britain.200.tt:0 "§RBunun korkunç sonuçları olabilir§!"
 mtg_britain.201.a:0 "Bu konuyu kapatalım, birlik daha önemli."
 mtg_britain.201.b:0 "Bu savaştır."
 mtg_britain.201.d:0 "Çarpıcı bir sadakatsizlik örneği olarak [FROM.GetLeader], hükümetlerindeki [ROOT.GetRulingIdeology] rolü konusunda [ROOT.GetLeader]'ın isteklerine boyun eğmeyi reddettiğini açıkladı. Artık rejim değişikliğini sağlamanın tek yolu [FROM.GetNameDef] ile silahlı bir çatışmaya girmektir."
 mtg_britain.201.t:0 "[FROM.GetNameDefCap] Rejim Değişikliğini Reddediyor"
 mtg_britain.202.a:0 "Bazı şeyler uğruna savaşmaya değer."
 mtg_britain.202.d:0 "Görünüşe göre [FROM.GetLeader] reddimizi iyi karşılamadı, hatta resmi bir savaş ilanı duyuracak kadar ileri gitti!"
 mtg_britain.202.t:0 "[FROM.GetNameDefCap] Savaş İlan Ediyor"
 mtg_britain.203.a:0 "Anavatan ile savaş yok."
 mtg_britain.203.d:0 "[FROM.GetLeader]'dan gelen bir notta, Milletler Topluluğu'nun birliğini koruma ihtiyacını öne sürerek reddimizi kabul ettiklerini açıkladılar."
 mtg_britain.203.t:0 "[FROM.GetNameDefCap] Rejim Değişikliği Konusunu Kapatıyor"
 mtg_britain.21.t:0 "Hint Bağımsızlığına Doğru"
 mtg_britain.22.a:0 "Çok yaşa Churchill!"
 mtg_britain.22.d:0 "Bugünkü güvensizlik oylamasında, Avam Kamarası mevcut hükûmete olan inancını kaybettiğini açıkça belirtti. Kral'a istifasını sunduktan sonra, [Root.GetLeader], Winston Churchill'i önerilen halefi olarak öne sürdü.\n\nYeni Başbakanın tartışmalı Yatıştırma politikasından uzaklaşması, potansiyel olarak hatta daha fazla meydan okumaya askeri güçle yanıt vermesi bekleniyor."
 mtg_britain.22.t:0 "Güvensizlik Oyu"
 mtg_britain.23.a:0 "Bunda potansiyel var."
 mtg_britain.23.b:0 "İngilizler tarafından ne yapacağımız bize söylenmeyecek!"
 mtg_britain.23.d:0 "[From.GetNameDefCap], İtalyanları diplomatik olarak izole etme talebiyle bizimle temasa geçti. Eğer buna açık olursak, bizimle potansiyel bir gelecekteki ittifakı düşünme istekliliklerini belirtiyorlar."
 mtg_britain.23.t:0 "Akdeniz Tehdidini İzole Et"
 mtg_britain.24.a:0 "Bu bize büyük fayda sağlayacaktır."
 mtg_britain.24.d:0 "[From.GetNameDefCap], [ITA.GetNameDef] ile diplomatik ilişkilerini kestiklerini bize bildiriyor."
 mtg_britain.24.t:0 "[From.GetName], [ITA.GetName]'i Terk Ediyor"
 mtg_britain.25.a:0 "Buna nasıl cüret ederler?!"
 mtg_britain.25.d:0 "[From.GetNameDefCap], [ENG.GetAdjective] kışkırtmasıyla bizimle diplomatik ilişkilerini kestiklerini bildiriyor."
 mtg_britain.25.t:0 "Alman-İngiliz Yakınlaşması"
 mtg_britain.26.a:0 "Bu kesinlikle işleri daha sorunlu hale getiriyor..."
 mtg_britain.26.d:0 "[From.GetNameDefCap], [ITA.GetNameDef] ile diplomatik ilişkilerini kesmemeye karar verdiklerini bize bildiriyor."
 mtg_britain.26.t:0 "[From.GetName], [ITA.GetName]'i Destekliyor"
 mtg_britain.27.a:0 "Ne mükemmel bir fikir!"
 mtg_britain.27.b:0 "Bu bizim ilgi alanımıza girmiyor."
 mtg_britain.27.d:0 "Daha önce bahsettikleri gibi, [From.GetNameDef] şimdi işbirliğimizi sürdürmek ve İtalyanları daha da izole etmek için ittifakımıza katılmayı teklif etti."
 mtg_britain.27.t:0 "[From.GetName] ile İttifak"
 mtg_britain.28.d:0 "[From.GetNameDefCap], bir ittifak teklifimizi kabul etti. Bundan böyle Deniz ve Karayı birlikte yöneteceğiz."
 mtg_britain.28.t:0 "[From.GetName] İttifakı Kabul Ediyor"
 mtg_britain.29.d:0 "[From.GetNameDefCap], bir ittifak teklifimizi reddetti. Ne planladıkları kimsenin tahmini değil..."
 mtg_britain.29.t:0 "[From.GetName] İttifakı Reddediyor"
 mtg_britain.2_tt:0 "Evlilik için hazırlıklara devam et.\n"
 mtg_britain.3.a:0 "İyi kurtulduk. Kral'ı durduramayacaklar."
 mtg_britain.3.d:0 "Kral hükûmetinin tavsiyelerini dinlemeye yanaşmayınca [Root.GetLeader], kabinenin istifasından başka bir çözüm bulamadı. Açıklamasında şunları söyledi: \"Hükümdarının güvenini yitiren bir kabinenin görevini sürdüremeyeceği açıktır. Bakanlarının oy birliğiyle sunduğu tavsiyelerin defalarca reddedilmesi, bu görüşlerin ne istendiğini ne de dikkate alındığını göstermektedir. Bu akşam Majesteleriyle görüşerek kabinenin istifasını sunacağım.\"\n\nKral'ın kararına karşı son bir protesto niteliğindeki bu girişimin başarılı olup olmayacağı belirsiz. Kral'ın [Root.GetLeader] yerine kimi, ne zaman görevlendireceği de bilinmiyor."
 mtg_britain.3.t:0 "Kabine İstifa Ediyor"
 mtg_britain.30.a:0 "Bu kabul edilebilir."
 mtg_britain.30.b:0 "Ellerimizin bu şekilde bağlanmasını istemiyoruz."
 mtg_britain.30.d:0 "[From.GetNameDefCap], kıtada serbest hareket etmemize izin veren bir müdahale etmeme antlaşması öneriyor, eğer sadece İmparatorlukları ve İtalyanlarla olan İngiliz müdahalesine göz yumarsak."
 mtg_britain.30.t:0 "[From.GetName] Müdahale Etmeme İstiyor"
 mtg_britain.31.d:0 "[From.GetAdjective] yetkilileri, bir müdahale etmeme antlaşması teklifimizi kabul ettiklerini bize bildiriyor. İmparatorluk ve İtalya ile olan işlerimize göz yumacaklar, biz de onları kıtadaki kendi hallerine bırakacağız."
 mtg_britain.31.t:0 "[From.GetNameDefCap] Müdahale Etmemeyi Kabul Ediyor"
 mtg_britain.32.d:0 "[From.GetAdjective] yetkilileri, bir müdahale etmeme antlaşması teklifimizi reddettiklerini bize bildiriyor. Eğer seçeneklerini açık tutmak istiyorlarsa dikkatli olmalıyız..."
 mtg_britain.32.t:0 "[From.GetNameDefCap] Müdahale Etmemeyi Reddediyor"
 mtg_britain.33.a:0 "Ulusumuzun geleceği tehlikede!"
 mtg_britain.33.d:0 "Son yürüyüş, Kara Gömlekliler ile komünist ve sosyalist karşı protestocuları arasında daha fazla şiddete sahne oldu. Ancak, bu şiddet orada sınırlı kalmadı. Bir kıvılcım gibi, ulusumuzda son aylarda var olan giderek gerginleşen durumu ateşlemeye hizmet etti.\n\nTüm ülke genelinde milisler çatışmaya başladı, şehirlerin ve kasabaların ve yerel bölgelerinin kontrolünü ele geçirerek orduyu bir bağlılık seçimi yapmaya zorladı. Dominyonlar ve donanma hala 'meşru' demokratik hükûmeti tamamen desteklerken, ordudaki durum çok daha az net ve birçok birim davamıza katıldı.\n\nCephe hatları oluşmaya başlarken, Oswald Mosley liderliğinde geçici bir kriz hükûmetinin kurulduğunu duyurdu. Bu, bu iç savaşın sonuna kadar temel işleri halledecektir."
 mtg_britain.33.t:0 "Siyasi Şiddet İç Savaşa Tırmanıyor"
 mtg_britain.34.a:0 "Yeniden inşa başlasın."
 mtg_britain.34.d:0 "Umutsuz iç savaşı sömürgelerden sürdürmek yerine, halk desteğinden yoksun kalan demokratik hükûmet zaferimizi kabul etti ve barış istedi. Bu kararın ardından, Kraliyet Donanması bir kez daha komutamız altına girdi.\n\nAncak Dominyonlar, demokratik olmayan bir hükûmeti takip etme niyetinde olmadıklarını ve bunun yerine Milletler Topluluğu'nun bağımsız üye ulusları olarak devam etmeyi hedeflediklerini açıkça belirtti."
 mtg_britain.34.t:0 "Britanya İç Savaşı'nın Sonu"
 mtg_britain.34_tt:0 "Kraliyet Donanması kontrolümüze geri döner.\n"
 mtg_britain.35.a:0 "Mosley'in altında fırtınayı atlatacağız!"
 mtg_britain.35.d:0 "Downing Sokağı'na yürüyüşümüz muazzam bir başarıydı ve halkın acil baskısı altında, [Root.GetLeader]'in derhal seçim çağrısı yapmaktan başka çaresi kalmadı. Bunlar Sağ için açık bir zaferdi ve Kral'ın onayıyla Oswald Mosley şu anda kabinesini kuruyor. Bugün erken saatlerde yaptığı bir açıklamada, yeni Başbakan zaten kapsamlı ekonomik reformlar ve Avrupa diplomasisine yeni bir yaklaşım duyurdu.\n\nBu arada, Dominyonlar arasındaki muhalefet tüm zamanların en yüksek seviyesinde görünüyor ve bağımsızlık çağrıları hiç bu kadar yüksek olmamıştı. Önümüzdeki birkaç ay İmparatorluk için çok önemli olacak."
 mtg_britain.35.t:0 "Downing Sokağı'na Yürüyüş"
 mtg_britain.36.a:0 "Mükemmel bir fikir! Kabul ediyoruz."
 mtg_britain.36.b:0 "Böyle arkadan vuran bir müttefike ihtiyacımız yok."
 mtg_britain.36.d:0 "[From.GetAdjective] diplomatları sinsi bir teklifle bizimle temasa geçti. Bir Avrupa hegemonyası arayanlara karşı durabilecek bir ittifak kurmayı teklif ediyorlar ve karşılığında Fransızlarla olan tüm diplomatik bağlarını terk etmeyi teklif ediyorlar."
 mtg_britain.36.t:0 "[From.GetName] İttifak Talep Ediyor"
 mtg_britain.37.d:0 "[From.GetNameDefCap], teklifimizden etkilenerek kabul etmeye karar verdiklerini bize bildiriyor. İdeolojik müttefiklerimizle birlikte duracak ve dünyanın tehditleriyle birlikte yüzleşeceğiz."
 mtg_britain.37.t:0 "[From.GetName] İttifakı Kabul Ediyor"
 mtg_britain.38.d:0 "[From.GetNameDefCap], teklifimizi kesinlikle alçakça bulduklarını ve bu nedenle tereddütsüz reddettiklerini bize bildiriyor."
 mtg_britain.38.t:0 "[From.GetName] İttifakı Reddediyor"
 mtg_britain.39.a:0 "Ne ihanet ama!"
 mtg_britain.39.d:0 "[From.GetNameDefCap], artık mevcut çıkarlarıyla alakamız olmadığını ve Büyük Savaş'ta kurduğumuz bağları 'yeniden gözden geçirmeye' karar verdiklerini bize bildiriyor. Bunun yerine, şimdi İtalyanlarla ittifak kurdular."
 mtg_britain.39.t:0 "[From.GetName] Bizi Terk Ediyor"
 mtg_britain.4.a:0 "Onları durduracak gücümüz yok - şimdilik."
 mtg_britain.4.d:0 "Dominyon hükûmetlerinin temsilcileri, Taç ile bağlarını tek taraflı olarak koparacaklarını ortak bir açıklamayla bildirdi. Kral'ın dominyon halklarının ve hükûmetlerinin görüşlerini açıkça hiçe saymasını, Britanya ile İngiliz Milletler Topluluğu arasındaki ilişkinin sürdürülememesinin başlıca nedeni olarak gösteriyorlar.\n\nBir yetkili hararetli bir röportajda şu sözleri kullandı: \"Görevini kişisel duygularının önüne koyamayan bir kralın, tebaasının yararına hareket edeceğine güvenilemez. Son gelişmeler, Kral'ın kendi ülkesindeki kamuoyuna bile değer vermediğini gösteriyor. Britanya halkına karşı tutumu buysa, Milletler Topluluğu'ndaki halkların durumu daha da kötüleşecektir. Halklarımızın çıkarlarını korumak için Kral'ı devlet başkanımız olarak tanımaktan vazgeçmek dışında bir yol göremiyoruz.\"\n\nKuşkusuz, mevcut siyasi felcin bu ani hamleye karşı harekete geçmemizi engellemesini umuyorlar."
 mtg_britain.4.t:0 "Dominyonlar Taç ile Bağlarını Koparıyor"
 mtg_britain.40.a:0 "Bu harika bir fikir!"
 mtg_britain.40.b:0 "Bizce değil."
 mtg_britain.40.d:0 "[From.GetAdjective] hükûmeti, ittifaklarına katılmamız karşılığında Cebelitarık'ı bize geri verme teklifiyle bize başvurdu."
 mtg_britain.40.t:0 "[From.GetName] İttifak Teklif Ediyor"
 mtg_britain.41.d:0 "[From.GetNameDefCap], Cebelitarık karşılığında bir ittifak teklifimizi kabul etmeye karar verdiklerini bize bildiriyor."
 mtg_britain.41.t:0 "[From.GetName] İttifakı Kabul Ediyor"
 mtg_britain.42.d:0 "[From.GetNameDefCap], bir ittifak teklifimizi reddetmeye karar verdiklerini bize bildiriyor - Cebelitarık'ı tutabiliriz."
 mtg_britain.42.t:0 "[From.GetName] İttifakı Reddediyor"
 mtg_britain.43.a:0 "Onları Kanada'ya sürgün edin!"
 mtg_britain.43.b:0 "Yargılanacak ve cezalandırılacaklar."
 mtg_britain.43.d:0 "İktidar geçişinden bu yana Buckingham Sarayı'nın ihtişamında gayriresmi bir ev hapsinde tutulan Kraliyet Ailesi ile ne yapılacağına karar verme zamanı geldi. Kamuoyu gitmeleri gerektiğini açıkça belirtti, geriye kalan tek şey ne şekilde olacağına ve servetlerini ele geçirdiğimizde ne yapacağımıza karar vermek..."
 mtg_britain.43.t:0 "Kraliyet Ailesinin Kaderi"
 mtg_britain.44.a:0 "Burada hoş karşılanırlar."
 mtg_britain.44.d:0 "[From.GetAdjective] hükûmeti, Kraliyet Ailesi'ne 'hoşgörülerini' onları sürgün ederek gösterdi. Şimdi kıyılarımıza geldiler ve sığınma talep ediyorlar."
 mtg_britain.44.t:0 "Sürgündeki Kraliyet Ailesi"
 mtg_britain.45.a:0 "Sıra Kızıl Tilki'de."
 mtg_britain.45.d:0 "Şimdi ulusta komünizmin yerini güvence altına aldığımıza göre, vatandaşlarının elindeki serveti yeniden dağıtmaya bakabiliriz. Üst sınıfların gümüş kaşıkları... zorla alınmalıdır."
 mtg_britain.45.t:0 "Üst Sınıfı Yok Et"
 mtg_britain.46.a:0 "O zaman başka seçeneğimiz yok."
 mtg_britain.46.b:0 "Bırakın denesinler."
 mtg_britain.46.d:0 "[From.GetNameDefCap], derhal onların örneğini takip etmemizi ve sömürge mülklerimize tam bağımsızlık vermemizi talep eden bir ültimatom yayınladı. Eğer yapmazsak, taleplerini askeri güçle desteklemeye kararlı olduklarını söylüyorlar..."
 mtg_britain.46.t:0 "[From.GetName] Sömürgesizleştirme Talep Ediyor"
 mtg_britain.47.a:0 "İşçinin kurtuluşuna yardım ediyorlar."
 mtg_britain.47.d:0 "[From.GetNameDefCap], taleplerimiz uyarınca sömürgesizleşti."
 mtg_britain.47.t:0 "[From.GetName] Sömürgesizleşiyor"
 mtg_britain.48.a:0 "O zaman savaş olsun."
 mtg_britain.48.d:0 "[From.GetNameDefCap], sömürgesizleşme taleplerimizi reddetti."
 mtg_britain.48.t:0 "[From.GetName] Talepleri Reddediyor"
 mtg_britain.49.a:0 "Harika bir fikir - yapalım."
 mtg_britain.49.b:0 "Bu intihar gibi görünüyor. Beklesek daha iyi."
 mtg_britain.49.d:0 "[From.GetNameDefCap], [GER.GetNameDef]'e iki yönden saldırma konusunda bir işbirliği öneriyor. Pazarlığın kendi paylarına düşen kısmını yerine getirdiklerini ve hızla ikinci bir cephe açtıklarını varsayarsak, bu mükemmel bir fırsat olabilir."
 mtg_britain.49.t:0 "Britanya İşbirliği Öneriyor"
 mtg_britain.5.a:0 "Ama bu, ulusumuzdaki bölünmeleri onaracak mı?"
 mtg_britain.5.d:0 "Nihayet Kraliyet Düğünü için neşeli tarih geldi. Kalabalıklar, çiftin Buckingham Sarayı'ndan Westminster Abbey'e seyahat ettiği güzergah boyunca binlerce kişi toplandı.\n\nEvliliğe yönelik yerel direniş, sembolik istifalar ve diğer boş protestolar yoluyla giderek güçsüzlüğünü gösterdi ve şimdi neredeyse tamamen susturulmuş gibi görünüyor. Bu tür son eylem, Canterbury Başpiskoposu Cosmo Lang'ın emekli olması ve ardından onun yerine Kral'ın isteklerine daha... uygun bir bireyin getirilmesiydi.\n\nBu krizin neden olduğu siyasi kargaşa karşısında, şu anda devam eden kutlamalar, kamu işlerine bir normallik görüntüsü kazandırmada ve mevcut siyasi sorunları çözmek için bir başlangıç noktası olarak derinden gereklidir."
 mtg_britain.5.t:0 "VIII. Edward'ın Kraliyet Düğünü"
 mtg_britain.50.a:0 "Almanları ezeceğiz."
 mtg_britain.50.d:0 "[From.GetNameDefCap] teklifimizi kabul etti ve Almanya'ya saldırmaya hazırlar."
 mtg_britain.50.t:0 "[From.GetName] Teklifi Kabul Ediyor"
 mtg_britain.51.a:0 "Ne kadar talihsiz."
 mtg_britain.51.d:0 "[From.GetNameDefCap] teklifimizi reddetti. Almanlara karşı düşmanca bir niyetleri olmadığını söylüyorlar."
 mtg_britain.51.t:0 "[From.GetName] Teklifi Reddediyor"
 mtg_britain.52.a:0 "Onlar yoldaş komünistler - yanımızda olmalılar."
 mtg_britain.52.b:0 "Onların komünizmi Stalin'in yolu değil."
 mtg_britain.52.d:0 "[From.GetNameDefCap], Komintern'e katılma talebiyle bize başvurdu."
 mtg_britain.52.t:0 "[From.GetName] İttifak Talep Ediyor"
 mtg_britain.53.d:0 "[From.GetNameDefCap], Komintern üyeliğimize izin verdi. Şimdi dünya işçilerinin savunmasında onların yanında duruyoruz."
 mtg_britain.53.t:0 "[From.GetName] Talebi Onaylıyor"
 mtg_britain.54.d:0 "[From.GetNameDefCap], Komintern'e katılma talebimizi reddetti. Yalnız duruyoruz."
 mtg_britain.54.t:0 "[From.GetName] Talebi Reddediyor"
 mtg_britain.55.a:0 "Hainler!"
 mtg_britain.55.d:0 "Partimiz içindeki belirli unsurlar, uzun zamandır bizi özgürlük ve eşitliğin komünist ideallerine sadece lafta hizmet etmekle suçluyorlar. Bu unsurlar şimdi bir darbe girişimi başlattılar. İktidarı elimizde tutmayı başardık, ancak durum şimdi tam teşekküllü bir iç savaşa tırmandı."
 mtg_britain.55.t:0 "Komünist İç Savaşı"
 mtg_britain.56.a:0 "Onlara merhamet göstermeyin."
 mtg_britain.56.d:0 "Zorlu bir iç savaştan sonra, durumun kontrolünü yeniden sağlamayı başardık. Şimdi ulusumuzdaki bu hain unsurları temizlemeye başlayabiliriz..."
 mtg_britain.56.t:0 "Komünist İç Savaşı Sona Eriyor"
 mtg_britain.57.a:0 "Zafere doğru durmaksızın yürüyoruz!"
 mtg_britain.57.d:0 "[ENG_blackshirt_march_state.GetName]'deki yürüyüş muazzam bir başarıydı; karşı protestolar asgari düzeydeydi ve Kara Gömleklilerimiz örnek davranışlar sergiledi. Bundan kaynaklanan popülerlik artışı, hareketimizin yararına önemli siyasi kazanımlar elde etmemizi sağladı."
 mtg_britain.57.t:0 "[ENG_blackshirt_march_state.GetName]'de Barışçıl Yürüyüş"
 mtg_britain.58.a:0 "Hiç kimse ilerlemenin önünde duramaz."
 mtg_britain.58.d:0 "Bazı karşı protestolara ve küçük çatışmalara rağmen, [ENG_blackshirt_march_state.GetName]'deki yürüyüş bir başarıydı. Kara Gömlekliler partinin onurunu korudu ve biz tam siyasi zafere doğru yürümeye devam ediyoruz."
 mtg_britain.58.t:0 "[ENG_blackshirt_march_state.GetName]'de Yürüyüş"
 mtg_britain.59.a:0 "Ulusun geleceği karşısında birkaç kırık yumurtanın ne önemi var ki?"
 mtg_britain.59.d:0 "[ENG_blackshirt_march_state.GetName]'deki yürüyüş, büyük karşı protestolar ve kapsamlı sokak çatışmalarıyla sonuçlandı. Çok sayıda yaralı ve hatta bazı ölümlere rağmen, Kara Gömleklilerimiz polis müdahale edene kadar sorun çıkaranlara karşı kendi başlarının çaresine bakmayı başardılar."
 mtg_britain.59.t:0 "[ENG_blackshirt_march_state.GetName]'de Şiddetli Yürüyüş"
 mtg_britain.60.a:0 "Halkın tepkisi oldukça iyi görünüyor."
 mtg_britain.60.d:0 "Kendisinin sadece [GER.GetLeader]'nin kucak köpeği olduğu yönündeki suçlamalara meydan okuyan Oswald Mosley, bugün heyecan verici bir konuşma yaptı. İçinde İngiliz Faşizminin benzersizliğini ve bireyselliğini öne sürdü ve kendi politikaları ile Alman diktatörünün politikaları arasındaki ayrımı vurguladı. Sözlerini güçlü sözlerle bitiriyordu: \"Briton dışında hiç kimse Britanya üzerinde hakimiyet kuramayacak!\""
 mtg_britain.60.t:0 "Mosley'nin [GER.GetName]'e Karşı Konuşmaları"
 mtg_britain.61.a:0 "Tetikte olmalıyız."
 mtg_britain.61.d:0 "[From.GetNameDef]'in ülkemizdeki İmparatorluk Sadıklarını desteklediği dikkatimizi çekti. Eğer karşı konulmazsa, yıkıcı faaliyetleri pekala tam teşekküllü bir iç savaşla sonuçlanabilir!"
 mtg_britain.61.t:0 "[From.GetName] İmparatorluk Sadıklarını Destekliyor"
 mtg_britain.62.a:0 "Bize de geliyor olabilirler."
 mtg_britain.62.d:0 "Yeni [From.GetAdjective] hükûmeti, Dominyonları arasındaki herhangi bir muhalefeti gerekirse askeri güçle ezme niyetini açıkladı. Orduları İmparatorluk boyunca bunu yapmak için çok ince bir şekilde gerilmiş olsa da, denemeyi açıkça planlıyorlar."
 mtg_britain.62.t:0 "[From.GetName] Dominyonları Güvence Altına Almak İçin Harekete Geçiyor"
 mtg_britain.62_tt:0 "İngilizler, önümüzdeki 180 gün boyunca bizi kendi ideolojilerine çevirebilecekler.\n"
 mtg_britain.63.a:0 "Buna nasıl cüret ederler?!"
 mtg_britain.63.d:0 "Kuvvetlerini anakaramıza konuşlandıran [From.GetAdjective] hükûmeti şimdi sıkıyönetim ilan etti ve hükûmeti geçici olarak askıya aldı."
 mtg_britain.63.t:0 "[From.GetName] Sıkıyönetim Uyguluyor"
 mtg_britain.64.a:0 "Sadece halkı çok fazla etkilememesini umabiliriz."
 mtg_britain.64.d:0 "[From.GetAdjective] hükûmeti şimdi medyayı bastırmak için sıkıyönetimi kullanarak kapsamlı ideolojik propaganda yaymaya başladı."
 mtg_britain.64.t:0 "[From.GetName] Propaganda Yayıyor"
 mtg_britain.65.a:0 "Buna nasıl cüret ed... Yani, Yaşasın Britannia!"
 mtg_britain.65.d:0 "[From.GetNameDefCap], halkımızın desteğiyle, şimdi hükûmetimizi tamamen feshetti ve yeni seçimler için çağrıda bulundu. Bunlar, sadık bir hükûmetin ezici bir zafer kazandığı bir komediden başka bir şey değildi."
 mtg_britain.65.t:0 "[From.GetName] Hükûmeti Değiştiriyor"
 mtg_britain.66.a:0 "Bu durumda bir yanlışlık görmüyoruz."
 mtg_britain.66.b:0 "Bu kabul edilemez! Bağımsızlığımızı ilan edeceğiz!"
 mtg_britain.66.c:0 "Hükümetimiz henüz [ENG.GetAdjective] inançlarını paylaşmıyor olabilir, ancak rüzgar yön değiştiriyor."
 mtg_britain.66.d:0 "[ENG.GetAdjective] hükûmeti muazzam siyasi değişiklikler geçirdi. Şimdi ideolojik görüşlerimiz bu kadar farklıyken sadık kalıp kalmayacağımıza karar vermeliyiz."
 mtg_britain.66.e:0 "Bu kabul edilemez! Kendimizi İngiltere'den uzaklaştırmalıyız."
 mtg_britain.66.t:0 "Britanya'ya Sadakat"
 mtg_britain.67.a:0 "Bunun ne kadar süreceğini göreceğiz."
 mtg_britain.67.d:0 "[From.GetNameDefCap], seçtiğimiz ideolojik yolla aynı fikirde olamayacaklarını ve bu nedenle İmparatorluk'tan ayrılmaktan başka bir seçenek görmediklerini bize bildirdi."
 mtg_britain.67.t:0 "[From.GetName] Bağımsızlık İlan Ediyor"
 mtg_britain.68.a:0 "Şiddetle itiraz edeceğiz."
 mtg_britain.68.b:0 "Yapabileceğimiz bir şey yok."
 mtg_britain.68.d:0 "[ENG.GetNameDefCap], [FROM.GetNameDef]'de bir Komünist hükûmeti zorla kabul ettiriyor. Sınırımızda böyle bir ideolojik tehdidin ortaya çıkmasına kesinlikle izin veremeyiz, değil mi?!"
 mtg_britain.68.t:0 "Kanada'da Komünizm"
 mtg_britain.68_tt:0 "Kanada'yı güvence altına alma çabalarının hepsini terk et.\n"
 mtg_britain.69.a:0 "Bırakın o talebi uygulamaya çalışsınlar."
 mtg_britain.69.b:0 "O zaman uymaktan başka seçeneğimiz yok."
 mtg_britain.69.d:0 "[From.GetNameDefCap], [CAN.GetNameDef]'de komünizmin yayılmasını derhal durdurmamızı talep eden bir ültimatom yayınladı."
 mtg_britain.69.t:0 "[USA.GetName], [CAN.GetAdjective] Komünizmine İtiraz Ediyor"
 mtg_britain.7.a:0 "Bu, Kral için hoş bir destek gösterisidir."
 mtg_britain.7.d:0 "[GETUKPROKINGNEWSPAPER]'daki yakın tarihli bir makale, Kral'ın mutluluk hakkını vurguladı ve eğer kurallar onun boşanmış bir kadınla evlenmesine izin vermiyorsa, belki de o kuralların modernize edilme zamanının geldiğini savunuyor."
 mtg_britain.7.t:0 "Gazeteler Evliliği Destekliyor"
 mtg_britain.70.a:0 "O zaman yetkimizi askeri yollarla kazanmalıyız."
 mtg_britain.70.b:0 "Blöfümüzü gördüler - geri adım atmalıyız."
 mtg_britain.70.d:0 "[From.GetNameDefCap] taleplerimizi reddetti ve [CAN.GetAdjective] işçileri üzerinde hiçbir yetkimiz olmadığını bize bildirdi."
 mtg_britain.70.t:0 "[From.GetName] Geri Adım Atmayı Reddediyor"
 mtg_britain.71.a:0 "Kendileri için en iyisini biliyorlar."
 mtg_britain.71.d:0 "[From.GetNameDefCap], [CAN.GetNameDef]'de komünizmi yaymaktan kaçınacaklarını bize bildiriyor."
 mtg_britain.71.t:0 "[From.GetName] Geri Adım Atıyor"
 mtg_britain.72.a:0 "Uğursuz... En kötüsüne hazırlansak iyi olur."
 mtg_britain.72.d:0 "Hint alt kıtasında tek bir devleti sürdürmeye çalışmak, büyük miktarda sürtünmeyle sonuçlanıyor gibi görünüyor. Dini farklılıklar, özellikle ülkenin kuzeybatı ve kuzeydoğusunda halk arasında huzursuzluğa ve çatışmalara neden olmaya başlıyor, önde gelen kişiler ise giderek daha düşmanca bir söylem kullanıyor. Kriz yavaşlama belirtisi göstermiyor ve hatta Burma'da bile insanlar ayrılıktan bahsediyor..."
 mtg_britain.72.t:0 "Kuzey Hindistan'da Sivil Kargaşa"
 mtg_britain.73.a:0 "Böylece ayrılmalarına izin veremeyiz!"
 mtg_britain.73.b:0 "Bu, uğruna savaşılacak bir şey değil."
 mtg_britain.73.d:0 "Ülkenin kuzeyindeki gerilimler nihayet kırılma noktasına ulaştı ve Müslüman ile Hindu nüfusları arasındaki açık şiddet bir iç savaşa tırmandı. Geçici bir Müslüman hükûmeti kuruldu, tam Pakistan bağımsızlığını ilan etti ve bunu askeri yollarla savunma kararlılığını duyurdu."
 mtg_britain.73.t:0 "Hindistan İç Savaşı"
 mtg_britain.74.a:0 "Bağımsızlıklarını kabul etme zamanı geldi."
 mtg_britain.74.b:0 "Bağımsızlıklarını asla kabul etmeyeceğiz!"
 mtg_britain.74.d:0 "[PAK.GetNameDef] ile olan savaşımız duraksadı ve savaşın sonu görünmediği için anlamsız can kaybına karşı kamuoyu tepkisi olumsuzlaştı. Belki de barış müzakerelerine başlamak için iyi bir zamandır?"
 mtg_britain.74.t:0 "[PAK.GetName] ile İç Savaş Duraksadı"
 mtg_britain.75.a:0 "Sonunda."
 mtg_britain.75.d:0 "[RAJ.GetNameDef], bağımsızlığımızı kabul etmeye boyun eğdi. Düşen yerel destek karşısında, bu yorucu savaşı sürdürmenin daha fazla bir anlamı olmadığını düşünüyorlar."
 mtg_britain.75.t:0 "[RAJ.GetName] Bağımsızlığımızı Tanıyor"
 mtg_britain.76.a:0 "O zaman kan dökmeliyiz."
 mtg_britain.76.b:0 "Bu anlamsız - bağımsızlıklarını kabul etmeliyiz."
 mtg_britain.76.d:0 "Doğu ve Batı [PAK.GetName] arasındaki kültürel farklılıklar artan gerilimlere neden oldu ve şimdi Bangladeşliler 'bizim baskımız' olarak gördükleri şeye karşı açık bir isyana giriştiler. Kan dökmeden bölgeyi tekrar kontrol altına almamız pek olası değil..."
 mtg_britain.76.t:0 "Pakistan İç Savaşı"
 mtg_britain.77.a:0 "Bağımsızlıklarını kabul etme zamanı geldi."
 mtg_britain.77.b:0 "Bağımsızlıklarını asla kabul etmeyeceğiz!"
 mtg_britain.77.d:0 "[BAN.GetNameDef] ile olan savaşımız duraksadı ve savaşın sonu görünmediği için anlamsız can kaybına karşı kamuoyu tepkisi olumsuzlaştı. Belki de barış müzakerelerine başlamak için iyi bir zamandır?"
 mtg_britain.77.t:0 "[BAN.GetName] ile İç Savaş Duraksadı"
 mtg_britain.78.d:0 "[PAK.GetNameDef], bağımsızlığımızı kabul etmeye boyun eğdi. Düşen yerel destek karşısında, bu yorucu savaşı sürdürmenin daha fazla bir anlamı olmadığını düşünüyorlar."
 mtg_britain.78.t:0 "[PAK.GetName] Bağımsızlığımızı Tanıyor"
 mtg_britain.79.a:0 "En azından bu şekilde Sovyetlerle tek başımıza savaşmayacağız."
 mtg_britain.79.b:0 "Uyumumuzu ancak bizim soğuk, ölü ellerimizden alabilirler!"
 mtg_britain.79.d:0 "[From.GetNameDefCap], düşmanları [SOV.GetNameDef]'e saldırmak için topraklarımızdan geçiş talep ettiklerini bize bildiriyor. Acil uyumumuzu ve geniş kapsamlı hükûmet denetimini talep ediyorlar. Eğer yapmazsak, kuvvetlerini onayımız OLMADAN topraklarımızdan geçirmekten başka çareleri olmadığını söylüyorlar..."
 mtg_britain.79.t:0 "[From.GetNameDefCap] Uygunluk Talep Ediyor"
 mtg_britain.8.a:0 "Kral'a karşı talihsiz bir darbe."
 mtg_britain.8.d:0 "[GETUKANTIKINGNEWSPAPER]'daki yakın tarihli bir makale, Kral'ın ülkesine ve halkına karşı sorumluluklarını gerekçe göstererek, statüsünün ve ayrıcalıklarının görev yüküyle geldiğini ve bu nedenle ya evliliğini ya da tacını feda etmesi gerektiğini belirtiyor."
 mtg_britain.8.t:0 "Gazeteler Evliliğe Karşı Çıkıyor"
 mtg_britain.80.a:0 "İyi - Kafkaslar üzerinden Stalingrad'a!"
 mtg_britain.80.d:0 "[From.GetNameDefCap] taleplerimizi kabul etti ve toprakları üzerinde bize geniş kapsamlı bir kontrol verdi."
 mtg_britain.80.t:0 "[From.GetNameDefCap] Talepleri Kabul Ediyor"
 mtg_britain.81.a:0 "Bunu onlar istedi."
 mtg_britain.81.d:0 "[From.GetNameDefCap] taleplerimizi reddetti. Temsilcilerinin ifadesiyle: \"Eğer onların itaatini istiyorsak, bunu onların soğuk, ölü ellerinden zorla almak zorunda kalacağız!\""
 mtg_britain.81.t:0 "[From.GetName] Talepleri Reddediyor"
 mtg_britain.82.a:0 "Gündemimizi zorlayalım."
 mtg_britain.82.b:0 "Sesimiz duyulsun!"
 mtg_britain.82.d:0 "Önümüzdeki iki ay boyunca, Britanya hükûmeti ve Dominyonlardan temsilciler, tüm İmparatorluğu ilgilendiren konuları görüşmek üzere Londra'da toplanacak. Bu, savunma, ticaret veya Yatıştırma gibi konuları tartışmak için mükemmel bir zaman, umarım İmparatorluğa mevcut krizi atlatmak için en iyi şansı verir.\n\nAyrıca, bu, önceki İmparatorluk Konferanslarında defalarca gündeme getirilen İmparatorluk Federasyonu meselesini kesin olarak çözmek için en iyi zaman olabilir. Britanya Milletler Topluluğu'nun geleceğinin, bağımsız ve egemen ulusların gevşek bir birliği mi, yoksa küresel kargaşa karşısında güçlü durabilecek sıkı sıkıya bağlı bir federasyon mu olacağı, önümüzdeki aylarda pekala kararlaştırılabilir."
 mtg_britain.82.t:0 "[?global.year|0] İmparatorluk Konferansı"
 mtg_britain.82_tt:0 "Bu görüş değiştirici, konferans sona erdiğinde kaldırılacaktır. Katılımcıların görüşü ne kadar yüksek olursa, tekliflerinizi kabul etme olasılıkları o kadar artar.\n"
 mtg_britain.83.a:0 "Umarım Dominyonlar kabul eder."
 mtg_britain.83.b:0 "Dominyonları kabul etmeye ikna etmek için diplomatik çaba harca."
 mtg_britain.83.c:0 "Dominyonları kabul etmeye ikna etmek için muazzam diplomatik çaba harca."
 mtg_britain.83.d:0 "Mevcut küresel kriz ışığında, İmparatorluk savunmasının sorumluluğunu artık tamamen kendimiz üstlenemeyeceğimiz ve bu nedenle Dominyonlarımıza daha fazla güvenmemiz gerektiği açıktır. Her devlet kendi savunma harcamalarını artırmalıdır, böylece bütün, dünyanın bize fırlatabileceği her şeye karşı daha güçlü durabilir."
 mtg_britain.83.t:0 "İmparatorluk Konferansı: Savunma"
 mtg_britain.84.a:0 "İmparatorluğun savunması hepimize bağlıdır."
 mtg_britain.84.b:0 "Bunun için bütçemiz yok."
 mtg_britain.84.d:0 "[From.GetAdjective] temsilcileri konferansta, bir bütün olarak İmparatorluğun yeniden silahlanma ve savunmaya daha fazla harcama yapması arzusunu belirttiler. Eğer kabul edersek, kendi yerel savunmamıza daha iyi bakma yükünü kabul eder ve [From.GetAdjective] desteğine daha az güveniriz."
 mtg_britain.85.a:0 "İmparatorluğa karşı görevlerini yapıyorlar."
 mtg_britain.85.d:0 "[From.GetAdjective] hükûmeti, savunma harcamalarını artırma teklifimizi kabul ettiklerini bize bildirdi. Bunu derhal yapacaklarına yemin ettiler."
 mtg_britain.85.t:0 "İmparatorluk Konferansı: Savunma - [From.GetName] Kabul Ediyor"
 mtg_britain.86.a:0 "Korumamızdan sülük gibi yararlanıyorlar!"
 mtg_britain.86.d:0 "[From.GetAdjective] hükûmeti, savunma harcamalarını artırma imkanları olmadığını bize bildiriyor. Bu nedenle teklifimizi reddetmek zorunda kaldılar."
 mtg_britain.86.t:0 "İmparatorluk Konferansı: Savunma - [From.GetName] Reddediyor"
 mtg_britain.87.d:0 "Eğer İmparatorluk gelişecekse, zaten mevcut olan tercihli ticaret anlaşmalarını genişletmeliyiz. Dominyonların, sanayimizi en verimli şekilde besleyebilmemiz için Britanya Adaları'nın endüstriyel merkezine ihracatlarını artırmalarını öneriyoruz."
 mtg_britain.87.t:0 "İmparatorluk Konferansı: Ticaret"
 mtg_britain.88.a:0 "İmparatorluğun hayatta kalması buna bağlıdır."
 mtg_britain.88.b:0 "İstediğimiz şekilde ticaret yapacağız."
 mtg_britain.88.d:0 "[From.GetAdjective] hükûmeti, Britanya endüstriyel merkezine sunulan ithalatı artırmak için zaten mevcut olan tercihli ticaret anlaşmalarını genişletme arzusunu dile getirdi. Daha güçlü bir Britanya'nın bir bütün olarak daha güçlü bir İmparatorluk anlamına geleceğini savunuyorlar."
 mtg_britain.89.a:0 "Birlikte refaha ereceğiz."
 mtg_britain.89.d:0 "[From.GetAdjective] hükûmeti, ihracatı artırma teklifimizi kabul ettiklerini bize bildirdi. Ticaret düzenlemelerini derhal değiştirecekler."
 mtg_britain.89.t:0 "İmparatorluk Konferansı: Ticaret - [From.GetName] Kabul Ediyor"
 mtg_britain.9.a:0 "Kriz hükûmetin en üst kademelerine yayıldı."
 mtg_britain.9.d:0 "Kral'ın halka açık bir radyo konuşması yapmasının ona halk arasında çok fazla destek vereceğinden korkan Başbakan [Root.GetLeader], şimdi buna izin vermeyi reddetti. Bu konuda Başbakanına karşı gelemeyen Kral, şimdilik 'hikayenin kendi tarafını' kendine saklamaktan başka çaresi kalmadı."
 mtg_britain.9.t:0 "Başbakan Kral'ı Kısıtlıyor"
 mtg_britain.90.a:0 "Sadece kendilerini düşünüyorlar!"
 mtg_britain.90.d:0 "[From.GetAdjective] hükûmeti, ihracatı artırma ve tercihli ticaret programını genişletme teklifimizi reddetti. Yerel ekonomik durumlarını olumsuz etkilemesinden korkuyorlar."
 mtg_britain.90.t:0 "İmparatorluk Konferansı: Ticaret - [From.GetName] Reddediyor"
 mtg_britain.91.d:0 "Güçlü bir ekonomi, tüm İmparatorluğu destekleyen bel kemiğidir. Dominyonların yerel endüstriyel birikimlerini ihmal etmemeleri, sanayileşmenin devam eden ilerlemesine yoğun bir şekilde yatırım yapmaları zorunludur."
 mtg_britain.91.t:0 "İmparatorluk Konferansı: Ekonomi"
 mtg_britain.92.a:0 "Ekonomimiz önümüzdeki fırtınayı atlatmak için güçlü olmalı."
 mtg_britain.92.b:0 "Şu anda bunun için fonumuz yok."
 mtg_britain.92.d:0 "[From.GetAdjective] liderleri, yerel endüstriyel birikimimizin önemi konusunda ikna edici bir gerekçe sundular. Hükûmet yatırımlarını bu sektörde artırmamızı arzu ediyorlar."
 mtg_britain.93.a:0 "Yatırımları bolca karşılığını verecektir."
 mtg_britain.93.d:0 "[From.GetAdjective] hükûmeti, yerel sanayilerine yönelik yatırımları artırma talebimizi kabul ettiklerini bize bildirdi. Bu fonları derhal serbest bırakacaklar."
 mtg_britain.93.t:0 "İmparatorluk Konferansı: Ekonomi - [From.GetName] Kabul Ediyor"
 mtg_britain.94.a:0 "Servetimizden sülük gibi yararlanıyorlar!"
 mtg_britain.94.d:0 "[From.GetAdjective] hükûmeti, yerel sanayilerine yönelik yatırımları artırma talebimizi reddetti. Doğal büyümenin uzun vadede sektöre daha fazla fayda sağlayacağını iddia ediyorlar."
 mtg_britain.94.t:0 "İmparatorluk Konferansı: Ekonomi - [From.GetName] Reddediyor"
 mtg_britain.95.d:0 "Yatıştırma politikası, İmparatorluk içinde eleştirisiz kalmadı. Bu noktayı bir kez daha tartışmaya açmalı ve belki de diplomatik tonda bir değişikliğin gerekli olduğunu, ancak bunun İmparatorluğun desteğini gerektirdiğini kabul etmeliyiz."
 mtg_britain.95.t:0 "İmparatorluk Konferansı: Yatıştırma"
 mtg_britain.96.a:0 "Belki de Yatıştırmanın başarısızlığıyla yüzleşmeliyiz."
 mtg_britain.96.b:0 "Yatıştırma politikamıza sadık kalmalıyız."
 mtg_britain.96.d:0 "[From.GetAdjective] liderleri, Yatıştırma politikasının belki de kusurlu olduğunu kabul ediyor ve bunu tartışmaya açmaya istekliler. Diplomatik duruşlarını değiştirmeye açıklar, ancak bunu sadece İmparatorluğun desteğine sahip olurlarsa yapacaklar."
 mtg_britain.97.a:0 "Tehdidi görüyorlar."
 mtg_britain.97.d:0 "[From.GetAdjective] hükûmeti, Yatıştırmanın miadını doldurduğunu ve küresel çıkarlarımızı savunmak için daha güçlü bir duruşun gerekli olduğunu, bu savaşa yol açsa bile kabul ettiklerini bize bildirdi."
 mtg_britain.97.t:0 "İmparatorluk Konferansı: Yatıştırma - [From.GetName] Kabul Ediyor"
 mtg_britain.98.a:0 "Hiçbir omurgaları yok!"
 mtg_britain.98.d:0 "[From.GetAdjective] hükûmeti, Yatıştırma konusundaki şüphelerimizle aynı fikirde değil, bir savaşa yakalanmayı göze alamayacağımızı ve bizi test etmek isteyenleri yatıştırma politikamızı sürdürmemiz gerektiğini savunuyor."
 mtg_britain.98.t:0 "İmparatorluk Konferansı: Yatıştırma - [From.GetName] Reddediyor"
 mtg_britain.99.d:0 "Tüm Britanya İmparatorluğu'nu kapsayan bir federal süper devlet kavramı zaten yarım asırdan daha eskidir, ancak önceki İmparatorluk Konferansları bu konuda bir karara varamadı. Dominyonlar için özyönetime doğru yolumuza çok fazla sapmadan önce son bir şansımız var. Onlara, bunun hem halkları için hem de bir bütün olarak Milletler Topluluğu için mümkün olan en iyi çözüm olduğunu anlatmalıyız."
 mtg_britain.99.t:0 "İmparatorluk Konferansı: Federasyon"
 mtg_britain.999.a:0 "Kral öldü. Yaşasın Kral!"
 mtg_britain.999.d:0 "Başkent bölgesindeki kapsamlı stratejik bombalama şimdi nihai bedelini aldı. Dün öğleden sonra 3:41'de, St. James parkı ve Buckingham Sarayı, çok sayıda düşman bombardıman uçağı tarafından gerçekleştirilen bir saldırıyla vuruldu. Kurtarma servisleri dakikalar içinde olay yerine gelse de, bir bombanın patlayıp mahzenin tavanını üzerlerine yıktığında Kral Edward ve eşi Wallis'in anında öldüğü sonucuna varmak zorunda kaldılar.\n\nKral'ın ölümü ulusu yasa boğsa da, halefinin taç giyme töreni için hazırlıklar şimdiden başladı. Kral'ın morganatik evliliğinin bir sonucu olarak, veraset hattı şimdi kardeşi Albert'e geçiyor, o da taç giyme törenine hazırlanırken VI. George kraliyet adını seçti."
 mtg_britain.999.t:0 "Buckingham Sarayı Bombalandı - Kral Edward Öldü"
 mtg_exile_government.2.a:0 "Kendi topraklarına dönme zamanları geldi."
 mtg_exile_government.2.b:0 "Zaman henüz olgunlaşmadı."
 mtg_exile_government.2.desc:0 "[From.GetLeader], [Root.GetAdjective] hükûmetinden [From.GetNameDef]'e dönme ve savaş sonrası barışa hazırlık olarak geçici bir [From.GetRulingPartyLong] kabinesi yeniden kurma iznini resmen talep etti."
 mtg_exile_government.2.title:0 "[From.GetAdjective] Sürgün Hükûmeti"
 mtg_exile_government.3.a:0 "Kabul ediyoruz."
 mtg_exile_government.3.b:0 "Onların emri altında hizmet etmeyeceğiz."
 mtg_exile_government.3.desc:0 "[From.GetAdjective] donanma liderliği, donanmamızı kendilerininkine entegre etme planıyla bize başvurdu. [From.GetAdjective] donanma planlamacılarının gemilerimiz üzerinde tam kontrole sahip olmasına izin vererek, etkinliklerinin mevcut bağımsız eylemlerine kıyasla önemli ölçüde artacağını savunuyorlar."
 mtg_exile_government.3.title:0 "[From.GetName] Donanma Entegrasyonu Talep Ediyor"
 mtg_exile_government.4.desc:0 "[From.GetAdjective] hükûmeti, teklifimizi kabul ettiklerini ve bundan böyle gemilerinin bizim komutamız altında faaliyet göstereceğini bize bildirdi."
 mtg_exile_government.4.title:0 "[From.GetName] Donanma Entegrasyonunu Kabul Ediyor"
 mtg_exile_government.5.a:0 "Gururlarını ittifakın çıkarlarının üstünde tutuyorlar."
 mtg_exile_government.5.desc:0 "[From.GetAdjective] hükûmeti, donanmalarının asla bir yabancı gücün komutası altında hizmet etmeyeceğini bize bildirdi. Bize yardım etmeyi planlıyorlar, ancak bunu bağımsız olarak yapacaklar."
 mtg_exile_government.5.title:0 "[From.GetName] Donanma Entegrasyonunu Reddediyor"
 mtg_exile_leader_added.1.a:0 "Mücadelen henüz bitmedi."
 mtg_exile_leader_added.1.desc:0 "[From.GetName], düşmanın elindeki bölge ve birkaç tarafsız eyalette geçen uzun ve tehlikeli bir yolculuğun ardından nihayet başkente ulaştı. Kısa bir iyileşme sürecinin ardından [From.GetSheHe], ortak mücadelemizde [From.GetHerHis] hizmetlerini teklif etti. \n\n Bildirildiğine göre, [From.GetSheHe] \"insanları öldürme ve bir şeyleri kırma işine geri dönmeye\" oldukça hevesli."
 mtg_exile_leader_added.1.t:0 "[exile_nation.GetAdjective] Sürgün Lideri Hizmet Teklif Ediyor"
 mtg_generic.1.a:0 "Kabul etmekten başka çaremiz yok."
 mtg_generic.1.desc:0 "Mevcut hükûmetimiz için bariz seçim desteği eksikliğini gerekçe gösteren [From.GetNameDef], siyasette bir değişiklik talep etti."
 mtg_generic.1.title:0 "[From.GetName] Hükûmet Değişikliği Uyguluyor"
 mtg_germany.1.a:0 "O zaman onlara katılacağız."
 mtg_germany.1.b:0 "O zaman onlarla yüzleşeceğiz."
 mtg_germany.1.d:0 "Yakın zamanda ticaret taleplerine boyun eğdiğimiz için, [From.GetNameDef] şimdi bir ültimatom yayınladı: derhal onlara katılmalıyız, yoksa askeri güçleriyle yüzleşiriz."
 mtg_germany.1.t:0 "[From.GetName] Uyum Talep Ediyor"
 mtg_germany.2.d:0 "[From.GetAdjective] hükûmeti taleplerimize olumlu yanıt verdi ve savaşlarımızda bize yardımlarını sunacaklar."
 mtg_germany.2.t:0 "[From.GetName] Uyuyor"
 mtg_germany.3.a:0 "O zaman ölümü seçtiler."
 mtg_germany.3.d:0 "[From.GetAdjective] hükûmeti, askeri güç tehditlerimize rağmen taleplerimizi reddetti."
 mtg_germany.3.t:0 "[From.GetName] Uyumu Reddediyor"
 mtg_netherlands.1.a:0 "İdeal değil, ama başka seçeneğimiz yok."
 mtg_netherlands.1.b:0 "Hayır! Adaları sadece kendileri için istiyorlar."
 mtg_netherlands.1.c:0 "Durum tırmanmasın diye kontrolü İngilizlere verin."
 mtg_netherlands.1.d:0 "Anavatanımızın işgalinin ardından mevcut askeri zayıflığımızı gerekçe gösteren [VEN.GetAdjective] hükûmeti, ABC Adalarını düşman saldırılarından 'korumaya yardımcı olma' teklifiyle geldi. Yardımları artık gerekmediğinde ayrılmaya istekli olup olmayacakları şüpheli..."
 mtg_netherlands.1.e:0 "Durum tırmanmasın diye kontrolü Amerikalılara verin."
 mtg_netherlands.1.t:0 "Venezüella ABC Adalarını 'Korumayı' Teklif Ediyor"
 mtg_netherlands.10.a:0 "Umarım bir öncekinden daha istikrarlı olur."
 mtg_netherlands.10.d:0 "Colijn'in beşinci kabinesi, selefleri gibi bir kez daha düştü ve Devlet Bakanı Dirk Jan de Geer'den yeni bir hükûmet kurma sorumluluğunu üstlenmesi istendi. En son 1933'te hizmet veren, ülkesine barış zamanında hizmet etme yeteneklerini kanıtladı. Ancak artan dünya gerilimiyle, yeni Başbakanın giderek daha olası görünen bir savaşta ulusu yönetmeyi nasıl ele alacağı belirsiz."
 mtg_netherlands.10.t:0 "Yeni Hükûmet Kuruluyor"
 mtg_netherlands.11.a:0 "Onlara adaların kontrolünü ver."
 mtg_netherlands.11.b:0 "Onlara hayati kaynakların büyük ölçekli ithalatını vaat et."
 mtg_netherlands.11.d:0 "Japonların Doğu Hint Adalarımızın kaynaklarına muazzam bir ilgi duyduğu bir sır değil. Bize iki seçenek sunuluyor: ya Japonlara sömürgelerimizde istedikleri kaynaklara özel haklar vermek ya da onlara sömürgelerin tamamen kontrolünü vermek. Eğer [JAP.GetNameDef] ile barışçıl ilişkileri sürdürmek istiyorsak, bir seçim yapmak zorunda kalacağız."
 mtg_netherlands.11.t:0 "Doğu Hint Adaları'nda Japon İlgisi"
 mtg_netherlands.12.a:0 "Bu, zor durumumuz için kabul edilebilir bir çözüm olurdu."
 mtg_netherlands.12.b:0 "Sömürgelerini tutabilirler - alternatif çözümlerimiz var."
 mtg_netherlands.12.d:0 "Devam eden barışın çıkarı için ve kaynak zengini bölgedeki ilgimizi bilerek, [From.GetNameDefCap], tüm Doğu Hint Adaları'nı bizim kontrolümüze devretmeyi teklif etti."
 mtg_netherlands.12.t:0 "[From.GetNameDefCap] Doğu Hint Adaları'nın Kontrolünü Teklif Ediyor"
 mtg_netherlands.13.a:0 "Bu kabul edilebilir bir uzlaşmadır."
 mtg_netherlands.13.b:0 "Bu 'uzlaşma' yeterince iyi değil."
 mtg_netherlands.13.d:0 "Devam eden barışın çıkarı için ve kaynak zengini bölgedeki ilgimizi bilerek, [From.GetNameDefCap] bir çözüm buldu. Bize bölge üzerinde doğrudan kontrol vermek yerine, oradaki kaynaklara tek hakları bize vermeyi teklif ediyorlar."
 mtg_netherlands.13.t:0 "[From.GetNameDefCap] Doğu Hint Adaları İthalatını Teklif Ediyor"
 mtg_netherlands.14.a:0 "Keşke daha fazla insan onun kararlılığını paylaşsa."
 mtg_netherlands.14.d:0 "Hükûmeti saran yaygın bozguculuktan bıkan Kraliçe Wilhelmina, suçlu bakanların kovulması için bastırdı. Başbakan De Geer, alenen yüzünü kaybetmek yerine 'sağlık nedenleriyle' istifa etmesine izin verildi. Umulur ki gelecekte bize daha fazla sorun çıkarmaz...\n\nYerine gelen Pieter Sjoerds Gerbrandy, de Geer'in bozguncu tutumlarını reddetmesiyle zaten kendini ayırdı. Eğer savaş boyunca bu tutumunu sürdürürse, kabinenin geri kalanına iyi bir örnek olacaktır."
 mtg_netherlands.14.t:0 "Kraliçe Bozgunculuk Yapan Bakanları Kovuyor"
 mtg_netherlands.15.a:0 "Harika fikir."
 mtg_netherlands.15.b:0 "Bizce değil."
 mtg_netherlands.15.d:0 "[From.GetNameDefCap], Napolyon Savaşları'nın ardından var olan Birleşik Hollanda tampon devletini yeniden kurma teklifiyle geldi. Savaş çabalarına katkılarını, Belçikalıların ve Lüksemburgluların göreceli işe yaramazlığına kıyasla, sadece ödüllendirilmeleri gerektiği için değil, aynı zamanda bu planın gelecekte kıtasal barışın korunmasına yardımcı olacağı için bir neden olarak gösteriyorlar."
 mtg_netherlands.15.t:0 "[From.GetNameDefCap] Birleşik Hollanda'yı Öneriyor"
 mtg_netherlands.16.a:0 "Çok mükemmel bir haber."
 mtg_netherlands.16.d:0 "İngilizler, Aşağı Ülkeleri birleştirme teklifimize olumlu tepki verdiler. Toprağın kurtarıldıkça entegrasyonu için hazırlıklara başlayabiliriz."
 mtg_netherlands.16.t:0 "[From.GetNameDefCap] Birleşik Hollanda Teklifini Destekliyor"
 mtg_netherlands.17.a:0 "Nankörlükleri çok derin..."
 mtg_netherlands.17.d:0 "İngilizler, Aşağı Ülkeleri birleştirme teklifimize pek sıcak bakmadıklarını açıkça belirtti."
 mtg_netherlands.17.t:0 "[From.GetNameDefCap] Birleşik Hollanda Teklifini Reddediyor"
 mtg_netherlands.18.a:0 "Özgürlük ateşi böyle mi söndürülür?"
 mtg_netherlands.18.d:0 "İngilizlerin, Aşağı Ülkeleri Hollanda bayrağı altında birleştirme yönündeki Hollanda teklifini kabul ettiği dikkatimizi çekti. Hükûmetimizin temsilcilerine danışılmadı..."
 mtg_netherlands.19.a:0 "Bu çok mükemmel bir fikir!"
 mtg_netherlands.19.b:0 "İlgilenmiyoruz."
 mtg_netherlands.19.d:0 "[HOL.GetAdjective] temsilcileri, Aşağı Ülkeleri oluşturan uluslar arasında sıkı bir işbirliği için bir teklifle bizimle temasa geçti. Şimdi bu proje için resmi desteğimizi istiyorlar."
 mtg_netherlands.19.t:0 "[From.GetNameDefCap] Benelüks'e Davet Ediyor"
 mtg_netherlands.2.a:0 "Oyunumuz başarılı oldu."
 mtg_netherlands.2.d:0 "[HOL.GetAdjective] hükûmeti, ABC Adaları için 'koruma' sağlama teklifimizi kabul etti."
 mtg_netherlands.2.t:0 "[From.GetNameDefCap] Teklifimizi Kabul Ediyor"
 mtg_netherlands.20.d:0 "[HOL.GetAdjective] temsilcileri, Avrupa'nın demokratik küçük güçleri arasında sıkı bir işbirliği için bir teklifle bizimle temasa geçti. Şimdi bu proje için resmi desteğimizi istiyorlar."
 mtg_netherlands.20.t:0 "[From.GetNameDefCap] Avrupa Birliği'ne Davet Ediyor"
 mtg_netherlands.21.a:0 "Eğer bunun daha iyi olduğunu düşünüyorlarsa..."
 mtg_netherlands.21.d:0 "Etkileşimlerimizden, [From.GetNameDefCap]'in işlerimizin kontrolünü güvence altına almaya çalıştığı açıkça ortaya çıktı... Zaten bazı küçük yinelenen hükûmet dalları 'gereksiz' olarak kabul edildi ve bundan böyle doğrudan Amsterdam'dan yönetilecek."
 mtg_netherlands.21.t:0 "[From.GetNameDefCap] Sömürge Entegrasyonu Arıyor"
 mtg_netherlands.22.a:0 "Belki yeni hükûmete başka bir şekilde hizmet edebiliriz..."
 mtg_netherlands.22.d:0 "Sürgündeki Hükûmetten temsilciler, hükûmetin Batavia'ya taşınacağını ve bundan böyle sömürgeleri doğrudan oradan yöneteceğini bize bildirdi. Hizmetlerimize artık ihtiyaç duyulmuyor."
 mtg_netherlands.22.t:0 "[From.GetNameDefCap] Başkenti Batavia'ya Taşıyor"
 mtg_netherlands.23.a:0 "Barış sağlandı."
 mtg_netherlands.23.d:0 "[From.GetNameDefCap], tüm Doğu Hint Adaları'nı devralma teklifimizi kabul ediyor."
 mtg_netherlands.23.t:0 "[From.GetNameDefCap] Doğu Hint Adaları Devrini Kabul Ediyor"
 mtg_netherlands.24.d:0 "[From.GetNameDefCap], Doğu Hint Adaları kaynaklarına özel haklar alma teklifimizi kabul ediyor."
 mtg_netherlands.24.t:0 "[From.GetNameDefCap] Doğu Hint Adaları Kaynaklarını Kabul Ediyor"
 mtg_netherlands.25.a:0 "Ne kadar tuhaf... Ve endişe verici..."
 mtg_netherlands.25.d:0 "[From.GetNameDefCap], teklifimizin kendileri için ilgi çekici olmadığını bize bildirdi."
 mtg_netherlands.25.t:0 "[From.GetNameDefCap] Teklifimizi Reddediyor"
 mtg_netherlands.26.a:0 "Karayipler'e yabancı müdahaleye izin veremeyiz."
 mtg_netherlands.26.b:0 "Bize çıkarlarımızı söylemeye cüret etmemeliler."
 mtg_netherlands.26.d:0 "[HOL.GetAdjective] hükûmeti, Batı Hint Adaları'nda korumamızı talep etti. Askeri bir zayıflık döneminden geçtikleri için şimdi üçüncü tarafların saldırılarından korkuyorlar ve ilgi alanımızdaki çatışmaların bizim için en iyi çıkar olmayabileceğini öne sürüyorlar."
 mtg_netherlands.26.t:0 "[From.GetNameDefCap], Batı Hint Adaları'nın ABD Korumasını Talep Ediyor"
 mtg_netherlands.27.a:0 "Yanımızda ABD varken, birinin onları tehdit ettiğini görmek zor."
 mtg_netherlands.27.d:0 "[From.GetNameDefCap], Batı Hint Adaları'nın korunmasını üstlenmeye karar verdi. Sömürgelerimiz saldırıdan güvende olmalı."
 mtg_netherlands.27.t:0 "[From.GetNameDefCap], Batı Hint Adaları'nı Korumayı Kabul Ediyor"
 mtg_netherlands.28.a:0 "Bu çok hayal kırıklığı yaratıyor..."
 mtg_netherlands.28.d:0 "[From.GetNameDefCap], Batı Hint Adaları'nın kendi endişeleri olmadığını ve sömürgelerimizin savunulmasıyla ilgili herhangi bir güvence vermek istemediklerini bize bildirdi."
 mtg_netherlands.28.t:0 "[From.GetNameDefCap], Batı Hint Adaları'nı Korumayı Reddediyor"
 mtg_netherlands.29.a:0 "Onlara piyade teçhizatı ver."
 mtg_netherlands.29.b:0 "Onlara destek teçhizatı ver."
 mtg_netherlands.29.c:0 "Onlara topçu teçhizatı ver."
 mtg_netherlands.29.d:0 "[HOL.GetAdjective] hükûmeti, bir teçhizat sevkiyatı talep ederek bize ulaştı. Yardım olmadan bir işgal için zamanında ordularını donatamayacaklarını bize bildiriyorlar."
 mtg_netherlands.29.e:0 "Kendi başlarının çaresine bakmak zorunda kalacaklar."
 mtg_netherlands.29.t:0 "[From.GetNameDefCap] Teçhizat Talep Ediyor"
 mtg_netherlands.3.a:0 "Bunun yanlarına kalmasına izin vermeyeceğiz!"
 mtg_netherlands.3.d:0 "[HOL.GetAdjective] hükûmeti, ABC Adaları için 'koruma' sağlama teklifimizi reddetti."
 mtg_netherlands.3.t:0 "[From.GetNameDefCap] Teklifimizi Reddediyor"
 mtg_netherlands.30.a:0 "Yardımları unutulmayacak."
 mtg_netherlands.30.d:0 "[From.GetNameDefCap], yeniden askerileşmemize yardımcı olmak için bize bir teçhizat sevkiyatı gönderdi."
 mtg_netherlands.30.t:0 "[From.GetNameDefCap] Teçhizat Gönderiyor"
 mtg_netherlands.31.a:0 "Sanayi kapasitemizi abartıyorlar..."
 mtg_netherlands.31.d:0 "[From.GetNameDefCap] bize teçhizat göndermeyi reddetti, eğer ihtiyacımız varsa kendi sanayimizi daha fazla üretmeye odaklanmamızı öneriyorlar."
 mtg_netherlands.31.t:0 "[From.GetNameDefCap] Teçhizat Göndermeyi Reddetti"
 mtg_netherlands.32.a:0 "Mükemmel bir fikir!"
 mtg_netherlands.32.b:0 "Eğer korumamızı istiyorlarsa, bize resmi olarak katılmalılar."
 mtg_netherlands.32.d:0 "[HOL.GetAdjective] temsilcileri, eğer işgal edilirlerse savunmalarımızı koordine etmemize olanak tanıyan gizli kurmay planları hazırlamayı önerdi. Bunun kamuoyuna açıklanmamasının kritik olduğunu bize bildiriyorlar, çünkü tarafsızlıklarının herhangi bir ihlalinin savaşa yol açmasından korkuyorlar..."
 mtg_netherlands.32.t:0 "[From.GetNameDefCap] Birleşik Kurmay Planı Öneriyor"
 mtg_netherlands.32_tt:0 "§Y[From.GetNameDefCap]§!, bir Batı Avrupa devi tarafından saldırıya uğradıktan sonra 180 gün boyunca çekirdek toprağında tümen savunmasına bir bonus alacaktır.\n"
 mtg_netherlands.33.a:0 "Harika!"
 mtg_netherlands.33.d:0 "[From.GetNameDefCap], birleşik bir kurmay planı teklifimizi kabul etti."
 mtg_netherlands.33.t:0 "[From.GetNameDefCap] Birleşik Kurmay Planını Kabul Ediyor"
 mtg_netherlands.33_tt:0 "Bir Batı Avrupa devi tarafından saldırıya uğradıktan sonra 180 gün boyunca çekirdek toprağında tümen savunmasına bir bonus alacağız.\n"
 mtg_netherlands.34.a:0 "Bu mümkün değil."
 mtg_netherlands.34.d:0 "[From.GetNameDefCap], birleşik bir kurmay planı teklifimizi reddetti - eğer onların yardımını istiyorsak, resmi olarak talep etmeliyiz."
 mtg_netherlands.34.t:0 "[From.GetNameDefCap] Birleşik Kurmay Planını Reddediyor"
 mtg_netherlands.35.a:0 "Bu mükemmel bir fikir!"
 mtg_netherlands.35.b:0 "Topladığımız istihbaratı onlara veremeyiz."
 mtg_netherlands.35.d:0 "[From.GetNameDefCap], birlikte savaşırken karşılaşabileceğimiz muhtemel düşmanlar hakkında istihbarat alışverişinde bulunmayı teklif ediyor."
 mtg_netherlands.35.t:0 "[From.GetNameDefCap] İstihbarat Değişimi Talep Ediyor"
 mtg_netherlands.35_tt:0 "§Y[From.GetNameDefCap]§!, bir Batı Avrupa devi tarafından saldırıya uğradıktan sonra 180 gün boyunca saldırganına karşı hedefli bir saldırı ve savunma bonusu alacaktır.\n"
 mtg_netherlands.35_tt_2:0 "Başka bir Batı Avrupa deviyle savaşa girersek onlara karşı hedefli bir saldırı ve savunma bonusu alacağız.\n"
 mtg_netherlands.36.a:0 "Bu, savunmalarımıza yardımcı olmada büyük bir yol kat edecektir."
 mtg_netherlands.36.d:0 "[From.GetNameDefCap], birlikte savaşırken karşılaşabileceğimiz muhtemel düşmanlar hakkında istihbarat alışverişinde bulunmayı kabul etti."
 mtg_netherlands.36.t:0 "[From.GetNameDefCap] İstihbarat Değişimini Kabul Ediyor"
 mtg_netherlands.36_tt:0 "§Y[From.GetNameDefCap]§!, bir Batı Avrupa deviyle savaşa girdikten sonra 180 gün boyunca saldırganına karşı hedefli bir saldırı ve savunma bonusu alacaktır.\n"
 mtg_netherlands.36_tt_2:0 "Bir Batı Avrupa devi tarafından saldırıya uğradıktan sonra 180 gün boyunca saldırganımıza karşı hedefli bir saldırı ve savunma bonusu alacağız.\n"
 mtg_netherlands.37.a:0 "Görünüşe göre yeterince güvenilir değiliz..."
 mtg_netherlands.37.desc:0 "[From.GetNameDefCap], istihbaratlarını paylaşmayı reddetti."
 mtg_netherlands.37.t:0 "[From.GetNameDefCap] İstihbarat Değişimini Reddediyor"
 mtg_netherlands.4.a:0 "Bu yükü kabul edeceğiz."
 mtg_netherlands.4.b:0 "Yerel toprak anlaşmazlıklarına karışamayız."
 mtg_netherlands.4.d:0 "[HOL.GetAdjective] hükûmeti, Curaçao'nun korunmasını üstlenmemizi talep etti. Venezüellalılar tarafından 'koruma teklif etme' kisvesi altında temas kuruldu ve [VEN.GetAdjective] 'teklifini' reddederlerse düşmanlıkların patlak vermesinden korkuyorlar."
 mtg_netherlands.4.t:0 "[From.GetNameDefCap] ABC Adalarında Korumamızı Talep Ediyor"
 mtg_netherlands.41.a:0 "Güçlü bir [From.GetName], kullanışlı bir [From.GetName]'dir."
 mtg_netherlands.41.b:0 "Zayıf bir [From.GetName], daha iyi bir [From.GetName]'dir."
 mtg_netherlands.41.d:0 "[From.GetNameDefCap], askeri doktrinde büyük ilerlemeler kaydetmelerine olanak tanıyan askeri bilgilerimizden bazılarını paylaşmamızı talep ediyor."
 mtg_netherlands.41.t:0 "[From.GetNameDefCap] Askeri Bilgi Paylaşımı Talep Ediyor"
 mtg_netherlands.42.a:0 "Bu, ordumuzu modernize etmede büyük bir yol kat edecektir."
 mtg_netherlands.42.d:0 "[From.GetNameDefCap], doktrinlerinden ve askeri bilgilerinden bazılarını bizimle paylaştı."
 mtg_netherlands.42.t:0 "[From.GetNameDefCap] Askeri Bilgi Paylaşıyor"
 mtg_netherlands.43.a:0 "Zayıf kalmamızı mı istiyorlar?"
 mtg_netherlands.43.d:0 "[From.GetNameDefCap], askeri bilgilerini bizimle paylaşmayı reddetti."
 mtg_netherlands.43.t:0 "[From.GetNameDefCap] Askeri Bilgi Paylaşmayı Reddediyor"
 mtg_netherlands.45.a:0 "Çok talihsiz."
 mtg_netherlands.45.d:0 "Görünüşe göre Prens Bernhard rahatsız edici bir skandala karıştı. Özgür ruhlu doğası bazen büyük bir nimet olsa da, aynı zamanda bir lanete de dönüşebileceği görülüyor... Hükûmet şimdi Prens'in halk arasındaki itibarını düzeltmek için değerli kaynaklar harcamak zorunda."
 mtg_netherlands.45.t:0 "Prens Bernhard Skandala Karıştı"
 mtg_netherlands.46.a:0 "Gerçek bir Orange Hanedanı Evladı."
 mtg_netherlands.46.d:0 "Prens Bernhard son zamanlarda halk arasında olağanüstü bir izlenim bıraktı, gittiği her yerde moralleri yükseltti ve nihai zafer için umut verdi. Teknik olarak hükûmetin bir temsilcisi olmasa da, bu beklenmedik başarıdan yararlanmamızı engellemedi."
 mtg_netherlands.46.t:0 "Prens Bernhard İyi Bir İzlenim Bırakıyor"
 mtg_netherlands.47.a:0 "İyi uçuyor."
 mtg_netherlands.47.d:0 "Diğer pilotlarla olan ilişkilerinde, Prens Bernhard davranış ve muharebe uçuşu konusunda iyi bir örnek oluşturdu. Bu örnek zihinlerinde taze iken, komutanlar gökyüzümüzdeki it dalaşı performansında küçük ama fark edilebilir bir iyileşme fark edebilirler."
 mtg_netherlands.47.t:0 "Prens Bernhard İyi Örnek Oluyor"
 mtg_netherlands.48.a:0 "Pervasız..."
 mtg_netherlands.48.b:0 "Durumu kurtarmak için Prens'in 'ipuçlarını' itibarsızlaştırmalıyız."
 mtg_netherlands.48.d:0 "Küstahça bir özgüvenle, Prens Bernhard görünüşe göre diğer pilotlara taktiksel açıdan verimsiz ve genellikle açıkça tehlikeli olan 'bazı ipuçları' verdi. Pervasız cesaret eylemleri kayıpları şimdiden artırdı."
 mtg_netherlands.48.t:0 "Prens Bernhard Kötü Örnek Oluyor"
 mtg_netherlands.49.a:0 "Harika bir zekası var."
 mtg_netherlands.49.d:0 "Görünüşe göre Prens Bernhard son savaş planlarına kapsamlı bir şekilde müdahale etti. Neyse ki, tavsiyenin sağlam olduğu ve planların mükemmel sonuçlar verdiği görülüyor."
 mtg_netherlands.49.t:0 "Prens Bernhard Stratejiye Olumlu Müdahale Ediyor"
 mtg_netherlands.5.a:0 "Alternatiften daha iyidir."
 mtg_netherlands.5.d:0 "[From.GetNameDefCap], ABC Adaları için sorumluluk yükünü üstlenmeyi kabul etmeye karar verdi."
 mtg_netherlands.5.t:0 "[From.GetNameDefCap] ABC Adalarını Korumayı Kabul Ediyor"
 mtg_netherlands.50.a:0 "Harekete geçmek için çok geç..."
 mtg_netherlands.50.b:0 "Generallerimiz, Prens'in itibarını zedelese bile, onun 'tavsiyesini' dikkate almamalı."
 mtg_netherlands.50.d:0 "Görünüşe göre Prens Bernhard son savaş planlarına kapsamlı bir şekilde müdahale etti. Konumunu ve unvanını kullanarak ve her zamanki cüretkarlığı ve kendine güveniyle, tekliflerine karşı çıkacak olanları susturdu. Bir dizi savaş planı şimdi uygulanırken temel kusurlar gösteriyor gibi görünüyor."
 mtg_netherlands.50.t:0 "Prens Bernhard Stratejiye Olumsuz Müdahale Ediyor"
 mtg_netherlands.51.a:0 "Mükemmel bir fikir!"
 mtg_netherlands.51.b:0 "Onun bulduğu her şeye güvenemeyiz!"
 mtg_netherlands.51.d:0 "Son haftalarda uygun savaş planlarının formülasyonu için yetersiz istihbarat vardı ve son bir kurmay toplantısında bunun farkına varan Prens Bernhard, acilen ihtiyaç duyduğumuz istihbaratı sağlamak için [GER.GetNameDef]'deki kişisel bağlantılarını kullanmakta ısrar etti."
 mtg_netherlands.51.t:0 "Prens Bernhard İstihbarat Toplamak İstiyor"
 mtg_netherlands.52.a:0 "Gizli servise bir şereftir."
 mtg_netherlands.52.d:0 "Görünüşe göre Prens tarafından toplanan istihbarat sahada çok faydalı oldu. Birçok başarı doğrudan onun temaslarından aktarılan bilgilere atfedilebilir."
 mtg_netherlands.52.t:0 "Prens Bernhard İyi İstihbarat Topluyor"
 mtg_netherlands.53.a:0 "Aldığımız bir kumardı..."
 mtg_netherlands.53.d:0 "Görünüşe göre Prens tarafından toplanan istihbarat en doğru olanı değil... Düşman, darbelerin düşmesini beklediğimiz diğer noktaları güçlendirmek için birliklerden arındırdığımız yerlere defalarca saldırdı."
 mtg_netherlands.53.t:0 "Prens Bernhard Kötü İstihbarat Topluyor"
 mtg_netherlands.54.a:0 "Doğru olduğunu hissettiği şeyi yapmalı."
 mtg_netherlands.54.b:0 "Çok tehlikeli, yasaklamalıyız!"
 mtg_netherlands.54.d:0 "Son bir kurmay toplantısında konuşma işgal altındaki anavatanımızdaki eksik direnişe döndüğünde, Prens Bernhard görünüşe göre onu kişisel olarak 'düzene sokmayı' üstlendi. Zaten düşman hatlarının arkasına bir paraşütle atlama için hazırlanıyor."
 mtg_netherlands.54.t:0 "Prens Bernhard Direnişi Organize Etmek İstiyor"
 mtg_netherlands.55.a:0 "Şaşırtıcı bir başarı."
 mtg_netherlands.55.d:0 "Denizaltıyla tahliye edildikten sonra, Prens'in çabaları şimdiden hissedilebiliyor. Direniş çok daha etkili ve çok daha aktif."
 mtg_netherlands.55.t:0 "Prens Bernhard Direnişi Organize Ediyor"
 mtg_netherlands.56.a:0 "Cesareti bu sefer başarıyla ödüllendirilmedi."
 mtg_netherlands.56.d:0 "Direnişi organize etme çabalarında, bir işgalci baskını onu yaralı bıraktı. O zamandan beri denizaltıyla tahliye edildi, ancak tam savaş gücüne dönmesi biraz zaman alacak."
 mtg_netherlands.56.t:0 "Prens Bernhard Direnişi Organize Ederken Yaralandı"
 mtg_netherlands.58.a:0 "Bu çok utanç verici..."
 mtg_netherlands.58.d:0 "Yakın tarihli bir yabancı devlet adamlarıyla yapılan toplantıda, Prens Bernhard'ın bir tür diplomatik kriz yarattığı görülüyor. [HOL_bernhard_row_target.GetAdjective] temsilcileri onu iç işlerine karışmakla ve pek de incelikli olmayan bir şekilde suçladılar."
 mtg_netherlands.58.t:0 "Prens Bernhard Diplomatik Kriz Yaratıyor"
 mtg_netherlands.59.a:0 "Bu endişe verici... Umarım tırmanmaz."
 mtg_netherlands.59.d:0 "Yakın tarihli bir devlet adamlarımızla yapılan toplantıda, Hollanda Prensi Bernhard, temsilcilerimizden biriyle diplomatik bir krize girdi. Görünüşe göre Prens'i 'iç işlerine karışmakla' suçladı."
 mtg_netherlands.59.t:0 "[From.GetName] ile Diplomatik Kriz"
 mtg_netherlands.6.a:0 "O zaman [VEN.GetAdjective] teklifini kabul etmekten başka çaremiz yok."
 mtg_netherlands.6.b:0 "Peki, Venezüellalılar yine de alamayacak!"
 mtg_netherlands.6.d:0 "[From.GetNameDefCap], ABC Adaları için sorumluluk yükünü üstlenmeyi reddetmeye karar verdi. 'Yerel toprak anlaşmazlıkları' olarak adlandırdıkları şeye karışamayacaklarını söylüyorlar."
 mtg_netherlands.6.t:0 "[From.GetNameDefCap] ABC Adalarını Korumayı Reddediyor"
 mtg_netherlands.60.a:0 "Bırakın gelsinler."
 mtg_netherlands.60.b:0 "Gerilimi yatıştırmalıyız."
 mtg_netherlands.60.d:0 "[HOL.Adjective] yetkilileri diplomatik krizi tırmandırdı ve oldukça düşmanca bir dille tam bir özür dilememizi talep etti."
 mtg_netherlands.60.t:0 "[From.GetNameDef] Diplomatik Krizi Tırmandırıyor"
 mtg_netherlands.61.a:0 "O zaman savaş olsun."
 mtg_netherlands.61.d:0 "[From.GetNameDef] geri adım atmadı ve Prens Bernhard'a yönelik hakaret içeren suçlamalar ve iftiralar için bir özür dilemeyi reddediyor. Haklı olup olmadıkları ve Prens'in iç işlerine müdahale edip etmediği bir yana - şimdi uluslararası ilişkilerde kırılma noktasına ulaştık."
 mtg_netherlands.61.t:0 "[From.GetNameDef] Krizi Daha da Tırmandırıyor"
 mtg_netherlands.62.a:0 "Pekala."
 mtg_netherlands.62.d:0 "[From.GetAdjective] hükûmeti şimdi geri adım attı ve Prens Bernhard'a yönelttikleri suçlamalar için tam bir özür diledi. İç işlerine karışıp karışmadığı henüz belli değil, ama en azından şimdilik bu cephede sessiz kalmaya karar verdi."
 mtg_netherlands.62.t:0 "[From.GetNameDef] Gerilimi Yatıştırıyor"
 mtg_netherlands.63.a:0 "Buna hazırlanma öngörüsüne sahip olduğumuz için şanslıyız."
 mtg_netherlands.63.d:0 "Teslimiyetimizden önce, savaşın kaybedildiği açık olduğunda, altın rezervlerimizi yeni müttefiklerimize tahliye etme planımızı başarıyla uyguladık. Her an yelken açmaya hazır gemilerde tutulan altın, şimdi ev sahibi ülkemize güvenli bir şekilde ulaştı ve sürgündeki hükûmetimize büyük ölçüde yardımcı olmalı."
 mtg_netherlands.63.t:0 "Altın Rezervleri Tahliye Edildi"
 mtg_netherlands.64.a:0 "Bu mükemmel bir fikir gibi görünüyor!"
 mtg_netherlands.64.b:0 "Şu anda bunun için fonumuz yok."
 mtg_netherlands.64.d:0 "Flevopolder üzerindeki çalışmalar iyi bir başlangıç yaptı ve projenin tamamen bitmesine daha yıllar olmasına rağmen, şimdiden sıkı çalışmamızın bazı meyvelerini toplayabiliriz.\n\nBu büyüklükte bir arazi ıslah projesiyle pratik deneyim kazanırken, mühendisler yolların, demiryollarının ve su yollarının inşası için yeni yöntemler geliştirdiler. Eğer bu gelişmelere yatırım yaparsak, öngörülebilir gelecekte bu alanlarda önemli iyileştirmeler elde edebiliriz."
 mtg_netherlands.64.t:0 "Zuiderzee Çalışmaları Altyapı Gelişmelerini Ateşliyor"
 mtg_netherlands.65.d:0 "Flevopolder'daki ilerleme devam ettikçe, bu devasa projeyi tedarik eden sanayi de büyüyor. Projeye gerekli inşaat malzemelerini tedarik etmeye adanmış mühendisler, şimdi sanayinin geliştirilmesi ve fabrika ve tersanelerin inşası konusunda yeni bilgiler edindiler. Eğer bu gelişmelere yatırım yaparsak, öngörülebilir gelecekte bu alanda önemli iyileştirmeler elde edebiliriz."
 mtg_netherlands.65.t:0 "Zuiderzee Çalışmaları Sanayi Gelişmelerini Ateşliyor"
 mtg_netherlands.66.a:0 "Endişe verici."
 mtg_netherlands.66.b:0 "Onların [ENG.GetAdjective] nüfuz alanına kaymalarına izin veremeyiz!"
 mtg_netherlands.66.d.a:0 "İngilizler, mevcut ticaret müzakerelerinde onları kayırmak zorunda kalacağımız noktaya kadar üzerimizdeki nüfuzlarını genişlettiler."
 mtg_netherlands.66.d.b:0 "İngilizler, [HOL.GetNameDef] üzerindeki nüfuzlarını, [HOL.GetAdjective] hükûmetinin mevcut ticaret müzakerelerinde onları kayırmak zorunda hissettiği noktaya kadar genişlettiler."
 mtg_netherlands.66.t:0 "[ENG.GetName], [HOL.GetAdjective] Ticaret Müzakerelerine Hükmediyor"
 mtg_netherlands.67.b:0 "Onların [GER.GetAdjective] nüfuz alanına kaymalarına izin veremeyiz!"
 mtg_netherlands.67.d.a:0 "Almanlar, mevcut ticaret müzakerelerinde onları kayırmak zorunda kalacağımız noktaya kadar üzerimizdeki nüfuzlarını genişlettiler."
 mtg_netherlands.67.d.b:0 "Almanlar, [HOL.GetNameDef] üzerindeki nüfuzlarını, [HOL.GetAdjective] hükûmetinin mevcut ticaret müzakerelerinde onları kayırmak zorunda hissettiği noktaya kadar genişlettiler."
 mtg_netherlands.67.t:0 "[GER.GetName], [HOL.GetAdjective] Ticaret Müzakerelerine Hükmediyor"
 mtg_netherlands.69.a:0 "Biraz daha kabul etmek zorunda kalacaklar."
 mtg_netherlands.69.b:0 "Toprağı boşaltalım."
 mtg_netherlands.69.d:0 "Hollanda Su Hattı'nın sular altında bırakılması için bariz bir acil ihtiyaç olmamasıyla, yerel halk kırsalın boşaltılması çağrısında bulunmaya başladı, bu da onların günlük hayatlarına geri dönmelerine olanak tanıyacak. Taleplerini reddetmek muhtemelen daha sonra daha fazla huzursuzlukla sonuçlanacaktır."
 mtg_netherlands.69.t:0 "Yerel Halk 'Anlamsız' Sele Karşı Çıkıyor"
 mtg_netherlands.7.a:0 "Neden olmasın."
 mtg_netherlands.7.b:0 "Hayır. Kendi gemilerini kendileri tasarlayabilirler."
 mtg_netherlands.7.d:0 "[From.GetNameDefCap], Scharnhorst sınıfı muharebe kruvazörlerine yönelik planlarımızı paylaşmamızı talep etti. Bunları kendi \"Tasarım 1047 Savaş Kruvazörü\"nü yaratmak ve Doğu Hint Adaları kolonilerinde güç göstermelerini sağlamak için kullanmak istiyorlar."
 mtg_netherlands.7.t:0 "[From.GetNameDefCap] Zırhlı Kruvazör Planlarını Talep Ediyor"
 mtg_netherlands.70.d:0 "Çok sayıda Alman sığınmacı şimdi tam teşekküllü bir birim halinde örgütlendi, bizim adımıza savaşa göndermeden önce sadece teçhizatla donatılmaları gerekiyor."
 mtg_netherlands.70.t:0 "Alman Sığınmacılar Tümen Kuruyor"
 mtg_netherlands.71.a:0 "Hainler! Hepsi!"
 mtg_netherlands.71.d:0 "[HOL.GetNameDef] Kraliçesi Wilhelmina, savaş bittikten sonra Kaiser II. Wilhelm'i Almanya tahtına geri getirme istekliliğini açıkladı. Bu açıklama, askerlerimiz arasında yersiz bir iyimserliğe ve yanlış yönlendirilmiş sadakat duygularına yol açtı, onlar da sığınmaya ve Kraliçe adına savaşmak için [HOL.GetNameDef]'e ulaşmaya başladılar.\n\nEğer savaşı kesin bir sonuca ulaştıramazsak bu hareketi bastırmak çok zor olacak..."
 mtg_netherlands.71.t:0 "Askerler [HOL.GetName]'e Sığınıyor"
 mtg_netherlands.72.a:0 "Babasıyla olan paktımız şimdi ona geçiyor."
 mtg_netherlands.72.d:0 "Dün gece Kaiser II. Wilhelm, hayatının sonuna kadar bizim gözetimimizde kalarak, uykusunda huzur içinde vefat etti. Oğlu Friedrich Wilhelm, şimdi von Hohenzollern Hanedanı'nın başı oldu ve şimdi III. Wilhelm kraliyet adını seçti."
 mtg_netherlands.73.a:0 "Monarşist bir Avrupa'ya doğru büyük bir adım!"
 mtg_netherlands.73.d:0 "İlk Alman toprağının kurtuluşuyla, Kraliçe Wilhelmina ilk sözünü yerine getirdi ve Kaiser [HOL_kaiserreich_germany.GetLeader]'in işgal altındaki topraklarda geçici bir hükûmet kurmasına izin verdi. [HOL_kaiserreich_germany.GetLeader] şimdi ülkenin geri kalanını Alman toprağından kurtarma savaşını yönetebilir ve kendi adına savaşmak için giderek daha fazla kişiyi çekebilir."
 mtg_netherlands.73.t:0 "[HOL_kaiserreich_germany.GetLeader], Alman İç Savaşı'na Liderlik Ediyor"
 mtg_netherlands.74.a:0 "Yükümlülüklerimizi yerine getireceğiz."
 mtg_netherlands.74.d:0 "Savaşın sona ermesiyle, [HOL_kaiserreich_germany.GetLeader], pazarlığımızı hatırlatmanın uygun olduğunu buldu ve bu yeni Monarşik Avrupa'ya kaçınılmaz Batı muhalefeti karşısında iki ulusumuz arasında eşit şartlarda bir ittifak öneriyor."
 mtg_netherlands.74.t:0 "[HOL_kaiserreich_germany.GetLeader] İttifak Öneriyor"
 mtg_netherlands.75.a:0 "Aşağılık - onunla daha sonra ilgileneceğiz."
 mtg_netherlands.75.d:0 "Bize karşı mutlak bir aşağılama olarak tanımlanabilecek bir şekilde, [HOL.GetAdjective] Kraliçesi Wilhelmina, mevcut savaşın sona ermesinden sonra II. Wilhelm'i Almanya tahtına geri getirme kararını açıkladı. Eski Kaiserleri için savaşmak isteyen tüm Almanları, [GER.GetAdjective] pozisyonunu zayıflatma ve kendi pozisyonunu güçlendirme girişimiyle açıkça [HOL.GetAdjective] kontrolündeki topraklara gelmeye davet etti."
 mtg_netherlands.75.t:0 "Wilhelmina, II. Wilhelm ile Pazarlık Yapıyor"
 mtg_netherlands.76.a:0 "Kaçınılmazdı. Hizmetleri paha biçilmezdi."
 mtg_netherlands.76.d:0 "Savaşın sona ermesiyle, bizim adımıza savaşan Alman askerleri şimdi anavatanlarına geri döndüler ve doğrudan Kaiserleri için savaşmaya hazırlanıyorlar."
 mtg_netherlands.76.t:0 "Majestelerinin Alman Lejyonları Dağılıyor"
 mtg_netherlands.77.a:0 "Harika bir fikir - onsuz hiç şansımız yok."
 mtg_netherlands.77.b:0 "Egemenliğimiz her şeyden önemlidir - işbirliğimizde çok ileri gideceğiz, ama o kadar da değil."
 mtg_netherlands.77.d:0 "[From.GetAdjective] hükûmeti, Aşağı Ülkeleri tek bir devlette birleştirme teklifiyle bize başvurdu. Mevcut küresel krizlerin, halklarımız arasında ancak tam bir birleşme yoluyla elde edilebilecek daha yakın bir işbirliği ve birlik gerektirdiğini savunuyorlar. Eğer kabul edersek, [From.GetAdjective] liderliği altında yeni bir uluslarüstü devlete egemenliğin derhal teslimi için hazırlıklar yapılacaktır."
 mtg_netherlands.77.t:0 "[From.GetNameDef] Federasyon Öneriyor"
 mtg_netherlands.78.d:0 "[From.GetAdjective] hükûmeti, Aşağı Ülkeler'de birleşik bir devlet için teklifimizi onayladıklarını bize bildirdi. Eğer tüm taraflar kabul ederse, planlarımızın uygulanmasına devam edebiliriz."
 mtg_netherlands.78.t:0 "[From.GetNameDef] Federasyonu Kabul Ediyor"
 mtg_netherlands.79.d:0 "[From.GetAdjective] temsilcileri, şu anda Aşağı Ülkeler'de birleşik bir devlete ihtiyaç görmediklerini bize bildirdi. Bizimle işbirliklerine devam etmeyi dört gözle bekliyorlar, ancak tam egemenliği korurken."
 mtg_netherlands.79.t:0 "[From.GetNameDef] Federasyonu Reddediyor"
 mtg_netherlands.8.a:0 "İyi haber!"
 mtg_netherlands.8.d:0 "[From.GetNameDefCap], Scharnhorst sınıfı zırhlı kruvazör için planlarını bizimle paylaşmaya karar verdi."
 mtg_netherlands.8.t:0 "[From.GetNameDefCap] Zırhlı Kruvazör Planlarını Paylaşıyor"
 mtg_netherlands.9.a:0 "Bu çok talihsiz..."
 mtg_netherlands.9.d:0 "[From.GetNameDefCap], Scharnhorst sınıfı zırhlı kruvazör için planlarını bizimle paylaşmamaya karar verdi."
 mtg_netherlands.9.t:0 "[From.GetNameDefCap] Zırhlı Kruvazör Planlarını Paylaşmayı Reddediyor"
 mtg_news.1.a:0 "Tarih tekerrürden ibarettir."
 mtg_news.1.b:0 "Amerikan deneyi gözlerimizin önünde çöküyor."
 mtg_news.1.c:0 "Her ilerleme adımı kanla satın alınmalıdır."
 mtg_news.1.d:0 "Güç dengesi aşırılık yanlılarına doğru kayıyor."
 mtg_news.1.desc:0 "Amerika Birleşik Devletleri'ndeki gerilimler kaynama noktasına geldi. Başkan [USA.GetLeader]'in politikalarından memnun olmayan birkaç ABD eyaletinin yasama meclisi Birlikten ayrılma yönünde oy kullandı.\n\nÇatışmanın barışçıl bir şekilde çözülmesine yönelik her türlü umut suya düştü ve cephe boyunca düşmanlıklar patlak verdi. Hükûmetin çoğunluğunun meşru hükûmetle kalmaya karar verdiği görülüyor, ancak raporlar ayrılan eyaletler genelinde bir gönüllü akını gösteriyor.\n\nHiçbir tarafın geri adım atmaya istekli olmamasıyla, gözlemciler uzun ve çetin bir mücadele bekliyor."
 mtg_news.1.t:0 "İkinci Amerikan İç Savaşı"
 mtg_news.10.a:0 "O zaman onları da ablukaya almak zorunda kalacağız."
 mtg_news.10.b:0 "Artık bizim nüfuz alanımızdalar."
 mtg_news.10.c:0 "Başka çaremiz yoktu..."
 mtg_news.10.d:0 "[GER.GetAdjective] nüfuzu artıyor..."
 mtg_news.10.desc:0 "[HOL.GetAdjective]'in ticaret tarafsızlığını sürdürme girişimleri başarısız oldu ve [HOL.GetAdjective] hükûmeti tarafından uygulanan son önlemler, [GER.GetName]-yanlısı bir ticaret politikasına girişeceklerini açıkça gösteriyor. Bu, muhtemelen [HOL.GetNameDef] üzerinde büyük ölçüde artan [GER.GetAdjective] nüfuzu ile sonuçlanacaktır."
 mtg_news.10.t:0 "[HOL.GetName], Almanlara Boyun Eğiyor"
 mtg_news.11.a:0 "Ablukaya katılıyorlar..."
 mtg_news.11.d:0 "Almanlar giderek daha fazla izole oluyor..."
 mtg_news.11.desc:0 "[HOL.GetAdjective]'in ticaret tarafsızlığını sürdürme girişimleri başarısız oldu ve [HOL.GetAdjective] hükûmeti tarafından uygulanan son önlemler, [ENG.GetName]-yanlısı bir ticaret politikasına girişeceklerini açıkça gösteriyor. Bu, muhtemelen [HOL.GetNameDef] üzerinde büyük ölçüde artan [ENG.GetAdjective] nüfuzu ile sonuçlanacaktır."
 mtg_news.11.t:0 "[HOL.GetName], Britanyalılara Boyun Eğiyor"
 mtg_news.12.a:0 "Kişisel kazanç için bu kadar doğal bir arzuya sahip bir halk, istila edilip köleleştirilmeyi hak ediyor!"
 mtg_news.12.b:0 "Çok akılsızca bir karar."
 mtg_news.12.c:0 "Kendi kaderimizin efendisiyiz."
 mtg_news.12.d:0 "Ateşle oynuyorlar..."
 mtg_news.12.desc:0 "\n[HOL.GetAdjective]'in ticaret tarafsızlığını sürdürme girişimleri başarılı oldu ve hem İngilizlerin hem de Almanların can sıkıntısına rağmen, Hollandalılar [ENG.GetAdjective] ve [GER.GetAdjective] baskısı karşısında kararlılıklarında sadece güçlenmiş görünüyorlar."
 mtg_news.12.t:0 "[HOL.GetName], Ticaret Tarafsızlığını Sürdürüyor"
 mtg_news.13.a:0 "İmparatorluğun kaderi pamuk ipliğine bağlı."
 mtg_news.13.b:0 "Tartışacak çok şeyimiz var."
 mtg_news.13.c:0 "Gelişmeleri yakından takip edeceğiz."
 mtg_news.13.desc:0 "[From.GetAdjective] hükûmeti on ikinci İmparatorluk Konferansını duyurdu. Önümüzdeki iki ay boyunca, [From.GetAdjective] hükûmeti ve Dominyonlardan temsilciler, tüm İmparatorluğu ilgilendiren konuları görüşmek üzere Londra'da toplanacak.\n\nBunun küresel meseleler için ne anlama geleceği henüz belirsiz, ancak tartışmaların muhtemelen dünyanın süper güçleri için önemli sonuçları olacak olan İmparatorluk Federasyonu konusunu da içermesi mümkündür."
 mtg_news.14.a:0 "Yapılması gereken doğru şey bu."
 mtg_news.14.b:0 "Bağımsızlığımız bekliyor."
 mtg_news.14.c:0 "Çıldırmışlar."
 mtg_news.14.d:0 "Umarım bu saçmalık bizim mülklerimizi etkilemez!"
 mtg_news.14.desc:0 "[From.GetLeader] bugün yaptığı konuşmada ülkenin sömürge politikasında bir değişiklik olduğunu duyurdu. \"Tüm halkların kendi kaderini tayin etme haklarını tanıyan [From.GetAdjective] hükümeti, tüm İmparatorluk tebaasını bağımsızlık yoluna koymaya karar vermiştir ve bunun sonucunun öngörülebilir gelecekte gerçekleşmesi amaçlanmaktadır.\"\n\nBunun [From.GetNameDef]'nin dünyadaki konumunu büyük ölçüde zayıflatacağı yönündeki endişelere yanıt olarak, [From.GetLeader], \"bunu yapmak isteyen tüm ulusların, yeni kurulan uluslar topluluğunun bir üyesi olarak, ancak daha sonra tamamen eşit ve bağımsız partiler olarak kalmalarının memnuniyetle karşılanacağını\" belirtti. Herhangi bir ülkenin teklifi kabul edip etmeyeceğini zaman gösterecek."
 mtg_news.14.t:0 "[From.GetName] Sömürge Politikasını Yeniden Gözden Geçiriyor"
 mtg_news.15.a:0 "Gelecek kaçınılmazdı, bu yüzden onu şimdi yaptık."
 mtg_news.15.b:0 "Bir devrin sonu."
 mtg_news.15.desc:0 "Bugün gece yarısı, Britanya İmparatorluğu'nun çeşitli tebaa ulusları için uzun zamandır beklenen tam egemenlik devri gerçekleştirildi. [From.GetAdjective] hükûmetinin eski tebaaları [From.GetFactionName]'e katılmaya davet etmesine rağmen, birçoğu kendi yollarına gitmeyi seçti.\n\nBu hamle yurt içinde tartışmalı olmaya devam ediyor, ancak uluslararası sosyalistler tarafından büyük alkış alıyor. Bunun [From.GetNameDef]'in dünyadaki konumu için ne kadar zayıflığa neden olduğu ve kendi yollarına gitmeyi seçen o ulusların durumu henüz belli değil."
 mtg_news.15.t:0 "Britanya İmparatorluğu'nun Sömürgesizleştirilmesi"
 mtg_news.16.a:0 "Yatıştırma zamanı bitti. Şimdi çizgiyi çektik."
 mtg_news.16.b:0 "İngilizler eldiveni fırlattı."
 mtg_news.16.desc:0 "Yeni [From.GetAdjective] Başbakan [From.GetLeader], bugün yaptığı basın açıklamasında, yeni hükümetin seleflerinin sadık bir şekilde sürdürdüğü Yatıştırma rotasından uzaklaşma niyetini duyurdu. [From.GetLeader], belirsiz bir ifadeyle, [From.GetNameDef]'nin amacının \"çirkin kafasını nereye çevirirse göstersin tiranlığın ilerleyişini durdurmak\" olduğunu açıkça ortaya koydu.\n\nSavaş tehdidinin belirli ulusların yayılmacılığını durdurmaya hizmet edip etmeyeceği henüz bilinmiyor, ancak işe alım programları zaten yolda. [From.GetNameDef], beyanlarına güven veriyor."
 mtg_news.16.t:0 "[From.GetName] Yatıştırma Politikasını Reddetti"
 mtg_news.17.a:0 "Ama gireceğiz."
 mtg_news.17.b:0 "Ültimatomlarını her an beklemeliyiz..."
 mtg_news.17.c:0 "İngilizler deniz üstünlüklerini çok ciddiye alırlar..."
 mtg_news.17.desc:0 "[From.GetAdjective] hükûmeti bugün, 1922 tarihli Washington Denizcilik Antlaşması'nın ihlallerine karşı sert önlemler alacağını duyurdu. Orada belirtilen 5:5:3:1.75:1.75 ana gemi oranını ihlal eden herhangi bir imzacı ulus, muhtemelen sayılarını antlaşmada kendilerine tahsis edilen kotalara düşürmelerini talep eden acil [From.GetAdjective] ültimatomları alacaktır.\n\nŞimdiye kadar, küresel tepki, İngilizlerin bu konuda savaşa gireceğine dair bir inançsızlık olmuştur."
 mtg_news.17.t:0 "[From.GetName] Denizcilik Antlaşmalarını Uyguluyor"
 mtg_news.18.a:0 "Daha fazla güçlenmelerini bekleyemeyiz."
 mtg_news.18.b:0 "Bize geliyorlar."
 mtg_news.18.c:0 "Çizgi aşıldı."
 mtg_news.18.desc:0 "\n[From.GetAdjective] hükümeti bugün, gerekirse askeri güç kullanarak \"Avrupa'daki güç dengesini yeniden kurma\" niyetini açıkladı. Başbakan [From.GetLeader].\n\nKıta Avrupası emperyalizmi \"İngiliz ulusal güvenliğine yönelik bir tehdittir ve bu nedenle kontrol altına alınmalıdır\" diyor. Bunun tam olarak ne anlama geldiği henüz belli değil, ancak ulus harekete geçti ve savaşa hazır görünüyor."
 mtg_news.18.t:0 "[From.GetName] Kıtaya Müdahaleyi Düşünüyor"
 mtg_news.19.a:0 "Tanrı Kralı korusun!"
 mtg_news.19.b:0 "Geçmişe bir adım."
 mtg_news.19.desc:0 "Kral [From.GetLeader] ile Wallis Simpson arasındaki kraliyet evliliğinin ardından Kral, yeni kurulan monarşist yanlısı \"Kral Partisi\"nin liderlerini, Winston Churchill, Oswald Mosley ve David Lloyd George'u, ülkede uzun süren hükümetsiz dönemin ardından yeni bir hükümet kurmaları için atadı.\n\nDestekleyenler [From.GetLeader] sadık bir hükümetin oluşumunu alkışlıyor, ancak eleştirmenler yeni hükümetin Kral'ın isteklerini o kadar desteklediğine, dolayısıyla Kral'ı fiilen mutlakiyetçi bir hükümdar olarak görebileceğimize dikkat çekiyor."
 mtg_news.19.t:0 "[From.GetLeader] Kral'ın Partisini Güçlendiriyor"
 mtg_news.2.a:0 "İç düşmanlar hala düşmandır."
 mtg_news.2.b:0 "Amerika'nın ruhu için verilen mücadele açığa çıktı."
 mtg_news.2.c:0 "Faşistleri çok uzun süre görmezden geldiğinizde olan budur."
 mtg_news.2.d:0 "Amerikan cumhuriyeti hayatı için savaşıyor!"
 mtg_news.2.desc:0 "Başkan [USA.GetLeader]'nin destekçileri ile sözde \"Anayasacı\" kamptaki muhalifleri arasında aylarca süren protestolar ve artan gerginliklerden sonra, Anayasacı politikacılar, ilk Amerikan devriminin evi olan Boston'da yeni bir hükümet ilan ettiler. Toplumdaki bölünmeler doğrudan ailelerden ve kurumlardan geçiyor. Amerika Birleşik Devletleri kıtasındaki eyalet hükümetleri bir tarafa veya diğerine bağlılıklarını ilan ederken, ordunun küçük bir çoğunluğu Anayasacıların yanında yer almaya karar vermiş gibi görünüyor."
 mtg_news.20.a:0 "Almanlar bize büyük bir hizmette bulundu."
 mtg_news.20.b:0 "Bu yol bize daha iyi umutlar sunuyor."
 mtg_news.20.c:0 "Bunun sorumlusu İngilizlerin şeytani entrikalarıdır!"
 mtg_news.20.d:0 "İngilizler bir şeyler planlıyor..."
 mtg_news.20.desc:0 "[ITA.GetNameDef] ile [GER.GetNameDef] arasındaki diplomatik ilişkiler son zamanlarda daha da kötüleşti, bir dizi küçük diplomatik olayın [GER.GetAdjective] hükûmeti tarafından düşmanca bir söylemi körüklemek için kullanılmasıyla. İtalyan-Alman ilişkileri son yıllarda iyileşmeye başlamış olsa da, bu yeni gelişmeler iki Avrupa gücü arasında gelecekteki herhangi bir işbirliğini etkili bir şekilde engelliyor gibi görünüyor.\n\nEleştirmenler, Anglo-Alman ilişkilerindeki eşzamanlı iyileşmelere ve bu [ITA.GetAdjective] diplomatik izolasyonun İngilizlere sağladığı 'kolaylığa' dikkat çekiyor, bu da iki ulus arasında perde arkası anlaşmaların olabileceğini gösterebilir."
 mtg_news.20.t:0 "[ITA.GetAdjective] Diplomatik İzolasyonu"
 mtg_news.21.a:0 "Artık kimse önümüzde duramaz."
 mtg_news.21.b:0 "Denizler güvence altına alındı."
 mtg_news.21.c:0 "Dikkatli olmalıyız..."
 mtg_news.21.desc:0 "[ENG.GetAdjective] ve [GER.GetAdjective] hükümetleri, karşılıklı askeri yardım anlaşması yapmanın yanı sıra \"diğerinin çıkar alanına saygı gösterme\" niyetlerini de açıkladılar. [GER.GetNameDef]'nin son aylarda giderek artan [ENG.GetAdjective] yanlısı söyleminden sonra bu gelişmeyi görmek herkesi şaşırtmayabilir, ancak anlaşmanın terminolojisi pek çok uzmanı şaşırttı ve hatta bazılarının bunun Avrupa için ne anlama gelebileceği konusunda uyarılarda bulunmasına yol açtı."
 mtg_news.21.t:0 "Anglo-Alman İttifakı"
 mtg_news.22.a:0 "Anakara güvence altına alındı."
 mtg_news.22.b:0 "Kanatlarımız güvence altında."
 mtg_news.22.c:0 "Dünyayı paylaşıyorlar..."
 mtg_news.22.desc:0 "[ENG.GetAdjective] ve [GER.GetAdjective] hükümetleri bir saldırmazlık ve müdahale etmeme paktı ilan etti. Diğer hükümler arasında \"diğerinin çıkar alanına saygı gösterme\" niyetini belirten bir madde yer alıyor. [GER.GetNameDef]'nin son aylarda giderek artan [ENG.GetAdjective] yanlısı söyleminden sonra bu gelişmeyi görmek herkesi şaşırtmayabilir, ancak eleştirmenler hâlâ bunun Avrupa için ne anlama gelebileceği konusunda uyarıyor."
 mtg_news.22.t:0 "Anglo-Alman Paktı"
 mtg_news.23.a:0 "Bu potadan her zamankinden daha güçlü çıkacağız."
 mtg_news.23.b:0 "Bakalım iç savaştan kaçınmayı başarabilecekler mi."
 mtg_news.23.desc:0 "Oswald Mosley'nin liderliğindeki Britanya Faşistler Birliği, [From.GetNameDef] genelinde destekçi sayısını artırmak amacıyla ülke çapında örgütlü yürüyüşlere başladı.\n\nAncak halkın faşizm karşıtı kesimlerinin sert tepkisi şimdiden sokak çatışmalarına yol açtı. İstikrarın korunup korunamayacağı, hatta siyasi huzursuzluğun daha da büyüyüp büyümeyeceği belirsiz. Birliğin liderleri ise \"Downing Sokağı'na yürüyüp hükûmet değişikliği talep edene kadar\" durmayacaklarını ilan etti."
 mtg_news.23.t:0 "Kara Gömlekliler [From.GetName]'de Örgütleniyor"
 mtg_news.24.a:0 "Fransızlar zaten işe yaramazdı."
 mtg_news.24.b:0 "Biz gerçek faşistler birlikte durmalıyız."
 mtg_news.24.c:0 "Rosbiflere asla güvenme!"
 mtg_news.24.d:0 "Protesto ediyoruz!"
 mtg_news.24.desc:0 "Benzeri görülmemiş bir hamleyle, yeni [Root.GetAdjective] hükûmeti [FRA.GetNameDef]'deki Büyük Savaş müttefiklerinden uzaklaştı ve şimdi bunun yerine İtalyanlarla bir ittifak ilan etti. Bu sert bağlılık değişikliği, Avrupa diplomatik sahnesinde şok dalgalarına neden oldu ve özellikle [FRA.GetNameDef] ve [GER.GetNameDef]'de şüpheyle karşılanıyor; ikincisi zaten [From.GetLeader]'den tekrar tekrar düşmanca söylemlerin hedefi olmuştu."
 mtg_news.24.e:0 "Bu, önemli bir Britanya diplomatik manevrası..."
 mtg_news.24.t:0 "Anglo-İtalyan İttifakı"
 mtg_news.25.a:0 "Gerekli bir takastı."
 mtg_news.25.b:0 "Ödül buna değerdi."
 mtg_news.25.c:0 "İlginç bir gelişme..."
 mtg_news.25.desc:0 "[Root.GetAdjective] ve İspanyol hükûmetleri bugün, Cebelitarık'ın Milliyetçi İspanya'ya iadesini duyuran ortak bir bildiri yayınladı ve aynı zamanda iki güç arasında yeni bir askeri işbirliği antlaşmasını pekiştirdi."
 mtg_news.25.t:0 "Cebelitarık Milliyetçi İspanya'ya Geri Verildi"
 mtg_news.26.a:0 "İstedikleri kadar bizi suçlayabilirler."
 mtg_news.26.b:0 "Lanet Britanya müdahalesi!"
 mtg_news.26.c:0 "Hepimiz için geliyorlar."
 mtg_news.26.d:0 "Sinsi taktikler..."
 mtg_news.26.desc:0 "\n[From.GetName]'deki İmparatorluk yanlısı unsurlar, hükûmete karşı açık bir isyanla ayaklandı ve ulusun derhal Britanya İmparatorluğu'nun bir Dominyonu olarak geri dönmesini talep etti. Durum şimdi tam teşekküllü bir iç savaşa tırmandı ve [From.GetAdjective] hükûmeti, [ENG.GetNameDef]'i isyancılara ihtiyaç duydukları modern silahları ve mühimmatı sağlamakla suçladı, ki [ENG.GetAdjective] hükûmeti bunu kategorik olarak reddetti."
 mtg_news.26.t:0 "[From.GetName]'de Emperyalist İç Savaş"
 mtg_news.27.a:0 "Onları yeniden aramıza kabul etmeliyiz."
 mtg_news.27.b:0 "Buna nasıl cüret ederler?!"
 mtg_news.27.c:0 "İngilizlere karşı birlikte durmalıyız."
 mtg_news.27.d:0 "Kurnazca taktikler."
 mtg_news.27.desc:0 "\n[ENG.GetAdjective] hükûmeti bugün, [From.GetNameDef]'deki yeni filizlenen İmparatorluk Sadıkları hükûmetini koruması altına alacağını duyurdu. [From.GetNameDefCap] şu anda iç savaşın pençesinde ve bu, [ENG.GetNameDef]'in bundan böyle ülkenin iç siyasi sarsıntılarında daha aktif bir rol alacağını gösteriyor gibi görünüyor."
 mtg_news.27.t:0 "[ENG.GetName], [From.GetAdjective] İmparatorluk Sadıklarıyla Müttefik Oluyor"
 mtg_news.28.a:0 "Doğru kararı verdiler."
 mtg_news.28.b:0 "Başka seçeneğimiz yoktu..."
 mtg_news.28.c:0 "Zorlandık."
 mtg_news.28.d:0 "İngilizler onlara zorbalık etti..."
 mtg_news.28.desc:0 "[ENG.GetAdjective] birliklerinin topraklarından serbest geçişini ve iç işleri üzerinde geniş kapsamlı kontrol talep eden bir [ENG.GetAdjective] ültimatomuna yanıt olarak, [From.GetAdjective] hükûmeti şimdi boyun eğeceğini duyurdu. [ENG.GetAdjective] yetkilileri, ulusun iç işlerinin denetimini kurmak için zaten sahada."
 mtg_news.28.t:0 "[From.GetName], [ENG.GetName]'e Boyun Eğiyor"
 mtg_news.29.a:0 "Ve korkmalılar da."
 mtg_news.29.b:0 "Bırakın gelsinler."
 mtg_news.29.c:0 "Bize başka bir alternatif bırakmadılar."
 mtg_news.29.d:0 "İngilizler savaş yolunda."
 mtg_news.29.desc:0 "[From.GetAdjective] hükûmeti, [ENG.GetAdjective] askeri birliklerinin topraklarından serbest geçişini ve iç işleri üzerinde geniş kapsamlı kontrol talep eden bir [ENG.GetAdjective] ültimatomunu reddetti. [From.GetLeader], hükûmetin [ENG.GetAdjective] misillemesini tamamen beklediğini belirtti ve şimdi ordusunu yüksek alarma geçirdi."
 mtg_news.29.t:0 "[From.GetName], [ENG.GetAdjective] Ültimatomunu Reddediyor"
 mtg_news.3.a:0 "Çocuklarımız yabancı savaşlara gönderilmeyecek."
 mtg_news.3.b:0 "Bırakın dev uyusun."
 mtg_news.3.c:0 "O zaman eylemsizlikle faşistleri destekliyorlar."
 mtg_news.3.d:0 "Belçikalılara Tarafsızlığın onları 1914'te ne kadar iyi savunduğunu sorun."
 mtg_news.3.desc:0 "Dünya genelinde gerilimler artarken, ABD Kongresi [USA.GetNameDef]'in dünya sahnesinde oynaması gereken rol hakkında yoğun tartışmalara sahne oldu. Birçok üye, Başkan [USA.GetLeader]'in gizlice bir Avrupa veya Asya savaşına müdahale etmeyi planlamasından endişe duyuyor. Bazıları hala ülkenin Büyük Savaş'ta oynadığı rolü hatırlıyor ve [USA.GetNameDef]'i yabancı anlaşmazlıklardan uzak tutmaya hevesli.\n\nÖnerdiği ekonomik reform programları için destek toplamak isteyen Başkan [USA.GetLeader], savaşta olan uluslarla ticarete ağır kısıtlamalar getiren ve Başkan'ın diğer uluslara herhangi bir destek sunmasını özellikle yasaklayan Tarafsızlık Yasası'nı imzalayarak yasalaştırdı."
 mtg_news.3.e:0 "Tarafsız kalmanın önemini biliyorlar."
 mtg_news.3.f:0 "Tarafsızlık güçle desteklenmelidir."
 mtg_news.3.g:0 "Yine de bize destekleri sarsılmaz!"
 mtg_news.3.g_tt:0 "Bize olan garantileri bundan §Retkilenmez§!."
 mtg_news.3.t:0 "ABD Kongresi Tarafsızlık Yasasını Geçiriyor"
 mtg_news.30.a:0 "Garip fikirlere kapılmasalar iyi olur..."
 mtg_news.30.b:0 "Bize geliyorlar."
 mtg_news.30.c:0 "Sert önlemler..."
 mtg_news.30.desc:0 "[From.GetAdjective] hükûmetinin son eylemleri, Dominyonların özerkliğine giderek daha fazla baskı uyguladıklarını açıkça ortaya koydu. Denizaşırı ülkelere asker gönderilmeye hazırlanılırken, yeni hükûmetten ayrılma fikrini caydırmak için askeri birliklerin konuşlandırılmasının bile kullanılması bekleniyor."
 mtg_news.30.t:0 "[From.GetName] Dominyonları Güvence Altına Almak İçin Harekete Geçiyor"
 mtg_news.31.a:0 "Gerekli bir hamle."
 mtg_news.31.b:0 "Buna nasıl cüret ederler?!"
 mtg_news.31.c:0 "Haklarımız var!"
 mtg_news.31.d:0 "İngilizler Dominyonlarına sert davranıyor."
 mtg_news.31.desc:0 "\nBugün erken saatlerde, [ENG.GetAdjective] askeri birimleri [From.GetNameDef] genelinde konuşlandırıldı ve [ENG.GetAdjective] hükûmeti Dominyonunda sıkıyönetim ilan etti. Yerel hükûmet askıya alındı ve günlük işler, en azından şimdilik, doğrudan Londra'dan yürütülüyor.\n\nBu yeni durumun ne kadar süreceği henüz belirsiz, ancak eleştirmenler şimdiden [ENG.GetAdjective] pozisyonunu uzun vadede 'savunulamaz' olarak nitelendirdi."
 mtg_news.31.t:0 "[ENG.GetName], [From.GetName]'de Sıkıyönetim Uyguluyor"
 mtg_news.32.a:0 "İş tamamdır."
 mtg_news.32.b:0 "Hile! HİLE-- Ehem. Demokratik ve özgür seçimlerden ne kadar da harika bir sonuç."
 mtg_news.32.c:0 "Üzerimize yüklenen tiranlığı gören tek biz miyiz?!"
 mtg_news.32.d:0 "Bunlar iç meselelerdir."
 mtg_news.32.desc:0 "\nBenzeri görülmemiş bir hamleyle [ENG.GetNameDef], [From.GetNameDef]'de yeni seçimler düzenledi ve bu seçimler sadık pro-[ENG.GetAdjective] partiler için ezici bir zaferle sonuçlandı.\n\nEleştirmenler sonuçları sorguluyor ve yaygın seçim hilesi olabileceğini öne sürüyor. Bu iddialar [ENG.GetAdjective] hükûmeti tarafından kategorik olarak reddedilirken, yeni [From.GetAdjective] hükûmeti zaten iktidarda ve kesinlikle İngiliz yanlısı bir politika izliyor."
 mtg_news.32.t:0 "[ENG.GetName], Sadık [From.GetAdjective] Hükûmeti Kuruyor"
 mtg_news.33.a:0 "Yapmamız gerekeni yaparız."
 mtg_news.33.b:0 "Endişe verici gelişmeler..."
 mtg_news.33.c:0 "[From.GetAdjective] işçisi için harika bir haber!"
 mtg_news.33.desc:0 "Görünüşte yeniden silahlanma programları için daha fazla halk desteği toplama çabasıyla, [From.GetAdjective] hükûmeti şimdi Sendikalarla görüşmelere girdi ve destekleri karşılığında tavizler vermeyi teklif etti. Bunun hükûmet üzerindeki sosyalist nüfuzu büyük ölçüde artırması bekleniyor."
 mtg_news.33.t:0 "[From.GetName] Sendikalara Boyun Eğiyor"
 mtg_news.34.a:0 "İyi kurtulduk."
 mtg_news.34.b:0 "Sosyalist tiranlık herkesin görebileceği şekilde ortaya serildi."
 mtg_news.34.c:0 "Sınıf mücadelesi için bir zafer!"
 mtg_news.34.desc:0 "'Merhametli' bir karar olarak adlandırdığı bir kararla, tüm [ENG.GetAdjective] Kraliyet Ailesi ülkeden sürgün edildi. Hükûmet sözcüleri veya Kraliyet Ailesi temsilcileri tarafından daha fazla yorum yapılmadı. Bugün erken saatlerde, [From.GetNameDef]'e geldiler ve orada sığınma talebinde bulundular, bu da kabul edildi."
 mtg_news.34.t:0 "[ENG.GetName] Kraliyet Ailesini Sürgün Ediyor"
 mtg_news.35.a:0 "Yapılması gerekiyordu."
 mtg_news.35.b:0 "Sosyalistlerin insan hayatına saygısı yok!"
 mtg_news.35.c:0 "Hak ettiklerini buldular."
 mtg_news.35.desc:0 "[From.GetAdjective] Kraliyet Ailesi'nin herhangi bir üyesinin son kez kamuoyu önüne çıkmasının üzerinden bir hafta daha geçerken, onların olası kaderleri hakkında söylentiler dolaşıyor. Hükümet konu hakkında yorum yapmayı tamamen reddetti ve konuya dikkat çekecek her türlü medya haberine sıkı sıkıya bağlı kalmaya başladı.\n\nHükümetin sessizliği, Kraliyet Ailesi'nin hane halkı üyesi olduklarını iddia eden bazı kişilerin birkaç hafta önce \"Kraliyet Ailesi'nin maskeli adamlar tarafından Buckingham Sarayı'ndan zorla çıkarıldığını görmekten\" bahsettikleri anonim hesapları ışığında daha da belirginleşiyor."
 mtg_news.35.t:0 "[ENG.GetAdjective] Kraliyet Ailesinin Kayboluşu"
 mtg_news.36.a:0 "Akranlarımıza kollarımızı açtık."
 mtg_news.36.b:0 "Onlar gerçek sosyalizme ihanet eden hainlerdir!"
 mtg_news.36.c:0 "Kızıllar arasında bir bölünme daha oluşuyor."
 mtg_news.36.desc:0 "[From.GetNameDefCap], Komintern'e yeni bir 'komünist alternatif' duyurdu; burada [From.GetLeader] \"Moskova'dan bağımsızlık isteyen tüm sosyalist devletler dünya çapında İşçi haklarını savunmak için bize katılabilir\". Bu yeni sosyalist grubun Moskova'ya karşı sağlam durup duramayacağı henüz bilinmiyor."
 mtg_news.36.t:0 "Britanya Komünist Alternatifi"
 mtg_news.37.a:0 "Ve yapacağız da."
 mtg_news.37.b:0 "Bir karar vermemiz gerekiyor..."
 mtg_news.37.c:0 "İngilizler küresel kaslarını esnetiyor."
 mtg_news.37.desc:0 "[From.GetAdjective] hükûmeti, diğer sömürgeci güçlere bir ültimatom yayınlayarak, sömürgelerinden derhal çekilmelerini ve tam bağımsızlık vermelerini talep etti, tıpkı İngilizlerin kendilerinin zaten yaptığı gibi. Gerekirse bu talepleri askeri güç kullanarak destekleme istekliliklerini belirttiler."
 mtg_news.37.t:0 "[From.GetName] Sömürgesizleştirme Talep Ediyor"
 mtg_news.38.a:0 "Biz gerçek sosyalistleriz!"
 mtg_news.38.b:0 "Bırakın denesinler, hainler!"
 mtg_news.38.c:0 "Kızıllar iç çekişmeye başvurdu..."
 mtg_news.38.desc:0 "[From.GetNameDefCap], [SOV.GetNameDef]'i \"Marx'ın değer verdiği değerlere ihanet etmekle\" suçladı ve şimdi \"sosyalizmi hainlerinden temizlemeye\" kararlı olduğunu duyurdu. Sosyalizmin liderliğine yönelik basit bir meydan okuma gibi görünen şeyin, tam kapsamlı bir savaşa dönüşeceği kesin olduğundan, ulus ordusunu en yüksek alarma geçirdi."
 mtg_news.38.t:0 "[From.GetName], [SOV.GetAdjective] Sosyalizmine Meydan Okuyor"
 mtg_news.39.a:0 "Gerçekten de öyleyiz."
 mtg_news.39.b:0 "Onlardan korkmuyoruz."
 mtg_news.39.c:0 "Savaş yaklaşıyor."
 mtg_news.39.desc:0 "[From.GetAdjective] hükûmetinden son zamanlardaki söylemler giderek daha düşmanca ve anti-faşist oldu. Çeşitli anti-faşist yasaların geçirilmesiyle birlikte, bunun ulusun çok da uzak olmayan bir gelecekte ideolojik hasımlarıyla askeri bir çatışmaya hazırlandığının bir işareti olduğuna inanılıyor."
 mtg_news.39.t:0 "[From.GetName] Faşizme Meydan Okuyor"
 mtg_news.4.a:0 "Onlarla orada savaşacağız ki burada savaşmak zorunda kalmayalım."
 mtg_news.4.b:0 "Başkalarının işine karışmamalılar."
 mtg_news.4.c:0 "Şüphesiz Askeri-Endüstriyel Kompleks tarafından kışkırtıldı."
 mtg_news.4.d:0 "Dev bu sefer uyumayacak."
 mtg_news.4.desc:0 "\nKongre, Başkan [USA.GetLeader]'i dünya çapında [USA.GetAdjective] çıkarlarını korumak için gerekirse askeri güç kullanmaya teşvik eden ortak bir kararı kabul ettiğinde [USA.GetNameDef]'deki barış hareketi ciddi bir gerileme yaşadı.\n\nGörünüşe göre Kongre'deki birçok kişi, Büyük Savaş'ın bu kadar uzun sürmesine ve bu kadar çok can almasına izin verenin [USA.GetAdjective] kararsızlığı olduğuna karar verdi. ABD birliklerinin Avrupa'ya girmesinden birkaç ay sonra Büyük Savaş'ın sona erdiğine dikkat çekiyorlar. Daha erken bir müdahalenin, yüz binlerce hayat kurtarabileceğini savunuyorlar."
 mtg_news.4.t:0 "[USA.GetNameDefCap] müdahaleci politikalar izliyor"
 mtg_news.40.a:0 "Onlar için geliyoruz."
 mtg_news.40.b:0 "Bırakın denesinler."
 mtg_news.40.c:0 "Bu cesur bir girişim olurdu."
 mtg_news.40.desc:0 "[From.GetAdjective] hükûmetinden son zamanlardaki söylemler giderek daha düşmanca ve anti-kapitalist oldu. Çeşitli anti-Amerikan yasalarının geçirilmesiyle birlikte, bunun ulusun çok da uzak olmayan bir gelecekte Yeni Dünya'daki ideolojik hasımlarıyla askeri bir çatışmaya hazırlandığının bir işareti olduğuna inanılıyor."
 mtg_news.40.t:0 "[From.GetName] Kapitalizme Meydan Okuyor"
 mtg_news.41.a:0 "Kazanacağız."
 mtg_news.41.b:0 "İngilizler kendilerini yok ediyor..."
 mtg_news.41.desc:0 "[From.GetNameDef]'deki sürekli Kara Gömlekliler yürüyüşlerinin körüklediği artan gerilimler şimdi kaynama noktasına ulaştı. Bu yürüyüşlerden kaynaklanan son sokak kavgaları dizisi kontrolden çıktı ve şimdi ordunun müdahil olduğu noktaya kadar tırmandı.\n\nKraliyet Donanması resmi [From.GetAdjective] hükûmetine sadık kalsa da, ordudaki durum oldukça farklı, çeşitli birimler ya sadıklara ya da faşistlere destek sözü veriyor. Geçici bir faşist hükûmetin kurulmasıyla, Britanya Adaları'nda uzun süreli bir çatışma için sahne hazır."
 mtg_news.41.t:0 "[From.GetName]'de İç Savaş"
 mtg_news.42.a:0 "Sonunda zafer!"
 mtg_news.42.b:0 "Kendilerini önemli ölçüde zayıflattılar..."
 mtg_news.42.desc:0 "[From.GetAdjective] demokratik hükûmetinin düşüşüyle, Britanya Adaları'nda durum istikrara kavuştu. Hükûmet, faşist ilerleme karşısında Dominyonlara kaçmayı reddettiği için, Kraliyet Donanması şimdi tek kalan hükûmete desteğini taahhüt etti. Bu sadakatin olduğu gibi kabul edilip edilmeyeceği veya sadakatsiz unsurların şimdi saflarından temizlenip temizlenmeyeceği belirsiz."
 mtg_news.42.t:0 "[From.GetName]'de İç Savaş Sona Erdi"
 mtg_news.43.a:0 "Ulusumuza birliği geri getireceğiz!"
 mtg_news.43.b:0 "Yalanları ortaya çıkarıldı!"
 mtg_news.43.c:0 "Kızıllar birbirine düştü..."
 mtg_news.43.desc:0 "[From.GetAdjective] sosyalist parti içindeki unsurlar, hükümetin sömürgecilikten kurtulmayı açıkça reddetmesiyle ilgili endişelerini defalarca dile getirdi. Artık hükümetin bu konudaki eylemsizliğinden bıkanlar, hükümeti \"Sosyalizmin değerlerine ihanetle\" suçlamaya başladılar ve onları devirmek için silaha sarıldılar. Darbe girişimi artık hızla tırmanıyor ve ülke inkar edilemez bir şekilde topyekun bir iç savaşın pençesinde."
 mtg_news.43.t:0 "[From.GetName]'de Komünist İç Savaşı"
 mtg_news.44.a:0 "Bağımsızlığımızı kazanacağız ya da denerken öleceğiz!"
 mtg_news.44.b:0 "Bu alt kıtanın ikiye bölündüğünü görmeyeceğiz!"
 mtg_news.44.c:0 "Bu bizim suçumuz mu?"
 mtg_news.44.d:0 "İngilizler bunu gerçekten görmeliydi..."
 mtg_news.44.desc:0 "[RAJ.GetNameDef]'in bağımsızlık elde ettiği kötü organize edilmiş şeklin bir sonucu olarak, alt kıtadaki dini gerilimler o zamandan beri yüzeyin altında kaynıyordu. Şimdi, bunlar ülkenin Kuzey-Batı ve Kuzey-Doğu'sundaki büyük şehirlerde şiddetli çatışmalarla ani ve keskin bir şekilde doruğa ulaştı.\n\nYerel yetkililer durumu daha fazla tırmanmaktan alıkoymada başarısız oldu ve şimdi milisler ve hatta askeri birimler Müslüman Birliği'nin arkasında birleşti, Pakistan için bağımsızlık ilan etti ve onu güvence altına alana kadar Hintlilerle savaşma niyetlerini duyurdu."
 mtg_news.44.t:0 "Hindistan İç Savaşı"
 mtg_news.45.a:0 "Küçük küstahlar!"
 mtg_news.45.b:0 "Bizi daha fazla aşağıda tutamayacaklar!"
 mtg_news.45.d:0 "Bunların hepsi çok kolay önlenebilirdi..."
 mtg_news.45.desc:0 "[From.GetNameDefCap]'nin şiddetli doğuşu, silahlı milislerin özellikle uzak bölgelerde büyük güç taşımasıyla, acemi ülkede istikrarsızlığa neden olmaya devam etti. Kuzey-Batı ve Kuzey-Doğu Hindistan'daki çeşitli Müslüman nüfuslar arasındaki kültürel farklılıklar da, Batı Pakistanlıların Doğulu meslektaşlarına yönelik aşağılayıcı tutumlarının, iç savaştan bu yana hâlâ tam olarak soğumamış olan kafaları alevlendirmesiyle birlikte, giderek daha açık hale geldi.\n\nŞimdi Doğu, \"artık yeter\" iddiasıyla yeniden silaha sarıldı ve onlar da artık tam bağımsızlık istiyor."
 mtg_news.45.t:0 "Pakistan İç Savaşı"
 mtg_news.46.a:0 "Savaşmaya devam edeceğiz!"
 mtg_news.46.b:0 "Meydan okuyorlar."
 mtg_news.46.desc:0 "Kıtasal Avrupa topraklarının kaybıyla, [From.GetAdjective] hükûmeti şimdi Endonezya'nın Cava adasındaki Batavia şehrine taşınmaya karar verdi. Oradaki sömürge hükûmeti yerinden edilecek ve bunun yerine [From.GetAdjective] hükûmeti doğrudan onu yönetecek.\n\nBu sömürge üssünden, saldırganlarına karşı savaşı sürdürmeye yemin ettiler."
 mtg_news.46.t:0 "[From.GetName] Hükûmeti Batavia'ya Taşıyor"
 mtg_news.47.a:0 "Modern bir Dünya Harikası olacak."
 mtg_news.47.b:0 "Cesur bir kumar."
 mtg_news.47.desc:0 "[From.GetNameDef]'de büyük ölçekli bir arazi ıslah projesi üstlenildi ve toplu olarak \"Zuiderzee İşleri\" olarak bilinen bir dizi projeye devam edildi. IJsselmeer'in Afsluitdijk ile kapatılması, Wieringermeer ve Noordoostpolder'ın ıslahı sonrasında proje artık denizden henüz geri kazanılmamış en büyük alan olan Flevopolder'in ıslahına odaklanıyor.\n\nProjenin tamamı şüphesiz uzun yıllara yayılacak olsa da, drenaj işlemi daha küçük alanların artık ıslah edilmesine yetecek kadar ilerlemiştir. zaten erişilebilir durumda ve [From.GetAdjective] endüstrisine sağladığı faydalar ortada."
 mtg_news.47.t:0 "[From.GetName] Zuiderzee Çalışmalarına Devam Ediyor"
 mtg_news.48.a:0 "Gerekli bir kötülüktü."
 mtg_news.48.b:0 "Çok hoş bir sürpriz."
 mtg_news.48.c:0 "Endişe verici."
 mtg_news.48.desc:0 "[From.GetAdjective] ve [JAP.GetAdjective] hükûmetleri, Hollanda Doğu Hint Adaları'nın tam transferini [JAP.GetAdjective] kontrolüne duyuran ortak bir bildiri yayınladı. Uzak Doğu'daki bu köklü toprak düzenlemesi, Amerikalılar ve İngilizler gibi çeşitli üçüncü tarafların protestolarına rağmen derhal yürürlüğe girecektir."
 mtg_news.48.t:0 "[JAP.GetName] Doğu Hint Adaları'nı Alıyor"
 mtg_news.49.a:0 "Kabul edilebilir bir uzlaşma."
 mtg_news.49.b:0 "Zaten sadece kaynaklarla ilgileniyoruz."
 mtg_news.49.c:0 "Onlar birbirleriyle işbirliği içindeler."
 mtg_news.49.desc:0 "[From.GetAdjective] ve [JAP.GetAdjective] hükûmetleri, iki ulusları arasında özel bir ticaret anlaşması duyuran ortak bir bildiri yayınladı. Bundan böyle, Japonlara Endonezya takımadalarında sömürülen tüm kaynaklara özel haklar tanınacak.\n\nBu benzeri görülmemiş ticaret anlaşması, şüphesiz [From.GetAdjective] hükûmetinin Japonlardan herhangi bir tehdidi önleme girişimidir, ancak [USA.GetNameDef] ve [ENG.GetNameDef] gibi diğer ilgili uluslarla büyük bir endişeye neden olmuştur."
 mtg_news.49.t:0 "[JAP.GetName] Doğu Hint Adaları Kaynaklarını Alıyor"
 mtg_news.5.a:0 "Sözlerimiz artık daha ağır basacak."
 mtg_news.5.b:0 "Nüfuz alanlarında kaldıkları sürece."
 mtg_news.5.c:0 "Sonunda faşistler gerçek yüzlerini gösteriyor."
 mtg_news.5.d:0 "Yeni bir çağın şafağında duruyoruz."
 mtg_news.5.desc:0 "Senato salonunda ayakta alkışlanarak yapılan bir oylamanın ardından, Başkan [USA.GetLeader] Savaş Yetkileri Yasası'nı derhal imzalayarak yasalaştırdı. Yasa, Başkanlık makamına ordunun kullanımında daha önce mümkün olandan çok daha fazla takdir yetkisi veriyor. Başkan artık, gerekli gördüğü her zaman ve her yerde, sınırsız bir süre için [USA.GetAdjective] çıkarlarını savunmak üzere asker konuşlandırabilir.\n\nBaşkan [USA.GetLeader] bu yeni yetkilerin sadece en vahim durumlarda kullanılacağını iddia etse de, Dışişleri Bakanlığı içindeki kaynaklar bunun küresel güç dengesini yeniden şekillendirme programının sadece ilk adımı olduğunu iddia ediyor."
 mtg_news.5.t:0 "[USA.GetNameDefCap] Savaş Yetkileri Yasasını Geçiriyor"
 mtg_news.50.a:0 "Artık anakaraya odaklanabiliriz."
 mtg_news.50.b:0 "Gerçekten özgürlüğü savunuyorlar."
 mtg_news.50.desc:0 "Yeni [From.GetAdjective] hükûmeti, hala [From.GetAdjective] sömürge imparatorluğuna ait olan çeşitli bölgelere bağımsızlık verme kampanya vaatlerini hızla yerine getirdi.\n\nDerhal yürürlüğe girmek üzere, bu devletler şimdi tam bağımsızlık alacak ve Kraliyet Hollanda Doğu Hint Adaları Ordusu (KNIL), bunun yerine [From.GetAdjective] kıtasal Avrupa ordusunu güçlendirmek için geri dönecektir."
 mtg_news.50.t:0 "[From.GetName] Sömürgesizleşiyor"
 mtg_news.51.a:0 "Yapacağız."
 mtg_news.51.b:0 "Bazı mükemmel [From.GetAdjective] diplomatik manevraları."
 mtg_news.51.desc:0 "Lüksemburg ve Belçika devletlerinin mevcut zayıflığı nedeniyle, [ENG.GetNameDef], [From.GetAdjective]'nin alçak ülkelerdeki Napolyon sonrası \"tampon devleti\" yeniden kurma çağrılarına artık boyun eğmiş durumda. İngilizler kurtarılmış toprakları doğrudan [From.GetNameDef]'ye vermeyi kabul etti. Hollandalıların bu kez iç istikrarı koruma konusunda daha iyi şansa sahip olup olmayacaklarını zaman gösterecek."
 mtg_news.51.t:0 "Benelüks Tampon Devleti'nin Oluşturulması"
 mtg_news.52.a:0 "Batı güvende."
 mtg_news.52.b:0 "[From.GetAdjective] herkesten daha iyidir."
 mtg_news.52.c:0 "\"İlgi alanlarını\" oldukça ciddiye alıyorlar."
 mtg_news.52.desc:0 "[From.GetAdjective] hükûmetinin talebi üzerine, [USA.GetNameDef], Hollanda Batı Hint Adaları'nı kendi ilgi alanlarının ayrılmaz bir parçası olarak gördüklerini belirten bir bildiri yayınladı. Toprağı, haklı sahiplerine saldırabilecek herkese karşı korumaya yemin ettiler."
 mtg_news.52.t:0 "[USA.GetName], [From.GetAdjective] Batı Hint Adaları'nı Koruyor"
 mtg_news.53.a:0 "Büyük Güçlerin çekişmesinden bıkan herkesi hoş karşılıyoruz."
 mtg_news.53.b:0 "Cesur bir girişim."
 mtg_news.53.desc:0 "[From.GetAdjective] hükümetinin liderliğinde çeşitli Aşağı Ülkelerden oluşan yeni bir ittifak kuruldu. Liderleri, bu acemi ittifakın \"büyüyen dünya krizi karşısında tarafsız kalacağını\" ve \"şu anda dünyayı pençesine alan çılgınlık karşısında tarafsızlık ve rasyonellik blokunun\" gücünü artırmak için diğer ulusların eninde sonunda ona katılabileceğini umduklarını dile getirdi."
 mtg_news.53.t:0 "Benelüks Kuruluyor"
 mtg_news.54.a:0 "Her zamankinden daha güçlüyüz."
 mtg_news.54.b:0 "Birlik büyüyor."
 mtg_news.54.desc:0 "Benelüks'ün kuruluşundan bu yana, Aşağı Ülkelerin hükümetleri \"güçlü ve tarafsız bir akıl sağlığı bloğuna\" daha fazla ilgi çekmek için çabaladılar. Artık çok sayıda yeni ülke ittifaka katılmaya davet edildi ve bu yeni üye ülke akınına uyum sağlamak için ittifakın adının \"Avrupa Birliği\" olarak yeniden değiştirilmesine karar verildi."
 mtg_news.54.t:0 "Avrupa Birliği Kuruluyor"
 mtg_news.55.a:0 "İsteksiz olsa da, ülkesine iyi hizmet edecektir."
 mtg_news.55.b:0 "Nihai bedeli ödediler."
 mtg_news.55.desc:0 "Londra'nın son bombalanmaları şimdi Kral Edward ve eşi Wallis'in ölümüyle sonuçlandı. Saat 3 civarında, sürpriz bir bombalama baskını çifti sarayın mahzenine sığınmaya zorladı. Bir bomba yukarıdaki binaya isabet etti ve mahzenin tavanını Kral ve maiyetinin üzerine yıktı.\n\nUlus hükümdarının kaybına yas tutarken, Kral'ın kardeşi Albert, şimdi onun yerine geçmeye hazırlanıyor ve VI. George kraliyet adını alıyor."
 mtg_news.55.t:0 "Kral Edward Öldürüldü"
 mtg_news.56.a:0 "Kralsız bir ulus nedir ki? Ya da Kraliçesiz, o da var."
 mtg_news.56.b:0 "\"Boston Çay Partisinin İntikamı\" cidden mi?"
 mtg_news.56.c:0 "Kral'ın aşkı sınır tanımıyor."
 mtg_news.56.desc:0 "Amerikan anakarasını son fetihlerinin ardından, [From.GetLeader] şimdi Amerika Birleşik Devletleri Başkanlığı makamını kaldıran ve yerine [From.GetNameDef]'inkine benzer bir monarşik hükûmet yapısı getiren bir Kraliyet Kararnamesi yayınladı. Bu tahta oturtmak için Kral Edward, eşi Kraliçe Wallis'ten başkasını seçmedi, o da bundan böyle Wallis I kraliyet adıyla bilinecek ve kocasının adına Amerika Birleşik Krallığı'nı yönetecek.\n\nAmerikan halkının bu yeni yönetim biçimine nasıl uyum sağlayacağı henüz belli değil."
 mtg_news.56.t:0 "[From.GetName] Amerikan Monarşisi Kuruyor"
 mtg_news.57.a:0 "Bu, İmparatorluğu yönetmede büyük fayda sağlayacaktır."
 mtg_news.57.b:0 "Büyük bir sorumluluk."
 mtg_news.57.c:0 "Güçlerini pekiştiriyorlar."
 mtg_news.57.desc:0 "Amerikan anakarasını son fetihlerinin ardından, [From.GetLeader] şimdi eski Amerika Birleşik Devletleri'ni Kanada Dominyonuna dahil eden ve adını Kuzey Amerika Dominyonu olarak değiştiren bir Kraliyet Kararnamesi yayınladı."
 mtg_news.57.t:0 "Kuzey Amerika Dominyonu'nun Kurulması"
 mtg_news.58.a:0 "Tam zafere giden yolda bir adım."
 mtg_news.58.b:0 "Buna nasıl cüret ederler?!"
 mtg_news.58.c:0 "Bu hafif bir tabir... Hollandalılar hak ettiklerini alacaklar."
 mtg_news.58.d:0 "Diplomatik bir başyapıt mı, yoksa saf delilik mi?"
 mtg_news.58.desc:0 "[HOL.GetAdjective] Kraliçesi Wilhelmina'nın von Hohenzollern hanedanının Alman tahtına geri dönmesini sağlama sözü ve ilk Alman toprağının kurtuluşuyla, Kaiser şimdi anavatanının kontrolü için etkili bir şekilde tam teşekküllü bir iç savaşa dönüşen şeyi yönetmek üzere Alman toprağına geri döndü.\n\nBu arada, Alman sığınmacılar Kraliçe ve Kaiserleri adına savaşmak için [HOL.GetAdjective] kontrolündeki topraklara akın etmeye devam ediyor ve güç dengesini yavaş ama giderek değiştiriyorlar. Büyük Savaş İtilaf Güçleri'nden resmi açıklamalar henüz gelmedi, ancak raporlar hükûmetleri arasında büyük bir onaylamama olduğunu gösteriyor."
 mtg_news.59.a:0 "Genç yaşı gücünü gizliyor."
 mtg_news.59.desc:0 "[ENG.GetAdjective] hükûmeti bugün Kral VI. George'un ölümünü doğruladı. Bir süredir, muhtemelen savaşın streslerinden kaynaklanan Kral'ın ağır sigara alışkanlıkları, sağlığının bozulmasına ve sonunda akciğer kanseri, arterioskleroz ve Buerger hastalığının gelişmesine yol açtı.\n\nSon zamanlarda babasının kraliyet görevlerinin çoğunu zaten üstlenmiş olan Kral'ın kızı Elizabeth'in taç giyme töreni için hazırlıklar şimdiden başladı."
 mtg_news.59.t:0 "Kral VI. George Öldü"
 mtg_news.6.a:0 "Sonunda bitti."
 mtg_news.6.b:0 "Bolşevizm boyunduruğundan kurtarılacak bir başka yer."
 mtg_news.6.c:0 "Devrim kaçınılmaz zaferine doğru yürüyor!"
 mtg_news.6.d:0 "Sadece doğru tarafın kazandığını umabiliriz."
 mtg_news.6.desc:0 "\nAylar süren kan dökülmesi ve anlatılmamış binlerce kayıptan sonra, İkinci Amerikan İç Savaşı sona erdi. Güney eyaletlerinin ayrılma girişimi başarısız oldu. Birçok gözlemci, birinci Amerikan İç Savaşı ile olan paralelliklere dikkat çekiyor. Bir kez daha, kuzey eyaletlerinin endüstriyel gücü, güneyin kararlılığına üstün geldi. \n\n[USA.GetLeader] hükûmeti şimdi, ayrılan eyaletleri [USA.GetNameDef]'e yeniden entegre etmenin zorlu göreviyle karşı karşıya. Sadece yaklaşık 80 yıl arayla iki isyanla, hükûmetteki birçok kişi isyancılara birinci savaştan sonra olduğundan çok daha sert cezalar için bastırıyor."
 mtg_news.6.t:0 "İkinci Amerikan İç Savaşı'nda İşçiler Galip Geliyor!"
 mtg_news.62.b:0 "İmparatorluk krizde."
 mtg_news.62.desc:0 "Dominyon hükûmetlerinin temsilcileri bugün, Taç ile bağlarını tek taraflı olarak koparacaklarını duyurdular. Kral'ın Dominyon hükûmetlerinin ve halklarının görüşlerine ve isteklerine bariz bir şekilde saygısızlık göstermesini, Britanya-Commonwealth ilişkisinin artık devam edememesinin birincil nedeni olarak gösteriyorlar. Kral'ın Wallis Simpson ile evlenme niyetinin yol açtığı bu kriz, şimdi çeşitli Dominyonlarla yeni bir Milletler Topluluğu'nun kurulmasıyla sonuçlandı ve Britanya hükûmetinin mevcut felcinin bu hamleye yanıt olarak herhangi bir eylemde bulunulmasını engelleyeceği görülüyor. Bu şüphesiz Dominyonların umduğu şeydi."
 mtg_news.63.desc:0 "[Root.GetAdjective] hükûmeti bugün, [ENG.GetAdjective] hükûmetiyle bağlarını tek taraflı olarak koparacaklarını duyurdu. Siyasi görüşlerini [ENG.GetName]'de meydana gelen mevcut siyasi gelişmelerle uzlaştıramamalarını bunun birincil nedeni olarak gösteriyorlar."
 mtg_news.63.t:0 "[Root.GetName] Bağımsızlık İlan Ediyor"
 mtg_news.64.a:0 "Tüm halklarımız anavatanımızı savunmak için birleşti."
 mtg_news.64.b:0 "Yine mi birleştiniz? Karar verin artık!"
 mtg_news.64.desc:0 "Ulusal güvenliklerine yönelik ciddi dış tehditleri gerekçe gösteren Aşağı Ülkelerin hükûmetleri, halklarının konumunu güçlendirmek için hükûmetlerinin ve silahlı kuvvetlerinin derhal birleştirildiğini duyurdu. [From.GetOldAdjective] liderliği altında, askeri hazırlığın yeni devletin egemenliğini tehdit edebilecek herhangi bir eyleme tepki vermek için yeterli olmasını sağlamak amacıyla, endüstriyel yatırımlar ve savunmacı askeri planlama şimdi diğer iç meselelerin önüne geçecektir."
 mtg_news.64.t:0 "Aşağı Ülkeler Birleşiyor"
 mtg_news.7.b:0 "Adalet yerini buldu!"
 mtg_news.7.c:0 "Amerikan işçileri, zamanla, yeniden özgürce nefes alacak."
 mtg_news.7.d:0 "Demokrasinin geleceği sadece daha belirsiz hale geliyor."
 mtg_news.7.desc:0 "\nAylar süren kan dökülmesi ve anlatılmamış binlerce kayıptan sonra, İkinci Amerikan İç Savaşı sona erdi. Başkan [USA.GetLeader], büyük muharebe operasyonlarının bittiğini ilan etti. Asi hükûmetin bazı kalıntıları hala etkisiz bir direniş kampanyası sürdürse de, çoğu ya hükûmetin temizlik operasyonlarında toplandı ya da sivil nüfusun arasına karıştı. \n\nBaşkan [USA.GetLeader]'e göre, savaş açıkça ülkeyi istikrarsızlaştırmak ve bölmek isteyen yabancı nüfuzların işiydi. Zamanla, söz veriyor, sorumlular toparlanan Amerikan ulusuna olan borçlarını kanla ödeyecekler."
 mtg_news.7.t:0 "[USA.GetNameDefCap] Hüküm Sürüyor!"
 mtg_news.8.a:0 "Halklarımız için ileriye doğru büyük bir adım."
 mtg_news.8.b:0 "Yeni bir süper güç yükseliyor..."
 mtg_news.8.desc:0 "Küresel tehditler karşısında, Britanya hükûmeti [CAN.GetNameDef], [SAF.GetNameDef], [AST.GetNameDef] ve [NZL.GetNameDef] hükûmetleriyle ortak bir bildiri yayınlayarak Britanya Milletler Topluluğu'nun yeni bir federal hükûmet yapısıyla resmileştirileceğini duyurdu.\n\nDaha önceki [RAJ.GetAdjective] hükûmetinin bu teklifi reddetmesi ve Commonwealth için federal yapının mevcut uygulanmasıyla, [RAJ.GetNameDef], yeni Süper Devlet ile bağlantılı kalmamayı seçti.\n\nBuna rağmen, bu hamlenin şüphesiz küresel sahne için benzeri görülmemiş sonuçları olacaktır."
 mtg_news.8.t:0 "[Root.GetNameDef]'in Yükselişi"
 mtg_news.9.desc:0 "Küresel tehditler karşısında, Britanya hükûmeti [CAN.GetNameDef], [SAF.GetNameDef], [RAJ.GetNameDef], [AST.GetNameDef] ve [NZL.GetNameDef] hükûmetleriyle birlikte ortak bir bildiri yayınlayarak Britanya Milletler Topluluğu'nun yeni bir federal hükûmet yapısıyla resmileştirileceğini duyurdu.\n\nBritanya İmparatorluğu'nun bu ölçekte bir birleşmesinin şüphesiz küresel sahne için benzeri görülmemiş sonuçları olacağı açıktır."
 mtg_usa_canadian_corridor.1.a:0 "Alacaklar."
 mtg_usa_canadian_corridor.1.b:0 "Asla!"
 mtg_usa_canadian_corridor.1.desc:0 "Bugün [USA.GetNameDef]'deki büyükelçimiz Dışişleri Bakanlığı'na çağrıldı ve bir ültimatom sunuldu. Kendisine verilen nota göre, [USA.GetNameDef] hükûmeti artık Washington ile Alaska arasındaki bölgeler üzerindeki Kanada egemenliğini kabul edemez. \n\nBirliklerin geçişine ve belirli sınır kontrollerinden muafiyete izin veren bir antlaşma müzakere etme önerileri kesin bir dille reddedildi. [USA.GetAdjective] hükûmeti gece yarısına kadar bir cevap bekliyor."
 mtg_usa_canadian_corridor.1.t:0 "Kanada Koridoru"
 mtg_usa_canadian_corridor.2.a:0 "Akıllıca seçim yaptılar."
 mtg_usa_canadian_corridor.2.desc:0 "[CAN.GetLeader] hükûmeti taleplerimizi kabul etti ve tartışmalı topraklardan çekildi. Kuvvetlerimiz, şehirlerin ötesinde var olan medeniyetin karakolları üzerinde kontrol kurmak için ilerledi."
 mtg_usa_canadian_corridor.2.t:0 "[CAN.GetNameDefCap] kabul ediyor"
 mtg_usa_canadian_corridor.3.a:0 "Biz barış teklif ettik, onlar savaşı seçti."
 mtg_usa_canadian_corridor.3.b:0 "Bir avuç kaya ve ağaç için bir savaşı göze alamayız."
 mtg_usa_canadian_corridor.3.desc:0 "Teklifimizi \"'Vancouver ya da Savaş!' teklif etmekten başka bir şey değil\" olarak nitelendiren ve korkaklar gibi pes etmemizi bekleyen [CAN.GetLeader], daha fazla diplomasi girişimini açıkça kınadı. [CAN.GetAdjective] güçlerinin yüksek alarm durumunda olduğu ve sınır boyunca savunma pozisyonlarını işgal ettiği bildiriliyor."
 mtg_usa_canadian_corridor.3.t:0 "[CAN.GetNameDefCap] Reddediyor"
 mtg_usa_civil_war_democrats.1.a:0 "Bırakın protesto etsinler, yönetecek bir ülkemiz var."
 mtg_usa_civil_war_democrats.1.desc:0 "Başka bir kitlesel protesto dalgası başkenti vurdu; gösteriler Kongre Binası içindeki ve çevresindeki tüm ana yolları tıkadı. \"Cumhuriyeti Koruma Eylem Komitesi\" tarafından düzenlenen protestocular, Başkan [USA.GetLeader]'nin yönetimindeki yolsuzluk ve görevi kötüye kullanma iddialarına ilişkin bağımsız bir soruşturma talep etti. Özellikle, Başkan'ın Gümüş Lejyon'u kınamasını ve seçmen olarak haklarına saygı duyulacağına dair kamuoyuna güvence vermesini talep ettiler.\n\nBaşkan [USA.GetLeader], konu hakkında yorum yapmayı reddetti."
 mtg_usa_civil_war_democrats.1.t:0 "Başkentte Protestolar"
 mtg_usa_civil_war_democrats.10.desc:0 "[GETUSASTATE]'in uzak bir bölümündeki bir ABD cephaneliği dün gece bilinmeyen güçler tarafından bir saldırıya uğradı. Küçük silahlı adamlar grubu, az sayıdaki muhafızı bir kulübeye zorlayıp kilitledi. Askerler şafaktan sonra kaçmayı başardıklarında, cephaneliğin tamamen yağmalandığını buldular. Görünüşe göre gece boyunca, saldırganlar büyük miktarda malzemeyi bilinmeyen bir yere taşıdılar."
 mtg_usa_civil_war_democrats.11.a:0 "Bunda yanlış bir şey yok."
 mtg_usa_civil_war_democrats.11.desc:0 "Başkan [USA.GetLeader]'nin politikalarına karşı yapılan son yürüyüş ve gösteriler sırasında, çok sayıda protestocu açıkça silah taşıyordu ve kendilerini büyüyen \"Yurttaş Milisleri\" hareketinin bir parçası olarak tanımlayan kolluklar takıyordu. Protestocular, polis tarafından kendilerine meydan okunduğunda, yalnızca 2. Değişiklik kapsamındaki haklarını kullandıklarını iddia ettiler, ancak FBI, bu grupların yalnızca özel silah mülkiyetini teşvik etmediğine dair işaretler buldu.\n\nİstihbaratçılar, bu silahlı grupların düzenli toplantılar yaptığını ve piyade eğitim kılavuzlarına erişmeye çalıştıklarını bildirdi."
 mtg_usa_civil_war_democrats.11.t:0 "Vatandaş Milisleri kuruluyor"
 mtg_usa_civil_war_democrats.14.a:0 "Bu komünist hainlerden başka ne beklenir ki?"
 mtg_usa_civil_war_democrats.14.desc:0 "ABD genelinde kitlesel grevler bildirildi, çok çeşitli sendikalar eylem çağrısında bulundu. Sadece en hayati hizmetler muaftır. Birçok yerde grevciler ve grev kırıcılar arasında kavgalar çıktı. \n\nAlışılmadık bir şekilde, işçiler daha yüksek ücretler veya başka tavizler değil, Başkan [USA.GetLeader]'in istifasından daha azını talep etmiyorlar."
 mtg_usa_civil_war_democrats.14.t:0 "İşçiler grevde"
 mtg_usa_civil_war_democrats.15.a:0 "Çok hoş karşılanırlar."
 mtg_usa_civil_war_democrats.15.desc:0 "Ülke genelinde artan istikrarsızlıkla birlikte, birçok girişimci sessizce dükkan kurmak için daha güvenli yerler aramaya başladı. Özellikle, ABD'nin güney eyaletleri, bazı şirketlerin tüm fabrikaları ülkenin yarısına taşımasıyla endüstriyel çıktıda bir canlanma yaşadı."
 mtg_usa_civil_war_democrats.15.t:0 "Sanayiciler Silah Fabrikalarını taşıyor"
 mtg_usa_civil_war_democrats.16.a:0 "Bu, Başkan'ın politikalarının işe yaradığını kanıtlıyor!"
 mtg_usa_civil_war_democrats.16.desc:0 "Kırsal alanlardan kuzeydoğudaki sanayi merkezlerine doğru onlarca yıldır süren göçün ardından, son hükümet raporları çarpıcı bir tersine dönüş olduğunu gösteriyor. Sivil sektördeki giderek daha fazla şirket güney eyaletlerine taşınıyor ve önceden az gelişmiş bölgelere yerleşerek yüzlerce yeni işi de beraberinde getiriyor. Pek çok fabrika sahibi, bunun nedenlerinden biri olarak kuzeydeki düzenli grevler ve giderek saldırganlaşan sendikalarla harap olmuş \"düşmanca\" iklimi gösteriyor."
 mtg_usa_civil_war_democrats.16.t:0 "Ekonomik göç"
 mtg_usa_civil_war_democrats.2.a:0 "Peki bu talebi nasıl uygulamayı öneriyorlar?"
 mtg_usa_civil_war_democrats.2.desc:0 "Ülke genelinde, Başkan [USA.GetLeader]'in politikalarına karşı yapılan düzenli protestolar sadece boyut olarak büyüdü ve şimdi düzenli olarak birkaç milyon protestocuyu aşıyor. Bugün, Washington sokaklarında bir milyondan fazla kişi yürüdü ve en az dokuz başka yerde de benzer sayılar bildirildi. Bu, eyalet başkentlerindeki ve daha küçük şehirlerdeki daha küçük yürüyüşleri bile hesaba katmıyor, ki bunlar hala her biri binlerce insanı çekti ve bazıları yüz binleri aştı. Protestolar, organizatörlerin cumhuriyetin demokratik dokusunu baltaladığını iddia ettiği bir dizi popüler olmayan politika kararının ardından geliyor.\n\nDaha önce protestocular Başkan'dan daha radikal ideolojilerden uzaklaşmasını talep ederken, şimdi derhal görevden alınmasını talep ediyorlar."
 mtg_usa_civil_war_democrats.2.t:0 "On Milyonluk Yürüyüş"
 mtg_usa_civil_war_democrats.20.a:0 "Kimse onları ciddiye almayacak. Bu fırtına diner."
 mtg_usa_civil_war_democrats.20.desc:0 "Cumhurbaşkanına yönelik protestolar nihayet doruğa ulaştı. Dün yürüyüş Boston'un merkezine ulaştıktan sonra protestocular evlerine dönmek için dağılmadı. Bunun yerine daha küçük gruplara ayrılarak şehrin çevresindeki hayati yerleri ele geçirdiler. Akşam karanlığında şehrin tam kontrolüne sahip oldular. Polis büyük ölçüde protestocuların safına geçti ve Massachusetts valisi Ulusal Muhafızları göndermeyi reddetti.\n\nA \"Boston Vatandaş Komitesi\" şehrin kontrolünü ele geçirdi ve bildirildiğine göre isyancılarla işbirliği yapıyor. New England'daki diğer eyaletler, kendilerini artık Başkan [USA.GetLeader] tarafından imzalanan herhangi bir yasaya bağlı görmediklerini belirten destek önergelerini kabul ettiler. Bunun yerine, Amerika Birleşik Devletleri'ndeki diğer tüm eyalet hükümetlerini, Başkanın görevden alındığını, Kongre'nin feshedildiğini ve yeni seçimler yapılması gerektiğini ilan etmeye çağırıyorlar.\n\nOrdunun bir kısmı bizim tarafımızda kalırken, tüm oluşumlar subaylarına isyanı bastırma emirlerine uymayacaklarını bildirdi."
 mtg_usa_civil_war_democrats.20.t:0 "Boston İsyanı"
 mtg_usa_civil_war_democrats.21.a:0 "Hala ülkenin merkezini elimizde tutuyoruz."
 mtg_usa_civil_war_democrats.21.desc:0 "Kaliforniya, Oregon ve Washington eyalet hükûmetlerinin tümü Boston Hükûmeti'ne desteklerini ilan etti ve tüm federal memurlara ya görevlerinden istifa etmelerini ya da bu eyaletlerin topraklarını derhal terk etmelerini emretti. Bu harekete karşı bazı dağınık direniş cepleri raporları olsa da, büyük ölçüde nüfusun desteğini alıyor gibi görünüyor."
 mtg_usa_civil_war_democrats.21.t:0 "İsyan Batı Kıyısına yayılıyor"
 mtg_usa_civil_war_democrats.22.a:0 "Olması gerektiği gibi."
 mtg_usa_civil_war_democrats.22.desc:0 "Giderek daha fazla eyaletin meşru hükûmetten gelen talimatları takip etmeyi reddetmesiyle, Ohio, Missouri, Wisconsin, Illinois, Indiana ve Michigan valileri ortaklaşa, nüfusları arasında herhangi bir isyankar davranışa müsamaha göstermeyeceklerini ilan ettiler. Yeni bir iç savaşın, ABD'yi yabancı saldırganlık karşısında tehlikeli bir şekilde zayıflatacağını savunuyorlar."
 mtg_usa_civil_war_democrats.22.t:0 "Orta Batı hükûmeti destekliyor"
 mtg_usa_civil_war_democrats.23.a:0 "Geri döneceğiz."
 mtg_usa_civil_war_democrats.23.desc:0 "New England'dan güneye yürüyen isyancı güçler, Maryland, New York, Pennsylvania ve New Jersey'de geniş ölçüde kurtarıcılar olarak karşılandı ve yerel valiler eyalet polisine ve ulusal muhafızlara müdahale etmemelerini emretti. Başkent çevresinde sadık güçleri toplama girişimleri başarısız oldu. Başkan [USA.GetLeader], isyancı güçler tüm çıkışları kapatmadan sadece saatler önce Washington'dan tahliye edildi. Motorlu kolu Richmond, Virginia'ya ulaştı ve muhtemelen daha güneye devam edecek."
 mtg_usa_civil_war_democrats.23.t:0 "Doğu Kıyısı İsyana katılıyor"
 mtg_usa_civil_war_democrats.25.a:0 "Zaten orası çoğunlukla boş arazi."
 mtg_usa_civil_war_democrats.25.desc:0 "Wyoming, Idaho ve Montana valileri ortaklaşa Boston hükûmeti lehine bildiri yayınladılar. Washington ve Oregon'dan gelen isyancı güçler, eyaletlerdeki silah arkadaşlarıyla çoktan birleşti."
 mtg_usa_civil_war_democrats.25.t:0 "Kuzeybatı Ayrılıyor"
 mtg_usa_civil_war_democrats.26.a:0 "Onlar stratejik topraklardır."
 mtg_usa_civil_war_democrats.26.desc:0 "Wyoming, Idaho ve Montana eyalet yasama meclisleri, yerel kolluk kuvvetlerine federal hükûmete karşı konuşurken bulunan herkesi mevcut acil durum süresince tutuklama ve gözaltına alma konusunda geniş yetkiler veren bir dizi isyan karşıtı yasayı kabul etti. Ancak, yakındaki Washington ve Oregon'daki isyancı güçlerin varlığı, sadık güçlerden hızlı destek gerektirecektir."
 mtg_usa_civil_war_democrats.26.t:0 "Kuzeybatı hükûmeti destekliyor"
 mtg_usa_civil_war_democrats.27.a:0 "Mükemmel, savunulacak daha az işe yaramaz çöl."
 mtg_usa_civil_war_democrats.27.desc:0 "Nevada, Arizona, Utah, New Mexico ve Colorado'nun hepsi İsyan lehine bildiri yayınladı. Kaliforniya'dan gelen isyancı güçlerin geçişine izin verme emirlerini takip etmeyi reddeden eyalet yetkilileri görevden alındı ve birçok durumda hapsedildi."
 mtg_usa_civil_war_democrats.27.t:0 "Güneybatı Ayrılıyor"
 mtg_usa_civil_war_democrats.28.a:0 "Mitingler ve konuşmalar zamanı çoktan geçti."
 mtg_usa_civil_war_democrats.28.desc:0 "Nevada, Arizona, Utah, New Mexico ve Colorado valileri, Boston Hükûmeti lehine yapılan yaygın gösterilerin ardından olağanüstü hal ilan etti. Birkaç durumda, eyalet polisi ve Ulusal Muhafız birimleri, panik içinde kaçan, ölülerini ve yaralılarını yanlarında sürükleyen protestoculara ateş açtı."
 mtg_usa_civil_war_democrats.28.t:0 "Güneybatı hükûmeti destekliyor"
 mtg_usa_civil_war_democrats.29.a:0 "O toprak kolayca geri alınır."
 mtg_usa_civil_war_democrats.29.desc:0 "Dakotalar, Iowa, Minnesota ve Nebraska eyalet hükûmetleri, yerel kolluk kuvvetleri ve sempatik ulusal muhafızlar tarafından desteklenen iyi koordine edilmiş ve uygulanmış bir ayaklanma ile görevden alındı. Aceleyle seçilen Geçici Valiler, Boston Hükûmeti'ne desteklerini ilan ettiler."
 mtg_usa_civil_war_democrats.29.t:0 "Batı Orta Batı Ayrılıyor"
 mtg_usa_civil_war_democrats.30.a:0 "Hepsi birer kahraman."
 mtg_usa_civil_war_democrats.30.desc:0 "Dakotalar, Iowa, Minnesota ve Nebraska eyalet hükûmetleri bugün, solcu unsurlar tarafından, kolluk kuvvetleri ve isyankar Ulusal Muhafızlar tarafından desteklenen, görünüşe göre iyi planlanmış bir darbe girişimini kıl payı yenmeyi başardı. Sadık vatandaşlar eyalet yasama meclislerini korumayı ve birkaç valinin yakalanmasını önlemeyi başardılar, ancak eyalet başkentlerinde şiddetlenen birkaç keskin çatışmada kayıplar verdiler."
 mtg_usa_civil_war_democrats.30.t:0 "Batı Orta Batı hükûmeti destekliyor"
 mtg_usa_civil_war_democrats.31.a:0 "Onlar, başa çıkılması gereken uzun bir hainler listesindeki sonuncular sadece."
 mtg_usa_civil_war_democrats.31.desc:0 "Ohio, Missouri, Wisconsin, Illinois, Indiana ve Michigan valileri, hükümetin destek eksikliğini ve \"Eski Başkan [USA.GetLeader]'nin korkunç liderlik eksikliğini\" gerekçe göstererek Boston Hükümeti'nden yana olduklarını açıkladılar. Bu valilerin tümü daha önce sıkı bir şekilde Başkan'ın kampında değerlendirildiğinden, isyancı kamp içindeki ilişkilerin gergin olması muhtemel."
 mtg_usa_civil_war_democrats.31.t:0 "Orta Batı Ayrılıyor"
 mtg_usa_civil_war_democrats.40.a:0 "Umutsuz zamanlar umutsuz önlemler gerektirir."
 mtg_usa_civil_war_democrats.40.b:0 "Bu cumhuriyetin sonu olurdu."
 mtg_usa_civil_war_democrats.40.desc:0 "Hükûmet tam bir geri çekilme içindeyken ve ülkenin büyük bir kısmı isyanın yanında yer alırken, General MacArthur bize bir teklifle yaklaştı. Sadece kendisinin Amerikan zihniyetini gerçekten anladığını ve bu kriz anında istikrar ve liderlik sağlayabileceğini belirterek, MacArthur, isyan yenilene kadar bir 'Ulusal Savunma Hükûmeti' yönetmeyi teklif etti. MacArthur'a göre, bu General MacArthur'u sorumlu tutarak sivil liderlik ile askeri komutanlar arasındaki sürtünmeyi azaltmak içindir.\n\nHükûmetteki bazıları, kendisinden üçüncü şahıs olarak bahsetmeye devam etmesinden biraz rahatsız."
 mtg_usa_civil_war_democrats.40.t:0 "MacArthur Hükûmeti Yönetmeyi Teklif Ediyor"
 mtg_usa_civil_war_democrats.41.a:0 "Görevini yaptı."
 mtg_usa_civil_war_democrats.41.b:0 "Cumhuriyetin ona hala ihtiyacı var."
 mtg_usa_civil_war_democrats.41.c:0 "Bay Hilt, ülkeyi yeniden inşa etmek için en iyi aday gibi görünüyor."
 mtg_usa_civil_war_democrats.41.d:0 "Charles Lindbergh'den bir hükûmet kurmasını iste."
 mtg_usa_civil_war_democrats.41.desc:0 "Boston isyanı nihayet sona erdiğinde, hükûmetteki birçok kişi nasıl devam edeceğinden emin değil. MacArthur'un Ulusal Savunma Hükûmeti başlangıçta sadece savaşın sonuna kadar sürmesi için tasarlanmıştı. Ancak, [USA.GetNameDef]'in etrafındaki dünya sadece daha düşmanca hale geldi ve yakında kendimizi bir kez daha savaşta bulabiliriz. Faşist lider William Dudley Pelley, MacArthur'a hizmeti için teşekkür ederken, 'yasal ve düzenli bir hükûmete' geri dönülmesi için alenen çağrıda bulundu. Savaş sırasında hareketine verilen destekteki artışa işaret eden Pelley, açıkça kendisini Başkan ve Amerika'nın Lideri pozisyonu için önceden belirlenmiş olarak görüyor.[USA.GetCandidatesFascism2][USA.GetCandidatesFascism]\n\nAlışılmadık bir alçakgönüllülük gösterisiyle, [USA.GetLeader], kamuoyu talep ederse istifa etmeyi teklif etti. Amerikan halkı, yönetimin geri kalanının konuyu nasıl değerlendirdiğini görmek için bize bakıyor."
 mtg_usa_civil_war_democrats.41.t:0 "William Dudley Pelley, [USA.GetLeader]'e Meydan Okuyor"
 mtg_usa_civil_war_fascists.1.a:0 "Durumu tırmandırmaktan kaçınmalıyız."
 mtg_usa_civil_war_fascists.1.b:0 "Kalabalığa boyun eğmemeliyiz."
 mtg_usa_civil_war_fascists.1.desc:0 "Silver Legion of America'nın önderlik ettiği ve organize ettiği bir dizi merkezci ve sağcı örgüt, bugün Washington'un şimdiye kadar gördüğü en büyük gösterilerden birinde başkentte yürüdü. Ülke çapında başka toplantıların da yapıldığı bildirildi.\n\nYürüyüş Kongre Binası önünde sona erdi ve burada kalabalık \"Kongredeki komünistlerin\" ABD'ye ihanetten \"Halkın Büyük Jürisi\" önünde yargılanmak üzere kendilerine teslim edilmesini talep etti.\n\nÖzel olarak, Yönetim, protestocuların hukukun üstünlüğü ve anayasal kontrol ve dengelere bağlılık konusundaki daha meşru kaygılarından bazılarını paylaşıyor. Ancak diğerleri onlara karşı sert bir çizgi izlenmesini öneriyor. Önümüzdeki haftalarda daha fazla gösteri planlandığı için hızlı bir şekilde seçim yapmalıyız."
 mtg_usa_civil_war_fascists.1.t:0 "Gümüş Lejyon protestoları"
 mtg_usa_civil_war_fascists.10.a:0 "Derinden rahatsız edici bir haber."
 mtg_usa_civil_war_fascists.10.desc:0 "[GetCSAState]'deki bir ABD Ordusu cephaneliği dün saldırıya uğradı ve kısa süreliğine ele geçirildi. Küçük muhafız müfrezesi, depolama odalarının anahtarlarını talep eden büyük bir silahlı kalabalıkla karşılaştı. Yakındaki bir garnizondan takviye geldiğinde, saldırganlar çok sayıda hafif silahı yanlarına alarak çoktan geri çekilmişlerdi.\n\nMuhafızların tamamen zarar görmemiş olması ve takviyelerin şüpheli bir şekilde uzun sürede gelmesi göz önüne alındığında, hükûmetteki bazıları bunun koordineli bir saldırı olduğunu düşünüyor."
 mtg_usa_civil_war_fascists.10.t:0 "Cephanelik Basıldı"
 mtg_usa_civil_war_fascists.11.a:0 "Açgözlü."
 mtg_usa_civil_war_fascists.11.desc:0 "[GetCSAState] hükûmeti, eyaletteki tüm vergi toplama ve değerlendirme operasyonlarını durdurmak için eyalet polisini gönderdi. Ayrıca, vali tütün ve alkol üzerindeki her türlü vergi ve harcı geçersiz ilan etti ve işletmelere Hazine'ye herhangi bir gümrük veya harç ödememelerini emretti. \n\n Ancak, işletmelerin ve özel şahısların, Hazine'ye borçlu olunan vergiler de dahil olmak üzere, eyalet vergi makamlarına vergi beyanında bulunmaya devam etmelerini de emretti."
 mtg_usa_civil_war_fascists.11.t:0 "Eyalet Vergi Toplamasına Müdahale Ediyor"
 mtg_usa_civil_war_fascists.12.a:0 "Özlenecek."
 mtg_usa_civil_war_fascists.12.desc:0 "Sağlık sorunlarını gerekçe gösteren General [From.GetName] istifasını sundu. Ancak, özel olarak ülkenin siyasi yönü hakkında derin endişelerini dile getirdiği, hatta yeni bir Amerikan İç Savaşı'nın kapıda olduğunu iddia edecek kadar ileri gittiği açık bir sırdır.\n\nKendi sadakatini düşünmek yerine, yurttaşlarına karşı hiç silahlanmamaya karar vermiş gibi görünüyor."
 mtg_usa_civil_war_fascists.12.t:0 "General [From.GetName] İstifa Ediyor"
 mtg_usa_civil_war_fascists.13.a:0 "Çok rahatsız edici."
 mtg_usa_civil_war_fascists.13.desc:0 "[usa_ng_mobilized.GetName] Valisi, eyaletin Ulusal Muhafızlarını \"uzun süreli eğitim ve tatbikatlar\" olarak adlandırdığı şey için seferber ettiğini duyurdu. Savaş bakanlığı, [usa_ng_mobilized.GetName]'de planlanan herhangi bir manevra hakkında bilgisi olmadığını iddia ediyor. \n\n Görünüşe göre Ulusal Muhafız birimleri, yürüyüşe çıkarken tahsis edilen erzak ve canlı mühimmatın tamamını yanlarında götürmüşler ve bu da tam olarak neye hazırlandıkları konusunda soru işaretlerine yol açmış."
 mtg_usa_civil_war_fascists.13.t:0 "Vali Ulusal Muhafızları Seferber Ediyor"
 mtg_usa_civil_war_fascists.14.a:0 "Ne sadakatsizlik."
 mtg_usa_civil_war_fascists.14.desc:0 "Birkaç birimden, askerlerin izinden dönmediği veya sadece görev yerlerini terk ettiği yönünde endişe verici raporlar geldi. Belki de daha endişe verici olanı, bu askerlerin çoğunun aynı coğrafi bölgelerden gelmesi ve birçoğunun kaybolmadan sadece birkaç gün önce evden mektup almış olmasıdır.\n\nGörünüşe göre güney eyaletlerindeki askerleri eve döndürmek için ortak bir çaba var."
 mtg_usa_civil_war_fascists.14.t:0 "Askerler Firar Ediyor"
 mtg_usa_civil_war_fascists.15.a:0 "Bu çok da önemli olmamalı."
 mtg_usa_civil_war_fascists.15.desc:0 "İş için uygun olmayan bir siyasi iklimi gerekçe gösteren büyük bir silah şirketinin sahibi, bugün üretimi daha uygun bir yere taşıyacağını duyurdu. Özellikle, üretimi düşürdüğünü ve yatırımcı güvenini azalttığını iddia ettiği sendika faaliyetlerindeki bir artışa dikkat çekti. Bunun yerine, şirket güney eyaletlerinde açıklanmayan bir yerde yeni bir fabrika inşa edecek."
 mtg_usa_civil_war_fascists.15.t:0 "Sanayici Silah Fabrikasını Taşıyor"
 mtg_usa_civil_war_fascists.16.a:0 "Saçma ve Amerikan karşıtı bir pozisyon."
 mtg_usa_civil_war_fascists.16.desc:0 "Ticaret Bakanlığı'ndan gelen gizli bir desteğe göre, ABD'nin kuzey bölgelerindeki artan sayıda sanayici, daha yüksek ücretler ve daha kısa iş günleri talep eden sendikalar tarafından bir dizi grev çağrısı yapıldıktan sonra üretimi diğer eyaletlere taşıma planları yaptı. İş dünyasında, bu grevcileri bastırmak için harekete geçmeyecek eyaletlerde makul bir kar elde etmenin giderek zorlaştığını savunan birçok kişiyle birlikte derin bir endişe havası hakim."
 mtg_usa_civil_war_fascists.16.t:0 "Sanayici Sivil Fabrikayı Taşıyor"
 mtg_usa_civil_war_fascists.2.a:0 "Kan döküldü. Bu iş bitmeden daha fazlasının dökülmesini beklemeliyiz."
 mtg_usa_civil_war_fascists.2.desc:0 "Bugün başkentteki başka bir protestoda gerilim tırmandı, çünkü Amerika Gümüş Lejyonu da dahil olmak üzere bir dizi grup tarafından başka bir kitlesel protesto çağrısı yapıldı. Bir dizi Kongre Üyesinin tutuklanıp kendilerine teslim edilmesi yönündeki önceki taleplerini tekrarlayan protestocular, Capitol'ü basıp listedeki kişileri zorla çıkarmadan önce bir saatlik bir ültimatom verdiler. \n\nÜltimatom tepkisiz geçince, küçük Gümüş Lejyoner mangaları Capitol Polisi hattına hücum etti. Kanlı bir arbede gelişti ve hızla diğer protestocuları da içine alacak şekilde yayıldı. Polis bu kadar meşgulken, diğer gruplar binalara giriş sağladı. Odadan odaya giderek, hedeflenen kurbanlarından birkaçını bulmayı başardılar, ancak silahlı polis tarafından ayrılmaları engellendi. Ardından gelen çatışmada, saldırganlardan birkaçı öldürüldü, iki kongre üyesi ise yaralandı.\n\nBaşkent üzerinde çirkin bir hava çöktü, her iki taraf da tırmanış için diğerini suçluyor. Şimdi Capitol Tepesi Savaşı olarak bilinen olayın protestoların sonu mu, yoksa daha da büyük bir çatışmanın sadece başlangıcı mı olduğunu önümüzdeki birkaç hafta gösterecek."
 mtg_usa_civil_war_fascists.2.t:0 "Protestolar şiddete tırmanıyor"
 mtg_usa_civil_war_fascists.20.a:0 "Adını koyalım: İhanet."
 mtg_usa_civil_war_fascists.20.desc:0 "Bugün saat 8:00'de, [CSAcapital.GetName]'den özel bir elçi, Başkan [USA.GetLeader]'e Eyalet Yasama Meclisi'nden [CSAcapital.GetName]'in artık kendini cumhuriyetin bir parçası olarak görmeyeceğini duyuran bir notu teslim etmek üzere Beyaz Saray'a geldi. Bunun herhangi bir medeni halkın temel bir hakkı olduğunu iddia ederek - ve Bağımsızlık Bildirgesi'nden kapsamlı bir şekilde alıntı yaparak - not ayrıca barışçıl bir ayrılığın herkesin çıkarına olduğunu ve yeni devletin [USA.GetNameDef]'in iyi bir komşusu olarak kendi işlerini yürütmekten başka bir şey istemediğini vurguladı."
 mtg_usa_civil_war_fascists.20.t:0 "Ayrılık!"
 mtg_usa_civil_war_fascists.201.a:0 "Onları ayrı birimler halinde organize et."
 mtg_usa_civil_war_fascists.201.b:0 "Onları Orduya entegre et."
 mtg_usa_civil_war_fascists.201.desc:0 "Kuvvetlerimiz [CSA_liberated_state.GetName]'e ilerlerken, uzun süredir bize karşı gizli sempati besleyen çok sayıda sempatik vatandaşla karşılaştılar. Vatansever bir şevk dalgasına kapılarak, ordumuza katılmak istediler."
 mtg_usa_civil_war_fascists.201.t:0 "[CSA_liberated_state.GetName]'den Gönüllüler"
 mtg_usa_civil_war_fascists.202.desc:0 "Kuvvetlerimiz [USA_liberated_state.GetName]'e ilerlerken, uzun süredir bize karşı gizli sempati besleyen çok sayıda sempatik vatandaşla karşılaştılar. Vatansever bir şevk dalgasına kapılarak, ordumuza katılmak istediler."
 mtg_usa_civil_war_fascists.202.t:0 "[USA_liberated_state.GetName]'den Gönüllüler"
 mtg_usa_civil_war_fascists.203.a:0 "Hepsi hain."
 mtg_usa_civil_war_fascists.203.desc:0 "Kendilerine [USA_state_government_created.GetName] Vatandaş Konseyi adını veren bir grup, [USA_state_government_created.GetName]'in yönetimini [CSA.GetAdjective] askeri yetkililerinden devraldıklarını duyurdu. Devam eden çatışmada hiçbir bağlılıkları olmadığını iddia ederken, aynı zamanda [CSA.GetAdjective] ordusu için askere alımla ilgili birkaç yeni yasayı uygulayacaklarını da duyurdular.\n\nDuyurunun bir parçası olarak, başkentte hala kalan kongre delegelerinin artık [USA_state_government_created.GetName] halkını temsil etmediğini ilan ettiler."
 mtg_usa_civil_war_fascists.203.t:0 "İsyancılar [USA_state_government_created.GetName]'de işbirlikçi hükûmet kuruyor"
 mtg_usa_civil_war_fascists.21.a:0 "Daha önce de buradaydık, değil mi?"
 mtg_usa_civil_war_fascists.21.desc:0 "İlk eyaletin [USA.GetNameDef] ile bağlarını koparmasından sadece birkaç saat sonra, diğerleri de neredeyse aynı sesli beyanlarla aynı şeyi yaptı. Etkilenen eyaletlerde [USA.GetNameDef] üyeliğinin devamı lehine yapılan çeşitli gösteriler kanlı hale geldiğinde ve bazı federal yetkililer saldırıya uğradığında, barışçıl bir ayrılık umutları hızla suya düştü. Birkaç vakada, Başkan [USA.GetLeader]'nin destekçileri ya da sadece bağımsızlık konusunda yetersiz gayretle suçlanan kişiler kalabalık tarafından linç edildi. Geçici Başkan [CSA.GetLeader], bu olayları \"hükümetin aşırı müdahalesine karşı üzücü ama anlaşılır sivil misilleme eylemleri\" olarak nitelendirdi ve faillere, öne çıkmaları halinde başkanlık tarafından af sözü verdi.\n\n Ayrıca, tüm federal birliklerin yeni eyalet topraklarından tamamen çekilmesini ve \"daha fazla\" önlemek için sınırda askerden arındırılmış bir bölge oluşturulmasını talep etti. yanlış anlaşılmalar\". Başkan [USA.GetLeader] bu fikri dikkate almayı bile reddetti ve orduya isyan halindeki eyaletlerde düzeni yeniden sağlama emri verdi."
 mtg_usa_civil_war_fascists.21.t:0 "Bölünmüş bir Ev"
 mtg_usa_civil_war_fascists.22.a:0 "Onlar kesinlikle korkaklar, ama en azından düşman değiller."
 mtg_usa_civil_war_fascists.22.b:0 "Taraflarını seçtiler."
 mtg_usa_civil_war_fascists.22.desc:0 "[USA.GetNameDef] ile [CSA.GetNameDef] arasında düşmanlıkların patlak vermesinin ardından, bir dizi eyalet yasama meclisi müdahale etmeme önergelerini kabul etti. Bu yasalar valiye eyaletin toprak bütünlüğünü korumasını ve her iki taraftan da muharebe birliklerinin girmesini önlemesini emrediyor. Ayrıca her iki tarafın da herhangi bir askere alma çabasını yasaklıyorlar, ancak kritik olarak, ödemenin önceden yapılması koşuluyla çatışmadaki her iki tarafa da silah ve mühimmat satışını kısıtlamıyorlar. \n\nÖnergeler ayrıca eyaletlerin kendilerini [USA.GetNameDef]'in bir parçası olarak gördüklerini ve kendi kalıcı hükûmetlerini kurmak istemediklerini de vurguluyor."
 mtg_usa_civil_war_fascists.22.t:0 "Tarafsız Blok oluşuyor"
 mtg_usa_civil_war_fascists.23.a:0 "Sonuçta kan bedeline değmezlerdi."
 mtg_usa_civil_war_fascists.23.desc:0 "Savaşın sona ermesiyle, tarafsız bloktaki eyaletler, tarafsızlıklarını sürdürmek için uygulamaya koydukları çeşitli yasa ve önlemleri sona erdireceklerini duyurdular. Bu günden itibaren, muharebe birlikleri bir kez daha topraklarına serbestçe girebilecek. Savaş sırasında toplanan milisler barışçıl bir şekilde dağıldı."
 mtg_usa_civil_war_fascists.23.t:0 "Tarafsız Blok dağılıyor"
 mtg_usa_congress_add_state_tt:0 "İki Senatör Kongre'ye eklendi. Başlangıçta hükûmeti §Gdestekleyecekler§!.\n"
 mtg_usa_congress_remove_state_tt:0 "İki Senatör Kongre'den çıkarıldı.\n"
 mtg_usa_diplomatic_protest.1.a:0 "Blöf yapıyorlar. Belki."
 mtg_usa_diplomatic_protest.1.desc:0 "[USA.GetAdjective] Başkanı [USA.GetLeader]'den kişisel bir mektup geldi. Başkan güçlü sözlerle bölgeyi istikrarsızlaştırmaya hizmet eden \"son zamanlardaki hoşgörüsüz eylemlerimizi\" kınadı. Mektupta, [From.GetNameDefCap]'nin bölgede barış ve istikrara bağlı kalmaya devam ettiği ve mevcut rotamızda devam etmemiz halinde askeri harekat da dahil olmak üzere daha fazla tedbir almak zorunda kalacağı belirtiliyor."
 mtg_usa_diplomatic_protest.1.t:0 "[USA.GetNameDefCap] protesto notası gönderiyor"
 mtg_usa_diplomatic_protest.2.a:0 "Bu topraklar savaşa değmez."
 mtg_usa_diplomatic_protest.2.b:0 "Başkan'a kendi işine bakmasını söyleyin."
 mtg_usa_diplomatic_protest.2.desc:0 "Başkan [USA.GetLeader], Kongre'nin her iki kanadı önünde yaptığı konuşmada, hükümetinin Amerika'da hiçbir dış gücün toprak sahibi olmasına izin verilmemesi gerektiğini belirten Monroe Doktrini'ne bağlı kaldığını duyurdu. Uygulamada [USA.GetAdjective] hükümeti, küçük toprakları elinde bulunduran diğer [USA.GetRulingIdeology] ülkelerine hoşgörü gösterirken, \"yasadışı işgal ve [USA.GetNameDef]'nin güvenliğine doğrudan tehdit\" olarak adlandırdığı durumu kabul edemez. \n\nKısa bir süre sonra, [USA.GetAdjective] büyükelçisi, Amerikan varlıklarımızın kontrolünü [USA.GetNameDef]'ye devretmek için Başkan'dan bir ültimatom içeren bir notu teslim etti."
 mtg_usa_diplomatic_protest.2.t:0 "[USA.GetNameDefCap] Amerikan mülklerinin devrini talep ediyor"
 mtg_usa_diplomatic_protest.3.a:0 "Seçeneklerimizi değerlendireceğiz."
 mtg_usa_diplomatic_protest.3.desc:0 "Kan dökülmesini önleme arzusunu gerekçe gösteren [From.GetLeader] hükûmeti, Amerikan mülklerinin kontrolünü bize devretmeyi kabul etti. Bu topraklara derhal tam egemenlik mi vermemiz gerektiği yoksa onları doğrudan idaremiz altında mı tutmamız gerektiği Dışişleri Bakanlığı'nda bir tartışma konusudur."
 mtg_usa_diplomatic_protest.3.t:0 "[From.GetNameDefCap] Toprakları iade ediyor"
 mtg_usa_diplomatic_protest.4.a:0 "Uyarıldılar. Uyarıyı dikkate almamayı seçtiler."
 mtg_usa_diplomatic_protest.4.b:0 "Bu şiddetle çözülmeyecek."
 mtg_usa_diplomatic_protest.4.desc:0 "Notumuzu \"[From.GetNameDef]'nin iç meselelerine kabul edilemez bir müdahale\" olarak nitelendiren [From.GetAdjective] hükümeti, Amerika toprakları üzerindeki egemenliklerini tartışmayı açıkça reddetti."
 mtg_usa_diplomatic_protest.4.t:0 "[From.GetNameDefCap] Ültimatomu Reddediyor"
 mtg_usa_foreign_support.1.a:0 "Elimizden geleni yapmalıyız."
 mtg_usa_foreign_support.1.b:0 "Hiçbir şeyi karşılayamayız."
 mtg_usa_foreign_support.1.desc:0 "Amerika Gümüş Lejyonu'nun bazı önde gelen üyeleri, [This.GetNameDef] üzerinden bir konferans turuna çıktılar ve ülkelerinin hükûmetin her kademesindeki köklü komünistlerden karşılaştığı tehdit hakkında uzun uzun konuştular. Amerikan yaşam tarzı saldırı altında ve sunabileceğimiz her türlü destek büyük takdir görecek ve ne yazık ki gerekli olan yaklaşan mücadelede fark yaratabilir."
 mtg_usa_foreign_support.1.t:0 "[USA.GetNameDef] için Bağışlar"
 mtg_usa_foreign_support.10.a:0 "Gerçek [USA.GetAdjective] Kahramanları"
 mtg_usa_foreign_support.10.desc:0 "[From.GetNameDef]'deki heyetimizden bir mesaj geldi. [From.GetAdjective] hükûmeti, Gümüş Lejyon üyelerini piyade taktikleri konusunda eğitmek için birkaç eğitim kampının inşasını onayladı. Savaş patlak verene kadar becerilerini geliştirecekler."
 mtg_usa_foreign_support.10.t:0 "[From.GetNameDefCap] Eğitim Kamplarını onaylıyor"
 mtg_usa_foreign_support.11.a:0 "Bunu hatırlayacağız."
 mtg_usa_foreign_support.11.desc:0 "[From.GetNameDef]'deki heyetimizden bir mesaj geldi. Önerdiğimiz eğitim kampları için [From.GetLeader]'den izin alamadılar ve daha fazla talimat istiyorlar."
 mtg_usa_foreign_support.11.t:0 "[From.GetNameDefCap] yardım etmeyi reddediyor"
 mtg_usa_foreign_support.12.a:0 "Kanatlarını kazanacaklar."
 mtg_usa_foreign_support.12.b:0 "Bu saçmalık için zamanımız yok."
 mtg_usa_foreign_support.12.desc:0 "Gümüş Lejyon'un Amerikalı faşistleri, pilot eğitimi için bir dizi gönüllü göndermelerine izin verilmesi için [This.GetLeader] ile görüştüler. Adaylar, tarafımızdan onaylanmadan önce becerileri ve doğru ideolojik temelleri için dikkatlice seçilecekti. Görünüşe göre lejyon, mevcut silahlı kuvvetlerdeki profesyonel pilotların çoğunun ABD'de bir faşist hükûmeti kabul etmeyeceğine ve bir isyanı destekleyeceğine inanıyor."
 mtg_usa_foreign_support.12.t:0 "Gümüş Lejyon pilot eğitmek istiyor"
 mtg_usa_foreign_support.13.a:0 "Heyecanla beklenecekler."
 mtg_usa_foreign_support.13.desc:0 "[From.GetAdjective] hükûmeti, pilot eğitimi için az sayıda Gümüş Lejyoner'i onayladı. Daha fazla müzakere, savaş patlak verdiğinde teslim edilmek üzere krediyle az sayıda avcı uçağının satışını sağladı."
 mtg_usa_foreign_support.13.t:0 "[From.GetNameDefCap] pilot eğitimini onaylıyor"
 mtg_usa_foreign_support.14.a:0 "Uçak uçurmak o kadar da zor değil, değil mi?"
 mtg_usa_foreign_support.14.desc:0 "Adayların uygunluğu konusundaki ciddi endişeleri gerekçe gösteren [From.GetAdjective] hükûmeti, önerdiğimiz pilot eğitim programı için izin vermeyi reddetti."
 mtg_usa_foreign_support.14.t:0 "[From.GetNameDefCap] Pilotları Eğitmeyi Reddediyor"
 mtg_usa_foreign_support.15.a:0 "Değerli bir yatırım"
 mtg_usa_foreign_support.15.b:0 "Bu bir para israfı olurdu"
 mtg_usa_foreign_support.15.desc:0 "Bir Gümüş Lejyon temsilcisi, [USA.GetNameDef]'de gemi inşa etmek için bir dizi projenin finansmanını sağlamada yardım istemek üzere geldi. Gümüş Lejyon - [USA.GetAdjective] hükûmetindeki kişilerin desteğiyle - bu gemileri kayıtlardan uzak tutmak istiyor ve alternatif finansman kaynakları aramak zorunda."
 mtg_usa_foreign_support.15.t:0 "Gümüş Lejyon gemi edinmek istiyor"
 mtg_usa_foreign_support.16.a:0 "Bir günde gemi inşa edemezsin."
 mtg_usa_foreign_support.16.desc:0 "[From.GetAdjective] hükûmeti, gemi satın almak için gerekli fonları onayladı. Mevcut plan, gemileri ve silahları ayrı ayrı satın alıp savaş başladığında bir araya getirmektir. Bu süreç şüphesiz biraz zaman alacaktır."
 mtg_usa_foreign_support.16.t:0 "[From.GetNameDefCap] Finansmanı onaylıyor"
 mtg_usa_foreign_support.17.a:0 "Talihsiz."
 mtg_usa_foreign_support.17.desc:0 "[From.GetLeader] ile kişisel bir görüşme sağlamamıza rağmen, [From.GetNameDef]'deki ajanlarımıza [From.GetAdjective] hükûmetinin gemi almamıza yardımcı olmak için parası olmadığını söylendi."
 mtg_usa_foreign_support.17.t:0 "[From.GetNameDefCap] Finansmanı reddediyor"
 mtg_usa_foreign_support.2.a:0 "Gelecekte faydalı olacaktır."
 mtg_usa_foreign_support.2.desc:0 "[From.GetNameDef]'e gönderdiğimiz heyet, bağış toplama kampanyalarında iyi bir başarı bildirdi. Büyük bir katkının bizzat [From.GetLeader] tarafından yapıldığı bildirildi."
 mtg_usa_foreign_support.2.t:0 "[From.GetNameDefCap] bağışları onaylıyor"
 mtg_usa_foreign_support.3.a:0 "Çok kötü."
 mtg_usa_foreign_support.3.desc:0 "[From.GetNameDef]'deki heyetimiz, boş odalara konuşarak ve siyasi liderlerle görüşmenin bile imkansız olduğunu görerek pek başarılı olamadı. Eli boş döndüler."
 mtg_usa_foreign_support.3.t:0 "[From.GetNameDefCap] bağışlara izin vermeyi reddediyor"
 mtg_usa_foreign_support.4.a:0 "Biraz Tüfek gönder"
 mtg_usa_foreign_support.4.b:0 "Biraz sahra topu gönder"
 mtg_usa_foreign_support.4.c:0 "Biraz eski tank gönder"
 mtg_usa_foreign_support.4.d:0 "Kendi başlarının çaresine bakmak zorunda kalacaklar."
 mtg_usa_foreign_support.4.desc:0 "Arka kanalları kullanarak, bir dizi Gümüş Lejyon üyesi silah alımlarını müzakere etmek için bize başvurdu. Ülkelerinin, Amerikan yaşam tarzını bozan komünist unsurlara karşı, muhtemelen dışarıdan destekle bir iç savaşa gittiğine şiddetle inanıyorlar. \n\nSadece şansları biraz eşitlemek istiyorlar ve ayırabileceğimiz herhangi bir teçhizat olup olmadığını soruyorlar."
 mtg_usa_foreign_support.4.t:0 "[USA.GetNameDef] için Silahlar"
 mtg_usa_foreign_support.5.a:0 "İşe yarayacaklar."
 mtg_usa_foreign_support.5.desc:0 "[From.GetNameDef] ile olan bağlantılarımız işe yaradı. [From.GetLeader]'in açık onayıyla, [From.GetAdjective] şirketleri bize krediyle tüfek satmaya başladı. Silahlar, savaş gelene kadar tarafsız ülkelerde depoda tutulacak."
 mtg_usa_foreign_support.5.t:0 "[From.GetNameDefCap] Tüfek gönderiyor"
 mtg_usa_foreign_support.6.a:0 "Ne kabalık."
 mtg_usa_foreign_support.6.desc:0 "[From.GetNameDef]'den yeni silahlar temin etme girişimlerimiz kabaca geri çevrildi. [From.GetLeader], hükûmetinin [From.GetAdjective] halkının kaynaklarının bu tür aptalca çabalarda israf edilmesine asla izin vermeyeceğini ilan etti."
 mtg_usa_foreign_support.6.t:0 "[From.GetLeader] desteği reddediyor"
 mtg_usa_foreign_support.7.a:0 "Olağanüstü!"
 mtg_usa_foreign_support.7.desc:0 "[From.GetNameDef]'deki heyetimiz, davamız için daha fazla destek sağlama girişimlerinde önemli bir atılım bildirdi. [From.GetAdjective] ordusu, bir dizi eski sahra topundan vazgeçmeyi ve onları bizim için kullanılabilir hale getirmeyi kabul etti. Düşmanı uyarmamak için, zamanı gelene kadar gizli bir yerde depoda tutulacaklar."
 mtg_usa_foreign_support.7.t:0 "[From.GetNameDefCap] sahra topları gönderiyor"
 mtg_usa_foreign_support.8.a:0 "Düşmanlarımız sakınsın!"
 mtg_usa_foreign_support.8.desc:0 "[From.GetNameDef]'deki ajanımız çarpıcı bir başarı bildirdi. Özel bir akşam yemeği sırasında, [From.GetLeader] bize krediyle bir dizi zırhlı araç satmayı kabul etti. [From.GetNameDefCap], [USA.GetNameDef]'deki gelişmeleri büyük bir ilgiyle izliyor ve ellerinden gelen her şekilde bize yardımcı olmaktan mutluluk duyacaktır.\n\nAncak, [From.GetAdjective] hükûmeti, henüz iktidarda olmayan bir partiyi açıkça destekliyor olarak görülemez, bu yüzden tanklar savaş patlak verdiğinde teslim edilecek."
 mtg_usa_foreign_support.8.t:0 "[From.GetNameDefCap] tank gönderiyor"
 mtg_usa_foreign_support.9.a:0 "Onlardan adam yaratacağız!"
 mtg_usa_foreign_support.9.b:0 "Asker oyunu oynamak için başka bir yere gidebilirler."
 mtg_usa_foreign_support.9.desc:0 "Amerika Gümüş Lejyonu, gönüllüleri eğitmek için bir dizi eğitim kampı inşa etme talebiyle bize başvurdu. Kendi ülkelerindeki siyasi durum hızla kötüleşirken, geldiklerine inandıkları savaşa hazır olduklarından emin olmak istiyorlar."
 mtg_usa_foreign_support.9.t:0 "Gümüş Lejyon eğitim kampları kurmak istiyor"
 mtg_usa_north_american_dominion.1.a:0 "Başka seçeneğimiz yok."
 mtg_usa_north_american_dominion.1.desc:0 "[USA.GetAdjective] büyükelçisi, Kuzey Amerika ve Karayipler'in tamamında planlı bir diplomatik saldırının parçası gibi görünen bir şekilde, Başkan [USA.GetLeader]'den, hükümetinin \"uluslarımız arasında devam eden barış ve iyi niyetin yararına\" gelecekteki herhangi bir dış politika kararında kendilerine danışmamızı beklediğini bildiren bir notu bize teslim etti."
 mtg_usa_north_american_dominion.1.t:0 "[USA.GetNameDefCap] Dış Politika Üzerinde Kontrol Talep Ediyor"
 mtg_usa_north_american_dominion.2.a:0 "Akıllıca bir seçim."
 mtg_usa_north_american_dominion.2.desc:0 "[From.GetLeader] hükûmeti taleplerimizi kabul etti ve büyükelçimizin verdikleri herhangi bir büyük politika kararında veto hakkına sahip olmasına izin verecek."
 mtg_usa_north_american_dominion.2.t:0 "[From.GetNameDefCap] boyun eğmeyi kabul ediyor"
 mtg_usa_north_american_dominion.3.a:0 "Bu kadar zayıf birinden cesur sözler."
 mtg_usa_north_american_dominion.3.b:0 "Belki de haklıdır."
 mtg_usa_north_american_dominion.3.desc:0 "[From.GetLeader], diplomatik notumuza derin bir endişeyle tepki gösterdi. Cevabında, [From.GetNameDef]'in uzun ve gururlu bir bağımsızlık ve egemenlik geçmişine sahip olduğunu ve bir yabancı gücün iradesini onlara zorla kabul ettirmesine asla izin vermeyeceğini ilan etti.\n\nAyrıca Başkan [USA.GetLeader]'e, bu konuda bir savaşın sonuçlarını düşünmesi için yalvardı; bu savaş kesinlikle [USA.GetNameDef]'in barışa en büyük tehdit olarak etiketlenmesini sağlayacak ve hayal edilemez sonuçlara yol açacaktı."
 mtg_usa_north_american_dominion.3.t:0 "[From.GetNameDefCap] Reddediyor"
 mtg_usa_pacific_pacification.1.a:0 "Elbette iç işlere karışmazlardı."
 mtg_usa_pacific_pacification.1.b:0 "Bu bölgeleri gayet iyi savunabiliriz."
 mtg_usa_pacific_pacification.1.desc_a:0 "[USA.GetAdjective] hükûmetinden bir heyet, Pasifik'teki mülklerimizin güvenliğini görüşmek üzere geldi. Çin'deki devam eden istikrarsızlığı ve Japonya'daki durumu dikkate alan Başkan [USA.GetLeader], bir dizi ayrıcalık ve yedek hak karşılığında [GET_AUSTRALIA_NEW_ZEALAND_STATUS]'ın savunma sorumluluğunu üstlenmeye isteklidir.\n\n [USA.GetAdjective]ler bu hakların yalnızca [GET_AUSTRALIA_NEW_ZEALAND_STATUS]'ın güvenliğini sağlamak için kullanılacağını iddia etse de, hükûmetteki birçok kişi bunun [GET_AUSTRALIA_NEW_ZEALAND_STATUS]'ı kukladan biraz daha fazlası yapacağına inanıyor."
 mtg_usa_pacific_pacification.1.desc_b:0 "[USA.GetAdjective] hükûmetinden bir heyet, ortak savunmamız için planları görüşmek üzere geldi. Görünüşe göre Başkan [USA.GetLeader], dünyanın bizim küçük parçamızı [USA.GetNameDef]'in güvenliği için hayati bir çıkar olarak görüyor. Ancak, yardımımıza gelme garantisinin ötesinde, [USA.GetAdjective] hükûmeti bizim kendimizin bir tehdit haline gelmememizi sağlamak istiyor. Bu nedenle, anlaşma [USA.GetNameDef]'e iç işlerimizi nasıl yürüttüğümüz konusunda önemli bir söz hakkı tanıyacak bir dizi hükümle birlikte geliyor.\n\nŞimdiye kadar müzakerelerde savaş tehdidi yapılmamış olsa da, Başkan [USA.GetLeader]'in reddimizi çok düşmanca bir eylem olarak göreceği açık."
 mtg_usa_pacific_pacification.1.t:0 "[USA.GetNameDefCap] sömürge mülklerini talep ediyor"
 mtg_usa_pacific_pacification.2.a:0 "Harika iş."
 mtg_usa_pacific_pacification.2.desc:0 "[From.GetLeader] hükûmeti tekliflerimizi kabul etti. Ayrıntıların uygulanmasını koordine etmek için özel bir ortak komite kuruldu."
 mtg_usa_pacific_pacification.2.t:0 "[From.GetNameDefCap] kabul ediyor"
 mtg_usa_pacific_pacification.3.a:0 "Güç kullanmaktan başka çaremiz yok."
 mtg_usa_pacific_pacification.3.b:0 "Bir savaşı göze alamayız."
 mtg_usa_pacific_pacification.3.desc:0 "[From.GetNameDef] hükûmeti, uluslarımız arasında bekleyen bir sorun olmadığını iddia ederek heyetimizle görüşmeyi bile reddetti. Ancak, [GET_AUSTRALIA_NEW_ZEALAND_STATUS]'daki askeri ataşeler son zamanlarda askeri manevralarda önemli bir artış olduğunu bildirdi."
 mtg_usa_pacific_pacification.3.t:0 "[From.GetNameDefCap] Reddediyor"
 mtg_usa_protect_south_america.1.a:0 "Taşınamayacak kadar ağır sonuçlar."
 mtg_usa_protect_south_america.1.b:0 "Özgürlüğümüzü savunacağız!"
 mtg_usa_protect_south_america.1.desc:0 "[USA.GetAdjective] başkentindeki bir zirvede, [USA.GetAdjective] Başkanı [USA.GetLeader], Güney Amerika'da yeni bir güvenlik mimarisi çağrısında bulundu. Diplomatik bir dille ifade edilse de, [USA.GetAdjective] hükûmeti açıkça kendini kıtanın güvenliğinin arkasındaki ana güç olarak görüyor ve karşılığında siyasi rehberliğimizi takip etmemizi bekliyor.\n\n Aslında, [USA.GetAdjective] diplomatları zaten perde arkasında bunun için bastırıyor ve bu teklifleri ABD büyükelçisi için - ve sadece ABD büyükelçisi için - özel danışma hakları ve veto yetkileri gibi somut eylem noktalarına çeviriyor.\n\nDaha da ürkütücü olanı, bunu kabul etmeyi reddetmenin, Başkana göre, 'derinden talihsiz' sonuçları olan düşmanca ve istikrarsızlaştırıcı bir eylem olarak kabul edilecek olmasıdır."
 mtg_usa_protect_south_america.1.t:0 "Güney Amerika Güvenlik Zirvesi"
 mtg_usa_protect_south_america.2.a:0 "Gerçek bir lider."
 mtg_usa_protect_south_america.2.desc:0 "Başkan [From.GetLeader] tekliflerimizi kabul etti ve [From.GetAdjective] Dışişleri Bakanı'na daha ince ayrıntıları müzakere etmesi talimatını verdi."
 mtg_usa_protect_south_america.2.t:0 "[From.GetNameDefCap] Rehberliğimizi kabul ediyor"
 mtg_usa_protect_south_america.3.a:0 "Bu döneklerin bölgeyi tehdit etmesine izin veremeyiz."
 mtg_usa_protect_south_america.3.b:0 "Bir savaş sadece bölgenin istikrarsızlaşmasını hızlandırır."
 mtg_usa_protect_south_america.3.desc:0 "[From.GetNameDef]'den gelen heyet, eve gitmek üzere zirveden aceleyle ayrıldı. [From.GetAdjective] büyükelçisi şimdiye kadar bu konuda yorum yapmayı reddetti ve hala evden talimat beklediğini iddia etti."
 mtg_usa_protect_south_america.3.t:0 "[From.GetNameDefCap] Rehberliğimizi Reddediyor"
 mtg_usa_secure_asia.1.a:0 "Dizlerinin üzerinde yaşamak daha iyidir."
 mtg_usa_secure_asia.1.b:0 "Ayaklarının üzerinde ölmek daha iyidir."
 mtg_usa_secure_asia.1.desc:0 "Başkan [USA.GetLeader], [USA.GetNameDef]'in bölgedeki yenilenen ilgisini görüşmek üzere [This.GetLeader] ile görüşmek için başkente özel bir temsilci gönderdi. [This.GetNameDefCap] açıkça [USA.GetAdjective] stratejisinin bölge için kilit noktasını oluşturuyor. Bu nedenle, hükûmetimize [USA.GetNameDef]'in [This.GetNameDef]'de dost olmayan veya gerçekten düşmanca bir hükûmete tahammül edemeyeceği iletildi."
 mtg_usa_secure_asia.1.t:0 "[USA.GetNameDefCap] baskı uyguluyor"
 mtg_usa_secure_asia.2.a:0 "Mükemmel."
 mtg_usa_secure_asia.2.desc:0 "Kapsamlı müzakereler ve kişisel güvenliğinin garantilerinin ardından, [From.GetLeader], Özel Elçimize kapsamlı danışma hakları tanımayı kabul etti ve bu da bize iç işleri üzerinde önemli miktarda nüfuz sağladı."
 mtg_usa_secure_asia.2.t:0 "[From.GetLeader] kabul ediyor"
 mtg_usa_secure_asia.3.a:0 "Cesurca. Aptalca, kesinlikle, ama cesurca."
 mtg_usa_secure_asia.3.b:0 "Sonuçta önemli değiller."
 mtg_usa_secure_asia.3.desc:0 "[From.GetAdjective] hükümetinden bir mesaj geldi: \"Özgürlük bir kez kazanıldığında asla vazgeçilmemelidir.\" Başka bir iletişim alınmadı ve [From.GetNameDef]'deki büyükelçimize pasaportu verildi."
 mtg_usa_secure_asia.3.t:0 "[From.GetNameDefCap] Meydan Okuyor"
 mtg_usa_secure_asia.4.a:0 "Onlara helal olsun."
 mtg_usa_secure_asia.4.b:0 "Saçma bir teklif."
 mtg_usa_secure_asia.4.desc:0 "Yakın tarihli bir basın toplantısında, Başkan [USA.GetLeader], Hint-Çin bölgesi ve daha büyük Güneydoğu Asya için yeni bir stratejik görünüm duyurdu. Hükûmeti artık bölgedeki belirgin güç boşluğunu kabul etmeyecektir. Endonezya üzerinde var olan her türlü kontrol, bölgedeki [USA.GetAdjective] çıkarlarının güvenliğini garanti etmek için çok zayıftır. Hükûmeti bunu değiştirmeyi amaçlıyor. \n\nYorumları açıklamak için [This.GetLeader] tarafından çağrıldığında, [USA.GetAdjective] büyükelçisi [USA.GetAdjective] pozisyonunu ayrıntılı olarak özetleyen bir not verdi. Talepler, Endonezya Adaları üzerindeki kontrolün [USA.GetAdjective] kontrolüne devredilmesinden daha az bir şey anlamına gelmiyor."
 mtg_usa_secure_asia.4.t:0 "ABD Sömürgeler Üzerinde Kontrol Talep Ediyor"
 mtg_usa_secure_asia.5.a:0 "Mümkün olan en iyi sonuç."
 mtg_usa_secure_asia.5.desc:0 "Basın önünde konuşan [From.GetLeader], bugün hükûmetinin Doğu Hint Adaları'nda ortak egemenlik konusunda [USA.GetNameDef] ile bir antlaşma imzaladığını duyurdu.\n\nAntlaşma, yöneticilerimiz yerleşir yerleşmez kontrolü esasen bize devredecek bir dizi gizli hüküm içeriyor. Dışişleri Bakanlığı bölgeye zaten bir dizi yetkili gönderdi."
 mtg_usa_secure_asia.5.t:0 "[From.GetLeader] teklifimizi kabul ediyor."
 mtg_usa_secure_asia.6.a:0 "Bunu barışçıl bir şekilde çözme şansları vardı. Seçmediler."
 mtg_usa_secure_asia.6.b:0 "Toprakları... şimdilik... tutabilirler."
 mtg_usa_secure_asia.6.desc:0 "[From.GetNameDef] ile müzakereler neredeyse başlar başlamaz çöktü. [From.GetAdjective] kabinesi notumuzu bir saatten az bir süre tartıştıktan sonra özetle reddetti. [From.GetAdjective] dışişleri bakanı büyükelçimize, teklif önemli ölçüde değiştirilmedikçe tartışılacak bir şey olmadığını bildirdi."
 mtg_usa_secure_asia.6.t:0 "[From.GetNameDefCap] masadan kalkıyor"
 mtg_usa_secure_asia.7.a:0 "Vietnam'ı onlara bırakın."
 mtg_usa_secure_asia.7.b:0 "Bunlar hayati [This.GetAdjective] topraklarıdır!"
 mtg_usa_secure_asia.7.desc:0 "Daha büyük bir diplomatik saldırının bir parçası olarak, Başkan [USA.GetLeader] Vietnam ve Hindiçin'i [USA.GetNameDef] için hayati bir çıkar bölgesi olarak alenen tanımladı. Bu nedenle, [USA.GetNameDef] bölgedeki varlıklarını artırmayı hedefleyecektir.\n\nÖzel olarak, [USA.GetNameDef] Hindiçin hakkında çok agresif sesler çıkarıyor. [SIA.GetNameDef]'e baskı yapmanın yanı sıra, sömürgelerimizde asker bulundurma ve sömürge yönetimini 'yönlendirme' hakkını da talep ettiler. \n\nEsasen, bu o toprakları onların kontrolüne devretmek anlamına gelecektir."
 mtg_usa_secure_asia.7.t:0 "[USA.GetNameDefCap] Hindiçin'i talep ediyor"
 mtg_usa_secure_asia.8.a:0 "Vietnam'a katılımımız, bölge için yeni bir barış ve refah dönemi başlatıyor."
 mtg_usa_secure_asia.8.desc:0 "[From.GetAdjective] hükûmeti taleplerimizi kabul etti ve yerel yönetime, halkımızı yerleştirene kadar tam işbirliği yapmaları talimatını verdi."
 mtg_usa_secure_asia.8.t:0 "[From.GetNameDefCap] Hindiçin'i devrediyor"
 mtg_usa_secure_asia.9.a:0 "Ulusal güvenlikten taviz vermeyeceğiz."
 mtg_usa_secure_asia.9.b:0 "Zaten Vietnam'a karışmak büyük bir hata olurdu."
 mtg_usa_secure_asia.9.desc:0 "Uzun süren ve giderek ısınan müzakerelerin ardından, [From.GetAdjective] hükûmeti nihayet teklifimizi reddetti. [From.GetNameDef]'deki büyükelçimiz, artık [From.GetLeader]'den bir randevu bile alamadığını bildiriyor."
 mtg_usa_secure_asia.9.t:0 "[From.GetNameDefCap] Reddediyor"
 mtg_usa_southern_threat.1.a:0 "Kan dökülmesini önlemek için kabul edilemezi kabul etmeliyiz."
 mtg_usa_southern_threat.1.b:0 "Asla!"
 mtg_usa_southern_threat.1.desc:0 "Başkan [USA.GetLeader], ABD hükümetinin bir takım taleplerini iletmek üzere büyükelçimizi çağırdı. Bunlar arasında [USA.GetAdjective] Elçisi için özel danışma hakları da bulunmaktadır. Gerçekte, bu haklar [USA.GetAdjective] hükümetine verdiğimiz herhangi bir kararda veto hakkı verecektir. \n\nReddetmemiz durumunda, not devam ediyor, [USA.GetAdjective] hükümeti \"ulusal güvenliği garanti altına almak için gerekli gördüğü önlemleri uygulamaya\" zorlanacak."
 mtg_usa_southern_threat.1.t:0 "[USA.GetNameDefCap] Danışma ve Dostluk Antlaşması talep ediyor"
 mtg_usa_southern_threat.2.a:0 "Pershing gurur duyardı."
 mtg_usa_southern_threat.2.desc:0 "Konumlarının umutsuzluğunu fark eden [MEX.GetLeader] hükûmeti, teklifimizi kabul etti ve herhangi bir büyük politika kararından önce bize danışmayı kabul etti."
 mtg_usa_southern_threat.2.t:0 "[MEX.GetLeader] kabul ediyor"
 mtg_usa_southern_threat.3.a:0 "Bu hakaretin cezasız kalmasına izin veremeyiz."
 mtg_usa_southern_threat.3.b:0 "Savaş şu anda bizim çıkarımıza değil."
 mtg_usa_southern_threat.3.desc:0 "[MEX.GetLeader], geçmiş nesil Meksikalıların \"bariz Amerikan saldırganlığı\" karşısında gösterdiği kahramanlıkları hatırlatan uzun soluklu bir konuşmada, taleplerimizi dikkate almayı bile reddetti ve büyükelçimize, Meksika halkının yabancı işgalcilere asla boyun eğmeyeceğini söyledi."
 mtg_usa_southern_threat.3.t:0 "[MEX.GetLeader] reddediyor."
 mtg_usa_strategic_interests.1.a:0 "Onlara helal olsun."
 mtg_usa_strategic_interests.1.b:0 "Bunlar stratejik topraklardır!"
 mtg_usa_strategic_interests.1.desc:0 "Başkan [USA.GetLeader], dünya çapında birkaç stratejik yerin mülkiyetiyle ilgili bir dizi teklifi görüşmek üzere Londra'ya geldi. [USA.GetAdjective] hükûmetine göre, [ENG.GetNameDef], [USA.GetAdjective] çıkarlarının karşılandığından emin olacak şekilde bu alanları yeterince savunmak için hem kaynaklardan hem de iradeden yoksundur. [ENG.GetAdjective] hükûmeti bu taahhütlerin karşılandığına dair yeterli güvence veremezse, analistler [USA.GetLeader]'in bu topraklar üzerindeki kontrolü [USA.GetNameDefCap]'e devretmemizi talep edeceğine inanıyor."
 mtg_usa_strategic_interests.1.t:0 "ABD Toprak Talep Ediyor"
 mtg_usa_strategic_interests.2.a:0 "Harika!"
 mtg_usa_strategic_interests.2.desc:0 "Uzun bir iç tartışmadan sonra, [ENG.GetAdjective] hükûmeti teklifimizi kabul etmeye karar verdi. Talep edilen toprakların mülkiyetini devretmek için her iki tarafça bir takvim üzerinde anlaşıldı."
 mtg_usa_strategic_interests.2.t:0 "[From.GetNameDefCap] toprakları devrediyor"
 mtg_usa_strategic_interests.3.a:0 "O zaman bakalım onları düzgün savunabilecekler mi!"
 mtg_usa_strategic_interests.3.b:0 "Bu topraklar bedeline değmez."
 mtg_usa_strategic_interests.3.desc:0 "Toplantıdan sadece birkaç dakika sonra, [ENG.GetLeader] ve [USA.GetLeader], [ENG.GetAdjective]'nin cevabının çok basit bir \"Hayır\" olması nedeniyle müzakereleri kesti. O zamandan beri daha kapsamlı bir resmi not geldi, ancak bu yalnızca şartları tartışmanın bile reddedilmesini pekiştiriyor."
 mtg_usa_strategic_interests.3.t:0 "[From.GetNameDefCap] İşbirliğini Reddediyor"
 panay_inc2_opinion_modifier:0 "HMS Ladybird'e Saldırı"
 panay_inc_opinion_modifier:0 "Panay Olayı"
 panay_incident.2.a:0 "Kuvvetlerimizi Çin'den çek"
 panay_incident.2.a.tt:0 "Halk, yabancı anlaşmazlıklar konusunda derinden endişeli. Eğer askerlerimiz en başta [CHI.GetName]'de olmasaydı, bu olay asla olmazdı. Çin'deki az sayıdaki gambotu ve personeli geri çekmek, yerel istikrarı iyileştirmeye yardımcı olacaktır, ancak aynı zamanda bizi gelecekteki askeri müdahalelerden daha da uzaklaştıracaktır.\n\n"
 panay_incident.2.b:0 "Tazminat talep et"
 panay_incident.2.b.tt:0 "Talebimiz Japon Hükûmetine iletilecek ve yanıtlarını beklemeliyiz.\n\n"
 panay_incident.2.c:0 "Savaş!"
 panay_incident.2.c.tt:0 "Çok daha güçlü sanayi tabanımız kilit bir avantaj olsa da, düşük halk desteği savaşı riskli bir teklif haline getirecek ve diğer küresel gelişmelere dahil olma kapasitemizi sınırlayacaktır.\n\n"
 panay_incident.2.d:0 "Gambot USS Panay, [USA.GetAdjective] bayraklarıyla açıkça işaretlenmiş olmasına rağmen, [JAP.GetName] ile [CHI.GetName] arasındaki savaşta cephe hattından sivilleri tahliye ederken bugün erken saatlerde ateşe tutuldu. İki bombayla vurulan gemi, o gün ilerleyen saatlerde üç ABD vatandaşının ölümü ve çok daha fazlasının yaralanmasıyla battı. Hayatta kalanlar, bölgedeki [USA.GetAdjective] ve [ENG.GetAdjective] gambotları tarafından kurtarıldı.\n\n[JAP.GetNameDef], bunun bir kaza olduğunu iddia etmekte ve bir özür dilemekte gecikmedi, ancak bazıları saldırının kasıtlı olduğunu düşünüyor ve bir dizi danışman savaş çağrısında bulunuyor. Ancak, savaşa halk desteği düşük kalıyor ve herhangi bir ilan muhtemelen derinden bölücü olacaktır. Nasıl yanıt vermeliyiz?"
 panay_incident.2.e:0 "Gambot USS Panay, [USA.GetAdjective] bayraklarıyla açıkça işaretlenmiş olmasına rağmen, [JAP.GetName] ile [CHI.GetName] arasındaki savaşta cephe hattından sivilleri tahliye ederken bugün erken saatlerde ateşe tutuldu. İki bombayla vurulan gemi, o gün ilerleyen saatlerde üç ABD vatandaşının ölümü ve çok daha fazlasının yaralanmasıyla battı. Hayatta kalanlar, bölgedeki [USA.GetAdjective] ve [ENG.GetAdjective] gambotları tarafından kurtarıldı.\n\n[JAP.GetNameDef], bunun bir kaza olduğunu iddia etmekte ve bir özür dilemekte gecikmedi, ancak bazıları saldırının kasıtlı olduğunu düşünüyor ve bir dizi danışman savaş çağrısında bulunuyor. Nasıl yanıt vermeliyiz?"
 panay_incident.2.e.tt:0 "Savaş desteği artarken, şimdi [CHI.GetName]'den çekilmek gelecekteki askeri harekatı meşrulaştırma çabalarımıza zarar verecektir, ancak halka barış arzumuz hakkında güvence vermek yerel istikrara yardımcı olmalıdır.\n\n"
 panay_incident.2.t:0 "USS Panay Çin'de battı!"
 panay_incident.3.a:0 "[USA.GetAdjective] Şartlarını Kabul Et"
 panay_incident.3.b:0 "Yozlaşmış Batılılara asla boyun eğmeyeceğiz!"
 panay_incident.3.b.tt:0 "[USA.GetAdjective] şartlarını reddetmek, yurt içinde bir güç gösterisi olarak görülecek ve Hükûmetimize desteği artıracaktır, ancak [USA.GetNameDef] ile savaş riskine değer mi?\n\n"
 panay_incident.3.d:0 "Bu haftanın başında USS Panay'ı batırmamıza yanıt olarak [USA.GetNameDef] özür dilemeyi, olaya karışan memurların cezalandırılmasını ve tazminat talep etti. Saldırının emri Hükümetimiz tarafından verilmemiş olsa da, bunun aşırı hevesli pilotların bir hatası mı, yoksa katı askeri görüşlülerin [USA.GetNameDef] ve [ENG.GetName]'yi güçlerini [CHI.GetName]'den çekmeye teşvik etme girişimi mi olduğu tamamen açık değil. Hükümetteki bazı kişiler [USA.GetAdjective] şartlarını kabul etmemizden hoşlanmayacak, ancak reddetmek savaş anlamına gelebilir."
 panay_incident.3.t:0 "[USA.GetName] özür ve tazminat talep ediyor"
 panay_incident.4.a:0 "Neyse ki [JAP.GetName] aklını başına topladı"
 panay_incident.4.d:0 "[JAP.GetAdjective] büyükelçisinden, USS Panay'ın batırılması konusundaki tazminat talebimizi kabul eden bir yanıt aldık. [USA.GetNameDef]'deki kamuoyunun [JAP.GetName]'e yönelik tutumları bir süre daha bu olaylardan etkilenecek olsa da, savaş\nönlenmiştir."
 panay_incident.4.t:0 "[JAP.GetName] tazminat sağlamayı kabul ediyor"
 panay_incident.5.a:0 "Savaş, USS Panay'ı geri getirmeyecek"
 panay_incident.5.b:0 "[JAP.GetName]'e bedelini ödeteceğiz!"
 panay_incident.5.d:0 "[JAP.GetAdjective]'in USS Panay'ın batırılması için özrünün sadece lafta kaldığı açık, çünkü tazminat talebimizi açıkça reddettiler. Bu bizi zor bir durumda bırakıyor, çünkü ülke popüler olmayan bir savaşa hazır değil, ancak geri adım atmak bizi siyasi olarak incitecek ve halkın müdahale karşıtı duruşunu pekiştirecektir. Ancak, savaştan geri adım atmak, seçmenlere Hükûmetin yabancı anlaşmazlıklardan kaçınma konusunda söylediklerini kastettiğine dair güvence verecektir."
 panay_incident.5.t:0 "[JAP.GetName] tazminatı reddediyor"
 panay_incident.6.a:0 "Onların zayıflığı bizim gücümüzdür"
 panay_incident.6.d:0 "USS Panay'ın kaybı, [USA.GetNameDef]'de savaş korkularını artırdı. Açıkça bir çatışma iştahı olmayan [USA.GetAdjective] politikacıları, Çin'deki kalan tüm [USA.GetAdjective] gambotlarının ve personelinin geri çekilmesi için başarıyla lobi yaptı."
 panay_incident.6.t:0 "[USA.GetName] Çin'den çekiliyor"
 trotsky_exile_mexico:0 "Troçki §Y[MEX.GetName]§! ülkesinde sürgünde"
 us_pilot_training_tt:0 "Savaş patlak verdiğinde 25 avcı uçağından oluşan küçük bir filo transfer edilecek."
 ven_claims_abc_islands:0 "§YVenezüella§!, §YCuraçao§!'yu 'korumayı' teklif etti.\n"
