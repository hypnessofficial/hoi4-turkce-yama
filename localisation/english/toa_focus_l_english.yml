 form_country_south_america_required_states_tt:0 "§Y[ROOT.GetName]§!, §YGüney Amerika§!'daki tüm §YAnakara Eyaletlerini§! kontrol ediyor!"
 idea_PAR_emergency_powers:0 "Ülke olağanüstü hal yetkileri altında"
 idea_PAR_emergency_powers_desc:0 "Ülke, hükümetinin muhalefete baskı yapmasına ve daha büyük dış siyasi güç kullanmasına olanak tanıyan bir olağanüstü hal yasası altındadır."
 left_wing_tt:0 "Bir §YSolcu§! Başkan iktidara gelir"
