l_english:
 ARG_a_call_to_reform:0 "Bir Reform Çağrısı"
 ARG_a_call_to_reform_desc:0 "Son on yıldır [ARG.GetNameDef]'deki siyasetin bir karmaşa olduğu açıktır. Tam demokrasi Hipólito Yrigoyen ile öldü ve [ARG.GetAdjective] hükümeti içinde kaos ve yolsuzluktan başka bir şey getirmedi. Ülkemizi doğru yola geri döndürmek için hızlı ve gerekli bir reforma yönelme zamanı geldi."
 ARG_a_new_trading_partner:0 "Roca-Runciman Antlaşmasını Gözden Geçir"
 ARG_a_new_trading_partner_desc:0 "Roca-Runciman antlaşması, 1933'ten beri yürürlükte olup [ENG.GetName] ile olan sığır eti ihracatımızı güvence altına almaktadır. Ancak, dünya genelindeki son gelişmelerle birlikte, bu antlaşmayı yırtıp yeni bulduğumuz müttefiklerimizle daha faydalı bir antlaşma kurmak akıllıca olur."
 ARG_a_red_south_america:0 "Ocaso Escarlata"
 ARG_a_red_south_america_desc:0 "Nihayet, Güney Amerika'yı aynı komünist bayrak altında birleştirmeyi başardık. Kızıl dalga kıtanın üzerinden geçerken, ezilen işçi sınıfları nihayet rehberliğimiz altında daha kendi kendine yeterli bir varoluş yaşamakta özgür olabilirler. Ancak, neden burada duralım? Ocaso Escarlata Operasyonunu uygulama ve küresel devrime karşı çıkan herkese son bir kızıl gün batımı getirme zamanı geldi."
 ARG_a_true_democracy:0 "Gerçek bir Demokrasi"
 ARG_a_true_democracy_desc:0 "[ARG.GetNameDefCap] 1861 yılından beri bir demokrasi olarak kabul edilmektedir, ancak son zamanlarda siyasi sistemimizin durumu özgür, demokratik bir cumhuriyet kavramına utanç getirmiştir. Artık nihayet gerçek bir demokrasi olarak ilerleyebiliriz. İstikrarı ve [ARG.GetAdjective] ekonomisinin iyileştirilmesini değer veren bir demokrasi."
 ARG_accept_german_advisors:0 "Alman Danışmanları Kabul Et"
 ARG_accept_german_advisors_desc:0 "[GER.GetName] ile her zaman yakın bağlar sürdürdük ve hedeflerimizi daha da geliştirmemize yardımcı olmak için birçok parlak zihinlerini [ARG.GetName]'e davet etmekten kesinlikle fayda sağlayabiliriz."
 ARG_agricultural_improvements:0 "Tarımsal İyileştirmeler"
 ARG_agricultural_improvements_desc:0 "Çiftçilik, uzun yıllardır [ARG.GetName]'nin gelişimi için ayrılmaz bir parça olmuştur ve birçok insan geçimini sağlamak için bu yaşam tarzına güvenmektedir. Kırsal topluluklarımızdaki bazı tarım altyapısını iyileştirmek için bu harika bir fırsattır."
 ARG_align_with_the_monroe_doctrine:0 "Monroe Doktrini ile Hizalan"
 ARG_align_with_the_monroe_doctrine_desc:0 "Uzun yıllardır Monroe Doktrini, Batı Yarımküresi'nde Avrupa müdahalesini önlemek için bir politika olarak duruyor. Şimdi Avrupa güçleriyle ittifak kurmuş olsak da, bu doktrinle tam olarak hizalanmalı ve Amerika'da istilayı önlemeliyiz."
 ARG_align_with_the_soviets:0 "Sovyetlerle Hizalan"
 ARG_align_with_the_soviets_desc:0 "Devrim büyük bir başarıyla sonuçlandığına göre, [ARG.GetNameDef]'in geleceğini nasıl şekillendirmek istediğimize karar verme zamanı geldi. Yoldaş Rodolfo Ghioldi, dönüşünde devrime öncülük eden adamdı ve bu yüzden [ARG.GetNameDef]'i yönetmek için iyi bir adaydır. Ghioldi, [SOU.GetNameDef] ile daha yakın bağlar kurmayı planlıyor ve yeni sosyalist devletimizin onları taklit ederek bir güç merkezi haline geleceğine inanıyor."
 ARG_alvears_democracy:0 "Alvear'ın Demokrasisi"
 ARG_alvears_democracy_desc:0 "Birçok kişi [ARG.GetLeader]'i sert politikaları olan sert bir adam olarak görüyor, ancak zaman geçtikçe, gerçekten [ARG.GetNameDef]'in en iyi çıkarlarını gözettiği anlaşıldı. Gerçekten de Hipólito Yrigoyen'in mirasını sürdürebildi ve Arjantin Demokrasisinin Babası olarak görülmelidir."
 ARG_american_allyship:0 "Amerikan Müttefikliği"
 ARG_american_allyship_desc:0 "En güçlü müttefiklerimizden biri şimdi kuzeydeki uyanmış devdir. Pan-Amerikan birliği ruhu içinde, [USA.GetAdjective] hükümetiyle daha yakın bağlar geliştirmek için Washington D.C.'ye bir [ARG.GetAdjective] elçisi göndermeliyiz."
 ARG_american_defense_investments:0 "Amerikan Savunma Yatırımları"
 ARG_american_defense_investments_desc:0 "İyi eğitimli birliklerle güçlü bir orduya sahip olmak iyi olsa da, sağlam bir savunmanın güçlü bir saldırı kadar iyi olduğu sık sık belirtilir. [USA.GetNameDef] ile olan bağlantımız, en savunmasız bölgelerimizdeki savunma yeteneklerimizi, özellikle de havadan gelen saldırılara karşı koymamıza yardımcı olacak şekilde iyileştirmemize yol açtı. Ormanlar ve dağlar bizi karada koruyor ve bu taretler gökyüzümüzü savunacak."
 ARG_anti_american_propaganda:0 "Anti-Amerikan Propagandası"
 ARG_anti_american_propaganda_desc:0 "[USA.GetNameDefCap], Amerika'da bir demokrasi kalesidir ve doğal olarak, uğruna çalıştığımız her şeye karşıdır. Eğer onlarla başa çıkmayı umuyorsak, o zaman halkımızı davanın arkasında toplamalıyız. Bunu yapmak için, ülke genelinde Anti-Amerikan duygusunu körükleyebiliriz. Arkamızdaki bu savaşçı ruhla, kuzeydeki deve karşı bir saldırıyı haklı çıkarabileceğiz."
 ARG_anti_corruption_policies:0 "Yolsuzlukla Mücadele Politikaları"
 ARG_anti_corruption_policies_desc:0 "Son on yıldır ülkemizi lekeleyen siyasi yolsuzluğun hükümet seçimlerimize asla geri dönmemesini sağlamalıyız. Ulusumuzun hükümeti içindeki rüşvet, zimmete para geçirme ve adam kayırma kültürünü ortadan kaldırmaya odaklanan yeni politikalar uygulayarak."
 ARG_argentina_first:0 "Önce Arjantin"
 ARG_argentina_first_desc:0 "Dikkatli bir değerlendirme sonucunda, [ARG.GetNameDef]'in geleceği için en iyi hareket tarzının Avrupa'daki artan çatışmanın dışında kalmak ve bunun yerine [ARG.GetNameDef]'in büyüme ve istikrar ihtiyacına odaklanmak olduğuna karar verdik. Kendi ittifakımızı kuralım ve dünyaya karşı kendi başımıza duralım."
 ARG_argentina_for_all:0 "Herkes için Arjantin"
 ARG_argentina_for_all_desc:0 "Eski bir sömürge olarak, [ARG.GetNameDef] dünyanın dört bir yanından birçok farklı insana ev sahipliği yapıyor. Ulusumuz için gelecek vizyonumuzda, sınırları içinde yaşayan herkesin kendilerine [ARG.GetAdjective] diyebilmesini ve bu ülkeyi evi olarak adlandırmaktan gurur duymasını istiyoruz. [ARG.GetNameDef]'in burada yaşamayı seçen herkes için olduğundan emin olmak için çalışmalıyız."
 ARG_argentine_island_sovereignty:0 "Arjantin Ada Egemenliği"
 ARG_argentine_island_sovereignty.tt:0 "Eğer şu anda ([ENG.GetFlag]§Y[ENG.GetNameDefCap]§!) ile savaşta değilsek, onlara karşı bir §YFethet§! savaş hedefi kazanacağız."
 ARG_argentine_island_sovereignty_desc:0 "Güney Atlantik Adaları, açıkça [ARG.GetNameDef]'in etki alanı içinde olmasına rağmen çok uzun süredir İngiltere tarafından tutuluyor. Ayağa kalkmalı ve haklı olarak bizim olanı talep etmeliyiz, bu [ENG.GetNameDef]'e savaş ilan etmek anlamına gelse bile. Bu adalar ne pahasına olursa olsun [ARG.GetAdjective] olacak!"
 ARG_argentine_nationalism:0 "Arjantin Milliyetçiliği"
 ARG_argentine_nationalism_desc:0 "Fatihlerin ruhu damarlarımızda dolaşıyor ve Amerika'yı fethetme isimlerini sürdürmek akıllıca olur. Ülkeleri için savaşmak ve ölmek isteyenleri toplayalım ve sanayilerimizi silah ve makine seri üretimine hazırlayalım. [ARG.GetNameDefCap] savaşa hazırlanıyor!"
 ARG_argentinian_volunteers_in_spain_flag:0 "§Y[ARG.GetName]§!, §Y[SPA.GetName]§!'e gönüllüler gönderdi!"
 ARG_arma_maravillosa_bonus:0 "Arma Maravillosa"
 ARG_balancing_act:0 "Denge Oyunu"
 ARG_balancing_act_desc:0 "Askeriye şimdi hükümetin kontrolünde olduğuna göre, gözlerimizi Avrupa'da toplanan fırtınaya çevirebiliriz. Müttefik ve Mihver güçlerinin her ikisinin de [ARG.GetName] ile ilişkileri olduğu için, her iki tarafı da yabancılaştırmamaya dikkat etmeliyiz."
 ARG_banco_central_de_la_republica_argentina:0 "Banco Central de la República Argentina"
 ARG_banco_central_de_la_republica_argentina_desc:0 "1935'te altı Kongre Yasası ile kurulan Banco Central de la República Argentina, [ARG.GetName]'nin para kurulunun yerini aldı. Başkanı Ernesto Bosch, bankayı geliştirmeyi ve Büyük Buhran'dan mali olarak nihayet toparlanmaya başlamamıza yardımcı olmak için ekonomimizi canlandırmaya yardımcı olmayı hedefliyor."
 ARG_bastion_of_democracy:0 "Barış Kalesi"
 ARG_bastion_of_democracy_desc:0 "Demokratik bir ulusun ideallerini savunmada büyük adımlar attık ve tehlikeli derecede yozlaşmış seçimlerimizden bu yana uzun bir yol kat ettik. Dünya genelinde savaş demlenirken, bir barış kalesi olarak durmalı ve bu kıtanın küçük uluslarını koruma sözü vermeliyiz."
 ARG_bolstering_the_army:0 "İşe Alım Seferberliği"
 ARG_bolstering_the_army_desc:0 "Savaş kızışmaya devam ediyor ve çağrısına cevap vermeye hazır olmalıyız. [ARG.GetNameDef] genelinde, erkekler ve kadınlar, onu onlardan almak isteyenlere karşı özgürlük haklarını savaşmak ve savunmak için canlarını ortaya koymaya istekliler. Bir işe alım seferberliği açmalı ve büyük ulusumuzun halkını silahlanmaya ve evleri için savaşmaya hazırlanmaya teşvik etmeliyiz."
 ARG_british_cooperation:0 "İngiliz Ekonomisi"
 ARG_british_cooperation_desc:0 "[ENG.GetName] ile daha yakın işbirliği, özellikle son seçim sırasında ne kadar etkili oldukları göz önüne alındığında, ekonomimizi canlandırmaya yardımcı olacaktır. [ENG.GetAdjective] ile ilişkimizi geliştirmek, gelecekte daha iyi ticaret anlaşmaları anlamına gelecektir."
 ARG_british_gaurantee:0 "İngiltere ile Daha Yakın Bağlar"
 ARG_british_gaurantee_desc:0 "Tarihsel olarak İngiltere ile yakın bağlarımız oldu, ülkemize yoğun bir şekilde yatırım yaptılar. Bu bağları yeniden canlandırmayı ve bağı güçlendirmeyi düşünmeliyiz, bu bize çok faydalı olabilir!"
 ARG_capitalize_the_beef_industry:0 "Sığır Eti Endüstrisinden Faydalan"
 ARG_capitalize_the_beef_industry_desc:0 "[ARG.GetAdjective] sığır eti, özellikle [ENG.GetNameDef]'e yönelik birincil ihracat ürünlerimizden biridir. Bundan faydalanmalı, çiftçilik yeteneklerimizi genişletmeli ve lezzetli etimizin dünya çapında tanınmasını sağlamalıyız!"
 ARG_centralize_power:0 "Gücü Merkezileştir"
 ARG_centralize_power_desc:0 "Rodolfo Ghioldi, devrim sonrası yolculuğumuzda şimdiye kadar bizi iyi yönetti. Hükümetindeki birçok kişi, gücü sadece Başbakan'a merkezileştirmenin, yeni filizlenen sovyet devletimizi hem iç hem de dış tehditlerden güvende tutmaya yardımcı olacağına inanıyor. Sonuçta, bu [ARG.GetNameDef] için güvenlik ve emniyet adına."
 ARG_change_of_course:0 "Rota Değişikliği"
 ARG_chilean_ultimatum:0 "[CHL.GetAdjective] Ültimatomu"
 ARG_chilean_ultimatum.tt:0 "([CHL.GetFlag]§Y[CHL.GetNameDefCap]§!) '§Y$ARG_political_events.19.t$§!' olayını alır, bu da onların bizim §Ykuklamız§! olmasını talep edecektir. §YBize karşı Yüksek bir görüşleri§! varsa kabul etme olasılıkları daha yüksektir!"
 ARG_chilean_ultimatum_desc:0 "Çok uzun zamandır [CHL.GetNameDef] ile sınır gerilimlerimiz var ve eğer gerçekten kendimizi Güney Amerika'daki baskın güç olarak güvence altına almak istiyorsak, o zaman onları mümkün olan en kısa sürede etkisiz hale getirmeliyiz. Ya bize barışçıl bir şekilde katılırlar ya da topraklarına yürür ve bizim olanı talep ederiz."
 ARG_committee_of_state_security:0 "Devlet Güvenlik Komitesi"
 ARG_committee_of_state_security_desc:0 "Dünya gerilimleri arttıkça, ideolojimize giderek daha fazla düşman ortaya çıkmaya başlıyor. Kendimizi iktidarda tutmak için, değerlerimizi hem [ARG.GetNameDef]'de hem de uluslararası alanda uygulamak için bir istihbarat teşkilatı oluşturmaya odaklanmamız zorunludur."
 ARG_communist_civil_war_tt:0 "§Y[ROOT.GetFlag][ROOT.GetName]§!'de §RKomünistler ile mevcut hükümet arasında§! §Rbir iç savaş tetikleyecektir!§!"
 ARG_communist_faction:0 "Internacional Sudamericana"
 ARG_conquer_paraguay:0 "[PAR.GetNameDefCap]'ı Fethet"
 ARG_conquer_paraguay_desc:0 "Müzakerelere yer yok. [PAR.GetNameDef] ülkesi Güney Amerika hakimiyetimizin önünde duruyor. Bir ültimatom göndermek yerine, boğayı boynuzlarından yakalamak ve komşumuza savaş ilan etmek en iyisidir."
 ARG_conquer_south_america:0 "Kıtayı Kurtar"
 ARG_conquer_south_america_desc:0 "Güney Amerika kıtasında diğer dünya ideolojilerine yer yoktur, çünkü sosyalist devletimize bir tehdit olarak duruyorlar. Bize katılmazlarsa, o zaman halklarını olabildiğince hızlı bir şekilde kurtarmak ve onları [ARG.GetNameDef]'in koruyucu bayrağı altına getirmek için harekete geçmeliyiz."
 ARG_conquer_uruguay:0 "Bir Yer Edinme"
 ARG_conquer_uruguay_desc:0 "Yeni rejimimiz yerleşirken, küçük komşularımız konusunda nasıl ilerleyeceğimize karar vermeliyiz. [URG.GetNameDefCap] her zaman tartışmalı bir bölge olmuştur ve zorla almak, dünyanın geri kalanına küçümsenmememiz gerektiğini gösterecektir."
 ARG_consolidating_power:0 "Gücü Pekiştirme"
 ARG_consolidating_power_desc:0 "Ramón Castillo, başkanlığını önceki başkanlardan daha otoriter bir politikayla ileri sürüyor. Amacı, Ulusal Demokrat Parti aracılığıyla gücünü pekiştirmek ve Concordance'ı yavaşça dağıtmaktır. Bu, siyasi ve askeri rakipler tarafından fark edilmedi."
 ARG_corporatism:0 "Korporatizm"
 ARG_corporatism_desc:0 "Korporatizm, faşizmin temel bir fikridir ve mümkün olan en kısa sürede uygulamamız gereken bir şeydir. Ancak bunu yapmak için yerel elitlere ve yeteneklere güvenmemiz ve [ARG.GetNameDef]'in yeni faşist hiyerarşisinde ilerlemenin kapısını açmamız gerekir. Ülkemizi sadakat ve verimlilikle dolu bir geleceğe bu şekilde taşıyacağız."
 ARG_counter_intelligence_program:0 "Karşı İstihbarat Programı"
 ARG_counter_intelligence_program_desc:0 "Görünüşe göre casusluk bu savaşta önemli bir oyuncu ve kendi istihbarat programımızda çok gerideyiz. [ARG.GetName] ve diğer Güney Amerika uluslarında [GER.GetAdjective] operasyonları söylentileriyle, onlara mümkün olan en kısa sürede karşı koymaya hazırlanmalıyız."
 ARG_coup_imminent_tt:0 "§RBu odağı almak Askeri Muhalefet zamanlı görevlerini başlatacaktır.§!"
 ARG_crack_down_on_corruption:0 "Yolsuzluğa Karşı Baskı"
 ARG_crack_down_on_corruption_desc:0 "[ARG.GetAdjective] tarihindeki en hileli seçimlerden birinde seçilmesine rağmen, Ortiz hükümet içindeki yolsuzluk seviyelerine karşı tamamen baskı yapmayı planlıyor. İroni bir yana, bu sadece [ARG.GetName]'nin daha güçlü olmasına yardımcı olabilir."
 ARG_cut_ties_with_britain:0 "İngiltere ile Bağları Kopar"
 ARG_cut_ties_with_britain_desc:0 "[ENG.GetNameDef] ada ulusunun en yakın ticaret ortağımız olduğu doğru olsa da, sığır etimiz için yaptıkları antlaşma sadece kendi halkımızın ülkeleri için sağlama yeteneğini engelliyor. Halk arasında İngiliz karşıtı bir duygu körüklemeli ve dünyaya Avrupa'nın sömürgeci güçleri olmadan kendi ayaklarımız üzerinde durabileceğimizi kanıtlamalıyız."
 ARG_defense_and_democracy:0 "El Manifiesto Concordancia"
 ARG_defense_and_democracy_desc:0 "Savunma ve Demokrasi, Ortiz hükümetinin birincil hedefidir ve başkan, Concordancia'nın yönetimi altında daha demokratik bir [ARG.GetName] yeniden inşa etmeyi arzulamaktadır. Bu aynı zamanda askeri harcamalarda bir artış anlamına gelecektir, bu da [ARG.GetName]'nin kendini düzgün bir şekilde savunabilmesini sağlayacaktır."
 ARG_demand_spanish_compensation:0 "İspanya'dan Tazminat Talep Et"
 ARG_demand_spanish_compensation_desc:0 "İspanyol kardeşlerimiz haklı olarak kendilerine ait olan gücü başarıyla geri aldılar. Şimdi, belki de onlara başarılarında bizim de payımız olduğunu ve ödeme zamanının geldiğini hatırlatmalıyız!"
 ARG_demand_spanish_compensation_tt:0 "§Y[SPA.GetNameDef]§!'e bize §YEkvator Ginesi§!'ni vermelerini talep eden bir olay gönderir. §GBize karşı Yüksek§! bir görüşleri varsa kabul etme olasılıkları daha yüksektir!"
 ARG_democratic_faction:0 "Monroe İttifakı"
 ARG_develop_civilian_economy:0 "Sivil Ekonomiyi Geliştir"
 ARG_develop_civilian_economy_desc:0 "Şehirlerimize daha fazla odaklandıkça, [ARG.GetName] halkının ihtiyaç duyduğu olanakları sağlamak önemlidir. Halkımızı mutlu tutabilirsek, bu sadece bizi daha güçlü kılacaktır. Daha fazla fabrikanın derhal geliştirilmesine yatırım yapmak ileriye giden yoldur."
 ARG_develop_the_electricity_sector:0 "Elektrik Sektörünü Geliştir"
 ARG_develop_the_electricity_sector_desc:0 "Elektrik sektörümüzün iyileştirilmeye ihtiyacı var ve bu yüzden kaynaklarımızı elektrik gelişmelerimize yardımcı olacak daha ileri teknolojileri araştırmak için odaklamak akıllıca olur."
 ARG_dominate_the_south:0 "Güney'e Hükmet"
 ARG_dominate_the_south_desc:0 "Kıtada etrafımızı saran bu kadar çok düşman varken, demir bir yumrukla uzanıp ortaya çıkmadan önce potansiyel tehditleri yok etmek çok önemlidir. Onlara Güney Amerika'daki en baskın gücün kim olduğunu gösterelim."
 ARG_economic_reactivation_act:0 "Ekonomik Canlandırma Yasası"
 ARG_economic_reactivation_act_desc:0 "Ekonomik Canlandırma yasası, sivil altyapımızın gelişimine öncelik vermeye hizmet edecek ve şehirlerde yeni fabrikalar inşa etme hızımızı artıracaktır."
 ARG_economic_tax_reforms:0 "Ekonomik Vergi Reformları"
 ARG_economic_tax_reforms_desc:0 "Kırsal altyapımız çok az gelişmiş. Mevcut vergilendirme politikalarımızda bazı reformlar yaparsak, az gelişmiş tarım arazilerimizi geliştirmeye daha fazla önem verebiliriz."
 ARG_education_electronics_bonus:0 "Elektronik Eğitimi Odağı"
 ARG_education_industrial_bonus:0 "Endüstriyel Eğitim Odağı"
 ARG_education_synthetics_bonus:0 "Sentetik Eğitimi Odağı"
 ARG_eliminate_american_imperialism:0 "Amerikan Emperyalizmini Ortadan Kaldır"
 ARG_eliminate_american_imperialism_desc:0 "Kuzeydeki dev, uzun zamandır kurumsal açgözlülük ve yolsuzluğun bir kalesi olarak duruyor. Artık kendi başımıza bir süper güç haline geldiğimize göre, Washington'un kapitalist köpeklerinin bizim kaldırılması gereken bir tehdit olduğumuza karar vermesi sadece bir zaman meselesi. Bunun olmasına izin veremeyiz. Ocaso Escarlata Operasyonunu uygulama ve [USA.GetNameDef]'e son bir kızıl gün batımı getirme zamanı geldi."
 ARG_emphasis_on_public_works:0 "Kamu İşlerine Vurgu"
 ARG_emphasis_on_public_works_desc:0 "Ülkemizi Büyük Buhran'ın kalıntılarından yeniden inşa etmek için, kamu işleri projelerine daha fazla zaman ayırmamız gerekiyor. Yerel altyapımıza daha fazla para aktarırsak, bu sadece ekonomimize yardımcı olmakla kalmayacak, aynı zamanda [ARG.GetAdjective] vatandaşlarının yaşamlarını da iyileştirecektir."
 ARG_empower_the_fjc:0 "FJC'yi Güçlendir"
 ARG_empower_the_fjc_desc:0 "Federación Juvenil Comunista, PCA'nın politikalarını [ARG.GetAdjective] gençliği arasında teşvik etmek amacıyla kurulan bir gençlik ve devrimci siyasi örgüttür. Sosyalist ideolojimizi ulus genelinde güvence altına almak için, ülkemizin çocuklarını mümkün olan en erken zamanda dahil etmek akıllıca olur."
 ARG_encourage_german_investments:0 "Alman Yatırımlarını Teşvik Et"
 ARG_encourage_german_investments_desc:0 "Birçokları tarafından Avrupa'nın parya'sı olarak görülmesine rağmen, [GER.GetNameDef] bir sanayi ve askeri güç merkezi haline geldi. [ARG.GetNameDef]'de yaşayan önemli sayıda [GER.GetAdjective] insanı nedeniyle [GER.GetAdjective] halkıyla her zaman nispeten dostane olduk. Onlara ulaşmalı ve büyüyen milliyetçi hareketimize yatırım yapmaya istekli olup olmadıklarını görmeliyiz."
 ARG_encourage_italian_argentine_diplomacy:0 "İtalyan-Arjantin Diplomasisi"
 ARG_encourage_italian_argentine_diplomacy_desc:0 "[ITA.GetAdjective] faşizmi, [ARG.GetNameDef]'in birincil milliyetçi partisinin politikalarını modellediği standart model olmuştur. [ITA.capital.GetCapitalVictoryPointName]'e bir elçi göndermeli ve ülkelerimiz arasında yeni bir diplomasi kanalı açmalıyız. Bu, her iki ulusumuzun da hızlı teknolojik ilerlemeden faydalanabilmesi için bir araştırma anlaşması kurmak için harika bir fırsat olacaktır."
 ARG_encourage_the_red_scare:0 "Kızıl Korku"
 ARG_encourage_the_red_scare_desc:0 "Görünüşe göre endişelenmemiz gereken tek şey faşizm değil. [SOV.GetName]'nin artan gücü de aynı derecede acil. Komünizm, demokrasinin bir başka antitezi olarak duruyor ve yayılmasına karşı dikkatli olmalıyız."
 ARG_end_operation_bolivar:0 "Bolívar Operasyonunu Sona Erdir"
 ARG_end_operation_bolivar_desc:0 "[GER.GetName]'den ülkeye sürekli bir casusluk misyonu akışı keşfettik. Buna mizahi bir şekilde 'Bolívar Operasyonu' adını vermişler. Bu kabul edilemez ve [ARG.GetName]'deki tüm [GER.GetAdjectives] operasyonlarını derhal durdurmalıyız."
 ARG_end_the_coup_tt:0 "§GBu odağı almak Askeri Darbe Görevlerini sona erdirecektir.§!"
 ARG_envoy_to_london:0 "Londra'ya Elçi"
 ARG_envoy_to_london_desc:0 "[ENG.GetName] uzun yıllardır en yakın müttefiklerimizden biri oldu ve şimdi onlarla düşmanlarına karşı durduğumuza göre, [ENG.GetAdjective] hükümetiyle daha yakın bağlar kurmak için Londra'ya bir [ARG.GetAdjective] göndermek akıllıca olur."
 ARG_establish_the_free_association:0 "Serbest Birliği Kur"
 ARG_establish_the_free_association_desc:0 "Serbest Birlik, bireyler arasında devlet, sosyal sınıf, hiyerarşi veya üretim araçlarının özel mülkiyetinin olmadığı bir ilişkidir. Anarko-sendikalistlerin uzun vadeli hedefidir ve artık bu sınırları yıkıp herkesin bireysel ihtiyaçlarını karşılamakta özgür olduğu bir toplum yaratma zamanı geldi."
 ARG_expand_aluminum_extraction:0 "Alüminyum Çıkarımını Genişlet"
 ARG_expand_aluminum_extraction_desc:0 "Alüminyum, araç kuvvetlerimizin gelişimi için önemli bir kaynaktır. Madencilik operasyonlarımızı geliştirmeli ve bu kullanışlı metalin çıkarım oranlarını artırmalıyız."
 ARG_expand_steel_extraction:0 "Çelik Çıkarımını Genişlet"
 ARG_expand_steel_extraction_desc:0 "Madencilik, Gümüş diyarı olarak tasarlandığından beri [ARG.GetName] için önemli bir sanayi olmuştur. Ancak, dikkatimiz daha çok dağlık bölgelerimizdeki çelik çıkarımını genişletmeye odaklanmıştır."
 ARG_extinguish_south_american_communism:0 "Güney Amerika Komünizmini Söndür"
 ARG_extinguish_south_american_communism_desc:0 "Kızıl Tehdit sadece çocukları korkutmak için uydurulmuş bir öcü değil. Komünizm Güney Amerika'ya yayıldı ve [ARG.GetName]'e hızla yaklaşıyor. Demokrasi ve özgürlük adına, bu kızıl canlanmayı kıta geneline yayılmadan önce bastırmak için seferber olmalıyız."
 ARG_extinguish_south_american_fascism:0 "Güney Amerika Faşizmini Söndür"
 ARG_extinguish_south_american_fascism_desc:0 "Faşizmin dünya üzerinde bıraktığı leke Güney Amerika'ya yayıldı. Buna seyirci kalamayız. Otoriter diktatörlük lehine demokrasiyi reddeden ülkelerle başa çıkmak ve bu kıta geneline yayılmadan önce ayağa kalkmalıyız."
 ARG_fascist_researchers:0 "Faşist Araştırmacılar"
 ARG_fascist_researchers_desc:0 "Ülkemiz yavaş yavaş faşizm yoluna yaklaştıkça, ulusal araştırmamızın genişlemesine yatırım yapmak akıllıca olur. Sonuçta, [ARG.GetNameDef]'de düzen ve sadakat kurmak sadece bir başlangıç. Eğer her şey plana göre giderse, şu anda sahip olduğumuzdan çok daha güçlü askeri teknolojiye ihtiyacımız olabilir."
 ARG_firmes_volamos:0 "Firmes Volamos"
 ARG_firmes_volamos_desc:0 "[ARG.GetName]'de yaşayan [ENG.GetAdjective] topluluğu, Kraliyet Hava Kuvvetleri'ne bir bağış filosu için ödeme yapmayı teklif etti. Bu filoyu [ENG.GetName]'e göndererek, RAF ile daha yakından işbirliği yapabilir ve kendi hava yeteneklerimizi ilerletebiliriz."
 ARG_forge_our_own_future:0 "Kendi Geleceğimizi Şekillendir"
 ARG_forge_our_own_future_desc:0 "Devrim büyük bir başarıyla sonuçlandığına göre, [ARG.GetNameDef]'in geleceğini nasıl şekillendirmek istediğimize karar verme zamanı geldi. Yoldaş Fanny Edelman uzun yıllardır PCA'nın sadık bir destekçisi oldu ve [ARG.GetNameDef]'de kadın hakları için mücadelede adımlar attı. Birçoğu onu ülkemizi bundan sonra yönetmeye uygun görüyor ve [ARG.GetNameDef]'i yeni bir refah çağına taşıyor."
 ARG_german_investments_bonus:0 "Alman Yatırımları"
 ARG_ghioldi_returns:0 "Rodolfo Ghioldi [ARG.GetNameDef]'e Geri Döndü"
 ARG_guardia_nacional:0 "Guardia Nacional"
 ARG_guardia_nacional_desc:0 "Concordancia'yı çökertme ve bunun yerine [ARG.GetNameDef]'i bir askeri hükümetin koruması altına alma zamanı geldi. Guardia Nacional, Arjantin Bağımsızlık Savaşı sırasında egemenliğimiz için savaştı ve şimdi, Pedro Pablo Ramírez'in liderliği altında, [ARG.GetNameDef]'i yeni bir refah çağına taşıyacak."
 ARG_guardia_nacional_tt:0 "§Y$ARG_pedro_pablo_ramirez$§!, §Y$ARG_gen_nazism_party_long$§!'nin lideri olur ve yönetici parti §YFaşizme§! geçer!"
 ARG_help_the_allies:0 "Müttefiklere Yardım Et"
 ARG_help_the_allies_desc:0 "Savaş daha da tırmanırken, [USA.GetName]'den tarafsızlığı terk edip resmen Müttefiklere katılmamız için baskı artıyor. Eğer bunu seçersek, bu küresel çatışmada resmen bir oyuncu olacağız."
 ARG_hitler_1:0 "Dördüncü Kez Şans"
 ARG_hitler_1_desc:0 "Hükümetteki yeni başkanımızla, [GER.GetNameDef]'in sahip olduğu geçmiş gücü taklit etmek için [ARG.GetNameDef]'de köklü değişiklikler yapmak için derhal bir hamle yapıldı. Señor Hilter, Güney Amerika'da Dördüncü Reich'ı kurma konusunda kararlı görünüyor. Bu sefer ne yanlış gidebilir ki?"
 ARG_hitler_2:0 "Guerra Relámpago"
 ARG_hitler_2_core_tt:0 "Tüm eski §YAlman§! eyaletleri üzerinde §YÇekirdekler§! kazan."
 ARG_hitler_2_desc:0 "'Yıldırım Savaşı' olarak da bilinen Guerra Relámpago, düşmanlarımızı alt etmek için ezici bir mekanize ateş gücü kullanabileceğimiz bir yoldur. Başkanımız, 'kaybedilen zamanı telafi ettiğini' iddia ederek hızla genişlemek istiyor. Nedense, bu planlar [GER.GetNameDef]'in eski topraklarına da uzanıyor."
 ARG_hitler_2_tt:0 "§YGüney Amerika§!'daki tüm §YFaşist Olmayan§! uluslar üzerinde §Y$annex_everything$§! savaş hedefi kazan!"
 ARG_hitler_3:0 "Arma Maravillosa"
 ARG_hitler_3_desc:0 "'Harika Silahlar' olarak da bilinen Arma Maravillosa, savaşın seyrini değiştirebilecek daha güçlü roketler ve silahlar geliştirmeye çalışacağımız bir programdır. Başkanımız, hemen harekete geçirebileceğimiz inanılmaz fikirlerle dolu bir dizi su hasarlı belgeyle bize yaklaştı."
 ARG_hitler_4:0 "Gemiyi Kurtar"
 ARG_hitler_4_desc:0 "Señor Hilter'e göre, savaş sırasında batan ilk [GER.GetAdjective] zırhlısı olan Graf Spee'nin enkazını kurtarmamız son derece önemlidir. Bu konuda soru sorulduğunda, bozuk bir İspanyolca ile 'itibar' ve 'beni sorgulama' hakkında bir şeyler mırıldandı. Her iki durumda da, Graf Spee'yi kurtaralım!"
 ARG_immigration_wave:0 "Göç Dalgası"
 ARG_immigration_wave_desc:0 "[ARG.GetName] göç üzerine kurulmuş bir ülkedir. Nüfusumuzun çoğunluğu İspanya kökenli olsa da, sınırlarımız içinde önemli sayıda Alman ve hatta Galli nüfusumuz da var. Bu ülkelerden [ARG.GetName]'e göçü teşvik ederek ekonomimizi canlandırabiliriz."
 ARG_import_substitution:0 "İthal İkamesi"
 ARG_import_substitution_desc:0 "Dünya genelinde gerilimler arttıkça, Avrupa'dan yapılan ithalat önemli ölçüde azaldı. [ENG.GetAdjective] ile yakın ticaret bağlarımız olmasına rağmen, [ARG.GetAdjective] ekonomisi artan sanayileşme ile ithalatı ikame etmeye başlamak zorunda kalacak."
 ARG_improve_patagonia:0 "Patagonya'yı İyileştir"
 ARG_improve_patagonia_desc:0 "Antonio Soto yönetimindeki anarko-sendikalistler [ARG.GetNameDef]'in kaderini kontrol altına aldıklarında, memleketleri olan Patagonya bölgesinin nihayet on yıllardır şiddetle ihtiyaç duyduğu ilgiyi almasının zorunlu olduğuna karar verdiler."
 ARG_improving_the_islands:0 "Adaları İyileştirme"
 ARG_improving_the_islands_desc:0 "Artık Falkland ve Güney Georgia adalarının mülkiyetine sahip olduğumuza göre, kontrolümüz altında kalmalarını sağlamak için askeri altyapılarını iyileştirmeye odaklanmalıyız."
 ARG_in_memory_of_yrigoyen:0 "Yrigoyen'in Anısına"
 ARG_in_memory_of_yrigoyen_desc:0 "[ARG.GetNameDefCap] daha önce bir kez böyle bir durumdan geçti. Yönetimi kusursuz olmasa da, Hipólito Yrigoyen yine de bugün hala ülkemize fayda sağlayan gerekli reformları yaptı. Birinin görevi devralması ve bizi bir kez daha o belirlenmiş demokrasi rotasına sokması gerekiyor."
 ARG_in_memory_of_yrigoyen_tt:0 "§YMarcelo T. De Alvear§!, §Y$ARG_democratic_party_long$§!'nin lideri olur ve yönetici parti §YDemokratik§!'e geçer!"
 ARG_industrial_expansion:0 "Sanayi Genişlemesi"
 ARG_industrial_expansion_bonus:0 "Sanayi Teknolojisi Takviyesi"
 ARG_industrial_expansion_desc:0 "Güçlü bir sanayi, herhangi bir ekonominin bel kemiğidir. Sanayi genişlememiz için daha fazla seçenek geliştirmek üzere araştırmalarımıza odaklanmalıyız."
 ARG_integrate_operation_bolivar:0 "Bolívar Operasyonunu Entegre Et"
 ARG_integrate_operation_bolivar_desc:0 "Bir süredir, [GER.GetNameDef] Güney Amerika genelinde birkaç casusluk misyonu yürütüyor. Sevgiyle 'Bolívar Operasyonu' olarak adlandırılan bu yönerge, [ARG.GetNameDef]'de faaliyet gösteriyor. Şimdi [GER.GetAdjective] halkıyla iyi geçindiğimize göre, programı entegre etmek ve kıta geneline yayılmasını teşvik etmek için çalışabiliriz."
 ARG_integrate_the_motherland:0 "Amerikaları Entegre Et"
 ARG_integrate_the_motherland_desc:0 "Kapitalist ve faşist çürümüşlükten kurtardığımız topraklardaki yönetici sınıflar, onları büyüyen koalisyonumuza entegre etmek için harekete geçmezsek bize karşı isyan etmeye devam edebilir."
 ARG_internal_focus:0 "İç Odaklanma"
 ARG_internal_focus_desc:0 "Büyük demokratik güçlere ulaşma seçeneği olsa da, hükümetimizdeki birçok kişi kaynaklarımızı başka yerlere yaymak yerine [ARG.GetNameDef]'e içeriden odaklanmanın akıllıca olduğuna inanıyor. Şimdilik, [ARG.GetNameDef]'in savaşın saldırısına dayanacak şeye sahip olduğundan emin olmak için ulusumuzun dünya ile ticaretini sınırlamalıyız."
 ARG_intervenciones_federales:0 "Intervenciones Federales"
 ARG_intervenciones_federales_desc:0 "Hükümetimize yönelik bir askeri darbe tehdidi güçlendikçe, Intervenciones Federales'i uygulama kararını vermeliyiz. Her eyalette bu yasayı geçirmek için zaman ayırarak, [ARG.GetName] isyanlara karşı daha hazırlıklı olabilir."
 ARG_invest_in_construction_guilds:0 "İnşaat Loncalarına Yatırım Yap"
 ARG_invest_in_construction_guilds_desc:0 "İnşaat loncaları kentsel gelişimin bel kemiğidir. Bir sonraki görevimiz, inşaat teknolojimizin dünyanın geri kalanıyla başa çıkabildiğinden emin olmak için [ARG.GetName]'nin loncalarına fon aktarmak olmalıdır."
 ARG_invest_in_the_railways:0 "Demiryollarına Yatırım Yap"
 ARG_invest_in_the_railways_desc:0 "[ENG.GetName]'den gelen bir demiryolu geliştirme geçmişiyle, demiryollarımızı modernize etme sürecine devam etmemiz mantıklı. Bu, tüm ülkeyi tek bir ağ üzerinden bağlamaya yardımcı olacak ve [ARG.GetName]'i daha birleşik bir ülke yapacaktır."
 ARG_invest_in_the_roads:0 "Yollara Yatırım Yap"
 ARG_invest_in_the_roads_desc:0 "[ARG.GetName]'deki altyapı acilen yeniden elden geçirilmeye ihtiyaç duyuyor. Yollarımızı finanse etmek için çaba gösterirsek, her ildeki yerel bağlantıya yardımcı olacaktır."
 ARG_invite_ghioldi_back_to_argentina:0 "Ghioldi'yi Arjantin'e Geri Davet Et"
 ARG_invite_ghioldi_back_to_argentina_desc:0 "Rodolfo Ghioldi, [ARG.GetNameDef]'de önde gelen bir komünistti ve ne yazık ki hükümetimizden gelen kovuşturma nedeniyle ülkeden kaçmak zorunda kaldı. [ARG.GetNameDef]'de sola karşı tutumu değiştirmeye başladığımızda, belki de Ghioldi'ye bir af teklif etme ve onu anavatanına geri davet etme zamanı gelmiştir."
 ARG_invite_ghioldi_back_tt:0 "§YRodolfo Ghioldi§!, [ARG.GetFlag]§Y[ARG.GetNameDef]§!'e geri dönecek ve bir §YDanışman§! olarak mevcut olacak. Arjantin Komünizminde önemli bir oyuncu olarak, gelecekteki herhangi bir §YDevrime§! liderlik edebilecek."
 ARG_invite_spanish_nationalists:0 "İspanyol Milliyetçilerini Davet Et"
 ARG_invite_spanish_nationalists_desc:0 "Ne yazık ki, Franco'nun darbesi geri püskürtüldü ve iç savaş resmen sona erdi. Binlerce İspanyol Milliyetçisi şimdi ideolojilerine daha uygun bir ev arayışıyla İber yarımadasını terk etmek istiyor. İki ulusumuz arasındaki tarihi bağ göz önüne alındığında, [ARG.GetNameDef]'in büyüyen milliyetçi hareketine yardımcı olmaları için onlara kapılarımızı açmalıyız."
 ARG_islas_del_atlantico_sur:0 "Islas del Atlántico Sur"
 ARG_islas_del_atlantico_sur_desc:0 "Falkland ve Güney Georgia adaları, uzun yıllardır [ENG.GetName]'nin egemen topraklarıdır. [ARG.GetName]'e çok yakın olan adalara yönelik kendi iddialarımıza rağmen, [ENG.GetAdjective] yönetimi altında kalmaya devam ediyorlar. [ENG.GetName] ile olan yeni ittifakımızla, belki de adaların kontrolünün bize devredilmesi için pazarlık yapabiliriz. Sonuçta, bu savaşta onları daha iyi koruyabileceğiz."
 ARG_join_the_allies:0 "Müttefiklere Katıl"
 ARG_join_the_allies_desc:0 "Bu çatışmada bir taraf seçme zamanı geldi. Demokrasinin kutsallığını korumak için çalışan bir ulus olarak, Müttefiklere ulaşmak ve ittifaktaki yerimizi güvence altına almak zorunludur. Dünyayı boyunduruk altına almak isteyenlere karşı dünyayı korumaya yardım etmeliyiz."
 ARG_join_the_axis:0 "Mihver'e Katıl"
 ARG_join_the_axis_desc:0 "[ARG.GetNameDef]'i güçlü ve istikrarlı bir liderlik altına alma yeteneğimiz için Mihver Güçlerine çok şey borçluyuz. Bu nedenle onlara ulaşmalı ve savaşlarına katılma talebinde bulunarak faşizmin dünya geneline yayılmasına yardımcı olmalıyız!"
 ARG_joint_military_exercises:0 "Ortak Askeri Tatbikatlar"
 ARG_joint_military_exercises_desc:0 "[USA.GetAdjective] halkına bir iyi niyet göstergesi olarak, [ARG.GetNameDef] içinde düzenlenen ortak askeri tatbikatlar için bir teklif göndermeliyiz. Birlikte çalışarak, donanmamızın ve hava kuvvetlerimizin eğitim ve beceri seviyesini artırabiliriz."
 ARG_juan_peron_elected:0 "Juan Perón"
 ARG_juan_peron_elected_desc:0 "Bir siyasi kargaşa döneminin ardından, [ARG.GetNameDef]'in popüler ve sevilen bir lidere sahip olmasının zamanı geldi. Arjantin halkında bir gurur ve güvenlik duygusu uyandıran vaatlerle, Juan Perón büyük ülkemizin yeni başkanı için açık bir seçim haline geldi. Sevgili eşi Eva yanındayken, nihayet [ARG.GetNameDef]'i fırtınaya karşı güçlendirme zamanı geldi."
 ARG_legitimize_the_PCA:0 "PCA'yı Meşrulaştır"
 ARG_legitimize_the_PCA_desc:0 "Partido Comunista de la Argentina, [ARG.GetNameDef]'deki birincil komünist partidir. Kuruluşundan itibaren parti, Sovyetler Birliği Komünist Partisi ile bir uyum içinde oldu ve bu da genellikle [ARG.GetNameDef]'in solunun geri kalanıyla sürtüşmeye neden oldu. Ancak, şimdi Rezil On Yılı sona erdirmek için köklü bir değişikliğe ihtiyacımız olduğuna göre, belki de bu partiyi [ARG.GetAdjective] hükümetinde meşrulaştırma zamanı gelmiştir."
 ARG_liberation_theology:0 "Kurtuluş Teolojisi"
 ARG_liberation_theology_desc:0 "[ARG.GetNameDef]'deki uzun Katoliklik tarihi ve vatandaşları için hayattaki önemi göz önüne alındığında, birçok rahip [ARG.GetNameDef] içindeki ideolojik kaymaya bir tepki olarak Kurtuluş Teolojisi olarak bilinen yeni bir Hristiyanlık biçimini benimsemeye başladı. Kurtuluş Teolojisi'nin fikirleri devrimci hareketimizle aynı hizada olduğu göz önüne alındığında, kilisenin bu mezhebini devlet dinimiz olarak benimsememiz akıllıca olur."
 ARG_ligas_patrioticas_tt:0 "Ligas Patrióticas tümen şablonunun kilidini açar ve §Y[ROOT.capital.GetCapitalVictoryPointName]§!'de §Ybeş§! birim toplar!"
 ARG_maintain_neutrality:0 "Müttefikleri Reddet"
 ARG_maintain_neutrality_desc:0 "Müttefik güçlerin baskısına rağmen, onların savaşına karışmak bizim çıkarımıza değil. Avrupa'daki bir çatışma hakkında endişelenmeden kendi kıtamızda odaklanacak yeterince şeyimiz var. Eğer bu [USA.GetName]'den bir ambargo riski taşıyorsa, varsın olsun."
 ARG_maintain_the_status_quo:0 "Statükoyu Koru"
 ARG_maintain_the_status_quo_desc:0 "Yavaş ve emin adımlarla. İktidara geldikten hemen sonra gemiyi çok fazla sallamaya doğrudan gerek yok. Eğer Castillo hükümette kalmak istiyorsa, rakip hiziplerde büyüyen muhalefeti yönetmede daha dikkatli olması gerekecek."
 ARG_march_to_la_casa_rosada:0 "Casa Rosada'ya Yürüyüş"
 ARG_march_to_la_casa_rosada_desc:0 "Castillo'nun hükümeti nihayet çok ileri gitti. Askeri içindeki memnuniyetsizlik, başkanın Savaş Bakanı Pedro Pablo Ramírez'in karşıt UCR partisiyle görüşmeler yaptığı için istifasını emrettiğinde bir dönüm noktasına ulaştı. Askeri liderlik sadıklarını toplar ve La Casa Rosada'ya yürümeye hazırlanır. "
 ARG_march_to_la_casa_rosada_tt:0 "§Y$ARG_pedro_pablo_ramirez$§!, §Y$ARG_militarist_party_long$§!'nin lideri olur!"
 ARG_military_coup_happens_tt:0 "Askeriyenin yönetimi ele almasına izin vererek 'Yaklaşan Askeri Darbe Görevi'ni sona erdirecek."
 ARG_military_production_lines:0 "Askeri Üretim Hatları"
 ARG_military_production_lines_desc:0 "Dünya genelindeki artan krizle birlikte, askeri üretimimizin geleceğine yatırım yapmak akıllıca bir fikir olurdu. Askeri donanıma ayrılmış daha fazla fabrika kompleksi inşa edersek, gelecek fırtınaya mümkün olan en iyi şekilde hazırlanmış oluruz."
 ARG_more_communism_in_south_america_tt:0 "§YGüney Amerika§!'daki tüm §YKomünist Olmayan§! uluslar üzerinde §Y$annex_everything$§! savaş hedefi kazan!"
 ARG_nationalist_faction:0 "Confederación Fascista"
 ARG_no_communism_in_south_america_tt:0 "§YGüney Amerika§!'daki tüm §YKomünist§! uluslar üzerinde §Y$puppet_wargoal_focus$§! savaş hedefi kazan!"
 ARG_no_fascism_in_south_america_tt:0 "§YGüney Amerika§!'daki tüm §YFaşist§! uluslar üzerinde §Y$puppet_wargoal_focus$§! savaş hedefi kazan!"
 ARG_no_gods_no_masters:0 "Ne Tanrılar Ne Efendiler"
 ARG_no_gods_no_masters_desc:0 "Hiçbir kişi, onlara zarar vermek isteyenler tarafından kontrol edilmemelidir. Komşularımız ideolojimizi anlamasa bile, onları açgözlülükle nüfuz alanlarını genişletmek isteyen kavgacı uluslardan kurtarmayı kendimize görev edinebiliriz."
 ARG_our_own_path:0 "Kendi Yolumuz"
 ARG_our_own_path_desc:0 "Son birkaç yıldır kendimize odaklanmayı başardık, diğer ülkeleri harap eden daha büyük küresel çatışmanın dışında kaldık. [ARG.GetName] kendi başına ayakta duruyor ve yolumuzun bizi nereye götüreceğine dair kendi kararlarımızı vereceğiz. Ekonomik olarak refah ve büyümeye devam edip etmeyeceğimiz veya kendi genişleme hedeflerimizi belirleyip belirlemeyeceğimiz henüz belli değil."
 ARG_paraguayan_ultimatum:0 "[PAR.GetAdjective] Ültimatomu"
 ARG_paraguayan_ultimatum.tt:0 "([PAR.GetFlag]§Y[PAR.GetNameDefCap]§!) '§Y$ARG_political_events.19.t$§!' olayını alır, bu da onların bizim §Ykuklamız§! olmasını talep edecektir. §YBize karşı Yüksek bir görüşleri§! varsa kabul etme olasılıkları daha yüksektir!"
 ARG_paraguayan_ultimatum_desc:0 "[PAR.GetNameDefCap], kıtanın geri kalanına karşı savaş hedeflerimiz için çok önemli olacak stratejik bir bölgedir. Ya bizim altımızda çalışmayı kabul ederler ya da askeri olarak bayrağımızın altına girmeye zorlanırlar. Seçim onların. Ültimatomu gönderin."
 ARG_peronism:0 "Peronizm"
 ARG_peronism_desc:0 "Perón iktidara geldikçe, Başkan'ın kendisinin fikir ve etkilerine dayanan yeni bir siyasi hareket kurma yönünde bir itki oluştu. Justicialismo olarak da bilinen Peronizm, Perón'un muhalifleri arasında tartışmalı hale geldi; bazıları onu faşizme benzetirken, diğerleri onu milliyetçilik, emekçilik ve popülizmin belirsiz bir karışımı olarak tanımlıyor."
 ARG_preparation_for_the_elections:0 "Seçim Hazırlığı"
 ARG_preparation_for_the_elections_desc:0 "Agustín Pedro Justo'nun dönemi sona eriyor ve [ARG.GetName] yeni bir başkana hazır. Resmi hükümet adayı Roberto María Ortiz olsa da, Marcelo T. de Alvear liderliğindeki muhalefet partisinin daha demokratik bir [ARG.GetName] için savaşma şansı hala var. Seçim için emsal oluşturuldu ve şimdi geriye kalan tek şey nasıl sonuçlanacağını görmek."
 ARG_preparations_for_war:0 "Savaş Hazırlıkları"
 ARG_preparations_for_war_desc:0 "Şu anda savaşa hazır olsak da, sınırlarımızdaki ikmal durumu farklı bir hikaye anlatıyor. İkmal hatlarımızı iyileştirerek, düşmanlarımızın hızlı bir yenilgisini sağlarız."
 ARG_production_initiative:0 "Üretim Girişimi"
 ARG_production_initiative_desc:0 "Üretim araçlarımız eskimiş ve yeniden donatılmaya ihtiyacı var. Askeri için gerekli bileşenlerin oluşturulmasını hızlandırmaya yardımcı olmak için üretim teknolojimizi geliştirmeye para aktarmalıyız."
 ARG_promote_urbanization:0 "Kentleşmeyi Teşvik Et"
 ARG_promote_urbanization_desc:0 "Çevremizdeki dünya sanayileşip kentleşirken, [ARG.GetNameDef] büyük ölçüde aynı kaldı. Bu bizi ekonomimizi sürdürmek için diğer uluslara bağımlı bıraktı. Bunu kabul etmek ve kentleşme için bir hamle yapmak, bu bağımlılıklara hızlı bir son vermelidir."
 ARG_rapid_militirization:0 "Hızlı Militarizasyon"
 ARG_rapid_militirization_desc:0 "Artık iktidarda sağlam bir askeri hükümetimiz olduğuna göre, genişleme hedeflerimize bakmaya başlayabiliriz. Askeri sanayi modelimizi genişletme ve silah ve asker üretimini artırma zamanı geldi. Dünya, [ARG.GetNameDef]'in gücüyle yüzleşmeye hazırlanmalı."
 ARG_rapid_urbanization:0 "Hızlı Kentleşme"
 ARG_rapid_urbanization_desc:0 "[ARG.GetName]'nin büyük bir kısmı kırsal alan olarak kalmaktadır, ancak 20. yüzyılda ileriye giden yol kentleşme eylemidir. Şehirlerimizi geliştirerek, daha fazla insanı oraya taşınmaya ikna edebiliriz, bu da yüksek sanayileşmiş merkezlerimiz için işgücünde önemli bir artış sağlayacağımız anlamına gelir."
 ARG_reach_out_to_chile:0 "[CHL.GetNameDefCap]'e Ulaş"
 ARG_reach_out_to_chile_2_tt:0 "Eğer §Ykabul ederlerse§!, o zaman §Y[954.GetName]§!'i ve §Y[953.GetName]§!'i onlara vereceğiz."
 ARG_reach_out_to_chile_desc:0 "[CHL.GetNameDefCap], diğer yakın komşularımıza kıyasla çok daha büyük ve çok daha güçlüdür. Onlara ulaşmak ve bizimle ittifak kurma fırsatı sunmak akıllıca olur. Belki de gıpta ettikleri toprakları onlara geri verirsek, kabul etme olasılıkları daha yüksek olur."
 ARG_reach_out_to_chile_tt:0 "§YBize karşı Yüksek bir görüşleri§! varsa ve ya §YFaşist§! ya da §YTarafsız§! iseler kabul etme olasılıkları daha yüksektir!"
 ARG_reach_out_to_the_great_powers:0 "Büyük Güçlere Ulaş"
 ARG_reach_out_to_the_great_powers_desc:0 "Ekonomik durumumuzun büyümesine yardımcı olmak için sahip olduğumuz seçeneklerden biri, dünyanın Büyük Güçlerine ulaşmak ve toparlanmamızı hızlandırmak için kredi almaktır. Ancak dikkatli olmalıyız, çünkü başladığımızdan daha fazla borç içinde olmak istemiyoruz."
 ARG_reach_out_to_the_soviet_union:0 "[SOV.GetNameDef]'e Ulaş"
 ARG_reach_out_to_the_soviet_union_desc:0 "Eski hükümet biçimimizden ayrılmamız ve [ARG.GetNameDef]'in geleceğini şekillendirmek için hızlı değişiklikler yapmamız gerektiği bir sır değil. Bu kanlı bir devrimle sonuçlanabileceğinden, bunu daha önce deneyimlemiş bir ulusa ulaşmalıyız. [SOV.GetNameDef]'e bağlanmak, iktidara yükselişimiz talihsiz ama gerekli şiddetle gelirse yardım sağlayabilir."
 ARG_reach_out_to_the_soviet_union_tt:0 "Bu odağı almak, §Yiç savaş§! çıktığında §YVanguardia Socialista§! tümen şablonunun kilidini açacak ve §Y[955.GetName]§!'de §Ybeş§! Vanguardia Socialista birimi toplayacak."
 ARG_reestablish_ligas_patrioticas:0 "Ligas Patrióticas'ı Yeniden Kur"
 ARG_reestablish_ligas_patrioticas_desc:0 "Ligas Patrióticas, 1920'lerde [ARG.GetNameDef]'de faaliyet gösteren aşırı sağcı bir parapolice sivil örgütüydü. O zamandan beri hepsi dağılmıştı. Belki de ülkemizdeki yaygın yolsuzluk arasında düzeni sağlamamıza yardımcı olmak için bu hareketi yeniden canlandırmanın zamanı gelmiştir."
 ARG_reform_our_industry:0 "Sanayimizi Reforme Et"
 ARG_reform_our_industry_desc:0 "Çok uzun zamandır sanayi yeniliğimiz bu dünyadaki diğer ulusların gerisinde kalıyor. [ARG.GetNameDef]'in sanayisini genişletme ve daha modern bir standarda getirme zamanı geldi. Yeni fabrikalar inşa ederek ve onları hemen işe koyarak başlayabiliriz."
 ARG_regulated_national_salaries:0 "Düzenlenmiş Ulusal Maaşlar"
 ARG_regulated_national_salaries_desc:0 "Yerli şirketlerimizin ve firmalarımızın çalışanlarına düşük ücret ödemesi konusunda endişe verici bir eğilim gördük. Bütçelerini kontrol etmekle ilgilenmiyoruz, ancak tüm vatandaşlarımızın adil bir ücret almasını sağlamakla ilgileniyoruz. Asgari ücret belirlemek kesinlikle bu durumda herkese yardımcı olacaktır."
 ARG_reinforce_the_education_system:0 "Eğitim Sistemini Güçlendir"
 ARG_reinforce_the_education_system_desc:0 "Eğitim, demokratik bir ulusun temelidir. [ARG.GetNameDef]'de yaşayan herkesin dürüst, çalışkan vatandaşlar olarak büyümek ve gelişmek için okula gitme özgürlüğü olmalıdır. Kendi teknolojik ve ekonomik ilerlemelerimizi geliştirmemize olanak tanıyacağı umuduyla, finansmanımızı belirli mesleklere odaklamak için bu fırsatı değerlendirmeliyiz."
 ARG_reinforced_alliance:0 "İşbirliğini Güçlendirme"
 ARG_reinforced_alliance.tt:0 "([ENG.GetFlag]§Y[ENG.GetNameDefCap]§!) '§Y$ARG_political_events.73.t$§!' olayını alır, bu da iki ülkemiz arasında bir §Ysaldırmazlık paktı§! ve §Ygarantili bağımsızlık§! sunacaktır. §YBize karşı Yüksek bir görüşleri§! varsa kabul etme olasılıkları daha yüksektir!"
 ARG_reinforced_alliance_desc:0 "İngiltere ile yakın ilişkimiz son derece faydalı oluyor, ancak ordularını ne kadar çok incelersek, olası bir çatışmaya bizim kadar hazır olmadığımız o kadar acı bir şekilde ortaya çıkıyor. Onlardan garantiler ve bir saldırmazlık paktı şeklinde daha açık bir destek istemeyi düşünmeliyiz."
 ARG_release_hellmuth:0 "Hellmuth'u Serbest Bırak"
 ARG_release_hellmuth_desc:0 "Osmar Hellmuth, [GER.GetAdjective] kökenli bir [ARG.GetAdjective]'dir ve eski hükümetimiz altında, [GER.GetNameDef]'deki faşist hükümetle işbirlikçi olduğu keşfedildikten sonra tutuklanmıştır. Onu derhal serbest bırakmalı ve bunun yerine kendi istihbarat teşkilatımızda çalıştırmalıyız."
 ARG_revisit_the_roca_runciman_treaty:0 "Roca-Runciman Antlaşmasını Gözden Geçir"
 ARG_revisit_the_roca_runciman_treaty_desc:0 "Roca-Runciman antlaşması, 1933'ten beri yürürlükte olup [ENG.GetName] ile olan sığır eti ihracatımızı güvence altına almaktadır. Ancak, ekonomimizin son gelişmeleriyle birlikte, [ENG.GetAdjective] ile yeni bir antlaşma müzakere etme ve kendimize daha da iyi bir ticaret anlaşması yapma zamanı gelmiş olabilir."
 ARG_revive_the_colonial_plan:0 "Sömürge Planını Canlandır"
 ARG_revive_the_colonial_plan_desc:0 "Güney Amerika'da bir yer edinme girişiminde, [GER.GetNameDef] [URG.GetNameDef]'de bir sömürge kurma planını harekete geçirdi. Ancak, plan asla gerçekleşmedi. Bu planı canlandırmayı kendimize görev edinmeli ve faşist dostlarımız adına [URG.GetNameDef]'i kukla yapmalıyız."
 ARG_roberto_maria_ortiz:0 "Roberto María Ortiz"
 ARG_roberto_maria_ortiz_desc:0 "Roberto María Ortiz seçimi açık bir çoğunlukla kazandı, bu da Concordancia koalisyonunun [ARG.GetName] yönetimini sürdürdüğü anlamına geliyor. Kabul konuşmasında, demokrasiye olan inancını teyit etmeye vurgu yaparak, özgürlüğe saygı ve Anayasa'nın [ARG.GetAdjective] halkı için tesis ettiği garantiler sözü verdi."
 ARG_roberto_maria_ortiz_tt:0 "§Y$ARG_roberto_maria_ortiz$§!, §Y$ARG_neutrality_party_long$§!'nin lideri olur!"
 ARG_royal_airforce_influence:0 "Kraliyet Hava Kuvvetleri Nüfuzu"
 ARG_royal_airforce_influence_bonus:0 "$ARG_royal_airforce_influence$"
 ARG_royal_airforce_influence_desc:0 "İngiltere ile bağlarımız artık daha yakın olduğuna göre, onların askeri girişimlerinden de bir şeyler öğrenip öğrenemeyeceğimize bakmalıyız. Kraliyet Hava Kuvvetleri geniş çapta çok iyi kabul ediliyor ve operasyonlarını incelemek muhtemelen faydalı olacaktır. Hazır başlamışken, bazı benzer uçakları edinmeyi de düşünmeliyiz. "
 ARG_royal_navy_influence:0 "Kraliyet Donanması Nüfuzu"
 ARG_royal_navy_influence_bonus:0 "$ARG_royal_navy_influence$"
 ARG_royal_navy_influence_desc:0 "İngiltere ile bağlarımız artık daha yakın olduğuna göre, onların askeri girişimlerinden de bir şeyler öğrenip öğrenemeyeceğimize bakmalıyız. Kraliyet Donanması geniş çapta çok iyi kabul ediliyor ve operasyonlarını incelemek muhtemelen faydalı olacaktır. Hazır başlamışken, onlarınkine benzer gemiler araştırmayı da düşünmeliyiz."
 ARG_russian_manufacturers:0 "[SOU.GetAdjective] Üreticileri"
 ARG_russian_manufacturers_desc:0 "Sanayi gücümüzü artırmak ve kıtadaki diğer uluslara karşı öne çıkmak için, [SOU.GetNameDef]'e ulaşmalı ve bir dizi üreticisini [ARG.GetNameDef]'e davet etmeliyiz. Sonuçta, bir ideolojiyi paylaşıyoruz, askeri teknolojimizi de paylaşmamız mantıklı."
 ARG_secure_the_borders:0 "Sınırları Güvence Altına Al"
 ARG_secure_the_borders_desc:0 "Mevcut sınırlarımızın en tehlikeli rakiplerimize karşı güvende kalmasını sağlamak akıllıca olur. [CHL.GetNameDef] ve [BRA.GetNameDef] ile olan ortak sınırlarımız boyunca bir savunma hattı kurmak ve askeri liderlerimizi kuzeyi kaplayan birçok ormanda savaşmak için eğitmek için çalışmalıyız. Koruma her şeyden önemlidir!"
 ARG_secure_the_opposition:0 "Muhalefeti Güvence Altına Al"
 ARG_secure_the_opposition_desc:0 "Belirli bir miktar muhalefet demokratik değerlerimiz için harikadır. Karşılaştığımız mevcut muhalefet oldukça güçlü, ancak asıl sorunumuz adil oynamamaları. Bu tehlikeli örneği belirlemelerine izin veremeyiz, siyasi muhalefet herkesin güvenliği için düzenlenmelidir."
 ARG_seek_american_support:0 "Amerikan Desteği Ara"
 ARG_seek_american_support_desc:0 "Dünya genelinde savaş gölgesi demlenirken, sınırlarımızı tehdit edecek herhangi bir çatışmaya karşı hazırlıklı olmalıyız. [USA.GetNameDefCap] kuzeyde uyuyan bir dev olabilir, ancak bir diğer demokratik ulus olarak, onların dış politikalarından ve sivil savunma programlarından öğrenecek çok şeyimiz var. Onlara ulaşmalı ve Kuzey Amerikalı komşularımızla bu ilişkiyi başlatmalıyız."
 ARG_social_welfare_fund:0 "Sosyal Refah Fonu"
 ARG_social_welfare_fund_desc:0 "Sosyal refah harcamaları için bütçemiz geleneksel olarak çok düşüktü. Ancak sosyal refah için artırılmış bir bütçeyle gelen olası karlara bakıldığında, belki de öyle olmaması gerektiğine inanmaya başlıyoruz. Sosyal refah harcamaları için bir fon oluşturmak değerli bir çaba olabilir."
 ARG_socialist_researchers:0 "Sosyalist Araştırmacılar"
 ARG_socialist_researchers_desc:0 "Ülkemiz sosyalist bir devlet olarak büyürken, ulusal araştırmamızın genişlemesine yatırım yapmak akıllıca olur. Sonuçta, teknolojimizi devrimleştirmek ve modernize etmek ulusumuzun büyümesi için önemlidir."
 ARG_socialist_volunteers:0 "Sosyalist Gönüllüler"
 ARG_socialist_volunteers_desc:0 "Dünya genelinde kendi devrim hayalleriyle mücadele eden birçok başka sosyalist hareket var. İhtiyaç doğarsa, bize benzer bir kızıl yolda ilerlemek isteyen bu uluslara yardım etmek için kendi gücümüzü sunmalıyız. İçimize kapanık olmak, uluslararası yoldaşlarımızın çektiği sıkıntıları görmezden gelmemiz gerektiği anlamına gelmez."
 ARG_south_american_alliance:0 "Pan-Amerikan İşbirliği"
 ARG_south_american_alliance_desc:0 "Yeni ittifakımız kurulduğuna ve Güney Amerika kıtasında barışı korumaya adandığına göre, çevremizdeki diğer demokratik uluslara ulaşmalı ve barış ve özgürlük taahhüdümüzde bize katılmalarını talep etmeliyiz. Birlikte daha güçlü dururuz ve düşme olasılığımız daha az olur."
 ARG_south_american_unity:0 "Güney Amerika Birliği"
 ARG_south_american_unity_desc:0 "Artık kıta genelinde toprak elde ettiğimize göre, sadece [ARG.GetNameDef] değil, bir bütün olarak Güney Amerika olduğumuzu simgelemek için yeni bir isim alma zamanı geldi. Bu çekişen devletleri nihayet tek bir güçlü bayrak altında birleştirmeyi başardık."
 ARG_soviet_industrial_model:0 "Sovyet Sanayi Modeli"
 ARG_soviet_industrial_model_desc:0 "Rusya'daki devrimden sonra, [SOU.GetNameDef] askeri sanayi komplekslerini modernize etmede büyük adımlar attı. Bundan ilham almalı ve onların izinden gitmeliyiz, ülkemizdeki askeri odaklı fabrikaların sayısını artırmalıyız."
 ARG_state_atheism:0 "Devlet Ateizmi"
 ARG_state_atheism_desc:0 "[ARG.GetNameDefCap] uzun zamandır bir Katolik ülkesidir ve din, vatandaşlarının birçoğu için günlük yaşamda önemli bir rol oynamıştır. Ancak, dinin sosyalist devrimde pek bir yeri olmadığı için devlet Ateizmini uygulama seçeneğimiz var. Ancak, bunun uzun zamandır dinle yaşayan kitleler arasında rahatsızlığa neden olabileceğini aklımızda tutmalıyız."
 ARG_study_the_battle_of_the_river_plate:0 "River Plate Muharebesini İncele"
 ARG_study_the_battle_of_the_river_plate_desc:0 "River Plate Muharebesi bu savaşın ilk deniz muharebesiydi ve Güney Amerika topraklarında gerçekleşti. Bu muharebeyi incelemek ve ondan kendi deniz yeteneklerimizi nasıl ilerleteceğimizi öğrenmek için elimizden gelenin en iyisini yapmalıyız."
 ARG_subdue_dissension:0 "Muhalefeti Bastır"
 ARG_subdue_dissension_desc:0 "Artık yeter. Askeri isyancılar kontrolden çıktı ve bu darbeyi yükselme şansı bulamadan kesin olarak bastırmalıyız. Kısa bir süre için askeri büyümemize bir darbe vurabilir, ama yanımızda sadık bir orduya sahip olmak buna değecektir."
 ARG_subdue_dissension_tt:0 "Bu odağı açmak için Intervenciones Federales'i en az 3 kez uygulamış olmalısınız!"
 ARG_support_radical_nationalism:0 "Radikal Milliyetçiliği Destekle"
 ARG_support_radical_nationalism_desc:0 "İspanyol İmparatorluğu'nun prangalarını çıkardığımızdan beri, [ARG.GetAdjective] kimliğini tanımlamak için çabalıyoruz. Burada geliştik ve hayatta kaldık ve bu toprağın bizim olduğunu kesin olarak kanıtladık. [ARG.GetAdjective] kimliğini güçlendirelim ve herkese Güney Amerika'nın gerçek güç merkezinin kim olduğunu hatırlatalım."
 ARG_support_the_farmers:0 "Çiftçileri Destekle"
 ARG_support_the_farmers_desc:0 "[ARG.GetNameDefCap]'in her zaman güçlü bir tarım sektörü olmuştur, özellikle sığır etimiz dünya çapında popülerdir. Önceki hükümetimizin boyunduruğu altında, bu çiftçi topluluklarının birçoğu çok az destekle bırakıldı. Değişiklik yapma ve tarım fonlarımızı iyileştirme ve kırsal [ARG.GetNameDef]'deki proleter işçileri destekleme zamanı geldi."
 ARG_support_the_spanish_coup:0 "İspanyol Darbesini Destekle"
 ARG_support_the_spanish_coup_desc:0 "İspanya'daki kardeşlerimiz şu anda ülkelerinin geleceği için kanlı bir iç savaşın içindeler. Franco'nun askeri kontrollü bir hükümet için olan fikirleri bizimkilerle büyük ölçüde örtüşüyor. Derhal yardım göndermeli ve dünyaya demokrasinin yanlışlarını göstermeliyiz."
 ARG_support_the_spanish_republicans:0 "İspanyol Cumhuriyetçilerini Destekle"
 ARG_support_the_spanish_republicans_desc:0 "İspanya'daki kardeşlerimiz, topraklarını ele geçirmeye çalışan faşist bir rejimi önlemek amacıyla yurttaşlarıyla savaştıkları kanlı bir çatışmanın içindeler. İspanya'nın faşizme düşmesi çıkarlarımızla örtüşmüyor ve Avrupa'daki en yakın kültürel bağımıza destek göstermek için elimizden gelenin en iyisini yapmalıyız."
 ARG_tech_initiative_bonus:0 "Teknoloji Girişimi"
 ARG_technical_schools:0 "Teknik Okullar"
 ARG_technical_schools_desc:0 "Teknik okullar geliştirerek, hükümet genelinde istihdam edebileceğimiz teknik danışmanların sayısını aktif olarak artırabiliriz. Bu tür bir eğitimi ilerletmek, sadece ekonomik gücümüzü artırmaya yardımcı olacaktır."
 ARG_the_american_push:0 "Amerikan Baskısı"
 ARG_the_american_push_desc:0 "Müttefikler ve Mihver arasındaki ilişkilerimizi dengeleme konusundaki kararlılığımız [USA.GetName] tarafından fark edilmedi. Ilımlı görüşlerimizden memnun olmadıklarını ve bizden Mihver ile bağları kesin olarak koparmamızı isteyebileceklerini açıkça belirttiler."
 ARG_the_argentinian_metropole:0 "Arjantin Metropolü"
 ARG_the_argentinian_metropole_desc:0 "Buenos Aires, [ARG.GetName]'de gerçek metropol yaşamının bir sembolü olarak duracak. Şehirlerimizin gelişimi, nüfusu mutlu, üretken bir yaşam sürmeye teşvik etmemize yardımcı oldu. Bunu yaparken, şimdi nüfusta bir patlama ve ülke genelinde daha yüksek bir eğitim oranı var."
 ARG_the_buenos_aires_conference:0 "Buenos Aires Konferansı"
 ARG_the_buenos_aires_conference_1_tt:0 "'§YBuenos Aires Konferansı Başlıyor§!' olayını alır, bu da bizden ya §YFanny Edelman§!'ı iktidarda tutmamızı ya da §YAntonio Soto§!'ya geçmemizi isteyecektir."
 ARG_the_buenos_aires_conference_2_tt:0 "§YFanny Edelman§! ile kalmak, §YKıtayı Birleştir§! ve §YKıtayı Kurtar§! odak dallarının kilidini açacaktır. §YAntonio Soto§!'yu seçmek, §YPatagonya'yı İyileştir§! odak dalının kilidini açacaktır."
 ARG_the_buenos_aires_conference_desc:0 "Ülkeyi istikrara kavuşturmaya başladığımıza göre, liderliğimizin önceki hükümetimizin düştüğü aynı diktatörlüğe yakın tuzağı tetiklemesine izin vermemeye dikkat etmeliyiz. Bu nedenle, [ARG.GetNameDef] için bir sonraki lideri tartışmak ve seçmek amacıyla Buenos Aires'te bir sosyalist konferans düzenlendi."
 ARG_the_castillo_cabinet:0 "Castillo Kabinesi"
 ARG_the_castillo_cabinet_desc:0 "Ne yazık ki artan hastalık nedeniyle, Başkan Ortiz istifasını sunmaya hazırlandı. Onun yerine eski Başkan Yardımcısı Ramón Castillo geçiyor. Askeri hizipler içinde gerilimler artarken, Castillo başkanlığını sağlamak için kartlarını dikkatli oynamak zorunda kalacak."
 ARG_the_castillo_cabinet_tt:0 "§Y$ARG_ramon_castillo$§!, §Y$ARG_neutrality_party_long$§!'nin lideri olur!"
 ARG_the_clean_election:0 "Temiz Seçim"
 ARG_the_clean_election_desc:0 "[ARG.GetNameDef] siyasetindeki on yıllık yolsuzluk ve sahtekarlıktan sonra, Unión Cívica Radical, Concordancia'da yaygın olan hileli oy pusulası doldurmayı ifşa etmeye odaklanan şiddetli bir kampanyanın ardından bir zafer kapmayı başardı. Şimdi partiyi ileriye kimin götüreceği konusunda tartışmalar yapılıyor."
 ARG_the_old_enemy:0 "Eski Düşman"
 ARG_the_old_enemy_desc:0 "Nihayet dikkatimizi kuzeye, en eski rakibimizin gölgesinin üzerimize düştüğü yere çevirme zamanı geldi. [BRA.GetNameDefCap] her zaman bu kıtadaki en büyük düşmanımız olarak durdu. Cisplatine Savaşı'nın ruhunu yeniden alevlendirme ve [BRA.capital.GetCapitalVictoryPointName]'e doğru bir fetih yolu açma zamanı geldi."
 ARG_the_second_argentine_republic:0 "İkinci Arjantin Cumhuriyeti"
 ARG_the_second_argentine_republic_desc:0 "Yıllarca süren yolsuzluk ve sahtekarlıktan sonra, nihayet eski devletimizin küllerinden çıktık ve batı yarımküresinde yeni bir demokrasi kalesi olarak yükseldik. Bu günden itibaren, bizi geçmişin hatalarından ayırmak için, İkinci Arjantin Cumhuriyeti olarak bilineceğiz. En unión y libertad!"
 ARG_the_second_argentine_republic_tt:0 "([ARG.GetFlag]§Y[ARG.GetNameDefCap]§!) §YGüney Amerika§!'daki tüm demokratik ülkelere §Ygarantiler§! verecek!"
 ARG_the_war_machine:0 "Savaş Makinesi"
 ARG_the_war_machine_desc:0 "Yeni rejimimiz güçlendikçe, buna uygun bir orduya sahip olmamız gerekiyor. Sadece [ARG.capital.GetCapitalVictoryPointName]'de değil, ülke genelinde daha fazla askeri sanayi tesisi kurmaya yatırım yapmamız çok önemlidir. [ARG.GetAdjective] savaş makinesi yükselsin!"
 ARG_towards_a_greater_argentina:0 "Daha Büyük bir [ARG.GetName]'e Doğru"
 ARG_towards_a_greater_argentina_desc:0 "Sanayi kapasitemizi artırma ve kamu işleri ve altyapıya fonlarımızı vurgulama konusundaki birleşik çabalarımızla, [ARG.GetName]'nin Büyük Buhran'ın küllerinden Güney Amerika kıtasında gelişmekte olan bir güç olarak gerçekten yükselmesi için bir temel oluşturduk!"
 ARG_unify_south_america:0 "Kıtayı Birleştir"
 ARG_unify_south_america_desc:0 "Güney Amerika kıtasında kendi devrimci hareketlerini gerçekleştirmiş ve komünist hükümetleri güvence altına almış bir dizi ülke var. Güçlü kalacaksak, bir araya gelmeliyiz. Bu uluslara ulaşma ve enternasyonalimize katılmalarını talep etme zamanı geldi."
 ARG_unify_the_continent_tt:0 "Bu odağı almak, §YGüney Amerika§!'daki herhangi bir §YKomünist§! ülkeye §Yİttifakımıza§! katılma teklifi gönderecektir."
 ARG_union_nacional_fascista:0 "Unión Nacional Fascista"
 ARG_union_nacional_fascista_desc:0 "Sonsuz yolsuzluk ve iç çekişmeler yoluyla, Concordancia liderliğinin işe yaramaz olduğu açıktır. [ARG.GetAdjective] siyasetinde büyük bir değişiklik zamanı geldi. Nimio de Anquín, Unión Nacional Fascista'nın lideri olarak yeterli popülerlik kazandı ve ülkeyi yönetmeye ve [ARG.GetNameDef]'e milliyetçi bir gurur duygusu getirmeye hazır."
 ARG_union_nacional_fascista_tt:0 "§YNimio de Anquín§!, §Y$ARG_fascism_party_long$§!'nin lideri olur ve yönetici parti §YFaşizme§! geçer!"
 ARG_unite_the_workers_of_argentina:0 "Arjantin İşçilerini Birleştir"
 ARG_unite_the_workers_of_argentina_desc:0 "[ARG.GetNameDef ]'i daha iyiye doğru değiştireceksek, ulusumuzun proletaryasını, acılarını sona erdirmek için radikal iyileştirmelerin gerekli olduğuna ikna etmeliyiz. Tüm mesleklerden işçileri birleştirelim ve hükümete statükonun sona ermesi gerektiğini gösterelim!"
 ARG_universidad_de_buenos_aires:0 "Universidad de Buenos Aires"
 ARG_universidad_de_buenos_aires_desc:0 "1918 Üniversite Reformlarından bu yana, Universidad de Buenos Aires ortak yönetilen, demokratik olarak seçilmiş kurumları ve otoriteleri sürdürebilmiştir. [ARG.GetName]'deki en büyük üniversite olarak, gelişimine yatırım yapmak, ülkeyi geleceğe taşıyacak yüksek eğitimli bireyler üretmeye devam edecektir."
 ARG_university_reforms:0 "Üniversite Reformları"
 ARG_university_reforms_desc:0 "Eğitim sistemimiz güçlendirildikçe, bu üniversitelerimizi de reforme etmek için harika bir fırsat olacaktır. Yüksek öğrenimi ilerletmek, üniversitelerimizin araştırma departmanlarından daha fazla yararlanmamızı sağlayacaktır."
 ARG_uraguayan_ultimatum.tt:0 "([URG.GetFlag]§Y[URG.GetNameDefCap]§!) '§Y$ARG_political_events.19.t$§!' olayını alır, bu da onların bizim §Ykuklamız§! olmasını talep edecektir. §YBize karşı Yüksek bir görüşleri§! varsa kabul etme olasılıkları daha yüksektir!"
 ARG_us_army_training:0 "A.B.D. Ordusu Eğitimi"
 ARG_us_army_training_bonus:0 "$ARG_us_army_training$"
 ARG_us_army_training_desc:0 "[USA.GetNameDefCap], kendi kuvvetlerimizi savaş olasılığına hazırlamaya başlayabilmemiz için askeri eğitim rejimlerini bize nazikçe teklif etti. Bu sadece daha deneyimli ve sertleşmiş bir ordu yaratmakla kalmayacak, aynı zamanda öğrendiklerimizi özel kuvvetler programımızı geliştirmek için de kullanabiliriz."
 ARG_us_marine_program:0 "A.B.D. Deniz Piyadeleri Eğitim Programı"
 ARG_us_marine_program_desc:0 "A.B.D. Deniz Piyadeleri seçkin birliklerdir ve [USA.GetAdjective] askeri gücünün bir sembolüdür. Onlardan öğrenecek çok şeyimiz var ve şimdi [USA.GetName] ile daha yakından çalıştığımıza göre, bunu yapma fırsatımız var."
 ARG_us_marine_program_doctrine:0 "A.B.D. Deniz Piyadeleri Eğitimi"
 ARG_viva_la_revolucion:0 "Yaşasın Devrim"
 ARG_viva_la_revolucion_desc:0 "[ARG.GetNameDef] hükümetine bir ültimatom gönderme ve ulusumuzu gerçek bir sosyalist devlete dönüştürmek için gereken değişim rüzgarlarını getirme zamanı geldi. İşler yolunda giderse, bu barışçıl bir şekilde sona erecek ve hükümet kolayca el değiştirecektir. Ancak, her zaman savaşmadan pes etmeyecekleri bir şans var."
 ARG_war_division:0 "Savaş Tümeni"
 ARG_war_division_desc:0 "Tüm savaşlar iyi bir hazırlık üzerine kuruludur. Kabinemizi kurup savaş makinemizi ürettikçe, her geçen gün genişlemeci hedeflerimize daha da yaklaşıyoruz."
 ARG_women_in_industry:0 "Sanayide Kadınlar"
 ARG_women_in_industry_desc:0 "Çok uzun zamandır kadınların evde kalıp aileye bakmaları bekleniyordu. Eğer bir kadın ülkemizin lideri olabiliyorsa, o zaman diğer sanayilerde de çalışmalarına izin vermek sadece doğrudur. Bu, işgücümüzü büyük ölçüde genişleteceği için sadece [ARG.GetNameDef]'in ekonomik geleceğine yardımcı olacaktır."
 ARG_work_with_the_nationalists:0 "Milliyetçilerle Çalış"
 ARG_work_with_the_nationalists_desc:0 "Belki de yönetime farklı bir yaklaşım benimsemenin zamanı gelmiştir. Sonuçta, yıllardır seçimleri rahatsız eden artan yolsuzluk açıkça yavaşlama belirtisi göstermiyor. Ülkedeki milliyetçi varlıklarla çalışırsak, [ARG.GetNameDef]'e düzeni yeniden sağlama konusunda daha iyi bir şansımız olabilir."
 ARG_workers_rights:0 "İşçi Hakları"
 ARG_workers_rights_desc:0 "Sosyalist devrimimizin temel ilkelerinden biri, [ARG.GetNameDef]'in proleter işçilerinin yaşam kalitesini artırmaktı. Şimdi üretim araçlarını ele geçirdiğimize göre, kötü çalışma koşullarının artık tarlalarımızı ve fabrikalarımızı rahatsız etmemesini sağlamalıyız."
 ARG_worst_timeline_flag:0 "§YSeñor Hilter§!, §Y[ARG.GetNameDef]§!'in lideridir!"
 ARG_yacimientos_petroliferos_fiscales:0 "Yacimientos Petrolíferos Fiscales"
 ARG_yacimientos_petroliferos_fiscales_desc:0 "Yacimientos Petrolíferos Fiscales, petrolün araştırılması, üretimi, rafine edilmesi ve ticarileştirilmesi ile uğraşan devlete ait bir [ARG.GetAdjective] enerji şirketidir. Petrol üretimimiz üzerinde daha iyi kontrol sahibi olmak için şirkete daha fazla para yatırmalıyız."
 ARG_yacimientos_petroliferos_fiscales_tt:0 "Kararın kilidini açar: §Yla Vaca Muerta'yı İşlet§!"
 BRA_German_tank_exchange:0 "Alman Tank Bilgi Değişimi"
 BRA_Italian_plane_exchange:0 "İtalyan Uçak Bilgi Değişimi"
 BRA_acceptance_tt:0 "Eğer kabul ederlerse: \n"
 BRA_accords_tt:0 "Eğer işbirliği yapmayı kabul ederlerse:"
 BRA_address_labor_disputes:0 "İş Uyuşmazlıklarını Ele Al"
 BRA_address_labor_disputes_desc:0 "Önceki hükümet haklı olarak komünizm tehdidinden endişe ediyordu, ancak insanların radikalizme yönelmesine neden olan temel sorunlarla başa çıkmak için çok az şey yaptı. Aynı hatayı yapmayacağız ve iş uyuşmazlıklarıyla başa çıkmada daha aktif bir rol alacağız."
 BRA_address_labor_disputes_tt_1:0 "§YEtkinlik şunlar arasında seçim yapmanızı sağlar: §!"
 BRA_address_labor_disputes_tt_2:0 "§YVeya:§!"
 BRA_align_with_moscow:0 "[SOU.Capital.GetCapitalVictoryPointName] ile Hizalan"
 BRA_align_with_moscow_desc:0 "Parti üyelerimizden birkaçı [SOU.Capital.GetCapitalVictoryPointName]'yı ziyaret etme ayrıcalığına sahip oldu. Bize döndüklerinde, [SOU.GetAdjective] tarzı bir ülke yönetiminden övgüyle bahsettiler. Kendimizi [SOU.GetNameDef]'e daha yakın bir şekilde hizalamayı düşünmeliyiz."
 BRA_allow_the_church_to_operate:0 "Sosyalist Çizgideki Teologları Kucakla"
 BRA_allow_the_church_to_operate_desc:0 "Rahipler arasında yeni bir hareket Güney Amerika'da kök salmaya başlıyor. Rahipler, halkımızın en muhtaçlarını kesin olarak yoksulluktan kurtaracak sosyalist çizgideki politikaları savunuyor. Belki de onları destekleyen sadık proletaryayı kızdırmak yerine bu radikal teologları kucaklamalıyız."
 BRA_amazonian_settlement:0 "Amazon Kolonizasyonunu Yeniden Başlat"
 BRA_amazonian_settlement_desc:0 "Amazon, sömürüye hazır kaynaklar ve topraklarla zengindir. Ekonomiyi canlandırmak ve askerlerimize savaşmak için bir teşvik yaratmak için, orduya katılanlara uygun bir hizmet süresinden sonra bu tür toprakları edinme fırsatı sunmalıyız."
 BRA_amazonian_settlement_tt:0 "Amazon eyaletlerini geliştirmek için §YAmazon'daki Askeri Yerleşimler§! kararlarının kilidini açar."
 BRA_anaue:0 "Anauê!"
 BRA_anaue_desc:0 "Hareketimiz, bir savaş çığlığı olarak Tupi halkının bir sözü olan 'Anauê'yi benimsedi. Bu söz, üyelerin kardeşliğini ve ulusumuzun korunmasına olan sarsılmaz sadakatlerini özetlemeye başladı. Anauê!"
 BRA_anaue_tt:0 "Mitingleri tamamladıktan sonra eyaletlerde İntegralist milis tümenleri toplamak için kararların kilidini açar. \n§Y$militias_officer$§! özelliğine sahip yeni bir general toplar: \n Milis Savunması §G+%5§! \n Milis Hızı §G+%5§! \n Milis Organizasyonu §G+%5§!"
 BRA_anti_democracy_in_south_america_tt:0 "§YGüney Amerika§!'daki tüm §YDemokratik ve Tarafsız§! uluslara karşı §Y$puppet_wargoal_focus$§! savaş hedefi kazan!"
 BRA_anti_imperialism:0 "İmparatorlukları Kov"
 BRA_anti_imperialism_desc:0 "Yakınımızdaki bazı uluslara henüz hak ettikleri bağımsızlık verilmedi. Hala bu topraklar üzerinde kontrol iddia eden İmparatorluklar var. Sömürgecilik ve Emperyalizm geçmişe aittir ve bunu o İmparatorluklara çok açık bir şekilde belirtmenin zamanı çoktan geldi."
 BRA_anti_imperialism_tt:0 "Güney Amerika'daki sömürgeleri kurtarmak için §YGüney Amerika Anti-Sömürgecilik§! kararlarının kilidini açar."
 BRA_attack_bolivia:0 "Amazon'u Güvence Altına Alma"
 BRA_attack_bolivia_desc:0 "Amazon yağmur ormanları özünde [BRA.GetAdjective]'dir. [BOL.GetNameDef]'in hala bir kısmını işgal etmesi artık tolere edilemez."
 BRA_attack_chile:0 "Önleyici Saldırı"
 BRA_attack_chile_desc:0 "[CHL.GetAdjective] dağlarının arkasında kaldığı sürece, batı kanadımız asla tam olarak güvende olmayacak. Bu nedenle, [CHL.GetAdjective] devletini tasfiye etmeli ve topraklarını kendi topraklarımıza entegre etmeliyiz."
 BRA_autarky:0 "Brezilya Otarkisi"
 BRA_autarky_desc:0 "Wall Street Çöküşü'nü takiben yaşanan ekonomik kargaşa tüm dünyaya yayıldı ve ekonomimizi mahvetti. Kahve tüketiminden çelik üretimine kadar her şeyde kendi kendimize yeterli olmalı ve kendimizi gelecekteki herhangi bir yabancı krizden yalıtmalıyız."
 BRA_ban_political_parties:0 "Siyasi Partileri Yasakla"
 BRA_ban_political_parties_desc:0 "Siyasi partilerin bölünme ve kargaşa araçlarından başka bir şey olmadığı kanıtlandı. Onları yasaklayarak ve ortadan kaldırarak, radikallerin bize karşı örgütlenme yeteneğini kısıtlayabiliriz."
 BRA_ban_the_communist_party:0 "Komünist Partiyi Yasakla"
 BRA_ban_the_communist_party_desc:0 "Komünist hareket, 1935 isyan girişiminin başarısızlığına rağmen, ulusun ordusunu ve iş sahiplerini korkutmaya devam ediyor. Belki de harekete baskı yaparak, ordudan kendi politikalarımız için daha fazla destek alabiliriz."
 BRA_ban_the_communist_party_dynamic_tt:0 "§Rİstikrar düşüşü, komünist partinin popülaritesine göre ölçeklenecektir!§!"
 BRA_banco_do_brasil:0 "Banco do Brasil"
 BRA_banco_do_brasil_desc:0 "Büyük buhrandan bu yana, para birimini ekonomiye arz eden ve kontrol eden bir merkez bankasının faydaları fazlasıyla açık hale geldi. Banco do Brasil uzun süredir bu şekilde hareket ediyor, ancak bu düzenlemeyi resmileştirmenin zamanı geldi."
 BRA_batalha_do_borracha:0 "Batalha da Borracha"
 BRA_batalha_do_borracha_desc:0 "[BRA.GetNameDefCap] bir zamanlar küresel kauçuk arzına hakimdi, ta ki [ENG.GetAdjective] imparatorlukları boyunca kendi devasa plantasyonlarını yaratana kadar. Tedarik hatları tehdit altında olduğundan, dünya bir kez daha onlara değerli kaynağı sağlamak için bize bakıyor. "
 BRA_berlin_accords:0 "Berlin Anlaşmalarını Kur"
 BRA_berlin_accords_desc:0 "[USA.GetNameDefCap], Amerika'daki diğer ulusların işlerine uzun süredir müdahale ediyor. Kendimizi [GER.GetNameDef] ile aynı hizaya getirerek, gelecekteki [USA.GetAdjective] müdahalesine karşı stratejik bir caydırıcılık kazanabiliriz."
 BRA_bonus_tech_slot:0 "Ulusal Teknoloji Fonu"
 BRA_bonus_tech_slot_desc:0 "Sanayimiz ve ordumuz son yıllarda büyük ölçüde genişlemiş olsa da, yabancı rakiplerimizle teknolojik eşitliği sürdürmek giderek zorlaşıyor. Buna karşı koymak için, gelişmekte olan teknolojilere yatırım yapmak üzere bir ulusal fon kuracağız."
 BRA_boost_integralist_support_tt:0 "Ulusun büyük kasaba ve şehirlerinde faşist desteği artırmak için §Yİntegralist Miting§! kararlarının kilidini açar."
 BRA_brazil_integral:0 "Brezilya İntegral"
 BRA_brazil_integral_desc:0 "Bu ana ulaşmak yıllar sürdü, ama sonunda ulus üzerindeki hakimiyetimizi sağlamlaştırdık ve çürümüş eski cumhuriyetçi yolların son kalıntılarından kurtulduk."
 BRA_cangaco_coup:0 "Cangaço Darbesi"
 BRA_cangaco_coup_desc:0 "Devrimin vaatlerine rağmen, hareketin liderliği kararsız ve bağlı kalınacak uygun doktrinler üzerine dogmatik tartışmalara saplanmış durumda. Halk arasında her zamankinden daha fazla destekle, Cangaço'nun ulusun komutasını ele almasının ve kalbindeki yolsuzluğu kesin olarak kesip atmasının zamanı geldi. "
 BRA_centralize_development:0 "Yeni bir Başkent Kur"
 BRA_centralize_development_desc:0 "Mevcut başkentimiz ülkenin uzak bölgelerine çok uzak ve bu da gücenme ve ayrılıkçılığa yol açıyor. Her iki dünyanın da en iyisine sahip olmak için, ulusun kalbinde, herkese daha erişilebilir yeni bir başkent kuracağız. "
 BRA_centralize_development_tt:0 "Yeni başkentin adı §Y'$BRA_new_capital$'§! olacak!"
 BRA_church:0 "Kiliseyle İşbirliği Yap"
 BRA_church_desc:0 "Katolik Kilisesi, kilise ve devlet ayrılığının on yıllardır kurulmasına rağmen siyasetimiz üzerinde geniş bir etkiye sahiptir. Bu, seçmenlerin çoğunluğunu oluşturan dindar katoliklerin sayısından kaynaklanmaktadır. Eğer kilisenin lütfunu kazanabilirsek, politikalarımız için kitlesel destek kazanabiliriz."
 BRA_claim_the_french_throne:0 "Fransız Tahtını Talep Et"
 BRA_claim_the_french_throne_desc:0 "Orléans-Braganza Hanedanı aracılığıyla hanedanımız, henüz gerçekleşmemiş bir Fransız tahtı talebini elinde tutmaktadır. Orléans-Braganza'dan Pedro Gastão, krallığımızı genişletmek için bundan faydalanmak istiyor. Bu, kesinlikle istismar edilmesi gereken bir durumdur!"
 BRA_coffee_crisis_aftermath:0 "Kahve Krizinin Ardından"
 BRA_coffee_crisis_aftermath_desc:0 "Büyük Buhran, öncelikle kahve olmak üzere ihracata aşırı bağımlılık nedeniyle Brezilya ekonomisini mahvetti. Ekonomiyi onarmak için çabalar sarf edilmiş olsa da, işi bitirmek bize düşüyor. Sanayilerimizi yeniden canlandıracak ve kıtanın ekonomik güç merkezi olacağız."
 BRA_cohen_plan:0 "Cohen Planı"
 BRA_cohen_plan_desc:0 "Ufukta seçimler varken ve seçmenler arasındaki desteğimiz azalırken, rejimimizin devamlılığını başka yollarla sağlamalıyız. Başka bir komünist darbe için planlar uydurarak, ulusal güvenlik adına seçimleri askıya alırken kendimize olan desteği yeniden canlandırabiliriz."
 BRA_cohen_plan_tt:0 "Bu odağı tamamladıktan sonra 100 gün içinde tamamlanması gereken §Y$BRA_execute_the_cohen_plan$§! görevinin kilidini açar. Görevi tamamlamak, §Y$BRA_estado_novo$§! veya §Y$BRA_estado_moderno$§! odağını tamamlamayı gerektirir. §RGörevi tamamlayamamak darbeyle sonuçlanacaktır!§!"
 BRA_collective_bargaining:0 "Toplu Pazarlık"
 BRA_collective_bargaining_desc:0 ""
 BRA_collectivization_of_agriculture:0 "Tarımın Kolektifleştirilmesi"
 BRA_collectivization_of_agriculture_desc:0 "Tarım sanayimiz oldukça parçalı ve olabildiğince verimli çalışmıyor. Sanayiyi kolektifleştirerek ve ihtiyaç duyulan reformları ele almaları için bir kolektif olarak işçilere devrederek bu sorunu ve daha birçok sorunu çözebiliriz."
 BRA_collectivization_of_transport:0 "Ulaşımın Kolektifleştirilmesi"
 BRA_collectivization_of_transport_desc:0 "Ulaşım sistemimiz daha iyi günler gördü ve ihtiyaçlarımız için daha verimli bir şekilde kullanmamızı sağlayacak şekilde yeniden düzenlenmeye şiddetle ihtiyaç duyuyor. Ulaşım sistemini kolektifleştirmek, işçilere bu çok ihtiyaç duyulan reformları en iyi gördükleri şekilde sunma gücü verecektir."
 BRA_combat_separatism:0 "Ayrılıkçılıkla Mücadele Et"
 BRA_combat_separatism_desc:0 "Ulus ne zaman siyasi kargaşa ile karşı karşıya kalsa, başkentin dışındaki şikayetleri olan insanlar [ROOT.GetNonIdeologyName]'i parçalamakla tehdit eden ayrılıkçı gündemler peşinde koşmaya başlar. Ulus genelinde ortak bir [ROOT.GetAdjective] kimliğini teşvik etmek için daha fazlasını yapmalıyız."
 BRA_companhia_siderurgica_nacional:0 "Companhia Siderúrgica Nacional"
 BRA_companhia_siderurgica_nacional_desc:0 "Çelik, birçok sanayide önemli bir kaynak haline geldi, ancak yurtiçi üretimimiz talebi karşılamak için yetersiz. Bu nedenle, onu yurtdışından ithal etmek yerine, son teknoloji makinelere sahip devlete ait bir ulusal çelik şirketi kuracağız."
 BRA_consolidation_of_labor_laws:0 "İş Kanunlarını Birleştir"
 BRA_consolidation_of_labor_laws_desc:0 "İş kanunlarımız işçiler için çok az koruma sunuyor, bu da kaçınılmaz olarak iş sahipleriyle anlaşmazlıklara ve nihayetinde grevlere yol açıyor. Böylesine tehlikeli bir zamanda, bu tür grevlere veya Bolşevik sızması riskine katlanamayız. Bu nedenle kanunlarımızı birleştirecek ve işçilerle kapitalistler arasında bir denge bulacağız."
 BRA_consolidation_of_labor_laws_fallback_tt:0 "Önceki odak seçimlerine bağlı olarak, §Y$BRA_estado_novo_modifier$§! veya §Y$BRA_estado_moderno_modifier$§! ulusal ruhlarını şu şekilde değiştirecektir:"
 BRA_constitutional_monarchy:0 "Anayasal Monarşi Uzlaşması"
 BRA_constitutional_monarchy_desc:0 "İmparatorluk restorasyon hareketi ivme kazandıkça ve mevcut rejime olan destek azaldıkça, ulusu istikrara kavuşturmak için bir uzlaşma çözümü çağrıları artıyor. En belirgin öneri, siyasi gücü Ulusal Kongre'de tutarken, bir göstermelik anayasal monarşi kurmaktır."
 BRA_constitutional_monarchy_tt:0 "§Y$BRA_petropolis_line$§! ve §Y$BRA_vassouras_line$§! arasındaki önceki seçime bağlı olarak, aşağıdaki ulusal ruhlardan biri etkinleştirilecektir:"
 BRA_constitutional_monarchy_tt_2:0 "§YVeya§!"
 BRA_continue_centralization:0 "Merkezileşmeyi Teşvik Et"
 BRA_continue_centralization_desc:0 "[ROOT.GetNameDefCap], geniş bir toprağa yayılmış birçok kültürden oluşan bir ulustur. Ulusun çeşitli eyaletlerini birleştirmek için daha fazlasını yapmazsak, parçalanma veya hatta komşularımızdan askeri saldırı riskiyle karşı karşıya kalırız. Sadece güçlü bir merkezi hükümet aracılığıyla halkımızı ve demokrasimizi korumayı umabiliriz."
 BRA_cooperation_in_the_americas:0 "İyi Komşuluk Politikası"
 BRA_cooperation_in_the_americas_desc:0 "Franklin Roosevelt’in ‘iyi komşuluk politikası’ Batı yarımküresinde etkili olmaya devam ediyor. Bu politikayı benimsemeli ve birbirimizin işlerine karışmak yerine Amerika kıtası uluslarıyla işbirliği yapmaya çalışmalıyız."
 BRA_corporatism:0 "Korporatizmi Kucakla"
 BRA_corporatism_desc:0 "İşçi ve kapitalistler arasındaki anlaşmazlıklar, [BRA.GetAdjective] ekonomisini çok uzun süredir baltaladı. Bununla mücadele etmek için, son yıllarda daha başarılı Avrupa uluslarının birçoğunda görülen korporatist politikalara dayalı yeni bir ekonomik model başlatacağız."
 BRA_court_the_military:0 "Askeri Kuruluşa Ulaş"
 BRA_court_the_military_desc:0 "Askeri kuruluşu hoşnutsuz eden veya zayıflatan bir politika izlemek çok idealistçedir. Tek umudumuz ortak bir zemin bulmak ve ulusun daha büyük iyiliği için onlarla işbirliği yapmaktır. Başarısız olursak, sahip olduğumuz haklar bir kez daha sönecektir."
 BRA_create_faction:0 "Latin Amerika Sosyalist Kooperatifi"
 BRA_create_faction_desc:0 "Komünist toplumun nasıl olması gerektiği konusunda bizimle aynı fikirleri paylaşan birçok kişi var. Davamız için bir duruş sergileyebilmemiz için bu uluslarla işbirliği yapmaya açılma zamanı geldi!"
 BRA_create_kgbrazil_with_agents:0 "EICI'yi Kur"
 BRA_create_kgbrazil_with_agents_desc:0 "Düşmanlarımız hakkındaki istihbarat ve bilgiler, gerektiğinde ülkemizi ve çıkarlarımızı savunma yeteneklerimizin kritik bir bileşenidir. Güçlü bir teşkilat kurmak zaman alabilir, ancak bu çabada bize yardımcı olacak yabancı ideolojik olarak uyumlu teşkilatların desteğine sahibiz."
 BRA_deal_with_the_cangaceiro:0 "Cangaço ile Başa Çık"
 BRA_deal_with_the_cangaceiro_desc:0 "Cangaço, çok uzun süredir başımıza bela olan haydutlardan başka bir şey değil. Kuzeydeki dikeni kesin olarak çıkarma zamanı geldi."
 BRA_deal_with_the_cangaceiro_tt:0 "Etkilenen eyaletlerde Cangaço'yu ortadan kaldırmak için §Y$BRA_deal_with_the_cangaceiro$§! kararlarının kilidini aç."
 BRA_decree_no_37:0 "37 Sayılı Kararname"
 BRA_decree_no_37_desc:0 "Önceki rejim, bazı eyaletlerin ulusal siyaset üzerinde orantısız bir etkiye sahip olması nedeniyle yolsuzluk ve iç çekişmelerle doluydu. Bu nedenle, herhangi bir bölgeselcilik ifadesine karşı sert önlemler almalı ve gücü ulusal hükümette merkezileştirmeliyiz."
 BRA_defense_of_the_fatherland:0 "Anavatanın Savunması"
 BRA_defense_of_the_fatherland_desc:0 "Hırslarımız mevcut sınırlarımızın çok ötesine uzanıyor, ancak durum böyle olsa bile, kimsenin ana topraklarımızı tehdit edemeyeceğinden kesinlikle emin olmalıyız. Yaşasın Brezilya!"
 BRA_defense_spending:0 "Savunma Harcamalarını Artır"
 BRA_defense_spending_desc:0 "Dünya ateşe verildi ve artık hiçbir ülke kendini güvende sayamaz. Bu nedenle, ulusun savunmasına yaptığımız harcamaları artırmalıyız. İster silahlarımızı üreten fabrikalarda olsun, ister yeni tahkimatların inşasında olsun, Brezilya egemenliğini son işimiz olsa bile güvence altına alacağız!"
 BRA_demand_portugese_submission:0 "Tam Portekiz Teslimiyetini Talep Et"
 BRA_demand_portugese_submission_desc:0 "[POR.GetNonIdeologyName] toprakları gayri meşru güçler tarafından yönetilmektedir, çünkü sadece İmparatorumuzun onlar üzerinde hükmetme tanrı vergisi hakkı vardır. Tüm topraklarının bize teslim edilmesini talep edeceğiz, ya da gerekirse zorla alacağız."
 BRA_demand_portugese_territory:0 "Portekiz Kolonilerini Talep Et"
 BRA_demand_portugese_territory_desc:0 "Modern [POR.GetNonIdeologyName] ulusu, bir zamanların büyük bir imparatorluğunun sadece bir kabuğudur. Dünya başka yerlerde kaosla meşgulken, savaş gemisi diplomasisine girmeli ve [POR.GetAdjective] hükümetini denizaşırı topraklarını bize devretmeye ikna etmeliyiz."
 BRA_democratic_socialism:0 "Demokratik Sosyalizm"
 BRA_democratic_socialism_desc:0 "1935'in başarısız Intentona Comunista'sı ve ardından gelen olağanüstü hal, şiddetli devrimi destekleyip desteklemediklerine bakılmaksızın birçok solcu politikacıyı ve aktivisti ülkeden kaçmaya veya yeraltına inmeye zorladı. Demokrasi sağlam bir şekilde kurulduğunda, demokratik sosyalistler nihayet eve dönme fırsatına sahip oldular."
 BRA_departamendo_de_propaganda:0 "Departamento de Propaganda"
 BRA_departamendo_de_propaganda_desc:0 "Son on yıllık siyasi kargaşa, hükümet ve halkın görüşlerinin aynı hizada olmadığı zamanlarda neler olabileceğini çok iyi gösteriyor. Daha fazla kargaşayı önlemek için, halkı politikalarımızla aynı hizaya getirmek için bir propaganda departmanı kuracağız."
 BRA_departamento_de_ordem_politica_e_social:0 "Departamento de Ordem Política e Social"
 BRA_departamento_de_ordem_politica_e_social_desc:0 "Propaganda ve zorlama, en adanmış radikalleri veya yabancı ajanları devlete zararlı faaliyetlerde bulunmaktan caydırmak için yetersizdir. Bu nedenle bu tür tehditleri araştırmak için yeni bir gizli polis gücüne ihtiyacımız var."
 BRA_departamento_feminino:0 "Departamento Feminino"
 BRA_departamento_feminino_desc:0 "Kocaları ve babaları kadar vatansever ve sadık sayısız kadın var. Onlara hareketimize katılma ve [BRA.GetAdjective] büyüklüğünün restorasyonu için birlikte çalışma fırsatı vermeliyiz."
 BRA_depose_vargas:0 "[ROOT.GetLeader]'ı Devir"
 BRA_depose_vargas_desc:0 "[ROOT.GetLeader] bir yük haline geldi. Yetenekli bir politikacı olmasına rağmen, halkın bir adamdan tahammül edebileceği bir sınır var. Sefalete geri dönmekten kaçınmak istiyorsak, onu devirmeli ve ordudan daha kabul edilebilir bir liderle değiştirmeliyiz."
 BRA_desenvolvimentismo:0 "Desenvolvimento"
 BRA_desenvolvimentismo_desc:0 "İnsanları tekrar işe döndürmek ve ihracatımızın tekrar akmasını sağlamak istiyorsak, ekonomide bir miktar büyümeyi başlatmamız gerekiyor. Bunu yeni sanayiler yaratarak ve insanların finansal hizmetlere erişimini kolaylaştırarak yapacağız."
 BRA_disrupt_operation_bolivar:0 "Bolivar Operasyonunu Boz"
 BRA_disrupt_operation_bolivar_desc:0 "Eski dünya ulusları, Güney Amerika'nın işlerine uzun süredir müdahale ediyor. Bir zamanlar askerler ve savaş gemileri gönderdikleri yere, şimdi istihbarat operatörleri gönderiyorlar. Artık bu tür faaliyetlere göz yumamayız ve sınırlarımız içindeki bu tür operatörleri avlamalıyız."
 BRA_domestic_arms_industry:0 "Yerli Silah Sanayii"
 BRA_domestic_arms_industry_desc:0 "Uluslararası durum giderek daha gergin görünüyor ve bu da dünyanın büyük silah üreten uluslarının teçhizat ihracatını sınırlamasına yol açtı. Askeri gücümüzü tam güçte tutmak istiyorsak kendi silah sanayimizi hızla geliştirmeliyiz."
 BRA_domination_of_the_americas:0 "Amerikaların Hakimiyeti"
 BRA_domination_of_the_americas_desc:0 "Kapımızın önünde bu kadar çok düşman varken asla tam olarak güvende olamayız. [BRA.GetAdjective] kurtuluşuna giden tek yol, bölgenin tartışmasız gücü olmamızdır."
 BRA_electronics_bonus:0 "Elektronik Bonusu"
 BRA_empire_of_brazil:0 "Brezilya İmparatorluğunu Yeniden Kur"
 BRA_empire_of_brazil_desc:0 "Güç, hükümdarın ve atadığı bakanların elinde güvenli bir şekilde olduğunda, ulusu eski görkemine kavuşturma zamanı geldi. Bunu yapmanın ilk adımı, Brezilya İmparatorluğu'nun restorasyonu ve inşa edildiği geleneksel değerlere geri dönmek olacaktır."
 BRA_end_military_interference:0 "Askeri Müdahaleyi Sona Erdir"
 BRA_end_military_interference_desc:0 "Ulusal muhafızlarımızın kurulmasıyla, nihayet askeri kuruluşun etkisini kısıtlama, silahlı kuvvetlerimizi nihayet sivil hükümetin denetimine alma yeteneğine sahibiz."
 BRA_end_military_interference_tt:0 "Tarafsızlık popülaritesindeki değişiklik: §G-§![?.Root.party_popularity@neutrality|%0G].\n"
 BRA_end_the_state_of_emergency:0 "Olağanüstü Hal'i Sona Erdir"
 BRA_end_the_state_of_emergency_desc:0 "Bir zamanların kahramanı [BRA.GetLeader] şimdi [BRA.GetAdjective] demokrasisine yönelik en büyük tehdit olarak duruyor. Güç arzusu ve fırsatçı eğilimleri, güvence altına almak için savaştığımız hakları neredeyse askıya almasına izin verdi. Özgürlüğe değer veren herkes bu tehlikeli olağanüstü hale karşı çıkmalıdır."
 BRA_ensure_continued_military_support:0 "Askeri Desteği Sağla"
 BRA_ensure_continued_military_support_desc:0 "Askeri desteği sürdürmek rejimimizin uzun ömürlü olması için hayati önem taşımaktadır. Devlet ile önde gelen subaylar arasında verilecek birkaç sözle, şüphesiz davamıza kazanılabilirler."
 BRA_equality_for_women:0 "Proleter Eşitliği"
 BRA_equality_for_women_desc:0 "Eski burjuva düzeni, tüm kisveleriyle yıkılmalıdır. Bu amaçla, Brezilya'daki kadınlar ve azınlıklar devlet tarafından uzun süredir göz ardı edildi ve tarihi şikayetlerini ele alma zamanı geldi. Ayrıca onları proleter cumhuriyetimizin gelişimi için yeteneklerini kullanmaya teşvik etmeliyiz."
 BRA_equality_for_women_tt:0 "Birim lideri olarak §Y$BRA_olga_benario_prestes$§!'in kilidini açar"
 BRA_establish_caloi:0 "Caloi Fabrikası Kur"
 BRA_establish_caloi_desc:0 "Dünya genelinde tırmanan gerilimler, Avrupa ve Kuzey Amerika'dan bisiklet ve parça ithal etmeyi zorlaştırdı. Kauçuk ve çeliğe bol erişimimizle, belki de kendi bisiklet fabrikamızı kurmalı ve kullanımlarını orduya dahil etmeliyiz."
 BRA_establish_companhia_vale_do_rio_doce:0 "Companhia Vale do Rio Doce"
 BRA_establish_companhia_vale_do_rio_doce_desc:0 "Minas Gerais'te, özellikle Itabira bölgesinde büyük demir cevheri damarları ve çeşitli başka zengin maden yatakları keşfedildi. Temel amacı bu olan yeni bir şirket kurarak, devletin bu kaynakları işletmesini ve bu yatakları geliştirmesini sağlamalıyız."
 BRA_establish_psad:0 "DASP'yi Kur"
 BRA_establish_psad_desc:0 "Hükümetimizin politikalarının uygulanmasını sağlayan devlet mekanizması eskimiş ve bayatlamıştır. Ulusu daha etkili bir şekilde yönetmemize ve ekonomik verimliliği sürdürmemize yardımcı olmak için Departamento Administrativo do Serviço Público'yu (DASP) kuracağız."
 BRA_establish_the_brazilian_investment_bank:0 "İş Dostu Vergilendirme"
 BRA_establish_the_brazilian_investment_bank_desc:0 "Şu anda ödediklerinden daha az vergi ödemekten fayda sağlayacak uluslararası şirket sıkıntısı yok. Bu tür şirketler için uygun vergilendirme politikaları belirleyerek, onları [ROOT.GetNameDef]'e taşınmaya teşvik edebiliriz, bu da ekonomimize fayda sağlar."
 BRA_establish_trade_relationships:0 "$CHL_establish_trade_relationships$"
 BRA_establish_trade_relationships_desc:0 "$CHL_establish_trade_relationships_desc$"
 BRA_estado_moderno:0 "Estado Moderno"
 BRA_estado_moderno_desc:0 "İç düşmanlarımız dağılmış ve yenilmişken, eski siyasi düzenlemeyi silip atma ve [BRA.GetName] halkı için uzun vadeli barış ve istikrarı sağlayabilecek modern bir devlet ilan etme zamanı geldi."
 BRA_estado_moderno_tt:0 "§Y$BRA_getulio_vargas$§!, §Y$BRA_fascism_party_long$§!'nin lideri olur!"
 BRA_estado_moderno_tt_desc:0 ""
 BRA_estado_novo:0 "Estado Novo"
 BRA_estado_novo_desc:0 "Yıllarca bir iç savaşın eşiğinde oturduktan sonra, nihayet yılların siyasi çıkmazını aşabilir ve barış, adalet ve çalışmaya dayalı yeni bir devlet inşa edebiliriz. Bu arada, daha fazla muhalefet tohumu ekmeden önce yeni düzenlemeye karşı çıkanları kökünden kazımaya devam edeceğiz."
 BRA_ethical_internationalism:0 "Etik Enternasyonalizm"
 BRA_ethical_internationalism_desc:0 "En büyük uluslar bile halklarına her şeyi yaratıp sağlayamaz. Halkımız için barış ve refahı güvence altına almak için, dış politikamızı benzer düşünen uluslarla karşılıklı yarar sağlayan ekonomik ortaklıklar üzerine kurmalıyız."
 BRA_expand_colonial_empire:0 "Sömürge İmparatorluğunu Genişlet"
 BRA_expand_colonial_empire_desc:0 "Denizaşırı son genişlememizle, şimdi hakimiyetimizi Afrika'ya genişletebileceğimiz bir dayanağımız var. Kıtanın çoğu Avrupa büyük güçlerinin egemenliği altında kalsa da, alınmaya hazır birçok kaynak zengini bölge var."
 BRA_expand_fordlandia:0 "Fordlandia'yı Genişlet"
 BRA_expand_fordlandia_desc:0 "Ford Motor Company, kauçuk üretimi için endüstriyel bir üs olarak hareket edebilecek bir yerleşim yeri kurmak için Amazon'a yatırım yaptı. Proje son yıllarda ekonomik kargaşa nedeniyle duraksadı, ama belki de şimdi projeyi yeniden başlatma zamanı geldi."
 BRA_expand_operation_bolivar:0 "Bolívar Operasyonunu Genişlet"
 BRA_expand_operation_bolivar_desc:0 "[GER.GetAdjective] halkı, Güney Amerika'da hem ekonomik hem de siyasi faaliyetleri izleyen büyük ölçekli bir istihbarat operasyonu yürütüyor. Artan istihbarat işbirliği karşılığında operasyonu genişletmelerine yardım etmemiz istendi."
 BRA_fabrica_nacional_de_motores:0 "Fábrica Nacional de Motores"
 BRA_fabrica_nacional_de_motores_desc:0 "Motorlu taşıtlar karmaşık makinelerdir ve bu nedenle ithal etmek büyük maliyetlidir. Bu, uzun vadede ekonomik büyümemizi engelleme potansiyeline sahiptir. Bunu önlemenin en iyi yolu, kendi yerli üretim araçlarımızı geliştirmektir."
 BRA_faction_mercosul_name:0 "Mercosul"
 BRA_federal_development:0 "[BRA_federal_development_key]"
 BRA_federal_development_desc:0 "Ekonomik kalkınma, herkesin sıkı çalışmalarının ödüllerini toplayabilmesi için ulus geneline yayılmalıdır. Bu nedenle, sadece sanayilerimizin emtialarını değil, aynı zamanda konumlarını da çeşitlendirmeliyiz."
 BRA_federal_development_key:0 "Federal Gelişim"
 BRA_federal_employment_plan:0 "Federal İstihdam Planı"
 BRA_federal_employment_plan_desc:0 "Toplu işsizlik, devam eden radikalizme ve şiddete yol açacaktır. Bunu önlemek için, devlete ait sanayiler ve yeni altyapı projeleri yaratarak istihdam olanaklarını genişleteceğiz."
 BRA_financial_stimulation:0 "Mali Teşvik"
 BRA_financial_stimulation_desc:0 "Son yıllarda yeni sanayiler ve altyapı projelerinin kurulmasıyla güçlü bir ekonominin temellerini attık. Büyümeyi sürdürmek için, sadece merkez bankasının ve ulusal sanayilerin kollarını çekmemiz gerekiyor. "
 BRA_financial_stimulation_tt:0 "Kararlar, kırsal eyaletlerdeki §YYerel İnşaat Hızını§!, §YMaksimum Fabrikaları§! ve §YYerel Mevcut Kaynakları§! §G%20§! artırmaya izin verir!"
 BRA_ford_mio_tt:0 "§Y$USA_ford_motor_company_organization$§! Askeri Sanayi Kuruluşunun kilidini açar."
 BRA_fordlandia_name:0 "Fordlandia"
 BRA_foreign_legion:0 "Legião Estrangeira"
 BRA_foreign_legion_desc:0 "[ROOT.GetName] bu sıkıntılı zamanlarda yabancılar için bir sığınak haline geldi. Aralarında ortak değerlerimizi savunmak için canlarını vermeye istekli olacak erkek sıkıntısı yok. Onları bir yabancı lejyonuna alarak onlara bu fırsatı vermeliyiz."
 BRA_foreign_legion_tt:0 "§YLegião Estrangeira§! şablonu oluştur ve §G3§! birimini [ROOT.Capital.GetCapitalVictoryPointName]'e konuşlandır. \n\nDaha fazla §YLegião Estrangeira§! tümeni toplamak için §Y$BRA_foreign_legion_cat$§! kararlarının kilidini aç."
 BRA_form_mercosul:0 "Mercosul'u Kur"
 BRA_form_mercosul_desc:0 "Güney Amerika uzun zamandır [USA.GetName] veya Avrupa imparatorlukları gibi dış güçlerin etkisi altında. Ancak kıtanın ulusları tek bir ekonomik ve siyasi blok olarak bir araya gelirse, kimse kıtamıza müdahale etmeye cesaret edemez."
 BRA_form_mercosul_focus_tt:0 "Diğer Güney Amerika uluslarını Mercosul'a katılmaya davet etmek için kararların kilidini açar"
 BRA_free_prestes:0 "Prestes'i Hapisten Kurtar"
 BRA_free_prestes_desc:0 "$BRA_luis_carlos_prestes$ birkaç yıldır radikal [ROOT.GetAdjective] siyasetinin ön saflarında yer alıyor. Ancak ilk intentona comunista'nın başarısızlığıyla birlikte, hareketin liderliğiyle birlikte tutuklandı. Zafer umudumuz varsa, liderlerimizi $BRA_getulio_vargas$'ın pençesinden kurtarmalıyız."
 BRA_free_prestes_tt:0 "Mevcut hükümetin başarılı bir şekilde devrilmesinin ardından, [SOU.GetAdjective] yanlısı §YPartido Communista§! danışmanları mevcut olacak."
 BRA_free_speech:0 "Siyasi Söylemi Aç"
 BRA_free_speech_desc:0 "Askeri kuruluşun Ulusal Kongre üzerindeki etkisinin kısıtlanmasıyla, başka bir diktatörlük potansiyeli azaldı. Şimdi ifade özgürlüğü için daha iyi korumalar sağlamanın ve vatandaşlarımızdan daha fazla siyasi katılımı teşvik etmenin zamanı geldi."
 BRA_free_speech_tt:0 "Aşağıdakiler siyasi danışman olarak mevcut olacak: \n"
 BRA_german_cooperation:0 "Güney Atlantik Hakimiyeti"
 BRA_german_cooperation_desc:0 "Çok uzun zamandır Atlantik Okyanusu, Amerikan ve İngiliz Donanmaları tarafından domine edildi. [GER.GetNameDef] ile olan işbirliğimiz sayesinde, onları devirmeye ve Atlantik'in kontrolünü kendimiz için ele almaya hazırız."
 BRA_german_cooperation_tt:0 "§YGüney Atlantik Okyanusu§!'ndaki [ROOT.GetNonIdeologyName] veya [GER.GetNonIdeologyName]'e ait olmayan adalar üzerinde §Yhak iddiaları§! kazan"
 BRA_german_cooperation_tt_2:0 "§Y10§! [GER.GetAdjective] §YTip IIA Erken Denizaltı§! kazan."
 BRA_german_sub_initiative:0 "Alman Denizaltı Bilgi Değişimi"
 BRA_german_subs:0 "Alman Denizaltı Geliştirme Programı"
 BRA_german_subs_desc:0 "Almanlarla aynı safta olmak, daha önce kendimizi modernize etmekte zorlandığımız departmanlarda onların teknolojisinden yararlanmamızı sağladı ve bu alanlardan biri de denizaltı savaşı alanıdır. Yeni bulduğumuz müttefiklerimizden yararlanacak ve Cape Verde Düzlüğü'nü kontrol edeceğiz! "
 BRA_german_tanks:0 "Alman Tankları Edin"
 BRA_german_tanks_desc:0 "Almanların yanında yer almamız sayesinde, artık sadece Almanya'nın Panzerlerine benzer tankların araştırılması ve üretimi için planlar ve detaylar elde etmekle kalmıyor, aynı zamanda onlardan bu tür araçları kolayca satın alabiliyoruz. Tüten Kobralar düşmanlarımızın kalbine korku salacak!"
 BRA_german_tanks_tt:0 "§Y200§! [GER.GetAdjective] §YPanzer IV Ausf. A - Orta Tank§! kazan!"
 BRA_greater_federalism:0 "Daha Fazla Federalizm"
 BRA_greater_federalism_desc:0 "Siyasi gücün merkezileştirilmesi demokratik değerlerimizle bağdaşmaz. [ROOT.Capital.GetCapitalVictoryPointName]'deki siyasi seçkinlerin boğazını sıkmasını kırmalı ve gücü cumhuriyetin eyaletlerine geri getirmeliyiz."
 BRA_guyana_crisis:0 "Guyana Krizi"
 BRA_guyana_crisis_desc:0 "Avrupa güçlerinin gözleri dünyanın başka yerlerindeyken, Guyanalardaki topraklarını bize devretmeye zorlama fırsatımız var, yoksa savaşlarında başka bir cepheyle karşı karşıya kalacaklar."
 BRA_imperial_development_key:0 "İmparatorluk Gelişimi"
 BRA_implement_a_national_guard:0 "Bir Ulusal Muhafız Uygula"
 BRA_implement_a_national_guard_desc:0 "Ordu, ulusun siyaseti üzerinde bir gölge oluşturmaya devam ediyor ve hoşnutsuz kalırsa demokrasiyi sona erdirmekle sürekli tehdit ediyor. Etkilerini karşılamak için, Ulusal Kongre'ye sadık yeni bir ulusal muhafız tanıtacağız."
 BRA_implement_a_national_guard_tt:0 "§YGuarda Nacional§! olarak bilinen tümen şablonu oluşturur ve §Y[ROOT.Capital.GetCapitalVictoryPointName]§!'de §Y6 birim§! toplar."
 BRA_implement_article_138:0 "138. Maddeyi Uygula"
 BRA_implement_article_138_desc:0 "1934 anayasasının 138. maddesi, hükümetin çok çocuklu ailelere yardım etmesi gerektiğini belirtiyordu. Bu muğlak madde çoğu aileye uygulanacaktı, bu da herhangi bir yardımın önemli maliyetlere yol açacağı anlamına geliyordu. Ancak, bu tür aileler için temel refah sistemleri uygulayarak, bir nesilde milyonları yoksulluktan kurtarabiliriz."
 BRA_in_vargas_we_trust:0 "Vargas'a Güveniyoruz"
 BRA_in_vargas_we_trust_desc:0 "$BRA_getulio_vargas$ liderlik fırtınalarına göğüs gerebilen yetenekli bir politikacı olduğunu kanıtladı. Ayrıca, parti politikalarımızı benimseyerek bilge bir lider olduğunu kanıtladı. Partideki birçok kişi artık onun ulusu daha da büyük zirvelere taşıyacağına inanıyor."
 BRA_industry_bonus:0 "Ekonomiyi Canlandırma Bonusu"
 BRA_infilitrate_the_military:0 "Orduya Sız"
 BRA_infilitrate_the_military_desc:0 "Ordunun üst düzey üyeleri ideolojimize karşı olmaya devam etse de, alt rütbeli subayların birçoğu üstlerini devirmek için bir fırsat kolluyor. Eğer saflarına sızarsak, onları davamıza çekebiliriz."
 BRA_infilitrate_the_military_tt:0 "Bu odak alındığında, yaklaşan §Riç savaş§! sırasında §Yordunun§! daha büyük bir oranı komünistlere katılacak."
 BRA_integrity_of_the_fatherland:0 "Anavatan İçin"
 BRA_integrity_of_the_fatherland_desc:0 "$BRA_getulio_vargas$ yararlı bir siyasi müttefikti, ama sadece gücü önemsiyor ve gerçek bir İntegralist değil. Ulus genelindeki geniş desteğimizle, Başkanı devirmek ve ofise $BRA_plinio_salgado$ gibi gerçek bir inananı getirmek için bir hamle yapmalıyız."
 BRA_international_brigades:0 "Uluslararası Tugaylar"
 BRA_international_brigades_desc:0 "Çevremizdeki dünyada savaşlar şiddetleniyor ve bunlarda aktif bir rol oynamasak da, iyi yoldaşlar olarak gücümüz yettiğince ihtiyacı olanlara yardım göndermek bizim görevimizdir. Savaşlara pervasızca katılmak bize bir fayda sağlamaz, şimdilik gönüllüler göndermeyi hedeflemeliyiz."
 BRA_invest_in_ports:0 "Limanlara Yatırım Yap"
 BRA_invest_in_ports_desc:0 "Ekonomimizin ihtiyaçlarını yurtiçinde karşılamada o kadar büyük ilerleme kaydettik ki, ekonomik büyümeyi teşvik etmenin bir yolu olarak bir kez daha ihracata bakabiliriz. Bunu yapmak için, ulusun büyük limanlarına yatırım yapmamız gerekecek."
 BRA_invest_in_railways:0 "Demiryollarına Yatırım Yap"
 BRA_invest_in_railways_bonus:0 "Demiryolu Bonusu"
 BRA_invest_in_railways_desc:0 "Trenler, insan ve malların büyük mesafeler üzerinden toplu taşımacılığının en ekonomik yöntemi olmaya devam ediyor. Bu nedenle, demiryolu ağımızı genişletmeye ve modernize etmeye, ayrıca kendi trenlerimizi geliştirmeye yatırım yapmalıyız. "
 BRA_invest_in_road_infrastructure:0 "Yol Altyapısına Yatırım Yap"
 BRA_invest_in_road_infrastructure_desc:0 "Arabalar ve kamyonlar ekonomik kalkınma için giderek daha önemli hale geliyor. Ancak, yol ağlarımız ulusal ölçekte araçların kitlesel olarak benimsenmesini destekleyecek kadar gelişmiş değil. Bu nedenle ekonomimiz boğulmadan önce büyük bir otoyol inşaat programına yatırım yapmalıyız."
 BRA_invest_in_the_armed_forces:0 "Orduya Rüşvet Ver"
 BRA_invest_in_the_armed_forces_desc:0 "Askeri seçkinlerin sadakatleri değişkendir ve hem yurtiçi hem de yurtdışındaki komünizm tehdidinden paranoyaktırlar. Bunu, saltanatımızı desteklemeleri karşılığında artırılmış bir askeri bütçeyle onlara rüşvet vererek kendi avantajımıza kullanacağız. "
 BRA_invite_foreign_companies:0 "Yabancı Şirketleri Davet Et"
 BRA_invite_foreign_companies_desc:0 "Yabancı sermayeye kapıları açma zamanı geldi. Bunu, yabancı şirketlerin [BRA.GetNonIdeologyName]'de operasyon kurmaları için teşvikler yaratarak yapacağız, bu da işsizliği azaltacak ve vergi gelirini artıracaktır."
 BRA_invite_foreign_companies_tt:0 "§YAskeri Sanayi Kuruluşlarını§! §Y[ENG.GetFlag][ENG.GetName]§!, §Y[USA.GetFlag][USA.GetName]§!, §Y[FRA.GetFlag][FRA.GetName]§! veya §Y[SWE.GetFlag][SWE.GetName]§!'den [BRA.GetNonIdeologyName]'e davet etmemizi sağlayan §Y$BRA_invite_foreign_companies_cat$§! kararlarının kilidini açar \n§G[BRA.GetNonIdeologyName]'e davet edilen her MIO başına 1 askeri fabrika veya tersane kazan.§! \n§RHer ülkeden sadece 1 MIO davet edebileceğiz!§! \n\n§GAşağıdakilerden 4 tanesi seçilebilir:§!"
 BRA_issue_lordships:0 "Kraliyet Unvanları Ver"
 BRA_issue_lordships_desc:0 "Haklı alanımızı geri almaya başladığımızda, çeşitli bölgeleri kontrol etme yükü sevgili hükümdarımız için bir yük haline geliyor. Bu nedenle, krallığın yönetiminde yardımcı olmak için güvenilir kabul edilenlere yeni arazi kraliyet unvanları verileceğini ilan etti."
 BRA_italian_air_mio_tt:0 "§Y$ITA_fiat_aviazione_organization$§! Askeri Sanayi Kuruluşunun kilidini açar."
 BRA_italian_aircraft:0 "İtalyan Uçak Geliştirme Programı"
 BRA_italian_aircraft_desc:0 "İtalyanlarla aynı safta olmak, daha önce kendimizi modernize etmekte zorlandığımız departmanlarda onların teknolojisinden yararlanmamızı sağladı ve bu alanlardan biri de uçak alanıdır. İtalyan teknolojisini kullanarak, Güney Amerika'nın göklerine hükmedeceğiz!"
 BRA_italian_car_industry:0 "İtalyan Otomobil Endüstrisi ile İşbirliği"
 BRA_italian_car_industry_desc:0 "Motor sanayimiz henüz emekleme aşamasında, oysa [ITA.GetName]'deki dostlarımızın büyük ve başarılı bir motor sanayisi var. Belki de gelişmekte olan şirketlerimizi iyileştirme konusunda onlardan tavsiye isteme zamanı gelmiştir."
 BRA_italian_cooperation:0 "[ITA.GetAdjective]-[ROOT.GetAdjective] Afrika Paylaşımı"
 BRA_italian_cooperation_desc:0 "Eski imparatorluklar çökerken, Afrika için yeni bir kapışma ortaya çıkıyor. [ITA.GetNameDef] ile olan özel ilişkimiz sayesinde, kıtanın bir parçasını kendimiz için ayırma fırsatımız var."
 BRA_italian_truck_exchange:0 "İtalyan Motorlu Bilgi Değişimi"
 BRA_italian_trucks:0 "Ortak İtalyan Motor Geliştirme"
 BRA_italian_trucks_desc:0 "Sadece son teknoloji motorlu taşıtların geliştirilmesi ve üretimi konusunda İtalyan uzmanlığını elde etmekle kalmayıp, aynı zamanda bir sipariş vermeli ve İtalyan kamyonlarının derhal sevkiyatını talep etmeliyiz."
 BRA_italian_trucks_mio_tt:0 "§Y$ITA_fiat_organization$§! Askeri Sanayi Kuruluşunun kilidini açar."
 BRA_jaguar_diplomacy:0 "Jaguar Diplomasisi"
 BRA_jaguar_diplomacy_desc:0 "[CHI.GetName] son zamanlarda yerli hayvanlarından birini diplomatik bir hediye olarak kullandı. İdeolojik farklılıklara rağmen, yabancı hükümetlerle gergin ilişkileri yumuşatmak için başarılı bir yöntem gibi görünüyor. Belki de büyük güçleri kendi işlerimize karışmaktan caydırmak için aynı tekniği kullanabiliriz."
 BRA_jaguar_diplomacy_tt:0 "Güney Amerika'daki Komünizme karşı olan büyük güçleri, onlarla saldırmazlık paktları kurarak yatıştırmak için §Y$BRA_jaguar_diplomacy_cat$§! kararlarının kilidini açar."
 BRA_join_the_comintern:0 "Komintern'e Katıl"
 BRA_join_the_comintern_desc:0 "[BRA.GetNameDef] çok uzun süredir Komintern'in dışında durdu, ancak desteğine güvendi. Artık katılmak için düzgün bir şekilde başvurma zamanı geldi!"
 BRA_julieta_soria:0 "Julieta Soria"
 BRA_kgbrazil:0 "[BRA_kgbrazil_key]"
 BRA_kgbrazil_cangaco:0 "Rede Coiteiros"
 BRA_kgbrazil_desc:0 "[BRA_kgbrazil_desc_key]"
 BRA_kgbrazil_just_add_operatives:0 "[SOU.GetAdjective] İstihbarat İşbirliği"
 BRA_kgbrazil_just_add_operatives_desc:0 "Düşmanlarımız hakkındaki istihbarat ve bilgiler, gerektiğinde ülkemizi ve çıkarlarımızı savunma yeteneklerimizin kritik bir bileşenidir. Teşkilatımız son zamanlarda çok çalışıyor, ancak davamıza bazı deneyimli Sovyet operatiflerini katarsak daha da iyi olabilir."
 BRA_kgbrazil_no_lar:0 "Bilgi Cephesini Güçlendirme"
 BRA_kgbrazil_no_lar_desc:0 "Düşmanlarımız hakkındaki istihbarat ve bilgiler, gerektiğinde ülkemizi ve çıkarlarımızı savunma yeteneklerimizin kritik bir bileşenidir. Hem düşmanımız hakkında istihbarat toplamak hem de onları hassas bilgilerimizden uzak tutmak için teknolojik ihtiyaçlarımızın zirvesinde kalmaya öncelik vermeliyiz."
 BRA_land_reform_key:0 "Toprak Reformu"
 BRA_launch_the_revolution:0 "Devrimi Başlat"
 BRA_launch_the_revolution_desc:0 "Zamanı geldi. 1935'te Intentona Comunista sırasında yapamadığımızı düzelteceğiz. [BRA.GetLeader] ve onun baskıcı hükümetine karşı ayaklanmalıyız."
 BRA_launch_the_revolution_tt:0 "[BRA.GetNameDef]'de §YKomünist Devrimi§! başlatır. Alacağımız tümen sayısı §Y[BRA.GetCommunistParty]§! desteğinin ne kadar yüksek olduğuna bağlıdır.\n§RBu, Demokratik Partiye karşı bir Komünist İç Savaşına yol açacaktır!§!"
 BRA_legion_name:0 "Legião Estrangeira"
 BRA_license_soviet_designs:0 "[SOV.GetNameDef] ile Lisans Anlaşmaları"
 BRA_license_soviet_designs_desc:0 "Araştırmamız büyük güçlerin gerisinde kalıyor. Yetişme kapasitesini oluşturmak uzun zaman alacak, ancak o zamana kadar, [SOV.GetNameDef]'den [BRA.GetNameDef]'de ekipman üretme izni almak için çalışabiliriz. Böyle bir anlaşmanın maliyetlerini göz önünde bulundurarak, hafif bir indirim için pazarlık yapmaya çalışmalıyız."
 BRA_license_soviet_designs_tt:0 "([SOV.GetFlag]§Y[SOV.GetName]§!) '§Y[BRA.GetNameDefCap] Lisans Üretim Anlaşması Arıyor§!' etkinliğini alır \n \n §YBize karşı yüksek bir görüşleri varsa§! kabul etme olasılıkları daha yüksektir!"
 BRA_monarch_choice_1_tt:0 "§YPedro de Alcântara§!, İmparatorluk Evi'nin lideri olacak. \n§REğer [ROOT.GetNonIdeologyName], $BRA_constitutional_monarchy$ odağını tamamlarsa, aşağıdaki ulusal ruh eklenecektir§!:"
 BRA_monarch_choice_2_tt:0 "§YPedro Henrique§!, İmparatorluk Evi'nin lideri olacak. \n§REğer [ROOT.GetNonIdeologyName], $BRA_constitutional_monarchy$ odağını tamamlarsa, aşağıdaki ulusal ruh eklenecektir§!:"
 BRA_nacional_de_motores_bonus:0 "Nacional de Motores Bonusu"
 BRA_nadiya_morozova:0 "Nadiya Morozova"
 BRA_natal_naval_base:0 "Parnamirim Havaalanı'nı İnşa Et"
 BRA_natal_naval_base_desc:0 "ABD ile yeni kurduğumuz işbirliği sayesinde, Güney Amerika ve Batı Afrika arasında uçmak için ABD Donanması, ABD Ordusu ve RAF'ın havaalanını kullanmasına izin vermemiz karşılığında, büyük ölçüde kendi fonlarını kullanarak ülkemizde hava üsleri inşa etmeyi teklif ettiler."
 BRA_national_petroleum_council:0 "Ulusal Petrol Konseyi"
 BRA_national_petroleum_council_desc:0 "Tarlalardaki traktörlerden kıyılarımızı savunan savaş gemilerine kadar, petrol modern makinelerin can damarı haline geldi. Böylesine önemli bir kaynağa bağımlı olmak ulusal güvenliğimiz için bir tehdittir. Bu riski azaltmak için, yerli petrolün keşfi ve çıkarılmasını denetlemek üzere bir ulusal petrol konseyi kuracağız."
 BRA_nationalization_of_industry:0 "Sanayinin Millileştirilmesi"
 BRA_nationalization_of_industry_desc:0 "Sivil sanayimiz henüz millileştirilmedi. Halkımızın ve ülkemizin ihtiyaçlarını karşılamak yerine kar amacı güden özel mülk sahiplerinin elinde verimlilik büyük ölçüde zarar görüyor. [BRA.GetNameDef]'deki tüm insanların yararı için sanayimizi millileştirmeli ve genişletmeliyiz."
 BRA_nationalize_the_banks:0 "Bankaları Millileştir"
 BRA_nationalize_the_banks_desc:0 "Ekonomimiz henüz Büyük Buhran'dan kurtulamadı ve birçok vatandaşımızı yoksulluk içinde bıraktı. Ekonomik toparlanmanın yükünü buhranın kurbanlarından alıp, bankaları işleten faillerine yükleme zamanı geldi."
 BRA_new_capital:0 "Brasília"
 BRA_no_communism_in_south_america:0 "Güney Amerika'da Komünizme Hayır"
 BRA_no_communism_in_south_america_desc:0 "Komünistlere güvenilemez, 1935'teki haklı olarak bastırdığımız devrim girişiminde fark ettiğimiz gibi. Ulusumuzun geleceğini sağlamak için, yakındaki herhangi bir yabancı yıkıcının er ya da geç halledilmesini sağlamalıyız!"
 BRA_no_communism_in_south_america_tt:0 "§YGüney Amerika§!'daki tüm §YKomünist§! uluslara karşı §Y$puppet_wargoal_focus$§! savaş hedefi kazan!"
 BRA_no_fascism_in_south_america:0 "Güney Amerika'da Faşizme Hayır"
 BRA_no_fascism_in_south_america_desc:0 "Aldığımız tavır açıkça faşizme karşı olduğuna göre, mevcut tehlikelere karşı harekete geçme ve kıtamızı bu aşağılık ideolojiden koruma zamanı geldi. Hayır, [BRA.GetNameDef] sizin sömürgeniz değil!"
 BRA_no_fascism_in_south_america_tt:0 "§YGüney Amerika§!'daki tüm §YFaşist§! uluslara karşı §Y$puppet_wargoal_focus$§! savaş hedefi kazan!"
 BRA_oil_industry_bonus:0 "Petrol Endüstrisi Bonusu"
 BRA_org_american_states_faction:0 "Amerikan Devletleri Örgütü"
 BRA_org_american_unity_warning_tt:0 "§RÖrgütün üye devletleri, saldırıya uğrayan diğer herhangi bir devleti savunmak için çağrılacaktır. Yardıma ihtiyacı olan bir üyeyi savunamamak veya bir diğer üyeye savaş ilan etmek, örgütten atılma ile sonuçlanacaktır!§!"
 BRA_organization_of_american_unity:0 "Amerikan Devletleri Örgütü"
 BRA_organization_of_american_unity_desc:0 "İç politikamız son yıllarda başarılı oldu, şimdi dikkatimizi dış ilişkilere ve Amerikan Birliği Örgütü aracılığıyla yarımküre genelinde işbirliğini teşvik etmeye çevirme zamanı geldi."
 BRA_organization_of_american_unity_tt:0 "Diğer ulusları süper-ulusal örgüte davet etmek için §YAmerikan Devletleri Örgütüne Davet Et§! kararlarının kilidini açar."
 BRA_oust_prestes:0 "Kişilik Kültünü Önle"
 BRA_oust_prestes_desc:0 "Komünist bir toplum birkaç kişi tarafından yönetilemez. Bunu başaran ülkeler kesinlikle olsa da, bu ülkelerin sadece kişilik kültlerine dönüşmesinin an meselesi olacağından korkuyoruz. Bu kaderin başımıza gelmesini önlemek amacıyla, ANL konseyinin ülkenin siyasi işlerini kontrol altına almasını sağlamalıyız."
 BRA_pact_of_silence:0 "Suskunluk Paktı"
 BRA_pact_of_silence_desc:0 "Uluslar yükselir ve uluslar düşer. Son zamanlarda birçoğunun düşmesiyle, ev diyecekleri daha güvenli kıyılar arayan her alanda bir uzman bolluğu var. Belki de uzmanlıklarının ödüllerini toplayabildiğimiz sürece kökenlerine göz yumabiliriz. "
 BRA_panama_push:0 "Panama İtişi"
 BRA_panama_push_desc:0 "Kıtayı kendimiz için güvence altına alacaksak, hızla hareket etmeli ve düşmanlarımızı karşılık veremeden ezmeliyiz."
 BRA_paraguay_intervention:0 "Paraguay'a Müdahale"
 BRA_paraguay_intervention_desc:0 "[PAR.GetNameDefCap] çok istikrarsız ve öngörülemez hale geldi. Kendi ulusal güvenliğimiz adına, ulusal işlerine müdahale etmeli ve hükümetlerini istikrara kavuşturmalıyız."
 BRA_penal_battalions:0 "Batalhões de Presos"
 BRA_penal_battalions_desc:0 "Silahlı kuvvetlerdeki birçok kişi, on yıllardır sürgünde olan bir monarşi için savaşma ihtimalinden pek heyecan duymuyor. Ancak ulusal güvenlik yasalarını kullandığımızdan beri, ceza taburlarında kullanılabilecek bir mahkum bolluğu yarattık, bu da demoralize olmuş konvansiyonel kuvvetlerimizi güçlendiriyor."
 BRA_penal_battalions_tt:0 "Ceza taburlarını kullanan §YBatalhões de Presos§! olarak bilinen tümen şablonu oluşturur. Ayrıca §Y[ROOT.Capital.GetCapitalVictoryPointName]§!'de §Y6 birim§! toplar."
 BRA_petropolis_line:0 "Pedro de Alcântara'nın İddiasını Destekle"
 BRA_petropolis_line_desc:0 "Pedro de Alcântara bir zamanlar sürgündeki Brezilya İmparatorluk Evi'nin lideriydi, daha sonra Kontes Elisabeth Dobržensk ile evlenebilmek için tahttaki tüm iddialarından feragat etti. Restorasyon hareketi ivme kazandıkça, şimdi feragatinin gayri meşru olduğunu ve tahtın haklı varisinin kendisi olduğunu iddia ediyor."
 BRA_posts_for_generals:0 "Generaller için Bakanlık Görevleri"
 BRA_posts_for_generals_desc:0 "Etkili askeri subaylara Bakanlar Kurulu'nda görevler sunarak, hükümetin kararları konusunda onlara bir rol oynama fırsatı vererek endişelerini azaltabiliriz. Bu, güdülerimiz hakkındaki şüphelerini azaltmalı ve daha fazla kan dökülmesine gerek kalmasını önlemelidir."
 BRA_posts_for_generals_tt:0 "Siyasi danışman olarak §Y$BRA_eurico_gaspar_dutra$§!'nın kilidini açar: \n Askere Alınabilir Nüfus: §Y%2§! \n Savaş Desteği: §G+%10§! \n Çekirdek Bölgede Tümen Savunması: §G+%5§! \n Demokratik Diplomasi kabulü: §R-25§!"
 BRA_potenji_river_conference:0 "Potenji Nehri Konferansı"
 BRA_potenji_river_conference_desc:0 "Ekonomimizi savaşa hazırlamak için büyük çaba harcadık, ancak [USA.GetAdjective] müttefiklerimize katılma ve Batı yarımküresinin savunmasına tam olarak bağlı kalma zamanı geldi, bu küresel çapta tehditlerle uğraşmayı gerektirse bile."
 BRA_potenji_river_conference_tt:0 "§Y[ROOT.GetFlag][ROOT.GetNameDefCap], [USA.GetFlag][USA.GetNameDef]§! ile aynı ittifaka katılacak §R\nBu aynı zamanda mevcut [USA.Getflag][USA.GetAdjective] düşmanlarına savaş ilan etmemize neden olacak!§!"
 BRA_prepare_for_second_intentona:0 "İkinci Intentona Comunista"
 BRA_prepare_for_second_intentona_desc:0 "$BRA_getulio_vargas$'ın burjuva devletini devirme ilk girişimimiz başarısız oldu. Hızla toparlanmazsak, ikinci bir devrim girişimi şansı, geçirdiği yeni anti-solcu yasalar dalgasında sönecektir. Devrimin ateşini, bu olmadan önce yeniden alevlendirmeliyiz."
 BRA_pro_labor_agreement:0 "İşçi Yanlısı Politikalar"
 BRA_promote_agriculture:0 "Kahve Baronlarını Geri Getir"
 BRA_promote_agriculture_desc:0 "Sözde ‘Kahve Baronları’, monarşiyi restore etmek için yeterli destek almamıza yardımcı olmada etkili oldular. Şimdi onları ekonominin yeniden inşasını denetlemek üzere hükümete getirerek ödüllendireceğiz."
 BRA_promote_agriculture_tt:0 "§YDanışmanın kilidini aç:§!"
 BRA_promote_immigration_to_brazil:0 "Göçü Teşvik Et"
 BRA_promote_immigration_to_brazil_desc:0 "[BRA.GetName], ataları dünya geneline yayılan insanlarla çeşitli bir ulustur. Ekonomimiz bir kez daha büyürken ve dokunulmayı bekleyen bol miktarda kaynak varken, daha fazla insanı buraya taşınmaya ve kendilerine de [BRA.GetAdjective] demeye teşvik etme zamanı geldi."
 BRA_promote_immigration_to_brazil_tt:0 "Eyaletleri iyileştirmek için §Y$JUNO_promote_immigration_cat$§! kararlarının kilidini açar."
 BRA_promote_resource_extraction:0 "Kaynak Çıkarımını Teşvik Et"
 BRA_promote_resource_extraction_desc:0 "Ulusumuz bol doğal kaynaklarla kutsanmıştır. Daha fazla ekonomik büyüme ve bağımsızlığı teşvik etmek için, sanayilerimiz için modern çıkarma ekipmanlarına yatırım yapacağız. "
 BRA_provoke_argentina:0 "Arjantin'i Kışkırt"
 BRA_provoke_argentina_desc:0 "[ARG.GetName]'nin bizi izole edip yok etmek istediği açık, ancak bunu yapmalarını önlemek için çok aceleci davranırsak, [USA.GetName]'nin gazabına uğrayabiliriz. Bunun yerine, [ARG.GetAdjective] halkını ilk ateş etmeye kışkırtacağız ve sonunda Cisalpine savaşı için intikamımızı alacağız!"
 BRA_purchase_soviet_equipment:0 "Sovyet Ekipmanı Satın Al"
 BRA_purchase_soviet_equipment_desc:0 "Ordumuzun şu anda büyük bir teçhizat ihtiyacı var. Bu orduyu daha da büyütmek için, güvenilir bir müttefikten uygun bir fiyata teçhizat satın alma imkanına sahip olmak isteriz. Bazı müzakerelerle [SOV.GetNameDef] ile bir anlaşma sağlayabilmeliyiz."
 BRA_radicalize_the_proletariat:0 "Proletaryayı Radikalleştir"
 BRA_radicalize_the_proletariat_desc:0 "İktidarı ele geçirme son girişimimiz, büyük ölçüde işçilerden yeterince koordine edilmiş destek alamadığımız için yetersiz kaldı. Mesajımızı onlara yaymalı ve bize olan mutlak sadakatlerini sağlamalıyız."
 BRA_radio_nacional:0 "Radio Nacional"
 BRA_radio_nacional_desc:0 "Birçok ulus, kitlelere hava dalgaları üzerinden gerçeklere dayalı içerik ve eğlence sağlamak için ulusal yayın kurumları kurmaya başlıyor. Kendi Radio Nacional'imizi kurarak bu tür girişimlerde geride kalmaktan kaçınacağız. "
 BRA_rapid_industrialization:0 "Hızlı Sanayileşme"
 BRA_rapid_industrialization_desc:0 "Sivil sanayimize yaptığımız yatırımlar, hem işçilerimiz hem de ülkemiz için çok ödüllendirici görünüyor. Belki de yerli askeri sanayimize benzer yatırımlar yapmayı düşünmeliyiz."
 BRA_reach_out_to_our_neighbors:0 "Komşularımıza Ulaş"
 BRA_reach_out_to_our_neighbors_desc:0 "Kıtadaki tek Portekizce konuşan ulus olmamız nedeniyle komşularımızdan uzun süredir tecrit edilmiş durumdayız. Belki de onlara şüpheyle yaklaşmak yerine onlarla daha iyi ilişkiler kurmaya çalışma zamanı gelmiştir."
 BRA_reach_out_to_the_great_powers:0 "$ARG_reach_out_to_the_great_powers$"
 BRA_reach_out_to_the_great_powers_desc:0 "$ARG_reach_out_to_the_great_powers_desc$"
 BRA_reclaim_territory_in_south_america:0 "Cisplatine Rövanşizmi"
 BRA_reclaim_territory_in_south_america_desc:0 "Cisplatine savaşının utancı, maliyetli savaşın sona ermesinden bir asır sonra bile İmparatorluk Evi'nin üzerinde asılı duruyor. Uruguay toprakları üzerindeki iddiamızı yeniden ileri sürmek, tebaamız arasında gururu yeniden canlandırmak ve dünyaya bir zamanlar olduğumuz çürümüş ulus olmadığımızı hatırlatmak için uzun bir yol kat edecektir."
 BRA_reinvigorate_the_navy:0 "Donanmayı Yeniden Canlandır"
 BRA_reinvigorate_the_navy_desc:0 "Donanma subayları, halk arasında popüler olmadığı zamanlarda bile İntegralist hareketi uzun süredir destekliyor. Uzun vadeli destekleri için, yaşlanan filoyu yeniden canlandırma sürecine başlayabilmeleri için fonları artıracağız."
 BRA_reject_cosmopolitanism:0 "Kozmopolitizmi Reddet"
 BRA_reject_cosmopolitanism_desc:0 "Kozmopolitizme yönelik son eğilim, büyük ulusumuza komünist müdahalesi için bir truva atından başka bir şey değildir. Biz [BRA.GetAdjective]'iz ve kültürümüzü ve ideallerimizi yok edilmeden önce savunmalıyız."
 BRA_repeal_the_national_security_law:0 "Ulusal Güvenlik Yasalarını Kaldır"
 BRA_repeal_the_national_security_law_desc:0 "$BRA_getulio_vargas$'ın olağanüstü hal sırasında kullandığı ulusal güvenlik yasalarını kaldırmazsak, başka bir fırsatçı başkanın demokrasimizi baltalama tehdidi her zaman mevcut olacaktır."
 BRA_resource_extraction_bonus:0 "Kaynak Çıkarma Bonusu"
 BRA_restoration_of_honor:0 "Brezilya Onurunun Restorasyonu"
 BRA_restoration_of_honor_desc:0 "Tebaamızın birçoğu monarşinin geri dönüşüne şüpheyle yaklaşırken, çoğunluk şimdi sonuçlardan memnun. Sınırlarımız genişletilmiş, ekonomimiz onarılmış ve toplumun doğal hiyerarşisi yeniden güçlendirilmişken, nihayet [ROOT.GetAdjective] onurunun restore edildiğini söyleyebiliriz."
 BRA_restore_the_coffee_barons:0 "Café Com Leite Politikası"
 BRA_restore_the_coffee_barons_desc:0 "Bir zamanlar [ROOT.GetAdjective] siyasetini on yıllarca kontrol eden güçlü kahve baronları, 1930 devrimi sırasında iktidardan süpürüldü. Birçoğu büyük bir ekonomik etkiye sahip ve siyasi tavizler karşılığında imparatorluk restorasyon hareketimizi desteklemeye ikna edilebilirler."
 BRA_revive_the_anl:0 "Aliança Nacional Libertadora'yı Canlandır"
 BRA_revive_the_anl_desc:0 "Aliança Nacional Libertadora, $BRA_getulio_vargas$'ın otoriter rejimini devirmede başarısız olsa da, hala gerçek bir değişiklik uman milyonlarca [BRA.GetAdjective] halkı üzerinde bir etkiye sahip. Bu umut tamamen sönmeden önce hareketi yeniden canlandırmalıyız."
 BRA_revive_the_anl_tt:0 "Yaklaşan komünist devrim sırasında, §G2§! ek §Ykomünist milis§! tümeni al."
 BRA_revive_the_anl_tt_2:0 "Mevcut hükümetin başarılı bir şekilde devrilmesinin ardından, §YAliança Nacional Libertadora§! ile aynı çizgideki danışmanlar mevcut olacak."
 BRA_reward_army_loyalty:0 "Ordu Sadakatini Ödüllendir"
 BRA_reward_army_loyalty_desc:0 "Ordu, sadece iktidara yükselişimizde değil, aynı zamanda iktidardaki tutunmamızı sürdürmede de vazgeçilmez olmuştur. Müttefiklerimizi bu sadakatleri için ordu altyapı projeleri için artırılmış bir kaynak tahsisiyle ödüllendirme zamanı geldi."
 BRA_rio_conference:0 "Rio Protokolü"
 BRA_rio_conference_desc:0 "Son çatışmalar bölgemizdeki uzun süredir devam eden sınır anlaşmazlıklarını şiddetlendirdi. Bu anlaşmazlıklar daha da tırmanmadan önce, Güney Amerika ulusları bir araya gelip bunları diplomatik olarak çözmelidir. "
 BRA_robert_ivanov:0 "Robert Ivanov"
 BRA_romanticize_the_old_empire:0 "İmparatorluk Tarihini Romantikleştir"
 BRA_romanticize_the_old_empire_desc:0 "Herhangi bir nedenle, bu başarısız cumhuriyetin sonunu görmek isteyen hoşnutsuz politikacı, iş lideri veya vatandaş sıkıntısı yok. Belki de imparatorluk tarihimiz ve geçmişteki zaferimiz etrafında birleşerek, hepsini tek bir uyumlu harekette birleştirebiliriz."
 BRA_rome_accords:0 "Roma Anlaşmalarını Kur"
 BRA_rome_accords_desc:0 "Oradan [BRA.GetName]'e olan tarihi göç nedeniyle [ITA.GetName] ile uzun zamandır güçlü bağlantılarımız var. Dünya değişmeye ve hükümetlerimiz daha uyumlu hale gelmeye başladıkça, uluslarımız arasında bir ortaklığı resmileştirmek mantıklı."
 BRA_royal_colleges:0 "[ROOT.Capital.GetCapitalVictoryPointName] Kraliyet Kolejini Kur"
 BRA_royal_colleges_desc:0 "İmparator son zamanlarda ulusumuzun akademik durumuna büyük bir ilgi duydu ve bu nedenle daha fazla yerli teknolojik yeniliği teşvik etmek için başkentte yeni bir Kraliyet Koleji kurulmasını emretti."
 BRA_secure_our_borders:0 "Sınırlarımızı Güvence Altına Al"
 BRA_secure_our_borders_desc:0 "Sınırlarımızın ötesinde, büyük ulusumuzu izole etmek ve yok etmek isteyen düşmanlarla çevriliyiz. İç durum kontrol altına alındığında, dikkatimizi dış ilişkilere çevirme ve ulusal güvenliğimizi sağlamak için manevralar yapmaya başlama zamanı geldi."
 BRA_seek_international_support:0 "Uluslararası Destek Ara"
 BRA_seek_international_support_desc:0 "Komünist hareketi restore etmek için büyük çabalar sarf edilmiş olsa da, üstesinden gelmemiz gereken güçlere kıyasla hala zayıfız. Bu nedenle, dünya genelinde benzer düşünen bireylerin ve hükümetlerin desteğini kazanmalıyız."
 BRA_seek_soviet_support:0 "[SOV.GetAdjective] Desteği Ara"
 BRA_seek_soviet_support_desc:0 "Başarılı olup ülkemizi halkımızın hak ettiği komünist topluma dönüştüreceksek, dışarıdan desteğe ihtiyacımız olacak. [SOV.GetNameDefCap] bize daha önce yardım etti, başarımızı sağlamak için bir kez daha onların desteğini istememiz doğru görünüyor."
 BRA_senta_a_pua:0 "Senta a Púa!"
 BRA_senta_a_pua_desc:0 "Pilotlarımız son zamanlarda bir savaş çığlığı geliştirmiş gibi görünüyor, bu da onların eşsiz vahşetlerini ve zafere olan bağlılıklarını tek bir cümleye sığdırmalarını sağlıyor. Senta a Púa!"
 BRA_smash_democracy:0 "Güney Amerika Kapitalizmini Bitir"
 BRA_smash_democracy_desc:0 "Burjuva demokrasisi ve kapitalizmi, birçok Güney Amerikalının haklarını ve yaşam koşullarını aşındırmaya devam ediyor. Kıta genelindeki yoldaşlarımızı zalimlerinden kurtarmak için elimizden gelen her şeyi yapmalıyız."
 BRA_smash_fascism:0 "Güney Amerika Faşizmini Ez"
 BRA_smash_fascism_desc:0 "Güney Amerika kıtasında devrimin henüz ulaşmadığı uluslar var. Bu uluslardan bazılarındaki proletarya, faşist yöneticiler altında hala büyük bir baskıya maruz kalıyor. Buna izin veremeyiz, işçi yoldaşlarımızı kurtarmalıyız!"
 BRA_smoking_cobras:0 "Cobras Fumantes"
 BRA_smoking_cobras_desc:0 "Birçokları, kuvvetlerimizin gerçekten cephe hatlarına ulaşmasından daha çok bir yılanın pipo içmesinin daha olası olduğunu söyledi. Şimdi düşmanlarımız, unvanı bir onur nişanı olarak benimseyen askerlerin azmi ve uzmanlığından korkuyor. "
 BRA_south_american_defense_cooperation:0 "Güney Amerika Ortak Askeri Tatbikatları"
 BRA_south_american_defense_cooperation_desc:0 "Kıtamız hem insan hem de coğrafya açısından çeşitlidir. Komşularımızla ortak askeri tatbikatlar yaparak, halkımız sadece birbirlerinin nasıl savaştığına değil, aynı zamanda nasıl yaşadıklarına dair de fikir edinebilir."
 BRA_south_american_defense_cooperation_tt:0 "Her §Yittifak üyesinin§! her §Yordu lideri§!, rastgele bir §Yarazi özelliği§! kazanma şansı §G%50§! olacak."
 BRA_south_american_research_cooperation:0 "Latin Amerika Araştırma Konseyi"
 BRA_south_american_research_cooperation_desc:0 "Latin Amerika'daki sanayilerimizin ve üniversitelerimizin, rakiplerimizin birçoğuyla aynı düzeyde finansmana erişimi olmadığı bir sır değil. Ancak ortak bir araştırma enstitüsü aracılığıyla işbirliği yaparak, çaba tekrarını önleyebilir ve bölgemizdeki yenilik hızını artırabiliriz."
 BRA_south_american_tech_sharing_group_tt:0 "Eğer Güney Amerika'daki ittifak üyeleri katılmayı kabul ederse:"
 BRA_soviet_arms_industry:0 "Sovyet Silah Sanayisini Davet Et"
 BRA_soviet_arms_industry_desc:0 "[BRA.GetNameDef]'de güçlü bir askeri sanayimiz var ancak son zamanlarda gücünü daha da artırmanın yollarını arıyoruz. [SOV.GetAdjective] Askeri Sanayi Kuruluşlarından bazıları [BRA.GetNameDef]'de operasyon kurma ilgisi gösterdi, onları davet etmeyi düşünmeliyiz."
 BRA_soviet_economic_aid:0 "Sovyet Ekonomik Yardımı"
 BRA_soviet_economic_aid_desc:0 "Yıllarca bizimkinden farklı fikirlere sahip liderler tarafından yönetildikten sonra, ekonomimiz istediğimiz yerde değil. Onu arzu edilen bir duruma getirme sürecini hızlandırmak için, bizimle benzer zihniyetteki diğer ülkelerden yardım istemeyi düşünmeliyiz."
 BRA_spirit_of_acre_war:0 "Acre Savaşını Yeniden Alevlendir"
 BRA_spirit_of_acre_war_desc:0 "Acre bölgesi şimdi bizim kontrolümüzde olsa da, oradaki tarihi sınır çatışmalarını Bolivya'nın daha fazlasını bölmek için bir bahane olarak kullanabiliriz. Bu bize, sanayimizi on yıllarca besleyecek büyük bir el değmemiş doğal kaynak zenginliğine erişim sağlayabilir."
 BRA_spread_the_revolution:0 "Devrimi Genişlet"
 BRA_spread_the_revolution_desc:0 "[BRA.GetNameDef]'e getirdiğimiz devrim halkımız tarafından büyük takdirle karşılandı. Şimdi iç işlerimizi istikrara kavuşturduğumuza göre, daha büyük düşünme ve kendi sınırlarımızın ötesine bakma zamanı geldi."
 BRA_state_atheism:0 "Ateist bir Devlet"
 BRA_state_atheism_desc:0 "Halkımızın zihinlerinin istenmeyen düşüncelerle dolmamasını sağlamak için, hiçbir yerde bu tür bir propagandanın yayılamayacağından emin olmalıyız. [BRA.GetAdjective] teologların eski moda yolları ve vaaz ettikleri, halkımızdan istediklerimizle tam bir tezat oluşturuyor. Buna artık izin vermemeliyiz!"
 BRA_stimulate_the_civilian_economy:0 "Ekonomiyi Canlandır"
 BRA_stimulate_the_civilian_economy_desc:0 "Malların yurtiçi üretimi yetersiz kalıyor ve bu da paranın ithalat satın almak için ulustan dışarı akmasına neden oluyor. Kendi sanayilerimizi genişleterek bunu engellemeliyiz."
 BRA_support_industrialists:0 "Sanayicileri Destekle"
 BRA_support_industrialists_desc:0 "Nüfusumuz arasında kapitalistlerden daha fazla işçi olmasına rağmen, ikincisi servetinin ve kaynaklarının önemli ölçüde daha fazlasını kontrol ediyor. İşçi haklarını kısıtlayan ve sanayicilerin bir bütün olarak ekonominin iyileştirilmesi için daha verimli çalışmasına izin veren politikalar uygulamalıyız."
 BRA_support_rural_folk:0 "Yoksulların Babası"
 BRA_support_rural_folk_desc:0 "Ulusun kırsal bölgelerinde yaşayan [BRA.GetAdjective] halkı, on yıllardır politikacılar tarafından unutuldu. Bu tür bölgelere yatırım yaparak, istihdamı ve altyapıyı artırırken aynı zamanda bu büyük demografik grubun desteğini de kazanabiliriz."
 BRA_support_the_landowners:0 "Şeker Baronlarını Destekle"
 BRA_support_the_landowners_desc:0 "Şekere olan küresel iştah on yıllardır genişlemeye devam etti ve bu da [ROOT.GetNonIdeologyName]'de mahsulü yetiştiren zengin toprak sahiplerinden oluşan bir sınıfın ‘Şeker Baronları’ olarak bilinmesine yol açtı. Köylülük arasındaki toprak reformu çağrılarını kapatarak onları kazanmaya çalışmalıyız."
 BRA_sway_the_cangaco:0 "Cangaço'yu Davamıza Çek"
 BRA_sway_the_cangaco_desc:0 "Cangaço, ulus üzerinde egemen olan çeşitli rejimlere karşı yıllarca savaştı. Marksist olmasalar da, bu haydutların yerel zenginliği yeniden dağıttığı için kırsal köylülükten güçlü destekleri var. Belki onları ve deneyimlerini devrimci hareketimize dahil edebiliriz?"
 BRA_sway_the_cangaco_tt:0 "§REtkilenen eyaletlerde Cangaço'ya baskı yapmamızı engelleyen§! §Y$BRA_cangaceiro_decision_cat$§! §Rkararlarını kaldır!§! \n\nİç savaş tetiklendiğinde veya hükümet §YKomünist§! olduğunda §G3§! birim Cangaço Milis birimi kazan!"
 BRA_sway_the_neighbors:0 "Komşuları Etkile"
 BRA_sway_the_neighbors_desc:0 "Komşularımız arasında sınıf bilincini yükseltmek ve onları burjuva baskısının zincirlerinden kurtulmaları için desteklemek için gerekli tüm araçları kullanmalıyız."
 BRA_sway_the_neighbors_tt:0 "Güney Amerika uluslarında komünizmi teşvik etmek için §Y$BRA_sway_the_neighbors_cat$§! kararlarının kilidini açar."
 BRA_tech_slot_1:0 "São Paulo Üniversitesi"
 BRA_tech_slot_1_desc:0 "São Paulo Üniversitesi daha yeni kuruldu, ancak faydaları şimdiden [BRA.GetAdjective] ekonomisi genelinde hissediliyor. Bu gelişmekte olan kuruma daha fazla yatırım yaparak bundan faydalanmalıyız."
 BRA_tech_slot_2:0 "[ROOT.Capital.GetCapitalVictoryPointName] Federal Üniversitesi"
 BRA_tech_slot_2_desc:0 "Teknoloji, çalışma şeklimizden savaşların yapılış şekline kadar yaşam biçimimizi hızla değiştiriyor. Ulusumuzun devam eden refahı ve güvenliği için yeni teknolojilerin araştırılmasına ve geliştirilmesine yatırım yapmamız son derece önemlidir."
 BRA_tech_slot_3:0 "[BRA.GetNonIdeologyName] Halk Üniversitesi"
 BRA_tech_slot_3_desc:0 "Güçlü bir ülke inşa etmek için, [BRA.GetName]'deki en büyük ve en parlak zihinlere kolay erişim sağlayan gelişmiş bir eğitim sistemine ihtiyacımız var. Erken dahil olmak, kurumdaki çalışma alanlarını kontrol etme nüfuzu sağlar. Üniversiteyi halka adamak, gelecek yıllarda bu entelektüellerin memnuniyetle kalıp davamıza yardım etmelerini sağlamanın bir yoludur."
 BRA_the_international_crisis:0 "Uluslararası Kriz"
 BRA_the_international_crisis_desc:0 "Büyük güçler arasındaki gerilimler arttıkça ve eski sınır anlaşmazlıkları bir kez daha dış ilişkilerin ön saflarına çıktıkça dünya giderek daha istikrarsız hale geliyor. Dikkatli hareket etmeliyiz, ancak karşılıklı güvenliğimiz için bölgedeki diğer demokratik uluslara da ulaşmalıyız."
 BRA_the_polaca:0 "Polaca"
 BRA_the_polaca_desc:0 "Rejimimize ciddi bir tehdit oluşturabilecek kapasiteye sahip pek kimse kalmamış olsa da, başkanın yetkilerini özetleyen yeni bir anayasa taslağı hazırlarsak meşruiyetimizi artırırız. Belki de ilham almak için yakın zamanda yürürlüğe giren Polonya anayasasına bakabiliriz."
 BRA_third_republic:0 "Düzen ve İlerleme"
 BRA_third_republic_desc:0 "Ulusda istikrar nihayet sağlandığında ve bir askeri darbe tehdidi azaldığında, güçlü denetim ve denge sağlayan, ancak Bakanlar Kurulu'nun gerektiğinde kararlı hareket etmesine izin veren daha sağlam bir anayasa çıkarma fırsatımız var."
 BRA_tribunal_de_seguranca_nacional:0 "Tribunal de Segurança Nacional"
 BRA_tribunal_de_seguranca_nacional_desc:0 "Ulusal Kurtuluş İttifakı hükümetimizi devirmede başarısız olsa da, üyeleri sokaklarda dolaşmaya, devleti baltalamak için başka bir fırsat için komplo kurmaya ve adam toplamaya devam ediyor. Bu tür suçlular, olağanüstü hal süresince askeri mahkemelerin kurulmasıyla daha verimli bir şekilde yargılanacak ve cezalandırılacaktır."
 BRA_undermine_democracy:0 "Ulusal Kongre'yi Baltala"
 BRA_undermine_democracy_desc:0 "En etkili destekçilerimiz bu anayasal monarşi uzlaşmasından memnun değil. Sabırsızlanıyorlar ve hükümdarın yeni bulduğu nüfuzu kullanarak yeni bir Bakanlar Kurulu atayarak Ulusal Kongre'yi geçersiz kılmasını istiyorlar."
 BRA_unify_south_america:0 "América do Sul"
 BRA_unify_south_america_desc:0 "Güney Amerika, halkımızın gücü ve cesareti sayesinde egemenliğimiz altına girdi. Şimdi kıtayı yönetimimiz ve kültürümüz altında birleştirmenin zor görevine başlamalıyız."
 BRA_unify_south_america_tt:0 "§YGüney Amerika§!'daki sahip olunan topraklarda §Yçekirdekler§! kazanmak için kararların kilidini açar!"
 BRA_union_of_latin_american_socialist_republics:0 "ULASR'yi Kur"
 BRA_union_of_latin_american_socialist_republics_desc:0 "Devrimci hareketimiz kıta genelinde burjuva toplumunun yapılarını aşındırmaya devam ediyor. Artık bir [ROOT.GetAdjective] hareketi olmadığımız, bir Güney Amerikalılar hareketi olduğumuz ve siyasi yapılarımızın bu değişimi daha iyi temsil etme zamanının geldiği açıktır."
 BRA_united_kingdom_of_brazil_and_portugal:0 "Brezilya ve Portekiz Birleşik Krallıkları"
 BRA_united_kingdom_of_brazil_and_portugal_desc:0 "Brezilya İmparatorluk Evi'nin restorasyonu, Portekiz'deki monarşist duyguları da yeniden alevlendirdi. Belki de bunu, uluslarımızı bir kez daha tek bir hükümdar altında birleştirme fırsatı olarak kullanmalıyız. Sonuçta, her iki ulus da birbirlerinin kaynaklarından ve uzmanlığından fayda sağlayacaktır."
 BRA_united_kingdom_of_brazil_and_portugal_tt:0 "§Y[POR.GetFlag][POR.GetNonIdeologyName]§! ve §Y[BRA.GetFlag][BRA.GetNonIdeologyName]§!'nin birleşmesini talep et. Eğer §Y[POR.GetFlag][POR.GetNonIdeologyName]§! kabul ederse, Brezilya'nın bir bağlı devleti olacaklar. Ancak, alternatif bir teklif sunabilir veya teklifi reddedebilirler."
 BRA_united_states_of_brazil:0 "Brezilya Birleşik Devletleri"
 BRA_united_states_of_brazil_desc:0 "1934 anayasası altında siyasi ve ekonomik eşitliği teşvik etmek için çok şey yapmış olsak da, birçok hükmüyle sınırlı kalıyoruz. Şimdi ulusun çıkarına olan, bu sönük anayasayı Amerika Birleşik Devletleri'ndeki dostlarımıza benzer bir anayasa lehine bir kenara bırakmaktır."
 BRA_united_states_of_south_america:0 "Güney Amerika Birleşik Devletleri"
 BRA_united_states_of_south_america_desc:0 "Ulusumuz, değerlerimizi paylaşan herkesi yeni bir başlangıç umuduyla buraya gelmeye teşvik eden bir özgürlük feneri haline geldi. Bu çeşitliliği kucaklamalı ve kendimizi Güney Amerika Birleşik Devletleri olarak kurarak geleceğe yönelik özlemlerimizi açıkça belirtmeliyiz."
 BRA_united_states_of_south_america_tt:0 "Güney Amerika'daki §YDemokratik§! veya §YTarafsız§! ittifak üyelerini [ROOT.GetNameDef] ile §Ybirleşmeye§! davet etmek için §Y$BRA_us_of_south_america_cat$§! kararlarının kilidini açar."
 BRA_uruguay_ultimatum:0 "Uruguay Ültimatomu"
 BRA_uruguay_ultimatum_desc:0 "[URG.GetNameDefCap] uzun zaman önce [BRA.GetName]'e dahil edilmeliydi, ama atalarımız bunu başaramadı. Bu tarihsel hatayı düzeltme ve halkımızı ortak bir dava arkasında birleştirme zamanı geldi."
 BRA_us_brazil_technology_exchange:0 "[USA.GetAdjective]-[ROOT.GetAdjective] Teknoloji Değişimi"
 BRA_us_brazil_technology_exchange_desc:0 "Son yıllarda ulusumuzun teknolojik uzmanlığını kapsamlı bir şekilde geliştirdik, ancak [USA.GetNameDef]'deki dostlarımızdan öğrenecek çok şeyimiz var. Belki de kendi bilgimiz karşılığında bilgilerini paylaşmaya teşvik edebiliriz."
 BRA_us_brazil_technology_exchange_tt:0 "Eğer [USA.GetFlag]§Y[USA.GetNameDef]§! teklifi kabul ederse:"
 BRA_use_the_national_security_law:0 "Ulusal Güvenlik Yasasını Kullan"
 BRA_use_the_national_security_law_desc:0 "Ulusal Kongre üyelerinin sunduğu zayıf direnişe rağmen, yeni Bakanlar Kurulumuz kendilerini ulusun meşru hükümeti olarak başarıyla kurdu. Şimdi, $BRA_getulio_vargas$ rejimi tarafından çıkarılan ulusal güvenlik yasalarını kullanarak siyasi işler üzerinde mutlak otorite kuracaklar."
 BRA_vassouras_line:0 "Pedro Henrique'nin İddiasını Destekle"
 BRA_vassouras_line_desc:0 "Siyasi statükoyu bozmak için bir hareket yaratma girişimlerimiz, imparatorluk kraliyet ailesinin geri dönüşüyle imparatorluk tarihimizin yeniden canlandırılması çağrılarına yol açtı. Birçoğu şimdi sürgündeki Brezilya İmparatorluk Evi'nin başı olan Pedro Henrique'yi ulusun haklı hükümdarı olarak destekliyor."
 BRA_war_bonds:0 "Savaş Tahvilleri"
 BRA_war_bonds_desc:0 "Askeri olarak çatışmaya sürüklenmeyi veya diğer ulusları ekonomik olarak desteklemeyi göz ardı edemeyiz, bu nedenle yeniden silahlanmamızı finanse etmek için savaş tahvili satma programına başlamalıyız."
 BRA_war_production:0 "Savaş Üretimi"
 BRA_war_production_desc:0 "Savaş ateşleri dünya çapında hızla yayılıyor. Topraklarımıza gelirlerse, sanayilerimizi araba ve tost makinesi üretmekten tank ve bomba üretmeye hızla geçirebilmeliyiz."
 BRA_washington_accords:0 "[USA.Capital.GetCapitalVictoryPointName] Anlaşmaları"
 BRA_washington_accords_desc:0 "Amerikan askeri garantileri karşılığında, ortak değerlerimizin savunmasında onları desteklemek için ekonomimizi savaş teçhizatı üretimine yönlendireceğiz."
 BRA_washington_accords_tt:0 "Eğer [USA.GetNameDef] anlaşmaları kabul ederse:"
 BRA_wealth_redistribution_key:0 "Servet Yeniden Dağıtımı"
 BRA_work_with_the_integralists:0 "İntegralistlerle Çalış"
 BRA_work_with_the_integralists_desc:0 "İntegralist hareketin hedefleri büyük ölçüde bizimkilerle aynı doğrultudadır, bu nedenle rejimimizi daha fazla komünist ayaklanmaya karşı güçlendirmek için onların desteğini kazanmak akıllıca olabilir. Paramiliter güçleri ve köklü milliyetçilikleri ile karşı devrimin öncüsü olacaklardır."
 CHL_1938_chilean_presidential_election:0 "Elección Presidencial de Chile de 1938"
 CHL_1938_chilean_presidential_election_desc:0 "1938 Başkanlık seçimi kapıda ve ülke liderini dört büyük aday arasından seçmek zorunda. Solda, Pedro Aguirre Cerda ve halk cephesi var, sağda Carlos Ibáñez del Campo ve halk özgürlük ittifakı var, ortada Gustavo Ross ve liberaller var ve daha da solda Elías Lafertte Gaviño ve komünistler var. Kim galip gelecek?"
 CHL_1938_chilean_presidential_election_tt:0 "§YBaşkanlık Seçimi§! §YEkim 1938§!'in sonlarında gerçekleştiğinde, bu odak otomatik olarak tamamlanacaktır"
 CHL_CHL_international_loans_tt:0 "Ekonomiyi iyileştirmek için yabancı güçlerden §YKredi Al§! kararlarının kilidini açar"
 CHL_a_french_alliance:0 "Frankofonları Birleştir"
 CHL_a_french_alliance_desc:0 "Fransa'daki monarşist dostlarımız kontrolü ele geçirdiğine göre, onlarla bir ittifak aramak akıllıca olur, çünkü bizimle aynı niyetlere ve hedeflere, aynı mirasa ve dile sahipler. Birlikte, durdurulamazız."
 CHL_a_grand_armada:0 "Büyük Bir Donanma"
 CHL_a_grand_armada_desc:0 "Tıpkı yaratıldığımız eski Büyük İspanyol İmparatorluğu gibi, Carlos Ibáñez del Campo da İngiliz kraliyet donanmasına, Amerikalılara ve Alman açık deniz filosuna aynı anda meydan okuyabilecek kadar güçlü büyük bir donanma istiyor ve öyle de olsun!"
 CHL_a_joint_application_to_the_allies:0 "Müttefiklere Ortak Bir Başvuru"
 CHL_a_joint_application_to_the_allies_desc:0 "Biz ve Arjantin, eski Müttefiklerle her zaman yeterince iyi ilişkilere sahiptik ve nihayet onlarla bir araya gelip daha parlak bir gelecek için birlikte çalışma zamanı geldi."
 CHL_a_new_araucanian_noble_class:0 "Yeni bir Araucanía Soylu Sınıfı"
 CHL_a_new_araucanian_noble_class_desc:0 "Artık büyük miktarda aristokrasiye sahip olsak da, devlete yatırım veya kral adına hizmet karşılığında insanların ülkenin soyluları olmaları için programlar oluşturmalıyız."
 CHL_a_new_empire_of_brazil:0 "Yeni bir Brezilya İmparatorluğu"
 CHL_a_new_empire_of_brazil_desc:0 "Brezilya'yı altımıza alacak ve Portekiz kökenli olmayan yeni bir kral tarafından yönetilen yeni bir Brezilya İmparatorluğu yaratacağız!"
 CHL_abide_by_the_francoist_model:0 "Frankocu Modele Uy"
 CHL_abide_by_the_francoist_model_desc:0 "Almanlar büyük bir etki yaratabilir, ancak hareketimizin gerçekten bakması gereken şey, Mussolini ve Franco gibi Akdeniz düşünürlerinin fikirleridir. Takip etmemiz gereken onların modelidir ve kendi ideallerimiz yapmamız gereken onların idealleridir."
 CHL_abide_by_the_francoist_model_tt:0 "Artık §Rİttifaklara Katılamayacağız§!"
 CHL_address_the_mapuche_conflict:0 "Mapuçe Anlaşmazlığını Ele Al"
 CHL_address_the_mapuche_conflict_desc:0 "Ülke istikrarsız, ancak durum Ibáñez altında Mapuçe halkı için hala daha iyi olmayacak ve bu nedenle hızla hareket etmeliyiz. Yerli aktivist ve politikacı Manuel Manquilef, Şili devletini kesin olarak devirmek için birçok birleşmemiş Mapuçe örgütünü toplamaya ve birleştirmeye başladı."
 CHL_adopt_mapundungun:0 "Mapudungun'u Benimse"
 CHL_adopt_mapundungun_desc:0 "Uygun bir Mapuçe devleti yeniden kurmaya yönelik büyük bir adım, Mapudungun'u resmi bir dil olarak, en azından mahkemede konuşulacak bir dil olarak benimsemek olurdu. Ayrıca devletimizin halkını eğitmeliyiz, böylece dilimizi öğrenebilirler."
 CHL_advancements_in_telecommunications:0 "Telekomünikasyondaki Gelişmeler"
 CHL_advancements_in_telecommunications_desc:0 "Ar-Ge'de çalışan bilim adamlarımız sadece radyoları kullanmak için değil, aynı zamanda televizyonların olası kullanım alanlarını ilerletmek için de daha iyi teknikler geliştirmeye başladılar ve bu sayede genel bilgiyi halka daha kolay ulaştırabilir ve ülkenin bilim laboratuvarlarının uzak departmanları arasında bulguları daha iyi iletebiliriz."
 CHL_alianza_popular_libertadora_as_a_vanguard:0 "Alianza Popular Libertadora"
 CHL_alianza_popular_libertadora_as_a_vanguard_desc:0 "Sadece kendi başınıza yönetmek zor olduğu için, çeşitli sağcı siyasi partilerden danışmanlarla bir koalisyon hükümeti kurmak, onların görüşlerini masaya getirmek akıllıca olur."
 CHL_align_the_marxists:0 "Marksistleri Hizaya Getir"
 CHL_align_the_marxists_desc:0 "Ulusumuzda mevcut hükümet yapısını zayıf gören birçok kişi var, ancak birçoğu, sol eğilimli bir başkan onlara ulaşırsa hükümeti desteklemeye kolayca ikna edilebilir."
 CHL_align_the_police:0 "Soruşturma Polisini Hizaya Getir"
 CHL_align_the_police_desc:0 "$CHL_expand_the_investigations_police_desc$"
 CHL_align_with_the_russian_soviet:0 "[SOU.GetNameDef] ile Hizalan"
 CHL_align_with_the_russian_soviet_desc:0 "[SOU.GetNameDefCap] yakın ideolojik yoldaşlardır. [SOU.GetFactionName]'e katılma karşılığında karşılıklı yardım teklifiyle onlara yaklaşmalıyız."
 CHL_an_absolute_monarchy:0 "Mutlak bir Monarşi"
 CHL_an_absolute_monarchy_desc:0 "Yapılacak çok şey var ve kontrolü ele alıp ülkeyi yönlendirebilecek tek kişi kraldır. Bu yüzden kabineye, ihtiyaçları olmadığı için hepsinin eve gidebileceğini bildirmenin son derece önemli olmasının nedeni budur."
 CHL_an_absolute_monarchy_tt:0 "Bu, daha sonra ağaçta §YTreading the Straight Line§! odağını almanızı §Rengelleyecektir§!"
 CHL_an_attempt_to_maintain_our_neutrality:0 "Tarafsızlığımızı Koruma Girişimi"
 CHL_an_attempt_to_maintain_our_neutrality_desc:0 "Dünya çatışmasına karışan birçok farklı ulus, bizi anlamsız çekişmelerinden oluşan bir savaşa çekmek istiyor. Çatışmalarından uzak durmak ve ait olmamamız gereken bir çatışmaya burnumuzu sokmamak için elimizden gelen her şeyi yapmalıyız."
 CHL_an_empire_on_the_pacific:0 "Pasifik'te bir İmparatorluk"
 CHL_an_empire_on_the_pacific_desc:0 "Artık altın çağımız gerçekten başladığına göre, ufkumuzu genişletme ve batıya bakma zamanı geldi. Pasifik Okyanusu boyunca uzanan büyük bir imparatorluk kuracağız!"
 CHL_an_imperial_capital:0 "Bir İmparatorluk Başkenti"
 CHL_an_imperial_capital_desc:0 "Mevcut durumda, başkentimiz Santiago, eski Şili devletinin başkenti olan aynı şehirdir. En azından başkenti başka bir yere değiştirmenin en iyisi olup olmadığı düşünülmelidir."
 CHL_an_imperial_capital_tt:0 "Başkentimiz olarak §YSantiago§!'yu tutma ve §G2§! bina Yuvası ekleme veya onu §YTemuco§!'ya taşıma ve §G4§! bina yuvası ekleme seçeneğimiz olacak."
 CHL_annex_and_core_all_american_subjects:0 "Tüm §YAmerikan Yerli ve Polinezya Bağlı Devletlerini§! §Yİlhak eder§! ve üzerlerinde §YÇekirdek§! kazanır!"
 CHL_approach_the_moderates:0 "Ilımlılara Yaklaş"
 CHL_approach_the_moderates_desc:0 "Monarşiden hoşlanmamalarına rağmen, ülkede en azından Ibáñez'e uymasını söylerse onu takip edecek birçok kişi var ve yapması gereken de tam olarak bu."
 CHL_attract_additional_french_investments:0 "Ek Fransız Yatırımları Çek"
 CHL_attract_additional_french_investments_desc:0 "Başlangıçta Antoine'ın Şili'ye yaptığı seferde büyük bir fırsat gören Fransız işadamları ve sanayicileri, şimdi onun büyük başarılarından etkilendiler ve gelecekte toprak vaadiyle daha fazla yardım sağlamaya kolayca ikna edildiler."
 CHL_avenge_the_pacification_of_araucania:0 "Araucanía'nın Pasifikasyonunun İntikamını Al"
 CHL_avenge_the_pacification_of_araucania_desc:0 "1861'den 1883'e kadar süren Şili'nin Araucanía'yı İşgali, Mapuçe tarihinin karanlık bir dönemiydi ve Şilililerin bize getirdiği adaletsizlik ve savaşın intikamını alma zamanı geldi. Silah başına, cesur savaşçılar! Bir zamanlar sizin olanı ve bir kez daha sizin olacak olanı geri alın! Quilapán ve Caupolicán'ın miraslarını onurlandırın!"
 CHL_avenge_the_pacification_tt:0 "Ülkedeki Çeşitli Anti-Mapuçe unsurları, bize karşı bir §Rİç Savaşta§! §YCarlos Ibáñez del Campo§!'yu takip edecek!"
 CHL_ban_liberalism:0 "Liberalizmi Yasakla"
 CHL_ban_liberalism_desc:0 "Liberalleri hükümetten atmış olsak da, var olan sonsuz kum taneleri gibi varlıklarını sürdürüyorlar. Gruplarına baskı yapmalı ve yönetimimizi tehdit edecek kadar güçlenmelerini asla sağlamamalıyız."
 CHL_carabineros_secured_by_opposition:0 "Carabineros Muhalefet Tarafından Güvence Altına Alındı"
 CHL_chilean_anti_communist_action:0 "Acción Chilena Anticomunista"
 CHL_chilean_anti_communist_action_dem_version:0 "Şili Anti-Komünist Eylemi"
 CHL_chilean_anti_communist_action_dem_version_desc:0 "$CHL_chilean_anti_communist_action_desc$"
 CHL_chilean_anti_communist_action_desc:0 "Komünistler ulusumuza herhangi bir diğeri kadar büyük bir tehdittir ve arzu ettikleri devrimi getirme şansını asla bulamamalarını sağlamak için elimizden gelen her şeyi yapmalıyız."
 CHL_claim_the_mexican_throne:0 "Meksika Tahtını Talep Et"
 CHL_claim_the_mexican_throne_desc:0 "Meksika tahtı bir zamanlar, ne kadar kısa sürse de, bir Fransız imparatoruna aitti. Bu gerçeği sömürmeli ve onların soyundan geldiğimizi, ülkeyi her an geri almaya hazır olduğumuzu iddia etmeliyiz."
 CHL_commence_the_counter_revolution:0 "Karşı-Devrimi Başlat"
 CHL_commence_the_counter_revolution_desc:0 "Birliklerimiz hazır ve hevesle emir bekliyor, Santiago'daki her büyük pozisyonu ve diğer çeşitli şehirlerdeki belediye binalarını işgal etmeye hazır. Şimdi gereken tek şey planı uygulamak ve tüm bunlar bittiğinde halktan ne kadar destek aldığımızı bekleyip görmek."
 CHL_commence_the_counter_revolution_negative_tt:0 "Daha önce alınan §YHazırlık Odakları§! miktarına göre Savaş Desteği ve İstikrar kaybet"
 CHL_connect_the_northern_railways:0 "Kuzey Demiryollarını Bağla"
 CHL_connect_the_northern_railways_desc:0 "Kuzeydeki, özellikle Arica'daki demiryolları ve yollar, altyapı sistemlerimizin geri kalanıyla zayıf bir şekilde bağlantılıdır ve bu nedenle en kuzeydeki bölgelerin genel altyapısını iyileştirmeye çaba gösterilmelidir."
 CHL_construct_new_hydroelectric_stations:0 "Yeni Hidroelektrik Santralleri İnşa Et"
 CHL_construct_new_hydroelectric_stations_desc:0 "Yerli Mapuçe arasında popüler olmayan bir hamle olsa da, Araucanía bölgesi her türlü doğal kaynak açısından zengindir ve bunlardan biri de gölleri ve şelaleleridir. Bunu hidroelektrik santralleri inşa etmek için kullanabiliriz, ancak bu bölgenin sakinlerini üzebilir."
 CHL_construct_the_estadio_nacional:0 "Estadio Nacional'i İnşa Et"
 CHL_construct_the_estadio_nacional_desc:0 "Alessandri'nin ekonomiyi ve halkın güvenini yeniden tesis etme konusundaki en büyük çabası kamu işleri yoluyla olmuştur ve başyapıtı, spor oyunları için görkemli bir ulusal stadyum olan Estadio Nacional'dir; bu, ulusu yönetme yeteneğinin harika bir göstergesidir."
 CHL_contract_efe:0 "EFE ile Anlaş"
 CHL_contract_efe_desc:0 "Empresa de los Ferrocarriles del Estado şu anda demiryolu sistemlerimizi işletiyor ve onlar üzerinde daha doğrudan bir kontrole sahip olduğumuzdan ve onları dizginlediğimizden emin olarak, kaynaklarının ve önceliklerinin istediğimiz yerlere yerleştirildiğinden emin olabiliriz."
 CHL_controlled_education:0 "Sıkı Kontrollü Eğitim"
 CHL_controlled_education_desc:0 "Çocukların doğru büyümesi ve bizim istediğimiz şekilde düşünmeleri için, eğitimlerinin onları model vatandaşlar yapmak için uyguladığımız standartlara ve düzenlemelere uymasını sağlamalıyız."
 CHL_convene_the_araucanian_congress:0 "Araucanía Kongresini Topla"
 CHL_convene_the_araucanian_congress_desc:0 "Bağımsızlık savaşımızı başlatma zamanı yaklaşıyor, ancak örgütümüzde bir iç bölünme var. Bazıları komünistlerin bizimle benzer hedefleri paylaştıkları için faydalı bir müttefik olabileceğini iddia ederken, diğerleri sadece hizipçiliğe neden olacaklarını ve en kritik anda bize ihanet edeceklerini iddia ediyor. Kime güvenilmeli?"
 CHL_cooperate_with_operation_bolivar:0 "Bolívar Operasyonu ile İşbirliği Yap"
 CHL_cooperate_with_operation_bolivar_desc:0 "Ancak Almanlar bizim için çok şey yaptı. En çok ihtiyacımız olduğunda, Alman yerleşimciler Araucanía'yı sömürgeleştirmek için geldiler ve şimdi, Amerikalılarla başa çıkmada yardıma ihtiyaçları var. Bu konuda onlara yardım etmek ve borcumuzu ödemek bizim görevimizdir."
 CHL_cooperation_with_the_falange:0 "Ulusal Falanj ile İşbirliği"
 CHL_cooperation_with_the_falange_desc:0 "Ulusal Falanj, 1935'te kurulan bir Hristiyan Demokrat Partisidir ve çoğunlukla ilerici ve reformist Katoliklerden oluşur. Politikalarının birçoğu bizimkine çok benzediği için, onları hükümetimize davet etmek zor olmamalı."
 CHL_counter_operation_bolivar:0 "Bolivar Operasyonuna Karşı Çalış"
 CHL_counter_operation_bolivar_desc:0 "Almanya, aşağılık Bolivar Operasyonlarında casusluk ve sabotaj kullanarak Güney Amerika uluslarını etkilemeye çalışıyor. Çabalarına karşı koymak için elimizden gelen her şeyi yapmalıyız."
 CHL_crown_antoine_as_sovereign_king:0 "Antoine'ı Egemen Kral Olarak Taçlandır"
 CHL_crown_antoine_as_sovereign_king_desc:0 "Jacques Antoine Bernard, iç savaşımız sırasında hükümetimize yardım etmek için Fransa'dan buraya döndü, bedeli olarak ona güç vermemiz ve Araucanía ve Patagonya'nın Egemen Kralı unvanını vermemiz gerekiyor. Ne yanlış gidebilir ki?"
 CHL_crusade_against_imperialism:0 "Emperyalizme Karşı Haçlı Seferi"
 CHL_crusade_against_imperialism_desc:0 "Sonunda adalet adına daha geniş bir dünyayı ele almaya hazır olduğumuz zaman geldi! Artık onlara boyun eğmeyeceğimizi çürümüş Avrupalılara gösterme zamanı geldi. Silah başına adamlar, çünkü bu sefer savaşı onlara taşıyacağız!"
 CHL_crusade_against_imperialism_tt:0 "§YAmerikan Yerli§! ve §YPolinezya Devletlerini§! Emperyalist baskıdan kurtarmak için Kararların kilidini açar"
 CHL_cultivate_fanaticism:0 "Fanatizmi Geliştir"
 CHL_cultivate_fanaticism_desc:0 "Birleşme olmadan, Güney ve Orta Amerika halklarının geleceği yok ve bu herkese duyurulmalı. Şimdi Amerikalılara karşı durmazsak, kesinlikle onların manipülatif ve emperyalist pençelerine düşeceğiz. Bir Hispanik'i yapan onurdur ve bize karşı çıkan herkesin deneyimleyeceği şey vahşettir."
 CHL_defense_of_the_hemisphere:0 "Yarımkürenin Savunması"
 CHL_defense_of_the_hemisphere_desc:0 "Yarımküremizde ABD'ye karşı korunmaktan büyük fayda sağlayacak birçok ulus var ve bu tam da bizim ve Almanların onlara sunabileceği şeydir."
 CHL_demand_demilitarization_of_patagonia:0 "Patagonya'nın Askerden Arındırılmasını Talep Et"
 CHL_demand_demilitarization_of_patagonia_desc:0 "Arjantinliler, Patagonya'daki sürekli askeri varlıklarıyla halkımızı tehdit etmeye devam ediyor. Onlardan sadece bizi rahat bırakmalarını ve bölgeden asker çekme sözü vermelerini istemenin tam zamanı."
 CHL_demand_the_fireland:0 "Ateş Topraklarını Talep Et"
 CHL_demand_the_fireland_desc:0 "Tierra del Fuego haklı olarak bizimdir ve Arjantin, ona kara bağlantısı bile olmadığı için mülkiyetlerine dair hiçbir meşruiyet iddia edemez. Halkımıza zarar vermeyeceğimizi temin etmeli ve bölgeyi Arjantin'in pençesinden koparmalıyız."
 CHL_demand_the_guayanas:0 "Guyanaları Talep Et"
 CHL_demand_the_guayanas_desc:0 "Guyanalar çok uzun süredir başka güçler tarafından işgal edildi. Bir zamanlar El Dorado'yu barındırdığı iddia edilen bölge gerçekte olmayabilir, ama başka birçok zenginliği var, umutsuzca kendimiz için istediğimiz zenginlikler."
 CHL_denounce_the_anarchy:0 "Anarşiye Yakın Durumu Kına"
 CHL_denounce_the_anarchy_desc:0 "Wall Street Çöküşü'nden sonra başlayan anarşinin henüz çözülmemiş olması, mevcut hükümetin ve pasif liberal ideallerinin doğasında var olan büyük zayıflığın büyük bir göstergesidir. Onlara karşı kamuoyuna seslenmeli ve eğer arkamızda toplanırlarsa geleceğin onların olduğunu halka temin etmeliyiz."
 CHL_departamento_de_la_juventad_nacista:0 "Departamento de la Juventud Nacista"
 CHL_departamento_de_la_juventad_nacista_desc:0 "Almanya gibi diğer ülkeler gençliklerini militarize etmede başarılı oldular ve biz de farklı bir şey yapmamalıyız, çünkü sahada daha fazla adama ihtiyacımız var ve buna şimdi ihtiyacımız var."
 CHL_departemento_de_las_tropas_nacistas_de_asalto:0 "Departamento de las Tropas de Asalto"
 CHL_departemento_de_las_tropas_nacistas_de_asalto_desc:0 "Nacista Taarruz birlikleri departmanımız cesaretlendirilmeli ve güçlendirilmelidir. Büyük Savaş'ın şok birliklerinin ruhuna uygun yaşadıklarından emin olmalı ve onları uygun şekilde donatmalıyız."
 CHL_devalue_the_peso:0 "[CHL_devalue_the_peso_key]"
 CHL_devalue_the_peso_desc:0 "[CHL_devalue_the_peso_key_desc_key]"
 CHL_devalue_the_peso_franc:0 "Frank'ı Devalüe Et"
 CHL_devalue_the_peso_franc_desc:0 "Diğer ülkeler ekonomilerine yardımcı olmak için para birimlerinin daha az değerli olmasına izin verirken, biz henüz bunu yapmadık. Sonuç olarak, çok geride kalıyoruz. Eğer yetişmek istiyorsak, popüler olmayan bir önlem olacağı kanıtlansa bile, para birimimizi devalüe etmekte beklememeliyiz."
 CHL_devalue_the_peso_peso:0 "Peso'yu Devalüe Et"
 CHL_devalue_the_peso_peso_desc:0 "Diğer ülkeler ekonomilerine yardımcı olmak için para birimlerinin daha az değerli olmasına izin verirken, biz henüz bunu yapmadık. Sonuç olarak, çok geride kalıyoruz. Eğer yetişmek istiyorsak, popüler olmayan bir önlem olacağı kanıtlansa bile, para birimimizi devalüe etmekte beklememeliyiz."
 CHL_development_inwards:0 "İçe Dönük Gelişim"
 CHL_development_inwards_desc:0 "Politikamız, dünya meselelerinden uzak durmak ve ülkeyi bir kez daha ihracata çok fazla güvenmeden içeriden geliştirmek olmalıdır."
 CHL_dispute_over_tierra_del_fuego:0 "Tierra del Fuego Üzerindeki Anlaşmazlık"
 CHL_dispute_over_tierra_del_fuego_desc:0 "Arjantin hükümeti hala Tierra del Fuego'nun doğu yarısını kendilerinin olduğunu iddia ediyor, buna kara bağlantısı olmamasına ve bizim açıkça daha eski ve daha meşru bir iddiaya sahip olmamıza rağmen. Onu derhal güvence altına almak için harekete geçmeliyiz."
 CHL_dispute_over_tierra_del_fuego_tt:0 "Bu, Tierra del Fuego'nun sahibiyle §RSavaşa§! yol açabilir"
 CHL_dissolve_covensa:0 "COVENSA'yı Dağıt"
 CHL_dissolve_covensa_desc:0 "İç kaynak dağıtım şirketi COVENSA'nın kurulması bir hataydı ve bunu hepimiz biliyoruz. Ekonomik sorunlarımızı çözmenin tek gerçek yolu, büyük ölçekli ihracatımızı yeniden başlatmaktır ve bunu yapmak için örgütü tasfiye etmeli ve selefi COSACH'a daha çok benzeyecek şekilde reforme etmeliyiz."
 CHL_domestic_production_of_the_willys_mb:0 "Willys MB'nin Yerli Üretimi"
 CHL_domestic_production_of_the_willys_mb_desc:0 "Kendi ülkemizde bol miktarda hafif silah ve mühimmat üretebiliyoruz, ancak uygun motorlu ve zırhlı araçları üretme uzmanlığından yoksunuz. Bu sorunu hafifletmek için, satmaya istekli herkesten araba satın almalı ve tasarımlarını kopyalamalıyız."
 CHL_electing_a_toqui:0 "Bir Toqui Seçimi"
 CHL_electing_a_toqui_desc:0 "Mapuçe geleneğine uygun olarak, çeşitli Rehuelerini ve Aillarehuelerini yöneten Loncolardan oluşan bir meclis tarafından savaş zamanı lideri olarak bir Toqui seçilir. Bu Toquiler Mapuçe toplumunda en yüksek role sahipti ve savaş zamanı savaşçıları ve Loncoları yönetti ve şimdi yeni bir Toqui, Anti-Emperyalist Haçlı Seferimizi yönetebilecek birini seçme zamanı geldi!"
 CHL_electing_a_toqui_tt:0 "Benzersiz bir özelliğe sahip bir lider seçebileceğiz "
 CHL_embargo_strategies:0 "Ambargo Stratejileri"
 CHL_embargo_strategies_desc:0 "Diğer demokrasileri desteklemenin sadece asker göndermekten daha fazla yolu var ve zaman, ekonomik önlemlerin de aynı derecede güçlü olabileceğini kanıtladı. Bu yüzden dostlarımızın düşmanlarına ambargo uygulamalıyız, böylece savaşlarını sürdürmek için ihtiyaç duydukları bakır ve nitrattan onları mahrum bırakabiliriz."
 CHL_embargo_strategies_tt:0 "Dünyanın büyük §YDemokratik§! uluslarıyla savaş halinde olan tüm uluslara §YAmbargo§! uygulayacağız."
 CHL_embrace_indigenous_corporatism:0 "Yerli Korporatizmi Kucakla"
 CHL_embrace_indigenous_corporatism_desc:0 "Venancio Coñuepán Huenchual'ın Şili yerli el sanatları ve inşaatının eski yollarına dayanan korporatizm fikirleri, ülkemizdeki sanayiler için benimsenmeli ve resmi devlet politikası haline getirilmelidir. "
 CHL_empower_the_preparation_department:0 "Hazırlık Departmanını Güçlendir"
 CHL_empower_the_preparation_department_desc:0 "Darbemizin olabildiğince sorunsuz gitmesi için, sadece genel halkın desteğini sağlamakla kalmayıp, aynı zamanda sonunda gelecek gün için hazır insanlar, planlar ve lojistiğe sahip olmamız gerekiyor."
 CHL_enact_stricter_labor_laws:0 "Daha Sıkı İş Kanunları Uygula"
 CHL_enact_stricter_labor_laws_desc:0 "İş kanunları şu anda uygun bir demokratik toplum için çok gevşek ve şirketlerin ve kapitalistlerin Şili'nin yoksul işçi sınıfından yararlanamamalarını sağlamalıyız. Daha eşit bir gelecek için!"
 CHL_enact_universal_suffrage:0 "Genel Oy Hakkını Yürürlüğe Koy"
 CHL_enact_universal_suffrage_desc:0 "Oy hakkı her demokratik toplumun temelidir ve ülkemizdeki herkesin bir diğeriyle aynı haklarla oy kullanamaması büyük bir utançtır. Eşitlik için çabalamalı ve Şili kadınlarına en kısa sürede oy kullanma fırsatı vermeliyiz."
 CHL_endorse_the_constitution:0 "1925 Anayasasını Onayla"
 CHL_endorse_the_constitution_desc:0 "1920'lerde eski yönetici sınıfın prestijini kaybetmesine ve Arturo Alessandri liderliğindeki bir hükümetin yükselişine yol açan ciddi bir sosyal ve ekonomik kriz yaşadık. 1924'te bir darbeyle devrildi, ancak 1925'te geri çağrıldı, ardından başkanlığını 1833 Anayasası'nın yerine geçecek yeni bir anayasa taslağı hazırlamak için kullandı. Yeni Şili'nin kurucu babası olarak onun yol gösterici sözlerini takip etmeye çalışmalıyız."
 CHL_enforce_stricter_secularism:0 "Daha Sıkı Laikliği Uygula"
 CHL_enforce_stricter_secularism_desc:0 "Liberal anayasada zaten laikliği kurduk, ancak kilise hala hem halk hem de seçkin politikacılar üzerinde çok fazla güce sahip. Bu nedenle, siyasete katılmak isteyen herkesten siyasetteyken dinden uzak durmalarını talep etmeliyiz."
 CHL_enforce_the_chilean_identity:0 "Yeni bir Şili Kimliği Oluştur"
 CHL_enforce_the_chilean_identity_desc:0 "Mevcut durumda, Şili halkı bölünmüş durumda ve onları bayrağımız altında birleştirmek için bir şeyler yapmalıyız. İspanyol, Mapuçe, Şilili, onlar farklı değil, çünkü hepsi bizim vatandaşımız ve onlar aynı. Bazıları mesajımızı reddedebilir, ancak genel olarak yeni Şili kimliği çoğunluğu memnun etmeli."
 CHL_enforce_the_chilean_identity_tt:0 "Ulusal ruh §Y$CHL_ancestral_mapuche_resistance$§! kaldırıldığında, [950.GetName] üzerinde çekirdeği geri kazan."
 CHL_enlarge_the_textile_industries:0 "Tekstil Sanayilerini Genişlet"
 CHL_enlarge_the_textile_industries_desc:0 "Tekstil her zaman ülke genelinde büyük ölçüde üretilmiştir ve bugün de farklı olmamalıdır. Devlet, yeni tekstil sanayilerinin açılmasını sübvanse etmeli ve benzer düşünen uluslarla ticaret yolları kurmaya çalışmalıdır."
 CHL_enter_patagonia:0 "Patagonya'ya Gir"
 CHL_enter_patagonia_desc:0 "Eğer Arjantinliler bize bir saniye bile inanırlarsa, bu onları kandırdığımızın ve korkuttuğumuzun kanıtıdır. Birliklerimizin Patagonya'ya girme ve ne olduğunu anlamadan sert bir darbe indirme zamanı geldi."
 CHL_escalate_the_laguna_del_desierto_issue:0 "Laguna del Desierto Sorununu Tırmandır"
 CHL_escalate_the_laguna_del_desierto_issue_desc:0 "Laguna del Desierto etrafındaki sınır çizgisi çok belirsiz ve aynı zamanda Arjantinliler lehine taraflı. Bölgenin haklı olarak bize ait olan kısmını işgal etmek için harekete geçmeli ve belki biraz daha ileri gitmeliyiz."
 CHL_establish_a_royal_guard:0 "Bir Kraliyet Muhafızı Kur"
 CHL_establish_a_royal_guard_desc:0 "Hiçbir kral, yanında büyük hizmetkar ve muhafız ordusu olmadan tamamlanmış sayılmaz ve ne yazık ki Antoine III'te tam da bu eksik. Bu nedenle, mümkün olan en kısa sürede bir kraliyet muhafız birimi kurmak en yüksek öncelik olarak kabul edilmelidir."
 CHL_establish_corfo:0 "CORFO'yu Kur"
 CHL_establish_corfo_desc:0 "Sanayi geliştirme, kaynak dağıtımı ve yeniden yapılanma çabalarından sorumlu olabilecek bir örgüt kurmaya çalışmalıyız. Adı Corporación de Fomento de la Producción de Chile olabilir."
 CHL_establish_the_ministry_of_mining:0 "Madencilik Bakanlığını Kur"
 CHL_establish_the_ministry_of_mining_desc:0 "Ayrıca, madenlerin nerede oluşturulduğunu ve nasıl işletildiğini merkezi olarak kontrol edebilmemiz için ülkemizin madencilik operasyonlarından sorumlu ulusal bir bakanlık da kurmalıyız."
 CHL_establish_the_royal_mountaineers:0 "Kraliyet Dağcılarını Kur"
 CHL_establish_the_royal_mountaineers_desc:0 "Güney And Dağları ülkenin belirleyici bir özelliğidir ve devletimizin dağcıları, ülkemizin dayandığı temeli oluşturan seçkin kuvvetlerdir. Bu örgütü genişletmeli ve ihtiyaç duyabilecekleri tüm teçhizatı aldıklarından emin olmalıyız."
 CHL_establish_trade_relationships:0 "Faydalı Ticaret İlişkileri Kur"
 CHL_establish_trade_relationships_desc:0 "Ticaretin başarılı olması için birden fazla gereklilik vardır ve talep gören kaynaklara sahip olmak tek gereklilik değildir. Ayrıca güvenebileceğimiz ticaret ortaklarına ve emeğimizi ve doğal kaynaklarımızı çok ucuza satmayan sözleşmelere ihtiyacımız var. Bu nedenle, kiminle ticaret yaptığımızı bildiğimizden emin olmak için Amerika'daki kardeşlerimize yaklaşmalıyız."
 CHL_expand_mining_prospection_tt:0 "Zaten bu mineral kaynaklarından birini sağlayan her çekirdek eyalette §Y4£resources_strip|5 §Y$state_resource_steel$§!, £resources_strip|6 §Y$state_resource_chromium$§!, £resources_strip|4 §Y$state_resource_tungsten$§! veya £resources_strip|2 §Y$state_resource_aluminium$§! §!üretimi ekler. \nMevcut etkiler:"
 CHL_expand_southern_infrastructure:0 "Güney Altyapısını Genişlet"
 CHL_expand_southern_infrastructure_desc:0 "Şu anda Şili'nin en güney uçlarında neredeyse hiç gerçek altyapı yok ve hiç demiryolu hattı yok. Bu nedenle, güney liman kasabaları Punta Arenas ve Punta Delgada'yı demiryolu hatlarımızla birleştirmek için büyük çaba harcamalıyız."
 CHL_expand_the_agricultural_field:0 "Tarım Alanını Genişlet"
 CHL_expand_the_agricultural_field_desc:0 "Venancio Coñuepán Huenchual'ın modern fikirlerine rağmen, tarıma dayalı bir toplumun eski yollarına geri dönmek isteyen birçok kişi var, sadece bu sefer kişisel olarak kendi kendine yetemeyenler için daha fazla devlet müdahalesi olan bir toplum. Ulusal istikrarı iyileştirmek için halkımızın istediğini takip etmeliyiz."
 CHL_expand_the_department_of_provinces:0 "Vilayetler Departmanını Genişlet"
 CHL_expand_the_department_of_provinces_change_tt:0 "Daha önce kazanılan §YUlusal Ruhu§! değiştirir, hangi §YDepartmanın§! daha önce güçlendirildiğine bağlı olarak biraz farklı etkilerle."
 CHL_expand_the_department_of_provinces_coring_tt:0 "Şilili İrredantistler tarafından talep edilen §YEyaletleri Entegre Et§! kararının kilidini açar"
 CHL_expand_the_department_of_provinces_desc:0 "Vilayetler departmanı, Şili'nin tüm bölgelerini kontrol altında tuttuğumuzdan emin olmak için fazla mesai yapıyor, ancak onları tam olarak destekler ve genişletirsek, yabancı toprakları bile daha etkili bir şekilde yönetmek için onları kullanabiliriz."
 CHL_expand_the_forestry:0 "Ormancılığı Genişlet"
 CHL_expand_the_forestry_decision_tt:0 "§Y[950.GetName]§! ve §Y[279.GetName]§!'de §YOrmancılığı Genişlet§! kararlarının kilidini açar. \n"
 CHL_expand_the_forestry_desc:0 "Ülkemizin orta bölgeleri, özellikle Araucanía, kereste açısından zengindir. Bölgelerdeki sanayinin genişlemesine karşı çıkanlar olsa da, ülkemizin ekonomik güvenliği deneyimlemesini istiyorsak bu bir zorunluluktur ve kereste kazanmak ve arazileri temizlemek oraya ulaşmanın en hızlı yoludur."
 CHL_expand_the_investigations_police:0 "Şili Soruşturma Polisi"
 CHL_expand_the_investigations_police_desc:0 "Şili Soruşturma Polisi 1933'te kuruldu ve kolluk kuvveti olan Carabineros de Chile ile birlikte iki Şili polis teşkilatından biridir. Soruşturma Polisi, soruşturma alanlarını soruşturulan suça göre böler ve bununla birlikte uzman Dedektiflere sahip birkaç özel polis soruşturma birimine sahiptir."
 CHL_expand_the_mountain_regiments:0 "Dağ Alaylarını Genişlet"
 CHL_expand_the_mountain_regiments_desc:0 "Sahip olduğumuz en seçkin birlikler, ülkenin herhangi bir yerinde acımasız savaş için uygun olan özel dağcı alaylarımızdır. Generallerimizin bu birliklerle rotasyon yapmasını ve eğitim görmesini zorunlu kılmalı ve onlara ihtiyaç duyabilecekleri her türlü özel teçhizatı sağlamalıyız."
 CHL_expand_the_naval_arsenal:0 "Deniz Cephaneliğini Genişlet"
 CHL_expand_the_naval_arsenal_desc:0 "Arsenales de Marina güvenilir gemi üreticimizdir ve ayrıca filoyu son yıllarda başardığımız kadar iyi bir durumda tutmamıza yardımcı olurlar, bu da diğer herhangi bir Güney Amerika ülkesinin başardığı bakım kalitesini çok aşar. Şimdi savaşa hazırlanmak için fonlarını artırmalıyız."
 CHL_expand_the_officer_corps:0 "Subay Kadrosunu Genişlet"
 CHL_expand_the_officer_corps_desc:0 "Faşist veya sosyalist davalara sadık birçok subay vardı ve daha sonra hizmetimizden ayrıldılar. Bu yeni eksiklikle mücadele etmek için subay kadrosunu genişletmeli ve genç subayları yükseltmeliyiz."
 CHL_focus_on_cattle_and_wool:0 "Sığır ve Yüne Odaklan"
 CHL_focus_on_cattle_and_wool_desc:0 "Bugün ülkedeki en geniş iki hayvancılık alanı inekler ve koyunlardır ve bunu değiştirmeye çalışmak akıllıca olmaz. Bunun yerine uluslar genelindeki çiftçiler tarafından bu tür hayvanların satın alınmasını teşvik etmeliyiz."
 CHL_fortify_the_coastlines:0 "Kıyı Şeritlerini Tahkim Et"
 CHL_fortify_the_coastlines_desc:0 "Kıyı şeritlerimiz uzun ve ülke büyüklüğüne oranla muhtemelen dünyanın en uzunu. Bu nedenle, bir şekilde deniz savaşını kaybedersek, tüm ülkemiz açıkta kalır ve denizden saldırıya karşı savunmasız ve açık oluruz. Bu yüzden, herhangi bir deniz çıkarmasını püskürtebilecek büyük kompleksler inşa etmeliyiz!"
 CHL_found_national_steelworks:0 "Ulusal Çelik Fabrikaları Kur"
 CHL_found_national_steelworks_desc:0 "Ülkenin çeliğe şiddetle ihtiyacı var ve haritacılarımız yemyeşil Araucanía bölgesinin tam da buna sahip olduğunu buldu. Bu nedenle, bize sunulan ulusal kaynaklardan yararlanabilmemiz için yeni çelik fabrikaları kurmaya çalışmalıyız."
 CHL_found_national_steelworks_tt:0 "§Y[950.GetName]§!'de daha fazla §YÇelik§! kazanmak için §Y$CHL_expand_araucanian_steelworks_decision$§! kararının kilidini açar!"
 CHL_found_the_contraloria_general_de_la_republica:0 "Contraloría General de la República'yı Kur"
 CHL_found_the_contraloria_general_de_la_republica_desc:0 "Şili Sayıştayı, Şili Hükümeti'nin anayasal olarak özerk bir organı olacaktır. Merkezi ve merkezi olmayan sivil hizmetin tüm faaliyetlerinin yasal yönlerinin, yönetiminin, ön denetiminin ve son denetiminin kontrolünden, organizasyon biçimleri ne olursa olsun, yasa tarafından verilen diğer yetkilerin yanı sıra sorumlu olacaktır."
 CHL_government_mandated_contracts:0 "Hükümet Sübvansiyonlu Sözleşmeler"
 CHL_government_mandated_contracts_desc:0 "Daha fazla insanın çalışmasını ve üzerlerine düşeni yapmasını sağlamak için, sanayi sözleşmelerini sübvanse etmeyi ve maaşların bir kısmını kendimiz ödemeyi düşünmeliyiz. Bu şekilde, daha fazla şirket daha fazla işe almaktan rahatlık duyabilir ve daha fazla insan harcayacak ve ekonomiye geri koyacak para alabilir."
 CHL_has_idea_near_anarchy:0 "Henüz §Y$idea_CHL_near_anarchic_society$§! ulusal ruhunu tamamen kaldırmadı"
 CHL_high_quality_nitrate:0 "Yüksek Kaliteli Nitrat"
 CHL_high_quality_nitrate_desc:0 "Sanayimiz şu anda en güçlüsü olmasa da, bizi diğerlerinden ayıran başka bir şey var. Bu şey, nitrat bolluğumuzdur ve dünya üretiminin büyük bir kısmı sınırlarımız içinde yer almaktadır. Böylece, en yüksek kaliteli malzemeye tek başımıza erişebildiğimizden emin olabiliriz, daha az rafine edilmiş nitratı satarken."
 CHL_hipanic_alliance_faction:0 "Hispanik İttifakı"
 CHL_hispanic_supremacy_pact_faction:0 "Hispanik Üstünlük Ligi"
 CHL_honor_the_legacy_of_caupolican:0 "Caupolicán'ın Mirasını Onurlandır"
 CHL_honor_the_legacy_of_caupolican_desc:0 "Caupolicán, on altıncı yüzyılda Mapuçe topraklarını işgal eden İspanyol Fatihlerine karşı halkının direnişine liderlik eden bir Toqui idi. Kıtamızı Avrupalı Emperyalistlerden kurtarmak istiyorsak, Caupolicán ve Lautaro gibi isimlere layık olmaya çalışmalıyız."
 CHL_host_german_intelligence:0 "Alman İstihbaratına Ev Sahipliği Yap"
 CHL_host_german_intelligence_desc:0 "Bolívar Operasyonlarında Almanlar, güneyden Amerikalıları gözetlemeye çalışıyorlar ve casusları konuşlandırdıkları ve Abwehr'in hükümetimizle daha yakın çalışmasına izin verdikleri sürece onlara büyük miktarda ilginç bilgi sağlayabiliriz."
 CHL_host_spanish_refugees:0 "İspanyol Mültecilere Ev Sahipliği Yap"
 CHL_host_spanish_refugees_desc:0 "İspanya'daki kardeşlerimiz arkadaşlarıyla ve aileleriyle savaştılar ve ruhen paramparça oldular. Şimdi iç savaşları bittiğine göre, birçoğu mevcut rejimlerinden kaçmak istiyor ve bir İspanyol kardeşi olarak, mültecileri kabul etmek için birinci sınıf bir adayız."
 CHL_hub_of_the_world_revolution:0 "Dünya Devriminin Merkezi"
 CHL_hub_of_the_world_revolution_desc:0 "Dünyanın mevcut durumundan memnun olmayan ve daha da önemlisi, Sovyetler Birliği'nin durumundan hayal kırıklığına uğramış olabilecek birçok devrimci var. Birlikte daha büyük bir dünya için çabalamalıyız!"
 CHL_hub_of_the_world_revolution_tt:0 "Diğer ülkelerden komünist danışmanlar, anavatanlarının siyasi durumuna bağlı olarak [CHL.GetName]'e transfer olacak. Şu anda bu danışmanlar [CHL.GetName]'e transfer olacak:"
 CHL_ibanez_as_prime_minister:0 "Başbakan olarak Ibáñez"
 CHL_ibanez_as_prime_minister_desc:0 "Antoine III'ün tamamen tek başına yönetemeyeceğine şüphe yok, çünkü Ibáñez'in sahip olduğu devlet adamlığı ve bilgiden yoksun. Bu nedenle, monarşi anayasal olmalıdır."
 CHL_ibanez_as_prime_minister_tt:0 "§YCarlos Ibáñez del Campo§!'yu danışman olarak işe alır"
 CHL_ibanezs_coup:0 "Ibáñez'in Darbesi"
 CHL_ibanezs_coup_desc:0 "Eski Başkan ve General Carlos Ibáñez del Campo, kaybettiği başkanlığını geri kazanmayı uzun zamandır arzuluyor ve böyle bir şeyi güvence altına almak için gerekirse karanlık işler yapmaya istekli. Bu nedenle, onlara ulusun liderliğini vaat ettikleri sürece, muhafazakarlar ve faşistler tarafından ortak bir darbeyi desteklemeye istekli olacaktır."
 CHL_impose_new_taxes:0 "Yeni Vergiler Koy"
 CHL_impose_new_taxes_desc:0 "Ülkeyi eski haline döndürme çabalarından sonra kasamız boşaldı ve bunu hafifletmeye yardımcı olmak için iyi bir plan, nüfusumuza yeni gelir vergileri koymak olacaktır. İlk başta hoşlanmayabilirler, ama biraz zaman verin, ve biz harcayacak çok daha fazla paramız varken onlar sakinleşecekler."
 CHL_incorporate_machi_into_the_army:0 "Machi'yi Orduya Dahil Et"
 CHL_incorporate_machi_into_the_army_desc:0 "Machi, dinimizdeki geleneksel şifacılar ve dini liderlerdir ve geleneksel tıbbi zanaatlarıyla tanınırlar. Birliklerimizin savaşta sağlığını sağlamak için her tümenin en az bir tane olduğundan emin olmalıyız."
 CHL_increase_presidential_powers:0 "Başkanlık Yetkilerini Artır"
 CHL_increase_presidential_powers_desc:0 "Ülkeyi yönetmek için gereken tek kişi başkandır, çünkü güçlü bir adam parçalanmış ve zayıf bir meclisten daha iyidir. Başkan meclistir ve onların siyasi katılımına gerek yoktur."
 CHL_increase_spending_on_public_works:0 "Kamu İşlerine Harcamaları Artır"
 CHL_increase_spending_on_public_works_desc:0 "Alessandri'nin başkanlığı sırasında kanıtladığı bir şey varsa, o da kamu işlerinin ekonomiyi canlandırmanın harika bir yolu olduğudur."
 CHL_indigenous_union:0 "Amerikan Yerli Halkları Birliği"
 CHL_inflation_control_by_the_central_bank:0 "Banco Central de Chile tarafından Enflasyon Kontrolü"
 CHL_inflation_control_by_the_central_bank_desc:0 "Banco Central de Chile, başkan Arturo Alessandri tarafından 1925'te kuruldu. Onları, enflasyonun şu anda istenen bir seviyede kalmasını sağlamakla görevlendirmeliyiz, böylece bütçe istendiği gibi dağıtılabilir ve halk mümkün olduğunca mutlu tutulabilir."
 CHL_inflitrate_the_carabinieros:0 "Carabineros'a Sız"
 CHL_inflitrate_the_carabinieros_desc:0 "Carabineros de Chile, ülkeyi herhangi bir isyancıya karşı korumakla görevlidir, biz de onlardan sayılırız. Onlara karşı gidersek, kesinlikle bir kan gölü olur, ancak sadakatlerini kazanırsak, kesinlikle çok kullanışlı bir piyon olurlar."
 CHL_international_loans:0 "Uluslararası Krediler"
 CHL_international_loans_desc:0 "Eski başkanımız Carlos Ibáñez del Campo, yabancı güçlerden kredi kullanarak ve parayı devlete yatırarak ekonomik krizi çözmeye çalıştı, daha sonra geri ödeyebileceği kadar değer üretebilmeyi umuyordu ve bu strateji bir şekilde başarılı oldu. Onun adımlarını takip etmeye çalışmalı ve bir kez daha aynısını yapmalıyız."
 CHL_introduce_the_franc:0 "Frank'ı Tanıt"
 CHL_introduce_the_franc_desc:0 "Şili Pesosu zayıf ve başarısız, ayrıca eski Şili devletiyle ilişkilendiriliyor. Ulusun iyiliği için bu para biriminin yerine Frank'ı getirmeye çalışmalıyız."
 CHL_invest_in_shipping:0 "Gemiciliğe Yatırım Yap"
 CHL_invest_in_shipping_desc:0 "Denizler sadece askeri amaçlar için iyi değildir. Büyük ölçüde ticarete bağımlı bir ülke ve aynı zamanda Rapa Nui gibi denizaşırı bölgelere sahip bir ülke olarak, ticari denizciliği genişletmeli ve gemicilik endüstrisinin genişlemesine fon yatırmalıyız."
 CHL_invite_carlist_refugees:0 "Carlist Mültecileri Davet Et"
 CHL_invite_carlist_refugees_desc:0 "İspanya'daki Carlistler, monarşinin diğer meraklıları olarak bize yakındır. Evlerinden kovulduklarını görünce, onlara burada sığınak sunarak onların lütfunu kazanabiliriz."
 CHL_invite_french_academia:0 "Fransız Akademisini Davet Et"
 CHL_invite_french_academia_desc:0 "Ülkemizin insanlarının öğrenmesi ve harika şeyler başarması ve ülkemizin küresel bir sahnede rekabet etmesi için ihtiyaç duyduğu atılımlara ulaşması için, anakaradan Fransız Akademisini eğitmek ve organize etmek için davet etmeliyiz."
 CHL_invite_french_aristocracy:0 "Fransız Aristokrasisini Davet Et"
 CHL_invite_french_aristocracy_desc:0 "Hacienda ve Inquilinaje Sistemi ile ilgili iç sorunlarla mücadele etmek için, yeni Fransız aristokrasisini getirmeli ve ülkenin soyluluğunun nasıl işlediğini yeniden işlemeliyiz."
 CHL_issue_bonds:0 "Tahvil Alımlarını Teşvik Et"
 CHL_issue_bonds_desc:0 "Son ekonomik çöküşün anıları, halkımızı paralarını yatırma konusunda çok korkuttu ve bu da ekonomik büyümeyi engelliyor. Halkımızı, parayı ülkeye geri yatırma sözüyle hükümet tarafından çıkarılan tahvilleri satın almaya teşvik ederek, daha güçlü bir [CHL.GetName] inşa edebiliriz."
 CHL_je_suis_le_deluge:0 "Je Suis Le Deluge"
 CHL_je_suis_le_deluge_desc:0 "Bir zamanlar, tufanın bir gün geleceğini söylediler ve o gün bugün. Biz tufanız, yozlaşmış dünya düzenini yok edecek ve yeni bir çağ getirecek olanlarız!"
 CHL_je_suis_le_deluge_tt:0 "§YAntoine III§!, §YFransa ve Amerikaların Gerçek İmparatoru§! özelliğini kazanır!"
 CHL_joint_development_and_research:0 "Ortak Geliştirme ve Araştırma"
 CHL_joint_development_and_research_desc:0 "Artık daha yakın çalıştığımıza göre, birbirimize yatırım yapabilir ve her üye devletten araştırmacıları alarak daha iyi birlikte çalışacak laboratuvarlara ev sahipliği yapabiliriz."
 CHL_joint_development_programs:0 "Ortak Geliştirme Programları"
 CHL_joint_development_programs_desc:0 "Artık müttefik olduğumuza göre, her bir ulusumuzu daha iyi geliştirmek için karşılıklı olarak yeni fabrikalar inşa etmeye çalışmalıyız."
 CHL_joint_invasion_of_mexico:0 "Meksika'nın Ortak İşgali"
 CHL_joint_invasion_of_mexico_desc:0 "Artık yeni Fransız İmparatorluğu ile bir ittifak sağladığımıza göre, bir zamanlar başarısız olduğumuz şeyi yeniden canlandırma zamanı geldi. Meksika İmparatorluğu yeniden yükselmeli, yoksa hepimiz Amerikalıların gücüne karşı düşeceğiz!"
 CHL_joint_research_initiatives:0 "Ortak Araştırma Girişimleri"
 CHL_joint_research_initiatives_desc:0 "Artık müttefik olduğumuza göre, dünyanın kapitalistlerinin ve emperyalistlerinin yeteneklerinin ötesinde silahların geliştirilmesini daha da ilerletmek için karşılıklı olarak laboratuvarlar ve araştırma işbirliği programları kurmaya çalışmalıyız."
 CHL_joint_research_initiatives_tt:0 "§YŞili§! ve bizimle bir ittifaktaki her ülke, bir §YTeknoloji Paylaşım Grubuna§! katılacak!"
 CHL_kickstart_the_arsenal_of_democracy:0 "Demokrasinin Cephaneliğini Harekete Geçir"
 CHL_kickstart_the_arsenal_of_democracy_desc:0 "Yakın gelecekte büyük bir çatışmaya sürüklenebileceğimiz muhtemel görünüyor ve böyle bir durumda yok olmamamız için askeri sanayi kuruluşlarımızı hızla genişletmeliyiz."
 CHL_la_corporacion_araucania:0 "La Corporación Araucana"
 CHL_la_corporacion_araucania_desc:0 "Ünlü bir Abajino savaş şefinin torunu olan muhafazakar ve korporatist Venancio Coñuepán Huenchual liderliğindeki Araucanía Şirketi, Şili devletine karşı toplanmak için faydalı bir müttefik olabilir."
 CHL_la_federacion_araucania:0 "La Federación Araucana"
 CHL_la_federacion_araucania_desc:0 "Mapuçe gelenekçisi Manuel Aburto Panguilef liderliğindeki Araucanía Federasyonu, modern Şili toplumuyla işbirliği yapmaya şiddetle karşıdır ve bağımsızlık hareketimize dahil edilmesi kolay olacaktır."
 CHL_la_moderna_araucania:0 "La Moderna Araucanía"
 CHL_la_moderna_araucania_desc:0 "La Moderna Araucanía, Şili'de kurulan ilk Mapuçe örgütlerinden biriydi ve eğitim ve ilerlemeye vurgu yapıyordu. Onları hareketimize entegre etmeye ve uzmanlıklarını mümkün olan en iyi şekilde kullanmaya çalışmalıyız."
 CHL_land_reforms:0 "Toprak Reformları"
 CHL_land_reforms_desc:0 "Hacienda - Inquilinaje Sistemi son derece modası geçmiş ve toplumumuzdaki sosyal sınıflar arasında büyük bir bölünmeye neden oluyor. Hacendadoların topraklarını yeniden dağıtmak ve bu vahşi serflik sistemini kesin olarak sona erdirmek için çabalamalıyız!"
 CHL_law_of_permanent_defense:0 "Kalıcı Savunma"
 CHL_law_of_permanent_defense_desc:0 "$CHL_law_of_permanent_defense_of_democracy_desc$"
 CHL_law_of_permanent_defense_of_democracy:0 "Demokrasinin Kalıcı Savunma Yasası"
 CHL_law_of_permanent_defense_of_democracy_desc:0 "Komünist tehdit sadece bizim üzerimizde değil, tüm dünyanın üzerinde beliriyor. Kesinlikle ortaya çıkacak olan soğuk savaş sırasında hayatta kalacaksak, komünistlerin rejimimizi devirip halkımızı tehdit etmesinin hiçbir yolu olmadığından emin olmalıyız."
 CHL_liberate_the_caribbean:0 "Karayipleri Kurtar"
 CHL_liberate_the_caribbean_desc:0 "Karayiplerin tamamı Hispanik veya hatta Latin Amerikalı olmayabilir, ancak yine de bizim nüfuz alanımıza girmeli ve adaları kendimiz için güvence altına almak için her türlü önlemi almalıyız."
 CHL_look_to_tradition:0 "Geleneğe Bak"
 CHL_look_to_tradition_desc:0 "Arturo Alessandri spot ışıklarında zamanını geçirdi ve hala ulusun üzerinde asılı duran bariz sorunların hiçbirini çözmedi. Bu nedenle liberalizmden bir adım geri atmalı ve eskiden güvendiğimiz o güzel eski değerlere geri dönmeliyiz."
 CHL_low_cost_housing:0 "Düşük Maliyetli Konut"
 CHL_low_cost_housing_desc:0 "Ülkemizde yerinden edilmiş veya fakir olan birçok kişi var ve hala ulusumuzun insanları olan bu talihsiz ruhları desteklemek için elimizden gelenin en iyisini yapmalıyız. Bu nedenle, ulusal konut kuruluşları kurmalı ve düşecek kadar talihsiz olanları yakalayabilecek sosyal ağlar inşa etmeyi hükümet politikası haline getirmeliyiz."
 CHL_mapuche_reconcilliation_campaigns:0 "Mapuçe Uzlaşma Kampanyaları"
 CHL_mapuche_reconcilliation_campaigns_desc:0 "Mapuçeler, 19. yüzyılda Araucanía'nın fethinden bu yana hükümetlerimiz tarafından ağır bir şekilde kötü muamele gördü. Durumlarını iyileştirmek ve diğer Şilili vatandaşlarıyla barış içinde yaşayabilmelerini sağlamak için büyük adımlar atmalıyız."
 CHL_mapuche_reconcilliation_campaigns_tt:0 "§YMapuçe Anlaşmazlığını§! §GHafifletmek§! ve §GÇözmek§! için kararların kilidini açar!"
 CHL_militarize_the_state:0 "Devleti Militarize Et"
 CHL_militarize_the_state_desc:0 "Daha önce büyük savaşlar kazanabilmiş olsak da, ülkemiz şu anda başka bir büyük ölçekli çatışmaya hazır değil. Bu nedenle, kuvvetlerimizin bir kez daha savaşa hazır olmasını istiyorsak önce devleti militarize etmeliyiz."
 CHL_military_excercises:0 "Askeri Tatbikatlar"
 CHL_military_excercises_desc:0 "Ordu henüz savaşa tam olarak hazır değil ve Hispanik birleşme günü geldiğinde herhangi bir işe yaramadan önce kapsamlı bir şekilde eğitilmelidir."
 CHL_mobilize_the_veteran_legionaries:0 "Gazi Lejyonerleri Seferber Et"
 CHL_mobilize_the_veteran_legionaries_desc:0 "Kral Antoine III'ün yeni birlikleri eğitmek ve seferber etmeye yardımcı olmak için getirdiği Fransız Yabancı Lejyonerleri şimdi cephelerde umutsuzca ihtiyaç duyuluyor ve standart orduya alınmaları ciddi olarak düşünülmelidir."
 CHL_modern_conquistadors:0 "Conquistadores de Pedro de Valdivia"
 CHL_modern_conquistadors_desc:0 "Artık eski Şili Krallığı nihayet restore edildiğine göre, atalarımızı gerçekten onurlandırma ve ilk kraliyet valimiz, fatih Pedro de Valdivia'nın görevini üstlenme zamanı geldi. İleri, bilinmeyene doğru!"
 CHL_more_funds_or_the_propaganda_department:0 "Propaganda Departmanı için Daha Fazla Fon"
 CHL_more_funds_or_the_propaganda_department_desc:0 "Propaganda departmanımız, halkı bizim kurtarıcıları olduğumuza ikna etmek için fazla mesai yapıyor, ancak onlara fon sağlamazsak herhangi bir verimliliği sürdüremezler. Darbeye hazırlanmak için yozlaşmış politikacılar aracılığıyla fon aklamalıyız."
 CHL_more_funds_or_the_propaganda_department_tt:0 "§YKarşı-Devrimi Başlat§! odağını tamamlarken:\nİnsan Gücü §G+5000§!."
 CHL_nationalize_foreign_industries:0 "Yabancı Sanayileri Millileştir"
 CHL_nationalize_foreign_industries_desc:0 "Ülkemizde hala kalan kapitalistler, bir sonraki adımımızın ne olacağını anladıkça ter dökmeli. Sahip oldukları her türlü mülke el koymalı ve halka yeniden dağıtmalıyız."
 CHL_no_deluges_tt:0 "Bu, daha sonra ağaçta §YJe Suis Le Deluge§! odağını almanızı §Rengelleyecektir§!"
 CHL_no_more_advisors_tt:0 "Mevcut §YDanışmanlarımızın§! çoğunluğu §RKullanılamaz§! hale gelecek!"
 CHL_not_has_idea_near_anarchy:0 "§Y$idea_CHL_near_anarchic_society$§! ulusal ruhunu tamamen kaldırdı"
 CHL_offer_to_protect_pitcairn:0 "Pitcairn Adası'nı Korumayı Teklif Et"
 CHL_offer_to_protect_pitcairn_desc:0 "[270.GetName]'nin mevcut savunması umduğumuzdan daha zayıf ve düşmanlarımızın onu ele geçirip Paskalya Adası'nı ve nihayetinde anavatanımızı işgal etmek için bir hazırlık üssü olarak kullanma fırsatını doğuruyor. Kendi güvenliğimiz için adanın korunmasını üstlenmeyi teklif etmeliyiz."
 CHL_one_more_fascist_focus_done_tt:0 "Darbeden kaynaklanan olumsuz etkileri §GAzaltır§!\n Savaş Desteği: §G+%5§!\n İstikrar: §G+%5§!"
 CHL_organize_patriotic_leagues:0 "Vatansever Ligleri Organize Et"
 CHL_organize_patriotic_leagues_desc:0 "Vatansever ligler, bir zamanlar Santiago ve Buenos Aires sokaklarında dolaşan faşist mafya sendikalarıydı ve onları yeniden kurmak için çaba göstermeliyiz, aynı zamanda bir zamanlar yaptıkları gibi bağımsız çalışmak yerine hükümetimize sadık kalmalarını sağlamalıyız."
 CHL_outlaw_socialism:0 "Sosyalizmi Yasadışı İlan Et"
 CHL_outlaw_socialism_desc:0 "Ibáñez'in diktatörlüğüne karşı çıkan birçok kişi var, ancak hiçbiri sosyalistler kadar inatçı değil. Bu nedenle, ulusu onlardan, er ya da geç kurtarmalıyız."
 CHL_policies_of_arturo_alessandri:0 "Arturo Alessandri'nin Politikaları"
 CHL_policies_of_arturo_alessandri_desc:0 "Alessandri'nin politikaları çoktur ve son dönemi daha bitmedi bile. Ulusa büyük ölçüde yardım etti ve hala daha fazla yardım etme gücüne sahip. Gerçekten de Şili'nin son enkarnasyonunun babasıdır."
 CHL_preemtively_strike_foreign_revolutionaries:0 "Yabancı Devrimcilere Önleyici Saldırı"
 CHL_preemtively_strike_foreign_revolutionaries_desc:0 "Ulusumuzu iç komünist tehditlere karşı güvence altına almış olabiliriz, ancak hala dış tehditler mevcut. Devrimlerini bize getiremeden önce onlara önleyici bir saldırı yapmalıyız."
 CHL_preemtively_strike_foreign_revolutionaries_tt:0 "Güney Amerika'daki tüm §Ykomünist§! uluslara karşı kukla §Ysavaş hedefi§! kazan"
 CHL_press_our_demands:0 "Taleplerimizi İleri Sür"
 CHL_press_our_demands_desc:0 "Artık Guyanaların tamamını elimizde tuttuğumuza göre, taleplerimizi uygulayabilir ve onları Emperyalistlerin pençesinden söküp alabilir ve bölgenin eski işgalcileriyle barış aramaya çalışabiliriz."
 CHL_press_our_demands_tt:0 "Guyanaların yasadışı işgalcilerine, eyaletler üzerindeki §YSahipliğimizi Uygulama§! taleplerini gönderir"
 CHL_privatize_national_industries:0 "Ulusal Sanayileri Özelleştir"
 CHL_privatize_national_industries_desc:0 "Ulusal sanayiler şu anda zayıf ve etkisizdir ve onları her bir yerel sanayi kompleksini daha iyi yönetebilecek özel grupların eline geçirmek için çabalamalıyız."
 CHL_proliferate_national_populism:0 "Ulusal-Popülizmi Yay"
 CHL_proliferate_national_populism_desc:0 "Sivil halk her şey kadar önemlidir, özellikle de darbe gerçekleştikten sonra devletimizi istikrara kavuşturmak istiyorsak. Gerekirse dolaylı yollarla onların desteğini kazanmalıyız!"
 CHL_proliferate_national_populism_tt:0 "§YKarşı-Devrimi Başlat§! odağını tamamlarken:\nPolitik Güç §G+75§!."
 CHL_promote_broad_anti_americansim:0 "Geniş Çaplı Anti-Amerikancılığı Teşvik Et"
 CHL_promote_broad_anti_americansim_desc:0 "Amerikalıların hepsi aşağılık, bizi beyazlatana kadar kanımızı emdiler, sanki haklarıymış gibi elimizdeki her şeyi aldılar ve bu kadar yaygara yapmalarına rağmen karşılığında hiçbir şey almadık, Amerikalılar bizim için ne yaptı ki? Tekrarlıyorum, Amerikalılar bizim için ne yaptı ki!?"
 CHL_promote_immigration_to_chile:0 "$BRA_promote_immigration_to_brazil$"
 CHL_promote_immigration_to_chile_desc:0 "[CHL.GetName], ataları dünya geneline yayılan insanlarla çeşitli bir ulustur. Ekonomimiz bir kez daha büyürken ve dokunulmayı bekleyen bol miktarda kaynak varken, daha fazla insanı buraya taşınmaya ve kendilerine de [CHL.GetAdjective] demeye teşvik etme zamanı geldi."
 CHL_promote_pan_hispanic_rhetoric:0 "Pan-Hispanik Retoriği Teşvik Et"
 CHL_promote_pan_hispanic_rhetoric_desc:0 "Hepimiz bireyiz. Ama yine de, Hispanik halk olarak ruhta ve kanda birleşmiş durumdayız ve doğuştan gelen hakkımızı talep etme ve halkımızı birleşik tutmak isteyen herhangi bir emperyalisti devirme zamanı geldi."
 CHL_prop_up_gustavo_ross:0 "Gustavo Ross'u Destekle"
 CHL_prop_up_gustavo_ross_desc:0 "Gustavo Ross, Arturo Alessandri'nin en önde gelen mürididir ve yaklaşan başkanlık seçimini kazanma favorisidir. Bu nedenle Alessandri, bunu halka duyurmalı ve büyük miktarda propaganda kullanarak Ross'u manevi halefi olarak inşa etmeye çalışmalıdır."
 CHL_propose_closer_cooperation:0 "Daha Yakın İşbirliği Öner"
 CHL_propose_closer_cooperation_desc:0 "Çevremizdeki komünist devletler ideolojimizi paylaşabilir, ancak stratejik olarak dağınıklar ve koordinasyonları yok. onları kanatlarımızın altına almalı ve daha iyi yönlendirmelerine yardımcı olmalıyız."
 CHL_propose_closer_cooperation_tt:0 "§YGüney ve Orta Amerika§!'daki tüm §YKomünist Uluslara§! bir olay gönderir ve bize boyun eğmelerini talep eder"
 CHL_protect_the_easter_island:0 "Paskalya Adası'nı Koru"
 CHL_protect_the_easter_island_desc:0 "Yerel halk tarafından Rapa Nui olarak da bilinen Paskalya Adası, batıdaki faşistler tarafından sürekli tehdit ediliyor. Sadece adayı tahkim etmek ve limanlarını inşa etmekle kalmayıp, aynı zamanda Pasifik Okyanusu'na hak iddia eden herkese önleyici bir saldırıda bulunmak için harekete geçmeliyiz."
 CHL_protect_the_easter_island_tt:0 "§Y[JAP.GetName]§!, §Y[NZL.GetName]§!'ye karşı §YDevlet Hükümeti Savaş Hedefi§! alacağız veya §Y[AST.GetName]§! eğer §YBağımsız§! ve §YFaşist§! veya §YBağlantısız§! iseler ve bir ülke ile savaş halindelerse §YAmerikan Demokrasisi§!"
 CHL_public_works:0 "Kamu İşleri Projeleri"
 CHL_public_works_desc:0 "ABD'nin sınırlarını kapatması ve ihracatını sona erdirmesinden bu yana gelen büyük çöküşten beri ekonomimiz mahvoldu ve halkımız dağıldı. Bu felaketten mümkün olduğunca verimli bir şekilde kurtulmak için, halkımızın tekrar iş bulabilmesi ve ekonominin tekrar canlanması için Amerika'nın Yeni Anlaşması'na benzer büyük ölçekli kamu işleri programlarını teşvik etmeliyiz."
 CHL_push_past_the_darien_gap:0 "Darién Geçidi'ni Aş"
 CHL_push_past_the_darien_gap_desc:0 "Kolombiya ve Panama arasındaki Darién geçidini geçmek zor olabilir, ancak Amerika sınırına ulaşmak ve sonunda oradaki kardeşlerimizi kurtarmak istiyorsak bu gereklidir."
 CHL_rally_the_people:0 "Halkı Topla"
 CHL_rally_the_people_desc:0 "Darbe hazır ve nazır. Şimdi gereken tek şey halkı galeyana getirmek ve liberal hükümete zamanlarının sona erdiğini bildirmektir. Bu sefil devlete bir son verme zamanı geldi!"
 CHL_reapproach_america:0 "Amerika'ya Yeniden Yaklaş"
 CHL_reapproach_america_desc:0 "Büyük Buhran başladığında ABD bizimle olan ilişkilerinin çoğunu kesti ve ilişkilerimiz henüz tam olarak çözülmedi. Bu nedenle Başkan ve Kongre, onlarla ilişkileri derhal yeniden kurmak için ortak bir çaba göstermelidir."
 CHL_reapproach_america_tt:0 "§YAmerika Birleşik Devletleri§!'nden §YSilah Satın Al§! kararlarının kilidini aç"
 CHL_reclaiming_quebec:0 "Québec'i Geri Almak"
 CHL_reclaiming_quebec_desc:0 "Québec'teki Frankofon kardeşlerimizin yabancı baskı ve işgal pençesinden kurtarılması ve dünyadaki Anglofon hegemonyasına karşı silah arkadaşlarımız olarak değer görmeleri gerekiyor. Onları şimdi kurtarmalıyız!"
 CHL_reclaiming_quebec_tt:0 "Kararın kilidini açar: §YQuébec'i Entegre Et§!"
 CHL_recruit_young_officers:0 "Genç Subayları İşe Al"
 CHL_recruit_young_officers_desc:0 "Ülkemizdeki yüksek mevkilerdeki birçok generalin daha sol eğilimli sempatileri vardı ve şimdi kontrolü ele aldığımıza göre birkaçı dışında hepsi istifalarını verdi. Saflardan vatansever ve fanatik genç subayları yükseltmeli ve eski çürümüş üstlerinin yerini almalarını sağlamalıyız."
 CHL_recruit_young_officers_tt:0 "Bazı Genç Subaylar §YGeneralliğe§! terfi ettirilecek!"
 CHL_reestablish_the_republican_guard:0 "Cumhuriyet Muhafızlarını Yeniden Kur"
 CHL_reestablish_the_republican_guard_desc:0 "Artık tekrar saldırı altındayken, peşimize düşmeye karar veren üst düzey tehditle savaşmak için Cumhuriyet Muhafızları yeniden toplanmalıdır. Silah başına adamlar, cumhuriyetiniz için savaşın!"
 CHL_repeal_the_separation_of_church_an_state:0 "Kilise ve Devlet Ayrılığını Kaldır"
 CHL_repeal_the_separation_of_church_an_state_desc:0 "Kilise ve devlet arasındaki ayrılık büyük bir hataydı ve en kısa sürede geri alınmalıdır. Hepimizin çok iyi bildiği gibi, kilise bizim müttefikimizdir."
 CHL_request_assistance_in_the_war:0 "Savaşta Yardım Talep Et"
 CHL_request_assistance_in_the_war_desc:0 "Dünyada başka bir Avrupa dostu hükümetten fayda sağlayacak birçok ülke var. Hükümetimizin düşmanlarını yenmek için onların desteğini aramalıyız."
 CHL_request_assistance_in_the_war_tt:0 "Kabul edilirse, ülke iç savaş sırasında bize gönüllüler gönderebilecek ve bunu yapmaya daha meyilli olacaktır. "
 CHL_request_foreign_support:0 "Yabancı Destek Talep Et"
 CHL_request_foreign_support_desc:0 "Zaten bizimle benzer ideolojik eğilimlere sahip insanlar tarafından kontrol edilen birçok ülke var ve onların iyi tarafında olmak akıllıca olabilir. Bu sayede, darbemizi gerçekleştirmemize yardımcı olacak silah ve askerler isteyebiliriz."
 CHL_restore_the_old_kingdom:0 "Eski Krallığı Geri Getir"
 CHL_restore_the_old_kingdom_desc:0 "Artık bir zamanlar Peru Valiliği'nin bir parçası olan, talep edilen irredentist Şili Krallığı bölgesinin tüm topraklarını kontrol ettiğimize göre, bu toprakları bize entegre etme çabaları gösterebilir ve belki de bu tarihsel olarak talep edilen sınırların biraz daha ötesine geçebiliriz."
 CHL_return_to_the_continent:0 "Kıtaya Geri Dön"
 CHL_return_to_the_continent_desc:0 "Mevcut Fransız sisteminde doğuştan gelen bir zayıflık var ve biz bunu sömürmek için buradayız. Bir kez daha kıtaya dönme ve doğuştan gelen hakkımızı geri alma zamanı geldi!"
 CHL_return_to_the_parliamentary_era:0 "Parlamenter Döneme Geri Dön"
 CHL_return_to_the_parliamentary_era_desc:0 "Tek bir evrensel gerçek vardır, o da gücün yozlaştırdığı ve mutlak gücün kesinlikle yozlaştırdığıdır. Bu nedenle, çılgın bir başkanın ulusumuzun tüm geleceğini yönetememesi için parlamentonun mümkün olduğunca çok söz sahibi olduğundan emin olmalıyız."
 CHL_return_to_the_parliamentary_era_tt:0 "§YMiguel Cruchaga Tocornal§!'ı danışman olarak işe alır"
 CHL_revise_the_social_classes:0 "Sosyal Sınıfları Gözden Geçir"
 CHL_revise_the_social_classes_desc:0 "Artık tekrar kendi toplumumuza sahip olduğumuza göre, sosyal sınıfları görüşlerimize ve ideallerimize daha iyi uyacak şekilde yeniden yapılandırmanın tam zamanı. Avrupalıların zamanı yakında bitecek!"
 CHL_revoke_the_treaty_of_lima:0 "Lima Antlaşmasını İptal Et"
 CHL_revoke_the_treaty_of_lima_desc:0 "1929'da Tacna bölgesini Peru'ya geri veren Lima antlaşmasının meşruiyeti yoktu ve elimizin bu konuda zorlandığından başka bir açıklama olamaz. İşleri düzeltme ve toprağın iadesini talep etme zamanı geldi."
 CHL_rule_by_decree:0 "Kararname ile Yönetim"
 CHL_rule_by_decree_desc:0 "İlk başkanlığı sırasında, 1927'den 1931'e kadar, Ibáñez kararname ile yönetti ve diktatörlük yetkilerini kullandı. Şimdi, ülkeyi doğru yöne yönlendirmek için bir kez daha bunu yapmalı."
 CHL_ruler_of_the_inca:0 "İnka Hükümdarı"
 CHL_ruler_of_the_inca_desc:0 "Eski İnka İmparatorluğu büyüktü ve And Dağları'nın büyük bir bölümüne yayılmıştı. Bu devleti yeniden yaratmalıyız, ama yeni bir yönetim altında, bizim yönetimimiz altında."
 CHL_satellite_kingdoms:0 "Uydu Krallıkları"
 CHL_satellite_kingdoms_desc:0 "Büyük Napolyon, Antoine için büyük bir ilham kaynağıdır ve doktrinleri dünyanın tüm devlet adamları için böyle olmuştur. Onun yaptığı gibi yapmalı ve yerel halkın yeni efendileri hakkında çok fazla düşünmemesini sağlayan daha küçük tampon devletler yaratmalıyız."
 CHL_satellite_kingdoms_tt:0 "Tarihi topraklarını kontrol edersek §Y[INC.GetNameDef]§!, §Y[SUR.GetName]§! veya §Y[HAI.GetName]§!'i kukla olarak kurma seçeneğine sahip olacak §YUydu Krallıkları Kur§! Kararlarının kilidini açar."
 CHL_secure_the_brazilian_border:0 "Brezilya Sınırını Güvence Altına Al"
 CHL_secure_the_brazilian_border_desc:0 "Brezilya devleti, kıtada bizimle rekabet edebilecek az sayıdaki ülkeden biridir. Onlarla olan sınırımızı güvence altına almalıyız, böylece zamanı geldiğinde işgal etmek mümkün olduğunca kolay olur."
 CHL_seek_foreign_investments:0 "Yabancı Yatırım Ara"
 CHL_seek_foreign_investments_desc:0 "Ulusal sanayileri yeniden inşa etmek ve yardım etmek için yabancı güçlerden ödünç alınan fonları kullanmak Ibáñez için denenmiş ve doğrulanmış bir yöntemdir ve bu sefer de farklı değil."
 CHL_sell_arica_to_peru:0 "Arica'yı Peru'ya Sat"
 CHL_sell_arica_to_peru_civil_war_tt:0 "§RBu odağı ve $CHL_outlaw_socialism$ veya $CHL_utilize_national_populism$'den birini tamamlamak bir iç savaşa yol açacaktır.§!"
 CHL_sell_arica_to_peru_civil_war_tt_2:0 "§RBu odağı ve $CHL_sell_arica_to_peru$'yu tamamlamak bir iç savaşa yol açacaktır§!"
 CHL_sell_arica_to_peru_desc:0 "Ekonomik sorunları çözmeye yardımcı olacak büyük bir fon akışı elde etmenin harika bir yolu, Pasifik Savaşı sırasında Perululardan ve Bolivyalıllardan ele geçirilen toprak parçalarını onlara geri satmaktır."
 CHL_silverworking:0 "Gümüş İşçiliği"
 CHL_silverworking_desc:0 "Gümüş işçiliği her zaman Mapuçe halkının özel geleneksel el sanatlarından biri olmuştur ve özellikle Arjantinlilerden Puelmapu'yu geri aldıktan sonra büyük doğal gümüş yataklarına sahip olduğumuz için yüksek sınıf pahalı gümüş bibloları ihraç etmek kolay olacaktır."
 CHL_skip_one_line_tt:0 " \n"
 CHL_socialist_youth:0 "Bir Sosyalist Gençlik Örgütü"
 CHL_socialist_youth_desc:0 "Gençlikte sola ve sağa radikalleşen birçok kişi var. Özellikle sosyalistler değerlerini koruma konusunda oldukça sesli ve tutkulular ve bu nedenle büyük devletimizi tehdit eden herkese karşı savaşmaya istekliler."
 CHL_sociedad_caupolican_defensora_de_la_araucania:0 "Sociedad Caupolicán de la Araucanía"
 CHL_sociedad_caupolican_defensora_de_la_araucania_desc:0 "Manuel Manquilef liderliğindeki Araucanía'nın Caupolicán Savunucusu Derneği, şu anda en büyük Mapuçe örgütlerinden biridir ve başarılı bir devrimin temelidir. Grubun üyelerinin desteğini kazanmak en önemli öncelik olarak kabul edilmelidir."
 CHL_sponsor_american_revolutions:0 "Amerikan Devrimcilerini Sponsor Et"
 CHL_sponsor_american_revolutions_desc:0 "Devrimle başarılı olma potansiyeline sahip, ancak araçları amaca ulaştırmak için fonları veya silahları olmayan birçok insan var. Bu nedenle, bu tür devrimcileri sponsor ettiğimizden ve kapitalizmi Güney Amerika'dan attığımızdan emin olmalıyız."
 CHL_sponsor_american_revolutions_tt:0 "Diğer §YGüney ve Kuzey Amerika§! Ülkelerinde §Yİdeoloji Mitinglerini Sponsor Et§! kararlarının kilidini açar"
 CHL_sponsor_anti_colonialist_rebellions:0 "Anti-Sömürgeci İsyanları Sponsor Et"
 CHL_sponsor_anti_colonialist_rebellions_desc:0 "Bizim gibi düşünen, ancak kendi geleceklerini kontrol etme ve yönlendirme konusunda kendi kaderini tayin hakkına sahip olmayan insanlar var. Onları sömürgeci güçlerin pençesinden kurtarmalıyız."
 CHL_sponsor_anti_colonialist_rebellions_tt:0 "§YGüney ve Orta Amerika§!'daki sömürge eyaletlerinde direnişi artırmak için kararların kilidini açar!"
 CHL_state_catholicism:0 "Devlet Katolikliği"
 CHL_state_catholicism_desc:0 "Eski liberal hükümet, katolik kilisesini devletten ayırdı, şimdi büyük bir günah olarak kabul edeceğimiz bir şey. Bu büyük hatayı derhal geri almalıyız!"
 CHL_strengthen_control:0 "Kontrolü Güçlendir"
 CHL_strengthen_control_desc:0 "Gerçeği olduğu gibi göremeyen, Antoine'ın büyük rejimine karşı mücadele eden zayıf fikirli isyancılardan vilayetlerin kontrolünü geri almalıyız."
 CHL_strengthen_instituto_nacional:0 "Instituto Nacional'i Güçlendir"
 CHL_strengthen_instituto_nacional_desc:0 "Patria Vieja sırasında kadar erken kurulmuş olsa da, Instituto Nacional, ulusumuzun halkının ihtiyaç duyduklarını okuyabilmesini ve bizim için faydalı bir oranda ilerleyebilmemizi sağlamak için genişletilmeli ve güçlendirilmelidir."
 CHL_strengthen_the_carabinieros:0 "Carabineros de Chile'yi Güçlendir"
 CHL_strengthen_the_carabinieros_desc:0 "Carabineros de Chile, 1927'de Ibáñez'in kendisinden başkası tarafından kurulmadı ve örgütün büyük bir kısmı hala ona çok sadık. Bu nedenle, sadık olanların örgütte güce sahip olanlar olduğundan emin olmak faydalı olabilir."
 CHL_strengthen_the_central_bank:0 "Merkez Bankasını Güçlendir"
 CHL_strengthen_the_central_bank_desc:0 "Ekonomimizin sadece iyileşme etiketinden daha fazla gelişmesi için, başkan Arturo Alessandri tarafından kurulan Banco Central de Chile'yi güçlendirmeye çabalamalıyız. Uzun vadede bize yardımcı olmaları umuduyla, uygun gördükleri her şeyi yapmaları için onlara daha fazla özgürlük vereceğiz."
 CHL_strike_a_deal_with_the_mapuche:0 "Mapuçelerle Bir Anlaşma Yap"
 CHL_strike_a_deal_with_the_mapuche_desc:0 "Bir zamanlar Orélie-Antoine I'in Araucanía ve Patagonya'nın ilk kralı olmasına izin veren Mapuçelerdi ve onlarla olan bağlarımız sayesinde yeni Mapuçe örgütlerini yanımıza çekebiliriz."
 CHL_strike_down_south_american_fascism:0 "Güney Amerika Faşizmini Yok Et"
 CHL_strike_down_south_american_fascism_desc:0 "Güney Amerika'da faşizme ilgi duyan birçok kişi var ve bölgemizde güvenliğimizi tehdit eden kimsenin olmadığından emin olmalıyız, bu da onlarla bir arada yaşamayı zorlaştırıyor. Bu nedenle, bize herhangi bir zarar vermeyi düşünmeden önce onları yok etmeliyiz."
 CHL_support_for_the_international_revolution:0 "Uluslararası Devrime Destek"
 CHL_support_for_the_international_revolution_desc:0 "Dışarıda sadece evlerini işgal eden yabancı uluslara karşı değil, aynı zamanda geçim kaynaklarını alan yozlaşmış hükümetlere ve sanayilere karşı da savaşmak zorunda olan birçok kişi var. Dünya halkının güvende ve kötülükten korunmuş hissetmesini sağlamak için elimizden gelen her şeyi yapmalıyız."
 CHL_support_the_colonial_plan:0 "Sömürge Planını Destekle"
 CHL_support_the_colonial_plan_desc:0 "Alman Sömürge ofisi bir zamanlar Uruguay'daki devlet aygıtının kontrolünü hızla ele geçirmek ve bir sömürge kukla hükümeti kurmak için bir plan hazırlamıştı. Şimdi bunu gerçeğe dönüştürme gücümüz var ve Uruguay'ın ittifakımıza boyun eğmesini ve tarihte doğru tarafı seçmesini talep etmeliyiz."
 CHL_support_the_democracies:0 "Demokrasileri Destekle"
 CHL_support_the_democracies_desc:0 "Avrupa ve Amerika'daki demokrasiler zor durumda ve bir diğer demokratik ulus olarak onlara durumlarında mümkün olan her yolla yardım etmek bizim görevimizdir. Bu nedenle, diğer demokrasilerin çıkarlarını güvence altına almak için Şililileri göndermeliyiz."
 CHL_suppress_the_nacistas:0 "Nacistaları Bastır"
 CHL_suppress_the_nacistas_desc:0 "Movimiento Nacional-Socialista son zamanlarda hareket halinde ve yakın gelecekte bir şeyler deneyecekleri oldukça açık. Uyanık kalmalı ve nerede ortaya çıkarsa çıksın herhangi bir muhalefete karşı sert önlemler almalıyız."
 CHL_suppress_the_nacistas_tt:0 "Nacista Ayaklanması §GZayıflatılacaktır§!"
 CHL_sway_ariosto_hererra:0 "Ariosto Herrera'yı Etkile"
 CHL_sway_ariosto_hererra_desc:0 "General Ariosto Herrera'nın güçlü anti-sosyalist sempatilere sahip olduğu gösterildi, ancak bize ille de sadık değil. Onun ve en sadık adamlarının desteğini sağlamak akıllıca olur, çünkü saflarımızda onun gibi insanları kesinlikle kullanabiliriz."
 CHL_sway_ariosto_hererra_tt:0 "§YAriosto Hererra§! ve adamları darbemizde bize katılacak"
 CHL_syndicalize_the_production_sector:0 "Üretim Sektörünü Sendikalaştır"
 CHL_syndicalize_the_production_sector_desc:0 "Üretim sektörü şu anda verimsizlik ve sadece kendi karlarını düşünen zalim Hacendadolar tarafından rahatsız edilmektedir. Sanayileri sendikalaştırmalı ve gerçek bir falanjist kurumsal sanayi modelini ortaya çıkarmalıyız."
 CHL_taking_back_patagonia:0 "[CHL_taking_back_patagonia_key]"
 CHL_taking_back_patagonia_desc:0 "[CHL_taking_back_patagonia_desc_key]"
 CHL_taking_back_patagonia_kingdom:0 "Krallığı Yeniden Birleştir"
 CHL_taking_back_patagonia_kingdom_desc:0 "Kendimizi yeni Araucanía ve Patagonya Krallığı olarak ilan etmiş olmamıza rağmen, aslında krallığın büyük bir bölümünden, yani Patagonya'dan hala yoksunuz. Sahip olduğumuz azıcık meşruiyeti kaybetmemek için mümkün olan en kısa sürede krallığı yeniden birleştirmeye çalışmalıyız."
 CHL_taking_back_patagonia_mapuche:0 "Puelmapu'yu Geri Al"
 CHL_taking_back_patagonia_mapuche_desc:0 "Eski Mapuçe bölgesi Puelmapu, bugün Arjantin Patagonyası'nın büyük bir kısmı, hala yabancı baskısı altındadır ve önce kendi halkımızı başarıyla kurtarmayı başaramazsak başka hiçbir Amerikan Yerli Halkını kurtaramayız. Bu nedenle, etrafından dolaşmanın başka bir yolu olmadığı için savaşa gitmek zorunda kalacağız...."
 CHL_the_future_of_Chile:0 "[CHL.GetName]'nin Geleceği"
 CHL_the_future_of_Chile_desc:0 "Komünist parti, mevcut geniş koalisyonun tüm noktalarda tam olarak anlaşamaması nedeniyle, önümüzdeki yıllarda izlenecek yolu belirlemek amacıyla toplanmalıdır. Şu anda Marksist Elias Lafertte Gavino, Sosyalist Marmaduke Grove Vallejo, Stalinist Carlos Contreras Labarca ve Troçkist Manuel Hidalgo Plaza arasında bir seçim var."
 CHL_the_hispanic_alliance:0 "Hispanik İttifakı"
 CHL_the_hispanic_alliance_desc:0 "Halkımız devlette değil, dostluk ve işbirliği içinde birleşmeli ve Pan-Hispanik bir birlik ancak ittifak yoluyla var olabilir. İdeallerimizi paylaşan herkese ulaşmalı ve davaya olan sadakatlerini güvence altına almalıyız."
 CHL_the_latin_american_alliance:0 "Latin Amerika İttifakı"
 CHL_the_latin_american_alliance_desc:0 "Pan-Hispanizm çabaladığımız ve uğruna mücadele ettiğimiz şey olsa da, kıtamızda sadece Latin olmalarına rağmen Emperyalist baskıya karşı savaşmak için bize katılmak isteyenler hala var. Latin halkı birlikte güçlü olduğu için onları davet etmeliyiz."
 CHL_the_latin_american_alliance_tt:0 "§YHispanik Olmayan Latin Amerika§! uluslarını ittifakımıza davet eder"
 CHL_the_might_to_defend_our_homes:0 "Evlerimizi Savunma Gücü"
 CHL_the_might_to_defend_our_homes_desc:0 "Hayatlarımız sürekli olarak dünyanın büyük güçleri tarafından tehdit ediliyor ve halkımızın hükümetimiz tarafından korunduğunu hissetmesinin önemi abartılamaz. Savaşların asla kapımıza gelmemesi için kuvvetlerimizi güçlendirmeliyiz."
 CHL_the_nationalization_of_copper:0 "Bakırın Millileştirilmesi"
 CHL_the_nationalization_of_copper_desc:0 "Ulusumuzdaki geniş bakır yatakları şu anda özel madencilik şirketlerinin kontrolünde ve yatakların daha mantıklı olan hükümetimizin ve madencilik bakanlığının eline geçmesini sağlamalıyız."
 CHL_the_patagonian_giants:0 "Patagonya Devleri"
 CHL_the_patagonian_giants_desc:0 "Patagonlar veya Patagonya devleri, erken Avrupa anlatımlarında tarif edilen ve Patagonya'da yaşadığı söylenen dev insanlardan oluşan bir ırktı ve en azından normal insan boyunun iki katını aştıkları söyleniyordu. Bu söylentilerin doğru olmamasına rağmen, silahlı kuvvetlerimizin bu devlerin imajına uygun yaşamasını sağlamalı ve düşmanlarımızın gözlerine korku salmalıyız."
 CHL_the_path_to_conquest:0 "Fetih Yoluyla Birleşme"
 CHL_the_path_to_conquest_desc:0 "Eski fatihler gibi şanlı fetih eylemi, halkımızı bir araya getirecek olan şeydir, çünkü onlar parçası oldukları daha büyük resmi göremeyen egoist ve küçük milliyetçi hükümetlerin kontrolü altındadırlar. Hispanik halkı, zorla kurtarmalıyız!"
 CHL_the_popular_freedom_alliance:0 "Halk Özgürlük İttifakı"
 CHL_the_popular_freedom_alliance_desc:0 "Ülkede ideallerimizi paylaşan, ancak açıkça bunu söylemeye cesaret edemeyenler var. Bu nedenle, General Carlos Ibáñez del Campo'yu, muhafazakar değerlere hitap eden, ancak gizlice bizi destekleyen yeni bir koalisyon olan Alianza Popular Libertadora'ya liderlik etmeye ikna etmeliyiz."
 CHL_the_scouts_monarchist_youth_organization:0 "Kraliyet İzcileri"
 CHL_the_scouts_monarchist_youth_organization_desc:0 "Gençlere gerekirse savaş zamanı görevlerini nasıl yerine getireceklerini öğretebilecek ve halkımıza hayatta kalma ve savaş yollarını öğretebilecek bir paramiliter örgüt kurmalıyız."
 CHL_the_spirit_of_the_war_of_the_pacific:0 "Pasifik Savaşı'nın Ruhu"
 CHL_the_spirit_of_the_war_of_the_pacific_desc:0 "Birliklerimizin harekete geçmesini istiyorsak, onlara Peru ve Bolivya'ya karşı savaşılan Pasifik savaşı sırasındaki büyük başarılarımızı hatırlatmalıyız. Ayrıca bu fırsatı, Alman müttefiklerimizin bize vermeye istekli olabileceği belirli bölgeler üzerindeki iddialarımızı yeniden teyit etmek için de kullanabiliriz."
 CHL_the_straight_line:0 "Doğru Yolda Yürümek"
 CHL_the_straight_line_desc:0 "Deli Antoine III spot ışıklarındaki zamanını doldurdu. Anavatanda düzeni yeniden sağlamak ve Ibáñez'i Büyük Şili Devleti'nin yeni kralı olarak taçlandırmak için Doğru Çizgi'nin zamanı geldi."
 CHL_the_straight_line_tt:0 "Línea Recta, §YAntoine III§!'ü devirecek ve krallığı §YCarlos Ibáñez del Campo§!'ya devredecek!"
 CHL_the_true_enemy:0 "Gerçek Düşman"
 CHL_the_true_enemy_desc:0 "Amerika halkımızın tek gerçek düşmanıdır ve güneylerindeki Hispanikleri çok uzun süredir eziyorlar. Artık son hamleye hazır olduğumuza göre, yapmamız gereken tek şey o son adımı atmak."
 CHL_they_shall_not_pass:0 "Geçemeyecekler"
 CHL_they_shall_not_pass_desc:0 "Ülkemiz sadece Pasifik Savaşı'ndaki eski düşmanlarımız tarafından değil, aynı zamanda devasa bir sınırı paylaştığımız büyük komşumuz Arjantin tarafından da tehdit ediliyor. Onlara karşı savunmada uzaktan bile bir şansımız olmasını istiyorsak, onları dağlarda tutmalıyız. Geçemeyecekler ve asla teslim olmayacağız!"
 CHL_undermine_the_carabineros_de_chile:0 "Carabineros de Chile'yi Zayıflat"
 CHL_undermine_the_carabineros_de_chile_bonuses_tt:0 "§YMapuçe Bağımsızlık Savaşı§! başladığında:\nOrdu Deneyimi: §G+25§!.\nTemel Savaş Desteği Kazan: §G+%5.00§!."
 CHL_undermine_the_carabineros_de_chile_desc:0 "Carabineros de Chile bir zamanlar Başkan Carlos Ibáñez del Campo tarafından kuruldu ve hala ona çok sadıklar. Eğer bizim liderliğimizde bir devlet kurmaya çalışırsak, kesinlikle onun tarafına geçerler ve yolumuza çıkarlar. Bu nedenle, ileriye dönük olarak mümkün olduğunca az güce sahip olmalarını sağlamak için elimizden gelen her şeyi yapmalıyız."
 CHL_undermine_the_carabineros_de_chile_tt:0 "Bir §Yİç Savaş§! başladığında Ibáñez'in tarafının §YEk Carabineros De Chile§! tümenleri kazanmasını engeller"
 CHL_undo_colonialist_occupations:0 "Sömürgeci İşgalleri Geri Al"
 CHL_undo_colonialist_occupations_desc:0 "Sömürgeci güçler çok uzun süredir Hispanik Amerika'nın bir kısmını işgal etti ve onlara bulaşılmayacağını gösterme zamanı geldi. Orduyu gönderin!"
 CHL_undo_colonialist_occupations_tt:0 "§YBelize ve Panama Kanalı'nı İşgal Et§! kararlarının kilidini açar!"
 CHL_unified_by_will:0 "İrade ile Birleşmiş"
 CHL_unified_by_will_desc:0 "Amerikan Yerlileri ve Polinezya halkı şimdi Anti-Emperyalist çabalarımızla birleşti, ama bu yeterli değil. Eğer gelecek yüzyıllar boyunca Avrupalılardan gelen istilaları savuşturmak istiyorsak, bir araya gelmeli ve tüm halklarımız için, Avrupalılar tarafından yönetilmeyen bir devlete sahip olma irademizle birleşmiş, tek bir ulus oluşturmalıyız."
 CHL_unified_in_spirit:0 "Ruhta Birleşmiş"
 CHL_unified_in_spirit_desc:0 "Hepimiz ortak bir hedefi paylaştığımız için, iyi yağlanmış bir dişli gibi birlikte iyi çalışabiliriz. Bu nedenle, uluslarımızı birleştirmemekle birlikte, yine de birleşik ordular ve daha büyük bir koordinasyon için çabalamamız gerektiği belirtilmelidir. Amerika ve Pasifik halkları ruhta birleşmiştir ve her zaman yan yana duracaktır!"
 CHL_unified_in_spirit_tt:0 "Tüm §YAmerikan Yerli ve Polinezya Bağlı Devletleri§! de bu Ulusal Ruhu kazanacak"
 CHL_unify_the_fascist_movements:0 "Faşist Hareketleri Birleştir"
 CHL_unify_the_fascist_movements_desc:0 "Jorge González von Marées'in Movimiento Nacional-Socialista de Chile üzerinde sağlam bir kontrolü olmasına rağmen, hala onu takip etmeyen benzer fikirlere sahip başka gruplar var. Darbenin başarılı olabilmesi için Şilili faşistler için öncü bir şemsiye hareketine liderlik etmesi gerektiği teşvik edilmelidir."
 CHL_union_araucana:0 "Unión Araucana"
 CHL_union_araucana_desc:0 "Unión Araucana, Şili'deki en eski Mapuçe örgütlerinden biridir. Araucanía'da bulunan Kapusen Pederlerle yakın bağlar aracılığıyla, Katolik evangelizasyonu ve Şili toplumuna entegrasyon gündemini desteklediler, ancak uygun şekilde ikna edilirlerse bizim yollarımızı desteklerler."
 CHL_union_of_american_indigenous_peoples:0 "Amerikan Yerli Halkları Birliği"
 CHL_union_of_american_indigenous_peoples_desc:0 "Dünya genelinde zorla boyun eğdirilen ve Avrupalı Emperyalizm tarafından eziyet edilen birçok halk var. Bu ahlaksız işgalcilere karşı savaşmak için Amerikan Yerlileri, İnuit ve Polinezya halkını tek bir bayrak altında birleştirmek için çabalamanın zamanı geldi!"
 CHL_union_of_american_indigenous_peoples_tt:0 "§YQuintín Lame§!'yi bir §YGeneral§! olarak açar!"
 CHL_union_of_hispanic_republics:0 "Hispanik Cumhuriyetler Birliği"
 CHL_union_of_hispanic_republics_desc:0 "Artık tüm Hispanik halk tek bir bayrak altında birleştiğine göre, dünyaya neye muktedir olduğumuzu ve yabancı emperyalist yönetim altında kalan halkımızdan herhangi birini kurtarmayı amaçladığımızı göstermenin tam zamanı."
 CHL_unite_hispanic_america:0 "Hispanik Amerika'yı Birleştir"
 CHL_unite_hispanic_america_desc:0 "Sonunda zamanı geldi! Bugün tarihe tanıklık ediyoruz, çünkü Hispanik Amerikalıların büyük bir kısmı bir kez daha yeniden bir araya geldi, ama İspanyol İmparatorluğu altında değil, kendi hükümetimiz altında. Sevinin, çünkü bu kıta için yeni bir çağın başlangıcıdır!"
 CHL_unite_with_our_brothers_in_hispania:0 "Hispania'daki Kardeşlerimizle Yeniden Birleş"
 CHL_unite_with_our_brothers_in_hispania_desc:0 "Eski Hispania'daki uzun zamandır kayıp olan kardeşlerimiz ideolojik olarak bizimle uyumsuz, ancak herhangi bir savaşta Alman tarafına katılmaktan çekiniyorlar. Sonunda Alman ittifakının bir parçası olmaları için ihtiyaç duydukları itici güç olabiliriz."
 CHL_upgrade_central_bank_tt:0 "§YBanco Central de Chile§!'yi şu şekilde yükseltir: \n $MODIFIER_CONSUMER_GOODS_FACTOR$: §Y-%10§!"
 CHL_use_the_fascist_movement:0 "Faşist Hareketi Kullan"
 CHL_use_the_fascist_movement_desc:0 "Faşistlerin bir şeyler planladığı oldukça açık olsa da, hükümetimize faydalı olabilecek birçok yüksek profilli üyeleri olduğu düşünülmelidir. Bu nedenle, bazılarına gizlice yaklaşmalı ve en azından bir şeyler denemeye karar verene kadar güçlerini kullanmayı ummalıyız."
 CHL_use_the_fascist_movement_tt:0 "Nacista Ayaklanması küçük ölçekli bir §Rİç Savaşa!§! yol açacaktır!"
 CHL_utilize_national_populism:0 "Ulusal-Popülizmi Kullan"
 CHL_utilize_national_populism_desc:0 "Halk saftır ve onlara toprak, zenginlik veya şan vaat eden her şey, ne kadar boş olursa olsun, onları yanınıza çekecektir, destekleri ne kadar değişken olursa olsun."
 CHL_utlilize_famae:0 "FAMAE'yi Kullan"
 CHL_utlilize_famae_desc:0 "Silah sanayimiz şu anda uluslararası alımlara ve arada sırada yerel olarak üretilen tüfeklere bağımlı. Askeri üretimimizi artırmak istiyorsak, hızla modernize edilmesi gereken asırlık Fábricas y Maestranzas del Ejército gibi devlet kontrolündeki bir silah üreticisinin yanımızda olduğundan emin olmalıyız."
 CHL_volunteers_to_the_republicans:0 "Cumhuriyetçilere Gönüllüler"
 CHL_volunteers_to_the_republicans_desc:0 "İspanya'daki kardeşlerimiz şu anda demokratik rejimlerini devirmek isteyen orduya karşı bir mücadele içindeler. Şili'de müdahale etmenin pek popüler bir düşünce olmaması belki de zorunlu olmasa da, gücümüzü ve demokrasiyi savunma hazırlığımızı sergileyebilir."
 CHL_volunteers_to_the_republicans_tt:0 "@SPR Cumhuriyetçi İspanya Mevcut"
 CHL_volunteers_to_the_republicans_tt_2:0 "@SPR Cumhuriyetçi İspanya §Y$SPR_regional_defense_council_of_aragon$§!'yi tamamlamadı!"
 CHL_we_must_dig_deeper:0 "Daha Derine Kazmalıyız"
 CHL_we_must_dig_deeper_desc:0 "Çok derine kazmak diye bir şey yoktur, kendi şehirlerimizin altına tünel kazsak ve temellerine hafifçe zarar versek bile. Ekonomimizi ihracat kullanarak restore edeceksek, risk almalı ve madenlerimizden mümkün olduğunca çok şey çıkarmak için bunu hızlı yapmalıyız."
 CHL_work_on_the_pan_american_highway:0 "Pan-Amerikan Otoyolu Üzerinde Çalış"
 CHL_work_on_the_pan_american_highway_desc:0 "Son yıllarda düzenlenen çeşitli Pan-Amerikan konferansları sırasında, Kuzey ve Güney Amerika'daki kardeşlerimizle işbirliği yaparak iki Amerikan kıtasını birbirine bağlamaya ve bu Pan-Amerikan otoyolu projesini gerçekleştirmeye yardımcı olmayı kabul ettik."
 CHL_work_towards_laissex_faire:0 "Laissez-Faire'e Doğru Çalış"
 CHL_work_towards_laissex_faire_desc:0 "Liberal hükümetin nihai hedefi Laissez-Faire ekonomisine ulaşmaktır ve bu nedenle bunu başarmak için elimizden gelen her şey yapılmalıdır."
 GUAY_a_deal_with_devil:0 "Şeytanla Bir Anlaşma"
 GUAY_a_deal_with_devil_desc:0 "Belirsiz bir dünyada müttefikler olmadan hayatta kalamayacağımız açık. Kıdemli ortağımıza katılmayı ve daha da sıkı bir bağ kurmayı arayacağız; umarım bizi yok oluşa sürüklemezler."
 GUAY_a_domestic_arms_factory:0 "Yerli bir Silah Fabrikası"
 GUAY_a_domestic_arms_factory_desc:0 "Ekonomimiz Avrupa'nın eski güçleriyle rekabet edemese de, tamamen yabancı silah ticaretine güvenemeyiz. Eğer bir gün izole kalırsak, yerli silah üretimi sürecine başlayacağız."
 GUAY_abolish_low_level_income_tax:0 "Düşük Seviyeli Gelir Vergisini Kaldır"
 GUAY_abolish_low_level_income_tax_desc:0 "Toplumumuzdaki en yoksulları vergilendirmek mantıklı değil, bu kaldırılmalı"
 GUAY_adopt_minority_languages:0 "Azınlık Dillerini Benimse"
 GUAY_adopt_minority_languages_desc:0 "Morali güçlendirmek ve askeri istihbarat hataları riskini azaltmak için tüm ordu genelinde kendi dilimizi benimseyeceğiz."
 GUAY_agricultural_colonization:0 "Tarımsal Kolonizasyon"
 GUAY_agricultural_colonization_desc:0 "Tarım her zaman ekonomimizin büyük bir parçası olmuştur. Bunu arazi temizliği yoluyla genişletmek daha fazla kar getirecektir."
 GUAY_appease_the_generals:0 "Generalleri Yatıştır"
 GUAY_appease_the_generals_desc:0 "Milleti ele geçirmemize izin veren generaller, onlara karşılığını vermemizi bekliyor. Çok uzun oyalanmamak daha iyi, yoksa bize karşı dönebilirler."
 GUAY_appease_the_generals_eq_trigger_tt:0 "Orduda §Y2500§!'den fazla piyade teçhizatı"
 GUAY_appease_the_generals_tt:0 "Generaller ek istatistikler ve rastgele atanmış bir özellik kazanacak."
 GUAY_beef_and_hide_industry:0 "Sığır Eti ve Deri Sanayii"
 GUAY_beef_and_hide_industry_desc:0 "Ülkemizin temel ekonomisi sığır eti ve deriye dayanıyor, onu genişletmek mantıklı."
 GUAY_cash_crop_exports:0 "Nakit Mahsul İhracatı"
 GUAY_cash_crop_exports_desc:0 "Ülkemiz diğer ülkelere büyük miktarlarda nakit mahsul satmak için mükemmel ön koşullara sahiptir. Bu değerli malın ihracatı bize artan refah getirecektir."
 GUAY_clamp_down_on_new_territories:0 "Yeni Topraklara Baskı Yap"
 GUAY_clamp_down_on_new_territories_desc:0 "Yeni topraklarımızda anarşi olamaz. Direnişi kırmalı ve devlet düşmanlarını cezalandırmalıyız."
 GUAY_cooperation_in_the_americas:0 "$BRA_cooperation_in_the_americas$"
 GUAY_cooperation_in_the_americas_desc:0 "$BRA_cooperation_in_the_americas_desc$"
 GUAY_coup_detat:0 "Darbe Sonrası"
 GUAY_coup_detat_desc:0 "Eski hükümet düştü! Hükümete bağlı güçlerle kısa bir çatışmaya rağmen tüm kurumların kontrolünü ele geçirdik. Kayıpsız bir şekilde silahsızlandırıldılar ve silahları stoklarımıza eklendi."
 GUAY_cult_of_personality:0 "Kişilik Kültü"
 GUAY_cult_of_personality_desc:0 "Ulusumuzu güçlendirmek için sevgili liderimizi destekleyecek ve bir kişilik kültü oluşturacağız. Sıradan insanın arkasında toplanıp öleceği bir figür."
 GUAY_dam_construction:0 "Baraj İnşaatı"
 GUAY_dam_construction_desc:0 "Ülkemizin hidroelektrik barajları için bol fırsatları var, ancak bu tür pahalı projeleri üstlenecek kadar rezervimiz yok. Belki bir ortak bize bir kredi vermeye istekli olur?"
 GUAY_dam_construction_desc_tt:0 "Yatırımı §Y720 gün§! sonra geri ödememiz bekleniyor. Ödeme vadesinden önce ülkeyle savaşa girersek geri ödeme geçersiz sayılacaktır."
 GUAY_defense_force:0 "[THIS.GetAdjective] Savunma Kuvveti"
 GUAY_defense_force_desc:0 "Vatandaşlarımızı korumak için komşularımızdan gelebilecek olası bir saldırganlığı savuşturmak için bir savunma gücü oluşturmalıyız."
 GUAY_demand_a_seat_at_the_high_table:0 "Yüksek Masada bir Koltuk Talep Et"
 GUAY_demand_a_seat_at_the_high_table_desc:0 "Katkımıza rağmen hala büyük güçler tarafından ikinci sınıf bir müttefikten başka bir şey olarak görülmüyoruz. Diğerleriyle aynı masada oturmayı ve bu yeni dünya düzeninde güneyin kahyaları olmayı talep edeceğiz."
 GUAY_develop_new_territories:0 "Yeni Toprakları Geliştir"
 GUAY_develop_new_territories_desc:0 "Toprak mübadelesini yumuşatmanın en iyi yolu, insanlara daha önce sahip olduklarından daha yüksek bir yaşam kalitesi sağlamaktır. Politikamız bu olacak."
 GUAY_disperse_military_power:0 "Askeri Gücü Dağıt"
 GUAY_disperse_military_power_desc:0 "Kabinelerimizin geleceğini güvence altına almak için, ordunun kendi başına iktidarı ele geçiremeyeceğinden emin olmalıyız."
 GUAY_empower_the_land_owners:0 "Toprak Sahiplerini Güçlendir"
 GUAY_empower_the_land_owners_desc:0 "Toprak sahipleri ülkedeki tek en güçlü kliktir. Onlara daha fazla toprak vererek onları güçlendireceğiz ve karşılığında onların desteğini alacağız."
 GUAY_empower_the_land_owners_desc_tt:0 "Toprak sahipleri, §YSivil Fabrikalar§!, §YAskeri Fabrikalar§!, §YTersaneler§! ve §YEkstra İnşaat Yuvaları§! gibi yüksek değerli binalar inşa etme olasılığı daha yüksek olacaktır!"
 GUAY_enact_martial_law:0 "Sıkıyönetim İlan Et"
 GUAY_enact_martial_law_desc:0 "Huzursuzluk artıyor. Durumu rayından çıkarabilecek gereksiz kan dökülmesini önlemek için anlatıyı kontrol etmeli ve insanları kontrol altında tutmalıyız."
 GUAY_exploit_mineral_wealth:0 "Maden Zenginliğini İşlet"
 GUAY_exploit_mineral_wealth_desc:0 "Maden zenginliği açısından pek bir şeyimiz yok, ama sahip olduğumuz az şeyi sonuna kadar kullanacağız."
 GUAY_export_focus:0 "İhracat Odağı"
 GUAY_export_focus_desc:0 "Turizmden sığır eti ihracatına kadar her şeye olan talebi artırmak için ülkemizi her yerde tanıttığımızdan emin olmalıyız. Onlara [FROM.GetNameDefCap]'i tanıtalım!"
 GUAY_form_ties_with_the_military:0 "Ordu ile Bağlantı Kur"
 GUAY_form_ties_with_the_military_desc:0 "Mevcut hükümet, ülkenin ihtiyaç duyduğu istikrarı sağlayamadı. Bu başarısız rejimi devirmek için kararlı adımlar atmak üzere orduyu kullanacağız."
 GUAY_free_seconday_schools:0 "Ücretsiz Ortaokullar"
 GUAY_free_seconday_schools_desc:0 "Eğitim, iyi işleyen bir ekonominin temel taşıdır. Gelecek nesillerin iyiliği için buna yatırım yapacağız."
 GUAY_has_picked_old_power:0 "Hizalanmak için eski bir güç seçti"
 GUAY_heavy_industry:0 "Ağır Sanayi"
 GUAY_heavy_industry_desc:0 "Ekonomimiz çoğunlukla temel mallara bağımlı olsa da, ağır sanayileri ihmal edemeyiz. Yabancı yapımı mallara aşırı bağımlı hale gelmek, ticaretin bozulması durumunda bizi savunmasız bir duruma sokar."
 GUAY_laissez_faire:0 "Laissez-Faire"
 GUAY_laissez_faire_desc:0 "Hükümetin istisnai durumlar dışında ekonomiye müdahale etmesi için hiçbir neden yoktur. Serbest piyasa galip gelecektir!"
 GUAY_laissez_faire_tt:0 "Toprak Sahipleri ülkemizde bina inşa etmeye başlayacak."
 GUAY_land_reforms:0 "Arazi İyileştirmeleri"
 GUAY_land_reforms_desc:0 "Herhangi bir modern toplumun ilk adımı olduğu için ülkemizdeki altyapıyı iyileştirmemiz gerekiyor."
 GUAY_long_term_contracts:0 "Uzun Vadeli Silah Sözleşmeleri"
 GUAY_long_term_contracts_desc:0 "Silah üretiminin ön saflarında yer alma konusunda komşularımızla rekabet etmeyi umamayız. Ancak büyük güçlerle uzun vadeli lisans sözleşmeleri yapmak, bu ürünleri indirimli bir fiyata üretmemizi sağlayacaktır."
 GUAY_mass_drafts:0 "Toplu Askerlik"
 GUAY_mass_drafts_desc:0 "Sınırı denetlemenin artık küçük bir kuvvete bırakılamayacağı açıktır. Dünya giderek daha belirsiz hale geldikçe, Tanrı'nın verdiği sınırlarımızı savunmaya hazır olmalıyız."
 GUAY_meet_with_the_old_powers:0 "Eski Güçlerle Görüş"
 GUAY_meet_with_the_old_powers_desc:0 "Ülkemiz küçük ama büyük hedefleri var, bu nedenle komşularımıza karşı üstünlük sağlamak için büyük bir güçten nasıl bilgi alacağımızı bilmeliyiz."
 GUAY_meet_with_the_old_powers_tt:0 "Bir büyük eski dünya gücüyle ittifak kurmak için kararların kilidini açar, size ittifak kurulan güce bağlı olarak bir bonus seçeneği sunar."
 GUAY_military_licenses:0 "Askeri Lisanslar"
 GUAY_military_licenses_desc:0 "Askeri olarak gelişmiş ülkelerle bağlar kurmalı ve savaş silahlarını lisanslamalıyız. Sadece yerli üretime güvenemeyiz."
 GUAY_mobalize_the_economy:0 "Ekonomiyi Seferber Et"
 GUAY_mobalize_the_economy_desc:0 "Her türlü olasılığa hazırlıklı olmak için ekonominin seferberliğine başlamalıyız. İnsanlar şikayet edebilir ama daha yüksek bir amaca hizmet ettiklerini bilmeleri gerekiyor."
 GUAY_mythologize_the_father_of_the_nation:0 "Ulusun Babasını Mitolojileştir"
 GUAY_mythologize_the_father_of_the_nation_desc:0 "[GUAY_mythologize_the_father_of_the_nation_desc]"
 GUAY_mythologize_the_father_of_the_nation_par:0 "Francisco López, üç ulusun saldırısıyla karşı karşıya olmasına rağmen pes etmeyi reddederek ülkeyi Üçlü İttifak'a karşı yönetti. Bu tür bir kararlılık ve irade her askere aşılanacaktır."
 GUAY_mythologize_the_father_of_the_nation_urg:0 "José Artigas, düşman komşulara ve Avrupa güçlerine karşı bağımsızlığımız için savaşan ulusumuzun babası olarak görülür. Mirası ve idealleri kurumsallaştırılacak ve Uruguaylı olmanın bir parçası haline gelecektir."
 GUAY_national_academy_of_sciences:0 "Ulusal Bilimler Akademisi"
 GUAY_national_academy_of_sciences_2:0 "[THIS.GetAdjective] Mekanik Üniversitesi"
 GUAY_national_academy_of_sciences_2_desc:0 "Savaşın geleceği yüksek teknoloji savaşında yatmaktadır. Bazı insanları çiftliklerden çıkarıp askeri mühendisliğe yönlendirmeliyiz."
 GUAY_national_academy_of_sciences_3:0 "Güney Amerika Yüksek Üniversitesi"
 GUAY_national_academy_of_sciences_3_desc:0 "Her Güney Amerikalı yüksek öğrenimi hak ediyor. Kıtayı kontrol etmek, her erkeğe ve kadına bunu vermek için bize bol miktarda kaynak sağlıyor."
 GUAY_national_academy_of_sciences_desc:0 "Araştırmaya ek yatırım, yeni savaş silahları geliştirmemizi ve büyük güçlerle arayı kapatmamızı sağlayacaktır."
 GUAY_nationalize_foreign_owned_companies:0 "Yabancı Mülkiyetindeki Şirketleri Millileştir"
 GUAY_nationalize_foreign_owned_companies_desc:0 "Çok uzun zamandır yabancı şirketler kaynaklarımızı kendi çıkarları için sömürdü, artık yeter."
 GUAY_no_second_american_colonization:0 "İkinci Bir Amerikan Sömürgeciliği Yok"
 GUAY_no_second_american_colonization_desc:0 "Kıtamız Mihver ve Müttefikler arasında gidip geliyor ve komşularımız kendilerini sadece başkalarının boyunduruğu altında görürken. Güney Amerika, sömürgecilik mirasından kısıtlanmamış, kendi kaderimizi şekillendirmek için eski güçlerin zincirlerinden kurtulmuş daha iyi bir kaderi hak ediyor ve eğer oraya ulaşmak için daha az vizyonu olanları ezmek zorunda kalırsak öyle olsun."
 GUAY_not_at_war_with_old_power:0 "Seçilen hizalanmış eski güçle savaşta değil"
 GUAY_old_world_power_faction:0 "Eski Dünya Gücü ittifakta veya ittifak lideri"
 GUAY_old_world_power_scope:0 "§YEski Dünya Gücü Ortağı§!:"
 GUAY_penal_battalions:0 "Ceza Taburları"
 GUAY_penal_battalions_desc:0 "Ordumuz, çok az kişinin katılmasıyla vahim bir durumda. Hapishanelerden asker alımına izin vermek tam da çözüm olabilir."
 GUAY_penal_battalions_tt:0 "Tam insan gücüyle §Y6 Ceza Taburu§! ekler. §YCeza Taburlarının§! kilidini açar!"
 GUAY_place_opposition_leaders_in_house_arrest:0 "Muhalefet Liderlerini Ev Hapsine Al"
 GUAY_place_opposition_leaders_in_house_arrest_desc:0 "Ülke üzerindeki kontrolümüzü sağlamlaştırmak için hızla hareket etmeliyiz. Darbe sonuçlanana kadar muhalefeti ev hapsine alacağız."
 GUAY_protect_domestic_industries:0 "Yerli Sanayileri Koru"
 GUAY_protect_domestic_industries_agricultural:0 "$GUAY_agricultural_colonization$'ı tamamlamak\nEkle: §G1§! §YSivil Fabrika.§!\nEkle: §G1§! İnşaat Yuvası."
 GUAY_protect_domestic_industries_beef:0 "$GUAY_beef_and_hide_industry$'ı tamamlamak\nEkle: §G1§! §YSivil Fabrika.§!\nEkle: §G1§! İnşaat Yuvası."
 GUAY_protect_domestic_industries_cash_crop:0 "$GUAY_cash_crop_exports$'ı tamamlamak\nEkle: §G1§! §YSivil Fabrika.§!\nEkle: §G1§! İnşaat Yuvası."
 GUAY_protect_domestic_industries_desc:0 "Yabancı ticaretle uğraşırken, ucuz yabancı mallarla yerli sanayilerimizi rekabet dışı bırakmamak için büyük özen göstermeliyiz. Önce yerli ekonomimizi korumak için bir dizi ithalat vergisi uygulamamız gerekiyor."
 GUAY_protect_domestic_industries_wool_makers:0 "$GUAY_wool_makers$'ı tamamlamak\nEkle: §G1§! §YSivil Fabrika.§!\nEkle: §G1§! İnşaat Yuvası."
 GUAY_rekindle_old_gripes:0 "[GUAY_rekindle_old_gripes]"
 GUAY_rekindle_old_gripes_ARG_PAR_tt:0 "Eğer savaşın patlak vermesinden itibaren §Y365 gün§! içinde §Y[957.GetName]§!'yi kontrol edersek, [ARG.GetName] beyaz barış yapmak zorunda kalacak ya da felaketle sonuçlanan bir moral kaybıyla yüzleşecek."
 GUAY_rekindle_old_gripes_ARG_URG_tt:0 "Eğer savaşın patlak vermesinden itibaren §Y365 gün§! içinde §Y[510.GetName]§!'yi kontrol edersek, [ARG.GetName] beyaz barış yapmak zorunda kalacak ya da felaketle sonuçlanan bir moral kaybıyla yüzleşecek."
 GUAY_rekindle_old_gripes_BRA_PAR_tt:0 "Eğer savaşın patlak vermesinden itibaren §Y365 gün§! içinde §Y[504.GetName]§!'yi kontrol edersek, [BRA.GetNameDef] beyaz barış yapmak zorunda kalacak ya da felaketle sonuçlanan bir moral kaybıyla yüzleşecek."
 GUAY_rekindle_old_gripes_BRA_URG_tt:0 "Eğer savaşın patlak vermesinden itibaren §Y365 gün§! içinde §Y[502.GetName]§!'yi kontrol edersek, [BRA.GetNameDef] beyaz barış yapmak zorunda kalacak ya da felaketle sonuçlanan bir moral kaybıyla yüzleşecek."
 GUAY_rekindle_old_gripes_PAR:0 "Üçlü İttifak'ın Gölgesi Altında"
 GUAY_rekindle_old_gripes_PAR_desc:0 "Nüfusun %60'ı Üçlü İttifak savaşı sırasında öldü ve ülkemiz asla toparlanamadı. Sadece genişleme halkımıza istikrar ve refah getirebilir; artık o lanetli ittifakın gölgesi altında yaşamayacağız."
 GUAY_rekindle_old_gripes_URG:0 "Eski Kinleri Canlandır"
 GUAY_rekindle_old_gripes_URG_desc:0 "Hem [ARG.GetName] hem de [BRA.GetName] tarihsel olarak bizi kendi çıkarları için kullandılar ve halkımız için felaketle sonuçlandı. Düşman bir gücün Montevideo'ya bir daha yaklaşmasını önlemek için dışa doğru genişlemeliyiz."
 GUAY_rekindle_old_gripes_desc:0 "[GUAY_rekindle_old_gripes_desc]"
 GUAY_river_trade:0 "Nehir Ticareti"
 GUAY_river_trade_desc:0 "Ülkemiz Nehirler ülkesidir. Bu nehirler boyunca feribotları hareket ettirmek, ülke var olduğu sürece bir dayanak noktası olmuştur. Komşularımız istekliyse, bu tür bir ticareti genişletmek mantıklıdır."
 GUAY_river_trade_tt:0 "[THIS.GetNameDef] ile görüş §Y49§! üzerindeyse §G+1§! §YSivil Fabrika§! ekle."
 GUAY_specialized_terrain_training:0 "Özel Arazi Eğitimi"
 GUAY_specialized_terrain_training_desc:0 "Ordumuz küçük, ancak insan gücü ve teçhizattaki eksikliğimizi kaliteyle telafi edebiliriz. Özel tümenler, ağırlıklarının üzerinde yumruk atabilir ve caydırıcı olarak hareket edebilir."
 GUAY_tag_the_economic_miracle:0 "Güney Amerika Ekonomik Mucizesi"
 GUAY_the_permanent_leader:0 "Kalıcı Lider"
 GUAY_the_permanent_leader_desc:0 "[ROOT.GetLeader] ülkenin figürüdür ve bu nedenle onu bir kaideye koymalıyız ki sıradan asker arkasında toplanacak bir şeye sahip olsun. Ülkemiz için kalıcı lider olacak."
 GUAY_the_stuff_of_legends:0 "Efsanelerin Malzemesi"
 GUAY_the_stuff_of_legends_cores_tt_arg:0 "Tüm başlangıç §YArjantin§! çekirdeklerini kontrol eder"
 GUAY_the_stuff_of_legends_cores_tt_bol:0 "Tüm başlangıç §YBolivya§! çekirdeklerini kontrol eder"
 GUAY_the_stuff_of_legends_cores_tt_bra:0 "Tüm başlangıç §YBrezilya§! çekirdeklerini kontrol eder"
 GUAY_the_stuff_of_legends_cores_tt_par:0 "Tüm başlangıç §YParaguay§! çekirdeklerini kontrol eder"
 GUAY_the_stuff_of_legends_cores_tt_urg:0 "Tüm başlangıç §YUruguay§! çekirdeklerini kontrol eder"
 GUAY_the_stuff_of_legends_desc:0 "Bir rüya olarak başlayan şey gerçeğe dönüştü. Liderliğimiz altında kıta üzerinde güçlü bir hakimiyet kurduk ve benzersiz bir kimlik oluşturduk. Bu tarih kitaplarına yazılacak ve efsanelerin malzemesi olacak."
 GUAY_the_tag_economic_miracle:0 "[THIS.GetAdjective] Ekonomik Mucizesi"
 GUAY_the_tag_economic_miracle_desc:0 "Ülkemiz, bazı analistlerin ekonomik bir mucize olarak adlandırdığı şeyi yaşıyor. Son birkaç yılda hızlı bir büyüme yaşadık, bu da hızla sanayileşmemizi sağladı; dünyanın dört bir yanından yatırımcılar bu büyümeyi daha da körüklemek için ekonomiye yatırım yapmak için akın ediyor."
 GUAY_urbanization:0 "Kentleşme"
 GUAY_urbanization_desc:0 "Vatandaşlarımızı yoksulluktan kurtarmak için onları daha büyük zenginlik ve eğitime erişebilecekleri büyük şehre getireceğiz."
 GUAY_volunteers:0 "[THIS.GetAdjective] Gönüllüleri"
 GUAY_volunteers_desc:0 "Doğrudan çatışmadan ve olası bir yok oluştan, dış ilişkilere doğrudan karışmak yerine gönüllüler göndererek kaçınabiliriz. Belki de dengeleri değiştirebilir?"
 GUAY_wool_makers:0 "Yün Üreticileri"
 GUAY_wool_makers_desc:0 "Yün herkes için önemli bir emtiadır ve biz onu sağlamaya hazırız. Sonuçta herkesin kışın sıcak kalması gerekiyor."
 GUAY_workers_rights:0 "İşçi Hakları"
 GUAY_workers_rights_desc:0 "Daha uzun yaşayan ve daha mutlu olan işçiler daha çok çalışır. Hem ulusun sağlığı hem de ekonomisi için işçi haklarını uygulamak bir kazan-kazan durumudur."
 JUNO_armor_modernization_initiative:0 "Zırh Modernizasyon Girişimi"
 JUNO_army_academy_random_generals_tt:0 "Rastgele seçilen §YÜç§! ordu lideri §G+1§! planlama yeteneği kazanacak"
 JUNO_army_modernization_initiative:0 "Ordu Modernizasyon Girişimi"
 JUNO_motorization_initiative:0 "Motorizasyon Girişimi"
 JUNO_naval_academy_random_admirals_tt:0 "Rastgele seçilen §Yüç§! adede kadar deniz lideri §G+1§! koordinasyon yeteneği kazanacak"
 JUNO_support_company_initiative:0 "Destek Bölüğü Girişimi"
 PAR_a_call_out_for_aid:0 "Bir Yardım Çağrısı"
 PAR_a_call_out_for_aid_desc:0 "Başkanların [FRA.GetAdjective] karısını, [FRA.GetAdjective] hükümetini savaşımızda yardım etmek için gönüllülere izin vermesi için lobi yapmak üzere kullanacağız."
 PAR_a_great_charter:0 "Büyük bir Şart"
 PAR_a_great_charter_desc:0 "Anayasamızın kaldırılması ve yeni büyük bir şartın kaleme alınması gerekiyor. Ülke için yeni bir gelecek!"
 PAR_accept_american_loans:0 "Amerikan Kredilerini Kabul Et"
 PAR_accept_american_loans_desc:0 "Amerikalılar, Mihver güçlerine katılmamamız için bize baskı yapıyor ve rakiplerine daha yakınlaşmamızı önlemek için ülkemize yoğun bir şekilde yatırım yapmaya istekliler"
 PAR_access_the_sea:0 "Denize Erişim"
 PAR_access_the_sea_desc:0 "Ulusumuzun hiçbir zaman bir tuzlu su limanı olmadı, ancak herhangi bir büyük gücün ulusal güvenliği için bir tanesine ihtiyacı olduğu açıktır. Ne pahasına olursa olsun bir tane edinmeliyiz."
 PAR_adopt_minority_languages:0 "$GUAY_adopt_minority_languages$"
 PAR_adopt_minority_languages_desc:0 "$GUAY_adopt_minority_languages_desc$"
 PAR_aftermath_of_the_coup:0 "İç Savaşın Ardından"
 PAR_aftermath_of_the_coup_desc:0 "Ülke, üst üste gelen darbelerden sonra harap oldu. Üçlü İttifak savaşı, Chaco çatışması ve şimdi de ikinci bir iç savaş topraklarımızı harap etti, ama dayanmaktan başka ne yapabiliriz ki? Bugün büyük yeniden yapılanma başlıyor, ¡Paz y justicia! Paraguay için!"
 PAR_agricultural_technical_assistence:0 "Tarımsal ve Tıbbi Teknik Yardım"
 PAR_agricultural_technical_assistence_desc:0 "Amerikalılar, çıkarlarını tehdit eden herhangi bir planı ertelememiz durumunda bize Tarımsal ve Tıbbi teknolojik modernizasyon sağlamaya istekliler."
 PAR_align_with_the_guion_rojo:0 "Guión Rojo ile Hizalan"
 PAR_align_with_the_guion_rojo_desc:0 "Colorado partisinin paramiliter örgütünü ve lideri Juan Natalicio González'i kanatlarımızın altına almalıyız. Siyasi muhalefetimizi tehdit etmek ve taciz etmek için onları kullanacağız."
 PAR_allow_unions_to_strike:0 "Sendikaların Grev Yapmasına İzin Ver"
 PAR_allow_unions_to_strike_desc:0 "İşçileri korumak için güçlü bir sendikaya ihtiyaç var. Daha önce hükümet sendikaların gücünü etkisiz hale getirmişti, artık değil."
 PAR_allow_women_workers:0 "Kadın İşçilere İzin Ver"
 PAR_allow_women_workers_desc:0 "Feci Üçlü İttifak savaşı ve ardından gelen Chaco savaşından sonra, çalışan yaştaki erkeklerin eksikliği nedeniyle etkili bir işgücünden ciddi şekilde yoksunuz. "
 PAR_ask_for_bankroll:0 "Mali Destek İste"
 PAR_ask_for_bankroll_desc:0 "Ekonomi darmadağınken bu savaşı karşılayamayız. Tüm ülkenin anarşiye sürüklenmemesi için yabancı bir gücün mali destek sağlaması gerektiği açıktır."
 PAR_assasinate_rafael_franco:0 "Rafael Franco'ya Suikast Düzenle"
 PAR_assasinate_rafael_franco_desc:0 "Yılanın başını kesebilseydik, düşmanın moralini büyük ölçüde azaltabilirdi. Chaco içindeki yerel muhaliflerle temasa geçecek ve bunu görmeleri için onlara araçları sağlayacağız."
 PAR_ban_the_liberal_party:0 "Liberal Partiyi Yasakla"
 PAR_ban_the_liberal_party_desc:0 "Liberal parti Bolivyalılarla komplo kuruyor. Liderlerinin sürgünü tek uygun cezadır. Gücümüzü Coloradolardan toplayacağız"
 PAR_ban_vouchers:0 "Ödeme Olarak Fişleri Yasakla"
 PAR_ban_vouchers_desc:0 "İşverenlerin işçilere sözde \"beyaz para\" ile ödeme yapmasını durdurmalıyız. İşverenlerin çalışanlara para yerine alternatif olarak verdikleri, eşitsizliği sürdüren ve çalışan için bağımlılık yaratan fişler. Bu durmalı."
 PAR_brazilian_road_finance:0 "[BRA.GetAdjective] Yol Finansmanı"
 PAR_brazilian_road_finance_desc:0 "[USA.GetName], [BRA.GetAdjective] hükümetini yol altyapımızı genişletmeye yatırım yapmaya ikna etti"
 PAR_by_all_means_which_to_win:0 "Kazanmak İçin Her Yolla"
 PAR_by_all_means_which_to_win_desc:0 "Savaş sona erene kadar tüm ekonomiyi mevcut çatışmaya odaklamalıyız. Nüfus sonuç olarak acı çekecek, ama eğer savaşı kaybedersek, komünistlerin boyunduruğu altında daha da kötü olacaklar..."
 PAR_central_bank_of_paraguay:0 "Paraguay Cumhuriyeti Merkez Bankası"
 PAR_central_bank_of_paraguay_desc:0 "Dış ticaret için tek kanal olacak bir merkez bankası kuracağız."
 PAR_chaco_war_decoration:0 "Chaco Savaşı Nişanları"
 PAR_chaco_war_decoration_desc:0 "Chaco savaşı gazileri, önceki hükümetten asla alamadıkları savaş nişanlarını hak ediyor. Orduyu yatıştırmak için küçük bir bedel."
 PAR_cult_of_personality:0 "$GUAY_cult_of_personality$"
 PAR_cult_of_personality_desc:0 "$GUAY_cult_of_personality_desc$"
 PAR_discipline_hierarchy_and_order:0 "Disiplin, Hiyerarşi ve Düzen"
 PAR_discipline_hierarchy_and_order_desc:0 "Seçimlerin feshedilmesiyle yeni bir \"Disiplin, Hiyerarşi ve Düzen\" politikasını açıklayacağız. Ülkemizi yönetecek bir takım ilkeler ve yıkıcı fikirleri yayan kişiler hapsedilecek"
 PAR_emergency_powers:0 "Olağanüstü Hal Yetkileri"
 PAR_emergency_powers_desc:0 "Ülkenin iç ve dış hassas durumu, bizi bir arada tutacak güçlü bir lider gerektirir. Bu ancak o lidere hızlı ve kararlı hareket etme yetkisi verilirse yapılabilir. "
 PAR_ensure_army_loyalty:0 "Ordu Sadakatini Sağla"
 PAR_ensure_army_loyalty_desc:0 "Muhalefet artıyor ve halk yaygın bir direniş ve genel grevler düzenliyor. Selefimizle aynı darbeyle yüzleşmemek için ordu, ülkemizin GSYİH'sının büyük bir bölümünü alacak"
 PAR_fedrerista_land_reforms:0 "Febrerista Toprak Reformları"
 PAR_fedrerista_land_reforms_desc:0 "Çiftçileri güçlendirmek ve topraklarını güçlü toprak sahiplerinden yeniden dağıtmak için ciddi toprak reformları yapmalıyız"
 PAR_free_seconday_schools:0 "$GUAY_free_seconday_schools$"
 PAR_free_seconday_schools_desc:0 "$GUAY_free_seconday_schools_desc$"
 PAR_get_rid_of_colonel_peredes:0 "Albay Paredes'ten Kurtul"
 PAR_get_rid_of_colonel_peredes_desc:0 "İçişleri Bakanı Paredes, nüfuzu nedeniyle potansiyel bir rakiptir. Otoritemizi güçlendirmek için onu görevden alacağız"
 PAR_get_rid_of_obsolete_guns:0 "Eskimiş Silahlardan Kurtul"
 PAR_get_rid_of_obsolete_guns_desc:0 "Ordumuzun silahları eskimiş silahlardan oluşuyor. Bizi engelleyen metal hurdalarından kurtularak ve depomuzu modernize ederek modernize etmeliyiz."
 PAR_goad_bolivia:0 "Bolivya'yı Kışkırt"
 PAR_goad_bolivia_desc:0 "Eğer Bolivya'yı çatışmaya dahil edebilseydik, isyancılar çok daha zayıf olurdu. Riskli olsa da, Franco'nun iç savaş bittikten sonra fethini Bolivya'ya genişletme arzusunu ima eden sahte bir telgraf yayınlayacağız, umarım [BOL.GetAdjective] hükümetini dahil olmaya kışkırtırız."
 PAR_invite_japanese_settlers:0 "Japon Yerleşimcileri Davet Et"
 PAR_invite_japanese_settlers_desc:0 "[BRA.GetName]'nin Japon göçünü durdurmasıyla, onları buraya davet etmek için bolca fırsat var. Yerleşimciler tarıma ve genel ekonomiye bir destek olacaktır."
 PAR_join_the_allies:0 "Müttefiklere Katıl"
 PAR_join_the_allies_desc:0 "[USA.GetName] bize müttefiklere katılmamız için baskı yapıyor ve önemli ambargolara yol açmayan başka bir alternatif göremiyoruz."
 PAR_join_the_axis:0 "Mihver'e Katıl"
 PAR_join_the_axis_desc:0 "İdeolojik müttefiklerimizin [GER.GetAdjective] ve müttefikleri olduğu açıktır. Mihver'e katılacak ve bu yeni dünya düzeninde keyif süreceğiz."
 PAR_join_the_cominterm:0 "Komintern'e Katıl"
 PAR_join_the_cominterm_desc:0 "Ne Mihver ne de Müttefikler, ideolojimizle aynı hizada olan herhangi bir alternatife yol açmaz, ancak [SOV.GetName] diğer iki kötülüğe açık bir alternatiftir."
 PAR_liga_nacional_independiente:0 "Liga Nacional Independiente"
 PAR_liga_nacional_independiente_desc:0 "Liderlerimizin gündemini ilerletmek için, hükümetin meşruiyetini güçlendirmek ve muhalefeti kapatmak için ilerici grup LNI'yi güçlendireceğiz."
 PAR_mass_drafts:0 "$GUAY_mass_drafts$"
 PAR_mass_drafts_desc:0 "$GUAY_mass_drafts_desc$"
 PAR_military_pensions:0 "Askeri Emeklilik Maaşları"
 PAR_military_pensions_desc:0 "Eski hükümet, Chaco savaşı gazileri için askeri emeklilik maaşı vermeyi reddetti. Aynı hatayı yapmayacağız."
 PAR_mythologize_the_father_of_the_nation:0 "$GUAY_mythologize_the_father_of_the_nation$"
 PAR_mythologize_the_father_of_the_nation_desc:0 "$GUAY_mythologize_the_father_of_the_nation_desc$"
 PAR_nationalize_foreign_owned_companies:0 "$GUAY_nationalize_foreign_owned_companies$"
 PAR_nationalize_foreign_owned_companies_desc:0 "$GUAY_nationalize_foreign_owned_companies_desc$"
 PAR_nazify_the_army:0 "Orduyu Nazileştir"
 PAR_nazify_the_army_desc:0 "Nazi sembolizmi zaten ordu genelinde bir orman yangını gibi yayılıyor. Bunu kabul etmek ve hatta teşvik etmek dışında her şey orduyu kızdırırdı. Bunu [GER.GetName] ile daha yakınlaşırken aynı zamanda daha güçlü bir askeri kimlik geliştirmek için kullanabiliriz."
 PAR_neuter_the_guion_rojo:0 "Guión Rojo'yu Etkisizleştir"
 PAR_neuter_the_guion_rojo_desc:0 "Coloradoların radikal paramiliter grubu Guión Rojo, hükümet için bir güvenlik tehdidi ve sürekli başımıza bela. Tam anlamıyla bir çatışmaya dönüşmeden önce grubu etkisiz hale getirmeli ve silahsızlandırmalıyız."
 PAR_order_italian_planes:0 "[ITA.GetAdjective] Uçakları Sipariş Et"
 PAR_order_italian_planes_desc:0 "Ordumuzu modernize etmeliyiz. Hava kuvvetlerimizin komşularımızdan gelen herhangi bir tehdidi bertaraf edecek düzeyde olduğundan emin olmak için [ITA.GetName]'e yaklaşacağız."
 PAR_pull_back_troops_from_the_chaco:0 "Birlikleri Chaco'dan Geri Çek"
 PAR_pull_back_troops_from_the_chaco_desc:0 "Chaco'da konuşlanmış birliklerin, ordunun söylediklerine rağmen, [BOL.GetName] ile gerginliği tırmandırmamak için geri çekilmesi gerekiyor."
 PAR_purge_the_military_of_dissent:0 "Orduyu Muhalefetten Arındır"
 PAR_purge_the_military_of_dissent_desc:0 "Estigarribia, ordudaki herhangi bir kalıntı muhalefeti kökünden kazımayı ve Franco'nun devrimiyle olan bağları temizlemeyi kabul etti."
 PAR_put_estigarribia_on_a_pedestal:0 "Estigarribia'yı bir kaideye koy"
 PAR_put_estigarribia_on_a_pedestal_desc:0 "José Félix Estigarribia, hem Chaco savaşının bir kahramanı hem de şimdi iç savaşı kazanmada kilit bir figür olarak geniş çapta görülmektedir. İç savaşın kargaşasını azaltmak, ülkeyi birleştirmek ve hizmeti için onu ödüllendirmek amacıyla propaganda amaçlı kullanacağız."
 PAR_radicalize_the_police:0 "Polisi Radikalleştir"
 PAR_radicalize_the_police_desc:0 "Polis, ordu dış tehditlere odaklanırken iç barışı korumada hayati önem taşır, ancak devleti desteklemede daha büyük bir araç haline gelebilirler. Onlara daha fazla kaynak sağlayacağız ve karşılığında onları hükümetin saflarına katacağız ve ya ordu ya da polis çok güçlenirse, onları her zaman birbirine düşürebiliriz."
 PAR_reach_out_to_european_contacts:0 "Yardım için [USA.GetAdjective] Temas Noktalarına Ulaş"
 PAR_reach_out_to_european_contacts_desc:0 "Ordu, derme çatma gücümüze kıyasla çok güçlü. Gururumuzu bir kenara bırakıp yardım için [USA.GetName]'e ulaşmalı ve bahçelerinde bir komünist devletin tercih edilir olmadığını onlara ikna etmeliyiz."
 PAR_rebuild_humaita:0 "Humaitá'yı Yeniden İnşa Et"
 PAR_rebuild_humaita_desc:0 "Humaitá Kalesi, Paraguay Savaşı sırasında yerle bir edilmişti, ancak herhangi bir güney saldırısına karşı bir siper olarak duruyordu. Bu heybetli kaleyi, bir dayanıklılık işareti ve düşmana karşı bir hakaret olarak tekrar inşa edeceğiz."
 PAR_request_weapons:0 "[USA.GetName]'den Silah Talep Et"
 PAR_request_weapons_desc:0 "Şu anda sahip olduğumuz cılız hafif silah stoğuyla bu savaşı kazanamayız. [USA.GetName]'e ulaşmalı ve etki alanlarının ortasında bir komünist hükümetin olmasını istemedikleri bir şey olduğuna onları ikna etmeliyiz."
 PAR_revenge_for_the_chaco_war:0 "Chaco Savaşı'nın İntikamı"
 PAR_revenge_for_the_chaco_war_desc:0 "[BOL.GetName] hala Chaco bölgesine göz dikiyor ve tekrar talep etmeye çalışmaları an meselesi. Proaktif olmalı ve önce biz saldırmalıyız."
 PAR_soliders_for_prisoners:0 "Asker Olarak Mahkumlar"
 PAR_soliders_for_prisoners_desc:0 "Ordumuz, ülkemizi savunmasız bırakan iç savaştan sonra asker sıkıntısı çekiyor. [BOL.GetName]'nin Chaco'yu geri almak için uygun bir anı beklediği bir ortamda, bir önlem olarak acil bir asker akışına ihtiyacımız var. Eğer orduya katılmayı ve uygun bir ordu kurulana kadar kuvvetlerimizi desteklemeyi kabul ederlerse mahkumları affedeceğiz."
 PAR_specialized_terrain_training:0 "$GUAY_specialized_terrain_training$"
 PAR_specialized_terrain_training_desc:0 "$GUAY_specialized_terrain_training_desc$"
 PAR_suspend_elections:0 "Seçimleri Askıya Al"
 PAR_suspend_elections_desc:0 "Seçimler mevcut iklimde ertelenmelidir. Hükümetteki liberal bakanların istifası, bize karşı çıkacak neredeyse kimseyi bırakmadı."
 PAR_the_permanent_leader:0 "$GUAY_the_permanent_leader$"
 PAR_the_permanent_leader_desc:0 "$GUAY_the_permanent_leader_desc$"
 PAR_to_cross_a_river:0 "Bir Nehri Geçmek"
 PAR_to_cross_a_river_desc:0 "Paraguay Nehri bizim için büyük bir engeldir ve çoğu geçişi doğal olarak engeller. Bu çabada bize yardımcı olmak için güçlü bir deniz piyadesi birliğine sahip askeri deneyimli bir güce yaklaşmalıyız."
 PAR_union_nacional_revolucionaria:0 "Partido Revolucionario Febrerista"
 PAR_union_nacional_revolucionaria_desc:0 "Yeni partimiz ülkedeki tek yasal parti olacak. Ülkenin gücü ve kurumlarının parti liderliğinden türediği Devrimci Ulusal Birlik için yeni bir başlangıç."
 PAR_urbanization:0 "$GUAY_urbanization$"
 PAR_urbanization_desc:0 "$GUAY_urbanization_desc$"
 SMB_CHL_navy_desc:0 "Filomuzun uzun ve gururlu bir geleneği olsa da, Donanmanın prestiji 1931 deniz isyanıyla büyük ölçüde zarar gördü. Armada de Chile'ye yatırım yaparak, halkın Donanmamıza olan güvenini yeniden inşa etmeye yardımcı olabiliriz."
 SMB_a_land_of_mountains:0 "Dağlar Ülkesi"
 SMB_a_land_of_mountains_desc:0 "[ROOT.GetName], savaşırken dağlık araziyi kendi avantajına kullanma konusunda uzun bir geleneğe sahiptir ve gelecek de farklı olmayacaktır. Biz dağlarda yaşamaya alışkın bir halkız ve uzmanlığımızı karşımıza çıkan her devi yenmek için kullanacağız."
 SMB_air_academy:0 "[SMB_air_academy_key]"
 SMB_air_academy_BRA:0 "Academia da Força Aérea"
 SMB_air_academy_default:0 "Uygun bir Hava Akademisi Kur"
 SMB_air_academy_default_desc:0 "Sadece kara kuvvetlerinde savaşacak askerlerin düzgün bir şekilde eğitilmesi gerekmez. Pilotlarımız, hevesli olsalar da, it dalaşlarında başarılı olmak için ihtiyaç duydukları profesyonel eğitimden yoksundurlar. Bunu çözmek için, askeri akademiyi hava kuvvetlerine yönelik daha fazla dersi içerecek şekilde genişletmeliyiz."
 SMB_air_academy_desc:0 "[SMB_air_academy_desc_key]"
 SMB_air_defense:0 "[SMB_air_defense_key]"
 SMB_air_defense_default:0 "Hava Savunması"
 SMB_air_defense_default_desc:0 "Rakiplerimiz artık gerçek yüzlerini gösterdiğine ve kendi hava silahlarını geliştirmeye başladığına göre, yanıtımızı hazırlamalıyız. Bu nedenle, uçaksavar mevzilerinin ve toplarının hızlı bir şekilde inşasını ve konuşlandırılmasını emrederek başlamalıyız."
 SMB_air_defense_desc:0 "[SMB_air_defense_desc_key]"
 SMB_air_doctrine:0 "[SMB_air_doctrine_key]"
 SMB_air_doctrine_default:0 "Doktrinsel Gelişmeler"
 SMB_air_doctrine_default_desc:0 "Uygun bir strateji olmadan, en büyük pilotların ve uçakların bile savaşta başarılı olamayacağını unutmamak önemlidir. Savaşlar tamamen planlama, stratejiler ve ulusun bireysel güçlerini sonuna kadar kullanmakla ilgilidir. Bu nedenle, hava kuvvetlerimizin takip edeceği yeni doktrinler geliştirmeye büyük çaba göstermeliyiz."
 SMB_air_doctrine_desc:0 "[SMB_air_doctrine_desc_key]"
 SMB_air_force:0 "[SMB_air_force_key]"
 SMB_air_force_ARG:0 "Fuerza Aérea Argentina"
 SMB_air_force_BRA:0 "Força Aérea Brasileira"
 SMB_air_force_CHL:0 "Fuerza Aérea de Chile"
 SMB_air_force_PAR:0 "Fuerza Aérea Paraguaya"
 SMB_air_force_URG:0 "Fuerza Aérea Uruguaya"
 SMB_air_force_default:0 "Fuerzas Aéreas'ı Silahlandır"
 SMB_air_force_default_desc:0 "Birçok teorisyen, şu anda en çok geride kaldığımız alanın modern bir hava kuvvetinin geliştirilmesi olduğunu iddia edecektir. Bu nedenle, yeni hangar ve tesisler inşa ederek ve ek pilotlar eğiterek bunu düzeltmek için çok çalışmalıyız."
 SMB_air_force_desc:0 "[SMB_air_force_desc_key]"
 SMB_air_modifier_boost_1:0 "[SMB_air_modifier_boost_1_key]"
 SMB_air_modifier_boost_1_default:0 "Kara Desteği Uzmanlığı"
 SMB_air_modifier_boost_1_default_desc:0 "Piyadelerin her zaman gitmeleri gereken yere ulaşabildiklerinden emin olmak çok önemlidir ve bu nedenle hava kuvvetini, ister doğrudan hava desteğiyle ister düşman hatlarının arkasını bombalayarak onlara yardımcı olmaya odaklamak da önemlidir."
 SMB_air_modifier_boost_1_desc:0 "[SMB_air_modifier_boost_1_desc_key]"
 SMB_air_modifier_boost_2:0 "[SMB_air_modifier_boost_2_key]"
 SMB_air_modifier_boost_2_default:0 "Gelişmiş Uçak Gövdeleri Geliştirme"
 SMB_air_modifier_boost_2_default_desc:0 "Uçaklarımızın düşmanla temastan sağ çıkmasını istiyorsak, sadece mümkün olduğunca çok vuruştan kaçınabilmeleri değil, aynı zamanda bir veya iki vuruşa dayanabilmeleri ve onarım için geri dönecek kadar uzağa ulaşabilmeleri de önemlidir. Bu yüzden pilotların güvende olabilmesi için uçaklarımız için daha iyi gövdeler ve motorlar geliştirmeliyiz, ne olursa olsun."
 SMB_air_modifier_boost_2_desc:0 "[SMB_air_modifier_boost_2_desc_key]"
 SMB_aircraft_carrier_bonus:0 "Uçak Gemisi Girişimi"
 SMB_aircraft_carriers:0 "[SMB_aircraft_carriers_key]"
 SMB_aircraft_carriers_default:0 "Uçak Gemileri"
 SMB_aircraft_carriers_desc:0 "Düşmanlarımızın gerisinde kalmamak için, donanmamıza uçakları dahil etmemiz gerekiyor. Bunu yapmak için kendi uçak gemilerimizi üretmeliyiz. Daha büyük, modası geçmiş gemilerimizin gövdelerini kullanmak, üretimlerini hızlandırmanın bir yolu olabilir."
 SMB_army:0 "[SMB_army_key]"
 SMB_army_ARG:0 "Ejército Argentino"
 SMB_army_BRA:0 "Exército Brasileiro"
 SMB_army_CHL:0 "Ejército de Chile"
 SMB_army_PAR:0 "Ejército Paraguayo"
 SMB_army_URG:0 "Ejército Nacional del Uruguay"
 SMB_army_academy:0 "[SMB_army_academy_key]"
 SMB_army_academy_BRA:0 "Academia Militar"
 SMB_army_academy_default:0 "Ordu Akademisini Genişlet"
 SMB_army_academy_default_desc:0 "Etkili silahlara sahip olmak, bir savaşın sonucunu belirleyen tek faktör değildir. Başka bir büyük faktör, sadece bireysel askerin değil, aynı zamanda birlikleri komuta eden generalin de becerisidir. Bu amaca ulaşmak için, askeri akademimizin ordu departmanının operasyonlarını genişletmeye yatırım yapmalıyız."
 SMB_army_academy_desc:0 "[SMB_army_academy_desc_key]"
 SMB_army_default:0 "Fuerzas Armadas'ı Silahlandır"
 SMB_army_default_desc:0 "Hafife alınacak gibi olmasalar da, silahlı kuvvetlerimiz hala istenenden çok daha zayıf. Askerleri daha modern silahlarla donatmanın yanı sıra onları her an savaşa hazır olacak şekilde eğitmek esastır."
 SMB_army_desc:0 "[SMB_army_desc_key]"
 SMB_army_professionalism:0 "[SMB_army_professionalism_key]"
 SMB_army_professionalism_CHL:0 "Ordunun Prusyalılaştırılması"
 SMB_army_professionalism_default:0 "Ordu Profesyonelliğini Daha da Artır"
 SMB_army_professionalism_default_desc:0 "Mümkün olduğu kadar çok askerin orduya katılmak için beklemede olması iyi bir uygulama olabilir, ancak yabancı askeri danışmanlarımıza göre, ordunun herhangi bir anda en iyi durumda performans göstermesini sağlamak çok daha önemlidir."
 SMB_army_professionalism_desc:0 "[SMB_army_professionalism_desc_key]"
 SMB_army_support:0 "[SMB_army_support_key]"
 SMB_army_support_default:0 "Ordu Desteği"
 SMB_army_support_default_desc:0 "Ordu, gökyüzünden aktif olarak vuruluyorsa kazanamaz. Bu yüzden, hava kuvvetlerimizi sadece onlara karşı savunmak için kullanmakla kalmayıp, uçaklar aynı zamanda rakiplerimize karşı aynı şeyi yapmak için de ağır bir şekilde donatılmalıdır."
 SMB_army_support_desc:0 "[SMB_army_support_desc_key]"
 SMB_artillery:0 "[SMB_artillery_key]"
 SMB_artillery_CHL:0 "Nitrat Üretimini Kullanıma Sok"
 SMB_artillery_default:0 "Ağır Silah Sanayilerini Uzmanlaştırma"
 SMB_artillery_default_desc:0 "Ekonomimiz Britanya, Fransa ve İtalya gibi büyük güçler kadar güçlü değil. Bu nedenle, istediğimiz tüm teçhizat için paramız olmasını dilesek de, daha güçlü ve daha iyi teçhizat istiyorsak ağır silah üretimini uzmanlaştırmamız gerekecek."
 SMB_artillery_desc:0 "[SMB_artillery_desc_key]"
 SMB_atacama_training:0 "Atacama Çölü'nde Eğitim"
 SMB_atacama_training_desc:0 "Askerlerimizin tropiklerin ve çöllerin sıcağında etkili bir şekilde savaşmalarını istiyorsak düzgün bir şekilde eğitilmeleri gerekiyor. Bu sorunu çözmenin en iyi yolu, Atacama çölünde eğitim kampları kurmaktır, burada sıcağa daha iyi alışabilirler."
 SMB_blue_water_fleet:0 "[SMB_blue_water_fleet_key]"
 SMB_blue_water_fleet_default:0 "Açık Deniz Filosu"
 SMB_blue_water_fleet_desc:0 "Deniz gücünün yansıtılması, büyük güçler arasına girmeyi veya olası düşmanlara karşı güçlü bir caydırıcılık sürdürmeyi arzulayan her ulus için kritiktir. Bu nedenle, donanmamızın ana limanlardan uzakta bile etkili bir şekilde çalışmak için doğru teçhizata ve eğitime sahip olduğundan emin olmalıyız."
 SMB_brown_water_navy:0 "Nehir Donanması"
 SMB_brown_water_navy_desc:0 "Güney Amerika'nın ormanlarından geçen nehirler ordumuz tarafından yeterince kullanılmıyor. Takviyelerden veya ikmalden uzak olduklarında askerlerimize destek olmak için nehir donanmamızı bir dizi küçük nehir saldırı botuyla genişleteceğiz."
 SMB_carrier_conversion:0 "Dönüştürülmüş Uçak Gemileri"
 SMB_carrier_conversion_desc:0 "Deniz hava gücümüz ulusal çıkarlarımızı savunmak için yetersiz. Amaca yönelik inşa edilmiş gemiler inşa etmeye gücümüz yetmese de, hizmet dışı bırakılmış kruvazörler satın alıp onları geçici bir çözüm olarak basit gemilere dönüştürebiliriz."
 SMB_coastal_fleet:0 "[SMB_coastal_fleet_key]"
 SMB_coastal_fleet_default:0 "Kıyı Filosu"
 SMB_coastal_fleet_desc:0 "Dünya çapında savaşmak için pek bir hevesimiz yok. Bu nedenle filomuzun birincil hedefi, kıyı şeritlerimizi korumak ve herhangi bir düşmanın kıyılarımıza asker çıkarmasını önlemek olmalıdır."
 SMB_conscription:0 "[SMB_conscription_key]"
 SMB_conscription_CHL:0 "Büyük Savaş'tan Dersler"
 SMB_conscription_default:0 "Zorunlu Askerliği Artır"
 SMB_conscription_default_desc:0 "Askerlerimizin profesyonelliği belki sorgulanabilir olsa da, şüphesiz ordumuzun şu anda umutsuzca ihtiyaç duyduğu şey, safları dolduracak daha fazla askerdir, çünkü silahlı kuvvetlerimize katılmaya istekli erkek eksikliği çekiyoruz."
 SMB_conscription_desc:0 "[SMB_conscription_desc_key]"
 SMB_construct_air_bases:0 "[SMB_construct_air_bases_key]"
 SMB_construct_air_bases_default:0 "Yeni Hava Üsleri İnşa Et"
 SMB_construct_air_bases_default_desc:0 "Profesyonel, iyi eğitimli ve motive pilotlara ihtiyaç duymanın yanı sıra, büyük bir hava kuvveti için gerekli olan başka bir kritik işlevden, havaalanlarından da yoksunuz. Birkaç tane olsa da, hava kuvvetini rekabetçi olabileceği bir seviyeye çıkarmak istiyorsak yeterli değiller."
 SMB_construct_air_bases_desc:0 "[SMB_construct_air_bases_desc_key]"
 SMB_construct_naval_bases:0 "[SMB_construct_naval_bases_key]"
 SMB_construct_naval_bases_default:0 "Yeni Deniz Üsleri İnşa Et"
 SMB_construct_naval_bases_desc:0 "Deniz tesislerimiz modası geçmiş ve acilen modernizasyona ihtiyaç duyuyor. Bu tür tesislere yatırım yaparak, çok daha yetenekli deniz varlıkları inşa edip destekleyebileceğiz."
 SMB_cruiser_subs:0 "[SMB_cruiser_subs_key]"
 SMB_cruiser_subs_default:0 "Kruvazör Denizaltıları"
 SMB_cruiser_subs_desc:0 "Atlantik ve Pasifik Okyanusları geniştir ve uzun süreler boyunca kendi başlarına verimli bir şekilde çalışabilen denizaltılar gerektirir. Bu nedenle kendi kruvazör denizaltılarımızı geliştirmeye yatırım yapmalıyız."
 SMB_degaussing:0 "[SMB_degaussing_key]"
 SMB_degaussing_default:0 "Manyetik Alan Giderme"
 SMB_degaussing_desc:0 "Gemi gövdelerimizin manyetik alanını azaltarak degauss işlemine başlayacağız. Bu onları manyetik mayınlardan korur ve gemilerin elektronik profilini azaltır."
 SMB_department_of_military_intelligence:0 "[SMB_department_of_military_intelligence_key]"
 SMB_department_of_military_intelligence_default:0 "Askeri İstihbarat Departmanı"
 SMB_department_of_military_intelligence_default_desc:0 "Kelimeler anlam olarak birbirine zıt olsa da, düşmanların konumları ve motivasyonları hakkında uygun bilgi olmadan, onları kafa kafaya bir savaşta yenmenin zor olacağını anlamak önemlidir. Bu nedenle ordu için bir askeri istihbarat departmanının oluşturulması bir zorunluluktur."
 SMB_department_of_military_intelligence_desc:0 "[SMB_department_of_military_intelligence_desc_key]"
 SMB_department_of_propaganda:0 "[SMB_department_of_propaganda_key]"
 SMB_department_of_propaganda_default:0 "Propaganda Departmanı"
 SMB_department_of_propaganda_default_desc:0 "Dünya alevler içinde ve en büyük çabalarımıza rağmen, sivil nüfusumuzun tamamı savaş hareketini desteklemiyor. Bu nedenle, halkı silahlı, uluslararası mücadelenin faydalarına ikna etmeye adanmış bir departman kurmalıyız."
 SMB_department_of_propaganda_desc:0 "[SMB_department_of_propaganda_desc_key]"
 SMB_domestic_designs:0 "[SMB_domestic_designs_key]"
 SMB_domestic_designs_default:0 "Yerli Tasarımlar"
 SMB_domestic_designs_default_desc:0 "Kendi modellerimizi ve uçak tasarımlarımızı yaratmak ve üretmek en iyisi olur, çünkü diğer ülkeler pilotlarımıza uygun uçakları tasarlama veya üretme konusunda güvenilir kabul edilemez."
 SMB_domestic_designs_desc:0 "[SMB_domestic_designs_desc_key]"
 SMB_domestic_production:0 "[SMB_domestic_production_key]"
 SMB_domestic_production_BRA:0 "DTPE Tavsiyelerine Uy"
 SMB_domestic_production_default:0 "Yerli Üretime Odaklan"
 SMB_domestic_production_default_desc:0 "Şüphesiz daha zor ve zaman alıcı olsa da, ürünün kalitesini sağlamak ve silah teslimatlarımızın gelmeden önce çalınma riskini almamak için tankları kendi ülkemizde geliştirmek ve üretmek çok daha faydalıdır."
 SMB_domestic_production_desc:0 "[SMB_domestic_production_desc_key]"
 SMB_enlarge_naval_facilities:0 "[SMB_enlarge_naval_facilities_key]"
 SMB_enlarge_naval_facilities_default:0 "Deniz Tesislerini Genişlet"
 SMB_enlarge_naval_facilities_desc:0 "Dünya genelindeki son gelişmeler, yeterli bir filoyu sürdürmek istiyorsak donanmamızın genişlemesi gerektiğini açıkça ortaya koydu. Bunu yapmanın ilk adımı, mevcut deniz tesislerimizi genişletmektir."
 SMB_escort_fleet:0 "[SMB_escort_fleet_key]"
 SMB_escort_fleet_default:0 "Eskort Filosu"
 SMB_escort_fleet_desc:0 "Büyük savaş filolarının günleri geçti, modern deniz savaşı, sınırlı sayıda ana muharebe gemisinin yanında eskort formasyonlarında daha küçük gemi filoları gerektirir. Bu nedenle donanmanın, bu tür taktikleri barındırmak için planlarını yeniden yönlendirmesi gerekiyor. "
 SMB_establish_aircraft_industry:0 "[SMB_establish_aircraft_industry_key]"
 SMB_establish_aircraft_industry_BRA:0 "Empresa Brasileira de Aeronáutica"
 SMB_establish_aircraft_industry_default:0 "Yerli bir Uçak Sanayii"
 SMB_establish_aircraft_industry_default_desc:0 "Üretim verimliliğimizi mümkün olduğunca yüksek tutmak istiyorsak, kendi sınırlarımız içinde büyük ölçekli bir uçak sanayii kurmamız gerektiği açıktır."
 SMB_establish_aircraft_industry_desc:0 "[SMB_establish_aircraft_industry_desc_key]"
 SMB_expand_repair_yards:0 "[SMB_expand_repair_yards_key]"
 SMB_expand_repair_yards_default:0 "Onarım Tersanelerini Genişlet"
 SMB_expand_repair_yards_desc:0 "En sağlam gemilerle en verimli mürettebatlar bile sonunda aktif göreve dönmeden önce onarıma ihtiyaç duyacaktır. Sürecin mümkün olduğunca hızlı olmasını sağlamak için deniz onarım tersanelerimize yatırım yapmalıyız. "
 SMB_experimental_weapons_department:0 "[SMB_experimental_weapons_department_key]"
 SMB_experimental_weapons_department_default:0 "Deneysel Silahlar Departmanı"
 SMB_experimental_weapons_department_default_desc:0 "Teknik bölümde rakiplerimizin gerisinde kalmak istemiyorsak, harika silahlar olarak adlandırılanları teorize etmeye ve geliştirmeye başlamamız en iyisi olur, böylece savaş alanında geride kalmayız."
 SMB_experimental_weapons_department_desc:0 "[SMB_experimental_weapons_department_desc_key]"
 SMB_flying_fortress:0 "[SMB_flying_fortress_key]"
 SMB_flying_fortress_default:0 "Uçan Kaleler"
 SMB_flying_fortress_default_desc:0 "Bir hava kuvvetini düzgün bir şekilde kullanmanın tek yolu, düşmanı ufukta ayakta hiçbir şey kalmayana kadar bombalayarak teslim olmaya zorlamaktır. Bu nedenle, mümkün olduğunca çok patlayıcı taşıma kapasitesine sahip büyük uçaklar inşa etmeliyiz."
 SMB_flying_fortress_desc:0 "[SMB_flying_fortress_desc_key]"
 SMB_foreign_advisors:0 "[SMB_foreign_advisors_key]"
 SMB_foreign_advisors_default:0 "Yabancı Danışmanlar"
 SMB_foreign_advisors_default_desc:0 "[ROOT.GetAdj] askeri eğitmenleri iyi olsalar da, birden fazla çatışmada savaşmış ve diğer ülkelerdeki en yüksek prestijli askeri akademilerde eğitim görmüş olanlar kadar iyi değiller. Bu nedenle, silahlı kuvvetlerimizi daha da güçlendirmek için ordularımızı kendi ülkelerinin uzmanlık alanlarında eğitmelerine yardımcı olacak yabancı askeri danışmanları çekmek için çaba göstermeliyiz."
 SMB_foreign_advisors_desc:0 "[SMB_foreign_advisors_desc_key]"
 SMB_foreign_advisors_tt:0 "Ordumuzu eğitmek için §Yabancı Danışmanları Davet Et§! kararlarının kilidini açar"
 SMB_foreign_designs:0 "[SMB_foreign_designs_key]"
 SMB_foreign_designs_default:0 "Yabancı Tasarımları Edinme"
 SMB_foreign_designs_default_desc:0 "Kendi zırhımızı yapmak için bilim adamlarımız ve mühendislerimiz olmasını dilesek de, bunun yerine sahip olduğumuz bağlantıları kullanarak uluslararası pazarda kendimize iyi anlaşmalar ayarlamak en iyisidir, çünkü şu anda özel teçhizat edinmek için tek gerçek ve uygulanabilir seçenek budur."
 SMB_foreign_designs_desc:0 "[SMB_foreign_designs_desc_key]"
 SMB_fortification_effort:0 "[SMB_fortification_effort_key]"
 SMB_fortification_effort_BRA:0 "Tamandaré Duvarı"
 SMB_fortification_effort_default:0 "Tahkimat Çabaları"
 SMB_fortification_effort_desc:0 "Donanma ve hava kuvvetleri, düşman kuvvetlerinin kıyılarımıza ulaşmasını önlemedeki birincil araçlarımız olsa da, yine de herhangi bir olası işgalciye karşı son bir savunma hattı olarak sağlam bir dizi kıyı tahkimatı sürdürmeliyiz."
 SMB_jet_tech_bonus:0 "Gelişmiş Hava Bonusu"
 SMB_joint_operative_command:0 "[SMB_joint_operative_command_key]"
 SMB_joint_operative_command_default:0 "Müşterek Harekat Komutanlığı"
 SMB_joint_operative_command_default_desc:0 "Artık sadece ordumuzu geliştirmekle kalmayıp, aynı zamanda hava kuvvetlerimiz için de iyi temeller attığımıza göre, bu farklı ordu kolları arasında koordinasyon ve işbirliği oluşturma zamanı geldi. Bu nedenle, her iki alandan seçilen komutanlardan oluşan bir müşterek harekat komutanlığı kuracağız."
 SMB_joint_operative_command_desc:0 "[SMB_joint_operative_command_desc_key]"
 SMB_jungle_pioneers:0 "$SMB_support_company_bra$"
 SMB_jungle_pioneers_desc:0 "$SMB_support_company_default_desc$"
 SMB_jungle_pioneers_tt:0 "Destek taburunun kilidini açar §YOrman Öncüleri:§!\n §YOrman§!:\n  Hareket §G+%30§!, \n  Saldırı §G+%10§!, \n  Savunma §G+%20§!"
 SMB_jungle_warfare_training:0 "CIGS Kur"
 SMB_jungle_warfare_training_desc:0 "Bir dizi askeri subayımız, Amazon'da özel bir eğitim tesisi kurulmasına yatırım yapmamızı şiddetle tavsiye etti. Tesisin amacı, birliklerimizi ormanda alışılmadık savaşa hazırlamak ve savaş sırasında araziyi bir müttefik olarak kullanmayı teşvik etmek olacaktır."
 SMB_license_designs:0 "[SMB_license_designs_key]"
 SMB_license_designs_default:0 "Yabancı Tasarımları Lisansla"
 SMB_license_designs_default_desc:0 "Kendi uçak tasarımımızı araştırmak ve geliştirmek çok fazla zaman ve çaba gerektirir. Bu yüzden bunun yerine yabancı teçhizatı lisanslamalı ve sadece onu burada [ROOT.GetNameDef]'de üretmeye odaklanmalıyız."
 SMB_license_designs_desc:0 "[SMB_license_designs_desc_key]"
 SMB_logistics_department:0 "[SMB_logistics_department_key]"
 SMB_logistics_department_BRA:0 "Departamento de Logística"
 SMB_logistics_department_default:0 "Bir Lojistik Departmanı Kurma"
 SMB_logistics_department_default_desc:0 "Güney Amerika evimiz olabilir, ancak yine de düzenli orduların savaşması için acımasız bir kıtadır. Bu sorunu hafifletmek için, yalnızca lojistiğin uygun yönetimi ve dağıtımına adanmış bir silahlı kuvvetler kolu kurmak faydalı olacaktır."
 SMB_logistics_department_desc:0 "[SMB_logistics_department_desc_key]"
 SMB_mechanized_troops:0 "[SMB_mechanized_troops_key]"
 SMB_mechanized_troops_default:0 "Birlikleri Mekanize Et"
 SMB_mechanized_troops_default_desc:0 "Silahlı kuvvetlerimizi ilerletmek ve savaşın geleceğini düzgün bir şekilde kucaklamak için, düzenli birliklerimizi mekanize etmek için kapsamlı bir çaba göstereceğiz, böylece tank alaylarının yanında güvenli bir zırh katının arkasından savaş alanında büyük bir yıkım yaratabilirler."
 SMB_mechanized_troops_desc:0 "[SMB_mechanized_troops_desc_key]"
 SMB_merchant_marine:0 "[SMB_merchant_marine_key]"
 SMB_merchant_marine_BRA:0 "Educar e Navegar"
 SMB_merchant_marine_default:0 "Güçlü bir Ticari Donanma"
 SMB_merchant_marine_desc:0 "Kaynakların deniz yoluyla taşınması, bizimki de dahil olmak üzere birçok ulusun ulusal güvenliği için hayati önem taşımaktadır. Bu nedenle, kriz zamanlarında ordumuzu destekleyebilecek profesyonel bir ticari deniz filosu kurmalıyız."
 SMB_midget_subs:0 "[SMB_midget_subs_key]"
 SMB_midget_subs_default:0 "Cüce Denizaltılar"
 SMB_midget_subs_desc:0 "Geniş okyanuslarda kendi kendine yeten denizaltılar işletmek verimsiz bir çaba olurdu. Kaynaklarımızı, kıyı şeridimizin daha sığ sularında çalışan daha küçük gemiler inşa ederek daha iyi kullanabiliriz."
 SMB_military_facilities:0 "[SMB_military_facilities_key]"
 SMB_military_facilities_BRA:0 "Exército Teknik ve Üretim Departmanı"
 SMB_military_facilities_default:0 "Askeri Tesisleri Genişlet"
 SMB_military_facilities_default_desc:0 "Orduyu düzgün bir şekilde silahlandırmak için, silah sanayisini büyütmeliyiz. Bu nedenle, askeri teçhizat üretimine özel olarak tasarlanmış yeni sanayi tesisleri inşa etmek bir zorunluluktur."
 SMB_military_facilities_desc:0 "[SMB_military_facilities_desc_key]"
 SMB_minelaying:0 "[SMB_minelaying_key]"
 SMB_minelaying_bonus:0 "Mayın Döşeme Çabası"
 SMB_minelaying_default:0 "Mayın Döşemeyi İyileştir"
 SMB_minelaying_desc:0 "Geniş kıyı şeridimizi her zaman savunacak kadar gemi bulundurmak aşırı derecede pahalı olabilir. Mayınlar, filo gelene kadar düşman kuvvetlerini caydırmaya veya yavaşlatmaya yardımcı olabilecek daha ucuz bir çözüm sunar."
 SMB_motorized:0 "[SMB_motorized_key]"
 SMB_motorized_default:0 "Motor Sanayilerine Yatırım Yap"
 SMB_motorized_default_desc:0 "Savaşın geleceği, düşmanları tepki vermelerine yetecek kadar zaman tanımadan kuşatmak ve yok etmek için hareket eden hızlı araçları içerir, 16. veya 17. yüzyıl piyade atış hatları gibi, gereksiz yere zaman ve insan gücü israf eden ve pek bir etkisi olmayan bir strateji değil."
 SMB_motorized_desc:0 "[SMB_motorized_desc_key]"
 SMB_mountain_guns:0 "Dağ Toplarına Yatırım Yap"
 SMB_mountain_guns_desc:0 "Ordumuz, çok güçlü olmasına rağmen, topçunun şu anda Şili'nin dağlık arazisinde neredeyse kullanılamaz olduğunu belirtti. Bu nedenle, dağlarda daha kolay kullanılabilir hale getirilmiş dağ topları için bir sipariş verdiler, böylece bu ölümcül silahı kullanmaya devam edebiliriz."
 SMB_naval_academy:0 "[SMB_naval_academy_key]"
 SMB_naval_academy_BRA:0 "Escola Naval'i Genişlet"
 SMB_naval_academy_CHL:0 "Escuela Naval'i Güçlendir"
 SMB_naval_academy_CHL_desc:0 "Escuela Naval'ımızın yetenekli deniz subayları yetiştirme konusunda uzun bir geçmişi var, ancak amirallerimizin ve kaptanlarımızın modern deniz savaşına hazır olmalarını sağlamak için sürekli yatırım hayati önem taşıyor."
 SMB_naval_academy_default:0 "Deniz Akademisini Güçlendir"
 SMB_naval_academy_default_desc:0 "Sadece gemi üretmek ve bakımını yapmak bir donanma oluşturmak için yeterli değildir. Bir savaşta deniz varlıklarını nasıl kullanacakları konusunda yüksek düzeyde eğitimli subaylara ve uzmanlara ihtiyacımız var. Bu nedenle, bir sonraki nesil deniz subaylarını eğitmek için bir [ROOT.GetAdjective] deniz akademisi kuracağız."
 SMB_naval_academy_desc:0 "[SMB_naval_academy_desc_key]"
 SMB_naval_foreign_advisors:0 "[SMB_naval_foreign_advisors_key]"
 SMB_naval_foreign_advisors_default:0 "Deniz Danışmanları Davet Et"
 SMB_naval_foreign_advisors_desc:0 "Deniz subaylarımız son zamanlarda yeteneklerini savaşta test etme fırsatı bulamadılar. Bu nedenle, kendi subaylarımızı modern deniz taktikleri konusunda eğitmeleri için yabancı donanmalardan subaylar davet etmekten fayda görebiliriz."
 SMB_naval_invasion:0 "[SMB_naval_invasion_key]"
 SMB_naval_invasion_default:0 "Deniz Çıkarması"
 SMB_naval_invasion_desc:0 "Bir düşman ulusla başa çıkmak genellikle askerlerin kıyılarına inmesini gerektirir. Bu tür operasyonları gerçekleştirme yeteneğimizi en üst düzeye çıkarmak için, ordu ve donanmayı ortak tatbikatlarda eğitmeye başlayacağız. "
 SMB_naval_support:0 "[SMB_naval_support_key]"
 SMB_naval_support_default:0 "Deniz Desteğine Odaklan"
 SMB_naval_support_default_desc:0 "Uçaklarımızın bir numaralı hedefi, donanmalarımız ve sivil konvoylarımız için yolu açmamıza ve onları korumamıza yardımcı olmaktır. Bu nedenle, uçakları deniz desteği ve devriye rolüyle tasarlamak ve gemideki uçaksavar topları tarafından düşürülmekten kaçınabildiklerinden emin olmak önemlidir."
 SMB_naval_support_desc:0 "[SMB_naval_support_desc_key]"
 SMB_navy:0 "[SMB_navy_key]"
 SMB_navy_ARG:0 "Armada de Argentina"
 SMB_navy_BRA:0 "Marinha do Brasil"
 SMB_navy_CHL:0 "Armada de Chile"
 SMB_navy_PAR:0 "Armada Paraguaya"
 SMB_navy_URG:0 "Armada Nacional del Uruguay"
 SMB_navy_default:0 "Donanma"
 SMB_navy_desc:0 "[SMB_navy_desc_key]"
 SMB_navy_desc_default:0 "Donanmamız Büyük Savaş'tan bu yana o kadar durgunlaştı ki, gemilerimizin birçoğu artık amaca uygun değil. Filoya yatırım yapma ve büyük bir modernizasyon programı başlatma zamanı geldi."
 SMB_navy_foreign_advisors_tt:0 "Donanmamızı eğitmek için §Yabancı Danışmanları Davet Et§! kararlarının kilidini açar"
 SMB_nimble_air_force:0 "[SMB_nimble_air_force_key]"
 SMB_nimble_air_force_default:0 "Çevik bir Hava Kuvveti"
 SMB_nimble_air_force_default_desc:0 "Uçaklar sadece düşman uçaklarını değil, aynı zamanda onların uçaksavar toplarının ve deniz gemilerinin izleyen gözlerini de atlatabilmelidir. Ve hava kuvveti, hızlı ve kararlı bir şekilde manevra yapacak kadar ağır olmadan, it dalaşı ve saldırıları yeterince verimli bir şekilde gerçekleştirmek için donatılmış daha küçük uçaklardan oluşmalıdır."
 SMB_nimble_air_force_desc:0 "[SMB_nimble_air_force_desc_key]"
 SMB_nuclear_program:0 "[SMB_nuclear_program_key]"
 SMB_nuclear_program_default:0 "Yerli bir Nükleer Program"
 SMB_nuclear_program_default_desc:0 "Amerikalılar ve Almanlar atomun sırlarını ortaya çıkarmak için çok çalışıyorlar ve onların gerisinde kalmamıza izin veremeyiz. Akıllarında savaş olsa da, bilim adamlarımız atomun bölünmesini sivil yaşamı iyileştirmek için kullanma yollarından da bahsediyorlar."
 SMB_nuclear_program_desc:0 "[SMB_nuclear_program_desc_key]"
 SMB_nuclear_program_key_BRA:0 "Programa Paralelo"
 SMB_purchase_aircraft:0 "[SMB_purchase_aircraft_key]"
 SMB_purchase_aircraft_default:0 "Yabancı Uçak Satın Al"
 SMB_purchase_aircraft_default_desc:0 "Hava kuvvetlerimiz, sadece geliştirmekle kalmayıp aynı zamanda kendi uçaklarımızı üretmenin de çok maliyetli ve zaman alıcı olacağına karar verdi. Bunun yerine yabancı teçhizat satın almayı savunuyorlar ve bizim de almamız gereken tavır bu."
 SMB_purchase_aircraft_desc:0 "[SMB_purchase_aircraft_desc_key]"
 SMB_purchase_aircraft_tt:0 "Yabancı güçlerden §YUçak Satın Al§! kararının kilidini açar"
 SMB_purchase_cruisers_and_dreadnoughts:0 "[SMB_purchase_cruisers_and_dreadnoughts_key]"
 SMB_purchase_cruisers_and_dreadnoughts_BRA:0 "Minas Gerais sınıfı Zırhlı Değişimi"
 SMB_purchase_cruisers_and_dreadnoughts_default:0 "Kruvazör ve Dretnot Satın Al"
 SMB_purchase_cruisers_and_dreadnoughts_desc:0 "Sanayi gücümüz büyümeye devam ederken, zaman bizim lehimize değil. Donanmamızı yeterince güçlendirmek için, mümkün olan en kısa sürede daha fazla ana muharebe gemisine ihtiyacımız var. Bu nedenle, büyük güçlere ulaşıp naftalinlenmiş dretnotlarını ve kruvazörlerini satmaya istekli olup olmadıklarını göreceğiz."
 SMB_purchase_destroyers_and_subs:0 "[SMB_purchase_destroyers_and_subs_key]"
 SMB_purchase_destroyers_and_subs_default:0 "Muhrip ve Denizaltı Satın Al"
 SMB_purchase_destroyers_and_subs_desc:0 "Dünya giderek daha istikrarsız hale gelirken, deniz gücü yansıtma yeteneklerimizi genişletmemiz gerekiyor. Şansımıza, büyük donanmalardan bazıları eski gemilerinden ayrılmaya istekli olabilir."
 SMB_purchase_obsolete_ships_tt:0 "Büyük güçlerden dretnot ve diğer eski ana muharebe gemilerini satın almak için §Y$south_american_naval_arms_race_category$§! kararlarının kilidini açar."
 SMB_raiding_fleet:0 "[SMB_raiding_fleet_key]"
 SMB_raiding_fleet_default:0 "Baskın Filosu"
 SMB_raiding_fleet_desc:0 "Deniz ikmal hatları, çoğu ekonominin işleyişi için çok önemlidir. Deniz varlıklarımızı bu ikmal hatlarını bozmak için kullanmak, en güçlü ulusları bile dize getirmenin bir yolu olabilir."
 SMB_reescalate_the_naval_arms_race:0 "[SMB_reescalate_the_naval_arms_race_key]"
 SMB_reescalate_the_naval_arms_race_BRA:0 "Corrida Armamentista Donanması"
 SMB_reescalate_the_naval_arms_race_default:0 "Deniz Silahlanma Yarışını Yeniden Tırmandır"
 SMB_reescalate_the_naval_arms_race_desc:0 "Donanmalarımızın büyüklüğü konusunda komşularımızla resmi bir anlaşmamız olmasa da, Büyük Savaş'tan bu yana onları çok fazla genişletmekten kaçındık. Ancak, savaş yine ufukta ve komşularımıza göre yeniden silahlanmada bir başlangıç yapmak bizim için daha iyi olur. "
 SMB_regular_infantry:0 "[SMB_regular_infantry_key]"
 SMB_regular_infantry_default:0 "Sıradan Askerin Gücü"
 SMB_regular_infantry_default_desc:0 "Teçhizat her şey kadar önemli olsa da, herhangi bir ordunun gerçek gücü, anavatanını savunan, temel değerlerini koruyan ve sevdikleri için savaşan bireysel askerdir. Bu yüzden sıradan askerin moralini artırmak ve ona en zorlu savaşlarını kazanma şansını en iyi şekilde vermek için elimizden gelenin en iyisini yapmalıyız."
 SMB_regular_infantry_desc:0 "[SMB_regular_infantry_desc_key]"
 SMB_special_forces:0 "[SMB_special_forces_key]"
 SMB_special_forces_BRA:0 "Comando de Operações Especiais"
 SMB_special_forces_default:0 "Özel Kuvvetler Programları"
 SMB_special_forces_default_desc:0 "Ordumuz küçük olsa da, belirli durumlarda ve savaş türlerinde üstün olan özel eğitimli askerleri kullanarak büyük ölçüde güçlendirilebilir. Bu nedenle, bu tür askerleri eğitmek ve barındırmak için programlar oluşturmak bir numaralı önceliğimiz olarak kabul edilmelidir."
 SMB_special_forces_desc:0 "[SMB_special_forces_desc_key]"
 SMB_special_forces_option_1:0 "[SMB_special_forces_option_1_key]"
 SMB_special_forces_option_1_continuation:0 "[SMB_special_forces_option_1_continuation_key]"
 SMB_special_forces_option_1_continuation_default:0 "Korucu Eğitim Programları"
 SMB_special_forces_option_1_continuation_default_desc:0 "Dağcılarımızı desteklemek için, sadece dağların çevresinde değil, aynı zamanda Güney Amerika'nın ormanlarında ve cangıllarında saldırma ve keşif konusunda özel olarak eğitilmiş askerler olan Korucuları kullanmalıyız."
 SMB_special_forces_option_1_continuation_desc:0 "[SMB_special_forces_option_1_continuation_desc_key]"
 SMB_special_forces_option_1_default:0 "Dağ Alaylarını Güçlendir"
 SMB_special_forces_option_1_default_desc:0 "Ordunun Dağcıları, düzenli birliklerimizin ancak hayal edebileceği başarılar sergiledikleri için üst komutanlığımızın özel ilgisini görmelidir. Hain And Dağları'nda savaş yapmalarını sağlarlar ve ilerlerken düzenli birliklerimizi destekleyebilirler."
 SMB_special_forces_option_1_desc:0 "[SMB_special_forces_option_1_desc_key]"
 SMB_special_forces_option_2:0 "[SMB_special_forces_option_2_key]"
 SMB_special_forces_option_2_BRA:0 "Corpo de Fuzileiros Navais"
 SMB_special_forces_option_2_CHL:0 "Deniz Piyadelerini Canlandır"
 SMB_special_forces_option_2_CHL_desc:0 "[ROOT.GetNameDefCap]'in uzun bir deniz piyade geleneği vardır, ancak Pasifik Savaşı'nın sonundan bu yana, kıyı topçu birimlerine indirgenmişlerdir. Bunları seferi savaş için donatılmış bir deniz piyade birliğine dönüştürerek, [ROOT.GetNameDef] 19. yüzyılda başarılı bir şekilde yaptığı gibi tekrar denizaşırı güç yansıtabilecektir."
 SMB_special_forces_option_2_continuation:0 "[SMB_special_forces_option_2_continuation_key]"
 SMB_special_forces_option_2_continuation_default:0 "Deniz Piyadelerini Destekle"
 SMB_special_forces_option_2_continuation_default_desc:0 "Deniz Piyadelerimizin tam kapasite ve etkinlikte işlev görmesi için, onları destekleyen teknolojiler geliştirmeyi düşünmeliyiz, örneğin çıkarma araçları ve kıyıya inerken daha iyi ikmal dağıtım teknikleri."
 SMB_special_forces_option_2_continuation_desc:0 "[SMB_special_forces_option_2_continuation_desc_key]"
 SMB_special_forces_option_2_default:0 "Güçlü bir Deniz Piyade Birliği"
 SMB_special_forces_option_2_default_desc:0 "Donanma mevcut güçlü noktalarımızdan biri olduğu için, bu gerçeği kullanmak ve onlara kendi askeri kollarını, yani zorlu bir şekilde eğitilmiş ve son derece etkili deniz piyadelerinden oluşan bir kol vermelerine izin vermek fazlasıyla faydalı olacaktır."
 SMB_special_forces_option_2_desc:0 "[SMB_special_forces_option_2_desc_key]"
 SMB_special_forces_option_3:0 "[SMB_special_forces_option_3_key]"
 SMB_special_forces_option_3_BRA:0 "Brigada de Infantaria Paraquedista"
 SMB_special_forces_option_3_continuation:0 "[SMB_special_forces_option_3_continuation_key]"
 SMB_special_forces_option_3_continuation_default:0 "Hava İndirmelerini Destekleme"
 SMB_special_forces_option_3_continuation_default_desc:0 "Paraşütçülerimizin atlayışları gerçekleştirirken mümkün olan en yüksek başarı şansına sahip olmaları için, hayatta kalma kabiliyetlerini artırmaya yardımcı olan teknolojiler geliştirmeyi düşünmeliyiz, bunlar ister atılabilir zırh ister kamufle edilmiş ikmal sandıkları olsun."
 SMB_special_forces_option_3_continuation_desc:0 "[SMB_special_forces_option_3_continuation_desc_key]"
 SMB_special_forces_option_3_default:0 "Hava Kuvvetleri Ordu Kolunu Genişlet"
 SMB_special_forces_option_3_default_desc:0 "Hava kuvvetleri mevcut güçlü noktalarımızdan biri olduğu için, bu gerçeği kullanmak ve onlara kendi askeri kollarını, yani özel eğitimli ve son derece etkili paraşütçülerden oluşan bir kol vermelerine izin vermek fazlasıyla faydalı olacaktır."
 SMB_special_forces_option_3_desc:0 "[SMB_special_forces_option_3_desc_key]"
 SMB_strategic_bombing:0 "[SMB_strategic_bombing_key]"
 SMB_strategic_bombing_default:0 "Stratejik Bombalamaya Odaklan"
 SMB_strategic_bombing_default_desc:0 "Bir savaşı sadece savaşta değil, aynı zamanda ekonomilerini ve endüstriyel yeteneklerini felç ederek de kazanırsınız. Bu yüzden stratejik bombalama savaş sırasındaki bir numaralı hedefimiz olarak kabul edilmelidir."
 SMB_strategic_bombing_desc:0 "[SMB_strategic_bombing_desc_key]"
 SMB_support_company:0 "[SMB_support_company_key]"
 SMB_support_company_bra:0 "Orman Öncü Eğitimi"
 SMB_support_company_default:0 "Destek Bölüklerinin Önemi"
 SMB_support_company_default_desc:0 "Lojistik departmanımızın son zamanlardaki kuruluşu bir dizi keşfe yol açtı. Her şeyden önce, ikmal akışını sürdürmek için yeterli miktarda uygun teçhizat ve malzeme yapılması gerekiyor ve mevcut malzememiz yeterli değil. Rakiplerimizle başa çıkmak istiyorsak destek teçhizatımızı modernize etmeliyiz."
 SMB_support_company_desc:0 "[SMB_support_company_desc_key]"
 SMB_tactical_air_force:0 "[SMB_tactical_air_force_key]"
 SMB_tactical_air_force_default:0 "Taktik bir Hava Kuvveti"
 SMB_tactical_air_force_default_desc:0 "Hava kuvveti sadece kara kuvvetlerini desteklemek için değil, aynı zamanda kara kuvvetlerinin tek başına yapamayacağı bir dizi daha karmaşık görevi yerine getirmek için de kullanılmalıdır. Bir hava kuvvetini harika yapan şeyin gerçek özü budur."
 SMB_tactical_air_force_desc:0 "[SMB_tactical_air_force_desc_key]"
 SMB_tank_warfare:0 "[SMB_tank_warfare_key]"
 SMB_tank_warfare_default:0 "Tank Savaşı"
 SMB_tank_warfare_default_CHL:0 "Patagonya'da Savaş"
 SMB_tank_warfare_default_desc:0 "Mobil bir orduya en iyi ek, karşılaştıkları hemen hemen her düşmanı alt edebilecek ateş gücüne sahip güçlü metal devlerin bir birimidir. Tek soru, tank üretimimizin Alman Blitz stratejisine mi odaklanması gerektiği, yoksa piyade için bir destek olarak mı çalışmaları gerektiğidir?"
 SMB_tank_warfare_desc:0 "[SMB_tank_warfare_desc_key]"
 SMB_tank_warfare_tt:0 "Ulusal zırh programlarımızı §YUzmanlaştırmak§! için kararların kilidini açar"
 SMB_tierra_del_fuego_training:0 "Tierra del Fuego'da Eğitim"
 SMB_tierra_del_fuego_training_desc:0 "Askerlerimizin soğuk güneyde ve dağlarda etkili bir şekilde savaşmalarını istiyorsak düzgün bir şekilde eğitilmeleri gerekiyor. Bu nedenle, birlikler için Tierra del Fuego'da eğitim kampları kurduğumuzdan emin olmalıyız, böylece soğuğa daha iyi alışabilirler."
 SMB_war_planning_office:0 "[SMB_war_planning_office_key]"
 SMB_war_planning_office_default:0 "Savaş Planlama Ofisi"
 SMB_war_planning_office_default_desc:0 "Ayrıca artık ordumuzun, bilgi savaşında geride kalmamak ve onları pusuya düşürüp yok edilmelerine yol açan güncelliğini yitirmiş ayrıntılarla karşılaşmamak için uygun ve iyi düşünülmüş planlar ve emirler alabilmesini sağlamalıyız. Bu nedenle, bu çabaları daha iyi koordine etmek için bir savaş planlama ofisi kurmalıyız."
 SMB_war_planning_office_desc:0 "[SMB_war_planning_office_desc_key]"
 SMB_winning_the_air_war:0 "[SMB_winning_the_air_war_key]"
 SMB_winning_the_air_war_default:0 "Hava Savaşını Kazanma"
 SMB_winning_the_air_war_default_desc:0 "Kara desteği ve deniz bombalaması önemli kabul edilebilirken, gökyüzünün kontrolü olmadan bu eylemlerin hiçbir değerinin olmadığını fark etmek çok gereklidir. Bu nedenle, hava kuvvetlerimiz gökyüzünü mümkün olduğunca kontrol etmeye yönelik olmalıdır."
 SMB_winning_the_air_war_desc:0 "[SMB_winning_the_air_war_desc_key]"
 SMB_women_in_aviation:0 "[SMB_women_in_aviation_key]"
 SMB_women_in_aviation_default:0 "Havacılıktaki Kadınlar"
 SMB_women_in_aviation_default_desc:0 "Her zaman öyle muamele görmeseler de, kadınlar toplumda her zaman önemli bir rol oynamıştır ve şimdi onların da öne çıkıp daha önce sadece erkeklere ait olarak görülen görevleri, örneğin ülkemizin uçaklarının üretimi ve pilotluğunu yapma zamanı geldi."
 SMB_women_in_aviation_desc:0 "[SMB_women_in_aviation_desc_key]"
 URG_a_new_constitution:0 "Yeni Bir Anayasa"
 URG_a_new_constitution_desc:0 "Mevcut anayasa uygulanamaz durumda. Ülkeyi yeni bir döneme taşıyacak yeni bir anayasaya ihtiyacımız var."
 URG_accion_revisionista_del_uruguay:0 "Acción Revisionista del Uruguay"
 URG_accion_revisionista_del_uruguay_desc:0 "Adolfo Agorio Uruguay faşizminin ana figürlerinden biridir. Onun ve benzerlerinin etkisi, [URG.GetName]'i kasıp kavuracak daha büyük bir hareket için sıçrama tahtası olabilir. Onları hükümete davet etmeli ve onlara gereken meşruiyeti vermeliyiz."
 URG_allow_nazi_movements_among_german_uruguayan:0 "[GER.GetAdjective]-[URG.GetAdjective] Nazi Hareketleri"
 URG_allow_nazi_movements_among_german_uruguayan_desc:0 "Ülkedeki [GER.GetAdjective]-[URG.GetAdjective] azınlıklar arasında, şüphesiz anavatanlarının dış politikasından etkilenen küçük bir Nazi Hareketi var. Bazıları bu söylemi kapatma çağrısında bulunuyor, ancak gündemimizi daha da yaymak için kullanılabilir."
 URG_american_air_bases:0 "Amerikan Hava Üsleri"
 URG_american_air_bases_desc:0 "Amerika, topraklarımızda hava üsleri kurmalarına izin vermemiz için bize baskı yapıyor. Bu, kendimizi herhangi bir Mihver tehdidine karşı korumamıza kesinlikle yardımcı olacaktır."
 URG_americanism:0 "Amerikancılık"
 URG_americanism_desc:0 "Ülke olarak Güney Amerika değerlerine odaklanmalı ve dış ilişkilerimizde bu değerleri korumalıyız."
 URG_anti_imperialism:0 "Anti-Emperyalizm"
 URG_anti_imperialism_desc:0 "Emperyalizme ve yabancı güçlerin Güney Amerika'daki tecavüzlerine karşı net bir duruş sergilememiz gerekiyor."
 URG_anticentralism:0 "Anti-Merkeziyetçilik"
 URG_anticentralism_desc:0 "Ülkeyi Montevideo etrafında merkezileştirme çabalarının makul olmadığı açıktır. En iyisi kırsal kesimin değerlerini oldukları yerde, kentsel nüfusun değerlerini de oldukları yerde korumaktır ki böylece hepsi birlikte gelişebilsin."
 URG_blanco_victory:0 "Blanco'nun Seçim Zaferi"
 URG_blanco_victory_desc:0 "Muhtemelen Gabriel Terras Diktatörlüğünün neden olduğu bir kargaşa, seçmenlerin Colorados'tan uzaklaşmasına ve Blanco'ların iktidara gelmesine neden oldu"
 URG_break_diplomatic_relations_with_the_axis:0 "Mihver Devletlerle Diplomatik İlişkileri Kesin"
 URG_break_diplomatic_relations_with_the_axis_desc:0 "Tarafsızlığımızı ilan etmemize rağmen Şer Ekseni'ne artık tahammül edilemeyeceği anlaşılmıştır. Savaşın rüzgarları kesinlikle Müttefiklerin lehine esmektedir ve kaybeden tarafta olmak bize yakışmaz."
 URG_break_relations_with_the_ussr:0 "[SOV.GetName] ile İlişkileri Kes"
 URG_break_relations_with_the_ussr_desc:0 "[SOV.GetName] doğal olmayan bir yapıdır. Gelecekteki bir dünya düzeni varsa, bunun Orta Avrupa ve [USA.GetName] ile yattığı açıktır, ancak bir parya devletiyle ilişkileri sürdürmek için hiçbir neden görmüyoruz."
 URG_brou:0 "BROU"
 URG_brou_desc:0 "Uruguay Doğu Cumhuriyeti Bankası'nın ek sorumluluklar alması ve dış borcumuzu tasfiye etmek için bir para fonu oluşturması gerekiyor."
 URG_colorado_victory:0 "Colorado Seçim Zaferi"
 URG_colorado_victory_desc:0 "Colorado'nun [URG.GetName]'te hüküm sürmeye devam edeceğinden hiç şüphe yoktu"
 URG_conaprole:0 "Conaprole"
 URG_conaprole_desc:0 "Süt iyidir, besin dolu ve bol miktarda bulunur ve biz onu sömürmek için birinci sınıf bir ülkeyiz. Ulusal Süt Üreticileri Kooperatifi, süt ürünleri ve ilgili altyapısı üzerinde tekel sahibi olacak ve ülke büyümesini daha da ilerletecektir."
 URG_declare_neutrality:0 "Tarafsızlık İlan Edin"
 URG_declare_neutrality_desc:0 "Avrupa işlerine karışmak gibi bir işimiz yok."
 URG_establish_the_german_uruguayan_cultural_center:0 "Fuhrmann Kültür Merkezi'ni Güçlendir"
 URG_establish_the_german_uruguayan_cultural_center_desc:0 "[GER.GetAdjective]-[URG.GetAdjective] Kültür Merkezi, Arnulf Fuhrmann tarafından ülkede Mihver'in büyümesinden bu yana giderek artan Nazi yanlısı propagandayı yaymak amacıyla kurulmuştur. Hükümet bunu engellemeye çalışırken, biz de bu çabayı finanse edeceğiz ve uygun kişilere rüşvet vererek bu işin bozulmadan devam etmesini sağlayacağız."
 URG_food_for_the_warmachine:0 "Savaş Makinesi için Yiyecek"
 URG_food_for_the_warmachine_desc:0 "Tarım arazilerinin çoğunun kontrolümüz altında olmasıyla müttefiklerimize gıda sevkiyatına başlayabilir ve gücümüzü daha da artırabiliriz."
 URG_force_through_corporatism:0 "Korporatizm Yoluyla Güç"
 URG_force_through_corporatism_desc:0 "Hükümet daha önce de Korporatizmi uygulamaya çalışmış ancak o dönemdeki politikacılar tarafından şiddetle karşı çıkılmış ve bu fikir rafa kaldırılmıştı. Bugün uzlaşma olmayacak, bu yasayı ne pahasına olursa olsun kabul ettireceğiz"
 URG_herrerismo:0 "Herrerismo"
 URG_herrerismo_desc:0 "Liderimiz, ulusçuluk, muhafazakarlık ve popülizmin bir karışımı olan Herrerismo'yu icat etti. Bununla güçlü bir siyasi taban oluşturmayı umuyor."
 URG_import_substitution:0 "İthal İkamesi"
 URG_import_substitution_desc:0 "Modern bir ekonomi yapmak için modern ekonomimizi Belçika'nın ithal ikamesi modeline dayandıracağız."
 URG_investigate_german_and_italian_cultural_organization:0 "Alman ve İtalyan kültürel organizasyonlarını incelemek"
 URG_investigate_german_and_italian_cultural_organization_desc:0 "İtalya ve Almanya ile ilgili kültür ve spor organizasyonlarının faşist sempatizanları barındırdığından şüpheleniliyor. Gözümüzü dört açmalı ve her türlü suiistimal için onları soruşturmalıyız."
 URG_join_the_allies:0 "Müttefiklere Katılın"
 URG_join_the_allies_desc:0 "[USA.GetName]'teki baskılardan sonra artık savaşın dışında kalamayacağımız açıktır. Yapabileceğimiz çok az şey şimdi savaşa dahil edilecek."
 URG_la_teja_refinery:0 "La Teja Rafinerisi"
 URG_la_teja_refinery_desc:0 "Modern bir petrol rafinerisi kurmak, dünya sahnesinde rekabetçi olmamızı ve ekonomimizi çeşitlendirmemizi sağlayacaktır."
 URG_law_no_9914:0 "Kanun No. 9914"
 URG_law_no_9914_desc:0 "[FIN.GetName] [SOV.GetNameDef] tarafından saldırıya uğradığında hükümet, Pesoların Finlere yardım etmek için bir kenara konulmasına izin veren 9914 sayılı Yasayı onayladı. Yün ve 10.600.000 gram konserve sığır eti topladık, her kutuda \"Uruguay halkından Finlandiya'nın kahraman ordusuna\" yazıyordu."
 URG_law_no_9943:0 "Kanun No. 9943"
 URG_law_no_9943_desc:0 "Tarafsız olmamıza rağmen dünyanın hızla belirsizliğe sürüklendiği açıktır. Güçlerimizi hazırlamalı ve sınırlarımızı savunmak için ülke çapında zorunlu askerliği yürürlüğe koymalıyız."
 URG_legacy_of_batlle:0 "Batlle'ın Mirası"
 URG_legacy_of_batlle_desc:0 "Gelecek bizi nereye götürürse götürsün, Colorado partisinin José Batlle y Ordóñez'in mirasına sonsuza kadar bağlı kalacağı açıktır. Onun evrensel sosyal adalet fikrini her zaman benimseyeceğiz"
 URG_legalize_the_pool:0 "Havuzu Yasallaştırın"
 URG_legalize_the_pool_desc:0 "Havuzun yasallaştırılması eyaletlerin gelirini artıracak ve aynı zamanda kitleler arasında çok popüler olacaktır."
 URG_mercado_modelo:0 "Mercado Modelo"
 URG_mercado_modelo_desc:0 "Eski tarım pazarını geride bırakıp, ülkenin en büyük tarım pazarı olan Mercado Modelo'yu açma zamanı geldi."
 URG_merge_falangist_movements:0 "Falanjist Hareketleri Birleştir"
 URG_merge_falangist_movements_desc:0 "Adolfo Agorio tarafından körüklenen Uruguay revizyonizmi dışında, Falanjizm ülkedeki en popüler otoriter hareketlerdir, ancak birkaç gruba bölünmüşlerdir. Ayrı ayrı olabileceklerinden daha büyük bir hareket haline gelmeleri için onları bir araya getireceğiz."
 URG_ministry_of_public_works:0 "Bayındırlık Bakanlığı Yardımı"
 URG_ministry_of_public_works_desc:0 "Ülkemizin sanayileşme çabalarını körüklemek için, Bayındırlık Bakanlığı aracılığıyla büyük bir yol ve işçi konutu programı oluşturacağız."
 URG_pay_of_all_external_debts:0 "Tüm Dış Borçları Öde"
 URG_pay_of_all_external_debts_desc:0 "Hala çeşitli ülkelere bazı dış borçlarımız var ve mevcut iklimde bir devletin ödenmemiş ödemeleri olması yakışık almaz."
 URG_pluna:0 "Pluna"
 URG_pluna_desc:0 "Pluna, hem kargo hem de charter hizmetleri için yükselen bir bayrak taşıyıcısıdır. Buna yatırım yapmak, havayolu sanayimizi modern çağa taşıyabilir."
 URG_prohibition_of_usury:0 "Tefecilik Yasağı"
 URG_prohibition_of_usury_desc:0 "Borç verenlerin, borç verenlere orantısız fayda sağlayan krediler vermesine artık izin veremeyiz. Bu tür şeyleri önlemek için tefecilik yasaları getirilmelidir."
 URG_rapid_industrialization:0 "Hızlı Sanayileşme"
 URG_rapid_industrialization_desc:0 "Ülkemizi yeni bir çağa taşımak için her şey hazır. Hızlı bir sanayileşme yolculuğuna çıkacak ve ülkemizi 20. yüzyıla düzgün bir şekilde taşıyacağız."
 URG_recognize_francoist_spain:0 "Frankocu İspanya'yı Tanı"
 URG_recognize_francoist_spain_desc:0 "Frankocu İspanya'nın meşru İspanyol devleti olduğu açıktır. Onu derhal gerçek İspanya olarak tanıyacağız."
 URG_revaluation_law:0 "Yeniden Değerleme Yasası"
 URG_revaluation_law_desc:0 "1935 yeniden değerleme yasasının, İhraç Departmanının tüm bankacılık faaliyetlerini tekelleştirdiği yerde daha da genişletilmesi gerekiyor."
 URG_right_to_food_housing_and_health:0 "Gıda, Barınma ve Sağlık Hakkı"
 URG_right_to_food_housing_and_health_desc:0 "Anayasada gıda, barınma ve sağlık hakkını temel bir köşe taşı olarak kutsal sayacak ve en yoksul vatandaşlarımıza destek ödeyeceğiz."
 URG_rincon_del_bonete_hydroelectric_power_station:0 "Rincón del Bonete Enerji Santrali"
 URG_rincon_del_bonete_hydroelectric_power_station_desc:0 "Ülkemizin elektrifikasyonu modernizasyonun anahtarıdır. [GER.GetAdjective] devleti, bağlarımızı güçlendirerek böyle bir projenin inşasını finanse etmeye isteklidir."
 URG_ruralism:0 "Kırsalcılık"
 URG_ruralism_desc:0 "Seçmen tabanımız ülkenin kırsal kesiminde yer alıyor ve bu kesime büyük yatırımlar yapmamız şart."
 URG_statism:0 "Devletçilik"
 URG_statism_desc:0 "Sosyal ve ekonomik meseleler üzerinde merkezi kontrole sahip net ve güçlü bir devlet bu zamanlarda bir zorunluluktur."
 URG_terra_election:0 "1938 seçimleri gerçekleşti"
 URG_terras_dictatorship:0 "Terra'nın Diktatörlüğü"
 URG_terras_dictatorship_desc:0 "Gabriel Terra 2 yıl önce bir öz darbeyle ülkenin büyük bir bölümünün kontrolünü ele geçirdi, ancak kurumları üzerindeki kontrolü daha da pekiştirmek için hala yapacak işimiz var."
 URG_the_american_springboard:0 "Amerikan sıçrama tahtası"
 URG_the_american_springboard_desc:0 "Gücümüzü sağlama almış ve arkamızda güçlü bir destekçi varken komşularımızı fethetmeye hazırız."
 URG_the_fuhrmann_plan:0 "Fuhrmann Planı"
 URG_the_fuhrmann_plan_desc:0 "Arnulf Fuhrmann [URG.GetName]'in Güney Amerika'da bir Mihver cephesi için sıçrama tahtası görevi görecek bir [GER.GetName] kolonisi olmasını önermiştir. Belki bir koloni olarak değil ama Eksen Güney Amerika'nın bir yöneticisi olarak?"
 URG_the_good_coup:0 "\"İyi\" Darbe"
 URG_the_good_coup_desc:0 "Anayasa şiddetli bir direnişle karşılaştı. Uruguay'ı geleceğe taşımak istiyorsak anlamsız politikalarla oyalanamayız. Terra'nın daha önce yaptığı gibi kendi kendimize bir darbe yapacağız, ancak bunu kitlesel tutuklamalar ve şiddet yerine kan dökmeden ve zulüm yapmadan gerçekleştireceğiz."
 URG_tour_to_italy:0 "[ITA.GetName]'ya Tur"
 URG_tour_to_italy_desc:0 "Liderimiz, ülkelerimiz arasındaki ekonomik bağları güçlendirmek için [ITA.GetName]'ya bir tura çıkacak."
 URG_traditionalism:0 "Gelenekçilik"
 URG_traditionalism_desc:0 "Geleneklere dönüş geleceğe giden yoldur. Daha önce işe yarayan şey şimdi de işe yarayacaktır."
 URG_womens_vote:0 "Kadınların Oy Hakkı"
 URG_womens_vote_desc:0 "Yeni yüzyıla girmek isteyen her devletin kadınların haklarını ve cinsiyetlerin eşit haklarını tanıması gerekir."
