 one_of_the_options_tt:0 "Etkinlik seçeneklerinden birinde aşağıdakilerin etkisi olacaktır: "
 par_has_accepted_american_funds:0 " @USA Amerikan Fonlarını Kabul Etti"
 par_has_accepted_american_funds_tt:0 "@USA§Y[USA.GetAdjective]§! fonlarını kabul edecek, §Y210 gün§! boyunca diğer ittifaklara katılmayı önleyecek!"
 propping_up_gustavo_ross_tt:0 "§YGustavo Ross§! Şili Başkanı olduğunda, §G+75§! Politik Güç, §G+%5§! İstikrar kazanın ve ona şu özellikleri veren §Yİnsanlar Arasında Popüler§! özelliğini verin: §G+%2§! Uyum Büyüme Hızı Faktörü, §G+%25§! İdeoloji Sürüklenme Savunması ve §G+%10§! İstikrar."
