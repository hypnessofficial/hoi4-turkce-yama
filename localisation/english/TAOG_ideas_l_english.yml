 AST_a_sense_of_place:0 "Bir Aidiyet Duygusu"
 AST_a_sense_of_place_desc:0 "Ulusal kimlik, bir halkı bir arada tutan bağdır. Gelişen bir kültür altında Avustralyalılar, sınırlarını tehdit edebilecek herkese karşı direnmeye kararlı bir şekilde birleştiler."
 AST_a_sense_of_place_upgraded:0 "Bir Aidiyet Duygusu"
 AST_a_sense_of_place_upgraded_desc:0 "Bir zamanlar sessizce gelişen ulusal kimliğe daha sert bir kenar verildi. Bu artık sadece bir toprağa ve bir yaşam tarzına duyulan gurur değil; Avustralya'nın inşa ettiği şeyin uğruna savaşmaya değer olduğu ve Güney Haçı altında yaşayan erkek ve kadınların bunu yapmaya hazır olduğu inancıdır."
