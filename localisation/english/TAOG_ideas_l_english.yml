l_english:
 ABDA_corps_expeditionnaire_spirit:0 "Sefer Kolordusu"
 ABDA_corps_expeditionnaire_spirit_desc:0 "Pasifik harekat alanına tahsis edilen Fransız kuvvetleri sömürge hizmetiyle zorluklara göğüs germiş ve evlerinden uzakta zor koşullarda operasyon yapmaya alışkındır. Güneydoğu Asya'da savaşma deneyimleri onlara Japon taktikleri ve arazisi hakkında özel bir farkındalık kazandırarak, düşman bastırdığında onları dirençli bir güç haline getirir."
 ABDA_maintain_strategic_flexibility_spirit:0 "Stratejik Esneklik"
 ABDA_maintain_strategic_flexibility_spirit_desc:0 "Amerikan sanayi çıktısı Pasifik harekat alanına yönlendiriliyor ve okyanusun tüm genişliği boyunca güç yansıtabilecek bir filoyu sürdürmek için tersane üretimi hızlandırıldı. Herhangi bir tek cepheye aşırı bağlanmayı reddeden Birleşik Devletler, donanma gücünün durumun gerektirdiği her yere yönlendirilebilmesini sağlıyor."
 ABDA_supreme_command:0 "ABDACOM Yüksek Komutanlığı"
 ABDA_supreme_command_desc:0 "Amerikan-İngiliz-Hollanda-Avustralya Komutanlığı, tüm üye donanmalarda birleşik bir donanma doktrini oluşturdu. İttifak derinleştikçe, paylaşılan istihbarat, koordineli devriye atamaları ve karşılıklı lojistik destek ABDACOM sancağı altında yüzen her filonun muharebe etkinliğini istikrarlı bir şekilde artırıyor."
