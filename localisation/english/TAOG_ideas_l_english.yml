 idea_INS_volksraad:0 "Volksraad"
 idea_INS_volksraad_desc:0 "Volksraad, takımadalar boyunca çeşitli etnik azınlıkların ve kültürlerin temsil edilebileceği yarı demokratik bir sistem yaratmayı amaçlayan “Etik Politikalar” sisteminin bir parçası olarak 1918'de Hollanda tarafından kurulan bir konseyidir. Teorik olarak demokratik bir doğaya sahip olsa da, Genel Vali ve Hollanda Kraliyeti koşulsuz bir veto hakkını elinde tutar."
 idea_INS_western_trade:0 "Batı Ekonomik Bağlılığı"
 idea_SIA_a_constituional_monarchy:0 "Meşruti Monarşi"
 idea_SIA_a_constituional_monarchy_desc:0 "Anayasal bir çerçeve kraliyet gücünün sınırlarını belirler ve halkın haklarını korur. Kraliyet mutlak bir otoriteden ziyade birleştirici bir sembol olarak ulusu daha istikrarlı, yeni fikirlere daha açık ve demokratik dünyayla daha uyumlu hale getirir."
 idea_SIA_a_modern_economy:0 "Modern Bir Ekonomi"
 idea_SIA_a_race_against_time:0 "Zamana Karşı Yarış"
 idea_SIA_agrarian_economical_policy:0 "Tarımsal Ekonomi Politikası"
 idea_SIA_agrarian_economical_policy_modify:0 "§Y$idea_SIA_agrarian_economical_policy$§! etkisini şu şekilde değiştirir:"
 idea_SIA_agricultural_tax_reduction:0 "Tarımsal Vergi İndirimi"
 idea_SIA_an_absolute_monarchy:0 "Mutlak Monarşi"
 idea_SIA_an_absolute_monarchy_desc:0 "Tüm siyasi otorite kraliyettedir. Kralın sözü kanundur, muhalefet bastırılır ve kraliyet prestijinin tüm ağırlığı ulusal seferberliğin arkasındadır. Taht sadakat emreder ve ordu onun aracıdır."
 idea_SIA_an_unceasy_alliance:0 "Huzursuz Bir İttifak"
 idea_SIA_an_unceasy_alliance_desc:0 "İttifak sürüyor ancak gerginlikler kendini göstermeye başlıyor. Hükümet içindeki şüpheler ulusu sessizce daha tarafsız bir yola çekiyor."
 idea_SIA_anti_burmese_sentiment:0 "Birmanya Karşıtı Duyarlılık"
 idea_SIA_bank_of_siam:0 "Siyam Bankası"
 idea_SIA_bank_of_siam_2:0 "$idea_SIA_bank_of_siam$"
 idea_SIA_bank_of_siam_2_desc:0 "$idea_SIA_bank_of_siam_desc$"
 idea_SIA_bank_of_siam_desc:0 "Siyam Bankası, sanayi genişlemesini desteklemek için sermaye yatırımlarını yönlendiren ve para politikasını yöneten devletin mali omurgası olarak hizmet eder."
 idea_SIA_bloodlusted_irredentism:0 "Kana Susamış İrredantizm"
 idea_SIA_bloodlusted_irredentism_desc:0 "Toprak hırsı daha vahşi bir şeye dönüştü. Ordu, hakkı olanı geri aldığına inananların inancıyla savaşıyor."
 idea_SIA_boon_rawd_brewery:0 "Boon Rawd Bira Fabrikası"
 idea_SIA_boon_rawd_brewery_desc:0 "Boon Rawd Bira Fabrikası, yerli girişimin bir sembolü haline geldi ve ticari başarısı onu savunanlar için iyi niyet ve siyasi sermaye yaratıyor."
 idea_SIA_breaking_the_burmese_line:0 "Birmanya Hattını Yarmak"
 idea_SIA_cemented_control:0 "Sağlamlaştırılmış Kontrol"
 idea_SIA_cemented_control_2:0 "Yerleşik Kontrol"
 idea_SIA_cemented_control_2_desc:0 "$idea_SIA_cemented_control_desc$"
 idea_SIA_cemented_control_3:0 "Savaş Sırasında Tayland Görevi Yasası"
 idea_SIA_cemented_control_3_desc:0 "Kraliyetin ve halkının egemenliğini tehdit eden bir savaş durumunda, saygıdeğer her Taylandlının işgale karşı silahlı veya başka herhangi bir yolla direnmesi her Taylandlının görevidir."
 idea_SIA_cemented_control_desc:0 "Hükümet, devlet kurumları üzerindeki hakimiyetini pekiştirdi. Siyasi muhalefet devre dışı bırakıldı ve güç mekanizması artık güvenilir bir şekilde hükümetin lehine işliyor."
 idea_SIA_civil_service_heroism_1:0 "Sivil Hizmet Kahramanlığı"
 idea_SIA_civil_service_heroism_1_desc:0 "Sivil hizmet duruma ayak uydurdu, adanmışlığı ve uzmanlığı araştırma ve devlet kalkınmasının hızını sessizce artırıyor."
 idea_SIA_civil_service_heroism_2:0 "$idea_civil_service_heroism_1$"
 idea_SIA_civil_service_heroism_2_desc:0 "$idea_SIA_civil_service_heroism_1_desc$"
 idea_SIA_civilian_full_support:0 "Sivil Kanat: §GTam Destek§!"
 idea_SIA_civilian_full_support_desc:0 "Sivil kanat sağlam bir şekilde hükümetin arkasında duruyor. Yöneticiler ve teknokratlar uzmanlıklarını sunarak kalkınmayı ileriye taşıyor."
 idea_SIA_civilian_neutral:0 "Sivil Kanat: Tarafsız"
 idea_SIA_civilian_neutral_desc:0 "Sivil kanat hükümete ne yardım ediyor ne de engel oluyor. Yönetim işliyor, ancak gerçek bir siyasi uyumun itici gücü olmadan."
 idea_SIA_civilian_opposition:0 "Sivil Kanat: Muhalefette"
 idea_SIA_civilian_opposition_desc:0 "Sivil kanat hükümete karşı döndü. Yetkililer ayak diriyor ve bütçeler yanlış tahsis ediliyor, devlet çarklarını yavaşlatıyor."
 idea_SIA_civilian_rebellious:0 "Sivil Kanat: §Rİsyankar§!"
 idea_SIA_civilian_rebellious_desc:0 "Sivil kanat açık bir meydan okuma içinde. İstikrarsızlık yayılıyor ve siyasi bir kopuş tehdidi her geçen gün büyüyor."
 idea_SIA_civilian_slight_support:0 "Sivil Kanat: Hafif Destek"
 idea_SIA_civilian_slight_support_desc:0 "Sivil kanat, hükümetin gidişatını genel olarak destekliyor. İşbirlikleri mütevazı ancak somut faydalar sağlıyor."
 idea_SIA_civilian_technocrats_in_institutions:0 "Sivil Teknokratlar"
 idea_SIA_civilian_technocrats_in_institutions_desc:0 "Kilit devlet kurumlarına yerleştirilen sivil uzmanlar, hem kaynak çıkarımını hem de siyasi atamaların verimliliğini artırdı."
 idea_SIA_civilian_wing_unrest:0 "Sivil Kanat İsyanda"
 idea_SIA_civilian_wing_unrest_desc:0 "Pridi'nin ittifakı hükümete olan güvenini yine kaybetti. İktidarı ele geçirmek için ikinci bir şans tanınmayan sivil kanat; grevlere, bürokratik engellemelere ve şehirlerdeki kışkırtmalara yöneliyor. Öfkeler yatışana kadar ekonomi durma noktasına geliyor ve ülke yönetilemez hale geliyor."
 idea_SIA_constitutional_virtue:0 "Anayasal Erdem"
 idea_SIA_contingency_funds:0 "Acil Durum Fonları"
 idea_SIA_death_defiant:0 "Ölüme Meydan Okuyan"
 idea_SIA_death_defiant_desc:0 "Biz zaten ölüyüz. Yapabilirsen gel de hakkını al."
 idea_SIA_death_to_communists:0 "Komünistlere Ölüm"
 idea_SIA_death_to_communists_desc:0 "Anti-komünist şevk saflarımızda dolaşarak güçlerimize Çin'in komünist ordularına karşı bir avantaj sağlıyor."
 idea_SIA_death_to_nationalists:0 "Milliyetçilere Ölüm"
 idea_SIA_death_to_nationalists_desc:0 "Milliyetçi karşıtı duyarlılık saflarımızda dolaşarak güçlerimize Çin'in milliyetçi ordularına karşı bir avantaj sağlıyor."
 idea_SIA_debt_repayment:0 "Borç Ödemesi"
 idea_SIA_debt_repayment_desc:0 "Açık harcama programının maliyetleri hissediliyor. Gelirler alacaklılara yönlendiriliyor ve bir zamanlar borçlanmanın sağladığı inşaat hızı artık sürdürülemiyor."
 idea_SIA_defenders_of_constitutional_liberty:0 "Anayasal Özgürlüğün Savunucuları"
 idea_SIA_desperate_gambit:0 "Umutsuz Hamle"
 idea_SIA_desperate_gambit_desc:0 "Belki de kendini içinde bulduğun bu çukurdan bir çıkış yolu vardır, tırman!"
 idea_SIA_ending_military_grift:0 "Askeri Yolsuzluğa Son Vermek"
 idea_SIA_farmers_moving_to_bangkok_bad:0 "$idea_SIA_farmers_moving_to_bangkok_good$"
 idea_SIA_farmers_moving_to_bangkok_good:0 "Çiftçiler Bangkok'a taşınıyor"
 idea_SIA_foreign_diplomatic_relationships:0 "Dış Diplomatik İlişkiler"
 idea_SIA_irrigation:0 "Sulama"
 idea_SIA_japanese_fighter_instruction:0 "Japon Dövüşçü Eğitimi"
 idea_SIA_japanese_fighter_instruction_desc:0 "Japon İmparatorluk Ordusu Hava Servisi'nden eğitmenler pilotlarımıza eğitim veriyor ve mühendislerimize kendi savaş uçağı tasarımlarını öğretiyorlar. Defterlerimizde bıraktıkları, kaldıkları süreden daha uzun süre dayanır."
 idea_SIA_military_expansion_costs:0 "Askeri Genişleme Maliyetleri"
 idea_SIA_military_full_support:0 "Askeri Kanat: §GTam Destek§!"
 idea_SIA_military_full_support_desc:0 "Askeri kanat sağlam bir şekilde hükümetin arkasında duruyor. Subaylar, asker alım kampanyalarını ve silah üretimini destekleyerek ordunun kaynaklarını ulusal hedeflere yönlendiriyor."
 idea_SIA_military_humiliation:0 "Askeri Aşağılanma"
 idea_SIA_military_neutral:0 "Askeri Kanat: Tarafsız"
 idea_SIA_military_neutral_desc:0 "Askeri kanat hiçbir pozisyon almadı. Ordu görevlerini şevk veya direniş olmadan yerine getiriyor ve olayların nasıl gelişeceğini bekliyor."
 idea_SIA_military_opposition:0 "Askeri Kanat: Muhalefette"
 idea_SIA_military_opposition_desc:0 "Askeri kanat hükümete karşı çalışıyor. Subaylar üretim çabalarını baltalıyor ve hükümetin davasına olan şevk saflardan çekiliyor."
 idea_SIA_military_rebellious:0 "Askeri Kanat: §Rİsyankar§!"
 idea_SIA_military_rebellious_desc:0 "Askeri kanat açık bir meydan okumanın eşiğinde. Zorunlu askerlik sabote ediliyor, silah üretimi zarar görüyor ve bir darbe hayaleti beliriyor."
 idea_SIA_military_slight_support:0 "Askeri Kanat: Hafif Destek"
 idea_SIA_military_slight_support_desc:0 "Askeri kanat genel olarak işbirliğine açık. Destekleri, tam bir bağlılık olmasa da, asker alımı ve üretimde mütevazı iyileştirmeler sağlıyor."
 idea_SIA_military_wing_unrest:0 "Askeri Kanat İsyanda"
 idea_SIA_military_wing_unrest_desc:0 "Subayların sabrı bir kez daha tükendi. İktidarı doğrudan ele geçirmeyi başaramayan askeri kanat, şimdi öfkesini sabotajlar, firarlar ve işbirliğini kesin bir dille reddetme yoluyla dışa vuruyor. Memnuniyetsizler yola getirilene kadar ordunun savaş gücü çöküyor."
 idea_SIA_order_discipline_and_unity:0 "Düzen, Disiplin ve Birlik"
 idea_SIA_oss_special_forces_training:0 "OSS Özel Kuvvetler Eğitimi"
 idea_SIA_oss_special_forces_training_desc:0 "Ajanlarımız sabotaj, sızma ve hava indirme operasyonlarında OSS ile birlikte eğitim gördü. Edinilen dersler, özel kuvvetlerimizi zorlu bir araca dönüştürerek biledi."
 idea_SIA_overheated_economy:0 "Aşırı Isınmış Ekonomi"
 idea_SIA_overheated_economy_desc:0 "Ekonomi doğal sınırlarının ötesine itildi. Tüketici talebi kapasiteyi aştı ve inşaat patlaması işler soğuyana kadar durdu."
 idea_SIA_pacific_war_preparations:0 "Pasifik Savaşı Hazırlıkları"
 idea_SIA_pan_thaiism:0 "Pan-Taycılık"
 idea_SIA_pan_thaiism_2:0 "$idea_SIA_pan_thaiism$"
 idea_SIA_pan_thaiism_2_desc:0 "$idea_SIA_pan_thaiism_desc$"
 idea_SIA_pan_thaiism_desc:0 "Pan-Taycılık ideolojisi, Tay mirasına sahip tüm halkların tek bir devlet altında birleşmesi gerektiğini savunur. Ulusu genişlemeye yönlendirir, taarruz eylemleriyle morali yüksek tutar."
 idea_SIA_public_credit_debt:0 "Kamu Kredi Borcu"
 idea_SIA_public_credit_debt_2:0 "$idea_SIA_public_credit_debt$ Ödemesi"
 idea_SIA_public_credit_debt_2_desc:0 "$idea_SIA_public_credit_debt_desc$"
 idea_SIA_public_credit_debt_desc:0 "Devletin kredi yükümlülükleri, aksi takdirde üretime ve sivil mallara akacak kaynakları tüketerek ekonomi üzerinde sürekli bir yüktür."
 idea_SIA_purged_military:0 "Tasfiye Edilmiş Ordu"
 idea_SIA_purged_military_desc:0 "Siyasi olarak güvenilmez görülen subayların görevden alınması, orduyu deneyimli liderlikten yoksun bıraktı; organizasyonu ve kalan birliklerin gelişimini engelledi."
 idea_SIA_purged_senior_military:0 "Tasfiye Edilmiş Üst Düzey Askerler"
 idea_SIA_purged_senior_military_desc:0 "Hükümet için tehdit olarak görülen üst düzey subaylar görevlerinden alındı. Deneyimli komutanların kaybı, ordunun uyumu ve profesyonel gelişimi üzerinde iz bıraktı."
 idea_SIA_rebuilding_after_civil_war:0 "İç Savaştan Sonra Yeniden İnşa"
 idea_SIA_rebuilding_after_civil_war_desc:0 ""
 idea_SIA_rebuilding_the_war_torn_economy:0 "Savaşın Yıktığı Ekonomiyi Yeniden İnşa Etmek"
 idea_SIA_redirected_military_funds:0 "Yönlendirilmiş Askeri Fonlar"
 idea_SIA_rehabilitated_military:0 "Rehabilite Edilmiş Ordu"
 idea_SIA_restoring_order:0 "Düzeni Sağlamak"
 idea_SIA_revision_of_unequal_treaties:0 "Eşitsiz Antlaşmaların Gözden Geçirilmesi"
 idea_SIA_royal_palace_bureau_directive_no_1523:0 "1523 Sayılı Kraliyet Sarayı Bürosu Direktifi"
 idea_SIA_rural_support:0 "Kırsal Destek"
 idea_SIA_seized_japanese_funds:0 "Ele Geçirilen Japon Fonları"
 idea_SIA_seized_japanese_funds_desc:0 "Japonya ile yapılan anlaşmanın bozulmasıyla birlikte, geride bıraktıkları fonlar ve stoklar inşaat ve sanayi çıktısında bir artışı körüklemek üzere bizim kullanımımıza geçti."
 idea_SIA_siam_cement_group:0 "[ROOT.GetName] Çimento Grubu"
 idea_SIA_sold_privy_purse_lands:0 "Satılan Özel Hazine Toprakları"
 idea_SIA_sold_privy_purse_lands_desc:0 "Kraliyet ailesinin arazi varlıklarının satışı devlete sermaye enjekte ederek ekonomik baskıları hafifletti ve inşaat için kaynak yarattı."
 idea_SIA_songsuradet_ascendant_0:0 "Yükselen Songsuradet"
 idea_SIA_songsuradet_ascendant_0_desc:0 "Hükümetin öfkesini başarıyla atlatan Phraya Songsuradet, tabanını sağlamlaştırdı ve bundan güçlenerek çıktı. O artık insanların dokunulmaz diyeceği biri, ondan kurtulmak için fazla yüksek profilli ve köklü.\nBüyük olasılıkla hükümet politikalarına müdahale edecek ve tekrar bir tasfiyenin hedefi olmamasını sağlamak için karar almayı yavaşlatacaktır."
 idea_SIA_songsuradet_ascendant_1:0 "$idea_SIA_songsuradet_ascendant_0$"
 idea_SIA_songsuradet_ascendant_1_desc:0 "$idea_SIA_songsuradet_ascendant_0_desc$"
 idea_SIA_specialist_marine_forces:0 "Uzman Deniz Piyadesi Kuvvetleri"
 idea_SIA_specialist_marine_forces_desc:0 "Adanmış amfibi uzmanlarından oluşan bir kadro kıyı taarruz operasyonları için eğitildi ve teçhizatlandırıldı."
 idea_SIA_sued_king_prajadhipok:0 "Kral Prajadhipok Dava Edildi"
 idea_SIA_suspend_ordinary_legal_procedures:0 "Askıya Alınmış Olağan Hukuki Prosedürler"
 idea_SIA_thai_cultural_mandates:0 "Tayland Kültürel Yetkileri"
 idea_SIA_thai_irredentism:0 "Tayland İrredantizmi"
 idea_SIA_thai_rice_company:0 "Tayland Pirinç Şirketi"
 idea_SIA_the_military_oversight_bureau:0 "$SIA_military_oversight_bureau$"
 idea_SIA_the_military_oversight_bureau_desc:0 "Askeri Gözetim Bürosu, yeni komutanlar için daha yüksek standartlar belirliyor ve subay birlikleri genelinde uzmanlığın gelişimini hızlandırıyor."
 idea_SIA_the_royal_police_counterweight:0 "Kraliyet Polisi Bağlılığı"
 idea_SIA_the_sacred_hierarchy:0 "Kutsal Hiyerarşi"
 idea_SIA_the_yellow_dossier:0 "Sarı Dosya"
 idea_SIA_the_yellow_dossier_2:0 "$idea_SIA_the_yellow_dossier$"
 idea_SIA_the_yellow_dossier_2_desc:0 "$idea_SIA_the_yellow_dossier_desc$"
 idea_SIA_the_yellow_dossier_desc:0 "Yerli sanayinin durumu hakkındaki gizli bir rapor, köklü verimsizliklerle hesaplaşmayı zorunlu kıldı. Talep ettiği reformlar fabrikalarımızda meyvesini veriyor, ancak getirdikleri aksaklıkların da bir bedeli var."
 idea_SIA_unified_khana_ratsadon:0 "Birleşik Halk Partisi"
 idea_SIA_unified_khana_ratsadon_desc:0 "Askerler ve siviller arasındaki eski çekişme bitti. Khana Ratsadon'un her iki kanadının da nihayet aynı yöne çekilmesiyle hükümet, bugüne kadar hiç tanımadığı bir amaç birliğiyle hareket edebiliyor. Askerler, idareciler ve sanayiciler artık tek bir vücut olarak çalışıyor."
 idea_SIA_unity_propaganda:0 "Birlik Propagandası"
 idea_SIA_unwavering_civilian_support:0 "Sarsılmaz Sivil Destek"
 idea_SIA_unwavering_civilian_support_desc:0 "Askeri kanadın feshedilmesi ve meşruiyet sorununun çözülmesiyle birlikte, sivil yönetim rakipsiz kalıyor. Ordunun müdahalesinden kurtulan Pridi'nin teknokratları, kendilerini eski koalisyonun asla toplayamayacağı bir şevkle yönetim işine adıyorlar."
 idea_SIA_war_fervor:0 "Savaş Şevki"
 idea_SIA_wing_promotion_disruption:0 "İttifaksal Yeniden Hizalanma"
 idea_SIA_wing_promotion_disruption_desc:0 "Khana Ratsadon'un bir kanadını açıkça kayırmak hükümetin dengesini bozdu. Küstürülen ittifak işleri ağırdan alıyor, ordunun rutini düzensizlik içinde ve yeni düzen oturana kadar olağan yönetim zarar görüyor."
 idea_SIA_yuvachon:0 "Yuvachon"
 idea_SIA_yuvachon_2:0 "$idea_SIA_yuvachon$"
 idea_SIA_yuvachon_2_desc:0 "$idea_SIA_yuvachon_desc$"
 idea_SIA_yuvachon_desc:0 "Yuvachon hareketi, ulusun gençliğini askeri disiplinde eğiterek eğitimli bir insan gücü havuzu oluşturuyor ve milliyetçi duyguları körüklüyor."
