 INS_dutch_east_indies_desc:0 "Doğu Hint Adaları, yüzlerce farklı kültür ve dili barındıran devasa bir takımadadır ve bu durum onu yönetmesi meşhur derecede zor bir sömürge haline getirmektedir. Çeşitli bağımsızlık hareketleri, kültürel engeller ve Büyük Buhran'ın ekonomik etkileri bu soruna yardımcı olmadı ve yönetim çok verimsiz çalışıyor. 1918'de kurulan “Etik Politikalar”, etik çalışma düzenlemelerini zorunlu kılarak ve azınlık gruplarına demokratik temsiller vererek durumu iyileştirmeye çalıştı, ancak büyük buhran bunların çoğunlukla uygulanmamasına neden oldu."
