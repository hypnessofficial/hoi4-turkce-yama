 NZL_commonwealth_loyalty:0 "İngiliz Milletler Topluluğu Sadakati"
 NZL_commonwealth_loyalty_desc:0 "Yeni Zelanda, İngiliz Milletler Topluluğu'nun kararlı bir üyesi olmaya devam ediyor ve Kralı haklı devlet başkanı olarak koruyor. Yeni Zelanda ekonomisi aynı zamanda daha geniş imparatorluk ekonomik sistemine son derece entegredir."
 NZL_great_depression:0 "Büyük Buhran"
 NZL_great_depression_desc:0 "Küresel ekonominin 1929'daki çöküşü Yeni Zelanda'nın büyük ölçüde tarıma dayalı ekonomisini çok sert vurdu. Ülkelerin Yeni Zelanda'dan daha az ürün satın almasıyla birlikte birçok kişi işsiz kaldı, tüketici satın alma gücü düştü ve bu da diğer endüstrilerin çökmesine neden oldu. Yıllar süren kemer sıkma politikaları, ulusu bir yön değişikliği arzusuyla baş başa bıraktı. "
 NZL_ministry_of_public_works_dynamic_modifier:0 "Bayındırlık Bakanlığı"
 NZL_national_coal_board_idea:0 "Ulusal Kömür Kurulu"
 NZL_railways_board:0 "Hükümet Demiryolları Kurulu"
 NZL_railways_board_desc:0 "Hükümet Demiryolları Kurulu, karar almayı hükümet departmanlarından ayırmak amacıyla Demiryolları Departmanının yeniden yapılandırılması olarak 1931'de kuruldu. Ancak, kurulduğundan beri demiryolu ağında çok az iyileşme belirtisi var. Hükümetin kurulu kaldırması ve doğrudan kontrolü geri alması için artan bir baskı var."
 SIA_civilian_wing_history_tt:0 "Khana Ratsadon'un sivil fraksiyonuna, en başta §YPridi Phanomyong§! olmak üzere ilerici yöneticiler ve teknokratlar liderlik ediyor. Fransa'da hukuk eğitimi alan Pridi, toprak reformu, devlet ekonomik planlaması ve sıradan insanları gerçekten güçlendirecek bir anayasal demokrasi hedefleriyle geri döndü.\n\nSivil kanat genel olarak eğitim, altyapı ve sanayiye yatırımı destekleyerek §Gkalkınmadan yanadır§!. Ağır askeri harcamalara şüpheyle yaklaşırlar ve güçlü adam yönetimine doğru herhangi bir kaymaya karşı temkinlidirler. Destekleri en kolay, devleti modernleştiren ve anayasal hükümeti koruyan politikalarla kazanılır."
 SIA_civilian_wing_label:0 "Sivil Kanat"
 SIA_khana_ratsadon_inlay_title:0 "Khana Ratsadon"
 SIA_military_wing_history_tt:0 "Khana Ratsadon'un askeri fraksiyonu, kendilerini devrimin gerçek koruyucuları olarak gören ordu subaylarının hakimiyetindedir. En hırslı figürleri, Avrupa'nın milliyetçi hareketlerine olan hayranlığı her geçen yıl artan bir albay olan §YPlaek Phibunsongkhram§!'dır.\n\nAskeri kanat §Gyeniden silahlanmadan yanadır§! ve güçlü, merkezi bir devlete ilgi duyar. Pridi'nin tehlikeli derecede radikal buldukları ekonomik fikirlerine şüpheyle yaklaşırlar ve savunma meselelerine sivil müdahalesine çok az tahammül gösterirler. Sadakatleri en kolay askeri yatırımlar ve ulusal gücü yansıtan politikalarla güvence altına alınır."
