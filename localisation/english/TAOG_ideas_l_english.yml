 idea_INS_netherlands_most_precious_jewel:0 "Hollanda'nın En Değerli Mücevheri"
 idea_INS_netherlands_most_precious_jewel_desc:0 "Hollanda Doğu Hint Adaları, yaklaşık 350 yıldır Hollanda'nın bir sömürgesidir ve sömürgenin yönetimi Hollanda hükümetiyle sıkı bir şekilde entegredir. Doğu Hint Adaları genellikle “Hollanda tacındaki mücevher” olarak anılır ve Hollanda, bu değerli mücevheri üzerindeki hakimiyetini gevşetme konusunda hiçbir istek göstermemiştir."
