 INS_royal_netherlands_east_indies_army_desc:0 "Koninklijk Nederlands Indisch Leger (KNIL), Doğu Hint Adaları'nın uzun süredir var olan ve Hollanda'dan bağımsız olarak faaliyet gösteren ordusudur. KNIL, hem Avrupalı hem de Endonezyalı askerlerden oluşur, ancak takımadaların birçok kültürü ile Hollanda arasındaki kültürel ve dilsel engeller, asker alımını zor ve yavaş bir süreç haline getirir."
