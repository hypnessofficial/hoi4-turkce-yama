 AUS_reestablish_creditanstalt:0 "Creditanstalt-Bankverein feshedilecek ve yeni Österreichische Creditanstalt'a tam desteğimiz verilecektir."
 AUS_refuses_to_submit:0 "Bize Boyun Eğmeyi Reddetti"
