 GER_chose_to_not_placate_erich_raeder_tt:0 "Darbe gerçekleştiğinde Kriegsmarine'in sadece daha küçük bir kısmı bizim tarafımıza katılacak, ama Erich Raeder'e herhangi bir sözle bağlı kalmayacağız"
