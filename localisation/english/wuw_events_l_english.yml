 wuw_GER_realpolitik.7.b:0 "Özgürlüğümüzden asla vazgeçmeyeceğiz!"
 wuw_GER_realpolitik.7.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], Brest-Litovsk antlaşmasında başlangıçta belirtildiği gibi, yönetimlerine boyun eğmemizi ve onların bir bağlı devleti olmamızı talep etti. Taleplerine boyun eğmeli miyiz?"
 wuw_GER_realpolitik.7.t:0 "[FROM.GetNameDefCap] Bağlı Devletimiz Olmamızı Talep Ediyor"
 wuw_GER_realpolitik.8.a:0 "[ROOT.GetNameDef] için harika bir gün!"
 wuw_GER_realpolitik.8.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], [FROM.GetAdjective] ulusunun yönetimimize boyun eğeceğini açıkladı, çünkü bizi durduracak güçleri yok ve savaşmak sadece topraklarına ve halkına daha fazla yıkım getirecektir."
 wuw_GER_realpolitik.8.t:0 "[FROM.GetNameDefCap] Taleplerimizi Kabul Ediyor"
 wuw_GER_realpolitik.9.a:0 "Kararlarından pişman olacaklar"
 wuw_GER_realpolitik.9.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], boyun eğmelerini talep etme nedenlerimizin gerçek bir değeri olmayan gevşek belgelere dayandığını ve ulusumuzu bir bütün olarak kamuoyunda kınadığını açıkladı. Gerekirse özgürlükleri için savaşmaya niyetli görünüyorlar..."
 wuw_GER_realpolitik.9.t:0 "[FROM.GetNameDefCap] Taleplerimizi Reddediyor"
 wuw_GER_reichskommissariats.1.a:0 "Bir Alman Yetkiliye ihtiyaçları var"
 wuw_GER_reichskommissariats.1.b:0 "Yerel bir işbirlikçi kullanmak akıllıca olabilir"
 wuw_GER_reichskommissariats.1.desc:0 "Şimdi Belçika ve Kuzey Fransa'da yeni bir sivil idare kurduğumuza göre, sadece yeni bağlı devletimizin amacına değil, aynı zamanda bölgedeki halkı kimin yöneteceğine ve politikalarımızın düzgün bir şekilde uygulanmasını sağlayacak kişiye de karar vermeliyiz. Reichskommissar pozisyonuna bir [ROOT.GetAdjective] politikacısını mı yerleştirmeliyiz, yoksa yerel bir işbirlikçiden mi yararlanmalıyız?"
 wuw_GER_reichskommissariats.1.t:0 "Belçika-Kuzey Fransa'nın Liderliği"
 wuw_GER_reichskommissariats.10.a:0 "Kendi Reichskommissariat'ı olmalı"
 wuw_GER_reichskommissariats.10.b:0 "Moskowien'e dahil edilmeli"
 wuw_GER_reichskommissariats.10.c:0 "Türkistan'a dahil edilmeli"
 wuw_GER_reichskommissariats.10.desc:0 "Güney Ural stratejik bölgesinin ele geçirilmesiyle, bölgenin nasıl ele alınacağı sorusu gündeme geldi. Bazı planlar bölgeyi Moskowien içinde içerirken, bazıları belki de kendi başına bir devlet olarak durabileceğini veya hatta belki de Türkistan'ın bir parçası olabileceğini öneriyor. Ne diyoruz?"
 wuw_GER_reichskommissariats.10.t:0 "Güney Uralların Statüsü"
 wuw_GER_reichskommissariats.11.a:0 "Finlandiya ödüllendirilmeli"
 wuw_GER_reichskommissariats.11.b:0 "Moskowien'e dahil edilmeli"
 wuw_GER_reichskommissariats.11.desc:0 "Doğu Karelya stratejik bölgesinin ele geçirilmesiyle, bölgenin nasıl ele alınacağı sorusu gündeme geldi. Bazı planlar bölgeyi Moskowien içinde içerirken, bazıları belki de Fin devletine eklenebileceğini öneriyor. Ne diyoruz?"
 wuw_GER_reichskommissariats.11.t:0 "Doğu Karelya'nın Statüsü"
 wuw_GER_reichskommissariats.12.a:0 "Bir Alman Yetkiliye ihtiyaçları var"
 wuw_GER_reichskommissariats.12.b:0 "Yerel bir işbirlikçi kullanmak akıllıca olabilir"
 wuw_GER_reichskommissariats.12.desc:0 "Şimdi Güney Polonya'da yeni bir sivil idare kurduğumuza göre, sadece yeni bağlı devletimizin amacına değil, aynı zamanda bölgedeki halkı kimin yöneteceğine ve politikalarımızın düzgün bir şekilde uygulanmasını sağlayacak kişiye de karar vermeliyiz. Genel Vali pozisyonuna bir [ROOT.GetAdjective] politikacısını mı yerleştirmeliyiz, yoksa yerel bir işbirlikçiden mi yararlanmalıyız?"
 wuw_GER_reichskommissariats.12.t:0 "Generalgouvernement'in Liderliği"
 wuw_GER_reichskommissariats.13.a:0 "Bir Alman Yetkiliye ihtiyaçları var"
 wuw_GER_reichskommissariats.13.b:0 "Yerel bir işbirlikçi kullanmak akıllıca olabilir"
 wuw_GER_reichskommissariats.13.desc:0 "Şimdi Bohemya ve Moravya'da yeni bir sivil idare kurduğumuza göre, sadece yeni bağlı devletimizin amacına değil, aynı zamanda bölgedeki halkı kimin yöneteceğine ve politikalarımızın düzgün bir şekilde uygulanmasını sağlayacak kişiye de karar vermeliyiz. Reichsprotektor pozisyonuna bir [ROOT.GetAdjective] politikacısını mı yerleştirmeliyiz, yoksa yerel bir işbirlikçiden mi yararlanmalıyız?"
 wuw_GER_reichskommissariats.13.t:0 "Böhmen-Mähren'in Liderliği"
