 WW_hungary.44.a:0 "Haklılar"
 WW_hungary.44.b:0 "Wied'ler bir nedenle sürgün edildi!"
 WW_hungary.44.desc:0 "[FROM.GetNameDefCap] İmparatoru [FROM.GetLeader], Wiedist tacını geri getirmemizi ve bir kez daha Wied'li Wilhelm'i kendi hükümdarımız olarak taçlandırmamızı talep etti. Bu, esasen bağımsızlığımızı sona erdirecek, ancak bizi tam bir ilhaktan kurtarabilir. Yeni imparatorluk federasyonunda bir yer kabul ediyor muyuz?"
 WW_hungary.44.t:0 "[FROM.GetLeader] Wiedist Yönetimini Geri Getirmemizi Talep Ediyor"
 WW_hungary.45.a:0 "Doğru seçimi yaptılar"
 WW_hungary.45.desc:0 "[FROM.GetNameDef]'deki bilge liderlik, taleplerimize uygun olarak Wied'li Wilhelm'i taçlandırmaya ve yeni krallarının yerine çekilmeye karar verdi. Yeni bir şafak imparatorluk federasyonumuzda doğacak!"
 WW_hungary.45.t:0 "[FROM.GetNameDefCap] Wiedist Bir Hükümdarı Kabul Ediyor"
 WW_hungary.46.a:0 "Yanlış seçimi yaptılar"
 WW_hungary.46.desc:0 "[FROM.GetNameDef]'deki çökmekte olan liderlik, pozisyonlarından çekilmemeye karar verdi ve bir şekilde tanrının kendisi tarafından seçilen bir hükümdardan daha bilge olduklarına inanıyorlar. Beğenseler de beğenmeseler de onları devirecek ve Wied'li Wilhelm'i tahtlarına oturtacağız!"
 WW_hungary.46.t:0 "[FROM.GetNameDefCap] Wiedist Bir Hükümdarı Reddediyor"
 WW_hungary.47.a:0 "Bu bizim görevimiz"
 WW_hungary.47.b:0 "Hükümdarlara ölüm!"
 WW_hungary.47.desc:0 "[FROM.GetNameDefCap] İmparatoru [FROM.GetLeader], 5 Kasım Yasası sırasında kararlaştırıldığı gibi topraklarımız üzerinde Habsburg yönetimini geri getirmemizi ve bir kez daha kendi hükümdarımız olarak bir Habsburg'u taçlandırmamızı talep etti. Bu, bizi onlarla aynı hizaya getirecek ve bağımsızlığımızı tamamen sona erdirmeden ittifaklarına katılmamızı sağlayacaktır."
 WW_hungary.47.t:0 "[FROM.GetLeader] Habsburg Yönetimini Geri Getirmemizi Talep Ediyor"
 WW_hungary.48.a:0 "Doğru seçimi yaptılar"
 WW_hungary.48.desc:0 "[FROM.GetNameDef]'deki bilge liderlik, taleplerimize uygun olarak bir Habsburg hükümdarını taçlandırmaya ve yeni krallarının yerine çekilmeye karar verdi."
 WW_hungary.48.t:0 "[FROM.GetNameDefCap] Bir Habsburg Hükümdarını Kabul Ediyor"
 WW_hungary.49.a:0 "Yanlış seçimi yaptılar"
 WW_hungary.49.desc:0 "[FROM.GetNameDef]'deki çökmekte olan liderlik, pozisyonlarından çekilmemeye karar verdi ve bir şekilde tanrının kendisi tarafından seçilen bir hükümdardan daha bilge olduklarına inanıyorlar. Beğenseler de beğenmeseler de onları devirecek ve Karl Albrecht'i tahtlarına oturtacağız!"
 WW_hungary.49.t:0 "[FROM.GetNameDefCap] Bir Habsburg Hükümdarını Reddediyor"
 WW_hungary.5.a:0 "Olması gerektiği gibi"
 WW_hungary.5.desc:0 "Ordularımızın gücüyle yüzleşmek yerine, korkak [FROM.GetAdjective]ler haklı topraklarımızı geri vermeye karar verdiler. Transilvanya'daki kontrol ettikleri toprakların tamamı yönetimimize devredildi ve kuvvetlerimiz tam kontrolü ele aldı."
 WW_hungary.5.t:0 "[FROM.GetNameDefCap] Transilvanya'yı Devrediyor"
 WW_hungary.50.a:0 "Gerçekten de"
 WW_hungary.50.desc:0 "[FROM.GetNameDefCap], ulusumuzun yeni kralı olarak Karl Pius von Habsburg'u atadı. Bu, rejimimizi kesinlikle güçlendirecektir."
 WW_hungary.50.t:0 "[FROM.GetNameDefCap] Bize Bir Habsburg Hükümdarı Atıyor"
 WW_hungary.51.a:0 "Bu bizim görevimiz"
 WW_hungary.51.b:0 "Kim olduklarını sanıyorlar?"
 WW_hungary.51.desc:0 "[FROM.GetNameDefCap] İmparatoru [FROM.GetLeader], 1516'dan 1700'e kadar olduğu gibi topraklarımız üzerinde Habsburg yönetimini geri getirmemizi ve bir kez daha kendi hükümdarımız olarak bir Habsburg'u taçlandırmamızı talep etti. Bu, bizi onlarla aynı hizaya getirecek ve bağımsızlığımızı tamamen sona erdirmeden ittifaklarına katılmamızı sağlayacaktır."
 WW_hungary.51.t:0 "[FROM.GetLeader] Habsburg Yönetimini Geri Getirmemizi Talep Ediyor"
 WW_hungary.52.a:0 "Doğru seçimi yaptılar"
 WW_hungary.52.desc:0 "[FROM.GetNameDef]'deki bilge liderlik, taleplerimize uygun olarak bir Habsburg hükümdarını taçlandırmaya ve yeni krallarının yerine çekilmeye karar verdi."
 WW_hungary.52.t:0 "[FROM.GetNameDefCap] Bir Habsburg Hükümdarını Kabul Ediyor"
 WW_hungary.53.a:0 "Yanlış seçimi yaptılar"
 WW_hungary.53.desc:0 "[FROM.GetNameDef]'deki çökmekte olan liderlik, pozisyonlarından çekilmemeye karar verdi ve bir şekilde tanrının kendisi tarafından seçilen bir hükümdardan daha bilge olduklarına inanıyorlar. Beğenseler de beğenmeseler de onları devirecek ve Karl Pius'u tahtlarına oturtacağız!"
 WW_hungary.53.t:0 "[FROM.GetNameDefCap] Bir Habsburg Hükümdarını Reddediyor"
 WW_hungary.54.a:0 "Gerçekten de"
 WW_hungary.54.desc:0 "[FROM.GetNameDefCap], ulusumuzun yeni kralı olarak Vasyl Vyshyvanyi von Habsburg'u atadı. Bu, rejimimizi kesinlikle güçlendirecektir."
 WW_hungary.54.t:0 "[FROM.GetNameDefCap] Bize Bir Habsburg Hükümdarı Atıyor"
 WW_hungary.55.a:0 "İmparatorluğa geri döneceğiz."
 WW_hungary.55.b:0 "Güvenlik için özgürlüğümüzden asla vazgeçmeyeceğiz!"
 WW_hungary.55.desc:0 "Balkanlar'ın siyasi manzarasındaki son, dramatik değişikliklerle birlikte, yeni Avusturya-Macaristan İmparatorluğu ile ilişkimiz sorusu defalarca gündeme geldi. Bugün, Macar büyükelçisi resmi bir nota teslim ederek, İmparatorluğa karşı konumumuzu resmen ilan etmemizi talep etti. Habsburglar, eski taç toprakları olarak Bohemya ve Moravya'nın kendilerine ait olduğunu iddia ediyorlar. \n\nAncak, [HUN.GetLeader] kendisinin nominal olarak ülkemizin devlet başkanı olduğu, ancak çok az gerçek güce sahip olduğu bir uzlaşma çözümünü kabul edeceğini belirtti."
 WW_hungary.55.t:0 "Avusturya-Macaristan \"Koruma\" teklifinde bulundu"
 WW_hungary.56.a:0 "Doğum hakkımızı geri alma yolunda bir adım daha."
 WW_hungary.56.desc:0 "Gece geç saatlere kadar süren en üst düzeydeki tartışmaların ardından, [CZE.GetAdjective] hükümeti teklifimizi kabul etmeye karar verdi ve Albrecht Franz'ı Bohemya Kralı, Moravya Margravı ve Teschen Dükü ilan etti. Eski Çek Ordusu'nun askerleri yeni Krallarına ve İmparatorlarına yemin ettiler ve krallıkların sivil idaresi nominal olarak entegre edildi."
 WW_hungary.56.t:0 "Bohemya taca geri dönüyor"
 WW_hungary.57.a:0 "Bu talihsizlik..."
 WW_hungary.57.desc:0 "[CZE.GetNameDefCap], gelecekteki ilişkileriyle ilgili herhangi bir çözüm veya anlaşmayı değerlendirmeyi reddetti. Büyükelçimiz daha önce teslim ettiği resmi notayı görüşmek üzere dışişleri bakanlığına geldiğinde, konuşulacak bir şey olmadığı söylendi ve hızla kapı dışarı edildi. Hükümetimize [CZE.GetAdjective] büyükelçisi, hükümetinin uluslarımız arasında barışçıl ve dostane bir ilişki istediğini, ancak [CZE.GetNameDef]'in Avusturya-Macaristan İmparatorluğu'na dahil edilme olasılığının olmadığını açıkladı."
 WW_hungary.57.t:0 "[CZE.GetNameDefCap] ilerlemeleri reddediyor"
 WW_hungary.58.a:0 "Kan dökmeye değmez"
 WW_hungary.58.b:0 "O zaman gel de al!"
 WW_hungary.58.desc:0 "Pervasız [FROM.GetLeader], son zamanlarda belirttiği gibi, Galiçya ve Bukovina topraklarımızdaki yasadışı işgalimizi kınadı. Şimdi, bir [FROM.GetAdjective] ültimatomu aldık ve birlikleri sınırımızda toplanıyor. Nasıl yanıt vermeliyiz?"
 WW_hungary.58.t:0 "[FROM.GetNameDefCap] Galiçya ve Bukovina'nın Kontrolünü Talep Ediyor"
 WW_hungary.59.a:0 "Bu harika bir gün!"
 WW_hungary.59.desc:0 "[FROM.GetNameDef]'in makul lideri [FROM.GetLeader], Galiçya ve Bukovina'daki topraklarını devretmeyi kabul etti ve birliklerine geri çekilmelerini ve bölgeden çekilmelerini söyledi. Bir kez daha zafer bizim!"
 WW_hungary.59.t:0 "[FROM.GetNameDefCap] Galiçya ve Bukovina Topraklarını devrediyor"
 WW_hungary.6.a:0 "O zaman savaş"
 WW_hungary.6.b:0 "Bu çabaya değmez"
 WW_hungary.6.desc:0 "[FROM.getNameDef]'deki kibirli liderler barış teklifimize karşı karar verdiler ve Transilvanya'yı bize devretmektense savaşın tercih edilir olduğunu iddia ediyorlar. Belki de blöfümüzü görmüşlerdir, ya da belki de onlara saldırmak için şu an doğru zamandır. Bunu sadece zaman gösterebilir."
 WW_hungary.6.t:0 "[FROM.GetNameDefCap] Transilvanya'yı Devretmeyi Reddediyor"
 WW_hungary.60.a:0 "Kararlarından pişman olacaklar!"
 WW_hungary.60.b:0 "Bunu bırakmalıyız"
 WW_hungary.60.desc:0 "Tamamen beklenmedik olmasa da, [FROM.GetNameDef]'in aptal lideri [FROM.GetLeader], ültimatomumuzu aldıktan sonra ülkenin birliklerini yüksek alarma geçirdi ve anlaşmazlık konusunda tek bir adım bile geri atmayacaklarını belirten bir elçi gönderdi."
 WW_hungary.60.t:0 "[FROM.GetNameDefCap] Kararlı Duruyor"
 WW_hungary.61.a:0 "Gerçekten de"
 WW_hungary.61.desc:0 "[FROM.GetNameDefCap], ulusumuzun yeni kraliçesi olarak María Josepha Sophia de Iturbide'yi atadı. Bu, rejimimizi kesinlikle güçlendirecektir."
 WW_hungary.61.t:0 "[FROM.GetNameDefCap] de Iturbide Yönetimini Geri Getiriyor"
 WW_hungary.62.a:0 "Zaten zamanı gelmişti"
 WW_hungary.62.b:0 "Kim olduklarını sanıyorlar?"
 WW_hungary.62.desc:0 "[FROM.GetNameDefCap] İmparatoru [FROM.GetLeader], 1821'den 1823'e ve 1864'ten 1867'ye kadar olduğu gibi topraklarımız üzerinde Iturbide-Habsburg yönetimini geri getirmemizi ve bir kez daha bir hükümdar taçlandırmamızı talep etti. Bu, bizi onlarla aynı hizaya getirecek ve bağımsızlığımızı tamamen sona erdirmeden ittifaklarına katılmamızı sağlayacaktır."
 WW_hungary.62.t:0 "[FROM.GetLeader] İmparatorluk Yönetimini Geri Getirmemizi Talep Ediyor"
