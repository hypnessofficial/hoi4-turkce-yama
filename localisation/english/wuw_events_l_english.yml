 WW_hungary.65.desc:0 "[FROM.GetNameDefCap], ulusumuzun yeni kralı olarak Joseph Francis von Habsburg'u atadı. Bu, rejimimizi kesinlikle güçlendirecektir."
 WW_hungary.65.t:0 "[FROM.GetNameDefCap] Bize Bir Habsburg Hükümdarı Atıyor"
 WW_hungary.66.a:0 "Her zaman istediğimiz buydu!"
 WW_hungary.66.b:0 "Kim olduklarını sanıyorlar?"
 WW_hungary.66.desc:0 "[FROM.GetNameDefCap] İmparatoru [FROM.GetLeader], Avusturya-Macaristan İmparatorluğu'nun dağılmasına kadar olduğu gibi topraklarımız üzerinde Habsburg yönetimini geri getirmemizi ve bir kez daha kendi hükümdarımız olarak bir Habsburg'u taçlandırmamızı talep etti. Ancak bize eskisinden daha büyük bir özerklik vaat ediyorlar, Üçlü Monarşi olarak adlandırılan büyük vaatlerle. Ne diyoruz?"
 WW_hungary.66.t:0 "[FROM.GetLeader] Habsburg Yönetimini geri getirmemizi talep ediyor"
 WW_hungary.67.a:0 "Doğru seçimi yaptılar"
 WW_hungary.67.desc:0 "[FROM.GetNameDef]'deki bilge liderlik, taleplerimize uygun olarak bir Habsburg hükümdarını taçlandırmaya ve yeni krallarının yerine çekilmeye karar verdi."
 WW_hungary.67.t:0 "[FROM.GetNameDefCap] Bir Habsburg Hükümdarını Kabul Ediyor"
 WW_hungary.68.a:0 "Akılsızca bir seçim yaptılar..."
 WW_hungary.68.desc:0 "[FROM.GetNameDef]'deki çökmekte olan liderlik, mevcut pozisyonlarında kalmaya karar verdi ve bir şekilde tanrının kendisi tarafından seçilen bir hükümdardan daha bilge olduklarına inanıyorlar. Beğenseler de beğenmeseler de onları devirecek ve Joseph Francis'i tahtlarına oturtacağız!"
 WW_hungary.68.t:0 "[FROM.GetNameDefCap] Bir Habsburg Hükümdarını Reddediyor"
 WW_hungary.69.a:0 "Memnuniyetle katılırdık"
 WW_hungary.69.b:0 "Kim olduklarını sanıyorlar?"
 WW_hungary.69.desc:0 "[FROM.GetNameDefCap] İmparatoru [FROM.GetLeader], İtalya ile birleşmemize kadar olduğu gibi topraklarımız üzerinde Habsburg yönetimini geri getirmemizi ve bir kez daha kendi hükümdarımız olarak bir Habsburg'u taçlandırmamızı talep etti. Ancak bize eskisinden daha büyük bir özerklik vaat ediyorlar. Ne diyoruz?"
 WW_hungary.69.t:0 "[FROM.GetLeader] Habsburg Yönetimini geri getirmemizi talep ediyor"
 WW_hungary.7.a:0 "Kan dökmeye değmez"
 WW_hungary.7.b:0 "O zaman gel de al!"
 WW_hungary.7.desc:0 "Pervasız [FROM.GetLeader], son zamanlarda belirttiği gibi, [FROM.GetAdjective] güney Slovakya'daki yasadışı işgalimizi kınadı. Şimdi, bir [FROM.GetAdjective] ültimatomu aldık ve birlikleri sınırımızda toplanıyor. Nasıl yanıt vermeliyiz?"
 WW_hungary.7.t:0 "[FROM.GetNameDefCap] Güney Slovakya'yı Talep Ediyor"
 WW_hungary.70.a:0 "Doğru seçimi yaptılar"
 WW_hungary.70.desc:0 "[FROM.GetNameDef]'deki bilge liderlik, taleplerimize uygun olarak bir Habsburg hükümdarını taçlandırmaya ve yeni krallarının yerine çekilmeye karar verdi."
 WW_hungary.70.t:0 "[FROM.GetNameDefCap] Bir Habsburg Hükümdarını Kabul Ediyor"
 WW_hungary.71.a:0 "Akılsızca bir seçim yaptılar..."
 WW_hungary.71.desc:0 "[FROM.GetNameDef]'deki çökmekte olan liderlik, mevcut pozisyonlarında kalmaya karar verdi ve bir şekilde tanrının kendisi tarafından seçilen bir hükümdardan daha bilge olduklarına inanıyorlar. Beğenseler de beğenmeseler de onları devirecek ve Robert'i tahtlarına oturtacağız!"
 WW_hungary.71.t:0 "[FROM.GetNameDefCap] Bir Habsburg Hükümdarını Reddediyor"
 WW_hungary.72.a:0 "Kan dökmeye değmez"
 WW_hungary.72.b:0 "O zaman gel de al!"
 WW_hungary.72.desc:0 "Pervasız [FROM.GetLeader], son zamanlarda belirttiği gibi, [FROM.GetAdjective] Silezya'daki yasadışı işgalimizi kınadı. Şimdi, bir [FROM.GetAdjective] ültimatomu aldık ve birlikleri sınırımızda toplanıyor. Nasıl yanıt vermeliyiz?"
 WW_hungary.72.t:0 "[FROM.GetNameDefCap] [SIL.GetAdjective] Topraklarımızın Kontrolünü Talep Ediyor"
 WW_hungary.73.a:0 "Bu harika bir gün!"
 WW_hungary.73.desc:0 "[FROM.GetNameDef]'in makul lideri [FROM.GetLeader], Silezya'daki topraklarını devretmeyi kabul etti ve birliklerine geri çekilmelerini ve bölgeden çekilmelerini söyledi. Bir kez daha zafer bizim!"
 WW_hungary.73.t:0 "[FROM.GetNameDefCap] [SIL.GetAdjective] Topraklarını devrediyor"
 WW_hungary.74.a:0 "Kararlarından pişman olacaklar!"
 WW_hungary.74.b:0 "Bunu bırakmalıyız"
 WW_hungary.74.desc:0 "Tamamen beklenmedik olmasa da, [FROM.GetNameDef]'in aptal lideri [FROM.GetLeader], ültimatomumuzu aldıktan sonra ülkenin birliklerini yüksek alarma geçirdi ve anlaşmazlık konusunda tek bir adım bile geri atmayacaklarını belirten bir elçi gönderdi."
 WW_hungary.74.t:0 "[FROM.GetNameDefCap] Silezya'da Kararlı Duruyor"
 WW_hungary.75.a:0 "Katolikliğin savunucuları alabilir"
 WW_hungary.75.b:0 "Yine kaç haçlı seferi başarısız oldu?"
 WW_hungary.75.desc:0 "Pervasız [FROM.GetLeader], Kutsal Toprakların [FROM.GetAdjective] kuvvetleri tarafından işgal edilmesi çağrısında bulundu ve bölgeyi teslim etmemizi ve kendi kuvvetlerimizi bölgeden çekmemizi talep etti. Dikkatli olmazsak durum potansiyel olarak kontrolden çıkabilir. Nasıl yanıt vermeliyiz?"
 WW_hungary.75.t:0 "[FROM.GetNameDefCap] Kutsal Toprakları Talep Ediyor"
 WW_hungary.76.a:0 "Bu harika bir gün!"
 WW_hungary.76.desc:0 "[FROM.GetNameDef]'in makul lideri [FROM.GetLeader], Filistin'i bize devretmeyi kabul etti ve birliklerine geri çekilmelerini ve bölgeden çekilmelerini söyledi. Bir kez daha zafer bizim!"
 WW_hungary.76.t:0 "[FROM.GetNameDefCap] Kutsal Toprakları devrediyor"
 WW_hungary.77.a:0 "Kararlarından pişman olacaklar!"
 WW_hungary.77.b:0 "Bunu bırakmalıyız"
 WW_hungary.77.desc:0 "Tamamen beklenmedik olmasa da, [FROM.GetNameDef]'in aptal lideri [FROM.GetLeader], ültimatomumuzu aldıktan sonra ülkenin birliklerini yüksek alarma geçirdi ve anlaşmazlık konusunda tek bir adım bile geri atmayacaklarını belirten bir elçi gönderdi."
 WW_hungary.77.t:0 "[FROM.GetNameDefCap] Kutsal Topraklarda Kararlı Duruyor"
 WW_hungary.78.a:0 "Gerçekten de"
 WW_hungary.78.desc:0 "[FROM.GetNameDefCap], ulusumuzun lideri olarak yeni bir Papa atadı. Bu, rejimimizi kesinlikle güçlendirecektir."
 WW_hungary.78.t:0 "[FROM.GetNameDefCap] Bize Yeni Bir Lider Atıyor"
 WW_hungary.79.a:0 "Gerçekten de"
 WW_hungary.79.desc:0 "[FROM.GetNameDefCap], ulusumuzun lideri olarak yeni bir hükümdar atadı. Bu, rejimimizi kesinlikle güçlendirecektir."
 WW_hungary.79.t:0 "[FROM.GetNameDefCap] Bize Yeni Bir Lider Atıyor"
 WW_hungary.8.a:0 "Alabileceğimiz tüm yardıma ihtiyacımız var..."
 WW_hungary.8.b:0 "Peki garantilerinin değeri tam olarak ne kadar?"
 WW_hungary.8.desc:0 "[HUN.GetNameDef]'den [HUN.GetLeader] ilginç bir teklifle bize başvurdu. [975.GetName]'in, ya da onların deyimiyle Lajtabánság'ın [HUN.GetAdjective] ellerine iadesi karşılığında, bize bağımsızlık garantisi vermeye ve [GER.GetAdjective]lerin üzerimize gelmesi durumunda yanımızda durmaya istekli olacaklarını belirtiyor. Tekliflerini kabul etmeli miyiz?"
 WW_hungary.8.t:0 "[HUN.GetNameDefCap] [975.GetName] Karşılığında Koruma Teklif Ediyor"
 WW_hungary.80.a:0 "Olması gerektiği gibi"
 WW_hungary.80.b:0 "Bizi asla canlı yakalayamayacaklar!"
 WW_hungary.80.desc:0 "[HUN.GetNameDefCap], topraklarımızın Avusturya-Macaristan tacına geri entegre edilmesinin tam zamanı olduğuna karar verdi. Bu gerçeği kabul etmekten başka pek bir şey yapamayız...."
 WW_hungary.80.t:0 "[HUN.GetNameDefCap] Bizi Entegre Etmek İstiyor"
 WW_hungary.81.a:0 "Ve dünyada her şey yolunda"
 WW_hungary.81.desc:0 "[FROM.GetNameDefCap], topraklarının Avusturya-Macaristan tacına geri entegre edilmesi talebimizi kabul etmeye karar verdi. Bugün imparatorluk için harika bir gün!"
 WW_hungary.81.t:0 "[FROM.GetNameDefCap] Entegrasyonu kabul ediyor"
 WW_hungary.82.a:0 "Onlara bedelini ödeteceğiz"
 WW_hungary.82.desc:0 "[FROM.GetNameDefCap], topraklarının Avusturya-Macaristan tacına geri entegre edilmesi talebimizi reddetmeye karar verdi. Bu yüzden zorla yapmak zorunda kalacağız..."
 WW_hungary.82.t:0 "[FROM.GetNameDefCap] Entegrasyonu reddediyor"
 WW_hungary.83.a:0 "Alabildiğimiz tüm parayı alacağız"
 WW_hungary.83.b:0 "[975.GetName] [ROOT.GetAdjective]!"
 WW_hungary.83.desc:0 "[HUN.GetAdjective] hükümeti hala [975.GetName]'i krallıklarının ayrılmaz bir bölgesi olarak görüyor ve İmparatorluk döneminde Macaristan'ın bir parçası olduğunu ve bu nedenle iade edilmesi gerektiğini belirtiyor. Şimdi bize bölgeyi iyi bir fiyata geri satın alma teklifiyle geldiler."
 WW_hungary.83.t:0 "[FROM.GetNameDefCap] [975.GetName]'i satın almayı teklif ediyor"
 WW_hungary.84.a:0 "Mükemmel"
 WW_hungary.84.desc:0 "[FROM.GetNameDef]'in makul lideri [FROM.GetLeader], [975.GetName]'i bize devretmeyi kabul etti ve söz verdiğimiz gibi ödemeyi aldı. Bugün [ROOT.GetAdjective] halkı için harika bir gün!"
 WW_hungary.84.t:0 "[FROM.GetNameDefCap] bize [975.GetName]'i satıyor"
 WW_hungary.85.a:0 "Kararlarından pişman olacaklar!"
 WW_hungary.85.b:0 "Hayır dediler ve buna saygı duyacağız"
 WW_hungary.85.desc:0 "Tamamen beklenmedik olmasa da, [FROM.GetNameDef]'in aptal lideri [FROM.GetLeader] talebimizi reddetti ve [975.GetName]'deki anlaşmazlık konusunda tek bir adım bile geri atmayacaklarını belirten bir elçi gönderdi."
 WW_hungary.85.t:0 "[From.GetNameDefCap] Teklifimizi Reddediyor"
 WW_hungary.86.a:0 "Onlarla savaşacak gücümüz yok"
 WW_hungary.86.b:0 "Kararlarından pişman olmayı öğrenecekler!"
 WW_hungary.86.desc:0 "[FROM.GetAdjective] paramiliter örgütlerine ait isyancılar, [975.GetName] bölgesindeki kilit binaların kontrolünü ele geçirdi ve [FROM.GetNameDef]'e yeniden katılması için aceleyle bir referandum düzenledi, açıkça hileli sonuçlar bunu yapmaktan yana ağır basıyordu. Birliklerimiz yakınlarda beklemede, ancak müdahalenin doğru bir eylem olup olmadığını görmek için emir bekliyorlar."
 WW_hungary.86.t:0 "[FROM.GetNameDefCap] [975.GetName]'de Bir Ayaklanma Düzenliyor"
 WW_hungary.87.a:0 "Bize katılmalarından memnuniyet duyarız"
 WW_hungary.87.b:0 "Onlara ihtiyacımız yok"
 WW_hungary.87.desc:0 "[FROM.GetLeader], başkentimize bir ziyaretin ardından bize yaklaşarak, tüm [FROM.GetAdjective] halkı adına konuştuğunu iddia ederek, her iki ulusumuzun da hem [ROOT.GetAdjective] hem de [FROM.GetAdjective] uluslarının halkını koruma hedefiyle askeri bir ittifakta birleşmesini diledi."
 WW_hungary.87.t:0 "[FROM.GetNameDefCap] İttifakımıza Katılmak İstiyor"
 WW_hungary.88.a:0 "Geleceğimizi birlikte inşa edelim!"
 WW_hungary.88.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], uluslarımız arasındaki bağı güçlendiren yeni bir askeri ittifak kurmayı kabul etti. Halkımız bu önemli olayı kutlamak için sokaklara döküldü, çünkü bu [ROOT.GetAdjective] devletinin yeniden doğuşunu ve halkı için yeni, daha güvenli bir dönemin başlangıcını işaret ediyor."
 WW_hungary.88.t:0 "[FROM.GetNameDefCap] Onlara Katılmamıza İzin Veriyor"
 WW_hungary.89.a:0 "Kaderde yokmuş"
 WW_hungary.89.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader] talebimizi reddetti ve yakın gelecekte devletlerimiz arasında işbirliği için tüm fırsatları esasen engelledi. Bu nedenle başka ittifaklar aramak veya kendi başımıza durmak zorunda kalacağız."
 WW_hungary.89.t:0 "[FROM.GetNameDefCap] Onlara Katılmamıza İzin Vermiyor"
 WW_hungary.9.a:0 "Bugün yeniden bir araya gelen iki eski dost olarak duruyoruz!"
 WW_hungary.9.desc:0 "[FROM.GetNameDef]'deki bilge liderlik teklifimizi kabul etmeye karar verdi ve bağımsızlık garantileri karşılığında [975.GetName] bölgesinin kontrolünü derhal bize devredecek. Büyüyoruz ve [FROM.GetAdjective]lerle dostluğumuz bir kez daha canlandı."
 WW_hungary.9.t:0 "[FROM.GetNameDefCap] Garantiler Karşılığında [975.GetName]'i Devrediyor"
 WW_hungary.90.a:0 "Miklós Horthy doğal seçimdir"
 WW_hungary.90.b:0 "István Horthy'nin halk desteği var"
 WW_hungary.90.desc:0 "Şimdi monarşinin resmen yeniden kurulmasına karar verildi, ama bir sorunumuz var. İyi adaylar ortaya çıkmadı, ancak naip yakında seçmek zorunda. Kendisini taçlandırabilir, ancak bu geniş çapta popüler olmayacaktır, ya da belki alternatif bir yola gidip halk arasında çok popüler olan oğlu István Horthy'yi taçlandırabilir. Pozisyon için kim seçilmeli?"
 WW_hungary.90.t:0 "Bir Apostolik Kralın Taç Giymesi"
 WW_hungary.91.a:0 "Pekala, kabul ediyoruz"
 WW_hungary.91.b:0 "Kendilerini bir şey sanıyor olmalılar"
 WW_hungary.91.desc:0 "[HUN.GetAdjective] hükümeti, iki ülkemizi tek bir ülke olarak birleştirmek için ilginç bir teklifle bize başvurdu. Elbette bunun kendi şartlarına göre olmasını istiyorlar, yani her ikisini de yönetecek olan kendi hükümetleri olacak, ama belki de gidilecek en güvenli seçenek budur?"
 WW_hungary.91.t:0 "[FROM.GetNameDefCap] Bir Birlik Öneriyor"
 WW_hungary.92.a:0 "Harika!"
 WW_hungary.92.desc:0 "[FROM.GetNameDef]'in makul lideri [FROM.GetLeader], hükümetin kontrolünü bize devretmeyi kabul etti ve her iki ulusumuzu tek bir kral altında birleştirme sürecini başlattı. Bir kez daha zafer bizim!"
 WW_hungary.92.t:0 "[FROM.GetNameDefCap] Birliği Kabul Ediyor"
 WW_hungary.93.a:0 "Bu onların vereceği bir karar"
 WW_hungary.93.desc:0 "Tamamen beklenmedik olmasa da, [FROM.GetNameDef]'in aptal lideri [FROM.GetLeader], teklifimizi aldıktan sonra ülkenin birliklerini yüksek alarma geçirdi ve tek bir adım bile geri atmayacaklarını belirten bir elçi göndererek 'Romanya Romanya'dır!' dedi."
 WW_hungary.93.t:0 "[From.GetNameDefCap] Birliği Reddediyor"
 WW_hungary.94.a:0 "Béla Kun iktidara geri dönmeli"
 WW_hungary.94.b:0 "Mátyás Rákosi halkın saygısını kazandı"
 WW_hungary.94.c:0 "Mihály Károlyi bize liderlik etmeli"
 WW_hungary.94.desc:0 "İç savaşın tozu dumanı dağıldıktan sonra, ulusun acilen halkın seçilmiş bir temsilcisine ihtiyacı var. Bir köşede popüler Mihály Károlyi, muhafazakar politikacı ve Macaristan'ın eski başbakanı duruyor. Diğer tarafta ise komünistler var, bazıları eski Macar Sovyet Cumhuriyeti'nin lideri Bela Kun'un iktidara geri dönmesini destekliyor, diğerleri ise yakın zamanda cephede savaşarak övgü kazanan Stalinist Mátyás Rákosi'yi destekliyor. Ülkeyi geleceğe kim taşıyacak?"
 WW_hungary.94.t:0 "Yeni Bir [ROOT.GetAdjective] Cumhurbaşkanı Seçmek"
 WW_hungary.95.a:0 "Mihály Károlyi nasıl liderlik edeceğini biliyor"
 WW_hungary.95.b:0 "Árpád Szakasits iyi bir orta yol bulabilir"
 WW_hungary.95.c:0 "János Zichy tekrar ayağa kalkmamıza yardımcı olabilir"
 WW_hungary.95.desc:0 "Nihayet ulus için bir cumhurbaşkanlığı seçimi yapma ve demokratik ilkelerimizin Avrupa'nın merkezinde parlak bir fener gibi parlamasını sağlama zamanı geldi. Katılan ana adaylar, Birinci Cumhuriyet'in cumhurbaşkanı Mihály Károlyi, Macar sosyal demokratlarının lideri Árpád Szakasits ve Macar Hristiyan Ekonomik ve Sosyal Partisi'nin lideri ve aynı zamanda Macar Bilimler Akademisi'nin bir üyesi olan János Zichy'dir. Macaristan'ı nasıl bir gelecek bekliyor?"
 WW_hungary.95.t:0 "İkinci Cumhuriyetin İlk Cumhurbaşkanlığı Seçimi"
 WW_hungary.96.a:0 "Kan dökmeye değmez"
 WW_hungary.96.b:0 "O zaman gel de al!"
 WW_hungary.96.desc:0 "Pervasız [FROM.GetLeader], son zamanlarda belirttiği gibi, [FROM.GetAdjective] Slovakya'daki yasadışı işgalimizi kınadı. Şimdi, bir [FROM.GetAdjective] ültimatomu aldık ve birlikleri sınırımızda toplanıyor. Nasıl yanıt vermeliyiz?"
 WW_hungary.96.t:0 "[FROM.GetNameDefCap] [SLO.GetAdjective] Topraklarımızın Kontrolünü Talep Ediyor"
 WW_hungary.97.a:0 "Bu harika bir gün!"
 WW_hungary.97.desc:0 "[FROM.GetNameDef]'in makul lideri [FROM.GetLeader], Slovakya'daki topraklarını devretmeyi kabul etti ve birliklerine geri çekilmelerini ve bölgeden çekilmelerini söyledi. Bir kez daha zafer bizim!"
 WW_hungary.97.t:0 "[FROM.GetNameDefCap] [SLO.GetAdjective] Topraklarını devrediyor"
 WW_hungary.98.a:0 "Kararlarından pişman olacaklar!"
 WW_hungary.98.b:0 "Bunu bırakmalıyız"
 WW_hungary.98.desc:0 "Tamamen beklenmedik olmasa da, [FROM.GetNameDef]'in aptal lideri [FROM.GetLeader], ültimatomumuzu aldıktan sonra ülkenin birliklerini yüksek alarma geçirdi ve anlaşmazlık konusunda tek bir adım bile geri atmayacaklarını belirten bir elçi gönderdi."
 WW_hungary.98.t:0 "[FROM.GetNameDefCap] Slovakya'da Kararlı Duruyor"
 WW_hungary.99.a:0 "Daha adil bir dünya için!"
 WW_hungary.99.b:0 "Açıkça hezeyan içindeler"
 WW_hungary.99.desc:0 "[HUN.GetAdjective] halkının Székelyföld olarak bildiği [76.GetName]'nin çoğunu kapsayan bölge, büyük ölçüde onların kardeşleri olan Székely Macarları tarafından iskan edilmektedir. Kendi farklı lehçelerini konuşurlar ve kendi benzersiz kültürlerine sahiptirler ve bu nedenle [HUN.GetLeader], onların uluslarının entegre bir parçası olmaları gerekmediğini belirtmiştir. Ancak, bu halkın koruyucuları olmak istiyorlar ve bizden bölge üzerinde hakimiyet talep ediyorlar."
 WW_hungary.99.t:0 "Macaristan Székely Toprakları Üzerinde Hakimiyet Talep Ediyor"
 anschluss_mefo_bills_tt:0 "§Y[GetMilitaryProductionModifierName]§! maliyetini düşürmek için Avusturya altınını kullanır.\n"
 attempted_diplomacy_opinion_modifier:0 "Bize diplomatik olarak yaklaşmaya çalıştılar"
 congo_independence_struggle.1.a:0 "Diplomasi yoluyla özgürlüğümüzü kazanmaya çalışmalıyız"
 congo_independence_struggle.1.b:0 "Ne pahasına olursa olsun bağımsız olmalıyız"
 congo_independence_struggle.1.d:0 "Kıtamız Avrupalılar arasında bölündüğünden beri, özgürlüğü ve kendi geleceğimizi çizme yeteneğini arzuladık. [BEL.GetNameDefCap]'in kolonisi olarak kendi geçmişimiz sömürü ve insanlıktan çıkarma ile renklendi, ancak her zaman kendi bölünmüşlüğümüz ve onların üstün ateş gücü tarafından bastırıldık. \n\nHalkımız sömürge müdahalesinden arınmış bir Kongo, kendi yasalarını yapıp uygulayabilen bir Kongo, kendi sıkı çalışmalarından kar elde edebilen bir Kongo, kendi geleceğini şekillendirebilen bir Kongo hayallerine ses verirken, sokaklarda ve ormanlarda bir kez daha isyankar fısıltılar duyuldu."
 congo_independence_struggle.1.t:0 "Bağımsızlık Fısıltıları"
 congo_independence_struggle.10.a:0 "Onların bir Dominyon olmasına razı olabiliriz"
 congo_independence_struggle.10.b:0 "Hayır, onları daha fazla entegrasyona doğru itebiliriz"
 congo_independence_struggle.10.d:0 "Onları bir dominyon olarak yükseltme teklifimizle ilgili olarak [COG.GetNameDef]'den bir yanıt aldık ve kabul ettiler! \n\nMüzakereye istekli olduklarını gördüğümüze göre, biraz daha zorlarsak, onları daha da aşağıya çekebiliriz, ancak bu risksiz değil ve onları tamamen kaybedebilir veya daha kötüsü onları bir köşeye sıkıştırabiliriz."
 congo_independence_struggle.10.t:0 "[FROM.GetNameDefCap] Dominyon Pozisyonunu Kabul Etmeye İstekli"
 congo_independence_struggle.11.a:0 "İşe koyulma ve yeni Dominyonumuzu inşa etme zamanı!"
 congo_independence_struggle.11.d:0 "[BEL.GetName] ile yapılan anlaşma uyarınca, bu sabah Dominyon Parlamentosu'na ev sahipliği yapacak yeni hükümet binasının inşasına başlamak için temel attık. Bir sonraki adım, anayasamızı yazma sürecine başlamak ve ilk seçimi çağırmak olacak. Bu mütevazı başlangıçlardan, bu ulusun gelecekteki siyasi kimliğini şekillendirmeye başlayabiliriz."
 congo_independence_struggle.11.t:0 "Kongo Dominyonunun Kurulması"
 congo_independence_struggle.12.a:0 "Bu kabul edilemez! Onları güç kullanmakla tehdit et."
 congo_independence_struggle.12.b:0 "Geri adım atmalıyız, bir denizaşırı bölge o kadar da kötü değil"
 congo_independence_struggle.12.d:0 "Şok bir hamleyle, [BEL.GetName] bir Dominyon kurma teklifini geri çekmeye karar verdi! Bu tutum değişikliğine neyin neden olduğundan tam olarak emin değiliz, belki bir kez geri adım attıktan sonra sömürgeci en iyi yaptığı şeyi yapıyor ve durumdan yararlanıyor. Bu hakarete karşı kendi tepkimize karar vermeliyiz."
 congo_independence_struggle.12.t:0 "[FROM.GetNameDefCap] Dominyon Çözümünü Reddediyor"
 congo_independence_struggle.13.a:0 "Mükemmel!"
 congo_independence_struggle.13.d:0 "[COG.GetName]'e karşı diplomatik oyunumuz işe yaradı! Heyetleri bugün bir Denizaşırı Bölge olarak yerlerini kabul etmek için bizi görmeye geldi."
 congo_independence_struggle.13.t:0 "Kongo geri adım atıyor ve bir Denizaşırı Bölge olmayı kabul ediyor"
 congo_independence_struggle.14.a:0 "O zaman savaşsınlar! [COG.GetNameDef] BİZİM!"
 congo_independence_struggle.14.b:0 "Şu anda çok fazla yayılmış durumdayız. Onlara çok arzuladıkları özgürlüğü verin."
 congo_independence_struggle.14.d:0 "[COG.GetNameDef]'den çok kavgacı bir delege daha önce Sömürge Valisi ile bir araya geldi. Görüşmelerdeki ilerlemeden açıkça hayal kırıklığına uğramış olarak bir ültimatom sundular. \n\nYa bağımsızlıklarını derhal yürürlüğe girecek şekilde kabul ederiz ya da bize karşı özgürlük çanlarını çalarlar. Şimdiden milis birliklerinin toplandığına dair raporlar alıyoruz ve Force Publique garnizonlarına karşı zaten bir dizi çatışma yaşandı. Henüz kimse ölmedi, ama bu kadar yüksek gerilimle bu sadece an meselesi."
 congo_independence_struggle.14.t:0 "[FROM.GetNameDefCap] Savaşla Tehdit Ediyor"
 congo_independence_struggle.15.a:0 "Galip geleceğiz"
 congo_independence_struggle.15.d:0 "Sadık Force Publique birlikleri bugün bağımsızlık hareketinin liderlerini toplayıp tutuklamaya çalıştı. [COG.GetAdjective] milisleri araya girdi ve aralarında ateş açıldı. Görünüşe göre diplomasi başarısız oldu ve bu bağımsızlık savaşı resmen başladı."
 congo_independence_struggle.15.t:0 "[FROM.GetNameDefCap] Savaşmadan Ayrılmayacak"
 congo_independence_struggle.16.a:0 "Bugün kutlama günü!"
 congo_independence_struggle.16.d:0 "Sömürgeci hakim devletimizle savaşın eşiğinden geri dönmeyi başardık. Ya da daha doğrusu, eski sömürgeci hakim devletimizle. \n\nİdare ile görüşmek üzere gönderdiğimiz heyet bu sabah Sömürge Valisi ile bir araya geldi ve her iki taraf da [COG.GetNameDef]'in bağımsızlığını resmen ilan eden belgeleri imzaladı. Artık kendi özgür ulusumuzuz ve gücün devri çoktan başladı. \n\nBundan sonra kendi kaderimizin tamamen kontrolü bizde ve hepsi kan, gurur veya para ile herhangi bir ödeme olmadan."
 congo_independence_struggle.16.t:0 "[FROM.GetNameDefCap] geri adım atıyor ve Bağımsızlığımızı kabul ediyor"
 congo_independence_struggle.17.a:0 "Kabul etmekten başka çaremiz yok"
 congo_independence_struggle.17.b:0 "Onlar hezeyan içindeler. Düzeni hemen yeniden sağlamak için bir seferi kuvvet düzenleyin!"
 congo_independence_struggle.17.d:0 "Bu sabah [COG.GetNameDef] Sömürge Valisi'nden aceleyle hazırlanmış bir rapor aldık. Resmi konutuna bir kalabalığın girdiğini, muhafızları yabancı yapımı silahlarla etkisiz hale getirdiğini ve eline bir bağımsızlık bildirgesi teslim ettiğini iddia etti. Daha sonra hemen ayrıldılar. En endişe verici olanı, bu kalabalığın düzeni sağlamakla görevli jandarma olan Force Publique unsurları tarafından yönetildiğinin belirtilmesiydi. \n\nBildiri, Sömürge idaresinin derhal geri çekilmesini ve ardından meşru gücün bu isyanın liderliğinden oluşturulacak sivil hükümete devredilmesini talep ediyordu. Riskin gerçek olduğuna dair hiçbir yanılsama içinde olamayız ve bu kalabalığın [BEL.GetAdjective] tasarımı olmayan silahlarla silahlandırılmış olması, yabancı unsurların doğrudan bir ilgi gösterdiğini ve isyancıları askeri olarak destekleyebileceğini düşündürebilir."
 congo_independence_struggle.17.t:0 "[FROM.GetNameDefCap] ne pahasına olursa olsun Bağımsızlık istiyor"
 congo_independence_struggle.18.a:0 "Bugün kutlama günü!"
 congo_independence_struggle.18.d:0 "Görünüşe göre ültimatomumuz hakim devletimiz tarafından gereken ciddiyetle karşılandı, çünkü bugün Sömürge İdaresi'nden imzalı bağımsızlık belgesini aldık. [BEL.GetAdjective] bayrağının resmi olarak indirilmesi için planlar çoktan başladı ve bununla birlikte gücün yeni rejimimize barışçıl bir şekilde devredilmesi. Birincil hedefimize ulaşmış olsak da, bir hükümet kurma konusundaki asıl iş şimdi başlıyor. Yapacak çok işimiz var, geliştirecek bir ekonomimiz, diğer uluslarla normalleştirecek ilişkilerimiz ve tabii ki bu rüyayı gerçekleştirmemizde bize destek olanlara geri ödenecek belirli borçlarımız var."
 congo_independence_struggle.18.t:0 "[FROM.GetNameDefCap] Bizi Bırakıyor"
 congo_independence_struggle.19.a:0 "Zafer onlara yarayacak!"
 congo_independence_struggle.19.b:0 "Bu çok tehlikeli. Geri çekilmeliyiz."
 congo_independence_struggle.19.d:0 "[BEL.GetAdjective] birliklerinin Léopoldville'de seferber olmaya başladığına ve Force Publique'deki sadakatsiz unsurlara yönelik bir baskı olduğuna dair raporlarımız var. [BEL.GetAdjective] hükümetini boyun eğdirmek ve kansız bir şekilde bağımsızlık hedefimize ulaşmak için gösterdiğimiz tüm çabalara rağmen, sömürge güçleri gücü bildikleri tek yolla -zorla- ellerinde tutmayı seçtiler. Fırsat penceremiz hızla kapanıyor ve destekçilerimize ayaklanma emrini mi vereceğimize yoksa işler kontrolümüzden çıkmadan geri mi çekileceğimize karar vermeliyiz."
 congo_independence_struggle.19.t:0 "[FROM.GetNameDefCap] Savaşa Hazırlanıyor"
 congo_independence_struggle.2.a:0 "Yanımızda savaşmaya devam ettikleri sürece"
 congo_independence_struggle.2.b:0 "Pekala, ama sadece bize büyük bir tazminat öderlerse"
 congo_independence_struggle.2.c:0 "Onları asla isteyerek bırakmayacağız!"
 congo_independence_struggle.2.d:0 "Sömürge tebaamız [COG.GetNameDef]'in bağımsızlık hareketini temsil ettiğini iddia eden bir grup tarafından az önce bize başvuruldu. Oradaki sömürge yönetimi bir süredir artan bağımsızlık hissiyatının farkında olsa da, bunu gerçekten isteme cüreti onları bir şekilde şaşırttı. Özgür ve bağımsız bir ulus hedefine ulaşma yönünde yaygın yerel destek olduğu ve çok sert tepki vermeyi seçersek bunun şiddete ve hatta savaşa yol açabileceği konusunda bizi uyarıyorlar. \n\nAyrıca küresel taahhütlerimizi ve prestijimizi de göz önünde bulundurmalıyız. Bu nedenle, en diplomatik teklif, onların [BEL.GetAdjective] Milletler Topluluğu'nda eşit ortaklar olarak bize katılmalarına izin vermek olacaktır. \n\nAlternatif olarak, servetimizin önemli bir kısmı o bölgeden geliyor ve onların kaybı finansmanımızı son derece olumsuz etkileyecektir. Onlardan özgürlükleri için -oldukça yüksek bir fiyata- bize ödeme yapmalarını isteyebiliriz. \n\nSon olarak, basitçe hayır diyebilir ve olası bir ayaklanmaya karşı bir uyarı olarak kuvvetlerimizi seferber edebiliriz."
 congo_independence_struggle.2.t:0 "[FROM.GetNameDefCap] Bağımsızlıkları Konusunda Bize Başvurdu"
 congo_independence_struggle.20.a:0 "Silah başına kardeşler!"
 congo_independence_struggle.20.d:0 "Hızla kötüleşen durumu kontrol altında tutmak için, Force Publique içindeki hain unsurların sistematik olarak ortadan kaldırılması da dahil olmak üzere elimizden gelen önlemleri aldık. Ne yazık ki bu daha açık eylem kavgacı olarak görüldü ve isyankar birimler yaklaştıklarını görür görmez subaylarına ateş açtı. Bu kurşunlarla Bağımsızlık Savaşı ciddiyetle başladı ve her iki tarafın da kontrolünden çıktı. \n\nBize sadık kalan, sömürgeleştirmenin faydalarını en doğrudan hisseden bölgeler var, ancak ülkenin çoğunluğu şimdi bize karşı dizilmiş durumda."
 congo_independence_struggle.20.t:0 "Kongo Bağımsızlık Savaşı İlan Ediyor!"
 congo_independence_struggle.21.a:0 "[BEL.GetAdjective] İmparatorluğuna zafer!"
 congo_independence_struggle.21.d:0 "Kongo'daki mevcut duruma hızlı tepkimiz görünüşe göre oradaki gerilimi yatıştırdı. [BEL.GetAdjective] subayları, Force Publique'in bilinen isyankar unsurlarını etkisiz hale getirmek için hızla harekete geçti. Devam eden sadakatleri güvence altına alındığında, isyanın ateşi hızla söndü ve en gür sesler susturuldu - çoğu durumda hapishanenin kalın duvarlarıyla. \n\nSömürge İdaresi inisiyatif aldı ve kendilerine sunulan fırsatı değerlendirerek, tüm yönetim kademeleri üzerinde kendi kontrollerini genişletti ve sonuç olarak sömürge üzerinde eskisinden çok daha yüksek bir kontrol derecesine sahibiz."
 congo_independence_struggle.21.t:0 "Kongo geri adım atıyor ve bir Denizaşırı Bölge olmayı kabul ediyor"
 congo_independence_struggle.22.a:0 "Onları başarıyla kandırdık!"
 congo_independence_struggle.22.d:0 "[COG.GetNameDef]'den çok azarlanmış bir heyetten, [BEL.GetName]'in bir Denizaşırı Departmanı olarak yerlerini kabul etmeye karar verdiklerine dair haber aldık. Vatandaşlık ve vergi dairelerimiz, bu yeni vatandaşların sistemimize uygun entegrasyonu için belgeleri hazırlamaya başladı ve Sömürge Ofisi, [BEL.GetAdjective] çizgilerini daha yakından takip eden yeni bir yerel yönetim sistemi hazırlamaya başladı."
 congo_independence_struggle.22.t:0 "Yeni bir Denizaşırı Departmanın Oluşturulması"
 congo_independence_struggle.23.a:0 "Bunu kabul edebiliriz evet"
 congo_independence_struggle.23.b:0 "Bu kabul edilemez, tam bağımsızlık talep ediyoruz!"
 congo_independence_struggle.23.d:0 "[BEL.GetName] diplomatlarıyla yaptığımız toplantı meyvesini verdi ve görünüşe göre hala diplomatik bir yol izlemek istiyorlar. Bize İngiliz modeline benzer şekilde bir Dominyon olarak artırılmış özerklik teklif ettiler. Hala [BEL.GetAdjective] diplomasisini takip etmemiz gerekecek, ancak korumaları altına girerken kendimizi yönetme konusunda önemli ölçüde daha fazla hakka sahip olacağız."
 congo_independence_struggle.23.t:0 "[FROM.GetNameDefCap] bir Dominyon olmamızı istiyor"
 congo_independence_struggle.24.a:0 "Bu kaybetmeyi göze alamayacağımız bir savaş!"
 congo_independence_struggle.24.d:0 "Sabahın sessizliğini silah sesleri bozdu. [BEL.GetAdjective] polis birimleri, Force Publique'in vatansever unsurlarını esir almak üzere gönderildi, ancak bunun yerine bir kurşun yağmuruyla karşılaştılar. İsyan hızla yayılıyor ve milisler ülke genelinde silahlanmaya başladı. Davaya destek ülke genelinde yaygın, ancak Sömürge güçleri, özellikle en çok sömürdükleri ve dolayısıyla en büyük askeri varlığa sahip oldukları bölgelerde olmak üzere birçok alanda kontrolü elinde tutuyor. \n\nBu Bağımsızlık Savaşı ciddiyetle başladı ve Kongo Avrupa işgalinden kurtulana kadar dinlenmeyeceğiz."
 congo_independence_struggle.24.t:0 "Léopoldville'deki Sadıklar Çatışmayı Tırmandırıyor"
 congo_independence_struggle.3.a:0 "Bu çok makul görünüyor. Kabul ediyoruz!"
 congo_independence_struggle.3.b:0 "Bu koşulları kabul edemeyiz..."
 congo_independence_struggle.3.d:0 "[BEL.GetName]'den haber aldık ve sömürge imparatorlukları gününün hızla sona erdiğini kabul ettiler. Bu nedenle bize [BEL.GetAdjective] Milletler Topluluğu'na özgür ve bağımsız bir ulus olarak, dolayısıyla eşit bir ortak olarak katılma teklifi sundular. Hala diğer herhangi bir askeri müttefike sunulan aynı şartlara bağlı kalacağız ve bu nedenle herhangi bir savaşa birlikte katılmamız beklenecektir. \n\nBu muhtemelen umabileceğimiz en diplomatik sonuçtur ve bu, Afrikalı gururunu ve bağımsızlığını korurken Avrupalı dostlarımızla kan dökülmesini tamamen önlememizi sağlayacaktır."
 congo_independence_struggle.3.t:0 "[FROM.GetNameDefCap] İttifaklarına Katılırsak Bize Özgürlüğümüzü Verecek"
 congo_independence_struggle.4.a:0 "Sermayeyi bir şekilde toplayacağız"
 congo_independence_struggle.4.b:0 "Bu koşulları kabul edemeyiz..."
 congo_independence_struggle.4.d:0 "[BEL.GetName]'den haber aldık ve bağımsızlığımıza kelimenin tam anlamıyla bir fiyat biçtiler. Bize, önemli uzunlukta demiryolu döşenmesi, madencilik kapasitelerinin geliştirilmesi ve altyapının genel olarak genişletilmesinden oluşan, ulusumuza yaptıkları önemli sermaye harcamalarını hatırlatıyorlar. \n\nO zamanlar bunun sömürgeci hakim devlet olarak bize karşı sorumluluklarının bir parçası olduğu ve ulusu medenileştirme sürecinin sadece bir parçası olduğu iddia ediliyordu. Ancak şimdi, bunu ekonomik bağımlılık yoluyla devam eden sadakatimizi sürdürmek için tasarlanmış bir teminat olarak başımıza kakıyorlar. \n\nİstenen fiyat ulaşılamaz değil, ama son derece yüksek ve kısa vadede ulusumuzu fakirleştirecek ve çok daha uzun bir süre sonra borç yoluyla onlara bağlı bırakacaktır. Şimdi soru şu ki, bu bağımsızlık fiyatına değer mi, yoksa kanla mı ödenmeli?"
 congo_independence_struggle.4.t:0 "[FROM.GetNameDefCap] Tazminat Ödersek Özgür Olmamıza İzin Verecek"
 congo_independence_struggle.5.a:0 "Misyonumuz sona erdi!"
 congo_independence_struggle.5.d:0 "[COG.GetName]'in yeni büyükelçisinden, [BEL.GetAdjective] Milletler Topluluğu'na tam ve eşit bir üye olarak katılma karşılığında [BEL.GetAdjective] sömürge yönetiminden bağımsızlık teklifini kabul ettiklerini duyuran bir haber aldık. Şimdi idareyi Sömürge Ofisi'nden çıkarma ve bunun yerine bu sorumluluğu yeni hükümetlerine devretme işi başlıyor."
 congo_independence_struggle.5.t:0 "[FROM.GetNameDef]'in gitmesine izin vermek"
 congo_independence_struggle.6.a:0 "Bir denizaşırı departman olmalarını talep et"
 congo_independence_struggle.6.b:0 "O zaman müzakere olmayacak"
 congo_independence_struggle.6.c:0 "Diplomatik kalalım. Belki bir dominyon olmaya razı olurlar?"
 congo_independence_struggle.6.d:0 "Anlaşılan [COG.GetNameDef], barışçıl ve karşılıklı yarar sağlayan bir bağımsızlık yolu için cömert teklifimizi reddetti. Bu nedenle, bu asi sömürgeye ne kadar zorla tutunacağımıza karar vermek şimdi bize kalmış. Aşağıdaki gibi üç seçeneğimiz var;\n\nİlk seçenek, bağımsızlık kazanma kararlılıklarının zayıfladığına inanıyorsak, onlara bir denizaşırı departman statüsü teklif edebiliriz, bu da onları sömürge bir varlıktan, çok sınırlı özerkliğe sahip ulusumuzun uzak bir parçasına etkin bir şekilde dönüştürür. \n\nİkinci seçenek, onları açık bir çatışmaya kışkırtmak ve sonra savaş alanında onlara karşı gücümüzü göstermektir. Bu daha çok bir kumardır, ancak kazanırsak tam bir hakimiyet yolu açıktır ve tüm varlıklarını uluslararası kınama olmaksızın ele geçirebiliriz. \n\nÜçüncü seçenek en diplomatik olanıdır ve [COG.GetNameDef]'in bir dominyon olma hakkını kazandığı İngiliz İmparatorluğu'na benzer bir modeli benimsiyoruz. Diplomatik kararları hala bizim tarafımızdan verilecek, ancak aksi takdirde özerklikleri büyük ölçüde genişletilecektir. \n\nAncak, bunlardan herhangi birini reddederlerse, o zaman şiddet dışında muhtemelen bir çözüm yolu olmadığını bilmeliyiz."
 congo_independence_struggle.6.t:0 "[FROM.GetNameDefCap] Koşullarımızı Kabul Etmeyecek"
 congo_independence_struggle.7.a:0 "Misyonumuz sona erdi, ama kârımız değil!"
 congo_independence_struggle.7.d:0 "[COG.GetNameDef]'in yeni büyükelçisinden, sömürge yönetimimizden bağımsızlıklarını satın alma teklifini kabul ettiklerini duyuran bir haber aldık. Şimdi idareyi Sömürge Ofisi'nden çıkarma ve bunun yerine bu sorumluluğu yeni hükümetlerine devretme işi başlıyor - ve tabii ki uygun ödemeleri almaya başlamak için banka hesaplarının ve holding şirketlerinin oluşturulmasını sağlamak."
 congo_independence_struggle.7.t:0 "[FROM.GetNameDef]'in gitmesine izin vermek"
 congo_independence_struggle.8.a:0 "Peki. Kabul ediyoruz..."
 congo_independence_struggle.8.b:0 "Bu kabul edilemez, tam bağımsızlık talep ediyoruz!"
 congo_independence_struggle.8.d:0 "[BEL.GetName], güç kullanarak onlardan bağımsızlığı elde edemeyeceğimizi düşünüyor ve blöfümüzü görüyor gibi görünüyor. Bize denizaşırı bir departman olma \"fırsatını\" sundular, esasen bizi vatandaşlık haklarına sahip, ancak kendi geleceğimizi şekillendirme özerkliğine sahip olmayan kendi uluslarının bir uzantısı haline getirdiler. Buna karşı çıkacak askeri güce sahip olmadığımız konusunda haklı olabilirler ama tercih sonuçta bizimdir."
 congo_independence_struggle.8.t:0 "[FROM.GetNameDefCap] bir Denizaşırı Departman olmamızı istiyor"
 congo_independence_struggle.9.a:0 "Kongo'da bir kriz demleniyor"
 congo_independence_struggle.9.d:0 "Bu sabah şafak, Force Publique'in isyankar unsurlarının Léopoldville'deki hükümet binalarına saldırmasıyla silah sesleriyle yarıldı. Sadık muhafızlar karşılık verdi ve isyancıları geri püskürtmeyi başardı, ancak gerilim son derece yüksek ve Force Publique birimleri arasında daha fazla isyan olduğu ve yerel milislerin Kongo genelinde silahlanmaya ve toplanmaya başladığına dair raporlar var."
 congo_independence_struggle.9.t:0 "Force Publique Léopoldville'deki Birliklerimize Saldırıyor"
 congolese_civil_war_starting_congo_side_tt:0 "Belçika Sadıkları bize karşı bir iç savaş başlatacak. §YLéopoldville§!, §YÉlisabethville§! ve §YStanleyville§!'i kontrol edersek eski hakim devletlerimizle barışı zorlayabilir ve tam bağımsızlık kazanabiliriz. \n\nAynı şekilde, §YLéopoldville§!, §YÉlisabethville§! ve §YStanleyville§!'i kontrol ederek bizimle barışı zorlayabilir ve ülkemiz üzerindeki kontrollerini sürdürebilirler."
 congolese_civil_war_starting_tt:0 "Kongo bize karşı bir bağımsızlık savaşı ilan edecek. §YLéopoldville§!, §YÉlisabethville§! ve §YStanleyville§!'i kontrol ederlerse barışı zorlayabilir ve tam bağımsızlıklarını kazanabilirler. \n\nAynı şekilde, §YLéopoldville§!, §YÉlisabethville§! ve §YStanleyville§!'i kontrol ederek onlarla barışı zorlayabilir ve bölge üzerindeki kontrolümüzü sürdürebiliriz."
 end_of_czechoslovakia_mefo_bills_tt:0 "§Y[GetMilitaryProductionModifierName]§! maliyetini düşürmek için Çekoslovak altınını kullanır.\n"
 evolue_have_entered_politics:0 "Çeşitli §YBağımsızlık Savunucuları§! ve §YKongolu Siyasi Düşünürler§! şimdi §YSiyasi Danışmanlar§! olarak mevcut olacak!"
 evolue_will_start_attempting_to_enter_politics_tt:0 "Évolué siyasete girmeye çalışmaya başlayacak, bu da birçok yeni §YSiyasi Danışmanın§! ortaya çıkmasına yol açacak"
 generic_lower_mefo_bills_tt:0 "§Y[GetMilitaryProductionModifierName]§! maliyetini düşürmek için yeni ele geçirilen altını kullanır.\n"
 generic_this_might_cause_tt:0 "§RBu şunlara neden olabilir§!:"
 germany_mefo_bills.1.a:0 "Yeniden silahlanma her zaman hedefimiz olmuştur"
 germany_mefo_bills.1.b:0 "Program çok pahalı"
 germany_mefo_bills.1.desc:0 "Yeniden silahlanma programının mali yükü ekonomimizi çökertme riski taşıyor. Silah üretimini eskisi gibi aynı seviyede tutmak istiyorsak, yeni finansman yolları aramalıyız - veya önceliklerimizi değiştirmeliyiz."
 germany_mefo_bills.1.t:0 "Alman Yeniden Silahlanma Programının Geleceği"
 germany_mefo_bills.2.a:0 "Şimdilik idare edeceğiz"
 germany_mefo_bills.2.desc:0 "Yeniden silahlanma programımız, hem gerekli hem de asil niyetli olsa da, bazı ekonomistlerimiz arasında endişe yaratmaya başlıyor. Askeri üretimin kendini sürdürmek için giderek daha fazla fona ihtiyaç duyacağından endişe ediyorlar. Askeri harcamaların kontrolden çıkmaması için yakından takip etmeliyiz."
 germany_mefo_bills.2.t:0 "Yeniden Silahlanmanın Artan Giderleri"
 germany_mefo_bills.3.a:0 "Alternatif fonlar bulmalıyız"
 germany_mefo_bills.3.desc:0 "Yeniden silahlanma çabalarımız giderek güçlenirken, programları finanse etme yükü de artıyor. Askeri üretim şimdi ulusumuzun maliyesinin önemli bir bölümünü alıyor, bu da giderek daha fazla insanın ekonomimizin istikrarı konusunda endişelenmesine neden oluyor. Askeri harcamaları düşük tutmayı başaramazsak, bu ekonomimizi ciddi şekilde engelleyecektir."
 germany_mefo_bills.3.t:0 "Yeniden Silahlanma Üzerine Artan Endişeler"
 germany_mefo_bills.4.a:0 "Bu krizin devam etmesine izin veremeyiz!"
 germany_mefo_bills.4.desc:0 "Askeri harcamalar eşi görülmemiş bir seviyeye ulaştı ve maliyemize gerçek bir darbe vurdu. Acil finansman olmadan, silah üretimimiz durma noktasına gelecek ve ekonomimiz bir bütün olarak onu ayakta tutmaya çalışmanın yükü altında zorlanacaktır."
 germany_mefo_bills.4.t:0 "Askeri Üretim Ekonomik Krize Neden Oluyor"
 lithuania_mefo_bills_tt:0 "§Y[GetMilitaryProductionModifierName]§! maliyetini düşürmek için Litvanya altınını kullanır.\n"
