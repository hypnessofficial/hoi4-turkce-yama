 wuw_GER_realpolitik.62.b:0 "Onları yakından izleyeceğiz"
 wuw_GER_realpolitik.62.desc:0 "Bariz avantajlara ve bunun birliğin en iyisi olmasına rağmen, [FROM.GetNameDef] tam entegrasyon teklifimizi reddetti. Nedenleri hakkında sadece spekülasyon yapılabilir, ama görünüşe göre birliğin en iyi çıkarlarını düşünmüyor olabilirler."
 wuw_GER_realpolitik.62.t:0 "[FROM.GetNameDefCap] Tam Entegrasyonu Reddediyor"
 wuw_GER_realpolitik.63.a:0 "Memnuniyetle kabul edeceğiz"
 wuw_GER_realpolitik.63.b:0 "Bana şüpheli geliyor..."
 wuw_GER_realpolitik.63.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], onlarla bir gümrük birliğine katılmamız için bir teklifle bize başvurdu, bu da her iki ulusumuzun ekonomisini güçlendirmekten başka bir işe yaramayacaktır. Kulağa kaçırılmayacak kadar iyi bir anlaşma gibi geliyor, değil mi?"
 wuw_GER_realpolitik.63.t:0 "[FROM.GetNameDefCap] Bizi bir Gümrük Birliğine Davet Ediyor"
