 WW_hungary.63.desc:0 "[FROM.GetNameDef]'deki bilge liderlik, taleplerimize uygun olarak yeni imparatorları olarak María Josepha Sophia de Iturbide'yi taçlandırmaya ve yeni kraliçelerinin yerine çekilmeye karar verdi."
