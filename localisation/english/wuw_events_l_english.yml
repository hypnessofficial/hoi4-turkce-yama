 WW_hungary.64.a:0 "Yanlış seçimi yaptılar"
 WW_hungary.64.desc:0 "[FROM.GetNameDef]'deki çökmekte olan liderlik, pozisyonlarından çekilmemeye karar verdi ve bir şekilde tanrının kendisi tarafından seçilen bir hükümdardan daha bilge olduklarına inanıyorlar. Beğenseler de beğenmeseler de onları devirecek ve María Josepha Sophia de Iturbide'yi tahtlarına oturtacağız!"
