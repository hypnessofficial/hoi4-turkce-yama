 wuw_GER_reichskommissariats.9.c:0 "Türkistan'a dahil edilmeli"
 wuw_GER_reichskommissariats.9.desc:0 "[ROOT.GetLeader], Volga Alman kolonisini bir Reich toprağına dönüştürmek ve mümkün olduğunca entegre etmek istediğini açıkça belirtti. Ancak birçok yerel yönetici, onu daha yakın bir eyaletten yönetmenin daha akıllıca olacağını düşünüyor. Sorun nasıl ele alınmalı?"
 wuw_GER_reichskommissariats.9.t:0 "Volga Almanya'sının Statüsü"
 wuw_GER_releasable.1.a:0 "Berlin bariz bir seçim!"
 wuw_GER_releasable.1.b:0 "Münih olmalı"
 wuw_GER_releasable.1.c:0 "Frankfurt iyi bir batı başkenti olur"
 wuw_GER_releasable.1.d:0 "Başkentimiz olduğu gibi iyi"
 wuw_GER_releasable.1.desc:0 "Alman devletinin yeniden kurulmasıyla birlikte, birçok politikacımız başkentimizin yeniden gözden geçirilmesi gerektiğini savundu. 'Alman Halkının Başkenti' gibi unvanlara layık olmadığını iddia ediyorlar. Böyle bir durumda, başkentimizi nereye taşımak istiyoruz?"
 wuw_GER_releasable.1.t:0 "Alman Halkı için bir Başkent"
 wuw_GER_releasable.2.a:0 "Pierre Dupong dümenin başına geçiyor"
 wuw_GER_releasable.2.b:0 "Joseph Bech'e hala ihtiyaç var"
 wuw_GER_releasable.2.c:0 "Bu tehlikeli zamanlarda Kraliyet ailesi harekete geçmeli!"
 wuw_GER_releasable.2.d:0 "Halk böylesine açıkça hileli bir seçimi protesto etmeli!"
 wuw_GER_releasable.2.desc:0 "Seçimin Rietspartei'nin lehine sonuçlanmasıyla birlikte, ulusu yönetmek için en uygun kişiyi seçme zamanı geldi. Parti, Joseph Bech'in diğer önemli konulara zaman ayırmasına olanak tanımak için şimdilik Pierre Dupong'un liderliği devralmasını istiyor. Ancak Avrupa üzerinde kara bulutlar dolaşırken, komşu güçlere yenik düşmemek için siyasi manzaramızda köklü bir değişiklik yapmak akıllıca olabilir..."
 wuw_GER_releasable.2.t:0 "Seçim"
 wuw_GER_the_battle_of_britain.01.a:0 "Bırakın denesin"
 wuw_GER_the_battle_of_britain.01.b:0 "Çok fazla söz veriyor"
 wuw_GER_the_battle_of_britain.01.desc:0 "$GER_hermann_goring$, Luftwaffe'nin üstünlüğünü sergilemek ve [ENG.GetAdjective] halkının moralini kırmak için can atıyor. Bunu Londra'nın ikonik simgesi Big Ben'i bombalayarak yapmayı hedefliyor. Bunun [ENG.GetNameDef]'i dize getireceğini ve savaşı kısaltacağını savunuyor. Ayrıca bu kampanya sırasında Berlin'e tek bir bomba bile düşmeyeceğini şahsen garanti ediyor, yoksa ona Hermann 'Meier' diyebilirsiniz."
 wuw_GER_the_battle_of_britain.01.t:0 "Britanya Savaşı"
 wuw_GER_uncertain_future.01.a:0 "Hızla hareket etmeliyiz!"
 wuw_GER_uncertain_future.01.desc:0 "İç Savaş nihayet sona erdiğinde, ulusu yavaş yavaş yeniden inşa ediyoruz, halk ise istikrar ve güvenlik özlemi çekerken genel bir hedef veya amaç olmaksızın sürüklenme hissi artıyor. Halk bu belirsizlikten bıkıyor ve istikrarlı bir rota talep ediyor."
 wuw_GER_uncertain_future.01.t:0 "$GER_growing_public_dissent_mission$"
 wuw_GER_uncertain_future.02.a:0 "Halk arasında bir rahatsızlık mı var?"
 wuw_GER_uncertain_future.02.desc:0 "İç Savaş nihayet sona erdiğinde, Alman ulusu yavaş yavaş yeniden inşa ediliyor, ancak halkı istikrar ve güvenlik özlemi çekiyor. [ROOT.GetLeader] ilerlemek için hiçbir çaba göstermedi ve yeni Alman devletinin geleceğinin nasıl görünmesi gerektiğine karar vermekte ilgisiz görünüyor. Bu, kırık geçmişinden uzaklaşmaya hevesli olan nüfusta büyük endişeye neden oldu."
 wuw_GER_uncertain_future.02.t:0 "[ROOT.GetNameDefCap] Belirsiz Bir Gelecekle Karşı Karşıya"
 wuw_GER_weltpolitik.1.a:0 "Dostlarımız için her şey"
 wuw_GER_weltpolitik.1.b:0 "Hayır, onlar şimdi bizim"
 wuw_GER_weltpolitik.1.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader] ilginç bir taleple bize başvurdu. Eski [FROM.GetAdjective] sömürge topraklarını, ülkelerimiz arasındaki ilişkilerin derinleştirilmesi ve küresel düzeyde hükümetimize resmi destekleri karşılığında onlara iade etmemizi istiyorlar. Biraz tek taraflı görünüyor, ama belki de en iyisi budur?"
 wuw_GER_weltpolitik.1.t:0 "[FROM.GetName] Eski Sömürge Topraklarının İadesini Talep Ediyor"
 wuw_GER_weltpolitik.10.a:0 "Zorla alacağız"
 wuw_GER_weltpolitik.10.b:0 "Bugün iyi bir gün"
 wuw_GER_weltpolitik.10.desc:0 "Antlaşma resmen imzalandı ve toprak devredilecek. Ancak Kongo'da direniş var, başa çıkılması gereken bir direniş..."
 wuw_GER_weltpolitik.10.t:0 "Kongo Krizi"
 wuw_GER_weltpolitik.11.a:0 "Halkımızın güvenliği için onları yok etmeliyiz!"
 wuw_GER_weltpolitik.11.desc:0 "Kongo'daki valilerimiz, onlar için seçtiğimiz kaderi kabul etmeyeceklerini ve [COG.GetAdjective] özerkliği konusunda kararlı duracaklarını bize bildiriyor. [ENG.GetNameDef] ve [GER.GetNameDef] bunu bizim tarafımızdan bir direniş eylemi olarak görürse, ulusumuzun çöküşü olmasınlar diye direnişlerini ezmek zorunda kalacağız."
 wuw_GER_weltpolitik.11.t:0 "Kongo Krizi"
 wuw_GER_weltpolitik.12.a:0 "Dostlarımız için her şey"
 wuw_GER_weltpolitik.12.b:0 "Hayır, onlar şimdi bizim"
 wuw_GER_weltpolitik.12.desc:0 "\n[FROM.GetNameDef]'in lideri [FROM.GetLeader] ilginç bir taleple bize başvurdu. Eski [FROM.GetAdjective] sömürge topraklarını, ülkelerimiz arasındaki ilişkilerin derinleştirilmesi ve küresel düzeyde hükümetimize resmi destekleri karşılığında onlara iade etmemizi istiyorlar. Biraz tek taraflı görünüyor, ama belki de en iyisi budur?"
 wuw_GER_weltpolitik.12.t:0 "[FROM.GetName] Eski Sömürge Topraklarının İadesini Talep Ediyor"
 wuw_GER_weltpolitik.13.a:0 "Emperyalizm yeniden menüde!"
 wuw_GER_weltpolitik.13.desc:0 "\n[FROM.GetNameDef]'in lideri [FROM.GetLeader], eski sömürgelerimizin iadesi talebimizi kabul etti ve onların bizim elimizde daha iyi olduğunu belirtti. İnsanlar sokaklarda kutlama yapıyor, çünkü [ROOT.GetAdjective] sömürge imparatorluğu nihayet haritaya geri dönmüş gibi görünüyor."
 wuw_GER_weltpolitik.13.t:0 "[FROM.GetNameDefCap] Sömürgelerimizi İade Ediyor"
 wuw_GER_weltpolitik.14.a:0 "Kaderde yokmuş..."
 wuw_GER_weltpolitik.14.desc:0 "\n[FROM.GetNameDef]'in lideri [FROM.GetLeader], eski sömürgelerimizin iadesi talebimizi reddetti ve bunun çok az veya hiçbir şey kazanmayacakları tek taraflı bir anlaşma olduğunu iddia etti."
 wuw_GER_weltpolitik.14.t:0 "[FROM.GetNameDefCap] Sömürgelerimizi İade Etmiyor"
 wuw_GER_weltpolitik.15.a:0 "Bir tür tazminat talep ediyoruz!"
 wuw_GER_weltpolitik.15.desc:0 "\n[FROM.GetNameDef]'in lideri [FROM.GetLeader], şaşırtıcı bir gelişmeyle, bizim elimizde olanlar da dahil olmak üzere tüm eski [GER.GetAdjective] sömürge topraklarını onlara geri devretmeye karar verdi. Maalesef yeni eylemi durdurmak için pek bir şey yapamayız, ama en azından onlardan bir tür tazminat talep edebiliriz."
 wuw_GER_weltpolitik.15.t:0 "[FROM.GetNameDefCap] Toprakları [GER.GetNameDefCap]'e Devrediyor"
 wuw_GER_weltpolitik.16.a:0 "Dünyayı birlikte fethedeceğiz!"
 wuw_GER_weltpolitik.16.b:0 "Asla olmaz!"
 wuw_GER_weltpolitik.16.desc:0 "[FROM.GetNameDefCap] bize bir Nüfuz Alanı kurduklarını bildirdi. Resmi bir anlaşma olmadığı için bizi doğrudan etkilemese de, farkında olmamız gereken bir şey. Bunu bize dayatmaya veya kontrolünü ele geçirirsek bizden toprak talep etmeye çalışabilirler."
 wuw_GER_weltpolitik.16.t:0 "[FROM.GetNameDefCap] Nüfuz Alanları Kuruyor"
 wuw_GER_weltpolitik.17.a:0 "Harika!"
 wuw_GER_weltpolitik.17.desc:0 "[FROM.GetAdjective]lerden, Nüfuz Alanlarımızı kurma fikrini onayladıklarına dair haber aldık. Bu, düşmanlıkları önleyecek ve yakın bölgemizdeki topraklar üzerindeki çatışma riskini azaltacaktır."
 wuw_GER_weltpolitik.17.t:0 "[FROM.GetNameDefCap] Nüfuz Alanları Kurulumunu Kabul Ediyor"
 wuw_GER_weltpolitik.18.a:0 "Ne kadar Kaba!"
 wuw_GER_weltpolitik.18.desc:0 "[FROM.GetAdjective]lerden, nüfuz alanımızı tanımayı ve kabul etmeyi reddedeceklerine dair bir haber aldık, kendi nüfuz alanları için ise kendi nüfuz alanlarını bizim tarafımızdan bir müdahale olmaksızın kendilerinin belirleyeceklerini belirttiler. Bu, bölgede bazı gerilimlere neden olabilir."
 wuw_GER_weltpolitik.18.t:0 "[FROM.GetNameDefCap] Nüfuz Alanları Kurulumunu Reddediyor"
 wuw_GER_weltpolitik.19.a:0 "Kan dökmeye değmez"
 wuw_GER_weltpolitik.19.b:0 "O zaman gel de al!"
 wuw_GER_weltpolitik.19.desc:0 "Pervasız [FROM.GetLeader], son zamanlarda belirttiği gibi, [FROM.GetAdjective] Angola'daki yasadışı işgalimizi kınadı. Şimdi, bir [FROM.GetAdjective] ültimatomu aldık ve birlikleri sınırımızda toplanıyor. Nasıl yanıt vermeliyiz?"
 wuw_GER_weltpolitik.19.t:0 "[FROM.GetNameDefCap] [ANG.GetAdjective] Topraklarımızın Kontrolünü Talep Ediyor"
 wuw_GER_weltpolitik.2.a:0 "Yeni bir Altın Çağ'a hızla yaklaşıyoruz!"
 wuw_GER_weltpolitik.2.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], eski sömürgelerimizin iadesi talebimizi kabul etti ve onların bizim elimizde daha iyi olduğunu belirtti. İnsanlar sokaklarda kutlama yapıyor, çünkü [ROOT.GetAdjective] sömürge imparatorluğu nihayet haritaya geri dönmüş gibi görünüyor."
 wuw_GER_weltpolitik.2.t:0 "[FROM.GetNameDefCap] Sömürgelerimizi İade Ediyor"
 wuw_GER_weltpolitik.20.a:0 "Bu harika bir gün!"
 wuw_GER_weltpolitik.20.desc:0 "[FROM.GetNameDef]'in makul lideri [FROM.GetLeader], Angola'daki topraklarını devretmeyi kabul etti ve birliklerine geri çekilmelerini ve bölgeden çekilmelerini söyledi. Bir kez daha zafer bizim!"
 wuw_GER_weltpolitik.20.t:0 "[FROM.GetNameDefCap] [ANG.GetAdjective] Topraklarını devrediyor"
 wuw_GER_weltpolitik.21.a:0 "Kararlarından pişman olacaklar!"
 wuw_GER_weltpolitik.21.b:0 "Bunu bırakmalıyız"
 wuw_GER_weltpolitik.21.desc:0 "Tamamen beklenmedik olmasa da, [FROM.GetNameDef]'in aptal lideri [FROM.GetLeader], ültimatomumuzu aldıktan sonra ülkenin birliklerini yüksek alarma geçirdi ve anlaşmazlık konusunda tek bir adım bile geri atmayacaklarını belirten bir elçi gönderdi."
 wuw_GER_weltpolitik.21.t:0 "[FROM.GetNameDefCap] Angola'da Kararlı Duruyor"
 wuw_GER_weltpolitik.3.a:0 "Kaderde yokmuş..."
 wuw_GER_weltpolitik.3.desc:0 "\n[FROM.GetNameDef]'in lideri [FROM.GetLeader], eski sömürgelerimizin iadesi talebimizi reddetti ve bunun çok az veya hiçbir şey kazanmayacakları tek taraflı bir anlaşma olduğunu iddia etti."
 wuw_GER_weltpolitik.3.t:0 "[FROM.GetNameDefCap] Sömürgelerimizi İade Etmiyor"
 wuw_GER_weltpolitik.4.a:0 "Bu karşılıklı yarar sağlayan bir anlaşma"
 wuw_GER_weltpolitik.4.b:0 "Bu saldırganlığa sponsor olmayacağız"
 wuw_GER_weltpolitik.4.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], Versay tarafından soyulmuş hissettikleri için kayıp [FROM.GetAdjective] sömürgeleri meselesiyle ilgili olarak bize başvurdu. Şimdi, Kongo'yu nüfuz alanlarına bölmek için [GER.GetAdjective] ulusuyla bir pakt imzalamamızı ve bunun yapılması için ortak bir talep göndermemizi talep ediyorlar. Onlara boyun eğip böyle bir pakt imzalamalı mıyız?"
 wuw_GER_weltpolitik.4.t:0 "[FROM.GetLeader] Kongo'yu Bölmek İstiyor"
 wuw_GER_weltpolitik.5.a:0 "Maalesef bu konuda yapılabilecek pek bir şey yok"
 wuw_GER_weltpolitik.5.b:0 "Bunu kabul edemeyiz"
 wuw_GER_weltpolitik.5.desc:0 "[GER.GetLeader] ile birlikte ortak bir açıklamada, [FROM.GetNameDef]'in lideri [FROM.GetLeader], temsil ettikleri iki devlete Kongo'yu teslim etmemizi talep ederek bize başvurdu. Bu konuda onlarla savaşmalı mıyız, yoksa basitçe boyun eğip Kongo'yu onlara mı teslim etmeliyiz?"
 wuw_GER_weltpolitik.5.t:0 "[FROM.GetLeader] Kongo'yu Teslim Etmemizi Talep Ediyor"
 wuw_GER_weltpolitik.6.a:0 "Bu durumda hepsi bizim olacak!"
 wuw_GER_weltpolitik.6.b:0 "Daha fazla zorlamamalıyız"
 wuw_GER_weltpolitik.6.desc:0 "[FROM.GetLeader], [FROM.GetLeader.GetSheHe]'nin, bizimle hiçbir bağlantısı olmayan bir devlet olan Kongo'yu birlikte parçalama yönündeki tuhaf fikirlerimizi desteklemeyeceğini söylediğini belirtti. [FROM.GetLeader.GetSheHe] ayrıca, bu sözleriyle [FROM.GetNameDef]'in tüm cesur vatandaşlarının arkasında durduğunu da ekledi. Görünüşe göre karar kesin."
 wuw_GER_weltpolitik.6.t:0 "[FROM.GetLeader] Anlaşmayı Reddediyor"
 wuw_GER_weltpolitik.7.a:0 "Buna karşı savaşamayız..."
 wuw_GER_weltpolitik.7.b:0 "Bunu kabul edemeyiz, silaha sarılın!"
 wuw_GER_weltpolitik.7.desc:0 "[BEL.GetNameDef]'in lideri [BEL.GetLeader], ortak [GER.GetAdjective] ve [ENG.GetAdjective] taleplerine boyun eğdi ve ulusumuzu aralarında bölünmek üzere imzalamaya karar verdi, bu da şu anda sahip olabileceğimiz her türlü bağımsızlığı etkin bir şekilde sona erdirecektir. Gerçekten sadece yatıp böyle bir kaderi kabul etmeli miyiz?"
 wuw_GER_weltpolitik.7.t:0 "[BEL.GetNameDefCap] Özgürlüğümüzden Vazgeçmeyi Planlıyor"
 wuw_GER_weltpolitik.8.a:0 "Mükemmel"
 wuw_GER_weltpolitik.8.desc:0 "[BEL.GetNameDef]'in lideri [BEL.GetLeader], taleplerimize boyun eğdi ve Kongo'nun derhal yürürlüğe girecek şekilde bize devredileceğini belirtti. Kongo'daki halkın ve valilerin bunu kabul edip etmeyeceği hala kesin değil, ama en azından [BEL.GetAdjective]ler boyun eğdi."
 wuw_GER_weltpolitik.8.t:0 "[BEL.GetNameDefCap] Kongo'dan vazgeçecek"
 wuw_GER_weltpolitik.9.a:0 "O zaman yok edilecekler"
 wuw_GER_weltpolitik.9.b:0 "O zaman zorlamaya gerek yok"
 wuw_GER_weltpolitik.9.desc:0 "[BEL.GetNameDef]'in lideri [BEL.GetLeader], taleplerimize karşı kararlı bir şekilde durmaya karar verdi ve [BEL.GetAdjective] ordusunun muhalefet karşısında geri adım atmayacağını ve Kongo için son adama kadar savaşacağını belirtti. Kiminle uğraştıklarını bilmiyorlar."
 wuw_GER_weltpolitik.9.t:0 "[BEL.GetNameDefCap] Kongo'dan vazgeçmeyi reddediyor"
 wuw_HUN_news_events.1.a:0 "Bir şeyler için hazırlanıyorlar..."
 wuw_HUN_news_events.1.b:0 "Bu geleceğimizi güvence altına alacak!"
 wuw_HUN_news_events.1.d:0 "\n[HUN.GetLeader] yönetimindeki [HUN.GetAdjective] hükümeti, ulusu mümkün olan en kısa sürede verimli bir şekilde yeniden silahlandırmak amacıyla yeni bir büyük ölçekli sanayi programı duyurdu. Yabancı gözlemciler bunu [HUN.GetNameDef] tarafından komşularına karşı bir saldırganlık eylemi olarak görüyorlar, ancak gerçek niyetlerinin ne olduğunu sadece zaman gösterecek."
 wuw_HUN_news_events.1.t:0 "[HUN.GetNameDEFCAP] Győri Programını Duyurdu"
 wuw_HUN_news_events.2.a:0 "Bu nasıl sonuçlanacak?"
 wuw_HUN_news_events.2.b:0 "Daha büyük bir gelecek için!"
 wuw_HUN_news_events.2.c:0 "Faydalı bir piyon olacaklar"
 wuw_HUN_news_events.2.d:0 "Yeni bir karşılıklı yardım ve ilgili ulusal hedeflerin ilerletilmesi paktını imzaladıktan sonra, [GER.GetLeader] ve [HUN.GetLeader] bugün [HUN.GetNameDef]'in [GER.GetAdjective] ittifakına katıldığını duyurdu."
 wuw_HUN_news_events.2.t:0 "[HUN.GetNameDefCap] [GER.GetAdjective]lere Katılıyor"
 wuw_HUN_news_events.3.a:0 "Çok endişe verici"
 wuw_HUN_news_events.3.b:0 "Geçmişteki şanımızı geri alacağız!"
 wuw_HUN_news_events.3.c:0 "Mirasımızı devam ettiriyorlar"
 wuw_HUN_news_events.3.desc:0 "\nYakın sahasında geçerli ittifak seçenekleri olmayan [HUN.GetNameDef], bir kez daha İttifak Devletleri'ni yeniden kurmaya yöneldi. Üzerlerine konulan antlaşmalardan kurtulan ülke, hızla yeniden askerileşmeye yöneldi. Bu yeni ittifaklarının Büyük Savaş'taki adaşı gibi olup olmayacağı henüz belli değil."
 wuw_HUN_news_events.3.t:0 "[HUN.GetNameDefCap] İttifak Devletleri'ni Yeniden Kuruyor"
 wuw_HUN_news_events.4.a:0 "Yok edilmeleri gerekiyor!"
 wuw_HUN_news_events.4.b:0 "Dünya bizim avcumuzun içinde!"
 wuw_HUN_news_events.4.desc:0 "[HUN.GetNameDef]'den [HUN.GetLeader], ulusun küreyi domine etme ve tüm kıtalarda bir [HUN.GetAdjective] hegemonyası kurma hedeflerini duyurdu. Bunun Apostolik Krallık halkının doğum hakkı olduğunu ve bir daha asla yabancı güçlere boyun eğmeyeceklerini iddia ediyorlar."
 wuw_HUN_news_events.4.t:0 "[HUN.GetNameDefCap] Küresel Hakimiyet İlan Ediyor"
 wuw_HUN_news_events.5.a:0 "Nihayet bir kral!"
 wuw_HUN_news_events.5.b:0 "Yeni bir düşman yükseliyor"
 wuw_HUN_news_events.5.c:0 "Potansiyel bir müttefik mi?"
 wuw_HUN_news_events.5.desc:0 "Ulusları için bir Kral arayan [HUN.GetAdjective]ler, uzun müzakereler ve hazırlıklardan sonra, bu hafta başında [HUN.GetLeader]'i resmen taçlandırdılar. Bugün, büyük bir şenlik ve kutlama eşliğinde, Budapeşte'deki Kraliyet Sarayı'nda görkemli bir törenle Macaristan Kralı olarak taç giydi."
 wuw_HUN_news_events.5.t:0 "[HUN.GetLeader] Macar Tacını Devralıyor"
 wuw_HUN_news_events.6.a:0 "Nihayet bir kral!"
 wuw_HUN_news_events.6.b:0 "Yeni bir düşman yükseliyor"
 wuw_HUN_news_events.6.c:0 "Potansiyel bir müttefik mi?"
 wuw_HUN_news_events.6.desc:0 "Ulusları için bir Kral arayan [HUN.GetAdjective]ler, uzun müzakereler ve hazırlıklardan sonra, bu hafta başında Macaristan'ın son Palatini, Avusturya Arşidükü ve Macaristan ve Bohemya Prensi, aynı zamanda eski Avusturya-Macaristan ordusunun Feldmarschall'ı olan Joseph August von Habsburg'u resmen taçlandırdılar. Bugün, büyük bir şenlik ve kutlama eşliğinde, Budapeşte'deki Kraliyet Sarayı'nda görkemli bir törenle Macaristan Kralı olarak taç giydi.\nBir Vitez ve bir Habsburg aristokratı olan yeni Kral'ın ideolojik eğilimleri açıktır ve şimdiden 'Avusturya-Macaristan İmparatorluğu'nu dağıtan antlaşmaları bozmadan Macaristan'a hak ettiği büyüklüğü getireceğini' ilan etti. Kral'ın 'geçmişte bize yapılan adaletsizlikleri geri alma' vaadiyle birlikte, bu taç giyme töreninin bölgedeki gerilimlerin azalmasına yol açması olası değildir."
 wuw_HUN_news_events.6.t:0 "Joseph August Macar Tacını Devralıyor"
 wuw_HUN_news_events.7.a:0 "Dünya işçileri, birleşin!"
 wuw_HUN_news_events.7.b:0 "Tanrı aşkına ne planlıyorlar?"
 wuw_HUN_news_events.7.c:0 "Revizyonist Pozcular..."
 wuw_HUN_news_events.7.desc:0 "Bugün, Macaristan Merkez Yürütme Konseyi Başkanı Béla Kun, daha önce Ağustos 1919'da aniden sona eren Macaristan'daki Sosyalist Federatif Konseyler Cumhuriyeti'nin yeniden kurulduğunu duyurdu. Geçmişte karşı-devrimciler ve Küçük İtilaf'ın birleşik gücü tarafından ezilmiş olmasına rağmen, Béla Kun bu sefer farklı olacağını belirtti. Önümüzdeki yıllarda Balkanlar'ı ne bekliyor?"
 wuw_HUN_news_events.7.t:0 "Macar Sovyet Cumhuriyeti'nin Restorasyonu"
 wuw_HUN_news_events.8.a:0 "Nihayet!"
 wuw_HUN_news_events.8.b:0 "Barış hiçbir zaman bir seçenek olmadı..."
 wuw_HUN_news_events.8.c:0 "Kesinlikle bir sürpriz, ama hoş bir sürpriz"
 wuw_HUN_news_events.8.desc:0 "Bugün, Macaristan Genel Sekreteri Mátyás Rákosi, yeni bir Macaristan Halk Cumhuriyeti'nin kurulduğunu ilan etti ve ulusun [SOV.GetNameDef] ile işbirliğini artırmak istediğini duyurdu. Ulusun açık bir demokrasi olduğunu ilan etmiş olsa da, ulusun diktatörlük yönetimi fark edilmeyecek gibi değil. Macar halkının geleceği ne olacak?"
 wuw_HUN_news_events.8.t:0 "Macaristan Halk Cumhuriyeti'nin İlanı"
 wuw_HUN_news_events.9.a:0 "Doğru ellere geri döndü"
 wuw_HUN_news_events.9.b:0 "Onların değil!"
 wuw_HUN_news_events.9.c:0 "İlginç Bir Gelişme"
 wuw_HUN_news_events.9.desc:0 "Bu hafta başında, [HUN.GetAdjective] kuvvetleri Eisenstadt'a girerek bölgeyi işgal etti. Bunun, bölgedeki [HUN.GetAdjective] halkını korumak için bir eylem olduğunu iddia ediyorlar, ki bu halk yakın zamanda Trianon sonrası bölgenin onlara göre yasadışı işgalini protesto etmek için sokaklara dökülmüştü. Bu belki de Balkanlar'da yeni bir savaşa yol açacak mı, yoksa sadece hafif bir sınır düzenlemesi mi olacak?"
 wuw_HUN_news_events.9.t:0 "[HUN.GetNameDefCap] Burgenland'ı İşgal Ediyor"
 ww_BEL_event_diplomatic.1.a:0 "Bırakın tek başlarına ilerlesinler"
 ww_BEL_event_diplomatic.1.desc:0 "[FROM.GetLeader], bu sıkıntılı zamanlarda tarafsız bir yaklaşım aradıkları için ülkelerimiz arasındaki karşılıklı savunma antlaşmasının geçersiz olduğunu bize bildirdi. Ancak bu, Büyük Savaş sırasında onlar için pek işe yaramamıştı...."
 ww_BEL_event_diplomatic.1.t:0 "[FROM.GetNameDefCap] Garantilerimizi Reddediyor"
 ww_BEL_event_diplomatic.10.a:0 "Haklı toprağımız geri alındı!"
 ww_BEL_event_diplomatic.10.desc:0 "Paris'teki heyetimizden, [FRA.GetName]'in teklifimizi kabul etmeyi seçtiğine ve Calais ve çevresindeki toprakların idaresini bize devretme sürecinin şimdiden başladığına dair haber aldık!"
 ww_BEL_event_diplomatic.10.t:0 "Fransa Kabul Etti!"
 ww_BEL_event_diplomatic.11.a:0 "Uçurumdan geri adım at."
 ww_BEL_event_diplomatic.11.b:0 "O zaman savaşı seçtiler!"
 ww_BEL_event_diplomatic.11.desc:0 "Paris'teki heyetimiz, Calais için yapılan müzakerelerin kesildiğini ve haklı olarak bizim olan bu toprağı güvence altına almak için zor kullanmamız gerekebileceğini bildirdi. Tekliflerimizde makul olmaya çalıştık, ancak her adımda bizi geri çevirdiler. Onlara [BEL.GetAdjective] askeri gücünün gerçek kuvvetini gösterme zamanı geldi."
 ww_BEL_event_diplomatic.11.t:0 "Calais Üzerindeki Gerilim Artıyor"
 ww_BEL_event_diplomatic.12.a:0 "Yardımımızı alacaklar!"
 ww_BEL_event_diplomatic.12.b:0 "Onlara yardım edemeyiz"
 ww_BEL_event_diplomatic.12.desc:0 "[FROM.GetAdjective] liderliğinden bir iletişim az önce elimize ulaştı. Dünya etraflarında giderek daha düşmanca hale geldikçe, ülkelerini koruma yetenekleri konusunda endişeler taşıyorlar. Yardımımız çok makbule geçecek ve bölgede barışı korumak için ayrılmaz bir parça olacaktır."
 ww_BEL_event_diplomatic.12.t:0 "[FROM.GetNameDefCap] Yardımımızı Talep Ediyor"
 ww_BEL_event_diplomatic.13.a:0 "Bu bizi güvende tutacak"
 ww_BEL_event_diplomatic.13.desc:0 "[FROM.GetAdjective] diplomatlarından en harika haberleri aldık. Güvenliğimizin tehdit altında olabileceğini ve ordumuzun bağımsızlığımızı korumak için yeterli olmayabileceğini kabul ediyorlar. Bu konuda bize talep ettiğimiz garantiyi teklif ettiler."
 ww_BEL_event_diplomatic.13.t:0 "[FROM.GetNameDefCap] Bağımsızlığımızı Garanti Ediyor"
 ww_BEL_event_diplomatic.14.a:0 "Ne kadar kaba bir davranış!"
 ww_BEL_event_diplomatic.14.desc:0 "Varlığımıza yönelik bariz tehditlere rağmen [FROM.GetAdjective] liderliği garanti talebimizi reddetti. Onlarla mantık çerçevesinde konuşmaya çalıştık ama durumun ciddiyetini görmeyi reddediyorlar. Görünüşe göre kendi başımızın çaresine bakmak zorunda kalacağız."
 ww_BEL_event_diplomatic.14.t:0 "[FROM.GetNameDefCap] Bize Garanti Vermeyi Reddediyor"
 ww_BEL_event_diplomatic.15.a:0 "Onlara $infantry_equipment$ göndereceğiz!"
 ww_BEL_event_diplomatic.15.b:0 "Hırsları asil ama yardım edemeyiz"
 ww_BEL_event_diplomatic.15.c:0 "Onlara $support_equipment$ göndereceğiz!"
 ww_BEL_event_diplomatic.15.desc:0 "Sürgündeki [FROM.GetAdjective] liderliğinden bir talep az önce elimize ulaştı. Bir noktada anavatanlarını geri alabilecekleri umuduyla hala sahip oldukları birlikleri eğitmek için bizden biraz teçhizat istiyorlar."
 ww_BEL_event_diplomatic.15.t:0 "[FROM.GetNameDefCap] Teçhizat Talep Ediyor"
 ww_BEL_event_diplomatic.16.a:0 "Elbette yardım edeceğiz"
 ww_BEL_event_diplomatic.16.b:0 "Yardım edecek kapasitemiz yok"
 ww_BEL_event_diplomatic.16.desc:0 "[FROM.GetAdjective] liderliğinden, kalan birlikleri için teçhizat üretmek üzere fabrikalarımızı kullanma talebi aldık. Anavatanlarını geri alma arzusu içindeler ve bunun için birliklerinin teçhizata ihtiyacı olacak."
 ww_BEL_event_diplomatic.16.t:0 "[FROM.GetNameDefCap] Fabrika Talep Ediyor"
 ww_BEL_event_diplomatic.17.a:0 "Harika bir fikir!"
 ww_BEL_event_diplomatic.17.b:0 "Zamana değmez"
 ww_BEL_event_diplomatic.17.desc:0 "[FROM.GetNameDef]'in sürgündeki hükümeti, ordularımız arasında askeri deneyim paylaşımı için ortak bir çaba önermek üzere bize ulaştı. Bu, onlara olduğu kadar bize de fayda sağlayabilir."
 ww_BEL_event_diplomatic.17.t:0 "[FROM.GetNameDefCap] Askeri Deneyim Paylaşımı Öneriyor"
 ww_BEL_event_diplomatic.18.a:0 "Harika haber!"
 ww_BEL_event_diplomatic.18.desc:0 "Konumumuzu güçlendirme ve anavatanı geri almak için ordumuzu yeniden inşa etmeye yardımcı olma yönündeki önerdiğimiz çabalar [FROM.GetNameDef] tarafından onaylandı. Bu tek başına sorunlarımızı çözemese de, nihayet bağımsızlığımızı yeniden kazanmamız için büyük bir basamak olacaktır."
 ww_BEL_event_diplomatic.18.t:0 "[FROM.GetNameDefCap] Kabul Ediyor"
 ww_BEL_event_diplomatic.19.a:0 "Talihsizlik"
 ww_BEL_event_diplomatic.19.desc:0 "Konumumuzu güçlendirme ve anavatanı geri almak için ordumuzu yeniden inşa etmeye yardımcı olma yönündeki önerdiğimiz çabalar [FROM.GetNameDef] tarafından reddedildi. Bunun gelecek için bir basamak olacağını ummuştuk, ancak görünüşe göre bu planlar boşa çıktı."
 ww_BEL_event_diplomatic.19.t:0 "[FROM.GetNameDefCap] Reddediyor"
 ww_BEL_event_diplomatic.2.a:0 "Birlikte daha güçlüyüz."
 ww_BEL_event_diplomatic.2.b:0 "Lüksemburg gururlu ve bağımsız bir ulustur!"
 ww_BEL_event_diplomatic.2.desc:0 "[FROM.GetLeader], ulusumuza ilhakımızı güvence altına alma çabasıyla geçmişin bağlarına ve ortak mirasımıza ve dilimize başvurdu."
 ww_BEL_event_diplomatic.2.t:0 "[FROM.GetNameDefCap] İlhakımızı Talep Ediyor"
 ww_BEL_event_diplomatic.20.a:0 "Harika bir girişim!"
 ww_BEL_event_diplomatic.20.b:0 "Bu şüpheli görünüyor..."
 ww_BEL_event_diplomatic.20.desc:0 "[FROM.GetNameDef]'den [FROM.GetFactionName]'e katılmak için resmi bir davet aldık. Bu, bölge içinde işbirliğini teşvik etmek için yeni girişimleridir, umutları bu girişimin bölgeyi istikrara kavuşturması ve daha iyi diplomatik ilişkileri teşvik etmesidir."
 ww_BEL_event_diplomatic.20.t:0 "[FROM.GetNameDefCap] Bizi bir Avrupa İşbirliği Projesine Davet Ediyor"
 ww_BEL_event_diplomatic.21.a:0 "Harika Haber!"
 ww_BEL_event_diplomatic.21.desc:0 "[FROM.GetNameDef]'e davetimiz onaylandı. Daha büyük bir Avrupa topluluğunun doğru yol olduğu konusunda hemfikirler. Ortak çabayla bölgeyi bir kez daha istikrara kavuşturabileceğiz."
 ww_BEL_event_diplomatic.21.t:0 "[FROM.GetNameDefCap] [ROOT.GetFactionName]'e Katılıyor"
 ww_BEL_event_diplomatic.22.a:0 "Yazık, gerçekten..."
 ww_BEL_event_diplomatic.22.desc:0 "[FROM.GetAdjective] diplomatları bize hayal kırıklığı yaratan bir cevapla geri döndüler. Fikrin asil olabileceğini, ancak bizden önceki benzer girişimler gibi kaçınılmaz olarak başarısız olacağını iddia ediyorlar."
 ww_BEL_event_diplomatic.22.t:0 "[FROM.GetNameDefCap] [ROOT.GetFactionName]'e Davetimizi Reddediyor"
 ww_BEL_event_diplomatic.23.a:0 "Elbette, katılacağız"
 ww_BEL_event_diplomatic.23.b:0 "Kendi teknolojimiz kendimize kalacak"
 ww_BEL_event_diplomatic.23.desc:0 "Bir [FROM.GetAdjective] heyeti, [FROM.GetFactionName] çapında bir araştırma çabası önermek için bize başvurdu. Yakın müttefikler olarak, Birlik'teki herkesi ilerletmek için teknolojilerimizi kendi aramızda paylaşmalıyız."
 ww_BEL_event_diplomatic.23.t:0 "[FROM.GetNameDefCap] Bizi Araştırma Çabalarına Davet Ediyor"
 ww_BEL_event_diplomatic.24.a:0 "Mükemmel!"
 ww_BEL_event_diplomatic.24.desc:0 "Müttefiklerimiz arasında teknoloji paylaşımı için bir mekan oluşturma girişimimiz [FROM.GetNameDef] tarafından onaylandı. Çabaya katıldılar ve teknolojik ilerlemelerini bizimle ve ortak müttefiklerimizle paylaşacaklar, tıpkı bizim de kendimizinkini onlarla paylaşacağımız gibi."
 ww_BEL_event_diplomatic.24.t:0 "[FROM.GetNameDefCap] Avrupa Birliği Araştırma Grubuna Katılıyor"
 ww_BEL_event_diplomatic.25.a:0 "Neyse..."
 ww_BEL_event_diplomatic.25.desc:0 "Avrupa Birliği Araştırma Grubu için [FROM.GetNameDef]'e sağlam bir gerekçe sunduğumuzu düşünsek de, girişime katılmayı reddettiler. Girişimden hala kâr elde edebileceğimizi umuyoruz, ancak bu [FROM.GetNameDef] olmadan olmak zorunda kalacak."
 ww_BEL_event_diplomatic.25.t:0 "[FROM.GetNameDefCap] Avrupa Birliği Araştırma Grubuna Katılmayı Reddediyor"
 ww_BEL_event_diplomatic.26.a:0 "[FROM.GetFactionName]'in iyiliği için"
 ww_BEL_event_diplomatic.26.b:0 "Hayır, egemenliğimizi düşünmeliyiz!"
 ww_BEL_event_diplomatic.26.b_tt:0 "§RBizi ittifaktan atabilirler!§!"
 ww_BEL_event_diplomatic.26.desc:0 "[FROM.GetNameDef]'den bir talep aldık. [ROOT.GetFactionName]'in başkanı olarak, daha federal bir Avrupa'nın bloğun savunma ve ticari çabalarını artıracağı sonucuna vardılar ve bu çabaya katılmamızı talep ettiler."
 ww_BEL_event_diplomatic.26.t:0 "[FROM.GetNameDefCap] Sınırlı Federalleşme Talep Ediyor"
 ww_BEL_event_diplomatic.27.a:0 "Harika!"
 ww_BEL_event_diplomatic.27.desc:0 "[FROM.GetNameDefCap], kendilerini [FROM.GetFactionName]'e daha yakından bağlama talebimizi onayladı. Dış politikaları üzerinde bazı yetkilere sahip olmamıza izin verilecek ve aramızdaki ticaret basitleştirilecek."
 ww_BEL_event_diplomatic.27.t:0 "[FROM.GetNameDefCap] Sınırlı Federalleşmeye İzin Veriyor"
 ww_BEL_event_diplomatic.28.a:0 "Bu çok endişe verici"
 ww_BEL_event_diplomatic.28.b:0 "Hepimiz için bir risk oluşturuyorlar!"
 ww_BEL_event_diplomatic.28.desc:0 "Bariz avantajlara rağmen [FROM.GetNameDef], federal Avrupa fikrimize katılmamayı seçti. Kendi egemenliklerinin tüm $EU_tech_sharing_group_name$ refahının üzerinde olduğunu iddia ediyorlar ki bu, birlik içinden gelen oldukça endişe verici bir duygu."
 ww_BEL_event_diplomatic.28.t:0 "[FROM.GetNameDefCap] Sınırlı Federalleşmeyi Reddediyor"
 ww_BEL_event_diplomatic.29.a:0 "Onu yanımızda görmekten onur duyarız"
 ww_BEL_event_diplomatic.29.b:0 "Habsburglar geçmişte kaldı."
 ww_BEL_event_diplomatic.29.desc:0 "Duymaktan biraz şaşırdığımız bir kişiden bir destek teklifi aldık. Otto von Habsburg, Avusturya İmparatoru, Macaristan Kralı ve Hırvatistan Kralı I. Charles'ın varisi olabilir, ancak görünüşe göre babasının aksine, Otto Avrupa içinde işbirliğine çok daha eğilimli. Çabalarımızı selamlıyor ve diplomatik tarafta yardımını sunuyor, geniş diplomatik ağı bizim için bir kazanım olabilir ve bu, bize memnuniyetle sunacağı bir yardımdır."
 ww_BEL_event_diplomatic.29.t:0 "Otto von Habsburg Desteğini Sunuyor"
 ww_BEL_event_diplomatic.3.a:0 "Harika"
 ww_BEL_event_diplomatic.3.desc:0 "Mükemmel haberler aldık! [FROM.GetNameDefCap] halkı, akıllıca bir şekilde birlikte daha güçlü olduğumuzu belirledi ve bu bölgenin yeni idaresini görmek için zaten düzenlemeler yapılıyor."
 ww_BEL_event_diplomatic.3.t:0 "[FROM.GetNameDefCap] Teslim Oluyor"
 ww_BEL_event_diplomatic.30.a:0 "Burada hoş karşılanırlar"
 ww_BEL_event_diplomatic.30.b:0 "Onlara ihtiyacımız yok"
 ww_BEL_event_diplomatic.30.desc:0 "[FROM.GetAdjective] tarafsızlık arzularını ortadan kaldırma kararının ardından, [FROM.GetNameDef] liderliği siyasi gündemimizle çok daha yakından hizalandı. Şimdi [ROOT.GetFactionName] ittifakına resmen katılma talebiyle bize ulaştılar. Yardımları yararlı olabilir ve gelecekteki genişlememiz için yeni stratejiler belirlememize olanak tanıyabilir."
 ww_BEL_event_diplomatic.30.t:0 "[FROM.GetNameDefCap] [ROOT.GetFactionName]'e katılmayı talep ediyor"
 ww_BEL_event_diplomatic.31.a:0 "Harika Haber"
 ww_BEL_event_diplomatic.31.desc:0 "[FROM.GetAdjective] lideri [FROM.GetLeader], bizi [FROM.GetFactionName]'e kabul etmek için ulaştı. Bundan sonra ortak tehditlere karşı omuz omuza savaşacağız. Tarafsızlık zamanımız geçti!"
 ww_BEL_event_diplomatic.31.t:0 "[FROM.GetNameDefCap] Bizi [FROM.GetFactionName]'e Kabul Ediyor"
 ww_BEL_event_diplomatic.32.a:0 "Daha iyisini yaratabiliriz!"
 ww_BEL_event_diplomatic.32.desc:0 "Bariz faydalara rağmen [FROM.GetAdjective] lideri [FROM.GetLeader], bizi [FROM.GetFactionName]'in bir üyesi olarak reddetti. Masaya çok şey getirebilirdik, ancak bu yanıtı göz önünde bulundurarak onlara katılma hedeflerimizi hem şimdi hem de gelecekte yeniden gözden geçirmeliyiz."
 ww_BEL_event_diplomatic.32.t:0 "[FROM.GetNameDefCap] Bize [FROM.GetFactionName]'e Üyeliği Reddediyor"
 ww_BEL_event_diplomatic.33.a:0 "Zincirleri kırmalı ve hazırlanmalıyız!"
 ww_BEL_event_diplomatic.33.b:0 "Tarafsızlık korunmalıdır!"
 ww_BEL_event_diplomatic.33.desc:0 "Tarafsızlık ülkemize çok iyi hizmet etti, ancak tarafsız kalmak başkalarının bizi pasif bir seyirci ve hedef olarak görmesine neden olabilir. Dış politikamızın geleceğini ve silahlı mücadeleye ilişkin duruşumuzu dikkatlice düşünmeliyiz, çünkü çatışma yakın gelecekte bize ulaşabilir gibi görünüyor."
 ww_BEL_event_diplomatic.33.t:0 "[ROOT.GetAdjective] Tarafsızlığının Geleceği"
 ww_BEL_event_diplomatic.34.a:0 "[FRA.GetAdjective]ler dostumuzdur"
 ww_BEL_event_diplomatic.34.b:0 "[FRA.GetAdjective]lere güvenilemez!"
 ww_BEL_event_diplomatic.34.desc:0 "Ne kadar iyi silahlanmış olursak olalım, Güney komşumuzun muhtemelen her zaman bizden daha fazla kapasiteye sahip olacağı gerçeğiyle yüzleşmeliyiz. Bir anlaşmaya varmalıyız, onları bir dost olarak mı yoksa bir düşman olarak mı görüyoruz?"
 ww_BEL_event_diplomatic.34.t:0 "[FRA.GetNameDefCap]: Dost mu Düşman mı?"
 ww_BEL_event_diplomatic.35.a:0 "Elbette!"
 ww_BEL_event_diplomatic.35.b:0 "Hayır, bunun faydasını görmüyoruz."
 ww_BEL_event_diplomatic.35.desc:0 "Kuzey komşumuz tarafından bizimle temasa geçildi. Bizimle daha ciddi diplomatik ilişkiler kurmak istiyorlar. Teklifleri her ikimiz için de faydalı olabilecek bir teklif, ancak bu konuda doğru seçimi yaptığımızdan emin olmalıyız."
 ww_BEL_event_diplomatic.35.t:0 "[FROM.GetNameDefCap] Bize Ulaşıyor"
 ww_BEL_event_diplomatic.36.a:0 "Harika!"
 ww_BEL_event_diplomatic.36.desc:0 "[FROM.GetNameDef] liderliği, diplomatik ilişkimizi derinleştirmenin her ikimize de fayda sağlayabileceği konusunda hemfikir. Bu giderek daha düşmanca olan dünyada onlara dostlarımız ve müttefiklerimiz olarak güvenebiliriz."
 ww_BEL_event_diplomatic.36.t:0 "[FROM.GetAdjective] Kabul Ediyor"
 ww_BEL_event_diplomatic.37.a:0 "Yazık..."
 ww_BEL_event_diplomatic.37.desc:0 "Her ikimiz için de bariz faydalarına rağmen, görünüşe göre [FROM.GetAdjective]ler, zaten yaptıkları dışında bizimle diplomatik ilişkiler kurmaya istekli değiller. Bu konuda büyük umutlarımız vardı, ama görünüşe göre paylaşılmamışlar."
 ww_BEL_event_diplomatic.37.t:0 "[FROM.GetAdjective] Kabul Etmiyor"
 ww_BEL_event_diplomatic.38.a:0 "Birliğin faydalarını görüyoruz."
 ww_BEL_event_diplomatic.38.desc:0 "Bir [FROM.GetAdjective] heyeti, imzalanmış sözleşmeler ve yüklü bir sermayeyle geldi. [FROM.GetFactionName] tarafından karşılanacak yatırımlarla ülkemizin merkezinde sivil sanayi tesisleri ve bir silah fabrikası kurulacak. Çekleri imzalayanlar bunun karşılığında ne beklediklerini açıkça söyledi: [FROM.GetNameDef] federal bir Avrupa konusunu bir sonraki kez gündeme getirdiğinde önerilerine kulak vermemizi istiyorlar."
 ww_BEL_event_diplomatic.38.t:0 "[FROM.GetNameDefCap] Sanayimize Yatırım Yapıyor"
 ww_BEL_event_diplomatic.4.a:0 "Yanlış seçimi yaptılar"
 ww_BEL_event_diplomatic.4.desc:0 "Ne yazık ki, [FROM.GetNameDefCap] halkının kendi egemen güçleri hakkında abartılı bir algısı var gibi görünüyor ve nazik birleşme teklifimizi reddetmeyi seçtiler. Onlara ulusumuzun gücünü göstermemiz ve onları zorla birliğimize katmamız gerekecek."
 ww_BEL_event_diplomatic.4.t:0 "[FROM.GetNameDefCap] Direniyor!"
 ww_BEL_event_diplomatic.5.a:0 "Savaşla tehdit et."
 ww_BEL_event_diplomatic.5.b:0 "Calais karşılığında Kongo."
 ww_BEL_event_diplomatic.5.c:0 "Mali tazminat sağla."
 ww_BEL_event_diplomatic.5.d:0 "Karşılığında bir ittifak teklif et."
 ww_BEL_event_diplomatic.5.desc:0 "Fransa'dan Calais'yi talep etmeye karar verdik, ancak yine de onu nasıl alacağımızı seçmeliyiz. Elbette, kudretli ordularımız bu toprağı sorunsuz bir şekilde alabilir, ancak olası tali hasar olasılığını göz önünde bulundurmalı ve belki de alternatif bir edinim yöntemi izlemeliyiz. Birleşme şekli bizim için önemli değil, yeter ki haklı olarak bizim olanı alalım!"
 ww_BEL_event_diplomatic.5.t:0 "Calais'yi Nasıl Almalıyız?"
 ww_BEL_event_diplomatic.6.a:0 "Sacre Bleu! Hayır!"
 ww_BEL_event_diplomatic.6.b:0 "Şu anda başka bir düşmanı kaldıramayız."
 ww_BEL_event_diplomatic.6.desc:0 "[BEL.GetName]'den onlara Calais'yi vermemiz için küstahça bir talep aldık! Bu toprağın, bir tür miras iddia ettikleri tarihi Burgonya Dükalığı nedeniyle haklı olarak Belçika'nın bir parçası olduğunu iddia ediyorlar. Büyükelçileri, taleplerine boyun eğmezsek şiddet tehditleri konusunda oldukça netti, ancak askeri güçlerini bildiğimizden bu büyük olasılıkla bir blöf."
 ww_BEL_event_diplomatic.6.t:0 "Belçika Calais'yi Talep Ediyor"
 ww_BEL_event_diplomatic.7.a:0 "Hayır, Calais bizim için daha değerli."
 ww_BEL_event_diplomatic.7.b:0 "Pekala, bu adil bir takas."
 ww_BEL_event_diplomatic.7.desc:0 "[BEL.GetAdjective] heyetinden ilginç bir teklif aldık. Toprak değişimi önerdiler, Calais karşılığında Kongo'nun büyük bir kısmını. Bölgedeki mevcut topraklarımıza komşu olan Coquilhatville ve Stanleyville eyaletlerini güvence altına alırdık. Bu teklifi reddedersek diplomatlarından bazı üstü kapalı tehditler vardı ve bu, Afrika'daki topraklarımızın önemli bir genişlemesi olurdu, ama maliyetine değer mi?"
 ww_BEL_event_diplomatic.7.t:0 "Belçika Calais'yi Değiş Tokuş Etmek İstiyor"
 ww_BEL_event_diplomatic.8.a:0 "Hayır, Calais bizim için daha değerli."
 ww_BEL_event_diplomatic.8.b:0 "Bu adil bir fiyat gibi görünüyor!"
 ww_BEL_event_diplomatic.8.desc:0 "Az önce [BEL.GetAdjective] heyetinden ilginç bir teklif aldık. \"Tarihi topraklarını yeniden birleştirmek\" amacıyla Calais'i bizden satın almakla ilgilendiklerini ifade ettiler. Teklif ettikleri meblağ oldukça yüksek ve kendi ekonomimizi iyileştirmeye kesinlikle katkıda bulunacak. Asıl soru, bu arazi kaybının bu fiyata değeceğine inanıp inanmadığımızdır. Diplomatlarının, tekliflerini reddetmemiz durumunda gerilimin artacağını ima ettiğini de belirtmek gerekir."
 ww_BEL_event_diplomatic.8.t:0 "Belçika Calais'yi Satın Almak İstiyor"
 ww_BEL_event_diplomatic.9.a:0 "Haritalarımızı güncellemek zorunda kalacağız... Yine."
 ww_BEL_event_diplomatic.9.desc:0 "Sömürge Valimiz, [BEL.GetName]'in [FRA.GetName] ile Calais'yi birkaç eyaletimizle, yani Coquilhatville ve Stanleyville ile takas etmek için bir anlaşma imzaladığı konusunda bilgilendirildi. Bir kez daha Avrupalı hakim devletler, burada gerçekten yaşayan bizlerden sıfır girdi ile Afrika'nın sınırlarını değiştiriyor!"
 ww_BEL_event_diplomatic.9.t:0 "Coquilhatville ve Stanleyville Fransa'ya Satıldı!"
 ww_BEL_event_misc.1.a:0 "Halefi bu işi yapacak adamdır!"
 ww_BEL_event_misc.1.desc:0 "Uzun süredir Sosyalist politikacı ve [BEL.GetName] Başbakanı olan ve 'le patron' (patron) lakaplı Émile Vandervelde öldü. Büyük Savaş'ı sona erdiren Paris Barış Konferansı'ndaki Belçika heyetinin bir üyesi olarak tanınıyordu ve Faşizmin sadık bir rakibi olmuş, hatta İspanya İç Savaşı'nda Cumhuriyetçi tarafta doğrudan müdahaleyi savunmuştu. \n\nHendri de Man yeni Başbakan olarak görevi devraldı ve bugün ilerleyen saatlerde Kral tarafından yemin ettirilecek."
 ww_BEL_event_misc.1.t:0 "Patron Öldü"
 ww_BEL_event_misc.3.a:0 "Muhtemelen ekonomimizin motorunu onlar inşa etti!"
 ww_BEL_event_misc.3.desc:0 "Cockerill, Belçika imalatının tam kalbinde yer alan bir şirkettir. Varlığı boyunca sadece demir ve çelik imalatına değil, aynı zamanda buhar motorları, trenler ve hatta savaş gemileri de dahil olmak üzere ince mühendislik ürünü makinelere de el atmıştır. Mükemmel bir üne kavuşmuş ve Batı Avrupa'nın çelik endüstrisinde büyük bir güç haline gelmiştir. \n\nDirektör-general Adolphe Greiner, yönetimin diğer üyeleri arasında, Büyük Savaş'taki Liège kuşatması boyunca görevlerinin başında kalmış ve iş gücüne mümkün olduğu sürece istihdamın açık kalmasını sağlamıştır. İşgal edildikten sonra, şirket işgalci kuvvetler için üretim yapmayı reddetmiş ve bu nedenle ağır çelik işleme teçhizatının çoğundan arındırılmıştır. \n\nSavaş arası dönemde toparlanmış ve önde gelen bir sanayi kuruluşu olmaya devam etmektedir."
 ww_BEL_event_misc.3.t:0 "Cockerill: Belçika İmalatının Kalbi"
 ww_BEL_event_political.1.a:0 "Ulusal Birlik Hükümeti'ni Kurun"
 ww_BEL_event_political.1.b:0 "Vandervelde bir Azınlık Hükümeti kuruyor"
 ww_BEL_event_political.1.desc:0 "Süregiden yolsuzluk skandalı nedeniyle hükümet üzerindeki baskı nihayet çökmesine neden oldu. Faşist Rexist hareketinin lideri Leon Degrelle liderliğindeki müfettişler, birkaç yıldır bakanlara rüşvet verilmesini araştırıyor ve çok sayıda ödemenin ortaya çıkmasını sağladı. \n\nMeşruiyetini yeniden kazanma çabasıyla, zor durumdaki Başbakan Paul van Zeeland, güvenilirliğini ve meşruiyetini yeniden kazanmak için bir erken seçim çağrısında bulundu ve sonuçlar şimdi belli oldu. \n\nEmile Vandervelde liderliğindeki Parti Ouvrier Belge (Belçika İşçi Partisi), siyasi rakibinin popüler olmamasından yararlanarak en iyi performansı gösterdi. Bu zaferi alıp bir Azınlık Hükümeti kurabilir veya daha istikrarlı bir çoğunluk oluşturmak ve bir Ulusal Birlik Hükümeti kurmak için Paul van Zeeland'ın Katolik partisiyle birlikte çalışabilir. \n\nAyrıca Leon Degrelle'in Rexist partisinin de çok iyi performans gösterdiği ve yolsuzluk karşıtı duruşunun çok popüler olduğu belirtilmelidir."
 ww_BEL_event_political.1.t:0 "Hükümet İstifa Ediyor ve Erken Seçim"
 ww_BEL_event_political.2.a:0 "Bu yolsuzluğun sonu yok mu?!"
 ww_BEL_event_political.2.desc:0 "Bugün Paul van Zeeland'ın Katolik partisinin peşini bırakmayan yolsuzluk skandalı, Başbakan'ın kendisinin de \"katkıları\" kabul ettiğinin ortaya çıkmasıyla daha da kötüleşti! Hükümetinin tekrar çökmesi an meselesi gibi görünüyor..."
 ww_BEL_event_political.2.t:0 "Paul van Zeeland Yolsuzluk Skandalı"
 ww_BEL_event_political.3.a:0 "İstikrarlı eli, Liberal Paul-Émile Janson'u atayın"
 ww_BEL_event_political.3.b:0 "Yasa ve düzeni yeniden tesis etmek için Rexist Leon Degrelle ile devam edin"
 ww_BEL_event_political.3.desc:0 "Paul van Zeeland nihayet Başbakan olarak istifa etti ve görevini rezil bir şekilde bıraktı. Bu sefer Kral III. Leopold, kendisinin müdahale edeceğini ve yeni bir Başbakan atayacağını ilan etti. İki önde gelen aday var: \n\nLiberal Parti üyesi ve Ulusal Birlik Hükümeti üyesi olan Paul-Émile Janson, istikrarlı bir el olarak görülüyor. Diğeri ise yasa ve düzenin sesi olarak müjdelenen ve yakın zamanda kendi partisinin seçimdeki başarısıyla güçlenen Leon Degrelle."
 ww_BEL_event_political.3.t:0 "Kraliyet Ataması"
 ww_BEL_event_political.4.a:0 "Umarım Başbakan Spaak daha uzun süre dayanır!"
 ww_BEL_event_political.4.desc:0 "Ekonomik toparlanmamızın ilk işaretlerine rağmen bir kez daha bir mali krizle karşı karşıyayız. Başbakan [BEL.GetLeader], kamu maliyesinin kötüleşen durumuna karşı koymak için gereken vergi reformları konusunda geniş bir fikir birliği sağlayamadığı için [BEL.GetHerHis] bütçesini parlamentodan geçiremedi ve bu da bir kez daha hükümetin çökmesine yol açtı.\n\nBu durum, gücün İşçi Partisi'nin yükselen yıldızı ve Belçika'nın ilk Sosyalist Başbakanı olan Paul-Henri Spaak'a hızla devredilmesine yol açtı."
 ww_BEL_event_political.4.t:0 "Bütçe Krizi"
 ww_BEL_event_political.5.a:0 "Başbakan istifa etmeli ve erken seçim çağrısı yapmalı"
 ww_BEL_event_political.5.b:0 "Spaak'ın bunu atlatacak siyasi desteği var"
 ww_BEL_event_political.5.desc:0 "Oldukça normal bir atama olarak başlayan şey, hükümetimiz için başka bir siyasi krize dönüştü. Başbakan'ın Kraliyet Tıp Akademisi'ne yeni bir üye ataması gerekiyordu ve değerlendirme için Adriaan Martens'i öne sürdü. Bu, Martens'in Flaman milliyetçiliği ve Büyük Savaş sırasında Alman işgalcilerle işbirliği yapması nedeniyle tartışmalı bir seçim oldu. Bu seçim, gaziler, liberaller, Fransızca konuşan Belçikalılar tarafından şiddetle karşılandı ve hatta Kral bile memnuniyetsizliğini belirtti. \n\n[BEL.GetLeader] seçimi savunmaya çalıştı, ancak artan bir baskı altına girdi. Rakipleri yeni bir lider seçmek için erken seçim çağrısında bulundular, ancak Spaak potansiyel olarak bu pozisyon için savaşacak siyasi sermayeye sahip olabilir."
 ww_BEL_event_political.5.t:0 "Adriaan Martens Krizi"
 ww_BEL_event_political.6.a:0 "Hollandaca öncelikli olmalıdır."
 ww_BEL_event_political.6.b:0 "Fransızca öncelikli olmalıdır."
 ww_BEL_event_political.6.c:0 "Belçika her iki kültür tarafından da eşit olarak tanımlanır."
 ww_BEL_event_political.6.desc:0 "Kuruluşundan bu yana, Belçika iki dil grubu arasında bölünmüş bir ülkedir: Fransızca konuşan Valonlar ve Hollandaca konuşan Flamanlar. Bu, ulusumuz içinde basit arkadaşlıklar arasındaki yanlış anlamalardan, askeri komutların yanlış uygulanmasına, sanıkların mahkemenin konuştuğu dili konuşmaması nedeniyle adaletin tecelli etmemesine kadar bir dizi soruna yol açmıştır.\n\nBu bölünmeyi kesin olarak bir kenara bırakma ve ulusumuzu ortak bir dil modeli altında en iyi nasıl birleştireceğimize karar verme zamanı geldi."
 ww_BEL_event_political.6.t:0 "Flaman Sorunu"
 ww_BEL_event_political.7.a:0 "Hubert Pierlot ve Katolik Parti, bizi tehdit edenlere karşı meydan okumaya devam edecek."
 ww_BEL_event_political.7.b:0 "Paul-Henri Spaak ve İşçi Partisi bizi yeni bir sosyalist geleceğe taşıyacak."
 ww_BEL_event_political.7.desc:0 "Anayasal Kriz şimdilik kontrol altına alındığına göre, hükümetin meşruiyetini yeniden sağlamanın zamanı geldi, aksi takdirde az önce devirdiği kişilerden farkı kalmaz. Şu anda Sosyalistlerden Paul-Henri Spaak ve Katolik Parti'den Hubert Pierlot, potansiyel erken seçimde önde gelen isimler."
 ww_BEL_event_political.7.t:0 "Erken Seçim"
 ww_BEL_event_political.8.a:0 "Hollandaca bizim dilimizdir"
 ww_BEL_event_political.8.b:0 "Fransızca bizim dilimizdir"
 ww_BEL_event_political.8.c:0 "Dillerimiz eşittir ve ikisini de koruyacağız!"
 ww_BEL_event_political.8.desc:0 "Halkımız uzun zamandır dil ile bölünmüştür. Fransızca konuşan Valonlar ve Hollandaca konuşan Flamanlar, gruplar arasında bir uçurum yaratır ve daha birleşik bir [ROOT.GetName] gelişimini engeller. Resmi dilimizin ne olduğuna dair bir karara varmalıyız, aksi takdirde arkadaşlar arasındaki yanlış anlamalar, yanlış uygulanan askeri komutlar ve adaletsizlikler asla günlük [ROOT.GetAdjective] yaşamının bir parçası olmaktan çıkmayacaktır."
 ww_BEL_event_political.8.t:0 "Halkın Dili"
 ww_BEL_event_spanish_interaction.1.a:0 "Onları iyi kullanacağız!"
 ww_BEL_event_spanish_interaction.1.desc:0 "[FROM.GetAdjective] hükümetinden bir tüfek sevkiyatı aldık. Milliyetçilerin durdurulması gerektiği konusundaki duygularımızı paylaşıyorlar ve sadece sözlerle değil, mücadelemize yardım etmek istiyorlar."
 ww_BEL_event_spanish_interaction.1.t:0 "[FROM.GetNameDefCap] Teçhizat Gönderiyor"
 ww_BEL_event_spanish_interaction.2.a:0 "Daha fazla tüfek gönderin!"
 ww_BEL_event_spanish_interaction.2.b:0 "Destek Teçhizatı kullanabilirler!"
 ww_BEL_event_spanish_interaction.2.c:0 "Onlara topçu gönderin!"
 ww_BEL_event_spanish_interaction.2.desc:0 "[SPR.GetAdjective]'e yaptığımız önceki sevkiyat Cumhuriyetçi dostlarımız için çok faydalı oldu. Ancak savaşları henüz bitmedi ve onlara daha fazla teçhizat teklif edebilmeliyiz."
 ww_BEL_event_spanish_interaction.2.t:0 "[SPR.GetAdjective] Cumhuriyetçilerine Daha Fazla Teçhizat Sevkiyatı"
 ww_BEL_event_spanish_interaction.3.a:0 "Harika!"
 ww_BEL_event_spanish_interaction.3.desc:0 "Başka bir [FROM.GetAdjective] teçhizat sevkiyatı aldık. Bize verdikleri destek, anavatanlarımızı kasıp kavuran milliyetçi belaya karşı savaşta çok yardımcı olacaktır."
 ww_BEL_event_spanish_interaction.3.t:0 "[FROM.GetNameDefCap] Daha Fazla Teçhizat Gönderiyor"
 ww_BEL_event_spanish_interaction.4.a:0 "[FROM.GetAdjective]lere teşekkürlerimizi gönderin!"
 ww_BEL_event_spanish_interaction.4.desc:0 "Birkaç saat önce [FROM.GetNameDef]'de lehimize bir miting ve bir konuşma yapıldığı konusunda bilgilendirildik. [FROM.GetAdjective] liderliği, halkımızın bize daha fazla güvenmesiyle hareket alanımızın artacağı umuduyla bize desteklerini bir kez daha yineledi."
 ww_BEL_event_spanish_interaction.4.t:0 "Mücadelemizi Destekleyen [FROM.GetAdjective] Konuşması"
 ww_BEL_event_spanish_interaction.5.a:0 "Harika haber!"
 ww_BEL_event_spanish_interaction.5.desc:0 "Son zamanlarda [FROM.GetAdjective] vatandaşlarının göçünde bir artış gördük. Bu göçmenlerin çoğu, yardımlarına ihtiyacımız olursa silahlı kuvvetlerimize katılma isteğini belirtiyor. Bunun [FROM.GetAdjective]lerin bilinçli bir çabası olduğu ancak hayal edilebilir."
 ww_BEL_event_spanish_interaction.5.t:0 "[FROM.GetAdjective] Göçünün Teşviki"
 ww_BEL_event_spanish_interaction.6.a:0 "Harika bir fikir!"
 ww_BEL_event_spanish_interaction.6.b:0 "Desteklerini takdir ediyoruz ama hayır."
 ww_BEL_event_spanish_interaction.6.desc:0 "Daha önce çok tarafsız olan [FROM.GetAdjective]ler bize şaşırtıcı bir teklif gönderdi. Bizimle bir ittifak kurmak istiyorlar. Bunun, milliyetçilere karşı mücadelemizde onlara daha iyi destek sağlamalarına olanak tanıyacağını umuyorlar."
 ww_BEL_event_spanish_interaction.6.t:0 "[FROM.GetNameDefCap] İttifak Öneriyor"
 ww_BEL_event_spanish_interaction.7.a:0 "İleri!"
 ww_BEL_event_spanish_interaction.7.desc:0 "[FROM.GetAdjective]ler, [ROOT.GetFactionName]'i kurma teklifimize olumlu bir yanıt verdi. Milliyetçi tehdide karşı birlikte duracağız!"
 ww_BEL_event_spanish_interaction.7.t:0 "[FROM.GetNameDef] [ROOT.GetFactionName]'e Katılıyor"
 ww_BEL_event_spanish_interaction.8.a:0 "Ne kadar kaba!"
 ww_BEL_event_spanish_interaction.8.desc:0 "Sürekli olarak [FROM.GetAdjective]'e sunduğumuz desteği göz önünde bulundurarak, teklifimizin olumlu bir yanıtla karşılanacağını ummuştuk. Görünüşe göre durum böyle değil, çünkü önerimizi reddettiler ve yardımlarımızın memnuniyetle karşılandığını, ancak bir ittifak istemediklerini belirttiler."
 ww_BEL_event_spanish_interaction.8.t:0 "[FROM.GetNameDefCap] İttifak Teklifimizi Reddediyor"
 ww_BEL_event_spanish_interaction.9.a:0 "Gerçekten yazık"
 ww_BEL_event_spanish_interaction.9.desc:0 "İç Savaşımızın sona ermesiyle birlikte [FROM.GetAdjective], ortaklığımızın sona erme zamanının geldiğine karar verdi. Bu şimdilik ittifakımızı sona erdirse de, bunun bir daha asla müttefik olmayacağımız anlamına gelmediği konusunda çok kararlıydılar."
 ww_BEL_event_spanish_interaction.9.t:0 "[FROM.GetNameDefCap] $BEL_SPR_alliance$'ı Dağıtıyor"
 ww_BEL_event_war.1.a:0 "İşte bu yüzden ileriyi planlıyoruz!"
 ww_BEL_event_war.1.desc:0 "Yabancı sanayi firmalarıyla iyi çalışma temasları geliştirme öngörümüz meyvesini verdi. Tesisleri derhal üretime girmeye hazır."
 ww_BEL_event_war.1.t:0 "Yeniden Konumlandırılan Hava Sanayileri Aktive Edildi"
 ww_BEL_event_war.10.a:0 "Geldiğimiz şeyi aldık, barış için dava açın!"
 ww_BEL_event_war.10.b:0 "Hepsini istiyoruz!"
 ww_BEL_event_war.10.desc:0 "[FRA.GetAdjective]'e karşı savaşımızın ilk günlerindeki tartışmalarda önümüze konulan hedeflere ulaşıldı. Paris bizim kontrolümüz altında ve bu nedenle, [FRA.GetAdjective]'in şimdi yeterince strese girdiği ve birliklerimizi geri çekme teklifimizin, Calais'yi bize vermeleri karşılığında isteksiz bir onayla karşılanabileceği varsayılabilir.\n\nAynı zamanda, sesler yükseliyor, bu kadar ileri geldik ve [FRA.GetAdjective]'in bizi durduramayacağı açık. Neden şimdi duralım?"
 ww_BEL_event_war.10.t:0 "Paris [ROOT.GetAdjective] Kontrolü Altında"
 ww_BEL_event_war.2.a:0 "Kral Leopold bizi zafere taşıyacak."
 ww_BEL_event_war.2.desc:0 "Kral III. Leopold, babası Kral Albert, Asker Kral'ın gölgesinde yaşıyor, Belçika'yı Büyük Savaş'ta tutması ve Alman İmparatorluğu'na zaferi reddetmesiyle ünlüdür. Bu süreçte ülkesi bir savaş alanına dönmüş olsa da, ulusun askeri gururu lekelenmemiş ve Belçika'nın itibarı dünya sahnesinde yükselmiştir. \n\nŞimdi, Belçika bir kez daha savaşta olduğundan, Leopold'un karakterinin gerçek testi başlayacak ve şimdiden endişemize neden olan mırıltılar var. \n\nHalkının hayatını korumak istediğini iddia eden Kral, şimdiden barış için nabız yoklamaya başladı ve Brüksel, Liège ya da Anvers düşerse, halkın savaşmaya devam etme yönündeki demokratik iradesine bakılmaksızın kralın erken teslim olabileceğinden şüpheleniyoruz."
 ww_BEL_event_war.2.t:0 "Bilinmeyen Sempati"
 ww_BEL_event_war.3.a:0 "Bu Kral'ın iradesidir!"
 ww_BEL_event_war.3.b:0 "Savaşmaya devam et!"
 ww_BEL_event_war.3.c:0 "Buna hakkı yoktu! Kralı ev hapsine alın."
 ww_BEL_event_war.3.desc:0 "Silahlı kuvvetlerin Başkomutanı olan Kral, bugün önce [BEL.GetAdjective] parlamentosu tarafından onaylanmasını beklemeden [BEL.GetName]'in koşulsuz teslimiyetini teklif etti. Teknik olarak, Başkomutan olarak, ordunun teslim olma yetkisine sahiptir, ancak ülkenin kendisinin değil. \n\nSivil parlamento zaten sürgüne kaçtı ve [BEL.GetAdjective] İmparatorluğu'nun tüm kaynaklarını kullanarak savaşa devam etme niyetlerini açıkça ortaya koydu."
 ww_BEL_event_war.3.t:0 "Kralın Teslimiyeti"
 ww_BEL_event_war.4.a:0 "Leon Degrelle'i yeni naip yap"
 ww_BEL_event_war.4.b:0 "Meşru soyu Charles ile güvence altına al"
 ww_BEL_event_war.4.desc:0 "Ulusunu işgalciye teslim etme ihanetinin ardından, Kral ev hapsine alındı ve silahlı kuvvetlerin Başkomutanı görevinden, unvanlarından ve tabii ki tacından mahrum bırakıldı. Ancak halkın hala bir hükümdara ihtiyacı var ve oğlu tahta çıkacak yaşa gelene kadar naipliği kimin yöneteceğine karar vermek bizim seçimimiz oldu. İki seçenek var: \n\nİlki, Başbakan ve halkımızın yasal olarak atanmış lideri olan Leon Degrelle. Diğer seçenek ise, Leopold'un kardeşi olan Flandre Kontu Charles, bu da taçla meşruiyet ve devamlılık havası verecektir."
 ww_BEL_event_war.4.t:0 "Kraliyet Mahkumu"
 ww_BEL_event_war.5.a:0 "Gelecek belirsiz."
 ww_BEL_event_war.5.desc:0 "Ulusun ruhlu bir savunmasının ardından, Kral III. Leopold nihayet [BEL.GetName]'in teslimiyetini teklif etti ve hükümetimiz sürgüne zorlandı. Leopold halkıyla kalmayı ve kendi evinde bir mahkum olmayı seçti. Hala müttefiklerimizin iyi niyetine güvenebilir ve [BEL.GetAdjective] İmparatorluğu'nun kaynaklarına dayanabiliriz ve böylece zamanla anavatanımızı bize geri kazandırabiliriz."
 ww_BEL_event_war.5.t:0 "Kralın Teslim Olması"
 ww_BEL_event_war.6.a:0 "İyi bir girişim, sorunsuz bir işgal sağlamak için onlarla çalışın."
 ww_BEL_event_war.6.b:0 "İlginç bir fikir, tekliflerini değerlendireceğiz."
 ww_BEL_event_war.6.c:0 "Bu sadece meşru bir direniş için bir bahanedir. Hayır."
 ww_BEL_event_war.6.desc:0 "Bir grup Belçikalı memur bize bir teklifle başvurdu; sivil görevde çalışmalarına devam etmelerine izin verin, onlar da yerel yönetimin bu geçiş döneminde sorunsuz bir şekilde işlemeye devam etmesini sağlayacaklar. Belçika hükümeti, işgalin halk üzerindeki etkisini azaltmak amacıyla onlarla işbirliğimizi yasal hale getiren bir yasa çıkardı. Hatta bu yöneticilerin maaşlarını ödemeye devam etmeleri için Belçika bankalarına yaptırım uyguladılar. Bu, yerel halkla çalışma isteğimizi göstermek için bir fırsattır ve bölgedeki aktif direnişi bir miktar rahatlatacaktır."
 ww_BEL_event_war.6.t:0 "Genel Sekreterler"
 ww_BEL_event_war.7.a:0 "Birliklerimiz çok geçmeden Paris sokaklarında yürüyecek!"
 ww_BEL_event_war.7.desc:0 "Üst düzey diplomatlarımız ve generallerimiz yakın zamanda bir araya geldi ve bize bu çatışmanın kapsamı sınırlı kalırsa, yani başka büyük güçler dahil olmazsa, [FRA.GetName]'i masaya getirip hızlı bir barış anlaşması sağlayabileceğimizi tavsiye ettiler. Gerilimin artmasından korktuklarını ve bizim gibi başka bir küresel çatışmaya sürüklenmek istemediklerini biliyoruz. \n\nBu nedenle, Paris'in düşmesinin, yeteneklerimizin yeterli bir göstergesi olacağı ve tartışmalı Calais'nin devrini müzakere etmeye istekli olabilecekleri bizim hesabımızdır."
 ww_BEL_event_war.7.t:0 "Potansiyel Sınırlı Savaş - Paris düşmeli!"
 ww_BEL_event_war.8.a:0 "Barış için Calais'yi teklif et."
 ww_BEL_event_war.8.b:0 "Savaşmaya devam et! Bu savaş henüz bitmedi."
 ww_BEL_event_war.8.desc:0 "Ulusal bir felaketle, gururlu başkentimiz Paris düştü! Bir kez daha, silahlı kuvvetlerimizin açıkça daha aşağı bir düşman karşısında yetersiz olduğu görüldü. [FROM.GetAdjective]ler, birliklerini geri çekmeyi ve ülkenin geri kalanını esirgemeyi teklif ettiler, ancak karşılığında Calais'yi onlara vermemizi talep ediyorlar. \n\nAkbabaların şimdiden daire çizdiğini hissedebiliyoruz ve bu bize öğrendiğimiz dersleri almak ve gelecekte daha büyük potansiyel düşmanlara hazırlanmak için zaman kazandıracak."
 ww_BEL_event_war.8.t:0 "Paris Düştü!"
 ww_BEL_event_war.9.a:0 "Kabul ediyoruz! Barış için Calais."
 ww_BEL_event_war.9.b:0 "Savaşmaya devam et! Daha fazlasını alabiliriz."
 ww_BEL_event_war.9.desc:0 "Bugün, başkentlerinin düşmesinin ardından mevcut çatışmaya barışçıl bir çözüm müzakere etmek için gelen bir Fransız heyeti aldık. Birkaç müzakereden sonra, düşmanlıkların derhal durdurulması karşılığında bize Calais'yi teklif etmeye karar verdiler. \n\nBunun tek seferlik bir teklif olduğu ve reddedersek savunmalarında daha kararlı olacakları ve tekrar teklif etmelerinin olası olmadığı belirtilmelidir."
 ww_BEL_event_war.9.t:0 "Fransa Barışı Kabul Ediyor"
 ww_congo.1.a:0 "Büyük bir lütuf"
 ww_congo.1.desc:0 "Belçika sömürge dairesi bugün sanayi gelişimimize çok daha büyük miktarda kaynak ayırmak için bir yasa tasarısını kabul etti ve [295.GetName]'de sanayi tesislerinin inşasına başladı."
 ww_congo.1.t:0 "Belçika Gelişimimize Yatırım Yapıyor"
 ww_congo.10.a:0 "Kabul etmekten başka çaremiz yok."
 ww_congo.10.b:0 "Asla!"
 ww_congo.10.d:0 "Kongolu kuvvetler [772.GetName]'deki kolonimizin sınırları boyunca konumlanmış durumda ve üslerimize ve tesislerimize tam erişim talep ediyorlar! Taleplerini kabul edersek, [772.GetName]'in kontrolünü etkin bir şekilde onlara devretmiş oluruz. Diğer yandan, bu konuda onlarla savaşacak imkanımız pek yok."
 ww_congo.10.t:0 "[FROM.GetNameDefCap] [772.GetName]'i Talep Ediyor"
 ww_congo.11.a:0 "Akıllıca bir hamle."
 ww_congo.11.d:0 "Fransızlar taleplerimizi kabul etti ve [772.GetName]'deki üsleri ve tesisleri tamamen bizim emrimizde. Kolonilerinin tam kontrolünü etkin bir şekilde bize devrettiler."
 ww_congo.11.t:0 "Fransızlar Taleplerimizi Kabul Ediyor"
 ww_congo.12.a:0 "Aptallar!"
 ww_congo.12.d:0 "Fransızlar taleplerimizi küstahça reddetti! Görünüşe göre [772.GetName]'i istiyorsak, zorla almak zorunda kalacağız!"
 ww_congo.12.t:0 "Fransızlar Taleplerimizi Reddediyor"
 ww_congo.13.a:0 "Birlikte daha güçlü olacağız!"
 ww_congo.13.b:0 "Asla!"
 ww_congo.13.d:0 "Kongolu kuvvetler sınırımız boyunca konumlanmış durumda ve üslerimiz, kurumlarımız ve tesislerimiz üzerinde tam kontrol talep ediyorlar! Taleplerini kabul edersek, bağımsızlığımızı etkin bir şekilde sona erdirmiş, uluslarının bir parçası olmuş oluruz. Diğer yandan, bu konuda onlarla savaşacak imkanımız pek yok."
 ww_congo.13.t:0 "[FROM.GetNameDefCap] Entegrasyonumuzu Talep Ediyor"
 ww_congo.14.a:0 "Akıllıca bir hamle."
 ww_congo.14.d:0 "[FROM.GetNameDefCap] taleplerimizi kabul etti ve ulusları önümüzdeki birkaç gün içinde bağımsız bir varlık olarak sona erecek. Ülkelerinin tam kontrolünü etkin bir şekilde bize devrettiler."
 ww_congo.14.t:0 "[FROM.GetNameDefCap] Taleplerimizi Kabul Ediyor"
 ww_congo.15.a:0 "Aptallar!"
 ww_congo.15.d:0 "[FROM.GetNameDefCap] taleplerimizi küstahça reddetti! Görünüşe göre [772.GetName]'i istiyorsak, zorla almak zorunda kalacağız!"
 ww_congo.15.t:0 "[FROM.GetNameDefCap] Taleplerimizi Reddediyor"
 ww_congo.16.a:0 "Başarısız olmaya mahkumlar"
 ww_congo.16.b:0 "Çok yaşa [ROOT.GetNameDef]!"
 ww_congo.16.d:0 "Artan küresel gerilimlere bir yanıt olarak ve [FROM.GetLeader]'in son zamanlardaki muzaffer başarılarıyla, Roman dillerini konuşan Orta Afrika ülkelerinin birleşmesi sağlandı. Şimdi, kendilerini yeni bir dünya gücü ilan ediyorlar ve ne pahasına olursa olsun [FROM.GetAdjective] halkını koruyacaklarına söz veriyorlar."
 ww_congo.16.t:0 "Latin Afrika Birleşti"
 ww_congo.17.a:0 "Afrika'daki Güç Dengesi değişti"
 ww_congo.17.b:0 "İki eşit ve bağımsız ülke olduğumuzu kanıtlama zamanı"
 ww_congo.17.c:0 "Belki de en iyisi buydu..."
 ww_congo.17.d:0 "Eyaletteki [BEL.GetAdjective] yetkililerinin onayının ardından, yeni [COG.GetAdjective] Başbakanı Patrice Lumumba, ülkesinin yeni keşfedilen bağımsızlığını kutlamak için kısa bir konuşma yaptı. Bunun içinde sömürgeciliğe yönelik açık sözlü eleştiri ve sözde \"[BEL.GetAdjective] uygarlaştırma misyonu\" yatıyor. Bu durum ülke içinde olumlu karşılansa da ülke dışındaki birçok kişi bunu [BEL.GetAdjective] Devlet Başkanına karşı kişisel bir saldırı olarak yorumladı. Sömürgecilikten kurtulma dönemi daha yeni başladı!"
 ww_congo.17.t:0 "Kongo Bağımsızlığı Kazanıldı"
 ww_congo.18.a:0 "Emperyalizm Çağı henüz sona ermedi"
 ww_congo.18.b:0 "Hainler hak ettiklerini buldular"
 ww_congo.18.c:0 "Birlikten kuvvet doğar"
 ww_congo.18.d:0 "Yakın zamanda, Stanleyville'deki Özgür Kongo hükümeti Belçika sömürge imparatorluğundan ayrılmaya çalıştı. Ulusta büyük destek görmelerine rağmen, isyanları Belçika'ya sadık birlikler ve yabancı paralı askerler tarafından hızla bastırıldı."
 ww_congo.18.t:0 "Kongo Ayaklanması Bastırıldı"
 ww_congo.19.a:0 "Emperyalizm Çağı sona erdi"
 ww_congo.19.b:0 "Muzafferiz!"
 ww_congo.19.c:0 "Yıkıcı bir darbe..."
 ww_congo.19.d:0 "Yakın zamanda, Stanleyville'deki Özgür Kongo hükümeti Belçika sömürge imparatorluğundan bir bağımsızlık savaşı başlattı. Biraz zaman alsa da, isyanları sonunda bölgede konuşlanmış sömürge birliklerini alt etmeyi ve Kongo'daki kilit şehirleri ele geçirmeyi başardı. Şimdi, resmen bağımsızlık ilan ettiler ve eski zalimleriyle aralarında bir barış anlaşması arandı."
 ww_congo.19.t:0 "Kongo Ayaklanması Başarılı Oldu"
 ww_congo.20.a:0 "Onları durdurmak bizim yerimiz değil"
 ww_congo.20.b:0 "Kim onlara bağımsızlık verebilir dedi ki?"
 ww_congo.20.d:0 "Hükümetimizin Ruanda-Urundi mandası üzerindeki çok gevşek hakimiyeti ve bölgeye yayılan milliyetçi duygularla, Ruanda Kralı Mwami Mutara III Rudahigwa, ulusu bağımsız bir devlet ilan ederek merkezi hükümetimizle bağlarını kopardı. Müdahale etmeli miyiz?"
 ww_congo.20.t:0 "Ruanda Devrimi"
 ww_congo.21.a:0 "Onları durdurmak bizim yerimiz değil"
 ww_congo.21.b:0 "Kim onlara bağımsızlık verebilir dedi ki?"
 ww_congo.21.d:0 "Hükümetimizin Ruanda-Urundi mandası üzerindeki çok gevşek hakimiyeti ve bölgeye yayılan milliyetçi duygularla, Burundi Kralı Mwami Mwambutsa IV, ulusu bağımsız bir devlet ilan ederek merkezi hükümetimizle bağlarını kopardı. Müdahale etmeli miyiz?"
 ww_congo.21.t:0 "Mwambutsa'nın Bildirisi"
 ww_congo.22.a:0 "Mecbur kalacağız"
 ww_congo.22.b:0 "Kim olduğunu sanıyor ki?"
 ww_congo.22.desc:0 "Kongo'daki valimiz [COG.GetLeader], bilgi ve fona sahip insanları getirme çabasıyla bölgeye [ROOT.GetAdjective] göçünün artırılması arzusunu dile getirdi. Katanga'nın zengin ve sıcak toprakları, macera veya görev duygusu olan birçok kişiye cazip gelecektir ve eğer bunu teşvik edersek, kesinlikle daha fazla insanı taşınmaya teşvik edecektir."
 ww_congo.22.t:0 "[COG.GetLeader] Kongo'ya Göçün Artırılmasını Talep Ediyor"
 ww_congo.23.a:0 "Mükemmel"
 ww_congo.23.desc:0 "[FROM.GetNameDef]'deki sömürge yönetimi, devletimize [FROM.GetAdjective] göçünün teşvikini artırma talebimizi onayladı. Devletimizin inşasına yardım etmeye hazır yeni bir insan dalgasının gelmeye başlayacağından emin olabilirsiniz."
 ww_congo.23.t:0 "[FROM.GetAdjective]ler Göç Planımızı Onaylıyor"
 ww_congo.24.a:0 "Yani ne beklemiştik ki?"
 ww_congo.24.desc:0 "[FROM.GetNameDef]'deki sömürge yönetimi, devletimize [FROM.GetAdjective] göçünün teşvikini artırma talebimizi reddetti. Bu gerçekten utanç verici, ama fikirlerini değiştirmek için yapabileceğimiz pek bir şey yok."
 ww_congo.24.t:0 "[FROM.GetAdjective]ler Göç Planımızı Reddediyor"
 ww_congo.25.a:0 "Savaş gerçekten burada başlıyor"
 ww_congo.25.desc:0 "Belçika sömürgeler bakanı ve Pierre Ryckmans'ın yakın bir müttefiki olan Albert de Vleeshauwer, durumun vahim görünmesi ve anakara politikacılarının harekete geçmeyi reddetmesi üzerine yeni keşfedilen müttefiklerimizden destek için lobi yapmak üzere yurtdışına gitmeye karar verdi. Belki onun yardımı sayesinde bazı avantajlı anlaşmalar bulabiliriz?"
 ww_congo.25.t:0 "Albert de Vleeshauwer Destek için Lobi Yapmak Üzere Yurtdışına Gidiyor"
 ww_congo.26.a:0 "Savaşmaya değmez"
 ww_congo.26.b:0 "Kim olduklarını sanıyorlar?"
 ww_congo.26.desc:0 "\nBu hafta başında, [COG.GetNameDef]'e ait kuvvetler içeri girerek [796.GetName] toprağımızı işgal etti ve bölgeyi düşmanlarının potansiyel işgalinden koruma görevinde olduklarını belirtti. Bu açıkça bir savaş eylemidir, ancak muhtemelen bizimle kavga etmediklerini, daha çok Kongo havzasını yeniden birleştirmeye çalıştıklarını görerek basitçe görmezden gelmeyi seçebileceğimiz bir eylemdir."
 ww_congo.26.t:0 "[FROM.GetNameDefCap] [796.GetName]'i işgal ediyor!"
 ww_congo.27.a:0 "Onları yakalayın ve Mukalabushi'den bir örnek yapın"
 ww_congo.27.b:0 "Bu, büyük bir değişimin gerekli olduğunun bir işaretidir"
 ww_congo.27.desc:0 "Bu hafta başında, Kasaï eyaletindeki Luluabourg'da Birinci Başçavuş Ngoie Mukalabushi liderliğindeki Kongolu astsubaylar isyan etti. Ana tetikleyicilerden biri Belçikalı subaylarımız tarafından gördükleri muamele gibi görünüyor. İsyancılar sabah üssün cephaneliğine girdi ve kasabanın beyaz mahallesini yağmaladı. Ayrıca sömürge yetkililerinin görünür işaretlerine saldırdılar ve bağımsızlık arzularını ilan ettiler. Daha sonra yağmalayarak kendi köylerine dağıldılar, ancak isyanı komşu garnizonlara yaymayı başaramamış görünüyorlar. Durumla nasıl başa çıkmalıyız?"
 ww_congo.27.t:0 "Luluabourg'da bir İsyan"
 ww_congo.28.a:0 "İkna edilmeleri veya zorla kurtarılmaları gerekecek"
 ww_congo.28.desc:0 "Yeni kurulan Ulusal Kurtuluş Komitesi'nin sömürge hükümetine karşı daha mesafeli bir tavır aldığını görerek, kırsaldaki birçok insan Komite'nin bağımsızlığa barışçıl bir yoldan gitmeye çalışmayabileceğinden endişelenmeye başladı. Dahası, Katanga bölgesinde ayrılık fısıltıları duyulmaya başlandı ve kurtuluş savaşımız başladığında devletin bağımsızlık ilan etmeye çalışabileceği olabilir..."
 ww_congo.28.t:0 "Ulusal Komite'ye Karşı Artan Şüphe"
 ww_congo.29.a:0 "Elbette"
 ww_congo.29.b:0 "Müdahale etmek için bir neden yok"
 ww_congo.29.desc:0 "Kendilerini Ulusal Kurtuluş Komitesi olarak adlandıran Kongolu milliyetçiler, hakim devletlerine karşı bir bağımsızlık savaşı hazırlıyorlar. Savaş başladığında onlara silah gönderirsek, savaş kazanıldıktan sonra bizimle daha yakın bir çizgide olacaklarını vaat ediyorlar ve zayıflamış bir [BEL.GetName]'in çıkarlarımız dahilinde olduğunu iddia ediyorlar."
 ww_congo.29.t:0 "Kongolu Milliyetçiler Yardım İçin Bize Başvuruyor"
 ww_congo.30.a:0 "Mükemmel"
 ww_congo.30.desc:0 "Diplomatlarımız [FROM.GetAdjective] askeri personeli ile yaptıkları görüşmelerden döndüler ve zalimlerimize karşı savaş ilan etmeye karar verdiğimizde bize adam ve teçhizat gönderecekleri bir anlaşmaya vardıkları söyleniyor. Bugün Kongo halkı için iyi bir gün!"
 ww_congo.30.t:0 "[FROM.GetNameDefCap] Bize Yardım Etmeye Karar Veriyor"
 ww_congo.31.a:0 "Gerçekten yazık"
 ww_congo.31.desc:0 "Diplomatlarımız [FROM.GetAdjective] askeri personeli ile yaptıkları görüşmelerden eli boş döndüler. Görünüşe göre bir anlaşmaya varılamadı ve sözde müttefiklerimiz bize ihanet etti..."
 ww_congo.31.t:0 "[FROM.GetNameDefCap] Bize Yardım Etmemeye Karar Veriyor"
 ww_congo.32.a:0 "Cyrille Adoula iyi bir devlet adamıdır"
 ww_congo.32.b:0 "Christophe Gbenye liderlik etmeli"
 ww_congo.32.desc:0 "Simba hareketi son zamanlarda ülkede büyük destek kazandı. Şimdi, ulusal kongreye girdiler ve bir liderlik değişikliği talep ediyorlar. Politikacılarımızın durumu kabul etmekten başka yapabileceği pek bir şey yok. Ancak soru şu ki, şimdi devletimizi kim yönetmeli?"
 ww_congo.32.t:0 "Simba Darbesi"
 ww_congo.33.a:0 "Cyrille Adoula iyi bir devlet adamıdır, ayrılamaz"
 ww_congo.33.b:0 "Christophe Gbenye liderlik etmeli"
 ww_congo.33.desc:0 "Cyrille Adoula'nın Amerikalılar ve Belçika sendikalarıyla olan bağlarından kaynaklanan son zamanlarda ulusumuzun liderliği sorgulanmaya başlandı. Birçok kişi, Simbaların lideri Christophe Gbenye'nin devletin yeni başkanı olarak görevi devralması gerektiğine inanıyor. Onlara boyun eğmeli miyiz?"
 ww_congo.33.t:0 "Liderlik Sorunu"
 ww_congo.34.a:0 "Büyük bir işbirliği sağlanabileceğine inanıyoruz"
 ww_congo.34.b:0 "O ihtiyacımız olan lider!"
 ww_congo.34.desc:0 "Ganalı pan-afrikanist politikacı Kwame Nkrumah, bugün [ROOT.GetLeader] tarafından resmi bir davetin ardından başkentimize geldi. Hevesli bir sosyalist olan birçok kişi, Afrika'nın geleceğini güvence altına almak istiyorsak onunla işbirliğinin faydalı olabileceğine inanıyor, hatta bazıları onun ulusumuzun lideri olarak görevi devralması gerektiğini iddia ediyor. En iyi eylem yolu ne olurdu?"
 ww_congo.34.t:0 "Kwame Nkrumah'ın Devlet Ziyareti"
 ww_congo.35.a:0 "Buna derhal bir son vermeliyiz!"
 ww_congo.35.b:0 "Afrika için zaman geldi"
 ww_congo.35.desc:0 "\n[COG.GetAdjective] hükümetinin Afrika'daki direniş gruplarına silah sevkiyatı yapmaya başladığı ve işgalimiz altındaki devletlerinin kurtuluşu için muhalifleri ve milisleri barındırıp eğittiği bildiriliyor. İlerleyen süreçte bölge konusunda dikkatli olmamız gerekecek..."
 ww_congo.35.t:0 "[COG.GetNameDefCap] Sömürge Direnişini Kışkırtıyor"
 ww_congo.36.a:0 "Ne kadar ikiyüzlü, emperyal şiddetleri ancak zorla durdurulabilir."
 ww_congo.36.desc:0 "[FROM.GetNameDef]'den gelen büyükelçiler barış teklifimizi reddetti. Bize karşı saldırılarının tamamen haksız olduğunu ve bu nedenle, bölgesel barışa bir tehdit olduğumuz için bizden koşulsuz teslimiyetten başka bir şey kabul etmeyeceklerini savunuyorlar."
 ww_congo.36.t:0 "[FROM.GetName] Barış Teklifini Reddediyor"
 ww_congo.37.a:0 "Toprağımızdan vazgeçmeyeceğiz."
 ww_congo.37.b:0 "Kabul etmekten başka çaremiz yok."
 ww_congo.37.desc:0 "[FROM.GetAdjective] diplomatları bize bir barış teklifiyle başvurdu. Teklif, bu çatışma sırasında [FROM.GetNameDef]'e kaybettiğimiz [?COG.COG_disputed_colony.GetAdjective] toprağı üzerindeki iddialarımızdan vazgeçmeyi kabul etmemize bağlı. Diplomatlar ayrıca, vazgeçilen [?COG.COG_disputed_colony.GetAdjective] topraklarında yeni bir hükümet seçmek için oylama yapılacağını belirtiyorlar. Söz konusu seçimlerin ne kadar bağımsız olacağı henüz belli değil."
 ww_congo.37.t:0 "[FROM.GetNameDefCap] [?COG.COG_disputed_colony.GetAdjective] Bağımsızlığı için Barış Teklif Ediyor"
 ww_congo.38.a:0 "Emperyalizme karşı kahramanca bir zafer!"
 ww_congo.38.desc:0 "[FROM.GetNameDef]'den gelen diplomatlar, hükümetlerinin kurtardığımız [?COG.COG_disputed_colony.GetAdjective] toprağı üzerindeki iddialarından vazgeçmeye istekli olduklarını bize bildirdi. Şimdi kuvvetlerini bölgedeki yeni kurulan sınırlara çekiyorlar."
 ww_congo.38.t:0 "[FROM.GetName] Barış Teklifini Kabul Ediyor"
 ww_congo.39.a:0 "Kasa-Vubu iyi bir devlet adamıdır, ona ihtiyacımız var"
 ww_congo.39.desc:0 "İlk özgür seçim sonuçlandı ve Joseph Kasa-Vubu zirveye çıktı. Şimdi, ilk Kongolu bakanlar kabinesini kurmak için çok çalışıyor. Tüm ulus boyunca son derece popüler olan ve işinde mükemmel olan Kasa-Vubu'nun, gelecek nesiller boyunca büyük bir cumhurbaşkanı olarak hatırlanacağından emin olunabilir."
 ww_congo.39.t:0 "İlk Kongo Seçimi"
 ww_congo.4.a:0 "Defol Emperyalist!"
 ww_congo.4.desc:0 "Yakın zamana kadar ulusumuzda görev yapan Belçikalı subay Raoul van Overstraeten, yeni keşfedilen bağımsızlığımızın haberiyle şimdi Avrupa anakarasına geri dönmeye karar verdi. Onun gibi Avrupalılara artık ihtiyacımız yok ve bu kayıp bizi kesinlikle daha da güçlendirecektir."
 ww_congo.4.t:0 "Raoul van Overstraeten Belçika'ya dönüyor"
 ww_congo.40.a:0 "Kasa-Vubu gerçekten bu işin adamı"
 ww_congo.40.desc:0 "Cumhurbaşkanımız [ROOT.GetLeader], son seçimlerde bir zafer elde ettikten sonra ilk resmi kabinemizi kurma sürecindedir. Ulus boyunca son derece popüler olan Kasa-Vubu'nun, gelecek nesiller boyunca modern devletimizin kurucu babası olarak tanınacağından emin olunabilir!"
 ww_congo.40.t:0 "Kasa-Vubu'nun İlk Kabinesi"
 ww_congo.41.a:0 "Daha büyük bir iyilik için"
 ww_congo.41.b:0 "Asla olmaz!"
 ww_congo.41.desc:0 "\n [FROM.GetNameDef]'in lideri ve Bakongo İttifakı'nın lideri [FROM.GetLeader], bize ulaşarak Bakongo çoğunluğuna sahip tüm toprakları onlara devretmemizi talep etti. Nasıl yanıt vermeliyiz?"
 ww_congo.41.t:0 "[FROM.GetLeader] Bakongo Halkının Yeniden Birleşmesini Talep Ediyor"
 ww_congo.42.a:0 "Mükemmel!"
 ww_congo.42.desc:0 "\n [FROM.GetNameDef]'in lideri [FROM.GetLeader], büyük miktarda Bakongo halkına sahip tüm toprakları devretmeyi kabul etti ve gelecekte bize en iyi dileklerini sundu. Bugün Kongolu ulusu için harika bir gün."
 ww_congo.42.t:0 "[FROM.GetLeader] Bakongo Topraklarını Devrediyor"
 ww_congo.43.a:0 "Yapabileceğimiz pek bir şey yok"
 ww_congo.43.b:0 "Onlara göstereceğiz!"
 ww_congo.43.desc:0 "\n [FROM.GetNameDef]'in lideri [FROM.GetLeader], büyük miktarda Bakongo halkına sahip tüm toprakları devretme taleplerimizi reddetti. Halkımızın yabancı güçler tarafından baskı görmesine nasıl yanıt vermeliyiz?"
 ww_congo.43.t:0 "[FROM.GetLeader] Bakongo Topraklarını Devretmiyor"
 ww_congo.44.a:0 "Alabileceğimiz en meşru aday o!"
 ww_congo.44.b:0 "Hayır, başka birine ihtiyacımız var!"
 ww_congo.44.desc:0 "Konsey, Kongo'nun en meşru hükümdarının, batı eyaletlerimizde ve şimdi Cabinda ve Angola olan yerlerde bulunan, yakın zamanda feshedilmiş Kongo Krallığı'nın tahtının mevcut talibi Dom Pedro VII olacağına karar verdi. Şüphesiz istikrarı getirebilir ve Bakongo halkının birliğini sağlayabilir mi?"
 ww_congo.44.t:0 "Água Rosada Hanedanı"
 ww_congo.45.a:0 "Bizi büyüklüğe taşıyacak olan o!"
 ww_congo.45.b:0 "Hayır, başka birine ihtiyacımız var!"
 ww_congo.45.desc:0 "Konsey, Kongo'nun bir sonraki en meşru hükümdarının, merkezi eyaletlerimizde bulunan küçük bir krallık olan Kuba Krallığı'nın kralı Mbóp Mábíínc maMbéky olacağına karar verdi. Şüphesiz istikrarı getirebilir ve çok az kişinin başarabileceğini başarabilir mi?"
 ww_congo.45.t:0 "Bakuba'nın Nyim'i"
 ww_congo.46.a:0 "Bize Orta Kongo üzerinde meşru bir hak iddiası sağlayabilir!"
 ww_congo.46.b:0 "Hayır, başka birine ihtiyacımız var!"
 ww_congo.46.desc:0 "Konsey, Kongo'nun bir sonraki en meşru hükümdarının, en batıdaki eyaletlerimizde ve çevresinde, özellikle de şimdi Orta Kongo olan yerde bulunan bir devlet olan Loango Krallığı'nın Mâ Loango'su Moe Poaty III olacağına karar verdi. Şüphesiz istikrarı getirebilir ve batı Kongolu eyaletlerle birleşmeyi başarabilir mi?"
 ww_congo.46.t:0 "Mâ Loango"
 ww_congo.47.a:0 "En azından Burundi üzerinde bize meşru bir hak iddiası sağlayabilir..."
 ww_congo.47.b:0 "Hayır, başka birine ihtiyacımız var!"
 ww_congo.47.desc:0 "Konsey, Kongo'nun bir başka olası hükümdarının, doğudaki bir krallık olan Burundi Krallığı'nın Mwami'si Mwambutsa IV olacağına karar verdi. Şüphesiz istikrarı getirebilir ve Burundi devletiyle birleşmeyi başarabilir mi?"
 ww_congo.47.t:0 "Burundi'nin Ntwero Hanedanı"
 ww_congo.48.a:0 "En azından Ruanda üzerinde bize meşru bir hak iddiası sağlayabilir..."
 ww_congo.48.b:0 "Hayır, başka birine ihtiyacımız var!"
 ww_congo.48.desc:0 "Konsey, Kongo'nun bir başka olası hükümdarının, doğudaki bir krallık olan Ruanda Krallığı'nın Umwami'si Mutara III Rudahigwa olacağına karar verdi. Şüphesiz istikrarı getirebilir ve Ruanda devletiyle birleşmeyi başarabilir mi?"
 ww_congo.48.t:0 "Ruanda'nın Abanyiginya Klanı"
 ww_congo.49.a:0 "Yapacak bir şey yok..."
 ww_congo.49.b:0 "Bu planladığımız gibi olmadı..."
 ww_congo.49.desc:0 "Konsey, başka seçenek kalmadığını görerek, Kongo'nun son olası hükümdarının, doğudaki bir krallık olan Ruanda Krallığı'nın Umwami'si Yuhi V Musinga olabileceğine karar verdi. Musinga, Büyük Savaş'tan sonra Belçika valileri tarafından Alman Sömürge İmparatorluğu ile işbirliği ve hayranlığı nedeniyle iktidardan uzaklaştırılmıştı. Riskli bir bahis olabilir, ama en azından büyük hedefleri var..."
 ww_congo.49.t:0 "Alman İşbirlikçisi"
 ww_congo.5.a:0 "Bu kârı düşürür!"
 ww_congo.5.b:0 "Eğer en iyisinin bu olduğunu düşünüyorsa..."
 ww_congo.5.desc:0 "Kongo'daki valimiz [COG.GetLeader], 'sömürge nüfusunun sosyal koşullarını iyileştirme' çabasının bir parçası olarak madencilik üretimini azaltarak gıda üretimini artırma arzusunu dile getirdi. Bu, şimdilik koloninin karlılığına kesinlikle zarar verecektir, ancak uzun vadede neredeyse kesinlikle iyileştirecektir."
 ww_congo.5.t:0 "[COG.GetLeader] Kongo'da Gıda Üretimini Artırmak İstiyor"
 ww_congo.50.a:0 "Memnun oluruz"
 ww_congo.50.b:0 "Onlara ihtiyacımız yok."
 ww_congo.50.desc:0 "\n[FROM.GetNameDefCap] bize karşılıklı bir ittifak kurmak için başvurdu. Bir askerileştirme çabası başlattılar ve ikimizi de daha güçlü kılmak için birlikte çalışma arzusunu dile getirdiler. Tarihsel olarak ilişkilerimiz en iyi ihtimalle çalkantılıydı, ancak uzlaşma için şimdiki zamandan daha iyi bir zaman olamaz."
 ww_congo.50.t:0 "[FROM.GetNameDefCap] Bir İttifak Kurmak İstiyor"
 ww_congo.51.a:0 "Birlikte daha güçlüyüz!"
 ww_congo.51.desc:0 "\n[FROM.GetNameDefCap] onlarla bir ittifak kurma talebimize coşkuyla yanıt verdi ve bunu resmileştirmek için gerekli tüm belgeleri imzaladı. Artık bizi tehdit edenlere karşı yalnız savaşmayacağız!"
 ww_congo.51.t:0 "[FROM.GetNameDefCap] İttifak Kurmayı Kabul Ediyor"
 ww_congo.52.a:0 "Onlara göstereceğiz"
 ww_congo.52.desc:0 "\nİttifak kurma teklifimiz [FROM.GetLeader] tarafından soğuk bir şekilde reddedildi. Yararlılığımızı savunmaya çalıştık ama ne yazık ki [FROM.GetNameDef] kararını vermiş. Bu çok can sıkıcı olsa da, bu durumdan yılmayacak, bunun yerine başka çözümler bulacağız."
 ww_congo.52.t:0 "[FROM.GetNameDefCap] İttifak Kurma Teklifimizi Reddediyor"
 ww_congo.53.a:0 "Daha büyük bir iyilik için"
 ww_congo.53.b:0 "Asla olmaz!"
 ww_congo.53.desc:0 "\n [FROM.GetNameDef]'in lideri ve Burundi halkının lideri [FROM.GetLeader], bize ulaşarak Burundi çoğunluğuna sahip tüm toprakları onlara devretmemizi talep etti. Nasıl yanıt vermeliyiz?"
 ww_congo.53.t:0 "[FROM.GetLeader] Burundi Halkının Yeniden Birleşmesini Talep Ediyor"
 ww_congo.54.a:0 "Mükemmel!"
 ww_congo.54.desc:0 "\n [FROM.GetNameDef]'in lideri [FROM.GetLeader], büyük miktarda Burundi halkına sahip tüm toprakları devretmeyi kabul etti ve gelecekte bize en iyi dileklerini sundu. Bugün Kongolu ulusu için harika bir gün."
 ww_congo.54.t:0 "[FROM.GetLeader] Burundi Topraklarını Devrediyor"
 ww_congo.55.a:0 "Yapabileceğimiz pek bir şey yok"
 ww_congo.55.b:0 "Onlara göstereceğiz!"
 ww_congo.55.desc:0 "\n [FROM.GetNameDef]'in lideri [FROM.GetLeader], büyük miktarda Burundi halkına sahip tüm toprakları devretme taleplerimizi reddetti. Halkımızın yabancı güçler tarafından baskı görmesine nasıl yanıt vermeliyiz?"
 ww_congo.55.t:0 "[FROM.GetLeader] Burundi Topraklarını Devretmiyor"
 ww_congo.56.a:0 "Daha büyük bir iyilik için"
 ww_congo.56.b:0 "Asla olmaz!"
 ww_congo.56.desc:0 "\n [FROM.GetNameDef]'in lideri ve Ruanda halkının lideri [FROM.GetLeader], bize ulaşarak Ruanda çoğunluğuna sahip tüm toprakları onlara devretmemizi talep etti. Nasıl yanıt vermeliyiz?"
 ww_congo.56.t:0 "[FROM.GetLeader] Ruanda Halkının Yeniden Birleşmesini Talep Ediyor"
 ww_congo.57.a:0 "Mükemmel!"
 ww_congo.57.desc:0 "\n [FROM.GetNameDef]'in lideri [FROM.GetLeader], büyük miktarda Ruanda halkına sahip tüm toprakları devretmeyi kabul etti ve gelecekte bize en iyi dileklerini sundu. Bugün Kongolu ulusu için harika bir gün."
 ww_congo.57.t:0 "[FROM.GetLeader] Ruanda Topraklarını Devrediyor"
 ww_congo.58.a:0 "Yapabileceğimiz pek bir şey yok"
 ww_congo.58.b:0 "Onlara göstereceğiz!"
 ww_congo.58.desc:0 "\n [FROM.GetNameDef]'in lideri [FROM.GetLeader], büyük miktarda Ruanda halkına sahip tüm toprakları devretme taleplerimizi reddetti. Halkımızın yabancı güçler tarafından baskı görmesine nasıl yanıt vermeliyiz?"
 ww_congo.58.t:0 "[FROM.GetLeader] Ruanda Topraklarını Devretmiyor"
 ww_congo.59.a:0 "Kaçırmayacağımız bir fırsat"
 ww_congo.59.b:0 "Hayır!"
 ww_congo.59.desc:0 "\n [FROM.GetNameDef]'in lideri [FROM.GetLeader], yakın zamanda diplomatlarımızdan birine yaklaşarak, krallığı üzerindeki hakimiyetimizi yeniden kurmamız için yalvarıp yakardı, hatta devletine Mittelafrika adını verecek kadar ileri gitti. Bir zamanlar Ruanda kralı olarak hüküm sürerken bizim korumamız altındaydı, ancak o zamandan beri Belçika yetkilileri tarafından iktidardan atıldı. Deli kralın isteğine kulak vermeli miyiz?"
 ww_congo.59.t:0 "[FROM.GetLeader] Himaye Olmayı Talep Ediyor"
 ww_congo.6.a:0 "Bekleniyordu"
 ww_congo.6.desc:0 "[BEL.GetNameDef]'deki sömürge yönetimi, 'sömürge nüfusunun sosyal koşullarını iyileştirme' amacıyla madencilik üretimini azaltarak gıda üretimini artırma talebimizi reddetti."
 ww_congo.6.t:0 "[BEL.GetAdjective]ler Gıda Üretim Planımızı Reddediyor"
 ww_congo.60.a:0 "Bugün hatırlanacak bir gün!"
 ww_congo.60.desc:0 "\n [FROM.GetNameDef]'in lideri [FROM.GetLeader], taleplerimizi kabul etmeye karar verdi ve bir kez daha onların ulusunun bir himayesi olmamıza izin verdi. Gerçekten de, Afrika'da denge yeniden kuruldu!"
 ww_congo.60.t:0 "[FROM.GetLeader] Himayeleri Olma İsteğimizi Kabul Ediyor"
 ww_congo.61.a:0 "Bugün hatırlanacak bir gün..."
 ww_congo.61.desc:0 "\n [FROM.GetNameDef]'in lideri [FROM.GetLeader], bölgemizde çok az değer gördüğü için talebimizi reddetmeye karar verdi ve zaten sahip olmadıkları pek bir şey getiremeyeceğimizi iddia etti."
 ww_congo.61.t:0 "[FROM.GetLeader] Himayeleri Olma İsteğimizi Reddediyor"
 ww_congo.62.a:0 "İyi şanslar!"
 ww_congo.62.desc:0 "Yakın zamana kadar ulusumuzda görev yapan Belçikalı subay Raoul van Overstraeten, anavatanlarının kaybı ışığında [BEL.GetName]'e geri çağrıldı. Bize burada iyi hizmet etti ve umarız işgalcileri kovmaya yardım edebilir."
 ww_congo.62.t:0 "Raoul van Overstraeten Belçika'ya dönüyor"
 ww_congo.63.a:0 "Hoş bir lütuf"
 ww_congo.63.b:0 "Kendimizi suçluluğa düşürmeyeceğiz"
 ww_congo.63.desc:0 "\n [FROM.GetNameDef]'in lideri [FROM.GetLeader] bize ilginç bir teklifle başvurdu. Görünüşe göre, ulusun Uranyum yatakları beklenenden daha zengin ve şimdi ham malzemenin bir kısmını bir bedel karşılığında ulusumuza kaçırma fikirleri var."
 ww_congo.63.t:0 "[FROM.GetLeader] Bize Uranyum Satmak İstiyor"
 ww_congo.64.a:0 "Mükemmel!"
 ww_congo.64.desc:0 "\n [FROM.GetNameDef]'in lideri [FROM.GetLeader], onlara önerdiğimiz uranyum anlaşmasını imzalamayı kabul etti ve istediğimiz gerekli ödemeleri bize gönderdi."
 ww_congo.64.t:0 "[FROM.GetLeader] Uranyum Anlaşmasını Kabul Ediyor"
 ww_congo.65.a:0 "Çok kötü..."
 ww_congo.65.desc:0 "\n [FROM.GetNameDef]'in lideri [FROM.GetLeader], ülkelerine bir bedel karşılığında uranyum kaçırma talebimizi reddetti ve kendilerini uluslararası bir suçlu konumuna düşürmeyeceklerini iddia etti."
 ww_congo.65.t:0 "[FROM.GetLeader] Uranyum Anlaşmasını Reddediyor"
 ww_congo.66.a:0 "Eh, bu çok kötü..."
 ww_congo.66.desc:0 "\n [FROM.GetNameDef]'in lideri [FROM.GetLeader], devam eden uranyum anlaşmamızı, [FROM.GetAdjective] ulusu için çok maliyetli olduğu gerekçesiyle iptal etmeye karar verdi."
 ww_congo.66.t:0 "[FROM.GetNameDefCap] Uranyum Anlaşmasını İptal Ediyor"
 ww_congo.67.a:0 "Memnuniyetle!"
 ww_congo.67.b:0 "Bu çok tehlikeli"
 ww_congo.67.desc:0 "\n [FROM.GetNameDef]'in lideri [FROM.GetLeader] bize ilginç bir teklifle başvurdu. Ortak Uranyum Geliştirme Ortaklığı'na katılmamızı ve nükleer materyalleri ve araştırmaları birbirimizle paylaşmamızı istiyorlar. Potansiyel olarak bilgiyi daha kolay sızdırabilir, ancak çok çaresizce ihtiyacımız olan uranyum için buna değebilir."
 ww_congo.67.t:0 "[FROM.GetLeader] Bizi bir Uranyum Geliştirme Ortaklığına Davet Ediyor"
 ww_congo.68.a:0 "Mükemmel!"
 ww_congo.68.desc:0 "\n [FROM.GetNameDef]'in lideri [FROM.GetLeader], onlara önerdiğimiz Uranyum Geliştirme Ortaklığı'na katılmayı kabul etti ve nükleer programları şimdi nihayet yeni edindikleri uranyumla tekrar yoluna girebilir."
 ww_congo.68.t:0 "[FROM.GetLeader] Uranyum Geliştirme Ortaklığına Katılıyor"
 ww_congo.69.a:0 "Çok kötü..."
 ww_congo.69.desc:0 "\n [FROM.GetNameDef]'in lideri [FROM.GetLeader], Uranyum Geliştirme Ortaklığı'na davetimizi reddetti ve düşmana sızabilecek herhangi bir bilgiyi açığa vurmanın, ilk etapta böyle bir teklifi kabul edemeyecek kadar tehlikeli olduğu için tüm nükleer programları gizli tutmaları gerektiğini iddia etti."
 ww_congo.69.t:0 "[FROM.GetLeader] Fikrimizi Reddediyor"
 ww_congo.7.a:0 "Harika!"
 ww_congo.7.desc:0 "[BEL.GetNameDef]'deki sömürge yönetimi, 'sömürge nüfusunun sosyal koşullarını iyileştirme' amacıyla madencilik üretimini azaltarak gıda üretimini artırma talebimizi onayladı."
 ww_congo.7.t:0 "[BEL.GetAdjective]ler Gıda Üretim Planımızı Onaylıyor"
 ww_congo.70.a:0 "İyi uçuşlar"
 ww_congo.70.desc:0 "Pilotumuz Jan Zumbach bizi terk etti ve RAF için savaşa katılmaya karar verdi. Yoldaşlarını terk etme kararı kolay olmadı, ancak baskıdan arınmış bağımsız bir Polonya için savaşmak istemesinden dolayı onu alkışlamalıyız."
 ww_congo.70.t:0 "Jan Zumbach [ENG.GetAdjective]lere katılıyor"
 ww_congo.71.a:0 "Gitmesine izin ver"
 ww_congo.71.b:0 "Çıkışını engelle!"
 ww_congo.71.desc:0 "Polonya'dan buraya gelen as pilotumuz Jan Zumbach, bizi terk etmek istediğini ve orada bir hava kuvveti kurulmasına yardım etmek için Kongo'ya gitmek istediğini belirtti. Bunu yapmasına izin vermeli miyiz?"
 ww_congo.71.t:0 "Jan Zumbach Kongo'ya Gitmek İstiyor"
 ww_congo.72.a:0 "Onu işe koyacağız"
 ww_congo.72.desc:0 "Polonyalı avcı pilotu Jan Zumbach az önce ülkemize geldi ve hava kuvvetlerimize katılıp bizim için savaşmak istediğini belirtti. Elbette ona atayabileceğimiz bir rol vardır?"
 ww_congo.72.t:0 "Jan Zumbach Geldi"
 ww_congo.73.a:0 "Toprağımızdan vazgeçmeyeceğiz."
 ww_congo.73.b:0 "Kabul etmekten başka çaremiz yok."
 ww_congo.73.desc:0 "[FROM.GetAdjective] diplomatları bize bir barış teklifiyle başvurdu. Teklif, belirli Afrika toprakları üzerindeki iddialarımızdan vazgeçmeyi ve kuvvetlerimizi bölgeden çekmeyi kabul etmemize bağlı. Bunu kabul ediyor muyuz?"
 ww_congo.73.t:0 "[FROM.GetNameDefCap] Kolonimizin Bağımsızlığı için Barış Teklif Ediyor"
 ww_congo.8.a:0 "Nasıl gelişeceğini görmemiz gerekecek"
 ww_congo.8.desc:0 "Kongolu halkın iyi derecede Fransızca bilen, Hristiyanlığa bağlı ve bir tür ilköğretim sonrası eğitime sahip büyük bir büyüyen kesimi var. Sömürge yöneticileri onlara Évolué, yani Avrupalılaşmış insanlar demeye başladılar ve bir sömürge yönetiminin gereklilikleri nedeniyle toplumumuzda ne kadar yükselebilecekleri konusunda hala sınırlı olsalar da, daha eğitimli bir nüfus kesinlikle bir gün ulusumuza refah getirecektir."
 ww_congo.8.t:0 "Yeni Bir Orta Sınıfın Ortaya Çıkışı"
 ww_congo.9.a:0 "Bu adamlar kesinlikle ulusumuzu bağımsızlığa taşıyacak"
 ww_congo.9.desc:0 "Son zamanlarda büyüyen orta sınıfımız ve kentsel alanlarda ilköğretim sonrası eğitime sahip birçok insanla birlikte, birçok [COG.GetAdjective] siyasi teorisyenlerin eserlerini okumaya başladı ve birçok yeni politikacı ve bağımsızlık savunucusu sahneye çıkmaya başlıyor. Bu, [COG.GetAdjective] ulusu için yeni bir şafak demek!"
 ww_congo.9.t:0 "Évolué [ROOT.GetAdjective] Siyasetine Girmeye Başlıyor"
 yugoslavia_mefo_bills_tt:0 "§Y[GetMilitaryProductionModifierName]§! maliyetini düşürmek için Yugoslav altınını kullanır.\n"
