 GER_georgian_legion_recruitment_tt:0 "İki Gürcü Lejyonu §YPiyade§! birimi kazan"
 GER_idea_added_for_limited_time:0 "Aşağıdaki fikir §Y$TIME$§! gün boyunca eklenecektir: \n$IDEA$"
 GER_inner_circle.01.a:0 "[GetAscendedAdvisorName1]'i değiştir"
 GER_inner_circle.01.b:0 "[GetAscendedAdvisorName2]'yi değiştir"
 GER_inner_circle.01.c:0 "[GetAscendedAdvisorName3]'ü değiştir"
 GER_inner_circle.01.d:0 "[GetAscendingAdvisorName], Führer'in güvenine layık değil"
 GER_inner_circle.01.desc:0 "[GetAscendingAdvisorName] güçlü bir hırs göstermiş ve Parti içinde nüfuz kazanmıştır. Ancak, daha fazla kontrol sağlama çabaları diğer üyelerden itirazlara yol açmış ve bir güç mücadelesiyle sonuçlanmıştır. Soru, [GetAscendingAdvisorName]'in [GER.GetLeader]'i İç Çember'de bir yer edinmek için yeterince etkileyip etkilemediğidir."
 GER_inner_circle.01.t:0 "[GetAscendingAdvisorName]'in Yükselişi"
 GER_inner_circle.02.a:0 "[GetAscendedAdvisorName1] ulusu yönetecek."
 GER_inner_circle.02.b:0 "[GetAscendedAdvisorName2] bu görev için en uygun olanıdır."
 GER_inner_circle.02.c:0 "[GetAscendedAdvisorName3], [ROOT.GetAdjective] halkının gerçek bir lideri olacak."
 GER_inner_circle.02.d:0 "Liderlik değişikliğine hazır değiliz."
 GER_inner_circle.02.desc:0 "[GER.GetLeader]'e en yakın Reichleiter'lar, [GER.GetLeader.GetHersHis] liderliğini ve [GER.GetLeader.GetSheHe]'nin [GER.GetNameDef]'in geleceği için sahip olduğu vizyonu sorgulamaya başladılar. Şimdi [GER.GetLeader]'i iktidardan indirmek ve Führer unvanını kendileri için ele geçirmek için komplo kuruyorlar. Soru şu ki, kim diğerlerinin üzerine çıkıp şanlı bir geleceğe giden yolu açacak?"
 GER_inner_circle.02.t:0 "Yeni bir Führer Yükseliyor"
 GER_inner_circle.03.a:0 "[GetIntrigueCharacterName], Führer'in tam güvenine sahiptir."
 GER_inner_circle.03.b:0 "$GER_fritz_todt$ bununla başa çıkmak için gerekli deneyime sahip."
 GER_inner_circle.03.c:0 "$GER_albert_speer$ sanayi işlerini devralacak."
 GER_inner_circle.03.d:0 "$GER_hermann_goring$ Führer'in sağ koludur, onu atayın!"
 GER_inner_circle.03.desc:0 "[GER.GetLeader]'in İç Çemberi içindeki rakipler arasında acı bir güç mücadelesi patlak verdi. [GetIntrigueCharacterName]'in nüfuz kazanması ve otoritesini artırmasıyla gerilimler yükseldi. [GetIndustrialReichsleiterNames], Alman sanayilerini ve silah üretimini en iyi nasıl yönetecekleri konusunda birbirlerinin yöntemleri hakkında seslerini yükselttiler, hepsi de [GER.GetLeader]'in gözüne girmek için yarışırken."
 GER_inner_circle.03.t:0 "[GetIntrigueCharacterName]'in Sanayi Planı Sorgulanıyor"
 GER_inner_circle_himmler.00.a:0 "Waffen-SS önceliğimizdir"
 GER_inner_circle_himmler.00.b:0 "İstihbaratımızı geliştirmeye odaklan"
 GER_inner_circle_himmler.00.desc:0 "Himmler, hem SS'in hem de Gestapo'nun kontrolünü ele geçirdikten sonra Alman siyaseti ve politika yapımı üzerinde önemli bir nüfuz biriktirdi. Bu onu Alman işlerinde güçlü bir figür yapsa da, bu örgütlerden birini güçlendirmek için sadece sınırlı bir zamanı var. Soru şu ki, hangisi öncelik alacak?"
 GER_inner_circle_himmler.00.t:0 "Himmler'in Görevleri"
 GER_inner_circle_himmler_gestapo_tt:0 "§Y$GER_heinrich_himmler$§!, yakında §Y$GER_expand_gestapo$§! odağına yönelik çalışmalara başlayacak."
 GER_inner_circle_himmler_ss_tt:0 "§Y$GER_heinrich_himmler$§!, yakında §Y$GER_expand_ss_security_duties$§! odağına yönelik çalışmalara başlayacak."
 GER_inner_circle_industrial_reichsleiter:0 "[GetIndustrialReichsleiterNames]"
