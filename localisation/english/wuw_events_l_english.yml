 AUS_seeks_a_deal_desc_56:0 "[FROM.GetNameDef] ile önerdiğimiz anlaşma onaylandı. Önemli bir endüstriyel yatırım karşılığında [FROM.GetAdjective]ler, talebimiz uyarınca [39.GetName] ve [850.GetName] eyaletlerini devretmeyi kabul ettiler."
 AUS_seeks_a_deal_desc_57:0 "[FROM.GetADjective]'den gelen yanıt bize ulaştı, anlaşmayı kabul etmiyorlar. Topraklarının satılık olmadığını belirterek, söz konusu eyaletlerle ilgili bir satış veya herhangi bir anlaşma olasılığını kesin bir şekilde reddediyorlar."
 AUS_seeks_a_deal_title_56:0 "[FROM.GetNameDefCap] Endüstriyel Yatırımlar Karşılığında Eyaletleri Devrediyor"
 AUS_seeks_a_deal_title_57:0 "[FROM.GetNameDefCap] Önerdiğimiz Anlaşmayı Reddediyor"
 AUS_treaty_asked_permission_key:0 "Onları durdurmak için elimizden gelenin en iyisini yapmamıza rağmen, [AUS.GetAdjective] hükümeti, antlaşmayı açıkça ihlal ederek [AUS.GetNameDef]'in yeniden silahlandırılması emrini vermeye karar verdi. Bunun bu noktaya gelmeyeceğini ummuştuk ama görünüşe göre onları bu yoldan alıkoyacak hiçbir şey yok."
 AUS_treaty_no_permission_key:0 "Hiçbir uyarı olmaksızın, [AUS.GetNameDef]'in artık Saint-Germain-En-Laye Antlaşması'na ve içerdiği her şeye uymayacağı konusunda bilgilendirildik. En önemlisi, bu, artık Büyük Savaş'tan sonra kendilerine konulan sınırlamalara aldırmadan serbestçe yeniden silahlanacakları anlamına geliyor. Neden aniden yeniden silahlanmak istedikleri belirsizliğini koruyor."
