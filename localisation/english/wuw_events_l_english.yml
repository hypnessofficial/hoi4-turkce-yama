 lokot_autonomy_has_been_established_flag:0 "§YLokot Özerkliği§! kuruldu"
 monroe_country_in_opposition_flag:0 "Bu ülke zaten Monroe Doktrini'ne karşı tavır aldı."
 monroe_country_in_support_flag:0 "Bu ülke zaten Monroe Doktrini'ni destekleyen bir tavır aldı."
