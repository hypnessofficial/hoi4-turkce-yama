 warning_they_may_instead_apporach_our_neighbor_tt:0 "§R[FROM.GetNameDefCap] bunun yerine Komşumuza yaklaşabilir§!"
 when_intercontinental_bomber_project_is_completed_tt:0 "Özel Proje §Y$sp_air_intercontinental_bomber$§! tamamlandığında:"
 wuw_GER_chinese_diplomacy.1.a:0 "Bu işe yarayacak"
 wuw_GER_chinese_diplomacy.1.desc:0 "\nBatıdaki büyük müttefiklerimiz [FROM.GetAdjective]ler, bize silah ve mühimmat sevkiyatları gönderdi. Ancak hepsi bu kadar değil, çünkü aynı zamanda askeri ekonomimizin yüzyıllarca süren aşağılanmadan sonra tekrar yoluna girmesi için kendi silahlarımızın geliştirilmesinde bize yardımcı olacak bir grup mühendis ve sanayici de gönderdiler."
 wuw_GER_chinese_diplomacy.1.t:0 "[FROM.GetNameDefCap] Bize Silah ve Malzeme Gönderiyor"
 wuw_GER_chinese_diplomacy.2.a:0 "Gerçekten de harika bir dost"
 wuw_GER_chinese_diplomacy.2.b:0 "Doğal kaynaklarımızı sunamayız"
 wuw_GER_chinese_diplomacy.2.desc:0 "\nBatıdaki büyük müttefiklerimiz [FROM.GetAdjective]ler, bize bir heyet gönderdi. Heyet, doğal kaynaklarımızla ilgili daha iyi ticaret anlaşmaları hakları karşılığında sanayimize yatırım yapmaya hazır olduklarını belirtiyor. Gerçekten de iyi bir dosta sahipler."
 wuw_GER_chinese_diplomacy.2.t:0 "[FROM.GetNameDefCap] Kaynak Hakları Karşılığında Sanayi Yardımı Teklif Ediyor"
 wuw_GER_chinese_diplomacy.3.a:0 "Harika"
 wuw_GER_chinese_diplomacy.3.desc:0 "\nHeyetlerimiz görkemli haberlerle döndü. [FROM.GetAdjective] hükümetinin onlara önerdiğimiz anlaşmayı imzalamaktan çok memnun olduklarını ve paktın derhal yürürlüğe gireceğini belirtiyorlar. Böylece sanayileşmelerine yardım etmenin küçük bir bedeli karşılığında doğal kaynaklarına başarıyla erişim sağladık."
 wuw_GER_chinese_diplomacy.3.t:0 "[FROM.GetNameDefCap] Teklifimizi Kabul Ediyor"
 wuw_GER_chinese_diplomacy.4.a:0 "Gerçekten hayal kırıklığı"
 wuw_GER_chinese_diplomacy.4.desc:0 "\nHeyetlerimiz hayal kırıklığı yaratan haberlerle döndü. [FROM.GetAdjective] hükümetinin, sanayi yardımı kisvesi altında onları sömürmeye çalıştığımızı iddia ederek anlaşmayı imzalamayı reddettiğini belirtiyorlar."
 wuw_GER_chinese_diplomacy.4.t:0 "[FROM.GetNameDefCap] Teklifimizi Reddediyor"
 wuw_GER_chinese_diplomacy.5.a:0 "Harika bir girişim!"
 wuw_GER_chinese_diplomacy.5.b:0 "Bunun bize yardımcı olacağını düşünmüyoruz"
 wuw_GER_chinese_diplomacy.5.desc:0 "Batıdaki büyük müttefiklerimiz [FROM.GetAdjective]ler, bize yeni teknoloji geliştirme konusunda işbirliği yapmaya başlamamızı talep eden bir heyet gönderdi ve yeni planlanan programlarını 'Çin-Alman Ortak Araştırma Programı' olarak adlandırdı. Onlara katılmalı mıyız?"
 wuw_GER_chinese_diplomacy.5.t:0 "Çin-Alman Ortak Araştırma Programı"
 wuw_GER_chinese_diplomacy.6.a:0 "Harika"
 wuw_GER_chinese_diplomacy.6.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], teklifimizi kabul etmeye karar verdi ve Çin-Alman Ortak araştırma Programımıza büyük ilgi gösterdiğini belirtti. Şimdi, işe başlama zamanı!"
 wuw_GER_chinese_diplomacy.6.t:0 "[FROM.GetNameDefCap] İşbirliğini Kabul Ediyor"
 wuw_GER_chinese_diplomacy.7.a:0 "Neyi kaçırdıklarının farkında değiller"
 wuw_GER_chinese_diplomacy.7.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], teklifimizi reddetmeye karar verdi ve Batı teknolojisi olmadan kendi başlarına idare edebileceklerini iddia ediyor. Olan oldu..."
 wuw_GER_chinese_diplomacy.7.t:0 "[FROM.GetNameDefCap] İşbirliğini Reddediyor"
 wuw_GER_civil_war.1.a:0 "Hoş geldiniz yoldaşlar!"
 wuw_GER_civil_war.1.b:0 "Birinin onlara göz kulak olması gerekiyor"
 wuw_GER_civil_war.1.desc:0 "Wehrmacht'ın Nazi rejimine karşı son darbesiyle birlikte, daha önce ülkeyi terk eden birçok komünist şimdi sınırlarımızdan geri akıyor, çünkü bir zamanlar kendilerine haksızlık edenlere karşı savaşımızda yardım etme fırsatını görüyorlar. Savaşmalarına izin vermeli miyiz, yoksa kendi devrimlerini yapacak kadar popüler olmamaları umuduyla geri dönüşlerini örtbas etmeye mi çalışmalıyız?"
 wuw_GER_civil_war.1.t:0 "Yurtdışındaki Komünistler Eve Dönüyor"
 wuw_GER_civil_war.2.a:0 "İlginç bir gelişme"
 wuw_GER_civil_war.2.desc:0 "Bir grup komünist partizanın Saksonya'daki Bautzen hapishanesine girip sadık komünist ve KPD'nin eski lideri Ernst Thälmann'ı serbest bıraktığına dair bir rapor geldi. Parti rakibi Walter Ulbricht, hapishaneye yapılan saldırıyı karşı-devrimci bir terör eylemi olarak kınadı, bu ifade muhtemelen geniş çapta sevilen Thälmann'ın partinin liderliğini geri kazanabileceğinden korkmasından kaynaklanıyor."
 wuw_GER_civil_war.2.t:0 "Ernst Thälmann Hapisten Kurtarıldı"
 wuw_GER_civil_war.3.a:0 "Yeni bir Bismarckjugend en öncelikli olmalı"
 wuw_GER_civil_war.3.b:0 "Eğer bir şey yapacaksak Demir Cephe'yi güçlendirmeliyiz"
 wuw_GER_civil_war.3.desc:0 "Politikacılarımız ve generallerimiz son zamanlarda askerlerimizin saflarına paramiliter kanatlar ekleme fikrini tartışıyorlar. Muhafazakar partiler, DNVP ile ilişkili anti-Marksist gençlik hareketi olan Bismarck Gençliği'nin yeniden kurulmasını istiyor. Ancak diğerleri, silahlı kuvvetlerimiz içinde daha fazla paramiliter kullanmak istiyorsak, zaten savaşan sosyal-demokrat Eiserne Front'u güçlendirmek için birinci sınıf bir organizasyon olarak görüyor."
 wuw_GER_civil_war.3.t:0 "Paramiliter Kanatların Yeniden Oluşturulması"
 wuw_GER_civil_war.4.a:0 "Onları tamamen dağıtmaya çalış"
 wuw_GER_civil_war.4.b:0 "Belki şimdilik onları sadece terhis edebiliriz?"
 wuw_GER_civil_war.4.desc:0 "İç savaşın sona ermesi ve Nazi rejiminin tamamen dağılmasıyla birlikte, ülkemizde açıkça siyasi paramiliter örgütlerin serbestçe faaliyet göstermesine izin vermenin gerçekten akıllıca bir hareket olup olmadığı sorusu gündeme geldi. Cunta'nın onlar üzerinde resmi bir kontrolü olmadığı için, onları yasaklamak ve dağılmalarını zorlamak akıllıca olabilir. Aksi takdirde, belki onları etrafta tutmaya çalışabilir ve sadece bir tehdit olmamaları gereken noktaya kadar küçültebilir miyiz?"
 wuw_GER_civil_war.4.t:0 "Paramiliter Kanatların Geleceği"
 wuw_GER_civil_war.5.a:0 "Başarılı olmalarına izin verilemez!"
 wuw_GER_civil_war.5.desc:0 "Silezya'daki Alman askerlerine ateş açan Silezyalı ve Polonyalı partizanlara dair raporlar bize ulaştı. Ulusları için bağımsızlık istiyorlar ve iç savaşımızı ayrılmak için ihtiyaç duydukları cesareti toplamak için bir zayıflık işareti olarak gördüler. Hedeflerine ulaşmamalarını ve isyanlarının mümkün olan en kısa sürede bastırılmasını sağlamalıyız."
 wuw_GER_civil_war.5.t:0 "Dördüncü Silezya Ayaklanması"
 wuw_GER_civil_war.6.a:0 "Proletarya için!"
 wuw_GER_civil_war.6.b:0 "Bu ayaktakımını ezeceğiz!"
 wuw_GER_civil_war.6.desc:0 "Proletaryadan gelen yoğun muhalefetle geçen bir sürenin ardından [ROOT.GetNameDef]'deki durum düşmanca bir hal aldı. [ROOT.GetLeader]'in kuvvetleri sürekli ayaklanmaların ardından birçok eyalette alt edildi. Bu isyanın ne olacağı henüz belli değil."
 wuw_GER_civil_war.6.t:0 "[ROOT.GetNameDef]'de Komünist İç Savaş"
 wuw_GER_civil_war.7.a:0 "Sadakatlerini ne pahasına olursa olsun güvence altına almalıyız"
 wuw_GER_civil_war.7.b:0 "Erich Raeder'i yatıştırmamalıyız"
 wuw_GER_civil_war.7.desc:0 "Dar-ı harbimizi icra ettiğimizde Kriegsmarine'in [ROOT.GetLeader] ile taraf tutabileceği dikkatimizi çekti. Sebep, liderleri Erich Raeder'e [ROOT.GetLeader] tarafından, eski hükümetin başaramadığı bir şey olan, rejiminde askeri şubesinin ağır yatırımlar ve özgürlükler kazanacağına söz verilmesi gibi görünüyor. Belki de onu bizim tarafımıza çekmek için benzer sözler vermeliyiz?"
 wuw_GER_civil_war.7.t:0 "Kriegsmarine'in Sadakati"
 wuw_GER_civil_war.8.a:0 "İhanetlerinin bedelini ödeyecekler!"
 wuw_GER_civil_war.8.b:0 "Devlet sözlerini tutmadığı için pişman olacak"
 wuw_GER_civil_war.8.desc:0 "Donanmayı eski ihtişamına kavuşturma sözümüzden yıllar sonra, Erich Raeder ve Kriegsmarine'in sonsuz ertelemelerimizden bıktığı görülüyor, çünkü bugün erken saatlerde hükümetimize karşı bir darbe girişiminde bulundular. Neyse ki başarısız oldu, ama bunun tekrar olmamasını sağlamak için, silahlı kuvvetlerimizdeki birçok üst düzey yetkiliyi ve unsuru tasfiye etmeliyiz..."
 wuw_GER_civil_war.8.t:0 "Kriegsmarine'in Darbesi"
 wuw_GER_civil_war.9.a:0 "Bize iyi hizmet etti"
 wuw_GER_civil_war.9.desc:0 "Nazi tehdidine karşı zafer güvence altına alındığında, askeri hükümetin başı August von Mackensen, yaşı ve kötüleşen durumu nedeniyle bir kez daha saha komutanlığından geri çekilmeye karar verdi ve bundan sonra sadece idari görevlere yardımcı olacağını belirtti."
 wuw_GER_civil_war.9.t:0 "August von Mackensen Askerlikten Emekli Oluyor"
 wuw_GER_diplomacy.1.a:0 "Bundan ikimiz de kazançlı çıkarız."
 wuw_GER_diplomacy.1.b:0 "Bu anlaşma sadece birimize fayda sağlayacak..."
 wuw_GER_diplomacy.1.t:0 "[FROM.GetNameDefCap] bir ticaret ortaklığı teklif ediyor"
 wuw_GER_diplomacy.10.a:0 "Hayır demeye cesaret edemiyoruz...."
 wuw_GER_diplomacy.10.b:0 "Bu kabul edilemez!"
 wuw_GER_diplomacy.100.a:0 "Öyle olsun"
 wuw_GER_diplomacy.100.desc:0 "[FROM.GetName] büyükelçisi, üzerinde anlaştığımız işgal maliyeti ödemesini onlardan artık almayacağımızı bize bildirdi."
 wuw_GER_diplomacy.100.t:0 "[FROM.GetAdjective] İşgal Maliyeti Ödemeleri Duruyor"
 wuw_GER_diplomacy.101.a:0 "Mantıksız [FROM.GetAdjective]ler..."
 wuw_GER_diplomacy.101.desc:0 "Tüm taraflar için bariz faydalarına rağmen, [FROM.GetNameDef] teknoloji paylaşımı girişimimize katılmayı reddetti. Teknolojileriyle bize güvenilmeyeceğini belirterek teklifimizi reddettiler ve onlara böyle bir aptallık önermememizi istediler."
 wuw_GER_diplomacy.101.t:0 "[FROM.GetNameDefCap] Teknoloji Paylaşımı Girişimini Onaylamıyor"
 wuw_GER_diplomacy.102.a:0 "Harika"
 wuw_GER_diplomacy.102.desc:0 "[FROM.GetNameDef] ile bir saldırmazlık paktı yapma talebimiz onaylandı. Bundan sonra her ikimiz de birbirimize karşı saldırganlıktan kaçınacağız. Bunun her iki ulusumuza da büyük fayda sağlayacağından eminiz."
 wuw_GER_diplomacy.102.t:0 "[FROM.GetNameDefCap] Saldırmazlık Paktını Kabul Ediyor"
 wuw_GER_diplomacy.103.a:0 "Endişe verici"
 wuw_GER_diplomacy.103.desc:0 "Her ikimiz için de bariz faydalarına rağmen [FROM.GetNameDef], önerilen Saldırmazlık Paktı'nı reddetti. Bunun arkasındaki mantığı bilmiyoruz, ancak reddetmeleri oldukça endişe verici. Onları yakından izleyeceğiz."
 wuw_GER_diplomacy.103.t:0 "[FROM.GetNameDefCap] Saldırmazlık Paktını Reddediyor"
 wuw_GER_diplomacy.104.a:0 "Harika!"
 wuw_GER_diplomacy.104.desc:0 "[FROM.GetAdjective]lerden, Nüfuz Alanlarımızı kurma fikrini onayladıklarına dair haber aldık. Bu, düşmanlıkları önleyecek ve yakın bölgemizdeki topraklar üzerindeki çatışma riskini azaltacaktır."
 wuw_GER_diplomacy.104.t:0 "[FROM.GetNameDefCap] Nüfuz Alanları Kurulumunu Kabul Ediyor"
 wuw_GER_diplomacy.105.a:0 "Ne kadar Kaba!"
 wuw_GER_diplomacy.105.desc:0 "[FROM.GetAdjective]lerden, nüfuz alanımızı tanımayı ve kabul etmeyi reddedeceklerine dair bir haber aldık, kendi nüfuz alanları için ise kendi nüfuz alanlarını bizim tarafımızdan bir müdahale olmaksızın kendilerinin belirleyeceklerini belirttiler. Bu, bölgede bazı gerilimlere neden olabilir."
 wuw_GER_diplomacy.105.t:0 "[FROM.GetNameDefCap] Nüfuz Alanları Kurulumunu Reddediyor"
 wuw_GER_diplomacy.107.a:0 "Neden olmasın?"
 wuw_GER_diplomacy.107.b:0 "Bu iyi bir zaman değil"
 wuw_GER_diplomacy.107.c:0 "Adil olmayan bir teklif, bunu bir daha asla önermeyin!"
 wuw_GER_diplomacy.107.desc:0 "[FROM.GetNameDef]'den bir teklif aldık. Sanayilerinin bir kısmını yeniden konumlandırma karşılığında uzun vadeli bir kaynak ticaretiyle ilgileniyorlar. Şu anda [FROM.FROM.GetName]'deki kaynaklara göz dikmiş durumdalar ve bunun bir kısmını almak istiyorlar."
 wuw_GER_diplomacy.107.t:0 "[FROM.GetAdjective]ler Kaynaklar Karşılığında Sanayi Teklif Ediyor"
 wuw_GER_diplomacy.108.a:0 "Harika"
 wuw_GER_diplomacy.108.desc:0 "Kaynaklarının bir kısmı karşılığında sanayiyi yeniden konumlandırma talebimizle ilgili olarak [FROM.GetAdjective]lerden haber aldık. Görünüşe göre bu anlaşmanın faydaları konusunda hemfikiriz ve bu anlaşmayı memnuniyetle kabul ettiler. Kaynakları yakında alacağız."
 wuw_GER_diplomacy.108.t:0 "[FROM.GetAdjective]'in Endüstriyel Yer Değiştirme Anlaşması"
 wuw_GER_diplomacy.109.a:0 "İlk seferde başaramazsan..."
 wuw_GER_diplomacy.109.desc:0 "Önerdiğimiz anlaşma konusunda çoğunlukla tarafsız olsalar da, [FROM.GetAdjective]ler kaynaklar karşılığında sanayileri onlara yeniden konumlandırma teklifimizi nihayetinde reddetmeyi seçtiler. Bunun iyi bir zaman olmadığını iddia ediyorlar, bu da ilişkimizi daha da güçlendirdikten sonra gelecekte bir anlaşmaya varabileceğimiz gibi bir izlenim bırakıyor."
 wuw_GER_diplomacy.109.t:0 "[FROM.GetAdjective]ler Endüstriyel Yer Değiştirme Anlaşmasını Reddediyor"
 wuw_GER_diplomacy.11.a:0 "Bu küstahlık!"
 wuw_GER_diplomacy.11.desc:0 "[FROM.GetName]'den [FROM.GetLeader], [FROM.GetLeader.GetSheHe]'nin iç siyasetlerine nüfuz etme yönündeki son girişimimiz hakkındaki düşüncelerini bize kesin bir dille bildirdi. Söylemeye gerek yok, diplomatlarımız mesajın bazı kısımlarını [ROOT.GetLeader]'e sunmadan önce yeniden ifade etmek zorunda kaldı."
 wuw_GER_diplomacy.11.t:0 "[FROM.GetNameDefCap] Planlarımızı Bozuyor"
 wuw_GER_diplomacy.110.a:0 "Bencil [FROM.GetAdjective]ler..."
 wuw_GER_diplomacy.110.desc:0 "Görünüşe göre [FROM.GetAdjective]lere sunduğumuz çok adil anlaşma soğuk bir reddedişle karşılandı. Sadece bu da değil, bu konuda bir daha onlara ulaşmamamızı çok açık bir şekilde belirttiler. Eğer o kaynakları istiyorsak, ... alternatif yollar bulmak zorunda kalabiliriz."
 wuw_GER_diplomacy.110.t:0 "[FROM.GetAdjective]ler Endüstriyel Yer Değiştirme Anlaşmasını Sert Bir Şekilde Reddediyor"
 wuw_GER_diplomacy.111.a:0 "Kabul etmekten başka seçeneğimiz yok..."
 wuw_GER_diplomacy.111.b:0 "Bunu kabul edemeyiz, sonuçları ne olursa olsun!"
 wuw_GER_diplomacy.111.desc:0 "[FROM.GetNameDef]'den gelen diplomatlar, İki Ülke Arasındaki Ekonomik İlişkilerin Geliştirilmesi için Alman-Romen Antlaşması teklifini imzalamamızda ısrar ettiler. Bu anlaşmanın her iki ülkeye de fayda sağlayacağını iddia ediyorlar, çünkü sanayileri için doğal kaynaklarımıza ihtiyaçları var ve biz de Alman silahları için daha iyi bir fiyat alıyoruz. Bu anlaşma Almanların iddia ettiği kadar bize faydalı görünmüyor, ama onları reddetmek kesinlikle onları kızdıracaktır..."
 wuw_GER_diplomacy.111.t:0 "Ekonomik İlişkilerin Geliştirilmesi için Antlaşma"
 wuw_GER_diplomacy.112.desc:0 "[FROM.GetLeader], [FROM.GetLeader.GetHerHis] ülkesinin çıkarlarını gözeten makul bir lider gibi görünüyor. Ne tesadüf ki, bu tek taraflı anlaşma aynı zamanda bizim ülkemizin de çıkarına. [FROM.GetName]'den gelen ekstra kaynakları iyi değerlendireceğiz."
 wuw_GER_diplomacy.113.b:0 "O zaman savaş!"
 wuw_GER_diplomacy.113.desc:0 "[FROM.GetLeader], [FROM.GetLeader.GetHerHis] ülkesi için en iyi olanı zerre kadar umursamayan, mantıksız ve basiretsiz bir lider gibi görünüyor. [FROM.GetAdjective] halkı bu aptallık yüzünden acı çekecek."
 wuw_GER_diplomacy.117.a:0 "Onlara karşı koymayı umamayız..."
 wuw_GER_diplomacy.117.b:0 "Asla boyun eğmeyeceğiz!"
 wuw_GER_diplomacy.118.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], [FROM.GetAdjective] ulusunun yönetimimize boyun eğeceğini açıkladı, bu en iyisi çünkü bizi durduracak güçleri yok ve savaşmak sadece topraklarına ve halkına yıkım getirir."
 wuw_GER_diplomacy.118.t:0 "[FROM.GetNameDefCap] Boyun Eğiyor"
 wuw_GER_diplomacy.119.desc:0 "İnatçı [FROM.GetAdjective]ler, ülkelerimizi daha güçlü bir varlık haline getirme teklifimizi reddettiler. Onlar için yaptığımız her şeyin karşılığı bu mu?"
 wuw_GER_diplomacy.119.t:0 "[FROM.GetNameDefCap] Boyun Eğmeyi Reddediyor"
 wuw_GER_diplomacy.2.desc:0 "[FROM.GetLeader], [FROM.GetLeader.GetHerHis] ülkesinin çıkarlarını gözeten makul bir lider gibi görünüyor. Ne tesadüf ki bu durum, aynı zamanda bizim ülkemizin de çıkarına. [FROM.GetName]'den gelen ekstra kaynakları iyi değerlendireceğiz."
 wuw_GER_diplomacy.2.t:0 "[FROM.GetNameDefCap] ticaret teklifimizi kabul etti"
 wuw_GER_diplomacy.20.a:0 "Zafer için birlikte!"
 wuw_GER_diplomacy.20.b:0 "Başka planlarımız var"
 wuw_GER_diplomacy.20.desc:0 "[FROM.GetLeader] bizzat [ROOT.GetLeader]'e [FROM.GetFactionName]'e bir davetiye uzattı. [FROM.GetAdjective] Yüksek Komutanlığı'ndan temsilciler, zaten heybetli olan ittifaklarıyla birlikte ortak düşmanlarımızı zahmetsizce yeneceğimizi ve yakın çevremizde [ROOT.GetAdjective] hakimiyetini sağlayacağımızı temin ediyorlar."
 wuw_GER_diplomacy.20.t:0 "[FROM.GetFactionName]'e bir Davet"
 wuw_GER_diplomacy.21.a:0 "Sürüye hoş geldiniz!"
 wuw_GER_diplomacy.21.desc:0 "Askeri Yüksek Komutanlığımız, yetenekli diplomatlarla birlikte [FROM.GetLeader]'i ve [FROM.GetAdjective] hükümetini ortak düşmanlarımızı ezmek için bizimle güçlerini birleştirmeye ikna etmeyi başardı. Elbette düşmanlarımızı yerle bir etmek için onların yardımına gerçekten ihtiyacımız yok, ama askerleri adamlarımız herhangi bir muhalefeti ezerken top yemi olarak işe yarayacaktır."
 wuw_GER_diplomacy.21.t:0 "[FROM.GetNameDefCap] [ROOT.GetFactionName]'e Katılıyor"
 wuw_GER_diplomacy.22.a:0 "Bakalım tek başlarına ne kadar dayanacaklar"
 wuw_GER_diplomacy.22.desc:0 "Tüm çabalarımıza ve [FROM.GetNameDef]'in güçlerimizi birleştirerek elde edeceği bariz avantajlara rağmen, [FROM.GetLeader] ve [FROM.GetAdjective] hükümeti [ROOT.GetFactionName]'e katılma davetimizi reddetme gibi hatalı bir karar aldı. Bu davet daha çok [FROM.GetName]'in yararına olduğu için bu durum bizim için pek bir şey değiştirmeyecektir."
 wuw_GER_diplomacy.22.t:0 "[FROM.GetNameDefCap] Davetimizi Reddediyor"
 wuw_GER_diplomacy.23.a:0 "[FROM.GetADjective]ler ikna edici bir gerekçe sunuyor"
 wuw_GER_diplomacy.23.b:0 "Bunun bize hiçbir faydası yok!"
 wuw_GER_diplomacy.23.desc:0 "[FROM.GetAdjective] lideri [FROM.GetLeader], en azından [FROM.GetLeader.GetHerHis]'e göre karşılıklı yarar sağlayan bir anlaşma önerisiyle bize başvurdu. [FROM.GetLeader.GetHerHis] eski sömürgelerini geri istiyor, ancak karşılığında tank üretimlerine dair bilgi ve ülkelerimiz arasında bir barış vaadi sunuyor."
 wuw_GER_diplomacy.23.t:0 "[FROM.GetNameDefCap] Eski Sömürgelerin Kontrolünü Talep Ediyor"
 wuw_GER_diplomacy.24.a:0 "Harika Haber!"
 wuw_GER_diplomacy.24.desc:0 "[FROM.GetNameDef]'den çok hoş bir mesaj aldık. Önerdiğimiz anlaşmanın faydasını gördüler ve daha önce onların kontrolü altında olan tüm eski sömürgelerimizi mülkiyetimize devrettiler."
 wuw_GER_diplomacy.24.t:0 "[FROM.GetAdjective]ler Eski [ROOT.GetAdjective] Sömürgelerini Devrediyor"
 wuw_GER_diplomacy.25.a:0 "Onların adına kötü bir karar..."
 wuw_GER_diplomacy.25.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader]'ı çok makul bir adam sanmıştık, ama yanılmış olabiliriz. [FROM.GetAdjective]ler, onlara sağlayacağı bariz faydalara rağmen önerdiğimiz anlaşmayı inatla reddediyor. Eski sömürgelerimiz olmadan idare etmek zorunda kalacağız."
 wuw_GER_diplomacy.25.t:0 "[FROM.GetAdjective]ler Eski Sömürgelerimizi Bize Devretmeyi Reddediyor."
 wuw_GER_diplomacy.26.a:0 "Yeterince adil görünüyor"
 wuw_GER_diplomacy.26.b:0 "Bu bizim için ilgi çekici değil"
 wuw_GER_diplomacy.26.desc:0 "[FROM.GetAdjective] lideri [FROM.GetLeader] bilimsel işbirliği için bir teklifle bize başvurdu. [FROM.GetLeader.GetSheHeCap], benzer ideolojilere sahip olmamıza rağmen donanmalarımızı yönetme şeklimizle ilgili çok farklı odak noktalarımız olduğunu ve burada işbirliği için geniş bir fırsat olduğunu belirtiyor. Bu pakta katılmak, bulgularımızın bir kısmını onlarla paylaşmak anlamına gelecektir, ancak aynı zamanda onlardan öğrenmemize de olanak tanıyacaktır."
 wuw_GER_diplomacy.26.t:0 "Ortak Araştırma için Bir Teklif"
 wuw_GER_diplomacy.27.a:0 "Harika!"
 wuw_GER_diplomacy.27.desc:0 "[FROM.GetAdjective] liderliği, önerdiğimiz ortak araştırma çabalarına çok olumlu yanıt verdi. Donanma çabalarımız büyük ölçüde farklılaştığı için, onlar da birbirimizden öğrenmenin değerini görüyorlar ki birlikte daha da güçlenebilelim."
 wuw_GER_diplomacy.27.t:0 "[FROM.GetNameDefCap] Ortak Araştırma Çabaları Kurmayı Kabul Ediyor"
 wuw_GER_diplomacy.28.desc:0 "[FROM.GetNameDef]'den gelen yanıt umduğumuz gibi değildi. Donanma mühendisliğindeki bulgularını paylaşmaya isteksiz görünüyorlar, hatta onlara kendi bulgularımızı onlarla paylaşmayı teklif eden çok faydalı bir anlaşma sunsak bile. Reddin yanı sıra, [FROM.GetAdjective] Donanması'nın bizimkinden çok daha üstün olduğu ve donanma teknolojisinde önemli ilerlemeler kaydedene kadar, bu tür bir anlaşmanın masadan kalktığı ifadesi geliyor."
 wuw_GER_diplomacy.28.t:0 "[FROM.GetNameDefCap] Araştırma Teklifimizi Reddediyor"
 wuw_GER_diplomacy.29.a:0 "Beklenmedik, ama memnuniyetle!"
 wuw_GER_diplomacy.29.b:0 "Bu işin içinde bir bit yeniği var gibi..."
 wuw_GER_diplomacy.29.desc:0 "[FROM.GetNameDef]'i veya en azından öncülünü bir müttefikimiz olarak gördüğümüz günler vardı. Son yıllarda birbirimizden uzaklaştık ama şimdi dostluğu yeniden canlandırmak istiyor gibi görünüyorlar. Karşılıklı yarar sağlayan bir ticaret anlaşması önererek [FROM.GetAdjective]ler bir kez daha bize el uzattı."
 wuw_GER_diplomacy.29.t:0 "Eski Müttefik Ticaret Anlaşması Öneriyor"
 wuw_GER_diplomacy.3.a:0 "Onların kaybı."
 wuw_GER_diplomacy.3.desc:0 "[FROM.GetLeader], [FROM.GetLeader.GetHerHis] ülkesi için en iyi olanı zerre kadar umursamayan, mantıksız ve basiretsiz bir lider gibi görünüyor. Aradığımızı bulmak için başka bir yere yöneleceğiz."
 wuw_GER_diplomacy.3.t:0 "[FROM.GetNameDefCap] ticaret teklifimizi reddetti"
 wuw_GER_diplomacy.30.a:0 "Harika haber!"
 wuw_GER_diplomacy.30.desc:0 "[FROM.GetNameDef] lideri [FROM.GetLeader], önerdiğimiz ticaret anlaşmasına olumlu yanıt verdi. Daha önce onlarla çok faydalı ticaret anlaşmaları yapmıştık ve [ROOT.GetLeader] bunun bize çok kâr getireceğinden çok emin."
 wuw_GER_diplomacy.30.t:0 "[FROM.GetAdjective]'in Ticaret Teklifini Kabulü"
 wuw_GER_diplomacy.31.a:0 "Onların kaybı"
 wuw_GER_diplomacy.31.desc:0 "Tarihi bağlarımıza ve onlara sağlayacağı açık faydaya rağmen [FROM.GetNameDef], önerdiğimiz ticaret anlaşmasını reddetti. Anlaşma, iki ülkemiz arasındaki ticareti kolaylaştıracak ve dostluğumuzu pekiştirecekti. Ne yazık ki, [FROM.GetAdjective]'in başka fikirleri vardı."
 wuw_GER_diplomacy.31.t:0 "[FROM.GetAdjective]'in Ticaret Teklifimizi Reddetmesi"
 wuw_GER_diplomacy.32.a:0 "O kirayı yeniden başlatmakla ilgilenmiyoruz"
 wuw_GER_diplomacy.32.b:0 "Orijinal anlaşmamıza sadık kalacağız"
 wuw_GER_diplomacy.32.desc:0 "1898'deki müzakereler sırasında [743.GetName], o zamanlar Alman İmparatorluğu olarak adlandırılan yere kiralanmıştı. Bugün halefleri [FROM.GetNameDef], bu kirayı yeniden başlatmak isteyen bize ulaştı. Orijinal kiranın 1997'ye kadar sürmesi gerekiyordu, ancak Büyük Savaş ve [JAP.GetAdjective] işgali tarafından kısa kesildi."
 wuw_GER_diplomacy.32.t:0 "[FROM.GetAdjective] [743.GetName]'in Kirasının Yeniden Başlatılmasını Talep Ediyor"
 wuw_GER_diplomacy.33.a:0 "Ne kadar kaba bir davranış!"
 wuw_GER_diplomacy.33.desc:0 "1898'deki anlaşmamız açıktı, [743.GetName] 1997'ye kadar bizimdi, ancak [FROM.GetAdjective]ler soğuk davranıyor gibi görünüyor. Sadece o savaş ve ardından gelen [JAP.GetAdjective] işgali yüzünden anlaşmamızın artık geçerli olmadığını düşünüyor gibi görünüyorlar. Anlaşma böyle bir madde detaylandırmıyor, ama görünüşe göre pek seçeneğimiz yok. [743.GetName]'i geri istiyorsak, daha sert önlemlere başvurmak zorunda kalabiliriz."
 wuw_GER_diplomacy.33.t:0 "[FROM.GetNameDefCap] Anlaşmamıza Geri Dönmeyi Reddediyor"
 wuw_GER_diplomacy.34.a:0 "Harika haber!"
 wuw_GER_diplomacy.34.desc:0 "[FROM.GetAdjective]ler en sadık ortaklar olduklarını kanıtladılar. [743.GetName]'in 99 yıllık kirasını 1898'de imzalamıştık, ancak Büyük Savaş dünyaya yayıldıkça kira kesintiye uğradı. [JAP.GetNameDef] tarafından bir süre işgal edildikten sonra bölge [FROM.GetNameDef]'e iade edildi, ama neyse ki anlaşmamıza sadık kalacaklar."
 wuw_GER_diplomacy.34.t:0 "[FROM.GetNameDefCap] [743.GetName] Kirasına Geri Dönüyor"
 wuw_GER_diplomacy.35.a:0 "O topraklar onların değil!"
 wuw_GER_diplomacy.35.b:0 "Onları reddetme riski buna değmez!"
 wuw_GER_diplomacy.35.desc:0 "[FROM.GetAdjective] lideri [FROM.GetLeder]'den haber aldık, [FROM.GetLeader.GetSheHe] şu anda bizim kontrolümüzdeki eski sömürgelerinin kontrolünü yeniden kazanmak istiyor. İletişim yeterince zararsız görünüyor, ancak [FROM.GetNameDef] siyasetinin mevcut durumu göz önüne alındığında, reddedersek korkunç sonuçları olabilir."
 wuw_GER_diplomacy.35.t:0 "[FROM.GetNameDefCap] Eski Sömürgelerin Kontrolünü Talep Ediyor"
 wuw_GER_diplomacy.36.a:0 "O topraklar bizim!"
 wuw_GER_diplomacy.36.desc:0 "[FROM.GetNameDef]'e açıkça belirttiğimizi sanmıştık, haklı sömürgelerimizin devri isteğe bağlı değildi. Yine de, doğru olanı ve onlar için en iyisini yapmayı inatla reddediyorlar. Hala bu topraklarda hak iddia ediyoruz ve onlar bizim yolumuzda durma hakkına sahip değiller!"
 wuw_GER_diplomacy.36.t:0 "[FROM.GetAdjective]'in Sömürgelerimizi Devretmeyi Reddetmesi"
 wuw_GER_diplomacy.37.a:0 "Akıllıca bir seçim"
 wuw_GER_diplomacy.37.desc:0 "Sömürgelerimizi [FROM.GetNameDef]'den geri alma talebimiz [FROM.GetLeader] tarafından anlayış ve uyumla karşılandı. İlişkilerimizi topraktan daha yüksek tuttuklarını belirterek, haklı olarak bizim olan toprağı bize tekrar lütufkar bir şekilde devrettiler."
 wuw_GER_diplomacy.37.t:0 "[FROM.GetNameDefCap] Bize Toprak Devrediyor"
 wuw_GER_diplomacy.38.a:0 "[GetGERAfricanColonyOverlordOption]"
 wuw_GER_diplomacy.38.b:0 "Kesinlikle olmaz!"
 wuw_GER_diplomacy.38.desc:0 "[GetGERAfricanColonyOverlordDesc]"
 wuw_GER_diplomacy.38.t:0 "[FROM.GetAdjective] Toprak Talep Ediyor"
 wuw_GER_diplomacy.39.a:0 "Harika!"
 wuw_GER_diplomacy.39.desc:0 "[FROM.GetAdjective] liderliğine yönelik taleplerimiz isteksiz bir onayla karşılandı. Topraklarını devretmekten pek de memnun görünmeseler de, bu konudaki düşünceleri bizi ilgilendirmiyor, haklı olarak bizim olan toprağı almak bizi ilgilendiriyor."
 wuw_GER_diplomacy.39.t:0 "[FROM.GetNameDefCap] Bize Toprak Devrediyor"
 wuw_GER_diplomacy.40.a:0 "Başka bir yol bulacağız"
 wuw_GER_diplomacy.40.desc:0 "[FROM.GetAdjective] lideri [FROM.GetLeader] ve [FROM.GetAdjective] liderliğinin geri kalanı üzerindeki giderek artan baskıya rağmen, yerlerinden kıpırdamayacaklar. Şu anda onların kontrolü altında olan eski sömürgelerimizin kontrolünü barışçıl bir şekilde ele alamayacağız."
 wuw_GER_diplomacy.40.t:0 "[FROM.GetNameDefCap] Toprak Taleplerimizi Reddediyor"
 wuw_GER_diplomacy.50.a:0 "Kanlı Mükemmel!"
 wuw_GER_diplomacy.50.b:0 "Kraut'larla işbirliği yok!"
 wuw_GER_diplomacy.50.desc:0 "\n[FROM.GetNameDef]'e ait diplomatlar ve deniz mühendisleri bize tuhaf bir teklifle başvurdu. İki ülkemiz arasında gelişmeleri ve teknikleri paylaşarak kapsamlı bir denizcilik işbirliği programı başlatmak istediklerini iddia ediyorlar. Bu bize fayda sağlayabilir, ama aynı zamanda gizli bilgilerin [FROM.GetAdjective]lere sızması için de bir risktir. Ne diyoruz?"
 wuw_GER_diplomacy.50.t:0 "[FROM.GetNameDefCap] Denizcilik Geliştirme İşbirliği başlatmak istiyor"
 wuw_GER_diplomacy.51.a:0 "Donanmamız bir kez daha güçlenecek"
 wuw_GER_diplomacy.51.desc:0 "[FROM.GetLeader] bugün, onlara yakın zamanda sunduğumuz denizcilik işbirliği anlaşması lehine konuştu ve [FROM.GetAdjective] deniz mühendislerinin şimdiden gelecek hafta kadar erken bir zamanda deniz araçları ve silahlarının ortak geliştirme ve araştırmasına başlamak istediklerini iddia ediyor. Bu, [ROOT.GetNameDef] ve donanması için harika bir gün!"
 wuw_GER_diplomacy.51.t:0 "[FROM.GetNameDefCap] Denizcilik Geliştirme İşbirliğini Kabul Ediyor"
 wuw_GER_diplomacy.52.a:0 "Aptalca bir seçim"
 wuw_GER_diplomacy.52.desc:0 "[FROM.GetLeader] bugün, onlara yakın zamanda sunduğumuz denizcilik işbirliği anlaşmasına karşı konuştu ve bunun [FROM.GetAdjective] mühendislik sırlarını çalmak için açık ve bariz bir hile olduğunu iddia ediyor..."
 wuw_GER_diplomacy.52.t:0 "[FROM.GetNameDefCap] Denizcilik Geliştirme İşbirliğini Reddediyor"
 wuw_GER_diplomacy.53.a:0 "Bundan ikimiz de kazançlı çıkarız."
 wuw_GER_diplomacy.53.b:0 "Bu anlaşma sadece birimize fayda sağlayacak..."
 wuw_GER_diplomacy.53.desc:0 "[FROM.GetNameDef]'e ait diplomatlar kazançlı bir teklifle bize başvurdular. Sömürgelerimizdeki belirli doğal kaynak yataklarının haklarını satın almak istiyorlar ve karşılığında endüstriyel yardım teklif ediyorlar. Bu anlaşmayı kabul etmeli miyiz?"
 wuw_GER_diplomacy.53.t:0 "[FROM.GetNameDefCap] bir Ticaret Ortaklığı teklif ediyor"
 wuw_GER_diplomacy.54.a:0 "Mükemmel!"
 wuw_GER_diplomacy.54.desc:0 "[FROM.GetLeader], [FROM.GetLeader.GetHerHis] ülkesinin çıkarlarını gözeten makul bir lider gibi görünüyor. Şartlı olarak bu durum, aynı zamanda bizim ülkemizin de çıkarına denk geliyor. [FROM.GetName]'den gelen ekstra kaynakları iyi değerlendireceğiz."
 wuw_GER_diplomacy.54.t:0 "[FROM.GetNameDefCap] Ticaret Teklifimizi kabul etti"
 wuw_GER_diplomacy.55.a:0 "Onların kaybı."
 wuw_GER_diplomacy.55.desc:0 "[FROM.GetLeader], [FROM.GetLeader.GetHerHis] ülkesi için en iyi olanı zerre kadar umursamayan, mantıksız ve basiretsiz bir lider gibi görünüyor. Aradığımızı bulmak için başka bir yere yöneleceğiz."
 wuw_GER_diplomacy.55.t:0 "[FROM.GetNameDefCap] Ticaret Teklifimizi reddetti"
 wuw_GER_diplomacy.56.a:0 "Buna nasıl cüret ederler!"
 wuw_GER_diplomacy.56.desc:0 "[FROM.GetAdjective] yetkilileri ve bankacılar, Almanya'daki hesaplarımıza erişimimizi kesti ve onları boşalttı. Bu, [GER.GetNameDef]'in Gömbös Ticaret Antlaşması'ndan elde ettiğimiz parayı ele geçirdiği ve esasen onu geçersiz kıldığı anlamına geliyor. Onların sözüne bir daha asla güvenemeyiz..."
 wuw_GER_diplomacy.56.t:0 "[FROM.GetNameDefCap] Hesaplarımızı Boşaltıyor"
 wuw_GER_diplomacy.57.a:0 "Çatışma istemiyoruz, bu yüzden uymalıyız..."
 wuw_GER_diplomacy.57.b:0 "Gelip alabilirler!"
 wuw_GER_diplomacy.57.desc:0 "\n[FROM.GetLeader] ve [FROM.GetAdjective] hükümetinden gelen söylem son zamanlarda bize karşı çok daha düşmanca bir hal aldı, 1920 Schleswig plebisitlerinin yasadışı ve hileli olduğunu iddia ediyorlar ve şimdi bölgeyi bize iade etmemizi talep ediyorlar. Bunun doğru olmadığını biliyoruz, ama belki de [FROM.GetNameDef] ile açık bir çatışmadan kaçınmak en iyisidir?"
 wuw_GER_diplomacy.57.t:0 "[FROM.GetNameDefCap] Kuzey Schleswig'in İadesini Talep Ediyor"
 wuw_GER_diplomacy.58.a:0 "[ROOT.GetAdjective] halkı için harika bir gün!"
 wuw_GER_diplomacy.58.desc:0 "[FROM.GetLeader], bize karşı silahlı çatışmaya girmek istemediklerini görerek, 1920 Schleswig plebisitlerinde kazanılan toprağı geri vermeyi seçtiklerini açıkladı. Bölge halkı, bir kez daha sürüye geri döndükleri için seviniyor."
 wuw_GER_diplomacy.58.t:0 "[FROM.GetNameDefCap] Taleplerimize Boyun Eğiyor"
 wuw_GER_diplomacy.59.a:0 "O zaman onu soğuk ellerinden söker alırız!"
 wuw_GER_diplomacy.59.b:0 "Bunu gerçekten tırmandırmamalıyız..."
 wuw_GER_diplomacy.59.desc:0 "\nAşırı özgüvenli [FROM.GetLeader], Kuzey Schleswig'in [FROM.GetAdjective] olduğunu ve her zaman öyle kalacağını ilan etti. [FROM.GetNameDefCap]'in birlikleri seferber oldu ve savaşa hazırlanıyor gibi göründükleri için hızla sınırımıza yeniden konuşlandırılıyor. Bu provokasyona nasıl yanıt vermeliyiz."
 wuw_GER_diplomacy.59.t:0 "[FROM.GetNameDefCap] Schleswig Plebisiti'nde Kararlı Duruyor"
 wuw_GER_diplomacy.60.a:0 "Haklılar"
 wuw_GER_diplomacy.60.b:0 "Hezeyan mı görüyorlar?"
 wuw_GER_diplomacy.60.desc:0 "\n[FROM.GetLeader] ve [FROM.GetAdjective] hükümetinden gelen söylem, [912.GetName]'deki yerel yöneticilerimize karşı daha düşmanca bir hal aldı, Kuzey Schleswig'in her zaman Alman olduğunu ve her zaman öyle kalacağını iddia ediyorlar ve şimdi bölgeyi bize iade etmemizi talep ediyorlar. Bunun doğru olmadığını biliyoruz, ama belki de [FROM.GetNameDef] ile açık bir çatışmadan kaçınmak en iyisidir?"
 wuw_GER_diplomacy.60.t:0 "[FROM.GetNameDefCap] Kuzey Schleswig'i Talep Ediyor"
 wuw_GER_diplomacy.61.a:0 "[ROOT.GetAdjective] halkı için harika bir gün!"
 wuw_GER_diplomacy.61.desc:0 "[FROM.GetLeader], bize karşı silahlı çatışmaya girmek istemediklerini görerek, [912.GetName] toprağını geri vermeyi seçtiklerini açıkladı. Bölge halkı, bir kez daha sürüye geri döndükleri için seviniyor."
 wuw_GER_diplomacy.61.t:0 "[FROM.GetNameDefCap] Taleplerimize Boyun Eğiyor"
 wuw_GER_diplomacy.62.a:0 "Halkımızın özgürlüğü konusunda taviz vermeyeceğiz!"
 wuw_GER_diplomacy.62.b:0 "Bunu gerçekten tırmandırmamalıyız..."
 wuw_GER_diplomacy.62.desc:0 "\nAşırı özgüvenli [FROM.GetLeader], Kuzey Schleswig'in [FROM.GetAdjective] olduğunu ve her zaman öyle kalacağını ilan etti. [FROM.GetNameDefCap]'in birlikleri seferber oldu ve işgali caydırmak için bölgeye konuşlandırılıyor. Bu provokasyona nasıl yanıt vermeliyiz?"
 wuw_GER_diplomacy.62.t:0 "[FROM.GetNameDefCap] [912.GetName]'de Kararlı Duruyor"
 wuw_GER_diplomacy.63.a:0 "Maalesef onları durdurmak için pek bir şey yapamayız..."
 wuw_GER_diplomacy.63.desc:0 "\nHakim devletimiz [FROM.GetLeader], Kuzey Schleswig'in [FROM.GetAdjective] olduğunu ve her zaman öyle kalacağını ilan etti. [FROM.GetNameDefCap]'in birlikleri bölgeye girdi ve yeni yerel yöneticileri, politikacılarımızın ellerini zorlayarak bölgeyi önümüzdeki 100 yıl boyunca onlara kiralayan bir yasa tasarısı imzalattı."
 wuw_GER_diplomacy.63.t:0 "[FROM.GetNameDefCap] [912.GetName]'i Ele Geçiriyor"
 wuw_GER_diplomacy.64.a:0 "Eğer gereken buysa"
 wuw_GER_diplomacy.64.b:0 "Kabul etmek için çok pahalı..."
 wuw_GER_diplomacy.64.desc:0 "\n[FROM.GetNameDef]'in lideri [FROM.GetLeader], doğu tehdidine karşı koruma teklifiyle bize başvurdu. Ancak bu koruma ücretsiz olmayacak, çünkü koruma istiyorsak [FROM.GetAdjective]lere bir miktar haraç ödememiz gerektiği belirtildi."
 wuw_GER_diplomacy.64.t:0 "[FROM.GetNameDefCap] Haraç Karşılığında Koruma Teklif Ediyor"
 wuw_GER_diplomacy.65.a:0 "Her şey bir araya geliyor!"
 wuw_GER_diplomacy.65.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], teklifimize yanıt verdi ve [FROM.GetAdjective] geleceğinin güvence altına alınması için koşullarımızın karşılanacağını ve gerekli ödemelerin derhal yapılacağını belirtti."
 wuw_GER_diplomacy.65.t:0 "[FROM.GetNameDefCap] Koşullarımızı Kabul Ediyor"
 wuw_GER_diplomacy.66.a:0 "Neyse"
 wuw_GER_diplomacy.66.b:0 "Hala korumaya ihtiyaçları var, ödemeyi reddetseler bile!"
 wuw_GER_diplomacy.66.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], teklifimize yanıt verdi ve korumamız için koşulların çok sert olduğunu ve bununla ilişkili maliyetin çok yüksek olduğunu belirtti. Kendi başlarına idare edebilirler ve bazı Prusya ordusu taklitçilerinin yardımına ihtiyaçları yok."
 wuw_GER_diplomacy.66.t:0 "[FROM.GetNameDefCap] Koşullarımızı Reddediyor"
 wuw_GER_diplomacy.67.a:0 "Bu kesinlikle bize fayda sağlayacaktır"
 wuw_GER_diplomacy.67.b:0 "Bu etik değil!"
 wuw_GER_diplomacy.67.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], komşularımızı birlikte bölmek için gizlice bize başvurdu, bu pakt birbirimizle bir ittifaka katılmamızı ve alçak topraklarda nüfuz alanları kurmamızı görecekti. Gölgeli tekliflerini kabul etmeli miyiz?"
 wuw_GER_diplomacy.67.t:0 "[FROM.GetNameDefCap] Gizli bir Pakt Teklif Ediyor"
 wuw_GER_diplomacy.68.a:0 "O zaman saldırma zamanı!"
 wuw_GER_diplomacy.68.b:0 "Harika haber. Ancak sabırlı olmalıyız"
 wuw_GER_diplomacy.68.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], [FROM.GetAdjective] geleceğinin garanti altına alınması için pakta katılacaklarını ve nüfuz alanları kuracaklarını belirterek teklifimize yanıt verdi."
 wuw_GER_diplomacy.68.t:0 "[FROM.GetNameDefCap] Pakta Katılıyor"
 wuw_GER_diplomacy.69.a:0 "Başka müttefikler aramak zorunda kalacağız"
 wuw_GER_diplomacy.69.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], komşularını bölme ve sırtından bıçaklama fikrinin doğru gelmediğini ve gelecekteki herhangi bir çatışmada saldırgan olmak istiyorsak başka yerlerde müttefikler aramamamız gerektiğini belirterek teklifimize yanıt verdi."
 wuw_GER_diplomacy.69.t:0 "[FROM.GetNameDefCap] Paktı Reddediyor"
 wuw_GER_diplomacy.70.a:0 "Kötü bir fikir değil, başka bir müttefik kullanabiliriz"
 wuw_GER_diplomacy.70.b:0 "[FROM.GetAdjective]lerle işbirliği yok, bu propagandacıları derhal susturun!"
 wuw_GER_diplomacy.70.desc:0 "[FROM.GetAdjective] propagandacıları son zamanlarda halkımızı etkilemeye ve onları kendi taraflarına çekmeye başladı, eğer bir müttefik olarak devletlerine katılırsak halkımıza büyük bir gelecek vaat ediyorlar. Bu mutlaka bağımsızlığımıza bir tehdit değil, ama kesinlikle mevcut hükümetimize karşı bir saldırganlık eylemi, birçok yeni dağıtılan gazete sistemimizdeki zayıflıklar hakkında vaaz veriyor. Belki de dünyada başka bir dosta ihtiyacımız olabilir, ancak bu muhtemelen [FROM.GetLeader] ve [FROM.GetLeader.GetHerHis] piyonlarından son duyduğumuz şey olmayacak."
 wuw_GER_diplomacy.70.t:0 "[FROM.GetNameDefCap] Siyasetimize Müdahale Ediyor"
 wuw_GER_diplomacy.71.a:0 "Bu halkımızın çıkarınadır."
 wuw_GER_diplomacy.71.desc:0 "[FROM.GetNameDef]'deki hakim devletlerimiz, mevcut anlaşmamızda bir yeniden yapılandırma hakkında bizi bilgilendirdi. Tüm işçileri birleştirme çabasıyla, halkımızın daha büyük iyiliği için sanayimizin daha büyük bir bölümüne erişim sağlamamız istenecek. Bu konuda söz hakkımız olmasa da, şikayet edecek yerimiz yok. Yardımlarını teklif ettiklerinde bunun ödememiz gereken bedel olabileceğini biliyorduk."
 wuw_GER_diplomacy.71.t:0 "[ROOT.GetNonIdeologyName] Halk Komiserliği'nin Kurulması"
 wuw_GER_diplomacy.72.a:0 "Onlara güvenmemek için bir nedenimiz yok"
 wuw_GER_diplomacy.72.a_tt:0 "§REğer Komünist Destekçiler iç savaşı kazanırsa, [FROM.GetNameWithFlag] bizi boyunduruk altına almaya çalışabilir!§!"
 wuw_GER_diplomacy.72.b:0 "Buna kanmayacağız!"
 wuw_GER_diplomacy.72.desc:0 "Ülkemizde komünist duyguları yayan aktif [FROM.GetAdjective] hücreleri olduğu dikkatimizi çekti. Bu kendi başına yeterince zararsız görünse de, bazı propagandaların doğası gereği oldukça devrimci olduğu görülüyor. İşçilerin örgütlenmeye ve bir araya gelmeye teşvik edildiğine dair raporlar giderek daha sık hale geliyor ve yakın tarihe bakılırsa, bunun [GER.GetAdjective] liderliğinden bizi nihayetinde entegre etmek için ayrıntılı bir hile olmadığından emin olamayız."
 wuw_GER_diplomacy.72.t:0 "[FROM.GetNameDef]'den Komünist Etkiler"
 wuw_GER_diplomacy.73.a:0 "Proletarya için!"
 wuw_GER_diplomacy.73.desc:0 "Komünist hareketi güçlendirmek için [FROM.GetNameDef]'de faaliyet gösteren ajanlarımız ülke liderliği tarafından fark edildi. Neyse ki, proletaryanın davasını destekleyen insanların artan kısmına büyük ölçüde kayıtsız görünüyorlar ve çabalarımızı sürdürebiliriz."
 wuw_GER_diplomacy.73.t:0 "[FROM.GetNameDefCap] Komünist Duyguları Güçlendirmemize İzin Veriyor."
 wuw_GER_diplomacy.74.a:0 "[FROM.GetAdjective] yoldaşlarımızı kurtarmalıyız!"
 wuw_GER_diplomacy.74.desc:0 "Komünist hareketi güçlendirmek için [FROM.GetNameDef]'de faaliyet gösteren ajanlarımız ülke liderliği tarafından fark edildi. Onlardan bu operasyonu derhal durdurmamızı talep eden sert bir mektup aldık. Görünüşe göre işçileri iyi niyetle hakları konusunda bilgilendirmemiz [FROM.GetLeader]'in sıradan insanın düşmanı olarak gerçek yüzünü ortaya çıkardı."
 wuw_GER_diplomacy.74.t:0 "[FROM.GetNameDefCap] Siyasi Nüfuz Operasyonlarına İzin Vermiyor"
 wuw_GER_diplomacy.75.a:0 "Proletarya için!"
 wuw_GER_diplomacy.75.b:0 "Bu aptallığı durdurmalıyız!"
 wuw_GER_diplomacy.75.desc:0 "Artan komünist duyguların uzun bir döneminden sonra, [ROOT.GetAdjective] proletaryası barışçıl bir hükümet değişikliği beklemekten bıkmış görünüyor. Yoğun söylemin ardından diplomasi başarısız oldu ve silahlı çatışma başladı."
 wuw_GER_diplomacy.75.t:0 "[ROOT.GetNameDef]'de İç Savaş"
 wuw_GER_diplomacy.76.a:0 "Bu ödediğimiz bedel."
 wuw_GER_diplomacy.76.desc:0 "İç savaş nihayet yatıştıktan sonra [FROM.GetNameDef], boyun eğmemizi talep etmek için bize geri döndü. Bunun geleceğinden şüpheleniyorduk ama önceki hükümetimizi devirmek için yardımlarını almanın bir yolu olarak görmezden gelmeyi seçtik. Şimdiye kadar bize karşı oldukça iyi niyetli davrandılar, bu yüzden bunun bizim için o kadar da kötü olmayacağına dair umutlar var."
 wuw_GER_diplomacy.76.t:0 "[FROM.GetNameDefCap] Boyun Eğmemizi Talep Ediyor"
 wuw_GER_diplomacy.77.a:0 "Neden olmasın?"
 wuw_GER_diplomacy.77.b:0 "Kesinlikle olmaz!"
 wuw_GER_diplomacy.77.desc:0 "Kuzeydeki komşularımız bize onlara katılmak için bir referandum yapmamızı talep eden talepler gönderdi. Halkımızın onlarınkine çok benzediğini ve birleşik yaşamayı hak ettiklerini belirterek, onlara boyun eğmemiz gerektiğini belirttiler. Hala bir miktar özgürlüğe izin verilecek, ancak dış politikamız da dahil olmak üzere diğer şeyler [FROM.GetAdjective]ler tarafından izlenecek ve yönetilecek."
 wuw_GER_diplomacy.77.t:0 "[FROM.GetNameDefCap] Onlara Katılmak İçin Referandum Yapmamızı Talep Ediyor"
 wuw_GER_diplomacy.78.a:0 "Kutlanacak bir gün!"
 wuw_GER_diplomacy.78.desc:0 "[FROM.GetAdjective]lerin son referandumlarında bize katılmak isteyenlerin zaferinin ardından, [FROM.GetNameDef] liderliği bize olumlu bir yanıtla geri döndü. Bundan sonra halkımızın selameti için kendilerini bize tabi kılacaklar."
 wuw_GER_diplomacy.78.t:0 "[FROM.GetNameDefCap] Sıraya Giriyor"
 wuw_GER_diplomacy.79.a:0 "Onları kurtarmalıyız!"
 wuw_GER_diplomacy.79.desc:0 "[FROM.GetAdjective] liderliğinden gelen olumsuz yanıt bize o kadar çabuk ulaştı ki, bir referandum yapıldığına inanmak güç. Halklarının bizim güvenli liderliğimizde çok daha iyi durumda olacağına dair açık göstergelere rağmen [FROM.GetLeader], [FROM.GetLeader.GetHerHis] halkının iyiliği yerine [FROM.GetLeader.GetHerHis] kendi gücünü seçti."
 wuw_GER_diplomacy.79.t:0 "[FROM.GetNameDefCap] Liderliği Bize Katılmayı Reddediyor"
 wuw_GER_diplomacy.80.a:0 "Harika!"
 wuw_GER_diplomacy.80.desc:0 "Sanayimizi kendilerininkiyle aynı standarda getirmek için [FROM.GetAdjective] hükümeti tarafından önemli yatırımlar yapıldı. Bunu karşılıklı yarar sağlayan bir anlaşma olarak sunuyorlar, biz bir ülke olarak daha gelişmiş bir sanayi elde ediyoruz ve kapasitemiz arttıkça onlar da bundan faydalanacaklar."
 wuw_GER_diplomacy.80.t:0 "[FROM.GetNameDefCap] Sanayimize Yatırım Yapıyor"
 wuw_GER_diplomacy.81.a:0 "Pek bir ödül sayılmaz, ama başka ne seçeneğimiz var ki?"
 wuw_GER_diplomacy.81.desc:0 "Halk Komiserliği olarak geçirdiğimiz süre sona erdi. [FROM.GetAdjective] liderliği çabalarımızdan son derece memnun ve şimdi ülkeyi sadece bir bağlı devletten daha fazlası olarak görüyor. Bu nedenle, sadece bir tebaa olmak yerine büyük ülkelerinin bir parçası olmamıza izin vererek bizi ödüllendirmek istiyorlar. Bu elbette artık herhangi bir bağımsızlığa izin verilmeyeceği anlamına geliyor, ama halkımıza iyi bakacaklarına dair bize güvence veriyorlar."
 wuw_GER_diplomacy.81.t:0 "[ROOT.GetNameDef]'in Entegrasyonu"
 wuw_GER_diplomacy.82.a:0 "Bu silahları iyi kullanın!"
 wuw_GER_diplomacy.82.desc:0 "[FROM.GetNameDef]'deki Yoldaşlarımız, kapitalizme ve burjuvaziye karşı mücadelemizde bize yardımcı olmak için bir tüfek sevkiyatı gönderdi. Bu yardım muhtemelen ileride bir bedeli olacak, ama onların yardımını reddetmek bize mi düşmüş?"
 wuw_GER_diplomacy.82.t:0 "Ayaklanmaya [FROM.GetAdjective] Desteği"
 wuw_GER_diplomacy.83.a:0 "Elbette katılacağız"
 wuw_GER_diplomacy.83.b:0 "Kendi başımıza kalmayı tercih ederiz."
 wuw_GER_diplomacy.83.desc:0 "İç savaştaki başarımızın ve ardından komünizme yönelmemizin ardından [GER.GetNameDef] bize yoldaşça bir el uzattı. [GER.GetAdjective]lerden aldığımız desteğin gerçekte ne kadar rol oynadığı en iyisi söylenmeden bırakılsın. Artık benzer ideolojileri paylaştığımız için bize bu teklifi uzattılar, bu konuda gerçekten ne kadar seçeneğimiz olduğu biraz belirsiz."
 wuw_GER_diplomacy.83.t:0 "[GER.GetNameDefCap] Bizi [GER.GetFactionName]'e Davet Ediyor"
 wuw_GER_diplomacy.84.a:0 "Kabul ediyoruz, Herkes için Dayanışma!"
 wuw_GER_diplomacy.84.b:0 "Bu onlara daha faydalı görünüyor."
 wuw_GER_diplomacy.84.desc:0 "[GetIsRootProletarianSubject]"
 wuw_GER_diplomacy.84.t:0 "[FROM.GetNameDefCap] Daha Fazla Proleter Dayanışma Talep Ediyor"
 wuw_GER_diplomacy.85.a:0 "Başka seçeneğimiz yok"
 wuw_GER_diplomacy.85.b:0 "Savaşmamız gerekiyorsa, savaşırız!"
 wuw_GER_diplomacy.85.desc:0 "[FROM.GetAdjective]'den keskin ifadeli bir talep bize ulaştı. Mevcut işbirliğimizin faydalı olmasına rağmen yeterince iyi olmadığını düşünüyorlar. Çözümleri, [FROM.GetNameDef]'e entegre olmamızı talep etmek. Reddetmenin sonuçlarından bahsedilmese de, reddetmenin hafife alınmaması gerektiği ancak varsayılabilir."
 wuw_GER_diplomacy.85.t:0 "[FROM.GetNameDefCap] Entegre Olmamızı Talep Ediyor"
 wuw_GER_diplomacy.86.a:0 "Harika!"
 wuw_GER_diplomacy.86.desc:0 "Bugün en hoş haberlerden biriyle karşılaştık, Nüfuz Alanımız içinde olan [FROM.GetAdjective] topraklarının kontrolünü ele geçirdikten sonra, [FROM.FROM.GetNameDef] anlaşmamıza sadık kalmaya karar verdi. Nüfuz Alanımız içindeki topraklar mülkiyetimize devredildi."
 wuw_GER_diplomacy.86.t:0 "[FROM.FROM.GetNameDefCap] Nüfuz Alanımızdaki Toprakları Devrediyor"
 wuw_GER_diplomacy.87.a:0 "Anlaşmaya sadık kalmalıyız!"
 wuw_GER_diplomacy.87.b:0 "O toprağı adil bir şekilde kazandık!"
 wuw_GER_diplomacy.87.desc:0 "En son savaştaki zaferimizin bir sonucu olarak bir karar vermemiz gerekiyor. Fethettiğimiz topraklardan bazıları nüfuz alanımızda yer almıyor. Anlaşmaya göre bu toprakları teslim etmeliyiz. Ancak anlaşma hiçbir zaman yazılı hale getirilmedi ve bu nedenle bağlayıcı olmadığı iddia edilebilir..."
 wuw_GER_diplomacy.87.t:0 "Nüfuz Alanlarını Onurlandırmak"
 wuw_GER_diplomacy.88.a:0 "Harika!"
 wuw_GER_diplomacy.88.desc:0 "Bugün en hoş haberlerden biriyle karşılaştık, Nüfuz Alanımız içinde olan [FROM.GetAdjective] topraklarının kontrolünü ele geçirdikten sonra, [FROM.FROM.GetNameDef] anlaşmamıza sadık kalmaya karar verdi. Nüfuz Alanımız içindeki topraklar mülkiyetimize devredildi."
 wuw_GER_diplomacy.88.t:0 "[FROM.GetNameDefCap] Nüfuz Alanımızdaki Toprakları Devrediyor"
 wuw_GER_diplomacy.89.a:0 "Peki o zaman..."
 wuw_GER_diplomacy.89.b:0 "Kabul edilemez"
 wuw_GER_diplomacy.89.desc:0 "[FROM.GetNameDefCap] bize bir Nüfuz Alanı kurduklarını bildirdi. Resmi bir anlaşma olmadığı için bizi doğrudan etkilemese de, farkında olmamız gereken bir şey. Bunu bize dayatmaya veya kontrolünü ele geçirirsek bizden toprak talep etmeye çalışabilirler."
 wuw_GER_diplomacy.89.t:0 "[FROM.GetNameDefCap] Nüfuz Alanı Kuruyor"
 wuw_GER_diplomacy.90.a:0 "Bu bizi güçlendirecek!"
 wuw_GER_diplomacy.90.b:0 "Onlara kendimizi bağlayamayız."
 wuw_GER_diplomacy.90.desc:0 "[FROM.GetLeader] bir taleple bize ulaştı. [FROM.GetLeader.GetSheHe] bizimle karşılıklı bir saldırmazlık paktı imzalamak istiyor, bu da gerçekten müttefik olmasak da kesinlikle düşman olmadığımız fikrini pekiştiriyor. Böyle bir pakt, [FROM.GetAdjective]lerle aramız bozulursa hareket özgürlüğümüzü engeller, ancak aynı zamanda böyle bir şeyin olma riskini en aza indirme potansiyeline de sahiptir."
 wuw_GER_diplomacy.90.t:0 "[FROM.GetNameDefCap] Saldırmazlık Paktı Talep Ediyor"
 wuw_GER_diplomacy.91.a:0 "Tanıdığımız bir adam var..."
 wuw_GER_diplomacy.91.desc:0 "[FROM.GetAdjective] liderliğinden, siyasi doktrinimize uyum sağlamak istediklerine dair bir iletişim aldık. Bunun gelecekte sürekli işbirliği için iyi bir temel olabileceğini umuyorlar, ancak bu tür planların şimdi uygulanması gerekmediğini vurguluyorlar. Bu, onların siyasi elitini etkilememiz için birinci sınıf bir fırsattır."
 wuw_GER_diplomacy.91.t:0 "[FROM.GetNameDefCap] Uyum Sağlama İsteğini İfade Ediyor"
 wuw_GER_diplomacy.92.a:0 "Ulbricht de o kadar yetenekli, değiştireceğiz."
 wuw_GER_diplomacy.92.b:0 "Hayır, onların karışmasına izin vermeyeceğiz!"
 wuw_GER_diplomacy.92.desc:0 "[FROM.GetNameDef]'deki yoldaşlarımızdan gelen yanıt olumlu oldu. Siyasi doktrinlerine uyumumuzu memnuniyetle karşılıyorlar ve gelecekte iyi bir çalışma ilişkisi için umutlarımızı paylaşıyorlar. Bunun en iyi nasıl yapılabileceğine gelince, bu geçişi daha kolay ve daha hızlı hale getirmek için bize bir önerileri var. Siyasi liderimizi değiştirmemizi öneriyorlar, Ernst Thälmann kesinlikle yetenekli bir lider olsa da, Walter Ulbricht'in gelecekteki işbirliğimiz için daha iyi bir temel sağlayabileceğinden eminler."
 wuw_GER_diplomacy.92.t:0 "[FROM.GetNameDefCap] Uyumumuzu Onaylıyor"
 wuw_GER_diplomacy.93.a:0 "Harika!"
 wuw_GER_diplomacy.93.desc:0 "Belki de şaşırtıcı bir şekilde [FROM.GetAdjective] liderliği Ernst Thälmann'ı değiştirmeye istekliydi. Bu değişikliği bizimle iyi ilişkiler kurmak ve siyasi gündemlerimizin işbirliğimizin sorunsuz olacağı kadar benzer olmasını sağlamak amacıyla gerçekleştirdiler. Bu bir başarı olarak kabul edilmelidir!"
 wuw_GER_diplomacy.93.t:0 "[FROM.GetNameDef] Walter Ulbricht'i Atıyor"
 wuw_GER_diplomacy.94.a:0 "İnatçı [FROM.GetAdjective]ler..."
 wuw_GER_diplomacy.94.desc:0 "Önerimiz [FROM.GetAdjective] yoldaşlarımıza yardım etmeye yönelik en iyi niyetli girişimimiz olmasına rağmen, tavsiyemize uymayı inatla reddettiler. Görünüşe göre öneriyi siyasetlerine karışma girişimi olarak gördüler, ancak niyetimiz hiç de bu değildi."
 wuw_GER_diplomacy.94.t:0 "[FROM.GetNameDefCap] Ernst Thälmann'ı Değiştirmeyi Reddediyor"
 wuw_GER_diplomacy.95.a:0 "Bu adil görünüyor"
 wuw_GER_diplomacy.95.b:0 "Bizi aptal sanıyor olmalılar."
 wuw_GER_diplomacy.95.desc:0 "[FROM.GetAdjective] liderliği, ülkelerimiz arasında Endüstriyel İşbirliği için bir teklifle bize geldi. Önerileri, endüstriyel çabalarımızı birlikte nasıl iyileştirebileceğimizi ve genişletebileceğimizi detaylandırıyor. Bundan gerçekten faydalanıp faydalanmayacağımız veya bunun sadece [FROM.GetAdjective]lere fayda sağlayacak bir şey olup olmadığı henüz belli değil."
 wuw_GER_diplomacy.95.t:0 "Endüstriyel İşbirliği için Teklif"
 wuw_GER_diplomacy.96.a:0 "Harika!"
 wuw_GER_diplomacy.96.desc:0 "[FROM.GetAdjective]lere Endüstriyel İşbirliği için yaptığımız öneriye verilen yanıt onaylandı. Gelecekte hem sanayimizi genişletme hem de verimlileştirme konusunda işbirliğinden yararlanacağız."
 wuw_GER_diplomacy.96.t:0 "[FROM.GetNameDefCap] Endüstriyel İşbirliğini Kabul Ediyor"
 wuw_GER_diplomacy.97.a:0 "O zaman kendi başımıza genişleyeceğiz."
 wuw_GER_diplomacy.97.desc:0 "[FROM.GetAdjective]lere yaptığımız teklifimiz reddedildi. Anlaşma hem bizim hem de onlar için çok faydalı olmasına rağmen, bizi dinlemeyi reddettiler. Bu plan suya düşmüş olsa da, yola çıktığımız şeyin bir kısmını hala başarabiliriz. Endüstriyel genişlememizi kendi başımıza hala verimlileştirebiliriz."
 wuw_GER_diplomacy.97.t:0 "[FROM.GetNameDefCap] Teklifimizi Reddediyor"
 wuw_GER_diplomacy.98.a:0 "Bu harika bir girişim"
 wuw_GER_diplomacy.98.b:0 "Onlara güvenilmez."
 wuw_GER_diplomacy.98.desc:0 "[FROM.GetNameDef]'deki yoldaşlarımız yakın zamanda sanayi ve üretimle ilgili bilgimizi bir araya getirmek için bir girişim kurma olasılığı hakkında bize ulaştı. Bilgimizi onlarla paylaşacağız ve karşılığında onlar da bizimle paylaşacaklar. Her şey işçilerimiz ve üretim hatlarımız için faydalı olabilir."
 wuw_GER_diplomacy.98.t:0 "[FROM.GetNameDefCap] Bizi Teknoloji Paylaşımı Girişimine Davet Ediyor"
 wuw_GER_diplomacy.99.a:0 "Harika"
 wuw_GER_diplomacy.99.desc:0 "Onayımıza çok sevindik ki, [FROM.GetAdjective]ler önerdiğimiz teknoloji paylaşım grubunun faydasını görmüş gibi görünüyor. Bundan sonra onların bilgisine erişimimiz olacak, tıpkı onların da bizimkine olacağı gibi. Sonuç olarak sanayi ve üretim alanlarında büyük ilerleme görmeliyiz."
 wuw_GER_diplomacy.99.t:0 "[FROM.GetNameDefCap] Teknoloji Paylaşımı Girişimine Katılıyor."
 wuw_GER_german_politics.01.a:0 "İhtiyatlı bir gelenekçiye ihtiyacımız var"
 wuw_GER_german_politics.01.b:0 "İleriye dönük bir sosyaliste ihtiyacımız var"
 wuw_GER_german_politics.01.desc:0 "Özgür seçimlerin geri dönmesiyle birlikte, [ROOT.GetAdjective] halkı Almanya'nın geleceğini belirlemek için sandıklara akın etti. Sokaklarda, karanlık günleri nihayet geride bırakma hissiyle yaygın bir öfori havası hakim, bu günü ulusal bir seçimden çok bir kutlama gibi hissettiriyor."
 wuw_GER_german_politics.01.t:0 "Demokrasinin Dönüşü"
 wuw_GER_german_politics.02.a:0 "Heinrich Brandler doğru seçim!"
 wuw_GER_german_politics.02.b:0 "Ernst Thälmann'ı iktidarda tutun!"
 wuw_GER_german_politics.02.c:0 "Pragmatik bir Sosyaliste ihtiyacımız var!"
 wuw_GER_german_politics.02.desc:0 "Spartaküs Birliği'nin ideallerine geri dönüşle birlikte, halkı biraz daha aktif bir şekilde dahil etme isteği geliyor. Bizi temsil edecek kişiyi seçmek için bir seçim yapıldı ve tüm oylar sayıldığında sonuçlar çok eşit görünüyor. Halk açıkça her iki adayı da [ROOT.GetNameDef] için uygun liderler olarak görüyor, ancak ne yazık ki sadece birini atayabiliriz."
 wuw_GER_german_politics.02.t:0 "Halk için bir Lider"
 wuw_GER_legions.1.a:0 "Bize katılmalarından memnuniyet duyarız"
 wuw_GER_legions.1.b:0 "Onlara ihtiyacımız yok"
 wuw_GER_legions.1.desc:0 "Brest-Litovsk barış antlaşmasının sınırlarını yeniden kurma niyetimizi yakın zamanda ilan etmemizle birlikte, birkaç sürgündeki Gürcü general ve asker, Gürcü devletini yeniden kurma ve ona Kafkasya üzerinde hakimiyet verme vaatleri karşılığında eski anavatanlarının yeniden fethinde bize yardım etmek isteyen bize başvurdu. Yardımlarını kabul etmeli miyiz?"
 wuw_GER_legions.1.t:0 "Bir Gürcü Yabancı Lejyonunun Oluşturulması"
 wuw_GER_legions.2.a:0 "Askeri istihbaratını kullanabiliriz"
 wuw_GER_legions.2.desc:0 "Biz ve [SOV.GetAdjective]ler arasında yakın zamanda düşmanlıkların ilan edilmesiyle, Generalmajor Hans Krebs liderliğindeki askeri ataşemiz birkaç hafta önceden geri çağrıldı ve yakın zamanda Berlin'e geri döndü. Şimdi Doğu Cephesi'nde hizmet vermeye hazır olduğunu belirterek, topraklarının başarılı bir şekilde işgali için ihtiyacımız olan [SOV.GetAdjective] silahlı kuvvetlerinin deneyimine ve bilgisine sahip olduğunu belirtiyor."
 wuw_GER_legions.2.t:0 "Hans Krebs [SOV.GetNameDef]'den Geri Çağrıldı"
 wuw_GER_legions.3.a:0 "Düşmanımızın düşmanını her zaman hoş karşılarız!"
 wuw_GER_legions.3.b:0 "Yerel işbirlikçilere ihtiyacımız yok"
 wuw_GER_legions.3.desc:0 "Bryansk, Kursk ve Orel oblastlarının işgalinin ardından, ordumuz bölgeyi daha kolay yönetmek için Lokot merkezli yerel işbirlikçilerden yararlanma planı hazırladı, aynı zamanda anti-[SOV.GetAdjective] davası için daha fazla birim toplamalarını sağlayabildi. Ancak bu, ordu grubumuzun bölgedeki savaş ganimetlerini reddedecektir. Bu Lokot Özerkliği'nin kurulmasına izin vermeli miyiz?"
 wuw_GER_legions.3.t:0 "Lokot'ta İşbirliği Fırsatı"
 wuw_GER_legions.4.a:0 "Yanlış seçimi yaptılar"
 wuw_GER_legions.4.desc:0 "[GER.GetAdjective] ordusunun, Konstantin Voskoboinik ve Bronislav Kaminski gibi hevesli işbirlikçiler tarafından başvurulduktan sonra Bryansk, Kursk ve Orel oblastları arasındaki sınır bölgesinde Lokot Özerkliği'ni kurduğu dikkatimizi çekti. Görünüşe göre bölgeyi yönetme ve partizanlar ve direnişle başa çıkma görevine getirilmişler. Düşmana karşı saldırmalı ve bu sahte devleti mümkün olan en kısa sürede yok etmeliyiz!"
 wuw_GER_legions.4.t:0 "Lokot'taki İşbirlikçiler!"
 wuw_GER_legions.5.a:0 "Muzaffer olacağız!"
 wuw_GER_legions.5.desc:0 "Bryansk, Kursk ve Orel oblastlarının yeniden ele geçirilmesinin ardından, ordumuz Lokot'taki işbirlikçilerin çoğunu yakaladı ve bölgedeki yerel yönetimlerimizi yeniden kurdu. [GER.GetAdjective] ordusu bölgeden geri çekildi ve komutanlarımız zafer gününün giderek yaklaştığını garanti ediyor."
 wuw_GER_legions.5.t:0 "Lokot Özerkliği'nin Dağıtılması"
 wuw_GER_legions.6.a:0 "Savaş bir dönemece girdi"
 wuw_GER_legions.6.desc:0 "[SOV.GetAdjective]'in Lokot bölgesini yeniden ele geçirmesinin ardından, daha önce kurduğumuz özerk devleti dağıttılar, ayrıca yerel işbirliği hükümetinin tüm üyelerini tutuklayıp ortadan kaldırdılar."
 wuw_GER_legions.6.t:0 "Lokot Özerkliği'nin Yıkımı"
 wuw_GER_legions.7.a:0 "Sırbistan'ı bastırmada yardımlarını kullanabiliriz"
 wuw_GER_legions.7.b:0 "Bu Rus ayaktakımına ihtiyacımız yok"
 wuw_GER_legions.7.desc:0 "Yakın zamanda işgal ettiğimiz topraklarda Sırp Ulusal Kurtuluş Hükümeti'nin kurulmasının ardından, birkaç Beyaz Rus göçmeni, işgal altındaki Sırbistan'da fabrikaları ve hükümet binalarını korumamıza yardımcı olacak ve bölgedeki Çetnikleri ve diğer direniş savaşçılarını bastırmaya yardımcı olacak bir Rus Koruma Kolordusu'nun oluşturulmasına yardım etmeyi teklif etti. Yardımlarını kullanmalı mıyız?"
 wuw_GER_legions.7.t:0 "Sırbistan'daki Rus Sürgünlerinden Bir Teklif"
 wuw_GER_legions.8.a:0 "Kuban bozkırı hakkındaki bilgilerini kullanabiliriz"
 wuw_GER_legions.8.b:0 "Ve neden bazı kazakların yardımına ihtiyacımız olsun ki?"
 wuw_GER_legions.8.desc:0 "[SOV.GetNameDef]'in çürümüş kapısını tekmeleme niyetimiz giderek daha belirgin hale geldikçe, Rus iç savaşında kaybedenlerin birçoğu mevcut [SOV,GetAdjective] hükümetine bir son verme şansı dileyerek bize başvurdu. Bunlar arasında bizim için savaşmak isteyen Don ve Kuban kazakları [SOV.SOV_pyotr_krasnov.GetName] ve [SOV.SOV_andrey_shkuro.GetName] de var. Yardımlarını kabul etmeli miyiz?"
 wuw_GER_legions.8.t:0 "Hoşnutsuz Kazaklardan Bir Teklif"
 wuw_GER_military_events.2.a:0 "Yaşamasına izin vereceğiz, ama bu tekrarlanamaz!"
 wuw_GER_military_events.2.b:0 "Ondan bir ibretlik örnek yapın!"
 wuw_GER_military_events.2.c:0 "Bu konuda tek bir kelime bile edilmesin."
 wuw_GER_military_events.2.desc:0 "Askeri sanayimize yönelik yoğun bombardıman baskınlarının ardından beklenmedik bir hikaye ortaya çıktı. Hava sahamızı ihlal eden her düşman uçağını düşürme yönündeki açık emirlere rağmen, bir avcı pilotu bunu yapmayı reddetti. Pilot, Franz Stigler adında biri, bir bombardıman baskınından hemen sonra hasarlı bir bombardıman uçağıyla karşılaştı ve üzerine ateş açmamayı seçti. Eylemlerini, hasarlı bombardıman uçağının paraşütle atlayan adamlardan farklı olmadığını ve onlara ateş etmenin de aynı derecede iğrenç olacağını belirterek haklı çıkarıyor. Başlangıçta bombardıman uçağı mürettebatıyla [GER.GetNameDef]'e inmeleri ve teslim olmaları veya en azından tarafsız bölgeye yönelmeleri için iletişim kurmaya çalıştıktan sonra, Stigler bu iyi niyetli çabalarından vazgeçti ve bunun yerine düşman bombardıman uçağını güvenli bir yere kadar refakat etti.\n\nFranz Stigler yetenekli bir pilot, ancak bu şekilde devam etmesine izin verilirse, o ve meydan okuyan eylemleri bize sorun yaratabilir."
 wuw_GER_military_events.2.t:0 "Pilot [USA.GetAdjective] Bombardıman Uçağı Mürettebatını Bağışlıyor"
 wuw_GER_monroe.1.a:0 "Müdahale etmeliyiz!"
 wuw_GER_monroe.1.a_tt:0 "§YMonroe Doktrini'ni Güçlendir§! Kararlarının kilidini açar.\n\n[GER.GetNameDefCap], §RMonroe Doktrini'ni İstikrarsızlaştırma§! girişiminde bulunmak için kararların kilidini açtı."
 wuw_GER_monroe.1.b:0 "Kimin umrunda?"
 wuw_GER_monroe.1.b_tt:0 "[GER.GetNameDefCap], §RMonroe Doktrini'ni İstikrarsızlaştırma§! girişiminde bulunmak için kararların kilidini açtı.\n\nBunu seçerek, Monroe Doktrini ile ilgili daha fazla bildirim §Ralmayacağız§!. [FROM.GetNameDefCap]'in kesintisiz olarak Doktrini kaldırmaya çalışmasına izin verilecektir.\n\n§RBu seçeneği yalnızca elinizde bir yedek planla seçin!§!"
 wuw_GER_monroe.1.desc:0 "[FROM.GetNameDef]'in Monroe Doktrini'ni istikrarsızlaştırmaya artan bir ilgi göstermeye başladığına dair endişe verici raporlar aldık. Doktrin, bizim nüfuz sahamız olarak gördüğümüz Amerikan kıtasında yabancı ulusların sorun çıkarmasını önlemek için konulmuştu. [FROM.GetNameDef] ile önceki karşılaşmalarımıza bakılırsa, niyetlerinin iyi olmadığını varsayabiliriz."
 wuw_GER_monroe.1.t:0 "[FROM.GetAdjectiveCap] Monroe Doktrini'ne İlgi"
 wuw_GER_monroe.10.a:0 "İleri"
 wuw_GER_monroe.10.desc:0 "Çabalarımız nihayet sonuç verdi. [FROM.GetNameDef] lideri [FROM.GetLeader] az önce Monroe Doktrini'nin dağıtıldığını, ancak sadece kısmen olduğunu duyurdu. [FROM.GetLeader.GetSheHe], bunun doğru bir çağrı olduğuna inandıkları için muhalefete kalkışmayan herkesin bağımsızlığını garanti etme niyetinde olduklarını belirtiyor. Bu, bölgedeki ilerlememizi engelleyebilir, ama şüphesiz bunu da aşabiliriz."
 wuw_GER_monroe.10.t:0 "[FROM.GetNameDefCap] Monroe Doktrini'ni Kısmen Dağıtıyor"
 wuw_GER_monroe.11.a:0 "İleri"
 wuw_GER_monroe.11.desc:0 "Çabalarımız nihayet sonuç verdi. [FROM.GetNameDef] lideri [FROM.GetLeader] az önce Monroe Doktrini'nin dağıtıldığını, ancak sadece kısmen olduğunu duyurdu. [FROM.GetLeader.GetSheHe], hala Monroe Doktrini'ni destekleyenlerin bağımsızlığını garanti etme niyetinde olduklarını belirtiyor. Şimdi daha az olsalar da, her zamanki kadar güçlü olduklarını iddia ediyorlar. Bu, bölgedeki ilerlememizi engelleyebilir, ancak bizim için önemli bir engel oluşturmadı. Şüphesiz bunu da aşacağız."
 wuw_GER_monroe.11.t:0 "[FROM.GetNameDefCap] Monroe Doktrini'ni Kısmen Dağıtıyor"
 wuw_GER_monroe.12.a:0 "Bunu silahlarla çözeceğiz!"
 wuw_GER_monroe.12.desc:0 "Monroe Doktrini üzerindeki düşük seviyeli ve düşük yoğunluklu anlaşmazlık, iki ülkemizin savaşa girmesinin ardından dindi. Ülkelerimiz çok daha doğrudan çatışırken, yabancı topraklardaki diplomasi ve gizli operasyonlar cepheden uzak politikacılara bile çok anlamsız görünüyor."
 wuw_GER_monroe.12.t:0 "[USA.GetNameDef] ve [GER.GetNameDef] arasındaki savaş Monroe Doktrini üzerindeki anlaşmazlığı sona erdiriyor"
 wuw_GER_monroe.13.a:0 "Aman Tanrım..."
 wuw_GER_monroe.13.desc:0 "[GER.GetAdjective] aktörlerinden bölgeye artan bir ilgi olduğu dikkatimizi çekti. Raporumuz çok eksik ama görünüşe göre Monroe Doktrini'ni istikrarsızlaştırmak ve daha da ileri giderek dağıtmak için girişimlerde bulunuluyor."
 wuw_GER_monroe.13.t:0 "Bölgeyi İstikrarsızlaştırmak için Hareket Eden Yabancı Güçler"
 wuw_GER_monroe.2.a:0 "Bize karşı çıkmayan herkesi koruyacağız!"
 wuw_GER_monroe.2.a_tt:0 "§YMonroe Doktrini§!, hala sahip olan tüm ülkelerden kaldırılacaktır. Doktrine sesli olarak karşı çıkmayan tüm ülkeleri, §RGaranti Edilen Ülke Başına§! £GFX_pol_power §Y25 Siyasi Güç§! maliyetle garanti eder!!\n\nŞu anda §Y[?global.monroe_countries_in_support^num] Ülke§! destekliyor ve §Y[?global.monroe_doctrine_countries_to_destabilize^num] Ülke§! doktrini pasif olarak destekliyor.\n\nŞu anki garanti maliyeti £GFX_pol_power §Y[?USA.monroe_countries_all_in_support_guarantee_cost] Siyasi Güç§! !"
 wuw_GER_monroe.2.b:0 "Sadece sadık kalanları garanti edebiliriz"
 wuw_GER_monroe.2.b_tt:0 "§YMonroe Doktrini§!, hala sahip olan tüm ülkelerden kaldırılacaktır. Doktrini sesli olarak destekleyen tüm ülkeleri, §RGaranti Edilen Ülke Başına§! £GFX_pol_power §Y25 Siyasi Güç§! maliyetle garanti eder!!\n\nŞu anda §Y[?global.monroe_countries_in_support^num]§! ülke destekliyor.\n\nŞu anki garanti maliyeti £GFX_pol_power §Y[?USA.monroe_countries_strict_in_support_guarantee_cost] Siyasi Güç§! !"
 wuw_GER_monroe.2.c:0 "Garanti isteselerdi, bunu durdururlardı."
 wuw_GER_monroe.2.desc:0 "Yoğun [FROM.GetAdjective] baskısının ardından Monroe Doktrini nihayet çöküyor gibi görünüyor. Birkaç ülke Doktrine karşı muhalefetle ayaklandı ve kendilerini [FROM.GetAdjective]lere daha yakın bir konuma getirdi. Muhalefet yüksek sesli olsa da, Doktrinin en azından bir dereceye kadar kurtarılmaya değer olduğunu düşünebilecekler hala var. Bu noktada tüm eylemlerimiz hafifletme taktikleri olarak kabul edilecek, bu konudaki yanıtımızı dikkatli seçmeliyiz."
 wuw_GER_monroe.2.t:0 "Monroe Doktrini Çöküyor"
 wuw_GER_monroe.3.a:0 "Lanet olsun!"
 wuw_GER_monroe.3.desc:0 "Şaşırtıcı olmayan bir şekilde [FROM.GetNameDef], bölgeyi istikrarsızlaştırma girişimlerimize akıl erdirdi. Büyük bir propaganda, şantaj ve rüşvet kampanyası başlatan [FROM.GetAdjective]ler, Monroe Doktrini'ne dahil olan ülkeleri kendi taraflarına çektiler ve bize karşı topladılar. Monroe Doktrini her zamankinden daha güçlü duruyor."
 wuw_GER_monroe.3.t:0 "[FROM.GetNameDefCap] Monroe Doktrini'ni Güçlendiriyor"
 wuw_GER_monroe.4.a:0 "[USA.GetNameDef] bizim için ne yaptı ki zaten?"
 wuw_GER_monroe.4.a_tt:0 "Monroe Doktrini'ne §RKarsı Olduğumuzu§! sesli olarak ifade edeceğiz. Doktrinin galip gelmesi durumunda, §R Garantisiz§! kalacağız. §Y[USA.GetFlag][USA.GetNameDefCap]§! bizi daha fazla etkileyemeyecek."
 wuw_GER_monroe.4.b:0 "Yalanlarına kulak asmayacağız!"
 wuw_GER_monroe.4.b_tt:0 "Bu konuda tavır almayı reddedeceğiz. §Y[USA.GetNameWithFlag]§! tarafından bizi kendi taraflarına çekmek için girişimlerde bulunulabilir."
 wuw_GER_monroe.4.desc:0 "[FROM.GetNameDef]'den oldukça sert ifadeli bir iletişim aldık. Monroe Doktrini'nin çökeceğini ve yakında artık [USA.GetNameDef]'in koruması altına girmeyeceğimizi ilan ediyorlar. Doktrini şimdi kaldırırsak, kendi korumalarını bir ikame olarak teklif ediyorlar, ancak bu teklifin hızlı hareket etmemize bağlı olduğunu çok açık bir şekilde belirttiler."
 wuw_GER_monroe.4.t:0 "[FROM.GetNameDefCap] Monroe Doktrini'ni Bırakmamızı Talep Ediyor"
 wuw_GER_monroe.5.a:0 "Peki"
 wuw_GER_monroe.5.b:0 "Siyasetimize karışmaya hakları yok!"
 wuw_GER_monroe.5.desc:0 "Ülkemizdeki [FROM.GetAdjective] ajanlarının siyasetimizi aktif olarak etkilemeye çalıştığı dikkatimizi çekti. Etki, zaten var olan grupları toplamak ve siyasi iklimdeki konumlarını güçlendirmek dışında müdahaleci değil."
 wuw_GER_monroe.5.t:0 "[FROM.GetNameDefCap]'in [ROOT.GetAdjective] Siyasetine Müdahalesi"
 wuw_GER_monroe.6.a:0 "Daha önce olduğu gibi Doktrini destekleyeceğiz"
 wuw_GER_monroe.6.a_tt:0 "Monroe Doktrini'ne §G Desteğimizi§! sesli olarak ifade edeceğiz. Doktrinin çökmesi durumunda, hala [FROM.GetNameDef]'den §GGarantilere§! sahip olma şansımız var. §Y[GER.GetFlag][GER.GetNameDefCap]§! bizi daha fazla etkileyemeyecek."
 wuw_GER_monroe.6.b:0 "Kendimizi bağlamayacağız."
 wuw_GER_monroe.6.b_tt:0 "Bu konuda tavır almayı reddedeceğiz. §Y[GER.GetNameWithFlag]§! tarafından bizi kendi taraflarına çekmek için girişimlerde bulunulabilir."
 wuw_GER_monroe.6.desc:0 "[FROM.GetNameDef]'den bir iletişim az önce elimize ulaştı. [GER.GetAdjective] ajanlarının bölgeyi istikrarsızlaştırmak için Monroe Doktrini'ni bozma ve nihayetinde dağıtma girişimlerinde bulunduğunu gördüler ve şimdi Doktrine olan sadakatimizi teyit etmek istiyorlar."
 wuw_GER_monroe.6.t:0 "[FROM.GetNameDefCap] Monroe Doktrini'ne İlişkin Duruşumuzu Tekrar Teyit Etmemizi Talep Ediyor"
 wuw_GER_monroe.7.a:0 "[FROM.GetAdjective] gazabından kaçınmak için bırak!"
 wuw_GER_monroe.7.b:0 "Tehdit edilmeyeceğiz!"
 wuw_GER_monroe.7.desc:0 "Sert ifadeli bir [FROM.GetAdjective] bize ulaştı. Monroe Doktrini'ni istikrarsızlaştırma çabalarının başarılı olduğunu ve [USA.GetNameDef]'in Doktrini düzgün bir şekilde dağıtmasının sadece an meselesi olduğunu iddia ediyorlar. Bize Doktrini bırakma ve öfkelerinden kaçınma şansı vermek isteyerek, bize Doktrine karşı çıkmak için bu son şansı verdiler."
 wuw_GER_monroe.7.t:0 "[FROM.GetAdjective] Ültimatomu"
 wuw_GER_monroe.8.a:0 "Doktrine geri dön"
 wuw_GER_monroe.8.b:0 "Zaten Monroe Doktrini'ni hiç istememiştik!"
 wuw_GER_monroe.8.c:0 "Elbette, sadece fırtınanın dinmesini bekledik"
 wuw_GER_monroe.8.desc:0 "[FROM.GetAdjective] lideri [FROM.GetLeader] bizzat bize ulaştı. [FROM.GetLeader.GetSheHeCap], [GER.GetAdjective] çabalarına rağmen Monroe Doktrini'nin hala ayakta olduğu konusunda bizi uyarıyor. Onların korumasından yararlandığımızı ve bunun da Doktrini onlarla birlikte ayakta tutma sorumluluğunu getirdiğini vurguluyorlar."
 wuw_GER_monroe.8.t:0 "[FROM.GetNameDefCap] Monroe Doktrini'ndeki Israrını Artırıyor."
 wuw_GER_monroe.9.a:0 "Harika!"
 wuw_GER_monroe.9.desc:0 "Çabalarımız nihayet sonuç verdi. [FROM.GetNameDef] lideri [FROM.GetLeader] az önce Monroe Doktrini'nin dağıtıldığını duyurdu. Elbette [FROM.GetLeader.GetSheHe] bundan kötü bir şey olarak bahsetti, ama biz biliyoruz ki eskiden Doktrine dahil olan ülkeler bu gelişmeyi takdir edecektir."
 wuw_GER_monroe.9.t:0 "[FROM.GetNameDefCap] Monroe Doktrini'ni Dağıtıyor"
 wuw_GER_monroe_news.1.a:0 "Gerçekten harika"
 wuw_GER_monroe_news.1.b:0 "Ne Kadar Korkunç"
 wuw_GER_monroe_news.1.c:0 "Harika bir gün!"
 wuw_GER_monroe_news.1.d:0 "Korkunç bir gün!"
 wuw_GER_monroe_news.1.desc:0 "[GER.GetNameDef] tarafından yapılan yoğun baskı ve diplomatik çabaların ardından, sözde Monroe Doktrini çöktü. [USA.GetNameDef] tarafından Amerika'yı güvende tutmak için uygulamaya konulan Doktrin, en azından bir dereceye kadar kıtada barışı sağlamıştı. [GER.GetAdjective]lerin bunu yapma nedenleri belirsizliğini koruyor."
 wuw_GER_monroe_news.1.t:0 "Monroe Doktrini'nin Çöküşü"
 wuw_GER_mutual_guarantees.1.a:0 "Bu karşılıklı yarar sağlayan bir anlaşma"
 wuw_GER_mutual_guarantees.1.b:0 "Bu paktta bir değer görmüyoruz"
 wuw_GER_mutual_guarantees.1.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], karşılıklı garantiler ve işbirliği teklifiyle bize başvurdu. Anlaşma, birbirimizin topraklarının karşılıklı korunmasını kapsayacak ve gelecekte potansiyel olarak daha da büyük bir şeye dönüşebilecektir. Ne diyoruz?"
 wuw_GER_mutual_guarantees.1.t:0 "[FROM.GetNameDefCap] Karşılıklı İşbirliği Talep Ediyor"
 wuw_GER_mutual_guarantees.2.a:0 "Harika"
 wuw_GER_mutual_guarantees.2.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], karşılıklı işbirliği ve garantiler talebimizi kabul etti ve diplomatlarımızı açık kollarla karşıladı, dengeyi tehdit eden yabancı güçlerden uluslarımızı ancak birlikte koruyabileceğimizi iddia etti."
 wuw_GER_mutual_guarantees.2.t:0 "[FROM.GetNameDefCap] Karşılıklı İşbirliğini Memnuniyetle Karşılıyor"
 wuw_GER_mutual_guarantees.3.a:0 "Büyük bir hata yapıyorlar"
 wuw_GER_mutual_guarantees.3.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], karşılıklı koruma ve işbirliği paktı talebimizi reddetti ve bunun, onları zayıflatmak için sadece halklarının kalbine gizlice sızma yolumuz değil, aynı zamanda devletleri üzerinde nihai bir egemenlik hilesi olduğunu iddia etti. Gerçekten de kaçırdıkları teklifin farkında değiller..."
 wuw_GER_mutual_guarantees.3.t:0 "[FROM.GetNameDefCap] Karşılıklı İşbirliğini Reddediyor"
 wuw_GER_news.1.a:0 "Almanya nihayet yeniden bir bütün"
 wuw_GER_news.1.b:0 "Bu sadece başlangıç"
 wuw_GER_news.1.d:0 "Uzun zamandır farklı devletler arasında bölünmüş, keyfi sınırlarla kardeşleri birbirinden ayıran Alman halkı, yeni bir Alman devletinin yükselişiyle bir kez daha sevinebilir. Son siyasi atılımların ardından [FROM.GetLeader], Bismarck'ın ruhuna uygun hareket ederek bin yıl ayakta kalacak bir ulus olan Almanya'nın yeniden birleştiğini ilan etti!"
 wuw_GER_news.1.t:0 "Almanya'nın Yeniden Birleşmesi"
 wuw_GER_news.2.a:0 "Olayların ilginç bir şekilde gelişmesi"
 wuw_GER_news.2.b:0 "Daha önce denediler ve başarısız oldular"
 wuw_GER_news.2.c:0 "İşte bizim anımız!"
 wuw_GER_news.2.d:0 "Umarım bu sefer başarırlar"
 wuw_GER_news.2.desc:0 "Versay Antlaşması'nın imzalanmasından bu yana dördüncü kez, Alman Silezyası'ndaki isyancılar hükümete karşı ayaklandı. Bu kez [SIL.GetLeader], askeri eylemlerinin hedeflerinin esas olarak bir Silezya devletinin bağımsızlığını güvence altına alırken, aynı zamanda Alman iç savaşı sırasında Silezya halkını zarardan korumak olduğunu iddia ediyor, ancak önceki isyanların hedefi daha çok Polonya devleti içinde özerklik kazanmaktı. Alman ordusuna karşı durup duramayacaklarını sadece zaman gösterecek."
 wuw_GER_news.2.t:0 "Silezya'da bir Ayaklanma"
 wuw_GER_realpolitik.1.a:0 "Bu teklifi alçakgönüllülükle kabul ediyoruz"
 wuw_GER_realpolitik.1.b:0 "Onların dostluğuna ihtiyacımız yok!"
 wuw_GER_realpolitik.1.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader] bugün başkentimize gelerek bize bir teklif sundu. İttifaklarına katılmamızı ve daha önce kurulmuş tüm ortaklık ve birliklere katılmamızı istiyorlar. Bu teklifi kabul edecek miyiz?"
 wuw_GER_realpolitik.1.t:0 "[FROM.GetNameDefCap] Bizi bir İttifaka Davet Ediyor"
 wuw_GER_realpolitik.10.a:0 "Belki bizi [SOV.GetAdjective]lerden koruyabilirler"
 wuw_GER_realpolitik.10.b:0 "Sisu ile boyun eğmeyeceğiz!"
 wuw_GER_realpolitik.10.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], 1918'de tahtımıza bir von Hessen'i ilk kabul ettiğimizde olduğu gibi, yönetimlerine boyun eğmemizi ve onların bir bağlı devleti olmamızı talep etti. Taleplerine boyun eğmeli miyiz?"
 wuw_GER_realpolitik.10.t:0 "[FROM.GetNameDefCap] Monarşiyi Geri Getirmemizi Talep Ediyor"
 wuw_GER_realpolitik.11.a:0 "[ROOT.GetNameDef] için harika bir gün!"
 wuw_GER_realpolitik.11.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], eski hükümetin monarşiden ve Alman taht taliplisinden vazgeçmesinin bir hata olması nedeniyle [FROM.GetAdjective] ulusunun yönetimimize boyun eğeceğini açıkladı."
 wuw_GER_realpolitik.11.t:0 "[FROM.GetNameDefCap] Taleplerimizi Kabul Ediyor"
 wuw_GER_realpolitik.12.a:0 "Kararlarından pişman olacaklar"
 wuw_GER_realpolitik.12.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], boyun eğmelerini talep etme nedenlerimizin halkımız ve ulusal irademiz kadar kırılgan olduğunu açıkladı. Gerekirse özgürlükleri için savaşmaya niyetli görünüyorlar..."
 wuw_GER_realpolitik.12.t:0 "[FROM.GetNameDefCap] Taleplerimizi Reddediyor"
 wuw_GER_realpolitik.13.a:0 "Belki bizi [SOV.GetAdjective]lerden koruyabilirler"
 wuw_GER_realpolitik.13.b:0 "Sisu ile boyun eğmeyeceğiz!"
 wuw_GER_realpolitik.13.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], bizi [SOV.GetAdjective] tehdidinden daha kolay korumak amacıyla yönetimlerine boyun eğmemizi ve onların bir bağlı devleti olmamızı talep ettiğini iddia ediyor. Taleplerine boyun eğmeli miyiz?"
 wuw_GER_realpolitik.13.t:0 "[FROM.GetNameDefCap] Bağlı Devletimiz Olmamızı Talep Ediyor"
 wuw_GER_realpolitik.14.a:0 "[ROOT.GetNameDef] için harika bir gün!"
 wuw_GER_realpolitik.14.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], Heimosodat'a devam etmek istiyorlarsa alabilecekleri tüm yardıma ihtiyaçları olduğu için [FROM.GetAdjective] ulusunun yönetimimize boyun eğeceğini açıkladı."
 wuw_GER_realpolitik.14.t:0 "[FROM.GetNameDefCap] Taleplerimizi Kabul Ediyor"
 wuw_GER_realpolitik.15.a:0 "Kararlarından pişman olacaklar"
 wuw_GER_realpolitik.15.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], boyun eğmelerini talep etme nedenlerimizin halkımız ve ulusal irademiz kadar kırılgan olduğunu açıkladı. Gerekirse özgürlükleri için savaşmaya niyetli görünüyorlar..."
 wuw_GER_realpolitik.15.t:0 "[FROM.GetNameDefCap] Taleplerimizi Reddediyor"
 wuw_GER_realpolitik.16.a:0 "Bu bizim için yolun sonu"
 wuw_GER_realpolitik.16.b:0 "Silah başına adamlar!"
 wuw_GER_realpolitik.16.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], [FROM.GetAdjective] devletine entegre olmamız gerektiği için varlığımızın bir an önce sona ermesi gerektiğini açıkladı. Taleplerini kabul etmeli miyiz?"
 wuw_GER_realpolitik.16.t:0 "[FROM.GetNameDefCap] İlhakımızı Talep Ediyor"
 wuw_GER_realpolitik.17.a:0 "Eğer gereken buysa..."
 wuw_GER_realpolitik.17.b:0 "Onu ellerimizden kendileri sökmek zorunda kalacaklar!"
 wuw_GER_realpolitik.17.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], eski doğu imparatorluk mülklerini, yani provinz Westpreußen, provinz Schlesien ve provinz Posen'i onlara geri vermemizi talep etti. Bu çok fazla toprak, ama belki de onu onlara geri vermek boyun eğme uçurumundan kaçınmanın tek yoludur."
 wuw_GER_realpolitik.17.t:0 "[FROM.GetNameDefCap] İmparatorluk Mülklerini Talep Ediyor"
 wuw_GER_realpolitik.18.a:0 "[ROOT.GetAdjective] ulusu için harika bir gün!"
 wuw_GER_realpolitik.18.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], [FROM.GetAdjective] ulusunun eski doğu imparatorluk mülklerimizi bize geri vereceğini açıkladı. Nihayet, Versay'ın tarihi adaletsizlikleri ortadan kalktı!"
 wuw_GER_realpolitik.18.t:0 "[FROM.GetNameDefCap] Taleplerimizi Kabul Ediyor"
 wuw_GER_realpolitik.19.a:0 "Kararlarından pişman olacaklar"
 wuw_GER_realpolitik.19.b:0 "Acele etmenin zamanı değil"
 wuw_GER_realpolitik.19.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], topraklarını talep etme nedenlerimizin Versay tarafından geçersiz kılındığını ve bu antlaşmayı ihlal etme hakkımız olmadığını açıkladı."
 wuw_GER_realpolitik.19.t:0 "[FROM.GetNameDefCap] Taleplerimizi Reddediyor"
 wuw_GER_realpolitik.2.a:0 "Çok iyi"
 wuw_GER_realpolitik.2.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], teklifimize olumlu yanıt verdi ve diplomatları, ittifakımıza tam girişlerini kolaylaştırmak için gerekli belgeleri imzalamak üzere ulusumuza geldi."
 wuw_GER_realpolitik.2.t:0 "[FROM.GetNameDefCap] teklifimizi kabul ediyor"
 wuw_GER_realpolitik.20.a:0 "Umarım bu son olur..."
 wuw_GER_realpolitik.20.b:0 "Bu sefer çok ileri gittiler!"
 wuw_GER_realpolitik.20.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], daha da fazla toprağı onlara devretmemizi talep etti. Bu sefer [87.GetName], [98.GetName] ve [97.GetName]'i talep ediyorlar. Bir kez daha devletimize tecavüz ediyorlar, ama belki de yok olmaktan kaçınmanın tek yolu budur. Şartlarını kabul etmeli miyiz?"
 wuw_GER_realpolitik.20.t:0 "[FROM.GetNameDefCap] Daha Fazla Taviz Talep Ediyor"
 wuw_GER_realpolitik.21.a:0 "[ROOT.GetAdjective] ulusu için harika bir gün!"
 wuw_GER_realpolitik.21.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], [FROM.GetAdjective] ulusunun [87.GetName], [98.GetName] ve [97.GetName]'i bize devredeceğini açıkladı. Belki de [FROM.GetAdjective] devleti için ne gibi planlarımız olduğunu henüz anlamadılar."
 wuw_GER_realpolitik.21.t:0 "[FROM.GetNameDefCap] Taleplerimizi Kabul Ediyor"
 wuw_GER_realpolitik.22.a:0 "Hilemize kanmadılar, ama yılmayacağız!"
 wuw_GER_realpolitik.22.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], [FROM.GetAdjective] toprağını talep etme nedenlerimizin uydurma yalanlar olduğunu ve halkından geleneksel [FROM.GetAdjective] toprağını çalarken boş durmayacaklarını açıkladı. Görünüşe göre blöfümüzü gördüler."
 wuw_GER_realpolitik.22.t:0 "[FROM.GetNameDefCap] Taleplerimizi Reddediyor"
 wuw_GER_realpolitik.23.a:0 "Doğum hakkımızı geri alma zamanı!"
 wuw_GER_realpolitik.23.b:0 "Onların dostluğuna ihtiyacımız yok!"
 wuw_GER_realpolitik.23.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader] bugün başkentimize gelerek bize bir teklif sundu. İttifaklarına katılmamızı ve daha önce kurulmuş tüm ortaklık ve birliklere katılmamızı istiyorlar. Ayrıca eski Osmanlı topraklarımızın yeniden fethinde bize yardım edeceklerini iddia ediyorlar. Bu teklifi kabul etmeli miyiz?"
 wuw_GER_realpolitik.23.t:0 "[FROM.GetNameDefCap] Bizi bir İttifaka Davet Ediyor"
 wuw_GER_realpolitik.24.a:0 "Çok iyi"
 wuw_GER_realpolitik.24.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], teklifimize olumlu yanıt verdi ve diplomatları, ittifakımıza tam girişlerini kolaylaştırmak için gerekli belgeleri imzalamak üzere ulusumuza geldi. Eski Osmanlı topraklarını geri almada yardımımızı memnuniyetle kabul ederlerdi."
 wuw_GER_realpolitik.24.t:0 "[FROM.GetNameDefCap] teklifimizi kabul ediyor"
 wuw_GER_realpolitik.25.a:0 "Onlar kaybeder..."
 wuw_GER_realpolitik.25.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], ittifak davetimize büyük bir hoşnutsuzlukla yanıt verdi ve ülkelerimiz arasında herhangi bir ortaklığın masadan kalktığını ve sonsuza dek öyle kalacağını iddia ediyor. Görünüşe göre eski Osmanlı topraklarını geri almada yardımımızı istemiyorlar..."
 wuw_GER_realpolitik.25.t:0 "[FROM.GetNameDefCap] teklifimizi reddediyor"
 wuw_GER_realpolitik.26.a:0 "Bunda bir sorun görmüyoruz"
 wuw_GER_realpolitik.26.b:0 "Belgelerinizi Berlin'e geri götürebilirsiniz!"
 wuw_GER_realpolitik.26.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], [FROM.GetAdjective] ulusuyla karmaşık ticaret ilişkileri olasılığını görüşmek üzere başkentimize diplomatlar gönderdi. Bu, ilişkimizi daha da yakınlaştıracaktır, ancak bu onlara kaynaklarımıza daha ucuz bir fiyata erişim sağlayacaktır, bu da ekonomimize zarar verme riski taşımaktadır."
 wuw_GER_realpolitik.26.t:0 "[FROM.GetNameDefCap] Ticaret Anlaşmaları Talep Ediyor"
 wuw_GER_realpolitik.27.a:0 "Kral için!"
 wuw_GER_realpolitik.27.b:0 "Bu aptallığı durdurmalıyız!"
 wuw_GER_realpolitik.27.desc:0 "Artan monarşist duyguların uzun bir döneminden sonra, [ROOT.GetAdjective] muhafazakar unsurları, hükümetimizin tüm gücü kendine saklama niyetinde olduğunu ve geçmiş dönemlere bir geri dönüşe izin vermediğini iddia ederek, barışçıl bir hükümet değişikliği beklemekten bıkmış görünüyor. Yoğun söylemin ardından diplomasi başarısız oldu ve silahlı çatışma başladı."
 wuw_GER_realpolitik.27.t:0 "[ROOT.GetNameDef]'de İç Savaş"
 wuw_GER_realpolitik.28.a:0 "Cumhuriyet için!"
 wuw_GER_realpolitik.28.b:0 "Bu aptallığı durdurmalıyız!"
 wuw_GER_realpolitik.28.desc:0 "Artan demokratik duyguların uzun bir döneminden sonra, [ROOT.GetAdjective] demokratik unsurları, mevcut hükümetimizin tüm gücü kendine saklama niyetinde olduğunu ve demokrasinin yeşermesi için devrilmesi gerektiğini iddia ederek, barışçıl bir hükümet değişikliği beklemekten bıkmış görünüyor. Yoğun söylemin ardından diplomasi başarısız oldu ve silahlı çatışma başladı."
 wuw_GER_realpolitik.28.t:0 "[ROOT.GetNameDef]'de İç Savaş"
 wuw_GER_realpolitik.29.a:0 "Devrim için!"
 wuw_GER_realpolitik.29.b:0 "Bu aptallığı durdurmalıyız!"
 wuw_GER_realpolitik.29.desc:0 "Artan faşist duyguların uzun bir döneminden sonra, [ROOT.GetAdjective] faşist unsurları barışçıl bir hükümet değişikliği beklemekten bıkmış ve sokaklarda çatışmaları başlatan bir yerel polis karakolunu bombalamış görünüyor. Yoğun söylemin ardından diplomasi başarısız oldu ve silahlı çatışma başladı. Sadece nefesimizi tutarak bekleyebilir ve [ROOT.GetAdjective] ulusunun geleceğinin nerede yattığını görebiliriz."
 wuw_GER_realpolitik.29.t:0 "[ROOT.GetNameDef]'de İç Savaş"
 wuw_GER_realpolitik.3.a:0 "Onlar kaybeder..."
 wuw_GER_realpolitik.3.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], ittifak davetimize büyük bir hoşnutsuzlukla yanıt verdi ve ülkelerimiz arasında herhangi bir ortaklığın masadan kalktığını ve sonsuza dek öyle kalacağını iddia ediyor. Bizi ne sanıyorlar, bir tür fatih mi?"
 wuw_GER_realpolitik.3.t:0 "[FROM.GetNameDefCap] teklifimizi reddediyor"
 wuw_GER_realpolitik.33.a:0 "Kaçırmak için çok iyi"
 wuw_GER_realpolitik.33.b:0 "Ekonomik bağımsızlığımızdan vazgeçmeyeceğiz!"
 wuw_GER_realpolitik.33.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader] bugün başkentimize gelerek bize bir teklif sundu. Gümrük birliği faaliyetlerimizi artırmamızı ve onlarla ekonomik entegrasyonumuzu ilerletmemizi istiyorlar. Ekonomimize önemli ölçüde yardımcı olacaktır, ama bütün bunlarda bir bit yeniği kokusu var..."
 wuw_GER_realpolitik.33.t:0 "[FROM.GetNameDefCap] Ekonomik Entegrasyon Talep Ediyor"
 wuw_GER_realpolitik.34.a:0 "Saflıkları için minnettarız"
 wuw_GER_realpolitik.34.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], teklifimize olumlu yanıt verdi ve diplomatları, daha fazla ekonomik entegrasyonlarını kolaylaştırmak için gerekli belgeleri imzalamak üzere ulusumuza geldi."
 wuw_GER_realpolitik.34.t:0 "[FROM.GetNameDefCap] teklifimizi kabul ediyor"
 wuw_GER_realpolitik.35.a:0 "Korkunç haber..."
 wuw_GER_realpolitik.35.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], entegrasyon davetimize büyük bir hoşnutsuzlukla yanıt verdi ve ülkelerimiz arasında herhangi bir daha yakın ekonomik ortaklığın masadan kalktığını ve sonsuza dek öyle kalacağını iddia ediyor. Belki de onlar için ne sakladığımızı görebilmişlerdir..."
 wuw_GER_realpolitik.35.t:0 "[FROM.GetNameDefCap] teklifimizi reddediyor"
 wuw_GER_realpolitik.36.a:0 "Küçük-Alman çözümü bir hataydı"
 wuw_GER_realpolitik.36.b:0 "Bağımsızlığımızdan taviz vermeyeceğiz!"
 wuw_GER_realpolitik.36.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], halk aynı olduğu ve tek bir daha güçlü devlet altında birleşerek daha iyi korunmuş hissedecekleri için ulusumuzun kendilerininkiyle birleşmesini önerdi. Mesajda ağır elli ve saldırgan bir ima var, ama belki de daha büyük bir bütünün parçası olmak en iyisidir?"
 wuw_GER_realpolitik.36.t:0 "[FROM.GetNameDefCap] Birleşme Öneriyor"
 wuw_GER_realpolitik.37.a:0 "[ROOT.GetAdjective] ulusu için harika bir gün!"
 wuw_GER_realpolitik.37.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], yapılan bir halk oylamasının ardından [FROM.GetAdjective] ulusunun bu günden itibaren resmen sona ereceğini ve [ROOT.GetAdjective] topraklarının ayrılmaz bir parçası haline geleceğini ilan etti. Görünüşe göre ikna çabamız başarılı oldu."
 wuw_GER_realpolitik.37.t:0 "[FROM.GetNameDefCap] Taleplerimizi Kabul Ediyor"
 wuw_GER_realpolitik.38.a:0 "Bu durumda isteklerine saygı duymalıyız"
 wuw_GER_realpolitik.38.b:0 "[FROM.GetNameDefCap] [ROOT.GetAdjective]!"
 wuw_GER_realpolitik.38.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], [FROM.GetAdjective] boyunduruğunu talep etme nedenlerimizin [FROM.GetAdjective] egemenliği ve kendi kaderini tayin etme fikrini tamamen baltaladığını açıkladı. Görünüşe göre daha Büyük bir Cermen devletinin parçası olmak istemiyorlar."
 wuw_GER_realpolitik.38.t:0 "[FROM.GetNameDefCap] Taleplerimizi Reddediyor"
 wuw_GER_realpolitik.39.a:0 "Doğum hakkımızı geri alma zamanı!"
 wuw_GER_realpolitik.39.b:0 "Onların dostluğuna ihtiyacımız yok!"
 wuw_GER_realpolitik.39.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader] bugün başkentimize gelerek bize bir teklif sundu. İttifaklarına katılmamızı ve daha önce kurulmuş tüm ortaklık ve birliklere katılmamızı istiyorlar. Ayrıca eski Macar topraklarımızın yeniden fethinde bize yardım edeceklerini ve Büyük Macaristan'ı restore etmemize yardımcı olacaklarını iddia ediyorlar. Bu teklifi kabul etmeli miyiz?"
 wuw_GER_realpolitik.39.t:0 "[FROM.GetNameDefCap] Bizi bir İttifaka Davet Ediyor"
 wuw_GER_realpolitik.4.a:0 "Bu kesinlikle işe yarayacaktır"
 wuw_GER_realpolitik.4.desc:0 "[FROM.GetAdjective]ler savaş çabamızda bizi desteklemek istiyor ve biraz teçhizat gönderdiler. Oldukça küçük bir sevkiyat ama her türlü yardım kabul edilir."
 wuw_GER_realpolitik.4.t:0 "[FROM.GetNameDefCap] Askeri Destek Gönderiyor"
 wuw_GER_realpolitik.40.a:0 "Çok iyi"
 wuw_GER_realpolitik.40.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], teklifimize olumlu yanıt verdi ve diplomatları, ittifakımıza tam girişlerini kolaylaştırmak için gerekli belgeleri imzalamak üzere ulusumuza geldi. Eski Macar topraklarını geri almada yardımımızı memnuniyetle kabul ederlerdi."
 wuw_GER_realpolitik.40.t:0 "[FROM.GetNameDefCap] teklifimizi kabul ediyor"
 wuw_GER_realpolitik.41.a:0 "Onlar kaybeder..."
 wuw_GER_realpolitik.41.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], ittifak davetimize büyük bir hoşnutsuzlukla yanıt verdi ve ülkelerimiz arasında herhangi bir ortaklığın masadan kalktığını ve sonsuza dek öyle kalacağını iddia ediyor. Görünüşe göre eski Macar topraklarını geri almada yardımımızı istemiyorlar..."
 wuw_GER_realpolitik.41.t:0 "[FROM.GetNameDefCap] teklifimizi reddediyor"
 wuw_GER_realpolitik.42.a:0 "Doğum hakkımızı geri alma zamanı!"
 wuw_GER_realpolitik.42.b:0 "Onların dostluğuna ihtiyacımız yok!"
 wuw_GER_realpolitik.42.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader] bugün başkentimize gelerek bize bir teklif sundu. İttifaklarına katılmamızı ve Büyük Savaş'ta yaptığımız gibi bir kez daha kardeşçe omuz omuza savaşmamızı istiyorlar. Ayrıca eski Avusturya-Macaristan topraklarımızın yeniden fethinde bize yardım edeceklerini ve İmparatorluğun toprak bütünlüğünü restore etmemize yardımcı olacaklarını iddia ediyorlar. Bu teklifi kabul etmeli miyiz?"
 wuw_GER_realpolitik.42.t:0 "[FROM.GetNameDefCap] Bizi bir İttifaka Davet Ediyor"
 wuw_GER_realpolitik.43.a:0 "Muhteşem"
 wuw_GER_realpolitik.43.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], teklifimize olumlu yanıt verdi ve diplomatları, Mitteleuropa'ya tam girişlerini kolaylaştırmak için gerekli belgeleri imzalamak üzere ulusumuza geldi. Eski Avusturya-Macaristan topraklarını geri almada yardımımızı memnuniyetle kabul ederler ve bir kez daha dünyaya karşı kardeşçe omuz omuza savaşmak isterlerdi."
 wuw_GER_realpolitik.43.t:0 "[FROM.GetNameDefCap] teklifimizi kabul ediyor"
 wuw_GER_realpolitik.44.a:0 "Kendi halkları için en iyisinin ne olduğunu görmüyorlar"
 wuw_GER_realpolitik.44.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], ittifak davetimize büyük bir hoşnutsuzlukla yanıt verdi ve ülkelerimiz arasında herhangi bir ortaklığın masadan kalktığını ve sonsuza dek öyle kalacağını iddia ediyor. Görünüşe göre eski Avusturya-Macaristan topraklarını geri almada yardımımızı istemiyorlar..."
 wuw_GER_realpolitik.44.t:0 "[FROM.GetNameDefCap] teklifimizi reddediyor"
 wuw_GER_realpolitik.45.a:0 "Anlaştık!"
 wuw_GER_realpolitik.45.b:0 "Bunu kabul edemeyiz"
 wuw_GER_realpolitik.45.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader] ilginç bir teklifle bize başvurdu. Eski Çekoslovak topraklarını iki ulusumuz arasında bölmek istiyorlar. Kulağa iyi bir fikir gibi geliyor, değil mi?"
 wuw_GER_realpolitik.45.t:0 "[FROM.GetLeader] Çekoslovakya'yı Bölmek İstiyor"
 wuw_GER_realpolitik.46.a:0 "İkisiyle de savaşamayız..."
 wuw_GER_realpolitik.46.b:0 "Asla teslim olmayacağız!"
 wuw_GER_realpolitik.46.desc:0 "[GER.GetNameDef]'in lideri [GER.GetLeader], eskiden Avusturya-Macaristan İmparatorluğu'nun bir parçası olan tüm Çekoslovak topraklarını onlara ve müttefiklerine geri vermemizi talep etti. Bizim için kötü bir anlaşma gibi görünüyor, ama belki de onlara karşı duramayız?"
 wuw_GER_realpolitik.46.t:0 "[GER.GetNameDefCap] Çekoslovak Topraklarını Talep Ediyor"
 wuw_GER_realpolitik.47.a:0 "Harika"
 wuw_GER_realpolitik.47.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], ne kadar sert olursa olsun taleplerimize boyun eğdi. Birliklerimiz çoktan harekete geçti ve nihayet uzun zamandır kayıp olan geçmiş ihtişamı geri getirme zamanı geldi."
 wuw_GER_realpolitik.47.t:0 "[FROM.GetLeader] Çekoslovakya'yı Bölmeyi Kabul Ediyor"
 wuw_GER_realpolitik.48.a:0 "Bizim olanı geri alacağız!"
 wuw_GER_realpolitik.48.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], haklı topraklarımızı bize vermeyi reddetti ve eğer onu istiyorsak, kendi ellerimizle almamız gerektiğini iddia ediyor. [FROM.GetAdjective]ler büyük konuşuyor, ama arkasında durabilirler mi?"
 wuw_GER_realpolitik.48.t:0 "[FROM.GetLeader] Çekoslovakya'yı Bölmeyi Reddediyor"
 wuw_GER_realpolitik.49.a:0 "Pekala..."
 wuw_GER_realpolitik.49.b:0 "O zaman bizi zorla almak zorunda kalacaklar!"
 wuw_GER_realpolitik.49.desc:0 "Hakim devletimiz bize tamamen ihanet etti ve topraklarımızı [GER.GetNameDef]'e devretmeyi seçti. Seçimlerine uymalı mıyız yoksa onlara direnmeye mi çalışmalıyız?"
 wuw_GER_realpolitik.49.t:0 "Hakim Devletimiz Bizi [GER.GetNameDef]'e Teslim Ediyor"
 wuw_GER_realpolitik.5.a:0 "[ROOT.GetNameDef]'e dahil edilmeliler"
 wuw_GER_realpolitik.5.b:0 "Belki onları bağlı devletimiz yapabiliriz"
 wuw_GER_realpolitik.5.desc:0 "Brest-Litovsk antlaşmasında belirtildiği gibi, şu anda Litvanya olarak bilinen topraklar bizim bir bağlı devletimiz olacaktı, ancak kesin ayrıntılar tam olarak belirlenmemişti. Şimdi yeniden gündeme geldiğine göre, [LIT.GetNameDef] ile nasıl başa çıkacağımıza karar vermeliyiz?"
 wuw_GER_realpolitik.5.t:0 "[LIT.GetAdjective] Sorunu"
 wuw_GER_realpolitik.50.a:0 "O zaman yapabileceğimiz pek bir şey yok..."
 wuw_GER_realpolitik.50.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], eski Avusturya-Macaristan Çekoslovak topraklarını bölme önerimizi reddetti. Görünüşe göre anlaşma iptal oldu..."
 wuw_GER_realpolitik.50.t:0 "[FROM.GetNameDefCap] Teklifimizi Reddediyor"
 wuw_GER_realpolitik.51.a:0 "Kan dökmeye değmez"
 wuw_GER_realpolitik.51.b:0 "O zaman gel de al!"
 wuw_GER_realpolitik.51.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], son zamanlarda Galiçya topraklarımızdaki, onların belirttiği gibi, yasadışı işgalimizi kınadı, çünkü toprakların hala eski Avusturya-Macaristan İmparatorluğu'nun haklı bir parçası olduğu iddia ediliyor, ki [FROM.GetNameDef] ve müttefikleri buna tamamen hak iddia ediyor. Şimdi, bir [FROM.GetAdjective] ültimatomu aldık ve birlikleri sınırımızda toplanıyor. Nasıl yanıt vermeliyiz?"
 wuw_GER_realpolitik.51.t:0 "Birinci Berlin Ödülü"
 wuw_GER_realpolitik.52.a:0 "Bu harika bir gün!"
 wuw_GER_realpolitik.52.desc:0 "[FROM.GetNameDef]'in makul lideri [FROM.GetLeader], Galiçya'daki topraklarını ittifakımıza devretmeyi kabul etti ve birliklerine geri çekilmelerini ve bölgeden çekilmelerini söyledi. Bir kez daha zafer bizim!"
 wuw_GER_realpolitik.52.t:0 "[FROM.GetNameDefCap] Galiçya'yı Devrediyor"
 wuw_GER_realpolitik.53.a:0 "Kararlarından pişman olacaklar!"
 wuw_GER_realpolitik.53.b:0 "Bunu bırakmalıyız..."
 wuw_GER_realpolitik.53.desc:0 "Tamamen beklenmedik olmasa da, [FROM.GetNameDef]'in aptal lideri [FROM.GetLeader], ültimatomumuzu aldıktan sonra ülkenin birliklerini yüksek alarma geçirdi ve anlaşmazlık konusunda tek bir adım bile geri atmayacaklarını belirten bir elçi gönderdi."
 wuw_GER_realpolitik.53.t:0 "[FROM.GetNameDefCap] Kararlı Duruyor"
 wuw_GER_realpolitik.54.a:0 "Kan dökmeye değmez"
 wuw_GER_realpolitik.54.b:0 "O zaman gel de al!"
 wuw_GER_realpolitik.54.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], son zamanlarda Banat ve Transilvanya topraklarımızdaki, onların belirttiği gibi, yasadışı işgalimizi kınadı, çünkü toprakların hala eski Avusturya-Macaristan İmparatorluğu'nun haklı bir parçası olduğu iddia ediliyor, ki [FROM.GetNameDef] ve müttefikleri buna tamamen hak iddia ediyor. Şimdi, bir [FROM.GetAdjective] ültimatomu aldık ve birlikleri sınırımızda toplanıyor. Nasıl yanıt vermeliyiz?"
 wuw_GER_realpolitik.54.t:0 "İkinci Berlin Ödülü"
 wuw_GER_realpolitik.55.a:0 "Bu harika bir gün!"
 wuw_GER_realpolitik.55.desc:0 "\n[FROM.GetNameDef]'in makul lideri [FROM.GetLeader], eski Macar topraklarındaki topraklarını ittifakımıza devretmeyi kabul etti ve birliklerine geri çekilmelerini ve bölgeden çekilmelerini söyledi. Bir kez daha zafer bizim!"
 wuw_GER_realpolitik.55.t:0 "[FROM.GetNameDefCap] Eski Macar Mülklerini Devrediyor"
