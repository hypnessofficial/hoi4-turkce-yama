 AUS_air_force_partnership_small:0 "Hava Kuvvetleri Ortaklığı"
 AUS_aligned_with_our_values:0 "Değerlerimizle Aynı Çizgide"
 AUS_anschluss_ratio_lowered:0 "§YAnschluss§! için gereken §YToplam Ordu Savaş Gücü§! §YDüşürülecek§!"
 AUS_anschluss_ratio_raised:0 "§YAnschluss§! için gereken §YToplam Ordu Savaş Gücü§! §YArtırılacak§!"
 AUS_anschluss_ratio_ticking_down:0 "§YAnschluss§! Milli Hedefini başlatmak için gereken §YToplam Ordu Savaş Gücü§! haftalık olarak düşürülecektir. Miktar, §Y[AUS.GetNameWithFlag]§!'daki §YTarafsızlık§! popülerliği ile orantılıdır."
 AUS_anschluss_ratio_ticking_down_monarchist:0 "§YAnschluss§! Milli Hedefini başlatmak için gereken §YToplam Ordu Savaş Gücü§! haftalık olarak düşürülecektir. Miktar, §Y[AUS.GetNameWithFlag]§!'daki §YFaşizm§! popülerliği ile orantılıdır."
 AUS_banned_dnsap:0 "DNSAP Yasaklandı"
 AUS_became_subject:0 "[ROOT.GetNameDefCap], bağımsızlığımızı kaybettiğimizden beri radikal değişiklikler geçiriyor. Birçoğu tam bağımsız olmamanın daha az hoş yan etkileri olsa da, son zamanlarda nadir görülen olumlu bir etki ortaya çıktı. Artık bağımsız olmadığımız için, bizi entegre etme girişimi sadece kendi öfkemizden fazlasını uyandırırdı.\n\nBunun farkında olan [GER.GetLeader], bizi [GER.GetNameDef]'e katılmaya zorlama planını iptal etmiş görünüyor."
 AUS_british_monarch:0 "Uzun bir İngiliz Kraliçeleri soyundan gelen Lider"
 AUS_broke_the_treaty:0 "Antlaşmamızı İhlal Etti"
 AUS_broke_the_treaty_democratic:0 "Antlaşmamızı İhlal Etti"
 AUS_bullied_austria:0 "[AUS.GetNameDef]'e Zorbalık Yaptı"
 AUS_grossosterreich_fascism_key:0 "Großösterreich"
 AUS_grossosterreich_neutrality_key:0 "Büyük Avusturya İmparatorluğu"
 AUS_guarantor_is_italy_key:0 "[FROM.GetNameDefCap] bize General ve zaman zaman askeri ataşe olan Emil Liebitzky'yi bir yardım talebiyle gönderdi. O ve [FROM.GetAdjective] liderliğindeki diğerleri, [GER.GetNameDef]'den endişe verici eğilimler gördüler ve şimdi durum hakkındaki değerlendirmelerinin doğru olması durumunda bizden daha resmi bir destek istiyorlar. \n\nSaint-Germain-En-Laye Antlaşması'nı imzalayan taraflar olarak, onların yardımına koşmamız muhtemelen bekleniyor, ancak metindeki boşluklar muhtemelen bulunabilir."
 AUS_guarantor_is_not_italy_key:0 "[FROM.GetNameDefCap] bize bir büyükelçi göndererek yardımımızı istedi. [FROM.GetAdjective] liderlikleri, [GER.GetNameDef] liderliğinden endişe verici eğilimler gördüler ve Saint-Germain-En-Laye Antlaşması nedeniyle tehdide karşı seferber olamadıkları için şimdi bizden daha resmi bir şekilde destek talep ediyorlar. Antlaşmada ve sonraki sözleşmelerde onlara yardım etmeyi kabul ettik, ancak bu desteğin tam olarak nasıl olması gerektiğine dair bir taslak yok."
 AUS_has_not_rejected_before:0 "[FROM.GetAdjective] liderliğinden [FROM.GetLeader] taleplerimize yanıt verdi. Mektup diplomatik bir dille yazılmış, ancak yine de aşağılayıcı bir alt ton taşıyor. Endişelerimiz sanki hiç yokmuş gibi bir kenara itildi, bu da [FROM.GetNameDef] hakkındaki endişelerimizin gerçekten de haklı olduğunu gösteriyor. Liderliğimiz içinden, [FROM.GetAdjective]leri boyun eğmeye zorlamaya devam etmemiz için sesler yükseldi, çünkü bu gelecekteki planlarımızı onlar için daha kolay başarılabilir hale getirebilir, ancak bir azınlık, [FROM.GetAdjective]lere bu anlamsız zaferi vermeyi düşünmemiz gerektiğini belirtiyor."
 AUS_industrial_help:0 "Sanayi Desteği"
 AUS_integration_target_is_not_poland_key:0 "[FROM.GetAdjective] hükümeti bize bir ültimatomla ulaştı. [Get37PuppetOrNotDesc]'i isteyerek teslim edin ya da savaş alanında yeniden inşa edilmiş savaş makinelerinin gücüyle yüzleşin. Bu soruda hangi yolu seçersek seçelim, sonuçsuz bir ilerleme yolu olmayacak gibi görünüyor."
 AUS_integration_target_is_poland_key:0 "[FROM.GetAdjective] hükümetinden bize sert bir mesaj iletildi. [Get37PuppetOrNotDesc]'i onlara teslim etmemizi talep ediyorlar ve direnmeye kalkışmamız durumunda sonuçları olabileceği konusunda bizi uyarıyorlar.\n\n[FROM.GetNameDef]'in bu saldırgan eylemi, civardaki diğer ülkelere yönelik bir dizi benzer talebin ardından tamamen beklenmedik değildi."
 AUS_is_more_likely_to_accept_being_brothers_in_arms_flag:0 "§Y[AUS.GetAdjective]§! halkı bizim tarafımıza çekildi"
 AUS_joined_faction:0 "Artık [ROOT.GetFactionName] İttifakının bir parçası olduğumuzdan, [GER.GetLeader] bizi [GER.GetNameDef]'e entegre etme girişiminden vazgeçmiş görünüyor.\n\nBağımsızlığımızı koruyabildiğimizden emin olmak için buna çok çalıştık ve harcadığımız zamana değdi."
 AUS_makes_demands_desc_56:0 "[FROM.GetNameDef]'e yönelttiğimiz taleplerimiz onaylandı. [FROM.GetAdjective]ler, [39.GetName] ve [850.GetName] eyaletlerini derhal bize devredecek ve sonunda bu iki eyalet bir kez daha bizim olacak!"
 AUS_makes_demands_desc_57:0 "[FROM.GetAdjective] liderliğine gönderilen taleplerimiz hoş karşılanmadı. Taleplerimizi reddediyorlar ve daha fazla baskı yapmamız veya bu tür taleplerde bulunmak için başka bir girişimde bulunmamız için hiçbir alan bırakmıyorlar."
 AUS_makes_demands_title_56:0 "[FROM.GetNameDefCap] Eyaletleri Devrediyor"
 AUS_makes_demands_title_57:0 "[FROM.GetNameDefCap] Taleplerimizi Reddediyor"
 AUS_market_help:0 "Pazar Desteği"
 AUS_meddling_with_our_politics:0 "Siyasetimize Karışmak"
 AUS_news_events.1.a:0 "Bu konuda [AUS.GetNameDef]'e en iyisini diliyoruz..."
 AUS_news_events.1.b:0 "Onlara göstereceğiz..."
 AUS_news_events.1.c:0 "Östfrei!"
 AUS_news_events.1.desc:0 "Çok daha güçlü bir düşman karşısında [AUS.GetAdjective] liderliği, son zamanlardaki [GER.GetAdjective] taleplerine boyun eğmemeye ve [GER.GetNameDef]'e katılmamaya karar verdi. [GER.GetNameDef]'den birlikler [AUS.GetAdjective] sınırında sıralandı, ancak tam ölçekli bir işgalin başlayıp başlamayacağı henüz belli değil.\n\nBu olaylar, ülkeler arasındaki ilişkilerin yıllardır bozulmasının ve [GER.GetAdjective]'in [AUS.GetNameDef]'i [GER.GetNameDef]'e entegre etmesi yönündeki artan baskısının ardından geliyor."
 AUS_news_events.1.t:0 "[AUS.GetNameDefCap] [GER.GetAdjective] Anschluss'unu Reddediyor"
 AUS_news_events.10.a:0 "Bu çok saçma"
 AUS_news_events.10.b:0 "İyi iş ve bol şans!"
 AUS_news_events.10.c:0 "İleri!"
 AUS_news_events.10.desc:0 "[FROM.GetNameDef]'de şiddetli bir İç Savaş patlak verdi. Komünist [FROM.GetCommunistParty], iktidardaki [FROM.GetNeutralParty]'ye karşı bir ayaklanma başlattı. Son zamanlarda oldukça büyük bir destek toplayan komünistler, [FROM.GetNameDef]'de hesaba katılması gereken bir güç haline geldi."
 AUS_news_events.10.t:0 "[FROM.GetNameDef]'de İç Savaş"
 AUS_news_events.11.a:0 "Neden böyle bir şey yapsınlar ki?"
 AUS_news_events.11.b:0 "Onlara en iyisini diliyoruz!"
 AUS_news_events.11.c:0 "[AUS.GetNameDef] için harika bir gün!"
 AUS_news_events.11.desc:0 "Geçmişlerinden radikal bir şekilde uzaklaşan [AUS.GetLeader] başkanlığındaki [AUS.GetAdjective] liderliği, kendi ittifaklarını kurmaya karar verdi. Orta Avrupa'daki diğer işçilerin zalimlerine karşı ayaklanıp halkın hakları için bu mücadelede onlara katılacaklarını umduğunu ifade ediyor."
 AUS_news_events.11.t:0 "[AUS.GetNameDefCap] Tuna Bloğunu Kuruyor"
 AUS_news_events.12.a:0 "Harika"
 AUS_news_events.12.b:0 "Not edildi"
 AUS_news_events.12.desc:0 "\n11 Eylül 1930'dan bu yana ilk kez [AUS.GetNameDef]'de demokratik seçimler yapıldı. Seçmen katılımı yüksekti ve oyların sayımı sona ererken [AUS.GetDemocraticParty]'den [AUS.GetLeader] kazanan olarak öne çıkıyor. Şimdi ülkeyi yeni, daha demokratik bir yola sokma gibi zor bir görevle karşı karşıya kalacak."
 AUS_news_events.12.t:0 "[AUS.GetNameDefCap] Yeniden Demokratik Seçimler Düzenliyor"
 AUS_news_events.3.a:0 "Bize iyi hizmet etti, huzur içinde yatsın"
 AUS_news_events.3.b:0 "Trajik"
 AUS_news_events.3.desc:0 "[AUS.GetAdjective] avcı ası Godwin von Brumowski, Schiphol Havaalanı üzerinde eğitim verdiği bir [HOL.GetAdjective] uçuş öğrencisiyle birlikte şiddetli bir kazada hayatını kaybetti.\n\nVon Brumowski, kudretli Luftfahrtruppen'in en başarılı avcı asıydı. 35 tekli hava zaferi, 12 paylaşılan zafer ve 8 doğrulanmamış zaferle hem Büyük Savaş'ta hem de 1934'teki [AUS.GetNameDef] İç Savaşı'nda yer aldı."
 AUS_news_events.3.t:0 "Bir Avcı Asının Gözden Düşüşü"
 AUS_news_events.4.a:0 "Kıl payı atlatıldı"
 AUS_news_events.4.desc:0 "[AUS.GetAdjective] avcı ası Godwin von Brumowski, dün Schiphol Havaalanı üzerinde bir [HOL.GetAdjective] uçuş öğrencisine eğitim verirken neredeyse bir felakete karıştı.\n\nVon Brumowski, kudretli Luftfahrtruppen'in en başarılı avcı asıydı. 35 hava zaferi, 12 paylaşılan zafer ve 8 doğrulanmamış zaferle hem Büyük Savaş'ta hem de 1934'teki [AUS.GetNameDef] İç Savaşı'nda yer aldı.\n\nİkili, bu girişimden nispeten yara almadan kurtuldu."
 AUS_news_events.4.t:0 "Avcı Ası Felaketten Kıl Payı Kurtuldu"
 AUS_news_events.5.a:0 "Endişe verici"
 AUS_news_events.5.b:0 "Sonunda!"
 AUS_news_events.5.desc:0 "\n[AUS.GetNameDef]'den [AUS.GetLeader], yakın zamanda Saint-Germain-En-Laye Antlaşması'nı kesin olarak feshetme ve yeniden silahlanma niyetlerini belirtti. Antlaşma, Büyük Savaş'tan sonra [AUS.GetNameDef]'in savaşı başlatan eylemleri tekrarlamasını ve güç kazanmak için topraklarını genişletmesini önlemek için yürürlüğe konmuştu. Teorisyenler, bunun dünyadaki yavaş yavaş artan gerilime bir yanıt olduğunu düşünüyorlar, bu askerileştirme çabasının amaçlanan kullanımının savunmacı mı yoksa saldırgan mı olduğu henüz belli değil."
 AUS_news_events.5.t:0 "[AUS.GetAdjective]ler Saint-Germain-En-Laye Antlaşmasını Feshediyor"
 AUS_news_events.6.a:0 "Endişe verici"
 AUS_news_events.6.b:0 "Harika bir gün!"
 AUS_news_events.6.desc:0 "\n\nYakın sahasında geçerli ittifak seçenekleri olmayan [AUS.GetNameDef], bir kez daha İttifak Devletleri'ni yeniden kurmaya yöneldi. Üzerlerine konulan antlaşmalardan kurtulan ülke, hızla yeniden askerileşmeye yöneldi. Bu yeni ittifaklarının Büyük Savaş'taki adaşı gibi olup olmayacağı henüz belli değil."
 AUS_news_events.6.t:0 "[AUS.GetNameDefCap] İttifak Devletleri'ni Yeniden Kuruyor"
 AUS_news_events.7.a:0 "Çok yaşa Habsburg prensi!"
 AUS_news_events.7.b:0 "Antlaşmada belirttiğimiz bu değildi!"
 AUS_news_events.7.c:0 "Onun için iyi"
 AUS_news_events.7.desc:0 "\nHayatının büyük bir bölümünü önce [SWI.GetNameDef]'de ve daha sonra [POR.GetNameDef]'deki Madeira adasında sürgünde geçiren Otto von Habsburg, [AUS.GetNameDef]'e geri döndü. Prens, 1918'de Büyük Savaş'ın sona ermesiyle monarşilerin çöküşünden sonra ebeveynleri İmparator I. Charles ve İmparatoriçe Zita ile birlikte ülkeden kaçmıştı. [AUS.GetAdjective] devlet başkanı olarak geri dönüşü, [AUS.GetNameDef]'deki siyasi iklimde belirgin bir değişikliğe işaret ediyor."
 AUS_news_events.7.t:0 "Otto von Habsburg [AUS.GetNameDef]'e Geri Dönüyor"
 AUS_news_events.8.a:0 "Neden böyle bir şey yapsınlar ki?"
 AUS_news_events.8.b:0 "Habsburg bize ait!"
 AUS_news_events.8.desc:0 "[AUS.GetLeader] yönetimindeki [AUS.GetNameDef], Habsburg şehrini geri aldı. [SWI.GetAdjective]'i iradelerine boyun eğdiren bu eylemin amacı, Habsburg ailesinin gücünü pekiştirmek ve çok daha emperyalist bir [AUS.GetName]'e keskin bir dönüşü işaret etmektir."
 AUS_news_events.8.t:0 "Habsburglar Habsburg'un Kontrolünde"
 AUS_news_events.9.a:0 "Bu beklenmedikti"
 AUS_news_events.9.b:0 "Onlara şans diliyoruz!"
 AUS_news_events.9.c:0 "Sonunda!"
 AUS_news_events.9.desc:0 "[FROM.GetNameDef]'de [FROM.GetCommunistParty]'ye artan desteğin ardından uzun bir süre sonra [FROM.GetNameDef]'de barışçıl bir darbe gerçekleşti. Komünistler ülkenin gücünü barışçıl bir şekilde ele geçirdiler ve çok az bir direnişle hükümette yerlerini aldılar. \n\nBu, [FROM.GetNameDef]'in son on yıllardır olduğundan keskin bir dönüşü işaret ediyor."
 AUS_news_events.9.t:0 "[FROM.GetNameDef]'de Komünist Darbe"
 AUS_political_events.1.a:0 "Olduğu gibi bırakmak en güvenlisi"
 AUS_political_events.1.a_tt:0 "Sanayi Kuruluşlarımızda hiçbir değişiklik yapılmayacaktır. Creditanstalt-Bankverein kullanılabilir olmaya devam ederek şunları sağlayacaktır:"
 AUS_political_events.1.b:0 "Österreichische Creditanstalt en akıllıca seçim"
 AUS_political_events.1.c:0 "Wiener Bankverein bizi hayal kırıklığına uğratmayacak"
 AUS_political_events.1.desc:0 "Yeniden sermayelendirilen Creditanstalt'ın, Wiener Bankverein'in tüm varlık ve yükümlülüklerini ve Niederösterreichische Escompte-Gesellschaft'ın faal operasyonlarını devraldığı 1934'teki banka birleşmesinin, ekonomik gelişimimizi büyük ölçüde engellemesi ve istemeden finans sektöründe bir tür tekel yaratması nedeniyle başımıza dert açtığı dikkatimizi çekti. Artık bu sektörü düzenlediğimize göre, duruma nasıl yaklaşmalıyız?"
 AUS_political_events.1.t:0 "Creditanstalt-Bankverein'in Kaderi"
 AUS_political_events.10.a:0 "Biliyorduk!"
 AUS_political_events.10.desc:0 "Dün akşam Gestapo, Wilhelm Zehner'in dairesine girdi ve Yüksek Komutanlığımızın etrafına yerleştirdiğimiz muhafızlarla karşılaştı. Çatışma çok uzun sürmedi ve Zehner arbededen tamamen yara almadan kurtuldu."
 AUS_political_events.10.t:0 "Wilhelm Zehner'in Hayatına Kastetme Girişimi Engellendi"
 AUS_political_events.100.a:0 "Bize baskı yapmalarının bir nedeni var, pes etme!"
 AUS_political_events.100.b:0 "Reddedersek misilleme riskiyle karşı karşıya kalırız"
 AUS_political_events.100.desc:0 "\nArthur Seyss-Inquart'ı hükümetimize atama konusundaki daha önceki reddimize rağmen [FROM.GetAdjective] lideri [FROM.GetLeader], bunun gerçekleşmesi için talepte bulunmaktan vazgeçmiyor. Bunun sonucunda üzerimizdeki baskı artmış olsa da, egemenliğimizi ve kendi siyasetimiz üzerindeki kontrolümüzü hala koruyoruz ve seçim hala bizim."
 AUS_political_events.100.t:0 "Arthur Seyss-Inquart'ı Atamak İçin Daha Fazla Baskı"
 AUS_political_events.101.a:0 "Sonunda"
 AUS_political_events.101.desc:0 "Kesinlikle onları ilgilendirmeyen bir konuda çok fazla gidip geldikten sonra, [FROM.GetNameDef] nihayet siyasetimizi yasa dışı olarak etkileme girişimlerini durdurdu. Şimdi bizden büyük ölçüde hoşnutsuz oldukları varsayılabilir, ancak bu bizim birincil endişemiz değil. Birincil endişemiz her zaman [ROOT.GetNameDef]'in iyileştirilmesi olmuştur, şu anda da öyledir ve her zaman da öyle olacaktır."
 AUS_political_events.101.t:0 "[FROM.GetNameDefCap] Arthur Seyss-Inquart'ı Atama Çabasını Sonlandırıyor"
 AUS_political_events.102.a:0 "Harika bir fikir!"
 AUS_political_events.102.desc:0 "[ROOT.GetLeader] tarafından yakın zamanda çağrılan bir konferansta Führer, [ROOT.GetNameDef]'in gelecekteki genişlemesi için bazı hedeflerini paylaştı. Bu tür ilk genişleme, [ROOT.GetLeader.GetSheHe]'nin çok az riskli olarak algıladığı bir genişlemedir. [AUS.GetAdjective] halkının bizimkinden hiçbir farkı yoktur ve ülkedeki siyasi iklimin de kanıtladığı gibi, çoğunlukla benzer görüşlere sahiptirler. Führer, [AUS.GetNameDef] içinde [ROOT.GetAdjective] dostu duyguların büyümesi için yeterli zaman verildiğinde, böyle bir genişlemenin diplomatik olarak gerçekleştirilmesinin mümkün olacağına inanıyor."
 AUS_political_events.102.t:0 "Führer Genişlemeyi Planlıyor"
 AUS_political_events.103.a:0 "Bu kötü."
 AUS_political_events.103.desc:0 "[GER.GetAdjective]'in bizi ilhak etme niyetinden uzun süredir şüpheleniyor olsak da, bu sabah aldığımız rapor olayları yeni, çok daha vahim bir perspektife soktu. Görünüşe göre yakın zamanda bir konferans düzenlendi ve bu sırada [GER.GetLeader], ülkelerine nasıl entegre edilebileceğimize dair aşağılık fikirler dile getirdi. Tüm çabalarımıza rağmen, bu son derece gizli bilginin kitlelere ve daha da endişe verici bir şekilde, bunun harika bir fikir olduğunu düşünen siyasi partilere ulaştığı görülüyor. Bu gruplar, [GER.GetLeader]'in bu sefil planları gerçekleşirse, halkımızın karşı koyma iradesini büyük olasılıkla baltalayacaktır."
 AUS_political_events.103.t:0 "[GER.GetAdjective] Genişlemeciliği Hakkında Endişe Verici Rapor"
 AUS_political_events.104.a:0 "Asla olmaz, buna kanmayız"
 AUS_political_events.104.b:0 "Ne yanlış gidebilir ki?"
 AUS_political_events.104.c:0 "Elizabeth..?"
 AUS_political_events.104.desc:0 "Bu sabah son derece alışılmadık bir toplantı gerçekleşti. Liderliğimiz, daha önce gördükleri hissinden kurtulamadıkları garip bir adamla yüz yüze geldi, sesi bile tanıdıktı. Bu adam, hevesli bir sanatçı olduğunu, [GER.GetNameDef]'den geldiğini ve bize yardım etmek istediğini iddia ediyor. Yetenekli bir lider olduğunu ve ülkemizin böyle birine acilen ihtiyacı olduğunu belirtiyor.\n\nSınır muhafızlarımıza sorduğumuzda, bu isimde kimsenin sınırı geçmediğini ve en yakın eşleşmenin Elizabeth Hiedler olacağını inkar ediyorlar."
 AUS_political_events.104.t:0 "[GER.GetAdjective] Sürgünü"
 AUS_political_events.105.a:0 "Artık kaybedilmiş bir dava."
 AUS_political_events.105.b:0 "Yalnız kalacağız!"
 AUS_political_events.105.desc:0 "[GER.GetNameDef], kendileri tarafından ilhak edilmemize izin vermemiz için giderek daha agresif bir şekilde baskı yaparken, [ITA.GetAdjective]lere ve onların garantisine güvenebileceğimizi düşünmüştük. Görünüşe göre durum böyle değilmiş. [GER.GetAdjective] saldırganlığı tehdidiyle karşılaştıklarında hemen geri çekildiler ve bizi tehlikeli bir durumda bıraktılar. Görünüşe göre vaatleri boş laftan başka bir şey değilmiş."
 AUS_political_events.105.t:0 "[FROM.GetNameDefCap] Desteğini Geri Çekiyor"
 AUS_political_events.106.a:0 "[GER.GetAdjective]ler eylemlerinden pişman olacak!"
 AUS_political_events.106.desc:0 "[GER.GetNameDef]'den gelen son düşmanlıklar ışığında [ITA.GetAdjective]ler, desteklerini yeniden teyit etmek için bize ulaştılar. Tehditler ne olursa olsun bağımsızlığımızı garanti edecekler ve silahlı bir çatışma çıkarsa yanımızda savaşacaklar."
 AUS_political_events.106.t:0 "[FROM.GetNameDefCap] Desteğini Tekrar Teyit Ediyor"
 AUS_political_events.107.a:0 "Onları kurtaracağız!"
 AUS_political_events.107.a_tt:0 "[GER.GetNameDef]'e karşı bir savaş başlattığımızda, şunları kazanacağız:\n"
 AUS_political_events.107.b:0 "Bu kaybedilmiş bir dava"
 AUS_political_events.107.desc:0 "[FROM.GetLeader]'in [GER.GetNameDef]'e entegre olma yönündeki [GER.GetAdjective] taleplerine teslim olduğu yıkıcı haberi bize ulaştı. [FROM.GetAdjective]lere garanti teklif etmemize rağmen, bu vaat onları karşı koymaya teşvik etmek için yeterli olmamış gibi görünüyor. Bölgede hala bir çıkarımız var, bu yüzden gelecekte [FROM.GetAdjective]leri kurtarmayı düşünebiliriz."
 AUS_political_events.107.t:0 "[FROM.GetNameDefCap] [GER.GetAdjective] Baskısına Boyun Eğiyor"
 AUS_political_events.108.a:0 "Dikkatli bir gözle izleyeceğiz!"
 AUS_political_events.108.desc:0 "[FROM.GetAdjective] Ordusunun sınırımızda oldukça büyük bir askeri tatbikata başladığı dikkatimizi çekti. Sözlü olarak herhangi bir tehdit dile getirilmemiş olsa da, bunun yaklaşan bir şeyin bir tür uyarısı olduğu hissinden kurtulamıyoruz. Onlara karşı eylemlerimizde dikkatli olmalıyız, yoksa daha fazla saldırabilirler."
 AUS_political_events.108.t:0 "[FROM.GetNameDefCap] Sınırımızda Bir Askeri Tatbikat Düzenliyor"
 AUS_political_events.109.a:0 "Endişe verici..."
 AUS_political_events.109.desc:0 "Son zamanlarda sınır devriyelerimiz, sınırın [FROM.GetAdjective] tarafında çok daha yüksek sayıda sınır devriyesi ve hatta muhafız olduğunu bildiriyor. Daha da endişe verici olanı, bu muhafızların artık hafif silahlı olmaması, bunun yerine ordudan beklenecek türden tüfekler taşımasıdır. Önceki açıklamaları bir ölçüt olarak alınırsa, bu endişe nedeni olabilir."
 AUS_political_events.109.t:0 "[FROM.GetNameDefCap] Sınır Muhafızlarını Silahlandırıyor"
 AUS_political_events.11.a:0 "Bu onları ilgilendirmez!"
 AUS_political_events.11.a_tt:0 "§Y[GER.GetAdjective] Askeri Yüksek Komutanlığa Karşı Düşmanlığı§! görevini tetikler\n\nZehner'in ölümünü önlemedeki başarısızlık, §YAnschluss§! için gereken §YToplam Ordu Savaş Gücü§!'nün §YDüşürülmesine§! neden olacaktır."
 AUS_political_events.11.b:0 "Onların maskaralıklarını durdurmak için bu gerekiyorsa..."
 AUS_political_events.11.desc:0 "[GER.GetNameDef]'den diplomatlar, askeri yüksek komutanlığımızın üyelerinden biriyle ilgili endişelerini dile getirdiler. Egemen bir devlet olduğumuzu ve istediğimizi yapabileceğimizi, ancak bunun [GER.GetNameDef] ile diplomatik ilişkilerimizin zayıflamasına neden olabileceğini iddia ediyorlar. \n\nOnların çıkarına hareket etmezsek, meseleyi kendi ellerine almalarını bekleyebiliriz."
 AUS_political_events.11.t:0 "[GER.GetNameDefCap] Askeri Yüksek Komutanlığımızdan Hoşnutsuzluğunu Dile Getiriyor"
 AUS_political_events.110.a:0 "Endişe verici"
 AUS_political_events.110.desc:0 "Hükümet destekli bir miting sonucunda, [FROM.GetNameDef]'de [ROOT.GetAdjective] karşıtı duygularda keskin bir artış olduğuna dair raporlar aldık. [FROM.GetAdjective] liderliği bu konuları ele almak için bize doğrudan yaklaşmadı ve bu noktada diplomasiyle ilgilenmedikleri varsayılabilir."
 AUS_political_events.110.t:0 "[FROM.GetNameDef]'de [ROOT.GetAdjective] Karşıtı Duygular Yükseliyor"
 AUS_political_events.111.a:0 "Geçmiş geçmiştir, imzalayacağız!"
 AUS_political_events.111.b:0 "[FROM.GetAdjective]leri ve neden olduklarını bilerek, kesinlikle olmaz!"
 AUS_political_events.111.desc:0 "[FROM.GetAdjective] liderliğinden gelen iletişimler az önce elimize ulaştı. Ülkelerimiz arasında karşılıklı bir barış anlaşması imzalamamızı talep ediyorlar. Geçmişte oldukça zorluk yaşadığımızı kabul ediyorlar, ancak şimdi ve gelecekte daha yapıcı bir diyalog istiyorlar."
 AUS_political_events.111.t:0 "[FROM.GetNameDefCap] Saldırmazlık Paktı Teklif Ediyor"
 AUS_political_events.112.a:0 "Mükemmel"
 AUS_political_events.112.desc:0 "[FROM.GetNameDef] için planlarımız bugün bir adım ileri gitti, çünkü şimdi bir saldırmazlık paktı imzaladık. Onları bize daha da yakınlaştırmak için çabalarımızı sürdüreceğiz. Gelecek hala yazılmamış bir kart, ancak planlarımızla ilerlemeye devam etmek istersek."
 AUS_political_events.112.t:0 "[FROM.GetNameDefCap] Saldırmazlık Paktını İmzalıyor"
 AUS_political_events.113.a:0 "Bu talihsizlik"
 AUS_political_events.113.desc:0 "Görünüşe göre [FROM.GetAdjective] liderliğine yaptığımız teklif onlar için yeterince iyi değildi. Ya geleceğe yönelik planlarımızı gördüler ya da kendilerinin bizimle ilgili kötü niyetli planları var. Bu olasılığa hazırlanmalıyız ve planlarımızla devam etmek istersek, daha düşmanca eylemler gerekebilir."
 AUS_political_events.113.t:0 "[FROM.GetNameDefCap] Saldırmazlık Paktını Reddediyor"
 AUS_political_events.114.a:0 "Teşekkürlerimizi iletin."
 AUS_political_events.114.desc:0 "Ülkelerimiz arasındaki son barış anlaşması ışığında [FROM.GetAdjective]ler bize bazı sanayi desteği teklif ettiler. Sanayi sektörümüz genellikle standartlarımızı karşılasa da, yardımları elbette memnuniyetle karşılanır. [FROM.GetNameDefCap]'in bunu kesinlikle bir nedenle yaptığını iddia eden birkaç ihtiyatlı ses yükseldi."
 AUS_political_events.114.t:0 "[FROM.GetNameDefCap] Endüstriyel Destek Sunuyor"
 AUS_political_events.115.a:0 "Neden olmasın?"
 AUS_political_events.115.b:0 "Bu işte bir bit yeniği var gibi..."
 AUS_political_events.115.desc:0 "[FROM.GetAdjective] Ordusundan yetkililer, ordularımız için ortak bir askeri tatbikat düzenleme umuduyla bize ulaştılar. Bunun her iki ülkemiz için de en faydalı olacağını ve onlardan çok şey öğrenebileceğimizi, tıpkı onların da bizden öğrenebileceği gibi temin ediyorlar."
 AUS_political_events.115.t:0 "Önerilen [FROM.GetAdjective]-[ROOT.GetAdjective] Askeri Tatbikatı"
 AUS_political_events.116.a:0 "Mükemmel!"
 AUS_political_events.116.desc:0 "Bugün [ROOT.GetAdjective]-[FROM.GetAdjective] askeri tatbikatının sona erdiği gündür. Birliklerimiz bu tatbikattan büyük ölçüde faydalandı ve umudumuz [FROM.GetAdjective]'in de faydalanmış olmasıdır. [FROM.GetAdjective] Ordusunun operasyonlarına daha yakından bakmak, geleceklerine ilişkin planlarımız hayata geçtiğinde neyle çalışmamız gerektiğine dair iyi bir genel bakış da sağlıyor."
 AUS_political_events.116.t:0 "[ROOT.GetAdjective]-[FROM.GetAdjective] Askeri Tatbikatı Sonuçlandı"
 AUS_political_events.117.a:0 "Önemi yok..."
 AUS_political_events.117.desc:0 "\nHem bizim hem de [FROM.GetNameDef] için en bariz faydalara rağmen, ortak bir askeri tatbikat teklifimizi reddettiler. Ordularımız birbirinden çok şey öğrenebilirdi. Bu aynı zamanda [FROM.GetNameDef]'i geleceğe yönelik planlarımız için istediğimiz yöne etkilememiz için de bol bir fırsat olabilirdi."
 AUS_political_events.117.t:0 "Ortak [ROOT.GetAdjective]-[FROM.GetAdjective] Askeri Tatbikatı için [FROM.GetAdjective] Reddi"
 AUS_political_events.118.a:0 "Bize katılmak zorunda kalacaklar"
 AUS_political_events.118.b:0 "Mevcut düzenlemelerimizi bunu çözmesi için bırakacağız"
 AUS_political_events.118.c:0 "Bunun için uygun bir organizasyon kuracağız!"
 AUS_political_events.118.c.tt:0 "§Y[FROM.FROM.GetNameDefCap]§!, §Y[ROOT.GetAdjective]§! ittifakına katılmaya zorlanacak"
 AUS_political_events.118.desc:0 "İmparatorluğumuzu yeniden inşa etme yoluna girdiğimizde, imparatorluğu nasıl organize etmek istediğimiz meselesi yeniden karşımıza çıkıyor. Seleflerimiz bu soruda başarısız oldular ve bu da büyük ama düzensiz bir imparatorluğa yol açtı. Bağlı devletlerimizin bize sadık kalmasını sağlamak ve aynı zamanda kendi aralarında çekişmekten kaçınmalarını sağlamak için bir ittifak kurma önerisi bize sunuldu."
 AUS_political_events.118.t:0 "Bir İmparatorluğun Organizasyonu"
 AUS_political_events.119.a:0 "Boyun eğmek zorundayız"
 AUS_political_events.119.b:0 "Buna izin veremeyiz!"
 AUS_political_events.119.desc:0 "Balkanlar'da zaten oldukça büyük hak iddialarında bulunmuş olmalarına rağmen, [FROM.GetAdjective]ler görünüşe göre hala daha fazlasını istiyor. Bu sefer öne sürdükleri talepler, kabul edersek çıkar alanımıza tecavüz edecek, aynı zamanda reddetmenin sonuçları da çok vahim olabilir."
 AUS_political_events.119.t:0 "[FROM.GetNameDefCap] Daha Fazla Taviz Talep Ediyor"
 AUS_political_events.12.a:0 "Bu beklenmedik ama çok makbule geçti."
 AUS_political_events.12.desc:0 "[FROM.GetNameDefCap] bize piyade teçhizatı şeklinde destek teklifinde bulundu. Bizi en değerli müttefik olarak görüyorlar ve bu tüfeklerin, bu savaştaki zaferimizi garantilemek amacıyla [ETH.GetNameDef]'deki savaş çabalarımız için kullanılmasını diliyorlar."
 AUS_political_events.12.t:0 "[FROM.GetNameDefCap] Bize Piyade Teçhizatı Teklif Ediyor"
 AUS_political_events.120.a:0 "Şanlı."
 AUS_political_events.120.desc:0 "[FROM.GetAdjective] liderliğine yönelttiğimiz toprak taleplerimiz onaylandı. Bunu beklemiş olsak da, haklı toprağımızı güvence altına almak için daha sert önlemler almak zorunda kalmamak yine de çok hoş."
 AUS_political_events.120.t:0 "[FROM.GetNameDefCap] Taleplerimize Boyun Eğiyor"
 AUS_political_events.121.a:0 "O toprağı alacağız!"
 AUS_political_events.121.desc:0 "Şu anda [FROM.GetAdjective] mülkiyetinde olan topraklara yönelik çok haklı iddialarımıza rağmen, [FROM.GetLeader] talep edilen toprakları devretmemeye karar verdi. Bu kesinlikle bir aksilik, ama ne olursa olsun o toprakları geri alacağız."
 AUS_political_events.121.t:0 "[FROM.GetNameDefCap] Taleplerimizi Reddediyor"
 AUS_political_events.122.a:0 "Harika, onu donanmaya alın!"
 AUS_political_events.122.b:0 "Onu ne kadar sevsek de... hayır"
 AUS_political_events.122.desc:0 "Georg von Trapp bir zamanlar büyük Avusturya-Macaristan Donanması'nda saygın bir Amiraldi. Kudretli imparatorluğumuzun çöküşü ve kıyı şeridimizi kaybetmemizin ardından, o da diğerleri gibi başka girişimlere yöneldi. Servetinin çoğunu kaybettiği bir finans döneminin ardından müziğe yöneldi.\n\n Şimdi bir kıyı şeridinin kontrolünü ele geçirdiğimize göre, von Trapp büyük ulusumuz adına bir kez daha denizlere açılmak için hizmetlerini sunuyor."
 AUS_political_events.122.t:0 "[ROOT.GetAdjective] Denizaltılarının Sesi mi?"
 AUS_political_events.123.a:0 "Birlikte duracağız!"
 AUS_political_events.123.b:0 "Bir kere yetti"
 AUS_political_events.123.desc:0 "Avusturya'nın İttifak Devletleri'ni yeniden kurduğu haberi bu sabah bize ulaştı. Askeri ittifak Büyük Savaş boyunca bir arada durdu, ancak önde gelen üyelerinin çoğunun düşmesiyle dağıldı. [FROM.GetAdjective]ler bu ittifakı bir kez daha canlandırmaya karar verdiler ve önceki yinelemesinin bir parçası olduğumuz için bize bir davetiye göndermeyi uygun gördüler."
 AUS_political_events.123.t:0 "[FROM.GetAdjective]ler İttifak Devletleri'ni Yeniden Kuruyor"
 AUS_political_events.124.a:0 "İmparatorluklarımız yeniden yükselecek!"
 AUS_political_events.124.desc:0 "Kendi müttefikimizden beklediğimiz gibi, şanlı ittifakımızı tekrar bir araya getirme davetimizi almaktan başka bir şey yapmadılar. Büyük Savaş'ın sonunda bize çok haksız davranan bir dünyaya karşı mücadelemize katılmayı kabul ettiler."
 AUS_political_events.124.t:0 "[FROM.GetNameDefCap] [ROOT.GetFactionName]'e Katılıyor"
 AUS_political_events.125.a:0 "Eğer bizimle değillerse..."
 AUS_political_events.125.desc:0 "[FROM.GetAdjective]lerin bizimle bir kez daha güçlerini birleştirmenin bariz faydasını göreceklerini ummuştuk, ancak görünüşe göre o zamanlar yaşadığımız aksilik onların vizyonunu bulandırmış. Liderimiz [ROOT.GetLeader] buna zarafet ve kararlılıkla yanıt verdi, bu sadece küçük bir aksilik."
 AUS_political_events.125.t:0 "[FROM.GetNameDefCap] Davetimizi Reddediyor"
 AUS_political_events.13.a:0 "[AUS.GetAdjective]lerin bunu talep etmeye hakkı yok."
 AUS_political_events.13.b:0 "Peki."
 AUS_political_events.13.desc:0 "Diğer birçokları gibi [ITA.GetNameDef]'e karşı uyguladığımız ambargoya karşı protestolar aldık. Ambargonun mantıksız ve temelsiz olduğunu iddia eden [AUS.GetAdjective] liderliği, ambargoyu kaldırmamızı talep etti.\n\nAmbargoyu protesto etme nedenleri hakkında ısrar edildiğinde, [FROM.GetNameDef] liderliği daha fazla ayrıntı vermeyi reddediyor."
 AUS_political_events.13.t:0 "[FROM.GetNameDefCap] [ITA.GetNameDef] Ambargosuna İtiraz Ediyor"
 AUS_political_events.14.a:0 "[FROM.GetAdjective]lerden cesur bir hamle"
 AUS_political_events.14.desc:0 "[FROM.GetNameDefCap] son zamanlarda bize uygulanan ambargoyu protesto etti. En değerli müttefik olduğumuzu söyleyerek, durumu bizim için biraz olsun hafifletmek amacıyla bize ambargo uygulayan tüm ülkelere aktif olarak itirazlarını gönderdiler."
 AUS_political_events.14.t:0 "[FROM.GetNameDefCap] Bize Yönelik Ambargoya Karşı Çıkıyor"
 AUS_political_events.15.a:0 "Bizi o kadar kolay kaybetmeyecekler!"
 AUS_political_events.15.b:0 "Ne kadar kaba!"
 AUS_political_events.15.c:0 "Şimdi bunun için zamanımız yok!"
 AUS_political_events.15.desc:0 "[FROM.GetAdjective] hükümetinin [FROM.GetNameDef]'de DNSAP'ı yasakladığı haberi az önce elimize ulaştı. 1934'ten beri zaten yumuşak bir yasak yürürlükteydi, ancak söz konusu yasak hem siyasi partiler hem de hükümet tarafından büyük ölçüde göz ardı ediliyordu. Bu, [FROM.GetAdjective] liderliğinin bize karşı tutumunda bir değişiklik olduğunu gösteriyor. \n\nBunun bariz bir hakaret olmasının ötesinde, bu durum [FROM.GetNameDef] üzerindeki nüfuzumuzu da engelleyebilir."
 AUS_political_events.15.t:0 "[FROM.GetNameDefCap] DNSAP'ı Yasaklıyor"
 AUS_political_events.16.a:0 "Onu yakından izlemeliyiz."
 AUS_political_events.16.a_tt:0 "§YArthur Seyss-Inquart§!'ı §Rkovulamayacak§! bir Danışman olarak atar\n"
 AUS_political_events.16.b:0 "Kesinlikle olmaz!"
 AUS_political_events.16.desc:0 "Beklendiği gibi [FROM.GetNameDef], DNSAP'ı yasaklamamıza kötü tepki verdi. Yasağı derhal kaldırmamız yönündeki bariz taleplerinin ötesinde, Arthur Seyss-Inquart'ı danışman olarak atamamızı da talep ediyorlar. Bu konuda çok kararlılar ve onun [FROM.GetAdjective] tarzına çok düşkün olduğunu her zaman bilmemize rağmen bu durum şu soruyu gündeme getiriyor: Neden?"
 AUS_political_events.16.t:0 "Hükümetteki Naziler"
 AUS_political_events.17.a:0 "Bizim siyasetimize karışmaya hakları yok."
 AUS_political_events.17.desc:0 "Beklendiği gibi [FROM.GetNameDef], DNSAP'ı yasaklamamıza kötü tepki verdi. Bunu kendi ideolojilerine bir saldırı olarak görüyorlar ve kararımızdan büyük hayal kırıklığı ve öfke duyduklarını dile getirdiler. DNSAP'ı yasaklamak için büyük nedenlerimiz olmasına rağmen, [FROM.GetAdjective] liderliği şimdi yasağı derhal kaldırmamızı talep ediyor."
 AUS_political_events.17.t:0 "[FROM.GetNameDefCap] DNSAP Yasağımızı Protesto Ediyor"
 AUS_political_events.18.a:0 "Güzel"
 AUS_political_events.18.desc:0 "Görünüşe göre [FROM.GetAdjective] sonunda aklını başına topladı. [FROM.GetNameDef]'deki kardeş partimize yönelik yasak hala devam ediyor, ancak en azından Arthur Seyss-Inquart'ı danışman olarak atadılar, bu da bize siyasi manevraları hakkında bir miktar bilgi edinme olanağı sağlıyor."
 AUS_political_events.18.t:0 "[FROM.GetNameDefCap] Arthur Seyss-Inquart'ı Danışman Olarak Atıyor"
 AUS_political_events.19.a:0 "Alabileceğimiz tüm yardıma ihtiyacımız var!"
 AUS_political_events.19.b:0 "1934 darbesindeki rolüyle bunu riske atamayız"
 AUS_political_events.19.desc:0 "Büyük Savaş'taki en başarılı avcı asımız, savaşta olduğumuz şu dönemde bize bir kez daha hizmetlerini sunmak için yaklaştı. Artık genç olmasa da ve 1936'daki o büyük tehlikeden sonra eskisi gibi uçamasa da, hava kuvvetlerimizi yerden zafere taşımayı teklif etti. Mevcut pilotlarımız ona hala büyük saygı duyuyor ve onun havacılarımızı kendisininkiyle rekabet edebilecek bir mükemmelliğe ulaştırabileceğine dair yaygın bir kanı var."
 AUS_political_events.19.t:0 "Godwin von Brumowski Hizmetlerini Sunuyor"
 AUS_political_events.2.a:0 "Ne kadar korkunç!"
 AUS_political_events.2.b:0 "Ödemeleri biz karşılayacağız!"
 AUS_political_events.2.b_tt:0 "Sigortayı karşılamak, ileride Phönix sigortasını yeniden canlandırmamıza olanak tanıyacak."
 AUS_political_events.2.desc:0 "Sevgili genel müdürleri Wilhelm Berliner'in ölümünden kısa bir süre sonra Phönix Sigorta daha büyük sorunlarla karşılaştı. Yeni atanan müdür Eberhard Reininghaus tarafından hükümetin dikkatine sunulan sahte bilançolar, 1929'a kadar uzanan ve 250 milyon şilini aşan bir açığı ortaya çıkardı. \n \n Şirket iflasını açıkladı ve derhal faaliyetlerini durdurdu. Oldukça popüler olan Savaş Katılımcıları Sigortası'nın aniden sona ermesi, sigorta ödemelerine bel bağlayan birçok kişinin tepkisine neden oldu."
 AUS_political_events.2.t:0 "Phönix Sigorta Skandalı"
 AUS_political_events.20.a:0 "Bağımsızlıkları bizim için son derece önemlidir!"
 AUS_political_events.20.b:0 "Onları diplomatik olarak destekleyeceğiz"
 AUS_political_events.20.c:0 "Belki karşılıklı yarar sağlayan bir anlaşmaya varabiliriz"
 AUS_political_events.20.d:0 "Onlar için hiçbir şeyi riske atmayacağız"
 AUS_political_events.20.desc:0 "[GetGuarantorFlavorText]"
 AUS_political_events.20.t:0 "[FROM.GetNameDefCap] Desteğimizi İstiyor"
 AUS_political_events.21.a:0 "Mükemmel!"
 AUS_political_events.21.desc:0 "Saint-Germain-En-Laye Antlaşması'nda yazılanlara uygun olarak [FROM.GetNameDef], bağımsızlığımızı garanti etmeyi kabul etti. İşlerini sağlama almak için, şu anda kendimiz teçhizat üretebilecek durumda olmadığımızdan, bize biraz teçhizat tedarik etme imkanı da tanıyorlar."
 AUS_political_events.21.t:0 "[FROM.GetNameDefCap] Bağımsızlığımızı Garanti Ediyor"
 AUS_political_events.22.a:0 "İstediğimiz bu değildi, ama hiç yoktan iyidir."
 AUS_political_events.22.b:0 "Diplomasi ve teçhizat bizi kurtarmaz!"
 AUS_political_events.22.desc:0 "[FROM.GetNameDef], daha az bilinen bazı maddeleri ve ince yazıları kullanarak bize bir garanti sunmamaya, bunun yerine bir işgal durumunda sadece diplomatik destek sunmaya karar verdi. Sözlerinin [GER.GetLeader]'i bir müdahale tehdidi kadar iyi ikna edebileceğinden emin olduklarını ve bu nedenle bizim için hazır asker bulundurmaya gerek görmediklerini iddia ediyorlar."
 AUS_political_events.22.t:0 "[FROM.GetNameDefCap] Bağımsızlığımızı Diplomatik Olarak Destekliyor"
 AUS_political_events.23.a:0 "Acil güvenliğimiz o hak iddialarından daha önemli"
 AUS_political_events.23.b:0 "İçinde bulunduğumuz zor durumdan kar elde etmeye çalışıyorlar, kesinlikle olmaz."
 AUS_political_events.23.desc:0 "[FROM.GetNameDefCap], yardım talebimize kendi talepleriyle yanıt verdi. Bu Antlaşma bize dayatıldığından beri, Alto Adige ve Trentino'yu kendimiz için geri almaya çalıştık, çünkü onlar haklı olarak bize aittir. [FROM.GetNameDef] bu toprakları kendilerinin olarak görüyor ve eğer bağımsızlığımızı garanti edeceklerse, bu hak iddialarından kesin olarak vazgeçmemizi istiyorlar."
 AUS_political_events.23.t:0 "[FROM.GetNameDefCap] Şartlı Olarak Garanti Teklif Ediyor"
 AUS_political_events.24.a:0 "Diğer taraflara tam olarak bu kusuru belirtmiştik..."
 AUS_political_events.24.b:0 "Onlara bir teşvik vereceğiz!"
 AUS_political_events.24.desc:0 "Saint-Germain-En-Laye Antlaşması'ndaki bir dizi istisnai durum, ince yazı ve belirsiz maddeden yararlanan [FROM.GetNameDef], bir şekilde bizi desteklemekten kaçınmayı başardı. Belgelerde, düzgün bir orduya sahip olmamamıza karşılık dış yardım alacağımız açıkça belirtiliyor, ancak görünen o ki [FROM.GetNameDef] bunun kendileri için geçerli olmadığına karar verdi. Kendi başımızın çaresine bakmak zorunda kalacağız."
 AUS_political_events.24.t:0 "[FROM.GetNameDefCap] Destek Talebimizi Reddediyor"
 AUS_political_events.25.a:0 "Harika Haber!"
 AUS_political_events.25.desc:0 "[FROM.GetNameDefCap], toprakları üzerindeki hak iddialarından vazgeçme talebimize bu taleplere boyun eğerek yanıt verdi. Desteğimiz karşılığında bu toprakları alma fikrini tamamen ortadan kaldırdılar."
 AUS_political_events.25.t:0 "[FROM.GetNameDefCap] Topraklarımız Üzerindeki Hak İddialarından Vazgeçiyor"
 AUS_political_events.26.a:0 "O zaman onlara kesinlikle yardım yok."
 AUS_political_events.26.desc:0 "[FROM.GetAdjective]lerin kısa süre önce yardım için bize başvurduktan sonra makul bir ulus olduğunu düşünmüştük. Görünüşe göre onlar hakkında yanılmışız. Haklı olarak bizim olan topraklar üzerindeki hak iddialarından vazgeçmeleri istendiğinde, açıkça reddettiler."
 AUS_political_events.26.t:0 "[FROM.GetNameDefCap] Hak İddialarından Vazgeçmeyi Reddediyor"
 AUS_political_events.27.a:0 "Herhangi bir zarara neden olmazlar."
 AUS_political_events.27.b:0 "Kesinlikle olmaz."
 AUS_political_events.27.desc:0 "[AUS.GetNameDefCap], yeniden silahlanma ve Saint-Germain-En-Laye Antlaşması'nı feshetme onayı almak için bize ulaştı. Komşu sahalarının son zamanlarda çok daha düşmanca hale geldiğini belirterek, artık kendi orduları olmadan kendilerini güvende hissetmediklerini ifade ediyorlar. Soru, antlaşmayı imzalayan üç büyük güç olan [ITA.GetNameDef], [ENG.GetNameDef] ve [FRA.GetNameDef]'in yanı sıra [USA.GetNameDef]'e de gitti ve antlaşmaya göre, dilersek herhangi birimiz veto edebilir."
 AUS_political_events.27.t:0 "[AUS.GetNameDefCap] Yeniden Silahlanmak İstiyor"
 AUS_political_events.28.a:0 "Mükemmel!"
 AUS_political_events.28.desc:0 "Sonunda garantörlerden yanıtları aldık ve beklemeye değdi. Aralarındaki birçok tartışma ve görüşmeden sonra, yeniden silahlanmamıza izin vermeyi kabul ettiler ve Saint-Germain-En-Laye Antlaşması'nı geçersiz ilan ettiler. Artık atalarımızın eylemleriyle bağlı değiliz."
 AUS_political_events.28.t:0 "Garantörler Yeniden Silahlanmayı Kabul Ediyor"
 AUS_political_events.29.a:0 "O zaman başka seçeneğimiz yok..."
 AUS_political_events.29.a_tt:0 "§RBu seçeneği seçerek Saint-Germain-En-Laye Antlaşması'ndan kalıcı olarak kurtulacaksınız ancak sonuçları olabilir§!"
 AUS_political_events.29.b:0 "Bunu müzakere etmeliyiz!"
 AUS_political_events.29.c:0 "Bizi başarısızlığa hazırladılar ama ne yapabiliriz ki?"
 AUS_political_events.29.c_tt:0 "§RBu seçeneği seçerek Saint-Germain-En-Laye Antlaşması'nı 16 Temmuz 1940'a kadar aktif tutacaksınız§!"
 AUS_political_events.29.desc:0 "Uzun tartışmalar ve birçok münazaradan sonra, garantörler yeniden silahlanma talebimizi onaylamamaya karar verdi. Onlarla mantık çerçevesinde konuşmaya çalıştık ama egemenliğimize ve bağımsızlığımıza yönelik bariz riske rağmen cevapları kesin."
 AUS_political_events.29.t:0 "Garantörler Yeniden Silahlanma Başvurusunu Reddediyor"
 AUS_political_events.3.a:0 "En kötüsüne hazırlıklı olmalıyız..."
 AUS_political_events.3.a_tt:0 "§YAnschluss Karşıtı Tedbirler§! kararlarının kilidini açar"
 AUS_political_events.3.desc:0 "Renanya'nın yakın zamanda yeniden silahlandırılması halkımız arasında büyük endişe yarattı. Hükümetimiz içinde 'Sıradaki biz olabilir miyiz?' sorusu soruluyor. Führer, Avusturya'yı ilhak etmenin çıkarları arasında olmadığını sürekli olarak temin etse de, böyle bir eylemin artık tamamen söz konusu olmayabileceğini göz önünde bulundurmalıyız."
 AUS_political_events.3.t:0 "Almanya'nın Yeniden Silahlanması Yaygın Endişeye Neden Oluyor"
 AUS_political_events.30.a:0 "Onları durduramayız ama yavaşlatabiliriz"
 AUS_political_events.30.b:0 "Peki, bırakalım o zaman."
 AUS_political_events.30.c:0 "Onlara artık garanti yok!"
 AUS_political_events.30.desc:0 "[GetTreatyStatus]"
 AUS_political_events.30.t:0 "[AUS.GetNameDefCap] Saint-Germain-En-Laye Antlaşmasını İhlal Ediyor"
 AUS_political_events.31.a:0 "Endüstriyel olarak yardım edeceğiz."
 AUS_political_events.31.b:0 "Ele geçirdiğimiz teçhizatın bir kısmını alabilirler"
 AUS_political_events.31.c:0 "Destekleri önemsizdi"
 AUS_political_events.31.desc:0 "İç savaşın ardından ortalık yatışırken, [FROM.GetAdjective] tarafından iç savaştaki çabaları için tazminat meselesiyle ilgili olarak bizimle temasa geçildi. Yaptıkları iş, kaybettikleri adamlar ve gönüllüleri tarafından kullanılan ve kırılan silahlar için bir tür tazminat istiyorlar."
 AUS_political_events.31.t:0 "[FROM.GetNameDefCap] Yardımları Karşılığında Tazminat İstiyor"
 AUS_political_events.32.a:0 "Harika!"
 AUS_political_events.32.desc:0 "Tazminat talebimiz [FROM.GetAdjective] milliyetçileri tarafından duyuldu ve bize teşekkür etmenin bir yolu olarak, Niederösterreich'te yeni bir fabrika inşa etmek için bize işçi ve malzeme ödünç verdiler. Bu, kayıp teçhizatı değiştirmemizi sağlayacak ve gelecekte de çok yardımcı olacaktır."
 AUS_political_events.32.t:0 "[FROM.GetNameDefCap] Yeni Bir Fabrika İnşa Etmeye Yardım Teklif Ediyor"
 AUS_political_events.33.a:0 "Harika!"
 AUS_political_events.33.desc:0 "Tazminat talebimiz [SPA.GetAdjective] tarafından duyuldu ve bize teşekkür etmenin bir yolu olarak, onlara yardım ederek kaybettiğimiz teçhizatın bir kısmını karşılamak için iç savaş sırasında rakiplerinden ele geçirdikleri teçhizatın bir kısmını bize gönderdiler."
 AUS_political_events.33.t:0 "[FROM.GetNameDefCap] Ele Geçirilen Teçhizatı Teklif Ediyor"
 AUS_political_events.34.a:0 "Ne kadar kaba..."
 AUS_political_events.34.desc:0 "İç savaşlarında [SPA.GetAdjective]'e yardım ettikten sonra beklediğimiz en az şey bir tür geri ödeme ve minnettarlıktı ama görünüşe göre çok fazla umut etmişiz. Yardımımızın önemli bir şey olmadığını belirten [SPA.GetNameDef] liderliği, sunduğumuz destek için herhangi bir tazminat almamız gerektiği fikrini reddediyor."
 AUS_political_events.34.t:0 "[FROM.GetNameDefCap] Bize Geri Ödeme Yapmayı Reddediyor"
 AUS_political_events.35.a:0 "[GetMilitiaName]'e şans tanındı."
 AUS_political_events.35.b:0 "Halkın sadece alışması gerekiyor."
 AUS_political_events.35.c:0 "Bu yeni [ROOT.GetName] olacak!"
 AUS_political_events.35.desc:0 "[GetMilitiaName] ile son işbirliğimizin bazı rahatsız edici yan etkileri oldu. Örgüt ülke liderliği tarafından meşrulaştırıldığı için [GetMilitiaName], sivil halka karşı eylemlerinde daha cüretkar hale geldi.\n\nHalkımız artık örgütün çalışma şeklinden tam olarak rahat olmadığı için ulus içindeki huzursuzluk arttı. Liderliğimize [GetMilitiaName]'in gerçekten kontrolümüzde olup olmadığı ve bu kararın ulusu güvende tutmaya gerçekten yardımcı olup olmayacağı konusunda sorular soruluyor."
 AUS_political_events.35.t:0 "Paramiliter Faaliyetler İç Karışıklığa Neden Oluyor"
 AUS_political_events.36.a:0 "Zamanı gelince [GetGrossosterreichCosmeticIdeology] olarak bilineceğiz"
 AUS_political_events.36.a_tt:0 "Zamanla §YAlman Çekirdeklerini Entegre Etmek§! için §Ykararların kilidini açar§!."
 AUS_political_events.36.b:0 "Süddeutschland olarak bilineceğiz"
 AUS_political_events.36.c:0 "Olduğumuz gibi mükemmeliz"
 AUS_political_events.36.desc:0 "Ciddi şekilde sakatlanmış küçük bir güç olmaktan geri dönüş yolculuğumuz uzun ve zorlu bir yolculuktu. Başladığımız yere geri dönüp bakmak, bu yolculuğun buna değdiğini çok açık bir şekilde gösteriyor. Yeniden doğmuş ve eskisinden bile daha güçlü olarak, şimdi geleceğimizin ne getireceğine ve nasıl tanınmak istediğimize karar verme zamanı."
 AUS_political_events.36.t:0 "[ROOT.GetNameDef]'in Geleceği"
 AUS_political_events.37.a:0 "Onlara boyun eğmeyeceğiz!"
 AUS_political_events.37.b:0 "Onlara karşı hiç şansımız yok"
 AUS_political_events.37.desc:0 "[GetIntegrationEventTarget]"
 AUS_political_events.37.t:0 "[FROM.GetNameDef]'den Ültimatom"
 AUS_political_events.37_tt:0 "Hak iddia ettikleri eyaletleri onlara teslim edeceğiz."
 AUS_political_events.38.a:0 "Ne istediklerini düşünürlerse düşünsünler bize katılacaklar."
 AUS_political_events.38.desc:0 "[FROM.GetAdjective]'e [Get38PuppetOrNotDesc] ve toplumumuza entegre olma şansı vermek istedik ama görünüşe göre en cömert teklifimiz kabul edilmedi. Sonuçta [FROM.GetNameDef]'in bizim liderliğimiz altında çok daha iyi olacağını gayet iyi biliyoruz."
 AUS_political_events.38.t:0 "[FROM.GetNameDefCap] Taleplerimizi Reddediyor"
 AUS_political_events.38_tt:0 "§Y[FROM.FROM.OWNER.GetNameWithFlag]§!'a karşı bir §YHak İddia Edilen Eyaleti Al§! Savaş Hedefi oluşturur!"
 AUS_political_events.39.a:0 "[ROOT.GetNameDef]'e hoş geldiniz!"
 AUS_political_events.39.desc:0 "[FROM.GetAdjective] liderliğinden gelen yanıt son derece memnuniyet verici. Haklı olarak bizim olanı entegre ederken silahlarını bırakacaklar ve karşı koymayacaklar. Açıkçası, uluslarını böyle bir mesele yüzünden anlamsız bir savaşa sürüklememenin değerini görmüşler."
 AUS_political_events.39.t:0 "[FROM.GetNameDefCap] Boyun Eğiyor"
 AUS_political_events.4.a:0 "Hainden kurtulun!"
 AUS_political_events.4.b:0 "Herr Innitzer'in kendi fikrine sahip olmasına izin verilir."
 AUS_political_events.4.desc:0 "Daha önce dışa dönük bir faşist olan kardinal Theodor Innitzer, son zamanlarda söylemini kökten değiştirdi. Nazizmi ve [GER.GetAdjective] Führer'i sesli ve aleni bir şekilde desteklemekten vazgeçerek, 7 Ekim'deki bir ayinde Führer'e karşı açıkça tavır aldı. Kitlelerin [GER.GetLeader]'e nasıl inanmaları gerektiği konusundaki her zamanki vaazı yerine, onları şimdi Rab'be geri yönlendirdi. \n \n [GER.GetAdjective] liderliği öfkeli ve harekete geçmemizi istiyor."
 AUS_political_events.4.t:0 "Fikir Değişikliği"
 AUS_political_events.40.a:0 "Bize katılmalarından memnuniyet duyarız"
 AUS_political_events.40.b:0 "Onlara ihtiyacımız yok."
 AUS_political_events.40.desc:0 "[FROM.GetNameDefCap] bize ulaşarak ittifakımıza katılmak istediğini belirtti. Bir askerileştirme çabası başlattılar ve ikimizi de daha güçlü kılmak için birlikte çalışma arzusunu dile getirdiler. Tarihsel olarak ulus, savaş alanında hesaba katılması gereken büyük bir güç olmuştur, ancak şimdi zayıflamış olsalar da, bizim için en yararlı müttefikler olacaklarını iddia etmeye devam ediyorlar."
 AUS_political_events.40.t:0 "[FROM.GetNameDefCap] [ROOT.GetFactionName] İttifakına Katılmak İstiyor"
 AUS_political_events.41.a:0 "Birlikte daha güçlüyüz!"
 AUS_political_events.41.desc:0 "[FROM.GetNameDefCap] onlara katılma talebimizi coşkuyla karşıladı ve bizi ittifaka kabul etti. Artık bizi tehdit edenlere karşı yalnız savaşmayacağız!"
 AUS_political_events.41.t:0 "[FROM.GetNameDefCap] [FROM.GetFactionName] İttifakına Katılmamızı Kabul Ediyor"
 AUS_political_events.42.a:0 "Onlara göstereceğiz"
 AUS_political_events.42.desc:0 "[FROM.GetFactionName] ittifakına katılma başvurumuz soğuk bir şekilde reddedildi. Yararlılığımızı kanıtlamaya çalıştık ama ne yazık ki [FROM.GetNameDef] kararını vermiş. Bu çok can sıkıcı olsa da, bu durumdan yılmayacak, bunun yerine başka çözümler bulacağız."
 AUS_political_events.42.t:0 "[FROM.GetNameDefCap] [FROM.GetFactionName] İttifakına Katılmamızı Reddediyor"
 AUS_political_events.43.a:0 "Karşı koyacak durumda değiliz"
 AUS_political_events.43.a.tt:0 "§Y[Get43PuppetOrNotTt]§!, bir [FROM.GetAdjective] İttifakına katılmaya zorlanabilir"
 AUS_political_events.43.b:0 "Ancak cesetlerimizin üzerinden"
 AUS_political_events.43.c:0 "Hiçbir zaman onların bağlı devleti olmadık, ama eskiden olan eyaletleri geri alabilirler."
 AUS_political_events.43.desc:0 "[FROM.GetNameDef]'den gelen sert ifadeli talep bu sabah bize ulaştı ve derhal [Get43PuppetOrNotDesc] talep ediyor. Talep, üstü kapalı saldırganlık tehditleriyle dolu ve bu önerilerini reddedersek düşmanlıkların ortaya çıkması muhtemel görünüyor."
 AUS_political_events.43.t:0 "[FROM.GetNameDefCap] [Get43PuppetOrNotTitle] Talep Ediyor"
 AUS_political_events.44.a:0 "Harika!"
 AUS_political_events.44.desc:0 "[FROM.GetNameDef]'e yönelik taleplerimize verilen yanıt son derece memnuniyet verici oldu. [Get44PuppetOrNotDesc]'i yönetimimize teslim edecekler ve derhal bizim bağlı devletimiz olacaklar. Bu, imparatorluğumuzu yeniden kurma çabalarımızda bizim için büyük bir başarıdır!"
 AUS_political_events.44.t:0 "[FROM.GetNameDefCap] Taleplerimize Boyun Eğiyor"
 AUS_political_events.45.a:0 "O zaman bunun için savaşırız!"
 AUS_political_events.45.desc:0 "Kendi güvenliklerine yönelik bariz bir saygısızlık ve umursamazlık gösterisiyle [FROM.GetNameDef], teklifimizi reddetmeye karar verdi. Anlaşma bizim için karşılıklı olarak faydalı olacaktı ama onlar bu konudaki duygularımızı paylaşmıyor gibi görünüyor."
 AUS_political_events.45.t:0 "[FROM.GetNameDefCap] Taleplerimizi Reddediyor"
 AUS_political_events.46.a:0 "Daha da iyi!"
 AUS_political_events.46.b:0 "Hayır. Onları kontrolümüz altında istiyoruz!"
 AUS_political_events.46.desc:0 "Boyun eğmekten ve bağımsızlıklarının kısıtlanmasından kaçınmak amacıyla [FROM.GetAdjective] liderliği sert önlemlere başvurdu. Bizim bağlı devletimiz olmak yerine, eskiden bizim kontrolümüzdeki eyaletlerini bize devrediyorlar. Bu, taleplerimizin beklenen sonucu değildi ve şimdi kabul edip etmeme konusunda bir tavır almamız gerekiyor."
 AUS_political_events.46.t:0 "[FROM.GetNameDefCap] Boyun Eğmekten Kaçınmak İçin Eyaletleri Devrediyor"
 AUS_political_events.47.a:0 "Bu konuda zorbalığa uğramayacağız!"
 AUS_political_events.47.b:0 "Denemeye değerdi."
 AUS_political_events.47.desc:0 "[FROM.GetAdjective]leri yatıştırmak için gösterdiğimiz tüm çabalara rağmen, bunun tek kabul edilebilir sonucunun taleplerine boyun eğmemiz ve ülkemizde bir kukla rejim kurmalarına izin vermemiz olduğu konusunda kararlı görünüyorlar. Uzlaşmaya yer olmadığını, ya onlarla birlikte ya da onlara karşı olduğumuzu vurguluyorlar."
 AUS_political_events.47.t:0 "[FROM.GetNameDefCap] Teklifi Reddediyor"
 AUS_political_events.48.a:0 "Habsburgların yaptığı gibi..."
 AUS_political_events.48.desc:0 "[FROM.GetNameDef]'in tarihiyle, hakim devletimiz olarak er ya da geç iç siyasetimize karışacakları kaçınılmazdı. Ülkemiz için bir lider olarak [ROOT.GetLeader]'i atadıkları bize bildirildi."
 AUS_political_events.48.t:0 "[FROM.GetNameDefCap] Tahtımıza Bir Habsburg Hükümdarı Atıyor"
 AUS_political_events.49.a:0 "Peki, o eyaletleri alabilirler."
 AUS_political_events.49.b:0 "Bizim toprağımız bundan çok daha değerli!"
 AUS_political_events.49.desc:0 "Gerilimler arttıkça etrafımızdaki dünya değişiyor. Bugün [FROM.GetAdjective] hükümetinin Silezya'yı onlara devretmemizi talep ettiği bir iletişim aldık. Silezya tarihsel olarak imparatorluklarının bir parçasıydı ama Büyük Savaş'ın sona ermesinden sonra bizim kontrolümüze geçti ve o zamandan beri de öyle.\n\n[FROM.GetNameDefCap], kararımızı kolaylaştırabileceği umuduyla Niederschlesien ve Oberschlesien eyaletleri karşılığında birkaç fabrika teklif etmeyi seçti."
 AUS_political_events.49.t:0 "[FROM.GetNameDefCap] Silezya'nın Devrini Talep Ediyor"
 AUS_political_events.5.a:0 "Buna değer, mümkün olduğunca yardım edeceğiz!"
 AUS_political_events.5.b:0 "Birlikte çalışmayı öğrenebiliriz."
 AUS_political_events.5.c:0 "Bize söyledikleri bu 'Savunma' yalanına kanmıyoruz."
 AUS_political_events.5.desc:0 "Ülkemizdeki [AUS.GetAdjective] diplomatlarından bir teklif az önce elimize ulaştı. Saint-Germain-En-Laye Antlaşması'ndan kurtulmuş olarak, şimdi ordularını yeniden kurmak istiyorlar; bize güvence verdiklerine göre savunma amaçlı. Ülkelerinin oldukça sağlam uçak gövdeleri yapma ve oldukça yetenekli pilotlara sahip olma geçmişi var, ancak üretim ve eğitimlerindeki boşlukla şimdi bu kapasiteyi yeniden inşa etme zorluğuyla karşı karşıyalar. Büyük Savaş'taki eylemlerini görmezden gelmeye hazırsak, bu ortaklıktan kazançlı çıkabiliriz."
 AUS_political_events.5.t:0 "[AUS.GetNameDefCap] Hava Kuvvetlerimiz Arasında İşbirliği Arıyor"
 AUS_political_events.50.a:0 "Çok adil bir anlaşma!"
 AUS_political_events.50.desc:0 "[FROM.GetAdjective]lerden Silezya'yı onlardan alma isteğimizle ilgili olarak geri bildirim aldık. Bu anlaşmayı nazikçe kabul ettiler ve eyaletleri derhal bize devredecekler. Karşılığında onlara seçtikleri eyaletlerde birkaç fabrika inşa ettik."
 AUS_political_events.50.t:0 "[FROM.GetNameDefCap] Silezya'yı Devrediyor"
 AUS_political_events.51.a:0 "Bu sözleri onlara yutturacağız!"
 AUS_political_events.51.desc:0 "[FROM.GetAdjective] diplomatlarından gelen iletişim, duymayı umduğumuz türden değildi. [FROM.GetNameDef] anlaşmayı reddetmekle kalmıyor, bunu ancak aşağılayıcı ve küçümseyici olarak tanımlanabilecek bir şekilde yapıyor, neden böyle bir şeyi kabul etmeleri gerektiğini ve neden bir şey talep etme hakkımız olduğunu hissettiğimizi sorguluyor."
 AUS_political_events.51.t:0 "[FROM.GetNameDefCap] Silezya'yı Devretmeyi Reddediyor"
 AUS_political_events.52.a:0 "Boyun eğmekten başka çaremiz yok"
 AUS_political_events.52.b:0 "Habsburgların Habsburg üzerinde hakkı yok!"
 AUS_political_events.52.desc:0 "Asırlık hak iddiaları ve ailesel bağlara dayanarak, [FROM.GetAdjective] hükümdarı [FROM.GetLeader], yönetimine boyun eğmemizi talep etti. Ailesinin eski mülkü olan Habsburg şehrinin haklı olarak ülkesine ait olduğunu iddia ederek, derhal entegre olmamızı ya da yeni yeniden inşa edilmiş ordusunun gazabıyla yüzleşmemizi talep ediyor."
 AUS_political_events.52.t:0 "[FROM.GetNameDefCap] Entegrasyonumuzu Talep Ediyor"
 AUS_political_events.53.a:0 "Sonunda!"
 AUS_political_events.53.desc:0 "[FROM.GetAdjective]lerin ülkelerinin ilhakına direnmeyecekleri ve bunun yerine şanlı [ROOT.GetName]'imize barışçıl bir şekilde entegre olacaklarına dair haberler aldık. Sonunda eski yurdumuz olan Habsburg köyünün kontrolünü ve mülkiyetini yeniden kazandık."
 AUS_political_events.53.t:0 "[FROM.GetNameDefCap] Barışçıl Bir Şekilde Entegre Oluyor"
 AUS_political_events.54.a:0 "Habsburg için!"
 AUS_political_events.54.desc:0 "[FROM.GetAdjective] liderliğinden yanıt aldık, taleplerimize boyun eğmeyecekler. Habsburg şehri üzerindeki ailesel hak iddialarımızı göz ardı ederek, arazinin haklı mülkiyetini bize vermeyi reddediyorlar ve onurumuza leke sürüyorlar. Bu hoş görülemezdi!"
 AUS_political_events.54.t:0 "[FROM.GetNameDefCap] Habsburg Üzerindeki Haklı İddiamızı Reddediyor"
 AUS_political_events.55.a:0 "Adil bir anlaşma"
 AUS_political_events.55.b:0 "Toprağımız satılık değil!"
 AUS_political_events.55.desc:0 "[FROM.GetAdjective] liderliği bize bir teklifle ulaştı. Uzun zamandır bizden [39.GetName] ve [850.GetName]'yi almak istiyorlardı. Bu eyaletleri pratik olarak onlara satmamız durumunda karşılığında birkaç fabrika teklif ederek bize geldiler."
 AUS_political_events.55.t:0 "[FROM.GetNameDefCap] [39.GetName] ve [850.GetName]'nin Mülkiyeti Üzerine Anlaşma Yapmak İstiyor"
 AUS_political_events.56.a:0 "Harika haber"
 AUS_political_events.56.desc:0 "[GetHostilityItalianClaimDesc56]"
 AUS_political_events.56.t:0 "[GetHostilityItalianClaimTitle56]"
 AUS_political_events.57.a:0 "Denemeye değerdi"
 AUS_political_events.57.desc:0 "[GetHostilityItalianClaimDesc57]"
 AUS_political_events.57.t:0 "[GetHostilityItalianClaimTitle57]"
 AUS_political_events.58.a:0 "Peki"
 AUS_political_events.58.b:0 "Kesinlikle olmaz!"
 AUS_political_events.58.desc:0 "[FROM.GetNameDefCap] bize bir tehdit gibi görünen bir şeyle ulaştı. Kibar olmayan bir dille, haklı olarak kendilerine ait olduğunu iddia ettikleri [39.GetName] ve [850.GetName]'yi istediklerini bize bildiriyorlar. Eyaletler bir zamanlar [FROM.GetAdjective] ana karalarının bir parçasıydı ama Büyük Savaş'tan beri bize aitti."
 AUS_political_events.58.t:0 "[FROM.GetNameDefCap] [39.GetName] ve [850.GetName]'nin Mülkiyetini Talep Ediyor"
 AUS_political_events.59.a:0 "Gitmesi gerekiyor!"
 AUS_political_events.59.b:0 "Bu onların kararı"
 AUS_political_events.59.desc:0 "[FROM.GetNameDef] hükümeti bir kez daha, açıkça [ROOT.GetAdjective] karşıtı duygulara sahip bir mareşal olan Alfred Jansa'ya güvendi. Sınırlarımızı güçlendirme planları ve bize yönelik bir saldırıyı önlemeye yönelik özel bir planla bu mareşal, daha önce başımıza bela olmuştu ve muhtemelen yine olacaktır."
 AUS_political_events.59.t:0 "[FROM.GetNameDefCap] Alfred Jansa'nın Planını Destekliyor"
 AUS_political_events.6.a:0 "Harika bir ortaklığa kadeh kaldıralım!"
 AUS_political_events.6.desc:0 "[FROM.GetNameDefCap], hava kuvvetlerimizi kurma ve deneyimlerimizi paylaşma konusundaki işbirliği önerimize olumlu yanıt verdi. Saint-Germain-En-Laye Antlaşması'ndan kurtulduktan sonra karşılaştığımız zorlukları gördüler ve bize onlardan fazla teçhizat satın alma imkanı da sundular!"
 AUS_political_events.6.t:0 "[FROM.GetNameDefCap] Teklifimizi Kabul Ediyor ve Bize Teçhizat Satın Alma Erişimi Veriyor"
 AUS_political_events.60.a:0 "Peki, o zaman Franz Böhme ile devam edeceğiz"
 AUS_political_events.60.a_tt:0 "§YFranz Böhme§!, Kara Kuvvetleri Komutanı olarak §GKullanılabilir§! hale gelecektir. \n\n§YAlfred Jansa§! artık Kara Kuvvetleri Komutanı olarak §RKullanılamayacaktır§!."
 AUS_political_events.60.b:0 "Alfred Jansa'nın kalması için daha da fazla neden var!"
 AUS_political_events.60.b_tt:0 "§YAlfred Jansa§!, Kara Kuvvetleri Komutanı olarak kullanılabilir kalmaya devam edecektir"
 AUS_political_events.60.desc:0 "[FROM.GetNameDef]'den Alfred Jansa tarafından ortaya konan savunma planına olan son bağlılığımız hakkında resmi bir şikayet geldi. Bu eylemin açıkça onlara karşı düşmanlıktan kaynaklandığını ve gelecekteki diplomatik ilişkilerimizin önünde duracağını iddia ediyorlar. Bunun neden bu kadar hararetli bir tepkiye yol açtığından emin değiliz."
 AUS_political_events.60.t:0 "[FROM.GetNameDefCap] Alfred Jansa'nın Savunma Planına İtiraz Ediyor"
 AUS_political_events.61.a:0 "Mükemmel!"
 AUS_political_events.61.desc:0 "[FROM.GetAdjective]lerin Alfred Jansa'yı ve onun aptalca savunma planını derhal değiştirmeleri yönündeki baskımız işe yaradı. Çok [ROOT.GetAdjective] karşıtı olan Jansa'nın yerine [FROM.GetAdjective]ler şimdi çok daha uysal olan Franz Böhme ile devam ettiler."
 AUS_political_events.61.t:0 "[FROM.GetNameDefCap] Alfred Jansa'yı Değiştiriyor"
 AUS_political_events.62.a:0 "Buna nasıl cüret ederler?"
 AUS_political_events.62.desc:0 "[FROM.GetNameDef]'in Jansa Planı olarak adlandırılan planı takip etmemesi ve bu adamın herhangi bir güç veya nüfuza sahip olmamasını sağlama taleplerimize rağmen, [FROM.GetAdjective]ler taleplerimizi dikkate almayı reddetti. Bunun gelecekteki ilişkilerimiz için kötüye işaret olduğunu varsayabiliriz."
 AUS_political_events.62.t:0 "[FROM.GetNameDefCap] Alfred Jansa'yı Sorumlu Tutuyor."
 AUS_political_events.63.a:0 "Sadakatlerini garanti edemeyiz"
 AUS_political_events.63.b:0 "Yardımlarını kullanabiliriz"
 AUS_political_events.63.desc:0 "[AUS.GetNameDef]'in Anschluss'u, bu gelişmeye karşı çıkan birçok [AUS.GetAdjective]i eski vatanlarından sürgün etti. Bu muhaliflerden bazıları şimdi [ROOT.GetNameDef]'e geldi ve fabrikalarda, sokaklarda ve cephelerde hizmetlerini sunuyor."
 AUS_political_events.63.t:0 "Sürgündeki [AUS.GetAdjective]ler Hizmetlerini Sunuyor"
 AUS_political_events.64.a:0 "Hoş bir sürpriz!"
 AUS_political_events.64.desc:0 "Görünüşe göre belirli bir nedene dayanmaksızın [FROM.GetAdjective]ler, sanayimizi daha da yükseltmeye yardımcı olmak için bir teklifle bize ulaştı. Fabrika inşaatına daha fazla odaklanmamızı sağlamak için sivil tüketim malları üretimimizin bir kısmını karşılamayı teklif ettiler."
 AUS_political_events.64.t:0 "[FROM.GetNameDefCap] Sanayi Desteği Teklif Ediyor"
 AUS_political_events.65.a:0 "Ne olursa olsun faydalı!"
 AUS_political_events.65.desc:0 "Görünüşe göre belirli bir nedene dayanmaksızın [FROM.GetAdjective]ler, Uluslararası Pazar'daki teçhizatlarında indirim teklifiyle bize ulaştı. Bunun bizi onlardan daha fazla satın almaya teşvik etmek için bir hile mi yoksa samimi bir teklif mi olduğu belirsiz bırakılıyor."
 AUS_political_events.65.t:0 "[FROM.GetNameDefCap] Pazar Desteği Teklif Ediyor"
 AUS_political_events.66.a:0 "Adil bir anlaşma gibi görünüyor"
 AUS_political_events.66.b:0 "Bunun bize hiçbir faydası yok!"
 AUS_political_events.66.desc:0 "[FROM.GetNameDef]'den [FROM.GetLeader], teklif olarak adlandırdığı bir şeyle bize ulaştı. Federasyon büyüdükçe, ilgili tüm ülkelerin başarısız olmadan birlikte çalışması giderek daha önemli hale geldi. Bunu basitleştirmek için [FROM.GetLeader], hepimizin onların altında birleşmesini önerdi. \n\nEgemenliğimizle ilgili tavizler veriyor olacağız, ancak bir federatif ulusun parçası olarak, daha büyük bir ordu ve daha büyük diplomatik güçlerle gelen güvenlikten de yararlanacağız."
 AUS_political_events.66.t:0 "[FROM.Get.GetNameDefCap] Bir Federatif Birlik Öneriyor"
 AUS_political_events.67.a:0 "Harika!"
 AUS_political_events.67.desc:0 "[FROM.GetNameDef]'in yeni federatif devletimizin bir parçası olmayı kabul ettiğine dair şanlı haber az önce elimize ulaştı. Sunabildiklerimiz, egemenliklerine hafif bir darbe vurmasına rağmen teklifi avantajlı görmeleri için açıkça yeterliydi."
 AUS_political_events.67.t:0 "[FROM.GetNameDefCap] Federatif Birliği Kabul Ediyor"
 AUS_political_events.68.a:0 "Federasyonun birliği için bir risk oluşturuyorlar!"
 AUS_political_events.68.b:0 "Onları yakından izleyeceğiz"
 AUS_political_events.68.desc:0 "Açık avantajlara ve federasyon için en iyisi olmasına rağmen, [FROM.GetNameDef] daha yakın bir birlik teklifimizi reddetti. Nedenleri hakkında sadece spekülasyon yapılabilir, ancak görünüşe göre federasyonun en iyi çıkarlarını düşünmüyor olabilirler."
 AUS_political_events.68.t:0 "[FROM.GetNameDefCap] Federatif Birliğe Katılmayı Reddediyor"
 AUS_political_events.69.a:0 "Mevcut durumumuzda bir umut ışığı"
 AUS_political_events.69.a_tt:0 "§YAnschluss Karşıtı Tedbirler§! Kararlarını kaldırır."
 AUS_political_events.69.b:0 "Zamanımız için güvenlik!"
 AUS_political_events.69.desc:0 "[GetHowAvoidedAnschluss]"
 AUS_political_events.69.t:0 "Anschluss Riski Azaltıldı"
 AUS_political_events.7.a:0 "Harika!"
 AUS_political_events.7.desc:0 "[FROM.GetNameDefCap], hava kuvvetlerimizi karşılıklı olarak kurma konusundaki son işbirliği önerimize oldukça iyi yanıt verdi. Herhangi bir maddi destek sunamasalar da, pilot eğitimi için son yöntemlerinden bazılarını paylaşmayı kabul ettiler."
 AUS_political_events.7.t:0 "[FROM.GetNameDefCap] Teklifimizi Kabul Ediyor"
 AUS_political_events.70.a:0 "Bu işleri değiştirir!"
 AUS_political_events.70.b:0 "Cevabımız hala aynı. Hayır."
 AUS_political_events.70.desc:0 "\n[FROM.GetNameDef]'den [FROM.GetLeader] bu sefer bizzat bize ulaştı. Önceki etkileşimlerimiz umdukları gibi sonuçlanmadı ve fikirlerimizi değiştirme umuduyla bize yeni bir teklif yapmaya karar verdiler.\n\nBu onlar için çok ciddi bir mesele olduğundan, ülkemizde iki yeni fabrikanın masraflarını karşılamaya yardımcı olmayı teklif ettiler ve fikirlerimizi değiştirip onlara bir garanti verirsek minnettar olacaklarını garanti ediyorlar."
 AUS_political_events.70.t:0 "[FROM.GetAdjective] Hükümeti Garantiler Karşılığında Tazminat Teklif Ediyor"
 AUS_political_events.71.a:0 "Sonunda iyi bir haber!"
 AUS_political_events.71.desc:0 "[FROM.GetAdjective] lideri [FROM.GetLeader]'i ikna etme çabalarımız sonuç verdi. Onlar için iki fabrikanın inşasını desteklememiz gerekecek ve bu büyük olasılıkla kendi endüstriyel çabalarımızı engelleyecek olsa da, artık egemenliğimize yönelik bir saldırı durumunda onların yanımızda olduğunu bilerek biraz daha güvende dinlenebiliriz."
 AUS_political_events.71.t:0 "[FROM.GetNameDefCap] Sanayi Desteği Karşılığında Garanti Teklif Ediyor"
 AUS_political_events.72.a:0 "Galip geleceğiz ve onlara göstereceğiz!"
 AUS_political_events.72.desc:0 "Elimizden gelenin en iyisini yapmadığımız söylenemez. Saint-Germain-En-Laye Antlaşması'na atıfta bulunduk ve bizim büyüklüğümüzde ve durumumuzdaki bir ülkeden beklenebilecek olanın çok ötesinde bir tazminat teklif ettik. Tüm bunlara rağmen [FROM.GetNameDef], kendilerinin de formüle edilmesinde yer aldığı Antlaşma'ya uygun olarak bizi garanti etmeyi inatla reddediyor. Gelecekte onların yardımına güvenemeyiz."
 AUS_political_events.72.t:0 "[FROM.GetNameDefCap] Tazminat Teklifine Rağmen Yardım Etmeyi Reddediyor"
 AUS_political_events.73.a:0 "Bunu kabul edebiliriz"
 AUS_political_events.73.a_tt:0 "[FROM.GetNameDef]'in önerdiği revizyonu destekleyeceğiz. Revizyonun gerçekleşmesi için tüm Garantörlerin kabul etmesi gerekir."
 AUS_political_events.73.b:0 "Hayır, antlaşma kalmalı."
 AUS_political_events.73.b_tt:0 "[FROM.GetNameDef]'in önerdiği revizyonu §Rdesteklemeyeceğiz§!. Revizyonun gerçekleşmesi için tüm Garantörlerin kabul etmesi gerekir."
 AUS_political_events.73.c:0 "Eğer yeniden silahlanacaklarsa, bunu denetleyen birini istiyoruz!"
 AUS_political_events.73.c_tt:0 "Gözden geçirilmiş Antlaşma süresince Avusturya'ya demokratik eğilimli bir Gözetmen atanacaktır"
 AUS_political_events.73.desc:0 "\nYeniden silahlanmalarına izin verilmesi çabalarında kararlı olan [FROM.GetAdjective], yeniden silahlanma hızlarını kontrol etmemize olanak tanıyacak gözden geçirilmiş ve daha az sert bir Antlaşma önererek bir kez daha ulaştı. Revizyon, asker eğitmeye başlamalarına izin verecek, ancak endüstrileri bir yıl daha kısıtlı kalacak."
 AUS_political_events.73.t:0 "[FROM.GetNameDef] Saint-Germain-En-Laye Antlaşması'nın Gözden Geçirilmesini Öneriyor"
 AUS_political_events.74.a:0 "Diplomatik çabaya kesinlikle değdi!"
 AUS_political_events.74.desc:0 "Uzun tartışmalar ve birçok münazaradan sonra Garantörler nihayet bir sonuca vardı. Zamanla kısmen yeniden silahlanmamıza izin verilecek, bugünden itibaren yeni birlikler eğitme ve sahadaki asker sayımızı artırma konusunda önümüzde hiçbir kısıtlama kalmayacak.\n\nEndüstrimiz hala kısıtlamalar taşıyor, ancak daha az şiddetli. Dünyada radikal bir değişiklik olmazsa, kısıtlamalar bir yıl içinde tamamen kaldırılacak."
 AUS_political_events.74.t:0 "Garantörler Antlaşmanın Gözden Geçirilmesini Kabul Ediyor"
 AUS_political_events.75.a:0 "Sadece dayanmak zorundayız"
 AUS_political_events.75.b:0 "Artık yeter, onlara ihtiyacımız yok!"
 AUS_political_events.75.desc:0 "Çabalarımız ne olursa olsun, garantörler kararlı. Hiçbir koşulda yeniden silahlanmamıza izin verilmeyecek. Onları ikna etme ve uzlaşma sunma konusundaki diplomatik çabalarımız sağır kulaklara düştü. [ROOT.GetAdjective] nüfusu şimdi bu Garantörlere karşı güçlü bir kızgınlık besliyor."
 AUS_political_events.75.t:0 "Garantörler Antlaşmayı Gözden Geçirmeyi Reddediyor"
 AUS_political_events.76.a:0 "Kabul ediyoruz!"
 AUS_political_events.76.desc:0 "\nUzun tartışmalar ve birçok münazaradan sonra Garantörler nihayet bir sonuca vardı. Zamanla kısmen yeniden silahlanmamıza izin verilecek, bugünden itibaren yeni birlikler eğitme ve sahadaki asker sayımızı artırma konusunda önümüzde hiçbir kısıtlama kalmayacak. Endüstrimiz hala kısıtlamalar taşıyor, ancak daha az şiddetli. Dünyada radikal bir değişiklik olmazsa, kısıtlamalar bir yıl içinde tamamen kaldırılacak.\n\nAncak bu zaferin bir bedeli oldu. Garantörler çatışmadan uzak durma yeteneğimize güvenmiyorlar ve bu süreç boyunca hükümetimizde kalması gereken bir gözetmen atadılar."
 AUS_political_events.76.t:0 "Garantörler Antlaşmanın Gözden Geçirilmesini Kabul Ediyor, Gözetmen Atıyor"
 AUS_political_events.77.a:0 "Darbeye hazırlanın..."
 AUS_political_events.77.a_tt:0 "§R[GER.GetNameWithFlag] bizi Anschluss sürecini başlattı. Artık bunu etkileyemeyiz!§!"
 AUS_political_events.77.desc:0 "En deneyimli ve yetenekli diplomatlarımızdan bazıları, [GER.GetNameDef]'in [GER.GetLeader] tarafından zaman zaman onaylanan, zaman zaman reddedilen planlara göre hareket etme riskini uzun süredir izliyor. Görünüşe göre son zamanlarda oldukça radikal bir değişim yaşandı ve kaynaklarımız şimdi bizi ilhak etme girişiminin çok yakın olabileceğine inanıyor."
 AUS_political_events.77.t:0 "Yakın Bir Tehdit"
 AUS_political_events.78.a:0 "Elimizden gelirse yardım ederiz!"
 AUS_political_events.78.b:0 "Yapacak daha iyi işlerimiz var"
 AUS_political_events.78.desc:0 "[FROM.GetNameDef]'deki [FROM.GetCommunistParty] liderleri bir kez daha yardım istemek için bize ulaştılar. Şu anda silahlı bir çatışma içinde olmasalar da, 1934'teki iç savaşın ve darbenin Sosyal Demokratlarla birlikte yakıcı başarısızlığı hala akıllarında. Ülkelerinde bir kez daha iktidar mücadelesi verirken yardımımızı istiyorlar."
 AUS_political_events.78.t:0 "[FROM.GetNameDef]'teki Komünistler Desteğimizi İstiyor"
 AUS_political_events.79.a:0 "Harika!"
 AUS_political_events.79.a_tt:0 "Bir savaş çıkması durumunda, [FROM.GetFlag]§Y[FROM.GetNameDef]§!'in bize gönüllüler gönderme ve teçhizat kiralama-ödünç verme olasılığı daha yüksektir."
 AUS_political_events.79.desc:0 "Umut ettiğimiz gibi, [FROM.GetAdjective] liderliği bu zor zamanlarda bize destek teklif etti. Elbette tüm sorunlarımızı tamamen çözmeleri için onlara güvenemeyiz, ancak bir kez daha desteklerini almak kesinlikle çok makbule geçen bir yardım. Özellikle iktidar mücadelemiz sürerken."
 AUS_political_events.79.t:0 "[FROM.GetNameDefCap] Desteğini Sunuyor"
 AUS_political_events.8.a:0 "Peki bu durum onlara nasıl fayda sağlayacak?"
 AUS_political_events.8.desc:0 "[FROM.GetNameDefCap] teklifimizi reddetti. Anlaşmanın tek taraflı olacağını, onlara hiçbir fayda sağlamayacağını ve Büyük Savaş'taki eylemlerimizle kendimizi bu duruma soktuğumuzu belirttiler."
 AUS_political_events.8.t:0 "[FROM.GetNameDefCap] Önerdiğimiz Ortaklığı Reddediyor"
 AUS_political_events.80.a:0 "Gerçekten yardım edeceklerini sanmıştık!"
 AUS_political_events.80.desc:0 "Küçük ideolojik farklılıkları ve devrimci komünizme karşı tereddüdümüzü gerekçe gösteren [FROM.GetNameDef], yardım çağrımızı reddetti. Kendi başımızın çaresine bakmak zorunda kalacağız."
 AUS_political_events.80.t:0 "[FROM.GetNameDefCap] Destek Çağrımızı Reddediyor"
 AUS_political_events.81.a:0 "Harika, korumamızı sunacağız"
 AUS_political_events.81.b:0 "En değerli müttefikler olacaklar... ama henüz değil."
 AUS_political_events.81.desc:0 "Uzun bir süre boyunca [FROM.GetAdjective]ler inatla Avustromarksizm olarak adlandırılan kendi komünizm biçimlerine bağlı kaldılar. Bu siyasi bölünme, pek sevmediğimiz bir sosyal demokrasi ve gerçek komünizm birleşimi biçimidir. Şimdi nihayet akılları başlarına gelmiş ve düşman güçlerin onlara saldırması durumunda korumamızı umdukları için bizim gözümüze girmek amacıyla bu ideoloji hatasını ortadan kaldırıp bizimle aynı hizaya gelmiş görünüyorlar."
 AUS_political_events.81.t:0 "[FROM.GetNameDefCap] Siyasetimizle Aynı Çizgiye Geliyor"
 AUS_political_events.82.a:0 "Harika!"
 AUS_political_events.82.desc:0 "[FROM.GetLeader]'in siyasi ideolojisine daha yakın durma kararımız iyi karşılandı. [FROM.GetNameDefCap] bize bir garanti teklif etti ve herhangi bir düşmanlığa maruz kalmamız durumunda bizi destekleyecek."
 AUS_political_events.82.t:0 "[FROM.GetNameDefCap] Garanti Teklif Ediyor"
 AUS_political_events.83.a:0 "Dört gözle bekliyoruz!"
 AUS_political_events.83.desc:0 "[FROM.GetLeader]'in siyasi ideolojisine daha yakın durma kararımız iyi karşılandı. [FROM.GetNameDefCap], bu hamleyi doğru yönde atılmış bir adım olarak takdir ettiklerini ve gelecekte bizi müttefik olarak görmeyi umduklarını dile getirdi."
 AUS_political_events.83.t:0 "[FROM.GetNameDefCap] Siyasi Değişimimizi Onaylıyor"
 AUS_political_events.84.a:0 "Bunda bir sorun görmüyoruz"
 AUS_political_events.84.b:0 "Onları yasaklayın!"
 AUS_political_events.84.b_tt:0 "§RBunun korkunç sonuçları olabilir!§!"
 AUS_political_events.84.desc:0 "\n[AUS.GetNameDef] tarafından iş gücümüz arasında komünist duyguları körükleme girişimleri olduğu dikkatimizi çekti. Bu zararsız olabileceği gibi, bir şeyin hazırlığı da olabilir. Gerçek niyetlerinin ne olduğunu bilmiyoruz, ancak tüm olasılıkları göz önünde bulundurmalıyız."
 AUS_political_events.84.t:0 "[FROM.GetAdjective]ler Ülkemizdeki Komünist Duyguları Güçlendiriyor"
 AUS_political_events.85.2.a_tt:0 "§Y[FROM.GetNameDef]'deki İşçilerin Kurtuluşunu Talep Et§! kararının kilidini açar."
 AUS_political_events.85.a:0 "Mükemmel"
 AUS_political_events.85.a_tt:0 "§Yİşçilerin Kurtuluşunu Talep Et§! odağı tamamlandıktan sonra §Yİşçilerin Kurtuluşunu Talep Et§! kararlarının kilidini açar"
 AUS_political_events.85.desc:0 "\n[FROM.GetNameDef]'deki faaliyetlerimizin er ya da geç keşfedileceğinin farkındaydık. Neyse ki [FROM.GetLeader], iş güçleri içindeki komünist duyguları güçlendirmemizden, onlara iyi işçiler olarak haklarını ve görevlerini bildirmemizden rahatsız olmuyor gibi görünüyor."
 AUS_political_events.85.t:0 "[FROM.GetNameDefCap] İşçileri Örgütleme Çabalarımıza İzin Veriyor"
 AUS_political_events.86.a:0 "Lanet olsun!"
 AUS_political_events.86.b:0 "Bu düşmanlığı durduracağız!"
 AUS_political_events.86.desc:0 "\nKendi işçilerine saygısızlık ederek [FROM.GetLeader], onlara toplumdaki haklarını bildirme çabalarımızı yasakladı. Bu, sadece bize değil, aynı zamanda dünyanın dört bir yanındaki işçilere karşı da açıkça düşmanca bir eylemdir."
 AUS_political_events.86.t:0 "[FROM.GetNameDefCap] İşçileri Örgütleme Çabalarını Yasaklıyor"
 AUS_political_events.87.a:0 "Başka seçeneğimiz yok."
 AUS_political_events.87.b:0 "Kendi kararlarımızı kendimiz veririz."
 AUS_political_events.87.desc:0 "[FROM.GetAdjective] propagandası işçilerimiz arasında yayılırken artan komünist duyguların ardından bize bir ültimatom ulaştı. [FROM.GetLeader], halkımızın istediğini algıladığı için barışçıl bir komünist devralmaya izin vermemizi talep ediyor. Reddedersek, işçilerimizin yanında, ne yapmak isterlerse istesinler duracaklarını garanti ediyor."
 AUS_political_events.87.t:0 "[FROM.GetAdjective] Komünist Bir Rejim Talep Ediyor"
 AUS_political_events.88.a:0 "Hoş geldiniz, yoldaşlar!"
 AUS_political_events.88.desc:0 "[FROM.GetNameDef]'deki yorulmak bilmeyen çabalarımız nihayet sonuç verdi. Yeni lider [FROM.GetLeader] ülkenin liderliğini üstlenirken işçiler seviniyor."
 AUS_political_events.88.t:0 "[FROM.GetNameDefCap] Komünist Hükümet Kuruyor"
 AUS_political_events.89.a:0 "Bir savaş daha da kötü olurdu"
 AUS_political_events.89.b:0 "Halkın sesi duyulacak!"
 AUS_political_events.89.desc:0 "Halklarının istediğine dair açık göstergelere rağmen, [FROM.GetAdjective] ve liderleri [FROM.GetLeader], daha uygun bir hükümetin devralması için istifa etmemeyi seçti. Seçeneğimizi gözden geçirmeli ve halk için doğru olanı yapmalıyız."
 AUS_political_events.89.t:0 "[FROM.GetNameDefCap] Taleplerimizi Reddediyor"
 AUS_political_events.9.a:0 "Yani [GER.GetAdjective]ler hem yalancı hem de katil..."
 AUS_political_events.9.a_tt:0 "§YWilhelm Zehner§! §Röldürüldü!§!"
 AUS_political_events.9.desc:0 "Askeri Yüksek Komutanlığımızın üyelerinden Wilhelm Zehner, dairesinde ölü bulundu. [GER.GetAdjective] diplomatları her şeyi inkar ediyor ve olayla ilgilerinin olmadığını ve Zehner'in bunu yanında bulunan silahla kendisinin yapmış olması gerektiğini iddia ediyorlar. Cezai soruşturma ise tamamen farklı bir yöne işaret ediyor..."
 AUS_political_events.9.t:0 "Wilhelm Zehner'e Suikast Düzenlendi"
 AUS_political_events.90.a:0 "Kurt Schuschnigg özünde bir demokrattır!"
 AUS_political_events.90.a_tt:0 "§YKurt Schuschnigg§! §YDemokratik§! partinin lideri olur."
 AUS_political_events.90.b:0 "Karl Renner bize daha önce iyi hizmet etti!"
 AUS_political_events.90.c:0 "Vinzenz Schumy çoğu seçmene hitap edebilir!"
 AUS_political_events.90.desc:0 "'Parlamentonun Kendi Kendini Tasfiyesi'nden bu yana ilk seçim sonuçlandı. Seçmen olarak görevlerini ihmal ederlerse ulusumuzun ne hale geleceğini gören ulus, seçime yüksek katılım gösterdi. Son sayım yapılırken önde gelen üç aday arasında sadece birkaç oy farkı var."
 AUS_political_events.90.t:0 "Seçim Sonuçlarımız"
 AUS_political_events.91.a:0 "İlerle Arşidük! Koltuğunu sıcak tutacak birini buluruz"
 AUS_political_events.91.a_tt:0 "Yeni Başkent §YVaduz§! olarak adlandırılacak!"
 AUS_political_events.91.a_tt2:0 "§YOtto von Habsburg§! §Y2. Seviye§! bir Mareşal olur"
 AUS_political_events.91.b:0 "Arşidükler bile yerlerinde kalmalı"
 AUS_political_events.91.desc:0 "Son zamanlarda Arşidükümüz, Majesteleri [ROOT.GetLeader]'in sürekli olarak cephedeki durumu düşündüğünü gördük. Bir yetersizlik hissi duyduğunu ve adamlarını daha doğrudan yönetmek istediğini ifade ediyor. Bugün konu tekrar gündeme geldi, Arşidükümüz savaşta adamlarını cesurca yönetmek ve yönetimi başkasına bırakmak istiyor."
 AUS_political_events.91.t:0 "[ROOT.GetLeader] Savaş Alanında Olmak İstiyor"
 AUS_political_events.92.a:0 "Toprağımız satılık değil!"
 AUS_political_events.92.b:0 "[463.GetName]'e ihtiyacımız yok"
 AUS_political_events.92.desc:0 "[FROM.GetNameDef]'den [FROM.GetLeader], [463.GetName] eyaletini satın alma talebiyle bize ulaştı. 1867'de eyalet o zamanki Rus İmparatorluğu'ndan [USA.GetNameDef] tarafından satın alındığında, teklif ilk olarak [FROM.GetNameDef]'e uzatılmıştı. Teklif o zaman reddedildi, ancak o zamandan beri fikir değiştirdiler ve şimdi eyaleti bizden almak istiyorlar. Karşılığında bize cömertçe ödeme yapmayı teklif ediyorlar."
 AUS_political_events.92.t:0 "[FROM.GetNameDefCap] Alaska'nın Satın Alınmasını Talep Ediyor"
 AUS_political_events.93.a:0 "Harika"
 AUS_political_events.93.desc:0 "[FROM.GetLeader]'den, teklif ettiğimiz meblağ karşılığında bize [463.GetName] eyaletini satmayı kabul ettiklerine dair haber aldık. Eyalet, entegrasyon çabalarına başlamamıza olanak sağlamak için derhal bize devredilecektir."
 AUS_political_events.93.t:0 "[FROM.GetNameDefCap] Bize [463.GetName]'i Satıyor"
 AUS_political_events.94.a:0 "Denemeye değerdi"
 AUS_political_events.94.b:0 "Onları özgürleştireceğiz!"
 AUS_political_events.94.desc:0 "[463.GetName]'i onlardan almak için [FROM.GetNameDef]'e teklif ettiğimiz çok büyük meblağa rağmen, bu anlaşmayı reddediyorlar. [463.GetName] üzerinde çok meşru bir hak iddiamız var ve şimdi bunu aktif olarak reddediyorlar. Nasıl ilerleyeceğimizi en iyi şekilde düşünmeliyiz."
 AUS_political_events.94.t:0 "[FROM.GetNameDefCap] [463.GetName]'i Satmayı Reddediyor"
 AUS_political_events.95.a:0 "[ROOT.GetNameDef]'e hoş geldiniz!"
 AUS_political_events.95.a_tt:0 "Gerçek bir [ROOT.GetAdjective] vatansever saflarımıza katıldı"
 AUS_political_events.95.desc:0 "Avusturya-Prusya Savaşı 22 Temmuz 1866'da sona erdiğinde, cesur ordumuz eve geri yürüdü, geri döndüğünde saflarda savaşa gidenden bir asker daha fazla olduğu söylendi. Bunun doğru mu yoksa sadece bir uydurma masal mı olduğu tartışmalı. Ancak şanlı ordumuz bir adam daha güçlü olarak geri dönerken bunun şimdi gerçekleştiğini teyit edebiliriz."
 AUS_political_events.95.t:0 "[ROOT.GetAdjective] Ordusu Başarılı Seferin Ardından Geri Dönüyor"
 AUS_political_events.96.a:0 "Katılmalarından büyük memnuniyet duyarız!"
 AUS_political_events.96.b:0 "Onlara güvenmiyoruz."
 AUS_political_events.96.desc:0 "Yeni demokratikleşen [FROM.GetName]'den [FROM.GetLeader], [ROOT.GetFactionName]'e katılma talebiyle bize başvurdu. Büyük savaşın sonundan beri yalnız durmalarına rağmen, mevcut siyasi iklim ve dünyada artan gerilimler fikir değiştirmelerine neden oldu. Artık tekrar düzgün bir demokrasi olduklarını görerek bize ulaşmayı seçtiler ve ittifak için büyük bir kazanım olacaklarını garanti ettiler!"
 AUS_political_events.96.t:0 "[FROM.GetNameDefCap] [ROOT.GetFactionName] İttifakına Katılmak İstiyor"
 AUS_political_events.97.a:0 "Yapılması gerekiyordu"
 AUS_political_events.97.desc:0 "[ROOT.GetFactionName] ittifakına katılma talebimiz onaylandı! Bu keskin rota değişikliğinin ülkemizin ihtiyacı olan şey olduğundan çok emin olsak da, durumun bir ciddiyeti var. Büyük Savaş'tan sonra, benzer bir durumun bir daha asla ortaya çıkmaması umuduyla tüm ittifaklarla bağlarımızı kopardık. Şimdi yeni ittifakımızın göreceli güvenliğine yerleşirken, barışın gerçekten de kırılgan bir şey olduğu bilgisiyle hareket ediyoruz."
 AUS_political_events.97.t:0 "[FROM.GetNameDefCap] Bizi [ROOT.GetFactionName]'e Kabul Ediyor"
 AUS_political_events.98.a:0 "Ne kadar korkunç bir davranış!"
 AUS_political_events.98.b:0 "Görünüşe göre her şeyi kendimiz yapmak zorunda kalacağız!"
 AUS_political_events.98.desc:0 "Tüm çabalarımıza rağmen, [FROM.GetAdjective]'e [FROM.GetFactionName] ittifakına katılmak için gönderdiğimiz talep reddedildi. Nedenine dair verdikleri cevaplar gerçek bir neden sunmadı ve görünüşe göre bir kez daha kendi başımızın çaresine bakmak zorunda bırakıldık."
 AUS_political_events.98.t:0 "[FROM.GetNameDefCap] [FROM.GetFactionName] İttifakına Katılma Talebimizi Reddediyor"
 AUS_political_events.99.a:0 "Bize boyun eğecekler!"
 AUS_political_events.99.b:0 "Bırakın bu zafer onların olsun, gardlarını indirsinler..."
