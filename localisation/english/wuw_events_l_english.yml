 GER_inner_circle_industrial_reichsleiter_no_goring:0 "$GER_fritz_todt$ ve $GER_albert_speer$"
 GER_is_colonial_overlord_desc:0 "Bu günün geleceğinden korkmuştuk, yine de gelmeyeceğini ummuştuk. [FROM.GetNameDef]'in lideri [FROM.GetLeader], [FROM.GetLeader.GetHerHis]'in tebaası olarak bağımsızlığımızdan vazgeçmemizi ve [FROM.GetNameDef]'in bir parçası olmamızı talep etti. Bu soruda fikirlerimizin artık bir önemi yok, uymaktan başka çaremiz yok."
 GER_is_colonial_overlord_option:0 "İyi bir dönem geçirdik"
 GER_is_not_colonial_overlord_desc:0 "Topraklarımızı [FROM.GetNameDef]'e devretme talepleri aldık. Tarihi nedenlerle bu toprakların haklı sahiplerinin kendileri olduğunu iddia ediyorlar. Talep oldukça sert bir dille yazılmış ama yine de kendi gündemimize göre yanıt vermek için yerimiz var."
 GER_is_not_colonial_overlord_option:0 "Tedbirli olmak iyidir..."
 GER_kaiserreich_decided_not_to_attack_poland:0 "Eski İmparatorluk Mülklerinin reddedilen iadesi üzerine §YPolonya§!'ya saldırmamaya karar verdi"
 GER_lokot_collaborators_have_been_captured_by_the_soviets_tt:0 "§Y[GER.SOV_bronislav_kaminski.GetName]§! ve §Y[GER.SOV_konstantin_voskoboinik.GetName]§! [SOV.GetAdjective] kuvvetleri tarafından yakalandı"
 GER_mackensen_went_into_retirement_tt:0 "§YAugust von Mackensen§!, §YMareşal§! olmaktan çıkıyor!"
 GER_mefo_bills_warning_tt:0 "§Y[GetMilitaryProductionModifierName]§! $MODIFIER_CONSUMER_GOODS_FACTOR$: §Y[?ROOT.GER_industrial_consumer_goods_factor|1%]§!'e ulaştı!"
 GER_operation_panzerfaust_events.01.a:0 "Führer'e boyun eğmesini talep et"
 GER_operation_panzerfaust_events.01.b:0 "Bu aşırı bir tepki, Horthy sadıktır!"
 GER_operation_panzerfaust_events.01.desc:0 "Müttefikimiz Miklós Horthy'nin düşmanlarımızla gizli barış görüşmeleri yapma olasılığı önümüze çıktı. Macaristan'ın davaya sadık kalmasını sağlamak için ona baskı yapmalıyız."
 GER_operation_panzerfaust_events.01.t:0 "Horthy'nin Sadakat Sorunu"
 GER_operation_panzerfaust_events.02.a:0 "Onlara karşı koyacak durumda değiliz"
 GER_operation_panzerfaust_events.02.b:0 "Burada güçleri yok"
 GER_operation_panzerfaust_events.02.desc:0 "Bugün Almanların, daha güvenilir buldukları Ferenc Szálasi lehine Miklós Horthy'nin istifa etmesini talep ettiklerine dair haber aldık. Ayrıca, istediklerini elde edemezlerse ülkemize müdahalenin bir zorunluluk olabileceğini de belirttiler."
 GER_operation_panzerfaust_events.02.t:0 "[GER.GetLeader] Horthy'nin İstifasını Talep Ediyor"
 GER_operation_panzerfaust_events.03.a:0 "Harika"
 GER_operation_panzerfaust_events.03.desc:0 "Miklós Horthy boyun eğdi ve Macaristan şimdi tamamen bizim elimizde. Gözdağımız başarılı olmuş gibi görünüyor."
 GER_operation_panzerfaust_events.03.t:0 "Macaristan Boyun Eğiyor"
 GER_operation_panzerfaust_events.04.a:0 "Bu çok ileri gitti. Margarethe operasyonunu başlatın!"
 GER_operation_panzerfaust_events.04.b:0 "Onun oyunlarına alet olmayacağız"
 GER_operation_panzerfaust_events.04.c:0 "O zaman bunu operatiflerimize bırakacağız..."
 GER_operation_panzerfaust_events.04.desc:0 "Miklós Horthy bugün Alman baskısına boyun eğmeyeceğini ve Macaristan'ın Almanların elinden uzak kalacağını açıkladı. Sadece diplomatik baskı yeterli görünmediği için şimdi hareket tarzımıza karar vermeliyiz."
 GER_operation_panzerfaust_events.04.t:0 "Horthy Meydan Okumaya Devam Ediyor"
 GER_operation_panzerfaust_events.05.a:0 "Bırakın gelsinler"
 GER_operation_panzerfaust_events.05.desc:0 "Führer iddiasına sadık kalıyor ve şimdi boyun eğdirme hedefiyle ülkemize bir işgal olan Margarethe operasyonunun başladığını duyurdu. Meydan okumalıyız!"
 GER_operation_panzerfaust_events.05.t:0 "Almanya Margarethe Operasyonu'nu Başlatıyor"
 GER_operation_panzerfaust_events.06.a:0 "Öyle olsun"
 GER_operation_panzerfaust_events.06.desc:0 "Sınırlarımıza ve egemenliğimize yönelik tüm tehditlere rağmen, Almanya şimdi iddialarından geri adım atarak durumu yatıştırmaya çalıştı."
 GER_operation_panzerfaust_events.06.t:0 "Almanya Gerilimi Düşürmeye Çalışıyor"
 GER_operation_panzerfaust_events.07.a:0 "Şimdilik elimizden uzakta kalmak zorundalar"
 GER_operation_panzerfaust_events.07.desc:0 "Bunun giderek daha isyankar olan Macarlara son darbe olacağını ummuş olsak da, Panzerfaust Operasyonu bugün ajanlarımızın Horthy'nin konutunun hemen dışında tutuklanmasının ardından boşa çıktı."
 GER_operation_panzerfaust_events.07.t:0 "Panzerfaust Operasyonu Başarısız"
 GER_operation_panzerfaust_events.08.a:0 "Çok mükemmel"
 GER_operation_panzerfaust_events.08.desc:0 "Horthy ve oğlunu başarıyla yakaladık ve ardından gücü Ferenc Szálasi'ye devrettik. Bununla Macaristan artık davaya sadık kalacaktır."
 GER_operation_panzerfaust_events.08.t:0 "Panzerfaust Operasyonu Başarılı"
 GER_operation_panzerfaust_events.09.a:0 "Şimdilik güvendeyiz"
 GER_operation_panzerfaust_events.09.desc:0 "Bugün Almanların Horthy ve oğlunu devirip kaçırmak için kurduğu bir komplonun, ajanlarının konutlarının dışında yakalanmasının ardından başarısız olduğuna dair haber aldık."
 GER_operation_panzerfaust_events.09.t:0 "Horthy'ye Karşı Komplo Engellendi"
 GER_operation_panzerfaust_events.10.a:0 "Şartlarını kabul etmek zorunda kalacağız."
 GER_operation_panzerfaust_events.10.b:0 "Asla teslim olmayacağız!"
 GER_operation_panzerfaust_events.10.desc:0 "Bugün Almanlar Kale tepesine Tanklarla girdi ve Miklós Horthy'yi ele geçirdi. Miklós Horthy Jr.'ı alıp Avusturya'ya getirdikleri söyleniyor. Teslim olmamız gerektiği, yoksa bizi zorlayacakları mesajını yayınladılar."
 GER_operation_panzerfaust_events.10.t:0 "Horthy Kaçırıldı"
 GER_opposed_the_monroe_doctrine_good:0 "Monroe Doktrini'ne Karşı Çıktı"
 GER_promised_erich_raeder_a_great_navy_tt:0 "Erich Raeder ve Kriegsmarine'in büyük bir kısmı darbe gerçekleştiğinde bizim tarafımıza katılacak. Ancak iki yıl içinde §Y$GER_rebuild_the_high_seas_fleet_ww$§!'yi veya §Y$GER_high_seas_fleet$§! ve §Y$GER_re_establish_the_seekriegsleitung$§!'i tamamlayamazsak, §RRejimimize Karşı İsyan Edebilir§!"
 GER_recalled_hans_krebs_from_russia_flag:0 "§YHans Krebs§!, §Y[SOV.GetNameDef]§!'den geri çağrıldı!"
 GER_root_is_proletarian_subject:0 "Ülkemiz artık haklı olarak işçilerin ve proletaryanın temsilcileri tarafından yönetildiği için [FROM.GetAdjective]ler bize ulaştı. Sözde Proleter Dayanışma'dan ve ülkemizi inşa etmelerine yardım etmeleri karşılığında tebaaları olarak sanayimizin bir kısmını onlara nasıl katkıda bulunmamız gerektiğinden bahsediyorlar."
 GER_root_not_proletarian_subject:0 "Ülkemiz artık haklı olarak işçilerin ve proletaryanın temsilcileri tarafından yönetildiği için [FROM.GetAdjective]ler bize ulaştı. Halklarımızın yaşamlarını iyileştirmek için komünist uluslar arasında dayanışmadan bahsediyorlar. Ülkelerimiz arasında ticarete izin vermek her iki ülkedeki işçilere de fayda sağlayabilir, ancak yine de dikkatlice inşa ettiğimiz siyasi sistemi aşındıracak kapitalist ülkelerden gelen etkileri önler."
 GER_saved_the_monroe_doctrine_bad:0 "Monroe Doktrini'ni Güçlendirdi"
 GER_seized_north_schleswig:0 "Almanya Kuzey Schleswig'i Ele Geçirdi"
 GER_shalva_maglakelidze_and_giorgi_kvinitadze_join:0 "§YGiorgi Kvinitadze§! ve §YShalva Maglakelidze§! bize bir §YMareşal§! ve bir §YGeneral§! olarak katılacak!\n"
 GER_supported_the_monroe_doctrine_good:0 "Monroe Doktrini'ni Destekledi"
 GER_thalmann_freed_from_prison_flag:0 "§YErnst Thälmann§! Hapisten kurtarıldı"
 GER_thalmann_freed_from_prison_tt:0 "§YErnst Thälmann§! komünist partizanlar tarafından hapisten kurtarıldı"
 GER_unlocks_big_ben_raid_tt:0 "§YBig Ben§! üzerinde §YHava Saldırısı§! kilidini açar!"
 GER_white_russian_exiles_divisions_recruitment_tt:0 "İki Kazak birimi ve bir Rus §YPiyade§! birimi kazan"
 GOT_GER_amerikabomber.01.a:0 "$GER_focke_wulf_organization$"
 GOT_GER_amerikabomber.01.b:0 "$GER_heinkel_organization$"
 GOT_GER_amerikabomber.01.c:0 "$GER_junkers_organization$"
 GOT_GER_amerikabomber.01.d:0 "$GER_messerschmitt_organization$"
 GOT_GER_amerikabomber.01.desc:0 "Uzun menzilli bir bombardıman uçağı inşa etme kararı çoktan verildiğinden, farklı ekiplerden tasarımlar sunuldu, her biri savaşı Atlantik'in ötesine taşıyabilecek bir makine sunma sözü veriyor, geriye kalan tek adım bu iddialı planı hayata geçirecek ekibi seçmek."
 GOT_GER_amerikabomber.01.t:0 "Amerikabomber Projesi"
 GOT_GER_fading_eagle.01.a:0 "Şimdilik izin vermeliyiz"
 GOT_GER_fading_eagle.01.b:0 "Egemenliğimizden asla vazgeçmeyeceğiz!"
 GOT_GER_fading_eagle.01.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], Balkanlar ve eski İtalyan İmparatorluğu üzerinde kontrolü yeniden kazanma kampanyasının ortasında otoritelerine boyun eğmemizi talep etti. Şu anda onlara direnecek gücümüz pek yok, ama belki de bu beklediğimiz özgürlük fırsatı olabilir?"
 GOT_GER_fading_eagle.01.t:0 "[FROM.GetNameDefCap] Boyun Eğmemizi Talep Ediyor"
 GOT_GER_fading_eagle.02.a:0 "Kontrolü yeniden kazanıyoruz!"
 GOT_GER_fading_eagle.02.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], [FROM.GetAdjective] ulusunun kendisini bize teslim edeceğini ve sonuna kadar davamıza sadık kalacağını açıkladı."
 GOT_GER_fading_eagle.02.t:0 "[FROM.GetNameDefCap] Taleplerimizi Kabul Ediyor"
 GOT_GER_fading_eagle.03.a:0 "Kararlarından pişman olacaklar"
 GOT_GER_fading_eagle.03.b:0 "Başka bir düşmanı göze alamayız"
 GOT_GER_fading_eagle.03.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], bir kez daha boyun eğmeyi kabul etmeyeceklerini ve topraklarını istiyorsak, zorla almamız gerektiğini ilan etti."
 GOT_GER_fading_eagle.03.t:0 "[FROM.GetNameDefCap] Taleplerimizi Reddediyor"
 GOT_GER_integrated_puppet_economies.01.a:0 "Bunu lehimize çevirmeliyiz"
 GOT_GER_integrated_puppet_economies.01.desc:0 "Almanlar, askeri üretimimizi daha da geliştirmek ve ekonomimizin bir kısmını entegre etmek için sanayilere yatırım yapıyor. Bu kesinlikle verimliliğimizi artıracak olsa da, özerkliğimizi ve bağımsızlığımızı da azaltacaktır."
 GOT_GER_integrated_puppet_economies.01.t:0 "[FROM.GetAdjective] Kalkınma Yardımı"
 GOT_GER_integrated_puppet_economies.02.a:0 "Bunu lehimize çevirmeliyiz"
 GOT_GER_integrated_puppet_economies.02.desc:0 "Kendi sanayi kapasitelerini güçlendirmek için, Almanlar tüm kaynaklarımızı ve verimliliğimizi kullanmak üzere bir sömürü politikası yürütüyorlar ki bu da bizi kurutacak."
 GOT_GER_integrated_puppet_economies.02.t:0 "[FROM.GetAdjective] Sömürü Programı"
 GOT_guarantee_events.01.a:0 "Polonyalılara korumamızı teklif etmeliyiz!"
 GOT_guarantee_events.01.b:0 "Bırakın [GER.GetLeader], [GER.GetLeader.GetSheHe] nasıl isterse öyle yapsın."
 GOT_guarantee_events.01.desc:0 "[GER.GetLeader] ile mantık yürütülemeyeceği ve dünya hakimiyetinden başka bir şeyle durmayacağı açıktır. [GER.GetLeader.GetSheHe], kimsenin [GER.GetNameDef]'in ve onun artan hırslarının ve toprak açlığının önünde durmaya cesaret edemeyeceğine ikna olmuştur."
 GOT_guarantee_events.01.t:0 "Polonya Egemenliğini Garanti Etmek"
 GOT_newsevents.1.a:0 "Birlikte yükseliriz"
 GOT_newsevents.1.b:0 "Bu iyiye işaret değil"
 GOT_newsevents.1.desc:0 "[FROM.GetAdjective]ler Avrupalıları bastırmayı ve kendilerini kıta üzerindeki hegemon olarak kurmayı başardılar ve yeni fethedilen toprakları entegre etmek için hamleler yaptılar. [FROM.GetAdjective] hükümeti, halkı devletin ve sosyalist ideallerin arkasında toplamaya çalıştı ve proletaryanın desteğini artırmak için birkaç pan-milliyetçi propaganda kampanyası başlattı.\n\n[FROM.GetLeader], birleşik Avrupa Proleterlerinin bundan sonra '[From.GetNameDef]' olarak bilineceğini ilan etti."
 GOT_newsevents.1.t:0 "[FROM.GetNameDef]'in Yükselişi"
 HUN_bohemia_and_silesia_tt:0 "§YÇekoslovakya§!, §YBohemya-Moravya ve Silezya Krallığı§! olarak bilinecek.\n"
 HUN_cisleithania_tt:0 "§YAvusturya§!, §Yİmparatorluk Konseyi'nde Temsil Edilen Krallıklar ve Topraklar§! olarak bilinecek.\n"
 HUN_croatia_slavonia_tt:0 "§YHırvatistan§!, §YHırvatistan-Slavonya Krallığı§! olarak bilinecek.\n"
 HUN_gombos_has_died_flag:0 "§YGyula Gömbös§! öldü"
 HUN_habsburg_refused_promises_of_peace:0 "Küçük İtilaf'a barış sözü vermeyi reddetti"
 HUN_third_mexican_empire_tt:0 "§YMeksika§!, §YÜçüncü Meksika İmparatorluğu§! olarak bilinecek.\n"
 SOV_recapture_lokot_to_destroy_the_autonomy_tt:0 "Eğer §Y[224.GetName]§!, §Y[220.GetName]§! ve §Y[222.GetName]§!'i geri alırsak, §YLokot Özerkliği§!'ni hızla dağıtabiliriz."
 WW_hungary.1.a:0 "Kesinlikle bir lütuf"
 WW_hungary.1.desc:0 "Müttefikimiz [HUN.GetNameDef], ittifakımızda ortak uçak geliştirme programı başlattı ve bu kapsamda gelecekte kendi gelişimlerini ilerletmek amacıyla bizim gelişimimize yatırım yapmaya başladı."
 WW_hungary.1.t:0 "[HUN.GetName] Müttefik Üretim Programlarını Başlatıyor"
 WW_hungary.10.a:0 "Bir tahtaları eksik..."
 WW_hungary.10.desc:0 "[FROM.GetNameDef]'deki aptal liderlik teklifimizi reddetti, bunun onlardan çok bize hizmet ettiğini ve taahhütlerimize uyacağımıza makul bir şekilde güvenemeyeceklerini açıkça belirtti... Bizi ne sanıyorlar!?"
 WW_hungary.10.t:0 "[FROM.GetNameDefCap] Korumamızı Reddediyor"
 WW_hungary.100.a:0 "Nihayet yeniden birleştik!"
 WW_hungary.100.desc:0 "[FROM.GetNameDef]'den [FROM.GetLeader] taleplerimizi kabul etti ve Székelyföld bölgesini özerk bir bölge olarak devretti. Şimdi bölgenin korunması ve geliştirilmesiyle görevliyiz."
 WW_hungary.100.t:0 "[FROM.GetName] bize bir Székelyföld Himayesi veriyor"
 WW_hungary.101.a:0 "Eylemlerinden pişman olacaklar"
 WW_hungary.101.b:0 "Yapabileceğimiz pek bir şey yok"
 WW_hungary.101.desc:0 "[FROM.GetNameDef]'den [FROM.GetLeader], özerk bir Székely himayesi taleplerimizi reddetti. Oradaki Székely halkı savunmasız ve korumasız kalıyor. Mevcut hakimlerinin onlarla çok az ilgilendiğini görerek, müdahale edip bölgeyi işgal etmeli miyiz?"
 WW_hungary.101.t:0 "[FROM.GetName] bize Székelyföld Himayemizi reddediyor"
 WW_hungary.102.a:0 "Gömbös acil durum yetkilerini üstlenmeli!"
 WW_hungary.102.desc:0 "Naip Miklós Horthy'ye karşı aylarca süren kampanya ve protestoların ardından, Tırpan Haç isyanı ve Mussolini'nin Roma yürüyüşünden esinlenen faşist hareketler şimdi başkentimize yürüdü ve Horthy'nin daha elverişli olan Gyula Gömbös'ün pozisyonunu alması için istifa etmesini talep ediyor."
 WW_hungary.102.t:0 "Budapeşte Yürüyüşü"
 WW_hungary.103.a:0 "Geri çekil ve Szálasi'yi yeni Nemzetvezető yap"
 WW_hungary.103.b:0 "Şartlarını bir koşulla kabul edeceğiz"
 WW_hungary.103.desc:0 "Ulusal liderliği ele geçirebilmek için Ulusal İrade Partisi'ni Budapeşte'ye yürümeleri için silahlandırdıktan sonra; Gömbös'ün artık onlara ihtiyacı kalmadı ve onları bastırmak için harekete geçti. Ancak bu sabah, Budapeşte'deki Sándor Sarayı'nı kuşattılar ve liderleri Ferenc Szálasi lehine istifa etmesini talep ettiler. MOVE buna karşılık şehri kuşatmak için harekete geçti ve ülke çöküşün eşiğinde. Ne yapılmalı?"
 WW_hungary.103.t:0 "Ferenc Szálasi'nin darbesi"
 WW_hungary.104.a:0 "Kan dökmeye değmez"
 WW_hungary.104.b:0 "O zaman gel de al!"
 WW_hungary.104.desc:0 "Pervasız [FROM.GetLeader], son zamanlarda belirttiği gibi, Hırvat topraklarımızdaki yasadışı işgalimizi kınadı. Şimdi, bir [FROM.GetAdjective] ültimatomu aldık ve birlikleri sınırımızda toplanıyor. Nasıl yanıt vermeliyiz?"
 WW_hungary.104.t:0 "[FROM.GetNameDefCap] Hırvatistan'ın Kontrolünü Talep Ediyor"
 WW_hungary.105.a:0 "Bu harika bir gün!"
 WW_hungary.105.desc:0 "[FROM.GetNameDef]'in makul lideri [FROM.GetLeader], Hırvatistan'daki topraklarını devretmeyi kabul etti ve birliklerine geri çekilmelerini ve bölgeden çekilmelerini söyledi. Bir kez daha zafer bizim!"
 WW_hungary.105.t:0 "[FROM.GetNameDefCap] Hırvat Topraklarını devrediyor"
 WW_hungary.106.a:0 "Kararlarından pişman olacaklar!"
 WW_hungary.106.b:0 "Bunu bırakmalıyız"
 WW_hungary.106.desc:0 "Tamamen beklenmedik olmasa da, [FROM.GetNameDef]'in aptal lideri [FROM.GetLeader], ültimatomumuzu aldıktan sonra ülkenin birliklerini yüksek alarma geçirdi ve anlaşmazlık konusunda tek bir adım bile geri atmayacaklarını belirten bir elçi gönderdi."
 WW_hungary.106.t:0 "[FROM.GetNameDefCap] Kararlı Duruyor"
 WW_hungary.108.a:0 "İzin vereceğiz"
 WW_hungary.108.b:0 "Bu uygun olmazdı"
 WW_hungary.108.desc:0 "\n[FROM.GetLeader] yönetimindeki [FROM.GetAdjective] liderliği artık bizimle yakın bir şekilde aynı çizgide olduğundan, [FROM.GetAdjective] tahtındaki şimdi sembolik olan yere bir Alman kralı taçlandırmak için talepte bulundular. Bunun için Hermann Göring'i seçtiler ve tarihçileri şimdiden eski Macar lideri Árpád ile olan bağlantısını yazmaya başladılar. [FROM.GetNameDef]'e gitmesine izin vermeli miyiz?"
 WW_hungary.108.t:0 "[FROM.GetNameDefCap] Hermann Göring'i Kral Olarak Taçlandırmak İstiyor"
 WW_hungary.109.a:0 "Minnettarız"
 WW_hungary.109.desc:0 "Büyük [GER.GetLeader], Hermann Göring'in ülkemize taşınmasına ve halkımızın yeni anayasal kralı olmasına izin verdi. Bağlarımız giderek daha da yakınlaşıyor ve nihayet taht artık boş değil."
 WW_hungary.109.t:0 "[FROM.GetLeader] Göring'in Taç Giymesine İzin Veriyor"
 WW_hungary.11.a:0 "Kan dökmeye değmez"
 WW_hungary.11.b:0 "O zaman gel de al!"
 WW_hungary.11.desc:0 "Pervasız [FROM.GetLeader], son zamanlarda belirttiği gibi, [FROM.GetAdjective] Slovakya'daki yasadışı işgalimizi kınadı. Şimdi, bir [FROM.GetAdjective] ültimatomu aldık ve birlikleri sınırımızda toplanıyor. Nasıl yanıt vermeliyiz?"
 WW_hungary.11.t:0 "[FROM.GetNameDefCap] [SLO.GetAdjective] Topraklarımızın Kontrolünü Talep Ediyor"
 WW_hungary.110.a:0 "Artık bir Krallık değil gibi görünüyor"
 WW_hungary.110.desc:0 "Paranoyak [FROM.GetLeader], sürekli rahatsız etmeye ve iyi sunulmuş argümanlara rağmen Hermann Göring'in ülkemize taşınmasına izin vermemeye karar verdi. Kralsız idare etmek zorunda kalacağız ve Szálasi'yi ulusun tek lideri yapacağız."
 WW_hungary.110.t:0 "[FROM.GetLeader] Göring'in Taç Giymesine İzin Vermiyor"
 WW_hungary.111.a:0 "Eğer halkın istediği buysa"
 WW_hungary.111.b:0 "Referandum hileliydi"
 WW_hungary.111.desc:0 "[664.GetName]'de son bir aydır, [HUN.GetNameDef]'e katılıp katılmak istemediklerine karar vermek amacıyla bir halk oylaması devam ediyor. Uluslararası gözlemciler tarafından onaylandığı için, çok fazla seçim hilesi yapılmadığını varsaymak güvenlidir. Ancak sonuçlar belli oldu, halkın büyük bir kısmı ulusumuzu terk etmek için oy kullandı. Bunu kabul etmeli miyiz?"
 WW_hungary.111.t:0 "[HUN.GetAdjective] Devletine katılmak için Referandum"
 WW_hungary.112.a:0 "Makul bir yanıt"
 WW_hungary.112.desc:0 "[FROM.GetNameDef]'deki liderlik, [664.GetName] bölgesindeki halkın kendi kaderini tayin hakkına sarsılmaz desteklerini belirten bir kamuoyu açıklaması yaptı. Bu hafta başında [FROm.GetLeader], 'Hangi devlette yaşamak istediklerini seçme zamanı geldi,' diyerek bölge üzerindeki iddialarından esasen vazgeçti."
 WW_hungary.112.t:0 "[FROM.GetNameDefCap] Referandumu Kabul Ediyor"
 WW_hungary.113.a:0 "Bunu kabul etmek zorunda kalacağız"
 WW_hungary.113.desc:0 "[FROM.GetNameDef]'deki liderlik, bu ayın başlarında [664.GetName] bölgesinde yapılan referandumların sonuçlarını gayri meşru ilan eden bir kamuoyu açıklaması yaptı ve seçmen katılımlarının ve uluslararası gözlemcilerin son derece hileli olduğunu, açıkça [ROOT.GetAdjective] hükümetine karşı bir önyargı taşıdığını belirtti."
