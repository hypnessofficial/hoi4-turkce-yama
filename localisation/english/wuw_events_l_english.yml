 WW_hungary.12.a:0 "Bu harika bir gün!"
 WW_hungary.12.desc:0 "[FROM.GetNameDef]'in makul lideri [FROM.GetLeader], Slovakya'daki topraklarını devretmeyi kabul etti ve birliklerine geri çekilmelerini ve bölgeden çekilmelerini söyledi. Bir kez daha zafer bizim!"
 WW_hungary.12.t:0 "[FROM.GetNameDefCap] [SLO.GetAdjective] Topraklarını Devrediyor"
 WW_hungary.120.a:0 "Eğer halkın istediği buysa"
 WW_hungary.120.b:0 "Referandum hileliydi"
