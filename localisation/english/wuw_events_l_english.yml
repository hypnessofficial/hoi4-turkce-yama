 AUS_GER_cannot_take_a_no:0 "[FROM.GetNameDef] üzerindeki sürekli ve artan baskıya rağmen [FROM.GetLeader], [FROM.GetLeader.GetHerHis] konumunu koruyor. Arthur Seyss-Inquart, ne dersek diyelim ne yaparsak yapalım hükümette danışman olarak görevlendirilmeyecek. Bunun etrafından dolaşmamız gerekecek ve bu da sadece küçük bir sıkıntı olacak."
