 WW_hungary.122.t:0 "[FROM.GetNameDefCap] Referandumu Gayri Meşru İlan Ediyor"
 WW_hungary.123.a:0 "Onları dağıtın ve zavallı liderlerini tutuklayın!"
 WW_hungary.123.b:0 "Ateş açın ve onları korkutup kaçırın"
 WW_hungary.123.desc:0 "Birliklerimiz, Mussolini'nin Roma yürüyüşünden büyük ölçüde etkilenen bir darbe girişiminde, radikal ulusal-sosyalist politikacı Zoltán Böszörmény'yi ve takipçilerini Budapeşte'ye yürürken durdurdu. Kendisini 'akıl devleri arasında bir dev ve peygamberlik misyonu olan büyük Macar şairi' olarak adlandıran bu marjinal siyasi aktivist, hoşnutsuz tarımcı takipçilerinden oluşan grubunu Tırpan Haç bayrağı altında topladı ve başkentimize doğru ilerliyor. Bunu nasıl ele almalıyız?"
 WW_hungary.123.t:0 "Tırpan Haç'ın Budapeşte Yürüyüşü"
 WW_hungary.124.a:0 "Bu adama bir makam verin, hemen!"
 WW_hungary.124.b:0 "Ne derse desin, ona güvenemeyiz"
 WW_hungary.124.desc:0 "Bu sabah erken saatlerde, Gori'deki yetkililer, bir zamanlar kendisine ait olduğunu iddia ettiği bir çiftlik arazisinin iadesini talep eden bir adam bildirdi, anavatanına yeni dönebildiğini ve Rus tehdidinin pençesinden kaçtığını söyledi. Ayrıca siyasete girmesine izin verilirse, ulusumuzu zafere taşıyabileceğini vaat etti, görünüşe göre başarılı politikacılar soyundan geliyormuş. Daha büyük bir Gürcistan hayallerimizi yeniden canlandırmak için ihtiyacımız olan adam bu mu?"
 WW_hungary.124.t:0 "Bir Adam Evine Geri Dönüyor"
 WW_hungary.13.a:0 "Kararlarından pişman olacaklar!"
 WW_hungary.13.b:0 "Bunu bırakmalıyız"
 WW_hungary.13.desc:0 "Tamamen beklenmedik olmasa da, [FROM.GetNameDef]'in aptal lideri [FROM.GetLeader], ültimatomumuzu aldıktan sonra ülkenin birliklerini yüksek alarma geçirdi ve anlaşmazlık konusunda tek bir adım bile geri atmayacaklarını belirten bir elçi gönderdi."
 WW_hungary.13.t:0 "[FROM.GetNameDefCap] Slovakya'da Kararlı Duruyor"
 WW_hungary.14.a:0 "Bu kazanabileceğimiz bir çatışma değil"
 WW_hungary.14.b:0 "Onların hezeyanlarını desteklemeyeceğiz"
 WW_hungary.14.desc:0 "[HUN.GetAdjective] hükümeti, Voyvodina'nın İmparatorluk döneminde Macaristan'ın bir parçası olduğunu ve bu nedenle iade edilmesi gerektiğini belirterek, Voyvodina konusunda daha fazla baskı uygulamaya başladı. Büyük Savaş'ın sonunda Sırbistan ile birleşmenin \"dış baskı nedeniyle geçersiz\" olduğunu ve bu nedenle bölgenin hala yasal olarak [HUN.GetAdjective] olduğunu iddia ediyorlar."
 WW_hungary.14.t:0 "[FROM.GetNameDefCap] Voyvodina'yı talep ediyor"
 WW_hungary.15.a:0 "Harika"
 WW_hungary.15.desc:0 "\n[FROM.GetNameDef], Voyvodina'yı bize devretmeyi kabul etti. Kuvvetlerimiz bölgenin tam kontrolünü ele aldı ve entegrasyonun derhal başlaması planlanıyor."
 WW_hungary.15.t:0 "[FROM.GetNameDefCap] Voyvodina'yı Devrediyor"
 WW_hungary.16.a:0 "Belki de öyledir"
 WW_hungary.16.b:0 "Bu günden pişman olacaklar"
 WW_hungary.16.desc:0 "[FROM.GetLeader] ile gergin bir toplantıda, heyetimize Voyvodina'nın egemenliğinin tartışmaya açık olmadığı ve her halükarda [FROM.GetAdjective] hükümetinin böyle bir baskıya asla boyun eğmeyeceği söylendi. Voyvodina halkı 1919'da sözünü söyledi ve o zaman bize katılmamayı seçti. [FROM.GetAdjective] hükümetine göre, meselenin sonu budur."
 WW_hungary.16.t:0 "[From.GetNameDefCap] Taleplerimizi Reddediyor"
 WW_hungary.17.a:0 "Alabilirler"
 WW_hungary.17.b:0 "Kim olduklarını sanıyorlar?"
 WW_hungary.17.desc:0 "[HUN.GetNameDef]'den [HUN.GetLeader], bugün bize Batı Banat bölgesinin [HUN.GetName] tarafından işgal edilmesini talep eden bir ültimatom gönderdi. [HUN.GetLeader]'in taleplerine uymazsak, elimizde bir askeri çatışma olması muhtemeldir."
 WW_hungary.17.t:0 "[HUN.GetName] Batı Banat'ın İşgalini Talep Ediyor"
 WW_hungary.18.a:0 "Her şey plana uygun"
 WW_hungary.18.desc:0 "[FROM.GetNameDef]'den [FROM.GetLeader], Batı Banat'ın işgali taleplerimizi nazikçe kabul etti ve ardından bölgeyi bize devretti. Bize karşı durmaktansa bizi yatıştırmayı tercih ediyorlar, bu da İtalya'nın Balkanlar'daki hedeflerine daha da yardımcı olacaktır."
 WW_hungary.18.t:0 "[FROM.GetNameDefCap] Taleplerimizi Kabul Ediyor"
 WW_hungary.19.a:0 "O zaman zorla"
 WW_hungary.19.desc:0 "[FROM.GetNameDef]'in aptal lideri [FROM.GetLeader] bize haklı toprağımızı vermedi ve şimdi [FROM.GetNameDef]'i tek bir hızlı saldırıyla devirme zamanı geldi. Bu, yakın gelecek için Batı Banat üzerindeki iddialarımızı kesinlikle güvence altına alacaktır."
 WW_hungary.19.t:0 "Aptal [FROM.GetLeader] Ültimatomumuzu Reddetti"
 WW_hungary.2.a:0 "Harika!"
 WW_hungary.2.desc:0 "[FROM.GetAdjective] hükümeti, savaş çabalarımızda ülkemiz için açık bir tavır aldı. Yeni desteklerinin bir parçası olarak bize silah sevkiyatları gönderdiler. Bu, bu savaşta bize kesinlikle yardımcı olacaktır."
 WW_hungary.2.t:0 "[FROM.GetAdjective] Silah Sevkiyatları Geliyor"
 WW_hungary.20.a:0 "Bu kazanabileceğimiz bir çatışma değil"
 WW_hungary.20.b:0 "Gerçekten ifadelerinin arkasında durabilirler mi?"
 WW_hungary.20.desc:0 "[HUN.GetAdjective] hükümeti, Karpat Rutenyası meselesi üzerinde daha fazla baskı uygulamaya başladı ve İmparatorluk döneminde Macaristan'ın bir parçası olduğunu ve bu nedenle iade edilmesi gerektiğini belirtti. Hutsul Cumhuriyeti'nin ve bölgedeki tüm halef devletlerin gayri meşru olduğunu ve adaletsizliğin ancak bölge bir kez daha [HUN.GetAdjective] olduğunda giderilebileceğini iddia ediyorlar."
 WW_hungary.20.t:0 "[FROM.GetNameDefCap] Karpat Rutenyası'nı talep ediyor"
 WW_hungary.21.a:0 "Harika"
 WW_hungary.21.desc:0 "[FROM.GetNameDef]'in makul lideri [FROM.GetLeader], Karpat Rutenyası'ndaki topraklarını devretmeyi kabul etti ve birliklerine geri çekilmelerini ve bölgeden çekilmelerini söyledi. Bir kez daha zafer bizim!"
 WW_hungary.21.t:0 "[FROM.GetNameDefCap] Karpat Rutenyası'nı Devrediyor"
 WW_hungary.22.a:0 "Kararlarından pişman olacaklar!"
 WW_hungary.22.b:0 "Bunu bırakmalıyız"
 WW_hungary.22.desc:0 "Tamamen beklenmedik olmasa da, [FROM.GetNameDef]'in aptal lideri [FROM.GetLeader], ültimatomumuzu aldıktan sonra ülkenin birliklerini yüksek alarma geçirdi ve Karpat Rutenyası'ndaki anlaşmazlık konusunda tek bir adım bile geri atmayacaklarını belirten bir elçi gönderdi."
 WW_hungary.22.t:0 "[From.GetNameDefCap] Taleplerimizi Reddediyor"
 WW_hungary.23.a:0 "Bu kazanabileceğimiz bir çatışma değil"
 WW_hungary.23.b:0 "Gerçekten ifadelerinin arkasında durabilirler mi?"
 WW_hungary.23.desc:0 "[HUN.GetAdjective] hükümeti, Burgenland meselesi üzerinde daha fazla baskı uygulamaya başladı ve İmparatorluk döneminde Macaristan'ın bir parçası olduğunu ve bu nedenle iade edilmesi gerektiğini belirtti. Lajtabánság'ın bölgede yeniden kurulması gerektiğini ve yönetimimizin gayri meşru olduğunu iddia ediyorlar. Nasıl yanıt vermeliyiz?"
 WW_hungary.23.t:0 "[FROM.GetNameDefCap] Burgenland'ı talep ediyor"
 WW_hungary.24.a:0 "Harika"
 WW_hungary.24.desc:0 "[FROM.GetNameDef]'in makul lideri [FROM.GetLeader], Burgenland'daki topraklarını devretmeyi kabul etti ve birliklerine geri çekilmelerini ve bölgeden çekilmelerini söyledi. Bir kez daha zafer bizim!"
 WW_hungary.24.t:0 "[FROM.GetNameDefCap] Burgenland'ı Devrediyor"
 WW_hungary.25.a:0 "Kararlarından pişman olacaklar!"
 WW_hungary.25.b:0 "Bunu bırakmalıyız"
 WW_hungary.25.desc:0 "Tamamen beklenmedik olmasa da, [FROM.GetNameDef]'in aptal lideri [FROM.GetLeader], ültimatomumuzu aldıktan sonra ülkenin birliklerini yüksek alarma geçirdi ve Burgenland'daki anlaşmazlık konusunda tek bir adım bile geri atmayacaklarını belirten bir elçi gönderdi."
 WW_hungary.25.t:0 "[From.GetNameDefCap] Taleplerimizi Reddediyor"
 WW_hungary.26.a:0 "Bize katılmalarından memnuniyet duyarız"
 WW_hungary.26.b:0 "Onlara ihtiyacımız yok"
 WW_hungary.26.desc:0 "[FROM.GetLeader], büyük başkentimize bir ziyaretin ardından bize yaklaşarak, tüm [FROM.GetAdjective] halkı adına konuştuğunu iddia ederek, her iki ulusumuzun da hem [ROOT.GetAdjective] hem de [FROM.GetAdjective] uluslarının topraklarını daha da genişletme hedefiyle askeri bir ittifakta birleşmesini diledi."
 WW_hungary.26.t:0 "[FROM.GetNameDefCap] İttifakımıza Katılmak İstiyor"
 WW_hungary.27.a:0 "Geleceğimizi birlikte inşa edelim!"
 WW_hungary.27.desc:0 "[FROM.GetNameDef]'in büyük lideri [FROM.GetLeader], uluslarımız arasındaki zaten var olan bağlantıyı güçlendiren yeni bir askeri ittifak kurmayı kabul etti. Halkımız bu önemli olayı kutlamak için sokaklara döküldü, çünkü bu [ROOT.GetAdjective] devletinin yeniden doğuşunu ve halkı için yeni bir dönemin başlangıcını işaret ediyor."
 WW_hungary.27.t:0 "[FROM.GetNameDefCap] Onlara Katılmamıza İzin Veriyor"
 WW_hungary.28.a:0 "Kaderde yokmuş"
 WW_hungary.28.desc:0 "[FROM.GetNameDef]'in aşağılık lideri [FROM.GetLeader] talebimizi reddetti ve yakın gelecekte devletlerimiz arasında işbirliği için tüm fırsatları esasen engelledi. Bu nedenle başka ittifaklar aramak veya kendi başımıza durmak zorunda kalacağız."
 WW_hungary.28.t:0 "[FROM.GetNameDefCap] Onlara Katılmamıza İzin Vermiyor"
 WW_hungary.29.a:0 "Diplomatik Protesto Yayınla"
 WW_hungary.29.b:0 "Ambargo ve Protesto Yayınla"
 WW_hungary.29.desc:0 "[FROM.GetNameDef]'deki hükümet, 1713 Pragmatik Yaptırımı'nı yeniden yürürlüğe koyma niyetini açıkladı, bu da bir Habsburg'un tahtlarına geçmesine bir kez daha etkin bir şekilde izin veriyor ve Büyük Savaş'tan sonraki taleplerimize karşı geliyor. Bunun için savaşa girmeyi gerçekten haklı çıkaramayız, ancak yakında bize bir tehdit oluşturabilecekleri için, belki de üzerlerinde baskı kurmaya çalışmalıyız?"
 WW_hungary.29.t:0 "[FROM.GetNameDefCap] Habsburg Yönetimini Geri Getirecek"
 WW_hungary.3.a:0 "MOVE'yi entegre etmeye çalışmalıyız"
 WW_hungary.3.b:0 "Bu Szeged Faşistlerini derhal dağıtın!"
 WW_hungary.3.c:0 "Bırakın serbestçe dolaşsınlar. En kötü ne olabilir ki?"
 WW_hungary.3.desc:0 "Başbakanımız, askeri subay ve Macar Ulusal Savunma Derneği lideri Gyula Gömbös'ün, Münih'te bir diplomatik görevdeyken testis kanserinden vefat ettiği bildirildi. [ROOT.GetLeader]'in aklında zaten yeni bir Başbakan olsa da, yani merkezci Kálmán Darányi, daha önce Gömbös'ün kendisi tarafından yönetilen faşist paramiliter örgütle ne yapılacağı sorusu hala devam ediyor. Onların ve [ROOT.GetLeader]'in ortak anti-komünist duruşu nedeniyle, onları bizim için çalışmaya ikna etmek mümkün olabilir, ancak gerçek sadakatlerinin nerede olduğunu bilmemek, onları silahlı kuvvetlerimize dahil edersek gelecekte bizim için tehlikeli olabilir. MOVE konusunda nasıl ilerlemeliyiz?"
 WW_hungary.3.t:0 "Başbakan Gyula Gömbös'ün Ölümü"
 WW_hungary.30.a:0 "Saldırmazlık sözü verebiliriz. Şimdilik..."
 WW_hungary.30.b:0 "Bizi bunu yapmaya zorlayamazlar!"
 WW_hungary.30.desc:0 "Küçük İtilaf güçleri, IV. Karl'ın 1921'de Habsburg monarşisini restore etme girişimini hafife almadı ve hala böyle bir eylemin yapılmasına izin vermiyorlar. Ancak bu sefer, bizi bu konuda savaşla tehdit etmediler, bunun yerine barışçıl niyetlerimizi göstermemizi talep ettiler, aksi takdirde monarşimizi kesin olarak sona erdirmeleri gerekebilir."
 WW_hungary.30.t:0 "Küçük İtilaf Barış Sözleri İstiyor"
 WW_hungary.31.a:0 "Gerçekten de"
 WW_hungary.31.desc:0 "[FROM.GetNameDefCap], ulusumuzun yeni Palatini olarak Joesph August von Habsburg'u atadı. Bu, rejimimizi kesinlikle güçlendirecektir."
 WW_hungary.31.t:0 "[FROM.GetNameDefCap] Bize Yeni Bir Hükümdar Atıyor"
 WW_hungary.32.a:0 "Haklılar"
 WW_hungary.32.b:0 "Habsburglar bir nedenle sürgün edildi!"
 WW_hungary.32.desc:0 "[FROM.GetNameDefCap] İmparatoru [FROM.GetLeader], Cisleithania topraklarını geri vermemizi ve bir kez daha kendi hükümdarımız olarak bir Habsburg'u taçlandırmamızı talep etti. Bu, esasen bağımsızlığımızı sona erdirecek, ancak bizi tam bir ilhaktan kurtarabilir. Yeni imparatorluk federasyonunda bir yer kabul ediyor muyuz?"
 WW_hungary.32.t:0 "[FROM.GetLeader] Habsburg Yönetimini Geri Getirmemizi Talep Ediyor"
 WW_hungary.33.a:0 "Doğru seçimi yaptılar"
 WW_hungary.33.desc:0 "[FROM.GetNameDef]'deki bilge liderlik, taleplerimize uygun olarak bir Habsburg hükümdarını taçlandırmaya ve yeni krallarının yerine çekilmeye karar verdi. İmparatorluk federasyonumuzda yeni bir şafak sökecek!"
 WW_hungary.33.t:0 "[FROM.GetNameDefCap] Bir Habsburg Hükümdarını Kabul Ediyor"
 WW_hungary.34.a:0 "Yanlış seçimi yaptılar"
 WW_hungary.34.desc:0 "[FROM.GetNameDef]'deki çökmekte olan liderlik, pozisyonlarından çekilmemeye karar verdi ve bir şekilde tanrının kendisi tarafından seçilen bir hükümdardan daha bilge olduklarına inanıyorlar. Beğenseler de beğenmeseler de onları devirecek ve Joseph August'u tahtlarına oturtacağız!"
 WW_hungary.34.t:0 "[FROM.GetNameDefCap] Bir Habsburg Hükümdarını Reddediyor"
 WW_hungary.35.a:0 "Bize katılmalarından memnuniyet duyarız"
 WW_hungary.35.b:0 "Onlara ihtiyacımız yok"
 WW_hungary.35.desc:0 "[FROM.GetLeader], büyük başkentimize bir ziyaretin ardından bize yaklaşarak, tüm [FROM.GetAdjective] halkı adına konuştuğunu iddia ederek, her iki ulusumuzun da hem [ROOT.GetAdjective] hem de [FROM.GetAdjective] uluslarının topraklarını daha da genişletme hedefiyle askeri bir ittifakta birleşmesini diledi."
 WW_hungary.35.t:0 "[FROM.GetNameDefCap] İttifakımıza Katılmak İstiyor"
 WW_hungary.36.a:0 "Geleceğimizi birlikte inşa edelim!"
 WW_hungary.36.desc:0 "[FROM.GetNameDef]'in büyük ve onurlu lideri [FROM.GetLeader], uluslarımız arasındaki zaten var olan bağlantıyı güçlendiren yeni bir askeri ittifak kurmayı kabul etti. Halkımız bu önemli olayı kutlamak için sokaklara döküldü, çünkü bu [ROOT.GetAdjective] devletinin yeniden doğuşunu ve halkı için yeni bir dönemin başlangıcını işaret ediyor."
 WW_hungary.36.t:0 "[FROM.GetNameDefCap] İttifak Devletleri'ni Geri Getiriyor"
 WW_hungary.37.a:0 "Kaderde yokmuş"
 WW_hungary.37.desc:0 "[FROM.GetNameDef]'in aşağılık lideri [FROM.GetLeader] talebimizi reddetti ve yakın gelecekte devletlerimiz arasında işbirliği için tüm fırsatları esasen engelledi. Bu nedenle başka ittifaklar aramak veya kendi başımıza durmak zorunda kalacağız."
 WW_hungary.37.t:0 "[FROM.GetNameDefCap] Bizi Onursuzlandırıyor"
 WW_hungary.38.a:0 "Asla yalnız kalmayacaklar"
 WW_hungary.38.b:0 "Onlar sadece bir yük"
 WW_hungary.38.desc:0 "[FROM.GetLeader], başkentimize bir ziyaretin ardından bize yaklaşarak, tüm [FROM.GetAdjective] halkı adına konuştuğunu iddia ederek, her iki ulusumuzun da bir kez daha hem [ROOT.GetAdjective] hem de [FROM.GetAdjective] uluslarının topraklarını daha da genişletme hedefiyle askeri bir ittifakta birleşmesini diledi. Dilekçelerine nasıl yanıt vermeliyiz?"
 WW_hungary.38.t:0 "[FROM.GetNameDefCap] Bizi İttifak Devletleri'ne Davet Ediyor"
 WW_hungary.39.a:0 "Büyük Savaş'ın hatalarını düzeltelim!"
 WW_hungary.39.desc:0 "[FROM.GetNameDef]'in büyük ve onurlu lideri [FROM.GetLeader], yeni askeri ittifakımıza katılmayı kabul ederek uluslarımız arasındaki zaten var olan bağı güçlendirdi. Halkımız bu önemli olayı kutlamak için sokaklara döküldü, çünkü bu [ROOT.GetAdjective] devletinin yeniden doğuşunu ve halkı için yeni bir dönemin başlangıcını işaret ediyor."
 WW_hungary.39.t:0 "[FROM.GetNameDefCap] İttifak Devletleri'ne Katılıyor"
 WW_hungary.4.a:0 "Boş ver, alabilirler..."
 WW_hungary.4.b:0 "Yoksa... ne?"
 WW_hungary.4.desc:0 "Transilvanya, Trianon Antlaşması'nda onlardan alınmadan önce uzun süre [HUN.GetNameDef]'in bir parçasıydı. Ne yazık ki, [HUN.GetNameDef] topraklarının kaybını hiçbir zaman atlatamadı. Çeşitli zamanlarda, Transilvanya'yı uluslarının ayrılmaz bir parçası olarak kamuoyuna açıkladılar. Siyasi durumdaki son değişikliklerle birlikte, bir kez daha iddialarını ilerletmeye karar verdiler ve tüm Transilvanya'yı onlara devretmemizi talep ediyorlar... yoksa."
 WW_hungary.4.t:0 "[HUN.GetNameDefCap] Transilvanya'yı Talep Ediyor"
 WW_hungary.40.a:0 "O zaman biz liderlik edeceğiz!"
 WW_hungary.40.b:0 "Farklı bir yaklaşım denemeliyiz"
 WW_hungary.40.desc:0 "[FROM.GetNameDef]'in aşağılık lideri [FROM.GetLeader] talebimizi reddederek, yakın gelecekte devletlerimiz arasında işbirliği için tüm fırsatları esasen engelledi. Bizimle bir ittifaka katılmaya istekli olmadıkları için başka ittifaklar aramak zorunda kalacağız."
 WW_hungary.40.t:0 "[FROM.GetNameDefCap] Bizi Onursuzlandırıyor"
 WW_hungary.41.a:0 "Bize katılmalarından memnuniyet duyarız"
 WW_hungary.41.b:0 "Onlara ihtiyacımız yok"
 WW_hungary.41.desc:0 "[FROM.GetLeader], büyük başkentimize bir ziyaretin ardından bize yaklaşarak, tüm [FROM.GetAdjective] halkı adına konuştuğunu iddia ederek, her iki ulusumuzun da hem [ROOT.GetAdjective] hem de [FROM.GetAdjective] uluslarının topraklarını daha da genişletme hedefiyle askeri bir ittifakta birleşmesini diledi."
 WW_hungary.41.t:0 "[FROM.GetNameDefCap] Büyük İttifak'ı Geri Getirmek İstiyor"
 WW_hungary.42.a:0 "Geleceğimizi birlikte koruyalım!"
 WW_hungary.42.desc:0 "[FROM.GetNameDef]'in büyük ve onurlu lideri [FROM.GetLeader], yeni bir askeri ittifak kurmayı kabul etti. Halkımız bu önemli olayı kutlamak için sokaklara döküldü, çünkü bu [ROOT.GetAdjective] devletinin yeniden doğuşunu ve halkı için yeni bir dönemin başlangıcını işaret ediyor."
 WW_hungary.42.t:0 "[FROM.GetNameDefCap] Büyük İttifak'ı Onurlandırıyor"
 WW_hungary.43.a:0 "Sadece aileye gerçekten güvenebilirsin"
 WW_hungary.43.desc:0 "[FROM.GetNameDef]'in aşağılık lideri [FROM.GetLeader] talebimizi reddederek, yakın gelecekte devletlerimiz arasında işbirliği için tüm fırsatları esasen engelledi. Bu nedenle başka ittifaklar aramak veya kendi başımıza durmak zorunda kalacağız."
