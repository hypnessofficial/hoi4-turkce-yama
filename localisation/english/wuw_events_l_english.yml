 wuw_GER_realpolitik.56.b:0 "Bunu bırakmalıyız..."
 wuw_GER_realpolitik.56.desc:0 "Tamamen beklenmedik olmasa da, [FROM.GetNameDef]'in aptal lideri [FROM.GetLeader], ültimatomumuzu aldıktan sonra ülkenin birliklerini yüksek alarma geçirdi ve anlaşmazlık konusunda tek bir adım bile geri atmayacaklarını belirten bir elçi gönderdi."
 wuw_GER_realpolitik.56.t:0 "[FROM.GetNameDefCap] Kararlı Duruyor"
 wuw_GER_realpolitik.57.a:0 "Durumu kabul etmek zorunda kalacağız"
 wuw_GER_realpolitik.57.b:0 "Ya zafer ya ölüm!"
 wuw_GER_realpolitik.57.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], başlangıçta vaat edilenden bir adım daha ileri gitti ve yollarından sapmamamızı sağlamak için ekonomilerine olan bağımlılığımızı daha da artırmak üzere piyasaları manipüle ediyor. Onlardan derhal ayrılmazsak, bu pratik olarak bağımsız bir ulus olarak statümüzün sonu olacaktır. Bu konuda nasıl bir yol izlemeliyiz?"
 wuw_GER_realpolitik.57.t:0 "[FROM.GetNameDefCap] Ekonomimizi Entegre Ediyor"
 wuw_GER_realpolitik.58.a:0 "Harika!"
 wuw_GER_realpolitik.58.desc:0 "[FROM.GetNameDef]'deki liderliğin bizimle daha fazla entegre olmayı kabul ettiği şanlı haber, bugün erken saatlerde Reichstag'da büyük bir alkışla karşılandı. Sunabileceğimiz şey, egemenliklerine hafif bir darbe vurmasına rağmen teklifi avantajlı görmeleri için açıkça yeterliydi."
 wuw_GER_realpolitik.58.t:0 "[FROM.GetNameDefCap] Daha Fazla Entegrasyonu Kabul Ediyor"
 wuw_GER_realpolitik.59.a:0 "Konfederasyonun birliği için bir risk oluşturuyorlar!"
 wuw_GER_realpolitik.59.b:0 "Onları yakından izleyeceğiz"
 wuw_GER_realpolitik.59.desc:0 "Bariz avantajlara ve bunun birliğin en iyisi olmasına rağmen, [FROM.GetNameDef] daha fazla entegrasyon teklifimizi reddetti. Nedenleri hakkında sadece spekülasyon yapılabilir, ama görünüşe göre birliğin en iyi çıkarlarını düşünmüyor olabilirler."
 wuw_GER_realpolitik.59.t:0 "[FROM.GetNameDefCap] Daha Fazla Entegrasyonu Reddediyor"
 wuw_GER_realpolitik.6.a:0 "Onları durdurmak için yapabileceğimiz pek bir şey yok..."
 wuw_GER_realpolitik.6.b:0 "Özgürlüğümüzden asla vazgeçmeyeceğiz!"
 wuw_GER_realpolitik.6.desc:0 "[FROM.GetNameDef]'in lideri [FROM.GetLeader], Brest-Litovsk antlaşmasında başlangıçta belirtildiği gibi, yönetimlerine boyun eğmemizi ve ulusları içinde özerk bir bölge olmamızı talep etti. Taleplerine boyun eğmeli miyiz?"
 wuw_GER_realpolitik.6.t:0 "[FROM.GetNameDefCap] İlhakımızı Talep Ediyor"
 wuw_GER_realpolitik.60.a:0 "Durumu kabul etmek zorunda kalacağız"
 wuw_GER_realpolitik.60.b:0 "Ya zafer ya ölüm!"
 wuw_GER_realpolitik.60.desc:0 "Ekonomilerimizi entegre etmek görünüşe göre [FROM.GetAdjective]leri tatmin etmeye yetmedi, çünkü [FROM.GetNameDef]'in lideri [FROM.GetLeader] bugün başlangıçta vaat edilenden bir adım daha ileri gitti ve şimdi uluslarına tam entegrasyonumuzu talep ediyor. Onlardan derhal ayrılmazsak, bu bağımsız bir ulus olarak statümüzün sonu olacaktır. Bu konuda nasıl bir yol izlemeliyiz?"
 wuw_GER_realpolitik.60.t:0 "[FROM.GetNameDefCap] Tam Entegrasyon Talep Ediyor"
 wuw_GER_realpolitik.61.a:0 "Harika!"
 wuw_GER_realpolitik.61.desc:0 "[FROM.GetNameDef]'deki liderliğin ulusumuza entegre olmayı kabul ettiği şanlı haber, bugün erken saatlerde Reichstag'da büyük bir alkışla karşılandı. Sunabileceğimiz şey, egemenliklerinin sona ermesine rağmen teklifi avantajlı görmeleri için açıkça yeterliydi."
 wuw_GER_realpolitik.61.t:0 "[FROM.GetNameDefCap] Tam Entegrasyonu Kabul Ediyor"
