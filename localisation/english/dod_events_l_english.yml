l_english:
 DOD_hungary.1.a:0 "Bırakın halk sözünü söylesin."
 DOD_hungary.1.b:0 "Bu tür işler profesyonellere bırakılmalı."
 DOD_hungary.1.c:0 "Doğru sonuçları garantileyeceğiz."
 DOD_hungary.1.desc:0 "Budapeşte'de yaptığı bir konuşmada [HUN.GetLeader], Avusturyalı tebaasının kendi yönetimine dönmesine izin verilmesini talep etti. Ancak bir uzlaşma jesti olarak, Avusturya halkının bu seçimi kendilerinin yapmasına izin verilmesi gerektiğini kamuoyuna duyurdu."
 DOD_hungary.1.t:0 "Macaristan referandum talep ediyor"
 DOD_hungary.10.a:0 "İmparatorluğa geri döneceğiz."
 DOD_hungary.10.b:0 "Uzlaşmayı kabul edeceğiz."
 DOD_hungary.10.c:0 "Güvenlik için özgürlüğümüzden asla vazgeçmeyeceğiz!"
 DOD_hungary.10.desc:0 "Balkanların siyasi manzarasındaki son dramatik değişimlerle birlikte, yeni Avusturya-Macaristan İmparatorluğu ile ilişkimiz sorusu defalarca gündeme geldi. Bugün, Macar büyükelçisi resmi bir nota vererek İmparatorluğa karşı pozisyonumuzu ilan etmemizi resmen talep etti. Habsburglar, eski taç toprakları olarak Bohemya ve Moravya'nın kendilerine ait olduğunu iddia ediyor. \n\nAncak, [HUN.GetLeader] kendisinin nominal olarak devlet başkanı olacağı, ancak çok az gerçek güce sahip olacağı bir uzlaşma çözümünü kabul edeceğini belirtti."
 DOD_hungary.10.t:0 "Avusturya-Macaristan Garanti Teklif Ediyor"
 DOD_hungary.100.a:0 "Başka seçeneğimiz yok."
 DOD_hungary.100.b:0 "Bir santim bile vermeyeceğiz."
 DOD_hungary.100.desc:0 "Macar hükümeti, Slovakya'nın gelecekteki statüsü hakkında bize başvurdu. Slovakya'nın İmparatorluk günlerinde Macaristan'ın bir parçası olduğunu görerek, Slovakya'nın kaderi üzerinde tam kontrole sahip olmaları gerektiğine şiddetle inanıyorlar.\n\nMacar delegasyonu herhangi bir açık tehditten kaçınırken, istihbarat servisimiz Macar ordusu içinde rahatsız edici miktarda bir faaliyet bildiriyor."
 DOD_hungary.100.t:0 "Macaristan Slovakya'yı talep ediyor"
 DOD_hungary.101.a:0 "Eski sınırlarımıza geri döneceğiz."
 DOD_hungary.101.b:0 "Bir kukla hükümet tercih edilir."
 DOD_hungary.101.desc:0 "Slovakya kontrolümüze döndü. Şimdi soru bunu nasıl organize etmemiz gerektiğidir. Hükümetteki pek çok kişi doğrudan ilhakı destekleyerek bunu \"Tarihi sınırlara dönüş\" olarak adlandırırken, bazıları da Macar olmayan bu kadar çok insanı devletimize entegre etmeye çalışmanın yaratacağı etkilerden endişe duyuyor. Tercih ettikleri seçenek, Bratislava'da, iç politikaları üzerinde bazı yetkilere sahip, ancak diğer tüm konularda bizimle yakın işbirliği içinde olan, devredilmiş bir hükümet kurmak olacaktır."
 DOD_hungary.101.t:0 "Slovakya devredildi"
 DOD_hungary.102.a:0 "Konuyu bırak gitsin."
 DOD_hungary.102.b:0 "Ülkeyi bölmek için Almanya'ya başvur."
 DOD_hungary.102.desc:0 "Slovakya'nın devri hakkındaki müzakereler neredeyse anında durdu. [From.GetAdjective] heyeti, pozisyonlarının esasen statüko olduğunu ve önerilen büyük bir değişiklik olmadığını belirtti. Bizim delegasyonumuz ise, elbette, Slovakya'yı Büyük Savaş sonunda yasa dışı olarak ele geçirilen toprağımız olarak gördüğümüzü yeniden ifade etti.\n\nHiçbir ilerleme kaydedilmedi ve masanın her iki tarafındaki artan hayal kırıklığı, herhangi bir ilerleme kaydedilmesini olası kılmıyor."
 DOD_hungary.102.t:0 "[From.GetNameDefCap] Slovakya'yı devretmeyi reddediyor"
 DOD_hungary.103.a:0 "Onların çıkarlarını göz önünde bulunduracağız."
 DOD_hungary.103.b:0 "Hiçbir şey alamazlar."
 DOD_hungary.103.desc:0 "Macar hükümeti, [CZE.GetNameDef]'i bölme teklifiyle bize başvurdu. Ülkenin batı kısımlarını biz alırken, Macaristan Slovakya'nın çoğunu alacak ve ülkelerimiz arasındaki sınır hattı ülkeyi kabaca ikiye bölecekti. \n\nSonunda kendi paylarını aldıkları sürece, ilk hamleyi yapmamıza izin vermeye istekli olduklarını bize temin ettiler."
 DOD_hungary.103.t:0 "Macaristan [CZE.GetNameDef]'i bölmek istiyor"
 DOD_hungary.104.a:0 "Güzel."
 DOD_hungary.104.desc:0 "Gizli bir telgrafta, Alman hükümeti [CZE.GetNameDef]'in kaderi kararlaştırıldığında çıkarlarımızın dikkate alınacağını bize temin etti. Bunun ne zaman olacağı hala bilinmiyor."
 DOD_hungary.104.t:0 "[GER.GetLeader] kabul ediyor"
 DOD_hungary.105.a:0 "Ne kadar kaba."
 DOD_hungary.105.b:0 "Bizim olanı alacağız."
 DOD_hungary.105.desc:0 "\n[CZE.GetNameDef]'yi bölme teklifimizi duyunca, [From.GetLeader]'nin öfkeye kapıldığı ve bizi \"dünyanın gerçekleri hakkında en ufak bir fikri olmayan eskiler\" olarak adlandırdığı bildirildi. \n\nSöylemeye gerek yok, teklifimiz kabul görmedi."
 DOD_hungary.105.t:0 "Almanya [CZE.GetName]'i bölmeyi reddediyor"
 DOD_hungary.106.a:0 "Mümkün olan en sert şekilde protesto edin."
 DOD_hungary.106.b:0 "Orduyu seferber edin."
 DOD_hungary.106.desc:0 "[From.GetLeader]'in yazılı sözüne rağmen, Alman hükümeti bize olan taahhütlerini yerine getirmedi. [CZE.GetNameDef]'in kaderi hakkındaki son müzakerelerde, başkalarını uymaya zorlamak için bir araç olmaktan başka bir rol oynamadık. Görünüşe göre [From.GetLeader] sözünü tutmayı hiç düşünmemiş."
 DOD_hungary.106.t:0 "[From.GetLeader] sözünden dönüyor"
 DOD_hungary.107.a:0 "Pekala."
 DOD_hungary.107.b:0 "Söz konusu bile olamaz."
 DOD_hungary.107.desc_SLO_independent:0 "Macar ordusundaki birkaç haftalık hummalı faaliyetin ardından, [HUN.GetLeader] Slovakya'daki mevcut durumun Macaristan için ciddi bir endişe kaynağı olduğunu ilan eden ve bizden belirli garantiler talep eden bir bildiri yayınladı. \n\nDiğer şeylerin yanı sıra, herhangi bir ittifaka girmeden veya herhangi bir antlaşma imzalamadan önce onlara danışmamız ve ordumuzu koordine etmek için bir askeri misyonu kabul etmemiz gerekecekti."
 DOD_hungary.107.desc_SLO_puppet:0 "Slovakya meselesini görüşmek üzere bir Macar heyeti geldi. Ülkeyi kendi tarihi nüfuz alanlarında görüyorlar ve Slovakya politikası üzerindeki etkimizden büyük endişe duyuyorlar.\n\nHeyetin lideri, Slovakya topraklarının Macaristan'a bir işgal başlatmak için bir sıçrama tahtası olarak kullanılabileceğini öne sürecek kadar ileri gitti.\n\nMacar hükümetinin, şu anda bizim sahip olduğumuz kadar Slovakya üzerinde bir etkiye sahip olmasına izin verilmesini öneriyorlar."
 DOD_hungary.107.t:0 "Macaristan Hakimiyet Talep Ediyor"
 DOD_hungary.108.a:0 "Güzel."
 DOD_hungary.108.desc:0 "Tam Yetkili Temsilcimiz Bratislava'ya yerleşerek Slovakya hükümetinin politikalarını bizimkilerle yakından uyumlu hale getirmesini sağladı."
 DOD_hungary.108.t:0 "Slovakya kontrolümüz altında"
 DOD_hungary.109.a:0 "Öyle ya da böyle, onu alacağız."
 DOD_hungary.109.desc:0 "Tüm çabalarımıza rağmen, Slovakya hükümeti bize kıyasla itaatkar rollerini kabul etmeyi reddetti. Şimdi kuzey sınırımızı güvence altına almak için askeri harekat olasılığını düşünmeliyiz."
 DOD_hungary.109.t:0 "Slovakya üzerindeki kontrol reddedildi"
 DOD_hungary.11.a:0 "Doğuştan gelen hakkımızı geri alma yolunda bir adım daha."
 DOD_hungary.11.desc:0 "Gece geç saatlere kadar süren en üst düzeydeki tartışmaların ardından, [CZE.GetAdjective] hükümeti teklifimizi kabul etmeye karar verdi ve [HUN.GetLeader]'ı Bohemya Kralı ve Moravya Margravı ilan etti. Eski Çek Ordusu askerleri yeni Kralları ve İmparatorlarına yemin etti ve krallıkların sivil yönetimi tamamen entegre edildi."
 DOD_hungary.11.t:0 "Bohemya Taca Geri Dönüyor"
 DOD_hungary.110.a:0 "Mükemmel bir öneri, yoldaşlar!"
 DOD_hungary.110.b:0 "Şimdi değil."
 DOD_hungary.110.desc:0 "[HUN.GetLeader], Romanya meselesini görüşmek üzere Moskova'ya geldi. Büyük Savaş'ın sonunda Romanya, Besarabya ve Transilvanya da dahil olmak üzere bir dizi toprağı yasa dışı olarak ele geçirdi. Macar yoldaşlarımız, bu toprakları haklı sahiplerine iade etmesi için Romanya'ya baskı yapmamızı öneriyor."
 DOD_hungary.110.t:0 "Macaristan Romanya'ya baskı yapmak istiyor"
 DOD_hungary.111.a:0 "Başka seçeneğimiz yok."
 DOD_hungary.111.b:0 "Belki uzlaşabiliriz."
 DOD_hungary.111.c:0 "Komünist bir hükümet daha iyi sonuçlar alabilir."
 DOD_hungary.111.d:0 "Bu topraklar kutsaldır!"
 DOD_hungary.111.desc:0 "[HUN.GetNameDef] ve [SOV.GetNameDef] hükümetleri, Transilvanya ve Besarabya'yı ilhakımızı gayrimeşru bulduklarını belirten ortak bir bildiri sundular. Onlara göre, bu topraklar yasa dışı işgal altında ve bize bölgelerden çekilmemiz için son bir fırsat veriyorlar."
 DOD_hungary.111.t:0 "Komünist Ültimatomu"
 DOD_hungary.112.a:0 "Tek başımıza devam edeceğiz."
 DOD_hungary.112.b:0 "Hatalarımızı gözden geçireceğiz."
 DOD_hungary.112.desc:0 "Moskova'ya yaptığı son gezide [HUN.GetLeader], [SOV.GetLeader] ile saatler süren yıpratıcı toplantılara katlanmak zorunda kaldı. Kendisine, böylesine bariz bir şekilde yanlış yönlendirilmiş bir plan önerdiği için defalarca aptal dendi. Görünüşe göre, devrimci mücadelede ulusal toprağın rolünü henüz tam olarak anlamamışız ve bu nedenle stratejimizin ne olması gerektiği konusunda yanlış sonuçlara varmışız."
 DOD_hungary.112.t:0 "[SOV.GetLeader] teklifimizi geri çeviriyor."
 DOD_hungary.113.a:0 "Onları Transilvanya'yı vermeye zorla"
 DOD_hungary.113.b:0 "Onları Besarabya'yı vermeye zorla"
 DOD_hungary.113.c:0 "İlk teklifimizi daha zorlayıcı bir şekilde tekrarla."
 DOD_hungary.113.desc:0 "[ROM.GetLeader] yönetimindeki Romanya hükümeti, tartışmalı topraklar meselesini müzakere etmek için Moskova'ya bir heyet gönderdi. Görünüşe göre, tartışmalı alanların bir kısmını verip diğerini elinde tutacakları bir uzlaşma çözümüne ulaşabileceklerine inanıyorlar. Eğer anlaşırsak, hangi kısmı talep etmeliyiz?"
 DOD_hungary.113.t:0 "Romanya bir uzlaşma teklif ediyor"
 DOD_hungary.114.a:0 "Devrim durmadan ilerliyor."
 DOD_hungary.114.b:0 "Toprak konusunda ısrar et."
 DOD_hungary.114.desc:0 "Şaşırtıcı bir hamleyle, [ROM.GetLeader], sınırlarımızı garanti etmemiz karşılığında Romanya Komünist Partisi ile gücü paylaşmayı teklif etti. Bu, bir savaş riski olmadan bölgedeki nüfuzumuzu artırmak için iyi bir yol olabilir."
 DOD_hungary.114.t:0 "Romanya siyasi tavizler sunuyor"
 DOD_hungary.115.a:0 "Çabaya değmez."
 DOD_hungary.115.b:0 "Toprak konusunda ısrar et."
 DOD_hungary.115.c:0 "O zaman bir milyon adamları olacak."
 DOD_hungary.115.desc:0 "[ROM.GetAdjective] hükümeti tartışmalı toprakları müzakere etmeyi reddetti. Özel bir toplantıda, Rumen dışişleri bakanı büyükelçimize bu toprakları elde etmenin tek yolunun bir milyon adamı feda etmek olduğunu söyleyecek kadar ileri gitti."
 DOD_hungary.115.t:0 "Romanya talepleri reddediyor"
 DOD_hungary.116.a:0 "Kabul edilebilir."
 DOD_hungary.116.b:0 "Böyle şartları asla kabul etmeyeceğiz!"
 DOD_hungary.116.desc_bessarabia:0 "Delegasyonumuzla yapılan bir toplantıdan sonra, [SOV.GetLeader] bize bir tür uzlaşma teklif etti. Macar delegasyonunun gözle görülür bir şekilde yokluğunda, Sovyetlerin Besarabya'yı onlara vermeyi kabul edersek Transilvanya'nın devrinden vazgeçmeye istekli oldukları söylendi."
 DOD_hungary.116.desc_no_deal:0 "Delegasyonumuzla yapılan toplantı sırasında, Sovyet-Macar tarafı taleplerini yineledi. Hem Besarabya hem de Transilvanya ilgili talep sahiplerine devredilmedikçe, askeri önlemleri düşünecekler."
 DOD_hungary.116.desc_transylvania:0 "Heyetle yaptığımız görüşmenin ardından [SOV.GetLeader] bize bir çeşit uzlaşma teklifinde bulundu. [SOV.GetNameDefCap] prensip olarak Besarabya'nın bizimle kalması konusunda anlaştı, ancak Sovyetler Birliği yetkilileri ve Tannu Tuva'dan oluşan \"bağımsız sınır komisyonu\" Transilvanya'nın çoğunun Macaristan'a gitmesi gerektiği sonucuna vardı."
 DOD_hungary.116.t:0 "[SOV.GetLeader] teklife yanıt veriyor"
 DOD_hungary.117.a:0 "Onu bu sözünde tutacağız."
 DOD_hungary.117.desc:0 "Sovyetler, Komünistleri başa geçirme teklifimizi kabul etti. [SOV.GetLeader], delegasyonumuza şahsen, en azından Komintern tarafından bize karşı başka hiçbir toprak talebinde bulunulmayacağına dair güvence verdi."
 DOD_hungary.117.t:0 "[SOV.GetLeader] öneriyi kabul ediyor"
 DOD_hungary.118.a:0 "Denemelerini görmeyi çok isteriz."
 DOD_hungary.118.desc:0 "Sovyet-Macar saldırganlığına verdiğimiz kararlı yanıt sonuç vermiş görünüyor. Pravda, son başyazısında \"sosyalizm karşıtı revizyonist talepleri\" eleştirdi. Besarabya ve Transilvanya üzerindeki hak iddialarını özellikle anarak bunları \"dünyanın gelişmiş sosyalist uluslarının başvurmadığı emperyalist davranışlar\" olarak niteledi.\n\nAncak Budapeşte'den gelen tepki oldukça sönük kaldı. [HUN.GetLeader] hâlâ topraklarımız üzerinde planlar kuruyor olabilir."
 DOD_hungary.118.t:0 "Sovyetler geri adım atıyor"
 DOD_hungary.12.a:0 "Kabul edilebilir."
 DOD_hungary.12.desc:0 "Hükümetindeki cumhuriyetçi ve monarşist gruplar arasında dikkatli bir denge gözeten [CZE.GetLeader], bir uzlaşma çözümü seçti. [HUN.GetLeader], Bohemya ve Moravya Kralı ilan edilecek, ancak [CZE.GetAdjective] anayasası onun yetkilerini sadece parlamentonun tavsiyesi ve onayı ile hareket etmekle sınırlayacak."
 DOD_hungary.12.t:0 "Bohemya Daha Yakın İlişkiyi Kabul Ediyor"
 DOD_hungary.120.a:0 "Harika bir fikir."
 DOD_hungary.120.b:0 "Neden emperyalist savaşlara karışalım ki?"
 DOD_hungary.120.desc:0 "[HUN.GetLeader], Komünist Parti üzerindeki kısıtlamaların kaldırılması ve güney Slovakya'nın egemenliğinin Macaristan'a devredilmesi karşılığında [CZE.GetNameDef]'e ortak bir garanti sunma önerisiyle Moskova'ya gitti."
 DOD_hungary.120.t:0 "Macaristan Çekoslovakya'ya destek öneriyor"
 DOD_hungary.121.a:0 "Kabul edilebilir bir bedel."
 DOD_hungary.121.b:0 "Bunlar karşı savunmamız gereken talepler!"
 DOD_hungary.121.desc:0 "[HUN.GetNameDef] ve [SOV.GetNameDef] büyükelçileri, herhangi bir düşman saldırısına karşı sınırlarımızı garanti etme konusunda ortak bir teklifle bize başvurdular. Karşılığında, komünistlere hükümette koltuk garanti etmemiz gerekecekti. Macaristan ayrıca taahhüdünü güney Slovakya'nın kendi kontrollerine geri dönmesine bağladı."
 DOD_hungary.121.t:0 "Komintern garanti sunuyor"
 DOD_hungary.122.a:0 "Anlaşılabilir bir tepki."
 DOD_hungary.122.b:0 "Almanlara başvur"
 DOD_hungary.122.desc:0 "Garanti teklifimiz [CZE.GetAdjective]ler tarafından pek coşkuyla karşılanmadı. İstediğimiz siyasi tavizler [CZE.GetNameDef]'de bir kargaşaya neden oldu, birkaç önde gelen General ve siyasi figür, hükümetin kabul etmesi durumunda istifa etmekle tehdit etti.\n\n Desteğin zamanında kendilerine ulaşabileceğine dair ciddi endişeleri gerekçe gösteren [CZE.GetAdjective] hükümeti, teklifimizi resmi olarak reddetti."
 DOD_hungary.122.t:0 "Çekoslovakya teklifimizi reddediyor"
 DOD_hungary.123.a:0 "Belki de bu sonuçta en iyi plan değildi."
 DOD_hungary.123.b:0 "Almanlara başvur."
 DOD_hungary.123.desc:0 "Avrupa'nın büyük bir haritasının önünde duran [SOV.GetLeader], delegasyonumuza bir saatlik bir ders verdi, önerilen plandaki eksiklikleri ve kusurları defalarca işaret etti ve önerimizin istisnai aptallığı hakkında uzun uzun konuştu, hatta bizi Emperyalistlerle ortak dava gütmekle suçladı.\n\nDelegasyonumuz Moskova'dan eli boş ama hayatta döndü."
 DOD_hungary.123.t:0 "[SOV.GetLeader] önerimizi reddediyor"
 DOD_hungary.124.a:0 "İlgi çekici bir plan."
 DOD_hungary.124.b:0 "Mahallemize karışmalarına müsamaha göstermeyeceğiz!"
 DOD_hungary.124.desc:0 "[From.GetAdjective] Dışişleri Bakanı, [CZE.GetNameDef]'i iki parçaya bölme planını görüşmek üzere Berlin'e geldi. Önerilen antlaşmanın her iki tarafı da kendi toprak parçası üzerinde tam kontrole sahip olacaktı. Doğal olarak, biz Bohemya ve Moravya'nın batı kısımlarını alırken, onlar Slovakya'yı alacaktı."
 DOD_hungary.124.t:0 "[From.GetNameDefCap] Çekoslovakya'yı bölmeyi teklif ediyor"
 DOD_hungary.126.a:0 "Göreceğiz."
 DOD_hungary.126.desc:0 "[CZE.GetAdjective] hükümetinin, karşılığında istenen 'dayanılmaz' tavizler nedeniyle garanti teklifini reddettiği bildiriliyor.\n\nAncak, [SOV.GetNameDef] büyükelçimiz, [SOV.GetAdjective] dışişleri bakanlığında yoğun bir faaliyet olduğunu bildiriyor. Diplomatik çevrelerdeki söylentiler, Almanya ile olası bir anlaşmaya işaret ediyor."
 DOD_hungary.126.t:0 "[CZE.GetAdjective]ler reddediyor"
 DOD_hungary.127.a:0 "Diplomasi için bir zafer."
 DOD_hungary.127.b:0 "Bu beklediğimiz anlaşma değil."
 DOD_hungary.127.desc:0 "[GER.GetLeader], Alman hükümetinin [CZE.GetNameDef]'i iki çıkar alanına bölmeyi kabul ettiği ve Slovakya ile ilgili alınan her karara saygı duyacağına söz verdiği gizli Berlin Antlaşması'nı imzaladı."
 DOD_hungary.127.t:0 "Almanya [CZE.GetNameDef]'i bölmeyi kabul ediyor"
 DOD_hungary.128.a:0 "Kaba."
 DOD_hungary.128.b:0 "Açıkça blöf yapıyorlar."
 DOD_hungary.128.desc:0 "Büyükelçimizle yaptığı bir toplantıda [GER.GetLeader], hükümetinin [CZE.GetNameDef]'i tamamen kendi çıkar alanında gördüğünü ve sınırlarına herhangi bir müdahalenin düşmanca bir eylem olarak kabul edileceğini çok net bir şekilde belirtti."
 DOD_hungary.128.t:0 "Almanya teklifi reddediyor"
 DOD_hungary.129.a:0 "Başka seçeneğimiz yok."
 DOD_hungary.129.b:0 "Onu pencereden dışarı atın!"
 DOD_hungary.129.desc:0 "Alman büyükelçisi bugün [GER.GetLeader]'den, Berlin'den özel olarak seçilmiş bir yöneticinin gelişine kadar hükümet yetkilerinin yeni \"Reichsprotektor\" olarak kendisine derhal devredilmesini talep eden bir notu teslim etti. Aynı notta büyükelçi, Slovakya ile ilgili olarak [From.From.GetNameDef]'ye benzer hakların verilmesini talep etti.\n\nReddedersek, notta \"hızlı ve kararlı askeri harekat\" vaat ediliyor."
 DOD_hungary.129.t:0 "Alman Ültimatomu"
 DOD_hungary.13.a:0 "Bu talihsiz bir durum."
 DOD_hungary.13.desc:0 "[CZE.GetNameDefCap], gelecekteki ilişkilerimizle ilgili herhangi bir anlaşma veya uzlaşmayı görüşmeyi reddetti. Büyükelçimiz daha önce teslim ettiği resmi notayı görüşmek üzere dışişleri bakanlığına vardığında, konuşulacak bir şey olmadığı söylendi ve hızla kapı dışarı edildi. Hükümetimizdeki [CZE.GetAdjective] büyükelçisi, hükümetinin uluslarımız arasında barışçıl ve dostane bir ilişki istediğini, ancak [CZE.GetNameDef]'in Avusturya-Macaristan İmparatorluğu'na dahil edilmesi olasılığının olmadığını beyan etti."
 DOD_hungary.13.t:0 "[CZE.GetNameDefCap] Yakınlaşmayı Reddediyor"
 DOD_hungary.130.a:0 "Yazık."
 DOD_hungary.130.desc:0 "İlk başarılara rağmen, [From.GetLeader] hükümeti son dakikada önerilen antlaşma konusundaki fikrini değiştirmiş gibi görünüyor. Kararlarının kesin nedenleri konusunda çok sessiz kaldılar, ancak istihbarat servisimiz neden olarak silahlı kuvvetlerindeki hazırlık eksikliğinden şüpheleniyor."
 DOD_hungary.130.t:0 "[From.GetAdjective]ler görüşmeleri terk ediyor"
 DOD_hungary.140.a:0 "Kendilerini savunmalarına izin verilmeli."
 DOD_hungary.140.b:0 "Daha önce bir kez dünyayı savaşa sürüklediler!"
 DOD_hungary.140.desc:0 "Avrupa'daki giderek kötüleşen siyasi durumu ve Milletler Cemiyeti'nin bunu durdurmadaki tam başarısızlığını gerekçe gösteren [HUN.GetLeader], hükümetinin Trianon Antlaşması'nın revizyonuna izin vermek için komşu ülkelerin desteğini sağlamaya çalışacağını kamuoyuna duyurdu. Herhangi bir toprak talebinden bahsetmeyen [HUN.GetLeader], sadece Macar ordusu üzerindeki kısıtlamaları tartıştı.\n\nMacaristan'dan bir heyet, Macaristan'ın yeniden silahlanmasına yönelik resmi anlaşmamızı sağlamak için başkentimize geldi."
 DOD_hungary.140.t:0 "[FROM.GetNameDefCap] yeniden silahlanma hakkı talep ediyor"
 DOD_hungary.141.a:0 "Çok geç olmadan saldırmalıyız!"
 DOD_hungary.141.b:0 "Diplomatik protesto düzenleyin."
 DOD_hungary.141.c:0 "[From.GetAdjective] liderliğini takip edin."
 DOD_hungary.141.desc:0 "Bize danışmadan, [From.GetAdjective] hükümeti Macaristan ile bir antlaşma imzalayarak Trianon Antlaşması'nın kısıtlamalarını değiştirdi veya kaldırdı. Macaristan artık serbestçe yeniden silahlanmasına ve tanklar ve uçaklar da dahil olmak üzere her türlü askeri teçhizatı geliştirmesine izin veriliyor.\n\nMacaristan'ın ordusunu genişlettiği açık bir sır olsa da, bu yeni anlaşma onları yakında bizim için tekrar bir askeri tehdit oluşturabilecekleri noktaya getirecek."
 DOD_hungary.141.t:0 "[HUN.GetNameDefCap] yeniden silahlanma için [From.GetAdjective] desteğini alıyor"
 DOD_hungary.142.a:0 "Harika."
 DOD_hungary.142.desc:0 "Trianon Antlaşması'nın kısmi bir revizyonu için [From.GetAdjective] desteğini sağlamayı başardık. Ordumuz üzerindeki tüm kısıtlamalar kaldırıldı. Uluslararası silah denetçileri ülkeyi terk etti ve savaş bakanlığı silahlı kuvvetlerimizin mütevazı bir şekilde genişletilmesi için ilk planları hazırladı."
 DOD_hungary.142.t:0 "Bled Anlaşması"
 DOD_hungary.143.a:0 "Aferin onlara."
 DOD_hungary.143.desc:0 "[From.GetAdjective] büyükelçisi şu notu iletti: \n \"[From.GetNameDef] Hükümeti, [HUN.GetNameDef]'deki son gelişmeleri büyük bir endişeyle izliyor. Trianon Antlaşması uzun süredir bölgede barış ve istikrarın garantisi olmuştur. [From.GetAdjective] hükümeti prensip olarak ulusların kendi kaderlerini seçmelerine izin verilmesi gerektiğini kabul ederken, biz de [HUN.GetNameDef] hükümetini anlaşmaya uymaya mümkün olan en güçlü şekilde teşvik etmeliyiz.\" Bölgeyi daha fazla istikrarsızlaştırmanın sonuçları çok hızlı bir şekilde kontrol edilemez hale gelebilir.\""
 DOD_hungary.143.t:0 "[From.GetNameDefCap] Protesto Notası Yayınladı"
 DOD_hungary.144.a:0 "Onların baskısına boyun eğmeliyiz."
 DOD_hungary.144.b:0 "Destek için büyük bir güce başvurun."
 DOD_hungary.144.desc:0 "Trianon Antlaşması'na olası bir revizyonla ilgili müzakereler ilk aşamayı pek geçemedi. [From.GetNameDef] hükümeti, statükoyu koruma pozisyonlarından bir milim bile oynamayacaklarını açıkça belirtti.\n\nYa bunu kabul edebiliriz ya da üçüncü bir taraftan destek almaya çalışabiliriz."
 DOD_hungary.144.t:0 "[From.GetNameDefCap] Yeniden Silahlanma Konusunda Kararlı"
 DOD_hungary.145.a:0 "Almanya"
 DOD_hungary.145.b:0 "Fransa"
 DOD_hungary.145.c:0 "Sovyetler Birliği"
 DOD_hungary.145.d:0 "İtalya"
 DOD_hungary.145.desc:0 "Bled'deki müzakereler tamamen kilitlenmişken, dışarıdan bir aktör getirerek diplomatik inisiyatifi yeniden kazanmalıyız. Eğer bizi destekleyecek büyük bir ulus bulabilirsek, [From.From.GetLeader] hala pes etmeye ikna edilebilir. Kime başvurmalıyız?"
 DOD_hungary.145.e:0 "Britanya"
 DOD_hungary.145.t:0 "Destek için Başvuru"
 DOD_hungary.146.a:0 "Macaristan'ın yeniden silahlanmasına izin verilmeli."
 DOD_hungary.146.b:0 "Macaristan'ın yeniden silahlanmasına izin verilmemeli."
 DOD_hungary.146.desc:0 "Macar hükümeti şu anda Macaristan'ın ordusunu yeniden kurmasına izin vermek için Trianon Antlaşması'nı değiştirmeye çalışıyor. Bled'deki müzakereler birkaç gündür durmuş durumda. Macar büyükelçisi, diğer tarafa diplomatik baskı uygulama talebiyle hükümetimize başvurdu.\n\nDışişleri Bakanlığı, Macaristan'ın yanında yer almanın şüphesiz komşularıyla ilişkileri olumsuz etkileyeceği ve bölgedeki güç dengesini değiştireceği konusunda uyarıyor. Ancak, Macarları reddetmek, onların saldırgan bir hamle yapmalarına ve diplomasiyi tamamen terk etmelerine neden olabilir, bu da tüm bölgeyi istikrarsızlaştırabilir."
 DOD_hungary.146.t:0 "[HUN.GetLeader] diplomatik destek için başvuruyor"
 DOD_hungary.147.a:0 "Umalım ki haklıdırlar."
 DOD_hungary.147.b:0 "Bizim için en iyisini biz biliriz."
 DOD_hungary.147.desc:0 "Kişisel bir mektupta, [From.GetLeader] bizden Macaristan'ın Yeniden Silahlanma Meselesi'ndeki tutumumuzu yeniden gözden geçirmemizi istedi. Özellikle, şimdi yeniden silahlanmalarına izin verilse bile, Macarların bölgedeki herhangi bir şeyi tehdit edecek kadar güçlü bir ordu kurmalarının yıllar alacağını belirtiyor. \n\nBu konuda kararlı kalmak bizi diplomatik olarak izole edecektir. Ek güvenlik için buna değip değmeyeceğine karar vermeliyiz."
 DOD_hungary.147.t:0 "[From.GetNameDefCap] Macaristan'ın Yeniden Silahlanma Krizine Müdahale Ediyor"
 DOD_hungary.148.a:0 "Bir savaşı riske atamayız."
 DOD_hungary.148.b:0 "Şimdi sözlerin değil, eylemlerin zamanı!"
 DOD_hungary.148.desc:0 "Birkaç gün süren hararetli müzakerelerden sonra, Bled'de hiçbir ilerleme kaydedilemedi ve delegasyonlar kendi ülkelerine döndüler. [From.From.GetLeader]'in müdahalesi bile hiçbir şey elde edemedi. \n\nDiplomatik servis içinde önemli bir hayal kırıklığı var. Birçok kıdemli diplomat, müzakereyi reddederse [From.GetLeader]'e ne olacağını göstermek için yine de yeniden silahlanmamızı öneriyor."
 DOD_hungary.148.t:0 "Bled Konferansı başarısız oluyor"
 DOD_hungary.150.a:0 "Küçük, hafif bir önleme uçağı."
 DOD_hungary.150.b:0 "Büyük, ağır bir avcı uçağı."
 DOD_hungary.150.desc:0 "Modern hava muharebesi üzerine yapılan yeni bir çalışma, hava kuvvetlerimizde kritik bir zayıflığı ortaya çıkardı. Avcı uçaklarımız diğer ülkelerdeki gelişmelerin ciddi şekilde gerisinde. Hava Bakanlığı, mümkün olan en kısa sürede modern bir avcı uçağı edinmek için hızlandırılmış bir program başlattı. Yurtiçi geliştirme kabul edilemez miktarda zaman alacağından, yurtdışından bir lisans satın alınmasına karar verildi. Ek bir bütçe onaylandı.\n\nUzmanlar, avcı filolarımızı modernize etmek için ne tür bir uçağın en uygun olacağı konusunda farklı görüşlere sahipler."
 DOD_hungary.150.t:0 "Avcı Uçağı Yarışması"
 DOD_hungary.151.a:0 "Almanya'ya başvur"
 DOD_hungary.151.b:0 "İtalya'ya başvur"
 DOD_hungary.151.c:0 "Fransa'ya başvur"
 DOD_hungary.151.d:0 "Britanya'ya başvur"
 DOD_hungary.151.desc_light_fighter:0 "Hava Bakanlığı, saldırgan avcı taramaları ve nokta savunması için yeni bir hafif avcı uçağı tedarik etmeyi planlıyor, ancak Dışişleri Bakanlığı, hangi ülkeden satın alınacağına karar verirken siyasi ve diplomatik endişelerin de rol oynaması gerektiğini öne sürdü."
 DOD_hungary.151.desc_light_fighter_refused:0 "Ulusal güvenliği gerekçe gösteren [From.GetAdjective] hükümeti, üretim lisansı vermeyi reddetti. Başka yerlerde daha iyi şansımız olabilir ya da acil bir geçici çözüm olarak mevcut uçaklarımızı yükseltmeye bakabiliriz."
 DOD_hungary.151.e:0 "ABD'ye başvur"
 DOD_hungary.151.f:0 "Yarışmadan kazanılan deneyimi kendi uçaklarımızı geliştirmek için kullanın."
 DOD_hungary.151.t:0 "Hafif Avcı Uçağı Yarışması"
 DOD_hungary.152.desc_heavy_fighter:0 "Hava Bakanlığı, uzun menzilli önleme ve bombardıman uçağı eskortu için yeni bir ağır avcı uçağı tedarik etmeyi planlıyor, ancak Dışişleri Bakanlığı, hangi ülkeden satın alınacağına karar verirken siyasi ve diplomatik endişelerin de rol oynaması gerektiğini öne sürdü."
 DOD_hungary.152.desc_heavy_fighter_refused:0 "Ulusal güvenliği gerekçe gösteren [From.GetAdjective] hükümeti, üretim lisansı vermeyi reddetti. Başka yerlerde daha iyi şansımız olabilir ya da acil bir geçici çözüm olarak mevcut uçaklarımızı yükseltmeye bakabiliriz."
 DOD_hungary.152.t:0 "Ağır Avcı Uçağı Yarışması"
 DOD_hungary.153.a:0 "Kesinlikle."
 DOD_hungary.153.b:0 "Herhangi bir sızıntıyı riske atamayız."
 DOD_hungary.153.desc:0 "[From.GetAdjective] Hava Kuvvetleri şu anda yeni bir hafif avcı uçağı için denemeler yapıyor. Hava Ataşemize göre, en yeni modelimiz kazanmaya hazırlanıyor. [From.GetAdjective] hükümetinden kısa süre içinde resmi bir talep bekleniyor. \n\nÜreticinin temsilcileri satışı şiddetle destekliyor, ancak en modern teçhizatımızı yabancı bir ülkeye satma konusunda ulusal güvenlik endişeleri var. Satışın gerçekleşmesine izin vermeli miyiz?"
 DOD_hungary.153.t:0 "[From.GetAdjective] Avcı Uçağı Yarışması"
 DOD_hungary.154.desc:0 "[From.GetAdjective] Hava Kuvvetleri şu anda yeni bir ağır avcı uçağı için denemeler yapıyor. Hava Ataşemize göre, en yeni modelimiz kazanmaya hazırlanıyor. [From.GetAdjective] hükümetinden kısa süre içinde resmi bir talep bekleniyor. \n\nÜreticinin temsilcileri satışı şiddetle destekliyor, ancak en modern teçhizatımızı yabancı bir ülkeye satma konusunda ulusal güvenlik endişeleri var. Satışın gerçekleşmesine izin vermeli miyiz?"
 DOD_hungary.155.a:0 "Harika."
 DOD_hungary.155.desc:0 "Üretici ve devlet yetkilileriyle yapılan müzakerelerin ardından, yeni bir avcı uçağı için başarılı bir şekilde üretim lisansı sağladık. Uçağın bir örneği, mekaniklerini bakımı konusunda eğitmek için şimdiden geldi ve tam bir çizim ve plan seti kısa süre içinde bekleniyor. Üretim her an başlayabilir."
 DOD_hungary.155.t:0 "Avcı Uçağı Yarışması tamamlandı"
 DOD_hungary.160.a:0 "Yakın destek için küçük bir bombardıman uçağı."
 DOD_hungary.160.b:0 "Daha fazla menzile sahip daha büyük bir uçak."
 DOD_hungary.160.desc:0 "Hava Bakanlığı tarafından yapılan bir çalışma, hava kuvvetlerimizin orduyu desteklemek için yetersiz donanıma sahip olduğunu ortaya çıkardı. Uzun menzilli hava saldırıları ve yakın hava desteği, kritik derecede eksik olduğumuz kilit alanlar olarak belirlendi. Hükümet, modern bir bombardıman uçağı edinmek için hızlandırılmış bir programa para ayırdı, ancak hangi uçağı tedarik etmemiz gerektiğine karar vermeliyiz."
 DOD_hungary.160.t:0 "Bombardıman Uçağı Yarışması"
 DOD_hungary.161.desc_cas:0 "Hava Bakanlığı, kara kuvvetlerine yakın destek için yeni bir hafif bombardıman uçağı tedarik etmeyi planlıyor, ancak Dışişleri Bakanlığı, hangi ülkeden satın alınacağına karar verirken siyasi ve diplomatik endişelerin de rol oynaması gerektiğini öne sürdü."
 DOD_hungary.161.desc_cas_refused:0 "Ulusal güvenliği gerekçe gösteren [From.GetAdjective] hükümeti, üretim lisansı vermeyi reddetti. Başka yerlerde daha iyi şansımız olabilir ya da acil bir geçici çözüm olarak mevcut uçaklarımızı yükseltmeye bakabiliriz."
 DOD_hungary.161.t:0 "Hafif Bombardıman Uçağı Yarışması"
 DOD_hungary.162.desc_tac:0 "Hava Bakanlığı, uzun menzilli engelleme ve taktik hava saldırıları için yeni bir orta bombardıman uçağı tedarik etmeyi planlıyor, ancak Dışişleri Bakanlığı, hangi ülkeden satın alınacağına karar verirken siyasi ve diplomatik endişelerin de rol oynaması gerektiğini öne sürdü."
 DOD_hungary.162.desc_tac_refused:0 "Ulusal güvenliği gerekçe gösteren [From.GetAdjective] hükümeti, üretim lisansı vermeyi reddetti. Başka yerlerde daha iyi şansımız olabilir ya da acil bir geçici çözüm olarak mevcut uçaklarımızı yükseltmeye bakabiliriz."
 DOD_hungary.162.t:0 "Orta Bombardıman Uçağı Yarışması"
 DOD_hungary.163.desc:0 "[From.GetAdjective] Hava Kuvvetleri şu anda yeni bir hafif bombardıman uçağı için denemeler yapıyor. Hava Ataşemize göre, en yeni modelimiz kazanmaya hazırlanıyor. [From.GetAdjective] hükümetinden kısa süre içinde resmi bir talep bekleniyor. \n\nÜreticinin temsilcileri satışı şiddetle destekliyor, ancak en modern teçhizatımızı yabancı bir ülkeye satma konusunda ulusal güvenlik endişeleri var. Satışın gerçekleşmesine izin vermeli miyiz?"
 DOD_hungary.163.t:0 "[From.GetAdjective] Bombardıman Uçağı Yarışması"
 DOD_hungary.164.desc:0 "[From.GetAdjective] Hava Kuvvetleri şu anda yeni bir orta bombardıman uçağı için denemeler yapıyor. Hava Ataşemize göre, en yeni modelimiz kazanmaya hazırlanıyor. [From.GetAdjective] hükümetinden kısa süre içinde resmi bir talep bekleniyor. \n\nÜreticinin temsilcileri satışı şiddetle destekliyor, ancak en modern teçhizatımızı yabancı bir ülkeye satma konusunda ulusal güvenlik endişeleri var. Satışın gerçekleşmesine izin vermeli miyiz?"
 DOD_hungary.164.t:0 "[From.GetAdjective] Bombardıman Uçağı Yarışması"
 DOD_hungary.165.a:0 "Harika."
 DOD_hungary.165.desc:0 "Üretici ve devlet yetkilileriyle yapılan müzakerelerin ardından, yeni bir bombardıman uçağı için başarılı bir şekilde üretim lisansı sağladık. Uçağın bir örneği, mekaniklerini bakımı konusunda eğitmek için şimdiden geldi ve tam bir çizim ve plan seti kısa süre içinde bekleniyor. Üretim her an başlayabilir."
 DOD_hungary.165.t:0 "Bombardıman Uçağı Yarışması tamamlandı"
 DOD_hungary.170.a:0 "Mükemmel!"
 DOD_hungary.170.desc:0 "Eski destekçileri gitmişken, Trianon Antlaşması artık üzerine basıldığı kağıda değmez. Artık kimse silahlanma hakkımızı reddedemez!"
 DOD_hungary.170.t:0 "Antlaşmanın Sonu"
 DOD_hungary.2.a:0 "Halk kararını verdi."
 DOD_hungary.2.desc:0 "Referandum sonuçları geldi ve ilk sayımlar Macaristan ile Birlik için önemli bir çoğunluğu gösteriyor."
 DOD_hungary.2.t:0 "Referandum onaylandı"
 DOD_hungary.20.a:0 "Bu çatışmaya sürüklenmeyi göze alamayız."
 DOD_hungary.20.b:0 "Macaristan'a bir gözlemci heyeti gönderin. Büyük olsun."
 DOD_hungary.20.c:0 "Onların savaşı bizim savaşımızdır."
 DOD_hungary.20.desc:0 "Macaristan'da savaşın patlak vermesinin ardından, onları destekleme sorusu defalarca gündeme geldi. Muhafazakar gazeteler, Macarlara yardım etmek için eylem çağrısında bulunarak Kral'ın, şimdi Macaristan Kralı olan kendi oğlunun saldırı altındayken boş durmasının makul bir şekilde beklenemeyeceğini iddia ediyor. Anonim bir grup Ordu subayı tarafından yazılan bir mektup basına sızdırıldı ve çok sayıda askerin, eğer hükümet izin verirse, savaşmak için Macaristan'a gitmeye istekli olduğunu belirtiyor. \n\nHükümet bir dizi seçeneği görüşmek üzere toplandı."
 DOD_hungary.20.t:0 "Macaristan'daki savaş"
 DOD_hungary.21.a:0 "Kendi başımızayız."
 DOD_hungary.21.desc:0 "Hem İsveç kralının hem de İsveç ordusunun unsurlarının çok sayıda başvurusuna rağmen, İsveç hükümeti kimsenin yardımımıza gelmesine izin vermedi. Savaşmak için Macaristan'a seyahat etmek isteyen özel şahıslara bile seyahat vizesi verilmiyor ve hükümet bize silah satışını yasa dışı hale getiren bir yasa çıkardı."
 DOD_hungary.21.t:0 "İsveç yardımı reddediyor."
 DOD_hungary.22.a:0 "Mükemmel."
 DOD_hungary.22.desc:0 "İsveç hükümeti resmi olarak tarafsız olsa da, şaşırtıcı derecede çok sayıda asker ve subayın uzun süreli izinlere çıkmasına ve hatta kişisel silahlarını yanlarına almalarına izin verdi. Askerler Macaristan'a ulaştı ve şimdi ordumuza katılmaya hazırlar."
 DOD_hungary.22.t:0 "İsveç destek gönderiyor"
 DOD_hungary.23.a:0 "Zamanında yetişebilecekler mi?"
 DOD_hungary.23.desc:0 "Deneyimli diplomatları bile şaşırtan bir gelişmeyle, İsveç hükümeti hayatta kalmamızı İsveç'in temel bir ulusal çıkarı olarak gördüklerini duyurdu. Söylentilere göre, İsveç Kralı'nın kendisi lehimize müdahale ederek, hükümet sıcak destek sözlerinden daha fazlasını sunmazsa tahttan çekilip orduda hizmetini sunmak için bizzat Macaristan'a gitmekle tehdit etmiş."
 DOD_hungary.23.t:0 "İsveç müdahale ediyor"
 DOD_hungary.24.a:0 "Onların çatışmasına sürüklenebiliriz."
 DOD_hungary.24.b:0 "Gizli destek gönder."
 DOD_hungary.24.c:0 "İsveçlilerle omuz omuzayız."
 DOD_hungary.24.desc:0 "İsveç kanlı bir çatışmanın içine sürüklendi. Parlamentonun her iki kanadı önünde nadir bir konuşma yapan Kral, eski yurdu için ve özellikle İsveç'in yenilmesi durumunda babası ve ailesinin maruz kalacağı kaderden derin endişe duyduğunu belirtti. Bu ışıkta, hükümet İsveç'e yardım etmek için neler yapılabileceğini görüşmek üzere toplanmaya karar verdi."
 DOD_hungary.24.t:0 "İsveç saldırı altında."
 DOD_hungary.25.a:0 "Kendi başımızayız."
 DOD_hungary.25.desc:0 "Macaristan Kralı'nın kişisel başvurusuna rağmen, parlamento İsveç'e her türlü desteği reddetme yönünde oy kullandı. Muhalefet, Macaristan'ın tarafsızlığını ihlal edecek herhangi bir şey yapmaya çalışması durumunda [HUN.GetLeader]'ı güvensizlik oyuyla görevden almakla tehdit etti."
 DOD_hungary.25.t:0 "Macaristan yardımı reddediyor."
 DOD_hungary.26.a:0 "Kendilerini memnuniyetle karşılıyoruz."
 DOD_hungary.26.desc:0 "Macaristan eski cephaneliklerini açtı ve bize bir dizi yenilenmiş tüfek ve diğer piyade teçhizatı gönderdi. Birkaç bin Macar gönüllü de bize ulaştı."
 DOD_hungary.26.t:0 "Macaristan destek gönderiyor"
 DOD_hungary.27.a:0 "Zamanında olacak mı?"
 DOD_hungary.27.desc:0 "Macar hükümeti, İsveç'e yönelik herhangi bir saldırının Macaristan'a da yapılmış bir saldırı olarak kabul edileceğini ilan eden bir bildiri yayınladı. Macar Ordusu yüksek alarma geçirildi ve seferberlik tamamlanır tamamlanmaz savaşa girmesi bekleniyor."
 DOD_hungary.27.t:0 "Macaristan müdahale ediyor"
 DOD_hungary.3.a:0 "Akıllıca bir seçim."
 DOD_hungary.3.desc:0 "Macaristan yanlısı gruplar ve monarşistler tarafından iyi düzenlenmiş bir kampanyaya rağmen, ilk sonuçlar statükonun korunması yönünde küçük bir çoğunluğu gösteriyor."
 DOD_hungary.3.t:0 "Referandum başarısız"
 DOD_hungary.30.a:0 "Makul bir talep."
 DOD_hungary.30.b:0 "Peki daha büyük bir orduya ne için ihtiyaçları olacak?"
 DOD_hungary.30.desc:0 "Macar hükümeti, Trianon Antlaşması'nı yeniden müzakere etme teklifiyle bize yaklaştı. Tekliflerine göre, antlaşmadaki ordu büyüklüğü kısıtlamaları, Macaristan'ın mevcut ordusunu tam güce çıkarmasına izin verecek şekilde değiştirilecek. Macaristan'a ayrıca bütçesinin daha büyük bir bölümünü askeri sanayisini genişletmek ve modernize etmek için harcamasına izin verilecek. \n\nÜlkede demokratik bir hükümetin sağlam bir şekilde kontrolü elinde tutmasıyla, diplomatik servisimizde bu plan için önemli bir destek var."
 DOD_hungary.30.t:0 "Macaristan Yakınlaşma Teklif Ediyor"
 DOD_hungary.31.a:0 "Mükemmel."
 DOD_hungary.31.desc:0 "[From.GetNameDef], Trianon Antlaşması'nın Revizyonu'nu yeni onayladığı için [HUN.GetLeader] hükümeti büyük bir siyasi zafer kazandı. Artık zorunlu askerliği yeniden uygulamaya koymamıza ve bütçede askeri fabrikaların inşası için açıkça para ayırmamıza izin veriliyor."
 DOD_hungary.31.t:0 "Trianon'un Revizyonu"
 DOD_hungary.32.a:0 "Pekala, istediklerini vereceğiz."
 DOD_hungary.32.b:0 "Yardım için Fransa'ya başvur."
 DOD_hungary.32.c:0 "Yardım için Britanya'ya başvur."
 DOD_hungary.32.desc:0 "[From.GetNameDef] hükümeti, yeniden silahlanma konusunda geri adım atmayı reddetti. Görüşmeler neredeyse anında çöktü, [From.GetAdjective] heyeti her fırsatta oyaladı ve oturma düzeni gibi küçük konuları saatler süren tartışmalara dönüştürdü. Yeniden silahlanmamıza izin verme niyetinde olmadıkları açık, ancak görüşmelerden çekilen tarafın biz olmasını istiyorlar."
 DOD_hungary.32.t:0 "[From.GetNameDefCap] müzakereyi reddediyor"
 DOD_hungary.33.a:0 "Macaristan'a sınırlı yeniden silahlanma izni verilmeli."
 DOD_hungary.33.b:0 "Bölgedeki güç dengesini bozamayız."
 DOD_hungary.33.desc:0 "Macaristan son zamanlarda, son savaştan sonra kendisine konulan bazı kısıtlamaları revize etme konusunda komşularının nabzını yoklamaya başladı. Özellikle, zorunlu askerliği yeniden getirmek ve askeri sanayilerini genişletmek istiyorlar. Macar argümanı, dünyanın her geçen gün daha az güvenli hale geldiği ve kendilerini savunmak için uygun bir orduya ihtiyaçları olduğu yönünde. [From.From.GetNameDefCap] ise aksini düşünüyor."
 DOD_hungary.33.t:0 "Macaristan destek için başvuruyor"
 DOD_hungary.34.a:0 "Umarım yanılmıyorlardır."
 DOD_hungary.34.b:0 "Bu konuda kararlı olmalıyız."
 DOD_hungary.34.desc:0 "[From.GetNameDef]'in Büyükelçisi, hükümetinin Macarlara yeniden silahlanma hakkını tanımama kararımıza şiddetle karşı olduğunu açıkça belirtti. Ayrıca, Macaristan'ın silahsız kalması konusunda ısrar edersek, hükümetinin gelecekte bizi ilgilendiren diplomatik konular ortaya çıktığında bunu dikkate alacağını açıkça ifade etti. \n\nBaşka bir deyişle, mevcut iyi ilişkilerimizi bu konuda riske atmaya istekliler."
 DOD_hungary.34.t:0 "[From.GetName] Macaristan'ı destekliyor"
 DOD_hungary.35.a:0 "Lanet olsun onlara."
 DOD_hungary.35.desc:0 "[From.GetNameDef] hükümeti, Trianon Antlaşması'nı revize etme meselesini tamamen ilgili ülkelerin bir iç meselesi olarak gördüklerini ve konuya dahil olmayı reddettiklerini bize bildirdi. Görünüşe göre adaletten çok eski müttefikleriyle iyi ilişkileri sürdürmeyi önemsiyorlar."
 DOD_hungary.35.t:0 "[From.GetName] desteği reddediyor"
 DOD_hungary.36.a:0 "Gerçekten o kadar tehditkar mıyız?"
 DOD_hungary.36.desc:0 "[From.From.GetNameDef]'den gelen ağır siyasi baskıya rağmen, [From.GetNameDef] konuyu tartışmayı kategorik olarak reddetti. Görünüşe göre hala silahlarımızı onlara karşı kullanacağımızdan korkuyorlar. \n\nTüm diplomatik yollar tıkalıyken, gelecekte konuyu yeniden gözden geçirmek için başka bir fırsatımız olup olmayacağını bekleyip görmemiz gerekecek."
 DOD_hungary.36.t:0 "[From.GetNameDefCap] inatçı davranıyor."
 DOD_hungary.4.a:0 "Mükemmel."
 DOD_hungary.4.desc:0 "Gece yarısından kısa bir süre sonra [AUS.GetLeader], Avusturya halkının Macaristan ile birleşme yönünde oy kullandığını duyurdu. İkili monarşiyi canlandırmanın ilk adımı olarak [HUN.GetLeader]'a resmi olarak Avusturya tacını sunan bir telgraf geldi."
 DOD_hungary.4.t:0 "Referandum başarılı"
 DOD_hungary.40.a:0 "Derhal bir ültimatom verin."
 DOD_hungary.40.b:0 "Şu anda bir savaşı göze alamayız."
 DOD_hungary.40.desc:0 "[HUN.GetLeader] bugün kamuoyuna yaptığı açıklamada, artık [HUN.GetNameDef]'i antlaşmaya bağlı görmediğini belirtti. Dahası, antlaşmanın Macaristan'a silah zoruyla dayatıldığını ve bu nedenle hiçbir zaman yasal olarak bağlayıcı olmadığını iddia ederek geçersiz kıldığını ilan etti. Macar hükümeti, kararlarını bize resmi olarak bildirme zahmetine bile katlanmadı.\n\nHükümette birçok kişi güçlü bir yanıtı destekliyor. Macarlara onlardan korkmadığımızı gösterirsek, kesinlikle pes edeceklerdir. Ancak, blöf yaptığımızı da düşünebilirler."
 DOD_hungary.40.t:0 "[HUN.GetNameDefCap] Trianon Antlaşması'nı Tanımadığını Açıkladı"
 DOD_hungary.41.a:0 "Açıkça blöf yapıyorlar."
 DOD_hungary.41.b:0 "Görünüşe göre bir yanlış anlaşılma olmuş."
 DOD_hungary.41.desc:0 "Trianon Antlaşması'nı terk etme yönündeki son kararımız, [From.GetNameDef] tarafından şaşırtıcı derecede güçlü bir karşılıkla karşılandı. [From.GetLeader]'in [From.GetAdjective] ordusunun derhal bir müdahale planı hazırlamasını talep ettiği bildiriliyor. Bu arada, [From.GetAdjective] büyükelçisi, askeri seçeneğin hala masada olduğunu ima ederek Antlaşma hakkındaki açıklamalarımızı netleştirmemizi istedi."
 DOD_hungary.41.t:0 "[From.GetName] bir ültimatom veriyor."
 DOD_hungary.42.a:0 "Beklendiği gibi."
 DOD_hungary.42.desc:0 "Trianon Antlaşması hakkındaki sert açıklamalarımıza rağmen, [From.GetNameDef] bizi durdurmak için herhangi bir hamle yapmadı. Yakın tarihli bir basın toplantısında, [From.GetLeader] Antlaşmayı terk etme kararımızla ilgili hiçbir soruyu yanıtlamamak için elinden geleni yaptı. Bu, herkesin zaten şüphelendiği şeyi açıkça gösteriyor: [From.GetNameDef] kağıttan kaplandan başka bir şey değil."
 DOD_hungary.42.t:0 "[From.GetName] pes ediyor."
 DOD_hungary.43.a:0 "Eğer [HUN.GetAdjective]ler savaş istiyorsa, o zaman onlara istediğini vereceğiz."
 DOD_hungary.43.b:0 "Blöfümüzü gördüler."
 DOD_hungary.43.desc:0 "Görünüşe göre [HUN.GetNameDef]'ye yönelik uyarımız dikkate alınmadı. Geçen akşam Budapeşte'deki bir mitingde kalabalığın \"[From.From.GetNameDef]'ye ölüm!\" diye bağırdığı bildirildi. ve [HUN.GetLeader], [HUN.GetNameDef]'nin dünyadaki hak ettiği yeri geri almasını engellemeye yönelik herhangi bir girişimin, \"dünyanın daha önce görmediği türden bir savaşla, 1914 ile 1918 arasındaki büyük katliamı yalnızca bir bar kavgası gibi gösterecek bir savaşla\" karşılanacağına açıkça söz verdi.\n\n kavşak. Ya onurumuzu ve güvenilirliğimizi savunmak için savaşa girmeliyiz ya da manevrayla geride kaldığımızı kabul etmeliyiz."
 DOD_hungary.43.t:0 "[HUN.GetNameDefCap] geri adım atmayı reddediyor."
 DOD_hungary.44.a:0 "Biz de öyle düşünmüştük."
 DOD_hungary.44.desc:0 "Savaş tehdidi masadayken, Macar hükümeti birdenbire çok daha dostane hale geldi. Büyükelçimiz [HUN.GetLeader] ile özel bir öğle yemeğine davet edildi ve burada [HUN.GetNameDef]'in bizden barış ve dostane ilişkilerden başka bir şey istemediği konusunda güvence verildi. Sansasyonel basındaki hiçbir ifadenin, hiçbir zaman savaş istememiş olan Macar hükümetinden geldiği şeklinde algılanmaması gerektiği belirtildi."
 DOD_hungary.44.t:0 "[HUN.GetNameDefCap] geri adım atıyor"
 DOD_hungary.45.a:0 "Çok geç olmadan saldırmalıyız."
 DOD_hungary.45.b:0 "Bu çatışmaya sürüklenmeyeceğiz."
 DOD_hungary.45.desc:0 "[From.GetNameDefCap], [HUN.GetNameDef]'in Trianon Antlaşması'nı açıkça reddetmesinin ardından askeri bir müdahale ilan etti. Gücünü yeniden kazanmadan önce [HUN.GetNameDef]'i devirmek için onlara katılmamızı istediler."
 DOD_hungary.45.t:0 "[HUN.GetNameDef]'e Müdahale"
 DOD_hungary.46.a:0 "Bunu kendi başımıza yapabiliriz."
 DOD_hungary.46.desc:0 "[From.GetNameDef]'deki hainler ve korkaklar silahlanma çağrımıza cevap vermeyi reddettiler! Budapeşte'deki zorbaya karşı durmak yerine, boyun eğdiler ve bizi [HUN.GetAdjective]lerle tek başımıza yüzleşmek için bıraktılar."
 DOD_hungary.46.t:0 "[From.GetNameDefCap] tarafsızlığını ilan ediyor"
 DOD_hungary.5.a:0 "Ülkeyi kurtarmalı ve haklı hükümdarına geri vermeliyiz."
 DOD_hungary.5.b:0 "Sonuca saygı duyacağız."
 DOD_hungary.5.desc:0 "Tüm çabalarımıza rağmen, Avusturya halkı statükoyu korumaya karar verdi."
 DOD_hungary.5.t:0 "Referandum reddedildi"
 DOD_hungary.50.a:0 "Yeni bir savaşın kan dökülmesine değmez."
 DOD_hungary.50.b:0 "Yoksa... ne?"
 DOD_hungary.50.desc:0 "Transilvanya, halkı Büyük Savaş'tan sonra özgürce bize katılmaya karar vermeden önce uzun süre [HUN.GetNameDef]'in bir parçasıydı. Ne yazık ki, [HUN.GetNameDef] topraklarının kaybını asla atlatamadı. Çeşitli zamanlarda, Transilvanya'yı uluslarının ayrılmaz bir parçası olarak kamuoyuna talep ettiler. Siyasi durumdaki son değişimlerle birlikte, bir kez daha taleplerini ilerletmeye karar verdiler ve tüm Transilvanya'yı kendilerine teslim etmemizi talep ediyorlar... yoksa."
 DOD_hungary.50.t:0 "[HUN.GetNameDefCap] Transilvanya'yı Talep Ediyor"
 DOD_hungary.51.a:0 "Olması gerektiği gibi."
 DOD_hungary.51.desc:0 "Ordularımızın gücüyle yüzleşmek yerine, korkak [ROM.GetAdjective]ler haklı topraklarımızı geri vermeye karar verdiler. Transilvanya'nın tamamı yönetimimize devredildi ve kuvvetlerimiz tam kontrolü ele aldı."
 DOD_hungary.51.t:0 "[ROM.GetNameDefCap] Transilvanya'yı devrediyor"
 DOD_hungary.52.a:0 "Öfke savaşta kötü bir rehberdir. Zamanımızı bekleyeceğiz."
 DOD_hungary.52.b:0 "Bu sefer çok ileri gittiler."
 DOD_hungary.52.desc:0 "Belki de en anlamlı olanı, [ROM.GetAdjective] büyükelçisinin bu sabah [HUN.GetLeader] ile yaptığı toplantıda, ihtilaflı bölgelerin devredilmesi olasılığını tartışmayı bile kesin bir şekilde reddetmesine \"her zamanki gibi\" ifadesini ekleme ihtiyacı hissetmesiydi. [ROM.GetAdjective] hükümeti iddialarımızı defalarca reddetti, hatta onlarla alay etti. Yıllarca geri adım atamayacak kadar zayıftık.\n\nArtık değil."
 DOD_hungary.52.t:0 "[ROM.GetNameDefCap] Transilvanya'yı vermeyi reddediyor"
 DOD_hungary.53.a:0 "Jestimizi yaptık. Kimse savaş istemiyor."
 DOD_hungary.53.b:0 "Geçemeyecekler!"
 DOD_hungary.53.c:0 "Belki de uzlaşma zamanı gelmiştir."
 DOD_hungary.53.desc:0 "[HUN.GetNameDefCap], kuvvetlerini yüksek hazırlık durumuna geçirdi. Macar keşif uçakları son birkaç saat içinde hava sahamızı onlarca kez ihlal etti. Kendi istihbarat servisimiz sınırlara doğru büyük birlik hareketleri ve Budapeşte'de çalan hava saldırısı sirenleri bildiriyor. Görünüşe göre [HUN.GetAdjective]ler bu sefer ciddi. Savaşa gidiyor olabiliriz."
 DOD_hungary.53.t:0 "[HUN.GetNameDefCap] seferber oluyor"
 DOD_hungary.54.a:0 "Bu kontrolden çıkıyor."
 DOD_hungary.54.b:0 "Öyleyse savaş olsun."
 DOD_hungary.54.c:0 "Tarafsız arabuluculuk teklif et."
 DOD_hungary.54.desc:0 "Askeri hazırlıklarımıza yanıt olarak, [ROM.GetLeader] 1 Numaralı Genel Emri imzalayarak [ROM.GetAdjective] ordusunu en yüksek alarma geçirdi. [ROM.GetAdjective] Hava Kuvvetleri savaş mevzilerini işgal etti ve avcı uçakları bizimkilerle tatbikat amaçlı it dalaşlarına girdi. [ROM.GetAdjective] büyükelçisi pasaportunu istedi. Henüz ateş açılmadı, ancak bu krizin savaşa dönüşmesi sadece bir zaman meselesi. \n\nBritanya, Fransa ve Almanya'daki büyükelçilerimiz, ilgili dışişleri bakanlıklarında hummalı bir faaliyet olduğunu bildiriyor, bu da bu ulusların patlak veren krizle ilgilenebileceğini gösteriyor. Bunu güçle çözmek istersek, hızla saldırmalıyız."
 DOD_hungary.54.t:0 "[ROM.GetNameDefCap] seferber oluyor"
 DOD_hungary.55.a:0 "Almanya'ya başvur"
 DOD_hungary.55.b:0 "Britanya'ya başvur"
 DOD_hungary.55.c:0 "Sovyetler Birliği'ne başvur"
 DOD_hungary.55.d:0 "Fransa'ya başvur"
 DOD_hungary.55.desc:0 "Yüksek gerilime rağmen, sorunu diplomasi yoluyla çözmek için hala bir şans var. Karşı taraf bize gayriresmi kanallardan yaklaşarak, konuyu karara bağlamak için tarafsız uluslardan oluşacak bir komisyona ille de karşı olmayacaklarını öne sürdü. Davamızı savunmak için kime başvurmalıyız?"
 DOD_hungary.55.e:0 "İtalya'ya başvur"
 DOD_hungary.55.f:0 "Davamızı dinleyecek kimse yok..."
 DOD_hungary.55.t:0 "Bir Arabulucu Seçin"
 DOD_hungary.57.a:0 "Bir zafer."
 DOD_hungary.57.desc:0 "Budapeşte'den hala gelen sert söylemlere rağmen, sınır yakınındaki Macar kuvvetleri geri çekildi. Hava sahamızın ihlalleri sona erdi. Görünüşe göre [HUN.GetLeader] bunu olabildiğince sessiz tutmak istiyor ve dışişleri bakanlığında bunu yapmasına izin verilmesi gerektiği konusunda bir fikir birliği var. Bir savaştan kıl payı kurtulmuşken bir uzlaşma jesti küçük bir bedeldir."
 DOD_hungary.57.t:0 "[HUN.GetNameDefCap] geri adım atıyor"
 DOD_hungary.58.a:0 "Memnuniyetle yaparız."
 DOD_hungary.58.b:0 "Onları temsil etmek bizim çıkarımıza değil."
 DOD_hungary.58.desc:0 "Balkanlardaki durumun hızla topyekun savaşa doğru ilerlemesiyle, Macaristan Transilvanya anlaşmazlığında arabuluculuk talebinde bulunmaya karar verdi. Transilvanya'nın kaderini karara bağlayacak komisyonda yer almamızı talep etmek için bize başvurdular. Yaklaşan konferansta davalarını savunacağımıza açıkça inanıyorlar."
 DOD_hungary.58.t:0 "[HUN.GetNameDefCap] Arabuluculuk İstiyor"
 DOD_hungary.59.a:0 "Kesinlikle savunacağız."
 DOD_hungary.59.b:0 "Onları savunmakla ilgilenmiyoruz."
 DOD_hungary.59.desc:0 "Macaristan'dan artan baskıyla karşı karşıya kalan Romanya, Transilvanya üzerindeki anlaşmazlığı karara bağlamak için tarafsız bir komisyon talebinde bulundu. O komisyonda yer alma isteğimizi öğrenmek için bize başvurdular. Şüphesiz, bölgedeki taleplerini savunacağımıza inanıyorlar."
 DOD_hungary.59.t:0 "[ROM.GetNameDefCap] Arabuluculuk İstiyor"
 DOD_hungary.6.a:0 "Ne kadar birlik olduklarını göreceğiz."
 DOD_hungary.6.b:0 "İşte 'Demokrasi' böyle işler."
 DOD_hungary.6.desc:0 "Avusturya lideri [AUS.GetLeader], tüm ülkenin Habsburglara karşı muhalefette birleştiğini ve Avusturya'nın bağımsızlığı üzerine bir referandum fikrinin tamamen saçma olduğunu kamuoyuna duyurdu."
 DOD_hungary.6.t:0 "Referandum reddedildi"
 DOD_hungary.60.a:0 "Macaristan'ı desteklemeliyiz."
 DOD_hungary.60.b:0 "Romanya'yı desteklemeliyiz."
 DOD_hungary.60.c:0 "Bu sadece Balkanlardaki aptalca bir şey daha."
 DOD_hungary.60.desc:0 "Son birkaç gündür Macaristan ve Romanya arasındaki gergin ilişkiler tamamen koptu. Macaristan, Romanya'dan tartışmalı Transilvanya topraklarını kendilerine devretmesini talep etti. Romanya reddetti. Her iki taraf da şimdi kuvvetlerini seferber etti ve bölgede savaş kaçınılmaz görünüyor.\n\nDışişleri Bakanlığı, bölgedeki çıkarlarımızı savunmak için bir müdahale hazırlamanın zorunlu olduğuna inanıyor. Ayrıca, sadece bizim müdahil olma tehdidimizin bile diğer tarafı müzakere masasına getirme şansı var."
 DOD_hungary.60.t:0 "Balkan Krizi"
 DOD_hungary.61.a:0 "Onlara karşı durmayı umamayız."
 DOD_hungary.61.b:0 "Şimdi geri adım atamayız."
 DOD_hungary.61.c:0 "Arabuluculuk iste."
 DOD_hungary.61.desc:0 "[From.GetAdjective] büyükelçisi bu sabah Dışişleri Bakanlığımıza gelerek hükümetinin mevcut krizi büyük bir endişeyle izlediğini bildirdi. Transilvanya yüzünden savaş riskine girme kararımız, [From.GetNameAdj] hükümetini Macaristan tarafında askeri bir müdahaleyi düşünmeye zorladı."
 DOD_hungary.61.t:0 "Balkan Krizi - [From.GetNameDef] Macaristan'ı Destekliyor"
 DOD_hungary.62.a:0 "Boyun eğmeliyiz."
 DOD_hungary.62.b:0 "Bu savaş onlar buraya gelmeden bitecek."
 DOD_hungary.62.c:0 "Arabuluculuk iste."
 DOD_hungary.62.desc:0 "[From.GetNameDef] büyükelçimiz istişareler için çağrıldı. Toplantı sırasında, [From.GetNameDef]'in Romanya'nın toprak bütünlüğünü kendi ulusal çıkarı olarak gördüğü kendisine bildirildi. Özellikle Ploesti'deki petrol kuyuları [From.GetNameDef] için çok önemli. Transilvanya'nın elimize geçmesi veya Romanya'yı bir bütün olarak işgal etmeye çalışmamız durumunda, petrol tedariki büyük ölçüde tehlikeye girecektir. [From.GetAdjective] hükümeti bu riski kabul etmeye açıkça isteksiz ve savaş çıkması durumunda Romanya tarafında askeri bir müdahale tehdidinde bulunacak kadar ileri gitti."
 DOD_hungary.62.t:0 "Balkan Krizi - [From.GetNameDef] Romanya'yı Destekliyor"
 DOD_hungary.63.a:0 "Herkes tarafından ihanete uğradık!"
 DOD_hungary.63.b:0 "Topraklarımızı geri alacağız ya da bu uğurda öleceğiz!"
 DOD_hungary.63.desc_HUN_nothing:0 "Transilvanya konulu konferansın sonucu tam bir felaket oldu. Bilinmeyen nedenlerle, Transilvanya'nın tamamının Romanya'da kalmasına karar verildi. Nihai antlaşmada etnik Macarların haklarını koruması gereken bazı hükümler olsa da, tam bir diplomatik hezimete uğradığımıza şüphe yok."
 DOD_hungary.63.desc_HUN_refused:0 "Tüm çabalarımıza rağmen, taleplerimiz için herhangi bir destek sağlayamadık. Başvurduğumuz her ulus bizi reddetti ve Transilvanya'nın Romanya'nın bir parçası olduğu gerçeğini kabul etmemiz gerektiğini söyledi. \n\nİnsan kabul edilemezi nasıl kabul eder?"
 DOD_hungary.63.t:0 "Arabuluculuk başarısız oldu"
 DOD_hungary.64.a:0 "Kara bir gün."
 DOD_hungary.64.b:0 "Hala savaşabiliriz."
 DOD_hungary.64.desc_ROM_nothing:0 "Görünüşe göre antlaşmaların ve geleneklerin artık hiçbir değeri kalmamış. Transilvanya konulu konferans, tartışmalı toprakların tamamının Macaristan'a gitmesi gerektiğine karar verdi. Tüm sivil hizmet hala şokun etkisinde, ancak bir karar verilmeli - bu iğrençliği kabul mü edeceğiz, yoksa onunla savaşacak mıyız?"
 DOD_hungary.64.desc_ROM_refused:0 "Davamız için destek kazanmaya çok çalıştık, ancak görünüşe göre bu günlerde çok az ülke Versay ve Trianon tarafından yaratılan düzeni savunmaya önem veriyor. [HUN.GetLeader] gibi zorbalar etraftayken, önemli olan tek şey güç."
 DOD_hungary.64.t:0 "Arabuluculuk başarısız oldu"
 DOD_hungary.65.a:0 "Teklif o kadar da ileri gitmiyor."
 DOD_hungary.65.b:0 "Macarlar, tüm bölgeyi boyunduruk altına almadan önce durdurulmalı."
 DOD_hungary.65.desc:0 "Tartışmalı topraklar üzerindeki tahkim sonuçları hakkında bilgilendirildiğinde, [HUN.GetLeader] bunları kabul etmeyi reddetti. Ona göre, Macaristan'ın eski sınırlarının tam olarak restore edilmesinden daha azı, yaşayan veya ölü her Macar'a bir hakaret olarak kabul edilecektir.\n\nMüzakere ve diplomasi zamanının geçtiğini ve bu konunun artık tek bir şekilde çözülebileceğini söyleyerek daha da ileri gitti. \n\nRomanya hükümeti, daha önce kendilerini desteklemeyi kabul ettiğimizi göz önünde bulundurarak bu anlaşmazlıkta nerede durduğumuzu sordu."
 DOD_hungary.65.t:0 "Macaristan arabuluculuk sonucunu kabul etmeyi reddediyor"
 DOD_hungary.66.a:0 "Onlara zafer diliyoruz."
 DOD_hungary.66.b:0 "Onları desteklemeye istekli oluruz."
 DOD_hungary.66.desc:0 "Son konferansta müzakere edilen antlaşmanın şartları Romanya hükümeti tarafından kabul görmedi. [ROM.GetLeader]'in belgeyi yırtıp atmadan ve bu kadar aşağılayıcı bir şeyi imzalamaktansa kendi elini kesmeyi tercih edeceğini ilan etmeden önce belgenin tamamını bile okumadığı bildiriliyor.\n\nMacar hükümeti, haklı olarak kendilerinin ilan edilen şey için savaşmaya tamamen istekli olduklarını, ancak bu çatışmada nerede duracağımızı da sorduklarını açıkladı."
 DOD_hungary.66.t:0 "Romanya arabuluculuk sonucunu kabul etmeyi reddediyor"
 DOD_hungary.67.a:0 "Bu, ateş, kan ve çelikle çözülecek."
 DOD_hungary.67.desc:0 "Büyük Güçler arasındaki müzakereler, iki ulusun herhangi bir ortak zemin bulamaması nedeniyle tamamen çöktü. Herhangi bir uzlaşma çözümü girişimi, karşılıklı olarak kabul edilemez talepler tarafından raydan çıkarıldı. Delegasyonlar, konuyu çözümsüz bırakarak kendi ülkelerine geri döndüler."
 DOD_hungary.67.t:0 "Müzakereler çöküyor"
 DOD_hungary.68.a:0 "Tüm Transilvanya'yı Macaristan'a ver."
 DOD_hungary.68.b:0 "Kuzey Transilvanya'yı Macaristan'a ver."
 DOD_hungary.68.c:0 "Transilvanya Romanya'da kalsın."
 DOD_hungary.68.desc:0 "Her iki taraf da Transilvanya'yı kimin alacağına karar vermek için bize başvurdu. Dışişleri Bakanlığı şu özeti hazırladı:\n\n \"Mevcut durumda, Transilvanya'nın tamamının bir tarafa verilmesi tavsiye edilmez. Bir tarafı anlaşmayı reddedecek kadar aşağılamaktan kaçınmak için, sevilmeyen ancak her iki taraf için de kabul edilebilir, uzlaşmacı bir çözüm tercih edilmelidir.\""
 DOD_hungary.68.t:0 "Transilvanya Ödülü"
 DOD_hungary.69.a:0 "Kabul edilebilir bir sonuç. Zar zor."
 DOD_hungary.69.b:0 "Tek bir karış topraktan vazgeçmeyeceğiz!"
 DOD_hungary.69.desc:0 "Uzun saatler süren müzakerelerden sonra, bir tür çözüm yakın görünüyor. Kötü haber şu ki, Macaristan'a bir miktar toprak vermek zorunda kalacağız. Transilvanya'nın kuzey kısmı onlara gidecek, biz ise güney kısımlarını koruyacağız. Bu umduğumuz şey değil, ancak durumun gerçekçi bir değerlendirmesi bunun mümkün olan en iyi sonuç olduğunu gösteriyor."
 DOD_hungary.69.t:0 "Transilvanya Uzlaşması"
 DOD_hungary.7.a:0 "Halk reddetsin"
 DOD_hungary.7.b:0 "Halk kabul etsin"
 DOD_hungary.7.desc:0 "Macaristan'ın referandum teklifi bizi uluslararası alanda zor bir duruma soktu. Halkın seçim yapmasını engelliyor gibi görünemeyiz, ancak doğru olanı seçeceklerine de güvenemeyiz. Neyse ki, bu sorunu çözmenin yolları var. Referandumdan nasıl bir sonuç çıkmasını istiyoruz?"
 DOD_hungary.7.t:0 "Referanduma yön vermek"
 DOD_hungary.70.a:0 "İsteyebileceğimiz en iyisi bu."
 DOD_hungary.70.desc:0 "Sabahın erken saatlerinde, konferanstaki delegasyonlar bir uzlaşma sağlamayı başardılar. Bu şartlar altında, biz Kuzey Transilvanya'yı alırken, bölgenin güney kısımları Romanya'da kalacak. Romanya delegasyonu bunu zaten kabul etti. Dışişleri Bakanlığı, teklifi kabul etmemenin bizi diplomatik olarak izole edeceği konusunda uyarıyor."
 DOD_hungary.70.t:0 "Transilvanya Uzlaşması"
 DOD_hungary.71.a:0 "Tüm Transilvanya'yı Macaristan'a verin."
 DOD_hungary.71.b:0 "Kuzey Transilvanya'yı Macaristan'a verin."
 DOD_hungary.71.c:0 "Transilvanya Romanya'da kalsın."
 DOD_hungary.71.desc:0 "Diplomatik protokol bir kenara bırakıldıktan sonra, Macaristan, Romanya ve [ROM_mediator.GetNameDef] delegasyonları eldeki konuyu görüşmek üzere oturdular. Macar tarafının temsilcileri olarak, ilk teklifi yapmamıza izin verildiği konusunda anlaşıldı."
 DOD_hungary.71.t:0 "Transilvanya Konferansı - 1. Gün"
 DOD_hungary.72.a:0 "Teklifi kabul et."
 DOD_hungary.72.b:0 "Daha iyi şartlar için bastır."
 DOD_hungary.72.desc_HUN_all:0 "Macar tarafı, yaklaşan krizi çözmek için bize bir teklif sundu. Şaşırtıcı olmayan bir şekilde, Transilvanya'nın tamamının mümkün olan en kısa sürede Macaristan'a devredilmesini talep ettiler. Bu teklifi kabul edebiliriz, ancak bu şüphesiz Rumen müttefiklerimizi üzecektir. \n\nKarşı bir teklif de yapabiliriz. Baş Diplomatımız şiddetle ikincisini öneriyor. Bir uzlaşma çözümü belki de her iki taraf için daha kabul edilebilir olacaktır."
 DOD_hungary.72.desc_HUN_nothing:0 "Macar tarafı şaşırtıcı bir şekilde uzlaşmacı şartlar sundu. Tüm Transilvanya, etnik azınlıklar için bazı küçük tavizler karşılığında Romanya'da kalacaktı. Rumen temsilcisi, bu teklifi kabul etmemizi şiddetle tavsiye ediyor ve kabul edilmesi halinde tavizlerin günler içinde uygulanacağına söz veriyor."
 DOD_hungary.72.desc_compromise:0 "Macar tarafı, yaklaşan krizi çözmek için bize bir teklif sundu. Tekliflerinde, Transilvanya'nın kuzey kısmı Macaristan'a verilecek, güney kısımları ise Romanya'da kalacaktı. \n\nBaş Diplomatımız, bunun Macar tarafının gözünün korktuğunu gösterdiğine ve daha da iyi şartlar için bastırmamız gerektiğine inanıyor."
 DOD_hungary.72.t:0 "Transilvanya Konferansı - 2. Gün"
 DOD_hungary.73.a:0 "Tüm Transilvanya'yı Macaristan'a verin."
 DOD_hungary.73.b:0 "Kuzey Transilvanya'yı Macaristan'a verin."
 DOD_hungary.73.c:0 "Transilvanya Romanya'da kalsın."
 DOD_hungary.73.desc:0 "Macar teklifini reddetmeye karar verdikten sonra, şimdi farklı şartlar sunmak bize kalmış."
 DOD_hungary.73.t:0 "Transilvanya Konferansı - 3. Gün"
 DOD_hungary.74.a:0 "Kabul ediyoruz."
 DOD_hungary.74.b:0 "Bu başarısızlığın sonuçları onların elinde!"
 DOD_hungary.74.desc_HUN_all:0 "Rumen tarafı, önceki uzlaşmacı teklifimizi reddedip bunun yerine tüm Transilvanya'yı Macaristan'a devretmeyi teklif ettikleri için konuyu bitirme konusunda büyük bir endişe duyuyor gibi görünüyor. Özel görüşmelerde, delegasyonlarımız neden böyle bir teklif yapacaklarına dair bir neden bulamadılar, ancak samimi görünüyor. Bunu kabul etmeliyiz."
 DOD_hungary.74.desc_HUN_nothing:0 "Şaşırtıcı olmayan bir şekilde, Rumen tarafı Transilvanya konusunda geri adım atmadı. Tüm Transilvanya'yı Romanya'da tutmaya tamamen kararlı görünüyorlar. Müzakerelerin bu aşamasında yapabileceğimiz çok az şey var - ya tekliflerini kabul ederiz ya da çekiliriz."
 DOD_hungary.74.desc_compromise:0 "Rumenler, Transilvanya'yı ikiye bölen bir uzlaşma çözümü teklif ettiler. İki ülke arasındaki gerginlikler göz önüne alındığında, bu mümkün olan en iyi çözüm olabilir."
 DOD_hungary.74.t:0 "Transilvanya Konferansı - 4. Gün"
 DOD_hungary.75.a:0 "Elimizden geleni yaptık."
 DOD_hungary.80.a:0 "Bir savaşı kazanmayı umamayız. Toprağı verin."
 DOD_hungary.80.b:0 "Müttefiklerimize başvurun."
 DOD_hungary.80.c:0 "Almanya'ya başvurun."
 DOD_hungary.80.d:0 "Zorbalığa boyun eğmeyeceğiz!"
 DOD_hungary.80.desc:0 "Macar hükümeti bize başvurarak, bölgedeki Macarlara kötü muamele yapıldığını ileri sürerek güney Slovakya'yı kendilerine teslim etmemizi istedi. Aynı zamanda, Macaristan'dan sınırı geçmeye çalışan \"Yırtık Muhafızlar\" adlı terör örgütünün üyeleri de tutuklandı. Bu kişiler Macar hükümetiyle hiçbir ilgilerinin olmadığını iddia ederken, resmi Macar işaretleri taşıyan ekipmanlarla birlikte bulundular. \n\nSavaş havada, ancak büyük bir ulusun desteğini güvence altına alabilirsek diplomatik bir çözüme ulaşmayı başarabiliriz."
 DOD_hungary.80.t:0 "Macaristan Güney Slovakya'yı Talep Ediyor"
 DOD_hungary.81.a:0 "Güzel."
 DOD_hungary.81.desc:0 "[From.GetName] güney Slovakya'yı teslim etti ve kuvvetlerini sınır hattının gerisine çekti. Artık bölgenin tam kontrolü bizde."
 DOD_hungary.81.t:0 "[From.GetNameDefCap] Güney Slovakya'yı İade Ediyor"
 DOD_hungary.82.a:0 "Destek alacaklar."
 DOD_hungary.82.b:0 "Bu bizim savaşımız değil."
 DOD_hungary.82.desc:0 "[CZE.GetName] büyükelçisi acil bir yardım talebiyle bize geldi. Son zamanlarda, [HUN.GetNameDef] güney Slovakya'yı hedef alan büyük bir istikrarsızlaştırma kampanyası başlattı. Amaçları açık - vatandaşları olarak gördükleri insanları korumak için bir işgal bahanesi yaratmak istiyorlar. \n\n[CZE.GetAdjective] hükümeti bu konuda desteğimizi istedi."
 DOD_hungary.82.t:0 "[CZE.GetName] yardım için başvuruyor."
 DOD_hungary.83.a:0 "Macaristan'a devam etmesini söyle."
 DOD_hungary.83.b:0 "Macaristan'a geri çekilmesini söyle."
 DOD_hungary.83.desc:0 "[SLO.GetName] son zamanlarda [HUN.GetNameDef]'den, geçmişte Macaristan'a ait olan güney sınırlarındaki bölgeleri geri vermesi için ağır bir baskı altına girdi. [HUN.GetAdjective] hükümeti, eğer gerekirse, bunun için savaşmaya oldukça istekli olduklarını belirtti. \n\nBu kadar küçük bir şey yüzünden o bölgede bir savaşın patlak vermesini göze alamayız ve diplomatik bir çözüm için bastırmalıyız."
 DOD_hungary.83.t:0 "[SLO.GetName] yardım için başvuruyor."
 DOD_hungary.84.a:0 "Şansımız olacak, ama o şimdi değil."
 DOD_hungary.84.b:0 "O zaman istediklerini vereceğiz."
 DOD_hungary.84.desc:0 "[From.GetName], bölgenin her zaman [From.GetName]'nin bir parçası olduğu ve \"Son adama, son mermiye, son nefese kadar\" savunulacağı konusunda ısrar ederek taleplerimizi tartışmayı bile reddetti."
 DOD_hungary.84.t:0 "[From.GetName] reddediyor."
 DOD_hungary.85.a:0 "Ulusal kendi kaderini tayin etme fikrine de bu kadar."
 DOD_hungary.85.b:0 "Bizim olanı alacağız."
 DOD_hungary.85.desc:0 "[From.GetNameDef] hükümeti, Slovakya'nın toprak bütünlüğünün tartışmaya açık olmadığını bize bildirdi. Ayrıca, bölgedeki düzenli veya düzensiz kuvvetlerimizi geri çekmemiz, aksi takdirde sonuçlarıyla yüzleşmemiz talimatı verildi."
 DOD_hungary.85.t:0 "[From.GetNameDefCap] güney Slovakya ile ilgili uyarı yayınladı"
 DOD_hungary.86.a:0 "Sadece sıcak sözlerle bir savaş kazanamayız."
 DOD_hungary.86.b:0 "O zaman tek başımıza savaşacağız."
 DOD_hungary.86.desc:0 "[From.GetAdjective] hükümeti, bariz [HUN.GetAdjective] saldırganlığı karşısında bizi destekleme talebimizi reddetti. Davamıza sempati duysalar da, savunması için kan veya hazine riske atmaya istekli değiller."
 DOD_hungary.86.t:0 "[From.GetNameDefCap] bizi desteklemeyi reddediyor"
 DOD_hungary.90.a:0 "Bu kazanabileceğimiz bir çatışma değil."
 DOD_hungary.90.b:0 "Onların sanrılarını desteklemeyeceğiz."
 DOD_hungary.90.desc:0 "[HUN.GetAdjective] hükümeti, Voyvodina'nın İmparatorluk döneminde Macaristan'ın bir parçası olduğunu ve bu nedenle iade edilmesi gerektiğini belirterek, Voyvodina konusunda daha fazla baskı uygulamaya başladı. Büyük Savaş'ın sonunda Sırbistan ile birleşmenin \"dış baskı nedeniyle geçersiz\" olduğunu ve bu nedenle bölgenin hala yasal olarak [HUN.GetAdjective] olduğunu iddia ediyorlar."
 DOD_hungary.90.t:0 "[HUN.GetNameDefCap] [45.GetName]'i Talep Ediyor"
 DOD_hungary.91.a:0 "Güzel."
 DOD_hungary.91.desc:0 "\n[FROM.GetNameDef], Voyvodina'yı bize devretmeyi kabul etti. Kuvvetlerimiz tam kontrolü ele aldı."
 DOD_hungary.91.t:0 "[FROM.GetNameDefCap] Voyvodina'yı devrediyor"
 DOD_hungary.92.a:0 "Belki de öyledir."
 DOD_hungary.92.b:0 "Almanya'dan destek iste."
 DOD_hungary.92.c:0 "İtalya'dan destek iste."
 DOD_hungary.92.d:0 "Almanya ve İtalya'ya başvur."
 DOD_hungary.92.desc:0 "[FROM.GetLeader] ile yapılan gergin bir toplantıda, delegasyonumuza Voyvodina'nın egemenliğinin tartışmaya açık olmadığı ve her halükarda [FROM.GetAdjective] hükümetinin bu tür bir baskıya asla boyun eğmeyeceği söylendi. Voyvodina halkı 1919'da sözünü söyledi ve [FROM.GetNameDef] ile kalmayı seçti. [FROM.GetAdjective] hükümetine göre, bu meselenin sonudur."
 DOD_hungary.92.e:0 "Bunu tek başımıza bitireceğiz."
 DOD_hungary.92.t:0 "[From.GetNameDefCap] taleplerimizi reddediyor."
 DOD_hungary.93.a:0 "Tam desteğimizi alacaklar."
 DOD_hungary.93.b:0 "Bu meseleye karışmayacağız."
 DOD_hungary.93.desc:0 "Zürih'te toplanan [HUN.GetAdjective] hükümetinin temsilcileri, [YUG.GetNameDef]'e karşı ortak eylem konusunda nabzımızı yokladılar. [YUG.GetAdjective] hükümeti şimdiye kadar [HUN.GetAdjective]'in Büyük Savaş sonunda [YUG.GetNameDef] tarafından ilhak edilen toprakları iade etme taleplerini reddetti. Bizim de [YUG.GetNameDef] ile tartışmalı topraklarımız olduğunu göz önünde bulundurarak, güçlerimizi birleştirip güçlü bir ültimatom verebiliriz, ancak bu bizi bu konuda savaşa girmeye zorlayabilir."
 DOD_hungary.93.t:0 "Macaristan Yugoslavya'nın yeniden düzenlenmesini öneriyor"
 DOD_hungary.94.a:0 "Belgrad'a bir ültimatom gönderin!"
 DOD_hungary.94.b:0 "Şimdi saldırın!"
 DOD_hungary.94.desc:0 "\n[From.GetNameDef] ile gayriresmi kanallar aracılığıyla yapılan müzakereler, prensipte, Yugoslavya'nın ya tamamen dağıtılması ya da en azından ciddi şekilde küçültülmesi gerektiği konusunda bir anlaşmaya yol açtı. \n\nYeni destekçilerimizle, artık [YUG.GetAdjective] hükümetiyle ezici bir güç konumundan müzakere edebiliriz. Ayrıca, Yugoslav ordusu hala hazırlıksızken sorunu güçle çözmeyi de seçebiliriz."
 DOD_hungary.94.t:0 "[From.GetNameDefCap] Yugoslavya'ya karşı destek sunuyor"
 DOD_hungary.95.a:0 "Yazık."
 DOD_hungary.95.b:0 "O zaman tek başımıza devam edeceğiz!"
 DOD_hungary.95.desc:0 "\nBirkaç tur müzakereden sonra [From.GetAdjective] hükümetiyle Yugoslavya'nın yeniden düzenlenmesi konusunda herhangi bir anlaşmaya varılamadı. Bizzat [From.GetLeader] tarafından imzalanan bir notta, çözülmemiş bölgesel sorunların \"durum gerektirdiğinde\" ikili temelde çözüleceği belirtiliyor."
 DOD_hungary.95.t:0 "[From.GetNameDefCap] teklifimizi reddediyor"
 DOD_hungary.96.a:0 "Kabul etmekten başka seçeneğimiz yok."
 DOD_hungary.96.b:0 "Savaşta ölmeyi tercih ederiz!"
 DOD_hungary.96.desc_HUN_GER:0 "Durumu yatıştırmak yerine, Macaristan'ın Voyvodina'ya ilişkin son taleplerine verdiğimiz güçlü yanıt, görünüşe göre Macaristan ile Almanya arasında bir anlaşma yapılmasına yol açtı. Yakın zamanda yapılan bir konuşmada [GER.GetLeader], Slovenya'yı \"Reich'ın eski, kurtarılmamış eyaletlerinden biri\" ve mümkün olan en kısa sürede geri alınması gerektiğini söyledi. Macar ve Alman büyükelçisi, Voyvodina ve Slovenya'nın derhal kendi kontrollerine devredilmesi yönünde bir nota verdiler."
 DOD_hungary.96.desc_HUN_ITA:0 "Durumu yatıştırmak yerine, Macaristan'ın Voyvodina'ya ilişkin son taleplerine verdiğimiz güçlü yanıt, görünüşe göre Macaristan ile İtalya arasında bir anlaşma yapılmasına yol açtı. Yakın zamanda yapılan bir konuşmada [ITA.GetLeader] Dalmaçya'dan \"Adriyatik'in kurtarılmamış uzak kıyısı\" olarak bahsetti. Macar ve İtalyan büyükelçisi, Voyvodina ve Dalmaçya'nın derhal kendi kontrollerine devredilmesi yönünde bir nota verdiler."
 DOD_hungary.96.desc_HUN_both:0 "Macar taleplerine boyun eğmeyi reddetmemiz Budapeşte'de bir fikir değişikliğine yol açmadı. Macar başkentinden gelen öfkeli söylemler şimdi Roma ve Berlin'den gelen eşit derecede rahatsız edici açıklamalarla eşleşiyor. Her iki ulus da Macar pozisyonuna desteklerini ifade ederken, aynı zamanda kendi talep setlerini de açıkladılar. Üç ülkenin büyükelçileri, Voyvodina, Slovenya ve Dalmaçya'nın ilgili talep sahiplerine devredilmesini talep eden bir notayı resmi olarak teslim etmek üzere Dışişleri Bakanlığı'nda birlikte göründüler."
 DOD_hungary.96.t:0 "Budapeşte'den Ültimatom"
 DOD_hungary.97.a:0 "Öyleyse savaş olsun."
 DOD_hungary.97.desc:0 "Ezici ihtimallerle karşı karşıya olmalarına rağmen, [YUG.GetAdjective] hükümeti mantığı görmeyi reddetti ve temsilcilerimize, eğer askeri bir çözüm ararsak, [YUG.GetAdjective] ordusunu iyi hazırlanmış ve hazır bulacağımızı söyledi."
 DOD_hungary.97.t:0 "Yugoslavya meydan okuyor"
 DOD_romania.1.a:0 "Makul bir talep."
 DOD_romania.1.b:0 "İlgilenmiyoruz."
 DOD_romania.1.desc:0 "Romanya ile eski ittifak son yıllarda geçerliliğini yitirmişti. Almanya ve Macaristan tehdidi uzak görünüyordu. Ancak değişen durum karşısında, [ROM.GetLeader] Romanya-Polonya İttifakı'nın yenilenmesini görüşmek üzere Varşova'ya geldi. Şimdilik bu anlaşma sadece savunma niteliğinde olup, her iki taraf da savaş durumunda birbirini desteklemeye söz veriyor."
 DOD_romania.1.t:0 "Romanya İttifakı Yenilemek İstiyor"
 DOD_romania.10.a:0 "Birlik içindeyiz."
 DOD_romania.10.b:0 "Tarafsızlık en iyi savunmadır."
 DOD_romania.10.desc:0 "Başlangıçta Komünizmin yayılmasını kontrol altına almak ve Kızıl Ordu'nun Avrupa'ya yürümesini engellemek amacıyla tasarlanan Sıhhi Kordon fikri, son zamanlarda [ROM.GetLeader] tarafından [GER.GetNameDef] ve [SOV.GetNameDef]'in diplomatik dışlanmışlarını ayrı tutmak için yeniden canlandırıldı.\n\nRumenler, onlarla resmi bir ittifaka katılma konusunda nabzımızı yokladı."
 DOD_romania.10.t:0 "Sıhhi Kordon"
 DOD_romania.11.a:0 "Güzel."
 DOD_romania.11.desc:0 "[From.GetLeader] hükümeti, Sıhhi Kordon'a desteğini açıkladı. [From.GetNameDef]'den bir heyet, ittifakımıza katılmanın ayrıntılarını görüşmek ve savaş durumunda askeri destek planları düzenlemek için geldi."
 DOD_romania.11.t:0 "[From.GetNameDefCap] Sıhhi Kordona Katılmayı Kabul Ediyor"
 DOD_romania.110.a:0 "Fırsatı değerlendirmeliyiz."
 DOD_romania.110.b:0 "Kendi başımıza alabilecekken neden müzakere edelim?"
 DOD_romania.110.desc:0 "[ROM.GetLeader], [CZE.GetNameDef] ile başa çıkma teklifiyle bize yaklaştı. Bölgedeki ortak çıkarlarımızı belirterek, ülkenin üçe bölünmesini öneriyor: Biz batı kısımlarını alırken, Romanya Slovakya'yı kontrol edecek ve Macaristan'a güney sınırında küçücük bir toprak parçası verilecek."
 DOD_romania.110.t:0 "Romanya [CZE.GetNameDef]'i bölmeyi teklif ediyor"
 DOD_romania.111.a:0 "Bir nota gönderelim."
 DOD_romania.111.desc:0 "Alman hükümeti antlaşma taslağımızı ve önerilen sınır hatlarını onayladı. Geriye sadece Prag'a bir ültimatom göndermek kalıyor."
 DOD_romania.111.t:0 "[GER.GetLeader] kabul ediyor"
 DOD_romania.113.a:0 "Yaklaşımımızı yeniden düşünme zamanı."
 DOD_romania.113.b:0 "Tek başımıza saldıracağız."
 DOD_romania.113.desc:0 "[GER.GetLeader] ile yapılan öfkeli bir toplantıda, büyükelçimiz [CZE.GetNameDef] ile ilgili herhangi bir şeyi tartışmayı veya müzakere etmeyi kesin bir dille reddetmekle karşılaştı. Alman hükümeti o ülkeyi tamamen kendi nüfuz alanı olarak görüyor ve herhangi bir müdahalenin [GER.GetLeader]'in açık isteklerine aykırı sayılacağı konusunda uyardı."
 DOD_romania.113.t:0 "[GER.GetLeader] reddediyor"
 DOD_romania.114.a:0 "Başka seçeneğimiz yok."
 DOD_romania.114.b:0 "Şerefsizliktense ölümü seçeriz."
 DOD_romania.114.desc:0 "Alman birlikleri sınırlarımızda toplanırken, Almanya ve Romanya Büyükelçileri ortak bir ültimatom yayınladı: Slovakya'yı Macaristan ve Romanya'ya devretmeyi ve Almanya'nın bir 'Protektorası' olmayı kabul etmezsek, Alman Luftwaffe'si Prag'ı 'yok etmeye' hazır beklerken, Macar birlikleri güneyden ülkemizi işgal etmeye hazırlanıyor."
 DOD_romania.114.t:0 "Alman Ültimatomu"
 DOD_romania.115.a:0 "Seçeneklerimizi değerlendireceğiz."
 DOD_romania.115.desc:0 "[CZE.GetAdjective] hükümeti ültimatomumuzu görmezden geldi ve ordusunu seferber etti. [CZE.GetLeader], herhangi bir işgalcinin orduyu ülkeyi son adama kadar savunmaya fazlasıyla hazır bulacağına söz verdi."
 DOD_romania.115.t:0 "[CZE.GetLeader] meydan okuyor"
 DOD_romania.12.a:0 "Ne kadar kaba."
 DOD_romania.12.desc:0 "[From.GetNameDef] ile ittifakımıza katılma konusundaki müzakereler çöktü. [From.GetNameDef]'den gelen heyet, ittifakımıza katılmanın bir ön koşulu olarak geniş kapsamlı askeri destek taahhütleri de dahil olmak üzere kapsamlı bir talep listesi sundu.\n\nGenelkurmay, karşılanması imkansız olduğu gerekçesiyle bu talepleri reddetti ve Dışişleri Bakanlığı şimdi bunun [From.GetLeader] tarafından teklifimizi sorumlu görünmeden geri çevirmek için kasıtlı bir hamle olduğuna inanıyor."
 DOD_romania.12.t:0 "[From.GetNameDefCap] reddediyor."
 DOD_romania.120.a:0 "Daha hızlı araçlar için Vauxhall."
 DOD_romania.120.b:0 "Güvenilir Alman mühendisliği için Opel."
 DOD_romania.120.c:0 "Seri üretim için Ford."
 DOD_romania.120.desc:0 "Birkaç yabancı kamyon şirketi, ticari pazarın yanı sıra ordu için de yeni kamyonlar üretmek üzere Romanya'da bir fabrika açmakla ilgilendiğini ifade etti. Birini seçmek, daha fazla üretim lisansının alınmasıyla takip edilebilecek bir amiral gemisi anlaşması olarak kabul edilecek.\n\nKime yaklaşmalıyız?"
 DOD_romania.120.t:0 "Yabancı Motor Şirketlerini Davet Et"
 DOD_romania.16.a:0 "Hoş geldiniz, [FROM.GetAdjective] dostlar!"
 DOD_romania.16.desc:0 "Şu anda [romania_former_ally_target.GetNameDef] ile aynı hizada olmasına rağmen, [FROM.GetAdjective] hükümetindeki değişiklikler ulusu [ROOT.GetAdjective] idealleriyle daha uyumlu hale getirdi ve [FROM.GetLeader], [ROOT.GetFactionName]'e katılmakla ilgilendiğini ifade etti. Bu tarihi bir fırsat, düşmanın sırtı [FROM.GetNameDef]'e dönükken, bekleyecekleri en son şey [FROM.GetAdjective] birliklerinin silahlarını onlara çevirmesidir."
 DOD_romania.16.t:0 "[FROM.GetNameDefCap] [ROOT.GetFactionName]'e Katılmak İstiyor"
 DOD_romania.161.a:0 "[FROM.GetLeader]'e güvenilmemesi gerektiğini bilmeliydik!"
 DOD_romania.161.desc:0 "Ne yazık ki, [FROM.GetAdjective] dışişleri bakanı [FROM.GetNameDef]’in mesajını iletti ki bu, şüphesiz, [ROOT.GetFactionName] ve [ROOT.GetRulingIdeology] ideallerine açık bir ihanettir! [FROM.GetNameDefCap] şimdi [romania_new_ally_target.GetFactionName] için savaşacağını ilan etti."
 DOD_romania.161.t:0 "[FROM.GetNameDefCap] [ROOT.GetNameDef]'e İhanet Ediyor!"
 DOD_romania.162.a:0 "Silah başına!"
 DOD_romania.162.desc:0 "[romania_new_ally_target.GetNameDef]'in [romania_new_ally_target.GetFactionName]'e giriş talebimizi kabul ettiği ve yakında [romania_former_ally_target.GetLeader]'in gerçek bir [ROOT.GetAdjective] askerinin nasıl savaştığını öğreneceği bize bildirildi."
 DOD_romania.162.t:0 "[romania_new_ally_target.GetNameDefCap] Kabul Ediyor!"
 DOD_romania.163.a:0 "Gitti, ama unutulmadı."
 DOD_romania.163.desc:0 "Codreanu, Rumen devletinin geleceği için bir tehditti. Pervasız eylemleri, istikrar adına tutuklanma sebebiydi. Ölümü, iyi bir örnek ya da korkunç bir uyarı olmayı seçebileceğinize dair değerli bir hatırlatma olarak hizmet edecektir. Romanya'nın faşistlerini daha ölçülü ve sorumlu bir lider bekliyor."
 DOD_romania.163.t:0 "Codreanu Öldü"
 DOD_romania.2.a:0 "Güzel."
 DOD_romania.2.desc:0 "Varşova'daki delegasyonumuz, [POL.GetLeader] tarafından imzalanmış bir yardım antlaşmasıyla geri döndü. Artık savaş çıkması durumunda birbirimizi savunmakla yükümlüyüz."
 DOD_romania.2.t:0 "[From.GetNameDefCap] bir ittifakı kabul ediyor"
 DOD_romania.20.a:0 "Garantilerini alacaklar."
 DOD_romania.20.b:0 "Bu bizi daha da zayıflatır."
 DOD_romania.20.desc:0 "Birkaç aydır, sadece petrollerini düşman elinden uzak tutmak için bile olsa, [ROM.GetNameDef] ile bir ittifak sağlamaya çalışıyoruz. Şimdi [ROM.GetLeader], bir savaş durumunda resmi bir askeri destek garantisinin, hükümetinin ittifakımıza katılmayı bile düşünmeden önce gerekli bir adım olduğunu ilan etti."
 DOD_romania.20.t:0 "Romanya garanti talep ediyor"
 DOD_romania.21.a:0 "Güzel."
 DOD_romania.21.desc:0 "Romanya-[From.GetAdjective] Dostluk Derneği toplantısından önce konuşan [From.GetLeader], Romanya'nın mevcut sınırlarının 'değiştirilemez ve kalıcı' olduğunu açıkladı ve hükümetinin savaş çıkması durumunda onları savunmak için elinden gelen her şeyi yapacağına söz verdi."
 DOD_romania.21.t:0 "[From.GetNameDefCap] Romanya sınırlarını garanti ediyor"
 DOD_romania.22.a:0 "Sert."
 DOD_romania.22.desc:0 "Son diplomatik atağımız [From.GetNameDef] tarafından soğuk bir retle karşılandı. Parlamentodan önce konuşan [From.GetLeader], Romanya'ya resmi bir garanti sorununun 'ilgili hale gelirse ve geldiğinde kararlaştırılacağını' belirtti."
 DOD_romania.22.t:0 "[From.GetNameDefCap] Garantiyi Reddediyor"
 DOD_romania.3.a:0 "Talihsizlik."
 DOD_romania.3.desc:0 "[From.GetLeader], Varşova'daki delegasyonumuzla görüşmeyi reddetti ve sadece Romanya ile daha yakın bir ilişkinin 'şu anda [From.GetAdjective] hükümetinin çıkarına olmadığını' belirten kısa bir mesaj gönderdi.\n\nDaha fazla açıklama taleplerine yanıt verilmedi."
 DOD_romania.3.t:0 "[From.GetNameDefCap] ittifakı reddediyor"
 DOD_romania.30.a:0 "Garantilerini alacaklar."
 DOD_romania.30.b:0 "Emperyalistlerle anlaşma olmaz!"
 DOD_romania.30.desc:0 "Avrupa'da gerilim artarken, [ROM.GetLeader] şaşırtıcı bir teklifle bize geldi: Eğer Romanya'yı herhangi bir dış tehditten korumayı taahhüt edersek, Romanya topraklarında asker konuşlandırmamıza izin verilecek. \n\nİyi niyet göstergesi olarak, [ROM.GetLeader] Komünist Parti üzerindeki kısıtlamaları da gevşetti."
 DOD_romania.30.desc_alt:0 "Avrupa'da gerilim artarken, [ROM.GetLeader] şaşırtıcı bir teklifle bize geldi: Eğer Romanya'yı herhangi bir dış tehditten korumayı taahhüt edersek, Romanya topraklarında asker konuşlandırmamıza izin verilecek."
 DOD_romania.30.t:0 "Romanya üs teklif ediyor"
 DOD_romania.31.a:0 "Umarım bundan pişman olmayız."
 DOD_romania.31.desc:0 "[SOV.GetLeader], [SOV.GetSovietArmyAdjectiveBasedOnIdeology] Ordusuna savaş durumunda Romanya'nın savunmasını planlaması için bizzat emir verdi. Garnizon birliklerinin yakında gelişi için üsleri ve hava alanlarını hazırlamak üzere küçük bir askeri heyet geldi."
 DOD_romania.31.t:0 "[From.GetNameDefCap] teklifi kabul ediyor"
 DOD_romania.32.a:0 "Gerçekten de rahatsız edici."
 DOD_romania.32.desc:0 "[SOV.GetAdjective] birliklerinin Romanya'da üslenmesi hakkındaki görüşmeler sadece birkaç saat sonra sona erdi ve [SOV.GetAdjective]ler sınırlarımızı garanti etmekle ilgilenmediklerini beyan ettiler.\n\nGenerallerimizin birçoğu, bunun mevcut şeklini beğenmedikleri ve değiştirmek istedikleri için olabileceğine dair rahatsız edici çıkarımı hemen kavradı."
 DOD_romania.32.t:0 "[From.GetNameDefCap] teklifimizi reddediyor"
 DOD_romania.40.a:0 "Taleplerine boyun eğmeliyiz."
 DOD_romania.40.b:0 "Şerefsizliktense ölüm!"
 DOD_romania.40.desc:0 "[ROM.GetNameDef] büyükelçimiz aceleyle [ROM.GetLeader]'in ofisine çağrıldı. Romanya ordusunun ortak sınırımıza doğru son hareketleri hakkında soru soramadan önce kendisine bir ültimatom sunuldu. [BUL.GetNameDefCap], diye ısrar etti [ROM.GetLeader], artık onun açık rızası olmadan hareket etmesine izin verilemezdi ve her büyük politika kararını onun onayına sunmalıydı.\n\nReddetmek güçle karşılanacaktı."
 DOD_romania.40.t:0 "Rumen baskısı"
 DOD_romania.41.a:0 "Güzel."
 DOD_romania.41.desc:0 "[BUL.GetNameDefCap] taleplerimizi kabul etti ve artık herhangi bir siyasi karar almadan önce bize danışıyor.\n\nHükümetleriyle koordine olmak için Sofya'ya Özel bir Temsilci geldi."
 DOD_romania.41.t:0 "[From.GetNameDefCap] boyun eğiyor"
 DOD_romania.42.a:0 "Bu kan dökmeye değmez."
 DOD_romania.42.b:0 "Bakalım haklı mı."
 DOD_romania.42.desc:0 "Talep listemizle karşılaştığında, [BUL.GetLeader]'in güldüğü ve ardından kağıdı yırttığı, hiçbir Rumen ordusunun savaşta bir Bulgar ordusunu asla yenemeyeceğini iddia ettiği bildiriliyor."
 DOD_romania.42.t:0 "[From.GetNameDefCap] meydan okuyor"
 DOD_romania.50.a:0 "Başka seçeneğimiz yok."
 DOD_romania.50.b:0 "Bazı tavizler verebiliriz."
 DOD_romania.50.c:0 "Köle olarak yaşamaktansa özgür ölmek daha iyidir."
 DOD_romania.50.desc:0 "[ROM.GetLeader], sadece Rumen çıkarına olduğu için [HUN.GetAdjective] hükümetinin herhangi bir atamasını veto etmesine izin verilmesi gerektiğini kamuoyuna talep ettiğinde, diplomatik servisteki çoğu kişi bunu sadece iç kamuoyuna yönelik basit bir propaganda olarak değerlendirdi. \n\nBiraz sonra aynı etkiyi yaratan resmi bir nota aldığımızda bir miktar şaşırdık.\n\nUymamamız durumunda askeri güç tehdidi Genelkurmayı paniğe sevk etti ve Ordu Yüksek Komutanlığı, Rumenleri sınırda tutup tutamayacağımız konusunda ciddi şüpheler uyandırdı."
 DOD_romania.50.t:0 "Romanya hükümette değişiklik talep ediyor."
 DOD_romania.51.a:0 "Güzel."
 DOD_romania.51.desc:0 "Askeri direnişin hem imkansız hem de anlamsız olacağını fark eden Macar hükümeti, önerilerimizi takip etmeye ve kendisini emrimize amade kılmaya karar verdi. [HUN.GetLeader] herhangi bir büyük politika kararından önce bizimle istişare edeceğine söz verdi."
 DOD_romania.51.t:0 "[From.GetNameDefCap] Hizaya Geliyor"
 DOD_romania.52.a:0 "Kabul edilebilir bir uzlaşma."
 DOD_romania.52.b:0 "Kastettiğimiz bu değildi."
 DOD_romania.52.desc:0 "Macar hükümetindeki bazı değişiklikler için son talebimize yanıt olarak, [HUN.GetLeader] bir Dostluk ve Karşılıklı Yardım Antlaşması teklif etti; bu antlaşma onları savaş zamanlarında yardımımıza gelmeye mecbur bırakacak, ancak aynı zamanda Macar siyasetine müdahale etmeyeceğimize dair yemin edeceğimiz bir madde de içeriyor."
 DOD_romania.52.t:0 "[From.GetNameDefCap] Dostluk Antlaşması Teklif Ediyor"
 DOD_romania.53.a:0 "Bu zamana veya çabaya değmez."
 DOD_romania.53.b:0 "Zafer kesin. Savaşa!"
 DOD_romania.53.desc:0 "Silahlı kuvvetlerinin bariz zayıflığına rağmen, [HUN.GetLeader] mantığı görmeyi reddetti ve ordusuna sınırımız boyunca savunma pozisyonları almasını emretti. Bilinmeyen nedenlerle, ordularının önemli bir kısmının bu emirlere uyduğu görülüyor.\n\nGörünüşe göre bundan bir kavga çıkarmak istiyorlar."
 DOD_romania.53.t:0 "[From.GetNameDefCap] Meydan Okuyor"
 DOD_romania.60.a:0 "Onlara karşı durmayı umamayız."
 DOD_romania.60.b:0 "Asla!"
 DOD_romania.60.desc:0 "Rumen ordusu sınırlarımızda beklerken, amaçları hakkında söylentiler dolaşıyor. Bükreş'teki büyükelçimiz konuyu sorduğunda, [ROM.GetLeader]'in birleşik bir Yugoslavya'nın artık kendi çıkarına olmadığına karar verdiği açıkça söylendi. Bunun yerine, ulusumuz doğrudan Rumen kontrolü altında bir dizi bağımlı devlete bölünecek.\n\nBir saat içinde resmi bir ültimatom bekleniyor."
 DOD_romania.60.t:0 "Romanya radikal bir yeniden yapılanma talep ediyor"
 DOD_romania.601.a:0 "Mükemmel bir fikir!"
 DOD_romania.601.b:0 "Belki de bundan uzak durmalıyız."
 DOD_romania.601.desc:0 "[YUG.GetNameDef]'i karakterize eden iç çekişmeleri gözlemleyen [ROM.GetLeader], Yugoslav halkını birkaç yerel güce bölerek [ROM.GetLeader.GetHerHis] Balkan Hakimiyeti politikasını sürdürmeye karar verdi. [Root.GetNameDefCap], Yugoslavya'yı bölmeye davet edilen uluslar arasındadır ve bu, Balkan topraklarımızı genişletmek için cazip bir fırsat olsa da, Yugoslavya'nın ültimatomu reddetmesi durumunda çatışmaya katılmakla yükümlü olacağız."
 DOD_romania.601.t:0 "[FROM.GetName] [YUG.GetNameDef]'i Bölmek İstiyor"
 DOD_romania.61.a:0 "Güzel."
 DOD_romania.61.desc:0 "Belgrad'a verilen ültimatomun süresi dolmadan sadece birkaç dakika önce, Yugoslav hükümetinin dağıldığını ve yetkilerini, hepsi bize bağlılıklarını ilan eden bir dizi yerel yönetime devrettiğini belirten resmi bir bildiri geldi."
 DOD_romania.61.t:0 "[From.GetNameDefCap] pes ediyor"
 DOD_romania.62.a:0 "Onları alt edeceğiz."
 DOD_romania.62.b:0 "Destek isteyelim."
 DOD_romania.62.desc:0 "[YUG.GetAdjective] hükümeti ültimatomun süresinin bir yanıt vermeden dolmasına izin verdi. Keşif uçuşları, Yugoslavya sınırının Yugoslav tarafında birlik hareketleri ortaya çıkardı ve Genelkurmayı işgal planlarını gözden geçirmeye sevk etti. Üst düzey askeri danışmanlar, Yugoslavya'ya karşı bir zaferin hızlı bir şekilde kazanılacağını garanti etmeyi reddettiler."
 DOD_romania.62.t:0 "[From.GetNameDefCap] meydan okuyor"
 DOD_romania.63.a:0 "İlgi çekici bir plan."
 DOD_romania.63.b:0 "Neden onların yardımına ihtiyacımız olsun ki?"
 DOD_romania.63.desc:0 "Romanya ve Yugoslavya arasında, bizim için bir fırsat yaratabilecek bir kriz ortaya çıktı. [YUG.GetLeader], [ROM.GetLeader]'in ülkesini teslim etme taleplerini reddetti. Karşılığında, [ROM.GetLeader] bize Yugoslavya'yı bölme anlaşmasıyla yaklaştı. Bize Slovenya'yı ve kontrolümüz altında Bağımsız bir Hırvat Devleti'nin kurulmasını teklif etti."
 DOD_romania.63.t:0 "[From.GetLeader] Yugoslavya'yı bölmeyi hedefliyor"
 DOD_romania.64.desc:0 "Romanya ve Yugoslavya arasında, bizim için bir fırsat yaratabilecek bir kriz ortaya çıktı. [YUG.GetLeader], [ROM.GetLeader]'in ülkesini teslim etme taleplerini reddetti. Karşılığında, [ROM.GetLeader] bize Yugoslavya'yı bölme anlaşmasıyla yaklaştı. Bize Dalmaçya'yı ve kontrolümüz altında Karadağ'da bir kukla devlet kurulmasını teklif etti."
 DOD_romania.65.a:0 "Mükemmel."
 DOD_romania.65.desc:0 "[From.GetLeader] şartları kabul ettiğini bildirdi. [From.GetAdjective] Hükümeti, Yugoslavya'daki eylemlerimizi destekleyecektir."
 DOD_romania.65.t:0 "[From.GetNameDefCap] kabul ediyor"
 DOD_romania.66.a:0 "Onları hayal kırıklığına uğrattığımız için üzgün olacağız."
 DOD_romania.66.desc:0 "Yugoslavya'ya müdahale etmekten doğrudan bizi uyarmasa da, [From.GetNameDef] hükümeti teklifimizi onaylamayı reddetti. \n\nBelki de başarısız olmamızı bekliyorlar ve resimde biz olmadan Yugoslavya'yı kendileri için almayı hedefliyorlar."
 DOD_romania.66.t:0 "[From.GetNameDefCap] reddediyor"
 DOD_romania.67.a:0 "Zafer yakındır."
 DOD_romania.67.desc:0 "Ek diplomatik destek sağlandıktan sonra, Yugoslavlara durumun dramatik bir şekilde değiştiğini bildirme zamanı geldi. Uzun sınırları savunmaya çalışırken zayıf düşmüş, askeri durumları daha da umutsuz."
 DOD_romania.67.t:0 "Yugoslavya'ya Ültimatom"
 DOD_romania.68.a:0 "Silah başına!"
 DOD_romania.68.desc:0 "Destek için Almanya ve İtalya'ya ulaşma girişimlerimiz başarıyla karşılanmadı. Bunun Yugoslavlara sağladığı soluklanma alanı şüphesiz yaklaşan harekat üzerinde bir etkiye sahip olacak, ancak Genelkurmay hala zaferi hızla güvence altına alabileceğimiz konusunda ihtiyatlı bir şekilde iyimser."
 DOD_romania.68.t:0 "Diplomatik ilerlemeler başarısız oldu"
 DOD_romania.69.a:0 "Geri çekilin."
 DOD_romania.69.b:0 "Son nefesimize kadar savaşacağız!"
 DOD_romania.69.desc_GER:0 "İkinci bir ültimatom verildi. Bu kez taleplere, Rumen planına desteğini açıklayan ve Ordumuzun Alman birlikleri tarafından Slovenya ve Hırvatistan'ın işgaline müdahale etmeyeceği konusunda ısrar eden [GER.GetNameDef] büyükelçisinden benzer bir not eşlik etti."
 DOD_romania.69.desc_GERITA:0 "İkinci bir ültimatom verildi. Bu kez taleplere, Rumen planına desteklerini açıklayan ve gereksiz kan dökülmesini önlemek için Ordumuzun işgale müdahale etmeyeceği konusunda ısrar eden [GER.GetNameDef] ve [ITA.GetNameDef] büyükelçilerinden benzer bir not eşlik etti."
 DOD_romania.69.desc_ITA:0 "İkinci bir ültimatom verildi. Bu kez taleplere, Rumen planına desteğini açıklayan ve Ordumuzun İtalyan birlikleri tarafından Dalmaçya ve Karadağ'ın işgaline müdahale etmeyeceği konusunda ısrar eden [ITA.GetNameDef] büyükelçisinden benzer bir not eşlik etti."
 DOD_romania.69.t:0 "Kuşatma"
 DOD_romania.70.a:0 "Diplomasi için bir başka zafer."
 DOD_romania.70.desc:0 "Yugoslav hükümeti yenilgiyi kabul etti. Müttefik güçlerin kuvvetleri ülkenin kontrolünü ele geçirdi ve belirlenen bölgelerini işgal etti."
 DOD_romania.70.t:0 "Yugoslavya bölündü"
 DOD_romania.71.a:0 "Blöf yapmıyorduk."
 DOD_romania.71.desc:0 "Yugoslav Ordusu sınırımız boyunca mevzileri işgal etti ve Yugoslav Hava Kuvvetleri savaş mevzilerini işgal etti. Savaşmaya hazır görünüyorlar. \n\nAncak, Yugoslav Savaş Bakanlığı'ndaki bir kaynak, [YUG.GetLeader]'in bizim blöf yaptığımıza ve savaş olmayacağına kesin olarak inandığı için bunun sadece bir meydan okuma jesti olduğunu iddia ediyor."
 DOD_romania.71.t:0 "Yugoslavya meydan okuyor"
 DOD_romania.81.a:0 "Hükümet binayı satın aldı ve Bayan Lupescu'nun ikametine izin verdi."
 DOD_romania.81.b:0 "Kral parayı ödeneğinden avans olarak aldı."
 DOD_romania.81.desc:0 "Kral II. Carol'un metresi Magda Lupescu'nun Bükreş'in pahalı bir banliyösünde yeni bir villa satın aldığı bildirildi. Bunu nasıl karşılayabildiği geniş spekülasyonlara konu oldu. Yabancı gazetelerdeki yeni kanıtlar, Kral'ın kendisinin satın almayı devlet parasıyla onayladığını kuvvetle düşündürüyor.\n\nSkandal yayılıyor ve en kısa zamanda konuyla ilgili kamuoyuna bir açıklama yapmalıyız."
 DOD_romania.81.t:0 "Kralın Metresi villa satın aldı"
 DOD_romania.82.a:0 "İftira bir suçtur."
 DOD_romania.82.b:0 "Yazar derhal serbest bırakılacak."
 DOD_romania.82.desc:0 "Tanınmış bir sosyal bilimci tarafından yeni bir kitap yayınlandı ve Kral'ın yakın çevresinin politika kararları üzerindeki geniş etkisini detaylandırıyor. Bu kararların çoğu daha sonra üyelere fayda sağlıyor. Kral'ın Metresinin, bağlantılarını kullanarak kendini zenginleştirdiği bildirilen anlaşmaları özellikle ilgi çekici. Kral yazarın tutuklanmasını emretti.\n\nLiberal gazeteler ve aşırı sağ, çok farklı nedenlerle de olsa, bu konuda ayaklandı. İşler çığırından çıkmadan önce bu konuda bir açıklama yapmamız gerekiyor."
 DOD_romania.82.t:0 "Kral eleştirel kitabı yasakladı"
 DOD_romania.83.a:0 "Kralın temsilci olmasına izin verilmelidir."
 DOD_romania.83.b:0 "Kralın özel meseleleri hükümetin meselesi değildir."
 DOD_romania.83.desc:0 "Kral'ın kendisi tarafından denetlenmesine rağmen, Kraliyet sarayındaki son ziyafetin resmi haberi büyük bir kamuoyu muhalefetine neden oldu. Kral'ın metresinin pahalı bir Fransız gece elbisesi içindeki resimleri ve altın tabaklardan yenen 7 çeşit yemeğin ayrıntılı açıklamaları, hala Büyük Buhran'ın etkilerinden muzdarip olan halkı daha da alevlendirdi.\n\nKral, derhal kamuoyuna bir destek açıklaması yapmamızı talep ediyor."
 DOD_romania.83.t:0 "Kral gösterişli bir parti veriyor"
 DOD_romania.84.a:0 "Bayan Lupuscus, Kralın isteği üzerine hareket etti."
 DOD_romania.84.b:0 "Hükümet, özel vatandaşların eylemleri hakkında yorum yapmaz."
 DOD_romania.84.desc:0 "Fransız gazeteleri, Magda Lupescu'nun Paris'teki maceralarıyla doluydu; burada kapsamlı bir alışveriş çılgınlığına kapıldığı bildiriliyor.\n\nBu kendi başına alışılmadık olmasa da, satın aldıklarını taşımak için Romanya büyükelçiliğinden yardım istediği ve mağazalara faturayı Romanya hükümetine göndermelerini söylediği yönündeki haberler ulusal basında yer aldı. Bu haberler hakkında yorum yapmamız istendi."
 DOD_romania.84.t:0 "Kralın Metresi Paris'te görüldü"
 DOD_romania.85.a:0 "Resmi bir devlet ziyaretiydi."
 DOD_romania.85.b:0 "Kral her yıl Nice'e tatile gider."
 DOD_romania.85.desc:0 "Metresi ve yakın çevresinin çoğu eşliğinde, Kral II. Carol bir tatil için Nice'e geldi. Hotel Negresco'nun Kraliyet Süiti'ne yerleşen Kral, yerel muhabirlere önümüzdeki birkaç haftayı en iyi yiyecek ve misafirperverliğin tadını çıkararak geçirmeyi planladığını, Nice Operası'na ziyaretler ve alışveriş için Paris'e kısa geziler planladığını söyledi.\n\nYerel basın, bu ziyaretin zamanlaması ve bunun için paranın nereden gelmesi gerektiği hakkında sivri sorular soruyor."
 DOD_romania.85.t:0 "Kral Nice'te tatil yapıyor"
 DOD_romania.86.a:0 "İmzalı bir sözleşme tartışılamaz."
 DOD_romania.86.b:0 "Süreci reforme edin."
 DOD_romania.86.desc:0 "Ordu'nun tedarik süreçlerindeki yolsuzluk söylentilerinin ardından, Kral konuyla ilgili tarafsız bir soruşturma sözü verdi. Basına sızdırılan bir ön rapor, sadece söylentileri doğrulamakla kalmadı, aynı zamanda Kral'ın en yakın danışmanlarını da doğrudan konuya dahil etti.\n\nTüm olay hükümet için bir utanç haline geldi. Kral eylem talep ediyor, ancak söz konusu danışmanlara tam desteğini açıkladı."
 DOD_romania.86.t:0 "Kral zimmete para geçirme skandalına karıştı"
 DOD_romania.999.desc:0 "Son derece sarhoş ve duygusal bir Kral II. Carol, bugünkü strateji toplantısını ele geçirdi ve herkesin dikkatini bir önceki gece bulduğu 'parlak' bir fikre çekti.\n\nGerçekten de kalpten bir romantik olan Kral, gözlerinde yaşlarla hayatındaki kadınların onlara duyduğu yoğun ve gerçek aşkı bilmelerini istediğini ilan etti. Genelkurmay Başkanları ve Kabine'ye uzun, biraz peltek olsa da bir monologla hitap ederek, en hassas ve içten duygularına başvurdu, sadece insanın bildiği o en büyük ve en derin duyguya bir övgü olarak düşmanın büyük şehirlerinden ikisinin yeniden adlandırılması için ciddiyetle çağrıda bulunarak bitirdi; aşk.\n\nKral, zihninde bu fikre tamamen takılıp kalmış durumda ve onu vazgeçirmek istersek kolayca pes etmesi pek olası değil."
 DOD_romania.999.t:0 "Aşka Bir Saygı Duruşu"
 DOD_romania.a:0 "O gerçekten de göklerden inmiş bir dahi!"
 DOD_romania.b:0 "Onun yerine dikkatini dağıtmak için bir parti verin. -Gerçekten- büyük bir tane."
 DOD_yugoslavia.1.a:0 "Subayları dinlemeliydik."
 DOD_yugoslavia.1.a.tt:0 "§YII. Petar§!, §Y[YUG.GetIdeologyNameWithCaps]§! partisi için lider olur.\n"
 DOD_yugoslavia.1.b:0 "Kararımızın arkasındayız!"
 DOD_yugoslavia.1.desc:0 "Almanya ile anlaşma imzalama kararımızın ardından bir grup Hava Kuvvetleri subayı darbe başlattı. Ordu Belgrad'daki kilit noktaları ele geçirdi. Kral Peter reşit ilan edildi ve [YUG.GetLeader].\n\n'nin naipliği sona erdi. Halkın geneli darbeyi desteklerken, kalabalıklar \"Antlaşma yerine savaş, köle yerine mezar daha iyi!\" diye slogan attı.\n\nHükümet bir yol ayrımında. Almanya ile savaş anlamına gelecek darbeyi destekleyebiliriz. Ya da ülkeyi kanlı bir iç savaşla parçalayacak olan buna karşı savaşmayı deneyebiliriz."
 DOD_yugoslavia.1.t:0 "Ordu Darbe Başlattı"
 DOD_yugoslavia.10.a:0 "Hainler!"
 DOD_yugoslavia.10.b:0 "Aslında haklılar..."
 DOD_yugoslavia.10.desc:0 "Almanya'ya karşı savaş ilanının haberi ülke geneline yayıldıkça, ülkedeki birçok insanın işgalcilere karşı silahlanma niyetinde olmadığı hızla anlaşıldı. Çoğunluğu Hırvat olan birlikler sınıra doğru hareket etme emirlerini reddetti ve hatta birkaç durumda emirlere uyan diğer birliklere ateş açtı.\n\nArtık bize destek olmaları için Hırvatlara güvenemeyeceğimiz anlaşılıyor, bu da en hafif tabirle Almanya ile olan sınırın savunmasını zorlaştırdı."
 DOD_yugoslavia.10.t:0 "Beşinci Kol"
 DOD_yugoslavia.181.d:0 "Pan-Slav İşçi Kongresi'nin kurulmasıyla birlikte, [This.GetAdjective]'in işçi sınıfının birçoğu [This.GetNameDef]'in [From.GetNameDef] modeline dayalı bir komünist devlet olarak ittifaka girme fikrini desteklemeye başlıyor gibi görünüyor. Şu anda küçük bir hareket olmasına rağmen, birçok [This.GetAdjective] yetkilisi, bu aktivistlerin bu fikri destekledikleri için derhal cezalandırılmazlarsa, [This.GetNameDef]'in ülke çapında grevlerle ve hatta solcu paramilitarizmin yükselişiyle karşı karşıya kalabileceğinden korkuyor."
 DOD_yugoslavia.181.t:0 "Komünist Duyarlılık [This.GetNameDef]'de Yayılıyor"
 DOD_yugoslavia.182.d:0 "Ulusumuzun dört bir yanında, Pan-Slav İşçi Kongresi destekçileri [This.Capital.GetName] sokaklarını [From.GetAdjective] sosyalizm modelini tanıtan posterler ve el ilanlarıyla süslemeye başladı. [From.GetLeader]'ı ve rejimini alkışlıyorlar ve [This.GetAdjective] hükümetinin [From.GetNameDef]'de bulunanlara benzer sosyal reformlardan faydalanacağına inanıyorlar. Birçoğu bunun [From.GetLeader] tarafından [This.GetAdjective] bağımsızlığını baltalamak için cüretkar bir girişim olduğundan şüphelense de, bu propagandanın ortalama bir [This.GetAdjective] vatandaşının komünizm ve birleşik bir Balkan ittifakı olasılığına yönelik tutumları üzerinde oldukça etkili olduğu göz ardı edilemez."
 DOD_yugoslavia.182.t:0 "Pan-Slav Propagandası"
 DOD_yugoslavia.183.a:0 "Dikkatli olsak iyi olur."
 DOD_yugoslavia.183.d:0 "Ulusumuzda komünist duyarlılık artmaya devam ederken, ulusumuzun aşırı solcuları arasında birçok küçük paramiliter grup oluşmaya başlıyor. Söz konusu silahlar Yugoslav kökenli görünüyor ve birçoğu [From.GetLeader] ve rejiminin, yeni [From.GetRulingIdeology] devletiyle daha uyumlu bir hükümet lehine [This.GetAdjective] hükümetini devirme planları olduğundan şüpheleniyor."
 DOD_yugoslavia.183.t:0 "Pan-Balkan Milisleri"
 DOD_yugoslavia.184.a:0 "Eğer halkın istediği buysa..."
 DOD_yugoslavia.184.b:0 "Bu dayanılmaz köylü çetesini yok edin!"
 DOD_yugoslavia.184.d:0 "[This.GetAdjective] hükümeti ile köylülük arasındaki gerilim doruk noktasına ulaştı; ülke genelindeki birçok solcu militan, [From.GetNameDef]'den alındığına inanılan silahlarla kendilerini donatıyor. Köylüler şimdi [This.GetLeader]'in iktidar konumundan feragat etmesini ve onu temsil ettiğini iddia ettiği halka vermesini talep ediyor. Talepleri, istediklerini yapmamanın, köylülüğün yeni bir [From.GetRulingIdeology] hükümeti adına silahlanmasıyla sonuçlanacağı yönündeki örtük uyarıyı taşıyor."
 DOD_yugoslavia.184.t:0 "Komünist Militanlar Rejim Değişikliği Talep Ediyor"
 DOD_yugoslavia.19.a:0 "Çok yaşa Kral!"
 DOD_yugoslavia.19.desc:0 "Küresel çatışmanın vahim koşullarıyla zamanından çok önce tahta çıkan Kral [Root.GetLeader], nihayet reşit oldu ve kendisini bilge ve yetenekli bir lider olarak kanıtladı. Tahtta uygun yaşta meşru bir varis olmasıyla, [YUG.GetNameDef] halkı nihayet arkasında toplanıp savaşacakları ulusal kimliklerinin bir sembolünü kazandı."
 DOD_yugoslavia.19.t:0 "Kral Petar Reşit Oldu!"
 DOD_yugoslavia.2.a:0 "Führer Direktifi 25'i uygulayın."
 DOD_yugoslavia.2.desc:0 "Prens Pavle hükümetinin Üçlü Pakt'ı imzalamasından hemen sonra, bir grup [YUG.GetAdjective] Hava Kuvvetleri subayı, meşru hükümeti değiştiren ve reşit olmayan II. Petar'ı tahta çıkaran iyi planlanmış bir darbe gerçekleştirdi.\n\nYugoslav hükümeti tamamen çöktü, yeni liderler Prens Pavle'nin imzasını geçersiz ilan etti."
 DOD_yugoslavia.2.t:0 "[YUG.GetNameDef]'de Darbe"
 DOD_yugoslavia.20.a:0 "Stoklarımızdan avcı uçağı satışını onayla."
 DOD_yugoslavia.20.b:0 "Stoklarımızdan bombardıman uçağı satışını onayla."
 DOD_yugoslavia.20.c:0 "Hiçbir şeyi feda edemeyiz."
 DOD_yugoslavia.20.d:0 "Siparişlerini karşılamak için avcı uçağı üretimini yönlendir."
 DOD_yugoslavia.20.desc:0 "Stratejik bir zayıflığı fark eden [YUG.GetAdjective] Hava Kuvvetleri, gücünü modernize etmek ve genişletmek için hızlandırılmış bir program başlattı. Satın almayı karşılamak için önemli para rezervleri ayrıldı. Bir komisyon, yeni avcı ve orta bombardıman uçağı kaynakları aramak için Avrupa'yı dolaşıyor.\n\nKonunun aciliyeti göz önüne alındığında, [YUG.GetAdjective]ler doğrudan üreticiden anında teslimat veya uçak transferi konusunda ısrar etti."
 DOD_yugoslavia.20.e:0 "Siparişlerini karşılamak için bombardıman uçağı üretimini yönlendir."
 DOD_yugoslavia.20.t:0 "[YUG.GetName] uçak satışı talep ediyor"
 DOD_yugoslavia.21.a:0 "Mükemmel."
 DOD_yugoslavia.21.desc:0 "[From.GetNameDef]'deki satın alma komisyonumuz, hava kuvvetlerimiz için bir dizi avcı uçağı satışını güvence altına aldı. İlk uçaklar şimdiden alındı ve pilotlarımız intibak eğitimine başladı."
 DOD_yugoslavia.21.t:0 "[From.GetNameDefCap] avcı uçağı satışını onaylıyor"
 DOD_yugoslavia.22.desc:0 "[From.GetNameDef]'deki satın alma komisyonumuz, hava kuvvetlerimiz için bir dizi orta bombardıman uçağı satışını güvence altına aldı. İlk uçaklar şimdiden alındı ve pilotlarımız intibak eğitimine başladı."
 DOD_yugoslavia.22.t:0 "[From.GetNameDefCap] bombardıman uçağı satışını onaylıyor"
 DOD_yugoslavia.3.a:0 "Ciddi şekilde yanılıyorlar."
 DOD_yugoslavia.3.b:0 "Onları kurtaracağız."
 DOD_yugoslavia.3.desc:0 "Prens Pavle hükümetinin Üçlü Pakt'ı imzalamasından hemen sonra, bir grup [YUG.GetAdjective] Hava Kuvvetleri subayı, meşru hükümeti değiştiren ve reşit olmayan II. Petar'ı tahta çıkaran iyi planlanmış bir darbe gerçekleştirdi.\n\nEski hükümetin unsurları darbeyi kınadı ve ulusal bir acil durum ilan etti. Bunun açıkça yabancı ajanların işi olduğunu iddia ettikleri için, onları savunmakla yükümlü olduğumuzu iddia ediyorlar."
 DOD_yugoslavia.30.a:0 "Onlara baskı yapın."
 DOD_yugoslavia.30.b:0 "Onların görüşü önemsiz."
 DOD_yugoslavia.30.desc:0 "\nAvusturya'nın Reich'e dönmesinin ardından, artık [YUG.GetNameDef] ile bir sınır paylaşıyoruz. [YUG.GetLeader] hükümeti, Avrupa'yı yeniden düzenleme teklifimiz hakkındaki tutumları konusunda oldukça sessiz kaldı. Belki de onlara bir seçim yapmaları gereken zamanın geleceğini hatırlatmalıyız."
 DOD_yugoslavia.30.t:0 "[YUG.GetNameDef] Sorunu"
 DOD_yugoslavia.31.a:0 "Ne kadar nazik."
 DOD_yugoslavia.31.b:0 "Onlarla iyi ilişkilerimizi sürdürmeliyiz..."
 DOD_yugoslavia.31.desc:0 "Birkaç gün önce, Alman büyükelçisi diplomatik bir resepsiyonda [YUG.GetLeader]'ı köşeye sıkıştırdı. Avusturya'nın Anschluss'unun ardından, diye belirtti, [YUG.GetNameDef] ve [GER.GetNameDef] artık ortak bir sınırı paylaşıyor. Büyükelçi, [YUG.GetLeader]'a Almanya'nın tabii ki dostane ilişkilerle çok ilgilendiğini temin etti. \n\nSadece gelecekte politika kararları alırken bunu aklımızda tutmamızı istedi."
 DOD_yugoslavia.31.t:0 "Alman baskısı"
 DOD_yugoslavia.32.a:0 "Ona baskı yapın."
 DOD_yugoslavia.32.b:0 "Başka planlarımız var."
 DOD_yugoslavia.32.desc:0 "[CZE.GetNameDef] resimden çıktığına göre, güneydoğu Avrupa'daki güç dengesi dramatik bir şekilde değişti. Çek silahları ve parası, şimdi yeni sponsorlar aramak zorunda olan bir dizi ülkeyi desteklemek için kullanılıyordu. Belki de [YUG.GetLeader]'e bu gerçeği hatırlatmanın zamanı gelmiştir."
 DOD_yugoslavia.33.a:0 "Ne kadar nazik."
 DOD_yugoslavia.33.b:0 "Bu ciddileşiyor, derhal Alman karşıtı unsurlara karşı sert önlemler almalıyız!"
 DOD_yugoslavia.33.desc:0 "Alman birlikleri Prag'a girdikten sadece birkaç saat sonra, [CZE.GetAdjective] büyükelçisi hala vedalaşırken, [GER.GetNameDef] büyükelçisi Dışişleri Bakanlığı'na geldi. \n\nOna göre, Alman hükümeti [CZE.GetNameDef]'de bu tür önlemler almak zorunda kaldığı için derin üzüntü duyuyor ve [GER.GetLeader], [YUG.GetLeader]'in eylemlerinin Yugoslavya ile ilgili bu tür eylemleri düşünmesine neden olmadığı için memnun.\n\nBüyükelçi, bunun gelecekte de böyle kalmasını umduğunu ifade ederek bitirdi."
 DOD_yugoslavia.34.a:0 "Onlara olan sabrımız tükeniyor."
 DOD_yugoslavia.34.b:0 "Kaplan, farelerin görüşlerini umursamaz."
 DOD_yugoslavia.34.desc:0 "Artık Avrupa'da üstünüz. Fransa uzun zamandır güneydoğu Avrupa'da istikrarın temeliydi, ama şimdi tüm bölge kapışılmaya hazır. Oradaki tüm ulusları, bizi durduracak kimse kalmadan yörüngemize çekebiliriz. \n\nYugoslavlara bir seçim yapmaları gerektiğini söyleme zamanı geldi. Ya bizimle birlikte duracaklar - ya da silinip gidecekler."
 DOD_yugoslavia.35.a:0 "Zaman tükeniyor."
 DOD_yugoslavia.35.b:0 "Hayır, onları daha fazla yatıştırmamalıyız!"
 DOD_yugoslavia.35.desc:0 "Yakın tarihli bir Berghof toplantısında, [GER.GetLeader] ve [YUG.GetLeader] Avrupa'daki durumu ve bizim bu durumdaki rolümüzü tartıştılar. [GER.GetLeader], Yugoslavya'nın uzakta beliren ölüm-kalım mücadelesinde bir taraf tutmaktan kaçınamayacağını ısrarla belirtti. Almanya da sınırlarında tarafsız bir ülkeye tahammül edemezdi. \n\nNeredeyse, diye bitirdi, Yugoslavya'nın Müttefiklerin yanında yer almayı seçmesi tercih edilirdi, sırf herkes nerede durduğunu bilsin diye."
 DOD_yugoslavia.36.a:0 "Bizimle değillerse, bize karşıdırlar!"
 DOD_yugoslavia.36.b:0 "Onlar, ve sonsuza dek, önemsiz kalacaklar."
 DOD_yugoslavia.36.desc:0 "Defalarca bir taraf için ilan etmeleri için baskı yaptıktan sonra, [YUG.GetLeader] hükümeti hala Yugoslavya'nın bu çatışmayı kenarda atlatabileceği fikrine sarılıyor. Şimdi korkaklıklarının sonuçlarıyla yüzleşmeliler."
 DOD_yugoslavia.36.t:0 "Yugoslavya'nın kaderi"
 DOD_yugoslavia.40.a:0 "Onlara bir haber uçurun."
 DOD_yugoslavia.40.b:0 "Başka bir ulusun işlerine karışamayız."
 DOD_yugoslavia.40.desc:0 "Yugoslavya, yeni Balkan stratejimizin temel taşıdır. Şimdiye kadar tarafsız kaldılar, Almanya ile ticaret yapıyorlar ama Mihver'e katılmaktan çok uzak duruyorlar. Savaş çıkması durumunda düşmanla ticarete müsamaha göstermeyeceğimizi onlara hatırlatmalıyız."
 DOD_yugoslavia.41.a:0 "Bunu düşüneceğiz."
 DOD_yugoslavia.41.desc:0 "[ENG.GetLeader] son zamanlarda Balkan bölgesinde bir diplomatik saldırı başlattığını duyurdu. Bu ilerlemenin bir parçası, onunla Londra'daki büyükelçimiz arasında özel bir görüşmeydi. Bu görüşme sırasında, Almanya ile ilgili pozisyonumuzu sordu. [GER.GetNameDefCap], diye belirtti, kaynak dışı ihracatımızın önemli bir miktarını oluşturuyordu. Almanya'ya olan bağımlılığımızı azaltmamız iyi olurdu, diye devam etti."
 DOD_yugoslavia.41.t:0 "İngiliz baskısı"
 DOD_yugoslavia.42.a:0 "Özel bir Temsilci gönderin."
 DOD_yugoslavia.42.b:0 "Hala şokta olmalılar."
 DOD_yugoslavia.42.desc:0 "Münih Antlaşması zamanımızda barış anlamına gelebilir - ya da gelmeyebilir. Almanya, Avrupa'nın sınırlarını yeniden çizmek isteyen tek ülke değil. [YUG.GetLeader] hükümeti, ana silah tedarikçilerinin kaderi hakkında şaşırtıcı derecede sessiz kaldı.\n\nBu, diplomatik servisteki birçok kişinin Yugoslavların ne olacağını bilip bilmediğini ve hatta buna razı olup olmadıklarını merak etmesine neden oldu. \n\nAlmanya ile herhangi bir anlaşmanın, savaş çıkması durumunda düşmanca bir eylem olarak kabul edileceğini onlara hatırlatmayı düşünmeliyiz."
 DOD_yugoslavia.43.a:0 "Sadece yeni piyonlar arıyorlar."
 DOD_yugoslavia.43.desc:0 "Britanya'dan, Münih Antlaşması hakkındaki görüşümüzü tartışmak için özel bir Temsilci geldi. Görünüşe göre [ENG.GetLeader], müzakerelere eşlik eden savaş korkusu sırasında bizden daha kesin bir destek beyanı ummuştu. [CZE.GetNameDef]'in kaderi, diye hatırlattı bize, bizimkine bağlıdır. [CZE.GetNameDef] Almanların eline düşerse, kendimizi kıtada giderek daha fazla izole edilmiş buluruz."
 DOD_yugoslavia.44.a:0 "Bir seçim yapmalılar."
 DOD_yugoslavia.44.b:0 "Onların tarafsızlığı bize daha uygun."
 DOD_yugoslavia.44.desc:0 "Savaşın birkaç aydır devam etmesine rağmen, [YUG.GetLeader] hala bir taraf için ilan etmeyi reddediyor, hatta katı bir tarafsızlık gözetirken Almanya ile ticarete devam ediyor. Almanya'ya verdikleri destek muhtemelen hemen kritik olmasa da, aktif olarak savaşta olduğumuz bir ülkeyi desteklemelerine izin verip vermeyeceğimize karar vermeliyiz."
 DOD_yugoslavia.45.a:0 "Bir seçim yapmalıyız."
 DOD_yugoslavia.45.desc:0 "İngiliz büyükelçisi bugün Dışişleri Bakanlığı'nı ziyaret ederek neden hala Almanya ile ticaret yaptığımızı sordu. İngiliz hükümetinin, bize söylendiğine göre, bunu düşmanca bir eylem olarak gördüğünü ve derhal durdurmazsak 'uygun önlemleri' düşüneceğini söyledi."
 DOD_yugoslavia.46.a:0 "Zaten bir düşman sayılırlar."
 DOD_yugoslavia.46.b:0 "Şimdi daha fazla düşman edinmemeliyiz."
 DOD_yugoslavia.46.desc:0 "Görünüşe göre Yugoslavya üzerindeki baskımız istenen etkiyi yaratmadı. Almanya ile ticareti durdurmak veya müttefik davasına desteklerini ilan etmek yerine, [YUG.GetLeader] hükümeti tarafsızlığına sarılıyor ve geri adım atmayı reddediyor. Son zamanlarda, MI6, Yugoslav hükümetinin Almanya'ya ülkelerinden serbestçe asker geçirme hakkı vermeyi düşündüğüne dair raporlar aldı."
 DOD_yugoslavia.50.a:0 "Yunanistan Prensesi Alexandra, Kralın kalbini çaldı."
 DOD_yugoslavia.50.b:0 "İtalya Prensesi Maria Francesca."
 DOD_yugoslavia.50.c:0 "Almanya Prensesi Alexandrine."
 DOD_yugoslavia.50.d:0 "Adelheid von Habsburg."
 DOD_yugoslavia.50.desc:0 "[YUG.GetName]'de evlilik ve veraset sorunu uzun zamandır siyasi sınıfın dilindeydi. Tahtta meşru bir kral olmadan geçirdiğimiz uzun süre, bazılarının Karađorđević yönetiminin meşruiyetini sorgulamasına neden oldu. Ancak, Londra'daki son bir galada, genç Kral Petar'ın kalbi güzel bir soylu kadına kapıldı. Şimdiden, kraliyet kabinesinin üyeleri, Kral'ın romantik ilgisini bir düğünle güvence altına almak için düğün planlarını tartışıyor. Şüphesiz, kiminle evlenirse evlensin, ulusumuz üzerinde kalıcı bir diplomatik etkiye sahip olacak ve diğer hangi ülkelerin Yugoslavya ile ittifak kurmaya istekli olacağını etkileyebilir."
 DOD_yugoslavia.50.e:0 "İspanya Prensesi Marie-Françoise."
 DOD_yugoslavia.50.t:0 "Grosvenor Galası"
 DOD_yugoslavia.501.a:0 "Bir düğün harika olur!"
 DOD_yugoslavia.501.b:0 "[Root.GetPrincessName] asla [From.GetLeader] ile evlenmeyecek!"
 DOD_yugoslavia.501.desc:0 "[From.GetNameDef]'in Karađorđevićleri, hem kraliyet soylarının hem de uluslarının varlığını bir kraliyet düğünüyle sürdürmek istiyor. Görünüşe göre [From.GetLeader], [Root.GetFamilyName] ailesinin bir soylusu olan [Root.GetPrincessName]'e oldukça aşık olmuş ve evlenme teklif etmiş. Genç hanım kabul ederse, [From.GetNameDef] ve [Root.GetNameDef] kan bağıyla birleşecek. Bu hemen bir [From.GetAdjective]-[Root.GetAdjective] ittifakıyla sonuçlanmasa da, yakın gelecekte böyle bir şeyin mümkün olmasını sağlayacaktır."
 DOD_yugoslavia.501.t:0 "[From.GetNameDefCap] Bir Kraliçe Arıyor"
 DOD_yugoslavia.502.a:0 "Ne kadar romantik!"
 DOD_yugoslavia.502.desc:0 "Genç Kral [Root.GetLeader], [Root.GetLondonBelgrade]'de düzenlenen bir törenle, bir kriz zamanında bir araya gelen iki aşığın masalsı romantizmine tanıklık eden neşeli kalabalıklara, kutsal evlilik bağlarıyla [From.GetPrincessName]'e olan aşkını ve bağlılığını kamuoyuna ilan etti. [Root.GetWeddingGoodBad] Bu düğün herhangi bir resmi [yugoslavia_wedding_partner.GetAdjective]-[Root.GetAdjective] ittifakının kurulmasını sağlamasa da, bu noktada bu uluslar arasındaki işbirliğinin burada bitmeyeceği kesin gibi görünüyor."
 DOD_yugoslavia.502.t:0 "[From.GetPrincessName] Kabul Ediyor!"
 DOD_yugoslavia.503.a:0 "Belki de nazik Prenses Alexandra..."
 DOD_yugoslavia.503.desc:0 "Kral [Root.GetLeader] aşkının gerçek olduğunu iddia etse de, hayallerindeki yabancı prenses onun tutkusundan etkilenmiyor. Haftalar süren yoğun kur ve romantizmin ardından, [From.GetPrincessName] Kral'ın evlenme teklifini reddetti ve kararı [From.GetAdjective] hükümetinden kamuoyu onayıyla geldi. Aşağılanmış duygularıyla bariz bir şekilde kalbi kırık olsa da, Kral bir gün Krallığı için uygun bir kraliçe bulacağına dair kararlılığını sürdürüyor."
 DOD_yugoslavia.503.t:0 "[From.GetPrincessName] Reddediyor!"
 DOD_yugoslavia.60.a:0 "Çok yaşa Kral!"
 DOD_yugoslavia.60.paul:0 "20. yüzyılın şafağından bu yana ilk kez, [YUG.GetNameDef], Belgrad Katedrali'nde geleneksel bir Sırp Ortodoks töreninde hükümdarının taç giymesini görüyor. Birçok kişi hala Kral Pavle'yi bir gaspçı ve layık bir Kraldan çok bir faşist diktatör olarak görse de, taç şimdi onun başında ve iyi ya da kötü, Yugoslavya'nın geleceği [YUG.GetLeader.GetHerHis] ellerinde."
 DOD_yugoslavia.60.peter:0 "20. yüzyılın şafağından bu yana ilk kez, [YUG.GetNameDef], modern Yugoslav devletinde mevcut olan dini çeşitliliğin bir yansıması olarak, Belgrad Katedrali'nde hükümdarının taç giymesini görüyor. Bazıları genç Kral Petar'ın bu kadar genç yaşta yönetme yeteneğini sorgulasa da, taç şimdi onun başında ve iyi ya da kötü, Yugoslavya'nın geleceği [YUG.GetLeader.GetHerHis] ellerinde."
 DOD_yugoslavia.60.t:0 "Taç Giyme Töreni"
 DOD_yugoslavia.70.a:0 "Kabul ediyoruz."
 DOD_yugoslavia.70.b:0 "[FROM.GetNameDef] için başka vizyonlarımız var."
 DOD_yugoslavia.70.desc:0 "Bugün [From.GetLeader]'dan [Root.Capital.GetName]'e, dünyanın faşist güçleriyle bir saldırmazlık paktı imzalama ilgisini ifade eden bir telgraf geldi. Bir [SOV.GetAdjective] işgalinden ve [From.GetLeader.GetHerHis] ulusunda artan milliyetçilikten korkan [From.GetLeader], [From.GetLeader.GetHerselfHimself]'i [Root.GetNameDef] ile hizalamak istiyor. Bu resmi bir ittifak anlamına gelmese de, [From.GetNameDef]'i bizim nüfuz alanımıza sokar ve [From.GetAdjective]'in [Root.GetFactionName]'e giriş sürecini hızlandırır."
 DOD_yugoslavia.70.t:0 "[FROM.GetNameDefCap] Üçlü Pakt'ı İmzalamak İstiyor"
 DOD_yugoslavia.701.a:0 "Kabul etmekten başka seçeneğimiz yok."
 DOD_yugoslavia.701.allied_objection:0 "Üçlü Pakt'ı imzalama kararı hem ulusumuzun içinde hem de dışında derin bir şekilde tartışmalı oldu ve [ROOT.GetLeader]'in Kral II. Petar için naip olarak hareket etme hakkının meşruiyetini veya hatta böyle bir naipliğin gerekli olup olmadığını sorgulattı. Kraliyet Yugoslav Ordusu'ndan bir grup subay, II. Petar'ı reşit ilan etti ve [From.GetAdjective] desteğiyle Belgrad'a yürüdü ve [ROOT.GetLeader]'in derhal iktidardan uzaklaştırılmasını talep etti."
 DOD_yugoslavia.701.b:0 "Silah başına!"
 DOD_yugoslavia.701.t:0 "[FROM.GetNameDefCap] İtiraz Ediyor!"
 DOD_yugoslavia.701.tripartite_rejection:0 "[FROM.GetLeader], [ROOT.GetAdjective]'nin Üçlü Paktı imzalama önerisine eyaletimizin geleceği için \"başka fikirleri\" olduğunu belirterek yanıt verdi."
 DOD_yugoslavia.702.a:0 "[YUG.GetLeader] gayrimeşru bir korkaktır!"
 DOD_yugoslavia.702.b:0 "Umursamaya gerek görmüyorum."
 DOD_yugoslavia.702.desc:0 "[YUG.GetAdjective] hükümeti bugün faşist uluslarla Üçlü Pakt'ı imzalayarak birleşti. Bu henüz [YUG.GetNameDef]'in [From.GetFactionName]'e katıldığı anlamına gelmese de, iki ulus arasında artan bir bağlılığı ve [YUG.GetLeader]'in bazı faşist sempatilere sahip olabileceğini gösteriyor. Birçok kişi bu endişe verici gelişmeye bir [Root.GetAdjective] yanıtı bekliyor, ancak [Root.GetLeader] şimdiye kadar bu konuda sessiz kaldı…"
 DOD_yugoslavia.702.t:0 "[YUG.GetNameDefCap] Üçlü Pakt'ı İmzalıyor"
 DOD_yugoslavia.80.a:0 "Adil görünüyor."
 DOD_yugoslavia.80.b:0 "Onun yerine [103.GetName]'i teslim etmeliler."
 DOD_yugoslavia.80.desc:0 "[From.GetLeader] bugün [From.GetNameDef]'in [Root.GetNameDef] ile ittifak kurmaya ve resmi olarak [Root.GetFactionName]'e girmeye istekli olacağını, ancak sadece [163.GetName] üzerindeki kontrolümüzü teslim ederek Balkanlar'dan çekilmemiz karşılığında olacağını duyurdu."
 DOD_yugoslavia.80.t:0 "İttifak için Zara"
 DOD_yugoslavia.801.a:0 "Pekala..."
 DOD_yugoslavia.801.b:0 "Kesinlikle hayır."
 DOD_yugoslavia.801.desc:0 "Delegasyonumuz [From.GetNameDef]'de kötü karşılanmış gibi görünüyor, zira büyükelçi bunun yerine [From.GetFactionName] üyeliği karşılığında bizden [103.GetName]'i talep ederek yanıt verdi."
 DOD_yugoslavia.801.t:0 "[From.GetNameDefCap] [103.GetName]'i Talep Ediyor!"
 DOD_yugoslavia.802.a:0 "Tam olarak planlandığı gibi."
 DOD_yugoslavia.802.desc:0 "[From.GetNameDef] ile olan sınırdaki sürtüşme nihayet çözülecek, çünkü [From.GetAdjective] hükümeti şu anda [From.GetAdjective] işgali altındaki Dalmaçya topraklarını haklı Yugoslav kontrolörlerine geri vermeyi kabul etti. [Root.GetLeader] bugün [From.GetLeader]'ı [Root.GetAdjective] özgürlüğünün ve kendi kaderini tayin etmenin gerçek bir dostu ilan etti ve iki ulus şimdi müttefik olarak ilerliyor."
 DOD_yugoslavia.802.t:0 "[From.GetNameDefCap] Kabul Ediyor!"
 SWE_HUN_ALLIANCE:0 "Bernadotte Hanedanı"
 YUG_CRO_independence_war_troops_tt:0 "Bir §Y[CRO.GetAdjective] Süvari§! ve Beş §Y[CRO.GetAdjective] Piyade Tümeni§! ayaklanmaya katılacak"
 YUG_GER_pressured_us_annoyed_opm:0 "Diplomatik Baskıdan Rahatsız"
 YUG_if_we_dont_side_with_britain_within_a_year_warning_tt:0 "§RÖnümüzdeki yıl içinde [ENG.GetAdjective] tarafında yer almazsak, bizi bir düşman olarak görebilirler.§!"
 YUG_wavering_to_GER_pressure_2_opm:0 "Baskımıza Boyun Eğiyor"
 YUG_wavering_to_GER_pressure_opm:0 "Baskımıza Boyun Eğiyor"
 YUG_wavering_to_GER_pressure_reverse_2_opm:0 "Alman Baskısına Boyun Eğiyor"
 YUG_wavering_to_GER_pressure_reverse_opm:0 "Alman Baskısına Boyun Eğiyor"
 YUG_wedding_bad:0 "Ancak [Root.GetNameDef]'deki evinde, genç hükümdar, ulus için büyük bir kriz zamanında evlenmeyi seçtiği için muhafazakar [Root.GetAdjective] basından çokça eleştiriyle karşılaşıyor."
 YUG_wedding_good:0 "Belgrad'dan Bükreş'e kadar tüm Balkanlar, [Root.GetAdjective] hükümdarının büyüyen felaket karşısındaki azmini kutlamak için birleşti."
 czech.1.a:0 "Memnuniyetle karşılanırlar."
 czech.1.b:0 "Henüz hazır değiller."
 czech.1.d:0 "Çeklerle ilişkilerimiz geçmişte düzensizdi, ancak son zamanlarda politikaları tarihin doğru tarafına keskin bir dönüş yaptı. Almanya'dan artan baskı ve Batı demokrasilerinin onları koruma yeteneğine olan inançsızlıkla birleşince, Komintern'e katılmak için resmi bir talepte bulundular."
 czech.1.t:0 "Komintern üyeliği"
 czech.10.a:0 "Hadi işe koyulalım."
 czech.10.d:0 "Büyük Savaş'ın sonundan beri Polonya, Alman topraklarını işgal etti. Bu yetmezmiş gibi, komşularına sürekli saldırarak topraklarını agresif bir şekilde genişlettiler. [From.GetNameAdj] müttefiklerimiz bizimle aynı sonuca vardılar: Avrupa'da barışı sağlamak için Polonya devleti ortadan kaldırılmalıdır."
 czech.11.d:0 "[From.GetNameDefCap], Polonya Durumuyla başa çıkma planımızı onayladı. Hazırlıklar tamamlanır tamamlanmaz saldırabiliriz."
 czech.12.d:0 "[From.GetNameDefCap], Polonya Durumuna çözümümüzü reddetti. Başka bir fırsatın ortaya çıkıp çıkmayacağını zaman gösterecek."
 czech.14.a:0 "Eğer savaş istiyorlarsa, o zaman istediklerini alacaklar."
 czech.14.d:0 "Onları hükümetten çıkardığımızdan beri, Slovak Liderler kinle yanıp tutuşuyor ve halkı şiddete teşvik ediyorlardı. Bugün, sözleri nihayet o kadar umutsuzca istedikleri savaşı getirmeyi başardı. Slovak İsyanı başladı."
 czech.14.t:0 "Slovak İsyanı"
 czech.15.a:0 "Zafer!"
 czech.15.d:0 "Slovak gücünün son kaleleri de ezildi. İsyan sona erdi."
 czech.16.d:0 "İlk başta çekincelere rağmen, Çekler Bolşevizmi gerçekten olduğu gibi yakın bir tehdit olarak görmeye başladılar ve şimdi Mihver güçlerine katılmak için başvuruyorlar. [CZE.GetLeader] hükümeti, bunun Sudetenland meselesini hiçbir şekilde etkilemediğini özellikle belirtti."
 czech.16.t:0 "Çekler Mihver'de mi?"
 czech.17.a:0 "Mükemmel!"
 czech.17.d:0 "[From.GetNameDefCap], Mihver'e katılma talebimizi kabul etti!"
 czech.18.a:0 "Sorunlu."
 czech.18.d:0 "[From.GetNameDefCap], Mihver'e katılma talebimizi reddetti!"
 czech.19.d:0 "[From.GetLeader] hükümeti, en başından beri bildiğimiz şeyi fark etti: [From.GetNameDef] ancak bizim korumamız altında var olmaya devam edebilir. Bu, topraklarını doğrudan işgal etme olasılığını engellese de, istekli bir müttefike sahip olmak daha iyi olabilir ve yabancı aktörlerin herhangi bir müdahalesini önler."
 czech.19.t:0 "Ölümden Önce Şerefsizlik"
 czech.2.d:0 "[SOV.GetLeader], Komintern'e katılma talebimizi kabul etti. Delegasyonumuz, tam oy hakkıyla Yürütme Komitesi'ne katıldı."
 czech.20.a:0 "Tek yol bu."
 czech.20.d:0 "[From.GetLeader] teklifimizi kabul etti. Politikaları koordine etmek için Prag'a bir [From.GetAdjective] tam yetkili temsilcisi geldi."
 czech.20.t:0 "Ölümden Önce Şerefsizlik"
 czech.21.a:0 "Belki de en iyisi budur."
 czech.21.d:0 "Teklifimiz kendisine sunulduğunda, [From.GetLeader]'nin halkımızın aşağılığı, hükümet sistemimiz ve [CZE.GetLeader]'nin liderlik nitelikleri hakkında uzun bir tirada başlamadan önce \"Bin Yılda Değil!\" diye haykırdığı bildirildi. Resmi bir ret henüz sunulmadı ama büyükelçimizin pek umudu yok."
 czech.21.t:0 "Ölümden Önce Şerefsizlik"
 czech.22.d:0 "[From.GetNameDef] hükümeti, karşılıklı bir anlayışa ulaşmaya yönelik bir adım olarak Sudetenland'ı teklif etti. Bir yandan, bu zengin bir eyaleti az maliyetle ve az tehlikeyle elde etmek için büyük bir fırsat. Öte yandan, Sudetenland üzerinde bir kriz yaratmak, Versay Antlaşması'nı ayakta tutan sözde Büyük Güçlerin dişsiz ve ahlaken aşağı olduğunu dünyaya göstermek için mükemmel bir fırsat olacaktır."
 czech.22.t:0 "Sudeten Sorunu"
 czech.23.a:0 "Daha fazlasını isteyemezler, şüphesiz."
 czech.23.d:0 "[From.GetNameDefCap] teklifimizi kabul etti. [From.GetAdjective] birlikleri, yerel halkın tezahüratları eşliğinde Sudetenland'e girdi."
 czech.24.a:0 "Bekleyip görelim."
 czech.24.d:0 "[From.GetLeader], Sudetenland'ı teslim etme teklifimizi reddetti. Bu hamle için herhangi bir neden belirtmedi, ancak [From.GetAdjective] kararı, Almanların bizim için daha büyük planları olabileceğine inanan orduda bir şok dalgası yarattı."
 czech.25.d:0 "[From.GetNameDef] hükümeti, artan Alman nüfuzu karşısında son yıllarda geçerliliğini yitiren 'Küçük İtilaf' ittifakını yeniden teyit etmeye karar verdi. Dışişleri bakanları kısa süre önce başkentimizde, ittifaka kalıcı bir üye olarak katılmakla ilgilenip ilgilenmeyeceğimizi görüşmek üzereydi."
 czech.25.t:0 "Yugoslavya İtilaf'ta"
 czech.26.d:0 "[From.GetName], İtilaf'a katılmayı kabul etti. Savunma düzenlemelerini görüşmek üzere bir askeri heyet geldi."
 czech.27.d:0 "[From.GetLeader] delegasyonumuzla görüşmeyi kabul etse de, şimdiye kadar ülkesini İtilaf'a katılmaya taahhüt etmeyi reddetti. [From.GetAdjective]ler, ittifakımıza katılmanın bölgedeki hassas güç dengesini istikrarsızlaştırabileceğinden endişe duyuyor gibi görünüyor."
 czech.28.t:0 "Romanya İtilaf'ta"
 czech.3.a:0 "Slav bağlarımıza da bu kadar..."
 czech.3.d:0 "[SOV.GetLeader], herhangi bir neden belirtmeden Komintern'e katılma talebimizi reddetti."
 czech.32.a:0 "Tekliflerini kabul ediyoruz."
 czech.32.b:0 "Asla!"
 czech.32.d:0 "[From.GetNameDef] liderliğindeki İtilaf, uzun süredir ulusumuzu kontrol altında tutmayı amaçlıyordu. Ancak, Alman gücü büyüdükçe, [From.GetNameDef] o yönden giderek daha fazla tehdit altında hissediyor. İki taraftan bir tehditle yüzleşmek istemeyen [From.GetLeader], şimdi bizimle bir anlayışa varmak istiyor. \n\nHükümetimiz bu konuda bölünmüş durumda. Bir grup, [From.GetNameDef] ile bir anlaşmanın kuşatmayı kırmanın ilk adımı olduğuna inanırken, diğer grup bunun şüphesiz [GER.GetLeader]'in gazabını çekeceğine işaret ediyor."
 czech.32.t:0 "Çek-Macar Yakınlaşması"
 czech.33.a:0 "Beklenenden daha iyi!"
 czech.33.d:0 "[From.GetLeader] teklifimize şaşırtıcı bir şekilde açıktı. Karşılıklı Dostluk Antlaşması imzaladık ve hiçbirimizin diğeri üzerinde herhangi bir toprak talebi olmadığını teyit ettik."
 czech.34.a:0 "Yeni bir şey yok o zaman."
 czech.34.d:0 "Pek şaşırtıcı olmayan bir şekilde, [From.GetLeader], belirli toprakları Macaristan'a teslim etme konusundaki isteksizliğimizi gerekçe göstererek teklifimizi reddetti."
 czech.4.a:0 "Basitliğinde zekice."
 czech.4.b:0 "Başka bir çözüm buluruz."
 czech.4.d:0 "Romanya ile ilişkilerimiz, haklı toprağımız Besarabya'yı işgal etmeleriyle her zaman gergin olmuştur, ancak bu yetmezmiş gibi tüm ulus, [From.GetNameAdj] müttefiklerimizin yardımına koşma yeteneğimizi engelliyor. Aynı müttefikler şimdi bir çözüm önerdiler: Bu sorunu kesin olarak çözmek için Romanya'yı aramızda paylaştıralım!"
 czech.4.t:0 "Romanya Sorunu"
 czech.5.d:0 "[From.GetNameDefCap], Romanya sorununa çözümümüzü onayladı. Ordu hazır ve harekat bizim takdirimize bağlı olarak başlayabilir."
 czech.6.a:0 "Denemeye değerdi."
 czech.6.d:0 "[From.GetLeader], Romanya sorunuyla ilgili önerimizi geri çevirdi. Görünüşe göre hala Romanya için planları var."
 czech.7.a:0 "Neden olmasın, gerçekten."
 czech.7.d:0 "Dünyanın işçilerini kurtarma arayışımızın en başından beri, Polonya baş belasından başka bir şey olmadı. Şimdi [From.GetNameAdj] müttefiklerimiz ilginç bir öneride bulundular: Polonya her iki ulusumuzdan da toprak aldı, o zaman neden iyiliğe karşılık verip Polonya'yı aramızda bölmeyelim?"
 czech.7.t:0 "Polonya Durumu"
 czech.8.d:0 "[From.GetNameDefCap], Polonya Durumuna önerdiğimiz çözümü onayladı. Emir verilir verilmez operasyonlara başlayacağız."
 czech.9.d:0 "[From.GetNameDefCap] önerimizi onaylamadı. Zamanımızı beklemeli ve diğer seçenekleri değerlendirmeliyiz."
 dod_news.1.a:0 "Birlikte bir Büyük Gücüz."
 dod_news.1.b:0 "İlgi çekici bir öneri."
 dod_news.1.c:0 "Kime karşı tasarlandığını unutmadık."
 dod_news.1.d:0 "[From.GetName] bugün, neredeyse feshedilmiş 'Küçük İtilaf' ittifak sisteminin taahhütlerine sadık kalacağını duyurdu. [From.GetNameAdj] Dışişleri Bakanlığı tarafından yayınlanan bir açıklamada şunlar duyuruldu:\n'[From.GetName] bir Büyük Güç değil, ancak bir Bölgesel Güçtür. Bölgesel Güçlerin bir ittifakının, sözde Büyük Güçlerin işlerimize karışmasını önleyebileceğine ve önleyeceğine olan inancımız tamdır."
 dod_news.1.e:0 "Gerekirse, onlardan yine de kısa sürede kurtuluruz."
 dod_news.1.f:0 "Büyüleyici gelişmeler!"
 dod_news.1.t:0 "Küçük İtilaf Yeniden Teyit Edildi"
 dod_news.2.a:0 "Yeni müttefiklerimizle acı sona kadar omuz omuza savaşacağız."
 dod_news.2.b:0 "Akıllıca bir seçim yaptılar."
 dod_news.2.c:0 "En rahatsız edici haberler..."
 dod_news.2.d:0 "Avrupa'nın çoğunu şok eden bir gelişmeyle, [CZE.GetName], [GER.GetNameDef] ile bir İttifak antlaşması imzaladı. Eskiden güçlü bir Demokrat olan [CZE.GetName], son aylarda giderek daha fazla Sağa kayıyordu."
 dod_news.2.t:0 "[CZE.GetName] Mihver'e katılıyor"
 dod_news.3.d:0 "Avrupa'nın çoğunu şok eden bir gelişmeyle, [CZE.GetName], [SOV.GetNameDef] ile bir İttifak antlaşması imzaladı. Eskiden güçlü bir Demokrat olan [CZE.GetName], son aylarda giderek daha fazla Sola kayıyordu."
 dod_news.3.t:0 "[CZE.GetName] Komintern'e katılıyor"
 dod_news.4.a:0 "Başka çare yoktu."
 dod_news.4.b:0 "Öngörüleriyle bir krizi önlediler."
 dod_news.4.c:0 "Akıllıca seçtiler."
 dod_news.4.d:0 "Birçoklarını şaşırtan bir hamleyle, [CZE.GetName] bugün tek taraflı olarak Sudetenland bölgesini Almanya'ya teslim etti. Soru sorulduğunda, [CZE.GetName] Dışişleri Bakanlığı'ndan bir kaynak, 'Rüzgarın ne yöne estiği belliydi, ulusal hayatta kalmanın tek yolu buydu.' diye yanıtladı. \n\nAdı açıklanmayan bir Fransız bakanın, Almanya'nın baskı yapması durumunda Batı'nın [CZE.GetName]'i destekleyeceğini iddia ederek [CZE.GetNameAdj] hamlesini kınadığı bildirildi."
 dod_news.4.e:0 "Bir şey yapabilir miydik?"
 dod_news.4.t:0 "[CZE.GetName] Sudetenland'ı teslim ediyor"
