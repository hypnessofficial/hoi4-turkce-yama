 GER_land_cruiser_equipment_1:0 "Landkreuzer P.1000 Ratte"
 GER_land_cruiser_equipment_1_desc:0 "P.1000 Ratte, II. Dünya Savaşı sırasında geliştirilen bir Alman süper ağır tank konseptiydi. 1942'de Krupp tarafından önerilen tasarım, iki adet 280mm deniz topu, çok sayıda ikincil silah ve 360mm'ye kadar zırhla donatılmış 1000 tonluk zırhlı bir dev öngörüyordu. Ratte'nin herhangi bir savaş alanı muhalefetini alt edebilecek hareketli bir kale olarak hizmet etmesi amaçlanmıştı. Ancak, devasa boyutu, yüksek yakıt tüketimi ve lojistik imkansızlıklar nedeniyle proje uygulanamaz bulundu ve sonunda 1943'te iptal edildi."
 GER_land_cruiser_equipment_1_short:0 "Ratte"
