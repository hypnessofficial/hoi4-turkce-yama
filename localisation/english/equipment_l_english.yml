 GER_super_heavy_tank_aa_equipment_1_desc:0 "İkili 88mm uçaksavar topu monte eden bir Maus şasisi."
 GER_super_heavy_tank_aa_equipment_1_short:0 "FlakMaus"
 GER_super_heavy_tank_artillery_equipment_1:0 "Geschützwagen E-100"
 GER_super_heavy_tank_artillery_equipment_1_desc:0 "Süper ağır bir tank şasisi üzerine monte edilmiş 210 mm'lik bir topçu parçası; bu kundağı motorlu top, bazı demiryolu toplarına güç konusunda rakiptir."
 GER_super_heavy_tank_artillery_equipment_1_short:0 "GW E-100"
 GER_super_heavy_tank_destroyer_equipment_1:0 "Sturmgeschütz auf Fahrgestell Maus"
 GER_super_heavy_tank_destroyer_equipment_1_desc:0 "Sabit bir üst yapıda 150 mm'lik topa sahip bir Maus şasisi."
 GER_super_heavy_tank_destroyer_equipment_1_short:0 "Jagdmaus"
 GER_super_heavy_tank_equipment_1:0 "Panzerkampfwagen VIII Maus"
 GER_super_heavy_tank_equipment_1_desc:0 "Panzerkampfwagen VIII Maus (Fare), 1944'ün sonlarında prototipi yapılan bir Alman İkinci Dünya Savaşı süper ağır tankıydı. Şimdiye kadar inşa edilmiş en ağır tamamen kapalı zırhlı muharebe aracıdır. Maus'un ana silahı, eş eksenli 75 mm'lik bir topla donatılmış 128 mm'lik KwK 44 L/55 toptu."
 GER_super_heavy_tank_equipment_1_short:0 "Maus"
