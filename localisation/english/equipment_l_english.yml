 super_heavy_tank_equipment_1_desc:0 "Süper ağır tanklar, ağır tank kavramının bir evrimidir. Daha büyük, daha iyi silahlanmış, daha fazla zırhlıdırlar; aynı zamanda daha yavaştırlar ve yumuşak zeminde ciddi sorunları vardır. Ağırlıklarını kaldırabilecek çok az köprü vardır."
