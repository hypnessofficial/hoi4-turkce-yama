 GER_heavy_tank_destroyer_equipment_2:0 "Panzerjäger Tiger (P)"
 GER_heavy_tank_destroyer_equipment_2_desc:0 "Elefant (Fil), iptal edilen Porsche Tiger Projesi'nin şasisi üzerine kurulu ve 88 mm Panzerabwehrkanone 43/2 topuyla donatılmış ağır bir tank imha aracıydı."
 GER_heavy_tank_destroyer_equipment_2_short:0 "Elefant"
 GER_heavy_tank_destroyer_equipment_3:0 "Panzerjäger Tiger Ausf. B"
 GER_heavy_tank_destroyer_equipment_3_desc:0 "Jagdtiger, İkinci Dünya Savaşı sırasında operasyonel olarak kullanılan en ağır zırhlı muharebe aracıydı. Araç, 128 mm PaK 44 L/55 ana topunu monte etmişti ve ağır ön zırh taşıyordu."
 GER_heavy_tank_destroyer_equipment_3_short:0 "Jagdtiger"
 GER_heavy_tank_equipment_1:0 "Grosstraktor"
 GER_heavy_tank_equipment_1_desc:0 "Grosstraktor, Almanya'da daha ağır bir tank geliştirmek için yapılmış bir dizi prototipti. Birinci Dünya Savaşı'ndan sonra Almanya'nın askeri gelişimi Versay Antlaşması ile kısıtlandı, ancak 'Traktor' kod adıyla gizli bir program, zırhlı askeri araçlar ve topçu birimleri geliştiriyordu."
 GER_heavy_tank_equipment_1_short:0 "Grosstraktor"
 GER_heavy_tank_equipment_2:0 "Panzerkampfwagen VI Tiger"
 GER_heavy_tank_equipment_2_desc:0 "Tiger I, Mihver Devletleri'nin Sovyetler Birliği'ni işgalinin ilk aylarında karşılaşılan, özellikle T-34 ve KV-1 olmak üzere beklenmedik derecede etkileyici Sovyet zırhlılarına bir cevap olarak 1942'de geliştirilen bir Alman ağır tankıydı."
 GER_heavy_tank_equipment_2_short:0 "Tiger"
 GER_heavy_tank_equipment_3:0 "Panzerkampfwagen Tiger Ausf. B"
 GER_heavy_tank_equipment_3_desc:0 "Resmi olmayan Königstiger adıyla bilinen ancak Müttefik askerleri tarafından King Tiger olarak çevrilen tasarım, Tiger I ile aynı konsepti izledi ancak daha da zorlu olması amaçlandı. Tiger II, Tiger I'in kalın zırhını Panther orta tankında kullanılan eğimli zırh ile birleştirdi. Tank neredeyse yetmiş ton ağırlığındaydı, önden 100 ila 180 mm zırhla korunuyordu ve uzun namlulu 8.8 cm Kampfwagenkanone 43 L/71 topu ile donatılmıştı."
 GER_heavy_tank_equipment_3_short:0 "King Tiger"
