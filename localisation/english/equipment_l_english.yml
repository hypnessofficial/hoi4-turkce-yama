 train_equipment:0 " Tren"
 train_equipment_1:0 " Sivil Tren"
 train_equipment_1_desc:0 "Ordu tarafından normal sivil yük görevinden devralınan bu tren motoru, büyük miktarda malzemeyi uzun mesafeler boyunca taşımak için çok uygundur. Ancak, sivil yapısı onu savunmasız kılar."
 train_equipment_2:0 " Savaş Tasarruflu Tren"
 train_equipment_2_desc:0 "Daha ucuz üretim uğruna normal yük trenlerinde yaygın olan birçok özelliği ihmal eden basitleştirilmiş bir tasarım. Normal bir tren kadar savunmasızdır ancak daha kolay değiştirilebilir."
 train_equipment_3:0 " Zırhlı Tren"
 train_equipment_3_desc:0 "Düşman saldırılarına karşı daha az savunmasız hale getirmek için ağır zırhla kaplanmış bir tren motoru. Diğer tasarımlar kadar kargo taşıyabilir, ancak üretimi daha pahalıdır."
 train_equipment_desc:0 "Trenler, malzemeleri İkmal Başkentinden demiryolu ile birbirine bağlanan İkmal Merkezlerine taşır."
