 motorbike_equipment:0 " Askeri Motosiklet"
 motorbike_equipment_1:0 "Askeri Motosiklet"
 motorbike_equipment_desc:0 "Hızlı ve çok yönlü askeri motosikletler, keşif, iletişim ve hızlı müdahale birimleri olarak hizmet vermek üzere genellikle sepetli ve monteli makineli tüfeklerle donatılır."
 motorized_equipment:0 " Kamyon Teçhizatı"
 motorized_equipment_0:0 "İlkel Kamyon"
 motorized_equipment_0_desc:0 "Büyük Savaş sırasında ordular, malzemeleri taşımak ve teçhizatı çekmek için temel sivil kamyonları kullanmaya başladılar. Bunlar o zamandan beri çoğu ordunun ayrılmaz bir parçası haline geldi."
 motorized_equipment_1:0 "Kamyon Teçhizatı"
 motorized_equipment_1_desc:0 "Piyadeleri motorize etmek, bir ordunun mekanizasyonuna doğru atılan ilk adımdır. Sivil kamyonlar; asker taşıma, top çekme ve teçhizat ile malzeme taşıma gibi askeri kullanımlara kolayca uyarlanabilir. Bu, aksi takdirde yürüyüşe güvenecek olan piyade birimlerinin stratejik hareket kabiliyetini büyük ölçüde artırır."
 motorized_equipment_desc:0 "Askerlerin, ikmal malzemelerinin taşınması ve birim motorizasyonu için kullanılan kamyonlar."
 motorized_rocket_equipment:0 " Motorize Roket Topçusu"
 motorized_rocket_equipment_1:0 "Motorize Roket Topçusu"
 motorized_rocket_equipment_1_desc:0 "Bunlar gibi çoklu roketatarlar, patlayıcıları geleneksel topçulardan daha hızlı bir şekilde hedef bölgeye ulaştırır, ancak doğrulukları daha düşüktür ve yeniden doldurulmaları daha uzun sürer. Kamyonlara monte edilmiş bu versiyon, düşman ateşe karşılık veremeden saldırı başlatıp mevzi değiştirebilir."
 motorized_rocket_equipment_1_short:0 "Mot. Roket Topçusu"
 motorized_rocket_equipment_desc:0 "Bunlar gibi çoklu roketatarlar, patlayıcıları geleneksel topçulardan daha hızlı bir şekilde hedef bölgeye ulaştırır, ancak doğrulukları daha düşüktür ve yeniden doldurulmaları daha uzun sürer. Kamyonlara monte edilmiş bu versiyon, düşman ateşe karşılık veremeden saldırı başlatıp mevzi değiştirebilir."
