 GER_light_tank_destroyer_equipment_1:0 "7.5 cm PaK 40 auf Fahrgestell Marder II"
 GER_light_tank_destroyer_equipment_1_desc:0 "Marder II, Panzer II şasisi temel alınarak yapılmış bir Alman tank imha aracıydı."
