 gw_tank_equipment:0 "Büyük Savaş Tankı"
 gw_tank_equipment_desc:0 "I. Dünya Savaşı'ndaki tanklar, Batı Cephesi'ndeki siper savaşı çıkmazını kırmak amacıyla Birleşik Krallık ve Fransa tarafından ayrı ayrı ve eş zamanlı olarak geliştirildi. Tank adı, amaçlarını gizlemek için bir güvenlik önlemi olarak İngilizler tarafından geliştirilmelerinin ilk aşamalarında kabul edildi. İlk tanklar makineli tüfekler ve küçük toplarla silahlandırılmıştı, yavaş hareket ediyorlardı ve sadece hafif silah ateşini durduracak kadar zırhlılardı."
