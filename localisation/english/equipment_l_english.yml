 GER_heavy_tank_destroyer_equipment_1:0 "Selbstfahrlafette auf VK3001(H) Sturer Emil"
 GER_heavy_tank_destroyer_equipment_1_desc:0 "Selbstfahrlafette auf VK3001(H) Sturer Emil (Almanca: İnatçı Emil), Henschel VK3001 şasisi üzerine kurulu bir Alman kundağı motorlu tanksavar topuydu."
