 GER_light_tank_destroyer_equipment_2:0 "Marder III"
 GER_light_tank_destroyer_equipment_2_short:0 "Marder III"
 GER_light_tank_destroyer_equipment_3:0 "Sturmgeschuetz auf Leopard"
 GER_light_tank_destroyer_equipment_3_desc:0 "JagdLeopard, planlanan VK1602 Leopard hafif tankının olası bir modifikasyonuydu."
 GER_light_tank_destroyer_equipment_3_short:0 "JagdLeopard"
 GER_light_tank_equipment_1:0 "Panzerkampfwagen I"
 GER_light_tank_equipment_1_desc:0 "Panzer I, 1930'larda Almanya'da üretilen bir hafif tanktı. Panzer I'in tasarımı 1932'de başladı ve seri üretimi 1934'te başladı. Alman Ordusuna zırhlı savaş kavramını tanıtmak için yalnızca bir eğitim tankı olarak amaçlanan PzKpfw I, daha modern tankların eksikliği nedeniyle savaşta kapsamlı bir şekilde kullanıldı."
 GER_light_tank_equipment_1_short:0 "Panzer I"
 GER_light_tank_equipment_2:0 "Panzerkampfwagen II"
 GER_light_tank_equipment_2_desc:0 "Panzer II, orijinal olarak daha büyük ve daha gelişmiş araçlar geliştirilirken bir ara çözüm olarak tasarlandı, ancak daha yetenekli tankların yeterli sayıda olmaması nedeniyle savaşta kapsamlı bir şekilde kullanıldı."
 GER_light_tank_equipment_2_short:0 "Panzer II"
 GER_light_tank_equipment_3:0 "VK1602 Leopard"
 GER_light_tank_equipment_3_desc:0 "VK1602 Leopard, 1942'de tasarlanmış bir Alman keşif aracı projesiydi. Aracı 75mm KwK 41 ile donatmayı planlamış olsalar da, bu daha sonra daha küçük bir 50mm top ile değiştirildi. VK 1602, Panther orta tankından etkilenen eğimli bir ön zırha sahipti. Arazi performansını artırmak amacıyla VK 1602'ye 350mm genişliğinde paletler takıldı."
 GER_light_tank_equipment_3_short:0 "Leopard"
 GER_mechanized_equipment_1:0 "Sonderkraftfahrzeug 11"
 GER_mechanized_equipment_1_desc:0 "Sd.Kfz. 11 (Sonderkraftfahrzeug - özel motorlu araç), İkinci Dünya Savaşı'nda çok yaygın bir kullanım gören bir Alman yarı paletli aracıydı. Bir topu veya römorku çekmenin yanı sıra sekiz asker taşıyabiliyordu."
 GER_mechanized_equipment_1_short:0 "Sd.Kfz. 11"
 GER_mechanized_equipment_2:0 "Sonderkraftfahrzeug 251"
 GER_mechanized_equipment_2_desc:0 "Sd.Kfz. 251 yarı paletli aracı, İkinci Dünya Savaşı sırasında Hanomag şirketi tarafından daha önceki Sd.Kfz. 11 aracı temel alınarak tasarlanmış ve ilk kez inşa edilmiş zırhlı bir muharebe aracıydı."
 GER_mechanized_equipment_2_short:0 "Sd.Kfz. 251"
 GER_mechanized_equipment_3:0 "Sonderkraftfahrzeug 251/20"
 GER_mechanized_equipment_3_desc:0 "Kızılötesi projektör ile donatılmış Sd.Kfz. 251'in güncellenmiş bir versiyonu."
 GER_mechanized_equipment_3_short:0 "Sd.Kfz. 251/20"
 GER_medium_tank_aa_equipment_1:0 "Flakpanzer III Möbelwagen"
 GER_medium_tank_aa_equipment_1_desc:0 "Kapalıyken kutu gibi taretinden dolayı 'Möbelwagen' (Mobilya Vanı) takma adını alan bu araç, Panzer IV şasisinden inşa edilmiş ve 3.7cm topla donatılmış, doğaçlama bir kundağı motorlu uçaksavar topuydu."
 GER_medium_tank_aa_equipment_1_short:0 "Möbelwagen"
 GER_medium_tank_aa_equipment_2:0 "Flakpanzer IV Ostwind"
 GER_medium_tank_aa_equipment_2_desc:0 "Flakpanzer IV 'Ostwind' (Almanca: 'Doğu Rüzgarı'), Panzer IV tankı temel alınarak yapılmış bir kundağı motorlu uçaksavar topuydu. 1944 yılında, önceki Flakpanzer IV'ün halefi olarak geliştirildi. Panzer IV'ün taretinin yerini, 3.7 cm FlaK 43'ü barındıran üstü açık, altıgen bir taret aldı. Kapalı bir tasarım tercih edilirdi, ancak topun ürettiği ağır duman nedeniyle bu mümkün değildi."
 GER_medium_tank_aa_equipment_2_short:0 "Ostwind"
 GER_medium_tank_aa_equipment_3:0 "Flakpanzer Wirbelwind"
 GER_medium_tank_aa_equipment_3_short:0 "Wirbelwind"
 GER_medium_tank_artillery_equipment_1:0 "Grille"
 GER_medium_tank_artillery_equipment_1_desc:0 "Sd.Kfz. 138/1 Grille (Almanca: 'Cırcır Böceği'), İkinci Dünya Savaşı sırasında Almanya tarafından kullanılan bir kundağı motorlu topçu birimiydi. Yaklaşık 490-500 Grille üretildi. Panzergrenadier Alaylarının piyade topu bölükleri tarafından ağır hareketli ateş desteği sağlamak için kullanıldılar."
 GER_medium_tank_artillery_equipment_1_short:0 "Grille"
 GER_medium_tank_artillery_equipment_2:0 "Hummel"
 GER_medium_tank_artillery_equipment_2_desc:0 "Hummel (Almanca: 'Yaban Arısı'), 15 cm'lik obüs ile donatılmış, Geschützwagen III/IV şasisi üzerine kurulu kundağı motorlu bir topçu silahıydı. Alman Wehrmacht tarafından İkinci Dünya Savaşı sırasında 1943'ün başından savaşın sonuna kadar kullanıldı."
 GER_medium_tank_artillery_equipment_2_short:0 "Hummel"
 GER_medium_tank_artillery_equipment_3:0 "Brummbär"
 GER_medium_tank_artillery_equipment_3_short:0 "Brummbär"
 GER_medium_tank_destroyer_equipment_1:0 "Sturmgeschütz III"
 GER_medium_tank_destroyer_equipment_1_desc:0 "Sturmgeschütz III taarruz topu, İkinci Dünya Savaşı sırasında Almanya'nın en çok üretilen zırhlı muharebe aracıydı. Kanıtlanmış Panzer III tankının şasisi üzerine inşa edilmişti. Başlangıçta piyade desteği için hareketli, zırhlı bir hafif top olarak amaçlanan StuG, sürekli olarak modifiye edildi ve tank imha aracı olarak yaygın bir şekilde kullanıldı."
 GER_medium_tank_destroyer_equipment_1_short:0 "StuG III"
 GER_medium_tank_destroyer_equipment_2:0 "Jagdpanzer IV"
 GER_medium_tank_destroyer_equipment_2_desc:0 "Jagdpanzer IV, Panzer ve SS-Panzer tümenlerinin tanksavar taburlarında görev yaptı. Normandiya, Ardenler Taarruzu ve Doğu Cephesi'nde savaştılar. Çok başarılı tank imha araçlarıydılar, ancak tankların yerine kullanıldıklarında kötü performans gösterdiler. Buna rağmen, savaşın son günlerinde genellikle başka bir şey mevcut olmadığı için giderek artan bir şekilde tank ikamesi olarak kullanıldılar."
 GER_medium_tank_destroyer_equipment_2_short:0 "JagdPz IV"
 GER_medium_tank_destroyer_equipment_3:0 "Jagdpanther"
 GER_medium_tank_destroyer_equipment_3_desc:0 "Jagdpanther (Almanca: 'av panteri'), İkinci Dünya Savaşı sırasında Nazi Almanyası tarafından Panther tankının şasisi temel alınarak inşa edilmiş bir tank imha aracıydı. Savaşın sonlarına doğru (1944) hizmete girdi ve Doğu ve Batı cephelerinde görev yaptı. Jagdpanther, Tiger II'nin çok güçlü 8.8 cm PaK 43 topunu ve Panther şasisinin karakteristik olarak mükemmel zırh ve süspansiyonunu birleştirdi, ancak savaşın ilerleyen dönemlerinde Almanya'nın genel olarak kötü durumundan muzdaripti; bu da az üretim sayılarına, yedek parça kıtlığına ve yetersiz mürettebat eğitimine yol açtı."
 GER_medium_tank_destroyer_equipment_3_short:0 "Jagdpanther"
 GER_medium_tank_equipment_1:0 "Panzerkampfwagen III"
 GER_medium_tank_equipment_1_desc:0 "Heinz Guderian 1934/35 gibi erken bir tarihte, gelecekteki Alman Panzer Tümenleri için en kalabalık teçhizat görevi görecek iki temel tip öngörmüştü. İlk araç bir tanksavar topu ve iki makineli tüfekle donatılacak, ikincisi ise daha büyük çaplı bir topla donatılmış bir destek aracı olacaktı. İlki, daha sonra bir tank taburunun üç hafif bölüğü için standart tank olması amaçlanan Panzerkampfwagen III olarak tanındı. İkincisi Panzerkampfwagen IV olarak tanındı."
 GER_medium_tank_equipment_1_short:0 "Panzer III"
 GER_medium_tank_equipment_2:0 "Panzerkampfwagen IV"
 GER_medium_tank_equipment_2_desc:0 "Bir piyade destek tankı olarak tasarlanan Panzer IV, başlangıçta düşman zırhlılarıyla çatışması amaçlanmamıştı; bu işlev daha hafif olan Panzer III tarafından yerine getiriliyordu. Bununla birlikte, savaş öncesi doktrinin kusurlarının belirginleşmesi ve Sovyet T-34 tanklarıyla karşı karşıya kalınmasıyla, Panzer IV kısa sürede giderek eskimiş olan kuzeninin tank savaşı rolünü üstlendi. İkinci Dünya Savaşı'nın en yaygın üretilen ve konuşlandırılan Alman tankı olan Panzer IV, diğer birçok muharebe aracının temeli olarak kullanıldı."
 GER_medium_tank_equipment_2_short:0 "Panzer IV"
 GER_medium_tank_equipment_3:0 "Panzerkampfwagen V Panther"
 GER_medium_tank_equipment_3_desc:0 "Panther, Almanya tarafından İkinci Dünya Savaşı'nda 1943'ün ortalarından 1945'te Avrupa savaşının sonuna kadar konuşlandırılan bir orta tankın yaygın adıdır. Rus T-34'üne bir karşı önlem ve Panzer III ve Panzer IV tank serilerinin yerini alması amaçlanmıştı. İkincisinin yerini hiçbir zaman tam olarak almasa da, savaşın sonuna kadar onunla ve daha ağır Tiger tanklarıyla birlikte hizmet etti. Panther'in mükemmel ateş gücü, hareket kabiliyeti ve koruma kombinasyonu, diğer ulusların savaş sonu ve savaş sonrası tank tasarımları için bir referans noktası oldu ve İkinci Dünya Savaşı'nın en iyi tanklarından biri olarak kabul edilir."
 GER_medium_tank_equipment_3_short:0 "Panther"
 GER_modern_tank_aa_equipment_1:0 "Kugelblitz"
 GER_modern_tank_aa_equipment_1_short:0 "Kugelblitz"
 GER_modern_tank_destroyer_equipment_1:0 "E-25 Standardpanzer"
 GER_modern_tank_destroyer_equipment_1_desc:0 "Jagdpanzer IV'ün güncellenmiş bir versiyonu olan E-25 daha hızlı ve daha iyi zırhlıdır"
 GER_modern_tank_destroyer_equipment_1_short:0 "E-25"
 GER_modern_tank_equipment_1:0 "E-50 Standardpanzer"
 GER_modern_tank_equipment_1_desc:0 "Entwicklung serisi, Almanya'nın standartlaştırılmış bir tank tasarımı dizisi üretmeye yönelik savaş sonu girişimiydi. Altı farklı ağırlık sınıfında standart tasarımlar olacaktı. E-50 Standardpanzer, Panther ve Tiger tank serilerinin ve bu tanklara dayalı dönüştürmelerin yerini alacak standart bir orta tank olarak amaçlanmıştı."
 GER_modern_tank_equipment_1_short:0 "E-50"
