 GER_light_tank_artillery_equipment_1:0 "Sturmpanzer I Bison"
 GER_light_tank_artillery_equipment_1_desc:0 "Motorize piyade alaylarının piyade topu bölüklerine atanan çekili toplar, savaş sırasında tanklara ayak uydurmakta zorluk çekiyordu. En kolay çözüm, onu savaşa taşımak için yedek bir tank şasisini modifiye etmekti. Bison örneğinde, Panzer I'in şasisi kullanıldı."
 GER_light_tank_artillery_equipment_1_short:0 "Bison"
 GER_light_tank_artillery_equipment_2:0 "Sd. Kfz. 124 Wespe"
 GER_light_tank_artillery_equipment_2_desc:0 "Sd.Kfz. 124 Wespe (Almanca'da Eşek Arısı), modifiye edilmiş bir Panzer II şasisi üzerine kurulu Alman kundağı motorlu topçu aracıdır."
 GER_light_tank_artillery_equipment_2_short:0 "Wespe"
 GER_light_tank_artillery_equipment_3:0 "Waffenträger Leopard"
 GER_light_tank_artillery_equipment_3_desc:0 "Waffentrager Leopard, planlanan VK1602 Leopard şasisi üzerine kurulması planlanan bir kundağı motorlu topçu aracıydı."
