 ac_engine_upgrade:0 "Motor"
 ac_engine_upgrade_desc:0 "Daha fazla hareket kabiliyeti, taktiksel ve stratejik avantajlar sağlar ve ayrıca önemli ölçüde yavaşlamadan daha fazla zırha izin verir."
 amphibious_mechanized_equipment:0 " Amfibik Çıkarma Araçları"
 amphibious_mechanized_equipment_1:0 "Temel Amfibik Traktör"
 amphibious_mechanized_equipment_1_desc:0 "Amfibik Traktörler veya Amtrac'lar, Deniz Piyadelerinin zırhlı koruma altında bir kumsala çıkarılmasına olanak tanır. Ancak, bu düşük yakıt verimliliği pahasına gelir."
 amphibious_mechanized_equipment_1_short:0 "Temel Amtrac"
 amphibious_mechanized_equipment_2:0 "Geliştirilmiş Amfibik Traktör"
 amphibious_mechanized_equipment_2_desc:0 "Bu Amtrac'lar, kumsalda daha kolay boşaltma için arka yükleme rampası gibi temel versiyona göre çeşitli iyileştirmelere sahiptir."
 amphibious_mechanized_equipment_2_short:0 "Geliştirilmiş Amtrac"
 amphibious_mechanized_equipment_desc:0 "Amfibik Traktörler veya Amtrac'lar, Deniz Piyadelerinin zırhlı koruma altında bir kumsala çıkarılmasına olanak tanır. Ancak, bu düşük yakıt verimliliği pahasına gelir."
 amphibious_mechanized_equipment_short:0 " Amtrac"
 amphibious_tank_equipment:0 " Amfibik Tanklar"
 amphibious_tank_equipment_1:0 "Temel Amfibik Tank"
 amphibious_tank_equipment_1_desc:0 "Esasen yüzmesi için modifiye edilmiş bir hafif tank olan bu araç, bir plaj başı kuran birimlere ateş desteği sağlar."
 amphibious_tank_equipment_2:0 "Geliştirilmiş Amfibik Tank"
 amphibious_tank_equipment_2_desc:0 "Suda hareket etmesi için modifiye edilmiş bir orta tank. Eklenen çok yönlülük ve hareket kabiliyeti, düşük yakıt verimliliği pahasına gelir."
 amphibious_tank_equipment_desc:0 "Suda hareket etmelerini sağlamak için modifiye edilmiş tanklar. Amfibik çıkarmalarda ve nehir geçişlerinde diğer tanklardan çok daha iyi performans gösterirler, ancak daha fazla yakıt gerektirirler."
 amphibious_tank_equipment_short:0 " Amfibik Tanklar"
 anti_air_equipment:0 " Çekili Uçaksavar"
 anti_air_equipment_1:0 "Çekili Uçaksavar"
 anti_air_equipment_1_desc:0 "Uçaksavar topçuları öncelikli olarak düşman uçaklarını düşürmek için tasarlanmıştır, ancak hızlı ateş eden toplar kara hedeflerine karşı da etkili olabilir."
 anti_air_equipment_1_short:0 "Uçaksavar"
 anti_air_equipment_2:0 "Geliştirilmiş Uçaksavar"
 anti_air_equipment_2_desc:0 "Daha uzun kovanlara ve namlulara sahip, yüksekten uçan uçakları hedef alabilen uçaksavar topları."
 anti_air_equipment_3:0 "Gelişmiş Uçaksavar"
 anti_air_equipment_3_desc:0 "En hızlı ve en yüksekten uçan düşman uçaklarıyla bile savaşmak için daha büyük menzile ve atış kapasitesine sahip gelişmiş bir mobil uçaksavar topu."
 anti_air_equipment_desc:0 "Uçaksavar topçuları öncelikli olarak düşman uçaklarını düşürmek için tasarlanmıştır, ancak hızlı ateş eden toplar kara hedeflerine karşı da etkili olabilir."
 anti_air_equipment_short:0 " Uçaksavar"
 anti_tank_equipment:0 " Çekili Tanksavar"
 anti_tank_equipment_1:0 "Çekili Tanksavar"
 anti_tank_equipment_1_desc:0 "Tankları ve diğer sert hedefleri yok etmek için zırh delici mühimmat ateşleyen doğrudan ateşli bir topçu parçası."
 anti_tank_equipment_1_short:0 "Tanksavar"
 anti_tank_equipment_2:0 "Geliştirilmiş Tanksavar"
 anti_tank_equipment_2_desc:0 "Eğimli zırha sahip daha ağır tanklarla savaşmak için daha büyük kalibreli toplar."
 anti_tank_equipment_3:0 "Gelişmiş Tanksavar"
 anti_tank_equipment_3_desc:0 "Farklı türdeki yeni mühimmat teknolojilerini daha yüksek namlu çıkış hızına sahip toplarla birleştiren bu tanksavar topları, düşmanlarımızın geliştirebileceği her türlü yeni zırha hazırlıklıdır."
 anti_tank_equipment_desc:0 "Tankları ve diğer sert hedefleri yok etmek için zırh delici mühimmat ateşleyen doğrudan ateşli bir topçu parçası."
 anti_tank_equipment_short:0 " Tanksavar"
 armor_desc:0 "Paranın satın alabileceği en büyük ve en güçlü zırh."
 armored_car_at_equipment:0 " Tanksavar Zırhlı Aracı"
 armored_car_at_equipment_desc:0 "Hafif mekanize birimlerimiz bir noktada düşman tank kuvvetleriyle temasa geçecek. Özel bir tanksavar varyantı geliştirmek onlara savaşma şansı verecektir."
 armored_car_equipment:0 " Zırhlı Araç Teçhizatı"
 armored_car_equipment_1:0 "Temel Zırhlı Araç"
 armored_car_equipment_1_desc:0 "Geliştirilmiş bir iç yerleşim ve ek mühimmat depolama alanı, daha etkili bir zırhlı araç yaratır."
 armored_car_equipment_2:0 "Geliştirilmiş Zırhlı Araç"
 armored_car_equipment_2_desc:0 "Savaş alanındaki değişiklikler, düşman hafif birimlerini yenmek ve rapor vermek için geri dönmeyi başarabilmek adına çok daha ağır silahlar ve daha kalın zırh gerektiriyor."
 armored_car_equipment_desc:0 "Hafif zırhlı tekerlekli araçlar. Keşif ve direniş bastırma için yaygındır, ancak daha ağır silahlarla donatılabilir."
 armored_support_vehicle:0 "Zırhlı Destek Aracı"
 armored_support_vehicle_1:0 "Zırhlı Destek Aracı"
 armored_support_vehicle_desc:0 "Bu çok yönlü araçlar, zırhlı koruma altında temel savaş alanı desteği ve hareket kabiliyeti sağlar."
 artillery_equipment:0 " Çekili Topçu"
 artillery_equipment_1:0 "Çekili Topçu"
 artillery_equipment_1_desc:0 "Topçu; mühimmatı kişisel silahların etkili menzilinin çok ötesine yansıtabilen, toplar ve obüsler gibi mürettebat tarafından kullanılan büyük kalibreli silahları ifade eder."
 artillery_equipment_1_short:0 "Topçu"
 artillery_equipment_2:0 "Geliştirilmiş Topçu"
 artillery_equipment_2_desc:0 "Yeni hidrolik geri tepme cihazlarından ve daha uzun namlulardan yararlanan yeni obüs tasarımları."
 artillery_equipment_3:0 "Gelişmiş Topçu"
 artillery_equipment_3_desc:0 "Parçalara ayrılarak taşınabilen hafif topçu, daha önce ulaşılması zor bölgelere topçu desteği getirmeyi mümkün kılar."
 artillery_equipment_desc:0 "Topçu; mühimmatı kişisel silahların etkili menzilinin çok ötesine yansıtabilen, toplar ve obüsler gibi büyük kalibreli, mürettebat tarafından kullanılan silahları ifade eder."
 artillery_equipment_short:0 " Topçu"
 ballistic_missile:0 "Balistik Füze"
 ballistic_missile_equipment:0 " Balistik Füze"
 ballistic_missile_equipment_1:0 "Temel Balistik Füze"
 ballistic_missile_equipment_1_desc:0 "Stratejik bombardıman için insansız bir balistik füze"
 ballistic_missile_equipment_1_short:0 "Balistik Füze I"
 ballistic_missile_equipment_2:0 "Orta Menzilli Balistik Füze"
 ballistic_missile_equipment_2_desc:0 "Stratejik bombardıman için geliştirilmiş bir insansız balistik füze"
 ballistic_missile_equipment_2_short:0 "OMBF"
 ballistic_missile_equipment_3:0 "Kıtalararası Balistik Füze"
 ballistic_missile_equipment_3_desc:0 "Stratejik bombardıman için uzun menzilli bir insansız balistik füze"
 ballistic_missile_equipment_3_short:0 "KABF"
 ballistic_missile_equipment_desc:0 "Stratejik bombardıman için insansız bir balistik füze"
 ballistic_missile_equipment_short:0 "Balistik Füze"
 battle_cruiser:0 "Muharebe Kruvazörü"
 battle_cruiser_desc:0 "Saldırı yetenekleri genellikle bir zırhlıya yakın olan, ancak daha yüksek hız için daha zayıf zırhla takas edilmiş büyük bir ana gemi."
 battleship:0 "Zırhlı"
 battleship_desc:0 "Paranın satın alabileceği en büyük toplara ve en güçlü zırha sahip en büyük ana gemi. Böylesine pahalı bir yatırım, daha küçük eskort gemilerinin desteğini hak eder."
 both_cruisers_desc:0 "Hafif Kruvazör - Bir hafif eskort gemisi. Birincil görevi ana gemileri düşman hafif gemilerinden korumaktır, ancak daha büyük gemilere zarar verebilecek güçlü torpidolar da ateşleyebilir.\n\nAğır Kruvazör - Oldukça esnek, büyük bir zırhlı kruvazör. Daha büyük ana gemiler inşa etmeye gücü yetmeyen uluslar için iyi bir seçim."
 carrier:0 " Uçak Gemisi"
 carrier_armor_upgrade:0 "Zırh"
 carrier_armor_upgrade_desc:0 "Gemini düşman ateşine karşı korumak için daha fazla zırh."
 carrier_desc:0 "Savaşa güçlü uçak gemisi uçak filoları taşıyabilen bir ana gemi. Ayrıca düşmanınızın kıyısına yerleştirebileceğiniz yüzer bir havaalanı olarak da kullanışlıdır."
 convoy:0 " Konvoy"
 convoy_1:0 " Konvoy"
 convoy_desc:0 "Malların ve kaynakların uluslararası ticareti için kullanılan konvoylar. Ayrıca askerleri taşımak ve deniz istilaları gerçekleştirmek için de kullanılır."
 cv_plane_gun_upgrade:0 "Silahlar"
 cv_plane_gun_upgrade_desc:0 "Diğer uçaklarla savaşmak için daha iyi silahlar."
 cv_plane_naval_upgrade:0 "Saldırı"
 cv_plane_naval_upgrade_desc:0 "Gemi karşıtı silahların daha fazla taşıma kapasitesi."
 cv_plane_range_upgrade:0 "Menzil"
 cv_plane_range_upgrade_desc:0 "Daha iyi menzile sahip bir uçak, görevler için daha fazla stratejik alana ulaşabilir."
 destroyer:0 "Muhrip"
 destroyer_desc:0 "En hafif eskort gemisi. İşi, daha büyük gemileri savunmak ve denizaltıları bulup yok etmektir."
 destroyer_engine_upgrade:0 "Motor"
 destroyer_engine_upgrade_desc:0 "Daha güçlü bir motora sahip bir gemi, savaşta rakiplerine olan mesafesini kontrol edebilir."
 explosive_ammo_equipment:0 "$mega_gun_emplacement$"
