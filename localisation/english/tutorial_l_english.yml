 HINT_AIR_BASE:0 "İpucu: Hava Üssü"
 HINT_AIR_BASE_TEXT:0 "Dünya, önceden tanımlanmış §YHava Sahalarına§! bölünmüştür. Bir §YHava Filosu§!, aynı tipteki (örneğin Avcılar veya Bombardıman Uçakları) bir grup uçaktır ve bir sahaya atanabilirler.\n\nHaritadaki bir §YHava Üssüne§! tıkladığınızda o Hava Üssünü açar ve o üssündeki tüm Hava Filolarını otomatik olarak seçer.\n\nSeçili bir Hava Filosunu bir sahaya atamak veya başka bir Hava Üssüne yeniden üslendirmek için Hava Sahasına veya Hava Üssüne §Gsağ tıklayın§!.\n\nAyrıca, bir Hava Filosu seçip ekranın altındaki Orduya §Gsağ tıklayarak§! Hava Filolarını Ordulara bağlayabilirsiniz."
 HINT_ARMY_PLANNER:0 "İpucu: Asker Al & Konuşlandır"
 HINT_ARMY_PLANNER_TEXT_1_1:0 "Bu, §YAsker Al & Konuşlandır§! ekranıdır ve burası yeni tümenleri eğitim için ve daha sonra konuşlandırma için kuyruğa aldığınız yerdir. Kuyruğa bir §YPiyade Tümeni§! (Divisione di Fanteria) eklemenizi öneririz.\n\nEğitimdeki tümenler önce ihtiyaç duydukları §YTeçhizatı§! toplamaya çalışacaklardır. Teçhizata sahip olduklarında eğitimlerine başlayacaklardır. Eğitim ilerlemesi asla teçhizat ilerlemesini geçemez.\n\nEğitim için bir Tümen eklemek üzere §YEğit§! düğmesine tıklayın."
 HINT_ARMY_PLANNER_TEXT_1_2:0 "Tümenler eğitimlerini tamamladıktan sonra, §Yseçtiğiniz bir konuma§! §YKonuşlandırılabilirler§!. Tümenleri yalnızca çekirdek bölgenize konuşlandırabilirsiniz."
 HINT_ARMY_PLANNER_TEXT_2:0 "Tümenler seri ve/veya paralel olarak üretilebilir.\n\nParalel olarak eğitilen tümenler §YTeçhizatı§! aynı oranda kazanacaklardır, bu nedenle hepsi kabaca aynı zamanda bitecektir. Bir Tümen ihtiyaç duyduğu tüm teçhizata sahip olduğunda ve tam olarak eğitildiğinde seçtiğiniz konuma konuşlandırılacaktır.\n\nParalel eğitim için başka bir Tümen eklemek üzere §YBirim Ekle§! seçeneğine tıklayın.\n\nSavaşın gidişatı aleyhinize döndüyse, Tümenlerinizi §Ytüm teçhizatları ve eğitimleri tamamlanmadan önce§! Konuşlandırmak uygun olabilir. Yapabildiğinizde bundan kaçınılmalıdır.\n\nHOI4 Wiki'de hangi birimleri askere alacağınız hakkında daha fazla bilgi edinebilirsiniz!"
 HINT_CONSTRUCTIONS:0 "İpucu: İnşaatlar"
 HINT_CONSTRUCTIONS_TEXT:0 "Bu, §Yİnşaatlar§! ekranıdır ve Eyaletlerinizi ve Vilayetlerinizi binalar inşa ederek geliştirmek için kullanılır. Oyunun başında, £GFX_mil_factory §YAskeri Fabrikalar§! veya daha özel yapılar inşa etmeye başlamadan önce birkaç yıl boyunca £GFX_civ_factory §YSivil Fabrikalar§! inşa etmeniz önerilir. Sivil Fabrikalar inşa ederek uzun vadede daha fazla bina inşa edebileceksiniz.\n\nTüm boş Sivil Fabrikalar, İnşaat kuyruğundaki sıralarına göre yeni binalar inşa edecektir. £GFX_infrastructure_texticon §G%80§! §YEyalet Altyapısı§! ne kadar yüksek olursa, inşaat o kadar hızlı olur.\n\nSivil Fabrikalar sizin için vurgulanmıştır. §Yİnşaat Modunu etkinleştirmek için tıklayın§!. İnşaat Modu etkinken, bir binanın inşasını kuyruğa almak için haritaya tıklayın. §YMaksimum miktarı kuyruğa almak için shift tuşunu basılı tutun ve tıklayın.§!"
 HINT_DECISION_SCREEN:0 "İpucu: Olaylar ve Kararlar"
 HINT_DECISION_SCREEN_TEXT:0 "§YOlaylar§! oyun boyunca meydana gelir. Oyunda, bir oyuncunun ülkesi için olumlu, olumsuz ve karışık sonuçlara yol açabilen çok çeşitli olaylar vardır. Oyuncunun ekranında bir açılır bildirim şeklinde görünürler, bu da bir oyuncuya bir seçenek sunabilir veya oyuncuyu sonuçlar hakkında basitçe bilgilendirebilir ve olayın meydana geldiğini kabul etmelerini gerektirebilir.\n\n§YKararlar§!, çabalayabileceğiniz uzun ve/veya kısa vadeli hedeflerdir. Karar vermek £pol_power §YSiyasi Güç§! gerektirir. \n\nBazı kararlar zamanlıdır ve belirli koşulların belirli bir süre içinde tamamlanmasını gerektirir."
 HINT_DIPLOMACY_SCREEN:0 "İpucu: Diplomasi"
 HINT_DIPLOMACY_TEXT:0 "Bu, §YDiplomasi§! ekranıdır ve burada diğer ülkelerin sizin hakkınızdaki görüşlerini, başka ülkeler tarafından garanti edilip edilmediklerini görebilirsiniz.\n\nHedeflediğiniz ülkenin çağırabileceği müttefikleri olup olmadığını öğrenmek iyidir.\n\nMevcut diplomatik etkileşimleri görmek için herhangi bir ülkeye §GSağ Tıklayabilirsiniz§!."
 HINT_DIVISION_DESIGNER:0 "İpucu: Tümen Tasarımcısı"
 HINT_DIVISION_DESIGNER_NOXP_TEXT:0 "Bu, §YTümen Tasarımcısı§!'dır ve yeni §YTümen Şablonları§! oluşturmak veya düzenlemek için kullanılır. Bir Tümen Şablonunu düzenlemek veya yeni bir tane oluşturmak size £army_experience  §YOrdu Deneyimi§! kazandıracaktır. Ordu Deneyimi, birimleriniz savaşa girdiğinde veya ordu tatbikatlarındayken kazanılır. Deneyim Seviyesi 1 - §YYeşil§! olan birimler £army_experience  Ordu Deneyimi üretmez.\n\nBir Tümen Şablonu oluşturmadan veya düzenlemeden önce daha fazla £army_experience Ordu Deneyimine ihtiyacınız olacak."
 HINT_DIVISION_DESIGNER_XP_TEXT:0 "Bu, §YTümen Tasarımcısı§!'dır ve yeni §YTümen Şablonları§! oluşturmak veya düzenlemek için kullanılır. Bir Tümen Şablonunu düzenlemek veya yeni bir tane oluşturmak size £army_experience  §YOrdu Deneyimi§! kazandıracaktır. Ordu Deneyimi, birimleriniz savaşa girdiğinde veya ordu tatbikatlarındayken kazanılır. Deneyim Seviyesi 1 - §YYeşil§! olan birimler £army_experience  Ordu Deneyimi üretmez.\n\nİlk şablon düzenlemeniz için, tümeninize £unit_artillery_icon_small §YDestek Topçusu§! eklemek üzere Destek sütununun altındaki boş yuvaya tıklamanızı öneririz. Ekledikten sonra §YKaydet§!'e tıklayın. Bu şablonu kullanan tümenleriniz şimdi Topçu §YTeçhizatı§! istemeye başlayacaktır."
 HINT_EDIT_TEMPLATE_TEXT:0 "Herhangi bir §YTümen Şablonu§! tarafından kullanılmayan teçhizat üretiyorsunuz. Ancak bununla ilgili bir şeyler yapmak için £army_experience §YOrdu Deneyiminiz§! de var.\n\n§YPiyade Tümeni§!'nin (Divisione di Fanteria) veya seçtiğiniz başka bir Tümenin yanındaki §YDüzenle§!'ye tıklayın."
 HINT_EXECUTE_ORDER_TEXT:0 "Portrenin altında, Ordunuz ile olası düşman kuvvetleri arasındaki göreceli gücü gösteren küçük bir ilerleme çubuğu (3) vardır.\n\n Orduya henüz bir Komutan atamadıysanız, muhtemelen şimdi yapmalısınız. Sol üstteki boş portreye tıklayın.\n\nHer şey lehinize görünüyorsa tahmini plan ışığı (2) yeşil olmalıdır. Öyleyse, Planı Uygula düğmesine (1) tıklayın."
 HINT_INTELLIGENCEAGENCY_SCREEN:0 "İpucu: İstihbarat Teşkilatı"
 HINT_INTELLIGENCEAGENCY_SCREEN_TEXT:0 "Bu, §Yİstihbarat Teşkilatı§! ekranıdır. Casusları işe almak, istihbarat toplamak, casus §Yağları§! kurmak ve gizli §Yoperasyonlar§! yürütmek için bir §Yİstihbarat Teşkilatı§! gereklidir. §YKriptoloji§! savaşın başka bir yönüdür ve düşmanın şifresini kırmak size savaş alanında büyük bir avantaj sağlayabilir.\n\nİstihbaratınız ne kadar yüksek olursa, düşmanınızın birlik konuşlandırmaları, endüstriyel kapasitesi, araştırma odakları ve daha fazlası hakkında o kadar çok şey bilirsiniz.\n\n§YDiplomasi§!'nin yanındaki sekmede §Yİstihbarat Defterini§! göstermek için bir ülkeye §GSağ Tıklayabilirsiniz§!."
 HINT_LOGISTICS:0 "İpucu: Lojistik ve İkmal"
 HINT_LOGISTICS_TEXT:0 "Bu, §YLojistik§! ekranıdır ve amacı, teçhizatı harcadığınızdan daha hızlı mı yoksa daha yavaş mı ürettiğinizi görmenize yardımcı olmaktır.\n\nBir tür §YTeçhizattan§! ihtiyacınız olduğunu düşündüğünüzden daha fazlasını üretiyorsanız, o tür Teçhizatı üreten §YÜretim Hattında§! çalışan fabrika sayısını azaltmak iyi bir fikir olabilir.\n\nTümenlerinizin iyi §Yikmal§! alıp almadığı, savaş alanındaki başarılarınızın önemli bir parçasıdır. §Yİkmal Harita Moduna§! £GFX_F4  geçerek ikmal durumunuzu kontrol edebilirsiniz."
 HINT_LOGISTICS_TEXT_2:0 "Tedarik, £GFX_capital_hub_texticon §YSermaye Tedarik Merkezi§!'den dağıtılır ve £GFX_train_texticon §YTrenler§! veya £GFX_convoy_texticon aracılığıyla akar §YKonvoylar§! - £GFX_supply_hub_texticon §YTedarik Merkezleri§! veya £GFX_naval_supply_hub_texticon §YDeniz Üsleri§! farklı illerde. \n\nTedarik daha sonra merkezin menzilindeki saha bölümlerine dağıtılır. Bir £GFX_supply_hub_texticon §YTedarik Merkezi§! seçip £GFX_shift tuşunu basılı tutarak aralığı görebilirsiniz. Menzil, £GFX_unit_motorized_icon_small §YKamyonlar§! kullanan motorizasyondan etkilenebilir.\n\nVerimlilik ayrıca £GFX_railways_texticon §YDemiryolları§! seviyesinden etkilenir ve £GFX_naval_supply_hub_texticon §YDeniz Üsleri§!, £GFX_train_texticon §YTrenlerin eksikliği§! ve düşman hava saldırıları. Bu, §Rdarboğazlar§! yaratır. Demiryollarını sermaye tedarik merkezine yükselterek, savaş uçaklarıyla hava savunması sağlayarak ve yeterli trene sahip olduğundan emin olarak bu sorunlar hafifletilebilir. Tedarik kullanılabilirliği §YTedarik Harita modunda§! £GFX_F4'de gösterilir."
 HINT_LOW_SUPPLY:0 "İpucu: İkmal"
 HINT_LOW_SUPPLY_TEXT_1:0 "Tümenlerinizi savaşa hazır tutmak için erzaklara ihtiyacınız olacak. Tedarik, £GFX_capital_hub_texticon §YSermaye Tedarik Merkezi§!'den dağıtılır ve £GFX_train_texticon §YTrenler§! veya £GFX_convoy_texticon aracılığıyla akar §YKonvoylar§! - £GFX_supply_hub_texticon §YTedarik Merkezleri§! veya £GFX_naval_supply_hub_texticon §YDeniz Üsleri§! farklı illerde. \n\nTedarik daha sonra merkezin menzilindeki saha bölümlerine dağıtılır. Bir £GFX_supply_hub_texticon §YTedarik Merkezi§! seçip £GFX_shift tuşunu basılı tutarak aralığı görebilirsiniz. §YMotorizasyon Önceliği§!, merkezin menzilini artırabilir, bu da bölümlerinizin tedarik aldığı menzili artırır. Bu, £GFX_unit_motorized_icon_small §YTrucks§!'yi kullanacaktır."
 HINT_LOW_SUPPLY_TEXT_2:0 "Bir Ordu üzerindeki §YMotorizasyon Önceliğini§!, onu seçerek ve sol üstteki bu üç seviye arasında geçiş yaparak değiştirebilirsiniz. Varsayılan olarak öncelik düşüktür ve bu da £GFX_unit_motorized_icon_small §YKamyonlar§! kullanmaz. \n\nİkmal mevcudiyeti §Yİkmal Harita Modunda§!  £GFX_F4  gösterilir. §YVarsayılan Harita Moduna§! geri dönmek için £GFX_F1  'e tıklayın."
 HINT_NATIONAL_FOCUS:0 "İpucu: Milli Hedef"
 HINT_NATIONAL_FOCUS_RECOMMENDED_TEXT:0 "Önerilen Milli Hedef"
 HINT_NATIONAL_FOCUS_TEXT:0 "Bu, §YMilli Hedef§! ekranıdır ve ülkenizin oyunun ilerlemesine yardımcı olan etkiler veya bonuslarla sonuçlanacak siyasi hedeflerini seçmesine olanak tanır.\n\nBaşlamanız için önerdiğimiz birkaç Milli Hedefi sizin için vurguladık. Bu yolun önerilmesinin nedeni, mümkün olan en kısa sürede başka bir §YAraştırma Yuvası§! kazanmanızı sağlamasıdır, bu da aynı anda bir £tech_mod  §YTeknoloji§! daha araştırmanıza olanak tanıyacaktır."
 HINT_NAVAL_MISSIONS:0 "İpucu: Deniz Görevleri"
 HINT_NAVAL_MISSIONS_TEXT:0 "Bu, §YFilo§! arayüzüdür ve burası seçili bir filoyu görüntüleyebileceğiniz ve emir verebileceğiniz yerdir. Filolarınızı §YDeniz Görevlerine§! göndererek belirli işleri yapmalarını sağlayabilirsiniz.\n\nBir filo genellikle birkaç §YGörev Gücüne§! ayrılır. Filolar aynı anda birkaç bölgede aktif olabilir, ancak Görev Güçleri genellikle olamaz. Bir filo bir Deniz Görevindeyken tüm atanan bölgeleri kapsamaya çalışacaktır, ancak bu onu güçlü bir düşman kuvvetine direnemeyecek kadar dağınık bırakabilir. \n\nBir filoyu §YDeniz Görevine§! göndermek için, vurgulanan görev düğmelerinden birine tıklayın ve ardından bir §YDeniz Bölgesine§! §Gsağ tıklayın§!. Filonuzu/filolarınızı bir bölgede §YDevriye Gezmeye§! göndermek iyi bir fikir olabilir."
 HINT_NO_TEMPLATE:0 "İpucu: Şablon Yok"
 HINT_NO_TEMPLATE_HAVE_XP_TEXT:0 "Şu anda kullanmadığınız Teçhizat ürettiğinizi gösteren §YŞablon Yok uyarısına§! tıkladınız.\n\nTümenlerinizin yeni tür teçhizat kullanmaya başlamasına izin vermek için §YTümen Şablonlarını§! düzenlemeniz gerekir. Bir Tümen Şablonunu düzenlemek £army_experience  §YOrdu Deneyimi§! gerektirir.\n\n§YAsker Al & Konuşlandır§! ekranına gidin ve §YDüzenlemek§! için bir Tümen Şablonu seçin.\n\nBu uyarıya araç ipucu ekleyerek hangi tür Teçhizat ürettiğinizi ancak şu anda kullanmadığınızı görebilirsiniz."
 HINT_NO_TEMPLATE_NO_XP_TEXT:0 "§YŞablon Yok uyarısına§! tıkladınız. Endişelenmeyin! Cevaplar için uyarılara bakmaya devam etmeniz çok iyi, size yardımcı olmak için oradalar.\n\nBüyük ihtimalle, Topçu teçhizatı üreten bir Üretim Hattı oluşturdunuz. Şu anda, §YTümenlerinizden§! hiçbiri bu teçhizatı herhangi bir §YTümen Şablonunda§! kullanmıyor.\n\nDaha fazla £army_experience  §YOrdu Deneyimi§! kazandığınızda, Tümen Şablonlarınızı Topçu içerecek şekilde düzenleyebilirsiniz. £army_experience  Ordu Deneyimi, Tümenleriniz savaşa girdiğinde veya ordu tatbikatlarındayken kazanılır.\n\nBu uyarıyı şimdilik görmezden gelebilirsiniz, çünkü bu eğitim daha fazla £army_experience  Ordu Deneyimi kazandığınızda size yardımcı olacaktır."
 HINT_OBJ_LOG_1:0 "§Lİkmal Harita Moduna§! £GFX_F4 geç"
 HINT_OBJ_LOG_2:0 "§LDüzenli harita moduna§! £GFX_F1 geri dön"
 HINT_OCCUPIED_TERRITORIES_SCREEN:0 "İpucu: İşgal Edilmiş Topraklar"
 HINT_OCCUPIED_TERRITORIES_SCREEN_TEXT:0 "Direnişle mücadele etmek ve nüfusu denetlemek için, işgal edilmiş eyaletlerin polislik görevlerini yerine getirmek üzere askeri birlikler tarafından garnizon edilmesi gerekecektir. Oyun içi Garnizon bunu temsil eder ve sol üst köşedeki ülke bayrağınıza tıklayarak açılan §YSiyaset Ekranınızdaki§! §Yİşgal Edilmiş Topraklar§! sekmesinden atanabilir.\n\nGarnizonları personel olarak görevlendirmek için gereken tümenler haritada görünmez ve otomatik olarak tahsis edilir ve teçhizatlarını alırlar. Teçhizat tahsisi §YAsker Al & Konuşlandır§! sekmesinden ayarlanabilir."
 HINT_OFFICER_CORPS_SCREEN:0 "İpucu: Subay Kolordusu"
 HINT_OFFICER_CORPS_SCREEN_TEXT_1:0 "Bu, §YSubay Kolordusu§! ekranıdır. Burası §YAskeri Yüksek Komuta§!, bir §YTeorisyen§! ve ayrıca §YKara Kuvvetleri§!, §YDeniz Kuvvetleri§! ve §YHava Kuvvetleri§! Komutanlarını atadığınız yerdir. \n\nAskeri Yüksek Komuta ve Komutanlar günlük £army_experience  §YOrdu Deneyimi§!, £navy_experience  §YDeniz Deneyimi§!, £air_experience  §YHava Deneyimi§! ve her birimin altında gösterilen belirli istatistiklere bonuslar sağlar."
 HINT_OFFICER_CORPS_SCREEN_TEXT_2:0 "Teorisyenler, genel stratejiye odaklanan Kara, Deniz ve Hava §YDoktrinlerinin§! maliyetini düşürür. Bunlar her askeri birim için ayarlanır ve konuşlandırılmış tümenlere, filolara ve hava alaylarına bonuslar sağlar."
 HINT_POLITICS_SCREEN:0 "İpucu: Siyasi"
 HINT_POLITICS_SCREEN_TEXT:0 "Bu, §YSiyaset Ekranı§!'dır ve burası ülkenizin §YMilli Hedefleri§!, £pol_idea §YFikirleri§!, §YYasaları§! ve daha fazlası gibi şeylere erişebileceğiniz yerdir.\n\n£pol_power §YSiyasi Güç§!, ülkenizin siyasi hedeflerine ulaşma yeteneğini temsil eder.\nDanışman tutmak, hak iddialarını gerekçelendirmek veya bağımsızlığı garanti etmek, £pol_power Siyasi Güç gerektiren eylemlere örnektir.\n\n£pol_idea Fikirler, ülkenize farklı alanlarda bonuslar sağlar, ancak etkinleştirmek için £pol_power Siyasi Güç de gerektirirler."
 HINT_PRODUCTION_LINES:0 "İpucu: Üretim Hatları"
 HINT_PRODUCTION_LINES_2_1:0 "Aşağıdaki resimde, §Y10§! £factory_item  §YAskeri Fabrika§! atanmış bir Üretim Hattı örneği görebilirsiniz."
 HINT_PRODUCTION_LINES_2_2:0 "Ayrıca şunlar için Üretim Hatları oluşturmanızı öneririz:"
 HINT_PRODUCTION_LINES_TEXT_1:0 "Bu, §YÜretim Hatları§! ekranıdır. Üretim Hatları, savaş çabalarınız için gereken teçhizatı üretir. Hem şimdi ihtiyaç duyduğunuz hem de gelecekte ihtiyaç duyabileceğiniz teçhizatı üretmeniz önerilir.\n\nİki tür Üretim Hattı vardır: Askeri ve Deniz. Birincisi £factory_item  §YAskeri Fabrikaları§! ve ikincisi £naval_factory_icon  §YDeniz Tersanelerini§! kullanır. Bir Üretim Hattına ne kadar çok fabrika atanırsa, ihtiyacınız olan teçhizatı o kadar hızlı üretir.\n\nDört vurgulanan düğmeden birine tıklayarak bir Üretim Hattı oluşturulabilir."
 HINT_PRODUCTION_LINES_TEXT_2:0 "Bir teçhizat türü seçtiğinizde, o teçhizat türü için bir Üretim Hattı oluşturulacaktır.\n\nNe üreteceğiniz ve her Üretim Hattına kaç fabrika atayacağınız konusunda §Yönerileri görmek§! için bu ipucunun §Ysonraki sayfasını§! okuyun."
 HINT_RESEARCH_SCREEN:0 "İpucu: Araştırma"
 HINT_RESEARCH_SCREEN_TEXT:0 "Bu, §YAraştırma§! ekranıdır. Her biri bir £tech_mod  §YTeknoloji§! araştırabilen birkaç araştırma yuvanız vardır. Araştırılacak bir şey seçmek için boş §YAraştırma Yuvasına§! tıklayın.\n\nÜlkelerin farklı sayıda Araştırma Yuvası vardır, Büyük Güçlerin genellikle daha fazlası vardır. §YMilli Hedefler§! aracılığıyla ek bir yuva açmak mümkündür. Milli Hedefler başka bir uyarı ve başka bir ipucu ile ele alınacaktır."
 HINT_RESEARCH_TREE:0 "İpucu: Araştırma Ağacı"
 HINT_RESEARCH_TREE_TEXT:0 "Bu, §YAraştırma Ağacı§!'dır. İlk başta bunaltıcı görünse de, aslında çok karmaşık değildir. Oyunun başında araştırılması önerilen bazı teknolojileri vurguladık.\n\nÜlkenizin endüstriyel tabanını güçlendiren teknolojilerin yanı sıra daha genel askeri iyileştirmeleri araştırmak iyi bir fikirdir. Oyun ilerledikçe Tanklar veya Uçaklar gibi daha özel Teknolojileri araştırmak geçerli olabilir. Her şey neyi başarmaya çalıştığınıza bağlıdır.\n\nBir şeyi zamanından önce araştırmaya çalışıyorsanız Teknolojileri araştırmak daha uzun sürer. Belirli Teknolojiler için zamanından önce araştırma cezasını azaltabilecek §YMilli Hedefler§! vardır."
 HINT_SELECT_UNIT_TEXT:0 "§YEtiyopya§! ile savaşma zamanı geldi. Bir Saldırı Emri ile bir Savaş Planı oluşturarak birimlerinize emir vererek başlamalısınız.\n\n§YEritre§! eyaletindeki §Yvurgulanan Tümenleri seçin§!."
 HINT_TRADE_SCREEN:0 "İpucu: Ticaret"
 HINT_TRADE_SCREEN_TEXT:0 "Bu, §YTicaret§! ekranıdır ve £GFX_civ_factory §YSivil Fabrikalarınızı§! kaynaklar karşılığında takas etmenize olanak tanır.\n\nÜretim hatlarınızdan birinin gerekli kaynaklara sahip olmadığı her zaman §YYetersiz Kaynak uyarısı§! gösterilecektir. Üretim hatları teçhizat üretmeye devam edecektir, ancak daha düşük bir hızda. Ticaret bu sorunu çözmek için geçerli bir seçenektir.\n\nSivil Fabrikalarınızı kaynaklar karşılığında takas ettiğinizde, bina inşa etmek için kullanılamayacaklarını unutmayın."
 HINT_WAR_SCREEN:0 "İpucu: Savaş"
 HINT_WAR_SCREEN_TEXT:0 "Bu, §YSavaş§! ekranıdır ve bir savaşın nasıl ilerlediğini size gösterecektir.\n\nİtalya, Etiyopya ile savaşta başlıyor, ancak şu anda bunun için endişelenmenize gerek yok. Diğer uyarılara bakarak devam edin."
 HINT_WORLD_TENSION:0 "İpucu: Dünya Gerginliği"
 HINT_WORLD_TENSION_TEXT:0 "Bu, £world_tension_icon  §YDünya Gerginliği§! ekranıdır. Dünya Gerginliğini bir şekilde etkileyen tüm olaylar buradaki listede gösterilecektir.\n\nDünya Gerginliği, oyunun ne kadar ısındığının bir ölçüsüdür. Belirli ülkelerin Dünya Gerginliği yeterince yüksek olana kadar belirli §YDiplomatik Eylemleri§! kilitli olabilir.\n\nGenel olarak konuşursak, Mihver güçleri Demokratik ülkelerin müdahale etmesini önlemek için Dünya Gerginliğinin düşük kalmasını isterken, Demokratik ülkeler müdahale edebilmek için Dünya Gerginliğinin yüksek olmasını ister.\n\nSavaş İlan Etmek, hak iddialarını gerekçelendirmek, toprak ilhak etmek, belirli §YMilli Hedefleri§! tamamlamak, Dünya Gerginliğini artırabilecek eylem örnekleridir.\n\nDünya Gerginliği ne kadar yüksek olursa, bir Dünya Savaşı'na o kadar yakın olursunuz."
 HINT_WORLD_TENSION_TEXT_2:0 "£world_tension_icon  §YDünya Gerginliği§!, oyunun ne kadar ısındığının bir ölçüsüdür. Belirli ülkelerin Dünya Gerginliği yeterince yüksek olana kadar belirli §YDiplomatik Eylemleri§! kilitli olabilir.\n\nGenel olarak konuşursak, Faşist ve Komünist güçler Demokratik ülkelerin müdahale etmesini önlemek için Dünya Gerginliğinin düşük kalmasını isterken, Demokratik ülkeler müdahale edebilmek için Dünya Gerginliğinin yüksek olmasını ister.\n\nSavaş İlan Etmek, hak iddialarını gerekçelendirmek, toprak ilhak etmek, belirli §YMilli Hedefleri§! tamamlamak, Dünya Gerginliğini artırabilecek eylem örnekleridir.\n\nDünya Gerginliği ne kadar yüksek olursa, bir Dünya Savaşı'na o kadar yakın olursunuz."
 INTERNATIONAL_MARKET_HINT_SCREEN:0 "İpucu: Uluslararası Pazar"
 INTERNATIONAL_MARKET_HINT_SCREEN_TEXT:0 "Bu, §YUluslararası Pazar§! ekranıdır. Burada diğer ülkelerden teçhizat satın alabilir ve kendinizinkini £GFX_civ_factory_output $CIC_BANK_HIGHLIGHT$ karşılığında satabilirsiniz, bu da inşaat hızınızı geçici olarak artıracaktır.\n\nTeçhizat satın aldığınızda, sözleşmeye £GFX_civ_factory §YSivil Fabrikalar§! atamanız gerekir, bu da teçhizat için ödemeniz gereken £GFX_civ_factory_output $CIC_BANK_HIGHLIGHT$'ı üretecektir. Ne kadar çok fabrika atarsanız, o kadar az teslimat olacak ve toplam teçhizat miktarını daha hızlı alacaksınız. £GFX_civ_factory §YSivil Fabrikalarınızı§! sözleşmeler için ödeme yapmak üzere atadığınızda, bina inşa etmek için kullanılamayacaklarını unutmayın.\n\n§YVerimsiz Sözleşme uyarısı§!, sözleşmelerinizden birinin beklenen miktarda teçhizat teslim etmediği veya beklenen miktarda £GFX_civ_factory_output $CIC_BANK_HIGHLIGHT$ üretmediği her zaman §YUluslararası Pazar§! düğmesinde gösterilecektir. Sözleşme yine de devam edecektir, ancak tamamlanması daha fazla teslimat gerektirecektir."
 MILITARY_INDUSTRIAL_ORG_HINT_SCREEN:0 "İpucu: Askeri Sanayi Kuruluşları"
 MILITARY_INDUSTRIAL_ORG_HINT_SCREEN_TEXT:0 "Teçhizat ürettiğinizde, araştırdığınızda veya tasarladığınızda bir $INDUSTRIAL_ORG_TOOLTIP_HEADER$ atayabilirsiniz. Bu kuruluşlar, araştırdıkları veya tasarladıkları teçhizata iyileştirmeler sağlar. Üretim hatlarında üretim hızı, verimlilik ve kaynak ihtiyaçları konusunda yardımcı olurlar. \n\nBir $INDUSTRIAL_ORG_TOOLTIP_HEADER$'ın tamamladığı her görev için, özelliklerin kilidini açmak için kullanılabilecek fonlar kazanır. Bu özellikler, $INDUSTRIAL_ORG_TOOLTIP_HEADER$'ın teçhizatını veya üretim bonuslarını iyileştirir. \n\nBir $INDUSTRIAL_ORG_TOOLTIP_HEADER$'ın atandığı her araştırmanın günlük bir £pol_power §YSiyasi Güç§! maliyeti olacaktır."
