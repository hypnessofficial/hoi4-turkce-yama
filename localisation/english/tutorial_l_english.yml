 TUT_UNPAUSED:0 "Oyun duraklatılmadı"
 tut_10_text_1:0 "Güzel! Etiyopya'ya saldırıya başlamadan önce, henüz yapmadıysanız Ordunuza bir Komutan atamalısınız. Ekranın sol üst köşesindeki §Yboş lider portresine§! tıklayın ve listeden bir Komutan seçin.\n\nBirliklerinize istilaya başlama emri vermek için ekranın altındaki §YPlanı Uygula§! düğmesine tıklayın."
 tut_10_text_2:0 "Planı Uygula düğmesi"
 tut_11_text_1:0 "Kuvvetleriniz şimdi Etiyopya'nın başkenti Addis Ababa'ya yönelik saldırıya başlayacak. Düşmanlarınızın topraklarının yeterli bir kısmını işgal ettiğinizde teslim olacaklar.\n\n£SPACE  tuşuna basarak oyunu §YDurdurmadan§! devam ettirin. £KP_PLUS  veya £KP_MINUS  tuşlarına basarak oyun hızını ayarlayabilirsiniz. Oyuncuların her zaman aynı hızda oynamak yerine ihtiyaçlarına göre oyun hızını sık sık ayarlaması normaldir.\n\nİpucu: Birimlerinizi daha iyi kontrol edebileceğinizi düşünüyorsanız, bir tümen seçin ve birimleri Savaş Planlarından aldıkları emirleri manuel olarak geçersiz kılmak için vilayetlere §Gsağ tıklayın§!."
 tut_12_text_1:0 "Etiyopya teslim oldu! Kazandınız!\nArtık §YBarış Konferansı§! sırasında taleplerde bulunabilirsiniz. §YTüm Eyaletleri Al§! seçeneğini seçmenizi öneririz.\n\nYaptığınız her talep £world_tension_icon  §YDünya Gerginliğini§! belirli bir miktar artıracaktır. §YDünya Gerginliği§! ne kadar yüksek olursa, bir Dünya Savaşı'na o kadar yakın olursunuz.\n\nBazı ülkelerin Dünya Gerginliği yeterince yüksek olana kadar belirli §YDiplomatik Eylemleri§! kilitlidir. Aşağıdaki ipucunda daha fazlasını okuyun."
 tut_13_text_1:0 "Muzaffersiniz! Savaş bitti ve Etiyopya yenildi.\n\nBarış zamanında, birlikleri farklı yerlere yeniden konuşlandırmak veya belki de savaşa hazırlanmak için okyanus ötesine §Ybirlik nakletmek§! isteyebilirsiniz. \n\nArtık Etiyopya yenildiğine göre orada o kadar çok Tümene ihtiyacınız yok.\n\nEn az §Y4 Tümen§! seçin ve onları vilayete §Gsağ tıklayarak§! §Yvurgulanan limana§! taşıyın."
 tut_14_text_1:0 "Birlikleri iki dost bölge arasında transfer etmek için birliklerinizin önce bir limanda durması gerekir.\n\n§YLimanda duran§! birimleri seçin ve §Yİtalya'daki başka bir limana§! §Gsağ tıklayın§!."
 tut_1_1_text_1:0 "§LDestek Silahları I§! araştırılıyor"
 tut_1_2_text_2:0 "§LElektronik Mekanik Mühendisliği§! araştırılıyor"
 tut_1_2_text_3:0 "§LTemel Makine Aletleri§! araştırılıyor"
 tut_1_2_text_4:0 "§Lİnşaat I§! araştırılıyor"
 tut_1_left_mouse:0 "Birimleri seç\nVilayetleri seç"
 tut_1_pan:0 "Kamerayı kaydırmak \niçin basılı tutun"
 tut_1_right_mouse:0 "Birimleri hareket ettir"
 tut_1_text_1:0 "§YHearts of Iron IV§! eğitimine hoş geldiniz!\n\nSavaşa giden dönemde İtalya'nın @ITA başına geçeceksiniz. Araç ipuçlarını okumak, oynarken bazı şeyleri anlamanıza yardımcı olacaktır, bu yüzden onları iyi kullanmanız önerilir."
 tut_1_text_alert:0 "Ekranın üst kısmındaki §Yuyarılarla ilgilenerek§! başlayın."
 tut_1_zoom:0 "Yakınlaştır\nUzaklaştır"
 tut_2_text_1:0 "Güzel! Artık uyarılar halledildiğine göre, savaş yürütmenin ayrıntılarına dalmaya başlayabilirsiniz. İtalya, Etiyopya ile savaşta başlıyor ve nasıl yapılacağını öğrendikten sonra bu savaşı kazanmakta pek zorluk çekmemelisiniz.\n\nKameranızı güneydoğu yönünde Afrika'daki Eritre'yi bulana kadar hareket ettirin. Kamera konumunuz değiştikten sonra, §Gsol tıklamayı§! basılı tutarak ve sürükleyerek $STATE|Y$ eyaletindeki §YTümenleri seçin§!."
 tut_3_text_1:0 "Harika! Şimdi bir saldırı planlamaya nasıl başlayacağınızı öğreneceksiniz.\n\nTümenler §YOrdularda§! birleşebilir. Bir Ordu, Savaş Planları çizmek için kullanılır ve onlara liderlik etmesi için bir §YKomutan§! atanabilir."
 tut_3_text_2:0 "Tümenler seçiliyken, ekranın altındaki §YYeni Ordu§! düğmesine tıklayın. Güneydeki tümenler için, §YSomaliland§!'da aynı işlemi yapın."
 tut_4_text_1:0 "Güzel! Bir Ordu oluşturmak ilk adımdı.\n\nBir §YOrduya§! §YSavaş Planları§! çizilerek emirler verilebilir. \n\n§YCephe Hattı§! düğmesine tıklayın ve ardından Etiyopya sınırına tıklayın. Cephe hatlarının nasıl çizileceği hakkında daha fazla bilgi edinmek için §YCephe Hattı§! düğmesinin üzerine gelin. Bir cephe hattını kaldırmak isterseniz §YSiparişi Sil§! seçeneğine tıklayın."
 tut_5_text_1:0 "Güzel! Etiyopya'ya doğru bir §YCephe Hattı§! artık mevcut. Birliklerinizin §YSavaş Planları§! ile saldırmasını sağlamak için önce bir §YSaldırı Emri§! de çizmelisiniz.\n\n§YSaldırı hattı§! düğmesine tıklayın ve ardından §Gsağ tıklamayı§! basılı tutun ve vurgulanan iki vilayet arasında sürükleyin. Güneydeki tümenler için, §YSomaliland§!'da aynı işlemi yapın."
 tut_6_text_1:0 "Şimdi Etiyopya başkentine saldırmak için bir Saldırı Emri oluşturdunuz. Planı uygulama emrini vermeden önce doğru hazırlıkları yapmak akıllıca olabilir.\n\nBirimlerinizin $DAYS_OF_PLANNING|0Y$ gün boyunca hazırlanmasına izin verirseniz, §G+$PLANNING_MAX|0%$§!'e kadar bir savaş bonusu alırlar. Bazı £tech_mod  §YKara Doktrinleri§! ne kadar süre §YHazırlanabileceğinizi§! değiştirebilirken, diğerleri maksimum Hazırlık seviyenize ne kadar hızlı ulaşabileceğinizi değiştirebilir.\n\nHava Kuvvetlerinizi de hazırlamanız tavsiye edilir. §YEritre§!'deki §YHava Üssü§!'ne tıklayın."
 tut_7_text_1:0 "Güzel! Birliklerinizin savaşta daha yüksek bir başarı garantisine sahip olması için, onlara ihtiyaç duyabilecekleri uygun §YHava Desteğini§! vermek de önemlidir.\n\nBir §YHava Sahasına§! atanan §YHava Filoları§! görevlere gönderilebilir. §YDestek§! Hava Filoları, kara muharebelerine katılmalarını sağlayacak olan §YYakın Hava Desteği§! görevine gönderilebilir.\n\n§YEritre Hava Üssü§!'nde bulunan §YHava Filolarını§! §YDanakil§!'e §Gsağ tıklayarak§! atayın ve atandıklarında onlara emirler verin."
 tut_8_text_1:0 "Güzel! Artık Doğu Afrika §YHava Sahasına§! atanmış §YHava Filolarınız§! var. Ancak bir şey yapmaya başlamadan önce, Hava Filolarınıza §Ygörevler§! vermelisiniz. Bir Hava Filosunun aktif bir görevi yoksa Hava Üssü'nde kalacaktır.\n\nBir dizi farklı §YHava Görevi§! vardır ve bir Hava Filosunun gönderilebileceği Hava Görevleri, Hava Filosunun tipine bağlıdır. §YDestek Hava Filoları§!, kara muharebelerine katılmalarını ve düşmanlarınıza saldırmalarını sağlayan §YYakın Hava Desteği§! görevine gönderilebilir.\n\nBir Hava Filosunu bir göreve göndermek için Hava Arayüzündeki görev simgesine tıklayın."
 tut_9_text_1:0 "Güzel! Neredeyse her şey ayarlandıktan sonra, §YSavaş Planını§! uygulamaya ve İtalya için Etiyopya'yı fethetmeye bakma zamanı geldi.\n\nSağ alttaki §YVarsayılan Harita Modu§! £GFX_F1   düğmesine tıklayın ve ardından ekranın altındaki portreye tıklayarak Ordunuzu seçin."
 tut_construction_obj_1:0 "20 §LSivil Fabrika§! kullanımda"
 tut_last_text_1:0 "Eğitimin rehberli bölümünü şimdi tamamladınız!\n\nİsterseniz İtalya olarak oynamaya devam edebilirsiniz. Zorluk çekerseniz SSS'yi veya İtalya oynanışını okuyun.\n\nSağ üstteki yardım düğmesi, istediğiniz zaman SSS'ye erişmenizi sağlayacaktır."
