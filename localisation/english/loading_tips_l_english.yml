l_english:
 LOADING_TIP_0:0 "Başkaları tarih yazarken elimiz kolumuz bağlı oturmak aşağılayıcıdır. Kimin kazandığı pek de önemli değildir.\n- Benito Mussolini"
 LOADING_TIP_1:0 "Bir halkı büyük kılmak için onu savaşa göndermek gerekir; gerekirse kıçına tekmeyi basarak. Ben de bunu yapacağım.\n- Benito Mussolini"
 LOADING_TIP_10:0 "Papa mı? Kaç tümeni var?\n- Joseph Stalin"
 LOADING_TIP_100:0 "İtalyan-Yunan Savaşı'ndan beri ‘Yunanlar kahramanlar gibi savaşıyor’ değil, ‘Kahramanlar Yunanlar gibi savaşıyor’ denir.\n- The Montreal Daily Star, 1942"
 LOADING_TIP_101:0 "Yurtseverlik, kendi halkına duyduğun sevginin önce gelmesidir. Milliyetçilik ise başka halklara duyduğun nefretin önce gelmesidir.\n- Charles de Gaulle"
 LOADING_TIP_102:0 "Galibi olmayan bir barış olmalı. Zafer, yenilene zorla kabul ettirilen bir barış; galibin şartlarının mağluba dayatılması demektir. Böyle bir barış aşağılanma içinde kabul edilir ve ardında kin bırakır.\n- Woodrow Wilson, 1917"
 LOADING_TIP_103:0 "Tam bir güvenlik istiyorsanız hapse girin. Orada karnınız doyurulur, giydirilir, tedavi edilirsiniz. Tek eksiğiniz özgürlüktür.\n- Dwight D. Eisenhower"
 LOADING_TIP_104:0 "Ordu bir takımdır. Takım olarak yaşar, yer, uyur ve savaşır. Bu bireysel kahramanlık lafları zırvalıktır.\n- George S. Patton"
 LOADING_TIP_105:0 "İnsanlara bir işi nasıl yapacaklarını asla söylemeyin. Ne yapacaklarını söyleyin; yaratıcılıklarıyla sizi şaşırtsınlar.\n- George S. Patton"
 LOADING_TIP_106:0 "Herkes korkar. İnsan ne kadar zekiyse o kadar çok korkar.\n- George S. Patton"
 LOADING_TIP_107:0 "İnsancıllık, özgür bir halkın direncini hiçbir zaman zayıflatmamış, metanetini azaltmamıştır. Bir ulus güçlü olmak için zalim olmak zorunda değildir.\n- Franklin D. Roosevelt"
 LOADING_TIP_108:0 "Samimi bir diplomat, kuru su ya da tahta demir gibidir.\n- Joseph Stalin"
 LOADING_TIP_109:0 "Tarih boyunca kötülüğün kazanmasını mümkün kılan, harekete geçebilecekken geçmeyenlerin eylemsizliği ve olup biteni anlaması gerekirken kayıtsız kalanların umursamazlığı olmuştur.\n- Haile Selassie I"
 LOADING_TIP_11:0 "Neşe, Sovyetler Birliği'nin en belirgin özelliğidir.\n- Joseph Stalin"
 LOADING_TIP_110:0 "Varşova boş övgüler, takdir sözleri ya da dayanışma vaatleri beklemiyor. Varşova silah ve cephane bekliyor.\n- Józef Piłsudski"
 LOADING_TIP_111:0 "Cehalet ve gericilik, zorbalığa hizmet eden köle sürülerinden başka bir şey yaratmamıştır.\n- Emiliano Zapata"
 LOADING_TIP_112:0 "Diz çökerek yaşamaktansa ayakta ölmeyi yeğlerim.\n- Emiliano Zapata"
 LOADING_TIP_113:0 "Beyler, aslanlar gibi savaştınız ama sizi eşekler yönetti.\n- Erwin Rommel, Tobruk kuşatması sırasında yakalanan İngiliz subaylarına"
 LOADING_TIP_114:0 "Özgür seçimlerin sorunu, nasıl sonuçlanacaklarını önceden bilememenizdir.\n- Vyacheslav Molotov"
 LOADING_TIP_115:0 "Bir ölünün umurunda mı kimin haklı, kimin haksız olduğu?\n- Manuel Azaña"
 LOADING_TIP_116:0 "Göreviniz kolay olmayacak. Düşmanınız iyi eğitimli, iyi donanımlı ve savaş tecrübesine sahip. Acımasızca savaşacak.\n- Dwight D. Eisenhower, Haziran 1944"
 LOADING_TIP_117:0 "Bir savaşı sona erdirmenin en hızlı yolu, onu kaybetmektir.\n- George Orwell"
 LOADING_TIP_118:0 "Artık ne seçim hilesi istiyoruz ne de yalan. Çalışmayanların, çalışanların sırtından geçinmesini istemiyoruz.\n- Juan Perón"
 LOADING_TIP_119:0 "İşte o lanet Scheer! Ateş açın!\n- Frederick Secker Bell"
 LOADING_TIP_12:0 "Gerçek güç yalnızca bir tüfeğin namlusundan çıkar.\n- Joseph Stalin"
 LOADING_TIP_120:0 "Karşı koymaya hazırlandığımız tehlikeden duyduğumuz korkuya yenilmemeliyiz. Korkmamız gereken tek şey, korkunun kendisidir.\n- Franklin D. Roosevelt"
 LOADING_TIP_121:0 "Özgürlüğümüz savaştan sağ çıkabildiğini gösterdi; ama teslimiyetten asla sağ çıkamaz.\n- Franklin D. Roosevelt"
 LOADING_TIP_122:0 "Buraya bir çıkarma yapmayı ancak aklını yitirmiş biri düşünebilir. Buraya kimse ayak basamayacak; tek bir asker bile.\n- Benito Mussolini, Sicilya, 1937"
 LOADING_TIP_123:0 "Nazizm ve faşizm biçimindeki diktatörlüklere karşı savaşmak için silaha sarıldım. Yeni bir diktatörlüğe karşı savaşırken ölmem gerekiyorsa öleceğim.\n- Draža Mihailović"
 LOADING_TIP_124:0 "Üçüncü Dünya Savaşı'nda hangi silahların kullanılacağını bilmiyorum ama Dördüncü Dünya Savaşı taş ve sopalarla yapılacak.\n- Albert Einstein"
 LOADING_TIP_125:0 "İki alfabesi, üç dili, dört dini, beş milliyeti, altı cumhuriyeti bulunan; yedi komşuyla çevrili ve sekiz etnik azınlığın yaşadığı tek bir ülkenin lideriyim.\n- Josip Broz Tito"
 LOADING_TIP_126:0 "O caniye son verecek cesareti bir avuç adam bile gösteremeseydi gelecek kuşaklar Alman halkını nasıl yargılardı?\n- Henning von Tresckow"
 LOADING_TIP_127:0 "Şimdi bütün dünya bizi lanetleyecek ama doğru olanı yaptığımıza hâlâ bütün kalbimle inanıyorum. Hitler yalnızca Almanya'nın değil, bütün dünyanın baş düşmanıdır.\n- Henning von Tresckow"
 LOADING_TIP_128:0 "Düşman, yıkıcı gücü hesaplanamayacak kadar büyük, yeni ve son derece acımasız bir bomba kullanmaya başladı. Bu bomba pek çok masumun canını alıyor.\n- İmparator Hirohito, 1945"
 LOADING_TIP_129:0 "Savaş kitabının ilk sayfasındaki ilk kural şudur: ‘Moskova'ya yürüme.’ Bunu deneyenler oldu; iyi bir fikir değil.\n- Bernard L. Montgomery"
 LOADING_TIP_13:0 "Savaşma amacı taşımayan her ittifak anlamsız ve yararsızdır.\n- Adolf Hitler"
 LOADING_TIP_130:0 "Almanya'nın yarın ya da öbür gün Avusturya'ya saldıracağına ilişkin yalanlar yine yayılıyor.\n- Adolf Hitler, 1936"
 LOADING_TIP_131:0 "Alman askeri dünyayı hayrete düşürdü; İtalyan Bersagliere ise Alman askerini.\n- Erwin Rommel"
 LOADING_TIP_132:0 "Avrupa'daki son toprak talebim budur.\n- Adolf Hitler, 1938'de Sudetenland hakkında"
 LOADING_TIP_133:0 "Uzun sürecek bir mevzi savaşına dayanacak durumda değiliz. Müttefikler kuvvetlerini nerede yoğunlaştırırsa oradan cepheyi yaracaktır.\n- Gerd von Rundstedt"
 LOADING_TIP_134:0 "Amerika Birleşik Devletleri ile savaşa girersek Hawaii sularındaki Amerikan filosunu yok etmeden kazanma şansımız olmaz.\n- Isoroku Yamamoto, 1941"
 LOADING_TIP_135:0 "Düşmanlarınız mı var? Güzel. Demek ki hayatınızın bir döneminde bir şeyleri savunacak cesareti göstermişsiniz.\n- Winston Churchill"
 LOADING_TIP_136:0 "Bu bir barış değil, yirmi yıllık bir ateşkes.\n- Ferdinand Foch, 1919"
 LOADING_TIP_137:0 "Barış için bile olsa ödenen bedel fazla yüksek olabilir.\n- Michael Joseph Savage, Chamberlain'in yatıştırma politikası üzerine"
 LOADING_TIP_138:0 "Kabadayılar gibi, onların da anladığı tek dil güçtür.\n- Franklin D. Roosevelt, Adolf Hitler ve Benito Mussolini hakkında"
 LOADING_TIP_139:0 "Demokrasinin, şimdiye kadar denenmiş diğer bütün yönetim biçimleri bir yana bırakılırsa en kötü yönetim biçimi olduğu söylenir.\n- Winston Churchill"
 LOADING_TIP_14:0 "Büyük yalancılar aynı zamanda büyük sihirbazlardır.\n- Adolf Hitler"
 LOADING_TIP_140:0 "Dünyayı yok edecek olanlar kötülük yapanlar değil, hiçbir şey yapmadan onları izleyenlerdir.\n- Albert Einstein"
 LOADING_TIP_141:0 "Bu önerinin insanlık için taşıdığı korkunç tehlike, sağlayabileceği her türlü askerî üstünlükten çok daha ağır basıyor.\n- Robert Oppenheimer, termonükleer silahlar üzerine, 1949"
 LOADING_TIP_142:0 "Dünyanın artık aynı olmayacağını biliyorduk. Birkaç kişi güldü, birkaç kişi ağladı. Çoğunluk sessizdi.\n- Robert Oppenheimer, Trinity testinden sonra"
 LOADING_TIP_143:0 "Şimdi ben Ölüm oldum, dünyaları yok eden.\n- Robert Oppenheimer, Trinity testinden sonra"
 LOADING_TIP_144:0 "Herkes ilk muharebesinde korkar. Korkmadığını söyleyen yalan söylüyordur.\n- George S. Patton"
 LOADING_TIP_145:0 "Gerçek kahraman, korkmasına rağmen savaşan kişidir.\n- George S. Patton"
 LOADING_TIP_146:0 "Riskleri hesaplayarak alın. Bu, düşüncesizce atılmaktan çok farklıdır.\n- George S. Patton"
 LOADING_TIP_147:0 "Sicilya'da özenle işaretlenmiş dört yüz mezar var; hepsi bir adam görev başında uyuyakaldığı için. Ama bunlar Alman mezarları; çünkü o piçi, kendi subayından önce biz uykuda yakaladık.\n- George S. Patton"
 LOADING_TIP_148:0 "Savaşı gördüm. Yaralılardan akan kanı gördüm. Çamur içindeki ölüleri gördüm. Yıkılan şehirleri gördüm. Savaştan nefret ediyorum.\n- Franklin D. Roosevelt"
 LOADING_TIP_149:0 "Yaşasın Kral Mesih! Yaşasın Avusturya!\n- Heinrich Maier'in son sözleri, 1945"
 LOADING_TIP_15:0 "Bugün burada bir devrimci olarak duruyorsam, Devrim'e karşı bir devrimci olarak duruyorum.\n- Adolf Hitler"
 LOADING_TIP_150:0 "Avusturya'da Nazi faşizmini kesinlikle reddediyorum... Avusturya'nın değerlerine yabancı bu hareket, herkese her şeyi vaat ediyor; gerçekte ise Avusturya halkını acımasızca boyunduruk altına almayı amaçlıyor!\n- Otto von Habsburg"
 LOADING_TIP_151:0 "Avusturya hükûmetine Nazi temsilcilerini kabul etmek hiçbir koşulda söz konusu değildir.\n- Kurt Schuschnigg, 1938"
 LOADING_TIP_152:0 "Kralın otoritesi de Tanrı'nınki kadar hayalîdir. Bu yüzden ateizm ve cumhuriyetçilik aynı madalyonun iki yüzü olmuştur.\n- Noe Zhordania"
 LOADING_TIP_153:0 "Hiçbir şeyin yaşanmadığı on yıllar vardır; bir de on yılların yaşandığı haftalar.\n- Vladimir Lenin"
 LOADING_TIP_154:0 "O bayrağın Suribachi'ye dikilmesi, Deniz Piyadelerinin beş yüz yıl daha var olacağı anlamına geliyor.\n- Donanma Bakanı James Forrestal, Iwo Jima, 1945"
 LOADING_TIP_155:0 "Öyleyse görevlerimize dört elle sarılalım ve öyle davranalım ki Britanya İmparatorluğu ile Milletler Topluluğu bin yıl daha yaşasa bile insanlar, ‘En şanlı anları buydu’ desin.\n- Winston Churchill"
 LOADING_TIP_156:0 "Hayatımın en kederli anını yaşıyorum. Çünkü benim için ölümden de beter olan, son derece acı bir görevi yerine getiriyorum.\n- Jan Syrový, 1938 Münih Anlaşması'nı kabul ettikten sonra."
 LOADING_TIP_157:0 "Cumhuriyet benim çocuğum. Boğulmak üzere. Onu suyun üstünde tutmaya çalışıyorum ama nehir bizi sürüklüyor. İngiltere'den ve Amerika'dan yardım istiyorum. Onlarsa kıyıda durmuş benimle alay ediyor.\n- Sun Yat-sen"
 LOADING_TIP_158:0 "V, Fransızca ‘zafer’ anlamındaki Victoire ve Flamanca ‘özgürlük’ anlamındaki Vrijheid sözcüklerinin ilk harfidir... İyi dostlarımız İngilizlerin zaferi. Onların dilinde de zafer sözcüğü V ile başlar.\n- Victor de Laveleye, V for Victory kampanyası"
 LOADING_TIP_159:0 "Filipinler halkı: Geri döndüm.\n- Douglas MacArthur"
 LOADING_TIP_16:0 "Yeterince büyük bir yalanı yeterince sık tekrarlarsanız insanlar ona inanır.\n- Adolf Hitler"
 LOADING_TIP_160:0 "Özgürlük mücadelesi ne tek bir kişinin ne de tek bir ulusun mücadelesidir. Bir efendinin zincirlerini taşımayı reddeden herkesin ortak mücadelesidir.\n- Sergio Osmeña"
 LOADING_TIP_161:0 "Sahil gözcüleri Guadalcanal'ı kurtardı; Guadalcanal da Güney Pasifik'i.\n- William Halsey"
 LOADING_TIP_162:0 "Cehennemi fethetmem gerekseydi onu almak için Avustralyalıları, elde tutmak için Yeni Zelandalıları kullanırdım.\n- Erwin Rommel"
 LOADING_TIP_17:0 "Almanya ya bir dünya gücü olacak ya da yok olup gidecektir.\n- Adolf Hitler"
 LOADING_TIP_18:0 "Başarı, hevesini yitirmeden bir başarısızlıktan diğerine ilerleyebilmektir.\n- Winston Churchill"
 LOADING_TIP_19:0 "Cehennemden geçiyorsanız durmayın, yolunuza devam edin.\n- Winston Churchill"
 LOADING_TIP_2:0 "Her asker, muharebeye girmeden önce kendi küçük mücadelesinin genel harekât içindeki yerini bilmelidir.\n- Bernard L. Montgomery"
 LOADING_TIP_20:0 "Demokrasiye karşı en güçlü sav, sıradan bir seçmenle yapılacak beş dakikalık bir sohbettir.\n- Winston Churchill"
 LOADING_TIP_21:0 "Gelecekteki savaşlarda muharebe nerede yaşanırsa yaşansın, belirleyici rolü zırhlı birlikler oynayacaktır.\n- Heinz Guderian"
 LOADING_TIP_22:0 "Yeni Alman Panther ve Tiger tankları, onarılmaya çalışılmadan, bozuluncaya kadar kullanılabilir. Motorları, şanzımanları ve süspansiyonları kötüdür.\n- Kızıl Ordu Silahlanma Dairesi"
 LOADING_TIP_23:0 "Hiçbir piç, ülkesi uğruna ölerek savaş kazanmadı. Savaş, karşıdaki zavallı aptal piçi kendi ülkesi uğruna öldürerek kazanılır.\n- George S. Patton"
 LOADING_TIP_24:0 "Bugün kararlılıkla uygulanan iyi bir plan, gelecek hafta uygulanacak kusursuz bir plandan daha iyidir.\n- George S. Patton"
 LOADING_TIP_25:0 "Ya bana yol gösterin ya beni izleyin ya da yolumdan çekilin.\n- George S. Patton"
 LOADING_TIP_26:0 "Kimse savunmada kalarak başarıya ulaşmamıştır. Yalnızca saldırı vardır; saldırı ve yine saldırı.\n- George S. Patton"
 LOADING_TIP_27:0 "Savaşlar silahlarla yapılır ama insanlarla kazanılır. Zaferi getiren, komutanın ve onu izleyen askerlerin mücadele ruhudur.\n- George S. Patton"
 LOADING_TIP_28:0 "Hayatımda gördüğüm ilk jet uçağını düşürdüm.\n- Chuck Yeager, USAAF"
 LOADING_TIP_29:0 "Theo, ben Heinrich. Az önce iki bombardıman uçağı düşürdüm. Cephanem bitti. Çarpmaya gidiyorum. Hoşça kal, Valhalla'da görüşürüz!\n- Heinrich Ehrler, Luftwaffe"
 LOADING_TIP_3:0 "Havadaki savaşı kaybedersek, savaşı da kaybederiz; hem de çok kısa sürede.\n- Bernard L. Montgomery"
 LOADING_TIP_30:0 "Liderlik, doğru insanları seçmek ve ellerinden gelenin en iyisini yapmalarına yardımcı olmaktır.\n- Chester W. Nimitz"
 LOADING_TIP_31:0 "Önerilen harekâtın başarı şansı var mı? Mevcut malzeme ve ikmal olanaklarıyla uygulanabilir mi?\n- Chester W. Nimitz"
 LOADING_TIP_32:0 "Muharebeye hazırlanırken şunu hep gördüm: Planlar işe yaramaz ama planlama vazgeçilmezdir.\n- Dwight D. Eisenhower"
 LOADING_TIP_33:0 "Önemli olan dövüşen köpeğin iriliği değil, içindeki mücadele azmidir.\n- Dwight D. Eisenhower"
 LOADING_TIP_34:0 "Bir halkın varlığı tehdit altına girdiğinde halklar arasında çatışmaların, uluslar arasında da talihsiz savaşların çıkması kaçınılmazdır.\n- Hideki Tojo"
 LOADING_TIP_35:0 "Bire bir çatışmada kazanan, şarjöründe bir mermi daha olan kişidir.\n- Erwin Rommel"
 LOADING_TIP_36:0 "Örs olmaktansa çekiç olmayı yeğlerim.\n- Erwin Rommel"
 LOADING_TIP_37:0 "Ter dökmek kanı, kan dökmek hayatı kurtarır; akıl ise her ikisini de kurtarır.\n- Erwin Rommel"
 LOADING_TIP_38:0 "Zavallı Neville Chamberlain, Hitler'e güvenebileceğini sandı. Yanılıyordu. Ama Stalin konusunda yanıldığımı sanmıyorum.\n- Winston Churchill, Yalta Konferansı sonrası"
 LOADING_TIP_39:0 "Bunun, çağımıza barış getireceğine inanıyorum.\n- Neville Chamberlain, 1938 Münih Antlaşması sonrası"
 LOADING_TIP_4:0 "Başkalarına güvenmek iyidir; güvenmemek ise çok daha iyidir.\n- Benito Mussolini"
 LOADING_TIP_40:0 "Hiçbir düşman bombardıman uçağı Ruhr'a ulaşamaz. Biri bile ulaşırsa adım Göring değildir. Bana Meyer diyebilirsiniz.\n- Hermann Meyer"
 LOADING_TIP_41:0 "Kapıyı tekmeleyip açmamız yeterli; bu çürümüş yapının tamamı büyük bir gürültüyle çökecektir.\n- Adolf Hitler (Sovyetler Birliği hakkında)"
 LOADING_TIP_42:0 "Amerika Birleşik Devletleri ve Birleşik Krallık ile girişilecek bir savaşın ilk altı ila on iki ayında istediğim gibi at koşturabilirim. Ondan sonrası için başarı umudum yok.\n- Isoroku Yamamoto"
 LOADING_TIP_43:0 "Önümüze bir mayın tarlası çıkarsa piyademiz, orada mayın yokmuş gibi saldırır.\n- Georgy Zhukov"
 LOADING_TIP_44:0 "Rus devini küçümsemişiz... Ne zaman bir düzine tümeni yok etsek Ruslar yerlerine bir düzine daha koyuyor.\n- Franz Halder"
 LOADING_TIP_45:0 "Hadi oradan!\n- Anthony C. McAuliffe, Alman teslimiyet talebine yanıt olarak"
 LOADING_TIP_46:0 "Bugün sıra bizde. Yarın sizde olacak.\n- Haile Selassie I, 1936"
 LOADING_TIP_47:0 "Bir adım bile geri atılmayacak!\n- Sovyet Emri No. 227"
 LOADING_TIP_48:0 "Tora! Tora! Tora!\n- Mitsuo Fuchida, 7 Aralık 1941"
 LOADING_TIP_49:0 "Adın bilinmez, yaptığın ölümsüzdür.\n- Meçhul Asker Anıtı (Moskova)"
 LOADING_TIP_5:0 "Felsefi ve doktrinsel açıdan bakıldığında, kalıcı barışa inanmıyorum.\n- Benito Mussolini"
 LOADING_TIP_50:0 "Otuz Dördüncü Görev Kuvveti nerede? Tekrar ediyorum, nerede? Bütün dünya merak ediyor.\n- CINCPAC, Leyte Körfezi Muharebesi"
 LOADING_TIP_51:0 "Savaşın gidişatı Japonya'nın lehine olmamıştır.\n- İmparator Hirohito, 1945"
 LOADING_TIP_52:0 "İlk savaştan sonra dersimizi almış olmalıydık.\n- Gerd von Rundstedt"
 LOADING_TIP_53:0 "Rusya'nın uçsuz bucaksızlığı bizi yutuyor.\n- Gerd von Rundstedt"
 LOADING_TIP_54:0 "Size soruyorum: Topyekûn savaş istiyor musunuz? Gerekirse, bugün hayal edebildiğimizden bile daha kapsamlı ve köktenci bir savaş istiyor musunuz?\n- Joseph Goebbels"
 LOADING_TIP_55:0 "Alman ordusunun bir darbesiyle Sovyet ordusunun bir darbesi, Versay'ın bu çirkin ürününe son verdi.\n- Vyacheslav Molotov (Polonya'nın düşüşünden sonra)"
 LOADING_TIP_56:0 "Bir uçak gemisi eksildi! Dixon'dan uçak gemisine: Bir uçak gemisi eksildi!\n- Robert E. Dixon, Mercan Denizi Muharebesi"
 LOADING_TIP_57:0 "Korkunç değil mi? Biz, Alman Genelkurmayından iki subay, başkomutanımızı öldürmenin en iyi yolunu tartışıyoruz.\n- Henning von Tresckow"
 LOADING_TIP_58:0 "Hitler, kendinden geçmiş bir derviş gibi. Vurulmalı.\n- Henning von Tresckow"
 LOADING_TIP_59:0 "Naziler bu savaşa, herkesi bombalayabilecekleri ama kimsenin onları bombalayamayacağı gibi çocukça bir yanılgıyla girdiler.\n- Arthur 'Bomber' Harris"
 LOADING_TIP_6:0 "Zürafalar kalpsiz yaratıklardır."
 LOADING_TIP_60:0 "Hitler cehennemi işgal etseydi Avam Kamarasında şeytan hakkında en azından birkaç iyi söz söylerdim.\n- Winston Churchill, 21 Haziran 1941"
 LOADING_TIP_61:0 "Demek o piç öldü? Onu sağ yakalayamamış olmamız ne yazık!\n- Joseph Stalin (Hitler'in intiharını duyduğunda)"
 LOADING_TIP_62:0 "Yenilgiye uğradık. Bozguna uğradık, muharebeyi kaybettik.\n- Paul Reynaud, 15 Mayıs 1940"
