 POL_destroyer_1:0 "Wicher Sınıfı"
 POL_destroyer_1_desc:0 "İki Wicher sınıfı muhrip, Polonya Donanması'nın ilk büyük yüzey gemileriydi ve 1930 ile 1932 arasında hizmete girdi. 1.540 ton deplasmana sahip büyük gemilerdi. Tasarlandığı gibi, dört adet 130mm/40 M1924 topuyla silahlandırılmışlardı, ancak bunlar Alman işgalinden hemen önce 120mm İsveç toplarına yükseltildi. Torpido tüpleri ve uçaksavar silahları da geliştirildi."
 POL_destroyer_2:0 "Grom Sınıfı"
 POL_destroyer_2_desc:0 "Grom sınıfının iki muhribi, Polonya Donanması için Britanya'da inşa edildi ve 1937'de hizmete girdi. İkinci Dünya Savaşı'nın en büyük ve en hızlı muhriplerindendiler. Yaklaşık 2.000 ton deplasmana sahiptiler ve ana silahları olarak beş adet 120mm/50 kalibre Bofors M34 topuyla silahlandırılmışlardı. Ayrıca altı adet 533mm torpido tüpüne ve iyi bir DSH (Denizaltı Savunma Harbi) donanımına sahiptiler."
 POL_destroyer_3:0 "Piorun Sınıfı"
 POL_destroyer_3_desc:0 "Polonyalı muhrip Piorun, 1940'ta sürgündeki Polonya Donanması için inşa edilen ve hizmete giren bir İngiliz N sınıfı muhripti. 1.770 ton deplasmana sahipti ve iyi bir hıza ve güvenilirliğe sahipti. Ana silahları olarak altı adet 120mm/45 QF Mk XII topuyla silahlandırılmıştı ve ayrıca beş adet 533mm torpido tüpü, iyi bir DSH ekipmanı ve o zamanın en son İngiliz radar ve sonarına sahipti."
