 POL_submarine_1:0 "Wilk Sınıfı"
 POL_submarine_1_desc:0 "Wilk sınıfı, Polonya Donanması için Fransızlar tarafından inşa edilen ve 1930'ların başında hizmete giren üç denizaltıdan oluşuyordu. Fransız Saphir sınıfı tasarımına dayanıyorlardı. Yaklaşık 1.000 ton deplasmana sahip oldukça büyük denizaltılardı. Altı adet 550mm torpido tüpü ile silahlandırılmışlardı ve 80 metreye kadar dalabiliyorlardı."
 POL_submarine_2:0 "Orzeł Sınıfı"
 POL_submarine_2_desc:0 "Orzeł sınıfı, Polonya Donanması için Hollanda'da inşa edilen iki denizaltıdan oluşuyordu. Gemiler, Alman işgalinden sadece aylar önce tamamlandı. 1.100 ton deplasmana sahip büyük denizaltılardı. On iki adet 550mm torpido tüpü ile silahlandırılmışlardı ve 80 metrelik bir dalış derinliğine sahiptiler."
 POL_submarine_3:0 "Sokół Sınıfı"
 POL_submarine_3_desc:0 "Sokół sınıfının iki denizaltısı, 1941-42'de sürgündeki Polonya Donanması için tamamlanan İngiliz U sınıfı denizaltılardı. Gemiler 540 ton deplasmana sahipti ve dört adet 533mm torpido tüpü ile silahlandırılmışlardı. İyi bir İngiliz radar ve sonar donanımına ve 60 metrelik bir dalış derinliğine sahiptiler."
