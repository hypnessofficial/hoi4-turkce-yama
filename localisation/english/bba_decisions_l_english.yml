l_english:
 ETH_2ndItaloEthiopianWar:0 "[ITA.GetName] yasadışı bir şekilde anavatanımızı işgal etti. Milletler Cemiyeti'nin tam üyesi olmamıza rağmen, dünya harekete geçmekte başarısız oldu ve çatışmayı küçük bir sömürge çatışması olarak görüyor. \nBu çatışmanın bir üye devletin diğerine karşı tam ölçekli bir saldırganlık savaşı olduğunu MC'ye kanıtlamalı ve böylece dünyayı [ITA.GetLeader]'a karşı harekete geçmeye zorlamalıyız."
 ETH_BoP_expand_black_lions:0 "Kara Aslan Tümenlerini Artır"
 ETH_BoP_expand_black_lions_tt:0 "Komünistlere güvenilemez, kendi başlarına iktidarı ele geçirmeye teşebbüs etmeleri durumunda uyanık olmalıyız. Bu nedenle, herhangi bir hamle yapmaktan caydırmak için Kara Aslan tümenlerinin sayısını artıracağız."
 ETH_BoP_expand_red_guards:0 "Kızıl Muhafız Tümenlerini Artır"
 ETH_BoP_expand_red_guards_tt:0 "Kara Aslanların yönetimine güvenilemez ve nihayetinde iktidardan uzaklaştırılmalıdırlar. Kara Aslanlar kaçınılmaz olarak başarısız olduğunda durumdan yararlanabilmemiz için komutamız altındaki Kızıl Muhafız birimlerinin sayısını artırmalıyız."
 ETH_BoP_purge_anarchists:0 "Anarşistleri Tasfiye Et"
 ETH_BoP_purge_anarchists_tt:0 "Ordu ile Kara Aslanlar arasındaki huzursuz barış çöküyor. Onların saf anarşist görüşleri [ETH.GetNameDef]'i içeriden çürütüyor ve bizi saldırıya karşı savunmasız bırakıyor. Devrimimizin devamını garanti altına almak için Kara Aslanları kesin olarak yok edeceğiz. \n\n§Y$ETH_prov_mil_admin$§!, §Y[ROOT.GetFlag][ROOT.GetNameDefCap]§!'nin lideri olacak."
 ETH_BoP_purge_communists:0 "Komünistleri Tasfiye Et"
 ETH_BoP_purge_communists_tt:0 "Kara Aslanlar ile komünist askeri subaylar arasındaki huzursuz barış çökmeye başlıyor. Subaylar açıkça gücü merkezileştirmeye ve kendilerine sadık otoriter bir devlet yaratmaya niyetli. İnşa ettiğimiz her şeyi yok etmeden önce onları ortadan kaldırmalıyız."
 ETH_Education_reform_centralized_BoP:0 "Devlet Eğitim Reformları"
 ETH_Education_reform_centralized_BoP_tt:0 "Gelecek neslin iş gücüne katılabilmesini sağlamak elbette önceliğimizdir. Ancak, gelecek nesilleri daha kabul edilebilir bir ahlaki yöne itme fırsatımız var, böylece [ETH.GetLeader]'a sadık kalmalarını sağlıyoruz."
 ETH_Education_reform_decentralized_BoP:0 "Yerelleştirilmiş Eğitim Reformları"
 ETH_Education_reform_decentralized_BoP_tt:0 "Eğitim, modası geçmiş güç yapılarına karşı mücadelemizin ön saflarında yer alıyor. Gençleri, otoriteyi sorgulamalarını ve gelenekçilerin modası geçmiş görüşlerini reddetmelerini sağlayacak şekilde eğitmeliyiz."
 ETH_anti_colonialism_category:0 "Anti-Sömürgecilik"
 ETH_anti_colonialism_category_desc:0 "Emperyalizm belası nihayet ortadan kaldırılana kadar bölgedeki direniş hareketlerini desteklemek için elimizden gelen her şeyi yapacağız."
 ETH_anti_colonialism_decision:0 "[FROM.GetAdjective] Karşıtı Propaganda"
 ETH_anti_colonialism_decision_desc:0 "[FROM.GetAdjective] emperyalizmi Afrika'da sona ermelidir. Dünya uyanmalı ve [FROM.GetAdjective] sömürgeciliğinin günlerinin bittiğini fark etmelidir. [FROM.GetNameDef] halkı, bastırılmış Afrikalı sömürgelerini serbest bırakmaları için liderlerine baskı yapmalıdır."
 ETH_anti_colonialism_map_category_name:0 "Direnişin desteklenebileceği sömürge eyaletleri"
 ETH_arm_resistance_decision:0 "[FROM.GetName]'daki [FROM.OWNER.GetAdjective] karşıtı direnişi silahlandır"
 ETH_arm_resistance_decision_desc:0 "Bu eyaletteki direniş savaşçılarını silahlandır."
 ETH_bop_increase_anarchist_influence:0 "Anarşistlere Desteği Artır"
 ETH_bop_increase_anarchist_influence_desc:0 "Anarşistlerin, merkezi bir hükûmetin halkın haklarını tekrar kısıtlamasını önlemek için yeterli nüfuza sahip olmasını sağlamalıyız. Halk arasında davamız için desteği artırmak üzere bir propaganda kampanyası başlatmalıyız."
 ETH_bop_increase_communist_influence:0 "Komünistlere Desteği Artır"
 ETH_bop_increase_communist_influence_desc:0 "Komünistlerin merkezi hükûmet tarafından alınan kararlar üzerinde etkili olmasını sağlamalıyız. Ulus dağılmadan önce halk arasında davamız için desteği artırmak üzere bir propaganda kampanyası başlatmalıyız."
 ETH_bop_increase_mesafint_privileges:0 "Mesafint Ayrıcalıklarını Artır"
 ETH_bop_increase_mesafint_privileges_desc:0 "Yerel Ras'lar, bölgeleri yönetmeye en uygun olanlardır. [ROOT.capital.GetCapitalVictoryPointName]'daki merkezi otorite, önemsiz ayrıntılarla uğraşmamalıdır. Ancak, çok hızlı hareket etmemeye dikkat etmeliyiz, yoksa güçlerini tamamen serbest kalmak için kullanacaklardır."
 ETH_bop_increase_the_power_of_the_mekwanint:0 "Mekwanint'in Gücünü Artır"
 ETH_bop_increase_the_power_of_the_mekwanint_desc:0 "Atanmış bakanların yerel işler üzerinde daha fazla güce sahip olması gerekiyor. Gücü Mesafint'ten Mekwanint'e kaydırmak için çalışmalı, kontrolü yavaş yavaş merkezi hükûmete ve [ROOT.GetLeader]'a taşımalıyız. Bu elbette Ras'ları üzecektir, ancak güçlü bir [ROOT.GetName] inşa edeceksek bu gereklidir."
 ETH_bop_privileges_changed:0 "Son ayrıcalık değişikliğinden bu yana bir yıldan az geçti"
 ETH_build_infrastructure:0 "[FROM.GetNameDef]'deki altyapıyı iyileştir"
 ETH_build_local_resistance_force:0 "[FROM.GetName]'da Direniş Gücü Oluştur"
 ETH_build_local_resistance_force_cost:0 "£command_power §G25§!"
 ETH_build_local_resistance_force_cost_blocked:0 "£command_power §R25§!"
 ETH_build_local_resistance_force_desc:0 "İşgal altındaki topraklardaki direniş hareketlerini desteklemek için elimizden gelen her şeyi yapmalıyız. Bu, bölgedeki [ITA.GetAdjective] hakimiyetini zayıflatmada ve biz [ETH.GetName]'ın kaçınılmaz kurtuluşuna hazırlanırken onları meşgul etmede uzun bir yol kat edecektir."
 ETH_build_local_resistance_force_increase_tt:0 "Eyalette ayaklanabilecek §G1§! Arbegnoch tümeni toplar."
 ETH_build_railway:0 "[FROM.GetNameDef] ile Demiryolu İletişimini İyileştir"
 ETH_building_local_resistance_flag:0 "Şu anda Direniş Savaşçıları Toplanıyor"
 ETH_buy_anti_tank_guns:0 "Anti-Tank Silahları Satın Al"
 ETH_buy_anti_tank_guns_desc:0 "İtalyan zırhlılarıyla benzin bidonları ve büyük av tüfekleriyle savaşmaya çalışıyoruz. Eğer İtalyanları yeneceksek, çok sayıda iyi anti-tank silahına ihtiyacımız var."
 ETH_buy_artillery:0 "Topçu Satın Al"
 ETH_buy_artillery_desc:0 "Ordularımızı desteklemek için acilen modern topçuya ihtiyacımız var. Önceliğimiz ağır silahların satın alınması için silah anlaşmaları sağlamak olmalıdır."
 ETH_buy_rifles:0 "Hafif Silahlar Satın Al"
 ETH_buy_rifles_desc:0 "Artık uluslararası silah pazarına erişimimiz olduğuna göre, silah anlaşmaları sağlamalıyız. İlk ve en önemli ihtiyacımız, işgalcilerle eşit şartlarda savaşabilmeleri için piyadelerimize tüfekler almaktır."
 ETH_buy_rifles_from_host:0 "[?ETH.host_nation.GetAdjective] yapımı tüfekler satın al."
 ETH_buy_rifles_from_host_cost:0 "§G[?ETH_buy_arms_from_host_cost]§! £GFX_ETH_imperial_treasury"
 ETH_buy_rifles_from_host_cost_blocked:0 "§R[?ETH_buy_arms_from_host_cost]§! £GFX_ETH_imperial_treasury"
 ETH_buy_rifles_from_host_desc:0 "[ROOT.GetName]'ın yeniden fethini finanse etmek için fedakarlıklar gereklidir. Hükümdarın kişisel servetini silahlara harcamak çaresizce olabilir, ancak çaresiz zamanlar çaresiz önlemler gerektirir."
 ETH_buy_support_equipment:0 "Destek Teçhizatı Satın Al"
 ETH_buy_support_equipment_desc:0 "Sadece silahlara değil, genel olarak iletişim teçhizatına ve destek teçhizatına da acil ihtiyacımız var. Bunlardan daha fazlasını ele geçirmek en yüksek öncelikli bir meseledir."
 ETH_buy_support_equipment_from_host:0 "Destek teçhizatı edin"
 ETH_buy_support_equipment_from_host_desc:0 "Tüfekler her şey değildir. Askerlerin kasklara, botlara, el bombalarına ve benzerlerine ihtiyacı var. İmparatorluk hazinesinin bir kısmını bu şeyleri edinmek için yönlendirebiliriz."
 ETH_buy_tanks_from_host:0 "Fazla [?ETH.host_nation.GetAdjective] tankları satın al"
 ETH_buy_tanks_from_host_desc:0 "[ROOT.GetAdjective] ordusu ciddi şekilde tank sıkıntısı çekiyor. Piyasada eski fazla tanklar var, imparatorluk hazinesinin bir kısmını bunlardan birkaç tane edinmek için harcamak durumu bir nebze olsun düzeltecektir. Eski tanklar hiç tank olmamasından iyidir."
 ETH_chitet_category:0 "Chitet"
 ETH_chitet_category_desc:0 "Ulusal askere çağırma, devlete çok hızlı bir şekilde çok sayıda birliğe erişim sağlar. Askere çağırma, yüzyıllar boyunca ülkeye iyi hizmet etti. Savaş bittiğinde, hepsi sivil hayatlarına geri gönderilebilir."
 ETH_chitet_cooldown_tt:0 "Chitet, dağıtıldıktan [?var_ETH_chitet_cooldown] gün sonra tekrar toplanabilir."
 ETH_chitet_disband_tt:0 "Chitet'i dağıtmanın üzerinden [?var_ETH_chitet_cooldown] gün geçti"
 ETH_christmas_offensive_mission:0 "Noel Taarruzu"
 ETH_christmas_offensive_mission_desc:0 "Birliklerimiz hala ilerliyor, ancak ivme kaybediyoruz. Yakında karşı saldırının getirdiği enerji tükenecek."
 ETH_collectivization_reforms_decision:0 "Toprak Reformları"
 ETH_collectivization_reforms_decision_desc:0 "[ETH.GetNameDefCap]'ın toprağı yüzyıllardır halk tarafından işlenmesine rağmen aristokratların mülkiyetindeydi. Toprağı yeniden dağıtarak herkesi kendi efendisi yapma fırsatımız var."
 ETH_conquer_addis_ababa_mission:0 "Addis Ababa'yı Al"
 ETH_conquer_addis_ababa_mission_desc:0 "Başkenti almalı ve [ETH.GetName]'ı teslim olmaya zorlamalıyız."
 ETH_conquer_harar_mission:0 "[835.GetName]'ı Fethet"
 ETH_conquer_harar_mission_desc:0 "Etiyopyalılar dağlarda yeniden toplanıyor. Mevzilerini sağlamlaştırmayı başarmadan önce [835.GetCapitalVictoryPointName]'ı ele geçirmeliyiz."
 ETH_consolidate_ea_targets:0 "Bu eyaletler [ETH.GetName]'a entegre edilebilir:"
 ETH_consolidate_east_africa_category:0 "Doğu Afrika'yı Konsolide Et"
 ETH_core_268:0 "[268.GetName]'ı İmparatorluğa Entegre Et"
 ETH_core_269:0 "[269.GetName]'ı İmparatorluğa Entegre Et"
 ETH_core_293:0 "[293.GetName]'ı İmparatorluğa Entegre Et"
 ETH_core_551:0 "[551.GetName]'ı İmparatorluğa Entegre Et"
 ETH_core_659:0 "[659.GetName]'ı İmparatorluğa Entegre Et"
 ETH_core_883:0 "[883.GetName]'ı İmparatorluğa Entegre Et"
 ETH_core_884:0 "[884.GetName]'ı İmparatorluğa Entegre Et"
 ETH_core_886:0 "[886.GetName]'ı İmparatorluğa Entegre Et"
 ETH_core_906:0 "[906.GetName]'ı İmparatorluğa Entegre Et"
 ETH_core_east_african_states:0 "[FROM.GetName]'ı Entegre Et"
 ETH_coup_haile_selassie_imru:0 "Saray darbesi kışkırt"
 ETH_coup_haile_selassie_imru_desc:0 "Demokratik fikirli $ETH_ras_imru_haile_selassie$, imparatorun yokluğunda ülkeyi yönetti. Şüphesiz, savaşta ülkeyi yönettikten sonra kitleler tarafından [ROOT.GetName]'ın gerçek kahramanı olarak görülüyor. Daha demokratik bir [ROOT.GetName] için çağrılar giderek yükseliyor. Belki şimdi [ROOT.GetNameDef]'de gerçekten bir değişiklik yaratma zamanıdır."
 ETH_currently_demanding_peace_flag:0 " Şu anda Barış Talep Ediliyor"
 ETH_demand_peace_decision:0 "[FROM.GetNameDef]'nin [?FROM.previous_overlord.GetAdjective] tarafından tanınmasını talep et"
 ETH_demand_peace_decision_desc:0 "[FROM.GetName]'ın cesur halkı, [?FROM.previous_overlord.GetAdjective] tiranlığına karşı ayaklandı. Şimdi harekete geçmeli ve [?FROM.previous_overlord.GetNameDef]'i [FROM.GetAdjective] topraklarından çekilmeye zorlamak için gerekli her yolu kullanmalıyız."
 ETH_demand_peace_decision_tt:0 "§Y[?FROM.previous_overlord.GetNameWithFlag]§!, §Y[FROM.GetNameWithFlag]§! ile savaşı sona erdirmesi için baskı altında!"
 ETH_disband_the_chitet:0 "Chitet'i Dağıt"
 ETH_disband_the_chitet_desc:0 "Savaş bittiğinde, askere alınanların evlerine dönmesine izin verme zamanı geldi."
 ETH_disband_the_chitet_mission:0 "Askere Alınanlar Eve Dönüyor"
 ETH_disband_the_chitet_mission_desc:0 "Chitet'i dağıtma ve askerlerin sivil hayatlarına dönmesine izin verme zamanı geldi."
 ETH_education_reforms_decision:0 "Eğitim Sistemi Reformları"
 ETH_education_reforms_decision_desc:0 "Gelecekte gerici bir hareketin gelişmesini önlemek için, çocukların kapitalist uşakları yerine özgür düşünen yetişkinler olarak büyümeleri için eğitim sistemini reforme etmeliyiz."
 ETH_electrify_state:0 "[FROM.GetName]'ın Elektrifikasyonu"
 ETH_electrify_state_desc:0 "Yerel köylere elektrik götürmek, ülkeyi modernize etmenin kilit bir parçasıdır."
 ETH_electrify_state_tt:0 "§Y$ETH_state_development_dynamic_modifier$§! değiştiricisini şununla değiştir: \n$MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+%10§!\n$MODIFIER_LOCAL_BUILDING_SLOTS$: §G+%10§!"
 ETH_exploit_french_weakness_category:0 "Fransız Zayıflığından Yararlan"
 ETH_exploit_french_weakness_category_desc:0 "Zamanı geldiğinde, [FRA.GetAdjective]lar evlerine daha yakın meselelerle meşgulken [268.GetName]'ı kontrolümüz altına alacağız."
 ETH_false_flag_operation_decision:0 "Sahte bayrak operasyonu başlat"
 ETH_false_flag_operation_decision_desc:0 "Ev sahiplerimizi [ITA.GetName]'a güvenilmemesi gerektiğine ikna etmek için, bir Alman sınır karakoluna bir saldırı düzenlemeli ve suçu İtalyanlara atmalıyız."
 ETH_form_horn_of_africa:0 "Doğu Afrika Birliğini İlan Et"
 ETH_formal_request_to_host:0 "[?ETH.host_nation.GetAdjective] hükûmetine resmi bir talepte bulun."
 ETH_formal_request_to_host_desc:0 "[?ETH.host_nation.GetAdjective] hükûmetine yaklaşılmalı ve [ITA.GetNameDef]'e karşı savaşta [ROOT.GetLeader]'ı tam olarak desteklemesi istenmelidir. Bu, ulusumuzun yeniden fethinin son bölümünü başlatacaktır."
 ETH_freedom_at_gunpoint_category:0 "Namlu Ucunda Özgürlük"
 ETH_freedom_at_gunpoint_category_desc:0 "Komşularımız emperyalistlerin boyunduruğu altında kapana kısılmış durumda. Savaş deneyimimizi ve yeni bulduğumuz ekonomik gücümüzü, sömürgeci güçlerin anladığı tek dili kullanarak Afrika'nın kurtuluşuna yöneltme zamanı geldi. Kaba kuvvet."
 ETH_freedom_at_gunpoint_dynamic:0 "[FROM.GetName]'ı [FROM.Capital.OWNER.GetName]'dan Kurtar"
 ETH_freedom_at_gunpoint_dynamic_tt:0 "§Y[FROM.Capital.OWNER.GetName]§!'a karşı §Yözgürleştirme savaş hedefi§! kazan!"
 ETH_freedom_at_gunpoint_offer_peace:0 "[FROM.GetAdjective] Bağımsızlığı için [FROM.Capital.OWNER.GetName]'a barış teklif et"
 ETH_freedom_at_gunpoint_offer_peace_tt:0 "§Y[FROM.Capital.OWNER.GetName]§!'a, §Y[THIS.GetName]§!'ın şu anda kontrol ettiği §Y[FROM.GetAdjective]§! toprağındaki iddialarından vazgeçmesi karşılığında barış teklif edilecek. Eğer kabul ederlerse, §Y[THIS.GetName]§!, §Y[FROM.GetName]§!'nin bir çekirdeği olan kontrol altındaki topraklarda bir bağlı devlet kazanır.\n\nEğer barış kabul edilirse ve ittifak [FROM.Capital.OWNER.GetFlag][FROM.Capital.OWNER.GetName]!§! ile savaş halindeyse, §R[ROOT.GetFlag][ROOT.GetNameDefCap] üyesi olduğu herhangi bir ittifaktan ayrılacaktır. \n\n§R[FROM.Capital.OWNER.GetFlag][FROM.Capital.OWNER.GetName], sadece [ROOT.GetFlag][ROOT.GetName] [FROM.GetAdjective] toprağını kontrol ediyorsa barış teklifini değerlendirecektir!§!"
 ETH_fundraising_campaign_decision:0 "Bağış Kampanyası"
 ETH_fundraising_campaign_decision_desc:0 "[ROOT.GetLeader] tarafından yapılan Radyo Konuşmasının ardından, Amerika'daki davamıza destek önemli ölçüde arttı. Bundan yararlanmalı ve imparatorluk hazinesini oluşturmak ve böylece anavatanlarımızın yeniden fethini finanse etmek için orada ve başka yerlerde bağış kampanyaları başlatmalıyız."
 ETH_harar_lost_tt:0 "Harar'ın kontrolünü kaybetmek halk arasındaki savaş desteğini düşürecektir."
 ETH_has_active_liberation_goal:0 "Aktif kurtuluş savaş hedefi var"
 ETH_has_moved_capital_flag:0 " Zaten başkenti taşıdı"
 ETH_has_readied_uprising_tt:0 "En az 1 eyalette bir ayaklanma hazırladı"
 ETH_high_fundraising_effect_tt:0 "£GFX_ETH_imperial_treasury Hazinesi: §G+20§! \n"
 ETH_hold_addis_ababa_mission:0 "Addis Ababa'yı Tut"
 ETH_hold_addis_ababa_mission_desc:0 "Başkentimizde dayanarak, umarım uluslararası topluma İtalyanların zorla durdurulması gerektiğini anlatabiliriz."
 ETH_hold_harar_mission:0 "[835.GetName]'ı Tut"
 ETH_hold_harar_mission_desc:0 "Güneyi kaybettikten sonra Harar'da dayanmaya ve denize giden yolumuzu savunmaya çalışmalıyız."
 ETH_hold_harar_mission_success:0 "\n[ETH.GetName] [835.GetName]'ı başarıyla tuttu (+1) £trigger_yes\n"
 ETH_hold_the_capital_mission_success:0 "\n[ETH.GetName] Addis Ababa'yı başarıyla tuttu (+1) £trigger_yes\n"
 ETH_hold_the_north_mission:0 "Kuzeyi Tut"
 ETH_hold_the_north_mission_desc:0 "Noel taarruzu İtalyanları geri püskürtmeyi başardı, ancak planladığımız gibi onları denize dökemedik. Yeniden toplanacaklar ve daha büyük bir güçle saldıracaklar ve biz de ülkemizi elimizde tutabildiğimizi göstermeliyiz."
 ETH_hold_the_north_mission_success:0 "\n[ETH.GetName] Kuzeyi başarıyla tuttu (+1) £trigger_yes\n"
 ETH_hold_the_south_mission:0 "Güneyi Tut"
 ETH_hold_the_south_mission_desc:0 "Güney cephesi şimdiye kadar sessizdi, ancak İtalyanlar güneydeki mülklerinden başka bir taarruz başlatmaya kesinlikle hazırlanıyor. Onları püskürtmeliyiz ve kendilerinin ve Somalili kuklalarının öne sürdüğü iddiaların yasadışı olduğunu dünyaya göstermeliyiz."
 ETH_hold_the_south_mission_success:0 "\n[ETH.GetName] Güneyi başarıyla tuttu (+1) £trigger_yes\n"
 ETH_host_confirmed_flag:0 "Bir Sürgün Ev Sahibi Ülkesi Onaylandı"
 ETH_host_country_decision:0 "[FROM.GetName]'da Sürgün Hükûmeti kurma izni iste"
 ETH_host_country_decision_desc:0 "En kötüsüne hazırlanmalıyız. Eğer ülke düşerse, direnişi sürdürebileceğimiz bir üsse ihtiyacımız var. [FROM.GetAdjective] hükûmetine yaklaşmalı ve orada bir sürgün hükûmeti kurma izni istemeliyiz."
 ETH_host_country_decision_tt:0 "Eğer §Y$ETH_boarding_the_train$§! odağı teslim olmadan önce tamamlanmışsa, §Y[ROOT.GetLeader]§!, §Y[FROM.GetNameWithFlag]§!'da bir §YSürgün Hükûmeti§! kurabilecektir. \n\n[FROM.GetNameDef]'de bir Sürgün Hükûmeti olarak mevcut olacak ek odakların kilidini açar."
 ETH_improve_communications_in_state:0 "[FROM.GetName]'daki iletişim Altyapısını İyileştir"
 ETH_improve_communications_in_state_desc:0 "Verimli iletişim araçları, ülkenin iyileştirilmesi için hayati önem taşır."
 ETH_improve_communications_in_state_tt:0 "§Y$ETH_state_development_dynamic_modifier$§! değiştiricisini şununla değiştir: \n$MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+%15§!"
 ETH_improve_country_category:0 "[ROOT.GetName]'ın İlerlemesi"
