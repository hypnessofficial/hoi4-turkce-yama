 SWI_embrace_communism:0 "Komünizmi Kucakla"
 SWI_embrace_communism_desc:0 "Artık sahne hazır olduğuna göre, hızla hareket etmeli ve bu hayatta bir kez karşılaşılabilecek fırsatı [ROOT.GetNonIdeologyName]'ı bir işçi cennetine dönüştürmek için kullanmalıyız."
 SWI_expand_arms_industry:0 "Silah Sanayisini Genişlet"
 SWI_expand_arms_industry_desc:0 "Savunmamız için yabancı güçlere güvenmek zorunda kalmamak için yeni silahlar geliştirme ve onları önemli bir hızda üretme kapasitemizi artırabiliriz."
 SWI_expand_covert_operations:0 "Gizli Operasyonları Genişlet"
 SWI_expand_covert_operations_desc:0 "Tarafsızlık görünümünü korurken dünya işlerini lehimize etkilemek için casusluk kaynaklarımızı artırabiliriz."
