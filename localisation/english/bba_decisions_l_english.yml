 ITA_missiolini_bolster_political_cabinet_desc:0 "Doğru yerler için doğru insanları bulmak her zaman zordur. En akıllı ve en parlak insanları ararken hiçbir taşı çevrilmemiş bırakamayız."
 ITA_missiolini_bolster_political_cabinet_trigger_tt:0 "§Y3§! adet $political_advisor$ aktif, en az biri §YHierarch§! olmak üzere!"
 ITA_missiolini_conquer_ethiopia:0 "Etiyopya'yı Fethet"
 ITA_missiolini_conquer_ethiopia_desc:0 "Hala kalan Habeş kaleleri, bir İtalyan zaferini güvence altına almak için halledilmelidir."
 ITA_missiolini_expand_intelligence_agency:0 "İstihbarat Servisini Genişlet"
 ITA_missiolini_expand_intelligence_agency_desc:0 "İstihbarat servisimiz genişleterek, komünistleri, suçluları ve diğer zararlı unsurları gün ışığına çıkarmak ve adalete teslim etmek için İtalyan toplumunun her yönüne sızacağız, böylece İtalya'yı daha güvenli hale getireceğiz."
 ITA_missiolini_firmly_established_italian_administration_autonomy_text:0 "Sağlam Kurulmuş [ROOT.GetAdjective] Yönetimi"
 ITA_missiolini_industrial_research:0 "Endüstriyel Araştırma"
 ITA_missiolini_industrial_research_desc:0 "Faşizmin ve İtalyan halkının teknolojide ne kadar büyük bir hızla büyük sıçramalar yapabildiğini dünyaya göstermeliyiz."
 ITA_missiolini_occupy_albania:0 "Arnavutluk'u İşgal Et"
 ITA_missiolini_occupy_albania_desc:0 "İtalya ile Arnavutluk arasındaki güçlü bağlar, Roma İmparatorluğu'na kadar binlerce yıl öncesine dayanıyor. Adriyatik Denizi'ne girişi güvence altına almak için Arnavutluk'u İtalya'ya dahil etmeliyiz."
 ITA_missiolini_occupy_albania_occupation_effects:0 "Eğer [ROOT.GetFlag][ROOT.GetNameDef], [ALB.GetFlag][ALB.GetAdjective] çekirdeklerini kontrol ediyorsa: \n"
 ITA_missiolini_occupy_albania_subject_effects:0 "Eğer [ALB.GetFlag][ALB.GetNameDef], §Y[ROOT.GetFlag][ROOT.GetNameDef]§!'nin bir bağlı devleti ise: \n"
 ITA_missiolini_occupy_dalmatia:0 "[103.GetName]'ı İşgal Et"
 ITA_missiolini_occupy_dalmatia_desc:0 "Büyük Savaş'tan kaynaklanan büyük bir adaletsizliği düzeltmeli ve haklı olarak bize ait olanı zorla almalıyız. Dalmaçya İtalyan olmalı!"
 ITA_missiolini_occupy_dalmatia_occupation_effects:0 "\nEğer [ROOT.GetFlag][ROOT.GetNameDef], §Y[103.GetName]§!'ı kontrol ediyorsa: \n[ROOT.GetFlag][ROOT.GetNameDef] tarafından tamamen kontrol edilen her [YUG.GetFlag][YUG.GetAdjective] çekirdek eyaleti: \n Uyum: §G+%5.0§!. \n Direniş: §G-%5.0§!"
 ITA_missiolini_occupy_dalmatia_subject_effects:0 "\n Eğer §Y[103.GetName]§!, [YUG.GetAdjective] kökenli bir [ROOT.GetAdjective] bağlı devleti tarafından tamamen kontrol ediliyorsa: \n [YUG.GetAdjective] kökenli tüm [ROOT.GetAdjective] bağlı devletleri: \n"
 ITA_missiolini_occupy_greece:0 "[GRE.GetName]'ı İşgal Et"
 ITA_missiolini_occupy_greece_desc:0 "Eski Roma lejyonları gibi, biz de Yunanistan'ı fethederek ve kardeş halklarımızı birleştirerek üzerimize konulan kısıtlamaları kırabiliriz."
 ITA_missiolini_occupy_greece_occupation_effects:0 "\n[ROOT.GetFlag][ROOT.GetNameDef] tarafından tamamen kontrol edilen her [GRE.GetFlag][GRE.GetAdjective] çekirdek eyaleti: \n Uyum: §G+%5.0§!. \n Direniş: §G-%5.0§! \n\nMevcut etkiler:"
 ITA_missiolini_occupy_greece_subject_effects:0 "\nEğer [GRE.GetFlag][GRE.GetName], §Y[ROOT.GetFlag][ROOT.GetNameDef]§!'nin bir bağlı devleti ise: \n"
 ITA_missiolini_occupy_ticino:0 "[846.GetName]'ı İşgal Et"
 ITA_missiolini_occupy_ticino_desc:0 "Hannibal filleriyle Alpleri geçtiğinden beri, dağlar barbarların doğrudan İtalya'nın kalbine giden bir otoyolu olmuştur. Kuzey sınırımızı güvence altına almalıyız."
 ITA_missiolini_occupy_ticino_occupation_effects:0 "\n[846.GetName] ve [ROOT.GetFlag][ROOT.GetNameDef] tarafından tamamen kontrol edilen her [SWI.GetFlag][SWI.GetAdjective] çekirdek eyaleti: \n Uyum: §G+%5.0§!. \n Direniş: §G-%5.0§! \n\nMevcut etkiler:"
 ITA_missiolini_occupy_ticino_subject_effects:0 "\nEğer [SWI.GetFlag][SWI.GetName], §Y[ROOT.GetFlag][ROOT.GetNameDef]§!'nin bir bağlı devleti ise: \n"
 ITA_missiolini_pacify_ethiopia:0 "Etiyopya'yı Sakinleştir"
 ITA_missiolini_pacify_ethiopia_desc:0 "Duce, Habeş muhalefetine kaba kuvvetle baskı yapma ve nüfusu kontrol altında tutmak için yasalar çıkarma emri verdi. Tüm ülkenin bir an önce sakinleştirilmesini ve İtalyan saflarına katılmasını istiyor."
 ITA_missiolini_pacify_ethiopia_vanilla:0 "$ITA_missiolini_pacify_ethiopia$"
 ITA_missiolini_pacify_ethiopia_vanilla_desc:0 "$ITA_missiolini_pacify_ethiopia_desc$"
 ITA_missiolini_stockpile_fuel:0 "Yakıt Rezervlerini Artır"
 ITA_missiolini_stockpile_fuel_desc:0 "Modern bir ordu sadece midesiyle değil, aynı zamanda yakıtıyla da yürür ve eğer yakıt yoksa tüm savaş makinesi durur. Ordunun tüm kolları ona ihtiyaç duyar ve savaş alanlarında başarılı olacaksak büyük miktarlarda gaz sağlayabilmeliyiz."
 ITA_missiolini_stockpile_trucks:0 "Kamyon Stokla"
 ITA_missiolini_stockpile_trucks_desc:0 "Geniş arazi parçaları üzerinde geciken lojistikle kısıtlanmadan hızlı hareket edebilen daha hareketli bir askeri güce ihtiyacımız var."
 ITA_missiolini_strengthen_heavy_industry:0 "Sanayileşme Programı"
 ITA_missiolini_strengthen_heavy_industry_desc:0 "İtalya'nın gerçekten gelişmesi için, hareketli imparatorluğumuzun büyümesini sürdürmek ve üretim yeteneklerimizi genişletmek için yeni fabrikalar inşa etmeliyiz."
