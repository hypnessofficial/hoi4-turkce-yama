 ITA_bop_privileges_for_the_elites:0 "£BoP_right_texticon Elitler için Ayrıcalıklar"
 ITA_bop_question_the_airforce:0 "£BoP_left_texticon Hava Kuvvetlerinin Sadakatini Sorgula"
 ITA_bop_question_the_airforce_desc:0 "Hava Kuvvetlerinin etkisizliğini gösteren son olaylarla birlikte, birçok insan birliklerin İtalya'ya ve faşist sisteme tam olarak ne kadar sadık olduğunu merak ediyor."
 ITA_bop_question_the_army:0 "£BoP_left_texticon Ordunun Sadakatini Sorgula"
 ITA_bop_question_the_army_desc:0 "Ordunun etkisizliğini sergileyen son olaylarla birlikte birçok kişi, birliklerin İtalya'ya ve faşist sisteme ne kadar sadık olduğunu merak ediyor."
 ITA_bop_question_the_navy:0 "£BoP_left_texticon Donanmanın Sadakatini Sorgula"
 ITA_bop_question_the_navy_desc:0 "Donanmanın etkisizliğini sergileyen son olaylarla birlikte birçok kişi, birliklerin İtalya'ya ve faşist sisteme ne kadar sadık olduğunu merak ediyor."
 ITA_bop_resign_ministry_of_corporations_position:0 "£BoP_left_texticon Korporasyonlar Bakanlığı Görevinden İstifa Et"
 ITA_bop_resign_ministry_of_corporations_position_desc:0 "Korporasyonlar Bakanı olarak görevden istifa etmek, başkalarına yer açacak ve Benito Mussolini'yi İtalya'nın finansal sistemi ve kurumları üzerinde daha az kontrol sahibi bırakacaktır."
 ITA_bop_resign_ministry_of_education_position:0 "£BoP_left_texticon Eğitim Bakanlığı Görevinden İstifa Et"
 ITA_bop_resign_ministry_of_education_position_desc:0 "Kamu Eğitimi Bakanı olarak görevden istifa etmek, başkalarına yer açacak ve Benito Mussolini'yi İtalya'nın eğitim sistemi ve kurumları üzerinde daha az kontrol sahibi bırakacaktır."
 ITA_bop_resign_ministry_of_foreign_affairs_position:0 "£BoP_left_texticon Dışişleri Bakanlığı Görevinden İstifa Et"
 ITA_bop_resign_ministry_of_foreign_affairs_position_desc:0 "Dışişleri Bakanı olarak görevden istifa etmek, başkalarına yer açacak ve Benito Mussolini'yi İtalya'nın dış politikaları ve ilişkileri üzerinde daha az kontrol sahibi bırakacaktır."
 ITA_bop_resign_ministry_of_justice_position:0 "£BoP_left_texticon Adalet Bakanlığı Görevinden İstifa Et"
 ITA_bop_resign_ministry_of_justice_position_desc:0 "Lütuf ve Adalet Bakanı olarak görevden istifa etmek, başkalarına yer açacak ve Benito Mussolini'yi İtalya'nın adli sistemi ve kurumu üzerinde daha az kontrol sahibi bırakacaktır."
 ITA_bop_revoke_the_lateran_treaty:0 "£BoP_right_texticon Lateran Antlaşmasını Feshet"
