 SWI_renounce_guiding_principles_desc:0 "[SWI_renounce_guiding_princpiples_desc_loc]"
 SWI_renounce_guiding_principles_desc_cantons:0 "Gücü kantonlara ve Federal Meclise devretmeye devam etme yönündeki asıl taahhüdümüz erken olmuş olabilir. Mevcut koşullar, hayatta kalmamız için daha enerjik ve yetkilendirilmiş bir Federal Konseyin gerekli olduğunu açıkça ortaya koyuyor."
 SWI_renounce_guiding_principles_desc_council:0 "Gücü Federal Konsey'de birleştirme yönündeki asıl taahhüdümüz yanlış yönlendirilmiş olabilir. Mevcut durum, istikrar ve vatandaş katılımının günün düzeni olduğu daha doğrudan ve kapsayıcı bir demokrasi çağrısı yapıyor."
 SWI_research_slot_tooltip:0 "§YKonfederasyon Başkanı§! olarak terfi ettiğinde, ekstra bir §GAraştırma Yuvası§! veren §Y$SWI_expand_arms_industry$§! kararının kilidini açacak!"
