 SWI_declare_the_alpine_confederation:0 "Alp Konfederasyonunu İlan Et"
 SWI_declare_the_alpine_confederation_desc:0 "Demokrasimiz Alpler boyunca yayıldığına göre, Konfederasyon artık sadece [SWI.GetNonIdeologyName]'a ait değil, tüm Alp halklarına ve topluluklarına aittir."
 SWI_declare_the_alpine_union:0 "Alp Birliğini İlan Et"
 SWI_declare_the_alpine_union_desc:0 "Alplerin işçilerinin ve halklarının iradesi durdurulamaz, Burjuvazinin boyunduruğundan toprakları özgürleştirmeye devam ederken, [SWI.GetNonIdeologyName]'ın ötesine geçtik ve ülkemiz bunu yansıtmalıdır."
 SWI_defense_fund_drive:0 "Savunma Fonu Kampanyası"
 SWI_defense_fund_drive_desc:0 "Potansiyel işgalcilerimize karşı savunmak, İsviçre Federal Hükûmetinin sahip olmadığı parayı gerektirir, ancak İsviçre vatandaşlarının bu fonları sağlaması için kampanya yapabiliriz, gerçek bir aşağıdan yukarıya girişim."
 SWI_diplomatic_mission:0 "Diplomatik Misyon"
 SWI_diplomatic_mission_desc:0 "Onlarla daha yakın ilişkiler kurmak ve tarafsızlığımız hakkındaki şüphelerini gidermek için diğer uluslara diplomatik geziler düzenleyebilir, böylece onlardan gelebilecek olası bir işgali önleyebiliriz."
 SWI_dismiss_council:0 "Konseyi Dağıt"
 SWI_dismiss_council_desc:0 "Düşmanlarımız çok güçlü ve Federal Konseyin çekişmelerine ve iç çatışmalarına seviniyorlar. Büyük bir liderin ayağa kalkıp [ROOT.GetNonIdeologyName]'ı bu fırtınadan geçirme zamanı geldi."
