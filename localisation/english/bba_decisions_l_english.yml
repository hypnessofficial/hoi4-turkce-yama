 SWI_spouse_fascism_desc:0 "Dünyadaki gidişata bakılırsa, faşist güçlerle hizalanmak en güvenli bahis olabilir, halkın değerlerimizi yeniden hizalamaya hazır olabilmesi için faşist propaganda yaymaya başlayabiliriz."
