 ITA_bop_send_support:0 "£BoP_right_texticon [FROM.GetName]'a Askerî Destek Gönder"
 ITA_bop_send_support_desc:0 "İdeolojik kardeşlerimiz kendilerini bir savaşın içinde buldular. Faşizmin kurucuları olarak, onların galip gelmelerini sağlamak bizim görevimizdir!"
 ITA_bop_slander_the_duce:0 "£BoP_left_texticon Duce'ye İftira At"
 ITA_bop_slander_the_duce_desc:0 "İtalya, [ITA.GetLeader]’nin beceriksizliği yüzünden birçok cephede zorlanıyor. Belki de yeni bir liderliğin zamanı gelmiştir?"
 ITA_bop_take_over_ministry_of_corporations:0 "£BoP_right_texticon Korporasyonlar Bakanlığını Devral"
