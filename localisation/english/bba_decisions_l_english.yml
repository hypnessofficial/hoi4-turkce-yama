 SWI_federal_council_decisions_category_desc_alt:0 "[SWI.GetNameDef] lideri [SWI.GetLeader]'dan böylesine önemli bir misyona sahip bir ülkenin tüm görevlerini yerine getirmesi beklenemez, bu yüzden [SWI.GetLeader.GetSheHe] feshedilmiş Meclisin bazı işlevlerini devretmek için bir konseyle güvenmelidir. \n\n§YÖnde Gelen Konsey Üyeleri:§! \n[SWI_GetCouncilor1name] \n[SWI_GetCouncilor2name] \n[SWI_GetCouncilor3name]"
 SWI_federal_council_decisions_category_desc_dem:0 "İsviçre Federal Konseyi, 1848'den beri İsviçre Demokrasisinin sadık zirvesi olarak durmaktadır. [SWI_get_temp_explanation_of_council_system]\n\n§Yİsviçre Konfederasyonu Başkanı:§! \n[SWI_GetPresidentName] \n\n§YÖnde Gelen Konsey Üyeleri:§! \n[SWI_GetCouncilor1name] \n[SWI_GetCouncilor2name] \n[SWI_GetCouncilor3name]"
 SWI_federal_council_decisions_category_desc_fasc:0 "Eski konsey olmayabilir, ancak [SWI.GetLeader] liderliğindeki yeni şanlı rejim, [?SWI.SWI_biggest_fascist.GetNameDef]'de Führer'in iradesini uygulamak için hala güçlü bir konseyle ihtiyaç duymaktadır. \n\n§YÖnde Gelen Konsey Üyeleri:§! \n[SWI_GetCouncilor1name] \n[SWI_GetCouncilor2name] \n[SWI_GetCouncilor3name]"
