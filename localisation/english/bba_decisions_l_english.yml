 SWI_recently_finished_president_initiative:0 "Yakın zamanda bir Konsey Girişimi bitirdi"
 SWI_recently_finished_president_initiative_desc:0 "Konfederasyon Başkanı ve Federal Konseyin sınırlı gücüyle, başka bir ortak girişim denemeden önce beklemeliyiz. Konseye daha fazla güç vermek, bu girişimlerden daha fazlasını yapmanın yolu olabilir, ancak bunun İsviçre'nin köklü demokratik değerleri için en iyi yol olup olmadığını düşünmeliyiz."
