l_english:
 AFA_GATHERING_STORM_DESC:0 "Afar halkı uzun zamandır doğuda Cibuti'den batıda Etiyopya'ya uzanan uçsuz bucaksız Danakil Çölü'nde yaşamaktadır. Ancak son zamanlarda Muhammed Yayyo'nun Benito Mussolini'yi Haile Selassie'ye tercih etmesiyle İtalya'nın bölge üzerindeki nüfuzu artmaktadır.\n\nİkinci İtalya-Habeşistan Savaşı tüm hızıyla devam ederken, yakın gelecekte bir tutum belirlenmesi gerekecek gibi görünüyor: Afarların geleceği İtalya'da mı yatıyor, yoksa kendi başlarına olmaları onlar için daha mı iyi?"
 AFG_BLITZKRIEG_DESC:0 "Kral Zahir Şah rolüne alışmaya devam ederken, yönetiminin karşılaştığı zorluklar da artıyor. Britanya, Almanya ve Sovyetler Birliği, stratejik konumdaki Krallık üzerinde nüfuz sahibi olmak için mücadele ediyor; hem yatırımları hem de müdahale tehditlerini beraberlerinde getiriyorlar. Bu sırada, sınırları Raj boyunca geçen kışkırtıcılar, her iki tarafta da huzursuzluğa yol açıyor. Ancak dünya yeniden savaşa sürüklenirken, bölgedeki soru şu: 'Afganistan ne yapacak?'"
 AFG_GATHERING_STORM_DESC:0 "Kral Zahir Şah ve amcalarının yönetimi altında Afganistan, nispeten istikrarlı bir döneme giriyor. Ancak bu kadim Krallığın yüzeyinin altında öfke ve güvensizlik dalgaları kaynamaya devam ediyor. Bazıları sürgündeki Amanullah Han'ın denediği gibi radikal bir modernleşme umuyor - ki kendisinin tahtına dönmek için planlar yaptığına inanılıyor. Diğerleri ise Zahir Şah'ın yavaş ilerleyen değişim hızının bile fazla hızlı olduğunu ve ulusun geleneksel köklerine dönmesi gerektiğini düşünüyor. Ancak belki de çevredeki dünya istikrarsızlaştıkça, Afganistan halkı bu durumu lehine çevirmek için bir araya gelebilir."
 ARG_BLITZKRIEG_DESC:0 "Arjantin tarihindeki en hileli seçimle Concordancia hükümette çoğunluğu elinde tutmaya devam ediyor ve Roberto María Ortiz şu anda ülkeyi başkan olarak yönetiyor. \n\nAncak Arjantin'in Avrupa'daki en yakın iki dostu arasında tansiyon yükselirken, ülke şimdi iki hizip arasında kalmanın kaçınılmazlığına hazırlanmak zorundadır. Sadece bu da değil, ordu içindeki hoşnutsuzluk artıyor ve kuzeyde sürekli uyuyan rakipleri hakkında paranoya sürekli körükleniyor. Arjantin büyük bir kavşakta durmaktadır ve nasıl tepki vereceğini dikkatlice düşünmelidir."
 ARG_GATHERING_STORM_DESC:0 "1930'da Hipólito Yrigoyen kabinesi, Arjantin Anayasası'nın kabulünden bu yana gerçekleşen ilk askeri darbeyle devrildi ve Rezil On Yıl olarak bilinen dönem başladı. Arjantin, büyük güçlerin Birinci Dünya Savaşı'nın bitiminden bu yana devam eden kırılgan barışı tehdit ettiği, hızla değişen bir dünyada yol almak zorundadır. \n\nEn önemli tehdit nedir? Avrupa'da yaklaşan fırtına mı? Kendi komşuları mı? Yoksa kendileri mi? Arjantin ayaklarının üzerinde durmak ve dünya sahnesindeki yerini sağlamlaştırmak zorunda."
 AST_BLITZKRIEG_DESC:0 "Avustralyalılar Büyük Savaş'ın tarih kitaplarındaki yerlerini kanlarıyla kazandılar. Gelibolu harekatında yapılan fedakarlıklar unutulmadı - ve bunu emredenler de unutulmadı. \n\nAvustralya şimdi bir yol ayrımında duruyor: Uzak Avrupa'da yeni bir çatışmanın içine çekilmek üzere olan sömürgeci efendisinin yanında mı kalmalı, yoksa eve daha yakın görünen tehditlere mi odaklanmalı?"
 AST_BLITZKRIEG_TAOG_DESC:0 "Uykularından uyanan Digger'lar, ANZAK ruhları canlanırken gözlerindeki mahmurluğu siliyorlar. Avustralyalılar üniformalarını kuşanıp anavatanlarına bir kez daha veda ederken, savaş ihtimali ateşlenmeyi bekleyen bir işaret tabancası gibi havada asılı duruyor.\n\nSon yıllardaki askeri yatırımlar Asya tehditleri kadar Avrupa tehditlerini de püskürtmeye yetecek mi ve Britanya, dünyanın dört bir yanında gücünü dağıtmışken Avustralya'ya verdiği sözleri tutabilecek mi? Birçok soru hala belirsizliğini koruyor ancak birinin cevabı her zaman bellidir: Savaşılması gereken muharebeler olduğunda, Avustralya savaşmak için orada olacaktır."
 AST_GATHERING_STORM_DESC:0 "Avustralyalılar Büyük Savaş'ın tarih kitaplarındaki yerlerini kanlarıyla kazandılar. Gelibolu harekatında yapılan fedakarlıklar unutulmadı - ve bunu emredenler de unutulmadı. \n\nAvustralya şimdi bir yol ayrımında duruyor: Uzak Avrupa'da yeni bir çatışmanın içine çekilmek üzere olan sömürgeci efendisinin yanında mı kalmalı, yoksa eve daha yakın görünen tehditlere mi odaklanmalı?"
 AUS_GATHERING_STORM_DESC:0 "1934'teki 'Parlamentonun Kendini Tasfiye Etmesi' ve ardından Şansölye Engelbert Dolfuss'un suikastı ile sarsılmış olan Avusturya'da gerginlikler hala yüksek. Saint-Germain-En-Laye Antlaşması'na sıkı sıkıya bağlı ve ekonomik bir kriz yaşayan Şansölye Schuschnigg yönetimindeki Avusturya liderliği kendilerini devasa ölçekte kararlarla karşı karşıya buluyor. Kaderlerini kabul edin, Almanya onlar için mi gelecek? Diplomatik veya askeri olarak acı sona direnmeli mi? Yoksa geçmişe mi bakmalı, bir İmparatorluktu, bir İmparatorluk olacak mı?"
 BEL_BLITZKRIEG_DESC:0 "Belçika'da iç istikrarsızlık hala devam ediyor ancak bu, şu anda dünya sahnesinde hissedilen istikrarsızlıkla kıyaslanamaz. Ülkenin ordusu modernizasyon ve genişleme geçirdi ve Fransız Maginot'unkilerle bile rekabet edebilecek kadar güçlü tahkimatlara büyük ilgi gösterildi.\n\nBelçika hükümeti ittifaklarını terk etti ve mutlak tarafsızlık ilan etti ancak bu, saldırı durumunda arka planda anlaşmaların imzalanmasını engellemedi. Belçika, komşusunun artan militarizmine büyük bir endişeyle bakıyor."
 BEL_GATHERING_STORM_DESC:0 "Belçika, Büyük Savaş'taki deneyimlerinin izlerini taşımaya devam ediyor, ülkenin büyük bir kısmı hala harabe halinde ve halkının ruhunda daha derin yaralar bulunuyor. Ülkenin demokratik geleceği, çeşitli faşist gruplar tarafından kendilerine yöneltilen yolsuzluk iddialarıyla kuşatılmış olduğundan, bir şekilde şüpheli.\n\nBelçika, uluslararası alanda, ülkeyi bir savaş alanına çevirenlere karşı antlaşma yükümlülükleri ile giderek daha da istikrarsızlaşan bir dünyada devam eden güvenlikleri konusundaki endişeler arasında ince bir ipte yürüyor."
 BLITZKRIEG_DESC:0 "Son birkaç yılda dünya, Avrupa ve Asya'da bazı yeni savaşların patlak verdiğine tanık oldu. İspanya şu anda milliyetçiler tarafından yönetiliyor ve Japonya hem Sovyetler Birliği hem de Çin ile toprak için savaştı, ikincisi Japonya için daha başarılı bir savaş oldu. Sovyetler Birliği ile Almanya arasındaki yeni saldırmazlık paktı Avrupa'nın geri kalanı için kötü haber olabilir."
 BLITZKRIEG_NAME:0 "Blitzkrieg"
 BM_HISTORY_TITLE:0 "Kısa Tarihçe"
 BRA_BLITZKRIEG_DESC:0 "Getúlio Vargas hükümetin kontrolünü ele geçirdi ve demokratik süreci askıya aldı. İktidarı şimdilik elinde tutan Brezilya lideri dikkatini uluslararası ilişkilere çevirir. Avrupa'da savaş kaçınılmaz görünüyor ve Arjantin'in Brezilya topraklarına girmesi paranoyası ülke yönetiminin aklında. Ancak Amerika Birleşik Devletleri ile yakınlaşmanın Brezilya'nın geleceğini güvence altına alabileceğine dair bir umut var."
 BRA_GATHERING_STORM_DESC:0 "Büyük Buhran, ihracata aşırı bağımlılık nedeniyle Brezilya ekonomisini mahvetti. Sonraki yıllarda, askeri subaylar, işçiler ve politikacılardan oluşan koalisyonlar ülkeyi yöneten oligarşiyi devirip yerine kırılgan bir demokratik anayasa koyduğunda siyasi çalkantı seviyeleri arttı.\n\nGetúlio Vargas, yakın zamanda komünist bir darbeyi durdurarak ve olağanüstü yetkileri üstlenerek Brezilya siyasetinin ön saflarına çıktı. Demokrasinin geri gelip gelmeyeceği veya Vargas'ın ülkeyi daha otoriter bir yöne mi götüreceği henüz belli değil."
 BUL_BLITZKRIEG_DESC:0 "Son birkaç yıldır Çar Boris, Zveno'nun komplocu örgütünü dağıtarak ve Bulgar uluslararası siyasetini Almanya'ya doğru yeniden yönlendirerek iktidarını sağlamlaştırdı. Balkan komşularıyla yapılan son görüşmelerde, İngiltere'nin Bulgaristan'ın Mihver devletleriyle ittifak kurmasını önlemek umuduyla Büyük Savaş'tan sonra ülkeye uygulanan askeri kısıtlamaları kaldırması görüldü.\nŞimdi Çar, ülkeyi yeni bir çatışmaya sürüklemeden geçmişte kaybedilen toprakları geri almaya çalışıyor, ancak Avrupa'da artan uluslararası gerginlikle birlikte Bulgaristan'ın geleceğinin ne olacağı henüz belli değil..."
 BUL_GATHERING_STORM_DESC:0 "1878 Kurtuluş Savaşı'ndan ve Batılı demokrasilerin San Stefano Antlaşması'nı reddetmesinden bu yana Bulgaristan, Balkanlar'da uzun bir çatışma ve ihanet tarihi yaşadı. Büyük Savaş'ta Merkez Güçler'in yenilen bir üyesi olarak Bulgaristan ağır toprak kayıpları yaşadı ve Neuilly-sur-Seine Antlaşması sert ekonomik yaptırımlar ve ciddi askeri kısıtlamalar getirdi.\n\nAncak Avrupa'da büyük siyasi ve sosyal değişimler yaşanırken, Bulgaristan'ın kendi yolunu seçmesi ve Balkanlar'da hak ettiği yeri bulması zamanı geldi."
 CAN_BLITZKRIEG_DESC:0 "Kanada Büyük Savaş'a sadece bir koloni olarak girdi ve bir ulus olarak ayrıldı. Passchendaele'nin çamurunda doğan Kanada, şimdi dünya sahnesine ilk belirsiz adımlarını atıyor.\n\nBüyük Buhran'ın ve Anglofonlar ile Frankofonlar arasındaki iç bölünmelerin yarattığı aksaklıklarla, bu yeni ulusun geleceği her şeyden çok güvenli görünüyor."
 CAN_GATHERING_STORM_DESC:0 "Kanada Büyük Savaş'a sadece bir koloni olarak girdi ve bir ulus olarak ayrıldı. Passchendaele'nin çamurunda doğan Kanada, şimdi dünya sahnesine ilk belirsiz adımlarını atıyor.\n\nBüyük Buhran'ın ve Anglofonlar ile Frankofonlar arasındaki iç bölünmelerin yarattığı aksaklıklarla, bu yeni ulusun geleceği her şeyden çok güvenli görünüyor."
 CHI_BLITZKRIEG_DESC:0 "Japonlara karşı iki yıl süren savaşın ardından Chiang Kai-Shek'in orduları saldırıyı durdurmak için kanlarını akıttı. Düşman ülkenin en zengin bölgelerini istila etmiştir. Batı demokrasilerinden çok az destek gelmiştir ve Komünistler düşmanla açık bir savaşa girmeye isteksiz görünmektedir.\n\nSavaş daha da yayılma tehdidiyle karşı karşıyayken, en kötüsü hala gelmemiş gibi görünmektedir. Ancak Japon saldırısı ülkenin genişliği nedeniyle yavaşlarken, bakışlarını başka yönlere çevirebilirler ve yeni ittifaklar gidişatı değiştirebilir..."
 CHI_GATHERING_STORM_DESC:0 "Son Qing İmparatoru'nu tahttan indiren devrimin ardından genç Çin Cumhuriyeti ayakta kalma mücadelesi vermektedir. Çevredeki toprakların çoğunu savaş ağaları yönetmektedir. Ülkenin kalbinde, Komünistler uzak bir dağ vadisinde bir üs bölgesi kurmuşlardır. Sınırların hemen ötesinde Japonlar, son Çin İmparatoru'na bağlı bir kukla hükümet kurmuşlardır ve ülkeyi onun yönetimi altında yeniden birleştirmeye çalışacaklardır.\n\nKendisini tehdit eden pek çok düşmanı olan Çan Kay-Şek hükümeti, hayatta kalmak ve Çin'i yönetmek istiyorsa zor seçimler yapmak zorunda kalacaktır."
 CHL_BLITZKRIEG_DESC:0 "Jorge González von Marées ve Nacistas'ın darbe girişimi yakın zamanda ele alındığından, Arturo Alessandri istifa etti ve Pedro Aguirre Cerda Şili'nin yeni başkanı seçildi. Ancak askeri tehdit hala yakınlarda ve General Ariosto Herrera ve destekçilerinin kendi darbelerini denemeleri yakın görünüyor.\n\nSavaş da ufukta beliriyor, çünkü gerilimler sadece Avrupa ve Asya'da değil, Şili'nin kalbine yakın Amazon'da da yükseliyor."
 CHL_GATHERING_STORM_DESC:0 "Wall Street Çöküşünün bir sonucu olarak ABD, ülkenin ana gelir kaynağı olan Şili'den bakır ve nitrat ithalatını durdurdu. Bu, Şili'nin ekonomik buhrandan en kötü etkilenen Güney Amerika ülkesi olmasına yol açtı ve buhranla birlikte daha da kötüleşen siyasi istikrarsızlık henüz çözülmedi.\n\nArturo Alessandri'nin görev süresi sona ererken, Faşist hareket yükselişte ve ülke, bir önceki on yılın darbelerini ve 1932'deki Şili Sosyalist Cumhuriyeti'ni canlı bir şekilde hatırlıyor."
 COG_BLITZKRIEG_DESC:0 "İtalyanların Habeşistan'ı fethetmesiyle ve Alman Reich'in Avrupa'da yeni topraklar elde etmesiyle durum tehlikeli görünüyor. İtalya'nın sömürgeci hırsları Doğu Afrika'da durmuyor ve yakın gelecekte bizi tehdit edebilirken, Hitler Avrupa kıtası üzerindeki hegemonya planlarının bir adımı olarak Belçikalı efendilerimize aktif olarak göz dikiyor.\n\nÖnce onlara götürmezsek, savaşın yakında bize geleceği anlaşılıyor..."
 COG_GATHERING_STORM_DESC:0 "Hala Kongo Özgür Devleti ve Kral II. Leopold'un yaraları altında olan Belçika Kongosu o zamandan bu yana çok yol kat etti. Sömürge hükümeti hala madenlerde ucuz işgücü kullanıyor ve görünmez bir çatı var, bu da ülkenin sakinlerinin çoğunun yüksek öğrenim görmesini engelliyor, ancak her şey kasvetli değil.\n\nİtalyan sömürgeci hırsları giderek büyürken ve Büyük Savaş'ta iyi performans gösterdikten sonra, Force Publique bir kez daha devleti korumak için hazırlanıyor, ne kadar yetersiz donanımlı olursa olsun."
 COUNTRY_SELECTION_CHARACTER_DESC:0 "$NAME|Y$ $DESC|$\n$TRAITS_DESC|$"
 COUNTRY_SELECTION_CHARACTER_DESC_NAME:0 "$NAME|Y$"
 CZE_GATHERING_STORM_DESC:0 "Büyük Savaş sırasında Çek birlikleri, uluslarının tanınmasını sağlamak için Avrupa'nın her yerinde İtilaf güçleriyle birlikte savaştı. Çabaları başarılı oldu ve Çekoslovakya Avusturya-Macaristan İmparatorluğu'nun küllerinden doğdu.\n\nDevlet olma yolunda patlayıcı bir giriş yapmalarından bu yana Çekoslovakya, Macaristan'ın Avusturya-Macaristan İmparatorluğu'nu yeniden kurma çabalarını bastırmak amacıyla Yugoslavya ve Romanya ile 'Küçük İtilaf' ittifakını kurdu, ancak yeniden canlanan Alman gücü arttıkça Avrupa'nın siyasi manzarası hızla değişiyor."
 DEN_BLITZKRIEG_DESC:0 "Danimarka, çok daha büyük ve güçlü komşusu Almanya'yı yatıştırmak için her yıl bütçe kesintileri gören ihmal edilmiş bir orduyla tehlikeli bir durumdadır.\n\nAncak yatıştırmalar, Alman Reich'in Avrupa'daki gücünü pekiştirmesini ve diğer uluslar üzerinde hak iddia etmesini engellemedi. Danimarka şimdi, onları felaketle sonuçlanan Büyük Savaş'tan kurtaran tarafsızlık beyanına güvenmelidir."
 DEN_GATHERING_STORM_DESC:0 "Avrupa'da tansiyon yeniden yükselirken, Danimarka kendisini zayıf bir orduyla ve ekonomiyi kasıp kavuran Büyük Buhran'la karşı karşıya buluyor.\n\nDanimarkalılar yüksek işsizlikle ve siyasi uçlarda büyüyen aşırılık yanlısı hareketlerle mücadele etmenin bir yolunu bulmalı ve aynı zamanda tarafsızlık ve yatıştırma politikasının değerini yeniden değerlendirmelidir.\n\nDanimarka hala kendi kaderinin efendisidir, ancak ne kadar süreceği belli değildir."
 ENG_BLITZKRIEG_DESC:0 "Birleşik Krallık Büyük Savaş'tan zaferle çıkmış olsa da, büyük imparatorluğunun temeli temelinden sarsılmıştı. Ülkenin en iyilerinden oluşan bir nesil Flanders ve Kuzey Fransa siperlerinde kaybedilirken, İngiliz Milletler Topluluğu genelinde huzursuzluk yayıldı ve devasa borçlar birikti.\n\nSon savaşın travması hala hafızalardayken, ülke şimdi yeni bir savaş ihtimaliyle karşı karşıya. Zamanımız için Barış olmayacağı giderek daha açık hale geliyor."
 ENG_GATHERING_STORM_DESC:0 "Birleşik Krallık Büyük Savaş'tan zaferle çıkmış olsa da, büyük imparatorluğunun temeli temelinden sarsılmıştı. Ülkenin en iyilerinden oluşan bir nesil Flanders ve Kuzey Fransa siperlerinde kaybedilirken, İngiliz Milletler Topluluğu genelinde huzursuzluk yayıldı ve devasa borçlar birikti.\n\nSon savaşın travması hala hafızalardayken, ülke şimdi yeni bir savaş ihtimaliyle karşı karşıya. Zamanımız için Barış olmayacağı giderek daha açık hale geliyor."
 EST_BLITZKRIEG_DESC:0 "Estonya, Doğu'daki Kızıl Tehdit ile deniz arasında sıkışıp kalmıştır ve kendisini geçmişteki müttefiklerinin yardımından yoksun bulur. Teslimiyet kaçınılmaz görünse de, Estonya ulusu ya SSCB'nin kölesi olarak ya da ormanlardan savaşan bir yeraltı direnişi olarak varlığını sürdürebilir."
 EST_GATHERING_STORM_DESC:0 "Doğuda komünist, güneyde ise faşist bir tehdit varken, Konstantin Päts ve Isamaaliit Estonya'nın geleceğini güvence altına almak için ülkenin kontrolünü tamamen ele geçirmiştir. Estonya Bağımsızlık Savaşı gazilerinden oluşan bir grup, ülkenin kontrolünü tarafsız ellerden almaya çalışan sağcı popülistler olan Vaplar olarak bilinen bir hareket içinde örgütlenmiştir.\n\nEstonya'nın geleceği belirsizliğini korumaktadır. Päts barışı koruyup bir Sessizlik Çağı mı getirecek, yoksa Vaplar kontrolü ele geçirip yeni bir Estonya devleti mi kuracak?"
 ETH_GATHERING_STORM_DESC:0 "Etiyopya'nın yüzyıllar öncesine uzanan bir tarihi ve buna uygun bir imparatorluk hanedanı var. Haile Selassie imparatorluğu modernleştirmek için büyük adımlar atmış olsa da, Etiyopya'nın kendisini 40 yıl içinde ikinci kez İtalya'nın saldırısı altında bulmasıyla süreç kesintiye uğramıştır. Durum kasvetlidir, ancak imparatorluk bir araya gelirse işgalcileri bir kez daha durdurabilir. \n\nEtiyopya'nın özgür kalabilmesi için tüm Doğu-Afrika'nın Avrupa egemenliğinin boyunduruğundan sonsuza dek kurtulması gerekir."
 FIN_BLITZKRIEG_DESC:0 "Finlandiya, Sovyetler Birliği ile Nazi Almanyası arasında sıkışmış durumda ve iki güç arasındaki gerginlik artıyor. Sovyetler Birliği ile müzakereler bozuldu ve hükümet artık ülkelerinin egemenliğini nasıl koruyacağı konusunda zor kararlarla karşı karşıya.\n\nFinlandiya savunmasını güçlendirmek için çabalar sarf edildi ancak ordu hala yetersiz donanımlı ve hava kuvvetleri ile donanma neredeyse yok denecek kadar az. Buna rağmen Finlandiya'nın güçlü ulusal gurur ve askeri cesaret duygusu, ona bağımsızlığını koruma konusunda amansız bir kararlılık veriyor."
 FIN_GATHERING_STORM_DESC:0 "Finlandiya, 1917 yılında Rusya'dan bağımsızlığını kazanmış ve ardından kanlı bir iç savaş yaşamış genç bir ülke. Savaşın izleri hala taze ve ülkenin koalisyon hükümeti hala birlikte etkili bir şekilde çalışmakta zorlanıyor. Sovyetler Birliği, Finlandiya'nın Leningrad yakınlarındaki topraklarına göz dikmiş gibi görünüyor ve Finlandiya olası bir çatışmaya karşı hazırlıksız; ancak yine de uzun bir askeri cesaret ve kararlılık geçmişine sahip ve askerleri ülkelerine şiddetle bağlı. \n\nTansiyonun yükselmesi ve çatışma tehdidinin baş göstermesiyle Finlandiya'nın geleceği tehlikeye girer."
 FRA_BLITZKRIEG_DESC:0 "Büyük Savaş hala hafızalarda tazeyken, Almanya'nın barışı korumaya niyeti olmadığını göstermesinin ardından Fransa yeni bir çatışmayla karşı karşıya. Sınır savunmasını güçlendirmek ve müttefiklerini akıllıca seçmek Fransa'nın feci bir savaştan kaçınmasının yolu olabilir.\n\nFransa daha önce bir kez galip gelmişti, bu sefer de farklı olmayacak!"
 FRA_GATHERING_STORM_DESC:0 "Büyük Savaş'ın yarattığı yıkıma rağmen Fransa, güçlü ekonomisi sayesinde toparlanma yolundadır. Ancak, Buhran ülkeyi hala etkilemektedir ve yeni Alman rejimi Versay Antlaşması'nın öngördüğü savaş tazminatını ödemekle ilgilenmemektedir.\n\nAntlaşma imzalandığında, bir Fransız mareşali bunun barış değil, 20 yıllık bir ateşkes olduğunu söylemiştir. Bu 20 yıl şimdi hızla tükeniyor."
 GATHERING_STORM_DESC:0 "Karanlık zamanlar yaklaşıyor. Avrupa'da, Hitler gücünü pekiştirdi ve dikkatini artık Almanya'nın sınırlarının ötesine yönlendirmeye başladı. Mussolini'nin İtalya'sı cesur askeri maceralara devam ederken, Japon İmparatorluğu Asya'da Çin'e saldırmak için hazırlık yapıyor. Büyük Savaş'ın üzerinden neredeyse yirmi yıl geçti ve dünya bir kez daha benzinle ıslanmış durumda. Tek bir kıvılcım her şeyi ateşe verebilir."
 GATHERING_STORM_NAME:0 "Fırtına Toplanıyor"
 GER_BLITZKRIEG_DESC:0 "Renanya'nın yeniden askerileştirilmesinden sonra, Fransızlar ve İngilizler Almanya'nın niyetlerinden giderek daha fazla şüphelenmeye başladılar. Münih Anlaşması, Almanya'ya Alman halkı uğruna Sudetenland'ı ilhak etme izni verdi. Molotov-Ribbentrop paktı, Almanya ile Sovyetler Birliği arasında saldırmazlığı garanti altına alıyor, ancak aynı zamanda Polonya'nın iki ulus arasında bölünmesini de belirtiyor.\n\nAlmanya bu anı çok uzun süre bekledi. Harekete geçme zamanı şimdi!"
 GER_GATHERING_STORM_DESC:0 "Yeni bir Almanya doğdu. Weimar Cumhuriyeti'nin yıkılıp yerine Hitler'in Üçüncü Reich'ının kurulmasının üzerinden üç yıl geçmiştir. Büyük Buhran'ın zorlu yıllarından sonra ekonomik istikrar geri gelmiş ve kitlesel işsizlikle mücadele edilmiştir.\n\nVersailles Antlaşması'nın Almanya'ya getirdiği askeri kısıtlamalar çoktan unutulmuştur ve Wehrmacht her geçen gün daha da güçlenmektedir. Ufukta yeni bir Weltkrieg görünmektedir."
 GRE_BLITZKRIEG_DESC:0 "Diktatör Ioannis Metaxas'ın güçlü eli altında, Yunanistan'a istikrar geri getirildi. Dört Yıllık Plan, Yunanistan'ın endüstriyel tabanının son birkaç yılda muazzam bir şekilde büyümesini sağladı ve ülkenin borcu - hala aşırı derecede yüksek olsa da - bir şekilde yönetilebilir görünüyor.\n\nNe yazık ki, güçlü hükümet ve mantıklı ekonomik politika, bu tehlike altındaki ülkeye hiçbir fayda sağlamayabilir. Ufukta büyük ve korkunç bir savaş beliriyor ve Metaxas'ın Yunanistan'ın olası herhangi bir gelecekteki çatışma boyunca tarafsızlığını koruması gerektiği konusundaki kararlı ısrarına rağmen, karar nihayetinde onun vermeyeceği bir karar olabilir..."
 GRE_GATHERING_STORM_DESC:0 "Yunanistan krizde olan bir ulustur. Kraliyetçiler ve cumhuriyetçiler, 1935'te İkinci Helen Cumhuriyeti'nin kaldırılmasıyla sonuçlanan ulusun ruhu için ateşli bir mücadeleyi sürdürdüler. Otokratik bir yabancı olan kral, belirsiz bir geleceğe sahip, oldukça bölücü bir figür olmaya devam ediyor.\n\nKüçük iç siyasetle dikkati dağılmış, kötü niyetli ve intikamcı bir Bulgaristan'ın kuzeyde çürümesine izin verilirken, Yunanistan'ın uzun zamandır düşmanı ve yeni bulduğu müttefiki Türkiye doğuda siyasi bir başkalaşım geçiriyor ve Adriyatik'in diğer yakasındaki heyecan verici canavardan bahsetmiyoruz bile..."
 HITTING_FAN_DESC:0 "Evet, doğru! O şemsiye koleksiyonu gerçekten çok işe yarayacak."
 HITTING_FAN_NAME:0 "İşler Kızışmaya Başlıyor"
 HUN_BLITZKRIEG_DESC:0 "Avusturya-Macaristan İmparatorluğu'nun son yarısı olan Macaristan, Büyük Savaş'tan sonra muzaffer İtilaf tarafından mağlup edilmiş bir düşman olarak muamele gördü. Trianon Antlaşması'nda ülke topraklarının neredeyse üçte ikisini kaybetti. Milyonlarca etnik Macar kendilerini sınırlarının dışında yaşarken buldu ve ekonomisi harabeye döndü. Yeniden silahlanmaya yönelik sert kısıtlamaların Macaristan'ın bir daha asla Avrupa'daki barışı tehdit edemeyeceğini garantilemesi gerekiyordu.\n\nAncak Avrupa'daki siyasi iklim değişirken, geçmişin yanlışlarını düzeltme ve ulusun eski ihtişamını yeniden kazanma zamanı gelmiş olabilir."
 HUN_GATHERING_STORM_DESC:0 "Avusturya-Macaristan İmparatorluğu'nun son yarısı olan Macaristan, Büyük Savaş'tan sonra muzaffer İtilaf tarafından mağlup edilmiş bir düşman olarak muamele gördü. Trianon Antlaşması'nda ülke topraklarının neredeyse üçte ikisini kaybetti. Milyonlarca etnik Macar kendilerini sınırlarının dışında yaşarken buldu ve ekonomisi harabeye döndü. Yeniden silahlanmaya yönelik sert kısıtlamaların Macaristan'ın bir daha asla Avrupa'daki barışı tehdit edemeyeceğini garantilemesi gerekiyordu.\n\nAncak Avrupa'daki siyasi iklim değişirken, geçmişin yanlışlarını düzeltme ve ulusun eski ihtişamını yeniden kazanma zamanı gelmiş olabilir."
 ICE_BLITZKRIEG_DESC:0 "Almanya'nın son talepleriyle birlikte, Avrupa'daki durumun sürdürülemez olduğu ve Danimarka'ya bir saldırının kaçınılmaz olduğu her geçen gün daha da netleşiyor.\n\nBunu akılda tutarak, İzlanda'nın geleceği tehlikede ve yakında başlayacak olan çatışmanın dışında kalmak istiyorsa muhtemelen Amerikalılar tarafından korunmaya ihtiyacı olacak."
 ICE_GATHERING_STORM_DESC:0 "İzlanda'nın uzun bir izolasyon ve keşif geçmişi vardır. Norveç 1814'te İsveç'in küçük ortağı olduğunda eski sahibi Norveç ile şu anki hükümdarı Danimarka arasında el değiştirmiş ve 1919'da kendi kendini yönetme hakkını elde etmiştir.\n\nBüyük Buhran İzlanda'yı vurduğunda durum kasvetli görünüyor ve ufukta çatışma belirirken, gemiyi terk edip Danimarkalılarla bağları bir kez ve sonsuza dek koparma zamanı gelmiş olabilir."
 INS_BLITZKRIEG_DESC:0 "Üç yıl önce Soetardjo ve beraberindeki dilekçe sahipleri, Lahey'den on yıl içerisinde kendi kendini yönetme üzerine bir konferans düzenlenmesini talep etmişlerdi. Geçtiğimiz Kasım ayında kraliyet kararnamesi ulaştı. Cevap hayırdı.\n\nBu reddediliş, yıllarca süren çalkantıların yapamadığını yaptı. Mayıs ayında en büyük sekiz milliyetçi örgüt aralarındaki çekişmeleri bir kenara bıraktı ve tek bir federasyon olarak birleşerek tek bir sesle Endonezya parlamentosu çağrısında bulundu. Sömürge yönetimi ise her zamanki gibi cevap veriyor, ancak Japonya Çin üzerinden daha da güneye ilerliyor ve Doğu Hint Adaları Lahey'e oldukça uzak."
 INS_GATHERING_STORM_DESC:0 "Üç yüzyılı aşkın bir süredir Hollanda Doğu Hint Adaları, Hollanda sömürge imparatorluğunun en değerli incisi olmuştur. Adalardan, dillerden ve kültürlerden oluşan bu geniş takımadalar, onları yöneten sömürge yönetiminden başka hiçbir şeyle birbirine bağlı değildir.\n\nLahey'in hakimiyeti her geçen gün daha da belirsizleşiyor. Sömürüden bıkan halk, milliyetçi hareketlere giderek daha fazla kucak açıyor. Ancak bu hareketler birlik olmaktan çok uzak ve her birinin Endonezya için birbiriyle çelişen farklı vizyonları var. Anlaşmazlıklarını bir kenara bırakıp tek bir sesle konuşup konuşamayacakları, muhtemelen Doğu Hint Adaları'nın kaderini belirleyecektir."
 IRQ_BLITZKRIEG_DESC:0 "Irak son yıllarda giderek artan bir kargaşa döneminin içinde buldu kendini. Bakr Sidqi liderliğindeki 1936 darbesi, Haşimi monarşisinin kırılgan otoritesini paramparça etti ve siyasete askeri müdahale için tehlikeli bir emsal oluşturdu. Yüzeyin altında, merkezileşmeye direnen kabile liderleri, modernleşmeyi zorlayan reformcular ve yeni bulduğu güçle cesaretlenen huzursuz bir ordu arasında gerginlikler kaynıyor. Pan-Arap milliyetçiliği yükselişte, İngiliz etkisine meydan okuyor ve bölgesel birlik hayallerini besliyor. Dünya giderek daha istikrarsız hale gelirken, Irak bir kavşakta duruyor, geleceği belirsiz ve halkı bölünmüş durumda."
 IRQ_GATHERING_STORM_DESC:0 "Kral Faysal I ve daha sonra oğlu Kral Gazi'nin yönetimi altında Irak, İngiliz mandası olarak I. Dünya Savaşı'nın çalkantılı sonrasında yol alıyor. Haşimi monarşisi modernleşme ve milliyetçiliği dengelemeye çalışıyor, ancak yüzeyin altında hoşnutsuzluk kaynamaktadır. Aşiret liderleri merkezi otoriteye karşı çıkarken, kentsel seçkinler İngiliz etkisinden daha fazla bağımsızlık için çabalıyor. Pan-Arap duygular, Irak'ın çeşitli etnik ve dini kimlikleriyle çatışarak kırılgan bir birlik yaratıyor. Dünya başka bir büyük çatışmaya yaklaşırken, Irak konsolidasyon ve ayaklanma arasında sallanıyor, geleceği belirsiz ancak olasılıklarla dolu."
 ITA_BLITZKRIEG_DESC:0 "İtalya diktatörü Mussolini, bir yıl önce Münih anlaşmasındaki rolüyle bir barış koruyucusu olarak ün kazandı. Ancak, Alman topraklarının genişlemesi, İtalya'nın Almanlarla bir anlaşmaya varılabilirse talep edilebilecek daha fazla toprak olduğunu görmesini sağladı.\n\nArnavutluk, yalnızca İtalya'nın askeri yeteneklerinin bir tadı olarak fethedildi ve dünyanın geri kalanı endişelenmekte haklı."
 ITA_GATHERING_STORM_DESC:0 "Faşizmin yükselişiyle birlikte İtalya yeni ve görkemli bir döneme girmiştir. Güçleri şu anda Etiyopya'yı büyüyen İtalyan sömürge imparatorluğuna ekleme sürecindedir, ancak Mussolini'nin hırsları burada bitmiyor.\n\nAkdeniz'e hakim olmak her zaman İtalya'nın kaderi olmuştur ve Avrupa'da yeni bir düzen şekillenmektedir. Değişim dalgası geldiğinde, İtalya bu dalganın tepesinde bir yer bulmalı ya da sürüklenip gitme riskini göze almalıdır."
 JAP_BLITZKRIEG_DESC:0 "Güneydoğu'da savaş sürüyor. Japonya 1939'un başlarında bazı kayıplar vermiş olsa da, Çin topraklarının büyük bir kısmı Japonların kontrolü altında. Avrupa'da gerginlik artıyor ve Sovyetler Birliği dikkatini bu konulara odaklamış olsa da, Asya'daki savaşa karışmamalı.\n\nÇin'in kaynakları Japonların elinde olduğunda, Sovyetlerle başa çıkmak kolay olacak."
 JAP_GATHERING_STORM_DESC:0 "Japonya İmparatorluğu bir kavşakta duruyor. Kuzey Genişleme Doktrini Hokushin-ron, Ordu tarafından destekleniyor ve Sibirya'ya doğru ilerleme çağrısı yapıyor. Güney Genişleme Doktrini Nanshin-ron, Donanma tarafından destekleniyor ve Güneydoğu Asya ve Pasifik'teki zengin Avrupa kolonilerini hedef alıyor.\n\nVe sonra, elbette, her zaman Çin var. Japonya güçlü bir orduya sahip, ancak endüstrileri kaynak açlığı çekiyor ve zaman tükeniyor. Hangi yolu seçmeli?"
 LAT_BLITZKRIEG_DESC:0 "Letonya'nın Sovyet ticaretine aşırı bağımlılığı sonunda diktatörlüğün yakasına yapıştı. Sovyetler Birliği ve Alman Reich dişlerini göstermiş ve Ulmanis'in ensesinde solumaktadır. Letonya'nın bağımsızlığı korunacaksa, diktatörlük sinmeyi ve Sovyetlerden merhamet dilenmeyi tercih etmezse, hızlı bir seferberlik gereklidir..."
 LAT_GATHERING_STORM_DESC:0 "Mayıs Darbesi'nin üzerinden iki yıl geçti ve Letonya hala belirsiz bir durumda. Bir zamanlar Letonya Başbakanı olarak görev yapan Kārlis Ulmanis şimdi kendisini diktatör olarak tanımlıyor ve demokratik destekçiler Letonya'nın özgürlüğüne yönelik bu saldırıya şiddetle karşı çıkıyor. Faşist Perkonkrust örgütü, liderleri Gustavs Celmiņš'in tutuklanmasıyla tedirgin olmuştur ve diktatörlük bu tehdidi hızla ortadan kaldırmazsa Letonya iç savaş riskiyle karşı karşıya kalacaktır.\n\nDoğu ve Batı'dan gelen tehditlerle Letonya kendini zafer ve yok oluş arasında bir bıçak sırtında yürürken bulur."
 LIT_BLITZKRIEG_DESC:0 "Sahne hazır. Antanas Smetona diktatörlüğü güvence altına almıştır ve Litvanya Cumhuriyeti'ni yeniden kurma hayalleri artık çok uzaktadır. Polonya'nın bölünmesinin ardından Vilnius'un Litvanya'ya geri verilmesi için Sovyetlerle bir anlaşma yapılmıştır, ancak Smetona, Stalin'e ve onun susamış savaş makinesine Litvanya'nın egemenliğine sonsuza dek saygı duyacakları konusunda ne kadar güvenebilir?"
 LIT_GATHERING_STORM_DESC:0 "Litvanya'yı yeni bir İngiliz Milletler Topluluğu'na dahil etmek isteyen bir Polonya, Litvanya'nın kendi kaderini tayin hakkını tanımayan Sovyetler ve Memel bölgesinde giderek büyüyen bir Nazi tehdidi varken, bağımsızlık savaşı gazilerinden biri Litvanya ulusunun istikrarını ve bağımsızlığını korumak için ayağa kalkar. Antanas Smetona, elindeki sınırlı kaynaklarla istikrarsız bir rejimin başında oturmaktadır; liderlerinin hapse atılmasıyla öfkelenen faşist Demir Kurt paramiliterleri kırsalda kol gezmektedir: Augustinas Voldemares. Ufukta savaş görünürken, Litvanya ne pahasına olursa olsun halkını savunmak zorundadır."
 MAN_BLITZKRIEG_DESC:0 "Altı yaşındayken Ejderha Tahtı'ndan indirilen son Çin İmparatoru Puyi, zamanını beklemektedir. Eski krallığı Çin İç Savaşı'nda parçalanırken, Puyi Japonya'da yeni müttefikler buldu.\n\nPuyi için 1932'de Mançukuo İmparatorluğu'nun kurulması, atalarının doğuştan gelen haklarını geri alma arayışının sadece ilk adımıydı. Şimdilik hükümdarlığını sürdürmek için Japon Ordusu'na bağımlıdır, ancak zamanla kölelik zincirlerinden kurtulma ve olmak için doğduğu kişi olma fırsatı ortaya çıkabilir..."
 MAN_GATHERING_STORM_DESC:0 "Altı yaşındayken Ejderha Tahtı'ndan indirilen son Çin İmparatoru Puyi, zamanını beklemektedir. Eski krallığı Çin İç Savaşı'nda parçalanırken, Puyi Japonya'da yeni müttefikler buldu.\n\nPuyi için 1932'de Mançukuo İmparatorluğu'nun kurulması, atalarının doğuştan gelen haklarını geri alma arayışının sadece ilk adımıydı. Şimdilik hükümdarlığını sürdürmek için Japon Ordusu'na bağımlıdır, ancak zamanla kölelik zincirlerinden kurtulma ve olmak için doğduğu kişi olma fırsatı ortaya çıkabilir..."
 MAN_TSR_BLITZKRIEG_DESC:0 "Bir zamanlar Japon ordusu tarafından Kuzey Çin'den koparılan ve İmparator olarak Puyi'yi destekleyerek herhangi bir meşruiyet kırıntısına tutunan bir artık devlet olan Mançukuo, artık Büyük Doğu Asya Ortak Refah Alanı'nın tam bir üyesi haline geldi. Şimdi soru, devletin Concordia Derneği'nin elinde mi kalacağı yoksa Puyi'nin eline mi düşeceği."
 MAN_TSR_GATHERING_STORM_DESC:0 "Mançurya İmparatorluğu sallantılı bir temel üzerinde duruyor. Japonların 1932'de Mançurya üzerindeki yönetimlerini meşrulaştırmanın bir yolu olarak kurulan bu devlet için, yeni devletlerinin imparatoru olarak Puyi'ye izin vermeyi seçtiler.\n\nŞimdi soru, Concordia Derneği ve Japon Ordusu ülkeyi yönetirken Puyi'nin gölgelerde kalmaya devam mı edeceği, yoksa gücünü geri almaya çalışıp, sırasıyla bu rolün peşinde olan bir grup hayduta tamamen kaybedip kaybetmeyeceği?"
 MEXICO_BLITZKRIEG_DESC:0 "Lázaro Cárdenas hükümeti, olumlu sosyal değişim için, şu anda Amerika'ya sürgün edilmiş olan selefi Başkan Plutarco Calles'ten daha büyük bir güç olduğunu göstermiştir. Ekonomik durumun istikrara kavuşması ve yabancı petrol şirketlerinin devletin vesayeti altına girmesiyle Meksika hükümeti dışa bakmaya başlayabilir. Amerika birçok cephede düşmanlarla karşı karşıyadır ve Standard Oil'in millileştirilmesini muhtemelen affedecektir, ancak bu düşmanlarla dost olmak daha da kârlı olabilir..."
 MEXICO_GATHERING_STORM_DESC:0 "Meksika, tiran Porfirio Díaz'ın devrilmesinden sonra yirmi yıl süren iç savaşlarla karşı karşıya kaldı. Merkeziyetçiler bölgecilerle savaştı, köylüler ve sosyalistler çiftlik ağalarına karşı ayaklandı ve devletin din karşısındaki rolüne ilişkin savaşlar Aydınlanma'nın yıllıklarından çıkıp Meksika'yı terörize etti.\n\nLaik hükümet bu savaşları kazandığı konusunda ısrar ediyor, ancak bir enkaz tahtında oturuyor. Meksika yeniden inşa edildikten sonra belki de farklı bir galip ortaya çıkacaktır."
 NETHERLANDS_BLITZKRIEG_DESC:0 "Almanya ve diğer Avrupalı büyük güçler arasında savaş kaçınılmaz görünüyor ve Hollanda tarafsızlığına bir kez daha inanmış olsa da, liderleri olası düşmanlıklara hazırlık için güney komşularıyla gizli kurmay planları yapmayı düşünüyor.\n\nOrdu seferber edildi ve ülkeyi egemenliğine yönelik herhangi bir ihlale karşı savunmaya mümkün olduğunca hazır hale getirmek amacıyla Hollanda savunma hatlarındaki çalışmalar hız kazanıyor. Bu başarısız olursa, her zaman koloniler vardır..."
 NETHERLANDS_GATHERING_STORM_DESC:0 "Hollanda hükümeti artan küresel gerilimleri endişeyle izlemektedir. Kötü giden bir ekonomi, güçlü bir pasifist hareket ve potansiyel müttefikleri uzaklaştıracak kadar kesin bir tarafsızlık inancı arasında, savunmalarını düzgün bir şekilde hazırlayamıyorlar.\n\nAynı zamanda, Hollanda'nın kıtaya açılan bir ticaret kapısı olarak önemi, hem İngilizlerin hem de Almanların diğerini engellemek için Hollanda'nın 'işbirliğini' arzuladığı ve reddedilmeyi düşmanlık nedeni olarak görebileceği anlamına geliyor. Belki de kolonilere çekilmek, böyle bir istilaya karşı koymanın tek olası yoludur..."
 NOR_BLITZKRIEG_DESC:0 "Üçüncü Reich'ın gücü ve büyüklüğü arttıkça, Norveç'teki faşist unsurlar, ülkenin kontrolünü ele geçirmek ve düşmanla işbirliği yapmak için olası bir Alman İstilası'ndan yararlanmaya hazır görünüyor.\n\nNazi Partisi'nin vicdansız bir uşağı olan Vidkun Quisling, kendisi ve partisi Nasjonal Samling için güç kazanmak için komplo kuruyor gibi görünüyor. Acilen hazırlıklara başlamanın ve Norveç'in içeride ve dışarıda gizlenen tehlikeleri savuşturmak için bir arada durmasının zamanı gelmiştir."
 NOR_GATHERING_STORM_DESC:0 "Norveç, 1905'te İsveç'ten bağımsızlığını kazandığından beri siyasi ayakları üzerinde durmak için mücadele etti ve ancak şimdi siyasi istikrar ve Zor Otuzlar'dan kurtulma belirtileri göstermeye başladı.\n\nŞimdi güneydeki komşuları çekişmeye başlarken savaş her zamankinden daha yakın görünüyor, Norveç kırılgan bağımsızlığını korumak için bir yol bulmalı, Nygaardsvold kabinesi Avrupa'nın büyük güçlerine mümkün olduğunca zararsız görünmek için tarafsızlık ve silahsızlanma üzerine bahis oynuyor, ancak bu yaklaşımın yararları görülmeye devam ediyor."
 NZL_BLITZKRIEG_DESC:0 "Güney Pasifik'teki bu küçük ulus Büyük Savaş'ta cesurca savaşmış, Gelibolu'daki ve batı cephesindeki kanlı çarpışmalarda yüksek kayıplar vermiştir. Savaşma yaşındaki erkeklerin neredeyse yarısı denizaşırı savaşlarda görev almış ve birçoğu geri dönmemişti.\n\nBüyük Savaş'ın sona ermesinden yaklaşık yirmi yıl sonra, Yeni Zelanda halkı dünya sahnesine endişeyle bakıyor, çünkü bu kez savaş tehdidi kendi evlerine daha da yaklaşıyor gibi görünüyor..."
 NZL_GATHERING_STORM_DESC:0 "Güney Pasifik'teki bu küçük ulus Büyük Savaş'ta cesurca savaşmış, Gelibolu'daki ve batı cephesindeki kanlı çarpışmalarda yüksek kayıplar vermiştir. Savaşma yaşındaki erkeklerin neredeyse yarısı denizaşırı savaşlarda görev almış ve birçoğu geri dönmemişti.\n\nBüyük Savaş'ın sona ermesinden yaklaşık yirmi yıl sonra, Yeni Zelanda halkı dünya sahnesine endişeyle bakıyor, çünkü bu kez savaş tehdidi kendi evlerine daha da yaklaşıyor gibi görünüyor..."
 OTHER_BLITZKRIEG_DESC:0 "Büyük ya da küçük dünya uluslarının hepsi nefeslerini tutup yeni bir küresel çatışmanın patlak vermesini beklemekten memnun değil. İç savaşın eşiğindeki büyük güçlerden Büyük Savaş'ın şekillendirdiği ve dönüştürdüğü pek çok ulusa kadar herkes, dünyanın geleceği üzerinde etkili olabilmek için zor kararlar almak ve ideallerle pragmatizm arasında denge kurmak zorunda kalacak."
 OTHER_GATHERING_STORM_DESC:0 "Büyük ya da küçük dünya uluslarının hepsi nefeslerini tutup yeni bir küresel çatışmanın patlak vermesini beklemekten memnun değil. İç savaşın eşiğindeki büyük güçlerden Büyük Savaş'ın şekillendirdiği ve dönüştürdüğü pek çok ulusa kadar herkes, dünyanın geleceği üzerinde etkili olabilmek için zor kararlar almak ve ideallerle pragmatizm arasında denge kurmak zorunda kalacak."
 PAR_BLITZKRIEG_DESC:0 "Feberista darbesinin Ayala ve liberal yandaşlarını başarılı bir şekilde görevden uzaklaştırmasının ardından pek çok kişi ülkenin yaşadığı sayısız aşağılanmanın intikamını alması ve Bolivya'ya tekrar saldırması için Rafael Franco'ya bel bağlıyor, ancak bu ihtimal giderek daha imkansız görünüyor.\n\nBazı subaylar, Mihver güçleriyle daha yakın ilişkiler kurmak isteğiyle faşist paramiliter örgüt Guión Rojo'nun yardımını kullanarak onu devirmek ve yerine Higinio Morinigo'yu getirmek için şimdiden planlar yapıyor."
 PAR_GATHERING_STORM_DESC:0 "Bolivya'ya karşı kanlı Chaco Savaşı'ndan henüz zaferle çıkmış olmasına rağmen ülke ekonomik olarak tükenmiş ve aşırı militarize olmuş durumda. Sağ kolu José Félix Estigarribia ile birlikte savaşın en başından beri çıkmasının sorumlusu olarak görülen ve halk tarafından pek sevilmeyen Ayala ise durumu kontrol edemiyor.\n\nRafael Franco'nun ve sosyalist Feberista hareketinin arkasında toplanan ordu hükümeti devirmeye hazırlanıyor gibi görünüyor ve savaşmadan geri adım atmayacakları ortada."
 PER_BLITZKRIEG_DESC:0 "İran, çalkantılı ve belirsiz bir geleceğin eşiğinde duruyor. Avrupa'da savaş başlarken, Rıza Şah Pehlevi, kendisini çatışmaya genel olarak dahil olmaya ilgi gösteren iki büyük oyuncu arasında sıkışmış halde bulduğu için endişeyle bakıyor.\n\nKaynaklar söz konusuysa İran'ın egemenliği sorgulanabilir ve Şah'ın hükümeti olası bir işgali püskürtmeye hazır olmalıdır. Soru şu: Zamanında harekete geçebilecekler mi?"
 PER_GATHERING_STORM_DESC:0 "Eskiden Pers İmparatorluğu olarak bilinen büyük İran ulusu, şimdi gürleyen devlerin arasında kalmış durumda. Tarafsız İran, Alman Reich'in yardımıyla hızla modernleşirken, eski müttefikleri Büyük Britanya ve Sovyetler Birliği şüpheyle izliyor. Rıza Şah Pehlevi, istila riski her ne kadar belirgin olsa da, bu iki ulusun İran egemenliğini ihlal etmesine izin vermeyi reddediyor.\n\nİran'ın tarafsızlığına saygı gösterilecek mi? Vatanımızı kötü niyetli işgalcilerden korumaya hazır mıyız? Her şey başarısız olursa, belki de geçmişimize bakıp eski Pers İmparatorluğu'nun ruhunu yeniden canlandırmanın zamanı gelmiştir..."
 PHI_BLITZKRIEG_DESC:0 "Amerika Birleşik Devletleri şimdiye kadar sözünü tuttu ve Filipinler'e bağımsızlık yolunda yardımcı oldu. \n\nBu arada, Çin ve Japonya arasında savaş patlak verdi ve ada ulusu, kuzey komşusunun emperyalist emellerine endişeyle bakıyor. \n\nAmerikan takviyeleri savunmayı güçlendirmek için gelmeye başladı, ancak yeterli olacak mı? Japonya şimdiden sudaki kan kokusunu aldı."
 PHI_GATHERING_STORM_DESC:0 "1935'te, Amerika Birleşik Devletleri on yıllık bir süre içinde bağımsızlığa barışçıl bir geçişi nihayet kabul etmişti. Filipinler sürecin henüz başında, ancak artık kendi kaderini giderek daha fazla kontrol ediyor. \n\nABD ile bağlarını sürdürecekler mi, yoksa özgürlüğe giden süreci hızlandırmak için yabancı desteği mi arayacaklar? Filipinler müreffeh bir geleceğe bakıyor, ancak bu acemi ulusun etrafında şimdiden köpekbalıkları mı dolaşıyor?"
 POL_BLITZKRIEG_DESC:0 "Polonya ulusunun üç imparatorluk arasında bölünmüş olduğu yüzyıllardan sonra, Polonya artık bir kez daha bağımsız duruyor. Ancak konumu hiç de kolay değil. \n\nDoğuda Sovyetler Birliği, Polonya-Sovyet savaşındaki aşağılayıcı yenilgiyi unutmadı. \n\nBatıda, Alman Führer Adolf Hitler daha fazla \"yaşam alanı\" arzusunu gizlemiyor ve artık Polonya kontrolü altındaki eski Alman bölgelerinin bunu başarmak için ilk adım olacağını söylüyor."
 POL_GATHERING_STORM_DESC:0 "Polonya ulusunun üç imparatorluk arasında bölünmüş olduğu yüzyıllardan sonra, Polonya artık bir kez daha bağımsız duruyor. Ancak konumu hiç de kolay değil. \n\nDoğuda Sovyetler Birliği, Polonya-Sovyet savaşındaki aşağılayıcı yenilgiyi unutmadı. \n\nBatıda, Alman Führer Adolf Hitler daha fazla \"yaşam alanı\" arzusunu gizlemiyor ve artık Polonya kontrolü altındaki eski Alman bölgelerinin bunu başarmak için ilk adım olacağını söylüyor."
 PORTUGAL_BLITZKRIEG_DESC:0 "Salazar'ın muhafazakar hükümeti Portekiz'in İspanya İç Savaşı sırasında tarafsız kalmasını sağlarken Milliyetçileri aktif olarak destekledi ve böylece Komünistlerin ve Anarşistlerin yenilmesini sağladı. \n\nİber Yarımadası nihayet istikrara kavuştuğuna göre, potansiyel müttefikler için yurtdışına bakmanın ve Portekiz'in kaçınılmaz görünen dünya çatışmasında oynayacağı rolü düşünmenin zamanı geldi."
 PORTUGAL_GATHERING_STORM_DESC:0 "Salazar'ın 1932'de iktidara gelmesinden bu yana Portekiz, Birinci Cumhuriyet'in istikrarsız döneminden yavaş yavaş uzaklaşmaktadır. Mali Özerklik ve büyük güçlerden Siyasi Bağımsızlık Estado Novo'nun kurulmasına yol açarak Portekiz sanayisinin gelişmesi ve ordunun modernleşmesi için temelleri attı. \n\nŞimdi, komşu İspanya'da siyasi ve sosyal istikrarsızlık artarken ve uluslararası gerginlikler umutsuzca kötüleşirken Portekiz ileriye dönük bir yol belirlemek zorundadır..."
 PRC_BLITZKRIEG_DESC:0 "Topyekûn bir Japon saldırısıyla karşı karşıya kalan Milliyetçiler ve Komünistler huzursuz bir ateşkes imzaladı. Her iki taraf da bu birleşik cephenin uzun ömürlü olamayacağının farkındadır. Yan'an'daki Komünist üs bölgesi artık Japonlara karşı savaşta ön cepheyi oluşturmaktadır.\n\nKomünistler hayatta kalmak istiyorlarsa kaynaklarını dikkatli bir şekilde değerlendirmelidir. Japonya'ya karşı savaşta verilecek herhangi bir kayıp, Milliyetçilere karşı savaş zamanı geldiğinde iki kat daha fazla hissedilecektir ve Çan Kay-Şek hükümetinin güvendiği şey de bu olabilir..."
 PRC_GATHERING_STORM_DESC:0 "Sadece iki yıl önce Çin Komünist Partisi tamamen yok edilmekle karşı karşıyaydı. Hayatta kalmak için Uzun Yürüyüş olarak bilinen destansı yolculuğa çıktı. Ordunun sadece bir kısmının yürüyüşün zorluklarından sağ çıkabildiği ve sanayinin çok az olduğu Çin İç Savaşı'nda zafer ihtimali gerçekten de zayıftır.\n\nAncak zaman içinde halk Komünist davaya çekilebilir, yeni ordular kurulabilir, yeni üs bölgeleri oluşturulabilir ve doğru zaman geldiğinde devrimci mücadele nihai zafere ulaşılana kadar yeniden canlandırılabilir."
 RAJ_BLITZKRIEG_DESC:0 "Britanya İmparatorluğu'nun baş tacı Hindistan Raj'ı, emperyal güç ile emperyal güçsüzlüğün tuhaf bir bileşimidir. İngiliz memurlardan oluşan küçük bir elit, yüz milyonlarca tebaayla dolu geniş bir alt kıtayı yönetmektedir. Onların saflarından Büyük Savaş'ta cesurca savaşan Hint Ordusu yetişir.\n\nHintli liderler, son savaşta yapılan fedakârlıkların Hindistan'ın Britanya'dan bağımsızlığını kazanmasına yardımcı olacağını umuyordu, ancak şimdiye kadar bu umut hayal kırıklığına uğradı. Yeni bir savaş yaklaşırken, pek çok kişi ne pahasına olursa olsun bu özgürlüğü elde etmenin zamanının geldiğine inanıyor."
 RAJ_GATHERING_STORM_DESC:0 "Britanya İmparatorluğu'nun baş tacı Hindistan Raj'ı, emperyal güç ile emperyal güçsüzlüğün tuhaf bir bileşimidir. İngiliz memurlardan oluşan küçük bir elit, yüz milyonlarca tebaayla dolu geniş bir alt kıtayı yönetmektedir. Onların saflarından Büyük Savaş'ta cesurca savaşan Hint Ordusu yetişir.\n\nHintli liderler, son savaşta yapılan fedakârlıkların Hindistan'ın Britanya'dan bağımsızlığını kazanmasına yardımcı olacağını umuyordu, ancak şimdiye kadar bu umut hayal kırıklığına uğradı. Yeni bir savaş yaklaşırken, pek çok kişi ne pahasına olursa olsun bu özgürlüğü elde etmenin zamanının geldiğine inanıyor."
 ROM_BLITZKRIEG_DESC:0 "Romanya kendisini Büyük Savaş'ın kazanan tarafında buldu ve sonuç olarak yeni topraklar ve insanlar kazandı - bunların hepsi Romen değildi. Topraklarını terk etmek zorunda kalan ülkelerin rövanşist arzularına karşı Romanya, Balkanlar genelinde bir ittifaklar ağı oluşturdu. Ancak son yıllarda ülke daha çok iç meselelerle ilgilenmeye başladı ve Kral Carol II hükümeti bu ittifakların sona ermesine izin verdi. \n\nAvrupa'daki siyasi durum değiştikçe Romanya kendini yalnız ve savunmasız bulabilir."
 ROM_GATHERING_STORM_DESC:0 "Romanya kendisini Büyük Savaş'ın kazanan tarafında buldu ve sonuç olarak yeni topraklar ve insanlar kazandı - bunların hepsi Romen değildi. Topraklarını terk etmek zorunda kalan ülkelerin rövanşist arzularına karşı korunmak için Romanya, Balkanlar'ın dört bir yanında bir ittifaklar ağı oluşturdu. Ancak son yıllarda ülke daha çok iç meselelerle ilgilenmeye başladı ve Kral Carol II hükümeti bu ittifakların sona ermesine izin verdi. \n\nAvrupa'daki siyasi durum değiştikçe Romanya kendini yalnız ve savunmasız bulabilir."
 SAF_BLITZKRIEG_DESC:0 "Büyük Savaş başladığında, Güney Afrika'daki birçok kişi İngiliz efendileri için silaha sarılmayı reddetti. Güney Afrika ordusu, Büyük Savaş'ın çoğunu Afrika kolonilerindeki Alman güçlerini kovalayarak geçirdi ve sınırlı bir başarı elde etti.\n\nŞimdi ufukta yeni bir savaş belirdi. O zamanlar olduğu gibi şimdi de, Güney Afrika'da ülkenin Almanlara karşı hiç savaşmaması gerektiğini düşünenler var. Hatta bazıları, Boerlerin torunlarının atalarına reddedilen özgürlük için mücadele etme zamanının geldiğine inanıyor."
 SAF_GATHERING_STORM_DESC:0 "Büyük Savaş başladığında, Güney Afrika'daki birçok kişi İngiliz efendileri için silaha sarılmayı reddetti. Güney Afrika ordusu, Büyük Savaş'ın çoğunu Afrika kolonilerindeki Alman güçlerini kovalayarak geçirdi ve sınırlı bir başarı elde etti.\n\nŞimdi ufukta yeni bir savaş belirdi. O zamanlar olduğu gibi şimdi de, Güney Afrika'da ülkenin Almanlara karşı hiç savaşmaması gerektiğini düşünenler var. Hatta bazıları, Boerlerin torunlarının atalarına reddedilen özgürlük için mücadele etme zamanının geldiğine inanıyor."
 SIA_BLITZKRIEG_DESC:0 "Başbakan Phibunsongkhram 1938'in sonlarında iktidara geldiğinden beri Siyam'ı kendi inançlarına göre yeniden şekillendirdi. Ülkenin yeni bir adı var - Tayland - ve yeni bir doktrini: askeri disiplin, Pan-Tay milliyetçiliği ve hala Fransız ile İngiliz sömürge yönetimi altında yaşayan Tayca konuşan halklara yönelik bölgesel hedefler.\n\nAvrupa savaşa doğru sürüklenirken ve Japonya Çin'in içlerine doğru ilerlerken, Phibun'un ordusu her geçen gün daha da güçleniyor. Hırsları sır değil. Geriye kalan tek soru, zamanı geldiğinde Tayland'ın kimin yanında saf tutacağıdır."
 SIA_GATHERING_STORM_DESC:0 "Khana Ratsadon'un yüzyıllardır süren mutlak monarşiye son vermesinin üzerinden henüz dört yıl geçti. Siyam anayasal bir devlet olarak ilk adımlarını atıyor, ancak birlik şimdiden yıpranmaya başladı: sivil reformcular demokrasi hayalleri kurarken ordu güç, disiplin ve Pan-Tay genişlemesi talep ediyor.\n\nİngiliz ve Fransız sömürge güçleri tarafından etrafı sarılmış olan ve cesaretlenmiş bir Japonya'nın kuzeye doğru ilerlediği Siyam rotasını dikkatlice belirlemelidir. Yaklaşan fırtına, bu genç ulusu bir taraf seçmeye veya tarafsız kalarak hayatta kalmanın bir yolunu bulmaya zorlayabilir."
 SOV_BLITZKRIEG_DESC:0 "İspanya İç Savaşı sırasında Manuel Azaña'yı ve 'İkinci İspanya Cumhuriyeti'ni desteklemesi, Sovyetler Birliği'nin İtalya ve Almanya'ya göre nerede durduğunu açıkça göstermiştir. Yakın geçmişteki birkaç sınır çatışmasında Japon ordusuna karşı zafer kazanan Sovyetler Birliği, şu anda herhangi bir ülkenin karşı koyamayacağı kadar büyük bir güç gibi görünmektedir. \n\nAlmanya'nın Baltık Devletleri ve Polonya'yı bölme sözü vermesi şu anda memnuniyetle karşılanmaktadır."
 SOV_GATHERING_STORM_DESC:0 "Rus İç Savaşı'ndan sonra toz duman yatıştığında, SSCB bir zamanlar Rus İmparatorluğu'nu oluşturan şeylerin çoğunun tartışmasız hükümdarı olarak ortaya çıktı. Hızlı sanayileşme ve kolektifleştirme bunu izledi, çoğu zaman insan hayatlarında büyük bir maliyetle.\n\nSovyetler Birliği şimdi batıda yeniden canlanan bir Almanya ve doğuda savaşçı bir Japonya tehdidiyle karşı karşıya. Elbette, Komünist Parti saflarında da başa çıkılması gereken iç tehditler var..."
 SPAIN_BLITZKRIEG_DESC:0 "Son üç yıldır ülkeyi harap eden iç savaş nihayet sona erdi. Franco'nun rehberliğinde, galipler şimdi İspanya'nın toparlanmasını, kalan direniş ceplerinin ortadan kaldırılmasını ve savaşın yarattığı bölünmelerin onarılmasını sağlamalıdır.\n\nAncak zaman sınırsız değildir, çünkü tüm dünya şüphesiz çok daha büyük ve çok daha kanlı bir savaşa doğru amansız yürüyüşünü sürdürmektedir. İspanya, yaklaşmakta olan bu çatışmanın sunduğu fırsatların meyvelerini toplamak bir yana, ayakta kalmak istiyorsa, sanayisini ve ordusunu gecikmeden hazırlamalıdır."
 SPAIN_GATHERING_STORM_DESC:0 "Çiçeği burnunda İkinci İspanya Cumhuriyeti, varlığının ilk beş yılında grevler, bir askeri darbe girişimi ve büyük bir devrimci ayaklanmayla uğraşmak zorunda kalmıştır. Bu zorlukları atlatmış olsa da, İspanyol toplumu anarşistler, komünistler ve falanjistler arasındaki siyasi kutuplaşma ve şiddetle gölgelenmeye devam ediyor.\n\nHer iki taraf da yaklaşan 1936 genel seçimlerine umutlu gözlerle bakıyor, ancak her iki tarafın da zaferinin istikrara dönüş getirmesi pek olası değil. Şiddet devam ederken ordu beklemekte ve planlar yapmaktadır..."
 SWE_BLITZKRIEG_DESC:0 "Almanya komşularının sınırlarını aşındırdıkça, başka bir Büyük Savaş'ın homurtuları her geçen gün daha da yükseliyor. Militarist güç İsveç demir cevherine bağımlı olduğundan, toprak hırslarının yakında Baltık'ın ötesine ve İskandinavya'ya yayılabileceğine dair korkular artıyor.\n\nBöyle bir tehdit beklentisiyle, İsveç ordusu ülkenin gelişen savunma sanayisi sayesinde yeniden silahlanmaya ve modernleşmeye başladı. Geriye sadece ülkenin bir işgali caydırma yeteneğine sahip olup olmadığı kalıyor."
 SWE_GATHERING_STORM_DESC:0 "Büyük Savaş'ta tarafsız kalmasına rağmen İsveç, İngilizlerin Almanya'yı abluka altına alma girişimleri nedeniyle büyük zorluklar yaşadı. Kıtada gerginlikler artarken, İsveç halkı bir kez daha büyük güçlerin elinde acı çekmeye zorlanacağından endişe ediyor.\n\nBu arada Sosyal Demokratlar, kuşatılmış nüfusu destekleyebilecek bir refah devleti yaratmak ile ulusun tarafsızlığa olan yüzyıllık bağlılığını sürdürmek için güvenilir bir askeri caydırıcılık yaratmak arasında bir denge bulmaya çalışıyor."
 SWI_BLITZKRIEG_DESC:0 "İsviçre, Anschluss'tan önce de gergin bir durumdaydı, ancak şimdi Alman Reich diğer Almanca konuşulan bölgelere kolayca yayılmanın tadına vardığına göre, bu barışçıl Alp ülkesinin sırada olması gerçek bir tehlike. Şimdi İsviçre'nin mutlak tarafsızlığı her zamankinden daha fazla sınanacak ve her şey ters giderse, belki de savunması bile."
 SWI_GATHERING_STORM_DESC:0 "İsviçre, Avrupa ulusları arasında benzersizdir. Karşılıklı saygı ve destek ilkeleri üzerine kurulmuş çok kültürlü ve merkezi olmayan bir ulus olarak ayakta duruyor.\n\nSadık bir şekilde koruduğu tarafsızlığı Büyük Savaş'tan sağ çıktı ve savaşın dehşetini uzaktan gördükten sonra kendini savunması gerektiğine her zamankinden daha fazla ikna oldu. Savaşın gölgesi yaklaştıkça, bu barışçıl ulus tarafsız kalıp Silahlı Tarafsızlık yoluyla işgalcileri caydırmak, komşularından biriyle gönülsüz bir ittifak kurmak ya da düşmanlarını onlar araya girmeye cesaret edemeden proaktif bir şekilde yenmek arasında seçim yapmak zorundadır."
 TUR_BLITZKRIEG_DESC:0 "Türklerin Atası Mustafa Kemal Atatürk vefat etti. Türkiye artık değerli devlet adamı İsmet İnönü'nün önderliğinde yasta bir millettir. İnönü, yol gösterici ışığının ölümüyle bölünmüşlüğü daha da belirginleşen parçalanmış bir ülkeyi miras alıyor. \n\nİç kaygılar bir yana, İnönü aynı zamanda Avrupa'da, yıkım açısından Büyük Savaş'ı bile geride bırakacak bir savaş ihtimaliyle karşı karşıya. Atatürk sık sık \"Yurtta Sulh, Cihanda Sulh\" mantrasını lanse ederdi. İnönü bu çalkantılı dönemde barışı korumayı umut edebilir mi?"
 TUR_GATHERING_STORM_DESC:0 "Osmanlı İmparatorluğu'nun küllerinden, Türkiye Cumhuriyeti doğdu. Türk bağımsızlığı, 1923 Milli Mücadele'siyle kan ve kurşunla kazanıldı ve bu mücadele doğruydu ancak bedeli Türk halkı üzerinde hala ağır bir şekilde hissedilmektedir.\n\nDindar muhafazakârlar, iç bölgelerde ulusal modernleşme çabalarına karşı en güçlü şekilde direnirken, Kürt milliyetçileri ülkenin doğusunda kargaşa yaratmaktadır. Kahramanlaştırılmış başkan Mustafa Kemal Atatürk, ülkeyi birleştirmek zorundadır ya da bu görevi yerine getirebilecek bir lidere bayrağı devretmelidir, çünkü Avrupa'da huzursuzluk başlamak üzeredir..."
 URG_BLITZKRIEG_DESC:0 "Eski diktatör Gabriel Terra kısa bir süre önce yetkilerini yine Colorado Partisi üyesi olan kayınbiraderi Alfredo Baldomir'e devretti. Daha liberal ve Müttefik yanlısı bir çizgide olmasıyla, görünüşe göre ulus uluslararası hukuku ve düzeni korumada büyük güçlere yardımcı olarak bir kez daha liberal demokrasi yolundan yürümeye yazgılıdır."
 URG_GATHERING_STORM_DESC:0 "1933 Uruguay Darbesi olarak bilinen bir hamleyle Devlet Başkanı Gabriel Terra kendi hükümetine darbe yaparak parlamentoyu feshetti, anayasal denetim mekanizmalarını zayıflattı ve giderek daha otoriter bir şekilde ülkeyi yönetmeye başladı. Bu noktaya kadar Uruguay, José Batlle y Ordóñez yönetiminde Batllismo adı verilen liberal bir doktrin altında Latin Amerika'nın en ilerici demokrasilerinden biri olmuştu.\n\nDış borçlar siyasi gidişata yardımcı olmadı ve Uruguay Doğu Cumhuriyeti şimdi kendisini sonsuza dek süremeyecek bir diktatörlüğün ortasında buluyor."
 USA_BLITZKRIEG_DESC:0 "Avrupa'da yükselen tansiyon endişe verici. Henüz Amerika Birleşik Devletleri için gerçek bir endişe kaynağı olmasa da, Almanya'nın gösterdiği saldırganlık yakında tüm dünyada duyulabilir. Batı'da işler oldukça barışçıl olsa da, her şey düşünüldüğünde askeri hazırlıklar kötü bir fikir olmayabilir. \n\nBirleşik Devletler başka bir savaşın içine çekilirse, bunu sona erdirecek olanlar onlar olacaktır."
 USA_GATHERING_STORM_DESC:0 "Amerika Birleşik Devletleri son savaşın sonunda izolasyona geri çekildi ve Kükreyen Yirmiler boyunca ekonomik refah döneminin tadını çıkardı. Bu dönem, ülkenin Büyük Buhran'ın pençesine düşmesiyle dramatik bir şekilde sona erdi.\n\nAmerika'nın dış savaşlara müdahil olmama politikası sağlamlığını korusa da hem Avrupa'da hem de Asya'da tansiyon yükseliyor. 'Büyük Tarafsız' istese de istemese de kendini bu girdabın içinde bulabilir."
 WARLORDS_BLITZKRIEG_DESC:0 "Japonya ile savaş, Çinli savaş lordlarını bir taraf seçmeye zorladı, ancak bu ittifakın ödünç alınmış bir zamanda yaşadığına şüphe yok. Faydasını yitirdiği gün gelecek ve o gün oyun bir kez daha Çin'in Hükümdarı unvanı için oynayacak kadar hırslı ve acımasız her adama açık olacaktır."
 WARLORDS_GATHERING_STORM_DESC:0 "Merkez Hükümetin zayıflığı, yeterince hırslı bir adamın iktidara gelmesi için fırsat sağlayabilir. Ülkenin çevresinde, yerel liderler Merkez Hükümetin emirlerini pek umursamadan kendi küçük feodal bölgelerini oluşturdular.\n\nSavaş ufukta ve bu Savaş Ağalarının her biri zor bir seçimle karşı karşıya: Merkez Hükümetle işbirliği mi yoksa Komünistlerle ittifak mı? Her iki seçenek de masada bir yer için bir şans vaat ediyor, ancak üçüncü bir olasılık daha var - Çin'i tamamen kendi başlarına almak."
 YUG_BLITZKRIEG_DESC:0 "Yugoslavya, yeni Sırp, Hırvat ve Sloven Krallığı'nın 1922 yılında daha önce bağımsız olan Sırbistan Krallığı ile birleşmesinden sonra ortaya çıkmıştır. Başlangıçta Yugoslavya bağımsızlığını güvence altına almak için hem Küçük Antant'a hem de Balkan Paktı'na katıldı, ancak son zamanlarda milliyetçilerin artan iç baskısı ve İtalya ve Almanya'nın dış baskısı, siyasi ve stratejik konumlarının ciddi şekilde sarsılmasına ve yeniden değerlendirilmesine neden oldu."
 YUG_GATHERING_STORM_DESC:0 "Yugoslavya, yeni Sırp, Hırvat ve Sloven Devleti'nin 1922 yılında daha önce bağımsız olan Sırbistan Krallığı ile birleşmesinden sonra ortaya çıkmıştır. Başlangıçta Yugoslavya bağımsızlığını güvence altına almak için hem Küçük Antant'a hem de Balkan Paktı'na katıldı, ancak son zamanlarda Kral Alexander'ın öldürülmesi, milliyetçilerin artan iç baskısı ve İtalya ve Almanya'nın dış baskısı ile birleşince, siyasi ve stratejik konumlarında ciddi bir karışıklığa ve yeniden değerlendirmeye neden oldu."
