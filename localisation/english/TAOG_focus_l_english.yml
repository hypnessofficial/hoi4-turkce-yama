 idea_SIA_how_quickly_the_table_turns:0 "Tablolar ne kadar hızlı döndü"
 idea_SIA_increase_air_crews:0 "Artan Hava Mürettebatları"
 idea_SIA_increase_air_crews_desc:0 "Genişletilmiş yer ekipleri uçağımızın uçmasını sağlıyor. Daha yüksek hava yer mürettebatı insan gücü gereksinimi, ancak daha fazla uçak güvenilirliği ve zırhı."
