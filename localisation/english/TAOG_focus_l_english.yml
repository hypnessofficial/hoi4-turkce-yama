 INS_escalation_has_less_9_tt:0 "Tırmanış seviyesi §Y9§!'den düşük"
 INS_establish_nefis:0 "NEFIS'i Kur"
 INS_establish_nefis_desc:0 "Müttefiklerle birlikte, Avustralya'da konuşlandıracağımız Hollanda Doğu Hint Adaları Kuvvetleri İstihbarat Servisi'ni oluşturacağız. Bunun aracılığıyla Japon işgal güçlerini sabote etmek için gizli operasyonlar yürüteceğiz. Her küçük zaferle, anavatana dönüşümüze bir adım daha yaklaşıyoruz."
 INS_evacuate_soldiers_to_australia:0 "Askerleri Avustralya'ya Tahliye Et"
 INS_evacuate_soldiers_to_australia_desc:0 "Kuzey Avustralya'daki NEFIS üssünün yakınında bir askeri üs kuracağız. Orada, işgal sırasında yakalanmaktan kurtulan KNIL askerlerini konuşlandıracağız ve böylece savaşmaya devam etmemizi sağlayacağız."
 INS_exile_tt:0 "§Y[HOL.GetNameDefCap]§! §Y[INS.GetNameDef]§!'e yerleşmeye devam edebilecek."
 INS_expand_batavia_med_school:0 "Batavia Tıp Okulu'nu Genişlet"
 INS_expand_batavia_med_school_desc:0 "Batavia Tıp Okulu'nu yeni kampüs tesisleri inşa ederek ve daha fazla profesör işe alarak genişletmek, ileri eğitimi çok daha erişilebilir hale getirecek, bu da uzun vadeli ekonomik büyümemiz için hayati önem taşıyor."
 INS_expand_batavia_med_school_tt:0 "§Y$INS_dutch_east_indies$§!: Araştırma Hızı değiştiricisi en az §G%1.00§!."
 INS_expand_batavia_technical_institute:0 "Batavya Teknik Enstitüsünü Genişlet"
 INS_expand_batavia_technical_institute_desc:0 "Batavya Teknik Enstitüsü'nü genişletmek, daha fazla öğrencinin eğitim almasını sağlayacak ve teknolojik gelişim hızımızı artıracaktır."
 INS_expand_resistance_membership:0 "Direnç Üyeliğini Genişlet"
 INS_expand_resistance_membership_desc:0 "Tüm hareketimizi tek bir üste toplamak başarısızlığı garanti edecektir. Çeşitli bölgelerde popülaritemizi ve kontrolümüzü artıracak elçiler olarak milis gruplarına üyeler seçeceğiz."
 INS_expand_sea_routes:0 "Deniz Yollarını Genişlet"
 INS_expand_sea_routes_desc:0 "Ülkemiz doğal kaynaklar açısından zengin, ancak çıkarma endüstrimiz çok uzmanlaşmış ve krom ve tungsten gibi bazı nadir mineralleri çıkarmak için gerekli altyapımız yok. Askeri üretim yeteneklerimizi geliştirmek istiyorsak, onları başka yerlerden ithal etmemiz gerekecek. Büyüyen ticaret ağımızdan tam olarak yararlanmak için ticaret filomuzun kapasitesini artırmamız gerekecek."
 INS_expanding_the_union:0 "Birliği Genişletmek"
 INS_expanding_the_union_desc:0 "Kuzey Borneo halkı çok uzun süredir tiranlık altında yaşıyor. İngilizleri geri çekilmeye zorlamak, Brunei, Sabah ve Sarawak Raj'ın Endonezya'nın eyaletleri haline gelmesine izin vermek için gerilla savaşını kullanacağız."
 INS_expanding_the_union_tt:0 "§YSınırlı Savaş§! üzerinde henüz kontrol etmediğimiz eyaletler için §YBorneo§! başlatma kararlarının kilidini açar."
 INS_fair_election:0 "Adil Bir Seçim"
 INS_fair_election_desc:0 "Başkan görevden alındığına ve devrim sona erdiğine göre, nihayet herhangi bir otoriter etki olmaksızın ilk gerçekten adil seçimi yapabiliriz."
 INS_fate_of_de_javasche_bank:0 "[INS_fate_of_de_javasche_bank_scripted_name]"
 INS_fate_of_de_javasche_bank_desc:0 "[INS_fate_of_de_javasche_bank_scripted_desc]"
 INS_fate_of_de_javasche_bank_scripted_desc_colony:0 "Doğu Hint Adaları Guldeni, buhran vurduğundan beri serbest düşüşte ve De Javasche Bank düşüşü durduracak araçlara sahip değil. Yatırımcı güveninden geriye kalanlar tamamen buharlaşmadan önce para birimimizi nasıl stabilize edeceğimize karar vermeliyiz."
 INS_fate_of_de_javasche_bank_scripted_desc_independent:0 "Kriz içinde bir para birimi devraldık. Eski sömürge Guldeni zaten sarsılıyordu ve Rupiah'a geçiş piyasaları dengelemek için hiçbir şey yapmadı. Bank Indonesia'nın hükümetten net bir direktife ihtiyacı var, yoksa genç ekonomimiz bunun acısını çekecek."
 INS_fate_of_de_javasche_bank_scripted_name_colony:0 "De Javasche Bank'ın Kaderi"
 INS_fate_of_de_javasche_bank_scripted_name_independent:0 "Bank Indonesia'nın Kaderi"
 INS_federation_of_aslia:0 "Aslia Federasyonu"
 INS_federation_of_aslia_desc:0 "Kurtardığımız ulusların tek başına durmasına gerek yok. Tan Malaka her zaman bir cumhuriyetten daha büyük bir şey hayal etti. Anakara'dan Pasifik'e kadar, geri dönmeye cüret eden herhangi bir sömürgeci güce karşı birleşmiş bir federasyon. Onlara devletimizde tam üyelik teklif edeceğiz."
 INS_federation_of_aslia_trigger_tt:0 "§Y$form_maphilindo$§! kararını tamamladı."
 INS_finish_the_bauxite_project:0 "Bangka Projesini Bitir"
 INS_finish_the_bauxite_project_desc:0 "Bangka-Belitung genelinde yeni yollar, limanlar ve demiryolları faaliyete geçtiğinden, inceleme ekipleri tungsten ve krom yataklarının ilk beklentilerimizin ötesinde olduğunu bildiriyor. Bu adalar cumhuriyete tam değerlerini kanıtlayacak."
 INS_first_come_first_serve:0 "İlk Gelen İlk Alır"
 INS_first_come_first_serve_desc:0 "Büyük Buhran'ın korumacılığı yavaşlarken, artan üretim ve aşırı değerli bir gulden Hollanda ihracat pazarını paramparça etti, çünkü batıdaki eski ticaret ortaklarımız taleplerini karşılamak için Güney Amerika'ya yöneldi. Onların peşinden yeni ticaret anlaşmaları için koşmak yerine, bunu Asya'daki yeni pazarlara açılmak için bir fırsat olarak kullanabiliriz."
 INS_focus_time_reduce_fokker_tt:0 "§Y$INSHOL_east_indies_fokker_division$§!, bu milli hedef için gereken süreyi 35 gün azaltacak."
 INS_focus_time_reduce_jap_tt:0 "§Y$INS_first_come_first_serve$§!, bu milli hedef için gereken süreyi 70 gün azaltacak."
 INS_focus_time_reduce_pki_tt:0 "§Y$INS_utilize_tan_malakas_militia$§!, bu milli hedef için gereken süreyi 35 gün azaltacak."
 INS_focus_time_reduce_tjarda_tt:0 "§Y$INS_governor_general_tjarda$§!, bu milli hedef için gereken süreyi 35 gün azaltacak."
 INS_focus_time_reduce_usa_tt:0 "§Y$INS_realign_supply_chains$§!, bu milli hedef için gereken süreyi 70 gün azaltacak."
 INS_fra_treaty_fraside_tt:0 "Doğu Hint Adaları çatışmasında resmi olarak §Y[HOL.GetNameDefCap]§! ile hizalanacağız. Eğer §Y[HOL.GetNameDefCap]§! kazanırsa, kuzeydoğu Sumatra üzerinde hak sahibi olacağız."
 INS_fra_treaty_holside_tt:0 "§Y[FRA.GetNameDefCap]§! resmi olarak çatışmanın bizim tarafımızda olduğunu beyan edecek ve önemli ölçüde yardım sağlayacak. Savaş zaferle biterse, §Y[FRA.GetNameDefCap]§! kuzeydoğu Sumatra üzerinde hak sahibi olacak."
 INS_governor_general_de_jonge:0 "Genel Vali de Jonge"
 INS_governor_general_de_jonge_desc:0 "Bonifacius Cornelis de Jonge, demir yumrukla yönetmesiyle, her türlü milliyetçiliğe karşı çıkmasıyla ve genellikle Volksraad'ın isteklerini görmezden gelmesiyle tanınır. Adalar üzerindeki yönetimi uzun sürdü ve deneyimi, Adalar Savaş Bakanı olarak görev yaptığı büyük savaşa kadar uzanıyor."
 INS_governor_general_tjarda:0 "Genel Vali Tjarda"
 INS_governor_general_tjarda_desc:0 "Alidius Tjarda van Starkenborgh Stachouwer'in Adalar için selefinden biraz daha farklı bir vizyonu var. Milliyetçiliğe hala karşı çıksa da, biraz daha liberal politikaları var ve Volksraad'ın isteklerini dinlemeye daha istekli."
 INS_govt_relocated_tt:0 "§Y[HOL.GetNameDefCap]§! Hükümetini Cava'ya taşıyor."
 INS_greater_indonesia:0 "Büyük Endonezya'yı İlan Et"
 INS_greater_indonesia_desc:0 "Antik Nusantara imparatorluğu bir zamanlar Malay dünyasını tek bir varlık, tek bir halk olarak birleştirmişti. Malaya'yı sömürge zorbalığından kurtardığımıza göre, Nusantara'daki atalarımız gibi davranmalı ve tüm Malay dünyasını tek bir birleşik ulus olarak ilan etmeliyiz."
 INS_guerilla_industry:0 "Gerilla Endüstrisi"
 INS_guerilla_industry_desc:0 "Milislerimizi silahlandırmak için yeni silahlar üretmemize izin verecek fabrikaların kontrolünü ele geçirmek için takımadalar genelindeki gerilla kuvvetlerimizi kullanacağız."
 INS_guided_democracy:0 "Güdümlü Demokrasi"
 INS_guided_democracy_desc:0 "Demokrasi ideal olabilir, ancak gücü şimdi halka vermek sadece kaosla sonuçlanacaktır. Sukarno'yu demokratik parlamentoyu denetleyecek ve gerekirse müdahale edecek ömür boyu Başkan olarak yükselteceğiz."
 INS_guided_economy:0 "Güdümlü Ekonomi"
 INS_guided_economy_desc:0 "Kontrolü korumak için Endonezya ekonomisini doğrudan denetleyeceğiz. Tüm bankaları, petrol ve tarım sektörlerini millileştireceğiz."
 INS_has_gotten_invasion_event:0 "Endonezya işgal edildi"
 INS_hatta_focus_2:0 "Sonraki Adımlar"
 INS_hatta_focus_2_desc:0 "Devrim sona erdi ve belirli siyasi figürler devrimin devam etmesi gerektiğinde ısrar etseler de, bu sesler görmezden gelinmelidir. Bunun yerine ileriye bakmalıyız, Endonezya'yı inşa etmeliyiz ki gelecek nesiller refah içinde yaşasın."
 INS_hatta_princely_advisors:0 "Prenslik Devletlerini Entegre Et"
 INS_hatta_princely_advisors_desc:0 "Paylaşılan çeşitliliğimiz sayesinde birlik buluyoruz. Ulusumuzu bu ilkeye dayandırdık, ancak devrimin sona ermesi, ortak bir mücadelenin yokluğu nedeniyle fikri zorladı. Azınlık grupların küskünlüğünü ve ayaklanmalarını önlemek için, prenslik devletlerinden yerel yöneticilerin ulusal siyasette doğrudan söz sahibi oldukları ek bir konsey kurmalıyız."
 INS_increase_laskar_funding:0 "Laskar Finansmanını Artır"
 INS_increase_laskar_funding_desc:0 "Milislerimiz kuvvetlerimizin çoğunluğunu oluşturuyor. Bunu kabul etmeli ve [INS.GetLeader]'e tamamen sadık olmasalar bile onları buna göre fonlamalıyız."
 INS_increase_laskar_funding_tt:0 "Bir milis grubunun kabul edilen her talebi için 1 §YAskerî Fabrika§! §Wkazanılır§! (en fazla §G6§!)."
 INS_increased_trade_with_japan:0 "Japonya ile Artan Ticaret"
 INS_increased_trade_with_japan_desc:0 "[JAP.GetNameDefCap] giderek daha değerli bir ticaret ortağı oldu ve bizi yarı yolda bırakmadı. İki ulusumuz arasındaki ekonomik işbirliğini ilerletmek ve Büyük Buhran'ın kalıntılarından kurtulmamıza yardımcı olmak için yeni ticaret anlaşmaları müzakere etmeliyiz. Bu, Batı'daki müttefiklerimizi, özellikle Hollanda'yı rahatsız edebilir. Ancak, kendi kaderimizde söz sahibi olmak istiyorsak, kendi ticaret bağlarımızı güvence altına almamız gerekecek."
 INS_indonesian_assault_doctrine:0 "Endonezya Saldırı Doktrini"
 INS_indonesian_assault_doctrine_desc:0 "Askerler bir savaşın her şeyi değildir. Savaşacak silahları yoksa bir milyon adamın hiçbir anlamı yoktur. Düşman kontrolündeki topraklara daha derinlemesine itmek için yüksek kaliteli topçu elde etmeye öncelik vermeliyiz."
 INS_indonesian_inter_province_trade_agreement:0 "[ROOT.GetAdjective] İller Arası Ticaret Anlaşması"
 INS_indonesian_inter_province_trade_agreement_desc:0 "İller arası ticaretin hızlı ve ucuz olması gerekiyor. Ticaret vergilerini büyük ölçüde azaltarak ve iller arası yeni altyapı inşa ederek, neredeyse her zaman başka bir ülkeden ziyade başka bir ilden alım satımın tercih edilmesini sağlayacağız."
 INS_indonesian_inter_province_trade_agreement_tt:0 "Tüm §YEndonezya§! ülkeleri şunları kazanır:"
 INS_indonesian_naval_doctrine:0 "Endonezya Deniz Doktrini"
 INS_indonesian_naval_doctrine_desc:0 "Artık kendimize ait bir donanma inşa ettiğimize göre, savaşacağımız ve eğitim alacağımız doktrini dikkate almak önemlidir. Mümkün olan en kısa sürede bir Deniz Doktrini oluşturmaya ve benimsemeye öncelik vermeliyiz."
 INS_infiltrate_the_army:0 "Orduya Sız"
 INS_infiltrate_the_army_desc:0 "Üyelerimizin çoğu, düşük rütbeli askerlerden binbaşılara kadar KNIL'e kayıtlıdır. Mümkün olduğunca çok sır toplamalıyız, aynı zamanda kendi üyelerimizi yüksek pozisyonlara yükseltmeliyiz. Tetiği çektiğimizde, KNIL'de kaos yaratabiliriz."
 INS_infiltrate_the_media:0 "Medyaya Sız"
 INS_infiltrate_the_media_desc:0 "Hareketimiz Hint Adaları'ndaki medya kuruluşlarının birkaç üst düzey üyesinin üyeliğini sağladı. Bunu, vatandaşların zihnine ince bir şekilde devrim yanlısı duygular ekmek için kendi avantajımıza kullanabiliriz."
 INS_instigate_chaos_medan:0 "Medan'da Kaosu Kışkırt"
 INS_instigate_chaos_medan_desc:0 "Medan ve Riouw'daki yerel milliyetçilerle işbirliği yapacak, grevler, isyanlar düzenleyecek ve halkı radikalleştireceğiz."
 INS_instigate_chaos_medan_tt:0 "Bağımsızlığımızı ilan ettiğimizde, §Y[1049.GetName]§! üzerinde §Gçekirdek§! kazanacağız. Hollanda Doğu Hint Adaları tarafından çekirdeklenmemiş kalmaya devam edecek."
 INS_instigate_chaos_sulawesi:0 "Sulawesi'de Kaosu Kışkırt"
 INS_instigate_chaos_sulawesi_desc:0 "Sulawesi'deki yerel milliyetçilerle işbirliği yapacak, grevler, isyanlar düzenleyecek ve halkı radikalleştireceğiz."
 INS_instigate_chaos_sulawesi_tt:0 "Bağımsızlığımızı ilan ettiğimizde, §Y[673.GetName]§! ve §Y[1056.GetName]§! üzerinde §Gçekirdek§! kazanacağız. Hollanda Doğu Hint Adaları tarafından çekirdeklenmemiş kalmaya devam edecekler."
 INS_integrate_sarekat_islam:0 "Sarekat İslam'ı Entegre Et"
 INS_integrate_sarekat_islam_desc:0 "Büyük İslami siyasi partilerin çok fazla halk desteği var. Onları hükümete entegre etmek bizim çıkarımızadır."
 INS_invest_in_batavian_education:0 "Batavya Eğitimine Yatırımlar"
 INS_invest_in_batavian_education_desc:0 "Volksraad, Endonezya halkının isteğinin eğitimin daha erişilebilir hale gelmesi olduğunu açıkça belirtti, çünkü şu anda buna çoğunlukla Hollandalı Endonezyalılar ve eğitim masraflarını karşılayabilen küçük Endonezya elit grubu erişebiliyor. Volksraad önerisine uymak için Batavya ve çevresinde birkaç ilkokul ve ortaokul inşa etmeliyiz."
 INS_invest_in_batavian_education_req_2_tt:0 "En az §Y6§! Volksraad görevini başarıyla tamamladı"
 INS_invest_in_batavian_education_req_tt:0 "En az §Y3§! Volksraad görevini başarıyla tamamladı"
 INS_invite_foreign_companies:0 "Amerikan Petrol Girişimlerini Destekle"
 INS_invite_foreign_companies_desc:0 "1930'dan beri, Standard Oil California ülkemizde Hollanda iştiraki Nederlandsche Pacific Petroleum Maatschappij aracılığıyla faaliyet gösteriyor. Riouw'daki araştırmaları umut verici, upstream operasyonlarını her şekilde desteklemeliyiz - büyük bir keşif hem gelirimizi artıracak hem de diğer uluslararası şirketleri ülkemizde yatırım yapmaya teşvik edecektir."
 INS_is_noncore_but_indonesian_trigger_tt:0 "Çekirdeklenmiş bir Endonezya eyaletidir"
 INS_is_noncore_but_indonesian_trigger_tt_NOT:0 "Çekirdeklenmemiş bir Endonezya eyaletidir"
 INS_is_union_tt:0 "Hollanda-Endonezya Birliği'ni kurdu"
 INS_is_union_tt_NOT:0 "Hollanda-Endonezya Birliği'ni kurmadı"
 INS_japanese_army_training:0 "Orduyu Reforme Et"
 INS_japanese_army_training_desc:0 "[JAP.GetAdjective] efendilerimizden öğrenecek çok şeyimiz var ve artık KNIL dağıtıldığına göre, IJA tarafından öğretilen, Endonezya'yı dış tehditlerden korumaya hazır yeni bir ordu kurmalıyız."
 INS_japanese_export_contracts:0 "Hepsine Hükmedecek Tek Bir Ticaret Sözleşmesi"
 INS_japanese_export_contracts_desc:0 "[1049.GetName] ve [672.GetName]'deki tüm kauçuğu satarak [JAP.GetNameDef] ile büyük bir ticaret anlaşması yapacağız. Çok düşük bir maliyetle satacak olsak da, hepsinin satılacağının garantisini alacağız."
 INS_japanese_military_lessons:0 "Japon Askeri Dersleri"
 INS_japanese_military_lessons_desc:0 "Japonya'nın askeri doktrinlerini incelemeli ve kendi ordumuzu buna göre uyarlamalıyız."
 INS_japanese_resource_infrastructure:0 "Büyük Savaş Çabasını Fonla"
 INS_japanese_resource_infrastructure_desc:0 "Temel kaynak çıkarma altyapımızın kontrolünü [JAP.GetNameDef]'e vermek, savaşı kazanmaya yönelik gerekli bir adımdır, çünkü [JAP.GetAdjective] birimlerinin her zaman tam olarak tedarik edilmesi en büyük önceliğimizdir. [JAP.GetNameDefCap] ayrıca kaynak ihracatının verimliliğini artırmak için yerel altyapımızı geliştirecek."
 INS_javanese_education_investments:0 "Cava Eğitim Yatırımları"
 INS_javanese_education_investments_desc:0 "İlkokul ve ortaokul inşa etme projemize ek olarak, orta sınıf aileler için ileri eğitimi çok daha erişilebilir hale getirecek bir toplum koleji ve özel meslek okulları inşa edebiliriz."
 INS_just_a_fisherman:0 "Sadece Bir Balıkçı"
 INS_just_a_fisherman_desc:0 "Donanma olmadan takımadalarda savaşmak zor bir görev ve daha uzun süre sürdüremeyeceğimiz bir görev. Muhtemelen saf bir strateji deneyeceğiz, Hollanda kontrolündeki limanlara balıkçı kılığına girmiş balıkçı teknelerinde milisler göndereceğiz."
 INS_kalimantan_mic:0 "Kalimantan Askeri Endüstrisi"
 INS_kalimantan_mic_desc:0 "Kalimantan'daki altyapı geliştirme çabalarımız meyvelerini verdi. Elektrik ve iletişimin yayılması, bizi hükümetin çağrısının çok ötesindeki topluluklarla temasa geçirdi. Bu fırsatı, bölgede yeni fabrikalar inşa ederek ve buraları bu yeni iş gücü havuzuyla doldurarak artan askeri üretim ihtiyaçlarımızı karşılamak için kullanabiliriz."
 INS_land_reform:0 "Arazi Reformu"
 INS_land_reform_desc:0 "Hollanda, bağımsızlığımızı ilan etmeden önce büyük miktarda araziye doğrudan sahipti. Ekonomik büyümeyi teşvik etmek için bu araziyi düşük fiyatlarla kullanacak herhangi bir Endonezyalıya dağıtmalıyız."
 INS_laskar_rakjat:0 "Laskar Rakyat"
 INS_laskar_rakjat_desc:0 "Devrim, Endonezya genelinde bazıları büyük, bazıları küçük birçok çeşitli milisten oluşmaktadır. Milisleri örgütlemek zafere ulaşmak için gerekli bir adımdır. Ancak, siyasi rakiplerimizle bağları olan milisleri güçlendirmek felakete yol açabileceğinden çok aceleci olmamalıyız."
 INS_loans_timer:0 "\n§Y365§! gün içinde:"
 INS_loans_timer_2:0 "§WFaiz ödemesi için §Y2§! Sivil Fabrika §Rkaldırılacak§!§!."
 INS_local_autonomy:0 "Yerel Özerklik"
 INS_local_autonomy_desc:0 "Endonezya'yı çevreleyen birçok adanın farklı kültürleri, dilleri ve ihtiyaçları vardır. Tek bir hükümetin hepsini başarıyla denetleyebileceğini düşünmek mantıksızdır. Endonezya'yı, her eyaletin kendi üzerinde önemli derecede özerkliğe sahip olduğu bir Federasyona dönüştürmeye başlayacağız."
 INS_local_autonomy_industry_tt:0 "§Y1§! Sivil Fabrika §R§Y[1051.GetName]§!'den §! çıkarıldı, §Y[335.GetName]§! ve §Y[1058.GetName]§!.\n§Y1§! Sivil Fabrika §G§!'yi §Y4 rastgele sahip olunan eyaletlere§! ekledi."
 INS_local_autonomy_tt:0 "Endonezya prensliklerinde §Y$INS_local_autonomy_occupation_law$§! işgal yasasının kilidini açar.\nEtkileri:\n     Her alanda §Yküçük§! artışlar sağlar\n     §GUyumluluk büyümesini artırır§!"
 INS_local_cooperatives:0 "Yerel Kooperatifler Kur"
 INS_local_cooperatives_desc:0 "Batı'daki gibi kapitalist bir sistem yaratmamalıyız, ancak özelleştirmenin sağladığı ekonomik faydayı göz ardı etmemeliyiz. Başarıları sahiplerine zenginlik kazandıracak yerel kooperatiflerin kurulmasına izin vereceğiz. Ancak, hükümet tarafından denetlenecekler ve yerelliklerinin dışına genişlemeleri yasaklanacaktır."
 INS_local_resistance:0 "Yerel Direniş"
 INS_local_resistance_desc:0 "Henüz işgal edilmemiş topraklarda direniş hücreleri kuracağız, böylece işgal edilirse zamanı geldiğinde geri almak için hazırlıklı olacağız."
 INS_local_unity:0 "Kısmi Prenslik Özerkliği"
 INS_local_unity_desc:0 "Zaten telaşlı olan bu zamanlarda iç çatışmayı azaltmak için geçici bir önlem olarak Prenslik Devletlerine kısmi özerklik vereceğiz."
 INS_loot_knil_weapons_caches:0 "KNIL Silah Depolarını Yağmala"
 INS_loot_knil_weapons_caches_desc:0 "KNIL'in devrimden önce depoladığı çok sayıda silah deposu var. Üyelerimizin çoğu KNIL'in eski üyeleridir ve bu depoları bulup yağmalayabiliriz."
 INS_militia_tt:0 "Yeni bir §YÖzgürlük Savaşçısı§! milis tümeni şablonu oluşturur ve onları yönetmek için kararları açar."
 INS_militia_warning_tt:0 "Milisler, özgürlük savaşçılarının §Yyarı özerk§! gruplarıdır. Bizim için savaşacaklar, ancak yardımları ücretsiz değil. Çabaları için tazminat almayı bekleyecekler. §RTalepler karşılanmazsa İstikrar ciddi şekilde etkilenecek!§!"
 INS_minimum_program:0 "Asgari Program"
 INS_minimum_program_desc:0 "Persatuan Perjuangan taleplerini ortaya koydu: bir halk hükümeti, bir halk ordusu ve tüm yabancı mülkiyetindeki plantasyonların ve endüstrinin millileştirilmesi. Bu programı ileriye taşıyacak yetenekli adamlara ihtiyacımız var. Njono işçiler için, Setyadjit ise parti entelektüelleri için konuşuyor. Birlikte, devrimin fabrika katından hükümet salonlarına kadar organize edilmesini sağlayacaklar."
 INS_mixed_economy_system:0 "Karma Ekonomi Sistemi"
 INS_mixed_economy_system_desc:0 "Endonezya benzersiz bir ülkedir ve geleneksel Kapitalizm veya Komünizm altında gelişmeyecektir. Hem kapitalizmin hem de komünizmin unsurlarını içeren bir karma ekonomi sistemi kurmalıyız."
 INS_mobilize_the_pemuda:0 "Pemuda'yı Seferber Et"
 INS_mobilize_the_pemuda_desc:0 "Artık en büyük Pemuda gruplarının güvenini başarıyla kazandığımıza göre, onları TKR içinde seferber etme planlarına başlamalıyız."
 INS_more_market_resources:0 "Büyük Buhran'ı Geride Bırak"
 INS_more_market_resources_desc:0 "Dünya ekonomik krizin içine batmış olabilir, ancak kriz, onu ele geçirecek kadar cesur olanlar için fırsat doğurur. Emtialarımızı rakiplerin eşleşemeyeceği fiyatlarla piyasaya sürerek, dünya toparlandığında Endonezya mallarının zaten her rafta ve her depoda olmasını sağlayacağız."
 INS_musso_ascends:0 "Musso Yükseliyor"
 INS_musso_ascends_desc:0 "Tan Malaka bir hayalperest. Musso, hayalperestlerin sahip olamayacağı bir şeyi getiriyor: Sovyetler Birliği'nin tam desteği ve uluslararası komünist hareketin dayanışması. Devrimimizin tek başına durmasına gerek yok."
 INS_musso_ascends_tt:0 "§Y30%§! veya daha fazla komünist desteği olan ülkelerde §Y$INS_launch_revolution$§! yeteneğinin kilidini açar. Devrimi tetiklediğimiz ülkeler bağımsız kalacak."
 INS_nationalize:0 "Millileştirin!"
 INS_nationalize_companies_tt:0 "Tüm Askeri Endüstriyel Organizasyonlar ve Endüstriyel Kuruluşlar millileştirilecek ve onlara yeni bir isim verilecek."
 INS_nationalize_desc:0 "Bağımsızlığını yeni kazanan cumhuriyetimiz hâlâ Hollanda yönetiminin kalıntılarıyla boğuşuyor. Askeri sanayi şirketleri, petrol şirketleri, tarım şirketleri ve daha birçokları, doğrudan veya dolaylı olarak Hollanda'ya bağlıdır. Cumhuriyetimizin gerçekten bağımsız olabilmesi için, Endonezya varlıklarını bu şirketlerden miras alacak kendi ulusal kurumlarımızı kurmalıyız."
 INS_negotiate_new_contracts:0 "Yeni Sözleşmeler Müzakere Et"
 INS_negotiate_new_contracts_desc:0 "Güvenilir bir tedarikçi olarak artan itibarımız, daha önce bize kapalı olan kapıları açtı. Yeni alıcılar etrafımızda dönüyor ve rakiplerimiz fiyat kırıp bizi geride bırakmadan önce onları uzun vadeli anlaşmalara bağlamak için hızlı hareket etmeliyiz."
 INS_negotiate_new_contracts_unlock_tt:0 "Yeni §Y$INS_realign_supply_chains_cat$§! kararlarının kilidini açar."
 INS_netherlands_can_remove_autonomy_tt_100:0 "\nEğer [HOL.GetFlag]§Y[HOL.GetNameDefCap]§! bu milli hedefi ilk tamamlarsa:\n     ([INS.GetFlag]§Y[INS.GetName]§!): §Y£autonomy_texticon -100.00§! ekleyin"
 INS_netherlands_can_remove_autonomy_tt_150:0 "\nEğer [HOL.GetFlag]§Y[HOL.GetNameDefCap]§! bu milli hedefi ilk tamamlarsa:\n     ([INS.GetFlag]§Y[INS.GetName]§!): §Y£autonomy_texticon -150.00§! ekleyin"
 INS_netherlands_can_remove_autonomy_tt_200:0 "\nEğer [HOL.GetFlag]§Y[HOL.GetNameDefCap]§! bu milli hedefi ilk tamamlarsa:\n     ([INS.GetFlag]§Y[INS.GetName]§!): §Y£autonomy_texticon -200.00§! ekleyin"
 INS_netherlands_can_remove_autonomy_tt_250:0 "\nEğer [HOL.GetFlag]§Y[HOL.GetNameDefCap]§! bu milli hedefi ilk tamamlarsa:\n     ([INS.GetFlag]§Y[INS.GetName]§!): §Y£autonomy_texticon -250.00§! ekleyin"
 INS_netherlands_can_remove_autonomy_tt_50:0 "\nEğer [HOL.GetFlag]§Y[HOL.GetNameDefCap]§! bu milli hedefi ilk tamamlarsa:\n     ([INS.GetFlag]§Y[INS.GetName]§!): §Y£autonomy_texticon -50.00§! ekleyin"
 INS_netherlands_can_remove_autonomy_tt_75:0 "\nEğer [HOL.GetFlag]§Y[HOL.GetNameDefCap]§! bu milli hedefi ilk tamamlarsa:\n     ([INS.GetFlag]§Y[INS.GetName]§!): §Y£autonomy_texticon -75.00§! ekleyin"
 INS_new_bauxite_routes:0 "Yeni Boksit Rotaları"
 INS_new_bauxite_routes_desc:0 "Boksit ihracat hacmimizi artırmak için pazarda fiyat kırma stratejimiz başarıyla sonuçlandı ve toplam gelirimizi önemli ölçüde artırdık. Ancak burada durmamalıyız. Ticaret ağlarımızı genişletmeye, tedarik zincirlerimizi optimize etmeye ve getirilerimizi maksimize etmek için diğer fırsatları aramaya devam etmeliyiz."
 INS_no_more_political_chaos_tt:0 "Siyasi Kaos Etkinlikleri tetiklenmeyi durduracak."
 INS_no_peta_tt:0 "Endonezya, yabancı istilacılarla işbirliği yapamayacak."
 INS_not_industry:0 "Gelecek İçin Plan Yap"
 INS_not_industry_desc:0 "Cava milletimizin atan kalbidir, nüfusumuzun büyük çoğunluğuna ve hükümetimizin koltuğuna ev sahipliği yapar. Adayı ciddiyetle sanayileştirebilmemiz için önce zemini hazırlamalıyız. Arazi incelemeleri, bölgeleme tahsisleri ve saha temizlikleri, fabrikalar geldiğinde en çok işe yarayacakları yere inşa edilmelerini sağlayacaktır."
 INS_oil_decisions_unlock_tt:0 "§YPetrol§! satmak için yeni §Y$INS_realign_supply_chains_cat$§! kararlarının kilidini açar."
 INS_oil_export:0 "Artan Petrol İhracatı"
 INS_oil_export_desc:0 "Yeni ticaret ortaklarımızla ticaret anlaşmaları yapmak için Sumatra ve Kalimantan'daki petrol altyapısını geliştireceğiz."
 INS_organize_jakarta_pemuda:0 "Jakarta Pemuda'larını Örgütle"
 INS_organize_jakarta_pemuda_desc:0 "Java'nın her boyutta birçok Pemuda grubu var. Onların çoğunu seferber edip işe almış olsak da, Jakarta'da hala bağımsız hareket eden düzinelerce küçük grup var. Onlarla temasa geçmeli ve işbirliği kurmalıyız."
 INS_pacific_revolution:0 "Pasifik Devrimi"
 INS_pacific_revolution_desc:0 "Sömürgeci güçler Asya'dan çekilmedi, sadece Endonezya'dan çekildi. Eski düzen hala Malaya ve Filipinler gibi yerlerde hüküm sürüyor ve her birinde onu devirmek isteyen erkekler ve kadınlar var. Devrimimiz bize onlara yardım etme hem yetkisi hem de zorunluluğu verdi. Etmeliyiz."
 INS_pan_asian_union:0 "Pan-Asya Birliği"
 INS_pan_asian_union_desc:0 "Pasifik devrimi daha yeni başlıyor ve henüz güvende değiliz. Birbirimizi dünyanın büyük güçlerinden korumak için birlikte durmalı ve işbirliği yapmalıyız. Birlikte güçlüyüz."
 INS_pan_economic_area:0 "Pan-Asya Ekonomik Bölgesi"
 INS_pan_economic_area_desc:0 "Birlik içindeki ekonomik işbirliği, ortak refahımız için şarttır. Dış ülkelere olan bağımlılığımızı azaltmak için tüm üye ülkeler arasında gümrüksüz ticareti kolaylaştırmalıyız."
 INS_pan_economic_area_tt:0 "§Y[ROOT.GetNameDef]§!'ye tabi olan tüm grup üyeleri"
 INS_pancasila_achieved:0 "Pancasila'ya Ulaşıldı"
 INS_pancasila_achieved_desc:0 "Bu ülkeyi kurduğumuzda Pancasilia'nın beş prensibi üzerine kurulmuştu; Tek ve tek tanrıya, adil ve uygar insanlığa, Endonezya'nın birliğine, bilgeliğin önderlik ettiği demokratik yaşama ve tüm Endonezya halkı için sosyal adalete olan inanç. Bu ilkeler çerçevesinde her zaman başarılı bir şekilde faaliyet göstermemiş olsak da, nihayet asıl ilkelerin öngördüğü birliği elde ettik ve Cumhuriyetimizin devam eden refahının bir sonraki aşamasına resmen başlayabiliriz."
 INS_pki_militia_tt:0 "Tan Malaka çok güçlü bir milise sahip, ancak onlar sadece Endonezya'nın iradesi için değil, §Rkomünizm§! ve Sovyetlerin iradesi için savaşıyorlar. §Rzamanı geldiğinde, herhangi bir komünist olmayan hükümete şiddetle karşı çıkacaklar.§!"
 INS_pledge_to_allies:0 "Müttefiklere Bağlılık Yemini"
 INS_pledge_to_allies_desc:0 "Dünyada büyüyen çatışmanın bir parçası olarak işgal edilme riski altındayız. Müttefiklerle ilişkilerimiz sarsıntılı olsa da, Pasifik'te Demokratik bir güç olarak kendimizi kanıtladık ve büyük demokratik güçlerle aynı hizaya gelmeliyiz."
 INS_political_stabilization:0 "Düzeni Yeniden Sağla"
 INS_political_stabilization_desc:0 "Ulusumuz her geçen gün daha istikrarsız hale geliyor. Yakında tepki göstermezsek iç savaş kaçınılmazdır. Bir çözüm bulmak için Ulusal Komite, Başkan ve Milis liderleri arasında müzakerelere başlamalıyız."
 INS_pontianak_to_balikpapan:0 "Pontianak'tan Tanjung Selor'a"
 INS_pontianak_to_balikpapan_desc:0 "Kalimantan'da bir demiryolu inşa etme fikri uzun uzun tartışıldı, ancak adanın merkezindeki sert, büyük ölçüde keşfedilmemiş arazi bunu zor bir görev haline getiriyor. Tek çözüm, kıyıdan kıyıya U şeklinde bir demiryolu. Ucuz olmayacak, ancak uzun vadede kendini amorti edecek."
 INS_prepare_for_policy_shift:0 "Politika Değişikliğine Hazırlan"
 INS_prepare_for_policy_shift_desc:0 "Hint Adaları'ndaki siyasi manzara, son on yılların ulusal uyanışından etkilendi ve mevcut politikalarımız açıkça modası geçmiş durumda. Yönetim yapımızda bazı değişiklikler yapmayı düşünmeliyiz."
 INS_prepare_raiding_bases:0 "Baskın Üslerini Hazırla"
 INS_prepare_raiding_bases_desc:0 "Devrim başladığında vurmaya hazır olduğumuzdan emin olmak için tüm takımadalarda gizlice sığınaklar kurmak adına casus ağımızı kullanacağız."
 INS_prime_minister_hatta:0 "Başbakan Hatta"
 INS_prime_minister_hatta_desc:0 "Devrimin ilan edicisi olarak bilinen Mohammad Hatta, Sukarno'nun Başkan Yardımcısı olarak görev yaptı ve genel olarak ikilinin daha demokratik eğilimli olanıydı. Çoğu siyasi partinin üzerinde uzlaşabileceği uygun bir Başbakan olacaktır."
 INS_prime_minister_sjarifuddin:0 "Başbakan Sjarifuddin"
 INS_prime_minister_sjarifuddin_desc:0 "Sjarifuddin Endonezya için en iyi adaydır, ılımlı politikaları komünistler ve sosyalistler arasında uzlaşma sağlar."
 INS_prime_minister_tt:0 "İlk Endonezya genel seçimleri yapıldı"
 INS_prioritize_dutch_companies:0 "Hollanda Şirketlerine Öncelik Ver"
 INS_prioritize_dutch_companies_desc:0 "Shell ve Fokker gibi Hollanda şirketleri, hammadde ihracatımızın Shell ile ağır bir şekilde entegre olmasıyla yüzyıllardır ekonomimizin belkemiği olmuştur. Bu, Adalar'a önemli bir zenginlik getirdi ve işbirliğimizin güçlü kalmasını sağlamak için onları daha küçük, yerel işletmelere tercih etmeliyiz."
 INS_prioritize_industrial_growth:0 "Endüstriyel Büyümeye Öncelik Ver"
 INS_prioritize_industrial_growth_desc:0 "İhracat ekonomimiz çok değişken ve bizi Hollanda işbirliğine bağımlı tutuyor. Batavya genelinde fabrikalar inşa ederek bir imalat sanayii kurmak için çalışmalıyız. Pasifik'teki en sanayileşmiş ülke olabiliriz"
 INS_prioritize_sugar_economy:0 "Şeker Ekonomisine Öncelik Ver"
 INS_prioritize_sugar_economy_desc:0 "Batavya endüstriyel kalkınması için hükümet bütçemizi azaltmalıyız; takımadalardaki diğer tüm şehirlerden çok daha fazla sanayileşmiş durumda. Bunun yerine, bu parayı ülke genelinde birçok küçük hurma plantasyonu kurmak için kullanmalıyız. Bu plantasyonlar, uluslararası talebi yüksek bir emtia olan hurma şekeri üretecek."
 INS_privately_owned_military_industry:0 "Özel Sektör Askeri Endüstrisi"
 INS_privately_owned_military_industry_desc:0 "Askeri endüstriyel sektörde birkaç gölge şirket kuracağız, devrim başladığında askeri sanayi üzerindeki kontrolümüzü koruduğumuzdan emin olacağız."
 INS_privately_owned_military_industry_tt:0 "Karargahınıza §G2§! §YAskeri Fabrika§! ekler"
 INS_purge_oppurtunists:0 "Fırsatçıları Temizle"
 INS_purge_oppurtunists_desc:0 "Musso yirmi yılını Moskova'da emir almayı öğrenerek geçirdi. Cebinde Sovyet talimatları ve cumhuriyetimizi Komintern'in bir kuklası haline getirme planıyla geri döndü. Hollandalıları başka bir yabancı efendinin önünde diz çökmek için kovmadık. Devrimimizi Moskova'ya satacak fırsatçılar kökünden sökülmeli ve kurtardığımız halklar Kremlin'e değil, Cakarta'ya bakmalı."
 INS_purge_oppurtunists_tt:0 "§Y60%§! veya daha fazla komünist desteği olan ülkelerde §Y$INS_launch_revolution$§! yeteneğinin kilidini açar. Devrimi tetiklediğimiz ülkeler bizim §Ykuklamız§! olacak."
 INS_quality_over_quantity:0 "Nicelik Yerine Nitelik"
 INS_quality_over_quantity_desc:0 "İyi düşünülmüş bir stratejiye ve modern ekipmana sahip eğitimli bir asker, tabancalı beş öğrenciyi yenecektir. Mümkün olduğunca çok asker mobilize etmek yerine yüksek kaliteli, iyi silahlanmış askerlere ve özel kuvvetlere öncelik vermeliyiz."
 INS_quinine_export:0 "Daha Kazançlı Kinin Anlaşması"
 INS_quinine_export_desc:0 "Amsterdam'daki Cinchona Bürosu kinin ihracatında neredeyse tekele sahip, kinin dünya çapında sıtma tedavisi olarak yüksek talep gördüğünden bu özellikle karlı. Büro, kininin çoğunu Doğu Hint Adaları'ndan tedarik ediyor. Buna rağmen, karların çok küçük bir kısmını alıyoruz. Kinin üretimimizi daha adil bir anlaşma müzakere etmek için kaldıraç olarak kullanmalıyız."
 INS_railway_youth_force:0 "Demiryolu Gençlik Gücü ile İşbirliği Yap"
 INS_railway_youth_force_desc:0 "Demiryolu gençlik gücü, adını demiryollarını ele geçirme stratejisinden alan, esas olarak Orta Java'da aktif olan bir İslami gençlik milis grubudur. Değerli bir müttefik olabilirler, ancak enerjikler ve çatışmaya girmek istiyorlar. Ateşkeste çok uzun süre kalırsak hükümetten mutsuz olacaklar."
 INS_rapid_mobilization:0 "Hızlı Seferberlik"
 INS_rapid_mobilization_desc:0 "Her güçlü ulus, üzerinde duracağı güçlü bir orduya sahiptir. Ayakta durabilecek bölgesel bir süper güç olmak istiyorsak, ordumuzu bugünkünden çok daha güçlü hale getirerek başlamalıyız."
 INS_realign_export_markets:0 "İhracat Pazarlarını Yeniden Düzenleyin"
 INS_realign_export_markets_desc:0 "Birkaç büyük güce olan bağımlılığımızı azaltarak küresel ticari ilişkilerimizi güçlendirmeliyiz. Bunun yerine, daha küçük uluslar ve şirketlerle çok sayıda, daha küçük ticaret yapmalıyız."
 INS_realign_supply_chains:0 "Tedarik Zincirlerini Yeniden Hizala"
 INS_realign_supply_chains_desc:0 "Büyük Buhran'ın korumacılığı yavaşlarken, artan üretim ve aşırı değerli bir gulden Hollanda ihracat pazarını paramparça etti, çünkü batıdaki eski ticaret ortaklarımız taleplerini karşılamak için Güney Amerika'ya yöneldi. Müttefiklerimizi bizimle tekrar ticaret yapmaya başlamaya ikna etmek için adımlar atmalıyız."
 INS_realign_supply_chains_explain_tt:0 "Kaynakları özel şirketlere 2 yıllık kiralama ile satmak için §Y$INS_realign_supply_chains_cat$§! Kararlarının kilidini açar."
 INS_reallocate_rubber_industry_funding:0 "Kauçuk Endüstrisi Finansmanını Yeniden Tahsis Et"
 INS_reallocate_rubber_industry_funding_desc:0 "Kauçuk satışına olan bağımlılığımızın ekonomimiz üzerinde feci bir etkisi oldu. Kaynakları araştırarak ve takımadalar genelinde madenler ve fabrikalar açarak ekonomimizi çeşitlendirmeliyiz. Bu ucuz bir çaba olmayacak, bu yüzden kauçuk plantasyonlarını sürdürmek için bütçeyi azaltmak zorunda kalacağız."
 INS_reallocate_rubber_industry_funding_tt:0 "Bir eyaletten §Ykauçuk kaldırmak§! ve onu daha küçük miktarlarda §Ydiğer kaynaklarla§! değiştirmek için bir kararı açar."
 INS_reclaiming_the_dutch_navy:0 "Hollanda Hint Adaları Donanmasını Geri Kazan"
 INS_reclaiming_the_dutch_navy_desc:0 "Hollandalılar, işgal ettiğimiz limanlarda bol miktarda gemi bıraktı. Şansımız varken bu gemileri kendimiz için almalıyız."
 INS_recognize_moestopos_batallion:0 "Moestopo'nun Taburunu Tanı"
 INS_recognize_moestopos_batallion_desc:0 "Moestopo adında bir devrimci, Surabaya'da kendini 'Geçici Savunma Bakanı' ilan ederek Surabaya'daki milis kuvvetlerinin kontrolünü elinde tutuyor. Çabaları resmi tanınmayı hak ediyor, onu resmi olarak TKR'nin Tümgenerali yapmalıyız."
 INS_recovering_from_the_great_depression:0 "Büyük Buhran'dan Kurtulmak"
 INS_recovering_from_the_great_depression_desc:0 "Büyük Buhran'ın [INS.GetNameDef] üzerinde yıkıcı bir etkisi oldu. Ekonomimizin temel olarak ihracata dayalı olması nedeniyle, dünya genelindeki korumacılık bizi sakat bıraktı. Küresel ticaret yeniden açılmaya hazır göründüğü için, yeni pazarlar aramalı ve eski ticaret yollarımızı yeniden kurmak için çalışmalıyız."
 INS_reduce_land_taxes:0 "Arazi Vergilerini Azalt"
 INS_reduce_land_taxes_desc:0 "Arazi mülkiyeti üzerindeki yüksek vergiler, yerli Endonezyalıların plantasyon ve işletmelere sahip olmasını zorlaştırdı. Bu, kauçuk endüstrisinde tekel olmamızı kolaylaştırsa da, ülke genelinde ekonomik sorunlara neden oldu. Bu vergileri önceki oranlarına düşürmeyi düşünmeliyiz, bu da daha küçük, özel mülkiyetli kauçuk plantasyonlarının faaliyet göstermesini mümkün kılacaktır."
 INS_reform_education_system:0 "Zorunlu İdeolojik Eğitim"
 INS_reform_education_system_2:0 "Eğitim Reformu"
 INS_reform_education_system_2_desc:0 "Endonezya'nın gelecekte zengin bir ulus olmasını istiyorsak, tüm Endonezyalılar doğum yeri ne olursa olsun eğitim alma hakkına sahip olmalıdır."
 INS_reform_education_system_desc:0 "Devrim, sosyal düzenden hoşnut olmayan öğrencilerin ve gençlerin her zaman isyanı yöneteceğinin kanıtıydı. Hükümetimizin ve ulusumuzun güvenliği için, okulların hükümet ideolojimize göre eğitim vermesini zorunlu kılacağız."
 INS_relocate_generals_tt:0 "Silahlı Kuvvetlerimizin §Y80%§!'ini [INS.GetNameDef]'e aktar."
 INS_republic_add_generals_tt:0 " (§Y$INS_sudirman$§!([INS.GetFlag]), §Y$INS_soengkono$§!([INS.GetFlag]), §Y$INS_supriyadi$§!([INS.GetFlag]), §Y$INS_djatikoesoemo$§!([INS.GetFlag]), §Y$INS_maludin_simbolan$§!([INS.GetFlag])) General olur."
 INS_resist_occupation:0 "İşgale Direnmek"
 INS_resist_occupation_desc:0 "Pek çok Endonezyalının Hollanda'ya karşı duyduğu öfke, Faşizme düşmemize izin veremez. Japon işgaline direnmek ve anavatanı savunmak için elimizden geleni yapmalıyız."
 INS_resist_occupation_tt:0 "İşgal edilirsek ve teslim olmazsak bu milli hedef otomatik olarak tamamlanacaktır."
 INS_restore_order:0 "Siparişi Geri Yükle"
 INS_restore_order_desc:0 "Milletimiz her geçen gün daha istikrarsız bir hale geliyor. Eğer kısa sürede tepki vermezsek bir iç savaş kaçınılmazdır. Çözüm bulmak için Ulusal Komite, Başkan ve Milis liderleri arasında müzakerelere başlamalıyız."
 INS_restore_order_in_indies:0 "Adalar'da Düzeni Yeniden Sağla"
 INS_restore_order_in_indies_desc:0 "Adalar'daki artan milliyetçi hareket birkaç bölgeyi istikrarsızlaştırdı ve eğer durdurmazsak kontrolden çıkabilir. En büyük önceliğimiz olarak düzeni ve istikrarı yeniden sağlamalıyız."
 INS_retake_lost_british_states_tt:0 "§YMalezya§!'deki Britanya topraklarına karşı sınırlı savaşlar başlatma yeteneğinin kilidini açar!"
 INS_revolution_ended_tt:0 "Ulusal Devrim sonuçlandı"
 INS_revolutionary_economic_cooperation:0 "Devrimci Ekonomik İşbirliği"
 INS_revolutionary_economic_cooperation_desc:0 "Artık tiranlık altında yaşamayan milyonlarca insanın hayatını kurtardık. Artık birlikte inşa etmeliyiz. İşbirliği ve ticaret yoluyla, bizi gelecek yıllarda yabancı güçlerden koruyacak güçlü ekonomiler ve ordular oluşturabiliriz."
 INS_revolutionary_economic_cooperation_tt:0 "§Y$INS_revolutionary_economic_cooperation_modifier$§! kazanır ve bu da şunları sağlar:\n§Y4%§! İstikrar §Y§Ybaşlattığımız Ülke başına§! §!\n§Y4%§! İnşaat Hızında bir devrim §Y Ülke başına§! §Ybir devrim başlattık in§!\n§Y4%§! Siyasi Güç Kazanımı §YÜlke başına§! §Ybir devrim başlattık §!\n§Y-4%§! Tüketici Malları §YÜlke başına§!'de §Ybir devrim başlattık in§!\n\nŞu anda §Y[?INS_communist_revolts_succeeded]§! ülkelerinde devrimleri başlattık."
 INS_secularism:0 "Laiklik"
 INS_secularism_desc:0 "Endonezya birçok dinden birçok insana ev sahipliği yapmaktadır. Din ve siyaseti birbirine karıştırmak sadece iç çatışmaya neden olacaktır, bu nedenle dini siyasi partileri yasaklamalıyız."
 INS_seek_recognition_of_mal_claims:0 "Malay İddialarımızın Tanınmasını İstiyoruz"
 INS_seek_recognition_of_mal_claims_desc:0 "Malaya ve Kuzey Borneo bizim kökenlerimizdendir ve yalnızca ince sömürge sınırlarıyla bölünmüşlerdir. [JAP.GetNameDef]'nin bu bölge üzerindeki hakkımızı tanımasını ve Britanya'yı yendikten sonra bu hakkı bize vaat etmesini sağlamalıyız."
 INS_seize_oppurtunity:0 "Fırsatı Yakala"
 INS_seize_oppurtunity_desc:0 "[JAP.GetNameDefCap] kaybediyor ve işgal hükümetleri zayıf. Yüzyıllardır ilk kez, Endonezya'nın prangalarını sonsuza dek kırmak ve bağımsız bir ulus yaratmak için gerçek bir şansımız var. Bu fırsatı değerlendirip bağımsızlık ilan etmezsek, bir sonrakini almamızın ne kadar süreceğini kimse bilemez."
 INS_seize_oppurtunity_refuse_warn_tt:0 "§R[HOL.GetNameDef] ile savaşa yol açabilecek ulusal devrim başlayacak§!."
 INS_seize_oppurtunity_tt:0 "§Y[JAP.GetFlag][JAP.GetName]§! geri püskürtüldü ve §Y[?var:temp_states_plus_more]§! eyaletten daha azını kontrol ediyor. (şu anda: §Y[?var:JAP.num_controlled_states]§!)"
 INS_ship_contracts:0 "Gemi Sözleşmeleri Yap"
 INS_ship_contracts_desc:0 "Savaş durumunda ticaret yollarımızı korumak için bir donanma inşa etmek gereklidir. Denizcilik sözleşmeleri elde etmek için yeni kurduğumuz ticari ilişkilerimizden yararlanabiliriz."
 INS_siam_agreement:0 "Siam Anlaşması"
 INS_siam_agreement_desc:0 "Siam, kendi ayakları üzerinde duramayan zayıf bir ulus. Japonya'ya değerimizi kanıtladık ve onlar da baskı altında kalmaya devam etti. Hiç şüphe yok ki Siam Endonezya'nın kuklası olursa hepimiz daha iyi durumda olacağız."
 INS_silence_nationalists:0 "Milliyetçi Sempatizanları Sustur"
 INS_silence_nationalists_desc:0 "Japon işgali, devrimci milliyetçi hareketlerin ortak düşmanları olan Hollanda nedeniyle Japon işgalcileri desteklemeye başlamasına neden oldu. İşgalin neden olduğu istikrarsızlık, bu hareketlerin daha önce hiç görülmemiş bir hızla büyümesine neden oldu. Şimdi bir şeyler yapmazsak, tamamen kontrolümüzden çıkabilir."
 INS_sjahrirs_continued_tenure:0 "Sjahrir'in Görev Süresinin Devamı"
 INS_sjahrirs_continued_tenure_desc:0 "Başbakan Sjahrir, devrim boyunca bize rehberlik ederek, ekonomimizi geliştirerek ve demokrasiyi kurarak harika bir lider olduğunu kanıtladı. Onu Başbakan olarak yeniden seçmeliyiz."
 INS_sjarifuddin_focus_2:0 "Kendi Kendini Yöneten İhracat Ekonomisi"
 INS_sjarifuddin_focus_2_desc:0 "Yeni kazandığımız bağımsızlıkla, ihracat ekonomisi sistemimizi gözden geçirmeli ve Hollanda karlarını artık hesaba katmayacak şekilde yeniden düzenlemeliyiz. İhracata dayalı bir ekonomi hala tehlikeli olsa da, onu önceki yıllardan çok daha güvenilir hale getirebiliriz."
 INS_sleeper_informant_network:0 "[GetInformantNetworkName]"
 INS_sleeper_informant_network_desc:0 "KNIL idari aygıtının tamamına gömülü bir muhbir ağı oluşturacağız ve düşman planlarına karşı önceden uyarı alacağız."
 INS_sleeper_informant_network_tt:0 "§RBağımsızlık ilan edildiğinde:§!\n"
 INS_social_democracy:0 "Sosyal Demokrasi"
 INS_social_democracy_desc:0 "Sjahrir'in ekonomik politikaları uygulandığından beri [INS.GetAdjective] ekonomisi büyük ölçüde büyüdü. Endonezya'yı tam bir Sosyal Demokrat devlet olarak ilan etmeli ve sosyal demokrasi ilkelerine dayalı gelecekteki ekonomik politikalar geliştirmeliyiz."
 INS_soetardjo_petition_against_tt:0 "Soetardjo Dilekçesi Volksraad'ı böldü"
 INS_soetardjo_petition_debate_done_tt:0 "Soetardjo'nun özerklik dilekçesi üzerine Volksraad tartışması sona erdi"
 INS_soetardjo_petition_supported_tt:0 "Soetardjo Dilekçesi Volksraad tarafından desteklendi"
 INS_soviet_aid:0 "Sovyet Yardımı"
 INS_soviet_aid_desc:0 "Sovyetler Birliği devrimimizi tanıdı ve desteklemeye hazır. Programımızı Moskova'nınkinden ayıran farklılıklar ne olursa olsun, sunulanı reddetme lüksümüz yok. Silahları almalı ve ilerlemeye devam etmeliyiz."
 INS_soviet_economic_integration:0 "Sovyet Ekonomik Entegrasyonu"
 INS_soviet_economic_integration_desc:0 "Devrim bize özgürlüğümüzü verdi, ancak sadece özgürlük fabrikalar inşa etmez veya kitleleri doyurmaz. Sovyetler Birliği, hiçbir kapitalist gücün yapmayacağı şeyi sunuyor: endüstriyel uzmanlık, kalkınma kredileri ve sömürgeci şartlar içermeyen ticaret. Reddedersek aptallık etmiş oluruz."
 INS_spend_profits_on_military:0 "Karları Askeri Kalkınmaya Harca"
 INS_spend_profits_on_military_desc:0 "Yeni kinin anlaşmamız kesinleştiğinde, ek gelirimizi Yogyakarta ve Semarang'da yeni silah fabrikaları inşa etmek ve bakımını yapmak için harcayarak ordumuzu önemli ölçüde geliştirme fırsatı buluyoruz."
 INS_spend_profits_on_rural:0 "Karları Kırsal Kalkınmaya Harca"
 INS_spend_profits_on_rural_desc:0 "Yeni kinin anlaşmamız kesinleştiğinde, ek gelirimizi kırsal alanlardaki ulaşım ve iletişim altyapısını geliştirmek, gelecekteki endüstriyel kalkınmaya yol açmak için kullanma fırsatı buluyoruz."
 INS_spend_profits_on_urban:0 "Karları Kentsel Kalkınmaya Harca"
 INS_spend_profits_on_urban_desc:0 "Yeni kinin anlaşmamız kesinleştiğinde, ek gelirimizi Batavya imalat sanayini genişletmek için kullanma fırsatı buluyoruz, bu da ekonomimizi çeşitlendirecek ve hammadde ihracatına olan bağımlılığımızı azaltacaktır."
 INS_strengthen_ins_jap_trade:0 "[ROOT.GetAdjective]-[JAP.GetAdjective] Ticaretini Güçlendirin"
 INS_strengthen_ins_jap_trade_desc:0 "Yeni müttefikimizle aramızdaki ticari ilişkileri geliştirmeliyiz. Fazla kaynaklarımızı çok daha düşük maliyetlere satarsak, değerimizi kanıtlayabilir ve savaştan sonra ek pazarlık gücü kazanabiliriz."
 INS_stronghold_java:0 "Cava Kalesi"
 INS_stronghold_java_desc:0 "Adalar, birçok halka ve son derece sert araziye ev sahipliği yapan geniş bir takımadadır. Her adayı, ormanı ve dağı bizden çok daha büyük bir orduya karşı savunmaya çalışmak başarısız olmaya mahkumdur. İnsanlarımızı terk etmek kolay olmasa da, Cava dışındaki tüm adaları boşaltmak, tüm ordumuzu orada konuşlandırmamıza izin vermek, ulus olarak bir bütün olarak en iyi hareket olabilir."
 INS_stronghold_java_tt:0 "Herhangi bir Endonezya Eyaleti: [ROOT.GetFlag][ROOT.GetNameDefCap] tarafından işgal edilmemiş"
 INS_subsidize_laskar_armament:0 "Laskar Silahlanmasını Sübvanse Et"
 INS_subsidize_laskar_armament_desc:0 "Bambu mızraklarla savaşan milisler, ağır silahlı birimlere karşı uzun süre hayatta kalamayacak. Bu milisler için daha fazla silah ve mühimmat üretmeye öncelik vermeliyiz."
 INS_subsidize_local_business:0 "Yerel İşletmeleri Sübvanse Et"
 INS_subsidize_local_business_desc:0 "Uzun vadede ekonomimizi desteklemek için yerel işletmelere sübvansiyon vermeli ve ekonomik büyümeyi teşvik etmeliyiz."
 INS_sudirmans_promotion:0 "Sudirman'ın Terfisi"
 INS_sudirmans_promotion_desc:0 "Sudirman harika liderlik becerileri gösterdi ve birkaç başarılı saldırı yönetti. Komutanımızın çabalarını hak ettiği General unvanını vererek tanımanın zamanı geldi."
 INS_sukarnos_industrialization:0 "Java Endüstrisini Güçlendir"
 INS_sukarnos_industrialization2:0 "Her İnsan Kendi Üzerine Düşeni Yapmalı"
 INS_sukarnos_industrialization2_desc:0 "Savaş çabası bu ulusun bir numaralı önceliğidir ve bu nedenle her Endonezyalının katkıda bulunması bir numaralı önceliktir. Lüks düşmandır, askeri endüstriyel kompleks büyümeli."
 INS_sukarnos_industrialization_desc:0 "Java'nın endüstrileri ekonomimizin ve ordumuzun bel kemiğidir. Tüm yollar Roma'ya çıkar."
 INS_sumatra_railway:0 "Sumatra Demiryolu"
 INS_sumatra_railway_desc:0 "Sumatra'nın altyapısını geliştirme çabalarımızın bir parçası olarak, kuzey Atjeh'ten Sumatra'daki en güney limana kadar uzanan ve Batavya'ya gemiyle çok hızlı bağlanan büyük bir demiryolu inşa etmeliyiz. Bu sayede kaynaklar sadece en yakın tren istasyonuna taşınacak ve oradan Batavya'ya günler içinde taşıyabileceğiz."
 INS_support_tan_malakas_coup:0 "Tan Malaka'nın Darbesini Destekle"
 INS_support_tan_malakas_coup_desc:0 "Sukarno bağımsızlığımızı ilan etti ama yarım yamalak önlemler ve diplomatik tavizlerle kendini kanıtladı. Tan Malaka ve Persatuan Perjuangan, halkın talep ettiğini talep ediyor: yüzde yüz bağımsızlık, pazarlık yok, taviz yok. Sukarno devrim için sonuna kadar savaşmayacaksa, devrim savaşacak bir lider bulmalıdır."
 INS_take_batavia_explination_tt:0 "Cava'nın tamamını başarıyla işgal edersek, sömürge hükümetini içeriden yok edeceğiz ve §Gsavaşı kazanacağız§!. Ancak, bunu §Y730 gün§! içinde başaramazsak, §Ryok olacağız§!."
 INS_tan_malaka_coup_tt:0 "PKI Milisleri devrim planlamayı durduracak."
 INS_the_bangka_project:0 "Bangka Projesi"
 INS_the_bangka_project_desc:0 "Bangka-Belitung adaları küçük olsa da, boksit yatakları nedeniyle Endonezya ekonomisinin bir mihenk taşıdır. Adaların zengin mineral zenginliğinin tam ödüllerini alabilmemizi sağlamak için Bangka-Belitung'da yollar, limanlar ve demiryolları inşa etmemiz gerekiyor."
 INS_the_co_prosperity_sphere:0 "Ortak Refah Alanı"
 INS_the_co_prosperity_sphere_desc:0 "Japonlarla işbirliğine karşı çok fazla muhalefet olmasına rağmen, bu istikrarsız zamanlarda batılı müttefiklere karşı güçlü durmak için daha güçlü bir güçle güçlerimizi birleştirmek bizim çıkarımızadır."
 INS_the_co_prosperity_sphere_tt:0 "§Y$INS_request_membership$§! ve §Y$INS_assume_complete_power$§! kararlarının, ülkeyi tersine çevirme kararının ve §Y$INS_sukarno$ Faşist§! kararlarının kilidini açar."
 INS_the_declaration_of_independence:0 "Bağımsızlık Bildirgesi"
 INS_the_declaration_of_independence_desc:0 "Daha fazla beklemeyi göze alamayız, demir tavında dövülür! Hollandalı yetkililerin tepki vermeye vakti kalmaması için limanların, şehirlerin ve sanayi merkezlerinin kontrolünü ele geçirmek üzere milislerimizi yeterince hızlı bir şekilde göndermeliyiz. Ardından, Endonezya Cumhuriyeti'ni ilan ederek bağımsızlığımızı duyuracağız."
 INS_the_declaration_of_independence_tt:0 "§YBağımsızlığımızı§! ilan edeceğiz. §YMilis Üssü§! veya §YKarargâh§! kurduğumuz her eyalet bizim kontrolümüz altında olacak, geri kalanlar ise [HOL.GetNameDef] elinde kalacak\n\n[HOL.GetNameDefCap] egemenliğimizi tanımayacak ve düşük yoğunluklu bir çatışma başlayacak. Bu durum §Rsavaşa§! dönüşebilir.\n\nEyaletleri ele geçirmek için kara baskınlarının kilidini açar."
 INS_the_jewel_in_the_crown:0 "Taçtaki Mücevher"
 INS_the_jewel_in_the_crown_desc:0 "Doğu Hint Adaları, Hollanda sömürge tacındaki en parlak mücevherdir ve onu öyle tutmaya niyetliyiz. Volksraad aracılığıyla sesimiz Lahey'e ulaşıyor."
 INS_the_maphilindo_speech:0 "Maphilindo Konuşması"
 INS_the_maphilindo_speech_desc:0 "Eğer bir Betawi ve Banjar kişisi, zulme karşı ortak mücadeleleri nedeniyle kültürel farklılıklara rağmen Endonezyalıysa, o zaman bir Malay ve Filipinlinin aynı zamanda Endonezyalı olmaması için hiçbir neden yoktur. Bu toprakları tek bir devlet olarak birleştirmeliyiz!"
 INS_the_maphilindo_speech_tt:0 "§YMalay§! konularının çekirdeklenmesine ve eklenmesine izin verir"
 INS_the_peoples_security_army:0 "Halkın Güvenlik Ordusu"
 INS_the_peoples_security_army_desc:0 "Başta genç Endonezyalılar olmak üzere üyelerimiz sabırsızlanıyor, katkıda bulunmaya ve Bağımsızlığımız için savaşmaya hevesliler. Devrimci bir Silahlı Kuvvetler kurmalı ve gelecekteki askerlerimizi eğitmeye başlamalıyız."
 INS_the_three_year_plan:0 "Üç Yıllık Plan"
 INS_the_three_year_plan_desc:0 "Ekonomimize uzun vadede yön verecek, bürokrasiye harcanan zamanı azaltacak üç yıllık bir plan açıklayacağız."
 INS_the_three_year_plan_tt:0 "§YUlusal Ruh§! §Y%26§!'de tam potansiyeline ulaşana kadar her ay §G1%§! oranında gelişecektir."
 INS_the_timor_issue:0 "[INS_timor_issue_scripted_name]"
 INS_the_timor_issue_desc:0 "[INS_timor_issue_scripted_desc]"
 INS_three_year_plan:0 "Üç Yıllık Plan"
 INS_three_year_plan_desc:0 "Takımadalar genelinde altyapı inşa etmek ve adaları birbirine bağlamak için üç yıllık bir plan oluşturabiliriz."
 INS_tighter_tkr_integration:0 "Daha Sıkı TKR-Laskar Entegrasyonu"
 INS_tighter_tkr_integration_desc:0 "Halkın Güvenlik Ordusu ve çeşitli milis kuvvetleri birlik içinde çalışmıyor ve koordinasyon sınırlı. Savaş devam ettikçe bu sadece daha fazla sorun yaratacak, milis subaylarının kaçınılmaz protestolarına rağmen silahlı kuvvetleri ve milisleri tek bir birleşik örgütte birleştirmemiz gerekiyor."
 INS_timor_issue_scripted_desc_attack:0 "Doğu Timor'un açıkça Endonezya'nın hakkı olan bir toprak olduğu ortada. Adadaki isyancılar bağımsızlık talep edebilir ancak tüm halk adına konuşmadıkları açık. Portekiz sömürgeciliğinin kalıntıları Cumhuriyete entegre edilmelidir."
 INS_timor_issue_scripted_desc_issue:0 "Doğu Timor'un açıkça Endonezya'nın hakkı olan bir toprak olduğu ortada ve devrim sona ermiş olsa da burası hala koloni yönetimi altında. [721.OWNER.GetName] unsuruna Doğu Timor'un derhal devredilmesini talep eden bir ültimatom göndereceğiz."
 INS_timor_issue_scripted_name_attack:0 "Doğu Timor'a Saldır"
 INS_timor_issue_scripted_name_issue:0 "Timor Sorunu"
 INS_tin_mining:0 "Kalay Madenciliğine Yatırımlar"
 INS_tin_mining_desc:0 "Bangka-Belitung adalarındaki kalay madenciliğinin geçmişi, takımadalardaki Avrupalı varlığından öncesine dayanır. Bu yüzden, adalardaki kalay endüstrisinin modernleşmesi için geç bile kalındığına şaşmamalı. Üretim yeteneklerini elden geçirmek pahalı bir çabadır ve mevcut kalay endüstrimiz yeniden inşa ederken bir süre faaliyette olmayacaktır. Ancak, uzun vadeli kar için önemli bir potansiyel var."
 INS_tin_to_japan:0 "[JAP.GetNameDef]'e Kalay Sat"
 INS_tin_to_japan_desc:0 "[JAP.GetNameDefCap]'in artık modası geçmiş ve değiştirilebilir olarak kabul edilen birçok gemisi var, buna rağmen [INS.GetAdjective] donanması için mükemmel bir uyum sağlıyorlar. Bu gemileri kalay üretimimizden gelen parayla satın almalıyız."
 INS_tin_to_japan_tt:0 "[JAP.GetNameDefCap] bize §Y9§! eski muhrip gönderecek."
 INS_tin_to_usa:0 "[USA.GetNameDef]'e Kalay Sat"
 INS_tin_to_usa_desc:0 "[USA.GetNameDefCap] kalay satın alan şirketler ve hükümet kurumlarıyla dolu. Artık düzgün bir madencilik operasyonumuz olduğuna göre, burada çok kar etme fırsatımız var."
 INS_tjarda_explain_tt:0 "§YBonifacius Cornelis de Jonge§!'in görev süresi doldu ve Eylül 1936'da yerine §YAlidius Tjarda van Starkenborgh Stachouwer§! Genel Vali olarak seçildi."
 INS_tkr_professional_army:0 "Profesyonel Bir Ordu"
 INS_tkr_professional_army_desc:0 "Sadece milislere güvenmemeliyiz, düzeni korumak için profesyonel bir Cumhuriyetçi ordu geliştirmeliyiz."
 INS_tkr_steal_general:0 "KNIL Generallerini Kap"
 INS_tkr_steal_general_desc:0 "Eğer Doğu Hint Adaları Ordusu'nun üst düzey üyelerini davamıza katılmaya ikna edebilirsek, aynı anda hem ordumuzu geliştirip hem de onlarınkini sabote edebiliriz."
 INS_tkr_supply:0 "Her Devrimci Savaşmalı"
 INS_tkr_supply_desc:0 "Hareketimizin her üyesinin istisnasız resmi askeri eğitim almasını sağlayacağız."
 INS_tkr_tt:0 "§YHalkın Güvenlik Ordusu§!'nu şu şekilde değiştirir:"
 INS_underground_revolution:0 "Yeraltı Devrimi"
 INS_underground_revolution_desc:0 "Gölgeden bir devrim planlamaya başlayacağız, vurmaya hazır olana kadar yavaş yavaş üye sayısını ve milis faaliyetlerini artıracağız."
 INS_union_of_ins_states:0 "[ROOT.GetAdjective] İller Birliği"
 INS_union_of_ins_states_desc:0 "Federal hükümetin rolünü öncelikli olarak iller arası ve dış ilişkilere indirgeyerek eyaletlere daha fazla özerklik vermeliyiz. Eyaletlerin istekleri doğrultusunda yeni bir federal başkan seçeceğiz. Yerel yöneticiler istedikleri gibi kendi liderlik yapılarını oluşturmakta özgür olacaklar."
 INS_union_of_ins_states_tt:0 "\n§Y[ATJ.GetName]§!, §Y[BLI.Getname]§!, §Y[SSI.GetName]§!, §Y[TNE.GetName]§!, §Y[POK.GetName]§! ve §Y[GOW.GetName]§! olarak §Y$autonomy_taog_indonesian_union_state$s§!."
 INS_united_against_japan:0 "[JAP.GetNameDef]'ye karşı birlik"
 INS_united_against_japan_desc:0 "Kimse Müttefiklerin yanında yer almaya hevesli olmasa ve Hollandalıların bıraktığı yara unutulmamış olsa da, ortak düşmanımıza karşı savaşmak için farklılıklarımızı geçici olarak bir kenara bırakmalıyız, aksi takdirde başka bir derebeyinin [ROOT.GetName]'yi ele geçirme riskiyle karşı karşıya kalırız."
 INS_unity_in_diversity:0 "Çeşitlilikte Birlik"
 INS_unity_in_diversity_desc:0 "Çeşitlilikte Birlik kelimeleri yüzyıllardır takımadalarımızın ruhunu yakaladı. Devrim sırasında bu fikir, Endonezyalılara birçok dil konuşsak ve birçok farklı geleneği takip etsek de tek bir halk olarak birlikte durduğumuzu hatırlatan bir savaş çığlığı haline geldi. Birliğimizin nesiller boyu korunması için bu ifadeyi anayasamıza işlemeliyiz."
 INS_usa_tanks_opinion_mod:0 "Tanklarımızı Satın Aldı"
 INS_utilize_comintern_connections:0 "Komintern Bağlantılarını Kullanın"
 INS_utilize_comintern_connections_desc:0 "Musso'nun üst düzey Komintern yetkilileriyle olan bağlantıları, Komintern'e katılma sürecini kolaylaştırıyor. Gecikmeden pazarlık yapması için onu [SOV.GetNameDef]'ye göndermeliyiz."
 INS_utilize_tan_malakas_militia:0 "Tan Malaka'nın Milislerini Kullan"
 INS_utilize_tan_malakas_militia_desc:0 "Tan Malaka'nın Kızıl Milisleri belki de tüm Endonezya'daki en güçlü tekil milistir ve onları TKR'de seferber etmek büyük bir kazanç olacaktır. Bu risksiz değildir, güçlü siyasi güdülere sahip güçlü bir milise bu kadar nüfuz vermek, iktidarı kendileri için ele geçirmelerini çok daha kolaylaştıracaktır."
 INS_vice_presidential_edict:0 "Başkan Yardımcısı Kararnamesi X'i İmzala"
 INS_vice_presidential_edict_desc:0 "Ulusal Komite neredeyse oybirliğiyle gerçek yasama gücü talep ediyor. Başkana, Ulusal Komite'nin bağımsız bir parlamento haline geleceği, Başkan ile ortak yasama yetkilerini paylaşacağı bir Hibrit sistem öneren bir dilekçe sunuldu. Teklif cazip, ancak Başkanlık gücünün önemsiz hale gelme riski var."
 INS_volksraad_rumors:0 "Volksraad'daki Söylentiler"
 INS_volksraad_rumors_desc:0 "Volksraad içinde devrimi gizlice tartışmaya başlayacağız. Başarılı olursak, Endonezya Volksraad üyelerini davamıza katılmaya ikna edebiliriz."
 INS_volksraad_rumors_tt:0 "Tüm §YEndonezyalı §!Volksraad danışmanları bağımsızlık ilan edildikten sonra §Gtutulacak§!."
 INS_war_ongoing_tt:0 "Geçen günler: [?INS_has_gotten_invasion_event:days|Y0]"
 INS_we_will_need_another_tt:0 "Cava'nın tamamını kontrol ettiğimiz için, Cava'ya ek olarak bir eyaleti daha kontrol etmemiz gerekecek."
 INS_women_in_military:0 "Orduda Kadınlar"
 INS_women_in_military_desc:0 "Silahlı kuvvetlerimizin mümkün olduğunca güçlü olmasını sağlamak için kadınların orduda görev yapmasına izin vermek gereklidir."
 INS_womens_sufferage:0 "Kadınlara Oy Hakkı"
 INS_womens_sufferage_desc:0 "Oy hakkının kadınlara genişletilmesi kısa vadede istikrarsızlığa yol açacaktır, ancak uzun vadeli istikrar ve demokrasi için gereklidir."
 NZL_abolish_the_railways_board:0 "Demiryolları Kurulu'nu Kaldır"
 NZL_abolish_the_railways_board_desc:0 "Hükümet Demiryolları Kurulu, ağı modernize etmede etkisiz kaldı. Bu sapkınlığı kaldırmanın ve demiryollarını bakanlık kontrolüne geri döndürmenin zamanı geldi."
 NZL_bureau_of_industry_taog:0 "$NZL_bureau_of_industry$"
 NZL_bureau_of_industry_taog_desc:0 "$NZL_bureau_of_industry_desc$"
 NZL_department_of_scientific_and_industrial_research_taog:0 "$NZL_department_of_scientific_and_industrial_research$"
 NZL_department_of_scientific_and_industrial_research_taog_desc:0 "$NZL_department_of_scientific_and_industrial_research_desc$"
 NZL_direct_the_coal_industry:0 "Kömür Endüstrisini Yönet"
 NZL_direct_the_coal_industry_desc:0 "Kömür; demiryollarımız, endüstrimiz ve enerji santrallerimiz için giderek daha hayati hale geldikçe, hükümet ulusal çıkarlar doğrultusunda üretim ve dağıtımı koordine etmek için devreye girmelidir."
 NZL_domestic_car_industry:0 "Araç Montaj Fabrikalarına Yatırım Yap"
 NZL_domestic_car_industry_desc:0 "[ROOT.GetName]'deki araç üretimi, buraya nihai yapı için gönderilen yabancı üreticilerin parçalarını monte etmekle sınırlı kalmıştır. Yerli çelik üretimine yaptığımız son yatırımla, parçaları kendimiz üretmeye başlayabiliriz."
 NZL_electrification:0 "Enerji Üretimini Genişlet"
 NZL_electrification_desc:0 "Nehirlerimizden yararlanarak ve hidroelektrik üretimi genişleterek, kalıcı endüstriyel gücün temellerini atabiliriz. Yeni barajlar ve iletim hatları ülke genelinde kapasiteyi artıracak, fabrikaların, demiryollarının ve limanların ihtiyaç duydukları güce sahip olmalarını sağlayacaktır."
 NZL_establish_the_ncb:0 "Milli Kömür Kurulu'nu Kur"
 NZL_establish_the_ncb_desc:0 "Milli Kömür Kurulu'nu kurarak, ülkenin dağınık madenlerini koordineli bir yönetim altına alabilir ve demiryolları, endüstri ve enerji üretimi için istikrarlı bir yakıt arzı sağlayabiliriz. Merkezi gözetim, üretimi rasyonalize etmemize, verimliliği artırmamıza ve stratejik ihtiyaçların özel çıkarlara göre öncelikli olmasını sağlamamıza olanak tanıyacaktır."
 NZL_expand_the_university_of_auckland_taog:0 "$NZL_expand_the_university_of_auckland$"
 NZL_expand_the_university_of_auckland_taog_desc:0 "$NZL_expand_the_university_of_auckland_desc$"
 NZL_full_employment:0 "Tam İstihdam"
 NZL_full_employment_desc:0 "Sürekli kamu çalışmaları, dikkatli planlama ve istikrarlı endüstriyel genişleme yoluyla işsizlik nihayet yerini fırsata bıraktı. Bunalım yıllarının boş atölyeleri tekrar aktif hale geldi ve ulusun emeği tam olarak üretken girişimle meşgul. Güveni ve istikrarı yeniden tesis ettikten sonra, sadece iyileşmiş değil, aynı zamanda gelecekteki zorluklar için güçlenmiş olarak duruyoruz."
 NZL_industrial_conscription_taog:0 "$NZL_industrial_conscription$"
 NZL_industrial_conscription_taog_desc:0 "$NZL_industrial_conscription_desc$"
 NZL_ministry_of_public_works:0 "Kamu İşleri Bakanlığı"
 NZL_ministry_of_public_works_desc:0 "Koordineli planlama ve disiplinli yatırım yoluyla; yollar, demiryolları ve güç şemaları parça parça çaba yerine tutarlı bir ulusal stratejiye göre ilerletilecektir."
 NZL_national_broadcasting_service:0 "Milli Yayın Servisi"
 NZL_national_broadcasting_service_desc:0 "1935 seçimlerine Posta Ofisi tarafından yapılan müdahale ve devlet yayın hizmetleri üzerindeki denetimleri sonrasında, organizasyon yönetimini reforme etmemiz gerektiği açıkça görülüyor. Ayrıca, tarafından kullanılan yayın ekipmanlarını güncellemeye yatırım yapmalıyız."
 NZL_national_roads_board_taog:0 "$NZL_national_roads_board$"
 NZL_national_roads_board_taog_desc:0 "$NZL_national_roads_board_desc$"
 NZL_new_zealand_steel_taog:0 "$NZL_new_zealand_steel$"
 NZL_new_zealand_steel_taog_desc:0 "$NZL_new_zealand_steel_desc$"
 NZL_project_seal_taog:0 "$NZL_project_seal$"
 NZL_project_seal_taog_desc:0 "$NZL_project_seal_desc$"
 NZL_rail_standardization:0 "Lokomotif Standardizasyonu"
 NZL_rail_standardization_desc:0 "[ROOT.GetName], ülke genelinde değişen kalitede lokomotifler üreten bir dizi atölyeye sahiptir. Demiryolu sistemini daha verimli hale getirmek için, her biri belirli bir amaç için özelleştirilmiş, üretmeleri için bir dizi standart lokomotif kuracağız."
 NZL_rail_standardization_tt:0 "§Y[?NZL_train_var]§! birim §Y$NZL_train_equipment_1$§! ulusal stoğa eklenir."
 NZL_restart_the_onekaka_ironworks:0 "Onekaka Demir İşletmelerini Yeniden Başlat"
 NZL_restart_the_onekaka_ironworks_desc:0 "Onekaka demir işletmeleri bir zamanlar, yurt dışı tedariklerine olan bağımlılığı azaltarak demir ve çeliği yerli olarak üretme hırsımızı temsil ediyordu. Ekonomiyi canlandırmak ve ulusal güvenliği artırmak için Onekaka'nın fırınlarını bir kez daha yeniden başlatmaya yönelik ilgi var."
 NZL_scrap_metal_recycling:0 "Geri Dönüşüm Kampanyası"
 NZL_scrap_metal_recycling_desc:0 "Bizim gibi ithalat ağırlıklı bir ekonomi, stratejik kaynaklarla savurgan olma lüksüne sahip değildir. Ekonomik direncimizi güçlendirmek için metalleri ve kauçuğu işlemek ve yeniden kullanmak adına hurda geri dönüşüm tesisleri kuracağız."
 NZL_support_allies_with_meat:0 "Et Endüstrisini Kullan"
 NZL_support_allies_with_meat_desc:0 "Pasifik'teki müttefiklerimiz genellikle tedarik hatlarını sınırlarına kadar zorluyor. Baskıyı azaltmak ve askerlerini beslemek için onlara et tedarik etmeye başlayacağız."
 NZL_support_allies_with_meat_tt:0 "Her Müttefik §G1§! §YHarita Dışı Sivil Fabrika§! alacak"
 NZL_taranaki_oil_taog:0 "$NZL_taranaki_oil$"
 NZL_taranaki_oil_taog_desc:0 "$NZL_taranaki_oil_desc$"
 NZL_think_big_taog:0 "$NZL_think_big$"
 NZL_think_big_taog_desc:0 "$NZL_think_big_desc$"
 NZL_wairarapa_sheep_farms_taog:0 "$NZL_wairarapa_sheep_farms$"
 NZL_wairarapa_sheep_farms_taog_desc:0 "$NZL_wairarapa_sheep_farms_desc$"
 NZL_women_in_the_workforce:0 "İş Gücünde Kadınlar"
 NZL_women_in_the_workforce_desc:0 "İnsan gücü sıkıntısı yoğunlaştıkça, kadınlar fabrikalarda, çiftliklerde ve kamu hizmetlerinde hayati roller üstlenmek için öne çıkıyor ve üretimin savaş zamanı baskısı altında aksamamasını sağlıyor. Eğitim ve istihdam fırsatlarını genişletmek, ulusal savunmayı sürdürürken endüstriyel çıktıyı sürdürmemize olanak tanıyacaktır."
 SIA_a_constitutional_monarchy:0 "Anayasal Monarşi"
 SIA_a_constitutional_monarchy_desc:0 "Tahtın krallığı korumak için devleti domine etmesine gerek yoktur. Monarşiyi kalıcı bir anayasal uzlaşma içinde restore ederek, Taç ve halkı birbirine bağlayabilir ve kraliyet vakarının sorumlu hükümetle bir arada var olmasını sağlayabiliriz."
 SIA_a_fledgling_tobacco_industry:0 "Yeni Gelişen Tütün Endüstrisi"
 SIA_a_fledgling_tobacco_industry_desc:0 "Tütün, dağınık ve kötü organize edilmiş küçük bir ticaret olmaya devam ediyor. Mütevazı bir koruma ve dikkatli bir yatırımla, bu küçük mahsul güvenilir bir vergi geliri, kırsal gelir ve fabrika işi kaynağı haline gelebilir."
 SIA_a_fledgling_tobacco_industry_tt:0 "§Y$limited_exports$§! veya §Y$closed_economy$§! üzerinde olmak bize fazladan bir §YSivil Fabrika§! sağlayacaktır."
 SIA_a_land_war_in_asia:0 "Asya'da Bir Kara Savaşı"
 SIA_a_land_war_in_asia_desc:0 "Savaş sadece beyanlarla kazanılmayacaktır. Siyam askerleri Asya'nın zorlu arazilerinde yürüyecek, savaşacak ve dayanacaktır. Birleşik Cepheye olan bağlılığımız eylemle ölçülmelidir."
 SIA_a_modern_economy:0 "Modern Bir Ekonomi"
 SIA_a_modern_economy_desc:0 "Eski tarım düzeni bir günde yok olmaz, ancak artık [ROOT.GetNameDef]'in geleceğini tanımlayamaz. Bankalar, okullar, fabrikalar ve altyapı artık şekillenmeye başladığına göre, bağımsız modern bir ulusa layık bir ekonomi inşa etmeye başlıyoruz."
 SIA_a_more_moderate_option:0 "Daha Ilımlı Bir Seçenek"
 SIA_a_more_moderate_option_desc:0 "Reform, bir muhalefet fırtınasında kendini tüketmek yerine devam etmelidir. Sarı Dosya'yı ılımlı sınırlar içinde tutarak, aşırılık yanlılarını izole edebilir, orta sınıfları sakinleştirebilir ve ilk zaferinden sağ çıkacak bir sivil düzen inşa edebiliriz."
 SIA_a_new_dawn_over_asia:0 "Asya Üzerinde Yeni Bir Şafak"
 SIA_a_new_dawn_over_asia_desc:0 "Japon imparatorluğu düştü ve kalıntılarını miras almaya çalışan yozlaşmış güçler bir kenara atıldı. Asya genelinde, geleceğini emperyalist tahakkümden uzak inşa etmeye kararlı uluslar üzerinde yeni bir şafak yükseliyor."
 SIA_a_new_drydock:0 "Yeni Bir Kuru Havuz"
 SIA_a_new_drydock_desc:0 "Ciddi deniz bakımı modern bir kuru havuz gerektirir. O olmadan, daha büyük gemilerin bakımı yavaş, verimsiz kalır ve yabancı yardıma bağımlı olur. Yeni bir kuru havuz, [ROOT.GetNameDef]'e kendi deniz geleceği üzerinde daha sağlam bir kavrama sağlayacaktır."
 SIA_a_race_against_time:0 "Zamana Karşı Yarış"
 SIA_a_race_against_time_desc:0 "Donanmamız modası geçmiş, yetersiz finanse edilmiş ve modern savaşa hazırlıksız. Fonlar derhal gemi inşasına, refitlere, kıyı savunmasına ve deniz eğitimine yönlendirilmelidir. Saat, tersanelerimizden daha hızlı işliyor."
 SIA_a_race_against_time_tt:0 "Ruh hali sona erdikten sonra kazanılacak: "
 SIA_a_race_against_time_tt2:0 "§Y280§! gün boyunca"
 SIA_accept_a_japanese_technical_mission:0 "Bir Japon Teknik Görevini Kabul Edin"
 SIA_accept_a_japanese_technical_mission_desc:0 "Tokyo hızlı bir şekilde edinebileceğimiz eğitmenler, teknik kılavuzlar ve uçaklar sunuyor. Kabul edersek hız kazanırız. Ayrıca bağımlılık da kazanıyoruz."
 SIA_achieve_domestic_legitimacy:0 "Ulusal Meşruiyet Kazan"
 SIA_achieve_domestic_legitimacy_desc:0 "Hükümet silah zoruyla hayatta kaldı, ancak şimdi hukuk, ekmek ve düzenle kazanmalıdır. Kamu güveni yeniden tesis edilmeli, acil durum önlemleri gerekçelendirilmeli ve halk sivil yönetimin sadece hayatta kalmaktan fazlasını sunduğunu görmelidir."
 SIA_achieve_domestic_legitimacy_tt:0 "§YKhana Ratsadon Sistemi§! devre dışı bırakılacak.\n§YAskeri Kanat§! kalıcı olarak feshedilecek ve ruhu tamamen kaldırılacak.\n\n§YSivil Kanat§! kalıcı olarak §Y$idea_SIA_unwavering_civilian_support$§! şeklinde yeniden yapılandırılacak."
 SIA_achieve_foreign_legitimacy:0 "Uluslararası Meşruiyet Kazan"
 SIA_achieve_foreign_legitimacy_desc:0 "Yabancı güçler krizimizi şüpheyle izlediler, Siyam'ın cunta yönetimine mi yoksa devrime mi düşeceğini görmek için beklediler. Sivil hükümetin istikrarlı, yasal ve ülkeyi savunabilecek kapasitede olduğunu kanıtlamalıyız."
 SIA_achieve_foreign_legitimacy_trigger:0 "Herhangi bir Büyük Gücün bize karşı §Y75§!'den fazla görüşü var"
 SIA_achieve_foreign_legitimacy_tt:0 "Bize karşı §Y75§!'den fazla görüşü olan her büyük ülke için §G[?var:SIA_achieve_foreign_legitimacy_base_stab_gain|%.0]§! istikrar kazanın.\n\nEğer §Y3§!'ten fazla büyük ülke uygunsa, o limitin ötesindeki her uygun büyük ülke için §Y1x§! §G50%§! Maliyet İndirimi: §YKara Doktrini§! kazanacağız.\n\nEğer §Y6§! veya daha fazla büyük ülke uygunsa, §G+2§! §YSivil Fabrika§! kazanacağız."
 SIA_acquire_light_tools:0 "Hafif Aletler Edin"
 SIA_acquire_light_tools_desc:0 "Harika makineler üretmeden önce, endüstrinin mütevazı aletlerinde ustalaşmalıyız. Hafif aletlerin ve atölye ekipmanlarının ithalatı, [ROOT.GetName] genelinde küçük fabrikaların ve tamirhanelerin çoğalmasına olanak tanıyacaktır."
 SIA_acquire_submarines:0 "Denizaltı Edin"
 SIA_acquire_submarines_desc:0 "Denizaltılar, küçük bir donanmaya gücünün üzerinde vurma şansı sunar. Dalgaların altında saklı kalarak; ticareti tehdit edebilir, daha güçlü filoları caydırabilir ve kıyımıza karşı her türlü düşmanca tasarımı karmaşıklaştırabilirler. [ROOT.GetNameDefCap] böyle bir silahı ihmal etmemelidir."
 SIA_aid_for_resources:0 "Kaynaklar İçin Yardım"
 SIA_aid_for_resources_desc:0 "Ulusumuz, yabancı güçlerin arzuladığı kaynaklara sahip ve onların sağlayabileceği belirli aletlerden yoksun. Kaynaklar için sağduyulu bir yardım alışverişi, [ROOT.GetNameDef]'i beslemeye yardımcı olurken servetimizin kendi korunmamıza katkıda bulunmasını sağlayacaktır."
 SIA_aid_for_resources_tt:0 "[JAP.GetNameDef]'ten savaşımıza katılmasını isteyeceğiz, karşılığında §Y[724.GetName]§!'deki kauçuk için kaynak haklarını onlara vereceğiz!"
 SIA_air_cooperation_france:0 "Hava İşbirliği"
 SIA_air_cooperation_japan:0 "Hava İşbirliği"
 SIA_air_cooperation_usa:0 "Hava İşbirliği"
 SIA_air_defense_of_the_kra:0 "Kra Kıstağı'nın Hava Savunması"
 SIA_air_defense_of_the_kra_desc:0 "Güney Tayland, Malaya ve Burma arasındaki bağlantı noktasıdır. Yarımadada hareket eden herhangi bir güç, Tayland hava alanları, uyarı direkleri ve önleyicilerle yüzleşmek zorundadır. Başkalarının topraklarına ulaşmak yerine kendi topraklarımızın üzerindeki gökleri tutacağız."
 SIA_aligned_with_japan_tt:0 "[JAP.GetNameDef] ile müttefikiz veya boyun eğdiğimiz güç onlar."
 SIA_all_weather_roads:0 "Her Hava Koşuluna Uygun Yollar"
 SIA_all_weather_roads_desc:0 "Çok fazla yol yağmurlarla birlikte kayboluyor, eyaletleri başkentten ve pazarlardan koparıyor. Her hava koşuluna uygun bir yol ağı, krallığı birbirine bağlayacak ve malların ve askerlerin her mevsimde hareket etmesini sağlayacaktır."
 SIA_allies_integration:0 "Müttefik Entegrasyonu"
 SIA_allies_integration_desc:0 "Kuvvetlerimiz Müttefiklerin yanında savaşmayı öğrenmeli. Komuta yapıları, iletişim, tedarik prosedürleri ve ekipman standartları, Siyam sembolik bir ortaktan fazlası haline gelmeden önce hizaya getirilmelidir."
 SIA_american_investment_aid:0 "Amerikan Yatırım Yardımı"
 SIA_american_investment_aid_desc:0 "Amerika Birleşik Devletleri, kendi bölgemizde mevcut olandan daha fazla servete sahiptir. Eğer gizli ve ulusal çabalarımız için Amerikan yardımı ve yatırımını güvence altına alabilirsek, [ROOT.GetNameDef] zorluklara dayanmak ve kurtuluşa hazırlanmak için gerekli maddi imkanları kazanacaktır."
 SIA_an_absolute_monarchy:0 "Mutlak Monarşi"
 SIA_an_absolute_monarchy_desc:0 "Sınırlı monarşi deneyi sadece aşağılanma, darbeler ve kraliyet otoritesinin hırslı subaylar tarafından gasp edilmesine yol açtı. Eğer taht tekrar sadakat kazanacaksa, Tacın tam imtiyazlarını geri kazanması ve partilere veya parlamentoya tabi olmadan hüküm sürmesi gerekir."
 SIA_ananda_age_trigger_12:0 "Kral Ananda en az §Y12§! yaşında (Şu anda §Y[?var:SIA_anandas_age]§!). Doğum günü 20 Eylül"
 SIA_ananda_age_trigger_15:0 "Kral Ananda en az §Y15§! yaşında (Şu anda §Y[?var:SIA_anandas_age]§!). Doğum günü 20 Eylül"
 SIA_ananda_trait_tt:0 "Ananda tahta çıktığında şunları alacak: "
 SIA_and_spring_the_trap:0 "Ve Tuzağı Kurmak"
 SIA_and_spring_the_trap_desc:0 "Generaller yemi yuttu. Öfkeleri isyana dönüştü, isyanları hırslarını açığa çıkardı ve sivil hükümet buna hazırdı. Şimdi tuzak kapanıyor ve [ROOT.GetName]'in geleceği anayasaya sadık olanlar tarafından belirlenecek."
 SIA_and_spring_the_trap_tt:0 "Toplam desteğimiz §Y80%§! üzerindeyse bir iç savaştan kaçınacağız ve orduyu anında görevden alacağız."
 SIA_artillery_reigns_supreme:0 "Topçu Hüküm Sürer"
 SIA_artillery_reigns_supreme_desc:0 "Modern savaş sadece ruhla kazanılmaz. Top, savaş alanının kralı olarak kalmaya devam ediyor; güçlü noktaları kırıyor, saldırıları dağıtıyor ve piyadelerimizin yolunu açıyor. Eğer zafere ulaşacaksak, [ROOT.GetAdjective] ateş gücü hem bol hem de hassas olmalıdır."
 SIA_as_the_eyes_turn_towards_southeast_asia:0 "Gözler Asya'ya Döndüğünde"
 SIA_as_the_eyes_turn_towards_southeast_asia_desc:0 "Güneydoğu Asya artık uzak bir tiyatro değil. İmparatorluğun, devrimin ve savaşın kavşağıdır. [SIA.GetName], bu mücadelede bir piyon mu yoksa kendi tasarımları olan bir güç mü olacağına karar vermelidir."
 SIA_ascend_the_throne:0 "Tahta Çıkış"
 SIA_ascend_the_throne_desc:0 "Vekillik yılları sonsuza kadar süremez. Ananda artık krallık yükünü bizzat üstlenecek yaşta ve resmi tahta çıkışı, restore edilmiş monarşinin vesayet ve entrikadan yeni ve meşru bir saltanata geçmesine izin verecektir."
 SIA_asian_democratic_compact:0 "Asya Demokratik Paktı"
 SIA_asian_democratic_compact_desc:0 "Asya sonsuza dek uzak imparatorluklara veya büyük güç vaatlerine güvenemez. Bölgenin demokratik ulusları bir arada durmalı, birbirlerini savunmalı ve bağımsızlık ile özgürlüğün Asya'da yaşayabileceğini kanıtlamalıdır."
 SIA_asian_democratic_compact_modify:0 "§Y$SIA_asian_democratic_compact$§! unsurunu şu şekilde değiştirir:"
 SIA_asian_democratic_compact_tt:0 "Asya'daki bağlı devletler için bağımsızlık talep etme yeteneğinin kilidini açar ve onları ittifakımıza davet etmemize izin verir."
 SIA_asian_financial_compact:0 "Asya Mali Paktı"
 SIA_asian_financial_compact_desc:0 "Avrupa sermayesi hala Asya ticaretinin çoğuna hükmediyor ve ekonomimizi dış baskılara açık bırakıyor. Komşularımızla daha yakın mali düzenlemeler arayarak, bağımsızlığımızdan taviz vermeden kredi, pazar ve yatırıma erişimimizi genişletebiliriz."
 SIA_ask_for_the_release_of_american_commodities:0 "Amerikan Emtialarının Serbest Bırakılmasını İste"
 SIA_ask_for_the_release_of_american_commodities_desc:0 "Amerikan stokları, makineleri ve malları ulusumuzun ihtiyaç duyduğu nefes alanını sağlayabilir. Dikkatli diplomasi ile bu emtiaların serbest bırakılmasını talep edebilir, kıtlıkları hafifletebilir ve savaş çabamızın maddi temelini güçlendirebiliriz."
 SIA_baht_stabilization_act:0 "Baht İstikrar Yasası"
 SIA_baht_stabilization_act_desc:0 "Modern bir ekonomi, tüccarların güvendiği ve yatırımcıların kabul ettiği bir para birimi gerektirir. Bahtı istikrara kavuşturmak, ticaretteki belirsizliği azaltacak ve [ROOT.GetNameDef]'e uluslararası pazarda daha sağlam bir temel kazandıracaktır."
 SIA_boon_rawd_brewery:0 "Boon Rawd Bira Fabrikası"
 SIA_boon_rawd_brewery_desc:0 "Yerli bir bira endüstrisi, bir tüketim meselesinden daha fazlasıdır. Boon Rawd gibi işletmeler, Siyam sermayesinin, makinesinin ve yönetiminin Siyam topraklarında modern endüstri yaratabileceğini gösteriyor."
 SIA_breaking_the_burmese_line:0 "Burma Hattını Kır"
 SIA_breaking_the_burmese_line_desc:0 "Burma, hırslarımız ile ötesindeki topraklar arasında bir engel olarak duruyor. Eğer [ROOT.GetAdjective] silahları değerlerini kanıtlayacaksa, oradaki düşman hattı kararlılık, planlama ve güç yoğun kullanımıyla kırılmalıdır."
 SIA_broadcast_weather_reports_to_the_allies:0 "Müttefiklere Hava Durumu Raporları Yayınla"
 SIA_broadcast_weather_reports_to_the_allies_desc:0 "Bölgenin gökyüzü ve denizleri, filolar ve ordular kadar hava durumu tarafından da yönetilir. [ROOT.GetNameDef]'ten gelen güvenilir raporlar, Müttefik planlamasına yardımcı olabilir, operasyonlarını sürprizlerden koruyabilir ve vatanımızı savaşta sessiz ama değerli bir ortak haline getirebilir."
 SIA_built_to_withstand_every_flame:0 "Her Alevle Başa Çıkacak Şekilde İnşa Edildi"
 SIA_built_to_withstand_every_flame_desc:0 "Bir gecede yanan fabrika, ulusa sabah hizmet edemez. Depolarımız, fabrikalarımız ve atölyelerimiz; sabotaj, bombalama veya kazanın üretimi bu kadar kolay sakatlayamaması için dağıtma, yangın koruma ve acil durum koruması düşünülerek inşa edilmelidir."
 SIA_buy_submarines_tt:0 "§Y4§! $TARGET$ §YErken Denizaltı§! kazan."
 SIA_buy_thonburi_class_tt:0 "§Y2§! $TARGET$ §YKıyı Savunma Gemisi§! ve bir §YMuhrip§! kazan."
 SIA_camouflage:0 "Kamuflaj"
 SIA_camouflage_desc:0 "Eğer gökyüzüne sahip olamazsak, düşmanın onun altına saldırmaya değer herhangi bir şeyden mahrum kalacağız. Ağlar, dağılım ve gece hareket disiplini, sütunlarımızı yukarıdaki gözlerden gizleyecek ve yanlarında talim yaptığımız topçular, her geçişi maliyetli hale getirecek."
 SIA_census_the_hill_tribes:0 "Dağ Kabilelerinin Nüfus Sayımı"
 SIA_census_the_hill_tribes_desc:0 "Yayla bölgeleri yönetim, vergilendirme ve tedarikin tam erişiminin ötesinde kalmaya devam ediyor. Düzgün bir nüfus sayımı, hükümete bu bölgeleri daha etkili bir şekilde yönetmek ve insanlarını ve kaynaklarını ulusun daha geniş yaşamına dahil etmek için gereken bilgiyi verecektir."
 SIA_chemical_imports:0 "Kimyasal İthalatı"
 SIA_chemical_imports_desc:0 "Modern tarım ve endüstri, henüz yeterli miktarda üretmediğimiz bileşiklere bağlıdır. Kimyasalların ithalatı, yerli endüstri görevi devralana kadar gübre, ilaç, boya ve patlayıcı sağlayacaktır."
 SIA_chemical_imports_tt:0 "Bu milli hedef tamamlandığında görüş §Y[?var:ROOT.SIA_chemical_imports_opinion_threshold]§! üzerindeyse harita dışı §G+1§! §YSivil Fabrika§! ekle."
 SIA_choose_new_leader_tt:0 "Eski rejimin yıkılmasıyla birlikte galipler, yeni hükümetin başına kimin geçeceğini seçmeli."
 SIA_civil_nationalism:0 "Sivil Milliyetçilik"
 SIA_civil_nationalism_desc:0 "Her Taylandlı, statüsü ne olursa olsun, sadakatinin bir hükümete veya bir kişiye değil, kimin iktidar tahtında oturduğuna bakılmaksızın özgürlük, bağımsızlık ve eşitlik değerlerini savunmaya olması gerektiğini bilmelidir."
 SIA_civil_service_heroism:0 "Kamu Hizmeti Kahramanlığı"
 SIA_civil_service_heroism_desc:0 "Her Taylandlıya, herhangi bir yabancı veya yerel güç bu iktidarı kendileri için ele geçirmeye çalışırsa, hukukun üstünlüğünü korumak için doğal bir görev aşılanmalıdır. Sadece biri özgürlüklerimizi elimizden almaya çalışırsa halkın desteğine ihtiyacımız yok, halkın kendisinin standart taşıyıcılar olarak hareket etmesine ihtiyacımız var."
 SIA_conserve_air_crews:0 "Hava Ekiplerini Koruyun"
 SIA_conserve_air_crews_desc:0 "Havaalanındaki her tamirci, cephede olmayan bir tüfekçidir. Hava kolumuzu yalın olarak çalıştıracağız, bu insan gücünü orduya serbest bırakacağız ve bunun için uçaklarımızın daha sık arızalanacağını kabul edeceğiz."
 SIA_constitutional_virtue:0 "Anayasal Erdem"
 SIA_constitutional_virtue_desc:0 "Hukuka saygı duyan bir monarşinin devrilmesi daha zordur ve savunulması daha kolaydır. Rangsit'in rehberliğinde, anayasal hükümeti canlandıracak, keyfi gücü kısıtlayacak ve ulusa Tacın en güvenli halinin yasal özgürlüğün koruyucusu olarak durduğunda olduğunu öğreteceğiz."
 SIA_contact_the_south_east_asia_command:0 "Güneydoğu Asya Komutanlığı ile İletişime Geç"
 SIA_contact_the_south_east_asia_command_desc:0 "Eğer direniş cesur jestlerden fazlasını ifade edecekse, daha geniş bir stratejiye bağlanmalıdır. Güneydoğu Asya'daki Müttefik komutanlığı ile temas kurarak, [ROOT.GetName]'in vatanseverleri rehberlik, erzak ve daha büyük mücadelede bir yer elde edebilir."
 SIA_contingency_funds:0 "Acil Durum Fonları"
 SIA_contingency_funds_desc:0 "Barış dönemindeki refah, devlet kriz anına hazırlıksız girerse çok az değer taşır. Şimdi acil durum fonlarını bir kenara ayırarak; abluka, hasat başarısızlığı veya ani savaşın hükümet mekanizmasını hemen durdurmamasını sağlıyoruz."
 SIA_contingency_funds_tt:0 "Barış zamanında bir acil durum fonu toplayacağız. Bu fonu toplarken makul miktarda §YTüketim Malları Faktörü§! kazanacağız.\n\nSavaş sırasında, seçersek bu fonu serbest bırakabilir ve büyük bir üretim bonusu kazanabiliriz.\nFonun ne kadar süreceği, serbest bırakmadan önce fonu ne kadar süre topladığımıza bağlıdır."
 SIA_controls_all_indochina_tt:0 "§YIndochina§!'nin tamamını kontrol ediyoruz"
 SIA_conventional_tank_construction:0 "Geleneksel Tank İnşası"
 SIA_conventional_tank_construction_desc:0 "Zırh modern savaşın kabul görmüş bir kolu haline geldi ve derme çatma çözümler bizi sadece bir yere kadar taşıyacaktır. Sağlam ilkelere, standart tasarımlara ve modern bir orduya layık güvenilir üretim yöntemlerine dayalı uygun bir tank endüstrisi kurmalıyız."
 SIA_countries_that_like_me_doctrine_tt:0 "§Y[?var:SIA_countries_that_like_me]x§! §G50%§! Maliyet İndirimi: §YKara Doktrini§!"
 SIA_crack_down_of_foreign_merchants:0 "Yabancı Tüccarlara Karşı Önlem"
 SIA_crack_down_of_foreign_merchants_desc:0 "Ticaret uzun zamandır dış çıkarlar tarafından şekillendirildi ve ulusal direncimizi etkileyebilecek güvenlik açıkları yarattı. Ekonomik güvenliğimizi korumak için, refah ve istikrarın kendi kontrol ettiğimiz bir temel üzerine inşa edilmesini sağlayarak kendi ticaretimizi kontrol edebilmeliyiz."
 SIA_death_to_the_communists:0 "Komünistlere Ölüm"
 SIA_death_to_the_communists_desc:0 "Askeri kliğin yenilgisi başka bir tiranlığa kapı açmamalıdır. Komünist ajitatörler krizin devleti zayıflattığına inanıyor. Sivil demokrasinin savunmasız olmadığını yakında öğrenecekler."
 SIA_death_to_the_nationalists:0 "Milliyetçilere Ölüm"
 SIA_death_to_the_nationalists_desc:0 "Japonya geri püskürtüldü, ancak Asya'nın geleceği sorusu devam ediyor. Eski milliyetçi düzen sadece bir hiyerarşiyi diğeriyle değiştirecek. Asya yeniden inşa edilecekse, komünistler galip gelmelidir."
 SIA_decrease_civilian_approval_2_tt:0 "§YSivil§! kanadın onayını §RBüyük Bir Miktar§! azaltır"
 SIA_decrease_civilian_approval_3_tt:0 "§YSivil§! kanadın onayını §RÇok Büyük Bir Miktar§! azaltır"
 SIA_decrease_civilian_approval_tt:0 "§YSivil§! kanadın onayını §RKüçük Bir Miktar§! azaltır"
 SIA_decrease_military_approval_2_tt:0 "§YAskeri§! kanadın onayını §RBüyük Bir Miktar§! azaltır"
 SIA_decrease_military_approval_3_tt:0 "§YAskeri§! kanadın onayını §RÇok Büyük Bir Miktar§! azaltır"
 SIA_decrease_military_approval_tt:0 "§YAskeri§! kanadın onayını §RKüçük Bir Miktar§! azaltır"
 SIA_defenders_of_constitutional_liberty:0 "Anayasal Özgürlüğün Savunucuları"
 SIA_defenders_of_constitutional_liberty_desc:0 "Öğretmenler, Bankacılar, Hemşireler - eğitimli orta katman, askeri kanat çok ileri giderse özgürlüğü savunmak için harekete geçirilebilir."
 SIA_deficit_spending:0 "Bütçe Açığıyla Harcama"
 SIA_deficit_spending_desc:0 "Ortodoks muhasebe, tehlikeli bir dünyayı karşılamak için zamanında modern bir ekonomi inşa etmeyecektir. Devlet, endüstriyel büyümeyi harekete geçirmek için kamu işlerini ve tedarikini kullanarak, cari gelirlerin ötesinde harcama yapmaya istekli olmalıdır."
 SIA_deficit_spending_tt:0 "Ruh hali sona erdikten sonra kazanılacak: "
 SIA_dem_event_count_cw_scale_tt:0 "§YTahmini Mevcut Destek§!: §G[?var:SIA_dem_event_count_cw_scale|%]§!"
 SIA_demand_repatriation:0 "Geri Gönderme Talebi"
 SIA_demand_repatriation_desc:0 "Topraklarımıza gereklilik bahanesiyle girenler, [ROOT.GetNameDef]'e borçlanmışlardır. Şansımız arttığında, alınanların iadesini talep etmeli ve işgalciye girişinin maliyetini ödetmesi için baskı yapmalıyız."
 SIA_demand_the_return_of_lost_territory:0 "Kaybedilen Toprakların İadesini Talep Et"
 SIA_demand_the_return_of_lost_territory_desc:0 "[FRA.GetNameDefCap] zayıflığını gösterdi; hala sahip olduğu sönmekte olan etkiye tutunan kağıttan bir kaplandan biraz daha fazlası. Silahlı kuvvetlerinin çöküşüyle artık bir zamanlar sahip olduğu gücü yansıtamıyor ve taleplerimize karşı çıkacak bir konumda değil."
 SIA_demand_the_return_of_lost_territory_tt:0 "§YÇinhindi§! ve §Y[MAL.GetName]§! parçalarının sahiplerinden §Y[1069.Getname]§!, §Y[1067.Getname]§!, §Y[741.Getname]§!, §Y[1068.Getname]§!, §Y[1061.Getname]§!, §Y[1064.Getname]§!, §Y[1065.Getname]§! ve §Y[670.Getname]§!'i bize iade etmelerini isteyeceğiz.\n\nEtkileyen faktörler:\n-Sahibine kıyasla en az %30 Savaş Gücü\n-Sahibi bir büyük güçle savaşta\n-Sahibi bir ittifakta değil\n-Sahibi §YVichy Fransası§!\n-Biz bir ittifaktayız\n-Sahibi bizden hoşlanmıyor"
 SIA_department_of_publicity:0 "Tanıtım Departmanı"
 SIA_department_of_publicity_desc:0 "Bir propaganda makinesi her devlet için zorunludur, özellikle de bizimki gibi bölgesel hırsları olan bir devlet için. Bir tanıtım departmanını finanse etmek, bunu başarmamızı sağlayacaktır."
 SIA_destroy_the_indochinese_ports:0 "Çinhindi Limanlarını Yok Edin"
 SIA_destroy_the_indochinese_ports_desc:0 "Çinhindi limanları, bize karşı herhangi bir düşman saldırısının dayandığı menteşelerdir. İster savaşın başlangıcında bir bombardıman saldırısıyla, ister ilk atıştan çok önce sessizce yerleştirilen saldırılarla, bunların yok edilmesini hava silahımızın daimi hedefi haline getireceğiz."
 SIA_destroy_the_indochinese_ports_planes_bba_tt:0 "Ulusal stokta §Y30§! §YB-17 Uçan Kale§! ve §Y20§! §YP-38 Yıldırım§! kazanın."
 SIA_destroy_the_indochinese_ports_planes_legacy_tt:0 "Kazanç §Y30§! §Y$strat_bomber_equipment_1$§! ve §Y20§! §Y$heavy_fighter_equipment_1$§! ulusal stokta."
 SIA_destroy_the_indochinese_ports_raid_tt:0 "§YRaid Çinhindi Limanı§! hava saldırısının kilidini açar."
 SIA_destroy_the_indochinese_ports_tt:0 "§YÇinhindi Limanlarını Sabote Etme§! istihbarat operasyonunun kilidini açar."
 SIA_direct_army_fundings_towards_the_navy:0 "Ordu Fonlarını Donanmaya Yönlendir"
 SIA_direct_army_fundings_towards_the_navy_desc:0 "Ordu, uzun zamandır askeri harcamaların aslan payını yedi, ancak [ROOT.GetNameDef]'in stratejik ihtiyaçları sadece kıtasal değildir. Fonları filoya kaydırarak, bu dengesizliği düzeltmeye başlayabilir ve ticaretimizi ve kıyımızı koruyan denizleri güvence altına alabiliriz."
 SIA_direct_funds_from_the_military_towards_development:0 "Askeri Fonları Kalkınmaya Yönlendir"
 SIA_direct_funds_from_the_military_towards_development_desc:0 "Askeri Kanat, fonlarının kalkınmaya yönlendirilmesinden memnun olmayacak olsa da, bu yatırım eksikliğinin halka neden nihayetinde faydalı olduğunu açıklamak bizim değil, onların sorumluluğunda olacaktır."
 SIA_directorate_of_aeronautical_engineering_desc:0 "[ROOT.GetNameDef]'in hava kolunun geleceği sadece pilotlarla güvence altına alınmayacaktır. Mühendisler, müfettişler, atölyeler ve yabancı alımları hizmet edilebilir uçaklara dönüştürebilecek merkezi bir otorite gerektirir. Havacılık Mühendisliği Müdürlüğü bu çabanın temeli olacaktır."
 SIA_directorate_of_aeronautical_engineering_focus:0 "$idea_SIA_aeronautical_engineering_directorate$"
 SIA_directorate_of_aeronautical_engineering_focus_desc:0 "$SIA_directorate_of_aeronautical_engineering_desc$"
 SIA_diversity_foreign_reserves:0 "Döviz Rezervlerini Çeşitlendir"
 SIA_diversity_foreign_reserves_desc:0 " [ROOT.GetNameDef]'in mali güvenliğini tek bir yabancı gücün para birimine veya kredisine emanet etmesi tehlikelidir. Rezervlerimizi çeşitlendirerek, dış şok riskini azaltıyor ve ticaret ve diplomaside daha fazla hareket özgürlüğü koruyoruz."
 SIA_diversity_foreign_reserves_tt:0 "Savaşa girerken fazladan §G2§! harita dışı §YAskeri Fabrika§! ekle.\nSavaşa girerken rastgele bir çekirdek eyalette §G8§! Çelik Üretimi ekle."
 SIA_domestic_arms_industry:0 "Yerli Silah Endüstrisi"
 SIA_domestic_arms_industry_desc:0 "İthal edilen her tüfek ve mermiyi kendi başına yapamayan bir krallık kendine güvenli diyemez. Başlangıçları ne kadar mütevazı olursa olsun, yerli bir silah endüstrisi [ROOT.GetNameDef]'in askerlerini kendi atölyelerinden silahlandırmasına ve yabancı kaynaklar başarısız olduğunda dayanmasına olanak tanıyacaktır."
 SIA_domestic_tin_smelters:0 "Yerli Kalay İzabe Tesisleri"
 SIA_domestic_tin_smelters_desc:0 "Topraktan cevher çıkarıp yurt dışına göndermek artık yeterli değil. Yerli kalay izabe tesisleri inşa ederek, kaynaklarımızın değerinin daha fazlasını evde tutuyor ve hem ticaret hem de savaş için gerekli endüstriyel bir metali güvence altına alıyoruz."
 SIA_dominate_public_symbols:0 "Kamusal Sembollere Hakim Ol"
 SIA_dominate_public_symbols_desc:0 "Askeri Kanat, uzun zamandır heykeller dikerek ve kendilerini kutlayan resmi tatiller ilan ederek kamusal sembollere hakim oldu. Bunu, Halkın kendi kaderini tayin hakkını ve eski otokrasiye karşı zaferini kutlayan kendi sembollerimizi oluşturarak dengelememiz gerekiyor."
 SIA_drum_up_irredentism:0 "İrredentizmi Körükle"
 SIA_drum_up_irredentism_desc:0 "Gelecekteki bir savaş için ordunun desteğini almak yeterli değil, aynı zamanda genel nüfusun desteğini de kazanmalıyız. Şiirler, filmler ve konuşmalar aracılığıyla [SIA.GetName]'i, tarihi topraklarımızı çalan emperyalist güçlerle hesaplaşmaya hazırlayacağız."
 SIA_embed_technocrats_in_civilian_institutions:0 "Teknokratları Sivil Kurumlara Yerleştir"
 SIA_embed_technocrats_in_civilian_institutions_desc:0 "Hükümetteki teknokratlarla ittifaklar kurabilir, onları sivil kanadın daha uzağa ulaşmak ve ordunun etkisini dengelemek için kolunun bir uzantısı olarak kullanabiliriz."
 SIA_empower_the_coastguard:0 "Sahil Güvenliği Güçlendir"
 SIA_empower_the_coastguard_desc:0 "Filo her yerde aynı anda bulunamaz ve kıyı güvenliğinin birçok görevi daha hafif hizmetler tarafından daha iyi yürütülür. Güçlendirilmiş bir sahil güvenlik; balıkçılığımızı koruyacak, kıyılarımızı denetleyecek ve donanmayı daha ağır tehditlerle ilgilenmek için serbest bırakacaktır."
 SIA_end_factionalism:0 "Gruplaşmayı Sona Erdir"
 SIA_end_factionalism_available_tt:0 "Hem §YSivil Kanat§! hem de §YAskeri Kanat§! üst üste §Y270§! gün boyunca §GFull Support§! seviyesinde kaldı."
 SIA_end_factionalism_desc:0 "Khana Ratsadon'un askeri ve sivil kanatları arasındaki uçurum, devrimden bu yana alınan her karara gölge düşürdü. Eğer her iki ittifakı da yeterince uzun süre hükümetin arkasında kararlılıkla tutabilirsek, nihayet onları tek bir birleşik Halk Partisi'nde eritebilir ve darbe hayaletini sonsuza dek ortadan kaldırabiliriz."
 SIA_end_factionalism_tt:0 "Khana Ratsadon içindeki klik rekabeti sona erdi:\n   §YSivil§! ve §YAskeri§! kanatlar bir §Gbirleşik Halk Partisi§! içinde feshedildi\n   Şu ruhu kazan: §Y$idea_SIA_unified_khana_ratsadon$§!"
 SIA_end_military_grift:0 "Askeri Yolsuzluğu Bitir"
 SIA_end_military_grift_desc:0 "Askeri bütçeler çok uzun süredir özel servetleri, adam kayırmacılığı ve işe yaramaz prestij projelerini besledi. Savaş çürümüşlüğü ortaya çıkardı. Her yozlaşmış sözleşme, hayalet birlik ve çalınan sevkiyat soruşturulmalı ve eski klikten arındırılmalıdır."
 SIA_establish_the_foundry_and_machine_shop:0 "Dökümhane ve Makine Atölyesini Kur"
 SIA_establish_the_foundry_and_machine_shop_desc:0 "Egemen bir donanma, ithal parçalardan monte edilen gövdelerden fazlasını gerektirir. Kendi dökümhanemizi ve makine atölyemizi kurarak; [ROOT.GetNameDef]'in savaş gemilerinin hayati bileşenlerini evde dökme, şekillendirme ve onarma becerisini sağlayan endüstriyel sinirleri güçlendireceğiz."
 SIA_exclusivity_resource_contract:0 "Münhasır Kaynak Sözleşmesi"
 SIA_exclusivity_resource_contract_desc:0 "Tek bir yabancı ortak, kaynaklarımıza ayrıcalıklı erişim karşılığında sermaye ve garantili alım sunuyor. Böyle bir münhasır sözleşme kalkınmayı hızlandırabilir, ancak [ROOT.GetNameDef]'in geleceğinin bir parçasını başka bir ulusun iştahına bağlar."
 SIA_expand_aircraft_workshops:0 "Uçak Atölyelerini Genişlet"
 SIA_expand_aircraft_workshops_desc:0 "Müdürlük; ofislerden ve denetim belgelerinden fazlasını gerektirir. Yeni atölyeler, makine aletleri ve eğitimli teknisyenler hasarlı uçakların yerel olarak onarılmasına izin verecek, basit bileşenler yabancı teslimatları beklemeden üretilebilecektir."
 SIA_expand_domestic_arms_workshops:0 "Yerel Silah Atölyelerini Genişlet"
 SIA_expand_domestic_arms_workshops_desc:0 "Savaş malzemesi üretme konusundaki yerel yeteneğimiz, diğer gelişmiş ülkelerin acınası bir şekilde gerisinde. Kuvvetlerimizin sürekli olarak yeni ekipman almasını sağlamak için ev topraklarında askeri üretime odaklanmamız gerekiyor."
 SIA_expand_don_mueang:0 "Don Mueang Hava Üssünü Genişletin"
 SIA_expand_don_mueang_desc:0 "Don Mueang hava kollarımızın atan kalbidir. Yeni pistler, hangarlar ve depolar burayı modern hava kuvvetlerine layık bir üs ve filolarımızın üzerinde şekillendiği örs haline getirecek."
 SIA_expand_the_slipways:0 "Kızakları Genişlet"
 SIA_expand_the_slipways_desc:0 "Mevcut tesislerimiz, artık şekillenmekte olan hırslar için çok dar. Kızakları büyüterek; gemi inşa ve onarım kapasitemizi artıracak, filonun boyut ve hazırlık açısından büyümesine izin vereceğiz."
 SIA_expand_upon_the_dossier:0 "Dosyayı Genişlet"
 SIA_expand_upon_the_dossier_desc:0 "Sarı Dosya kırılgan bir an için yazılmıştı. O an geçti. Askeri klik yenildiğine göre, daha ileri gidebiliriz: daha derin toprak reformu, daha güçlü işçi korumaları ve Siyam'ı temelden yeniden şekillendirebilecek bir devlet."
 SIA_facilitate_prajadhipoks_move_to_japan:0 "Prajadhipok'un Japonya'ya Taşınmasını Kolaylaştır"
 SIA_facilitate_prajadhipoks_move_to_japan_desc:0 "Britanya, [ROOT.GetNameDef]'teki kargaşadan kar elde edebilecek tek güç değil. Prajadhipok'un Japonya'ya geçişini ayarlayarak, Tokyo'nun lütfunu ve hatta bir kralcı ayaklanma iç savaşa dönüşürse tümenlerin hazır olacağına dair bir güvence alabiliriz."
 SIA_facilitate_prajadhipoks_move_to_japan_tt:0 "[JAP.GetNameDef]'den 3 Korucu Tümeni iç savaş sırasında bizi destekleyecek."
 SIA_factionalism_overcome:0 "Gruplaşmanın üstesinden gelindi"
 SIA_farmers_into_the_city:0 "Şehre Çiftçiler"
 SIA_farmers_into_the_city_desc:0 "Modern bir ekonomi sadece köy iş gücü ile sürdürülemez. Endüstri genişledikçe, devlet çeltik tarlalarından şehirlere düzenli göçü teşvik etmeli, burada yeni bir kentsel iş gücü oluşturulmalıdır."
 SIA_fighter_type_12_conversion:0 "Tip 12 Eğitimi"
 SIA_fighter_type_12_conversion_desc:0 "Type 12'miz Nakajima Ki-27, agresif eli ödüllendiren çevik bir binektir. Bu türdeki zorlu bir eğitim döngüsü pilotlarımızı geliştirecek ve kadrodaki her as'ı geliştirecek, ancak yoğunluk sonsuza kadar sürdürülemez."
 SIA_focus_on_commercial_civilian_ships:0 "Ticari Sivil Gemilere Odaklan"
 SIA_focus_on_commercial_civilian_ships_desc:0 "Atılan her omurga savaş amaçlı olmak zorunda değildir. Ticaret gemileri, nakliye gemileri ve diğer sivil tekneler ulusal ekonominin dolaşım sistemini oluşturur. Ticari gemi inşasını teşvik ederek, [ROOT.GetNameDef] hem refahı hem de savaş zamanı direncini güçlendirir."
 SIA_for_the_preservation_of_siamese_independence:0 "Askeri Kanat Kontrolünü Konsolide Et"
 SIA_for_the_preservation_of_siamese_independence_desc:0 "Geçtiğimiz yüzyıl, dünya güçlerinin [SIA.GetAdjective] toprak bütünlüğünü ihlal ettiğine tanık oldu ve bu yüzyıl farklı görünmüyor. Yaşam tarzımızı korumak istiyorsak kararlı bir şekilde hareket etmeliyiz, yoksa parçalanmış, bölünmüş ve hırpalanmış bir devlet olarak kalırız."
 SIA_for_the_preservation_of_siamese_independence_tt:0 "§Y$anti_democratic_raids$§!, artık §YAskeri Kanadın§! onayını artıracak ve §YSivil kanadın§! onayını azaltacaktır."
 SIA_foreign_currency_exchange:0 "Döviz Kuru"
 SIA_foreign_currency_exchange_desc:0 "Sanayileşme; yabancı makineler, ilaç ve yakıt talep eder, ancak bunlar sadece kıt döviz ile satın alınabilir. Kontrollü bir döviz sistemi, yabancı fonları devlete en hayati endüstrilere yönlendirecektir."
 SIA_forward_strike_wings:0 "İleri Saldırı Kanatları"
 SIA_forward_strike_wings_desc:0 "Saldırıya uğramayı beklemek yerine, cephedeki havayı ele geçirecek ve savaşın başladığı anda savaşı düşmana taşıyacak kanatlar yetiştireceğiz."
 SIA_free_thai_air_liaison:0 "Ücretsiz Tayland Hava İrtibatı"
 SIA_free_thai_air_liaison_desc:0 "Hava gücü sadece gökyüzündeki uçaklardan ibaret değildir. Radyolar, hava durumu raporları, gizli şeritler ve kurtarılan havacılar birden fazla filodan daha önemli olabilir. Özgür Tayland bu sessiz ağı kuracak."
 SIA_free_thai_air_network_unlock_tt:0 "§YÜcretsiz Tayland Hava Ağı§! kararlarının kilidini açar."
 SIA_free_thai_rescued_airmen:0 "Düşen havacılarımızı koruduk"
 SIA_fuel_oil_act:0 "Fuel Oil Yasası"
 SIA_fuel_oil_act_desc:0 "Modern ulaşım, endüstri ve savunmanın tamamı yakıta bağlıdır, ancak ona erişim savaşta kısıtlanabilir. Bir fuel oil yasası; kıt kaynakların çarçur edilmemesi için tüketimi, depolamayı ve acil durum tahsisini daha sıkı devlet gözetimi altına alacaktır."
 SIA_get_off_our_shores:0 "Kıyılarımızdan Defolun"
 SIA_get_off_our_shores_desc:0 "Siyam topraklarında yabancı birliklerin varlığı, bahanelerle yumuşatılamayacak bir hakarettir. İster silah zoruyla ister yurt dışındaki olayların baskısıyla olsun, istilacının kıyılarımızı terk etmesi ve [ROOT.GetNameDef]'in onurunu geri kazanması konusunda ısrarcı olmalıyız.\n\nOnlar korkak, tıpkı tüm zalim adamlar gibi. Şimdi, kıyılarımızdan defolun."
 SIA_hardened_air_defenses:0 "Sertleştirilmiş Hava Savunmaları"
 SIA_hardened_air_defenses_desc:0 "Dağınık şeritler, kaplamalar ve yoğun uçaksavar pilleri, havalı kolumuzun darbeyi absorbe etmesine ve uçmaya devam etmesine olanak tanır. İlk baskından sağ çıkanlar ikincisinde de hâlâ orada olacak."
 SIA_hawk_iii_max_efficiency_tt:0 "Hattı maksimum kullanılabilir verimlilikte ekler"
 SIA_hawk_iii_production_line:0 "Şahin III Üretim Hattı"
 SIA_hawk_iii_production_line_desc:0 "Hawk III zaten pilotlarımıza ve atölyelerimize tanıdık geliyor. Kanıtlanmış, lisanslı bir avcı uçağı etrafında standartlaştırma yapmak, modernizasyonun gerçekten ne anlama geleceğine karar verirken zaman kazandırır."
 SIA_hold_military_parades:0 "Askeri Geçit Törenleri Düzenle"
 SIA_hold_military_parades_desc:0 "Askeri morali desteklemek, sadık generallerimizi ödüllendirmek ve vatandaşlarımıza [SIA.GetAdjective] silahlı kuvvetlerinin gücünü hatırlatmak için Bangkok'ta büyük bir geçit töreni düzenleyeceğiz. Bırakın gazetelerin basmaya değer bir şeyleri olsun!"
 SIA_how_quickly_the_tables_turn:0 "Tablolar Ne Kadar Hızlı Dönüyor"
 SIA_how_quickly_the_tables_turn_desc:0 "Bir zamanlar [ROOT.GetNameDef]'e zayıf ve uyumlu davrananlar, dengenin tersine döndüğünü görebilirler. Savaşta şans hızla döner ve zalimlerimiz tökezlediğinde ve tablolar nihayet onlara karşı döndüğünde anı yakalamaya hazır olmalıyız."
 SIA_how_quickly_the_tables_turn_trigger:0 "Bir büyük güç tarafından saldırıya uğradık ve söz konusu büyük gücü teslim olmaya zorladık."
 SIA_increase_air_crews:0 "Hava Ekiplerini Artırın"
 SIA_increase_air_crews_desc:0 "Uçaklarımıza bakım yapan yer ekiplerimizi genişleteceğiz. Saflarını doldurmak insan gücüne mal olur, ancak bakımlı ve daha iyi korunan makineler, ihmal edilen bir makinenin kaybolacağı yere tekrar uçacaktır."
 SIA_increase_civilian_approval_2_tt:0 "§YSivil§! kanadın onayını §GBüyük Bir Miktar§! artırır"
 SIA_increase_civilian_approval_3_tt:0 "§YSivil§! kanadın onayını §GÇok Büyük Bir Miktar§! artırır"
 SIA_increase_civilian_approval_tt:0 "§YSivil§! kanadın onayını §GKüçük Bir Miktar§! artırır"
 SIA_increase_military_approval_2_tt:0 "§YAskeri§! kanadın onayını §GBüyük Bir Miktar§! artırır"
 SIA_increase_military_approval_3_tt:0 "§YAskeri§! kanadın onayını §GÇok Büyük Bir Miktar§! artırır"
 SIA_increase_military_approval_tt:0 "§YAskeri§! kanadın onayını §GKüçük Bir Miktar§! artırır"
 SIA_increase_rice_exports:0 "Pirinç İhracatını Artır"
 SIA_increase_rice_exports_desc:0 "Pirinç, [ROOT.GetNameDef]'in elindeki en kesin yabancı gelir kaynağıdır. Pazarlar açıkken ihracatı genişleterek; rezerv oluşturabilir, stratejik ithalatı finanse edebilir ve hazineyi yaşanabilecek aksamalara hazırlayabiliriz."
 SIA_industrialization_drive:0 "Sanayileşme Hamlesi"
 SIA_industrialization_drive_desc:0 "[ROOT.GetName]'in zenginliği nesiller boyu çeltik tarlalarına ve kırsal köylere dayanmıştır. Ancak modern dünya sabanla değil, fabrika ve makineyle şekillenir. Büyük güçler arasında bağımsızlığımızı korumak istiyorsak, tarım krallığımızı endüstriyel bir ulusa dönüştürmeliyiz."
 SIA_industrialization_drive_trigger:0 "§YKhana Ratsadon§! aktif"
 SIA_install_heavy_cranes_and_power_plant:0 "Ağır Vinçler ve Enerji Santrali Kurulumu"
 SIA_install_heavy_cranes_and_power_plant_desc:0 "Gemi yapımı sadece kereste ve çelik meselesi değil, aynı zamanda makine ve enerji meselesidir. Ağır vinçler ve güvenilir elektrik kaynağı, tersanelerimizi ham tesislerden modern endüstrinin uygun araçlarına dönüştürecek."
 SIA_intermediate_war_preparation:0 "Orta Vadeli Savaş Hazırlığı"
 SIA_intermediate_war_preparation_desc:0 "Sadece bir yıldırım harekatına hazırlanmak tehlikeli, tamamen sonsuz bir mücadeleye hazırlanmak ise israftır. Dengeli bir doktrin, [ROOT.GetName]'in daha inatçı bir düşmanla yüzleşmek için gereken dayanıklılığı korurken güçle vurmasına olanak tanıyacaktır."
 SIA_irrigation:0 "Sulama"
 SIA_irrigation_desc:0 "Köylünün kaderi hala sel ve kuraklıkla yükselip alçalıyor. Daha geniş bir sulama sistemi hasatları dengeleyecek, ekili araziyi genişletecek ve kırsalı ulusal kalkınma için daha sağlam bir temel haline getirecektir."
 SIA_japan_option_tt:0 "§Y[JAP.GetFlag][JAP.GetNameDefCap]§!"
 SIA_japanese_fighters:0 "Japon Avcı Uçakları"
 SIA_japanese_fighters_desc:0 "Kendi havacılık endüstrimiz yetersiz kalsa da, yabancı uçaklar boşluğu doldurmaya yardımcı olabilir. [ROOT.GetAdjective] ellerindeki Japon avcı uçakları, endüstriyel zayıflığımızın koyduğu sınırlar dahilinde bile olsa, bize modern hava gücü ölçüsü verecektir."
 SIA_join_the_allies:0 "Müttefiklere Katıl"
 SIA_join_the_allies_desc:0 "Dünya savaşla tüketilirken [ROOT.GetName] tek başına duramaz. Müttefikler silah, tanınma ve saldırganlığa direnen uluslar arasında bir yer sunuyor. Onlara katılarak Siyam'ın hayatta kalmasını özgür bir dünya için daha geniş mücadeleye bağlıyoruz."
 SIA_join_the_united_front:0 "Birleşik Cepheye Katıl"
 SIA_join_the_united_front_desc:0 "Çin, [JAP.GetAdjective] saldırganlığı altında kan kaybediyor ama hala savaşıyor. Birleşik Cepheye katılarak [SIA.GetName], karadaki savaşı emperyalist hırs için bir mezarlığa dönüştürmeye yardımcı olabilir."
 SIA_joint_asian_military_command:0 "Müşterek Asya Askeri Komutanlığı"
 SIA_joint_asian_military_command_desc:0 "Çabalarımız, bölgesel ortaklarımızla koordine edildiğinde daha güçlü olacaktır. Müşterek bir komuta yapısı; daha fazla verimlilik, daha net planlama ve aksi takdirde rekabet ve kafa karışıklığı ile çarçur olma riski taşıyan harekatlar için ortak bir yön vaat ediyor."
 SIA_jungle_armor:0 "Orman Zırhı"
 SIA_jungle_armor_desc:0 "Bölgemizin ormanları, Avrupa düzlükleri için tasarlanmış hantal makinelerin yeri değildir. Zırh [ROOT.GetNameDef]'e hizmet edecekse; dar izler, kötü zemin ve bunaltıcı iklim için uyarlanmalı, ormanın talep ettiği yerlerde ağırlığı hareketlilikle takas etmelidir."
 SIA_kasetsart_university:0 "Kasetsart Üniversitesi"
 SIA_kasetsart_university_desc:0 "Tarım daha üretken hale gelecekse, sadece mirastan ziyade bilim tarafından yönlendirilmelidir. Kasetsart Üniversitesi; tarım uzmanları, veterinerler ve toprakların modernizasyonu için teknik uzmanlar yetiştirecektir."
 SIA_license_equipment:0 "Lisans Ekipmanı"
 SIA_license_equipment_desc:0 "Çinhindi güvence altına alındığında, güçlü bir şekilde pazarlık yaparız. Yabancı tasarımlar lisanslı olarak kendi tesislerimizde, ucuz ve ölçekli olarak inşa edilecek."
 SIA_license_modern_airframes:0 "Modern Hava Gövdelerini Lisansla"
 SIA_license_modern_airframes_desc:0 "[ROOT.GetNameDefCap] henüz ihtiyaç duyduğu her uçağı tasarlayamaz. Daha pratik bir yol; yabancı modelleri lisanslamak, yapılarını incelemek ve Müdürlüğün gözetiminde iklimimize, hava meydanlarımıza ve tedarik koşullarımıza uyarlamaktır."
 SIA_lightweight_airframes:0 "Hafif Gövdeler"
 SIA_lightweight_airframes_desc:0 "Feribot tanklarını ve mesafe için gereken ağırlığı çıkarın; geriye kalanlar daha da sıkılaşır, daha hızlı tırmanır ve hedefin üzerinden daha ağır bir darbe indirir. Kanatlarımız çok uzağa ulaşamayacak ama onların erişebileceği hiçbir şey güvende olmayacak."
 SIA_limited_time_effect:0 "$DAYS|Y$ gün boyunca:"
 SIA_long_range_strike_wings:0 "Uzun Menzilli Saldırı Kanatları"
 SIA_long_range_strike_wings_desc:0 "Önümüzdeki orman için inşa etmek yerine, onun ötesindeki mesafe için inşa edeceğiz. Her zamanki israf olmadan tedarik edilen ve üretilen uzun bacaklı bombardıman uçaklarından oluşan bir filo, kendi sınırlarımızın çok ötesine saldırmamıza olanak tanıyacak."
 SIA_look_to_european_fascism:0 "Avrupa Faşizmine Bak"
 SIA_look_to_european_fascism_desc:0 "Bu ülkeyi reforme etme fırsatımız var, geçmişin prangalarından kurtulmuş bir şekilde Batı'da olana ilham alarak yeni bir geleceğe bakacağız. Eski dünya düzeninin yıkıldığı açık ve vizyonsuzlukları nedeniyle geride kalanlar bunun sonuçlarına katlanacaklar."
 SIA_mahidol_university:0 "Mahidol Üniversitesi"
 SIA_mahidol_university_desc:0 "Modern bir devlet, asker ve mühendis gerektirdiği kadar doktor, araştırmacı ve idareci de gerektirir. Mahidol Üniversitesi yükseköğretimi güçlendirecek ve ulusal reform için gereken eğitimli zihinleri sağlayacaktır."
 SIA_maintain_resource_independence:0 "Kaynak Bağımsızlığını Koru"
 SIA_maintain_resource_independence_desc:0 "Yabancı sözleşmeler hızlı karlar getirebilir ancak bağımlılık da arkasından gelir. Kaynaklarımızın kontrolünü elimizde tutarak, onları yabancı talepler yerine Siyam ihtiyaçlarına göre yönlendirme özgürlüğünü koruyoruz."
 SIA_mechanization_of_agriculture:0 "Tarımın Mekanizasyonu"
 SIA_mechanization_of_agriculture_desc:0 "Çok fazla iş gücü geleneksel ekime bağlı kalıyor ve endüstri için çok az artı değer sağlıyor. Kırsal kesime modern aletler ve makineler getirerek üretimi artırabilir ve fabrikalar için elleri serbest bırakabiliriz."
 SIA_meet_with_king_prajadhipok:0 "Kral Prajadhipok ile Buluş"
 SIA_meet_with_king_prajadhipok_desc:0 "Kral olmadan bir komplo sadece bir başka askeri entrikadır. Kral Prajadhipok ile sürgünde buluşarak, davalarını kraliyet meşruiyeti pelerini altına yerleştirebilir ve dönüşü tereddüt edenleri birleştirebilecek ve rejimi bölebilecek tek adamın kutsamasını alabiliriz."
 SIA_military_academies_indoctrination:0 "Askeri Akademiler Endoktrinasyonu"
 SIA_military_academies_indoctrination_desc:0 "Askeri akademilerimiz ideolojik eğitim için ideal hedeflerdir. İyi silahlanmışlardır ve genç öğrenciler eğitmenleri tarafından kolayca etkilenirler. Eğitmenleri kazanın, askeri gençliği kazanın. İktidardaki sınıfa sadık güçlü bir ordu, her güçlü devletin temelidir ve biz güçlü olacağız."
 SIA_military_oversight_bureau:0 "Askeri Gözetim Bürosu"
 SIA_military_oversight_bureau_desc:0 "Ordunun tekrar devlet içinde devlet olmasına izin verilemez. Sivil liderliğindeki bir gözetim bürosu, silahlı kuvvetlerdeki atamaları, bütçeleri ve siyasi faaliyetleri izleyecek, kışlaların Bangkok'a cevap vermesini sağlayacak, tersinin olmamasını garantileyecektir."
 SIA_military_oversight_bureau_tt:0 "§YAGB (Askeri Gözetim Bürosu)§!, generaller üzerinde 5-9 ayda bir soruşturmalar yürütür. Bu dönemlerde etkilenen generaller, artan incelemeden dolayı azalan verimlilikle çalışır."
 SIA_mio_trait_american_procurement_unlock_tt:0 "§YHavacılık Mühendisliği Müdürlüğü§! için §YAmerikan Tedarik Kanalları§! özelliğinin kilidini açar"
 SIA_mio_trait_japanese_air_mission_unlock_tt:0 "§YHavacılık Mühendisliği Müdürlüğü§! için §YJapon Teknik Misyonu§! özelliğinin kilidini açar"
 SIA_mixed_inventory_standardization:0 "Karma Envanter Standardizasyonu"
 SIA_mixed_inventory_standardization_desc:0 "Amerikan, Japon ve daha eski Fransız kökenli uygulamalar tek başına tutarlı bir hava kuvveti oluşturmaz. Bir sonraki savaş gelmeden yedek parçalar, işaretler, telsizler ve bakım disiplini standartlaştırılmalıdır."
 SIA_mobilize_the_defenders_of_siam:0 "Siyam'ın Savunucularını Seferber Et"
 SIA_mobilize_the_defenders_of_siam_desc:0 "Eski ordu ulusa başarısız oldu ama Siyam'ın hala savunuculara ihtiyacı var. Gönüllüler, sadık subaylar, eyalet muhafızları ve vatansever vatandaşlar, anayasayı içeriden ve dışarıdan gelen düşmanlardan koruyan bir güç halinde örgütlenmelidir."
 SIA_mountain_tanks:0 "Dağ Tankları"
 SIA_mountain_tanks_desc:0 "Sarp tepeler ve dağ geçitleri sadece piyadelere bırakılamaz. Kırık arazi için uygun kompakt zırhlı araçlar izleyerek, ordularımıza normal tankların başarısız olacağı bölgelere korumalı ateş gücü getirme imkanı verebiliriz."
 SIA_national_defense_in_asia:0 "Asya'da Milli Savunma"
 SIA_national_defense_in_asia_desc:0 "Asya'nın savunması disiplin, hiyerarşi ve ortak bir stratejik amaç gerektirir. Çin'in milliyetçi hükümetinin yanında durarak, [ROOT.GetNameDef] örgütlü ordular ve koordine edilmiş komuta yoluyla [JAP.GetAdjective] genişlemesine direnmeye kararlı bir koalisyona katılıyor."
 SIA_national_defense_in_asia_tt:0 "§Y[ROOT.GetNameWithFlag]§!, Birleşik Cephe'deki milliyetçi güçlerle hizalanır.\nŞunları sağlayan §Y$SIA_national_defense_in_asia_idea$§! ekler:\n $MODIFIER_ARMY_ORG_FACTOR$: §G+5%§!\n $MODIFIER_PLANNING_SPEED$: §G+10%§!\n $MODIFIER_MAX_PLANNING$: §G+10%§!\n $MODIFIERS_ARMY_DEFENCE_FACTOR$: §G+5%§!"
 SIA_national_savings_bond:0 "Milli Tasarruf Tahvili"
 SIA_national_savings_bond_all_adult_serve:0 "§Y$all_adults_serve$§! seviyesinde şunları kazanır:"
 SIA_national_savings_bond_current:0 "Mevcut seferberlik yasamız bize şunu sağlayacaktır: "
 SIA_national_savings_bond_desc:0 "Milletin serveti, yollar ve fabrikalar inşa edilmezken kasalarda ve süs eşyalarında boş durmamalıdır. Bir milli tasarruf tahvili, özel tutumluluğu kamu yatırımına dönüştürecektir."
 SIA_national_savings_bond_extensive_conscription:0 "§Y$extensive_conscription$§! seviyesinde şunları kazanır:"
 SIA_national_savings_bond_limited_conscription:0 "§Y$limited_conscription$§! seviyesinde şunları kazanır:"
 SIA_national_savings_bond_scraping_the_barrel:0 "§Y$scraping_the_barrel$§! seviyesinde şunları kazanır:"
 SIA_national_savings_bond_service_by_requirement:0 "§Y$service_by_requirement$§! seviyesinde şunları kazanır:"
 SIA_national_savings_bond_tt:0 "$SIA_national_savings_bond$ Ruh Halini kazanır, bu ruh hali §YSeferberlik Yasanıza§! bağlı olarak güçlenir. Seferberlik yasanız ne kadar düşükse olumlu etkiler o kadar güçlüdür, yüksekse etkiler o kadar kötüdür.\n\n§Y$disarmed_nation$§! seviyesinde şunları kazanır: "
 SIA_national_savings_bond_volunteer_only:0 "§Y$volunteer_only$§! seviyesinde şunları kazanır:"
 SIA_new_territories_administration:0 "Yeni Topraklar İdaresi"
 SIA_new_territories_administration_available_trigger:0 "§YÇinhindi§!'deki herhangi bir Eyalet!\n    §Y[ROOT.GetName]§! tarafından kontrol ediliyor"
 SIA_new_territories_administration_desc:0 "Kaybedilen topraklarımızı geri almak sadece bir başlangıçtır. Orada yaşayanlara daha iyi bir seçenek olduğumuzu göstermeliyiz. Yaşam standartlarını yükseltmek için kapsamlı bir program yürütülecek ve her vatandaşın bu yeni büyük [ROOT.GetName] içinde eşit hissetmesi sağlanacaktır."
 SIA_new_territories_administration_tt:0 "§YÇinhindi§! topraklarını yönetmek için kararların kilidini açar, artan uyumluluk, endüstri ve tahkimat sağlar."
 SIA_night_time_training:0 "Gece Eğitimi"
 SIA_night_time_training_desc:0 "Gündüz yapılan cüretkar saldırılar, hazırlıklı bir düşmana karşı felakete davetiye çıkarır. Askerlerimizi karanlığın örtüsü altında sızma, hareket ve saldırı için eğiterek; düşman kör, şaşkın ve bize cevap vermeye en az hazırlıklı olduğunda inisiyatifi ele geçirebiliriz."
 SIA_no_supply_grace_tt:0 "$MODIFIER_NO_SUPPLY_GRACE$ $RIGHT|+=1$ Saat"
 SIA_order_discipline_and_unity:0 "Düzen, Disiplin ve Birlik"
 SIA_order_discipline_and_unity_desc:0 "Hiziplerin siyaseti ve iç savaşın kaosu krallığı neredeyse yok etti. Songsuradet'in cevabı basit: hükümette düzen, toplumda disiplin ve amaçta birlik, böylece krallık daha güçlü ve daha modern bir devlet haline getirilebilir."
 SIA_pacific_war:0 "Pasifik Savaşı"
 SIA_pacific_war_desc:0 "Doğu Asya'daki çatışmaya artık uzak muamelesi yapılamaz. Pasifik'teki savaş, bölgemizdeki tüm ulusların kaderini şekillendiriyor ve [ROOT.GetNameDef] bu mücadeledeki yerini; takipçi, ortak veya kurban olarak belirlemelidir."
 SIA_pad_thai:0 "Pad Thai"
 SIA_pad_thai_desc:0 "Modern bir ulus sadece bakanlıklar ve fabrikalarla değil, halkı birbirine bağlayan ortak alışkanlıklarla ayakta kalır. Siyam içeriklerinden elde edilen ulusal bir pirinç yemeğini teşvik ederek; yerli tüketimi destekliyor, çiftçilerimizi destekliyor ve belirsiz zamanlarda yabancı gıdalara olan bağımlılığı azaltıyoruz."
 SIA_pan_asian_weapon_standardization:0 "Pan-Asya Silah Standardizasyonu"
 SIA_pan_asian_weapon_standardization_desc:0 "Her müttefikin farklı tüfekler, kalibreler, telsizler ve araçlar kullanması lojistik bir başarısızlık davetidir. Standartlaştırılmış silahlar ve paylaşılan üretim planları koalisyonumuzu daha güçlü, daha ucuz ve silahlanması daha hızlı hale getirecektir."
 SIA_pan_asian_weapon_standardization_tt:0 "Şunları kazan:\n$equipment_conversion_speed_tt$ §G[?var:SIA_adc_equipment_conversion_speed_per_country|%]§!\n$production_lack_of_resource_penalty_factor_tt$ §G[?var:SIA_adc_production_lack_of_resource_penalty_factor_per_country|%]§!\n$production_factory_max_efficiency_factor_tt$ §G[?var:SIA_adc_production_factory_max_efficiency_factor_per_country|%]§!\nittifakımızdaki her üye için."
 SIA_pan_thaiism:0 "Pan-Tayizm"
 SIA_pan_thaiism_desc:0 "Sadece [ROOT.GetName]'in yaşaması yeterli değil, gelişmesi de gerekiyor. [ROOT.GetAdjective] halkının geleceği, sadece üçüncü sınıf bir devlet olmaya razı olmakta değil, dünya işlerinde aktif bir oyuncu olmaktadır. Önce halkın kalp ve zihinleri, bizden alınanı geri alan emperyalistlere karşı harekete geçirilmeli ve insanlara bizden nelerin alındığı hatırlatılmalıdır."
 SIA_peoples_war_in_asia_idea:0 "Asya'da Halk Savaşı"
 SIA_peoples_war_in_asia_idea_desc:0 "Savaş, düzenli birliklerden daha fazlası tarafından sürdürülüyor. Yerel komiteler, partizan rehberler ve köylü tedarik kolları artık sahada orduya hizmet ediyor. Her köy bir depo, her yol olası bir pusu ve her geri çekilme düşmanı daha da iç kesimlere çekme şansı haline geliyor."
 SIA_phibuns_premiership:0 "Phibun'un Başbakanlığı"
 SIA_phibuns_premiership_desc:0 "[SIA_phraya_phahon.GetName] başbakanlığı sona ererken, partinin seçtiği halef Plaek Phibunsongkhram iktidarı üstlenmeye hazır. Bu, ordunun bizdeki konumunu büyük ölçüde memnun edecek ancak sivil kanadın endişeyle gerilmesine neden olacaktır.\nBizim için bu yeni çağda tek bir ileri yol var; büyük bir inançla!"
 SIA_plan_for_a_short_war:0 "Kısa Savaş Planı"
 SIA_plan_for_a_short_war_desc:0 "Kaynaklarımız sınırlı ve düşmanlarımız çok olabilir. [ROOT.GetNameDefCap] uzun bir yıpratma yarışını göze alamaz. Eğer savaş gelirse, bu hızlı, kararlı olmalı ve düşman güç toplayamadan sona erdirilmelidir."
 SIA_plan_for_a_short_war_tt:0 "§Y[SIA.GetName]§! başka bir ülkeye ilk kez saldırdığında kazanç elde eder"
 SIA_plan_for_a_short_war_tt2:0 "§Y90 gün için§!.\n\nBu ruh bittikten sonra kazanç:"
 SIA_plan_for_a_short_war_tt3:0 "§Y90 gün için§!"
 SIA_prajadhipok_audience_with_churchill:0 "Prajadhipok'un [ENG.GetLeader] ile Görüşmesi"
 SIA_prajadhipok_audience_with_churchill_desc:0 "Prajadhipok'un [ENG.GetName]'deki varlığı prestijden daha fazlasını sunuyor. Eğer [ENG.GetLeader]'ı kralcı bir ayaklanmanın Asya'daki İngiliz çıkarlarına hizmet ettiğine ikna edebilirse, o zaman Malaya'dan gelen silahlar tahta sadık kalan adamların ellerine ulaşabilir."
 SIA_prajadhipok_audience_with_churchill_tt:0 "[ENG.GetName] bize şunları sağlayacak: "
 SIA_prajadhipok_audience_with_churchill_tt2:0 "İç savaşın başlangıcında."
 SIA_preemtive_strike:0 "Önleyici Saldırı"
 SIA_preemtive_strike_desc:0 "Japonya'nın savaş saatini seçmesini beklemek aptallık olur. Eğer imparatorluk Asya'yı yırtıp atmaya niyetliyse, o zaman [SIA.GetName] orduları ve filoları başka yerlerde tamamen meşgul olmadan önce saldırmalıdır."
 SIA_prepare_for_a_long_war:0 "Uzun Savaş Planı"
 SIA_prepare_for_a_long_war_desc:0 "Büyük güçler savaşları aylarla belirleyebilir ancak küçük uluslar genellikle onları yıllarca sürdürmeye zorlanır. Bu nedenle [ROOT.GetAdjective] ordusunu, endüstrisini ve ulaşımını; sabır ve dayanıklılığın cesaret kadar önemli olduğu uzun ve yorucu bir çatışmaya hazırlamalıyız."
 SIA_prepare_for_a_pacific_war:0 "Pasifik Savaşına Hazırlan"
 SIA_prepare_for_a_pacific_war_desc:0 "İmparatorlukların gözleri Pasifik'e dönüyor. Japonya'nın hırsları, Avrupa kolonileri ve Müttefik stratejisi, yaklaşan bir fırtınaya işaret ediyor. Siyam, ilk atışlar kıyılarımıza ulaşmadan önce hazırlanmalıdır."
 SIA_prepare_for_the_next_blockade:0 "Bir Sonraki Ablukaya Hazırlan"
 SIA_prepare_for_the_next_blockade_desc:0 "Denizler düşmanca hale gelirse, [ROOT.GetNameDef] pazarlardan, makinelerden ve yakıttan kopmuş olabilir. Bu nedenle, bir sonraki ablukaya şimdiden hazırlanmalı; yabancı mallar artık kıyılarımıza ulaşmadığında üretimin devam edebilmesi için stoklar, acil durum planları ve ikameler oluşturmalıyız."
 SIA_prepare_northern_infrastructure_for_war:0 "Kuzey Altyapısını Savaşa Hazırla"
 SIA_prepare_northern_infrastructure_for_war_desc:0 "Kuzey yaklaşımları, Burma ve arkasında duranlarla yapılacak herhangi bir yarışta hayati önem kazanacaktır. O bölgedeki yollar, demiryolları ve depolar derhal genişletilmelidir ki [ROOT.GetAdjective] güçleri orada gecikmeden ilerleyebilsin veya direne bilsin."
 SIA_prepare_to_drop:0 "Atlayışa Hazırlan"
 SIA_prepare_to_drop_desc:0 "Kurtuluş saati geldiğinde, Müttefikler gökyüzünden vatanımıza inmek isteyebilir. Bu nedenle, hava indirme kuvvetlerinin karşılanabilmesi ve en çok ihtiyaç duyulan yere yönlendirilebilmesi için iniş alanlarını belirlemeli, temas kişileri hazırlamalı ve destek ağları örgütlemeliyiz."
 SIA_preserve_american_procurement_channels:0 "Amerikan Tedarik Kanallarını Koruyun"
 SIA_preserve_american_procurement_channels_desc:0 "Tayland hava gücü Curtiss ve Vought'tan dikkatli bir şekilde satın alınarak oluşturuldu. Amerikan kanallarını canlı tutmak, daha iyi uçaklara ve Japonya'ya daha az bağımlılığa giden yolu korur."
 SIA_press_censorship:0 "Basın Sansürü"
 SIA_press_censorship_desc:0 "Özgür bir basın, devletin istikrarını zayıflatma riski taşır. Bazı esneklikler olsa da hükümetin sesinin ve iradesinin medyada öncelikli olduğundan emin olmalıyız."
 SIA_printing_money_monthly_increase_halve:0 "$MODIFIER_CONSUMER_GOODS_FACTOR$ aylık artışı yarıya indirilecek."
 SIA_printing_money_monthly_increase_increase:0 "$MODIFIER_CONSUMER_GOODS_FACTOR$ aylık artışı $VALUE|Y=%1$ oranında artacak"
 SIA_printing_money_monthly_increase_set:0 "Bu $MODIFIER_CONSUMER_GOODS_FACTOR$ her ay §Y[?idea_SIA_printing_money_monthly_change|%]§! artacak"
 SIA_public_credit:0 "Kamu Kredisi"
 SIA_public_credit_desc:0 "Tüccarlar, yetiştiriciler ve üreticiler sınırlı sermaye erişimiyle kısıtlanmıştır. Kamu kredisini genişleterek, hükümet özel finansın tereddüt ettiği yerlerde borç verebilir ve kalkınmayı ihmal edilen sektörlere itebilir."
 SIA_public_credit_trigger:0 "$idea_SIA_public_credit_debt$ en az §Y180 gün§! aktif olmuştur"
 SIA_radio_propaganda:0 "Radyo Propagandası"
 SIA_radio_propaganda_desc:0 "Radyo, [SIA.GetName] elektriklendikçe bir dayanak noktası haline geliyor ve basını nasıl kontrol altına almamız gerekiyorsa, yayınlananları da kontrol altına almamız gerekiyor."
 SIA_railway_and_port_extensions:0 "Demiryolu ve Liman Genişletmeleri"
 SIA_railway_and_port_extensions_desc:0 "Pirinç, kereste ve kalay pazara ulaşamazlarsa değersizdir. Demiryollarını genişletmek ve limanlarımızı büyütmek, eyaletleri milli ticarete dahil edecek ve [ROOT.GetNameDef]'i geniş dünyaya bağlayacaktır."
 SIA_rebuild_the_war_torn_economy:0 "Savaş Yorgunu Ekonomiyi Yeniden İnşa Et"
 SIA_rebuild_the_war_torn_economy_desc:0 "İç savaş yolları, fabrikaları, pirinç tarlalarını ve ticaret yollarını paramparça etti. Yeniden inşa derhal başlamalıdır. Ücretler, tahıl, raylar ve kredi, [ROOT.GetName]'i Bangkok'tan yapılacak herhangi bir konuşmadan daha fazla istikrara kavuşturacaktır."
 SIA_recognize_manchukuo:0 "Mançukuo'yu Tanı"
 SIA_recognize_manchukuo_desc:0 "TODO_CM"
 SIA_recover_indochina:0 "Çinhindi'ni Kurtar"
 SIA_recover_indochina_desc:0 "Geçtiğimiz yüzyıl, ülkemizin, bize ne yapacağımızı veya nasıl yaşayacağımızı söylemeye hiçbir hakkı olmayan, dünyanın diğer ucundaki bir hükümet olan [FRA.GetAdjective] tarafından parçalandığını gördü; ancak topla tüfekle bizim olanı aldılar. Bu yüzyılda [FRA.GetAdjecive] gücü sönüyor; bu yüzyıl bizim."
 SIA_recover_indochina_tt:0 "§YÇinhindi§! topraklarına karşı sınırlı savaşlar başlatma yeteneğinin kilidini açar"
 SIA_reduction_of_agricultural_yield_taxes:0 "Tarım Ürünleri Vergisinin Azaltılması"
 SIA_reduction_of_agricultural_yield_taxes_desc:0 "Köylülükten krallığı beslemesi, devleti finanse etmesi ve her türlü zorluğa katlanması istenemez. Tarımsal verim üzerindeki vergileri azaltarak, kırsal kesimde daha fazla artık bırakıyor, yetiştiriciler arasındaki sadakati güçlendiriyor ve topraktan daha fazla üretimi teşvik ediyoruz."
 SIA_reduction_of_agricultural_yield_taxes_tt:0 "$idea_SIA_agricultural_tax_reduction$ unsurundan gelen §YTüketim Malları§! ihtiyacını her ay §Y[?var:SIA_agricultural_tax_reduction_cg_decrease_rate|%]§! azaltır ve §YTüketim Malları§! cezası §Y0%§! seviyesine ulaşana kadar her ay §Yİstikrar§! değerini §Y[?var:SIA_agricultural_tax_reduction_stability_gain|%]§! artırır\n\nRuh kaldırıldığında şunları kazan:\n"
 SIA_reinforced_platings:0 "Güçlendirilmiş Kaplamalar"
 SIA_reinforced_platings_desc:0 "Zırh kaplama ve yardımcı yakıt tankları, eskort savaşçılarımızın bir darbe almasına ve yine de evlerinden uzaktaki hedeflere ulaşmasına olanak tanıyor. Eklenen ağırlık yol boyunca daha fazla yakıt yakar, ancak iyi delinmiş bir eskort kanadı bu maliyete değer."
 SIA_relocate_the_capital_to_phetchabun:0 "Başkenti Phetchabun'a Taşı"
 SIA_relocate_the_capital_to_phetchabun_desc:0 "Hükümet tehdit altında! Tarihin kanıtladığı gibi, Bangkok deniz saldırılarına karşı savunmasızdır ve her ne kadar kesinlikle popüler olmayan bir karar olsa da, başkenti daha iç kesimlere taşımak alınması gereken bir karardır."
 SIA_relocate_the_capital_to_phetchabun_tt:0 "§Y[1076.GetName]§!'den §Y[1077.GetName]§!'e kadar §G3§! §YAskeri Fabrika§! taşır\n§Y[1076.GetName]§!'den §Y[1077.GetName]§!'e kadar §G3§! §YSivil Fabrika§! taşır\nPetchabun çevresinde Seviye §G3§! Tahkimat inşa eder"
 SIA_relocate_the_capital_to_phetchabun_tt2:0 "Ruh hali zaman aşımına uğradığında - Temel İstikrar: §R-25%§!"
 SIA_reluctant_submission:0 "İsteksiz Teslimiyet"
 SIA_reluctant_submission_desc:0 "[ROOT.GetNameDef] daha güçlü bir düşman tarafından işgalle karşı karşıya kalırsa, açık direnişin sadece yıkım vaat ettiği bir an gelebilir. Eğilmek acıdır, ancak bazen bir hükümet ulusu yok olmaktan korumak için boyun eğmeli ve daha elverişli bir saat beklemelidir."
 SIA_reluctant_submission_trigger:0 "Eğer saldırıya uğrarsak ve olayda §YTeslimiyet§! seçeneğini seçersek bu milli hedef otomatik olarak tamamlanacaktır."
 SIA_reluctant_submission_tt:0 "Saldıran büyük bir ülkeyi barışa kavuşturabileceğiz. Ancak bizden onlar adına para basmamızı bekleyecekler.\n§YTüketim Malları Fabrikaları faktörümüz§! aylık §Y[?idea_SIA_printing_money_monthly_change|%]§! artacak, maksimum §Y[?idea_SIA_printing_money_monthly_change_max|%]§!.\n\nOdaklanmak §Y$SIA_thai_rice_company$§! artış oranını azaltacaktır §G50%§!\n\nOdaklanmak §Y$SIA_demand_repatriation$§! para basma ihtiyacını ortadan kaldıracaktır."
 SIA_renegotiate_teak_control:0 "Tik Ağacı Kontrolünü Yeniden Müzakere Et"
 SIA_renegotiate_teak_control_desc:0 "Kuzey ormanlarımız imtiyaz sahiplerini zenginleştiriyor ancak devlete çok azı geri dönüyor. Tik ağacı kontrolünü yeniden müzakere ederek, geliri geri kazanabilir, çıkarımı düzenleyebilir ve Siyam kerestesinin Siyam kalkınmasına hizmet etmesini sağlayabiliriz."
 SIA_restore_order:0 "Düzeni Yeniden Sağla"
 SIA_restore_order_desc:0 "İç savaş kazanıldı, ancak sadece zafer bir krallığı iyileştirmez. Enkaz yeniden inşa edilmeli, eski gardiyanlar yatıştırılmalı ve yönetim yeniden kurulmalıdır, böylece [ROOT.GetName] düzensizlikten, Taç güvenli bir şekilde ve kamusal yaşam rotasına dönmüş olarak çıkabilir."
 SIA_retake_lost_british_states:0 "Kaybedilen Britanya Eyaletlerini Geri Al"
 SIA_retake_lost_british_states_desc:0 "Büyük krallığımızı bölen sadece [FRA.GetAdjective] değil, aynı zamanda hırsla hareket eden ve paylarını talep etmek için her fırsatı değerlendiren [ENG.GetAdjective] idi. Dikkatleri daha büyük rakiplere odaklanmışken, bizim harekete geçme zamanımız geldi."
 SIA_retake_lost_british_states_tt:0 "§YBurma§! ve §YMalezya§!'deki Britanya topraklarına karşı sınırlı savaşlar başlatma yeteneğinin kilidini açar!"
 SIA_reverse_engineer_allied_tanks:0 "Müttefik Tanklarını Tersine Mühendislik Yap"
 SIA_reverse_engineer_allied_tanks_desc:0 "Başkaları deney masraflarını çoktan üstlendi. Ele geçirilen tanklar ve ithal makineler parçalarına ayrılabilir, incelenebilir ve taklit edilebilir. Yabancı tasarımlardan öğrenerek [ROOT.GetName], kendi zırhlı gücüne giden yolu kısaltabilir."
 SIA_reverse_engineer_french_airplanes:0 "Fransız Uçaklarında Tersine Mühendislik"
 SIA_reverse_engineer_french_airplanes_desc:0 "Çinhindi'nin hava alanları ve atölyeleri, Fransız makinelerinin büyük ölçüde sağlam olduğu bir şekilde elimize geçti. Mühendislerimiz onları son perçinine kadar soyacak ve sakladıkları her sırrı öğrenecek."
 SIA_revise_the_taxation_system:0 "Vergilendirme Sistemini Revize Et"
 SIA_revise_the_taxation_system_desc:0 "Mevcut vergi yapısı, zorluklara ve kendi kendine yeterliliğe hazırlanan bir devlete yeterince hizmet etmiyor. Revize edilmiş bir sistem, geliri daha dengeli toplayacak, israfı azaltacak ve ulusal savunma ve kalkınma yükünü daha büyük bir disiplinle yönlendirecektir."
 SIA_revision_of_unequal_treaties:0 "Eşitsiz Antlaşmaların Revizyonu"
 SIA_revision_of_unequal_treaties_desc:0 "Zayıflık dönemlerinde imzalanan eski anlaşmalar, yabancı çıkarlara hala hiçbir modern devletin tahammül etmemesi gereken ayrıcalıklar tanıyor. Bu eşitsiz antlaşmaları revize etmeli ve [ROOT.GetNameDef]'in ticaret, mahkemeler ve tavizler üzerindeki tam yetkisini geri kazanmalıyız."
 SIA_rice_husk_steam_turbines:0 "Pirinç Kavuzu Buhar Türbinleri"
 SIA_rice_husk_steam_turbines_desc:0 "Yabancının atık olarak gördüğüne, gereklilik değer vermeyi öğretir. Pirinç kavuzlarını buhar üretimi için yakarak, hasatlarımızdan enerji çekebilir ve ithal kömür ve petrole olan bağımlılığımızı azaltabiliriz."
 SIA_river_patrols:0 "Nehir Devriyeleri"
 SIA_river_patrols_desc:0 "[ROOT.GetNameDef]'in nehirleri aynı anda yollar, sınırlar ve can damarlarıdır. Bu sulardaki devriye botları düzeni sağlamamıza, yerel garnizonları desteklememize ve devletin erişimini uzak bir başkentin hareket etmekte yavaş kaldığı bölgelere genişletmemize yardımcı olacaktır."
 SIA_royal_palace_bureau_directive_no_1523:0 "Kraliyet Sarayı Bürosu Direktifi No 1523"
 SIA_royal_palace_bureau_directive_no_1523_desc:0 "Ülkedeki milliyetçilik dalgasıyla birlikte taç bile hükümeti destekledi ve Kraliyet Sarayı'nın her üyesinden güncellenmiş teçhizat satın almak için gelirlerinin %10'unu bağışlamasını istedi."
 SIA_royal_thai_navy:0 "Kraliyet Tayland Donanması"
 SIA_royal_thai_navy_desc:0 "[ROOT.GetNameDef]'in savunması kıyı şeridinde bitmez. Kıyılarımız, nehirlerimiz ve deniz ticaretimiz krallığa layık bir filo talep ediyor. Kraliyet Tayland Donanması'nı güçlendirerek, Siyam'ın kendi sularının efendisi kalmasını sağlayacağız."
 SIA_royal_thai_ordnance_factory:0 "Kraliyet Tayland Mühimmat Fabrikası"
 SIA_royal_thai_ordnance_factory_desc:0 "Güvenli bir devlet, ithal silahlardan ve dağınık tamirhanelerden fazlasını gerektirir. Thonburi'deki Kraliyet Tayland Mühimmat Fabrikası'nın kurulması; beceriyi, makineyi ve denetimi taç altında yoğunlaştıracak ve [ROOT.GetNameDef]'e silah ve mühimmat üretimi için kalıcı bir merkez verecektir."
 SIA_sala_chaloem_thai_movie_theater:0 "Sala Chaloem Tayland Sineması"
 SIA_sala_chaloem_thai_movie_theater_desc:0 "Filmler ülkemizde yeni bir mecra ama potansiyeli herkesin görebileceği kadar açık. Şiirler, kitaplar ve radyo gibi, halkın ve elitlerin kalp ve zihinlerini doldurabilir. Bu mecrayı kullanarak, vatandaşların büyük bir [SIA.GetName]'in yükselişini görme kararlılığını güçlendirebiliriz."
 SIA_sala_chaloem_thai_movie_theater_tt:0 "Propaganda filmleri yapmak için kararların kilidini açar, çeşitli bonuslar verir. Örneğin:\n"
 SIA_secure_the_state:0 "Devleti Güvenliğe Al"
 SIA_secure_the_state_desc:0 "İç savaştaki zafer istikrar anlamına gelmez. Demiryolları, limanlar, cephanelikler ve iletişim merkezleri, gerici subaylar yeniden toplanmadan önce güvenliğe alınmalıdır. Bangkok sakin, bağlantılı ve sivil kontrol altında kalmalıdır."
 SIA_securing_the_rubber_islands:0 "Kauçuk Adalarını Güvence Altına Al"
 SIA_securing_the_rubber_islands_desc:0 "Kauçuk modern savaşın can damarıdır; lastikleri, contaları ve mekanize çatışmanın sayısız enstrümanını besler. Güneyimizdeki kaynak zengini topraklar hem bir fırsat hem de bir gereklilik sunuyor. Başkaları yapmadan önce onları güvence altına almak için harekete geçmeliyiz."
 SIA_sell_bangkok_dock_co:0 "Bangkok Dock Co'yu Sat"
 SIA_sell_bangkok_dock_co_desc:0 "Özel sermaye, devlet yönetiminin çok yavaş gerçekleştirdiği şeyi başarabilir. Bangkok Dock Company'yi yetenekli ellere satarak; yatırım çekebilir, verimliliği teşvik edebilir ve kamu fonlarını daha acil askeri ihtiyaçlara yönlendirebiliriz."
 SIA_sell_privy_purse_lands:0 "Kraliyet Hazine Arazilerini Sat"
 SIA_sell_privy_purse_lands_desc:0 "Kraliyet ailesi, şu anda kontrolümüz altında olan geniş arazi parçalarına sahiptir. Bu mülkler kasamızı önemli ölçüde güçlendirebilir ve sadakatlerini sağlamak için belirli subaylara uygun fiyatlarla satılabilir."
 SIA_sell_privy_purse_lands_tt:0 "Ruh hali sona erdiğinde §Y[SIA_phraya_phahon.GetName]§! bir skandala karışacak, bu da §Y$SIA_phibuns_premiership$§! için faşizm şartını atlamanıza izin verecek!"
 SIA_send_bureaucrats_abroad:0 "Bürokratları Yurt Dışına Gönder"
 SIA_send_bureaucrats_abroad_desc:0 "Diğer uluslar şu anda ihtiyaç duyduğumuz bakanlıkları, okulları ve teknik hizmetleri çoktan inşa ettiler. Gelecek vaat eden yetkilileri yurt dışına göndererek, yabancı yönetim ithal etmeden idari deneyim ithal edebiliriz."
 SIA_seri_thai:0 "Seri Thai"
 SIA_seri_thai_desc:0 "Teslimiyet, ulusal ruhun teslimi anlamına gelmek zorunda değildir. İşgal ve uyumun yüzeyinin altında, bağımsızlık davasını korumak, istihbarat toplamak ve [ROOT.GetName]'in yeniden yükseleceği günü hazırlamak için sadık bir yeraltı örgütlenebilir."
 SIA_shuffle_pridi_to_the_minister_of_interior:0 "Sivil Kanadın Konumunu Güçlendir"
 SIA_shuffle_pridi_to_the_minister_of_interior_desc:0 "Pridi'yi Dışişleri Bakanı yerine İçişleri Bakanı pozisyonuna getirerek, hükümet kaynaklarının tahsisini daha etkili bir şekilde kontrol edebilir ve askeri nüfuzun artmasına karşı bir fren görevi görebilir."
 SIA_shuffle_pridi_to_the_minister_of_interior_tt:0 "§Y$anti_fascist_raids$§!, artık §YSivil kanadın§! onayını artıracak ve §YAskeri kanadın§! onayını azaltacaktır."
 SIA_siam_cement_group:0 "[ROOT.GetName] Çimento Grubu"
 SIA_siam_cement_group_desc:0 "Kraliyet himayesinde kurulan [ROOT.GetName] Çimento Grubu, [ROOT.GetNameDef]'in en önemli endüstriyel işletmelerinden biri olarak duruyor. Hedefli yatırım ve hükümet desteği ile şirket, yerli bir tedarikçiden geniş endüstriyel kapasitemizin bir mihenk taşına dönüştürülebilir - kelimenin tam anlamıyla ulusun geleceğinin temellerini atıyor."
 SIA_siam_electricity_company:0 "Siyam Elektrik Şirketi"
 SIA_siam_electricity_company_desc:0 "Hiçbir ekonomi güvenilir güç olmadan modern bir gerilime dayanamaz. Siyam Elektrik Şirketi'ni güçlendirerek; üretimi genişletebilir, koordinasyonu geliştirebilir ve atölyelerin, depoların ve şehirlerin zorluk anında bile beslenmesini sağlayabiliriz."
 SIA_siamese_development_cooperative:0 "Siyam Kalkınma Kooperatifi"
 SIA_siamese_development_cooperative_desc:0 "Özel sermaye temkinlidir ve devlet her şeyi tek başına inşa edemez. Bir milli kalkınma kooperatifi, yetkililerin, tüccarların ve arazi sahiplerinin ortak ekonomiye hizmet eden projeler için kaynaklarını birleştirmesine olanak tanıyacaktır."
 SIA_siamese_tankettes:0 "Siyam Tanketleri"
 SIA_siamese_tankettes_desc:0 "Ordumuz, hafif tanket filosuyla aşinalık geliştirdi, güvenilirliklerini artırdı ve sahada tutmanın maliyetini düşürdü."
 SIA_siamese_youth_movement:0 "[THIS.GetAdjective] Gençlik Hareketi"
 SIA_siamese_youth_movement_desc:0 "[THIS.GetName]'in genç yetişkinleri, sıcak bir alev üzerinde çelik gibi tavlanmalıdır. Devlete saygı duymayı, anavatanı nasıl savunacaklarını öğrenecekler ve Tayland Toplumunun değerli üyeleri olacaklar."
 SIA_sideline_disloyal_officers:0 "Sadakatsiz Subayları Saf Dışı Bırak"
 SIA_sideline_disloyal_officers_desc:0 "Ordu subay kadrosu tek bir bütün değildir. Kendi saflarında sadakatleri eski patronlarına, rakip gruplara veya hükümet yerine kendi hırslarına ait olan adamlar oturur. Dikkatli yeniden görevlendirmeler ve idari baskı ile bu figürler, hiçbir tehdit oluşturmadıkları görevlere taşınabilirken, güvenilirliklerini kanıtlayanlara hak ettikleri sorumluluklar verilebilir."
 SIA_sideline_disloyal_officers_tt:0 "İki rastgele general 4 yıllığına §YReassigned (Yeniden Görevlendirildi)§! niteliğini alacak, bu da bonus vermemelerine neden olacak.\n§YReassigned (Yeniden Görevlendirildi)§! niteliğine sahip olmayan iki rastgele general ise ekstra istatistikler ve ekstra bir olumlu nitelik alacak."
 SIA_silpakorn_university:0 "Silpakorn Üniversitesi"
 SIA_silpakorn_university_desc:0 "TODO_CM"
 SIA_singaporean_reinforcements:0 "Singapur Takviyeleri"
 SIA_singaporean_reinforcements_desc:0 "Malaya ve ötesindeki mücadele, kendi güvenliğimizden ayrılamaz. Singapur çevresinde toplanan kuvvetlerden çekilen takviyeler hattımızı sağlamlaştırabilir, Müttefiklerle işbirliğimizi genişletebilir ve tiyatroyu ortak bir amaç altında birleştirebilir."
 SIA_southeast_asia_joint_command:0 "Güneydoğu Asya Ortak Komutanlığı"
 SIA_southeast_asia_joint_command_desc:0 "Paktımız diplomatik bir sözden fazlası olmalı. Ortak bir komuta; Güneydoğu Asya genelinde strateji, tedarik, istihbarat ve savunma planlamasını koordine ederek ayrı orduları ortak bir kalkana dönüştürecektir."
 SIA_southeast_asia_joint_command_tt:0 "Şunları kazan:\n$land_mastery_gain_factor_tt$ §G[?SIA_adc_land_mastery_gain_factor_per_country|%]§!\n$research_speed_factor_tt$ §G[?var:SIA_adc_research_speed_factor_per_country|%]§!\n$max_command_power_mult_tt$ §G[?var:SIA_adc_max_command_power_mult_per_country|%]§!\nittifakımızdaki her üye için."
 SIA_specialized_airframe_construction:0 "Özel Gövde İnşaatı"
 SIA_specialized_airframe_construction_desc:0 "Fabrikalarımız her tasarımı aynı anda takip etmek yerine tek bir savaş uçağı gövdesinde ustalaşacak ve onu bölgedeki herkesten daha iyi üretecek."
 SIA_specialized_warfare:0 "Uzmanlaşmış Harp"
 SIA_specialized_warfare_desc:0 "Bölgemizin arazisi tek tip bir orduyu desteklemiyor. Dağlar, orman ve nehir arazileri farklı beceriler talep eder. Uzmanlaşmış birlikler yetiştirerek, [ROOT.GetNameDef]'in her alanda düşmanla doğru güçle karşılaşmasını sağlayabiliriz."
 SIA_spread_democratic_sentiment_in_universities:0 "Üniversitelerde Demokratik Duyguyu Yay"
 SIA_spread_democratic_sentiment_in_universities_desc:0 "Akademisyenler, [SIA.GetName]'in gelecekteki yönünü bünyelerinde barındırırlar. Bugün öğrendikleri geleceğe yansıyacak ve günümüz akademisyenlerine güçlü bir demokratik görev duygusu aşılayarak bunu bilimsel salonların sınırlarının ötesine yayabiliriz."
 SIA_standardize_aircraft_maintenance:0 "Uçak Bakımını Standartlaştır"
 SIA_standardize_aircraft_maintenance_desc:0 "Uçaklarımız, her birinin kendi parçaları, aletleri ve tamir alışkanlıkları olan birçok kaynaktan geliyor. Müdürlük altında bakım prosedürlerini standartlaştırarak, [ROOT.GetNameDef] daha fazla uçağı havada tutabilir ve yerdeki kafa karışıklığının neden olduğu israfı azaltabilir."
 SIA_standing_our_ground:0 "Yerimizi Koru"
 SIA_standing_our_ground_desc:0 "Geri çekilme ve müzakerenin sadece daha fazla aşağılama sunduğu bir nokta gelir. [ROOT.GetNameDefCap] hala ayakta durma, savaşma ve kaderimizi silah zoruyla dikte edebileceklerini varsayanları kovma iradesine sahip olduğunu göstermelidir."
 SIA_standing_our_ground_trigger:0 "Eğer saldırıya uğrarsak ve olayda §YDireniş§! seçeneğini seçersek bu milli hedef otomatik olarak tamamlanacaktır."
 SIA_steel_arteries:0 "Çelik Arterler"
 SIA_steel_arteries_desc:0 "Hiçbir ordu onu destekleyecek raylar ve yollar olmadan uzağa yürüyemez. Ulusun çelik arterleri güçlendirilmelidir ki askerler, erzaklar ve toplar her tehdit altındaki sınıra hızla taşınabilsin. Bu işte askeri güvenlik ve ulusal kalkınma el ele yürür."
 SIA_stronger_together:0 "Birlikte Daha Güçlüyüz"
 SIA_stronger_together_desc:0 "Savaş, uzak vaatleri ve paralel ittifakları engellerden biraz daha fazlasına indirgedi. [ROOT.GetNameDef] Asya'nın gidişatını şekillendirecekse, ortaklarımızdan ittifaklarını bizimkine bağlamalarını ve önümüzdeki mücadelede tek bir komutayı kabul etmelerini istemeliyiz."
 SIA_submarine_day:0 "Denizaltı Günü"
 SIA_submarine_day_desc:0 "Denizaltı harbinin filomuza dahil edilmesi, halkın tanınmasını ve ulusal coşkuyu hak ediyor. Denizaltı kolunu kutlayarak; işe alımı teşvik edebilir, prestiji artırabilir ve Siyam'ın yeni bir deniz çağına girdiği fikrini halkın zihnine sabitleyebiliriz."
 SIA_sue_the_king_in_exile:0 "Sürgündeki Kralı Dava Et"
 SIA_sue_the_king_in_exile_desc:0 "Sürgündeki kralın [ENG.GetNameDefCap]'e yanında epeyce değerli eşya götürdüğü söyleniyor. Onları geri almalıyız ve bunu başarmak için onu ve eşini dava etmemiz gerekirse, öyle olsun."
 SIA_support_songsuradets_military_clique:0 "Songsuradet'in Askeri Grubunu Destekle"
 SIA_support_songsuradets_military_clique_desc:0 "Her subay ulusun düşmanı değildir. Songsuradet ve yandaşları, Siyam'ı uçurumun kenarına getiren yozlaşmış generallere disiplinli bir askeri alternatif sunuyor. Onların desteğiyle, devleti kaosa teslim etmeden düzen yeniden sağlanabilir."
 SIA_support_songsuradets_military_clique_tt:0 "Bir §Yİç Savaş§! patlak verirse Songsuradet bizi destekleyecek, §Y3§! ek tümen sağlayacak.\n§REğer Songsuradet'i güçlendirir ve sonra $SIA_the_songsuradet_rebellion$ ile onu tutuklamaya çalışırsak direnebilir.§!"
 SIA_suspend_ordinary_legal_procedures:0 "Olağan Hukuki Prosedürleri Askıya Al"
 SIA_suspend_ordinary_legal_procedures_desc:0 "Songsuradet İsyanı, bize ulusal güvenlik adına kapsamlı reformlar yapma fırsatı sunuyor. Mahkemelerin ve diğer siyasi organların elinde tuttuğu denge ve denetleme mekanizmaları etkisiz hale getirilecek, bu da gücü merkezileştirmek için gereken süreyi bize kazandıracak."
 SIA_tactical_bombing_school:0 "Taktik Bombalama Okulu"
 SIA_tactical_bombing_school_desc:0 "Bombardıman mürettebatı için özel bir okul, taktik bombardıman uçaklarımızı kör bir aletten, yollarına çıkan her şeye daha sert ve daha doğru vuran hassas bir alete dönüştürecek."
 SIA_tankettes:0 "Tanketler"
 SIA_tankettes_desc:0 "Hafif, ucuz ve üretimi basit olan tanketler tek başlarına büyük savaşlara karar veremeyebilirler ancak yine de keşif, sömürge savaşları ve piyade desteği sağlayabilirler. Mütevazı imkanlara sahip bir ulus için, bu küçük zırhlı araçlar mekanize savaşa pratik bir giriş sunar."
 SIA_territorial_defense_student:0 "Bölgesel Savunma Öğrencisi"
 SIA_territorial_defense_student_desc:0 "Gençlik hareketini genişleterek, en umut verici adaylar, [SIA.GetNameDef]'in savunmasına yardımcı olacakları genç asker eğitim kamplarına taşınabilirler. Uygun bir askeri eğitim alacaklar ve ordunun kullanabileceği ek bir araç olarak hareket edecekler."
 SIA_textile_mills:0 "Tekstil Fabrikaları"
 SIA_textile_mills_desc:0 "Kumaş günlük bir ihtiyaçtır, ancak çok fazlası yurt dışında dokunmakta ve bize geri satılmaktadır. Tekstil fabrikaları ithal malların yerini alacak, kentsel iş gücünü istihdam edecek ve [ROOT.GetNameDef]'e modern yaşamın temel endüstrilerinden birini verecektir."
 SIA_thai_cultural_mandates:0 "Tayland Kültürel Yetkileri"
 SIA_thai_cultural_mandates_desc:0 "Yetkiler çıkararak, halkın birliğini güçlendirerek ve birleşik bir kimlik oluşturarak Tayland halkını harekete geçirebilir ve güçlü bir ulusal kültür inşa edebiliriz."
 SIA_thai_cultural_mandates_tt:0 "Kültürel yetkileri yürürlüğe koymak için kararların kilidini açar, §YSiyasi Güç§! karşılığında çeşitli bonuslar verir. Birinci yetki ve diğer ilk yetki ücretsizdir."
 SIA_thai_french_liaison:0 "Tayland-Fransız İrtibat"
 SIA_thai_french_liaison_desc:0 "İlk havacılarımız Fransa'da eğitim aldığında oluşan bağlar hâlâ geçerliliğini koruyor. Paris ve Bangkok barış içinde kalırken, sürekli bir irtibat Fransız teknik uzmanlığının, kılavuzlarının ve iyi niyetinin hava kolumuza akmasını sağlıyor."
 SIA_thai_french_liaison_no_indochina_tt:0 "Fransız Çinhindi'nin (Laos, Kamboçya veya Vietnam) hiçbir bölümünü işgal etmiyoruz."
 SIA_thai_rice_company:0 "Tayland Pirinç Şirketi"
 SIA_thai_rice_company_desc:0 "Pirinç, [ROOT.GetName]'in can damarı olmaya devam ediyor, ancak ticaretinin çok fazlası parçalanmış, spekülatif ve yabancı baskısına karşı savunmasız. Bir milli pirinç şirketi, devletin ihracatı yönlendirmesine, fiyatları istikrara kavuşturmasına ve çeltik tarlalarımızın hasadını ulusal güç için daha sağlam bir temel haline getirmesine olanak tanıyacaktır."
 SIA_thai_students_in_the_oss:0 "OSS'deki Taylandlı Öğrenciler"
 SIA_thai_students_in_the_oss_desc:0 "Yeni bir vatansever gençlik nesli; casusluk, sabotaj ve düzensiz harp sanatlarında yurt dışında eğitilebilir. Güvenilir Taylandlı öğrencileri Müttefik istihbaratının yörüngesine göndererek, önümüzdeki gizli savaş için yetenekli hizmetkarlar hazırlayacağız."
 SIA_thammasat_university:0 "Thammasat Üniversitesi"
 SIA_thammasat_university_desc:0 "Yeni kurulmuş bir üniversite olan Thammasat, yeni bir Tayland inovasyon çağına yol açmak için genişletilebilir ve genişletilmelidir."
 SIA_the_army_of_siam:0 "Siyam Ordusu"
 SIA_the_army_of_siam_desc:0 "Silahlı kuvvetlerimizin eski yapısı artık çağın taleplerine cevap vermiyor. [ROOT.GetName] egemenliğini savunacak ve çıkarlarını yurt dışında ileri sürecekse; dünya çapında şekillenen savaşlar için donanımlı, eğitimli ve organize, yeni ve modern bir ordu kurmalıyız."
 SIA_the_bank_of_siam:0 "Siyam Bankası"
 SIA_the_bank_of_siam_desc:0 "Endüstriyel büyüme sadece gelenek ve özel kayırmalarla devam edemez. Daha güçlü bir milli banka, devlete kredi, para birimi ve sermaye dolaşımı üzerinde daha fazla komuta verecektir."
 SIA_the_duty_of_the_thai_people_during_the_war_act:0 "Savaş Sırasında Tayland Halkının Görevi Yasası"
 SIA_the_duty_of_the_thai_people_during_the_war_act_desc:0 "$idea_SIA_cemented_control_3_desc$"
 SIA_the_end_of_gunboat_diplomacy:0 "Topçu Diplomasisinin Sonu"
 SIA_the_end_of_gunboat_diplomacy_desc:0 "Yabancı savaş gemileri bir daha asla Chao Phraya ağzından şartlar dikte etmeyecek. Siyam, Bangkok'a yönelik herhangi bir tehdidi çılgınca bir eylem haline getirmek için gereken silahlara, rıhtımlara, mayınlara ve kıyı savunmalarına sahip olmalıdır."
 SIA_the_greater_thai_empire:0 "Büyük Tayland İmparatorluğu"
 SIA_the_greater_thai_empire_available_trigger:0 "§Y[ROOT.GetName]§! tüm Çinhindi Eyaletlerini kontrol ediyor\nTüm Çinhindi eyaletlerinin uyumu şundan fazla: §Y[?var:SIA_greater_thai_empire_compliance_requirement]%§!\n\nAyrıca şunları gerektirir: "
 SIA_the_greater_thai_empire_desc:0 "Yükseliş saatimiz geldi. Bir zamanlar alınanlar geri verildi ve halkın bizi fiili otorite olarak tanımasıyla, bu yenilenmiş Büyük Tayland İmparatorluğu'nun meşru liderleri olarak meşruiyetimizi sağlam bir şekilde kurduk."
 SIA_the_hammers_that_strike:0 "Vuran Çekiçler"
 SIA_the_hammers_that_strike_desc:0 "İttifakımız artık hayatta kalmayı uman küçük devletler topluluğu değil. Bu bir silahtır. Her ulus bir çekiçtir ve birlikte Asya'ya hükmetmeye çalışan herhangi bir güce karşı vuracağız."
 SIA_the_hammers_that_strike_tt:0 "Şunları kazan:\n$industrial_capacity_dockyard_tt$ §G[?var:SIA_acd_industrial_capacity_dockyard_per_country|%]§!\n$industrial_capacity_factory_tt$ §G[?var:SIA_acd_industrial_capacity_factory_per_country|%]§!\nittifakımızdaki her üye için."
 SIA_the_interceptor_force:0 "Durdurucu Gücü"
 SIA_the_interceptor_force_desc:0 "Daimi devriyeler ve yerdeki gözlemci ağı, savaşçılarımızı gerçek bir önleme kuvvetine dönüştürüyor. Radar ve hızlı mücadeleler akıncılarla şehirlerimize ulaşmadan karşılaşacak."
 SIA_the_khana_ratsadon:0 "Khana Ratsadon (Halk Partisi)"
 SIA_the_khana_ratsadon_desc:0 "Halk Partisi mutlakıyetçiliği sona erdirdi ve anayasal yönetimin yolunu açtı. Mirası tartışıldı, ihanete uğradı ve kanlı hale geldi, ancak modern bir [SIA.GetName] üzerinde inşa edilebilecek temel olarak kalmaya devam ediyor."
 SIA_the_khana_ratsadon_tt:0 "\n§YKhana Ratsadon§! etkinleşir.\n\n[ROOT.GetName] ülkesinin önde gelen partisi §YKhana Ratsadon§!, §YOrdu Kanadı§! ve §YSivil Kanat§! olarak ikiye ayrılır.\n\n§YSivil Kanat§! genellikle sivil sanayiye ağırlık veren demokrasi yanlısı politikaları destekler. §YAskerî Kanat§! ise faşizm yanlısı politikaları ve sanayinin askerîleştirilmesini tercih eder.\n\nKararlarımız bu grupların bize olan desteğini artırır veya azaltır; buna bağlı olarak farklı avantajlar ve cezalar uygulanır.\nİsyancı hâle gelirlerse darbe girişiminde bulunabilirler.\n\nDestek seviyeleri: §Yİsyancı§!, §YMuhalif§!, §YTarafsız§!, §YSınırlı Destek§! ve §YTam Destek§!"
 SIA_the_king_of_the_white_elephant:0 "Beyaz Fil Kralı"
 SIA_the_king_of_the_white_elephant_desc:0 "Kayıp toprakları geri alma histerisi ulusu sürüklemekle tehdit ediyor ve dünya izliyor. Bu gayreti yumuşatmak için, dünyaya [SIA.GetName]'in gerçek yüzünü göstermek amacıyla İngilizce çekilmiş ilk Tayland filmi olan bir savaş karşıtı film çekeceğiz."
 SIA_the_king_of_the_white_elephant_tt:0 "Şu milli hedef tamamlandığında §Y$SIA_the_king_of_the_white_elephant$§! Propaganda Kampanyası'nın kilidini açar: §Y$SIA_sala_chaloem_thai_movie_theater$§! ve şunları sağlar:\nHaftalık İstikrar: 180 gün boyunca §G+0.45%§!"
 SIA_the_kings_gambit:0 "Kralın Hamlesi"
 SIA_the_kings_gambit_desc:0 "Prajadhipok, rejimin onu tutuklayacağı beklentisiyle Bangkok'a dönüyor. Bu eylem, kralcılara tereddütü bir kenara bırakıp onun adına ayaklanmak için ihtiyaç duydukları öfkeyi, meşruiyeti ve otoriteyi sağlayacaktır. Sürgündeki kral yakalandığında, işaret verilecek ve [ROOT.GetName] için mücadele başlayacak."
 SIA_the_kings_gambit_tt:0 "Desteğimiz, yanımızda kaç klik olduğuna bağlı olacak."
 SIA_the_malay_peninsular_defense_plan:0 "Malay Yarımadası Savunma Planı"
 SIA_the_malay_peninsular_defense_plan_desc:0 "Eğer savaş Güneydoğu Asya'ya gelirse, Malaya ilk savaş alanlarından biri olacaktır. Tahkimatlar, tedarik depoları ve İngilizlerle ortak planlama, yarımadayı istilaya karşı bir kalkan haline getirecektir."
 SIA_the_malay_peninsular_defense_plan_tt:0 "Bangkok ve Singapur arasında bir demiryolu inşa eder.\n\n[MAL.GetName], Singapur, [724.GetName], [289.GetName] ve [1076.GetName] içindeki her Zafer Puanı:\n§G2§! §YKıyı Tahkimatı§! ekle\n§G2§! §YKara Tahkimatı§! ekle\nBu eyaletlerin her biri:\n§G1§! §YStatik Uçaksavar§! ekle"
 SIA_the_midnight_meeting:0 "Gece Yarısı Toplantısı"
 SIA_the_midnight_meeting_desc:0 "Mareşal Songsuradet, Phibun'un giderek daha fazla güç kazandığını izliyor ve bunda bir hesaplaşma sözü görüyor. Monarşi ve Songsuradet hayatta kalacaksa, kralcılar, üst düzey subaylar ve sivil ileri gelenler gizlice buluşmalı ve Phibun onlara karşı hareket etmeden önce görevden alınması konusunda anlaşmalıdır."
 SIA_the_midnight_meeting_tt:0 "[SIA_plaek_phibunsongkhram.GetName] [SIA.GetNameDef]'de iktidarı ele geçirecek ve hükümete liderlik edecek. Monarşiyi eski haline getirmek için onu koltuğundan etmemiz gerekecek."
 SIA_the_peoples_day:0 "Halk Günü"
 SIA_the_peoples_day_desc:0 "Eski monarşiyi devirmede ordunun rolüne daha fazla vurgu yapmak yerine, halkın kendi rolünü yüceltmeliyiz. Bir Halk Günü belirlemek ulusu harekete geçirecek ve vatandaşlarımıza daha azını beklememeyi öğretecektir."
 SIA_the_peoples_war_in_asia:0 "Asya'da Halk Savaşı"
 SIA_the_peoples_war_in_asia_desc:0 " [JAP.GetAdjective] emperyalizmine karşı mücadele sadece devletler arası bir yarışma değildir. Bu, işçilerin, köylülerin ve askerlerin yurt dışından gelen tahakküme karşı savaşıdır. Çin'deki komünist güçlerin yanında durarak, [ROOT.GetNameDef] Asya genelinde daha geniş bir halk savaşına kendini adamıştır."
 SIA_the_phayap_army:0 "Phayap Ordusu"
 SIA_the_phayap_army_desc:0 "Eğer kaderimizi işgalciyle birleştirirsek, ordularımıza yeni savaş düzeninde bir yer verilmelidir. Batı ve kuzeydeki operasyonlar için özel bir saha komutanlığı, [ROOT.GetName]'in güçlü ortağının yanında ilerlemesine ve kendi kazanımlarının peşinden gitmesine olanak tanıyacaktır."
 SIA_the_phayap_army_no_war_tt:0 "Müttefikimizin Phayap Ordusu'nun katılabileceği bir savaşı bulunmadığından, ordu kendisine ait bir cephe olmadan toplanacak."
 SIA_the_provincial_council_of_state:0 "İl Devlet Konseyi"
 SIA_the_provincial_council_of_state_desc:0 "Savaş, hükümet mekanizmasını kırık ve otoriteyi belirsiz bıraktı. Genç Kral Ananda kendi adına hüküm sürene kadar, İl Devlet Konseyi geçici hükümet olarak görev yapmalı ve kralcıların kendileri için değil, yasal monarşinin restorasyonu için savaştıklarını ilan etmelidir."
 SIA_the_purge:0 "Temizlik"
 SIA_the_purge_desc:0 "Askeri klik, sivil yönetime boyun eğmek yerine ulusu kana buladı. Hainlerle uzlaşma olamaz. Subaylar, işbirlikçiler ve sempatizanlar, devleti tekrar tehdit edemeyecek hale gelmeden önce her komuta kademesinden temizlenmelidir."
 SIA_the_regency_of_boworadet:0 "Boworadej Vesayeti"
 SIA_the_regency_of_boworadet_desc:0 "Prens Boworadej eski düzenin prestijini taşıyor ve sadakatinin nerede olduğundan kimsenin şüphesi olamaz. Onu Ananda adına Naip atayarak, devleti muhafazakar ellere bırakıyor ve restorasyonun sadece bir bakan değişikliğinden fazlası olacağını açıkça belirtiyoruz."
 SIA_the_regency_of_rangsit:0 "Rangsit Vesayeti"
 SIA_the_regency_of_rangsit_desc:0 "Prens Rangsit, monarşinin ancak temsili hükümetle uzlaşarak var olabileceğini anlıyor. Vesayeti, vakur bir muhafazakarlığa sahip, ancak yöntemi demokratik olan ve [ROOT.GetNameDef]'e istikrarlı bir parlamenter gelecek vermeye hazır bir kraliyet restorasyonu sunuyor."
 SIA_the_regency_of_songsuradet:0 "Songsuradet Vesayeti"
 SIA_the_regency_of_songsuradet_desc:0 "Songsuradet bir liberal değil, ancak modern bir devletin ihtiyaçlarına da kör değil. Naip olarak kraliyet otoritesini korurken [ROOT.GetNameDef]'in geleceğini disipline, planlamaya ve askeri güdümlü ulusal kalkınma programına emanet edebilir."
 SIA_the_royal_police_counterweight:0 "Kraliyet Polisi"
 SIA_the_royal_police_counterweight_desc:0 "Kraliyet Polisi bağımsız bir güç olarak hareket eder ve muhalefetimiz iktidarı ele geçirmeye çalışırsa onlara karşı kaldıraç olarak kullanılabilir."
 SIA_the_royal_police_counterweight_tt:0 "Bir §Yİç Savaş§! patlak verirse Kraliyet Polisi bizi destekleyecek, §Y2§! ek tümen sağlayacak."
 SIA_the_sacred_hierarchy:0 "Kutsal Hiyerarşi"
 SIA_the_sacred_hierarchy_desc:0 "Boworadej, krallığın en güçlü zamanının, her zümrenin yerini bildiği ve Tacın tüm dünyevi hırsların üzerinde durduğu zaman olduğuna inanır. Monarşi, inanç ve [ROOT.GetNameDef]'in doğal hiyerarşisi, pazarlık edilecek kalıntılar değil, kutsal sütunlar olarak tekrar görülmelidir."
 SIA_the_siamese_armada:0 "[SIA.GetAdjective] Donanması"
 SIA_the_siamese_armada_desc:0 "Modern bir [SIA.GetName] modern bir donanma gerektirir. Yeni gemiler, eğitimli mürettebat ve genişletilmiş deniz altyapısı ile [SIA.GetAdjective] Donanması, kıyılarımızı savunma ve ötesine güç yansıtma yeteneğine sahip bir güç haline gelecektir."
 SIA_the_songsuradet_rebellion:0 "Songsuradet İsyanı"
 SIA_the_songsuradet_rebellion_alt_tt:0 "General Phraya Songsuradet devlete komplo kurmakla suçlanacak.\n\nAncak askeri grubunu güçlendirdiğimiz için cesaretlenebilir ve çağrıyı reddedebilir, bu da bir çıkmaza veya potansiyel olarak bir iç savaşa yol açabilir."
 SIA_the_songsuradet_rebellion_desc:0 "Üst düzey subay Phraya Songsuradet, eğer isterse mevcut rejim için bir tehdittir. Rejim için bu tehlike devam edemez ve Phibun'un baş rakibi olarak gitmelidir.\nSongsuradet ve destekçileri aleyhinde kullanılabilecek şüphesiz çok sayıda zarar verici malzeme vardır, bu da gücümüzü pekiştirmemize ve yerel muhaliflerimizi ortadan kaldırmamıza yardımcı olacaktır."
 SIA_the_songsuradet_rebellion_historical_tt:0 "General Phraya Songsuradet devlete komplo kurmakla suçlanacak. O ve danışman §Y[SIA_rangsit_prayurasakdi.GetName]§! temizlenecek.\n\nŞunları kazanacağız\n"
 SIA_the_songsuradet_rebellion_historical_tt2:0 "Süre bittikten sonra kazanılacaklar: "
 SIA_the_songsuradet_rebellion_historical_tt3:0 "§Y[?var:SIA_purged_military_timer]§! gün boyunca"
 SIA_the_thonburi_arsenal:0 "Thonburi Cephaneliği"
 SIA_the_thonburi_arsenal_desc:0 "Silahsız bir tersane eksik kalır. Thonburi'de bir cephaneliğin kurulması; deniz toplarının, mühimmatın ve ilgili ekipmanların üretimine ve depolanmasına izin verecek, filomuzu ulusal endüstriye daha yakından bağlayacaktır."
 SIA_the_thonburi_dockyard_project:0 "Thonburi Tersane Projesi"
 SIA_the_thonburi_dockyard_project_desc:0 "Bir donanma, sadece ithal gövdelerle sürdürülemez. [ROOT.GetNameDef] deniz kuvvetlerini korumak ve genişletmek istiyorsa; deniz gücünün gerçek temeli olan tersanelere, atölyelere ve iş gücüne yatırım yapmalıdır."
 SIA_the_thunder_at_the_gates:0 "Kapıdaki Gök Gürültüsü"
 SIA_the_thunder_at_the_gates_desc:0 "Sıradan silahların kıramayacağı kaleler ve ezici güçle duyurulması gereken saldırılar vardır. Ağır toplar, kuşatma topları ve demiryolu parçaları, [ROOT.GetNameDef]'e, bizim kısıtlamamızı zayıflık sanan herhangi bir düşmanın kapılarını kırma gücü verecektir."
 SIA_the_true_heirs_of_1932:0 "1932'nin Gerçek Mirasçıları"
 SIA_the_true_heirs_of_1932_desc:0 "Ordu, 1932 devrimini tek başarıları olarak çerçevelemeyi sever, bunun halk için bir zafer olduğu gerçeğini görmezden gelir. İnsanlara sadece bu gerçeği hatırlatmak gerekiyor, biz de gücümüzü onlardan alacağız."
 SIA_the_yellow_dossier:0 "Sarı Dosya"
 SIA_the_yellow_dossier_desc:0 "Sahte radikal taslak işini yaptı. Şimdi asıl Sarı Dosya uygulanabilir: askeri hakimiyeti kırmak için tasarlanmış ölçülü reform, ekonomik modernleşme ve siyasi güvenceler, ulusu kaosa teslim etmeden."
 SIA_thonburi_class_coastal_defense_ship:0 "Thonburi Sınıfı Kıyı Savunma Gemisi"
 SIA_thonburi_class_coastal_defense_ship_desc:0 "Mütevazı bir filo, yerel koşullar için uygun şekilde tasarlanırsa keskin dişler sergileyebilir. Thonburi sınıfı; [ROOT.GetNameDef]'e, saygın ateş gücünü en acil korumamız gereken sulara uygun bir rolle birleştirerek pratik bir kıyı savunması aracı sunar."
 SIA_to_forge_a_king:0 "Bir Kral Şekillendirmek"
 SIA_to_forge_a_king_desc:0 "Kral Ananda, zihni ve karakteri hala şekillenmekte olacak kadar gençken çok uzakta, İsviçre'de kalmaya devam ediyor. Çalışmalarına dikkatlice rehberlik edersek, sadece taç giymiş bir figüran değil, [ROOT.GetNameDef]'e niyet ettiğimiz kadere uygun bir hükümdar şekillendirebiliriz."
 SIA_to_forge_a_king_tt:0 "Geleceğin Kralı Ananda Mahidol şu anda genç ve [SWI.GetName]'de eğitim görüyor. Gelecekteki çalışmalarını ve ilgi alanlarını etkileyebilir, böylece harika bir kral olmasını sağlayabiliriz.\n\nHer yıl, doğum gününde, 15 yaşına gelene kadar, tahta çıktığında çeşitli bonuslar verecek olan bir ilgi alanı seçebileceğiz.\n\nDoğum tarihi 20 Eylül ve yaşı §Y[?var:SIA_anandas_age]§!"
 SIA_to_lay_the_bait:0 "Yemi Hazırlamak"
 SIA_to_lay_the_bait_desc:0 "Sarı Dosya ekonomik reform çağrısı yapıyor, ancak ordu buna komünist diyecek. Önce sahte radikal bir taslak sızdırarak öfkelerini kışkırtabilir, ardından asıl, daha ılımlı versiyon yayınlandığında onları itibarsızlaştırabiliriz."
 SIA_to_lay_the_bait_tt:0 "Askeriyeyi kışkırtmak için sahte bir ekonomik plan sızdıracağız.\n§Y$SIA_and_spring_the_trap$§! sürecini ne kadar ertelersek, orduya karşı tepki o kadar büyük olacak ve desteğimiz o kadar güçlenecektir.\n\n$SIA_dem_event_count_cw_scale_tt$\n\nOrdu sahte taslağı her eleştirdiğinde iç savaş desteğimiz, §Y75%§! iç savaş desteği sınırına kadar artacak. Toplam demokratik desteğimizden (§Y0%-100%§! arası ölçekli) ek §Y25%§! iç savaş desteği kazanılabilir"
 SIA_tropical_air_operations:0 "Tropikal Hava Operasyonları"
 SIA_tropical_air_operations_desc:0 "Sıcaklık, nem, muson yağmurları ve engebeli ileri hava sahaları uçaklara ve mürettebata kendi taleplerini dayatır. Motorları, bakım programlarını ve pilot doktrinini bu koşullara uyarlayarak, Müdürlük hava kuvvetlerimizi Güneydoğu Asya semalarında daha güvenilir hale getirebilir."
 SIA_tropical_operations:0 "Tropikal Operasyonlar"
 SIA_tropical_operations_desc:0 "Isı, muson ve orman gölgesi, dikkatsiz havacıları düşman silahlarından daha fazla cezalandırır. Hava kolumuzu kendi bölgemizin iklimine göre tasarlayıp, hava şartlarına rağmen karadaki düşmana sert vuracağız."
 SIA_turn_off_the_khana_ratsadon:0 "Khana Ratsadon devre dışı bırakıldı"
 SIA_uk_japan_focus_tt:0 "Bu, [ENG.GetNameDef] ve [JAP.GetNameDef] arasında seçim yapmayı sağlar, şu etkilerle:\n\n§Y[ENG.GetFlag][ENG.GetNameDefCap]§!:"
 SIA_unconventional_tank_construction:0 "Alışılmadık Tank İnşası"
 SIA_unconventional_tank_construction_desc:0 "Büyük güçlerin zırh programlarını parça parça taklit edemeyiz. [ROOT.GetNameDef]'in hiç tank sahaya sürmesi gerekiyorsa; ihtişamdan ziyade sayılara ve faydaya odaklanan daha ucuz ve daha uyarlanabilir inşa yöntemleri izlemeliyiz."
 SIA_united_against_aggression:0 "Saldırganlığa Karşı Birleşik"
 SIA_united_against_aggression_desc:0 "Paktımızın hiçbir üyesi tek başına durmayacaktır. Tehdit ister imparatorluktan, faşizmden, militarizmden veya fırsatçı komşulardan gelsin, Asya ulusları birlikte cevap verecektir."
 SIA_united_against_aggression_tt:0 "Şunları kazan:\n$army_defence_factor_tt$ §G[?var:SIA_adc_army_defence_factor_per_country|%]§!\n$max_dig_in_factor_tt$ §G[?var:SIA_adc_max_dig_in_factor_per_country|%]§!\n$army_org_factor_tt$ §G[?var:SIA_adc_army_org_factor_per_country|%]§!\nittifakımızdaki her üye için."
 SIA_unlock_character_as_advisor_tt:0 "§Y$CHARACTER$§! danışman olarak kullanılabilir hale gelir."
 SIA_unseat_the_government:0 "Hükümeti Koltuğundan Et"
 SIA_unseat_the_government_desc:0 "[ROOT.GetNameDef]'i yabancı tahakküme bağlayan bir rejimin sonsuza dek sürmesine izin verilemez. Direniş, entrika ve zamanında eylem yoluyla; ulusu tehlikeye atanları uzaklaştırabilir ve Siyam'a daha layık bir hükümeti restore edebiliriz."
 SIA_unseat_the_government_tt:0 "[ROOT.GetName] mevcut ittifakından ayrılacak ve savaşta taraf değiştirerek §YMüttefikler§!e katılacak.\n\nSadıklar bu değişikliğe karşı ayaklanarak bir iç savaş başlatacak.\n\nEğer toplam desteğimiz §Y80%'den fazlaysa§! hükümeti devireceğiz ve bir iç savaştan kaçınacağız. Toplam desteğimiz, demokratik desteğimize ek olarak tarafımıza çekilen her general için §Y5%§! kadardır.\n\nTarafımıza çekilen generallerden gelen desteğimiz §Y[?var:SIA_seri_thai_cw_scale|%]§! ve demokratik desteğimiz §Y[?var:party_popularity@democratic|%]§!"
 SIA_use_ships_as_generators:0 "Gemileri Jeneratör Olarak Kullan"
 SIA_use_ships_as_generators_desc:0 "Daha eski gemiler, artık savaş veya ticaret için uygun olmadıklarında bile ulusa hizmet edebilirler. Gemileri yüzen güç istasyonları olarak demirleyerek, kıymetli yakıt ve altyapıyı korurken limanlara ve kıyı endüstrisine acil durum elektriği sağlayabiliriz."
 SIA_use_ships_as_generators_tt:0 "Sahip olduğumuz §YKruvazör Sınıfı Gemileri§! §YÇekirdek Eyalet Limanlarına§! yerleştirmek, §YKruvazör Sınıfı Gemi§! başına §G-2%§! Fabrika Enerji Tüketimi bonusu verecek, toplamda §G-15%§! sınırına kadar.\n\nBu gemilerin limandan ayrılması bonusu aynı oranda azaltacak ve gemilerin tekrar limana yerleştirilmesiyle geri kazanılabilir."
 SIA_veteran_jungle_aviators:0 "Kıdemli Orman Havacıları"
 SIA_veteran_jungle_aviators_desc:0 "Bu iklimde uçmak hem yeşil pilotları hem de aşınmış motorları kırar. Daha iyi bakım ve zor kazanılan deneyim, hayatta kalmayı beceriye ve beceriyi aslara dönüştürecektir."
 SIA_war_fervor:0 "Savaş Coşkusu"
 SIA_war_fervor_desc:0 "Davullar yaklaşan çatışmanın beklentisiyle çalıyor. Halk hazırlandı, fitil ateşlendi ve savaş coşkusu yakında zirveye ulaşacak. Bu enerjiyi değerli bir amaca yönlendirmeye dikkat etmeliyiz."
 SIA_war_fervor_tt:0 "Savaş Desteği, başka bir ülkeye savaş ilan edene kadar kalıcı olarak artacak, ilan edildiğinde ruh hali kaldırılacak.\n\nEğer §YSavaş Desteği§! çok uzun süre bir savaş ilanı olmadan §Y95%§! üzerinde kalırsa bir iç savaş başlayacak.\nSavaş ilan edildiğinde: "
 SIA_war_material_substitutions:0 "Savaş Malzemesi İkamesi"
 SIA_war_material_substitutions_desc:0 "Abluka zamanında, mükemmel malzeme mevcut olandan daha az değerlidir. Yabancı mallar artık kıyılarımıza ulaşmadığında bile üretimin devam edebilmesi için metaller, kimyasallar ve ithal bileşenler için ikameleri incelemeliyiz."
 SIA_when_civil_war_starts:0 "İç Savaş başladığında:"
 SIA_womens_auxiliary_air_force:0 "Kadın Yardımcı Hava Kuvvetleri"
 SIA_womens_auxiliary_air_force_desc:0 "Yer ekiplerinden kurtarılan her tamirci, katip ve telsiz operatörü, havadaki bir başka pilottur. Taylandlı kadınlar hastanelerde ve bakanlıklarda kendilerini zaten kanıtlamış durumdalar; Don Mueang'ın havaalanları da farklı olmayacak."
 SIA_yield_the_air_war:0 "Hava Savaşından Vazgeç"
 SIA_yield_the_air_war_desc:0 "Büyük güçlere göklerde eşit şartlarda meydan okumayı umut edemeyiz. Değerli kaynakları kazanamayacağımız bir yarışta çarçur etmek yerine, hava savunmamızı güçlendirecek ve düşman uçaklarının askerlerimizi ve şehirlerimizi bedelsiz vurma özgürlüğünü reddedeceğiz."
