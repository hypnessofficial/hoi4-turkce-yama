 idea_SIA_conserve_air_crews:0 "Korunmuş Hava Ekipleri"
 idea_SIA_conserve_air_crews_desc:0 "Yalın bir hava kolu ön kısım için insan gücünü serbest bırakır. Uçağın güvenilirliği pahasına daha düşük hava yer mürettebatı insan gücü gereksinimi ve daha fazla işe alınabilir nüfus."
 idea_SIA_diverting_army_funds_to_navy:0 "Ordu fonlarını Donanmaya yönlendir"
 idea_SIA_fighter_type_12:0 "Tip 12 Eğitimi"
 idea_SIA_fighter_type_12_desc:0 "Çevik Type 12 üzerinde yoğun bir eğitim döngüsü, pilotlarımızın en keskin şekilde uçmasını ve asların önderlik etmesini sağlar. Hızın sonsuza kadar sürdürülmesi mümkün değil."
 idea_SIA_german_tank_studies:0 "Alman Tank Çalışmaları"
 idea_SIA_german_tank_studies_desc:0 "Subaylarımız yabancı zırhlı doktrini ve tasarımını incelemek için zaman harcadılar, kendi zırhlı kuvvetlerimizin geliştirilmesini doğrudan besleyen teknik bilgilerle döndüler."
