 idea_SIA_bomber_procurement_program_desc:0 "Kolaylaştırılmış sözleşmeler ve lisanslı üretim, taktik bombardıman filomuzun maliyetini önemli ölçüde düşürdü, ancak uygun koşullar yalnızca mevcut sözleşmeler devam ettiği sürece geçerli olacak."
