 idea_SIA_specialized_airframe_construction_conserve:0 "Özel Savaş Uçağı Gövdesi"
 idea_SIA_specialized_airframe_construction_conserve_desc:0 "Fabrikalarımız tek bir savaş uçağı gövdesine göre ayarlanmıştır ve yalın bir zemin tesisi tarafından bakılmaktadır. Güvenilirlik pahasına daha çevik ve daha uzağa uçuyor ve yapımı daha az maliyetli; kiralamadığımız teknisyenler bunun yerine ön tarafta hizmet veriyor. Daha sonra uçak gövdeleri bunun için acı çekmeye hazır değiliz."
