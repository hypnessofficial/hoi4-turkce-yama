 idea_SIA_specialized_airframe_construction_increase_desc:0 "Fabrikalarımız tek bir savaş uçağı gövdesine göre ayarlanmıştır ve tam yer ekipleri onu havada tutar. Daha çevik ve daha uzağa uçar ve inşa edilmesi daha az maliyetlidir ve daha iyi bakım, bunu zorlayan bir tasarımın kırılganlığını telafi eder. Daha sonra uçak gövdeleri bunun için acı çekmeye hazır değiliz."
