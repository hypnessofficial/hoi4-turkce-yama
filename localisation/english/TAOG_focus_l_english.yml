 idea_SIA_joint_military_command:0 "Müşterek Askeri Komutanlık"
 idea_SIA_joint_military_command_desc:0 "Birleşik bir komuta yapısı, şubeler arasındaki koordinasyonu geliştirmiş, deneyimli subayların ve muharebe doktrininin gelişimini hızlandırmıştır."
 idea_SIA_kra_air_defense:0 "Kra'nın Hava Savunması"
 idea_SIA_kra_air_defense_desc:0 "Hava şartlarında yarımadanın dağlık omurgası boyunca uzanan gizli direkler ve davetsiz misafirin ilk görüşü ve filolarımız kendilerini neyin beklediğini bilerek uçuyor."
 idea_SIA_land_war_in_asia:0 "Asya'da Kara Savaşı"
 idea_SIA_license_equipment_conserve:0 "Lisanslı Üretim Ağı"
 idea_SIA_license_equipment_conserve_desc:0 "Çinhindi endüstrisinin kontrolü, insan gücünü orduya bırakan sağlam bir tesis tarafından hizmet verilen, lisans altında yabancı tasarımları çok daha ucuz ve hızlı bir şekilde inşa etmemize olanak tanıyor."
 idea_SIA_license_equipment_increase:0 "Lisanslı Üretim Ağı"
 idea_SIA_license_equipment_increase_desc:0 "Çinhindi endüstrisinin kontrolü, lisans altında yabancı tasarımları çok daha ucuz ve hızlı bir şekilde üretmemize olanak tanıyor ve tam yer ekiplerimiz, lisanslı makinelerin uçmasını sağlıyor."
