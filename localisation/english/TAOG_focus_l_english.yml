l_english:
 ABDA_abdacom:0 "ABDACOM'u Kur"
 ABDA_abdacom_desc:0 "Düşman güçleri Güneydoğu Asya ve Pasifik genelinde hızla ilerlerken, bölgedeki müttefik kuvvetler onları durdurmak için tek vücut olarak hareket etmelidir. Müşterek bir yüksek komuta kurarak kaynaklarımızı birleştirebilir, donanma varlıklarımızı koordine edebilir ve düşmana karşı birleşik bir cephe sunabiliriz."
 ABDA_basic_available_trigger_tt:0 "Herhangi bir ABDACOM üyesiyle savaşta değil"
 ABDA_corps_expeditionnaire:0 "CEFEO"
 ABDA_corps_expeditionnaire_desc:0 "Fransız Çinhindisi, ABDACOM savunma hattının kuzey kanadında yer alıyor. [FRA.GetNameDef], Uzak Doğu Fransız Seferi Kuvvetleri'ni (Corps Expéditionnaire Français en Extrême-Orient) aktif operasyonlara dahil ederek sömürge kuvvetlerinden gelen hayati insan gücünü ve deneyimi ortak komutaya kazandıracak."
 ABDA_develop_naval_infrastructure:0 "Deniz Altyapısını Geliştir"
 ABDA_develop_naval_infrastructure_ast_tt:0 "[AST.GetName], bir çekirdek eyalette §Y2 tersane§! alır."
 ABDA_develop_naval_infrastructure_desc:0 "Pasifik'teki sürdürülebilir deniz operasyonları üsler, yakıt depoları ve onarım tesisleri gerektirir. Limanlarımızın ve demirleme yerlerimizin altyapısına yatırım yapmak, ABDA deniz kuvvetlerinin erişimini ve dayanıklılığını uzatacaktır."
 ABDA_develop_naval_infrastructure_generic_tt:0 "§YABDACOM§! üyeliğine bağlı olarak, [AST.GetName] ve [INS.GetName] her biri çekirdek eyaletlerinde 2 tersane alabilir."
 ABDA_develop_naval_infrastructure_ins_tt:0 "[INS.GetName], bir çekirdek eyalette §Y2 tersane§! alır."
 ABDA_expand_the_command:0 "Komutayı Genişlet"
 ABDA_expand_the_command_desc:0 "ABDACOM değerini kanıtladı. Şimdi o temel üzerinde inşa etmeli, üyeliği bölgedeki diğer Müttefik uluslara genişletmeli ve düşmanın önünde kalmak için araştırma ve istihbarat paylaşımımızı derinleştirmeliyiz."
 ABDA_expand_the_command_tt:0 "Eğer ittifakımızdalarsa ABDACOM üyeliğini [SIA.GetName], [NZL.GetName] ve [MAL.GetName] unsurlarına genişleterek onlara mevcut gücündeki tam §Y$ABDA_supreme_command$§! çarpanını verir."
 ABDA_fortress_singapore:0 "Singapur Kalesi"
 ABDA_fortress_singapore_desc:0 "Singapur, bölgedeki savunma stratejimizin anahtarıdır. Tahkimatlarını güçlendirmek ve güçlü bir şekilde garnizonlamak, ABDACOM çabası için kritik zaman kazandıracak ve düşmanın hızlı bir stratejik zafer kazanmasını engelleyecektir."
 ABDA_keep_trade_open:0 "Ticareti Açık Tut"
 ABDA_keep_trade_open_desc:0 "[INS.GetNonIdeologyName]'in kauçuğu ve petrolü, Müttefik savaş çabası için kritiktir. ABDACOM, bu hayati kaynakları taşıyan deniz yollarını korumalı, konvoyları düşman saldırısından korumalı ve ticaretin endüstrilerimize akmasını sağlamalıdır."
 ABDA_keep_trade_open_modifier_tt:0 "§Y$ABDA_supreme_command$§!'i şununla değiştirir:\n §G+10%§! Eskort Verimliliği\n §G+10%§! Eskort Savunması"
 ABDA_maintain_strategic_flexibility:0 "Stratejik Esnekliği Koru"
 ABDA_maintain_strategic_flexibility_desc:0 "Amerika Birleşik Devletleri güçlerini tek bir tiyatroya aşırı taahhüt etmemelidir. Stratejik rezervimizi dikkatli bir şekilde yöneterek, Amerikan endüstriyel ve askeri gücünün Pasifik genelinde en çok ihtiyaç duyulan her yerde devreye sokulmasını sağlıyoruz."
 ABDA_malay_barrier_modifier_tt:0 "§Y$ABDA_supreme_command$§!'i şununla değiştirir:\n §G+15%§! Onarım Hızı\n §G+10%§! Konvoy Eskort Verimliliği"
 ABDA_naval_procurement:0 "Deniz Tedariki"
 ABDA_naval_procurement_ast_ships_tt:0 "[AST.GetName], [USA.GetAdjective] güveçli filolarından transfer edilen §Y6 Clemson Sınıfı muhrip§! alacak."
 ABDA_naval_procurement_desc:0 "Şimdiden uğranan kayıplar acil ikame talep ediyor. Koordineli bir ABDACOM tedarik programı; Pasifik tiyatrosuna en uygun muhriplere, denizaltılara ve devriye gemilerine öncelik verecek, birleşik filomuzun düşman genişlemesiyle eşleşebilmesini sağlayacaktır."
 ABDA_naval_procurement_generic_tt:0 "§YABDACOM§! üyeliğine bağlı olarak, [INS.GetNameDef], [HOL.GetNameDef] ve [AST.GetNameDef] her biri [USA.GetAdjective] güveçli filolarından transfer edilen §Y6 Clemson Sınıfı muhrip§! alabilir."
 ABDA_naval_procurement_hol_ships_tt:0 "[HOL.GetName], [USA.GetAdjective] güveçli filolarından transfer edilen §Y6 Clemson Sınıfı muhrip§! alacak."
 ABDA_naval_procurement_ins_ships_tt:0 "[INS.GetName], [USA.GetAdjective] güveçli filolarından transfer edilen §Y6 Clemson Sınıfı muhrip§! alacak."
 ABDA_ship_a_day_modifier_tt:0 "§Y$ABDA_supreme_command$§!'i şununla değiştirir:\n §G+10%§! Denizaltı Saldırısı\n §G+10%§! Denizaltı Savunması"
 ABDA_ship_a_day_sinking_quotas:0 "Gemi Batırma Kotaları"
 ABDA_ship_a_day_sinking_quotas_desc:0 "Pasifik genelinde uzanan düşman tedarik hatları onların stratejik zayıflığıdır. Denizaltı ve su üstü kuvvetlerimiz için agresif ve koordine edilmiş batırma kotaları belirleyerek, ABDACOM düşmanı lojistik olarak kanatabilir ve savunmaya zorlayabilir."
 ABDA_spirit_tooltip:0 "§YABDA Yüksek Komutanlığı§!'ni şununla değiştirir:"
 ABDA_the_malay_barrier:0 "Malay Bariyeri"
 ABDA_the_malay_barrier_desc:0 "Malaya'dan [INS.GetNonIdeologyName] üzerinden uzanan ada zinciri doğal bir savunma bariyeri oluşturur. ABDA kuvvetleri, düşman ilerleyişini yavaşlatmak için koordine edilmiş bir deniz ve kara savunması kurarak bu coğrafyadan yararlanmalıdır."
 ABDA_unified_naval_command:0 "Birleşik Deniz Komutanlığı"
 ABDA_unified_naval_command_desc:0 "Kara savunmaları kurulup altyapı yerleştirildiğine göre, ABDA artık tüm deniz kuvvetlerini tek bir birleşik komuta altına alabilir. Standartlaştırılmış sinyaller, paylaşılan istihbarat ve koordine edilmiş devriye rotaları, tiyatrodaki her bir geminin etkinliğini katlayacaktır."
 ABDA_unified_naval_command_modifier_tt:0 " §Y$ABDA_supreme_command$§!'i şununla değiştirir:\n §G+10%§! Gemi Deneyim Kazanımı"
 AST_15_natunity:0 "\n\n$AST_ruling_party$, bir §YUlusal Birlik Hükümeti§! kurmak için §Y15§! güne sahip."
 AST_COMINWEALTH_FACTION:0 "Cominwealth"
 AST_a_change_of_authority:0 "Otorite Değişimi"
 AST_a_change_of_authority_desc:0 "Uyumlu bir tebaadan, saygın ve iddialı bir ulusa dönüşen Avustralya için dünya güçlerinden biri olma yolunda nihai adımı atmanın zamanı geldi. [AST.GetFactionName]'in lideri olarak, dostlar bize saygı duyacak, düşmanlar ise bizden korkacak. Sıkı durarak ve hızlı hareket ederek, Avustralya teslim olmayacak."
 AST_a_change_of_authority_tt:0 " §Y[ROOT.GetName]§! artık savaş ilan edebilir.\n §Y[ROOT.GetName]§! artık savaşa çağrıyı reddedebilir.\n §Y[ROOT.GetName]§! artık Üst Sahibi'ne hiçbir Barış Puanı aktarmaz."
 AST_a_collapsing_league_of_nations:0 "Çöken Milletler Cemiyeti"
 AST_a_collapsing_league_of_nations_desc:0 "Milletler Cemiyeti çöküyor - iyi niyetli bir girişim, ne yazık ki gerçekçi olmayan umutlara dayanıyor. Yaptırım politikası, özellikle de asi ulusları dizginleyecek hiçbir silahlı kuvvet mevcut olmadığında kolayca boş jestler politikasına dönüşüyor. Yeniden silahlanmamız başlamalıdır."
 AST_a_comrade_emancipated:0 "Kurtarılmış Bir Yoldaş"
 AST_a_comrade_emancipated_desc:0 "Dünya genelinde, birçok ulus hala kapitalizmin zincirleri altında kalmaya devam ediyor, halklarına gerçek özgürlükleri reddediliyor. Özgür bir sosyalist devlet olarak, onların kurtuluşuna yardım etmek bizim görevimizdir. Dünya işçileri birleşin, bu zincirleri birlikte atacağız."
 AST_a_controversial_recruitment:0 "Tartışmalı Bir İşe Alım"
 AST_a_controversial_recruitment_desc:0 "Maurice Blackburn, baskıcı işverenlere karşı hukuki savaşlarda işçi haklarını savunmasıyla tanınan, ünlü bir sosyalist avukattır. İşçi Partisi üyesi olmasına rağmen, daha radikal olan Savaşa ve Faşizme Karşı Hareket ile olan bağları nedeniyle sadakati şüphe uyandırdı."
 AST_a_democratic_bulwark:0 "Demokratik Bir Kale"
 AST_a_democratic_bulwark_desc:0 "Faşist ve komünist tehditlere karşı güçlü durmak için demokrasiye öncülük etmeliyiz. Hükümet, vatandaşların yönetim mekanizması içinde temsil edilmesini ve politikacıların hoşnutsuzluğunun zararlı ideolojilere katılmak yerine farklı demokratik partilere katılarak giderilebilmesini sağlamak için proaktif önlemler politikası benimseyecektir."
 AST_a_domestic_supply_chain:0 "Yerli Tedarik Zinciri"
 AST_a_domestic_supply_chain_desc:0 "İç ekonomiye odaklanmamızın yan etkilerinden biri, son derece dirençli bir üretim sisteminin geliştirilmesidir. Tüm üretim seviyeleri evde temellendirildiğinden, dış şoklardan büyük ölçüde yalıtılmış durumdayız."
 AST_a_growing_womens_guild:0 "Büyüyen Kadınlar Loncası"
 AST_a_growing_womens_guild_desc:0 "1928'deki kuruluşundan bu yana, Avustralya İmparatorluk Kadınlar Loncası, ulusal ekonomik sorunlarla mücadele etmek için endüstriyel işbirliğini savundu. Milletin iyiliği için, vatandaşlar hükümetlerine yardım etmeli, ona karşı çalışmamalıdır. Önce Avustralya'nın başkanı olarak Pankhurst Walsh ile, siyasi hareketi aracılığıyla bu mesajı daha da yayabiliriz."
 AST_a_national_housing_commission:0 "Ulusal Konut Komisyonu"
 AST_a_national_housing_commission_desc:0 "Konut uzun süredir çekişmeli bir konu olmuştur. Herkes başını sokacak bir çatıya sahip olmayı hak ediyor, ancak bu temel ihtiyaç çoğu zaman işçilere karşı kullanılıyor, maliyeti bir ekonomik baskı biçimi. Artık yeter. Herkes için konuta adil erişim talep edeceğiz."
 AST_a_northern_barrier:0 "Kuzey Bariyeri"
 AST_a_northern_barrier_desc:0 "Düşman kuzeyden geliyor ve önünde kendi kapımıza varmadan önce istedikleri gibi vurabilecekleri daha küçük, hazırlıksız uluslar yatıyor. Tek bir bariyer oluşturmak için [INS.GetNameDef] ile birleşirsek, onları geri püskürtmek için bir şansımız olabilir."
 AST_a_rational_request:0 "Rasyonel Bir Talep"
 AST_a_rational_request_desc:0 "Singapur Stratejisi teoride tutuyor ama sadece teoride. Henry Wynter ve diğer sert sesler başından beri haklıydı; bir Pasifik savaşı çıkarsa Britanya büyük olasılıkla kendi kıtasında meşgul olacaktır ve Britanya yardımına dayalı bir strateji tutmayacaktır. Singapur'un kontrolünü talep edeceğiz ki okyanuslarımızın savunmasından biz sorumlu olalım."
 AST_a_throne_upon_the_seas:0 "Denizlerin Üzerinde Bir Taht"
 AST_a_throne_upon_the_seas_desc:0 "Krallığın nihayet denizlerde layık olduğunu kanıtlamanın zamanı geldi. Deniz kuvvetlerinin süper güçleri bizi artık dalgalar çağırırken ve yelkenlerimiz zorlanırken susturamaz. Sonunda okyanuslar bizim olacak."
 AST_a_throne_upon_the_seas_tt:0 "Avustralya ile karşılaştırıldığında tahmini donanma gücü oranı §Y%100§! veya daha fazla olan tüm düşman ülkeler:\n(§YHiçbir ülke§!):"
 AST_abolition_of_private_property:0 "Özel Mülkiyetin İlgası"
 AST_abolition_of_private_property_desc:0 "Endüstri çarkları işçilerin kanıyla yağlanıyor. Birikimin vahşetine son vermeli ve özel mülkiyeti tamamen kaldırmalıyız. Her şey paylaşılacak; herkes yeteneğine göre, herkes ihtiyacına göre."
 AST_absorb_the_uap:0 "UAP'yi Bünyeye Kat"
 AST_absorb_the_uap_desc:0 "Birleşik Avustralya Partisi her zaman liberal kalmış olsa da, aynı zamanda sağ eğilimlidir. Ancak dizginlerin başında yeni bir siyasi parti varken, UAP üyelerinin mevcut hükümetin davasını desteklemekten başka pek bir seçeneği olmayabilir. En önde gelen üyelerine ulaşacak ve onları Önce Avustralya Partisi'ne dahil edeceğiz."
 AST_administer_the_mandate:0 "Mandayı Yönet"
 AST_administer_the_mandate_desc:0 "1920'den beri Yeni Gine'yi Milletler Cemiyeti mandası altında yönettiğimiz ve Papua Federasyon'dan beri [AST.GetName]'in bir dış bölgesi olduğu için, Papua Yeni Gine'nin doğu kısmı [AST.GetName]'in çekirdek topraklarına doğal bir katkı olacaktır. Milletler Cemiyeti feshedildiğine göre, bu tür bir federal yeniden düzenleme gerçekleştirme fırsatı doğmuştur."
 AST_advance_pacific_initiatives:0 "Pasifik Girişimlerini İlerlet"
 AST_advance_pacific_initiatives_2_tt:0 "\nİlgili ülke ile savaşta olunursa binalar kaldırılacaktır."
 AST_advance_pacific_initiatives_chi_2_tt:0 "§Y[CHI.GetName]§! şunları sunuyor:"
 AST_advance_pacific_initiatives_chi_tt:0 " §Y[CHI.GetName]§! etkilerine §G2§! harita dışı §YSivil Fabrika§! eklemek için."
 AST_advance_pacific_initiatives_desc:0 "Kurmayı başardığımız saldırmazlık paktları sayesinde, Asyalı komşularımızla ilişkilerimiz iyileşti. Bu ilişkilerden en iyi şekilde yararlanmaya devam edeceğiz ve endüstriyel kalkınmamıza yardımcı olmaları için yeni müttefiklerimize çağrıda bulunacağız."
 AST_advance_pacific_initiatives_ins_2_tt:0 "§Y[INS.GetName]§! şunları sunuyor:"
 AST_advance_pacific_initiatives_ins_tt:0 " §Y[INS.GetName]§! etkilerine §G1§! harita dışı §YSentetik Rafineri§! eklemek için."
 AST_advance_pacific_initiatives_jap_2_tt:0 "§Y[JAP.GetName]§! şunları sunuyor:"
 AST_advance_pacific_initiatives_jap_tt:0 " §Y[JAP.GetName]§! etkilerine §G2§! harita dışı §YDonanma Tersanesi§! eklemek için."
 AST_advance_pacific_initiatives_tt:0 "\nŞunlarla saldırmazlık paktı yap:"
 AST_advanced_pilot_training:0 "İleri Pilot Eğitimi"
 AST_advanced_pilot_training_desc:0 "Uçaklar daha karmaşık, daha hızlı ve daha gelişmiş hale geldikçe, pilotlarımızın becerileri de bu teknolojilerden tam olarak yararlanmak için buna uygun şekilde gelişmelidir."
 AST_advanced_pilot_training_tt:0 "§YHava Doktrinleri§! için §G+10%§! Ustalık Kazanma Hızı."
 AST_aerial_defense:0 "Hava Savunması"
 AST_aerial_defense_desc:0 "Eğer bir dünya gücüne denk bir donanma karşılayamıyorsak (ki karşılayamayız), bize karşı getirilebilecek herhangi bir filoya denk bir hava filosu sürdürmek hala elimizdedir."
 AST_aerodrome_of_democracy:0 "[GET_AERODOME_NAME]"
 AST_aerodrome_of_democracy_communism:0 "Kurtuluş Hava Meydanı"
 AST_aerodrome_of_democracy_democracy:0 "Demokrasi Hava Meydanı"
 AST_aerodrome_of_democracy_desc:0 "Havacılık yeteneklerinin ön saflarına ulaşan Avustralya Hava Kuvvetleri, '[GET_AERODOME_NAME]' unvanını kazandı. Uçucularımız dünya çapında hava muharebelerine girerken, bombardıman uçaklarımız düşmanlarımızın endüstrileri üzerinde ölümcül bir gölge oluşturuyor."
 AST_aerodrome_of_democracy_fascism:0 "Tahakküm Hava Meydanı"
 AST_aerodrome_of_democracy_neutrality:0 "Güç Hava Meydanı"
 AST_against_war_and_fascism:0 "Savaşa ve Faşizme Karşı"
 AST_against_war_and_fascism_desc:0 "Savaşa ve Faşizme Karşı Hareketi, işçileri gerici güçlere karşı seferber etmek için Komintern destekli uluslararası bir çabanın Avustralya koludur. Son yıllarda ivme kaybetmiş olsa da, sancağı bir kez daha ileri taşımak bize düşüyor."
 AST_alice_springs:0 "Alice Springs"
 AST_alice_springs_desc:0 "Outback çok büyük... gerçekten çok büyük. Kalbinde, Avustralya genelindeki operasyonlar için merkezi bir lojistik merkez görevi görebilecek küçük Alice Springs kasabası yer alır. Onu geliştirmeli ve her ortama hazır askerler eğitmek için bir ordu üssü kurmalıyız."
 AST_all_dressed_up:0 "Hazır ve Nazır"
 AST_all_dressed_up_desc:0 "Eğer Avustralyalı askerler Britanya savaşlarında savaşacaksa, onları Britanya fabrikaları donatmalıdır."
 AST_all_for_one_one_for_all:0 "Birimiz Hepimiz İçin, Hepimiz Birimiz İçin"
 AST_all_for_one_one_for_all_desc:0 "'Hepimiz için birimiz, daha fazlası da benim için', burjuvazinin uzun süredir devam eden haykırışı oldu; açgözlülükleri geri verirken her zaman daha fazlasını talep ediyor. Servetin aşağıya akacağı vaadi bir yalandır. Herkes tarafından ve herkes için eşit olarak paylaşılmalıdır."
 AST_allied_after_all:0 "Yine de Müttefik"
 AST_allied_after_all_desc:0 "Avustralya bağımsızlığı bir zorunluluk olsa da, eski efendimizle tüm işbirliği sona ermeyecektir. [ENG.GetFactionName]'e her zaman olduğumuz gibi sadık kalacağız, ancak ittifak içinde daha fazla nüfuz hedefleyeceğiz."
 AST_alp:0 "§YA.L.P§!"
 AST_alp_50_discount:0 "\n\n§YDemokratik Oyların >50%'sine sahip olmanın etki§!:\n(§YA.L.P§! Milli Hedef kümeleri):\n§Y5§! gün Tamamlanma Süresi azalması.\n\n§YA.L.P§! Milli Hedef kümelerinde §Y10§! günlük Tamamlanma Süresi indirimi almak için Oyları §Y70%'nin üzerine§! çıkarın."
 AST_alp_70_discount:0 "\n\n§YDemokratik Oyların >70%'sine sahip olmanın etki§!:\n(§YA.L.P§! Milli Hedef kümeleri):\n§Y10§! gün Tamamlanma Süresi azalması."
 AST_alp_becomes_ruling_party:0 "§YAvustralya İşçi Partisi§! iktidardaki parti olur."
 AST_alp_candidate_text:0 "§YAvustralya İşçi Partisi§!\n[AST_GET_ALP_LEADER_TEXT]\n\n§LYabancı Çıkarlardan Önce Yerel İhtiyaçlar§!\n\n[GET_AST_ALP_RULING]"
 AST_alp_cluster_unlock:0 "Bir sonraki §YA.L.P§! Milli Hedef kümesinin §Gkilidi açılır§!."
 AST_alp_confirmed_election_winner_text:0 "§YA.L.P§! §WSEÇİM ZAFERİ§!"
 AST_alp_decrease_votes_daily_impact:0 "\n §YA.L.P§! değişikliklerinden dolayı: §G+[?AST_alp_votes_daily_impact_var|2G]%§!"
 AST_alp_discount:0 "\n\n§YA.L.P§! Milli Hedef kümelerinde §Y5§! günlük Tamamlanma Süresi indirimi almak için Oyları §Y50%'nin üzerine§! çıkarın."
 AST_alp_election_campaign_tt:0 "§YA.L.P Seçim Kampanyası§!\n§LIşçi sınıfını, sendika üyelerini ve yerli odaklı reformcuları bir araya getirin; Avustralya İşçi Partisi siyasi bir kampanya başlatacak.§!\n\n§YEtki:§!\nGünlük Siyasi Güç Maliyeti: §R1.00§!\nGünlük §YA.L.P§! Oyları artışı: §G+0.05%§!"
 AST_alp_election_win:0 "§YA.L.P§! §Y1§! Seçim Zaferi Kazanır.\n\n[GET_AST_ALP_CLUSTER_UNLOCK][GET_AST_15_NATUNITY]"
 AST_alp_increase_votes_daily_impact:0 "\n §YA.L.P§! değişikliklerinden dolayı: §R[?AST_alp_votes_daily_impact_var|2R]%§!"
 AST_alp_less_than_3_wins_tt:0 "§YA.L.P§! §Y3§! Seçim Zaferinden azına sahip."
 AST_alp_popularity_decrease_10:0 "§Y$AST_ruling_party$§! (§Y$AST_alp$§!) Oyları: §R-10.00%§!"
 AST_alp_popularity_decrease_5:0 "§Y$AST_ruling_party$§! (§Y$AST_alp$§!) Oyları: §R-5.00%§!\n\n"
 AST_alp_popularity_increase_10:0 "§Y$AST_ruling_party$§! (§Y$AST_alp$§!) Oyları: §G+10.00%§!"
 AST_alp_popularity_increase_5:0 "§Y$AST_ruling_party$§! (§Y$AST_alp$§!) Oyları: §G+5.00%§!\n\n"
 AST_alp_votes_count:0 "§YA.L.P§! Demokratik Oyların [?AST_alp_votes_var|2Y]§Y%§!'sine sahip.\n\nGünlük Değişim: [?AST_alp_votes_change_var|2Y]§Y%§![GET_AST_ALP_PARTY_CAMPAIGN][GET_LABOR_CAMPAIGN_TOUR][GET_AST_COUNTRY_PARTY_SUPPORT_ALP][GET_AST_JAMES_SCULLIN_VOTES][GET_AST_BEN_CHIFLEY_VOTES][GET_AST_MAURICE_BLACKBURN_ALP_VOTES][GET_UAP_VOTES_DAILY_IMPACT][GET_AST_ALP_DISCOUNT]"
 AST_alp_win_count:0 "§YA.L.P§! [?AST_alp_election_win_count|0Y] Seçim Zaferine sahip."
 AST_alp_win_count_trigger_tt:0 "§YA.L.P§! en az $COUNT|Y$ Seçim Zaferine sahip."
 AST_alp_won_election_tt:0 "§YA.L.P§! Seçimi kazandı"
 AST_an_equal_union:0 "Eşit Bir Birlik"
 AST_an_equal_union_desc:0 "Devrimin sancağını taşısak da, bize katılan herkes eşit olarak durur. Bu birlikte, kaynaklar, emek ve fikirler özgürce paylaşılır; refahın kolektif olduğu ve hiçbir ulusun diğerinin üzerinde durmadığı bir gelecek inşa edilir."
 AST_an_uncle_for_father_figure:0 "Baba Figürü İçin Bir Amca"
 AST_an_uncle_for_father_figure_desc:0 "Modern silahlanmalardan yoksunuz ve bu nedenle [USA.GetName]'e başvurup tedarik etmelerini isteyeceğiz."
 AST_anti_malaria_campaign:0 "Sıtmayla Mücadele Kampanyası"
 AST_anti_malaria_campaign_desc:0 "Kuvvetlerimiz, düşman mermilerinden daha ölümcül bir tehdidin beklediği Pasifik ormanlarında savaşmaya çağrılabilir: sıtma. Askerlerimizi bu görünmez düşmandan korumak için kararlı adımlar atmalıyız."
 AST_anzac_spirit:0 "ANZAC Ruhu"
 AST_anzac_spirit_desc:0 "Avustralya ve Yeni Zelanda Kolordusu (ANZAC), İmparatorluk için zafer arayışında büyük çaba ve çok kan harcayarak Büyük Savaş sırasında müthiş bir itibar kazandı. Nitelikleri herkes için belirgindi: dayanıklılık, cesaret, yaratıcılık ve iyi mizah — tehlike ve zorluk karşısında rahat bir meydan okuma ile birleştiğinde."
 AST_army_inventions_directorate_taog:0 "Ordu Buluşları Müdürlüğü"
 AST_army_inventions_directorate_taog_desc:0 "Savaşın, eğer böyle adlandırılabilirse, nadir avantajlarından biri, zorunluluğun tetiklediği hızlı teknolojik inovasyon hızıdır. Bu atılımları geliştirmek, iyileştirmek ve değerlendirmek için merkezi bir organizasyon kurmalıyız."
 AST_arthur_fadden_votes:0 "\n $AST_arthur_fadden$: §G+0.01§!"
 AST_at_the_gates:0 "Kapıda"
 AST_at_the_gates_desc:0 "Dünya savaşa doğru ilerliyor ve Avustralya hazırlıksız yakalanmamalı. Ulusun fabrikaları ve tersaneleri daha yüksek bir vitese geçmelidir. Bu bir başkasının çatışması için hazırlık değil, kendi hayatta kalmamız için hazırlıktır."
 AST_at_the_gates_hidden:0 "$AST_at_the_gates$"
 AST_at_the_gates_hidden_desc:0 "$AST_at_the_gates_desc$"
 AST_australia_first:0 "Önce Avustralya"
 AST_australia_first_desc:0 "Merkez Parti'nin aşırı sağcı gücü kısa sürdü ve 1935'te feshedilmesiyle sona erdi. Ancak, iş adamı ve siyasi aktivist William John Miles'ın fikirlerinden kaynaklanan yeni bir şeyler kaynamaya başlıyor. Duyguları harekete geçirmek için hiçbir eylemde bulunulmazsa, ortaya çıktıkları kadar çabuk azalabilirler. Bu yüzden, eyleme geçilecek."
 AST_australia_first_party_focus:0 "Önce Avustralya Partisi"
 AST_australia_first_party_focus_desc:0 "Önce Avustralya üyeleri, hareketin ilerleyişinin artık durdurulamayacağı sayılara ulaştı. Avustralya halkının yeni, en sesli milliyetçi sesi ağırlamasının zamanı geldi: Önce Avustralya Partisi."
 AST_australia_first_party_req_tt:0 "§YÖnce Avustralya Partisi§! kuruldu."
 AST_australian_command:0 "Avustralya Komutası"
 AST_australian_command_desc:0 "Avustralya savunması ve güvenliğinin önemi [ENG.GetNameDef]'te bile anlaşıldığından, ortak kuvvetlerimizin yeniden düzenlenmesi gerekiyor. Avustralya komutası altına daha fazla Britanya kuvveti yerleştirilerek, daha verimli bir savaş çabası yürütülebilir."
 AST_australian_culture_investments:0 "Avustralya Kültür Yatırımları"
 AST_australian_culture_investments_desc:0 "Avustralya'da Kültürün Temelleri makalesiyle Stephensen, Jindyworobak şiir hareketinin oluşumunu etkiledi ve bir şeyi netleştirdi: Avustralya kültürü önceliklendirilmelidir. Hükümet sanatçıların ve yazarların değerini tamamen ihmal ediyor gibi görünüyor, ancak biz etmeyeceğiz. Jindyworobak ve Önce Avustralya'nın destekçilerini harekete geçirerek, kültürel gelişimi teşvik edeceğiz."
 AST_australian_culture_investments_tt:0 "\n§Y365§! gün sonra:"
 AST_australian_military_forces:0 "Avustralya Askeri Kuvvetleri"
 AST_australian_military_forces_desc:0 "Büyük Savaş'ta ateşle sınanan Avustralya ordusu, çatışmanın en acımasız harekatlarından bazılarında sağlam durarak uzak kıyılarda gücünü kanıtladı. O zamandan beri ordu küçültüldü ve esas olarak ana karayı korumakla görevli bir savunma gücü haline getirildi. Geçmişin bedeli ağır ödenmiş dersleri, bir kez daha çağrılmaya hazır şekilde devam ediyor."
 AST_australian_pivot_modifier:0 "Avustralya Dönüşü"
 AST_australian_regular_army:0 "Avustralya Düzenli Ordusu"
 AST_australian_regular_army_desc:0 "Gelibolu plajlarından Kuzey Afrika çöllerine, Yunanistan dağlarından Güneydoğu Asya ormanlarına kadar birçok ders öğrendik. Bu zor kazanılan deneyim, diğerlerinden daha esnek ve uyarlanabilir bir ordu oluşturdu."
 AST_australian_war_cabinet:0 "Avustralya Savaş Kabinesi"
 AST_australian_war_cabinet_desc:0 "Birleşik Krallık tarafından ısrar edildiği üzere, kendi Savaş Kabinemizi kuracağız. Bunu yaparak, etkili ve stratejik karar almayı sağlayabilir, organın sadece ulusal güvenliğe odaklanmasına izin verebiliriz."
 AST_autarky:0 "Otorite (Otarşi)"
 AST_autarky_desc:0 "Dış ticarete bağımlılık tehlikelidir, özellikle çatışma zamanlarında; Avustralya endüstrileri önceliklendirilmeli, ithalatla rekabet edilmemelidir. Sadece ticaret yasalarımızı kısıtlayarak yerli ekonomiyi koruyabilir ve Avustralya'nın kendine yetebilmesini sağlayabiliriz."
 AST_battle_of_the_ocean:0 "Okyanus Muharebesi"
 AST_battle_of_the_ocean_desc:0 "Okyanuslar uzun süredir küresel ticaretin arterleri olarak hizmet etti. Şimdi, savaşı Pasifik'e taşımanın ve sürdürdüğü sistemi kesmenin zamanı geldi. Sular, yozlaşmış kapitalistlerin ve devrim kahramanlarının kanıyla kızıl akacak."
 AST_ben_chifley_votes:0 "\n $AST_ben_chifley$: §G+0.01§!"
 AST_bg_empty_text_tt:0 "Demokratik partiler arasında oyları dengeleyin ve parti özelindeki Hedef kümelerinin kilidini açın.\n\n§Y$AST_war_is_coming$§! hedefini tamamlayarak kilidi açın."
 AST_big_business_pact:0 "Büyük İş Dünyası Paktı"
 AST_big_business_pact_desc:0 "Önce Avustralya Partisi yerli endüstrileri korumayı amaçladığından, üst düzey iş dünyası liderleri arasında birçok destekçi bulmuştur. Karlarını artıran politikalar izlememiz karşılığında, siyasi ve askeri hedeflerimizi destekleyecekler."
 AST_big_business_pact_tt:0 "\nEndüstri ve İnşaat hedeflerini etkilemek için §YBüyük İş Dünyası Paktı§! Kararlarının kilidini açar."
 AST_billy_hughes_votes:0 "\n $AST_billy_hughes$: §G+0.01§!"
 AST_borderless_solidarity:0 "Sınır Tanımayan Dayanışma"
 AST_borderless_solidarity_desc:0 "Dayanışma. Dünya işçilerini birleştiren kelime. Hiçbir sınır bizi bölemez, hiçbir ulus tek başına duramaz. Mücadele nerede yanarsa yansın, çağrıya cevap verecek ve küresel kurtuluş kavgasında yan yana duracağız."
 AST_bound_once_more:0 "Bir Kez Daha Bağlı"
 AST_bound_once_more_desc:0 "Yollarımız ayrıldı ama tekrar birleşecek. [ENG.GetNameDefCap] ve [AST.GetName] her ikisi de ulusal değişimden geçiyor, ancak bunun sonucunda aramızdaki mesafe sadece istenmeyen ve olumsuz bir etkiden ibaret. En azından bizim tarafımızda. Tekrar ittifak kuracağız ve değişen uluslarımızın engellerini birlikte aşacağız."
 AST_bring_home_the_farmers:0 "Çiftçileri Eve Getir"
 AST_bring_home_the_farmers_desc:0 "Büyük Buhran sırasında, işçiler tarımsal iş arayışıyla kırsala taşındıkça büyük şehirlerimizin nüfusu ciddi şekilde azaldı. Koşullar iyileşmeye başladığına göre, fabrikaları tekrar çevrimiçi hale getirebilmek ve üretimi sürdürebilmek için iş gücümüzün geri dönüşünü teşvik etmeliyiz."
 AST_bring_on_the_giant:0 "Devi Getirin"
 AST_bring_on_the_giant_desc:0 "Nihayet birleşik ve özerk bir ulus olarak, cesaretimiz yakında test edilecek. Pasifik'in diğer tarafı çıkarlarımızı paylaşıyor gibi görünüyor ve iyi gelişmiş askeri endüstrisiyle [USA.GetNameDef], bol miktardaki malzemelerinin bir kısmını askerlerimize kiralayarak hem kendine hem de Avustralya'ya büyük fayda sağlayabilir."
 AST_bring_on_the_giant_tt:0 " §Y[USA.GetNameDefCap]§! kabul ederse:\n §Y+50§! birim §YKonvoy§! ulusal stoklara eklenecek."
 AST_britain_supplying_ships:0 "Britanya Gemi Tedarik Ediyor"
 AST_britain_supplying_ships_desc:0 "Britanya müttefiklerinin kıyılarını koruma yükünü taşımaktan, [ROOT.GetName]'in filosunun genişletilmesi gerektiği açıkça görülmüştür. [ENG.GetNameDefCap]'in bize gemi tedarik etmesi sadece haktır."
 AST_british_pacific_fleet:0 "Britanya Pasifik Filosu"
 AST_british_pacific_fleet_desc:0 "Pasifik'teki Britanya varlığı, deniz üstünlüğünü güneye doğru genişleten düşman gemilerini caydırmak ve savunmak için hayati önem taşıyacaktır. [Root.GetFactionName]'in bir parçası olarak, kıyı sularımızı korumak için ortak bir komuta yapısı kurma yolunda harekete geçeceğiz."
 AST_british_pact:0 "Britanya Paktı"
 AST_british_pact_desc:0 "Britanya Milletler Topluluğu'ndan yeni ayrılışımıza rağmen, [AST.GetName]'in eski anavatanıyla işbirliği yapmaya devam etmesi çıkarınadır. [ENG.GetNameDef]'in dünya genelinde nasıl gerildiğini düşünürsek, askeri işbirliği teklif ederek yüklerini paylaşmaya olan istekliliğimiz takdir edilmelidir."
 AST_british_war_cabinet:0 "Britanya Savaş Kabinesi"
 AST_british_war_cabinet_desc:0 "Savaş patlak verdi ve Birleşik Krallık, Müttefik savaş çabasının verimli yürütülmesini sağlamak için bir Savaş Kabinesi kurdu. Bizi de bu konuda görüşlerimizi paylaşmaya çağırdılar, bu yüzden Başbakan Avustralya çıkarlarını temsil etmek için ayrılacak."
 AST_broken_hill_propietary_company:0 "Broken Hill Proprietary Company"
 AST_broken_hill_propietary_company_desc:0 "Broken Hill Proprietary Company, Avustralya'daki en önde gelen madencilik ve çelik üreticilerinden biridir. Yerliler tarafından 'Büyük Avustralyalı' olarak adlandırılan şirket, endüstriye hakimdir. Hammaddelere olan talebin dramatik artışıyla, daha da hızlı büyüme için iyi bir konumdadır."
 AST_call_for_a_referendum:0 "Referandum Çağrısı"
 AST_call_for_a_referendum_desc:0 "Federal hükümet kontrolünü artırmak istiyoruz; ancak önce seçmenlerin onayına ihtiyacımız var. Bir referandum çağrısı yaparak onların rızasını alabiliriz."
 AST_call_that_a_knife:0 "Sorun Yok!"
 AST_call_that_a_knife_desc:0 "'Buna bıçak mı diyorsun... İŞTE bıçak budur!' Biraz gösteriş ve mizah çok işe yarar. Askerlerimiz tehlikeyi güven, cesaret ve gösterişten yoksun olmayan bir şekilde karşılarlar."
 AST_campbells_men:0 "Campbell'ın Adamları"
 AST_campbells_men_desc:0 "Avustralya Birinci Hareketi, başarılı büyümesiyle, uzun süredir uykuda olan başka bir hareketi harekete geçirdi. Yeni Muhafızlar yeniden sokaklara çıktı ama çok şükür ki üyeleri bu kez hükümetin yanında. Onları partimize katacağız ve her zaman olduğu gibi Avustralya için savaşmalarına izin vereceğiz."
 AST_campbells_men_tt:0 "§Y[GET_AST_NG_MIL_UNITS] [AST.GetAdjective]§! milis birimlerini oluşturun"
 AST_cannot_campaign_for_two_parties_at_once:0 "Not: Başka bir parti için kampanya yapılıyor"
 AST_centralized_production:0 "Merkezi Üretim"
 AST_centralized_production_desc:0 "Piyasa güçleri kaotik ve eşitsizdir. Eğer gerçekten adil bir toplum inşa edeceksek, devlet ne üretileceğini, kimin tarafından ve nerede üretileceğini belirlemede merkezi bir rol almalıdır. Bürokrasimiz titiz kayıtlar tutar ve üretim kotalarını belirlemek için en iyi konumdadır."
 AST_change_democratic_flag_tt:0 "§Y[AST.GetAdjective]§! bayrağı değiştirilecek."
 AST_chinese_relations:0 "Çin İlişkileri"
 AST_chinese_relations_desc:0 "Çin'deki yoldaşlarımız hayatta kalmaları için mücadele ediyor. Onlara yardım edecek araçlara sahibiz ancak onlara karşı dizilmiş emperyalist güçler tarafından ezilmeden önce hızlı hareket etmeliyiz."
 AST_claim_french_indochina:0 "Fransız Çinhindi'nde Hak İddia Et"
 AST_claim_french_indochina_desc:0 "Fransa'nın kaderi belirlenmemişken, kolonilerinin kaderi de belirlenmiş değildir. Başka uluslar Fransız Çinhindi üzerinde açgözlü ellerini tutmaya çalışabilirler, ancak bizimkilerden kazanamayacaklar."
 AST_coast_watchers:0 "Kıyı Gözcüleri"
 AST_coast_watchers_desc:0 "Kuvvetlerimizin çoğu ana karaya odaklanmış olsa da, kuzey yaklaşımlarımız hayati bir erken uyarı ağı sunuyor. Bu dış adalara yerel istihbarat operatörleri konuşlandırarak, Avustralya kıyılarını tehdit etmeden çok önce düşman hava ve deniz hareketlerini tespit edebiliriz."
 AST_cockatoo_island_shipyards_taog:0 "Cockatoo Adası Tersaneleri"
 AST_cockatoo_island_shipyards_taog_desc:0 "Cockatoo Adası Tersaneleri, Kraliyet Donanması operasyonlarını yurt dışında destekleyen emperyal bir onarım ve bakım merkezi olarak uzun süre hizmet verdi. Kraliyet Avustralya Donanması'nın bir mihenk taşı olarak, filomuzun artan taleplerini karşılamak ve deniz gücümüzü sürdürmek için kapasitesini genişletmeliyiz."
 AST_comintern:0 "Komintern'e Katıl"
 AST_comintern_desc:0 "Gerçek Marksist ilkelerden zaman zaman sapsalar da, Sovyetler Birliği bir işçi enternasyonalinin sancaktarı olmaya devam ediyor. Komintern'e katılarak, sosyalizm meşalesini dünya çapında taşıma çabalarımızı birleştirebiliriz."
 AST_comintern_tt:0 "Eğer §Y[AST.GetName]§! bir ittifaka liderlik ediyorsa, bu ittifak Komintern ile birleşecek. Aksi takdirde, §Y[AST.GetName]§! Komintern'e tek başına katılacak."
 AST_cominwealth_tech_sharing_tt:0 "İttifakımızın tüm üyeleriyle bir §Yteknoloji paylaşım anlaşması§! yapacağız."
 AST_commonwealth_aircraft_corporation_taog:0 "Milletler Topluluğu Uçak Şirketi"
 AST_commonwealth_aircraft_corporation_taog_desc:0 "Gökyüzü savaşına olan ilginin artmasıyla, geride kalmadığımızdan emin olmalıyız. Sivil meraklılar ve yenilikçiler, havacılık endüstrisinin potansiyelini şimdiden görmeye başladılar; onlara başlangıç fonu sağlayarak, bu gelişen sektörü teşvik edebilir ve genişletebiliriz."
 AST_conscription_at_last:0 "Sonunda Askerlik"
 AST_conscription_at_last_desc:0 "Bağımsızlık tadı güzel, artık kendi savunmamıza öncelik verme gücüne sahip olduğumuzu fark ediyoruz — ancak bu güç sorumlulukları da beraberinde getiriyor. Zorunlu askerlik hafife alınmamalı, ancak savaş artık üzerimizdeyken bu bir gereklilik haline geldi."
 AST_conscription_law_so_far:0 "[CONSCRIPTION_LAW_SO_FAR]"
 AST_conscription_level_allowed_all_adults_serve_tt:0 "§YTüm Yetişkinler Hizmet Eder§! sağlayacak olan §YAskerlik Yasası§!'nın ek bir seviyesinin kilidini açar!"
 AST_conscription_level_allowed_extensive_conscription_tt:0 "§YKapsamlı Askerlik§! sağlayacak olan §YAskerlik Yasası§!'nın ek bir seviyesinin kilidini açar!"
 AST_conscription_level_allowed_limited_conscription_tt:0 "§YSınırlı Askerlik§! sağlayacak olan §YAskerlik Yasası§!'nın ek bir seviyesinin kilidini açar!"
 AST_conscription_level_allowed_scraping_the_barrel_tt:0 "§YVaril Dibi§! sağlayacak olan §YAskerlik Yasası§!'nın ek bir seviyesinin kilidini açar!"
 AST_conscription_level_allowed_service_by_requirement_tt:0 "§Yİhtiyaca Göre Hizmet§! sağlayacak olan §YAskerlik Yasası§!'nın ek bir seviyesinin kilidini açar!"
 AST_conscription_level_allowed_tt:0 "Daha fazla askerlik için siyasi irade (hedeflerdeki insan gücü simgesine bakın)"
 AST_council_for_scientific_and_industrial_research:0 "Bilimsel ve Endüstriyel Araştırma Konseyi"
 AST_council_for_scientific_and_industrial_research_desc:0 "Bilimsel ve Endüstriyel Araştırma Konseyi, çeşitli kolonilerin ve dominyonların ekonomik temelini genişletmeye yardımcı olmak için 1923 İmparatorluk Konferansı'nı takiben güçlendirildi. Katkıları önemli olsa da, vücuda yeni bir odak vermenin zamanı geldi: imalat ve ikincil endüstrilerin geliştirilmesi."
 AST_council_president_tbd_tt:0 "Henüz atanmadı"
 AST_council_president_tt:0 "Başkan: §Y[GET_AST_COUNCIL_PRESIDENT]§!"
 AST_country_party_support_alp:0 "\n $AST_country_party_influence_alp$: §G+0.02%§!"
 AST_country_party_support_uap:0 "\n $AST_country_party_influence_uap$: §G+0.02%§!"
 AST_cruising_for_a_bruising:0 "Dayak Yemek İçin Dolaşmak"
 AST_cruising_for_a_bruising_desc:0 "Donanmamız uzun süredir kruvazörlerden yetenekli bir şekilde yararlanıyor ve bu genişletilmeye değer bir gelenek. Hızlı, çok yönlü ve sert vuran bu gemiler yakında dünya çapında bir ün kazanacak - yollarına çıkan her düşman kendini çok ciddi bir dayak yemiş bulacak."
 AST_crush_the_gates:0 "Kapıları Ez"
 AST_crush_the_gates_desc:0 "Hazırlık tamamlandı. Avustralya endüstrisi artık tam bir savaş düzeninde çalışıyor, üretimi tamamen ulusal gücün savunmasına ve projeksiyonuna yönlendiriliyor. Gelecek fırtına ne olursa olsun, Avustralya onu seferber olmak için çabalayan gönülsüz bir dominyon olarak değil, karşılayacaktır."
 AST_death_from_down_under_taog:0 "Aşağıdan Gelen Ölüm"
 AST_death_from_down_under_taog_desc:0 "Güney Yarımküre'nin uzak noktalarından, eşi olmayan bir hava kuvveti oluşturduk. Uçaklarımız dünya çapında geziniyor, düşmanlarımız nereye saklanırsa saklansın hassasiyet ve yıkıcı güçle vuruyor, ölüm Aşağıdan Gelecek."
 AST_defence_citizen_military_forces_act:0 "Savunma Vatandaş Askeri Kuvvetleri Yasası"
 AST_defence_citizen_military_forces_act_desc:0 "Gönüllü profesyonel askerler yurt dışına gönderilebilir hale gelene kadar. Çatışma tırmanmaya devam ettikçe, gerekirse milis birliklerinin yurt dışında hizmet etmesine izin verecek yasal çerçeveyi oluşturmalıyız."
 AST_defying_american_interference:0 "Amerikan Müdahalesine Karşı Çık"
 AST_defying_american_interference_desc:0 "[USA.GetNameDefCap]'in gölgesi üzerimizde beliriyor ve eylemlerimiz onun çıkarlarıyla uyuşmadığında müdahale etme tehdidinde bulunuyor. Bu kadar büyük bir küresel gücün demir yumruğunu [PHI.GetNameDef] civarında tutmasıyla, Doğu Asya ülkeleri hiçbir zaman gerçekten Doğu Asya'ya ait olamayacak. [AST.GetName] yabancı davetsiz misafirlerin hiçbir otoritesine boyun eğmeyecektir - Filipinler bizim olacaktır."
 AST_demand_resources:0 "Kaynak Talep Et"
 AST_demand_resources_desc:0 "Yayılmacı saldırganlar Çinhindi'ne sadece bölge için değil, aynı zamanda sahip olduğu kaynaklar için de bakıyorlar. Zenginlikler düşman eline geçerse savaşı sadece uzatırlar, bizim elimizde olursa savaşı bitirmeye yardımcı olabilirler. Bu kaynaklar üzerinde kontrol talep edeceğiz; eğer sahipleri işbirliği yapmayı reddederse, düşmandan daha iyi değillerdir."
 AST_demand_resources_tt:0 "Güneydoğu Asya uluslarının kaynaklarından pay talep etmek için §Y$AST_resource_acquisition_cat$§! kararlarının kilidini açar."
 AST_department_of_aboriginal_affairs:0 "Aborjin İşleri Departmanı"
 AST_department_of_aboriginal_affairs_desc:0 "Aborjin hakları aktivist gruplarının önerisini uygulayacak ve yeni bir Aborjin İşleri Departmanı kuracağız. Departman, Aborjin mirasına sahip bir komite tarafından tavsiye edilecek ve amacı, Yerli nüfusun uygun gıda ve tıbbi yardıma erişimini sağlamak olacaktır."
 AST_department_of_aircraft_production:0 "Uçak Üretimi Departmanı"
 AST_department_of_aircraft_production_desc:0 "Kraliyet Avustralya Hava Kuvvetleri'nin hızlı genişlemesi, üretim kapasitemiz üzerinde önemli bir yük oluşturdu. Daha iddialı düşünmeli, endüstriyel tabanımızı talebi karşılamak için genişletmeli ve koordine etmeli ve gökyüzünü uçaklarımızla karartabildiğimizden emin olmalıyız."
 AST_department_of_munitions:0 "Mühimmat Departmanı"
 AST_department_of_munitions_desc:0 "Cephedeki adamlarımızı düzgün bir şekilde tedarik etmek için mühimmat üretimimizi hızlandırmalıyız. Bir Mühimmat Departmanı kurarak, savunma bileşenlerinin üretiminin gözetimini artırmayı sağlayabiliriz."
 AST_department_of_supply_and_development_taog:0 "Tedarik ve Kalkınma Departmanı"
 AST_department_of_supply_and_development_taog_desc:0 "Savaşın talepleri üretim ve lojistik sistemlerimizi sınırlarına kadar zorladığı için, çabalarımızı onları koordine etmekten ve sürdürmekten sorumlu özel bir organ altında merkezileştirmeliyiz."
 AST_devalued_currency:0 "Devalüe Edilmiş Para Birimi"
 AST_devalued_currency_desc:0 "İhracatı artırmanın en etkili yollarından biri daha zayıf bir para birimidir. Yabancı alıcılar paraları daha fazla değer tuttuğu için mallarımızdan daha fazlasını satın alabiliyorsa, uluslararası alanda daha rekabetçi hale geliriz. Ancak bu iki ucu keskin bir kılıçtır, çünkü diğer uluslardan yapılan ithalatlar da daha pahalı hale gelecektir."
 AST_diggers:0 "Kazıcılar (Digger'lar)"
 AST_diggers_desc:0 "“Kaz, kaz, kaz, güvende olana kadar” emri, Gelibolu'ya indikleri sırada ANZAC'lara verilen ve Avustralya'nın savaş yöntemleriyle eşanlamlı hale gelen emirlerdi. Yine de Digger'ın ruhu daha derinlere iner, Avustralyalı ve Yeni Zelandalı askerleri 'yoldaşlık' yoluyla birbirine bağlar: yan yana ve birbirleri için savaşmanın kalıcı bağı."
 AST_dingo_scout_car:0 "Dingo Keşif Aracı"
 AST_dingo_scout_car_desc:0 "Avustralya'nın güçlü bir zırhlı araç geliştirme geleneği yoktur, ancak silahlı kuvvetlerimiz bu alanda giderek daha fazla takviye talep etmektedir. Bu nedenle, Dingo Keşif Aracı gibi yerli tasarımları daha titizlikle benimsemeliyiz."
 AST_diverse_army:0 "Çeşitli Ordu"
 AST_diverse_army_desc:0 "Ülkesini savunma eylemi sadece bir ayrıcalık değil, bir haktır. Her istekli Avustralyalı askere alınabilecek ve her hırslı asker saflarda yükselebilecektir."
 AST_dividing_the_pacific:0 "Pasifik'i Bölüşmek"
 AST_dividing_the_pacific_ast_gain_tt:0 "[GET_AST_DIVIDING_THE_PACIFIC_AST_GAIN]"
 AST_dividing_the_pacific_desc:0 "Önce Avustralya, çoğu Avustralya vatandaşının aksine, ulusu yaklaşan bir tehdit yerine potansiyel bir Pasifik müttefiki olarak tanımlayarak [JAP.GetNameDef] ile barışı savunuyor. [AST.GetName]'in gücü arttıkça, [JAP.GetName]'in de kabul etmesi ve iki ulusumuz arasındaki olası çatışmaların ortaya çıkma şansı olmadan çözülmesi makuldür."
 AST_dividing_the_pacific_jap_gain_tt:0 "[GET_AST_DIVIDING_THE_PACIFIC_JAP_GAIN]"
 AST_dividing_the_pacific_tt1:0 "§GKazandıklarımız§!:"
 AST_dividing_the_pacific_tt2:0 "§RKazandıkları§!:"
 AST_dividing_the_pacific_tt3:0 "§Y[AST.GetName]§! kontrol edilen aşağıdaki bölgeleri transfer eder:"
 AST_domestic_industry:0 "Yerli Endüstri"
 AST_domestic_industry_desc:0 "Savaş çıkması durumunda bizi tedarik etmeleri için müttefik savunma sanayilerine güvenemeyiz. Gelecek ne olursa olsun hazırlıklı olabilmemiz için kendi endüstrilerimizi genişletmeliyiz."
 AST_done_meddling:0 "Meddahlıktan Vazgeç"
 AST_done_meddling_desc:0 "Eski ülkeye her zaman sadık olan [AST.GetName], İngiliz savaşlarını başı dik bir şekilde sürdürmeye devam ediyor. Avustralyalılar güvenilir bir türdür ancak bu hafife alınmaları gerektiği anlamına gelmez. [AST.GetName] [ENG.GetNameDef] için savaşırken, [ENG.GetNameDef] de [AST.GetName] için savaşacaktır."
 AST_eastern_focus:0 "Doğu Odaklılık"
 AST_eastern_focus_desc:0 "Eğer Britanya savaşları Avustralya savaşlarıysa, Avustralya savaşları da Britanya savaşlarıdır. Japon istilası uzun süredir inkar edilemez bir şekilde yaklaşıyor ve çatışmanın kucağımıza düşmesini bekleyen mevcut pasifliği artık kabul etmeyeceğiz. Japonya'ya Avustralya kararlılığının ne anlama geldiğini göstereceğiz, Britanya ise en cesur ilanda sadakatini kanıtlayacak: bir savaş ilanı."
 AST_eastern_focus_tt:0 "\nBu görev §Y[ENG.GetNameDef]§!'in derhal §Y[JAP.GetNameDef]§!'e savaş ilan etmesine izin verecek ve eğer 180 gün içinde etmemişlerse bunu yapmaya zorlayacak. §Y[ENG.GetNameDefCap]§!, görevin tamamlanma tarihini Avustralya savunma inşaatını finanse ederek geciktirebilir."
 AST_election_campaign_pp_cost_hidden_idea:0 "Seçim Kampanyası"
 AST_election_recently_concluded:0 "Hükümet Kurma Süreci"
 AST_empire_air_training_scheme_taog:0 "İmparatorluk Hava Eğitim Planı"
 AST_empire_air_training_scheme_taog_desc:0 "İngiliz Milletler Topluluğu Hava Eğitim Planı, çok sayıda pilot ve hava mürettebatı eğitmek için bir Milletler Topluluğu ulusuna önemli miktarda fon ve uzmanlık sunar. Ev sahipliği yapmak için rekabet şiddetlidir; Avustralya ve Kanada önde gelen adaylardır. İmparatorluk Hava Eğitim Planı kapsamında kendi teklifimizi sunduk."
 AST_end_the_kingdom:0 "Krallığı Bitir"
 AST_end_the_kingdom_desc:0 "Zaman geldi. Emperyalist kapitalizmin kökü, çürümüş kalbinden bıçaklanacak. Britanya İmparatorluğu'ndaki işçilerin kurtuluşu yakındır. Monarşiyi bitirin. Krallığı bitirin. Baskıyı bitirin. Milletler Topluluğu'nun işçileri, birleşin!"
 AST_end_the_kingdom_ireland_join_tt:0 "[IRE.GetName], Britanya Karşıtı paktı imzaladığı için, [ENG.GetNameDef]'e savaş ilan ettiğimizde bizim tarafımızdan savaşa katılacaklar."
 AST_ending_overseas_conscription:0 "Denizaşırı Askerliği Sona Erdirme"
 AST_ending_overseas_conscription_desc:0 "Askerlerimiz derhal yabancı kıyılardan ayrılmalı; burada onlara ihtiyaç var."
 AST_enemy_of_the_realm:0 "Diyarın Düşmanı"
 AST_enemy_of_the_realm_at_peace_tt:0 "\n§Y[JAP.GetName]§! ile savaşta değilse:"
 AST_enemy_of_the_realm_at_war_tt:0 "Zaten §Y[JAP.GetName]§! ile savaştaysanız:"
 AST_enemy_of_the_realm_desc:0 "Japon yayılmacılığı sınır tanımıyor; ulaştığı her yerde devletlerin egemenliğini ve toprak bütünlüğünü hiçe sayıyor. [AST.GetNameDefCap] buna seyirci kalmayacak. [JAP.GetNameDef], Avustralya'nın topraklarını tehdit ederse Avustralya da karşılık verecektir. Taç ve vatan uğruna [AST.GetNameDef] savaşa giriyor."
 AST_energy_independence:0 "Enerji Bağımsızlığı"
 AST_energy_independence_desc:0 "Özellikle çatışma zamanlarında dış ticarete güvenmek istikrarsızdır; Enerji bağımsızlığı, Avustralya'nın en zor zamanlarda bile çalışabilmesini sağlamak için hayati öneme sahiptir. Rafinerilere yatırım yaparak yerli enerji üretimini teşvik edebiliriz."
 AST_eng_as_faction_leader_tt:0 "\n([ENG.GetFlag]§Y[ENG.GetName]§!) $AST_faction_leader_tt$."
 AST_eng_to_ast_faction_tt:0 "§Y[ENG.GetName]§! ve tebaaları §Y[AST.GetFactionName]§!'e katılır."
 AST_equal_pay:0 "Eşit Ücret"
 AST_equal_pay_desc:0 "Üretim araçlarına sahip olanların, içinde çalışanlardan daha fazlasını hak ettiği kalıcı bir yanılgıdır. Sahipler ve yöneticiler daha fazla çalışmazlar veya doğuştan daha yetenekli değildirler. Ücretleri eşitleyerek, emeğin meyveleri toplum genelinde daha adil bir şekilde paylaşılabilir."
 AST_equal_training:0 "Eşit Eğitim"
 AST_equal_training_desc:0 "Müttefiklerle işbirliği sadece akılsızca çalışmak değil, bilenmelidir. Avustralya, [ROOT.GetFactionName] ulusları için ortak eğitim kampları düzenleme inisiyatifini alacak ve tüm askerlerin eşit derecede titiz eğitim almasını sağlayacaktır."
 AST_establish_training_camps:0 "Eğitim Kampları Kur"
 AST_establish_training_camps_desc:0 "Büyük Savaş'ta olduğu gibi, İkinci İmparatorluk Gücü dünyanın herhangi bir yerinde savaşmak için çağrılabilir. Bu nedenle, askerlerimizi Kuzey Afrika'nın çöllerinden Güney Pasifik'in ormanlarına kadar her ortama hazırlamak için kapsamlı eğitim programları geliştirmeliyiz."
 AST_eureka_stockade_monument_rally:0 "Eureka Stockade Anıtı Mitingi"
 AST_eureka_stockade_monument_rally_desc:0 "1854'te, Eureka Stockade Savaşı'nda, Avustralyalı altın madencileri, maden ruhsatlarının makul olmayan maliyeti ve altın madenlerinin vergilendirilmesi üzerine sömürgeci güçlere karşı şiddetle savaştılar. Britanya efendiliğinden duyulan memnuniyetsizlik o zaman da belirgindi, şimdi de öyle. Savaşın anıtında toplanacağız ve Britanya'dan ayrılmak için miting yapacağız."
 AST_expand_the_fort:0 "Tahkimatı Genişlet"
 AST_expand_the_fort_desc:0 "Batı Pasifik, [USA.GetNameDef]'in komuta etmesi için değildir. Amerika'nın hak iddia ettiği adalar Doğu Asya uluslarına aittir ve Avustralya nüfuzu arttıkça, onlara hak iddia eden biz olacağız."
 AST_expanding_influence:0 "Nüfuzu Genişlet"
 AST_expanding_influence_desc:0 "Tarihin doğru tarafında durarak, fikirlerimiz kendi adlarına konuşuyor. Bir işçi cenneti vaadi bir hayal değil, yapım aşamasında olan bir gerçektir. Bu vizyonu dışarıya doğru genişletebilir, başkalarını da ortak bir gelecek inşa etmeye katılmaya davet edebiliriz."
 AST_expanding_into_new_markets:0 "Yeni Pazarlara Açılmak"
 AST_expanding_into_new_markets_desc:0 "Yerli pazar yerine dış pazarlara güvenmenin avantajı basittir. Küresel pazar geniştir. Her zaman yararlanılacak yeni pazarlar olacaktır; sadece üstünlüğümüzü bulmamız ve Avustralya mallarının ve iş uygulamalarının üstünlüğünü kanıtlamamız gerekiyor."
 AST_expected_election_winner_text:0 "§YBeklenen Kazanan§!"
 AST_expected_election_winner_tt:0 "§YBeklenen Kazanan\n[GET_AST_EXPECTED_WINNER]§! şu anda Demokratik Oyların çoğunluğuna sahip.\n\nHedefler, Siyasi Danışmanlar veya Siyasi Kampanya başlatarak Oyları etkileyin."
 AST_expeditionary_leader:0 "§YGeneral§!, yurt dışındaki yeteneklerini geliştiren ancak komuta edebilecekleri tümen sayısını sınırlayan §YSeferi Lider§! özelliğine sahip olacak."
 AST_expeditionary_leader_plural:0 "Her iki §YGeneral§! de, yurt dışındaki yeteneklerini geliştiren ancak komuta edebilecekleri tümen sayısını sınırlayan §YSeferi Lider§! özelliğine sahip olacak."
 AST_exports_for_economic_recovery:0 "Ekonomik İyileşme İçin İhracat"
 AST_exports_for_economic_recovery_desc:0 "Lang'in fikirlerine karşı çıkanlar, dış yatırımı ve satışı teşvik etmek için dış pazarlardan ve borçlardan yararlanmayı, yerli üretimi, istihdamı ve nihayetinde tüketici harcamalarını artırmak için ihracata dayalı bir ekonomiye geçmeyi öneriyorlar."
 AST_faction_leader_tt:0 "§Y[AST.GetFactionName]§! İttifakının lideri olarak ayarlandı"
 AST_for_crown_and_empire:0 "Kraliyet ve İmparatorluk için"
 AST_for_crown_and_empire_desc:0 "Eski bir İngiliz Milletler Topluluğu kolonisi olan [ENG.GetNameDef]'nin gelenekleri bizimdir. Bu, pek çok İngiliz kurumunun [AST.GetAdjective] muadili kazandığı anlamına gelse de, hepsi için durum böyle değil. İngiliz hükümdarının temsilcileri olarak [AST.GetName]'nin Genel Valileri İngiliz birliğini kendi kıtamıza getirdiler, ancak [AST.GetName]'nin kendine ait bir vatanseverlik sembolüne ihtiyacı var."
 AST_for_crown_and_empire_trigger_tt:0 "§Y25.000§!'den fazla Yeni Muhafız üyesi"
 AST_for_greater_good:0 "Daha Yüksek Bir Yarar İçin"
 AST_for_greater_good_desc:0 "Dünya devrimi vizyonumuz kan ve fedakarlık gerektirir. Çok fazla yerde sosyalizm meşalesi titriyor; çağrıya cevap vermeli ve sönmemesini sağlamak için desteğimizi göndermeliyiz. Ne de olsa, bu daha yüksek bir yarar içindir."
 AST_for_the_southern_cross:0 "Güney Haçı İçin"
 AST_for_the_southern_cross_desc:0 "Güney Haçı Britanya üzerinde dalgalanmıyor. Bizim üzerimizde dalgalanıyor. Avustralya kimliği gerçek bir şeydir, kazanılmış bir şeydir, savunulmaya değer bir şeydir. Yeni bir ulusal gurur dövülüyor, Londra'dan ödünç alınmamış veya uzak kurumlar tarafından tanımlanmamış, burada, bu topraklarda, bu yıldızların altında büyümüş."
 AST_foreign_competition:0 "Yabancı Rekabet"
 AST_foreign_competition_desc:0 "Rekabet iş için iyidir; ataleti ortadan kaldırırken yeniliği ve verimliliği teşvik eder. Dışarıda köpek köpeği yer bir dünya var ve köpeğimizin en büyüğü olduğundan ve rekabet etmekte tamamen özgür olması için tasmasını çıkardığımızdan emin olmalıyız."
 AST_form_unity_government_text:0 "Ulusal Birlik Hükümeti"
 AST_free_healthcare_policy:0 "Ücretsiz Sağlık Politikası"
 AST_free_healthcare_policy_desc:0 "İnsanlarımız hastalık ve yaralanmalardan uzak olmayı hak ediyor ve en kötüsü olursa, başka toplumlarda olduğu gibi talihsizlik yüzünden dilenci olmamalılar. Sağlık hizmetlerine, hastanelere ve doktorlara evrensel erişim sağlayacağız - çünkü sağlıklı bir halk, üretken bir halktır."
 AST_free_school_policy:0 "Ücretsiz Okul Politikası"
 AST_free_school_policy_desc:0 "Model vatandaşı şekillendirmek için fikirlerini şekillendirmeliyiz. Beşikten üniversiteye kadar, devlet çocuklarımıza ne öğretileceğine rehberlik edecektir. Bu şekilde, gelecek nesillerin sosyalist idealin önemini ve serbest piyasanın... ve serbest düşüncenin tehlikelerini anlamalarını sağlayabiliriz."
 AST_free_the_colonies:0 "Kolonileri Özgürleştir"
 AST_free_the_colonies_desc:0 "Devrim ateşi yıkılan Britanya İmparatorluğu'nu yakıp geçiyor. Koloniler artık koloni değil, özgür uluslar olacak. Ayağa kalkın yoldaşlar! Zincirlerinizi kırın ve devrime katılın!"
 AST_free_the_colonies_tt:0 "§Y[AST.GetName]§!, kontrolü altındaki tüm eski İngiliz sömürgelerini entegre kukla seviyesine indirir."
 AST_from_picket_line_to_front_line:0 "Grev Hattından Cephe Hattına"
 AST_from_picket_line_to_front_line_desc:0 "İşçi sınıfının kurtuluşuna karşı çıkanların gözdağı taktikleri daha saldırgan hale geldikçe, kendi savunmalarımız da buna yanıt olarak gelişmelidir. Her olayla işçiler daha kararlı hale geliyor ve giderek artan sayılarla Savunma Birliklerine katılmak için öne çıkıyorlar."
 AST_gain_claims_on_japan_tt:0 "§YJapon Ana Adaları§! üzerinde hak iddiaları kazanacağız!"
 AST_glory_of_the_fleet:0 "Filonun Zaferi"
 AST_glory_of_the_fleet_capital_trigger:0 "En azından §Y4§! Sermaye Gemileri veya Taşıyıcıları"
 AST_glory_of_the_fleet_desc:0 "Boyun eğmez bağlılık sayesinde [AST.GetName]'nin filosu, Washington Denizcilik Anlaşması ve I. Dünya Savaşı'nın ardından savaş gemilerinin sökülmesi öncesinde olduğundan daha da büyüdü. Bir kez daha denizde savaşmaya ve kazanmaya hazırız ve daha fazla yatırımla nihayet okyanusların bizim olduğunu iddia edeceğiz."
 AST_glory_of_the_fleet_screen_trigger:0 "En az §Y20§! Ekranlar"
 AST_goods_standard:0 "Mal Standardı"
 AST_goods_standard_desc:0 "Jack Lang'in ekonomik teorisinin temel bir ilkesi, Avustralya'daki Altın Standardının kaldırılması ve para arzını üretilen fiili mal miktarına bağlayan bir Mal Standardı ile değiştirilmesidir. Bu, sermaye akışının dış faktörlerden ziyade doğrudan yerel üretkenliğe bağlı olmasını sağlar."
 AST_government_aircraft_factories:0 "Hükümet Uçak Fabrikaları"
 AST_government_aircraft_factories_desc:0 "Avrupa'dan uzaklığımız göz önüne alındığında, savaş zamanında geleneksel uçak tedarik kaynaklarına güvenemeyiz. Bu nedenle, kendi uçak gövdelerimizi ve motorlarımızı kendi spesifikasyonlarımıza göre üretmemize izin verecek yerli üretim yeteneklerimizi geliştirmemiz şarttır."
 AST_government_formation_period_timer:0 "§Y[?AST_election_recently_concluded:days_left]§! §Wgün§!"
 AST_government_formation_period_title:0 "§WHükümet Kurma Süreci:§!"
 AST_graziers_to_industry:0 "Çiftçilerden Endüstriye"
 AST_graziers_to_industry_desc:0 "Büyük Buhran sırasında, işçiler kırsal kesimde istikrar ararken şehirlerimiz boşaldı. Şimdi, üretim araçlarının kontrolüyle, onları tekrar endüstriye çekebiliriz. Ulusun ihtiyacını onlara aşılamalıyız: endüstri fırınları insanın teriyle beslenmelidir."
 AST_guaranteed_employment:0 "Garantili İstihdam"
 AST_guaranteed_employment_desc:0 "Sosyalizm, ihtiyaç sahiplerine yöneltilen tembellik veya bağımlılık suçlamalarıyla çok sık reddediliyor. Bu sona ermelidir. Tek aradığımız iş için adil bir şans ve ailemizi destekleyebileceğimiz adil bir ücret."
 AST_hand_in_glove:0 "Eldivenle El Gibi"
 AST_hand_in_glove_desc:0 "Kuzeye doğru genişleyerek, Avustralya'nın Güneydoğu Asya diplomasisi ve çatışmaları üzerindeki nüfuzunu artırabiliriz. Britanya çıkarlarını kendi çıkarlarımızla birlikte koruma yeteneğimizi zaten kanıtladık, bu nedenle [ENG.GetNameDef], uzak bölgelerinin neden bizim ellerimizde daha iyi olacağını anlamalıdır."
 AST_has_natunity_flag:0 "§YUlusal Birlik Hükümeti§! kapsamında faaliyet göstermektedir."
 AST_hear_the_thunder:0 "Gök Gürültüsünü Duy"
 AST_hear_the_thunder_desc:0 "Duyabiliyor musun, gök gürültüsünü duyabiliyor musun? Aşağıdaki diyardan, stratejik bombardıman uçaklarımız Avustralya'nın gücünü dünya çapında taşıyor. Gökyüzü kükrediğinde ve yer titrediğinde, düşmanlarımız bilecek: fırtına geldi ve beraberinde yıkımı getiriyor."
 AST_heavy_is_the_head:0 "Baş ağırdır"
 AST_heavy_is_the_head_desc:0 "Güç sorumlulukla birlikte gelir ve [AST.GetNameDef]'nin artan askeri gücü göz önüne alındığında, çevredeki bölgelerin bunu yapma kapasitesine açıkça sahip olmayan ülkeler tarafından korunması artık mantıklı görünmüyor. Müttefiklerimize Güneydoğu Asya topraklarını gerçekten koruyup koruyamayacaklarını veya bu topraklara Avustralya topraklarında daha iyi bakılıp bakılamayacağını soracağız."
 AST_hmas_sydney:0 "HMAS Sydney"
 AST_hmas_sydney_desc:0 "Zırhlı gemi çağı sona erdi. Deniz gücünün geleceği filonun üzerindeki göklerdedir ve Avustralya geride kalmayacaktır. Donanmamızı yeniden inşa edip modernize ettikten sonra, o son adımı atmaya hazırız; Avustralya deniz gücünü bir nesil boyunca tanımlayacak bir uçak gemisi."
 AST_holding_the_battlefield:0 "Savaş Alanını Tutmak"
 AST_holding_the_battlefield_desc:0 "Birçok Avustralyalı asker yurt dışında düştü, ancak çabaları İngiliz çabası olarak sayıldı. Avustralya, barış konferanslarında [ENG.GetNameDef] ile yan yana masada daha fazla nüfuz talep ediyor; aksi takdirde katkılarımız sona erebilir."
 AST_holding_the_battlefield_tt:0 "§Y[ENG.GetNameDef]§! ile yapılan Barış Konferanslarında §Ykukla§! ve §YDevlet Al§! eylemleri için §Yİndirimli maliyet§!."
 AST_immediate_rights:0 "Acil Haklar"
 AST_immediate_rights_desc:0 "[AST.GetName] içindeki hiçbir nüfus grubu federasyon tarafından düzenlenmeyecek ve hiçbir miras vatandaşlık hakkını kısıtlamayacaktır. Kendi vatandaşlık yasamızı oluşturarak ve nüfusumuzun sadece İngiliz tebaasından oluştuğu fikrinden uzaklaşarak, Avustralya hakları artık şartlı olmayacaktır."
 AST_improved_ground_crews:0 "Geliştirilmiş Yer Ekipleri"
 AST_improved_ground_crews_desc:0 "Her pilot için, uygun uçak bakımını, uçuş koordinasyonunu ve üs operasyonlarını sağlamak üzere tüm bir yer ekibine ihtiyaç vardır. Onlara havada eşlik eden seyrüsefercilerden, nişancılardan ve bombacılardan bahsetmiyoruz bile. Hava kuvvetlerimizin maksimum verimlilikle çalışmasını sağlamak için uygun eğitim tesisleri kurmalıyız."
 AST_in_from_the_cold:0 "Soğuktan İçeri"
 AST_in_from_the_cold_desc:0 "Önce Avustralya ve destekçilerinin artık saklanmasına gerek yok. Ulusumuzun uzun bir eski hükümetler dizisi altında maruz kaldığı kötü muamele nihayet gün ışığına çıkıyor ve artık yeni seslerin duyulma zamanı."
 AST_income_tax_assessment_act:0 "Gelir Vergisi Değerlendirme Yasası"
 AST_income_tax_assessment_act_desc:0 "Vergilendirme sistemimiz kötü durumda ve insanların yön bulması zor, karşılayamayacağımız kadar ağır bir hükümet gözetimi gerektiriyor. İlgili hükümleri elden geçirerek ve düzene sokarak, vergi tahsilatını önemli ölçüde daha verimli hale getirebiliriz."
 AST_increased_focuses_become_available:0 "Listelenen hedefler §Gkullanılabilir§! hale gelir."
 AST_industrial_expansion:0 "Endüstriyel Genişleme"
 AST_industrial_expansion_desc:0 "Büyük Buhran, ulusumuzun ekonomik çıktısını geçtiğimiz on yılın büyük bölümünde sakat bıraktı. Artık daha doğrudan eylem için siyasi iradeye sahip olduğumuza göre, bunu endüstriyel tabanımızın cesur bir genişlemesine kanalize etmeli, iş yaratmalı, kaynak talebini artırmalı ve pazar için daha fazla mal üretmeliyiz."
 AST_inevitably_independent:0 "Kaçınılmaz Olarak Bağımsız"
 AST_inevitably_independent_desc:0 "Birleşik Avustralya Partisi her zaman İngiliz vatandaşlığına değer vermiş olsa da, [ENG.GetNameDef]'in Avustralya çıkarlarına karşı kayıtsızlığı, bağımsızlığımızı ilan etmeye ve kendi savunmamıza öncelik vermeye zorladı. Artık Britanya savaşlarında denizaşırı hizmet doğal olarak bir sorun olmaktan çıktığına göre, sadakat karşıtları bile hizaya girmeye daha meyilli; daha kapsamlı askerlik bu nedenle daha az direnişle karşılaşacak."
 AST_integrate_the_fort:0 "Tahkimatı Entegre Et"
 AST_integrate_the_fort_desc:0 "1920'den beri Yeni Gine'yi Milletler Cemiyeti mandası altında yönettiğimiz ve Papua, Federasyon'dan beri [AST.GetName]'in bir dış bölgesi olduğu için, Papua Yeni Gine'nin doğu kısmı [AST.GetName]'in çekirdek topraklarına doğal bir katkı olacaktır. Avustralya kültürünü birleştirme çabalarımızın bir parçası olarak, bu bir sonraki adım olacaktır."
 AST_invasion_preparation_tt:0 "İstilaya Hazırlık Süresi: §G-20.0%§!"
 AST_invoke_the_1903_defence_act:0 "1903 Savunma Yasası'nı Uygula"
 AST_invoke_the_1903_defence_act_desc:0 "Avustralya, ulusal savunma için geleneksel olarak milislerine güvendi. Ancak, önemli bir tehdit zamanında, 1903 Savunma Yasası'nı uygulamaya koyabiliriz. Bu, savunma amaçlı ek insan gücü çağırmamıza olanak tanır."
 AST_ireland_anti_british_pact_offer_accept_tt:0 "Kabul ederlerse:"
 AST_its_fight_work_or_perish:0 "Ya Savaş, Ya Çalış, Ya da Yok Ol"
 AST_its_fight_work_or_perish_desc:0 "Savaş başladı ve geriye tek bir şey kaldı: buna hazır olduğumuzu kanıtlamak."
 AST_james_scullin_votes:0 "\n $AST_james_scullin$: §G+0.01§!"
 AST_jungle_tanks_if_sentinel_tank_development:0 "'Sentinel Tankı Geliştirme'yi tamamladıysak:"
 AST_kangaroo_point_dry_dock_taog:0 "Kangaroo Point Kuru Havuzu"
 AST_kangaroo_point_dry_dock_taog_desc:0 "Evans Deakin and Company, öncelikli olarak bir mühendislik firması olsa da, küresel gerilimler artarken genişletilmiş gemi inşa kapasitesine duyulan ihtiyacı haklı olarak tespit ettiler ve gözlerini Kangaroo Point'e diktiler. Filomuzun sürekli büyümesini desteklemek için bu araziyi devralmalarını kolaylaştırmalıyız."
 AST_labor_campaign_tour_votes:0 "\n $AST_labor_campaign_tour_mission$: §G+0.05%§!"
 AST_lang_is_right:0 "Lang Haklı"
 AST_lang_is_right_desc:0 "Görünüşe göre Lang haklıymış! Dış alacaklılara öncelik vermeyi reddederek ve bunun yerine bankacılık sistemimizden daha agresif bir şekilde yararlanarak, önemli fonları serbest bırakabiliriz. Bunlar daha sonra yerel ekonomiye yönlendirilebilir, çok ihtiyaç duyulan yatırımı sağlayabilir ve büyümeyi teşvik edebilir."
 AST_lang_plan:0 "Lang Planı"
 AST_lang_plan_desc:0 "Jack Lang, dış borç yükümlülüklerini yerine getirmeyi reddederek ve bunun yerine bu fonları iç büyümeyi teşvik etmeyi amaçlayan kamu girişimlerine yönlendirerek ekonomi siyasetinin ön saflarına yükseldi. Ne de olsa, taştan kan alamazsınız."
 AST_larrikinism:0 "Serserilik (Larrikinism)"
 AST_larrikinism_desc:0 "'Kültürsüz, kaba ama iyi kalpli kişi' olarak tanımlanan serserilik, Avustralya kültürünü temsil eder; engebeli dayanıklılık, otoriteye karşı saygısızlık ve tehlike karşısında iyi huylu bir meydan okuma. Avustralyalı askerler Büyük Savaş'ta zorluklarla dirençle yüzleşerek ve her şeyi akışına bırakarak itibar kazandılar."
 AST_leave_eng_faction_tt:0 "§YFree§!'ye §Y[ENG.GetNameDef]§! konusu olarak özerklik düzeyi artırıldığında, [AST.GetName], §Y[ENG.GetFactionName]§!'den ayrılacaktır."
 AST_lee_enfield_no1_mark3:0 "Lee-Enfield No.1 Mk III*"
 AST_lee_enfield_no1_mark3_desc:0 "O küçük yıldız önemlidir — Lee-Enfield No. 1 Mk III*, savaş zamanı daha hızlı, daha ucuz üretim değişikliklerini belirtir. Talep bu kazanımları bile geride bıraktığı için, daha küçük firmalar tarafından üretilen ve üretimi artırmak için Lithgow'da monte edilen bir 'pedallı sisteme' geçmeliyiz."
 AST_liberty_loans:0 "Özgürlük Kredileri"
 AST_liberty_loans_desc:0 "Hazine Bakanı olarak deneyiminden — bazıları bunun ulusun en iyisi olduğunu iddia eder — Ben Chifley, savaş ekonomisini yönetme kapasitesini kanıtladı. Onun tavsiyesi üzerine, vatandaşlarımızı fazla kişisel gelirlerini tasarrufa aktarmaya ve savaş kredilerine yatırım yapmaya teşvik edeceğiz."
 AST_lithgow_small_arms_factory:0 "Lithgow Hafif Silah Fabrikası"
 AST_lithgow_small_arms_factory_desc:0 "1912'de kurulan Lithgow Hafif Silah Fabrikası, savaş zamanında Britanya yapımı silah ve ekipmana olan bağımlılığı azaltmak için yaratıldı. Küresel gerilimlerin tekrar artmasıyla, silahlı kuvvetlerimizin artan ihtiyaçlarını karşılamak için üretimi genişletmeliyiz."
 AST_make_common_cause:0 "Ortak Bir Amaç Belirle"
 AST_make_common_cause_desc:0 "Bizim liderliğimiz altında, Milletler Topluluğu, kapitalist baskının karanlığından sosyalizmin ışığıyla rehberlik ederek gelişmeye başladı. Bu kritik anda, irademizin kırılmadığından ve daha iyi bir yarına doğru birlikte yürüdüğümüzden emin olmalıyız."
 AST_marines:0 "Deniz Piyadeleri"
 AST_marines_desc:0 "Adalar okyanusundaki en büyük ada olarak, gücümüzü kıyılarımızın ötesine yansıtacak amfibi yeteneklere sahip olduğumuzdan emin olmalıyız. Savunmadan saldırıya geçmemiz gerekirse, bu kuvvetler etkili ada atlama operasyonlarını mümkün kılacaktır."
 AST_maritime_commission:0 "$USA_maritime_commission$"
 AST_maritime_commission_desc:0 "$USA_maritime_commission_desc$"
 AST_maurice_blackburn_votes:0 "\n $AST_maurice_blackburn$: §R-0.01§!"
 AST_modify_offshore_advancements_spirit_tt:0 "§Y$AST_offshore_advancements_spirit$§!'i şununla değiştirir:"
 AST_national_defense:0 "Milli Savunma"
 AST_national_defense_desc:0 "Bilinçli yatırım ve ulusal yönlendirme yoluyla Avustralya, kendi savunmasını sürdürebilecek endüstriyel bir temel inşa etti. Fabrikalar ve tersaneler devletin gözetimi altında çalışıyor, çıktıları kârla değil, ulusun ihtiyaçlarıyla ölçülüyor."
 AST_natunity_becomes_ruling_party:0 "\n[GET_AST_RULING_PARTY], [GET_AST_NON_RULING_PARTY]'yi bir Ulusal Birlik Hükümetine katılmaya davet edecek.\n\n[GET_AST_NON_RULING_PARTY] §Y1§! Seçim Zaferi kazanır.\n\n"
 AST_natunity_desc:0 "§YUlusal Birlik Hükümeti§!\n§LKriz anlarında, küçük mücadeleler yerini daha büyük olanlara bırakır. Çevremizdeki uluslar çatışmalarla karşı karşıya ve yerel sorunlar kendi aciliyetlerini taşısa da, kan dökülme tehdidi büyüdükçe bu aciliyet azalır. [AST.GetName]'in demokratik partileri anlaşmazlıklarını bir kenara bırakmalı ve dünyaya birlik içinde yüzleşmelidir.§!"
 AST_natunity_effect_update_tt:0 "Hedef listesi, mevcut §Yİktidarda Olmayan Parti§! ve halihazırda kilidi açılmış hedef kümelerine göre güncellenir."
 AST_nauru_pact:0 "Nauru Paktı"
 AST_nauru_pact_desc:0 "İktidarı ele geçirmenin önündeki ilk engel hâlâ önümüzdeyken, bağımsızlık meselesi çok uzakta görünüyor; ancak Avustralya'nın özerkliği yalnızca bizim ilgi alanımız değil. Britanya'nın Avustralya'ya karşı direnişi veya sonunda İngiliz Milletler Topluluğu'ndan ayrılması durumunda [GER.GetNameDef]'nin egemenliğimizi garanti etmesi karşılığında, iktidara geldiğimizde onların kayıp Pasifik adalarından biri olan Nauru'yu geri vereceğiz."
 AST_naurus_return_to_german_hands:0 "Nauru'nun Alman Ellerine İadesi"
 AST_naurus_return_to_german_hands_desc:0 "Önce Avustralya artık tamamen ulusun dizginlerinde olduğuna göre, Nauru vaadinin yerine getirilmesinin ve Alman müttefiklerimizin anlaşmanın kendi tarafını teslim etmelerinin zamanı geldi. [AST.GetName] nihayet Milletler Topluluğu'nun zincirlerinden kurtulacak ve Britanya'ya bu konuda hiçbir söz hakkı bırakmayacak."
 AST_naurus_return_to_german_hands_tt:0 "'§YNauru Paktı§!' aktif hale gelir."
 AST_naurus_return_to_german_hands_tt_2:0 "'§YNauru Paktı§!' aktif."
 AST_naval_auxiliary_patrol_taog:0 "Deniz Yardımcı Devriyesi"
 AST_naval_auxiliary_patrol_taog_desc:0 "Profesyonel kuvvetlerimizin meşgul olduğu durumlarda, limanlarımızı ve kıyı tesislerimizi korumak için istekli yerel gönüllülere yönelebiliriz. Yerel su yollarına olan aşırı aşinalıkları onları paha biçilmez kılar ve kimse yerel bir balıkçının hizmetimizde olduğundan şüphelenmez."
 AST_naval_invasion_penalty_tt:0 "İstilaya Hazırlık Cezası: §G-20.0%§!"
 AST_new_deal:0 "Yeni Düzen"
 AST_new_deal_desc:0 "[AST.GetName]'in 150. yıl dönümünde gerçekleşen protesto, Yerli vatandaşlarla ilgili yasalarımızın yeniden düşünülmesi gerektiğini açıkça ortaya koydu. Aborjin hakları aktivist gruplarının talebi üzerine, Yerli halklar için tam vatandaşlığa giden bir yol belirlemek üzere onlarla bir araya geleceğiz."
 AST_new_south_wales_government_railways:0 "Yeni Güney Galler Hükümet Demiryolları"
 AST_new_south_wales_government_railways_desc:0 "Yeni Güney Galler Hükümet Demiryolları atölyeleri benzersiz bir yetenek sunuyor: tek parça halinde dökülmüş büyük çelik bileşenler. Tamamen dökme tank gövdeleri ve taretleri üretebilen az sayıdaki Milletler Topluluğu ulusundan biri olarak, bu kapasiteyi iyi kullanmalıyız."
 AST_next_election_countdown_text:0 "Sıradaki Seçime:\n [?days_until_next_election|0Y] gün"
 AST_ng_inf_units_tt:0 "Her §Y10.000§! Yeni Muhafız üyesi için §Y1§! piyade birimi kazanın"
 AST_ng_mil_units_tt:0 "Her §Y5.000§! Yeni Muhafız üyesi için §Y1§! milis birimi kazanın"
 AST_no1_flying_training_school:0 "1. Uçuş Eğitim Okulu"
 AST_no1_flying_training_school_desc:0 "Kraliyet Avustralya Hava Kuvvetleri'nin oluşumuyla 1921'de kurulan Uçuş Eğitim Okulu, hava personeli talebi dalgalandıkça açılıp kapandı. Küresel gerilimler artarken, yeni nesil pilotlar ve hava mürettebatı eğitmek için onu yeniden açmalıyız."
 AST_no_foreign_battlefields:0 "Yabancı Savaş Alanı Yok"
 AST_no_foreign_battlefields_desc:0 "Uzun zaman oldu ama nihayet hükümet, hiçbir vatandaşa yabancı savaş alanlarında hizmet etmesi için zorlama uygulanmayacağını ilan edecektir."
 AST_no_foreign_battlefields_modifier:0 "Yabancı Savaş Alanı Yok"
 AST_no_king_without_kingdom:0 "Krallık Olmadan Kral Olmaz"
 AST_no_king_without_kingdom_desc:0 "Eğer Avustralyalılar uluslarına karşı gerçekten vatansever olacaklarsa, o ulus egemenlik içinde birleşmelidir. Filo hızla genişledikçe ve yönetim kurumlarımız artık devlete gerektiği gibi hizmet ederken, yalnızlık ve bağımsızlık artık [AST.GetName]'yi korkutmuyor. Sonunda [AST.GetName] bir krallığa dönüşecek."
 AST_non_ruling_party:0 "§Yİktidarda Olmayan Parti§!"
 AST_non_ruling_party_alp:0 "$AST_non_ruling_party$ ($AST_alp$)"
 AST_non_ruling_party_uap:0 "$AST_non_ruling_party$ ($AST_uap$)"
 AST_northern_advancement:0 "Kuzey İlerlemesi"
 AST_northern_advancement_desc:0 "Avustralya kendi siyasi işleriyle ilgilenmeyi tercih etse de, kendimizi bir tehdit haline getirmediğimiz sürece yalnız bırakılmayı bekleyemeyiz. [INS.GetNameDefCap], bizim gibi bir ulustur, gitmeyen Avrupalı davetsiz misafirlerin kurbanıdır. Toprak üzerinde kendi iddiamızı ortaya koyarak, açık bir sinyal gönderiyoruz: Pasifik ulusları yalnız bırakılmalıdır."
 AST_northern_territory_reconnaissance_unit:0 "Kuzey Bölgesi Keşif Birliği"
 AST_northern_territory_reconnaissance_unit_desc:0 "Uçuş Teğmeni ve antropolog Donald Thomson, Aborjin nüfusunun [AST.GetName]'in silahlı kuvvetlerine dahil edilmesini savundu ve nihayet dinlenecek. Thomson'ı, en uzak ve yaşanmaz topraklarımızı bile gözetlemek için yerel bilgi ve çalı zanaatı becerilerine sahip adamlardan oluşan bir keşif birliği kurmakla şahsen görevlendireceğiz."
 AST_northern_territory_reconnaissance_unit_tt:0 "§YKuzey Bölgesi Keşif Birliği§! destek bölüğünün kilidini açar."
 AST_off_leash:0 "Tasmadan Kurtul"
 AST_off_leash_desc:0 "Rıhtım işçileri Avustralya'daki sendikal eylemin belkemiğidir. Kıta büyüklüğünde bir ada olarak, deniz iş gücünün ekonomimizde bu kadar hayati bir rol oynaması şaşırtıcı değildir. Yakaları çıkarma ve endüstrinin deniz köpeklerini serbest bırakma zamanı."
 AST_out_of_the_den:0 "İninden Çık"
 AST_out_of_the_den_desc:0 "İrlanda'daki pek çok kişi hala İngiliz yönetimine karşı derin bir kin besliyor. Gücümüzü göstermenin ve onları gölgelerden çıkarıp ortak bir düşmana karşı davamıza çekmenin zamanı geldi."
 AST_overseas_loyalties:0 "Denizaşırı Sadakatler"
 AST_overseas_loyalties_desc:0 "Yurt dışı savaşlarına katkılarımızı sürdüreceğiz, hiçbir bölgenin Avustralyalı askerler için yabancı olmadığını yeniden kanıtlayacağız. Savaşlar bize olmaz - biz onlara oluruz."
 AST_owen_gun:0 "Owen Makineli Tüfeği"
 AST_owen_gun_desc:0 "Yenilikçi, yerli Owen Makineli Tüfeği, tıpkı askerlerimiz gibi sağlam güvenilirlik konusunda bir itibar kazandı. Kuvvetlerimiz dünyanın her yerinde savaşırken, bu silahı sadece Avustralya yaratıcılığının ve tasarımının bir sembolü olarak değil, aynı zamanda savaş ruhumuzun bir sembolü olarak benimsemeliyiz."
 AST_pacific_initiatives_modifier:0 "Diplomatik Girişimler"
 AST_pankhurst_walsh:0 "Adela Pankhurst Walsh"
 AST_pankhurst_walsh_desc:0 "Önce Avustralya Hareketi'nin resmi kuruluşunda, başkan olarak Adela Pankhurst Walsh'u atayacağız. Avustralya İmparatorluk Kadınlar Loncası'nın kurucusu olarak Pankhurst Walsh, Londra merkezli Kadınlar Loncası ile yakın bağlarını korurken, İngiliz vatandaşlığının değerini uzun süredir savunmaktadır. Bu değer, hareketimizin temel ilkesini oluşturacaktır: Britanya ile devam eden bağlar."
 AST_part_with_colonizer:0 "Sömürgeciyle Yollarını Ayır"
 AST_part_with_colonizer_desc:0 "Mücadelelerimizin kökü Britanya İmparatorluğu'nda ve uzaktan dayattığı kapitalist sistemdedir. Artık yeter. Britanya eve daha yakın krizlerle meşgulken, kaderimizi ele almanın ve özgür ve bağımsız bir ulus olarak kendi yolumuzu çizmenin zamanı geldi."
 AST_party_campaign:0 "\n $AST_party_campaign_text$: §G+0.05%§!"
 AST_party_campaign_text:0 "Siyasi Kampanya"
 AST_permanant_military_forces:0 "Daimi Askeri Kuvvetler"
 AST_permanant_military_forces_desc:0 "Avustralya'nın birincil askeri gücü, ana karayı savunmakla görevli milis kuvvetidir. Ancak, küresel gerilimlerin arttığı bu dönemde, çoğu Büyük Savaş sırasında deneyim kazanan profesyonel subaylar ve askerlerden oluşan bir kadro kurmak ihtiyatlı olacaktır. Başlangıçta yedek kapasitede hizmet etseler bile, bu kuvvet kalıcılık ve standartlaştırılmış bir eğitim seviyesi sağlayacaktır."
 AST_pig_iron_protests:0 "Pik Demir Protestoları"
 AST_pig_iron_protests_desc:0 "Limancılarımız birçok durumda hükümetleriyle hemfikir değiller, özellikle de savaşan ülkelere pik demir satma konusunda. Avustralyalıların saldırganlığa katılmak veya masum sivillere karşı kullanılan ekipmanları taşımakla ilgisi yoktur ve bu yüzden [AST.GetName] de taşımayacaktır; grev çağrısı yapın."
 AST_planned_extraction:0 "Planlı Çıkarım"
 AST_planned_extraction_desc:0 "Kaynağı bu kadar zengin bir toprağa sahip olduğumuz için şanslıyız. Zenginliğinin sistematik olarak çıkarılmasını ve en çok ihtiyaç duyulan endüstrilere yönlendirilmesini sağlamalıyız."
 AST_platypus_modifier:0 "Hediye Edilen Platipus"
 AST_pleading_britain:0 "Britanya'ya Yalvarış"
 AST_pleading_britain_desc:0 "Savaşın geleceği kesin ve bu bizi dizlerimizin bağı çözülecek kadar sarsıyor. ANZAC ruhuna ve Digger'ların itibarına saygımız saklı kalmak kaydıyla, [ENG.GetName] yardımıza gelmezse Avustralya'nın savaş kapasiteleri hızla tükenir. Başbakan, ilk fırsatta [ENG.GetLeader]'a telgraf çekecektir."
 AST_populate_or_perish:0 "Nüfuslan Ya da Yok Ol"
 AST_populate_or_perish_desc:0 "Büyük Buhran vurduğunda, doğum oranları hızla düştü ve o zamandan beri toparlanmak için mücadele ediyor. Sürekli yerli kalkınma amacıyla, yeni bir göç programını yürütmek ve denetlemek için federal bir Göç Departmanı kuracağız."
 AST_president_hore_ruthven_effect_tt:0 "$AST_alexander_hore_ruthven$ Crown'un Konsey Başkanı ise:"
 AST_president_hughes_effect_tt:0 "$AST_billy_hughes$ Crown'un Konsey Başkanı ise:"
 AST_president_pankhurst_walsh_effect_tt:0 "$AST_adela_walsh$ Crown'un Konsey Başkanı ise:"
 AST_president_pankhurst_walsh_flag:0 "§Y$AST_adela_walsh$§!, Crown'un Konsey Başkanıdır"
 AST_public_institutions:0 "Kamu Kurumları"
 AST_public_institutions_desc:0 "Toplum, sağlık ve konuttan çocuk bakımına ve ulaşıma kadar işlemek için birçok temel hizmet gerektirir. Devlet bunları evrensel olarak sağlamalı, kısıtlama olmaksızın herkes için erişim sağlamalıdır. Özel kâr elde etme zorunluluğundan kurtulan bu sistemler, tüm nüfusun ihtiyaçlarını karşılamak için verimli bir şekilde çalışabilir."
 AST_public_meetings_tt:0 "Üyeleri seferber etmek ve Faşizm Desteğini artırmak için §YÖnce Avustralya Hareketi§! Kararlarının kilidini açar."
 AST_public_works:0 "Kamu Çalışmaları"
 AST_public_works_desc:0 "Büyük Buhran, Avustralya ekonomisini vahim bir duruma soktu. İnsanları işe döndürmek ve tüketici harcamalarını yeniden canlandırmak için bir dizi kamu çalışması programı başlatacağız."
 AST_radium_hill:0 "Radium Hill"
 AST_radium_hill_desc:0 "Güney Avustralya'da uranyum keşfedildi ve Radium Hill madeni genişleme için önemli bir potansiyele sahip. Bu yeni teknolojilerin tüm olanaklarını hala ortaya çıkarıyor olsak da, Atom Çağı'nın eşiğinde durduğumuz ve bunun ona girişimiz olabileceği açıktır."
 AST_ratify_westminster_adoption_act:0 "Westminster Kabul Yasasını Onayla"
 AST_ratify_westminster_adoption_act_desc:0 "Uzun süredir yerleşmiş politikaların değişmesinin yaratabileceği tartışmalara rağmen, Westminster Kabul Yasasını onaylamamız çoktan geç bile kalındı. Hangi savaşların bizim olduğunu kendimiz seçeceğiz."
 AST_ratify_westminster_adoption_act_tt:0 "£GFX_trigger_no Savaşa çağrıyı reddedebilir"
 AST_realize_the_value_of_british_citizenship:0 "İngiliz Vatandaşlığının Değerini Fark Et"
 AST_realize_the_value_of_british_citizenship_desc:0 "[ENG.GetNameDefCap]'in [AST.GetName] üzerindeki efendiliği, ulusumuza uzun süre hem koruyucu bir kalkan hem de yol gösterici bir ışık olarak hizmet etti. Britanya'dan geldik ve Britanya'nın bir parçası kalacağız - bize hizmet ettiği sürece."
 AST_reclaim_the_lost_territory:0 "Kaybedilen Toprakları Geri Al"
 AST_reclaim_the_lost_territory_desc:0 "Avustralya kolonilerini bir federasyon halinde birleştirme süreci sırasında, Yeni Zelanda nihayetinde katılmamaya karar verdi. Ancak o zamandan beri Anayasa, Yeni Zelanda'yı Avustralya Milletler Topluluğu'nun potansiyel devletlerinden biri olarak tanımlamaya devam etti ve kabulüne izin veriyor. Doğudaki komşularımıza bunu hatırlatacağız ve mevcut dünya durumunun birlik gerektirdiğini savunacağız."
 AST_reclaim_the_lost_territory_tt:0 "([NZL.GetFlag]§Y[NZL.GetName]§!) Tüm kara, deniz ve hava kuvvetlerini §Y[AST.GetNameDef]§! unsuruna devreder"
 AST_recovery:0 "İyileşme"
 AST_recovery_desc:0 "İlk kez, gayri safi yurt içi hasılamız Bunalım öncesi seviyeleri aştı. Bu, kutlanacak bir an, çünkü ekonomimizin tek yörüngesi artık yukarı doğru. Güçlü bir büyüme dönemine giriyoruz ve yenilenen refahımızın meyvelerini toplama zamanı geldi."
 AST_recruitment_drive:0 "İşe Alım Hamlesi"
 AST_recruitment_drive_desc:0 "Önceki hükümetlerin zayıf iradesi ve Britanya'ya aşırı güvenleri, Avustralya'nın silahlı kuvvetlerinin uzun süre ihmal edilmesine yol açtı. Avustralya Savunma Kuvvetleri'ne işe alımı teşvik etmek için bir kampanya başlatırken bu artık böyle devam etmeyecek."
 AST_red_fred:0 "Kızıl Fred"
 AST_red_fred_desc:0 "'Kızıl' Fred Paterson, ilk olarak 1934'te Brisbane Belediye Başkanı adayı olarak komünist harekette öne çıktı ve burada ağır bir yenilgi aldı. Ancak hırsları sönmedi ve şimdi Townsville'de belediye meclis üyesi olarak seçimlere giriyor. Desteğimizle, kamu görevine seçilen ilk Komünist olabilir."
 AST_red_solidarity:0 "Kızıl Dayanışma"
 AST_red_solidarity_desc:0 "Çin'deki mücadele milyonlar acı çekerken ve ölürken şiddetlenerek devam ediyor. Onların kavgası bizim kavgamızdır ve boş duramayız. Müdahale edebilir, yüklerini paylaşabilir ve devrim ateşinin sönmemesini sağlayabiliriz."
 AST_red_solidarity_tt:0 "§Y[AST.GetName]§!, §Y[PRC.GetNameDef]§!'in §Y[CHI.GetNameDef]§! unsuruna karşı açtığı savaşa katılır. Daha küçük olan ittifak diğerini yutar veya her ikisi de halihazırda müttefikse §Y[AST.GetName]§! savaşa doğrudan katılır."
 AST_reestablish_central_flying_school:0 "Merkez Uçuş Okulunu Yeniden Kur"
 AST_reestablish_central_flying_school_desc:0 "Avustralya'nın, 1. Uçuş Eğitim Okulu ile birlikte faaliyet gösteren uçuş okullarından bir diğeri olan Merkez Uçuş Okulu, modern bir hava kuvvetinin artan taleplerini karşılamaya yardımcı olacaktır. Gerilimler yükselirken, personelimizin ihtiyaç duydukları tesislere sahip olduğundan emin olmalıyız."
 AST_reform_the_state:0 "Devlet Reformu"
 AST_reform_the_state_desc:0 "[AST.GetName]'yi devlet krizlerinden ve ulusumuzu güçlendirmek yerine ona zarar veren politikalardan korumak için [AST.GetAdjective] devletinin yeniden yapılanmaya gitmesi gerekiyor. Senato Kraliyet Konseyi, Kabine ise Kraliyet Bakanlığı olacak ve her ikisi de otoritesi diyarın her köşesine yayılacak olan yeni devlet başkanımıza karşı sorumlu olacak."
 AST_reform_the_state_tt:0 "Başkanın seçimi, aşağıdaki odaklanma için §Yetkilere§! karar verecektir §Y$AST_the_councils_advice$§!"
 AST_refuse_british_wars:0 "Britanya Savaşlarını Reddet"
 AST_refuse_british_wars_desc:0 "Büyük Savaş'ın Gelibolu harekatı, [ENG.GetNameDef]'in keşif kuvvetlerimize gösterdiği pervasızlığı ortaya koydu, bu da onun adına başka bir yabancı harekat fikrini tamamen düşünülemez kılıyor. Avustralyalılar, Britanya komutası altında bir daha asla kan dökülmesini talep etmiyor, bu da hükümeti harekete geçmeye zorluyor; Westminster Yasası onaylanacaktır."
 AST_reinforcements:0 "Takviyeler"
 AST_reinforcements_desc:0 "Büyük ölçüde gelişmemiş kuzey bölgelerini savunma tesisleri ve hava üsleri ile hazırlayacağız."
 AST_repeal_immigration_restrictions:0 "Göç Kısıtlamalarını Kaldır"
 AST_repeal_immigration_restrictions_desc:0 "Göç Departmanı, [AST.GetName]'e kimin göç etmesine izin verileceğini belirleyen modası geçmiş yasalarla kısıtlanmıştır. Tartışma yaratma riskine rağmen, bu yasaları kaldıracağız ve göç akışını kontrol etmek için bir kota sistemi kuracağız."
 AST_resist_western_intruders:0 "Batılı Davetsiz Misafirlere Diren"
 AST_resist_western_intruders_desc:0 "Batılı uluslar Pasifik'teki işlere karışmak zorunda hissediyorlar, ancak bu artık sürmeyecek. Kıyılarımıza ulaşmadan önce biz onlarınkine ulaşacağız ve [AST.GetName]'in taleplere boyun eğen bir ulus olmadığını kanıtlayacağız."
 AST_reverse_industry_tariffs:0 "Endüstri Gümrük Vergilerini Geri Al"
 AST_reverse_industry_tariffs_desc:0 "Geçmişte, yerli endüstrilerimizi yabancı rekabetten korumak için gümrük vergilerini kullandık. Ancak bu, ticaret savaşlarına ve ihracatımıza karşı misilleme vergilerine yol açarak fiyatları yükseltti. Bu engelleri azaltmalı ve ticareti genişletmeye yardımcı olmak için karşılıklı indirimleri teşvik etmeliyiz."
 AST_reverse_wage_cuts:0 "Maaş Kesintilerini Geri Al"
 AST_reverse_wage_cuts_desc:0 "İşletmelere bir mücadele şansı vermek için ekonomi genelinde bir dizi maaş kesintisi uyguladık. İyileşme belirtileri görmeye başladığımıza göre, rotayı tersine çevirmeliyiz. Artan maaşlar daha fazla harcama gücüne yol açar, bu da tüketimi ve ekonomik büyümeyi artırmaya yardımcı olur."
 AST_ride_the_lightning:0 "Şimşeğe Bin"
 AST_ride_the_lightning_desc:0 "Avcı pilotlarımız hava gücümüzün mızrak ucudur; hızlı, agresif ve amansız. Savaşa şimşeğe binerek gidiyorlar, gökyüzünün kontrolünü ele geçiriyor, düşman uçaklarını önlüyor ve kuvvetlerimiz nereye giderse gitsin hava üstünlüğünün onları takip etmesini sağlıyorlar."
 AST_right_vs_left_campaign_title_text:0 "Demokratik Seçimler"
 AST_rile_up_veterans:0 "Gazileri Kışkırt"
 AST_rile_up_veterans_desc:0 "Büyük Buhran'ın başlangıcında, I. Dünya Savaşı gazileri komünizmin yükselişine karşı koymak için aşırı sağcı paramiliter gruplarda birleştiler. O gruplar o zamandan beri dağılmış olsa da, eski üyeleri ortadan kaybolmadı; Önce Avustralya onları bünyesine katacak ve antikomünizm meşalesi devredilecek."
 AST_royal_australian_navy:0 "Kraliyet Avustralya Donanması"
 AST_royal_australian_navy_desc:0 "Federasyonun ardından sömürge filolarını birleştirerek kurulan Kraliyet Avustralya Donanması, Büyük Savaş'ta neredeyse her tiyatroda hizmet verdi. O zamandan beri sınırlı fonla küçültüldü, ancak yükselen küresel gerilimlerle, filonun denizlere dönme zamanı geldi."
 AST_royal_prestige:0 "Kraliyet Prestiji"
 AST_royal_prestige_desc:0 "Güçlü ulusal kimlik, ortak değerler üzerine inşa edilir ve onur ve gururla korunur. [AST.GetName] kendisini Britanya'dan ve diğer İngiliz Milletler Topluluğu ülkelerinden farklı kılmak için ulusal saygınlığını oluşturmalı ve saygıya değer çabalara yatırım yapmalıdır: Britanya'nınkiyle bile boy ölçüşebilecek kadar büyük bir filo."
 AST_ruling_party:0 "§Yİktidardaki Parti§!"
 AST_ruling_party_alp:0 "$AST_ruling_party$ ($AST_alp$)"
 AST_ruling_party_uap:0 "$AST_ruling_party$ ($AST_uap$)"
 AST_rural_concessions:0 "Kırsal Tavizler"
 AST_rural_concessions_desc:0 "Country Party'nin kırsal temsilcileri tek başına yönetmek için çok az oy alıyor, ancak onların Avustralya siyasetindeki etkilerini memnuniyetle karşılayarak, mevcut iktidar partisi olarak ek destek kazanabiliriz."
 AST_rural_concessions_tt:0 "\n§Y$AST_country_party_influence_uap$§!, Milli Hedef tamamlandığında iktidardaki parti için oyları artıracaktır."
 AST_scrap_iron_flotilla_taog:0 "Hurda Demir Filosu"
 AST_scrap_iron_flotilla_taog_desc:0 "Eleştirmenler tarafından modası geçmiş ve yıpranmış olarak göz ardı edilmesine rağmen, eski muhriplerimizden bazıları tek bir formasyonda bir araya getirildi. Modern gemilerin prestijinden yoksun olsalar da, bu gemiler halihazırda sahip olduğumuz şeylerin kaynak kullanımı temsil ediyor."
 AST_second_australian_imperial_force:0 "İkinci Avustralya İmparatorluk Gücü"
 AST_second_australian_imperial_force_desc:0 "Avustralya, Büyük Savaş sırasında Birinci Avustralya İmparatorluk Gücü'nü görevlendirerek yurt dışında savaşmak üzere birlikler gönderdi. Savaşın dünyayı tekrar sarması tehdidiyle, yurt dışında Avustralya gücünü göstermek için İkinci bir İmparatorluk Gücü oluşturmalıyız."
 AST_sentinel_tank_development:0 "Sentinel Tankı Geliştirme"
 AST_sentinel_tank_development_desc:0 "Tarihsel olarak, onları yerli olarak üretirken bile ithal tank tasarımlarına güvendik. Bu makinelerden alınan derslerin üzerine inşa etmeli ve bir miktar Avustralya inovasyonu ile kendi yeteneklerimize ve kaynaklarımıza uygun kendi tankımızı geliştirmeliyiz."
 AST_seven_million_britishers:0 "Yedi Milyon İngiliz"
 AST_seven_million_britishers_conscription_tt:0 "\n§YEğer $AST_ending_overseas_conscription$ tamamlanmadıysa§!:"
 AST_seven_million_britishers_desc:0 "Her ne kadar [ENG.GetLeader] bize söz verme konusunda tereddütlü olsa da, işler zorlaştığında onun ve Britanya'nın [AST.GetNameDef]'e olan bağlılığına güveneceğiz. Ne de olsa biz sadece yedi milyon İngiliziz."
 AST_seven_million_britishers_reinforcements_tt:0 "\n§YEğer $AST_reinforcements$ tamamlanmadıysa§!:"
 AST_seven_million_britishers_uncle_tt:0 "\n§YEğer $AST_an_uncle_for_father_figure$ tamamlanmadıysa§!:"
 AST_singapore_strategy:0 "Singapur Stratejisi"
 AST_singapore_strategy_desc:0 "Singapur Stratejisi, Avustralya savunma politikasının temel bir bileşenidir ve Pasifik'te konuşlanmış Kraliyet Donanması gemileri için bir üs olarak Singapur bölgesinin kendisi büyük önem taşımaktadır. İngilizleri ek savunma inşaatı yapmaya ikna ederken, biz de Avustralya donanma yeteneklerini güçlendireceğiz."
 AST_singapore_strategy_tt:0 "§Y180§! gün sonra (§YSingapur§!):\n §G2§! §YHava Üssü§! ekle.\n §G2§! §YDeniz Üssü§! ekle.\n §G1§! §YKıyı Tahkimatı§! ekle."
 AST_solidarity_by_the_empire:0 "İmparatorluk Dayanışması"
 AST_solidarity_by_the_empire_desc:0 "Bu noktaya kadar, Britanya İmparatorluğu bize savaşta ve barışta rehberlik etti. Onun tavsiyelerine değer vermeye ve potansiyel çatışmalara hazırlanırken işbirliği yapmaya devam edeceğiz."
 AST_solidarity_by_the_empire_modifier:0 "İmparatorluk Dayanışması"
 AST_soothing_australian_fears:0 "Avustralya Korkularını Yatıştırma"
 AST_soothing_australian_fears_desc:0 "Bazı hükümet yetkilileri Avustralya ve Japonya'nın işbirliği olasılığına inansa da, Avustralya halkı inanmıyor. Çok uzun süredir Japon istilasından korktuktan sonra, aynı potansiyel saldırganla el ele verme fikrini çoğu kişi kavramakta zorlanıyor. Bu yüzden korkularını savaşa hazırlanarak yatıştıracağız."
 AST_soothing_australian_fears_tt:0 "\n§Y180§! gün sonra:"
 AST_southern_academy_of_sciences:0 "Güney Bilimler Akademisi"
 AST_southern_academy_of_sciences_desc:0 "İlerleme meşalesi esintiyle süzülüyor, dar görüşlü adamların kaygıları yüzünden boğuluyor. Dünyayı sosyalist ütopyamıza doğru yönlendirmek için Güney Bilimler Akademisini kurmalı ve bir aydınlanma ışığı yakmalıyız."
 AST_standard_gauge_line_to_darwin:0 "Darwin'e Standart Hatlı Demiryolu"
 AST_standard_gauge_line_to_darwin_desc:0 "Kuzey topraklarımıza çok uzun süredir uygun bağlantılardan yoksun kaldık. Ekonomiye para aktarmayı amaçlayan daha geniş bir kamu çalışması programının bir parçası olarak, güney şehirlerimizi kuzeye bağlayan bir demiryolu inşa edebiliriz."
 AST_state_research_funding:0 "Devlet Araştırma Fonu"
 AST_state_research_funding_desc:0 "Araştırma kurumlarımızın etkinliğini en üst düzeye çıkarmak için, devlet onların birincil fon kaynağı olarak hizmet etmeli, çabaları ihtiyaç duyulan yere yönlendirmeli ve bilginin sıkı bir şekilde kontrol edilmesini sağlamalıdır. Ne de olsa, vatandaşlarımızın yanlış fikirlerle rahatsız edilmesini riske atamayız."
 AST_stephensen:0 "P.R. Stephensen"
 AST_stephensen_desc:0 "Önce Avustralya Hareketi'nin resmi kuruluşunda, başkan olarak P.R. Stephensen'i atayacağız. William John Miles'ın edebi danışmanı olarak Stephensen, akıl hocasının izolasyonist ve milliyetçi görüşlerini paylaşmaktadır. Bunlar, hareketimizin anayasasının iki temel ilkesini oluşturacaktır: Britanya'dan bağımsızlık ve Avustralya kültürünün birleşimi."
 AST_stephensen_tt:0 "\n§YÖnce Avustralya Hareketi§! için başkan seçimi, olası gelecekteki eylemleri belirler."
 AST_stretch_the_fleet:0 "Filoyu Ger"
 AST_stretch_the_fleet_desc:0 "Britanya, kudretli filosuyla korunarak, hala kapitalizmin kalesi olarak ayakta duruyor. Kendi deniz yeteneklerimizi genişletmenin, savaşı onlara taşımanın ve dünyaya hangi adanın daha büyük olduğunu göstermenin zamanı geldi."
 AST_strike_from_down_under:0 "Aşağıdan Vur"
 AST_strike_from_down_under_desc:0 "Dalgaların altında süzülüyorlar, gök gürültüsü yok ve eğer seni bulurlarsa, gemilerini yağmalayacaklar. Duydun mu, Aşağıdan gelen denizaltıları duydun mu? Kaçsan iyi olur, yoksa filonu heba edeceksin. Yee-aaah!"
 AST_strongholds:0 "Kaleler"
 AST_strongholds_desc:0 "Bu yeni tiyatrodaki konumumuzu güvence altına almak için, İrlandalı yoldaşlarımızı kapitalizmin emperyal kalbine karşı desteklemeliyiz. Onların önceki bağımsızlık mücadelesi, küresel çatışmanın bir sonraki aşamasına hazırlanırken bize değerli dersler sunuyor."
 AST_take_it_to_the_streets:0 "Sokaklara Taşı"
 AST_take_it_to_the_streets_desc:0 "Endüstriyel eylem, toplumda değişimi zorlamak için sahip olduğumuz en güçlü araçlardan biridir ve onu sadece sömürmek için tasarlanmış bir sisteme karşı kullanmalıyız. Şimdi üretim araçlarını geri alma zamanı, Avustralya işçileri, birleşin!"
 AST_taking_the_helm:0 "Dümene Geçiş"
 AST_taking_the_helm_desc:0 "Güneydoğu Asya genelinde nüfuzumuz genişledikçe, onu savunmak için denizcilik yeteneklerimizin büyümesi gerekir. Kraliyet Avustralya Donanması'na yapılan yatırımlara öncelik vereceğiz ve doğu denizlerinde kontrolü ele alacağız."
 AST_the_1938_sesquicentenary_flag:0 "§Y1938 Yüz Elli Yıl Dönümü§! etkinliği gerçekleşti."
 AST_the_1938_sesquicentenary_tt:0 "§YNüfuslan Ya da Yok Ol§! Dalındaki '§YYeni Düzen§!' hedefi kullanılabilir hale gelir."
 AST_the_australian_commonwealth:0 "Avustralya Ortak Refah Topluluğu"
 AST_the_australian_commonwealth_desc:0 "Britanya bir zamanlar Milletler Topluluğu üzerinde liderlik pelerinini talep etti ancak vizyonu kapitalist çıkarlar tarafından yozlaştırıldı. Bu rolü üstleneceğiz ve ulusları ortak bir sosyalist ütopyaya doğru yöneteceğiz."
 AST_the_bolsheviks_counterforce:0 "Bolşeviklerin Karşı Gücü"
 AST_the_bolsheviks_counterforce_desc:0 "Soruşturma Şubesi, on yıllardır yıkıcı grupların faaliyetlerine yönelik soruşturmalar yürütmüştür. Solcu tehditleri bastırma çalışmaları yüksek değerdedir ve Önce Avustralya'ya karşı çıkanlar büyümemize direnmeyi seçtikleri için ihmal edilmemelidir. Avustralya istihbarat ofisinde pozisyonlar arayacağız ve ulusal güvenliğe yönelik asıl tehdidin öncelikli olduğundan emin olacağız."
 AST_the_commander_returns:0 "Komutan Geri Dönüyor"
 AST_the_commander_returns_desc:0 "Tanıdık rüzgarlar, hâlâ hayatta olan ve küllerin altında sürünen bir efsanenin küllerini harekete geçiriyor. Yeni Muhafızların Babası, ideolojik farklılıklar çok büyüdüğünde tüm ortakların müttefik olmadığını ve sivil birliğin ulusal savunma için askeri güç kadar önemli olduğunu zor yoldan öğrendi. Avustralya Birinci'nin dizginleri ona emanet edilirse, en sadık Muhafızlarını siyasi muhalifleri disipline etmeye adayacak."
 AST_the_commander_returns_trigger_tt:0 "§Y15.000§!'den fazla Yeni Muhafız üyesi"
 AST_the_councils_advice:0 "Konseyin Tavsiyesi"
 AST_the_councils_advice_desc:0 "Başkanının liderliğindeki Kraliyet Konseyi, yeni bir ulusal öncelik konusunda tavsiyelerde bulunuyor. [GET_AST_THE_COUNCILS_ADVISE_DESC]"
 AST_the_councils_advice_hore_ruthven_desc:0 "Ülkenin korunmasına her şeyden çok değer verilmelidir; savunacak toprağımız yoksa askeri gücün hiçbir değeri yoktur. Kraliyet Konseyi, sınırlarımızın güçlendirilmesi gerektiği konusunda hemfikirdir."
 AST_the_councils_advice_hughes_desc:0 "Savaşın başlamasından birkaç yıl önce Billy Hughes çatışmayı öngördü ve o zamandan beri yeniden silahlanmayı savundu. Yine de Başkan, [AST.GetName]'nin askeri ihtiyaçlarının tam olarak karşılanması gerektiğini düşünmüyor ve bu nedenle Kraliyet Konseyi daha fazla yatırım yapılmasını tavsiye ediyor."
 AST_the_councils_advice_pankhurst_walsh_desc:0 "Kendisi de İngiltere'den gelen bir göçmen olan Başkan Pankhurst Walsh, İngiliz Milletler Topluluğu işbirliğine her zaman değer vermiştir. Her ne kadar [AST.GetName] birçok açıdan kendisini Britanya'dan ayırmaya başlasa da Pankhurst, Avustralya-İngiliz ilişkilerini, bölünmemize yardımlarını teşvik etmek için geliştirmemizi öneriyor."
 AST_the_gathering_storm:0 "Toplanan Fırtına"
 AST_the_gathering_storm_desc:0 "Ufukta bir fırtına toplanıyor. Büyüyen hava gücümüz yukarıdan artan baskı getiriyor, düşmanın en zayıf olduğu yerlere çarpıyor ve ilerlememizi destekliyor. Uzak bir gürültü olarak başlayan şey, yakında amansız bir yıkım fırtınasına dönüşecek."
 AST_the_guild_for_the_war_effort:0 "Savaş Çabası İçin Lonca"
 AST_the_guild_for_the_war_effort_desc:0 "Avustralya İmparatorluk Kadınlar Loncası Taç'a hizmet etmek için kuruldu. Amacı tamamen yeniden yönlendiriliyor. İnşa ettiği geniş organizasyon ağı, şimdi enerjisini savaş endüstrilerine, hastanelere ve kendi kendine yeten bir Avustralya'nın tedarik zincirlerine kanalize edecek."
 AST_the_irish_anti-britain_pact:0 "İrlanda Britanya Karşıtı Paktı"
 AST_the_irish_anti-britain_pact_desc:0 "Britanya, ada konumu ve deniz gücüyle korunarak, çok uzun zamandır bir kapitalizm kalesi olarak ayakta duruyor. İrlanda ve Kuzey İrlanda'daki liman işçileri arasında huzursuzluğu kışkırtarak, savunmalarını delebilir ve kuvvetlerimiz için İrlanda Denizi üzerinden bir yol açabiliriz."
 AST_the_kings_men:0 "Kralın Adamları"
 AST_the_kings_men_desc:0 "Yeni Muhafızların faşist yatıştırıcılar olarak ününe rağmen, gerçek daha incelikli. Her ne kadar bazı bölünmüş gruplar ve hareketin kurucusunun kendisi faşist idealleri benimsemiş olsa da üyelerinin büyük çoğunluğu bunu benimsemedi. Son derece vatansever ve monarşiye bağlı olan Muhafızlar, Kraliyet için memnuniyetle savaşacak."
 AST_the_kings_men_tt:0 "§Y[GET_AST_NG_INF_UNITS] [AST.GetAdjective]§! piyade birimlerini oluşturun"
 AST_the_manpower_directorate:0 "İnsan Gücü Müdürlüğü"
 AST_the_manpower_directorate_desc:0 "Ekonomimiz giderek daha karmaşık hale geldikçe, artan insan gücü zorluklarıyla karşılaşıyoruz. Bu müdürlük, doğru insanların doğru becerilerle, doğru zamanda doğru rollere yerleştirilmesini sağlayacaktır."
 AST_the_pacific_garrison:0 "Pasifik Garnizonu"
 AST_the_pacific_garrison_desc:0 "Güneydoğu Asya ve Pasifik'in korunması Britanya'nın çıkarları için olsa da, bölge Britanya Adaları'ndan çok uzaktır. Tedarik konusundaki destekleri karşılığında, bölgenin savunmasının komutasını üstlenmeyi teklif edeceğiz ve [ENG.GetNameDef]'in dikkatini başka yöne çevirmesine izin vereceğiz."
 AST_the_pacific_pact:0 "Pasifik Paktı"
 AST_the_pacific_pact_desc:0 "Lyons'ın 1934'teki Pasifik Girişimleri, Avustralya ile büyük Asya ulusları arasında temas kurarak çıkarlarımızı temsil etmeleri için İngiliz yetkililere güvenmemizi durdurmamızı sağladı. Bu ilişkileri, Asya güçlerinin Avustralya'ya karşı saldırganca davranmamasını sağlamak için kullanabilirsek, diplomatik çabalarımızın nihai hedefi bu olacaktır. Bu zorlu bir girişim olabilir ama değerli bir girişimdir."
 AST_the_pacific_resistance:0 "Pasifik Direnişi"
 AST_the_pacific_resistance_desc:0 "Avustralya bağımsızlığı nihayet geldi ve Britanya savaş çabasından kopmamız sadece doğru olandır. Bunun yerine [USA.GetNameDef] ile birlik kurarak, kendi savunma endüstrimizin ve genişlemesinin tam kontrolünü bağımsız olarak alırken Avustralya çıkarlarına değer veren ortak komuta stratejileri şekillendirebiliriz."
 AST_the_pacific_resistance_tt1:0 "§YAvustralya§! §Y[USA.GetFactionName]§!'e katılır."
 AST_the_pacific_resistance_tt2:0 "§Y[USA.GetName]§! §YPasifik Direnişi§!'ne katılır."
 AST_the_phosphate_commision:0 "Fosfat Komisyonu"
 AST_the_phosphate_commision_desc:0 "Büyük Savaş'ın ardından, Nauru; Avustralya, Yeni Zelanda ve Birleşik Krallık'ın ortak vesayeti altına alındı. 1919'da, adadaki tüm fosfat satış hakları, Avustralya liderliğindeki bu mütevellilere devredildi. Liderlik konumumuzu kullanarak, fiyatlandırmayı etkileyebilir ve iç pazarımız için oldukça rekabetçi oranlar elde edebiliriz."
 AST_the_publics_australia:0 "Halkın Avustralya'sı"
 AST_the_publics_australia_desc:0 "Eski düzeni bir kenara attık ve azınlık için değil, çoğunluk için var olan bir ulus inşa ettik. Endüstri, emek ve kaynaklar artık halka bir bütün olarak hizmet ediyor. Bu, Halkın Avustralya'sıdır. Eşit, birleşik ve kırılmaz."
 AST_the_red_pacific:0 "Kızıl Pasifik"
 AST_the_red_pacific_desc:0 "Pasifik, devrimin suretinde yeniden şekillendirilmelidir. Bölgemizin adaları ve kıyıları boyunca, sosyalist hükümetlerin yükselişini destekleyecek ve kızıl sancağın kıyıdan kıyıya dalgalanmasını sağlayacağız."
 AST_the_ultimate_overseas_duty:0 "Nihai Denizaşırı Görev"
 AST_the_ultimate_overseas_duty_desc:0 "Britanya Başbakanı, sorumluluklarını o kadar kötü yönetti ki, kendi bakanları arasında bile güvensizlik yayıldı. Menzies, Britanya Savaş Kabinesi'ne katılmak için yaptığı ziyaretler sırasında oldukça güçlü bir izlenim bıraktı ve şimdi bazıları onun Britanya'nın daha iyi seçeneği olabileceğini öne sürüyor. Milletler Topluluğu'nun dizginleri elindeyken, Menzies'in [AST.GetName]'e olan sadakatini kullanabilir ve otoritemizi artırabiliriz."
 AST_the_ultimate_overseas_duty_tt:0 "\n§Y[ENG.GetNameDef]§! lideri olarak §Y$AST_robert_menzies$§! ile, §Y$AST_a_change_of_authority$§! hedefinde bir §Y$autonomy_associated_dominion$§! haline gelebiliriz."
 AST_the_winner_takes_it_all:0 "Kazanan Hepsini Alır"
 AST_the_winner_takes_it_all_desc:0 "Nauru adasını Alman işbirliği için feda etmek bir zamanlar makul görünse de, artık görünmüyor. Yeteneklerimizin güçlü olduğu kanıtlandığında, Solomon Adaları ve Yeni Zelanda'ya genişleme arayacağız, ilki Nauru Paktı'na ihanetimizi artırsa bile. Ne de olsa, Solomon Adaları, Avustralya ellerine kaybedilen başka bir Alman bölgesi olacak."
 AST_through_the_barricades_tt:0 "Eğer §Y[ENG.GetNameDef]§! en az §Y10%§! Komünist Desteğe sahipse, savaşın başlangıcında §Y[132.GetCapitalVictoryPointName]§! liman işçileri bizi desteklemek için ayaklanacak!"
 AST_through_the_gates:0 "Kapılardan"
 AST_through_the_gates_desc:0 "Hazırlık yerini aciliyete bıraktı. Milli Savunma programı, arkasındaki Avustralya endüstrisinin tüm ağırlığıyla genişletiliyor. Yeni tesisler mevcut olanların yanında yükseliyor, üretim hedefleri yukarı yönlü revize ediliyor ve sivil üretim ile askeri ihtiyaç arasındaki çizgi sessizce siliniyor."
 AST_toe_the_line:0 "Hizaya Gir"
 AST_toe_the_line_desc:0 "Avustralyalıların refah yıllarında alıştığı rahatlıklar artık bir kenara bırakılmalıdır. Karne, daha uzun çalışma saatleri ve göreve çağrı, bağımsızlığın bedelidir. Yanıt verenler, arkalarında durmaya hazır bir ulus bulacaklardır. Ancak devlet, fedakarlığın başkasının yükü olduğuna inananlara karşı çok az sabır gösterecektir."
 AST_torres_strait_battalion:0 "Torres Boğazı Taburu"
 AST_torres_strait_battalion_desc:0 "Torres Boğazı Şirketi'nin bir garnizon olarak çabaları iyi yönetildi, ancak adamlarının başka başarılar için potansiyeli var. Üyeleri [AST.GetName]'in kuzey kıyısındaki adalardan gelen birim, Torres Boğazı hakkında kapsamlı bilgiye sahiptir. Adamlarını Deniz Piyadeleri olarak eğiteceğiz ve bir tabur oluşturmak için gönüllüler çağrısında bulunacağız."
 AST_uap:0 "§YU.A.P§!"
 AST_uap_50_discount:0 "\n\n§YDemokratik Oyların >50%'sine sahip olmanın etki§!:\n(§YU.A.P§! Milli Hedef kümeleri):\n§Y5§! gün Tamamlanma Süresi azalması.\n\n§YU.A.P§! Milli Hedef kümelerinde §Y10§! günlük Tamamlanma Süresi indirimi almak için Oyları §Y70%'nin üzerine§! çıkarın."
 AST_uap_70_discount:0 "\n\n§YDemokratik Oyların >70%'sine sahip olmanın etki§!:\n(§YU.A.P§! Milli Hedef kümeleri):\n§Y10§! gün Tamamlanma Süresi azalması."
 AST_uap_becomes_ruling_party:0 "§YBirleşik Avustralya Partisi§! iktidardaki parti olur."
 AST_uap_candidate_text:0 "§YBirleşik Avustralya Partisi§!\n[AST_GET_UAP_LEADER_TEXT]\n\n§LYurtta İstikrar, İmparatorluk Genelinde Güç§!\n\n[GET_AST_UAP_RULING]"
 AST_uap_cluster_unlock:0 "Bir sonraki §YU.A.P§! Milli Hedef kümesinin §Gkilidi açılır§!."
 AST_uap_confirmed_election_winner_text:0 "§YU.A.P§! §WSEÇİM ZAFERİ§!"
 AST_uap_decrease_votes_daily_impact:0 "\n §YU.A.P§! değişikliklerinden dolayı: §G+[?AST_uap_votes_daily_impact_var|2G]%§!"
 AST_uap_discount:0 "\n\n§YU.A.P§! Milli Hedef kümelerinde §Y5§! günlük Tamamlanma Süresi indirimi almak için Oyları §Y50%'nin üzerine§! çıkarın."
 AST_uap_election_campaign_tt:0 "§YU.A.P Seçim Kampanyası§!\n§LOrta sınıfı, işletme sahiplerini ve imparatorluk sadıklarını bir araya getirin; Birleşik Avustralya Partisi siyasi bir kampanya başlatacak.§!\n\n§YEtki:§!\nGünlük Siyasi Güç Maliyeti: §R1.00§!\nGünlük §YU.A.P§! Oyları artışı: §G+0.05%§!"
 AST_uap_election_win:0 "§YU.A.P§! §Y1§! Seçim Zaferi Kazanır.\n\n[GET_AST_UAP_CLUSTER_UNLOCK][GET_AST_15_NATUNITY]"
 AST_uap_increase_votes_daily_impact:0 "\n §YU.A.P§! değişikliklerinden dolayı: §R[?AST_uap_votes_daily_impact_var|2R]%§!"
 AST_uap_less_than_3_wins_tt:0 "§YU.A.P§! §Y3§! Seçim Zaferinden azına sahip."
 AST_uap_popularity_decrease_10:0 "§Y$AST_ruling_party$§! (§Y$AST_uap$§!) Oyları: §R-10.00%§!"
 AST_uap_popularity_decrease_5:0 "§Y$AST_ruling_party$§! (§Y$AST_uap$§!) Oyları: §R-5.00%§!\n\n"
 AST_uap_popularity_increase_10:0 "§Y$AST_ruling_party$§! (§Y$AST_uap$§!) Oyları: §G+10.00%§!"
 AST_uap_popularity_increase_5:0 "§Y$AST_ruling_party$§! (§Y$AST_uap$§!) Oyları: §G+5.00%§!\n\n"
 AST_uap_votes_count:0 "§YU.A.P§! Demokratik Oyların [?AST_uap_votes_var|2Y]§Y%§!'sine sahip.\n\nGünlük Değişim: [?AST_uap_votes_change_var|2Y]§Y%§![GET_AST_UAP_PARTY_CAMPAIGN][GET_AST_COUNTRY_PARTY_SUPPORT_UAP][GET_AST_BILLY_HUGHES_VOTES][GET_AST_ARTHUR_FADDEN_VOTES][GET_AST_MAURICE_BLACKBURN_UAP_VOTES][GET_ALP_VOTES_DAILY_IMPACT][GET_AST_UAP_DISCOUNT]"
 AST_uap_win_count:0 "§YU.A.P§! [?AST_uap_election_win_count|0Y] Seçim Zaferine sahip."
 AST_uap_win_count_trigger_tt:0 "§YU.A.P§! en az $COUNT|Y$ Seçim Zaferine sahip."
 AST_uap_won_election_tt:0 "§YU.A.P§! Seçimi kazandı"
 AST_undeniably_ours:0 "İnkar Edilemez Bir Şekilde Bizim"
 AST_undeniably_ours_desc:0 "Diplomasinin bize ne bağışlayabileceğine bakılmaksızın, bize hepsini asla vermeyecektir. Kırılgan durumunda, Vichy Fransası'nın sınırları sadece öneri görevi görüyor ve topraklarını tamamen işgal etme fırsatını değerlendirmemek çok akılsızca olurdu. Kaçınılmaz olarak, savaş zamanı geldi."
 AST_under_the_rule_of_canberra:0 "Canberra Yönetimi Altında"
 AST_under_the_rule_of_canberra_desc:0 "Pasifik ulusları arasındaki gerilimin artması endişe verici ve Britanya'nın kendi savaşlarıyla meşgul olması nedeniyle kurtarmaya gelme kapasitesi inandırıcı görünmüyor. İngiliz Milletler Topluluğu'nu yeniden yapılandırıp Pasifik ve Hint Okyanusu ulusları doğrudan Canberra'dan yönetilseydi, [ENG.GetNameDef] olmadan bile tek bir cephede birleşebilirdik."
 AST_union_control_commonwealth:0 "§YSendika Kontrolü§! kararlarının kilidini açar. \nYeni Zelanda, Malezya, Burma ve nihayetinde Hindistan'ın Komünist sızmasına izin verir."
 AST_union_control_local:0 "§YSendika Kontrolü§! kararlarının kilidini açar. \nEndonezya ve Filipinler'in Komünist sızmasına izin verir."
 AST_united_states_as_our_keystone:0 "Kilit Taşı Olarak Amerika Birleşik Devletleri"
 AST_united_states_as_our_keystone_desc:0 "Birleşik Krallık'ın karşılaştığı sorunları biliyoruz. Kuvvetlerin dağılmasının tehlikelerini biliyoruz, ancak Avustralya'nın gidebileceğini ve Britanya'nın hala dayanabileceğini de biliyoruz. Bu nedenle, Avustralya'nın gitmemeye kararlı olduğuna ve tüm enerjimizi Amerika Birleşik Devletleri ile kilit taşı olarak bir plan oluşturmaya yönlendireceğimize inanıyoruz."
 AST_unlocking_conscription_1903_tt:0 "§YAskerlik Yasalarının§! kilidini açmak için gereklidir."
 AST_unlocking_conscription_tt:0 "Eğer ayrıca §Y$AST_invoke_the_1903_defence_act$§! milli hedefine sahipseniz, kalan tüm §YAskerlik Yasalarının§! kilidini açacaksınız."
 AST_unlocking_further_conscription_tt:0 "§YKapsamlı Askerlik§! veya §Yİhtiyaca Göre Hizmet§! için ayrıca aşağıdaki milli hedeflerden herhangi birine ihtiyacınız olacak; §Y$AST_british_pact$§! (Faşist), §Y$AST_refuse_british_wars$§! (Faşist), §Y$AST_toe_the_line$§! (Faşist), §Y$AST_from_picket_line_to_front_line$§! (Komünist) veya §Y$AST_part_with_colonizer$§! (Komünist)."
 AST_until_the_tide_of_battle_swings:0 "Savaşın Seyri Dönene Kadar"
 AST_until_the_tide_of_battle_swings_desc:0 "Kamuya açık bir açıklamada, arka bahçemizde kıpırdayan tehdidi göz ardı etme vaktinin dolduğunu açıkça belirteceğiz. Pasifik mücadelesinin genel çatışmanın ikincil bir parçası olarak görülmesi politikasını kabul etmeyi reddediyoruz; Avustralya derhal istilaya hazırlanacak."
 AST_vichy_africa_claim_flag:0 "[AST.GetFlag]§Y[AST.GetName]§! tarafından tüm §YVichy Fransası§! toprakları için §YAfrika§!'de §YMeddahlıktan Vazgeç§! (Done Meddling) hedefiyle hak iddiaları eklendi."
 AST_vichy_claim_tt:0 "[AST.GetFlag]§Y[AST.GetName]§! tarafından §YMeddahlıktan Vazgeç§! (Done Meddling) hedefiyle hak iddiaları eklendi."
 AST_vichy_out_of_africa:0 "Vichy Afrika'dan Çıksın"
 AST_vichy_out_of_africa_desc:0 "Vichy Fransası'nın düşüşü veya işbirliği, [ENG.GetNameDef]'in ana hedeflerinden biridir. İyi niyet göstergesi olarak [AST.GetName], Fransız Afrika kolonilerini boyun eğdirilene kadar takip edecektir."
 AST_vichy_out_of_africa_tt1:0 "§YVichy Fransası§! toprakları için §YAfrika§!'de §YVichy Afrika'dan Çıksın§! hedefiyle hak iddiaları ekle.\n"
 AST_vichy_out_of_africa_tt2:0 "§YVichy Fransası§! toprakları için §YAfrika§!'de §YVichy Afrika'dan Çıksın§! Kararlarıyla hak iddiaları ekle.\n"
 AST_volunteer_air_corps:0 "Gönüllü Hava Gözlemci Birlikleri"
 AST_volunteer_air_corps_desc:0 "Avustralya hava sahası, sadece resmi birimlerin erişiminin çok ötesindedir. Bunun yerine, gökyüzümüzü izlemek için ülke genelinde dağılmış binlerce gözlem noktasına insan sağlayan yerel gönüllülere güvenmeliyiz."
 AST_volunteer_defence_corps_taog:0 "Gönüllü Savunma Birlikleri"
 AST_volunteer_defence_corps_taog_desc:0 "Britanya'nın İç Muhafızlarına benzer bir güç olarak kurulan Gönüllü Savunma Birlikleri, düzenli hizmete uygun olmayanlardan oluşan ücretsiz bir vatandaş milis gücüdür. Bu sınırlamalara rağmen, yerel arazi bilgileri, en kötüsü olması durumunda gerilla savaşı için çok uygun olmalarını sağlamaktadır."
 AST_volunteers:0 "Gönüllüler"
 AST_volunteers_desc:0 "Seçme şansına sahip olmak önemlidir; silah çağrısını reddedebilme yeteneği, Avustralya'nın her zaman reddedeceği anlamına gelmez. Avustralyalılar, hem kendi topraklarında hem de yabancı topraklarda haklı olan için savaşma hakkına sahip olacaklardır."
 AST_walls_and_whispers:0 "Duvarlar ve Fısıltılar"
 AST_walls_and_whispers_desc:0 "Yıkılmaz duvarlar ve yere kulak vermek, ulusal güvenlik için büyük bir potansiyel yaratır. Kara ve kıyı savunmalarını topraklarımızda daha iyi bir temele oturtmak ve içeride bir istihbarat karargahı kurmak için adımlar atılacaktır."
 AST_walls_like_uluru:0 "Uluru Gibi Duvarlar"
 AST_walls_like_uluru_desc:0 "Avustralya kendi başına bir kıta. Eğer İmparatorluğun kalkanı olmadan ayakta kalacaksak, kendimizinkini inşa etmeliyiz. Kıyı şeridi sertleştirilecek, limanlar tahkim edilecek ve yaklaşımlar, bu ulusu kolay bir ödül sanan herkes için haince hale getirilecektir."
 AST_war_carriers:0 "Savaş Taşıyıcıları"
 AST_war_carriers_desc:0 "Lojistik savaşları kazandırır ve Avustralya'nın faaliyet gösterdiği arazinin çoğu kamyon veya tren gibi geleneksel taşımacılığa pek uygun değildir. Bunun yerine, koşullara iyi uyum sağlamış ve gizli yollara ve kestirmelere aşina olan yerel insan gücüne güvenmeliyiz."
 AST_war_is_coming:0 "Savaş Yaklaşıyor"
 AST_war_is_coming_advisors_tt:0 "\nSiyasi Danışmanı şununla değiştir:"
 AST_war_is_coming_alp_advisors_tt:0 "(§Y$AST_james_scullin$§!):"
 AST_war_is_coming_decrease_advisors_tt:0 "(§Y$AST_maurice_blackburn$§!):"
 AST_war_is_coming_desc:0 "Son otuz yıldır birbiri ardına gelen zorluklarla karşı karşıya kaldık, ancak Avustralya demokrasisinin gücünü bir kez ve herkes için test edecek nihai bir zorluk ufukta görünüyor. Eski Başbakan Billy Hughes bu konuda çok net ve istesek de istemesek de savaşın geldiğine dair iddialarını göz ardı etmemiz sorumsuzluk olur."
 AST_war_is_coming_tt:0 "\n§YDemokratik Seçimlerin§! kilidini açar"
 AST_war_is_coming_uap_advisors_tt:0 "(§Y$AST_billy_hughes$§!):"
 AST_we_endured:0 "Dayandık"
 AST_we_endured_desc:0 "Yaklaşan çatışma tahmini başta bunaltıcı gelmiş olabilir, ancak bunu savunma yeteneklerimizin genişlemesini hızlandırmak için kullanarak, sonuçta bir amaca hizmet etti. Dayandık ve ısrar edeceğiz, şimdi nihai görevimize tamamen bağlıyız: savaşı kazanmak."
 AST_weekly_stability_tt:0 " Haftalık İstikrar: §G+1.00%§!"
 AST_well-being_of_the_community:0 "Toplumun Refahı"
 AST_well-being_of_the_community_desc:0 "Yaşam ve aileye dair Hristiyan idealleri Avustralya halkı tarafından yüksek değer görmelidir. Ancak, geçmiş yıllardaki düşük doğum oranlarıyla, bu ideallerin yeterince saygı görmediği inkar edilemez. Toplumun refahı için, aile yaşamını teşvik eden bir kampanya başlatacağız."
 AST_westward_battles:0 "Batı Muharebeleri"
 AST_westward_battles_desc:0 "Faşist güçler batıya hükmediyor ve hayatta kalmamızın dokusunu tehdit ediyor. Artık Komintern ile hizalandığımıza göre, savaşı onlara taşımalı ve inşa ettiğimiz işçi ütopyasını yok etmek isteyenlere karşı durmalıyız."
 AST_within_reach:0 "Erişim Dahilinde"
 AST_within_reach_desc:0 "Çok yakın, ama bir o kadar da uzak. Avustralya çok kaynak zengini bir ulustur ve eğer biraz daha derine kazarsak, ayaklarımızın altında anlatılmamış bir zenginlik yatar. Altyapımızın genişlemesiyle, uzak madenler bile erişilebilir hale geldi ve mineral zenginliğiyle sürdürülen bir Avustralya refahı döneminin eşiğindeyiz."
 AST_womens_armed_services:0 "Kadın Silahlı Kuvvetleri"
 AST_womens_armed_services_desc:0 "Şiddetli muhalefete rağmen, kadın silahlı kuvvetlerinin oluşumu devam edecektir. Cinsiyetine bakılmaksızın, [AST.GetName]'i saldırganlara karşı savunmak için her yardım eli memnuniyetle karşılanacaktır. İşe alım ve eğitimi teşvik etmek için, kuvvetlerin direktörlerinin seçimi büyük önem taşımaktadır."
 AST_wool_agreement:0 "Yün Anlaşması"
 AST_wool_agreement_desc:0 "Yün, Avustralya'nın en büyük ticari ürünlerinden biri olduğundan, ihracatı sadece karlara katkıda bulunmakla kalmaz, aynı zamanda ithalatçı ülkelerle ilişkileri de geliştirir. Britanya ise tamamını istiyor, kısmen askerlerinin üniformaları için kullanmayı, kısmen de yün sıkıntısı çeken güçlerle müzakerelerde kullanmayı amaçlıyor. Britanya'nın taleplerine boyun eğeceğiz."
 AST_workers_defence_corps_sparks_anew:0 "İşçi Savunma Birlikleri Yeniden Kıvılcımlanıyor"
 AST_workers_defence_corps_sparks_anew_desc:0 "İşçi Savunma Birlikleri orijinal olarak grevleri ve grev gözcülüğü hatlarını savunmak için kuruldu. Yeni Muhafız (New Guard) gibi grupların artan saldırganlığıyla, daha iyi haklar ve fırsatlar için protesto edenleri savunmak adına yeniden bir araya getirildi."
 AST_workers_educational_association:0 "İşçi Eğitim Derneği"
 AST_workers_educational_association_desc:0 "İşçi Eğitim Derneği, eğitimi çalışan insanlar için erişilebilir kılmaya adanmış uluslararası bir kuruluştur. Kendi şubemizi kurmalıyız, çünkü fırsat eşitliğinin gerçeği sınıfta başlar."
 AST_world_peace:0 "Dünya Barışı"
 AST_world_peace_desc:0 "Savaşa ve Faşizme Karşı Hareketi, özellikle İspanya İç Savaşı sırasında Almanya ve İtalya'daki Faşist hareketin kötülüklerini ortaya çıkaran 'Dünya Barışı' adlı bir dergi üretmek için çok çalıştı. İçindeki makaleler tarafından teşvik edilen gönüllüler, Faşizme karşı savaşa katılmak için hevesle arayış içindeler."
 AST_yeramba:0 "Yeramba"
 AST_yeramba_desc:0 "Sentinel gibi Avustralya yapımı araçların başarısının üzerine inşa ederek, cephaneliğimize güçlü bir yeni katkı olan Yeramba ile bir sonraki adımı attık. Bir tank şasisine monte edilmiş 25 pound'luk bir top, düşmanlarımıza karşı mobil, yıkıcı bir ateş gücü sunuyor."
