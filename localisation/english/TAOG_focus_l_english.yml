 HOL_prepare_for_our_return_taog_desc:0 "$HOL_prepare_for_our_return_desc$"
 HOL_taog_guarantee_colonial_loyalty:0 "Sömürge Sadakatini Garanti Et"
 HOL_taog_guarantee_colonial_loyalty_desc:0 "Adalar'da milliyetçilik yükselişte ve başka bir devrimin hazırlık aşamasında olduğu açık. 1927'de karşılaştığımız devrim kolaylıkla bastırılmış olsa da, kaynaklarımız çok daha hazırlıklı bir devrimci grupla karşı karşıya olabileceğimizi söylüyor. Belki Soetardjo'nun barışçıl milliyetçi hareketine bazı tavizler verirsek sivillerin dikkatini devrimden uzaklaştırıp Soetardjo'ya çekebiliriz?"
 HOL_taog_guarantee_colonial_loyalty_tt:0 "§W[INS.GetNameDef]'in devrim yaşamayacağını garanti eder.§!\n[INS.GetNameDefCap] barışçıl bir şekilde bağımsızlık ilan etmeye çalışacak. Bu durum, koloniye yoğun yatırım gerektiren §Y$INSHOL_industrialized_colony$§! milli hedefi tamamlanarak durdurulabilir."
 HOL_the_east_indies_war_machine_taog:0 "$HOL_the_east_indies_war_machine$"
 HOL_the_east_indies_war_machine_taog_desc:0 "$HOL_the_east_indies_war_machine_desc$"
 HOL_the_western_possessions_taog:0 "$HOL_the_western_possessions$"
 HOL_the_western_possessions_taog_desc:0 "$HOL_the_western_possessions_desc$"
 INSHOL_agricultural_subsidies:0 "Tarım Sektörünü Özelleştir"
 INSHOL_agricultural_subsidies_desc:0 "Çeşitli büyüklüklerde özel mülkiyetli çiftliklerin kurulmasına izin vererek, yetersiz finanse edilen kırsal bölgelerdeki altyapı gelişimini hızlandırabilir ve aynı zamanda hükümet gelirini artırabiliriz. Bunu başarmak için, bu çiftliklerden elde edilen tüm vergi gelirlerinin önce Adalar'dan geçmek yerine doğrudan Hollanda'ya gönderildiği yapılandırılmış bir vergi çerçevesi oluşturacağız."
 INSHOL_ai_pyrotechnische:0 "Artillerie Inrichtingen Piroteknik"
 INSHOL_ai_pyrotechnische_desc:0 "Artillerie Inrichtingen'in Doğu Hint Adaları'ndaki üretim tesislerinin genişletilmesine devam ederek, Artillerie Inrichtingen'in piroteknik iştirakinin bir Doğu Hint Adaları bölümünün kurulmasını finanse etmeliyiz."
 INSHOL_artillerie_inrichtingen:0 "Artillerie Inrichtingen"
 INSHOL_artillerie_inrichtingen_desc:0 "Artillerie Inrichtingen, 250 yılı aşkın süredir Hollanda'da top ve diğer silahları üretiyor ve birkaç on yıldır Adalar'da faaliyet gösteriyor. Adalar'da yeni üretim tesisleri açarak üretim yeteneklerini genişletmek, KNIL'in yeteneklerini önemli ölçüde artırırken, yeni işler yaratarak yetersiz finanse edilen bölgelerin ekonomisini güçlendirecektir."
 INSHOL_australian_divisions:0 "Cava'ya Avustralya Piyadeleri Gönder"
 INSHOL_australian_divisions_desc:0 "Londra-Batavya Anlaşması uyarınca, Britanya'nın talep ettiğimizde Endonezya'ya Avustralya üzerinden ek tümenler göndermesi gerekiyor, çünkü Avustralya'nın Adalar'a yakınlığı onları Adalar'ın dışında bir askeri üsse ev sahipliği yapmak için mükemmel adaylar haline getiriyor."
 INSHOL_autonomous_dominion:0 "[GetYear] Soetardjo Yasası"
 INSHOL_autonomous_dominion_desc:0 "Soetardjo dilekçesinin şartlarının geçerli olması için karşılamamız gereken 'kendi kendine yeterlilik' konusundaki makul olmayan Hollanda tanımına rağmen, Endonezya'nın bağımsızlık arzusu bu şartları karşılamayı başaracak kadar güçlü. Anlaşma uyarınca, Hollanda tacından tam ve koşulsuz bağımsızlığımızı ilan edeceğiz."
 INSHOL_bandung_aircraft_facility:0 "Bandung Uçak İmalat Tesisi"
 INSHOL_bandung_aircraft_facility_desc:0 "Taslaklar ve üretim sırları yararlı olsa da, onlardan uçak inşa edene kadar işe yaramazlar. ML-KNIL'in mevcut ihtiyaçlarını karşılamak için Bandung'da yeni uçak tesisleri açacağız."
 INSHOL_bandung_aircraft_facility_tt:0 "§YBatı Java:§!\n     Tamamlanan her ön koşul milli hedefi için §G1§! İnşaat Yuvası ve §G1§! §YAskeri Fabrika§! ekleyin."
 INSHOL_bangka_production_lines:0 "Bangka Üretim Hatları"
 INSHOL_bangka_production_lines_desc:0 "Bangka Projesi'nin bir sonucu olarak Bangka'nın altyapısının katlanarak gelişmesi, bu bir zamanlar küçük, çoğunlukla önemsiz olan adayı yeni endüstriyel projeler için mükemmel bir site haline getirdi. Adanın yoğun yolları, demiryolları ve limanları nedeniyle diğer yerlere inşa etseydik olacağından daha verimli çalışacak olan Bangka'da yeni bir silah fabrikası inşa ederek KNIL'i güçlendirme fırsatımız var."
 INSHOL_batavia_storm_operation:0 "Batavya'ya Saldır"
 INSHOL_begin_negotiations_soetardjo:0 "Soetardjo ile Müzakerelere Başla"
 INSHOL_begin_negotiations_soetardjo_desc:0 "Soetardjo'nun özerklik dilekçesi umut verici ve Milliyetçiler ile Sadıklar arasında uzlaşma fırsatı veriyor. Partisiyle resmi müzakerelere başlamalıyız."
 INSHOL_bio_pharma:0 "Biyo İlaç"
 INSHOL_bio_pharma_desc:0 "Adalar ilaç endüstrisini genişletmek, yaralı askerlerin yeterli tedavi almasını ve güvenli bir şekilde iyileşmesini sağlamak için KNIL'i reforme etmede atılacak bir sonraki mantıklı adımdır. Adalar'daki kinin yaygınlığı, bu projenin maliyetini normalden önemli ölçüde düşürür."
 INSHOL_borneo_and_the_grote_oost:0 "$HOL_borneo_and_the_grote_oost$"
 INSHOL_borneo_and_the_grote_oost_desc:0 "$HOL_borneo_and_the_grote_oost_desc$"
 INSHOL_coffee_plantations:0 "Kahve Plantasyonları"
 INSHOL_coffee_plantations_desc:0 "Doğu adalarında daha fazla devlet arazisi elde etmeye odaklanmalıyız. Bu araziyi Kahve plantasyonları inşa etmek için kullanabiliriz."
 INSHOL_comite_rijkseenheid:0 "Comité Rijkseenheid"
 INSHOL_comite_rijkseenheid_desc:0 "Adalar'da bayrak indiriliyor ve insanlar sadece izliyor. Buna izin veremeyiz, Endonezya Yönetimi'ni Hollanda halkının devrimin durdurulmasını istediğine ikna etmeliyiz!"
 INSHOL_continue_exclusive_rights:0 "De Javasche Bank İçin Münhasır Haklar"
 INSHOL_continue_exclusive_rights_desc:0 "Doğu Hint Adaları Guldeni büyük buhran sırasında değerinin çoğunu kaybetti ve ekonomik büyümemiz durma noktasına geldi. 1922'ye kadar sahip olduğu münhasır basım haklarını Cava Bankası'na vererek Guldeni stabilize etmeyi deneyebiliriz."
 INSHOL_cruisers:0 "Kruvazörler"
 INSHOL_cruisers_desc:0 "Zırhlısı olmayan bir filo, ağırlığını kruvazörlerine vermek zorundadır. Güçlü bir kruvazör filosu inşa etmek, [ROOT.GetAdjective] donanmasına adalar arasındaki uzun mesafelerde devriye gezebilecek ve sularımıza giren her türlü akıncıya karşılık verebilecek güçlü bir çekirdek kazandırır."
 INSHOL_democracy:0 "Demokratik bir Endonezya"
 INSHOL_democracy_desc:0 "Volksraad hayatına bir yarım önlem, temsil görünümü sunarken özünü saklayan, dikkatlice sınırlandırılmış yetkilere sahip bir danışma organı olarak başladı. Üreticilerinden daha fazla büyüdü. Meclis, temsil ettiğini iddia ettiği halk tarafından seçilen üyelerle ve bir zamanlar onu kısa bir tasmada tutan hükümete bağlayıcı kararlarla, gerçek bir yasama organı olarak yeniden oluşturulacaktır."
 INSHOL_destroyers:0 "Muhripler"
 INSHOL_destroyers_desc:0 "Daha ağır savaş gemilerimiz, kendilerini koruyacak eskort gemileri olmadan takımadaların dar denizlerinde görev yapamaz. [ROOT.GetAdjective] donanması, modern muhripler inşa ederek nakliye hatlarını koruyabilir ve boğazlardaki torpido teknelerini uzaklaştırabilir."
 INSHOL_develop_bombers:0 "Yeni Bombardıman Uçakları Geliştir"
 INSHOL_develop_bombers_desc:0 "Batavyalı mühendisleri, Fokker'ın bombardıman uçağı üretimini ilk elden incelemeleri için Amsterdam'a göndereceğiz ve yakından korunan üretim sırlarına erişim sağlayacağız. Adalar'da modern bir yerli bombardıman uçağı endüstrisi kurmak için gereken bilgi ve teknik uzmanlıkla dönecekler."
 INSHOL_develop_fighters:0 "Yeni Avcı Uçakları Geliştir"
 INSHOL_develop_fighters_desc:0 "Batavyalı mühendisleri, Fokker'ın avcı uçağı üretimini ilk elden incelemeleri için Amsterdam'a göndereceğiz ve yakından korunan üretim sırlarına erişim sağlayacağız. Adalar'da modern bir yerli avcı uçağı endüstrisi kurmak için gereken bilgi ve teknik uzmanlıkla dönecekler."
 INSHOL_development_loans_netherlands:0 "Hollanda'dan Kalkınma Kredileri"
 INSHOL_development_loans_netherlands_desc:0 "Sanayileşme çabamızı hızlandırmak için Hollandalı şirketlerden kredi alabiliriz. Düşük faiz oranlarını garanti etmek için gelişmekte olan bir koloni olarak konumumuzu kullanacak olsak da, yine de faiz ödemek zorunda kalacağız."
 INSHOL_divert_civilian_to_navy:0 "Sivil ve Ordu Harcamalarını Donanmaya Aktar"
 INSHOL_divert_civilian_to_navy_desc:0 "Dünyanın mevcut durumuyla birlikte, denizden istila riski her zamankinden daha yüksek. Tutumlu olmayı göze alamayız, hükümetin tüm sektörlerinden gelen ödenekleri donanmaya aktarmalıyız."
 INSHOL_domestic_ship_production:0 "Yerli Gemi Üretimi"
 INSHOL_domestic_ship_production_desc:0 "Donanmamızın komşularımıza karşı durabilmesini istiyorsak, yerli gemi üretimini artırmaya başlamalıyız."
 INSHOL_dutch_east_indies:0 "Doğu Hint Adaları"
 INSHOL_dutch_east_indies_desc:0 "Koloni yaklaşık 500 yıl önce kuruldu ve o zamandan beri birçok şekil aldı. Dünya hızla değişiyor ve şimdi atacağımız adımlar Hollanda-Endonezya ilişkilerinin geleceğini belirleyecek."
 INSHOL_east_indies_artillery:0 "Doğu Hint Adaları Topçu Üretimi"
 INSHOL_east_indies_artillery_desc:0 "Java'da topçu üretim tesisleri açmak, askeri çabamız için dış ticarete daha az güvenmemizi sağlayacaktır."
 INSHOL_east_indies_cruiser_manufacturing:0 "Doğu Hint Adaları Kruvazör Üretimi"
 INSHOL_east_indies_cruiser_manufacturing_desc:0 "Kruvazör gemilerimizi doğrudan Hollandalılardan sipariş etmek yerine kendimiz üretmek, Japon tehdidini göz önüne alarak gerekli bir çaba olan gerçek bir Donanma kurmanın ilk adımıdır."
 INSHOL_east_indies_fokker_division:0 "Bir Doğu Hint Adaları Fokker Bölümü Oluştur"
 INSHOL_east_indies_fokker_division_desc:0 "Fokker, Hint Adaları Hava Kuvvetleri tarafından, Hint Adaları Hava Kuvvetleri'ne öncelik veren özel bir yan kuruluş oluşturmayı düşünmeye değecek kadar lisanslanıyor."
 INSHOL_east_indies_investments:0 "Doğu Hint Adaları Yatırımları"
 INSHOL_east_indies_investments_desc:0 "İyi bir efendi, kolonilerinin kalkınmasına yatırım yapandır. Hint Adaları'nın ekonomik kalkınmasına yatırım yapmak bizim çıkarımızadır ve Koloni vatandaşları için faydalıdır."
 INSHOL_east_indies_navy:0 "Doğu Hint Adaları Donanması"
 INSHOL_east_indies_navy_desc:0 "[INS.GetNameDefCap] resmi bir donanmadan yoksun olduğundan, koloninin savunması Hollanda'nın sorumluluğundadır. Avrupa ve Asya'da artan gerilimle birlikte bu durum bu şekilde işlemeye devam etmeyecektir. Kendimize ait bir [INS.GetAdjective] donanması kurma yolunda ilk adımı atmalıyız."
 INSHOL_east_indies_student_exchange:0 "Doğu Hint Adaları Öğrenci Değişim Programı"
 INSHOL_east_indies_student_exchange_desc:0 "Endonezyalıların üniversitelerimizde okumak için Hollanda'ya taşınabileceği bir sistem oluşturmak, Hollanda ve Hint Adaları ekonomisi için önemli bir kazanç olabilir."
 INSHOL_eastern_conscription:0 "Yardımcı Birlikleri Oluştur"
 INSHOL_eastern_conscription_desc:0 "Java ve Madura'da yerel prens yöneticileri tarafından kontrol edilen çeşitli yerli yardımcı birlikleri var. Bu vahim zamanlarda, yerel yöneticilerle bu tümenlerin otoritemiz altında olacağı bir anlaşma müzakere edebiliriz."
 INSHOL_eastern_development_fund:0 "Doğu Adaları için Kalkınma Fonu"
 INSHOL_eastern_development_fund_desc:0 "Koloni arazisinin çoğunu görmezden gelerek Java ve Sumatra'ya çok fazla yatırım yapıyoruz. Gelecekteki sanayileşmeye izin vermek için Doğu'daki altyapıyı geliştirmeye taahhüt etmeliyiz."
 INSHOL_economic_integration:0 "Ekonomik Entegrasyon"
 INSHOL_economic_integration_desc:0 "Hollanda Doğu Hint Adaları, Kraliçe'nin, Başbakan'ın ve Genel Vali'nin istikrarlı liderliği ile refahı güvence altına alınmış İmparatorluğumuzun parlayan mücevheridir. Bu istikrar, yalnızca düzensizlik ve gerileme getirecek olan pervasız bağımsızlık çağrılarıyla tehlikeye atılmamalıdır. Hollanda ve Adalar'ın ekonomilerini daha sıkı bağlayarak sürekli istikrar ve büyüklüğü garanti altına alacağız."
 INSHOL_education_reforms:0 "Eğitim Reformları"
 INSHOL_education_reforms_desc:0 "Doğu Hint Adaları'ndaki birçok vatandaş eğitim alma yeteneğinden yoksundur ve ortaokuldan mezun olan çok az kişi vardır. Doğu Hint Adaları'nın zengin bir sanayileşmiş devlet haline gelmesini istiyorsak, eğitimin nüfus için düzgün bir şekilde erişilebilir olmasını sağlamalıyız."
 INSHOL_elevate_elite_infantry:0 "Depot Speciale Troepen"
 INSHOL_elevate_elite_infantry_desc:0 "Büyük savaş stratejilerine sonsuza kadar güvenemeyiz, yeni teknolojilere uyum sağlamalı ve geride kalmadığımızdan emin olmalıyız. Her türlü ortamı savunmaya hazır birkaç seçkin piyade tümeni kurmalıyız."
 INSHOL_emergency_dockyard_construction:0 "Acil Tersane İnşası"
 INSHOL_emergency_dockyard_construction_desc:0 "Deniz istilası tehdidi hafife alınamaz, deniz savunmamıza en büyük önceliğimizi vermeliyiz."
 INSHOL_emergency_naval_purchases:0 "Acil Deniz Kuvvetleri Alımları"
 INSHOL_emergency_naval_purchases_desc:0 "Kıyılarımız güvensiz ve yetersiz savunuluyor. Zaman çok önemli, daha güçlü bir donanma elde etmeliyiz yoksa kesinlikle yok olacağız. Özel şirketlerden borç alarak gemiler satın alacak ve onları deniz muhriplerine dönüştüreceğiz."
 INSHOL_emergency_powers_gov_general:0 "Genel Vali için Acil Durum Yetkileri"
 INSHOL_emergency_powers_gov_general_desc:0 "Devam eden savaş, Hint Adaları'ndaki tüm kararların önceden Hollanda'dan geçmesi gerektiğinde mümkün olmayan, gecikmeksizin zor kararların alınmasını gerektirir. [INS.GetLeader]'e gecikmeden hareket edebilmesi için acil durum yetkisi vermeliyiz."
 INSHOL_encourage_further_investment:0 "Daha Fazla Yatırımı Teşvik Et"
 INSHOL_encourage_further_investment_desc:0 "Volksraad'da kabul edilen şartlar siyasi sorunu şimdilik çözdü ve Hollanda sermayesi bunu not etti. Tarifeler kolaylaştırılacak, garantiler genişletilecek ve Amsterdam ile Rotterdam'daki ticaret odalarına takımadaların iş için açık kaldığı konusunda güvence verilecektir. Eski düzenleme altında karlı olan şey, yeni düzenleme altında da karlı olacaktır."
 INSHOL_end_to_bloodshed:0 "İki Devletli Çözüm"
 INSHOL_end_to_bloodshed_desc:0 "Bu çatışma her iki tarafta da çok az ilerleme ile çok uzun sürdü, her geçen gün daha fazla hayat kaybedildi. Kimse bunun devam etmesini istemiyor, Hollandalı liderlerle müzakere masasında tartışma zamanımız geldi."
 INSHOL_establish_the_princely_council:0 "Prenslik Konseyi'ni Kur"
 INSHOL_establish_the_princely_council_desc:0 "Takımadaların sultanları ve racaları, Batavia'daki hiçbir meclisin sahip olmadığı sadakatlere hükmeder. Sarayları Şirket'ten, onu takip eden Cumhuriyet'ten daha eskidir. Prenslik hanedanlarından oluşan resmi bir konsey, bu hükümdarlara yeni ulusun masasında bir yer verecek ve yetkilerini bizimkine bağlayacaktır."
 INSHOL_establish_vk_knil:0 "VK-KNIL'i Kur"
 INSHOL_establish_vk_knil_desc:0 "KNIL için bir Kadın Gönüllü Birliği kuracağız. Katkıları, lojistiğimizi ve iletişimimizi geliştirmede önemli bir rol oynayacak."
 INSHOL_eventual_autonomy:0 "Nihai Özerkliği Kabul Et"
 INSHOL_eventual_autonomy_desc:0 "Endonezya'nın bağımsızlık arzusu güçlü ve yavaşlamıyor. Hint Adaları için nihai özerkliği kabul edeceğiz, ancak sadece koloni kendi kendini idame ettirebileceğini kanıtladıktan ve demokratik idealleri savunmaya devam ettikten sonra."
 INSHOL_eventual_autonomy_req_tt:0 "En az §Y4§! Volksraad görevini başarıyla tamamladı"
 INSHOL_expand_shell:0 "Shell'in Altyapısını Genişlet"
 INSHOL_expand_shell_desc:0 "Shell giderek ekonomimizin daha büyük bir parçası haline geliyor. Shell'in ihracat kapasitesine ayak uydurmak için Hint Adaları'ndaki petrol altyapısını genişletmemiz gerektiği açıktır."
 INSHOL_flag_will_fly_again:0 "Bayrak Yeniden Dalgalanacak"
 INSHOL_flag_will_fly_again_desc:0 "Hollanda bayrağı yüzyıllardır Adalar'da dalgalanıyor, indirilmesine izin vereceğimiz bir dünya yok. Mücevher kolonimizi korumak tank ve bombardıman uçağı göndermeyi gerektiriyorsa, gönderilecekler!"
 INSHOL_flag_will_fly_again_tt:0 "§YDevrim sona erdiğinde, ruh hali kaldırılacak ve kural değişiklikleri geri alınacak.§!"
 INSHOL_foundations_of_defense:0 "$HOL_the_foundations_of_defense$"
 INSHOL_foundations_of_defense_desc:0 "$HOL_the_foundations_of_defense_desc$"
 INSHOL_franco_dutch_accord:0 "Fransız-Hollanda Anlaşması"
 INSHOL_franco_dutch_accord_desc:0 "Askerlerimiz Cumhuriyet milislerinden daha iyi teçhizata sahip ve daha iyi organize edilmiş olsalar da, ezici sayıları çatışmayı aleyhimize çevirdi. Zaferi garantilemek için dış desteğe ihtiyacımız var, hem de çoğunun verebileceğinden daha fazlasına. Pasifik'teki varlıklarını genişletmek için onlara Adalar'da toprak teklif edersek Fransa müdahale etmeye istekli olabilir."
 INSHOL_fund_ml_knil:0 "ML-KNIL'i Fonla"
 INSHOL_fund_ml_knil_desc:0 "Dünyanın ordularına ayak uydurmak istiyorsak, kendimize ait düzgün bir hava kuvveti inşa etmeliyiz, aksi takdirde önemli bir dezavantajlı durumda oluruz."
 INSHOL_hawk_75a7:0 "Hawk 75a-7"
 INSHOL_hawk_75a7_desc:0 "Amerikan Hawk 75A-7 avcı uçağı, uygun fiyatlı ve güçlü olmasıyla Hint Adaları için mükemmel bir uçak. Hava Kuvvetlerimizde çok ihtiyaç duyulan iyileştirmeleri yapmak için üreticiyle bir anlaşma yapabiliriz."
 INSHOL_hybrid_navy:0 "Hibrit Bir Donanma"
 INSHOL_hybrid_navy_desc:0 "Donanmamız sadece [HOL.GetNameDef]'in pasifik filosunu devralmaya güvenemez, kendi gemilerimizi üretmeye başlamalıyız, aksi takdirde tek bir hata tüm deniz ikmalimizi kesebilir."
 INSHOL_import_lumber:0 "Kereste İthal Et"
 INSHOL_import_lumber_desc:0 "Adalar'daki büyüyen tarım sektöründe fiyat kontrolleri zorunlu tutacağız; böylece ulusun tüm kereste ihtiyacını, başka hiçbir hükümetin eşleşemeyeceği fiyatlarla Adalar'daki plantasyonlardan ithal edecek ve kereste üzerinde bir hükümet tekeli kuracağız."
 INSHOL_import_sugar:0 "Şeker İthal Et"
 INSHOL_import_sugar_desc:0 "Adalar'daki büyüyen tarım sektöründe fiyat kontrolleri zorunlu tutacağız; böylece ulusun tüm şeker ihtiyacını, başka hiçbir hükümetin eşleşemeyeceği fiyatlarla Adalar'daki plantasyonlardan ithal edecek ve şeker üzerinde bir hükümet tekeli kuracağız."
 INSHOL_increase_esclation_placeholder:0 "Hızlı Tırmanış"
 INSHOL_increase_esclation_placeholder_desc:0 "Milislerimiz birçok hayati limanı, şehri ve endüstri merkezini kontrol altına aldı. Hollanda'nın harekete geçmesini beklemeye devam etmeyeceğiz, büyük bir askeri taarruz için kendimiz çağrıda bulunacağız!"
 INSHOL_increase_esclation_placeholder_tt:0 "Yerel ateşkesleri müzakere etmek ve Cava'yı işgal etmek için §Ysüreyi artırmak§! amacıyla bir §YKarar§! açar."
 INSHOL_increase_funding_for_tix:0 "T.IX Uçak Projesi için Finansmanı Artır"
 INSHOL_increase_funding_for_tix_desc:0 "Fokker'daki mühendisler, Hint Adaları Hava Kuvvetleri tarafından kullanılan modası geçmiş modellerin yerini alacak yeni bir çift motorlu bombardıman uçağı geliştiriyor. Bu projenin bütçesi çok düşük ve büyük olasılıkla çok uzun bir süre tamamlanamayacak. İlerlemeyi büyük ölçüde hızlandırmak için fonlarını artırabiliriz."
 INSHOL_increase_rubber_taxes:0 "Kauçuk Vergilerini Artır"
 INSHOL_increase_rubber_taxes_desc:0 "Hint Adaları'ndaki birçok kauçuk şirketi, Koloni kaynaklarını kullanarak büyük bir servet elde ediyor. Bu operasyonlara ağır bir vergi koymamız sadece adil olandır."
 INSHOL_indian_divisions:0 "Britanya Hindistan Ordusu Tümenleri"
 INSHOL_indian_divisions_desc:0 "Britanya kendi adamlarını Adalar'a göndermeye pek istekli olmasa da, onları Hint tümenlerini göndermeye ikna etmek çok daha kolaydır, özellikle de Batavya'ya yakınlıkları nedeniyle."
 INSHOL_indonesian_cheap_labor:0 "Endonezya Ucuz İş Gücü"
 INSHOL_indonesian_cheap_labor_desc:0 "$CONGO_cheap_labor_desc$"
 INSHOL_industrialized_colony:0 "Sanayileşmiş Koloni"
 INSHOL_industrialized_colony_desc:0 "Bir zamanlar mütevazı bir koloni olan Doğu Hint Adaları, tüm Asya'nın en sanayileşmiş, zengin bölgelerinden biri haline geldi. Bu, Hollanda ve insanlık tarihinde anıtsal bir ana işaret ediyor. Çabalarımız meyvelerini verdi ve kolonimizin kalkınmasına yatırım yapmaya devam edeceğiz ve Hollanda'yı bir kez daha küresel bir güç olarak yeniden kuracağız."
 INSHOL_infantry_training_in_borneo:0 "Borneo'da Piyade Eğitimi"
 INSHOL_infantry_training_in_borneo_desc:0 "Doğu Hint Adaları yoğun ormanlar, sarp dağlar ve affetmez arazi ile tanımlanır. Öncelikli olarak Cava'da üslenen askerlerimiz bu koşullarda savaşmaya hazırlıksızdır. Askeri eğitimi Cava'nın ötesine genişletmeli ve daha sert ortamlarda pilot egzersizleri yapmalıyız. Dünyada Borneo'nun ormanları ve dağları ile yarışabilecek çok az yer var, bu da onu dünya standartlarında korucular yetiştirmek için mükemmel bir nokta yapıyor."
 INSHOL_instigate_infighting:0 "Cumhuriyet İçinde İç Çatışmayı Tetikle"
 INSHOL_investments_in_civ_railways:0 "Sivil Demiryollarına Yatırımlar"
 INSHOL_investments_in_civ_railways_desc:0 "Adalar halkının desteğini kazanmak, sivil altyapıya yatırım yapmayı gerektirir. Şu anda demiryollarımız öncelikli olarak yük taşımacılığı için kullanılıyor. Cava ve Sumatra'daki mevcut demiryollarımızda çalışacak yolcu trenleri satın almalıyız."
 INSHOL_investments_in_civ_railways_tt:0 "Eğer [HOL.GetFlag]§Y[HOL.GetName]§! şu milli hedefi tamamlarsa:\n         ([INS.GetFlag]§Y[INS.GetName]§!: §Y£autonomy_texticon -250.00§! ekle)\n   Eğer [INS.GetFlag]§Y[INS.GetName]§! şu milli hedefi tamamlarsa:\n         §Y£autonomy_texticon 250.00§! ekle"
 INSHOL_invite_phillipines:0 "Maphillindo'yu Öner"
 INSHOL_invite_phillipines_desc:0 "Birliğimizin pek çok halkı farklı diller konuşuyor ve farklı gelenekleri sürdürüyor, ancak neredeyse hepsi köklerini Malay dünyasına dayandırıyor. Birlik devletimizi, Filipinler'i üye devlet olarak davet ederek bir Pan-Malay konfederasyonuna dönüştürmeliyiz. Bir zamanlar önemsiz birkaç koloni olanlar, şimdi Güneydoğu Asya'nın bölgesel gücü olarak dimdik ayakta duracaklar."
 INSHOL_java:0 "$HOL_java$"
 INSHOL_java_desc:0 "$HOL_java_desc$"
 INSHOL_java_factories:0 "Cava'da Silah Fabrikaları Aç"
 INSHOL_java_factories_desc:0 "Basit olsa da, sadece daha fazla silah fabrikası inşa etmenin ordunun gücünü artırmaya büyük katkısı olduğu inkar edilemez. Koloninin endüstriyel güç merkezi olarak Cava, onları inşa etmek için bariz bir yerdir."
 INSHOL_knil_engineers:0 "İstihkam Birliği"
 INSHOL_knil_engineers_desc:0 "Tüm çabalarımızı piyade ve tüfek üretimine odaklamamalı, lojistik ve iletişimin savaş kazanmada önemli bir rol oynadığını unutmamalıyız. Ordumuzun kötü lojistik tarafından engellenmemesini sağlamak için mühendisler yetiştirmeli ve Batavyalı meslek okullarını finanse etmeliyiz."
 INSHOL_license_dutch_weapon_blueprints:0 "Hollanda Silah Taslaklarını Lisansla"
 INSHOL_license_dutch_weapon_blueprints_desc:0 "Tüm bir yerli imalat sürecine yatırım yapmak ve kendi teknoloji tasarımlarımızı yaratmak yerine, silah taslaklarını satın almak için Hollanda şirketleriyle işbirliği yapmalıyız."
 INSHOL_linggadjati_agreement:0 "Ateşkes Anlaşmalarının Müzakeresi"
 INSHOL_linggadjati_agreement_desc:0 "Cava'yı işgal etmek zor oldu ve yönetimimiz istikrarsızlaşıyor. Geri çekilmeli ve tüm Cumhuriyetin düşme riskini almamak için savunmaya geçmeliyiz. Hollanda ile yerel ateşkesler müzakere etmeli, Cava'ya tekrar odaklanmadan önce güçlerimizi yeniden organize etmemize olanak sağlamalıyız."
 INSHOL_london_batavia_accord:0 "Londra-Batavya Anlaşması"
 INSHOL_london_batavia_accord_desc:0 "Askerlerimiz Cumhuriyet milislerinden daha iyi teçhizata sahip ve daha iyi organize edilmiş olsalar da, ezici sayıları çatışmayı aleyhimize çevirdi. Zaferi garantilemek için dış desteğe ihtiyacımız var, hem de çoğunun verebileceğinden daha fazlasına. [ENG.GetNameDefCap], Malaya'daki varlıkları nedeniyle ilgi duyabilir. Eğer karşılığında bir şey teklif edersek ikna edilebilirler mi?"
 INSHOL_loyalty_to_crown:0 "Taca Sadakat"
 INSHOL_loyalty_to_crown_desc:0 "Doğu Hint Adaları birçok şeydir, ancak her şeyden önce biz sadık bir Hollanda kolonisiyiz. Kraliçe Wilhelmina bize zafer yolunda rehberlik edecek. Milliyetçiliğin yaklaşık 500 yıllık tarihimizi sona erdirmesine izin vermemeli ve Taca olan mutlak sadakatimizi teyit etmeye devam etmeliyiz."
 INSHOL_manado_military_academy:0 "Makassar Askeri Akademisi"
 INSHOL_manado_military_academy_desc:0 "Cava dışında bir askeri akademi kurmak, doğu adalarında askerlik hizmetini uygulanabilir kılarak insan gücü eksikliğimizi önemli ölçüde hafifletmeye yardımcı olacaktır. Doğu Hint Adaları'nın ortasında yer alan Makassar, bunun için mükemmel bir konumdur."
 INSHOL_marines:0 "Deniz Piyadeleri"
 INSHOL_marines_desc:0 "Yeni Donanma bünyesinde özel bir Hint Adaları Deniz Piyade Kolordusu kurmalı ve eğitimdeki deniz piyadelerini Hollanda gemilerinde tecrübe kazanmaları için göndermeliyiz."
 INSHOL_mass_mobilization:0 "Toplu Seferberlik"
 INSHOL_mass_mobilization_desc:0 "İyi teçhizata sahip bir ordu olmadan bu çatışmayı kazanamayız ve Cumhuriyeti ezemeyiz. Endonezya'yı yeniden silahlandırmalı ve finansmanı sivil sektörlerden KNIL'e kaydırmalıyız."
 INSHOL_military_equipment_contracts:0 "Askeri Teçhizat Sözleşmeleri"
 INSHOL_military_equipment_contracts_desc:0 "Hint Adaları, on milyonlarca vatandaşı olan geniş bir takımadadır. Kendimizi savunmak için gerekli endüstriyel kapasiteden çok uzağız. Ancak, dünyanın dört bir yanında ticaret yapmamızı güvence altına alacak kadar kaynağımız var. Dünya çapındaki Demokrasilerle sözleşmeler yaparak sorunumuz çözülebilir."
 INSHOL_modernize_knil:0 "KNIL'i Modernize Et"
 INSHOL_modernize_knil_desc:0 "Düşmana karşı bir avantaj sağladığımızdan emin olarak, Doğu Hint Adaları Ordusu için yeni stratejiler ve doktrinler üzerinde çalışacağız."
 INSHOL_mountaineers:0 "Dağcılar"
 INSHOL_mountaineers_desc:0 "Takımadalarımızın düşmanca arazisinde savaşmaya hazır Dağcılar eğitmeliyiz."
 INSHOL_nationalist_coallition:0 "Bir Milliyetçi Koalisyon"
 INSHOL_nationalist_coallition_desc:0 "Volksraad çok uzun süredir tek bir sesle konuştu ve bu ses çok sessizdi. Dilekçelerin ve sabırlı ertelemelerin zamanı geçti. Meclisin milliyetçi üyelerinden oluşan bir koalisyon, kavgalarını bir kenara bırakacak ve koşulsuz bağımsızlık talep edecektir. Meclis dışından, Hollandalıların bir zamanlar güvenli bir şekilde kenara itildiğini düşündükleri adamlar gibi daha eski sesler tekrar aramızda karşılanacaktır."
 INSHOL_nationalize_dutch_companies:0 "Hollanda Şirketlerini Millileştir"
 INSHOL_nationalize_dutch_companies_desc:0 "Büyük ticaret evleri, nakliye hatları, plantasyon kuruluşları ve bankalar, herkesin hatırlayabildiği sürece Hollanda isimlerini taşıdı. Artık Endonezya isimlerini taşıyacaklar. Kurullar yeniden oluşturulacak, tabelalar indirilecek ve üç yüzyıl boyunca bu adalardan çıkarılan sermaye nihayet adalara ait olacak."
 INSHOL_naval_program:0 "Hollanda-Endonezya Deniz Kuvvetleri Programı"
 INSHOL_naval_program_desc:0 "Doğu Hint Adaları Donanması diğer donanmaların, hatta koloni donanmalarının bile çok gerisinde. Hızlı bir ilerleme sağlamak adına bu yeni donanmanın geliştirilmesine yardım etmek tüm tarafların yararınadır."
 INSHOL_naval_program_rejected_tt:0 "§Y$INSHOL_naval_secondchance$§! milli hedefini açar."
 INSHOL_naval_program_transfer_100_2_tt:0 "§Y[HOL.GetFlag] [HOL.GetNameDefCap]§!, tüm donanmalarını §Y[INS.GetNameDefCap]§!'e transfer edecek."
 INSHOL_naval_program_transfer_100_tt:0 "§Rtüm donanmamızı§! [INS.GetNameDef]'e transfer edin."
 INSHOL_naval_program_transfer_25_2_tt:0 "§Y[HOL.GetFlag] [HOL.GetNameDefCap]§!, deniz kuvvetlerinin §Y%25§!'ini §Y[INS.GetNameDefCap]§!'e transfer edecek."
 INSHOL_naval_program_transfer_25_tt:0 "Deniz kuvvetlerimizin §Y%25§!'ini [INS.GetNameDef]'e transfer edin."
 INSHOL_naval_secondchance:0 "Doğu Hint Adaları Deniz Kuvvetleri Planı"
 INSHOL_naval_secondchance_desc:0 "[HOL.GetNameDef] Donanma üzerindeki kontrolü devretmeyi reddetmiş olsa da, ele geçirilmek istemiyorsak Pasifik'i savunmamız gerekiyor. Teklifimizi kabul ettikleri kadar iyi sonuç vermeyebilir, ancak yeterince iyi bir alternatif bulacağız."
 INSHOL_netherlands_in_exile:0 "Sürgündeki Hollanda"
 INSHOL_netherlands_in_exile_desc:0 "Krallığımızın trajik düşüşü artık bir gerçeklik. Yenilgi duygusuna kapılamayız. Ne olduğunu kabul etmeli ve kurtarabileceklerimize odaklanmalıyız."
 INSHOL_netherlands_indies_air_doctrine:0 "Hollanda-Adalar Hava Doktrini"
 INSHOL_netherlands_indies_air_doctrine_desc:0 "Bizimkine benzer zorluklarla karşılaşan ulusların hava kuvvetlerini inceleyeceğiz ve bu tarihi hataları tekrarlamadan Doğu Hint Adaları'nın gerçeklerine uygun bir doktrin oluşturmak için onların zor kazanılmış deneyimlerinden yararlanacağız."
 INSHOL_netherlands_indonesia_union:0 "Hollanda-Endonezya Birliği"
 INSHOL_netherlands_indonesia_union_desc:0 "[HOL.GetNameDef] ve [INS.GetNameDef] arasında eşit bir birlik devleti kavramı birçok kişiye gülünç geliyor, ancak içinde bulunduğumuz krizle birlikte egemenliğimizi sürdürme şansımızı en üst düzeye çıkarmanın tek yolu gibi görünüyor."
 INSHOL_no_compromise:0 "Taviz Yok, Teslimiyet Yok"
 INSHOL_no_compromise_desc:0 "Hollanda'nın neredeyse sadece Cava'ya yatırım yapmasına neden olan, doğu adalarını görmezden gelen açgözlülüğü, Cava'yı tüm koloninin Aşil topuğu haline getirdi. Bu onların sonu olacak!"
 INSHOL_outsourced_navy:0 "Üretimi Şirketlere Devret"
 INSHOL_outsourced_navy_desc:0 "Zaten yeterince masrafımız var, koloni bütçesinin daha fazlasını donanmaya aktarmaya devam edemeyiz. Üretimi bizim adımıza yürütmeleri için şirketlere ödeme yapabiliriz."
 INSHOL_overallwagen:0 "Overvalwagen"
 INSHOL_overallwagen_desc:0 "Tanklar, Doğu Hint Adaları Ordusu için mutlaka çözüm değildir. Onları üretmek için gereken endüstriyel gücümüz yok ve sert arazi onları niş kılıyor. Endonezya için aradaki boşluğu dolduracak Zırhlı Araçlar inşa etmeye yatırım yapabiliriz."
 INSHOL_padang_port:0 "Padang'da Uluslararası Liman"
 INSHOL_padang_port_desc:0 "Padang'da üretilen kaynaklar, bölgenin büyük konvoyları yönetebilecek tesislerden yoksun olması nedeniyle uluslararası pazarlara ulaşmadan önce Cava üzerinden yönlendirilmelidir. Bu gereksiz sapma tedarik zincirimizi zorluyor ve Sumatra'nın ekonomik potansiyelini sınırlıyor. Padang'da büyük bir kargo limanı inşa ederek bu sapmayı ortadan kaldırabilir ve Padang'daki plantasyonların karlılığını artırabiliriz."
 INSHOL_papua_referendum:0 "Papua Referandumu"
 INSHOL_papua_referendum_desc:0 "Bugün Papua adası Endonezya ve Avustralya arasında bölünmüş durumdadır. Yatırımlarımız ve kalkınma çabalarımız yarısını büyüyen ve müreffeh bir bölgeye dönüştürmüş olsa da, Avustralya idaresindeki bölge ihmal edilmiş ve az gelişmiş durumda kalmıştır. Adanın geleceği halkının ellerinde olmalı ve bu nedenle Papua'nın birleşmesi için resmi bir referandum talep etmeliyiz."
 INSHOL_peg_indies_guilder_to_dutch_guilder:0 "Adalar Guldenini Hollanda Guldenine Sabitle"
 INSHOL_peg_indies_guilder_to_dutch_guilder_desc:0 "Doğu Hint Adaları Guldeni büyük buhran sırasında değerinin çoğunu kaybetti ve ekonomik büyümemiz durma noktasına geldi. En kolay çözüm, Adalar Guldenini çok daha istikrarlı bir para birimi olan Hollanda Guldenine sabitlemektir. Bu aynı zamanda bizi efendimize daha da yakınlaştıracaktır."
 INSHOL_peg_indies_guilder_to_us_dollar:0 "Adalar Guldenini ABD Dolarına Sabitle"
 INSHOL_peg_indies_guilder_to_us_dollar_desc:0 "Doğu Hint Adaları Guldeni büyük buhran sırasında değerinin çoğunu kaybetti ve ekonomik büyümemiz durma noktasına geldi. Adalar Guldenini Hollanda Guldenine sabitleyebilsek de, ABD doları çok daha istikrarlı bir para birimidir. Guldeni Dolar'a sabitlemek ayrıca daha fazla ekonomik bağımsızlığa sahip olmamızı sağlar, öz yönetimi daha ulaşılabilir bir hedef haline getirir."
 INSHOL_princely_authority:0 "Prenslik Otoritesi"
 INSHOL_princely_authority_desc:0 "Bir danışmanlar konseyi yerinde güzel bir şeydir, ancak bu ulusun kuruluşuna isimlerini veren sultanlar bundan daha fazlasını verebilirler. Parlamento, kendi içlerinden birinin diğerlerinin üzerine yükseldiğini görmek isteyenlerin yoluna çıkmayacaktır. Eski saraylar, bu sorunun tekrar kendilerine sorulması için uzun zamandır bekliyorlardı."
 INSHOL_prioritize_dutch_profits:0 "Hollanda Karlarına Öncelik Ver"
 INSHOL_prioritize_dutch_profits_desc:0 "Çabalarımızı ana vatan için karları artırmaya odaklayacağız. Onların ekonomik istikrarı, bir bütün olarak Krallığın iyiliği içindir."
 INSHOL_produce_own_goods:0 "Kendi Mallarımızı Üretelim"
 INSHOL_produce_own_goods_desc:0 "Güvence altına alabileceğimiz çok sayıda kazançlı ticaret anlaşmamız olsa da, kendi üretim hatlarımızı ve askeri endüstriyel şirketlerimizi unutmamalıyız. Yabancı ithalata bağımlılığımızı azaltabilmemiz için söz konusu şirketlere sübvansiyon vermeliyiz."
 INSHOL_propose_malay_unification:0 "Malay Birliğini Öner"
 INSHOL_propose_malay_unification_desc:0 "Endonezya yüzlerce kültüre, dile ve etnik kökene ev sahipliği yapan bir takımadadır. Bazıları benzer olsa da, diğerleri belirgin şekilde farklıdır. Yine de sömürge yönetiminin ortak mücadelesiyle, bir ulus altında birlik bulduk; Endonezya. Belki de boğazın ötesindeki Malaya halkı bizimle aynı tarihi ve özlemleri paylaşırken, bu birliğin neden burada durması gerektiğini kendimize sormalıyız?"
 INSHOL_purchase_american_tanks:0 "Amerikan Tankları Satın Al"
 INSHOL_purchase_american_tanks_desc:0 "Hint Adaları Tank Üretimi için gereken endüstriden yoksun olsa da, bunları Hint Adaları kauçuk endüstrisi tarafından finanse edilerek doğrudan Amerika Birleşik Devletleri'nden satın alabiliriz."
 INSHOL_purchase_british_artillery:0 "İngiliz Topçusu Satın Al"
 INSHOL_purchase_british_artillery_desc:0 "Topçu üretimimizi Birleşik Krallık'a yaptırabilir, böylece diğer teçhizata öncelik verebiliriz."
 INSHOL_rangers:0 "Korucular (Rangers)"
 INSHOL_rangers_desc:0 "Hint Adaları, çeşitli bir çevreye sahip geniş bir takımadadır. Onları savunmaya hazır olduğumuzdan emin olmak için bu sert ortamlarda savaşmaya adapte olmuş Korucular eğitmeliyiz."
 INSHOL_reasserting_control:0 "Endonezya Üzerinde Kontrolü Yeniden Sağla"
 INSHOL_reasserting_control_desc:0 "Bu fırsatçılar altyapımızı yok edip gençliği radikalleştirirken, yüzyıllardır inşa ettiğimiz şeyi mahvetmelerini boş boş izleyemeyiz. Harekete geçmeliyiz!"
 INSHOL_recall_gerardus_johannes_berenschot:0 "General Berenschot'u Geri Çağır"
 INSHOL_recall_gerardus_johannes_berenschot_desc:0 "Gerardus Johannes Berenschot, Milletler Topluluğu'ndaki en yetenekli Generallerden biridir. Kariyerinin çoğunu Hint Adaları'nda geçirdi ancak birkaç yılını Hollanda'da harcadı. Bu vahim zamanlarda, savaş çabalarına yardımcı olması için onu Hint Adaları'na geri çağırmalıyız."
 INSHOL_reduce_land_ownership_taxes:0 "Arazi Sahipliği Vergilerini Azalt"
 INSHOL_reduce_land_ownership_taxes_desc:0 "Çiftliklerin ve işletmelerin gelişimini teşvik etmek için araziye sahip Endonezya vatandaşlarından alınan vergiyi azaltmalıyız."
 INSHOL_reform_knil:0 "KNIL'i Reforme Et"
 INSHOL_reform_knil_desc:0 "Doğu Hint Adaları tüm takımadaları fethettiğinden beri, Hollanda Kraliyet Doğu Hint Adaları Ordusu hareketsiz kaldı ve ciddi bir fon eksikliği var. Dünya çapındaki artan gerilimlerle, Hint Adaları'nı geç olmadan yeniden silahlandırmaya başlamalıyız."
 INSHOL_relocate_our_generals:0 "Ordumuzu Java'ya Taşı"
 INSHOL_relocate_our_generals_desc:0 "Geriye kalan sürgündeki Generaller, Komutanlar ve direnen Askerler, çok geç olmadan [1058.GetName]'e en yüksek öncelikle taşınmalıdır."
 INSHOL_renville_agreement:0 "Renville Anlaşması"
 INSHOL_renville_agreement_desc:0 "Hollanda'nın sergilediği eşi görülmemiş saldırganlık devrime uluslararası dikkatleri çekti, ancak Hollanda ateşkesleri ihlal etmeye ve bizden tepki almaya devam etti. [USA.GetNameDef]'e bir çağrıda bulunmaya çalışmalıyız, eğer onları Endonezya'yı savunmaya ikna edersek, Hollanda'nın geri adım atmaktan başka çaresi kalmayacak."
 INSHOL_reorganize_colonies:0 "Koloniyi Yeniden Organize Et"
 INSHOL_republic_of_indonesia:0 "Endonezya Cumhuriyeti"
 INSHOL_republic_of_indonesia_desc:0 "Hollanda, Soetardjo Dilekçesi'ni isteksizce kabul ettiğinde, ortaya çıkan mevzuat Endonezya'nın bağımsızlığını, ekonomik açıdan kendi kendine yetebilecek nitelikte olması için uzun bir koşul listesine bağladı. Buna rağmen, bu koşullar Endonezya halkının kararlılığı sayesinde tamamen yerine getirildi ve Hollanda'nın resmi bağımsızlık ilanımızı kabul etmekten başka çaresi kalmadı."
 INSHOL_request_british_support:0 "Britanya Desteği İste"
 INSHOL_request_british_support_desc:0 "[ENG.GetNameDefCap], bir sömürgeci güç olarak durumumuza muhtemelen sempati duyacaktır, özellikle de devrimciler başarılı olursa, bu Doğu Asya'da bir domino etkisi yaratabilir. Onlardan ekonomik ve askeri yardım talep etmeliyiz."
 INSHOL_request_ceylon:0 "Seylan'ın Transferini Talep Et"
 INSHOL_request_ceylon_desc:0 "Britanya kolonisi Seylan, daha geniş Malay dünyasıyla derin kültürel ve dilsel bağlara sahiptir. Pan-Malay Maphilindo federasyonu büyürken, bu adanın da konfederasyon içinde yerini bulması son derece doğaldır."
 INSHOL_request_east_timor:0 "Doğu Timor'un İadesini Talep Et"
 INSHOL_request_east_timor_desc:0 "Timor'un Portekiz tarafından işgal edilmesinin hiçbir hakkı yok, bu sömürge tarihinin bir kalıntısıdır ve buna müsamaha göstermeye devam etmemeliyiz, çünkü orası haklı olarak Endonezya toprağıdır. Portekiz'e Timor'u derhal bize iade etmeleri için resmi bir talepte bulunacağız."
 INSHOL_request_economic_dev_subsidy:0 "Ekonomik Kalkınma Sübvansiyonları Talep Et"
 INSHOL_request_economic_dev_subsidy_desc:0 "Efendimize karlı bir koloni olarak değerimizi kanıtladık. Bunu, endüstriyel kalkınma sübvansiyonları almak için pazarlık malzemesi olarak kullanabiliriz."
 INSHOL_request_naval_control:0 "Doğu Hint Adaları Filosu"
 INSHOL_request_naval_control_desc:0 "[HOL.GetNameDefCap] düştü ve koca bir donanmayı işletecek durumda değil. Savaşın geri kalanı için bunun kontrolünü ele almalıyız."
 INSHOL_revolution_ongoing_tt:0 "Endonezya Devrimi Devam Ediyor"
 INSHOL_rubber_taxation:0 "Kauçuk Vergilendirmesi"
 INSHOL_rubber_taxation_desc:0 "Hollanda yatırımı ve uzmanlığı, Doğu Hint Adaları'ndaki kauçuk plantasyonlarını İmparatorluğun en değerli varlıklarından birine dönüştürdü. Tacın yarattığı zenginlikten hak ettiği payı alması sadece adaletin gereğidir. Bazı yerel politikacılar protesto etse de, İmparatorluğun çıkarları bölgesel ajitasyonla dikte edilemez."
 INSHOL_seek_foreign_help:0 "Dış Yardım Ara"
 INSHOL_seek_foreign_help_desc:0 "Yeni kurulmuş bir ulus olarak, köklü bir ekonomisi olmadan, ağır sanayileşmiş bir sömürgeci güce karşı savaş kazanmaya çalışmanın neredeyse imkansız bir görev olduğu sır değildir. Davamızı destekleyen diğer ülkelere ulaşıp bize yardım etmeye istekli olup olmadıklarını görmeliyiz."
 INSHOL_sideline_the_volksraad:0 "Volksraad'ı Saf Dışı Bırak"
 INSHOL_sideline_the_volksraad_desc:0 "Soetardjo'nun çağrıda bulunduğu dilekçe, Hollanda Anayasası'nın 1. Maddesinin açık bir ihlalidir ve yalnızca Hint Adaları yönetimi için zorluk yaratacaktır. Dilekçe veto edilmelidir."
 INSHOL_singapore_compromise:0 "Singapur Uzlaşısı"
 INSHOL_singapore_compromise_desc:0 "Singapur tarih ve kültür olarak Endonezya toprağıdır ve birleşik bir Endonezya'ya dahil edilmesi son derece doğaldır. Ancak Britanya, stratejik önemi ve askeri üs olarak gerekliliği nedeniyle Singapur'dan vazgeçmeye istekli değil. Britanya'nın adada kuvvet bulundurma hakkını elinde tutması koşuluyla, Singapur'un birliğe katıldığı bir uzlaşma önermeliyiz."
 INSHOL_submarines:0 "Denizaltılar"
 INSHOL_submarines_desc:0 "Doğu Hint Adaları'nın boğazları pusu kurmak için biçilmiş kaftandır ve bir denizaltının maliyeti, dibe gönderdiği savaş gemisinden çok daha azdır. Güçlü bir denizaltı filosu, [ROOT.GetAdjective] donanmasının deniz hatlarını tutmasını ve kendini hiç göstermeden düşman nakliye gemilerine darbe indirmesini sağlar."
 INSHOL_subsidize_bauxite:0 "Boksit Projelerini Sübvanse Et"
 INSHOL_subsidize_bauxite_desc:0 "Boksit zengini Bangka-Belitung adalarını modernize etmeye yönelik Adalar'daki devam eden proje çok umut verici ve uzun vadeli kar potansiyeli yüksek. Projeyi hızlandırmak için ekonomik sübvansiyonlarla Adalar hükümetini desteklemeliyiz."
 INSHOL_sumatra:0 "$HOL_sumatra$"
 INSHOL_sumatra_desc:0 "$HOL_sumatra_desc$"
 INSHOL_the_declaration_of_independence:0 "Ulusal Devrim"
 INSHOL_the_war_in_europe:0 "Avrupa'daki Savaş"
 INSHOL_the_war_in_europe_desc:0 "Avrupa'daki çatışma hızla tırmanıyor ve Hollanda şu anda savaşta. Bizi korumaları için artık onlara güvenemeyiz ve yerimizi korumalıyız, aksi takdirde yabancı güçler tarafından ele geçirilme riskiyle karşı karşıya kalırız."
 INSHOL_transfer_of_conrad_helfrich:0 "Conrad Helfrich'i Hint Adaları'na Transfer Et"
 INSHOL_transfer_of_conrad_helfrich_desc:0 "Amiral Conrad Helfrich'i doğrudan Hint Adaları'na transfer etmek, Hint Adaları'ndaki deniz kuvvetleri çabasını kritik bir şekilde geliştirecektir."
 INSHOL_transfer_of_henri_winkelman:0 "Henri Winkelman'ın Transferi"
 INSHOL_transfer_of_henri_winkelman_desc:0 "Henri Winkelman daha önce uzun yıllar KNIL'de görev yaptı. Hint Adaları'nda ona bir kez daha ihtiyaç duyulduğu açıktır ve Doğu Hint Adaları'na resmi transferini ayarlamalıyız."
 INSHOL_ultimatum_to_republic:0 "Cumhuriyete Bir Ültimatom"
 INSHOL_undermine_the_militias:0 "Milisleri Zayıflat"
 INSHOL_undermine_the_militias_desc:0 "Medya bu durumun ciddiyetini abartıyor, milisler ulaşılmaz bir şeye ulaşmaya çalışan bir grup serseri gençten ibaret. Onları durdurmak için tüm kaynaklarımızı harcamamıza gerek yok, sadece hattı korumalı ve yorulmalarını beklemeliyiz."
 INSHOL_urge_gov_veto:0 "Vali Veto'sunu Teşvik Et"
 INSHOL_urge_gov_veto_desc:0 "Soetardjo Dilekçesi, Hint Adaları hükümetinin kandığı bir milliyetçi plan. Dilekçeyi hemen veto etmesi için Genel Vali'ye baskı yapmalıyız, aksi takdirde kolonimizi kaybetme riskiyle karşı karşıya kalırız."
 INSHOL_volksraad_compromises:0 "Volksraad Uzlaşmaları"
 INSHOL_volksraad_compromises_desc:0 "Meclis içindeki reform bizi buraya kadar getirdi ve şimdi yolu terk etmek için bir neden yok. Volksraad, Lahey ile taviz üzerine taviz vererek, kopuş yerine sabırla kendi kendini yönetme peşinde koşarak dikkatli çalışmalarına devam edecek. Bir Hollanda milletler topluluğu içindeki gelecek, dışarıda bir tane için savaşarak geçirilen bir gelecekten daha fazlasını sunar."
 INSHOL_work_with_oil_barons:0 "Petrol Baronlarıyla İşbirliği Yap"
 INSHOL_work_with_oil_barons_desc:0 "Büyük Buhran, ihracata dayalı ekonomimizi iç karartıcı bir duruma soktu. Petrolün satılmasını garanti altına almak için ticaret müzakerelerinin bir kısmını Sumatra'nın petrol baronlarına devretmeyi düşünmenin zamanı gelmiş olabilir. Ancak bu bir bedel getirecektir; bu anlaşmayı kabul etmeleri için petrolü piyasa oranından önemli ölçüde daha düşük fiyatlarla satmamız gerekecek."
 INS_KNIL_Informant_Network_name:0 "KNIL Muhbir Ağı"
 INS_Sleeper_Informant_Network_name:0 "Uyuyan Muhbir Ağı"
 INS_a_cheap_navy:0 "Ucuz Bir Donanma"
 INS_a_cheap_navy_desc:0 "Büyük modern bir donanma inşa etmek için zamanımız veya paramız yok. Elimdekilerle idare etmeli ve bulabildiğimiz her şeyi hurdaya çıkarmalıyız."
 INS_abolish_national_committee:0 "Ulusal Komiteyi Kaldır"
 INS_abolish_national_committee_desc:0 "Milli Komite kaldırılacak ve yerine Cumhurbaşkanlığına bağlı bir Çalışma Komitesi getirilecek. Başkan düzeni sağlamak için ömür boyu görev yapacak. Çalışma Komitesine bir anda değil, yavaş yavaş daha fazla yetki verilecek."
 INS_abolish_national_committee_tt:0 "§Y[ROOT.GetNeutralParty]§! desteği §Y100%§! olarak ayarlanacaktır."
 INS_acquire_modern_blueprints:0 "Modern Planlar Edin"
 INS_acquire_modern_blueprints_desc:0 "Yeni Donanmamızı inşa etmek için kullanacağımız diğer ülkelerden ve özel şirketlerden planlar satın alacağız."
 INS_add_3_militia_unit_tt:0 "Hollanda eyaletlerinde §Gmilis varlığını§! artırmak için §Ybaskınlarda§! kullanılabilecek üç §YÖzgürlük Savaşçısı§! birimi oluşturun."
 INS_add_fully_trained_militia_unit_tt:0 "Bir eğitimli §YÖzgürlük Savaşçısı§! birimi oluşturun.\n"
 INS_add_militia_cap_1_tt:0 "§YÖzgürlük Savaşçısı§! tümeni kapasitesi §Y1§! artar.\n"
 INS_add_militia_cap_2_tt:0 "§YÖzgürlük Savaşçısı§! tümeni kapasitesi §Y2§! artar.\n"
 INS_add_militia_cap_3_tt:0 "§YÖzgürlük Savaşçısı§! tümeni kapasitesi §Y3§! artar.\n"
 INS_add_revolution_point_tt:0 "§Y1§! ek milis elçisi alır."
 INS_admiral_mas_pardi:0 "Amiral Mas Pardi"
 INS_admiral_mas_pardi_desc:0 "Her iyi donanmanın komuta edecek bir Amiral'e ihtiyacı vardır. Mas Pardi bariz seçimdir."
 INS_agrarian_reform:0 "Tarım Reformu"
 INS_agrarian_reform_desc:0 "Üç asırdır Endonezya toprakları yabancıların plantasyonlarını besledi. Onu işleyen köylüler başka pek bir şey görmedi. Bunu değiştirmeyen bir devrim, devrim değildir. Toprağın onu işleyenlere geçmesini sağlayacağız."
 INS_akademi_angkatan_laut:0 "Akademi Angkatan Laut İnşa Et"
 INS_akademi_angkatan_laut_desc:0 "Daha fazla vatandaşı Mühendis ve Amiral olarak eğitirken Deniz araştırmaları için tesisleri olan bir Deniz Harp Akademisi inşa edeceğiz."
 INS_all_cards_into_industry:0 "Tüm Kartları Sanayiye Oyna"
 INS_all_cards_into_industry_desc:0 "Sanayileşme [1058.GetName]'in ekonomisi üzerinde büyük bir etki yarattı. On milyonlarca vatandaşıyla tüm adayı sanayileştirirsek, küresel ölçekte etkili olabiliriz."
 INS_all_in_on_rubber:0 "Tamamen Kauçuğa Yönel"
 INS_all_in_on_rubber_desc:0 "Kauçuk bizim en güçlü kozumuz ve onu oynamaya niyetliyiz. Mevcut tüm plantasyon arazileri kauçuk ekimine devredilecek ve ihracat cihazımız onu bölgedeki herkesten daha hızlı ve daha ucuza taşımak için yeniden düzenlenecek."
 INS_all_toward_the_war_effort:0 "Hepsi Savaş Çabasına Doğru"
 INS_all_toward_the_war_effort_desc:0 "Bizim önderlik ettiğimiz Malay ve [AST.GetAdjective] cepheleri önümüzdeki yıllarda Malay birliğinin sonucunu belirleyecek. Hiçbir kaynağı ayıramayız, her şey Malay'ın özgürlüğü için savaşan cesur askerlere gitmeli."
 INS_allow_local_autonomy:0 "Yerel Özerkliğe İzin Ver"
 INS_allow_local_autonomy_desc:0 "Prensliklere öz yönetim hakkı tanıyan Vorstenlanden sistemi, milliyetçi hareketleri yönetmeyi çok daha kolaylaştırdı ve ulusun istikrarını bir bütün olarak artırdı. Prensliklere tanınan özerklik seviyesini daha da artırmalı, hükümetin daha önemli konulara odaklanmasını sağlamalıyız."
 INS_aluminium_factory:0 "Pangkalpinang Alüminyum Fabrikası"
 INS_aluminium_factory_desc:0 "Ham boksit çıkarımımız artıyor, ancak yerli alüminyum üretimimizin eksikliği karlarımızı sınırlıyor. Bangka-Belitung adalarının eyalet başkenti olarak Pangkalpinang, kendi fabrikalarımızı kurmak için ideal bir yer olurdu. Bunu yapmak, aracıları devreden çıkarmamıza ve getirilerimizi maksimize etmemize olanak sağlayacaktır."
 INS_arm_the_revolutionaries:0 "Devrimcileri Silahlandır"
 INS_arm_the_revolutionaries_desc:0 "Enerji dolu ve Endonezya için her şeylerini vermeye hazır devrimciler ve milliyetçilerle başlamalıyız. Ülkeleri için savaşmaları için ihtiyaç duydukları eğitim ve teçhizatı onlara sağlayacağız."
 INS_arm_the_students:0 "Öğrencileri Silahlandır"
 INS_arm_the_students_desc:0 "Öğrenciler devrimin temelini on yıllar önce attılar ve onu ileriye taşımaya devam edecekler."
 INS_arm_the_youth:0 "Gençleri Silahlandır"
 INS_arm_the_youth_desc:0 "Devrimcilerin ötesinde, gençleri silahlandırmalıyız. Enerji ve umut dolu olarak, devrimin meşalesini taşıyacaklar. Mümkün olduğunca çok Endonezyalı genç yetişkinin eğitimli ve çatışmaya hazır olduğundan emin olmalıyız. Savaş evlerine ulaşırsa, harekete geçmeye hazır olacaklar."
 INS_army_located_tt:0 "§Y[HOL.GetNameDefCap]§! Silahlı Kuvvetlerini bize taşıyor."
 INS_asian_trade_investments:0 "Asya Ticaret Yatırımları"
 INS_asian_trade_investments_desc:0 "Büyük Buhran'ın yıkımı, batıdaki uzun vadeli ticaret ortaklarımıza ne kadar aşırı bağımlı olduğumuzu gösterdi. Ekonomimizin temel olarak ihracata dayalı olması nedeniyle, ekonomimizin tek bir ülkeye bağlı kalmamasını sağlamak için Güneydoğu Asya'da yeni pazarlar geliştirmemiz ve genişletmemiz artık her zamankinden daha önemli."
 INS_asian_trade_investments_tt:0 "Her §Y420§! günde bir, §YBüyük Buhran§!'dan gelen kaynakların pazara girmesi cezası, negatif değiştiriciler gidene kadar §Y5%§! oranında §Gİyileşecek§!."
 INS_aslia_tt:0 "§YPasifik§! öznelerinin çekirdeklenmesine ve ilhak edilmesine izin verir"
 INS_assist_the_pemuda:0 "Pemuda'ya Yardım Et"
 INS_assist_the_pemuda_desc:0 "Java çeşitli Pemuda öğrenci milisleriyle dolu. Onlarla güçlerini birleştirmek ve Hollandalılara karşı görevlerinde askeri yardım sağlamak bize yararlı bir müttefik kazandırabilir."
 INS_australian_contracts:0 "Avustralya Sözleşmeleri"
 INS_australian_contracts_desc:0 "Kauçuk rezervlerimiz yurtiçi ihtiyaçların çok ötesine geçti. Kendi endüstrilerini beslemek için hammaddeye aç olan Avustralya, doğal bir ticaret ortağıdır. Avustralyalı firmalarla uzun vadeli sözleşmeler yapmak, istikrarlı bir gelir getirecek ve bölgesel ekonomideki konumumuzu güçlendirecektir."
 INS_australian_weapons:0 "Avustralya Silahları"
 INS_australian_weapons_desc:0 "Gizli operasyonları yürütmek kolay değildir ve başarılı olmak için uygun teçhizata ihtiyacımız olacak. Avustralya fabrikalarını lisanslayabilir ve onları NEFIS için silah üretmek üzere yeniden amaçlandırabiliriz."
 INS_bangka_bauxite_export_flag:0 "§Y$INS_bauxite_export$§! milli hedefini tamamladı:"
 INS_bauxite_export:0 "Boksit İhracatını İkiye Katla"
 INS_bauxite_export_desc:0 "Bangka projesinin tamamlanması bizi ne yapacağımızı bilemediğimiz kadar çok ham boksitle baş başa bıraktı. Hepsini satmaya çalışmak zor olsa da, boksit için piyasadaki herkesten önemli ölçüde düşük bir fiyat teklif edebilir, her gramının satılmasını sağlayabiliriz. Satabileceğimiz boksit miktarının büyüklüğü nedeniyle, bu yine de mevcut ihracatımıza kıyasla orantılı bir kar artışı sağlayacaktır."
 INS_big_militia_presence_tt:0 "Bağımsızlık ilan edildiğinde Milislerimiz tarafından kontrol edilecek."
 INS_cannot_become_independent_tt:0 "§W§Y[INS.GetFlag][INS.GetNameDefCap]§!, §RDış müdahale olmadan bağımsız hale gelmesi kalıcı olarak engellenecek§!.§!"
 INS_centralization:0 "Merkezileşme"
 INS_centralization_desc:0 "Güç Java'da merkezileştirilecek ve diğer adalar sınırlı özerkliğe sahip olacak. Düzen ve istikrarın sağlanması için tüm kararların Java'dan geçmesi gerekir. Cumhurbaşkanı demokrasiyi denetleyecek."
 INS_centralize_the_state:0 "Devleti Merkezileştir"
 INS_centralize_the_state_1_tt:0 "§YÇekirdeklenmiş§! olması gereken ön koşul eyaletler:"
 INS_centralize_the_state_2_tt:0 "§YÇekirdeklenmemiş§! olması gereken ön koşul eyaletler:"
 INS_centralize_the_state_desc:0 "Sumatra'dan Sulawesi'ye, Borneo'dan Bangka'ya kadar kalkınma programlarımız, [1058.GetName]'in sadece ismen yönettiği topraklara yollar, fabrikalar ve kurumlar getirdi. Bu bölgeler artık uzak eyaletler değil. Onlar [INS.GetNameDefCap]."
 INS_chemical_imports_stolen_tt:0 "Bu milli hedef tamamlandığında görüş §Y75§! üzerindeyse §G[?var:ROOT.INS_guns_from_seek_help_focus]§! birim Piyade Teçhizatı ekle."
 INS_closer_economic_ties_to_netherlands:0 "Hollanda ile Daha Yakın Ekonomik Bağlar"
 INS_closer_economic_ties_to_netherlands_desc:0 "Efendimizden, özellikle ekonomik olarak öğrenecek çok şeyimiz var. İhracat ekonomimizi Hollanda ile daha fazla entegre etseydik, daha kazançlı ticaret anlaşmaları güvence altına almak için onların altyapı ve bağlantılarını kullanabilirdik."
 INS_commander_oerip:0 "Oerip'in Ordusu"
 INS_commander_oerip_desc:0 "Oerip, orduda onlarca yıl hizmet etti ve KNIL'de Binbaşılığa terfi ettirilen tek Endonezyalı. Bilgisi ve deneyimi diğer tüm üyelerinkinden çok daha fazla. Halkın Güvenlik Ordusu'nun yoluna rehberlik etmeli ve bizi zafere taşımalı."
 INS_commander_sudirman:0 "Sudirman'ın Ordusu"
 INS_commander_sudirman_desc:0 "Sudirman, genç bir yükselen yıldız olmasına rağmen büyük bir potansiyel gösterdi ve direnişin genç üyeleri arasında çok popüler. Halkın Güvenlik Ordusu'nun yoluna rehberlik etmeli ve bizi zafere taşımalı."
 INS_commander_sudirman_tt:0 "§YSudirman§!([INS.GetFlag]) §YSaha Mareşali§! rütbesine terfi eder!"
 INS_concessions_to_communists:0 "Komünistlere Tavizler"
 INS_concessions_to_communists_desc:0 "PKI'nın parlamentoda önemli sayıda koltuğu var, istikrarı sağlamak için PKI liderlerine birkaç bakanlık pozisyonu vermeliyiz."
 INS_construction_focus:0 "Endüstri Patlaması"
 INS_construction_focus_desc:0 "Yabancı sermaye akıyor, ihracat gelirleri tırmanıyor ve yıllardır ilk kez yerli sanayiye yatırım yapmak için gerçek para var. Anı yakalamalı ve şartlar bizi desteklerken inşa etmeliyiz."
 INS_continue_hybrid_politics:0 "Hibrit Siyaset'e Devam Et"
 INS_continue_hybrid_politics_desc:0 "Hibrit siyaset gerekli bir kötülüktür. Nihai hedef gerçek demokrasi olsa da Endonezya, tüm gücün halka devredilmesi için çok genç ve istikrarsızdır. Cumhurbaşkanı ve Parlamento birbirini dengelemeye devam ederek hiçbir organın aşırı güçlü olmamasını sağlayacaktır."
 INS_coopereate_with_chinese_businessmen:0 "Çinli İş Adamlarıyla İşbirliği Yap"
 INS_coopereate_with_chinese_businessmen_desc:0 "Zengin ve iyi bağlantıları olan bir tüccar sınıfı uzun zamandır takımada genelinde ticareti kolaylaştırmıştır. Bu köklü ağları kenara itmek yerine, onlarla çalışmalıyız. Sermayeleri ve ticari uzmanlıkları, ekonomimizi içinde bulunduğu buhranlı durumdan çıkarmada paha biçilmez olabilir."
 INS_darul_islam_focus:0 "Darul İslam"
 INS_darul_islam_focus_desc:0 "Kartosoewirjo'nun Hizbullah'ı Batı Java tepelerinde kendilerini kanıtladılar ve böyle savaşçıları saflarımızın dışında bırakmayı göze alamayız. Düzensiz birliklerinin bizimkiler arasında durmasına izin verin ve adamın kendisinin kazandığı rütbeyi taşımasına izin verin. Sadıklar, yakında Cumhuriyet'te davalarını sürdürecekler."
 INS_declare_free_trade:0 "Serbest Ticaret İlan Et"
 INS_declare_free_trade_desc:0 "Kendimizi yalnızca bir ülkeye bağlamamalıyız, piyasanın [INS.GetNameDef] için doğal olarak en iyi kararları vermesine izin vereceğiz."
 INS_defenders_of_homeland:0 "Anavatan Savunucuları"
 INS_defenders_of_homeland_desc:0 "Adalar Hükümeti düştü ve yerine yeni bir rejim geçti. Milliyetçiler ve Japon Hükümeti tarafından yönetilen, KNIL'den üstün yeni bir ordu kuracağız ve savaşı kazanacağız. Ancak, Milliyetçiler ve Emperyalistler arasındaki bu ittifakın kırılgan olduğu inkar edilemez. İttifak sürecek mi, yoksa kan dökülerek mi sona erecek?"
 INS_defenders_of_homeland_tt:0 "Anavatan Savunucuları kurulursa bu milli hedef otomatik olarak tamamlanacaktır."
 INS_demand_northern_malay:0 "Kuzey Malayca Talep"
 INS_demand_northern_malay_desc:0 "Kuzey Malay, etnik olarak Malay olmasına rağmen bugün Siam'a aittir. Sözde “müttefik”in topraklarımızı işgal etmesine izin vermeyeceğiz, Japonya'dan müdahale talep etmeliyiz."
 INS_denounce_soetardjo:0 "Soetardjo'yu Kına"
 INS_denounce_soetardjo_tt:0 "Yeraltı devrimi planlamaya, hükümete sızmaya ve takımadalar genelinde gerilla hücreleri kurmaya başlayacağız. Yeterince hazırlandığımızda, Hollandalılara karşı bağımsızlık gerilla savaşı başlatacağız."
 INS_deploy_the_kris:0 "Sulawesi Endonezya Halk Hizmeti"
 INS_deploy_the_kris_desc:0 "Endonezce KRIS olarak bilinen Sulawesi Endonezya Halk Hizmeti, aktif bir milis grubudur ve Sulawesi ile Manado'daki milis varlığının çoğunluğunu oluşturur. TKR ile birlikte resmi olarak savaşmaları için onları işe almalıyız."
 INS_destroy_pacific_colonialism:0 "Pasifik Sömürgeciliğini Yok Et"
 INS_destroy_pacific_colonialism_desc:0 "Devrim bitmiş olabilir ama hala verilecek savaşlar var. Kapımızda hala sömürge zorbalığı altında yaşayan birçok insan var. Boş boş oturup izleyemeyiz, onları efendilerinden kurtarmak için harekete geçmeliyiz!"
 INS_detangle_supply_chains:0 "Tedarik Zincirlerini Çöz"
 INS_detangle_supply_chains_desc:0 "İhracat ekonomimiz, malların nihai varış noktasına ulaşana kadar onlarca aracıdan geçmesini gerektiriyor, her seferinde bir ücret, bir vergi veya onlara paylarını vermemiz için başka bir neden gerektiriyor. Bu karmaşayı çözmek ve tedarik zincirinin çoğunu doğrudan kontrol etmek için çalışmalıyız."
 INS_develop_a_functioning_airforce:0 "Düzgün Bir Hava Kuvveti Geliştir"
 INS_develop_a_functioning_airforce_desc:0 "Hava kuvvetlerinin bir ordu üzerinde büyük bir etkisi vardır, bir tane oluşturmaya öncelik vermeliyiz."
 INS_develop_borneo:0 "Kalimantan'ı Geliştir"
 INS_develop_borneo_desc:0 "Kalimantan büyük bir zenginlik potansiyeline sahip, ancak ada çok seyrek gelişmiş durumda ve halkı yoksulluk içinde. Yük taşımacılığı, adanın birçok nehrine ve su yoluna büyük ölçüde bağımlı ve uzun menzilli iletişim, elektrik eksikliği nedeniyle engelleniyor. Elektrik hatları ve yollar inşa ederek, gelecekteki araştırmalar ve kaynak çıkarımı için yol açabiliriz."
 INS_develop_sulawesi:0 "Sulawesi'yi Geliştir"
 INS_develop_sulawesi_desc:0 "Sulawesi takımadaların merkezidir ve bu nedenle önemli bir stratejik konumdur. Savaş durumunda askeri bir merkez olarak kullanılabilmesini sağlamak için yollar, elektrik hatları ve iletişim ağları inşa etmeliyiz."
 INS_developing_java:0 "Cava Altyapısını Genişlet"
 INS_developing_java_desc:0 "Cava, takımadalardaki açık ara en sanayileşmiş adadır ve zenginliğimizin çoğunun kaynağıdır. Ancak, Batavya gibi bazı şehirler nüfus artışı nedeniyle giderek daha kalabalık hale geliyor. Büyüyen nüfusu desteklemek için bu şehirleri yeni evler, ticari alanlar, tramvaylar, trenler ve fabrikalarla genişletmeliyiz."
 INS_developing_sumatra:0 "Sumatra'yı Geliştir"
 INS_developing_sumatra_desc:0 "Sumatra, takımadalardaki en kaynak zengini adadır, ancak altyapı o kadar kötüdür ki çıkarılan kaynakların büyük bir kısmı Batavya'ya bile ulaşamaz. Taşımacılık, Sumatra'daki kalkınma planlarımızı desteklemek için tamamen yetersiz olan toprak yollar ve bağlantısız demiryolu hatlarından oluşan bir yamalı bohçaya dayanıyor. Buna devam etmesine izin veremeyiz."
 INS_direct_rule:0 "Doğrudan Yönetim"
 INS_direct_rule_desc:0 "Prensliklere öz yönetim hakkı tanıyan Vorstenlanden sistemi, yönetime bir zorluk katmanı ekledi, ek bürokrasi gerektirdi ve zaman kaybına neden oldu. Sistemi tamamen kaldırmanın ve tüm takımadalar üzerinde doğrudan yönetim uygulamanın zamanı geldi."
 INS_direct_rule_tt:0 "Endonezya prensliklerinde §Y$INS_direct_rule_occupation_law$§! işgal yasasının kilidini açar.\nEtkileri:\n     §GDevletten gelen fabrikaları ve kaynakları artırır§!\n     §RUyumluluk büyümesini azaltır§!\n     §RDireniş büyümesini artırır§!"
 INS_dismantle_indonesia:0 "[ROOT.GetName]'yi sökün"
 INS_dismantle_indonesia_desc:0 "Pek çok hükümet türünü denedik ve hepsi istikrarsızlıkla sonuçlandı. Devrim sona erdi ve Hollandalı sömürgeciler yenilgiye uğratıldı; artık tek bir birleşik cephe olarak bir arada durmamıza gerek yok. Federasyonu tamamen dağıtacağız ve yerel padişahlara kendi bağımsız ülkelerini kurmaları için özgürlük tanıyacağız."
 INS_dismantle_indonesia_tt:0 "§YFederasyon'u dağıtın§! ve hangi eyaletten yönetileceğinizi seçin. Geri kalan iller serbest bırakılacak."
 INS_dissolve_national_party:0 "Ulusal Partiyi Dağıt"
 INS_dissolve_national_party_desc:0 "Hibrit sistem, kaosu önlemek için gerekli bir uzlaşma olarak yaratıldı. Başkanın bu kadar gücü demokratik olmayan bir şekilde elinde tutmasına izin vermemeliyiz. Başkan parlamento tarafından görevden alınmalı, aksi takdirde asla demokrasiye ulaşamayız."
 INS_divert_army_funds_to_navy:0 "Ordu Fonlarını Donanmaya Kaydır"
 INS_divert_army_funds_to_navy_desc:0 "Endonezya bir takımadadır, piyadelerimiz onları taşıyacak gemiler olmadan hiçbir şeydir. Ordu'dan (TKR) yeni Donanmamıza fon kaydırmak değerli bir fedakarlıktır."
 INS_divert_javanese_education_funding_the_east:0 "Cava Eğitim Finansmanını Doğuya Yönlendirin"
 INS_divert_javanese_education_funding_the_east_desc:0 "Eski sömürge derebeylerinin yalnızca Java'nın ve Sumatra'nın kaynak açısından zengin bölgelerinin büyümesine yatırım yaparken, koloninin geri kalanını çürümeye terk ettiklerine şüphe yok. Java'nın eğitim bütçesinin bir kısmını alıp doğuda yeni okullar inşa etmek için yeniden tahsis ederek bu yanlışı düzeltebiliriz."
 INS_domestic_shipbuilding:0 "Yerli Gemi İnşası"
 INS_domestic_shipbuilding_desc:0 "Ele geçirilen ve satın alınan gemilere sonsuza kadar güvenemeyiz, ele geçirecek Hollanda gemisi kalmayana kadar uzun sürmeyecektir. Kendi gemilerimizi erken inşa etmeye başlamalıyız."
 INS_dominion_of_atjeh:0 "Açe (Atjeh) Dominyonu"
 INS_dominion_of_atjeh_desc:0 "Açe'deki ayrılıkçı hareket büyük ve büyüyor. Durumu tırmandırmak için hiçbir neden yok, bunun yerine Endonezya'nın bir parçası olarak kalırken çoğunlukla özerk olacakları bir uzlaşma müzakere etmeliyiz."
 INS_east_indies_exile_government:0 "Doğu Hint Adaları Sürgün Hükümeti"
 INS_east_indies_exile_government_desc:0 "Ne yazık ki, tüm çabalarımıza rağmen Adalar düştü. Ancak henüz umudumuzu kaybedemeyiz. Mevcut sınırlı kaynaklarla elimizden gelenin en iyisini yapmaya devam etmeliyiz. Savaşı kaybetmiş olabiliriz ama henüz savaşı kaybetmedik."
 INS_eastern_universities:0 "Doğu Üniversiteleri"
 INS_eastern_universities_desc:0 "Doğuda yeni üniversiteler inşa ederek, yüksek öğrenim daha fazla vatandaşa sunulacak ve öğrencilerin Java'dan uzaktaki okullara gitmeleri teşvik edilecek, böylece Java ile [ROOT.GetName]'nin geri kalanı arasındaki kültürel ayrım azaltılacak."
 INS_economic_stabilization:0 "Ekonomik İstikrar"
 INS_economic_stabilization_desc:0 "Büyük buhran ve dünya çapındaki korumacılık bizi ekonomik olarak sakat bıraktı ve bir zamanlar hammadde endüstrisinde çalışan birçok Endonezyalı işsiz kaldı. Drastik önlemler almalı ve işi olmayan vatandaşların bir işle görevlendirileceği bir çalışma programı oluşturmalıyız."
 INS_education_subsidies:0 "Eğitim Sübvansiyonları"
 INS_education_subsidies_desc:0 "Ekonomik olarak başarılı bir devlet istiyorsak ulusun gençlerinin geleceğine yatırım yapmak kesinlikle gereklidir. Cumhuriyet genelinde uygun fiyatlı okullar inşa edeceğiz."
 INS_electrical_investments:0 "Elektrik Yatırımları"
 INS_electrical_investments_desc:0 "Her Avrupalı sanayileşmiş ulusun endüstrisini desteklemek için güçlü bir elektrik şebekesi vardır. Malzeme ihracatına güvenmeyi bırakıp onlar gibi kendi imalat sanayimizi kurmak istiyorsak, Cava'nın tamamına uzanan yüksek kapasiteli bir elektrik şebekesi inşa etmeliyiz."
 INS_embezzlement_scheme_in_batavia:0 "Batavia'da Zimmete Para Geçirme Planı"
 INS_embezzlement_scheme_in_batavia_desc:0 "Bağımsızlığımızı ilan ettiğimizde üretimimizi Batavia'dan cumhuriyetçi topraklara taşımak için bir plan hazırlayacağız."
 INS_embezzlement_scheme_in_batavia_tt:0 "Bağımsızlık ilan edildiğinde, §Y[1058.GetName]§!'deki tüm fabrikaların yarısı §YDevrimci Karargahımıza§! taşınacak."
 INS_embrace_co_prosp_sphere:0 "Ortak Refah Alanını Kucakla"
 INS_embrace_co_prosp_sphere_desc:0 "Hollanda yönetimini nihayet bitirdik ve bir efendiyi bir başkasıyla değiştirmiş olsak da, ekonomik refah ve pan-asyanizm vaatleri çok cezbedici. Hollanda'nın Endonezya için bir daha geri gelmeye çalışmamasını sağlamak için Japon savaş çabalarına yardım etmeye devam edeceğiz."
 INS_enact_militarism:0 "Militarizmi Yürürlüğe Koy"
 INS_enact_militarism_desc:0 "[JAP.GetNameDefCap] ve onun militarist politikalarından birkaç ders almalıyız. Benzer ilkeleri benimsemek yeni hükümetimize fayda sağlayacaktır."
 INS_end_to_bloodshed_tt:0 "Savaş, mevcut işgale dayalı yeni sınırlar çizilerek sona erecek. Cava, Sumatra ve Borneo, o bölgede şu anda en çok kontrole sahip olan taraf tarafından §Yilhak edilecek§!."
 INS_eng_treaty_engside_tt:0 "Doğu Hint Adaları çatışmasında resmi olarak §Y[HOL.GetNameDefCap]§! ile hizalanacağız. Eğer §Y[HOL.GetNameDefCap]§! kazanırsa, Borneo üzerinde hak sahibi olacağız."
 INS_eng_treaty_holside_tt:0 "§Y[ENG.GetNameDefCap]§! resmi olarak çatışmanın bizim tarafımızda olduğunu beyan edecek ve önemli ölçüde yardım sağlayacak. Savaş zaferle biterse, §Y[ENG.GetNameDefCap]§! Borneo üzerinde hak sahibi olacak."
 INS_escalation_has_10_tt:0 "Tırmanış seviyesi §Y10§! seviyesinde"
 INS_escalation_has_1_tt:0 "Tırmanış seviyesi §Y1§!'den yüksek"
