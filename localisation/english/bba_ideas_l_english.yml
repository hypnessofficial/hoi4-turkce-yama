 ITA_bandits_war:0 "Haydutlar Savaşı"
 ITA_bandits_war_desc:0 "Hareketlilik ve mekanizasyon, savaşın geleceğidir. Ordumuzun günümüz savaş alanlarında başarılı olması için modernizasyonuna büyük yatırım yapmalıyız."
 ITA_battaglia_del_grano:0 "Battaglia del Grano"
 ITA_battaglia_del_grano_desc:0 "Gerçekten bağımsız olmak için gıda tedarikimiz için yabancı güçlere güvenemeyiz, tarımsal olarak kendi kendimize yeterli olmalıyız. Tahıl Savaşı, kendi kendimize yeterli olmamızı ve gücümüzün daha da artmasını sağlayacaktır."
 ITA_battaglia_per_la_nascite:0 "Doğumlar İçin Mücadele"
 ITA_battaglia_per_la_nascite_desc:0 "İtalya'nın gerçekten gelişmesi için daha fazla askere ihtiyacımız var. Daha fazla asker elde etmek için daha büyük bir nüfusa ihtiyacımız var. Daha büyük bir nüfus elde etmek için annelere ihtiyacımız var. Annelerin ihtiyacı olan şey, Doğum Savaşını kazanmamızdır."
 ITA_battaglia_per_la_terra:0 "Toprak İçin Mücadele"
 ITA_battaglia_per_la_terra_desc:0 "Toprak Savaşımız kilometrelerce bataklığı kurutacak ve tarım arazisi yaratacaktır. Aynı zamanda yeni iş fırsatları sağlayacak ve yabancı hükûmetler şimdiden İtalyan halkının kırılmaz ruhundan etkilenmiştir."
 ITA_bolstered_military_high_command:0 "Güçlendirilmiş Askeri Yüksek Komuta"
