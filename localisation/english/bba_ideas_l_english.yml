 SWI_mountaineer_paratroopers_idea_TT:0 "§YDağlar§!:\n Saldırı: §G+%35§!\n Savunma: §G+%10§!\n Hareket: §G+%20§!\n§YTepeler§!:\n Saldırı: §G+%20§!\n Savunma: §G+%5§!\n Hareket: §G+%10§!"
 SWI_mountaineer_paratroopers_idea_desc:0 "En sarp zirvelere erişim ve yüzyıllarca süren alp kültürü, İsviçre Paraşütçülerine diğer tüm hava indirme piyadelerine göre bir avantaj sağlar. Taşıma uçaklarımızdan inebilir ve sanki Monte Rosa veya Matterhorn'daymış gibi dağ zirvelerine hükmedebilirler."
 SWI_no_confederation_president_idea:0 "Seçilmiş Konfederasyon Başkanı yok"
 SWI_no_confederation_president_idea_desc:0 "Düşünülemez olan oldu ve Federal Konsey, İsviçre konfederasyonu için bir Başkan seçmede başarısız oldu. Bu durumdan çıkmak için çok çaba gerekecek."
