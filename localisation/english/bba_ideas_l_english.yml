 SWI_old_switzerland_idea:0 "Eski İsviçre'ye Dönüş"
 SWI_old_switzerland_idea_desc:0 "Uzun bir korkunç savaş ve ahlaksız genişleme döneminden sonra, [ROOT.GetName] halkı savaş öncesi zamanların tarafsızlığına ve demokrasisine dönmekten daha azını talep etmiyor. Bu çalkantılı zamanlar yakında sona erecek."
 SWI_pro_helvetia_idea:0 "Pro Helvetia"
 SWI_pro_helvetia_idea_desc:0 "İsviçre'nin hayatta kalması için, içinde konuşulan dillerden farklı bir ülke olması gerekir. Bu yüzden Pro Helvetia'nın görevi, İsviçre değerlerini ve bunlarla birlikte gelen Demokrasiye olan bağlılığı teşvik etmektir."
