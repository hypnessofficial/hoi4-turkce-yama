 GRE_absolute_monarch_hostile_factions_tt:0 "§RYakın zamanda bir İç Savaş§! çıkması muhtemel..."
 GRE_ally_onassis_tt:0 "§YAristoteles Onassis§! bakan olarak atanabilecek. \n£faction_gre_fascist §YFaşistler§! §Ydüşman§! olarak kalacak."
 GRE_ally_the_anatolian_fascists_tt:0 "£faction_gre_fascist §YFaşistler§! §Gdost§! olacak! \n§YEEE§! ile ittifak kurmanın §YKandiye Konvansiyonu§! toplandığında §Rciddi sonuçları§! olacaktır."
 GRE_anatolian_fascists_in_play_tt:0 "£faction_gre_fascist §YFaşistler§! ortaya çıkar ve §Rdüşman§! olarak başlar."
 GRE_border_war_possible_tt:0 "Durum tırmanırsa, §Y[TUR.GetNameDef]§! ile komşu sınırlarımız boyunca §Rsınır çatışmalarıyla§! uğraşmak zorunda kalabiliriz."
 GRE_british_armenia_option_tt:0 "Eğer önerge kabul edilir ve Kandiye Konvansiyonu nihayetinde başarılı olursa, §Y[TUR.GetNameDefCap]'ın§! teslimiyeti üzerine §Y[ENG.GetNameDefCap]§!, §Y[354.GetName]§!'da bir §YErmeni§! kukla devleti kuracaktır."
 GRE_french_kurdistan_option_tt:0 "Eğer önerge kabul edilir ve Kandiye Konvansiyonu nihayetinde başarılı olursa, §Y[TUR.GetNameDefCap]'nin§! teslimiyeti üzerine §Y[FRA.GetNameDefCap]§!, §YK*rdistan§!'ın çekirdek eyaleti olan tüm [TUR.GetAdjective] kontrolündeki eyaletlerde bir §YKürt§! kukla devleti kuracaktır."
 GRE_increased_influence_tt:0 "Bu, §Y[FROM.GetAdjective]§! hükümeti üzerindeki nüfuzumuzu artıracaktır."
 GRE_megali_idea_option_tt:0 "Eğer önerge kabul edilirse, §Y[TUR.GetNameDefCap]'ın§! teslimiyeti üzerine §Y[GRE.GetNameDefCap]§!, §Yİstanbul§!'u ve §YAegean Denizi§!'ne kıyısı olan diğer §Y[TUR.GetAdjective]§! eyaletlerini ilhak edecektir. §RYunanistan'a Megali İdea reddedilirse, şimdiye kadar kabul edilen her önerge geçersiz sayılır!§!"
 GRE_metaxist_monarchist_fascism_tt:0 "§YII. Georgios§! kral olarak kalacak ve §YBüyük Yunanistan§! kurulabilir bir ulus olarak mevcut olacak. \n£faction_gre_monarchist §YMonarşistler§! sadık hale gelecek."
 GRE_no_turkey_needed:0 "Sahtekârlık ve hile yoluyla §YTürkiye'nin§! §Yfaşist güçlerle§! ilişkilerini baltalayacağız."
 GRE_republican_monarchist_alliance_tt:0 "Monarşist generaller ve bakanlar Venizelosçu hükümet için mevcut olmaya devam edecek. \n£faction_gre_monarchist §YMonarşistler§! §Gdost§! haline geldi. \n£faction_gre_communist §YKomünistler§! §Rdüşman§! olacak."
 GRE_republican_national_socialism_tt:0 "§YII. Georgios§! tahtından indirilecek ve §YArgeadların Mirası§!'nı yerine getirebileceğiz. \n£faction_gre_monarchist §YMonarşistler§! Önemsiz hale gelecek."
 GRE_republican_victory_tt:0 "£faction_gre_monarchist §YMonarşistler§! §YKayıtsız§! hale gelir. \n£faction_gre_communist §YKomünistler§! §YKayıtsız§! hale gelir."
 GRE_tito_backed_guerilla_war_tt:0 "§YKomünistler§!, §YYunanların§! tam desteğiyle, ülkemizin güneyinde küçük bir iç savaş başlattı."
 ROOT_voted_aye_megali_effect:0 "Kabul Oyu Etkisi!"
 ROOT_voted_nay_megali_effect:0 "Red Oyu Etkisi!"
 TUR_border_conflicts_in_trabzon_tt:0 "İşler kaçınılmaz olarak yeniden çirkinleşmeden önce §Y[354.GetName]§! ve §Y[187.GetName]§! ile olan sınıra asker yerleştirmek akıllıca olur."
 TUR_britain_abandons_turkey_tt:0 "\n§Y[TUR.GetNameDef]§!'ye olan desteğimizi geri çektiğimizde, §Y[TUR.GetAdjective] hükümeti§! durumu yatıştırmak için son bir fırsat daha bulacak."
 TUR_britain_backs_turkey_tt:0 "\n§YTürk Boğazları§!'ndan geçişi düzenleme gücüne sahip olmaları gerektiği temelinde §Y[TUR.GetNameDef]§!'yi destekleyeceğiz. \n\n§R§Y[TUR.GetNameDef]§! ile §Y[SOV.GetNameDef]§! arasında bir savaşın aniden olası görünmesi durumunda desteğimizi geri çekme fırsatımız olacak.§!"
 TUR_britain_stands_up_for_turkey_tt:0 "\nSavaşa yol açsa bile §Y[TUR.GetNameDef]§!'nin yanında duracağız. §R[SOV.GetNameDefCap] durumu yatıştırmak için son bir fırsat daha bulacak!§!"
 TUR_britain_unentangles_itself_tt:0 "\n§Y[TUR.GetNameDef]§!'yi §Y[SOV.GetNameDef]§!'nin merhametine bırakacağız. §YTürk Boğazları§!'nın dünyanın her yerinden gelen sınırsız deniz trafiğine açık kalması muhtemeldir."
 TUR_conservative_victory_tt:0 "£faction_tur_traditionalist §YDP§!'ye ulusu yönetmek için §Ydemokratik§! bir yetki verilecek."
 TUR_downgrade_fundamentalist_defiance_effect_tt:0 "£faction_tur_traditionalist §YGelenekselciler§!, §Y[TUR_fundamentalist_state.GetName]§! eyaletinde hükümetle daha fazla iş birliği yapacak."
 TUR_keeping_turkey_under_observation:0 "§Y[TUR.GetNameDef]§!'nin eylemlerini dikkatle izleyeceğiz ve gerekirse gelecekte onları ittifakımızdan çıkaracağız."
 TUR_placate_fundamentalist_state_all_targets_effect_tt:0 "£faction_tur_traditionalist §YGelenekselciler§! toplu olarak hükümete karşı muhalefetlerini durduracak."
 TUR_placate_fundamentalist_state_effect_tt:0 "£faction_tur_traditionalist §YGelenekselciler§!, §Y[TUR_fundamentalist_state.GetName]§! eyaletinde hükümete karşı tüm söylemlerini durduracak ve şimdi aktif iş birliği çağrısında bulunacak."
 TUR_remaining_defiant_tt:0 "\n§YTürk Boğazları§!'ndan geçen tüm deniz trafiğini düzenleme hakkını talep etmeye devam edeceğiz. \n\n§RBu, gerilimi düşürmek için son şansımız olabilir: eğer [SOV.GetNameDef] konuyu zorlarsa bu savaşa yol açacaktır!§!"
 TUR_republican_victory_tt:0 "£faction_tur_kemalist §YCHP§!'ye ulusu yönetmek için §Ydemokratik§! bir yetki verilecek."
 TUR_soviets_allow_militarisation_tt:0 "§YTürk Boğazları§! yeniden askerileştirilecek ve §Y[TUR.GetNameDef]§!, içinden geçen tüm deniz trafiğini düzenleme gücünü kazanacak."
 TUR_soviets_oppose_turkey_tt:0 "\n§Y[TUR.GetAdjective]§! hükümeti ya bize bir uzlaşma çözümü sunacak ya da durumu daha da tırmandıracak. \n\n§RSilahlı çatışmanın olası görünmesi durumunda durumu yatıştırma fırsatımız olacak.§!"
 TUR_strait_compromise_tt:0 "§Y[SOV.GetNameDefCap]§! ve §YKaradeniz§!'e kıyısı olan diğer tüm uluslar, §YTürk Boğazları§!'ndan serbest geçiş ayrıcalıklarını koruyacaklar."
 TUR_straits_remain_demilitarised_tt:0 "\n§YTürk Boğazları§! askersiz kalacak ve savaşta olmadığımız sürece §YTürk Boğazları§!'ndan geçen deniz trafiği üzerinde hiçbir kontrolümüz olmayacak. \n\n§RBu, gerilimi düşürmek için son şansımız: eğer [SOV.GetNameDef] konuyu daha da zorlarsa bu savaşa yol açacaktır!§!"
 TUR_three_factories_sacrificed:0 "Üç §YSivil Fabrika§! kaldırıldı."
 TUR_upgrade_fundamentalist_defiance_effect_tt:0 "£faction_tur_traditionalist §YGelenekselciler§!, §Y[TUR_fundamentalist_state.GetName]§! eyaletinde hükümete karşı direnişlerinin yoğunluğunu artıracak."
 TUR_we_remain_committed_tt:0 "\n§R[SOV.GetNameDefCap] durumu yatıştırmak için son bir fırsat daha bulacak, ama eğer bunu seçmezlerse bu savaşa yol açacaktır!§!"
 bftb_bulgaria_balkan_federation.1.a:0 "Uğruna savaşmaya değer bir hayal!"
 bftb_bulgaria_balkan_federation.1.desc:0 "Balkan uluslarının hükümetlerine sunmak ve her birinin katılımını, [YUG.GetNameDef]'den başlayarak, müzakere etmek amacıyla bir Balkan Sosyalist Cumhuriyetler Federasyonu'nun kurulması projesinin hazırlığını tamamladık. \n[ROOT.GetNameDef] tarafından yönetilecek olan federasyonun ana hedefi, Balkan ülkelerini boyunduruk altına almak isteyen birçok düşmana karşı savaşmaya hazır, uluslarüstü bir birlik içinde tüm Balkan halklarının iş birliğidir. \nAncak [ROOT.GetLeader]'in daha büyük bir hayali var: vatandaşların artık Bulgar, Yunan, Yugoslav... değil, özgür Balkan vatandaşları olacağı bir Birleşik Balkan Federasyonu."
 bftb_bulgaria_balkan_federation.1.t:0 "Balkan Federasyonu Projesi"
 bftb_bulgaria_balkan_federation.10.a:0 "Verildi!"
 bftb_bulgaria_balkan_federation.10.desc:0 "[FROM.GetLeader] liderliğindeki bir [FROM.GetAdjective] heyeti, [FROM.GetNameDef]'in Birleşik Balkan Federasyonu'na katılım koşullarını [ROOT.GetLeader] ile görüşmek üzere bugün [ROOT.Capital.GetName]'a geldi. Görünüşe göre [FROM.GetAdjective] hükümeti, federasyon içinde bir miktar bağımsızlık ve özyönetim hakkını sürdürmek istiyor, ancak belirli bir özerklik derecesiyle ortak üye olarak katılmaya istekli."
 bftb_bulgaria_balkan_federation.10.t:0 "[FROM.GetNameDefCap] Belirli Özyönetim Hakları Çağrısında Bulunuyor"
 bftb_bulgaria_balkan_federation.11.a:0 "Kararlarına saygı duyacağız."
 bftb_bulgaria_balkan_federation.11.b:0 "Bize güvenmeyen bir hükümetle nasıl iş birliği yapabiliriz?"
 bftb_bulgaria_balkan_federation.11.c:0 "[FROM.GetLeader] konuşmasıyla fazla ileri gitti!"
 bftb_bulgaria_balkan_federation.11.desc:0 "[FROM.GetAdjective] hükümeti Birleşik Balkan Federasyonumuza katılmayı reddetti, ancak uluslarımız arasındaki ittifakı korumaya kararlı. \nAncak, [FROM.GetLeader], Bulgar hükümetinin [FROM.GetAdjective] reddine tepkisinin, Federasyonun asıl gizli amacının Bulgaristan sınırlarını hayal edilemeyecek kadar genişletmek mi, yoksa Bulgaristan'ın gerçekten de federasyondaki üyelik koşulları ne olursa olsun Balkan ülkeleri arasında iş birliği arayıp aramadığını göstereceğini kamuoyuna açıkladı, ama her durumda, [FROM.GetNameDef]'in asla bağımsızlığından veya kültürel kimliğinden vazgeçmeyeceğini belirtti."
 bftb_bulgaria_balkan_federation.11.t:0 "[FROM.GetNameDefCap] teklifimizi reddetti"
 bftb_bulgaria_balkan_federation.12.a:0 "Barışı korumak için taleplerine uyacağız..."
 bftb_bulgaria_balkan_federation.12.a_state_transfering_tt:0 "Eyalet, hak sahibi Balkan sahibine devredilecektir."
 bftb_bulgaria_balkan_federation.12.b:0 "[ROOT.GetNameDef], [BUL.GetAdjective] baskısına boyun eğmeyecek!"
 bftb_bulgaria_balkan_federation.12.b_tt:0 "Aşağıdaki etkilere yol açabilir:"
 bftb_bulgaria_balkan_federation.12.desc:0 "[BUL.GetAdjective] hükümeti, Balkanlar'daki [ROOT.GetAdjective] topraklarının, [BUL.GetAdjective]lere göre meşru olarak ait olduğu Balkan uluslarına devredilmesini talep etmek için bir diplomatik misyon gönderdi. [BUL.GetNameDef]'den gelen delegeler genel olarak samimi bir ton sergilediler, ancak bazı diplomatlarımız, özellikle [ITA.GetAdjective] bakanlarının ilk reddi karşısında belirli tehditkar imalar algıladıklarını iddia ediyorlar."
 bftb_bulgaria_balkan_federation.12.t:0 "[FROM.GetNameDefCap], Balkanlar'daki [ROOT.GetAdjective] Topraklarını Talep Ediyor"
 bftb_bulgaria_balkan_federation.13.a:0 "[ITA.GetLeader]'den bilge bir karar."
 bftb_bulgaria_balkan_federation.13.desc:0 "[ITA.GetAdjective]'in Balkan topraklarının devrini müzakere etmek için gönderdiğimiz diplomatik heyetimizle uzun ve yoğun bir toplantının ardından, [ITA.GetLeader] [BUL.GetAdjective] baskısına boyun eğdi ve Balkanlar'daki [ITA.GetAdjective] eyaletlerinin kontrolünü meşru olarak ait olduğu uluslara resmen devretti."
 bftb_bulgaria_balkan_federation.13.t:0 "[ITA.GetNameDefCap] Taleplerimize Boyun Eğiyor"
 bftb_bulgaria_balkan_federation.14.a:0 "Bunun için Bulgarlara teşekkür etmeliyiz!"
 bftb_bulgaria_balkan_federation.14.desc:0 "[BUL.GetAdjective] hükümeti, Balkanlar'daki [ITA.GetAdjective] topraklarının devredilmesini talep etmek için [ITA.GetNameDef]'e bir diplomatik misyon gönderdi. \nUzun bir toplantının ardından, [ITA.GetLeader] [BUL.GetAdjective] baskısına boyun eğdi ve Balkanlar'daki [ITA.GetAdjective] eyaletlerinin kontrolünü meşru olarak ait olduğu uluslara devretmeyi kabul etti, ki bu [ROOT.GetNameDef] için belirli toprak kazanımlarını beraberinde getiriyor."
 bftb_bulgaria_balkan_federation.14.t:0 "Balkan Topraklarında [BUL.GetAdjective] Tahkimi"
 bftb_bulgaria_balkan_federation.15.a:0 "O zaman o toprakları kendimiz alacağız!"
 bftb_bulgaria_balkan_federation.15.b:0 "[ITA.GetAdjective]lerle daha sonra ilgileneceğiz..."
 bftb_bulgaria_balkan_federation.15.desc:0 "Balkanlar'daki [ITA.GetAdjective] topraklarının meşru olarak ait olduğu uluslara devrini müzakere etmek için gönderdiğimiz heyetimizle uzun bir toplantının ardından, [ITA.GetLeader] nihayetinde [ROOT.GetAdjective] diplomatlarını dinlemeyi reddetti ve Balkanlar'da [ITA.GetNameDef] tarafından işgal edilen her toprak parçasının haklı olarak [ITA.GetAdjective] halkına ait olduğunu belirtti."
 bftb_bulgaria_balkan_federation.15.t:0 "[ITA.GetNameDefCap] Balkan Topraklarından Vazgeçmeyi Reddediyor"
 bftb_bulgaria_balkan_federation.16.a:0 "Ne pahasına olursa olsun yeni bir Balkan savaşının patlak vermesini önlemeliyiz..."
 bftb_bulgaria_balkan_federation.16.b:0 "[BUL.GetLeader] sanrılar görüyor olmalı!"
 bftb_bulgaria_balkan_federation.16.desc:0 "[BUL.GetAdjective] hükümeti, [BUL.GetAdjective]lere göre haklı olarak kendilerine ait olan Balkanlar'daki [ROOT.GetAdjective] topraklarının devredilmesini talep etmek için bir diplomatik misyon gönderdi. \n[BUL.GetNameDef]'den gelen delegeler genel olarak samimi bir ton sergilediler, ancak bazı diplomatlarımız, özellikle [ROOT.GetAdjective] bakanlarının ilk reddi karşısında belirli tehditkar imalar algıladıklarını iddia ediyorlar."
 bftb_bulgaria_balkan_federation.16.t:0 "[BUL.GetNameDefCap], Balkanlar'daki Tüm [ROOT.GetAdjective] Topraklarını Talep Ediyor"
 bftb_bulgaria_balkan_federation.17.a:0 "Kutlayacağız!"
 bftb_bulgaria_balkan_federation.17.desc:0 "Balkanlar'daki [TUR.GetAdjective] topraklarının devrini müzakere etmek için gönderdiğimiz diplomatik heyetimizle olağanüstü gergin bir toplantının ardından, [TUR.GetLeader] [ROOT.GetAdjective] baskısına boyun eğdi ve Balkanlar'daki [TUR.GetAdjective] eyaletlerinin kontrolünü resmen [ROOT.GetNameDef]'e devretti."
 bftb_bulgaria_balkan_federation.17.t:0 "[TUR.GetNameDefCap] Balkan Topraklarından Vazgeçiyor"
 bftb_bulgaria_balkan_federation.18.a:0 "O zaman onları zorla almak zorunda kalacağız!"
 bftb_bulgaria_balkan_federation.18.desc:0 "Balkanlar'daki [TUR.GetAdjective] topraklarının [ROOT.GetNameDef]'e devrini müzakere etmek için gönderdiğimiz heyetimizle olağanüstü gergin bir toplantının ardından, [TUR.GetLeader] nihayetinde diplomatlarımızı dinlemeyi reddetti ve [TUR.GetNameDef]'in yüzyıllardır o toprakların kontrolünde olduğunu ve bu nedenle [TUR.GetNameDef]'in onların hak sahibi olduğunu belirtti."
 bftb_bulgaria_balkan_federation.18.t:0 "[TUR.GetNameDefCap] Balkan Topraklarından Vazgeçmeyi Reddediyor"
 bftb_bulgaria_balkan_federation.2.a:0 "İddialı bir proje..."
 bftb_bulgaria_balkan_federation.2.desc:0 "[BUL.GetAdjective] hükümeti, [ROOT.GetNameDef]'e katılmaya davet edilen ilk ulus olma ayrıcalığını vaat ederek, bir Balkan Sosyalist Cumhuriyetler Federasyonu'nun kurulması projesini bize sundu. \n[BUL.GetNameDef] tarafından yönetilecek olan federasyonun ana hedefi, Balkan ülkelerini boyunduruk altına almak isteyen birçok düşmana karşı savaşmaya hazır, uluslarüstü bir birlik içinde tüm Balkan halklarının iş birliğidir. \nSosyalist ve komünist basın haberi çoktan sızdırdı ve Balkan Federasyonu ile [ROOT.GetNameDef]'in ona katılımına destek [ROOT.GetAdjective] nüfusu arasında yayılmaya başlıyor."
 bftb_bulgaria_balkan_federation.2.t:0 "[BUL.GetAdjective] Balkan Federasyonu Projesi"
 bftb_bulgaria_balkan_federation.3.a:0 "Bulgaristan'dan cüretkâr bir hamle..."
 bftb_bulgaria_balkan_federation.3.desc:0 "Bulgarlar, [ROOT.GetAdjective] nüfusunu aldatıcı bir Balkan Sosyalist Cumhuriyetler Federasyonu kurma projelerinin fizibilitesine ikna etmek amacıyla [ROOT.GetNameDef]'de bir propaganda kampanyası başlattılar. \nSolcu basın haberi yaydı ve birçok insan, özellikle şehirlerdeki sanayi işçileri ve kırsaldaki çiftçiler, [BUL.GetAdjective] teklifine koşulsuz desteklerini şimdiden gösteriyorlar."
 bftb_bulgaria_balkan_federation.3.t:0 "Balkan Federasyonu Propagandası"
 bftb_bulgaria_balkan_federation.4.desc:0 "[BUL.GetAdjective] aktivistler, [ROOT.GetNameDef]'deki Balkan Federasyonu destekçilerini silahlandırmak ve ülkede huzursuzluk yaratmak amacıyla ülkemize sınırı geçtiler. \nPolis memurları bu yıkıcı unsurları yakalamak ve hapsetmek için gece gündüz çabalıyorlar, ancak şimdiye kadar çabaları pek verimli olmadı ve birçok [ROOT.GetAdjective] vatandaşı, özellikle işçi sınıfından olanlar, [BUL.GetAdjective] Balkan Federasyonu projesini destekleyenlerin saflarına katıldı."
 bftb_bulgaria_balkan_federation.4.t:0 "[BUL.GetNameDefCap], [ROOT.GetNameDef]'i İstikrarsızlaştırıyor"
 bftb_bulgaria_balkan_federation.5.a:0 "Balkan kardeşlerimize katılalım!"
 bftb_bulgaria_balkan_federation.5.b:0 "Birleşmeyi kabul etmeden önce yardım iste."
 bftb_bulgaria_balkan_federation.5.c:0 "Sınırlı özyönetim talep et."
 bftb_bulgaria_balkan_federation.5.d:0 "[ROOT.GetAdjective] bağımsızlığından ve kimliğinden vazgeçmeyeceğiz!"
 bftb_bulgaria_balkan_federation.5.d_consequences_tt:0 "§RReddimiz, [FROM.GetNameDef]'in bizi [FROM.GetFactionName]'den atmasına ve hatta bize karşı bir savaş hedefi oluşturmasına neden olabilir!§!"
 bftb_bulgaria_balkan_federation.5.desc:0 "[BUL.GetAdjective] hükümeti bize, Balkanlar'ın farklı halkları arasındaki anlayış ve işbirliğini geliştirmek amacıyla Balkanlar'ın merkezi bir hükümet altında birleştirilmesinin gerçekleştirilmesi yönünde bir teklif gönderdi. [BUL.GetLeader]'ye göre bu, Balkan Federasyonu'nun geçmişteki çatışmaları geride bırakmamıza ve uluslarımız arasındaki birlik ve barışı kalıcı olarak garanti altına almamıza olanak sağlayacak son büyük adımıdır. \n[BUL.GetNameDefCap], uluslarımızın birleşmesine devam etmek için [ROOT.GetAdjective] hükümetinin yanıtını bekliyor."
 bftb_bulgaria_balkan_federation.5.t:0 "Balkanların Birleşmesi"
 bftb_bulgaria_balkan_federation.6.a:0 "Hayal gerçek oluyor!"
 bftb_bulgaria_balkan_federation.6.desc:0 "[FROM.GetAdjective] hükümeti birleşme teklifimizi kabul etti ve Birleşik Balkan Federasyonu'na katıldı. Eski [FROM.GetAdjective] vatandaşları şimdi, [ROOT.GetLeader]'in birleşik Balkanlar hayaline güvenen özgür Balkan vatandaşları olacaklar."
 bftb_bulgaria_balkan_federation.6.t:0 "[FROM.GetNameDefCap], [ROOT.GetNameDef]'e entegre edildi"
 bftb_bulgaria_balkan_federation.7.a:0 "[FROM.GetAdjective]lere sanayi yardımı sağlamalıyız."
 bftb_bulgaria_balkan_federation.7.desc:0 "[FROM.GetAdjective] hükümeti Birleşik Balkan Federasyonumuza katılmayı kabul etti. Ancak, birleşmeden önce, [FROM.GetNameDef] yetersiz ulusal sanayisini canlandırmak için biraz yardıma ihtiyaç duyuyor. [FROM.GetLeader], ülkenin endüstriyel gelişimi canlandırıldıktan sonra, [FROM.GetNameDef]'in büyük Birleşik Balkan Federasyonu'na memnuniyetle katılacağını temin etti."
 bftb_bulgaria_balkan_federation.7.t:0 "[FROM.GetNameDefCap] Sanayi Yardımı Talep Ediyor"
 bftb_bulgaria_balkan_federation.7_tt:0 "Karar tamamlandığında etkiler:\n"
 bftb_bulgaria_balkan_federation.8.a:0 "[FROM.GetAdjective]lere ekonomik yardım sağlamalıyız."
 bftb_bulgaria_balkan_federation.8.desc:0 "[FROM.GetAdjective] hükümeti Birleşik Balkan Federasyonumuza katılmayı kabul etti, ancak birleşmeden önce, [FROM.GetNameDef] sıkıntılı ekonomisinin çökmesini önlemek için umutsuzca mali yardıma ihtiyaç duyuyor. [FROM.GetLeader], ülke bir ekonomik toparlanma desteği aldıktan ve durum iyileştikten sonra, [FROM.GetNameDef]'in büyük Birleşik Balkan Federasyonu'na memnuniyetle katılacağını temin etti."
 bftb_bulgaria_balkan_federation.8.t:0 "[FROM.GetNameDefCap] Ekonomik Yardım Talep Ediyor"
 bftb_bulgaria_balkan_federation.9.a:0 "[FROM.GetAdjective]lere askeri yardım sağlamalıyız."
 bftb_bulgaria_balkan_federation.9.desc:0 "[FROM.GetAdjective] hükümeti Birleşik Balkan Federasyonumuza katılmayı kabul etti, ancak birleşmeden önce, [FROM.GetNameDef], [FROM.Capital.GetName] çevresindeki çeşitli kırsal kasabalarda birkaç muhalif hücreyi kökünden kazımak için bir operasyon gerçekleştirmeden önce güvenilmez silahlı kuvvetlerini güçlendirmek için biraz askeri yardıma ihtiyaç duyuyor. [FROM.GetLeader], operasyonun tamamlanmasının ardından [FROM.GetNameDef]'in büyük Birleşik Balkan Federasyonu'na memnuniyetle katılacağını temin etti."
 bftb_bulgaria_balkan_federation.9.t:0 "[FROM.GetNameDefCap] Askeri Yardım Talep Ediyor"
 bftb_bulgaria_balkan_federation_project_ready_tt:0 "£GFX_trigger_yes Balkan Federasyonu Projesi hazır."
 bftb_bulgaria_balkan_federation_turkish_states_tt:0 "[BUL.GetFlag]§Y[BUL.GetNameDefCap]§! şunların sahibi ve kontrolcüsü olur: "
 bftb_bulgaria_british_influence.1.a:0 "[BUL.GetNameDef]'i [ENG.GetAdjective] koruması altına alacağız."
 bftb_bulgaria_british_influence.1.b:0 "Bir Saldırmazlık Paktı imzalamayı kabul ediyoruz."
 bftb_bulgaria_british_influence.1.c:0 "İlgilenmemiz gereken daha önemli konular var."
 bftb_bulgaria_british_influence.1.desc:0 "Bulgar Başbakanı [BUL.GetLeader], Bulgar topraklarını koruma taahhüdümüzü resmileştirmeyi amaçlayan bir anlaşmayı [ENG.GetNameDef] ile müzakere etmek için ülkemize geldi. \n[BUL.GetLeader]'e göre, partisi [ENG.GetAdjective] hükümetiyle bağları güçlendirmek istiyor, ancak [GER.GetAdjective]ler, [ITA.GetAdjective]ler ve [SOV.GetAdjective]ler gibi Balkanlar'da tehditkar emelleri olan diğer büyük güçleri reddederlerse [BUL.GetNameDef]'in toprak bütünlüğünden endişe duyuyor."
 bftb_bulgaria_british_influence.1.t:0 "[BUL.GetAdjective] Hükümeti Korumamızı İstiyor"
 bftb_bulgaria_british_influence.2.a:0 "Artık [ENG.GetAdjective] koruması altındayız!"
 bftb_bulgaria_british_influence.2.desc:0 "[FROM.GetAdjective] hükümeti, [BUL.GetLeader] tarafından önerilen antlaşmayı imzalamayı, ülkemizin bağımsızlığını garanti etmeyi ve gelecekte ilişkilerimizi daha da geliştirmeyi kabul etti."
 bftb_bulgaria_british_influence.2.t:0 "[FROM.GetNameDefCap], [BUL.GetAdjective] Bağımsızlığını Garanti Etmeyi Kabul Ediyor"
 bftb_bulgaria_british_influence.3.a:0 "Bu bir başlangıç!"
 bftb_bulgaria_british_influence.3.desc:0 "[FROM.GetAdjective] hükümeti [BUL.GetNameDef] ile [FROM.GetNameDef] arasında bir antlaşma imzalamayı kabul etse de, [FROM.GetLeader] ülkemizin bağımsızlığını resmi olarak garanti etmeyi reddetti ve böyle bir eylemin sadece Balkanlar'da değil, aynı zamanda tüm Avrupa'da durumu daha da kötüleştirebilecek vahim diplomatik sonuçları olabileceğini belirtti. \nAncak, [FROM.GetAdjective] lideri dostane ilişkiler geliştirmeye ve ülkelerimiz arasında iş birliğini teşvik etmeye ilgi duyuyor gibi görünüyor."
 bftb_bulgaria_british_influence.3.t:0 "[FROM.GetNameDefCap] Bir Saldırmazlık Paktı İmzalamayı Kabul Ediyor"
 bftb_bulgaria_british_influence.4.a:0 "Lanet olsun o Britanyalılara ve inatçılıklarına!"
 bftb_bulgaria_british_influence.4.desc:0 "[FROM.GetAdjective] hükümeti, ulusumuzla bağları güçlendirmeye hiç ilgi duymadığını gösterdi ve [BUL.GetNameDef]'in bağımsızlığını desteklemek ve ülkelerimiz arasında iş birliğini geliştirmek için bir anlaşmayı resmileştirme teklifimizi tamamen reddetti."
 bftb_bulgaria_british_influence.4.t:0 "[ENG.GetNameDefCap] Teklifimizi Reddetti"
 bftb_bulgaria_democratic_international_policies.1.a:0 "Ne kadar düşünceliler!"
 bftb_bulgaria_democratic_international_policies.1.desc:0 "[BUL.GetAdjective] hükümeti bugün, dost Balkan uluslarının toprak bütünlüğünü savaş çığırtkanı yabancı güçlerin emellerine karşı korumanın [BUL.GetNameDef]'in görevi olduğunu ilan etti. \nBu amaçla, Başbakan [BUL.GetLeader], [BUL.GetNameDef]'in [ROOT.GetAdjective] ulusunu koruma taahhüdünü ve Balkanların savunmasını hazırlamak için bir dizi yeni önlemin uygulanmasını ilan etti."
 bftb_bulgaria_democratic_international_policies.1.t:0 "[BUL.GetNameDefCap], [ROOT.GetAdjective] Bağımsızlığını Garanti Ediyor"
 bftb_bulgaria_democratic_international_policies.2.a:0 "Siyasetimizi bu kadar kolay etkileyebileceklerini mi sanıyorlar?"
 bftb_bulgaria_democratic_international_policies.2.desc:0 "[BUL.GetAdjective] kodamanları ülkemizde birkaç yatırım yaparak, ulusal sanayimizi canlandıracak bir dizi iştirak geliştirdiler. \nŞüphesiz, bu, [BUL.GetAdjective] hükümetinin ülkemizdeki nüfuzunu artırmak ve kapitalist fikirlerini yaymak için tasarladığı daha büyük bir planın parçasıdır, ancak şimdilik bu küçük sanayi genişlemesinden faydalanabiliriz."
 bftb_bulgaria_democratic_international_policies.2.t:0 "[BUL.GetAdjective] Sanayi Yatırımları"
 bftb_bulgaria_democratic_international_policies.3.a:0 "Dikkatli olmalıyız..."
 bftb_bulgaria_democratic_international_policies.3.desc:0 "[BUL.GetAdjective] hükümeti, ülkemizin finansal sektörlerini istikrara kavuşturmak için zor durumdaki [ROOT.GetAdjective] şirketlerine mali destek sağladı. \nAncak, bakanlarımızdan hiçbiri bu eylemin dayanışma veya sempatiyle motive edilmiş olabileceğine bir saniye bile inanacak kadar saf değil. Bu sermaye enjeksiyonuyla [BUL.GetAdjective] hükümetinin sadece ekonomimiz üzerindeki kontrolünü artırmayı amaçladığı açıktır."
 bftb_bulgaria_democratic_international_policies.3.t:0 "[BUL.GetAdjective] Sermaye Enjeksiyonu"
 bftb_bulgaria_democratic_international_policies.4.a:0 "[ROOT.GetAdjective] hükümeti Bulgar toprak bütünlüğünü tanıyor!"
 bftb_bulgaria_democratic_international_policies.4.b:0 "Bu mümkün değil."
 bftb_bulgaria_democratic_international_policies.4.desc:0 "Bir [BUL.GetNameDef] heyeti, [ROOT.GetLeader]'den şu anda Müttefik birlikleri tarafından işgal edilen eski Bulgar topraklarındaki [BUL.GetAdjective] hükümetinin meşruiyetini tanımasını ve sonuç olarak bölgenin idari kontrolünü [BUL.GetNameDef]'e iade etmesini istemek için ülkemize geldi."
 bftb_bulgaria_democratic_international_policies.4.t:0 "[BUL.GetAdjective] Toprak Bütünlüğü"
 bftb_bulgaria_democratic_international_policies.4_tt:0 "§Y[BUL.GetNameWithFlag]§! şunların sahibi ve kontrolcüsü olur:"
 bftb_bulgaria_democratic_international_policies.5.a:0 "Halkımız bu habere seviniyor!"
 bftb_bulgaria_democratic_international_policies.5.desc:0 "[ENG.GetNameDef]'e gönderdiğimiz heyetimiz, [ENG.GetAdjective] hükümetine yaptığı başvuruda başarılı olduktan sonra geri döndü; hükümet, Müttefik birlikleri tarafından işgal edilen eski Bulgar topraklarının idari kontrolünü [BUL.GetNameDef]'e iade etmeyi kabul etti."
 bftb_bulgaria_democratic_international_policies.5.t:0 "[ENG.GetNameDefCap] Bulgar Toprak Bütünlüğünü Tanıyor"
 bftb_bulgaria_democratic_international_policies.6.a:0 "Toprak bütünlüğümüzü ihlal ediyorlar!"
 bftb_bulgaria_democratic_international_policies.6.desc:0 "Maalesef, [ENG.GetNameDef]'e gönderdiğimiz heyetimiz, [ENG.GetAdjective] hükümetinin, şu anda Müttefik birlikleri tarafından işgal edilen eski Bulgar topraklarının idari kontrolünü bize vermesini sağlayamadı."
 bftb_bulgaria_democratic_international_policies.6.t:0 "[ENG.GetNameDefCap] Bulgar Toprak Bütünlüğünü Tanımayı Reddediyor"
 bftb_bulgaria_democratic_international_policies.7.a:0 "Bu [ROOT.GetNameDef]'e bir hakarettir"
 bftb_bulgaria_democratic_international_policies.7.desc:0 "[ENG.GetAdjective] hükümeti, birliklerimiz tarafından işgal edilen eski Bulgar topraklarının idari kontrolünü, derhal geçerli olmak üzere, [BUL.GetNameDef] hükümetine iade etmeyi kabul ettiğini bildirmek için bir diplomatik heyet gönderdi. \nBu tür olaylar karşısında ve bu kararı [ENG.GetAdjective] ile müzakere etme girişimimizde başarısız olduktan sonra, hükümetimiz müttefiklerimizle samimi bir ilişki sürdürmek için bu işgal altındaki toprakların kontrolünden vazgeçmek zorunda kaldı."
 bftb_bulgaria_democratic_international_policies.7.t:0 "[ENG.GetAdjective]-[BUL.GetAdjective] Paktı"
 bftb_bulgaria_equipment_purchases.1.a:0 "Topçu silahları satın al"
 bftb_bulgaria_equipment_purchases.1.a_tt:0 "§Y[?BUL_quantity_purchased_artillery]§! adet §YÇekili Topçu§! satın alacağız!"
 bftb_bulgaria_equipment_purchases.1.b:0 "Uçaksavar silahları satın al"
 bftb_bulgaria_equipment_purchases.1.b_tt:0 "§Y[?BUL_quantity_purchased_artillery]§! adet §YÇekili Uçaksavar§! satın alacağız!"
 bftb_bulgaria_equipment_purchases.1.c:0 "Tanksavar silahları satın al"
 bftb_bulgaria_equipment_purchases.1.c_tt:0 "§Y[?BUL_quantity_purchased_artillery]§! adet §YÇekili Tanksavar§! satın alacağız!"
 bftb_bulgaria_equipment_purchases.1.desc:0 "[FROM.FROM.GetAdjective] topçu bataryaları satın almak için bir anlaşmaya varmak üzere, önce ne tür bir topçu edinmek istediğimize karar vermeliyiz."
 bftb_bulgaria_equipment_purchases.1.t:0 "[FROM.FROM.GetAdjective] Topçu Satın Al"
 bftb_bulgaria_equipment_purchases.10.desc:0 "Yaklaşık bir yıllık inşaatın ardından, sipariş ettiğimiz [FROM.GetAdjective] hafif kruvazörü birkaç deniz denemesinden geçti ve nihayet Donanmaya resmi olarak dahil edilmeye hazır.\n Gemi [Root.GetAdjective] limanında demirlemiş ve mürettebatı emir bekliyor."
 bftb_bulgaria_equipment_purchases.10.t:0 "Gemi İnşası Tamamlandı - Hafif Kruvazör"
 bftb_bulgaria_equipment_purchases.2.a:0 "Motorize birimler satın al"
 bftb_bulgaria_equipment_purchases.2.a_tt:0 "§Y[?BUL_quantity_purchased_motorized]§! adet §YMotorize§! satın alacağız!"
 bftb_bulgaria_equipment_purchases.2.b:0 "Mekanize araçlar satın al"
 bftb_bulgaria_equipment_purchases.2.b_tt:0 "§Y[?BUL_quantity_purchased_mechanized]§! adet §YMekanize§! satın alacağız!"
 bftb_bulgaria_equipment_purchases.2.c:0 "Zırhlı arabalar satın al"
 bftb_bulgaria_equipment_purchases.2.c_tt:0 "§Y[?BUL_quantity_purchased_armored_car]§! adet §YZırhlı Araba§! satın alacağız!"
 bftb_bulgaria_equipment_purchases.2.desc:0 "[FROM.FROM.GetAdjective] askeri araçları satın almak için bir anlaşmaya varmak üzere, önce ne tür araçlar edinmek istediğimize karar vermeliyiz."
 bftb_bulgaria_equipment_purchases.2.t:0 "[FROM.FROM.GetAdjective] Askeri Araçları Satın Al"
 bftb_bulgaria_equipment_purchases.3.a:0 "Hafif zırhlı satın al"
 bftb_bulgaria_equipment_purchases.3.a_tt:0 "§Y[?BUL_quantity_purchased_light_armor]§! adet §YHafif Tank§! satın alacağız!"
 bftb_bulgaria_equipment_purchases.3.b:0 "Orta zırhlı satın al"
