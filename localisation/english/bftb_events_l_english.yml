 bftb_bulgaria_equipment_purchases.8.desc:0 "Yaklaşık bir yıllık inşaatın ardından, sipariş ettiğimiz üç [FROM.GetAdjective] denizaltısı birkaç deniz denemesinden geçti ve nihayet Donanmaya resmi olarak dahil edilmeye hazır.\n Gemiler [Root.GetAdjective] limanında demirlemiş ve mürettebatları emir bekliyor."
