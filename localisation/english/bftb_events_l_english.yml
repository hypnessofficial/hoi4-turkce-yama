 bftb_bulgaria_equipment_purchases.9.desc:0 "Yaklaşık bir yıllık inşaatın ardından, sipariş ettiğimiz iki [FROM.GetAdjective] muhribi birkaç deniz denemesinden geçti ve nihayet Donanmaya resmi olarak dahil edilmeye hazır.\n Gemiler [Root.GetAdjective] limanında demirlemiş ve mürettebatları emir bekliyor."
 bftb_bulgaria_equipment_purchases.9.t:0 "Gemi İnşası Tamamlandı - Muhripler"
 bftb_bulgaria_factions.10.a:0 "Daha fazla araştırın!"
 bftb_bulgaria_factions.10.b:0 "Bir hamle yapmalarını bekleyelim..."
 bftb_bulgaria_factions.10.desc:0 "Güvenilir kaynaklar, daha önce rejimi başka vesilelerle alenen eleştirmiş olan bazı Zveno üyelerinin yakın zamanda bir dizi askeri subayla temasa geçtiğini bize bildirdi. Bu toplantıların ne için olduğunu veya yaklaştıkları subayların kim olduğunu kesin olarak bilmesek de, Zveno'nun bu şüpheli hareketinin karanlık, daha büyük bir planın parçası olduğuna şüphe yok..."
 bftb_bulgaria_factions.10.t:0 "Zveno Komplosu Ortaya Çıkarıldı"
 bftb_bulgaria_factions.11.a:0 "Ondan derhal kurtulun!"
 bftb_bulgaria_factions.11.b:0 "Aceleci sonuçlara varmamalıyız."
 bftb_bulgaria_factions.11.desc:0 "Kapsamlı bir soruşturma yürüttükten ve rejime sadık birkaç Zveno üyesiyle temasa geçtikten sonra, hükümeti devirmek için bir askeri komplo ortaya çıkardık. \nBu komployla ilişkili kişilerin listesi arasında, en güvendiğimiz generallerden birinin adı gün ışığına çıktı: [?BUL_zveno_conspirator.GetName].\n\nŞimdi bu görünüşte sadakatsiz kişiyle ne yapacağımıza karar vermeliyiz."
 bftb_bulgaria_factions.11.t:0 "Zveno Komplocusu İfşa Edildi"
 bftb_bulgaria_factions.12.a:0 "Onları ezeceğiz!"
 bftb_bulgaria_factions.12.desc:0 "Zveno'nun nihayet uzun zamandır dikkatle hazırladıkları askeri darbe için son düzenlemeleri yapmaya cüret ettikleri haberi bize ulaştı.\n1934'te yaptıkları gibi hükümeti devirmeye çalışacaklar, ama bu sefer başarılı olmalarını engelleyeceğiz ve bu baş belası örgütü kökünden kazıyacağız."
 bftb_bulgaria_factions.12.t:0 "Zveno Darbe Hazırlıkları"
 bftb_bulgaria_factions.17.a:0 "O beyinleri hemen işe koyalım!"
 bftb_bulgaria_factions.17.desc:0 "Nihayet Zveno'yu hükümete entegre ettik, bu eski örgütün üyeleri ile partimiz arasında zaten gelişmekte olan iş birliğini geliştirdik. Bu şekilde, ülkemizdeki en parlak beyinlerden bazılarının birlikte çalıştığı daha büyük projeler için iş birliğini şimdi teşvik edebiliriz."
 bftb_bulgaria_factions.17.t:0 "Zveno Entegre Edildi"
 bftb_bulgaria_factions.19.a:0 "Harika Haber!"
 bftb_bulgaria_factions.19.desc:0 "Geçtiğimiz birkaç hafta boyunca, polis güçleri, bu operasyondan önce yaptığımız tutuklamalardan sonra güçlü bir liderlik eksikliği nedeniyle zaten ciddi şekilde zayıflamış ve düzensizleşmiş olan Zveno'nun kalıntılarını temizliyordu.\nArtık [ROOT.GetNameDef]'de Zveno'nun varlığının sona erdiğini güvenle söyleyebiliriz, ki bu sadece ülkeye ve hükümetine fayda sağlayabilir."
 bftb_bulgaria_factions.19.t:0 "Zveno Yok Edildi!"
 bftb_bulgaria_factions.20.a:0 "Açlık sonunda onları sürüye geri getirecektir"
 bftb_bulgaria_factions.20.b:0 "Ne pahasına olursa olsun onları ezmeliyiz!"
 bftb_bulgaria_factions.20.desc:0 "Geniş Sosyalistler grubunun üyeleri, sanayi işçileri arasında ulusal grevleri ateşleme çabalarında komünistlere katıldılar. Gizli toplantılar ve buluşmalar yoluyla Bulgar proletaryası arasında büyük destek ve sempati toplamayı başardılar.\nBu grevcilerin en popüler olduğu bölgelerde düzeni sağlarken dikkatli ilerlemeliyiz, aksi takdirde durum sadece grevlerden daha ciddi bir şeye tırmanabilir..."
 bftb_bulgaria_factions.20.t:0 "İşçi Grevleri"
 bftb_bulgaria_factions.21.a:0 "Talihsiz bir sonuç..."
 bftb_bulgaria_factions.21.desc:0 "Grevcilere karşı kuvvetlerimizin müdahalesinin ardından, sanayi bölgeleri arasında şiddetli çatışmalar ve isyanlar yayıldı. [?BUL.BUL_damaged_civs_state.GetName]'da, isyanlar bir dizi sivil fabrikaya zarar verdi[GetMilitaryFactoriesDamaged][GetInfrastructureDamaged]."
 bftb_bulgaria_factions.21.t:0 "İsyanlar Tali Hasara Neden Oldu"
 bftb_bulgaria_factions.27.a:0 "Büyüklüğe ulaşmak için birbirimize ihtiyacımız var!"
 bftb_bulgaria_factions.27.desc:0 "Nihayet Geniş Sosyalistleri hükümete entegre ettik, bu eski örgütün üyeleri ile partimiz arasında zaten gelişmekte olan iş birliğini geliştirdik. Bu şekilde, ülkemizdeki en parlak beyinlerden bazılarının birlikte çalıştığı daha büyük projeler için iş birliğini şimdi teşvik edebiliriz."
 bftb_bulgaria_factions.27.t:0 "Geniş Sosyalistler Entegre Edildi"
 bftb_bulgaria_factions.29.a:0 "Biraz zaman aldı..."
 bftb_bulgaria_factions.29.desc:0 "Geçtiğimiz birkaç hafta boyunca, polis güçleri, bu operasyondan önce yaptığımız tutuklamalardan sonra güçlü bir liderlik eksikliği nedeniyle zaten ciddi şekilde zayıflamış ve düzensizleşmiş olan Geniş Sosyalistlerin kalıntılarını temizliyordu.\nArtık [ROOT.GetNameDef]'de Geniş Sosyalistlerin varlığının sona erdiğini güvenle söyleyebiliriz, ki bu sadece ülkeye ve hükümetine fayda sağlayabilir."
 bftb_bulgaria_factions.29.t:0 "Geniş Sosyalistler Yok Edildi"
 bftb_bulgaria_factions.30.a:0 "Tamamen kabul edilemez!"
 bftb_bulgaria_factions.30.desc:0 "Ulusal Çiftçi Birliği, ülkenin kırsal bölgelerinde yasa dışı bir propaganda kampanyası yürütüyor; burada binlerce çiftçi hükümete güvensizlik duymaya ve saflarına katılmaya manipüle ediliyor.\nÇiftçiler özellikle geçmişin, Bulgaristan'a yıkım ve aşağılanma getiren savaşçı politikalarını eleştiriyor ve nüfus arasında hoşnutsuzluk ve belirsizlik yaratmak için mevcut hükümetin politikalarıyla ufak benzerlikler bulmaya çalışıyorlar."
 bftb_bulgaria_factions.30.t:0 "Çiftçilerin Popülaritesi Kırsalda Artıyor"
 bftb_bulgaria_factions.31.a:0 "Sinir bozucu fareler!"
 bftb_bulgaria_factions.31.desc:0 "Çiftçiler ve Komünistlerin daha önce harika bir iş birliği geçmişi olmamasına rağmen, görünüşe göre hükümeti devirmede ortak bir amaç bulmak, Ulusal Çiftçi Birliği'nin belirli kanatlarını ve Komünist Parti'yi birleştirmeyi başardı.\nÇiftçilerden bazıları örgütü terk edip komünistlere katılmaya karar verirken, diğerleri, daha muhafazakar olanlar, hem burjuvaziye karşı mücadelelerine hem de Bolşevizm'i reddetmelerine sadık kalarak, hükümetle bir anlayışa ulaşmak için siyasi yollar bulmaya çalışıyorlar."
 bftb_bulgaria_factions.31.t:0 "Ulusal Çiftçi Birliği İçinde Bölünme"
 bftb_bulgaria_factions.37.a:0 "Bu ülkeye büyük faydalar getirecek."
 bftb_bulgaria_factions.37.desc:0 "Nihayet Ulusal Çiftçi Birliği'ni hükümete entegre ettik, bu eski örgütün üyeleri ile partimiz arasında zaten gelişmekte olan iş birliğini geliştirdik. Bu şekilde, ülkemizdeki en parlak beyinlerden bazılarının birlikte çalıştığı daha büyük projeler için iş birliğini şimdi teşvik edebiliriz."
 bftb_bulgaria_factions.37.t:0 "Ulusal Çiftçi Birliği Entegre Edildi"
 bftb_bulgaria_factions.39.a:0 "Tamamen gittiler!"
 bftb_bulgaria_factions.39.desc:0 "Geçtiğimiz birkaç hafta boyunca, polis güçleri, bu operasyondan önce yaptığımız tutuklamalardan sonra güçlü bir liderlik eksikliği nedeniyle zaten ciddi şekilde zayıflamış ve düzensizleşmiş olan Ulusal Çiftçi Birliği'nin kalıntılarını temizliyordu.\nArtık [ROOT.GetNameDef]'de Ulusal Çiftçi Birliği'nin varlığının sona erdiğini güvenle söyleyebiliriz, ki bu sadece ülkeye ve hükümetine fayda sağlayabilir."
 bftb_bulgaria_factions.39.t:0 "Ulusal Çiftçi Birliği Yok Edildi"
 bftb_bulgaria_factions.40.a:0 "Bu orijinal bir protesto bile değil!"
 bftb_bulgaria_factions.40.b:0 "Daha büyük bir tehdit haline gelmeden onları susturmalıyız"
 bftb_bulgaria_factions.40.desc:0 "Ulusal Sosyal Hareket, popülaritesini artırmak için yıllar önce Genç Bulgar Lejyonları Birliği'nin kullandığı yöntemleri taklit ederek, [Root.Capital.GetName]'dan [GetMarchDestinationName]'e bir yürüyüş düzenledi.\nNazilerin yaptığı gibi meşalelerle yürüyen protestocular, yıkıcı Bolşevik gruplarını ezmek ve ortadan kaldırmak için daha sert önlemler, sınıf mücadelesine karşı ulusal bir işçi sendikası kurulmasını ve Bulgar ekonomisi ile toplumuna daha aktif devlet müdahalesini talep ediyorlar.\nŞimdiye kadar yürüyüşün şehir gençliği arasında oldukça popüler olduğu görülüyor, bu yüzden bu tür gösterileri durdurmak istiyorsak, bunu er ya da geç yapsak iyi olur."
 bftb_bulgaria_factions.40.t:0 "[GetMarchDestinationName]'e Yürüyüş"
 bftb_bulgaria_factions.47.a:0 "Daha iyiye gittiğini söyleyip duruyoruz..."
 bftb_bulgaria_factions.47.desc:0 "Nihayet Ulusal Sosyal Hareketi hükümete entegre ettik, bu eski örgütün üyeleri ile partimiz arasında zaten gelişmekte olan iş birliğini geliştirdik. Bu şekilde, ülkemizdeki en parlak beyinlerden bazılarının birlikte çalıştığı daha büyük projeler için iş birliğini şimdi teşvik edebiliriz."
 bftb_bulgaria_factions.47.t:0 "Ulusal Sosyal Hareket Entegre Edildi"
 bftb_bulgaria_factions.49.a:0 "Kimse onları özlemeyecek!"
 bftb_bulgaria_factions.49.desc:0 "Geçtiğimiz birkaç hafta boyunca, polis güçleri, bu operasyondan önce yaptığımız tutuklamalardan sonra güçlü bir liderlik eksikliği nedeniyle zaten ciddi şekilde zayıflamış ve düzensizleşmiş olan Ulusal Sosyal Hareketin kalıntılarını temizliyordu.\nArtık [ROOT.GetNameDef]'de Ulusal Sosyal Hareketin varlığının sona erdiğini güvenle söyleyebiliriz, ki bu sadece ülkeye ve hükümetine fayda sağlayabilir."
 bftb_bulgaria_factions.49.t:0 "Nasyonal Sosyalist Hareket Yok Edildi"
 bftb_bulgaria_factions.50.a:0 "Hak ettiklerini buldular"
 bftb_bulgaria_factions.50.desc:0 "Zveno örgütüne başarılı bir şekilde baskı yaptık, [ROOT.GetLeader]'e karşı alenen konuştuğu veya hatta hükümeti devirmek için komplo kurduğu bildirilen üyeleri tutukladık."
 bftb_bulgaria_factions.50.t:0 "Zveno Üyelerine Baskı Uygulandı"
 bftb_bulgaria_factions.51.a:0 "Harika haber!"
 bftb_bulgaria_factions.51.desc:0 "Güvenlik güçlerimiz Zveno örgütüne karşı kitlesel bir baskı eylemi gerçekleştirdi. Operasyon başkanı, polis memurlarının örgütün gizli bir toplantısı sırasında çok sayıda baş belası kişiyi yakalamayı başardığını iddia ediyor ve operasyonun sonucunu son derece başarılı buluyor."
 bftb_bulgaria_factions.51.t:0 "Zveno Üyelerine Baskı Uygulandı"
 bftb_bulgaria_factions.52.a:0 "Ne kadar utanç verici..."
 bftb_bulgaria_factions.52.desc:0 "Zveno örgütüne baskı yapma girişimimiz maalesef başarısız oldu. Polis, Zveno'nun hükümete karşı komplo kurduğu gizli bir toplantı olduğuna inandıkları bir yere baskın yaptı, ancak Zveno üyeleri orada olsa da, toplantının ne örgütleriyle ne de siyasetle bir ilgisi vardı. \nBu polis eyleminin Bulgar halkı arasında pek popüler olmadığını ve Zveno arasında daha da az popüler olduğunu söylemeye gerek yok..."
 bftb_bulgaria_factions.52.t:0 "Zveno Üyelerine Baskı Uygulandı"
 bftb_bulgaria_factions.53.a:0 "Artık daha fazla sorun çıkaramayacaklar!"
 bftb_bulgaria_factions.53.desc:0 "Zveno liderlerini yakalama operasyonu başarılı oldu. Kimon Georgiev'in kendisi de dahil olmak üzere birçok önemli şahsiyet tutuklandı ve örgüte kritik bir darbe indirildi."
 bftb_bulgaria_factions.53.t:0 "Zveno Liderlerini Hapse Atma Operasyonu"
 bftb_bulgaria_factions.54.a:0 "Hayal kırıklığı yaratan bir sonuç..."
 bftb_bulgaria_factions.54.desc:0 "Zveno liderlerini yakalama operasyonu beklediğimiz kadar başarılı olmadı. Polis güçleri bazı önemli kişileri tutuklasa da, örgütün lideri Kimon Georgiev kaçmayı başardı ve şimdi saklanmasına rağmen Zveno'yu yönetmeye devam ediyor."
 bftb_bulgaria_factions.54.t:0 "Zveno Liderlerini Hapse Atma Operasyonu"
 bftb_bulgaria_factions.55.a:0 "Bu başarısızlığın bedelini biri ödemeli!"
 bftb_bulgaria_factions.55.desc:0 "Zveno liderlerini tutuklama operasyonu tam bir başarısızlık oldu. Polis güçleri gizli bir toplantıya baskın yaptı, ancak sayıca çok az olan ajanlar katılımcıları bastıramadı, katılımcılar hızla olay yerinden kaçarak polis tarafından takip edildi, şehrin sokaklarında şiddetli bir çatışmaya neden oldu ve birçok masum vatandaşın yaralanmasına yol açtı. Polisin bu tür bir vahşeti karşısında, bölgedeki birçok sivil Zveno'ya sempati duymaktan kendini alamadı, örgüt üyelerinin kaçmasına yardım etti ve hatta devlet güçlerine karşı mücadeleye katıldı."
 bftb_bulgaria_factions.55.t:0 "Zveno Liderlerini Hapse Atma Operasyonu"
 bftb_bulgaria_factions.60.a:0 "Hak ettiklerini buldular"
 bftb_bulgaria_factions.60.desc:0 "Geniş Sosyalistlere başarılı bir şekilde baskı yaptık, halk arasında protestoları kışkırtmaya veya isyanları provoke etmeye çalıştığı bildirilen üyeleri tutukladık."
 bftb_bulgaria_factions.60.t:0 "Geniş Sosyalistlere Baskı Uygulandı"
 bftb_bulgaria_factions.61.a:0 "Harika haber!"
 bftb_bulgaria_factions.61.desc:0 "Güvenlik güçlerimiz Geniş Sosyalistlere karşı kitlesel bir baskı eylemi gerçekleştirdi. Polis memurlarının, Geniş Sosyalistlerin birçok liderinin işçi örgütleri ve hatta komünist parti üyeleriyle bir araya geldiği gizli bir toplantı sırasında çok sayıda baş belası kişiyi yakalamayı başardığı bildirildi. Polis şefi, operasyonun sonucunun son derece başarılı olduğunu iddia ediyor."
 bftb_bulgaria_factions.61.t:0 "Geniş Sosyalistlere Baskı Uygulandı"
 bftb_bulgaria_factions.62.a:0 "Ne kadar utanç verici..."
 bftb_bulgaria_factions.62.desc:0 "Geniş Sosyalistlere baskı yapma girişimimiz maalesef başarısız oldu. Polis, Geniş Sosyalistlerin işçi örgütleri ve komünist parti üyeleriyle yeni endüstriyel grevler düzenlemek için bir araya geldiği gizli bir toplantı olduğuna inandıkları bir yere şiddetle baskın yaptı, ancak Geniş Sosyalistlerin sadece Todor Pavlov'un diyalektik materyalizm üzerine bir dersini dinlediği ortaya çıktı, bu da gösterişli polis gösterisini tamamen işe yaramaz hale getirdi. \nBu polis eyleminin Bulgar halkı arasında pek popüler olmadığını ve Geniş Sosyalistler arasında daha da az popüler olduğunu söylemeye gerek yok..."
 bftb_bulgaria_factions.62.t:0 "Geniş Sosyalistlere Baskı Uygulandı"
 bftb_bulgaria_factions.63.a:0 "Artık daha fazla sorun çıkaramayacaklar!"
 bftb_bulgaria_factions.63.desc:0 "Geniş Sosyalistlerin liderlerini yakalama operasyonu başarılı oldu. Polis güçleri, örgütle ilgili önemli şahsiyetlerin çoğunu gözaltına alarak Geniş Sosyalistlere kritik bir darbe vurdu."
 bftb_bulgaria_factions.63.t:0 "Geniş Sosyalistlerin Liderlerini Hapse Atma Operasyonu"
 bftb_bulgaria_factions.64.a:0 "Hayal kırıklığı yaratan bir sonuç..."
 bftb_bulgaria_factions.64.desc:0 "Geniş Sosyalistlerin liderlerini yakalama operasyonu beklediğimiz kadar başarılı olmadı. Polis güçleri bazı önemli kişileri tutuklasa da, örgütün birkaç lideri kaçmayı başardı ve saklanmalarına rağmen Geniş Sosyalistleri yönetmeye devam ediyorlar."
 bftb_bulgaria_factions.64.t:0 "Geniş Sosyalistlerin Liderlerini Hapse Atma Operasyonu"
 bftb_bulgaria_factions.65.a:0 "Bu başarısızlığın bedelini biri ödemeli!"
 bftb_bulgaria_factions.65.desc:0 "Geniş Sosyalistlerin liderlerini tutuklama operasyonu tam bir başarısızlık oldu. Polis güçleri gizli bir toplantıya baskın yaptı, ancak sayıca çok az olan ajanlar katılımcıları bastıramadı, katılımcılar hızla kaçarak proleter yoldaşlarından destek aradılar, şehrin sokaklarında şiddetli bir çatışmaya neden oldu ve birçok masum vatandaşın yaralanmasına yol açtı. Polisin bu tür bir vahşeti karşısında, bölgedeki birçok sivil Geniş Sosyalistlere sempati duymaktan kendini alamadı, örgüt üyelerinin kaçmasına yardım etti ve hatta devlet güçlerine karşı mücadeleye katıldı."
 bftb_bulgaria_factions.65.t:0 "Geniş Sosyalistlerin Liderlerini Hapse Atma Operasyonu"
 bftb_bulgaria_factions.70.a:0 "Hak ettiklerini buldular"
 bftb_bulgaria_factions.70.desc:0 "Ulusal Çiftçi Birliği'ne başarılı bir şekilde baskı yaptık, hükümete karşı alenen konuştuğu veya halk arasında protestoları kışkırtmaya çalıştığı bildirilen üyeleri tutukladık."
 bftb_bulgaria_factions.70.t:0 "Çiftçi Birliği Üyelerine Baskı Uygulandı"
 bftb_bulgaria_factions.71.a:0 "Harika haber!"
 bftb_bulgaria_factions.71.desc:0 "Güvenlik güçlerimiz Ulusal Çiftçi Birliği'ne karşı kitlesel bir baskı eylemi gerçekleştirdi. Polis, Bulgaristan genelinde farklı kasabalarda aynı anda gerçekleşen ve kırsal kesim halkı arasında huzursuzluk yaratmayı amaçlayan birkaç Çiftçi Birliği mitingine baskın yaptı. Resmi polis raporları, sonucun son derece başarılı olduğunu iddia ediyor."
 bftb_bulgaria_factions.71.t:0 "Çiftçi Birliği Üyelerine Baskı Uygulandı"
 bftb_bulgaria_factions.72.a:0 "Ne kadar utanç verici..."
 bftb_bulgaria_factions.72.desc:0 "Ulusal Çiftçi Birliği'ne baskı yapma girişimimiz maalesef başarısız oldu. Polis, kırsalda Çiftçi Birliği liderlerinin çiftçileri hükümete karşı kışkırttığı gizli bir miting olduğuna inandıkları bir yere baskın yaptı, ancak etkinliğin sadece Aleksandar Stamboliyski'nin “Siyasi Partiler mi Yoksa Devletçi Örgütler mi” kitabı üzerine bir ders olduğu ortaya çıktı, bu da polis gösterisini tamamen işe yaramaz hale getirdi. \nBu polis eyleminin Bulgar halkı arasında pek popüler olmadığını ve Çiftçi Birliği arasında daha da az popüler olduğunu söylemeye gerek yok..."
 bftb_bulgaria_factions.72.t:0 "Çiftçi Birliği Üyelerine Baskı Uygulandı"
 bftb_bulgaria_factions.73.a:0 "Artık daha fazla sorun çıkaramayacaklar!"
 bftb_bulgaria_factions.73.desc:0 "Ulusal Çiftçi Birliği liderlerini yakalama operasyonu başarılı oldu. Polis güçleri, Nikola Petkov'un kendisi de dahil olmak üzere örgütle ilgili önemli şahsiyetlerin çoğunu gözaltına alarak Çiftçi Birliği'ne kritik bir darbe vurdu."
 bftb_bulgaria_factions.73.t:0 "Çiftçi Birliği Liderlerini Hapse Atma Operasyonu"
 bftb_bulgaria_factions.74.a:0 "Hayal kırıklığı yaratan bir sonuç..."
 bftb_bulgaria_factions.74.desc:0 "Ulusal Çiftçi Birliği liderlerini yakalama operasyonu beklediğimiz kadar başarılı olmadı. Polis güçleri bazı önemli kişileri tutuklasa da, Nikola Petkov kaçmayı başardı ve saklanmasına rağmen örgütü yönetmeye devam ediyor."
 bftb_bulgaria_factions.74.t:0 "Çiftçi Birliği Liderlerini Hapse Atma Operasyonu"
 bftb_bulgaria_factions.75.a:0 "Bu başarısızlığın bedelini biri ödemeli!"
 bftb_bulgaria_factions.75.desc:0 "Ulusal Çiftçi Birliği liderlerini tutuklama operasyonu tam bir başarısızlık oldu. Polis güçleri gizli bir toplantıya baskın yaptı, ancak sayıca çok az olan ajanlar katılımcıları bastıramadı, katılımcılar hızla olay yerinden kaçarak kasabada halk desteği aradılar, şehrin sokaklarında şiddetli bir çatışmaya neden oldu ve birçok masum vatandaşın yaralanmasına yol açtı. Polisin bu tür bir vahşeti karşısında, bölgedeki birçok sivil Çiftçi Birliği'ne sempati duymaktan kendini alamadı, örgüt üyelerinin kaçmasına yardım etti ve hatta devlet güçlerine karşı mücadeleye katıldı."
 bftb_bulgaria_factions.75.t:0 "Çiftçi Birliği Liderlerini Hapse Atma Operasyonu"
 bftb_bulgaria_factions.80.a:0 "Hak ettiklerini buldular"
 bftb_bulgaria_factions.80.desc:0 "Ulusal Sosyal Hareket'e başarılı bir şekilde baskı yaptık, belirli örgütlere ve hatta [ROOT.GetLeader]'in kendisine karşı alenen nefret söyleminde bulunarak kışkırtma yaratmaya çalıştığı bildirilen üyeleri tutukladık."
 bftb_bulgaria_factions.80.t:0 "Ulusal Sosyal Hareket Üyelerine Baskı Uygulandı"
 bftb_bulgaria_factions.81.a:0 "Harika haber!"
 bftb_bulgaria_factions.81.desc:0 "Güvenlik güçlerimiz Ulusal Sosyal Hareket'e karşı kitlesel bir baskı eylemi gerçekleştirdi. Polis, Ulusal Sosyal Hareket'in birkaç baş belası liderinin [ROOT.GetLeader]'e karşı nefret söyleminde bulunduğu ve hükümete karşı bir sonraki yürüyüşlerini organize ettiği büyük bir mitinge baskın yaptı. Bu radikallerin çoğu yakalandı ve resmi raporlar operasyonun sonucunun son derece başarılı olduğunu iddia ediyor."
 bftb_bulgaria_factions.81.t:0 "Ulusal Sosyal Hareket Üyelerine Baskı Uygulandı"
 bftb_bulgaria_factions.82.a:0 "Ne kadar utanç verici..."
 bftb_bulgaria_factions.82.desc:0 "Ulusal Sosyal Hareket'e baskı yapma girişimimiz maalesef başarısız oldu. Polis, bir sonraki faşist yürüyüşü organize etmek için gizli bir mitingin gerçekleştiğine inandıkları örgütün karargahına baskın yaptı, ancak etkinliğin sadece Aleksandar Tsankov'un kendisi tarafından düzenlenen modern ekonomi politikaları üzerine bir konferans olduğu ortaya çıktı, bu da polis gösterisini tamamen işe yaramaz hale getirdi. \nBu polis eyleminin Bulgar halkı arasında pek popüler olmadığını ve Ulusal Sosyal Hareket arasında daha da az popüler olduğunu söylemeye gerek yok..."
 bftb_bulgaria_factions.82.t:0 "Ulusal Sosyal Hareket Üyelerine Baskı Uygulandı"
 bftb_bulgaria_factions.83.a:0 "Artık daha fazla sorun çıkaramayacaklar!"
 bftb_bulgaria_factions.83.desc:0 "Ulusal Sosyal Hareket liderlerini yakalama operasyonu başarılı oldu. Polis güçleri, Aleksandar Tsankov'un kendisi de dahil olmak üzere örgütle ilgili önemli şahsiyetlerin çoğunu gözaltına alarak örgüte kritik bir darbe vurdu."
 bftb_bulgaria_factions.83.t:0 "Ulusal Sosyal Hareket Liderlerini Hapse Atma Operasyonu"
 bftb_bulgaria_factions.84.a:0 "Hayal kırıklığı yaratan bir sonuç..."
 bftb_bulgaria_factions.84.desc:0 "Ulusal Sosyal Hareket liderlerini yakalama operasyonu beklediğimiz kadar başarılı olmadı. Polis güçleri bazı önemli kişileri tutuklasa da, Aleksandar Tsankov kaçmayı başardı ve saklanmasına rağmen örgütü yönetmeye devam ediyor."
 bftb_bulgaria_factions.84.t:0 "Ulusal Sosyal Hareket Liderlerini Hapse Atma Operasyonu"
 bftb_bulgaria_factions.85.a:0 "Bu başarısızlığın bedelini biri ödemeli!"
 bftb_bulgaria_factions.85.desc:0 "Ulusal Sosyal Hareket liderlerini tutuklama operasyonu tam bir başarısızlık oldu. Polis güçleri gizli bir toplantıya baskın yaptı, ancak sayıca çok az olan ajanlar katılımcıları bastıramadı, katılımcılar hızla olay yerinden kaçarak polis tarafından takip edildi, şehrin sokaklarında şiddetli bir çatışmaya neden oldu ve birçok masum vatandaşın yaralanmasına yol açtı. Polisin bu tür bir vahşeti karşısında, bölgedeki birçok sivil Ulusal Sosyal Hareket'e sempati duymaktan kendini alamadı, örgüt üyelerinin kaçmasına yardım etti ve hatta devlet güçlerine karşı mücadeleye katıldı."
 bftb_bulgaria_factions.85.t:0 "Ulusal Sosyal Hareket Liderlerini Hapse Atma Operasyonu"
 bftb_bulgaria_fate_of_the_balkans.1.a:0 "[ROOT.GetNameDefCap], [BUL.GetFactionName]'e katılacaktır"
 bftb_bulgaria_fate_of_the_balkans.1.b:0 "Boş tehditlere boyun eğmeyeceğiz!"
 bftb_bulgaria_fate_of_the_balkans.1.desc:0 "Bugün başkente bir [BUL.GetAdjective] elçisi geldi ve [ROOT.GetLeader] ile görüşerek temelde [ROOT.GetNameDef]'in [BUL.GetFactionName]'e üyeliğini talep etti. [GetBulgarianLeader]'e göre, [BUL.GetNameDef] araştırma ve savunma konularında iş birliği programları geliştirecek ve ittifakın tüm üye devletlerinin güvenliğini ve egemenliğini garanti edecek. Ancak, diplomat uyardı, ittifaka katılmayı reddeden herhangi bir Balkan ulusu düşman kabul edilecektir."
 bftb_bulgaria_fate_of_the_balkans.1.t:0 "[BUL.GetNameDefCap], [BUL.GetFactionName]'e Katılmamızı Talep Ediyor"
 bftb_bulgaria_fate_of_the_balkans.10.a:0 "[BUL.GetNameDef] bunun bedelini ödeyecek!"
 bftb_bulgaria_fate_of_the_balkans.10.b:0 "Acınası bir liderden acınası bir seçim..."
 bftb_bulgaria_fate_of_the_balkans.10.desc:0 "[BUL.GetAdjective] hükümetinden bir ültimatom aldıktan sonra, [FROM.GetNameDef]'den [FROM.GetLeader], ülkesine, bakanlarına ve hatta kendisine yönelik tehditlerle açıkça zorlanarak, [BUL.GetAdjective] baskısına boyun eğdi ve [FROM.GetNameDef]'in derhal [ROOT.GetFactionName]'den ayrılıp [BUL.GetFactionName]'e katılacağını duyurdu."
 bftb_bulgaria_fate_of_the_balkans.10.t:0 "[BUL.GetNameDefCap], [FROM.GetNameDef]'i [BUL.GetFactionName]'e Katılmaya Zorladı"
 bftb_bulgaria_fate_of_the_balkans.2.a:0 "[BUL.GetFactionName] büyüyor!"
 bftb_bulgaria_fate_of_the_balkans.2.desc:0 "[FROM.GetName]'ın hükümetini [BUL.GetFactionName]'e katılmaya ikna etmek için gönderilen elçi, bugün [FROM.GetAdjective] başkentinden iyi haberlerle döndü: [FROM.GetLeader] taleplerimizi kabul etti ve [FROM.GetHerHis] ülkesi nihayet ittifakımıza katıldı."
 bftb_bulgaria_fate_of_the_balkans.2.t:0 "[FROM.GetNameDefCap], [BUL.GetFactionName]'e Katılmayı Kabul Ediyor"
 bftb_bulgaria_fate_of_the_balkans.3.a:0 "[FROM.GetLeader] bir aptal olduğunu kanıtladı..."
 bftb_bulgaria_fate_of_the_balkans.3.desc:0 "[FROM.GetName]'ın [BUL.GetFactionName]'e bağlılığını talep etmek için gönderilen elçi, [FROM.GetLeader]'in ittifakımıza katılmamaya karar verdiğini bildirdi, görünüşe göre diplomatımızın uyarılarına rağmen [BUL.GetAdjective] komutlarına meydan okuduğu için [FROM.GetNameDef]'i bekleyen kaderi fark edemedi."
 bftb_bulgaria_fate_of_the_balkans.3.t:0 "[FROM.GetNameDefCap], [BUL.GetFactionName]'e Katılmayı Reddediyor"
 bftb_bulgaria_fate_of_the_balkans.4.a:0 "Reddedecek bir konumda değiliz..."
 bftb_bulgaria_fate_of_the_balkans.4.b:0 "Bu olmayacak!"
 bftb_bulgaria_fate_of_the_balkans.4.desc:0 "Bir [BUL.GetAdjective] diplomatik misyonu[GetBulgarianLeaderDiplomaticMission], iddia ettikleri gibi meşru olarak kendisine ait olan [FROM.FROM.GetName]'ın [BUL.GetNameDef]'e devrini müzakere etmek için başkentimize geldi."
 bftb_bulgaria_fate_of_the_balkans.4.t:0 "[BUL.GetNameDefCap], [FROM.FROM.GetName]'ı Talep Ediyor"
 bftb_bulgaria_fate_of_the_balkans.5.a:0 "[FROM.FROM.FROM.GetName] nihayet ait olduğu yere geri döndü"
 bftb_bulgaria_fate_of_the_balkans.5.desc:0 "[FROM.GetAdjective] başkentine gönderilen [BUL.GetAdjective] diplomatik misyonuyla uzun bir görüşmenin ardından, [FROM.GetLeader], [FROM.FROM.FROM.GetName]'ı Bulgaristan'a devretmeyi kabul etti."
 bftb_bulgaria_fate_of_the_balkans.5.t:0 "[FROM.GetNameDefCap], [FROM.FROM.FROM.GetName] Üzerinde [BUL.GetAdjective] Kontrolünü Kabul Ediyor"
 bftb_bulgaria_fate_of_the_balkans.6.a:0 "[FROM.GetLeader]'den aptalca bir karar..."
 bftb_bulgaria_fate_of_the_balkans.6.desc:0 "[FROM.GetAdjective] başkentine gönderilen [BUL.GetAdjective] diplomatik misyonuyla saatler süren hararetli bir tartışmanın ardından, [FROM.GetLeader] inatla [FROM.FROM.FROM.GetName]'ı [BUL.GetNameDef]'e devretmeyi reddetti."
 bftb_bulgaria_fate_of_the_balkans.6.t:0 "[FROM.GetNameDefCap], [FROM.FROM.FROM.GetName]'ı [BUL.GetNameDef]'e Devretmeyi Reddediyor"
 bftb_bulgaria_fate_of_the_balkans.7.a:0 "Reddedecek bir konumda değiliz..."
 bftb_bulgaria_fate_of_the_balkans.7.b:0 "[ROOT.GetNameDefCap] asla yabancı güçlere boyun eğmeyecektir!"
 bftb_bulgaria_fate_of_the_balkans.7.desc:0 "Nihayet, [BUL.GetAdjective] hükümeti gerçek niyetini gösterdi ve [BUL.GetNameDef]'in [ROOT.GetNameDef]'in hakim devleti olarak tanınmasını talep etmek için bir heyet gönderdi; bu da [ROOT.GetAdjective] hükümetinin [GetBulgarianLeader]'in yönetimine koşulsuz boyun eğmesi anlamına gelecektir."
 bftb_bulgaria_fate_of_the_balkans.7.t:0 "[BUL.GetNameDefCap], [ROOT.GetAdjective]'in Boyun Eğmesini Talep Ediyor"
 bftb_bulgaria_fate_of_the_balkans.8.a:0 "[FROM.GetAdjective]ler yerlerini biliyor."
 bftb_bulgaria_fate_of_the_balkans.8.desc:0 "[FROM.GetNameDef]'in [BUL.GetFactionName]'e girişinden bu yana, hükümetlerine [GetBulgarianLeader]'e boyun eğmeleri için lobi yaptık ve son zamanlarda birkaç [FROM.GetAdjective] bakana rüşvet ve baskı uygulamamızın ardından, [FROM.GetLeader], [BUL.GetNameDef]'i resmen hakim devleti olarak tanıyan bir antlaşma imzalamak zorunda kaldı ve bu sayede [FROM.GetAdjective] halkı nihayet boyun eğdirildi."
 bftb_bulgaria_fate_of_the_balkans.8.t:0 "[FROM.GetNameDefCap], [BUL.GetNameDef]'e Boyun Eğiyor"
 bftb_bulgaria_fate_of_the_balkans.9.a:0 "Onlara baskı yapmaya devam etmeliyiz!"
 bftb_bulgaria_fate_of_the_balkans.9.a_cooldown_tt:0 "§Y[FROM.GetName]'ı Boyunduruk Altına Alma§! kararı §R365 gün§! sonra tekrar kullanılabilir olacak!"
 bftb_bulgaria_fate_of_the_balkans.9.b:0 "Meydan okumaları cezasız kalmayacak!"
 bftb_bulgaria_fate_of_the_balkans.9.desc:0 "Beklenmedik bir şekilde, [FROM.GetAdjective] hükümeti [GetBulgarianLeader]'e meydan okumaya karar verdi. [FROM.GetLeader] bugün, [BUL.GetAdjective] hükümetine boyun eğmeyi reddettiğini kamuoyuna açıkladı. Cesur bir karar, [FROM.GetAdjective] halkının çoğunluğu tarafından destekleniyor, ama yine de pervasızca, çünkü acınası devletleri yaklaşan çatışmalardan sağ çıkacaksa bizim korumamıza ihtiyaçları var ve bundan sonra, [GetBulgarianLeader] [FROM.GetAdjective]'in [BUL.GetFactionName]'deki üyeliğini şimdiden yeniden değerlendiriyor..."
 bftb_bulgaria_fate_of_the_balkans.9.t:0 "[FROM.GetNameDefCap], [BUL.GetNameDef]'e Boyun Eğmeyi Reddediyor"
 bftb_bulgaria_fatherland_front.1.a:0 "Birlikte daha güçlüyüz!"
 bftb_bulgaria_fatherland_front.1.b:0 "Başarısızlığa mahkûm başka bir komünist hilesi"
 bftb_bulgaria_fatherland_front.1.desc_negative:0 "Komünistler, diğer örgütlerden üyelerle birlikte, proletarya içinde tehlikeli bir şekilde popüler hale gelen ve yakın gelecekte hükümeti devirme tehdidi bile oluşturabilecek bir siyasi direniş hareketi olan Vatan Cephesi'ni kurdular."
 bftb_bulgaria_fatherland_front.1.desc_positive:0 "Sonunda, Bulgaristan'daki Alman yanlısı militarist diktatörlüğe karşı tek bir cephede geniş ölçüde zıt siyasi ve ideolojik grupları birleştirme yönündeki büyük çabalarımızın meyvelerini toplayabiliriz.\nSadece Komünist Parti tarafından değil, aynı zamanda Zveno, Geniş Sosyalistler, Çiftçiler ve diğer oluşumların eski üyeleri tarafından da entegre edilen Vatan Cephesi'ni kurduk; şimdi birlikte, ülkeyi domine eden ve kendi serveti peşinde onu tekrar mahvetmekten çekinmeyecek olan burjuvaziye karşı çıkıyorlar."
 bftb_bulgaria_fatherland_front.1.t:0 "Vatan Cephesi"
 bftb_bulgaria_fatherland_front.2.a:0 "O zaman iç savaş demektir!"
 bftb_bulgaria_fatherland_front.2.desc:0 "Bugün, önceden ayarlanmış bir plana göre, yerel Vatan Cephesi örgütleri ve silahlı partizan oluşumları ülke çapında belediye binalarını ve ilçe idarelerini ele geçirdi. \nİsyancılar, Burgaz'dan Varna'ya kadar Karadeniz kıyısı boyunca seyrek veya hiç direnişle karşılaşmadı[GetBsFfSupport][GetBznsFfSupport][GetZvenoFfSupport][GetPartisanFfSupport]."
 bftb_bulgaria_fatherland_front.2.desc_has_bs_support:0 " ve Filibe'de işçi sınıfı isyanı desteklemek için topluca sokaklara döküldü ve birkaç saatlik sokak çatışmasından sonra bölgeyi kontrol etmeyi başardı"
 bftb_bulgaria_fatherland_front.2.desc_has_bzns_support:0 ". \nRaporlara göre, çiftçilerin desteği de Moesia'nın kırsal bölgelerinde darbenin başarısı için belirleyici oldu"
 bftb_bulgaria_fatherland_front.2.desc_has_partisan_support:0 ". \nSon olarak, [GetPartisanFfSupportNationalities] partizan grupları Vatan Cephesi darbesine katıldı ve işgal altındaki topraklar üzerinde kontrolü zorluyor"
 bftb_bulgaria_fatherland_front.2.desc_has_zveno_support:0 ". \nSofya'da, eski Zveno askeri subayları iletişim tesislerini işgal etti ve Ulusal Meclis'e doğru hücum ederek hazırlıksız sadık birlikleri teslim olmaya zorladı"
 bftb_bulgaria_fatherland_front.2.desc_no_support:0 ""
 bftb_bulgaria_fatherland_front.2.desc_partisans_both:0 "Yunan ve Yugoslav"
 bftb_bulgaria_fatherland_front.2.desc_partisans_gre:0 "Yunan"
 bftb_bulgaria_fatherland_front.2.desc_partisans_yug:0 "Yugoslav"
 bftb_bulgaria_fatherland_front.2.t:0 "Vatan Cephesi Saldırıyor!"
 bftb_bulgaria_german_influence.1.a:0 "Memnuniyetle kabul ediyoruz!"
 bftb_bulgaria_german_influence.1.b:0 "Nazikçe reddediyoruz."
 bftb_bulgaria_german_influence.1.desc:0 "Ülkemiz ile [GER.GetNameDef] arasındaki [GetFirstDonation] bağları sayesinde, Hermann Göring bize 12 [GER.GetAdjective] avcı uçağı bağışı teklif ediyor, açıkça [ROOT.GetNameDef]'i [GER.GetFactionName]'e doğru hizalamayı ve böylece bölgedeki [GER.GetAdjective] çıkarlarını korumak için Balkanlar'da güçlü bir müttefik kazanmayı amaçlıyor."
 bftb_bulgaria_german_influence.1.desc_first_donation:0 "[ROOT.GetAdjective] hava muharebe gücünü yeniden kurmak ve güçlendirmek için"
 bftb_bulgaria_german_influence.1.desc_more_donations:0 "Güçlendirmeye devam etmek için"
 bftb_bulgaria_german_influence.1.t:0 "[GER.GetNameDefCap] Uçak Bağışı Teklif Ediyor"
 bftb_bulgaria_german_influence.2.a:0 "Güzel!"
 bftb_bulgaria_german_influence.2.desc:0 "[BUL.GetAdjective] yüksek komutası teklifimizi memnuniyetle kabul etti ve [BUL.GetLeader] uçağımızın bağışına bizzat teşekkür ederek, [ROOT.GetNameDef] ile [BUL.GetNameDef] arasındaki ilişkinin daha güçlü, daha müreffeh ve karşılıklı olarak faydalı hale geldiğini belirtti."
 bftb_bulgaria_german_influence.2.t:0 "[BUL.GetNameDefCap] Bağışımızı Kabul Ediyor"
 bftb_bulgaria_german_influence.3.a:0 "Bunların nesi var?"
 bftb_bulgaria_german_influence.3.desc:0 "[BUL.GetAdjective] yüksek komutası, [BUL.GetAdjective] hava kuvvetlerini desteklemek için [ROOT.GetAdjective] uçağı bağışlama teklifimizi nazikçe reddetti ve bu bağışı kabul etmenin [BUL.GetNameDef]'in [ROOT.GetAdjective] politikalarına yakınlaşması anlamına geleceğini belirtti, ki bu şu anda kendi hava kuvvetlerini yeniden kurmaya kararlı olan [BUL.GetAdjective]lerin çıkarına değil."
 bftb_bulgaria_german_influence.3.t:0 "[BUL.GetNameDefCap] Bağışımızı Reddediyor"
 bftb_bulgaria_german_influence.4.a:0 "Almanlar haklı!"
 bftb_bulgaria_german_influence.4.b:0 "Alman kaprislerine boyun eğmeyeceğiz!"
 bftb_bulgaria_german_influence.4.desc:0 "Bugün, [GER.GetLeader]'in kendisinden bir mektup aldık; [ROOT.GetAdjective] başbakanı Georgi Kyoseivanov'un beceriksizliğinin onu [GER.GetAdjective]lerin gözünde tüm kredisini kaybettirdiğini ve bu kadar önemli bir pozisyon için daha uygun biri lehine istifaya zorlanması gerektiğini belirtiyor. \n[GER.GetAdjective]ler, Kyoseivanov'u kısa bir siyasi deneyime sahip bir Alman dostu olan Bogdan Filov ile değiştirmemizi öneriyor, bu da onun [GetLeaderToChallenge]'e meydan okumayacağı anlamına geliyor."
 bftb_bulgaria_german_influence.4.desc_no_tsar:0 "[BUL.GetLeader]"
 bftb_bulgaria_german_influence.4.desc_regency_council:0 "[ROOT.GetAdjective] Naiplik Konseyi'ne"
 bftb_bulgaria_german_influence.4.desc_tsar:0 "Çar'a"
 bftb_bulgaria_german_influence.4.t:0 "[GER.GetLeader] Kyoseivanov'u Değiştirmemizi Talep Ediyor"
 bftb_bulgaria_german_influence.5.a:0 "[BUL.GetLeader] yeterince bilge olduğunu kanıtladı."
 bftb_bulgaria_german_influence.5.desc:0 "Eski [BUL.GetAdjective] Başbakanı Georgi Kyoseivanov'un beceriksizliği, bu şahsın yetersizliğinin temsil ettiği riski mükemmel bir şekilde anlayan ve Kyoseivanov'u daha yetenekli Bogdan Filov ile değiştirme önerimizi kabul eden [BUL.GetLeader]'in gözünde onu tüm kredisini kaybetmesine neden oldu. Kısa siyasi deneyime sahip bir Alman dostu (Germanophile) olan Filov'un bu durumu, onun [GetLeaderToChallenge]'e meydan okumayacağı veya [ROOT.GetAdjective] çıkarlarını engellemeyeceği anlamına geliyordu."
 bftb_bulgaria_german_influence.5.t:0 "[BUL.GetLeader] Kyoseivanov'u Değiştirmeyi Kabul Ediyor"
 bftb_bulgaria_german_influence.6.a:0 "Buradaki tek kukla Georgi Kyoseivanov!"
 bftb_bulgaria_german_influence.6.desc:0 "[BUL.GetLeader], Georgi Kyoseivanov'un değiştirilmesini reddetti ve [ROOT.GetAdjective] hükümetinin onun istifasını istemesinin tek nedeninin [BUL.GetNameDef]'e sadık yetenekli bir politikacıdan kurtulmak ve onu [BUL.GetNameDef]'deki [GER.GetLeader]'in çıkarlarına göz kulak olacak bir [ROOT.GetAdjective] kuklasıyla değiştirmek olduğunu iddia etti."
 bftb_bulgaria_german_influence.6.t:0 "[BUL.GetLeader] Kyoseivanov'u Değiştirmeyi Reddediyor"
 bftb_bulgaria_german_influence.7.a:0 "Alman ordusuyla memnuniyetle iş birliği yapacağız."
 bftb_bulgaria_german_influence.7.b:0 "[GER.GetLeader] başka bir yol bulmak zorunda kalacak"
 bftb_bulgaria_german_influence.7.desc:0 "Bugün [ROOT.Capital.GetName]'a bir [GER.GetNameDef] diplomatı geldi ve [ROOT.GetNameDef]'in [GER.GetAdjective] ordusuna askeri erişim vermesini talep etti. \nBalkanlar'da gerçekleşmek üzere olan askeri operasyonlar, [GER.GetAdjective] birliklerinin komşularımızla olan sınır boyunca konuşlanmak için [ROOT.GetNameDef]'den geçebilmesini gerektiriyor ve [GER.GetLeader], [ROOT.GetNameDef]'in [GER.GetAdjective] savaş çabalarını engellediğini öğrenmekten memnun olmayacaktır..."
 bftb_bulgaria_german_influence.7.t:0 "[GER.GetNameDefCap] Askeri Erişim Talep Ediyor"
 bftb_bulgaria_german_influence.8.a:0 "Her şey plana göre gidiyor."
 bftb_bulgaria_german_influence.8.desc:0 "[BUL.GetAdjective] topraklarını birliklerimiz için bir operasyon üssü olarak kullanmayı görüşmek üzere [BUL.Capital.GetName]'a gönderdiğimiz diplomat, müzakerelerin başarılı olduğunu ve [BUL.GetLeader]'in, [ROOT.GetAdjective] ordusuna [BUL.GetNameDef] genelinde askeri erişim verildiği bir anlaşmayı çoktan imzaladığını bize bildirdi."
 bftb_bulgaria_german_influence.8.t:0 "[BUL.GetNameDefCap] Bize Askeri Erişim Veriyor"
 bftb_bulgaria_german_influence.9.a:0 "[BUL.GetLeader] ateşle oynuyor..."
 bftb_bulgaria_german_influence.9.desc:0 "[BUL.GetAdjective] topraklarını ordumuz için bir operasyon üssü olarak kullanmayı müzakere etmek üzere [BUL.Capital.GetName]'a gönderdiğimiz diplomat, [BUL.GetLeader]'in [ROOT.GetAdjective] birliklerine askeri erişim vermeyi reddettiğini ve yakın gelecekte Balkanlar'daki askeri operasyonlarımızı tehlikeli bir şekilde engellediğini bildirdi. İddiaya göre, [BUL.GetLeader], her talebimizi karşılamanın [BUL.GetNameDef]'i sadece başka bir [ROOT.GetAdjective] uydusuna dönüştüreceğine ve ülkenin haklı olarak olması gereken Balkanlar'daki bağımsız büyük güç olmasını engelleyeceğine inanıyor."
 bftb_bulgaria_german_influence.9.t:0 "[BUL.GetNameDefCap] Askeri Erişim Talebimizi Reddediyor"
 bftb_bulgaria_greek_influence.1.a:0 "[GRE.GetNameDefCap] ve [BUL.GetNameDef] bundan sonra iş birliği yapacak!"
 bftb_bulgaria_greek_influence.1.b:0 "[BUL.GetAdjective]lere güvenemeyiz!"
 bftb_bulgaria_greek_influence.1.desc:0 "[BUL.GetAdjective] Başbakanı [BUL.GetLeader], [BUL.GetNameDef] ile [ROOT.GetNameDef] arasında dostane ilişkilerin bir barış anlaşmasıyla resmileştirilmesini teklif etmek üzere [ROOT.GetLeader] ile bir araya geldi. [BUL.GetAdjective] lideri ayrıca komşu ülkede iştirakler kurmak isteyen [ROOT.GetAdjective] kapitalistlere belirli vergi avantajları da teklif etti."
 bftb_bulgaria_greek_influence.1.t:0 "[BUL.GetNameDefCap], [GRE.GetAdjective] Hükümetine Yaklaşıyor"
 bftb_bulgaria_greek_influence.2.a:0 "[BUL.GetNameDefCap] ve [GRE.GetNameDef] bundan sonra iş birliği yapacak!"
 bftb_bulgaria_greek_influence.2.desc:0 "[FROM.GetAdjective] lideri [FROM.GetLeader] teklifimizi kabul etti ve [BUL.GetNameDef] ile [FROM.GetNameDef] arasında barışı sağlayan bir anlaşma ile dostane ilişkilerimizi resmileştirmeye istekli."
 bftb_bulgaria_greek_influence.2.t:0 "[FROM.GetNameDefCap] Teklifimizi Kabul Ediyor"
 bftb_bulgaria_greek_influence.3.a:0 "İş birliği ihtiyacını fark edemeyecek kadar gururlular!"
 bftb_bulgaria_greek_influence.3.desc:0 "[FROM.GetAdjective] lideri [FROM.GetLeader], bu yeni [BUL.GetAdjective] barış politikalarına güvenmediğini ve bu nedenle [FROM.GetNameDef] ile [BUL.GetNameDef] arasında dostane ilişkileri resmileştirme teklifimizi reddettiğini belirtti."
 bftb_bulgaria_greek_influence.3.t:0 "[FROM.GetAdjective] Hükümeti Teklifimizi Reddetti"
 bftb_bulgaria_imro.1.a:0 "1930'ların başına geri döndük..."
 bftb_bulgaria_imro.1.desc:0 "Güvenilir kaynaklar, IMRO üyelerinin Bulgar silahlarıyla donanmış olarak sınırı geçtiğini ve Makedon bölgelerinde [ROOT.GetAdjective] karşıtı bir hareket örgütlediğini bize bildirdi."
 bftb_bulgaria_imro.1.t:0 "IMRO Geri Döndü!"
 bftb_bulgaria_imro.2.a:0 "Bir kez daha IMRO ile başa çıkma zamanı..."
 bftb_bulgaria_imro.2.desc:0 "IMRO aktivistleri ve diğer Bulgar yanlısı Makedonlar şu anda Makedon nüfusu arasında Bulgar duygularını yayıyorlar.\nSonuç olarak, bölgeyi yeni bir istikrarsızlık ve [ROOT.GetAdjective] hükümetine karşı muhalefet dalgası sarmış durumda."
 bftb_bulgaria_imro.2.t:0 "Makedonya'da Bulgar Duyguları Uyanıyor"
 bftb_bulgaria_italian_influence.1.a:0 "Bu, [ITA.GetNameDef] için faydalı bir anlaşmadır."
 bftb_bulgaria_italian_influence.1.b:0 "Teknolojik ilerlemelerimizi [BUL.GetAdjective]lerle paylaşmayacağız!"
 bftb_bulgaria_italian_influence.1.desc:0 "Bugün başkentimize bir [BUL.GetAdjective] heyeti geldi ve ülkelerimiz arasında bir anlaşma imzalamayı teklif etmek üzere [ITA.GetAdjective] dışişleri bakanıyla bir toplantı talep etti. \n[BUL.GetAdjective] diplomatları tarafından sunulan antlaşma, diğer maddelerin yanı sıra, teknolojik araştırmaya odaklanmış bir askeri iş birliği programını ve [BUL.GetNameDef]'de [ITA.GetAdjective] yatırımcılara önemli faydalar sağlayacak yeni ekonomik düzenlemelerin uygulanmasını içeriyor."
 bftb_bulgaria_italian_influence.1.t:0 "[BUL.GetAdjective] Araştırma Anlaşması Teklifi"
 bftb_bulgaria_nationalization.1.a:0 "Şimdi bu konuda bir şey yapamayız..."
 bftb_bulgaria_nationalization.1.b:0 "Bir ticaret ambargosu onlara biraz saygı öğretecektir!"
 bftb_bulgaria_nationalization.1.c:0 "Diplomatik bir heyet göndereceğiz... Tankların önderliğinde!"
 bftb_bulgaria_nationalization.1.d:0 "Defolun gidin bu nankör hainler!"
 bftb_bulgaria_nationalization.1.desc:0 "[GetTsarLoyalistOrPartyName] desteğiyle, [BUL.GetNameDef]'den [GetLeaderNameIfRegencyCouncil], ülkedeki tüm yabancı iştiraklerin kamulaştırıldığı ve bundan böyle [BUL.GetAdjective] devletine ait olduğu yeni bir yasa çıkardı. \n[BUL.GetNameDef]'deki [ROOT.GetAdjective] çıkarlarına yönelik bu küstah saldırı, üst kademelerde, özellikle de [BUL.GetNameDef]'de altyapı ve iştirak geliştirmeye büyük meblağlar yatıran ve alçakça kamulaştırılan sanayi devleri arasında ağır bir darbe olarak karşılandı."
 bftb_bulgaria_nationalization.1.desc_party_name:0 "[BUL.GetRulingPartyLong]'dan bakanların"
 bftb_bulgaria_nationalization.1.desc_regency_council:0 "Bogdan Filov ve [BUL.GetLeader]"
 bftb_bulgaria_nationalization.1.desc_regular_leader:0 "[BUL.GetLeader]"
 bftb_bulgaria_nationalization.1.desc_tsar_loyalists:0 "sadık bakanlarının"
 bftb_bulgaria_nationalization.1.t:0 "[FROM.GetNameDefCap] İştiraklerimize El Koydu"
 bftb_bulgaria_nationalization.2.a:0 "Ne kadar dramatik..."
 bftb_bulgaria_nationalization.2.desc:0 "Yabancı iştiraklerin ve şubelerin [ROOT.GetAdjective] tarafından kamulaştırılmasına yanıt olarak, [FROM.GetNameDef] ülkemize bir ambargo uygulamaya karar verdi[GetEmbargoAllies]. \nBazıları durumun çok daha kötüye gidebileceğini söylüyor, ancak gerçek şu ki, mal ithalatı ve ihracatına odaklanan belirli sektörler bu ambargodan ciddi şekilde etkilendi."
 bftb_bulgaria_nationalization.2.desc_allies:0 ", bu ambargo müttefikleri tarafından da desteklendi"
 bftb_bulgaria_nationalization.2.desc_no_allies:0 ""
 bftb_bulgaria_nationalization.2.t:0 "Bulgaristan'a [FROM.GetAdjective] Ticaret Ambargosu"
 bftb_bulgaria_nationalization.3.a:0 "Bunu beklemeliydik!"
 bftb_bulgaria_nationalization.3.desc:0 "[FROM.GetAdjective] hükümeti, [BUL.GetAdjective]'in yabancı iştirakleri kamulaştırmasına yanıt olarak, [FROM.GetNameDef]'in [BUL.GetNameDef]'e sadece bir ticaret ambargosu uygulamasını değil, aynı zamanda ülkeyi [FROM.GetFactionName]'den atmasını talep eden yatırımcıların ve sanayi kodamanlarının baskısına boyun eğdi.\nAmbargo[GetEmbargoAndKickAllies] birkaç ulusal ekonomik sektörü ciddi şekilde etkileyecektir, ancak daha da kötüsü, ülkemizin şimdi komşularının toprak emellerine maruz kalmasıdır, ki onlar şüphesiz yakında [BUL.GetNameDef]'in oldukça vahim durumundan yararlanacaklardır."
 bftb_bulgaria_nationalization.3.desc_allies:0 ", [FROM.GetNameDef]'in müttefiklerinin de katıldığı,"
 bftb_bulgaria_nationalization.3.desc_no_allies:0 ""
 bftb_bulgaria_nationalization.3.t:0 "[FROM.GetNameDefCap] bizi [FROM.GetFactionName]'den attı"
 bftb_bulgaria_political_leaders.1.a:0 "UBNL saflarından yeni bir lider ata."
 bftb_bulgaria_political_leaders.1.b:0 "Daha radikal bir ideolojiye sahip birine ihtiyacımız var... Aleksandar Tsankov'u ata!"
 bftb_bulgaria_political_leaders.1.c:0 "Dünya onsuz daha iyi bir yer!"
 bftb_bulgaria_political_leaders.1.d:0 "Trajik..."
 bftb_bulgaria_political_leaders.1.desc:0 "Dün akşam, [GetLukovLeader], Kraliyet Sineması'ndan 1 Nolu Topçu Sokağı'ndaki evine kadar onu takip eden iki [GetLukovPartisans] tarafından pusuya düşürüldü. \nSiyasi lider evine girmek üzereyken, [GetLukovCriminals] biri yakın mesafeden ateş ederek onu omzundan vurdu, ardından Lukov adamı yakalayıp bir duvara bastırdı, binaya geri çekilmeye çalıştı, ancak [GetLukovSecondAssailant], onu sırtından vurdu, sonra [GetLukovAccomplice]'ini alıp komşu bahçeden kaçtı ve evinin girişinde ölümcül şekilde yaralanmış bir Hristo Lukov bıraktı. \n[GetLukovConclusion]"
 bftb_bulgaria_political_leaders.1.t:0 "Hristo Lukov'un Öldürülmesi"
 bftb_bulgaria_rearmament.1.a:0 "Sadece boş vaatler sunuyorlar."
 bftb_bulgaria_rearmament.1.b:0 "Barışı korumak için resmi bir antlaşma talep edeceğiz."
 bftb_bulgaria_rearmament.1.c:0 "Kısıtlamalarına bir son vermeliyiz!"
 bftb_bulgaria_rearmament.1.desc:0 "[BUL.GetAdjective] Hükümeti, [BUL.GetNameDef]'in Balkanlar'da izleyeceği barış politikalarını kamuoyuna açıkladı ve şimdi ülkeye Büyük Savaş'taki yenilgisinden sonra uygulanan ağır askeri kısıtlamaların kaldırılması için müzakere etmemizi istiyor. \n[BUL.GetAdjective] halkının egemenliğini ve kendi kaderini tayin hakkını savunabilecek modern bir askeri güç inşa etmek için derhal yeniden silahlanmaya başlamaları gerektiğini iddia ediyorlar."
 bftb_bulgaria_rearmament.1.t:0 "[BUL.GetAdjective] Yeniden Silahlanma Müzakereleri"
 bftb_bulgaria_rearmament.1_nap_tt:0 "[BUL.GetNameDefCap], [GRE.GetFlag][GRE.GetNameDefCap], [YUG.GetFlag][YUG.GetNameDefCap], [ROM.GetFlag][ROM.GetNameDefCap] veya [TUR.GetFlag][TUR.GetNameDefCap] ile bir Saldırmazlık Paktı imzaladıktan sonra yeniden silahlanmaya başlayabilecek."
 bftb_bulgaria_rearmament.1_refuse_tt:0 "[BUL.GetNameDefCap] şimdilik yeniden silahlanmaya başlayamayacak."
 bftb_bulgaria_rearmament.2.a:0 "Başka ikna yolları bulmalıyız..."
 bftb_bulgaria_rearmament.2.desc:0 "[ENG.GetAdjective] hükümeti, Avrupa'da artan gerilimlere ve Balkanlar'daki kırılgan dengenin değişmesi durumunda [ROOT.GetNameDef]'in yükselen bir güce çaresizce boyun eğme ihtimaline kayıtsız görünerek silahlı kuvvetlerimiz üzerindeki herhangi bir kısıtlamayı kaldırmayı reddetti."
 bftb_bulgaria_rearmament.2.t:0 "[ENG.GetNameDefCap] [ROOT.GetAdjective] Yeniden Silahlanmasını Reddediyor"
 bftb_bulgaria_rearmament.3.a:0 "Aşılması gereken bir engel daha..."
 bftb_bulgaria_rearmament.3.desc:0 "Silahlı kuvvetlerimiz üzerindeki herhangi bir kısıtlamayı kaldırmadan önce, [ENG.GetAdjective] hükümeti, Balkanlar'da nihayet dostane bir diplomasi geliştirmenin bir başlangıç noktası olarak, [ROOT.GetNameDef]'in komşularından biriyle resmi bir antlaşma imzalamasını talep ediyor."
 bftb_bulgaria_rearmament.3.t:0 "[ENG.GetAdjective], [ROOT.GetNameDef]'in Yeniden Silahlanmasına İzin Verilmesini Talep Ediyor"
 bftb_bulgaria_rearmament.4.a:0 "İşe koyulalım!"
 bftb_bulgaria_rearmament.4.desc:0 "[ENG.GetAdjective] taleplerine uyduktan ve [GetNapTarget] ile bir Saldırmazlık Paktı imzaladıktan sonra, [ENG.GetNameDef] nihayet ordumuz üzerindeki kısıtlamaları kaldırdı ve [ROOT.GetAdjective] ordusunun yeniden silahlanması nihayet başlayabilir."
 bftb_bulgaria_rearmament.4.t:0 "Ordu Kısıtlamaları Kaldırıldı"
 bftb_bulgaria_rearmament.5.a:0 "Şu işi bir an önce bitirelim."
 bftb_bulgaria_rearmament.5.desc:0 "[ROOT.GetAdjective] taleplerine uyduktan ve [GetNapTarget] ile bir Saldırmazlık Paktı imzaladıktan sonra, bir [BUL.GetAdjective] heyeti Londra'ya geldi ve [BUL.GetNameDef]'in askeri yeniden silahlanmaya başlamasına izin verecek resmi antlaşmayı imzalamaya hazır."
 bftb_bulgaria_rearmament.5.t:0 "[BUL.GetAdjective] Ordu Kısıtlamaları Kaldırıldı"
 bftb_bulgaria_rearmament.6.a:0 "Kaybedecek zaman yok, yeniden silahlanmaya başlayın!"
 bftb_bulgaria_rearmament.6.desc:0 "Sofya'da bir [ENG.GetNameDef] heyetiyle yapılan çetin müzakerelerin ardından, [ENG.GetAdjective] hükümetinin ordumuz üzerindeki kısıtlamaları kaldırdığı ve [ROOT.GetNameDef]'in nihayet askeri yeniden silahlanmaya başlayabileceği bir anlaşma imzaladık."
 bftb_bulgaria_rearmament.6.t:0 "[ENG.GetNameDefCap] Ordu Kısıtlamalarımızı Kaldırıyor"
 bftb_bulgaria_rearmament.7.a:0 "Tehditlere boyun eğmeyeceğiz!"
 bftb_bulgaria_rearmament.7.b:0 "Başka yolu yok... Kısıtlamalarını kaldırın!"
 bftb_bulgaria_rearmament.7.desc:0 "Bir [BUL.GetAdjective] heyeti, [ROOT.GetAdjective] hükümetine [BUL.GetNameDef] üzerindeki askeri kısıtlamaları kaldırması için baskı yapmak amacıyla Londra'ya geldi. \nBalkanlar üzerinde savaş tekrar belirirken, [BUL.GetNameDef]'in öyle ya da böyle toprak bütünlüğünü savunmak için hazırlıklara yakında başlayacağını temin ediyorlar."
 bftb_bulgaria_rearmament.7.t:0 "[BUL.GetNameDefCap] Ordu Kısıtlamalarının Kaldırılması İçin Baskı Yapıyor"
 bftb_bulgaria_rearmament.8.a:0 "Yani bize başka seçenek bırakmıyorlar..."
 bftb_bulgaria_rearmament.8.desc:0 "[ENG.GetAdjective] hükümetine ordumuz üzerindeki kısıtlamaları kaldırması için baskı yapmak üzere Londra'ya gönderilen [ROOT.GetAdjective] heyeti kötü haberlerle döndü: [ENG.GetNameDef] taleplerimize boyun eğmeyecek ve [ROOT.GetNameDef]'in yeniden silahlanmaya başlamasına izin vermeyecek."
 bftb_bulgaria_rearmament.8.t:0 "[ENG.GetNameDefCap] Baskımıza Boyun Eğmeyecek"
 bftb_bulgaria_rearmament.9.a:0 "Onlarla daha sonra ilgileneceğiz..."
 bftb_bulgaria_rearmament.9.b:0 "Bunun bedelini ödemeliler!"
 bftb_bulgaria_rearmament.9.desc:0 "[BUL.GetLeader]'in bizzat gönderdiği bir [BUL.GetAdjective] diplomat, ülkemize gelerek [GetReasonForNotAbiding] olduğunu bize bildirdi."
 bftb_bulgaria_rearmament.9.desc_reason_faction:0 ", artık [BUL.GetFactionName] tarafından desteklendiklerine göre, [BUL.GetNameDef] silahlı kuvvetlerine dayatılan kısıtlamalara artık uymayacaktır"
 bftb_bulgaria_rearmament.9.desc_reason_war:0 ", sürüklendikleri askeri çatışma nedeniyle, [BUL.GetNameDef] ulusal bağımsızlıklarını ve halklarının özgürlüğünü korumak için derhal yeniden silahlanmaya başlayacaktır"
 bftb_bulgaria_rearmament.9.t:0 "[BUL.GetNameDefCap] Askeri Kısıtlamalara Uymayacak"
 bftb_bulgaria_scw_volunteers.1.a:0 "Kahraman olarak geri geliyorlar!"
 bftb_bulgaria_scw_volunteers.1.b:0 "Özgürlüğü savunmak için ellerinden geleni yaptılar..."
 bftb_bulgaria_scw_volunteers.1.desc:0 "Uluslararası Tugaylar'da İspanyol halkının özgürlüğü için savaşmaya giden cesur [ROOT.GetAdjective] gönüllüleri, eve [GetVictoryOrDefeatRepublicans] dönüyor. Gözüpek [ROOT.GetAdjective] savaşçılarının gaziler olarak döndüğü bu grup arasında, birçok savaş başarısı için madalya alan ve Bulgar Hava Kuvvetleri Komutanlığı'na terfi için şiddetle tavsiye edilen, şimdi son derece yetenekli askeri pilot Zachari Zachariev de var."
 bftb_bulgaria_scw_volunteers.1.desc_nationalists_defeated:0 "şimdi tamamen kızıllara boyun eğmiş olan [FROM.GetNameDef]'in uğradığı korkunç yenilgiden dolayı moralleri bozuk... \nHer halükarda, bizim"
 bftb_bulgaria_scw_volunteers.1.desc_nationalists_victorious:0 "İspanya iç savaşının gururlu galipleri olarak; [FROM.GetLeader]'in kendisi bile cephedeki katılımlarını övdü. \nBizim"
 bftb_bulgaria_scw_volunteers.1.desc_republicans_defeated:0 "nihayet faşizm tiranlığına yenik düşen [FROM.GetNameDef]'in uğradığı korkunç yenilginin yasını tutarak... \nHer halükarda, aralarında"
 bftb_bulgaria_scw_volunteers.1.desc_republicans_victorious:0 "[FROM.GetNameDef]'in İspanyol halkına bu kadar acı çektiren iç savaştaki zaferinden sonra sevinçle"
 bftb_bulgaria_scw_volunteers.1.t:0 "[ROOT.GetAdjective] Gönüllüler İspanya'dan Döndü"
 bftb_bulgaria_scw_volunteers.2.a:0 "Gerçek savaş gazileri olarak dönüyorlar!"
 bftb_bulgaria_scw_volunteers.2.b:0 "İspanya sadece bir deneme sahasıydı..."
 bftb_bulgaria_scw_volunteers.2.desc:0 "İspanya'da bolşevizme ve anarşizme karşı savaşmaya giden cesur [ROOT.GetAdjective] gönüllüleri, eve [GetVictoryOrDefeatNationalists] dönüyor. Birliklerimiz değerli savaş deneyimi kazandı ve komutanlarımızdan biri savaş sırasındaki dikkat çekici eylemleri için madalya alıp terfi etti."
 bftb_bulgaria_scw_volunteers.2.t:0 "Bulgar gönüllüler İspanya'dan geri dönüyor"
 bftb_bulgaria_soviet_influence.1.a:0 "Bu antlaşmayı imzalamak her iki ülkeye de fayda sağlayacaktır!"
 bftb_bulgaria_soviet_influence.1.b:0 "Bu antlaşma bizim çıkarımıza değil."
 bftb_bulgaria_soviet_influence.1.desc:0 "[GetBulgarianLeaderToMeetStalin], bugün [ROOT.Capital.GetName]'da [ROOT.GetLeader] ile ülkelerimiz arasında bir Karşılıklı Yardım Antlaşması imzalama [BUL.GetAdjective] teklifini görüşmek üzere bir araya geldi. Bu antlaşma ile [BUL.GetAdjective] hükümeti, [ROOT.GetNameDef] ile bağları güçlendirirken, bu çalkantılı zamanlarda bütünlüğünü korumak ve Balkanlar'daki düşman komşularına karşı galip gelmek için ihtiyaç duyduğu desteği kazanmayı amaçlıyor."
 bftb_bulgaria_soviet_influence.1.desc_diplomat:0 "[BUL.GetAdjective] diplomatlar"
 bftb_bulgaria_soviet_influence.1.desc_leader:0 "[BUL.GetLeader]"
 bftb_bulgaria_soviet_influence.1.t:0 "[ROOT.GetAdjective]-[BUL.GetAdjective] Karşılıklı Yardım Antlaşması"
 bftb_bulgaria_soviet_influence.2.a:0 "Bu, verimli bir ilişkinin başlangıcıdır!"
 bftb_bulgaria_soviet_influence.2.desc:0 "[GetBulgarianLeaderToMeetStalin], [SOV.GetNameDef] ile [ROOT.GetNameDef] arasında bir Karşılıklı Yardım Antlaşması imzalama teklifini görüşmek üzere [SOV.GetLeader] ile bir toplantıdan bugün [ROOT.Capital.GetName]'a döndü. Antlaşmanın koşullarını ve bu ilişkiyi korumak için ilgili hükümetler tarafından yürütülecek önlemleri belirlemek için uzun bir toplantının ardından, her iki ülkeden devlet adamları Antlaşmayı imzaladı."
 bftb_bulgaria_soviet_influence.2.t:0 "[SOV.GetNameDefCap] Karşılıklı Yardım Antlaşmasını İmzalıyor"
 bftb_bulgaria_soviet_influence.3.a:0 "Yeni müttefikler bulma zamanı..."
 bftb_bulgaria_soviet_influence.3.desc:0 "[GetBulgarianLeaderToMeetStalin], [SOV.GetNameDef] ile [ROOT.GetNameDef] arasında bir Karşılıklı Yardım Antlaşması imzalama teklifini görüşmek üzere [SOV.GetLeader] ile bir toplantıdan bugün [ROOT.Capital.GetName]'a döndü. Antlaşmanın şartlarını belirlemek için uzun bir toplantının ardından, görünüşe göre [SOV.GetLeader]'i bu antlaşmanın gerekliliğine ikna etmenin bir yolu yoktu, ki [SOV.GetLeader.GetSheHe] imzalamayı kesin bir dille reddetti. \n[SOV.GetNameDef]'deki teklifin başarısızlığının ardından, görünüşe göre [ROOT.GetLeader] [ROOT.GetNameDef] için diğer olası müttefikleri şimdiden değerlendiriyor."
 bftb_bulgaria_soviet_influence.3.t:0 "[SOV.GetNameDefCap] Karşılıklı Yardım Antlaşmasından Çekiliyor"
 bftb_bulgaria_soviet_influence.4.a:0 "Bulgar ve Sovyet kardeşlerimize katılmalıyız."
 bftb_bulgaria_soviet_influence.4.b:0 "Bulgar baskısına boyun eğmeyeceğiz!"
 bftb_bulgaria_soviet_influence.4.desc:0 "[BUL.GetAdjective] hükümeti, Balkan uluslarının faşizme, emperyalizme ve kapitalizme karşı devrimde birleşmesini talep ediyor ve [ROOT.GetLeader]'i [BUL.GetFactionName]'e katılmaya teşvik ederek, böylece baskıcı Avrupa uluslarına karşı güçlü bir muhalefet bloğu oluşturuyor."
 bftb_bulgaria_soviet_influence.4.t:0 "[BUL.GetLeader], [ROOT.GetLeader]'e [BUL.GetFactionName]'e Katılması İçin Baskı Yapıyor"
 bftb_bulgaria_soviet_influence.5.a:0 "Doğru olanı yaptılar."
 bftb_bulgaria_soviet_influence.5.desc:0 "[FROM.GetAdjective] hükümeti üyeleriyle yapılan olağanüstü yoğun toplantılar ve şiddetli tartışmaların ardından, [FROM.GetLeader] nihayet baskımıza boyun eğdi ve [FROM.GetNameDef], faşizme, emperyalizme ve kapitalizme karşı muhalefet bloğumuzu güçlendirerek [ROOT.GetFactionName]'e katıldı."
 bftb_bulgaria_soviet_influence.5.t:0 "[FROM.GetNameDefCap], [ROOT.GetAdjective] Baskısına Boyun Eğiyor"
 bftb_bulgaria_soviet_influence.6.a:0 "[FROM.GetNameDef]'e sadece yıkım getirecek bir karar..."
 bftb_bulgaria_soviet_influence.6.desc:0 "[FROM.GetLeader], kuvvetlerimizi bölmek yerine müttefik olarak birleşik kalmamızın gerekliliği hakkında bir konuşma yapmak amacıyla [FROM.GetNameDef]'e gönderdiğimiz diplomatlarımızla görüşmeyi reddetti. Ancak, [FROM.GetAdjective] hükümeti ittifakımıza katılma teklifimizi reddetti, böylece [ROOT.GetNameDef] ile [FROM.GetNameDef] arasında iş birliğinin söz konusu olmadığını açıkça ortaya koydu ve [ROOT.GetFactionName] uluslarına bu ülkeyle başa çıkmak için birkaç alternatif bıraktı."
 bftb_bulgaria_soviet_influence.6.t:0 "[FROM.GetNameDefCap], [ROOT.GetAdjective] Taleplerini Reddediyor"
 bftb_bulgaria_tsar_boris.1.a:0 "Bir sonraki ziyaret ne zaman planlandı?"
 bftb_bulgaria_tsar_boris.1.b:0 "Uzun süre hatırlayacakları bir akşam!"
 bftb_bulgaria_tsar_boris.1.c:0 "O zaman bir süreliğine ziyafet yok..."
 bftb_bulgaria_tsar_boris.1.desc_extra_success:0 "[GetDestinationName]'e yapılan kraliyet ziyareti tam bir başarıya dönüştü! Belediye başkanıyla görüşmek üzere belediye binasına doğru ilerleyen alayı tamamladıktan sonra, Çar [GetDestinationName]'in mütevazı semtlerinden birinde halkla kaynaşmak için bir yürüyüş yapmaya karar verdi.\nVatandaşlar Boris'i daha sıcak karşılayamazdı. Herkes hükümdarlarının sokaklarda dolaşmasından memnundu ve birkaçı neşeyle Çar'a çiçek çelenkleri, yerel ürünlerden küçük ahşap ve demir el sanatlarına kadar mütevazı hediyeler sundu.\n\nBu samimi ve mütevazı karşılamanın Çar'ın içinde bir şeyleri harekete geçirip geçirmediği belirsiz, ancak gerçek şu ki, bu vesileyle, özel resepsiyonlar ve seçkin bahçe partileri yerine, Çar herkesin eğlenmesi için büyük bir halk şöleni düzenlemeye karar verdi. Söylemeye gerek yok, [GetDestinationName] halkı bu fikirden çok memnun kaldı ve etkinlikten sonra herkes evine geç ve gerçekten memnun bir şekilde döndü."
 bftb_bulgaria_tsar_boris.1.desc_failure:0 "[GetDestinationName]'e yapılan kraliyet ziyareti, Çar'ın popülaritesine feci bir darbe vurdu. Ziyaretin en başından itibaren, alayı karşılamak için toplanan çoğunlukla yoksul vatandaşlar arasında pek bir neşe olmadığı görülebiliyordu ve hatta kalabalık arasında ara sıra yuhalamalar duyulabiliyordu.\n\nDurum, hükümdar ve ailesinin toplumun en ayrıcalıklı üyeleri eşliğinde gösterişli bir resepsiyon ve lüks bir ziyafetin tadını çıkardığı belediye binası çevresinde vatandaşların popüler bir protesto düzenlemesiyle daha da kötüleşti. İnsanlar bu tür savurgan gösterileri eleştirdi ve son yıllarda ülkeyi ziyaret eden tüm ekonomik ve sosyal sorunlar için üst sınıfları suçladı.\n\nBuna karşılık, polis güçleri gösteriyi derhal dağıtmakla görevlendirildi, ancak şiddet kullanımı durumu sadece daha da kötüleştirdi ve gösteri isyanlara dönüştü."
 bftb_bulgaria_tsar_boris.1.desc_success:0 "Bugün, Çar Boris [GetDestinationName]'e yaptığı ziyareti tamamladı. Hükümdar, kraliyet alayı şehrin en ikonik caddelerinden geçerken onu alkışlamak için toplanan yerlilerin coşkusunun tadını çıkardı.\nAncak bu ziyaret sadece sıradan insanların eğlencesi için değildi; Çar'ın gelişini takip eden günlerde zengin ziyafetler, görkemli resepsiyonlar ve en yüksek yerel elitlerin üyeleriyle toplantılar gerçekleşti.\n\nGenel olarak, ziyaret amacına hizmet etti: topluluğun en zengin üyeleriyle bağları güçlendirmek ve Çar'ı sıradan insanlara tebaasına yakın, hayırsever bir hükümdar olarak göstermek."
 bftb_bulgaria_tsar_boris.1.t:0 "Çar III. Boris [GetDestinationName]'i Ziyaret Ediyor"
 bftb_bulgaria_tsar_boris.2.a:0 "Gerçekten de rahatsız edici..."
 bftb_bulgaria_tsar_boris.2.desc:0 "[GetBorisDeathContext]\n[GetSuspicionsAboutBorisDeath]"
 bftb_bulgaria_tsar_boris.2.t:0 "Çar III. Boris'in Vefatı"
 bftb_bulgaria_tsar_boris.3.a:0 "Mihver yanlısı bir hükümet kur."
 bftb_bulgaria_tsar_boris.3.b:0 "Müttefik yanlısı bir hükümet kur."
 bftb_bulgaria_tsar_boris.3.c:0 "Bağımsız bir hükümet kur."
 bftb_bulgaria_tsar_boris.3.desc:0 "Boris'in varisi II. Simeon adına [ROOT.GetNameDef]'i yönetecek olan naiplik konseyinin üyelerini atama zamanı geldi.\n\nKraliyet ailesi ile üst düzey siyasi ve askeri sınıflar arasından en uygun adayları seçmeliyiz, ancak akıllıca seçmeliyiz, çünkü her birinin kendi sadakatleri var ve ülkemiz geçmişte liderlerinin kararları yüzünden zaten felaket ve yıkım yaşadı..."
 bftb_bulgaria_tsar_boris.3.t:0 "Naiplik Konseyi"
 bftb_bulgaria_uranium_mining_concessions.1.a:0 "Bunu iyi bir şekilde kullanacağız."
 bftb_bulgaria_uranium_mining_concessions.1.desc:0 "[FROM.GetAdjective] müttefiklerimizle olan iyi ilişkilerimiz meyvesini verdi: [FROM.GetAdjective] hükümeti, Buhovo kasabası yakınlarındaki uranyum yatakları için bize işletme hakları verdi. Teknolojilerinin bu maddeden iyi bir şekilde yararlanmaktan hala uzak olduğunu iddia ediyorlar, bu yüzden Bulgar sanayisi ve tarımı için temel ürünler karşılığında Buhovo'daki madenleri kontrol edeceğimiz bir imtiyaz anlaşması imzalamayı tercih ediyorlar.\nBu lehimize olan anlaşma sadece bize yeni bir uranyum kaynağı sağlamakla kalmayacak, aynı zamanda şüphesiz [GER.GetNameDef] ile [BUL.GetNameDef] arasındaki ilişkileri daha da geliştirecektir."
 bftb_bulgaria_uranium_mining_concessions.1.t:0 "[FROM.GetNameDefCap] Uranyum Madenciliği İmtiyazı"
 bftb_bulgaria_yugoslavian_influence.1.a:0 "Bu antlaşmayı imzalamak her iki ülkeye de fayda sağlayacaktır!"
 bftb_bulgaria_yugoslavian_influence.1.b:0 "Bu antlaşma bizim çıkarımıza değil."
 bftb_bulgaria_yugoslavian_influence.1.desc:0 "[GetBulgarianLeaderToMeetStalin], bugün [ROOT.Capital.GetName]'da [ROOT.GetLeader] ile ülkelerimiz arasında bir Ebedi Dostluk Antlaşması imzalama [BUL.GetAdjective] teklifini görüşmek üzere bir araya geldi. Bu antlaşma ile [BUL.GetAdjective] hükümeti, geçmiş anlaşmazlıkları gömmeyi ve [YUG.GetNameDef] ile bağları güçlendirmeyi amaçlıyor, sonunda imzacılardan herhangi biri bir çatışmaya sürüklenirse iş birliği ve karşılıklı destek sağlayan iki ülke arasında bir ittifak kurmayı umuyor."
 bftb_bulgaria_yugoslavian_influence.1.t:0 "Bulgar Ebedi Dostluk Antlaşması"
 bftb_bulgaria_yugoslavian_influence.2.a:0 "Bu her iki ulusu da güçlendirecektir!"
 bftb_bulgaria_yugoslavian_influence.2.desc:0 "[GetBulgarianLeaderToMeetStalin], [YUG.GetNameDef] ile [ROOT.GetNameDef] arasında Ebedi Dostluk Antlaşması imzalama teklifini görüşmek üzere [YUG.GetLeader] ile [YUG.Capital.GetName]'da bir toplantıdan bugün [BUL.Capital.GetName]'a döndü. Toplantının sonunda, her iki ülkeden devlet adamları Antlaşmayı imzaladı, ancak gelecekte bu faydalı ilişkiyi sadece korumakla kalmayıp aynı zamanda genişletme karşılıklı arzusuyla bazı maddeleri açık bıraktılar."
 bftb_bulgaria_yugoslavian_influence.2.t:0 "[FROM.GetNameDefCap] Ebedi Dostluk Antlaşmasını İmzalıyor"
 bftb_bulgaria_yugoslavian_influence.3.a:0 "Ne büyük bir zaman kaybı..."
 bftb_bulgaria_yugoslavian_influence.3.desc:0 "[GetBulgarianLeaderToMeetStalin], [YUG.GetNameDef] ile [ROOT.GetNameDef] arasında Ebedi Dostluk Antlaşması imzalama teklifini görüşmek üzere [YUG.GetLeader] ile [YUG.Capital.GetName]'da bir toplantıdan bugün [BUL.Capital.GetName]'a döndü. Maalesef, [YUG.GetLeader] [ROOT.GetNameDef] ile dost olma fikrine pek hevesli görünmedi ve nihayetinde teklifimizi reddetti."
 bftb_bulgaria_yugoslavian_influence.3.t:0 "[FROM.GetNameDefCap] Ebedi Dostluk Antlaşmamızı Reddediyor"
 bftb_bulgarian_claims.1.a:0 "Bulgar iddialarını tanı."
 bftb_bulgarian_claims.1.a_tt:0 "§YÖnceden Ayarlanmış Bulgar Toprak Genişlemesi§! Etkenine sahip Eyaletler, herhangi bir ittifak müttefiki eyaleti kontrol ettiğinde ve [BUL.GetNameDef] [ROOT.GetFactionName]'e katıldığında [BUL.GetNameDef]'e devredilecektir."
 bftb_bulgarian_claims.1.b:0 "Herhangi bir toprak genişlemesini uygun gördüğümüz şekilde biz organize edeceğiz!"
 bftb_bulgarian_claims.1.desc:0 "Bir [BUL.GetNameDef] heyeti, Balkanlar'daki iddiaları için [ROOT.GetAdjective] desteği istemek ve yakın gelecekte bölgedeki [BUL.GetAdjective] toprak genişlemesini gizlice müzakere edip güvence altına almak amacıyla hükümetimize yaklaştı; karşılığında ise [BUL.GetAdjective]'in [ROOT.GetNameDef] ile hizalanması ve ülkenin [ROOT.GetFactionName]'e girmesi var."
 bftb_bulgarian_claims.1.t:0 "Bulgaristan Balkan İddialarının Garanti Edilmesini İstiyor"
 bftb_bulgarian_claims.2.a:0 "Daha iyisi olamayacak bir anlaşma!"
 bftb_bulgarian_claims.2.desc:0 "Balkanlar'daki toprak genişlememizi müzakere etmek için [FROM.Capital.GetName]'a gönderilen [ROOT.GetAdjective] heyeti, görevin tam bir başarı olduğunu bildirmek için [ROOT.Capital.GetName]'a döndü. [FROM.GetAdjective]lerle, [FROM.GetNameDef]'in iddialarımızı tanıdığı ve işgal altındaki Balkan devletlerinde barış koruyucuları rolünü üstlenerek, resmi olarak [FROM.GetFactionName]'e katıldığımızda kontrolü [ROOT.GetNameDef]'e devretmeyi kabul ettiği gizli bir anlaşma yaptılar."
 bftb_bulgarian_claims.2.t:0 "[GER.GetNameDefCap] İddialarımızı Tanıyor"
 bftb_bulgarian_claims.3.a:0 "O zaman daha az incelikli genişleme yolları kullanmak zorunda kalacağız..."
 bftb_bulgarian_claims.3.desc:0 "Balkanlar'daki iddialarımızın [FROM.GetAdjective]ler tarafından tanınmasını müzakere etmek üzere [FROM.Capital.GetName]'a gönderilen [ROOT.GetAdjective] heyeti, [ROOT.Capital.GetName]'a geri dönerek, Balkanlar'daki [ROOT.GetAdjective] toprak genişlemesini güvence altına almak amacıyla [FROM.GetNameDef] ile bir anlaşma yapma görevinde başarısız olduğunu bildirdi."
 bftb_bulgarian_claims.3.t:0 "[GER.GetNameDefCap] İddialarımızı Reddediyor"
 bftb_bulgarian_claims.4.a:0 "Hakkımız olanı alıyoruz!"
 bftb_bulgarian_claims.4.desc:0 "Daha önce anlaşıldığı gibi, [GER.GetNameDef], [GER.GetFactionName] güçleri tarafından işgal edilen ve [ROOT.GetNameDef] tarafından talep edilen toprakların kontrolünün devredilmesini emretti, bu topraklar bundan böyle [ROOT.GetAdjective] hükümeti tarafından yönetilecektir."
 bftb_bulgarian_claims.4.t:0 "[GER.GetNameDefCap] Bulgar Kontrolünü Veriyor"
 bftb_bulgarian_claims.5.a:0 "Bu, anlaşmanın bizim payımıza düşen kısmıydı"
 bftb_bulgarian_claims.5.desc:0 "Daha önce anlaşıldığı gibi, [GER.GetFactionName] güçleri tarafından işgal edilen ve [ROOT.GetNameDef] tarafından talep edilen toprakların kontrolünün devredilmesini emrettik, bu topraklar bundan böyle [ROOT.GetAdjective] hükümeti tarafından yönetilecektir."
 bftb_bulgarian_claims.5.t:0 "Bulgar İşgali Onaylandı"
 bftb_bulgarian_claims.6.a:0 "O Bulgar türedileri!"
 bftb_bulgarian_claims.6.b:0 "Hakları yok!"
 bftb_bulgarian_claims.6.desc:0 "[GER.GetAdjective] ve [BUL.GetAdjective] hükümetleri tarafından daha önce anlaşıldığı gibi, [GER.GetNameDef], [BUL.GetNameDef] tarafından talep edilen ve şu anda bizim tarafımızdan işgal edilen toprakların kontrolünün devredilmesini emretti, bu topraklar bundan böyle [BUL.GetAdjective] hükümeti tarafından yönetilecektir."
 bftb_bulgarian_claims.6.t:0 "[GER.GetNameDefCap] Bulgar İşgalini Onaylıyor"
 bftb_bulgarian_claims.7.a:0 "Anlaşıldı, birliklerimize başka yerlerde ihtiyacımız var!"
 bftb_bulgarian_claims.7.b:0 "Bulgar toprak emelleri sınırsız!"
 bftb_bulgarian_claims.7.desc:0 "İşgal altındaki Balkan topraklarında barış koruma rollerini üstlenen [FROM.GetAdjective]ler, [ROOT.GetFactionName] tarafından ele geçirilen topraklarda düzeni ve istikrarı korumak ve [ROOT.GetAdjective] garnizonlarını rahatlatarak birliklerimizin diğer cepheleri takviye etmesini sağlamak için [FROM.FROM.GetName]'ın idari kontrolünü onlara vermemizi teklif ettiler."
 bftb_bulgarian_claims.7.t:0 "[FROM.GetNameDefCap], [FROM.FROM.GetName]'ın Kontrolünü İstiyor"
 bftb_bulgarian_claims.8.a:0 "Bulgaristan için daha fazla toprak!"
 bftb_bulgarian_claims.8.desc:0 "[FROM.GetAdjective] hükümeti, [FROM.FROM.FROM.GetName]'ın idari kontrolünü [ROOT.GetNameDef]'e devretmeyi kabul etti. Şimdi bölgede barış koruyucuları olarak rolümüzü üstleneceğiz, sadece bölgede düzeni ve istikrarı korumakla kalmayıp, aynı zamanda herhangi bir düşman saldırısına karşı onu savunabilecek bir garnizon konuşlandıracağız."
 bftb_bulgarian_claims.8.t:0 "[FROM.GetNameDefCap], [FROM.FROM.FROM.GetName]'ın Kontrolünü Devrediyor"
 bftb_bulgarian_claims.9.a:0 "Belki daha sonra o zaman..."
 bftb_bulgarian_claims.9.desc:0 "[FROM.GetAdjective] hükümeti, [FROM.FROM.FROM.GetName]'ın idari kontrolünü [ROOT.GetNameDef]'e vermeyi reddediyor. Böyle bir teklifi öne sürmemizin asıl nedeninin, savaş kazanıldığında Balkanlar'dan daha fazla pay kapma umuduyla [ROOT.GetAdjective] işgal bölgesini genişletmek olduğunu iddia ediyorlar ve hatta [FROM.GetLeader]'in kendisi bile toprak emellerimizin onu rahatsız etmeye başladığını ilan etti."
 bftb_bulgarian_claims.9.t:0 "[FROM.GetNameDefCap], [FROM.FROM.FROM.GetName] üzerinde [ROOT.GetAdjective] kontrolünü reddediyor"
 bftb_greece.1.a:0 "Yunanistan için büyük bir zafer..."
 bftb_greece.1.desc:0 "Yunan halkı, Kral II. Georgios'a sadık muhafazakârların 1936 Yunanistan seçimini kazandığını duyunca şaşırmadı. Başbakan Konstantinos Demertzis'in görevde kalmaya devam etmesi bekleniyor ve Kral, Demertzis'in başbakanlığının çok uzun ve başarılı olacağına dair kişisel inancını dile getirdi. Kral'ın sezgisinin doğru olup olmadığını sadece zaman gösterecek..."
 bftb_greece.1.t:0 "Monarşistler Seçimi Kazandı!"
 bftb_greece.10.a:0 "Sadece [FRA.GetAdjective]ler mi? Şu işi bir an önce bitirelim."
 bftb_greece.10.desc:0 "[TUR.GetNameDef]'in sınırlarının yeniden düzenlenmesi üzerine Kandiye Konvansiyonumuza davetiyeler, orada olmasını istediğimiz tüm güçlere gönderildi. Davet edilen her ülkenin katılmasını beklememize rağmen, zirvemize sadece [FRA.GetNameDef]'in katılacağı ortaya çıktı. Hayal kırıklığı, haberi duyan [ROOT.GetAdjective] yetkililerinin duygularını en iyi tanımlayan kelime olurdu. Ne siyasi elitimiz ne de askeri uzmanlarımız, Kandiye Konvansiyonu'nun sadece [FRA.GetAdjective]lerin yanımızda olmasıyla bir zamanlar inanıldığı gibi meyve vereceğinden emin değil, ancak eylem planımıza bağlı kalmaya devam ediyoruz."
 bftb_greece.10.t:0 "Kandiye Konvansiyonu'na Sadece [FRA.GetNameDef] Katılıyor"
 bftb_greece.101.a:0 "Düşmanlarımız fareler gibi birlikte sinmiş!"
 bftb_greece.101.desc:0 "Komünistler ile Venizelosçular arasında bir ittifak kurulduğuna dair herhangi bir şüphe varsa, artık olamaz. Komünistlerin, monarşiyi devirdikten sonra onu bir tür geçici lider olarak destekleme umuduyla Eleftherios Venizelos'u gizlice ülkeye soktuklarına dair raporlar aldık. \n\nBir grup kızıl hain için bile bu, akılsızca bir plan. Venizelos'un iktidar kendisine verildikten sonra gücü onlara devredeceğini nasıl düşünebilirler? Bu delilik. Ama yine de, ne komünistler ne de Venizelosçular hiçbir zaman en makul grup olmadılar. Kesinlikle çok çekişmeli geçecek bir iç savaşa hazırlanmalıyız."
 bftb_greece.101.t:0 "Venizelosçular ve Komünistler Kral'ın Mutlak Yönetimine Karşı Birleşiyor"
 bftb_greece.102.a:0 "Bu anarşistlerin cezasız bir şekilde bize saldırmasına izin veremeyiz."
 bftb_greece.102.desc:0 "Kolluk kuvvetleri, ordu için tüfek ürettiğimiz fabrikalarımızdan birine yapılan son komünist baskınını öngörüp durduramadı. Marksistler fabrika zemininden çalabilecekleri her şeyi çaldılar ve ardından fabrikayı yakmaya çalıştılar, ancak neyse ki sadece binaya zarar vermeyi başardılar. \n\nBu isyancıların neden bir silah üreticisine bu kadar cüretkâr bir baskın düzenlediğini tahmin etmeye gerek yok: şüphesiz cesaretlerini toplayıp gölgelerden çıktıklarında kendi tüfeklerimizi bize karşı kullanmayı planlıyorlar. Bu, [ROOT.GetNameDef]'in en kötü iç savaşlarından biri olabilir..."
 bftb_greece.102.t:0 "Komünistler Fabrikaya Baskın Düzenledi"
 bftb_greece.103.a:0 "Limanı da havaya uçurmak zorunda mıydılar gerçekten?"
 bftb_greece.103.desc:0 "Aşağılık liderlerinin hemen ardından, birçok Venizelosçu eski generalin gizlice ülkeye sokulduğu haberini aldık. Komünist ve cumhuriyetçi kaçakçılar, gözden düşmüş askeri liderleri sevk edilen malların arasına gizleyerek ülkeye sokmak için komplo kurdular ve biz ne olduğunu anlayamadan onları sakladılar. \n\nÖrgütsüz isyancılara karşı çetin bir savaş bir şey; yetenekli askeri liderlik tarafından desteklenen tam ölçekli bir iç savaş tamamen başka bir mesele. Birçok danışman şimdi, bu kadar sevilmeyen bir hükümdarın kendini mutlak hükümdar ilan ederek bu kadar halka açık ve sevilmeyen bir eylem planına girmesinin gerçekten akıllıca bir karar olup olmadığını sorguluyor, ancak [ROOT.GetLeader] isyancıların kısa sürede hakkından gelineceği konusunda ısrarcı."
 bftb_greece.103.t:0 "Venizelosçu Generaller Gizlice Yunanistan'a Sokuldu!"
 bftb_greece.104.a:0 "Durum kontrolden çıkıyor!"
 bftb_greece.104.desc:0 "Yetkililer, hükümete ülkenin kuzeyi ve güneyi üzerindeki kontrolü neredeyse tamamen kaybettiğimizi bildirdi. Komünist ve Venizelosçu sempatizanlar, iftiralarını ve propagandalarını yayarak sokaklarda cirit atıyor: ya aynı derecede sempatik olan ya da onları durdurmaktan tamamen aciz olan yerel yetkililer tarafından engellenmiyorlar. \n\nOrdu, kendilerini bekleyen tuzağı bilerek, bölgeleri güvence altına almak için harekete geçmeyi reddediyor. Ancak, tam teyakkuz halindeler ve Kral'ın kabinesine, Venizelosçular ve komünistler saklandıkları yerden düzgün bir şekilde çıktıklarında ordunun ulusun kontrolünü geri almak için gerekli adımları atmaktan çekinmeyeceği konusunda güvence verildi. Elbette, silahlı kuvvetler genelinde yaygın yolsuzluk ve hain sadakat raporları olduğu göz önüne alındığında, birçok siyasi figür bu güvencelerin samimiyeti konusunda şüpheci."
 bftb_greece.104.t:0 "Güney ve Kuzey'de Organize Direniş Tırmanıyor!"
 bftb_greece.105.a:0 "Kral'ın etrafında toplanın!"
 bftb_greece.105.desc:0 "O kader günü nihayet geldi: Venizelosçuların lideri nihayet gölgelerden çıkarak Kral'ın kararnamesini gayrimeşru ve [FROM.GetNameDef]'in demokrasisine benzeri görülmemiş bir tehdit olarak kınadı. Onların gözünde, zaten iki kez mağlup edilmiş olan Helen Cumhuriyeti'ni restore etmek için monarşiyi şiddetle devirmekten başka seçenekleri yok. \n\n[ROOT.GetLeader] tüm isyancıları hain olarak kınadı ve [ROOT.GetNameDef]'e yeniden düzen getirilmesi için Marksistleri ve cumhuriyetçileri kökünden kazıyacağına söz verdi. Görünüşe göre [ROOT.GetNameDef]'in siyasi arenası bir kez daha, sadece en güçlülerin galip ayrılabildiği bir gladyatör kolezyumuna dönüşmüş."
 bftb_greece.105.t:0 "İç Savaş!"
 bftb_greece.11.a:0 "Bundan iyi bir şey çıkmaz; konvansiyon iptal edilmeli."
 bftb_greece.11.desc:0 "Morali bozuk yetkililerimiz, Kandiye Konvansiyonu'nda [TUR.GetNameDef]'in kaderini belirlemeye sadece [ITA.GetNameDef]'in ilgi gösterdiği şeklindeki berbat haberi derinlemesine düşündüler ve nihayetinde alınacak tek kararın Kandiye Konvansiyonu'nu tamamen iptal etmek olduğuna karar verdiler. Bu, hafife alınarak verilmiş bir karar değil, zira birçok Venizelosçu yetkili, hareketlerinin tüm meşruiyetini 1922'nin intikamını almaya bağladıklarının ve şimdi durumun tüm operasyonun tehlikeye girdiği bir noktaya evrildiğinin fazlasıyla farkında. \n\n[ROOT.GetAdjective] halkı, olay etrafında bu kadar beklenti yaratıldıktan sonra haber alınamaması üzerine şimdiden huzursuzlanmaya başladı. EEE, bu hoşnutsuzluk ateşini büyük bir hevesle körükleyerek hükümetimizi zayıflıkla ve vaatlerimizi yerine getirememekle suçluyor. [ROOT.GetLeader] bizi bu bulanık sulardan nasıl çıkaracak?"
 bftb_greece.11.t:0 "Kandiye Konvansiyonu'na Sadece [ITA.GetNameDef] Katılıyor"
 bftb_greece.12.a:0 "[ROOT.GetAdjective] elleri dünyayı şekillendirecek."
 bftb_greece.12.desc:0 "Başkentte toplanan yetkililer, hem [ENG.GetNameDef]'in hem de [FRA.GetNameDef]'in Kandiye Konvansiyonumuza katılmak üzere delege göndereceğini duymaktan büyük memnuniyet duydu. Zirve için hazırlıklar çoktan yapıldı ve konvansiyon birkaç gün içinde resmen başlayacak. \n\nDelegelerimiz birlikte kuzey ve güney [TUR.GetName]'da nüfuz sahaları oluşturacak ve nihayetinde Ege boyunca meşru topraklarımızın bize verilip verilmeyeceğine karar verecekler. Tarih yazılmak üzere ve [ROOT.GetNameDef] bunun tam merkezinde olacak."
 bftb_greece.12.t:0 "[ENG.GetNameDefCap] ve [FRA.GetNameDef] Kandiye Konvansiyonu'na Katılıyor"
 bftb_greece.13.a:0 "Bu ilginç olacak..."
 bftb_greece.13.desc:0 "Başkentte toplanan yetkililer, hem [ENG.GetNameDef]'in hem de [FRA.GetNameDef]'in Kandiye Konvansiyonumuza katılmak üzere delege göndereceğini duymaktan büyük memnuniyet duydu, ancak bu coşku [ITA.GetNameDef]'in katılımı konusundaki endişeyle kısa kesildi. Siyasi isimlerimizden birçoğu, [ITA.GetAdjective] entrikalarının tüm etkinliği sabote edebileceğine dair endişelerini özel olarak dile getirdi, ancak [ROOT.GetLeader], [ITA.GetNameDef]'i davet etmenin doğru karar olduğuna ikna olmuş durumda. Zirve için hazırlıklar çoktan yapıldı ve konvansiyon birkaç gün içinde resmen başlayacak. \n\nDelegelerimiz birlikte kuzey ve güney [TUR.GetName]'da nüfuz sahaları oluşturacak ve nihayetinde Ege boyunca meşru topraklarımızın bize verilip verilmeyeceğine karar verecekler. Tarih yazılmak üzere ve [ROOT.GetNameDef] bunun tam merkezinde olacak."
 bftb_greece.13.t:0 "Sevr İmzacılarının Tümü Kandiye Konvansiyonu'na Katılıyor"
 bftb_greece.14.a:0 "Kibrimiz bizi felaketimize sürükledi."
 bftb_greece.14.desc:0 "Hükümetimiz, davet edilen ülkelerden hiçbirinin Kandiye Konvansiyonumuza delege göndermeyeceği haberiyle tamamen ve kesinlikle aşağılanmıştır ve daha da kötüsü, liderliğimizin bu büyük güçler tarafından bölgedeki gerilimi tırmandırdığı için kamuoyu önünde eleştirilmesidir. Bu olaylar zincirinin yıkıcıdan daha az bir şey olduğunu söylemek yetersiz kalır, zira birçok Venizelosçu yetkili, hareketlerinin tüm meşruiyetini 1922'nin intikamını almaya bağladıklarının ve şimdi durumun tüm operasyonun tehlikeye girdiği bir noktaya evrildiğinin fazlasıyla farkında. \n\n[ROOT.GetAdjective] halkı, olay etrafında bu kadar beklenti yaratıldıktan sonra haber alınamaması üzerine şimdiden huzursuzlanmaya başladı. EEE, bu hoşnutsuzluk ateşini büyük bir hevesle körükleyerek hükümetimizi zayıflıkla ve vaatlerimizi yerine getirememekle suçluyor. [ROOT.GetLeader] bizi bu bulanık sulardan nasıl çıkaracak?"
 bftb_greece.14.t:0 "Konvansiyonumuza Kimse Katılmıyor!"
 bftb_greece.15.a:0 "Kabul oyu veriyoruz!"
 bftb_greece.15.b:0 "Red oyu veriyoruz!"
 bftb_greece.15.desc:0 "İlk oylama turunun konusu, [TUR.GetNameDef]'nin teslim olması üzerine [FRA.GetNameDef]'ya [TUR.GetAdjective]iye K*rdistanı'nda bir [FRA.GetAdjective] mandasına izin verilip verilmeyeceğidir. Katılan birçok [FRA.GetAdjective] yetkili, [FRA.GetNameDef]'nın bölgeye yakınlığı ve [TUR.GetAdjective]iye K*rdistanı'nda zaten mevcut olan oldukça belirgin milliyetçilik duygusu göz önüne alındığında böyle bir düzenlemenin son derece mantıklı olduğunu öne sürüyor, ancak [FRA.GetAdjective] imparatorluğunun zaten ne kadar yayılmış olduğu göz önüne alındığında içeride bu fikre olası bir direnişin olabileceği de kabul edildi. \n\nEğer [FRA.GetAdjective]lara [TUR.GetNameDef]'deki tavizleri verilirse, [GRE.GetNameDef]'nın [TUR.GetNameDef] ile savaşı başladığında yardıma gelmek için antlaşma yoluyla bağlanacaklar. Eğer önerge geçmezse, Kandiye Konvansiyonu'nun sonucundan bağımsız olarak, [FRA.GetNameDef]'nın savaşları başladığında [GRE.GetNameDef]'a karşı hiçbir yükümlülüğü olmayacaktır."
 bftb_greece.15.t:0 "Kandiye Konvansiyonu - K*rdistan'da bir [FRA.GetAdjective] Mandası mı?"
 bftb_greece.16.a:0 "Kabul oyları kazandı!"
 bftb_greece.16.desc:0 "Katılan delegelerin çoğunluğu, [TUR.GetAdjective] devletinin başarılı bir şekilde devrilmesi üzerine K*rdistan'da [FRA.GetNameDef]'ya bir manda verilmesi yönünde oy kullandı. [FRA.GetAdjective] yetkilileri, bilge devlet adamlıkları için katılan delegeleri övdü ve bölgede bir yönetim kurulması için planlamaya başlamak üzere merkezi [FRA.GetAdjective] hükümetine talimatları çoktan iletti."
 bftb_greece.16.t:0 "Kandiye Konvansiyonu - [FRA.GetAdjective]ler Mandalarını Aldı!"
 bftb_greece.166.a:0 "Ja, yatırım yapacağız!"
 bftb_greece.166.b:0 "Bu sefer yatırım olmayacak..."
 bftb_greece.166.c:0 "Nein, onların acınası ülkesine asla yatırım yapmayacağız!"
 bftb_greece.166.desc:0 "[FROM.GetAdjective]ler ekonomik bağlarımızı derinleştirmeyi daha fazla görüşmek üzere bizi davet etmeye karar verdiğinde reddedemedik. Söylemeye gerek yok, [FROM.GetAdjective]'in endüstriyel konumunun güçlendirilmesinin neden ideal olabileceğine dair ikna edici bir gerekçe sundular. Onların ulusuna yatırım yapıp yapmayacağımız veya endüstriyel potansiyellerini kadere bırakıp bırakmayacağımız bizim karar vereceğimiz bir mesele."
 bftb_greece.166.t:0 "Siyasetçilerimiz Atina'daki Yatırım Müzakerelerinden Dönüyor"
 bftb_greece.167.a:0 "Ja, yatırım yapacağız!"
 bftb_greece.167.b:0 "Bu sefer yatırım olmayacak..."
 bftb_greece.167.c:0 "Nein, onların acınası ülkesine asla yatırım yapmayacağız!"
 bftb_greece.167.desc:0 "[FROM.GetAdjective]ler bizim için oldukça iyi bir gösteri yaptı! Yatırımımızı çekme teklifleri şüphesiz çekiciydi, ancak bizim de kesinlikle ilgilenmemiz gereken kendi önceliklerimiz var. [FROM.GetAdjective] ulusuna yatırım yapıp yapmayacağımız seçimi bize bırakıldı."
 bftb_greece.167.t:0 "İş Adamlarımız [FROM.GetAdjective] Ulusal Vitrininden Dönüyor"
 bftb_greece.168.a:0 "Sonuçlarından kaçınmak için bu seferlik taviz vereceğiz..."
 bftb_greece.168.b:0 "Oyunun kurallarını onların aleyhine çevir, Schacht!"
 bftb_greece.168.c:0 "[FROM.GetAdjective] şantajına asla boyun eğmeyeceğiz!"
 bftb_greece.168.d:0 "Hadlerini aştılar; sonuçlarına katlanmalılar!"
 bftb_greece.168.desc:0 "[FROM.GetNameDef]'deki o zeki küçük haşereler (Schädlinge), kendi saadet zincirimizi bize karşı kullanmanın bir yolunu buldular. Schahtplan'ın hatalarını lehimize kullanabilmemiz için tasarlanmış güvenli küçük bir yasal boşluk, bunun mümkün olmaması gerekirken aleyhimize çevrildi. Ya itibarımızı koruyup [FROM.GetAdjective]lere bu küçük galibiyeti veririz ya da kurallara göre oynama maskesini bir kenara bırakıp [FROM.GetAdjective] halkıyla görüşmelerden kaçarız."
 bftb_greece.168.t:0 "[FROM.GetAdjective]ler Schachtplan'ı Kullanarak Bize Şantaj Yapıyor!"
 bftb_greece.169.a:0 "Coşkulu bir başarı!"
 bftb_greece.169.b:0 "Coşkulu bir başarı!"
 bftb_greece.169.c:0 "Müthiş iş, millet!"
 bftb_greece.169.desc:0 "[FROM.GetAdjective] yatırımcılarını son kısa ziyaretlerinin ardından ülkemize tekrar karşılama işlemini yeni bitirdik ve yatırım ve fırsat müjdeleri getiriyorlar! Onların yardımıyla, gerçekten modern bir ekonomi inşa edeceğiz."
 bftb_greece.169.t:0 "[FROM.GetAdjective]ler Yatırım Yapıyor!"
 bftb_greece.17.a:0 "Red oyları kazandı!"
 bftb_greece.17.desc:0 "Katılan delegelerin çoğunluğu, [TUR.GetAdjective] devletinin başarılı bir şekilde mağlup edilmesi üzerine K*rdistan'da [FRA.GetNameDef]'ya herhangi bir toprak verilmemesi yönünde oy kullandı. [FRA.GetAdjective] yetkilileri, olayı gülünç olarak nitelendirerek neredeyse konvansiyondan tamamen ayrılmaya karar verdiler, ancak kendilerine hiçbir şey vaat edilmese bile sonraki işlemleri etkileyebilmeyi tercih edecekleri konusunda bir fikir birliğine vardılar."
 bftb_greece.17.t:0 "Kandiye Konvansiyonu - [FRA.GetAdjective]lerin Mandası Reddedildi!"
 bftb_greece.170.a:0 "Belki bir dahaki sefere."
 bftb_greece.170.desc:0 "Maalesef, [FROM.GetAdjective]lerin bu sefer ekonomimize yatırım yapmayacağı haberini aldık. Bu hayal kırıklığı yaratan bir gelişme olsa da, [FROM.GetAdjective] delegesi gelecekteki yatırımları dışlamadı, ki bu bizim için iyiye işaret."
 bftb_greece.170.t:0 "[FROM.GetAdjective]ler Yatırım Yapmamaya Karar Verdi"
 bftb_greece.171.a:0 "Belki... [ITA.GetAdjective]ler bir anlaşmaya daha sıcak bakabilir mi?"
 bftb_greece.171.desc:0 "Yatırım meselesini fazla zorlamış olabiliriz: [FROM.GetAdjective]ler, ulusumuzun gelişmekte olan sanayi tabanına yatırım yapmaya ilgi duymadıklarına karar verdiler. Eğer geleceği şekillendirmemize yardım etmek istemiyorlarsa, onlarsız idare etmek zorunda kalacağız."
 bftb_greece.171.t:0 "[FROM.GetAdjective]ler Yatırım Görüşmelerinden Kalıcı Olarak Kaçıyor!"
 bftb_greece.172.a:0 "Finans Büyücüsü yine sahnede!"
 bftb_greece.172.desc:0 "Anlaşmayı ilk başta hazırlayan adam hala bir kabine bakanıyken Schachtplan'ı kullanarak [FROM.GetAdjective]lere şantaj yapabileceğimizi düşündüğümüz için ne kadar aptalmışız! Şimdi onlara ödeme yapması gereken ulus biz olduk! Ne felaket ama!"
 bftb_greece.172.t:0 "Hjalmar Schacht Bizi Kandırdı!"
 bftb_greece.173.a:0 "Yatırım yapabilmeleri için onlara bir imtiyaz belgesi vereceğiz."
 bftb_greece.173.b:0 "Bu, şu anda Britanya'nın çıkarlarına uygun değil."
 bftb_greece.173.c:0 "Üzgünüm beyler, ama Britanya'nın başka yerde daha önemli işleri var!"
 bftb_greece.173.desc:0 "[FROM.GetAdjective]ler ekonomik bağlarımızı derinleştirmeyi daha fazla görüşmek üzere bizi davet etmeye karar verdiğinde reddedemedik. Söylemeye gerek yok, [FROM.GetAdjective]'in endüstriyel konumunun güçlendirilmesinin neden ideal olabileceğine dair ikna edici bir gerekçe sundular. Onların ulusuna yatırım yapıp yapmayacağımız veya endüstriyel potansiyellerini kadere bırakıp bırakmayacağımız bizim karar vereceğimiz bir mesele."
 bftb_greece.173.t:0 "Girişimcilerimiz Atina'daki Müzakerelerden Dönüyor!"
 bftb_greece.174.a:0 "Desteğimize güvenebilirler!"
 bftb_greece.174.b:0 "Bu sefer Britanya'nın çıkarlarına uygun değil."
 bftb_greece.174.c:0 "Üzgünüm beyler, ama Britanya'nın başka yerde daha önemli işleri var!"
 bftb_greece.174.desc:0 "[FROM.GetAdjective]ler bizim için oldukça iyi bir gösteri yaptı! Yatırımımızı çekme teklifleri şüphesiz çekiciydi, ancak bizim de kesinlikle ilgilenmemiz gereken kendi önceliklerimiz var. [FROM.GetAdjective] ulusuna yatırım yapıp yapmayacağımız seçimi bize bırakıldı."
 bftb_greece.174.t:0 "Siyasetçilerimiz [FROM.GetAdjective] Ulusal Vitrinine Katılıyor"
 bftb_greece.175.a:0 "Adil bir takas! Neredeyse."
 bftb_greece.175.b:0 "Şu anda [FROM.GetAdjective] parçalarına ihtiyacımız yok."
 bftb_greece.175.c:0 "Üzgünüm [FROM.GetNameDef], ama sizinle işimiz bitti. Kalıcı olarak!"
 bftb_greece.175.desc:0 "[FROM.GetAdjective]lerden ilginç bir teklif: uluslarına artan yatırım karşılığında gemilerimizin imalatını kolaylaştırmak için bize parça teklif etmek istiyorlar. Devlet aktörlerinin bu kadar temel bir seviyede pazarlık yapması belki biraz alışılmadıktır, ama yine de [FROM.GetAdjective]ler hakkında şimdiye kadar gerçekten geleneksel olan tek şey dinleridir."
 bftb_greece.175.t:0 "[FROM.GetAdjective] Yatırım Karşılığında Gemi Parçaları Teklif Ediyor"
 bftb_greece.176.a:0 "Coşkulu bir başarı!"
 bftb_greece.176.b:0 "Coşkulu bir başarı!"
 bftb_greece.176.c:0 "[FROM.GetAdjective]'e her zaman güvenebiliriz!"
 bftb_greece.176.desc:0 "[FROM.GetAdjective] yatırımcılarını son kısa ziyaretlerinin ardından ülkemize tekrar karşılama işlemini yeni bitirdik ve yatırım ve fırsat müjdeleri getiriyorlar! Onların yardımıyla, gerçekten modern bir ekonomi inşa edeceğiz."
 bftb_greece.176.t:0 "[FROM.GetAdjective] Yatırım Yapmaya Karar Verdi!"
 bftb_greece.177.a:0 "Neyse, belki bir dahaki sefere."
 bftb_greece.177.desc:0 "Maalesef, [FROM.GetAdjective]'in bu sefer ekonomimize yatırım yapmayacağı haberini aldık. Bu hayal kırıklığı yaratan bir gelişme olsa da, [FROM.GetAdjective] delegesi gelecekteki yatırımları dışlamadı, ki bu bizim için iyiye işaret."
 bftb_greece.177.t:0 "[FROM.GetAdjective] Bu Sefer Yatırım Yapmamaya Karar Verdi"
 bftb_greece.178.a:0 "Ruslarla bir anlaşma yapmaya cüret edebilir miyiz?"
 bftb_greece.178.desc:0 "Yatırım meselesini fazla zorlamış olabiliriz: [FROM.GetAdjective]ler, ulusumuzun gelişmekte olan sanayi tabanına yatırım yapmaya ilgi duymadıklarına karar verdiler. Eğer geleceği şekillendirmemize yardım etmek istemiyorlarsa, onlarsız idare etmek zorunda kalacağız."
 bftb_greece.178.t:0 "[FROM.GetAdjective] Daha Fazla Yatırım Aramamızı Engelleyen Yasayı Geçirdi!"
 bftb_greece.179.a:0 "Oui, küçük bir miktar yatırım yapabiliriz."
 bftb_greece.179.b:0 "Bu sefer olmaz."
 bftb_greece.179.c:0 "[FROM.GetAdjective] işleriyle hiç ilgilenmiyoruz!"
 bftb_greece.179.desc:0 "[FROM.GetAdjective] yetkililer ekonomik bağlarımızı daha da derinleştirmeyi görüşmek üzere bizi davet etmeye karar verdiklerinde reddedemedik. Söylemeye gerek yok, [FROM.GetAdjective] sanayi durumunun güçlendirilmesinin neden ideal olabileceği konusunda ikna edici bir vaka sundular. Uluslarına yatırım yapıp yapmayacağımız veya sanayi potansiyellerini kadere bırakıp bırakmayacağımız meselesi, bizim karar vereceğimiz bir konudur."
 bftb_greece.179.t:0 "[FROM.GetAdjective] Yetkililer Başkentte Bize Yaklaşarak Yatırım İçin Dilekçe Veriyor"
 bftb_greece.18.a:0 "Kabul oyu veriyoruz!"
 bftb_greece.18.b:0 "Red oyu veriyoruz!"
 bftb_greece.18.desc:0 "Bu oylama turunun konusu, [TUR.GetNameDef]'in teslim olması üzerine [ENG.GetNameDef]'e [TUR.GetAdjective] [354.GetName]'nda bir Ermeni himayesi verilip verilmeyeceğidir. [TUR.GetAdjective] sınırları içinde bir Ermeni devletinin kurulup kurulmayacağı konusu, rahatsız edici derecede yakın olaylar göz önüne alındığında tartışmalı olmuştur, ancak [ENG.GetAdjective] delegeleri, [SOV.GetAdjective] sınırında bir Ermeni devleti kurmanın sadece ahlaki bir davranış olmadığını, aynı zamanda stratejik olarak da çok sağlam bir pozisyon olduğunu savunuyorlar. \n\nEğer [ENG.GetAdjective]lere [TUR.GetNameDef]'deki tavizleri verilirse, [GRE.GetNameDef]'in [TUR.GetNameDef] ile savaşı başladığında yardıma gelmek için antlaşma yoluyla bağlanacaklar. Eğer önerge geçmezse, Kandiye Konvansiyonu'nun sonucundan bağımsız olarak, [ENG.GetNameDef]'in savaşları başladığında [GRE.GetNameDef]'e karşı hiçbir yükümlülüğü olmayacaktır."
 bftb_greece.18.t:0 "Kandiye Konvansiyonu - Ermenistan'da bir [ENG.GetAdjective] Himayesi mi?"
 bftb_greece.180.a:0 "Oui, [FROM.GetNameDef]'e yatırım yapacağız"
 bftb_greece.180.b:0 "Bu sefer olmaz."
 bftb_greece.180.c:0 "[FROM.GetNameDef] işleriyle hiç ilgilenmiyoruz!"
 bftb_greece.180.desc:0 "[FROM.GetAdjective]ler bizim için oldukça iyi bir gösteri yaptı! Yatırımımızı çekme teklifleri şüphesiz çekiciydi, ancak bizim de kesinlikle ilgilenmemiz gereken kendi önceliklerimiz var. [FROM.GetAdjective] ulusuna yatırım yapıp yapmayacağımız seçimi bize bırakıldı."
 bftb_greece.180.t:0 "Yetkililerimiz [FROM.GetNameDef]'de Düzenlenen Ulusal Vitrine Katılıyor"
 bftb_greece.181.a:0 "Şu anda grevleri göze alamayız..."
 bftb_greece.181.b:0 "Tehditleriniz bizi korkutmuyor, ödlekler (Sans-couilles)!"
 bftb_greece.181.c:0 "Ah, Grèce - le roi des cons! Bizden uzak durun!"
 bftb_greece.181.desc:0 "[FROM.GetNameDef]'deki o sinsi alçaklar, ev dedikleri o kaya yığınına yatırım yapmamız için kolumuzu bükmeyi planladılar! Sendikalarımız bizi protesto ediyor; çok cömert [FROM.GetAdjective] halkının tekliflerini kasten geri çevirerek istihdam sorununu bilerek kötüleştirdiğimizi iddia ediyorlar. Bu saçmalık; yolsuzlukları gün gibi ortada. Yine de, bütün kozlar onların elinde. En az direnişin olduğu yolu seçip sendikalara ve dolayısıyla [FROM.GetNameDef]'e istediklerini mi vereceğiz? Yoksa ilkelerimizin arkasında mı duracağız, tam da ilkelerin hepimizi mahvedebileceği bir zamanda?"
 bftb_greece.181.t:0 "[FROM.GetAdjective] Hükümeti Sendikalarımıza Rüşvet Veriyor!"
 bftb_greece.182.a:0 "Coşkulu bir başarı!"
 bftb_greece.182.b:0 "Coşkulu bir başarı!"
 bftb_greece.182.c:0 "Gerçekten de, bizimki harika bir dostluk!"
 bftb_greece.182.desc:0 "[FROM.GetAdjective] yatırımcılarını son kısa ziyaretlerinin ardından ülkemize tekrar karşılama işlemini yeni bitirdik ve yatırım ve fırsat müjdeleri getiriyorlar! Onların yardımıyla, gerçekten modern bir ekonomi inşa edeceğiz."
 bftb_greece.182.t:0 "[FROM.GetAdjective] Yatırım Yapıyor!"
 bftb_greece.183.a:0 "Neyse, belki bir dahaki sefere."
 bftb_greece.183.desc:0 "Maalesef, [FROM.GetAdjective]'in bu sefer ekonomimize yatırım yapmayacağı haberini aldık. Bu hayal kırıklığı yaratan bir gelişme olsa da, [FROM.GetAdjective] delegesi gelecekteki yatırımları dışlamadı, ki bu bizim için iyiye işaret."
 bftb_greece.183.t:0 "[FROM.GetAdjective] Bu Sefer Yatırım Yapmamaya Karar Verdi"
 bftb_greece.184.a:0 "Ruslarla bir anlaşma yapmaya cüret edebilir miyiz?"
 bftb_greece.184.desc:0 "Yatırım meselesini fazla zorlamış olabiliriz: [FROM.GetAdjective]ler, ulusumuzun gelişmekte olan sanayi tabanına yatırım yapmaya ilgi duymadıklarına karar verdiler. Eğer geleceği şekillendirmemize yardım etmek istemiyorlarsa, onlarsız idare etmek zorunda kalacağız."
 bftb_greece.184.t:0 "[FROM.GetAdjective] Delegemizi Kovdu ve Yatırım İhtimalini Ortadan Kaldırdı"
 bftb_greece.185.a:0 "Savaşmaya alternatifler var!"
 bftb_greece.185.b:0 "Belki daha sonraki bir tarihte."
 bftb_greece.185.c:0 "Onlar fethedildikten sonra sanayileşme için bir şans olacak!"
 bftb_greece.185.desc:0 "[FROM.GetAdjective]ler ekonomik bağlarımızı derinleştirmeyi görüşmek üzere bizi davet etmeye karar verdiğinde, reddedemedik. [FROM.GetAdjective]leri mali yardım için bize gelecek kadar çaresiz kılan ne olabilirdi ki? Söylemeye gerek yok, [FROM.GetAdjective]'in endüstriyel konumunun güçlendirilmesinin neden ideal olabileceğine dair ikna edici bir gerekçe sundular... özellikle de bu bizimkini de iyileştirebilecekken. Onların ulusuna yatırım yapıp yapmayacağımız veya endüstriyel potansiyellerini kadere bırakıp bırakmayacağımız bizim karar vereceğimiz bir mesele."
 bftb_greece.185.t:0 "[FROM.GetAdjective]ler Ülkelerini Sanayileştirme Konusunda Bizden Yardım İstiyor"
 bftb_greece.186.a:0 "Yardım takdir edilecektir."
 bftb_greece.186.b:0 "Belki gelecekte anlaşabiliriz, ama şimdi olmaz."
 bftb_greece.186.c:0 "Ah, vasallıktan o kadar kolay kaçılamaz!"
 bftb_greece.186.desc:0 "[FROM.GetNameDef]'den, hükümetinin ülkelerindeki artan [ROOT.GetAdjective] siyasi müdahalesinden duyduğu endişeyi ileten bir delege aldık. Onlara bir pazarlık yapma yetkisi verildi: bize maddi mallar sağlayacaklar ve biz de devletlerinin her mekanizmasının kontrolünü ele geçirmekten vazgeçeceğiz. \n\nBiz, elbette, böyle bir müdahalenin gerçekleştiğini reddettik, hepimiz doğru olduğunu bilsek de. Teklif cömert bir teklif; şüphesiz [FROM.GetAdjective]'in egemenliğini güvende tutma arzusu samimi. Malzeme akışını kullanabiliriz, ama yine de, [FROM.GetNameDef]'i tamamen avucumuzun içinde de tutabiliriz..."
 bftb_greece.186.t:0 "[FROM.GetAdjective] Diplomatlar [ROOT.GetAdjective] Hırslarını Akdeniz'de Yumuşatmayı Umuyor"
 bftb_greece.187.a:0 "Şeytan'la yapılan bir anlaşma, ölümden daha iyidir."
 bftb_greece.187.b:0 "Devam eden bağımsızlığımız için ağır bir bedel ödüyoruz."
 bftb_greece.187.desc:0 "[FROM.GetAdjective] yatırımcılarını son kısa ziyaretlerinin ardından ülkemize tekrar karşılama işlemini yeni bitirdik ve yatırım ve fırsat müjdeleri getiriyorlar! Yanlarında davetsiz gözlemciler de getiriyorlar, ki buraya ne yapmak için gönderildilerse onu yaparken onları çabucak gözden kaybettik. Ne olursa olsun, [FROM.GetAdjective] yardımıyla, gerçekten modern bir ekonomi inşa edeceğiz."
 bftb_greece.187.t:0 "[FROM.GetAdjective] Yatırım Yapıyor!"
 bftb_greece.188.a:0 "Belki de bu, gizli bir lütuftur..."
 bftb_greece.188.desc:0 "Maalesef, [FROM.GetAdjective]'in bu sefer ekonomimize yatırım yapmayacağı haberini aldık. Bu hayal kırıklığı yaratan bir gelişme olsa da, [FROM.GetAdjective] delegesi gelecekteki yatırımları dışlamadı, ki bu bizim için iyiye işaret."
 bftb_greece.188.t:0 "[FROM.GetAdjective] Bu Sefer Yatırım Yapmıyor"
 bftb_greece.189.a:0 "Bu kesinlikle daha kötü şeylerin habercisi."
 bftb_greece.189.desc:0 "Yatırım meselesini fazla zorlamış olabiliriz: [FROM.GetAdjective]ler, ulusumuzun gelişmekte olan sanayi tabanına yatırım yapmaya ilgi duymadıklarına karar verdiler. Eğer geleceği şekillendirmemize yardım etmek istemiyorlarsa, onlarsız idare etmek zorunda kalacağız."
 bftb_greece.189.t:0 "[FROM.GetAdjective]ler Delegelerimizi Geri Çeviriyor ve Diplomatlarımızı Kovuyor!"
 bftb_greece.19.a:0 "Kabul oyları kazandı!"
 bftb_greece.19.desc:0 "Katılan delegelerin çoğunluğu, mağlup bir [TUR.GetName]'nın enkazından oyulmuş bir Ermeni himayesinin [ENG.GetNameDef]'e verilmesi yönünde oy kullandı. [ENG.GetAdjective] yetkilileri, bilge devlet adamlıkları için katılan delegeleri övdü ve bölgede bir yönetim kurulması için planlamaya başlamak üzere merkezi [ENG.GetAdjective] hükümetine talimatları çoktan iletti."
 bftb_greece.19.t:0 "Kandiye Konvansiyonu - [ENG.GetAdjective]ler Himayelerini Aldı!"
 bftb_greece.190.a:0 "[ROOT.GetNameDefCap], [FROM.GetNameDef]'in iyileştirilmesi için bazı kaynaklar tahsis edecek."
 bftb_greece.190.b:0 "Nyet, şu anda yatırım olmayacak."
 bftb_greece.190.c:0 "[ROOT.GetAdjective] halkı, birkaç [FROM.GetAdjective] çiftçisi bir fabrikada çalışabilsin diye acı çekmeyecek."
 bftb_greece.190.desc:0 "[FROM.GetNameDef]'den gelen yetkilileri ağırlama zevkini yeni yaşadık, onlardan biri Prezidyum önünde misafir olarak uluslarımız arasındaki güçlü ilişkilere vurgu yaptığı bir konuşma yaptı. Hoş bir andı, ancak [FROM.GetAdjective] ziyaretinin asıl amacı zor durumdaki uluslarına yatırım konusunu tartışmaktı. Marksist teoremler devrimin ancak sanayileşmiş toplumlarda gerçekleşebileceğini dikte ediyordu, ancak kendi tarihimiz ve [FROM.GetAdjective]lerin deneyimi bize aksini söylüyor. \n\nYetkililer arasında [FROM.GetAdjective]lere yardım etmemiz gerektiğine dair güçlü bir his var, çünkü bunu yapacak kaynaklara sahibiz. Ancak, kendi kaynaklarımıza da ihtiyacımız var - bu hiçbir yetkili tarafından tartışılmıyor. Ne yapmalıyız?"
 bftb_greece.190.t:0 "[FROM.GetAdjective] Yetkililer Prezidyum Ziyaretini Tamamladı"
 bftb_greece.191.a:0 "Gerilcilerle savaşmak adına silahlanmalarının genişletilmesine izin verilebilir."
 bftb_greece.191.b:0 "Nyet, şu anda yatırım olmayacak."
 bftb_greece.191.c:0 "[ROOT.GetAdjective] halkı, birkaç [FROM.GetAdjective] çiftçisi bir fabrikada çalışabilsin diye acı çekmeyecek."
 bftb_greece.191.desc:0 "[FROM.GetAdjective]ler ekonomik bağlarımızı derinleştirmeyi görüşmek üzere bizi davet etmeye karar verdiğinde, reddedemedik. [FROM.GetAdjective]leri mali yardım için bize gelecek kadar çaresiz kılan ne olabilirdi ki? Söylemeye gerek yok, [FROM.GetAdjective]'in endüstriyel konumunun güçlendirilmesinin neden ideal olabileceğine dair ikna edici bir gerekçe sundular... özellikle de bu bizimkini de iyileştirebilecekken. Onların ulusuna yatırım yapıp yapmayacağımız veya endüstriyel potansiyellerini kadere bırakıp bırakmayacağımız bizim karar vereceğimiz bir mesele."
 bftb_greece.191.t:0 "[ROOT.GetAdjective] Bürokratlar [FROM.GetNameDef] Araştırmasından Dönüyor"
 bftb_greece.192.a:0 "[FROM.GetAdjective] planı Politbüro tarafından onaylandı, devam edecek."
 bftb_greece.192.b:0 "Stavka, [FROM.GetNameDef] üzerinde uygulayabileceğimiz yumuşak gücün daha faydalı olduğunu öne sürüyor."
 bftb_greece.192.c:0 "[ROOT.GetNameDefCap], [FROM.GetNameDef] ile işini bitirdi."
 bftb_greece.192.desc:0 "[FROM.GetNameDef]'den, hükümetinin ülkelerindeki artan [ROOT.GetAdjective] siyasi müdahalesinden duyduğu endişeyi ileten bir delege aldık. Onlara bir pazarlık yapma yetkisi verildi: yoksul bölgelerimize yatırım yapacaklar ve biz de devletlerinin her mekanizmasının kontrolünü ele geçirmekten vazgeçeceğiz. \n\nBiz, elbette, böyle bir müdahalenin gerçekleştiğini reddettik, hepimiz doğru olduğunu bilsek de. Teklif cömert bir teklif; şüphesiz [FROM.GetAdjective]'in egemenliğini güvende tutma arzusu samimi. Malzeme akışını kullanabiliriz, ama yine de, [FROM.GetNameDef]'i tamamen avucumuzun içinde de tutabiliriz..."
 bftb_greece.192.t:0 "[FROM.GetAdjective] Yetkililer İhmal Edilmiş Sibirya Bölgelerimize Yatırım Yapacakları Bir Geri Alım Planı Öneriyor"
 bftb_greece.193.a:0 "Bir iyilik, diğerini getirebilir."
 bftb_greece.193.desc:0 "En iyi beyinlerimiz, [FROM.GetAdjective] dostlarımıza yaptıkları son keyifli geziden sonra evlerine döndüler ve karşılıklı yarar sağlayan yatırımlar ve fırsatlar hakkında harika haberler getirdiler! Birlikte, çabalarımız hem [ROOT.GetAdjective] hem de [FROM.GetAdjective] halklarını yükseltecek ve hesaba katılması gereken bir ortaklık kuracaktır."
 bftb_greece.193.t:0 "[FROM.GetNameDef]'e Yatırımlar!"
 bftb_greece.194.a:0 "Belki de bu, gizli bir lütuftur..."
 bftb_greece.194.desc:0 "Maalesef, [FROM.GetAdjective]'in bu sefer ekonomimize yatırım yapmayacağı haberini aldık. Bu hayal kırıklığı yaratan bir gelişme olsa da, [FROM.GetAdjective] delegesi gelecekteki yatırımları dışlamadı, ki bu bizim için iyiye işaret."
 bftb_greece.194.t:0 "[FROM.GetAdjective] Bu Sefer Yatırım Yapmıyor"
 bftb_greece.195.a:0 "Şimdi ekonomik sıkıntılarımızı düzeltirken gerçekten yalnızız."
 bftb_greece.195.desc:0 "Yatırım meselesini fazla zorlamış olabiliriz: [FROM.GetAdjective]ler, ulusumuzun gelişmekte olan sanayi tabanına yatırım yapmaya ilgi duymadıklarına karar verdiler. Eğer geleceği şekillendirmemize yardım etmek istemiyorlarsa, onlarsız idare etmek zorunda kalacağız."
 bftb_greece.195.t:0 "[FROM.GetAdjective] Delegelerimizi Geri Çeviriyor ve Diplomatlarımızı Kovuyor!"
 bftb_greece.2.a:0 "Nihayet, geri döndük!"
 bftb_greece.2.desc:0 "Yunan halkı bugün Yunanistan sokaklarını doldurarak ordunun, monarşistlerin seçim sonuçlarına müdahale edememesini sağlama kararını kutladı. Venizelosçulara, yurt dışındaki sürgünden dönerek yönetmeleri için güçlü bir yetki verildi; ancak çok bölünmüş bir ülkeyi birleştirme konusunda zorlu bir mücadeleyle ve ülkenin, Venizelosçuların 1919'da tüm ülkeyi sürüklediği feci savaşı unutmadığı gerçeğiyle karşı karşıyalar. Ayrıca Venizelosçuların esir alınan Yunan monarkıyla ne yapacağı sorusu da varlığını koruyor - ne olursa olsun, Yunanistan için ileride ilginç zamanlar var..."
 bftb_greece.2.t:0 "Venizelosçular Seçimi Kazandı!"
 bftb_greece.20.a:0 "Red oyları kazandı!"
 bftb_greece.20.desc:0 "Katılan delegelerin çoğunluğu, kuzey [TUR.GetNameDef]'de herhangi bir Ermeni kukla devleti kurma hakkının [ENG.GetNameDef]'e verilmemesi yönünde oy kullandı. [ENG.GetAdjective] yetkilileri kararı kınadı ve tüm konvansiyonu karmakarışık olarak nitelendirdi, ancak kendilerine hiçbir şey garanti edilmese bile sonraki işlemleri etkileyebilmeyi tercih edeceklerine karar verdiler."
 bftb_greece.20.t:0 "Kandiye Konvansiyonu - [ENG.GetAdjective]lerin Kuklası Reddedildi!"
 bftb_greece.200.a:0 "Bunun için hepimiz sırtımızı sıvazlayabiliriz."
 bftb_greece.200.desc:0 "Kandiye Konvansiyonu resmen sona erdi ve mutlak bir başarıydı! Tüm katılımcılar toprak kazanımları garantileriyle ayrıldılar ve görünüşe göre [GRE.GetNameDef] sınırlarını kapsamlı bir şekilde genişletmeye hazırlanıyor. Birlikte, Sevr Antlaşması'nın intikamını çok daha hak eden bir [TUR.GetName] üzerinden alacağız."
 bftb_greece.200.t:0 "Kandiye Konvansiyonu Toplandı - Büyük Bir Başarı!"
 bftb_greece.201.a:0 "Yaşasın!"
 bftb_greece.201.b:0 "Ne saçmalık ama!"
 bftb_greece.201.desc:0 "Kandiye Konvansiyonu resmen sona erdi ve büyük bir başarıydı! [ENG.GetNameDef] hariç tüm katılımcılar toprak kazanımları garantileriyle ayrıldılar ve görünüşe göre [GRE.GetNameDef] sınırlarını kapsamlı bir şekilde genişletmeye hazırlanıyor. İmzacılar birlikte, Sevr Antlaşması'nın intikamını çok daha hak eden bir [TUR.GetName] üzerinden alacaklar."
 bftb_greece.201.t:0 "Kandiye Konvansiyonu Toplandı"
 bftb_greece.202.a:0 "Harika bir girişim!"
 bftb_greece.202.b:0 "Ne aptallar ama..."
 bftb_greece.202.desc:0 "Kandiye Konvansiyonu resmen sona erdi ve büyük bir başarıydı! [FRA.GetNameDef] hariç tüm katılımcılar toprak kazanımları garantileriyle ayrıldılar ve görünüşe göre [GRE.GetNameDef] sınırlarını kapsamlı bir şekilde genişletmeye hazırlanıyor. İmzacılar birlikte, Sevr Antlaşması'nın intikamını çok daha hak eden bir [TUR.GetName] üzerinden alacaklar."
 bftb_greece.202.t:0 "Kandiye Konvansiyonu Toplandı"
 bftb_greece.203.a:0 "Olağanüstü bir sonuç!"
 bftb_greece.203.b:0 "'Sakat Zafer'i hatırlıyoruz..."
 bftb_greece.203.desc:0 "Kandiye Konvansiyonu resmen sona erdi ve muazzam bir başarıydı! [ITA.GetNameDef] hariç tüm katılımcılar toprak kazanımları garantileriyle ayrıldılar ve görünüşe göre [GRE.GetNameDef] sınırlarını kapsamlı bir şekilde genişletmeye hazırlanıyor. İmzacılar birlikte, Sevr Antlaşması'nın intikamını çok daha hak eden bir [TUR.GetName] üzerinden alacaklar."
 bftb_greece.203.t:0 "Kandiye Konvansiyonu Toplandı"
 bftb_greece.204.a:0 "Yine de bir zafer."
 bftb_greece.204.b:0 "Ne büyük bir zaman kaybı..."
 bftb_greece.204.desc:0 "Kandiye Konvansiyonu resmen sona erdi ve... kabul edilebilir bir başarıydı. Ne [ENG.GetNameDef] ne de [FRA.GetNameDef], parçalanmış bir [TUR.GetNameDef]'den herhangi bir toprak vaat edilmediği için yaklaşan savaşa katılmayacak. Görünüşe göre [GRE.GetNameDef], tek başına [TUR.GetNameDef]'i devirecek güce sahip olması koşuluyla, sınırlarını kapsamlı bir şekilde genişletmeye hazırlanıyor..."
 bftb_greece.204.t:0 "Kandiye Konvansiyonu Toplandı"
 bftb_greece.205.a:0 "Bazılarını kazanırsın, bazılarını kaybedersin!"
 bftb_greece.205.b:0 "Ne büyük bir zaman kaybı..."
 bftb_greece.205.c:0 "Bu ikinci ihanete müsamaha göstermeyeceğiz!"
 bftb_greece.205.desc:0 "Kandiye Konvansiyonu resmen sona erdi ve gayet makul bir başarıydı! [ENG.GetNameDef] ve [ITA.GetNameDef] hariç tüm katılımcılar toprak kazanımları garantileriyle ayrıldılar ve görünüşe göre [GRE.GetNameDef] sınırlarını kapsamlı bir şekilde genişletmeye hazırlanıyor. İmzacılar birlikte, Sevr Antlaşması'nın intikamını çok daha hak eden bir [TUR.GetName] üzerinden alacaklar."
 bftb_greece.205.t:0 "Kandiye Konvansiyonu Toplandı"
 bftb_greece.206.a:0 "Yine de bir zafer."
 bftb_greece.206.b:0 "Ne büyük bir zaman kaybı..."
 bftb_greece.206.c:0 "Bu ikinci ihanete müsamaha göstermeyeceğiz!"
 bftb_greece.206.desc:0 "Kandiye Konvansiyonu resmen sona erdi ve gayet makul bir başarıydı! [FRA.GetNameDef] ve [ITA.GetNameDef] hariç tüm katılımcılar toprak kazanımları garantileriyle ayrıldılar ve görünüşe göre [GRE.GetNameDef] sınırlarını kapsamlı bir şekilde genişletmeye hazırlanıyor. İmzacılar birlikte, Sevr Antlaşması'nın intikamını çok daha hak eden bir [TUR.GetName] üzerinden alacaklar."
 bftb_greece.206.t:0 "Kandiye Konvansiyonu Toplandı"
 bftb_greece.207.a:0 "Başarısızlıklarımızın hesabını vermeliyiz."
 bftb_greece.207.b:0 "Atina asla faşist köpekler tarafından yönetilmeyecek!"
 bftb_greece.207.desc:0 "Böyle biteceğini bilmeliydik: EEE liderliği bizi zayıf ve etkisiz olarak kınadı ve [ROOT.GetAdjective] büyüklüğünün önündeki en acil engel olarak bizi ilan etti. Kabadayılar, Helen Parlamentosu'nda hepimizi hain olarak suçladıkları ve bizi yerimizden etmek için ellerinden geleni yapacaklarını ilan ettikleri büyük bir gösteri yaptılar. Gerçekten de, hepsi birden dramatik bir şekilde salondan ayrıldıktan saatler sonra peşlerinde bir kalabalıkla geri döndüler ve derhal toplu istifamızı talep ettiler. \n\nHalkın desteği artık bizden yana değil ve açıkçası, birçok hükümet bakanı bu yönetimin ulusa söz verdiğimiz gibi işleri sonuna kadar götürecek güce sahip olduğuna olan inancını kaybetti. Yabancı veya halk desteği olmadan Konstantinopolis'e yürüyerek tüm ülkeyi asla kurtulamayacağımız bir ölüm yürüyüşüne gönderdiğimize dair genel bir his var."
 bftb_greece.207.t:0 "EEE Darbe Başlattı!"
 bftb_greece.209.a:0 "Bu gerçekten de en şanlı anımız."
 bftb_greece.209.desc:0 "Eski Türk devletini parçaladık ve ganimetleri galipler arasında paylaştırdık. Müttefiklerimize ve halkımıza olan yükümlülüklerimiz yerine getirildi ve [ROOT.GetNameDef] yüzyıllardır olmadığı kadar gerçek büyüklüğe ulaşmaya yakın."
 bftb_greece.209.t:0 "Kandiye Konvansiyonu Sırasında Belirlenen Taahhütlerimizi Yerine Getirdik!"
 bftb_greece.21.a:0 "Kabul oyu veriyoruz!"
 bftb_greece.21.b:0 "Red oyu veriyoruz!"
 bftb_greece.21.desc:0 "Bu oylama turunun konusu, [TUR.GetNameDef] fethedildikten sonra [TUR.GetNameDef]'in güneyinde [ITA.GetNameDef]'e sömürge toprakları verilip verilmeyeceğidir. Her katılımcının Akdeniz'deki toprakları [ITA.GetAdjective]lara serbestçe devretme konusunda bazı çekinceleri var, ancak [ITA.GetAdjective] delegeleri, [ITA.GetLeader]'in sözlerini tekrarlayarak bu toprağın verilmesinin 'vittoria mutilata'nın (sakat zafer) bazı yanlışlarını düzeltmekten başka bir şey olmayacağını hararetle ifade ediyorlar. \n\nDiğer katılan güçler tarafından Kandiye Konvansiyonu'nun resmi başlangıcından önce, [TUR.GetNameDef]'in işgaline [ITA.GetAdjective] katılımının istenmeyen bir durum olduğuna karar verildi. Savaşa doğrudan katılmak yerine, eğer [ITA.GetNameDef]'e tavizi verilirse, [GRE.GetNameDef] ile bir saldırmazlık paktına ve varsayımsal [TUR.GetNameDef] savaşına müdahale etmeme paktına bağlanacaklar. Eğer önerge geçmezse, Kandiye Konvansiyonu'nun sonucundan bağımsız olarak, [ITA.GetNameDef]'in savaşları başladığında [GRE.GetNameDef]'e karşı hiçbir yükümlülüğü olmayacak ve hatta müdahale etmeye çalışabilir."
 bftb_greece.21.t:0 "Kandiye Konvansiyonu - [342.GetName] ve [345.GetName]'da [ITA.GetAdjective] Kolonileri"
 bftb_greece.210.a:0 "Saat gibi işledi."
 bftb_greece.210.desc:0 "Söz verildiği gibi, bize garanti edilen iller mağlup Türk ulusunun enkazından oyularak kontrolümüze devredildi. Emperyalizm pis bir iştir, ama kimse bunu bizden daha iyi yapamaz."
 bftb_greece.210.t:0 "Yunanlar Kandiye Konvansiyonu Garantilerini Yerine Getiriyor!"
 bftb_greece.213.a:0 "Zimmetçi parazitler!"
 bftb_greece.213.b:0 "Çok fazla zorlandılar ve sonuç bu oldu."
 bftb_greece.213.desc:0 "O şehvet düşkünü [FROM.GetAdjective] hırsızlar, bize borçlu oldukları parayla kaçmaya karar verdiler! O borcu on yıllardır dikkatle besledik ve büyüttük, ve onlar bunu gayrimeşru olarak adlandırma cüretini mi gösteriyorlar? Eğer bizi cezasız bir şekilde dolandırabileceklerine inanıyorlarsa, tamamen yanılıyorlar - bunun sonuçları olmalı! Gerçi, [FROM.GetNameDef]'in biriken borcu için onları teşvik etme ve ardından cezalandırma konusunda biraz aşırı hevesli olduğumuz inkâr edilemez."
 bftb_greece.213.t:0 "[FROM.GetAdjective]ler Borçlarını Bize Geri Ödemeyi Reddediyor!"
 bftb_greece.217.a:0 "Metaxas, faşist krallığımıza liderlik etmeli!"
 bftb_greece.217.b:0 "Mercouris bize bir imparatorluk getirecek!"
 bftb_greece.217.desc:0 "Faşizm [ROOT.GetNameDef]'de her zaman oldukça ılımlı bir olguydu, ancak [ROOT.GetLeader]'in liderliği altında, ülkenin tüm büyük faşist beyinlerinin ülkenin geleceğini tartışmak için bir araya gelebileceği noktaya kadar gelişti. [ROOT.GetLeader], istikrarsızlığı en aza indirmek için kesinlikle otoriter yönetim tarzını alıp doğrudan faşist bir kalıba sokmayı öneriyor. Ülkenin yetkin nasyonal sosyalisti George Mercouris, [ROOT.GetNameDef] için en iyi yolun, ulusu gerçekten radikal bir siyaset alanına sokmak için sevilmeyen kraldan kurtulmak olduğuna inanıyor. \n\n[ROOT.GetLeader], Arnavutluk'tan Kıbrıs'a uzanan bir Büyük Yunanistan vizyonlarından uzun uzadıya bahsetti, ancak geri kalmamak için Mercouris, [ROOT.GetAdjective] halkının büyüklüklerinin anahtarı için daha da geriye bakmasının gerekli olduğuna inanıyordu. Metaxas, Üçüncü Helen Medeniyeti'nin yakın gelecekte yeni bir daha büyük Helen ulusu olarak ileride olduğuna inanıyor, ancak Mercouris, Üçüncü Helen Medeniyeti'nin ilhamının Birinci Helen Medeniyeti'nden geleceğine inanıyor. İki güçlü figür, iki çok farklı görüş ifade ediyor: [ROOT.GetNameDef]'in faşistleştirilmiş geleceği burada, Samos'ta."
 bftb_greece.217.t:0 "Halikarnas Faşist Büyük Meclisi (Bule)"
 bftb_greece.218.a:0 "Faşistler [ROOT.GetNameDef]'in kaderini belirlememeli!"
 bftb_greece.218.b:0 "Belki de yanıldık; belki de EEE, sonuçta [ROOT.GetNameDef]'i kurtarabilir."
 bftb_greece.218.desc:0 "Zamanı geldi; en karanlık saatimizde aşağılık Georgios Kosmidis silahlanma çağrısı yaptı ve EEE'ye ve [ROOT.GetNameDef]'e sadık olanların bizi ve Ege'nin diğer yakasındaki işgalcileri yok etmesini talep etti. Kesin olan tek şey, [ROOT.GetNameDef]'in geleceğinin çok belirsiz olduğudur."
 bftb_greece.218.t:0 "Anadolu Faşistleri İsyan Ediyor!"
 bftb_greece.22.a:0 "Kabul oyları kazandı!"
 bftb_greece.22.desc:0 "Katılan delegelerin çoğunluğu, mağlup bir [TUR.GetName]'nın leşinden pay biçilerek [ITA.GetNameDef]'e koloniler verilmesi yönünde oy kullandı. [ITA.GetAdjective] yetkilileri, konuyla ilgili basiretli kararlarından dolayı katılan delegeleri alkışladı ve [ITA.GetAdjective] delegasyonunun birçok üyesi, haberi [ITA.GetLeader]'e anlatmak için şimdiden memleketlerine akın etti."
 bftb_greece.22.t:0 "Kandiye Konvansiyonu - [ITA.GetAdjective]lar Topraklarını Aldı!"
 bftb_greece.220.a:0 "Nihayet birlikteyiz!"
 bftb_greece.220.desc:0 "[ROOT.GetLeader]'in, bunca yıldan sonra [ROOT.GetAdjective]'in Kıbrıs ile Enosis hayallerinin nihayet gerçeğe dönüşeceğini ve bunun tamamen [FROM.GetAdjective] dostlarımız sayesinde olduğunu ulusa duyurmasından sonra başkentteki ruh hali en iyi 'sevinçli' olarak tanımlanabilir. Yöneticilerimiz, iktidar geçişinin mümkün olduğunca sorunsuz gitmesini sağlamak için Kıbrıs'a gitmekte hiç vakit kaybetmedi. \n\nBu, [ROOT.GetNameDef] için gerçekten büyük ve tarihi bir gün. Kıbrıs uzun zamandır [ROOT.GetAdjective] kolektif bilincinin bir parçası olmuştur ve şimdi nihayet fışkırdıkları medeniyetin bağrında, evlerindeler."
 bftb_greece.220.t:0 "[FROM.GetNameDefCap] Enosis'i Kolaylaştırmayı Kabul Ediyor!"
 bftb_greece.221.a:0 "Kabul oyları kazandı!"
 bftb_greece.221.desc:0 "Katılan delegelerin çoğunluğu, [TUR.GetAdjective] devletinin başarılı bir şekilde devrilmesi üzerine K*rdistan'da [FRA.GetNameDef]'ya bir manda verilmesi yönünde oy kullandı. [FRA.GetAdjective] yetkilileri, bilge devlet adamlıkları için katılan delegeleri övdü ve bölgede bir yönetim kurulması için planlamaya başlamak üzere merkezi [FRA.GetAdjective] hükümetine talimatları çoktan iletti."
 bftb_greece.221.t:0 "Kandiye Konvansiyonu - [FRA.GetAdjective]ler Mandalarını Aldı!"
 bftb_greece.222.a:0 "Red oyları kazandı!"
 bftb_greece.222.desc:0 "Katılan delegelerin çoğunluğu, [TUR.GetAdjective] devletinin başarılı bir şekilde mağlup edilmesi üzerine K*rdistan'da [FRA.GetNameDef]'ya herhangi bir toprak verilmemesi yönünde oy kullandı. [FRA.GetAdjective] yetkilileri, olayı gülünç olarak nitelendirerek neredeyse konvansiyondan tamamen ayrılmaya karar verdiler, ancak kendilerine hiçbir şey vaat edilmese bile sonraki işlemleri etkileyebilmeyi tercih edecekleri konusunda bir fikir birliğine vardılar."
 bftb_greece.222.t:0 "Kandiye Konvansiyonu - [FRA.GetAdjective]lerin Mandası Reddedildi!"
 bftb_greece.223.a:0 "Kabul oyları kazandı!"
 bftb_greece.223.desc:0 "Katılan delegelerin çoğunluğu, mağlup bir [TUR.GetName]'nın enkazından oyulmuş bir Ermeni himayesinin [ENG.GetNameDef]'e verilmesi yönünde oy kullandı. [ENG.GetAdjective] yetkilileri, bilge devlet adamlıkları için katılan delegeleri övdü ve bölgede bir yönetim kurulması için planlamaya başlamak üzere merkezi [ENG.GetAdjective] hükümetine talimatları çoktan iletti."
 bftb_greece.223.t:0 "Kandiye Konvansiyonu - [ENG.GetAdjective]ler Himayelerini Aldı!"
 bftb_greece.224.a:0 "Red oyları kazandı!"
 bftb_greece.224.desc:0 "Katılan delegelerin çoğunluğu, kuzey [TUR.GetNameDef]'de herhangi bir Ermeni kukla devleti kurma hakkının [ENG.GetNameDef]'e verilmemesi yönünde oy kullandı. [ENG.GetAdjective] yetkilileri kararı kınadı ve tüm konvansiyonu karmakarışık olarak nitelendirdi, ancak kendilerine hiçbir şey garanti edilmese bile sonraki işlemleri etkileyebilmeyi tercih edeceklerine karar verdiler."
 bftb_greece.224.t:0 "Kandiye Konvansiyonu - [ENG.GetAdjective]lerin Kuklası Reddedildi!"
 bftb_greece.225.a:0 "Kabul oyları kazandı!"
 bftb_greece.225.desc:0 "Katılan delegelerin çoğunluğu, mağlup bir [TUR.GetName]'nın leşinden pay biçilerek [ITA.GetNameDef]'e koloniler verilmesi yönünde oy kullandı. [ITA.GetAdjective] yetkilileri, konuyla ilgili basiretli kararlarından dolayı katılan delegeleri alkışladı ve [ITA.GetAdjective] delegasyonunun birçok üyesi, haberi [ITA.GetLeader]'e anlatmak için şimdiden memleketlerine akın etti."
 bftb_greece.225.t:0 "Kandiye Konvansiyonu - [ITA.GetAdjective]lar Topraklarını Aldı!"
 bftb_greece.226.a:0 "Red oyları kazandı!"
 bftb_greece.226.desc:0 "Katılan delegelerin çoğunluğu, güney [TUR.GetNameDef]'de herhangi bir koloni kurma hakkının [ITA.GetNameDef]'e verilmemesi yönünde oy kullandı ve önergenin kendisini daha anlamsız [ITA.GetAdjective] savaş çığırtkanlığı olarak kınadı. [ITA.GetAdjective] yetkilileri karara saldırdı ve tüm durumu, [ITA.GetAdjective] halkının 'vittoria mutilata'ya (sakat zafer) inanmakta ne kadar haklı olduğunun bir başka kanıtı olarak göstermek için kullandı. Konuyla ilgili kişisel görüşlerinden bağımsız olarak, [ITA.GetAdjective] delegelerine konvansiyonun işlemlerinin bir parçası olarak kalmaları emredildi - şüphesiz gündemdeki son ve en önemli madde üzerindeki kararı hala etkileyebilecekleri umuduyla."
 bftb_greece.226.t:0 "Kandiye Konvansiyonu - [ITA.GetAdjective]ların Toprakları Reddedildi!"
 bftb_greece.227.a:0 "Hazır olacağız."
 bftb_greece.227.desc:0 "[GRE.GetAdjective]'in [341.GetName]'a saldırısı beklendiği gibi başarısız oldu ve Ege'deki çatışma tırmanırken, [GRE.GetNameDef] adına müdahale etmek için mükemmel bir fırsat yakaladık. Kuvvetlerimizi Kafkasya'ya, [TUR.GetAdjective] sınırına oturacak şekilde manevra yapmalıyız. [GRE.GetAdjective]ler sinyali verdiğinde, [TUR.GetAdjective] kuvvetlerini kıskaca alıp meşrulaştırılmış bir savaş başlatacağız."
 bftb_greece.227.t:0 "[GRE.GetAdjective]'in [TUR.GetNameDef] ile Sınır Çatışmaları Tırmanıyor"
 bftb_greece.228.a:0 "Bu iyiye işaret değil..."
 bftb_greece.228.desc:0 "Başkentimize şaşırtıcı bir haber ulaştı: [SOV.GetNameDef]'in yenilmez orduları [TUR.GetAdjective] hatlarını yaramadı. İşgalde bize yardım etmeyecekler ve tüm planlarını ve saldırılarını iptal edip [TUR.GetAdjective]'e bizi istedikleri gibi yargılama dokunulmazlığı verdiler."
 bftb_greece.228.t:0 "[SOV.GetAdjective]ler Yenildi"
 bftb_greece.229.a:0 "Savaşa!"
 bftb_greece.229.b:0 "Durum değişti."
 bftb_greece.229.desc:0 "[GRE.GetNameDefCap], [TUR.GetNameDef] ile savaşına başladı ve söz verdiğimiz gibi savaşta yardım etmemiz için bizi çağırdı. Vaat edilen kazançlar önemli ve her zaman daha fazlasını isteme fırsatı var, ancak belki de artık yükümlülüklerimizi yerine getirebilecek bir konumda değiliz - bu, iddialarımızdan vazgeçmek anlamına gelse bile."
 bftb_greece.229.t:0 "[GRE.GetNameDefCap] Bizi Taahhüdümüzü Yerine Getirmeye Çağırıyor"
 bftb_greece.23.a:0 "Red oyları kazandı!"
 bftb_greece.23.desc:0 "Katılan delegelerin çoğunluğu, [ITA.GetNameDef] ülkesinin güney [TUR.GetNameDef] topraklarında herhangi bir koloni kurma hakkının reddedilmesi yönünde oy kullandı ve önergenin kendisini daha aptalca [ITA.GetAdjective] savaş çığırtkanlığı olarak kınadı. [ITA.GetAdjective] yetkililer karara saldırdı ve tüm durumu, [ITA.GetAdjective] halkının 'vittoria mutilata'ya inanmakta ne kadar haklı olduğunun bir başka kanıtı olarak kullanmak için kullandı. Konu hakkındaki kişisel görüşleri ne olursa olsun, [ITA.GetAdjective] delegelerine kongre işlemlerinin bir parçası olarak kalmaları emredildi - şüphesiz gündemdeki son ve en önemli maddedeki kararı hala etkileyebilecekleri umuduyla."
 bftb_greece.23.t:0 "Kandiye Konvansiyonu - [ITA.GetAdjective]ların Toprakları Reddedildi!"
 bftb_greece.230.a:0 "Kaybedemeyiz!"
 bftb_greece.230.desc:0 "[FROM.GetNameDefCap], taahhüt ettikleri gibi [TUR.GetNameDef]'e karşı savaşımızda bize katıldı. Birlikte, [TUR.GetAdjective] devletini dize getireceğiz."
 bftb_greece.230.t:0 "[FROM.GetNameDefCap] Taahhütlerini Yerine Getiriyor"
 bftb_greece.231.a:0 "Korkaklar!"
 bftb_greece.231.desc:0 "[FROM.GetNameDefCap], bize yardım etme taahhüdünü terk etti ve [TUR.GetNameDef]'deki iddialarından vazgeçti! Bize ihanet ettiler ve bunu yaparak tüm mücadelemizi değersizleştirdiler. [FROM.GetAdjective] yardımı olmadan galip gelmek için gücümüzün olmasını ummalıyız."
 bftb_greece.231.t:0 "[FROM.GetNameDefCap] Taahhütlerini Terk Ediyor!"
 bftb_greece.232.a:0 "Çok yaşa Basileus Adolfos I!"
 bftb_greece.232.b:0 "Uh, bekle, ya o sadece bir deliyse?"
 bftb_greece.232.desc:0 "Morali bozuk ulusumuza bir mucize bahşedildi: Aziz Justinianus tarafından Cennet'in kendisinden bize gönderilen ilahi bir müdahale. Aynoroz Dağı kıyısında bilinçsizce serilmiş paçavralar içinde bir adam bulundu ve kutsal yerin sadık bakıcıları tarafından kesin bir ölümden kurtarıldı. İlk başta onu tutuklayan yetkililer tarafından Almanya'dan [ROOT.GetNameDef]'e yürüyerek gelen çılgın bir deli olarak reddedilen bu kişi, aslında kendi EEE akademisyenlerimizden biri tarafından Komnenos Hanedanı'nın uzun zamandır kayıp olan bir torunu olarak teşhis edildi. \n\nUzun zamandır Bizans devletimizin başına kimin geçmesi gerektiği sorusuyla boğuşuyorduk ve görünüşe göre Tanrı'nın kendisi bize çözümünü verdi. Bizans varisi tek kelime Yunanca konuşmuyor, ama kesinlikle öğretilebilir! Gerçekten de, [ROOT.GetNameDef] Tanrı'nın ilahi takdiri tarafından kayırılmıştır."
 bftb_greece.232.t:0 "Bir Basileus Ortaya Çıkıyor..."
 bftb_greece.233.a:0 "Savaş devam ediyor."
 bftb_greece.233.desc:0 "[ROOT.GetNameDef]'in Başbakanı ve diktatörü, bir hastalık döneminin ardından vefat etti. Fethedilmiş ulusunun bir sürgünü olarak yurt dışında öldü. [ROOT.GetAdjective] halkı tarafından pek sevilmese de, bir kriz zamanında ulusal birliğin ve direnişin sembolü haline geldi. Birleştirici bir figür ve bir Venizelosçu olan Emmanouil Tsouderos, Metaxas'ın yerine [ROOT.GetNameDef]'in Başbakanı olarak geçti."
 bftb_greece.233.t:0 "Ioannis Metaxas Vefat Etti"
 bftb_greece.234.a:0 "Türkler kendi başlarının çaresine bakmak zorunda kalacak."
 bftb_greece.234.b:0 "Maliyet ne olursa olsun garantilerimizin arkasındayız!"
 bftb_greece.234.desc:0 "Kandiye Konvansiyonu'ndan, katılan büyük güçlerin [GRE.GetAdjective] \"Megali İdea\" önerisini onayladıklarına dair haber bize ulaştı. Bu sadece bölgenin istikrarını tehdit etmekle kalmıyor, aynı zamanda çok da uzak olmayan bir gelecekte [GRE.GetNameDef] ve [TUR.GetNameDef] arasında patlak veren açık bir savaş durumu riskini de temsil ediyor.\n\n[GRE.GetNameDef]'nin askeri desteğini alabilmesi ihtimali göz ardı edilemez. [FRA.GetNameDef] veya [ENG.GetNameDef] ve [TUR.GetNameDef]'ye karşı mevcut askeri yükümlülüklerimiz göz önüne alındığında, kendimizi bu büyük güçlerin her ikisiyle de olmasa da herhangi biriyle yapılacak bir savaşın yanlış tarafında bulabiliriz. Askeri liderlerimiz bizi bunu aklımızda tutmaya ve [TUR.GetNameDef]'nin savunmasına olan bağlılığımızı yeniden değerlendirmeye çağırıyor."
 bftb_greece.234.t:0 "Megali İdea Onaylandı"
 bftb_greece.235.a:0 "Korkaklar!"
 bftb_greece.235.desc:0 "Kandiye Konvansiyonu, [ROM.GetAdjective] garantörlerimizi derinden sarstı. Büyük Avrupa güçleriyle bir savaş riskine girmek yerine, askeri yardımlarını savunmamıza sunma sözlerini iptal etmeyi seçtiler."
 bftb_greece.235.t:0 "[ROM.GetName] Garantiyi İptal Etti"
 bftb_greece.236.a:0 "Yine de devam edeceğiz"
 bftb_greece.236.b:0 "Belki de biraz fazla hevesliydik"
 bftb_greece.236.desc:0 "Şüphesiz nüfuzunu genişletmekle ilgilense de, [SOV.GetNameDef], [TUR.GetNonIdeologyName] üzerinde nüfuz kurma planlarımıza yardım etmemeye karar verdi. Bunun yerine başka konulara odaklanmak istiyor."
 bftb_greece.236.t:0 "[SOV.GetNameDefCap], [TUR.GetNameDef] Ülkesine Karşı Yardım Etmeyi Reddediyor"
 bftb_greece.237.a:0 "Harika haber!"
 bftb_greece.237.desc:0 "[FROM.GetNameDef] diplomatları, [TUR.GetNameDef] karşısındaki planlarımızda [FROM.GetLeader] desteğine sahip olduğumuzu bildirdiler. Askeri istihbaratımızdan gelen raporlar da birliklerini [TUR.GetAdjective] sınırına doğru kaydırmaya başladıklarını gösteriyor."
 bftb_greece.237.t:0 "[FROM.GetName], [TUR.GetNonIdeologyName] Ülkesine Karşı Hırsları Destekliyor"
 bftb_greece.24.a:0 "Kabul oyu veriyoruz!"
 bftb_greece.24.b:0 "Red oyu veriyoruz!"
 bftb_greece.24.desc:0 "Bu oylama turunun konusu, uzun süredir devam eden rövanşist Büyük Yunanistan ideali olan Megali İdea'ya mevcut büyük güçler tarafından izin verilip verilmeyeceğidir. [GRE.GetAdjective] ulusal lideri [GRE.GetLeader], Kandiye Konvansiyonu'nun yapıldığı salonlara sürpriz bir ziyaret gerçekleştirdi ve Megali İdea'nın alaycı bir toprak gasbından daha fazlasını temsil ettiğine ve bunun dünya çapındaki [GRE.GetAdjective]ler tarafından yüzyıllardır sürdürülen ortak kutsal bir rüyanın gerçekleşmesi olacağına dair tutkulu bir konuşma yaptı. \n\nSoru şu değil: Megali İdea burada ve şimdi reddedilirse, Kandiye Konvansiyonu'nda verilen tüm tavizler ve sözler geçersiz olacaktır. [GRE.GetNameDef]'in demokrasisinin ve bütünlüğünün geleceği, bugün burada bulunan katılımcıların kararına bağlı olabilir."
 bftb_greece.24.t:0 "Kandiye Konvansiyonu - Megali İdea"
 bftb_greece.25.a:0 "Kutsanmış olsun savaş çığırtkanları!"
 bftb_greece.25.desc:0 "Katılan delegelerin çoğunluğu, [TUR.GetNameDef] ile bir savaşta başarılı olması durumunda [GRE.GetNameDef]'in Megali İdea'yı gerçekleştirmesine izin verilmesi yönünde oy kullandı. Yetkililerimiz coşku içinde ve [ROOT.GetLeader] Kandiye Konvansiyonu'nun bir başarı olduğunu iletmek için ulusa seslendi bile. Elbette, kapalı katılımcı çemberimizin dışında kimse Kandiye Konvansiyonu'nun gerçekte ne hakkında olduğunu bilmiyor, ancak halkımızın çoğu konuşma konusunun temel olarak Megali İdea'nın gerçekleştirilmesi üzerine olduğunu anladı. \n\nKandiye Konvansiyonu'ndan isteyebileceğimiz her şeyle çıktık, ama şimdi zor kısım geliyor..."
 bftb_greece.25.t:0 "Kandiye Konvansiyonu - Megali İdea Yeniden Doğuyor!"
 bftb_greece.26.a:0 "Ne büyük bir zaman kaybı..."
 bftb_greece.26.desc:0 "Katılan delegelerin çoğunluğu, Megali İdea özlemlerinin bir parçası olarak Büyük Yunanistan'ı kurma hakkının [GRE.GetNameDef]'e verilmemesi yönünde oy kullandı. Yetkililerimiz, şok ve dehşet karışımı bir ifadeyle katılan delegelerle kararı teyit etti ve herkese Kandiye Konvansiyonu'nun başarısız olduğu mesajıyla evlerine gönderdi. [ROOT.GetLeader] sinirli bir şekilde başkentteki kalabalıklara seslenmek ve tüm konvansiyonun bir fiyasko olduğunu söylemek zorunda kaldı ve söylemeye gerek yok, kalabalığın tepkisi nazik değildi. Ülke genelinde protestoların patlak verdiğini şimdiden görüyoruz ve durum kontrolümüzden çıkma tehlikesiyle karşı karşıya."
 bftb_greece.26.t:0 "Kandiye Konvansiyonu - Megali İdea Reddedildi!"
 bftb_greece.29.a:0 "Kesinlikle bir çatışma yaklaşıyor..."
 bftb_greece.29.desc:0 "Son istihbarat raporları en kötüsünü doğruluyor gibi görünüyor: komünistler Atina'da kontrolü ele geçirdi ve kendilerini [FROM.GetAdjective] halkına dayattı. Olası bir çatışmaya hazırlanmalıyız, eğer [SOV.GetNameDef] kendi entrikalarına yeterince yatkın olduğumuza inanmazsa, şüphesiz bizi zayıflatmak veya hatta yok etmek için [FROM.GetNameDef]'i bir komploya dahil etmeye çalışacaklardır. Kabine kararlı: Savunmasız ulusumuza yönelik bir kıskaç saldırısından kaçınmak için Boğazları [FROM.GetNameDef]'e ve [SOV.GetNameDef]'e kapatmalıyız. Bu bize biraz zaman kazandıracak, ancak olası bir çatışmaya hazırlanmalıyız."
 bftb_greece.29.t:0 "Komünistler Yunanistan'da İktidarı Ele Geçirdi"
 bftb_greece.3.a:0 "O serseriyi asla kimse takip etmez!"
 bftb_greece.3.desc:0 "Yunanistan'ın kendi kendini faşist ilan eden hareketi, yeni siyasi gerçekliğimize göre yeniden yöneldi. Türkiye'den sürgün edilen buruk ve hoşnutsuz Yunan mülteciler, vatanından sürgün edilmiş bir başka Yunan olan Georgios Kosmidis'in yeni radikal siyasi hareketine akın etmeye başlıyor. \n\nKosmidis, Megali İdea'nın ve [TUR.GetNameDef]'e kaybedilen tarihi toprakların geri alınmasının sesli bir savunucusu olsa da, görüşleri Venizelosçu yönetimindeki herkesten çok daha radikal. Bazı raporlar, Kosmidis'in [ROOT.GetNameDef]'in sınırlarının sadece Ege'nin ötesine uzanmasını arzuladığını ve tüm Anadolu üzerinde tasarıları olabileceğini öne sürüyor. Ancak, bu tür raporlara ihtiyatla yaklaşılmalıdır - ne tür bir deli [TUR.GetNameDef]'in tamamı üzerinde tasarılar yapabilir ki?"
 bftb_greece.3.t:0 "Anadolu Faşistleri Seferber Oluyor"
 bftb_greece.30.a:0 "[TUR.GetNameDef] artık köşeye sıkıştı"
 bftb_greece.30.b:0 "Kendi başlarına kaldılar"
 bftb_greece.30.desc:0 "Atina'dan, [GRE.GetAdjective] komünistlerin hükümetin kontrolünü ele geçirdiği yönünde harika haberler bize ulaştı. Şimdi [TUR.GetNameDef] karşısında bizimle bir pakt arıyorlar, çünkü [TUR.GetNameDef] ülkesini Boğazlar ile ilgili, onları etkili bir şekilde bizim kukla devletimiz yapacak tavizler vermeye birlikte nüfuz etmek istiyorlar. Ancak buna karşılık, [TUR.GetAdjective] hükümeti paniğe kapıldı ve şimdi Karadeniz'e erişimimizi reddediyor."
 bftb_greece.31.a:0 "Talih cesurdan yanadır."
 bftb_greece.31.desc:0 "[SOV.GetNameDef]'den Politbüro yetkilileri nihayet bizi [TUR.GetNameDef]'in geleceği için gizli planlarına ortak etmeye karar verdiler ve bizim rolümüz kesinlikle çok önemli. Plan oldukça basit: [SOV.GetNameDef] ve uluslararası devrim adına hareket ederek [TUR.GetNameDef]'e kabul edilemez bir ültimatom gönderiyoruz ve kaçınılmaz [TUR.GetAdjective] reddini Ege'de bir çatışma çıkarmak için bir savaş nedeni olarak kullanıyoruz. \n\nÜst komutamız, en iyi birliklerimizi [TUR.GetNameDef] ile olan Trakya sınırına yerleştirmemizi ve Ege'deki adalarımızın kıyılarından [TUR.GetAdjective] topraklarına yapılacak saldırılar için asker hazırlamamızı tavsiye ediyor. Yönetimimiz ve silahlı kuvvetlerimiz arasında, [TUR.GetAdjective] silahlı kuvvetlerini bire bir çatışmada yenebileceğimizden şüphe duyan çok sayıda kişi var, ancak [SOV.GetNameDef], Konstantinopolis'e yapacağımız ilk saldırıda başarısız olursak kuzeyde bir istila başlatarak desteğini vereceğine söz verdi."
 bftb_greece.31.t:0 "Boğaziçi Kumarı"
 bftb_greece.32.a:0 "Boyun eğmeliyiz."
 bftb_greece.32.b:0 "[FROM.GetAdjective]ler karanlık bir yola saptı: bunu düzeltmeliyiz."
 bftb_greece.32.desc:0 "Yetkililerimiz, [FROM.GetNameDef]'in beceriksiz Marksistlerinin tamamen gerçek dışı ve mantıksız taleplerini okuyunca öfkeyle tepki gösterdi. [SOV.GetNameDef] adına hareket ettiğini iddia eden [FROM.GetNameDef], Lozan Antlaşması'nın her bir talebini yeniden yürürlüğe koymamızı ve antlaşmaya uymamızı 'güvenilir ve objektif bir üçüncü taraf' olarak garanti edebilmeleri için [SOV.GetAdjective] askerlerinin tüm ülkemizdeki varlığına izin vermemizi talep etti. \n\n[FROM.GetAdjective]ler, sınırlarımız boyunca çatışmaktan başka böyle saçma bir talepten ne kazanmayı umabilirler ki? Her fırsatta iç cephede barışı korumaya çalıştık, ancak barışın hiçbir zaman bir seçenek olmadığı açık. Eğer [FROM.GetAdjective]ler gerçekten [SOV.GetNameDef] adına hareket ediyorsa, belki de tek kurtuluş umudumuz, [SOV.GetAdjective] askerlerinin ulusumuzu zorla ele geçirmesini durdurma umuduyla teslim olmaktır. Gerçi, daha önce hiçbir zaman haklı bir kavgadan çekinmedik - değerlerimiz için savaşmaya istekli değilsek yönetmeyi gerçekten hak ediyor muyuz?"
 bftb_greece.32.t:0 "Yunanlar Ültimatomlarını Gönderdi"
 bftb_greece.33.a:0 "Beklenmedik ama hoş bir sürpriz!"
 bftb_greece.33.desc:0 "[GRE.GetAdjective] ve [SOV.GetAdjective] gözlemcileri için şok edici bir gelişmeyle, [FROM.GetNameDef] kendilerine sunulan her bir talebi kabul etti. Türk Boğazlarına erişimle ilgili izinler 1936 öncesi durumuna geri döndü ve [FROM.GetNameDef]'in daha önce kendilerine sunulan taleplerin şartlarına saygı duyduğundan emin olmak için [SOV.GetAdjective] birlikleri [FROM.GetAdjective] topraklarına davet edildi. \n\n[SOV.GetLeader], ulusunun bu işin üstesinden gelmede gösterdiği cesaretten dolayı [GRE.GetLeader]'i kişisel olarak tebrik etti ve [TUR.GetNameDef] genelinde konuşlanmaya hazırlanmak için şimdiden asker toplamaya başladı. [TUR.GetNameDef]'in bir tehdit olarak etkisiz hale getirilmesiyle, [GRE.GetNameDef] bölgedeki diğer olası savaş harekât alanlarına daha yakından dikkat etmesi konusunda uyarıldı."
 bftb_greece.33.t:0 "[FROM.GetNameDef] Boyun Eğiyor!"
 bftb_greece.34.a:0 "Hizmet etmek ve yaşamak daha akıllıcadır."
 bftb_greece.34.b:0 "1919'da teslim olmadık ve şimdi de teslim olmayacağız!"
 bftb_greece.34.desc:0 "Kahrolası aptallar! [SOV.GetNameDef], sınırlarımızdaki hareket özgürlüğünü kötüye kullanarak kendi ülkelerine yakın rakip bir komünist hükümet kurdu ve açıkça tüm ulusumuzu onun adına fethetmeyi planlıyor! Bunun böyle olacağını en başından bilmeliydik; kendi hükümetimizin bazı üyeleri bile durumumuzun umutsuz olduğunu iddia ederek kuzeydeki rakip hükümete katılmak için kaçtı. Belki de sadece teslim olmak, önümüzdeki günlerde ulusumuzu daha az ölümden kurtarır..."
 bftb_greece.34.t:0 "[SOV.GetNameDefCap] Kuzeyde Yeni Kukla Hükümet Kuruyor!"
 bftb_greece.35.a:0 "Şimdi işler ilginçleşiyor!"
 bftb_greece.35.desc:0 "Beklendiği gibi, [FROM.GetNameDef] kendilerine sunulan ültimatomu reddetti. Askerlerimiz yerleştirilmişken, şimdi uluslarımız arasında topyekûn bir savaş başlatmak amacıyla kademeli olarak tırmanan bir çatışmayı kışkırtacağız. Kazansak da kaybetsek de, [SOV.GetNameDef] yanımızda durduğu sürece başarısız olamayız."
 bftb_greece.35.t:0 "Türkler Ültimatomumuzu Reddetti!"
 bftb_greece.36.a:0 "Çürümeyi görmek için sadece kapıyı tekmelememiz yetti!"
 bftb_greece.36.desc:0 "Üst komutamızın beklentilerinin aksine, sınırlarımızdaki [FROM.GetAdjective] güçlerine karşı zafer kazandık. Muazzam başarımızla hareketlenen silahlı kuvvetlerimiz, [FROM.GetAdjective] topraklarının daha derinlerine saldırılarına çoktan başladı. Üst komutamız, en son bilgilerle donanmış olarak, [FROM.GetNameDef]'in birkaç gün içinde düşeceğine inanıyor."
 bftb_greece.36.t:0 "Boğaziçi Muharebesi Başlıyor!"
 bftb_greece.37.a:0 "Komünistleri sıraya dizin, biz de onları biçelim."
 bftb_greece.37.desc:0 "[FROM.GetAdjective] kışkırtıcıları, sınırlarımıza yönelik anlamsız saldırılarının ardından püskürtüldü, ancak gözlemcilerimizin raporlarına göre bu tüm çile henüz bitmedi. [FROM.GetAdjective] kuvvetleri Ege Adaları boyunca toplanıyor ve silahları şaşırtıcı bir şekilde [339.GetName]'a yaklaştırıyor. Daha da kötü haberler var: [SOV.GetAdjective] sınırı boyunca dramatik bir şekilde artan hareketlilik duyuyoruz ve ele geçirilen iletişimler, kuzeye bir saldırının her an gerçekleşebileceğini ima ediyor. Hazırlıklı olmalıyız; dayanmalıyız."
 bftb_greece.37.t:0 "[FROM.GetAdjective] Kuvvetleri Püskürtüldü!"
 bftb_greece.38.a:0 "[FROM.GetNameDef] için bu oyun en başından hileliydi..."
 bftb_greece.38.desc:0 "Maalesef, görünüşe göre kuvvetlerimiz [341.GetName]'daki [FROM.GetAdjective] savunmasını yaramadı. Üst komuta, sonuçlardan elbette hayal kırıklığına uğradı ama şaşırmadı. Eğer [FROM.GetAdjective] kuvvetleri misilleme yapmayacaksa, o zaman tekrar tırmandırmalıyız. Bu sefer, [SOV.GetNameDef] kuzeydeki [FROM.GetAdjective] mevzilerine saldırırken, biz de [187.GetName]'dan [339.GetName] ve [340.GetName]'a iki kıyı saldırısı yapacağız. Bu sefer nasıl başarısız olabiliriz ki?"
 bftb_greece.38.t:0 "Türkler Kuvvetlerimize Karşı Zafer Kazandı!"
 bftb_greece.39.a:0 "[FROM.GetAdjective]ler bize başka seçenek bırakmadı!"
 bftb_greece.39.desc:0 "Kuvvetlerimiz, [FROM.GetAdjective] silahlı kuvvetlerinin bu kadar cüretkâr bir saldırısına hazırlıksız yakalanarak [341.GetName]'da ulusumuz için korkunç bir kayıpla püskürtüldü. [FROM.GetAdjective] kuvvetleri ilerlemelerini durdurmadı ve bir savaş ilanının kesinlikle yakın olduğu aşikâr. Kaybımız hayal kırıklığı yaratıcı olsa da, yıkıcı değildi - bu savaş daha yeni başladı ve halkımız eski rakibimize karşı bu savaşta sıkı bir şekilde yanımızda duruyor."
 bftb_greece.39.t:0 "Boğaziçi Muharebesi Başlıyor!"
 bftb_greece.40.a:0 "İzmir üzerinden tüm ülkeyi alacağız!"
 bftb_greece.40.desc:0 "Üst komutamızın beklediği gibi, sınırlarımızdaki [FROM.GetAdjective] kuvvetlerine karşı zafer kazandık ve İzmir'in savunmasını kırdık. Muazzam başarımızla hareketlenen silahlı kuvvetlerimiz, [FROM.GetAdjective] topraklarına saldırılarını üstlenmeye çoktan başladı. Üst komutamız, zaferimizle cesaretlenerek, [FROM.GetNameDef]'in birkaç hafta içinde düşeceğine inanıyor."
 bftb_greece.40.t:0 "Boğaziçi Muharebesi Başlıyor!"
 bftb_greece.41.a:0 "Şehitlerin intikamını alacağız!"
 bftb_greece.41.desc:0 "[FROM.GetAdjective]'in [339.GetName]'a saldırısı onlar için bir başarısızlık oldu, ancak bizim için korkunç bir kayıp olmaya devam ediyor. [ROOT.GetLeader], [FROM.GetAdjective] kuvvetlerinin son olarak 1919'da [339.GetName]'da acımasız bir saldırıya giriştiği zamanla özel olarak karşılaştırmalar yapmaktan kendini alamıyor. \n\nBaşkentteki yetkililer kısa süren [339.GetName] Kuşatması'nda hayatını kaybedenler için yas tutsa da, tüm ulus eski bir düşman tarafından egemenliğimize yönelik bu cüretkâr saldırılara karşı öfkeyle köpürüyor. [341.GetName]'a yapılan sürpriz saldırı alçakçaydı, ancak [339.GetName]'da meydana gelen kayıplar affedilemez. Eğer [FROM.GetAdjective] hükümeti açık bir savaş ilanı verecek kadar korkaksa, o zaman biz onlar için bir tane sağlarız."
 bftb_greece.41.t:0 "Boğaziçi Muharebesi Başlıyor!"
 bftb_greece.42.a:0 "Zafer bizim olacak! Devrim için!"
 bftb_greece.42.desc:0 "Planlarımız suya düştü; üst komuta, [FROM.GetAdjective] kuvvetleri tarafından bir kez püskürtülebileceğimizi beklemişti ama her iki sürpriz saldırıda da püskürtülmek bizim için gerçekten kötüye işaret. [ROOT.GetLeader] hazırlanan gelecekteki saldırıları iptal etti ancak durumu kurtarma girişimleri görünüşe göre boşa çıkacak, çünkü bir [FROM.GetAdjective] delegesinden az önce bir savaş ilanı aldık. Görünüşe göre durum evrildi ve bu illa ki bizim lehimize değil."
 bftb_greece.42.t:0 "Boğaziçi Muharebesi Başlıyor!"
 bftb_greece.43.a:0 "[TUR.GetNameDef] için!"
 bftb_greece.43.desc:0 "[FROM.GetAdjective]'in [339.GetName]'a saldırısı onlar için bir başarı ve bizim için korkunç bir kayıp oldu. [ROOT.GetLeader], [FROM.GetAdjective] kuvvetlerinin son olarak 1919'da [339.GetName]'ın kontrolünü ele geçirdiği zamanla özel olarak karşılaştırmalar yapmaktan kendini alamıyor. \n\nBaşkentteki ruh hali kasvetli olsa da, tüm ulus eski bir düşman tarafından egemenliğimize yönelik bu cüretkâr saldırılara karşı öfkeyle köpürüyor. [341.GetName]'a yapılan sürpriz saldırı alçakçaydı, ancak [339.GetName]'da meydana gelen kayıplar affedilemez. Eğer [FROM.GetAdjective]ler gerçekten bir savaş daha istiyorlarsa, o zaman onlara asla unutamayacakları bir savaş yaşatacağız."
 bftb_greece.43.t:0 "Boğaziçi Muharebesi Başlıyor!"
 bftb_greece.44.a:0 "[FROM.GetAdjective]'in Komintern'e katılımı zorunludur."
 bftb_greece.44.desc:0 "Beklendiği gibi, Kızıl Ordu [354.GetName]'daki zavallı [FROM.GetAdjective] garnizonlarını kısa sürede temizledi ve cesaret verici derecede rutin bir işgalin yolunu açtı. Biz onları kuzeyden vururken, [GRE.GetAdjective]ler de batıdan saldıracak. Hiç şansları yok."
 bftb_greece.44.t:0 "[FROM.GetNameDef]'de Muzafferiz!"
 bftb_greece.45.a:0 "Kendimizi yok olmaktan kurtardık."
 bftb_greece.45.desc:0 "Yetkililer, [354.GetName]'da konuşlu kuvvetlerimizin, yaklaşan [FROM.GetAdjective] işgalcilerini başarıyla püskürttüğünü ve ezici zorluklara rağmen mevzilerini koruduğunu duyunca hayrete düştüler. Sadece [FROM.GetAdjective] büyükelçisinden tüm olay için coşkulu bir şekilde özür dileyen acil bir bildiri almakla kalmadık, aynı zamanda tüm operasyonun beyni olarak [GRE.GetAdjective] rejimini suçlayan istihbarat da sağladılar. [GRE.GetNameDef] ile mücadelemizin savaşa dönüşmesi durumunda herhangi bir [FROM.GetAdjective] misillemesi beklemememiz gerektiği konusunda bize güvence verildi."
 bftb_greece.45.t:0 "[FROM.GetAdjective]ler Sınırda Geri Püskürtüldü!"
 bftb_greece.46.a:0 "Bunun için biri kurşuna dizilecek!"
 bftb_greece.46.desc:0 "[354.GetName]'a yapılan saldırının uluslararası saygınlığımıza ve üst komutamızın egolarına yıkıcı bir darbe vuran tam bir fiyasko olduğuna dair haber alındı. [FROM.GetAdjective] hükümetine en içten özürlerimizi ilettik ve batıda hala [FROM.GetAdjective] devletini düşmanlaştıran [GRE.GetAdjective] rejimine olan her türlü desteği geri çektik."
 bftb_greece.46.t:0 "[FROM.GetAdjective] Kuvvetleri Saldırımızı Püskürttü!"
 bftb_greece.47.a:0 "Bu, Anavatan için kıyamet anlamına gelebilir mi?"
 bftb_greece.47.desc:0 "Az sayıda danışman, [FROM.GetAdjective] kuvvetlerinin kuzeyde bizimkileri püskürtmeyi başarmasına şaşırıyor, ancak bu hayal kırıklığını daha az elle tutulur kılmıyor. [FROM.GetAdjective] kuvvetleri [354.GetName] sınırındaki saldırılarını durdurmadı: sınırlarımıza yakın düzensiz ve şüphesiz kitlesel birlik hareketleri raporları ve hatta [800.GetName]'da [FROM.GetAdjective] askerlerinin sınır hattını geçtiğine dair raporlar alıyoruz. Bu ancak işgal anlamına gelebilir. En kötüsüne hazırlanmalıyız."
 bftb_greece.47.t:0 "[FROM.GetNameDefCap] [354.GetName]'daki Mevzilerimizi Kırıyor!"
 bftb_greece.48.a:0 "O lanet Tito ve o lanet [FROM.GetAdjective]ler!"
 bftb_greece.48.desc:0 "[FROM.GetNameDef]'in aşağılık Marksist rejimi, terörist Josip Broz Tito'yu silahlandırdı ve onu güneyde bir isyan başlatmaya teşvik etti! Tehlike, [FROM.GetAdjective]'in yönetimimizi devirme umuduyla güneydeki yeni ortaya çıkan rejimle aktif olarak iş birliği yapmaması durumunda belki de ihmal edilebilir olurdu. Görünüşe göre isyancıları ezmekten ve ardından [FROM.GetAdjective] başkentine yürüyerek onları yola getirmekten başka seçeneğimiz olmayacak."
 bftb_greece.48.t:0 "[FROM.GetAdjective]ler Güneyde Komünist Bir İsyan Kışkırtıyor!"
 bftb_greece.50.a:0 "Kral'ın hükmetme hakkı kutsaldır!"
 bftb_greece.50.desc:0 "Majesteleri Kral II. Georgios, bu ulusun çekişen siyasi hasımlar tarafından parçalanmasını önlemek amacıyla ülkenin kontrolünü doğrudan ele alacağını ilan etmesiyle tüm ulusta hissedilen şok dalgaları yarattı. Bu amaçla, Kral'ın ilk kararnamesi, Kral tarafından 'kendi çıkarını düşünen engereklerin yuvası' olarak kınanan Helen Parlamentosu'nu süresiz olarak askıya almak oldu. \n\nKral'ın kararnamesi bazıları tarafından kutlanırken, toplumun diğer önde gelen unsurları tarafından daha yaygın bir şekilde kınandı. Cumhuriyetçi Venizelosçular ve aşağılık komünistler, 'Helenlerin Kralı'nı tahtından indirip kalıcı olarak bertaraf etme ortak arzuları nedeniyle on yıllardır süren düşmanlığın ardından bir araya geldiler. Şu anki istihbarat raporları, önümüzdeki haftalar veya aylar içinde pekâlâ bir iç savaşın patlak verebileceğini gösteriyor."
 bftb_greece.50.t:0 "Kral, Helen Parlamentosu'nu Feshetti!"
 bftb_greece.51.a:0 "Şüphesiz tüfeklere ihtiyaçları olacak."
 bftb_greece.51.b:0 "Yardım için biraz malzeme ayırabiliriz."
 bftb_greece.51.c:0 "Yunan işlerine karışmamak en iyisi olur."
 bftb_greece.51.desc:0 "Atina'daki [ROOT.GetAdjective] yanlısı hükümet, ülke çapındaki bir siyasi bölünmenin feci bir iç savaşa yol açmasının ardından bizden maddi yardım talep etti. Bunu bizden istemeye elbette hakları var, ancak istedikleri malzemelere değip değmedikleri sorusu sadece bizim cevaplayabileceğimiz bir soru."
 bftb_greece.51.t:0 "Yunanistan'daki Monarşistler Bizden Yardım İstiyor!"
 bftb_greece.52.a:0 "Kral'ın gerçek müttefikleri!"
 bftb_greece.52.desc:0 "[FROM.GetNameDef]'den gelen silahları ve gönüllüleri rıhtımlarımızdan boşaltmayı yeni bitirdik. Destek çok memnuniyet verici ve beklediğimizden çok daha fazlası. Bu yardım önümüzdeki aylarda bize çok iyi hizmet edecek."
 bftb_greece.52.t:0 "[FROM.GetNameDefCap] Bize Silah ve Gönüllüler Gönderiyor!"
 bftb_greece.53.a:0 "Kral'ın gerçek müttefikleri!"
 bftb_greece.53.desc:0 "[FROM.GetNameDef]'den gönderilen malzemeleri rıhtımlarımızdan boşaltmayı yeni bitirdik. Destek çok memnuniyet verici ve bu sıkıntılı zamanlarda hoş bir dostluk göstergesi. Bu yardım önümüzdeki aylarda bize çok iyi hizmet edecek."
 bftb_greece.53.t:0 "[FROM.GetNameDefCap] Bize Yardım Gönderiyor!"
 bftb_greece.54.a:0 "Hayal kırıklığı."
 bftb_greece.54.desc:0 "Bir [FROM.GetAdjective] diplomattan yardım çağrımızın sağır kulaklara düştüğü ve [FROM.GetNameDef]'den herhangi bir yardım beklemememiz gerektiği haberini aldık. Durum talihsiz, ancak yabancı güçlerin yardımı olmadan da sebat edeceğiz."
 bftb_greece.54.t:0 "[FROM.GetNameDefCap] Bize Yardım Etmeyi Reddediyor"
 bftb_greece.55.a:0 "Harika bir fikir!"
 bftb_greece.55.b:0 "Kıbrıs kendi yolunu çizecek."
 bftb_greece.55.desc:0 "[FROM.GetNameDef]'den bir temsilci, iki ulusumuzu tek bir ulus olarak birleştirmemizi önerdi. Ortak bir tarihe ve kültürel mirasa atıfta bulunan [FROM.GetAdjective] temsilcisi, uzun süredir yüceltilen 'Enosis' kavramını, yani devletlerimizin tek bir büyük bütün halinde birleşmesini kolaylaştırmamızın [FROM.GetAdjective] hükümetinin iradesi olduğunu ifade etti."
 bftb_greece.55.t:0 "[GRE.GetNameDefCap] Enosis Öneriyor"
 bftb_greece.56.a:0 "Akrabalar nihayet birleşti!"
 bftb_greece.56.desc:0 "[FROM.GetAdjective]'den, iki halkımızın uzun zamandır beklenen birliğini bizim kontrolümüz altında tek bir devlette birleştirmeyi kolaylaştırmaya istekli oldukları haberini aldık. Ülke genelinde kutlamalar başladı ve [ROOT.GetLeader] bu tarihi günü kutlamak için kişisel olarak Lefkoşa'ya giderek oradaki halka bir konuşma yaptı."
 bftb_greece.56.t:0 "[CYP.GetNameDefCap] Enosis'e Bağlılığını Bildiriyor"
 bftb_greece.57.a:0 "Bu bir rica değildi."
 bftb_greece.57.b:0 "Pekala, madem istekleri bu yönde..."
 bftb_greece.57.desc:0 "[FROM.GetAdjective] yetkilileri, en başta elde etmek için bu kadar uzun bir mücadeleye katlandıktan sonra [FROM.GetAdjective] egemenliğinden vazgeçme niyetleri olmadığını bize bildirdi. 'Enosis'in [FROM.GetAdjective] hükümetinin şu anda dikkate almaya istekli olduğu bir kavram olmadığı ilan edildi."
 bftb_greece.57.t:0 "[CYP.GetNameDefCap] Enosis'i Reddediyor!"
 bftb_greece.58.a:0 "Resmi bir ittifak karşılığında tekliflerinizi kabul ediyoruz."
 bftb_greece.58.b:0 "Bırakın alsınlar; Kıbrıs'ın bizim için bir önemi yok."
 bftb_greece.58.c:0 "[FROM.GetAdjective] hükümeti gücü 'Kıbrıslı' yetkililerle paylaşmalı."
 bftb_greece.58.d:0 "Açgözlü Yunanlar hiçbir şey alamaz!"
 bftb_greece.58.desc:0 "Bir [FROM.GetAdjective] delegesi tarafından Kıbrıs kraliyet kolonimizin geleceğini görüşmek üzere bize yaklaşıldı. [FROM.GetAdjective], Kıbrıs ulus-inşası girişimlerinin her zaman başarısızlıkla sonuçlanmaya mahkûm olduğu suçlamasında bulundu, çünkü Kıbrıs halkı aslında [FROM.GetAdjective] halkıdır. \n\n[FROM.GetAdjective], [FROM.GetAdjective] Başbakanı [FROM.GetLeader]'dan, 'Enosis' kavramının tarihinin bir miktar ayrıntıyla ortaya konulduğu bir mektup sundu ve ardından Kıbrıs ile [FROM.GetNameDef]'in birleşmesi için son bir vurgulu çağrı yapıldı. [FROM.GetAdjective] delegesi, temsilcimize bunun [FROM.GetAdjective] tarafından kaba bir irredentizm meselesi olmadığını temin etmeye çalıştı; Kıbrıs ve [FROM.GetNameDef]'in ortak bir kültürel mirası, ortak bir tarihi, ortak bir dili ve [FROM.GetAdjective] perspektifinde ortak bir kaderi vardır. \n\nAskeri yetkililerimiz Kıbrıs'ın Akdeniz'de önemli bir stratejik askeri üs olarak önemini vurguladılar, ancak dış politika danışmanlarımız güçlendirilmiş bir [FROM.GetAdjective] müttefikinin, Kıbrıs'ın tek başına bir hava ve deniz üssü olarak sağlayabileceğinden çok daha fazlasını sağlayabileceğini vurguluyor. Seçim nihayetinde [ROOT.GetAdjective] kabinesine düşüyor, ancak [FROM.GetAdjective] temsilcisini yanıtımız için çok uzun süre bekletmediğimizden emin olmalıyız."
 bftb_greece.58.t:0 "[FROM.GetNameDefCap] Kıbrıs ile Enosis Talep Ediyor"
 bftb_greece.59.a:0 "Nihayet birlikteyiz!"
 bftb_greece.59.b:0 "Enosis için özerkliğimizi feda edemeyiz."
 bftb_greece.59.desc:0 "[ROOT.GetLeader]'in, bunca yıldan sonra [ROOT.GetAdjective]'in Kıbrıs ile Enosis hayallerinin nihayet gerçeğe dönüşeceğini ve bunun tamamen [FROM.GetAdjective] dostlarımız sayesinde olduğunu ulusa duyurmasından sonra başkentteki ruh hali en iyi 'sevinçli' olarak tanımlanabilir. Yöneticilerimiz, iktidar geçişinin mümkün olduğunca sorunsuz gitmesini sağlamak için Kıbrıs'a gitmekte hiç vakit kaybetmedi. \n\nBu, [ROOT.GetNameDef] için gerçekten büyük ve tarihi bir gün. Kıbrıs uzun zamandır [ROOT.GetAdjective] kolektif bilincinin bir parçası olmuştur ve şimdi nihayet fışkırdıkları medeniyetin bağrında, evlerindeler."
 bftb_greece.59.t:0 "[FROM.GetNameDefCap] Enosis'i Kolaylaştırmayı Kabul Ediyor!"
 bftb_greece.6.a:0 "Geçmişin hayaletleri bize musallat olmak için geri dönmeyecek."
 bftb_greece.6.b:0 "Faşist haşerelerle anlaşma olmaz."
 bftb_greece.6.desc:0 "Hain Anadolu faşistleri, habis hareketlerinin en başından beri hükümet tarafından ulaşılamaz hale gelirken kaos ekiyorlardı, ancak işler değişiyor gibi görünüyor. Bize yüzyılın anlaşmasını yapma teklifiyle yaklaşıldı - güçlerimizi Anadolu faşistleriyle birleştirerek [TUR.GetNameDef]'in yenilgisi olan ortak hedefimizi ilerletmek. \n\nİdarecilerimizden birçoğunun, sadece hükümet karşıtı eylemlerini durdurmaları için ulusumuzun bu şeytanlarıyla bu anlaşmayı yapacağı inkâr edilemez ve ayrıca memurlarımız arasında EEE'nin hedeflerini makul, hatta övgüye değer bulan bazı yılanların olduğu da inkâr edilemez. Neyse ki, iş adamı Aristoteles Onassis bize alternatif bir eylem planı sundu: Kendisi de Anadolulu olan Onassis, şöhretini, iş zekasını ve kişisel servetini kullanarak bir karşı hareket oluşturacak ve bu hareketi EEE'nin destek tabanını zayıflatmak için kullanacak. Bu eylem planı hiçbir şekilde EEE'nin ezilmesini garanti etmiyor, ancak Onassis'in ondan istememiz halinde bu işin üstesinden gelebileceğine dair yeterince kanıtımız var."
 bftb_greece.6.t:0 "EEE ile Müzakereler"
 bftb_greece.60.a:0 "Hoş geldiniz, kardeşler!"
 bftb_greece.60.desc:0 "[FROM.GetAdjective]ler, Enosis'i kolaylaştırmaları yönündeki orijinal talebimize ilginç bir uzlaşma teklif etti: taleplerimizi, [FROM.GetAdjective] dominyonuyla aynı statüye sahip bir Kıbrıs hükümetiyle iş birliği yapmamız koşuluyla yerine getirmeye hazırlar. Bu tamamen hoş karşılanmayan bir gelişme değil, sadece... beklenmedik. \n\nKendi paylarına, Kıbrıs hükümeti, eğer [ROOT.GetNameDef] Kıbrıs'ta yeni kurulan uluslarını inşa ederek yeterli bağlılık gösterirse, aramızda tam bir Enosis'e karşı olmayacaklarını kabul etti. Ancak o güne kadar, kalçadan bize bağlı yeni bir Kıbrıslı müttefikle yetinmek zorunda kalacağız."
 bftb_greece.60.t:0 "[FROM.GetNameDefCap] Kısmi Bir Enosis'i Kabul Ediyor"
 bftb_greece.61.a:0 "Bunu hatırlayacağız..."
 bftb_greece.61.desc:0 "Uzun zamandır değer verdiğimiz müttefikimize olan güvenimiz ve inancımız yersiz çıkmış görünüyor; [FROM.GetNameDef], [ROOT.GetAdjective] adası Kıbrıs'ı kontrolümüze devretme fikrini bile dikkate almayı reddetti. Adanın stratejik önemini ve [ROOT>GetAdjective] rövanşizmi konusundaki endişelerini, kendi gözlerinde, adayı hak etmememizin nedenleri olarak gösteriyorlar. \n\nTamamen şaşırdığımız söylenemez, ama bu kolektif hayal kırıklığımızı daha az acı kılmıyor. Kıbrıs'ın anavatana dönmesini kaç yıldır bekledik? Bu aksaklık yüzünden daha kaç yıl beklemek zorunda kalacağız? [FROM.GetNameDef] ile olan ilişkimize dair heyecanımızın bu gelişmeyle önemli ölçüde azaldığını söylemek gerekir."
 bftb_greece.61.t:0 "[FROM.GetNameDefCap] Enosis'i Reddediyor!"
 bftb_greece.62.a:0 "Barış adına, savaşalım."
 bftb_greece.62.b:0 "[FROM.GetAdjective]ler gerçekten çıldırmış..."
 bftb_greece.62.desc:0 "Eski [FROM.GetAdjective] rejiminin yerine faşist bir rejimin geçtiği haberi geldiğinde, başkentteki danışmanların üzerine büyük bir korku çöktü. Savaşın, kaçınılmaz bir şey haline geldiğini hissettik: ve Ege bölgesinde barışı korumaya yönelik önceki girişimlerimizle daha da acı hale geldi. Görünüşe göre, kader bizi yanılttı. \n\nBize eşsiz bir teklifle yaklaşıldı: [FROM.GetNameDef]'in faşist hükümeti, savaşın her iki ülkemize de dokunmasının kaçınılmaz olduğuna inanıyor. [FROM.GetLeader], ideolojik eğilimlerine rağmen, her iki tarafın da on yıllardır süren diplomatik çabalarını, kesinlikle büyük ve korkunç bir savaş olacak olan bir şey uğruna bir kenara atmanın akıllıca olmayacağı yönündeki hissiyatımızı paylaşıyor. Bu amaçla, [FROM.GetNameDef] hükümeti, birlikte kendimizi Avrupa'nın ortaya çıkan faşist güçlerine bağlamamızı tavsiye etti. [FROM.GetLeader], kıtada faşist üstünlüğün kaçınılmaz olduğuna ve birlikte savaşın daha hızlı ve daha kesin bir şekilde sona ermesi için teraziyi yeterince değiştirecek güce sahip olduğumuza inanıyor. [FROM.GetLeader] buna 'merhamet' diyor; [ROOT.GetLeader] o kadar emin değil."
 bftb_greece.62.t:0 "[FROM.GetNameDefCap] Mihver'e Ortak Başvuru Öneriyor!"
 bftb_greece.63.a:0 "İki tane ittifak başvuru formu, lütfen!"
 bftb_greece.63.b:0 "Ya da belki... Türklere ihtiyacımız yoktur?"
 bftb_greece.63.desc:0 "Başarı! [FROM.GetAdjective] büyükelçisi, önerdiğimiz dostluk paktına hükümetlerinin onayını iletti. Faşist güçlerle birlikte çalışarak ve birbirimize bağlı kalarak kaybetmemizin imkânı yok."
 bftb_greece.63.t:0 "[FROM.GetNameDefCap] Helenotürkizm Dostluk Paktı'nı Kabul Ediyor!"
 bftb_greece.64.a:0 "Güçlü olanlar yeryüzünü miras alacak; uysal olanlar yok olacak."
 bftb_greece.64.desc:0 "Görünüşe göre [FROM.GetAdjective] hükümeti kronik bir öngörü eksikliğinden muzdarip. Kaçınılmaz galiplerin yanında bize katılmayacaklar, çünkü ya korkaklar ya da aptallar. Bunun bir önemi yok, yolumuz belli ve [FROM.GetNameDef] ile ilgili bundan sonra ne olursa olsun, kısmen kendi hataları olacak."
 bftb_greece.64.t:0 "[FROM.GetNameDefCap] Helenotürkizm Dostluk Paktı'nı Kesin Olarak Reddediyor!"
 bftb_greece.65.a:0 "Birlikte tarih yazacağız!"
 bftb_greece.65.b:0 "Bu ikili için planlarımızda kesinlikle ittifaklara yer yok."
 bftb_greece.65.desc:0 "Bir yapbozun parçaları gibi, her şey yerine oturuyor gibi görünüyor. Berlin'deki rejim değişikliği beklenmedikti ve ulusumuzun geleceği hakkında birçok şüphe uyandırdı. Bu gelecek, Atina'dan bize gönderilen bir teklifle biraz daha belirgin hale geldi. \n\nGörünüşe göre [FROM.GetNameDef] ve [TUR.GetNameDef]'in hükümetimizle kalıcı bir stratejik ittifak kurma arzusu var. Müttefik sıkıntısı çekiyorduk ve bu ikisinin bir Akdeniz Paktı'na eklenmesi, bölgesel hedeflerimizi güvence altına almada kesinlikle büyük bir yol kat edebilir. Gerçi, bu ikisinin başka türden emellerimizin konusu olmadığını kim söyleyebilir."
 bftb_greece.65.t:0 "[FROM.GetNameDefCap] ve [TUR.GetNameDef] Stratejik Ortaklık Öneriyor"
 bftb_greece.66.a:0 "Bu çalkantılı zamanlarda hoş geldiniz müttefikler."
 bftb_greece.66.b:0 "Hayır, onlara ihtiyacımız yok."
 bftb_greece.66.desc:0 "Hem [FROM.GetNameDef] hem de [TUR.GetNameDef]'den gelen delegelerle görüştük ve ikisinin [ROOT.GetFactionName]'e ortak başvuru yaptığını duyunca oldukça şaşırdık. Bu pek de hoş karşılanmayan bir sürpriz değil, ama yine de bir sürpriz. Onları ittifakımızda ortak olarak bulundurmanın hedeflerimizi ilerletip ilerletmeyeceğini veya engelleyip engellemeyeceğini belirlemeliyiz."
 bftb_greece.66.t:0 "[FROM.GetNameDefCap] ve [TUR.GetNameDef] [GER.GetFactionName] Üyeliği İçin Başvuruyor"
 bftb_greece.67.a:0 "Roma ve Atina - nihayet tekrar bir arada!"
 bftb_greece.67.b:0 "Avcı, avıyla arkadaşlık etmez."
 bftb_greece.67.desc:0 "Bir yapbozun parçaları gibi, her şey yerine oturuyor gibi görünüyor. Berlin'deki rejim değişikliği beklenmedikti ve ulusumuzun geleceği hakkında birçok şüphe uyandırdı. Bu gelecek, Atina'dan bize gönderilen bir teklifle biraz daha belirgin hale geldi. \n\nGörünüşe göre [FROM.GetNameDef]'in hükümetimizle kalıcı bir stratejik ittifak kurma arzusu var. Müttefik sıkıntısı çekiyorduk ve [FROM.GetNameDef]'in yardımı bölgesel hedeflerimizi güvence altına almada kesinlikle büyük bir yol kat edebilir. Gerçi, bunun sadece hayatta kalmak için son bir zavallı girişim olmadığını kim söyleyebilir? Belki de gerçekten müttefikimiz olmak istemiyorlardır; belki de duvardaki yazıyı görüyorlar ve bize karşı çıkarlarsa işlerin onlar için kaçınılmaz olarak nasıl biteceğini anlıyorlar... ve belki de bu bizim için çok da önemli bir ayrım değil."
 bftb_greece.67.t:0 "[FROM.GetNameDefCap] Stratejik Bir Ortaklık Öneriyor!"
 bftb_greece.68.a:0 "Hoş geldin, Yunanistan!"
 bftb_greece.68.b:0 "Hayır, asla!"
 bftb_greece.68.desc:0 "[FROM.GetNameDef]'den gelen delegelerle görüştük ve [FROM.GetAdjective] yönetiminin [FROM.GetNameDef]'i [ROOT.GetFactionName]'de görme arzusunu dile getirdiğini duyunca oldukça rahatladık. Bu pek de sürpriz değil: [FROM.GetAdjective]'in konumu biz olmadan savunulamazdı. Onları ittifakımızda ortak olarak bulundurmanın hedeflerimizi ilerletip ilerletmeyeceğini veya engelleyip engellemeyeceğini belirlemeliyiz."
 bftb_greece.68.t:0 "[FROM.GetNameDefCap] [GER.GetFactionName] Üyeliği İçin Başvuruyor!"
 bftb_greece.69.a:0 "Bütün bunlar bittiğinde hala ayakta olacağız."
 bftb_greece.69.desc:0 "Bir [FROM.GetAdjective] diplomattan, [FROM.GetLeader]'in bizi sıkı sıkıya bağlı ittifaklarına eklemenin akıllıca bir karar olmayacağını düşündüğü bilgisi verildi. Hayal kırıklığına uğradığımızı söylemek yetersiz kalır. Ne olursa olsun, [FROM.GetNameDef] ile bir ittifak olmadan, şimdi bu kriz zamanında kendi yolumuzu çizmeliyiz."
 bftb_greece.69.t:0 "[FROM.GetNameDefCap] İttifak İsteğimizi Reddediyor!"
 bftb_greece.7.a:0 "[FRA.GetAdjective] ve [ENG.GetAdjective] delegelerini davet edeceğiz."
 bftb_greece.7.b:0 "Orijinal Sevr imzacılarının hepsini davet edeceğiz."
 bftb_greece.7.desc:0 "Nihayet Sevr ve Lozan antlaşmalarını Avrupa'nın büyük güçleriyle yeniden gözden geçirme ve ayrıca Megali İdea konusuna yeniden yaklaşma zamanı geldi. [TUR.GetNameDef]'in kaderi tek başımıza bizim tarafımızdan belirlenemez, bu yüzden eğer onları da konferansımıza davet etmeyi seçersek önce [ENG.GetNameDef]'in, [FRA.GetNameDef]'in ve aşağılık [ITA.GetNameDef]'in onayını kazanmalı ve geliştirmeliyiz."
 bftb_greece.7.t:0 "Kandiye Konvansiyonu"
 bftb_greece.70.a:0 "Kurtulduk ondan."
 bftb_greece.70.desc:0 "Venizelosçuların lideri ve Yunan siyasetinin saygın bir devi olan Eleftherios Venizelos, 1935'te ordu tarafından devrilmesinin ardından hala sürgündeyken vefat etti. Venizelos, Yunan çok partili sistemine tutkulu bir katkıda bulunan ve belki de Yunan ulusal bilincini ne kadar etkilediği konusunda rakipsiz bir figürdü. \n\nAncak, Eleftherios Venizelos başarılarıyla değil, birçok başarısızlığıyla hatırlanacaktır. Bu ülkede cumhuriyetçiliğin yıkıcı gücünü savunan Venizelos'tu ve ulusumuzu 1919 Grek-Türk Savaşı'nda neredeyse yok olmanın eşiğine getiren Venizelos'un anlamsız revizyonizmiydi. Yunanistan'ın bugün karşılaştığı her bir sorun, ulusumuzun tüm sıkıntılarının ana kaynağı olarak Venizelos'un ayaklarına serilebilir. \n\nO bir devrimci, bir devlet adamı ve bir siyasi öncüydü; o bir kışkırtıcı, bir savaş çığırtkanı ve bir başarısızlıktı. Eleftherios Venizelos hakkında, sebep olduğu tüm acılardan sonra bir daha Yunanistan'da yüzünü göstermeyeceği için sevindiğimizden başka ne söylenebilir ki."
 bftb_greece.70.t:0 "Eleftherios Venizelos Sürgünde Öldü"
 bftb_greece.71.a:0 "Yunanistan'ın sana asla ödeyemeyeceği bir borcu var..."
 bftb_greece.71.desc:0 "Başbakan Eleftherios Venizelos, Venizelosçuların lideri ve Yunan siyasetinin saygın bir devi, evinde huzur içinde vefat etti. Venizelos, Yunan çok partili sistemine tutkulu bir katkıda bulunan ve belki de Yunan ulusal bilincini ne kadar etkilediği konusunda rakipsiz bir figürdü. \n\nÜlkesine ve yurttaşlarına kendisinden bu kadar çok şey veren bir adama sadece kelimeler nasıl adalet sağlayabilir ki? O, bugün hizmet etme ayrıcalığına sahip olduğumuz ulusun mimarıdır ve geride bıraktığı kalıcı miras hepimizden daha uzun yaşayacaktır. Venizelos'un lekesiz sicilindeki tek kara leke, yıkıcı 1919 Grek-Türk Savaşı'ndan sonra ulusumuzun uğradığı korkunç kayıptır. Bu, aksi takdirde mükemmel bir miras üzerinde, kendimizin intikamını almayı tamamen niyetlendiğimiz bir lekedir. \n\nEleftherios Venizelos bir devrimci, bir devlet adamı ve bir siyasi öncüydü; o bizim Etnarkımızdı (Milli Liderimiz) ve onu olduğu gibi tavizsiz bir aslan yürekli olarak hatırlayacağız. Themistoklis Sofoulis, Başbakan ve Fileleftheron'un lideri olarak görevi devraldı ve yakın zamanda vefat eden modern Yunanistan'ın babası için ulusal yas günü ilan etti."
 bftb_greece.71.t:0 "Eleftherios Venizelos Vefat Etti"
 bftb_greece.8.a:0 "Bizi orada bekleyin."
 bftb_greece.8.b:0 "Akdeniz'i istikrarsızlaştırırsınız!"
 bftb_greece.8.desc:0 "[FROM.GetNameDef]'den, açıkça [TUR.GetNameDef]'in sınırlarını yeniden çizmek isteyen ilginç bir teklif aldık. [FROM.GetNameDef], [TUR.GetNameDef]'e dayatmaya çalıştığımız Sevr ve Lozan antlaşmalarını yeniden ele almak için Avrupa'nın Büyük Savaş'tan galip çıkan güçleri arasında bir tartışma düzenlemek istiyor. \n\n[FROM.GetNameDef]'den gelen yetkililer, yetkililerimize mağlup bir [TUR.GetNameDef]'den maddi kazançlar elde edeceğimizi ve [TUR.GetNameDef]'in yok edilmesinin [FROM.GetAdjective] hükûmetinin isteği olmadığını temin ediyorlar. Bunun yerine, [FROM.GetNameDef]'den gelen şahsiyetler, bu konvansiyonun rövanşist hayallerin gerçekleşmesinden ziyade sınırların yeniden düzenlenmesi üzerine basit bir mesele olarak anılmasında ısrar ediyorlar."
 bftb_greece.8.t:0 "Kandiye Konvansiyonu'na Davet"
 bftb_greece.9.a:0 "[ENG.GetAdjective]ler her zaman güvenilir olmuştur!"
 bftb_greece.9.desc:0 "[TUR.GetNameDef]'in sınırlarının yeniden düzenlenmesi üzerine Kandiye Konvansiyonumuza davetiyeler, orada olmasını istediğimiz tüm güçlere gönderildi. Davet edilen her ülkenin katılmasını beklememize rağmen, zirvemize sadece [ENG.GetNameDef]'in katılacağı ortaya çıktı. [ENG.GetNameDef] ile ilişkilerimiz her zaman derin olmuştur, bu nedenle birçok yetkilimiz Kandiye Konvansiyonu'nun her iki ulusumuzun da yararına olacak şekilde çözülebileceğinden emin."
 bftb_greece.9.t:0 "Kandiye Konvansiyonu'na Sadece [ENG.GetNameDef] Katılıyor"
 bftb_greece.91.a:0 "Desteklemeye değer bir girişim!"
 bftb_greece.91.b:0 "Kapatın gitsin."
 bftb_greece.91.desc:0 "Davasına daha fazla takipçi çekmek için alaycı bir girişimle, Georgios Kosmidis hareketinin fonlarını kendisi gibi [TUR.GetNameDef]'den gelen mülteciler için bir yardım merkezi açmak için kullandı. Bu yardım merkezlerini psikotik hareketine üye toplama merkezleri olarak kullanmıyor olsaydı, bu övgüye değer olurdu. \n\nZor bir durumda kaldık: Kosmidis'in, Anadolu'nun haklarından mahrum bırakılmış mültecilerini toplamak için bu merkezleri desteklemeye devam etmeyi planladığı açık, peki onun zehrini durdurmak için onları kapatmalı mıyız? Yoksa itibarımızı koruyup bu merkezlerin faaliyet göstermesine izin mi vermeliyiz? Bazıları, yoksul mültecilerin faşist yardım merkezlerinde çalışmasının, onların gecekondu mahallelerinde acı çekmesinden daha tercih edilir olduğunu iddia edebilir."
 bftb_greece.91.t:0 "EEE, Anadolu Mültecileri İçin Bir Yardım Merkezi Açtı"
 bftb_greece.92.a:0 "Belki... sembolik bir asgari ücret?"
 bftb_greece.92.b:0 "Faşist gözdağına boyun eğmeyiz."
 bftb_greece.92.desc:0 "EEE, kendilerine yöneltilen ulusal ilgiyi, refaha yönelik zayıf yaklaşımları olarak algıladıkları şeye sert bir saldırı başlatarak sömürdü. Görünüşe göre birdenbire ortaya çıkan bu faşistlerin, bize mali ve sosyal politika hakkında ders verebilecek bir konumda olduklarını düşünmeleri gülünç, ancak halk onları çok ciddiye alıyor gibi görünüyor."
 bftb_greece.92.t:0 "EEE, [ROOT.GetAdjective] İşçiler İçin Daha Yüksek Ücret Talep Ediyor"
 bftb_greece.93.a:0 "Şikâyetleri meşru."
 bftb_greece.93.b:0 "Şiddet kınanacak bir durumdur ve ayaktakımı dağıtılmalıdır."
 bftb_greece.93.desc:0 "EEE üyeleri ile kendi polis gücümüz arasında ülke genelinde kavgalar patlak verdi ve geçmişte bıraktığımızı umduğumuz bir siyasi şiddet döneminin tablosunu oluşturdu. Görünüşe göre, tüm hastaneye yatış ve tırmanan şiddet raporlarına bakılırsa, bırakmamışız. \n\nBazı bakanlar, ülkeye bu tür kabadayılığa müsamaha göstermediğimizi göstermek için bu şiddete karşı çok sert bir tavır alınmasını öneriyor, ancak diğer bakanlar faşistlerle dişe diş mücadele etmenin bizim kazanabileceğimiz bir savaş olmadığı konusunda uyarıyor. Halk öfkeli ve hoşnutsuz, ama bu onlara bu tür anlamsız şiddet eylemleri işleme hakkını vermemeli."
 bftb_greece.93.t:0 "EEE Üyeleri Polisimizle Sokak Çatışmasına Girdi!"
 bftb_greece.94.a:0 "Onları durdurmamalıyız."
 bftb_greece.94.b:0 "Bu anarşi bize yakışmıyor!"
 bftb_greece.94.desc:0 "Maalesef çok tanıdık bir sahnede, EEE yandaşları, içinde üretilen malları yoksullara ve haklarından mahrum bırakılmışlara dağıtmak amacıyla yabancı sermayeli fabrikalara girdi. Georgios Kosmidis ve EEE liderliği faaliyetler hakkında hiçbir bilgileri olmadığını iddia ediyor, ancak aynı zamanda görünüşte fedakâr olan bu yağma zincirine katılan erkek ve kadınları tutkuyla savundular. \n\nBu tür davranışlara gerçekten müsamaha gösterilemez: [ENG.GetNameDef] ve [FRA.GetNameDef] gibi ülkelerden gelen yabancı iş adamlarından şimdiden şikayetler alıyoruz. Yine de, sanayiciler adına müdahale edersek yabancı finansörlerin kuklaları gibi görünürüz; alternatif olarak, bu anarşinin yayılmasına izin verirsek uluslararası topluma yetersiz bir hükümet gibi görünürüz."
 bftb_greece.94.t:0 "EEE Üyeleri Yabancı Sermayeli Fabrikayı Yağmalayıp Çalınan Malları Dağıttı!"
 bftb_greece.95.a:0 "Birleşirsek, durdurulamayız!"
 bftb_greece.95.b:0 "Kendimizi faşizmle kirletmeden kazanacağız."
 bftb_greece.95.desc:0 "Şimdiye kadar başımıza bela olan EEE, görünüşe göre ortak bir düşmana karşı hükümetle birleşmeye istekli. Georgios Kosmidis, [TUR.GetNameDef] ile bir savaşın en sesli savunucularından biriydi ve şimdi bu savaş kıyılarımıza ulaştığına göre, EEE [TUR.GetAdjective] düşmanlarımızın ordularımız önünde diz çöktüğünü görmek için parti siyasetini bir kenara bırakmaya istekli."
 bftb_greece.95.t:0 "EEE Kendini Mücadelemize Adıyor!"
 bftb_greece.96.a:0 "Ne planlıyor?"
 bftb_greece.96.desc:0 "Zengin iş adamı ve uluslararası sevilen sosyetik Aristoteles Onassis, uzun yıllardır ilk kez [ROOT.GetNameDef]'e geri döndü. Medyadan soru almadı ve gözlemcilerimizin onu bulması zor oldu, ancak raporlar Anadolu mülteci nüfusuyla iyi ilişkiler kurduğunu ve göreve gelmek için bir girişim organize ediyor olabileceğini gösteriyor."
 bftb_greece.96.t:0 "Aristoteles Onassis [ROOT.GetNameDef]'e Geri Dönüyor"
 bftb_news.1.a:0 "Zamanı gelmişti!"
 bftb_news.1.b:0 "IMRO'yu yok etme zamanı!"
 bftb_news.1.c:0 "Görünüşe göre IMRO'nun günleri sayılı..."
 bftb_news.1.desc:0 "Bugün erken saatlerde, [BUL.GetAdjective] lideri [BUL.GetLeader], İç Makedon Devrimci Örgütü'ne yönelik reddini gösteren ve faaliyetlerini kamuoyuna kınayan resmi bir bildiri yayınladı. \n[BUL.GetAdjective] İçişleri Bakanı ayrıca, hükümetin IMRO'ya karşı aktif eylemde bulunmak ve bu terör örgütünü kökünden kazımak için daha fazla kaynak ayırmasına olanak tanıyacak bir dizi olağanüstü önlem paketinin uygulanacağını duyurdu. \nBu bildiriyle, görünüşe göre [BUL.GetAdjective] hükümeti nihayet Balkanlar'daki en büyük çatışma ve gerilim kaynaklarından birine son vermeyi amaçlıyor..."
 bftb_news.1.t:0 "[BUL.GetAdjective] Hükümeti IMRO'yu Kınıyor"
 bftb_news.10.a:0 "Hayal gerçek oluyor!"
 bftb_news.10.b:0 "[THIS.GetNameDef]'in gerçekten ihtiyacı olan bu mu?"
 bftb_news.10.c:0 "Balkanların gerçekten ihtiyacı olan bu mu?"
 bftb_news.10.d:0 "Saçmalık!"
 bftb_news.10.desc:0 "Eski [BUL.GetOldNameDef] hükümeti, [BUL.GetFactionName]'i bir adım daha ileri götürmeyi amaçladıkları [BUL.GetNameDef]'in kuruluşunu ilan etti ve ittifak üyelerine tek bir merkezi hükümet altında birleşmeleri için çağrıda bulundu. \n[BUL.GetLeader]'e göre, [BUL.GetNameDef], Balkan ulusları arasında tam iş birliği arıyor, geçmişin tüm çatışmalarını geride bırakıyor ve Balkan halkları arasında birliği teşvik ediyor."
 bftb_news.10.t:0 "Balkanların Birleşmesi"
 bftb_news.11.a:0 "Bu, [GER.GetNameDef] ile ilişkimizi geliştirecek!"
 bftb_news.11.b:0 "Bu, [BUL.GetAdjective]leri bizim tarafımıza geçmeye teşvik edecek!"
 bftb_news.11.c:0 "[BUL.GetNameDef], [GER.GetFactionName]'e katılacak mı o zaman?"
 bftb_news.11.d:0 "Sadece [GER.GetLeader]'in korumasını arıyorlar!"
 bftb_news.11.desc:0 "\n[BUL.GetAdjective] hükümeti, [GER.GetNameDef] ile bağları güçlendirirken ülkeye yabancı sermaye enjeksiyonunu teşvik etme girişiminde birkaç [GER.GetAdjective] şirketiyle bir ticari anlaşma imzaladı. \nBu anlaşma uyarınca, [GER.GetAdjective] yatırımcılar [BUL.GetNameDef]'de faaliyet gösterirken önemli yasal avantajlar ve vergi indirimleri alacaklar."
 bftb_news.11.t:0 "[BUL.GetNameDefCap], [GER.GetNameDef]'e Yaklaşıyor"
 bftb_news.12.a:0 "Bu verimli bir ilişki olacak!"
 bftb_news.12.b:0 "[BUL.GetAdjective]ler henüz kendilerini [ITA.GetNameDef]'in iyi müttefikleri olarak kanıtlamadılar."
 bftb_news.12.c:0 "Bulgarlar yeni arkadaşlar edinmek için çaresiz görünüyor..."
 bftb_news.12.d:0 "Şeytanla iş yapıyorlar..."
 bftb_news.12.desc:0 "\n[GER.GetAdjective] hükümetine ulaştıktan sonra, [BUL.GetNameDef] şimdi [ITA.GetNameDef] ile ilişkileri güçlendirmeye çalışıyor. \n[BUL.GetLeader] ve [ITA.GetLeader], her iki ülkeden uzmanlar tarafından geliştirilen, silahlı kuvvetleri için modern askeri teçhizatın geliştirilmesini kolaylaştırmak için bir araştırma anlaşması imzaladılar. \nBu anlaşmayla birlikte, [BUL.GetAdjective] hükümeti, ülkedeki [ITA.GetAdjective] sermaye yatırımını teşvik etmek için yeni ekonomik düzenlemeler uyguladı."
 bftb_news.12.t:0 "[ITA.GetAdjective]-[BUL.GetAdjective] Askeri Teknoloji Değişimi"
 bftb_news.13.a:0 "Bu antlaşma [BUL.GetNameDef] için olağanüstü faydalıdır!"
 bftb_news.13.b:0 "Balkanlar'da Sovyet nüfuzu artıyor!"
 bftb_news.13.c:0 "[BUL.GetNameDef], [SOV.GetFactionName]'e katılacak mı o zaman?"
 bftb_news.13.d:0 "Sadece [SOV.GetAdjective] korumasını arıyorlar!"
 bftb_news.13.desc:0 "\n [BUL.GetAdjective] Başbakanı [BUL.GetLeader] ve [SOV.GetAdjective] lideri [SOV.GetLeader], her iki ülke arasındaki ilişkiyi güçlendirmeyi ve askeri ve ekonomik konularda iş birliğini teşvik etmeyi amaçlayan bir anlaşma imzaladılar. \nBu antlaşma ile [BUL.GetAdjective] hükümeti ayrıca [SOV.GetNameDef] ile ticareti canlandırmayı ve yeni sanayi yatırımları yapmak için [SOV.GetAdjective] sermayesini kullanmayı planlıyor."
 bftb_news.13.t:0 "[SOV.GetAdjective]-[BUL.GetAdjective] Karşılıklı Yardım Antlaşması"
 bftb_news.14.a:0 "Bu nihayet Balkanlar'a biraz istikrar getirecek!"
 bftb_news.14.b:0 "Savaştaki ilerleyişimizi durdurmak için umutsuz bir girişim!"
 bftb_news.14.desc:0 "[BUL.GetNameDef] ile Balkan komşuları arasındaki ilişkiyi yeniden kurma girişiminde bir ilk adım olarak, [BUL.GetAdjective] hükümeti [YUG.GetNameDef] ile her iki ülkenin de dostane ilişkiler geliştirmeyi ve aralarında ekonomik iş birliğini teşvik etmeyi resmi olarak taahhüt ettiği bir dostluk antlaşması imzaladı. \n[BUL.GetAdjective] hükümetinin asıl niyetlerinin komşularıyla dostane ilişkiler kurmanın ötesine geçtiğini ve asıl amacının büyük Avrupa güçleriyle yüzleşmek için bir Balkan Federasyonu kurmak olduğunu iddia edenler var. \nAma şimdilik, bu ifadeler sadece spekülasyondan ibaret..."
 bftb_news.14.t:0 "Balkanlar'da Bir Ebedi Dostluk Antlaşması"
 bftb_news.15.desc:0 "[BUL.GetAdjective] Başbakanı [BUL.GetLeader], [GRE.GetAdjective] başkentinde [GRE.GetLeader] ile bir araya gelerek, her iki ülkenin hükümetlerinin [BUL.GetNameDef] ile [GRE.GetNameDef] arasında dostane ilişkiler sürdürmeyi ve ekonomik iş birliğini teşvik etmeyi resmi olarak taahhüt ettiği bir antlaşmanın imzalanmasını görüştü. \n[BUL.GetLeader]'e göre, bu, [BUL.GetNameDef] ile komşuları arasındaki ilişkiyi yeniden kurma girişiminde sadece ilk adım ve yakın gelecekte çok verimli olabilecek bir çaba."
 bftb_news.15.t:0 "Selanik Anlaşması"
 bftb_news.16.a:0 "Bu, [ENG.GetNameDef] ile ilişkimizi geliştirecek!"
 bftb_news.16.b:0 "Bu, [BUL.GetAdjective]leri bizim tarafımıza geçmeye teşvik edecek!"
 bftb_news.16.c:0 "[BUL.GetNameDef], [ENG.GetFactionName]'e katılacak mı o zaman?"
 bftb_news.16.d:0 "Sadece [ENG.GetLeader]'in korumasını arıyorlar!"
 bftb_news.16.desc:0 "\n[BUL.GetNameDef]'in bağımsızlığını ve toprak bütünlüğünü garanti edebilecek büyük bir gücün desteğini arayan [BUL.GetAdjective] hükümeti, [ENG.GetAdjective] hükümetiyle bir antlaşma müzakere etmek için [ENG.GetNameDef]'e bir diplomatik heyet gönderdi. \nAskeri meselelerle ilgili maddelere ek olarak, bu antlaşma aynı zamanda [BUL.GetNameDef]'de faaliyet gösterirken [ENG.GetAdjective] kapitalistlere önemli vergi avantajları sağlayan bir ekonomik anlaşmayı da içeriyor."
 bftb_news.16.t:0 "[BUL.GetNameDefCap], [ENG.GetNameDef]'e Yaklaşıyor"
 bftb_news.2.a:0 "Bulgarlar ateşle oynuyor!"
 bftb_news.2.b:0 "Bulgaristan için en iyisini yapıyoruz."
 bftb_news.2.c:0 "Görünüşe göre Balkan çatışması yeniden alevlenecek..."
 bftb_news.2.desc:0 "Bugün erken saatlerde, [BUL.GetAdjective] lideri [BUL.GetLeader], hükümetin İç Makedon Devrimci Örgütü'nün en önemli şeflerinden biri olan Ivan Mihaylov ile IMRO ile [BUL.GetAdjective] yetkilileri arasındaki düşmanlıkların sona ermesini müzakere etmeye çalışacağını kamuoyuna duyurdu. İçişleri bakanına göre, [BUL.GetNameDef]'in [YUG.GetNameDef] ve [GRE.GetNameDef]'de yaşayan birçok [BUL.GetNameDef] Makedon'u kurtarmak için bu örgütle iş birliği yapması gerekiyor; bu, şüphesiz Balkan çatışmasını yeniden alevlendirecek ve bölgede çıkarları olan büyük güçler arasındaki gerilimi artıracak cesur bir açıklama..."
 bftb_news.2.t:0 "[BUL.GetAdjective] Hükümeti IMRO'yu Destekliyor"
 bftb_news.201.a:0 "Öyle olsun."
 bftb_news.201.b:0 "Barış için harika bir gün."
 bftb_news.201.c:0 "Büyük Savaş'ın bir antlaşması daha bozuldu."
 bftb_news.201.d:0 "[TUR.GetNameDef] için iyi oldu."
 bftb_news.201.desc:0 "[TUR.GetNameDefCap] ve [SOV.GetNameDef], yeni doğan Türkiye Cumhuriyeti'nin [TUR.GetAdjective] Kurtuluş Savaşı'nda İtilaf Devletleri'ni püskürtmesinden sonra imzalanan ve uygulanan Lozan Antlaşması'nı revize etme konusunda bir anlaşmaya vardılar. Antlaşma uzun zamandır [TUR.GetAdjective] egemenliğine bir saldırı olarak kınanıyordu, ancak bugün antlaşma nihayet yeni yasalaşan Montrö Sözleşmesi lehine değiştirildi. \n\n[TUR.GetNameDefCap] artık Türk Boğazları'ndan giren ve çıkan trafik üzerinde tam kontrole sahip ve boğazlar çevresindeki eyaletler şimdi [TUR.GetNameDef] tarafından yeniden askerileştirildi. Sürecin bir parçası olan [ENG.GetAdjective] gözlemciler, bölgedeki çatışmanın önlenmesinden sadece memnunlar."
 bftb_news.201.t:0 "[TUR.GetNameDefCap] Türk Boğazlarını Yeniden Askerileştiriyor"
 bftb_news.202.a:0 "Gücümüzden korkmakta haklıydılar."
 bftb_news.202.b:0 "Başka ne yapabilirdik ki?"
 bftb_news.202.c:0 "Daha fazlasını yapabilir miydik?"
 bftb_news.202.d:0 "En azından savaş önlendi..."
 bftb_news.202.desc:0 "[TUR.GetNameDefCap] ve [SOV.GetNameDef], yeni doğan Türkiye Cumhuriyeti'nin [TUR.GetAdjective] Kurtuluş Savaşı'nda İtilaf Devletleri'ni püskürtmesinden sonra uygulanan Lozan Antlaşması'nı revize etme konusunda bir anlaşmaya varamadılar. Lozan Antlaşması, Türk Boğazları'nı askerden arındırmış ve hem Çanakkale hem de İstanbul boğazlarını sınırsız sivil ve askeri trafiğe açmıştı ve görünüşe göre bu, öngörülebilir gelecekte statüko olmaya devam edecek. \n\n[TUR.GetLeader], kararı ulusa yayınlanan bir konuşmada kınayarak [TUR.GetNameDef]'in inatçı emperyalizmin hedefi olmaya devam ettiğini söyledi. Sürecin bir parçası olan [ENG.GetAdjective] gözlemciler, bölgedeki çatışmanın önlenmesinden sadece memnunlar."
 bftb_news.202.e:0 "[TUR.GetNameDef]'den bir zayıflık işareti..."
 bftb_news.202.t:0 "Türk Boğazları Askerden Arındırılmış Olarak Kalıyor"
 bftb_news.203.a:0 "Uraaaa!"
 bftb_news.203.b:0 "Hodri meydan!"
 bftb_news.203.c:0 "Vay canına, ne felaket..."
 bftb_news.203.d:0 "Eski usul diplomasiye ne oldu!?"
 bftb_news.203.desc:0 "Onlarca yıllık bir antlaşmanın zararsız bir şekilde yeniden müzakere edilmesi gereken şey, bunun yerine [SOV.GetNameDef] ile [TUR.GetNameDef] arasında Türk Boğazları'na izinler konusunda topyekûn bir savaşa dönüştü. \n\n[TUR.GetLeader], müzakerelerin çökmesini ve savaşın patlak vermesini ‘talihsiz’ ve ‘tamamen önlenebilir’ bir şey olarak nitelendirdi. [SOV.GetLeader] ise, [SOV.GetNameDef]'in yenilmez ordularının, Büyük Savaş'ın eski antlaşmalarının uygulanmaya devam etmesini sağlamak için kesinlikle hiçbir şeyden vazgeçmeyeceğini söyledi. [SOV.GetLeader] ayrıca [TUR.GetAdjective] işçilerinin kurtuluşunun yakın olduğunu ve mevcut [TUR.GetAdjective] rejiminin yok edilmesinin uluslararası komünist dava için büyük bir zafer olacağını vaat etti."
 bftb_news.203.e:0 "Hmm, [TUR.GetAdjective] savaş çabalarına yardım etmeyi düşünmeliyiz..."
 bftb_news.203.f:0 "Korkunç."
 bftb_news.203.t:0 "[TUR.GetAdjective]-[SOV.GetAdjective] Savaşı"
 bftb_news.204.a:0 "Galip gelmeliyiz!"
 bftb_news.204.b:0 "Ne kadar kötü bir haber..."
 bftb_news.204.c:0 "Burada bir fırsat var..."
 bftb_news.204.d:0 "Hey, bu konuda bir iki şey biliyoruz!"
 bftb_news.204.desc:0 "[TUR.GetNameDef]'de iktidardaki muhafazakar hükümet ile eskiden iktidarda olan Kemalistler arasında bir iç savaş çıktı. Osmanlı İmparatorluğu'nun çöküşünden sonra [TUR.GetNameDef]'in bağımsızlığını savaşarak kazanan ve güvence altına alan Kemalistler, mevcut hükümetin anayasayı sayısız bariz ihlalini, rejimlerini devirmek için yeterli bir neden olarak gösterdiler. Ünlü general ve sadık Kemalist Kâzım Orbay, [TUR.GetLeader]'in mevcut İslamcı hükümetini devirmeyi planlayan bir askeri cuntaya liderlik etmek üzere seçildi. \n\n[TUR.GetLeader], Kemalistlerin hareketini gerçekten işleyen bir demokratik ülkeye yakışmayan bir hareket olarak kınadı ve parçalanmış ulusuna hukukun üstünlüğünü geri getirme sözü verdi."
 bftb_news.204.t:0 "[TUR.GetNameDef]'de İç Savaş!"
 bftb_news.205.a:0 "Elhamdülillah!"
 bftb_news.205.b:0 "Olamaz, yine mi!"
 bftb_news.205.c:0 "Bu nasıl oldu!?"
 bftb_news.205.d:0 "Hım, ilginç..."
 bftb_news.205.desc:0 "Tüm dünyanın hayal kırıklığına rağmen, ülkenin muhafazakarları ile laik Kemalistleri arasında özellikle acımasız bir iç savaştan sonra Osmanlı Sultanı tahtına geri getirildi. Orta Çağ'dan fırlamış gibi görünen abartılı bir törenle, Sultan eski konumuna geri getirildi ve Mustafa Kemal Atatürk'ün cumhuriyeti sonsuza dek feshedildi. \n\n[TUR.GetLeader], yeni yeniden doğan saltanatına hitap ederek, eski makamına geri getirilmesi gerçeği karşısında şaşkınlık ve tevazu karışımı bir ifade sergiledi. Yeni Sultan yumuşak huylu bir adam, ancak savaş çığırtkanları ve irredentistlerden oluşan bir sarayla çevrili. Sultan'ın dönüşünün mümkün olduğuna bile inanmayan uzmanlar, geleceğin ne getirebileceği konusunda hiçbir fikre sahip değiller."
 bftb_news.205.e:0 "Tuhaf."
 bftb_news.205.t:0 "Osmanlı Saltanatı Yeniden Doğuyor"
 bftb_news.206.a:0 "Yaşasın!"
 bftb_news.206.b:0 "Ne aptallar ama!"
 bftb_news.206.c:0 "Zayıflar! (Schwächlinge!)"
 bftb_news.206.d:0 "Mücadeleye bir rakip daha katılıyor."
 bftb_news.206.desc:0 "[ITA.GetLeader] ve [TUR.GetLeader], Akdeniz'de ‘[TUR.GetFactionName]’ olarak bilinen yeni bir ittifak bloğunun kurulduğunu duyurdular. [ITA.GetLeader], paktlarının Avrupa kıtasının önde gelen liderleri olarak tüm Avrupa işlerine hakim olacağına söz verirken, [TUR.GetLeader] daha ölçülü terimlerle konuşarak ittifakın tamamen Balkanlar'da ve Akdeniz ulusları için güvenliği artırmak üzere tasarlanmış stratejik bir ittifak olduğunu diplomatlara temin etti. \n\n[ENG.GetAdjective] yetkilileri yeni bölgesel gücü ‘yardımcı olmayan ve hoş karşılanmayan’ olarak nitelendirirken, [GER.GetAdjective] gözlemciler, ittifakın on yılın sonunda tarihte bir dipnottan biraz daha fazlası olacağını tahmin ederek kesinlikle daha kesin terimlerle konuştular."
 bftb_news.206.e:0 "Bu Avrupa için ne anlama geliyor?"
 bftb_news.206.t:0 "Akdeniz Paktı'nın Şafağı"
 bftb_news.207.a:0 "Kaderimiz bizi bekliyor."
 bftb_news.207.b:0 "Çok şükür."
 bftb_news.207.c:0 "Bu sorunlu olacak."
 bftb_news.207.d:0 "Hmm."
 bftb_news.207.desc:0 "[TUR.GetLeader] bugün, [TUR.GetNameDef]'nin Balkan merkezli dış politikasını buradaki tüm işbirlikçi ulusların bağımsızlığını garanti altına alarak genişletmeyi hedefleyeceğini açıklayarak dünyaya seslendi. Uluslararası gözlemcilere göre [TUR.GetNonIdeologyName], bölgesel güvenliğe odaklanabilmek için büyük güçlerle olan ilişkileri en aza indirmeyi tercih etme konusunda daha kararlı bir duruş sergilemiş gibi görünüyor. \nA[TUR.GetAdjective] kararı bazıları tarafından övülse de, diğerleri için ciddi bir şaşkınlık kaynağıdır. Özellikle [ITA.GetAdjective] yetkilileri, bölgede çatışma çıkma olasılığını en aza indirmek istiyorlarsa [TUR.GetAdjective] hükümetine tutumlarından vazgeçmesi için yalvararak biraz alarma geçti. [TUR.GetAdjective] hükümeti yanıt olarak [ITA.GetNameDef]'yi 'bölgesel düşman' olarak etiketledi."
 bftb_news.207.t:0 "[TUR.GetNonIdeologyName] Balkan Güvenliğine Kararlı"
 bftb_news.208.a:0 "[TUR.GetAdjective] planlarıyla kendimizi meşgul edemeyiz."
 bftb_news.208.b:0 "Bir ambargo yeterli görünüyor."
 bftb_news.208.c:0 "Savaş çığırtkanları!"
 bftb_news.208.d:0 "Sadece hakkımız olanı istiyoruz."
 bftb_news.208.desc:0 "[TUR.GetNameDefCap], ulusal sınırlarını [TUR.GetNameDef]'in Misak-ı Milli'yi onaylamasından önceki haline getirme niyetini açıkladı. [TUR.GetAdjective] hükümeti, neredeyse tüm komşu devletleri üzerinde hak iddia etti ve asılsız iddialarını geri çekme çağrılarını reddetti. \n\nUluslararası toplum, kararından dolayı [TUR.GetAdjective] yönetimini geniş çapta kınadı ve [TUR.GetAdjective] liderliğinin pervasız eylemlerinin sadece son birkaç yıldır dünyayı kasıp vuran küresel çalkantıyı daha da alevlendirebileceğine dair genel bir küresel endişe var. [TUR.GetNameDefCap] rövanşizm yoluna bağlı görünüyor, ancak yönetimlerinin sonucunun ne olacağını sadece zaman gösterecek."
 bftb_news.208.e:0 "Sadece işleri daha da kötüleştiriyorlar!"
 bftb_news.208.t:0 "[TUR.GetNameDefCap] 1920 Sınırlarının Geri Dönüşünü Talep Ediyor"
 bftb_news.209.a:0 "Durdurulamazız."
 bftb_news.209.b:0 "Nasıl...?"
 bftb_news.209.desc:0 "[FROM.GetAdjective] fetihleri, [FROM.GetAdjective] hükümetinin kendilerini [FROM.GetNameDef] olarak ilan etmenin haklı olduğunu düşündüğü noktaya kadar ilerledi. Bu yeni imparatorluğun ortaya çıkışı dünya çapında şok yarattı; çünkü bırakın kıtalara yayılan tamamen yeni bir imparatorluk kurmak şöyle dursun, Türkiye'nin önümüzdeki yıllarda Kurtuluş Savaşı'ndan tamamen kurtulabileceğine bile inanan çok az gözlemci vardı. \n\nRaporlara inanılacak olursa, yeni oluşturulan [FROM.GetAdjective]'nin hızlı genişlemesi hala tamamlanmayabilir; [FROM.GetLeader], dünyadaki her Türk özgürlüğüne kavuşuncaya kadar fetihlerine asla son vermeyeceğini belirtiyor. Dünya ancak nefesini tutarak izlemeye devam edebilir."
 bftb_news.209.t:0 "Turan'ın Doğuşu"
 bftb_news.3.a:0 "Şimdi huzur içinde yatıyor... Ülkesinin aksine!"
 bftb_news.3.desc:0 "[GetBorisDeathContext]\n[GetSuspicionsAboutBorisDeath]"
 bftb_news.3.t:0 "Bulgaristan Çarı III. Boris'in Vefatı"
 bftb_news.301.a:0 "Kral'ın etrafında toplanın!"
 bftb_news.301.b:0 "Kralcı bir hükümet bize iyi hizmet edebilir..."
 bftb_news.301.c:0 "Güzel, güzel - birbirinizi parçalayın!"
 bftb_news.301.d:0 "Yunanistan hiç rahat bir nefes almayacak mı?"
 bftb_news.301.desc:0 "[GRE.GetNameDef]'de Helen Parlamentosu'nu fesheden krala sadık güçler ile [GRE.GetNameDef]'in demokratik ilkelerine sadık cumhuriyetçi ve komünist güçler arasında bir iç savaş çıktı. Cumhuriyetçiler ile komünistler arasında büyük bir düşmanlık olmasına rağmen, tüm [GRE.GetAdjective] ulusu üzerine kendini zorba bir despot olarak dayatan sevilmeyen bir yabancı kralı tahttan indirmek için bir araya geldiler. \n\n[GRE.GetLeader], ne kendisinin ne de kendisine sadık monarşist güçlerin, tüm monarşi karşıtı güçler ulustan sürülene kadar savaşlarını durdurmayacaklarına söz verdi."
 bftb_news.301.t:0 "[GRE.GetAdjective] İç Savaşı!"
 bftb_news.302.a:0 "Hayalimiz nihayet gerçekleşti!"
 bftb_news.302.b:0 "Genellikle bu tür davranışları onaylamayız, ammmaaa..."
 bftb_news.302.c:0 "Onlara hiçbir faydası olmayacak!"
 bftb_news.302.d:0 "Vay canına."
 bftb_news.302.desc:0 "Avrupa'nın dört bir yanından çok sayıda katılımcının olduğu gizli Kandiye Konvansiyonu'nun ne hakkında olduğunu merak eden dünya çapındaki gözlemcilerin artık merak etmesine gerek yok, çünkü bugün [GRE.GetLeader], [GRE.GetAdjective]'in Büyük Yunanistan hayalinin nihayet gerçekleştiğini ilan etti. \n\nUzmanlar, siyasi kargaşayı ve derinlere kök salmış ekonomik sıkıntıları bir [GRE.GetAdjective] ayaklanmasının pek olası görünmemesinin nedenleri olarak göstererek [GRE.GetNameDef]'in hızlı genişlemesi karşısında şaşkınlıklarını dile getirdiler, ancak son olaylar hepsini haksız çıkardı."
 bftb_news.302.t:0 "Büyük Yunanistan'ın Kuruluşu"
 bftb_news.4.a:0 "O, [BUL.GetNameDef]'in ihtiyaç duyduğu hükümdar!"
 bftb_news.4.b:0 "O bunak ihtiyar yönetebilir mi ki?"
 bftb_news.4.c:0 "Beklenmedik bir gelişme..."
 bftb_news.4.desc:0 "Bulgaristan Çarı III. Boris'in ölümünün ardından, Bulgar hükümeti Boris'in babası ve eski Çar I. Ferdinand ile görüşerek ondan tekrar ülkenin komutasını almasını istemek gibi beklenmedik bir karar verdi. \n[GetFormerLeaderBeforeFerdinand] ile uzun bir konferansın ardından, İkinci Balkan Savaşı ve Büyük Savaş'taki feci yenilgilerden sonra oğlu lehine tahttan çekilmek zorunda kalan savaş çığırtkanı hükümdar I. Ferdinand, bir kez daha Bulgaristan Çarı olarak taç giymek için Sofya'ya dönmeyi kabul etti."
 bftb_news.4.t:0 "Çar I. Ferdinand'ın Dönüşü"
 bftb_news.5.a:0 "Bu topraklar üzerindeki [BUL.GetAdjective] egemenliği artık tartışılamaz!"
 bftb_news.5.b:0 "[THIS.GetAdjective] kültürünü yok etmeye nasıl cüret ederler?!"
 bftb_news.5.c:0 "Bulgarlardan cesur bir hamle..."
 bftb_news.5.desc:0 "[BUL.GetAdjective] hükümeti, Balkanlar'daki işgal altındaki topraklarda büyük bir yeniden entegrasyon kampanyası başlattı; Bulgar yerleşimini teşvik ediyor, kasaba ve yer adlarını Bulgar geleneksel formlarına değiştiriyor ve yerel yönetimi Bulgar hatlarına göre yeniden düzenliyor. \nBu önlemlerle, [BUL.GetLeader], bu bölgelerin Bulgar niteliğini göstermeyi ve gelecekte [BUL.GetNameDef] tarafından ilhak edilmelerini meşrulaştırmayı umuyor."
 bftb_news.5.t:0 "Balkanlar'da Bulgar Yeniden Entegrasyon Kampanyası"
 bftb_news.6.a:0 "Bu başarı tüm Bulgarlara sevinç getiriyor!"
 bftb_news.6.b:0 "İlginç bir gelişme..."
 bftb_news.6.desc:0 "Hükümetin desteğiyle, Bulgaristan Eksarhlığı, Konstantinopolis Patriği'ne Bulgar Ortodoks Kilisesi'nin otosefalliğini tanıması için baskı yaptı. \nTehditkar bir [BUL.GetLeader] tarafından desteklenen bu tür talepler karşısında, Konstantinopolis Ekümenik Patrikhanesi, Kutsal Sinod'un Bulgar Kilisesi'nin başkanını seçebileceği ve böylece yedi yüzyıldan fazla bir süre sonra Bulgar Patrikhanesi'ni restore edebileceği yeni bir Tüzük kabul etmesine izin vermek zorunda kaldı."
 bftb_news.6.t:0 "Bulgar Patrikhanesi'nin Restorasyonu"
 bftb_news.7.a:0 "Bu Bulgar ulusunu güçlendiriyor!"
 bftb_news.7.b:0 "Görünüşe göre [BUL.GetLeader]'in büyüklük sanrıları var..."
 bftb_news.7.c:0 "Bu gerçekten gerekli miydi?"
 bftb_news.7.desc:0 "Dün Sofya'da Bulgar hükümeti tarafından düzenlenen büyük bir siyasi miting gerçekleşti. \nEtkinlik sırasında ve izleyicilerin büyük çoğunluğunun şaşkınlığı içinde, [BUL.GetLeader] Üçüncü Bulgar İmparatorluğu'nun kuruluşunu ilan etti ve büyük Bulgar ulusu için yeni bir dönemin başlangıcını duyurdu. \nBu konuşmayı, [BUL.GetLeader]'in Bulgaristan İmparatoru olarak taç giydiği ve siyasi ve askeri liderlerin imparatorluğa ve hükümdarına bağlılık yemini ettiği görkemli ama ağırbaşlı bir tören izledi."
 bftb_news.7.t:0 "Üçüncü Bulgar İmparatorluğu"
 bftb_news.8.a:0 "Bulgar halkı için büyük bir zafer!"
 bftb_news.8.b:0 "Endişe verici..."
 bftb_news.8.desc:0 "Vatan Cephesi, [FROM.GetLeader]'in otoriter rejimine kökten karşı çıkan, çok sayıda siyasi gruptan üyelerden oluşan ancak komünistlerden büyük ölçüde etkilenen ve Bulgaristan'da dayatılan diktatörlük sistemiyle yüzleşmek için kurulan bir anti-faşist Bulgar siyasi örgütüdür. \nBu örgüt tarafından düzenlenen bir ayaklanmanın ardından, Bulgar hükümetine sadık birlikler ile Vatan Cephesi destekçileri arasında şiddetli bir iç savaş çıktı. \nSonunda, savaş sona erdi ve komünistler [FROM.GetLeader]'in rejimini devirip Bulgaristan Halk Cumhuriyeti'ni ilan ettiler."
 bftb_news.8.t:0 "Vatan Cephesi Bulgaristan'ı Ele Geçiriyor"
 bftb_news.9.a:0 "Bu, ilerlemeye giden yoldur!"
 bftb_news.9.b:0 "İlginç..."
 bftb_news.9.c:0 "Balkanları birleştirmeye yönelik başarısızlıkla sonuçlanacak bir başka girişim..."
 bftb_news.9.desc:0 "[BUL.GetNameDefCap], 1920'lerde önerilen ve o zamanlar pek başarılı olmayan projenin gözden geçirilmiş bir versiyonu olan [BUL.GetFactionName]'i kurdu. \nBulgaristan Başbakanı [BUL.GetLeader]'e göre, [BUL.GetAdjective] hükümeti, bölgeyi toprak emelleriyle tehdit eden istilacı yabancı uluslarla yüzleşmek için Balkanlar'da birleşik bir cephe oluşturmayı hedefliyor. \nBu yeni projenin başarılı olup olmayacağı henüz görülecek, ancak kesinlikle Balkan federasyonuna destek komşu ulusların nüfusu arasında önemli ölçüde artıyor."
 bftb_news.9.t:0 "Balkan Sosyalist Cumhuriyetler Federasyonu"
 bftb_turkey.1.a:0 "Bu konuda Türkleri destekleyeceğiz."
 bftb_turkey.1.b:0 "Britanya İmparatorluğu Türkiye ile ilgilenmiyor."
 bftb_turkey.1.desc:0 "Cumhurbaşkanı [TUR.GetLeader], [TUR.GetNameDef]'nin Türk Boğazlarını yeniden askerileştirmeye hazırlandığını bize bildirdi. [TUR.GetAdjective] hükümeti, karasuları üzerindeki iddialarını desteklememizi ve Lozan Antlaşması'nı bu iddiaları sürdürme meşruiyetini onlara verecek şekilde değiştirmemizi istiyor. \n\nTürk Boğazları üzerindeki [TUR.GetAdjective] iddialarını desteklemek kesinlikle onları bize yakınlaştıracak ve [TUR.GetNameDef]'nin Akdeniz'de [ITA.GetNameDef]'ya meydan okuma olasılığını açabilir. Ancak, bu krize bulaşmak bizi [SOV.GetNameDef] ile karşı karşıya getirebilir, ki bu da en kötü senaryoda savaş anlamına gelebilir."
 bftb_turkey.1.t:0 "Montrö Boğazlar Sözleşmesi"
 bftb_turkey.10.a:0 "Türk Boğazları topyekûn bir savaşa değmez."
 bftb_turkey.10.b:0 "[TUR.GetNameDefCap] dizlerinin üzerinde bize teslim olacak!"
 bftb_turkey.10.desc:0 "Ezici bir güç karşısında bile, [TUR.GetLeader] Türk Boğazları üzerindeki [TUR.GetAdjective] hakları konusunda geri adım atmayı reddediyor. Gerilim, [TUR.GetAdjective]-[SOV.GetAdjective] sınırı boyunca askerlerin toplanmasıyla dramatik bir şekilde arttı. [TUR.GetLeader], krizi '[TUR.GetNameDef] için bir kader anı' olarak adlandırdı ve [TUR.GetNameDef]'nin [SOV.GetAdjective] tiranlığı karşısında asla teslim olmayacağına söz verdi."
 bftb_turkey.10.t:0 "[TUR.GetAdjective]ler Meydan Okumaya Devam Ediyor"
 bftb_turkey.100.a:0 "Büyük Savaş'ın intikamı belki de alınır..."
 bftb_turkey.100.desc:0 "Vicdansız [FROM.GetAdjective] devletini yola getirerek ve onları kendi değerlerimizle aynı hizaya sokarak eski ihtişamımızı geri kazanmaya bir adım daha yaklaştık. Büyük zaferimizin tanınmasıyla ülke çapında kutlamalar yapıldı."
 bftb_turkey.100.t:0 "[FROM.GetNameDefCap] Gücümüzün Önünde Diz Çöküyor!"
 bftb_turkey.101.a:0 "Allah kılıcımıza yol gösterir."
 bftb_turkey.101.desc:0 "Hain [FROM.GetAdjective] ulusu, her şeye gücü yeten ve bilge Sultanımıza diz çökmeyi reddettiler ve bunun yerine savaş yolunu seçtiler. Eğer [FROM.GetAdjective] ulusunun istediği bir savaşsa, o zaman istedikleri savaşı alacaklar! Bir daha asla 1913'ün tekrarı olmayacak!"
 bftb_turkey.101.t:0 "[FROM.GetNameDefCap] Meydan Okumaya Devam Ediyor"
 bftb_turkey.102.a:0 "Savaşmaya değmez."
 bftb_turkey.102.b:0 "Osmanlı hegemonyasını kalıcı olarak ortadan kaldırmanın zamanı çoktan geçti."
 bftb_turkey.102.desc:0 "[FROM.GetNameDef] ulusunu yöneten o buyurgan haydutlar, savaş tehdidi altında Suriye topraklarını derhal onlara teslim etmemizi talep ettiler. [FROM.GetAdjective] akbabalarının bu kararı karşısında şaşırdığımız söylenemez, ama bu durumumuzu daha az tehlikeli kılmıyor. \n\nSavaştan kaçınma umuduyla topraklarımızı [FROM.GetAdjective] ulusuna teslim etmeye hazır olup olmadığımıza veya [FROM.GetNameDef] ulusunu kalmaları gereken tarihin tozlu sayfalarına kalıcı olarak geri göndermeye istekli olup olmadığımıza karar vermeliyiz. "
 bftb_turkey.102.t:0 "Şam Diktası"
 bftb_turkey.103.a:0 "Küstahlıkları palalarımızla karşılık bulacak."
 bftb_turkey.103.desc:0 "[FROM.GetNameDef] ulusundaki aptallar, eski toprağımızın hak sahibine geri verilmesi yönündeki son derece makul talebimizi reddetti. Bu bize tek bir eylem planı bırakıyor: savaş!"
 bftb_turkey.103.t:0 "[FROM.GetNameDefCap] Bizi Reddediyor!"
 bftb_turkey.104.a:0 "Şam ve Halep Eyaletlerini birleştireceğiz!"
 bftb_turkey.104.b:0 "İmparatorluğa tekrar hoş geldiniz!"
 bftb_turkey.104.desc:0 "[FROM.GetNameDef] ulusunun zayıfları, Suriye'yi şiddete gerek kalmadan bize geri verme kararlarında alışılmadık bir bilgelik gösterdiler. Toprağı imparatorluk kararımıza geri entegre etmek için şimdiden çok çalışıyoruz ve bir yol ayrımına geldik. \n\nGarip bir şekilde, Levant'ta büyük ölçüde emperyalistler ve bulunma hakkımız olmayan topraklarda haksız yere hüküm süren yabancılar olarak hatırlanıyoruz. Bu, elbette, tamamen zırvalık - ama bu yanlış kanı bugüne kadar devam ediyor. Durum gerektirirse daha sonraki bir tarihte entegre edebileceğimiz özerk bir imparatorluk bağlı devleti kurmaktan daha uzun vadeli kazanç sağlayabiliriz. Diğer yandan, toprağı doğrudan Saltanatımıza geri ilhak da edebiliriz - sonuçta bu bizim ilahi hakkımız."
 bftb_turkey.104.t:0 "Topraklarımız Bizimdir!"
 bftb_turkey.11.a:0 "Dünya [SOV.GetNameDef]'nin gücünden korkmalı."
 bftb_turkey.11.desc:0 "[TUR.GetLeader], Moskova'da sıcak bir şekilde karşılandı ve burada silahlı muhafızlar altındayken, Türk Boğazları'nı askerileştirme veya denetleme konusundaki tüm [TUR.GetAdjective] haklarını fiilen teslim eden yepyeni bir antlaşma imzalamaya zorlandı. [TUR.GetAdjective] Cumhurbaşkanı, [SOV.GetNameDef] ziyaretinin bir hatırası olarak [SOV.GetLeader]'e ait bir pipoyla evine gönderildi. \n\nKendi sularımızdaki gücümüzü başarılı bir şekilde ortaya koymamız bizim için büyük bir zaferdir ve [TUR.GetAdjective] sınırındaki kuvvetlerimize, mümkün olduğunca gürültülü olmaları gereken üç günlük zorunlu bir kutlama süresi verildi."
 bftb_turkey.11.t:0 "[TUR.GetNameDefCap] Taleplerimize Teslim Oluyor"
 bftb_turkey.110.a:0 "Tek ve bölünmez bir cumhuriyet."
 bftb_turkey.110.desc:0 "Silahlı kuvvetlerimiz, [TUR_kurdish_state_event_target.GetName] eyaletindeki ayrılıkçılarla uzun süren bir çatışmanın ardından galip geldi. Bölgede bir dizi tutuklama yapıldı ve ordumuz bölgede düzeni yeniden sağlamak için çok çalıştı. \n\nHer iki taraftaki kayıplar üzücü, ancak ulusumuzun birliğini korumak için hiçbir fedakarlığın çok büyük olmadığına dair genel bir anlayış var. Olayla ilgili konuşan hükümet, şehitleri onurlandırmak için ülke çapında bir günlük yas ilan edilmesi çağrısında bulundu."
 bftb_turkey.110.t:0 "[TUR_kurdish_state_event_target.GetName] Eyaletindeki İsyancılar Başarıyla Püskürtüldü"
 bftb_turkey.111.a:0 "Bizden son gördükleri bu olmayacak."
 bftb_turkey.111.desc:0 "[TUR_kurdish_state_event_target.GetName] eyaletinde, silahlı kuvvetlerimizin bölgede aktif olan ayrılıkçı isyancılara karşı yorucu bir çatışmanın ardından bölgeden çekilmesiyle korkunç bir felaket yaşandı. \n\nHükümet yöneticileri ve üst komuta gözlemcileri, bu sürpriz gelişme karşısında hem şok oldular hem de dehşete düştüler ve bölgeyi saran isyancı güçlere karşı ezici bir misilleme çağrısında bulundular. [ROOT.GetLeader] olayı kamuoyuna açıklamadı, ancak özel olarak askeri yetkilileri savaştaki kayıplarımızın intikamını almak için bir karşı operasyon hazırlamaya teşvik etti."
 bftb_turkey.111.t:0 "İsyancılar [TUR_kurdish_state_event_target.GetName] Eyaletinde Kuvvetlerimizi Yendi"
 bftb_turkey.113.a:0 "Pekala, geleneklerine saygı göstergesi olarak teslim olacağız."
 bftb_turkey.113.b:0 "İlerlememiz durdurulamaz."
 bftb_turkey.113.desc:0 "Serbest piyasayı tatmin etmek her zaman Kemalist politikanın temel taşı olmuştur: talep olan yerde, birinin arz sağlamasını bekleriz. Nüfusun belirli kesimleri - özellikle dini eğilimli olanlar - [ROOT.GetNameDef] ulusunun makul ölçüde yeni tüketimci kültüründen pek de rahat değiller. \n\nToplumumuzun üyelerinin dinleri tarafından yasaklandığını düşündüğü bazı ürünlerin üretimine karşı ülkenin bazı bölgelerinde protestolar patlak verdi. Laik bir [FROM.GetName] hayallerimize asla saygı duymadılar ve açıkçası hala bu kavrama uyum sağlamakta zorlanıyorlar. Yine de, kalabalıkları yatıştırmak, kendi halkımız arasında gereksiz yere çatışma çıkarmaktan daha kolay bir eylem yolu olabilir."
 bftb_turkey.113.t:0 "Aşırı Muhafazakarlar Dinen Yasaklanmış Malların Üretimini Protesto Ediyor"
 bftb_turkey.114.a:0 "Bazı hafif tavizler sunulabilir."
 bftb_turkey.114.b:0 "O değişmez haşereleri dağıtın."
 bftb_turkey.114.desc:0 "Yeni bir gün, ülkemizin dindarlarından kaynaklanan yeni bir protesto. En son protestolar, [TUR_fundamentalist_state.GetName] eyaletinde, karışmaya hakları olmayan meselelere karışan baskıcı bir hükümet olarak gördükleri şeye karşı ortaya çıktı. Bütün olay saçma; biz hükümetiz, vatandaşlarımızın işlerine karışmak bizim işimiz. \n\nProtestolar barışçıl geçti ve onların kışkırtmalarına güçle yanıt vermek zorunda değiliz. Aslında, hükümet danışmanları [TUR_fundamentalist_state.GetName] eyaletindeki kitleleri yatıştırmak için yapılabilecek anlamsız tavizlerin bir listesini hazırladılar. Gerçi, [TUR_fundamentalist_state.GetName] eyaletindeki aşırı muhafazakarlara boyun eğersek, ülkenin geri kalanındaki aşırı muhafazakarlar da aynı şeyi yapabileceklerini düşünebilirler. Belki de temel değerlerimize olan bağlılığımızın bir göstergesi olarak orduyu göndermek daha iyi olur."
 bftb_turkey.114.t:0 "Aşırı Muhafazakarlar Hükümet Politikasını Barışçıl Bir Şekilde Protesto Ediyor"
 bftb_turkey.115.a:0 "Bu gerekli bir fedakarlıktır."
 bftb_turkey.115.b:0 "Bırakın da subaylarımıza bu 'talepler' hakkında ne düşündüklerini sorsunlar."
 bftb_turkey.115.desc:0 "[TUR_fundamentalist_state.GetName] eyaletindeki aşırı muhafazakarlar ile hükümet yetkilileri arasındaki gerilim, aşırı muhafazakarların bölgesel yetki ve kendi yasalarıyla yönetme gücü talep etmesiyle nihayet doruğa ulaştı. Bu, çoğunlukla barışçıl protestolar ve dişsiz söylemlerden oluşan bir çatışmadan gelen muazzam bir tırmanıştır. \n\n[TUR_fundamentalist_state.GetName] eyaletindeki durumun giderek kontrolümüzden çıktığı doğrudur. Düşünmesi acı verici olsa da, bizden talep edilen özerkliği sağlarsak, en azından [TUR_fundamentalist_state.GetName] eyaletinin ayaktakımını mevcut sorunlar listemizden çıkarmış oluruz. Ama yine de, böyle bir eylemi düşünmek bile bazıları tarafından vatan hainliği olarak görülebilir..."
 bftb_turkey.115.t:0 "Aşırı Muhafazakarlar Bölgesel Özerklik Talep Ediyor"
 bftb_turkey.116.a:0 "İki kat daha sert bir şekilde karşılık verin!"
 bftb_turkey.116.b:0 "Askerlerimizi geri çekin."
 bftb_turkey.116.desc:0 "[TUR_fundamentalist_state.GetName] eyaletindeki garnizonlarımızdan birinin, bölgedeki aşırı muhafazakarlar tarafından düzenlenen hesaplı ve acımasız bir gerilla saldırısının kurbanı olduğu şeklindeki korkunç haberi aldık. Her iki taraftaki kayıplar önemliydi, ancak isyancılar, silahlı kuvvetlerimizi bölgeden çekmeyi kabul etmedikçe saldırıları tekrarlamakla tehdit ettiler. \n\nİnsanların inanç gibi önemsiz bir şey yüzünden birbirini öldürmesi gerçekten üzücü bir gün ve yine de içinde bulunduğumuz durum bu. Subay kadromuz, kayıplarımızın intikamını almak için isyancılara ordunun tüm gücüyle karşılık vermemizi öneriyor, ancak bazı siyasi figürler belki de en güvenli eylem yolunun, durum sakinleşene kadar kuvvetlerimizi geçici olarak bölgeden çekmek olacağını öne sürüyor. Bu, hafife alınacak bir karar değil."
 bftb_turkey.116.t:0 "[TUR_fundamentalist_state.GetName] Eyaletinde Gerilla Saldırısı Başlatıldı"
 bftb_turkey.117.a:0 "Onları durdurmak için hiçbir çabadan kaçınmayın."
 bftb_turkey.117.b:0 "Halkın iradesine boyun eğmeliyiz..."
 bftb_turkey.117.desc:0 "Sahadan gelen raporlar, aşırı muhafazakar hücrelerin, oradaki nüfusu daha geleneksel bir yaşam tarzına - şüphesiz laik ideallerimize şiddetle karşı çıkan bir yaşam tarzına - geri döndürmek için uyumlu bir çabayla [TUR_fundamentalist_state.GetName] eyaletine sızdığını gösteriyor. Karizmatik din adamları ve gösterişli protesto liderleri, [TUR_fundamentalist_state.GetName] nüfusunu kendi düşünce tarzlarına dönüştürme konusunda başı çektiler ve şimdiye kadar onları yumuşak güç kullanarak zorla çıkarmaya çalışmak başarısız oldu. \n\nBir ikilemle karşı karşıya kaldık: halkın iradesini desteklemeye çalışıyoruz, ancak daha doğrudan bir eylem yoluyla müdahale etmezsek, eyaleti neredeyse kesinlikle aşırı muhafazakarlara kaybedeceğiz. Ulusumuzun nüfusunu laiklik için halk desteği oluşturmaya çalışmak üzere aydınlatmaya tekrar tekrar çalıştık ve yine de her fırsatta fanatikler bize karşı diş ve tırnakla savaştılar ve savaşmaya devam ediyorlar. [TUR_fundamentalist_state.GetName] halkının iradesini kabul etmeye hazır olup olmadığımıza veya aşırı muhafazakarların amaçlarını engellemek için hükümetimiz tarafından doğrudan eylem yapılıp yapılmayacağına karar vermeliyiz."
 bftb_turkey.117.t:0 "Aşırı Muhafazakarlar Zehirlerini [TUR_fundamentalist_state.GetName] Eyaletine Yayıyor"
 bftb_turkey.118.a:0 "Tüm gücünüzle onlara saldırın!"
 bftb_turkey.118.b:0 "Zamanla halkı geri kazanmak zorunda kalacağız."
 bftb_turkey.118.desc:0 "Felaket! [TUR_fundamentalist_state.GetName] üzerindeki tüm kontrolümüzü kaybettiğimizi az önce öğrendik. Aşırı muhafazakar gerillalar, eyaletteki tüm hükümet binalarına ve askeri üslere koordineli bir saldırı düzenlediler, öyle ki tüm durum kontrolden çıkmadan önce bir karşı saldırı koordine etmek için çok az zaman vardı. \n\nBu, ülkemiz için benzeri görülmemiş bir kayıp: devlet düşmanları, [ROOT.GetAdjective] egemen topraklarının tam kontrolünü ele geçirmeyi başardılar. [TUR_fundamentalist_state.GetName] eyaletini geri almak maliyetli olacak, ancak kontrolümüzden çıkmasına izin vermek de öyle. Zamanımız kalmadı ve bir karar vermeliyiz."
 bftb_turkey.118.t:0 "Aşırı Muhafazakarlar [TUR_fundamentalist_state.GetName] Eyaletinin Tamamını Ele Geçirdi!"
 bftb_turkey.119.a:0 "İş birliğiniz takdir edilmektedir."
 bftb_turkey.119.desc:0 "Şeffaf diyalog ve özverili toplulukla iletişim politikamız [TUR_fundamentalist_state.GetName] eyaletinde fazlasıyla işe yaradı. Radikaller, yerel halk tarafından eyaletten kovularak hükümetimiz için harika bir zaferle eyaleti terk ettiler. \n\n[TUR_fundamentalist_state.GetName] halkı dini karakterini koruyor, ancak topluluk liderleriyle yaptığımız görüşmelerde, vatandaşlarımızın artık hükümet ilkelerini inançlarıyla özünde çelişkili bulmadıklarını anladık. [TUR_fundamentalist_state.GetName] eyaletinde, [ROOT.GetAdjective] birliğinin geleceğinin nasıl olacağını görüyoruz."
 bftb_turkey.119.t:0 "[TUR_fundamentalist_state.GetName] Eyaletindeki Aşırı Muhafazakarlar Hükümete Boyun Eğiyor"
 bftb_turkey.12.a:0 "Kazandık!"
 bftb_turkey.12.desc:0 "[SOV.GetLeader], [TUR.GetLeader]'i bizzat telefonla arayarak gerilimin düşürülmesini soğukkanlılıkla istedi ve [TUR.GetAdjective] Cumhurbaşkanı'nı emperyalizme karşı mücadeleye katkılarından dolayı övdü. [SOV.GetAdjective] askerlerine [SOV.GetAdjective] sınırındaki eylemlerini yatıştırmaları emredildi ve [SOV.GetNameDef], [TUR.GetName]'nin Türk Boğazları'nı ele geçirmesiyle ilgili şikayetlerini geri çekti. \n\nAcımasız Kurtuluş Savaşı'ndan sonra büyük bir savaş fikrinden hiç de heyecan duymayan [TUR.GetAdjective] halkı, [TUR.GetLeader]'in ulusa barışın nihayetinde günü kazandığını ve [TUR.GetAdjective] egemenliğinin bu kriz zamanında [TUR.GetAdjective] halkının cesareti sayesinde sonsuza dek güvence altına alındığını ilan ettiğinde toplu bir oh çekti."
 bftb_turkey.12.t:0 "[SOV.GetName] Geri Adım Atıyor"
 bftb_turkey.126.a:0 "Eğer ihtiyaçları olan yardımsa, o zaman istedikleri yardımı alacaklar."
 bftb_turkey.126.b:0 "Bu şeytani teklifi kabul etmeyeceğiz."
 bftb_turkey.126.desc:0 "[FROM.GetNameDef] ülkesinden temsilciler ülkemizi ziyaret etti ve yatırım planları için destek toplamak umuduyla birçok siyasetçimizle bir araya geldi. [FROM.GetNameDef] hükümeti, kendi endüstriyel yeteneklerini ve çıktılarını iyileştirmek için kaynaklarımızı kullanmamızı istiyor. [FROM.GetAdjective] yetkilileri, uluslarına yardım ederek, gelecekte uluslarımız arasında bir askeri ittifak şeklinde kendi yardımımızı bekleyebileceğimizi ima ettiler."
 bftb_turkey.126.t:0 "[FROM.GetNameDefCap] Bir Yatırım Portföyü Sunuyor"
 bftb_turkey.127.a:0 "Üzücü, ama anlaşılabilir."
 bftb_turkey.127.desc:0 "[FROM.GetNameDef] ülkesinden kötü haberler aldık: [FROM.GetAdjective] ulusunun bize karşı kötü bir niyeti olmasa da, [FROM.GetNameDef] devletinin sanayi tabanımıza herhangi bir kaynak yatırımı yapmayacağı söylendi. Yetkililer konuyla ilgili kararlıydılar ve öngörülebilir gelecekte konuyu onlarla tekrar gündeme getirmememizi istediler."
 bftb_turkey.127.t:0 "[FROM.GetNameDefCap] Yatırım Seçeneğini Değerlendirme Dışı Bırakıyor"
 bftb_turkey.128.a:0 "Bize büyük bir iyilik yaptılar."
 bftb_turkey.128.desc:0 "Yakın zamanda [FROM.GetAdjective] yetkilileri tarafından, yatırım yaptıkları projenin tamamlandığı konusunda bilgilendirildik. Kendi müfettişlerimiz, her şeyin beklentilerimize uygun olduğundan emin olmak için inşaat sahasını ziyaret ettiler ve hayal kırıklığına uğramadan ayrıldılar. \n\n[FROM.GetAdjective] gözlemcileri, projenin tamamlanmasının ardından [FROM.GetNameDef] ulusunun gelecekte [ROOT.GetNameDef] ülkesinde benzer veya daha da iddialı projeleri desteklemeye karşı olmadığını belirtti."
 bftb_turkey.128.t:0 "[FROM.GetNameDefCap] Mütevazı Bir Yatırım Yapıyor"
 bftb_turkey.129.a:0 "Ne harika bir haber!"
 bftb_turkey.129.desc:0 "Yakın zamanda [FROM.GetAdjective] yetkilileri tarafından, [FROM.GetAdjective] ulusunun bir süre önce desteklediği sanayi projesinin tamamlandığı konusunda bilgilendirildik. Kendi müfettişlerimiz, her şeyin beklentilerimize uygun olduğundan emin olmak için inşaat sahasını ziyaret ettiler ve hayal kırıklığına uğramadan ayrıldılar. Yeni tesiste üretimin derhal başlaması bekleniyor. \n\n[FROM.GetAdjective] gözlemcileri, projenin tamamlanmasının ardından [FROM.GetNameDef] devletinin gelecekte gizli nitelikte benzer veya daha da iddialı projeleri desteklemeye karşı olmadığını belirtti."
 bftb_turkey.129.t:0 "[FROM.GetNameDefCap] Hafif Sanayi Sektörümüze Yatırım Yapıyor"
 bftb_turkey.13.a:0 "...ve biz ne kadar dayanabiliriz?"
 bftb_turkey.13.desc:0 "Altı saat önce, [SOV.GetAdjective] kuvvetleri Trabzon'daki [TUR.GetAdjective] stratejik üslerini bombalamaya başladı ve Marksist bir haçlı seferinin bir parçası olarak [TUR.GetAdjective] işçilerini kurtarmak için [TUR.GetNameDef]'ye girdiklerini ilan etti. Hain, Şefik Hüsnü, şüphesiz öngörülebilir gelecekte [SOV.GetNameDef]'nin kontrolü altında kalacak sürgünde bir Türkiye Halk Cumhuriyeti'nin kurulduğunu çoktan ilan etti. \n\n[TUR.GetLeader], İstanbul'da bir sahneye çıkarak savaşın [TUR.GetNameDef]'ye geldiğini kasvetli bir şekilde duyurdu, ancak Türk Cumhurbaşkanı söylemini değiştirmeden önce hüzünlü tonlar uzun sürmedi: [TUR.GetAdjective] halkının bir kez daha kader tarafından özgürlükleri ve bağımsızlıkları için savaşmaya çağrıldığına dair ateşli bir nutuk attı. Kurtuluş Savaşı'nın yaraları taze olsa da, [TUR.GetAdjective] halkı bir coşkuya kapıldı ve Silahlı Kuvvetlere katılmak için akın ediyor. \n\nAma bu coşku ne kadar sürebilir?"
 bftb_turkey.13.t:0 "[TUR.GetAdjective]-[SOV.GetAdjective] Savaşı Başlıyor"
 bftb_turkey.130.a:0 "Onlar [ROOT.GetAdjective]lerin gerçek dostlarıdır."
 bftb_turkey.130.desc:0 "Yakın zamanda [FROM.GetAdjective] yetkilileri tarafından, [FROM.GetAdjective] ulusunun bir süre önce desteklediği çok gizli sanayi projesinin tamamlandığı konusunda bilgilendirildik. Kendi müfettişlerimiz, her şeyin beklentilerimize uygun olduğundan emin olmak için inşaat sahasını ziyaret ettiler ve hayal kırıklığına uğramadan ayrıldılar. Yeni tesiste üretimin derhal başlaması bekleniyor. \n\n[FROM.GetAdjective] gözlemcileri, projenin tamamlanmasının ardından [FROM.GetNameDef] devletinin gelecekte benzer projeleri desteklemeye karşı olmadığını belirtti."
 bftb_turkey.130.t:0 "[FROM.GetNameDefCap] Askeri Sanayimize Yatırım Yapıyor"
 bftb_turkey.131.a:0 "Yüce Tanrı bizi affetsin, ama [GRE.GetNameDef] yok edilmeli."
 bftb_turkey.131.desc:0 "[GRE.GetNameDef]'ın bölünmesinin nasıl ele alınacağı konusunda [FROM.GetNameDef] ile bir anlaşmaya vardık. [FROM.GetNameDefCap]'ya Doğu Akdeniz ve İyon Denizi'ne kıyısı olan eyaletler verilecek ve biz de Ege Denizi'ni bizimle paylaşan [GRE.GetAdjective] ana topraklarını alacağız. Bunun gerekli hale gelmesi üzücüdür, ancak [GRE.GetNameDef] bu konuda bize başka seçenek bırakmadı."
 bftb_turkey.131.t:0 "[FROM.GetNameDefCap] [GRE.GetNameDef]'ın Bölünmesini Kabul Ediyor"
 bftb_turkey.132.a:0 "Yarış başladı!"
 bftb_turkey.132.desc:0 "[FROM.GetNameDefCap], [GRE.GetNameDef]'ın bölünmesi için makul teklifimizi, bu topraklarda yaşayan nüfusu dikkate almadan çılgınca bir toprak kapma yarışı lehine reddetti. 'İyi' bir işgal diye bir şey yoktur, ama en azından işler düzenli ve kontrollü olabilirdi - bunun yerine [FROM.GetAdjective]lar bu işgali, [GRE.GetAdjective]ları boyun eğmeye zorlamadan önce mümkün olduğunca çok toprak işgal etmek için kaotik ve dağınık bir yarışa dönüştürmeyi seçtiler. \n\nİşleri böyle yapmak istemiyorduk; böyle olması gerekmiyordu! Mirasımız sonsuza dek mahvoldu!"
 bftb_turkey.132.t:0 "[FROM.GetNameDefCap] [GRE.GetNameDef]'ı Bölme Planını Reddediyor!"
 bftb_turkey.133.a:0 "Zamana karşı bir yarış içindeyiz."
 bftb_turkey.133.desc:0 "Dün, Mustafa Kemal Atatürk, bazı eski dostlarını ağırlarken yatında baygınlık geçirdikten sonra ağır bir durumda hastaneye kaldırıldı. Bu olay, Atatürk'ün sağlığının hızla kötüleştiğine dair çok endişe verici bir dizi işaretin sonuncusu ve danışmanlar özel olarak Atatürk'ün durumu giderek daha öngörülemez hale geldikçe çok çalıştığı konusundaki endişelerini dile getirdiler. \n\nHer şeyin yolunda olduğu konusundaki ısrarlarına rağmen, hükümet Mustafa Kemal Atatürk'ün sağlığını izleme görevini üstleniyor ve alınabilecek olası önlemlerin bir listesini derliyor. Eğer Atatürk hasta bünyesine bakmak için görevlerinden çekilmezse, son aylarını ailesiyle geçirebilmesi için onu emekli olmaya zorlamayı düşünmek zorunda kalabiliriz."
 bftb_turkey.133.t:0 "Mustafa Kemal Atatürk Hastalandı"
 bftb_turkey.134.a:0 "Celâl Bayar bariz bir adaydır."
 bftb_turkey.134.b:0 "Celâl Bayar bariz bir adaydır."
 bftb_turkey.134.c:0 "İsmet İnönü, Atatürk'ün layık halefidir."
 bftb_turkey.134.d:0 "Fevzi Çakmak, [TUR.GetNameDef]'nin ihtiyaç duyduğu liderdir."
 bftb_turkey.134.desc:0 "\nCumhuriyet yasta. \n\nSavaş kahramanı, devrimci, cumhurbaşkanı ve Türklerin Babası Mustafa Kemal Atatürk, uykusunda huzur içinde vefat etti. \n\nHiçbir erkek ya da kadın, Mustafa Kemal Atatürk'ün liderliğinin efsanevi doruklarına ulaşmayı umut edemez, ancak Türklerin Babası, değerli Cumhuriyeti'nin bir liderlik krizi yüzünden kargaşaya düşmesini istemezdi. \n\nGazimizi değiştirmek istemiyoruz, çünkü kimse ulusumuzun kurtarıcı kurucu babasına denk gelmeyi hayal bile edemez, ancak Atatürk'ün izinden gideceğine güvenebileceğimiz lideri seçmeliyiz. Kemalist değerleri izlemeli ve [TUR.GetNameDef]'nin lideri olarak Atatürk'ün izini takip etmelidirler."
 bftb_turkey.134.e:0 "Fevzi Çakmak bu ulusa bir miktar güvenlik getirecektir."
 bftb_turkey.134.f:0 "Recep Peker, faşizm ile Kemalizm'i sentezleyecek adamdır."
 bftb_turkey.134.g:0 "Şevket Süreyya Aydemir'in dehası bizi bu süreçten geçirecek."
 bftb_turkey.134.h:0 "Sadece İsmet İnönü, benzersiz bir [TUR.GetAdjective] sosyalizmini tanıtabilir."
 bftb_turkey.134.i:0 "Kâzım Orbay, yolumuzu bulana kadar bir askeri cuntaya liderlik edecek."
 bftb_turkey.134.t:0 "Mustafa Kemal Atatürk'ün Vefatı"
 bftb_turkey.135.a:0 "Huzur içinde uyu, Gazimiz. Seni asla unutmayacağız."
 bftb_turkey.135.desc:0 "\nCumhuriyet yasta. \n\nSavaş kahramanı, devrimci, cumhurbaşkanı ve Türklerin Babası Mustafa Kemal Atatürk, uykusunda huzur içinde vefat etti. \n\nTürk halkına ve kurduğu cumhuriyete olan görevini sonuna kadar sürdürdü. Binlerce yas tutan kişi İstanbul'da saygılarını sundu, ardından naaşı lafzen, gemi ve trenle Ankara'ya nakledildi. Orada, tüm parlamentonun ve dünyanın dört bir yanından gelen devlet adamlarının katılımıyla devlet cenaze töreni düzenlendi.\n\nModern Türk ulusunun babası artık aramızda olmadığına göre, Cumhuriyet yoluna devam etmeli. [ROOT.GetLeader], Atatürk'ün cenazesinde konuşan birçok kişiden biriydi ve konuşmasında, ulusun özgürlüğünü güvence altına almada bu kadar hayati olan adamın mirasını sürdürme sözü verdi."
 bftb_turkey.135.t:0 "Mustafa Kemal Atatürk'ün Vefatı"
 bftb_turkey.136.a:0 "Çok yaşa yeni Sultan!"
 bftb_turkey.136.b:0 "Bir kadın mı!? Kabul edilemez! Bir naip istiyoruz!"
 bftb_turkey.136.desc:0 "Gururlu Osmanlı Saltanatımız, Sultanımızın ani ve beklenmedik ölüm haberi ulusumuzun kulaklarına ulaştığında sefalete büründü. Sultan ve oğulları Niksar'ın verimli tarlalarını ziyaret ediyorlardı ve Samsun'daki Canik Dağları'nda yürüyüş yaparken ilde bir deprem meydana geldi. Osmanlı hanedanının cesetleri üç gün sonra bulundu ve sarayda çılgınca bir paniğe neden oldu. \n\nOsmanlı veraset yasalarının değiştirilmesiyle, Sultan'ın en büyük kızının tahtın varisi olduğu anlaşılıyor. O, iradeli ve inanılmaz derecede yetenekli bir kadın, ancak dini kurumlarımızın daha muhafazakar unsurlarının birçoğu, Osmanlı tahtında bir kadının oturmasını protesto edebilir."
 bftb_turkey.136.t:0 "Osmanlı Hanedan Ailesi'nin Başına Trajedi Geldi!"
 bftb_turkey.137.a:0 "Yok etmeye yemin ettikleri şeyin ta kendisi oldular."
 bftb_turkey.137.b:0 "Onlar Devrim'e ihanet ettiler!"
 bftb_turkey.137.c:0 "Belki de Tek Ülkede Sosyalizm deneyi yapıyorlardır?"
 bftb_turkey.137.d:0 "Müttefiklerimize dokunmadıkları sürece..."
 bftb_turkey.137.desc:0 "[FROM.GetNameDef] hükümeti, kendi dış politika planlarımıza uygun olmayan yeni bir dış politika yönü benimsemeyi seçti. [FROM.GetNameDef] ulusundan delegeler, kendi diplomatlarımıza mevcut yıkıcı rotalarını tersine çevirme niyetleri olmadığını bildirdiler."
 bftb_turkey.137.e:0 "Açıkça artık onlara güvenilemez."
 bftb_turkey.137.t:0 "[FROM.GetNameDefCap] Tehlikeli Bir Dış Politika Duruşu benimsiyor"
 bftb_turkey.138.a:0 "Son bir şansları var. Sadece bir tane."
 bftb_turkey.138.b:0 "Bu haydut devleti barındırmaya devam etmekten iyi bir şey çıkmaz."
 bftb_turkey.138.desc:0 "Dış politika uzmanlarımızın öngördüğü gibi, [FROM.GetNameDef] gözünü kendi müttefiklerinden birine çevirdi. Hükümetlerinin pervasız kararı için [FROM.GetAdjective] delegesini kınadık, ancak bu bir etki yaratmış gibi görünmüyor."
 bftb_turkey.138.t:0 "[FROM.GetNameDefCap] İttifak Üyesinin Egemenliğini İhlal Ediyor!"
 bftb_turkey.139.a:0 "Uyarılmışlardı!"
 bftb_turkey.139.desc:0 "[FROM.GetNameDef] ulusunun başındaki haydutlar güvenimizi bir kez daha sarstılar. Bu maskaralığa daha fazla müsamaha gösterilemez, açıkça düşman olan bir ülkeyi barındırırken müttefiklerimizin saygısını korumaya devam edemeyiz."
 bftb_turkey.139.t:0 "[FROM.GetNameDefCap] İttifak Üyesinin Egemenliğini Tekrar İhlal Ediyor!"
 bftb_turkey.14.a:0 "Yaklaşan seçim, [TUR.GetName]'nin ruhu için bir seçim olacak."
 bftb_turkey.14.desc:0 "[TUR.GetAdjective] siyaset bilimcileri, siyasi partiler yasağı kaldırıldıktan sonra meşru bir muhalefet hareketinin oluşmaya başlamasının haftalar alacağına inanıyorlardı, ancak hepsi yanıldı. Adnan Menderes, Kemalistler yönetimindeki [TUR.GetNameDef]'de dini inançların durumundan memnun olmayan benzer düşüncelere sahip gelenekçilerden oluşan bir grup toplamakta hiç vakit kaybetmedi. Geçmişte, bir [TUR.GetAdjective] siyasi hareketi dinci aşırı muhafazakarlar tarafından ele geçirildiğinde, demokrasiye geçiş süreci tamamen durdurulurdu, ama bu sefer değil: bu sefer [TUR.GetLeader], seçim günü sandıkta bu fanatikler hareketini yenmeye kararlı. \n\nMenderes ve onun aşırı muhafazakar grubu, CHP'nin muhafazakarlık ve gelenekçilik platformunda aday olmayı planlayan popülist bir İslamcı hareketin öncüsü olarak tanımladığı 'Gelenekçi Grup' adını verdikleri bir yapıda bir araya geldiler. Gelenekçi Grup, bir destek tabanı oluşturmak amacıyla önümüzdeki haftalarda Türkiye kırsalında propaganda yapacak ve yeterince aldatılmış takipçi topladıklarında, şüphesiz kaçınılmaz muhalefet partilerini tanıtacaklar."
 bftb_turkey.14.t:0 "Bir Muhalefet Hareketi Oluşmaya Başlıyor"
 bftb_turkey.140.a:0 "İstediğimizi yaparız."
 bftb_turkey.140.desc:0 "[FROM.GetAdjective] hükümeti tarafından, bir ittifak üyesinin egemenliğini bir daha ihlal etmememiz konusunda uyarıldık. Bu seferki eylemlerimizi mazur görmeye hazırlar, ancak kendi müttefiklerimize karşı daha fazla hamle [FROM.GetNameDef] devletini harekete geçmeye zorlayacaktır."
 bftb_turkey.140.t:0 "[FROM.GetNameDefCap] Bir Uyarı Yayınlıyor"
 bftb_turkey.141.a:0 "Öyle olsun."
 bftb_turkey.141.desc:0 "Yeni dış politikamızın [FROM.GetNameDef] için kabul edilemez olduğu kanıtlandı ve artık bir müttefik olarak kabul edilemeyeceğimize karar verdiler. Bugünden itibaren, artık [FROM.GetFactionName] ittifakının bir parçası değiliz."
 bftb_turkey.141.t:0 "[FROM.GetNameDefCap] Bizi [FROM.GetFactionName] İttifakından Çıkarıyor!"
 bftb_turkey.144.desc:0 "[FROM.GetNameDef]'nin temsilcileri geldiler ve kendilerini herhangi bir işgalci ülkeye karşı desteklememizi sağlayacak bir anlaşma imzalamamızı talep ettiler. Düşmanlarımızla ittifakları Orta Doğu'daki çabalarımızı ciddi şekilde sekteye uğratacağından, bu koruma vaadi alınmaya değer bir stratejik risk olabilir."
 bftb_turkey.144.t:0 "[FROM.GetName] Koruma Arıyor"
 bftb_turkey.145.a:0 "Hepimiz biraz daha iyi uyuyabiliriz"
 bftb_turkey.145.desc:0 "[FROM.GetAdjective] temsilcileri, ulusumuzun saldırıya uğraması durumunda bizi koruması için [FROM.GetNameDef]'yi resmi olarak bağlayan bir anlaşmayı imzalamak için bugün erken saatlerde geldi. Bu, [FROM.GetNameDef] ile daha fazla işbirliğinin yolunu açabilir."
 bftb_turkey.145.t:0 "[FROM.GetName] Koruma Vaad Ediyor"
 bftb_turkey.146.desc:0 "[FROM.GetAdjective] hükümetinin bir araya gelmesinin ardından, [ROOT.GetNameDef]'nin korunmasını taahhüt etmeme kararı alındı. Belki hükümetimiz hakkında olumsuz bir görüşe sahipler ya da verilen sözün çok riskli olduğunu düşünüyorlar."
 bftb_turkey.146.t:0 "[FROM.GetName] Bizi Korumayı Reddediyor"
 bftb_turkey.16.a:0 "Bu anayasaya aykırı! Durdurun şunu!"
 bftb_turkey.16.b:0 "Halkın demokratik iradesi belli olacak."
 bftb_turkey.16.desc:0 "Adnan Menderes'in Gelenekçileri, laik hükümet tarafından ezildiğini hisseden dindar vatandaşları yaklaşan seçimde partilerine oy vermeye teşvik etmek için ülke çapında yoğun bir şekilde faaliyet gösteriyor. Raporlar, bu seçmenlerin birçoğunun Kemalistleri yenme şansları konusunda şüpheci kalmasına ve genel olarak demokrasiye alaycı bir yaklaşım sergilemesine rağmen, yaklaşılanların büyük bir kısmının Menderes'e ve onun muhalefet hareketine karşı coşku gösterdiğini gösteriyor."
 bftb_turkey.16.t:0 "Gelenekçi Grup, Seçmen Katılımını Artırmak İçin Kırsal Kesim Vatandaşlarını Seferber Ediyor"
 bftb_turkey.17.a:0 "Bu neredeyse vatan hainliği!"
 bftb_turkey.17.b:0 "Bu iş birliği gelecekte meyve verebilir!"
 bftb_turkey.17.desc:0 "Adnan Menderes'in Gelenekçileri, [TUR.GetAdjective]iye K*rdistanı'na çokça duyurulan bir gezi düzenledi ve burada günümüz [TUR.GetNameDef]'sindeki inanç durumu söz konusu olduğunda uzlaşma ve ortak çıkarları vaaz ettiler. Dini metinlerden alıntılar yapan Kürt aşiret liderleri, Gelenekçi muhalefet hareketinden yetkililerle birlikte sahneye çıktılar ve seçim günü Kürtleri Menderes ve onun gibilere oy vermeye teşvik ederek '[TUR.GetNameDef]'yi Yüce Allah'ın yoluna geri getirmeye' çağırdılar."
 bftb_turkey.17.t:0 "Menderes'in Gelenekçi Grubu İttifak İçin Kürt Örgütlerine Yaklaşıyor"
 bftb_turkey.18.a:0 "Hepsini halka açık bir şekilde yargılayın ve mümkün olan en ağır cezayı verin!"
 bftb_turkey.18.b:0 "Sessizce af teklif edip bunun unutulmasını umacağız."
 bftb_turkey.18.desc:0 "Gelecekteki seçim sonuçlarını Adnan Menderes'in muhalefet hareketi lehine olacak şekilde hile yapmak için bir komplonun [TUR.GetNameDef]'nin en kırsal illerinden bazılarında ortaya çıkarılması, [TUR.GetNameDef]'nin yeni filizlenen demokrasisi için üzücü bir gün. Dini liderleri, yerel yöneticileri ve hatta devlet çalışanlarını içeren komplo engellendi ve komplocular tutuklandı. Soruşturmalarımızda Menderes'i veya muhalefet hareketini komployla ilişkilendiren hiçbir kanıt bulunamadı, ancak tepkimiz kesinlikle onların seçim kampanyasını etkileyecektir."
 bftb_turkey.18.t:0 "Kırsal Bölgelerde Seçmen Sahtekarlığı Komplosu Ortaya Çıkarıldı"
 bftb_turkey.19.a:0 "Bu, Cumhuriyet için karanlık bir gün."
 bftb_turkey.19.desc:0 "Adnan Menderes'in ülkenin iç kesimlerinde düzenlediği bir miting, Mustafa Kemal Atatürk'ün İstanbul'un kalbinde yaptığı konuşmalardaki kalabalıklara benzer bir kalabalık çekti. Mitingin sorunsuz bir şekilde gerçekleştiğini ve Menderes'in resmi muhalefet partisinin çok yakında ulusa tanıtılacağını duyurduğunu duyan [TUR.GetLeader] perişan oldu. Bir dizi konuşmacı ortaya çıktı, her biri günlük yaşamda ve siyasette dinin önemini vaaz etti ve hepsi genel olarak gelenekçi bir muhafazakarlık ideolojisini destekledi - bazı konuşmacılar uzun zaman önce ortadan kaldırılmış olan Osmanlı saltanatı ve hilafetinden bile sevgiyle bahsetti! Menderes en son sahneye çıktı ve kendisinden önceki bazı konuşmacılara kıyasla çok daha ölçülü terimlerle konuştu. Menderes, dinleyicilerine neşeyle Liberal ekonominin erdemlerini anlattı ve ulus için yaptıkları her şey için Kemalistleri övdükten sonra bu övgüyü büyük bir eleştiriyle baltaladı. Katılımcılar mitingden coşkulu ve seçimi kazanma şanslarından emin bir şekilde ayrıldılar. \n\nSadık Kemalist subay kadrosu hükümete yaklaştı ve kesin bir dille CHP'nin Menderes ve onun muhafazakar popülist hareketinin artan nüfuzunu engellemek için daha fazlasını yapmasını talep etti. Subay kadrosunun bir temsilcisi, ülkenin subaylarının asla bir Menderes hükümetine hizmet etmeyeceğini belirtti ve Kemalist sisteme yönelik temel bir tehdit olarak gördükleri şeyi engellemede başarısız olursak kendi aşırı eylemlerini yapabileceklerini ima etti."
 bftb_turkey.19.t:0 "Menderes'in Hareketine Destek İçin Devasa Miting Düzenlendi"
 bftb_turkey.2.a:0 "Şimdi [SOV.GetNameDef]'nin yanıtını bekliyoruz."
 bftb_turkey.2.desc:0 "[ENG.GetLeader], [ENG.GetNameDef]'nin kendi boğazlarımızın kontrolünü geri alma hedefimizde bizi desteklemeyi planladığını açıklayan bir bildiri yayınladı. [ENG.GetNameDef]'nin desteğini kazanmak bizim için büyük bir zaferdir ve dünya genelindeki meşruiyetimizi büyük ölçüde artırır."
 bftb_turkey.2.t:0 "[ENG.GetName] Desteğini Sunuyor"
 bftb_turkey.20.a:0 "En iyi parti kazansın!"
 bftb_turkey.20.desc:0 "Sekiz saat önce, Adnan Menderes zaferle [TUR.GetNameDef]'nin en yeni ve en tehlikeli muhalefet partisi olan Demokrat Parti'nin kuruluşunu duyurdu. Demokrat Parti'nin CHP'nin iktidar tekelini devirmeyi planladığını ve ülkenin daha önce hiç görülmemiş yepyeni bir yöne yönlendirileceğini açıkladı. Partinin üç temel direği coşkulu kalabalıklara açıklandı ve Menderes hükümetinin İnanç, Vatan ve Hürriyet'e - bu sırayla - bağlı olacağına söz verdi. Daha da şaşırtıcı olanı, Menderes'in DP liderliğindeki bir [TUR.GetName]'nin, ulusun kuruluşundan bu yana diğer tüm [TUR.GetAdjective] hükümetlerinden kesinlikle daha müdahaleci olacağını açıklamasıydı. \n\nDuyuru Kemalist çevrelerde öfkeyle karşılandı ve [TUR.GetLeader] bugün İstanbul'daki destekçilerine, seçimin başlangıçta inanıldığından daha zorlu geçecek olsa bile, CHP'nin yaklaşan seçimden hala ulusun yönetici liderleri olarak çıkacağına söz verdi."
 bftb_turkey.20.t:0 "Demokrat Parti"
 bftb_turkey.21.a:0 "...Cumhuriyetçiler!"
 bftb_turkey.21.b:0 "...Demokrat Parti!"
 bftb_turkey.21.desc:0 "Uzun zamandır beklenen seçim günü nihayet geldi. Ülkenin dört bir yanındaki kadınlar ve erkekler, kötü havayı ve kişisel hastalıkları görmezden gelerek, tercih ettikleri partiye oylarını vermek için illerinin belirlenmiş oy sandıklarına yürüdüler. Özellikle demokrasiye geçişin bu kadar hızlı geldiği düşünülürse, kimse bu kadar muazzam bir katılımı beklemiyordu. Seçim yarışı tam olarak temiz geçmedi, ancak herhangi bir demokrasi yanlısı, [TUR.GetName]'nin ilk serbest seçiminde oy kullanmaya giden bu kadar çok [TUR.GetAdjective] vatandaşını görmekten gurur duyardı. \n\nYarış başa baştı ve tüm oyları sayıp nihai sonucu belirlemek önemli miktarda zaman aldı. [TUR.GetNameDef]'nin ilk seçiminin nihai galipleri..."
 bftb_turkey.21.t:0 "Seçim Günü"
 bftb_turkey.22.a:0 "Allah yolunda savaşırız!"
 bftb_turkey.22.desc:0 "Demokrat Parti'nin seçim zaferinden sonra, [TUR.GetNameDef] içinde çatışma çıkması neredeyse kaçınılmazdı. Hükümet ile silahlı kuvvetler arasındaki gerilim seçimden bu yana her geçen gün daha da kötüleşti ve şimdi her şey doruğa ulaşmış görünüyor. Subaylar, batıdaki en zengin eyaletlerin kontrolünü çoktan ele geçirdi ve subayların bu isyan eden eyaletlerin halk desteğine sahip olduğuna inanılıyor. \n\nDoğuda, Kürt milisler bağımsızlıklarını sağlamak amacıyla silahlı bir mücadeleye hazırlanmak için örgütlenmeye başladılar. Kürtlerle ittifakımızın uzun süreceğini düşündüğümüz için aptallık ettik, ama egemen toprağımızdan bir ulus çıkarmak için zavallı girişimlerini yok etmeyeceğimizi düşündükleri için asıl aptallar onlar. \n\n[TUR.GetNameDef]'nin ruhu için mücadele başladı ve kaybetmeyi göze alamayız."
 bftb_turkey.22.t:0 "[TUR.GetAdjective] İç Savaşı"
 bftb_turkey.23.a:0 "Elbette bu dostluk paktını imzalayacağız!"
 bftb_turkey.23.b:0 "Biz akraba değiliz, [TUR.GetName]: sizi tanımıyoruz."
 bftb_turkey.23.desc:0 "[TUR.GetLeader], gelecekte daha fazla iş birliği olasılığını açık bırakarak karşılıklı bir saldırmazlık paktı imzalama önerisiyle [ROOT.GetLeader]'e yaklaştı. [TUR.GetAdjective] diplomatlar, iki ulusumuzun ortak tarihleri ve çıkarları hakkında ayrıntılara girerek ve ardından kardeş uluslar arasında barış için samimi bir çağrıda bulunarak teklifleri üzerinde sıkı bir şekilde çalıştılar. Karşılıklı müzakereler hoş geçti, ancak imzalayıp imzalamayacağımız seçimi nihayetinde bize düşüyor."
 bftb_turkey.23.t:0 "Sadabat Paktı"
 bftb_turkey.24.a:0 "Celâl Bayar bariz bir adaydır."
 bftb_turkey.24.b:0 "Celâl Bayar bariz bir adaydır."
 bftb_turkey.24.c:0 "İsmet İnönü, Atatürk'ün layık halefidir."
 bftb_turkey.24.d:0 "Fevzi Çakmak, [TUR.GetNameDef]'nin ihtiyaç duyduğu liderdir."
 bftb_turkey.24.desc:0 "Hiçbir erkek ya da kadın, Mustafa Kemal Atatürk'ün liderliğinin efsanevi doruklarına ulaşmayı umut edemez, ancak Türklerin Babası ölümlü bir insandan ibarettir. Gazimizi değiştirmek istemiyoruz, çünkü kimse ulusumuzun kurtarıcı kurucu babasına denk gelmeyi hayal bile edemez, ancak Atatürk'ün izinden gideceğine güvenebileceğimiz lideri seçmeliyiz. Kemalist değerleri izlemeli ve [TUR.GetNameDef]'nin lideri olarak Atatürk'ün izini takip etmelidirler."
 bftb_turkey.24.e:0 "Fevzi Çakmak, bizim kendi Francisco Franco'muz olacak."
 bftb_turkey.24.f:0 "Recep Peker, faşizm ile Kemalizm'i sentezleyecek adamdır."
 bftb_turkey.24.g:0 "Şevket Süreyya Aydemir'in dehası bizi bu süreçten geçirecek."
 bftb_turkey.24.h:0 "Sadece İsmet İnönü, benzersiz bir [TUR.GetAdjective] sosyalizmini tanıtabilir."
 bftb_turkey.24.i:0 "Kâzım Orbay, yolumuzu bulana kadar bir askeri cuntaya liderlik edecek."
 bftb_turkey.24.j:0 "Şey... ımm... eski Halife mi?"
 bftb_turkey.24.t:0 "Atatürk'ün Halefini Seçmek"
 bftb_turkey.25.a:0 "Hatay'ın [TUR.GetNameDef]'nin eline geçmesine izin vereceğiz."
 bftb_turkey.25.b:0 "[TUR.GetAdjective]lerin arzusu ne olursa olsun, Hatay Suriye'nin bir parçası olarak kalacak."
 bftb_turkey.25.desc:0 "[TUR.GetLeader], Suriye'nin Hatay eyaletindeki Türk nüfusunun demokratik referandum hakkına izin verilmesini talep eden sert ifadeli bir mektup yazdı, böylece Hatay halkı [TUR.GetNameDef]'ye katılıp katılmayacaklarına veya süresiz olarak Suriye'nin bir parçası olarak kalıp kalmayacaklarına karar verebilir. Sömürge polisimiz, [TUR.GetAdjective]iye sınırında yasa dışı faaliyetler ortaya çıkardı; [TUR.GetAdjective] vatandaşları ülkeye girerek Hatay ilinde kargaşa yaratıyor. [TUR.GetNameDef]'nin bir [TUR.GetAdjective] zaferi sağlamak için referandum sonuçlarını çarpıtmayı planladığı açık, ancak [TUR.GetNameDef]'nin bize yakın olması kesinlikle alternatiften daha tercih edilir olurdu. [TUR.GetLeader]'nin Hatay'ın [TUR.GetNameDef]'ye entegre edilmesini sağlamak için ne kadar ileri gideceğini kim söyleyebilir?"
 bftb_turkey.25.t:0 "[TUR.GetName] Hatay Konusunu Gündeme Getiriyor"
 bftb_turkey.26.a:0 "Sizi tekrar aramızda görmekten mutluluk duyarız, kardeşlerim."
 bftb_turkey.26.desc:0 "[TUR.GetLeader], Antakya'da küçük bir konuşma yaparak Hatay vatandaşlarını [TUR.GetNameDef]'ye kabul etti ve Hatay halkının demokratik iradesine saygı duyduğu için [FROM.GetNameDef]'den [FROM.GetLeader]'e teşekkür etti. Bu hamle Suriyeli yetkililer tarafından öfkeyle karşılansa da, Hatay ve genel olarak [TUR.GetNameDef]'nin genel havası memnuniyetti ve birçok [TUR.GetAdjective] insan, [TUR.GetNameDef]'nin en yeni ilini kutlamalar ve hediye alışverişleriyle kutsamak için evlerinden Hatay'a geziler yaptı."
 bftb_turkey.26.t:0 "[FROM.GetNameDefCap] Hatay'ın Egemenliğini Bize Devrediyor"
 bftb_turkey.27.a:0 "Öyle ya da böyle, Hatay ait olduğu yere kavuşturulacak."
 bftb_turkey.27.desc:0 "[TUR.GetLeader], Gaziantep'te ateşli bir mitinge liderlik etti ve burada yurtdışındaki Türklerin [FROM.GetNameDef] tarafından ezilmesini kınadı. [TUR.GetAdjective] halkı bir kargaşaya sürüklendi ve şu anda Hatay'ın zalimleri ile [FROM.GetNameDef] halkı arasında pek bir sevgi kalmadı. Şimdilik, Hatay bizim erişimimiz dışında kalıyor - ama bu iğrenç ihaneti her zaman hatırlayacağız."
 bftb_turkey.27.t:0 "[FROM.GetName] Hatay Üzerinde Sıkı Kontrolü Sürdürüyor"
 bftb_turkey.29.a:0 "Uluslarını savunmak için bu kadar çok cesur kadın ve erkeğin ortaya çıkması yüreklendirici."
 bftb_turkey.29.desc:0 "Görünüşe göre Önce Vatan yaklaşımını benimseme kararımız büyük bir etki yarattı! Aniden ulus çapında silahlı kuvvetlerimize katılmayı uman gönüllülerde büyük bir artış görüyoruz. Üst komutamız neredeyse bunalmış durumda, bu baş döndürücü etki her türden dini ve dilsel geçmişe sahip insanın katılmasına neden oldu ve operasyonel düzeyde taşınması neredeyse çok ağır bir yük. \n\nNeyse ki, bu gelişmeye en azından bir şekilde hazırlıklıydık ve tüm bu eski asker kaçaklarının entegrasyonu aşağı yukarı sorunsuz oldu. Danışmanlarımız, daha uzun bir süre boyunca gönüllü akışının devam edebileceğini öne sürüyor!"
 bftb_turkey.29.t:0 "Eski Asker Kaçakları Hizmet İçin Gönüllü Oluyor"
 bftb_turkey.3.a:0 "Şimdi [SOV.GetNameDef]'nin yanıtını bekliyoruz."
 bftb_turkey.3.desc:0 "[ENG.GetLeader], [TUR.GetLeader]'e uzun bir mektup yazarak, [ENG.GetNameDef]'nin şu anda bir dış krize karışmayı göze alamayacağını uzun uzadıya açıkladı. [ENG.GetLeader], [ENG.GetNameDef]'de savaşa yönelik halk desteğinin eksikliğini ve [TUR.GetAdjective]lerin [SOV.GetNameDef] ile savaşa hazırlığı konusundaki kendi şüpheciliğini, [ENG.GetNameDef]'nin neden müdahil olmayacağının nedenleri olarak gösterdi. \n\n[ENG.GetName], Türk Boğazları üzerindeki kontrolümüzü tanıdı, ancak bundan fazlasını yapmayacaklar."
 bftb_turkey.3.t:0 "[ENG.GetName] Bize Yardımı Reddediyor!"
 bftb_turkey.30.a:0 "Onlara kromumuza erişim hakkı teklif edeceğiz."
 bftb_turkey.30.b:0 "Endüstriyel tazminat teklif edeceğiz."
 bftb_turkey.30.c:0 "Bir dostluk teklifi yeterli olacaktır."
 bftb_turkey.30.desc:0 "Oniki Adalar bizim karasularımızda yer alır ve bir zamanlar imparatorluğumuzun ayrılmaz bir parçası olarak kabul edilirdi. [ENG.GetAdjective]lerin ve [GRE.GetAdjective]ların söylemeyi tercih ettiği adıyla Dodecanese, [ITA.GetAdjective]lar onları hak sahiplerine teslim ettiğinde bir kez daha bizim olacaktır. \n\nHükümet yetkilileri, adalar karşılığında [ITA.GetAdjective]lara ne sunabileceğimize dair bir dosya hazırladı, zira onların tazminat talep edeceğini kesinlikle bekleyebiliriz - tabii eğer en başta kabul etmeye yanaşırlarsa."
 bftb_turkey.30.t:0 "Oniki Adalar İçin Tazminat"
 bftb_turkey.31.a:0 "Oniki Adalar karşılığında kaynaklarınıza erişim hakkını kabul ediyoruz."
 bftb_turkey.31.b:0 "Bir karış topraktan bile ayrılmayacağız! Ne şimdi, ne de asla!"
 bftb_turkey.31.desc:0 "[FROM.GetAdjective] hükümeti bize şaşırtıcı bir teklifle yaklaştı. Oniki Adalar karşılığında [342.GetName] eyaletindeki doğal maden ve metallerinin yüzde yüzünü bize sağlamak istiyorlar. \n\nHükümetimiz genellikle toprak teslim etmek yerine toprak edinme işiyle uğraşmıştır, ancak [TUR.GetNameDef] bize büyük ölçekli bir savaş çabası için hayati olabilecek kaynakları stoklayabileceğimiz kendi kaynağımızı sunuyor. Ayrıca, bir savaş ciddiyetle başladığında erişemeyebileceğimiz kaynaklar olduğunu da düşünmeliyiz. [FROM.GetAdjective]'lerin teklifini kabul edip etmeme seçimi nihayetinde bize kalmış bir meseledir."
 bftb_turkey.31.t:0 "[FROM.GetNameDefCap] Bize [342.GetName] Eyaletinde Özel Kaynak Hakları Teklif Ediyor"
 bftb_turkey.32.a:0 "Sözleşmeyi imzalayın; eğer bedelini ödemeye razılarsa adaları alabilirler."
 bftb_turkey.32.b:0 "Bir karış topraktan bile ayrılmayacağız! Ne şimdi, ne de asla!"
 bftb_turkey.32.desc:0 "[FROM.GetAdjective] hükümeti bize ilgi çekici bir teklifle yaklaştı. [FROM.GetAdjective]ler, Oniki Ada'nın [FROM.GetNameDef] için tarihi ve stratejik önemini özetleyen bir dosya sundu ve adalar karşılığında bize satmak istedikleri mülklerin ve üretim tesislerinin bir listesini hazırladı. \n\nHükümetimiz genellikle toprak teslim etmekten ziyade toprak edinme işiyle uğraşmıştır, ancak ekstra sanayinin [ROOT.GetAdjective] savaş gücüne büyük faydası olabileceği de inkâr edilemez. Nihayetinde, sanayimize yapılacak ekstra takviyenin ulusumuz için Oniki Adalar'dan daha acil bir değere sahip olup olmadığına karar vermeliyiz."
 bftb_turkey.32.t:0 "[FROM.GetNameDefCap] Bize Oniki Adalar Karşılığında Endüstriyel Yardım Teklif Ediyor"
 bftb_turkey.33.a:0 "Bu, ileride bir askeri ittifaka yol açsa iyi olur..."
 bftb_turkey.33.b:0 "İkiyüzlü olarak adlandırılmaktan korkmuyoruz; adalar bizim kalacak!"
 bftb_turkey.33.desc:0 "[FROM.GetAdjective] hükümeti, bize [FROM.GetLeader] tarafından imzalanmış, iki ulusumuz arasındaki bağın önemini ve [FROM.GetAdjective]lerin ülkemize olan doğal sevgisini vurgulayan kapsamlı bir mektup gönderdi. Tüm bu laf kalabalığını bir kenara bırakırsak, [FROM.GetAdjective]ler bize bir 'Güç Paktı' imzalamayı teklif ettiler - oldukça anlamsız bir düzenleme, ama bir şartı var. Dostluk mektubuna ekli olarak, bölge valilerimiz ile Oniki Adalar'ın yönetimini devralmayı bekleyen [FROM.GetAdjective] bürokratlar arasında barışçıl yetki devrinin nasıl gerçekleştirileceğine dair talimatlar içeren bir dosya var. \n\nHükümetimiz genellikle toprak teslim etmek yerine toprak edinme işiyle uğraşmıştır, ancak [FROM.GetAdjective]ler Akdeniz'de sınırlı bir çatışmada çok faydalı müttefikler olabilirler. Eğer herhangi bir endişe varsa, Oniki Adalar'ın çoğunlukla Yunan olan nüfusu, [FROM.GetNameDef]'nın ada zincirlerini [FROM.GetAdjective] ulusunun bir parçası olarak ilhak etmesi fikrinden endişe duyduklarını ifade ettiler. Ama yine de, Büyük Savaş'tan sonra evlerini Osmanlı İmparatorluğu'nun cesedinden kopardığımızda da çok benzer bir tepki vermişlerdi."
 bftb_turkey.33.t:0 "[FROM.GetNameDefCap] Oniki Adalar'ın Devrini Talep Ediyor"
 bftb_turkey.34.a:0 "Büyük bir zafer!"
 bftb_turkey.34.desc:0 "Oniki Adaları, [342.GetName]'deki kaynakların münhasır hakları karşılığında [FROM.GetAdjective] yetkilileri tarafından bize iade edildi. Her ne kadar yetkililer, [342.GetName]'de rızaya dayalı sömürgeciliğin bariz bir şekilde sergilenmesi karşısında duydukları endişeyi özel olarak dile getirmiş olsalar da, bu düşüncelerin çoğu, [TUR.GetNameDef]'nin en yeni eyaletinin ilhakının ardındaki genel heyecan tarafından bastırıldı. \n\n[TUR.GetLeader] Rodos'a kişisel bir ziyarette bulundu ve ada zincirinde ada zincirinde adaların tarihi ve etnik kökenlerini [TUR.GetNameDef]'ye göre sansasyonel hale getiren yeni bir müfredat uygulanmaya başlamış olsa bile, uzun süredir baskı altında olan vatandaşlara tüm endişelerinin [TUR.GetAdjective] hükümeti tarafından dinleneceği ve dikkate alınacağı konusunda kişisel olarak güvence verdiler."
 bftb_turkey.34.t:0 "[FROM.GetNameDefCap] Teklifimizi Kabul Ediyor!"
 bftb_turkey.35.a:0 "Büyük bir zafer!"
 bftb_turkey.35.desc:0 "Oniki Adalar, gelişmekte olan sanayimizin bir kısmının meyveleri karşılığında [FROM.GetAdjective] yetkilileri tarafından bize iade edildi. Yetkililer özel olarak yüzyıllardır bize ait olan bir şey için çelik ve terle ödeme yapma fikrinden duydukları endişeyi dile getirseler de, bu düşüncelerin birçoğu [TUR.GetNameDef]'nin en yeni ilinin ilhakının arkasındaki genel heyecanla bastırıldı. \n\n[TUR.GetLeader], bizzat Rodos'a giderek, uzun zamandır baskı altında yaşayan halka tüm dertleriyle [TUR.GetAdjective] hükümetinin ilgileneceğine dair söz verdi. Hatta bunu yaptığı sırada, ada genelinde, adaların [TUR.GetNameDef] ile olan tarihi ve etnik bağlarını parlatan yeni bir müfredat çoktan devreye sokulmuştu."
 bftb_turkey.35.t:0 "[FROM.GetNameDefCap] Teklifimizi Kabul Ediyor!"
 bftb_turkey.36.a:0 "Bundan daha iyisi olamazdı."
 bftb_turkey.36.desc:0 "Birçok [TUR.GetAdjective] yetkilisini şaşırtacak şekilde, Oniki Adalar, nihayetinde hiçbir tarafı içinde yer alan anlamsız taahhütlerden herhangi birini yerine getirmeye zorlamayan bir antlaşmanın karşılıklı olarak imzalanması karşılığında [FROM.GetAdjective] yetkilileri tarafından bize iade edildi. [TUR.GetLeader], [FROM.GetLeader] ile sözde Güç Paktı'nı imzalamak için bizzat bir devlet ziyareti gerçekleştirdi ve her iki lider tarafından bu tarihi toprak değişimi ışığında iki deniz komşusu arasındaki ilişkileri daha da geliştirme konusunda karşılıklı bir taahhütte bulunuldu. [TUR.GetNameDef] genelindeki heyecan bulaşıcı ve [TUR.GetNameDef]'in en yeni ilinin ilhakı üzerine büyük bir kutlama var. \n\n[TUR.GetLeader], Rodos'a kişisel bir ziyaret gerçekleştirerek uzun süredir ezilen vatandaşlara tüm endişelerinin [TUR.GetAdjective] hükümeti tarafından duyulacağına ve dikkate alınacağına dair bizzat güvence verdi, hatta adaların [TUR.GetNameDef] ile olan tarihi ve etnik köklerini sansasyonelleştiren yeni bir müfredat ada zinciri genelinde uygulanmaya başlanmışken bile. \n\n[GRE.GetAdjective] hükümeti sorunsuz toprak değişimini kınadı ve diğer büyük güçleri Oniki Adalar'daki [GRE.GetAdjective] halkının egemenliğinin haksız ve yasa dışı bir ihlali olarak adlandırdıkları şeyi kınamaya çağırdı. Uluslararası toplum, muhtemelen [TUR.GetAdjective] hükümetini yabancılaştırma korkusuyla toprak değişimi konusunda büyük ölçüde sessiz kaldı."
 bftb_turkey.36.t:0 "[FROM.GetNameDefCap] Teklifimizi Kabul Ediyor!"
 bftb_turkey.37.a:0 "Pekala, bu daha iyi olabilirdi."
 bftb_turkey.37.desc:0 "[FROM.GetAdjective] hükümeti, [TUR.GetAdjective] kışkırtıcılarının ve rövanşistlerinin çabalarına rağmen, Oniki Adalar'ın sonsuza dek [FROM.GetAdjective] devletinin ayrılmaz bir toprağı olarak kalacağını kamuoyuna açıkladı. [FROM.GetLeader], konuşmasında [TUR.GetLeader]'nün adını anarak, [TUR.GetLeader]'ye [TUR.GetNameDef]'de geniş çapta saygı görse de, [FROM.GetNameDef]'da [FROM.GetAdjective] vatandaşları tarafından beceriksiz bir lider olarak geniş çapta alay edildiğini söyledi. [FROM.GetLeader] daha sonra [TUR.GetNameDef]'yi başarısız bir devlet olarak adlandırdı ve ulusumuzun varlığının [FROM.GetAdjective] ulusuna affedilemez bir hakaret olduğunu uzun uzadıya anlattı. Uzun konuşmasında, [FROM.GetLeader] Sevr Antlaşması'nın yerine getirilmemiş vaatlerini otuz yedi defadan az olmamak üzere andı. \n\n[TUR.GetLeader], [FROM.GetAdjective]'ların konumunu 'talihsiz' olarak nitelendirdi, ancak daha sonraki bir tarihte daha fazla diplomatik diyalog için bir fırsat olabileceğini umduğunu belirtti."
 bftb_turkey.37.t:0 "[FROM.GetNameDefCap] Teklifimizi Reddediyor!"
 bftb_turkey.38.a:0 "Karşılıklı yararımız için birlikte çalışalım."
 bftb_turkey.38.b:0 "Sınırlarımıza müdahale etmelerini kabul edeceğimizi düşünmeleri aptallıktı."
 bftb_turkey.38.desc:0 "[FROM.GetAdjective] hükümeti, madencilik çabalarımızdan elde edilen cevher çıktısını değerlendirmek için Gürcistan'a araştırmacılar ve maden arayıcıları gönderdiğini itiraf etti ve her iki ulusumuzun da ortak bir mineral çıkarma çabasından nasıl daha iyi faydalanabileceğini öneren bir portföyle bize yaklaştı. Bir devlet aktörünün bir tür casusluğu itiraf etmesi ve ardından bu itirafı iki ulusumuz arasında daha yakın ilişkiler kurma planına dönüştürmeye çalışması belki de eşi benzeri görülmemiş bir olgudur, ancak şimdi içinde bulunduğumuz durum budur. Kimse [FROM.GetAdjective] hükümetinin risk almaktan çekinen bir hükümet olduğunu inkâr edemez. \n\n[FROM.GetAdjective] portföyü kapsamlı ve detaylı; [FROM.GetAdjective]ler buldukları cevher damarlarını ortaya çıkarıp çıkaracak ve ganimetin çoğunu bize sağlarken, buluntuların bir kısmını kendi kullanımları için [354.GetName] eyaletine taşıyacaklar. [FROM.GetAdjective]lerin keşfettiklerini muhtemelen önümüzdeki uzun yıllar boyunca ortaya çıkaramayacağız, ancak bize gönderilen planları Gürcistan'daki çıkarma süreçlerimizi daha düşük bir verimle ve [FROM.GetAdjective] yardımına ihtiyaç duymadan iyileştirmek için kullanabiliriz. Yalnız çalışıp çalışmayacağımıza veya [FROM.GetAdjective] hükümetinin yardım teklifini kabul edip etmeyeceğimize karar vermek bize düşüyor."
 bftb_turkey.38.t:0 "[FROM.GetNameDefCap] Kafkasya'da Ortak Kaynak Çıkarma Çabası Öneriyor"
 bftb_turkey.39.a:0 "Diplomatik bir zafer!"
 bftb_turkey.39.desc:0 "[TUR.GetAdjective] yetkililer bu işi başardıkları için pek memnun. Zira [FROM.GetAdjective] hükümeti, onlara sunduğumuz o karmaşık manifestodaki plana uyacaklarını ve Gürcistan'daki ortak maden çıkarma işine devam etmek istediklerini az önce bildirdi.\n\nHatta devlet, hazırlıklara şimdiden başladı bile. Bu sayede, Gürcistan'dan cevher çıkarıldığı gibi, işlenip kendi kullanımımıza sunulması için hemen [354.GetName] eyaletine yollanacak ve hazır hale getirilecek."
 bftb_turkey.39.t:0 "[FROM.GetNameDefCap] Teklifimizi Kabul Ediyor"
 bftb_turkey.4.a:0 "Silahlı Kuvvetleri derhal seferber edin!"
 bftb_turkey.4.b:0 "Bu gülünç sirk bizi pek ilgilendirmiyor."
 bftb_turkey.4.desc:0 "[TUR.GetLeader], Türk Boğazları'nın artık tamamen [TUR.GetNameDef]'nin kontrolü altına gireceğini ve böylece [TUR.GetAdjective] hükümetine Boğazları kendi takdirlerine göre bize kapatma yetkisi vereceğini ilan etti! Bu kesinlikle kabul edilemez: bu, [TUR.GetAdjective] hükümetinin, siyasi olarak uygun gördükleri her an kendi filolarımızı Karadeniz'de tuzağa düşürme hakkına sahip olduklarına karar verdikleri anlamına geliyor."
 bftb_turkey.4.t:0 "[TUR.GetNameDef] Boğazın Kontrolünü Ele Geçiriyor!"
 bftb_turkey.40.a:0 "Piçler!"
 bftb_turkey.40.desc:0 "[FROM.GetAdjective] yetkililerinin, [FROM.GetAdjective] hükümetinin izniyle Gürcistan'da madencilik yapma teklifimize inanmaz bir şekilde tepki verdikleri bildirildi. Talebimizle alay edildi ve belki daha da aşağılayıcı bir şekilde, [FROM.GetAdjective]lar portföyümüzle birlikte sunduğumuz bazı planları, bulduğumuz cevherleri biz olmadan çıkarmak için kullanıyorlar."
 bftb_turkey.40.t:0 "[FROM.GetNameDefCap] Teklifimizi Reddediyor!"
 bftb_turkey.41.a:0 "Tek vücut olarak birleşerek Balkanları savunabiliriz."
 bftb_turkey.41.b:0 "Bu girişim, [FROM.GetAdjective] ulusunun o körü körüne milliyetçiliğinin bir ürünü olan aptalca bir hayalden başka bir şey değil."
 bftb_turkey.41.desc:0 "[FROM.GetNameDef] Başkanı [FROM.GetLeader], Balkan Paktı'nı Balkan Antantı adı verilen daha geniş ve her şeyi kapsayan bir stratejik ittifaka resmen dönüştürmek için bir girişim başlattı. Balkan Paktı'nın tüm üyeleri [FROM.GetFactionName]'na katılmaya davet edildi ve buna biz de dahiliz. \n\n[FROM.GetNameDef] ulusundan yetkililer, [FROM.GetFactionName]'nda uluslar arasında kurulan ilişkinin salt askeri meselelerin çok ötesine geçeceğini ve para sistemlerimizi, savunma stratejilerimizi ve daha fazlasını ortaklaşa geliştirmek için planların özetlerini şimdiden yayınladıklarını temin ettiler."
 bftb_turkey.41.t:0 "[FROM.GetNameDefCap] Bizi [FROM.GetFactionName] İttifakına Davet Ediyor"
 bftb_turkey.42.a:0 "Birlikte, Balkanları kurtaracağız."
 bftb_turkey.42.desc:0 "[FROM.GetLeader], [FROM.GetNameDef] ulusunun [ROOT.GetFactionName]'nı onaylamaya ve katılmaya karar verdiğini açıkladı. Çatışma kaçınılmaz olarak patlak verdiğinde iki ulusumuzun kaderlerinin bağlanmasını anmak için büyük bir tantana ve art arda iki devlet kutlaması yapıldı."
 bftb_turkey.42.t:0 "[FROM.GetNameDefCap] [ROOT.GetFactionName]'na Katılıyor!"
 bftb_turkey.43.a:0 "Dayanışma bizi kurtarabilirdi, bunun yerine bölünmüşlüğümüz bizi yok edebilir."
 bftb_turkey.43.desc:0 "[FROM.GetLeader], [FROM.GetNameDef] ulusunun [ROOT.GetFactionName]'na katılmayacağını bize bildirdi. Diplomatlarımızın ve hükümet yetkililerimizin hayal kırıklığı ölçülemez ve [FROM.GetNameDefCap] ulusunun Balkan Paktı'ndan ayrılması ve [ROOT.GetFactionName]'nı reddetmesi tüm projeyi tehlikeye attı."
 bftb_turkey.43.t:0 "[FROM.GetNameDefCap] [ROOT.GetFactionName]'na Katılma Başvurusunu Reddediyor!"
 bftb_turkey.44.a:0 "Plan stratejik olarak sağlam!"
 bftb_turkey.44.b:0 "Osmanlı İmparatorluğu'nun çökmesinin bir nedeni var."
 bftb_turkey.44.desc:0 "[FROM.GetNameDef]'den, [FROM.GetAdjective] hükümetinin Levant'taki mülklerimizi koruma sorumluluğunu devralmasını öneren bir savunma planı aldık. [FROM.GetLeader], [FROM.GetNameDef]'nin coğrafi yakınlığının bu toprakları savunmayı ve yönetmeyi basit bir mesele haline getirdiğini ve bu toprakları [FROM.GetNameDef]'ye teslim etmenin kendi kaynaklarımızı başka yerlere yönlendirmemizi sağlayacağını savunuyor. \n\nTeklifin bir değeri yok değil, ama bizi... ilginç bir konuma sokuyor. Filistin, Ürdün ve Sina'yı mağlup Osmanlı İmparatorluğu'ndan ele geçirdik: onu Osmanlı İmparatorluğu'nun [FROM.GetAdjective] haleflerine geri vermeye hazır mıyız? Tarihi düşünceler bir yana, [FROM.GetAdjective] hükümetinin onları reddedersek nasıl tepki verebileceğini de düşünmeliyiz. Reddimizi onlara güvenmediğimizin veya bu ittifaktaki yerlerine değer vermediğimizin bir işareti olarak yorumlayabilirler. [FROM.GetNameDefCap] geçmişte öngörülemez olduğunu kanıtladı ve maalesef [FROM.GetAdjective] yetkililerinin onları reddedersek bu konuyu tırmandırmayacağına inanamayız."
 bftb_turkey.44.t:0 "Petra Teklifi"
 bftb_turkey.45.a:0 "Artık büyükler ligindeyiz."
 bftb_turkey.45.desc:0 "[FROM.GetAdjective] sömürge subayları şimdiden görev yerlerini terk ediyor ve eski [FROM.GetAdjective] sömürgelerini sorunsuz bir şekilde devralmamızı kolaylaştırmak için komşu himayelere taşınıyor. [FROM.GetLeader], Cumhurbaşkanımıza gönderdiği bir mektupta, bize devredilen illeri savunma ve yönetme kabiliyetimiz konusunda [ROOT.GetNameDef]'nin, [FROM.GetNameDef]'ın tam güvenine sahip olduğunu açıkladı. \n\nBirçok [ROOT.GetAdjective] vatandaşı, toprak devrini büyük bir zafer ve [ROOT.GetNameDef]'nin bir kez daha dünya çapında saygı duyulan güçlü bir bölgesel güç olduğunun bir onayı olarak görüyor."
 bftb_turkey.45.t:0 "[FROM.GetAdjective]ler Petra Teklifine Onay Veriyor"
 bftb_turkey.46.a:0 "Denedik ve başarısız olduk. Yapabileceğimiz başka bir şey yok."
 bftb_turkey.46.b:0 "Meseleyi tırmandıracağız!"
 bftb_turkey.46.desc:0 "[FROM.GetNameDef] Başbakanı [FROM.GetLeader], Levant'taki [FROM.GetAdjective] topraklarının [ROOT.GetNameDef]'ye teslim edilmesinin düşünülemez bir eylem olacağını söyledi ve bölgede devam eden [FROM.GetAdjective] yönetiminin bilgeliğin gereği olduğu konusunda uyardı. Levant'taki [FROM.GetAdjective] kuvvetleri, bölgeye herhangi bir beklenmedik [ROOT.GetAdjective] saldırısının hızla engellenebilmesini sağlamak için teyakkuza geçirildi. \n\nÖzel olarak, birçok hükümet yetkilimiz [FROM.GetAdjective] kararından duydukları hayal kırıklığını dile getirdi ve teklifimizin reddini [FROM.GetAdjective]lerin bize müttefik olarak güvenmediğinin bir kanıtı olarak gösterdi. [ROOT.GetLeader] de [FROM.GetAdjective]lerin kararından duyduğu memnuniyetsizliği dile getirdi ve danışmanlardan nasıl yanıt verileceğine dair seçenekler sunmalarını istedi."
 bftb_turkey.46.t:0 "[FROM.GetAdjective]ler Petra Teklifini Reddediyor"
 bftb_turkey.47.a:0 "Bakalım [FROM.GetNameDef] bu sorumluluğa hazır mı."
 bftb_turkey.47.b:0 "Bu yeni-sömürgeciliğe müsamaha gösterilemez ve gösterilmeyecektir."
 bftb_turkey.47.desc:0 "[FROM.GetNameDef] Başkanı [FROM.GetLeader], Arabistan körfezlerindeki sömürgelerimizin güvenliğiyle ilgili endişelerini iletmek için bizimle temasa geçti. [FROM.GetAdjective] lider, [FROM.GetNameDef]'nin bölgeyle olan tarihi ve yakınlığı sebebiyle, tüm bölgenin savunma ve idare sorumluluklarını [FROM.GetNameDef]'nin üstlenmesini önerdi. \n\nBazı [ROOT.GetAdjective] yetkilileri, [FROM.GetNameDef]'nin daha yakın zamanda Levant bölgesinin kontrolünü alma talebinde bulunmuş olması nedeniyle bu teklif karşısında endişelerini dile getirdi. Analistler, bu diplomatik toprak kapma girişimlerinin, [FROM.GetNameDef]'yi tüm alt kıtanın tartışmasız gücü yapacak yeni bir statüko kurmak amacıyla [FROM.GetNameDef] tarafından stratejik olarak planlandığından endişe duymaktadır. Gelecekteki endişelere bakılmaksızın, [FROM.GetNameDef] müttefikimiz olarak kalmaya devam ediyor ve eğer öyle kalmalarını istiyorsak, Arap sömürgelerimiz üzerindeki kontrol taleplerini kabul etmek akıllıca olabilir."
 bftb_turkey.47.t:0 "[FROM.GetNameDefCap] Körfez'in Savunması Konusunda Endişelerini Dile Getiriyor"
 bftb_turkey.48.a:0 "Gerçekten de artık büyük bir gücüz."
 bftb_turkey.48.desc:0 "Garnizonlarımız ve yöneticilerimiz için nakliyeler, ikili Arap körfezlerindeki yeni topraklarımıza derhal sevk edilebilmeleri için şimdiden hazırlanıyor. [FROM.GetAdjective]ler bölge üzerindeki yetkilerini geri çekti ve bu toprakların egemenliğini koruma ve yönetme için bize verdi."
 bftb_turkey.48.t:0 "[FROM.GetAdjective]ler Körfez'in Savunmasını Bize Emanet Ediyor"
 bftb_turkey.49.a:0 "Talihsizlik."
 bftb_turkey.49.desc:0 "[FROM.GetAdjective] büyükelçisi, Arabistan'daki [FROM.GetAdjective] toprakları üzerindeki [ROOT.GetAdjective] tasarılarını 'kabul edilemez' olarak nitelendirdi ve konunun derhal kapatılmasını talep etti. Savunma uzmanlarımız, [FROM.GetAdjective] yönetimindeki Arap topraklarını yönetme hakkının bize verilmemesinden hayal kırıklığına uğradılar, ancak [FROM.GetAdjective] yetkilileri, [ROOT.GetNameDef] [FROM.GetFactionName]'in bir parçası olduğu sürece topraklarda demirleme ve üslenme ayrıcalıklarını koruduğumuzu iddia ediyorlar."
 bftb_turkey.49.t:0 "[FROM.GetAdjective]ler Arap Topraklarını Bize Vermeyi Reddediyor"
 bftb_turkey.5.a:0 "Uzlaşmayı teklif edeceğiz."
 bftb_turkey.5.b:0 "Uzlaşma yok, taviz yok - bu işi doğru yapacağız!"
 bftb_turkey.5.desc:0 "[SOV.GetNameDef]'ni temsil eden yetkililer, Türk Boğazları'nı tek taraflı olarak ele geçirmemizi yasa dışı bulduklarını ve kararımızı geri çevirmek için aşırı önlemler almayı planladıklarını çok net bir şekilde ifade ettiler. Diplomatlarımızın baskısına rağmen, [SOV.GetAdjective] yetkilileri, kendi iradelerini dayatmak için [TUR.GetNameDef]'ye askeri bir müdahale ihtimalini göz ardı etmeyi reddettiler.\n\nMevcut statükoyu sürdürmek düşünülemez ve [SOV.GetNameDef] bile bunu kesinlikle anlamalıdır. Eğer Karadeniz'deki tüm ülkelere serbest geçiş hakkı sunan bir uzlaşma çözümü teklif edersek, dünyanın parya devleti olmak istemiyorlarsa, [SOV.GetNameDef]'nin teklifimizi kabul etmekten başka seçeneği kalmayacaktır."
 bftb_turkey.5.t:0 "[SOV.GetName] Boğazların Yeniden Askerileştirilmesine Karşı Çıkıyor!"
 bftb_turkey.50.a:0 "En iyilerimizden bazılarını göndereceğiz!"
 bftb_turkey.50.b:0 "Daha standart zırhlı araçlarımızdan bazılarını gönderin."
 bftb_turkey.50.c:0 "Eski modellerimizden bazılarını alabilirler."
 bftb_turkey.50.d:0 "[FROM.GetNameDefCap] bizden kesinlikle hiçbir şey alamayacak."
 bftb_turkey.50.desc:0 "[FROM.GetNameDef] ülkesinden yetkililer, envanterimizden hafif tank satın alma arzusuyla bize yaklaştılar. '[ROOT.GetAdjective] dehası' ve 'tasarımda mükemmellik' olarak adlandırdıkları şeye hayranlıklarını ifade eden [FROM.GetAdjective] yetkilileri, [FROM.GetNameDef] ulusunun kendi egemenliklerini korumak için mutlaka [ROOT.GetAdjective] zırhına sahip olması gerektiğini bize ilettiler."
 bftb_turkey.50.t:0 "[FROM.GetNameDefCap] Hafif Tank Talep Ediyor"
 bftb_turkey.51.a:0 "Ne beklenmedik bir sürpriz!"
 bftb_turkey.51.desc:0 "Az önce kendi stoklarından doğrudan bir sevkiyat [FROM.GetAdjective] tankı aldık! Zırhı modern ve ilk testler onların çok yönlü araçlar olduğunu gösterdi. Şüphesiz silahlı kuvvetlerimize iyi hizmet edecekler."
 bftb_turkey.51.t:0 "[FROM.GetNameDefCap] Geliştirilmiş Hafif Tanklar Gönderiyor!"
 bftb_turkey.52.a:0 "Büyük bir lütuf."
 bftb_turkey.52.desc:0 "Az önce kendi stoklarından doğrudan bir sevkiyat [FROM.GetAdjective] tankı aldık! Hafif zırh ve biraz eski ama kalite testlerimize göre hala oldukça sağlam. Şüphesiz silahlı kuvvetlerimize iyi hizmet edecekler."
 bftb_turkey.52.t:0 "[FROM.GetNameDefCap] Hafif Tank Gönderiyor"
 bftb_turkey.53.a:0 "1922 için yeterince iyiyse, şimdi için de yeterince iyidir!"
 bftb_turkey.53.desc:0 "Az önce kendi stoklarından doğrudan bir sevkiyat [FROM.GetAdjective] tankı aldık! Zırh şüphesiz eski ve [FROM.GetAdjective] ulusu birçok kusuru göz önüne alındığında modeli muhtemelen emekliye ayırdılar. Ne olursa olsun, silahlı kuvvetlerimiz onlar için bir kullanım alanı bulacaktır... bir şekilde."
 bftb_turkey.53.t:0 "[FROM.GetNameDefCap] Modası Geçmiş Zırh Hediye Ediyor"
 bftb_turkey.54.a:0 "Tanklar zaten muhtemelen bozulurdu."
 bftb_turkey.54.desc:0 "[FROM.GetAdjective] ulusu bize en eski modellerinden bir şasi bile göndermeyi reddettiler. [FROM.GetAdjective] zırhı görünüşe göre sadece [FROM.GetAdjective] kullanımı için ve [FROM.GetNameDef] ülkesindeki önde gelen isimlerin iddiaya göre bize herhangi bir zırh sağlamama nedeni olarak ulusal güvenlik endişelerini gösterdiler."
 bftb_turkey.54.t:0 "[FROM.GetNameDefCap] Bize Hiçbir Şey Göndermiyor"
 bftb_turkey.55.a:0 "Demokrasinin tüm dostlarına yardım edeceğiz."
 bftb_turkey.55.b:0 "Onlara yardım edeceğiz... şartlı olarak."
 bftb_turkey.55.desc:0 "1923'te, yeni kurulan Türkiye Cumhuriyeti, [FROM.GetNameDef]'nin petrol sahalarını ve demiryollarını geliştirmemize izin veren bir yasayı onayladı ve kabul etti. Amerika Birleşik Devletleri Senatosu, Büyük Buhran'ın Amerikan ekonomisi üzerindeki etkisini göz önünde bulundurarak, antlaşmayı onaylamama kararı aldı. [FROM.GetNameDef], antlaşmanın feshini geri aldı ve bizden bir kez daha, başlangıçta bizim tarafımızdan hazırlanan imtiyazın şartlarını yerine getirmemizi istedi. \n\nEkonomik olarak 1923'te olduğumuzdan çok daha güvenli bir yerde olduğumuz inkâr edilemez ve [FROM.GetNameDef]'nin bize ideolojik ve askeri olarak bağlı olması büyük bir lütuf olurdu. Ancak, savaş tüm dünyayı tehdit ediyor ve gücümüzün zirvesinde bile kaynaklarımızı nasıl ayıracağımız konusunda ekonomik olmalıyız. [FROM.GetNameDef]'de petrol bulunması gelecekte [SOV.GetNameDef]'ne karşı oldukça değerli bir koz olabilir, ancak kısa vadede o çıkarılan petrolün düşmanlarımızın eline nasıl geçebileceği olasılığını da düşünmeliyiz. [FROM.GetAdjective]'nin yardımımıza olan ihtiyacını kendi amaçlarımızı ilerletmek için kullanmak akıllıca olabilir. [FROM.GetNameDef] çok fazla kroma sahipken, bizim ulusumuz maalesef sahip değil. Seçim bizim."
 bftb_turkey.55.t:0 "Chester İmtiyazı"
 bftb_turkey.56.a:0 "[FROM.GetAdjective]lar gerçekten de en iyisi."
 bftb_turkey.56.desc:0 "[FROM.GetNameDefCap], on yıldan fazla bir süre önce bize yerine getirme sözü verdikleri taahhütleri tazminat istemeden yerine getirmeyi kabul etti. Daha önce güvenilir bir şekilde çıkaramadığımız [350.GetName]'daki petrolü çıkarmak için üstün teknolojilerini ve kapsamlı endüstriyel kaynaklarını kullandılar. [FROM.GetAdjective]lar ayrıca, imtiyazın diğer yönlerini yerine getirmek için petrolü çıkarmak için kullandıkları sanayinin bir kısmını kendi takdirimize göre yeniden kullanmak üzere emrimize bıraktılar. \n\nEk bir dostluk göstergesi olarak, [FROM.GetAdjective]lar, ülkemiz genelinde bulunan doğal kaynaklardan daha iyi yararlanabilmemiz için çıkarma sürecinde kullandıkları bazı teknikleri ve ekipmanları bize miras bıraktılar."
 bftb_turkey.56.t:0 "[FROM.GetNameDefCap] İmtiyazı Koşulsuz Olarak Veriyor"
 bftb_turkey.57.a:0 "İyi, verin o emperyalist alçaklara istediklerini."
 bftb_turkey.57.b:0 "Asla [FROM.GetAdjective]ların boyunduruğu altında yaşamayacağız!"
 bftb_turkey.57.desc:0 "[FROM.GetNameDefCap], on yıldan fazla bir süre önce bize yerine getirme sözü verdikleri taahhütleri yerine getirmeyi kabul etti, ancak tazminat karşılığında. Güvenilir bir şekilde çıkaramadığımız [350.GetName]'daki petrolü çıkarmak için üstün teknolojilerini ve kapsamlı endüstriyel kaynaklarını kullanmaya hazırlar, ancak karşılığında [FROM.GetAdjective]lar [343.GetName]'daki haklara özel kaynaklar istiyor. Anlaşmayı tatlandırmak için, [FROM.GetAdjective]lar bize bazı gelişmiş çıkarma tekniklerini öğretmeye ve kazı için bazı daha karmaşık araçlarının şemalarını vermeye istekli olduklarını ifade ettiler. \n\nİmtiyaz talep etmek yeterince aşağılayıcı olmalıydı, ama bu belki de kabul edilemez olabilir. Ulusumuz anti-emperyalizmin ve anti-sömürgeciliğin meyvelerini temsil etmektir ve eğer [FROM.GetAdjective]ların taleplerini kabul edersek, değerlerimize ihanet etmiş oluruz. Yine de, [FROM.GetNameDef]'nin bize sunabileceği nimetleri geri çevirmeyi göze alabilir miyiz?"
 bftb_turkey.57.t:0 "[FROM.GetAdjective] İmtiyaz İçin Koşullar Koyuyor"
 bftb_turkey.58.a:0 "Bir [FROM.GetAdjective] olmak harika bir şey."
 bftb_turkey.58.desc:0 "[FROM.GetAdjective] hükümeti, yardımımız karşılığında her bir talebimizi kabul etti. Krom, [343.GetName]'dan limanlarımıza girmeye başladı bile ve daha da iyisi, doğu [FROM.GetName]'de petrol çıkarma çabalarımızda aslında birkaç şey öğrendik."
 bftb_turkey.58.t:0 "[FROM.GetNameDefCap] Taleplerimizi Yerine Getiriyor"
 bftb_turkey.59.a:0 "Biz [ROOT.GetNameDef]'yiz, hala kazanan olarak ayrılıyoruz."
 bftb_turkey.59.desc:0 "[FROM.GetAdjective] hükümeti, yardımımız karşılığında oluşturduğumuz çok adil koşullarımızı reddetti. Eğer [FROM.GetAdjective] hükümeti sadece kendi payına düşeni yapmaya istekli olsaydı, o zaman herkes kazanan olarak ayrılabilirdi. Bunun yerine, o kara altından herhangi birini bulmadan önce birkaç yıl daha beklemek zorunda kalacaklar."
 bftb_turkey.59.t:0 "[FROM.GetNameDefCap] Taleplerimizi Reddediyor!"
 bftb_turkey.6.a:0 "Yurtta sulh, cihanda sulh!"
 bftb_turkey.6.desc:0 "[SOV.GetAdjective] hükümeti, barışı bozduğumuz için misilleme ve ceza imaları içeren kısa bir açıklama yaptı, ancak özel olarak yetkililerimize [SOV.GetNameDef]'nden herhangi bir misilleme yanıtı gelmeyeceği konusunda güvence verildi. \n\n[TUR.GetLeader], İstanbul'da radyo aracılığıyla tüm ulusa yayınlanan tutkulu bir konuşma yaparak [TUR.GetNameDef] için bu büyük zaferi ilan etti. Hükümete büyük bir destek seli oldu ve konuyla ilgili kesin zaferimiz için ülke genelinde kutlamalar bekleyebiliriz."
 bftb_turkey.6.t:0 "[SOV.GetName] Boğazların Yeniden Askerileştirilmesini Kabul Ediyor!"
 bftb_turkey.60.a:0 "Ne seçeneğimiz var ki?"
 bftb_turkey.60.b:0 "Hatay'ı istiyorlarsa, gelip zorla alabilirler."
 bftb_turkey.60.desc:0 "[FROM.GetLeader], Suriye'nin Hatay eyaletindeki Türk nüfusunun demokratik referandum hakkına izin verilmesini talep eden sert ifadeli bir mektup yazdı, böylece Hatay halkı [FROM.GetNameDef]'ye katılıp katılmayacaklarına veya süresiz olarak [ROOT.GetNameDef]'nın bir parçası olarak kalıp kalmayacaklarına karar verebilir. Silahlı kuvvetlerimiz, [ROOT.GetAdjective]-[FROM.GetAdjective] sınırında yasa dışı faaliyetler tespit etti; [FROM.GetAdjective] vatandaşları sınırımızı geçerek Hatay ilinde kargaşa yaratıyor. [FROM.GetNameDef]'nin bir [FROM.GetAdjective] zaferi sağlamak için referandum sonuçlarını hileyle değiştirmeyi planladığı açık, ancak belki de Hatay ilini [FROM.GetNameDef]'ye teslim etmek en akıllıca eylem olacaktır. Sınırımızda saldırgan bir [FROM.GetNameDef] ideal bir senaryo değil."
 bftb_turkey.60.t:0 "[FROM.GetName] Hatay Konusunu Gündeme Getiriyor"
 bftb_turkey.61.a:0 "Sizi tekrar aramızda görmekten mutluluk duyarız, kardeşlerim."
 bftb_turkey.61.desc:0 "[ROOT.GetLeader], Antakya'da küçük bir konuşma yaparak Hatay vatandaşlarını [ROOT.GetNameDef]'ye kabul etti ve Hatay halkının demokratik iradesine saygı duyduğu için [FROM.GetNameDef]'dan [FROM.GetLeader]'e teşekkür etti. Bu hamle siyasi yelpazenin dört bir yanından birçok Suriyeli yetkili tarafından öfkeyle karşılansa da, Hatay ve genel olarak [ROOT.GetNameDef]'nin genel havası memnuniyetti ve birçok [ROOT.GetAdjective] insan, [ROOT.GetNameDef]'nin en yeni ilini kutlamalar ve hediye alışverişleriyle kutsamak için evlerinden Hatay'a geziler yaptı. [FROM.GetLeader] konuyla ilgili sessiz kaldı, ancak [FROM.GetAdjective] liderine yakın kaynaklar, [FROM.GetAdjective]'ların bunun sadece geçici bir durum olduğuna ve Hatay'ın gelecekte öyle ya da böyle tekrar kendi ellerine geçeceğine inandığını söylüyor."
 bftb_turkey.61.t:0 "[FROM.GetNameDef] Hatay'ın Egemenliğini Bize Devrediyor"
 bftb_turkey.62.a:0 "[FROM.GetNameDef] yok olmalı."
 bftb_turkey.62.desc:0 "[ROOT.GetLeader], Gaziantep'te ateşli bir mitinge liderlik etti ve burada yurtdışındaki Türklerin [FROM.GetNameDef] tarafından ezilmesini kınadı. [ROOT.GetAdjective] halkı bir kargaşaya sürüklendi ve danışmanlar, [ROOT.GetAdjective] nüfusu arasında bu haksız durumu düzeltmek için savaş kullanma konusunda bir miktar heves olduğunu söylüyor. [FROM.GetNameDef]'nın irademize karşı gelebileceğini düşünmesi tam bir ahmaklıktı - [ROOT.GetNameDef] asla daha küçük güçler tarafından zorbalığa uğramasına izin vermeyecektir."
 bftb_turkey.62.t:0 "[FROM.GetName] Hatay Üzerinde Sıkı Kontrolü Sürdürüyor"
 bftb_turkey.63.a:0 "Diğerlerini kurtararak hala kendimizi affettirebiliriz."
 bftb_turkey.63.b:0 "Bu dünya soğuk ve acımasız, biz de öyleyiz."
 bftb_turkey.63.desc:0 "[FROM.GetLeader], geçen gün [ROOT.GetLeader] ile görüşerek, askeri müdahale gerektiren krizler konusunda birleşik bir duruşa sahip kapsamlı bir pan-Akdeniz ittifakı müzakere etti. [FROM.GetNameDef]'nin bize gönüllü olarak bir ittifakla bağlı olmasının, daha büyük güçlerin desteğinden kaçınmamız anlamına gelse bile, bölgesel hedeflerimize daha fazla meşruiyet kazandırabileceği yönünde bir argüman var. Ayrıca, bizden farklı olarak, [FROM.GetNameDef]'nin aslında Balkanlar ve Akdeniz ulusları arasında oldukça olumlu bir üne sahip olduğunu da düşünmeliyiz. Bu olumlu itibarı, aksi takdirde bizimle hiçbir ilgisi olmak istemeyebilecek ulusların desteğini diplomatik olarak kazanmak için kullanabilirler. \n\nBir yol ayrımındayız: [FROM.GetNameDef] tarafından bize uzatılan zeytin dalını kullanıp onların kalemini diğer büyük güçlere karşı kılıcımızı bilemek için mi kullanacağız, yoksa aşağılık Tötonlara ulaşıp bize uzanan tüm bu küçük güçleri bir bahçedeki yabani otları budar gibi mi keseceğiz? Balkan uluslarının kaderini belirleme gücü tek başına bizde - onları [GER.GetAdjective] ve [SOV.GetAdjective] hegemonyasından kurtarabilir veya bu güçlere yardım edip komşularımızın çöküşünü hızlandırabiliriz. Seçim bizim."
 bftb_turkey.63.t:0 "[FROM.GetNameDefCap] Bizi [FROM.GetFactionName] İttifakına Davet Ediyor"
 bftb_turkey.64.a:0 "Diğer ulusları bu pakta getirmekte acele etmeliyiz."
 bftb_turkey.64.desc:0 "[FROM.GetLeader], ulusuna [FROM.GetNameDef]'nin ruhunun ve kaderinin artık büyük bir törenle ve tantana ile [ROOT.GetNameDef] ile paylaşıldığını gösterişli bir şekilde duyurdu. [ROOT.GetLeader]'de hemen hemen aynı şeyi, ancak çok daha ölçülü terimlerle duyurdu. \n\n[ROOT.GetAdjective] yetkililerinin umudu, [FROM.GetNameDef]'yi yanlarına çekerek onların daha yayılmacı eğilimlerinin bir tasmayla kontrol altında tutulabilmesi ve büyük güç statülerinin bunun yerine Akdeniz'in küçük uluslarını onları bir bütün olarak yutmak isteyen hegemonyalardan korumak için kullanılmasıdır."
 bftb_turkey.64.t:0 "[FROM.GetNameDefCap] [ROOT.GetFactionName] İttifakına Katılıyor"
 bftb_turkey.65.a:0 "Diğer ulusları bu pakta getirmekte acele etmeliyiz."
 bftb_turkey.65.desc:0 "[FROM.GetNameDef]'nin [ROOT.GetFactionName] ittifakına katılmayacağı haberini aldık. [ROOT.GetAdjective] yetkilileri hayal kırıklığına uğradı ve bunun Akdeniz'in geleceği için ne anlama gelebileceği konusunda endişeliler. [ROOT.GetLeader], özel olarak hükümet yetkililerini, olası [FROM.GetAdjective] yayılmacılığına karşı koymak için zorlu bir blok oluşturulabilmesi amacıyla ittifaka daha fazla üye imzalama sürecini hızlandırmaya teşvik etti."
 bftb_turkey.65.t:0 "[FROM.GetNameDefCap] [ROOT.GetFactionName] ittifakına Üyeliği Reddediyor"
 bftb_turkey.66.a:0 "[GRE.GetNameDef]'nın geleceği üzerine adil ve kabul edilebilir bir anlaşma."
 bftb_turkey.66.b:0 "Her şeye sahip olmalıyız!"
 bftb_turkey.66.desc:0 "[FROM.GetNameDefCap], eylem planı üzücü olsa da, ulusal güvenlik bölgeleri için [GRE.GetNameDef]'nın yok edilmesi gerektiğini önerdi. Yetkililerimiz, [FROM.GetAdjective] müttefiklerimizin görüşleriyle coşkuyla ve tüm kalbiyle hemfikir oldular ve bunun en başından beri resmi pozisyonumuz olduğunu onlara hatırlattılar. \n\n[FROM.GetNameDefCap], [GRE.GetNameDef]'ı coğrafi bir önermeye göre bölmeyi öneriyor: bize [185.GetName], [186.GetName] ve [182.GetName] garanti edilecek, böylece Doğu Akdeniz ve İyon Denizi üzerindeki hakimiyetimiz güvence altına alınacak. [FROM.GetNameDefCap], kalan [GRE.GetAdjective] eyaletlerini alacak, bu da birçoğunun zaten sınır komşusu olduğu Ege Denizi üzerinde [FROM.GetAdjective] kontrolünü garanti edecektir. \n\nAnlaşma çoğunlukla adil - en azından serbest bir toprak kapma yarışında bekleyebileceğimizden daha adil. Yine de, uzun zamandır [47.Capital.GetName]'yı imparatorluğumuzun tacı olarak eklemeyi hayal ettik ve bu plan öngörülebilir gelecekte bu hırsı kesinlikle sona erdirecektir. Akdeniz'de barış için [47.Capital.GetName] ödülünü bir kenara bırakmaya hazır mıyız?"
 bftb_turkey.66.t:0 "[FROM.GetNameDefCap] [GRE.GetNameDef]'nın Bölünmesi İçin Plan Öneriyor"
 bftb_turkey.67.a:0 "Maşallah, faşizme karşı Irak'ın ruhu için savaşıyoruz!"
 bftb_turkey.67.b:0 "Kurtuluşumuz ancak faşizmle mümkündür."
 bftb_turkey.67.c:0 "Faşist haşereleri dağıtın."
 bftb_turkey.67.desc:0 "[676.GetName]'tan şok edici haberler; eski başbakan Reşid Ali el-Geylani, [ROOT.GetLeader] hükümetine karşı bir darbe girişiminde bulundu. El-Geylani, ordunun büyük bir kısmının ve hatta bir miktar halk desteğinin desteğine sahip. \n\nDış müdahalenin, Altın Meydan hainlerine silah organize etme ve tedarik etmede hayati bir rol oynadığına şiddetle inanılıyor. Olası tüm devlet aktörleri arasında, faşist darbe girişimini desteklemede en önemli rolü [FROM.GetNameDef] ülkesinin oynadığına inanılıyor. \n\nAltın Meydan, [ENG.GetAdjective] emperyalistlerini [GER.GetNameDef]'nın yardımını isteyerek zorla ortadan kaldırma platformunda kararlılıkla duruyor ve halkımızın çoğu bunun konuyla ilgili çok övgüye değer bir pozisyon olduğunu düşünüyor. Belki de özgür bir Arabistan sadece faşizmle mümkündür..."
 bftb_turkey.67.t:0 "Altın Meydan Darbesi"
 bftb_turkey.68.a:0 "Şimdilik oturup bekliyoruz."
 bftb_turkey.68.desc:0 "[IRQ.GetNameDef]'ta faşist bir darbeyi kışkırtma çabalarımız bolca meyve vermiş görünüyor. [IRQ.GetAdjective] faşistleri şimdi eski iktidar hükümetiyle tüm ülkenin kontrolü için savaşıyor ve kazansak da kaybetsek de bölge üzerinde sağlam kontrolümüzü kurmak için birinci sınıf bir konumda olacağız."
 bftb_turkey.68.t:0 "[IRQ.GetAdjective] İç Savaşı Başlıyor"
 bftb_turkey.69.a:0 "Ne kadar da keyifli bir Makyavelizm!"
 bftb_turkey.69.desc:0 "[IRQ.GetAdjective] faşistler, tam da beklediğimiz gibi, son [IRQ.GetAdjective] sadıklarının ceplerini de temizlemeyi bitirdi. Devlet aygıtlarını ele geçirip kontrol altına alırken bize karşı koyamayacak kadar zayıf olacaklar."
 bftb_turkey.69.t:0 "[IRQ.GetAdjective] Faşistler Üstün Geliyor"
 bftb_turkey.7.a:0 "Pekala, o krizin sona erdiği düşünülebilir."
 bftb_turkey.7.desc:0 "Uzun süren müzakerelerin ardından, [TUR.GetAdjective] hükümeti, Karadeniz'e kıyısı olan tüm uluslara serbest geçişe izin verirken Boğazların kontrolünü ele almaya karar verdi. [TUR.GetNameDef] tarafından sağlanan sağlam teklif, protestoya çok az yer bırakıyor ve zaten [BUL.GetNameDef] ile [ROM.GetNameDef] tarafından aceleyle onaylandı, ki bu da nihayetinde elimizi kolumuzu bağlıyor."
 bftb_turkey.7.t:0 "[TUR.GetNameDefCap] Boğazların Yeniden Askerileştirilmesi Konusunda Uzlaşıyor"
 bftb_turkey.70.a:0 "Oyun en başından hileliydi."
 bftb_turkey.70.desc:0 "[IRQ.GetAdjective] faşistler [IRQ.GetAdjective] sadıklarını devirmeyi başaramadı ve bunun yerine [IRQ.GetAdjective] ordusu tarafından ezildi. Bu mutlak bir rezalet, ancak planlandığı gibi stratejistlerimiz, [IRQ.GetNameDef]'ın şimdi kuvvetlerimiz içeri girip devlet aygıtlarının kontrolünü ele alırken bize karşı koyamayacak kadar zayıf olacağına inanıyor."
 bftb_turkey.70.t:0 "[IRQ.GetAdjective] Faşistler Başarısız Oluyor"
 bftb_turkey.71.a:0 "[IRQ.GetName]? Bizi pek ilgilendirmez."
 bftb_turkey.71.b:0 "Tam desteğimizi alacaklar."
 bftb_turkey.71.c:0 "[ROOT.GetFactionName] ittifakına layık olduklarını kanıtladılar."
 bftb_turkey.71.desc:0 "[IRQ.GetAdjective] faşistler eski iktidar hükümetini başarıyla devirdi ve tüm ülkenin kontrolünü ele geçirdi. [IRQ.GetAdjective] faşistler, birincil hedeflerinden birinin Arabistan'ı ne pahasına olursa olsun [ENG.GetAdjective] nüfuzundan kurtarmak olduğunu ve bunu başarmanın en iyi yolunun [ROOT.GetAdjective] müdahalesi olduğuna inandıklarını açıkça belirttiler."
 bftb_turkey.71.t:0 "[IRQ.GetAdjective] Faşistler [IRQ.GetNameDef]'da Kontrolü Ele Geçiriyor"
 bftb_turkey.72.a:0 "Cesaretleri takdire şayan ve takdir ediliyor!"
 bftb_turkey.72.desc:0 "[FROM.GetAdjective] ulusu hükümetimize desteklerini açıklamaya karar verdiler. Bu tür beyanlar egemenliğimizi kurmada ve temelde [ENG.GetAdjective] emperyalizmine karşı bir ulus olarak rolümüzü meşrulaştırmada inanılmaz derecede önemlidir."
 bftb_turkey.72.t:0 "[FROM.GetNameDefCap] Bizi Destekliyor!"
 bftb_turkey.73.a:0 "[IRQ.GetName] dikkatimize layık değil."
 bftb_turkey.73.b:0 "Pekala... kendimizi İslam'ın Kılıcı ilan etmiştik..."
 bftb_turkey.73.desc:0 "[IRQ.GetAdjective] faşistler eski iktidar hükümetini başarıyla devirdi ve tüm ülkenin kontrolünü ele geçirdi. [IRQ.GetAdjective] faşistler, birincil hedeflerinden birinin Arabistan'ı ne pahasına olursa olsun [ENG.GetAdjective] nüfuzundan kurtarmak olduğunu ve bunu başarmanın en iyi yolunun [ROOT.GetAdjective] müdahalesi olduğuna inandıklarını açıkça belirttiler."
 bftb_turkey.73.t:0 "[IRQ.GetAdjective] Faşistler [IRQ.GetNameDef]'ta Kontrolü Ele Geçiriyor"
 bftb_turkey.74.a:0 "[ITA.GetAdjective]lar yanımızdayken, başarısız olamayız!"
 bftb_turkey.74.desc:0 "[FROM.GetAdjective] ulusu hükümetimize desteklerini açıklamaya karar verdiler. Bu tür beyanlar egemenliğimizi kurmada ve temelde [ENG.GetAdjective] emperyalizmine karşı bir ulus olarak rolümüzü meşrulaştırmada inanılmaz derecede önemlidir."
 bftb_turkey.74.t:0 "[FROM.GetNameDefCap] Bizi Destekliyor!"
 bftb_turkey.75.a:0 "Onlar kutsal ateşin diğer bekçileridir."
 bftb_turkey.75.b:0 "O petrol faşistlerin eline geçmemeli!"
 bftb_turkey.75.c:0 "Kralların kutsal hakkı korunmalıdır."
 bftb_turkey.75.d:0 "Bu asla başka türlü bitmeyecekti."
 bftb_turkey.75.desc:0 "[IRQ.GetNameDef]'tan şok edici haberler; ülkenin petrol rezervlerini yöneten [ROOT.GetAdjective] yetkilileri silahlı muhafızlar eşliğinde [IRQ.GetAdjective]ların sınırlarına götürülerek dışarı atıldı! Yeni [IRQ.GetAdjective] hükümetinin topraklarına bir [GER.GetAdjective] askeri varlığını davet etmeyi planladığı söylentisi de bir o kadar endişe verici. \n\nSanki bu yetmezmiş gibi, istihbarat ayrıca tüm bunların [FROM.GetNameDef] tarafından [GER.GetFactionName] ittifakına yardım etmek amacıyla planlandığını öne sürüyor! Nasıl ilerleyeceğimize karar vermeliyiz: [IRQ.GetAdjective]lar, petrolü ele geçirme kararlarına saygı duyarsak daha tarafsız bir duruş sergileyebilirler, ama diğer yandan o petrolün [GER.GetAdjective]ların eline geçme olasılığını göze alıp alamayacağımıza karar vermeliyiz."
 bftb_turkey.75.e:0 "Egemen bir ulus olarak bu onların hakkıdır."
 bftb_turkey.75.t:0 "[IRQ.GetAdjective]lar Petrolünü Millileştiriyor!"
 bftb_turkey.76.a:0 "Allahu Ekber! Yaşasın [ROOT.GetLeader]!"
 bftb_turkey.76.desc:0 "[FROM.GetAdjective]ler, petrol sahalarımızın tüm kontrolünü bize bıraktı. Egemenliğimiz bizimdir: emperyalistleri kendi oyunlarında yendik!"
 bftb_turkey.76.t:0 "[ENG.GetAdjective]ler Bize Boyun Eğiyor!"
 bftb_turkey.77.a:0 "İnşallah, Avrupalılar kılıcımızın önünde diz çökecek."
 bftb_turkey.77.b:0 "Ne kadar çılgın bir dünyada yaşıyoruz!?"
 bftb_turkey.77.desc:0 "Korkunç ve acımasız bir kader cilvesine maruz kaldık: [ENG.GetAdjective]ler ve [GER.GetAdjective]lar birbirleriyle ittifak içindeler! O çok önemli [GER.GetFactionName] desteğine ihtiyacımız vardı ama o hain [ENG.GetAdjective] köpekleri bizden önce davrandı! \n\nBu gerçekten de [ROOT.GetAdjective] tarihinde karanlık bir gün. Yalnız kaldık, bizi [TUR.GetAdjective]lerden başka destekleyecek kimse yok - ki onlar da neredeyse kesinlikle bizi engellemek için ortak bir [ENG.GetAdjective]-[GER.GetAdjective] çabası karşısında sinip kaçacaklardır. Bunu yaptıkları için onları suçlayabilir miydik ki? Aklı başında kim böyle güçlü bir ikiliye karşı dururdu? Biz denemeye cüret edebilir miyiz ki?"
 bftb_turkey.77.t:0 "Anglo-[GER.GetAdjective] İttifakı"
 bftb_turkey.79.a:0 "[FROM.GetNameDef] ile dostane bağlar ancak olumlu sonuçlar doğurabilir."
 bftb_turkey.79.b:0 "Maalesef, onlar için yeni planlarımız var."
 bftb_turkey.79.desc:0 "Tarihsel olarak [FROM.GetNameDef] ile birbirimizi benzer düşünen anti-emperyalistler olarak gördüğümüz için çok dostane ilişkilerimiz oldu, ancak son birkaç yıldır bağlar soğudu. \n\nİki ülkemiz arasındaki ilişkileri ısıtma girişimi olarak, [FROM.GetLeader] yıllar önce imzaladığımız atıl durumdaki saldırmazlık paktının yenilenmesini önerdi. Bu zeytin dalını, [FROM.GetNameDef]'nin yakın gelecekte daha derin iş birliği seviyelerine açık olabileceğinin bir işareti olarak görmeliyiz, ancak [ROOT.GetLeader]'de Türk Boğazları'na göz diktiğini bir sır olarak saklamadı. Hangi seçeneğin daha tercih edilir olduğuna karar vermeliyiz: istekli bir [FROM.GetAdjective] müttefiki mi, yoksa bir [FROM.GetAdjective] vasalı mı."
 bftb_turkey.79.t:0 "[FROM.GetNameDefCap] Saldırmazlık Paktının Yenilenmesini Talep Ediyor"
 bftb_turkey.8.a:0 "[TUR.GetNameDef]'yi Bolşevik tiranlığına karşı desteklemeliyiz."
 bftb_turkey.8.b:0 "[SOV.GetAdjective] yayılmacılığını yatıştırmak, barış için ödenecek küçük bir bedeldir!"
 bftb_turkey.8.desc:0 "[SOV.GetName], [TUR.GetNameDef]'nin boğazlarının kontrolünü geri alma planına karşı çıktı ve yine de [TUR.GetNameDef], [SOV.GetAdjective] tehditleri karşısında meydan okumaya devam ediyor. [TUR.GetNameDef] egemenliğini kabul ettirmeye çalışırken ve [SOV.GetNameDef] bölge üzerinde hakimiyet kurmak için bir hamle yaparken durum silahlı çatışmaya dönüşme tehlikesiyle karşı karşıya. \n\nGüç dengesi bizim ellerimizde: [TUR.GetNameDef]'ye olan desteğimizi Sovyetler Birliği'ni caydırmak için bir bağımsızlık garantisiyle meşrulaştırmak mı yoksa durumdan ellerimizi yıkayıp iki ülkenin de kendilerini soktukları dar çarpışma rotasından çıkmalarını ummak mı istediğimize karar vermeliyiz."
 bftb_turkey.8.t:0 "Karadeniz'de Çatışma Başlıyor"
 bftb_turkey.80.a:0 "Barış için harika bir gün."
 bftb_turkey.80.desc:0 "[FROM.GetNameDef]'den olumlu haberler olduğunu bildirmekten memnuniyet duyarız; yenilenmiş bir saldırmazlık paktı önerimize [FROM.GetAdjective] tarafının yanıtının çok coşkulu olduğu haberini aldık. Yetkililerimiz, hafta sonundan önce anlaşmanın son ayrıntılarını halledebileceğimize inanıyor."
 bftb_turkey.80.t:0 "[FROM.GetAdjective]ler Saldırmazlık Paktını Yenilemeyi Kabul Ediyor"
 bftb_turkey.81.a:0 "Bu ancak korkunç bir anlama gelebilir."
 bftb_turkey.81.desc:0 "[FROM.GetNameDef]'nin eski saldırmazlık paktımızı yenileme niyetinde olmadığı haberini aldık. Aksine, [FROM.GetAdjective] yetkilileri önceki antlaşmamızı zaten feshettiler, ki bu da bizimle [FROM.GetNameDef] arasındaki ilişkilerin önümüzdeki yıllarda sıcak olmaktan başka bir şey olacağı yanılsamasını tamamen ortadan kaldırıyor."
 bftb_turkey.81.t:0 "[FROM.GetAdjective]ler Saldırmazlık Paktını Yenileme Planını Reddediyor"
 bftb_turkey.82.a:0 "Ne yapmayı seçtikleri gerçekten umrumuzda değil."
 bftb_turkey.82.desc:0 "Türkiye Komünist Partisi'nin sürgündeki yetkilileri, [ROOT.GetLeader] tarafından haklarındaki tüm suçlamaların affedilmesiyle [ROOT.GetNameDef]'ye geri kabul edildi. TKP parti yetkilileri, hükümetin bazı üyeleri tarafından sıcak bir şekilde karşılanırken, hükümetin daha  Kemalist üyeleri tarafından dışlandı. \n\n[ROOT.GetLeader] eski sürgün yetkililerden hiçbirini kişisel olarak karşılamasa da, hükümetin katılımcı üyeleri olarak hizmet etmeleri için açık bir davet yayınlandı. Herhangi bir TKP yetkilisinin hükümet kabinesinde hizmet edip etmeyeceği, nihayetinde hükümetin kendisine bağlı bir karardır."
 bftb_turkey.82.t:0 "Türkiye Komünist Partisi Yasağı Kaldırıldı"
 bftb_turkey.83.a:0 "Bir daki-"
 bftb_turkey.83.desc:0 "Türkiye Komünist Partisi'nin sürgündeki yetkilileri, [ROOT.GetLeader] tarafından haklarındaki tüm suçlamaların affedilmesiyle [ROOT.GetNameDef]'ye geri kabul edildi. TKP parti yetkilileri, hükümetin bazı üyeleri tarafından sıcak bir şekilde karşılanırken, hükümetin daha  Kemalist üyeleri tarafından dışlandı. \n\nBeklenmedik darbe, [ROOT.GetLeader]'nün ev sahipliği yaptığı resmi bir karşılama töreninde gerçekleşti. Şefik Hüsnü sahneye çıkarak, Moskova'da kullanılan sisteme daha yakın bir yönetim tarzı lehine burjuva ve revizyonist Kemalist rejimin feshedildiğini duyurdu. Ülke çapındaki Kemalist yetkililer ve subaylar saatler içinde toplanıp tutuklandı ve eğer raporlar doğruysa, tüm süreç boyunca olaya karışan [SOV.GetAdjective] failler vardı."
 bftb_turkey.83.t:0 "Türkiye Komünist Partisi'nin Dönüşü"
 bftb_turkey.84.a:0 "[SOV.GetNameDefCap] bu meseleye adil bir şekilde arabuluculuk yapacak."
 bftb_turkey.84.b:0 "Demokratik olarak oy kullanıyoruz... başkalarından yardım istemek için!"
 bftb_turkey.84.c:0 "Elbette biri bizi bu Marksist pislikten kurtaracaktır!"
 bftb_turkey.84.d:0 "Dostlarımız güvenliğimizi garanti edecek."
 bftb_turkey.84.desc:0 "[FROM.GetNameDef] ulusundaki o cehennemlik yılanlar, bize tek taraflı olarak silahsızlanmamızı ve '[ROOT.GetAdjective] işçilerinin güvenliğini ve haklarını garanti altına alabilmeleri' için topraklarımızda [FROM.GetAdjective] askerlerinin varlığına izin vermemizi talep eden bir talep gönderdiler. Bu gülünç taleplerin arkasındaki amaç açık: [FROM.GetNameDef], işlerimize ve egemenliğimize tam kontrol uygulamayı amaçlıyor. \n\nBiz dünya meselelerinde önemsiz bir orta halli güç değiliz, biz [ROOT.GetNameDef] ulusuyuz! Bizi bekleyen bir kurbandan başka bir şey olarak görmeyen bariz bir şekilde kötü niyetli bir güç tarafından bu şekilde itilip kakılmamıza izin veremeyiz. Dışarıda müttefikler aramalıyız; kesinlikle [FROM.GetAdjective] savaş çığırtkanlığına karşı bizimle birlikte duracak en az bir ülke olmalı! Ama yine de, olası [ROOT.GetAdjective] can kaybı gerçekten riske değer mi?"
 bftb_turkey.84.e:0 "[ROOT.GetAdjective] canları her şeyden önce gelir."
 bftb_turkey.84.t:0 "[FROM.GetNameDefCap] Boyun Eğmemizi Talep Ediyor"
 bftb_turkey.85.a:0 "[TUR.GetNameDefCap] komünizmi tekelleştirmeye çalışıyor!"
 bftb_turkey.85.b:0 "[TUR.GetNameDefCap] kıtasal dengeyi tehlikeye atıyor!"
 bftb_turkey.85.c:0 "Kızılların başıboş dolaşmasına izin verilemez."
 bftb_turkey.85.d:0 "[FROM.GetAdjective] çatışmaları bizim endişemiz değil."
 bftb_turkey.85.desc:0 "[FROM.GetNameDefCap] ulusundan yetkililer, [TUR.GetAdjective] saldırganlığı karşısında onlara koruma sunacağımız umuduyla bize yaklaştılar. [FROM.GetAdjective]lar, [FROM.GetNameDef] ulusunun [TUR.GetAdjective] nüfuz alanına kaybedilmesinin kıtasal denge için neden çok zararlı olacağını açıklayan oldukça kapsamlı bir portföy sundu ve onlara yardım etmeye karar vermemiz umuduyla kendi kendilerini yönetme haklarını tutkuyla savundular."
 bftb_turkey.85.t:0 "[FROM.GetNameDefCap] [TUR.GetNameDefCap] Saldırganlığına Karşı Arabuluculuk Arıyor"
 bftb_turkey.86.a:0 "[ROOT.GetNameDef] ulusunun gerçek dostları."
 bftb_turkey.86.desc:0 "[FROM.GetNameDef] ulusunun [TUR.GetAdjective] saldırganlığı karşısında bağımsızlığımızı garanti etme niyetinde olduğu haberini aldık. Bu bizim için büyük bir diplomatik zafer ve umarım [TUR.GetNameDef]'nin önümüze koyduğu fahiş talepleri yeniden gözden geçirmesine neden olur."
 bftb_turkey.86.t:0 "[FROM.GetNameDefCap] Bağımsızlığımızı Garanti Ediyor"
 bftb_turkey.87.a:0 "Ne olursa olsun devam ediyoruz."
 bftb_turkey.87.b:0 "Bu acı verici bir aksilik."
 bftb_turkey.87.desc:0 "O alçak [BUL.GetAdjective]lar, bağımsızlık için umutsuz arayışlarında onları destekleyecek başkalarını buldular! Bu kesinlikle kaçınmak istediğimiz bir komplikasyon. İlerlemeye devam edip taleplerimizi zorla kabul ettirmeye istekli olup olmadığımıza veya daha büyük bir savaşı önlemek için geri adım atma zamanının gelip gelmediğine karar vermeliyiz."
 bftb_turkey.87.t:0 "[BUL.GetNameDefCap] Dışarıdan Destek Alıyor"
 bftb_turkey.88.a:0 "Muzafferiz!"
 bftb_turkey.88.desc:0 "[FROM.GetAdjective] hükümeti ve silahlı kuvvetlerinin geri çekildiği ve şimdi gerilimi düşürmeye çağırdığı haberini az önce aldığımız için hükümetimizin genel ruh halini sevinç olarak tanımlayabiliriz. Bu hem [ROOT.GetAdjective] devleti hem de [ROOT.GetAdjective] halkı için muazzam bir zaferdir."
 bftb_turkey.88.t:0 "[FROM.GetNameDefCap] Geri Adım Atıyor!"
 bftb_turkey.89.a:0 "Başka seçeneğimiz yok, teslim olmalıyız."
 bftb_turkey.89.b:0 "Savaşmadan teslim olmayacağız!"
 bftb_turkey.89.desc:0 "[ROOT.GetLeader], [TUR.GetAdjective] saldırganlığına karşı tek bir ulusun bile [ROOT.GetNameDef] ulusunu desteklemeyeceği şeklindeki korkunç haberi duyduktan sonra teselli edilemez durumda. Diğer güçlerin kayıtsız tavrı bizi korkunç bir ültimatomla baş başa bırakıyor: diren ve savaş ya da teslim ol ve canları kurtar."
 bftb_turkey.89.t:0 "Hiçbir Ulustan Destek Almıyoruz"
 bftb_turkey.9.a:0 "Her şey kaybedildi, tamamen [SOV.GetNameDef]'nin kaprislerine teslim olmalıyız."
 bftb_turkey.9.b:0 "Hiçbir şey değişmedi, rotamızı korumalıyız."
 bftb_turkey.9.desc:0 "Başbakan [ENG.GetLeader], bizimle [SOV.GetNameDef] arasındaki artan gerilimler göz önüne alındığında, [ENG.GetNameDef]'nin 'bölgesel bir anlaşmazlık' olarak adlandırılan bir şeye karışmayı göze alamayacağını kamuoyuna açıkladı. Büyük Savaş'taki [ENG.GetAdjective] kayıplarına atıfta bulunan [ENG.GetLeader], [SOV.GetNameDef]'ne karşı bir yatıştırma politikasını destekledi. \n\nDuyuru Ankara'da hayal kırıklığıyla karşılandı ve [TUR.GetLeader], [ENG.GetNameDef]'nin korkaklığını kınadı."
 bftb_turkey.9.t:0 "[ENG.GetAdjective]ler Bizi Terk Ediyor"
 bftb_turkey.90.a:0 "Özgürlükleri şimdi tamamlandı."
 bftb_turkey.90.desc:0 "[FROM.GetAdjective] yetkililerinin geri çekildiği ve yetkiyi, [FROM.GetNameDef] ulusunu yönetmek için kendi parti yetkililerimiz tarafından özenle seçilmiş yeni bir komünist bakanlar grubuna devrettiği haberiyle dünya çapında devrime bir adım daha yaklaştık. [FROM.GetAdjective] orduları ve sanayisi üzerinde kontrol sahibi olmak, bizi bölgede ve Avrupa'da daha da büyük bir güç konumuna getiriyor."
 bftb_turkey.90.t:0 "[BUL.GetNameDefCap] Bize Teslim Oluyor"
 bftb_turkey.91.a:0 "O zaman onları yola getireceğiz."
 bftb_turkey.91.desc:0 "[FROM.GetNameDef]'ın son derece makul taleplerimize karşı meydan okuduğuna dair beklenmedik bir rapor aldık. [FROM.GetAdjective] hükümeti en az direnişin yolunu seçebilirdi, bunun yerine acı yolunu yürümeye karar verdiler."
 bftb_turkey.91.t:0 "[BUL.GetNameDefCap] Meydan Okuyor"
 bftb_turkey.92.a:0 "[ROOT.GetNameDef] ulusuna her zaman sevgili bir dost olacaksınız."
 bftb_turkey.92.desc:0 "[FROM.GetLeader], bir dostluk antlaşması ve saldırmazlık paktı tekliflerine sunulduğunda çok hevesliydi ve imzalarını antlaşmamıza atmak için hiç vakit kaybetmedi. Onların anlaşmasıyla, yurtta sulh ve cihanda sulh hedefine bir adım daha yaklaştık!"
 bftb_turkey.92.t:0 "[FROM.GetName] Sadabat Paktı'nı İmzalıyor"
 bftb_turkey.93.a:0 "...sadece 'hayır' diyebilirdin."
 bftb_turkey.93.desc:0 "[FROM.GetLeader], [ROOT.GetLeader]'ye uzun bir mektup yazarak, bir dostluk antlaşması ve saldırmazlık paktı teklifinin, üzerine yazıldığı kağıt ve mürekkebe değmediğini bildirdi. [FROM.GetLeader], [FROM.GetNameDef] ile [ROOT.GetNameDef] arasında resmileştirilmiş bir ittifaktan daha azının sadece zaman kaybı olduğunu ve bundan sonra herhangi bir gelecekteki [ROOT.GetAdjective] planından muaf tutulmayı tercih edeceklerini yazmaya devam etti."
 bftb_turkey.93.t:0 "[FROM.GetName] Sadabat Paktı'nı Reddediyor!"
 bftb_turkey.94.a:0 "Ulus, açgözlülüğümüz yüzünden kan ağlıyor..."
 bftb_turkey.94.desc:0 "[ROOT.GetAdjective] ekonomistleri, ülke para biriminin değer kaybetmesi ve ulusumuzun bir buhran belirtileriyle boğuşmasıyla tam bir panik içindeydi. Büyük Buhran'ın en kötü etkilerinden bu kadar ustaca kaçan ulusumuzun, dünyanın geri kalanı ekonomik sıkıntılarından kurtulurken şimdi böyle bir ekonomik sıkıntıya düşmesi korkunç bir trajedi. \n\nKamu kurumlarına olan güven tarihi düşüşlere geriledi ve halk, ülkenin çektiği acılardan mevcut [ROOT.GetAdjective] yönetiminin sorumlu olduğunun geniş çapta farkında."
 bftb_turkey.94.t:0 "Ekonomi Çöküyor"
 bftb_turkey.95.a:0 "Eski ihtişamımız geri alınmayı bekliyor..."
 bftb_turkey.95.b:0 "Sadakatimiz Cumhuriyete ve demokrasiyedir!"
 bftb_turkey.95.desc:0 "[ROOT.GetAdjective] devletinin yönetiminde dinin önemi konusunda bizimle tamamen aynı fikirde olan bazı benzer düşünen bireylerden bir teklif aldık, ancak bu davacıların sadece Yüce Allah'a değil, daha fazlasına sadık olduklarını kesin olarak biliyoruz. Osmanlı İmparatorluğu'nun eski subayları ve generalleri tarafından, tarihimizin geri kalanı için geniş kapsamlı sonuçları olacak bir seçimle bize yaklaşıldı: Sultan'ı tahtına geri getirmek istiyorlar. \n\nBu teklif tamamen sürpriz değil, çünkü birçok bakanımız ve seçmenimiz özel olarak Osmanlı Saltanatı'nın çöküşünden duydukları hayal kırıklığını dile getirdi ve yurtdışında yaşayan Osmanlı kaçaklarıyla dostane yazışmalarından gururla bahsetti. Şüphesiz seçmenlerimiz kararımızı her iki şekilde de destekleyecektir, ancak üst yönetimimiz bölünmüş durumda. Cumhuriyete ve Mustafa Kemal Atatürk'ün başardığı her şeye büyük bir saygı var ve eğer bu Osmanlı hayaletleriyle bu paktı imzalarsak, şüphesiz Atatürk'ün cumhuriyetine ölümcül bir darbe vurmuş olacağız."
 bftb_turkey.95.t:0 "Osmanlı Subayları Saltanatı Geri Getirme Şansı Sunuyor"
 bftb_turkey.97.a:0 "Aşağılık Osmanlılar güçlerini abartıyor!"
 bftb_turkey.97.b:0 "1908 boşa gitmiş olmayacak!"
 bftb_turkey.97.c:0 "Osmanlı tehdidine direnmenin bir faydası yok."
 bftb_turkey.97.desc:0 "Tarihin döngüler halinde tekerrür etme alışkanlığı olduğu söylenir, ama kesinlikle aklı başında hiçbir siyaset bilimci şu anda olanı tahmin edemezdi. Hükümetteki birçok kişi arasında ortak bir dejavu hissi var, çünkü az önce [FROM.GetNameDef] ulusundan bir elçi aldık ve görünüşe göre [FROM.GetLeader] boyun eğmemizi talep etti. \n\nBütün bu durum çok saçma! Bu nasıl oldu!? Türk halkı buna nasıl izin verdi? Kendimizi nasıl böyle bir duruma soktuk!? Durum tuhaf, ama tehdit gerçek. Onlarca yıl önce yaptığımız gibi [FROM.GetAdjective] tehdidine karşı durmaya hazır olup olmadığımıza veya zamanın o kadar değişip değişmediğine karar vermeliyiz ki, onların anlaşılmaz güdülerine direnmeye ve gazaplarını riske atmaya cüret edemeyiz."
 bftb_turkey.97.t:0 "[FROM.GetNameDefCap] Boyun Eğmemizi Talep Ediyor"
 bftb_turkey.98.a:0 "Gücümüze karşı koyabilecek kimse yok!"
 bftb_turkey.98.b:0 "1913'ün tekrarını yaşayamayız..."
 bftb_turkey.98.desc:0 "[FROM.GetAdjective] ulusu, otoritemize boyun eğmeyi veya taleplerimizin meşruiyetini tanımayı reddettiler, bunun yerine oldukları gibi korkakça [FROM.GetFactionName] ittifakının kollarına sığınıyorlar. [FROM.GetNameDef] ulusunun müttefikleriyle çatışmayı göze alıp almayacağımıza veya muzaffer yükselişimizin biraz daha ertelenip ertelenmeyeceğine karar vermeliyiz."
 bftb_turkey.98.t:0 "[FROM.GetNameDefCap] Müttefiklerinin Korumasına Güvenmeye Devam Ediyor"
 bftb_turkey.99.a:0 "Büyük bir kriz atlattık!"
 bftb_turkey.99.desc:0 "O çileden çıkarıcı ve çürümüş [FROM.GetAdjective] ulusu gülünç taleplerinden geri adım attılar. Gözden geçirilmiş kararlarında bir miktar bilgelik gösterdiklerini söylemek bir nezaket olurdu, ancak bu, [FROM.GetAdjective] yönetimine şimdiye kadar hak ettiklerinden çok daha fazla paye vermek olurdu. [ROOT.GetNameDef] ile [FROM.GetNameDef] arasında şimdilik barış hüküm sürüyor..."
 bftb_turkey.99.t:0 "[FROM.GetNameDefCap] Taleplerinden Geri Adım Atıyor!"
 byzantinist_civil_war_inevitable_tt:0 "§YBizansçılar§! yakında bizi hükümetten zorla uzaklaştırmaya tekrar çalışacak...\n"
 byzantinist_coup_tt:0 "§YBizansçı faşistler§! bir hükümet kuracak!\n"
 end_of_cyprus_tt:0 "§RBu, Oyunun Sona Ermesiyle sonuçlanacak!§!"
 gott_bless_herr_schacht_tt:0 "Bu seçenek, şu anda bakan olarak §YHjalmar Schacht§!'a sahip olduğunuz için kullanılabilir."
 megali_idea_honoured_greece_tt:0 "§YKandiye Konvansiyonu§! sırasında müttefiklerimize vaat edilen topraklar çoktan devredildi.\n"
 megali_idea_honoured_tt:0 "§Y[GRE.GetNameDef]§! tarafından §YKandiye Konvansiyonu§! sırasında bize vaat edilen topraklar çoktan devredildi."
 potential_war_with_turkey_tt:0 "§RKatılmayı kabul edersek, yakın gelecekte oradaki topraklar karşılığında [TUR.GetNameDef] ile bir savaşa sürüklenme ihtimalimiz yüksek§!."
