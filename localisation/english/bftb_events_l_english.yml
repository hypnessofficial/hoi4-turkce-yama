 BUL_bulgarian_government:0 ""
 BUL_context_of_death_assassinated:0 "Birkaç saat önce, Çar III. Boris Yıllık Ulusal Bizans Çalışmaları Kongresi'ne katıldıktan sonra Sofya Üniversitesi'nden ayrılırken, bir kişi hızla Çar'a yaklaştı, bir silah çekti ve güvenlik güçleri tarafından vurulmadan önce Boris'e birkaç kez ateş etti. Birkaç dakika sonra, hem Çar III. Boris hem de suikastçısı ölü yatıyordu."
 BUL_context_of_death_basic:0 "Bir hafta boyunca ağır bir hastalıktan muzdarip olduktan sonra, Çar III. Boris bugün, [?BUL.BUL_date_of_tsars_death.GetDateStringNoHourLong], [BUL.Capital.GetName]'da belirgin bir kalp yetmezliğinden öldü."
 BUL_context_of_death_eng:0 "[ENG.Capital.GetName]'daki [ENG.GetLeader] ile yaptığı toplantıdan [BUL.Capital.GetName]'a döndükten bir hafta sonra, Çar III. Boris belirgin bir kalp yetmezliğinden öldü."
 BUL_context_of_death_ger:0 "[BUL.Capital.GetName]'a [GER.GetLeader] ile [GetBorisGermanMeetingLocation]'da beklenmedik derecede sert bir toplantıdan döndükten kısa bir süre sonra, Çar III. Boris belirgin bir kalp yetmezliğinden öldü."
 BUL_context_of_death_sov:0 "Çar'ın [SOV.Capital.GetName]'daki [SOV.GetLeader] ile bir toplantıdan [BUL.Capital.GetName]'a dönmesinin ardından, Çar III. Boris belirgin bir kalp yetmezliğinden öldü."
