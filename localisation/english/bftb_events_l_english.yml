 BUL_popular_suspicions_about_death_assassinated:0 "Ulusal güvenlik servisi, kral katlinden sorumlu olanları bulmak için bir soruşturma başlattı. Resmi raporlara göre, suçlunun Bulgar, Alman ve İngiliz belgelerine sahip olması soruşturmayı sadece karmaşıklaştırıyor ve spekülasyonları körüklüyor. Çoğu Bulgar [GER.GetLeader]'i, NKVD'yi veya [ENG.GetAdjective]leri suçluyor, ancak hükümetin kendisinin Çar'ın cinayetine karıştığını iddia etmeye cüret edenler de var..."
 BUL_popular_suspicions_about_death_basic:0 "Ancak, ölüm nedenleri hala belirsiz ve Boris'in son toplantısı sırasında zehirlendiği tahmin ediliyor, birçoğu [GER.GetLeader]'in emriyle olduğuna inanıyor. Diğerleri ise Çar'ı zehirleyenin NKVD olduğuna ikna olmuş durumda. Biri [ENG.GetNameDef]'i işaret etti ve ne kadar rahatsız edici görünse de, bazıları [BUL.GetAdjective] hükümetinin kendisinin Çar'ın ölümüne karıştığını iddia etmeye bile cüret ediyor..."
