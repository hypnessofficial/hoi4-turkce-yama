 YUG_idea_slovene_nationalism_desc:0 "Slovenler uzun zamandır kendi devletlerini istiyorlar. Yönetimimizi kabul etmiş olsalar da, bu konuda pek hevesli değiller. Sloven sanayiciler nadiren yerel işletmelere yatırım yapıyor ve paralarını yurtdışında harcamayı tercih ediyor gibi görünüyorlar."
