l_english:
 ABDA_events.1.a:0 "Birlikte duracağız."
 ABDA_events.1.b:0 "Şu an için buna taahhütte bulunamayız."
 ABDA_events.1.desc:0 "[FROM.GetNameDef] Pasifik tiyatrosu için ortak bir yüksek komuta kurdu ve bize katılmamız için bir davetiye gönderdi. ABDACOM olarak bilinen girişim, bölgede faaliyet gösteren müttefik ulusların deniz, hava ve kara kuvvetlerini birleşik bir komuta yapısı altında toplamayı amaçlıyor. Üyelik, [FROM.GetNameDef] ve çabaya şimdiden taahhüt edilmiş diğer ortaklarla daha yakın koordinasyon anlamına gelecektir. Kabul edip etmeyeceğimize karar vermeliyiz."
 ABDA_events.1.t:0 "Yeni Bir Yüksek Komuta Daveti"
 ABDA_events.2.a:0 "Memnuniyet verici bir gelişme."
 ABDA_events.2.desc:0 "[FROM.GetNameDef], ABDACOM Yüksek Komutasına katılma davetimizi kabul etti. Kuvvetleri artık ortak komuta yapısı altında faaliyet gösterecek ve Pasifik tiyatrosundaki konumumuzu güçlendirecek."
 ABDA_events.2.t:0 "[FROM.GetName] ABDACOM'a Katılıyor"
 ABDA_events.3.a:0 "Talihsiz, ama not edildi."
 ABDA_events.3.desc:0 "[FROM.GetNameDef], ABDACOM Yüksek Komutasına katılma davetimizi reddetti. Kuvvetleri şu an için ortak çabaya taahhüt edilmeyecek, ancak kapı yine de açık kalabilir."
 ABDA_events.3.t:0 "[FROM.GetName] Katılmayı Reddediyor"
 ABDA_events.4.a:0 "Deniz yaklaşımlarını güçlendirin. Singapur'un gücü limanıdır."
 ABDA_events.4.b:0 "Kara çevresini tahkim edin. Gerçek tehdit karadan gelecek."
 ABDA_events.4.c:0 "Dengeli bir yaklaşım. Hiçbir tek saldırı yolu savunmasız bırakılmamalıdır."
 ABDA_events.4.desc:0 "Singapur'un ABDACOM savunma çevresinin bir pimi olarak belirlenmesiyle, komutanlarımız tahkimatlarına nasıl yatırım yapılacağına karar vermelidir. Deniz yaklaşımlarına ve liman savunmalarına öncelik verebilir, kara yaklaşımlarını bir kara saldırısına karşı sertleştirebilir veya kaynaklarımızı her ikisine de yayabiliriz. Her eylem planı, düşman geldiğinde Singapur'un nasıl savunulabileceğini şekillendirecektir."
 ABDA_events.4.t:0 "Singapur Savunması"
 ABDA_events.5.a:0 "Birlikte duracağız."
 ABDA_events.5.b:0 "Şu an için buna taahhütte bulunamayız."
 ABDA_events.5.desc:0 "[FROM.GetNameDef], Amerikan-Britanya-Hollanda-Avustralya Komutasına katılmamız için bir davetiye gönderdi. ABDACOM, kendisini Pasifik tiyatrosundaki Müttefik kuvvetler için yüksek koordinasyon otoritesi olarak kurdu ve büyük Müttefik güçlerin donanmalarını ve ordularını tek bir komuta altında birleştirdi. Üyelik, kuvvetlerimizi bu birleşik yapıya dahil edecek, paylaşılan istihbarata, koordineli doktrine ve Müttefik desteğinin tam ağırlığına erişim sağlayacaktır. Karar vermeliyiz."
 ABDA_events.5.t:0 "ABDACOM'a Katılma Daveti"
 ABDA_faction_membership_requirement_tt:0 "Uygun ittifak üyeleri katılmak için davet alacaklar."
 ABDA_fortress_singapore_choice_tt:0 "Bu milli hedefi tamamlamak, Singapur'un nasıl tahkim edileceğine dair bir seçim sunacak."
 AST_bwc_accept_effect_tt:0 "§YÇağrıyı 3 kez kabul etmenin etkileri:§!"
 AST_bwc_accept_tt:0 "Çağrıyı §Y[?var:AST_bwc_accept]§!/§Y3§! kez kabul et"
 AST_bwc_count_2:0 "[ENG.GetLeader], yakın işbirliğimizin ortak mücadelemizin sonucunu belirleyeceğini talep ederek ikinci kez [AST.GetLeader]'ın katılımını talep ediyor.\n\n"
 AST_bwc_count_3:0 "İngiliz Milletler Topluluğu işbirliğini sürdürmek için [AST.GetLeader]'dan bir kez daha denizleri aşması isteniyor. Ancak çıkarlarımızın ortak çabada mı yoksa kendi işlerimizle ilgilenmekte mi olduğunu açıkça belirttiğimiz sürece, bu tür taleplerin daha fazla gelmesi beklenmiyor.\n\n"
 AST_canberra_air_disaster_events.1.a:0 "Korkunç trajik bir olay."
 AST_canberra_air_disaster_events.1.a.tt:0 "§Y'Kabine Güveni' kararları§! ve mevcut hükümeti kurtarma veya görevden alma §Ygörevini§! açar."
 AST_canberra_air_disaster_events.1.desc:0 "Bugün erken saatlerde, bir Lockheed Hudson uçağı Canberra'nın hemen dışına düştü. Uçaktaki on kişi arasında, bir Kabine toplantısı çağrısına yanıt vermekte olan Ordu Komutanı ve personeli de vardı. Onlar ve uçuş mürettebatı feci şekilde can verdi.\n\nKazaya neyin sebep olduğu bir gizem; hava ideal uçuş koşulları sunuyordu ve uçuş deneyimli RAAF subayı Uçuş Teğmeni Robert Hitchcock tarafından yönetiliyordu.\n\nNedeni ne olursa olsun, tüm ulus için —en başta da kurbanların aileleri ve arkadaşları için— kasvetli bir gün ve Avustralya şimdi liderlerine bakıyor. Nasıl bir yanıt verecekler?"
 AST_canberra_air_disaster_events.1.t:0 "Canberra Hava Felaketi"
 AST_canberra_air_disaster_events.2.a:0 "Gelecek önümüzde yatıyor."
 AST_canberra_air_disaster_events.2.desc:0 "Mevcut hükümet, Canberra Hava Felaketi'ni takip eden ulusal kargaşa boyunca Avustralya'yı başarıyla yönetti. Yol gösterici bir ışık gibi, [AST.GetRulingParty] zor zamanlarda güvenilirliğini ve gücünü kanıtladı ve nihayetinde ulus genelinde kamu desteğini artırdı."
 AST_canberra_air_disaster_events.2.t:0 "[AST.GetRulingParty] Üstün Geldi"
 AST_canberra_air_disaster_events.3.a:0 "Avustralya'nın yardımına yeni bir liderlik."
 AST_canberra_air_disaster_events.3.desc:0 "Başarılı bir güvensizlik oylamasının ardından, mevcut hükümet nihayet değiştirildi ve dizginleri isteksizce haleflerine devretti. Siyasi istikrarsızlık ve kamu güvensizliği döneminden sonra, Avustralya yeni bir başlangıca hazır."
 AST_canberra_air_disaster_events.3.t:0 "Bir Güvensizlik Oylaması"
 AST_canberra_air_disaster_events.4.a:0 "Umarım bu, Avustralya'nın önünü açar."
 AST_canberra_air_disaster_events.4.desc:0 "Siyasi istikrarsızlık ve kamu güvensizliği döneminden sonra, [AST.GetRulingParty] liderliğini değiştiriyor. Bir çoğunluk oyu, Başbakanı istifaya zorluyor ve halefinin kürsüye çıkmasına izin veriyor."
 AST_canberra_air_disaster_events.4.t:0 "Liderlik Değişimi"
 AST_canberra_air_disaster_events.5.a:0 "İddialar asılsız, harekete geçmemize gerek yok."
 AST_canberra_air_disaster_events.5.b:0 "Bu cezasız kalmayacak."
 AST_canberra_air_disaster_events.5.desc:0 "Bir basın toplantısında, [AST.GetName] üzerimize suçlamalar attı, birkaç siyasi yetkilinin ölümüyle sonuçlanan Avustralya topraklarındaki yakın tarihli bir uçak kazasından sorumlu olduğumuzu iddia etti.\n\nSuçlamalar elbette tamamen asılsız, bu da saygısızlığı daha da kötü niyetli hale getiriyor."
 AST_canberra_air_disaster_events.5.t:0 "Avustralya Suçlamaları"
 AST_canberra_air_disaster_events.6.a:0 "Gerilimi daha fazla artırmayacağız."
 AST_canberra_air_disaster_events.6.b:0 "Bu cevapsız kalamaz."
 AST_canberra_air_disaster_events.6.desc:0 "[JAP.GetNameDefCap] suçlamalarımızı hafife almadı, onları ilk saldırganlık eylemi olarak değerlendirdi. [JAP.GetLeader] çatışmayı daha da tırmandırdı ve artık topraklarımızı işgal etmenin ulusunun tam hakkı olduğunu belirtti."
 AST_canberra_air_disaster_events.6.t:0 "[JAP.GetNameDefCap] Misilleme Yapıyor"
 AST_canberra_air_disaster_events.7.a:0 "Elbette bir değişiklik."
 AST_canberra_air_disaster_events.7.desc.a:0 "[ENG.GetNameDefCap]'nin istikrarlı eli ve sağlam rehberliğiyle müdahalesi, [AST.GetAdjective] Genel Valisi Alexander Hore-Ruthven'i [AST.GetName]'nin hâlâ herhangi bir demokratik liderin eline emanet edilemeyeceğine ikna etti.\n\nDemokratik partiler liderlik etme konusundaki yetersizliklerini gösterdiler [AST.GetName] ulusal kriz nedeniyle ortaya çıktı ve özellikle [AST.GetName]'nin ve dünyanın istikrarsız durumu göz önüne alındığında bu yetersizliğe tahammül edilemez; [ENG.GetNameDef], Hore-Ruthven'in kontrolü sona ererse ülkemizde son zamanlarda ortaya çıkan faşist duyguların [AST.GetName]'nin boğazı etrafındaki hakimiyetini tamamen kapatabileceğinden korkuyor.\n\n[AST.GetName], Hore-Ruthven'in ileriki aşamalara kadar sağlayacağı kararlı liderliğe ve birliğe ihtiyaç duyuyor. dikkat edin."
 AST_canberra_air_disaster_events.7.desc.b:0 "Yeni Muhafızlar ve monarşist sempatizanlar, [AST.GetAdjective] Genel Valisi Alexander Hore-Ruthven'i, [AST.GetName]'nin hâlâ herhangi bir demokratik liderin eline emanet edilemeyeceğine ikna ettiler.\n\nDemokratik partiler, [AST.GetName]'yi ulusal kriz boyunca yönetme konusundaki yetersizliklerini gösterdiler ve bu yetersizlik, düzeltilemez. özellikle istikrarsız dünya durumu göz önüne alındığında hoşgörüyle karşılanabilir. [AST.GetName], Hore-Ruthven'in bir sonraki duyuruya kadar sağlayacağı kararlı liderliğe ve birliğe ihtiyaç duyuyor."
 AST_canberra_air_disaster_events.7.t:0 "Hore-Ruthven Görevde Kaldı"
 AST_diplomatic_events.1.a:0 "Kesinlikle — hayır."
 AST_diplomatic_events.1.b:0 "Elbette, imzalayacağız."
 AST_diplomatic_events.1.desc:0 "Son diplomatik çabalarının bir parçası olarak Avustralya hükümeti, seçilmiş birkaç Asya ulusuyla saldırmazlık anlaşmaları imzalamaya çalışıyor; biz de onlardan biriyiz. Bu savaştan kaçınma girişiminin Avustralyalı yetkilileri gerçeklikten kopuk biri olarak mı gösterdiği, yoksa onları onurlu bir masumiyetle mi boyadığı, kısmen vereceğimiz yanıta bağlı olacak.\n\n[AST.GetName] ile saldırmazlık paktı imzalamalı mıyız?"
 AST_diplomatic_events.1.t:0 "Avustralya Saldırmazlık Paktı"
 AST_diplomatic_events.10.a:0 "Kabul etmeliyiz."
 AST_diplomatic_events.10.b:0 "[USA.GetNameDefCap] onlarsız daha güçlü duracaktır."
 AST_diplomatic_events.10.desc:0 "[AST.GetNameDefCap], [USA.GetNameDef] müttefikliğine büyük değer veriyor ve şimdi bunun ortak bir uluslararası savaş zamanı koalisyonunda resmileştirilmesini talep ediyor. Güçlerimizi birleştirerek, iki ulusumuz hem şimdiki hem de gelecekteki çatışmalarda birbirine yardımcı olabilir."
 AST_diplomatic_events.10.t:0 "Bir Savaş Zamanı İttifakı"
 AST_diplomatic_events.11.a:0 "Düşmanlarımız bizden korkacak."
 AST_diplomatic_events.11.desc:0 "[USA.GetNameDefCap] güçlerini birleştirmeyi kabul etti. [AST.GetFactionName] üyeleri olarak, [AST.GetName] ve [USA.GetName] hem şimdiki hem de gelecekteki çatışmalarda birbirlerine yardımcı olacaklar."
 AST_diplomatic_events.11.t:0 "Bir Savaş Zamanı İttifakı"
 AST_diplomatic_events.12.a:0 "Onlarsız durmalıyız."
 AST_diplomatic_events.12.desc:0 "[USA.GetNameDefCap] güçlerimizi birleştirme teklifimizi reddetti. [AST.GetNameDefCap] ve [USA.GetName] kendi savaş çabalarında bölünmüş kalacaklar."
 AST_diplomatic_events.12.t:0 "Reddedilen Bir Savaş Zamanı İttifakı"
 AST_diplomatic_events.13.a:0 "Yapacağız."
 AST_diplomatic_events.13.a.tt:0 "Bir referandum yapılacak ve bu potansiyel olarak §Y[NZL.GetName]§! topraklarının §Rilhakı§! ile sonuçlanacak!"
 AST_diplomatic_events.13.b:0 "Kesinlikle hayır!"
 AST_diplomatic_events.13.desc:0 "Avustralya kolonilerini bir federasyon haline getiren süreçte, Yeni Zelanda sonunda yer almamaya karar verdi. Ancak o günden bu yana, Avustralya Anayasası bizi Commonwealth'in potansiyel eyaletlerinden biri olarak tanımlamaya devam etti ve kabulümüze izin veriyor.\n\n[AST.GetName] şimdi mevcut dünya durumunun birlik gerektirdiğini iddia ediyor ve [NZL.GetName]'in Avustralya otoritesine devredilmesini talep ediyor. Bu konuda bir referandum çağrısı yapmalı mıyız?"
 AST_diplomatic_events.13.t:0 "6. Madde"
 AST_diplomatic_events.14.a:0 "Avustralya genişliyor."
 AST_diplomatic_events.14.desc:0 "Yakın zamanda yapılan referandumun ardından [NZL.GetNameDef], Avustralya Anayasası'nın 6. Maddesini uygulamaya karar verdi. Yeni Zelandalılar topraklarının Avustralya yönetimi altında daha güvenli olduğunu kabul ettiler ve bu nedenle [AST.GetNameDef]'ye katılmayı kabul ettiler."
 AST_diplomatic_events.14.t:0 "[NZL.GetNameDefCap] Bir Avustralya Eyaleti Oluyor"
 AST_diplomatic_events.15.a:0 "Avustralya olduğu gibi kalacak."
 AST_diplomatic_events.15.desc:0 "Yakın zamanda yapılan referandumun ardından [NZL.GetNameDef], Avustralya Anayasası'nın 6. Maddesini uygulamama kararı aldı. [NZL.GetNameDefCap] kendi ülkesi olarak kalacak."
 AST_diplomatic_events.15.t:0 "Yeni Zelanda Halkı Direniyor"
 AST_diplomatic_events.16.a:0 "Avustralya olduğu gibi kalacak."
 AST_diplomatic_events.16.desc:0 "Avustralya'nın baskısına rağmen [NZL.GetNameDef], Avustralya Anayasası'nın 6. Maddesinin uygulanması için referandum yapmamaya karar verdi. [NZL.GetNameDefCap] kendi ülkesi olarak kalacak."
 AST_diplomatic_events.16.t:0 "[NZL.GetNameDefCap]'in Yetkilileri Direniyor"
 AST_diplomatic_events.17.a:0 "Avustralya otoritesi altına girmeyi kabul et."
 AST_diplomatic_events.17.a.tt:0 "§Y[INS.GetNameDefCap]§!, §Y[AST.GetNameDefCap]§!'in bir §Ykuklası§! olacak."
 AST_diplomatic_events.17.b:0 "Askeri erişim sağla."
 AST_diplomatic_events.17.b.tt:0 "§Y[INS.GetNameDefCap]§!, §Y[AST.GetNameDefCap]§! ile §YAskeri Erişim§! yasalaştıracak."
 AST_diplomatic_events.17.c:0 "İkisini de kabul etmeyeceğiz."
 AST_diplomatic_events.17.desc:0 "Düşman kuzeyden geliyor ve kapımıza dayanmasına sadece an meselesi kaldı, ya da en azından Avustralyalı yetkililer böyle iddia ediyor. [AST.GetNameDefCap], [INS.GetName]'i Avustralya otoritesi altına alarak veya en azından askeri erişim sağlayarak tek bir bariyer oluşturmamızı öneriyor."
 AST_diplomatic_events.17.t:0 "Avustralya Ortaklığı"
 AST_diplomatic_events.18.a:0 "Harika!"
 AST_diplomatic_events.18.desc:0 "[INS.GetName] talebimizi kabul etti; işbirliğimiz her iki ulusumuzun savunma yetenekleri üzerinde büyük bir etki yaratacak."
 AST_diplomatic_events.18.t:0 "[INS.GetNameDefCap] Avustralya Talebine Boyun Eğiyor"
 AST_diplomatic_events.19.a:0 "[AST.GetNameDefCap] çatışmaları onlarsız atlatacak."
 AST_diplomatic_events.19.desc:0 "[INS.GetName] talebimizi reddetti; uluslarımız kendi savunmalarının çaresine bakmak zorunda kalacak."
 AST_diplomatic_events.19.t:0 "[INS.GetNameDefCap] Reddediyor"
 AST_diplomatic_events.2.a:0 "En azından onurlu bir girişimdi."
 AST_diplomatic_events.2.desc:0 "[FROM.GetNameDef]'e gönderilen heyet, ulusun saldırmazlık paktı teklifimize verdiği yanıtı telgrafla bildirdi. Girişimin çok kapsamlı olduğunu biliyorduk, bu yüzden [FROM.GetLeader]'in reddetmesi pek şaşırtıcı değil."
 AST_diplomatic_events.2.t:0 "Pasifik Paktı Direnişi"
 AST_diplomatic_events.20.a:0 "[AST.GetLeader] Britanya'ya gitmek üzere yola çıkacak."
 AST_diplomatic_events.20.b:0 "Burada ona ihtiyaç var."
 AST_diplomatic_events.20.desc:0 "[GET_AST_BWC_COUNT][ENG.GetNameDefCap], Avustralya Başbakanı'nı İngiliz Savaş Kabinesi'ne çağırıyor. Dünya durumu vahim, bu da Britanya'yı müttefikleriyle ortak stratejiler ve askeri işbirliği aramaya sevk ediyor.\n\nAncak Avustralya'nın kendi endişeleri var. Britanyalıları memnun etmek için Başbakan'ın zamanından biraz ayırabilir miyiz?"
 AST_diplomatic_events.20.t:0 "Britanya Savaş Kabinesine Çağrı"
 AST_diplomatic_events.22.a:0 "Bedeline değdi."
 AST_diplomatic_events.22.desc:0 "Geçtiğimiz yıl boyunca, Avustralya Başbakanı düzenli olarak Britanya Savaş Kabinesine katıldı. [AST.GetNameDef]'in kendisi zaman zaman bunun bedelini ödemek zorunda kalsa da, ulusumuz Britanya askeri işbirliği sayesinde artık daha güçlü hale geldi."
 AST_diplomatic_events.22.t:0 "Britanya Savaş Kabinesine Başarılı Katkılar"
 AST_diplomatic_events.23.a:0 "Anlaşılabilir."
 AST_diplomatic_events.23.desc:0 "[ENG.GetNameDefCap], Avustralya Başbakanını Britanya Savaş Kabinesine birkaç kez çağırdı, ancak tekrarlanan reddetmelerden sonra [ENG.GetLeader] bunu sürdürmek için herhangi bir neden görmüyor."
 AST_diplomatic_events.23.t:0 "[ENG.GetLeader] Artık Avustralya Savaş Nüfuzu Aramıyor"
 AST_diplomatic_events.24.a:0 "Rüzgarlar değişiyor."
 AST_diplomatic_events.24.desc:0 "Avustralya Başbakanı, İngiliz Milletler Topluluğu'nun savaş çabaları üzerinde büyük bir nüfuz sahibi oldu. Londra'ya yaptığı düzenli ziyaretler sırasında Robert Menzies, kendi Başbakanlarına olan inançları azalırken İngiliz bakanların güvenini kazandı. Bakanlar şimdi [ENG.GetNameDef] liderine istifa etmesi ve Menzies'in onun yerine geçmesi için baskı yapıyor.\n\n[AST.GetName] Başbakanını kaybetse bile, artık Britanya'nın dizginlerinde bulunan Avustralyalı hemşerilerinin koruması altında, efendilerinden sonsuz bir sadakat kazanıyorlar. Uzak diyar artan yetki istiyor ve Robert Menzies buna adını yazdıran ilk kişi."
 AST_diplomatic_events.24.t:0 "Liderlik Değişimi"
 AST_diplomatic_events.25.a:0 "Kabul edeceğiz; Pasifik bölgesi merkezi kontrol altında güçlenecek."
 AST_diplomatic_events.25.b:0 "Kesinlikle hayır!"
 AST_diplomatic_events.25.desc:0 "Pasifik ulusları arasındaki artan gerilim endişe verici ve Britanya kendi savaşlarıyla meşgulken, tebaamızı kurtarma kapasitemiz inanılmaz görünüyor; ya da [AST.GetName] öyle iddia ediyor.\n\nPasifik ve Hint Okyanusu uluslarının doğrudan Canberra'dan yönetilmesi için İngiliz Milletler Topluluğunu yeniden inşa etmeye çalışıyorlar. Kabul etmeli miyiz?"
 AST_diplomatic_events.25.t:0 "Canberra Yönetimi Altında"
 AST_diplomatic_events.26.a:0 "Pasifik ulusları güçlerini birleştiriyor."
 AST_diplomatic_events.26.desc:0 "[ENG.GetNameDefCap] kabul ediyor; Pasifik bölgesi merkezi kontrol altında güçlendirilecek. Britanya Pasifik toprakları otoritemiz altına alındı."
 AST_diplomatic_events.26.t:0 "Pasifik Milletler Topluluğu"
 AST_diplomatic_events.27.a:0 "Yine de, Avustralya dayanacak."
 AST_diplomatic_events.27.desc:0 "[ENG.GetNameDefCap] katılmıyor; Pasifik bölgesi merkezi kontrol altında güçlendirilmeyecek. Pasifik toprakları Britanya otoritemiz olarak kalacak."
 AST_diplomatic_events.27.t:0 "Britanya Talebimizi Reddediyor"
 AST_diplomatic_events.28.a:0 "Avustralya kendi savunmasının çaresine bakmalı."
 AST_diplomatic_events.28.desc:0 "Başbakanın [ENG.GetLeader] ile yaptığı telgraf tartışması, Avustralya için çok az takviye sağladı, ancak Avustralya'nın çıkarlarını savunduğu için [AST.GetLeader]'e karşı Britanya'nın kızgınlığını artırdı."
 AST_diplomatic_events.28.t:0 "[ENG.GetLeader] Telefonu Kapatıyor"
 AST_diplomatic_events.29.a:0 "Yardım hoş karşılanıyor, ancak Japon savaşını önleyemeyecek."
 AST_diplomatic_events.29.desc:0 "Avustralya'nın [ENG.GetNameDef] ile [JAP.GetName] ile bir çatışmayı kışkırtması yönünde yaptığı baskının ardından İngiltere, savunma inşaatı çabalarımızı desteklemeyi kabul etti."
 AST_diplomatic_events.29.t:0 "Britanya Yardımımıza"
 AST_diplomatic_events.3.a:0 "Harika!"
 AST_diplomatic_events.3.desc:0 "[FROM.GetNameDef]'e gönderilen heyet, ulusun saldırmazlık paktı teklifimize verdiği yanıtı telgrafla bildirdi. En memnuniyet verici olanı, [FROM.GetLeader]'in girişimimizi takdir etmesi ve mührünü vurmayı kabul etmesidir."
 AST_diplomatic_events.3.t:0 "Yaşasın Pasifik Paktı"
 AST_diplomatic_events.30.a:0 "Kabul edeceğiz."
 AST_diplomatic_events.30.b:0 "Kaynaklar [AST.GetName]'in alması için değil."
 AST_diplomatic_events.30.desc:0 "Yayılmacı saldırganlar Hindiçini'ye sadece bölgenin kendisi için değil, aynı zamanda sahip olduğu kaynaklar için de bakıyor. Eğer zenginlikler düşman eline geçerse savaşı sadece uzatacaklar, Avustralya elinde olursa bitirmeye yardımcı olabilirler; ya da Avustralya hükümeti böyle iddia ediyor.\n\nTopraklarımız dahilindeki kaynak haklarını onlara vermeyi kabul etmeli miyiz?"
 AST_diplomatic_events.30.t:0 "Avustralya Kaynak Haklarını Talep Ediyor"
 AST_diplomatic_events.31.a:0 "Kontrolümüz dışında."
 AST_diplomatic_events.31.desc:0 "Yayılmacı saldırganlar Hindiçini'ye sadece bölgenin kendisi için değil, aynı zamanda sahip olduğu kaynaklar için de bakıyor. Eğer zenginlikler düşman eline geçerse savaşı sadece uzatacaklar, Avustralya elinde olursa bitirmeye yardımcı olabilirler; ya da Avustralya hükümeti böyle iddia ediyor.\n\n[ROOT.OVERLORD.GetNameDefCap] talebi kabul etti."
 AST_diplomatic_events.31.t:0 "[FROM.GetNameDefCap] [AST.GetName]'e Kaynak Haklarını Veriyor"
 AST_diplomatic_events.32.a:0 "Çok işe yarayacaklar."
 AST_diplomatic_events.32.desc:0 "[FROM.GetNameDefCap], Hindiçini kaynaklarının Avustralya elinde daha iyi kullanılacağını kabul ediyor ve bize kaynak haklarını verdi."
 AST_diplomatic_events.32.t:0 "[FROM.GetNameDefCap] Kaynak Haklarını Veriyor"
 AST_diplomatic_events.33.a:0 "Umarız düşman eline geçmezler."
 AST_diplomatic_events.33.desc:0 "[FROM.GetNameDefCap], Hindiçini kaynaklarının Avustralya elinde daha iyi kullanılacağını kabul etmiyor ve bize kaynak haklarını vermeyi reddediyor."
 AST_diplomatic_events.33.t:0 "[FROM.GetNameDefCap] Kaynak Haklarını Vermeyi Reddediyor"
 AST_diplomatic_events.34.a:0 "Bir pakt makul görünüyor."
 AST_diplomatic_events.34.b:0 "[JAP.GetNameDefCap] uygun gördüğü gibi genişleyecek."
 AST_diplomatic_events.34.desc:0 "[AST.GetNameDefCap] bir pakt öneriyor; iki ulusumuz arasındaki olası çatışmaları, ortaya çıkma şansı bulmadan önce çözecek bir pakt. Pasifik topraklarını aramızda bölerek, diğerinden müdahale korkusu olmadan gelecekteki genişlemelerimizi planlayabiliriz."
 AST_diplomatic_events.34.t:0 "[AST.GetNameDefCap] Pasifik Topraklarını Bölmeyi Talep Ediyor"
 AST_diplomatic_events.35.a:0 "Halledildi!"
 AST_diplomatic_events.35.desc:0 "[AST.GetNameDefCap] ve [JAP.GetNameDefCap], her ülkenin hangi Pasifik topraklarına genişleyebileceği konusunda anlaştı. Umalım ki bu, iki gücümüz arasındaki gelecekteki olası çatışmaları önler."
 AST_diplomatic_events.35.t:0 "Pasifik Bölündü"
 AST_diplomatic_events.36.a:0 "Ve Avustralya'nınki de öyle."
 AST_diplomatic_events.36.desc:0 "[JAP.GetNameDefCap] Pasifik topraklarını iki ulusumuz arasında bölmeyi kabul etmeyecek; Japon hükümeti uygun gördüğü gibi genişleyecek."
 AST_diplomatic_events.36.t:0 "Pasifik Kendini Bölecek"
 AST_diplomatic_events.37.a:0 "Görünüşe göre, bu konuda söyleyecek bir sözümüz yok."
 AST_diplomatic_events.37.desc:0 "Bilinmeyen nedenlerden dolayı, [AST.GetName] topraklarımızın kontrolünü [JAP.GetNameDef]'e devretmeye karar verdi. Perde arkasında uğursuz bir şeyler kaynıyor ve dünyanın ne olduğunu öğrenmesi sadece an meselesi."
 AST_diplomatic_events.37.t:0 "Efendiliğin Devri"
 AST_diplomatic_events.38.a:0 "Topraklarımız geri dönecek!"
 AST_diplomatic_events.38.b:0 "Boş vaatlere bağlanamayız."
 AST_diplomatic_events.38.desc:0 "Birinci Dünya Savaşı'nın bir sonucu olarak, Pasifik'teki birkaç Alman bölgesi Avustralya kontrolü altına alındı, ancak şimdi bunlardan birinin geri alınmasının bir yolu olabilir: Nauru adası.\n\n[AST.GetFascistParty], çıkarlarımızla örtüşen değerlere sahip ve bunlardan biri [AST.GetName]'in [ENG.GetNameDef]'ten tamamen ayrılmasıdır. Hareketin şu anki sınırlı nüfuzu nedeniyle, temsilcileri büyümesini hızlandırmak için bizden destek istiyor ve tamamen iktidara geldiklerinde, bağımsızlık arayışındayken onlara Güvence vermemiz şartıyla Nauru adasının kontrolünü geri vermekte ısrar ediyorlar."
 AST_diplomatic_events.38.t:0 "Nauru Paktı"
 AST_diplomatic_events.39.a:0 "Harika!"
 AST_diplomatic_events.39.desc:0 "[GER.GetNameDefCap] ve [AST.GetFascistParty] ortak bir hedef üzerinde anlaştılar: [AST.GetName] bağımsızlığa ulaşacak. [AST.GetFascistParty]'nin şu an sınırlı olan siyasi nüfuzu nedeniyle, [GER.GetNameDef] büyümesini hızlandırmak için bir hibeyle katkıda bulunacak ve nüfuzumuz artık sınırlı kalmadığında, anlaşma tamamen yerine getirilecek."
 AST_diplomatic_events.39.t:0 "[GER.GetNameDefCap] Nauru Paktını Kabul Ediyor"
 AST_diplomatic_events.4.a:0 "Evet, güvenebiliriz."
 AST_diplomatic_events.4.b:0 "Singapur bizim kalacak."
 AST_diplomatic_events.4.desc:0 "[AST.GetNameDefCap] uzun süredir Singapur Stratejisinin güvenilirliğini sorguluyor; Avustralyalı yetkililere göre, bir Pasifik savaşı durumunda onlara yardım etme yeteneğimiz belirsiz. Pasifik donanma sorumluluklarını [AST.GetName]'e devretmek, Britanya'nın omuzlarındaki yükü hafifletir, ancak aynı yükü Avustralya'nın omuzlarına bindirir.\n\nArtan Avustralya kontrolünün, Pasifik tebaamızı ve topraklarımızı Singapur'un bizde kalmasından daha güçlü bir konuma getireceğine güvenebilir miyiz?"
 AST_diplomatic_events.4.t:0 "Avustralya Singapur'u Talep Ediyor"
 AST_diplomatic_events.40.a:0 "[AST.GetFascistParty] Alman desteği olmadan devam edecek."
 AST_diplomatic_events.40.desc:0 "Henüz yerine getirilemeyen vaatlere bağlanamayan [GER.GetNameDef], iktidara yükselişimizi desteklemeyi reddediyor. Nauru Paktı daha başlamadan sona eriyor ve [AST.GetFascistParty]'nin hırsları tamamen omuzlarımızda kalacak."
 AST_diplomatic_events.40.t:0 "Nauru Paktı Parçalanıyor"
 AST_diplomatic_events.41.a:0 "Öyle yapacağız."
 AST_diplomatic_events.41.desc:0 "Artık tamamen iktidarda olan [AST.GetFascistParty], sözünü tutuyor ve anlaşmanın kendi tarafını yerine getiriyor. Nauru, [GER.GetNameDef]'e iade ediliyor ve biz Avustralya bağımsızlığını garanti edeceğiz."
 AST_diplomatic_events.41.t:0 "Nauru'nun Alman Ellerine Dönüşü"
 AST_diplomatic_events.42.a:0 "Gelecek sonuçlara karar verecek."
 AST_diplomatic_events.42.desc:0 "Vaatlerin ölümcül bir kusuru vardır; bozulabilirler. Artık gücün dizginlerinde olan [AST.GetFascistParty] liderleri, Nauru'nun sadece tutulacak bir şey olmadığına, aynı zamanda alınacak başka Pasifik adalarının da olduğuna karar verdiler.\n\nEski Pasifik topraklarımız Nauru Paktı imzalanmadan önceki kadar bizden uzak kalacak ve eğer farklı bir şekilde olmasını istiyorsak, savaş olmalı."
 AST_diplomatic_events.42.t:0 "[AST.GetFascistParty] Sözünü Bozuyor"
 AST_diplomatic_events.43.a:0 "Dikkatimiz başka yerdeyken, en iyisi bu olacak."
 AST_diplomatic_events.43.b:0 "Yine de, alacakları cevap bir ret olacak."
 AST_diplomatic_events.43.desc:0 "[AST.GetName], kuzeye doğru genişlemesi sayesinde Güneydoğu Asya diplomasisi ve çatışmaları üzerindeki ortak nüfuzumuzu artırabileceğimizi savunuyor. Doğrudan bir talep olmasa da, [AST.GetLeader] bir reddin kabul edilmeyeceğini öne sürüyor."
 AST_diplomatic_events.43.t:0 "[AST.GetNameDefCap] Güneydoğu Asya'yı Talep Ediyor"
 AST_diplomatic_events.44.a:0 "Gelecek parlak görünüyor."
 AST_diplomatic_events.44.desc:0 "[ENG.GetNameDefCap], Güneydoğu Asya topraklarının bize devredilmesini akıllıca kabul etti. Avustralya sınırları genişledikçe nüfuzumuz da bunu takip ediyor; artık dünyanın avucumuzun içine düşmesi sadece bir zaman meselesi."
 AST_diplomatic_events.44.t:0 "Güneydoğu Asya'nın Devri"
 AST_diplomatic_events.45.a:0 "Evet, olabilir."
 AST_diplomatic_events.45.desc:0 "[ENG.GetNameDefCap] Güneydoğu Asya topraklarının bize devredilmesini reddetti. Yine de, bölgeyi kontrol etmenin cazibesi bizim için açık kalmaya devam ediyor ve talep üzerine bizim olmayacak olsa da, yine de bizim olabilir."
 AST_diplomatic_events.45.t:0 "Güneydoğu Asya Olduğu Gibi Kalıyor"
 AST_diplomatic_events.47.a:0 "Kabul edeceğiz."
 AST_diplomatic_events.47.b:0 "Kendi başımızın çaresine bakacağız."
 AST_diplomatic_events.47.desc:0 "İngiliz Milletler Topluluğu'ndan yakın zamanda ayrılmasına rağmen, [AST.GetName] askeri işbirliği teklif ediyor. [AST.GetName], dünya genelinde ne kadar gerildiğini düşünürsek, yüklerin paylaşımının [ENG.GetNameDefCap]'e fayda sağlayacağını iddia ediyor."
 AST_diplomatic_events.47.t:0 "Yüklerin Paylaşımı"
 AST_diplomatic_events.48.a:0 "Bu, ilişkilerimizde yeni bir sayfa açıyor."
 AST_diplomatic_events.48.desc:0 "[ENG.GetNameDefCap], askeri işbirliğinin temelini atan bir saldırmazlık paktı imzalamayı kabul etti."
 AST_diplomatic_events.48.t:0 "Britanya-Avustralya Paktı"
 AST_diplomatic_events.49.a:0 "Gerçekten öyle yapmalıyız."
 AST_diplomatic_events.49.desc:0 "[ENG.GetNameDefCap] bir saldırmazlık paktı imzalamayı reddetti. Bu nedenle iki ulusumuz arasında askeri işbirliği kurma girişimimiz başarısız oldu ve dışa dönük ilerlemelerimizle yalnız devam etmeliyiz."
 AST_diplomatic_events.49.t:0 "İmzalanmamış Pakt"
 AST_diplomatic_events.5.a:0 "Strateji yeniden yazılıyor!"
 AST_diplomatic_events.5.a.tt:0 "§YSingapur§!:\n  §YAvustralya§! tarafından kontrol ediliyor.\n  Sahibi §YAvustralya§!.\n§YChristmas Adası§!:\n  §YAvustralya§! tarafından kontrol ediliyor.\n  Sahibi §YAvustralya§!.\n§YCocos Adaları§!:\n  §YAvustralya§! tarafından kontrol ediliyor.\n  Sahibi §YAvustralya§!."
 AST_diplomatic_events.5.desc:0 "Britanya, Singapur'u Avustralya yönetimine devretmeyi kabul ediyor. Bu, nihayetinde modası geçmiş Singapur Stratejisine son verecek ve kendi savunmamızın dizginlerini elimize almamızı sağlayacak."
 AST_diplomatic_events.5.t:0 "Britanya Talebimizi Kabul Ediyor"
 AST_diplomatic_events.50.a:0 "[FROM.GetName]'in yardımı memnuniyetle karşılanacak."
 AST_diplomatic_events.50.b:0 "Bölge yeterince yakın bir konumda."
 AST_diplomatic_events.50.desc:0 "Güneydoğu Asya ve Pasifik'in korunması Britanya'nın çıkarlarına yatsa da, bölge Britanya Adaları'ndan uzaktır; [FROM.GetName] bunu anlamıştır. Tedarik konusundaki desteğimiz karşılığında, dikkatimizi başka yönlere çevirmemize izin vererek bölgenin savunmasının komutasını üstlenmeyi teklif etti."
 AST_diplomatic_events.50.t:0 "Avustralya Pasifik Garnizonu"
 AST_diplomatic_events.51.a:0 "Sular bizim olacak."
 AST_diplomatic_events.51.desc:0 "[FROM.GetNameDefCap] kabul ediyor; Güneydoğu Asya suları bizim tarafımızdan korunacak. Britanya'nın yakıt katkıları karşılığında, [ROOT.GetName] komşu sularımızda deniz hakimiyetini artırmaya yönelik çabalarını ortaya koyacak."
 AST_diplomatic_events.51.t:0 "[ENG.GetNameDefCap]'in Pasifik Garnizonu"
 AST_diplomatic_events.52.a:0 "Sular bizim olacak."
 AST_diplomatic_events.52.desc:0 "[FROM.GetNameDefCap] katılmıyor; Güneydoğu Asya sularını savunmak için yardıma ihtiyaçları yok. Ancak, Britanya desteği olsun ya da olmasın, [ROOT.GetName] komşu sularda deniz hakimiyetini artırmaya yönelik çabalarını ortaya koyacak."
 AST_diplomatic_events.52.t:0 "Avustralya'nın Kendi Pasifik Garnizonu"
 AST_diplomatic_events.53.a:0 "Desteklerini memnuniyetle karşılayacağız."
 AST_diplomatic_events.53.b:0 "[AST.GetName]'in bunu bize karşı kullanma riski çok büyük."
 AST_diplomatic_events.53.desc:0 "[AST.GetName], Vichy Fransası'nın düşüşünün veya işbirliğinin [ENG.GetNameDef]'in ana hedeflerinden biri olduğundan şüpheleniyor ve bu nedenle Vichy boyun eğene kadar Fransız Afrika kolonilerini takip etmek için katılmayı teklif etti. Teklifin arkasında bilinmeyen bir gündem yatıyor olsa da, bölgede artan müttefik varlığının bize fayda sağlayacağı tartışılmaz.\n\nİznimizi verirsek, [AST.GetName] Vichy Fransası ile görüşmeleri başlatacak, kolonilerinin barışçıl devrini ve bir Avustralya garnizonunun kurulmasını isteyecek."
 AST_diplomatic_events.53.t:0 "Vichy Afrika Dışında"
 AST_diplomatic_events.54.a:0 "Öyle yapacağız."
 AST_diplomatic_events.54.desc:0 "[ENG.GetNameDefCap] kabul ediyor: Afrika'da artan müttefik varlığı Commonwealth'e fayda sağlayacaktır.\n\nVichy Fransası ile görüşmeleri başlatacak, kolonilerinin barışçıl devrini ve bir Avustralya garnizonunun kurulmasını isteyeceğiz."
 AST_diplomatic_events.54.t:0 "Yardımlarına"
 AST_diplomatic_events.55.a:0 "Genişleyeceğiz."
 AST_diplomatic_events.55.desc:0 "[ENG.GetNameDefCap], Avustralya'nın Afrika'daki yardımını reddediyor ve Vichy Fransası meselesini kendisi halledecek. Yine de, hırslarımız kolayca saptırılamaz.\n\nVichy Fransası'nın Afrika toprakları üzerindeki Avustralya kontrolü, bizi Britanya Commonwealth'inin astı olmaktan ziyade eşiti yapacaktır. [ENG.GetNameDef]'in isteklerine rağmen onları takip etmeliyiz, ancak bu güç kullanarak olmak zorunda kalacak."
 AST_diplomatic_events.55.t:0 "İzin Verilsin ya da Verilmesin"
 AST_diplomatic_events.56.a:0 "Çatışmadan kaçınmak için topraklar devredilecek."
 AST_diplomatic_events.56.b:0 "O zaman silahlı dönmeliler."
 AST_diplomatic_events.56.desc:0 "[ENG.GetNameDef] adına, [AST.GetName] kapımızı çalıyor, Afrika topraklarının devrini talep ediyor.\n\n[ENG.GetNameDefCap], Afrika'daki kontrolünü genişletmeye kararlı ve Avustralya işgaline boyun eğmezsek, kapımıza silahlı olarak dönecekler."
 AST_diplomatic_events.56.t:0 "[AST.GetName] Afrika Toprağı Talep Ediyor"
 AST_diplomatic_events.57.a:0 "Afrika'ya daha fazla genişleme devam edecek!"
 AST_diplomatic_events.57.desc:0 "Vichy Fransası talep edilen Afrika topraklarını devretmeyi kabul etti ve bir Avustralya garnizonunun bölgenin kontrolünü ele geçirmesine izin verdi."
 AST_diplomatic_events.57.t:0 "Vichy Afrika Toprağını Devrediyor"
 AST_diplomatic_events.58.a:0 "Barışçıl olsun ya da olmasın, [AST.GetName] genişleyecek."
 AST_diplomatic_events.58.desc:0 "Vichy Fransası, Afrika topraklarının bize devrini reddediyor. Ancak bu bir talep değil, bir istekti.\n\nBize reddettikleri bölgenin peşine düşeceğiz, ancak bu güç kullanarak olmak zorunda kalacak."
 AST_diplomatic_events.58.t:0 "Vichy [AST.GetName]'in Toprak Talebini Reddetti"
 AST_diplomatic_events.6.a:0 "Singapur Stratejisi sadece geçerli kalmalı."
 AST_diplomatic_events.6.desc:0 "Britanya, Singapur'u Avustralya yönetimine devretmeyi reddediyor. Mevcut durum korunacak."
 AST_diplomatic_events.6.t:0 "Britanya Talebimizi Reddediyor"
 AST_diplomatic_events.62.a:0 "Birleşme bekleyemez! Paktı imzala!"
 AST_diplomatic_events.62.b:0 "Çok tehlikeli."
 AST_diplomatic_events.62.desc:0 "[AST.GetName]'den diplomatlar bize Britanya Karşıtı bir pakt kurma teklifiyle geldiler. Bu, bizim doğrudan müdahale etmemize gerek kalmadan, kuzey İrlanda'yı İngilizlerden geri almamızda onların yardımını gerektirirdi.\n Karşılığında, başarılı olurlarsa, İttifaklarına katılacak ve Britanya'ya karşı gelecekteki bir savaşta, eğer gerçekleşirse, onlara yardım edecektik.\nKuzey ile birleşmek cazip olsa da, daha güçlü komşumuzu bu şekilde kışkırtacak bir konumda olup olmadığımızı ve daha da önemlisi, çatışma durumunda galip çıkıp çıkamayacağımızı dikkatlice düşünmeliyiz - aksi takdirde tüm İrlanda bir kez daha sadece basit bir Britanya kolonisi haline gelir."
 AST_diplomatic_events.62.t:0 "Britanya Karşıtı Bir Pakt?"
 AST_diplomatic_events.63.a:0 "O zaman İrlanda bölünmüş kalacak."
 AST_diplomatic_events.63.desc:0 "İrlanda, Britanya Karşıtı Paktı imzalamayı reddetti."
 AST_diplomatic_events.63.t:0 "İrlanda reddediyor!"
 AST_diplomatic_events.64.a:0 "İleri, Belfast'a!."
 AST_diplomatic_events.64.desc:0 "İrlanda, Britanya Karşıtı Paktı imzalamayı kabul etti."
 AST_diplomatic_events.64.t:0 "İrlanda kabul ediyor!"
 AST_diplomatic_events.65.a:0 "[FROM.GetAdjective] yoldaşlarımızla işbirliği için iyi bir başlangıç"
 AST_diplomatic_events.65.desc:0 "[FROM.GetNameDef]'teki [FROM.GetCommunistParty]'nin artan nüfuzu artık meyvelerini veriyor, temsilcileri kuvvetlerimizi desteklemek için seferber olan bir [FROM.GetAdjective] gönüllü kuvvetini bize bildirmek için Çin'i boydan boya geçtiler. Buna ek olarak, bu gönüllüler kendi birliklerimizi donatmaya yardımcı olmak için yedek teçhizat getiriyorlar."
 AST_diplomatic_events.65.t:0 "[FROM.GetName] Destek Sağlıyor"
 AST_diplomatic_events.66.a:0 "Harika bir ilk adım"
 AST_diplomatic_events.66.desc:0 "[FROM.GetLeader]'in temsilcileri, gönüllülerimize verdiğimiz destek ve sağlanan savaş malzemeleri için teşekkürlerini ilettiler. [FROM.GetAdjective]'in iç savaştaki kapsamlı deneyimi kesinlikle bu kaynakların etkili bir şekilde kullanılacağı anlamına geliyor."
 AST_diplomatic_events.66.t:0 "[FROM.GetName] Desteğimiz İçin Bize Teşekkür Ediyor"
 AST_diplomatic_events.67.a:0 "Harika bir ilk adım"
 AST_diplomatic_events.67.desc:0 "[FROM.GetLeader]'in temsilcileri, gönüllülerimize verdiğimiz destek ve sağlanan savaş malzemeleri için teşekkürlerini ilettiler. [FROM.GetAdjective]'in iç savaştaki kapsamlı deneyimi kesinlikle bu kaynakların etkili bir şekilde kullanılacağı anlamına geliyor."
 AST_diplomatic_events.67.t:0 "[FROM.GetName] Desteğimiz İçin Bize Teşekkür Ediyor"
 AST_diplomatic_events.68.a:0 "İşler nasıl da tersine döndü."
 AST_diplomatic_events.68.desc:0 "Avustralya, ezici düşmanı [JAP.GetNameDef] ile yalnız yüzleşmek istemiyor. İlk adımı atmamız ve yaklaşan çatışmayı en uygun zamanda çözmemiz için bize baskı yapıyorlar."
 AST_diplomatic_events.68.t:0 "Avustralya Talepleri"
 AST_diplomatic_events.69.a:0 "Öyle olacak."
 AST_diplomatic_events.69.desc:0 "[ENG.GetNameDef] ve [AST.GetName] arasındaki bağ test ediliyor, ancak ikincisi bunu tam gücüne kavuşturmaya kararlı. [AST.GetName], İngiliz hükümeti içinde liderlerinin onları reddedemeyeceği kadar bağlantılara ve müttefiklere sahip; uluslar bir kez daha aynı ittifaka girecek ve yine, Adalar ve uzak diyar birlikte çalışacak."
 AST_diplomatic_events.69.t:0 "Bir Kez Daha Bağlı"
 AST_diplomatic_events.7.a:0 "Yapabiliriz."
 AST_diplomatic_events.7.b:0 "Yapamayız"
 AST_diplomatic_events.7.desc:0 "[AST.GetNameDefCap], savaş çabaları için müttefiklerden teçhizat almak istiyor ve gerekli sevkiyatları yönetmemiz için yardımımızı talep ediyor. [AST.GetName]'in kullanabilmesi için konvoylar ayırabilir miyiz?"
 AST_diplomatic_events.7.t:0 "[AST.GetName] Yardımımızı Talep Ediyor"
 AST_diplomatic_events.71.a:0 "Hayır almayacağız."
 AST_diplomatic_events.71.b:0 "Pasifik adaları bizim kalacak."
 AST_diplomatic_events.71.desc:0 "[AST.GetName], Pasifik'in batısının [USA.GetNameDef] tarafından yönetilemeyeceğini iddia ederek Pasifik adalarımız üzerinde kontrol talep etti. Adalar, Avustralya düşmanlığını sakinleştirmek için küçük bir bedel olabilir, ama yine de bir bedel. Elimizi zaten doldurmuşken, yükselen bir faşist gücü kışkırtma riskini almalı mıyız?"
 AST_diplomatic_events.71.t:0 "Avustralya Pasifik Adalarını Talep Ediyor"
 AST_diplomatic_events.72.a:0 "Mükemmel."
 AST_diplomatic_events.72.desc:0 "Elleri zaten doluyken, Pasifik adaları [USA.GetNameDef] için Avustralya düşmanlığını sakinleştirmek adına ödemek için küçük bir bedel olduğunu kanıtladı. Pasifik adaları artık bizim."
 AST_diplomatic_events.72.t:0 "[USA.GetNameDef]'in Pasifik Adalarının Devri"
 AST_diplomatic_events.73.a:0 "Adalar henüz bizim olmayabilir."
 AST_diplomatic_events.73.desc:0 "[USA.GetNameDefCap], Pasifik adalarını bize teslim etmeyi reddetti. Taleplerimize ve Pasifik'teki artan nüfuzumuza rağmen, Washington adalar üzerindeki hakimiyetinden vazgeçmeye isteksiz."
 AST_diplomatic_events.73.t:0 "[USA.GetNameDefCap] Reddediyor"
 AST_diplomatic_events.74.a:0 "Savaş riskini göze alamayız; taleplerini karşılayın."
 AST_diplomatic_events.74.b:0 "Filipinler bizim kalacak!"
 AST_diplomatic_events.74.desc:0 "Topraklarını genişletme hırsı içinde, [AST.GetName] [PHI.GetNameDef] üzerinde kontrol talep etti. Reddedersek, [AST.GetName] savaş tehdidinde bulunuyor ve [USA.GetNameDef]'in [AST.GetName]'in nüfuz alanı içindeki toprakları elinde tutmasını düpedüz düşünülemez buluyor."
 AST_diplomatic_events.74.t:0 "Filipinler Devri İçin Avustralya Talebi"
 AST_diplomatic_events.75.a:0 "Yeni bir düzen doğuyor."
 AST_diplomatic_events.75.desc:0 "Uluslar gazabımızdan bu derece korktuğunda, [AST.GetName]'in faşist bir güç olarak yükselişinin belirli faydalar getirmeye başladığı açıktır. [USA.GetNameDefCap] kabul etti; [PHI.GetNameDef] bizim."
 AST_diplomatic_events.75.t:0 "[PHI.GetNameDef]'in Devri"
 AST_diplomatic_events.76.a:0 "Bu savaş demek."
 AST_diplomatic_events.76.desc:0 "[USA.GetNameDefCap], [PHI.GetNameDef]'i bize teslim etmeyi reddetti. Taleplerimize ve Pasifik'teki artan nüfuzumuza rağmen, Washington bölge üzerindeki hakimiyetinden vazgeçmeye isteksiz."
 AST_diplomatic_events.76.t:0 "[USA.GetNameDefCap] Reddediyor"
 AST_diplomatic_events.78.a:0 "Onları garantileyeceğiz."
 AST_diplomatic_events.78.b:0 "[JAP.GetNameDefCap] unsurunun ilgilenmesi gereken kendi işleri var."
 AST_diplomatic_events.78.desc:0 "[AST.GetNameDefCap] cesur hedeflerini bizimle paylaşıyor:\n\n'[USA.GetNameDefCap]'in gölgesi üzerimizde beliriyor ve eylemlerimiz onun çıkarlarıyla uyuşmadığında müdahale etmekle tehdit ediyor. Bu büyüklükteki bir küresel gücün Avustralya ve Japonya işlerine karışmasıyla, Doğu Asya hiçbir zaman gerçekten bize ait olmayacak. Ve bu yüzden, [AST.GetName] savaşa girecek.'\n\nBaşbakan [AST.GetLeader] niyetini çok net bir şekilde ortaya koyuyor: [AST.GetName], [USA.GetNameDef] unsurunu karşısına almayı planlıyor ve Amerikalıların tek başına alt edilemeyecek kadar güçlü çıkması durumunda yardımımızı talep ediyor."
 AST_diplomatic_events.78.t:0 "[AST.GetName] Deve Karşı Garanti Talep Ediyor"
 AST_diplomatic_events.79.a:0 "Savaşa yürüyoruz."
 AST_diplomatic_events.79.desc:0 "[USA.GetNameDef]'in Asya ve Okyanusya diplomasisine müdahalesinin hem istenmeyen hem de kabul edilemez olduğu sadece bizim için değil, herkes için açık. [JAP.GetNameDefCap] ulusumuzu garantilemeyi kabul etti, böylece Amerikalıların tek başına alt edilemeyecek kadar güçlü çıkması durumunda bir müttefikin yardımımıza geleceğini bilerek, düşmanlarımıza karşı sancağımızı yüksekte tutmamıza olanak tanıdı."
 AST_diplomatic_events.79.t:0 "[JAP.GetNameDefCap], [AST.GetName] Unsurunu Garantiliyor"
 AST_diplomatic_events.8.a:0 "Çok işe yarayacaklar!"
 AST_diplomatic_events.8.desc:0 "[USA.GetNameDefCap], [AST.GetName]'in tedarik çabalarına yardımcı olmak için bir miktar konvoy ayırmayı kabul etti."
 AST_diplomatic_events.8.t:0 "[USA.GetName] Talebimizi Kabul Ediyor"
 AST_diplomatic_events.80.a:0 "Ve biz de öyle yapacağız."
 AST_diplomatic_events.80.desc:0 "[USA.GetNameDefCap]'in Asya ve Okyanusya diplomasisine müdahalesi hem istenmeyen hem de kabul edilemez, ancak bu durum sadece bizim için açık gibi görünüyor. [JAP.GetNameDefCap] bizi garantilemeyi reddediyor ve bizi düşmanlarımızı onlar olmadan karşımıza almaya zorluyor."
 AST_diplomatic_events.80.t:0 "[JAP.GetNameDefCap] Bizi Garantilemeyi Reddediyor"
 AST_diplomatic_events.81.a:0 "[ENG.GetLeader] platipusuna kavuşacak."
 AST_diplomatic_events.81.b:0 "İhracat yasağı kaldırılmayacak, Başbakan için bile."
 AST_diplomatic_events.81.desc:0 "İngiliz Başbakanı'nın hayvanlara olan ilgisi neredeyse hiç kimsenin gözünden kaçmadı, koleksiyonu oldukça etkileyici. Onun çeşitli canlı ailesine yapılacak herhangi bir ekleme kesinlikle takdir edilecektir, ancak egzotik bir tanesi daha da çok takdir edilecektir.\n\n[ENG.GetLeader] bizzat Avustralya platipusuna ilgi duyduğunu belirtti ve taşımanın bu küçük canlıya oluşturduğu sağlık riskleri nedeniyle şu audio ihracatı yasak olsa da, bir istisna yapmaya değer olabilir.\n\nBirliğin bir sembolü olarak Başbakan'ın bu isteğini yerine getirelim mi?"
 AST_diplomatic_events.81.t:0 "Bir Birliğin Büyüleyici Sembolü"
 AST_diplomatic_events.82.a:0 "Gerçekten üzücü bir haber."
 AST_diplomatic_events.82.desc:0 "Altı hafta önce Melbourne limanından içinde tam teşekküllü bir platipus barınağı ile yola çıkan platipus sevkiyatı [ENG.GetNameDef] konumuna ulaştı. Ancak geminin varışı neşeli olmadı çünkü hayvanın ölü olduğu anlaşıldı. [ENG.GetLeader], gelişini beklerken kendi adını bile verdiği kayıp evcil hayvanı için yas tutuyor, ancak onun ölümünden düşmanların sorumlu olduğunu talep ediyor. Görünüşe göre bir denizaltı saldırısının patlamaları platipusu korkudan öldürmüş.\n\nAncak platipus bakıcısının seyir defteri bir başka olası ölüm nedenine işaret ediyor: Platipus barınağının su ve hava sıcaklıkları kabul edilebilir seviyelerin çok üzerindeydi.\n\nNe olursa olsun, Platipus [ENG.GetLeader] öldü ve İngiliz Başbakanı platipussuz kalacak."
 AST_diplomatic_events.82.t:0 "[ENG.GetLeader]'dan Acı Bir Rapor"
 AST_diplomatic_events.83.a:0 "Yapabileceğimiz çok az şey var."
 AST_diplomatic_events.83.desc:0 "Yakın zamanda yapılan referandumun ardından [NZL.GetNameDef], Avustralya Anayasası'nın 6. Maddesini uygulamaya karar verdi.\n\n1901'de Avustralya kolonilerini bir federasyon altında birleştiren süreçte, Yeni Zelanda sonuçta katılmamaya karar verdi. Ancak o zamandan beri Avustralya Anayasası, Yeni Zelanda'yı potansiyel eyaletlerinden biri olarak tanımlamaya devam etti ve bu toprakların kabulüne izin verdi.\n\nYeni Zelandalılar artık topraklarının Avustralya yönetimi altında daha güvenli olduğu konusunda hemfikir ve bu nedenle [AST.GetNameDef]'ye katılmayı kabul ettiler."
 AST_diplomatic_events.83.t:0 "Yeni Zelanda [AST.GetNameDef] ile Birleşiyor"
 AST_diplomatic_events.84.a:0 "Topraklar Avustralya'nın eline devredilecektir."
 AST_diplomatic_events.84.b:0 "Böyle bir şeye razı olmayacağız."
 AST_diplomatic_events.84.desc:0 "Pasifik'te artan gerilim endişe verici; etkilenen bölgelerimizi savunma kapasitemiz ise sınırlı görünüyor; [AST.GetNameDef] öyle iddia ediyor.\n\nGüneydoğu Asya'nın tamamını savunmak için bölgelerini genişletmeye çalışıyorlar ve bu nedenle belirli toprakların transferini talep ediyorlar. Anlaşacak mıyız?"
 AST_diplomatic_events.84.t:0 "[AST.GetNameDefCap] İstek Bölgesi"
 AST_diplomatic_events.85.a:0 "Akıllıca seçtiler!"
 AST_diplomatic_events.85.desc:0 "Pasifik'te artan gerilimler endişe verici; özellikle de bazı ulusların kendi topraklarını savunma kapasiteleri sınırlı görünüyor; ve [FROM.GetNameDef] de aynı fikirde. Talep ettiğimiz bölgeleri derhal nakledecekler."
 AST_diplomatic_events.85.t:0 "[FROM.GetNameDefCap] Talebimizi Kabul Ediyor"
 AST_diplomatic_events.86.a:0 "Yapabileceğimiz çok az şey var."
 AST_diplomatic_events.86.desc:0 "Pasifik'te artan gerilim endişe verici, özellikle de bazı ulusların kendi topraklarını savunma kapasiteleri sınırlı görünüyor. Ancak [FROM.GetNameDef] talep ettiğimiz bölgeleri aktarmayı reddetti."
 AST_diplomatic_events.86.t:0 "[FROM.GetNameDefCap] Talebimizi Reddediyor"
 AST_diplomatic_events.9.a:0 "Sevkiyatları kendimiz yönetmeliyiz."
 AST_diplomatic_events.9.desc:0 "[USA.GetNameDefCap]'in [AST.GetName]'in tedarik çabaları için ayıracak konvoyu yok."
 AST_diplomatic_events.9.t:0 "[USA.GetName] Talebimizi Reddediyor"
 AST_election_events.1.a:0 "Halk konuştu."
 AST_election_events.1.desc.a:0 "Oylar sayıldı; Birleşik Avustralya Partisi seçimi kazandı.\n\nUAP, vatandaşların güveninin temsilcilerinin omuzlarına haklı olarak verildiğini kanıtlayarak geçireceği önümüzdeki üç yıldan önce, kısa bir hükümet kurma sürecinden geçecek."
 AST_election_events.1.desc.b:0 "Oylar sayıldı; Avustralya İşçi Partisi seçimi kazandı.\n\nİşçi Partisi, vatandaşların güveninin temsilcilerinin omuzlarına haklı olarak verildiğini kanıtlayarak geçireceği önümüzdeki üç yıldan önce, kısa bir hükümet kurma sürecinden geçecek."
 AST_election_events.1.t.a:0 "UAP Kazandı!"
 AST_election_events.1.t.b:0 "İşçi Partisi Kazandı!"
 AST_election_events.2.a:0 "UAP son reformlarını yürürlüğe koyacak."
 AST_election_events.2.b:0 "Avustralya genelindeki bir kampanya turu ALP desteğini artıracak."
 AST_election_events.2.desc:0 "$AST_democratic_party_long$ 1931'den beri [AST.GetName]'i yönetiyor, ulusu Büyük Buhran'dan çıkarıp aşırı muhafazakar eğilimlerden uzaklaştırıyor. İstikrarlı liderlik, muhafazakar eğilimler ve Britanya'ya sadakat sayesinde UAP desteğini güçlendirdi ve bir dönem daha kazanma ihtimalini artırdı. Yine de başka bir partinin bu konuda söyleyecek bir sözü var.\n\n1931'de iktidardan düşürülmesine neden olan güvensizlik oylamasından hala toparlanmaya çalışan $AST_labor_party_long$ ivme kazanmaya başlıyor. Komünist seslerin susturulmasıyla işçi sınıfı artık başka bir yol gösterici ışık arıyor. Her vatandaşı temsil etme misyonuyla ALP, emperyalizm ve Avustralya'nın İmparatorluğa olan sadakati konusunda farklı bir bakış açısı benimsedi. İç ihtiyaçlar ilk sırada yer almalı ve dış çıkarlar artık öncelik olmamalı.\n\nBir sonraki federal seçime bir buçuk yıl kaldı. UAP bir zafer daha kazanmak istiyorsa, liderleri kamu desteğini korumak için reformları hızlandırmalıdır. Aksi takdirde, ALP kampanyası konumunu yeniden güçlendirebilir."
 AST_election_events.2.t:0 "Federal Seçime Yolun Yarısı"
 AST_election_events.3.a:0 "Başlıyor."
 AST_election_events.3.desc:0 "$AST_election_season_cat_desc$"
 AST_election_events.3.t:0 "$AST_election_season_cat$"
 AST_political_events.1.a:0 "Havacılık, [AST.GetName] genelinde hava seyrüseferini düzenlemek için."
 AST_political_events.1.a.tt:0 "Reform geçtiğinde:\n §YGeçen Havacılık Reformu§! eklenir, şu bonusları verir:\n Hava Araştırma Hızı: §G+%15§!\n §YHava Üssü§! inşaat hızı: §G+%5.00§!"
 AST_political_events.1.b:0 "Pazarlama, ulusal çapta tarımsal pazarlama planlarını koordine etmek için."
 AST_political_events.1.b.tt:0 "Reform geçtiğinde:\n §YGeçen Pazarlama Reformu§! eklenir, şu bonusları verir:\n Tüketim Malları Fabrikaları faktörü: §Y-%10.0§!"
 AST_political_events.1.desc:0 "Hükümet olarak federal kontrolü artırmayı hedeflediğimiz iki alan var: Havacılık ve Pazarlama.\n\nHavacılık ile ilgili olarak, amaç Commonwealth Parlamentosuna hava seyrüseferi ve hava araçları ile ilgili yasalar yapma yetkisi vermek için Anayasayı değiştirmektir.\n\nPazarlama değişikliği ise, şu anda anayasal olarak imkansız olan pazarlama alanında Commonwealth ve Eyaletler arasında işbirliğine izin vermektir.\n\nHangisi için referandum çağrısı yapmalıyız?"
 AST_political_events.1.t:0 "Referandum Çağrısı"
 AST_political_events.10.a:0 "Kabul edilemez davranış!"
 AST_political_events.10.desc:0 "Dün gece Brisbane'deki bir sokak isyanını bastırmak için çelik miğferli birlikler çağrıldı. Üç saat süren kargaşa sırasında bir asker ölümcül bir şekilde vuruldu ve diğer altı asker de yaralandı. \n\nA Aralarında çok sayıda asker ve denizcinin de bulunduğu yaklaşık 1000 kişilik kalabalık, ortaya çıkan kavgaya katılmak veya onu izlemek için Creek ve Adelaide Sokaklarının köşesindeki bir kantinin önünde toplandı. İtfaiye araçları kalabalığı ayırmak için siren sesleri çıkararak geldi, ancak onlar gittikten sonra arbede yeniden başladı. Bağıran kalabalıklar kantin girişine hücum ederek binanın camlarını kırdı ve askeri polis kalabalığı bir kez daha dağıtmak için coplarını sallamak zorunda kaldı.\n\nBir saat süren kargaşanın ardından ateş açıldı, bu da çok sayıda yaralanma ve bir ölümle sonuçlandı. Askeri polis takviyeleri, mevcut tüm sivil polis yedekleri ve çelik miğferli birlikler tarafından desteklenen isyanı kesin olarak dağıtmak için geldi."
 AST_political_events.10.t:0 "Brisbane Savaşı"
 AST_political_events.11.a:0 "Yeni bir bayrak göndere çekilecektir."
 AST_political_events.11.b:0 "[AST.GetName]'nin geçmişi silinmemelidir; Bayrağımız kalacak."
 AST_political_events.11.desc:0 "İki yüzyıllık İngiliz egemenliğinin ardından [AST.GetName] artık özgür. Politika ve reform konularında herhangi bir kısıtlamaya maruz kalmayan birçok karar verici, fikirlerini ortaya koyma konusunda isteklidir; Böyle bir teklif kamuoyunda tartışmalara yol açtı.\n\nTeklif [AST.GetAdjective] bayrağıyla ilgilidir: son bölünmemizi simgeleyecek şekilde değiştirilmeli mi?"
 AST_political_events.11.t:0 "Sayfayı Çevirmek"
 AST_political_events.13.a:0 "Bu sefer ne kadar başarılı olacaklarını zaman gösterecek."
 AST_political_events.13.desc:0 "$AST_new_guard_spirit_desc$"
 AST_political_events.13.t:0 "Yeni Muhafız Yeniden Yükseliyor"
 AST_political_events.14.a:0 "İngiliz sadık ve endüstriyel irtibat görevlisi, Adela Pankhurst Walsh"
 AST_political_events.14.b:0 "Eski başbakan ve son derece vatansever Billy Hughes."
 AST_political_events.14.c:0 "Devlet başkanı Alexander Hore-Ruthven."
 AST_political_events.14.desc:0 "Yeni kurulan Kraliyet Konseyi, mevzuatı gözden geçirerek ve politika, acil durumlar ve anayasal konularda tavsiyelerde bulunarak devlete yardımcı olacaktır. Odaya atanan tüm devlet adamları, devlet başkanına ve hükümete tavsiyelerde bulunacak, ancak hepsine bir Başkan başkanlık edecek. Başkanın Konsey işleri üzerindeki etkisi küçümsenemez ve bu nedenle atamanın büyük bir dikkatle yapılması gerekir.\n\nKraliyet Konseyi Başkanı olarak kim atanacak?"
 AST_political_events.14.t:0 "Kraliyet Konseyi Başkanını Atayın"
 AST_political_events.2.a:0 "Federal kontrol genişleyecek!"
 AST_political_events.2.desc.a:0 "Halk, havacılık reformumuzun yasalaşmasına izin vermeyi kabul etti. Havacılık, Avustralya Anayasası yazıldığında mevcut olmadığından, hükümetin nihayet hava seyrüseferi ve düzenlemesi üzerinde yetki alması sadece doğru olandır. Güvenlik ve verimlilik adına, tek tip ulusal havacılık yasaları artık yürürlüğe girecek."
 AST_political_events.2.desc.b:0 "Halk, pazarlama reformumuzun yasalaşmasına izin vermeyi kabul etti. Tarımsal ürünleri ve pazarlamalarını düzenleme yetkisiyle, hükümet artık piyasaları istikrara kavuşturabilecek ve eyaletler arasındaki işbirliğini geliştirebilecek. Çiftçilerin gelirleri daha istikrarlı hale gelecek, ulusal ekonomi de öyle."
 AST_political_events.2.t:0 "Başarılı Bir Referandum"
 AST_political_events.4.a:0 "Ulusal bir trajedi."
 AST_political_events.4.desc:0 "[AST.GetName] liderleri uzun süredir savaş hazırlıklarının baskısı altında çalışıyorlardı ve sonunda bu gerginlik en büyük kurbanını aldı; Başbakan kalp krizinden öldü.\n\nDünyanın mevcut durumu göz önüne मिळालığında, liderliği çok aranacak. Yine de Avustralya, dizginleri elinde tutan yeni bir liderle yoluna devam etmeli: [AST.GetLeader]."
 AST_political_events.4.t:0 "Başbakan Pes Ediyor"
 AST_political_events.5.a:0 "Hareketin gerçek doğasını sadece zaman gösterecek."
 AST_political_events.5.desc:0 "Meydan okuyan ve tartışmalı seslerden oluşan bir grup kuruldu: Avustralya Önce Hareketi. Hükümet, niyetlerinin tamamen demokratik olmayabileceğinden korkuyor ve grubu ve üyelerini gözetim altına almayı seçti. Demokratların müdahalesi, örgütlenme yeteneklerimizi azaltacak ve yeni üyelerin işe alımını boğacak."
 AST_political_events.5.t:0 "Avustralya Hükümeti Sertleşiyor"
 AST_political_events.6.a:0 "Harekete geçilmeli."
 AST_political_events.6.desc:0 "Bugün erken saatlerde, 1938 sesquicentenary anması gerçekleşirken ve 'Avustralya'nın Ulusluğa Yürüyüşü' gösterisi Sydney'in ana caddelerinden geçerken, Avustralya Salonu'nda bir protesto düzenlendi.\n\nAborjin hakları aktivistleri ve grupları, 150. yıl dönümünün sadece Britanya sömürgeciliğinin başlangıcını değil, aynı zamanda Aborjin halklarının anayasal ayrımcılığını da işaret ettiği gerçeğine dikkat çekmek için toplandılar. Aktivistler, Aborjin halklarının eğitimi ve bakımı için yeni yasaların yanı sıra, Yerli halkların tam vatandaş statüsüne yükseltilmesine izin verecek yeni bir politika talep ettiler."
 AST_political_events.6.t:0 "1938 Sesquicentenary"
 AST_political_events.7.a:0 "Britanya'nın girişimlerine rağmen, [AST.GetName] kendi yoluna karar verecek."
 AST_political_events.7.desc:0 "Son olayların ardından Avustralya siyasetinin değiştiği artık inkar edilemez. [ENG.GetNameDefCap], [AST.GetName]'nin İngiliz Milletler Topluluğu şemsiyesi altındaki bir ulus için uygun bir yolda kalmasını diplomatik olarak sağlamak için harekete geçti ve doğru yöne doğru barışçıl dürtüklemelerinin Dominyonlarını sadık tutmaya yeterli olacağını umuyor."
 AST_political_events.7.t:0 "İmparatorluk Baskısı"
 AST_political_events.8.a:0 "Hazırlanmalıyız."
 AST_political_events.8.desc:0 "$AST_war_is_coming_cat_desc$"
 AST_political_events.8.t:0 "Savaş Yaklaşıyor"
 AST_political_events.9.a:0 "Ve biz de alacağız."
 AST_political_events.9.desc:0 "Pik demir yüklemesi üzerindeki bir anlaşmazlık olarak başlayan şey, çok daha büyük bir şeyi ateşledi. Avustralya genelindeki işçiler dayanışma içinde işi bırakıyor, hem hükümete hem de endüstriye meydan okuyor. Grevler yayıldıkça ve gerilimler arttıkça, kriz tırmanıyor ve iktidardakilerin istifasını talep ediyor. Ve böylece, durumu kontrol etmede tamamen başarısız olan hükümet tam da bunu yapıyor ve iktidar partisi konumunu [AST.GetCommunistParty]'nin alması için boş bırakıyor."
 AST_political_events.9.t:0 "Dalfram Anlaşmazlığı"
 AST_union_control_events.1.a:0 "Onları gözetim altında tutun. İzleyeceğiz ve bekleyeceğiz."
 AST_union_control_events.1.desc:0 "İstihbarat servisleri hükümetin dikkatine rahatsız edici bir rapor getirdi. Avustralyalı komünist ajanlar yerel sendika liderleriyle temas kuruyor, radikal literatür dağıtıyor ve işçileri devrimci çizgilerde örgütlenmeye teşvik ediyor. Hareket şimdilik küçük kalıyor ancak güvenlik yetkilileri bunun bu tür şeylerin tam olarak nasıl başladığı konusunda uyarıyor. Kök salmadan önce bir karar verilmeli."
 AST_union_control_events.1.t:0 "Sendikalarımızdaki Yabancı Ajanlar"
 AST_union_control_events.2.b:0 "Rahatsız edici bir gelişme."
 AST_union_control_events.2.desc:0 "Avustralya komünist hükümetinin ajanları şehirlerimize geldi. Saklanmıyorlar - fabrika kapılarında broşürler dağıtılıyor, halka açık meydanlarda konuşmalar yapılıyor ve Avustralyalı ajanlar ile yerel radikal gruplar arasında dayanışma ağları kuruluyor. Mevcut yabancı nüfuz ağları bir gecede yeniden canlanmış gibi görünüyor. Bu koordineli bir kampanya ve hükümet, popüler hoşnutsuzluk yönetilmesi daha zor bir şeye dönüşmeden önce nasıl yanıt vereceğine karar vermeli."
 AST_union_control_events.2.t:0 "Sokaklarımızda [AST.GetAdjective] Destekli Kışkırtıcılar"
 AST_union_control_events.3.a:0 "Devrimin kumsalda ölmesine izin veremeyiz. Onlara bir ayak tutunma noktası sağlayın."
 AST_union_control_events.3.desc:0 "[MAL.GetNonIdeologyName] işçileri ayaklandı. Uzun kampanyamız boyunca beslenen komünist hücreler ülke genelinde silaha sarıldı - ancak sahadaki tablo rahatsız edici. Devrimci kuvvetler kendilerini yanlış bölgelerde, yarımadanın kalbinden su ve ormanla ayrılmış olarak buldular. Anakara üzerinde bir ayak tutunma noktası olmadan, hükümet onları bekleyecek ve devrimi yayılmadan önce aç bırakacak. Avustralya gizlice ve hızlıca yarımadaya savaşçı indirmeli ve devrime hayatta kalması için ihtiyaç duyduğu zemini vermelidir."
 AST_union_control_events.3.t:0 "[MAL.GetNonIdeologyName]'de Devrim Patlak Veriyor"
 AST_union_control_events.4.a:0 "Bunun arkasında kimin olduğunu öğrenin. Bu isyancılar o topraklarda uzun süre tutunamayacak."
 AST_union_control_events.4.a.tt:0 "Komünist karşıtı milis kuvvetleri toplanarak komünist işgale direnmek için kuruldu."
 AST_union_control_events.4.desc:0 "Hükümete şok edici bir rapor ulaştı. Koordineli bir operasyon eyaletlerimizden birini ele geçirdi ve onu devrimci hükümetin bir parçası ilan etti. Saldırının hızı ve organizasyonu rahatsız edici soruları gündeme getirdi - istihbarat servislerimiz isyancıların yalnız hareket etmediğinden ve yabancı ellerin onları kıyılarımıza yönlendirmiş olabileceğinden şüpheleniyor. Devralmadan kaçanlar teslim olmadı. Yeniden toplandılar ve onlardan alınanları geri almaya kararlı olarak silaha sarıldılar."
 AST_union_control_events.4.t:0 "Komünist Sızanlar [MAL.GetAdjective] Topraklarına El Koydu"
 AST_union_control_events.5.a:0 "Korkunç bir aksilik. Yoldaşlarımızı desteklemek için başka yollara başvurmalıyız."
 AST_union_control_events.5.desc:0 "Operasyon felaketle sonuçlandı. Birliklerimiz asla karaya çıkamadı. Sadık devriyeler tarafından geri çevrildiler, boğazlarda kayboldular ya da bir mevzi kuramadan yakalandılar. Detaylar bulanık ama sonuç değil. Daha kötüsü, basın olayı duydu. Parlamentoda kuvvetlerimizin o sularda tam olarak ne yaptığına dair sorular soruluyor. Halkın tepkisi şok ve utanç oldu. Devrim için güvence altına almayı umduğumuz kazanımlar ne olursa olsun, başka bir yol bulmamız gerekecek."
 AST_union_control_events.5.t:0 "[MAL.GetAdjective] Felaketi"
 INS_chaos_events.1.a:0 "Aynen olması gerektiği gibi!"
 INS_chaos_events.1.b:0 "Ateşkes emri ver, tırmanmayı riske atamayız."
 INS_chaos_events.1.desc:0 "Bağımsızlık ilanından sonra Surabaya'da güç istikrarsızlaştı. Bugün, bir grup Hollanda yanlısı eski Hotel Yamato'nun tepesine eski sömürge bayrağını çekti. Yerel pemuda gençleri binayı basıp bayrakları indirdi ve yerine kırmızı-beyaz Endonezya bayrağını çekti. Olay şiddetli, düzensiz çatışmalara dönüştü."
 INS_chaos_events.1.t:0 "Surabaya Muharebesi"
 INS_chaos_events.2.a:0 "İzin Ver."
 INS_chaos_events.2.b:0 "Siyasetin zamanı değil, sıkıyönetim ilan et!"
 INS_chaos_events.2.desc:0 "Endonezya'daki Amir Sjarifuddin ve Sutan Sjahrir liderliğindeki en büyük iki Sosyalist parti bugün birleşme kararı aldıklarını ve birleşik bir Endonezya Sosyalist Partisi kurduklarını duyurdu. Bu, partinin siyasi nüfuzunu önemli ölçüde artırıyor ve potansiyel olarak yönetimimizi riske atıyor."
 INS_chaos_events.2.t:0 "Sosyalist Partiler Birleşiyor"
 INS_chaos_events.3.a:0 "Düzeni sağlamalıyız!"
 INS_chaos_events.3.desc:0 "Bugün Hollandalı bir asker tarafından Sukarno'nun arabasına ateş açılarak Sukarno'nun hayatına kastedildi. Neyse ki Sukarno araçta değildi, ancak şoförü ağır yaralandı. Bu girişim başarısız olsa da, bunun hem Hollandalı askerlerden hem de Endonezyalı muhalefetten gelen son girişim olmayacağı açık."
 INS_chaos_events.3.t:0 "Sukarno'nun Hayatına Yönelik Başarısız Girişim"
 INS_chaos_events.4.a:0 "Başkan Yardımcısı Hatta devralacak."
 INS_chaos_events.4.b:0 "Sosyalist Parti devralacak."
 INS_chaos_events.4.c:0 "Cumhuriyeti kaldırın, Tan Malaka bizi zafere taşıyacak!"
 INS_chaos_events.4.desc:0 "Bugün Endonezya'nın başına trajik bir gün geldi. Sukarno bir suikast girişimiyle daha karşılaştı, bu sefer başarılı oldu. Bundan bir veraset krizi çıkmasına izin vermemeliyiz, düzen hızla sağlanmalı aksi takdirde cumhuriyet çökecektir."
 INS_chaos_events.4.t:0 "Sukarno Suikastı"
 INS_communist_events.1.a:0 "Orduyu toplayın. Sessizce gitmeyeceğiz."
 INS_communist_events.1.b:0 "Daha fazla direniş sadece halkımıza yıkım getirecektir."
 INS_communist_events.1.c:0 "Belki de masada bir yer verirsek, bunu hala kontrol edebiliriz."
 INS_communist_events.1.desc:0 "Durum kurtarılamayacak kadar kötüleşti. Aylarca süren [FROM.GetAdjective] kışkırtması işe yaradı ve [ROOT.GetName]'deki komünist hareket artık sıradan önlemlerle kontrol edilemez durumda. Genel grevler şehirleri felç etti, silahlı partizanlar tüm illere hakim oldu ve [FROM.GetAdjective] hükümeti tüm ağırlığını devrimcilerin arkasına koydu. Güvenlik güçlerimiz yetersiz kalıyor ve sadakatleri artık kesin değil. Devletin bekası için savaşmaya ya da daha fazla kan dökülmeden önce kaçınılmaz olanı kabul etmeye şimdi karar vermeliyiz."
 INS_communist_events.1.t:0 "[ROOT.GetName] İçinde Devrim"
 INS_communist_events.10.a:0 "Dikkatli adım atmalıyız."
 INS_communist_events.10.desc:0 "[FROM.GetAdjective] broşürleri kışlalarda ve kamu hizmetlerinde dolaşıyor ve müsadere çabaları akıntıyı durdurmada pek işe yaramadı. Prangalarından kurtulan uluslardan, sömürge valilerini başlarından atıp kendi başlarına bir şeyler inşa eden halklardan bahsediyorlar. Duygular kulağa doğru gelmeseydi bastırmak daha kolay olurdu. Sadık yetkililer bile, mevcut düzenlememizin halkımıza mı yoksa sadece efendilerimize mi hizmet ettiğini sessizce sormaya başladılar."
 INS_communist_events.10.t:0 "[FROM.GetAdjective] Söylemi Destek Kazanıyor"
 INS_communist_events.2.a:0 "Devrim ileri doğru yürüyor."
 INS_communist_events.2.desc:0 "[FROM.GetName] hükümeti boyun eğmeyi reddetti ve silahlı kuvvetlerine devrimci hareketi güç kullanarak bastırma emri verdi. Oradaki yoldaşlarımız çoktan mevzileniyor ve kilit kaleleri ele geçiriyorlar. Mücadele kısa sürmeyecek, ancak [FROM.GetName] halkı seçimini yaptı ve onların yalnız kalmamasını sağlayacağız."
 INS_communist_events.2.t:0 "[FROM.GetNameDefCap] Savaşmayı Seçiyor"
 INS_communist_events.3.a:0 "Dünyanın çalışan halkları için büyük bir zafer."
 INS_communist_events.3.desc:0 "[FROM.GetName]'deki eski hükümet teslim oldu. Devrimci hareketin tam ölçeğiyle ve [ROOT.GetNameDef]'in bunun arkasında durduğuna dair kesin bilgiyle karşı karşıya kaldıklarında, boyun eğmekten başka ileriye dönük bir yol göremediler. İktidar yerel komünist partiye devredildi ve yeni hükümet rehberlik için şimdiden bize ulaşmaya başladı. Bir ulus daha eski düzenin pençesinden kurtarıldı."
 INS_communist_events.3.t:0 "[FROM.GetNameDefCap] Düştü"
 INS_communist_events.4.a:0 "Birlikleri gönderin. [FROM.GetName] bizimdir!"
 INS_communist_events.4.desc:0 "[FROM.FROM.GetNameDef]'in desteğiyle silahlanıp örgütlenen komünist devrimciler, [FROM.GetName]'de açık bir ayaklanma başlattılar. Sömürge yönetimi bölgenin büyük bölümünün kontrolünü kaybetti ve vali, yerel garnizonun takviye olmadan düzeni sağlayamayacağını bildiriyor."
 INS_communist_events.4.t:0 "[FROM.GetName] İçinde İç Savaş Patlak Veriyor"
 INS_communist_events.5.a:0 "Bu bir rezalet!"
 INS_communist_events.5.desc:0 "[FROM.GetName]'deki idare, komünist isyancılara savaşmadan teslim oldu. Vali ve personeli tutuklandı, bayrağımız indirildi ve yerine devrimci bir hükümet ilan edildi. Bütün bunlar, aylardır oradaki otoritemizi baltalamak için çalışan [FROM.FROM.GetNameDef] ve ajanları tarafından organize edildi. Bu, hırsızlıktan başka bir şey değildir ve cevapsız kalmayacaktır."
 INS_communist_events.5.t:0 "[FROM.GetName] Komünistlere Kaybedildi"
 INS_communist_events.6.a:0 "Buna müsamaha gösterilemez!"
 INS_communist_events.6.desc:0 "İstihbarat servislerimiz uzun zamandır şüphelendiğimiz şeyi doğruladı. [FROM.GetNameDefCap], sınırlarımız içinde radikal hücreleri finanse ederek, kışkırtıcı broşürler dağıtarak ve işçiler arasında grevler organize ederek sürekli bir yıkım kampanyası yürütüyor. Ajanları sendikalara ve kırsal kooperatiflere sızdılar ve şimdi açıkça hükümetimizin devrilmesi çağrısında bulunuyorlar. Durum kritik bir noktaya ulaştı ve kontrolden çıkmadan önce kararlı bir şekilde hareket etmeliyiz."
 INS_communist_events.6.t:0 "[ROOT.GetName] İçinde Kışkırtıcılık Yapan [FROM.GetAdjective] Ajanları"
 INS_communist_events.7.a:0 "Yayılmadan önce bunun kökünü kazımalıyız!"
 INS_communist_events.7.desc:0 "[FROM.FROM.GetName]'den rahatsız edici raporlar ulaştı. [FROM.GetNameDef] adına çalışan ajanlar, idaremize karşı olan şikayetleri sömürerek komünist bir ele geçirme için destek oluşturmak amacıyla yerel halk arasında devrimci duyguları körüklüyorlar. Eğer kontrol edilmezse, [FROM.FROM.GetNameDef] tamamen radikallere kaybedilebilir ve bu çürüme büyük ihtimalle diğer topraklarımıza da yayılabilir."
 INS_communist_events.7.t:0 "[FROM.GetName] İçinde Komünist Yıkıcı Faaliyetler"
 INS_communist_events.8.a:0 "Bu pisliği kimin dağıttığını bulun!"
 INS_communist_events.8.desc:0 "[FROM.GetAdjective] kökenli broşürler ve el ilanları fabrikalarımızda, pazarlarımızda ve üniversitelerimizde artan bir sıklıkla ortaya çıkıyor. Sınıf savaşının müjdesini veriyorlar ve devrim yoluyla kurtuluş vaat ediyorlar ve polisimiz hoşnutsuzlar arasında alıcı bir kitle bulduklarını bildiriyor. Materyal kaba ama etkili ve yayılması yavaşlama belirtisi göstermiyor."
 INS_communist_events.8.t:0 "[ROOT.GetName] İçinde Dolaşan [FROM.GetAdjective] Propagandası"
 INS_communist_events.9.a:0 "Bu yabancı ajanların kökünü derhal kazıyın!"
 INS_communist_events.9.desc:0 "[FROM.GetAdjective] operatifleri ülke genelinde bilinen kışkırtıcılar ve militan liderlerin yanında tespit edildi. Bir zamanlar sokak köşelerinde broşür dağıtan öğrenci organizatörleri, şimdi [FROM.GetAdjective] diplomatik belgeleri taşıyan adamlarla kapalı kapılar ardında toplantılar yapıyor. Yasaklı yayınlar, polisin müsadere edebileceğinden daha hızlı basılıyor ve bir zamanlar bir öğleden sonra sönüp giden protestolar, artık günlerce bütün semtleri kapatıyor. Bu komünistler her geçen gün daha büyük gruplar halinde örgütlenmeyi öğreniyorlar, eğer hızlı hareket etmezsek onların kontrolünü kaybedebiliriz."
 INS_communist_events.9.t:0 "Muhaliflerle Görüşen [FROM.GetAdjective] Subayları Görüldü"
 INS_dutch_events.1.a:0 "Eğer davayı güçlendiriyorsa taviz vermeliyiz."
 INS_dutch_events.1.b:0 "Gemilerimiz sadece Lahey'e cevap verecektir."
 INS_dutch_events.1.desc:0 "Anavatanımızın düşmesinin ardından, [INS.GetNameDef] deniz kuvvetlerimizin komutasını [INS.GetNameDef]'e devretmemiz için bize dilekçe verdi. Birleşik bir komutanlığın bu eşi görülmemiş zamanda daha iyi bir koordinasyon sağlayacağını savunuyorlar."
 INS_dutch_events.1.t:0 "[INS.GetNameDefCap] Donanmamızın Komutasını Talep Ediyor"
 INS_dutch_events.2.a:0 "Birlikte Pasifik'i tutacağız."
 INS_dutch_events.2.desc:0 "[HOL.GetNameDefCap], birleşik deniz kuvvetlerinin komutasını üstlenmemize izin veren teklifimizi kabul etti. Geçiş sorunsuz bir şekilde ilerliyor ve hem [HOL.GetAdjective] hem de [INS.GetAdjective] subayları Pasifik'teki konumumuzu güçlendirmek için yan yana çalışıyorlar."
 INS_dutch_events.2.t:0 "[HOL.GetNameDefCap] Deniz Komuta Teklifimizi Kabul Etti"
 INS_dutch_events.3.a:0 "Donanma nüfuzumuzu güçlendirmenin başka bir yolunu bulacağız."
 INS_dutch_events.3.desc:0 "[HOL.GetNameDefCap], lojistik ve idari endişeleri öne sürerek birleşik deniz komutanlığı teklifimizi reddetti. Hayal kırıklığı yaratsa da, savaş çabalarının diğer kanallarından işbirliğimiz devam ediyor."
 INS_dutch_events.3.t:0 "[HOL.GetNameDefCap] Deniz Komuta Teklifimizi Reddetti"
 INS_dutch_events.4.a:0 "Karşılıklı hayatta kalmaya doğru sağlam bir adım."
 INS_dutch_events.4.desc:0 "[HOL.GetNameDefCap], deniz kuvvetlerimizi yeniden düzenlemek ve genişletmek için ortak bir girişim olan [HOL.GetName]-[INS.GetName] Donanma Programının kurulduğunu duyurdu. [HOL.GetAdjective] uzmanlığı ve [INS.GetAdjective] insan gücü birlikte yeni bir Pasifik savunma ağının omurgasını oluşturacak."
 INS_dutch_events.4.t:0 "[HOL.GetNameDefCap], [HOL.GetName]-[INS.GetName] Donanma Programını Kuruyor"
 INS_exile_accepted_flag:0 "[HOL.GetNameDef] hükümetine sürgünde ev sahipliği yapıyor"
 INS_henri_winkelman_tt:0 "Henri Winkelman Transferi Reddedildi"
 INS_hey_btw_you_are_gonna_die_just_know_that_yeah_tt:0 "§RBu, oyunu sizin için sonlandıracaktır.§!"
 INS_industrial_events.28.a:0 "Anlaşıldı."
 INS_industrial_events.28.b:0 "Başka bir sevkiyat ayarlayın."
 INS_industrial_events.28.desc:0 "Konvoylar kauçuğun son kısmını da yükledi ve denize açıldı. Alıcılarımız ödediklerinin karşılığını alacak ve defterlerimiz de zamanı geldiğinde anlaşılan bedeli yansıtacak. Önümüzdeki iki yıl boyunca bu işlemin maliyeti bilançolarımızda yer alacak ve bize Buhran'ın bizden neler talep ettiğini hatırlatacak."
 INS_industrial_events.28.t:0 "Kauçuk Sevkiyatı Gönderildi"
 INS_industrial_events.36.a:0 "Anlaşıldı."
 INS_industrial_events.36.b:0 "Başka bir sevkiyat ayarlayın."
 INS_industrial_events.36.desc:0 "Tankerler rafinerilerimizden ayrıldı, ambarları alıcının limanlarına doğru yola çıktı. Tazminat üzerinde anlaşıldı ve tam olarak alınacak, ancak satışın yükü önümüzdeki iki yıl boyunca ekonomimizin üzerinde baskı yaratacak. Bunlar, bu kıt yıllarda dünyanın bize sunduğu şartlar."
 INS_industrial_events.36.t:0 "Petrol Sevkiyatı Gönderildi"
 INS_industrial_events.4.a:0 "[FROM.FROM.GetName] içinde petrol kuyuları inşa edeceğiz"
 INS_industrial_events.4.b:0 "[FROM.FROM.GetName] içinde bir alüminyum izabe tesisi açmalıyız"
 INS_industrial_events.4.c:0 "Üretiminden yoksun olduğumuz kaynakları aramalıyız"
 INS_industrial_events.4.d:0 "[FROM.FROM.GetName] içinde kömür madenleri açabiliriz"
 INS_industrial_events.4.desc:0 "[FROM.FROM.GetName] içindeki kauçuk tarlalarını kapatarak bütçede bölgedeki yeni endüstriyel projeler için yer açtık."
 INS_industrial_events.4.t:0 "[FROM.FROM.GetName] İçinde Bütçe Yeniden Tahsisi"
 INS_industrial_events.5.a:0 "Lonca'yı değiştirmeye değil, güçlendirmeye çalışmalıyız."
 INS_industrial_events.5.b:0 "Hint Adaları Loncasi'ni Hollanda Loncasi'ne sabitleyeceğiz."
 INS_industrial_events.5.c:0 "Hint Adaları Loncasi'ni ABD Doları'na sabitleyeceğiz."
 INS_industrial_events.5.desc:0 "[INS_industrial_events_5_desc_scripted]"
 INS_industrial_events.5.t:0 "[INS_industrial_events_5_t_scripted]"
 INS_industrial_events.6.a:0 "Şehirlerimize yatırım yapın."
 INS_industrial_events.6.b:0 "Dış adaları geliştirin."
 INS_industrial_events.6.c:0 "Askeri sanayimizi güçlendirin."
 INS_industrial_events.6.desc:0 "Kınakına Bürosu şartlarımızı kabul etti. Sıtma tropiklerin yarısını kasıp kavururken ve kinin yerine geçecek hiçbir şey ufukta görünmezken, pek seçenekleri yoktu. Yeni anlaşma, kıyılarımızdan ayrılan her gram kininden elde edilen kârın çok daha büyük bir payını bize garanti ediyor. Şimdi asıl soru bu beklenmedik kazancı nereye yönlendireceğimiz."
 INS_industrial_events.6.t:0 "Daha Kazançlı Bir Anlaşma"
 INS_industrial_events_5_desc_colonial:0 "De Javasche Bank'ın rezervleri son on yılın en düşük seviyesine geriledi. Lonca her ay daha az alım yapıyor ve plantasyon sahipleri ödemelerini döviz cinsinden talep ediyor. Mali danışmanlarımız Banka'nın tek başına bu düşüşü tersine çeviremeyeceği konusunda hemfikir, ancak çare konusunda keskin bir şekilde ayrışıyorlar."
 INS_industrial_events_5_desc_independent:0 "Bank Indonesia, Rupiah'ın sadece son çeyrekte değerinin beşte birini kaybettiğini bildirdi. Surabaya'daki pirinç tüccarları, yabancı banknotlar lehine onu tamamen reddetmeye başladı. Maliye bakanımız, para biriminin ancak kararlı ve hızlı hareket edersek kurtarılabileceği konusunda ısrar ediyor."
 INS_industrial_events_5_t_colonial:0 "De Javasche Bank'ın Kaderi"
 INS_industrial_events_5_t_independent:0 "Bank Indonesia'nın Kaderi"
 INS_limited_war_events.1.a:0 "Merdeka!"
 INS_limited_war_events.1.b:0 "Cumhuriyet için güzel bir gün."
 INS_limited_war_events.1.desc:0 "Düşman hatları kırıldı ve adamlarımız karşı çıkılmadan ilerliyor. Boğaz'ın ötesinde, Britanya kukla devleti halkın öfkesinin ağırlığı altında ufalanıyor. Londra'nın kuklaları süngülerinin onları tarihten koruyacağını düşündüler. Yanılıyorlardı."
 INS_limited_war_events.1.t:0 "Malaya'yı Ez!"
 INS_limited_war_events.2.a:0 "Adamları geri çekin. Kurtarabildiğimizi kurtarın."
 INS_limited_war_events.2.b:0 "Kuklalara boyun eğmeyeceğiz!"
 INS_limited_war_events.2.desc:0 "Kukla rejime karşı hızlı bir vuruş olarak vaat edilen şey ekşidi. İmparatorluk efendileri tarafından sertleştirilen [FROM.GetAdjective] kuvvetleri, adamlarımızı tartışmalı bölgeden sürdü ve şimdi oraya işgalci olarak oturdular. Her gün telsizler böbürlenmelerini taşıyor. İlerlemeye devam etmek daha fazla aşağılanmayı davet eder, ancak geri çekilmek tüm takımadalar önünde yenilgiyi itiraf etmektir."
 INS_limited_war_events.2.t:0 "[FROM.GetAdjective] Karşı Darbesi"
 INS_limited_war_events.3.a:0 "Endonezya yükseliyor."
 INS_limited_war_events.3.desc:0 "Kuala Lumpur'dan haber geldi. Londra'daki efendileri tarafından karar anında terk edilen kukla hükümet, şehirlerinin yanmasını görmektense şartlarımızı kabul etti. Tartışmalı topraklar bizim. Ders bölgedeki diğer kukla devletler tarafından gözden kaçırılmayacak."
 INS_limited_war_events.3.t:0 "[FROM.GetName] Cumhuriyete Boyun Eğiyor"
 INS_limited_war_events.4.a:0 "O zaman silahlar konuşsun."
 INS_limited_war_events.4.desc:0 "[FROM.GetName] teklifimizi yüzümüze geri attı. Whitehall'da yazılan bir metni okuyan kukla bakanlar, bir karış toprağın bile teslim edilmeyeceğini ve silahlar susmadan önce Cumhuriyetin kendisinin hizaya getirilmesi gerektiğini ilan ettiler."
 INS_limited_war_events.4.t:0 "[FROM.GetName] Şartlarımızı Geri Çeviriyor"
 INS_limited_war_events.5.a:0 "Ya birlikte ayakta kalırız ya da birlikte düşeriz."
 INS_limited_war_events.5.desc:0 "[FROM.GetNameDefCap], ölçülü savaşın son iddiasını da attı. Yayınları şimdi açıkça Cumhuriyeti parçalamaktan ve adalarını eski sömürgeci efendiler arasında paylaştırmaktan bahsediyor. Bu meselenin sessiz bir sonu olmayacak. Ya Endonezya bunun sonunda ayakta kalır ya da hiç ayakta kalmaz."
 INS_limited_war_events.5.t:0 "[FROM.GetNameDef] Yıkımımızı Çağırıyor"
 INS_limited_war_events.6.a:0 "Onlara şartlar sunun."
 INS_limited_war_events.6.b:0 "Kuklalara merhamet yok."
 INS_limited_war_events.6.desc:0 "[FROM.GetAdjective] hamlesi bizi hazırlıksız yakaladı ve bir süre en kötüsünden korktuk. Ancak sürüşleri çamura saplandı. Adamları yorgun, hatları uzun ve Londra'dan gelen palavralar her bildiride daha da inceliyor. Cumhuriyet yine de bağışlayıcı olabilir ve kuklalara bu işten çıkmaları için bir yol sunabilir, ancak çoğu kişi temiz bir zaferin davaya ölçülü bir zaferden daha iyi hizmet ettiğini söyleyecektir."
 INS_limited_war_events.6.t:0 "[FROM.GetAdjective] İlerlemesi Aksıyor"
 INS_limited_war_events.7.a:0 "Kötü bir barış, daha kötü bir savaştan iyidir."
 INS_limited_war_events.7.b:0 "Cumhuriyet teslim olmaz."
 INS_limited_war_events.7.desc:0 "İlerlememiz durdu ve daha da kötüsü, düşman bunu biliyor. Boğaz'ın ötesinden bir talep geldi. Şimdi silahları bırakın ve şartlarını kabul edin ya da aynı sonuç için kayıp listelerinin uzamasını izleyin. Sundukları seçim cenazenin boyutudur."
 INS_limited_war_events.7.t:0 "Saldırımız Durma Noktasına Geldi"
 INS_limited_war_events.8.a:0 "Öyleyse öyle olsun."
 INS_limited_war_events.8.desc:0 "[FROM.GetName] teklifimize meydan okuyarak yanıt verdi. Bakanları, Cumhuriyet'e tek bir taviz vermektense Penang'dan Johor'a kadar her kampongun ateşe verilmesini tercih edeceklerini ilan ediyorlar. Yani savaş devam ediyor."
 INS_limited_war_events.8.t:0 "[FROM.GetName] Eğilmeyi Reddediyor"
 INS_limited_war_events.9.a:0 "Endonezya ayakta!"
 INS_limited_war_events.9.desc:0 "Düşman komutanlığından gelen telsiz kesmeleri en kötüsünü doğruladı. Uzlaşma, ölçülü barış, tuttuğumuz hatlara geri dönüş olmayacak. Kuklalar ve Londra'daki efendileri, Endonezya'nın çarkta kırılmasını ve adalarının onları kopardığımız emperyalist çizmeye geri verilmesini, yani Cumhuriyetin tam teslimiyetini talep ediyorlar. Buna verilecek tek bir cevap var."
 INS_limited_war_events.9.t:0 "[FROM.GetName] Cumhuriyeti Kırmayı Amaçlıyor!"
 INS_loyalist_events.1.a:0 "Derhal transferini ayarlayacağız."
 INS_loyalist_events.1.b:0 "Henri Winkelman'a anavatanda ihtiyaç var."
 INS_loyalist_events.1.desc:0 "[INS.GetLeader], dünya çapında devam eden çatışmalar ve [INS.GetNameDef]'in içinde bulunduğu tehlikeli konum hakkında bizimle temasa geçti. [INS.GetLeader], sömürgenin güvenliğini sağlamak için Kraliyet Hollanda Doğu Hint Adaları Ordusu eski Komutanı Henri Winkelman'ın resmen [INS.GetNameDef]'e geri transfer edilmesini önerdi."
 INS_loyalist_events.1.t:0 "[INS.GetLeader], Henri Winkelman'ın transferini talep ediyor"
 INS_loyalist_events.10.a:0 "Sözümüzü verdik."
 INS_loyalist_events.10.desc:0 "[FROM.GetName] içindeki referandum, [FROM.FROM.GetNameDef] ile birleşme lehine kesin bir oyla sonuçlandı. Bölgedeki yöneticilerimiz sonucun beklendiğini bildiriyor. Buna saygı göstermekle yükümlüyüz."
 INS_loyalist_events.10.t:0 "[FROM.GetNameDefCap] Birleşme İçin Oy Verdi"
 INS_loyalist_events.11.a:0 "Yuvaya hoş geldiniz."
 INS_loyalist_events.11.desc:0 "[MAL.GetName] halkı ulusumuza katılmaya oy verdi. [MAL.GetAdjective] yetkilileri otorite devrini başlatmak için idaremizle işbirliği yapıyor. Malay dünyasının haritasında bir sınır daha eksilecek."
 INS_loyalist_events.11.t:0 "Malaya Referandumu Başarılı Oldu"
 INS_loyalist_events.12.a:0 "Bunu unutmayacağız."
 INS_loyalist_events.12.desc:0 "[MAL.GetName] ile birleşme önerimiz reddedildi. [MAL.GetAdjective] hükümeti veya onların üstündekiler buna karşı karar verdiler. Konuyu daha uygun bir zamanda tekrar gözden geçirmemiz gerekecek."
 INS_loyalist_events.12.t:0 "Malaya Birleşmesi Reddedildi"
 INS_loyalist_events.13.a:0 "Adil bir anlaşma."
 INS_loyalist_events.13.b:0 "Singapur satılık değil."
 INS_loyalist_events.13.desc:0 "[FROM.GetAdjective] hükümeti Singapur ile ilgili bir teklifle bize yaklaştı. Adanın Malay dünyasındaki yerini öne sürerek ada üzerinde egemenlik talep ediyorlar. Buna karşılık, limana, askeri tesislere ve şu anda yürürlükte olan tüm kaynak çıkarma haklarına erişimimizin devam etmesini garanti etmeye hazırlar."
 INS_loyalist_events.13.t:0 "[FROM.GetNameDefCap] Singapur Üzerine Uzlaşma Öneriyor"
 INS_loyalist_events.14.a:0 "Boğazlar bizimdir."
 INS_loyalist_events.14.desc:0 "Anlaşma kabul edildi. Eski kontrolörler limana ticari ve askeri erişimlerini korurken, Singapur bizim kontrolümüze devredilecek. Bayrağımız artık Asya'nın en önemli limanlarından birinde dalgalanıyor."
 INS_loyalist_events.14.t:0 "Singapur Uzlaşması Kabul Edildi"
 INS_loyalist_events.15.a:0 "Öyle olsun."
 INS_loyalist_events.15.desc:0 "Önerimiz reddedildi. Singapur'un kontrolörleri hiçbir şart altında adadan ayrılmaya istekli değiller. Onlara egemenliğin devamı dışında her şeyi teklif ettik ve bu yeterli olmadı."
 INS_loyalist_events.15.t:0 "Singapur Uzlaşması Reddedildi"
 INS_loyalist_events.16.a:0 "Pekala, bırakın alsınlar."
 INS_loyalist_events.16.b:0 "Seylan kontrolümüz altında kalacak."
 INS_loyalist_events.16.desc:0 "[FROM.GetAdjective] hükümeti Seylan'ın devri için resmi bir talepte bulundu. Diplomatları, ada ile Malay dünyası arasındaki uzun süredir devam eden ticari ve etnik bağları öne sürüyor. Dürüst olmak gerekirse bu talep zayıf, ancak [FROM.GetNameDef] bu tür taleplerin ciddi şekilde değerlendirilmesi gerekecek kadar güçlendi."
 INS_loyalist_events.16.t:0 "[FROM.GetNameDefCap] Seylan'ın Devrini Talep Ediyor"
 INS_loyalist_events.17.a:0 "Mükemmel."
 INS_loyalist_events.17.desc:0 "Seylan'ın devri tamamlandı. İdaremiz yetkilileri adaya taşımaya başladı ve devir teslim olaysız bir şekilde gerçekleşti. Artık boğazın her iki tarafında da bir konumumuz var."
 INS_loyalist_events.17.t:0 "Seylan Devredildi"
 INS_loyalist_events.18.a:0 "Belki başka zamana."
 INS_loyalist_events.18.desc:0 "Seylan'ın devri talebimiz reddedildi. Mevcut kontrolörlerin adadan ayrılma gibi bir niyetleri yok ve diplomatlarımız bu konuda daha fazla tartışmanın sonuçsuz kalacağını bildiriyor."
 INS_loyalist_events.18.t:0 "Seylan Talebi Reddedildi"
 INS_loyalist_events.19.a:0 "Bırakın oylamalarını yapsınlar."
 INS_loyalist_events.19.b:0 "Buna izin vermeyeceğiz."
 INS_loyalist_events.19.desc:0 "[FROM.GetNameDefCap] doğu Papua'da bir referandum yapılmasına izin vermemizi talep etti. Sınırın [FROM.GetAdjective] tarafında ormandan geçen yeni yollar, devlet doktorlarıyla dolu klinikler ve yerel dillerde eğitim veren okullar var. Bizim tarafımızda ise son vali üç yıl içinde Port Moresby'yi sadece iki kez ziyaret etti. [FROM.GetAdjective] büyükelçisinin bundan daha fazlasını söylemesine gerek yoktu."
 INS_loyalist_events.19.t:0 "[FROM.GetNameDefCap] Papua'da Referandum Talep Ediyor"
 INS_loyalist_events.2.a:0 "Bu çok yardımcı olacak."
 INS_loyalist_events.2.desc:0 "[INS.GetLeader], [HOL.GetLeader] ile görüştüğü [HOL.GetNameDef]'den döndü. Toplantı iyi geçti, [HOL.GetLeader] durumu kabul etti ve Winkelman'ın derhal transferini kabul etti. Henri Winkelman, emirlerimizi bekleyeceği [1058.GetName]'e doğru yola çıktı."
 INS_loyalist_events.2.t:0 "[HOL.GetLeader] Henri Winkelman'ı transfer etmeyi kabul etti."
 INS_loyalist_events.20.a:0 "Ada sonunda bir bütün oldu."
 INS_loyalist_events.20.desc:0 "Avustralyalılar referandumu yapmayı kabul etti. Doğu Papua'daki her bölge aynı sonucu verdi. Adanın batı yarısındaki yatırımımız, herhangi bir kampanya afişinin söyleyebileceğinden daha yüksek sesle konuştu."
 INS_loyalist_events.20.t:0 "Papua Referandumu Onaylandı"
 INS_loyalist_events.21.a:0 "Bunu hatırlayacağız."
 INS_loyalist_events.21.desc:0 "Avustralyalılar reddetti. Port Moresby'deki valileri, talebi Avustralya egemenliğine bir hakaret olarak nitelendiren bir bildiri yayınladı. Papua halkının kendisine ise danışılmadı."
 INS_loyalist_events.21.t:0 "Papua Referandumu Reddedildi"
 INS_loyalist_events.22.a:0 "Uğruna savaşmaya değmez."
 INS_loyalist_events.22.b:0 "Timor bizimdir ve öyle kalacaktır."
 INS_loyalist_events.22.desc:0 "[FROM.GetAdjective] hükümeti Doğu Timor'un teslim edilmesi için resmi bir talepte bulundu. Büyükelçileri, oradaki garnizonumuzun iki yüz kişiden az olduğunu ve Lizbon'un yıllardır bölgeye neredeyse hiçbir şey ayırmadığını belirtti. Sonra da tam olarak neye tutunduğumuzu düşündüğümüzü sordu."
 INS_loyalist_events.22.t:0 "[FROM.GetNameDefCap] Doğu Timor'u Talep Ediyor"
 INS_loyalist_events.23.a:0 "Olması gerektiği gibi."
 INS_loyalist_events.23.desc:0 "Doğu Timor'un kontrolörleri garnizonlarını geri çekmeye ve sömürge yönetimini toplamaya başladılar. Tüm ada yakında [INS.GetAdjective] otoritesi altında olacak."
 INS_loyalist_events.23.t:0 "Doğu Timor Teslim Edildi"
 INS_loyalist_events.24.a:0 "Hazırlıklara başlayın."
 INS_loyalist_events.24.desc:0 "Dili'deki sömürge valisi talebimizi reddetmek için bizzat yazdı ve Doğu Timor'un hükümetinin egemen toprağı olarak kaldığında ısrar etti. Genelkurmayımız, kabinenin konuyu daha ileriye taşımak istemesi ihtimaline karşı acil durum planları hazırladı."
 INS_loyalist_events.24.t:0 "Doğu Timor Talebi Reddedildi"
 INS_loyalist_events.25.a:0 "Kabul ediyoruz."
 INS_loyalist_events.25.b:0 "Bu cumhuriyet için çok savaştık."
 INS_loyalist_events.25.desc:0 "Bir [FROM.GetAdjective] delegasyonu iki cumhuriyetimizin birleşmesi önerisiyle geldi. Halklarımızın, bizi ayıran sömürge sınırlarından çok daha eski ortak Avustronezya köklerini paylaştığını ve takımadalara yayılan tek bir devletin Güneydoğu Asya'daki en büyük güç olacağını savunuyorlar. Kabul etmek, hükümetimizi feshetmek ve onlara entegre olmak anlamına gelecektir."
 INS_loyalist_events.25.t:0 "[FROM.GetNameDefCap] Birleşme Öneriyor"
 INS_loyalist_events.26.a:0 "Yeni bir çağ başlıyor."
 INS_loyalist_events.26.desc:0 "[FROM.GetAdjective] hükümeti önerimizi kabul etti. Yetkilileri, entegrasyon sürecini başlatmak için şimdiden bizimkilerle koordinasyon kuruyor. Açe'den Luzon'a, Borneo'dan Mindanao'ya kadar ulusumuz artık Malay takımadalarının tüm genişliğini kapsıyor."
 INS_loyalist_events.26.t:0 "[FROM.GetNameDefCap] Birleşmeyi Kabul Ediyor"
 INS_loyalist_events.27.a:0 "Yazık oldu."
 INS_loyalist_events.27.desc:0 "[FROM.GetAdjective] hükümeti reddetti. Kendi bağımsızlık mücadeleleri, egemenliklerini başka bir devlete teslim edemeyecek kadar yakın zamanda oldu ve çok maliyetliydi. Öneri rafa kaldırıldı."
 INS_loyalist_events.27.t:0 "[FROM.GetNameDefCap] Birleşmeyi Reddediyor"
 INS_loyalist_events.28.a:0 "Halkın söz hakkı olmalı."
 INS_loyalist_events.28.b:0 "Söz konusu bile olamaz."
 INS_loyalist_events.28.desc:0 "[FROM.GetNameDefCap], birleşme meselesi üzerine [PHI.GetName]'de bir referandum yapılmasına izin vermemizi resmen talep etti. Diplomatları, her iki halkın paylaştığı Avustronezya soyunu ve onları ayıran sömürge sınırlarının yapay doğasını vurguluyor. Oylama gerçekleşirse, sonucun [FROM.GetNameDef] lehine olması muhtemeldir."
 INS_loyalist_events.28.t:0 "[FROM.GetNameDefCap], [PHI.GetName] İçinde Referandum Talep Ediyor"
 INS_loyalist_events.29.a:0 "Bu ilginç bir öneri."
 INS_loyalist_events.29.b:0 "Kesinlikle hayır."
 INS_loyalist_events.29.desc:0 "[FROM.FROM.GetNameDefCap], paylaşılan Avustronezya mirasına dayanarak iki ulusumuzun birleşmesini önerdi. Süzerenimiz konu hakkında bir referandum düzenlemelerine izin verdi ve [FROM.FROM.GetAdjective] kampanyacıları çoktan gelmeye başladı. Sonuç, cumhuriyetimizin [FROM.FROM.GetNameDef]'e mi katılacağını yoksa mevcut düzenlemeleri altında mı devam edeceğini belirleyecek."
 INS_loyalist_events.29.t:0 "Birleşme Referandumu Onaylandı"
 INS_loyalist_events.3.a:0 "Aceleyle yeni bir plan yapmalıyız."
 INS_loyalist_events.3.desc:0 "[INS.GetLeader], [HOL.GetLeader] ile görüştüğü [HOL.GetNameDef]'den döndü. Ne yazık ki, Henri Winkelman Hint Adaları'na gönderilmeyecek ve onsuz kendimizi savunmak zorunda kalacağız."
 INS_loyalist_events.3.t:0 "[HOL.GetLeader] Henri Winkelman'ı transfer etmeyi reddetti"
 INS_loyalist_events.30.a:0 "Bunun sonu budur."
 INS_loyalist_events.30.desc:0 "Seçim sandıkları sayıldı ve [FROM.FROM.GetAdjective] kampanyacıları geri gönderildi. [FROM.GetAdjective] halkı kalmaya oy verdi. Görünüşe göre bağımsızlık, [FROM.Capital.GetCapitalVictoryPointName]'de hala bir anlam ifade ediyor."
 INS_loyalist_events.30.t:0 "[FROM.GetNameDefCap] Birleşmeye Karşı Oy Verdi"
 INS_loyalist_events.31.a:0 "Halk konuştu."
 INS_loyalist_events.31.desc:0 "Seçim sandıkları sayıldı. [FROM.GetAdjective] halkı bizim yerimize [FROM.FROM.GetNameDef]'i seçti ve fark az değildi. Yöneticilerimiz devir işlemini başlatmak için şimdiden talimatlar alıyor."
 INS_loyalist_events.31.t:0 "[FROM.GetNameDefCap] Birleşme İçin Oy Verdi"
 INS_loyalist_events.32.a:0 "Sonunda birlikteyiz."
 INS_loyalist_events.32.desc:0 "[PHI.GetAdjective] referandumu lehimize sonuçlandı. Hükümetleri sonucu kabul etti ve otorite devrini ayarlamak için dışişleri bakanlığımızla temasa geçti."
 INS_loyalist_events.32.t:0 "[PHI.GetNameDefCap] Birleşmeye Oy Verdi"
 INS_loyalist_events.33.a:0 "Bir gerileme, hepsi bu."
 INS_loyalist_events.33.desc:0 "[PHI.GetAdjective] hükümeti birleşme önerimizi reddetti. Parlamentoları bunu ikinci kez okumaya bile gerek görmeden oylayarak reddetti. Onlara Güneydoğu Asya'nın en büyük ulusunda bir yer teklif ettik ve onlar buna tükürdüler."
 INS_loyalist_events.33.t:0 "[PHI.GetNameDefCap] Birleşmeyi Reddediyor"
 INS_loyalist_events.4.a:0 "Öneriyi kabul ediyoruz."
 INS_loyalist_events.4.b:0 "Reddetmeliyiz."
 INS_loyalist_events.4.desc:0 "Bir [FROM.GetAdjective] delegasyonu, birleşme önerisiyle [ROOT.Capital.GetCapitalVictoryPointName]'e ulaştı. Halklarımızın ortak Malay mirasına dikkat çekiyorlar ve uluslarımız arasındaki sınırların bu topraklarda yaşayan halklar tarafından değil, Avrupalı sömürge yöneticileri tarafından belirlendiğini belirtiyorlar. Öneri, her iki hükümetin de feshedilmesini ve tek bir devlet olarak yeniden kurulmasını öngörüyor."
 INS_loyalist_events.4.t:0 "[FROM.GetNameDefCap] Birleşme Öneriyor"
 INS_loyalist_events.5.a:0 "Birlikte daha güçlüyüz!"
 INS_loyalist_events.5.desc:0 "Diplomatlarımız [FROM.Capital.GetCapitalVictoryPointName]'den mükemmel haberlerle döndüler. [FROM.GetAdjective] hükümeti önerimizi kabul etti ve yetkilileri bölgelerinin idaremize entegrasyonu için şimdiden düzenlemeler yapıyor."
 INS_loyalist_events.5.t:0 "[FROM.GetNameDefCap] Birleşmeyi Kabul Ediyor"
 INS_loyalist_events.6.a:0 "Kendi kayıpları."
 INS_loyalist_events.6.desc:0 "Diplomatlarımız [FROM.Capital.GetCapitalVictoryPointName]'den elleri boş döndüler. [FROM.GetAdjective] hükümeti öneriyi değerlendirmeye istekli değildi. Çok az neden sunuldu ve delegasyonumuz sadece nezaket kuralları çerçevesinde evine gönderildi."
 INS_loyalist_events.6.t:0 "[FROM.GetNameDefCap] Birleşmeyi Reddediyor"
 INS_loyalist_events.7.a:0 "Bırakın halk karar versin."
 INS_loyalist_events.7.b:0 "Buna izin vermeyeceğiz."
 INS_loyalist_events.7.desc:0 "[FROM.GetNameDefCap], devletleriyle birleşme meselesi üzerine [MAL.GetName]'de bir referandum yapılmasına izin vermemizi resmen talep etti. Büyükelçileri olası sonuç hakkında oldukça açık sözlüydü ve sınırın her iki tarafındaki Malay halkının kendilerini tek bir ulus olarak gördüğünü belirtti. Oylamaya izin vermek neredeyse kesinlikle [MAL.GetName]'i kaybetmek anlamına gelecektir."
 INS_loyalist_events.7.t:0 "[FROM.GetNameDefCap], [MAL.GetName] İçinde Referandum Talep Ediyor"
 INS_loyalist_events.8.a:0 "Onlara katılacağız."
 INS_loyalist_events.8.b:0 "Kalmayı tercih ederiz."
 INS_loyalist_events.8.desc:0 "Süzerenimiz, [FROM.FROM.GetNameDef]'in ülkemizde bir referandum düzenlemesine izin verdi. [FROM.FROM.GetAdjective] kampanyacıları kalabalık bir şekilde geldi ve oylama bu ay içinde başlayacak. Halkımıza sorulan soru basit. [FROM.FROM.GetNameDef]'e katılmak mı istiyoruz, yoksa olduğumuz gibi kalmak mı?"
 INS_loyalist_events.8.t:0 "[FROM.GetNameDefCap] Birleşme Referandumunu Onaylıyor"
 INS_loyalist_events.9.a:0 "Beklendiği gibi."
 INS_loyalist_events.9.desc:0 "[FROM.GetName] içindeki referandum sonuçlandı. [FROM.GetAdjective] halkı bizim idaremiz altında kalmaya oy verdi. [FROM.FROM.GetAdjective] kampanyacıları ayrıldı."
 INS_loyalist_events.9.t:0 "[FROM.GetNameDefCap] Birleşmeye Karşı Oy Verdi"
 INS_martial_law_events.1.a:0 "Elbette!"
 INS_martial_law_events.1.b:0 "İlgilenmiyoruz."
 INS_martial_law_events.1.desc:0 "[INS.GetName] Başkanı, aramızdaki ticari ilişkiyi güçlendirme ve [INS.GetName]'nin ortak refah alanında daha büyük bir role sahip olması yönündeki isteklerini ifade etmek için bize ulaştı. [INS.GetName]'nin başkanı [INS.GetLeader], kauçuk ve diğer kaynakların bize herhangi bir ücret veya vergi olmaksızın satılacağı ve piyasa kontrollerinin düşük fiyatlar sağlayacağı cazip bir anlaşma teklif etti."
 INS_martial_law_events.1.t:0 "[INS.GetNameDefCap] bizimle ticari ilişkileri güçlendirmek istiyor"
 INS_martial_law_events.10.a:0 "Harika!"
 INS_martial_law_events.10.desc:0 "[JAP.GetName], Kuzey Malay'ın transferine aracılık etmeyi kabul etti ve [INS.GetAdjective] elçileriyle birlikte [SIA.GetCapitalVictoryPointName]'de müzakere yapmak üzere elçiler gönderdi. Üç taraf arasında, Kuzey Malay'ın derhal geçerli olmak üzere [INS.GetAdjective] bölgesi olduğu sonucuna varan bir anlaşmaya varıldı."
 INS_martial_law_events.10.t:0 "[JAP.GetName] ve [FROM.GetName] aktarımı kabul ediyor"
 INS_martial_law_events.11.a:0 "O zaman savaştır."
 INS_martial_law_events.11.desc:0 "[SIA.GetLeader] bir toplantıya katılmayı reddetti ve sonuçları ne olursa olsun Kuzey Malay'dan vazgeçmeye niyeti olmadığını açıkça ortaya koydu. Bu kararın ciddiyetini belirttiğimizde [SIA.GetLeader] ikna olmadı ve blöfümüzü görerek herhangi bir talebe uymayı reddetti. Maalesef bu bize devam etmek için pek fazla seçenek bırakmıyor."
 INS_martial_law_events.11.t:0 "[FROM.GetName] aktarımı reddediyor"
 INS_martial_law_events.12.a:0 "O zaman savaştır."
 INS_martial_law_events.12.desc:0 "[FROM.GetName]'nin elçileri [ROOT.GetCapitalVictoryPointName]'ye geldiler ve [SIA.GetAdjective]'nin herhangi bir transfer veya müzakereye uymayı açıkça reddettiğine ve [JAP.GetNameDef]'nin [SIA.GetNameDef]'yi resmi olarak gruptan attığına dair talihsiz haberi getirdiler."
 INS_martial_law_events.12.t:0 "[FROM.GetName] bize [SIA.GetName]'nin uymayı reddettiğini bildirdi"
 INS_martial_law_events.13.a:0 "Bunu hak ettiler."
 INS_martial_law_events.13.b:0 "Kesinlikle hayır."
 INS_martial_law_events.13.desc:0 "[FROM.GetName], [FROM.GetLeader]'nin, [SIA.GetName]'nin kendisi için ayağa kalkamayan zayıf bir ulus olduğuna olan inancından dolayı, [SIA.GetName] üzerindeki hakimiyeti güvence altına alma istekleri hakkında bizi bilgilendirdi; bu, Kuzey Malay'ın talebine anında boyun eğmeleriyle fazlasıyla açık bir şekilde ortaya çıktı. [INS.GetName]'nin gruba sağladığı değer önemsiz değil ve eğer isteklerini yerine getirmezsek müttefik olarak onları kaybetme riskiyle karşı karşıya kalacağız gibi görünüyor."
 INS_martial_law_events.13.t:0 "[FROM.GetName], [SIA.GetName]'nin derebeyliğini talep ediyor"
 INS_martial_law_events.14.a:0 "Harika."
 INS_martial_law_events.14.desc:0 "[FROM.GetName] hükümeti, [SIA.GetNameDef]'yi derhal geçerli olmak üzere yetkimiz altına almayı kabul etti."
 INS_martial_law_events.14.t:0 "[FROM.GetName] aktarımı kabul ediyor"
 INS_martial_law_events.15.a:0 "Çok yazık."
 INS_martial_law_events.15.desc:0 "[FROM.GetName] hükümeti, kendilerini savunamadıklarını kanıtlamalarına rağmen [SIA.GetName] üzerindeki derebeyliği bize devretmeyi reddetti."
 INS_martial_law_events.15.t:0 "[FROM.GetName] aktarımı reddediyor"
 INS_martial_law_events.16.a:0 "Bu sadece bir iç yeniden yapılanmadır, aynı liderliği koruyun."
 INS_martial_law_events.16.b:0 "Hatta devralacak"
 INS_martial_law_events.16.c:0 "Kartosoewirjo popüler bir seçimdir!"
 INS_martial_law_events.16.d:0 "Şimdilik askeri yönetime ihtiyaç var."
 INS_martial_law_events.16.desc:0 "Hükümetimizin Endonezya Eyaletler Birliği olarak yeniden yapılandırılmasıyla birlikte, demokratik olarak seçilmiş bir konseyi denetleyen önceki Başkanlık organı sistemi, yeni bir federal başkanlık sistemiyle değiştirilecek. Yeni bir başkan seçmeliyiz"
 INS_martial_law_events.16.t:0 "[ROOT.GetName] için yeni bir liderlik"
 INS_martial_law_events.2.a:0 "Bu her iki ekonomimize de büyük fayda sağlayacak!"
 INS_martial_law_events.2.desc:0 "[ROOT.GetLeader], bugün [JAP.GetCapitalVictoryPointName]'de [JAP.GetAdjective] hükümetiyle yaptığı toplantıdan iyi haberlerle döndü; [JAP.GetCapitalVictoryPointName]'de önerilen ticaret anlaşması tüm taraflarca kabul edildi ve kısa süre içinde yürürlüğe girecek."
 INS_martial_law_events.2.t:0 "[FROM.GetName] ticaret anlaşmasını kabul etti"
 INS_martial_law_events.3.a:0 "Çok yazık."
 INS_martial_law_events.3.desc:0 "[ROOT.GetLeader], bugün [JAP.GetCapitalVictoryPointName]'de [JAP.GetAdjective] hükümetiyle yaptığı toplantıdan, her iki tarafın da belirli konularda taviz vermeyi reddetmesi ve hiçbir ticaret anlaşmasının kabul edilmemesi nedeniyle müzakerelerin bayatladığı yönündeki talihsiz haberle döndü."
 INS_martial_law_events.3.t:0 "[FROM.GetName] ticaret anlaşmasını reddetti"
 INS_martial_law_events.4.a:0 "Onların tarihi topraklarına ilişkin haklarını tanıyacağız."
 INS_martial_law_events.4.b:0 "Bu bizim endişemiz değil."
 INS_martial_law_events.4.desc:0 "[FROM.GetNameDef]'den bir elçi hükümetimize resmi bir talepte bulundu. Malay dünyasının birleşmesini hükümetinin en önemli hedefi olarak ilan eden Başkan [FROM.GetLeader], Sri Lanka'dan Filipinler'e kadar tüm etnik Malay topraklarına yönelik [INS.GetAdjective] iddiasını tanımamızı istiyor."
 INS_martial_law_events.4.t:0 "[FROM.GetName], Malay iddialarını tanımamızı talep ediyor"
 INS_martial_law_events.5.a:0 "Birlik!"
 INS_martial_law_events.5.desc:0 "[FROM.GetName] hükümeti Malay toprakları üzerindeki iddiamızı resmen tanıdı. En güçlü müttefikimizin onayıyla Malay dünyasının birleşmesi çok daha mümkün görünüyor."
 INS_martial_law_events.5.t:0 "[FROM.GetName] iddialarımızı kabul ediyor"
 INS_martial_law_events.6.a:0 "Bu sadece bir engel, direneceğiz, başaracağız!"
 INS_martial_law_events.6.desc:0 "[FROM.GetName] hükümeti Malay dünyasına yönelik iddiamızı tanımayı reddetti. Görünüşe göre sözde müttefiklerimiz bizim güçlenmemizi görmektense Malay halklarını bölünmüş halde tutmayı tercih ediyor. Zamanı gelince bu hakareti hatırlayacağız."
 INS_martial_law_events.6.t:0 "[FROM.GetName] iddialarımızı kabul etmeyi reddediyor"
 INS_martial_law_events.7.a:0 "Anlaşmaya saygı duymalıyız."
 INS_martial_law_events.7.b:0 "Bu, hizip içinde çatışma yaratmaya değmez."
 INS_martial_law_events.7.desc:0 "[FROM.GetName], Kuzey Malay'ın şu anda [SIA.GetName] tarafından kontrol edilen [FROM.GetName]'ye transferini organize ederek Malay iddialarını tanımamızı onurlandırmamız yönünde resmi bir talep gönderdi. Bu hareket [SIA.GetAdjective] liderliğini kızdırabilir ancak [INS.GetName] ile bağlarımızı ciddi şekilde güçlendirecektir."
 INS_martial_law_events.7.t:0 "[FROM.GetName], Kuzey Malay'ın kontrolünü talep ediyor"
 INS_martial_law_events.8.a:0 "Takip etmekte yetersiz kaldıklarını gösterdiler."
 INS_martial_law_events.8.desc:0 "İddialarımızı resmi olarak kabul etmelerine rağmen, [JAP.GetAdjective] hükümeti Kuzey Malay'ın transferine aracılık etmeyi reddetti ve [JAP.GetLeader], grup içinde çatışma riskini göze alamayacakları konusunda ısrar etti. Aciliyet karşısında sözlerinin boş olduğu ve sözlerinin pek bir anlam taşımadığı açıktır."
 INS_martial_law_events.8.t:0 "[FROM.GetName] isteğimizi reddediyor"
 INS_martial_law_events.9.a:0 "Sanki başka seçeneğimiz varmış gibi değil."
 INS_martial_law_events.9.a.tt:0 "§W§RZayıf olarak algılanma riskiyle karşı karşıyayız, bu da gelecekte tavizler talep edilmesine yol açabilir.§!§!"
 INS_martial_law_events.9.b:0 "Emperyalizme boyun eğmeyeceğiz!"
 INS_martial_law_events.9.desc:0 "[FROM.GetName], [INS.GetName]'nin, tüm etnik Malay topraklarındaki iddialarının bir parçası olarak Kuzey Malayca'yı [INS.GetName]'ye transfer etmemizi talep ettiğini bize bildirdi. [JAP.GetAdjective] hükümeti, [INS.GetAdjective] iddialarını resmi olarak destekliyor ve [JAP.GetAdjective] danışmanları, reddedersek silahlı çatışma riskiyle karşı karşıya kalabileceğimiz konusunda uyarıyor."
 INS_martial_law_events.9.t:0 "[FROM.GetName], Kuzey Malay dilini [INS.GetNameDef]'ye aktarmamızı talep ediyor"
 INS_peta_explain_tt:0 "[JAP.GetName] geri püskürtülürse işgalin yarattığı kaosu tam bağımsızlık ilan etmek için kullanabileceğiz."
 INS_peta_explain_tt_jap:0 "§R[INS.GetName] bize sadık kalabilir, ancak toprak kontrolünü kaybetmeye başlarsak blöfümüzü görüp bağımsızlık ilan edebilirler§!."
 INS_political_events.1.a:0 "Kraliçe'nin istediği gibi."
 INS_political_events.1.b:0 "[INS.GetLeader] iyi iş çıkardı, bir dönem daha görev yapmalı."
 INS_political_events.1.desc:0 "[INS.GetLeader] adlı liderin beş yıllık görev süresi sona yaklaşıyor ve bu nedenle onun yerine geçecek uygun bir lidere karar vermeliyiz. Kraliçe Wilhelmina, Olağanüstü Büyükelçi ve Tam Yetkili Bakan olarak büyük umut vaat eden Alidius Tjarda van Starkenborgh Stachouwer'i önerdi."
 INS_political_events.1.t:0 "[INS.GetNameDef] İçin Yeni Genel Vali"
 INS_political_events.11.a:0 "Bir sürpriz, ama hoş bir sürpriz."
 INS_political_events.11.desc:0 "Bağımsızlığımızı ilan ettikten sonra milislerimiz beklediğimiz Hollanda işgaline karşı topraklarımızı savunmak için hemen harekete geçti. Ancak birçok kişiyi şaşırtacak şekilde [HOL.GetLeader] bir işgal çağrısı yapmayacağını, bunun yerine Hollanda anavatanını yeniden inşa etmeye öncelik vereceğini ve daha fazla çatışmadan kaçınacağını duyurdu."
 INS_political_events.11.t:0 "[HOL.GetNameDefCap] Endonezya egemenliğini tanıyor"
 INS_political_events.12.a:0 "Sukarno ile müzakerelere devam etmeliyiz"
 INS_political_events.12.b:0 "Devrimcilerle işbirliği yapmakla ilgilenmiyoruz."
 INS_political_events.12.desc:0 "Birliklerimiz [?event_target:INS_invasion_event_invaded_state.GetName] bölgesine çıktı ve Endonezya cephesinde zafer an meselesi. Endonezya'yı işgal etme konusunda nasıl bir yol izleyeceğimize karar vermeliyiz. Doğrudan işgal, ihtiyacımız olan kaynakları elde etmemizi sağlayacak olsa da pahalı ve zor olacaktır. Önde gelen bir devrimci olan Sukarno ile görüştük ve resmi olarak kısmen Sukarno tarafından yönetilen, ancak bizim komutamız altında olan bir Endonezya kukla devleti kuracağımız bir plan hazırladık. Bu Endonezyalı sivilleri sakin tutacak ve tam işgalden çok daha ucuza mal olacaktır."
 INS_political_events.12.t:0 "Endonezyalı Milliyetçilerle Toplantı"
 INS_political_events.13.a:0 "Milliyetçileri tutuklayacağız ve evimizi ölene kadar savunacağız!"
 INS_political_events.13.b:0 "Tehlikeli ama belki de bu bağımsız olmak için gerçek bir şanstır?"
 INS_political_events.13.desc:0 "[?event_target:INS_invasion_event_invader.GetName] askerleri [?event_target:INS_invasion_event_invaded_state.GetName] bölgesine ulaştı ve bölgedeki sayıca çok az olan askerlerimize, [?event_target:INS_invasion_event_invaded_state.GetName] bölgesini tamamen askeri olarak tahliye etmeleri emredildi. [?event_target:INS_invasion_event_invader.GetAdjective] kuvvetleri Hint Adaları'nda ilerlemeye devam ediyor ve işgalden kaçınma şansımız kasvetli görünüyor. Ayrıca casuslarımız [?event_target:INS_invasion_event_invader.GetLeader] adlı liderin, Refah Alanı altında Sukarno tarafından yönetilen bir Endonezya kukla devleti kurmak amacıyla Sukarno ve diğer milliyetçi liderlerle müzakere ederken görüldüğünü bildiriyor."
 INS_political_events.13.t:0 "[?event_target:INS_invasion_event_invader.GetAdjective] İşgali Yaklaşıyor"
 INS_political_events.14.a:0 "Yazık, değerli bir müttefik olurdu."
 INS_political_events.14.desc:0 "Kukla rejimi kuramadan Sukarno ve Endonezya'daki diğer birkaç üst düzey devrimci Hollanda askeri polisi tarafından tutuklandı."
 INS_political_events.14.t:0 "Milliyetçi Liderler Tutuklandı"
 INS_political_events.15.a:0 "Sadece ucuz kaynakları güvence altına almakla kalmadık, aynı zamanda değerli bir müttefik edindik."
 INS_political_events.15.desc:0 "Sukarno ile müzakereler sonuçlandı ve Endonezya'daki kukla rejim yolda. Sukarno, Hollanda hükümetini istikrarsızlaştırmak ve takımadalar üzerinde fiili kontrol kurmak için askeri varlığımızla birlikte bağlantılarını kullandı."
 INS_political_events.15.t:0 "Anavatan Savunucuları"
 INS_political_events.16.a:0 "Muharebeyi kazandılar ama savaşı kazanmadılar."
 INS_political_events.16.desc:0 "Hint Adaları'ndaki [?event_target:INS_invasion_event_invader.GetAdjective] kuvvetleri, sömürge yönetimimizi istikrarsızlaştırmak için Endonezyalı milliyetçilerle işbirliği yaptı ve Hint Adaları'nı tamamen işgal etti. Hollanda bayrakları indirildi ve yerine Endonezya bayrakları çekildi ve Hint Adaları'nın yerli vatandaşları [?event_target:INS_invasion_event_invader.GetAdjective] işgalcileri kucaklıyor gibi görünüyor. Sömürge imparatorluğumuz için işler iyi görünmüyor."
 INS_political_events.16.t:0 "Hint Adaları'nın [?event_target:INS_invasion_event_invader.GetAdjective] işgali"
 INS_political_events.17.a:0 "Ne yazık ki haklı olabilirler."
 INS_political_events.17.desc:0 "Haber Batavia'dan İmparatorluk Genel Karargahına ulaştı. İmparator adına adaları yönetmek için kendi elimizle yetiştirdiğimiz Sukarno ve kliği, art arda gelen toprak kayıplarımıza yanıt olarak, bu konuda hiçbir şey yapamayacak kadar zayıfladığımıza inanarak [FROM.GetAdjective] Cumhuriyeti'ni ilan etti."
 INS_political_events.17.t:0 "[INS.GetName] bağımsızlığını ilan ediyor"
 INS_political_events.18.a:0 "Ona iyi şanslar dileyeceğiz."
 INS_political_events.18.desc:0 "Geçtiğimiz yıllarda hükümetimize güvenilir bir danışman olarak hizmet eden Endonezyalı komünist Tan Malaka, derhal ayrılacağını duyurdu. [INS.GetNameDef] artık özgür bir cumhuriyet olarak dururken, en son yirmi yılı aşkın bir süre önce bir kaçak olarak ayak bastığı ülkesine nihayet dönmeyi amaçlıyor. Kendisine sunulan sığınma ve çalışmasına devam etme özgürlüğü için bize teşekkür ediyor ve sadece yerinin artık evinde olduğunu söylüyor."
 INS_political_events.18.t:0 "Tan Malaka Endonezya'ya Dönüyor"
 INS_political_events.19.a:0 "Filo için kasvetli bir gün"
 INS_political_events.19.desc:0 "[1058.GetName] eyaletine, deniz kuvvetlerimizin komutanı ve bu sulardaki en yetenekli subayımız olan Amiral Conrad Helfrich'in eve dönmesinin emredildiği haberi ulaştı. Lahey anakaradaki acil ihtiyaçları öne sürüyor ve çok az açıklama sunuyor. Ayrılışı, buradaki konumumuzun güvende olmaktan çok uzak olduğu bir anda takımadaları zayıf bir şekilde savunmasız bırakıyor ve Surabaya'daki subaylar salonunda keyifsiz bir ruh hali olduğu söyleniyor."
 INS_political_events.19.t:0 "[HOL.GetName] Amiral Helfrich'i Geri Çağırıyor"
 INS_political_events.2.a:0 "Peki, bir olaya neden olmaya değmez."
 INS_political_events.2.b:0 "Kesinlikle hayır!"
 INS_political_events.2.desc:0 "Eski Hint Adaları'ndaki yeni Cumhuriyetçi hükümet, tüm takımadaları kendi toprakları olarak ilan etti. [FROM.GetLeader], [721.GetName] bölgesinden vazgeçmemiz için bize resmi bir talep gönderdi ve reddedilmesi halinde askeri harekat tehdidinde bulundu."
 INS_political_events.2.t:0 "[FROM.GetName], [721.GetName] sahipliğini talep ediyor"
 INS_political_events.3.a:0 "Harika!"
 INS_political_events.3.desc:0 "Beklendiği gibi [FROM.GetLeader] taleplerimizi kabul etti ve birliklerini [721.GetName] bölgesinden çekmeye başladı. TKR güçleri, birkaç hükümet elçisiyle birlikte bölgeye girdi. [INS.GetLeader] bizzat Dili'de sömürge etkisinden kurtulduklarını ilan eden bir konuşma yaptı."
 INS_political_events.3.t:0 "[FROM.GetName], [721.GetName] bölgesinden vazgeçmeyi kabul ediyor"
 INS_political_events.4.a:0 "O zaman savaş olacak."
 INS_political_events.4.desc:0 "[FROM.GetName] ile müzakereler iyi gitmedi. [FROM.GetLeader] herhangi bir nedenle [721.GetName] bölgesinden vazgeçmeyi reddederek toplantıyı erken bitirdi."
 INS_political_events.4.t:0 "[FROM.GetName], [721.GetName] bölgesinden vazgeçmeyi reddediyor"
 INS_political_events.5.a:0 "Sutan Sjahrir ülkemizi bu noktaya getirdi, bizi daha da ileriye taşıyacak!"
 INS_political_events.5.b:0 "Amir Sjarifuddin, Sosyalistler ve Milliyetçiler arasında adil bir uzlaşmadır."
 INS_political_events.5.c:0 "Mohammad Hatta devrimi başlattı ve o tamamlayacak."
 INS_political_events.5.desc:0 "Bugün Endonezya için tarihi bir dönüm noktası. Devrimin resmen sona ermesiyle Başbakan [INS.GetLeader], Endonezya'nın ilk özgür ve demokratik seçimini yapacağını ilan etti. Bu seçimin sonucu Endonezya üzerinde kalıcı bir etkiye sahip olacak."
 INS_political_events.5.t:0 "Endonezya Genel Seçimleri"
 INS_political_events.6.a:0 "Hızlı hareket etmeye devam etmeliyiz."
 INS_political_events.6.desc:0 "Devrim devam ederken, Hint Adaları yönetimine sızan gerillalarımızın artık gizlilik içinde hareket etmesine gerek yok ve Hollanda'nın tepki verecek zamanı olmadan sabotaj görevlerini yerine getirmeye başlayacaklar."
 INS_political_events.6.t:0 "Hazırlıklarımız sonuç veriyor"
 INS_political_events.7.a:0 "Kaçınılmaz bir iç savaşı önlemek için müzakerelere başlamalıyız."
 INS_political_events.7.b:0 "Statüko devam etmeli."
 INS_political_events.7.c:0 "Belki de milliyetçiler haklıdır?"
 INS_political_events.7.desc:0 "Soetardjo tarafından düzenlenen ve Hollandalı ve Endonezyalı temsilciler arasında Endonezya'nın özerklik arzusunu tartışmak üzere bir yuvarlak masa toplantısı yapılmasını talep eden Volksraad dilekçesinin iç tartışması sona erdi ve dilekçe onay için Genel Vali'ye gitti. Birçok danışman statükonun korunması gerektiğinde ve bu nedenle dilekçenin veto edilmesi gerektiğinde ısrar etse de, milliyetçi hareketlerin giderek daha da güçlendiği ve daha radikalleştiği inkar edilemez. Her barışçıl özerklik talebini reddetmeye devam edersek, milliyetçiler bunun yerine daha şiddetli alternatifler denemeye başlayabilir."
 INS_political_events.7.t:0 "Soetardjo Dilekçesi"
 INS_political_events.8.a:0 "Milliyetçileri tutuklayacağız ve evimizi ölene kadar savunacağız!"
 INS_political_events.8.desc:0 "[?event_target:INS_invasion_event_invader.GetName] askerleri [?event_target:INS_invasion_event_invaded_state.GetName] bölgesine ulaştı ve bölgedeki sayıca çok az olan askerlerimize, [?event_target:INS_invasion_event_invaded_state.GetName] bölgesini tamamen askeri olarak tahliye etmeleri emredildi. [?event_target:INS_invasion_event_invader.GetAdjective] kuvvetleri Hint Adaları'nda ilerlemeye devam ediyor ve işgalden kaçınma şansımız kasvetli görünüyor."
 INS_political_events.8.t:0 "[?event_target:INS_invasion_event_invader.GetAdjective] İşgali Yaklaşıyor"
 INS_political_events.9.a:0 "Tankları gönderin!"
 INS_political_events.9.b:0 "Bu umutsuz bir durum, daha fazla savaşmak ihtiyacımız olan şey değil. Anavatanı yeniden inşa etmeye odaklanmalıyız."
 INS_political_events.9.desc:0 "[JAP.GetNameDef] kuvvetlerini Doğu Hint Adaları'ndan çekmeye başladığında, sömürge hükümetini yeniden kurmak için Batavia'ya asker gönderdik. Ancak askerlerimiz, işgalden bu yana Hint Adaları'ndaki siyasi manzaranın önemli ölçüde değiştiğini keşfettiler. Birliklerimiz daha Batavia'ya bile varmadan, [INS.GetLeader] halktan şaşırtıcı miktarda destek alarak Endonezya Cumhuriyeti'ni bağımsız bir ulus olarak ilan eden bir bağımsızlık bildirgesi imzalamıştı bile."
 INS_political_events.9.t:0 "Endonezyalılar Bağımsızlık İlan Etti"
 INS_revolution_events.1.a:0 "Hızlı hareket etmeliyiz."
 INS_revolution_events.1.desc:0 "Beklendiği gibi Hollanda hükümeti bağımsızlık talebimize [1058.GetName]'e asker göndererek ve medya aracılığıyla cumhuriyet karşıtı propaganda dağıtarak tepki gösterdi."
 INS_revolution_events.1.t:0 "[HOL.GetNameDefCap] Cumhuriyeti ezmek için harekete geçiyor"
 INS_revolution_events.11.a:0 "[HOL.GetNameDef] için bir başka zafer."
 INS_revolution_events.11.desc:0 "Cumhuriyetçi milislerden oluşan bir ekip, [?event_target:INS_temp_occupied_state.GetName] bölgesini işgal etmek için askeri bir operasyon başlattı. Hint Adaları'ndaki cesur askerlerimiz milis güçlerini geri püskürtmeyi başarıyla başardı ve bölge üzerinde tam kontrolü elimizde tutuyoruz."
 INS_revolution_events.11.t:0 "Hint Adaları Askeri Kuvvetleri Milis Harekatını başarıyla durdurdu"
 INS_revolution_events.12.a:0 "Bunun tırmanmasına izin veremeyiz."
 INS_revolution_events.12.desc:0 "Cumhuriyetçi milislerden oluşan bir ekip, [?event_target:INS_temp_occupied_state.GetName] bölgesini işgal etmek için askeri bir operasyon başlattı. Polisimiz ve askerlerimiz sonunda durumu kontrol altına almayı başardılar, ancak durum [?event_target:INS_temp_occupied_state.GetName] içinde huzursuzluğa yol açtı, birçok sivil milisleri destekledi ve açıkça [HOL.GetAdjective] hükümetine karşı konuştu."
 INS_revolution_events.12.t:0 "Milisler [?event_target:INS_temp_occupied_state.GetName] bölgesini işgal etmeye çalışıyor"
 INS_revolution_events.14.a:0 "Bu korkunç!"
 INS_revolution_events.14.desc:0 "Sömürge Polisimizin ve Askerlerimizin en iyi çabalarına rağmen, Cumhuriyetçi milisler [?event_target:INS_temp_occupied_state.GetName] bölgesini işgal etmek için başarıyla askeri bir operasyon başlattı. Polisimiz ve askerlerimiz tahliye etmek zorunda kaldı ve Milis direnişi nedeniyle bölgeyi yönetememe durumu ilan etti. Milislerin bizi itip kakmasına izin vermeye devam edersek, büyük Sömürgemizi sonsuza dek kaybetme riskiyle karşı karşıya kalırız."
 INS_revolution_events.14.t:0 "Milisler [?event_target:INS_temp_occupied_state.GetName] bölgesini işgal etti"
 INS_revolution_events.19.a:0 "Kabul etmeliyiz. Zaten çok fazla hayat kaybedildi."
 INS_revolution_events.19.b:0 "Barışı bu kadar çok istiyorsanız teslim olabilirsiniz!"
 INS_revolution_events.19.desc:0 "[HOL.GetLeader], potansiyel bir barış anlaşmasını görüşmek üzere [INS.GetLeader] ile bir toplantıya çağrıldı. [INS.GetLeader], çok fazla hayatın kaybedildiğini belirtti ve sınırların hafif ayarlamalarla şu anki gibi tutulacağı ve savaşın kalıcı olarak durdurulacağı iki devletli bir çözüm önerdi."
 INS_revolution_events.19.t:0 "Hint Adalarında Barış Görüşmeleri"
 INS_revolution_events.2.a:0 "Bunu Borneo için yapacağız."
 INS_revolution_events.2.b:0 "İlgilenmiyoruz."
 INS_revolution_events.2.desc:0 "[HOL.GetLeader], Hint Adaları'nın yeniden fethinde doğrudan çatışmaya katılmaya kadar varacak boyutta daha fazla yardım sağlamamızı talep etmek için liderlerimizle acil bir toplantı düzenledi. [HOL.GetLeader] durumun vahim olduğunu ve Hollanda güçlerinin devrimci milisleri geri püskürtemediğini belirtti. [HOL.GetLeader], onlara yardım edersek ödeme olarak bize Borneo'nun verileceğine söz veriyor."
 INS_revolution_events.2.t:0 "[HOL.GetNameDefCap] ek yardım talep ediyor"
 INS_revolution_events.20.a:0 "Kan dökülmesi nihayet sona erecek."
 INS_revolution_events.20.desc:0 "[INS.GetLeader], [HOL.GetLeader] ile yaptığı görüşmeden iyi haberlerle döndü. Her iki taraf da iki devletli bir çözüm üzerinde anlaştı ve birliklerimizi yeni sınırlara uygun olarak derhal hareket ettirmeye başlayacağız. Endonezyalı hemşehrilerimizi geride bırakmak zorunda kaldığımız için kimse mutlu olmasa da, savaşı bitirme kararı nihayetinde en iyisidir."
 INS_revolution_events.20.t:0 "[HOL.GetNameDefCap] iki devletli çözümü kabul etti!"
 INS_revolution_events.21.a:0 "Daha ne kadar can kaybedilmeli?"
 INS_revolution_events.21.desc:0 "[INS.GetLeader]'in [HOL.GetLeader] ile görüşmesi planlandığı gibi gitmedi, her iki taraf da gözle görülür şekilde sinirlendi ve uzlaşmayı reddetti, bu da toplantının kısa kesilmesine neden oldu."
 INS_revolution_events.21.t:0 "[HOL.GetNameDefCap] savaşmayı bırakmayı reddediyor"
 INS_revolution_events.22.a:0 "Yardım etmek masraflı olsa da, Sumatra buna değebilir."
 INS_revolution_events.22.b:0 "Bu bizden çok fazla şey istiyor."
 INS_revolution_events.22.desc:0 "[HOL.GetLeader], Hint Adaları'ndaki mevcut durumu görüşmek üzere Amsterdam'da [FRA.GetLeader] ile bir toplantı çağrısı yaptı. Toplantı sırasında [HOL.GetLeader], devrimcilerin milisleri Hollanda ordusunun yetişemeyeceği bir hızda nasıl silahlandırmaya başladığını ve [HOL.GetNameDef]'in sömürge hegemonyasını kaybetme riski altında olduğunu açıkladı. [HOL.GetLeader.GetHeShe], Hollanda tarafında çatışmaya resmi olarak katılmamızı ve Hint Adaları'nı yeniden fethetmeye yardımcı olmak için Batavia'ya tümenler göndermemizi talep etti. Karşılığında, düzen yeniden sağlandığında kuzeydoğu Sumatra'ya hak kazanacağız."
 INS_revolution_events.22.t:0 "[HOL.GetNameDefCap] yardımımızı talep ediyor"
 INS_revolution_events.23.a:0 "Oranlar artık bizim lehimize."
 INS_revolution_events.23.desc:0 "[FRA.GetNameDefCap] yardım çağrımızı kabul etti ve bize acilen yardım etmesi için Batavia'ya birçok Fransız tümeni gönderdi."
 INS_revolution_events.23.t:0 "[FRA.GetNameDefCap] bize yardım etmeyi kabul ediyor!"
 INS_revolution_events.24.a:0 "Bu hiç iyi görünmüyor."
 INS_revolution_events.24.desc:0 "[FRA.GetNameDefCap], aciliyete rağmen devrimde bize yardım etmeyi reddetti. Hızla yeniden silahlanmaya başlamalıyız, aksi takdirde yakında sayıca azınlıkta kalacağız."
 INS_revolution_events.24.t:0 "[FRA.GetNameDefCap] yardım etmeyi reddediyor."
 INS_revolution_events.25.a:0 "Harika!"
 INS_revolution_events.25.desc:0 "[HOL.GetAdjective] kuvvetleri büyük milis üslerini yok etti ve Cumhuriyetçi hükümeti devirdi. Cumhuriyetçi elitler ve komutanlar tutuklandı ve Hint Adaları hükümeti eski cumhuriyet topraklarında operasyonlarını yeniden kuruyor. Katkılarımız için söz verildiği gibi, üzerinde anlaşılan bölge bize verildi."
 INS_revolution_events.25.t:0 "Endonezya'daki savaşın sonu"
 INS_revolution_events.26.a:0 "İlginç bir gelişme."
 INS_revolution_events.26.desc:0 "[HOL.GetAdjective] kuvvetleri ve Cumhuriyetçi milisler her iki tarafın beklediğinden çok daha uzun süredir savaşıyor ve [HOL.GetLeader] iki devletli bir çözüm dayatan bir barış anlaşması imzalamayı kabul etti. Ancak anlaşmanın üzerimize düşen kısmını yerine getirdiğimiz için, [HOL.GetLeader] bize söz verilen bölgenin yine de verileceğini doğruladı."
 INS_revolution_events.26.t:0 "Endonezya'daki savaşın sonu"
 INS_revolution_events.27.a:0 "Bu delilik!"
 INS_revolution_events.27.desc:0 "[HOL.GetAdjective] kuvvetleri ve Cumhuriyetçi milisler her iki tarafın beklediğinden çok daha uzun süredir savaşıyor ve [HOL.GetNameDef]'in ve kendi askeri müdahalemizin çabalarına rağmen, milis kuvvetlerinin çokluğu ve ordularının gerilla doğası, çatışmanın büyük ölçüde Cumhuriyetçilerin lehine bir çıkmaza girmesine neden oldu. Bu nedenle, [HOL.GetLeader] bugün [HOL.GetLeader.GetHeShe]'nin Cumhuriyet ile Cumhuriyet lehine iki devletli bir çözüm dayatan bir barış anlaşması imzaladığını duyurdu. Hint Adaları'ndan geriye kalan şey eski ihtişamının bir gölgesidir. [HOL.GetLeader], çatışma bir kayıpla sonuçlandığı için, askeri katkılarımız için söz verilen bölgeyi bize veremeyeceğini belirtti."
 INS_revolution_events.27.t:0 "Endonezya'daki savaşın sonu"
 INS_revolution_events.28.a:0 "Ama bize toprak sözü verilmişti!"
 INS_revolution_events.28.desc:0 "[HOL.GetNameDef] tarafından yapılan ağır askeri harcamalara ve çatışmaya kendi doğrudan katkılarımıza rağmen, Hint Adaları'ndaki milislerin çokluğu kuvvetlerimizi alt etmeyi başardı ve tüm büyük şehirleri işgal ederek Hollanda yönetimini devirdi ve teslim olmaya zorladı."
 INS_revolution_events.28.t:0 "Hint Adaları'nın düşüşü"
 INS_revolution_events.29.a:0 "Bu bir trajedi."
 INS_revolution_events.29.desc:0 "En iyi çabalarımıza rağmen, Hint Adaları'ndaki devrimciler büyük şehirlerimizin kontrolünü ele geçirdi ve sömürge hükümetini içeriden yok etti. Generallerimiz ele geçirildi ve iletişim hatlarımız kesildi. Yenilgimizi kabul etmekten başka seçeneğimiz yok."
 INS_revolution_events.29.t:0 "Hint Adaları'nın düşüşü"
 INS_revolution_events.3.a:0 "Borneo gerekli bir fedakarlık olacak."
 INS_revolution_events.3.desc:0 "[ENG.GetNameDefCap], doğrudan çatışmaya katılmayı kabul etti ve Batavia'da savaşması için birkaç tümen gönderdi. Borneo'dan vazgeçmek zorunda kalacak olsak da, bu ihtimalleri büyük ölçüde bizim lehimize çeviriyor."
 INS_revolution_events.3.t:0 "[ENG.GetNameDefCap], Londra-Batavia Anlaşmasını kabul etti"
 INS_revolution_events.30.a:0 "Bunu kabul edeceğiz."
 INS_revolution_events.30.b:0 "Reddediyoruz, [FROM.GetName] eyaletini zorla geri alacağız!"
 INS_revolution_events.30.desc:0 "[INS.GetLeader] kabul etmemiz halinde birliklerini [FROM.GetName]'den çekeceğine ve birliklerimizin bölge üzerinde kontrolü yeniden kurmasına izin vereceğine söz vererek [FROM.GetName]'de yerel bir ateşkes önerdi. Ancak bu, devrimcilere planlama yapmaları için zaman tanıyarak büyük askeri operasyonlarımızı geçici olarak ertelememiz şartıyla."
 INS_revolution_events.30.t:0 "[INS.GetLeader] yerel ateşkes anlaşması öneriyor"
 INS_revolution_events.31.a:0 "Umarım anlaşmanın kendi taraflarına düşen kısmına uyarlar."
 INS_revolution_events.31.desc:0 "Ateşkes müzakereleri iyi gitti ve [HOL.GetLeader] şartlarımızı kabul etti. [FROM.GetName]'deki milis komutanlarına kuvvetlerini derhal geri çekmelerini emrettik."
 INS_revolution_events.31.t:0 "[HOL.GetNameDefCap] [FROM.GetName]'de ateşkesi kabul etti"
 INS_revolution_events.32.a:0 "Bu kabul edilemez!"
 INS_revolution_events.32.desc:0 "Ateşkes müzakereleri planlandığı gibi gitmedi ve [HOL.GetLeader] anlaşmayı imzalamayı reddederek bir uzlaşma bulunamadan müzakereleri yarıda kesti."
 INS_revolution_events.32.t:0 "[HOL.GetNameDefCap] ateşkesi reddediyor"
 INS_revolution_events.33.a:0 "Arabulucuları gönderin."
 INS_revolution_events.33.b:0 "Hollandalılarla ilişkimizi riske atamayız."
 INS_revolution_events.33.desc:0 "Endonezyalı cumhuriyetçiler Hollandalılarla bir anlaşmaya aracılık etmemiz için resmen yardımımızı talep ettiler. Bölgedeki danışmanlarımız durumun hızla kötüleştiğini ve Hollanda askeri operasyonlarının devam etmesinin milliyetçileri Sovyetlerin kollarına itme riski taşıdığını bildiriyor. Hollanda Avrupa'da değerli bir müttefiktir, ancak Güneydoğu Asya'daki siyasi gerçekleri görmezden gelemeyiz. Biz boş durduğumuz için Endonezya komünizme düşerse, bu bizim başarısızlığımız olur."
 INS_revolution_events.33.t:0 "[INS.GetNameDefCap] Arabuluculuk İstiyor"
 INS_revolution_events.34.a:0 "Umarım Hollandalılar mantıklı davranır."
 INS_revolution_events.34.desc:0 "Washington, hükümetimiz ile Hollandalılar arasında arabuluculuk yapmayı kabul etti. Amerikan elçileri yolda ve resmi bir ateşkes önerilecek. Bu muazzam bir fırsat. Müzakereleri destekleyen dünyanın en önde gelen gücü ile Hollandalılar oyalamayı veya güç kullanmayı çok daha zor bulacaktır. Masada sağlam durmalı ve Amerikalıların en iyi yaptıkları şeyi yapmalarına izin vermeliyiz."
 INS_revolution_events.34.t:0 "[FROM.GetNameDefCap] Arabuluculuk Yapmayı Kabul Etti"
 INS_revolution_events.35.a:0 "Bunu kendi şartlarımızla çözeceğiz."
 INS_revolution_events.35.desc:0 "Amerikalılar kendilerini Endonezya sorununa dahil ettiler. Washington tarafsız bir arabulucu olarak hareket ettiğini iddia ediyor, ancak sonuçları açık. Bu çatışmayı onları tatmin edecek şekilde çözemezsek, bize karşı önemli ölçüde güçlerini kullanacaklardır. Müzakerecilerimiz dikkatli adımlar atmalıdır. Amerikan iyi niyeti çarçur etmeyi göze alabileceğimiz bir şey değildir."
 INS_revolution_events.35.t:0 "[USA.GetNameDefCap] Arabuluculuğu Duyurdu"
 INS_revolution_events.36.a:0 "Bu savaşı onlarsız kazanacağız."
 INS_revolution_events.36.desc:0 "Amerikalılar arabuluculuk talebimizi reddettiler. Washington, kendi kaderimizi tayin hakkı mücadelemizi desteklemek yerine Avrupalı müttefiklerinin yanında durmayı seçti. Kendi başımızayız. Bu acı bir darbe, ancak devrim yabancı güçlerin bize özgürlüğümüzü vermesini beklediğimiz için başlamadı."
 INS_revolution_events.36.t:0 "[FROM.GetNameDefCap] Müdahale Etmeyi Reddetti"
 INS_revolution_events.37.a:0 "Uymaktan başka çaremiz yok."
 INS_revolution_events.37.b:0 "Endonezya bizimdir. Boyun eğmeyeceğiz."
 INS_revolution_events.37.desc:0 "Amerikalıların sabrı taştı. Washington, Endonezya'daki tüm askeri operasyonların derhal durdurulmasını ve Endonezya egemenliğinin tanınmasını talep eden bir ültimatom verdi. Tehdit zar zor gizlenmiş durumda. Uluslararası toplumdaki saygınlığımız Amerikalılarla halka açık bir ayrılıktan sağ çıkamayacaktır ve ekonomimiz sonuçlarını kaldıramaz. Generallerimiz seferin hala kazanılabileceğinde ısrar ediyor, ama ne pahasına?"
 INS_revolution_events.37.t:0 "[USA.GetNameDefCap] Ültimatom Verdi"
 INS_revolution_events.38.a:0 "Merdeka!"
 INS_revolution_events.38.desc:0 "Bitti. Hollanda hükümeti Amerikan ültimatomunu kabul etti ve egemenliğimizi tanıdı. Üç yüz elli yıllık sömürge yönetimi sadece savaş alanında değil, dünyanın en büyük gücünün davamızın arkasındaki ağırlığıyla müzakere masasında sona erdi. Cumhuriyet, sonunda tamamen ve bütünüyle bizimdir."
 INS_revolution_events.38.t:0 "Hollanda Taviz Verdi"
 INS_revolution_events.39.a:0 "Dünya yanımızda duruyor."
 INS_revolution_events.39.desc:0 "Tüm beklentilerin aksine Hollandalılar Amerikan ültimatomunu reddettiler. Generalleri, Washington harekete geçmeden önce bu savaşı kazanabileceklerine inanıyor olmalılar. Yanılıyorlar. Amerikalıların artık davamıza açıkça bağlı olmasıyla, güç dengesi kararlı bir şekilde değişti. Bırakın gelsinler. Artık yalnız savaşmıyoruz."
 INS_revolution_events.39.t:0 "Hollanda Reddetti"
 INS_revolution_events.4.a:0 "Bu hiç iyi görünmüyor."
 INS_revolution_events.4.desc:0 "[ENG.GetNameDefCap], sunulan aciliyet ve ödüle rağmen çatışmada daha fazla yardım etmeyi reddetti. [ENG.GetLeader], sömürge imparatorluğumuzu korumamız onların çıkarına olsa da, katılımlarının ardından küresel tırmanma riskinin çok yüksek olduğunu ve bunu kendimizin halletmesi gerekeceğini belirtti."
 INS_revolution_events.4.t:0 "[ENG.GetNameDefCap], Londra-Batavia Anlaşmasını reddetti"
 INS_revolution_events.40.a:0 "Mantıklı bir sonuç."
 INS_revolution_events.40.desc:0 "Lahey ültimatomumuzu kabul etti. Endonezya'daki Hollanda kuvvetleri geri çekilecek ve egemenlik Endonezya cumhuriyetine devredilecek. Talihsiz bir olayın tatmin edici bir sonucudur. Bölgedeki çıkarlarımız artık, Hollandalıların daha fazla sürdüremeyeceği bir sömürge girişimini desteklemektense, istikrarlı, bağımsız bir Endonezya tarafından çok daha iyi bir şekilde hizmet görmektedir."
 INS_revolution_events.40.t:0 "Hollanda Şartlarımızı Kabul Etti"
 INS_revolution_events.41.a:0 "Öyle olsun."
 INS_revolution_events.41.desc:0 "Lahey ültimatomumuzu doğrudan reddetti. Endonezya'daki Hollanda kuvvetleri Amerikan taleplerine açıkça meydan okuyarak operasyonlarına devam ediyor. Bu olağanüstü bir yanlış hesaplamadır. Hollanda Asya'da sömürgeci bir savaş yürütürken aynı zamanda Avrupa'da Amerikan yardımına güvenemez. Bizi buna mecbur bıraktılar."
 INS_revolution_events.41.t:0 "Hollanda Bize Meydan Okuyor"
 INS_revolution_events.42.a:0 "Böylece son savaş başlar."
 INS_revolution_events.42.desc:0 "Batavia'daki istihbarat servislerimizden gelen raporlar, Cumhuriyetçilerden daha önce hiç görmediğimiz bir düşman hazırlığını anlatıyor. Görünüşe göre Java'yı basmak ve tüm iletişim altyapımızı yok etmek için bir istikrarsızlaştırma operasyonu hazırlıyorlar ve bu da zaferlerini fiilen garanti altına alıyor. Ancak bu operasyon son derece riskli ve neredeyse tüm kaynaklarını buna yöneltmelerini gerektiriyor. Generallerimiz bu pozisyonu sadece yaklaşık iki yıl tutabileceklerini ve kolayca geri adım atamayacaklarını tahmin ediyor. Onları yeterince uzun süre geri tutarsak, hükümetlerini ve devrimlerini aşırı olgunlaşmış bir domates gibi ezebileceğiz."
 INS_revolution_events.42.t:0 "Son Bir Zar Atışı"
 INS_revolution_events.43.a:0 "Çabalarımıza devam etmeliyiz."
 INS_revolution_events.43.desc:0 "[FROM.GetName] bölgesindeki çabalarımız başarılı oldu ve yerel milis liderlerimiz zamanı geldiğinde harekete geçmeye hazır olduklarını doğruladılar."
 INS_revolution_events.43.t:0 "[FROM.GetName] bölgesinde Milis Üssü kuruldu"
 INS_revolution_events.5.a:0 "Devrimciler başarılı olursa, kolonilerimizdeki vatandaşlar da aynısını yapmaya ilham alabilir."
 INS_revolution_events.5.b:0 "İlgilenmiyoruz."
 INS_revolution_events.5.desc:0 "Hollanda Doğu Hint Adaları'ndaki devrimciler [HOL.GetNameDef]'den bağımsızlıklarını ilan ettiler ve büyük şehirleri işgal ettiler. [HOL.GetLeader] acilen bize ulaştı ve onlar bir işgale hazırlanırken onlara askeri olarak yardım etmemizi talep etti."
 INS_revolution_events.5.t:0 "[HOL.GetNameDefCap] yardımımızı istiyor"
 INS_revolution_events.6.a:0 "Bu kolay olacak."
 INS_revolution_events.6.desc:0 "[ENG.GetNameDefCap], Hint Adaları üzerinde kontrolü geri almamıza yardımcı olmak için [1058.GetName]'e gönüllü birlikler ve teçhizat göndermeyi kabul etti."
 INS_revolution_events.6.t:0 "[ENG.GetNameDefCap] bize yardım etmeyi kabul etti"
 INS_revolution_events.7.a:0 "Bu kabul edilemez!"
 INS_revolution_events.7.desc:0 "[ENG.GetNameDefCap], çatışmaya yakın olmalarına rağmen Hint Adaları'nın kendilerini ilgilendirmediğinde ısrar ederek, Hint Adaları üzerinde kontrolü yeniden kurmamıza yardım etmeyi reddetti. KNIL'i kendi başımıza yeniden silahlandırmak zorunda kalacağız."
 INS_revolution_events.7.t:0 "[ENG.GetNameDefCap] bize yardım etmeyi reddediyor"
 INS_revolution_events.8.a:0 "Yakından izlemeliyiz."
 INS_revolution_events.8.desc:0 "Doğu Hint Adaları'ndaki Sömürge Polisimiz, Endonezya'da yükselen devrimci bir hareketin birkaç üyesini tutukladı ve sorguladı. Görünüşe göre ulusal bir bağımsızlık kampanyası başlatmaya hazırlanmak için askeri bir varlık kurmaya çalışıyorlar. Henüz kesin olarak bilmiyoruz, ancak silahlı bir devrim planlıyor olabilirler."
 INS_revolution_events.8.t:0 "Hint Adalarında komplo kuran devrimci milisler"
 INS_revolution_events.9.a:0 "Kabul edilemez!"
 INS_revolution_events.9.b:0 "Bu enerji harcamaya değmez, eğer bağımsızlığı bu kadar çok istiyorlarsa, öyle olsun."
 INS_revolution_events.9.desc:0 "Bugün Java'da [INS.GetLeader] tarafından yeni kurulan Endonezya Cumhuriyeti'nin bağımsızlığını ilan eden bir konuşma yapıldı. Bu yeni cumhuriyeti tanımasak da, milisleri toprakları işgal etti ve polisimiz bu alanları yönetmekte başarısız oluyor. Bu durumu ciddiye almazsak topyekün savaşa dönüşebilir."
 INS_revolution_events.9.t:0 "Endonezya Bağımsızlık Bildirgesi"
 INS_revolution_no_effect_tt:0 "Etkisi Yok"
 INS_union_events.1.a:0 "Savaş [1058.GetName]'den devam edecek."
 INS_union_events.1.b:0 "Kendilerini kim sanıyorlar! Bu, sömürge hakimiyetini yeniden kurma girişiminden başka bir şey değil!"
 INS_union_events.1.desc:0 "Anavatanın kaybedilmesiyle birlikte [HOL.GetNameDef], hükümetlerinin ve kraliyet ailesinin [1058.GetName]'e taşınacağını bize bildirdi. Gereklilikten, süreklilikten ve bayrağın hala dalgalandığı yerlerde Krallığı canlı tutma ihtiyacından bahsediyorlar."
 INS_union_events.1.t:0 "[HOL.GetNameDefCap], Hükümeti [1058.GetName]'e Taşımayı Talep Ediyor"
 INS_union_events.10.a:0 "Her ne olursa olsun işe yaraması pek olası değildi."
 INS_union_events.10.desc:0 "[INS.GetNameDefCap] birlik teklifini reddetti. [INS.GetAdjective] halkı ve liderleri bunun uzun vadede işe yarayacağını düşünmüyor ve güçten vazgeçme yönündeki herhangi bir teklife karşı çıkıyor."
 INS_union_events.10.t:0 "[INS.GetNameDefCap] Birlik Teklifini Reddetti"
 INS_union_events.2.a:0 "Ortak düşmanlarımıza karşı birleşik bir cephe."
 INS_union_events.2.desc:0 "[INS.GetNameDefCap], sürgündeki hükümetimize [1058.GetName]'de ev sahipliği yapmayı kabul etti. Taşınma hazırlıkları sürüyor ve her iki yönetim de ofislerin ve personelin entegrasyonunu koordine ediyor. Birlikte Krallığın meşalesini Doğu'dan ileri taşıyacağız."
 INS_union_events.2.t:0 "[INS.GetNameDefCap] Taşınma Teklifini Kabul Etti"
 INS_union_events.3.a:0 "Görünüşe göre hala kimin bayrağının bizi birbirine bağladığını unuttular."
 INS_union_events.3.desc:0 "[INS.GetNameDefCap], [1058.GetName]'e taşınma talebimizi doğrudan reddetti. [INS.GetLeader], zaten yeterince zor durumdayken bu seviyede bir yardım talep etmeye hakkımız olmadığını belirtti."
 INS_union_events.3.t:0 "[INS.GetNameDefCap] Taşınma Teklifini Reddetti"
 INS_union_events.4.a:0 "Bayrağı dalgalandırmak için yeterli."
 INS_union_events.4.desc:0 "Anavatandan ilk nakliyeler geldi. Subaylar, askerler ve cephaneliklerimizin kalıntılarıyla dolu gemiler. Beklendiği gibi, bazı konvoylar limana ulaşamadı. Hayatta kalanlar, [1058.GetName]'deki kuvvetlerimizin belkemiğini oluşturacak."
 INS_union_events.4.t:0 "[HOL.GetNameDefCap], Silahlı Kuvvetlerini [1058.GetName]'e Taşıyor"
 INS_union_events.5.a:0 "Bu üstlenmemiz gereken bir risk. Çok yaşa Kraliçe!"
 INS_union_events.5.b:0 "Bunu kabul edemeyiz."
 INS_union_events.5.desc:0 "Savaşın bizim lehimize görünmediği dünya için açıktır. Ülkemiz düştü ve harekat üssümüz doğuya taşındı. [INS.GetName] içindeki bakanlar, mümkün olduğunca çok işbirliğini garanti etmek için Kraliçe Wilhelmina liderliğindeki ortak bir birlik devleti kurmamız için bize bir teklif gönderdiler. Tekliften kimse pek memnun görünmese de, hayatta kalmamızın anahtarı bu olabilir."
 INS_union_events.5.t:0 "[INS.GetNameDefCap], Hollanda–Endonezya Birliği'ni Öneriyor"
 INS_union_events.6.a:0 "Her iki ulus için de tarihi bir anlaşma."
 INS_union_events.6.desc:0 "Kabine içindeki acil tartışmaların ardından [HOL.GetLeader], [INS.GetAdjective] teklifini onayladı. Kararname kısa ve törensiz. Hükümetlerimiz bundan böyle savaşın sonuna kadar Taç altında tek bir olarak hareket edecektir."
 INS_union_events.6.t:0 "[HOL.GetNameDefCap] Birlik Teklifini Kabul Etti"
 INS_union_events.7.a:0 "Her ne olursa olsun işe yaraması pek olası değildi."
 INS_union_events.7.desc:0 "[HOL.GetNameDef] konseyi, ortak bir birlik teklifini reddetti. Mesajları sert, işbirliği devam edecek, ancak egemenlik paylaşılmayacak."
 INS_union_events.7.t:0 "[HOL.GetNameDefCap] Birlik Teklifini Reddetti"
 INS_union_events.8.a:0 "Yapılması gerek."
 INS_union_events.8.b:0 "Bu, sömürge hakimiyetini yeniden kurma girişiminden başka bir şey değil."
 INS_union_events.8.desc:0 "Savaşın bizim lehimize görünmediği dünya için açıktır. [HOL.GetNameDef] düştü ve harekat üsleri doğuya taşındı. [HOL.GetAdjective] liderleri, mümkün olduğunca çok işbirliğini garanti etmek için Kraliçe Wilhelmina liderliğindeki ortak bir birlik devleti kurmamız için bize bir teklif gönderdiler. Tekliften kimse pek memnun görünmese de, hayatta kalmamızın anahtarı bu olabilir."
 INS_union_events.8.t:0 "[HOL.GetNameDefCap], Hollanda–Endonezya Birliği'ni Öneriyor"
 INS_union_events.9.a:0 "Eğer dayanacaksak, birlikte dayanmalıyız."
 INS_union_events.9.desc:0 "[INS.GetNameDefCap] teklifimizi kabul etti. Bunun nasıl sonuçlanacağı belirsiz, ancak odağımızı savaş çabalarında tutmalıyız."
 INS_union_events.9.t:0 "[INS.GetNameDefCap] Birlik Teklifini Kabul Etti"
 INS_volksraad_events.10.a:0 "Volksraad amacına hizmet ediyor."
 INS_volksraad_events.10.b:0 "Kesinlikle hayır. Veto et!"
 INS_volksraad_events.10.desc:0 "[INS.GetLeader], [INS.GetNameDef] içinde Endonezce eğitim veren okulların ve üniversitelerin kurulmasını teşvik eden bir Volksraad dilekçesini onayladı ve nihai onay için [HOL.GetLeader] adlı lidere gönderildi."
 INS_volksraad_events.10.t:0 "Volksraad'da Okullarda Endonezceye İzin Verilmesine İlişkin Önerge"
 INS_volksraad_events.100.desc:0 "[INS.GetLeader], [INS.GetNameDef] içindeki Hollandalı olmayan sakinlerin eğitim sübvansiyonlarına başvurmasına izin veren bir Volksraad dilekçesini onayladı. Dilekçe nihai onay için [HOL.GetLeader] adlı lidere gönderildi."
 INS_volksraad_events.100.t:0 "Volksraad'da Hollandalı olmayan sakinler için eğitim sübvansiyonlarına izin verilmesine ilişkin önerge"
 INS_volksraad_events.101.desc:0 "Dilekçe [HOL.GetLeader] tarafından imzalandı ve artık resmen zorunlu kılındı. Dilekçenin uygulanması, nihai ayrıntılar karara bağlandıktan kısa bir süre sonra başlayacaktır."
 INS_volksraad_events.101.t:0 "[INS.GetAdjective] vatandaşları artık Eğitim Sübvansiyonlarına başvurabiliyor"
 INS_volksraad_events.11.a:0 "Volksraad amacına hizmet ediyor."
 INS_volksraad_events.11.desc:0 "Dilekçe [HOL.GetLeader] tarafından imzalandı ve artık resmen zorunlu kılındı. Dilekçenin uygulanması, nihai ayrıntılar karara bağlandıktan kısa bir süre sonra başlayacaktır."
 INS_volksraad_events.11.t:0 "Endonezce eğitim verilecek."
 INS_volksraad_events.2.a:0 "Belki gelecekte onaylanmış bir dilekçeyle tekrar deneyebiliriz."
 INS_volksraad_events.2.desc:0 "Dilekçe [INS.GetLeader] tarafından onaylanmış olsa da, [HOL.GetLeader] tarafından incelendikten sonra veto edildi ve bu nedenle şu anda uygulamaya devam edemeyeceğiz."
 INS_volksraad_events.2.t:0 "[HOL.GetLeader] Volksraad dilekçesini veto etti."
 INS_volksraad_events.20.desc:0 "Doğu Hint Adaları'ndaki hükümet görevleri, Volksraad dahil olmak üzere hepsi Hollandaca akıcılık gerektirir, bu da Volksraad'ın birçok üyesinin, özellikle yerli toplulukların temsilcilerinin demokrasisinin geçerliliğini sorgulamasına yol açmıştır. Mümkün olduğunda hükümet pozisyonlarının Endonezce konuşanlar tarafından doldurulabilmesinde ısrar eden bir önerge hazırladılar."
 INS_volksraad_events.20.t:0 "Volksraad'da Hükümette Endonezceye İzin Verilmesine İlişkin Önerge"
 INS_volksraad_events.21.desc:0 "Dilekçe [HOL.GetLeader] tarafından imzalandı ve artık resmen zorunlu kılındı. Dilekçenin uygulanması, nihai ayrıntılar karara bağlandıktan kısa bir süre sonra başlayacaktır."
 INS_volksraad_events.21.t:0 "Artık Hükümette Endonezceye İzin Veriliyor!"
 INS_volksraad_events.30.desc:0 "[INS.GetLeader], Volksraad içinde uygulaması ve adaleti konusundaki uzun süreli tartışmaları sona erdirmek amacıyla [INS.GetNameDef] içindeki eğitim-kota sistemini kaldıran bir Volksraad dilekçesini onayladı. Nihai onay için [HOL.GetLeader] adlı lidere gönderildi."
 INS_volksraad_events.30.t:0 "Volksraad'da Eğitim-Kota Sisteminin Kaldırılmasına İlişkin Önerge"
 INS_volksraad_events.31.desc:0 "Dilekçe [HOL.GetLeader] tarafından imzalandı ve artık resmen zorunlu kılındı. Dilekçenin uygulanması, nihai ayrıntılar karara bağlandıktan kısa bir süre sonra başlayacaktır."
 INS_volksraad_events.31.t:0 "Eğitim-Kota Sistemi kaldırıldı."
 INS_volksraad_events.40.a:0 "[INS.GetLeader] haklı."
 INS_volksraad_events.40.b:0 "Vergiler kalacak."
 INS_volksraad_events.40.desc:0 "[INS.GetLeader], özel kauçuk plantasyonlarına uygulanan yüksek vergileri azaltan bir Volksraad dilekçesini imzaladı ve onayladı. Bu vergiler tarihsel olarak kauçuk üzerinde çok kazançlı bir hükümet tekeline izin vermişti, ancak uluslararası korumacılık bunu çok daha az kazançlı bir sistem haline getirdi. [INS.GetLeader], vergilerin neden oldukları ekonomik sonuçları telafi ettiğine artık inanmadığını belirtti."
 INS_volksraad_events.40.t:0 "Volksraad'da Kauçuk ihracatı vergisinin azaltılmasına ilişkin önerge"
 INS_volksraad_events.41.desc:0 "Dilekçe [HOL.GetLeader] tarafından imzalandı ve artık resmen zorunlu kılındı. Dilekçenin uygulanması, nihai ayrıntılar karara bağlandıktan kısa bir süre sonra başlayacaktır."
 INS_volksraad_events.41.t:0 "Kauçuk İhracatındaki özel vergi azaltıldı."
 INS_volksraad_events.60.desc:0 "[INS.GetLeader], Hollandalı olmayan KNIL subaylarının tutabileceği rütbeyi sınırlayan yazılı olmayan kuralı kaldıran ve başarılarına göre hak ettikleri rütbeden daha düşük rütbede olduğu düşünülen Endonezyalı subayları terfi ettiren bir Volksraad dilekçesini onayladı. Dilekçe nihai onay için [HOL.GetLeader] adlı lidere gönderildi."
 INS_volksraad_events.60.t:0 "Volksraad'da Endonezyalı subaylara yönelik yazılı olmayan rütbe sınırının kaldırılmasına ilişkin önerge"
 INS_volksraad_events.61.desc:0 "Dilekçe [HOL.GetLeader] tarafından imzalandı ve artık resmen zorunlu kılındı. Dilekçenin uygulanması, nihai ayrıntılar karara bağlandıktan kısa bir süre sonra başlayacaktır."
 INS_volksraad_events.61.t:0 "[INS.GetAdjective] Generalleri üzerindeki görünmez rütbe tavanı kaldırıldı."
 INS_volksraad_events.70.desc:0 "[INS.GetLeader], büyük ölçüde birçok genç milliyetçinin radikalleşmesini azaltmak amacıyla [INS.GetNameDef] içindeki halka açık alanlarda milliyetçi bayrakların ve görüntülerin sergilenmesi kısıtlamalarını kaldıran bir Volksraad dilekçesini onayladı. [INS.GetLeader], meseleye savunmacı bir yaklaşım sergilememiz, devrimci hareketleri kökünden kazırken barışçıl milliyetçi liderlerle işbirliği yapmamız gerektiğinde ısrar ediyor, ancak karar sonuçta bize ait."
 INS_volksraad_events.70.t:0 "Volksraad'da milliyetçi bayrakların ve görüntülerin halka açık olarak sergilenmesinin yasallaştırılmasına ilişkin önerge"
 INS_volksraad_events.71.desc:0 "Dilekçe [HOL.GetLeader] tarafından imzalandı ve artık resmen zorunlu kılındı. Dilekçenin uygulanması, nihai ayrıntılar karara bağlandıktan kısa bir süre sonra başlayacaktır."
 INS_volksraad_events.71.t:0 "Kırmızı/Beyaz Bayrağın sergilenmesi artık yasadışı değil!"
 SIA_japan_aid_request.4.a:0 "O zaman tek başımıza duruyoruz."
 SIA_japan_aid_request.4.desc:0 "[JAP.GetNameDef] hükümeti askeri yardım talebimizi reddetti. Tokyo, İmparatorluğun şu anda mücadelemize adam ve teçhizat ayıramayacağını iddia ediyor.\n\nDış yardım olmadan, [ROOT.GetNameDef] şimdi işgalden kurtulmak için kendi gücüne güvenmelidir."
 SIA_japan_aid_request.4.t:0 "[JAP.GetName] Çağrımızı Reddediyor"
 SIA_purchased_submarines_from_us:0 "Bizden denizaltı satın aldı"
 SIA_sent_bureaucrats_to_us:0 "Bizimle birlikte memurları eğitiyor"
 SIA_sent_started_cooperative_with_us:0 "Bizimle gelişim kooperatifi kurdular"
 SIA_tied_their_currency_to_ours:0 "Para birimlerini bizimkine sabitlediler"
 siam.1.a:0 "Belki bu durum başka biri için yolu temizler?"
 siam.1.desc:0 "[SIA_phraya_phahon.GetName], kraliyete ait gayrimenkulleri piyasa fiyatının altında yetkililere satmakla suçlanıyor ve bu skandal Halk Meclisindeki meşruiyetini önemli ölçüde azalttı. Görünüşe göre [SIA_phraya_phahon.GetName]'in nüfuzu sona eriyor."
 siam.1.t:0 "[SIA_phraya_phahon.GetName] Skandala Karıştı"
 siam.10.a:0 "[ROOT.GetName] İçin!"
 siam.10.b:0 "Aslında bu oldukça iyi gidiyor"
 siam.10.desc:0 "Düşman bozguna uğruyor ve zaferimiz kesinleşmiş görünüyor. Bölge sağlam bir şekilde kontrol altına alındığında eski emperyalist güçler korkudan titriyor olmalı. Nasıl kaybedebilirlerdi ki? Bu bizim ilahi takdirimizin bir işaretidir."
 siam.10.t:0 "Zafer!"
 siam.11.a:0 "Zararın neresinden dönülürse kârdır deyip geri çekilmeliyiz."
 siam.11.b:0 "Talebimizden vazgeçmeyeceğiz!"
 siam.11.desc:0 "Beklentilerin aksine, [FROM.GetAdjective] ordusu kuvvetlerimizi alt etti ve tartışmalı bölgenin kontrolünü ele geçirdi. İşgalleri otoritemizi zayıflattı ve bölge üzerindeki talebimize şüphe düşürdü. Çatışmaya devam etmek disiplin ve güvenin daha da aşınması riskini taşır, ancak bölgeyi teslim etmek de başarısızlığın halka açık bir kabulü olacaktır."
 siam.11.t:0 "[FROM.GetAdjective] Stratejik Yarma Harekâtı"
 siam.12.a:0 "Gücümüz inkar edilemez."
 siam.12.desc:0 "Seferimiz başarılı oldu. Düşman direnişi çöktü ve [FROM.GetName] daha fazla yıkımı önlemek için ihtilaflı toprakların kontrolünü resmen bıraktı. Bu zafer konumumuzu yükseltiyor ve şimdilik sınırlarımızı güvence altına alıyor."
 siam.12.t:0 "[FROM.GetName] Yenilgiyi Kabul Ediyor"
 siam.13.a:0 "Öyle olsun."
 siam.13.desc:0 "[FROM.GetName], toprak tavizlerini içeren tüm önerileri kabul edilemez bularak reddetti. Liderleri, yalnızca devletimizin yok edilmesinin bu çatışmayı sona erdireceğini ilan etti."
 siam.13.t:0 "[FROM.GetName] Herhangi Bir Anlaşmayı Reddediyor"
 siam.14.a:0 "Uzlaşma yok, teslimiyet yok."
 siam.14.desc:0 "[FROM.GetNameDefCap] herhangi bir müzakere bahanesinden vazgeçti. Niyetleri belli: Ulusumuzun tamamen fethedilmesi ve yutulması. Bu savaşın sonucunu antlaşmalar değil, topyekûn zafer veya topyekûn çöküş belirleyecek."
 siam.14.t:0 "[FROM.GetNameDefCap] Topyekün Savaşa Karar Verdi"
 siam.15.a:0 "Taviz Teklif Et."
 siam.15.b:0 "Sadece topyekûn zafer kabul edilebilir."
 siam.15.desc:0 "[SIA.GetAdjective] kuvvetlerinin hızlı saldırısı bizi gafil avlamış olabilir, ancak artan baskı altında ilerlemeleri yavaşladıkça zayıflıkları açıkça görülüyor. Yıldırım harekatı olması gereken şey, [SIA.GetAdjective] ordusu için eziyetli bir sınava dönüştü. Yücegönüllü olmayı seçebilir ve tavizler vererek onlara bir çıkış yolu sunabiliriz, ancak merhametin çıkarlarımıza topyekûn bir zaferden daha iyi hizmet edip etmediği kararı bize aittir."
 siam.15.t:0 "[SIA.GetAdjective] Saldırısı Duraklıyor"
 siam.16.a:0 "Barış o zaman"
 siam.16.b:0 "Asla teslim olmayacağız!"
 siam.16.desc:0 "Taarruzumuz durakladı, sorun bu değil, sorun düşmanımızın bunu bilmesi. Bize bir ültimatom gönderdiler; ya şimdi asgari kayıpla teslim olun ya da daha fazla kan dökülerek savaşa devam edin. Tek fark kaç tane ölü gömüleceği."
 siam.16.t:0 "Duraklayan Taarruz"
 siam.17.a:0 "İstedikleri olacak."
 siam.17.desc:0 "[FROM.GetName], bütün bir ülkenin alevler içinde kaldığını görmeyi, bize bir nebze olsun toprak bırakmaya tercih edeceğini kesin bir dille ifade etti. Savaş devam ediyor."
 siam.17.t:0 "[FROM.GetName] boyun eğmeyi reddediyor"
 siam.18.a:0 "[ROOT.GetNameDefCap] Ayakta Kalıyor!"
 siam.18.desc:0 "Düşman yüksek komutasından gelen yakalanmış iletişimler en büyük korkularımızı doğruladı, müzakere edilmiş bir çözüm olmayacak, bu savaşı ölçülü bir şekilde sona erdirecek hiçbir taviz verilmeyecek. Ulusumuzun tamamen teslim olmasından başka bir şey talep etmiyorlar ve bizi bir başka emperyalist çizmenin altında yaşamaya mahkum ediyorlar. Eğer amaçları buysa tek bir cevabımız var, boyun eğmeyi reddediyoruz."
 siam.18.t:0 "[FROM.GetName] bizi teslim olmaya zorluyor!"
 siam.19.a:0 "Uğruna savaşmaya değmez"
 siam.19.b:0 "Deli bunlar!"
 siam.19.desc:0 "[SIA.GetName], artan milliyetçilikten ve bölgedeki gücümüzün eksikliği algısından cesaret alarak, devletleri için çekirdek gördükleri toprakların iadesini talep etti. Açıkça boylarından büyük işlere kalkışmaya çalışıyorlar, ancak iddia ettikleri topraklar, dünya durumu Armageddon'a doğru sürüklenirken uğruna savaşmaya mutlaka değmez."
 siam.19.t:0 "[SIA.GetName] Topraklarının İadesini Talep Ediyor"
 siam.2.a:0 "Bunu kim yapmış olabilir?"
 siam.2.desc:0 "Reuters'in Bangkok muhabirinden gelen bir mesaj, Siam Başbakanını (Bay Phibul Songgram) zehirlemek için dört yıl içinde yapılan üçüncü girişimi ortaya koyuyor\nGeçen hafta, yiyeceğe zehir karıştırıldığı ve Bay Songgram ile eşini ve kızını geçici olarak etkilediği belirtiliyor.\nİngiltere Dışişleri Bakanı (Lord Halifax), Bay Songgram'a gönderdiği bir mesajda, Başbakan'ın hayatına yönelik korkakça girişimden duyduğu endişeyi ve onun kurtulmasından duyduğu memnuniyeti dile getiriyor."
 siam.2.t:0 "[SIA_plaek_phibunsongkhram.GetName]'in hayatına kasteden üçüncü girişim"
 siam.20.a:0 "Harika Bir Gün!"
 siam.20.desc:0 "[FROM.GetName] topraklarımızı geri vermeye karar verdi, bu topraklar üzerindeki egemenliğimizi tanıyıp tanımadıkları veya sadece diğer aktörlerin baskısıyla karşılaşıp karşılaşmadıkları önemsizdir, davamız hala adildir."
 siam.20.t:0 "[FROM.GetName] Toprakları Devrediyor"
 siam.21.a:0 "Onları haberdar edeceğiz."
 siam.21.desc:0 "[FROM.GetName] talebimizi reddetti. Bu emperyalistler, bu sözde \"büyük milletler\" için zamanın kumlarının tükendiğini kendilerine itiraf edemeyerek geçen yüzyıla pençe ve zincirle tutunuyorlar."
 siam.21.t:0 "[FROM.GetName] Toprakları Devretmeyi Reddediyor"
 siam.22.a:0 "Onları [ENG.GetName]'e gönderin"
 siam.22.b:0 "Onları [JAP.GetName]'e gönderin"
 siam.22.desc:0 "Bürokratlarımız, büyümeyi teşvik etmek için gereken gerekli eğitimden yoksun oldukları için modern bir ekonomi için uygun değiller. Neyse ki, kuralcı yönetimlerini ithal etmeden deneyim kazanmaları için onları gönderebileceğimiz modern, yerleşik bir bürokrasiye sahip pek çok ülke var."
 siam.22.t:0 "[SIA.GetName] Bürokratlarını Yurtdışına Gönder"
 siam.23.a:0 "Pound-Sterling'e bağlayın"
 siam.23.b:0 "Yen'e bağlayın"
 siam.23.desc:0 "[ROOT.GetName] ticaret ve finansta düzen ararken Baht başıboş kalamaz. Yetkililerimiz artık parasal istikrarın sıkı bir dış çıpa, tüccarlara, alacaklılara ve yabancı ortaklara aynı şekilde güven verecek ağırlığa sahip bir para birimine bağlı olmasını gerektirdiğini savunuyorlar. Önümüzdeki seçim sadece teknik bir seçim değil. Ticaretimizin yönünü, gelişimimizin karakterini ve [SIA.GetAdjective] ekonomisi üzerinde duracak yabancı nüfuzu şekillendirecektir."
 siam.23.t:0 "Baht İstikrar Yasası"
 siam.24.a:0 "[ENG.GetName]'den yatırım arayın"
 siam.24.b:0 "[JAP.GetName]'den yatırım arayın"
 siam.24.desc:0 "[SIA.GetAdjective] Gelişim Kooperatifi, devlete ulusal gelişim için yeni bir araç sağladı, ancak hırs hala yurt içi sermayeyi geride bırakıyor. Demiryolları, atölyeler ve elektrik işleri, herhangi bir hızda yükseleceklerse dış finansman gerektirir. Şimdi önümüzde iki yol duruyor. [ENG.GetAdjective] yatırımı yerleşik pazarlara, deneyimli firmalara ve Londra'nın mali prestijine erişim sunuyor. [JAP.GetAdjective] yatırımı, nüfuzunu genişletmeye hevesli yükselen bir Asya gücüyle daha yakın endüstriyel ortaklık vaat ediyor. Her iki rota da gelişimi hızlandırabilir, ancak hiçbiri yükümlülükler olmadan gelmeyecektir."
 siam.24.t:0 "[SIA.GetAdjective] Gelişim Kooperatifi"
 siam.25.a:0 "Majesteleri cennete yükselsin."
 siam.25.desc:0 "Kral Prajadhipok öldü. Adı eski düzenin anısını yıllarca süren sürgün ve kargaşa boyunca taşıyan eski Kral, şimdi insanların işlerinden tarihe karışıyor. Bazıları için onun ölümü, mutlak yönetimin sona ermesiyle başlayan mücadelenin son bölümünü kapatıyor. Yine de, temsil etmeye başladığı dava onunla birlikte yok olmuyor. Taht varlığını sürdürüyor, hanedan kalıyor ve [ROOT.GetName] için itibar ve istikrarı sağlama işi şimdi genç Kral Ananda adına devam etmelidir."
 siam.25.t:0 "Prajadhipok'un Ölümü"
 siam.27.a:0 "Onu bilimsel uğraşlara yönlendirin."
 siam.27.b:0 "Ona askeri konularda eğitim verin."
 siam.27.c:0 "Onu yönetim ve tedarike yönlendirin."
 siam.27.d:0 "Ona endüstri ve gelişim konusunda eğitim verin."
 siam.27.desc:0 "Kral Ananda, bir gün yönetecek krallığından uzakta [SWI.GetName]'de kalıyor. Ancak mesafe, onu etkimizin ötesine yerleştirmez. Zihninin [ROOT.GetNameDef] için amaçladığımız geleceğe doğru şekillenmesi için öğretmenler seçilebilir, konular vurgulanabilir ve alışkanlıklar teşvik edilebilir. Bir asker, bir bilgin ya da daha fazlası olarak dönüp dönmeyeceği, büyük ölçüde ona şimdi ne çalıştırıldığına bağlıdır.\n\nBir Kral, ülkenin bir uzantısı değilse nedir ki?"
 siam.27.t:0 "Bir Kral Dökmek"
 siam.28.a:0 "Çok yaşa Kral."
 siam.28.desc:0 "Uzun naiplik yılları artık belirlenmiş sonuna yaklaşıyor. Bangkok'ta prenslerin, keşişlerin, bakanların ve devlet memurlarının huzurunda Ananda, kendi hakkıyla tahta çıkıyor ve bir Chakri kralına yaraşır onurları alıyor. Törenler, kargaşanın olduğu yerde sürekliliği ve çatışmanın olduğu yerde kutsal düzeni ilan ediyor. Krallık için bu taç giyme töreni sadece bir gösteri değil, aynı zamanda Tacın dayandığının, diyarın sürgün ve iç çatışmalarla parçalanmadığının ve şimdi [ROOT.GetNameDef] üzerinde yeni bir saltanatın başladığının bir ilanıdır."
 siam.28.t:0 "Kral Ananda'nın Taç Giyme Töreni"
 siam.29.a:0 "Almanlardan öğreneceğiz"
 siam.29.b:0 "Amerikalılardan öğreneceğiz"
 siam.29.c:0 "İngilizlerden öğreneceğiz"
 siam.29.desc:0 "Konvansiyonel tanklar hala savaş alanının kralları, bu yüzden güçlü bir tank birliği oluşturmak için en iyilerden öğrenmeliyiz."
 siam.29.t:0 "Konvansiyonel Tank Çalışmaları"
 siam.3.a:0 "Üzücü bir son."
 siam.3.desc:0 "Phraya Songsuradet, [SIA_plaek_phibunsongkhram.GetName]'e yönelik bir veya daha fazla suikast girişiminin yanı sıra hükümetine karşı darbe planlamanın arkasındaki beyin olmakla suçlanıyor. Phraya Songsuradet'in komutasının elinden alınması, rütbe ve unvanlarının elinden alınması, emekli maaşı olmaksızın ordudan emekliye sevk edilmesi ve ülkeden sınır dışı edilmesi hükümetin iradesidir.\nEleştirmenler bunun [SIA_plaek_phibunsongkhram.GetName] tarafından ana rakibini ortadan kaldırmak için kışkırtılan ve ince örtülü bir tasfiye olduğunu iddia ediyor, ancak bu açıkça bir iftira."
 siam.3.t:0 "Phraya Songsuradet Sürgün Edildi"
 siam.31.a:0 "[ENG.GetAdjective] denizaltıları bize iyi hizmet edecek."
 siam.31.b:0 "Denizaltı kolumuzu [JAP.GetAdjective] tasarımları etrafında inşa edeceğiz."
 siam.31.desc:0 "Donanmanın genişlemesi bir denizaltı kolu gerektiriyor ve gemilerimizi nereden temin edeceğimize karar vermeliyiz. Hem [ENG.GetNameDef] hem de [JAP.GetNameDef] tekliflerde bulundu — ancak seçim tersanenin ötesinde sonuçlar taşıyor."
 siam.31.t:0 "Denizaltı Tedariki"
 siam.32.a:0 "Kıyı savunmamız için [ENG.GetAdjective] gemilerine güveneceğiz."
 siam.32.b:0 "Kıyı filomuz için [JAP.GetAdjective] gemilerine güveneceğiz."
 siam.32.desc:0 "Kıyı sularımız yetenekli savunma gemileri gerektiriyor ve tedarikçimizi seçmeliyiz. [ENG.GetNameDefCap] ve [JAP.GetNameDef] ikisi de teslim etmeye hazır — karar hem filomuzu hem de dış ilişkilerimizi şekillendirecek."
 siam.32.t:0 "Kıyı Savunma Gemilerinin Tedariki"
 siam.33.a:0 "Halkımızın üzerindeki vergi yükünü azaltın."
 siam.33.b:0 "Fonları donanma araştırmalarına yönlendirin."
 siam.33.c:0 "Bu beklenmedik geliri ulusa güvence vermek için kullanın."
 siam.33.desc:0 "Bangkok Dock Company'nin satışı tamamlandı ve gelirler şu anda hazinede duruyor. Hükümet bu fonların en iyi nereye yönlendirileceğine karar vermeli; ister sıradan vatandaşların mali yükünü hafifletmek için, ister ulusun teknik hırslarını hızlandırmak için, isterse ülkenin geleceğine olan güveni güçlendirmek için."
 siam.33.t:0 "Bangkok Dock Co. Şirketinin Satışı"
 siam.34.a:0 "İttifaklarına katılacağız ve yönetimimizi koruyacağız."
 siam.34.b:0 "Kıyılarımızdan defolmalarını söyleyin."
 siam.34.desc:0 "[FROM.GetAdjective] kuvvetleri şimdi [ROOT.GetNameDef]'e karşı baskı yapıyor ve diplomatları meseleyi çoktan çözmüş olduklarına inanan adamların özgüveniyle konuşuyor. Bize düzen ve istikrarla ilgili her zamanki dili sunuyorlar, ancak asıl aradıkları şey itaat. Teslim olup devleti küçülmüş haliyle koruyabilir, bazı hareket özgürlüklerini elimizde tutma umuduyla kendimizi onların ittifakına bağlamak yolunu seçebilir veya bu baskıya açık bir meydan okumayla cevap verip işgalcinin kıyılarımızdan gitmesini emredebiliriz."
 siam.34.t:0 "Kıyılarımızdaki [FROM.GetAdjective] Talepleri"
 siam.35.a:0 "[JAP.GetNameDef]'in taleplerine uyun."
 siam.35.desc:0 "[JAP.GetNameDefCap] beklentilerini açıkça ortaya koydu: ekonomik taleplerini karşılamak için para arzını artıracağız. [JAP.GetAdjective] endüstrisi fayda sağlarken, yük artan fiyatlar yoluyla kendi halkımızın üzerine düşecek. Reddetme şansımız çok az."
 siam.35.t:0 "[JAP.GetNameDefCap] Daha Fazla Para Basmamızı Talep Ediyor"
 siam.36.a:0 "Borcu onurlandırın ve geri ödemelere başlayın."
 siam.36.desc:0 "[SIA.GetNameDefCap], onları üstlenmeye zorladığımız para basma düzenlemesinin neden olduğu maliyetleri geri ödememizi resmen talep etti. Düzenleme bize iyi hizmet etti, ancak fatura şimdi geldi."
 siam.36.t:0 "[SIA.GetNameDefCap] Borç Ödemesi Talep Ediyor"
 siam.37.a:0 "Adil bir çözüm. Ekonomimiz toparlanacak."
 siam.37.desc:0 "Taleplerimiz üzerine [JAP.GetNameDef], para basma düzenlemesinin ekonomik maliyetlerini geri ödemeye başlamayı kabul etti. Tazminat halkımızın üzerindeki yükü tamamen ortadan kaldırmayacak, ancak hazineye biraz rahatlama getirecek."
 siam.37.t:0 "[JAP.GetNameDefCap] Borçlarımızı Geri Ödemeyi Kabul Ediyor"
 siam.38.a:0 "Teslimiyetlerini kabul et."
 siam.38.b:0 "Hayır. Bunu güç kullanarak bitireceğiz."
 siam.38.desc:0 "[SIA.GetAdjective] hükümeti şartlar için bir taleple karşımıza geldi. Bakanları artık silahlarımızın gösterdiği gerçeği, [ROOT.GetNameDef]'in bu mücadelede inisiyatifi elinde tuttuğunu kabul ediyor. Teslimiyetlerini kabul edip onları itaate zorlayabilir, hükümetlerinin daha geniş amacımıza hizmet etmesi için onları ittifakımıza bağlamak seçeneğini değerlendirebilir veya tüm tavizleri reddedip Siam tamamen işgal edilene kadar sefere devam edebiliriz."
 siam.38.t:0 "[SIA.GetName] Şartlar Arıyor"
 siam.39.a:0 "Mecbur olduğumuza katlanıyoruz."
 siam.39.desc:0 "[FROM.GetLeader] teslimiyetimizi kabul etmeyi seçti. Şimdilik [ROOT.GetNameDef] daha fazla yıkımdan kurtuldu, ancak aşağılanmadan değil. Orduya beklemede kalması emredildi ve hükümet yalnızca daha güçlü bir gücün hoşgörüsüyle yerinde kalıyor. Devleti koruyoruz, ancak gurur ve hareket özgürlüğü pahasına."
 siam.39.t:0 "[FROM.GetAdjective] Hükümeti Teslimiyetimizi Kabul Ediyor"
 siam.4.a:0 "Komplo derinleşiyor."
 siam.4.desc:0 "Sabahın erken saatlerinde, Kraliyet Tayland Polisinin yardımıyla hükümet, Prens Rangsit, Phraya Thepahatsadin ve Phraya Udom Pongphensawad dahil olmak üzere 51 şüpheli ve sempatizanı daha tutukladı. Phraya Songsuradet ile devlete karşı komplo kurmakla suçlanıyorlar ve özellikle kraliyet ailesinin bir üyesi olan Rangsit'in yargılanacağı not ediliyor. Bazı yorumcular, prensin özellikle [THIS.GetName]'de kalan kraliyet ailesi üyelerine bir mesaj göndermek için hedeflenip hedeflenmediğini merak ediyor; hizaya girin veya düşün."
 siam.4.t:0 "Songsuradet Sempatizanları Tutuklandı"
 siam.40.a:0 "O zaman savaşırız."
 siam.40.desc:0 "[FROM.GetLeader], Bangkok'tan gönderilen her girişimi reddetti. Hiçbir teslimiyet yeterli görülmüyor ve hiçbir uzlaşma kabul edilmiyor. Düşman meseleyi sadece tam bir fetih yoluyla çözmeyi amaçlıyor. Artık [ROOT.GetNameDef] için direnişten başka bir şey kalmadı. Kıyılarımızı anlaşmayla terk etmeyeceklerse, zorla kovulmaları gerekir."
 siam.40.t:0 "[FROM.GetAdjective] Hükümeti Teklifimizi Reddediyor"
 siam.41.a:0 "Delegasyonlarına hoş geldiniz diyoruz."
 siam.41.desc:0 "İdari ve araştırma uygulamalarımızı gözlemlemek ve incelemek üzere bir [FROM.GetAdjective] yetkili heyeti geldi. [FROM.GetNameDefCap], yabancı uzmanlıktan yararlanarak bürokrasisini modernize etmeye niyetli görünüyor ve modeli olarak [ROOT.GetNameDef]'i seçti. Ziyaret, yöntemlerimizin üstü kapalı bir kabulü ve başka bir hükümetle iyi niyet inşa etmek için bir fırsattır."
 siam.41.t:0 "[FROM.GetNameDefCap] Yöntemlerimizi İncelemek İçin Yetkililer Gönderiyor"
 siam.42.a:0 "Ticaret ilişkimiz için memnuniyet verici bir gelişme."
 siam.42.desc:0 "[FROM.GetNameDefCap], para birimini resmen bizimkine demirlemeyi seçti. Karar, [FROM.GetNameDef]'i ekonomik yörüngemize daha da yaklaştırıyor ve finansal kurumlarımızın istikrarına yönelik bir dereceye kadar güveni işaret ediyor. Uluslarımız arasındaki ticaret daha öngörülebilir hale gelmeli ve [FROM.GetAdjective] tüccarları bizimkilerle iş yapmayı daha kolay bulacaklar."
 siam.42.t:0 "[FROM.GetNameDefCap] Para Birimini Bizimkine Sabitliyor"
 siam.43.a:0 "Yardım etmekten memnuniyet duyarız."
 siam.43.desc:0 "[FROM.GetNameDefCap], uluslarının gelişimine yardımcı olmaları için mühendislerimize ve uzmanlarımıza bir davetiye uzattı. Kooperatif, endüstrilerimize bölgede bir tutunma noktası sunuyor ve hükümetlerimiz arasındaki ekonomik bağları güçlendiriyor. Bu mütevazı bir teklif, ancak zamanla önemli getiriler sağlayabilecek bir teklif."
 siam.43.t:0 "[FROM.GetNameDefCap] Gelişim Yatırımı Talep Ediyor"
 siam.44.a:0 "Tersanelerimiz için memnuniyet verici bir sipariş."
 siam.44.desc:0 "[FROM.GetNameDefCap], tasarımlarımıza göre inşa edilecek denizaltılar için sipariş verdi. Bu satış, denizcilik endüstrimize yönelik anlamlı bir güven oylamasını temsil ediyor ve [FROM.GetAdjective] nüfuzunu Güneydoğu Asya sularına kadar genişletiyor."
 siam.44.t:0 "[FROM.GetNameDefCap] Denizaltı Siparişi Veriyor"
 siam.45.a:0 "Birleşik bir cephe gereklidir."
 siam.45.b:0 "İttifakımız bizim olarak kalacak."
 siam.45.desc:0 "[FROM.GetName]'den bir delegasyon [FROM.GetLeader]'in bir teklifiyle geldi. Adamları, teçhizatı ve diplomatik nüfuzu rakip komutanlıklar arasında bölerken, artık ayrı ittifaklarımızın aynı geniş hedefleri güttüğünü iddia ediyorlar.\n\nGüçlerimizi onlarınkiyle birleştirerek, daha geniş bir cephede stratejiyi koordine edebilecek daha güçlü bir blok oluştururuz. Böyle bir anlaşma ortak amacı güçlendirir, ancak aynı zamanda ittifakın gelecekteki yönü üzerinde [FROM.GetAdjective] nüfuzunu kabul etmemizi de gerektirir."
 siam.45.t:0 "[FROM.GetNameDefCap] İttifak Birleşmesi Öneriyor"
 siam.46.a:0 "Birlikte, daha güçlü duruyoruz."
 siam.46.desc:0 "[FROM.GetLeader], ittifaklarımızı tek bir koalisyonda birleştirme önerimizi kabul etti. Bir zamanlar ayrı komutanlıklar ve diplomatik kanallar olan şeyler şimdi tek bir yapı halinde birleştiriliyor ve bu durum hükümetlerimizin savaş planlarını, tedarik düzenlemelerini ve dış politikayı çok daha büyük bir netlikle koordine etmesine olanak tanıyor.\n\nDüzenleme komplikasyonsuz değil, ancak birliğin gerekliliği galip geldi."
 siam.46.t:0 "[FROM.GetNameDefCap] Birleşmeyi Kabul Ediyor"
 siam.47.a:0 "O zaman tek başımıza ilerliyoruz."
 siam.47.desc:0 "[FROM.GetLeader] ittifaklarımızı birleştirme önerimizi reddetti. Hükümetleri, çıkarların uyduğu yerlerde işbirliğinin devam edebileceğini, ancak ittifaklarını [ROOT.Capital.GetCapitalVictoryPointName]'den yönetilen daha geniş bir koalisyonun içine yerleştirmeyeceklerini iddia ediyor.\n\nŞimdilik, bloklarımız arasındaki bölünme devam ediyor. Tam bağlılıklarını varsaymadan hedeflerimizi takip etmeliyiz."
 siam.47.t:0 "[FROM.GetNameDefCap] Birleşmeyi Reddediyor"
 siam.48.a:0 "Önerilerini kabul et."
 siam.48.b:0 "[JAP.GetName] kaynak ayıramaz."
 siam.48.desc:0 "[SIA.GetNameDefCap], ülkelerini işgal eden kuvvetlere karşı resmen askeri yardım talep etti. Buna karşılık, [SIA.GetAdjective] hükümeti [JAP.GetAdjective] firmalarına stratejik kaynaklara, altyapıya ve ticari haklara ayrıcalıklı erişim hakkı vermeye hazırdır.\n\n[SIA.GetName]'i desteklemek Güneydoğu Asya'daki nüfuzumuzu genişletecek ve İmparatorluk için değerli malzemeleri güvence altına alacaktır, ancak aynı zamanda bizi bölgesel çatışmalara daha derinden bulaştırabilir."
 siam.48.t:0 "[SIA.GetName], [JAP.GetAdjective] Yardımı Talep Ediyor"
 siam.49.a:0 "Bir müttefik güvence altına aldık."
 siam.49.desc:0 "[JAP.GetNameDefCap], mücadelesinde [ROOT.GetNameDef]'i desteklemeyi kabul etti. [JAP.GetAdjective] danışmanları, teçhizatı ve erzakları yakında gelmeye başlayacakken, anlaşma uyarınca [JAP.GetAdjective] şirketlerine ekonomik imtiyazlar verildi.\n\nKabine ulusun hayatta kalmasını kutlasa da, birçoğu bu yardım için ne kadar bağımsızlığın takas edildiğini sessizce merak ediyor."
 siam.49.t:0 "[JAP.GetName] Çağrımızı Kabul Ediyor"
 siam.5.a:0 "Bu mesele çözüldü."
 siam.5.desc:0 "İsyana karışan 51 kişiyi yargılamak için Phibul tarafından özel bir mahkeme oluşturuldu; bunlardan 25'i ömür boyu hapis cezasına çarptırılacak ve 21'i kurşuna dizilerek idam edilecek. Bu 21 kişiden Prens Rangsit ve Phraya Thepahatsadin isimli üç kişi onurlu sicilleri nedeniyle affedilecek."
 siam.5.t:0 "18 Ceset İsyanı"
 siam.6.a:0 "Geri adım atmayacağız."
 siam.6.b:0 "Bu ters tepti. Geri çekilelim."
 siam.6.desc:0 "Phraya Songsuradet, [SIA_plaek_phibunsongkhram.GetName]'e yönelik bir veya daha fazla suikast girişiminde ve hükümetine karşı bir darbe planlamasında beyin olmakla suçlanıyor. Songsuradet'in komutayı devretmesi ve sürgüne gönderilmesi hükümetin iradesidir.\nAncak tutuklanması, Songsuradet'e sadık askeri personel tarafından engellendi ve tutuklamanın siyasi güdülü olduğu iddia edildi. Hükümet ve Songsuradet'in askeri kliği şimdi bir çıkmazda, ikisi de geri adım atmayı reddediyor."
 siam.6.t:0 "Songsuradet Çıkmazı"
 siam.7.a:0 "Biz hükümetiz, şantaja boyun eğmeyeceğiz!"
 siam.7.b:0 "Bu durum kontrolden çıkıyor. Geri çekilelim."
 siam.7.desc:0 "Hükümet güçleri ile Songsuradet'in askeri kliği arasındaki gergin bekleyiş devam ederken, hükümet müfettişleri, Phibun'un artan otoriterliğine karşı koymak amacıyla Kraliyet Donanması ile Songsuradet arasında bir ittifak kurulduğuna dair söylentiler duymaya başladı.\nHepsi bu kadar değil, Kraliyet Hanedanının bazı yardımcıları, Songsuradet'in temsilcilerinin üst düzey Prenslerle buluştuğunu ve Kraliyet mensuplarının da muhalefetle ittifak kuracağı korkusunu artırdığını bildirdi."
 siam.7.t:0 "Songsuradet Donanma Desteği Arıyor"
 siam.8.a:0 "Hükümet ayakta kalmalıdır."
 siam.8.desc:0 "Hem siyasi hem de askeri olarak yeterli desteği sağlayan Songsuradet askeri kliği, Donanma ile birlikte [THIS.GetName]'in geniş alanlarını etkili bir şekilde ele geçirdi. Sabahın erken saatlerinde Bangkok banliyölerinde silah sesleri yankılandı ve tüm ülke hükümet ile Songsuradet arasında tam ölçekli bir iç savaşa hazır görünüyor."
 siam.8.t:0 "Songsuradet İsyanı"
 siam.9.a:0 "Yeniden inşa zamanı."
 siam.9.desc:0 "İsyan darmadağın ve Songsuradet yakalandıktan sonra geriye kalan tek şey yargılama, ancak bu noktada bu sadece bir formaliteden ibaret. Komplo sadece ordu ve donanmada değil, aynı zamanda Kraliyet ailesi içinde de bulundu, Prens Rangsit'in isyancıları açıkça desteklediği ortaya çıktı. Muhaliflerin derinlemesine bir tasfiyesi bir alternatif değil, bir zorunluluk haline geldi."
 siam.9.t:0 "Songsuradet İsyanı'nın Sonu"
 siam_adc.1.a:0 "Onları serbest bırakacağız."
 siam_adc.1.b:0 "İşgal altında kalacaklar."
 siam_adc.1.desc:0 "[FROM.GetNameDef]'den resmi bir nota geldi ve burada [FROM.GetLeader] Asya ülkelerini işgal etmeye devam etmemizi kendi kaderini tayin etme haklarına katlanılamaz bir hakaret olarak kınıyor. Mesaj, Asya'nın yabancıların zevkine göre bölünecek veya yönetilecek bir ödül olmadığını belirtiyor ve kuvvetlerimizi derhal geri çekmemizi ve [?var:SIA_adc_demand_country_to_be_released.GetNameDef] içinde bağımsız bir hükümeti restore etmemizi talep ediyor.\n\nTalep yanlış anlaşılmaya yer bırakmıyor. [FROM.GetNameDefCap] uyum bekliyor ve bizim tarafımızdan yapılacak herhangi bir red, uluslarına yönelik kasıtlı bir hakaret olarak hatırlanacak."
 siam_adc.1.t:0 "[FROM.GetNameDefCap], [?var:SIA_adc_demand_country_to_be_released.GetNameDef]'in Serbest Bırakılmasını Talep Ediyor"
 siam_adc.2.a:0 "Özgür bir ulus olarak ayakta kalacağız."
 siam_adc.2.b:0 "[FROM.GetAdjective] koruması altında kalacağız."
 siam_adc.2.desc:0 "[FROM.GetAdjective] tarafının [ROOT.GetNameDef]'in geleceği ile ilgili [SIA.GetNameDef] taleplerini kabul etmesinin ardından, [FROM.GetLeader] şimdi önümüze nihai soruyu koyuyor. Tekrar tek başımıza ayakta durmayı seçersek, işgal yetkilileri geri çekilmeye ve egemen bir [ROOT.GetAdjective] hükümetini tanımaya hazırlar.\n\nBağımsızlık onur ve hareket özgürlüğü sunar, ancak aynı zamanda [FROM.GetNameDef]'in garantileri olmadan devleti yeniden inşa etmemiz için bizi yalnız bırakır. Onların koruması altında kalmak daha mütevazı bir yoldur, ancak bu belirsiz zamanlarda ülkeyi daha fazla karmaşadan kurtarabilecek bir yoldur."
 siam_adc.2.t:0 "[FROM.GetNameDefCap] Bağımsızlığımızı Geri Yüklemeyi Öneriyor"
 siam_adc.3.a:0 "Gelecekleri ne getirecek?"
 siam_adc.3.desc:0 "[?var:SIA_tag_that_was_released_due_to_sia_pressure.GetNameDef] hükümeti bağımsızlığı seçti. İşgal idaresinin şimdi feshedilmesi planlanırken, [var:SIA_tag_that_was_released_due_to_sia_pressure.GetNameDef] dünyanın egemen ulusları arasındaki yerini almaya hazırlanıyor."
 siam_adc.3.t:0 "[?var:SIA_tag_that_was_released_due_to_sia_pressure.GetName] Bağımsızlığı Kabul Ediyor"
 siam_adc.4.a:0 "O zaman düzenleme devam ediyor."
 siam_adc.4.desc:0 "Özgürlük kazanma fırsatına rağmen, [FROM.GetNameDef] hükümeti derhal bağımsızlığı reddetti. Bakanları, devletin henüz tam egemenliğin yüklerine katlanmaya hazır olmadığını ve şimdilik statükoyu korumayı tercih ettiğini savunuyor."
 siam_adc.4.t:0 "[FROM.GetNameDefCap] Bağımsızlığı Reddediyor"
 siam_adc.5.a:0 "O zaman onlara göstereceğiz."
 siam_adc.5.desc:0 "[FROM.GetName], taleplerimizin en iyi ihtimalle gülünç olduğunu açıkça ortaya koydu. Zayıf ordumuzu, statükoya meydan okuyacak bir konumda olmadığımızın kanıtı olarak gösteriyorlar."
 siam_adc.5.t:0 "[FROM.GetNameDefCap] Taleplerimizi Reddediyor"
 siam_air.1.a:0 "Savaşçı eğitimi"
 siam_air.1.b:0 "Vuruş talimatı"
 siam_air.1.c:0 "Dikkatli ve tarafsız bir paket"
 siam_air.1.desc:0 "Eğitmenler, kılavuzlar ve uçak teklifini içeren bir Japon teknik heyeti geldi. Havacılarımız, yardımlarının nereye en çok fayda sağlayacağına karar vermeli."
 siam_air.1.t:0 "Tokyo Eğitmen Gönderiyor"
 siam_air.2.a:0 "Kayıpları kabul et"
 siam_air.2.b:0 "Yeşil pilotları topraklayın"
 siam_air.2.desc:0 "Ormanda uçmak affetmez ve yeşil pilotlar bunun bedelini enkaz halindeki uçaklarda ödüyor. Devam edip hayatta kalanların gazi olmasına mı izin vereceğiz, yoksa deneyimsizleri koşullar düzelene kadar cezalandıracak mıyız?"
 siam_air.2.t:0 "Havacılar Ne Kadar Zorlanacak?"
 siam_dem.2.a:0 "Ordu davasını sundu"
 siam_dem.2.desc:0 "Bakanların ve üst düzey yetkililerin özel bir toplantısında, askeri bir temsilci Sarı Dosya önerisine yönelik sert bir eleştiri sundu. Yazarlarının devlet yönlendirmesi, yeniden dağıtım ve sosyal yükümlülük hakkında çok rahat konuştuklarını, disiplin, mülkiyet ve subay birliği ile kırsalın üzerine düşecek yüklere ise çok az önem verdiklerini savunuyor. Kendi görüşüne göre, dünya her geçen ay daha da tehlikeli hale gelirken [ROOT.GetNameDef] kağıt üzerinde hazırlanan teorilerle yeniden yapılandırılamaz."
 siam_dem.2.t:0 "Ordu İtiraz Ediyor"
 siam_dem.3.a:0 "Eleştiri yayılıyor"
 siam_dem.3.desc:0 "Tartışma komite odasından çıktı. Ordu vekili olarak yaygın kabul gören bir gazete, Sarı Dosya'yı vatansever bir dille giydirilmiş yabancı bir program olarak sunarak tam bir kınamasını yayımladı. Editörleri, teklifin sınıf şikayetlerini ulusal birliğin üzerine yerleştirdiği, yerleşik kurumlara olan güveni zayıflattığı ve işçiler ile köylüler arasında tehlikeli beklentileri teşvik ettiği konusunda uyarıyor. Öğleden sonra makale kışlalarda, ofislerde ve çay evlerinde aynı şekilde tekrarlanıyor ve daha önce iç bir tartışma olan şey şimdi halka açık bir tartışma haline geliyor."
 siam_dem.3.t:0 "Halka Açık Bir Azarlama"
 siam_dem.4.a:0 "Hiçbir şüpheye yer bırakmıyor"
 siam_dem.4.desc:0 "Phibun kavgaya açıkça ve kusursuz bir güçle girdi. Destekçilerinin ve subaylarının önünde konuşarak, Sarı Dosya'yı, savunucuları hangi dili tercih ederse etsin özünde komünist olarak kınıyor. Devleti mülkiyetin üzerine çıkaran, kapsamlı sosyal dönüşüm vaat eden ve alt sınıflar arasında kışkırtıcılık yaratan herhangi bir programın, kızıl zehri [ROOT.GetNameDef] içine başka bir adla taşıdığını ilan ediyor."
 siam_dem.4.t:0 "Phibun Dosyayı Kınıyor"
 siam_dem.5.a:0 "Pridi Banomyong liderlik edecek. Direniş bunu hak etti."
 siam_dem.5.b:0 "Khuang Aphaiwong, tüm ittifakların kabul edebileceği bir yüz."
 siam_dem.5.c:0 "General Phin Choonhavan. Ordunun bir yeri olacak."
 siam_dem.5.desc:0 "Eski rejim yıkıldı ve Seri Thai zafer kazandı. Ancak zafer, hükümet demek değildir ve Phibun'a karşı birleşen koalisyon, ondan sonra ne gelmesi gerektiği konusunda hemfikir olmaktan çok uzak. Güç koridorlarında üç isim konuşuluyor: direnişin vicdanı Pridi Banomyong; kimseyi gücendirmeyecek kadar yumuşak başlı bir adam olan Khuang Aphaiwong; ve subayları haklarını bekleyen General Phin Choonhavan. Şimdi kimi başa geçirirsek, gelecek barışı o şekillendirecek."
 siam_dem.5.t:0 "Bir Hükümet Kurulmalı"
 siam_dem_event_count:0 "Ordu, ne kadar uzun süre beklersek o kadar karalama kampanyası planlıyor "
 taog_news.1.a:0 "İlginç bir gelişme."
 taog_news.1.desc:0 "Kraliçe Wilhelmina dün [1058.GetName]'de bir duyuru yaparak beklenmedik bir şekilde bir Hollanda-Endonezya Birliği devletinin kurulduğunu ilan etti. Anavatanın işgal altında olmasıyla birlikte, sürgündeki [HOL.GetAdjective] hükümeti ve [INS.GetAdjective] idaresi, Taç altında tek bir gövde olarak yönetmeyi kabul etti. Her iki ülkenin yetkilileri de bu hamleyi bir seçimden ziyade bir zorunluluk önlemi, Krallığın birliğini ve otoritesini iki kıtada korumaya yönelik çaresiz bir çaba olarak tanımlıyor."
 taog_news.1.t:0 "Hollanda-Endonezya Birliğinin Doğuşu"
 taog_news.2.a:0 "Bu durum küresel çapta büyük bir değişime yol açabilir."
 taog_news.2.desc:0 "[INS.GetAdjective] devrimcisi [INS.GetLeader] bugün Java'da yaptığı konuşmada yeni kurulan Endonezya Cumhuriyeti'nin bağımsızlığını ilan etti. [HOL.GetNameDef], bu yeni kurulan cumhuriyetin egemenliğini tanımıyor, ancak Cumhuriyetçi milisler halihazırda belirli bölgeler üzerinde de-facto kontrolü elinde tutuyor."
 taog_news.2.t:0 "Endonezya Bağımsızlık Bildirgesi"
