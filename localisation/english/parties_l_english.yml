 anarchism:0 "Anarşizm"
 anarchism_desc:0 "Anarşizm, otoritenin kendisinin reddedilmesidir ve tekil, merkezi bir devlet yerine toplumun kendi kendini yöneten ve kendi kendini idare eden kolektiflere bölünmesini teşvik eder."
 anarchist_communism:0 "Anarşist Komünizm"
 anarchist_communism_desc:0 "Komünizmi devletsiz bir toplum fikri olarak benimseyen bir ideoloji olan Anarşist Komünizm, geçiş dönemi bir sosyalist devlet fikrinden kaçınır ve gönüllü birliklere ve karşılıklı yardıma dayalı bir toplumu tercih eder."
 anti_revisionism:0 "Anti-Revizyonizm"
 anti_revisionism_desc:0 "Marksizm'in halefleri olduğunu iddia eden birçok ideolojiye bir tepki olan Anti-Revizyonizm, orijinal devrimci teorinin kilit unsurlarını korumayı savunur. Esas olarak kapitalist ekonomik unsurların sosyalist devletlere dahil edilmesine karşı çıkan bu ideoloji, ne olduğu kadar ne olmadığıyla da tanımlanır."
 bermontian_party:0 "Bermontowszczyzna"
 buddhist_socialism:0 "Budist Sosyalizmi"
 buddhist_socialism_desc:0 "Dhammik veya Doğal sosyalizm olarak da adlandırılan Budist sosyalizmi, Budizm ilkelerine dayalı sosyalizmi savunan bir siyasi ideolojidir. Hem Budizm hem de sosyalizm, koşullarını analiz ederek ve ana nedenlerini pratik yoluyla ortadan kaldırarak acıya bir son vermeyi amaçlar. Her ikisi de insan yabancılaşmasına ve bencilliğine son vermek için kişisel bilincin dönüşümünü sağlamayı amaçlar."
 centrism:0 "Merkezcilik"
 centrism_desc:0 "Merkezcilik, mevcut ve gelecekteki ihtiyaçları uygun şekilde ele alan, kamu güvenini destekleyen ve bu ihtiyaçlar bağlamında risk ve kapasiteyi göz önünde bulundurarak ortak iyiliğe hizmet eden sağduyulu çözümler elde etmek isteyen bir hükümet biçimidir."
 communism:0 "Komünist"
 communism_desc:0 "Totaliter Rejim"
 communism_noun:0 "Komünizm"
 conservatism:0 "Muhafazakarlık"
 conservatism_desc:0 "Toplumdaki hızlı değişimleri potansiyel olarak zararlı gören muhafazakarlık, geleneği ve ılımlı reformları benimser, bazen eski ahlaki değerlere dönüşü savunur."
 democratic:0 "Demokratik"
 democratic_desc:0 "Demokratik Devlet"
 democratic_noun:0 "Demokrasi"
 despotism:0 "Despotik"
 despotism_desc:0 "Despotizm, tek bir kişinin mutlak güçle yönettiği bir hükümet biçimidir."
 emperor_fascism:0 "İmparator Faşizmi"
 emperor_fascism_desc:0 "İmparator Faşizmi, kitlelerin söz hakkına sahip olmadığı, genellikle 'yukarıdan faşizm' olarak adlandırılan, yönetimin askeri ve aristokrat bürokratlar tarafından tutulduğu ve ulusun imparatoruna, yanılmaz bir ilahi figür olarak kabul edilen bir hükümdara büyük saygı duyulan bir Aşırı Milliyetçilik biçimidir."
 falangism:0 "Falanjizm"
 falangism_desc:0 "Faşizm ve muhafazakarlık özelliklerine sahip otoriter bir ideoloji olan Falanjizm, ulusal ve Katolik kimliğe değer verir."
 fascism:0 "Faşist"
 fascism_desc:0 "Totaliter Rejim"
 fascism_ideology:0 "Faşizm"
 fascism_ideology_desc:0 "Çeşitli aşırı milliyetçi hareketleri kapsayan faşizm, tipik olarak devlete bağlılığı ve halkı güçlü bir lider altında birleştirmeyi yüceltir."
 fascism_noun:0 "Faşizm"
 gen_nazism:0 "Nazizm"
 gen_nazism_desc:0 "Aşırı milliyetçiliğe dayanan Nasyonal Sosyalizm, ırksal üstünlük fikirleriyle hareket eder. Saldırgan yayılmacılığı ve halkın mutlak güce sahip bir lider altında birleştiği totaliter bir devleti teşvik eder."
 house_of_agua_rosada:0 "Água Rosada"
 house_of_agua_rosada_long:0 "Água Rosada Hanedanı"
 japan_militarism_ideology:0 "Militarizm"
 japan_militarism_ideology_desc:0 "Militarizm, ulus liderinin yalnızca nominal bir kontrole sahip olduğu ve bağımsız bir politikacıdan çok ulusun ordusunun bir kuklası gibi hareket ettiği, hızlı yayılmacı politika nihai hedefiyle gündemlerini sürekli ilettiği bir ideolojidir."
 leninism:0 "Leninizm"
 leninism_desc:0 "Marksist düşünceye dayanan bir siyasi ideoloji olan Leninizm, kapitalist toplumu deviren bir devrime öncülük eden bir öncü parti aracılığıyla sosyalist bir devlet kurmayı amaçlar. İktidara geldikten sonra parti, bir karar alınana kadar politikaların iç tartışmaya açık olduğu bir sistemle yönetir."
 liberalism:0 "Liberalizm"
 liberalism_desc:0 "Kişisel özgürlüğe değer veren uzun bir felsefi geleneğe sahip olan liberalizm, bu hakların korunmasını devletin birincil işlevi olarak görür."
 marxism:0 "Marksizm"
 marxism_desc:0 "Geniş bir ekonomik ve tarihi görüş yelpazesini kapsayan Marksist siyaset, Karl Marx'ın teorilerini siyasi pratiğe uygulamayı amaçlar. Sınıf mücadelesi ve üretim araçlarının ortak mülkiyetine dayalı bir topluma geçiş ihtiyacı bu ideolojileri karakterize eder."
 moderatism:0 "Ilımlılık"
 moderatism_desc:0 "Ilımlılık, ılımlı bir pozisyon veya hareket tarzı benimseyerek sol ve sağın aşırılıklarından kaçınan bir hükümet biçimidir."
 nazism:0 "Nazizm"
 nazism_desc:0 "Aşırı milliyetçiliğe dayanan Nasyonal Sosyalizm, Cermen üstünlüğü fikirleriyle hareket eder. Saldırgan yayılmacılığı ve halkın mutlak güce sahip bir lider, Führer altında birleştiği totaliter bir devleti teşvik eder."
 neutrality:0 "Tarafsız"
 neutrality_desc:0 "Otoriter Rejim"
 neutrality_noun:0 "Tarafsızlık"
 oligarchism:0 "Oligarşik"
 oligarchism_desc:0 "Oligarşi, bir grup insanın mutlak güçle yönettiği bir hükümet biçimidir."
 populism:0 "Popülizm"
 populism_desc:0 "Belirgin bir ideolojik çerçevesi olmayan siyasi bir hareket. Popülistler, seçmenler arasında popüler olan veya siyasi 'elitlerin' tercihleriyle çeliştiği algılanan yelpazenin her yerinden politikaları savunurlar."
 rexism:0 "Reksizm"
 rexism_desc:0 "Hem liberal hem de komünist ideallere şiddetle karşı çıkan Reksizm, korporatist bir ekonomi politikasını savunan sadık bir muhafazakar milliyetçi harekettir. Giderek artan popülist ve otoriter bir söylem kullanarak, idealleri diğer faşist hareketlere yaklaşmaktadır."
 romanov_party:0 "Romanowowie"
 socialism:0 "Sosyalizm"
 socialism_desc:0 "Reformist yollarla eşitlik ve sosyalist bir devlet için çabalayan demokratik sosyalizm, kamuoyu yetkisiyle kapitalizmin etkilerini ortadan kaldırmayı veya azaltmayı amaçlar."
 stalinism:0 "Stalinizm"
 stalinism_desc:0 "Marksist-Leninist politikaları uygulayan ve geliştiren bir hükümet biçimi olarak kendini tanımlayan Stalinizm, hızlı sanayileşme ve kolektifleştirmeyi ve ayrıca herhangi bir karşı-devrimci unsuru tasfiye etmek için güçlü, otoriter bir sosyalist devlet ihtiyacını vurgular."
