 RAJ_GOE_partition_gui_state_row_lean_tt:0 "§Y[THIS.GetName]§! üzerindeki baskımız. Prenslikler kaderlerini belirlerken, bir prenslik üzerindeki baskısı tüm rakiplerinden en az %25 fazla olan tarafa katılır.\n\n£trigger_yes §Y[THIS.GetName]§! bize yakındır; her girişim §Y1§! yerine §Y[?THIS.preference|2]§! baskı ekler."
