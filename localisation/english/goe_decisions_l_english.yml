 RAJ_GOE_partition_cat:0 "Bölünme"
 RAJ_GOE_partition_cat_desc:0 "Hindistan bölününce, bir zamanlar Britanya Tacı'na bağlı olan prenslikler bizimle komşularımız arasında seçim yapmak zorunda kaldı. Her prens, ardıl devletlerin vaatlerini ve baskısını tartıyor; zamanı geldiğinde kendisini en çok ikna eden tarafa katılacak. Nüfuzumuzu akıllıca kullanmalıyız. Bugün kazandığımız her prenslik, yarın zorla ele geçirmek zorunda kalmayacağımız bir topraktır."
 RAJ_GOE_partition_gui_header:0 "Kullanılabilir baskı: §Y[?pressure_left|0]§! / §Y[?default_pressure|0]§!"
 RAJ_GOE_partition_gui_header_tt:0 "§YPrenslikler İçin Rekabet Et§! kararının her kullanımı, bir prenslik üzerinde §Y1§! baskı harcar.\n£GFX_trigger_yes bize yakın olan bir prensliği gösterir; buradaki baskımız daha etkilidir.\nHer prenslik üzerindeki rakip baskısı §Ybilinmiyor§!."
