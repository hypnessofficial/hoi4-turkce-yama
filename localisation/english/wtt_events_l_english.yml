 britain.25.a:0 "[ENG.GetFactionName]'e katılmaktan başka çaremiz yok"
 britain.25.b:0 "[ENG.GetAdjective]ler kahrolsun"
 britain.25.c:0 "İşgal anlamına gelse bile tarafsızlığımıza uymalıyız"
 britain.25.desc:0 "[DEN.GetNameDef]'nin düşüşünden ve [ICE.GetNameDef]'de [GER.GetAdjective] diplomatlarının bulunmasından sonra görünüşte alarma geçen [ENG.GetAdjective] hükümeti, bizi ortak savaşçılar olarak müttefiklere katılmaya davet etti. [GER.GetNameDef]'nin potansiyel olarak İzlanda üslerini İngiliz konvoylarına veya şehirlerine yönelik baskınlar için bir sıçrama tahtası olarak kullanabileceği ulusal güvenlikleriyle ilgili endişelerini dile getiriyorlar.\nTehditleri, bizim tarafımızdan gelen \"sözde tarafsızlık\" iddialarının İngiliz vatandaşlarının güvenliği ve faşizme karşı savaş nedeniyle gölgede kaldığı mevcut dünya durumuna atıfta bulunarak ince bir şekilde örtülmüştü."
 britain.25.t:0 "[ENG.GetNameDefCap] boyun eğme talep ediyor"
 britain.26.a:0 "[ICE.GetNameDef] halkı korunmalı"
 britain.26.b:0 "Kaynakları ayıramayız"
 britain.26.desc:0 "Şu anda [ICE.GetNameDef]'de görevli olan diplomatlarımız, acemi [ICE.GetAdjective] hükümetinin, boyun eğmedikleri takdirde İngiliz kuvvetleri tarafından işgal edilmekle tehdit edildiğine dair bize bir dizi mesaj gönderdi. Başka bir uygun alternatifi olmayan [ICE.GetLeader.GetName], İngiliz tehdidinden korunmamızı talep etti. Belki de İngiliz anakarasına bu kadar yakın bir üs bize faydalı olur?"
 britain.26.t:0 "[ICE.GetNameDefCap], [ENG.GetNameDef]'den korumamızı istiyor"
 britain.27.a:0 "Üzücü ama gerekli bir yol"
 britain.27.desc:0 "[ICE.GetAdjective] hükümeti, tarafsızlığa olan inançlarını ve içinde yer almadıkları bir savaşa sürüklenmeye karşı şiddetli muhalefetlerini gerekçe göstererek uyum ültimatomumuzu reddetti.\nBu emirle bağımsızlıklarının hem ihlal edildiğini hem de bariz bir şekilde çiğnendiğini iddia ediyorlar. Ne yazık ki bu modern bir savaş ve modern savaşta tarafsız partiler olamaz; bu gidişattan üzüntü duysak da yapmamız gerekeni yapmalıyız."
 britain.27.t:0 "[ICE.GetNameDefCap] teklifimizi reddediyor"
 canals_tt:0 "Düşman planını önlemek için önümüzdeki ay içinde kanalın kıyılarının kontrolünü ele geçirin."
 decisions.1.a:0 "Herhangi biri olur, sadece ordularımızı yönetecek birine ihtiyacımız var."
 decisions.1.b:0 "En azından ne yaptığını bilen birine ihtiyacımız var."
 decisions.1.c:0 "Kalite her şeyden önemlidir, maliyetten ödün vermemeliyiz."
 decisions.1.d:0 "Sadece en iyisi yeterli olacaktır."
 decisions.1.desc:0 "Ordunun alt kademelerindeki bazı subaylar, ülke liderliği hakkında 'alternatif' görüşler dile getirdi. Şüpheyi sınırlamak için, çabalarımızı sadece bir potansiyel destekçiye yaklaşmakla sınırlamalı ve sadakatlerini satın almak için hiçbir kaynaktan kaçınmamalıyız."
 decisions.1.t:0 "Alt Ordu Komuta Sadakati"
 decisions.2.desc:0 "Ordunun üst kademelerindeki bazı subaylar, ülke liderliği hakkında 'alternatif' görüşler dile getirdi. Şüpheyi sınırlamak için, çabalarımızı sadece bir potansiyel destekçiye yaklaşmakla sınırlamalı ve sadakatlerini satın almak için hiçbir kaynaktan kaçınmamalıyız."
 decisions.2.t:0 "Üst Ordu Komutanlığı Sadakati"
 generic.10.a:0 "Kabul edilebilir bir sonuç."
 generic.10.d:0 "Müttefiklerimiz dünyanın ilk nükleer silahını kullanarak, ittifakımızı mevcut silahlanma yarışında kesin bir şekilde öne geçirdi. Geride kalmış olsak da, silah müttefikimizin elinde, bu da herhangi bir düşmanın kendisi atomu ehlileştirmesi durumunda misilleme yeteneğimizi sağlıyor."
 generic.10.t:0 "Güçlü Dostlar"
 generic.11.a:0 "Birlikte, daha iyi bir gelecek için çalışacağız!"
 generic.11.d:0 "Ulusumuzu paramparça eden savaş nihayet sona erdi. Artık halkı birleştirme ve yıkımı onarma görevine başlayabiliriz."
 generic.11.t:0 "İç Savaş Sona Erdi"
 generic.12.a:0 "Buna izin veremeyiz!"
 generic.12.d:0 "Askeri istihbarat, [From.GetAdjective]'in Süveyş Kanalı'nı sabote etmek için büyük ölçekli yıkımlar ve blok gemileri kullanmayı planladığını gösteriyor. Onları durdurmak istiyorsak, çok fazla zamanımız yok."
 generic.12.t:0 "[From.GetAdjective] Süveyş'i Sabote Etmeye Çalışıyor"
 generic.13.d:0 "Askeri istihbarat, [From.GetAdjective]'in Panama Kanalı'nı sabote etmek için büyük ölçekli yıkımlar ve blok gemileri kullanmayı planladığını gösteriyor. Onları durdurmak istiyorsak, çok fazla zamanımız yok."
 generic.13.t:0 "[From.GetAdjective] Panama'yı Sabote Etmeye Çalışıyor"
 generic.14.a:0 "Bu makul bir talep."
 generic.14.b:0 "Ataşelerimiz istediğimiz yere gönderilecek."
 generic.14.d:0 "[From.GetAdjective] elçileri, şu anda askeri bir çatışma içinde oldukları uluslardaki ataşelerimizin varlığı konusunda hükümetimize güçlü bir diplomatik protesto sundular. Askeri misyonumuzun derhal geri çağrılmasını talep ediyorlar."
 generic.14.t:0 "[From.GetName] Diplomatik Protesto Yayınladı"
 generic.15.d:0 "Taleplerimize yanıt olarak, [From.GetNameDef] askeri misyonunu düşmanlarımıza geri çekti."
 generic.15.t:0 "[From.GetName] Ataşeyi Geri Çağırdı"
 generic.16.a:0 "Bunu göreceğiz."
 generic.16.d:0 "Taleplerimize rağmen [From.GetNameDef], \"[From.GetAdjective] iç işlerine karışmak gibi bir işimiz olmadığını\" belirterek, askeri misyonlarını düşmanlarımıza geri çekmeyi reddetti."
 generic.16.t:0 "[From.GetName] Ataşeyi Koruyor"
 generic.8.a:0 "Düşmanlarımızı toza çevirin!"
 generic.8.d:0 "Dünyanın ilk nükleer silahını kullanarak, mevcut silahlanma yarışında bizi kesin bir şekilde öne geçirdik. Muazzam çabalarımız karşılığını verdi ve şimdilik dünyanın gücümüze hayran kalmaktan başka seçeneği olmayacak. Bir gün bize yetişebilirler, ama bizi asla geçemeyeceklerinden emin olduk."
 generic.8.t:0 "Atomun Efendileri"
 generic.9.a:0 "Program, elimizden gelen her şeyi almalı."
 generic.9.d:0 "Başkaları dünyanın ilk nükleer silahını kullanarak, onları mevcut silahlanma yarışında kesin bir şekilde öne geçirdi. En iyi çabalarımıza rağmen, ne bir savunmamız ne de misilleme aracımız var. Tamamen geride kalmış durumdayız, çabalarımızı iki katına çıkarmaktan ve bu yıkımın çok daha fazlasını serbest bırakmadan önce aradaki farkı kapatmaktan başka seçeneğimiz yok."
 generic.9.t:0 "Başkalarının Gölgesinde"
 germany.60.c:0 "Yalnız kalmayacaklar! İngilizleri savaşa toplayın!"
 germany.61.c:0 "Hollandalıların yardımına gelmeliyiz!"
 japan_border_conflict.1.a:0 "Kabul edilemez."
 japan_border_conflict.1.desc:0 "Bizimle [JAP.GetNameDef] arasındaki sınırdaki sınır çizgisini korumanın bir parçası olarak, Khasan Gölü yakınındaki sınır işaretlerini kontrol etmek için bir çalışma grubu gönderildi. Sınıra yaklaşırken, çalışma grubu yerel bir Japon karakolu tarafından ateş altına alındı. \n\n Resmi bir diplomatik protestoda bulunduk, ancak Japon büyükelçisi, çalışma grubunun daha fazla bölge talep etmemize olanak sağlamak için işaretleri hareket ettirmek üzere gönderildiğini iddia ediyor.\n\nJaponlar, sınıra saygı duyacakları, ancak mevcut sınırın herhangi bir şekilde \"tahliye edilmesine\" izin vermeyecekleri ve böyle bir girişimde bulunmamız halinde güç kullanarak karşılık verecekleri konusunda bize güvence verdiler. so.\n\n Bu, artık bölgedeki bölgemizde özgürce hareket edemeyeceğimiz anlamına geliyor."
 japan_border_conflict.1.t:0 "Sınırımızda Japon Provokasyonu"
 japan_border_conflict.2.a:0 "Bu meseleyi onurlu bir şekilde hallettik."
 japan_border_conflict.2.b:0 "Uygun bir yanıt hazırlamalıyız."
 japan_border_conflict.2.desc:0 "Khasan Gölü çevresindeki sınır bölgesinde [SOV.GetAdjective] ve Japon kuvvetleri arasında bir çatışmanın ardından, [SOV.GetAdjective] kuvvetlerinin tamamen geri çekildiği bildiriliyor. Japon birimleri bölgedeki bir dizi stratejik tepeyi işgal etti ve konumlarını güçlendirmeye başladı.\n\nSavaş sırasında, Japonlar bir dizi [SOV.GetAdjective] tankı ele geçirdi ve bunlar değerlendirilmek üzere Tokyo'ya gönderildi."
 japan_border_conflict.2.t:0 "Khasan Gölü'nde Japon Zaferi"
 japan_border_conflict.3.a:0 "Hiç denememektense onurla başarısız olmak daha iyidir."
 japan_border_conflict.3.b:0 "Kuvvetlerimiz kendilerini iyi savundular."
 japan_border_conflict.3.desc:0 "Khasan Gölü çevresindeki sınır bölgesinde [SOV.GetAdjective] ve Japon kuvvetleri arasında bir çatışmanın ardından, Moskova'daki Japon büyükelçisi ateşkes talep etti. \n\n Savaş sırasında [SOV.GetAdjective] mevzilerine yönelik birkaç Japon saldırısı ağır kayıplarla başarısız oldu ve bu da Japon ordusunda kuvvetlerinin yetenekleri hakkında endişelere yol açtı."
 japan_border_conflict.3.t:0 "Khasan Gölü'nde Japon Yenilgisi"
 japan_border_conflict.4.a:0 "Değerli bir deneyim kazandık."
 japan_border_conflict.4.b:0 "Sınır olduğu yerde duruyor."
 japan_border_conflict.4.desc:0 "Japon ve [SOV.GetAdjective] kuvvetleri arasındaki Khasan Gölü çevresindeki çatışmalar, her iki tarafın da yeniden toplanmak ve ikmal yapmak için tartışmalı bölgeden çekilmesinin ardından yatıştı. Daha fazla saldırının anlamsızlığını fark eden Japon ordusu, sınırı sabitlemek için ateşkes ve müzakereler istedi."
 japan_border_conflict.4.t:0 "Khasan Gölü'nde Pat Durumu"
 japan_border_conflict.5.a:0 "Hattı tutmalıyız."
 japan_border_conflict.5.desc:0 "Japon ve [SOV.GetAdjective] kuvvetleri arasında Khasan Gölü çevresindeki çatışmalar devam ediyor. Çıkmazı kırmak amacıyla, diğer bölgelerdeki Japon kuvvetleri de o sektördeki [SOV.GetAdjective] kuvvetleriyle çatışmaya başladı. İstihbarat, Japonların yakında saldırıyı İmparatorluklarının diğer bölgelerinden transfer edilen taze birliklerle güçlendirebileceğini gösteriyor."
 japan_border_conflict.5.t:0 "Khasan Gölü'nde Tırmanış"
 japan_border_conflict.6.a:0 "Saldırıya hazırlanmalıyız!"
 japan_border_conflict.6.desc:0 "[FROM.GetAdjective] ve [JAP.GetAdjective] kuvvetleri arasında Khasan Gölü çevresindeki çatışmalar devam ediyor. Çıkmazı kırmak amacıyla, diğer bölgelerdeki [FROM.GetAdjective] kuvvetleri de o sektördeki [JAP.GetAdjective] kuvvetleriyle çatışmaya başladı. İstihbarat, [FROM.GetNameDef]'in yakında saldırıyı ülkelerinin diğer bölgelerinden transfer edilen taze birliklerle güçlendirebileceğini gösteriyor."
 japan_border_conflict.6.t:0 "Khasan Gölü'nde Tırmanış"
 news.331.a:0 "Tarafsızlık Danimarka'yı kurtarmadı."
 news.331.desc:0 "Birlik ortağı Danimarka'nın teslim olmasıyla birlikte, İzlanda Parlamentosu kendi dış işlerinin kontrolünü ele aldı ve bunu yaparak esasen tam bağımsız bir ulus haline geldi. Yeni seçilen geçici vali, ana ulusunun işgaline rağmen, mevcut çatışmada İzlanda'nın tarafsızlığını zaten ilan etti."
 news.331.t:0 "İzlanda Dış İşlerinin Kontrolünü Ele Aldı"
 news.332.a:0 "Akıllıca bir karar."
 news.332.b:0 "Neyse ki kan dökülmedi."
 news.332.c:0 "Buna nasıl cüret ederler?!"
 news.332.d:0 "Başka seçeneğimiz yoktu."
 news.332.desc:0 "Dün, İngiliz deniz birimleri Kuzey Afrika'daki önemli deniz üslerinde Fransız mevkidaşlarını ablukaya alarak, Fransızların derhal İngiliz limanlarına yelken açıp filolarının kontrolünü teslim etmeleri, aksi takdirde İngilizlerin eski müttefiklerine ateş açacağı yönünde bir ültimatom verdi. Üstün ateş gücü karşısında Fransızlar ültimatomu kabul etti ve filoları şimdi İngiliz kontrolü altında."
 news.332.e:0 "İngilizlerin altında savaşmaya devam edecekler."
 news.332.t:0 "Fransızlar Filoyu Teslim Etti"
 news.333.a:0 "Yapılması gerekeni yaptık."
 news.333.b:0 "Bu bir rezalet!"
 news.333.c:0 "Onları hafife almış olabiliriz."
 news.333.d:0 "Bu ihaneti yakın zamanda unutmayacağız!"
 news.333.desc:0 "Dün, İngiliz deniz birimleri Kuzey Afrika'daki önemli deniz üslerinde Fransız mevkidaşlarını ablukaya alarak, Fransızların derhal İngiliz limanlarına yelken açıp filolarının kontrolünü teslim etmeleri, aksi takdirde İngilizlerin eski müttefiklerine ateş açacağı yönünde bir ültimatom verdi. İngiliz taleplerinin Fransızlar tarafından reddedilmesi üzerine, en az bir Fransız zırhlısını batıran ve Fransız filosunun önemli bir bölümüne ciddi hasar veren bir ateş teatisi yaşandı."
 news.333.e:0 "Kararlılıklarını kanıtladılar."
 news.333.t:0 "Mers-el-Kébir'de İngiliz Saldırısı"
 reinstate_nazi_leadership_TT:0 "Sadece faşist danışmanlar bir kez daha hizmete uygun hale gelir.\n"
 reject_second_united_front_tt:0 "§RBu seçeneği seçmek, İkinci Birleşik Cephe'nin oluşmayacağı anlamına gelir§!"
 wtt_britain.24.a:0 "Mükemmel bir fikir."
 wtt_britain.24.b:0 "Ödül, bedeline değmez."
 wtt_britain.24.d:0 "Mevcut savaşın İngiliz konvoyları üzerinde bir yük oluşturmasıyla birlikte, doğu komşularımız konvoy rotalarının koruyucu kapsamını genişletmeyi umdukları hava ve deniz üslerimizi kullanmak için giderek daha endişeli hale geldiler. Malcolm MacDonald adında bir İngiliz elçisi, Birleşik Krallık tarafında savaşa derhal girmemiz karşılığında Kuzey İrlanda'nın egemen İrlanda kontrolüne geri verilmesini teklif etmek için şimdi geldi."
 wtt_britain.24.t:0 "MacDonald Teklifi"
 wtt_britain.25.a:0 "Başka seçeneğimiz yok..."
 wtt_britain.25.b:0 "Filomuzu asla başka bir ulusun almasına izin vermeyeceğiz!"
 wtt_britain.25.d:0 "İngiliz filoları filomuzun ana limanlarının dışında belirdi ve donanmamızın derhal teslim olmasını talep eden bir ültimatom aldık. Gemilerimizi derhal İngiliz limanlarına yollamazsak, İngiliz amirali ateş açmakla tehdit etti."
 wtt_britain.25.t:0 "İngilizler Fransız Filosunu Talep Ediyor"
 wtt_britain.26.a:0 "En azından Almanların eline geçmesini engelledik."
 wtt_britain.26.d:0 "Fransızlar gemilerini limanlarımıza yollama konusunda akıllıca bir karar verdi. Artık Fransız filosunun tam kontrolüne sahibiz."
 wtt_britain.26.t:0 "Fransızlar Filoyu Teslim Etti"
 wtt_britain.27.a:0 "Fransız filosunun Alman çıkarlarına hizmet etmesine izin veremeyiz!"
 wtt_britain.27.b:0 "Bu çok tatsız. Geri çekilmeliyiz."
 wtt_britain.27.d:0 "Fransızlar taleplerimizi reddetti. Şimdi geri çekilmek ya da eski müttefiklerimize saldırmak gibi kıskanılmayacak bir seçimle karşı karşıyayız..."
 wtt_britain.27.t:0 "Fransızlar Ültimatomu Reddetti"
 wtt_britain.28.d:0 "İrlanda Hükûmeti teklifimizi kabul etti ve Kuzey İrlanda karşılığında davamıza katıldı."
 wtt_britain.28.t:0 "İrlanda MacDonald Teklifini Kabul Etti"
 wtt_britain.29.a:0 "Almanlar onlara geldiğinde onlara kim yardım edecek?"
 wtt_britain.29.d:0 "İrlanda Hükûmeti, Demokrasi için mücadelemize katılmayı reddederek teklifimizi geri çevirdi."
 wtt_britain.29.t:0 "İrlanda MacDonald Teklifini Reddetti"
 wtt_britain.30.a:0 "Bizi işgalden kurtardılar!"
 wtt_britain.30.d:0 "Amerikan hükûmeti, İngiliz Evlerini Savunma Amerikan Komitesi'nin lütufkâr desteğiyle, bize eski tüfekler, teçhizat ve bazı topçu parçalarından oluşan bir acil durum sevkiyatı gönderdi. Ordumuz için gerçek bir kullanım için çok çeşitli bir ürün yelpazesi, ancak şüphesiz Anavatan Muhafızları garnizonlarını aceleyle donatmada çok işe yarayacaklar."
 wtt_britain.30.t:0 "Amerikan Acil Silah Teslimatları"
 wtt_britain_lease_azores.1.a:0 "Bizi savaşa sürüklemekten daha iyi..."
 wtt_britain_lease_azores.1.b:0 "Bizim için faydası ne?"
 wtt_britain_lease_azores.1.desc:0 "[From.GetAdjective], savaş süresince Azorları kiralamak için bir taleple bize başvurdu. Adaların stratejik konumu, onları Atlantik boyunca deniz yollarını korumak için önemli bir üs haline getiriyor. Adalar, düşmanlıkların sona ermesinden sonra iade edilecektir."
 wtt_britain_lease_azores.1.t:0 "[From.GetNameDefCap] Azorları Kiralamayı Talep Ediyor"
 wtt_britain_lease_azores.2.a:0 "Bu faydalı olacak."
 wtt_britain_lease_azores.2.desc:0 "[From.GetAdjective] hükûmeti talebimizi onayladı ve şimdi onları herhangi bir saldırıya karşı savunmaktan sorumlu olduğumuz anlayışıyla bize Azorlar üzerinde tam kontrol verdi. Küçük bir öncü parti, bir operasyon üssü kurmak için adalara zaten ulaştı."
 wtt_britain_lease_azores.2.t:0 "[From.GetNameDefCap] Kabul Ediyor"
 wtt_britain_lease_azores.3.a:0 "Bunu hatırlayacağız."
 wtt_britain_lease_azores.3.desc:0 "Tarafsızlık ilanlarını ve savaş yasalarını gerekçe göstererek, [From.GetLeader] hükûmeti Azorlar'da üs hakları talebimizi reddetti. Onları bizim tarafımızda savaşa sokmanın bir yolunu bulamazsak, adalar bizim için kapalı kalır."
 wtt_britain_lease_azores.3.t:0 "[From.GetNameDefCap] Reddediyor"
 wtt_britain_lease_azores.4.a:0 "İngilizler her zaman borçlarını öder."
 wtt_britain_lease_azores.4.desc:0 "Avrupa'daki düşmanlıkların sona ermesiyle, [POR.GetAdjective] hükûmeti bize Azorlar'ın kiralanmasının sadece savaş süresince yapıldığını hatırlattı. Adalar üzerindeki kontrolü onlara geri verme zamanı geldi."
 wtt_britain_lease_azores.4.t:0 "Azor Kiralaması Sona Erdi"
 wtt_britain_lease_azores.5.a:0 "Mümkün olan en iyi sonuç."
 wtt_britain_lease_azores.5.desc:0 "Avrupa'daki savaşın sona ermesiyle, [From.GetNameDef] anlaşmamıza sadık kaldı ve Azorları bize geri verdi. Kontrolü geri almak için zaten bir grup yönetici gönderdik."
 wtt_britain_lease_azores.5.t:0 "Britanya Azorlardan Çekiliyor"
 wtt_burma_road.1.a:0 "Bu işleri hiç kolaylaştırmayacak."
 wtt_burma_road.1.desc:0 "[occupying_country.GetAdjective] kuvvetleri [state_occupied.GetName]'a saldırarak Burma yoluna ulaştı ve yolu birkaç yerden kesti. Bu yoldan bize daha fazla ikmal ulaşamaz."
 wtt_burma_road.1.t:0 "Burma Yolu kapandı"
 wtt_burma_road.2.desc:0 "[From.GetAdjective] Hükûmeti, Burma yolu üzerinden trafiğe artık izin vermemeye karar verdi. Yoldaki tüm konvoylar durduruldu ve geri dönmeleri emredildi. Bu yoldan bize daha fazla ikmal ulaşamaz."
 wtt_burma_road.2.desc_war_with_from:0 "[From.GetAdjective] kuvvetleri Burma yolunda hızla ilerledi ve birkaç hayati köprüyü ve geçidi aştı. Yol şimdi tüm trafiğe kapalı ve bu güzergahtan bize daha fazla ikmal ulaşamaz."
 wtt_burma_road.3.a:0 "İyi bir ilk adım."
 wtt_burma_road.3.desc:0 "Burma Yolu'nun büyük bir bölümünün başarılı bir şekilde geri alınmasının ardından, [From.GetAdjective] yetkilileri yol boyunca trafiğin yeniden başlamasına izin verdi. Düşman kuvvetlerinin kalıntıları yolculuğu eskisinden daha tehlikeli hale getirse de, ikmal yeniden akıyor."
 wtt_burma_road.3.t:0 "[From.GetNameDefCap] Burma Yolu'nun Bir Kısmını Yeniden Açtı"
 wtt_burma_road.4.a:0 "Çok ihtiyaç duyulan bir rahatlama."
 wtt_burma_road.4.desc:0 "Yeniden açılan Burma yolu üzerinden ilk ikmal konvoyu bugün Yunnan'a ulaştı. Trafiğin tekrar sorunsuz akması zaman alacak olsa da, ikmal bize yeniden ulaşıyor."
 wtt_burma_road.4.t:0 "[From.GetNameDefCap] Burma Yolu'nu Yeniden Açtı"
 wtt_china.1.a:0 "Birlikte güçlüyüz!"
 wtt_china.1.b:0 "Bırak denesinler."
 wtt_china.1.desc:0 "Görünüşe göre [From.GetLeader], otoritesini nihayet Çin'in uzak bölgelerine yaymaya karar verdi. Merkezi Hükûmetten bir temsilci geldi ve [From.GetLeader]'in emirlerine uymamızı ya da daha itaatkâr bir hükûmetle değiştirilmemizi talep ediyor."
 wtt_china.1.t:0 "[FROM.GetNameDefCap] Boyun Eğme Talep Ediyor"
 wtt_china.10.a:0 "Başka seçeneğimiz yok."
 wtt_china.10.b:0 "Savaşacağız!"
 wtt_china.10.desc:0 "[From.GetLeader] hükümeti, son birkaç ayda aldığımız ve [From.GetNameDef]'nin ulusal çıkarlarına aykırı olduğunu düşündükleri bir dizi politika kararına dikkat çekerek ateşli bir mesaj gönderdi. Politikalarımızı [From.GetAdjective] hükümetiyle daha uyumlu hale getirmediğimiz sürece, onlar \"gerekli gördükleri önlemleri\" alacaklar."
 wtt_china.10.t:0 "[FROM.GetName] Boyun Eğmeyi Talep Ediyor"
 wtt_china.11.a:0 "Harika!"
 wtt_china.11.desc:0 "[From.GetAdjective] hükûmeti notumuza yanıt verdi ve gelecekteki tüm kararlarda bize danışacaklarını vaat etti. [From.GetNameDef]'deki büyükelçimiz Özel Temsilciliğe terfi etti ve [From.GetAdjective]'lerin çok uzaklaşmamasını sağlamakla görevlendirildi."
 wtt_china.11.t:0 "[From.GetNameDefCap] Teslim Oldu"
 wtt_china.12.a:0 "Önlemler alınmalı."
 wtt_china.12.desc:0 "[From.GetNameDef]'ye gönderdiğimiz diplomatik nota görünüşe göre basına sızdırılmış ve basında şu anda kargaşa yaşanıyor. Uluslararası gazeteler bile, makul istişare taleplerimizi \"içişlerine karışmak\", \"tehlikeli bir emsal\" ve hatta \"çıplak emperyalizm\" olarak niteleyen çok olumsuz yazılar yazdılar. \n\nSöylemeye gerek yok ki, [From.GetAdjective] hükümeti konuyu daha fazla tartışmayı reddetti ve konunun tekrar gündeme getirilmesinin diplomatik temasların tamamen askıya alınmasına yol açacağını belirtti."
 wtt_china.12.t:0 "[From.GetNameDefCap] Meydan Okuyor"
 wtt_china.2.a:0 "İyi Adam."
 wtt_china.2.desc:0 "[From.GetLeader], elçiyi kişisel bir notla geri göndererek, emirlerimize kesinlikle uyacağını ve hükûmetimizle koordine olacağını vaat etti."
 wtt_china.2.t:0 "[From.GetLeader] Teslim Oldu"
 wtt_china.3.a:0 "Bunu göreceğiz."
 wtt_china.3.desc:0 "[From.GetLeader], Merkezi Hükûmetin bir eyalet valisini değiştirme yasal yetkisine sahip olmadığını iddia ederek notumuzu iade etti. Buna, birliklerinin savaşa hazır olma durumunu belirten ayrıntılı bir rapor eşlik ediyordu."
 wtt_china.3.t:0 "[From.GetLeader] Reddediyor"
 wtt_china_shared.1.a:0 "Yardımları fazlasıyla memnuniyetle karşılanır."
 wtt_china_shared.1.b:0 "Mevcut durumumuzdan oldukça memnunuz."
 wtt_china_shared.1.desc:0 "[From.GetLeader], durumumuzu görüşmek üzere başkentimize geldi. Bağımsızlık aktivistleri ve hükûmetle görüşerek, bağımsızlığımızın [From.GetNameDef]'in hayati bir ulusal çıkarı olduğunu belirtti ve daha fazla bağımsızlığa doğru herhangi bir girişimi desteklemeye istekli olduklarını söyledi."
 wtt_china_shared.1.t:0 "[From.GetNameDefCap] destek teklif ediyor"
 wtt_china_shared.10.a:0 "Onları elimizden gelen her şekilde desteklemeliyiz."
 wtt_china_shared.10.b:0 "Bu çatışmaya sürüklenmemize izin vermemeliyiz."
 wtt_china_shared.10.desc_a:0 "Çan Kay-Şek'in Eşi ve en güvendiği danışmanlarından biri olan Soong Mei-Ling, Japonya'ya karşı mücadelesinde Çin'e verilen desteğin artırılması için lobi yapmak üzere Washington'a gitti. Çin Hava Kuvvetlerinin modern uçaklara ve onları uçurmak için yetenekli pilotlara büyük ihtiyacı var.\n\nSoong'un çağrısı kamuoyunda yankı buldu ve bazı pilotlarımız, Çinli pilotlara \"Eğitim ve Öğretim\" sağlamak üzere bir Çinli şirkete kaydolmak için hizmetten istifa etti.\n\nSorunla birlikte Pilot sayısı çözüldüğünde, Soong Mei-Ling, en modern savaş uçaklarımızdan yaklaşık 150 tanesinin Çin Hava Kuvvetlerine yeniden donatılması için transfer edilmesine izin verilmesi talebiyle bize yaklaştı."
 wtt_china_shared.10.desc_b:0 "Çin'deki savaş Çin Hava Kuvvetleri'ni yıprattı. Rakipleri tarafından sayıca ve silah gücüyle geride bırakılanlar, Çin üzerindeki gökleri kontrol etmek için yiğitçe savaştılar. \n\nPilotlarının cesaretine rağmen, [From.GetAdjective] Hava Kuvvetleri kayıplarını telafi etmek için umutsuzca yeni uçaklar ve pilotlar arıyor. [From.GetLeader] tarafından gönderilen bir heyet, yaklaşık 150 modern avcı uçağının transferini ve benzer sayıda pilotun bu uçakları uçurmak için Çin'e gitmesine izin verilmesini müzakere etmek üzere Washington'a geldi."
 wtt_china_shared.10.t:0 "Uçan Kaplanlar"
 wtt_china_shared.11.a:0 "Onları elimizden gelen her şekilde desteklemeliyiz."
 wtt_china_shared.11.b:0 "Sahip olduklarıyla idare etmek zorunda kalacaklar."
 wtt_china_shared.11.desc_a:0 "Çin'deki devam eden çatışmalar, [From.GetAdjective] Kızıl Ordusu'ndaki yoldaşlarımıza hava desteği sağlama ihtiyacı yarattı. [From.GetLeader] bize pilot ve uçaklardan oluşan bir gönüllü grup gönderme konusunda başvurdu. Yaklaşık 50 bombardıman uçağı ve onlara eskortluk edecek 100 avcı uçağı talep ediyor. \n\nBu, pilotlarımız için faydalı bir deneyim sağlayabilir ve en yeni tasarımlarımızı eylemde test etmemize olanak tanıyabilir."
 wtt_china_shared.11.desc_b:0 "Çin'deki savaş devam ederken, [From.GetAdjective] Hava Kuvvetleri [From.GetNameDef] üzerindeki hava sahasını savunmaya ve savaşan birliklere hava desteği sağlamaya çalışırken zorlandı. [From.GetLeader], [SOV.GetLeader]'e yaklaşık 50 orta bombardıman uçağı ve 100 avcı uçağından oluşan birleşik bir kuvvet şeklinde destek göndermesi için kişisel bir çağrıda bulundu.\n\nBu, en modern teçhizatımızı muharebe koşullarında test etmek için faydalı bir fırsat olabilir."
 wtt_china_shared.11.t:0 "Sovyet Gönüllü Grubu"
 wtt_china_shared.12.a:0 "Joseph Stillwell'i Gönder"
 wtt_china_shared.12.b:0 "Kendi başlarının çaresine bakmak zorunda kalacaklar."
 wtt_china_shared.12.c:0 "Douglas MacArthur'u Gönder"
 wtt_china_shared.12.d:0 "Dwight Eisenhower'ı Gönder"
 wtt_china_shared.12.desc:0 "[From.GetLeader], [USA.GetLeader]'e bir mektup göndererek, Generallerimizden birini [From.GetAdjective] Ordusu için bir Kurmay Başkanı olarak hizmet etmesi için göndermemizi önerdi. \n\nBunu yapmak bize [From.GetLeader]'in kişisel minnettarlığını kazandıracak ve generalimiz için değerli bir deneyim sağlayabileceği gibi, [From.GetLeader]'in kuvvetlerinin savaşı kazanmasına da yardımcı olabilir.\n\nGenerallerimizden hangisini göndermeliyiz?"
 wtt_china_shared.12.t:0 "[From.GetNameDef] için yeni bir general"
 wtt_china_shared.13.a:0 "Değerli bir katkı."
 wtt_china_shared.13.desc:0 "[From.GetLeader] yardım talebimizi kabul etti ve [CHI_USA_General.GetName]'e en kısa sürede Çin'de göreve başlamasını emretti.\n\nGeneralin sadece [Root.GetLeader]'e bir danışman olması değil, aynı zamanda sahada birlikleri komuta etmesi ve ona modern bir savaşta savaşma konusunda ilk elden deneyim kazandırması bekleniyor."
 wtt_china_shared.13.t:0 "[CHI_USA_General.GetName] Çin'e Geliyor"
 wtt_china_shared.14.a:0 "Onlar korkak mı, aptal mı, yoksa her ikisi de mi?"
 wtt_china_shared.14.desc:0 "[From.GetLeader]'e yaptığımız talep sağır kulaklara düştü. ABD Ordusu'ndaki birkaç üst düzey subay görevi üstlenmeye istekli olduklarını belirtse de, Savaş Bakanı ve Başkan [From.GetLeader] her ikisi de fikri pratik olmadığı ve ulusal çıkarlara uygun olmadığı gerekçesiyle veto etti."
 wtt_china_shared.14.t:0 "[From.GetNameDef]'den yardım yok"
 wtt_china_shared.2.a:0 "Onların mücadelesi bizim mücadelemizdir."
 wtt_china_shared.2.desc:0 "Özel bir görüşmede [From.GetNameDef] hükümet yetkilileri bağımsız bir devleti desteklemek için neler yapabileceğimize büyük ilgi duyduklarını ifade ettiler. Daha fazla bağımsızlığı savunan gruplar için fonlar sağlandı ve \"Sürgündeki Geçici Özgür [From.GetAdjective] Hükümeti\" örgütlemeye başladık."
 wtt_china_shared.2.t:0 "[From.GetNameDefCap] desteğimizi kabul ediyor"
 wtt_china_shared.3.a:0 "Yazık."
 wtt_china_shared.3.desc:0 "Sert bir notla, [From.GetLeader] bize hükûmetinin [From.GetAdjective] iç işlerine herhangi bir müdahaleye müsamaha göstermeyeceğini bildirdi. Diplomatik protokol, [From.From.GetLeader]'i istenmeyen kişi ilan etmeyi ve girişi yasaklamayı yasaklar, ancak bunun yerine pratik olarak tüm delegasyonumuzun [From.GetNameDef]'e geri dönmesi yasaklandı."
 wtt_china_shared.3.t:0 "[From.GetNameDefCap] desteğimizi reddediyor"
 wtt_china_shared.4.a:0 "Rahatsız edici."
 wtt_china_shared.4.desc:0 "Görünüşe göre [From.From.GetLeader]'in [From.GetNameDef]'e son ziyareti sadece çay eşliğinde nezaket alışverişi değildi. Son zamanlarda, ülkedeki daha önce ayrı ve bölünmüş bağımsızlık hareketleri çok daha iyi bir şekilde koordine olmaya başladı. Neredeyse birinin onlara yurtdışından organize olmalarına yardım ediyor gibi görünüyor."
 wtt_china_shared.4.t:0 "[From.GetNameDef]'de bağımsızlık hareketi güçleniyor"
 wtt_denmark.1.a:0 "Onlara bol şans."
 wtt_denmark.1.d:0 "İşgal sonrası temasın kesilmesiyle, İzlanda Parlamentosu ulusun kendi dış işlerinin kontrolünü ele aldı. Bunun, işgalin sonuna kadar geçici bir önlem olduğu anlaşılıyor."
 wtt_denmark.1.t:0 "İzlanda'nın Bağımsızlığı"
 wtt_germany.1.a:0 "Bu Nazi pisliğini topraklarımızdan temizleyin!"
 wtt_germany.1.d:0 "Hitler'in yönetimine karşı gizli hoşnutsuzluk, yönetimin Renanya'yı yeniden askerileştirme hamlesinin neden olduğu mevcut krizle doruğa ulaştı. Bir dizi Wehrmacht generali, Hitler'i devirmeyi ve Nazi partisini Almanya'dan çıkarmayı amaçlayan planları harekete geçiren tanınmış Mareşal August von Mackensen'in arkasında toplandı.\n\nAlman yüksek komutasındaki bölünme yurtdışında bile açıkça ortaya çıkınca, yabancı güçler büyüyen iç Alman istikrarsızlığıyla daha fazla ilgilenerek yeniden askerileştirmeye karşı protesto etmemeyi seçti. Yaşlanan Mareşal hızla hareket etti, şimdiden Nazi hükûmetine karşı muhalefetlerinde akın akın gelenlerin olduğu geçici bir hükûmet kurdu.\n\nAskerî darbe zaten yolunda ilerliyor."
 wtt_germany.1.t:0 "Wehrmacht Subayları Hitler'e Meydan Okuyor"
 wtt_germany.10.a:0 "Ne talihsizlik."
 wtt_germany.10.d:0 "Temas kurduğumuz İtalyan hükûmeti ve yeraltı unsurları, pek de nazik olmayan bir dille, darbe teklifimizle ilgilenmediklerini söylediler. Eğer aynı teklifi bir daha yapmaya cüret edersek, planlarımızı İtalyan hükûmetine ifşa etmekle tehdit ettiler."
 wtt_germany.10.t:0 "İtalyanlar Darbe Teklifini Reddetti"
 wtt_germany.1000.a:0 "Mükemmel bir fikir! Bir irtibat görevlisi göndereceğiz."
 wtt_germany.1000.a_tt:0 "Prenses Victoria Louise, bu görkemli törenin hazırlıklarına yardımcı olmak için önden gönderildi. Bu, hükûmetimizin kaynaklarını bir miktar zorlayacaktır. Umarım kraliyet ailesinin geri kalanı [ENG.GetNameDef]'e tek parça halinde ulaşabilir...\n"
 wtt_germany.1000.b:0 "Mükemmel bir fikir! Hep birlikte seyahat edeceğiz."
 wtt_germany.1000.b_tt:0 "Tüm genişletilmiş kraliyet ailesi, törene Hindenburg ile seyahat edecek. Bu, İmparatorluk Ailesi'nin müttefiklerimizin ve halkımızın gözündeki prestijini artıracak, hükûmetimizin konumunu güçlendirecektir.\n"
 wtt_germany.1000.desc:0 "[From.GetAdjective] hükûmeti, Alman kraliyet ve prens ailelerine İngiliz soyluluk ve kraliyet unvanlarının iadesi talebimizi desteklemeye karar verdi. Tüm Alman kraliyet ailesinin, yirmi yıl önce haksız yere alınan unvanları kişisel olarak geri almak üzere davet edildiği görkemli bir 'yüzyılın kraliyet töreni' teklif ediyorlar.\n\nİmparatorluk danışmanları tarafından, tüm genişletilmiş kraliyet ailesinin Alman teknolojisinin zirvesini kullanarak görkemli bir giriş yapması önerilmektedir. Son teknoloji Hindenburg zeplini bu duruma mükemmel bir şekilde uyacaktır."
 wtt_germany.1000.t:0 "[From.GetAdjective] Hükûmeti Talebi Kabul Etti"
 wtt_germany.1001.a:0 "Kayzer öldü... Çok yaşa Kaiserin!"
 wtt_germany.1001.desc:0 "Korkunç bir trajedide, Hindenburg bugün Londra'da yanaşmaya çalışırken imha oldu. Henüz belirlenemeyen nedenlerle, zeplin alevler içinde kaldı ve yere çakıldı, neredeyse tüm genişletilmiş Alman İmparatorluk Ailesi de dahil olmak üzere tüm yolcu ve mürettebatın hayatını aldı.\n\nTek hayatta kalan, törenin hazırlıklarına yardımcı olmak için önden gönderilen Prenses Victoria Louise'dir. Babaannesi Alman İmparatoriçesi Victoria ve büyük-büyükannesi Kraliçe Victoria'dan sonra 'Victoria' adını taşıyan üçüncü prenses olan Prenses, bu nedenle tahtın tek kalan varisi oldu. Ailesini kaybetmenin şokunu hala üzerinden atamamış olmasına rağmen, şimdi yine de Alman İmparatorluğu'nun Kaiserin'i olarak I. Victoria adıyla tahta çıktı."
 wtt_germany.1001.t:0 "Hindenburg Londra'da Alev Aldı"
 wtt_germany.1002.a:0 "Ne korkunç bir trajedi!"
 wtt_germany.1002.desc:0 "Korkunç bir trajedide, Hindenburg bugün Londra'da yanaşmaya çalışırken imha oldu. Henüz belirlenemeyen nedenlerle, zeplin alevler içinde kaldı ve yere çakıldı, tüm genişletilmiş Alman İmparatorluk Ailesi de dahil olmak üzere tüm yolcu ve mürettebatın hayatını aldı.\n\nİmparatorluk Ailesi'nin tamamen yok olmasıyla, hükûmet doğrudan kontrolü ele aldı, ancak bunun kısa vadede demokrasiye bir dönüş sağlayacağı pek olası görünmüyor."
 wtt_germany.1003.a:0 "Bu çok talihsiz..."
 wtt_germany.1003.desc:0 "[From.GetAdjective] hükûmeti, parlamentoda uzun bir oturumdan sonra, Alman kraliyet ve prens ailelerine İngiliz soyluluk ve kraliyet unvanlarının iadesi talebimizi reddetmeye karar verdi."
 wtt_germany.1003.t:0 "[From.GetAdjective] Hükûmeti Talebi Reddetti"
 wtt_germany.1006.a:0 "Banda Carità onlarla başa çıkabilir"
 wtt_germany.1006.desc:0 "Servizio Informatzione Militaire, monarşist iç çevrelerde şüpheli faaliyetler bildirdi. Görünüşe göre sadece krala sadık olanlardan bazıları son zamanlarda yabancı ajanlarla, hem de Alman olanlarla temas halindeydi. Görünüşe göre monarşistler, büyük liderimize karşı çıkmak için işe alınıp toplanıyorlar, ancak her şey bitmiş değil. Onlarla ilgilenmek için çeteleri gönderebilir ve hala bir şansımız varken onları geri püskürtebiliriz. Nasıl ilerlemeliyiz?"
 wtt_germany.1006.t:0 "Kayzer bir darbe hazırlıyor!"
 wtt_germany.11.a:0 "Minnettarlığımızı göstermeliyiz."
 wtt_germany.11.d:0 "Alman planı eyleme geçirildi ve Mussolini bugün Roma sokaklarında arabasında vuruldu. Kral III. Vittorio Emanuele ulusun dizginlerini eline aldı ve [From.GetNameDef] ile birlikte Merkezî Güçlere katılma sözü verdi."
 wtt_germany.11.t:0 "Mussolini'nin Almanlarca Suikastı"
 wtt_germany.12.a:0 "Monarşiler yeniden yükselecek!"
 wtt_germany.12.d:0 "Planımız kusursuz bir şekilde uygulandı ve III. Vittorio Emanuele ulusunun liderlik mantosunu devraldı. İlk icraatı, İtalya'nın Merkezî Güçler ittifakına girişini sağlayan bir antlaşma imzalamak oldu."
 wtt_germany.12.t:0 "Mussolini Suikastı Başarılı Oldu"
 wtt_germany.13.a:0 "Eski müttefikimiz yanımıza geri döndü."
 wtt_germany.13.d:0 "Desteğimizle, [From.GetOldName] Avusturya-Macaristan imparatorluğunun yeniden birleşmesinde liderliği üstlendi. İlgili taraflar arasında bu sabah imzalanan antlaşmalar, yirmi yıllık ayrılıkçı duyarlılığı ortadan kaldırdı. Yeni birleşik hükûmet derhal davamıza askerî desteklerini taahhüt ederek Merkezî Güçler'in bir üyesi oldu."
 wtt_germany.13.t:0 "Avusturya-Macaristan'ın Yeniden Birleşmesi"
 wtt_germany.14.a:0 "Askerî güçleri bize topraktan daha faydalı."
 wtt_germany.14.b:0 "Topraklarımızdan asla vazgeçmeyeceğiz!"
 wtt_germany.14.d:0 "[From.GetNameDefCap] bize her iki tarafın da yararına olacağını söyledikleri bir teklifle yaklaştı. Mevcut siyasi durum ve Doğu sınırımızdaki tehdit ışığında, Almanlar [SOV.GetNameDef] ile savaşa girmemiz durumunda bize askerî yardımda bulunacaklarına dair bir garanti vermeyi teklif ediyorlar. Karşılığında, sadece kayıp toprakları olan Danzig ve Poznan'ın iadesini istiyorlar."
 wtt_germany.14.t:0 "Almanya Toprak Garantisi Teklif Ediyor"
 wtt_germany.15.a:0 "Bu Versay belası nihayet ortadan kalktı!"
 wtt_germany.15.d:0 "Polonyalılar teklifimizi kabul etmeye karar verdiler ve sınır illerini bize devretmek için düzenlemeler yaptılar. Bize güvendiler ve [SOV.GetAdjective] saldırganlığı durumunda hazır olmamızı istiyorlar."
 wtt_germany.15.t:0 "Polonya Teklifi Kabul Etti"
 wtt_germany.16.a:0 "Taleplerimizden asla vazgeçmeyeceğiz!"
 wtt_germany.16.b:0 "Belki de bununla yüzleşmeliyiz."
 wtt_germany.16.d:0 "Polonyalılar teklifimizi reddetmeye karar verdiler. Güçlü bir dille, topraklarından asla gönüllü olarak vazgeçmeyeceklerini ve yardımın bedeli buysa herhangi bir düşmanla tek başlarına yüzleşmeyi tercih edeceklerini açıkça belirttiler."
 wtt_germany.16.t:0 "Polonya Teklifi Reddetti"
 wtt_germany.17.a:0 "Umarım bu ülkeyi çok fazla istikrarsızlaştırmaz..."
 wtt_germany.17.b:0 "Polis fonlarını artırın ve siyasetimiz üzerindeki etkilerini sınırlayın!"
 wtt_germany.17.d:0 "Alman hükûmeti komünizme karşı sert önlemler aldı ve onları yurtdışına sürdü. Sonuç olarak şimdi komşumuzdan büyük bir komünist ideolog akını alıyoruz..."
 wtt_germany.17.t:0 "Alman Komünistler Fransa'ya Kaçıyor"
 wtt_germany.18.a:0 "Asın onları!"
 wtt_germany.18.b:0 "Onları ömür boyu hapsedin, gelecekte işe yarayabilirler."
 wtt_germany.18.d:0 "Nihayet ülkemizi düşmanlarımızın pençesinden kurtardık ve davamızı desteklemek için ayaklanan sadık vatandaşlarımız şimdi nihayet evlerine dönebilirler. Bir ulus olarak, ulusumuzu yeniden inşa etmenin uzun ve zorlu sürecine başlayabiliriz. Ülkenin liderliği ise, gelecekte ne olabileceğine bakmaya başlamakta özgürdür: demokrasi veya eski monarşiye bir dönüş.\n\nAncak, halledilmesi gereken son bir şey var. İç savaşın sona ermesiyle, birliklerimiz Nazi liderliğinin büyük bir grubunu ele geçirmeyi başardı. Şimdi, sadece yakın tarihimizin bu sevimsiz kısmıyla ne yapacağımıza karar vermek kalıyor."
 wtt_germany.18.t:0 "Nazi Liderliği Ele Geçirildi"
 wtt_germany.19.a:0 "Hepsini korkutmak için bir dizi devasa askerî tatbikat başlatın!"
 wtt_germany.19.b:0 "İtibarımızı kurtarmalı ve ilişkileri düzeltmeliyiz."
 wtt_germany.19.c:0 "Bizim hakkımızda ne dediklerini umursadığımızı mı sanıyorlar?"
 wtt_germany.19.d:0 "Son zamanlarda bize yönelik Alman söylemi, Avrupa'daki itibarımıza giderek daha fazla zarar vermeye başladı. Sözde 'saldırganlığımız' hakkındaki iftira niteliğindeki suçlamalar, niyetlerimiz hakkında korku ve yanlış anlaşılmalara neden olmaya başlıyor."
 wtt_germany.19.t:0 "[GER.GetName], [SOV.GetName]'a Karşı Konuştu"
 wtt_germany.2.d:0 "Anavatanlarındaki son sert muamele ve zorunlu sürgünden sonra, yerinden edilmiş birçok Alman yoldaşımız çevremize akın etti. Biraz liderlikle, bu hevesli acemilerden bir dizi tümen oluşturmayı başardık ve şimdi düşmanlarımızla savaşmaya hazırlar!"
 wtt_germany.2.t:0 "Alman Gurbetçiler Davaya Katılıyor"
 wtt_germany.20.a:0 "Nüfuz alanımızdan uzak dursalar iyi olur!"
 wtt_germany.20.b:0 "Onlara daha fazla tırmanmak için herhangi bir bahane vermemeliyiz."
 wtt_germany.20.d:0 "Bize karşı iftira kampanyalarına devam eden Almanlar, şimdi yeni bir ittifakın kurulduğunu duyurdular. Bunun bize karşı hedeflendiği ve nüfuz alanımıza müdahale etmeyi amaçladıkları konusunda çok az şüphe var."
 wtt_germany.20.t:0 "Almanya Orta Avrupa İttifakı Kuruyor"
 wtt_germany.21.a:0 "Geri kalanını güvence altına almak için saldırmalıyız!"
 wtt_germany.21.b:0 "Batı'yı karşımıza almayı göze alamayız."
 wtt_germany.21.d:0 "Almanlar, acil nüfuz alanımızdaki bir ulusa üyelik teklif ettiler. Anavatana yönelik tehdit açıktır!"
 wtt_germany.21.t:0 "Almanlar Baltıkları Davet Ediyor"
 wtt_germany.22.t:0 "Almanlar Polonya'yı Davet Ediyor"
 wtt_germany.23.t:0 "Almanlar Finlandiya'yı Davet Ediyor"
 wtt_germany.24.a:0 "Umarım haklıdırlar."
 wtt_germany.24.b:0 "Asla bir [GER.GetAdjective]'ye güvenme!"
 wtt_germany.24.d:0 "Hem resmî hem de gayriresmî kanallar aracılığıyla Almanlar, [GER.GetGreatRedMenaceEventDesc1] olduğunu açıkça belirttiler. Bize, [GER.GetGreatRedMenaceEventDesc2]'e katlanmakta yalnız olmadığımızı ve eğer kıta birleşirse Ayı'yı yenebileceğimizi hatırlattılar."
 wtt_germany.24.t:0 "Büyük [GER.GetGreatRedMenaceName] Tehdidi"
 wtt_germany.25.a:0 "Bunu zaman gösterecek."
 wtt_germany.25.d:0 "Sovyetler Birliği, Avrupa uluslarının endişelerini gidermek için ortak bir çaba gösterdi. Kamuoyuna yaptıkları bir duyuruyla, herhangi bir düşmanca niyetleri olmadığını iddia ettiler ve saldırgan Alman söylemine karşı gösterdikleri ölçülü tepkinin kendileri adına konuşacağını umuyorlar."
 wtt_germany.25.t:0 "Sovyetler Birliği İlişkileri Düzeltiyor"
 wtt_germany.26.a:0 "Çok yaşa Kayzer!"
 wtt_germany.26.d:0 "Dün gece sevgili Kayzerimiz II. Wilhelm, uykusunda huzur içinde vefat etti. Uzun sürgününe rağmen, kader ölümünden çok önce anavatanına dönmesine izin vermişti ve döndüğünden beri ulusumuzu iyi yönetmişti. Oğlu Friedrich Wilhelm şimdi ulusun dizginlerini eline aldı ve taç giyme töreninden sonra III. Wilhelm olarak bilinecek."
 wtt_germany.26.t:0 "II. Wilhelm Öldü"
 wtt_germany.27.d:0 "Dün gece en saygın mareşalimiz August von Mackensen, uykusunda huzur içinde vefat etti. Büyük Savaş'taki ve faşist zalimi anavatanımızdan kovmadaki kutlanan başarıları uzun süre hatırlanacak. Sürgündeki Kayzer'in oğlu Friedrich Wilhelm, ulusun güç boşluğunu doldurdu ve taç giyme töreninden sonra III. Wilhelm olarak bilinecek ve 1918'de babasının tahttan çekilmesinden bu yana ilk Kayzer olarak İmparatorluğu yönetecek."
 wtt_germany.27.t:0 "August Von Mackensen Öldü"
 wtt_germany.28.d:0 "Alman İmparatorluğu, II. Wilhelm'in sürgününü kaldırdı ve şimdi Hollanda'ya eski Kayzer'in iadesi için başvurdu. Hollanda hükûmetine onu Büyük Savaş'ı başlatmaktan sorumlu tutmak için yapılan çok sayıda iade başvurusuna rağmen, savaş kışkırtıcısı Alman İmparatorluğu'nun dizginlerini ele almak için geri dönecek gibi görünüyor."
 wtt_germany.28.d.2:0 "Alman İmparatorluğu, II. Wilhelm'in sürgününü kaldırdı ve şimdi Hollanda'ya eski Kayzer'in iadesi için başvurdu. Hollanda'nın geri dönmesine izin vermeyi reddetmesi karşısında, şimdi bunu bir askerî çatışmaya tırmandırdılar!"
 wtt_germany.28.t:0 "Almanya II. Wilhelm'in Sürgününü Kaldırdı"
 wtt_germany.29.d:0 "Alman İmparatorluğu, II. Wilhelm'in sürgününü kaldırdı ve şimdi Hollanda'ya eski Kayzer'in iadesi için başvurdu. Hollanda hükûmetine onu Büyük Savaş'ı başlatmaktan sorumlu tutmak için yapılan çok sayıda iade başvurusuna rağmen, savaş kışkırtıcısı Alman İmparatorluğu'nun dizginlerini ele almak için geri dönecek gibi görünüyor.\n\nFransızlar bunun kabul edilemez olduğuna zaten karar verdiler ve askerî güçle desteklenen bir ültimatom verme niyetinde görünüyorlar. İngiltere'de kamuoyu bir savaşa karşı, ancak Fransızların yanında durmazsak onlarla olan ittifakımız dağılacak."
 wtt_germany.29.d.2:0 "Alman İmparatorluğu, II. Wilhelm'in sürgününü kaldırdı ve şimdi Hollanda'ya eski Kayzer'in iadesi için başvurdu. Hollanda'nın geri dönmesine izin vermeyi reddetmesi karşısında, şimdi bunu bir askerî çatışmaya tırmandırdılar!\n\nFransızlar bunun kabul edilemez olduğuna zaten karar verdiler ve askerî güçle desteklenen bir ültimatom verme niyetinde görünüyorlar. İngiltere'de kamuoyu bir savaşa karşı, ancak Fransızların yanında durmazsak onlarla olan ittifakımız dağılacak."
 wtt_germany.3.a:0 "Onun geri dönmesine ve halkını yönetmesine izin vermeliyiz."
 wtt_germany.3.b:0 "Onu durdurmalıyız - başka bir Büyük Savaş riskini göze alamayız."
 wtt_germany.3.d:0 "Almanya, II. Wilhelm'i Kayzer olarak anavatanına dönmeye davet etti. Son çalkantılı olaylarla birlikte, bu Almanların uluslarına barış ve istikrar getirmelerine yardımcı olabilir. Ancak dünyanın gözü üzerimizde, çünkü birçoğu eski Kayzer'in bizi sadece yirmi yıl önce içine sürüklediği korkunç çatışmayı unutmadı."
 wtt_germany.3.t:0 "Almanya II. Wilhelm'in Sürgününü Kaldırdı"
 wtt_germany.30.d:0 "Alman İmparatorluğu, II. Wilhelm'in sürgününü kaldırdı ve şimdi Hollanda'ya eski Kayzer'in iadesi için başvurdu. Hollanda hükûmetine onu Büyük Savaş'ı başlatmaktan sorumlu tutmak için yapılan çok sayıda iade başvurusuna rağmen, savaş kışkırtıcısı Alman İmparatorluğu'nun dizginlerini ele almak için geri dönecek gibi görünüyor.\n\nFransızlar bu rezalete tepkilerini diplomatik itirazlarla sınırlamaktan memnun görünüyorlar ve İngiltere'de kamuoyu kesinlikle bir savaşa karşı."
 wtt_germany.31.d:0 "İngilizler, Alman monarşisi meselesinin bir iç mesele olduğunu iddia ederek Almanya'ya karşı bizi desteklemeyi reddediyorlar. Almanlarla savaşa girersek, görünüşe göre yalnız kalacağız.\n\nFransa'da kamuoyu bir savaşa karşı, ama Almanya sadece güçlenecek ve Kayzer'in dönüşü yenilenmiş emperyalist duyguları ortaya çıkarabilir. İngiltere yanımızda olmadan bir ültimatom vermek daha az tehditkar olur. Onlara karşı tek başımıza ilerlemeli miyiz?"
 wtt_germany.32.d:0 "İngiltere'de bir savaş için halk desteği eksik olmasına rağmen, İngiliz hükûmeti Almanların oluşturduğu tehdidi kabul etti ve bize tam desteklerini sundular. Savaş kışkırtıcısı Kayzer'in geri dönmesini önlemek için Almanya'ya son bir ültimatom vereceğiz. Eğer reddederlerse, kuvvetlerimizin Almanya'nın derinliklerine ilerlemesi ve onların tiran rejimine son vermesi zamanı geldi!"
 wtt_germany.33.a:0 "Geri adım atamayız! Çok yaşa Kayzer!"
 wtt_germany.33.d:0 "İngilizler ve Fransızlar, Kayzerimizin dönüşünü kabul etmeyi reddettiler ve Büyük Savaş'ın sözde kışkırtıcısının tahtına dönmesine izin verilmesinin bir 'rezalet' olduğunu söylediler. Kuvvetlerini bize karşı seferber ediyorlar ve kuvvetlerimizin derhal geri çekilmesi ve Kayzer'i sürgününe geri göndermemiz, aksi takdirde uluslarımızın savaşta olacağı yönünde bir ültimatom verdiler."
 wtt_germany.34.d:0 "İngilizler aklını başına topladı ve Kayzer'in dönüşünü kabul etti, ama çılgın Fransızlar geri adım atmayı reddediyor! Bu olayın uluslarının güvenliğine doğrudan bir tehdit oluşturduğunu iddia ederek, kuvvetlerini seferber ediyorlar ve her an sınırdan içeri dalabilirler! Savaştayız!"
 wtt_germany.35.d:0 "II. Wilhelm'in Alman tahtına dönüşünün bir savaş eylemi olarak görüleceğini açıklamamıza rağmen, Almanya uyarımızı görmezden gelerek geri adım atmayı ve Kayzerlerini sürgüne geri göndermeyi reddetti. Bu, barışı korumak için gösterdiğimiz en iyi çabalara rağmen, Avrupa'da bir kez daha savaşın patlak verdiği anlamına geliyor."
 wtt_germany.38.a:0 "Karşılığında Von Falkenhausen'in devam eden desteğini talep et."
 wtt_germany.38.b:0 "Belki de bölgede olmaları faydalı olur."
 wtt_germany.38.c:0 "Egemen toprağımızdan bir daha asla vazgeçmeyeceğiz!"
 wtt_germany.38.desc:0 "[FROM.GetNameDefCap] son zamanlarda giderek daha fazla söylemde bulunarak sömürgeciliğe geri dönülmesini istiyor. Şimdi, diplomatik kanallar aracılığıyla, uzun süredir kayıp olan imparatorluklarını geri kazanma umuduyla Qingdao'daki eski yerleşim bölgelerinin kiralanmasının yeniden başlatılması için resmi bir talepte bulundular. Utanç çağımızda potansiyel olarak bir başka eşitsiz antlaşma olsa da, belki de bunu kazançlı bir düzenlemeye varmak için kullanabiliriz..."
 wtt_germany.38.t:0 "[FROM.GetAdjective]ler Qingdao'nun Geri Verilmesini Talep Ediyor"
 wtt_germany.39.a:0 "Bunu kabul edebiliriz."
 wtt_germany.39.b:0 "Hayır, seçeneklerimizi açık tutmalıyız."
 wtt_germany.39.desc:0 "Çinli yetkililer, her iki tarafı da tatmin edeceğini söyledikleri potansiyel bir takas teklifiyle bize ulaştılar. Qingdao'yu haklı Alman ellerine iade etmeyi, karşılığında Von Falkenhausen'in misyonunu geri çekmeyeceğimize dair bir garanti vermeyi teklif ediyorlar."
 wtt_germany.39.t:0 "Çin Qingdao Ticareti Teklif Ediyor"
 wtt_germany.4.a:0 "Şüphesiz ulusu iyi yönetecektir."
 wtt_germany.4.d:0 "Coşkulu kutlamaların ortasında, II. Wilhelm Almanya İmparatorluğu'na Kayzer olarak geri döndü! Hollanda'ya bu son on yıllarda ona güvenli bir sığınak sağladığı ve eski düşmanlarımıza iadesini defalarca reddettiği için bir şükran borcu var. Ulus son iç savaşta çok acı çekmiş olsa da, Kayzer'in dönüşünün daha fazla istikrar ve birlik getirmesi umuluyor."
 wtt_germany.4.t:0 "Kayzer Almanya'ya Geri Döndü"
 wtt_germany.40.a:0 "Sabırlı olabiliriz."
 wtt_germany.40.desc:0 "[From.GetNameDefCap] Qingdao'nun iadesi taleplerimizi tamamen reddetti. Daha sonraki bir tarihte iadesini istemekten başka seçeneğimiz kalmayacak."
 wtt_germany.40.t:0 "[From.GetNameDefCap] Qingdao Talebini Reddetti"
 wtt_germany.41.desc:0 "Alman İmparatorluğu, Qingdao için takas teklifimizi kabul etti. Von Falkenhausen'in devam eden desteğini bize garanti ettiler."
 wtt_germany.41.t:0 "Almanya Qingdao Ticaretini Kabul Etti"
 wtt_germany.42.desc:0 "Alman İmparatorluğu, Qingdao için takas teklifimizi reddetti. Yerleşim bölgelerini çok da istememiş olmalılar."
 wtt_germany.42.t:0 "Almanya Qingdao Ticaretini Reddetti"
 wtt_germany.43.a:0 "Karşılığında Almanların Von Falkenhausen'i geri çekmesini talep et."
 wtt_germany.43.b:0 "Bir daha asla Uzak Doğu'ya ayak basamayacaklar!"
 wtt_germany.43.desc:0 "Alman İmparatorluğu son zamanlarda giderek daha fazla söylemde bulunarak sömürgeciliğe geri dönülmesini istiyor. Qingdao'yu kaybetme şekillerinin doğasına rağmen - 1914'te bizim ele geçirmemiz - Almanlar şimdi diplomatik müzakereleri açmaya karar verdiler ve Qingdao'daki eski yerleşim bölgelerinin iadesini talep ediyorlar. Belki de bunu kazançlı bir düzenlemeye varmak için kullanabiliriz..."
 wtt_germany.43.t:0 "Almanlar Qingdao'nun Geri Verilmesini Talep Ediyor"
 wtt_germany.44.desc:0 "Japon yetkililer, her iki tarafı da tatmin edeceğini söyledikleri potansiyel bir takas teklifiyle bize ulaştılar. Qingdao'yu haklı Alman ellerine iade etmeyi, karşılığında Von Falkenhausen'in Çin'deki misyonunun derhal geri çekilmesini teklif ediyorlar."
 wtt_germany.44.t:0 "Japonya Qingdao Ticareti Teklif Ediyor"
 wtt_germany.46.desc:0 "Alman İmparatorluğu, Qingdao için takas teklifimizi kabul etti. Von Falkenhausen'in Çin'deki misyonunu derhal geri çektiler."
 wtt_germany.48.desc:0 "[From.GetNameDefCap] taleplerimizi kabul etti ve Qingdao'nun derhal Alman ellerine iadesi için düzenlemeler yaptı!"
 wtt_germany.48.t:0 "[From.GetNameDefCap] Talepleri Kabul Etti"
 wtt_germany.49.a:0 "Anavatanımızı onlardan kurtarmak için küçük bir bedel."
 wtt_germany.49.desc:0 "Nihayet [nazi_state_withdrawn.GetName] üzerinde kontrolü sağlamayı başardık, ancak çatışmalar şiddetliydi. Naziler ilerledikçe daha da fanatik ve çaresiz hale geliyor, genellikle çevredeki alan harabeye dönene kadar savaşıyorlar. Hitler'in 'Nerobefehl'i uyarınca yakıp yıkma taktikleri raporları da var.\n\nBu savaşı bitirene kadar şüphesiz bu ölçekte daha fazla yıkım bekleyebiliriz."
 wtt_germany.49.t:0 "Nazi Sürgünü [nazi_state_withdrawn.GetName]'a Ağır Darbe Vurdu"
 wtt_germany.5.a:0 "Onlara daha acil endişeler vereceğiz!"
 wtt_germany.5.b:0 "Belki de bir bildikleri vardır... Başka adaylarımız var."
 wtt_germany.5.d:0 "Uzun zamandır II. Wilhelm'e asilce sığınak sunan alçak Hollanda, şimdi Kayzer'in Almanya'ya sınırı geçme girişimlerini engelledi ve onu ikametgahı olan Huis Doorn'a geri götürdü. Hollandalılar, Kayzer'in Alman tahtına geri dönmesine izin verilmesi durumunda kıtanın istikrarı için endişelerini gerekçe gösteriyor."
 wtt_germany.5.t:0 "Hollanda Kayzer'in Dönüşünü Engelliyor"
 wtt_germany.50.a:0 "Bu, Naziler için sonun başlangıcıdır."
 wtt_germany.50.desc:0 "Berlin'in ele geçirilmesiyle, birliklerimiz şehirdeki bir sığınakta Hitler'in cesedini keşfetti. Ülkenin anti-faşist unsurların eline geçmesini görmektense ölümü seçen lider, görünüşe göre yakalanma riskini göze almak yerine kendi canına kıydı.\n\nOnun yerine, Heinrich Himmler şimdi Nazileri yönetmek için öne çıktı ve hükûmetin 'Alman karşıtı ihanete' karşı mücadelelerinde taviz vermeyeceğini zaten doğruladı."
 wtt_germany.50.t:0 "Hitler Ölü Bulundu"
 wtt_germany.51.a:0 "Evet, Nazi liderliğini kısmen yeniden göreve getir."
 wtt_germany.51.b:0 "Hayır, oldukları yerde iyiler."
 wtt_germany.51.c:0 "Savaş kötü giderse özgürlüklerini geri kazanmalarına izin veremeyiz... Asın onları!"
 wtt_germany.51.desc:0 "Savaş o kadar uzadı ve yıkıcı hale geldi ki, şimdi tüm yetişkin Almanlar hizmete çağrıldı. İdeolojik görüşlerimize uymasa da, ele geçirilen Nazi liderliği bu ihtiyaç anında bize faydalı olabilecek becerilere sahip.\n\nOnlara, savaştan sonra özgürlüklerini geri kazanmaları karşılığında şimdi becerilerini davamıza sunmaları için bir teklif yapabiliriz."
 wtt_germany.51.t:0 "Ele Geçirilen Nazi Liderliğini Yeniden Göreve Getirilsin mi?"
 wtt_germany.52.a:0 "Demokrasinin yanında olacağız!"
 wtt_germany.52.b:0 "Kendi sorunlarını kendileri çözmek zorunda kalacaklar."
 wtt_germany.52.desc:0 "[From.From.GetName]'deki demokratik unsurlar, serbest seçimleri yeniden kurmak ve iktidarı halka geri vermek için bir iç savaş başlattı. Yardımımıza ihtiyaçları olabilir ve başarıları davamız için gelecekteki bir müttefiki garanti edecektir."
 wtt_germany.52.t:0 "[From.From.GetName]'de Demokratik İç Savaş"
 wtt_germany.53.a:0 "Evet, Küçük Almanya çözümü bir hataydı."
 wtt_germany.53.b:0 "Hayır, Büyük Almanya çözümü bir hata olur."
 wtt_germany.53.desc:0 "Güney komşumuz Avusturya'daki Alman duyarlılığı, bir süredir müttefik olmamızla birlikte dikkat çekici bir şekilde arttı. Almanya ile birleşme çağrısı yapan bir referandumun Avusturya halkının onayını alması olasılık dışı değil. Avusturya hükûmetini bir tane düzenlemeye teşvik etmeli miyiz?"
 wtt_germany.53.t:0 "Avusturya'da Alman Yanlısı Duyarlılık Yükseliyor"
 wtt_germany.54.a:0 "Birleşme lehine kampanya yap."
 wtt_germany.54.b:0 "Birleşme aleyhine kampanya yap."
 wtt_germany.54.desc:0 "Alman hükûmeti, eğer Avusturya halkı isterse bir birleşme teklifiyle bize yaklaştı. Öğrenmemiz için bir referandum düzenlememizi istiyorlar."
 wtt_germany.54.t:0 "Alman Hükûmeti Birleşme için Referandum Çağrısı Yapıyor"
 wtt_germany.55.a:0 "Alman Sorunu için harika bir gün!"
 wtt_germany.55.desc:0 "Avusturya halkı kuzeyli kardeşleriyle birleşme lehine oy kullandı. Avusturya eyaletlerinin ve ordusunun entegrasyonu derhal başlayacak."
 wtt_germany.55.t:0 "Avusturya Halkı Birleşme için Oy Kullandı"
 wtt_germany.56.a:0 "Sovyetler yerine Almanya daha iyi!"
 wtt_germany.56.b:0 "Asla! Polonya'nın olan, Polonya'nın kalacak!"
 wtt_germany.56.desc:0 "Sovyetler Birliği ile savaşımız iyi gitmiyor ve her şeyi kaybetme riskiyle karşı karşıyayız. Batımızda, Almanya son birkaç yılda hızlı değişiklikler geçirdi, ancak şimdi demokratik değerlerin sadık bir savunucusu. Danzig ve Poznań'ın eski Alman Topraklarının hızlı bir şekilde iadesini düzenlemek, şüphesiz milyonları Sovyet çizmesi altındaki baskıdan kurtaracaktır."
 wtt_germany.56.t:0 "Alman Toprakları"
 wtt_germany.57.a:0 "Ne kurnazlık! Onları güvende tutacağız."
 wtt_germany.57.b:0 "Hayır, Sovyet misillemesini riske atamayız."
 wtt_germany.57.desc:0 "Polonya'nın Sovyetler Birliği ile savaşı iyi gitmediği için, hükûmetleri gizli kanallardan bize ulaşarak eski topraklarımız olan Danzig ve Poznan'ın hızlı bir şekilde iadesini teklif etti. Halklarının şüphesiz demokratik Alman yönetimi altında, baskıcı Sovyet çizmesi altından daha iyi olacağını savunuyorlar."
 wtt_germany.57.t:0 "Polonya Alman Topraklarının İadesini Teklif Ediyor"
 wtt_germany.58.a:0 "Onların isteklerine saygı duymalıyız."
 wtt_germany.58.desc:0 "Avusturya halkı birleşme çağrılarımızı reddetti ve en azından bir süre daha Avusturya'nın bağımsızlığını sürdürmeyi tercih etti."
 wtt_germany.58.t:0 "Avusturya Halkı Birleşmeyi Reddetti"
 wtt_germany.59.a:0 "En azından güvende olacaklar."
 wtt_germany.59.desc:0 "Alman hükûmeti eski topraklarını kabul etmeye karar verdi ve bölgenin Polonyalı vatandaşlarının korunması için yemin etti."
 wtt_germany.59.t:0 "Almanya Danzig ve Poznan'ı Kabul Etti"
 wtt_germany.5_tt:0 "Eski Kayzer, oğluna yönetiminde pekala yardımcı olabilir.\n"
 wtt_germany.6.a:0 "Kimse bizi durduramayacak."
 wtt_germany.6.d:0 "Kuvvetlerimiz, Huis Doorn çevresindeki alanı Hollanda kuvvetlerinden temizledikten sonra, Kayzer'i iyi sağlıkta buldu ve onu motorlu bir konvoyla Almanya'ya geri getirdi. II. Wilhelm sadece birkaç saat önce zaferle sınırı geçti ve Berlin'e varışında Alman İmparatorluğu Kayzeri sorumluluklarını ciddiyetle kabul etti."
 wtt_germany.6.t:0 "II. Wilhelm Serbest Bırakıldı"
 wtt_germany.60.a:0 "Herkes Kızıllara düştüğünde onlara kim yardım edecek?"
 wtt_germany.60.desc:0 "Alman hükûmeti teklifimizi kabul edemeyeceklerini bildirdi. Sovyet misillemesinden korkuyorlar ve bu yüzden riski göze alamayacaklarını düşünüyorlar."
 wtt_germany.60.t:0 "Almanya Danzig ve Poznan'ı Reddetti"
 wtt_germany.62.a:0 "Pekala."
 wtt_germany.62.desc:0 "Son savaşın sona ermesiyle, MEFO bonoları düzenlediğimiz şirketler şimdi ödeme yapmamız için baskı yapıyor. Artık 'anavatanın iyiliği için' ödemeleri alıkoyma gereği olmadığını iddia ediyorlar."
 wtt_germany.62.t:0 "Şirketler MEFO Ödemesi Talep Ediyor"
 wtt_germany.63.a:0 "Alçaklar! Bu iş burada bitmedi!"
 wtt_germany.63.desc:0 "[GER.GetAdjective] hükûmeti, Alsas-Loren ve Lüksemburg'un [GER.GetName]'e yeniden entegrasyonunu öngören bir yasa çıkardı. Nüfusumuzun toplu askere alınması zaten başladı..."
 wtt_germany.63.t:0 "[GER.GetName] Alsas-Loren'i Yeniden Entegre Etti"
 wtt_germany.64.a:0 "Ne yapabiliriz ki?"
 wtt_germany.64.t:0 "[GER.GetName] Lüksemburg'u Yeniden Entegre Etti"
 wtt_germany.65.a:0 "Haklılar - savaşlarına katılacağız."
 wtt_germany.65.b:0 "Kim olduklarını sanıyorlar?! Asla!"
 wtt_germany.65.desc:0 "[From.GetNameDefCap] bize, kuvvetlerini Sovyet düşmanına yürütmek için toprağımıza ihtiyaçları olduğunu bildirdi. Bizi komünistlere karşı koruduklarını ve bu nedenle mevcut savaşlarında onlara yardım borçlu olduğumuzu hatırlatıyorlar."
 wtt_germany.65.t:0 "[From.GetName] Savaş Katılımı Talep Ediyor"
 wtt_germany.66.desc:0 "[From.GetNameDefCap], [SOV.GetNameDef]'e karşı savaşımızda bize katılmaya karar verdi, bu da kuvvetlerimizin ülkelerinden geçişine izin verme gibi ek bir fayda sağlıyor."
 wtt_germany.66.t:0 "[From.GetName] Talepleri Kabul Etti"
 wtt_germany.67.a:0 "Bunu kendileri istediler."
 wtt_germany.67.desc:0 "[From.GetNameDefCap] savaş katılımı taleplerimizi reddetti ve sınırlarını birliklerimize kapalı tutmaya devam ediyor. Eğer Polonyalılar kuvvetlerimize geçiş izni vermeye istekli değilse, o zaman basitçe onların üzerinden geçmek zorunda kalacağız."
 wtt_germany.67.t:0 "[From.GetName] Talepleri Reddetti"
 wtt_germany.68.a:0 "Mükemmel bir fikir! Kabul edeceğiz."
 wtt_germany.68.b:0 "Gönüllü olarak onlara katılmak mı? Asla!"
 wtt_germany.68.desc:0 "[From.GetAdjective] hükûmeti, eski Avusturya-Macaristan İmparatorluğu'nun yeniden entegrasyonu için bir teklifle bize yaklaştı. İlgili uluslarımızda imparatorluk yanlısı duygu oldukça yüksek olduğu için, uluslarımızı birleştirmenin herkesin çıkarına olacağını iddia ediyorlar."
 wtt_germany.68.t:0 "[From.GetName] İmparatorluk Yeniden Entegrasyonunu Teklif Ediyor"
 wtt_germany.69.desc:0 "[From.GetAdjective] hükûmeti, eski Avusturya-Macaristan İmparatorluğu'nun yeniden entegrasyonu teklifimize yanıt verdi. Bu hamlenin faydalarını kabul ediyorlar ve tüm taraflar kabul ederse uluslarını bizimkiyle entegre etme isteklerini belirttiler."
 wtt_germany.69.t:0 "[From.GetName] Entegrasyonu Kabul Etti"
 wtt_germany.7.a:0 "Durumla idare etmeliyiz... Şimdilik."
 wtt_germany.7.d:0 "[From.GetNameDef]'in nüfuz alanına giderek daha fazla girmemizle birlikte, ekonomimiz müttefikimizin ekonomisine giderek daha bağımlı hale geldi. Bugün Almanlar nihayet ekonomimiz üzerinde daha fazla kontrol sahibi olmak için harekete geçtiğinde, onları durduracak gücümüz yoktu. Sonuç olarak, Almanların dış politikamız üzerindeki kontrolü benzeri görülmemiş seviyelere ulaştı."
 wtt_germany.7.t:0 "[From.GetName]'a Karşı Kontrolsüz Ekonomik Bağımlılık"
 wtt_germany.70.desc:0 "[From.GetAdjective] hükûmeti, eski Avusturya-Macaristan İmparatorluğu'nun yeniden entegrasyonu teklifimize yanıt verdi. Kesin bir dille, böyle bir girişimde liderliğimizi asla gönüllü olarak kabul etmeyeceklerini belirttiler."
 wtt_germany.70.t:0 "[From.GetName] Entegrasyonu Reddetti"
 wtt_germany.71.a:0 "Avusturya-Macaristan için yeni bir çağ başlıyor."
 wtt_germany.71.desc:0 "Komşu Avusturya-Macaristan halef devletlerimizin her ikisi de topraklarının ulusumuza yeniden entegrasyonu ve böylece Avusturya-Macaristan İmparatorluğu'nu yeniden kurma teklifini kabul etti. Yeniden birleşme antlaşmasının imzalanması sokaklarda coşkulu kitleler tarafından karşılandı ve [GER.GetAdjective] hükûmeti bizi ittifaklarına hevesle geri kabul etti."
 wtt_germany.71.t:0 "Avusturya-Macaristan İmparatorluğu'nun Yeniden Kurulması"
 wtt_germany.72.a:0 "Harika bir fikir - kaderlerimiz zaten iç içe geçmişti."
 wtt_germany.72.b:0 "Düşünmüyoruz; egemenliğimiz çok değerli."
 wtt_germany.72.desc:0 "Zaten yakın müttefik olduğumuz için, [From.GetNameDef] ekonomilerimizi daha tam olarak entegre ederek askerî ekonomimizin genişlemesine yardımcı olmak için bir teklifle geldi. Bu, askerî büyümemize büyük ölçüde yardımcı olacaktır, ancak aynı zamanda bizi dış politika konularında onlara tabi kılacaktır."
 wtt_germany.72.t:0 "[From.GetName] Ekonomik Entegrasyon Teklif Ediyor"
 wtt_germany.72_tt:0 "§RSahip olabileceğimiz herhangi bir bağlı devlet üzerindeki kontrolü kaybedeceğiz.§!\n"
 wtt_germany.73.a:0 "Bizim vesayetimiz altında orduları büyüyecek."
 wtt_germany.73.desc:0 "[From.GetAdjective] hükûmeti bize, savaş ekonomilerimizin entegrasyonu teklifimizi kabul ettiklerini bildiriyor. Ordularını bizim başarı şablonumuza göre modelleyebilmeleri için rehberliğimizi hevesle bekliyorlar."
 wtt_germany.73.t:0 "[From.GetName] Ekonomik Entegrasyonu Kabul Etti"
 wtt_germany.74.a:0 "Büyüklüğün kendisini reddediyorlar!"
 wtt_germany.74.desc:0 "[From.GetAdjective] hükûmeti bize, savaş ekonomilerimizin entegrasyonu teklifimizi reddettiklerini bildiriyor. Egemenliklerini ordularının kullanışlılığından daha fazla değerlendiriyorlar..."
 wtt_germany.74.t:0 "[From.GetName] Ekonomik Entegrasyonu Reddetti"
 wtt_germany.8.a:0 "Önümüzdeki zamanda Monarşiye bakmalıyız."
 wtt_germany.8.b:0 "Saçmalık! Yollarımızdan asla vazgeçmeyeceğiz!"
 wtt_germany.8.d:0 "[From.GetNameDefCap], İtalyan hükûmetinin ve yeraltının monarşi yanlısı ve anti-faşist unsurlarına, Mussolini'nin suikastı ve ulusun lideri olarak III. Vittorio Emanuele'nin atanması planlarıyla yaklaştı. Almanlar suikastı halledebileceklerini garanti ediyor; tek yapmamız gereken bir yedek hükûmet oluşturma isteğimizi doğrulamak ve gelecekteki askerî destek sözümüzü Alman girişimlerine taahhüt etmek."
 wtt_germany.8.t:0 "Almanya Monarşist Darbe için Destek Teklif Ediyor"
 wtt_germany.9.a:0 "Planlarımızı harekete geçirebiliriz."
 wtt_germany.9.d:0 "İtalyan hükûmetindeki ve yeraltındaki unsurlar darbe teklifimizi kabul etti. Suikast gerçekleşir gerçekleşmez Kral için hızlı bir iktidar ele geçirme hazırlığı yapıyorlar."
 wtt_germany.9.t:0 "İtalyanlar Darbe Teklifini Kabul Etti"
 wtt_germany.999.a:0 "Bu harika bir fikir!"
 wtt_germany.999.b:0 "Düşünmüyoruz."
 wtt_germany.999.desc:0 "[From.GetLeader] Kayzer adına, [From.GetAdjective] hükûmeti, 1917 Unvan Yoksunluğu Yasası uyarınca Alman kraliyet ve prens ailelerinden İngiliz soyluluk ve kraliyet unvanlarının yoksun bırakılmasının geri alınmasını talep etti. Bunun, İngiliz ve Alman kraliyet ve prens ailelerinin savaş öncesi iyi ilişkilerine zaten geri döndüğünü dünyaya göstereceğini ve dolayısıyla gelecekteki Anglo-Alman dostluğunun bir sembolü olarak hizmet edeceğini savunuyorlar."
 wtt_germany.999.t:0 "[From.GetLeader] Kraliyet Unvanlarının İadesini Talep Ediyor"
 wtt_hanoi_route.1.desc:0 "Ordumuz için malzeme taşıyan kargo gemileri, Çin sınırına doğru kuzey rotası [GetVietnamOwner] tarafından kapatıldığı için Hanoi limanından geri çevrildi. \n\nBu güzergahtan daha fazla malzeme geçemez."
 wtt_hanoi_route.1.t:0 "Hanoi Rotası kapandı"
 wtt_hanoi_route.2.desc:0 "Yerel [From.GetAdjective] yetkilileri, Çin sınırına doğru taşınmak üzere Hanoi'de daha fazla savaş malzemesinin boşaltılmasını engelleme emri aldı. Rıhtımlara, herhangi bir mürettebatın ablukayı kırmasını önlemek için silahlı muhafızlar yerleştirildi. [From.GetAdjective] Sahil Güvenliği, hala denizde olan gemileri geri çeviriyor. \n\nBu kanaldan daha fazla ikmal beklenemez."
 wtt_hanoi_route.2.desc_war_with_from:0 "Hanoi'yi işgal eden [From.GetAdjective] kuvvetleri, bizim için malzeme taşıyan bir dizi kargo gemisini ele geçirdi. Hala denizde olan gemiler geri döndü ve tarafsız limanlara kaçıyor.\n\nBu güzergahtan daha fazla ikmal beklenemez."
 wtt_infiltration.1.t:0 "Sızma Karşıtı Temizlik"
 wtt_infiltration.10.a:0 "Çin için savaşmaya hazırlanın!"
 wtt_infiltration.10.desc:0 "Komünist Parti'de işler yolunda gidiyor. İstihbarat servislerimiz, üs bölgeleri arasında hareket eden ve ülke çapındaki gizli üslerde \"Devrimci Karşı Saldırı\"nın hazırlandığından bahseden gizli emirler taşıyan çok sayıda kuryeyi yakaladı. Büyük bir operasyon, hatta belki ülke çapında bir ayaklanma için asker ve malzeme toplanıyor. Derhal hazırlık yapmalıyız."
 wtt_infiltration.10.t:0 "Komünist Ayaklanması"
 wtt_infiltration.2.a:0 "Birlikleri gönderin."
 wtt_infiltration.2.desc:0 "Yetkililerimiz tarafından yapılan soruşturmalar, [infiltrated_state.GetName]'de bir komünist üs bölgesi ortaya çıkardı. Ordumuzun tüm gücü en kısa sürede bu haydutların üzerine salınmalıdır. Herhangi bir gecikme, operasyon üslerini genişletmelerine ve onları kökünden sökmemizi çok daha zor hale getirmelerine olanak tanıyabilir."
 wtt_infiltration.2.t:0 "[infiltrated_state.GetName]'de Komünist Hücre Keşfedildi"
 wtt_infiltration.21.a:0 "Hız çok önemlidir."
 wtt_infiltration.21.desc:0 "İstihbarat servisinin topladığı bilgilere dayanarak, devriyelerimiz büyük bir Komünist Üs Bölgesi ortaya çıkardı. Daha fazla organize olup onları kaldırma girişimlerimize direnemeden önce derhal saldırmalıyız."
 wtt_infiltration.21.t:0 "[infiltrated_state.GetName]'de Komünist Hücre Keşfedildi"
 wtt_infiltration.23.a:0 "Bildiğimiz birkaç hücreyi temizlemeliyiz."
 wtt_infiltration.23.desc:0 "Bilinen Komünist sığınaklarına yapılan bir dizi baskın, Komünist sızmasının boyutu hakkında çok az yeni bilgi ortaya çıkardı. Tutuklanan Komünistlerin kapsamlı sorgulanması, daha önce bilmediğimiz hiçbir şeyi ortaya çıkarmadı. \n\nGörünüşe göre istihbarat servisimiz konuya oldukça hakim."
 wtt_infiltration.23.t:0 "Komünist tehdit azalıyor mu?"
 wtt_infiltration.24.a:0 "Umarım hepsinden kurtulmuşuzdur."
 wtt_infiltration.24.desc:0 "Görünüşe göre Komünistler son birkaç ayda ciddi darbeler ve aksilikler yaşadılar. Ajanlarımız, Komünist Parti Genel Merkezi'nden yerel liderlere durumları hakkında soru soran, genellikle söz konusu liderleri tutukladıktan ve kuryeleri bekledikten sonra artan sayıda mesaj ele geçirdi. Şimdilik, Komünistler geri adım atmış gibi görünüyor, eyalet düzeyindeki örgütlenmeleri etkisiz hale gelecek kadar bozulmuş. \n\nAncak, Komünist Parti herhangi bir biçimde var olduğu sürece, çabalarını yeniden başlatmaya karar verebileceği için uyanık kalmalıyız."
 wtt_infiltration.24.t:0 "Komünist tehdit yenildi"
 wtt_infiltration.3.a:0 "Bulduklarımızı yok edelim!"
 wtt_infiltration.3.desc:0 "Bilinen komünist sığınaklarına yaptığımız son baskınlarda ajanlarımız eli boş döndü. Ülkemizde hala komünist sızmacıların aktif olduğunu biliyoruz, ancak daha önce bilmediğimiz hücrelerin faaliyet göstermediği anlaşılıyor."
 wtt_infiltration.3.t:0 "Komünistler kontrol altına alındı"
 wtt_infiltration.4.a:0 "Umarım hepsinden kurtulmuşuzdur."
 wtt_infiltration.4.desc:0 "Yaygın bir komünist sızması raporları büyük ölçüde abartılmış gibi görünüyor. Bilinen bir dizi sığınak ve komünist aktivistlere yapılan baskınlarda hiçbir şey bulunamadı. Bu ya Komünistlerin herhangi bir hücre organize edemediği ya da yaratmayı başardıklarını ezdiğimiz anlamına gelir. Ancak, şüphesiz bizi bir güvenlik duygusuna kaptırmadan önce çabalarını yeniden başlatmaya karar verebilecekleri için uyanık kalmalıyız."
 wtt_infiltration.4.t:0 "Komünist Sızması yenildi mi?"
 wtt_infiltration.5.a:0 "Umarım o noktaya gelmez."
 wtt_infiltration.5.desc:0 "Milliyetçi devriyeler [infiltrated_state.GetName]'deki Üs Bölgemize yaklaştı. Eğer kaynakları harcamaya isteklilerse, onu ortak bir askerî operasyonla tamamen ortadan kaldırabilirler."
 wtt_infiltration.5.t:0 "[infiltrated_state.GetName] Üs Bölgesi Keşfedildi"
 wtt_infiltration.6.a:0 "Devrim bir darbe aldı."
 wtt_infiltration.6.desc:0 "Düşman kuvvetleri [infiltrated_state.GetName]'deki Üs Bölgemize saldırılarına başladı. Eyaletteki yoldaşlarımızdan herhangi bir mesaj alınmadı, ancak düşman basını \"[infiltrated_state.GetName] Kuşatma ve İmha Harekatı\"nın sonuçlandığını bildiriyor. En kötüsünü varsaymalıyız."
 wtt_infiltration.6.t:0 "[infiltrated_state.GetName] Üs Bölgesine Saldırıldı"
 wtt_japan.1.a:0 "Doğu'da Japon egemenliğini kabul etme zamanı geldi."
 wtt_japan.1.b:0 "Onları zorla almak zorunda kalacaklar!"
 wtt_japan.1.desc:0 "Zayıflığımızdan kaynaklanan fırsatı değerlendiren [From.GetAdjective], sömürgelerimizde 'düzeni sağlamak' için bize 'yardım etmeyi' teklif etti. Anakaralarımızın düşmesiyle, hakimiyetimizi sürdürme imkanımızın olmadığını savunuyorlar.\n\nAçıkça sömürgelerimizin kontrolünü bizden kapmak için bir hile, ama ne seçeneğimiz var ki?"
 wtt_japan.1.t:0 "[From.GetNameDefCap] Sömürgelerimizin Hükümranlığını İstiyor"
 wtt_japan.101.a:0 "Belki de Japonlarla gerçekten başa çıkılabilir."
 wtt_japan.101.b:0 "Mançurya'yı kabul edeceğiz, ama onların nezaketini değil."
 wtt_japan.101.desc:0 "[MAN.GetName]'a karşı son zaferleriyle, Japon hükûmeti şimdi bölgeye olan Çin bağlarını tanıdı ve derhal tüm kontrolü bize devretti. Bu iyi niyet jestiyle, bize bir ittifak teklif ediyorlar."
 wtt_japan.101.t:0 "Mançurya Yeniden Birleşmesi"
 wtt_japan.102.desc:0 "[From.GetNameDefCap] Mançurya'nın iadesi için bize teşekkür ediyor ve ittifak teklifimizi kabul etti."
 wtt_japan.103.desc:0 "[From.GetNameDefCap] Mançurya'nın iadesi için bize teşekkür ediyor, ancak ittifak teklifimizi reddetti."
 wtt_japan.104.a:0 "Haklılar. Özgürlüklerini hak ediyorlar."
 wtt_japan.104.b:0 "Filipinler Amerikan kalacak!"
 wtt_japan.104.desc:0 "[From.GetNameDefCap], ilgi alanlarındaki bir ulusun Batı çizmesi altında var olmaya devam etmesini 'artık seyirci kalamayacaklarını' açık ve kamuoyuna yönelik ifadelerle belirtti. Şimdi sömürgeden çıkma takvimimizi hızlandırmamızı ve Filipinler'e derhal tam egemenlik vermemizi talep ediyorlar."
 wtt_japan.104.t:0 "Filipin Egemenliği"
 wtt_japan.105.a:0 "En azından mantıklılar."
 wtt_japan.105.desc:0 "[From.GetNameDefCap], tam Filipin bağımsızlığı taleplerimize yanıt verdi ve Amerikan hükûmeti şimdi Pasifik'teki bağlı devletlerine tam egemenlik vermek için derhal düzenlemeler yaptı."
 wtt_japan.106.a:0 "Ve kendilerine 'Özgürlüğün Savunucuları' diyorlar, öyle mi?"
 wtt_japan.106.desc:0 "[From.GetNameDefCap], tam Filipin bağımsızlığı taleplerimize yanıt vererek, Filipinler'in bölgedeki 'hayati Amerikan çıkarlarını' temsil ettiğini yineledi."
 wtt_japan.107.a:0 "Japonlara övgüler olsun!"
 wtt_japan.107.desc:0 "[From.GetNameDefCap], tam bağımsızlık taleplerimize yanıt verdi ve Amerikan hükûmeti şimdi bize tam egemenlik vermek için derhal düzenlemeler yaptı!"
 wtt_japan.108.a:0 "Tennōheika Banzai!"
 wtt_japan.108.desc:0 "Bir grup genç subay, başbakanın yanı sıra çeşitli hükûmet yetkililerine suikast düzenlemeyi başardı. Tokyo şehrini işgal ettiler ve İmparatorluk Sarayı'nın kontrolünü güvence altına alarak, hükûmeti 'yozlaşmış yetkililerden' ve 'ideolojik tehditlerden' temizleme niyetlerini açıkladılar ve İmparator'u ulusun tek hükümdarı olarak yeniden göreve getirdiler.\n\nEylemleri, eski hükûmete sadık unsurların toplu tutuklamaları ve suikastlarıyla karşı operasyonların engellendiği orduda beklenmedik derecede büyük bir takipçi kitlesi buldu. Olayların ani ve ezici doğası ve isyancıların sarayı kontrol etmesi karşısında, İmparator isyancıları kınamak için hiçbir hamle yapmadı.\n\nOrganize hükûmet direnişi zaten çöküyor gibi görünüyor ve isyancıların her an tüm iç, dış ve askerî politika alanlarına tam İmparatorluk kontrolünün kurulduğunu duyurması bekleniyor."
 wtt_japan.108.t:0 "Genç Subay Darbesi"
 wtt_japan.109.a:0 "Mükemmel bir fikir. Paktı imzalayacağız."
 wtt_japan.109.b:0 "Hayır, dünyayı karşımıza alma riskini göze almamalıyız."
 wtt_japan.109.desc:0 "[From.GetNameDefCap], kendimiz, [JAP_initiator.GetAdjective] ve [ITA_fascism.GetAdjective]ler arasında bir üçlü pakt ilgimizi ölçmek için temaslarda bulundu. [JAP_initiator.GetAdjective], çabalarımıza yönelik giderek artan düşmanca küresel görüş ışığında birbirimizi desteklememizin zorunlu olduğunu savunuyor."
 wtt_japan.109.t:0 "Japonya Üçlü Pakt Teklif Ediyor"
 wtt_japan.11.a:0 "Barış olmalı... şimdilik."
 wtt_japan.11.b:0 "Onlara herhangi bir avantaj vermemek önceliklidir!"
 wtt_japan.11.desc:0 "[From.GetAdjective] ile [Root.GetNameDef] arasındaki gerilim son zamanlarda artmasına rağmen, [From.GetAdjective] şimdi bir Saldırmazlık Paktı için müzakereler açtı. Bize olan avantajları açık, ancak bizi endişelendirmesi gereken şey, [From.GetAdjective]'e vereceği avantajlar ve bu hamleden pişman olup olmayacağımızdır."
 wtt_japan.11.t:0 "[From.GetNameDef] ile Saldırmazlık Paktı"
 wtt_japan.110.desc:0 "[JAP_initiator.GetNameDefCap], kendimiz, [JAP_initiator.GetAdjective] ve [GER_fascism.GetAdjective]ler arasında bir üçlü pakt ilgimizi ölçmek için temaslarda bulundu. [JAP_initiator.GetAdjective], çabalarımıza yönelik giderek artan düşmanca küresel görüş ışığında birbirimizi desteklememizin zorunlu olduğunu savunuyor. [GER_fascism.GetAdjective]ler fikre desteklerini zaten doğruladılar."
 wtt_japan.111.desc:0 "[GER_fascism.GetAdjective] ve [ITA_fascism.GetAdjective] hükûmetleri, savaş durumunda yanımızda durma sözü vererek önerilen Üçlü Paktı imzalamayı kabul ettiler."
 wtt_japan.111.t:0 "Üçlü Pakt İmzalandı"
 wtt_japan.112.desc:0 "[From.GetAdjective] hükûmeti, tek başına devam etmeyi tercih ederek önerilen Üçlü Paktı reddetti."
 wtt_japan.112.t:0 "[From.GetNameDefCap] Üçlü Paktı Reddetti"
 wtt_japan.113.desc:0 "[ITA_fascism.GetAdjective] hükûmeti, savaş durumunda yanımızda durma sözü vererek önerilen Üçlü Paktı imzalamayı kabul etti."
 wtt_japan.113.t:0 "[From.GetNameDefCap] Üçlü Paktı İmzaladı"
 wtt_japan.114.a:0 "Bir daha asla ordu bizi yönetmeyecek!"
 wtt_japan.114.desc:0 "Hükûmetteki demokratik unsurlar, ordunun halkın zor kazanılmış demokratik haklarını bir kez daha kısıtlama tehdidinden sonra ülkeyi sürpriz bir şekilde devraldı. Şaşırtıcı bir çeviklikle, ordunun önemli bir kısmı halkın ve özgürlük haklarının savunmasında silahlandı.\n\nOrdudaki bu bölünme, halkın temsilcilerinin yasama ve yürütme organlarında iktidarı ele geçirmesine olanak tanıdı. Çatışmalar daha yeni başlamış olsa da, mevcut hükûmetin kolayca yerinden edileceği pek olası değil."
 wtt_japan.114.t:0 "Demokratik Unsurlar Darbe Yaptı"
 wtt_japan.115.a:0 "Müttefiklerimize katılacağız!"
 wtt_japan.115.b:0 "Anlaşmalarımız bozulamaz... Henüz."
 wtt_japan.115.desc:0 "[From.GetNameDefCap], onlarla olan saldırmazlık paktımıza rağmen tek taraflı olarak Sovyetler Birliği'ne saldırdı. İttifakımıza sadık kalıp [From.GetAdjective] saldırısını desteklemek ya da Sovyetlerle olan saldırmazlık paktımıza sadık kalıp saldırıyı kınamak dışında başka bir alternatifimiz kalmadı."
 wtt_japan.115.t:0 "[From.GetName] Sovyetler Birliği'ne Saldırdı"
 wtt_japan.116.a:0 "Olması gerektiği gibi."
 wtt_japan.116.desc:0 "[From.GetNameDefCap], onlarla olan eski saldırmazlık paktlarına rağmen Sovyetlere karşı savaşımıza katılmaya karar verdi."
 wtt_japan.116.t:0 "[From.GetName] Savaşa Katıldı"
 wtt_japan.117.a:0 "Bu çok talihsiz."
 wtt_japan.117.desc:0 "[From.GetNameDefCap], müttefikimiz olarak bize olan bağlılıklarına rağmen Sovyetlerle olan saldırmazlık paktlarına sadık kalmaya karar verdi. Saldırganlığımızı, görünüşe göre pakt üyesi dostlarıyla diplomatik durumu kurtarma girişimiyle kınadılar."
 wtt_japan.117.t:0 "[From.GetName] Savaşımızı Kınadı"
 wtt_japan.118.a:0 "Mükemmel bir fikir!"
 wtt_japan.118.b:0 "Bu bizim için iyi bir takas değil."
 wtt_japan.118.desc:0 "[From.GetNameDefCap] şu anda yıkıcı bir iç savaşın içinde ve düşmanının askerî gücüyle başa çıkmakta zorlanıyor. Geçiş hükûmetleri şimdi temsilcilerimize, çok ihtiyaç duydukları askerî yardım karşılığında Güney Sahalin yarımadasını takas etme teklifiyle yaklaştı.\n\nBu, bazı gönüllü tümenler karşılığında kolayca biraz toprak almanın bir yolu olabilir."
 wtt_japan.118.t:0 "[From.GetName] Yardım Talep Ediyor"
 wtt_japan.119.TT:0 "§Y12 piyade§! ve §Y3 destek§! taburlu 8 birlik kazan."
 wtt_japan.119.a:0 "Çok işe yarayacaklar!"
 wtt_japan.119.desc:0 "[From.GetNameDefCap], Güney Sahalin Yarımadası'nı askerî destek karşılığında takas etme teklifimizi kabul etti. Savaşımızda bize yardım etmek için birkaç 'gönüllü' tümeni gönderdiler!"
 wtt_japan.119.t:0 "[From.GetName] Takası Kabul Etti"
 wtt_japan.12.a:0 "Tam da tuzağımıza düştüler."
 wtt_japan.12.desc:0 "[From.GetNameDefCap], Saldırmazlık Paktı teklifimizi resmen kabul etti."
 wtt_japan.12.t:0 "[From.GetNameDefCap] Saldırmazlık Paktını Kabul Etti"
 wtt_japan.120.a:0 "Kendi başımızayız..."
 wtt_japan.120.desc:0 "[From.GetNameDefCap], Güney Sahalin Yarımadası'nı askerî destek karşılığında takas etme teklifimizi reddettiklerini bildirdi."
 wtt_japan.120.t:0 "[From.GetName] Takası Reddetti"
 wtt_japan.121.a:0 "Bu planı uygula."
 wtt_japan.121.b:0 "Bu şu anda bizim için ilgi çekici değil."
 wtt_japan.121.desc:0 "[From.GetNameDefCap], Japon başkentini aldı ve faşist [From.From.GetAdjective] hükûmeti düştü. Eğer harekete geçmek istiyorsak, bunu derhal yapmalıyız. Komünist tehdidi kontrol altına alacaksak, hızla hareket edip dış Japon adalarının kontrolünü güvence altına almamız ve kalan faşist unsurların komutasını almamız zorunludur."
 wtt_japan.121.t:0 "[From.GetName] Tokyo'yu Aldı"
 wtt_japan.122.a:0 "Onlarla daha sonra ilgileneceğiz."
 wtt_japan.122.desc:0 "Tokyo'nun ele geçirilmesiyle, faşist hükûmet düştü ve kalan destekçileri ve askerî birimleri, dış adaların ve Kore ve Çin mülklerinin kontrolünü ele geçiren [MAN.GetName]'a kaçtı.\n\nİç savaş etkili bir şekilde sona erdi, ancak ateşkes en iyi ihtimalle zayıf, çünkü faşistler kesin olarak yenilmedi."
 wtt_japan.122.t:0 "Faşistler Mançurya'ya Kaçtı"
 wtt_japan.123.a:0 "Savaş kazanıldı."
 wtt_japan.123.desc:0 "Tokyo'nun ele geçirilmesiyle, faşist hükûmet tamamen çöktü. Kalan destekçileri ve askerî birimlerinin toplanacak bir şeyi kalmadı ve dağılmaya başladılar, bu da kalan ve dış toprakların kolayca ele geçirilmesine olanak tanıdı."
 wtt_japan.123.t:0 "Faşist Direniş Çöktü"
 wtt_japan.124.desc:0 "Japonya'daki komünist zaferle birlikte, hayatta kalan gönüllülerimiz şimdi eve döndü."
 wtt_japan.124.t:0 "Gönüllüler Eve Döndü"
 wtt_japan.125.desc:0 "Mançurya'yı Japonlardan kurtardıktan ve tahttan indirilen Çing imparatorundan arındırdıktan sonra, [From.GetNameDef] şimdi Mançurya'nın haklı [Root.GetAdjective] ellerine geri dönmesi gerektiğini iddia ederek bize iadesini teklif etti."
 wtt_japan.125.t:0 "Sovyetler Mançurya'yı Geri Verdi"
 wtt_japan.126.a:0 "Savaş kazanıldı."
 wtt_japan.126.b:0 "Sadece tam zaferle tatmin olacağız!"
 wtt_japan.126.desc:0 "[From.GetAdjective] yetkilileri bize bir barış teklifiyle yaklaştı. Düşmanlıkların derhal durdurulması karşılığında kıtayı tamamen terk edecekler."
 wtt_japan.126.t:0 "[From.GetName] Barış Teklif Ediyor"
 wtt_japan.127.a:0 "Bizi yendiler... Şimdilik."
 wtt_japan.127.desc:0 "[From.GetNameDef], barış teklifimizi kabul etti ve kıta mülklerimiz karşılığında düşmanlıkları durdurdu."
 wtt_japan.127.t:0 "[From.GetName] Barışı Kabul Ediyor"
 wtt_japan.128.a:0 "O zaman sonuna kadar savaşacağız!"
 wtt_japan.128.desc:0 "[From.GetNameDef], koşulsuz bir teslimiyet elde edene kadar savaşı sürdürme sözü vererek barış teklifimizi reddetti."
 wtt_japan.128.t:0 "[From.GetName] Barışı Reddediyor"
 wtt_japan.13.a:0 "Bize karşı komplo mu kuruyorlar?"
 wtt_japan.13.desc:0 "Her ne sebeple olursa olsun, [From.GetNameDef] Saldırmazlık Paktı teklifimizi reddetti."
 wtt_japan.13.t:0 "[From.GetNameDefCap] Saldırmazlık Paktını Reddetti"
 wtt_japan.2.a:0 "Akıllıca bir karar."
 wtt_japan.2.desc:0 "[From.GetNameDefCap], sömürgelerinde 'düzeni sağlama' teklifimizi dikkatle değerlendirdi ve kabul etmeye karar verdi. Etkili bir şekilde tam kontrolü bize devrettiler."
 wtt_japan.2.t:0 "[From.GetNameDefCap] Sömürgelerin Hükümranlığını Veriyor"
 wtt_japan.21.a:0 "Görünüşe göre [From.GetNameDef]'de bir şeyler oluyor..."
 wtt_japan.21.desc:0 "[From.GetAdjective], sol eğilimli memurlarını ve generallerini geri çağırmaya karar verdi ve bunun yerine bize sağ eğilimli generallerini ve memurlarını gayri resmi sürgüne gönderdi."
 wtt_japan.21.t:0 "[From.GetAdjective] Generallerinin Değişimi"
 wtt_japan.22.a:0 "Bu, [Root.GetNameDef] üzerindeki hakimiyetimizi güçlendirecek."
 wtt_japan.22.desc:0 "Daha önce gayri resmi sürgüne gönderdiğimiz sol eğilimli generaller ve memurlar için sağ eğilimli generallerimizi ve memurlarımızı [From.GetNameDef] ile takas etme süreci şimdi tamamlandı."
 wtt_japan.22.t:0 "[Root.GetAdjective] Generalleri Değiştirildi"
 wtt_japan.3.a:0 "Bunun onlara nasıl sonuçlanacağını göreceğiz."
 wtt_japan.3.desc:0 "[From.GetNameDefCap], sömürgelerinde 'düzeni sağlama' teklifimizi dikkatle değerlendirdi ve reddetmeye karar verdi."
 wtt_japan.3.t:0 "[From.GetNameDefCap] Sömürgelerin Hükümranlığını Reddediyor"
 wtt_japan.31.a:0 "Onları sürgüne gönderin!"
 wtt_japan.31.b:0 "Kellelerini alın!"
 wtt_japan.31.desc:0 "İmparator ve ailesinin kaderini görme zamanı geldi. İnşa ettiğimiz Japonya'da kalıtsal sosyal statünün yeri yoktur. Onlara ne olacak?"
 wtt_japan.31.t:0 "İmparatorluk Ailesinin Kaderi"
 wtt_japan.32.a:0 "Onun evi olmaya layık olmalıyız!"
 wtt_japan.32.desc:0 "[From.GetNameDefCap] imparatorluk ailesini sürgün etti ve bunu yaparak bize büyük bir lütufta bulundu! Şimdi [Root.GetNameDef]'e geldi ve sürgününe rağmen halk ve birlikler üzerindeki etkisi hala büyük."
 wtt_japan.32.t:0 "Sürgündeki İmparatorluk Ailesi"
 wtt_japan.40.a:0 "Onlara ait."
 wtt_japan.40.b:0 "Henüz kendilerini yönetmeye hazır değiller."
 wtt_japan.40.desc:0 "Birkaç gün önce, [From.GetNameDef] hükûmeti bize baskı uygulamak için ortak bir çaba başlattı. Gazetelerdeki baş makaleler, Mançurya'yı [From.GetAdjective] kontrolüne iade etmemizi talep etti. Bu sadece iç tüketime yönelik bir propaganda hamlesi değil, çünkü [From.GetLeader] temsilcileri Mançurya topraklarının geleceği hakkında bir anlaşma sağlamak için diplomatik arka kanallardan bizimle temas kurdular.\n\nBugün, [From.GetLeader] kendisi konuya müdahil oldu ve Mançurya'nın en kısa sürede [From.GetNameDef]'e tam iadesini talep etti. Aksi takdirde hükûmeti mevcut işbirliğimizi yeniden gözden geçirmek zorunda kalacaktı."
 wtt_japan.40.t:0 "[From.GetLeader] Mançurya'yı Talep Ediyor"
 wtt_japan.41.a:0 "Ne kadar nazikler."
 wtt_japan.41.desc:0 "İmparatorluk Japon Genelkurmayı, stratejik görünümde temel bir değişiklik kararı aldı. İmparator ile yapılan bir konferansta, Ordu Bakanı, Sovyetler Birliği ile savaşın yakın gelecekte patlak vereceğini varsayan yeni bir plan sundu. Bu savaşa hazırlanmak için, İmparatorluk Japon Ordusu, ordumuzun cephenin bazı kısımlarını savunabilmesi gerektiğine karar verdi. Bu amaçla, sadece biraz eskimiş olan büyük miktarda teçhizat sağlandı."
 wtt_japan.41.t:0 "[From.GetNameDef]'den Askerî Yardım"
 wtt_japan_118_TT:0 "Bu gönüllüler, §Y[From.GetName]§! iç savaşı kazanırsa insan gücü havuzuna geri dönecektir."
 wtt_ledo_road.1.desc:0 "[occupying_country.GetAdjective] kuvvetleri [state_occupied.GetName]'e saldırarak Ledo yoluna ulaştı ve yolu birkaç yerden kesti. Bu yoldan bize daha fazla ikmal ulaşamaz."
 wtt_ledo_road.1.t:0 "Ledo Yolu kapandı"
 wtt_ledo_road.2.desc:0 "[From.GetAdjective] Hükûmeti, Ledo yolu üzerinden trafiğe artık izin vermemeye karar verdi. Yoldaki tüm konvoylar durduruldu ve geri dönmeleri emredildi. Bu yoldan bize daha fazla ikmal ulaşamaz."
 wtt_ledo_road.2.desc_war_with_from:0 "[From.GetAdjective] kuvvetleri Ledo yolunda hızla ilerledi ve birkaç hayati köprüyü ve geçidi aştı. Yol şimdi tüm trafiğe kapalı ve bu güzergahtan bize daha fazla ikmal ulaşamaz."
 wtt_ledo_road.3.a:0 "İyi bir ilk adım."
 wtt_ledo_road.3.desc:0 "Ledo Yolu'nun büyük bir bölümünün başarılı bir şekilde geri alınmasının ardından, [From.GetAdjective] yetkilileri yol boyunca trafiğin yeniden başlamasına izin verdi. Düşman kuvvetlerinin kalıntıları yolculuğu eskisinden daha tehlikeli hale getirse de, ikmal yeniden akıyor."
 wtt_ledo_road.3.t:0 "[From.GetNameDefCap] Ledo Yolu'nun Bir Kısmını Yeniden Açtı"
 wtt_ledo_road.4.a:0 "Harika haber!"
 wtt_ledo_road.4.desc:0 "Yeniden açılan Ledo yolu üzerinden ilk ikmal konvoyu bugün Yunnan'a ulaştı. Trafiğin tekrar sorunsuz akması zaman alacak olsa da, ikmal bize yeniden ulaşıyor."
 wtt_ledo_road.4.t:0 "[From.GetNameDefCap] Ledo Yolu'nu Yeniden Açtı"
 wtt_manchukou.1.a:0 "Bu Cumhuriyet işi zaten hiç yürümeyecekti."
 wtt_manchukou.1.b:0 "Bırak denesin."
 wtt_manchukou.1.desc:0 "Görünüşe göre [From.GetLeader], otoritesini nihayet Çin'in uzak bölgelerine yayma kararını verdi. [From.GetAdjective] Hükümeti'nden bir temsilci geldi ve tek gerçek Çin İmparatoru, Cennetin Oğlu, [From.GetLeader]'a boyun eğmemizi talep ediyor. Bunu reddetmenin, en yüksek dereceden ihanet olarak cezalandırılacağını sözlerine ekledi."
 wtt_manchukou.1.t:0 "[From.GetNameDefCap] Boyun Eğme Talep Ediyor"
 wtt_manchukou.11.a:0 "Havacılık Sanayimizi Geliştir"
 wtt_manchukou.11.b:0 "Otomotiv Sanayine Yatırım Yap"
 wtt_manchukou.11.c:0 "Genel bir Sanayileşme programı"
 wtt_manchukou.11.desc:0 "Hükümetimizin önümüzdeki yıllarda ekonomiyi nasıl büyütmeyi beklediğini detaylandıran yeni Beş Yıllık Plan yavaş yavaş şekilleniyor. Ana odağın nerede olması gerektiği konusunda çeşitli departmanlar arasında hala önemli farklılıklar mevcut. \n\nAğır sanayinin genişletilmesinin hedef olması gerektiği konusunda bir fikir birliği olsa da, bu yeni fabrikaların ne üreteceği hala tartışılıyor. \n\nÇıkmazı kırmak için bir karar verilmelidir."
 wtt_manchukou.11.t:0 "Beş Yıllık Plan"
 wtt_manchukou.2.a:0 "Yerini biliyor."
 wtt_manchukou.2.desc:0 "[From.GetLeader], elçiyi kişisel bir notla geri gönderdi, katı bir itaat sözü verdi ve [MAN.GetLeader]'i Çin'in gerçek lideri olarak memnuniyetle karşıladı."
 wtt_manchukou.2.t:0 "[From.GetLeader] Teslim Oluyor"
 wtt_manchukou.3.a:0 "Ona görgü kurallarını öğreteceğiz."
 wtt_manchukou.3.desc:0 "[From.GetLeader], cömert teklifimize bir dizi hakaret ve küfürle yanıt verdi, İmparator [MAN.GetLeader]'in soyu ve kişisel nitelikleri hakkında hem yanlış hem de çok rahatsız edici ifadelerde bulundu."
 wtt_manchukou.3.t:0 "[From.GetLeader] Reddediyor"
 wtt_manchukou_bandit_sabotage.21.a:0 "Bu teröristler avlanmalı!"
 wtt_manchukou_bandit_sabotage.21.desc:0 "[FROM.GetName] bölgesindeki fabrikalarımızdan birinden gelen raporlar, dün gece büyük bir yangın çıktığını bildiriyor. Yerel itfaiyeciler hala yangınla mücadele ediyor, ancak gün sonuna kadar yangını kontrol altına alacaklarından eminler. Fabrikadaki hasar önemli görünüyor, çünkü yangın son derece yanıcı kimyasalların depolama alanında başlamış gibi görünüyor.\n\nAskeri İstihbarat, en sıkı güvenlik önlemlerine rağmen yangının nasıl çıkabileceğini bulmak için kapsamlı bir soruşturma başlattı. İlk ipuçları kundaklamanın güçlü bir olasılık olduğunu gösteriyor."
 wtt_manchukou_bandit_sabotage.21.t:0 "Silah Fabrikası Sabote Edildi"
 wtt_manchukou_bandit_sabotage.22.t:0 "Sivil Fabrika Sabote Edildi"
 wtt_manchukou_bandit_sabotage.23.desc:0 "Dün gece bir ara, [FROM.GetName] bölgesindeki büyük bir demiryolu köprüsü, geçen bir mühimmat treninin ağırlığı altında çöktü. Kurtarma ve iyileştirme çalışmaları, mühimmatın ikincil patlamaları nedeniyle zorlaştı. Trenin mürettebatı hala kayıp, öldükleri tahmin ediliyor.\n\nAskeri İstihbarat, sağlam bir köprünün hiçbir uyarı işareti olmadan nasıl çökebileceğini bulmak için güvenli olur olmaz olay yerine bir ekip gönderdi.\n\nYerel tanıklar, çöküşten önceki gün köprünün altındaki vadide küçük bir grup gördüklerini bildiriyor. Nerede oldukları şu anda bilinmiyor."
 wtt_manchukou_bandit_sabotage.23.t:0 "Köprü Havaya Uçuruldu"
 wtt_news.1.a:0 "Artık geri dönüş yok."
 wtt_news.1.b:0 "Ordu tarafından ihanete uğradık! Aynısını çekemeyiz."
 wtt_news.1.c:0 "Umarım Avrupa'ya yakında barış geri döner..."
 wtt_news.1.desc:0 "Ünlü Mareşal August von Mackensen liderliğindeki ani bir Wehrmacht darbesi, bu sabah erken saatlerde Almanya'da bir iç savaş başlattı. Faşistler, Kralcılar ve Demokratlar eski yurttaşlarına karşı silahlandı ve askerî birimler iç tehdide bakmak için sınırlardan çekildi.\n\nHitler'in emirleri altındaki faşistler, 'hain Almanlara' düşeceğini görmektense ulusu yok etmeye zaten yemin ettiler."
 wtt_news.1.t:0 "Almanya İç Savaşa Sürüklendi"
 wtt_news.10.a:0 "İstemeden de olsa davamıza yardım etmeye devam ediyorlar!"
 wtt_news.10.b:0 "Kesinlikle daha da aptalca bir şey denemeye cüret edemezler!"
 wtt_news.10.c:0 "En azından bir ittifak kuruldu."
 wtt_news.10.d:0 "Bu hızla tırmanıyor..."
 wtt_news.10.desc:0 "Son Alman duyurusuna yanıt olarak, Sovyet saldırganlığına karşı bir Orta Avrupa İttifakı oluşturmak için, Sovyet hükûmeti askerî üretimin büyük ölçüde hızlandırılmasını sağlayacak önlemler aldı.\n\nBir Kremlin sözcüsü, kesin bir dille, Sovyetler Birliği'nin bu tehdidin sınırlarında gelişmesini seyirci kalamayacağını açıkça belirtti. Buna karşı önlemler alınmalıydı ve derhal alındı."
 wtt_news.10.t:0 "Sovyetler Askerî Yığınağı Artırıyor"
 wtt_news.1000.a:0 "Korkunç bir trajedi... Beklenmedik sonuçlarla."
 wtt_news.1000.desc:0 "Korkunç bir trajedide, Hindenburg bugün Londra'da yanaşmaya çalışırken imha oldu. Henüz belirlenemeyen nedenlerle, zeplin alevler içinde kaldı ve yere çakıldı, neredeyse tüm genişletilmiş Alman İmparatorluk Ailesi de dahil olmak üzere tüm yolcu ve mürettebatın hayatını aldı.\n\nTek hayatta kalan, törenin hazırlıklarına yardımcı olmak için önden gönderilen Prenses Victoria Louise'dir. Babaannesi Alman İmparatoriçesi Victoria ve büyük-büyükannesi Kraliçe Victoria'dan sonra 'Victoria' adını taşıyan üçüncü kraliyet mensubu olan prenses, bu nedenle tahtın tek kalan varisi oldu. Ailesini kaybetmenin şokunu hala üzerinden atamamış olmasına rağmen, şimdi yine de Alman İmparatorluğu'nun Kaiserin'i olarak I. Victoria adıyla tahta çıktı."
 wtt_news.1001.a:0 "Ne korkunç bir trajedi!"
 wtt_news.1001.desc:0 "Korkunç bir trajedide, Hindenburg bugün Londra'da yanaşmaya çalışırken imha oldu. Henüz belirlenemeyen nedenlerle, zeplin alevler içinde kaldı ve yere çakıldı, tüm genişletilmiş Alman İmparatorluk Ailesi de dahil olmak üzere tüm yolcu ve mürettebatın hayatını aldı.\n\nİmparatorluk Ailesi'nin tamamen yok olmasıyla, hükûmet doğrudan kontrolü ele aldı, ancak bunun kısa vadede demokrasiye bir dönüş sağlayacağı pek olası görünmüyor."
 wtt_news.11.a:0 "Nihayet onları yeterince zorladık mı?"
 wtt_news.11.b:0 "Sınırlarımızı güvence altına almalıyız!"
 wtt_news.11.c:0 "Birlikte onlara karşı durabiliriz!"
 wtt_news.11.d:0 "Bu kıvılcım mı?"
 wtt_news.11.desc:0 "[GER.GetFactionName]'e sınır devletlerinden birinin davet edilmesiyle, Sovyet hükûmeti 'nüfuz alanlarının' işlerine daha fazla müdahale edilmemesi konusunda net bir şekilde uyardı.\n\nDoğrulanmamış raporlar, muhtemelen savaşa hazırlanan Sovyet askerî kuvvetlerinin bir seferberliğini gösterdi."
 wtt_news.11.e:0 "Savaşa hazırlanmalıyız!"
 wtt_news.11.t:0 "Sovyetler Nüfuz Alanını Güvence Altına Almak için Harekete Geçti"
 wtt_news.12.a:0 "Bize kimin liderimiz olabileceğini söylemeye cüret ediyorlar?!"
 wtt_news.12.b:0 "Bizi buna zorladılar!"
 wtt_news.12.c:0 "Ve böylece 1914'e geri döndük."
 wtt_news.12.desc:0 "[GER.GetAdjective] kararının II. Wilhelm'in dönüşüne izin vermesine yanıt olarak, [FRA.GetNameDef] ve [ENG.GetNameDef] [GER.GetNameDef]'e savaş ilan etti. [FRA.GetAdjective] ve [ENG.GetAdjective], bu tırmanışın nedeni olarak 'bilinen bir savaş suçlusunun' bir kez daha devlet başkanı olmasına izin veren 'bariz [GER.GetAdjective] inadını' gösteriyor.\n\nİlgili hükûmetlerinin sözcüleri, Büyük Savaş'ın 'kilit kışkırtıcısının' bir kez daha [GER.GetAdjective] Tacı'nı üstlenmesine izin vermenin tamamen ahlaksız olduğunu ve [GER.GetAdjective] hükûmetinin tüm uyarıları görmezden geldiğini savunuyorlar. 'Başka seçeneğimiz yoktu'."
 wtt_news.12.t:0 "Kayzer'e Karşı Protesto Savaşa Yol Açtı"
 wtt_news.13.a:0 "Başka seçeneğimiz yoktu."
 wtt_news.13.b:0 "Neyse ki Almanlar aklını başına topladı."
 wtt_news.13.c:0 "Barış korundu..."
 wtt_news.13.desc:0 "II. Wilhelm'in Kayzer olarak geri dönmesine yönelik şiddetli Anglo-Fransız muhalefetine yanıt olarak, Alman hükûmeti II. Wilhelm'in sürgünde yaşamaya devam edeceği, ancak oğlunun III. Wilhelm olarak Alman tahtını devralacağı bir uzlaşma önerdi.\n\n[ENG.GetNameDef] ve [FRA.GetNameDef] tarafından kabul edilmesiyle, bunun büyük Avrupa güçleri arasında kalıcı bir barışa yol açacağı umuluyor."
 wtt_news.13.t:0 "III. Wilhelm Uzlaşması"
 wtt_news.14.c:0 "Aptal, inatçı Fransızlar!"
 wtt_news.14.d:0 "Ama İngilizler ne yapacak?"
 wtt_news.14.desc:0 "II. Wilhelm'in dönüşüne izin veren Alman kararına yanıt olarak ve İngiliz desteğinin eksikliğine rağmen, [FRA.GetNameDef], [GER.GetNameDef]'e savaş ilan etti. Fransızlar, bu tırmanışın nedeni olarak 'bilinen bir savaş suçlusunun' bir kez daha devlet başkanı olmasına izin veren 'bariz Alman inadını' gösteriyor.\n\nFransız hükûmetinin sözcüleri, Büyük Savaş'ın 'kilit kışkırtıcısının' bir kez daha Alman Tacı'nı üstlenmesine izin vermenin tamamen ahlaksız olduğunu ve Alman hükûmetinin tüm uyarıları görmezden geldiğini savunuyorlar. 'Başka seçeneğimiz yoktu'."
 wtt_news.15.c:0 "Neyse ki Almanlar Fransızlardan daha makuldü..."
 wtt_news.15.desc:0 "II. Wilhelm'in Kayzer olarak geri dönmesine yönelik şiddetli Fransız muhalefetine yanıt olarak, Alman hükûmeti II. Wilhelm'in sürgünde yaşamaya devam edeceği, ancak oğlunun III. Wilhelm olarak Alman tahtını devralacağı bir uzlaşma önerdi.\n\n[FRA.GetNameDef] tarafından kabul edilmesiyle, bunun büyük kıta Avrupası güçleri arasında kalıcı bir barışa yol açacağı umuluyor."
 wtt_news.16.a:0 "Sömürgeci şanımıza geri döneceğiz, henüz değil."
 wtt_news.16.b:0 "Ödenecek küçük bir bedeldi."
 wtt_news.16.c:0 "Onu daha önce onlardan aldık, yine yapabiliriz!"
 wtt_news.16.d:0 "Alman sömürgeciliği, bir kez daha mı?"
 wtt_news.16.desc:0 "Çin hükûmeti, son Alman taleplerine boyun eğerek eski yerleşim bölgeleri olan Qingdao'nun iadesine karar verdi.\n\nDerhal geçerli olmak üzere, şehir sınırları içinde Alman kontrolü yeniden sağlandı ve Alman Hükûmeti, adını eski Alman adı olan Tsingtao olarak değiştirdi."
 wtt_news.16.t:0 "Çin, Qingdao'da Alman Yönetimini Geri Getirdi"
 wtt_news.17.b:0 "Bizim toprağımızı teslim etmeye nasıl cüret ederler?!"
 wtt_news.17.c:0 "1914 için ödeştik sayılırız."
 wtt_news.17.desc:0 "Japon hükûmeti, son Alman taleplerine boyun eğerek eski yerleşim bölgeleri olan Qingdao'nun iadesine karar verdi.\n\nDerhal geçerli olmak üzere, şehir sınırları içinde Alman kontrolü yeniden sağlandı ve Alman Hükûmeti, adını eski Alman adı olan Tsingtao olarak değiştirdi."
 wtt_news.17.t:0 "Japonya, Tsingtao'da Alman Yönetimini Geri Getirdi"
 wtt_news.18.a:0 "Daha Büyük bir Almanya için."
 wtt_news.18.b:0 "İstedikleri buydu."
 wtt_news.18.desc:0 "[AUS.GetNameDef] ve [GER.GetNameDef]'in yakın müttefik işbirliği başladığından beri, Avusturya'da birleşme yanlısı duyarlılık önemli ölçüde arttı. Dün yapılan bir halk oylamasında Avusturya halkı, kuzeyli komşularıyla birleşme lehine ezici bir çoğunlukla oy kullandı.\n\nAvusturya devletinin entegrasyonu derhal ilerletildi ve eski devlet bu sabah lağvedildi."
 wtt_news.18.t:0 "Avusturya Almanya'ya Katılmak için Oy Verdi"
 wtt_news.19.a:0 "Onları canımız pahasına koruyacağız."
 wtt_news.19.b:0 "En iyi seçenek buydu..."
 wtt_news.19.c:0 "Hilekar ve alçakça diplomatik manevralar!"
 wtt_news.19.d:0 "Dikkat çekici derecede kurnaz bir diplomatik düzenleme..."
 wtt_news.19.desc:0 "Devam eden Sovyet saldırısı karşısında, Polonya hükûmeti bu sabah eski Alman toprakları olan Danzig ve Poznań'ın derhal [GER.GetNameDef]'e iadesini duyurdu.\n\nPolonya veya Alman hükûmetlerinin nedenleri hakkında tamamen sessiz kalmasına rağmen, uzmanlar bunun büyük olasılıkla Polonya'nın askerî çöküşü karşısında bu toprakları Sovyetlerin elinden uzak tutma girişimi olduğu konusunda hemfikir."
 wtt_news.19.t:0 "Polonya Danzig ve Poznań'ı Geri Verdi"
 wtt_news.2.a:0 "Buna nasıl cüret ederler?!"
 wtt_news.2.b:0 "Ne yaptıklarını bilseler iyi olur..."
 wtt_news.2.c:0 "Birinin bir tavır alması gerekiyordu."
 wtt_news.2.desc:0 "Alman İmparatorluğu'nun dün sabah sürpriz bir duyuruyla II. Wilhelm'in sürgününü kaldırmasından kısa bir süre sonra, Hollandalı yetkililer eski Kayzer'in motor konvoyunu Alman sınırını geçmeden önce engelledi ve onu ikametgahı olan Huis Doorn'a geri dönmeye zorladı.\n\nResmi bir Hollanda bildirisinde, II. Wilhelm'in bir kez daha Alman tahtına çıkmasına izin verilmesi durumunda kıtayı istikrarsızlaştırma endişeleri gerekçe gösteriliyor ve Hollanda hükûmeti bu nedenle eski Kayzer'i ev hapsine almayı kendi üzerine aldı.\n\nKrize bir Alman yanıtı henüz yapılmadı, ancak kamuoyunun tepkisi Kayzer'in dönüşünü sağlamak için askerî güç kullanılması talebini içeriyor.\n"
 wtt_news.2.t:0 "[From.GetNameDefCap] II. Wilhelm'in Dönüşünü Engelliyor"
 wtt_news.20.desc:0 "Artan Sovyet saldırganlığı algısının ışığında [GER.GetName], \"komünizmin doğrudan tehdidi altındaki devletlere\" [SOU.GetName]'ye karşı bir ittifak kurma şansı sundu. İttifaktaki herhangi bir ülke, bir üyenin saldırıya uğraması durumunda [SOU.GetName]'ye karşı savaşmaya kararlı olacaktır."
 wtt_news.20.t:0 "Almanya Anti-Sovyet Paktı Duyurdu"
 wtt_news.21.a:0 "Dünya [SOV.GetAdjective] tehdidini bilmeli!"
 wtt_news.21.b:0 "Bize böyle iftira atmaya nasıl cüret ederler?!"
 wtt_news.21.d:0 "Sovyetlerin bunu nasıl karşılayacağını göreceğiz."
 wtt_news.21.desc:0 "\n [FROM.GetAdjective] hükümeti [SOV.GetNameDef]'ye karşı söylemini artırdı ve Avrupa'nın Doğu Komşusunun kıta üzerinde beliren bir \"Büyük Doğu Tehdidi\" olduğu uyarısında bulundu. Bunun korku tellallığı mı olduğu yoksa gerçekte bir temeli mi olduğu tartışılıyor ancak [FROM.GetAdjective]'lerin kıtayı Doğu'ya karşı birleştirmeyi hedeflediği kesin."
 wtt_news.21.t:0 "[From.GetNameDefCap], [SOV.GetNameDef]'e Karşı Konuştu"
 wtt_news.22.a:0 "Özgür Avrupa'yı komünizm tehdidine karşı yöneteceğiz!"
 wtt_news.22.b:0 "Konumuzu giderek daha fazla tehdit ediyorlar..."
 wtt_news.22.c:0 "Nihayet, Almanlar adım atıyor."
 wtt_news.22.d:0 "Sovyetlerin bunu sineye çekeceği pek olası değil..."
 wtt_news.22.desc:0 "Almanya son dönemdeki Sovyet karşıtı söylemini sürdürdü ve şimdi kıtanın geri kalanındaki Sovyet nüfuzunu dizginlemek için somut bir plan geliştirdi. Yeni bir ittifak olan Orta Avrupa İttifakı kuruldu ve zamanla üyelerine Almanların \"dizginsiz Sovyet saldırganlığı\" dediği şeye karşı koruma sağlayabileceğini umuyoruz."
 wtt_news.22.t:0 "[From.GetName] Orta Avrupa İttifakı'nı Duyurdu"
 wtt_news.23.a:0 "Büyük bir başarı!"
 wtt_news.23.b:0 "Görevlerinde başarısız oldular..."
 wtt_news.23.c:0 "Almanlar acımasız."
 wtt_news.23.desc:0 "Bu hafta başlarında başlatılan Vichy Fransası'nı ilhak etme amaçlı bir Alman operasyonu o zamandan beri başarıyla tamamlandı. Alman kuvvetleri, Fransız filosunu batırma emirleri gönderilmeden önce Toulon'daki deniz üssünün kontrolünü ele geçirmeyi başardı. Bu nedenle, tüm Fransız filosu sağlam bir şekilde Almanların eline geçti."
 wtt_news.23.t:0 "Vichy Fransası İlhak Edildi"
 wtt_news.24.a:0 "Bir hayal kırıklığı, ama önemi yok."
 wtt_news.24.b:0 "Sonuna kadar sözlerini tuttular."
 wtt_news.24.c:0 "Fransızların son bir meydan okuması."
 wtt_news.24.desc:0 "Bu hafta başlarında başlatılan Vichy Fransası'nı ilhak etme amaçlı bir Alman operasyonu o zamandan beri başarıyla tamamlandı. Ancak, Alman kuvvetleri Fransız filosunu batırma emirleri gönderilmeden önce Toulon'daki deniz üssünün kontrolünü ele geçiremedi. Bu nedenle, tüm Fransız filosu Almanların eline geçmesini önlemek için batırıldı."
 wtt_news.24.t:0 "Fransızlar Filoyu Batırdı"
 wtt_news.25.a:0 "Asya Asyalılarındır!"
 wtt_news.25.b:0 "Avrupa için üzücü bir gün..."
 wtt_news.25.c:0 "Bu sömürgeciliğin sonu mu?"
 wtt_news.25.desc:0 "[From.GetNameDef]'in mevcut zayıflığı ışığında, [JAP.GetAdjective]'in [From.GetAdjective] doğu Asya mülkleri üzerinde kontrol için baskıyı artırması belki de şaşırtıcı değil. Ancak bu sabah, [From.GetAdjective] hükûmetinden yetkililer, [From.GetAdjective] sömürgelerinin kontrolünün derhal geçerli olmak üzere [JAP.GetNameDef]'e devredileceğini sürpriz bir duyuruyla açıkladılar."
 wtt_news.25.t:0 "[JAP.GetNameDefCap], [From.GetAdjective] Sömürgelerinin Kontrolünü Üstleniyor"
 wtt_news.26.b:0 "Zaten sömürgeden çıkacaktık."
 wtt_news.26.c:0 "Neşeli bir gün!"
 wtt_news.26.desc:0 "[JAP.GetAdjective] baskısının bir sonucu olarak, [From.GetAdjective] hükûmeti şimdi takımadalar üzerindeki [From.GetAdjective] sömürge yönetiminin derhal sona erdiğini duyurdu. Bugünden itibaren, [PHI.GetNameDef]'e tam egemenlik verildi."
 wtt_news.26.t:0 "Filipin Bağımsızlığı"
 wtt_news.27.a:0 "Banzai!"
 wtt_news.27.b:0 "Endişe verici haberler... Bize böyle bir girişimde bulunmadılar..."
 wtt_news.27.c:0 "Bu Pasifik'te barışı garanti eder mi?"
 wtt_news.27.d:0 "Ani bir olaylar dizisi."
 wtt_news.27.desc:0 "Bir grup genç subay, hükûmeti devirip İmparator'u Japon ulusunun yüce hükümdarı olarak yeniden göreve getirmeyi başardı. Görünüşe göre bu, yaygın hükûmet yolsuzluğu ve düşmanca ideolojilere bağlılık tehditlerine bir tepkiydi.\n\nUlus'u daha da tutarlı bir şekilde İmparatorluk terimleriyle anan subaylar, 'tüm sevimsiz unsurlar ordu ve hükûmetten temizlenene kadar' tasfiyelerin devam edeceğini duyurdular. İmparator Hirohito, kendisi, isyancıların kendisine sunduğu liderliği üstlendiğini kısa bir açıklamayla yayınladı ve Çin ile Pasifik'teki Batılı sömürgeci güçlerle uzlaşma yönünde açık adımlar attı."
 wtt_news.27.t:0 "Japon Genç Subay Darbesi"
 wtt_news.3.a:0 "Çok yaşa Kayzer!"
 wtt_news.3.b:0 "Yüzyılın başına bir dönüş mü?"
 wtt_news.3.c:0 "Onu güvende tutmada üzerimize düşeni yaptık."
 wtt_news.3.d:0 "Hollandalıları iadesi için daha fazla zorlamalıydık!"
 wtt_news.3.desc:0 "Dün sabah sürpriz bir duyuruyla, Alman hükûmeti II. Wilhelm'in sürgününü resmen kaldırdı. Günün ilerleyen saatlerinde, eski Kayzer'in motor konvoyu Hollanda-Alman sınırını geçti ve Berlin'e dönüşünde törenle Alman İmparatorluğu Kayzeri olarak yeniden göreve getirildi.\n\nKayzer, Almanya'yı eski büyüklüğüne geri döndüreceğine zaten yemin etti, ancak ulusun diplomasisiyle hangi yöne gideceği henüz belli değil."
 wtt_news.3.t:0 "II. Wilhelm Alman İmparatorluğu'na Geri Döndü"
 wtt_news.30.a:0 "Hak ettiğini buldu."
 wtt_news.30.b:0 "Bir cinayet işlediler ve buna adalet dediler!"
 wtt_news.30.c:0 "Bunun sonuçları olacak."
 wtt_news.30.d:0 "Çin daha da istikrarsızlaşacak."
 wtt_news.30.desc:0 "[CHI_xian_instigator.GetLeader] tarafından tutuklanmasının ardından Çan Kay-Şek'in bu sabah erken saatlerde Komünist bir idam mangası tarafından öldürüldüğü bildirildi. Halka ve partiye karşı işlenen suçlara ilişkin hızlı bir duruşmanın ardından [PRC.GetLeader], Çan Kay-Şek'in ölüm cezasını açıkladı. Sovyet Hükümeti temsilcisinin doğrudan müdahalesi bile onun hayatını kurtarmaya yetmedi.\n\n[SOV.GetLeader]'nin, [PRC.GetLeader]'nin \"ihanetine\" öfkeli olduğu ve Çin Komintern delegasyonunun tutuklanması emrini verdiği bildirildi.\n\nYeni Milliyetçi Lider [CHI.GetLeader], Çan'ın ölümünün intikamının alınacağına ve Komünistlerin \"yok edileceğine\" söz verdi."
 wtt_news.30.t:0 "Çan Kay-şek İdam Edildi"
 wtt_news.31.c:0 "Doğru kararı verdik."
 wtt_news.31.desc:0 "[CHI_xian_instigator.GetLeader] tarafından tutuklanmasının ardından Çan Kay-Şek'in bu sabah erken saatlerde komünist bir idam mangası tarafından öldürüldüğü bildirildi. Halka ve partiye karşı işlenen suçlar, vatana ihanet ve karşı-devrimci faaliyetler nedeniyle hızlı bir duruşmanın ardından [PRC.GetLeader], Çan Kay-Şek'in ölüm cezasını açıkladı. Sovyet Temsilcisinin duruşmada savcı olarak hareket etmesi, [SOV.GetLeader]'nin kararı gizlice onayladığı yönündeki spekülasyonları alevlendirdi. \nYeni Milliyetçi Lider [CHI.GetLeader], Çan'ın ölümünün intikamının alınacağına ve Komünistlerin \"yok edileceğine\" söz verdi."
 wtt_news.31.t:0 "Çan Kay-şek İdam Edildi"
 wtt_news.32.a:0 "Bizim üzerimizde ne planları var?"
 wtt_news.32.c:0 "Kavga eden çocuklar gibi..."
 wtt_news.32.d:0 "Japonya bunu kendi lehine kullanacak."
 wtt_news.32.desc:0 "[CHI_xian_instigator.GetLeader] tarafından tutuklanıp komünistlere teslim edildikten sonra, [CHI.GetLeader]'in kapsamlı müzakerelerin ardından evine döndüğü bildirildi. Raporlar hala belirsiz, ancak kanıtlar [PRC.GetLeader]'in Japonlara karşı bir ittifak teklif ettiğini gösteriyor. Her iki taraf da bu tür söylentileri yalanladı, [PRC.GetLeader] ülkeyi Milliyetçilerle ortak bir dava yapmaktansa küle dönmesini tercih edeceğini söyledi, bu duyguya [CHI.GetLeader] hızla karşılık verdi."
 wtt_news.32.e:0 "Bunu kendi lehimize kullanabiliriz."
 wtt_news.32.t:0 "Çan Kay-şek Ev Hapsinden Serbest Bırakıldı"
 wtt_news.33.b:0 "Neden değişeceklerini düşündük ki?"
 wtt_news.33.desc:0 "\n[CHI.GetLeader] ve [PRC.GetLeader] arasındaki toplantının ardından, daha sonra, kendi deyimiyle \"Kızıl Ordu'yu Milliyetçi ve karşı-devrimci amaçlar için seçmeye yönelik bariz ve şeffaf bir girişim\"i kınadı. [CHI.GetLeader], yalnızca Milliyetçi orduların Çin'i herhangi bir saldırgana karşı korumaya hazır olduğunu söyleyerek konu hakkında yorum yapmayı reddetti. \n\nBildirildiğine göre iki lider, Japonya'ya karşı bir Birleşik Cephe kurma olasılığını tartıştı.\n\nBu çöküşün, iki taraf arasındaki çatışmanın yenilenmesine yol açıp açmayacağını zaman gösterecek."
 wtt_news.33.t:0 "[PRC.GetLeader] Milliyetçi İhaneti Kınıyor"
 wtt_news.34.a:0 "İyi Avlar!"
 wtt_news.34.b:0 "Onlar çok hoş karşılandılar."
 wtt_news.34.c:0 "Gönüllüler mi? Daha çok Paralı Askerler!"
 wtt_news.34.d:0 "ABD izolasyonunun sonu mu?"
 wtt_news.34.desc:0 "Çin'in Amerikalı pilot ve mekanikerlerin bir gönüllü birliğine katılması yönündeki bir çağrısının ardından, ABD Başkanı [USA.GetLeader], yüzden fazla modern avcı uçağının Çin Hava Kuvvetleri'ne transferini resmen onayladı. ABD Ordusu, Donanması veya Deniz Piyadelerindeki pilotlara da bu birliğe katılmaları için izin verildi.\n\nYeni avcı uçaklarını taşıyan ilk gemilerin, gerekli teçhizat toplandıktan sonra en kısa sürede yola çıkması bekleniyor. Kongre liderleri, uluslararası hukukun sınırlarında gezinmenin bu şekilde misillemelere davetiye çıkaracağından endişe duyduklarını ifade ettiler."
 wtt_news.34.t:0 "Uçan Kaplanlar kuruldu"
 wtt_news.35.a:0 "Rezalet!"
 wtt_news.35.b:0 "Her şey plana göre."
 wtt_news.35.c:0 "Havada savaş kokusu var."
 wtt_news.35.d:0 "Bu önceden planlanmış gibi görünüyor."
 wtt_news.35.desc:0 "Çin ile Japonya arasındaki gerilim, dün gece Şanghay'da yaşanan bir çatışmanın ardından keskin bir şekilde arttı. \n\nBatılı gözlemcilerin raporlarına göre, Çin Polisi ile bir grup Japon denizci arasında çıkan bir kavgada her iki taraf da bazı yaralanmalar yaşadı. Bir Japon devriyesi araştırmak için geldiğinde, Çin Ordusu birimleri olay yerine tüm erişimi zaten engellemiş ve cinayete teşebbüsle suçlanacak olan Japon denizcileri tutuklamıştı.\n\nJapon hükûmeti, denizcilerin derhal serbest bırakılmaması durumunda, özgürlüklerini güvence altına almak için önlemler alınacağı yönünde sert bir uyarıda bulundu."
 wtt_news.35.t:0 "Şanghay Olayı"
 wtt_news.36.a:0 "Endişelenecek bir sorun daha azaldı."
 wtt_news.36.b:0 "Bu bir kaza değildi."
 wtt_news.36.d:0 "Trajik."
 wtt_news.36.desc:0 "Bugün erken saatlerde [CHI.GetNameDef]'i bir trajedi vurdu, Çan Kay-şek'i taşıyan bir uçak kalkıştan sadece birkaç dakika sonra havada patladı. Kurtarma ekipleri hala enkazı tarıyor, ancak mürettebat ve yolcular arasından hayatta kalan bulma umutları çok az.\n\nGeneralissimo ve eşinin öldüğü varsayılıyor.\n\nYeni Çin lideri [CHI.GetLeader], felaketin nedenleri hakkında tam bir soruşturma sözü verdi. Generalissimo'yu Çin'deki çeşitli hizipleri birleştirmede bir engel olarak gören birçok kişinin, onu öldürmek için bir komplo kurduğuna dair söylentiler dolaşıyor."
 wtt_news.36.t:0 "Çan Kay-şek Uçak Kazasında Öldü"
 wtt_news.37.a:0 "Harika bir gün."
 wtt_news.37.b:0 "Sadece bir formalite."
 wtt_news.37.d:0 "Asla bir yere varamayacaklar."
 wtt_news.37.desc:0 "Zafer dolu bir konuşma yapan [PRC.GetLeader], \"Çin halkının ayağa kalktığını\" ve Komünistleri Çin İç Savaşı'nda zafere ulaştırdığını ilan etti. Milliyetçilerin tamamen geri çekilmesiyle Komünist Parti onlarca yıldır süren çekişmenin ardından nihayet zafere ulaştı. Bundan böyle, önceden uzak dağ köylerinde saklanan küçük bir isyancı grup, Çin Halk Cumhuriyeti'nde tam teşekküllü bir hükümet haline gelecek."
 wtt_news.37.t:0 "Çin Halk Cumhuriyeti ilan edildi"
 wtt_news.38.a:0 "Bizi zafere götürsün!"
 wtt_news.38.b:0 "Önemsiz."
 wtt_news.38.c:0 "Faydalı bir müttefik."
 wtt_news.38.d:0 "Zor bir pozisyon miras alıyor."
 wtt_news.38.desc:0 "Çin Komünist Partisi içindeki iç fraksiyonlar arasındaki kavgalar, [PRC.GetLeader]'in en üst lider olarak ortaya çıkmasıyla yatışmış görünüyor. Mao Zedong ve daha ılımlı fraksiyonlar, Sovyet destekli [PRC.GetLeader]'in her ikisini de alt etmeyi başarmasıyla önemli ölçüde nüfuz kaybetti. Bu bölümde [SOV.GetLeader]'in ne rol oynadığı, eğer oynadıysa, çok fazla spekülasyon konusu."
 wtt_news.38.t:0 "[PRC.GetLeader] iç güç mücadelesini kazanıyor"
 wtt_news.39.a:0 "Planlandığı gibi."
 wtt_news.39.b:0 "Bunu kim yaptı?"
 wtt_news.39.c:0 "Ne yaptık biz!?"
 wtt_news.39.d:0 "Şeffaf bir bahane."
 wtt_news.39.desc:0 "\"Açık provokasyon\" olarak tanımlanan bir dizi olayın ardından Japon hükümeti, Çin'de \"silahlı çatışma\" durumunun var olduğunu ilan etti. [CHI.GetLeader] merkezi hükümetinin sorumluları gerektiği gibi kovuşturma konusunda isteksizlik veya yetersizlik gösterdiğini iddia ediyorlar. Buna göre, düzeni sağlamak ve yeni saldırıları önlemek için Japon birliklerinden oluşan bir \"barışı koruma\" gücünün ülkeye gönderildiğini duyurdular."
 wtt_news.39.e:0 "Yollarının hatasını öğrenecekler."
 wtt_news.39.t:0 "Çin Pasifikasyon Kampanyası"
 wtt_news.4.a:0 "Hiç kimse Alman İmparatorluğu'nu durduramayacak!"
 wtt_news.4.b:0 "Hollandalıların aptalca bir jestiydi."
 wtt_news.4.c:0 "Belki de bu sonuçta o kadar da iyi bir fikir değildi..."
 wtt_news.4.desc:0 "Hollandalıların Alman ilerlemesine karşı boşuna direniş girişimlerine rağmen, hükûmet ezici Alman gücü karşısında teslim olmaktan başka seçenek görmedi. Alman birlikleri eski Kayzer'i Huis Doorn'daki ev hapsinden kurtardı ve Berlin'e döndüğünden beri törenle Alman İmparatorluğu Kayzeri olarak yeniden göreve getirildi.\n\nKayzer, Almanya'yı eski büyüklüğüne geri döndüreceğine zaten yemin etti, ancak ulusun diplomasisiyle hangi yöne gideceği henüz belli değil."
 wtt_news.4.t:0 "II. Wilhelm Hollanda Ev Hapsinden Kurtarıldı"
 wtt_news.40.a:0 "Bir felaket!"
 wtt_news.40.b:0 "Düşmanın kullanmasına izin veremezdik."
 wtt_news.40.c:0 "Kararlılıklarını bir daha hafife almayacağız."
 wtt_news.40.d:0 "İmparatorluklarıyla olan bağı kopardık!"
 wtt_news.40.desc_eng:0 "Süveyş Kanalı'na yaklaşan düşman kuvvetlerine ve hayati ticaret arterini düşmana kaybetme riskine karşılık, [From.GetNameDef] bunun yerine kanalın kullanımını onlara engellemek için kanalı patlatmayı seçti. Blok gemileri, yıkımlar ve mayınlama kombinasyonuyla, yıkım oldukça tamamlandı ve onarımı muhtemelen aylarca sürecek kapsamlı bir endüstriyel çaba gerektirecektir."
 wtt_news.40.desc_not_eng:0 "Sadece cüretkar ve parlak bir askeri operasyon olarak tanımlanabilecek bir olayda, [From.GetNameDef] Süveyş Kanalı olan hayati ticaret arterini kesmeyi başardı. Blok gemileri, yıkımlar ve mayınlama kombinasyonuyla, yıkım oldukça tamamlandı ve onarımı muhtemelen aylarca sürecek kapsamlı bir endüstriyel çaba gerektirecektir."
 wtt_news.40.e:0 "İngilizlere karşı muhteşem bir darbe!"
 wtt_news.40.f:0 "Doğru kararı verdiler."
 wtt_news.40.g:0 "Müttefikimize karşı büyük bir darbe..."
 wtt_news.40.h:0 "Bu tüm dünyayı etkileyecek..."
 wtt_news.40.t:0 "Süveyş Kanalı Patlatıldı"
 wtt_news.41.a:0 "Bir felaket!"
 wtt_news.41.b:0 "Düşmanın kullanmasına izin veremezdik."
 wtt_news.41.c:0 "Kararlılıklarını bir daha hafife almayacağız."
 wtt_news.41.d:0 "Donanmaları uzak tarafta mahsur kaldı!"
 wtt_news.41.desc_not_usa:0 "Sadece cüretkar ve parlak bir askeri operasyon olarak tanımlanabilecek bir olayda, [From.GetNameDef] Panama Kanalı olan hayati askeri iletişim arterini kesmeyi başardı. Blok gemileri, yıkımlar ve mayınlama kombinasyonuyla, yıkım oldukça tamamlandı ve onarımı muhtemelen aylarca sürecek kapsamlı bir endüstriyel çaba gerektirecektir."
 wtt_news.41.desc_usa:0 "Panama Kanalı'nı savunamamalarına ve hayati askeri iletişim arterini düşmana kaybetme riskine karşılık, [From.GetNameDef] bunun yerine kanalın kullanımını onlara engellemek için kanalı patlatmayı seçti. Blok gemileri, yıkımlar ve mayınlama kombinasyonuyla, yıkım oldukça tamamlandı ve onarımı muhtemelen aylarca sürecek kapsamlı bir endüstriyel çaba gerektirecektir."
 wtt_news.41.e:0 "Amerikalılara karşı muhteşem bir darbe!"
 wtt_news.41.f:0 "Doğru kararı verdiler."
 wtt_news.41.g:0 "Müttefikimize karşı büyük bir darbe..."
 wtt_news.41.h:0 "Pasifik ve Atlantik bir kez daha bölündü."
 wtt_news.41.t:0 "Panama Kanalı Patlatıldı"
 wtt_news.42.a:0 "İmparatorluğumuza olan bağlantıyı yeniden kurduk."
 wtt_news.42.b:0 "Ulusumuz için gerekli bir yatırım."
 wtt_news.42.c:0 "Bu, çabalarımıza büyük ölçüde yardımcı olacaktır."
 wtt_news.42.d:0 "Aksiliği ortadan kaldırdılar..."
 wtt_news.42.desc:0 "Muazzam bir endüstriyel çabayla [From.GetNameDef], Süveyş Kanalı'nı onarmayı başardı. Bu sabah, yarım yıldan fazla süren yoğun onarım çalışmalarının ardından hayati ticaret arterinin Akdeniz'e yeniden açılışına tanık oldu."
 wtt_news.42.e:0 "Etkileri herkes tarafından hissedilecektir."
 wtt_news.42.t:0 "Süveyş Kanalı Onarıldı"
 wtt_news.43.a:0 "Okyanuslarımız arasındaki hayati bağlantıyı yeniden kurduk."
 wtt_news.43.b:0 "Bir kez daha Pasifik'ten Atlantik'e geçebiliriz."
 wtt_news.43.c:0 "Bu, çabalarımıza büyük ölçüde yardımcı olacaktır."
 wtt_news.43.d:0 "Aksiliği ortadan kaldırdılar..."
 wtt_news.43.desc:0 "Muazzam bir endüstriyel çabayla [From.GetNameDef], Panama Kanalı'nı onarmayı başardı. Bu sabah, bir yıldan fazla süren yoğun onarım çalışmalarının ardından Atlantik ve Pasifik arasındaki hayati askeri bağlantının yeniden açılışına tanık oldu."
 wtt_news.43.e:0 "Etkileri herkes tarafından hissedilecektir."
 wtt_news.43.t:0 "Panama Kanalı Onarıldı"
 wtt_news.44.a:0 "Cennetin Oğlu geri dönüyor."
 wtt_news.44.b:0 "Bir yanlış düzeltildi."
 wtt_news.44.c:0 "Kendini ne sanıyor?"
 wtt_news.44.d:0 "Oldukça iyi bir geri dönüş."
 wtt_news.44.desc:0 "Bir Çin İmparatoruna yakışır zengin süslemeli cüppeler giyen, [MAN.GetLeader], Cennetin Oğlu, On Bin Yılın Efendisi, Büyük Qing Hanedanlığı İmparatoru, alışılmadık bir ikinci Taç Giyme töreninde Ejderha Tahtı'na oturdu ve şimdi atalarının yaptığı gibi Yasak Şehir'de ikamet ediyor. Eski geleneklere atıfta bulunan [MAN.GetLeader], kuvvetlerinin Çin İç Savaşı'ndaki zaferinin, Çin'i yönetmek için cennetten bir Vekalet sahibi olduğunu kanıtladığını iddia ediyor.\n\nÖnceki İmparatorların iddia ettiği gibi, yönetimini 'Cennetin Altındaki Her Şeyi' kapsayana kadar yayma niyetinde olup olmadığı ise henüz belli değil."
 wtt_news.44.e:0 "Saçmalık!"
 wtt_news.44.t:0 "[MAN.GetLeader] Cennetin Vekaletini talep ediyor"
 wtt_news.45.a:0 "Siyaset. Siyaset asla değişmez."
 wtt_news.45.b:0 "Çarpıcı bir başarı."
 wtt_news.45.c:0 "Şiddetten daha tercih edilir."
 wtt_news.45.d:0 "Bir İç Savaşı yeni atlatmış olabilirler."
 wtt_news.45.desc:0 "[old_leader.GetLeader] ve [new_leader.GetLeader] arasındaki kapsamlı bir Güç Mücadelesinin ardından, birincisi nihayet yenilgiyi kabul etti ve [new_leader.GetLeader] ile konutunda buluştu. Sadece iki saatlik müzakerelerin ardından, [old_leader.GetLeader]'in, gücü [new_leader.GetLeader]'e devretme ve Cumhuriyet Başbakanı olarak istifa etme teklifini açıkça kabul ettiği görülüyor. \n\nİki liderin destekçi grupları daha önce evin dışında toplanmış, sonuca bağlı olarak iki taraf arasında şiddetli çatışma korkularını tetiklemişti.\n\nAncak, herhangi bir şiddet bildirilmedi ve güç geçişinin oldukça sorunsuz olduğu görülüyor."
 wtt_news.45.t:0 "[new_leader.GetLeader] Çin'de Ulusal Liderliği alıyor"
 wtt_news.46.a:0 "Doğrudan bir tehdit."
 wtt_news.46.b:0 "Tüm Çin'i birleştireceğiz!"
 wtt_news.46.d:0 "Daha iyi adamlar başarısız oldu."
 wtt_news.46.desc:0 "Bir grup destekçinin önünde konuşan [From.GetLeader], bugün hükümetinde büyük bir değişiklik duyurdu. Daha önce, [From.GetLeader] Çin'in bazı bölgelerinin büyük ölçüde bağımsız olmasını tolere etmeye istekliydi. Bu artık sona erdi. Bugünden itibaren, [From.GetNameDef] tüm Çin'i tek Çin hükümeti olarak kendi sorumluluğu olarak kabul edecektir. Tek meşru Çin hükümetinden emirleri reddeden herkes bir isyancı veya hain olarak kabul edilecek ve buna göre muamele görecektir. \n\nAncak, [From.GetLeader] Hükümeti'nin tehdidi yerine getirip getiremeyeceği veya bunun sadece nüfusta desteği artırmak için tasarlanmış bir propaganda hamlesi olarak kalıp kalmayacağı henüz belli değil."
 wtt_news.46.t:0 "[From.GetLeader] Tek Çin Politikasını ilan ediyor"
 wtt_news.47.a:0 "Birinin yapması gerekiyordu."
 wtt_news.47.b:0 "Gelin de alın!"
 wtt_news.47.c:0 "Bundan kesinlikle kötü bir şey çıkmayacak."
 wtt_news.47.d:0 "Bizi oraya gelmeye zorlamayın!"
 wtt_news.47.desc:0 "[From.GetLeader] hükümeti, Çinhindi'ndeki mevcut durumun [From.GetAdjective] güvenliğine açık ve mevcut bir tehlike arz ettiğini ilan etti. Resmi açıklamada, dünyadaki hiçbir hükümetin bu şekilde yumuşak karnına saplanmış bir hançeri kabul etmeyeceği belirtildi. Bölge pasifize edilmedikçe veya [671.Controller.GetAdjective] yetkilileri [From.GetNameDef] ile çalışmaya daha istekli valilerle değiştirilmedikçe, [From.GetAdjective] çıkarlarına yönelik tehdit devam edecektir.\n\n[From.GetLeader] için bir sözcü, [From.GetAdjective] Hükümeti'nin barışçıl bir çözüm arayacağını vurgulasa da, askeri seçenek göz ardı edilmedi."
 wtt_news.47.t:0 "[From.GetNameDefCap] Çinhindi'ni talep ediyor"
 wtt_news.48.a:0 "Yavru köpek kükrüyor mu?"
 wtt_news.48.b:0 "Kaderimizi talep edeceğiz!"
 wtt_news.48.c:0 "O küçük hain!"
 wtt_news.48.d:0 "Ejderha... Güneş'e mi saldırıyor?"
 wtt_news.48.desc:0 "Japon yöneticiler ile [MAN.GetLeader] hükümeti arasındaki iç güç mücadeleleri döneminin ardından, Mançurya'daki üstünlük mücadelesi nihayet kaynama noktasına ulaştı. \n\nBildirildiğine göre çatışma, İmparatorluk Hanesi'nde bir Japon Generalin Mançukuo İmparatoru'na eğilmesini talep ederek hakaret ettiği bir olayla başladı.\n\nÖfkeli, [MAN.GetLeader] \"Cennetin Oğlu eğilmiyor\" diye yanıtladı ve General'e bastonuyla vurdu. ordusuna tüm Japon askerlerini derhal Çin topraklarından çıkarma emrini verdi."
 wtt_news.48.t:0 "Mançurya Bağımsızlık Savaşı"
 wtt_news.5.a:0 "Her şey mükemmel gitti."
 wtt_news.5.b:0 "Çok yaşa Kral!"
 wtt_news.5.c:0 "Almanların bu işte bir parmağı olmalı..."
 wtt_news.5.desc:0 "Roma'dan gelen raporlar, Il Duce'nin bugün erken saatlerde şehrin sokaklarında gün ışığında vurularak öldürüldüğünü gösteriyor. Aynı zamanda, hükûmetteki unsurlar İtalyan faşistlerinden iktidarı ele geçirmek için harekete geçti. Bir dizi tutuklama yapıldı ve askerî birlikler hükûmet binalarını ve sokaklarını kordon altına alarak sokağa çıkma yasağı ilan etti.\n\nDarbe hükûmetinin sözcüleri III. Vittorio Emanuele'ye sadakatlerini açıkladılar ve İtalya'nın lideri olarak ilk icraatında Kral, Alman İmparatorluğu ile bir ittifak antlaşması imzaladı."
 wtt_news.5.t:0 "Mussolini'ye Suikast Düzenlendi"
 wtt_news.50.a:0 "Aşağılık ihanet!"
 wtt_news.50.b:0 "Durum düzelmedi."
 wtt_news.50.c:0 "Kurtulduk!"
 wtt_news.50.d:0 "Onları çok ileri itti."
 wtt_news.50.desc:0 "Alman radyosu bugün, ordunun hain unsurlarının bir darbe girişiminde bulunduğunu duyurdu. Führer Karargahı'ndaki bir patlamanın Hitler'i öldürmesi ve birkaç kişiyi yaralamasının ardından, ordu birlikleri bir dizi SS ofisine ve birimine saldırdı. \n\n[GER.GetLeader] ülkenin ve ordusunun tam kontrolüne sahip olduğunu iddia etse de, ülke genelinde sadık ve isyancı güçler arasında çatışma haberleri gelmeye devam ediyor.\n\nSöylentilere göre, Nazi partisinin diğer önde gelen üyeleri, kaos içinde kendi güç kapma planlarını yapıyor."
 wtt_news.50.t:0 "Hitler'e Suikast Düzenlendi"
 wtt_news.51.c:0 "Sonun başlangıcı mı?"
 wtt_news.51.desc:0 "Alman radyosu bugün ordudaki hain unsurların darbe girişiminde bulunduğunu duyurdu. Führer Karargahında mucizevi bir şekilde Hitler'i hafif yaralayan ve birkaç kişiyi yaralayan patlamanın ardından, ordu birimleri Berlin'deki birçok hükümet dairesinin kontrolünü ele geçirmeye çalıştı. \n\n[GER.GetLeader]'nin hayatta kaldığı haberi hızla yayıldı ve darbecilerin kontrolü altındaki birimlerin çoğu kışlalarına geri döndü.\n\nBir dizi üst düzey Alman subayı, başarısız girişimin ardından, kötü şöhretli bir duruşmanın utancıyla yüzleşmek yerine intihar etti. \"Halk Mahkemesi\"."
 wtt_news.51.t:0 "[GER.GetLeader]'e Suikast Girişimi"
 wtt_news.52.desc:0 "Alman radyosu bugün, [GER.GetLeader]'in hükümeti devraldığını duyurdu. Führerbunker'deki bir çatışmanın ardından, Führer ölümcül şekilde yaralandı, SS birimleri Berlin'den çıkan tüm ana yolları ve demiryolu kavşaklarını hızla ele geçirmek için harekete geçti. Bu arada, Luftwaffe ve Heer birimlerinin düzeni yeniden sağlamak için Berlin'e yakınlaşmaları emredildiği bildirildi."
 wtt_news.53.a:0 "Tüm İskandinavlar için şanlı bir gün!"
 wtt_news.53.b:0 "İskandinavya birlikte daha güçlü."
 wtt_news.53.c:0 "Uzun sürmeyecek!"
 wtt_news.53.desc:0 "Silah zoruyla, [From.GetOldName] İskandinav halklarını kendi yönetimi altında birleştirdi ve hükümeti şimdi yeni fethedilen toprakları entegre ediyor. Halkı devletin arkasında toplama girişiminde, hükümetin açık desteğiyle pan-milliyetçi propagandada bir artış oldu.\n\nBir yan etki olarak, İskandinav birleşmesi taraftarları şimdiden tarihi paralelliklere atıfta bulunmaya ve mevcut durumun bölgeyi birleştirme konusundaki daha önceki girişimlerin sadece doğal bir devamı olarak nasıl görülebileceğine işaret etmeye başladılar. [From.GetOldAdjective] hükümeti, bu düşünce tarzının vagonuna hevesle atladı ve şimdi resmi olarak bir 'Kalmar Birliği'nin restorasyonunu' ilan ederek, ülkeyi '[From.GetNameDef]' olarak yeniden adlandırdı."
 wtt_news.53.t:0 "İskandinavya'nın Birleşmesi"
 wtt_news.54.a:0 "Birleşik Kuzey güçlü duracak!"
 wtt_news.54.b:0 "Kuzey, komşuları için sorunlu olabilir..."
 wtt_news.54.desc:0 "İskandinav bölgesine ait tüm ulusların fethiyle birlikte, [From.GetOldAdjective] hükümeti artık yeni fethedilen bölgelerin entegrasyonuna yönelik hamleleri artırmaya başladı. Sonuç olarak, halkı devletin arkasında toplama çabasıyla, hükümetin açık desteğiyle pan-milliyetçi propagandada bir artış oldu.\n\nBir [From.GetOldAdjective] yetkilinin, \"İskandinav ülkeleri her zaman birbirlerine karşı güçlü bir akrabalık hissetmiştir. Bir olmaları ve halklarımızın bir arada, yan yana yaşaması doğaldır.\" Görünüşe göre hükümet bu akrabalığı insanları birleştirmenin bir yolu olarak kullanmaya karar verdi ve şimdi ülkenin adını '[From.GetNameDef]' olarak değiştirerek \"gerçek İskandinav birliğini\" ilan etti."
 wtt_news.54.t:0 "Kuzey Ülkelerinin Birleşmesi"
 wtt_news.55.a:0 "Birleşik bir Latin Amerika hayali bekliyor!"
 wtt_news.55.b:0 "Yeni bir Amerikan süper gücünün doğuşu mu?"
 wtt_news.55.desc:0 "Eski Gran Kolombiya'ya ait tüm toprakları geri alan [From.GetOldAdjective] hükümeti, şimdi yeni fethedilen bölgelerin entegrasyonuna yönelik hamleleri artırmaya başladı. Sonuç olarak, insanları devletin arkasında toplama çabasıyla, hükümetin açık desteğiyle pan-milliyetçi propagandada bir artış oldu. \n\n[From.GetOldAdjective] yetkilileri, tüm Kuzey Güney Amerika'nın ortak tarihlerine bakması ve bu akrabalığı birleşik bir devletin temeli olarak kullanması gerektiğine olan inançlarını defalarca dile getirdiler. Şimdi, [From.GetOldAdjective] hükümeti bir adım daha ileri giderek ülkenin adını '[From.GetNameDef]' olarak değiştirerek \"Bolivar'ın mirasının yeniden canlandığını\" ilan etti."
 wtt_news.55.t:0 "[From.GetNameDef]'in Yeniden Doğuşu"
 wtt_news.56.a:0 "Indivisibiliter ac inseparabiliter!"
 wtt_news.56.b:0 "İkili Monarşi yeniden yükseliyor."
 wtt_news.56.desc:0 "Avusturya-Macaristan İmparatorluk topraklarının tamamını güvence altına alan [From.GetOldAdjective] hükümeti, kalan son halef devletin temsilcileri olarak şimdi bu bölgeleri yeniden birleştirmeye başladı. Hükümetin yönlendirdiği propaganda alevlendi ve halkı geniş çaplı ulusal reformların ve imparatorluk normlarına dönüşün arkasında toplamak için açık bir çabayla \"İmparatorluğun görkemli günlerini\" övdü. \n\nA Bunların bir parçası olan [From.GetOldAdjective] hükümeti, [From.GetNameDef]'nin restorasyonunu duyurdu ve ülkenin resmi adını şu şekilde değiştirdi: bunu yansıt."
 wtt_news.56.t:0 "[From.GetNameDef]'in Yeniden Doğuşu"
 wtt_news.57.a:0 "Eğer Tanrı bizimleyse, kim bize karşı olabilir?"
 wtt_news.57.b:0 "Bu sefer bölünmeden kurtulabilecek mi?"
 wtt_news.57.desc:0 "Polonya ve Litvanya bir kez daha tek bir devlet tarafından yönetildiğinde, [From.GetOldAdjective] hükümeti, halkı politikalarının arkasında birleştirmek amacıyla propagandasını tarih üzerine kurmaya başladı. 'Tarih uzmanları', birleşik bir Polonya ve Litvanya'nın sınırlarındaki tehditlere karşı nasıl durabileceğine dair çeşitli yollarla nüfusu bombardımana tutuyor, Lehistan-Litvanya Birliği'nin gücünün zirvesinden hikayeler anlatıyor. Bu yaklaşım, halkın öfkesini yönlendirmede ve düşüncelerini eski şanlı günlere odaklamada bir miktar etki yaratıyor gibi görünüyor.\n\nBugün, [From.GetOldAdjective] hükümeti bu adımı bir adım daha ileri götürdü ve Birliğin restorasyonunu ilan ederek ülkeyi '[From.GetNameDef]' olarak yeniden adlandırdı."
 wtt_news.57.t:0 "[From.GetNameDefCap]'in yeniden doğuşu"
 wtt_news.58.a:0 "1815'te amaçlandığı gibi tekrar birleşti..."
 wtt_news.58.b:0 "Evet... Bunların hepsi bir iç mesele gibi görünüyor..."
 wtt_news.58.desc:0 "Diğer Aşağı Ülkelerin [From.GetOldAdjective] fethiyle, hükümetleri eylemlerini oldukça sesli bir şekilde savundu. Şimdi kendilerinin Hollanda Birleşik Krallığı'nın acil ve yasal halefleri olduklarını iddia ediyorlar ve 1839 Londra Antlaşması'nı, o zamanlar hükümetlerine dış güçler tarafından suç teşkil edecek şekilde zorla kabul ettirildiği iddiasıyla reddettiler. Böylece, ulus hiçbir zaman var olmaktan vazgeçmediği için, [From.GetOldNameDef] sadece zaten kendilerine ait olan topraklar üzerinde kontrolü yeniden sağladı.\n\nSözlerinin ardından, [From.GetOldAdjective] hükümeti ülkeyi '[From.GetNameDef]' olarak yeniden adlandırdı ve mevcut küresel krizleri karşı durulacak bir dış tehdit olarak kullanarak halkı birleştirme girişiminde büyük propaganda çabaları zaten devam ediyor."
 wtt_news.58.t:0 "Aşağı Ülkelerin Yeniden Birleşmesi"
 wtt_news.59.a:0 "Dünya sahnesine yükselmek için gerekli bir ilk adım."
 wtt_news.59.b:0 "Başka bir Amerika Birleşik Devletleri doğuyor."
 wtt_news.59.desc:0 "Diğer Orta Amerika devletlerinin [From.GetOldAdjective] fethiyle, hükümetleri uluslararası alanda eylemlerini oldukça sesli bir şekilde savundu. Kendini Orta Amerika Federal Cumhuriyeti'nin yasal halefi olarak gören, 1830'ların sonlarında ayrılan ulusları yasadışı ayrılıkçı hükümetler olarak damgaladı ve son çatışmalara sürekli olarak bu topraklar üzerinde 'kontrolü yeniden sağlama' haklı girişimleri olarak atıfta bulunuyor.\n\nSözlerinin ardından, [From.GetOldAdjective] hükümeti ülkeyi '[From.GetNameDef]' olarak yeniden adlandırdı ve mevcut küresel krizleri karşı durulacak bir dış tehdit olarak kullanarak halkı birleştirme girişiminde büyük propaganda çabaları zaten devam ediyor."
 wtt_news.59.t:0 "[From.GetNameDef]'in Yeniden Doğuşu"
 wtt_news.6.a:0 "Ve tek bir kurşun bile atmak zorunda kalmadık."
 wtt_news.6.b:0 "Bir kez daha birleştik!"
 wtt_news.6.c:0 "Avrupa'da yeni bir güç bloğu mu? Endişe verici."
 wtt_news.6.desc:0 "Avusturya-Macaristan İmparatorluğu'nun Tuna halefi devletleri son zamanlarda İmparatorluk yanlısı bir duygu dalgası geçirdi ve [From.GetOldNameDef] liderliğinde, şimdi kendi ülkelerini bir kez daha Avusturya-Macaristan'a birleştirmeyi seçtiler.\n\nYeni Avusturya-Macaristan hükûmeti derhal Alman İmparatorluğu ile resmi bir ittifak antlaşması imzalamak için adımlar attı ve Alman anti-İngiliz ve anti-Fransız dış politikasına açıkça desteklerini verdi."
 wtt_news.6.t:0 "Avusturya-Macaristan Yeniden Kuruldu"
 wtt_news.60.a:0 "Hayatta kalmamız için bu gerekli."
 wtt_news.60.b:0 "Ama yeni devlet yeterince güçlü olacak mı?"
 wtt_news.60.desc:0 "Baltık ülkelerine ait tüm toprakların fethedilmesiyle [From.GetOldAdjective] hükümeti yeni fethedilen bölgelerin entegrasyonuna yönelik hamleleri artırmaya başladı. Sonuç olarak, halkı devletin arkasında toplamak amacıyla, hükümetin açık desteğiyle pan-milliyetçi propagandada bir artış oldu. \n\nA [From.GetOldAdjective] yetkilisinin şu sözleri kaydedildi: \"Baltık ülkeleri her zaman birbirlerine karşı güçlü bir akrabalık duygusuna sahip olmuştur. Özellikle sınırlarımızdaki tehditler ışığında birlik olmaları çok doğaldır. Halklarımız ancak bir arada durarak olabilir.\" bağımsız ve özgür kal.\" Bu nedenle artık ülkenin adını '[From.GetNameDef]' olarak değiştirerek \"gerçek Baltık birliğini\" ilan ettiler."
 wtt_news.60.t:0 "Baltıkların Birleşmesi"
 wtt_news.61.a:0 "Sonunda bölünmeleri ortadan kaldırdık!"
 wtt_news.61.b:0 "Ebedi Devlet yeniden yükseldi..."
 wtt_news.61.desc:0 "Savaş öncesi Osmanlı topraklarının tamamını güvence altına alan [From.GetOldAdjective] hükümet, Osmanlı halefi devletinin temsilcileri olarak şimdi bu bölgeleri yeniden birleştirmeye başladı. Büyük Savaş'ta Müttefiklerin bölünmesini kınayan ve yeni fethedilen toprakların nüfusunu geniş çaplı ulusal reformlar ve imparatorluk normlarına dönüş arkasında toplama çabasıyla \"İmparatorluğun ihtişamlı günlerini\" överek hükümet güdümlü propaganda alevlendi.\n\nBunların bir parçası olarak, [From.GetOldAdjective] hükümeti, [From.GetNameDef] ve bunu yansıtacak şekilde ülkenin resmi adını değiştirdi."
 wtt_news.61.t:0 "[From.GetNameDef]'in Yeniden Doğuşu"
 wtt_news.62.a:0 "Bu tüm Avrupa savaşının sonu mu?"
 wtt_news.62.b:0 "Bakalım başarabilecekler mi."
 wtt_news.62.desc:0 "Kıta Avrupası'nın büyük güçleri [From.GetOldNameDef] karşısında yenilgiye uğradı. Birleşik Avrupa düşüncesi, yakın tarihte ilk kez ulaşılabilir bir hedef gibi görünüyor. Muhtemelen hükûmetten maaş alan çeşitli \"uzmanlar\", mevcut siyasi düzeni \"Avrupa'da gelecekteki çatışmaları önlemenin\" tek yolu olarak sunmaya başladı.\n\n\"Bütün Avrupalılar için bir ulus\" görüntüsü oluşturmak amacıyla ulusal ve yerel yönetim reformları hızla uygulamaya konuluyor. Bugün, \"bütün Avrupalıların kendilerini evlerinde hissetmesi\" için ülkenin bundan böyle '[From.GetNameDef]' adıyla anılacağı duyuruldu."
 wtt_news.62.t:0 "Avrupa'nın Birleşmesi"
 wtt_news.63.a:0 "Afrikalılar için bir Afrika!"
 wtt_news.63.b:0 "Bu sömürge Afrika'sının sonu mu?"
 wtt_news.63.desc:0 "[From.GetOldAdjective] ulusu komşularına doğru büyüdükçe, hükümetin tarihi süreklilik yaratma girişimleri, halkı birleştirme girişiminde olduğu açıkça giderek daha belirgin hale geldi. Büyük Zimbabve İmparatorluğu'nun başarıları güçlü bir şekilde romantikleştirildi, ancak aralıksız propaganda kamuoyu üzerinde bir etki yaratıyor gibi görünüyor.\n\nBugün, [From.GetOldAdjective] hükümeti bu adımı bir adım daha ileri götürdü ve bölgenin tarihine saygı duruşunda bulunarak ülkeyi '[From.GetNameDef]' olarak yeniden adlandırdı, umarım bu bölgedeki herkesin bağ kurabileceği bir şeydir."
 wtt_news.63.t:0 "[From.GetNameDef]'in Yükselişi"
 wtt_news.64.a:0 "Roma Invicta!"
 wtt_news.64.b:0 "Ciddi olamazlar!"
 wtt_news.64.desc:0 "[From.GetOldAdjective] askeri ilerleme tamamen durdurulamaz görünüyor ve son yıllarda pek çok kişinin küçümsediği fikir - yeni bir Roma İmparatorluğu'nun yaratılması - artık tamamen İtalyanların elinde görünüyor. Onlara karşı çıkabilecek kıta Avrupası güçlerinin çoğu neredeyse ortadan kaldırıldı ve İtalyanlar, fethedilen halklara kendi isteklerini uygulama konusunda özgür kaldı.\n\nİtalyan hükümeti, halihazırda \"yeniden fethedilen Roma Toprakları\" olarak adlandırmaya başladıkları toprakların entegrasyonuna başlamanın yanı sıra, şimdi de Roma İmparatorluğu'nun yeniden doğuşunu duyurdu ve ulusun adını '[From.GetNameDef]' olarak değiştirdi."
 wtt_news.64.t:0 "[From.GetNameDef]'in Yükselişi"
 wtt_news.65.a:0 "Gücümüz artmaya devam ediyor!"
 wtt_news.65.b:0 "Bölgeye barış ve istikrar getirecek mi?"
 wtt_news.65.desc:0 "[From.GetOldAdjective] ilerlemesi devam ederken, tarihi paralellikler Fars tarihinde bilgili olanların gözünden kaçmadı. Önde gelen halk figürleri şimdiden bu genişlemeyi Büyük Kiros zamanlarıyla karşılaştırmaya başladılar ve [From.GetOldAdjective] toplumu genelinde milliyetçi gurur yükseliyor.\n\nHükümet kontrolü yeni toprak kazanımları üzerinde genişletildikçe ve hükümet bu yüksek halk onayı dalgasında ilerledikçe, şimdi yetkililer tarafından ulusun resmi olarak '[From.GetNameDef]' olarak yeniden adlandırılacağı doğrulandı."
 wtt_news.65.t:0 "[From.GetNameDef]'in Yükselişi"
 wtt_news.66.a:0 "Yeniden fetih başlasın."
 wtt_news.66.b:0 "Mucizevi bir talih dönüşü..."
 wtt_news.66.desc:0 "[From.GetOldAdjectiveCap] yükselişi, dünya genelindeki birçok askeri uzmanı şaşırttı, ancak sonuçlar kendi adına konuşuyor. Sadece birkaç yıl içinde, Yunanlılar Balkanları tamamen domine ettiler, İstanbul'u yeniden fethettiler ve Anadolu'daki herhangi bir organize Türk direnişini ezdiler. Görünüşe göre, beş asırdan fazla süren Yunan-Türk çatışmasının nihai sonucu şimdiye ulaşıldı.\n\nUlusal gururu daha da artırmak için, [From.GetOldAdjectiveCap] hükümeti tarihi sürekliliği kullandı ve askeri başarılarını 'Türk istilacısına karşı bir Bizans yeniden fethi' olarak biçimlendirdi. Bu propagandanın bir parçası olarak ve yeni adı Konstantinopolis olan şehirde abartılı bir tören geçidinin ortasında, [From.GetOldNameDef]'in resmi adını '[From.GetNameDef]' olarak değiştirdiği duyuruldu."
 wtt_news.66.t:0 "[From.GetNameDef]'in Yükselişi"
 wtt_news.67.a:0 "Zeydan'ın rüyası gerçekleşti."
 wtt_news.67.b:0 "Bu bölgede kalıcı bir barışa yol açacak mı?"
 wtt_news.67.desc:0 "Arap Yarımadası'nın çoğunun [From.GetOldAdjective] fethiyle, hükümet bölgede yayılan yenilenmiş bir Pan-Arabizm dalgasını ele geçirdi. Uluslararası anlaşmazlıklar, inatçı yabancı hükümetlerin askeri yollarla tamamen ortadan kaldırılmasıyla 'çözüldüğünde', Arap birleşmesi kolay ulaşılabilir göründü ve [From.GetOldAdjective] hükümeti bu hedefi takip etme istekliliğini zaten gösterdi.\n\nSadece bu halk iyi niyetinin 'dalgasında sörf yapmak', tüm Araplara bir yuva olarak hitap etmek veya sadece bölgesel entegrasyonu kolaylaştırmak için olsun, [From.GetOldAdjective] yetkilileri şimdi ulusun resmi adının '[From.GetNameDef]' olarak değiştirileceğini doğruladı."
 wtt_news.67.t:0 "Arabistan'ın Birleşmesi"
 wtt_news.68.a:0 "Bu Asya sömürgeciliğinin sonu!"
 wtt_news.68.b:0 "Kendi kaderlerini ele geçirdiler."
 wtt_news.68.desc:0 "[From.GetOldAdjective] ulusu komşularına doğru büyüdükçe, hükümetin tarihi süreklilik yaratma girişimleri, halkı birleştirme girişiminde olduğu açıkça giderek daha belirgin hale geldi. Diğerlerinin yanı sıra Majapahit İmparatorluğu'nun başarıları güçlü bir şekilde romantikleştirildi, ancak aralıksız propaganda kamuoyu üzerinde bir etki yaratıyor gibi görünüyor.\n\nBugün, [From.GetOldAdjective] hükümeti bu adımı bir adım daha ileri götürdü ve bölgenin tarihine saygı duruşunda bulunarak ülkeyi '[From.GetNameDef]' olarak yeniden adlandırdı, umarım bu bölgedeki herkesin bağ kurabileceği bir şeydir."
 wtt_news.68.t:0 "[From.GetNameDef]'in Yükselişi"
 wtt_news.69.a:0 "Hegemonyamızı yeniden tesis ettik."
 wtt_news.69.b:0 "Sömürge İmparatorlukları çöküyor mu?"
 wtt_news.69.desc:0 "[From.GetOldAdjective] ulusu komşularına doğru büyüdükçe, hükümet Rattanakosin adından ayrılışlarını yeniden değerlendirdi. Mevcut sınırları krallığın tarihi zirvesindekilere giderek daha çok benzediği için, Rattanakosin Krallığı'nın başarıları kamuoyunu etkilemek için giderek daha fazla kullanıldı.\n\nBugün, [From.GetOldAdjective] hükümeti bu adımı bir adım daha ileri götürdü ve tarihten meşruiyet sağlamak amacıyla ülkeyi resmi olarak '[From.GetNameDef]' olarak yeniden adlandırdı."
 wtt_news.69.t:0 "[From.GetNameDef]'in Yeniden Doğuşu"
 wtt_news.7.a:0 "'Danzig ya da savaş' mı? Hah! Diplomasi yine galip geldi."
 wtt_news.7.b:0 "Umarım bedeline değmiştir."
 wtt_news.7.c:0 "Almanlar nüfuz alanımıza müdahale ediyor..."
 wtt_news.7.d:0 "Her ikisi için de faydalı bir anlaşma mı? Göreceğiz."
 wtt_news.7.desc:0 "Polonya hükûmeti, askerî garantiler karşılığında Danzig'in iadesi için bir Alman teklifini kabul etti. Polonyalılara, kendilerine karşı herhangi bir düşmanlık durumunda Almanların yardımlarına geleceğini garanti eden bir antlaşma hazırlandı.\n\nBedeli yüksek olsa da, Polonyalıları bir kez daha denizden tamamen kesmiş olsa da, Doğu'daki komünist tehdit ışığında buna değmiş olabilir."
 wtt_news.7.t:0 "Polonya Danzig'i Geri Verdi"
 wtt_news.70.a:0 "Aquila Elegit Iovis Omnia Vincit!"
 wtt_news.70.b:0 "İhtişamı ve görkemi inkar edilemez!"
 wtt_news.70.desc:0 "[FROM.GetLeader] yönetimi altında, [From.GetOldNameDef] sınırlarını büyük ölçüde genişletti, hatta eski Kutsal Roma İmparatorluğu'nunkileri bile aştı. Yönetimine meydan okuyacak tüm kıta düşmanları [From.GetOldAdjective] askeri makinesi tarafından dize getirildi ve politikalarını daha da sürdürmekte rakipsiz bırakıldı.\n\nŞimdi, [FROM.GetLeader.GetSheHe] mevcut fırsatın değerlendirileceğini ve ulusun Kutsal Roma İmparatorluğu'nun manevi halefi olacağını kararnameyle ilan etti. Bunu temsil etmek için, ulus şimdi resmi olarak yeniden adlandırıldı ve bununla birlikte nihayet İmparatorların yüzyıllardır kaçırdığı bölgenin siyasi birliğini sağladı."
 wtt_news.70.t:0 "[From.GetNameDef]'in Yeniden Doğuşu"
 wtt_news.8.a:0 "Yeniden inşa başlasın."
 wtt_news.8.b:0 "Umarım yeni rejim daha uzlaşmacı olur..."
 wtt_news.8.desc:0 "Almanya'yı sarsan iç savaş şimdi sona erdi. Çatışmalar olağanüstü yoğundu, Nazilerin fanatik direnişi Büyük Savaş'ı andıran bir ölçekte yıkıma neden oldu.\n\nHitler'in öldüğü, Nazi liderliğinin ise hapsedildiği veya idam edildiği anlaşılıyor. Geçici hükûmet şimdi, anayasal reformlar sürecine başlamadan önce devlet üzerindeki hakimiyetlerini güvence altına almanın ve ulusa istikrarın geri dönmesini sağlamanın gerekli olduğunu duyurdu."
 wtt_news.8.t:0 "Alman İç Savaşı Sona Erdi"
 wtt_news.9.a:0 "Tam da tuzağımıza düştüler!"
 wtt_news.9.b:0 "Bu onları kesinlikle düşündürecektir."
 wtt_news.9.c:0 "Umarım Almanlar bizi hayal kırıklığına uğratmaz..."
 wtt_news.9.d:0 "Durumu yatıştırmaya yardımcı olmuyorlar..."
 wtt_news.9.desc:0 "'Artan düşmanca Alman söylemi' olarak adlandırdıkları şeye yanıt olarak, Sovyet ordusu bu yıl düzenlenecek bir dizi büyük ölçekli askerî tatbikat duyurdu.\n\nSovyet Hükûmeti sözcülerine göre, artan hazırlık durumunun Almanları 'iftira niteliğindeki tiradlarına devam etmekten' caydırması umuluyor."
 wtt_news.9.t:0 "Sovyetler Büyük Ölçekli Tatbikatlar Duyurdu"
 wtt_prc.1.a:0 "Düşmanlarımıza karşı birleşmeliyiz."
 wtt_prc.1.b:0 "Bu ucuz numaraya kanmayacağız."
 wtt_prc.1.desc:0 "Yıllarca süren etkisiz çatışmadan sonra ve arka planda Japonya tehdidi belirirken, komünistler bize ortak bir hükûmet kurma teklifiyle yaklaştılar. Ordularımız yan yana savaşacak ve politikalarımızda koordine olacağız.\n\nKomünistlerin bu ani kalp değişikliğinin arkasındaki neden daha az açık ve hükûmetteki bazıları bunun sadece ülkeyi ele geçirme planının ilk aşaması olduğuna inanıyor."
 wtt_prc.1.t:0 "[From.GetLeader] bir ittifak öneriyor"
 wtt_prc.10.a:0 "Şansımızı Hükûmetle deneyeceğiz."
 wtt_prc.10.b:0 "O palavra atan aptal açıkça blöf yapıyor."
 wtt_prc.10.desc:0 "Ulusal Savunma Hükümeti'nin kurulmasının ardından [From.GetNameDef], hiçbir \"aşırı bağımsızlığa ve itaatsizliğe\" tolerans göstermediğini açıkça belirtti. Japonya'ya karşı savaş ihtimali giderek artarken, Ulusal Savunma Hükümeti'nin yanında yer almayan herkese potansiyel düşman muamelesi yapılacak ve [From.GetLeader], diz çökmeyi reddeden savaş ağalarına karşı bir hamle yapmak için bir savaşın çıkmasını beklemeyeceğini açıkça söyledi."
 wtt_prc.10.t:0 "[From.GetNameDefCap] İşbirliğimizi talep ediyor"
 wtt_prc.11.desc:0 "[From.GetLeader] aklını başına topladı ve İttifakımıza katılmaya karar verdi. Kuvvetleri şimdi gelecek savaşlarda bizi destekleyecek."
 wtt_prc.11.t:0 "[From.GetNameDefCap] Ulusal Savunma Hükûmetine katılıyor"
 wtt_prc.12.a:0 "Yola getirilecek."
 wtt_prc.12.desc:0 "Anlaşılması güç nedenlerle, [From.GetLeader] en temel konularda bile bizimle işbirliği yapmayı reddetti. Bizim sadece yakında ortadan kaldırılacak bir grup haydut olduğumuzu iddia ediyor ve diğer savaş ağalarını muhalefette ona katılmaya çağırdı."
 wtt_prc.12.t:0 "[From.GetNameDefCap] reddediyor"
 wtt_prc.2.a:0 "Ne kadar paranoyak."
 wtt_prc.2.desc:0 "Uzun bir müzakereden sonra, [From.GetLeader] delegasyonumuzu geri çevirmeye karar verdi. Hükûmet içindeki kaynaklarımız, onun her yerde komünist komploları gördüğünü ve bizim hükûmeti ele geçirmeye ve ülkeyi ondan çalmaya çalıştığımıza inandığını bildiriyor."
 wtt_prc.2.t:0 "[From.GetLeader] İttifakı reddediyor."
 wtt_prc.20.a:0 "Özür talep et."
 wtt_prc.20.b:0 "Birlikleri seferber et ve savaşa hazırlan."
 wtt_prc.20.c:0 "Kıtadan tamamen çekilmeliyiz."
 wtt_prc.20.desc:0 "Topraklarımıza yapılan son saldırıya ilişkin yeni detaylar ortaya çıktı. Şu ana kadar faillerden hiçbiri yakalanamamış olsa da, kanıtlar bunun Çinliler tarafından kasıtlı bir provokasyon olduğunu açıkça gösteriyor. \n\nÇin hükümeti saldırıyı kınamakta şüphe uyandıracak derecede yavaş davrandı ve Çin gazeteleri bunu \"Japon Emperyalizmine\" karşı kahramanca bir meydan okuma eylemi olarak selamladı.\n\nKabine, konuları tartışmak ve bariz saldırıyla başa çıkmak için önlemler önermek üzere toplandı."
 wtt_prc.20.t:0 "Çin Provokasyonu"
 wtt_prc.21.a:0 "Bunu kim yapar?"
 wtt_prc.21.desc:0 "[JAP.GetManchuriaPuppet]'deki fabrikalarımızdan birinden dün gece büyük bir yangın çıktığına dair raporlar geldi. Yerel itfaiyeciler hala alevlerle mücadele ediyor, ancak gün sonuna kadar yangını kontrol altına alacaklarından eminler. Yangının son derece yanıcı kimyasalların depolama alanında başlamış gibi görünmesi nedeniyle fabrikadaki hasarın önemli olduğu anlaşılıyor.\n\nAskerî İstihbarat, en katı güvenlik önlemlerine rağmen yangının nasıl çıkabildiğini bulmak için kapsamlı bir soruşturma başlattı. İlk ipuçları kundaklamayı güçlü bir olasılık olarak gösteriyor."
 wtt_prc.21.t:0 "Silah Fabrikası Sabote Edildi"
 wtt_prc.22.t:0 "Sivil Fabrika Sabote Edildi"
 wtt_prc.23.desc:0 "Dün gece bir ara, [JAP.GetManchuriaPuppet]'deki büyük bir demiryolu köprüsü, geçen bir mühimmat treninin ağırlığı altında çöktü. Kurtarma ve enkaz kaldırma çabaları, mühimmattan kaynaklanan ikincil patlamalar nedeniyle zorlaştı. Trenin mürettebatı hala kayıp, öldüğü varsayılıyor.\n\nAskerî İstihbarat, sağlam bir köprünün hiçbir uyarı işareti olmadan nasıl çökebildiğini bulmak için güvenli olur olmaz sahayı araştırmak üzere bir ekip gönderdi.\n\nYerel tanıklar, çökmeden bir gün önce köprünün altındaki vadide küçük bir grup gördüklerini bildirdi. Nerede oldukları şu anda bilinmiyor."
 wtt_prc.23.t:0 "Köprü Havaya Uçuruldu"
 wtt_prc.24.desc:0 "[JAP.GetManchuriaPuppet]'deki devriyelerimizden biri rapor vermedi. Devriyenin yolu boyunca çalışan bir arama ekibi, devriyenin şaşırtıldığı ve acımasız göğüs göğüse çarpışmada imha edildiğine dair işaretler bulunan bir savaş alanı buldu.\n\nSaldırganların herhangi bir zayiat verip vermediği şu anda bilinmiyor, ancak bulunan tek cesetler Japon Ordusu askerlerine ait.\n\nNeredeyse kasıtlı olarak bırakılmış gibi görünüyorlar, belki de bir mesaj göndermek için."
 wtt_prc.24.t:0 "Devriye Pusuya Düşürüldü"
 wtt_prc.30.a:0 "Eşek arısı kovanına çomak soktuk."
 wtt_prc.30.desc:0 "Gece karanlığından yararlanarak çalışan [JAP.GetManchuriaPuppet]'daki yoldaşlarımız, bir Japon fabrikasını sabote ettiler. Emperyalistler tüm bölgeyi kısıtlı alan ilan ettikleri için verilen hasar hakkında detaylar seyrek.\n\nBu gerçek tek başına bize doğru vurduğumuzu söylemeli. Bunun Japonları harekete geçirip geçirmeyeceği ise henüz belli değil."
 wtt_prc.30.t:0 "Provokasyon Başarılı"
 wtt_prc.31.desc:0 "Gece karanlığından yararlanarak çalışan [JAP.GetManchuriaPuppet]'daki yoldaşlarımız, hayati bir köprüyü sabote etmeyi başardılar. Küçük komando gücü, köprünün tamamen yok edildiğini ve çökerken bir mühimmat trenini de beraberinde götürdüğünü bildiriyor. \n\n\tBunun bir sabotaj eylemi olduğunu açıkça belirtmek için yerel halk tarafından görüldüklerinden emin oldular. Bunun Japonları harekete geçirip geçirmeyeceği ise henüz belli değil."
 wtt_prc.32.desc:0 "[JAP.GetManchuriaPuppet]'da bir Japon devriyesini başarıyla pusuya düşürüp yok ettik. Cesetleri, Emperyalistlerin doğru mesajı aldığından emin olmak için olay yerinde bırakıldı. \n\nZaman, bu eylemi savaşa gitmek için yeterli neden olarak görüp görmediklerini gösterecek."
 wtt_soviet_hold_city_d_fail:0 "Mevcut tüm kuvvetleri seferber eden [controller.GetAdjective] işgalcileri, [soviet_city.GetName] dışındaki savunmalarımızı paramparça etti. [controller.GetAdjective] kuvvetleri şehre girdi. Savunucularımız düşmanla şiddetli sokak savaşlarına girerken, şehrin günler içinde düşmesi bekleniyor."
 wtt_soviet_hold_city_d_success:0 "Düşman saldırısına rağmen, [soviet_city.GetName] savunucuları sağlam durdu ve düşmanı uzak tuttu. İşgalciler, alınan her santimetre toprak için ağır bir bedel ödeyerek savunmalarda kanlarını döktüler. [state.GetName] Kahramanlarının hikayeleri nesiller boyu hatırlanacak!"
 wtt_soviet_hold_city_o_fail:0 "Küçük bir aksilik."
 wtt_soviet_hold_city_o_success:0 "[soviet_city.GetName] bizim kalacak!"
 wtt_soviet_hold_city_t_fail:0 "[soviet_city.GetName] Düştü"
 wtt_soviet_hold_city_t_success:0 "[soviet_city.GetName] Ayakta Kaldı"
 wtt_the_hump.1.desc:0 "[occupying_country.GetAdjective] kuvvetleri [state_occupied.GetName]'deki birkaç havaalanını ele geçirdi ve Himalaya Rotası'nı uçan yerel hava taşıma kollarını tahliye etmeye zorladı. Düşman avcı uçağı faaliyetinin artması ve daha uzun menzillerin tek bir yakıt yüküyle hedefe ulaşmayı imkansız hale getirmesi tehdidiyle, hava köprüsü askıya alındı. Bu güzergahtan bize daha fazla ikmal ulaşamaz."
 wtt_the_hump.1.t:0 "Kambur Hava Köprüsü Askıya Alındı"
 wtt_the_hump.2.desc:0 "[From.GetAdjective] Hükûmeti, Himalayalar üzerindeki tüm uçuşların derhal durdurulmasını emretti. Acil protestolara rağmen, yaklaşımlarını yeniden gözden geçirebileceklerine dair herhangi bir belirti göstermediler."
 wtt_the_hump.2.desc_war_with_from:0 "[From.GetAdjective] birlikleri Kambur Hava Köprüsü'nde kullanılan havaalanlarını ele geçirdi, bu da bize hava yoluyla ikmal yapılmasını imkansız hale getirdi. Bu yoldan daha fazla ikmal beklenemez."
 wtt_the_hump.3.a:0 "İyi bir ilk adım."
 wtt_the_hump.3.desc:0 "İlk [From.GetAdjective] uçakları, Himalayalar üzerinden hayati önem taşıyan malzemeleri taşıyarak gelmeye başladı. Düşman eylemi hala uçaklar için bir tehdit oluştursa da, ikmal yeniden akmaya başladı."
 wtt_the_hump.3.t:0 "[From.GetNameDefCap] Kambur Hava Köprüsünü Yeniden Başlattı"
 wtt_the_hump.4.a:0 "Gökten gelen hediyeler!"
 wtt_the_hump.4.desc:0 "Himalayalar üzerindeki hava köprüsü, büyük miktarda umutsuzca ihtiyaç duyulan malzemeyi getiren sıkı bir şekilde kontrol edilen günlük uçuş programıyla yeniden tam kapasiteyle çalışıyor."
 wtt_the_hump.4.t:0 "[From.GetNameDefCap] Kambur Hava Köprüsünü Yeniden Başlattı"
 wtt_warlord.1.a:0 "Nihayet, makul biri!"
 wtt_warlord.1.b:0 "Planlarımızda onlara yer yok."
 wtt_warlord.1.desc:0 "Çin'deki merkezi hükûmetin halkını haydutlardan ve komünistlerden koruma konusunda tamamen yetersiz kalmasıyla, [From.GetLeader] nihayet konumunu anladı ve konumunu güvence altına almak amacıyla bize ulaştı. Bizimle tam işbirliği yapacak ve birliklerimize serbest geçiş izni verecekti. Karşılığında, sadece topraklarını korumak için bazı birlikler yerleştirmemizi ve Çin'i yeniden organize etmeyi bitirdiğimizde katkısını hatırlamamızı istiyor."
 wtt_warlord.1.t:0 "[From.GetNameDefCap] Boyun Eğmeyi Teklif Ediyor"
 wtt_warlord.2.a:0 "Hayatta kalmamız için küçük bir bedel."
 wtt_warlord.2.desc:0 "[From.GetAdjective] hükümeti teklifimizi kabul etti. Onların korunması karşılığında, nasıl davranmamız gerektiği konusunda bize verilen tavsiyeleri \"ciddi bir şekilde dikkate almalıyız\". Politikalarımızı koordine etmek için bir [From.GetAdjective] hükümet yetkilisi geldi."
 wtt_warlord.2.t:0 "[From.GetNameDefCap] Kabul Ediyor"
 wtt_warlord.3.a:0 "Güçleneceğiz ve onlara göstereceğiz."
 wtt_warlord.3.desc:0 "[From.GetAdjective] hükûmeti notumuzu, uygun bir ulusal hükûmetle müzakere etme yetkimizin olmadığını söyleyerek tartışmayı kesin bir dille reddederek iade etti."
 wtt_warlord.3.t:0 "[From.GetNameDefCap] Reddediyor"
 wtt_warlord_vs_prc.1.a:0 "Sadık bir kukla faydalı olabilir."
 wtt_warlord_vs_prc.1.a_tooltip:0 "Eğer reddederlerse bu §H[communist_china.GetNameDef]§! ile savaşa yol açacaktır.\n"
 wtt_warlord_vs_prc.1.b:0 "Böyle bariz bir fırsatçılığa ihtiyacımız yok."
 wtt_warlord_vs_prc.1.desc:0 "[warlord.GetLeader]'den bir heyet, bir iç parti güç mücadelesinde olası destek konusunda bizi yoklamak için Moskova'ya geldi. [communist_china.GetLeader]'in komünizm davasına yeterince bağlı olmadığını ve aslında gerici düşünceler besleyebileceğini ve devrimi en kritik aşamasında ihanet edebileceğini iddia ediyorlar.\n\n[warlord.GetLeader] bunun yerine, genel olarak komünist davasına ve özellikle [SOU.GetLeader]'e ebedi ve sarsılmaz bir sadakat vaat ederek onu desteklememizi öneriyor."
 wtt_warlord_vs_prc.1.t:0 "[warlord.GetLeader] destek için yalvarıyor"
 wtt_warlord_vs_prc.10.a:0 "[communist_china.GetLeader] için ölmeye değmez"
 wtt_warlord_vs_prc.10.b:0 "Buna taraf olmayacağız."
 wtt_warlord_vs_prc.10.desc:0 "İktidarı bırakmak ya da Sovyet blöfünü görmek arasında bir seçimle karşı karşıya kalan [communist_china.GetLeader], ikincisini seçti. Ne yazık ki, [SOV.GetLeader]'in blöf yapmadığı ve düşmanlıkların başladığı görülüyor. Hassas konumumuz göz önüne alındığında, her iki tarafın da yoğun baskısına maruz kaldık; Sovyetler, haini devirmemizde onlara yardım etmemizi talep ediyor.\n\nReddetmek, dediklerine göre, [communist_china.GetLeader]'in tarafını seçmekle aynı şey olurdu."
 wtt_warlord_vs_prc.10.t:0 "Katıl ya da Öl"
 wtt_warlord_vs_prc.2.a:0 "Bu işi düzeltmek için [communist_china.GetLeader]'i Moskova'ya gönderin."
 wtt_warlord_vs_prc.2.b:0 "Hainlere asla boyun eğmeyeceğiz!"
 wtt_warlord_vs_prc.2.desc:0 "[SOV.GetAdjective] hükümetinin temsilcisi, [SOV.GetLeader]'in [communist_china.GetLeader]'in Marksist teori yorumunun doğruluğu hakkında ciddi şüpheler beslediğini bize bildirdi. Çin'deki sınıf mücadelesinin bu kritik aşamasında, Marksist-Leninist öğretilerin doğru uygulanmasından sapmamalıyız. Görünüşe göre Moskova, [warlord.GetLeader]'in Çin'deki Komünist davasını ilerletmek için neyin gerekli olduğunu daha iyi anladığına inanıyor. Moskova'ya göre, parti [warlord.GetLeader]'i yeni başkan olarak kabul etse iyi olur, yoksa [SOV.GetLeader]'in hoşnutsuzluğuna uğrar."
 wtt_warlord_vs_prc.2.t:0 "[soviet.GetLeader]'den bir mesaj"
 wtt_warlord_vs_prc.21.a:0 "Bu ödediğimiz bedel."
 wtt_warlord_vs_prc.21.b:0 "Bu bir soygun!"
 wtt_warlord_vs_prc.21.desc:0 "[From.GetLeader]'den, daha önce anlaşılan ekonomik yardım teslimatlarını artırmamızı talep eden bir mesaj geldi."
 wtt_warlord_vs_prc.21.t:0 "[From.GetLeader] Desteğimizi Talep Ediyor"
 wtt_warlord_vs_prc.22.a:0 "Anlaşmayı daha da değiştirmememiz için dua etmeli."
 wtt_warlord_vs_prc.22.desc:0 "[From.GetLeader]'in her zamanki protestolarına rağmen, talep ettiğimiz gibi ödemelerin hızını artırmayı kabul etti."
 wtt_warlord_vs_prc.22.t:0 "[From.GetNameDefCap] Kabul Ediyor"
 wtt_warlord_vs_prc.23.a:0 "Söz verdi ve bizim olanı alacağız!"
 wtt_warlord_vs_prc.23.b:0 "Sadece bu seferlik görmezden gel."
 wtt_warlord_vs_prc.23.desc:0 "[From.GetLeader], ülkesinin talep ettiğimiz \"saçma\" ödemeleri kesinlikle yapamayacağını iddia ederek ek destek talebimize kesin bir ret cevabı verdi."
 wtt_warlord_vs_prc.23.t:0 "[From.GetNameDefCap] Reddediyor"
 wtt_warlord_vs_prc.3.a:0 "Bu aramızda kalsın."
 wtt_warlord_vs_prc.3.desc:0 "[SOV.GetLeader]'in sadakatimiz veya liderlik yeteneğimiz konusunda ikna olmadığı bildiriliyor. [SOV.GetAdjective] hükümeti, Çin Komünist Partisi başkanı olarak [communist_china.GetLeader]'i desteklemeye devam ediyor."
 wtt_warlord_vs_prc.3.t:0 "[SOV.GetLeader] Reddediyor"
 wtt_warlord_vs_prc.31.a:0 "Öğrenme fırsatını memnuniyetle karşılıyoruz."
 wtt_warlord_vs_prc.31.b:0 "Kimsenin bize ne yapacağımızı söylemesine ihtiyacımız yok."
 wtt_warlord_vs_prc.31.desc:0 "[From.GetLeader]'den, devrimci mücadelemizin aşamasının, karşı-devrimin kolayca kurbanı olabilecek özellikle savunmasız bir aşama olduğunu söyleyen bir mesaj geldi. Özel temsilcisi, ulusumuzdaki gelişmeleri yakından izlemesi ve sınıf mücadelesinde zafer kazanmamız için bize tavsiyelerde bulunması talimatını aldı.\n\nNot, ayrıca, 'önerilerinden' herhangi bir sapmanın, gerici unsurların hükümetimizi ele geçirdiğinin bir işareti olarak kabul edileceğini ve ardından gerekli adımların atılacağını söylüyor."
 wtt_warlord_vs_prc.31.t:0 "[From.GetLeader] daha yakın işbirliği talep ediyor"
 wtt_warlord_vs_prc.32.a:0 "Aklını başına topladı."
 wtt_warlord_vs_prc.32.desc:0 "[From.GetLeader], özel temsilcimizi memnuniyetle karşıladı ve onu kişisel danışmanı olarak atadı. Artık iç ve dış politikaları hakkında çok iyi bir kontrole sahibiz."
 wtt_warlord_vs_prc.32.t:0 "[From.GetNameDefCap] Kabul Ediyor"
 wtt_warlord_vs_prc.33.a:0 "Belki kendimizi daha güçlü bir şekilde tekrar etmeliyiz."
 wtt_warlord_vs_prc.33.desc:0 "Fikre açık olmasına rağmen, [From.GetLeader], politikalarını daha doğrudan etkilememize izin verme talebimizi kibarca ama kararlı bir şekilde reddetti. Görünüşe göre, sahadaki koşullara 'yabancı'yız ve Marksist öğretilerin uygulanmasını yerel uzmanlara bırakmalıyız."
 wtt_warlord_vs_prc.33.t:0 "[From.GetNameDefCap] Reddediyor"
 wtt_warlord_vs_prc.34.a:0 "Yani bizi test etmek mi istiyor?"
 wtt_warlord_vs_prc.34.desc:0 "[From.GetLeader], daha önce anlaştığımız ödemeleri devretmesi yönündeki giderek daha güçlü talepleri görmezden geldi. Hatta kendisini açıklamak için Moskova'ya gelmesini istememiz bile yanıtsız bırakılıyor."
 wtt_warlord_vs_prc.34.t:0 "[From.GetNameDefCap] Ödemeyi Reddediyor"
 wtt_warlord_vs_prc.35.a:0 "Halk artık kahraman!"
 wtt_warlord_vs_prc.35.b:0 "Bu [Root.GetAdjective] çıkarlarına aykırı."
 wtt_warlord_vs_prc.35.desc:0 "[From.GetNameDefCap], Çinli komünistlerin tek bir bayrak altında milliyetçileri, gericileri ve yabancı işgalcileri yenmek için tek bir ittifaka, bir Halk Cephesine katılmalarını talep etti."
 wtt_warlord_vs_prc.35.t:0 "[From.GetAdjective] İttifakı"
 wtt_warlord_vs_prc.36.a:0 "O zaman tek başımıza gitmek zorunda kalacağız."
 wtt_warlord_vs_prc.36.b:0 "Birleşik Cephe'yi tamamen dağıtabiliriz."
 wtt_warlord_vs_prc.36.desc:0 "[From.GetNameDefCap], milliyetçilere, gericilere ve yabancı işgalcilere karşı birleşmiş bir Halk Cephesi'nin bariz avantajlı yolunu reddetti ve bunun yerine ittifakımızın '[From.GetAdjective] çıkarlarına aykırı' olacağını belirtti."
 wtt_warlord_vs_prc.36.t:0 "[From.GetLeader] İttifakı Reddediyor"
 wtt_warlord_vs_prc.4.a:0 "İyi."
 wtt_warlord_vs_prc.4.desc:0 "[communist_china.GetLeader]'in [SOV.GetLeader]'e yaptığı umutsuz çağrılar, Sovyetleri kendi tarafına çekmekte pek işe yaramadı. Kaybedilmiş bir savaşı fark eden [communist_china.GetLeader], hatalarını kamuoyuna kabul etti ve devrimin zaferini sağlamak için bizimle çalışma sözü verdi."
 wtt_warlord_vs_prc.4.t:0 "[communist_china.GetNameDefCap] Teslim Oluyor"
 wtt_xian_incident.1.a:0 "Git"
 wtt_xian_incident.1.b:0 "Gitme"
 wtt_xian_incident.1.desc:0 "[From.GetLeader], [CHI.GetLeader]'i mevcut durumu ve Komünistlere karşı çatışmada atılacak adımları görüşmek üzere Xi'an'a buluşmaya resmi olarak davet etti.\n\nBu daveti reddetmek, [From.GetLeader] tarafından kişisel bir hakaret olarak görülecek ve şüphesiz diğer savaş ağaları tarafından fark edilecektir."
 wtt_xian_incident.1.t:0 "[From.GetLeader]'den bir davet"
 wtt_xian_incident.10.a:0 "Emirlerimizi takip ettikleri sürece."
 wtt_xian_incident.10.b:0 "Komünistlerle anlaşma yok!"
 wtt_xian_incident.10.desc:0 "Beklenen göstermelik duruşma ve ardından gelen infaz yerine, Komünistler bunun yerine Japonlara karşı resmi bir ittifakı tercih edeceklerini işaret ettiler. \n\nBaşka bir iyi hamlenin onları haritadan sileceğini bilerek açıkça zaman kazanıyorlar. Gerçekten [CHI.GetLeader]'in ölmesini isteselerdi, zaten idam edilmiş olurdu.\n\nAncak, hükûmetimizdeki bazı insanlar Komünistlerin neden şimdi bir ittifak için bastırdığını merak ediyor - belki de bizim bilmediğimiz bir şey biliyorlar?"
 wtt_xian_incident.10.t:0 "[PRC.GetLeader] bir ittifak öneriyor"
 wtt_xian_incident.2.a:0 "Ondan Komünistlerle ittifak kurmasını iste."
 wtt_xian_incident.2.desc:0 "Sadece küçük bir refakatçiyle seyahat eden [From.GetLeader], durumu bizimle görüşmek için Xi'an'a geldi. Şüphesiz komünistleri yok etmek için taahhüdümüzü yenilememizi bekliyor. Kapımızdaki Japon ordusuyla, ona durumu açıklığa kavuşturmak zorunda kalacağız."
 wtt_xian_incident.2.t:0 "[From.GetLeader] Xi'an'a vardı"
 wtt_xian_incident.3.a:0 "Belki de gerçekten soğuk algınlığı vardır?"
 wtt_xian_incident.3.desc:0 "Kötü bir soğuk algınlığını gerekçe göstererek, [CHI.GetLeader] davetimizi 'isteksizce' geri çevirdi. Bunun, yakın gelecekte topraklarımızı daha doğrudan kontrol altına almayı planladığı mı yoksa birinin planlarımızı ona sızdırdığı mı henüz belli değil."
 wtt_xian_incident.3.t:0 "[From.GetLeader] buluşmayı reddediyor."
 wtt_xian_incident.4.a:0 "Belki de haklıdır."
 wtt_xian_incident.4.b:0 "Sonuncusunun nasıl gittiğini hala hatırlıyoruz."
 wtt_xian_incident.4.desc:0 "Xi'an toplantısında, [From.GetLeader] şaşırtıcı bir öneride bulundu: Japon tehdidiyle birleşik bir cephe olarak yüzleşebilmek için komünistlerle bir ittifak kurmamız gerektiğine inanıyor."
 wtt_xian_incident.4.t:0 "[From.GetLeader] Komünistlerle bir ittifak öneriyor"
 wtt_xian_incident.5.a:0 "Japonlar daha büyük bir tehdit."
 wtt_xian_incident.5.b:0 "Milliyetçilerle anlaşma yok!"
 wtt_xian_incident.5.desc:0 "Görünüşe göre Milliyetçi kamp sonunda bizi haritadan silmeye çalışmaktan yorulmuş. Xi'an'daki bir toplantıda, [CHI.GetLeader] görünüşe göre Japonlara karşı bizimle bir ittifak olasılığını araştırmayı kabul etti.\n\nSeçeneklerimizi dikkatle tartmalıyız."
 wtt_xian_incident.5.t:0 "[CHI.GetLeader] bir ittifak öneriyor."
 wtt_xian_incident.6.a:0 "Tek seçeneğimiz bu."
 wtt_xian_incident.6.b:0 "Bu kolayca kontrolden çıkabilir."
 wtt_xian_incident.6.desc:0 "Bu gereksiz savaşı durdurma yönündeki argümanlarımıza ve taleplerimize rağmen, [From.GetLeader] Komünistlerle bir Birleşik Cephe fikrini değerlendirmeyi reddetti. Daha kararlı önlemlerin alınması gerektiği açıktır. Onu tutuklayıp Komünistlere teslim etmeli miyiz?"
 wtt_xian_incident.6.t:0 "[From.GetLeader] Komünistlerle ittifak kurmayı reddediyor"
 wtt_xian_incident.7.a:0 "Sovyetlerden onay iste."
 wtt_xian_incident.7.b:0 "Kellesi alınsın!"
 wtt_xian_incident.7.c:0 "Japonlara karşı onunla ittifak kurmalıyız."
 wtt_xian_incident.7.d:0 "İkinci Birleşik Cephe fikirlerini reddet"
 wtt_xian_incident.7.desc_a:0 "[CHI_xian_instigator.GetLeader], [CHI.GetLeader]'i tutukladığını ve onu bize teslim etmeye istekli olduğunu belirten bir mesaj gönderdi. \n\nBu, halkın bu düşmanını infaz etmek için sahip olacağımız en iyi şans olabilir!"
 wtt_xian_incident.7.desc_b:0 "[From.GetLeader], [CHI.GetLeader]'i infaz etme teklifimizi reddetti. Bunun yerine, Milliyetçilerle bir ittifak kurmamız gerekiyor, çünkü görünüşe göre henüz devrimi yönetmeye ve aynı zamanda kendimizi Japonlara karşı savunmaya hazır değiliz."
 wtt_xian_incident.7.e:0 "$PRC_mao_zedong$ ve $PRC_zhang_guotao$, [CHI.GetLeader] liderine güvenilemeyeceği konusunda hemfikir."
 wtt_xian_incident.7.t:0 "[CHI.GetLeader], [CHI_xian_instigator.GetNameDef]'de tutuklandı!"
 wtt_xian_incident.8.a:0 "Birlikleri gönderin!"
 wtt_xian_incident.8.b:0 "Ona zarar vermezler. Bekleyelim."
 wtt_xian_incident.8.desc:0 "[From.GetLeader]'den bir mesaj ele geçirdik, [CHI.GetLeader]'in gözaltında olduğunu ve onu Komünistlere teslim etmek istediğini söylüyor. Ona karşı duydukları nefret seviyesi göz önüne alındığında, bundan uzun süre sağ çıkması pek olası değil. \n\n[CHI.GetLeader]'in [PRC.GetLeader] tarafından bir göstermelik duruşmaya çıkarılıp idam edilmesini görmek istemiyorsak, hızlı ve kararlı hareket etmeliyiz!"
 wtt_xian_incident.8.t:0 "[From.GetLeader], [CHI.GetLeader]'i tutukladı!"
 wtt_xian_incident.9.a:0 "Bir burjuva düşmanı daha sonuna ulaştı."
 wtt_xian_incident.9.b:0 "Ona hala ihtiyaç var."
 wtt_xian_incident.9.desc:0 "[PRC.GetLeader], Komünistlerin [CHI.GetLeader]'i halka ve devrime karşı işlediği suçlardan dolayı yargılamak için eşsiz bir fırsata sahip olduğunu belirten bir mesaj gönderdi. Onu idam etmek, Çin'deki liderlik mücadelesinde komünist parti için büyük bir zafer olurdu. \n\nAncak, bu aynı zamanda Milliyetçileri kritik bir anda zayıflatır ve belki de Japonların Çin'de daha fazla ilerleme kaydetmesine olanak tanır."
 wtt_xian_incident.9.t:0 "[CHI.GetLeader], [CHI_xian_instigator.GetNameDef]'de tutuklandı!"
