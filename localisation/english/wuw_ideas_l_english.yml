 GER_uncertain_future:0 "Belirsiz Gelecek"
 GER_uncertain_future_desc:0 "İç Savaş'ın nihayet sona ermesiyle, Alman ulusu yavaş yavaş yeniden inşa ediliyor, ancak halkı istikrar ve güvenlik özlemi çekiyor. [ROOT.GetLeader] ilerlemek için hiçbir çaba göstermedi ve yeni Alman devletinin geleceğinin nasıl görünmesi gerektiğine karar vermekle ilgilenmiyor gibi görünüyor. Bu, yıkık geçmişinden uzaklaşmaya hevesli olan halk arasında büyük endişeye neden oldu."
