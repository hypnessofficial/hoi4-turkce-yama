 sp_land_stronghold_network_collapse_workers_drafted_desc:0 "Çok sayıda işçi kurtarma operasyonlarına ve acil yeniden inşa çabalarına yönlendirildi, bu da bölgedeki düzenli inşaat, onarım faaliyetlerini ve kaynak çıkarımını önemli ölçüde yavaşlattı."
 special_project_consumer_costs_high:0 "Gizli Kaynak Tedariki"
