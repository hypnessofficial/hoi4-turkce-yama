 GER_the_kammhuber_line:0 "Kammhuber Hattı"
 GER_the_kammhuber_line_desc:0 "Düşman bombardıman ve avcı uçaklarının [ROOT.GetNameDef] üzerindeki göklerde serbestçe dolaşmasına izin veremeyiz. Ayrıntılı bir örtüşen radar sinyalleri sistemi inşa ederek, ana topraklarımıza ulaşmadan önce onları durduracağız."
