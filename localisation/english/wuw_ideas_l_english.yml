 AUS_militia_is_undecided:0 "Milis"
 AUS_militia_support:0 "Milis Desteği"
 AUS_militia_support_2:0 "Milis Desteği"
 AUS_militia_support_desc:0 "Davamıza yardımcı olması için [GetMilitiaName] desteğini aldık. Bu paramiliter örgüt uzun süredir yasaklıydı ancak bu durumda onları geri getirmeyi kolayca haklı çıkarabiliriz."
 AUS_naval_efficiency_idea:0 "Avusturya Donanma Verimliliği"
