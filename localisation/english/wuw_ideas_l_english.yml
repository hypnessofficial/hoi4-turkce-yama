 generic_secret_weapons_ns_desc:0 "Tüm ekstra kaynakları tank ve uçak geliştirmeye harcamak cazip gelse de, savaşları kazanmanın sırrı tamamen yeni bilim alanlarında yatmaktadır; elektronik, roketçilik ve nükleer araştırma."
 idea_COG_river_navy:0 "Nehir Donanması"
 idea_COG_river_navy_desc:0 "Bölgedeki herhangi bir ülkenin en büyük nehir donanmasına sahibiz, bu da düşmanların topraklarımıza sızmasını geciktirir veya hatta önler. Okyanusa açılan donanmalarla kıyaslanamaz olsa da, ülkemizi güvende tutmada kilit bir rol oynar."
