 GER_wehrwirtschaft_modifier_desc:0 "Yabancı güçlerin refahımızı veya geleceğimizi dikte etmesine izin veremeyiz. Otarkiye ulaşmak, [ROOT.GetNameDef]'in ekonomik bağımsızlığını güvence altına alacak, yabancı kaynaklara olan bağımlılığı azaltacak ve halkımız için kendi kendine yeterliliği sağlayacaktır."
 GER_white_russian_advisors:0 "Beyaz Rus Askeri Danışmanları"
 GER_wirtschaftswunder_modifier:0 "Wirtschaftswunder"
 GER_wirtschaftswunder_modifier_desc:0 "Darmadağın bir ekonomiyi dünyanın önde gelen sanayi güçlerinden birine dönüştürmeyi başardık. Bu dikkate değer canlanma ancak bir Wirtschaftswunder, bir ekonomik mucize olarak tanımlanabilir."
 GER_wunderwaffen_modifier:0 "Harika Silahlar"
 GER_wunderwaffen_modifier_desc:0 "Wunderwaffe programları, radikal teknolojik atılımlar yoluyla savaşın geleceğini şekillendirmeyi amaçlayan cesur bir girişimdir. Bilim adamlarımız ve mühendislerimiz, Almanya'nın göklerde, denizlerde ve karada hakimiyetini güvence altına alacak devrimci silahlar geliştirerek mümkün olanın sınırlarını zorluyor. Bu yenilikler, dünyanın gidişatını değiştirme ve bize karşı çıkmaya cüret eden herhangi bir düşmana kesin bir darbe indirme potansiyeli taşıyor!"
