 AUS_domestic_air_production_medium:0 "Yerli Orta Boy Uçak Üretimi"
 AUS_domestic_air_production_small:0 "Yerli Küçük Uçak Üretimi"
 AUS_doth:0 "Vatan Savunması"
 AUS_doth_desc:0 "Vatanı savunmada kendi payına düşeni yapmak her [AUS.GetAdjective] vatandaşının görevidir; orduda, fabrikalarda veya şantiyelerde. Ulusun ortak çabasına çağrıda bulunarak vatan korunacaktır!"
 AUS_doth_intro_tt:0 "§YVatan Savunması§! etkenini şu şekilde değiştir:"
 AUS_economic_boom:0 "Ekonomik Patlama"
 AUS_economic_boom_desc:0 "Sıkı çalışmalar ve büyük çabalar sayesinde Avusturya, bir ekonomik felaketi hızla büyüyen bir ekonomiye dönüştürdü."
 AUS_emergency_measures:0 "Acil Durum Önlemleri"
 AUS_emergency_measures_desc:0 "Giderek daha saldırgan hale gelen bir dünyada bir şans yakalamak için [AUS.GetNameDef], ülkenin ihtiyaçlarını karşılamak amacıyla hızla saygın bir endüstriyel kapasite oluşturmalıdır."
 AUS_empire_restored:0 "Avusturya İmparatorluğu Geri Geldi"
 AUS_empire_restored_desc:0 "O bir İmparatorluktu, bir İmparatorluk olacak! Eski [AUS.GetAdjective] topraklarının çoğunu geri alarak imparatorluk yeniden kuruldu."
 AUS_empire_restored_intro_tt:0 "§YAvusturya İmparatorluğu Geri Geldi§! etkenini şu şekilde değiştir:"
 AUS_employment_efforts:0 "İstihdam Çabaları"
 AUS_employment_efforts_desc:0 "Avusturya'daki mevcut istihdam krizini sona erdirmek için önemli yatırımlar yapıldı. Çırakların artık fabrikalarda sıkça görülmesiyle hem halk hem de sanayi memnun görünüyor."
 AUS_extended_workshifts_idea:0 "Uzatılmış Vardiyalar"
 AUS_farr:0 "Birinci Avusturya Cumhuriyeti Canlandı"
 AUS_farr_desc:0 "Mayıs Anayasası'nı feshederek, siyasi partilere yeniden izin vererek ve seçimler düzenleyerek [AUS.GetNameDef], uzun zamandır kayıp olduğu düşünülen bir cumhuriyeti canlandırdı."
 AUS_farr_intro_tt:0 "§YBirinci Avusturya Cumhuriyeti Canlandı§! etkenini şu şekilde değiştir:"
 AUS_fortification_effort_idea:0 "Acil Durum Tahkimat Çabaları"
