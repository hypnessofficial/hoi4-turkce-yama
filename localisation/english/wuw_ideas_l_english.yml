 AUS_austrostalinism:0 "Avusturya Stalinizmi"
 AUS_austrostalinism_desc:0 "Avusturya Marksist orta yolundan sapan ve Avusturya Faşizmini çoktan ortadan kaldıran [AUS.GetNameDef], şimdi katı bir Stalinist fikir setini takip ediyor."
