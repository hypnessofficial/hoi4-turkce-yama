 AUS_habsburg_monarchy_restored:0 "Habsburg Monarşisi Geri Geldi"
 AUS_habsburg_monarchy_restored_desc:0 "Bir monarşi olarak [AUS.GetNameDef], Avrupa kıtasında büyük bir güçtü. Monarşiyi yeniden kurarak bir kez daha o güç olacağız!"
 AUS_habsburg_monarchy_restored_intro_tt:0 "§Y Habsburg Monarşisi Geri Geldi§! etkenini şu şekilde değiştir:"
 AUS_hirtenberger_wuw:0 "Hirtenberger"
 AUS_host_of_communist_dissidents:0 "Komünist Muhalifleri Ağırlama"
 AUS_host_of_communist_dissidents_desc:0 "Dünyanın dört bir yanından benzer düşünen insanları davet eden [AUS.GetNameDef], komünist sürgünler için bir merkez haline geliyor."
 AUS_industrial_coaxing:0 "Avusturya Sanayi Desteği"
 AUS_infrastructure_effort_idea:0 "Otoban Genişletmesi"
