 BEL_neutrality_dynamic_modifier:0 "Daimi Tarafsızlık"
 BEL_neutrality_dynamic_modifier_desc:0 "Belçika bağımsız ve daimi tarafsız bir devlettir ve bu aynı tarafsızlığı diğer tüm devletlere karşı gözetecektir."
 BEL_pax_belgica_ns:0 "Pax Belgica"
 BEL_pax_belgica_ns_desc:0 "İmparatorluk geçmişinin himayesi altında, Belçika bir zamanlar sadece hayal edilen halkları ve toprakları fethedebilir."
 BEL_powerful_unions_ns:0 "Güçlü Sendikalar"
 BEL_pressurized_cabins_ns:0 "Basınçlı Kabinler"
 BEL_pressurized_cabins_ns_desc:0 "Belçika ile Kongo'daki sömürge topraklarımız arasındaki mesafeyi daha iyi kapatmak için, uçaklarımız için basınçlı kabin kullanımına öncülük ettik."
 BEL_prisoner_king_ns:0 "Tutsak Kral"
 BEL_prisoner_king_ns_desc:0 "Kral III. Leopold, ulusumuzun teslim olmasının ardından halkıyla birlikte kaldı. Şimdi, tüm Belçikalıların toplanabileceği ve Belçika yönetiminin restorasyonuna hazırlanabileceği bir toplanma noktası olarak işlev görüyor."
 BEL_re_build_the_fleet_ns:0 "Donanmayı Yeniden İnşa Et"
 BEL_re_build_the_fleet_ns_desc:0 "Donanmamız 1927'de dağıtıldı, ancak küresel durum, Kongo ile ticaret bağlantılarımızı açık tutmak ve denizcilik çıkarlarımızı sürdürmek için filomuza bir kez daha yatırım yapmamızı gerektiriyor."
