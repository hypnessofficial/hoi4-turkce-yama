 GER_navy_communist_modifier:0 "Volksmarine"
 GER_navy_communist_modifier_desc:0 "Halkın Donanması, emperyalist saldırganlığa karşı daima tetiktedir. Proleter devrimini denizlere yayacak ve yeni bir dünya düzeni getirecektir."
 GER_navy_democratic_modifier:0 "Deutsche Marine"
 GER_navy_democratic_modifier_desc:0 "Alman Donanması, denizcilik çıkarlarımızı korumak için denizlere meydan okuyor ve nüfuzumuzun tüm dünyaya ulaşmasını sağlıyor."
 GER_navy_fascist_modifier:0 "Kriegsmarine"
 GER_navy_fascist_modifier_desc:0 "Modernizasyon ve cesur strateji ile okyanuslara meydan okuyor, düşmanlarımızın kalbine korku salıyoruz. Güçlü Zırhlılarımız dalgalara hükmedecek ve U-botlarımız dalgaların altında hükmedecek."
 GER_navy_imperial_modifier:0 "Kaiserliche Marine"
 GER_navy_imperial_modifier_desc:0 "Güçlü İmparatorluk Donanmamız, küresel hırslarımızın öncülüğünü yapmak ve açık denizlerde hakimiyetimizi sağlamak için okyanus dalgalarını yaracak."
