 AUS_austrofascism_opm:0 "Avusturya Faşizmi"
 AUS_austromarxism:0 "Avusturya Marksizmi"
 AUS_austromarxism_becomes_austrostalinism:0 "§YAvusturya Marksizmi§! Ulusal Ruhu'nun adı §YAvusturya Stalinizmi§! olarak değişir!"
 AUS_austromarxism_becomes_austrotrotskyism:0 "§YAvusturya Marksizmi§! Ulusal Ruhu'nun adı §YAvusturya Troçkizmi§! olarak değişir!"
 AUS_austromarxism_desc:0 "Otto Bauer'in yazılarına dayanan, sosyal demokrasi ile sovyet komünizmi arasında bir orta yolu savunan Avusturya Marksist gündemi. Önceki Avusturya Faşizmi durumundan çok önemli bir dönüş yapan ülke, şimdi komünizm ile demokrasinin sınırında geziniyor."
 AUS_austromarxism_intro_tt:0 "§YAvusturya Marksizmi§! etkenini şu şekilde değiştir:"
