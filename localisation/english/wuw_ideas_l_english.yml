 BEL_remove_social_partners_dynamic_modifier_tt:0 "§Y$BEL_social_partners_dynamic_modifier$§! etkenini §Y$BEL_engine_of_the_economy_dynamic_modifier$§! ile değiştir, etkin değişiklik:"
 BEL_rexist_legion_dynamic_modifier:0 "Rexist Lejyonu"
 BEL_rexist_legion_dynamic_modifier_desc:0 "Rexist hareketinde kilise ve devletin birleşmesi, eski askeri tarikatların hatları boyunca bir askeri hareket kurmamızı sağladı."
 BEL_rexist_legion_dynamic_modifier_tt:0 "§Y$BEL_rexist_legion_dynamic_modifier$§! etkenini şu şekilde geliştir:"
 BEL_royal_military_academy_dynamic_modifier:0 "Kraliyet Askeri Akademisi"
 BEL_royal_military_academy_dynamic_modifier_desc:0 "En iyilerimizi ve en parlaklarımızı, yeni nesil subayların çok çeşitli uzmanlık konularında dünya standartlarında askeri eğitim alabileceği Kraliyet Askeri Akademisi'ne gönderiyoruz."
 BEL_scars_of_ww1_dynamic_modifier:0 "Büyük Savaş'ın Yaraları"
 BEL_scars_of_ww1_dynamic_modifier_desc:0 "[BEL.GetName], Batı Cephesi'nin büyük bir kısmının savaş alanı olması nedeniyle Büyük Savaş'ta büyük acılar çekti ve hala bu yaraları taşıyor."
 BEL_scars_of_ww1_ns_fake:0 "$BEL_scars_of_ww1_dynamic_modifier$"
 BEL_scars_of_ww1_ns_fake_desc:0 "$BEL_scars_of_ww1_dynamic_modifier_desc$"
 BEL_secretaries_general_tt:0 "§YEyalet Kontrolcüsü§!, sadece §YBelçika Çekirdek Eyaletlerinde§! mevcut olan özel bir §Yİşgal Yasası§! alacaktır!"
 BEL_social_partner_to_engine_tt:0 "§Y$BEL_social_partners_modifier$§! etkenini §Y$BEL_engine_of_the_economy_dynamic_modifier$§! ile değiştir."
 BEL_social_partners_dynamic_modifier:0 "Sosyal Ortaklar"
 BEL_social_partners_dynamic_modifier_desc:0 "[ROOT.GetName], sendikaları ve şirket temsilcilerini bir araya getirerek, diğer şeylerin yanı sıra asgari ücreti ve altı gün ücretli tatili getiren bir uzlaşma anlaşması müzakere etti."
 BEL_socialism_on_the_rise_dynamic_modifier:0 "Sosyalist Duygular"
 BEL_socialism_on_the_rise_dynamic_modifier_desc:0 "Vandervelde'nin seçimdeki göreceli zaferinin ardından [ROOT.GetNameDef] içinde sosyalist duygular istikrarlı bir şekilde artıyor."
 BEL_societe_generale_de_belgique_industrial:0 "Société Générale de Belgique"
 BEL_surrender_tt:0 "§RBu seçeneği seçmek ulusunuzun teslim olmasına neden olacaktır!§! \n\nEğer bir ittifaktaysanız, Sürgündeki Hükümet olarak savaşmaya devam edeceksiniz."
 BEL_the_kings_surrender_ns:0 "Kral'ın Teslimiyeti"
 BEL_the_kings_surrender_ns_desc:0 "Kral III. Leopold, ulusumuzun teslimiyetini zaten teklif etti ve bu, birliklerimizin moralini sarstı ve mücadeleye devam etme yeteneğimizi dramatik bir şekilde etkiledi."
 BEL_the_walloon_legion_ns:0 "Valon Lejyonu"
 BEL_the_walloon_legion_ns_desc:0 "Valon Lejyonu, savaş çabalarına katkılarının değerini kanıtlamak isteyen, Flaman kardeşleri tarafından gölgede bırakılma korkusuyla Fransızca konuşan gönüllülerden oluşturuldu."
 BEL_traditional_family_values_ns:0 "Geleneksel Aile Değerleri"
 BEL_traditional_family_values_ns_desc:0 "Aile, bir kişinin hayatının en önemli yönlerinden biridir ve biz bu konuda belirli bir dizi standarda bağlıyız. Aile birimi içinde tanımlanmış cinsiyet rolleri ve beklentiler vardır ve bu, nüfusumuzun büyümesi ve istikrarına yöneliktir."
 BEL_volunteer_effort1_ns:0 "Gönüllü Çabası"
 BEL_volunteer_effort1_ns_desc:0 "Dünyada barışın korunmasına yardımcı olmalı ve faşist güçlerin üstünlük sağlamamasını sağlamalıyız. Gerçekten savaşa girmekten kaçınmak çok önemlidir, bu yüzden şimdilik sadece gönüllü göndermekle kendimizi sınırlayacağız."
 BEL_volunteer_effort2_ns:0 "Barışı Koruma Görevleri"
 BEL_volunteer_effort2_ns_desc:0 "Dünyada barışın korunmasına yardımcı olmalı ve faşist güçlerin üstünlük sağlamamasını sağlamalıyız. Gerçekten savaşa girmekten kaçınmak çok önemlidir, bu yüzden şimdilik sadece gönüllü göndermekle kendimizi sınırlayacağız."
 COG_alliance_de_bakongo_idea:0 "Alliance de Bakongo"
 COG_american_investments_for_a_transport_hub:0 "Bir Afrika Ulaşım Merkezi İçin Amerikan Yatırımları"
 COG_anti_colonialist_propaganda_idea:0 "Anti-Sömürgeci Propaganda"
 COG_arm_resistance_flag:0 "Bir sömürge devletinde direnişi silahlandırma."
 COG_armee_nationale_congolaise_modifier:0 "Armée Nationale Congolaise"
 COG_armee_nationale_congolaise_modifier_desc:0 "Kongo'nun silahlı kuvvetleri, Force Publique olarak bilinen sömürge garnizonundan reforme edilmiştir ve Kongo devleti için daha faydalı bir şeye dönüştürülme sürecindedir."
 COG_banque_du_congo_belge_idea:0 "Banque du Congo Belge"
 COG_banque_du_congo_belge_idea_2:0 "Banque Centrale du Congo et du Ruanda-Urundi"
 COG_belgian_congo_colonial_dynamic_modifier:0 "Model Sömürge"
 COG_belgian_congo_colonial_dynamic_modifier_desc:0 "[ROOT.GetNameDefCap], hakim devletinin model sömürgesidir ve bu nedenle buna uygun yatırımlar almaktadır, çünkü hakim devleti de onu daha da geliştirmekten kazanç sağlar.\n§RBu ruh, Kongo artık Belçika'nın bir bağlı devleti olmadığında kaldırılacaktır§!"
 COG_bouvandji:0 "Bouvandji"
 COG_brown_water_navy_idea:0 "Genişletilmiş Kahverengi Su Donanması"
 COG_brown_water_navy_idea_desc:0 "Orta Afrika ormanlarının içinden kıvrılarak akan nehirler ordumuz tarafından yeterince kullanılmıyor. Askerlerimiz takviye veya ikmalden uzak kaldıklarında onlara destek olmak amacıyla kahverengi su filomuzu bir dizi küçük nehir saldırı botuyla genişleteceğiz."
 COG_bundu_dia_kongo_idea:0 "Bundu dia Kongo"
 COG_burundian_separatism_modifier:0 "Burundi Ayrılıkçılığı"
 COG_burundian_separatism_modifier_desc:0 "Bu bölge ayrılıkçı duygularla doludur ve Kongo bağımsız olursa kendi devletini kurmaya teşebbüs etmesi muhtemeldir."
 COG_cattle_chiefs:0 "Sığır Şefleri"
 COG_ccci:0 "Compagnie du Congo pour le Commerce et l'Industrie"
