 AUS_osterreichische_fleugzeugfabrik:0 "Österreichische Fleugzeugfabrik"
 AUS_osterreichische_sauerwerke:0 "Österreichische Sauerwerke"
 AUS_payment_for_alaska:0 "Alaska'nın Satışı İçin Ödeme"
 AUS_payment_for_alaska_desc:0 "Alaska'nın satışı halkımız arasında tartışmalıydı ancak hiç kimse bunun ülkemiz üzerindeki olumlu etkisini inkâr edemez."
 AUS_peoples_army:0 "Halk Ordusu"
 AUS_peoples_army_desc:0 "Kitleleri bir araya getirmek, ülkede güçlü bir milis varlığına yol açtı. Milisler, bu kadar çabuk toplanmalarına rağmen alışılmadık derecede iyi eğitimli ve iyi teçhizatlandırılmış. Sonuç olarak, düzenli orduya alım da bir destek aldı."
 AUS_peoples_army_intro_tt:0 "§YHalk Ordusu§! etkenini şu şekilde değiştir:"
 AUS_phonix_fleugzeugwerke:0 "Phönix Fleugzeugwerke"
 AUS_phonix_fleugzeugwerke_improved:0 "Phönix Fleugzeugwerke"
 AUS_phonix_insurance:0 "Phönix Sigortası"
 AUS_phonix_insurance_desc:0 "Phönix sigorta programı, askere yazılanlarımızın en kötüsü olması durumunda onları kapsayan hayat sigortası satın almalarına olanak sağladı. Ailelerinin bakılacağını bilmek, orduya katılmaya istekli insan sayısını önemli ölçüde artırdı."
 AUS_recovering_from_the_depression:0 "Ekonomik Buhrandan Toparlanma"
 AUS_recovering_from_the_depression_desc:0 "30'ların başındaki ekonomik çöküşlerden toparlanma yavaş oldu, ancak görünüşe göre Avusturya nihayet daha iyi zamanlara doğru ilerliyor."
 AUS_recruitment_push_idea:0 "Asker Toplama Hamlesi"
 AUS_recurrent_economic_depression:0 "Ekonomik Buhran Geri Dönüyor"
 AUS_recurrent_economic_depression_desc:0 "Kısa vadeli etkilerin etkili olması, ancak bunlar sona erdiğinde ekonomik krizin daha da kötüye dönmesi modeli, Avusturya'yı bir lanet gibi takip ediyor gibi görünüyor. Bir kez daha enflasyon oranları fırlıyor ve ekonomi darmadağın."
 AUS_reinforcing_the_supply_network_idea:0 "İkmal Ağını Güçlendirme"
 AUS_revised_treaty_of_saint_germain_en_laye:0 "Gözden Geçirilmiş Saint-Germain-en-Laye Antlaşması"
 AUS_revised_treaty_of_saint_germain_en_laye_desc:0 "Diplomatik çabalar sayesinde orijinal Saint-Germain-en-Laye Antlaşması'nın etkisi azaltıldı. Artık ordusunun büyüklüğü üzerinde sert bir sınırlama yaşamayan [ROOT.GetNameDef], daha küçük ölçekli bir yeniden silahlanma başlatabilir."
 AUS_secret_rearmament_idea:0 "Gizli Yeniden Silahlanma"
 AUS_stabilimento_tecnico_triestino:0 "Stabilimento Tecnico Triestino"
 AUS_steyr_arms:0 "Steyr Arms"
 AUS_streamline_cruiser_production_idea:0 "Modernize Edilmiş Gemi Üretimi"
 AUS_the_future_of_austria:0 "Avusturya'nın Geleceği"
 AUS_treaty_of_saint_germain_en_laye:0 "Saint-Germain-en-Laye Antlaşması"
 AUS_treaty_of_saint_germain_en_laye_desc:0 "Büyük Savaş'tan sonra imzalanan katı bir antlaşmayla bağlı olan Avusturya Ordusu ve askeri sanayi, bir zamanlar oldukları şeyin yalnızca bir gölgesi."
 AUS_treaty_of_saint_germain_en_laye_tt:0 "Gönüllü gönderebilir: §Rhayır§!"
 AUS_treaty_of_saint_germain_en_laye_tt_2:0 "§RBu Ulusal Ruh aktif olduğu sürece, zorunlu askerlik yasası 'Sadece Gönüllü'nün ötesine yükseltilemez. Birimler eğitilemez, dağıtılamaz veya şablonları değiştirilemez§!"
 AUS_unfriendly_neighbor:0 "Dost Olmayan Komşu"
 AUS_volunteer_effort:0 "Gönüllü Çabası"
 AUS_widespread_unemployment:0 "Yaygın İşsizlik"
 AUS_widespread_unemployment_desc:0 "Ekonomik çöküşün ardından Avusturya, enflasyon ve yüksek işsizlik oranlarıyla mücadele etti. Politikacılara karşı duyulan kin üst düzeyde."
 AUS_women_in_academia:0 "Akademide Kadınlar"
 AUS_women_in_academia_desc:0 "Kadınların yüksek öğrenime katılmasına izin vermek, Avusturya'daki bilimsel ilerlemenin önemli ölçüde ileriye sıçramasını sağladı."
 BEL_academies_of_belgium_dynamic_modifier:0 "Belçika Akademileri"
 BEL_academies_of_belgium_dynamic_modifier_desc:0 "Belçika Akademileri, ülke genelindeki yüksek öğrenim enstitülerinin kolektif bir organizasyonudur ve Belçika teknolojik atılımlarının tam kalbinde yer alır."
 BEL_academies_of_belgium_dynamic_modifier_tt:0 "§Y$BEL_academies_of_belgium_dynamic_modifier$§! etkenini şu şekilde geliştir:"
 BEL_austrian_resistance_active_state_dynamic_modifier:0 "Avusturya Özgürlük Cephesi"
 BEL_austrian_resistance_active_state_dynamic_modifier_desc:0 "Avusturya Özgürlük Cephesi eyalette aktiftir, bu da daha büyük bir askere alma havuzu ve eyaletin işgal edilmesi durumunda daha fazla direniş anlamına gelir."
 BEL_belgian_congo_colonial_returns_dynamic_modifier:0 "Sömürge Geri Dönüşleri"
 BEL_belgian_immigration_ns:0 "[BEL.GetAdjective] Göçü"
 BEL_belgian_legion_dynamic_modifier:0 "Belçika Lejyonu"
 BEL_belgian_legion_dynamic_modifier_desc:0 "Muhafazakar ve kralcı sadıklardan oluşan bir topluluk, krallarının adına silahlanmaya hazır ve istekli bir şekilde bekliyor."
 BEL_belgian_miracle_dynamic_modifier:0 "Belçika Mucizesi"
 BEL_belgian_miracle_dynamic_modifier_desc:0 "[ROOT.GetLeader]'in politikaları gerçekten karşılığını verdi ve [ROOT.GetName] küresel sahnede öne çıktı, sanayisi sözde büyük güçlerin çoğunun hayranlığını kazandı."
 BEL_belgian_resistance_state_dynamic_modifier:0 "Belçika Direnişi"
 BEL_belgian_resistance_state_dynamic_modifier_desc:0 "Halkımız işgale yabancı değil, birçoğu son savaş sırasında sivil itaatsizlik ve direniş derslerini öğrenmişti."
 BEL_burgundian_heritage_ns:0 "Burgonya Mirası"
 BEL_burgundian_heritage_ns_desc:0 "Burgonya'nın altın çağının refahına atıfta bulunarak, ulusun askeri, siyasi ve ekonomik potansiyeli bir kez daha şüphesizdir."
 BEL_chasseurs_ardennais_ns:0 "Chasseurs Ardennais"
 BEL_chasseurs_ardennais_ns_desc:0 "Chasseurs Ardennais, Belçika Ardenleri'nin tecrübeli savunucularıdır, orman savaşında son derece deneyimli ve eğitimlidirler."
 BEL_chasseurs_ardennais_ns_ncns:0 "$BEL_chasseurs_ardennais_ns$"
 BEL_chasseurs_ardennais_ns_ncns_desc:0 "$BEL_chasseurs_ardennais_ns_desc$"
 BEL_cockerill_industrial:0 "Cockerill"
 BEL_cog_diamond_investment_into_construction:0 "[COG.GetAdjective] Elmaslarını Kullanarak İnşaata Yatırımlar"
 BEL_cog_gold_investment_into_infrastructure:0 "[COG.GetAdjective] Altını Kullanarak Altyapıya Yatırımlar"
 BEL_cog_gold_investment_into_welfare:0 "[COG.GetAdjective] Altını Kullanarak Refaha Yatırımlar"
 BEL_collapsing_government_ns:0 "Çöken Hükümet"
 BEL_collapsing_government_ns_desc:0 "Yolsuzluk iddiaları hükümeti o kadar sarstı ki, fareler batan gemiden kaçıyor. Neredeyse her gün istifalar oluyor ve bu kabinenin ömrünün çok uzun olmadığı açık."
 BEL_colonial_maritime_company:0 "Compagnie Belge Maritime du Congo"
 BEL_communism_in_congo:0 "Belçika'nın İşçi Haklarına Yatırımları"
 BEL_construction_investments:0 "İnşaat Yatırımları"
 BEL_convoy_protection_duties_ns:0 "Konvoy Koruma Görevleri"
 BEL_convoy_protection_duties_ns_desc:0 "Deniz yolları giderek daha tehlikeli hale geldi, bu yüzden tüccar denizcilerimizin denizcilerini silahlandırdık, böylece konvoylarımız saldırıya uğrarsa, kaçmalarını daha olası kılmak için bile olsa bir miktar korumaya sahip olur."
 BEL_corruption_dynamic_modifier:0 "Yolsuzluk"
 BEL_corruption_dynamic_modifier_desc:0 "Hükümetimizde yolsuzluk kol geziyor, rüşvet ve zimmete para geçirme de dahil olmak üzere bir dizi suçu içeren bir dizi skandal yaşanıyor. Demokratik kurumlarımıza olan halk güveni hiç bu kadar düşük olmamıştı."
 BEL_corruption_ns_fake:0 "$BEL_corruption_dynamic_modifier$"
 BEL_corruption_ns_fake_desc:0 "$BEL_corruption_dynamic_modifier_desc$"
 BEL_corvette_fleet_ns:0 "Korvet Filosu"
 BEL_dame_blanche_ns:0 "Dame Blanche"
 BEL_dame_blanche_ns_desc:0 "Büyük Savaş sırasında oluşturulan direniş örgütü görünüşe göre sadece kış uykusuna yatmıştı, çünkü Belçika bir kez daha tehdit altında olduğunda tekrar faaliyete geçti. Bu grup, gölgelerden müttefiklerimize bilgi sağlıyor ve direniş çabalarını koordine ediyor."
 BEL_defensive_neutrality_capstone_ns:0 "Savunmacı Yeniden Düzenleme"
 BEL_defensive_neutrality_capstone_ns_desc:0 "İstilaya hazırlanmak için elimizden geleni yaptık, geriye kalan tek şey, en modern savunma düşüncesi hatları boyunca yönlendirilen daha stratejik ve üst düzey doktrinel değişiklikleri belirlemektir."
 BEL_defensive_neutrality_dynamic_modifier:0 "Savunmacı Tarafsızlık"
 BEL_defensive_neutrality_dynamic_modifier_desc:0 "Tarafsızlığımızı korumak için, savunmamızın hiçbir işgalcinin bize saldırmak istemeyeceği şekilde olmasını sağlamalıyız."
 BEL_defensive_reorganization_dynamic_modifier:0 "Savunmacı Yeniden Düzenleme"
 BEL_defensive_reorganization_dynamic_modifier_desc:0 "Daha stratejik ve üst düzey doktrinel değişiklikler belirledik ve modern savunma teorisinde dünya liderleri arasındayız."
 BEL_democratization_of_education_ns:0 "Eğitimin Demokratikleştirilmesi"
 BEL_democratization_of_education_ns_desc:0 "Toplumumuzun birbirine özen gösterme geleneği vardır, bu en iyi şekilde işçilerimiz ve şirketler arasındaki sosyal sözleşme ile somutlaşır. Benzer şekilde, devlet herkese fırsat eşitliği sağlamaya çalışmalı ve iyi bir eğitimin önemini vurgulamalıdır."
 BEL_dissolve_political_parties_ns:0 "Siyasi Partileri Feshet"
 BEL_dissolve_political_parties_ns_desc:0 "Başbakanımız, siyasi partilerin yozlaşmış siyasi sistemimizin çürümüş çekirdeğinde olduğunu ilan etti ve bu hastalığı tedavi etmek için partilerin feshedilmesi gerekiyor."
 BEL_distrigaz:0 "Distrigaz"
 BEL_economic_downturn_dynamic_modifier:0 "Ekonomik Gerileme"
 BEL_economic_downturn_dynamic_modifier_desc:0 "Son savaşın ulusumuzu bir savaş alanına çevirmesinden bu yana ekonomimiz darmadağın oldu, toparlanma ise hala kurtulmak için mücadele ettiğimiz küresel bunalımın etkileriyle daha da engellendi."
 BEL_economic_recovery_ns:0 "Ekonomik Toparlanma"
 BEL_economic_recovery_ns_desc:0 "Zayıflamış ekonomimiz ilk toparlanma belirtilerini göstermeye başladı. Harcamalar arttı, borç azaldı ve spekülatörler piyasaya daha fazla güven gösteriyor."
 BEL_emergency_measures:0 "Acil Durum Önlemleri"
 BEL_empowered_construction_unions_ns:0 "Güçlendirilmiş İnşaat İşçileri Sendikaları"
 BEL_empowered_factory_workers_unions_ns:0 "Güçlendirilmiş Fabrika İşçileri Sendikaları"
 BEL_empowered_miner_unions_ns:0 "Güçlendirilmiş Maden İşçileri Sendikaları"
 BEL_engine_of_the_economy_dynamic_modifier:0 "Ekonominin Motoru"
 BEL_engine_of_the_economy_dynamic_modifier_desc:0 "Refah ekspres trenine herkes binsin, sanayinin çarkları dönerken ivme kazanıyor, ileriye doğru buharla ilerliyor ve yeni bir çağın başlangıcını işaret ediyoruz."
 BEL_engine_to_miracle_tt:0 "§Y$BEL_engine_of_the_economy_modifier$§! etkenini §Y$BEL_belgian_miracle_dynamic_modifier$§! ile değiştir."
 BEL_european_crusade_dynamic_modifier:0 "Avrupa Haçlı Seferi"
 BEL_european_crusade_dynamic_modifier_desc:0 "Avrupa idealinin atan kalbi olarak duruyoruz ve sınırlarında akbabalar dönerken, barbar tehditlerinin, bu ne şekil alırsa alsın, engellenmesini görmek bizim sağlam kararlılığımıza bağlıdır."
 BEL_european_crusade_dynamic_modifier_rexist_tt:0 "§Y$BEL_european_crusade_dynamic_modifier$ (Rexist)§! ekle:"
 BEL_european_crusade_dynamic_modifier_tt:0 "§Y$BEL_european_crusade_dynamic_modifier$§! etkenini şu şekilde geliştir:"
 BEL_european_crusade_dynamic_modifier_vnv_tt:0 "§Y$BEL_european_crusade_dynamic_modifier$ (VNV)§! ekle:"
 BEL_flooded_tank_barriers_dynamic_modifier:0 "Sular Altında Tank Bariyerleri"
 BEL_flooded_tank_barriers_dynamic_modifier_desc:0 "Bu bölge, düşman birim hareketini yavaşlatmak ve Belçika'nın savunmasına yardımcı olmak için tasarlanmış su engellerinin altına gizlenmiş dağınık tank bariyerlerine sahiptir."
 BEL_gold_reserves_dynamic_modifier:0 "[BEL.GetAdjective] Altın Rezervi"
 BEL_industrial_investments:0 "Sanayi Yatırımları"
 BEL_inflation_controls_ns:0 "Enflasyon Kontrolleri"
 BEL_inflation_controls_ns_desc:0 "Enflasyonun etkilerini azaltma çabasıyla para satın almaya ve hasarlı para birimleri için yeni banknot basmamaya, faiz oranlarını değiştirmeye ve ekonomi içinde harcamayı teşvik etmeye başladık."
 BEL_international_stipend_ns:0 "Uluslararası Maaş"
 BEL_interpreters_ns:0 "Belçikalı Tercümanlar"
 BEL_king_law_freedom_ns:0 "Kral, Yasa, Özgürlük"
 BEL_king_law_freedom_ns_desc:0 "Belçika'nın sloganı, Belçika ruhunu iyi özetliyor. Kral, bizi zafere götürecek olan. Yasa, savaşın kaosuna vuran kılıç. Özgürlük, Belçika ve Belçikalılar için."
 BEL_lack_of_junior_officers_ns:0 "Astsubay Eksikliği"
 BEL_lack_of_junior_officers_ns_desc:0 "Kuvvetlerimizin hızlı seferberliği, bir sorun dışında genel olarak iyi ilerledi: yeni askerlerimizi organize edecek astsubay eksikliği! Askeri hiyerarşinin kendini yeniden düzenlemesi biraz zaman alacak."
 BEL_language_barriers_fas_fr_ns:0 "Fransızca Dil Önceliği"
 BEL_language_barriers_fas_fr_ns_desc:0 "[ROOT.GetName] içinde uygulanacak birincil dil olarak Fransızca seçilmiş, birlik adına Valon kültürü teşvik edilmiş ve Flaman kültürü bastırılmıştır."
 BEL_language_barriers_fas_nl_ns:0 "Hollandaca Dil Önceliği"
 BEL_language_barriers_fas_nl_ns_desc:0 "[ROOT.GetName] içinde uygulanacak birincil dil olarak Hollandaca seçilmiş, birlik adına Flaman kültürü teşvik edilmiş ve Valon kültürü bastırılmıştır."
 BEL_language_barriers_ns:0 "Dil Engelleri"
 BEL_language_barriers_ns_desc:0 "Belçika iki dil grubu arasında bölünmüştür: Valon bölgelerinden gelenlerin konuştuğu Fransızca ve Flamanların uyguladığı Hollandaca. Her iki taraf da kültürleri ve miraslarıyla son derece gurur duyar ve dil buna sıkı sıkıya bağlıdır, bu yüzden ne kendilerininkinden vazgeçmek isterler ne de dillerinin diğerine tabi olmasını isterler."
 BEL_legacy_of_the_belgian_airforce_ns:0 "Belçika Hava Kuvvetleri'nin Mirası"
 BEL_legacy_of_the_belgian_airforce_ns_desc:0 "Belçika, hava gücünü benimseyen ilk uluslardan biriydi ve pilotlarımız Büyük Savaş'ta çok cesurca savaştı. Onların mirası, onların izinden gitmekten başka bir şey istemeyen mevcut pilot neslimiz tarafından kabul edildi."
 BEL_legacy_of_the_great_war_ns:0 "Büyük Savaş'ın Mirası"
 BEL_legacy_of_the_great_war_ns_desc:0 "Flandre tarlaları, Batı Cephesi'nin en şiddetli çatışmalarından bazılarına sahne oldu, bu saha Kral Albert, cesur Belçikalı askerleri ve müttefiklerimizin fedakarlıkları tarafından şiddetle savunuldu. Bu anıyı onurlandırmalı ve onların örneğini sürdürmeye çalışmalıyız."
 BEL_license_POL_air_idea:0 "Polonya Uçak Lisansı"
 BEL_license_POL_air_idea-desc:0 "Polonyalı ortaklarımızla olan iyi ilişkilerimiz sayesinde, çok makul oranlarda bir dizi askeri lisans alabildik."
 BEL_license_air_idea:0 "Hava Lisansları"
 BEL_license_air_idea_desc:0 "Hızlı bir şekilde uçak edinmemiz gerekiyordu, bu yüzden yabancı işletmelerle bir dizi sözleşme imzaladık."
 BEL_maritime_phoenix_ns:0 "Deniz Anka Kuşu"
 BEL_maritime_phoenix_ns_desc:0 "Anka kuşunun küllerinden doğduğu gibi, filomuz da hurdaya çıkarılmış gemilerin enkazlarından doğar."
 BEL_maritime_support_ns:0 "Denizcilik Desteği"
 BEL_maritime_support_ns_desc:0 "Artık giderek artan askeri deniz altyapısını devreye soktuğumuza göre, filomuzun yetenekleri önemli ölçüde genişledi."
 BEL_mobilize_the_nation_dynamic_modifier:0 "Ulusu Seferber Et"
 BEL_mobilize_the_nation_dynamic_modifier_desc:0 "Halkımız en büyük varlığımızdır. Mümkün olan en büyük gücü oluşturmak için onları seferber edelim."
