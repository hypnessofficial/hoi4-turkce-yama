 AUS_austrofascism:0 "Avusturya Faşizmi"
 AUS_austrofascism_desc:0 "Batı'nın demokratik parlamentarizmini reddeden ve korporatif bir devlet olarak işleyen Vaterländische Front, kendini tek yönetici parti olarak bulur. Anayasa, Avusturya'yı Korporatizm, Otoriterlik ve Milliyetçiliğe yönlendirmek için yeniden düzenlenmiştir."
