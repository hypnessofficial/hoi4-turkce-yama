 GER_army_communist_modifier_desc:0 "Halk Ordusu, sosyalizmin kalkanı olarak duruyor, proleter devrimini korumaya ve yaymaya hazır. Halkın Genelkurmayının yenilikçi düşüncesi, herhangi bir emperyalist saldırganlığın Alman halkının devrimci ruhunu söndürememesini sağlar."
 GER_army_modifier:0 "Deutsches Heer"
 GER_army_modifier_desc:0 "[GER.GetNameDefCap], yenilikçi düşünce geleneğine sahip uzun ve gururlu bir askeri tarihe sahiptir. Genelkurmay, Büyük Savaş'taki aşağılayıcı yenilgiden bu yana silahlı kuvvetlerimizi daha da geliştirmeye çalışmıştır. Bu uzmanlıkla donanmış ordumuz, gururlu halkımızı boyunduruk altına almak isteyen her türlü düşmana karşı saldırmaya hazırdır."
 GER_aufrusting_modifier:0 "Aufrüstung"
 GER_aufrusting_modifier_desc:0 "İnşa edilen her fabrika, harcanan her Mark ve yatırılan her kaynak, zorlu bir savaş makinesi kurma konusundaki iddialı hedefimizi besliyor. Yeniden silahlanma, Aufrüstung, ulusumuzun geleceğini korumak ve Alman egemenliğini güçlendirmek için çok önemlidir."
