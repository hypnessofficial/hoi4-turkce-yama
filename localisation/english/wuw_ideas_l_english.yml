 AUS_compensation_for_guarantee:0 "Dış Destek İçin Telafi"
 AUS_compensation_for_guarantee_desc:0 "Bizi destekleyen diğer ülkelere sahip olmak ucuza gelmedi. Tüketim malları üretimlerinin bir kısmını üstlenmeyi teklif ederek, en kötüsü olması durumunda onların desteğini satın almayı başardık."
 AUS_compensation_for_guarantee_intro_tt:0 "§YGarantiler İçin Telafi§! etkenini şu şekilde değiştir:"
 AUS_construction_guilds_idea:0 "Maurer, Zimmerer und Dachdecker Zünfte"
 AUS_covering_the_phonix_insurances:0 "Phönix Sigortasını Karşılama"
 AUS_covering_the_phonix_insurances_desc:0 "Halkın sevgili Phönix sigortalarının artık olmadığını bilmesine izin vermek, bir orduyu sürdürme ve geliştirme kabiliyetimiz üzerinde ciddi sonuçlar doğururdu. Phönix Sigortası tekrar ayağa kalkana kadar devlet, sigortayı karşılayacak."
 AUS_creditanstalt:0 "Creditanstalt"
 AUS_creditanstalt_bankverein:0 "Creditanstalt-Bankverein"
 AUS_devalued_the_schilling:0 "Şilinin Değeri Düşürüldü"
 AUS_devalued_the_schilling_desc:0 "Enflasyonu önlemek için para biriminin değeri düşürüldü. Kısa vadede etkiler tam olarak faydalı değil, ancak uzun vadede bunun ulus için bir iyileştirme olduğu kanıtlanmalı."
 AUS_domestic_air_production:0 "Yerli Uçak Üretimi"
