 GER_the_inner_circle_dm:0 "İç Çember"
 GER_the_inner_circle_dm_desc:0 "Führer'in İç Çemberi, [GER.GetNameDef]'in siyasi elitini, [GER.GetLeader]'in vizyonunu ilerletmeye hazır ateşli sadıkları içerir. Hırsla dolu olan hepsi, Reichsleiter, Reich Lideri olmak için İç Çember içinde Yükselmeye çalışır. Nüfuzları askeri, endüstriyel ve siyasi kararları şekillendirir ve Alman politika yapımını yönlendirir. Hırsları aynı zamanda bir gerilim kaynağıdır, çünkü hırs entrika ve ihanete yol açar."
 GER_the_inner_circle_dm_tt:0 "Aktif §Yİç Çember§! Danışmanları: \n[GetAscendedAdvisor1][GetAscendedAdvisor2][GetAscendedAdvisor3]"
