 GER_nachtjagdgeschwader_desc:0 "Nachtjagdgeschwader'imiz veya Gece Avcı Filolarımız, sınırlarımızı geçmeye cüret eden her düşman uçağını avlayıp yok edecektir. Bu filolar gece göklerine hükmeder, karanlık örtüsü altında vatanımızı düşman bombardıman uçaklarından korur."
