 GER_airforce_communist_modifier_desc:0 "Hava Kuvvetlerimiz, Proleter devleti ve sosyalizmin geleceğini korumak için göklerde süzülüyor. Her uçak, halkımızın yaratıcılığının ve amansız ruhunun bir kanıtı olarak uçar, karşılaşabileceği her düşmanla başa çıkmaya hazırdır."
 GER_airforce_modifier:0 "Luftwaffe"
 GER_airforce_modifier_desc:0 "Eşsiz beceri ve teknik hünerle Luftwaffe, göklere hükmetmeye ve bize meydan okumaya cüret eden aptal düşmanlara gücümüzü yansıtmaya hazırdır. En son teknoloji uçaklar ve uzman eğitimli pilotlarla Hava Kuvvetlerimiz, gökleri ateşe vermeye, her orduyu yok etmeye ve bize karşı çıkan her donanmayı batırmaya hazırdır."
