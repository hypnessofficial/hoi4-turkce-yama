 HUN_a_multi_ethnic_empire:0 "Çok Etnikli bir İmparatorluk"
 HUN_a_multi_ethnic_empire_desc:0 "İmparatorluğumuz birçok farklı insanı ve kültürü kapsar ve bu, tamamen benimsediğimiz, krallığımızın farklı yerelliklerine büyük özerklik tanıdığımız, halkımızın bizim bir parçamız olarak kalmak istemesini sağlayan bir şeydir."
 HUN_academy_of_sciences:0 "Macar Bilimler Akademisi"
 HUN_academy_of_sciences_desc:0 "[ROOT.GetAdjective] Bilimler Akademisi'nin genişlemesine yapılan yatırımlarla, ulusumuz rakiplerimizden teknolojik olarak daha hızlı ilerleyebilecektir."
 HUN_agrarian_tradition:0 "Macar Tarım Geleneği"
 HUN_agrarian_tradition_desc:0 "Gururlu tarım geleneklerimiz, şimdi evimiz dediğimiz bu yere gelmeden çok öncesine dayanıyor. Bu geleneklere değer vermeli ve onları mümkün olduğunca teşvik etmeliyiz."
 HUN_apostolic_kingdom_idea:0 "Apostolik Krallık"
 HUN_apostolic_kingdom_idea_desc:0 "Aziz Stephen'dan bu yana yüzyıllardır adlandırıldığı gibi, Apostolik Majesteleri açıkça Hristiyanlığın sonraki günlerdeki bir havarisidir, tüm Hristiyan toprakları üzerinde hak iddia eder ve Oğul adına yönetme hakkına sahiptir. Haklı olarak bizim olan her şeyi geri almalıyız!"
 HUN_arrow_cross_idea:0 "Ok Haç"
 HUN_bastion_of_catholicism:0 "Katolikliğin Kalesi"
 HUN_bastion_of_catholicism_desc:0 "Ulusumuz dindar bir şekilde katoliktir ve askerlerimiz büyük inancın koruyucuları, kutsal majestelerinin hizmetkârları olarak hizmet edecektir."
 HUN_combined_warfare_effort_idea:0 "Birleşik Harp Odağı"
 HUN_crackdown_on_extremism:0 "Aşırılığa Karşı Baskı"
 HUN_crackdown_on_extremism_desc:0 "Yeni başbakan Kálmán Darányi'nin yeni aşırılık karşıtı reformlarının bir parçası olarak, Ferenc Szálasi tutuklandı ve ulusal-sosyalist siyasi partisi Ulusal İrade Partisi yasaklandı."
 HUN_denounce_bolshevism_idea:0 "Stalinizme Karşı Savaş"
 HUN_entered_an_offensive_war_flag:0 " Macaristan bir saldırı savaşına girdi"
 HUN_following_entente_stipulations:0 "Küçük Antant Şartlarına Uygun Olarak"
 HUN_forceful_industrial_revitalization:0 "Zorlu Endüstriyel Canlandırma"
 HUN_forceful_industrial_revitalization_desc:0 "Hükümet, ulusal endüstrilerin yeniden ayağa kalkabilmesini sağlamak için sert önlemler aldı. Ancak sadece zaman, bu eylemin başarılı olup olmadığını gösterecek."
 HUN_gombos_trade_treaty:0 "Gömbös Ticaret Antlaşması"
 HUN_gombos_trade_treaty_arms_market_tt:0 "§YAlmanya§! ile Silah Ticaretine izin verir!"
 HUN_gombos_trade_treaty_desc:0 "Gyula Gömbös'ün 1934'te Almanya ile imzaladığı ticaret antlaşması, ekonomimizi canlandırmak ve büyük buhrandan kurtulmaya yardımcı olmak için önemlidir, ancak büyük dezavantajları da vardır. Anlaşma bize buğday satışları için uygun bir fiyat verse de, kazanılan para Almanya'daki bir hesapta kalmalı ve yalnızca Alman sanayi mallarını satın almak için kullanılmalıdır. Bu böyle devam ederse, Almanya ülkemiz üzerinde ekonomik hakimiyet kurabilecek."
 HUN_gombos_trade_treaty_tt:0 "Gömbös Ticaret Antlaşması, Almanya ile ticaret yapmamızı sağlar"
 HUN_goulash_communism_idea:0 "Gulaş Komünizmi"
 HUN_great_bulwark_against_the_west_ns:0 "Büyük Siper"
 HUN_habsburg_restored_desc:0 "1526'dan beri ulusumuz Habsburg hanedanı tarafından yönetilmektedir, çünkü topraklarımız üzerinde ilahi bir hak iddia etmektedirler. Monarşinin restorasyonu ile, onların kalıcı olmasını ve ulusumuzun bir kez daha cumhuriyetçi ahlaksızlığa düşmeyeceğini sağlama zamanı geldi."
 HUN_heirs_of_the_huns_idea:0 "Hunların Gerçek Varisleri"
 HUN_horthyist_royal_guard:0 "Kraliyet Muhafızları"
 HUN_hungarian_autarky_idea:0 "Macar Otarkisi"
 HUN_hungarian_autarky_idea_desc:0 "Eğer ulus, düşmanlarla çevrili olarak kendi başına hayatta kalacaksa, söz konusu üretimle ilişkili yüksek maliyetlere rağmen, ihtiyaç duyduğu her şeyi kendisi için üretmeyi öğrenmelidir."
 HUN_hungarian_gendarmerie:0 "Magyar Királyi Csendőrség"
 HUN_hungarian_gendarmerie_desc:0 "Sınırlarımızı ve liderlerimizi tehlikeden korumak için, paramiliter jandarmamız genişletilmeli ve kendi başına hareket etme konusunda daha fazla yetki verilmelidir."
 HUN_hungarian_gendarmerie_hussars:0 "Kara Lejyon Jandarması"
 HUN_hungarian_gendarmerie_hussars_desc:0 "Sınırlarımızı ve liderlerimizi tehlikeden korumak için, paramiliter jandarmamız genişletilmeli ve kendi başına hareket etme konusunda daha fazla yetki verilmelidir."
 HUN_hungarian_life_movement_idea:0 "Macar Yaşam Hareketi"
 HUN_hungarian_national_defense_association:0 "Macar Ulusal Savunma Derneği"
 HUN_hungarian_national_defense_association_desc:0 "1919'da kurulan aşırı sağcı, büyük ölçüde paramiliter bir örgüt olan M.O.V.E., büyük ölçüde lideri ve kurucu figürü Gyula Gömbös'e sadıktır. Buna rağmen, güçlü anti-komünist duruşu nedeniyle Miklós Horthy'ye de büyük saygı duyuyorlar."
 HUN_hungarian_national_defense_association_greenshirts:0 "Macar Ulusal Savunma Derneği"
 HUN_hungarian_national_defense_association_greenshirts_desc:0 "1919'da kurulan aşırı sağcı, büyük ölçüde paramiliter bir örgüt olan M.O.V.E., büyük ölçüde lideri ve kurucu figürü Gyula Gömbös'e sadıktır. Ancak Yeşil Gömlekliler ve Tırpan Haç örgütünün içine katılmasıyla sadakati dağılmış ve Ok Haç liderlerine herkesten daha sadık olabilir."
 HUN_levente_associations:0 "Levente Dernekleri"
 HUN_levente_associations_desc:0 "Halkımız, Levente olarak bilinen paramiliter gençlik örgütleri kurdu. Onlar, fiziksel ve sağlık eğitimi kisvesi altında, Macar gençliğini hem sınırlarımız içinde hem de dışında savaşa ve haklı topraklarımızın nihai olarak yeniden fethine hazırlıyor."
