 COG_expansionism:0 "Yayılmacılık"
 COG_extensive_gold_mines:0 "Altın Baronları"
 COG_force_publique:0 "Force Publique"
 COG_force_publique_desc:0 "Force Publique, Kongo'nun jandarma ve askeri gücüdür, 1877'de Kongo Bağımsız Devleti altında kurulmuştur. Subayları tamamen Avrupalıdır, ya Belçikalılar ya da Paralı Askerlerdir, sıradan askerler ise çoğunlukla Kongo yerlisidir. Güç, gerektiğinde savaşmada çok etkilidir, ancak eşitsizlik ve kötü yönetim büyük hoşnutsuzluk noktalarıdır."
 COG_force_publique_fake_idea_tt:0 "Azami Komuta Gücü Artışı: §R-50§!\nGünlük Komuta Gücü Kazanımı Çarpanı: §R-%50§!"
 COG_force_publique_mutinies:0 "Force Publique'te İsyanlar"
 COG_forminiere:0 "Société Internationale Forestière et Minière du Congo"
 COG_forminiere_idea:0 "Forminière Ekonomik Fazlası"
 COG_german_colonial_administration:0 "Alman Tarzı Sömürge Yönetimi"
 COG_heat_resistant_cobalt_idea:0 "Isıya Dayanıklı Kobalt"
 COG_heat_resistant_cobalt_small_idea:0 "Isıya Dayanıklı Kobalt"
 COG_in_the_sterling_area:0 "Sterlin Sahasının Bir Parçası"
 COG_kasai_separatism_modifier:0 "Kasai Ayrılıkçılığı"
 COG_kasai_separatism_modifier_desc:0 "Kasai bölgesi büyük ayrılıkçı duygular beslemektedir ve halkının bir Kongo bağımsızlık savaşı durumunda sömürgeci efendilerine karşı ayaklanıp savaşması muhtemeldir."
 COG_katanga_separatism_modifier:0 "Katanga Ayrılıkçılığı"
 COG_katanga_separatism_modifier_desc:0 "Bu bölgenin bir Kongo bağımsızlık savaşı durumunda kendi devleti olarak Belçikalıların yanında yer alması muhtemeldir."
 COG_kongo_volunteer_force_idea:0 "Pan-Kongo Gönüllüleri"
