 GER_economy_of_conquest_modifier:0 "Fetih Ekonomisi"
 GER_economy_of_conquest_modifier_desc:0 "Versay Antlaşması'nın adaletsiz hükümlerine rağmen, sarsılmaz bir kararlılıkla küllerimizden doğuyoruz. Yorulmak bilmez bir yeniden silahlanma yoluyla, zafere yükselişimizi beslemek için rakipsiz bir askeri sanayi kurmaya kendimizi adadık. Bu, ekonomimizi zorlayacak, ancak zaferle birlikte fetih ganimetlerini toplama, diğer ulusların zenginliğini silahlı kuvvetlerimizi güçlendirmek için yönlendirme fırsatı geliyor. Vay yenik düşenlerin haline!"
