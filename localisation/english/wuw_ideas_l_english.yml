 HUN_old_hungary_reclaimed:0 "Büyük Macaristan Geri Geldi"
 HUN_old_hungary_reclaimed_desc:0 "Sonunda, Trianon Antlaşması'yla bize zorla dayatılan aşağılanmayı geri aldık, çünkü bizim olanı başarıyla geri almayı başardık!"
 HUN_pan_ugric_volunteer_force:0 "[ROOT.GetAdjective] Gönüllü Kuvvetleri"
 HUN_pan_ugric_volunteer_force_desc:0 "Fin-Ugor kardeşlerimize yardım etme konusundaki son şevkimiz, yurtdışındaki savaşa katılmak isteyen [ROOT.GetAdjective] gönüllülerin işe alınmasını teşvik etti."
 HUN_payments_from_hungary_idea:0 "[HUN.GetNameDef]'den Gelen Ödemeler"
 HUN_power_to_the_regent_idea:0 "Güç Naip'e"
 HUN_power_to_the_regent_idea_desc:0 "XIX. Tüzüğün geçmesiyle, [ROOT.GetNameDef] naibine daha fazla güç verildi ve halkın sadakati büyük liderleri Miklós Horthy'ye aittir."
 HUN_promises_of_peace:0 "Barış Vaatleri"
 HUN_promises_of_peace_desc:0 "Küçük Antant'ın güçlerini yatıştırmak için, askerileşmeyeceğimize veya saldırgan bir şekilde genişlemeyeceğimize söz vermek zorunda kaldık, bu da geçici olarak bodur bir orduya yol açtı."
 HUN_promoted_hungarianism:0 "Macarcılığı Teşvik Etme"
 HUN_promoted_hungarianism_desc:0 "Ulusal çıkarlarımıza en iyi şekilde hizmet etmek için, Macarcılık hareketini desteklemeli ve halkımızın geleceğimizin nerede yattığını bilmesini sağlamalıyız."
 HUN_promoting_entrepreneurship:0 "Girişimciliği Teşvik Etme"
 HUN_rapid_army_expansion:0 "Hızlı Ordu Genişlemesi"
 HUN_rapid_army_expansion_desc:0 "Savaş Avrupa'ya yaklaşırken, her erkek anında vatanını savunmaya hazır olmalıdır. [HUN.GetAdjective] erkeğinin bu duyguyu anlamasının ve ihtiyaç anında bize yardım etmeye hazır olmasının zamanı geldi."
 HUN_rapid_army_groups_idea:0 "Hızlı Ordu Grupları"
 HUN_rapid_army_groups_idea_desc:0 "Ordumuz, herhangi bir zamanda ihtiyaç duyduğu yere olabildiğince çabuk ulaşabilmesi için yeniden düzenlendi."
 HUN_recon_airplane_focus:0 "Keşif Uçağı Odağı"
 HUN_recon_airplane_focus_desc:0 "[ROOT.GetNameDefCap], düşmanlarını düzgün bir şekilde gözetlemek için keşif uçağı geliştirme ve kullanımına yoğun bir şekilde yatırım yapıyor."
 HUN_restricted_voting_rights:0 "Kısıtlı Oy Hakları"
 HUN_restricted_voting_rights_desc:0 "Halkın oy haklarını kısıtlamak popüler bir hareket olmayabilir, ancak ülkedeki yükselen komünist ve liberal ideolojileri durdurmak için gerekliydi."
 HUN_resurgent_communist_party_idea:0 "Yeniden Canlanan Kommunisták Magyarországi Pártja"
 HUN_revaluing_the_pengo:0 "Pengő'nün Yeniden Değerlenmesi"
 HUN_revaluing_the_pengo_desc:0 "[HUN.GetAdjective] para birimi Pengő, popüler olmayan bir önlem olmasına rağmen, ekonomiyi güçlendirmek ve enflasyon krizini çözmek için umutsuz bir girişimle yeniden değerleme sürecindedir."
