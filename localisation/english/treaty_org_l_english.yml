l_english:
 NATO_brussels_treaty:0 "Brüksel Antlaşması"
 NATO_brussels_treaty_desc:0 "Acil küresel tehdit bertaraf edildikten sonra, [SOV.GetNameDef] ile batılı müttefikleri arasındaki zayıf düzenlemeler bozulmaya başladı."
 NATO_form_nato_properly:0 "Kuzey Atlantik Antlaşması Teşkilatı'nı Onayla"
 NATO_have_warsaw_pact:0 "Varşova Paktı'nı Öner"
 NATO_have_warsaw_pact_desc:0 "Brüksel Antlaşması'na verilebilecek tek geçerli yanıt, kendi yapımımız olan bir blok organize etmektir."
 NATO_suggest_nato:0 "Kuzey Atlantik Antlaşması Projesi"
 NATO_suggest_nato_desc:0 "Brüksel antlaşmasının genişletilmesi, ittifakımız için mantıksal bir sonraki adımdır."
 SOV_chose_NATO_neutrality:0 "Tarafsızlığı Seçti"
 SOV_joined_NATO:0 "Brüksel Antlaşması'nı İmzaladı"
 TO_chose_neutrality:0 "Zorunlu Tarafsızlık"
 TO_chose_neutrality_desc:0 "Doğu ile Batı arasında bir fırtına koparken, konumumuz dikkatli bir yaklaşım gerektiriyor."
 TO_left_faction:0 "[FROM.GetFactionName] ittifakından ayrıldı."
 TO_nato_ratified:0 "Kuzey Atlantik Antlaşması"
 TO_nato_ratified_desc:0 "Uluslarımızın kaynakları ve istihbaratı birleştirebileceği bir antlaşma. Sebepleri var."
 TO_signed_brussels:0 "Brüksel Antlaşması'nı İmzaladı"
 TO_will_be_invited_to_join_or_leave:0 "Antlaşmayı imzalamayı seçecek veya [ROOT.GetFactionName] ittifakından ayrılacak.\n"
 brussels_to_has_already_happened:0 "Brüksel'deki konferans toplanmadı"
 join_brussels_treaty_tt:0 "Brüksel Antlaşması'nı imzalayacağız"
 nato_decisions:0 "Antlaşma Teşkilatları"
 nato_not_suggested_yet:0 "NATO henüz önerilmedi"
 north_atlantic_treaty_org:0 "NATO"
 treaty_org.1.a:0 "Doğu tehdidi kontrol altına alınmalı."
 treaty_org.1.b:0 "Başka bir savaşa ihtiyacımız yok..."
 treaty_org.1.desc:0 "Acil küresel tehdit bertaraf edildikten sonra, [SOV.GetNameDef] ile batılı müttefikleri arasındaki zayıf düzenlemeler bozulmaya başladı.\n\nAvrupa'daki karşıt hırslarla birleşen iletişimde geri dönülmez bir kopukluktan korkan - Doğu Almanya'daki son gelişmelerin de kanıtladığı gibi - [FROM.GetNameDef], Brüksel'de aceleyle toplanan bir konferansta karşılıklı yardım antlaşması önerdi."
 treaty_org.1.t:0 "Brüksel Antlaşması"
 treaty_org.2.a:0 "Endişe verici bir gelişme."
 treaty_org.2.b:0 "Kaba bir provokasyon."
 treaty_org.2.desc:0 "Dünyaya en kötünün henüz geride kalmadığını hatırlatan bir hamleyle, eski müttefik güçlerden birkaçı bugün Brüksel'de yeni bir antlaşmanın imzalandığını duyurdu.\n\nGörünüşte karşılıklı sivil ve askeri işbirliği antlaşması olarak tasarlanmış olsa da, bunun [SOV.GetNameDef] liderlerine ve müttefiklerine gönderdiği mesaj hakkında pek az kişinin şüphesi kaldı.\n\nBu jeopolitik gerilimin ortasında kalan birkaç devlet, resmi tarafsızlık ilkesini ilan etme fırsatını değerlendirdi."
 treaty_org.2.t:0 "Brüksel Antlaşması İmzalandı"
 treaty_org.3.a:0 "İlginç."
 treaty_org.3.b:0 "Aşağılık."
 treaty_org.3.desc:0 "[USA.GetNameDef] ve [FROM.GetNameDef] hükümetleri, uzun zamandır beklenen bir diplomatik manevrayla dün gece Kuzey Atlantik Antlaşması Teşkilatı'nın kurulduğunu duyurdu. Sivil, askeri ve istihbarat işbirliğinin hayırlı bir dönemini vaat eden karar, [SOV.GetNameDef] üst kademeleri tarafından kötü karşılandı.\n\nBarış, görünüşe göre geçici bir mesele olabilir."
 treaty_org.3.t:0 "Kuzey Atlantik Antlaşması Teşkilatı"
 treaty_org.4.a:0 "İlginç."
 treaty_org.4.b:0 "Pek Kuzey Atlantik gibi görünmüyor."
 treaty_org.4.desc:0 "[FROM.GetNameDef] hükümeti, uzun zamandır beklenen ancak biraz dişsiz bir diplomatik manevrayla dün gece Kuzey Atlantik Antlaşması Teşkilatı'nın kurulduğunu duyurdu. Sivil, askeri ve istihbarat işbirliğinin hayırlı bir dönemini vaat eden karar, [SOV.GetNameDef] üst kademeleri tarafından kötü karşılandı.\n\nBarış, görünüşe göre geçici bir mesele olabilir."
 treaty_org.5.a:0 "Anlaşıldı."
 treaty_org.5.d:0 "Doğu ile Batı arasında yeni bir çatışmanın ortasında kalmaktan korkan [FROM.GetNameDef], derhal [ROOT.GetFactionName] ittifakından ayrılma niyetini açıkladı. Onların yerinde kim onları suçlayabilir ki?"
 treaty_org.5.t:0 "[FROM.GetName] Tarafsızlığı Seçiyor"
 warsaw_pact:0 "Varşova Paktı"
