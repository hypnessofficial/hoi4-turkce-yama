 BBA_italy_anti_colonialism_events.59.desc:0 "Belki de tam bir sürpriz olmasa da, maalesef Orta Afrika halkının artık bizim yönetimimize tabi olma fikrini reddettiğini bildirdik. Bir süredir ihmal edildiklerini ve sömürüldüklerini hissettiler ve bu nedenle yönetimimizden ayrılmak için oy verdiler."
 BBA_italy_anti_colonialism_events.59.t:0 "Orta Afrika [ROOT.GetNameDef]'den Ayrılmak İçin Oy Veriyor"
 BBA_italy_anti_colonialism_events.60.desc:0 "Güney Afrika halkı, topraklarını ne kadar iyi niyetli ve verimli yönettiğimizi gördü ve yönetimimize katılmak için oy verdi! Görünüşe göre eyaletlerindeki yatırımlarımız ve ilgimiz karşılığını verdi. Bu kesinlikle hepimize fayda sağlayacaktır."
 BBA_italy_anti_colonialism_events.60.t:0 "Güney Afrika [ROOT.GetNameDef]'e Katılmak İçin Oy Veriyor"
 BBA_italy_anti_colonialism_events.61.desc:0 "Belki de tam bir sürpriz olmasa da, maalesef Güney Afrika halkının artık bizim yönetimimize tabi olma fikrini reddettiğini bildirdik. Bir süredir ihmal edildiklerini ve sömürüldüklerini hissettiler ve bu nedenle yönetimimizden ayrılmak için oy verdiler."
 BBA_italy_anti_colonialism_events.61.t:0 "Güney Afrika [ROOT.GetNameDef]'den Ayrılmak İçin Oy Veriyor"
 BBA_italy_anti_colonialism_events.62.desc:0 "Orta Doğu halkı, topraklarını ne kadar iyi niyetli ve verimli yönettiğimizi gördü ve yönetimimize katılmak için oy verdi! Görünüşe göre eyaletlerindeki yatırımlarımız ve ilgimiz karşılığını verdi. Bu kesinlikle hepimize fayda sağlayacaktır."
 BBA_italy_anti_colonialism_events.62.t:0 "Orta Doğu [ROOT.GetNameDef]'e Katılmak İçin Oy Veriyor"
 BBA_italy_anti_colonialism_events.63.desc:0 "Belki de tam bir sürpriz olmasa da, maalesef Orta Doğu halkının artık bizim yönetimimize tabi olma fikrini reddettiğini bildirdik. Bir süredir ihmal edildiklerini ve sömürüldüklerini hissettiler ve bu nedenle yönetimimizden ayrılmak için oy verdiler."
 BBA_italy_anti_colonialism_events.63.t:0 "Orta Doğu [ROOT.GetNameDef]'den Ayrılmak İçin Oy Veriyor"
 BBA_italy_anti_colonialism_events_war_will_continue_tt:0 "Savaş devam edecek."
 BBA_italy_bop.1.a:0 "Bu bir felaket!"
 BBA_italy_bop.1.desc:0 "[?ITA.ITA_lost_core.GetName]'ı düşmana kaybettik! Bu doğal olarak İtalyan halkının savaş çabamıza olan inancını sarstı ve hatta barış görüşmeleri için seslerin yükselmesine neden oldu. Bu olaylar birçok kişiyi üzdü, hafifçe söylemek gerekirse, ve insanlar suçlayacak birini arıyorlar. İnisiyatifi yeniden ele almalı ve düşman kuvvetlerini İtalya'dan atmalıyız!"
 BBA_italy_bop.1.t:0 "[?ITA.ITA_lost_core.GetName]'ın düşüşü"
 BBA_italy_bop.2.a:0 "Yeniden yükseleceğiz!"
 BBA_italy_bop.2.desc:0 "Düşman kuvvetleri [?ITA.ITA_lost_colony.GetName]'ın kontrolünü ele geçirdi, bu da her yerdeki İtalyanları şok etti! Halk, savaşın gidişatının lehimize olduğu veya en azından yakında olacağı izlenimi altındaydı. Bu kesinlikle bir aksilik olsa da, iyi bir planlama ve metanetle [?ITA.ITA_lost_colony.GetName]'ı kesinlikle geri alacağız!"
 BBA_italy_bop.2.t:0 "[?ITA.ITA_lost_colony.GetName]'ın düşüşü"
 BBA_italy_bop.3.a:0 "İşler lehimize dönüyor!"
 BBA_italy_bop.3.desc:0 "Muzaffer kuvvetlerimiz [?ITA.ITA_reclaimed_core.GetName]'ı geri aldı, bu da her yerdeki İtalyanların moralini yükseltti! Bu, savaşın gidişatını değiştirdiğimiz ve düşmanları sevgili [ITA.GetNameDef]'imizden geri püskürttüğümüz an olabilir."
 BBA_italy_bop.3.t:0 "[?ITA.ITA_reclaimed_core.GetName]'ı Geri Aldık"
 BBA_italy_civil_war.1.a:0 "Kararlı bir ele ihtiyacımız var!"
 BBA_italy_civil_war.1.b:0 "İstikrara ve geleneğe ihtiyacımız var!"
 BBA_italy_civil_war.1.c:0 "Halkın devrimini kucakla!"
 BBA_italy_civil_war.1.d:0 "Özgürlük hüküm sürsün!"
 BBA_italy_civil_war.1.desc:0 "Sevgili İtalya'mız Savaşın gerilimleri altında parçalandı! Karşıt taraflar şimdi oluşuyor, ulusumuzdan geriye kalanlar için savaşmak ve İtalya'nın ileriye dönük hangi idealleri benimseyeceği konusunda savaşmak için. Hepimizi zor seçimler bekliyor, ama bir kez daha çiçek açabilmemiz için sebat etmeli ve dayanmalıyız."
 BBA_italy_civil_war.1.t:0 "İtalyan İç Savaşı"
 BBA_italy_civil_war.100.a:0 "Toprağı devret"
 BBA_italy_civil_war.100.b:0 "İşgal altındaki toprağı tut"
 BBA_italy_civil_war.100.desc:0 "Kendimizi İtalyan toprağının kontrolünde, bir İtalyan müttefikiyle birlikte savaşırken buluyoruz. Bu toprakları [RDS.GetName]'a devrederek daha fazla kuvvetimizi serbest bırakabilir ve başka yerlere yönlendirebiliriz."
 BBA_italy_civil_war.100.t:0 "İşgal Altındaki İtalyan Toprağı"
 BBA_italy_civil_war.101.a:0 "İleri!"
 BBA_italy_civil_war.101.desc:0 "[FROM.GetName]’in bilge lideri, [FROM.GetLeader], cömertçe İtalyan toprağının kontrolünü bize geri verdi! Bu sadece birlikler için büyük bir moral artışı olmakla kalmaz, aynı zamanda yeteneklerimizi destekleyecek ve tüm İtalya'yı kurtarma çabalarımızı güçlendirecektir."
 BBA_italy_civil_war.101.t:0 "[FROM.GetName] İtalyan Toprağını Devrediyor"
 BBA_italy_civil_war.2.a:0 "Sonsuza kadar saklanamazlar"
 BBA_italy_civil_war.2.desc:0 "Görünüşe göre yeni kurulmuş bir direniş grubu cephe hatlarımızın gerisinde hasara neden oluyor. Grup hakkında çok az şey söyleyebilsek de, büyük ölçüde taraf değiştirmiş eski Ordu subaylarından oluşuyor gibi görünüyorlar. Onları ortaya çıkarmak için çabalar sürüyor, ancak şu anda bir sonraki hamlelerini tahmin etmek için çok az istihbaratımız var."
 BBA_italy_civil_war.2.t:0 "$ITA_fronte_militare_clandestino$"
 BBA_italy_civil_war.3.a:0 "Hain Komünistler!"
 BBA_italy_civil_war.3.desc:0 "Kendilerine Gappisti diyen birkaç küçük komünist partizan grubunun, topraklarımızda birkaç başarılı vur-kaç operasyonu yaptığına dair istihbarat aldık. İyi eğitimli ve silahlılar, bu da onların [FROM.GetName] tarafından finanse edildiğinden şüphelenmemize neden oluyor."
 BBA_italy_civil_war.3.t:0 "$ITA_gappisti$"
 BBA_italy_civil_war.300.desc:0 "[FROM.Adjective] halkını faşizme karşı birleştirme çabalarımız doruğa ulaştı! Artık güzel ülkemizin kan kaybetmesini boş boş izleyemeyiz. Topladığımız güçle, şimdi faşist rejimi kesin olarak devirme ve tüm İtalya'yı tiranlığından kurtarma imkanına sahibiz!"
 BBA_italy_civil_war.4.a:0 "Özgürlük için ölüm!"
 BBA_italy_civil_war.4.desc:0 "[FROM.GetName]'daki direniş ve partizan grupları, İtalya'nın geri kalanını kurtarmak için yorulmadan çalışıyor ve bu bir başarı oldu! Aslında, orada hala iktidarda olan uğursuz rejim, yeni bir dizi sert partizan karşıtı önlem başlatmak zorunda kaldı. Bu, ajanlarımızın [FROM.GetName]'da faaliyet göstermesini zorlaştıracak, ancak özgür bir İtalya için mücadele devam ediyor!"
 BBA_italy_civil_war.4.t:0 "[FROM.GetName]'da Partizan Karşıtı Önlemler"
 BBA_italy_civil_war.5.a:0 "Onlara bağımsızlık ver"
 BBA_italy_civil_war.5.b:0 "Özgürlük yakarışlarını reddet"
 BBA_italy_civil_war.5.desc:0 "İtalyan müttefiklerimiz ve bağlı devletlerimiz, yönetimimizden serbest bırakılmayı ve tam bağımsızlık verilmesini talep ettiler. İtalyan cephesinin tamamen çökmemesini sağlamak için önce [FROM.GetName] üzerinde kontrolü ele aldık, ancak belki de onlara özgürlüklerini verme zamanı geldi."
 BBA_italy_civil_war.5.t:0 "[FROM.GetAdjective] Bağımsızlık Talepleri"
 BBA_italy_civil_war.6.a:0 "Bir kez daha kendi kaderimizin efendisiyiz"
 BBA_italy_civil_war.6.desc:0 "Müttefikimiz - ve geçici - hâkim devletimiz [FROM.GetName], özgürlük çağrımızı dinledi ve bize bağımsızlığımızı geri vermeyi kabul etti! Bu, savaş yorgunu ülkemiz için önemli bir olaydır. Şimdi ciddiyetle yeniden inşa etmeye başlayabiliriz ve birleşmeye giden yol başlayabilir."
 BBA_italy_civil_war.6.t:0 "[ROOT.GetNameDef] için Bağımsızlık"
 BBA_italy_civil_war.7.a:0 "Bunun için pişman olacaklar!"
 BBA_italy_civil_war.7.b:0 "Yetineceğiz..."
 BBA_italy_civil_war.7.desc:0 "Zalim [FROM.Adjective] hâkim devletlerimiz dürüst bağımsızlık talebimizi reddetti! İç savaşımızı kazanmada faydalı olsalar da, artık kaderimizi yönetme veya siyasetimize karışma hakları yok. Zamanı geldiğinde onları topraklarımızdan çıkarmak ve özgürlüğümüzü kendimiz için ele geçirmek bizim görevimizdir!"
 BBA_italy_civil_war.7.t:0 "[FROM.GetName] Bağımsızlık Taleplerimizi Reddediyor"
 BBA_italy_civil_war_communist_tt:0 "§Y$RDS_DEF$§! olacağız, §Y$communism$§! ideolojisine sahip iç savaşın isyancı tarafı. [GetRdsOverlord]"
 BBA_italy_civil_war_democratic_tt:0 "§Y$RDS_DEF$§! olacağız, §Y$democratic$§! ideolojisine sahip iç savaşın isyancı tarafı. [GetRdsOverlord]"
 BBA_italy_civil_war_fascist_tt:0 "§Y[ROOT.GetFlag][ROOT.GetNameDefCap]§!'in kontrolünü elimizde tutacağız. §Y[ROOT.GetFlag][ROOT.GetNameDefCap]§!, §Y$RSI_DEF$§! olur. [GetRsiOverlord]"
 BBA_italy_civil_war_monarchist_tt:0 "§Y$RDS_DEF$§! olacağız, §Y$neutrality$§! ideolojisine sahip iç savaşın isyancı tarafı. [GetRdsOverlord]"
 BBA_italy_colonial_management.1.a:0 "Onları askere al!"
 BBA_italy_colonial_management.1.b:0 "Başka planlarımız var"
 BBA_italy_colonial_management.1.desc:0 "Sömürge mülklerimiz, ulusumuzun kurulmasından bu yana, bir asırdan daha kısa bir süre içinde önemli ölçüde büyüdü. Ancak bu büyüme, insan gücümüzü zorlamaya başladı. Bu sınırlamaları hafifletmenin yolları var, örneğin Meharisti, Savari, Spahi ve diğerleri gibi yerel polis güçlerini kullanarak. Bu grupları askere almak kendi kuvvetlerimizi daha az yoracaktır ve onların kendi topraklarına yerli olmaları, bunun getirdiği her şeyle birlikte avantajı vardır."
 BBA_italy_colonial_management.1.t:0 "Sömürge Polisi"
 BBA_italy_colonial_management.1_do_not_apply_tt:0 "§Y$colonial_police$§! işgal yasası, kontrol altındaki [GetAfricanStates][GetAndOrNothing][GetAlbanianStates]'da mevcut olacak."
 BBA_italy_colonial_management_african_states:0 "Afrika eyaletleri"
 BBA_italy_colonial_management_albanian_states:0 "Arnavutluk eyaletleri"
 BBA_italy_colonial_management_and:0 " ve "
 BBA_italy_communist_events.01.a:0 "Antonio Gramsci haklı liderdir."
 BBA_italy_communist_events.01.b:0 "Palmiro Togliatti'yi takip etmeliyiz."
 BBA_italy_communist_events.01.c:0 "Sandro Pertini bizi ileriye taşıyacaktır."
 BBA_italy_communist_events.01.desc:0 "Yeni kurulan Cumhuriyetimiz faşistlerin pençesinden kurtarıldığına göre, nihayet ülkemiz için yeni bir rota belirleyebiliriz! Şimdi gereken, davamıza bağlı olduğu kadar bilge olan kararlı bir liderdir. Bizi önümüzdeki sıkıntılı zamanlarda yönlendirebilecek ve daha parlak bir geleceğe olan inancında tereddüt etmeyecek biri."
 BBA_italy_communist_events.01.t:0 "Cumhuriyetin Liderliği"
 BBA_italy_communist_events.02.a:0 "Onları destekleyeceğiz!"
 BBA_italy_communist_events.02.b:0 "[ROOT.GetAdjective] halkının bir endişesi değil."
 BBA_italy_communist_events.02.desc:0 "Yeni kurulan [FROM.GetName]'daki yoldaşlarımız bizden yardım istedi. [FROM.GetAdjective] halkı, Komünist yönetimlerini güvence altına almak için bir iç savaşla parçalandı ve şimdi yeni cumhuriyeti yeniden inşa edip koruyabilmek için diğer benzer düşünen hükûmetlere yöneliyorlar."
 BBA_italy_communist_events.02.t:0 "[FROM.GetAdjective] Yardım Çağrısı"
 BBA_italy_communist_events.03.a:0 "Birlik olursak asla yenilmeyiz!"
 BBA_italy_communist_events.03.desc:0 "[FROM.GetName]'daki Hükûmet, komünist yoldaşlardan destek çağrımızı dinledi ve bize yardım etmeye karar verdi! Bu sadece onlarla olan bağlarımızı değil, aynı zamanda sevgili cumhuriyetimizi koruyabilmemiz için savunma yeteneklerimizi de güçlendirecektir."
 BBA_italy_communist_events.03.t:0 "[ROOT.GetNameDef] için Uluslararası Destek"
 BBA_italy_communist_events.04.a:0 "[ROOT.GetNameDefCap] ne olursa olsun galip gelecektir!"
 BBA_italy_communist_events.04.desc:0 "Yardım çağrısına kimse cevap vermedi! Görünüşe göre dünya çapındaki komünistler bizi terk etti ve kendi yoldaşlarına yardım etmeye pek hevesli değiller. Bu acımasız dünyada sadece kendimize güvenebiliriz - ama devrimimiz galip gelecektir!"
 BBA_italy_communist_events.04.t:0 "Uluslararası Destek Alınmadı"
 BBA_italy_communist_events.05.a:0 "Bu [ROOT.GetFactionName]'i güçlendirir!"
 BBA_italy_communist_events.05.desc:0 "Yakın zamanda [FROM.GetAdjective] ordusuyla ortak bir tatbikat tamamladık. Generallerimiz ve amirallerimiz bunun büyük bir başarı olduğunu ve ordumuzun çok iyi performans gösterdiğini bildirmekten mutluluk duyuyorlar. Bu, [FROM.GetName] ile olan bağlarımızı ve kendi yeteneklerimizi güçlendirecektir."
 BBA_italy_communist_events.05.t:0 "[FROM.GetAdjective] Ordusu ile Askerî İşbirliği"
 BBA_italy_communist_events.06.a:0 "Birlikte duracağız!"
 BBA_italy_communist_events.06.b:0 "[FROM.GetAdjective] meseleleri bizi ilgilendirmez."
 BBA_italy_communist_events.06.desc:0 "Silah arkadaşlarımız [FROM.GetName]'dan, aramızdaki işbirliğini genişletebilmemiz için İspanya ve diğer ülkelerden üyelerle bir Büyük Komisyon önerdiler. Birlikte kapitalizme ve faşizme karşı çıkmamız gerektiğini, böylece bir gün onları yıkabileceğimizi savunuyorlar."
 BBA_italy_communist_events.06.t:0 "[FROM.GetAdjective]'den İşbirliği Teklifi"
 BBA_italy_communist_events.07.desc:0 "[FROM.GetName]'daki Yoldaşlarımız, güçlerimizi birleştirmeyi ve bir Büyük İşbirliği Komisyonu oluşturmayı kabul etti! Birlikte kapitalizmin ve faşizmin saldırısına dayanabilecek ve şanlı devrimimizi dünyanın her köşesine taşımak için gidişatı değiştirebileceğiz!"
 BBA_italy_communist_events.07.t:0 "[FROM.GetName] Teklifimizi Kabul Ediyor"
 BBA_italy_communist_events.08.a:0 "Bunu iyice düşünmemişler..."
 BBA_italy_communist_events.08.desc:0 "Aptal [FROM.GetAdjective]'ler kendileri için en iyisinin ne olduğunu göremeyecek kadar dar görüşlüler! Birlikte kapitalizmi ve faşizmi savuşturmak daha kolay olurdu, ama yine de başarılı olacağız!"
 BBA_italy_communist_events.08.t:0 "[FROM.GetName] Teklifimizi Reddediyor"
 BBA_italy_communist_events.09.a:0 "İradesinin iyimserliğiyle iyileşti."
 BBA_italy_communist_events.09.desc:0 "Antonio Gramsci, haksız yere hapsedilirken geçirdiği ağır hastalıktan nihayet kurtuldu. Her zamankinden daha güçlü bir inanç ve coşkuyla davamıza her şekilde yardım etmeye hazır!"
 BBA_italy_communist_events.09.t:0 "Antonio Gramsci İyileşiyor"
 BBA_italy_council_deposes_duce.1.a:0 "Daha büyük bir iyilik için"
 BBA_italy_council_deposes_duce.1.desc:0 "İtalya'yı yıkımdan kurtarmak ve faşist sistemi korumak için düşünülemez olanı yapmalıyız; [?ITA.ITA_var_deposed_leader.GetName]'ı iktidardan uzaklaştırmalıyız! Beceriksizliği ve yetersizliği uzun zamandır ülkemizi ve ilerlemesini aşağı çekti. [FROM.GetAdjective] halkını ve onların geleceğini korumak bizim görevimizdir!"
 BBA_italy_council_deposes_duce.1.t:0 "[?ITA.ITA_var_deposed_leader.GetName]'ı Devirme"
 BBA_italy_council_deposes_duce.2.a:0 "Bunun olmasını önlemek için sert önlemler almalıyız!"
 BBA_italy_council_deposes_duce.2.desc:0 "[ROOT.GetLeader] tarafından karşılaşılan son denemeler ve sıkıntılar nedeniyle, Büyük Konsey iktidarı elinden almak ve kendileri için kapmak için entrikalar çevirmeye başladı, bu da sonunda ulusumuz içinde bir iç savaşa bile yol açabilecek popüler olmayan bir hareket. Bunun olmasını önlemek için elimizden gelen her şeyi yapmalıyız."
 BBA_italy_council_deposes_duce.2.t:0 "Büyük Konsey Doğrudan Müdahaleyi Değerlendiriyor"
 BBA_italy_decide_the_fate_of_mussolini.1.a:0 "Yargılanmasına izin verin"
 BBA_italy_decide_the_fate_of_mussolini.1.b:0 "Onu infaz edin"
 BBA_italy_decide_the_fate_of_mussolini.1.c:0 "Ona suikast düzenleyin"
 BBA_italy_decide_the_fate_of_mussolini.1.desc:0 "İç güç mücadelesini halledip Partito Nazionale Fascista üzerindeki hakimiyetimizi pekiştirdikten sonra, nihayet dikkatimizi eski Duce - Mussolini'ye çevirebiliriz. Onun sürekli varlığı konumumuzu baltalıyor ve bununla başa çıkılması gerekiyor."
 BBA_italy_decide_the_fate_of_mussolini.1.t:0 "Mussolini'nin Kaderi"
 BBA_italy_decide_the_fate_of_mussolini.2.a:0 "Onu beraat ettirin"
 BBA_italy_decide_the_fate_of_mussolini.2.b:0 "Hapishanede çürüsün"
 BBA_italy_decide_the_fate_of_mussolini.2.desc:0 "Yüzyılın davası başlamak üzere, Benito Mussolini yolsuzluk ve ihanet gibi çok sayıda suçlamayla karşı karşıya - diğer şeylerin yanı sıra. Duruşma, halka meşruiyet cilası vermek için sadece bir tiyatrodur. Aslında, sonucu biz elimizde tutuyoruz."
 BBA_italy_decide_the_fate_of_mussolini.2.t:0 "Mussolini'nin Duruşması"
 BBA_italy_decide_the_fate_of_mussolini.3.a:0 "Komünistleri suçlayın!"
 BBA_italy_decide_the_fate_of_mussolini.3.b:0 "Bir örtbas hikayesi uydurun"
 BBA_italy_decide_the_fate_of_mussolini.3.desc:0 "Eski Duce'ye suikast düzenlemek için planlar yapılıyor, ancak İtalyan halkının nasıl tepki vereceğini dikkatlice düşünmeliyiz. Soru şu ki, bunu nasıl sunacağız?"
 BBA_italy_decide_the_fate_of_mussolini.3.t:0 "Mussolini'nin Ölümü"
 BBA_italy_democratic_events.01.a:0 "Ferruccio Parri en yetenekli liderdir."
 BBA_italy_democratic_events.01.b:0 "Ivanoe Bonomi'nin deneyimi paha biçilmezdir."
 BBA_italy_democratic_events.01.desc:0 "Son mücadelelerimiz artık geride kaldığına göre, bir araya gelip birleşme, yaralarımızı sarma ve uzun iyileşme yolculuğuna başlama zamanı geldi. Demokrasimiz hala genç ve kırılgan, bu yüzden bizi ileriye götürecek güçlü ama nazik bir ele ihtiyacımız var."
 BBA_italy_democratic_events.01.t:0 "$BBA_italy_communist_events.01.t$"
 BBA_italy_democratic_events.02.a:0 "Harika bir girişim!"
 BBA_italy_democratic_events.02.desc:0 "[FROM.GetName] bizi onlarla yeni bir araştırma paylaşım girişimine katılmaya davet etti. Bu, ülkelerimiz arasındaki bağları ve işbirliğini genişletir ve derinleştirir."
 BBA_italy_democratic_events.02.t:0 "İtalyan Bilimsel İşbirliği Programı"
 BBA_italy_democratic_events.03.a:0 "Başa çıkılması gereken bir sorun daha"
 BBA_italy_democratic_events.03.desc:0 "İç Savaş çok fazla kan dökülmesine ve kedere neden oldu ve [FROM.GetName]'ın temellerini sarstı. Kaos aynı zamanda bir güç boşluğu da bıraktı, ki bu şimdi [?ROOT.ITA_mafia_epicenter_state.GetName]'da yeniden dirilen Mafya tarafından dolduruluyor. Mafyayı bastırmak belki de Faşistlerin başardığı tek iyi şeydi."
 BBA_italy_democratic_events.03.t:0 "İtalyan Mafyası Yeniden Yükseliyor"
 BBA_italy_democratic_events.05.a:0 "Pislikten başka bir şey değiller!"
 BBA_italy_democratic_events.05.desc:0 "Mafya olan veba yayılıyor! [FROM.GetName]'daki son kaos, suçlular ve benzerleri için bir üreme alanı oldu ve güçlü, yerel bir yönetim olmadığında, bu istenmeyen bireylerin sayısı artıyor. İç Savaşın bıraktığı güç boşluğundan yararlandılar ve bir kez daha [FROM.GetName] genelinde otoritelerini ortaya koyuyorlar."
 BBA_italy_democratic_events.05.t:0 "İtalyan Mafyası Yükselişte"
 BBA_italy_human_torpedo_raid.1.a:0 "Çok talihsiz"
 BBA_italy_human_torpedo_raid.1.desc:0 "İtalyanlar, [?ITA.ITA_raided_state_var.GetName]'daki liman savunmalarımızı atlatmayı başardılar ve oradaki deniz üssüne çok küçük gemilerle sızarak orada demirlemiş gemilerimize karşı bir baskın düzenlediler. Baskın gemilerden hiçbirini batırmasa da, onlara zarar vermeyi başardı ve bu da onarılması biraz zaman alacak."
 BBA_italy_human_torpedo_raid.1.t:0 "[?ITA.ITA_raided_state_var.GetName]'a Karşı Baskın"
 BBA_italy_interaction_events.1.a:0 "Savunmamız gereken bir zayıf nokta daha azaldı"
 BBA_italy_interaction_events.1.b:0 "Denemelerini görmek isteriz!"
 BBA_italy_interaction_events.1.desc:0 "Tamamen beklenmedik ve çirkin bir hamleyle, İtalyan lideri [ITA.GetLeader], uzun süredir devam eden tarafsızlığımızı bir ültimatom vererek lekeledi. İki hafta içinde, [846.GetName] bölgesini İtalyanlara teslim etmemiz gerekiyor, yoksa savaş çıkacak. Nasıl yanıt vermeliyiz?"
 BBA_italy_interaction_events.1.t:0 "[ITA.GetLeader], [846.GetName]'ı Talep Ediyor"
 BBA_italy_interaction_events.10.a:0 "O zaman zorla"
 BBA_italy_interaction_events.10.desc:0 "[FROM.GetNameDef]'in aptal [FROM.GetLeader]'ı bize haklı toprağımızı vermeyi reddetti ve şimdi [FROM.GetName]'ı tek bir hızlı saldırıyla vurma zamanı geldi. Bu, yakın gelecek için Dalmaçya üzerindeki iddialarımızı kesinlikle güvence altına alacaktır."
 BBA_italy_interaction_events.10.t:0 "Aptal [FROM.GetLeader] Ültimatomumuzu Reddetti"
 BBA_italy_interaction_events.11.a:0 "Alabilirler"
 BBA_italy_interaction_events.11.b:0 "Bunu yapmaya ne hakları olduğunu sanıyorlar?"
 BBA_italy_interaction_events.11.desc:0 "[ITA.GetLeader], Karadağ tahtının İtalyan devletine devredilmesini ve taçların tek bir bayrak altında birleştirilmesini talep etti. İtalya Kraliçesi Karadağlı olduğu için bu biraz hayalperest olsa da, gerçeklikten çok da uzak değil. Nasıl cevap vermeliyiz?"
 BBA_italy_interaction_events.11.t:0 "[ITA.GetName] Karadağ Tahtında Hak İddia Ediyor"
 BBA_italy_interaction_events.12.a:0 "Mükemmel!"
 BBA_italy_interaction_events.12.desc:0 "[FROM.GetLeader], irademize direnme nedenleri olmadığını ve Karadağ topraklarının derhal bize devredileceğini ilan etti. Bugün İtalyan ulusu için büyük bir gün!"
 BBA_italy_interaction_events.12.t:0 "[FROM.GetName] Bize Karadağ Tacını Veriyor"
 BBA_italy_interaction_events.13.a:0 "Acınası!"
 BBA_italy_interaction_events.13.desc:0 "[FROM.GetLeader], bizimle daha fazla diplomatik ilişki aramayacaklarını ve Karadağ tahtı üzerindeki iddiamızı derhal geri çekmemiz gerektiğini duyurdu. Affedilemez, kabul edilemez!"
 BBA_italy_interaction_events.13.t:0 "[FROM.GetName] Karadağ'ı Teslim Etmeyi Reddediyor"
 BBA_italy_interaction_events.14.a:0 "Zaten orada asker bulundurmanın bir faydası yok"
 BBA_italy_interaction_events.14.b:0 "Bu kendimizi savunamayacağımız anlamına gelir!"
 BBA_italy_interaction_events.14.desc:0 "[ITA.GetLeader], iki ulusumuz arasında güvenlik garantileri talep etti, ki bu gayet adil. Daha çirkin olan kısım ise [ITA.GetLeader]'ın hem [342.GetName]'ı hem de [339.GetName]'ı tamamen askerden arındırmamızı talep etmesi, bu da [ITA.GetName] veya müttefiklerinden herhangi biri tarafından saldırıya uğramamız durumunda ilk savunma pozisyonlarını kuramayacağımız anlamına geleceği için güvenliğimizi tehlikeye atabilir."
 BBA_italy_interaction_events.14.t:0 "[ITA.GetName] Batı Anadolu'nun Tamamen Askerden Arındırılmasını Talep Ediyor"
 BBA_italy_interaction_events.15.a:0 "Asla geldiklerini görmeyecekler"
 BBA_italy_interaction_events.15.desc:0 "[FROM.GetName], taleplerimizi kabul etti ve batı Anadolu'yu tamamen askerden arındırmayı seçti. Bu, çok daha zayıf olacakları ve onlara saldırmamız durumunda ilk bir direniş gösterme imkanları olmayacağı anlamına gelir."
 BBA_italy_interaction_events.15.t:0 "[FROM.GetName] Taleplerimize Uyuyor"
 BBA_italy_interaction_events.16.a:0 "Bize başka seçenek bırakmıyorlar"
 BBA_italy_interaction_events.16.desc:0 "[FROM.GetName], dostça güvenlik garantileri talebimizi reddetti ve [342.GetName] ile [339.GetName]'ın askerden arındırılmasını reddetti. Bu çok çirkin ve kendi yöntemiyle halledilmesi gerekecek."
 BBA_italy_interaction_events.16.t:0 "[FROM.GetName] Güvende Hissetme Hakkımızı Reddediyor!"
 BBA_italy_interaction_events.17.a:0 "Bu konuda pek bir şey yapamayız..."
 BBA_italy_interaction_events.17.desc:0 "Hâkim devletimiz [ITA.GetName] bugün, kontrol ettiğimiz [45.GetName] toprağını Macarlara devretmeye karar verdi. Bu, İtalyan ve Macar devletleri arasındaki ilişkiyi güçlendirmek içindir ve bu konuda yapılabilecek pek bir şey yoktur. Ancak, üst düzey yetkililer okumayacak olsa bile küçük bir diplomatik protestoda bulunacağız."
 BBA_italy_interaction_events.17.t:0 "[ITA.GetName], [45.GetName]'ı [HUN.GetName]'a Veriyor"
 BBA_italy_interaction_events.18.a:0 "Yunan birleşmesine bir adım daha yakınız!"
 BBA_italy_interaction_events.18.b:0 "Koşullar ne olursa olsun İtalyanlara boyun eğmeyeceğiz!"
 BBA_italy_interaction_events.18.desc:0 "[ITA.GetNameDef] bize cazip bir teklifle yaklaştı. Onlarla bir ittifak karşılığında bize Rodos ve Oniki Ada'nın mülkiyetini teklif ediyorlar. Bu, neredeyse gerçek olamayacak kadar iyi görünen ama öyle olmayan bir teklif. Ne yapmalıyız?"
 BBA_italy_interaction_events.18.t:0 "İtalya bir Teklifle bize Yaklaşıyor"
 BBA_italy_interaction_events.19.a:0 "Ve bir ittifakımız olacak"
 BBA_italy_interaction_events.19.desc:0 "Yunan hükûmeti bugün teklifimizi kabul ettiklerini ve Oniki Ada'nın mülkiyeti karşılığında en kısa sürede askeri işbirliğine başlayacaklarını duyurdu. Bunun bizi nereye götüreceğini göreceğiz."
 BBA_italy_interaction_events.19.t:0 "[GRE.GetNameDef] Teklifimizi Kabul Ediyor"
 BBA_italy_interaction_events.2.a:0 "Mükemmel!"
 BBA_italy_interaction_events.2.desc:0 "[SWI.GetNameDef] başkanı bugün ülke için bir dönemin sonunu ilan etti. [846.GetName]'ın İtalyan bölgesini bize devredecekler ve bölgedeki herhangi bir İtalyanca konuşan kasabaya yönelik iddialarından vazgeçecekler. Bugün, [SWI.GetName]'ın boyutunda ve çok etnikli değerlerinde bir azalmaya işaret ediyor, çünkü sonradan İtalyancayı resmi bir dil olarak da kaldırdılar."
 BBA_italy_interaction_events.2.t:0 "Korkak [SWI.GetName] Pes Ediyor"
 BBA_italy_interaction_events.20.a:0 "Onlarsız daha iyiyiz"
 BBA_italy_interaction_events.20.desc:0 "Yunan hainleri, bir ittifak karşılığında onlara adaları satma teklifimizi reddetti. Bu sadece hükûmetlerinin beceriksizliğini ve zayıflığını gösteriyor."
 BBA_italy_interaction_events.20.t:0 "[GRE.GetNameDef] Nankörce Teklifimizi Reddetti"
 BBA_italy_interaction_events.21.a:0 "Al sana Yunanistan! İlk biz aldık!"
 BBA_italy_interaction_events.21.b:0 "Koşullar ne olursa olsun İtalyanlara boyun eğmeyeceğiz!"
 BBA_italy_interaction_events.21.desc:0 "[ITA.GetNameDef] bize cazip bir teklifle yaklaştı. Onlarla bir ittifak karşılığında bize Rodos ve Oniki Ada'nın mülkiyetini teklif ediyorlar. Bu, neredeyse gerçek olamayacak kadar iyi görünen ama öyle olmayan bir teklif. Ne yapmalıyız?"
 BBA_italy_interaction_events.21.t:0 "İtalya bir Teklifle bize Yaklaşıyor"
 BBA_italy_interaction_events.22.a:0 "Ve bir ittifakımız olacak"
 BBA_italy_interaction_events.22.desc:0 "Türk hükûmeti bugün teklifimizi kabul ettiklerini ve Oniki Ada'nın mülkiyeti karşılığında en kısa sürede askeri işbirliğine başlayacaklarını duyurdu. Bunun bizi nereye götüreceğini göreceğiz."
 BBA_italy_interaction_events.22.t:0 "[TUR.GetNameDef] Teklifimizi Kabul Ediyor"
 BBA_italy_interaction_events.23.a:0 "Onlarsız daha iyiyiz"
 BBA_italy_interaction_events.23.desc:0 "Türk hainleri, bir ittifak karşılığında onlara adaları satma teklifimizi reddetti. Bu sadece hükûmetlerinin beceriksizliğini ve zayıflığını gösteriyor."
 BBA_italy_interaction_events.23.t:0 "[TUR.GetNameDef] Nankörce Teklifimizi Reddetti"
 BBA_italy_interaction_events.24.a:0 "Onları tek başımıza halledebiliriz!"
 BBA_italy_interaction_events.24.b:0 "Yardım istemek iyi olabilir"
 BBA_italy_interaction_events.24.c:0 "Yapabileceğimiz bir şey yok. Garantileri geri çek!"
 BBA_italy_interaction_events.24.desc:0 "Aşağılık Alman devleti, Avusturya siyasetine müdahale etmeye ve ülkeyi kendi içine katmaya çalışıyor. Onlara daha önce garantiler vermiştik ve bu nedenle halkımız onlara karşı Almanlara karşı durmamızı bekliyor. İngiliz ve Fransızlardan da yardım isteyebiliriz. Ne yapmalıyız?"
 BBA_italy_interaction_events.24.t:0 "Almanya Avusturya'yı İlhak Etmeye Çalışıyor"
 BBA_italy_interaction_events.25.a:0 "Kibirleri başlarına dert açacak"
 BBA_italy_interaction_events.25.b:0 "Bu tür bir çatışmayı kaldıramayız"
 BBA_italy_interaction_events.25.desc:0 "İtalyan savunma bakanlığı, Avusturyalıları ülkemize dahil etme girişimimizle ilgili olarak bize bir uyarı yayınladı. Avusturya'ya karşı hareket edersek, İtalyan ordusundan ciddi karşı önlemlerle karşılaşacağımızı belirtiyorlar. Bu açık provokasyona nasıl yanıt vermeliyiz?"
 BBA_italy_interaction_events.25.t:0 "İtalyanlar Bize Karşı Duruyor"
 BBA_italy_interaction_events.26.a:0 "Bu [AUS.GetAdjective]ları yeniden düşünmeye teşvik etmeli"
 BBA_italy_interaction_events.26.desc:0 "İtalya, geri çekilmezlerse işlerin ciddiye bineceği kendilerine kanıtlandıktan sonra bize karşı durmayacaklarını duyurdu. Bugün anavatan için şanlı bir gündür!"
 BBA_italy_interaction_events.26.t:0 "[ITA.GetNameDef] Geri Adım Atıyor"
 BBA_italy_interaction_events.27.a:0 "Tamamdır beyler, tekrar giriyoruz"
 BBA_italy_interaction_events.27.b:0 "Eğer [ETH.GetNameDef] ile barış yaparlarsa"
 BBA_italy_interaction_events.27.c:0 "Aman tanrım hayır, kıta neden umurumuzda olsun ki?"
 BBA_italy_interaction_events.27.desc:0 "[GetItalyAsksEngland]"
 BBA_italy_interaction_events.27.desc_hosting_ethiopia:0 "İtalya, yayılmacı Almanya gücünü kontrol altında tutmamıza yardım etmemizi istiyor ve Avusturya'nın bağımsızlığını garanti etmemizi istiyor, onları korumaya yardımcı olmak için. Daha önce yan yana savaşmış olsak da, şimdi İtalyanlar tarafından kovulan Etiyopya hükûmetini sürgünde ağırlıyoruz. Eğer [ITA.GetNameDef] yaklaşan savaşta yardımımızı istiyorsa, önce barış yapmaları gerekiyor."
 BBA_italy_interaction_events.27.desc_standard:0 "Büyük savaş sırasında bir kez yapıldı, ama şimdi, bir kez daha, İtalya Almanya'nın yayılmacı gücünü kontrol altında tutmamıza yardım etmemizi istiyor. Onları korumaya yardımcı olmak için Avusturya'nın bağımsızlığını garanti etmemizi istiyorlar. Hareket tarzımız ne olmalı?"
 BBA_italy_interaction_events.27.t:0 "İtalya, Almanya'yı Kontrol Altında Tutmamıza Yardım Etmemizi İstiyor"
 BBA_italy_interaction_events.28.a:0 "Evet, özgürlük için!"
 BBA_italy_interaction_events.28.b:0 "Eğer [ETH.GetNameDefCap] ile barış yaparlarsa"
 BBA_italy_interaction_events.28.desc:0 "Güneydoğudaki komşularımız, şu anda bağımsızlığını garanti ettikleri Avusturya devletine yönelik potansiyel bir Alman saldırısını savuşturmamıza yardım etmemizi istedi. Şimdi aynısını bizim de yapmamızı istiyorlar. Nasıl yanıt veririz?"
 BBA_italy_interaction_events.28.t:0 "İtalya, Almanya'yı Kontrol Altında Tutmamıza Yardım Etmemizi İstiyor"
 BBA_italy_interaction_events.29.a:0 "Onları durdurmak için yapabileceğimiz bir şey yok"
 BBA_italy_interaction_events.29.b:0 "Onlardan uzaklaşmalıyız"
 BBA_italy_interaction_events.29.desc:0 "İtalya, [802.GetName]'ı kendi Arnavutluk krallığına ekleyerek bizden almaya çalışıyor. Eğer bir şey yapmazsak, bölge üzerindeki iddialarımız sonsuza dek kaybolacak."
 BBA_italy_interaction_events.29.t:0 "İtalya [802.GetName]'ı Bizden Alıyor!"
 BBA_italy_interaction_events.3.a:0 "Alp Tümenini Seferber Et!"
 BBA_italy_interaction_events.3.desc:0 "[SWI.GetName] ulusu bugün, [846.GetName]'ı İtalyan dünyasına geri verme taleplerimize meydan okuyarak tarafsızlıklarını iptal edeceklerini duyurdu. Bu aptalca seçim nedeniyle, İsviçre Kanton sisteminin tamamen ve mutlak bir şekilde yok edilmesinden başka seçeneğimiz kalmadı."
 BBA_italy_interaction_events.3.t:0 "[SWI.GetNameDef] Meydan Okuyor!"
 BBA_italy_interaction_events.30.a:0 "Harika görünüyor!"
 BBA_italy_interaction_events.30.b:0 "Ve neden bir İtalyan'a güvenelim ki?"
 BBA_italy_interaction_events.30.desc:0 "[ITA.GetName], karşılıklı garantiler ve işbirliği anlaşmaları karşılığında [45.GetName] üzerindeki iddialarımızı desteklemeyi teklif etti. Bu bize iyi bir anlaşma gibi görünüyor, kabul etmeli miyiz?"
 BBA_italy_interaction_events.30.t:0 "İtalya, Karşılıklı Garantiler Karşılığında [45.GetName]'ı Teklif Ediyor"
 BBA_italy_interaction_events.31.a:0 "Tabii, alabilirler"
 BBA_italy_interaction_events.31.b:0 "Aman tanrım, hayır"
 BBA_italy_interaction_events.31.desc:0 "[GetRatifyStresaFrontEventDesc]"
 BBA_italy_interaction_events.31.desc_no_peace_deal:0 "Konu üzerindeki ısrarımıza rağmen, nankör [ETH.GetLeader], savaşta üstünlüğü olduğunu düşünerek [ITA.GetAdjective] hükûmetiyle barış görüşmelerine girmeyi reddetti. Bu bize, Etiyopya liderini ülkemizden kovmaktan başka seçenek bırakmıyor, böylece ulusal çıkarlarımızla daha uyumlu olan İtalyan teklifine odaklanabiliriz."
 BBA_italy_interaction_events.31.desc_no_war:0 "İtalyan hükûmeti bugün bize ilginç bir teklifle yaklaştı. Stresa Cephesini onaylamak istediklerini söylüyorlar, böylece Avrupa'da bir savaş çıkması durumunda bizim tarafımızda desteklerini güvence altına alıyorlar. Ancak bunu imzalamaları için toprak tavizleri talep ediyorlar, şu anda [269.GetName] ve [903.GetName]. Nasıl yanıt vermeliyiz? Kabul edersek en azından geçici olarak bize ödeme yapacaklar."
 BBA_italy_interaction_events.31.desc_peace_signed:0 "[ITA.GetNameDefCap] ve [ETH.GetNameDefCap] farklılıklarını bir kenara bırakıp bir barış antlaşması imzaladılar, bu da büyük ölçüde bizim becerikli diplomasimiz sayesinde oldu. İtalyan hükûmeti, Stresa Cephesini onaylamak için [269.GetName] ve [903.GetName]'ı alacakları anlaşmayı bize hatırlattı."
 BBA_italy_interaction_events.31.t:0 "[NegotiatingItalianClaimsTitle]"
 BBA_italy_interaction_events.31.t_negotiate_claims:0 "[ITA.GetNameDefCap] Somali Üzerindeki İddialarını Müzakere Etmek İstiyor"
 BBA_italy_interaction_events.31.t_refused_peace:0 "[ETH.GetNameDefCap] Barış Görüşmelerini Reddediyor"
 BBA_italy_interaction_events.32.a:0 "Barış İçin"
 BBA_italy_interaction_events.32.b:0 "Hayır!"
 BBA_italy_interaction_events.32.desc:0 "İtalyan hükûmeti bugün bize ilginç bir teklifle yaklaştı. Stresa Cephesini onaylamak istediklerini söylüyorlar, böylece Avrupa'da bir savaş çıkması durumunda bizim tarafımızda desteklerini güvence altına alıyorlar. Ancak bunu imzalamaları için toprak tavizleri talep ediyorlar, yani [268.GetName]. Nasıl yanıt vermeliyiz? Kabul edersek en azından geçici olarak bize ödeme yapacaklar."
 BBA_italy_interaction_events.32.t:0 "[ITA.GetName], Cibuti Üzerindeki İddialarını Müzakere Etmek İstiyor"
 BBA_italy_interaction_events.33.a:0 "Barış için ödenecek küçük bir bedel"
 BBA_italy_interaction_events.33.b:0 "Ve neden tam olarak onlarda olmalıymış?"
 BBA_italy_interaction_events.33.desc:0 "[GetItalyWantsSocotra]"
 BBA_italy_interaction_events.33.desc_continued_negotiation:0 "İtalyanlar bize başka bir taleple daha geri döndü. Şimdi [906.GetName] adasının mülkiyetini istiyorlar. Bunun, İtalyan Doğu Afrikası'na ithal ve ihraç edilen ticari malların akışını daha kolay düzenleyebilmeleri ve Kızıldeniz'in girişlerinden birini kontrol edebilmeleri için olduğunu belirtiyorlar, diğeri bizim kontrolümüzde olduğu için. Onlara verirsek, çabalarımız için bize geçici olarak ödeme yapacaklarını belirtiyorlar."
 BBA_italy_interaction_events.33.desc_first_negotiation:0 "İtalyan hükûmeti bugün bize ilginç bir teklifle yaklaştı. Stresa Cephesini onaylamak istediklerini, böylece Avrupa'da bir savaş çıkması durumunda bizim tarafımızda desteklerini güvence altına alacaklarını söylüyorlar. Ancak bunu imzalamaları için, yani [906.GetName]'ı talep ederek toprak tavizleri istiyorlar. Nasıl yanıt vermeliyiz? Kabul edersek en azından geçici olarak bize ödeme yapacaklar."
 BBA_italy_interaction_events.33.t:0 "[ITA.GetName], [906.GetName] Üzerindeki Hak İddiasını Müzakere Etmek İstiyor"
 BBA_italy_interaction_events.34.a:0 "Evet"
 BBA_italy_interaction_events.34.b:0 "Kabul edilemez"
 BBA_italy_interaction_events.34.desc:0 "[GetItalyWantsTunisia]"
 BBA_italy_interaction_events.34.desc_continued_negotiation:0 "İtalyanlar bize başka bir taleple daha geri döndü. Şimdi [458.GetName] ve [665.GetName]'ın mülkiyetini istiyorlar. Bunun, bize ve İngilizlere kıyasla Kuzey Afrika'da daha adil bir paya sahip olabilmeleri için olduğunu belirtiyorlar. Onlara verirsek, çabalarımız için bize geçici olarak ödeme yapacaklarını belirtiyorlar."
 BBA_italy_interaction_events.34.desc_first_negotiation:0 "İtalyan hükûmeti bugün bize ilginç bir teklifle yaklaştı. Stresa Cephesini onaylamak istediklerini, böylece Avrupa'da bir savaş çıkması durumunda bizim tarafımızda desteklerini güvence altına alacaklarını söylüyorlar. Ancak bunu imzalamaları için, yani [458.GetName] ve [665.GetName]'ı talep ederek toprak tavizleri istiyorlar. Nasıl yanıt vermeliyiz? Kabul edersek en azından geçici olarak bize ödeme yapacaklar."
 BBA_italy_interaction_events.34.t:0 "[ITA.GetName] Tunus Üzerindeki Hak İddiasını Müzakere Etmek İstiyor"
 BBA_italy_interaction_events.35.a:0 "Onlar için daha iyi bir kullanım alanı var"
 BBA_italy_interaction_events.35.b:0 "Saçmalık"
 BBA_italy_interaction_events.35.desc:0 "[GetItalyWantsMalta]"
 BBA_italy_interaction_events.35.desc_continued_negotiation:0 "İtalyanlar bize başka bir taleple daha geri döndü. Şimdi [116.GetName] adasının mülkiyetini istiyorlar. Bunun, Akdeniz'i daha kolay kontrol edebilmeleri için olduğunu belirtiyorlar. Onlara verirsek, çabalarımız için bize geçici olarak ödeme yapacaklarını belirtiyorlar."
 BBA_italy_interaction_events.35.desc_first_negotiation:0 "İtalyan hükûmeti bugün bize ilginç bir teklifle yaklaştı. Stresa Cephesini onaylamak istediklerini, böylece Avrupa'da bir savaş çıkması durumunda bizim tarafımızda desteklerini güvence altına alacaklarını söylüyorlar. Ancak bunu imzalamaları için, yani [116.GetName]'ı talep ederek toprak tavizleri istiyorlar. Nasıl yanıt vermeliyiz? Kabul edersek en azından geçici olarak bize ödeme yapacaklar."
 BBA_italy_interaction_events.35.t:0 "[ITA.GetName] Malta Üzerindeki Hak İddiasını Müzakere Etmek İstiyor"
 BBA_italy_interaction_events.36.a:0 "Bunu tartışmanın bir anlamı yok"
 BBA_italy_interaction_events.36.desc:0 "[GetItalyClaimsBalkan]"
 BBA_italy_interaction_events.36.desc_continued_negotiation:0 "[ITA.GetName]'ın şimdi pakt imzalanmadan önce bizden sadece son bir isteği var. Balkanlar üzerindeki iddialarını onaylamamızı istiyorlar. Bu gerçekten bizim ilgi alanımızda değil ve bu nedenle hükûmetimiz bunu reddetmeye pek hevesli değil."
 BBA_italy_interaction_events.36.desc_first_negotiation:0 "İtalyan hükûmeti bugün bize ilginç bir teklifle yaklaştı. Stresa Cephesini onaylamak istediklerini, böylece Avrupa'da bir savaş çıkması durumunda bizim tarafımızda desteklerini güvence altına alacaklarını söylüyorlar. Balkanlar üzerindeki iddialarını onaylamamızı istiyorlar. Bu gerçekten bizim ilgi alanımızda değil ve bu nedenle hükûmetimiz bunu reddetmeye pek hevesli değil."
 BBA_italy_interaction_events.36.t:0 "[ITA.GetName] Balkanlar Üzerindeki Hak İddialarını Müzakere Etmek İstiyor"
 BBA_italy_interaction_events.37.a:0 "İstediğimiz her şey değil, ama alacağız"
 BBA_italy_interaction_events.37.b:0 "Harika!"
 BBA_italy_interaction_events.37.desc:0 "Diplomatlarımız, İtalya'nın yakın gelecekteki toprak kazanımlarını güvence altına almak için son birkaç haftadır Fransa ve İngiltere'de yoğun bir şekilde çalışıyorlar. Ancak müzakereler şimdi sona erdi ve kağıtlar imzalandı."
 BBA_italy_interaction_events.37.t:0 "Toprak Müzakereleri Tamamlandı"
 BBA_italy_interaction_events.38.a:0 "Tanrı istiyor!"
 BBA_italy_interaction_events.38.desc:0 "Papalığın gücünün İtalyan monarşisini aşmasıyla birlikte, katolik kilisesinin birçok ateşli destekçisi bugün Papa'nın ülkenin liderliğini üstlenmesini talep etmek için ortaya çıktı. Halk tarafından sunulan rolü zaten kabul etti ve bugün olanların gerçekten de Tanrı'nın iradesi olduğunu ilan etti. Monarşinin onu durdurmak için yapabileceği pek bir şey yok."
 BBA_italy_interaction_events.38.t:0 "Papa'nın Yükselişi"
 BBA_italy_interaction_events.39.a:0 "Yeni bir dönem başlıyor!"
 BBA_italy_interaction_events.39.desc:0 "Nihayet Afrika'daki yeni mülklerimiz için son ödemeyi yaptık. Bu anlaşma sömürge topraklarımızı genişletti, onları birleştirip sağlamlaştırdı ve oradaki konumumuzu güçlendirdi. Sonuç olarak, tüm katılımcılar için çok faydalı bir düzenleme oldu."
 BBA_italy_interaction_events.39.t:0 "Afrika Sömürgeleri için Ödeme"
 BBA_italy_interaction_events.4.a:0 "Ve Kral Tomislav olacaktır!"
 BBA_italy_interaction_events.4.b:0 "İtalyanlar sonlarını Dalmaçya kıyılarında bulacaklar"
 BBA_italy_interaction_events.4.desc:0 "[ITA.GetLeader]'dan, prens Aimone olarak bilinen İtalyan prensini resmi olarak Hırvatistan kralı II. Tomislav olarak taçlandırma talepleri aldık. Eğer bu talepleri kabul edersek, kesinlikle bağımsızlığımızın bir kısmını kaybederiz, ancak yakın gelecekte herhangi bir İtalyan saldırganlığını savuşturmaya değebilir."
 BBA_italy_interaction_events.4.t:0 "Bir İtalyan Prensini Taçlandırma Talepleri"
 BBA_italy_interaction_events.40.a:0 "Koşullar kabul edilebilir"
 BBA_italy_interaction_events.40.b:0 "Fransa asla İtalya'nın yanında yer almayacaktır"
 BBA_italy_interaction_events.40.desc:0 "Toprak tavizleri kararlaştırıldığına göre, [ITA.GetName] İtalya ve Fransa'yı Stresa Cephesi adlı bir askeri ittifaka getirecek bir süreç başlattı. Şimdi boş durma zamanı değil, çünkü Fransa kendi çıkarına hareket etmeli ve Alman tehdidine karşı İtalya'ya katılmalıdır."
 BBA_italy_interaction_events.40.t:0 "Stresa Cephesinin Onaylanması"
 BBA_italy_interaction_events.41.a:0 "Reddedilemeyecek kadar iyi bir teklif"
 BBA_italy_interaction_events.41.b:0 "Halk bağımsızlığını istiyor!"
 BBA_italy_interaction_events.41.desc:0 "[FROM.GetLeader] bize, bizi yabancı güçlerden ve ekonomik kuraklıktan korumak için kanatları altına alma teklifiyle yaklaştı. Ancak [FROM.GetName] biraz düşmanca görünüyor ve taleplerini reddedersek muhtemelen bizi işgal edecektir."
 BBA_italy_interaction_events.41.t:0 "[FROM.GetName] Bize Koruma Teklif Ediyor"
 BBA_italy_interaction_events.42.a:0 "Harikulade"
 BBA_italy_interaction_events.42.desc:0 "[FROM.GetName] ülkesi, koruma teklifimizi alçakgönüllülükle kabul etti ve Akdeniz'in haklı hükümdarlarına boyun eğdi. Bugün İberya ve [ITA.GetNameDef] üzerinde yeni bir parlak ışık parlıyor."
 BBA_italy_interaction_events.42.t:0 "[FROM.GetName] Teklifimizi Kabul Ediyor"
 BBA_italy_interaction_events.43.a:0 "Bu günü pişmanlıkla anacaklar!"
 BBA_italy_interaction_events.43.desc:0 "[FROM.GetName] ülkesi, koruma teklifimizi kabaca reddetti ve onlara bize karşı gelmenin ne demek olduğunu en gerçek anlamıyla göstereceğiz. Önümüzde diz çökecekler!"
 BBA_italy_interaction_events.43.t:0 "[FROM.GetName] Teklifimizi Reddediyor"
 BBA_italy_interaction_events.44.a:0 "Bana uyar"
 BBA_italy_interaction_events.44.b:0 "Neden emperyalistlerle bir araya gelelim ki?"
 BBA_italy_interaction_events.44.desc:0 "[FROM.GetLeader], Güney Amerika uluslarıyla ittifak kurmak ve Latin kültürlerini tek bir egemenlik altında birleştirmek için bir girişim başlattı. Bu, [USA.GetNameDef]'den korunmak için iyi bir fırsat gibi görünüyor. Nasıl yanıt vermeliyiz?"
 BBA_italy_interaction_events.44.t:0 "[FROM.GetName] Bizi bir İttifaka Davet Ediyor"
 BBA_italy_interaction_events.45.a:0 "Harika"
 BBA_italy_interaction_events.45.desc:0 "[FROM.GetName] ülkesi, bir ittifak teklifimizi alçakgönüllülükle kabul etti ve ortak düşmanlarımıza karşı tek vücut olarak savaşmak için bize katıldı. Bugün Güney Amerika ve [ITA.GetNameDef] üzerinde yeni bir parlak ışık parlıyor."
 BBA_italy_interaction_events.45.t:0 "[FROM.GetName] teklifimizi kabul ediyor"
 BBA_italy_interaction_events.46.a:0 "Fikirlerini değiştirmek için pek bir şey yapamayız..."
 BBA_italy_interaction_events.46.desc:0 "[FROM.GetName] ülkesi, bir ittifak teklifimizi kabaca reddetti ve bu nedenle onlarsız yapmak zorunda kalacağız. Kıtalarında izole kalacaklar."
 BBA_italy_interaction_events.46.t:0 "[FROM.GetName] Teklifimizi Reddediyor"
 BBA_italy_interaction_events.5.a:0 "Harika!"
 BBA_italy_interaction_events.5.desc:0 "Bugün Zagreb'de çanlar çalıyor, çünkü eskiden prens Aimone olarak bilinen İtalyan, Hırvatistan'ın ikinci Tomislav'ı olarak taç giyiyor. Nüfuzumuz şimdi Balkanlar'a daha da yayılacak, zafer günlerimize yaklaşıyoruz."
 BBA_italy_interaction_events.5.t:0 "Prens Aimone'nin Taç Giyme Töreni"
 BBA_italy_interaction_events.50.a:0 "Önce bir barış antlaşması imzalamalılar!"
 BBA_italy_interaction_events.50.b:0 "Bu suçlularla anlaşma olmayacak!"
 BBA_italy_interaction_events.50.desc:0 "İtalyan hükûmeti bize ilginç bir teklifle yaklaştı. Stresa Cephesini onaylamak istediklerini, böylece Avrupa'da bir savaş çıkması durumunda bizim tarafımızda desteklerini güvence altına alacaklarını söylüyorlar. Ancak toprak tavizleri talep ediyorlar, şu anda [269.GetName] ve [903.GetName] - ve biz de hükûmetini ağırladığımız [ETH.GetName] ile savaştalar. Kabul edersek en azından geçici olarak bize ödeme yapacaklar."
 BBA_italy_interaction_events.50.t:0 "Bir İtalyan Teklifi"
 BBA_italy_interaction_events.51.a:0 "Bunun için pişman olacaklar!"
 BBA_italy_interaction_events.51.desc:0 "Stresa Cephesini İngilizlerden bazı küçük sömürge toprakları karşılığında onaylama yönündeki makul teklifimiz, tam bir küçümsemeyle karşılandı. Önemli gücümüzü reddederlerse kendilerini gerçekten güçlü ve güvende hissetmeliler."
 BBA_italy_interaction_events.51.t:0 "İngilizler Müzakere Etmeyi Reddediyor"
 BBA_italy_interaction_events.6.a:0 "O zaman savaş!"
 BBA_italy_interaction_events.6.desc:0 "Prens Aimone bize geri döndü ve Zagreb'deki taç giyme törenine giderken Hırvat sınırında durdurulduğunu ve reddedildiğini bildirdi. Hırvatların bize sunacak hiçbir şeyi olmadığı ve gelecekte onlar için tek seçeneğin askeri işgal olduğu bizim için açıktır."
 BBA_italy_interaction_events.6.t:0 "Aimone Hırvat Sınırında Durduruldu"
 BBA_italy_interaction_events.60.desc:0 "İtalya, Etiyopya ile bir barış antlaşması imzalayarak fethettikleri toprakların bir kısmını geri verdi. İtalyan hükûmeti şimdi bizden anlaşmanın kendi payımıza düşen kısmını yerine getirmemizi ve Alman yayılmacılığı karşısında Avusturya'nın bağımsızlığını garanti etmemizi istiyor."
 BBA_italy_interaction_events.60.t:0 "[ITA.GetName] Barış Antlaşmasını İmzalıyor"
 BBA_italy_interaction_events.666.a:0 "Kutsal Peder'in taleplerini karşılamalıyız..."
 BBA_italy_interaction_events.666.b:0 "Yaşlı adam cehennemde yansın!"
 BBA_italy_interaction_events.666.desc:0 "Kutsal Peder, Papa [From.GetLeader], [454.GetName] eyaletini devretmemizi talep ediyor. Elçileri, böyle kutsal bir yerin sadece Papalık tarafından yönetilmesi gerektiğini ve böyle bir talebi reddetmenin sapkınlık olacağını iddia ediyor. Uymak, [FROM.GetName] ile ilişkimize büyük fayda sağlayacaktır, ancak [454.GetName] Avrupa, Asya ve Afrika arasında bir kavşakta yer alıyor - bu da onu şimdi olduğu gibi tarih boyunca stratejik olarak önemli bir yer yapıyor."
 BBA_italy_interaction_events.666.t:0 "[454.GetName] veya Savaş"
 BBA_italy_interaction_events.667.a:0 "Kutsanmış olsun [FROM.GetAdjective] liderliği!"
 BBA_italy_interaction_events.667.desc:0 "Bu sadece Papalık için değil, tüm Hristiyanlık için de büyük bir gün! [FROM.GetAdjective] lideri [FROM.GetLeader], talebimizi akıllıca dinledi ve [454.GetName]'ı bizim yönetimimize devretmeyi kabul etti. Bu, bölge için istikrar ve refaha ve [ROOT.GetName] için yeni parlak bir geleceğe yol açacaktır."
 BBA_italy_interaction_events.667.t:0 "[FROM.GetName], [454.GetName]'ı Devrediyor"
 BBA_italy_interaction_events.668.a:0 "Tanrı'ya ne büyük bir hakaret!"
 BBA_italy_interaction_events.668.desc:0 "[FROM.GetLeader], kibirli olduğu kadar cahildir! [454.GetName]'ı bize devretmenin mantığını görmeyi reddediyor. Taleplerimizi karşılamak bölgeye güvenlik ve istikrar getirirdi, ancak eylemleri sadece savaşa ve sefalete yol açacaktır!"
 BBA_italy_interaction_events.668.t:0 "[FROM.GetName], Kutsal Peder'in Teklifini Reddediyor"
 BBA_italy_interaction_events.7.a:0 "Gerçekten de"
 BBA_italy_interaction_events.7.desc:0 "İtalya, [MNT.GetLeader]'ı Milli Komite'nin yeni Başkanı olarak atadı. Bu kesinlikle rejimimizi güçlendirecektir."
 BBA_italy_interaction_events.7.t:0 "Milli Komite'nin Yeni Başkanı"
 BBA_italy_interaction_events.70.a:0 "Bekleyeceğiz"
 BBA_italy_interaction_events.70.desc:0 "[GetAdjective]ların liderine, farklılıklarımızı bir kenara bırakıp İtalyan denetimi altında yeni bir hükûmet kurmaya istekli olup olmadıklarını sormak için bir elçi gönderdik."
 BBA_italy_interaction_events.70.t:0 "Cevap Bekleniyor"
 BBA_italy_interaction_events.71.a:0 "Yapabileceğimiz pek bir şey yok"
 BBA_italy_interaction_events.71.b:0 "Hala gururumuz var!"
 BBA_italy_interaction_events.71.desc:0 "[ITA.GetNameDef]'den bir elçi bize yaklaştı ve farklılıklarımızı bir kenara bırakıp İtalyan denetimi altında yeni bir hükûmet kurmaya istekli olup olmadığımızı sordu. Elçi, işbirliğimiz olsun ya da olmasın, anavatanımızda yeni bir yönetim kurmaya devam edeceklerini bize bildirdi. Eğer bu teklifi reddedersek, dünyanın geri kalanı tarafından bu yeni yönetim lehine göz ardı edileceğiz."
 BBA_italy_interaction_events.71.t:0 "Bir İtalyan Teklifi"
 BBA_italy_interaction_events.72.a:0 "Uzun zamandır direndiler"
 BBA_italy_interaction_events.72.desc:0 "Sürgündeki [FROM.GetAdjective]ların lideri [FROM.GetLeader], dün gece [ROOT.GetLeader]’in özel konutuna gizli bir ziyaret gerçekleştirerek, İtalyanların rejimleri altında yeni bir hükûmet kurma teklifini kabul etme kararını sessizce bildirdi. Bu sıkıntılı zamanlarda cömertliğimiz için bize teşekkür etti, ancak halkı için en iyisini düşünmesi gerektiğini söyledi."
 BBA_italy_interaction_events.72.t:0 "[FROM.GetAdjective] Ayrılıyor"
 BBA_italy_interaction_events.8.a:0 "Alabilirler"
 BBA_italy_interaction_events.8.b:0 "Kim olduklarını sanıyorlar?"
 BBA_italy_interaction_events.8.desc:0 "[ITA.GetNameDef] lideri [ITA.GetLeader] bugün bize, Dalmaçya bölgesinin [ITA.GetName]'a işgal hakkı vermemizi talep eden bir ültimatom gönderdi. Eğer [ITA.GetLeader]'ın taleplerine uymazsak, muhtemelen askeri bir çatışmayla karşı karşıya kalacağız."
 BBA_italy_interaction_events.8.t:0 "[ITA.GetName] Dalmaçya'nın İşgalini Talep Ediyor"
 BBA_italy_interaction_events.9.a:0 "Her şey plana uygun"
 BBA_italy_interaction_events.9.desc:0 "[FROM.GetNameDef] lideri [FROM.GetLeader], Dalmaçya'nın işgali taleplerimizi lütfederek kabul etti ve ardından toprağı bize devretti. Bize karşı durmaktansa bizi yatıştırmayı tercih ediyorlar, bu da İtalya'nın Balkanlar'daki hedeflerine daha da yardımcı olacaktır."
 BBA_italy_interaction_events.9.t:0 "[FROM.GetName] Taleplerimizi Kabul Ediyor"
 BBA_italy_interaction_events_news.1.a:0 "Maalesef başka seçenek yoktu"
 BBA_italy_interaction_events_news.1.b:0 "Bu, Alman sisteminin doğasında var olan zayıflığı kanıtlıyor"
 BBA_italy_interaction_events_news.1.desc:0 "Dünya çapındaki haber ajansları, İtalyan savunma bakanlığı aracılığıyla Almanların Avusturya toprağı üzerindeki iddialarını zorladıktan sonra geri çekilmeyi seçtiklerini belirten raporlar aldı. Bu, Avrupa için tarihi bir gündür ve parçalanmış Alman devletinden ne çıkacağını sadece zaman gösterecek."
 BBA_italy_interaction_events_news.1.t:0 "Almanya Geri Adım Atıyor"
 BBA_italy_interaction_events_news.2.a:0 "Harika"
 BBA_italy_interaction_events_news.2.desc:0 "İngiliz hükûmeti bugün, Avusturya'nın bağımsızlığını destekleyeceklerini ve ulusun egemenliğine yönelik herhangi bir tehdide karşı İtalya'nın yanında duracaklarını duyurdu."
 BBA_italy_interaction_events_news.2.t:0 "İngiltere Avusturya'nın Bağımsızlığını Garanti Ediyor"
 BBA_italy_interaction_events_news.3.a:0 "Pek Fransızca değil..."
 BBA_italy_interaction_events_news.3.desc:0 "Fransızlar, İtalyan talebi uyarınca Avusturyalıları bağımsızlık mücadelelerinde desteklemeye karar verdiler ve ulusun egemenliğine müdahale etmeye çalışabilecek herhangi bir potansiyel saldırgana saldıracaklarına söz verdiler."
 BBA_italy_interaction_events_news.3.t:0 "Fransız Devleti Avusturya'nın Bağımsızlığını Garanti Ediyor"
 BBA_italy_local_rulers.1.a:0 "Bazı tavizler vermek yerel halkı memnun edebilir."
 BBA_italy_local_rulers.1.b:0 "$ETH_haile_selassie_gugsa$'yı bölgenin valisi yap."
 BBA_italy_local_rulers.1.c:0 "$ETH_haile_selassie_gugsa$ ve takipçileri bastırılmalıdır."
 BBA_italy_local_rulers.1.d:0 "Hiçbir yerel yöneticiyle müzakere olmayacak."
 BBA_italy_local_rulers.1.desc:0 "Bir Habeş ordu komutanı ve aynı zamanda İmparatorluk ailesinin bir üyesi olan Haile Selassie Gugsa, bir anlaşma yapma umuduyla bize yaklaştı. Bu gerçekten bizim için büyük bir an ve Habeşler için aşağılayıcı bir an. Bu fırsatı ele geçirip kendi çıkarımız için sömürebilirken, bu adamın birçok Habeş'in gözünde bir hain olduğunu hatırlamakta akıllıca olur; onu desteklemek belirli uyarılarla gelecektir."
 BBA_italy_local_rulers.1.t:0 "$ETH_haile_selassie_gugsa$ İtalyan Yetkililere Yaklaşıyor"
 BBA_italy_local_rulers.2.a:0 "Bazı tavizler vermek yerel halkı memnun edebilir."
 BBA_italy_local_rulers.2.b:0 "$ETH_abba_jofir$'i bölgenin valisi yap."
 BBA_italy_local_rulers.2.c:0 "$ETH_abba_jofir$ ve takipçileri bastırılmalıdır."
 BBA_italy_local_rulers.2.d:0 "Hiçbir yerel yöneticiyle müzakere olmayacak."
 BBA_italy_local_rulers.2.desc:0 "Addis Ababa'yı fethederken, savaşın başlamasından önce bizimle işbirliği yapan Jimma'nın eski kralı Abba Jofir'i serbest bıraktık. Şimdi bize eski güçlerinin bir kısmını geri getirmek için destek arayarak geldi. Hala bir miktar nüfuzu olduğu için bu bize faydalı olabilir, ancak bizimle komplo kurduğu ortaya çıktığı için birçok kişi onu bir hain olarak görüyor."
 BBA_italy_local_rulers.2.t:0 "$ETH_abba_jofir$ İtalyan Yetkililere Yaklaşıyor"
 BBA_italy_local_rulers.3.a:0 "Bazı tavizler vermek yerel halkı memnun edebilir."
 BBA_italy_local_rulers.3.b:0 "$ETH_hailu_tekle_haymanot$'u bölgenin valisi yap."
 BBA_italy_local_rulers.3.c:0 "$ETH_hailu_tekle_haymanot$ ve takipçileri bastırılmalıdır."
 BBA_italy_local_rulers.3.d:0 "Hiçbir yerel yöneticiyle müzakere olmayacak."
 BBA_italy_local_rulers.3.desc:0 "Tahttan indirilmiş bir Habeş soylusu olan Hailu Tekle Haymanot, birbirimize fayda sağlayabileceğimizi iddia ederek bizimle temasa geçti. Habeşistan'daki hükûmetimizde bir pozisyon karşılığında bize hizmetlerini sunuyor. Eski bir hükümdar olması, amaçlarımıza hizmet edebilir, ancak tam da bu olması - eski bir hükümdar - belki de onun yönetimine karşı çıkacak olan yerel nüfus için de sonuçları olacaktır."
 BBA_italy_local_rulers.3.t:0 "$ETH_hailu_tekle_haymanot$ İtalyan Yetkililere Yaklaşıyor"
 BBA_italy_local_rulers.4.a:0 "Bazı tavizler vermek yerel halkı memnun edebilir."
 BBA_italy_local_rulers.4.b:0 "$ETH_seyoum_mengesha$'yı bölgenin valisi yap."
 BBA_italy_local_rulers.4.c:0 "$ETH_seyoum_mengesha$ ve takipçileri bastırılmalıdır."
 BBA_italy_local_rulers.4.d:0 "Hiçbir yerel yöneticiyle müzakere olmayacak."
 BBA_italy_local_rulers.4.desc:0 "Habeşlere karşı çarpıcı zaferimizde, önde gelen ordu komutanlarından ve İmparatorluk ailesinin bir üyesi olan Seyoum Mengesha'yı yakalamayı başardık. Habeş İmparatoru Haile Selassie'nin bu adama çok değer verdiği söyleniyor. Bu mahkumu imparatoru daha da aşağılamak ve belki de halkın sadakatini güvence altına almak için kullanabiliriz. Elbette gerçek bir gücü olmayacak ama söylendiği gibi yapacak."
 BBA_italy_local_rulers.4.t:0 "$ETH_seyoum_mengesha$ İtalyan Yetkililere Yaklaşıyor"
 BBA_italy_missiolinis.02_north.a:0 "Sonunda galip geleceğiz"
 BBA_italy_missiolinis.02_north.b:0 "Bir liderlik değişikliğine ihtiyacımız var!"
 BBA_italy_missiolinis.02_north.c:0 "Şaşırtıcı bir başarısızlık!"
 BBA_italy_missiolinis.02_north.desc:0 "Kuzey Habeşistan'daki karşı taarruzumuzun beklenen başarısı hiçbir yerde görünmüyor. Duce, tüm dünyanın kendisine ve savaştaki ilerleme eksikliğine güldüğüne yemin ediyor. Birliklerin düzgün bir şekilde motive edilip yönetildiğinden emin olmak için kuzey taarruzunu bizzat yönetme niyetinde."
 BBA_italy_missiolinis.02_north.t:0 "Kuzey Cephesi Duraklıyor"
 BBA_italy_missiolinis.03_north.a:0 "Onları kaçarken yakaladık!"
 BBA_italy_missiolinis.03_north.desc:0 "Mussolini'nin, kuzey Habeşistan'daki ordulara ve onların şiddetli rakiplerini geri püskürtmedeki başarılarına övgü ve hayranlıktan başka bir şeyi yok. Elbette, Duce'lerinden doğru motivasyonu ve galip gelmek için araçları aldıkları sürece, birliklerimizin yiğitliğinden asla şüphe etmedi."
 BBA_italy_missiolinis.03_north.t:0 "Kuzey Etiyopya'da Başarı"
 BBA_italy_missiolinis.04_south.a:0 "Sonunda galip geleceğiz"
 BBA_italy_missiolinis.04_south.b:0 "Bir liderlik değişikliğine ihtiyacımız var!"
 BBA_italy_missiolinis.04_south.c:0 "Şaşırtıcı bir başarısızlık!"
 BBA_italy_missiolinis.04_south.desc:0 "Habeşistan'daki Güney karşı taarruzu, Duce'nin istediği hedeflere ulaşamadı, bu da onu saatlerce beceriksizlik ve aptallıkla çevrili olduğu konusunda söylenmeye bıraktı. Askeri yüksek komutanlığın ona karşı çalıştığından ve Generallerin tüm savaşın başarısız olmasını istediğinden emin görünüyor."
 BBA_italy_missiolinis.04_south.t:0 "Güney Cephesi Duraklıyor"
 BBA_italy_missiolinis.05_south.a:0 "Düşmanı geri püskürttük!"
 BBA_italy_missiolinis.05_south.desc:0 "Güney Habeşistan'daki son kazanımlardan çok memnun olan Mussolini, İtalyan birliklerinin cesaretini ve bu çatışmayı sona erdirme konusundaki adanmışlıklarını alkışlıyor. Hiçbir zaman şüphesi olmadı ve savaş alanında düşmanları yenmek için ordularımıza tam olarak güvendi - bir kez Duce'lerinden uygun desteği aldıklarında."
 BBA_italy_missiolinis.05_south.t:0 "Güney Etiyopya'da Başarı"
 BBA_italy_missiolinis.101.a:0 "İtalya'ya şan olsun!"
 BBA_italy_missiolinis.101.desc:0 "İtalya ile Arnavutluk arasındaki güçlü bağlar, Roma İmparatorluğu'na kadar binlerce yıl öncesine dayanır. İki ulusumuz arasında güçlü bir tarihsel bağlantı vardır, Duce bu bağlantının derinleştiğini görmeye kararlıdır. Arnavutluk'u İtalya'ya dahil etmek ve Adriyatik Denizi'ne girişi tam olarak kontrol edebilmemiz için ülkenin hızla işgal edilmesini talep etti. Bu, çok uzun zamandır diğer birçok ulus tarafından daha küçük bir güç olarak görülen İtalya'ya şan ve prestij getirecektir - ya da o öyle iddia ediyor."
 BBA_italy_missiolinis.101.t:0 "Arnavutluk'u İşgal Et"
 BBA_italy_missiolinis.102.a:0 "Rezalet"
 BBA_italy_missiolinis.102.desc:0 "Askerlerimizin Arnavutluk'ta herhangi bir ilerleme kaydetmekte zorlanması, bunu ulusal bir utanç olarak nitelendiren Duce'yi şaşırttı. Özel olarak, bunun İtalya için - ve kendisi için - şanlı bir an olması gerektiğini ve yaklaşık 20 yıl önceki aşağılayıcı çekilmemizi nasıl haklı çıkaracağını öfkeyle mırıldanıyor. Bunun yerine, beceriksizlik ve korkaklık tarafından ihanete uğradığımızı söylüyor."
 BBA_italy_missiolinis.102.t:0 "Arnavutluk'ta Başarısızlık"
 BBA_italy_missiolinis.103.a:0 "Gelecek zaferler için!"
 BBA_italy_missiolinis.103.desc:0 "Mussolini, coşkulu bir kalabalığa birliklerimizin Arnavutluk'ta muzaffer olduğunu memnuniyetle ilan etti. Tüm ülkenin artık bizim kontrolümüzde olduğunu ve bunun İtalya'yı daha da büyük bir güce ve şana götüreceğini anlattı. Eski imparatorlukların günlerinin sayılı olduğunu ve İtalya'nın günlerinin henüz gelmediğini ilan etti."
 BBA_italy_missiolinis.103.t:0 "Arnavutluk'un İşgali"
 BBA_italy_missiolinis.11.a:0 "Düşman yenilecek!"
 BBA_italy_missiolinis.11.desc:0 "Duce şimdi Habeşistan'daki savaşın hızlı bir şekilde sona ermesini istiyor, böylece İtalya daha fazla zafer için başka yerlere yönelebilir. Antik Aksum topraklarını fethetmek, İtalya’nın dünyanın büyük imparatorluklarından biri olarak yerini sağlamlaştıracaktır. \n\nHala kalan Habeş kaleleri halledilmeli ve tüm Habeş toprakları İtalyanların elinde olmalıdır."
 BBA_italy_missiolinis.11.t:0 "Savaşı Bitir"
 BBA_italy_missiolinis.111.a:0 "Dalmaçya haklı olarak bizimdir"
 BBA_italy_missiolinis.111.desc:0 "Büyük Savaş'ta galipler arasında olmamıza ve Londra Paktı aracılığıyla Dalmaçya'nın bize vaat edilmesine rağmen, sözde müttefiklerimiz tarafından ihanete uğradık. Bize vaat edilenleri asla alamadık, bu yüzden şimdi zorla almalıyız, diye iddia ediyor Duce. Ayrıca, eski güçler ne derse desin, haklı olarak bize ait olanı almanın İtalya'nın kaderinde olduğunu belirtti."
 BBA_italy_missiolinis.111.t:0 "Dalmaçya'yı Fethet"
 BBA_italy_missiolinis.112.a:0 "Bu bize yönelik adaletsizliği sadece derinleştiriyor"
 BBA_italy_missiolinis.112.desc:0 "Adriyatik kıyısının hızlı bir istilası olması gereken şey bir angaryaya dönüştü. Birliklerimiz Dalmaçya'da batağa saplandı ve İtalyan halkına vaat edilen büyük fethi gerçekleştiremedi. Duce birkaç kez, Dalmaçya'nın haklı olarak bize ait olduğunu mırıldanırken neredeyse katatonik bir durumda bulundu. Bu, Duce'nin umduğu güç gösterisi olmadı."
 BBA_italy_missiolinis.112.t:0 "Dalmaçya'nın Duraklayan İstilası"
 BBA_italy_missiolinis.113.a:0 "Bir adaletsizlik giderildi"
 BBA_italy_missiolinis.113.desc:0 "Büyük bir adaletsizlik nihayet düzeltildi! Dalmaçya kıyısı bizimdir. Mussolini coşku içinde, bu zaferi İtalya ve halkı için büyük bir an olarak nitelendiriyor. Büyük bir şikayetin nihayet düzeltildiğini ilan etti. İnsanlar bu önemli olayı kutlamak için sokaklara döküldü."
 BBA_italy_missiolinis.113.t:0 "Dalmaçya'nın Fethi"
 BBA_italy_missiolinis.12.a:0 "Habeşler zorlu bir mücadele veriyor"
 BBA_italy_missiolinis.12.desc:0 "Habeşistan'ın hala özgür olması ve işgale direnmesi gerçeği, Duce'yi saatlerce öfkelendirdi, bunu bir utanç olarak nitelendirdi; sadece kendisi için değil, İtalya ve halkı için de. Eğer savaşın son aşamalarını bizzat denetleyebilseydi, şimdiye kadar bitmiş olurdu diye yakınıyor çevresindeki herkese."
 BBA_italy_missiolinis.12.t:0 "Savaş Devam Ediyor"
 BBA_italy_missiolinis.121.a:0 "“Bağları kır"
 BBA_italy_missiolinis.121.desc:0 "Yakın tarihli bir konuşmasında Duce, daha büyük bir İtalya vizyonunu ana hatlarıyla belirtti; burada yaptığı noktalardan biri, diğer büyük güçlerin üzerimize koyduğu kısıtlamaları kırmamız gerektiğiydi. Yunanistan'ı İtalya ve onun genişlemesi için hayati bir nokta, bize dayatılan bağların ötesine geçebilmemiz için aşılması gereken bir engel olarak ilan etti."
 BBA_italy_missiolinis.121.t:0 "Yunanistan'ı Dize Getir"
 BBA_italy_missiolinis.122.a:0 "Direniş şiddetliydi"
 BBA_italy_missiolinis.122.desc:0 "Yunanistan'ın dağlık arazisi, birliklerimiz için aşılamaz bir engel olduğunu gösterdi. Kendilerini engellenmiş ve kıstırılmış buluyorlar. Duce hala zaferin bizim olacağına - bizim olmalı - ikna olmuş durumda ve herhangi bir aksiliği kabul etmeyi reddediyor. Üstünlüğümüzün sonunda galip geleceğini ateşli bir şekilde savunuyor."
 BBA_italy_missiolinis.122.t:0 "Yunanistan'da Utanç"
 BBA_italy_missiolinis.123.a:0 "“Geçmiş ve gelecek zaferler için"
 BBA_italy_missiolinis.123.desc:0 "Bizden önceki Roma lejyonları gibi, şimdi düşmanın birliklerini yendik ve tüm Yunanistan'ı fethettik. Mussolini, Parthenon'un gölgesinde coşkulu bir konuşma yaparak İtalyanları ve Yunanlıları yüzyıllarca ortak bir tarihe sahip kardeş halklar olarak ilan etti ve artık tarih boyunca kendi rotalarını belirlemekte özgür olduklarını söyledi."
 BBA_italy_missiolinis.123.t:0 "Yunanistan'ın Boyun Eğdirilmesi"
 BBA_italy_missiolinis.13.a:0 "Tarihin çarklarını sadece kan döndürür"
 BBA_italy_missiolinis.13.desc:0 "Mussolini çok heyecanlı ve son zaferimiz hakkında dinlemeye istekli olan veya olmayan herkese övünüyor. Karşılaştığımız çeşitli aksiliklere rağmen, İtalya'nın Habeşistan'da galip geleceğinden ve zafer kazanacağından hiç şüphesi olmadı. Nihayet ilk İtalya-Habeşistan savaşının başarısızlığının intikamını aldık! \n\nDuce, fethi faşist sistemin ve hükûmetinin bir zaferi olarak selamladı ve İtalyan halkını her zamankinden daha güçlü ve birleşik olarak nitelendirdi."
 BBA_italy_missiolinis.13.t:0 "Etiyopya'nın Fethi"
 BBA_italy_missiolinis.131.a:0 "Ticino'daki İtalyan halkını kurtarın!"
 BBA_italy_missiolinis.131.desc:0 "Hannibal fillerle Alpleri geçtiğinden beri, dağlar barbarlar için doğrudan İtalya'nın kalbine giden bir otoyol olmuştur. Duce uzun zamandır kuzey dağ geçitlerini güvence altına almak istiyor ve Ticino'nun İtalyanca konuşanlarını Anavatanlarına dahil etme fırsatını - nerede olurlarsa olsunlar İtalyan halkını birleştirerek - değerlendirmek istiyor."
 BBA_italy_missiolinis.131.t:0 "Ticino'yu Kurtar"
 BBA_italy_missiolinis.132.a:0 "İlerleme eksikliği rahatsız edici"
 BBA_italy_missiolinis.132.desc:0 "Duce, Ticino'nun İsviçreliler tarafından zorlu bir şekilde savaşılacağını biliyordu, ancak ilerleme eksikliği onu sersemletti. Taarruzumuz durduktan çok kısa bir süre sonra Duce, General’in planlarına karışmaya ve yetkinliklerini sorgulamaya başladı, ki bu İtalyan kamuoyunun gözünden kaçmadı."
 BBA_italy_missiolinis.132.t:0 "Ticino'nun Başarısız Kurtuluşu"
 BBA_italy_missiolinis.133.a:0 "Görkemli bir zafer"
 BBA_italy_missiolinis.133.desc:0 "Mussolini, oradaki İtalyanca konuşanları daha geniş İtalyan topluluğuna hoş geldiniz demek için bizzat Ticino'ya gitti ve onları ve bir bütün olarak İtalya'yı parlak bir geleceğin beklediğini temin etti. Ayrıca kuzey sınırlarının artık güvence altında olduğunu ve İtalya'nın Alpleri geçmeye çalışan herhangi bir barbarı savuşturabileceğini belirtti."
 BBA_italy_missiolinis.133.t:0 "Ticino'nun Başarılı Kurtuluşu"
 BBA_italy_missiolinis.201.a:0 "Çevrilmemiş taş bırakılmayacak"
 BBA_italy_missiolinis.201.desc:0 "Doğru yerler için doğru insanları bulmak her zaman zordur - özellikle de doğru insanlar yoksa. Duce, İtalya'nın - ve faşizmin - başarılı olması için Kabineyi dolduracak yetenekli ve nitelikli insanlar bulması gerektiğine ve bunları bulmak için her yeri arayacak birini atayacağına inanıyor."
 BBA_italy_missiolinis.201.t:0 "Siyasi Kabineyi Güçlendir"
 BBA_italy_missiolinis.202.a:0 "Beceriksizlerle çevrili olmak zor"
 BBA_italy_missiolinis.202.desc:0 "Siyasi kabineyi yeterince genişletememek, Duce'yi öfkelendirdi ve siyasi kabineyi işlevsiz olarak nitelendirdi. Yakınına gelen herkesi, kendisine ve İtalya için getirmeye çalıştığı büyüklüğe karşı çalıştıkları için aptallık ve alçaklıkla suçluyor."
 BBA_italy_missiolinis.202.t:0 "İşlevsiz Siyasi Kabine"
 BBA_italy_missiolinis.203.a:0 "Sadece en zeki ve en parlaklar"
 BBA_italy_missiolinis.203.desc:0 "Yakın tarihli bir konuşmasında Siyasi Kabine'ye hitap eden Mussolini, sadece İtalya'nın en üstün beyinlerinin orada hizmet etmeye uygun olduğunu söyledi. Ardından Kabineyi güçlendirmek için doğru insanları bulma arayışında hiçbir taşı çevrilmemiş bırakmadığını ve metanetinin uzun vadede İtalya'ya hizmet edeceğini övündü."
 BBA_italy_missiolinis.203.t:0 "Başarılı Siyasi Kabine"
 BBA_italy_missiolinis.21.a:0 "Barış ve istikrar getireceğiz"
 BBA_italy_missiolinis.21.desc:0 "Duce, Habeşlerin nasıl ezildiğini ve kaçtığını, yenilgilerinden sonra iradelerinin kırıldığını kamuoyuna açıkladı. Ancak özelde, Habeşleri İtalyan yönetimine karşı direnişleri ve meydan okumaları nedeniyle lanetliyor. Duce, yerel muhalefete kaba kuvvetle baskı yapma ve nüfusu kontrol altında tutmak için yasalar çıkarma emri verdi. Tüm ülkenin bir an önce sakinleştirilmesini ve İtalyan saflarına katılmasını istiyor."
 BBA_italy_missiolinis.21.t:0 "Etiyopya'yı Sakinleştir"
 BBA_italy_missiolinis.211.a:0 "Bu değişmeli"
 BBA_italy_missiolinis.211.desc:0 "Askeri yüksek komutadaki algılanan yetkinlik ve deneyim eksikliği, Duce'nin İtalya-Habeşistan Savaşı'ndan beri işaret etmeye meyilli olduğu bir şeydir. Bunu, yaklaşan çatışmalarda stratejik ve taktiksel muhakememizi güçlendirmek için askeri içinde en üst pozisyonlara layık adayları terfi ettirerek düzeltmek istiyor."
 BBA_italy_missiolinis.211.t:0 "Askeri Yüksek Komutayı Güçlendir"
 BBA_italy_missiolinis.212.a:0 "Bugünlerde yetkin insan bulmak zor"
 BBA_italy_missiolinis.212.desc:0 "Askeri eylemlerin kişisel sorumluluğunu üstlenmek zorunda kalırsa dikkatinin çok dağılacağından endişelenen Duce, ordudaki yetkin insan eksikliğinden şikayet etmekten çekinmedi. İşler kötüye giderse bu sorunun İtalya'nın çöküşü olacağından emin."
 BBA_italy_missiolinis.212.t:0 "Askerî Yetkinlik Eksikliği"
 BBA_italy_missiolinis.213.a:0 "Yetkin liderlik başarının anahtarıdır"
 BBA_italy_missiolinis.213.desc:0 "Askeri yüksek komutadaki son terfilerle birlikte, Mussolini İtalya'nın askeri yeteneklerine her zamankinden daha fazla güvendiğini bir dizi konuşmada belirtti. Silahlı kuvvetlerin farklı dallarına hitap ederek cesaretlerini ve yeteneklerini övdü ve birliklere gelecekteki başarılarından emin olduğunu söyledi."
 BBA_italy_missiolinis.213.t:0 "Etkili Askeri Yüksek Komuta"
 BBA_italy_missiolinis.22.a:0 "Habeşler beklenenden daha sert çıktı"
 BBA_italy_missiolinis.22.desc:0 "Habeşistan hala sakinleştirilmekten çok uzak ve İtalyan işgaline karşı direniş sert olmaya devam ediyor. Duce'nin ne Habeş halkına ne de muhalefeti bastırma çabalarına yönelik iyi bir sözü yok ve operasyonu ulusal bir utanç olarak nitelendiriyor. İtalyan sömürgecilerin kaba bir görünüme ve kaba tavırlara sahip olmasından şikayet ediyor, bu da yerel nüfusta hiçbir saygı uyandırmıyor."
 BBA_italy_missiolinis.22.t:0 "Etiyopya hala Direniyor"
 BBA_italy_missiolinis.23.a:0 "İtalya üstün hüküm sürüyor"
 BBA_italy_missiolinis.23.desc:0 "Nihayet Habeşistan'daki direnişi bastırmayı başardık, yüksek dağ zirvelerinden alçak çöl ovalarına kadar halkı İtalyan saflarında yerlerini buluyor. Memnun olan Mussolini, nihayet dikkatini diğer meselelere çevirebileceğini ve böylece İtalya'nın refaha kavuşup haklı olarak kendisine ait olanı talep edebileceğini ilan etti."
 BBA_italy_missiolinis.23.t:0 "Etiyopya'nın Sakinleştirilmesi"
 BBA_italy_missiolinis.31.a:0 "Sanayileri Genişlet"
 BBA_italy_missiolinis.31.desc:0 "İtalya'nın gerçekten gelişmesi için, Duce'nin üretim yeteneklerimizi genişletme planı var. Bu müreffeh ulus vizyonunu gerçekleştirmek için, hareketli imparatorluğumuzun büyümesini sürdürebilecek daha fazla fabrikaya ihtiyacımız var."
 BBA_italy_missiolinis.31.t:0 "Sanayileşme Programı"
 BBA_italy_missiolinis.32.a:0 "Daha çok denemeliyiz"
 BBA_italy_missiolinis.32.desc:0 "Duce, ulusun endüstriyel kapasitesini artırma konusundaki ilerleme eksikliğini rahatsız edici buldu. Kendisine konulan -kendi suçu olmayan- kısıtlamalardan yakınıyor, bu da müreffeh bir İtalya vizyonunu gerçekleştirmeyi çok daha zorlaştırıyor."
 BBA_italy_missiolinis.32.t:0 "Geri Kalan Sanayileşme İlerlemesi"
 BBA_italy_missiolinis.33.a:0 "Büyüklüğe giden ilk adım"
 BBA_italy_missiolinis.33.desc:0 "Yeni inşa edilen fabrikalar, Mussolini tarafından İtalyan sanayilerinin modernizasyonunda ilk adım olarak selamlandı. Duce, bunun ülkenin üretim kapasitesini nasıl artırdığından ve daha büyük bir İtalya için vizyonlarını daha da ileriye taşımasına nasıl olanak tanıyacağından çok memnun."
 BBA_italy_missiolinis.33.t:0 "Başarılı Sanayileşme Programı"
 BBA_italy_missiolinis.41.a:0 "İtalya için!"
 BBA_italy_missiolinis.41.desc:0 "Eski Roma İmparatorluğu gibi, filizlenen imparatorluğumuz da uzaklara ve genişlere uzanıyor ve onu sınırların hemen ötesindeki barbar sürülerinden korumak için güçlü bir orduya ihtiyacı var. Duce, İtalya'nın diğer büyük güçlerle boy ölçüşebilmesi için sözlerimizin arkasına güç koyabilmemiz gerektiğinden emin - yoksa kimse bizi ciddiye almaz!"
 BBA_italy_missiolinis.41.t:0 "Orduyu Güçlendir"
 BBA_italy_missiolinis.42.a:0 "İtalya bir şekilde korunacak"
 BBA_italy_missiolinis.42.desc:0 "İtalyan askerlerinin eksikliği, Duce'nin rakiplerimizle olan uzun sınırlarımızı bir kırılganlık noktası olarak görmesi nedeniyle tekrar eden bir endişedir. Duce, asker sayısını artırma yönündeki son başarısız girişimimizden sonra hayal kırıklığına uğradı ve halkın İtalyan büyüklüğünü geri getirme davasına olan bağlılığını sorgulamaya başladı."
 BBA_italy_missiolinis.42.t:0 "Başarısız Askerî Genişleme"
 BBA_italy_missiolinis.43.a:0 "İtalya güvende"
 BBA_italy_missiolinis.43.desc:0 "Mussolini, sınırlarımızı koruyacak ve Duce'leri gerekli görürse onları genişletecek olan yeni görevlendirilen birliklerden bazılarını bizzat denetledi. Artan tümen sayısından çok memnun ve bunun sadece kendi öngörüsü sayesinde İtalya'nın artık düşmanlarımızın bile gücünü inkâr edemeyeceği saygın bir orduya sahip olduğunu övünüyor."
 BBA_italy_missiolinis.43.t:0 "Genişletilmiş İtalyan Ordusu"
 BBA_italy_missiolinis.51.a:0 "En azından 5000 kamyon değil"
 BBA_italy_missiolinis.51.desc:0 "Son çatışmalarımız, ordumuz için lojistik destekteki belirli eksiklikleri ortaya çıkardı. Duce, İtalyan yüksek komutanlığı tarafından yeni bir ikmal kamyonları filosu sipariş etmeye ikna edildi. Başlangıçta 5000 yepyeni İtalyan kamyonunun monte edilmesini istedi, ancak daha azını kabul etmeye ikna edildi - yeterli olacağına dair güvence verildikten sonra."
 BBA_italy_missiolinis.51.t:0 "İkmal Kamyonları Filosunu Genişlet"
 BBA_italy_missiolinis.52.a:0 "Ordularımız onlarsız idare etmek zorunda kalacak"
 BBA_italy_missiolinis.52.desc:0 "Ordu için yeni kamyonların teslimatının başarısız olması, Duce'nin çabanın arkasındaki endüstriyel güçleri eleştirmesine, vizyon eksikliğinden şikayet etmesine neden oldu. İtalya ve halkı için büyük potansiyeli kendisinden başka kimsenin gerçekten göremediğine inanıyor."
 BBA_italy_missiolinis.52.t:0 "Çok Az Destek Kamyonu"
 BBA_italy_missiolinis.53.a:0 "Bu kesinlikle ordularımızı yenilmez yapacak"
 BBA_italy_missiolinis.53.desc:0 "Mussolini, ordu için yeni kamyonları üreten fabrikaları bizzat tebrik etti - işçileri İtalya'nın bel kemiği olarak nitelendirdi. Şimdi, geciken lojistikle kısıtlanmadan geniş arazi parçaları üzerinde hızlı hareket edebilen daha hareketli bir askeri güç bekliyor."
 BBA_italy_missiolinis.53.t:0 "Destek Kamyonları Filosu Güçlendirildi"
 BBA_italy_missiolinis.61.a:0 "Yakıt stoklamalıyız"
 BBA_italy_missiolinis.61.desc:0 "Modern bir ordu sadece midesiyle değil, aynı zamanda yakıtıyla da yürür ve eğer yakıt yoksa tüm savaş makinesi durur. İtalyan yüksek komutanlığı nihayet Duce'yi modern bir ordunun yakıt eksikliği nedeniyle durma noktasına geleceğine ikna etti. Ordunun tüm kolları ona ihtiyaç duyar ve savaş alanlarında başarılı olacaksak büyük miktarlarda gaz sağlayabilmeliyiz."
 BBA_italy_missiolinis.61.t:0 "Yakıt Rezervleri Programı"
 BBA_italy_missiolinis.62.a:0 "İdare etmek zorunda kalacağız"
 BBA_italy_missiolinis.62.desc:0 "Yakıt rezervlerinin eksikliği, uçakların yerde kalacağından, zırhlıların demirleyeceğinden ve orduların hareketsiz kalacağından korkan askeri yüksek komutanlık için sürekli bir endişe kaynağıdır. Duce, İtalya'nın her zamanki gibi dayanacağından emin, ancak açık emirlerinin henüz yerine getirilmemiş olmasına öfkeli."
 BBA_italy_missiolinis.62.t:0 "Yetersiz Yakıt Rezervleri"
 BBA_italy_missiolinis.63.a:0 "Rezervlerimiz kesinlikle işe yarayacak"
 BBA_italy_missiolinis.63.desc:0 "Mussolini, İtalyan ordusunun şimdi tam ölçekli bir savaş yürütmeye hazır olduğundan ve hemen yakıtının bitmeyeceğinden tamamen emin. Askeri yüksek komutanlık o kadar da rahatlamış olmayabilir, ancak şimdiye kadar toplanan rezervle yine de hafiflemiş durumdalar."
 BBA_italy_missiolinis.63.t:0 "Başarılı Yakıt Rezervleri Genişlemesi"
 BBA_italy_missiolinis.71.a:0 "Aeronautica bizim gururumuzdur"
 BBA_italy_missiolinis.71.desc:0 "Duce, Regia Aeronautica'yı ilk kurduğundan beri, ulusal bir gurur sembolü ve dünyanın en büyük hava kuvvetlerinden biri haline geldi. Tek sorun çok küçük olması ve Duce şimdi Aeronautica'yı güçlendirmek için ek uçaklar üretmeye ikna edildi."
 BBA_italy_missiolinis.71.t:0 "Hava Kuvvetlerini Genişlet"
 BBA_italy_missiolinis.72.a:0 "Talihsizlik"
 BBA_italy_missiolinis.72.desc:0 "Yeni uçakların üretimi, Duce tarafından büyük bir propaganda parçası olarak planlanmıştı, ancak şimdi orijinal niyetlerini küçültmek zorunda kaldı. Büyük miktarlarda yeni uçakların olmaması Duce'yi çileden çıkardı ve bu fiyasko için suçlayacak birini arıyor."
 BBA_italy_missiolinis.72.t:0 "Cılız bir Hava Kuvveti"
 BBA_italy_missiolinis.73.a:0 "Aeronautica zafer kazanacak!"
 BBA_italy_missiolinis.73.desc:0 "Mussolini, hava kuvvetlerini güçlendirmeye kişisel bir ilgi gösterdi ve yeni uçakların üretimini İtalyan sanayiciliğini sergilemek için bir fırsat olarak kullandı. Regia Aeronautica merkezde olmak üzere, İtalyan havacılığını ve mühendisliğini kutlayan birkaç propaganda parçası yapıldı."
 BBA_italy_missiolinis.73.t:0 "Hava Kuvvetleri Başarıyla Güçlendirildi"
 BBA_italy_missiolinis.81.a:0 "Bütün dünya görecek"
 BBA_italy_missiolinis.81.desc:0 "Duce, faşist sistemin üstünlüğünü ve kaynakları ile çabayı nasıl daha etkili bir şekilde odaklayabildiğini sergilemeye karar verdi. İtalyanlara - ve dünyanın geri kalanına - faşizmin ne kadar büyük bir hızla teknolojide büyük sıçramalar yapabileceğini göstermeyi amaçlıyor. Ayrıca bunun, tarihsel olarak bölünmüş İtalyan halkını faşizm altında toplayıp birleştireceğini umuyor."
 BBA_italy_missiolinis.81.t:0 "Teknolojik Yenilikler"
 BBA_italy_missiolinis.82.a:0 "Sadece küçük bir aksilik"
 BBA_italy_missiolinis.82.desc:0 "Faşist sistemin güçlü yönlerini göstermeye çalışmak, Duce'nin elinde patladı ve kulağına gelen herkese küfrediyor. İnsanları faşizm etrafında toplamak yerine, insanlar daha şüpheci ve kendi aralarında Mussolini'nin ne kadar aptal olduğu hakkında fısıldaşıyorlar. Ya da en azından Duce böyle inanıyor."
 BBA_italy_missiolinis.82.t:0 "Tatmin Edici Olmayan Teknolojik İlerleme"
 BBA_italy_missiolinis.83.a:0 "Duce ve ülke için!"
 BBA_italy_missiolinis.83.desc:0 "Reklamı yapılan teknolojik sıçrama, faşist sistemin yapabileceği bir şeydi ve Mussolini, liderliği altında üretilen yenilikleri sergilemekten çekinmedi. Mesaj, faşizm kadar Mussolini ve onun İtalya vizyonu hakkındadır. Bunun İtalyanları Duce'nin umduğu şekilde toplayıp birleştirip birleştirmeyeceği henüz belli değil."
 BBA_italy_missiolinis.83.t:0 "Büyük Teknolojik Yenilikler"
 BBA_italy_missiolinis.91.a:0 "İstihbarat Servisini Genişlet"
 BBA_italy_missiolinis.91.desc:0 "Duce, İstihbarat Servisimize ek kaynaklar aktarmaya ikna edildi ve bunun dünyanın en iyilerinden biri olacağı vaat edildi. Bu da onu, ajanlarımızın İtalyan toplumunun her yönüne sızarak komünistleri, suçluları ve diğer zararlı unsurları gün ışığına çıkarıp adalete teslim ederek İtalya'yı daha güvenli hale getirdiği konusunda kamuoyuna övünmeye yöneltti."
 BBA_italy_missiolinis.91.t:0 "İstihbarat Servisi Genişlemesi"
 BBA_italy_missiolinis.92.a:0 "Gerçekten bir utanç"
 BBA_italy_missiolinis.92.desc:0 "İstihbarat Servisini güçlendirmek yerine, birkaç gizli belge sızdırıldı - ajanlarımız hakkında lanetleyici bir izlenim bırakarak. Belgeler büyük önem taşıyan sırlar içermese de, kısa bir süre önce istihbarat teşkilatımızla övünen Duce için bir utanç kaynağıdır. Bu sadece Duce'yi kızdırmakla kalmayacak, aynı zamanda İtalyan halkının ve düşmanlarımızın zihninde yeteneklerimiz hakkında şüphe uyandıracaktır."
 BBA_italy_missiolinis.92.t:0 "Bir İstihbarat Servisi Fiyaskosu"
 BBA_italy_missiolinis.93.a:0 "Gerçekten bir başarı"
 BBA_italy_missiolinis.93.desc:0 "Birkaç muhalif vatandaşın İtalya'nın faşist hükûmetine yabancı yardımla zarar verme planları yaparken yakalanmasından sonra istihbarat servisimizin yetkinliği şüphe götürmez bir şekilde kanıtlanmıştır. Mussolini, bu başarıyı İtalya'nın onun rehberliğinde galip geleceğini ve geleceğin getirebileceği her türlü zorluğun üstesinden geleceğini göstermek için kullandı."
 BBA_italy_missiolinis.93.t:0 "Büyük bir İstihbarat Servisi Çabası"
 BBA_italy_missiolinis.council:0 "Büyük Konsey'in daha acil endişeleri var..."
 BBA_italy_naval_cooperation_programs.01.a:0 "Faydalı bir anlaşma!"
 BBA_italy_naval_cooperation_programs.01.b:0 "İtalyanların bize sunacağı bir şey yok."
 BBA_italy_naval_cooperation_programs.01.desc:0 "[From.GetName]'dan onlarla bir Denizcilik İşbirliği Programına katılma teklifi aldık. Böyle bir program bizim için oldukça faydalı olabilir, ancak [FROM.GetAdjective] donanması için de aynı derecede faydalı olacaktır."
 BBA_italy_naval_cooperation_programs.01.t:0 "İtalyan Denizcilik İşbirliği Programı"
 BBA_italy_naval_cooperation_programs.02.a:0 "Uzmanları işe koyalım!"
 BBA_italy_naval_cooperation_programs.02.desc:0 "Görünüşe göre [From.GetName] mantıklı bir karar verdi ve Denizcilik İşbirliği Programımıza katılmaya karar verdi. Bu kesinlikle her iki tarafa da fayda sağlayacak ve yeteneklerimizi güçlendirecektir!"
 BBA_italy_naval_cooperation_programs.02.t:0 "[FROM.GetNameDefCap], $ITA_naval_cooperation_program_research_group_name$'e Katılıyor"
 BBA_italy_naval_cooperation_programs.03.a:0 "Beklenmedik derecede aptalca bir seçim."
 BBA_italy_naval_cooperation_programs.03.desc:0 "[FROM.GetName], bilge olanın sayılarda güç olduğunu bildiği halde, yalnızlığı güçle karıştırarak aptalca bir şekilde Denizcilik İşbirliği Programımıza katılmayı reddetti."
 BBA_italy_naval_cooperation_programs.03.t:0 "[FROM.GetNameDefCap], $ITA_naval_cooperation_program_research_group_name$'i Reddediyor"
 BBA_italy_naval_cooperation_programs.04.a:0 "İleri!"
 BBA_italy_naval_cooperation_programs.04.b:0 "İtalyanların bize sunacağı bir şey yok."
 BBA_italy_naval_cooperation_programs.04.desc:0 "[FROM.GetAdjective]'ler bize ortak bir deniz tatbikatına katılmayı teklif ediyorlar, diyorlar ki ancak savaşa hazırlanarak düşmanlarımız gelirse hazır oluruz."
 BBA_italy_naval_cooperation_programs.04.t:0 "[FROM.GetAdjective] Donanması ile Müşterek Manevralar"
 BBA_italy_naval_cooperation_programs.05.a:0 "Harika!"
 BBA_italy_naval_cooperation_programs.05.desc:0 "[FROM.GetName], düşmanlarımız üzerimize çökerse hazırlanma ve hazır olma ihtiyacını fark ederek ortak bir deniz manevrası teklifimizi kabul etti."
 BBA_italy_naval_cooperation_programs.05.t:0 "[ROOT.GetAdjective]-[FROM.GetAdjective] Manevraları Devam Ediyor"
 BBA_italy_naval_cooperation_programs.06.a:0 "[FROM.GetLeader] bunu doğru düzgün düşünmemiş..."
 BBA_italy_naval_cooperation_programs.06.desc:0 "[FROM.GetName]'ın dar görüşlülüğü şaşırtıcı! Filolarımızı daha iyi hazırlamak ve hazır tutmak için ortak bir deniz tatbikatı teklifimizi reddetmek sadece kibirlerini gösterir."
 BBA_italy_naval_cooperation_programs.06.t:0 "[FROM.GetNameDefCap] Teklifimizi Reddediyor"
 BBA_italy_naval_cooperation_programs.07.a:0 "Öğrendiklerimizi pratiğe dökme zamanı!"
 BBA_italy_naval_cooperation_programs.07.desc:0 "Amirallerimiz, son deniz tatbikatımızın büyük bir başarı olduğunu bildirmekten mutluluk duyuyor! Çok sayıda yeni bilgi edindik ve açık denizlerdeki gelecekteki operasyonlar için daha donanımlıyız."
 BBA_italy_naval_cooperation_programs.07.t:0 "[ROOT.GetAdjective]-[FROM.GetAdjective] Manevraları"
 BBA_italy_naval_cooperation_programs.08.a:0 "Bu [ROOT.GetAdjective] filosunu güçlendirecektir!"
 BBA_italy_naval_cooperation_programs.08.b:0 "[ITA.GetAdjective] hurdasına ihtiyacımız yok."
 BBA_italy_naval_cooperation_programs.08.desc:0 "[FROM.GetAdjective]'ler bize eskort gemilerinden bazılarını satma teklifiyle yaklaştı. Bu gemilerden bazıları oldukça eski ve modası geçmiş, ama belki de donanmamızda hala bir işe yarayabilirler."
 BBA_italy_naval_cooperation_programs.08.t:0 "[FROM.GetAdjective]'den Eskort Gemileri Satın Alma Teklifi"
 BBA_italy_naval_cooperation_programs.09.a:0 "İyi bir anlaşma!"
 BBA_italy_naval_cooperation_programs.09.desc:0 "[FROM.GetName], eski ve modası geçmiş eskort gemilerimizden bazılarını satın almayı kabul etti. Bu modası geçmiş gemilere razı olduklarına göre gerçekten çaresiz olmalılar. Yine de, onları satmak ve hizmetimizden çıkarmak, filomuzun yeteneklerini genel olarak daha hızlı ve daha çevik hale getirerek güçlendirecektir."
 BBA_italy_naval_cooperation_programs.09.t:0 "[FROM.GetNameDefCap] Eskort Gemilerimizi Satın Almayı Kabul Ediyor"
 BBA_italy_naval_cooperation_programs.10.a:0 "Başka alıcılar buluruz."
 BBA_italy_naval_cooperation_programs.10.desc:0 "[FROM.GetName], umduğumuz gibi eski ve modası geçmiş eskort gemilerimizi satın almaya o kadar kolay ikna olmadı. Bu modası geçmiş gemilerden kurtulmak için başka yerlere yönelmeliyiz."
 BBA_italy_naval_cooperation_programs.10.t:0 "[FROM.GetNameDefCap] Eskort Gemilerimizi Reddediyor"
 BBA_italy_naval_cooperation_programs.11.a:0 "Bu jesti takdir ediyoruz!"
 BBA_italy_naval_cooperation_programs.11.desc:0 "[FROM.GetAdjective]'ler bize eski Muhriplerinden ikisini teklif etti. Ücretsiz. Bu gemiler biraz modası geçmiş olsa da, donanmamıza hala iyi hizmet edebilirler. Bu gerçekten cömert bir jest."
 BBA_italy_naval_cooperation_programs.11.t:0 "[ITA.GetNameDefCap] Muhrip Teklif Ediyor"
 BBA_italy_naval_cooperation_programs.12.a:0 "Hoşçakalın!"
 BBA_italy_naval_cooperation_programs.12.desc:0 "[FROM.GetAdjective] Donanması, onlara o kadar cömertçe hediye ettiğimiz Muhriplerimizi aldı. Ücretsiz. Umarım, iyi bir şekilde kullanılırlar."
 BBA_italy_naval_cooperation_programs.12.t:0 "Aquila Sınıfı Muhriplerimiz İspanya'ya Varır"
 BBA_italy_naval_cooperation_programs.13.desc:0 "[FROM.GetAdjective], iki Muhrip hediyemizi biraz kibirli bir şekilde reddetti. Ücretsiz. Filoları gerçekten de böyle bir teklifi reddedecek kadar güçlü olmalı!"
 BBA_italy_naval_cooperation_programs.13.t:0 "[FROM.GetNameDefCap] Muhriplerimizi Reddediyor"
 BBA_italy_naval_cooperation_programs.14.a:0 "Donanmamız için faydalı olabilirler."
 BBA_italy_naval_cooperation_programs.14.b:0 "İlgilenmiyorum, devam et."
 BBA_italy_naval_cooperation_programs.14.desc:0 "[FROM.GetAdjective]'ler, beş adet cep denizaltısı satın alma konusundaki ilgimizi sordular. Sınırlı kullanılabilirlikleri var ama ihtiyaçlarımıza hizmet edebilir ve denizcilik yeteneklerimizi genişletebilirler."
 BBA_italy_naval_cooperation_programs.14.t:0 "[ITA.GetName] Cep Denizaltıları İhraç Ediyor"
 BBA_italy_naval_cooperation_programs.15.a:0 "Harika!"
 BBA_italy_naval_cooperation_programs.15.desc:0 "[FROM.GetAdjective] Donanması cep denizaltılarımızla bazı avantajlar gördü ve onları satın almaya karar verdi. Bu gerçekten hem ülkemizin mühendisleri hem de kendi Donanmamız için harika bir an."
 BBA_italy_naval_cooperation_programs.15.t:0 "[FROM.GetName] Cep Denizaltılarımızı Satın Alıyor"
 BBA_italy_naval_cooperation_programs.16.desc:0 "[FROM.GetAdjective] Donanması, cep denizaltılarımızı satın almanın bir faydasını görmedi. Bunun nedeni, denizaltılarımızın en yüksek kalitede olmasına rağmen dar görüşlü ve açıkçası basit fikirli olmalarıdır."
 BBA_italy_naval_cooperation_programs.16.t:0 "[FROM.GetName] teklifimizi reddediyor"
 BBA_italy_naval_cooperation_programs.17.a:0 "Hadi onları işe koyalım!"
 BBA_italy_naval_cooperation_programs.17.desc:0 "[FROM.GetAdjective] cep denizaltıları nihayet denizcilik yeteneklerimizi desteklemek için geldi! Bunlar kesinlikle filomuza harika bir katkı olacak ve onları iyi bir şekilde kullanacağız."
 BBA_italy_naval_cooperation_programs.17.t:0 "[ITA.GetAdjective] Cep Denizaltıları [ROOT.GetName]'a Geliyor"
 BBA_italy_pact.1.a:0 "Bu bize iyi uyar."
 BBA_italy_pact.1.b:0 "Onlara güvenemeyiz!"
 BBA_italy_pact.1.desc:0 "[FROM.GetAdjective]lar, ülkelerimiz arasında ortak bir dostluk ve işbirliği beyanı sunmaya hazırlar. Onlarla bir saldırmazlık paktı, sınırlarımızı güvence altına alır ve kaynakları başka yerlere göndermek için serbest bırakır. Onlara ille de güvenmesek bile, bu bize zaman kazanma ve gücümüzü artırma imkanı tanır."
 BBA_italy_pact.1.t:0 "[FROM.GetNameDefCap] Saldırmazlık Paktı Öneriyor"
 BBA_italy_pact.2.a:0 "Aptallar!"
 BBA_italy_pact.2.desc:0 "[FROM.GetNameDefCap], anlaşmayı dürüst olmayan ve tek taraflı olarak nitelendirerek saldırmazlık paktı teklifimizi reddetti. Açıkça hayal görüyorlar ve kendileri için en iyisinin ne olduğunu anlamıyorlar."
 BBA_italy_pact.2.t:0 "[FROM.GetNameDefCap] Zeytin Dalımızı Geri Çeviriyor"
 BBA_italy_purge_the_party.1.a:0 "Danışmanları Tasfiye Et"
 BBA_italy_purge_the_party.1.b:0 "Generalleri Tasfiye Et"
 BBA_italy_purge_the_party.1.c:0 "Hepsini bağışla"
 BBA_italy_purge_the_party.1.d:0 "Herkesi tasfiye et"
 BBA_italy_purge_the_party.1.desc:0 "Hala iktidarda olan Mussolini'nin etkili müttefikleri, eski Duce'yi yeniden göreve getirmek için insanları ikna etmeye çalışıyor. Hükûmet üzerindeki kontrolümüzü sürdüreceksek, bir örnek oluşturmalı ve bu aptalları pozisyonlarından almalıyız."
 BBA_italy_purge_the_party.1.t:0 "Partito Nazionale Fascista'yı Tasfiye Et"
 BBA_italy_recognize_the_empire.1.a:0 "İtalyan İmparatorluğunu Tanı"
 BBA_italy_recognize_the_empire.1.b:0 "İlanı görmezden gel"
 BBA_italy_recognize_the_empire.1.desc:0 "[FROM.GetLeader] İtalyan İmparatorluğu'nun şafağını ilan etti! Roma'daki büyükelçimiz bu gerçeği sadece tanımamızı ve [FROM.GetAdjective]ların görkem hayallerini yaşamalarına izin vermemizi tavsiye ederken, diğerleri bu gelişmelerden endişeli. [FROM.GetAdjective]ları yatıştırmanın sadece daha fazla tavize yol açacağını ve bu tür tehlikeli imparatorluk hayallerini dizginlememiz gerektiğini savunuyorlar."
 BBA_italy_recognize_the_empire.1.t:0 "İtalyan İmparatorluğunu Tanı"
 BBA_italy_recognize_the_empire.2.a:0 "Gücümüz artıyor!"
 BBA_italy_recognize_the_empire.2.desc:0 "[FROM.GetNameDefCap] akıllıca bir şekilde imparatorluk özlemlerimizi kabul ediyor ve bizi eşitleri olarak görüyor - olması gerektiği gibi! Prestijimiz ve şanımız artmaya devam ediyor."
 BBA_italy_recognize_the_empire.2.t:0 "İmparatorluk Tanınması"
 BBA_italy_recognize_the_empire.3.a:0 "Bunun için pişman olacaklar...."
 BBA_italy_recognize_the_empire.3.desc:0 "[FROM.GetNameDefCap] aptalca bir şekilde imparatorluk hırslarımızla alay ediyor, hayallerin ve hüsnükuruntuların tek başına bir imparatorluk inşa etmediğini belirtiyor. Bu küstahlığın bedelini ödemeliler! Şimdilik zaman kollayacağız - ama o yarım akıllılara İtalyan İmparatorluğu'nun gerçek gücünü göstermeye hazırız."
 BBA_italy_recognize_the_empire.3.t:0 "İmparatorluk Reddi"
 BBA_italy_research_agreement.1.a:0 "Bu bize iyi hizmet edebilir."
 BBA_italy_research_agreement.1.b:0 "Böyle bir programa ihtiyacımız yok."
 BBA_italy_research_agreement.1.desc:0 "[FROM.GetAdjective]lar, sadece askeri yeteneklerimizi değil, aynı zamanda ülkelerimiz arasındaki bağı da güçlendirmek için ortak bir araştırma programı öneriyorlar. Bu, teknolojileri ve araştırmaları aramızda daha kolay paylaşmamızı sağlayacak ve ülkelerimizi daha da yakınlaştıracaktır."
 BBA_italy_research_agreement.1.t:0 "[FROM.GetNameDefCap] Müşterek Bir Askerî İşbirliği Programı Öneriyor"
 BBA_italy_research_agreement.2.a:0 "Kötü bir karar"
 BBA_italy_research_agreement.2.desc:0 "[FROM.GetNameDefCap], önerdiğimiz askeri işbirliğini akılsızca reddetti. Bu ortak program her iki ulusun da askeri yeteneklerini güçlendirirdi, ancak görünüşe göre [FROM.GetAdjective]'lerin böyle bir anlaşmaya ilgisi yok. Neyse ki, hedeflerimize ulaşmak için onların yardımına ihtiyacımız yok!"
 BBA_italy_research_agreement.2.t:0 "[FROM.GetNameDefCap] Askerî Teklifimizi Reddediyor"
 BBA_italy_second_italo_ethiopian_war.1.a:0 "Barış olsun!"
 BBA_italy_second_italo_ethiopian_war.1.b:0 "Asla, bastırmaya devam et!"
 BBA_italy_second_italo_ethiopian_war.1.desc:0 "[FROM.GetName]'ı kaçmaya zorladık! Kudretli ordularımız o kadar ağır kayıplar verdirdi ki, [FROM.GetAdjective]lar çıplak dizleri üzerinde sürünerek barış için yalvarıyorlar. Ülkemiz savaş yorgunu ve barış çok hoş karşılanırdı, ama bu aynı zamanda zaferimizi daha da ileriye taşımak için harika bir fırsat olabilir - başka hiçbir aptal Avrupa ülkesinin fethedilemez Etiyopya'yı fethetmeye çalışmamasını sağlamak için!"
 BBA_italy_second_italo_ethiopian_war.1.t:0 "[FROM.GetAdjective] Barış Teklifi"
 BBA_italy_second_italo_ethiopian_war.2.a:0 "Ne kadar utanç verici bir mesele..."
 BBA_italy_second_italo_ethiopian_war.2.desc:0 "Cömert barış teklifimiz Habeşler tarafından kabul edildi. Bu, savaşın başlangıcında hayal ettiğimiz şanlı zaferden çok uzak, ama belki de savaşın artık bittiği gerçeğiyle teselli bulabiliriz. Bu aşağılanmayı daha önce birçok kez yaptığımız gibi aşacağız ve eskisinden daha güçlü bir şekilde yükseleceğiz!"
 BBA_italy_second_italo_ethiopian_war.2.t:0 "[FROM.GetName], [ROOT.GetAdjective] Barış Teklifini Kabul Ediyor"
 BBA_italy_second_italo_ethiopian_war.3.a:0 "Savaşın gidişatını değiştireceğiz!"
 BBA_italy_second_italo_ethiopian_war.3.desc:0 "Eğer istedikleri savaşsa, mecbur kalırız! Habeşler cömert barış teklifimizi reddetti ve savaşmaya kararlılar. O nankör aptallara gerçek İtalyan cesaretinin ne olduğunu göstereceğiz! Bu sadece bir aksilik. Onları dağlara geri püskürteceğiz ve sonra tamamen ezeceğiz."
 BBA_italy_second_italo_ethiopian_war.3.t:0 "[FROM.GetName], [ROOT.GetAdjective] Barış Teklifini Reddediyor"
 BBA_italy_sends_military_support.1.a:0 "Bu kesinlikle işe yarayacaktır"
 BBA_italy_sends_military_support.1.desc:0 "[FROM.GetAdjective]lar savaş çabamızda bizi desteklemek istiyor ve biraz teçhizat gönderdiler. Oldukça küçük bir sevkiyat ama her türlü yardım kabul edilir."
 BBA_italy_sends_military_support.1.t:0 "[FROM.GetNameDefCap] Askerî Destek Gönderiyor"
 BBA_swiss_expansion.1.a:0 "Misyonumuzu terk etmeyeceğiz"
 BBA_swiss_expansion.1.desc:0 "Propagandacılarımızın tüm çabalarına rağmen, Demokrasi [?SWI.SWI_influence_target_state.GetName] kantonlarında beklediğimiz kadar yayılmadı, bu yüzden maalesef bize katılmak için bir referandumun başarılı olacağını düşünmüyoruz.\n\nBu, pes etmemiz gerektiği anlamına gelmez, daha da beslenebilecek bir tohum ektik, bu da bir dahaki sefere başarılı olma olasılığımızı artırıyor."
 BBA_swiss_expansion.1.t:0 "[SWI_influenced_state]'i yeterince etkilemedik"
 BBA_swiss_expansion.10.a:0 "Sonunda!"
 BBA_swiss_expansion.10.desc:0 "Alpler'in dört bir yanındaki kasabalar, iki Alp ulusumuzun birliğini kutlayacak! Bizi çevreleyen büyük güçlere karşı kendimizi daha iyi savunabileceğiz."
 BBA_swiss_expansion.10.t:0 "[FROM.GetNameDefCap], İsviçre'ye Katılacak!"
 BBA_swiss_expansion.11.a:0 "Sadece bir seçeneğimiz kaldı."
 BBA_swiss_expansion.11.desc:0 "Avrupa'nın en büyük güçlerine karşı kendini savunabilecek yeni bir ulus kurma girişimlerimize rağmen, [FROM.GetLeader] teklifimize [FROM.GetLeader.GetHerHis] tiksintisini dile getirdi."
 BBA_swiss_expansion.11.t:0 "[FROM.GetNameDefCap] Bizi Reddetti!"
 BBA_swiss_expansion.12.a:0 "Alpleri alacaklar"
 BBA_swiss_expansion.12.b:0 "Bu Saçmalık!"
 BBA_swiss_expansion.12.desc:0 "Beklenmedik bir gelişmeyle, [FROM.GetNameDef] [ROOT.GetAdjective] Alpleri üzerinde hak iddia ediyor. Argümanları en iyi ihtimalle zayıf, ancak reddedersek istilaya hazır ve konuşlandırılmış büyük bir nüfusları var. Bu ve onlar için çok elverişli bir arazi, hayır dersek uzun ve maliyetli bir savaş anlamına gelir, bu yüzden seçeneklerimizi tartmalıyız."
 BBA_swiss_expansion.12.desc_FRA:0 "Kardeş cumhuriyetimiz [FROM.GetNameDef], Alplerin tamamını kendi kanatları altına almak istiyor ve onlara hak iddia etti.\n\nBizim [ROOT.GetAdjective] Alplerimiz çok uzun zamandır ulusumuzun bir parçası olmuştur, ancak onları [FROM.GetAdjective] toprağının bir parçası yapmak, sadakatleri ve azimleri için onları ödüllendirir ve onları daha da güçlü bir müttefik yapar."
 BBA_swiss_expansion.12.t:0 "[FROM.GetName] Alp Topraklarımızı Talep Ediyor"
 BBA_swiss_expansion.13.a:0 "Bu yeni kantonları hoş karşılıyoruz!"
 BBA_swiss_expansion.13.desc:0 "[FROM.GetAdjective] hükûmeti doğru kararı verdi ve alp topraklarının haklı olarak bize ait olduğunu kabul etti. Bu, saldırganlara karşı güvenliğimizi daha da garanti altına alacaktır."
 BBA_swiss_expansion.13.t:0 "[FROM.GetNameDefCap] Taleplerimizi Kabul Etti!"
 BBA_swiss_expansion.14.a:0 "Onları öyle ya da böyle alacağız"
 BBA_swiss_expansion.14.desc:0 "[FROM.GetAdjective] Alpleri için zorlu talebimize rağmen, [FROM.GetNameDef] iddialarımızı reddettiğini belirtti. Eğer onlarla ileriye gitmeyi seçersek, bu toprağı ele geçirmek için hala başka yollarımız var."
 BBA_swiss_expansion.14.t:0 "[FROM.GetName] Alp İddialarımızı Reddetti"
 BBA_swiss_expansion.15.a:0 "Sadece kaçınılmaz olanı geciktiriyorlar!"
 BBA_swiss_expansion.15.desc:0 "[AUS.GetNonIdeologyName] ile [ROOT.GetNonIdeologyName]'ı birleştirme çabalarımız [FROM.GetName] tarafından engelleniyor, onların rezil hükûmet sistemleri lehine ve bize karşı kampanya yapıyorlar.\n\nBu iftira dolu haçlı seferi devam ederken Anschluss için baskı yapmak imkansız olacak, bu yüzden şanlı kaderimizi yerine getirmek için beklemek zorunda kalacağız!"
 BBA_swiss_expansion.15.t:0 "[FROM.GetName], [AUS.GetName]'ı Bize Karşı Kışkırtmaya Çalışıyor!"
 BBA_swiss_expansion.16.a:0 "[SWI_only_independence_response]"
 BBA_swiss_expansion.16.b:0 "Alp eyaletlerimizle birlikte bağımsız bir ülke olacaklar"
 BBA_swiss_expansion.16.c:0 "Bunun için savaşmak zorunda kalacaklar!"
 BBA_swiss_expansion.16.desc:0 "Korumamıza ve desteğimize rağmen, bağlı devletimiz [FROM.GetName] şimdi onlardan ayrıcalıklarını ve bize olan görevlerini serbest bırakmamızı ve bir kez daha kendi ulusları olmalarını talep ediyor.\n\n[GetDemandingAlpsParagraph]"
 BBA_swiss_expansion.16.t:0 "[FROM.GetNonIdeologyName] Bağımsızlık Talep Ediyor"
 BBA_swiss_expansion.17.a:0 "[ROOT.GetNonIdeologyName] için sırada ne var?"
 BBA_swiss_expansion.17.desc_alps:0 "Tüm hedeflerimize henüz ulaşmamış olsak da, bu önemli bir gündür. [FROM.GetNameDefCap] isteksizce onlardan ayrılmamıza izin verdi ve bize gıpta ettiğimiz bağımsızlığımızı verdi. Ve yine de, aynı nefeste, Alp topraklarından vazgeçme konusundaki isteksizliklerini utanmazca ilan ettiler.\n\nAlpleri bayrağımız altında birleştirmenin başka bir yolunu bulmak zorunda kalacağız."
 BBA_swiss_expansion.17.desc_no_alps:0 "[ROOT.GetNonIdeologyName] için neşeli bir gün, [FROM.GetNameDef] bağımsızlık talebimizi kabul etti. Bu, bir kez daha kendi gündemimizi belirlemekte ve dış politika duruşumuzu seçmekte özgür olduğumuz anlamına gelir. Diğer yandan, kendimizi de savunmak zorunda kalacağız."
 BBA_swiss_expansion.17.t_alps:0 "[FROM.GetName] Bize Bağımsızlığımızı Verdi ama Alp Topraklarını Vermedi"
 BBA_swiss_expansion.17.t_no_alps:0 "[ROOT.GetName] yeniden bağımsız!"
 BBA_swiss_expansion.18.a:0 "[ROOT.GetNameDefCap] yükseliyor!"
 BBA_swiss_expansion.18.desc:0 "Tasarılarımız nihayet bir araya geliyor. [ROOT.GetNonIdeologyName] nihayet bağımsızlığını geri alıyor ve onunla birlikte, eskiden [FROM.GetAdjective] Alpleri olarak bilinen toprakları da.\n\nEski hâkim devletimizin korumasına artık sahip olmasak da, yeni edindiğimiz topraklar hayatta kalmamızı daha kesin hale getirecektir."
 BBA_swiss_expansion.18.t:0 "[FROM.GetNameDefCap] Bize ve Alplere Bağımsızlığımızı Verdi"
 BBA_swiss_expansion.19.a:0 "Silah başına!"
 BBA_swiss_expansion.19.desc:0 "Bağımsızlık ilanımız eski hâkim devletimiz [FROM.GetNameDef] tarafından pek iyi karşılanmadı. Ülkemizi zorla alma umuduyla bize savaş ilan ettiler, silahlanalım ve onlara [ROOT.GetName]'ın o kadar kolay boyun eğmeyeceğini gösterelim."
 BBA_swiss_expansion.19.t:0 "[FROM.GetName], [ROOT.GetNonIdeologyName]'ın Bağımsız Olmasına İzin Vermeyecek!"
 BBA_swiss_expansion.2.a:0 "Onlara gerçek Demokrasiyi getirmeliyiz"
 BBA_swiss_expansion.2.desc:0 "Kapsamlı bir propaganda kampanyasından sonra, [?SWI.SWI_influence_target_state.GetName] halkı ezici bir çoğunlukla [ROOT.GetNameDef]'e katılmayı destekliyor.\n\nBu, eğer [?SWI.SWI_influence_target_state.GetName] bizimki gibi bir demokrasi olsaydı, ülkemizin bir parçası olacakları anlamına gelir. Maalesef durum bu değil, bu yüzden [SWI.GetName]'ın en yeni kantonları olmak için yardımımıza ihtiyaçları olacak.\n\nŞimdi [ROOT.GetNameDef]'e üyeliklerini kararlaştırmak için eyalette bir referandum için baskı yapabiliriz."
 BBA_swiss_expansion.2.t:0 "Etkimiz sayesinde, [SWI_influenced_state] saflarımıza katılmak istiyor"
 BBA_swiss_expansion.3.a:0 "Zorbalığa uğramayacağız!"
 BBA_swiss_expansion.3.b:0 "O zaman referandum olsun"
 BBA_swiss_expansion.3.desc:0 "[FROM.GetName]'daki o sözde tarafsız alçaklar, [?SWI.SWI_state_being_claimed.GetName]'ı kendilerinin olarak iddia etme cüretini gösteriyorlar. [FROM.GetNameDef]'e katılma desteğinin, o soru üzerine bir referandumun lehlerine sonuçlanacak kadar yüksek olduğunu iddia ediyorlar, bu da eyaleti haklı olarak onların yapıyor.\n\n[?SWI.SWI_state_being_claimed.GetName]'a kesinlikle kaybedeceğimiz bir referandum yapmasına izin verebiliriz ya da reddedersek onlarla savaş riskini göze alabiliriz."
 BBA_swiss_expansion.3.t:0 "[FROM.GetNameDefCap], [SWI_pressed_state] için baskı yapıyor"
 BBA_swiss_expansion.4.a:0 "Konfederasyonumuz genişliyor!"
 BBA_swiss_expansion.4.desc:0 "[?SWI.SWI_state_being_claimed.GetName] genelinde lehimize yankı bulan barışçıl bir referandumun ardından, [FROM.GetNameDef] eyaletin kontrolünü bize devretmeyi kabul etti. [?SWI.SWI_state_being_claimed.GetName] içindeki toprakları derhal kantonlara dönüştüreceğiz ve nihayet bizim demokrasi biçimimizi deneyimleyecekler."
 BBA_swiss_expansion.4.t:0 "[FROM.GetName] referandumu kabul ediyor!"
 BBA_swiss_expansion.5.a:0 "Yeminimiz bunu gerektirir!"
 BBA_swiss_expansion.5.desc:0 "Demokrasiye ve [ROOT.GetNameDef]'e olan popüler desteğe rağmen, [FROM.GetName], Konfederasyona üyelikleri konusunda bir referandum arayışında olan [?SWI.SWI_state_being_claimed.GetName] halkını görmezden gelmeye karar verdi.\n\nBu, silahlanıp işgal altındaki kantonlarımızı [FROM.GetNameDef] tiranlığına karşı savunmamız için açık bir çağrıdır."
 BBA_swiss_expansion.5.t:0 "[FROM.GetNameDef] referandum çağrılarını görmezden geliyor!"
 BBA_swiss_expansion.6.a:0 "Risk bu kadar küçük bir eyalete değmez"
 BBA_swiss_expansion.6.b:0 "[ROOT.GetNameDefCap] asla toprak devretmeyecek!"
 BBA_swiss_expansion.6.c:0 "Avrupa'nın yüzündeki sivilce tarafından zorbalığa uğramayacağız"
 BBA_swiss_expansion.6.d:0 "Kurtulduk"
 BBA_swiss_expansion.6.desc:0 "Görünüşe göre [FROM.GetName], [848.GetName] eyaletinin kendi konfederasyonlarına katılmasını talep ediyor. 1919'da eyaletin ezici bir çoğunlukla [FROM.GetNameDef]'in bir kantonu olarak katılmak için oy kullandığı, ancak [FROM.GetAdjective]'lerin kendileri tarafından reddedildiği bir referanduma atıfta bulunuyorlar. Görünüşe göre şimdi fikirlerini değiştirmişler.\n\nKabul etsek de etmesek de, genişleme peşinde oldukları açık, bu yüzden dikkatli ilerlemeli ve taleplerini kabul etsek bile toprağımızı savunmaya hazır olmalıyız."
 BBA_swiss_expansion.6.t:0 "[FROM.GetNameDefCap], [848.GetName]'ı bir Kanton olarak İstiyor"
 BBA_swiss_expansion.7.a:0 "[848.GetName] bir gün özgür olacak!"
 BBA_swiss_expansion.7.desc:0 "[FROM.GetAdjective] hükûmeti, güçlü iddiamıza ve [848.GetName] halkının demokratik iradesine rağmen talebimizi kategorik olarak reddetti.\n\nBu hakaretin yanlarına kalmasına izin vermemeliyiz."
 BBA_swiss_expansion.7.t:0 "[FROM.GetNameDefCap], [848.GetName]'ın [ROOT.GetName]'a Katılma Talebimizi Reddetti"
 BBA_swiss_expansion.8.a:0 "Bu Demokrasi için!"
 BBA_swiss_expansion.8.desc:0 "[FROM.GetNameDefCap] aydınlanmayı gördü ve [848.GetName]'ın yerinin en yeni kantonu olarak [ROOT.GetNameDef] ile olduğuna bizimle hemfikir oldu.\n\nBu, [ROOT.GetName]'ın daha demokratik bir Avrupa yolunda sadece ilk adımıdır!"
 BBA_swiss_expansion.8.t:0 "[FROM.GetAdjective] Hükûmeti, [848.GetName]'ın Özgürlüğü Talebimizi Kabul Etti"
 BBA_swiss_expansion.9.a:0 "Bu hayatta kalma şansımız olabilir"
 BBA_swiss_expansion.9.b:0 "Bu ödemeye hazır olmadığımız bir bedel!"
 BBA_swiss_expansion.9.desc:0 "[848.GetName]'ı tartışmalı bahanelerle devretmemizi talep ettikten sonra, [FROM.GetNameDef] topraklarımızı, iddialarına göre [ROOT.GetNameDef]'i yakında ilhak etmeye çalışacak olan [GER.GetNameDef]'den korumak için almayı teklif ediyor.\n\nBu nispeten makul görünse ve birlikte bir istilayı savuşturma şansımız daha yüksek olsa da, egemenliğimizle ödeme yapmak çok yüksek bir bedel olabilir.\n\nElbette, reddedersek bize saldırmalarını bekleyebiliriz."
 BBA_swiss_expansion.9.t:0 "[FROM.GetName] Korumalarını Teklif Ediyor"
 BBA_switzerland.1.a:0 "Demokratik ve tarafsız değerlerimizi korumalıyız"
 BBA_switzerland.1.b:0 "Belki de demokrasimizi korumak konusunda daha aktif olmalıyız"
 BBA_switzerland.1.c:0 "Bu koşullar altında tarafsızlık savunulamaz"
 BBA_switzerland.1.desc:0 "[ROOT.GetNameDefCap] içindeki ve çevresindeki siyasi durum hızla kötüleşiyor. Yaklaşan fırtına sırasında gemiyi doğru yöne yönlendirecek yol gösterici ilkeleri savunan büyüyen bir hareket var, ama soru şu ki, hangisi?. \n\n Komşularımızın ne yapacağını bilmiyoruz, ancak [ROOT.GetName]'ın hayatta kalmasını sağlayacak hareket tarzına şimdi karar vermeliyiz."
 BBA_switzerland.1.t:0 "[ROOT.GetAdjective] Yol Gösterici İlkeleri"
 BBA_switzerland.10.a:0 "Belki de bu güvenliğimizi garanti eder"
 BBA_switzerland.10.desc:0 "[?SWI.SWI_fascist_germany.GetNameDef] ve Gustloff'un dul eşinin temsilcileri, Frankfurter için kararlı cezaları nedeniyle [SWI.GetNameDef]'e şükranlarını ifade ettiler, bu yüzden [SWI.GetNameDef]'in bu tür konularda nerede durduğu konusunda hiçbir şüphe yok. Bu, kesinlikle [?SWI.SWI_fascist_germany.GetName]'ın [SWI.GetName]'a karşı tutumunu iyileştirecektir. \n\n[?SWI.SWI_fascist_germany.Getleader.GetHerHis] olumlu sözlerine rağmen, Nazi Partisi için ideal sonucun [?SWI.SWI_fascist_germany.GetNameDef]'e iade olacağı açıkça belirtildi."
 BBA_switzerland.10.t:0 "[?SWI.SWI_fascist_germany.GetNameDefCap], [SWI.GetNameDef]'in kararından memnun"
 BBA_switzerland.11.a:0 "Şu anda yapabileceğimizin en iyisi bu"
 BBA_switzerland.11.b:0 "Bunu unutmayacağız!"
 BBA_switzerland.11.desc_GER:0 "[SWI.GetNameDefCap], Gustloff'un katiline cüzi bir 18 yıllık ceza verme cüretini gösterdi! Bu talihsiz bir durum, ancak Olimpiyatları boykot etme çağrılarını alevlendirme riskiyle daha cezalandırıcı bir ceza için çok daha fazla bastıramazdık. \n\nŞimdilik, en azından Gustloff'u [?SWI.SWI_fascist_germany.GetNameDef]'in bir şehidi yapabilir ve cinayeti propaganda için kullanabiliriz. Belki gelecekteki bir istilada Frankfurter'ı ele geçirebilir ve adaletimizi sağlayabiliriz."
 BBA_switzerland.11.desc_SWI:0 "Konsey davadan uzak durmaya ve onu mahkemelere ve Grisons yasalarına bırakmaya karar verdiğinden, Wilhelm Gustloff'u kasten öldüren David Frankurter 18 yıl hapse mahkûm edildi. \n\n[?SWI.SWI_fascist_germany.GetNameDef]'in çok daha cezalandırıcı bir ceza isteyeceğini biliyoruz, bu yüzden diplomatlarımızın onları yatıştırmak için çok çalışmaları gerekecek, ancak bu zamanlarda taraf tutuyor gibi görünme riskini alamadık. Tarafsızlığımız, gelebilecek fırtına sırasında [SWI.GetAdjective] halkını güvende tutabilecek şey olabilir."
 BBA_switzerland.11.t:0 "David Frankfurter hapse mahkûm edildi"
 BBA_switzerland.12.a:0 "Affedilecek"
 BBA_switzerland.12.b:0 "Cezasının tamamını çekecek"
 BBA_switzerland.12.desc:0 "Artık savaş bittiğine ve $GER_fascism_DEF$ artık var olmadığına göre, David Frankfurter, hukuk danışmanı George Brunschvig'in yardımıyla, 1936'da Wilhelm Gustloff'u öldürmekten dolayı af talebinde bulundu.\n\nArtık faşist rejimlerle çevrili olmadığımız ve Frankfurter'in suçu savaş boyunca keşfedilen Nazi vahşetleri sayesinde yeniden bağlamsallaştırıldığı için, ona merhamet göstermenin neredeyse hiçbir riski olmazdı ve hatta ne olur ne olmaz diye [ROOT.GetName]'a yeniden girmesini bile yasaklayabiliriz."
 BBA_switzerland.12.t:0 "David Frankfurter af istiyor"
 BBA_switzerland.13.a:0 "Belki de istila etmek zorunda kalmayız"
 BBA_switzerland.13.desc:0 "Gustloff'un dul eşine danışmanlık yapmak için gönderdiğimiz temsilci harika haberlerle döndü. [SWI.GetName]'daki yargıçların kararı, David Frankfurter'e çok sert bir ceza verdi, talep ettiğimize oldukça yakın."
 BBA_switzerland.13.t:0 "[SWI.GetNameDefCap] talebimizi kabul ediyor"
 BBA_switzerland.14.a:0 "Taleplerini görmezden gelirken onları yatıştırmalıyız"
 BBA_switzerland.14.b:0 "Bazı iyi noktaları var"
 BBA_switzerland.14.c:0 "Bunlar İsviçre'nin düşmanları, onları tutuklayın!"
 BBA_switzerland.14.desc:0 "Federal Konsey, [ROOT.GetNameDef]'i nispeten tarafsız kalırken [SWI_get_fascist_neighbor] ile daha dostane bir ilişkiye yönlendirmeyi uman birkaç sağcı gruptan 200 üye tarafından imzalanan bir dilekçe aldı. Bunu, onlara yönelik herhangi bir olumsuz basına sert bir sansür uygulayarak, öfkelerinden kaçınmak için başarmak istiyorlar."
 BBA_switzerland.14.t:0 "200'ler Dilekçesi"
 BBA_switzerland.15.a:0 "Bir [GER.GetAdjective] ajan kullanabiliriz"
 BBA_switzerland.15.b:0 "Bir [ITA.GetAdjective] operatif faydalı olurdu"
 BBA_switzerland.15.c:0 "Belki bir [FRA.GetAdjective] ajan"
 BBA_switzerland.15.desc:0 "Tarafsız konumlarına rağmen, [FROM.GetNameDef] gizlice istihbarat görevlerimiz için operatiflerinden birini kullanma fırsatı sunuyor. \n\nBu bizim için özellikle faydalıdır, çünkü [SWI.GetNonIdeologyName]'ın nüfusu [GER.GetNonIdeologyName], [FRA.GetNonIdeologyName] ve [ITA.GetNonIdeologyName] ile aynı dili paylaşıyor, bu yüzden bu ülkelere sızmada bir avantajları var."
 BBA_switzerland.15.t:0 "[FROM.GetName] bize bir operatif ödünç vermeyi teklif ediyor"
 BBA_switzerland.16.a:0 "Büyük bir varlık olacaklar"
 BBA_switzerland.16.b:0 "Onların yardımına ihtiyacımız yok"
 BBA_switzerland.16.desc:0 "[FROM.capital.GetCapitalVictoryPointName]'da konuşlu gizli ajanlarımızdan birine [FROM.GetAdjective] hükûmetinden bir teklif geldi; ittifakımız ile [FROM.GetNameDef] arasında gizli bir pakt, bu da Avrupa'daki düşmanlarımızı zayıflatmamıza yardımcı olacakları, tarafsızlık görünümlerini korurken ve hatta zamanı geldiğinde bizim lehimize terk edecekleri anlamına gelecektir.\n\nBu aynı zamanda, işgal edilme riski altında olurlarsa onların savunmasına gideceğimiz anlamına da gelecektir."
 BBA_switzerland.16.t:0 "[FROM.GetNameDefCap] gizli pakt arıyor"
 BBA_switzerland.17.a:0 "Bu demokrasimizin selameti için!"
 BBA_switzerland.17.desc:0 "[FROM.GetNameDef] ile olan arka kapı kanallarımız aracılığıyla, önerdiğimiz gizli ittifakı kabul ettiklerine dair teyit aldık. Bundan sonra, düşmanlarına karşı desteğimizi alacaklar ve bir gün işgalin eşiğinde kendimizi bulursak bizi koruyacaklar. Bu yine de güvende olduğumuz anlamına gelmez, düşman eylemlerimizi ortaya çıkarabilir ve onları bir tehdit olarak görebilir, bu yüzden şimdiye kadar gösterdiğimiz aynı dikkatle devam etmeli ve harekete geçmeye hazırlanmalıyız."
 BBA_switzerland.17.t:0 "[FROM.GetNameDefCap] gizli paktımızı kabul etti"
 BBA_switzerland.18.a:0 "Düşmanlarımıza karşı yalnızız."
 BBA_switzerland.18.desc:0 "[FROM.GetCapitalVictoryPointName]'daki bağlantılarımızdan korkunç haberler. Görünüşe göre [FROM.GetAdjective] hükûmeti gizli bir pakt teklifimizi reddetti ve bizi komşularımızdan gelecek istilaya karşı savunmasız bıraktı. Şimdi kendimizi savunmaya hazırlanmalı veya bağımsızlığımızı ve demokrasimizi korumak için başka bir yol aramalıyız."
 BBA_switzerland.18.t:0 "[FROM.GetNameDefCap] teklifimizi reddetti!"
 BBA_switzerland.19.a:0 "Sıradışı zamanlar sıradışı önlemler gerektirir"
 BBA_switzerland.19.b:0 "Garantiler yeterli olacaktır"
 BBA_switzerland.19.c:0 "Tarafsızlığımız tek korumamız olabilir."
 BBA_switzerland.19.desc:0 "Tarihsel olarak, [FROM.GetName] sadık bir şekilde tarafsız olmuştur, ancak görünüşe göre mevcut dünya durumuna yanıt olarak bunu bozmaya karar verdiler ve diğer tarafsız ülkelerden de kendilerininkini bozmalarını istiyor gibi görünüyorlar. Eğer onların ittifakına katılmak tarafsızlıktan çok büyük bir sıçrama ise, birbirimizin bağımsızlığını da garanti edebiliriz."
 BBA_switzerland.19.t:0 "[FROM.GetNameDefCap] Bizi İttifaklarına Katılmaya Davet Ediyor"
 BBA_switzerland.2.a:0 "Adil bir yargılaması olacak."
 BBA_switzerland.2.b:0 "Her şeyi örtbas et, onu bir operatif olarak işe al!"
 BBA_switzerland.2.c:0 "İtiraf etti, bu yüzden derhal en ağır cezayı almalı."
 BBA_switzerland.2.desc:0 "Bern'de yaşayan bir Yahudi Hırvat olan David Frankfurter, Graubünden Polisine teslim oldu ve İsviçre'deki Nazi Partisi'nin Dış Organizasyon lideri Wilhelm Gustloff'un suikastını itiraf etti. \n\nSaldırının nedeni olarak Nazi Partisi'nin Yahudi halkına yönelik zararlı inançlarını ve Gustloff'un bunları [SWI.GetName]'da yaymadaki rolünü gösterdi. \n\nBu potansiyel olarak uzun sürecek meselede nasıl ilerleyeceğimizi seçmemiz, [GER.GetNameDef] ve dünyanın geri kalanı tarafından tarafsızlığa ve hukukun üstünlüğüne olan bağlılığımızı ölçmek için bir yol olarak kullanılacaktır."
 BBA_switzerland.2.t:0 "İsviçre'deki Nazi Partisi temsilcisine suikast düzenlendi"
 BBA_switzerland.20.a:0 "İdare etmek zorunda kalacağız"
 BBA_switzerland.20.desc:0 "[ROOT.GetFactionName]'e katılma davetimizden sonra, [FROM.GetNameDef] teklifimizi reddetmelerine rağmen, biz onlarınkini garanti ettiğimiz sürece bağımsızlığımızı garanti edeceklerini bize bildirdi. Tarafsızlıklarını koruyabilmeleri için bir uzlaşma."
 BBA_switzerland.20.t:0 "[FROM.GetName] İttifakımıza Katılmayacak ama Garanti Teklif Ediyor"
 BBA_switzerland.21.a:0 "Korumamıza ihtiyaçları var"
 BBA_switzerland.21.b:0 "[?FROM.SWI_angriest_country.GetName] ile çatışma riskini göze alamayız"
 BBA_switzerland.21.desc:0 "[?FROM.SWI_angriest_country.GetNameDef], [FROM.GetName]'a karşı sürekli artan bir tarafsızlık ihlalleri listesi olarak algıladıkları için savaş tehdidinde bulunurken, [From.GetNameDef] [FROM.GetAdjective] bağımsızlığını garanti ederek onları savaş çığırtkanlıklarına karşı korumamızı talep ediyor."
 BBA_switzerland.21.t:0 "Çaresiz bir [FROM.GetName], Garantimizi İstiyor"
 BBA_switzerland.22.a:0 "Kurtulduk, muhtemelen."
 BBA_switzerland.22.desc:0 "[FROM.GetName]'dan gelen diplomatik telgraflar harika haberler getirdi. Bağımsızlığımızı garanti etmeyi kabul ettiler ve [?SWI.SWI_angriest_country.GetName] da dahil olmak üzere bize saldıran olursa bizi savunacaklarına söz verdiler."
 BBA_switzerland.22.t:0 "[FROM.GetNameDefCap] Bizi Koruyacağına Söz Veriyor!"
 BBA_switzerland.23.a:0 "Sadece kendimize güvenebiliriz"
 BBA_switzerland.23.desc:0 "Maalesef, [FROM.GetName], [?SWI.SWI_angriest_country.GetNameDef]'e karşı içinde bulunduğumuz zor durumu görmezden gelmeye karar verdi. Tehditlerine karşı yanımızda durmayacaklar."
 BBA_switzerland.23.t:0 "[FROM.GetNameDefCap] Davamıza Herhangi bir Bağlılığı Reddediyor!"
 BBA_switzerland.24.a:0 "Endişe verici!"
 BBA_switzerland.24.desc:0 "Tarafsızlığımız sadece her diğer ülkeye karşı eşit tutumumuzla değil, aynı zamanda onların algısıyla da korunur. [?SWI.SWI_angriest_country.GetNameDef]'e göre, tarafsızlık sözümüzü bozduk ve düşmanlarını onlara tercih ettik. Yakında yatıştırılmazlarsa, bizi tarafsız bir ulus olarak görmeyi bırakacaklarını ve hatta bize savaş ilan edeceklerini ilettiler."
 BBA_switzerland.24.t:0 "[?SWI.SWI_angriest_country.GetNameDefCap] Bizi Tarafsızlığın İhlali İçinde Görüyor"
 BBA_switzerland.25.a:0 "Bilinmeyen sulardayız!"
 BBA_switzerland.25.desc:0 "Kara haberler, [?SWI.SWI_angriest_country.GetName] [ROOT.GetNameDef]'e olan küçümsemesini duyururken, siyasi çekişmeler ve hatta fetih için meşru bir hedef olduğumuzu ilan ettiler."
 BBA_switzerland.25.t:0 "[?SWI.SWI_angriest_country.GetNameDefCap] Artık Bizi Tarafsız Görmüyor"
 BBA_switzerland.3.a:0 "Duruşma planlandığı gibi devam edecek"
 BBA_switzerland.3.b:0 "İstihbarat çabalarımız için bir varlık olacaktır"
 BBA_switzerland.3.c:0 "Düşününce, o açıkça suçlu"
 BBA_switzerland.3.desc:0 "Şubat ayında Davos'ta bir Nazi Partisi temsilcisini öldüren David Frankfurter'in davası yaklaştı. Ona adil ve tarafsız bir yargılama sözü verdik, ancak kesinlikle başka seçenekler de var. \n\nOnu gizlice serbest bırakıp istihbarat operasyonları için işe alabiliriz ya da bunun yerine davayı iptal edip onu hemen mahkûm ederek [?SWI.SWI_fascist_germany.GetNameDef]'i yatıştırmaya çalışabiliriz. \n\nNe yaparsak yapalım, her tarafı memnun etmek bizim imkanlarımızı aşabilir."
 BBA_switzerland.3.t:0 "David Frankfurter'in duruşması yaklaşıyor"
 BBA_switzerland.4.a:0 "Artık bitti"
 BBA_switzerland.4.desc:0 "[?SWI.SWI_fascist_germany.GetNameDef] lideri [?SWI.SWI_fascist_germany.Getleader], Wilhelm Gustloff'un katiliyle hızlı bir şekilde başa çıktığı için [SWI.GetNameDef]'e [?SWI.SWI_fascist_germany.Getleader.GetHerHis] şükranlarını ifade etti, bu yüzden [SWI.GetName]'ın bu tür konularda nerede durduğu konusunda hiçbir şüphe yok. Bu insan hakları ve demokratik değerlerin ihmal edilmesi, kesinlikle [?SWI.SWI_fascist_germany.GetName]'ın bize karşı tutumunu iyileştirecektir. \n\n[?SWI.SWI_fascist_germany.Getleader.GetHerHis] olumlu sözlerine rağmen, Nazi Partisi için ideal sonucun [?SWI.SWI_fascist_germany.GetNameDef]'e iade olacağı açıkça belirtildi, şimdilik bu [SWI.GetNameDef] için söz konusu olmasa da."
 BBA_switzerland.4.t:0 "[?SWI.SWI_fascist_germany.GetLeader], [SWI.GetName]'ın kararından memnun"
 BBA_switzerland.5.a:0 "Bu iğrenç suç için adaleti hak ediyor!"
 BBA_switzerland.5.b:0 "[SWI.GetAdjective] işlerine müdahale etmeye gerek yok"
 BBA_switzerland.5.desc:0 "[SWI.GetName]'daki yetkililer, Davos'taki Nazi Partisi Yabancı Örgütü'nün öldürülmesini itiraf eden David Frankfurter'in, diğer tüm cinayet davaları gibi Graubünden yasaları altında adil ve dengeli bir yargılamaya tabi tutulacağını duyurdu.\n\nGustloff'un bir Nazi Partisi subayı olduğu ve bizim savunmasız komşumuz üzerindeki nüfuzumuz göz önüne alındığında, Gustloff'un dul eşini temsil etmek ve ideal sonucumuz için bastırmak üzere bir avukat gönderebiliriz. Bu şekilde, cezasının suçuna uygun olmasını sağlayabiliriz. \n\nDaha pragmatik konuşmak gerekirse, bu aynı zamanda [SWI.GetNameDef]'i bir taraf tutmaya zorlayabilir ve her zaman övündükleri o dayanıksız tarafsızlık cephesini nihayet kırabilir."
 BBA_switzerland.5.t:0 "[SWI.GetName], Gustloff'un katilinin davasına devam etme kararı aldı"
 BBA_switzerland.6.a:0 "Bu mahkemelerin meselesidir"
 BBA_switzerland.6.b:0 "Bunu değerlendireceğiz"
 BBA_switzerland.6.desc:0 "Gustloff'un dul eşinin yasal temsilcisi, şüphesiz [?SWI.SWI_fascist_germany.GetNameDef] tarafından gönderildi, Federal Konsey'in mahkemeyi David Frankfurter için sert bir cezaya yönlendirmesi için baskı yapmaya çalışıyor. Bu çok alışılmadık bir talep ve şüphesiz [?SWI.SWI_fascist_germany.GetNameDef]'in üzerimizde güç yansıtma girişimidir. \n\nBunu kabul etmek uluslararası itibarımız için sonuçlar doğurabilir, ancak eğer reddetmeye karar verirsek bunu karşılayıp karşılayamayacağımızdan emin olmalıyız."
 BBA_switzerland.6.t:0 "[GER.GetAdjective], David Frankfurter için sert bir ceza istiyor"
 BBA_switzerland.7.a:0 "Ne yapalım"
 BBA_switzerland.7.desc:0 "Graubünden'deki yetkililer, Nazi Partisi temsilcisi Wilhelm Gustloff'un cinayetini itiraf ettikten sonra gözaltında tutulan David Frankfurter'in bu sabah hücresinde ölü bulunduğunu bildirdi. Bunun kendi kendine mi yapıldığı, yoksa hapishanedeki öfkeli bir Nazi sempatizanı tarafından mı kaynaklandığı şu an için bilinmiyor, ancak Federal Polis cevap bulacağına söz veriyor.\n\nHerhangi bir yanlışlık kanıtımız yok ama bu durumun koşulları çok gizemli ve bazıları [SWI.GetAdjective] hükûmetinin [?SWI.SWI_fascist_germany.GetAdjective] temsilcilerinin cesedi veya olay yerini incelemesine izin vermediği için çok şüpheli."
 BBA_switzerland.7.t:0 "Frankfurter Hapishanede Gizemli Bir Şekilde Öldürüldü"
 BBA_switzerland.8.a:0 "Mahkemeler kararını versin"
 BBA_switzerland.8.b:0 "Demokrasiye bir hizmette bulundu. Affedilmeli!"
 BBA_switzerland.8.c:0 "[?SWI.SWI_fascist_germany.GetNameDef]'i yabancılaştırma riskini alamayız. En ağır cezayı alacak"
 BBA_switzerland.8.desc:0 "[SWI.GetName]'ın tamamı ve komşularının gözü David Frankfurter'in davasında. Bu davanın sonucu sadece kendi kendini suçlu ilan eden tarafın kaderini değil, aynı zamanda bir bütün olarak [SWI.GetNameDef]'in ve kurumlarında ve geleneklerinde ne kadar taviz vermeye istekli olduğunu da ortaya çıkaracaktır. \n\nTüm işaretler mahkemeden adil bir hapis cezası çıkacağına işaret ediyor, ancak konseyden gelen etki davanın sonucunu ve belki de ülkenin özünü değiştirebilir."
 BBA_switzerland.8.t:0 "David Frankfurter'in duruşması"
 BBA_switzerland.9.a:0 "Bunun bedelini ödeyecekler!"
 BBA_switzerland.9.desc_alt:0 "[SWI.GetName]'daki ajanlarımız, tarafsızlık ve hukukun üstünlüğü iddialarına rağmen, [SWI.GetNameDef]'in Wilhem Gustloff'un kendi kendini ilan eden katili David Frankfurter'ı, ölümünü taklit ederek gizlice hapisten çıkardığını ve onu bir istihbarat ajanı olarak işe aldığını bildiriyor.\n\nBu, onlara güvenilemeyeceğini ve bir fırsat bulduğumuzda ortadan kaldırılmaları gerektiğini kanıtlıyor. [?SWI.SWI_fascist_germany.GetNameDef]'e yapılan bu bariz hakaretin yanına kalmasına izin veremeyiz."
 BBA_switzerland.9.desc_default:0 "[SWI.GetNameDefCap], adalet çağrılarımıza ve tarafsızlık ile hukukun üstünlüğü iddialarına rağmen, sadece bir Nazi Partisi üyesini öldürmekle kalmayıp, bunu isteyerek itiraf eden David Frankfurter'ı affetti!\n\nBu, bir taraf tuttuklarını kanıtlıyor ve gelecekteki potansiyel bir savaşta meşru hedef olacaklar. [?SWI.SWI_fascist_germany.GetNameDef]'e yapılan bu hakaretin yanına kalmasına izin veremeyiz."
 BBA_switzerland.9.t:0 "[SWI.GetName] gazabımızı kışkırtıyor!"
 BBA_switzerland.97.a:0 "Dalgalar torpidolarımızın sesiyle canlanacak"
 BBA_switzerland.97.b:0 "O ve ailesi İsviçre'de kalıp performans sergileyebilir"
 BBA_switzerland.97.desc:0 "Müzikal yetenekli ailesiyle bir Avrupa turu kisvesi altında, bir gazi Denizaltı Kaptanı Avusturya'dan sınırlarımızı geçti ve sığınma karşılığında [ROOT.GetNameDef]'e hizmetlerini sunuyor.\n\nGeorg Von Trapp, Avusturya-Macaristan Donanması ile etkileyici bir sicile sahipti, ancak Büyük Savaş'ın sona ermesinden, imparatorluğun dağılmasından ve servetini kaybetmesinden bu yana, ailesiyle birlikte şarkıcı ve müzisyen olarak sahne alıyor. [GER.GetNameDef]'in Avusturya'yı ilhak etmesinden bu yana, onlar için hizmete zorlanıyor, bu yüzden kaçtı.\n\nKesinlikle ailesinin müzikal yeteneği, denizcilik deneyimi kadar takdir edilecektir, özellikle de kendimizi bir kıyıya ve onu savunacak bir personele sahip olmadan bulduğumuz için."
 BBA_switzerland.97.t:0 "Avusturyalı Donanma Gazisi Hizmetlerini Sunuyor"
 BBA_switzerland_fascist.1.a:0 "Saflarımıza katılabilirler"
 BBA_switzerland_fascist.1.b:0 "Onlara ihtiyacımız yok!"
 BBA_switzerland_fascist.1.desc:0 "Eski bir Suçlu Peynir Devleti olan cılız [FROM.GetName] ulusu, kuklamız olarak [ROOT.GetNameDef]'e bağlanmak istiyor. Bu, bir zayıflık itirafı veya [ROOT.GetRulingParty]'e bir sadakat beyanı olarak kabul edilebilir\n\n Güçlü savunma yetenekleri ve iyi eğitimli sivil nüfusu gelecekteki planlarımız için faydalı olabilir."
 BBA_switzerland_fascist.1.t:0 "[FROM.GetNameDefCap] korumamızı istiyor"
 BBA_switzerland_fascist.2.a:0 "Ufukta kara bulutlar"
 BBA_switzerland_fascist.2.desc:0 "[FROM.GetName]'a yönelik tekliflerimize rağmen, [FROM.GetAdjective] rejimine boyun eğme teklifimizi reddettiler. \n\n Bu bizi hassas bir duruma sokuyor, çünkü açıkça herhangi bir tarafsızlık görünümünü kaybettik ve şimdi gelecek olanları kendi başımıza atlatabiliriz."
 BBA_switzerland_fascist.2.t:0 "[FROM.GetNameDefCap] bizi reddetti"
 BBA_switzerland_fascist.3.a:0 "Haklı olarak onların"
 BBA_switzerland_fascist.3.b:0 "Bununla onlara güvenilemez"
 BBA_switzerland_fascist.3.desc:0 "[FROM.GetNameDef], 1919'da bölgenin çoğunluğunun o zamanki İsviçre Konfederasyonuna katılmayı seçtiği bir seçimden sonra [848.GetName] üzerinde hak iddia ettiklerini iddia ediyor. Demokrasiyi terk etmiş olsalar ve oylama on yıllar önce gerçekleşmiş olsa da, bu devlet üzerindeki sorumluluğu onlara vermek, toprağı tutmak için harcadığımız kaynakları serbest bırakabilir ve [FROM.GetName]'ın yeteneklerinin ve daha da önemlisi sadakatlerinin bir testi olarak işe yarayabilir."
 BBA_switzerland_fascist.3.t:0 "[SWI.GetName], [848.GetName] üzerinde kontrol talep ediyor"
 BBA_switzerland_fascist.4.a:0 "Haklı olarak onların"
 BBA_switzerland_fascist.4.desc:0 "Sadakatimizi ve yeteneklerimizi açıkça göstermemize rağmen, [FROM.GetNameDef] talebimizi reddetmeyi seçti. [ROOT.GetNameDef]'in [?SWI.SWI_requested_territory.GetName]'a genişlemesi beklemek zorunda kalacak, belki de [FROM.GetName]'a olan devam eden tâbiliğimizin artık buna değmediğine karar verene kadar."
 BBA_switzerland_fascist.4.t:0 "[FROM.GetNameDefCap] genişleme talebimizi reddetti"
 BBA_switzerland_fascist.5.a:0 "Mükemmel"
 BBA_switzerland_fascist.5.b:0 "Yeminimiz devam ediyor"
 BBA_switzerland_fascist.5.desc:0 "Ağır bir bedeli olmuş olabilir, ama [FROM.GetNameDef]'e gösterdiğimiz boyun eğme ve onur karşılığını verdi. Derhal yürürlüğe girmek üzere, [ROOT.GetNameDef] onlar adına [?SWI.SWI_requested_territory.GetName]'ın kontrolünde olacak ve toprağımıza dahil edilecektir."
 BBA_switzerland_fascist.5.t:0 "[FROM.GetNameDefCap], [?SWI.SWI_requested_territory.GetName]'ın kontrolü talebimizi kabul etti"
 BBA_switzerland_fascist.6.a:0 "Kendilerini kanıtladılar."
 BBA_switzerland_fascist.6.b:0 "$BBA_switzerland_fascist.3.b$"
 BBA_switzerland_fascist.6.desc:0 "[FROM.GetAdjective]'in [848.GetName]'ı işgalinin bariz başarısından sonra, [FROM.GetNameDef] [SWI_requested_territory.GetAdjective] topraklarımızı kendi adlarına savunmayı teklif ediyor. \n\n Elbette bu aynı zamanda bölge üzerindeki kontrolümüzü onlara devretmek anlamına da geliyor, bu yüzden onların sadakatini değerlendirirken dikkatli olmalıyız."
 BBA_switzerland_fascist.6.t:0 "[SWI.GetName] topraklarının genişletilmesini talep ediyor"
 BBA_switzerland_fascist.7.a:0 "Yardımsever!"
 BBA_switzerland_fascist.7.desc:0 "[ROOT.GetCapitalVictoryPointName]'daki bir mitingde, [ROOT.GetLeader], [FROM.GetName]'ın ülkelerimiz arasında çok sıkı bir işbirliği ve [ROOT.GetName]'ı düşmanlarımızdan ve kendilerininkinden koruma sözü verdiğini duyurdu. \n\nDost subaylar ve memurlar [FROM.GetNameDef]'den, dostlarımızdan, şu anda ulusumuza akın ediyorlar, askeri gücümüzü geliştirmemize ve hizmetlerine sunmaya hazır olmamıza yardımcı olmak için."
 BBA_switzerland_fascist.7.t:0 "[FROM.GetNameDefCap] bizi saflarına kabul ediyor"
 BBA_switzerland_fra.15.tt:0 "§Y[FRA.GetAdjectiveCap]§! ve §Y[SWI.GetAdjectiveCap]§! uyruklu yerel bir operatif kazanacak"
 BBA_switzerland_ger.15.tt:0 "§Y[GER.GetAdjectiveCap]§! ve §Y[SWI.GetAdjectiveCap]§! uyruklu yerel bir operatif kazanacak"
 BBA_switzerland_ita.15.tt:0 "§Y[ITA.GetAdjectiveCap]§! ve §Y[SWI.GetAdjectiveCap]§! uyruklu yerel bir operatif kazanacak"
 BBA_switzerland_trade.1.a:0 "Fabrikaları savaş makinemizi besleyecek"
 BBA_switzerland_trade.1.b:0 "Sivil ekonomilerimiz birbirine yardım edecek"
 BBA_switzerland_trade.1.c:0 "Omurgasız bir tarafsız ülkeden yardıma ihtiyacımız yok"
 BBA_switzerland_trade.1.d:0 "[FROM.GetName]'a güvenemeyiz"
 BBA_switzerland_trade.1.desc:0 "Tarihsel tarafsızlıklarına rağmen, [FROM.GetNameDefCap] ulusumuzla bir ticaret anlaşması kurmaya çalışıyor. Ya bizimle hizalanmak istiyorlar ya da düşündüğümüzden daha çaresizler. \n\nNe olursa olsun, onların ağır bir şekilde güçlendirilmiş ülkesini istila etme zahmetine girmeden endüstriyel kapasitelerinden ve uygun konumlarından yararlanmaktan fayda sağlayacağız. Diğer yandan, bu, [ROOT.GetNameDef] tarafından gelecekteki bir istila durumunda konumlarını güçlendirmek anlamına gelebilir."
 BBA_switzerland_trade.1.t:0 "[FROM.GetNameDefCap], [ROOT.GetName] ile ticaret anlaşmaları arıyor"
 BBA_switzerland_trade.10.a:0 "Ne yapalım"
 BBA_switzerland_trade.10.desc:0 "Açık bir karşılıklı yarara rağmen, görünüşe göre [FROM.GetName] dünyanın geri kalanıyla artan altın ticaretiyle ilgilenmiyor."
 BBA_switzerland_trade.10.t:0 "[FROM.GetNameDefCap] Bankacılık Sistemimizi Kullanmayı Reddediyor"
 BBA_switzerland_trade.11.a:0 "Kendilerini güvenilir kanıtladılar"
 BBA_switzerland_trade.11.b:0 "İhaneti daha da kötüleştirme riskini alamayız"
 BBA_switzerland_trade.11.desc:0 "Dünyanın siyasi durumunun kurduğu ticaret engellerini aşmak için zaten [FROM.GetName]'daki piyasaları kullanıyoruz. Oradaki rezervlerimizi artırmak, onlarınkine de fayda sağlasa bile, ekonomimize daha fazla fayda sağlayabilir."
 BBA_switzerland_trade.11.t:0 "[FROM.GetAdjective] Borsaları Aracılığıyla Altın Ticaretini Daha da Geliştirebiliriz"
 BBA_switzerland_trade.12.a:0 "Bunun bedelini ödeyecekler"
 BBA_switzerland_trade.12.desc:0 "Bu, görmemiz gereken bir şeydi. Tarafsızlık kisvesini kullanarak bizi arkadan bıçakladılar. Bunun ekonomimiz için ciddi sonuçları olacak, misilleme yapmalıyız."
 BBA_switzerland_trade.12.t:0 "[FROM.GetNameDefCap] Altın Rezervlerimize El Koydu!"
 BBA_switzerland_trade.13.a:0 "Faşizmi savuşturmalarına yardım etmeliyiz"
 BBA_switzerland_trade.13.b:0 "Bu bize hiç fayda sağlamayacak"
 BBA_switzerland_trade.13.desc:0 "[FROM.GetNameDefCap], kapılarına dayanan faşist güçlere karşı koyabilmek için desteğimizi istiyor. Ekonomilerine yatırım yapabiliriz, bu şekilde en kötüsüne hazırlanabilirler veya hatta, eğer seçerlerse veya uzun süredir devam eden tarafsızlıklarını kırmaya zorlanırlarsa, Faşizmle doğrudan savaşmalarına yardımcı olabiliriz."
 BBA_switzerland_trade.13.t:0 "[FROM.GetName] Ülkelerine Yatırım Yapmamızı İstiyor"
 BBA_switzerland_trade.14.a:0 "Bu harika bir haber!"
 BBA_switzerland_trade.14.desc:0 "Bu yatırımlar ekonomimizi geliştirmemize yardımcı olacak ve Faşizmin [ROOT.GetName]'a neden olabileceği her türlü zorluğa karşı koymamızı sağlayacaktır. Ayrıca uluslarımızı daha da yakınlaştıracak, hatta belki de sonunda Faşizme karşı doğrudan muhalefet içinde olacaklar."
 BBA_switzerland_trade.14.t:0 "[FROM.GetNameDefCap], [ROOT.GetName]'a Yatırım Yapacak"
 BBA_switzerland_trade.15.a:0 "Bu bir sorun"
 BBA_switzerland_trade.15.desc:0 "Maalesef, [FROM.GetName]'ın [ROOT.GetAdjective] ekonomisine yatırım yapmayacağı konusunda bilgilendirildik. Faşizmin yaklaşan tehlikesi göz önüne alındığında, olmak istediğimizden daha izole durumdayız."
 BBA_switzerland_trade.15.t:0 "[FROM.GetNameDefCap] Yatırım Yapmayı Reddediyor"
 BBA_switzerland_trade.2.a:0 "Ne kadar kötü"
 BBA_switzerland_trade.2.b:0 "Bizi bir daha kandırmalarına izin vermeyeceğiz"
 BBA_switzerland_trade.2.desc:0 "Görünüşe göre [FROM.GetName], her iki taraf için de bolca faydası olmasına rağmen onlarla girdiğimiz ticaret anlaşmasını sürdürmeyi reddediyor. \n\nŞimdi bu konuda yapabileceğimiz pek bir şey yok, ama bu bağlılık eksikliği [ROOT.GetNameDef] tarafından kesinlikle hatırlanacaktır."
 BBA_switzerland_trade.2.t:0 "[FROM.GetName] bizimle olan ticaret anlaşmasını erken bozuyor"
 BBA_switzerland_trade.3.a:0 "Evet, hayatta kalmamız için bu malzemelere ihtiyacımız var"
 BBA_switzerland_trade.3.b:0 "Hayır, çok riskli"
 BBA_switzerland_trade.3.desc:0 "[FROM.GetNameDef] ile geçen yıl yaptığımız ticaret anlaşması [ROOT.GetName] için çok verimli oldu ve şimdi onu yenileyip yenilemeyeceğimize karar verme zamanı geldi. \n\n Böyle bir ikili anlaşmanın faydalarına ve bizim gibi bir ulusun buna ne kadar ihtiyacı olduğuna rağmen, bazı ülkeler tarafından tarafsızlığımızın bir başka ihlali olarak kabul edilebileceğinin farkında olmalıyız. Onları yabancılaştırmanın hem yönetilebilir hem de buna değer olduğundan emin olmalıyız."
 BBA_switzerland_trade.3.t:0 "[FROM.GetName] ile devam eden ticaret anlaşmamız"
 BBA_switzerland_trade.4.a:0 "Anlaşmayı yenileyelim"
 BBA_switzerland_trade.4.b:0 "Odağı Sivil Üretime değiştir"
 BBA_switzerland_trade.4.c:0 "Odağı Askerî Üretime değiştir"
 BBA_switzerland_trade.4.d:0 "Artık zahmetimize değmez"
 BBA_switzerland_trade.4.desc:0 "Görünüşe göre [FROM.GetName]'ın bizimle olan ticaret anlaşması onlar için çok faydalı olmuş, zira tarafsızlığı tekrar ihlal etme riskini göze alarak bizden malzeme temin etmeye istekliler.\n\nBu anlaşmanın bizim için pek bir dezavantajı yok, meğerki [FROM.GetName]'a yönelik potansiyel istilamıza karşı savunmaları için gerekli araçları biz sağlıyor olmayalım."
 BBA_switzerland_trade.4.t:0 "[FROM.GetName] ticaret anlaşmamızı yenilemek istiyor"
 BBA_switzerland_trade.5.a:0 "Onların kaybı!"
 BBA_switzerland_trade.5.desc:0 "[FROM.GetName]'a karşılıklı ticaret anlaşmamızda verdiğimiz cömert şartlara rağmen, onu yenilememeye ve bunun yerine tek başlarına devam etmeyi tercih ettiler. \n\n Neden böyle bir şey yapmaya karar verdiklerini anlamanın ötesinde, ama belki de en iyisi budur."
 BBA_switzerland_trade.5.t:0 "[FROM.GetName] ticaret anlaşmamızın sona ermesine izin verdi"
 BBA_switzerland_trade.6.a:0 "Harika!"
 BBA_switzerland_trade.6.desc:0 "Heyetimiz şimdi [FROM.GetName]'dan harika haberlerle döndü. Bu ticaret anlaşması, sanayimizi ve nüfusumuzu ayakta tutmak için gerekli malzemeleri güvence altına almamızı sağlayacaktır. \n\n Diğer ülkeler bunu bir tarafsızlık ihlali olarak görebilir, ancak [ROOT.GetName] için bu sadece bu belirsiz zamanlarda bağımsızlığımızı korumanın bedelidir."
 BBA_switzerland_trade.6.t:0 "[FROM.GetNameDefCap] ticaret anlaşması teklifimizi kabul etti!"
 BBA_switzerland_trade.7.a:0 "Başka bir yol bulacağız!"
 BBA_switzerland_trade.7.desc:0 "Tüm çabalarımıza rağmen, [FROM.GetAdjective] hükûmeti karşılıklı yarar sağlayan bir ticaret anlaşması teklifimizi reddetmeye karar verdi. \n\n Bu, Avrupa'daki durumun ülkemizi savunmak ve beslemek için gereken sivil ve askeri malzemeler için istikrarlı bir kaynak bulmayı giderek zorlaştırdığı için [ROOt.GetName]'ı potansiyel olarak istikrarsız bir konuma bırakıyor."
 BBA_switzerland_trade.7.t:0 "[FROM.GetNameDefCap] ticaret anlaşması teklifimizi reddetti"
 BBA_switzerland_trade.8.a:0 "Sağlam bir fikir"
 BBA_switzerland_trade.8.b:0 "Gerçekten nerede durduklarını bilemeyiz"
 BBA_switzerland_trade.8.desc:0 "Dünya genelinde ülkeler arasındaki gerilim arttıkça, ticaret daha zor hale geldi ve eğer kendimizi savaşta bulursak, altın alıp satma seçenekleri daha da sınırlı hale gelecektir. Eğer onlara yeterince güvenirsek, [FROM.GetName]'ın tarafsızlığı, rezervlerimizi saklamak ve serbestçe ticaret yapmak için bir fırsat olabilir, bu da ekonomimize ve nihayetinde savaş makinemize fayda sağlar."
 BBA_switzerland_trade.8.t:0 "[FROM.GetNameDefCap] Altın Ticareti Yapmamıza Yardımcı Olabilir"
 BBA_switzerland_trade.9.a:0 "Bu faydalı olacak"
 BBA_switzerland_trade.9.desc:0 "Bu, altın rezervlerini bizimle saklayacakları anlamına gelir, bu da ambargolardan endişe etmeden serbestçe altın alıp satmalarını sağlar. Bundan kazançlı çıkacak olan sadece onlar değil, çünkü para akışı zor durumdaki ekonomimize yardımcı olacak ve hatta gelecekte bir pazarlık kozu olarak bile kullanılabilir."
 BBA_switzerland_trade.9.t:0 "[FROM.GetNameDefCap] Altınlarını Bizim Üzerimizden Ticaret Yapacak"
