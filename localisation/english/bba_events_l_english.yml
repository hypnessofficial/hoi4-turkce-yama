 BBA_italy_anti_colonialism_events.55.desc:0 "Belki de tam bir sürpriz olmasa da, maalesef Doğu Afrika halkının artık bizim yönetimimize tabi olma fikrini reddettiğini bildirdik. Bir süredir ihmal edildiklerini ve sömürüldüklerini hissettiler ve bu nedenle yönetimimizden ayrılmak için oy verdiler."
 BBA_italy_anti_colonialism_events.55.t:0 "Doğu Afrika [ROOT.GetNameDef]'den Ayrılmak İçin Oy Veriyor"
 BBA_italy_anti_colonialism_events.56.desc:0 "Batı Afrika halkı, topraklarını ne kadar iyi niyetli ve verimli yönettiğimizi gördü ve yönetimimize katılmak için oy verdi! Görünüşe göre eyaletlerindeki yatırımlarımız ve ilgimiz karşılığını verdi. Bu kesinlikle hepimize fayda sağlayacaktır."
 BBA_italy_anti_colonialism_events.56.t:0 "Batı Afrika [ROOT.GetNameDef]'e Katılmak İçin Oy Veriyor"
 BBA_italy_anti_colonialism_events.57.desc:0 "Belki de tam bir sürpriz olmasa da, maalesef Batı Afrika halkının artık bizim yönetimimize tabi olma fikrini reddettiğini bildirdik. Bir süredir ihmal edildiklerini ve sömürüldüklerini hissettiler ve bu nedenle yönetimimizden ayrılmak için oy verdiler."
 BBA_italy_anti_colonialism_events.57.t:0 "Batı Afrika [ROOT.GetNameDef]'den Ayrılmak İçin Oy Veriyor"
 BBA_italy_anti_colonialism_events.58.desc:0 "Orta Afrika halkı, topraklarını ne kadar iyi niyetli ve verimli yönettiğimizi gördü ve yönetimimize katılmak için oy verdi! Görünüşe göre eyaletlerindeki yatırımlarımız ve ilgimiz karşılığını verdi. Bu kesinlikle hepimize fayda sağlayacaktır."
