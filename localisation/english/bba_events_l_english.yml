 bba_africa_news.1.a:0 "Nihayet, birleştik!"
 bba_africa_news.1.b:0 "Bu sömürge döneminin sonu mu?"
 bba_africa_news.1.desc:0 "1920'lerde, Sömürge Bakanı Leo Amery, Kenya, Uganda ve Tanganyika'dan oluşan beyazların yönettiği bir Doğu Afrika Dominyonu yaratmaya çalıştı. Buna karşı çıkıldı ve nihayetinde tamamlanmadı. Ancak, Doğu Afrika'nın yerli halkı bu konsepti kendi uluslarını kurmak için bir temel olarak kullandı, bu da şimdi onları her zamankinden daha güçlü kılıyor. Avrupa'nın egemen olduğu bir Afrika döneminin sona erdiğini ilan ettiler!"
 bba_africa_news.1.t:0 "Doğu Afrika Federasyonu'nun Kurulması"
 bba_africa_news.2.a:0 "Barış ve refah için umut edelim"
 bba_africa_news.2.b:0 "Bu bölge için ne anlama gelecek?"
 bba_africa_news.2.desc:0 "Yüzyıllarca süren ayrılık ve savaştan sonra, Afrika boynuzu halkı tek bir devlet altında birleştirildi. Bu daha önce neredeyse olmuştu, ancak sadece kendilerini düşünen milliyetçilerin hırsları her zaman halkların ilişkilerini parçalayan bir engel olmuştur. Ancak şimdi, bölgenin hükümdarı [ROOT.GetLeader], devletin herhangi bir belirli grubun yararına olmayacağını, bunun yerine orada yaşayan herkes için birleştirici bir faktör olacağını ilan etti. Bu sefer, bölgenin barışçıl ve müreffeh olacağını ve insanın sonuna kadar birleşik kalacağını ilan ediyor."
 bba_africa_news.2.t:0 "Afrika Boynuzu birleştirildi"
 bba_africa_news.3.a:0 "Mükemmel bir girişim!"
 bba_africa_news.3.b:0 "Ne kadar zayıf bir konsept."
 bba_africa_news.3.desc:0 "Afrika ulusları, hükümetler arası bir örgüt oluşturarak birbirleriyle işbirliği yapmaya başladılar. Bu yeni Afrika Birliği Teşkilatı, üye devletler için güvenlik ve ekonomik kalkınmayı teşvik etme sözü veriyor. Bu yüce idealleri yerine getirip getiremeyecekleri henüz belli değil."
 bba_africa_news.3.t:0 "Afrika Birliği Teşkilatı Kuruldu"
 bba_africa_news.4.a:0 "Birlikte dururuz, bölünürsek düşeriz!"
 bba_africa_news.4.b:0 "Bu hiçbir işe yaramayacak."
 bba_africa_news.4.desc:0 "Birçok kişi, Afrika Birliği Teşkilatı’nın savunduğu vaatleri yerine getirme yeteneği konusunda şüphe duyuyordu. Ancak, örgütün üyeleri, daha büyük bir Afrika Birliği içinde bir devletler federasyonu oluşturarak entegrasyonlarını derinleştirme arzusunu dile getirdiler. Her üye devletin siyasi sistemlerini tam olarak entegre etmek için yapılması gereken çok iş olsa da, Afrika'da yeni bir dünya gücünün şekillenmeye başladığı görülüyor."
 bba_africa_news.4.t:0 "Afrika Birliği'nin Kurulması"
 bba_italian_formables_news.1.a:0 "Avrupa'nın yeni hegemonları biziz!"
 bba_italian_formables_news.1.b:0 "Böyle bir ulus kaçınılmaz olarak çökecektir"
 bba_italian_formables_news.1.desc:0 "Bugün, İtalyan lideri [ITA.GetLeader], İtalyan İrredentistleri tarafından talep edilen alanları İtalyan devletine entegre etme sürecinin başladığını duyurdu. Bunun İtalya'nın bir dünya gücü olarak konumunu güçlendireceğini ve nihayet İtalyan halkını tek bir bayrak altında birleştireceğini ilan etti. Birçok kişi, bu kadar geniş bir ulusun gerçekten bir arada kalıp kalamayacağını kendine sordu ve sadece zaman İtalya için neyin saklı olduğunu biliyor."
 bba_italian_formables_news.1.t:0 "Italia Irredenta başarıldı"
 bba_news.0.a:0 "Tamamen beklenmedik değil"
 bba_news.0.desc:0 "[?global.LoN_attacker_country.GetNameDef] tarafından [?global.LoN_defender_country.GetNameDef]'e savaş ilan edilmesiyle, Milletler Cemiyeti barışı koruma çabalarında başarısız oldu. [?global.LoN_attacker_country.GetLeader], Cemiyet'in hiçbir şey yapamamasını alenen alay konusu etti ve bununla birlikte [?global.LoN_attacker_country.GetHerHis] ülkesini Cemiyet'ten çıkardı. Diğer dünya liderleri de çatışmaları önleyemiyorsa Milletler Cemiyeti'nin ne anlamı olduğunu sorgularken, Cemiyet'in günleri fiilen sona erdi. \nKonsey toplanmaya devam etse de, artık kimse gerçekten bir şey başaracağını beklemiyor. Konseyin bir zamanlar sahip olduğu otorite artık çoktan kayboldu."
 bba_news.0.t:0 "Milletler Cemiyeti'nin Sonu"
 bba_news.1.a:0 "Elbette blöf yapıyorlardır?"
 bba_news.1.desc:0 "Büyük bir savaşın patlak verme tehdidi bugün dünya çapındaki liderleri ürküttü. Sovyet lideri [SOV.GetLeader], [ITA.GetLeader]'dan [ITA.GetName]’in [ETH.GetNameDef]'e karşı yasadışı savaşını sona erdirmesini talep etti. [SOV.GetLeader], [ITA.GetName] bu talebe uymazsa, [SOV.GetLeader.GetSheHe]'nin onları buna zorlamak için güç kullanmaya istekli olacağını açıkça belirtti. Son aylarda, [SOV.GetAdjective]lar [ETH.GetNameDef]'e teçhizat ve tavsiye ile yardım etmeye hevesliydi. Artık ülkeyi kendi etki alanlarının bir parçası olarak gördükleri giderek daha açık hale geliyor."
 bba_news.1.t:0 "[SOV.GetName] İtalya-Etiyopya Savaşı'nın Sona Erdirilmesini Talep Ediyor"
 bba_news.100.a:0 "[GetPurgeEventOptions]"
 bba_news.100.a_many_purged:0 "Bir güç gösterisi"
 bba_news.100.a_none_purged:0 "Merhametli [ROOT.GetLeader] kulağa hoş geliyor."
 bba_news.100.a_some_purged:0 "Kurtulduk"
 bba_news.100.desc_many_purged:0 "[Root.GetLeader], [ROOT.GetNameDefCap]'in mutlak lideri olarak ortaya çıkarken, faşist partinin birkaç üst düzey üyesi yakın zamanda iktidardan uzaklaştırıldı. Bu tasfiye, eski Duce Benito Mussolini'nin potansiyel müttefiklerini ve tekrar İtalya’nın lideri olarak atanma umutlarını ortadan kaldırıyor."
 bba_news.100.desc_none_purged:0 "Son zamanlarda Mussolini'ye sadık üyeleri Partito Nazionale Fascista'dan atmak için büyük bir tasfiye söylentileri dolaşıyordu, ancak bunun yerine parti çapında bir af teklif edildiği görülüyor. Bu, Partiyi daha güçlü bırakabilir, ancak [ROOT.GetLeader]'ın lider olarak konumunu zayıflattı."
 bba_news.100.desc_some_purged:0 "[ROOT.GetLeader] parti üzerindeki hakimiyetini güçlendirirken, Mussolini'nin en yakın destekçilerinden bazıları faşist partiden uzaklaştırıldı. Tasfiye, bazılarının korktuğu kadar şiddetli değildi, ancak [ROOT.GetLeader]'ı İtalya için kendi gündemini takip etmede daha güçlü bir konuma bırakıyor."
 bba_news.100.t:0 "[GetPurgeEventTitles]"
 bba_news.100.t_many_purged:0 "Partito Nazionale Fascista'nın Büyük Tasfiyesi"
 bba_news.100.t_none_purged:0 "Hiç Olmayan Tasfiye"
 bba_news.100.t_some_purged:0 "Partito Nazionale Fascista'nın Tasfiyesi"
 bba_news.101.a:0 "Ve böylece Mussolini'nin hayatı sona erer."
 bba_news.101.desc:0 "İtalya'da iktidardan düşürüldükten sonra, Benito Mussolini suçlu beceriksizlik ve eylemsizlikle ihanet suçlamasıyla ev hapsine alındı ve kaderini bekliyordu - ki sonunda kaderi ona yetişti. Bu sabah erken saatlerde, eski İtalya lideri, hükûmetten küçük bir temsilci grubunun önünde bir idam mangasıyla karşı karşıya kaldı ve aynı gün en yakın ailesinin katıldığı özel bir törenle gömüldü."
 bba_news.101.t:0 "Eski İtalyan Lideri Benito Mussolini İdam Edildi"
 bba_news.102.a:0 "Düzmece bir dava"
 bba_news.102.desc:0 "[GetTrialOfMussoliniDesc]"
 bba_news.102.desc_guilty:0 "Belki de kimseyi şaşırtmayacak şekilde, eski İtalya lideri tüm suçlamalardan suçlu bulundu. Eski Duce suçsuz olduğunu iddia etmişti ama hayatının geri kalanını hapishanede geçirmeye mahkûm edildi. Sadece yeni rejimin davayı etkilediği ve sonucundan oldukça memnun olması gerektiği varsayılabilir."
 bba_news.102.desc_innocent:0 "Herkesi şaşırtarak, eski Duce tüm suçlamalardan masum bulundu ve tüm suçlamalardan beraat etti. Mussolini artık hayatının geri kalanını [ROOT.GetNameDefCap]'in özgür bir vatandaşı olarak yaşamakta serbesttir. Henüz başka bir plan açıklamamış olsa da, eski Duce'nin hala birçok insanın kalbinde ve zihninde tuttuğu etki göz ardı edilemez."
 bba_news.102.t:0 "[GetTrialOfMussoliniTitles]"
 bba_news.102.t_guilty:0 "Mussolini Hapis Cezasına Çarptırıldı"
 bba_news.102.t_innocent:0 "Mussolini Tüm Suçlamalardan Beraat Etti"
 bba_news.103.a:0 "Kesinlikle kanlı bir karmaşa."
 bba_news.103.desc:0 "[GetAssassinationOfMussoliniDesc]"
 bba_news.103.desc_communists:0 "[FROM.GetNameDefCap]'in eski lideri Benito Mussolini, görünüşe göre Komünistler tarafından idam edilmiş olarak ölü bulundu. [FROM.GetLeader] yönetimindeki yeni rejim hızla harekete geçti ve ülke çalkantılı bir atmosfere girerken birkaç Komünist sempatizanı topladı, birçoğu adalet ve algılanan düşmanlara karşı intikam çağrısında bulunuyor."
 bba_news.103.desc_coverstory:0 "[FROM.GetNameDefCap]'in eski lideri Benito Mussolini, iktidardan düşürüldükten sonra konulduğu ev hapsinden kaçmaya çalıştı. Bir avuç silahlı adam Mussolini'nin odasını bastı ve bir çatışma yaşandı. Kargaşa sırasında, Mussolini vuruldu ve yaralarından öldü."
 bba_news.103.t:0 "[GetAssassinationOfMussoliniTitles]"
 bba_news.103.t_communists:0 "Mussolini Komünistler Tarafından Öldürüldü!"
 bba_news.103.t_coverstory:0 "Mussolini Kaçma Girişimi Sırasında Öldürüldü!"
 bba_news.104.a:0 "Her Şey Plana Uygun"
 bba_news.104.desc:0 "[ROOT.GetNameDefCap], her iki ulusun da askeri yeteneklerini güçlendirmek için [FROM.GetNameDefCap] ile ortak bir işbirliği programı imzaladı. Anlaşma, her iki ülkenin de teknolojileri ve araştırmaları daha kolay paylaşmasını sağlayacak ve aralarındaki bağı kesinlikle güçlendirecektir."
 bba_news.104.t:0 "Yeni bir Askerî Program Açıklandı"
 bba_news.105.a:0 "Akıllıca bir karar"
 bba_news.105.desc:0 "[ROOT.GetNameDefCap] ve [FROM.GetNameDefCap], iki ulus arasında barışı garanti eden bir saldırmazlık paktı imzaladı. Bu, onları başka yerlere odaklanmak için serbest bırakacak, ancak herkes bu istikrarsız paktın ne kadar süreceğini merak ediyor."
 bba_news.105.t:0 "Yeni bir Saldırmazlık Paktı İmzalandı"
 bba_news.106.a:0 "Bir devrin sonu"
 bba_news.106.desc:0 "[GetVittorioDiesEventDesc]"
 bba_news.106.desc_emperor:0 "[FROM.GetName]'ın eski imparatoru, III. Vittorio Emanuele, öldü. İtalya'yı iki Dünya Savaşı sırasında yönlendiren o, bu zorluklar sırasında [FROM.GetAdjective]lar için bir istikrar sembolü ve bir toplanma noktası olarak hizmet etti. Yas tutan insanlar, ölü imparatora olan takdirlerini ve desteklerini göstermek için sokaklara döküldü. \n\n Ulus, eski imparatorun tek varisi ve halefi olan Prens Umberto'nun, [FROM.GetAdjective] halkı için benzer şekilde kararlı bir demirbaş olmasını umuyor. Prens yakında [FROM.GetName] İmparatoru I. Umberto olarak taç giyecek - saltanatı uzun olsun!"
 bba_news.106.desc_king:0 "[FROM.GetName]'ın eski kralı, III. Vittorio Emanuele, öldü. İtalya'yı iki Dünya Savaşı sırasında yönlendiren o, bu zorluklar sırasında [FROM.GetAdjective]lar için bir istikrar sembolü ve bir toplanma noktası olarak hizmet etti. Yas tutan insanlar, ölü krala olan takdirlerini ve desteklerini göstermek için sokaklara döküldü. \n\n Ulus, eski kralın tek varisi ve halefi olan Prens Umberto'nun, [FROM.GetAdjective] halkı için benzer şekilde kararlı bir demirbaş olmasını umuyor. Prens yakında Kral II. Umberto olarak taç giyecek - saltanatı uzun olsun!"
 bba_news.106.t:0 "[GetVittorioDiesEventTitles]"
 bba_news.106.t_emperor:0 "İtalya İmparatoru Ölüyor"
 bba_news.106.t_king:0 "İtalya Kralı Ölüyor"
 bba_news.107.a:0 "Yeni bir Papa yapılacak"
 bba_news.107.b:0 "Tanrı'nın işine akıl sır ermez"
 bba_news.107.desc:0 "Papa XI. Pius, Katolik Kilisesi'ni neredeyse 20 yıl yönettikten sonra vefat etti. Pontifex Maximus olarak görev yaptığı süre boyunca XI. Pius, Papalık ile İtalyan hükûmeti arasındaki uzun süreli kopukluğu sona erdirdi ve Vatikan'ı bir kez daha bağımsız bir devlet olarak kurmada çok önemli bir rol oynadı."
 bba_news.107.t:0 "Papa'nın Ölümü"
 bba_news.108.b:0 "Monarşi modası geçmiş bir şeydir!"
 bba_news.108.d:0 "İtalya'da yeni kurulan hükûmetten diplomatlar, Arnavutluk hükümdarı Kral Zog ile müzakere etmek, iki ülke arasındaki ilişkiyi güçlendirmek ve Zog'u Arnavutluk'ta daha fazla sosyalist politika uygulamaya zorlamak amacıyla gönderildi. \n\nBelki de Arnavut Monarşisinin günlerinin sona erdiğini hissettiği için, ya da belki sadece sosyalizme olan saf nefretinden dolayı, Kral Zog İtalyan yetkililerle konuşmayı reddetti ve Arnavut halkını [ITA.GetNameDef]'den gelen baskıya direnmeye çağırdı. \n\nYine de, yabancı askeri uzmanlar, İtalyan hükûmeti harekete geçerse [ALB.GetNameDef]'in bir işgale direnme şansının çok az olduğu konusunda hemfikir."
 bba_news.109.a:0 "Endişe verici!"
 bba_news.109.b:0 "Harika!"
 bba_news.109.desc:0 "Benzeri görülmemiş bir hamleyle, [FROM.GetName]’in Faşizm Büyük Konseyi iktidarı ele geçirdi ve [?ITA.ITA_var_deposed_leader.GetName]'ı devirerek ev hapsine aldı. Bu eylem, ülkeyi Duce'nin askeri başarısızlıklarından ve beceriksizliğinden kurtarma çabasıyla motive edildi, bu da [FROM.GetName] içinde gerilime neden oldu ve bazıları durumu hafifletmek için adımlar atılmazsa bunun İç Savaşa yol açabileceğinden korkuyor."
 bba_news.109.t:0 "[?ITA.ITA_var_deposed_leader.GetName] Devrildi"
 bba_news.110.a:0 "Gerçekten de rahatsız edici haberler."
 bba_news.110.b:0 "Durumu istikrara kavuşturmalıyız!"
 bba_news.110.c:0 "Bu bize fırsatlar sunuyor!"
 bba_news.110.desc:0 "[FROM.GetName]'ın yeni atanan lideri [FROM.GetLeader], son zamanlarda [FROM.GetAdjective]ları bölen artan gerilimleri ele alamadı. Bu, ülkeyi içeriden parçalayan bir İç Savaşın patlak vermesine neden oldu. Komünistlerden kraliyetçilere ve demokratlara kadar farklı gruplar, iktidar için yarışıyor ve faşistler yönetimlerini sürdürmeye kararlıyken değişen ittifaklar kuruyorlar. \n\nİç Savaşın sonucu hala belirsiz olsa da, dış yardım gelecekteki zaferde kesinlikle büyük bir rol oynayacaktır."
 bba_news.110.t:0 "[FROM.GetName] İç Savaşa Sürükleniyor!"
 bba_news.111.a:0 "Bunun ne kadar süreceğini göreceğiz"
 bba_news.111.desc:0 "[GetAnarchistConfederationEventDesc]"
 bba_news.111.desc_joint_proclamation:0 "[From.GetName] ve [SPC.GetName], Anarşist Konfederasyonunun kurulduğuna dair ortak bir bildiri yayınladılar; burada birbirlerine yardım etme ve yabancı bir güç tarafından saldırıya uğramaları durumunda birbirlerinin yardımına koşma sözü veriyorlar. Ortak bildiri, bu ilanı desteklemek için binlerce anarşistin İtalya'ya akın etmesine neden oldu."
 bba_news.111.desc_single_proclamation:0 "Hükûmetin Anarşist Konfederasyonunun kurulduğunu ilan etmesinden sonra dünyanın dört bir yanından binlerce anarşist [FROM.GetName]'a akın ediyor. Bildirilerinde, kapitalizmi ezmek ve bu kötülüklerin bulunduğu her yerde faşizmi yenmek hakkında kapsamlı açıklamalar yaptılar."
 bba_news.111.t:0 "Anarşist Konfederasyonunun İlanı"
 bba_news.2.a:0 "[ITA.GetLeader] bunu atlatabilecek mi?"
 bba_news.2.desc:0 "\nDikkat çekici bir gelişmeyle, [ITA.GetName] [ETH.GetName] ile bir ateşkesi kabul etti. [ITA.GetAdjective] birlikleri de, elde ettikleri tüm toprak kazanımlarından vazgeçerek [ETH.GetNameDef] ile olan orijinal sınırlarına çekilmeye başladı. [SOV.GetNameDefCap]’in Etiyopya için savaşa girme konusundaki bariz istekliliği, şüphesiz [ITA.GetLeader]’ın çekilme kararında bir rol oynadı. [ITA.GetAdjective] halkının bu aşağılanmaya nasıl tepki vereceği henüz belli değil."
 bba_news.2.t:0 "[ITA.GetName], [ETH.GetNameDefCap] ile Barış Anlaşmasını Kabul Ediyor"
 bba_news.200.a:0 "[GER.GetAdjective]lar savaşmaya devam edecek mi?"
 bba_news.200.b:0 "Demek o piç öldü mü? Onu canlı yakalayamadığımıza yazık!"
 bba_news.200.c:0 "Onun öldüğünden emin olabilir miyiz?"
 bba_news.200.d:0 "Bu hiçbir şeyi değiştirmez. Son adama kadar savaşacağız."
 bba_news.200.desc:0 "[GER.GetAdjective] radyosu, Führer Adolf Hitler'in öldüğü haberini yayınladı. Bu haber, [GER.Capital.GetCapitalVictoryPointName]'daki şiddetli çatışmaların ve müttefik ile [SOV.GetAdjective] kuvvetlerinin [GER.GetAdjective] ana topraklarına yönelik daha geniş çaplı ilerlemesinin ardından geldi. Haber, sözde Führer'in seçilmiş halefi olan ve ulusun Hitler'in kaybından duyduğu üzüntüyü dile getirerek onun, ulusun savunmasını yönettiği bir komuta merkezindeki ölümünü detaylandıran [GER.GetLeader] tarafından duyuruldu. Ne Hitler'in ölümü ne de sözde gerçekleşme biçimi doğrulanabilmiş değil. Ancak, duyurunun [GER.GetAdjective] halkının moralini etkilemesi kaçınılmaz."
 bba_news.200.t:0 "Hitler Öldü"
 bba_news.201.a:0 "Gelecekteki barış için talihsiz bir fedakarlık."
 bba_news.201.b:0 "Müttefiklere güvenilmez."
 bba_news.201.c:0 "Bir daha asla kendimizi Avrupa'dan gelen faşist saldırganlığa karşı savunmasız bırakmayacağız."
 bba_news.201.desc:0 "Savaş sırasında Londra'dan faaliyet gösteren bir [POL.GetAdjective] sürgün hükûmetine rağmen, Müttefikler [SOV.GetAdjective] tarafından yetiştirilen komünistleri [POL.GetName]'ın meşru hükûmeti olarak tanımayı seçti. Diplomatik kaynaklar, Müttefikler ile [SOV.GetName] arasında Avrupa'nın savaş sonrası etki alanlarına bölünmesi konusunda bir anlaşma yapıldığını gösteriyor. Londra'daki [POL.GetAdjective] hükûmeti için maalesef, [SOV.GetAdjective] anlaşmasının önündeki büyük bir engel, [SOV.GetLeader]’ın Polonya'nın [SOV.GetAdjective] etki alanının bir parçası olma arzusuydu.\n\nBirçok kişi bunu [POL.GetName]'a bir ihanet olarak görse de, diğerleri [SOV.GetAdjective] kuvvetlerinin ülkeyi zaten işgal etmesiyle, ültimatomlarını reddetmenin ve Avrupa'nın gelecekteki istikrarını tehlikeye atmanın çok az bir nedeni olduğunu savunuyor."
 bba_news.201.t:0 "[POL.GetAdjective] Hükûmeti [SOV.GetNameDef] ile Hizalanıyor"
 bba_news.3.a:0 "Bu asla sürmez."
 bba_news.3.desc:0 "[ETH.GetName]'daki savaş bir yıpratma savaşına dönerken, [ITA.GetAdjective]lar ateşkes müzakerelerine zorlandı. Çoğu, ülkedeki son komünist ayaklanmanın ardından [ETH.GetAdjective] ordusunun basitçe dağılmasını bekliyordu, ancak [ETH.GetLeader] savaşı tersine çevirmeyi başardı ve ulusun büyük bir bölümünü [ITA.GetAdjective] işgalinden kurtardı. Ancak, Doğu Afrika'nın büyük bir kısmı hala [ITA.GetAdjective] yönetimi altında olduğu için, bu huzursuz barışın sürüp sürmeyeceği belirsiz."
 bba_news.3.t:0 "İtalya-[ETH.GetAdjective] Ateşkes Anlaşması"
 bba_news.4.a:0 "Devrim yayılıyor!"
 bba_news.4.b:0 "Komünist tehdidi ilerliyor."
 bba_news.4.desc:0 "Askeri üyeler ve Kara Aslanlar olarak bilinen anti-faşist örgüt, $ETH_haile_selassie$'nin imparatorluk hükûmetine karşı bir darbe düzenledi. İmparator birlikleri denetlemek üzereyken, onlar tarafından pusuya düşürüldü ve tutuklandı.\n\nBu arada [ROOT.Capital.GetCapitalVictoryPointName]'da, Kara Aslanlar imparatorun konutu da dahil olmak üzere şehrin kilit altyapısını ele geçirdi. Ordu ve polisten birçok sadık kişi küçük çatışmalarda öldürüldü, ancak ulustan geriye kalanlar şimdi komünist eğilimli bir geçici hükûmetin kontrolü altında. \n\n[ITA.GetName] ile olan savaştan bitkin düşen halkın çoğunluğu, yeni hükûmetlerinin otoritesini basitçe kabul etti."
 bba_news.4.t:0 "Etiyopya'da Komünist Darbe"
 bba_news.5.a:0 "Süleyman'ın tek gerçek varisine şan olsun!"
 bba_news.5.b:0 "Bu delilik."
 bba_news.5.desc_does_not_own_454:0 "[ETH.GetLeader], sözde İncil'deki Kral Süleyman'a kadar uzanan kraliyet soyu nedeniyle, [454.GetName]'ın meşru hükümdarı olduğunu ilan etti. Başka bir toprak anlaşmazlığı hayaleti, şüphesiz bölgenin başkentlerinde korkulara yol açacaktır, ancak Etiyopya’nın Süleyman'a özgü yeniden yapılanmasının jeopolitik yansımaları olup olmayacağı henüz belli değil."
 bba_news.5.desc_owns_454:0 "[ETH.GetLeader], sözde İncil'deki Kral Süleyman'a kadar uzanan kraliyet soyu nedeniyle, [454.GetName]'ın meşru hükümdarı olduğunu ilan etti. Etiyopya'nın Süleyman İmparatorluğu olarak yeniden doğuşunu ilan etmeye devam etti. [454.GetName]'ın kontrolünü büyük güçlerden zaten almış olan [ETH.GetLeader], imparatorluğunun başkentini bölgeye taşımayı planlıyor. Etiyopya’nın Süleyman'a özgü yeniden yapılanmasının jeopolitik yansımaları olup olmayacağı henüz belli değil."
 bba_news.5.t:0 "Süleyman İmparatorluğu Kuruldu"
 bba_news.6.a:0 "Jah'a şan olsun!"
 bba_news.6.b:0 "Bu delilik."
 bba_news.6.desc:0 "Gerçekten tuhaf bir gelişmeyle, Etiyopya İmparatoru [ETH.GetLeader], Karayipler'de ‘Rastafaryanizm’ olarak bilinen marjinal bir dini hareketi benimsedi. Belli ki sadece bir imparator olmaktan memnun olmayan [ETH.GetLeader], şimdi Rastafaryanlar tarafından tanrının veya daha spesifik olarak ‘Jah’ın gerçek bedeni olarak tapılıyor. Etiyopya'nın kendisi ‘Siyon İmparatorluğu’ olarak yeniden düzenlendi. Bu dini kargaşanın Etiyopya dış politikasında veya jeopolitik istikrarsızlıkta değişikliklere yol açıp açmayacağı henüz belli değil."
 bba_news.6.t:0 "Siyon İmparatorluğu Kuruldu"
 bba_news.666.a:0 "Kesinlikle beklenmedik"
 bba_news.666.desc:0 "Papa [FROM.GetLeader], [FROM.GetName] kralı [?ITA.ITA_var_deposed_leader.GetName]'ı devirerek ve Tanrı'nın iradesi olduğunu iddia ederek gücü kendisi için üstlenerek dünya liderlerini şok etti. Birçok İtalyan da şok olsa da, Papalık ülkede geniş bir desteğe sahip ve bazıları hükûmetteki bu ani değişimi [FROM.GetNameDefCap] için yeni ve şanlı bir dönemin başlangıcı olarak selamlıyor."
 bba_news.666.t:0 "Papa İktidara Yükseliyor"
 bba_news.7.a:0 "Ne kadar korkunç."
 bba_news.7.b:0 "Kaçınılmaz olana hazırlanmalıyız."
 bba_news.7.c:0 "Bu kaçınılmazdı."
 bba_news.7.desc:0 "[AFA.GetNameDef]'in [ITA.GetAdjective] kuvvetleri tarafından ilhak edilmesinin yakın olabileceğine dair söylentiler dolaşıyor. [ITA.GetAdjective] birliklerinin izole edilmiş ulusun sınırında yığınak yaptığı görüldü ve kaynaklar, [AFA.Capital.GetCapitalVictoryPointName]'da kansız bir teslimiyeti zorlamak için diplomatik olarak baskı yapıldığını gösteriyor. [AFA.GetLeader]'ın [ITA.GetAdjective] baskısına direniip direnemeyeceği henüz belli değil, ancak durum umut verici görünmüyor."
 bba_news.7.t:0 "[ITA.GetName], [AFA.GetNameDef]'i İlhak Etmek İçin Harekete Geçiyor"
 bba_news.8.a:0 "Şaşırtıcı değil, maalesef."
 bba_news.8.b:0 "Bu kuvvetlerimizi daha da gerecek."
 bba_news.8.c:0 "Akıllıca bir seçim yaptılar."
 bba_news.8.desc:0 "Belki de birçokları için şaşırtıcı olmayan bir şekilde, [AFA.GetNameDef] boyun eğme konusundaki [ITA.GetAdjective] taleplerini kabul etti. [AFA.GetAdjective] hükûmeti işgalden kaçınma umudunu sürdürürken, bölgenin sömürgeci güçlerinin yardımlarına gelmeyeceği ve komşu [ETH.GetName]'ın da onları desteklemek için askeri personel ayıramayacağı giderek daha açık hale geldi. Durum bu kadar kasvetliyken, hükûmet halkın gereksiz kan dökülmesinin kurbanı olmasını önlemek için [ITA.GetAdjective] baskısına boyun eğdi. \n\n[ITA.GetAdjective] kuvvetleri şimdi küçük ulusa girerek [ETH.GetNameDef] sınırında yeni pozisyonlar alıyor. İşgalin kalıcı olup olmayacağı veya [ETH.GetName] ile olan daha geniş [ITA.GetAdjective] çatışmasını nasıl etkileyeceği belirsiz."
 bba_news.8.t:0 "[AFA.GetName], [ITA.GetAdjective] Taleplerine Boyun Eğiyor"
