l_english:
 BA_italo_ethiopian_war_events.15.desc_b:0 "Maalesef Milletler Cemiyeti bize yardım etmek için askeri bir güç göndermeyi kabul etmedi. Bunun yerine sadece üye ülkeleri bize yardım etmeye teşvik ettiler, bu da sonunda hiçbir büyük destekle sonuçlanmadı. Sadece bir avuç yeni gönüllü geldi."
 BBA_SWI_annual_election.1.a:0 "[SWI_GetCouncilor1name]'i Seç"
 BBA_SWI_annual_election.1.b:0 "[SWI_GetCouncilor2name]'i Seç"
 BBA_SWI_annual_election.1.c:0 "[SWI_GetCouncilor3name]'i Seç"
 BBA_SWI_annual_election.1.desc:0 "Her yıl, İsviçre Federal Meclisi, konsey üyelerinden birini İsviçre Konfederasyonu Başkanı, yani eşitler arasında birinci olarak seçer. [?ROOT.SWI_confederation_president.GetSheHe], konseyi temsil etmek ve konseydeki herhangi bir eşitliği bozarak konseyi nazikçe güvenlik veya zafere yönlendirmek için [?ROOT.SWI_confederation_president.GetHerHis] sınırlı yetkilerini kullanacaktır.\n\n[SWI_get_extra_election_paragraph]Meclis, bu yıl İsviçre Konfederasyonunun yüzü olması için kimi seçmeli?"
 BBA_SWI_annual_election.1.t:0 "İsviçre Konfederasyonu Başkanı Seçimleri"
 BBA_SWI_annual_election.2.a:0 "[SWI_GetCouncilor1name]'i Seç"
 BBA_SWI_annual_election.2.b:0 "[SWI_GetCouncilor2name]'i Seç"
 BBA_SWI_annual_election.2.c:0 "[SWI_GetCouncilor3name]'i Seç"
 BBA_SWI_annual_election.2.desc:0 "[?SWI_ousted_president.GetName]'ın benzeri görülmemiş bir şekilde görevden alınmasının ve Federal Konsey'de bir siyasi istikrarsızlık döneminin ardından, yeni bir Konfederasyon Başkanı seçme zamanı geldi. Umalım ki [SWI.GetNameDef]'in seyrini düzeltebilirler ve bu pozisyonu elinde tutan son kişi olmazlar."
 BBA_SWI_annual_election.2.t:0 "Konfederasyon Başkanı için acil oylama!"
 BBA_african_union_events.1.a:0 "Üyelik bize fayda sağlayacaktır."
 BBA_african_union_events.1.b:0 "Onların kulübüyle ilgilenmiyoruz."
 BBA_african_union_events.1.desc:0 "Afrika Birliği Teşkilatı, bize üyelik statüsü teklif etme kararı aldı. Teşkilat, Afrika uluslarını ortak çıkar konularında tartışmak ve işbirliği yapmak için bir araya getirmeyi amaçlamaktadır. Eğer katılırsak, üye devletler arasında karşılıklı savunma anlaşmalarına yol açabilir. Ancak, örgütün kurallarına da uymak zorunda kalacağız."
 BBA_african_union_events.1.t:0 "Afrika Birliği Teşkilatı Üyelik Teklif Ediyor"
 BBA_african_union_events.10.a:0 "İşlerimize karışmamalılar."
 BBA_african_union_events.10.desc:0 "[FROM.GetNameDefCap], Afrika Birliği Teşkilatı'nın algısını iyileştirmeye çalışmak için ulusumuzda bir propaganda kampanyası başlattı. Bu şüphesiz, örgüte daha fazla entegrasyonu takip etmemiz için üzerimizde baskı kurmaktır."
 BBA_african_union_events.10.t:0 "[FROM.GetNameDefCap] Afrika Birliği Teşkilatını Tanıtıyor"
 BBA_african_union_events.11.a:0 "Gelecekte daha dikkatli olacağız."
 BBA_african_union_events.11.b:0 "[ETH.GetLeader] tarafından zorbalığa uğramayacağız."
 BBA_african_union_events.11.desc:0 "[FROM.GetNameDefCap], politika hedeflerimizi kendilerininkiyle hizalamaya başlamazsak, hükûmetimizin üyelerini kişisel olarak tehdit etti. Bu şüphesiz, örgüte daha fazla entegrasyonu takip etmemiz için üzerimizde baskı kurmaktır."
 BBA_african_union_events.11.t:0 "[FROM.GetAdjective] Baskısı"
 BBA_african_union_events.12.a:0 "Bu günün geleceğini biliyorduk."
 BBA_african_union_events.12.desc:0 "Afrika Birliği, bizi birliklerine tam olarak entegre etme sürecini başlattı. Umarım bu, halkımız için tarihin daha olumlu bir bölümüne yol açar, ancak Afrika Birliği'nin nihai hedefinin ne olacağı henüz belli değil."
 BBA_african_union_events.12.t:0 "Tam Entegrasyon Süreci Başlıyor"
 BBA_african_union_events.13.a:0 "Aynı Fikirde Olmadığımızı Kabul Ediyoruz"
 BBA_african_union_events.13.desc:0 "[FROM.GetLeader], [FROM.GetNameDef]’in Afrika Birliği Teşkilatı'ndan çekildiğini duyurdu. Örgütün yönü konusundaki endişelerini ve bizi kurulduğu değerlere ihanet etmekle suçladıklarını belirttiler."
 BBA_african_union_events.13.t:0 "[FROM.GetNameDefCap] Afrika Birliği Teşkilatından Ayrılıyor"
 BBA_african_union_events.14.a:0 "Aynı fikirde olmadığımızı kabul ediyoruz."
 BBA_african_union_events.14.b:0 "Bu çok çirkin!"
 BBA_african_union_events.14.desc:0 "[FROM.GetLeader], [FROM.GetNameDef]’in Afrika Birliği Teşkilatı'ndan çekildiğini duyurdu. Örgütün yönü konusundaki endişelerini ve bizi kurulduğu değerlere ihanet etmekle suçladıklarını belirttiler."
 BBA_african_union_events.14.t:0 "[FROM.GetNameDefCap] Afrika Birliği Teşkilatından Ayrılıyor"
 BBA_african_union_events.15.a:0 "Bu çatışmaları önleyecektir."
 BBA_african_union_events.15.b:0 "Böyle bir düzenlemeyle ilgilenmiyoruz."
 BBA_african_union_events.15.desc:0 "Afrika Birliği Teşkilatı, üye devletler arasında bir karşılıklı savunma anlaşması önerdi. Bu, herhangi bir üyeye yapılan bir saldırının tüm üye devletlere yapılmış bir saldırı olarak kabul edileceği anlamına gelir. Bu, umarım yabancı saldırganları örgüt üyelerine saldırmaktan caydırır ve üyeler arasında savaşı önler."
 BBA_african_union_events.15.t:0 "Afrika Birliği Teşkilatı Savunma Anlaşması"
 BBA_african_union_events.16.a:0 "Çok şüpheli."
 BBA_african_union_events.16.desc:0 "[FROM.GetNameDefCap], Afrika Birliği Teşkilatı'nın savunma anlaşmasını reddetti. Bunun, örgüt hakkındaki uzun vadeli tutumlarında bir değişiklik olup olmadığını veya teklifin sadece iç siyaset nedeniyle kötü zamanlanmış olup olmadığını henüz belli değil."
 BBA_african_union_events.16.t:0 "[FROM.GetNameDefCap] Savunma Anlaşmasını Reddediyor"
 BBA_african_union_events.17.a:0 "Mükemmel haber."
 BBA_african_union_events.17.desc:0 "[FROM.GetNameDefCap], Afrika Birliği Teşkilatı’nın savunma paktına katılmayı kabul etti. Artık herhangi bir tarafa saldırı olması durumunda birbirimizi korumakla yükümlüyüz."
 BBA_african_union_events.17.t:0 "[FROM.GetNameDefCap] Savunma Paktına Katılıyor"
 BBA_african_union_events.18.a:0 "Elbette onları savunacağız."
 BBA_african_union_events.18.b:0 "Belki de imzalamak bir hataydı."
 BBA_african_union_events.18.desc:0 "Afrika Birliği Teşkilatı’nın karşılıklı savunma anlaşmasının bir imzacısı saldırıya uğradı. Bir diğer imza sahibi olarak, şimdi onlara askeri olarak yardım etmekle yükümlüyüz. Eğer reddedersek, şüphesiz anlaşmadan çıkarılır ve potansiyel olarak diğer imza sahipleriyle diplomatik ilişkilerimize zarar veririz."
 BBA_african_union_events.18.t:0 "Afrika Birliği Teşkilatı'nın Savunma Anlaşması Devreye Girdi"
 BBA_african_union_events.19.a:0 "Birlikte, muzaffer olacağız."
 BBA_african_union_events.19.desc:0 "[FROM.GetName], Afrika Birliği Teşkilatı’nın karşılıklı savunma anlaşmasının bir diğer imzacısı olarak savunma taahhütlerini yerine getirmeyi kabul etti."
 BBA_african_union_events.19.t:0 "[FROM.GetNameDefCap] Savunmamıza Geliyor"
 BBA_african_union_events.2.a:0 "Birlikte daha güçlüyüz."
 BBA_african_union_events.2.desc:0 "[FROM.GetNameDefCap], Afrika Birliği Teşkilatı için bir üyelik teklifini kabul etti. Umarım bu, uluslarımız arasında daha işbirlikçi bir ilişkinin başlangıcı olur."
 BBA_african_union_events.2.t:0 "[FROM.GetNameDefCap] Afrika Birliği Teşkilatına Katılıyor"
 BBA_african_union_events.20.a:0 "Hepimize ihanet ettiler."
 BBA_african_union_events.20.desc:0 "[FROM.GetName], Afrika Birliği Teşkilatı’nın karşılıklı savunma anlaşmasının diğer imzacısı olmasına rağmen savunma taahhütlerini yerine getirmeyi reddetti. Şimdi onları anlaşmadan çıkarma sürecindeyiz."
 BBA_african_union_events.20.t:0 "[FROM.GetNameDefCap] Savunma Anlaşmasını Bozuyor"
 BBA_african_union_events.21.a:0 "Nihayet karşılığını verdi."
 BBA_african_union_events.21.desc:0 "Ekonomik çıktımız, [ETH_GetCentralBankName]’in yeni para birimine uyum sağlamasıyla son zamanlarda bir darbe aldı. Ancak, üretimimiz ve çıktımız şimdi yeniden artmaya başlıyor, hatta önceki rekorların bile ötesine geçiyor. Ekonomistler, büyümeyi [THIS.GetNameDef] ile paylaşılan para birimini kullanan diğer üyeler arasındaki ticaret engellerinin kaldırılmasına bağlıyor, bu da ekonomilerimizin daha derin bir entegrasyonuna olanak sağladı."
 BBA_african_union_events.21.t:0 "[THIS.GetAdjective] Ekonomik Büyüme"
 BBA_african_union_events.22.a:0 "Bunu sonsuza kadar sürdüremezler."
 BBA_african_union_events.22.desc:0 "[FROM.GetNameDef]'in liderliği, onları korkutma girişimlerimize öfkeyle yanıt verdi. Yakın gelecekte işbirliği yapmaya istekli olmaları pek olası görünmüyor."
 BBA_african_union_events.22.t:0 "[FROM.GetNameDef]'deki Gözdağı Girişimi Başarısız Oldu"
 BBA_african_union_events.23.a:0 "Mükemmel."
 BBA_african_union_events.23.desc:0 "[FROM.GetNameDef]'in liderliği, Afrika Birliği Teşkilatı içindeki politika uyumu konusundaki endişelerimizi hafifletmek için ortak bir çaba gösterdi. Hatta gelecekte herhangi bir aceleci karar vermeden önce büyükelçilerimizle istişare sözü verecek kadar ileri gittiler."
 BBA_african_union_events.23.t:0 "[FROM.GetNameDef]'deki Gözdağı Girişimi Başarılı Oldu"
 BBA_african_union_events.3.a:0 "Ne kadar yazık."
 BBA_african_union_events.3.desc:0 "[FROM.GetNameDefCap], Afrika Birliği Teşkilatı için üyelik teklifimizi reddetti. Bunun sadece iç siyasetten mi kaynaklandığı yoksa Afrika'daki dış politika emellerinin bizimkilerle uyumsuz olduğunun bir işareti mi olduğu henüz belirsiz. Belki gelecekte katılmaya istekli olurlar."
 BBA_african_union_events.3.t:0 "[FROM.GetNameDefCap] Afrika Birliği Teşkilatı Üyeliğini Reddediyor"
 BBA_african_union_events.4.a:0 "Kısa vadeli acı buna değecektir."
 BBA_african_union_events.4.b:0 "Bu ekonomimize zarar verecektir."
 BBA_african_union_events.4.desc:0 "Afrika Birliği Teşkilatı, büyüyen örgüt için bir para birimini yönetme yetkisiyle bir [ETH_GetCentralBankName] oluşturdu. Amaç, tüm üyelerin bir para birimini paylaşması ve ekonomilerimizi birlikte entegre etmeye başlamasıdır. Bu, gelecekte ekonomik faydalar sağlayacaktır, ancak katılmak, insanlar yeni para birimine alıştıkça kısa vadede büyük sorunlara neden olacaktır."
 BBA_african_union_events.4.t:0 "[ETH_GetCentralBankName] Üyeliği"
 BBA_african_union_events.5.a:0 "Kısa görüşlü bir karar."
 BBA_african_union_events.5.desc:0 "[FROM.GetNameDefCap]’in hükûmeti [ETH_GetCentralBankName]'e katılmayı reddetti, bunun yerine öngörülebilir bir gelecek için kendi para birimlerini ve ticaret tarifelerini kontrol etmeyi tercih etti."
 BBA_african_union_events.5.t:0 "[FROM.GetNameDefCap], [ETH_GetCentralBankName] Üyeliğini Reddediyor"
 BBA_african_union_events.6.a:0 "Akıllıca bir karar."
 BBA_african_union_events.6.desc:0 "[FROM.GetNameDefCap], [ETH_GetCentralBankName]'e katılmayı kabul etti ve şimdi para birimlerini bizimkiyle hizalama sürecine başladı. Yakında, uluslarımız arasında ticaret çok daha kolay olacak."
 BBA_african_union_events.6.t:0 "[FROM.GetNameDefCap], [ETH_GetCentralBankName]'e Katılıyor"
 BBA_african_union_events.7.a:0 "Daha derin entegrasyona kararlıyız."
 BBA_african_union_events.7.b:0 "Bunun için imza atmadık."
 BBA_african_union_events.7.desc:0 "Afrika Birliği Teşkilatı, üyelerinin siyasi işlerini yönetmek için bir yürütme konseyi kurdu. Konsey, üye devletlerden temsilcilerden oluşur ve dış ve iç politikayı birleşik bir yönde yönlendirmeye çalışır. Katılmak, diğer üye devletlerle tam siyasi ve ekonomik entegrasyona doğru bir adım olacaktır. Ancak, bu, katılırsak mevcut siyasi bağımsızlığımızın bir kaybını da beraberinde getirecektir."
 BBA_african_union_events.7.t:0 "Afrika Birliği Teşkilatı Yürütme Konseyi"
 BBA_african_union_events.8.a:0 "Tam entegrasyona bir adım daha yakın."
 BBA_african_union_events.8.desc:0 "[FROM.GetNameDef] hükûmeti, Afrika Birliği Teşkilatı'nın yürütme konseyine katılmayı kabul etti. Şimdi tüm yasal konularda konseylerin yetkisini tanıyan uygun antlaşmaları imzalama sürecindeler."
 BBA_african_union_events.8.t:0 "[FROM.GetNameDefCap] Yürütme Konseyine Katılıyor"
 BBA_african_union_events.9.a:0 "Neden üye devletler ki o zaman?"
 BBA_african_union_events.9.desc:0 "[FROM.GetNameDef] hükûmeti, Afrika Birliği Teşkilatı'nın yürütme konseyine katılmayı reddetti. [FROM.GetLeader], egemenlik konusundaki [FROM.GetLeader.GetHerHis] endişelerini ve konsey onayı olmadan örgüt dışındaki uluslarla anlaşmalar yapma arzusunu gerekçe gösteriyor."
 BBA_african_union_events.9.t:0 "[FROM.GetNameDefCap] Yürütme Konseyine Katılmayı Reddediyor"
 BBA_ethiopia_anti_colonialism_events.2.a:0 "Haklılar, bu sömürge çatışmasını şimdi bitirmeliyiz"
 BBA_ethiopia_anti_colonialism_events.2.b:0 "Savaş, [?global.african_revolt_country.GetNameDef] yenildiğinde sona erecektir"
 BBA_ethiopia_anti_colonialism_events.2.desc:0 "[?global.african_supporting_country.GetLeader], [?global.african_supporting_country.GetNameDef] lideri, [?global.african_revolt_country.GetAdjective] isyancılarıyla savaşın derhal sona erdirilmesini talep etti. [?global.african_supporting_country.GetAdjective] diplomatları, [ROOT.GetName]'ı [?global.african_revolt_country.GetNameDef]'nin bağımsızlığını tanımaya teşvik ediyor. Eğer reddedersek [?global.african_supporting_country.GetNameDef]'in savaşa gireceğini açıkça belirtmiyorlar, ancak olasılığı açıkça ima ediyorlar."
 BBA_ethiopia_anti_colonialism_events.2.t:0 "[?global.african_supporting_country.GetNameDef], [?global.african_revolt_country.GetNameDef]'nin Tanınmasını Talep Ediyor"
 BBA_ethiopia_anti_colonialism_events.3.a:0 "Nihayet özgürlük"
 BBA_ethiopia_anti_colonialism_events.3.desc:0 "[?global.african_supporting_country.GetLeader], [?global.african_supporting_country.GetNameDef] lideri, bizim adımıza [?global.african_colonial_country.GetLeader] ile başarılı bir şekilde müzakere etti. [?global.african_colonial_country.GetLeader], [ROOT.GetAdjective] bağımsızlığını tanımayı ve [?global.african_colonial_country.GetNameDef] ile [ROOT.GetNameDef] arasındaki düşmanlıkların sona erdirilmesini emretti. [ROOT.GetNameDefCap], mücadelelerimizde yardımları için [?global.african_supporting_country.GetNameDef]'e her zaman borçlu kalacaktır."
 BBA_ethiopia_anti_colonialism_events.3.t:0 "[?global.african_supporting_country.GetAdjective] Arabuluculuğu Başarılı!"
 BBA_ethiopia_anti_colonialism_events.4.a:0 "En azından denedik"
 BBA_ethiopia_anti_colonialism_events.4.b:0 "O zaman onları zorlamalıyız"
 BBA_ethiopia_anti_colonialism_events.4.desc:0 "Baskımıza rağmen, [?global.african_colonial_country.GetAdjective] hükûmeti [?global.african_revolt_country.GetNameDef]'i tanımayı ve düşmanlıkları durdurmayı reddediyor. [?global.african_colonial_country.GetAdjective], bağımsızlık hareketini yok etmeye kararlı görünüyor. Bu muhtemelen sadece diplomasi ile ulaşabileceğimiz en uzak nokta."
 BBA_ethiopia_anti_colonialism_events.4.t:0 "[FROM.GetNameDefCap], [?global.african_revolt_country.GetAdjective] Bağımsızlığını Tanımayı Reddediyor"
 BBA_ethiopia_anti_colonialism_events.5.a:0 "[ROOT.GetName] ve [?global.african_supporting_country.GetName] kuvvetleri birleşti!"
 BBA_ethiopia_anti_colonialism_events.5.desc:0 "[?global.african_colonial_country.GetNameDef]'e karşı savaşımızda arabuluculuk girişiminde bulunduktan ve başarısız olduktan sonra, [?global.african_supporting_country.GetNameDef], [ROOT.GetAdjective] mücadelesini aktif olarak desteklemeye karar verdi. [?global.african_colonial_country.GetAdjective] büyükelçisine, [?global.african_supporting_country.GetName]'daki [?global.african_supporting_country.GetNameDef]'in, [?global.african_colonial_country.GetNameDef] Afrika ve başka yerlerdeki emperyalist ve sömürgeci hırslarından vazgeçene kadar bu noktadan itibaren [?global.african_colonial_country.GetName] ile savaşta olduğunu düşündüğü bildirildi."
 BBA_ethiopia_anti_colonialism_events.5.t:0 "[FROM.GetName], [?global.african_colonial_country.GetName]'a Karşı Savaşa Katılıyor"
 BBA_ethiopia_anti_colonialism_events.6.a:0 "Emperyalistlerden kurtarılan bir başka ülke"
 BBA_ethiopia_anti_colonialism_events.6.desc:0 "[ROOT.GetName]'dan gelen ağır diplomatik baskının ardından, [ROOT.GetLeader] ile [?global.african_colonial_country.GetLeader] arasındaki doğrudan görüşmeler de dahil olmak üzere, [?global.african_colonial_country.GetAdjective] hükûmeti geri adım atmaya ve [?global.african_revolt_country.GetAdjective] bağımsızlığını tanımaya karar verdi. \nDoğrudan [ROOT.GetAdjective] müdahalesi sayesinde, [?global.african_revolt_country.GetAdjective] bağımsızlık savaşı nihayet sona erdi. [?global.african_revolt_country.GetNameDefCap] özgür bir ülkedir ve [ROOT.GetLeader] kesinlikle [?global.african_revolt_country.GetNameDef]'de sonsuza dek bir kahraman olacaktır."
 BBA_ethiopia_anti_colonialism_events.6.t:0 "[FROM.GetNameDef] için Özgürlük"
 BBA_ethiopia_balance_of_power_events.01.a:0 "Onları yeneceğiz"
 BBA_ethiopia_balance_of_power_events.01.b:0 "Taht taliplisini yok et"
 BBA_ethiopia_balance_of_power_events.01.c:0 "Sınıf hainlerini yok et."
 BBA_ethiopia_balance_of_power_events.01.desc_communism:0 "[THIS.GetName]'ın artan merkezileşmesi, iktidardaki yönetime yönelik yaygın destek eksikliği ve bölgedeki daha geniş istikrarsızlıkla birleşince merkezi hükûmete karşı açık bir isyana dönüştü. Anarşistler, ulusu bizim yönetimimizden kurtaracaklarını ilan ettiler."
 BBA_ethiopia_balance_of_power_events.01.desc_fascism:0 "[THIS.GetName]'ın artan ademi merkeziyetçiliği, iktidardaki yönetime yönelik yaygın destek eksikliği ve bölgedeki daha geniş istikrarsızlıkla birleşince merkezi hükûmete karşı açık bir isyana dönüştü. $haile_selassie_gugsa$ destekçileri, onu [THIS.GetAdjective] tahtına oturtmak amacıyla silahlandı."
 BBA_ethiopia_balance_of_power_events.01.desc_neutrality:0 "[THIS.GetName]'ın artan ademi merkeziyetçiliği, iktidardaki yönetime yönelik yaygın destek eksikliği ve bölgedeki daha geniş istikrarsızlıkla birleşince merkezi hükûmete karşı açık bir isyana dönüştü."
 BBA_ethiopia_balance_of_power_events.01.t:0 "Yönetime Meydan Okundu"
 BBA_ethiopia_balance_of_power_events.10.a:0 "Sanırım bu konuda yapacak bir şey yok"
 BBA_ethiopia_balance_of_power_events.10.b:0 "Onları yok et"
 BBA_ethiopia_balance_of_power_events.10.desc:0 "[THIS.GetNameDef]'in kademeli olarak ademi merkeziyetçileşmesi, şaşırtıcı olmayan bir şekilde merkezi hükûmetin otoritesinin çoğunu kaybetmesine neden oldu. Şimdi çeşitli bölgeler [THIS.GetNameDef]'den bağımsızlıklarını ilan edecek kadar ileri gidiyorlar. Bu bölgelerin kontrolünü yeniden ele geçirmek istiyorsak hızla hareket etmeliyiz."
 BBA_ethiopia_balance_of_power_events.10.t:0 "[ROOT.GetName] dağılıyor"
 BBA_ethiopia_balance_of_power_events.22.a:0 "Köylü güruhu liderlik yapamaz."
 BBA_ethiopia_balance_of_power_events.22.b:0 "Orduda liyakat esastır."
 BBA_ethiopia_balance_of_power_events.22.desc:0 "Son deneyimler, askeri subaylarımızın birçoğunun modern savaşla başa çıkmak için yetersiz donanıma sahip olduğunu göstermiştir. Bu kusurun en olası nedeni, söz konusu kişinin liyakatine değil, kalıtsal veya siyasi unvanlara dayalı olarak askeri rütbeler sunma konusundaki tarihsel eğilimimizdir. [ETH.GetNameDef] genelindeki son reform dalgasıyla, askeri hiyerarşinin geleceği hakkında bir karar verme zamanı geldi."
 BBA_ethiopia_balance_of_power_events.22.t:0 "Askerî Subay Reformları"
 BBA_ethiopia_balance_of_power_events.23.a:0 "Rejim her geçen gün daha da güvenli hale geliyor."
 BBA_ethiopia_balance_of_power_events.23.desc:0 "Son eğitim reformu dalgamız şimdiden başarılı oluyor. Gençler sadece [ETH.GetLeader]'a giderek daha sadık olmakla kalmıyor, aynı zamanda ebeveynlerine de çizgiye uymaları için baskı yapıyor gibi görünüyorlar."
 BBA_ethiopia_balance_of_power_events.23.t:0 "Standartlaştırılmış Eğitim Reformu"
 BBA_ethiopia_balance_of_power_events.24.a:0 "Zaman bizim lehimize."
 BBA_ethiopia_balance_of_power_events.24.desc:0 "Son eğitim reformu dalgamız şimdiden başarılı oluyor. Gençler meşruiyetlerini kanıtlamalarını talep ettikçe, [ETH.GetNameDef]'in eski hiyerarşileri giderek daha fazla sorgulanıyor. Bu, genç ve yaşlı nesiller arasında gerginliklere yol açmış olsa da, tutumların nihayetinde lehimize değişeceği görülüyor."
 BBA_ethiopia_balance_of_power_events.24.t:0 "Eğitim Reformları"
 BBA_ethiopia_balance_of_power_events.25.a:0 "Bu onların kendi iyiliği için."
 BBA_ethiopia_balance_of_power_events.25.desc:0 "[ETH.GetName]'ın siyasi ve ekonomik kontrolünü giderek merkezileştirirken, ordu üzerinde büyük bir endişe devam ediyor. Eğer bize karşı dönerlerse, taleplerine direnme şansımız çok az olur. Bu nedenle, birliklerin onaylanmamış fikirler edinmemesini sağlamak için silahlı kuvvetlere siyasi subaylar sokmaya başladık."
 BBA_ethiopia_balance_of_power_events.25.t:0 "Siyasi Askerî Subaylar"
 BBA_ethiopia_balance_of_power_events.26.a:0 "Orduda liyakat esastır."
 BBA_ethiopia_balance_of_power_events.26.desc:0 "Son deneyimler, askeri subaylarımızın birçoğunun modern savaşla başa çıkmak için yetersiz donanıma sahip olduğunu göstermiştir. Bu kusurun en olası nedeni, söz konusu kişinin liyakatine değil, kalıtsal veya siyasi unvanlara dayalı olarak askeri rütbeler sunma konusundaki tarihsel eğilimimizdir. [ETH.GetName] genelindeki son reform dalgasıyla, bir askeri lider olmada belirleyici faktörün liyakat olmasını sağlamak sadece uygundur."
 BBA_ethiopia_balance_of_power_events.26.t:0 "Orduda Liyakat"
 BBA_ethiopia_balance_of_power_events.30.a:0 "Gerçek bir kahramanın dönüşü"
 BBA_ethiopia_balance_of_power_events.30.desc:0 "Sidamo'nun eski Shum'u ve bir zamanlar [FROM.GetAdjective] ordusunun Dejazmach'ı olan, ülkesi için bir kez daha silahlanmak üzere [FROM.GetLeader]'dan gelen çağrıyı kabul etti. Adwa kahramanı, kişisel mülklerinden acemilerle birlikte geliyor. Umarım bu, [ITA.GetAdjective] işgalini geri püskürtmeye yardımcı olabilir."
 BBA_ethiopia_balance_of_power_events.30.t:0 "$ETH_balcho_safo$ Geri Dönüyor"
 BBA_ethiopia_balance_of_power_events.51.a:0 "Ülkenin alabileceği her türlü yardıma ihtiyacı var"
 BBA_ethiopia_balance_of_power_events.51.b:0 "Özel orduların sayısını artırmamalı, azaltmalıyız"
 BBA_ethiopia_balance_of_power_events.51.desc:0 "[?ROOT.ETH_bop_state.GetName]'daki yerel bir lord, bir birlik kurup imparatorluk ordusuna bağlamayı teklif etti. Adamlar yerel haydutlardan ve yabancı gönüllülerden toplanacak, bu yüzden tam teçhizatlı ve savaşa hazır gelecekler. Şu anda otorite kaybetmek elbette bir risk, ancak daha fazla birlik kazanmak kesinlikle savaşı kazanma şansını artıracaktır."
 BBA_ethiopia_balance_of_power_events.51.t:0 "Yerel Lord Paralı Asker Birliği Kurmayı Teklif Ediyor"
 BBA_ethiopia_balance_of_power_events.52.a:0 "Bunların hepsi iyi"
 BBA_ethiopia_balance_of_power_events.52.b:0 "Bunun durdurulması gerekiyor"
 BBA_ethiopia_balance_of_power_events.52.desc:0 "[?ROOT.ETH_bop_state.GetName]'daki yerel bir lord, güç tabanını genişletmeyi ve etki alanını genişletmeyi planlıyor. Bu, yerel üretim yeteneklerine büyük yatırımlar yaptığı için bir bütün olarak ülkeye bir dereceye kadar faydalı olacaktır. Aynı zamanda, bunu durdurmamak merkezi hükûmetin [?ROOT.ETH_bop_state.GetName] üzerindeki hakimiyetini gevşetir."
 BBA_ethiopia_balance_of_power_events.52.t:0 "Yerel Lord Etki Alanını Genişletmek İstiyor"
 BBA_ethiopia_balance_of_power_events.53.a:0 "Daha fazla tüfek almak şu anda kontrolden daha önemli"
 BBA_ethiopia_balance_of_power_events.53.b:0 "Özel ellerde silah üretimi çok tehlikeli görünüyor"
 BBA_ethiopia_balance_of_power_events.53.desc:0 "[?ROOT.ETH_bop_state.GetName]'daki lordlardan biri, [?ROOT.ETH_bop_state.GetName]'da yerel tüfek ve mühimmat üretimi kurmak için destek istiyor. Bu, silahlı kuvvetlerimizin daha iyi teçhizat almasına ve [ROOT.GetAdjective] ordusunun savaş yeteneklerini geliştirmesine yardımcı olabilir."
 BBA_ethiopia_balance_of_power_events.53.t:0 "Bölgesel Yönetici Silah Üretmek İstiyor"
 BBA_ethiopia_balance_of_power_events.54.a:0 "Bir şeyler yapmalıyız"
 BBA_ethiopia_balance_of_power_events.54.b:0 "Maalesef şu anda yapabileceğimiz pek bir şey yok"
 BBA_ethiopia_balance_of_power_events.54.c:0 "[?ROOT.ETH_bop_state.GetName]'daki yerel makamlar sorunlarla ilgilenmek zorunda kalacak"
 BBA_ethiopia_balance_of_power_events.54.desc:0 "[?ROOT.ETH_bop_state.GetName] halkı yardım için merkezi hükûmete bakıyor. Son olaylar bir malzeme kıtlığı yarattı ve bölge durumu karşılamak için gerçekten bazı yatırımları kullanabilir."
 BBA_ethiopia_balance_of_power_events.54.t:0 "[?ROOT.ETH_bop_state.GetName]'da Malzeme Kıtlığı"
 BBA_ethiopia_balance_of_power_events.55.a:0 "Burada bir örnek oluşturmalıyız"
 BBA_ethiopia_balance_of_power_events.55.b:0 "Merkezi hükûmetin yerel meselelere müdahale etmesi söz konusu değildir."
 BBA_ethiopia_balance_of_power_events.55.desc:0 "[?ROOT.ETH_bop_state.GetName]'ın yerel yöneticilerine karşı birkaç şikayet vakası olmuştur. Halk, aristokrasi tarafından kötü muamele gördüklerini düşünüyor. Konuyla ilgili bir ön soruşturma, şikayetleri için en azından bir dereceye kadar geçerli bir zemin olduğunu gösteriyor. Ancak, merkezi hükûmetin bir müdahalesi diğer soylular tarafından olumlu karşılanmayacaktır."
 BBA_ethiopia_balance_of_power_events.55.t:0 "Yerel Halk Kötü Muameleden Şikayetçi"
 BBA_ethiopia_balance_of_power_events.56.a:0 "Merkezileştirme sürecini daha da ileri götürmek için bu fırsattan yararlanmalıyız"
 BBA_ethiopia_balance_of_power_events.56.b:0 "Bölgeyi daha da geliştirmek için yeniden yatırım yapmak odak noktamız olmalı"
 BBA_ethiopia_balance_of_power_events.56.desc:0 "Merkezi hükûmetin [ROOT.GetName]'ın yönetimini iyileştirmek ve çeşitli bölgeleri entegre etmek için yaptığı çalışmalar [?ROOT.ETH_bop_state.GetName]'da bir ekonomik patlamaya yol açtı. Bölge, ülkenin diğer bölgelerinden göçmen çekiyor ve sanayi genişliyor."
 BBA_ethiopia_balance_of_power_events.56.t:0 "[?ROOT.ETH_bop_state.GetName]'da Ekonomik Patlama"
 BBA_ethiopia_communist_events.01.a:0 "Mücadelelerinde komünist yoldaşlarımızı destekleyeceğiz."
 BBA_ethiopia_communist_events.01.b:0 "Afrika'daki bu sömürgeci karmaşalara ilgi duymuyoruz."
 BBA_ethiopia_communist_events.01.desc:0 "[ETH.GetName] komünist liderliği, İtalyan faşistlerine karşı mücadelelerinde yardım için bize ulaştı. [ETH.Capital.GetCapitalVictoryPointName]'daki yeni rejim hala gücünü pekiştiriyor ve eğer onlara desteğimizi sunarsak dış politika emellerimizle hizalanmaya açık olabilir. Ancak, savaşı tırmandırma riskiyle karşı karşıyayız ve bu süreçte kesinlikle [ITA.GetName]'ı kızdıracağız."
 BBA_ethiopia_communist_events.01.t:0 "[ETH.GetAdjective] Komünistler Yardım Talep Ediyor"
 BBA_ethiopia_communist_events.02.a:0 "Sınıf dayanışması bu kadarmış."
 BBA_ethiopia_communist_events.02.desc:0 "Umutsuz yardım çağrımıza rağmen, [SOV.GetNameDef] bize sırtını döndü. Bu bir gerileme olsa da, faşizm güçlerine direnmeye devam edeceğiz. Şimdi dikkatimizi dünya çapındaki daha geniş anti-faşist ağlardan destek kazanmaya çevirmeliyiz."
 BBA_ethiopia_communist_events.02.t:0 "[SOV.GetName] Yardım Çağrısını Reddediyor"
 BBA_ethiopia_communist_events.03.a:0 "Bu saldırganlık eyleminin bedelini ödeyecekler."
 BBA_ethiopia_communist_events.03.desc:0 "Son günlerde, [ETH.GetAdjective] birliklerinin Rusça konuştuğu ve [SOV.GetAdjective] silahları kullandığına dair rahatsız edici raporlar var. Sadece [SOV.GetName]'ın Afrika'da nüfuz kazanma ve [ITA.GetName]'daki [ITA.GetLeader]'ın hükûmetine olan desteği zayıflatma umuduyla [ETH.GetLeader] için savaşmak üzere 'gönüllüler' gönderdiğini varsayabiliriz."
 BBA_ethiopia_communist_events.03.t:0 "[SOV.GetName], [ETH.GetName]'a Yardım Gönderiyor"
 BBA_ethiopia_communist_events.04.a:0 "Birlikte, Afrika'da faşizmi yeneceğiz."
 BBA_ethiopia_communist_events.04.desc:0 "[SOV.GetName], önümüzdeki aylarda bize maddi yardım göndermeyi ve [SOV.GetAdjective] ordusundan 'gönüllülerin' [ITA.GetName]'a karşı mücadelemizde yanımızda savaşmasına izin vermeyi kabul etti. Bu kesinlikle dengeyi lehimize çevirecektir, ancak [ITA.GetAdjective]'ların [SOV.GetAdjective] birliklerinin onlara karşı savaşmasına nasıl tepki vereceği belirsizdir."
 BBA_ethiopia_communist_events.04.t:0 "[SOV.GetName] Bize Yardım Etmeyi Kabul Ediyor"
 BBA_ethiopia_communist_events.05.a:0 "Halkın desteğini kaybetme riskini göze alamayız. Onu sürgüne gönderin."
 BBA_ethiopia_communist_events.05.b:0 "Halkın tüm düşmanları suçlarının hesabını vermeli. Onu hapsedin."
 BBA_ethiopia_communist_events.05.desc:0 "Bugün, ordu üyeleri ve Kara Aslanlar olarak bilinen anti-faşist örgüt, [ROOT.GetLeader] hükûmetine karşı bir darbe düzenledi. İmparator birlikleri denetlemek üzereyken, bir grup hoşnutsuz asker ona ve subaylarına karşı dönerek onları tutukladı. \n\nBu arada [ROOT.Capital.GetCapitalVictoryPointName]'da, Kara Aslanlar imparatorun konutu da dahil olmak üzere şehrin kilit altyapısını ele geçirdi. Ordu ve polisten birçok sadık kişi küçük çatışmalarda öldürüldü, ancak [ETH.GetName]'dan geriye kalanlar şimdi geçici bir hükûmetin kontrolü altında. [ITA.GetName] ile olan savaştan bitkin düşen halkın çoğunluğu, yeni hükûmetlerinin otoritesini basitçe kabul etti. Şimdi, yeni yönetimin ilk kararı [ROOT.GetLeader]'ın kaderini belirlemektir."
 BBA_ethiopia_communist_events.05.t:0 "[ROOT.GetLeader]'a Karşı Darbe"
 BBA_ethiopia_communist_events.06.a:0 "Hainler hak ettiklerini buldu."
 BBA_ethiopia_communist_events.06.desc:0 "[SOV.GetName] tarafından desteklenen askeri subaylar, geçici [ETH.GetAdjective] hükûmetini feshetti. Subaylar, [SOV.GetAdjective] istihbarat servisinin, [ROOT.GetLeader] liderliğindeki hükûmetin halka ihanet ettiğini kanıtlayan kanıtlar sağladığını iddia ediyorlar. Kanıtlara göre, hükûmet üyeleri, büyük miktarda kişisel servet karşılığında [ITA.GetAdjective] birliklerinin ülkeyi tamamen işgal etmesine izin verme konusunda görüşmelerde bulunuyorlardı. Kara Aslanlar ile çıkan çatışmaların ardından, geçici hükûmetin eski üyelerinin öldüğüne veya tutuklandığına inanılıyor. \n\nOrdu şimdi düzeni yeniden sağlamak ve [ROOT.GetLeader]’ın suç ortaklarını kökünden kazımak için ülkenin liderliğini devraldı. Yeni kurulan askeri idari konseyin ne kadar kalıcı olacağı belirsizliğini koruyor."
 BBA_ethiopia_communist_events.06.indy_desc:0 "Askeri subaylar, geçici [ETH.GetAdjective] hükûmetini feshetti. Subaylar, istihbarat servislerinin, [ROOT.GetLeader] liderliğindeki hükûmetin halka ihanet ettiğini kanıtlayan kanıtlar sağladığını iddia ediyorlar. Kanıtlara göre, hükûmet üyeleri, büyük miktarda kişisel servet karşılığında [ITA.GetAdjective] birliklerinin ülkeyi tamamen işgal etmesine izin verme konusunda görüşmelerde bulunuyorlardı. Kara Aslanlar ile çıkan çatışmaların ardından, geçici hükûmetin eski üyelerinin öldüğüne veya tutuklandığına inanılıyor. \n\nOrdu şimdi düzeni yeniden sağlamak ve [ROOT.GetLeader]’ın suç ortaklarını kökünden kazımak için ülkenin liderliğini devraldı."
 BBA_ethiopia_communist_events.06.t:0 "Geçici Hükûmet Feshedildi"
 BBA_ethiopia_communist_events.07.a:0 "Komünistlerle pazarlık yapmayacağız."
 BBA_ethiopia_communist_events.07.b:0 "Şu anda daha geniş bir çatışma riskini göze alamayız."
 BBA_ethiopia_communist_events.07.desc:0 "[SOV.GetNameDefCap], bizimle [ETH.GetAdjective]'ler arasındaki düşmanlıkların sona erdirilmesini talep etti. [SOV.GetAdjective]'ler, [ETH.Capital.GetCapitalVictoryPointName]'daki komünist rejimi desteklemede büyük rol oynadılar ve şimdi onu kendi etki alanlarının bir parçası olarak görüyorlar. Sovyetler, çatışmaya askeri olarak müdahil olma tehdidinde bulunacak kadar ileri gidiyorlar. Sovyet taleplerini kabul edersek evde aşağılanma riskiyle karşı karşıyayız. Ancak, onları reddedersek çok daha geniş bir çatışma riskiyle karşı karşıyayız."
 BBA_ethiopia_communist_events.07.t:0 "[SOV.GetNameDefCap], [ETH.GetName] ile Savaşın Sona Erdirilmesini Talep Ediyor"
 BBA_ethiopia_communist_events.08.a:0 "Hiçbir teçhizat ayıramayız."
 BBA_ethiopia_communist_events.08.b:0 "Elbette onlara yardım edeceğiz."
 BBA_ethiopia_communist_events.08.desc:0 "[ETH.GetName], İtalya ile olan çatışmalarında yardım etmek için piyade teçhizatı talep etti. Temel teçhizat akışı olmadan, [ETH.GetAdjective] ordusunun birliklerini yeterince silahlandırması pek olası değil. Ancak, onlara teçhizatımızı tedarik etmeyi seçersek, bu kesinlikle [ITA.GetName] ile olan ilişkilerimize daha da zarar verecektir."
 BBA_ethiopia_communist_events.08.t:0 "[ETH.GetName] Piyade Teçhizatı Talep Ediyor"
 BBA_ethiopia_communist_events.09.a:0 "Savaş lehimize dönüyor."
 BBA_ethiopia_communist_events.09.desc:0 "[SOV.GetName], [ITA.GetName]'a karşı mücadelemizde bize yardım etmek için talep edilen piyade teçhizatını gönderdi. Bu kesinlikle faşistlere karşı zafer kazanmamıza yardımcı olacaktır."
 BBA_ethiopia_communist_events.09.t:0 "[SOV.GetNameDefCap] Piyade Teçhizatı Gönderiyor"
 BBA_ethiopia_communist_events.10.a:0 "Bize ihanet ettiler."
 BBA_ethiopia_communist_events.10.desc:0 "[SOV.GetName], bize piyade teçhizatı göndermeyi reddetti. [SOV.capital.GetCapitalVictoryPointName]'a giden heyetimizin tüm çabalarına rağmen, görünüşe göre kendi sorunlarıyla o kadar meşguller ki bize ayıracak hiçbir şeyleri yok."
 BBA_ethiopia_communist_events.10.t:0 "[SOV.GetNameDefCap] Teçhizat Göndermeyi Reddediyor"
 BBA_ethiopia_communist_events.11.a:0 "Bu kaçıramayacağımız bir fırsat."
 BBA_ethiopia_communist_events.11.b:0 "Yabancı güçlerin taktiklerimizi bilmesini riske atamayız."
 BBA_ethiopia_communist_events.11.desc:0 "[ETH.GetNameDefCap]'in yeni liderliği, modern savaşla başa çıkma konusunda ordularının zayıflığını kabul etti. Bu nedenle, ordularını yeniden organize etme konusunda desteğimizi talep ettiler. Bu, subaylarımıza farklı ortamlarda biraz deneyim kazandırmak için harika bir fırsat olurdu, ama aynı zamanda [ETH.GetName] içindeki iç güç dengesini etkileme şansımız da var."
 BBA_ethiopia_communist_events.11.t:0 "[ETH.GetName] Askerî Danışman Talep Ediyor"
 BBA_ethiopia_communist_events.12.a:0 "Mükemmel!"
 BBA_ethiopia_communist_events.12.desc:0 "[SOV.GetName] tarafından vaat edilen teçhizat, askeri depolarımıza ulaştı ve şimdi kuvvetlerimiz arasında dağıtılıyor."
 BBA_ethiopia_communist_events.12.t:0 "[SOV.GetAdjective] Teçhizatı Geliyor"
 BBA_ethiopia_communist_events.14.a:0 "Mükemmel bir teklif."
 BBA_ethiopia_communist_events.14.b:0 "Uçak stokumuzu korumalıyız."
 BBA_ethiopia_communist_events.14.desc:0 "[ETH.GetNameDefCap], kendi hava kuvvetlerinin geliştirilmesi için desteğimizi talep etti. Teklifleri, eski, fazla uçaklarda pilotlarımızın yanında eğitim görmek için gönüllüler göndermeyi içeriyor. Bu, pilotlarımızın biraz daha deneyim kazanması ve teçhizatımızı [ITA.GetAdjective]'lere karşı test etmek için harika bir fırsat olurdu."
 BBA_ethiopia_communist_events.14.t:0 "[ETH.GetNameDefCap] Hava Kuvveti Oluşturmak İçin Yardım Talep Ediyor"
 BBA_ethiopia_communist_events.15.a:0 "Bu çok gecikmişti."
 BBA_ethiopia_communist_events.15.desc:0 "[SOV.GetNameDef]'den generaller bugün [ROOT.Capital.GetCapitalVictoryPointName]'a geldi. Danışmanlara, silahlı kuvvetlerimizin mevcut yapısı ve [ITA.GetName] ile olan savaşın mevcut durumu hakkında bir genel bakış sunuluyor. Umarım kuvvetlerimizi modernize etmeye yardımcı olabilirler."
 BBA_ethiopia_communist_events.15.t:0 "[SOV.GetNameDefCap] Askerî Danışman Gönderiyor"
 BBA_ethiopia_communist_events.16.a:0 "[SOV.GetAdjective]'e güvenilemez."
 BBA_ethiopia_communist_events.16.desc:0 "[SOV.Capital.GetCapitalVictoryPointName]'daki sözde dostlarımız, askeri modernizasyon çabamızda bize yardımcı olmak için askeri danışmanlar göndermeyi reddetti. Bu gerilemeye rağmen, faşistleri yenecek ve modernizasyonumuza tek başımıza devam edeceğiz."
 BBA_ethiopia_communist_events.16.t:0 "[SOV.GetNameDefCap] Askerî Danışman Göndermeyi Reddediyor"
 BBA_ethiopia_communist_events.17.a:0 "Teçhizatımızı test etmek için mükemmel bir fırsat."
 BBA_ethiopia_communist_events.17.b:0 "Daha fazla tırmanma riski almayacağız."
 BBA_ethiopia_communist_events.17.desc:0 "[ETH.GetNameDef]'den bir heyet, bakanlarımızı ve ordumuzu, [ITA.GetName] ile olan savaşlarında onlara yardım etmek için fazla zırhlı araçlarımızı göndermeye teşvik ediyor. [ETH.GetAdjective]'ler, [ITA.GetAdjective] zırhlılarıyla çatışırken açıkça bir dezavantajdalar. Eğer teçhizatımızı gönderirsek, bu kesinlikle [ITA.GetAdjective]’leri geri püskürtmelerine yardımcı olacaktır, ancak bu aynı zamanda [SOV.GetNameDef] ile [ITA.GetName] arasındaki gerilimi de artıracaktır."
 BBA_ethiopia_communist_events.17.t:0 "[ETH.GetNameDefCap], [ITA.GetAdjective] Zırhlılarına Karşı Destek Talep Ediyor"
 BBA_ethiopia_communist_events.18.a:0 "Başka bir yol bulmalıyız."
 BBA_ethiopia_communist_events.18.desc:0 "[SOV.GetNameDefCap], [ITA.GetAdjective]'lere karşı koymak için bize zırhlı araç göndermeyi reddetti. Görünüşe göre [SOV.GetAdjective]’ler, kendileri ile [ITA.GetAdjective]'ler arasındaki gerilimi tırmandırmaktan endişe ediyorlar."
 BBA_ethiopia_communist_events.18.t:0 "[SOV.GetNameDefCap] Zırhlı Araç Göndermeyi Reddediyor"
 BBA_ethiopia_communist_events.19.a:0 "Mükemmel!"
 BBA_ethiopia_communist_events.19.desc:0 "[SOV.GetNameDefCap], [ITA.GetAdjective]'lere karşı mücadelemizde bize yardım etmek için zırhlı araçlar gönderdi. En yeni tasarımları olmasa da, araçlar şüphesiz cephe hatlarında değerli olacaktır, sadece morali artırmak için bile olsa."
 BBA_ethiopia_communist_events.19.t:0 "[SOV.GetNameDefCap] Zırhlı Araçlar Gönderiyor"
 BBA_ethiopia_communist_events.20.a:0 "Elbette halledebiliriz."
 BBA_ethiopia_communist_events.20.desc:0 "[SOV.GetNameDefCap], pilotlarımızı eğitme teklifini reddetti. Bunun hava kuvvetlerimizin genişlemesini hızlandıracağı umuluyordu, ancak görünüşe göre sovyetlerin şu anda başka öncelikleri var. Ancak, kendi uçağımızı üretmek için tasarımlar verildi."
 BBA_ethiopia_communist_events.20.t:0 "[SOV.GetNameDefCap] Pilot Eğitmeyi Reddediyor"
 BBA_ethiopia_communist_events.21.a:0 "[SOV.GetAdjective] yoldaşlarımıza minnettarız!"
 BBA_ethiopia_communist_events.21.desc:0 "[SOV.GetName]'daki yoldaşlarımız, pilotların eğitiminde bize yardım etmeyi kabul etti. Ayrıca cömertçe kullanmamız için bir dizi uçak sağladılar. Bu, [ITA.GetAdjective]'lere karşı koyabilecek bir hava kuvveti yaratma planlarımızı hızla hızlandıracaktır."
 BBA_ethiopia_communist_events.21.t:0 "[SOV.GetNameDefCap] Pilot Eğitmeyi Kabul Ediyor"
 BBA_ethiopia_communist_events.22.a:0 "Bunun için pişman olacaklar."
 BBA_ethiopia_communist_events.22.b:0 "Savaşa hazır değiliz."
 BBA_ethiopia_communist_events.22.desc:0 "[ITA.GetAdjective]'ler şimdiye kadar [ETH.GetName]'a karşı savaşlarını sona erdirme taleplerimizi görmezden geldiler. Anladıkları tek dilin kaba kuvvet olduğu açıkça ortaya çıktı. Mevcut rotamızda devam edersek, [SOV.GetName] ile [ITA.GetName] arasında savaş kaçınılmaz olacaktır. Eğer şimdi geri çekilirsek, [ETH.GetName]'ı destekleyerek kazandığımız her şeyi ve dünya sahnesindeki diplomatik ağırlığımızı nihayetinde kaybedeceğiz."
 BBA_ethiopia_communist_events.22.t:0 "[ITA.GetNameDefCap], [ETH.GetNameDefCap] ile Savaşı Sona Erdirmeyi Reddediyor"
 BBA_ethiopia_communist_events.23.a:0 "[ITA.GetName] için bir Zafer!"
 BBA_ethiopia_communist_events.23.desc:0 "Sovyetler Birliği, son savaş söylemlerinden geri adım attı ve Etiyopya'daki eylemlerimize yönelik sert ifadeli itirazlarına geri döndü. Görünüşe göre savaşa girme tehditleri bir blöften başka bir şey değilmiş."
 BBA_ethiopia_communist_events.23.t:0 "[SOV.GetNameDefCap] Geri Adım Atıyor"
 BBA_ethiopia_communist_events.24.a:0 "Bu gerekli. Şimdilik."
 BBA_ethiopia_communist_events.24.desc:0 "[ITA.GetName] ile [SOV.GetNameDef] arasındaki diplomatik çatışma artık açık bir çatışmaya dönüştü. [SOV.GetAdjective]lar bağımsızlığımızı garanti altına aldı ve şimdi [ITA.GetAdjective]ları püskürtmek için savaş alanında bize yardım edecekler. Ancak, bunun bağımsızlığımızın bedeli olacağı anlaşılıyor. Bundan sonra, dış politikamızın [SOV.Capital.GetCapitalVictoryPointName]'ınkiyle tam olarak uyumlu olduğundan emin olmamız gerekecek."
 BBA_ethiopia_communist_events.24.t:0 "[SOV.GetNameDefCap] Dış Politikanın Kontrolünü Ele Alıyor"
 BBA_ethiopia_communist_events.25.a:0 "Bu savaşı bitirmelerine yardım edeceğiz."
 BBA_ethiopia_communist_events.25.b:0 "Onlara yardım edeceğiz. Bir bedel karşılığında."
 BBA_ethiopia_communist_events.25.c:0 "Bu çok riskli."
 BBA_ethiopia_communist_events.25.desc:0 "[ETH.GetNameDefCap], onlarla [ITA.GetAdjective]lar arasında arabuluculuk yapabileceğimiz umuduyla bize ulaştı. [ITA.GetAdjective]lar, Milletler Cemiyeti'nin sert ifadeli itirazlarından etkilenmedi, bu nedenle bizden herhangi bir arabuluculuk muhtemelen güç tehdidi gerektirecektir. [ETH.GetNameDef] uğruna ne kadar risk almaya istekli olduğumuzu dikkatlice düşünmeliyiz."
 BBA_ethiopia_communist_events.25.t:0 "[ETH.GetNameDefCap] Arabuluculuk Talep Ediyor"
 BBA_ethiopia_communist_events.26.a:0 "Bizi [ITA.GetAdjective]ları yıpratmak için kullanıyorlar"
 BBA_ethiopia_communist_events.26.desc:0 "[SOV.GetNameDefCap], bizimle [ITA.GetAdjective]lar arasında arabuluculuk yapma olasılığını eledi. [ITA.GetName]’ın Milletler Cemiyeti'ni dinlemeye isteksizliğini ve bu nedenle güç kullanma tehdidinde bulunmak zorunda kalacaklarını belirtiyorlar. İki ülke arasında savaşın tırmanma riski, [SOV.GetLeader] tarafından çok tehlikeli olarak değerlendirildi."
 BBA_ethiopia_communist_events.26.t:0 "[SOV.GetNameDefCap] Çatışmada Arabuluculuk Yapmayı Reddediyor"
 BBA_ethiopia_communist_events.27.a:0 "Bize ihanet ettiler."
 BBA_ethiopia_communist_events.27.desc:0 "[SOV.GetNameDefCap], [ITA.GetName]’in saldırganlık savaşını sona erdirme taahhüdünden geri adım attı. Görünüşe göre savaşa girme istekleri bir blöften başka bir şey değilmiş. Şimdi bu savaşı kendi başımıza sona erdirme gibi zor bir görevle karşı karşıyayız."
 BBA_ethiopia_communist_events.27.t:0 "[SOV.GetNameDefCap], [ITA.GetAdjective] Saldırganlığını Durdurmada Başarısız Oldu"
 BBA_ethiopia_communist_events.28.a:0 "Buna izin vermeliyiz. Şimdilik."
 BBA_ethiopia_communist_events.28.desc:0 "[ITA.GetName] ile [SOV.GetNameDef] arasındaki diplomatik çatışma, [ITA.GetAdjective]ların bize karşı savaşlarını sona erdirmeyi kabul etmesiyle şimdi yatıştı. [SOV.GetAdjective]lar bağımsızlığımızı garanti altına aldı ve bize yönelik bir saldırıyı kendilerine yapılmış bir saldırı olarak gördüklerini açıkça belirttiler. Ancak, bu savaşı sona erdirmemize yardım etmelerinin bedeli bağımsızlığımız gibi görünüyor. Bundan sonra, dış politikamızın [SOV.Capital.GetCapitalVictoryPointName]'ınkiyle tam olarak uyumlu olduğundan emin olmamız gerekecek."
 BBA_ethiopia_communist_events.28.t:0 "[SOV.GetNameDefCap] Dış Politika Uyumunu Talep Ediyor"
 BBA_ethiopia_communist_events.29.a:0 "Sonsuza dek minnettarız."
 BBA_ethiopia_communist_events.29.desc:0 "[ITA.GetName] ile [SOV.GetNameDef] arasındaki diplomatik çatışma, [ITA.GetAdjective]ların bize karşı savaşlarını sona erdirmeyi kabul etmesiyle şimdi yatıştı. Bu, faşizme karşı büyük bir zaferdir, ancak mücadelenin sonu olması pek olası değildir. Umarım [SOV.Capital.GetCapitalVictoryPointName]'daki dostlarımızla işbirliği yapmaya devam edebiliriz."
 BBA_ethiopia_communist_events.29.t:0 "[SOV.GetNameDefCap] Çatışmada Arabuluculukta Başarılı Oldu"
 BBA_ethiopia_communist_events.30.a:0 "Savaşı durduracağız. Şimdilik."
 BBA_ethiopia_communist_events.30.b:0 "Zafer avucumuzun içinde, şimdi durmayacağız."
 BBA_ethiopia_communist_events.30.desc:0 "[ETH.GetNameDefCap]'den temsilciler, onlarla olan mevcut çatışmamızda bir ateşkes talep ettiler. Savaş umduğumuz kadar hızlı sona ermedi ve bu bize bölgedeki konumumuzu güçlendirme veya diğer acil sorunlarla başa çıkma fırsatı verecektir."
 BBA_ethiopia_communist_events.30.t:0 "[ETH.GetNameDefCap] Ateşkes Talep Ediyor"
 BBA_ethiopia_communist_events.31.a:0 "Nihayet, kan dökülmesine bir son."
 BBA_ethiopia_communist_events.31.desc:0 "[ITA.GetAdjective]lar mevcut çatışmamızda bir ateşkese razı oldular. Umarım bu bize uluslarımız arasında kalıcı bir barış inşa etme fırsatı verir. Ancak, çatışma her an yeniden patlak verebileceği için tetikte olmalıyız."
 BBA_ethiopia_communist_events.31.t:0 "[ITA.GetNameDefCap] Ateşkesi Kabul Ediyor"
 BBA_ethiopia_communist_events.32.a:0 "Onlara acı çektirmeye devam edeceğiz."
 BBA_ethiopia_communist_events.32.desc:0 "[ITA.GetAdjective]lar ateşkese katılmayı reddetti. Görünüşe göre [ETH.GetNameDefCap]'in tamamen yok edilmesine niyetliler. Halk artık faşistlerle mantık yürütülemeyeceğini ve özgürlüğümüzün herkesin çabalarını ikiye katlamasına bağlı olduğunu bilecek."
 BBA_ethiopia_communist_events.32.t:0 "[ITA.GetNameDefCap] Ateşkes Teklifini Reddediyor"
 BBA_ethiopia_communist_events.33.a:0 "Herkes için özgürlük!"
 BBA_ethiopia_communist_events.33.b:0 "Bu çok riskli."
 BBA_ethiopia_communist_events.33.desc:0 "[ITA.GetAdjective]'lerle olan çatışmamız sırasında, Eritre'yi faşistlerden kurtarmayı başardık. Şimdi bölge halkına bağımsızlık verme fırsatımız var. Ancak, [ITA.GetAdjective]'ler şüphesiz bu hareketten rahatsız olacak ve bu kırılgan barışımızı istikrarsızlaştırabilir."
 BBA_ethiopia_communist_events.33.t:0 "Eritre Bağımsızlığı"
 BBA_ethiopia_communist_events.34.a:0 "Herkes için özgürlük!"
 BBA_ethiopia_communist_events.34.b:0 "Bu çok riskli"
 BBA_ethiopia_communist_events.34.desc:0 "[ITA.GetAdjective]'lerle olan çatışmamız sırasında, Somali'yi faşistlerden kurtarmayı başardık. Şimdi bölge halkına bağımsızlık verme fırsatımız var. Ancak, [ITA.GetAdjective]'ler şüphesiz bu hareketten rahatsız olacak ve bu kırılgan barışımızı istikrarsızlaştırabilir."
 BBA_ethiopia_communist_events.34.t:0 "Somali Bağımsızlığı"
 BBA_ethiopia_communist_events.35.a:0 "Afrika halkının yanındayız."
 BBA_ethiopia_communist_events.35.b:0 "Bize ders vermeye hakları yok."
 BBA_ethiopia_communist_events.35.desc:0 "İç savaşta bize yardım ettikten sonra, [ETH.GetNameDef]'den temsilciler şimdi sömürgesizleştirme sürecini başlatmamızı talep ettiler. İç savaşta savaştığımız değerlere sadık kalırsak, Afrika halkının kendi kaderini tayin hakkını desteklememiz gerektiğini belirtiyorlar. [ETH.GetLeader], kuzey Fas'ta bağımsız bir Rif Cumhuriyeti kurmak için birlikte çalışmayı teklif etti."
 BBA_ethiopia_communist_events.35.t:0 "[ETH.GetNameDefCap] Afrika'dan Çekilme Talep Ediyor"
 BBA_ethiopia_communist_events.36.a:0 "Onları desteklemek karşılığını verdi."
 BBA_ethiopia_communist_events.36.desc:0 "[SPC.GetNameDefCap], kuzey Fas'ta bağımsız bir Rif Cumhuriyeti kurma teklifimizi kabul etti. Bu, Afrika ve daha geniş dünyadaki bağımsızlık mücadelesinde olumlu bir adımdır."
 BBA_ethiopia_communist_events.36.t:0 "[SPC.GetNameDefCap] Rif'i Kurtarmayı Kabul Ediyor"
 BBA_ethiopia_communist_events.37.a:0 "O zaman onları zorla kurtaracağız."
 BBA_ethiopia_communist_events.37.b:0 "Konuyu zorlamamalıyız."
 BBA_ethiopia_communist_events.37.desc:0 "[SPC.GetNameDefCap], Afrika'da toprak kaybetmeleri gerektiği yönündeki önerimize öfkeyle yanıt verdi. Görünüşe göre karşı çıktıkları faşistlerden veya emperyalistlerden daha iyi olmadıklarını gösterdiler."
 BBA_ethiopia_communist_events.37.t:0 "[SPC.GetNameDefCap] Sömürgesizleştirme Teklifini Reddediyor"
 BBA_ethiopia_communist_events.38.a:0 "Teşekkürler, yoldaşlar."
 BBA_ethiopia_communist_events.38.desc:0 "Yakın zamanda anavatanlarında faşizme karşı savaştıktan sonra, [ETH.GetNameDef]'den gönüllüler mücadelemizde bize yardım etmek için İspanya'ya geldi. [ETH.GetLeader], davamıza [ETH.GetLeader.GetHerHis] desteğini taahhüt etti ve önümüzdeki aylarda maddi yardım sözü verdi."
 BBA_ethiopia_communist_events.38.t:0 "[ETH.GetNameDefCap] Destek Teklif Ediyor"
 BBA_ethiopia_communist_events.39.a:0 "Hedeflerimize ulaştık."
 BBA_ethiopia_communist_events.39.b:0 "Artık bir tehdit olmadıklarından emin olacağız."
 BBA_ethiopia_communist_events.39.desc:0 "Rif bölgesinin [SPC.GetNameDef]'den kurtarılmasıyla, onları barış görüşmelerine zorlama fırsatımız var. Sömürgesizleştirme konusunda güvenimizi boşa çıkardıktan sonra, alternatif olarak savaşı [SPC.GetNameDef]'in kendisine taşıyabiliriz."
 BBA_ethiopia_communist_events.39.t:0 "Rif Kurtarıldı"
 BBA_ethiopia_communist_events.40.a:0 "Başka seçeneğimiz yok."
 BBA_ethiopia_communist_events.40.desc:0 "Afrika'daki toprağımızın kontrolünü sürdürmede başarısız olduk. [ETH.GetName] hükûmeti, hedeflerine ulaştıktan sonra, aramızda barış müzakeresi yapma umuduyla bize ulaştı."
 BBA_ethiopia_communist_events.40.t:0 "[ETH.GetNameDefCap] Düşmanlıkların Sona Erdirilmesini Talep Ediyor"
 BBA_ethiopia_communist_events.41.a:0 "Onlar için bunca şeyden sonra."
 BBA_ethiopia_communist_events.41.desc:0 "[ETH.GetNameDefCap], tüm askeri danışmanlarımızın ülkeyi derhal terk etmesi gerektiğini bize bildirdi. Görünüşe göre [ETH.GetLeader], ülkeyi daha bağımsız bir yöne götürmeyi planlıyor. Eğer yakında harekete geçmezsek, [ETH.Capital.GetCapitalVictoryPointName]'daki rejimin kontrolünü kaybedebiliriz."
 BBA_ethiopia_communist_events.41.t:0 "[ETH.GetNameDefCap] Danışmanların Çekilmesini Talep Ediyor"
 BBA_ethiopia_communist_events.46.a:0 "Topraklarımızı teslim etmeyeceğiz."
 BBA_ethiopia_communist_events.46.b:0 "Kabul etmekten başka seçeneğimiz yok."
 BBA_ethiopia_communist_events.46.desc:0 "[ETH.GetAdjective] diplomatları bize bir barış teklifiyle yaklaştı. Teklif, bu çatışma sırasında [ETH.GetNameDef]'e kaybettiğimiz [SUD.GetAdjective] toprağı üzerindeki iddialarımızdan vazgeçmeyi kabul etmemize bağlı. Diplomatlar ayrıca bölgede bir [SUD.GetAdjective] hükûmeti kurulacağını belirtiyorlar. Hükûmetin bağımsızlığı henüz belli değil."
 BBA_ethiopia_communist_events.46.t:0 "[ETH.GetNameDefCap] Barış Teklif Ediyor"
 BBA_ethiopia_communist_events.47.a:0 "Topraklarımızı teslim etmeyeceğiz."
 BBA_ethiopia_communist_events.47.b:0 "Kabul etmekten başka seçeneğimiz yok."
 BBA_ethiopia_communist_events.47.desc:0 "[ETH.GetAdjective] diplomatları bize bir barış teklifiyle yaklaştı. Teklif, bu çatışma sırasında [ETH.GetNameDef]'e kaybettiğimiz [DJI.GetAdjective] toprağı üzerindeki iddialarımızdan vazgeçmeyi kabul etmemize bağlı. Diplomatlar ayrıca bölgede bir [DJI.GetAdjective] hükûmeti kurulacağını belirtiyorlar. Hükûmetin bağımsızlığı henüz belli değil."
 BBA_ethiopia_communist_events.47.t:0 "[ETH.GetNameDefCap] Barış Teklif Ediyor"
 BBA_ethiopia_communist_events.48.a:0 "Topraklarımızı teslim etmeyeceğiz."
 BBA_ethiopia_communist_events.48.b:0 "Kabul etmekten başka seçeneğimiz yok."
 BBA_ethiopia_communist_events.48.desc:0 "[ETH.GetAdjective] diplomatları bize bir barış teklifiyle yaklaştı. Teklif, bu çatışma sırasında [ETH.GetNameDef]'e kaybettiğimiz [ERI.GetAdjective] toprağı üzerindeki iddialarımızdan vazgeçmeyi kabul etmemize bağlı. Diplomatlar ayrıca bölgede bir [ERI.GetAdjective] hükûmeti kurulacağını belirtiyorlar. Hükûmetin bağımsızlığı henüz belli değil."
 BBA_ethiopia_communist_events.48.t:0 "[ETH.GetNameDefCap] Barış Teklif Ediyor"
 BBA_ethiopia_communist_events.49.a:0 "Topraklarımızı teslim etmeyeceğiz."
 BBA_ethiopia_communist_events.49.b:0 "Kabul etmekten başka seçeneğimiz yok."
 BBA_ethiopia_communist_events.49.desc:0 "[ETH.GetAdjective] diplomatları bize bir barış teklifiyle yaklaştı. Teklif, bu çatışma sırasında [ETH.GetNameDef]'e kaybettiğimiz [KEN.GetAdjective] toprağı üzerindeki iddialarımızdan vazgeçmeyi kabul etmemize bağlı. Diplomatlar ayrıca bölgede bir [KEN.GetAdjective] hükûmeti kurulacağını belirtiyorlar. Hükûmetin bağımsızlığı henüz belli değil."
 BBA_ethiopia_communist_events.49.t:0 "[ETH.GetNameDefCap] Barış Teklif Ediyor"
 BBA_ethiopia_communist_events.50.a:0 "Topraklarımızı teslim etmeyeceğiz."
 BBA_ethiopia_communist_events.50.b:0 "Kabul etmekten başka seçeneğimiz yok."
 BBA_ethiopia_communist_events.50.desc:0 "[ETH.GetAdjective] diplomatları bize bir barış teklifiyle yaklaştı. Teklif, bu çatışma sırasında [ETH.GetNameDef]'e kaybettiğimiz [SOM.GetAdjective] toprağı üzerindeki iddialarımızdan vazgeçmeyi kabul etmemize bağlı. Diplomatlar ayrıca bölgede bir [SOM.GetAdjective] hükûmeti kurulacağını belirtiyorlar. Hükûmetin bağımsızlığı henüz belli değil."
 BBA_ethiopia_communist_events.50.t:0 "[ETH.GetNameDefCap] Barış Teklif Ediyor"
 BBA_ethiopia_communist_events.51.a:0 "Topraklarımızı teslim etmeyeceğiz."
 BBA_ethiopia_communist_events.51.b:0 "Kabul etmekten başka seçeneğimiz yok."
 BBA_ethiopia_communist_events.51.desc:0 "[ETH.GetAdjective] diplomatları bize bir barış teklifiyle yaklaştı. Teklif, bu çatışma sırasında [ETH.GetNameDef]'e kaybettiğimiz [UGA.GetAdjective] toprağı üzerindeki iddialarımızdan vazgeçmeyi kabul etmemize bağlı. Diplomatlar ayrıca bölgede bir [UGA.GetAdjective] hükûmeti kurulacağını belirtiyorlar. Hükûmetin bağımsızlığı henüz belli değil."
 BBA_ethiopia_communist_events.51.t:0 "[ETH.GetNameDefCap] Barış Teklif Ediyor"
 BBA_ethiopia_communist_events.52.a:0 "Uğraşacak daha önemli işlerimiz var."
 BBA_ethiopia_communist_events.52.b:0 "Onlara hatalarını öğreteceğiz."
 BBA_ethiopia_communist_events.52.desc:0 "[ETH.GetAdjective] yönetimi, ulusların işleri üzerindeki hakimiyetimizi kırmak için bir operasyon düzenledi. [ETH.Capital.GetCapitalVictoryPointName] genelindeki [SOV.GetAdjective] personeli, [ETH.GetAdjective] birlikleri tarafından geçici gözaltı merkezlerine götürüldü, [ETH.Getleader] büyükelçimize [ETH.GetLeader.GetSheHe]'nin ileriye dönük olarak [ETH.GetAdjective] işlerinin tam kontrolünü alacağını bildirmeden önce. Eğer hızlı hareket edersek, durumun kontrolünü yeniden ele geçirebiliriz. Ancak, böyle bir eylem için fırsat penceresi hızla daralıyor."
 BBA_ethiopia_communist_events.52.t:0 "[ETH.GetNameDefCap], [SOV.GetNameDef] ile bağlarını koparıyor"
 BBA_ethiopia_communist_events.53.a:0 "Hiç yoktan iyidir."
 BBA_ethiopia_communist_events.53.desc:0 "Hayal kırıklığı yaratan bir gelişmeyle, [SOV.GetAdjective] diplomatları bize şu anda herhangi bir askeri personel ayıramayacaklarını bildirdi. Kendi sınırlarına daha yakın güvenlik endişelerini öncelikli olarak gösteriyorlar. Ancak, iyi niyet göstergesi olarak, bize bir piyade teçhizatı sevkiyatı gönderdiler."
 BBA_ethiopia_communist_events.53.t:0 "[SOV.GetNameDefCap] Danışman Göndermeyi Reddediyor"
 BBA_ethiopia_communist_events.54.a:0 "Teşekkürlerimiz sizinle, yoldaşlar!"
 BBA_ethiopia_communist_events.54.desc:0 "Mücadelemize katılan [JAP.GetAdjective] gönüllülerinin son akınıyla birlikte, [JAP.Capital.GetCapitalVictoryPointName]'daki hükûmetin piyade teçhizatı şeklinde maddi yardım gönderme sürecinde olduğu konusunda bilgilendirildik. Teçhizat akını devrime büyük bir destek olacaktır. Ancak, [JAP.GetAdjective] hükûmeti, diğer büyük güçlerden diplomatik yansımalardan kaçınmak için teçhizatın kökeni hakkında sessiz kalmamızı istiyor."
 BBA_ethiopia_communist_events.54.t:0 "[JAP.GetNameDef]'den gizli yardım"
 BBA_ethiopia_communist_events.55.a:0 "Peki, bu sorun kendi kendini çözdü."
 BBA_ethiopia_communist_events.55.b:0 "Bu hainler derhal [JAP.GetName]'a iade edilmelidir!"
 BBA_ethiopia_communist_events.55.desc:0 "Kempeitai, bir dizi yıkıcının Doğu Afrika'ya giden kargo gemilerinde imparatorluk yargı yetkisinden kaçtığını bildiriyor. Söylentiye göre aralarında $IA_sakutaro_iwasa$ ve $IA_sanshiro_ishikawa$ da vardı. Muhtemelen [ETH.GetNameDef]'deki devrimci harekete katılmayı planlıyorlar."
 BBA_ethiopia_communist_events.55.t:0 "[JAP.GetAdjective] yıkıcıları İmparatorluktan kaçıyor"
 BBA_ethiopia_communist_events.56.a:0 "Ganbare, yoldaşlar!"
 BBA_ethiopia_communist_events.56.b:0 "[ETH.GetNameDef]'nin mücadelesini desteklemek için belki daha fazlasını yapabiliriz..."
 BBA_ethiopia_communist_events.56.desc:0 "İstihbarat servisleri, oradaki devrimci hareketlere yardım edebilmeleri için bir dizi gönüllünün Doğu Afrika'ya güvenli geçişini sağlamada yardımcı olduklarını bize bildirdi. Gönüllüler arasında $IA_sakutaro_iwasa$ ve $IA_sanshiro_ishikawa$ da vardı."
 BBA_ethiopia_communist_events.56.t:0 "[JAP.GetAdjective] gönüllüleri Doğu Afrika'ya gidiyor"
 BBA_ethiopia_communist_events.57.a:0 "Gerici tehditlere boyun eğmeyeceğiz. Ve imparatorları hakkında..."
 BBA_ethiopia_communist_events.57.desc:0 "[JAP.GetName] hükûmetinden, devrimci hareketimize katılma niyetiyle ülkeye gelen herhangi bir [JAP.GetAdjective] tebaasının iadesini talep eden resmi bir talep aldık. Ne yapmayı planladıkları belli olmasa da, talep, talebe uymamanın sonuçları olacağını açıkça belirtiyor."
 BBA_ethiopia_communist_events.57.t:0 "[JAP.GetNameDefCap], $IA_sakutaro_iwasa$ ve $IA_sanshiro_ishikawa$'nın iadesini talep ediyor"
 BBA_ethiopia_communist_events.58.a:0 "Miraslarını yok eden aptallardan başka ne bekleyebiliriz."
 BBA_ethiopia_communist_events.58.b:0 "Böyle hakaretlere katlanmayacağız!"
 BBA_ethiopia_communist_events.58.desc:0 "Beklendiği gibi, [ETH.GetNameDef]'i yöneten devrimci güruh, ülkeye gelen [JAP.GetAdjective] muhaliflerini iade etmeyi reddetti. En kaba diplomatik protokol eksikliğiyle, cevapları aynı zamanda şanlı imparatorumuza yönelik bir dizi tehdit içeriyordu!"
 BBA_ethiopia_communist_events.58.t:0 "[ETH.GetNameDef]–[JAP.GetName] İlişkileri Mahvoldu"
 BBA_ethiopia_communist_events.59.a:0 "Zaten onların ticaretine ihtiyacımız yok."
 BBA_ethiopia_communist_events.59.desc:0 "Görünüşe göre [JAP.GetAdjective] taleplerini son reddimiz, hükûmetleriyle bir sinire dokunmuş. Doğu Afrika bölgesindeki ‘zararlı ideolojik faaliyet’ olarak adlandırdıkları şey nedeniyle öngörülebilir bir gelecek için bize ambargo uygulamayı planladıklarını duyurdular."
 BBA_ethiopia_communist_events.59.t:0 "[JAP.GetAdjective] Ambargosu"
 BBA_ethiopia_communist_events.60.a:0 "Ne kadar ikiyüzlü, onların imparatorluk şiddeti ancak zorla durdurulabilir."
 BBA_ethiopia_communist_events.60.desc:0 "[FROM.GetNameDef]'den gelen büyükelçiler barış teklifimizi reddetti. Onlara karşı saldırımızın tamamen yersiz olduğunu ve bu nedenle, bölgesel barışa bir tehdit olduğumuz için bizden koşulsuz teslimiyetten başka bir şey kabul etmeyeceklerini savunuyorlar."
 BBA_ethiopia_communist_events.60.t:0 "[FROM.GetName] Barış Teklifini Reddediyor"
 BBA_ethiopia_communist_events.61.a:0 "Topraklarımızı teslim etmeyeceğiz."
 BBA_ethiopia_communist_events.61.b:0 "Kabul etmekten başka seçeneğimiz yok."
 BBA_ethiopia_communist_events.61.desc:0 "[FROM.GetAdjective] diplomatları bize bir barış teklifiyle yaklaştı. Teklif, bu çatışma sırasında [FROM.GetNameDef]'e kaybettiğimiz [?ETH.ETH_disputed_colony.GetAdjective] toprağı üzerindeki iddialarımızdan vazgeçmeyi kabul etmemize bağlı. Diplomatlar ayrıca, devredilen [?ETH.ETH_disputed_colony.GetAdjective] topraklarında yeni bir hükûmet seçmek için oylama yapılacağını belirtiyorlar. Söz konusu seçimlerin ne kadar bağımsız olacağı henüz belli değil."
 BBA_ethiopia_communist_events.61.t:0 "[FROM.GetNameDefCap], [?ETH.ETH_disputed_colony.GetAdjective] Bağımsızlığı için Barış Teklif Ediyor"
 BBA_ethiopia_communist_events.62.a:0 "Emperyalizme karşı kahramanca bir zafer!"
 BBA_ethiopia_communist_events.62.desc:0 "[FROM.GetNameDef]'den gelen diplomatlar, hükûmetlerinin kurtardığımız [?ETH.ETH_disputed_colony.GetAdjective] toprağı üzerindeki iddialarından vazgeçmeye istekli olduklarını bize bildirdi. Şimdi kuvvetlerini bölgedeki yeni kurulan sınırlara çekiyorlar."
 BBA_ethiopia_communist_events.62.t:0 "[FROM.GetName] Barış Teklifini Kabul Ediyor"
 BBA_ethiopia_communist_events_15_tt:0 "§Y$SOV_semyon_budyonny$§! ve §Y$SOV_vasily_kuznetsov$§! mevcut generaller olacak."
 BBA_ethiopia_exile_events.01.a:0 "[FROM.GetName]'ın davası bizim davamızdır"
 BBA_ethiopia_exile_events.01.desc:0 "Sürgündeki [FROM.GetAdjective] lideri,[FROM.GetLeader], [FROM.GetLeader.GetHerHis] ülkesini geri almak için büyük bir kampanya başlatmaya hazır. Halk arasında bunu yapma girişimi için destek güçlü, bu yüzden bu zamanı olabilir."
 BBA_ethiopia_exile_events.01.t:0 "[FROM.GetLeader], [FROM.GetName]'ı geri almaya hazır"
 BBA_ethiopia_exile_events.02.a:0 "Tetikte olmalıyız"
 BBA_ethiopia_exile_events.02.desc:0 "[ETH.GetLeader] ülkeden kaçtı, ancak hala destekçilerini muzaffer [ROOT.GetAdjective] ordularına saldırmaya teşvik ediyor. Bu konuşmalar, [ETH.GetName]'ın Kuzey ve Orta kısımlarında artan bir direniş faaliyetine yol açtı."
 BBA_ethiopia_exile_events.02.t:0 "Kuzey [ETH.GetName]'da Artan Direniş Faaliyeti"
 BBA_ethiopia_exile_events.03.a:0 "Şu isyancılar"
 BBA_ethiopia_exile_events.03.desc:0 "Güney [ETH.GetName]'daki [ROOT.GetAdjective] kuvvetlerine karşı saldırılar olduğuna dair birkaç rapor var. Kendilerine Kara Aslanlar diyen bir örgütün bu saldırıların arkasında olduğuna inanılıyor."
 BBA_ethiopia_exile_events.03.t:0 "[ETH.GetName]'ın Güneyindeki Komünist Gerillalar"
 BBA_ethiopia_exile_events.04.a:0 "Umarım hızlı bir şey olur o zaman"
 BBA_ethiopia_exile_events.04.desc:0 "[ENG.GetNameDefCap], $RAJ_orde_wingate$'i geri çağırmaya karar verdi. [ETH.GetName]'daki savaşta [ETH.GetLeader]'a yardım etmek için yeni bir güç kurmakla görevlendirildiğini iddia ediyorlar. Göstergeler, kalışın sınırlı bir süre olacağı ve operasyon tamamlandığında $RAJ_orde_wingate$'in geri dönmesine izin verileceği yönünde."
 BBA_ethiopia_exile_events.04.t:0 "$RAJ_orde_wingate$ geri çağrıldı"
 BBA_ethiopia_exile_events.05.a:0 "Ne kadar kötü"
 BBA_ethiopia_exile_events.05.desc:0 "[ENG.GetAdjective] hükûmeti, $RAJ_orde_wingate$'in derhal Burma'ya transfer edileceğini ve orada yeni bir güç organize etmekle görevlendirileceğini bize bildiriyor."
 BBA_ethiopia_exile_events.05.t:0 "$RAJ_orde_wingate$ Burma'ya Transfer Edildi"
 BBA_ethiopia_exile_events.06.a:0 "Bu mantıklı"
 BBA_ethiopia_exile_events.06.b:0 "Bu aşamada toprak vaat edemeyiz"
 BBA_ethiopia_exile_events.06.desc:0 "[FROM.GetLeader], eğer [550.Owner.GetNameDef]'den ele geçirmeyi başarırsak, [550.GetName] üzerinde hâkimiyet talep etti. Bölge [ETH.GetAdjective] kontrolü altındaydı, bu yüzden iddianın tarihsel bir emsali var. [FROM.GetLeader] ayrıca tüm Habeş halkının tek bir hükümdar altında birleşmesi gerektiğini de savundu ve [ITA.GetAdjective]ların [550.GetName]'ı işgal ettiğinden beri [FROM.GetNameDef]'in Denize erişimi olmadığını da belirtti."
 BBA_ethiopia_exile_events.06.t:0 "[FROM.GetName], [550.GetName]'ın Hâkimiyetini Talep Ediyor"
 BBA_ethiopia_exile_events.07.a:0 "İyi haber"
 BBA_ethiopia_exile_events.07.desc:0 "[FROM.GetAdjective] hükûmeti, tüm Habeş toprakları üzerindeki iddialarımızı meşru görüyor ve [550.GetName] üzerinde hâkimiyet talebimizi kabul etti."
 BBA_ethiopia_exile_events.07.t:0 "[FROM.GetNameDefCap] Talebimizi Kabul Ediyor"
 BBA_ethiopia_exile_events.08.a:0 "Savaşı kazanalım, sonra bakarız"
 BBA_ethiopia_exile_events.08.desc:0 "[550.GetName] bölgesi üzerindeki meşru iddialarımıza rağmen, [FROM.GetAdjective] hükûmeti [ROOT.GetAdjective] iddialarını destekleyen herhangi bir açık vaatte veya açıklamada bulunmayı reddediyor. Zamanla kıyı şeridinin kontrolünü ele almamıza izin verip vermeyeceklerini sadece zaman gösterecek."
 BBA_ethiopia_exile_events.08.t:0 "[FROM.GetAdjective] Hükûmeti Reddediyor"
 BBA_ethiopia_exile_events.10.a:0 "Bu bize gerçekten güçlü bir müttefik kazandırır"
 BBA_ethiopia_exile_events.10.b:0 "Düşmanın eyaletlerini alabilirler"
 BBA_ethiopia_exile_events.10.c:0 "Bu talepler çok ileri gidiyor"
 BBA_ethiopia_exile_events.10.desc:0 "[ROOT.GetAdjective] Dışişleri Bakanı ile [FROM.GetLeader]'ın geçici konutunda yapılan bir toplantı sırasında, [FROM.GetLeader] Etiyopya'da zaten büyük bir Somali nüfusu olduğu ve sınır anlaşmazlıklarının çatışmayı başlatmak için kullanılan bahanelerden biri olduğu için [FROM.GetName]'a tüm Somali topraklarının hâkimiyetinin verilmesini talep etti. [FROM.GetLeader]'a göre, tüm bu toprakları [FROM.GetNameDef]'e vermek, gelecekteki çatışma için bu nedeni ortadan kaldıracaktır."
 BBA_ethiopia_exile_events.10.t:0 "[FROM.GetName] Tüm Somali Topraklarının Hâkimiyetini Talep Ediyor"
 BBA_ethiopia_exile_events.11.a:0 "Bu Harika bir Haber!"
 BBA_ethiopia_exile_events.11.desc:0 "[FROM.GetAdjective]'ler bize tüm Somali topraklarının kontrolünü vermeyi kabul etti. Bu, [ROOT.GetName]'ın savaş bittiğinde Afrika Boynuzu'nun çoğunluğunu kontrol edeceği anlamına geliyor."
 BBA_ethiopia_exile_events.11.t:0 "Somali bizimdir!"
 BBA_ethiopia_exile_events.12.a:0 "Sanırım başkalarının eyaletlerini vermek daha kolay"
 BBA_ethiopia_exile_events.12.desc:0 "[FROM.GetAdjective]'ler bize Somali topraklarının bir kısmını verebileceklerini söylüyorlar. Daha doğrusu, kendilerinin veya bizim düşmandan ele geçirmeyi başardığımız kısımları. Ancak, şu anda imparatorluklarının bir parçası olarak gördükleri herhangi bir yeri vermeyi reddediyorlar."
 BBA_ethiopia_exile_events.12.t:0 "Kısmi Başarı"
 BBA_ethiopia_exile_events.13.a:0 "İnsanı düşündürüyor"
 BBA_ethiopia_exile_events.13.desc:0 "Tüm Somali topraklarının gelecekteki mülkiyeti talebimiz [FROM.GetNameDef] tarafından reddedildi. Maalesef, düşmandan alınan toprakların kontrolünü vaat etmeyi bile reddettiler."
 BBA_ethiopia_exile_events.13.t:0 "Şans yok"
 BBA_ethiopia_exile_events.14.a:0 "Belki bunu bir şekilde kullanabiliriz"
 BBA_ethiopia_exile_events.14.b:0 "Asla olmaz!"
 BBA_ethiopia_exile_events.14.desc:0 "Downing Sokağı'nda yakın zamanda yapılan bir toplantıda, [FROM.GetLeader], [ROOT.GetAdjective] Başbakanı ile [454.GetName] hakkında konuştu. [FROM.GetLeader], [ROOT.GetNameDef]'e giderken [FROM.GetLeader.GetHerHis] yolculuğu sırasında oradan geçerken [FROM.GetLeader.GetSheHe]'nin çok sıcak bir karşılama gördüğünü belirtti. Görüşmeler yavaş yavaş, [FROM.GetLeader]'dan gelen, Kral Süleyman'a olan iddia ettiği doğrudan soy bağını bir koz olarak kullanarak [ETH.GetNameDef]'in yeniden fethi için [454.GetName]'ı bir üs olarak kullanma talebine doğru kaydı ve böylece fiilen Başbakandan [454.GetName]'ı [ETH.GetNameDef]'e devretmesini istemiş oldu."
 BBA_ethiopia_exile_events.14.t:0 "[FROM.GetLeader], [454.GetName]'ın Kontrolünü Talep Ediyor"
 BBA_ethiopia_exile_events.15.a:0 "Bu yeni bir dönemin başlangıcı"
 BBA_ethiopia_exile_events.15.desc:0 "Belki biraz beklenmedik bir şekilde, [FROM.GetAdjective]'ler [454.GetName]'ı bir üs olarak kullanmamıza izin vermeyi kabul etti. Yönetimimizi orada kurmak için hızla hareket etmeliyiz. Bir gün yeni bir Süleyman mabedi inşa edeceğiz."
 BBA_ethiopia_exile_events.15.t:0 "[FROM.GetNameDefCap] Kabul Ediyor"
 BBA_ethiopia_exile_events.16.a:0 "Ne kadar hakaretvari."
 BBA_ethiopia_exile_events.16.desc:0 "Maalesef, [FROM.GetAdjective] hükûmeti [454.GetName]'ı bir üs olarak kullanma talebimizi reddetti ve bölge üzerindeki iddiamızın meşruiyetini sorguladı."
 BBA_ethiopia_exile_events.16.t:0 "[FROM.GetNameDefCap] Reddediyor"
 BBA_ethiopia_exile_events.17.a:0 "Kesinlikle birkaç muhrip ayırabiliriz"
 BBA_ethiopia_exile_events.17.b:0 "Onlara bazı eskortlarla bir kruvazör verelim"
 BBA_ethiopia_exile_events.17.c:0 "[FROM.GetLeader]'ın etkileyici bir amiral gemisine ihtiyacı var"
 BBA_ethiopia_exile_events.17.d:0 "Hiçbir gemi ayıramayız, ama en azından onlara biraz bilgi birikimi verebiliriz"
 BBA_ethiopia_exile_events.17.desc:0 "[ROOT.GetLeader] ile [FROM.GetLeader] arasındaki özel bir toplantı sırasında, [ROOT.GetLeader] [ROOT.GetNameDef]'in [FROM.getNameDef]'e gemilerle destek olacağına söz verdi. Belki dikkatsizce söylenmiş sözler, ama yine de [ROOT.GetAdjective] Donanması'nın onurlandırması gereken bir şey."
 BBA_ethiopia_exile_events.17.t:0 "[ROOT.GetLeader], [FROM.GetLeader]'a Gemiler Vaat Ediyor"
 BBA_ethiopia_exile_events.18.a:0 "Bu da bir şeydir en azından"
 BBA_ethiopia_exile_events.18.desc:0 "[FROM.GetAdjective] donanması, [FROM.GetLeader]'ın [ROOT.GetName]'a bir donanma tedarik etme sözünün ardından bize bir muhrip birimi sağladı."
 BBA_ethiopia_exile_events.18.t:0 "[FROM.GetAdjective] Muhripleri"
 BBA_ethiopia_exile_events.19.a:0 "Bu sadece başlangıç"
 BBA_ethiopia_exile_events.19.desc:0 "[FROM.GetLeader]'ın [ROOT.GetName]'a bazı gemiler tedarik etme sözünün ardından, [FROM.GetAdjective] bir kruvazör ve birkaç muhribi [ROOT.GetAdjective] kontrolüne devretti. Belki büyük bir filo değil, ama en azından bir filo. [ROOT.GetName] için yeni bir dönemin başlangıcı"
 BBA_ethiopia_exile_events.19.t:0 "[ROOT.GetAdjective] Donanmasının Başlangıcı"
 BBA_ethiopia_exile_events.20.a:0 "Harika haber"
 BBA_ethiopia_exile_events.20.desc:0 "[ROOT.GetLeader]'ın [FROM.GetLeader]'ı ziyaretinden sonra, [FROM.GetName] bir zırhlının [ROOT.GetName]'a devredilmesini emretti. Böylece, [ROOT.GetNavy] artık yepyeni bir amiral gemisine sahip. Eskortlar inşa etmemiz gerekiyor, ancak [FROM.GetAdjective] yardımıyla bu yapılabilir bir görev olmalı."
 BBA_ethiopia_exile_events.20.t:0 "Bir [ROOT.GetAdjective] Zırhlısı"
 BBA_ethiopia_exile_events.21.a:0 "Sonuçta hiç yoktan iyidir"
 BBA_ethiopia_exile_events.21.desc:0 "[FROM.GetLeader]'ın [ROOT.GetLeader]'a gemi vaatlerine rağmen, [FROM.GetAdjective] donanmasının durumu, [FROM.GetName]'ın şu anda hiçbir gemiden ayrılamayacağı anlamına geliyor. Bir şekilde telafi etmek için, [FROM.GetAdjective] amiralliği, [ROOT.GetName]'a gemi inşa bilgisini aktarmak için [ROOT.GetName]'ın [FROM.GetAdjective] gemi tasarımlarını ve üretim yöntemlerini incelemesine izin verdi."
 BBA_ethiopia_exile_events.21.t:0 "Gemi Yok"
 BBA_ethiopia_exile_events.22.a:0 "[647.GetName]'a ne dersin?"
 BBA_ethiopia_exile_events.22.b:0 "[524.GetName] mükemmel bir üs olurdu"
 BBA_ethiopia_exile_events.22.c:0 "[543.GetName] bir adadır, sanırım?"
 BBA_ethiopia_exile_events.22.d:0 "[?ETH.japanese_island.GetName]'ı alabilirler"
 BBA_ethiopia_exile_events.22.desc:0 "Görünüşe göre, [ROOT.GetLeader], [FROM.GetLeader]'a [ROOT.GetName]'ın adalarından birini hükûmet için bir üs olarak ve [FROM.GetName]'ın yeniden fethini başlatmak için kullanmasını vaat etti. Bu, [FROM.GetLeader]'ın [FROM.GetNameDef]'in hükümdarı olarak resmi bir tanınmasıdır ve [ITA.getName] tarafından bir savaş ilanı olarak kabul edilecektir. Ancak, bu aynı zamanda [ROOT.GetNameDef]'in nüfuzunu genişletmek için bir fırsattır."
 BBA_ethiopia_exile_events.22.e:0 "[ENG.GetAdjective] adalarından birini alabilirler"
 BBA_ethiopia_exile_events.22.t:0 "[ROOT.GetLeader], [FROM.GetLeader]'a bir Ada Vaat Ediyor"
 BBA_ethiopia_exile_events.23.a:0 "[?ETH.japanese_island.GetName] bizimdir"
 BBA_ethiopia_exile_events.23.desc:0 "Bir iyi niyet teklifi olarak ve [ROOT.GetLeader]'ı [ROOT.GetNameDef]'in haklı hükümdarı olarak tanıyarak, [FROM.GetLeader], [ROOT.GetName]'ı geri almak için bir hazırlık alanı olarak [ROOT.GetLeader]'a [?ETH.japanese_island.GetName] adasını verdi.\n\n [FROM.GetNameDef], kaybedilen toprağın yeniden fethinde [ROOT.GetName]'a yardım edecektir. Bu iyilikler karşılığında, [ROOT.GetLeader], iki ülkeyi Avrupa emperyalizmine karşı mücadelelerinde daha da yakınlaştırarak [FROM.GetLeader]'a bağlılık yemini etti."
 BBA_ethiopia_exile_events.23.t:0 "Bir Etiyopya Adası"
 BBA_ethiopia_exile_events.24.a:0 "Bu onları daha güçlü bir müttefik yapacak"
 BBA_ethiopia_exile_events.24.desc:0 "[ROOT.GetNameDef] ve [FROM.GetNameDef] devlet başkanları tarafından yapılan gizli bir anlaşmada, Arap yarımadasındaki bir dizi eyaletin [ROOT.GetAdjective] hükûmetinin eline geçmesi durumunda [FROM.GetNameDef]'e vaat edildi. Toprak, zamanı geldiğinde devredilecek, ancak tabii ki önce güvence altına alınması gerekiyor."
 BBA_ethiopia_exile_events.24.t:0 "Etiyopya için bir Operasyon Üssü"
 BBA_ethiopia_exile_events.30.a:0 "Bu doğal bir tırmanış"
 BBA_ethiopia_exile_events.30.b:0 "Hayır, bu bir adım fazla olurdu"
 BBA_ethiopia_exile_events.30.desc:0 "[FROM.GetNameDefCap], [ITA.GetNameDef]'e karşı bir ittifaka ortak bir üyelik başvurusu yapmamızı öneriyor. Bu, tarihsel politikalarımıza aykırı olurdu, ama öte yandan, [FROM.GetAdjective] liderinin [ROOT.GetName]'da kalmasına izin vermek zaten bunu bir şekilde ihlal etti."
 BBA_ethiopia_exile_events.30.t:0 "Karşılıklı İttifak Başvurusu"
 BBA_ethiopia_exile_events.31.a:0 "En azından denedik"
 BBA_ethiopia_exile_events.31.desc:0 "[FROM.GetAdjective] hükûmeti ortak bir üyelik başvurusu teklifimizi reddetti. Maalesef bu, daha büyük bir ittifakın desteğine sahip olmak yerine bireysel ülkeler olarak savaşmak zorunda kalacağımız anlamına geliyor."
 BBA_ethiopia_exile_events.31.t:0 "[FROM.GetName] Teklifimizi Reddediyor"
 BBA_ethiopia_exile_events.32.a:0 "Bu iyi bir fikir gibi görünüyor"
 BBA_ethiopia_exile_events.32.b:0 "Onlarsız daha iyiyiz"
 BBA_ethiopia_exile_events.32.desc:0 "[FROM.GetLeader] ve [FROM.FROM.GetLeader], [ROOT.GetFactionName]'e katılma talebiyle bize yaklaştı. Bu, [ITA.GetName]'a karşı savaşta hem [FROM.GetNameDef] hem de [FROM.FROM.GetNameDef]'in kuvvetlerini [ROOT.GetFactionName]'in emrine verecektir."
 BBA_ethiopia_exile_events.32.t:0 "[FROM.GetName] ve [FROM.FROM.GetName]'dan Ortak Üyelik Başvurusu"
 BBA_ethiopia_exile_events.33.a:0 "Sinir bozucu"
 BBA_ethiopia_exile_events.33.desc:0 "Maalesef, [FROM.GetName] ortak [SWE.GetAdjective]-[ETH.GetAdjective] [FROM.GetFactionName]'e katılma talebini geri çevirdi. Garip bir nedenle, [ITA.GetLeader]'a karşı birleşik bir gücün faydasını görmeyi reddettiler."
 BBA_ethiopia_exile_events.33.t:0 "[FROM.GetName] Reddediyor"
 BBA_ethiopia_exile_events.34.a:0 "Harika Haber"
 BBA_ethiopia_exile_events.34.desc:0 "[FROM.GetNameDefCap], [FROM.GetFactionName]'e katılmamıza izin verdi. Şimdi [ITA.GetName]'ı yenme şansımız çok daha yüksek."
 BBA_ethiopia_exile_events.34.t:0 "[FROM.GetNameDefCap] Kabul Ediyor"
 BBA_ethiopia_exile_events.40.a:0 "[ITA.GetName], [FROM.GetName]'dan çekilmelidir"
 BBA_ethiopia_exile_events.40.b:0 "[ITA.GetLeader]'a bir şeyler teklif edilmelidir"
 BBA_ethiopia_exile_events.40.c:0 "Daha istikrarlı yeni sınırlar çizmeliyiz"
 BBA_ethiopia_exile_events.40.desc:0 "[FROM.GetName]'ın sürgündeki imparatoru [FROM.GetLeader], İtalya-Etiyopya savaşında [ROOT.GetAdjective] arabuluculuğunu talep etti. [GetGermanCountryLeaderTitle], Milletler Cemiyeti'nin çözemediği bu çatışmayı çözme konusundaki kişisel ilgisini ifade etti. Bunu başarmak, [ROOT.GetName]'ın dünya sahnesindeki statüsünü artıracaktır."
 BBA_ethiopia_exile_events.40.t:0 "[FROM.GetName] Arabuluculuk Talep Ediyor"
 BBA_ethiopia_exile_events.41.a:0 "Muhtemelen en iyisi bu"
 BBA_ethiopia_exile_events.41.b:0 "Bu bir başlangıç, ama [ROOT.GetAdjective] halkının çabalarını gösterecek daha fazlasına ihtiyacı var"
 BBA_ethiopia_exile_events.41.c:0 "[FROM.GetLeader.GetSheHe], [FROM.GetLeader.GetSheHe]'nin kim olduğunu düşünüyor?"
 BBA_ethiopia_exile_events.41.desc_back_off:0 "[FROM.GetLeader] açıkça düşmanımızın tarafını tuttu. [?global.ETH_peace_country.GetLeader]'in [FROM.GetNameDef]'de ikamet etmesine ve hala iktidardaymış gibi davranmasına bir süredir izin veriliyor. [?global.ETH_peace_country.GetNameDef]'in eski liderinin yalanları, [FROM.GetLeader]'ı açıkça etkiledi ve [ROOT.GetNameDef]'e olan [FROM.GetLeader.GetHerHis] görüşünü düşürdü. Şimdi [FROM.GetNameDef], basitçe [?global.ETH_peace_country.GetName]'dan çekilmemizi ve farklılıklarımızı bir kenara bırakmamızı talep ediyor."
 BBA_ethiopia_exile_events.41.desc_offered_compensation:0 "Düşmanımızın sürgündeki lideri [?global.ETH_peace_country.GetLeader]'in [FROM.GetNameDef]'de ikamet etmesine izin vermenin doğal bir sonucu olarak, [FROM.GetLeader] şimdi [ROOT.GetName] ile [?global.ETH_peace_country.GetName] arasındaki çatışmada arabuluculuk yapmak istiyor. [FROM.GetLeader], [FROM.GetLeader.GetSheHe]'nin, [?global.ETH_peace_country.GetLeader]'ı barış ve olası gelecekteki işbirliği karşılığında [ROOT.GetName]'a küçük tavizler vermeye ikna etmeyi başardığını belirtiyor."
 BBA_ethiopia_exile_events.41.desc_redraw_map:0 "[FROM.GetAdjective] lideri [FROM.GetLeader], İtalya-Etiyopya savaşına bir çözüm önerdi; buna göre [ROOT.GetName], barış ve dış düşmanlara karşı gelecekteki işbirliği karşılığında [?global.ETH_peace_country.GetAdjective] toprağının büyük bir bölümünü alıyor. [ROOT.GetName] bu teklifi kabul ederse, [?global.ETH_peace_country.GetName]'a da bir şeyler kazanmaları için [550.GetName] ile tazminat verilecekti. Bu, [ROOT.GetAdjective] mülklerini Afrika'da pekiştirirken, aynı zamanda [?global.ETH_peace_country.GetName]'a denize erişim sağlayacaktı."
 BBA_ethiopia_exile_events.41.t:0 "[FROM.GetAdjective] Arabuluculuğu"
 BBA_ethiopia_exile_events.42.a:0 "Anlaşılabilir"
 BBA_ethiopia_exile_events.42.b:0 "Emirlerimizi sorgulamaya nasıl cüret ederler?"
 BBA_ethiopia_exile_events.42.desc:0 "[GetGermanCountryLeaderTitle] tarafından yapılan barış teklifi [FROM.GetLeader] tarafından tamamen reddedilmedi. Ancak, [FROM.GetAdjective] hükûmeti, rejime yönelik halk muhalefetini bastırma çabalarını göstermek için daha fazlasına ihtiyaç duyduklarını düşünüyor ve bu yüzden bizden biraz yeniden düşünmemizi istediler."
 BBA_ethiopia_exile_events.42.t:0 "[FROM.GetLeader] daha fazlasını istiyor"
 BBA_ethiopia_exile_events.43.a:0 "Güzel"
 BBA_ethiopia_exile_events.43.desc:0 "[FROM.GetLeader], çatışmayı halkla yüzümüzü kurtarmamıza olanak tanıyacak şekilde sona erdirmek için [ETH.GetName]'ın toprak tavizinde bulunma ihtiyacını anlıyor. Yakında bu istila karmaşasını başımız dik bir şekilde geride bırakabileceğiz."
 BBA_ethiopia_exile_events.43.t:0 "[FROM.GetName] Talebimizi Kabul Etti"
 BBA_ethiopia_exile_events.44.a:0 "Savaş falan ilan edecek değiller ya..."
 BBA_ethiopia_exile_events.44.desc:0 "[ROOT.GetLeader]'in öne sürdüğü argümanlar kulak ardı edildi. [FROM.GetLeader], sunulan teklifin tüm tarafların çıkarına olduğunu ve [ROOT.GetLeader]'in Afrika'da kazanma konusundaki [ROOT.GetLeader.GetHerHis] başarısızlığı nedeniyle bir fiyasko olduğunu iddia ederek ateş püskürdü. [FROM.GetLeader] sözlerine, [FROM.GetAdjective]ların [ROOT.GetAdjective] ordusunu haftalar içinde kesinlikle ezeceğini haykırarak devam etti."
 BBA_ethiopia_exile_events.44.t:0 "[FROM.GetLeader] Talebimizden Öfkelendi"
 BBA_ethiopia_exile_events.45.a:0 "En azından bir tür barış"
 BBA_ethiopia_exile_events.45.desc_cede_territory:0 "[FROM.GetLeader], [FROM.FROM.GetNameDef] ile barış sağladı. Maalesef, iki lider başımızın üzerinden [FROM.FROM.GetName]'ın [ROOT.GetName]'ın bir kısmını alacağına karar verdi. Bu konuda gerçekten yapabileceğimiz bir şey yok."
 BBA_ethiopia_exile_events.45.desc_redraw_map:0 "[FROM.GetLeader], [FROM.FROM.GetNameDef] ile barış sağladı. [ROOT.GetNameDefCap], tüm güneyi [FROM.FROM.GetName]'a devretmelidir. Tazminat olarak, [ROOT.GetName]'ın denize erişimini sağlamak için [550.GetName], [ROOT.GetName]'a verilecektir. Bu ayrıca, [FROM.GetLeader]'a göre, alanı tek birimlere böler, bu da [FROM.GetLeader]'a göre iki ulus arasındaki gelecekteki çatışma riskini azaltacaktır."
 BBA_ethiopia_exile_events.45.desc_white_peace:0 "[FROM.GetAdjective] arabuluculuğu başarılı oldu. [FROM.FROM.GetLeader], [FROM.GetLeader] tarafından [FROM.FROM.GetLeader.GetHerHis] ordularını [ROOT.GetAdjective] topraklarından çekmesi emredildi. \nAntlaşma [ROOT.GetName]'a herhangi bir tazminat sunmuyor ama umarım yeni müttefiklerimizi ülkeyi modern çağa taşımak için kullanabiliriz. [FROM.GetAdjective] [GetGermanCountryLeaderTitle], [FROM.GetLeader], [ROOT.GetAdjective] imparatorluğunun görkemini geri getirme konusunda belirsiz vaatlerde bulundu."
 BBA_ethiopia_exile_events.45.t:0 "Arabuluculuk Başarılı"
 BBA_ethiopia_exile_events.46.a:0 "Bunun için daha yüksek umutlarımız vardı"
 BBA_ethiopia_exile_events.46.desc:0 "Maalesef, [FROM.GetLeader]'ın [FROM.FROM.GetNameDef] ile bir barış anlaşması yapma girişimleri sonuçsuz kaldı. [FROM.FROM.GetLeader] aklını başına toplamayı reddediyor. Şimdi umudumuz, [FROM.GetNameDef]'i savaşta bize katılmaya ikna edebilmek."
 BBA_ethiopia_exile_events.46.t:0 "Arabuluculuk Başarısız Oldu"
 BBA_ethiopia_exile_events.47.a:0 "[FROM.GetLeader.GetHerHim]'e bir ders vermeliyiz"
 BBA_ethiopia_exile_events.47.desc:0 "[FROM.GetAdjective] yanıtı tatmin edici olmaktan uzak. [FROM.GetLeader] yerinden kıpırdamayı reddediyor. [FROM.GetName] savaşı kazanana kadar veya denerken yok olana kadar durmayacak."
 BBA_ethiopia_exile_events.47.t:0 "[FROM.GetLeader] İşbirliği Yapmayı Reddediyor"
 BBA_ethiopia_exile_events.48.a:0 "[ROOT.GetLeader] zamanımızdaki barışın garantörüdür"
 BBA_ethiopia_exile_events.48.desc:0 "Beklendiği gibi, [ROOT.GetNameDef] herkesin başarısız olduğu yerde başarılı oldu. [FROM.GetLeader], [ROOT.GetLeader]'ın hazırladığı şartları kabul etti. [FROM.GetNameDefCap] ile [?global.ETH_peace_country.GetNameDef] arasında barış olacak. Birlikte şimdi hepimiz daha önemli meselelere geçebiliriz."
 BBA_ethiopia_exile_events.48.t:0 "[FROM.GetLeader] Arabuluculuğumuzu Kabul Etti"
 BBA_ethiopia_exile_events.50.a:0 "Bu kabul edilebilir bir davranış olmaktan çok uzak"
 BBA_ethiopia_exile_events.50.desc:0 "[ROOT.GetAdjective] bir sınır karakolu, [ITA.GetAdjective] tarafından ateşe tutuldu. [ROOT.GetAdjective], [ITA.GetAdjective] keskin nişancılarına karşılık verdi ve uzun bir çatışma yaşandı. Her iki tarafta da askerler yaralandı. [ITA.GetAdjective] hükûmetine resmi bir protesto iletildi. Ancak onlar, masumiyet iddia ediyor, bunun yerine birliklerimizi olayı başlatmakla suçluyorlar."
 BBA_ethiopia_exile_events.50.t:0 "Sınır Olayı"
 BBA_ethiopia_exile_events.51.a:0 "Bu açıkça bir [GER.GetAdjective] komplosu"
 BBA_ethiopia_exile_events.51.desc:0 "[GER.GetAdjective] hükûmeti, İtalya-Almanya sınırındaki bir olaydan sonra öfkeli bir protesto notası iletti. Birisi ateş açtı. Raporlar son derece çelişkili, bazıları çatışmanın İtalyan tarafından başladığını belirtirken, hayatta kalan sınır muhafızlarından hiçbiri Almanlar onlara ateş açmadan önce ateş ettiğini kabul etmedi. İtalyan askerlerinin herhangi bir siper arkasında olmaması gerçeği bu tanıklıkları daha da güçlendiriyor."
 BBA_ethiopia_exile_events.51.t:0 "Şüpheli Sınır Olayı"
 BBA_ethiopia_exile_events.52.a:0 "Eve dönmeye bir adım daha yakın."
 BBA_ethiopia_exile_events.52.desc:0 "Majesteleri [ETH.GetLeader]’in konutunda düzenlenen son parti büyük bir başarı oldu. Konuklar kaynaşırken ve dünyanın dört bir yanından ithal edilen lezzetlerin tadını çıkarırken, [?ETH.host_nation.GetAdjective] politikacıları [ETH.GetAdjective] sürgünlerinden anavatanın acımasız [ITA.GetAdjective] işgali hakkında bilgi aldı. Birçoğu, bir gün [ETH.GetNameDef]'i kurtarmamıza yardım etmek için [?ETH.host_nation.GetAdjective] kaynaklarının daha büyük bir taahhüdünü desteklemeye ikna oldu."
 BBA_ethiopia_exile_events.52.t:0 "Kulis Diplomasisi"
 BBA_ethiopia_exile_events.53.a:0 "Çabaya değdi!"
 BBA_ethiopia_exile_events.53.desc:0 "Son birkaç ay, [ETH.GetNameDef]'i kurtarmamıza yardım etmeleri için ev sahiplerimiz arasında destek toplamak için birçok çabaya sahne oldu. Majesteleri, davamızı teşvik eden hükûmet ve ordu üyelerine mektuplar yazdı. Bu arada, diğer sürgünler [?ETH.host_nation.GetAdjective] halkından destek toplamak için bir dizi gazeteye röportajlar ve makaleler vererek turlar yaptılar. Zor olsa da, ulusun havasının artık [ETH.GetNameDef]'i kurtarmak için doğrudan askeri desteğe doğru ilerlediği görülüyor."
 BBA_ethiopia_exile_events.53.t:0 "Başarılı Lobi Faaliyetleri"
 BBA_ethiopia_exile_events.54.a:0 "Davaya katkılarını unutmayacağız."
 BBA_ethiopia_exile_events.54.desc:0 "Son bağış toplama çabalarımız çok kazançlı oldu. İmparatorluk hazinesi, dünya çapındaki bağışçılardan çok sağlıklı bir nakit akışı gördü. [ETH.GetNameDef]'in işgaline duyduğumuz öfkeyi paylaşan birçok kişi var gibi görünüyor."
 BBA_ethiopia_exile_events.54.t:0 "Bağış Toplama Çabaları"
 BBA_ethiopia_exile_events.55.a:0 "Kuvvetlerimiz her geçen gün daha da güçleniyor."
 BBA_ethiopia_exile_events.55.desc:0 "Davamızı teşvik etme konusundaki son çabalar, gelecek savaşlarda bize hizmetlerini sunan [?ETH.host_nation.GetAdjective] paralı askerlerinin istikrarlı bir akınına tanık oldu. Tabii ki bir bedel karşılığında."
 BBA_ethiopia_exile_events.55.t:0 "[?ETH.host_nation.GetAdjective] Paralı Asker Alımı"
 BBA_ethiopia_exile_events.56.a:0 "Alabileceğimiz her türlü yardımı alırız."
 BBA_ethiopia_exile_events.56.desc:0 "Anavatanımızın yaklaşan kurtuluşunda bize yardım etmek için çağrıya yanıt veren bir dizi [?ETH.host_nation.GetAdjective] pilotu gördük. Yanlarında, kendi müstakbel pilotlarımızla paylaşma sürecinde oldukları zengin bir deneyim getiriyorlar."
 BBA_ethiopia_exile_events.56.t:0 "[?ETH.host_nation.GetAdjective] Pilotları Çağrıya Yanıt Veriyor"
 BBA_ethiopia_exile_events.57.a:0 "Umarım gemiler hala denize elverişlidir..."
 BBA_ethiopia_exile_events.57.desc:0 "Düşman istilasına uğramış suları göğüslemeye istekli [?ETH.host_nation.GetAdjective] denizcileri ve gemileri için yapılan son çağrı, bir dizi istekli gönüllüyle karşılandı. Emekli donanma personeli, sivil denizciler ve sadece macera arayışındaki genç gönüllüler, [?ETH.host_nation.GetNameDef]'in hurdalıklarından topladığımız derme çatma kargo gemileri filosuna mürettebat olmak için öne çıktılar."
 BBA_ethiopia_exile_events.57.t:0 "Bir [ETH.GetName] Yardımcı Filosu"
 BBA_ethiopia_exile_events.58.a:0 "İyi harcanan para."
 BBA_ethiopia_exile_events.58.desc:0 "[?ETH.host_nation.GetAdjective] üreticilerinden satın alınan tüfekler, [?ETH.host_nation.GetName]'da ikamet eden birliklerimize teslim edildi. Yeni teçhizat şimdi atış poligonunda ve tatbikatlarda test ediliyor."
 BBA_ethiopia_exile_events.58.t:0 "Tüfek Sevkiyatı Teslim Edildi"
 BBA_ethiopia_exile_events.59.a:0 "Her küçük yardım değerlidir."
 BBA_ethiopia_exile_events.59.desc:0 "Birlikler için son destek teçhizatı alımımız şimdi teslim edildi. Dünyadaki en son teknoloji teçhizat olmayabilir, ancak yine de cephede büyük yardımı dokunacaktır."
 BBA_ethiopia_exile_events.59.t:0 "Destek Teçhizatı Teslim Edildi"
 BBA_ethiopia_exile_events.60.a:0 "Hiç tank olmamasından iyidir."
 BBA_ethiopia_exile_events.60.desc:0 "[?ETH.host_nation.GetAdjective] ordu fazlasından satın alınan tanklar şimdi silahlı kuvvetlerimize devredildi. Tanklar, son yıllarda naftalinlenmiş eski modellerdir. Ancak, hala tam çalışır durumdalar ve şimdi mürettebatı eğitmek için kullanılıyorlar, cephe hatlarına konuşlandırılmaya hazırlar."
 BBA_ethiopia_exile_events.60.t:0 "Tanklar Teslim Edildi"
 BBA_ethiopia_fascist_events.01.a:0 "$ETH_haile_selassie_gugsa$ bariz seçimdir"
 BBA_ethiopia_fascist_events.01.b:0 "$gojjam$'dan $ETH_hailu_tekle_haymanot$'u gönder"
 BBA_ethiopia_fascist_events.01.c:0 "Belki de en iyi şansı $ETH_abba_jofir$'dır"
 BBA_ethiopia_fascist_events.01.desc:0 "$ETH_haile_selassie$'nin İtalyanlara karşı çatışmacı yaklaşımı, Milletler Cemiyeti'ne olan güveniyle birleşince hiçbir yere varmadı. Bunun [ROOT.GetName]'ın sonu olacağı herkes için açıktır.\n\n Savaş bir değişim fırsatıdır, hatta değişimi bir zorunluluk haline getirir. İlk eylem rotası, İtalyanlara kabul edebilecekleri bir barış anlaşması müzakere etmek için bir büyükelçi göndermek olmalıdır."
 BBA_ethiopia_fascist_events.01.t:0 "Değişim için bir Fırsat"
 BBA_ethiopia_fascist_events.02.a:0 "Bu aslında oldukça faydalı"
 BBA_ethiopia_fascist_events.02.b:0 "Hayır, yardıma ihtiyacımız yok, teşekkürler"
 BBA_ethiopia_fascist_events.02.desc:0 "Taht üzerinde hak iddia eden [ETH.GetAdjective] soylularından biri olan $ETH_haile_selassie_gugsa$, [ETH.GetName]'daki [ROOT.GetAdjective] yüksek komutanlığına yaklaştı. Soylu, savaştan sonra ülkenin bir kısmının kontrolü karşılığında [ETH.GetLeader]'a karşı yardım teklif ediyor. $ETH_haile_selassie_gugsa$ elbette $ITA_vittorio_emanuele_iii$'e bağlılık yemini edecek ve [ETH.GetName]'da onun yerine hüküm sürecektir."
 BBA_ethiopia_fascist_events.02.t:0 "Taht Talibi Barış Arıyor"
 BBA_ethiopia_fascist_events.03.a:0 "Bu aslında oldukça faydalı"
 BBA_ethiopia_fascist_events.03.b:0 "Hayır, yardıma ihtiyacımız yok, teşekkürler"
 BBA_ethiopia_fascist_events.03.desc:0 "$gojjam$'ın hapsedilmiş taht talibi $ETH_hailu_tekle_haymanot$'un bir temsilcisi, yarı özerk bir $gojjam$'ın lideri olarak $ETH_hailu_tekle_haymanot$'un yeniden atanması karşılığında [ROOT.GetName]'ın [ETH.GetName]'ı fethini desteklemeyi teklif ediyor. Kuzeydeki bir silahlı ayaklanma kesinlikle [ETH.GetAdjective] kuvvetlerini felç eder ve hızlı bir zafer getirir."
 BBA_ethiopia_fascist_events.03.t:0 "Özerk bir $gojjam$ mı?"
 BBA_ethiopia_fascist_events.04.a:0 "Bir kukla sultan bize iyi hizmet edebilir"
 BBA_ethiopia_fascist_events.04.b:0 "Hayır, yardıma ihtiyacımız yok, teşekkürler"
 BBA_ethiopia_fascist_events.04.desc:0 "$jimma$'nın son sultanının oğlu $ETH_abba_jofir$, [ROOT.GetAdjective]'in $ETH_abba_jofir$'ın $jimma$'nın hükümdarı olarak statüsünü tanıması karşılığında [ROOT.getName] ile işbirliği yapmayı teklif etti. $jimma$ elbette [ROOT.GetAdjective] imparatorluğunun bir parçası olacak ve eğer [ROOT.getName] teklifi kabul ederse, $ETH_abba_jofir$ [ROOT.GetAdjective] tacına bağlılık yemini edecekti."
 BBA_ethiopia_fascist_events.04.t:0 "$jimma$'nın Devrik Lideri Yardım Teklif Ediyor"
 BBA_ethiopia_fascist_events.05.a:0 "Yeni bir dönemin başlangıcı"
 BBA_ethiopia_fascist_events.05.desc:0 "[FROM.GetAdjective] karargahına yapılan görev büyük bir başarıyla karşılandı. [ITA.GetLeader] bir ayaklanma planını onayladı ve savaştan sonra yarı özerk bir devletin hayatta kalmasını kabul etti. Onlar fikirlerini değiştirmeden isyanı başlatmak için acele etmeliyiz."
 BBA_ethiopia_fascist_events.05.t:0 "[FROM.GetName] Teklifimizi Kabul Ediyor"
 BBA_ethiopia_fascist_events.06.a:0 "Çok talihsiz"
 BBA_ethiopia_fascist_events.06.desc:0 "Maalesef, [FROM.GetLeader] tüm Etiyopya'yı fethetmeye kararlı görünüyor. [FROM.GetNameDefCap], herhangi bir barış antlaşmasını tartışmayı açıkça reddetti ve çatışmaya barışçıl bir çözüm bulma girişimlerini etkili bir şekilde öldürdü. Şimdi tek umudumuz imparatorun arkasında toplanmak ve askeri bir zafer elde etmeye çalışmak."
 BBA_ethiopia_fascist_events.06.t:0 "İtalyanlar İşbirliği Yapmayı Reddediyor"
 BBA_ethiopia_fascist_events.07.a:0 "Zafere doğru"
 BBA_ethiopia_fascist_events.07.desc:0 "[ROOT.GetEthiopianCollaboratorName], imparatora karşı İtalyanlar için açıkça ilan etti ve bunun yeni bir [ROOT.GetName]'ın doğuşu olduğunu belirtti. Umutsuz bir durumda olmasına rağmen, $ETH_haile_selassie$ ancak yenilgiyi kabul etmeyi reddediyor. Çatışma zaten başladı ve eski muhafızların çoğu hala imparatorun yanında olsa da, savaş büyük olasılıkla sadece bir yönde gidebilir."
 BBA_ethiopia_fascist_events.07.t:0 "Etiyopya İç Savaşı"
 BBA_ethiopia_fascist_events.10.a:0 "Güzel"
 BBA_ethiopia_fascist_events.10.desc:0 "Düşman kuvvetlerinin teslim olmasıyla, yüksek rütbeli subaylardan birkaçı elimize geçti. Şimdilik hapsedilecekler, ama umarım daha sonra bazılarının davamıza katılmaya ikna edebiliriz."
 BBA_ethiopia_fascist_events.10.t:0 "Düşmanlar Yakalandı"
 BBA_ethiopia_fascist_events.20.a:0 "Onlara bir ders verilmeli"
 BBA_ethiopia_fascist_events.20.b:0 "Düşünecek daha önemli şeyler var"
 BBA_ethiopia_fascist_events.20.desc:0 "[FROM.GetLeader], [FROM.GetNameDef]'in artık [ROOT.GetAdjective] hakimiyetini kabul etmeyeceğini ilan etti. [FROM.GetNameDefCap] mümkünse [ROOT.GetNameDef] ile iyi ilişkileri sürdürmek istiyor, ancak [FROM.GetLeader] gerekirse silahlanıp bağımsızlıkları için savaşmaya hazır olduklarını belirtiyor."
 BBA_ethiopia_fascist_events.20.t:0 "[FROM.GetNameDefCap] Bağımsızlığını İlan Ediyor"
 BBA_ethiopia_fascist_events.21.a:0 "Boyunduruk kalktı"
 BBA_ethiopia_fascist_events.21.desc:0 "Oldukça şaşırtıcı bir gelişmeyle, [FROM.GetLeader] [ROOT.GetAdjective] Bağımsızlık bildirisini kabul etti. Bu noktadan sonra, [FROM.GetNameDef]'in [ROOT.GetAdjective] siyaseti üzerinde ne iç ne de dış hiçbir etkisi yoktur. [ROOT.GetLeader]'ın liderliğini kutlayan devasa bir kalabalık [ROOT.Capital.GetCapitalVictoryPointName]'ın ana meydanında toplandı."
 BBA_ethiopia_fascist_events.21.t:0 "[ETH.GetAdjective] Onuru Geri Kazanıldı"
 BBA_ethiopia_fascist_events.22.a:0 "Özgürlüğümüzü kazanacağız"
 BBA_ethiopia_fascist_events.22.desc:0 "Beklendiği gibi, [FROM.getLeader] [ROOT.GetLeader]'dan gelen resmi bağımsızlık talebini reddetti. Bu beklenen bir gelişme olduğu için, [ROOT.GetAdjective] silahlı kuvvetleri zaten ülkedeki kilit pozisyonları güvence altına alıyor. Ulus bu sefer çok daha iyi hazırlanmış durumda."
 BBA_ethiopia_fascist_events.22.t:0 "Mücadele Yeniden Başlıyor"
 BBA_ethiopia_fascist_events.23.a:0 "Çok hoş bir yardım"
 BBA_ethiopia_fascist_events.23.desc:0 "Düşman hatlarının gerisinde organize direniş savaşçıları grupları ayaklandı. Bu düzensizler, [ITA.GetAdjective] zalimlerine karşı bizimle savaşıyor. Savaş değerleri en yüksek olmayabilir, ancak düşman silahlı kuvvetlerine kesinlikle kafa karışıklığı ve aksaklık yaratacaklardır."
 BBA_ethiopia_fascist_events.23.t:0 "Direniş Savaşçıları"
 BBA_ethiopia_fascist_events.50.a:0 "Dişimizi sıkıp kaybı kabul etmeliyiz."
 BBA_ethiopia_fascist_events.50.b:0 "Böyle bir aşağılanmaya katlanmayacağız!"
 BBA_ethiopia_fascist_events.50.desc:0 "Eve daha yakın meselelere odaklanmamızla, [ETH.GetAdjective] hükûmeti durumdan yararlandı ve [ROOT.GetAdjective] Somaliland'ı kendilerinin olarak iddia etti. Kopuk ve direnme umudu çok az olan bölgedeki [Root.GetAdjective] yetkilileri, toprağı devretmeye basitçe uydular. Bu aşağılanmayı resmi olarak kabul edip etmeyeceğimize veya haklı toprağımızı geri almaya karar verip vermeyeceğimize karar vermeliyiz."
 BBA_ethiopia_fascist_events.50.t:0 "[ETH.GetAdjective] Kuvvetleri [ROOT.GetAdjective] Somaliland'ı İşgal Etti"
 BBA_ethiopia_fascist_events.51.a:0 "[ETH.GetName] güçleniyor!"
 BBA_ethiopia_fascist_events.51.desc:0 "[FROM.GetName]'ın artakalan devleti, eski [FROM.GetAdjective] Somaliland toprağı üzerindeki kontrolümüzü resmi olarak kabul etti. Toprağı geri almak için çok az imkanları olduğundan, kahramanca silahlı kuvvetlerimizle çatışmaya girmek yerine eve daha yakın meselelere odaklanmayı tercih ediyor gibi görünüyorlar."
 BBA_ethiopia_fascist_events.51.t:0 "[FROM.GetName] Somaliland'ın [ETH.GetAdjective] Kontrolünü Kabul Ediyor"
 BBA_ethiopia_fascist_events.52.a:0 "Yakın zamanda bir savaş kaybettiler ve bir tane daha kaybetmek üzereler."
 BBA_ethiopia_fascist_events.52.desc:0 "Şaşırtıcı bir gelişmeyle, [FROM.GetName]'ın artakalan devleti, eski [FROM.GetAdjective] Somaliland toprağı üzerindeki mülkiyet iddialarımızı reddetti. Toprağı geri almak için çok az imkanları olmasına rağmen, kalan askerlerini kahramanca silahlı kuvvetlerimize karşı ölüme göndermeye kararlı görünüyorlar."
 BBA_ethiopia_fascist_events.52.t:0 "[FROM.GetName] Somaliland'ın [ETH.GetAdjective] Kontrolünü Reddediyor"
 BBA_ethiopia_fascist_events.53.a:0 "Her askerin bir tüfeğe ihtiyacı var."
 BBA_ethiopia_fascist_events.53.b:0 "Topçu, düşmanlarımızı caydıracaktır."
 BBA_ethiopia_fascist_events.53.desc:0 "Ekonomimizi reforme etmede ve ordumuzu güçlendirmede büyük ilerleme kaydederken, bu görevlerde hala biraz destekten faydalanabiliriz. [ITA.GetAdjective]larla derinleşen ilişkilerimiz nedeniyle, bize fazla teçhizatlarından bazılarını göndermeye açık olabilirler. Sadece ne talep etmemiz gerektiğine karar vermeliyiz."
 BBA_ethiopia_fascist_events.53.t:0 "[ITA.GetAdjective] Teçhizatı Talep Et"
 BBA_ethiopia_fascist_events.54.a:0 "Kesinlikle birkaç eski teçhizat ayırabiliriz."
 BBA_ethiopia_fascist_events.54.b:0 "Hayır, [FROM.GetName]'ın daha da güçlenmesini istemiyoruz."
 BBA_ethiopia_fascist_events.54.desc:0 "[FROM.GetName]'dan askeri teçhizat talebi aldık. Bu, [FROM.GetAdjective] ordusunun modernizasyonuna yardımcı olmak için uzun bir yol kat edecektir. Ayrıca eski fazla teçhizatımızın bir kısmını temizlememize de yardımcı olacaktır."
 BBA_ethiopia_fascist_events.54.t:0 "[FROM.GetName] Askerî Teçhizat Talep Ediyor"
 BBA_ethiopia_fascist_events.55.a:0 "Onlara güvenilemeyeceğini biliyorduk."
 BBA_ethiopia_fascist_events.55.desc:0 "Gereksiz yere kaba bir yanıtla, [ITA.GetAdjective] hükûmeti askeri teçhizat talebimizi reddetti. Bu kararın arkasındaki gerekçe henüz net değil. Modernizasyon planına devam etmek için sadece kendi sanayimize güvenmeliyiz."
 BBA_ethiopia_fascist_events.55.t:0 "[ITA.GetName] Askerî Teçhizat Göndermeyi Reddediyor"
 BBA_ethiopia_fascist_events.56.a:0 "Onlardan hiç şüphe etmedik."
 BBA_ethiopia_fascist_events.56.desc:0 "[ITA.GetAdjective] hükûmeti askeri teçhizat talebimizi onayladı. Kesinlikle en iyi teçhizatları olmasa da, bu kesinlikle modernizasyon planlarımızı hızlandıracaktır."
 BBA_ethiopia_fascist_events.56.t:0 "[ITA.GetName] Askerî Teçhizat Göndermeyi Kabul Ediyor"
 BBA_ethiopia_fascist_events.57.a:0 "[FROM.GetName]'ı güçlendirmek, bölgedeki kuvvetlerimizi serbest bırakacaktır."
 BBA_ethiopia_fascist_events.57.b:0 "Tasarımlarımızın düşman eline geçme riskini göze alamayız."
 BBA_ethiopia_fascist_events.57.desc:0 "[FROM.GetName], [ITA.GetAdjective] şirketlerinin askeri teçhizat üretimi için ülkelerinde fabrikalar kuracağı bir silah dış kaynak kullanımı anlaşması talep etti. Seçilen şirketlerin kurumsal liderliği şüphesiz bu genişleme fırsatı için minnettar olacaktır. Ancak, [FROM.GetName] bir gün isyan ederse, birçok zayıf yönümüzü bilen bir düşmanla savaşıyor olacağız."
 BBA_ethiopia_fascist_events.57.t:0 "[FROM.GetName] Silah Dış Kaynak Kullanımı Anlaşması Talep Ediyor"
 BBA_ethiopia_fascist_events.58.a:0 "[ETH.GetName] için harika bir gün"
 BBA_ethiopia_fascist_events.58.desc:0 "Diplomatlarımızın itibarına, [ITA.GetLeader] [ITA.GetAdjective] şirketlerinin ülkemizde fabrikalar kurmasına izin verdi. Bu, kendi askeri teçhizatımızı araştırma ve üretme yeteneğimizi hızla artıracaktır."
 BBA_ethiopia_fascist_events.58.t:0 "[ITA.GetName] Dış Kaynak Kullanımı Anlaşmasını Kabul Ediyor"
 BBA_ethiopia_fascist_events.59.a:0 "Kaçırılmış bir fırsat."
 BBA_ethiopia_fascist_events.59.desc:0 "Aşağılık diplomatlarımız, [ITA.GetLeader]'ı silah dış kaynak kullanımı anlaşmamızın gerekliliğine ikna edemedi. Bu, askeri ve endüstriyel gelişimimiz için yıkıcı bir darbedir."
 BBA_ethiopia_fascist_events.59.t:0 "[ITA.GetName] Dış Kaynak Kullanımı Anlaşmasını Reddediyor"
 BBA_ethiopia_fascist_events.60.a:0 "Ordu her şeyden önce modernize edilmeli."
 BBA_ethiopia_fascist_events.60.b:0 "Hava kuvvetleri gelecekteki savaşlarda daha önemli olacak."
 BBA_ethiopia_fascist_events.60.desc:0 "[ITA.GetAdjective]lar, düşman eline geçme korkusuyla tüm endüstriyel sırlarını bizimle paylaşmaya istekli olmayacaklar. Bu nedenle, ordumuzun hangi yönünün [ITA.GetAdjective] tasarımcılarına dış kaynak üretiminden en çok fayda sağlayabileceğini dikkatlice düşünmeliyiz."
 BBA_ethiopia_fascist_events.60.t:0 "Dış Kaynak Silah Üretimi"
 BBA_ethiopia_fascist_events.61.a:0 "Bu [ITA.GetAdjective]ları meşgul etmeli."
 BBA_ethiopia_fascist_events.61.b:0 "Potansiyel bir düşmana yardım etmeyeceğiz."
 BBA_ethiopia_fascist_events.61.desc:0 "[ETH.GetAdjective] diplomatları, gizli bir silah tedariki talebiyle bize geldi. Görünüşe göre [ITA.GetName]’in yakın zamanda edindiği topraklarda işler yolunda değil ve yerel yönetim, efendilerini devirebilmek için dış yardım arıyor. İsyan başarısız olsa bile, şüphesiz [ITA.GetAdjective] ordusunu oyalayacak ve zayıflatacaktır. Ancak, isyanı desteklediğimiz ortaya çıkarsa sonuçları olabilir."
 BBA_ethiopia_fascist_events.61.t:0 "[FROM.GetName], [ITA.GetAdjective] Yönetimini Devirmek İçin Silah Talep Ediyor"
 BBA_ethiopia_fascist_events.62.a:0 "Zafer ufukta."
 BBA_ethiopia_fascist_events.62.desc:0 "[FROM.GetAdjective] diplomatları, [ITA.GetAdjective] güçlerini devirmeye hazırlanırken bize silah göndermeye istekli olduklarını bildirdi. Elbette, [ITA.GetAdjective] güçleri silahları keşfederse, onlarla herhangi bir ilgimiz olduğunu tamamen inkâr etmemiz talimatı verildi."
 BBA_ethiopia_fascist_events.62.t:0 "[FROM.GetName] Silah Talebini Kabul Ediyor"
 BBA_ethiopia_fascist_events.63.a:0 "Ne kadar dar görüşlüler."
 BBA_ethiopia_fascist_events.63.desc:0 "[FROM.GetAdjective] diplomatları, gizli silah tedarik etme girişimlerimizi geri çevirdi. Görünüşe göre, hala [ITA.GetAdjective] etkisi altındayken ne kadar güvenilir olduğumuzdan emin değiller. Ayrıca bu çalkantılı zamanlarda [ITA.GetAdjective] rejimini kızdırma riskinden çekiniyor olabilirler."
 BBA_ethiopia_fascist_events.63.t:0 "[FROM.GetName] Silah Talebini Reddediyor"
 BBA_ethiopia_fascist_events.64.a:0 "Sadakatlerini ödüllendireceğiz."
 BBA_ethiopia_fascist_events.64.b:0 "Talepte bulunacak durumda değiller."
 BBA_ethiopia_fascist_events.64.desc:0 "[ETH.GetLeader], [ITA.GetName]'a olan sürekli sadakati karşılığında bir ödül veya bakış açısına göre bir tazminat olarak [550.GetName]'ın kontrolünü talep etti. [ETH.GetLeader], Etiyopya'yı işgal ederken kilitlenmeyi kırmada çok önemliydi ve bu, iyi ilişkileri sürdürmede uzun bir yol kat edecektir. Ancak, [ITA.GetAdjective] halkı neden toprak verdiğimizi o kadar da anlayışla karşılamayabilir."
 BBA_ethiopia_fascist_events.64.t:0 "[FROM.GetName], [550.GetName]'ın Kontrolünü Talep Ediyor"
 BBA_ethiopia_fascist_events.65.a:0 "Sadakatlerini ödüllendireceğiz."
 BBA_ethiopia_fascist_events.65.b:0 "Talepte bulunacak durumda değiller."
 BBA_ethiopia_fascist_events.65.desc:0 "[ETH.GetLeader], [ITA.GetName]'a olan sürekli sadakati karşılığında bir ödül veya bakış açısına göre bir tazminat olarak [559.GetName] ve [844.GetName]'ın kontrolünü talep etti. [ETH.GetLeader], Etiyopya'yı işgal ederken kilitlenmeyi kırmada çok önemliydi ve bu, iyi ilişkileri sürdürmede uzun bir yol kat edecektir. Ancak, [ITA.GetAdjective] halkı neden toprak verdiğimizi o kadar da anlayışla karşılamayabilir."
 BBA_ethiopia_fascist_events.65.t:0 "[FROM.GetName], [559.GetName] ve [844.GetName]'ın Kontrolünü Talep Ediyor"
 BBA_ethiopia_fascist_events.66.a:0 "Gelecek [ETH.GetAdjective] halkınındır."
 BBA_ethiopia_fascist_events.66.desc:0 "[ITA.GetName], talep edilen toprakların kontrolü talebimizi lütfederek kabul etti. Bu, İtalya-[ETH.GetAdjective] ilişkilerinde yeni bir bölümün başlangıcını işaret ediyor."
 BBA_ethiopia_fascist_events.66.t:0 "[ITA.GetName] Toprak Tazminatını Kabul Ediyor"
 BBA_ethiopia_fascist_events.67.a:0 "Sadakatimizi sınıyorlar..."
 BBA_ethiopia_fascist_events.67.desc:0 "[ITA.GetAdjective] diplomatları, toprak tazminatı talebimize öfkeyle yanıt verdi. Kanlarıyla ödendiğinde kimseye toprak vermenin [ITA.GetAdjective] halkı için kabul edilemez olacağını, hele ki eski bir düşmana vermenin söz konusu bile olamayacağını savunuyorlar."
 BBA_ethiopia_fascist_events.67.t:0 "[ITA.GetName] Toprak Tazminatını Reddediyor"
 BBA_ethiopia_fascist_events.68.a:0 "Ne kadar çirkin bir suçlama."
 BBA_ethiopia_fascist_events.68.desc:0 "Dün gece, bir [ITA.GetAdjective] silah deposu başarıyla basıldı ve silahlardan arındırıldı. İtalyan yetkililer, çok az kanıtları olmasına rağmen, yönetimimizi olayı düzenlemekle öfkeyle suçluyorlar. Gerçi, yepyeni [ITA.GetAdjective] tüfekleriyle poz veren askerlerimizden şüphelenebilirler..."
 BBA_ethiopia_fascist_events.68.t:0 " [ITA.GetAdjective] Deposu Basıldı"
 BBA_ethiopia_fascist_events.69.a:0 "Daha güçlü bir [FROM.GetName], bize daha yakın bölgelere odaklanmamızı sağlar."
 BBA_ethiopia_fascist_events.69.b:0 "Subaylarımıza başka yerlerde ihtiyaç var."
 BBA_ethiopia_fascist_events.69.desc:0 "[ETH.GetName]’in liderliği, ordularının zayıflığını kabul etti ve bu nedenle desteğimizi talep etti. Subaylarımızdan bazılarının genelkurmaylarına katılmalarına ve onlara modern savaş araçlarını en iyi nasıl kullanacakları konusunda tavsiyelerde bulunmalarına izin verip vermeyeceğimizi merak ediyorlar."
 BBA_ethiopia_fascist_events.69.t:0 "[FROM.GetName] Askerî Danışman Talep Ediyor"
 BBA_ethiopia_fascist_events.70.a:0 "Mükemmel."
 BBA_ethiopia_fascist_events.70.desc:0 "[FROM.GetName], askeri subaylarından bazılarının öngörülebilir bir gelecek için genelkurmayımıza katılmasına izin vermeyi kabul etti. Umarım yeni teçhizatımızı modern savaş alanında en iyi nasıl kullanacağımızı öğreniriz."
 BBA_ethiopia_fascist_events.70.t:0 "[FROM.GetName] Subay Göndermeyi Kabul Ediyor"
 BBA_ethiopia_fascist_events.71.a:0 "Hiç yoktan iyidir."
 BBA_ethiopia_fascist_events.71.desc:0 "[FROM.GetName], askeri subaylarının genelkurmayımıza katılmasına izin vermeyi reddetti. Şu anda başka yerlerde ihtiyaç duyuldukları konusunda bilgilendirildik. Ancak, destek işareti olarak bize ekstra bir piyade teçhizatı sevkiyatı gönderildi."
 BBA_ethiopia_fascist_events.71.t:0 "[FROM.GetName] Subay Göndermeyi Reddediyor"
 BBA_ethiopia_imperial_events.1.a:0 "Parayı iyi bir şekilde kullanabiliriz"
 BBA_ethiopia_imperial_events.1.b:0 "Burası [ROOT.GetAdjective]'dir ve öyle kalacaktır!"
 BBA_ethiopia_imperial_events.1.desc:0 "[FROM.GetLeader], [ROOT.GetAdjective] sömürgesi olan [268.GetName]'ı satın almak istiyor. Bu satın alma, [FROM.GetNameDef]'e Cibuti limanı üzerinden denize erişim sağlayacak, ki buraya Addis Ababa'dan zaten bir demiryolu bağlantısı var. Böyle önemsiz bir sömürge için iyi bir meblağ teklif ediyorlar."
 BBA_ethiopia_imperial_events.1.t:0 "[FROM.GetName] Cibuti'yi satın almak istiyor"
 BBA_ethiopia_imperial_events.10.a:0 "Başka seçeneğimiz yok..."
 BBA_ethiopia_imperial_events.10.b:0 "Tehdit edilmeyeceğiz."
 BBA_ethiopia_imperial_events.10.desc:0 "[FROM.GetNameDefCap], boyun eğmemizi ve uluslarına entegrasyonumuzu talep etti. Eğer uyarsak, bu tabii ki [THIS.GetName]'ın bağımsız bir ulus olarak sonu olacaktır. [FROM.GetLeader]'ın entegrasyonu sağlamak için ne kadar ileri gitmeye istekli olduğu açık değil, ancak silahlı çatışma olasılığı henüz göz ardı edilemez."
 BBA_ethiopia_imperial_events.10.t:0 "[FROM.GetNameDefCap] Ültimatom Gönderiyor"
 BBA_ethiopia_imperial_events.11.a:0 "Buna bir son vereceğiz."
 BBA_ethiopia_imperial_events.11.b:0 "Uğraşmamız gereken daha önemli konular var."
 BBA_ethiopia_imperial_events.11.desc:0 "[FROM.GetNameDefCap], yeniden entegrasyon taleplerimizi kabul etmeyi reddetti. Defalarca [FROM.GetName], kendilerini korumak için bize ihanet etmeye istekli oldu, bunun tekrar olmasına izin veremeyiz."
 BBA_ethiopia_imperial_events.11.t:0 "[FROM.GetNameDefCap] Ültimatomu Reddetti"
 BBA_ethiopia_imperial_events.12.a:0 "Endişelenecek bir şey daha azaldı."
 BBA_ethiopia_imperial_events.12.desc:0 "[FROM.GetNameDefCap], [THIS.GetName] ile yeniden entegrasyon ihtiyacını kabul etti. [FROM.GetLeader] şimdi majesteleri [THIS.GetLeader]'a bağlılık yemini etti."
 BBA_ethiopia_imperial_events.12.t:0 "[FROM.GetNameDefCap] Talepleri Kabul Etti"
 BBA_ethiopia_imperial_events.2.a:0 "Harika haber"
 BBA_ethiopia_imperial_events.2.desc:0 "[268.GetName] sömürgesinin potansiyel satın alınması konusundaki [FROM.GetAdjective] hükûmeti ile yapılan müzakereler başarıyla sonuçlandı. [FROM.GetNameDefCap], Cibuti limanını ve çevresindeki bölgeyi derhal [ROOT.GetName]'a devretmeyi kabul etti, böylece hem bize bir limana erişim sağladı hem de Afar halkını tek bir hükümdar altında birleştirdi."
 BBA_ethiopia_imperial_events.2.t:0 "[FROM.GetNameDefCap] Cibuti'yi Satmayı Kabul Ediyor"
 BBA_ethiopia_imperial_events.20.a:0 "Kızıl Ras, [ETH.GetNameDef]'i yönetmeli"
 BBA_ethiopia_imperial_events.20.b:0 "Veliaht Prensi anayasal bir hükümdar olarak atamak daha güvenli"
 BBA_ethiopia_imperial_events.20.desc:0 "[ETH.GetName]'ın orta sınıfından ve köylülüğünden destek toplayan Ras $ETH_ras_imru_haile_selassie$, $ETH_haile_selassie$'nin resmi olarak tahttan indirildiğini ve [ETH.GetNameDef]'de genel seçimlerin başlatıldığını duyurdu. Halk tarafından ve bu durumda daha da önemlisi, [ETH.GetAdjective] ordusu tarafından, ikinci İtalya-Etiyopya Savaşı'nda gerçek kahraman olarak kabul edilen o, ordunun sadakatini ve bulunmayan imparatora olan desteği sağlamayı başardı."
 BBA_ethiopia_imperial_events.20.t:0 "$ETH_ras_imru_haile_selassie$ tarafından kansız darbe"
 BBA_ethiopia_imperial_events.21.a:0 "Yönetimimize öyle ya da böyle boyun eğecekler."
 BBA_ethiopia_imperial_events.21.desc:0 "Birliklerimiz [ETH.GetAdjective] kuvvetlerini yarmaya devam ederek üstün yönetimimiz için yol açıyor. Ancak, yeni egemenliğimiz boyunca direniş faaliyetlerinde bir artış görüyoruz. Görünüşe göre eski hükümdar $ETH_haile_selassie$'nin Milletler Cemiyeti'nde konuşması, yeni tebaamızın çoğunu bir çılgınlığa sürükledi. Görünüşe göre imparatorları yaşadığı sürece, direniş sömürge yönetimimizin yanında bir diken olacak."
 BBA_ethiopia_imperial_events.21.t:0 "[ETH.GetName]'da Direniş"
 BBA_ethiopia_imperial_events.3.a:0 "Başka yöntemler düşünmek zorunda kalacağız"
 BBA_ethiopia_imperial_events.3.desc:0 "Maalesef, [FROM.GetAdjective] hükûmeti Cibuti limanını onlardan satın alma talebimizi reddetti. Karşılıklı faydayı görmek yerine, umutsuzca sömürgelerine yapışıyorlar ve ele geçirdikleri toprağın bir karışından bile vazgeçmeyi reddediyorlar."
 BBA_ethiopia_imperial_events.3.t:0 "[FROM.GetName] Cibuti'yi Satmayı Reddediyor"
 BBA_ethiopia_imperial_events.4.a:0 "Ne garip bir talep, ama neden olmasın?"
 BBA_ethiopia_imperial_events.4.b:0 "Siyon imparatorluğunun bir parçası olacağız"
 BBA_ethiopia_imperial_events.4.c:0 "Asla olmaz!"
 BBA_ethiopia_imperial_events.4.desc:0 "[689.GetName]'daki Rastafaryan hareketi, $ETH_haile_selassie$'nin Mesih veya Jah, yani tanrılarının adı, reenkarnasyonu olduğunu iddia ediyor. Biraz beklenmedik bir şekilde, $ETH_haile_selassie$ bu ünü benimsedi ve [FROM.GetAdjective] hükûmeti, hareketin anavatanı olan, yani [689.GetName]'ın [FROM.GetAdjective] imparatorluğuna dahil edilmesini talep etti."
 BBA_ethiopia_imperial_events.4.t:0 "[FROM.GetNameDefCap], [689.GetName]'ı Talep Ediyor."
 BBA_ethiopia_imperial_events.5.a:0 "Aydınlanmayı gördüler"
 BBA_ethiopia_imperial_events.5.desc:0 "[689.GetName]'ın kontrolünün devredilmesi yönündeki mütevazı talebimiz [FROM.GetNameDef] tarafından kabul edildi. Bu, yeni bir dönemin başlangıcını işaret ediyor. Şan olsun $ETH_haile_selassie$'ye. Umarım bu, Amerika kıtasının dört bir yanından takipçiler çekebileceğimiz anlamına gelir."
 BBA_ethiopia_imperial_events.5.t:0 "[FROM.GetNameDefCap] Talebimizi Kabul Etti"
 BBA_ethiopia_imperial_events.6.a:0 "Ne cüret!"
 BBA_ethiopia_imperial_events.6.desc:0 "Tüm çabalarımıza rağmen, [FROM.GetAdjective] hükûmetini [689.GetName]'ın [ROOT.GetAdjective]'in bir parçası olduğuna ikna edemedik. Talebimize güldüler, hatta büyük liderimizin kutsallığından bile şüphe ettiler."
 BBA_ethiopia_imperial_events.6.t:0 "[FROM.GetNameDefCap], [689.GetName]'ı Devretmeyi Reddediyor"
 BBA_ethiopia_imperial_events.7.a:0 "Bu iyi bir fikir gibi görünüyor"
 BBA_ethiopia_imperial_events.7.b:0 "Tamamen aklını kaçırmışlar"
 BBA_ethiopia_imperial_events.7.desc:0 "[689.GetName]'daki Rastafaryan hareketi, $ETH_haile_selassie$'nin Mesih veya Jah, yani tanrılarının adı, reenkarnasyonu olduğunu iddia ediyor. Biraz beklenmedik bir şekilde, $ETH_haile_selassie$ bu ünü benimsedi. Bunun bir sonucu olarak, [FROM.GetLeader.GetSheHe] şimdi [ROOT.GetNameDef]'in resmi olarak [FROM.GetAdjective]'e katılmasını ve Karayipler'de, nüfuzun dünyanın geri kalanına yayılabileceği yeni bir güç üssü yaratmasını talep ediyor."
 BBA_ethiopia_imperial_events.7.t:0 "[FROM.GetLeader] Teslimiyet Talep Ediyor"
 BBA_ethiopia_imperial_events.8.a:0 "Şan olsun [ROOT.GetLeader]'a"
 BBA_ethiopia_imperial_events.8.desc:0 "[FROM.GetLeader], hakimiyetimizi kabul etme bilgece kararını verdi. [FROM.GetName], [ROOT.GetLeader]'ın sadık bir bağlı devleti olacaktır."
 BBA_ethiopia_imperial_events.8.t:0 "[FROM.GetNameDefCap] Teslim Oluyor"
 BBA_ethiopia_imperial_events.9.a:0 "Hepsini kazanamazsın"
 BBA_ethiopia_imperial_events.9.desc:0 "Maalesef, [FROM.GetNameDef], [ROOT.GetLeader]'ın bir bağlı devleti olma lütufkâr teklifini reddetti. Tüm çabalarımıza rağmen, [FROM.getName] hükûmetini bunun gerçekten her iki tarafın da yararına olduğuna ikna edemedik."
 BBA_ethiopia_imperial_events.9.t:0 "[FROM.GetNameDefCap] Teslim Olmayı Reddediyor"
 BBA_ethiopia_industrial_financial_events.2.a:0 "Bunu yapmaya hakları yok!"
 BBA_ethiopia_industrial_financial_events.2.b:0 "Bir tür özerklik koruyabildiğimiz sürece"
 BBA_ethiopia_industrial_financial_events.2.c:0 "Bu gerçekten her iki ülkemizin de iyiliği için"
 BBA_ethiopia_industrial_financial_events.2.desc:0 "[ROOT.GetName] ve [FROM.GetName] ekonomilerinin ne kadar iç içe olduğu ve [ROOT.GetName]'daki sanayinin çoğunun zaten [FROM.GetName] tarafından kontrol edildiği gerçeğini öne sürerek, [FROM.GetLeader] iki ülke arasındaki sınır istasyonlarının kaldırılmasını talep ediyor. Tüm dış politikanın kontrolü, maksimum koruma, koordinasyon ve verimlilik sağlamak için [FROM.Getname]'ın kontrolü altına alınacaktır. Bu, etkili bir şekilde [ROOT.GetAdjective] bağımsızlığının sonu anlamına gelecektir.\n Tüm bunlar, [FROM.GetLeader]'ın temin ettiği gibi, her iki ülkenin de en iyi çıkarı göz önünde bulundurularak yapılacaktır."
 BBA_ethiopia_industrial_financial_events.2.t:0 "[FROM.GetNameDefCap] Entegrasyon Talep Ediyor"
 BBA_ethiopia_industrial_financial_events.3.a:0 "Çıkarlarımızı korumak için zor kullanmak zorunda kalabiliriz"
 BBA_ethiopia_industrial_financial_events.3.desc:0 "Durumu açıklamak için elimizden gelenin en iyisini yapmamıza rağmen, [FROM.GetLeader] ekonomilerimizin entegrasyonunu bir sonraki seviyeye taşıma taleplerimize uymayı reddediyor. [FROM.GetLeader], [FROM.GetName]'ın bağımsızlığının lekelenmemesi gerektiğini ve asla herhangi bir tartışmanın parçası olamayacağını iddia ediyor."
 BBA_ethiopia_industrial_financial_events.3.t:0 "[FROM.GetName] İşbirliği Yapmayı Reddediyor"
 BBA_ethiopia_industrial_financial_events.4.a:0 "Bu kesinlikle karşılanabilir"
 BBA_ethiopia_industrial_financial_events.4.desc:0 "[FROM.GetLeader], işbirliğimizi daha da ileri götürme ve dış ve mali politikayı bugünkünden daha da fazla koordine etme ihtiyacını gördü. Ancak, [FROM.GetLeader.GetSheHe] [FROM.GetNAme]'ın yeni federasyon içinde bir dereceye kadar özerkliği korumasını istiyor."
 BBA_ethiopia_industrial_financial_events.4.t:0 "[FROM.GetName] Kısmi Kontrolü Elde Tutmak İstiyor"
 BBA_ethiopia_industrial_financial_events.5.a:0 "Bu herkesin yararınadır"
 BBA_ethiopia_industrial_financial_events.5.desc:0 "[FROM.GetLeader], [ROOT.GetName] ve [FROM.GetName]'ı birleştiren belgeyi imzaladı. Ekonomik politikalar hizalanacak, dışişleri ofisleri tek bir ofiste birleştirilecek. Tam işbirliğini kolaylaştırmak için adli sistemler birleştirilecektir.\n[FROM.GetNameDefCap] bu günden itibaren [ROOT.GetName]'ın ayrılmaz bir parçası olacaktır."
 BBA_ethiopia_industrial_financial_events.5.t:0 "[FROM.GetLeader] Kabul Ediyor"
 BBA_ethiopia_is_expelled_tt:0 "§Y[ETH.GetNameWithFlag]§!'ın hükûmeti §Y[ENG.GetNameWithFlag]§!'dan kovulur ve sürgündeki hükûmetlerini başka bir yerde kurabilir."
 BBA_ethiopia_military_and_tech_events.1.a:0 "Okul, saldırı odaklılığımızı koruyacak"
 BBA_ethiopia_military_and_tech_events.1.b:0 "Okul, daha savunmacı bir zihniyete geçmemize yardımcı olacak"
 BBA_ethiopia_military_and_tech_events.1.c:0 "Okul, savaşa asla hazırlıksız yakalanmamamızı sağlayacak"
 BBA_ethiopia_military_and_tech_events.1.t:0 "[GetEthiopianMilitaryAcademyName]'nin ilk sınıfı"
 BBA_ethiopia_military_and_tech_events.1_peace.desc:0 "Savaş geride kaldığına göre, şimdi askeri akademimizin oluşturulmasını tamamlama şansımız var. İlk sınıf Harbiyeliler, ulusumuzun gelecekteki savaşları kazanmasına yardımcı olabilir ve İtalyanlarla savaşma deneyimimizden en iyi şekilde yararlanmamızı sağlayabilir."
 BBA_ethiopia_military_and_tech_events.1_war.desc:0 "[GetEthiopianMilitaryAcademyName]'ni bitiren ilk sınıf, doğrudan okuldan savaşa gitmek zorunda kalacak. Bu okulu inşa etmeyi ve aynı zamanda savaşırken ilk sınıf Harbiyelilerin eğitimini tamamlamayı başarmak, gerçekten büyük bir başarıdır. \nBu, [ROOT.GetAdjective] ordusu için yeni bir dönemin başlangıcıdır!"
 BBA_italo_ethiopian_war_events.01.a:0 "Ne pahasına olursa olsun"
 BBA_italo_ethiopian_war_events.01.b:0 "Metodik ve bilinçli olmalıyız"
 BBA_italo_ethiopian_war_events.01.desc:0 "Habeşistan'a karşı savaşta birliklerimiz durakladı ve hatta bazı yerlerde geri püskürtüldü. Bu “Noel Taarruzu” Mussolini'nin beceriksizlikleri nedeniyle askeri yüksek komutayı özel olarak azarlamasına neden oldu. Duce sonuç istiyor. Şimdi. \n\n Bu nedenle, Habeşleri püskürtmek ve bu savaşı hızla sona erdirmek için ne pahasına olursa olsun gerekli her türlü araca izin verdi."
 BBA_italo_ethiopian_war_events.01.t:0 "Noel Taarruzunu Bitir"
 BBA_italo_ethiopian_war_events.02.a:0 "İstilacıları yok et!"
 BBA_italo_ethiopian_war_events.02.desc:0 "İtalyanlar savaşta inisiyatifi yeniden kazanmaya çalışıyor. Hatlarımızı kırmak ve [ROOT.GetAdjective] İmparatorluğu'nu tek bir darbeyle ezmek amacıyla büyük bir taarruz başlatıyorlar.\nKuvvetlerimiz dayanmalı. Kuvvetlerimizin yoğun bombardıman ve tanklar ile topçu saldırılarına karşı yeterince uzun süre dayanması hayati önem taşıyor, böylece uluslararası toplumu bizim adımıza hareket etmeye ikna etmek için zamanımız olur."
 BBA_italo_ethiopian_war_events.02.t:0 "Büyük İtalyan Taarruzu"
 BBA_italo_ethiopian_war_events.03.a:0 "Riskler artıyor."
 BBA_italo_ethiopian_war_events.03.desc:0 "Saldırımız İtalyanları geri püskürttü ama amacına ulaşamadı. Birliklerimizin ivmesi tükendi ve İtalyanlar saldırımızın şokunu atlatmaya çalışıyorlar.\nİstihbarat raporları, geçen sefere göre daha iyi hazırlanmış yeni bir saldırı hazırladıklarını gösteriyor. Güçlerimiz dayanmalı. Onları ülkemizden ne kadar uzun süre uzak tutabilirsek, o kadar çok taahhütte bulunmak zorunda kalacaklar ve bunun küçük bir \"sömürge çatışması\" değil, bir üye ülkenin diğerine karşı acımasız bir saldırısı olduğuna Milletler Cemiyeti'ni ikna etmek o kadar kolay olacaktır."
 BBA_italo_ethiopian_war_events.03.t:0 "İtalyan Yığınağı"
 BBA_italo_ethiopian_war_events.10.a:0 "Yapılması gereken doğru şey bu"
 BBA_italo_ethiopian_war_events.10.b:0 "Ekonomimizi riske atamayız"
 BBA_italo_ethiopian_war_events.10.c:0 "Hayır, [ITA.GetName] bizim dostumuzdur"
 BBA_italo_ethiopian_war_events.10.desc:0 "Milletler Cemiyeti Konseyi, [ITA.GetNameDef]'in [ETH.GetNameDef]'e karşı yasadışı saldırganlığına yanıt olarak ülke ile ticarete tam bir ambargo uygulama kararı aldı. Yaptırımlar, savaş teçhizatı üretimi için kullanılabilecek her türlü kaynağı içeriyor. Derhal uygulanacak ve ülke [ETH.GetNameDef]'e karşı düşmanlıkları durdurana kadar yürürlükte kalacaktır."
 BBA_italo_ethiopian_war_events.10.t:0 "Milletler Cemiyeti'nin Ambargo Kararı"
 BBA_italo_ethiopian_war_events.100.a:0 "Burada hoş karşılanırlar"
 BBA_italo_ethiopian_war_events.100.b:0 "Buna izin veremeyiz"
 BBA_italo_ethiopian_war_events.100.desc:0 "[FROM.GetAdjective] büyükelçisi, [ITA.GetName]'a karşı savaş kötü giderse [ROOT.GetName]'da geçici bir Sürgün Hükûmeti kurmasına izin verilmesi için [FROM.GetLeader]'dan gelen resmi bir taleple hükûmete yaklaştı. Kabul etmek, [ITA.GetName] ile iyi ilişkileri sürdürmeyi kesinlikle daha zorlaştıracaktır."
 BBA_italo_ethiopian_war_events.100.t:0 "[FROM.GetNameDef]'den bir Talep"
 BBA_italo_ethiopian_war_events.101.a:0 "Endişelenecek bir konu daha az"
 BBA_italo_ethiopian_war_events.101.desc:0 "[FROM.GetAdjective] hükûmeti, gerekirse [ROOT.GetLeader] için ev sahibi ülke olarak hareket etme talebine olumlu yanıt verdi."
 BBA_italo_ethiopian_war_events.101.t:0 "[FROM.GetNameDefCap] Hükûmet Ağırlama Talebini Kabul Ediyor"
 BBA_italo_ethiopian_war_events.102.a:0 "O zaman başka bir yerde denemeliyiz"
 BBA_italo_ethiopian_war_events.102.desc:0 "Maalesef, [FROM.GetAdjective] hükûmeti [ITA.GetLeader]'ı üzmeye cesaret edemiyor. [ETH.GetName] düşerse orada geçici bir Hükûmet kurma talebimizi reddettiler."
 BBA_italo_ethiopian_war_events.102.t:0 "[FROM.GetNameDefCap] [ROOT.GetAdjective] Talebini Reddediyor"
 BBA_italo_ethiopian_war_events.11.a:0 "Bu onların savaş çabalarına zarar vermeli"
 BBA_italo_ethiopian_war_events.11.b:0 "Bunu yapmayacağız"
 BBA_italo_ethiopian_war_events.11.desc:0 "[ETH.GetName]'dan gelen delegeler, Milletler Cemiyeti'nde [ITA.GetNameDef]'e karşı yaptırımların artırılması olarak Süveyş Kanalı'nın [ITA.GetName] için kapatılmasını talep etti. Konseyde uzun bir tartışmanın ardından, konsey talebe uymaya karar verdi. Böylece [ROOT.GetNameDef], kanaldan geçen herhangi bir [ITA.GetAdjective] trafiğini engelleme göreviyle görevlendirildi."
 BBA_italo_ethiopian_war_events.11.t:0 "Milletler Cemiyeti Süveyş'in kapatılmasını talep ediyor"
 BBA_italo_ethiopian_war_events.110.a:0 "Şimdilik kabul etmek zorundayız"
 BBA_italo_ethiopian_war_events.110.b:0 "Hiçbir şey yapmaya cesaret edemezler"
 BBA_italo_ethiopian_war_events.110.desc:0 "Milletler Cemiyeti, [ROOT.GetName] ile [FROM.GetName] arasındaki düşmanlıkların derhal sona erdirilmesini talep etti. Konsey kararı, uymayı reddedersek üye devletlere [ROOT.GetDameDef]'e savaş ilan etme hakkı veriyor."
 BBA_italo_ethiopian_war_events.110.t:0 "Milletler Cemiyeti Barış Talep Ediyor"
 BBA_italo_ethiopian_war_events.111.a:0 "Bir nevi zafer"
 BBA_italo_ethiopian_war_events.111.desc:0 "Milletler Cemiyeti konseyinin kararından sonra, [FROM.GetLeader] liderliğindeki [FROM.GetAdjective] hükûmeti nihayet aklını başına topladı. Milletler Cemiyeti tarafından yazılan Barış antlaşması savaş öncesi sınırları yeniden tesis ediyor. Maalesef, [ROOT.GetName] için tüm tali hasarlar için herhangi bir tazminat içermiyor, ancak bize ülkeyi yeniden inşa etmeye başlama zamanı verecektir."
 BBA_italo_ethiopian_war_events.111.t:0 "[FROM.GetLeader] Barışı Kabul Ediyor"
 BBA_italo_ethiopian_war_events.112.a:0 "Daha da sıkı savaşmak zorunda kalacağız"
 BBA_italo_ethiopian_war_events.112.desc:0 "Milletler Cemiyeti konsey üyelerinden gelen savaş tehdidine rağmen, [FRON.GetLeader] [ROOT.GetName]'ın yok edilmesine niyetli olmaya devam ediyor. Konsey düşmanlıkların derhal sona erdirilmesini emretti, ancak [FROM.GetName] açıkça uymayı reddediyor."
 BBA_italo_ethiopian_war_events.112.t:0 "[FROM.GetName] Milletler Cemiyeti'ne Meydan Okuyor"
 BBA_italo_ethiopian_war_events.113.a:0 "Konuştukları tek dil zorbalıksa"
 BBA_italo_ethiopian_war_events.113.b:0 "Milletler Cemiyeti'nin Dış Politikamızı dikte etmesine izin veremeyiz"
 BBA_italo_ethiopian_war_events.113.desc:0 "Milletler Cemiyeti, [FROM.GetNameDef]'in [ETH.GetName]'a karşı saldırganlığını derhal durdurmasını talep etti. Ancak, [FROM.GetLeader] meydan okumaya devam ediyor ve uymayı reddediyor. Bu, uluslararası hukukun açık bir ihlalidir ve konsey [FROM.GetNameDef]'e karşı uluslararası eylem çağrısında bulundu."
 BBA_italo_ethiopian_war_events.113.t:0 "[FROM.GetName] Milletler Cemiyeti Kararına Uymayı Reddediyor"
 BBA_italo_ethiopian_war_events.12.a:0 "Gerçekten kimseye güvenemezsin, değil mi?"
 BBA_italo_ethiopian_war_events.12.desc:0 "[FROM.GetLeader], Milletler Cemiyeti Konseyi'ne [FROM.GetNameDef]'in Süveyş Kanalı'nı [ITA.GetName] için kapatmayacağını bildirdi. Bu, uluslararası anlaşmaların açık bir ihlalidir ve uymaya teşvik edildiğinde, [FROM.GetName] sadece Milletler Cemiyeti'nden ayrıldıklarını duyurdu."
 BBA_italo_ethiopian_war_events.12.t:0 "[FROM.GetName] Süveyş'i Kapatmayı Reddediyor"
 BBA_italo_ethiopian_war_events.120.a:0 "Daha kolay bir şeye odaklanmalıyız"
 BBA_italo_ethiopian_war_events.120.b:0 "Bu savaşı hala kazanabiliriz!"
 BBA_italo_ethiopian_war_events.120.desc:0 "[FROM.GetName]'daki savaş beklentilere göre gitmedi. Gururlu ulusumuz hızla Avrupa'nın alay konusu oluyor ve [ROOT.GetCapitalVictoryPointName]'daki kalabalıklar huzursuzlanıyor. Devrim köşede olabilir. Şimdi [FROM.GetLeader] bize bir barış teklifiyle yaklaşıyor."
 BBA_italo_ethiopian_war_events.120.t:0 "[FROM.GetName]'daki Fiyasko"
 BBA_italo_ethiopian_war_events.121.a:0 "Bu, Afrika için yeni bir başlangıcı işaret ediyor"
 BBA_italo_ethiopian_war_events.121.desc:0 "Uzun ve acı bir mücadele nihayet sona erdi. [FROM.GetLeader] taleplerimizi kabul etti ve [ROOT.GetName]'a karşı saldırganlığı durdurdu. [ROOT.GetLeader] günün kahramanıdır. [ROOT.GetLeader.GetSheHeCap], [ROOT.GetNameDef]'i bu zor zamanlarda istikrarlı bir şekilde yönlendirdi ve bir Avrupa sömürgeci gücünü başarıyla geri püskürttü."
 BBA_italo_ethiopian_war_events.121.t:0 "Zafer!"
 BBA_italo_ethiopian_war_events.122.a:0 "Savaş yeni bir aşamaya giriyor."
 BBA_italo_ethiopian_war_events.122.desc:0 "[ROOT.GetAdjective] savaşındaki başarılara rağmen, [FROM.GetAdjective] lideri yenilgiyi kabul etmeyi reddediyor. [ROOT.GetLeader], bir Afrika ulusunun Avrupalı işgalcilere karşı durabileceğini dünyaya gösterdi ve bu kendi başına bir zaferdir. Şimdi birini dize getirmemiz gerekiyor."
 BBA_italo_ethiopian_war_events.122.t:0 "[FROM.GetLeader] İnatla Reddediyor"
 BBA_italo_ethiopian_war_events.13.a:0 "Bu onlara bir darbe!"
 BBA_italo_ethiopian_war_events.13.desc:0 "Milletler Cemiyeti'ndeki kararın ardından, [FROM.GetLeader] kamuoyuna [ITA.GetAdjective] gemilerinin Süveyş Kanalı'ndan geçişine artık izin verilmediğini duyurdu. Kanaldan geçmeye çalışan herhangi bir [ITA.GetAdjective] gemisine el konulacak ve [ITA.GetName] [ETH.GetNameDef]'e karşı saldırganlığını durdurana kadar kargoları müsadere edilecektir."
 BBA_italo_ethiopian_war_events.13.t:0 "[FROM.GetName], [ITA.GetName] için Süveyş'i Kapatıyor"
 BBA_italo_ethiopian_war_events.14.a:0 "Bunu düzgün bir şekilde organize etmeliyiz"
 BBA_italo_ethiopian_war_events.14.b:0 "Eğer insanlar gitmek istiyorsa..."
 BBA_italo_ethiopian_war_events.14.c:0 "Vatandaşlarımızı başka bir ülkede ölmeye göndermenin bir anlamı yok"
 BBA_italo_ethiopian_war_events.14.d:0 "Savaşacak kendi savaşımız var"
 BBA_italo_ethiopian_war_events.14.desc:0 "Milletler Cemiyeti konseyi, [ETH.GetName]'dan gelen İtalya ile savaşta askeri müdahale talebini tartıştı. Sonunda, konsey tam ölçekli bir müdahale çağrısı yapacak kadar ileri gitmedi, ancak üye ülkelere [ETH.GetName]'ı çatışmada [ETH.GetName]'ın yanında yer alabilecek gönüllülere izin vermek de dahil olmak üzere mümkün olan her şekilde desteklemelerini tavsiye eden bir açıklama yaptı."
 BBA_italo_ethiopian_war_events.14.t:0 "Milletler Cemiyeti'nin [ETH.GetName]'ı Destekleme Kararı"
 BBA_italo_ethiopian_war_events.15.a:0 "Güzel"
 BBA_italo_ethiopian_war_events.15.b:0 "Ne kadar kötü"
 BBA_italo_ethiopian_war_events.15.desc_a:0 "[ROOT.GetName]'ı destekleme kararı alan Milletler Cemiyeti'nin kararı sonucunda, dünyanın dört bir yanından gönüllüler gelmeye başladı. Bu gönüllülerden uluslararası tugaylar oluşturuluyor. Umarım savaş yetenekleri coşkularıyla aynı seviyededir."
 BBA_italo_ethiopian_war_events.15.desc_b:0 "Milletler Cemiyeti'nin [ROOT.GetName] desteklenmesine izin veren kararından sonra bile, savaş çabalarımıza yardımcı olmak için gelen gönüllülerin sayısı ne yazık ki çok az. Umuyoruz ki bu cesur özgürlük savaşçılarının savaşma kabiliyetleri de coşkularıyla eşdeğerdir."
 BBA_italo_ethiopian_war_events.15.t:0 "Uluslararası Yardım Çağrımız"
 BBA_italo_ethiopian_war_events.16.a:0 "Bekleyip görmemiz gerekecek."
 BBA_italo_ethiopian_war_events.16.desc:0 "Milletler Cemiyeti, [ITA.GetName]'ı [ROOT.GetName]'dan çıkarmak için askeri bir güç yaratmaya çalışacak kadar ileri gitmedi. Ancak, üye ülkeleri statükoyu geri getirmeye yardımcı olmak için kuvvetler göndermeye teşvik ettiler. [FROM.GetName] gibi ülkeler de dahil olmak üzere birçok ulusun seferler düzenlediğine dair göstergeler var. Bunun sadece lafta mı kaldığı, yoksa gerçekten bize yardım etmeye gelip gelmedikleri henüz belli değil."
 BBA_italo_ethiopian_war_events.16.t:0 "Yardım Yolda mı?"
 BBA_italo_ethiopian_war_events.20.a:0 "Mücadele devam ediyor"
 BBA_italo_ethiopian_war_events.20.desc:0 "[ETH.GetAdjective] kuvvetlerinin teslim olmasına rağmen, [ETH.GetLeader] teslim olmayı reddediyor. Söylentiye göre [ETH.GetLeader.GetSheHe], [?ETH.host_nation.GetNameDef]'de bir Sürgün Hükûmeti kurmasına izin verildi. [?ETH.host_nation.GetAdjective] hükûmetine resmi bir protesto yayınlandı."
 BBA_italo_ethiopian_war_events.20.t:0 "[ETH.GetLeader] Teslim Olmayı Reddediyor"
 BBA_italo_ethiopian_war_events.200.a:0 "Keşke konuşmaktan daha fazlasını yapabilseler"
 BBA_italo_ethiopian_war_events.200.desc:0 "[ROOT.GetName]'ın davasına yönelik halk sempatisi her zaman güçlü olmuştur. Ancak, kimse gerçekten ülkenin bir aydan fazla dayanmasını beklemiyordu. [ITA.GetAdjective] işgalcilerine karşı inatçı direnişimiz dünya çapındaki insanların kalbini kazanıyor ve ülke liderleri [ROOT.GetName]'ı daha ciddiye almaya başlıyor."
 BBA_italo_ethiopian_war_events.200.t:0 "Uluslararası İtibar Artıyor"
 BBA_italo_ethiopian_war_events.201.a:0 "Düşmanı [ROOT.GetName]'dan atmak için bunun üzerine inşa etmeliyiz"
 BBA_italo_ethiopian_war_events.201.desc:0 "Bu kadar uzun süre, bu zorluklara karşı dayanarak, sıradan askerler arasındaki moral yeniden yükselmeye başlıyor. İlk coşku öldüğünde, birçoğu nihai yenilgiyi kesin olarak kabul etmeye başlamıştı, ama şimdi bir kez daha olası bir zaferden söz ediliyor. Ayrıca birimlerin yeni savaş tarzına uyum sağladığına dair açık işaretler var."
 BBA_italo_ethiopian_war_events.201.t:0 "Ordu Morali Artışı"
 BBA_italo_ethiopian_war_events.202.a:0 "İşler tersine dönüyor"
 BBA_italo_ethiopian_war_events.202.desc:0 "İlk başta bir sızıntı olarak başladı, düşmanımızın bazı düzensiz birimleri inancını kaybetmeye başladı ve bunlardan bazıları bizim için savaşmaya geldi. Şimdi Askerler topluca firar ediyor ve sadece düzensizler değil. Hatta bazı firariler yanlarında ağır teçhizat getiriyor."
 BBA_italo_ethiopian_war_events.202.t:0 "Düşman Firarları"
 BBA_italo_ethiopian_war_events.203.a:0 "İstilacıları denize dökeceğiz"
 BBA_italo_ethiopian_war_events.203.desc:0 "Sözde uzmanlar savaş başladığında bize bir ay bile vermezlerdi. Sözde modern bir orduya karşı bundan çok daha uzun süre dayandık. Nasıl savaştıklarını biliyoruz ve buna uyum sağladık. Halk arasındaki inanç geri dönüyor, acemiler yakın ve uzaktan sancaklara akın ediyor."
 BBA_italo_ethiopian_war_events.203.t:0 "Her Şeye Rağmen Hayatta Kalma"
 BBA_italo_ethiopian_war_events.204.a:0 "Zafer şimdi yakın"
 BBA_italo_ethiopian_war_events.204.desc:0 "Her yerde, halk işgalcilere karşı ayaklanıyor, genç ve yaşlı direniş hareketine katılıyor, bu da [ITA.GetName]'ı yaptıkları her kazanım için daha da sıkı çalışmaya zorluyor. Savaşamayan yerel halk, ordu için silah ve teçhizat yapıyor."
 BBA_italo_ethiopian_war_events.204.t:0 "Halkın Savaşı"
 BBA_italo_ethiopian_war_events.300.a:0 "Ne kadar da az inançları var!"
 BBA_italo_ethiopian_war_events.300.desc:0 "Ordularımız [ETH.GetName]'da herhangi bir ilerleme kaydetmekte zorlanıyor ve ilerleme eksikliği [ITA.GetName]'da bile hissediliyor. [ITA.GetAdjective] nüfusu savaşa olan inancını ve hatta sonunda bir zafer sağlama konusundaki liderliğimize olan inancını kaybetmeye başlıyor."
 BBA_italo_ethiopian_war_events.300.t:0 "İtalyan Halkı Endişeli"
 BBA_italo_ethiopian_war_events.301.a:0 "Savaşın gidişatını değiştirmeliyiz!"
 BBA_italo_ethiopian_war_events.301.desc:0 "[ETH.GetName]'daki ordularımız çok az ilerleme kaydediyor veya hiç ilerleme kaydetmiyor ve ağır kayıplar veriyor. Direniş şiddetli ve kazandığımız her santim için sıkı savaşmak zorundayız. Ordular genelinde moral tüm zamanların en düşük seviyesinde ve hatta bazı bölüklerin doğrudan emirleri yerine getirmeyi reddettiğine dair raporlar aldık."
 BBA_italo_ethiopian_war_events.301.t:0 "Afrika Ordusunun Morali Bozuldu"
 BBA_italo_ethiopian_war_events.302.a:0 "Rahatsız edici haberler!"
 BBA_italo_ethiopian_war_events.302.desc:0 "[ETH.GetName]'daki mücadelelerimiz başka yerlerde de bir dalgalanma etkisine sahip olmaya başladı; sömürgelerden, tebaamızın yerel makamlara küçük ve büyük konularda itaatsizlik etmeye başladığına dair raporlar alıyoruz. Görünüşe göre savaştaki ilerleme eksikliğimizi bir zayıflık olarak görüyorlar ve gücümüzü test ediyorlar."
 BBA_italo_ethiopian_war_events.302.t:0 "Sömürgelerde Huzursuzluk"
 BBA_italo_ethiopian_war_events.303.a:0 "Hainler!"
 BBA_italo_ethiopian_war_events.303.desc:0 "[ETH.GetAdjevtive] fiyaskosu, [ITA.GetAdjective]ları savaşa karşı çevirdi. Giderek daha fazla insan hükûmetimizi ve liderliğini açıkça eleştiriyor ve hatta başka alternatiflerin fısıltıları bile nadir değil."
 BBA_italo_ethiopian_war_events.303.t:0 "İtalyan Halkı Savaş Çabasını Sorguluyor"
 BBA_italo_ethiopian_war_events.304.a:0 "Hepsi korkak!"
 BBA_italo_ethiopian_war_events.304.desc:0 "[ETH.GetName]'daki durum vahim, çünkü askerler arasındaki moral düşmeye devam ediyor! Ordu birkaç yerde bataklığa saplanmış durumda ve toplu firarlarla karşı karşıya, bu da [ETH.GetAdjective]ların yardımı olmadan bile sayılarımızı azaltıyor! Hatta bir subayın bir kamyon tarafından ezildiğine dair bir raporumuz var. Bunu bir kaza olarak etiketledik."
 BBA_italo_ethiopian_war_events.304.t:0 "Toplu Firarlar"
 BBA_italo_ethiopian_war_events.305.a:0 "Ne cüret!"
 BBA_italo_ethiopian_war_events.305.desc:0 "Sömürgelerdeki sivil itaatsizlik olarak başlayan şey, neredeyse açık bir isyana tırmandı! [ETH.GetName]'daki devam eden mücadeleleri ele almadaki başarısızlığımız, tebaamızı zayıf olduğumuza ve yönetimimiz olmadan daha iyi olacaklarına ikna etti."
 BBA_italo_ethiopian_war_events.305.t:0 "Sömürgelerde İsyan"
 BBA_italo_ethiopian_war_events.400.a:0 "Tam bir boyun eğme talep eden bir ültimatom gönder"
 BBA_italo_ethiopian_war_events.400.b:0 "[AFA.GetNameDef] ile daha sonra ilgilenebiliriz. Şimdi zamanı değil."
 BBA_italo_ethiopian_war_events.400.desc:0 "[AFA.GetNameDef] sultanı [AFA.GetLeader], uzun süredir güçlü [ROOT.GetAdjective] etkisi altındadır. Son savaşta olduğu gibi, resmi olarak [ETH.GetAdjective] imparatorluğunun bir parçası olmasına rağmen tarafsız kaldı. Aslında, sultanın hala güce sahip olmasının tek nedeni [ROOT.GetAdjective] iyi niyetidir. Ülke kıyı şeridini [ROOT.GetName]'a satmış olabilir, ancak hala fethimize bir engel teşkil ediyor. [?ITA.ITA_capture_state.GetName]'ın ele geçirilmesi, Sultanı topraklarının geri kalanını teslim etmeye ikna etmek için yeterli olabilir."
 BBA_italo_ethiopian_war_events.400.t:0 "[AFA.GetNameDef] ile ilgilenme zamanı"
 BBA_italo_ethiopian_war_events.401.a:0 "Direnmenin bir anlamı yok"
 BBA_italo_ethiopian_war_events.401.b:0 "Eğer toprağımızı istiyorlarsa zorla almak zorunda kalacaklar"
 BBA_italo_ethiopian_war_events.401.desc:0 "İtalyanlar, [ETH.GetName]'a karşı savaşlarında bir hazırlık alanı olarak kullanmak üzere tüm devleti kendi kontrolleri altına almamızı talep ettiler. Kabul etmek, [ROOT.GetNAme]'ın bağımsızlığını etkili bir şekilde sona erdirecektir, ancak reddetmek kesinlikle bir istila anlamına gelecektir."
 BBA_italo_ethiopian_war_events.401.t:0 "[FROM.GetName]'dan bir Ültimatom"
 BBA_italo_ethiopian_war_events.402.a:0 "Güzel, içeri girip toprakları işgal edelim."
 BBA_italo_ethiopian_war_events.402.desc:0 "[FROM.GetNameDefCap], [FROM.GetAdjective] topraklarını [ETH.GetName]'a karşı bir operasyon üssü olarak kullanmamıza izin verme taleplerimizi kabul etti. Bu, [FROM.GetName]'ın bağımsızlığını etkili bir şekilde sona erdirir."
 BBA_italo_ethiopian_war_events.402.t:0 "[FROM.GetLeader] Pes Ediyor"
 BBA_italo_ethiopian_war_events.403.a:0 "Bunu zor yoldan yapmak zorunda kalacağız"
 BBA_italo_ethiopian_war_events.403.desc:0 "Maalesef diplomatik baskı, [FROM.GetNameDef]'in İtalyan hakimiyetini güvence altına almak için yeterli olmadı. [FROM.GetLeader], ülkesinin [ROOT.GetName]'ın askeri gücüne karşı durabileceği konusunda kararlı olmaya devam ediyor."
 BBA_italo_ethiopian_war_events.403.t:0 "[FROM.GetNameDefCap] Meydan Okumaya Devam Ediyor"
 BBA_italo_ethiopian_war_events.500.a:0 "Acı bir barış olsun"
 BBA_italo_ethiopian_war_events.500.b:0 "Onların desteğine ihtiyacımız var"
 BBA_italo_ethiopian_war_events.500.c:0 "Çok zor savaştık!"
 BBA_italo_ethiopian_war_events.500.desc:0 "[GetItaloEthiopianPeaceDemands]"
 BBA_italo_ethiopian_war_events.500.desc_guarantees:0 "[FROM.GetAdjective], Almanlara karşı yardımlarını istiyorsak [ETH.GetName] ile barış yapmamızı talep ediyor. Eğer Etiyopyalılarla bir antlaşma imzalarsak, fethettiğimiz toprakların bir kısmından vazgeçmeye istekli olmalıyız, diğerlerini ise elimizde tutmalıyız. Böyle bir barış, her iki ülkemiz için de kesinlikle yutulması zor bir hap olacaktır, ancak Almanlarla karşı karşıyayken buna değebilir."
 BBA_italo_ethiopian_war_events.500.desc_territories:0 "Bize sömürge topraklarından bazılarını vermemiz için, İngilizler Etiyopyalılarla olan savaşımıza bir son vermemizi istiyor. Onlarla bir antlaşma imzalarsak, fethettiğimiz toprakların bir kısmından vazgeçmeye istekli olmalıyız, diğerlerini ise elimizde tutmalıyız. Döktüğümüz tüm kan, ter ve gözyaşı göz önüne alındığında, böyle bir barış her iki ülkemiz için de kesinlikle yutulması zor bir hap olacaktır."
 BBA_italo_ethiopian_war_events.500.t:0 "Barış Talepleri"
 BBA_italo_ethiopian_war_events.500_tt:0 "Savaş Devam Ediyor"
 BBA_italo_ethiopian_war_events.501.a:0 "Başka seçeneğimiz yok"
 BBA_italo_ethiopian_war_events.501.b:0 "Savaşmaya devam edeceğiz!"
 BBA_italo_ethiopian_war_events.501.desc:0 "Kendi ulusumuz [ITA.GetNameDefCap] tarafından istila edildikten sonra bizi kabul eden lütufkâr ev sahibi ülkemiz, bizden bıkmış gibi görünüyor. Pis İtalyan işgalcileriyle bir barış antlaşması imzalamaya bizi zorlamak için arkamızdan entrikalar çeviriyorlar. Maalesef bu konuda yapabileceğimiz çok az şey var."
 BBA_italo_ethiopian_war_events.501.t:0 "Barış Masasına Zorlandı"
 BBA_italo_ethiopian_war_events.502.a:0 "Ne kadar yazık"
 BBA_italo_ethiopian_war_events.502.desc:0 "[GetItalyRefusesPeaceTalks]"
 BBA_italo_ethiopian_war_events.502.desc_guarantees:0 "İtalyan hükûmeti, Almanlara karşı yardımımız karşılığında [ETH.GetNameDefCap] ile barış yapma talebimizi geri çevirdi. Bu saldırıyla tek başlarına yüzleşmek zorunda kalacaklar."
 BBA_italo_ethiopian_war_events.502.desc_territories:0 "İtalyan hükûmeti, sömürge topraklarımızın bir kısmı karşılığında [ETH.GetNameDefCap] ile barış yapma talebimizi geri çevirdi. Bu sadece bu tür suçlularla anlaşma yapılamayacağını gösteriyor!"
 BBA_italo_ethiopian_war_events.502.t:0 "Barış Antlaşması Yok"
 BBA_italo_ethiopian_war_events.503.a:0 "Onları dize getireceğiz"
 BBA_italo_ethiopian_war_events.503.desc:0 "Etiyopya hükûmeti, İngilizlerin bizimle bir barış anlaşması imzalama talebini reddetti. Bu, [ENG.GetLeader]'in Etiyopyalıları [ENG.GetNameDef]'den kovmasına yol açtı ve herkese hangi ülkenin işbirliğine daha fazla değer verdiklerini açıkça gösterdi. Bu bize Afrika'daki mülklerimizi daha da güçlendirme fırsatı veriyor!"
 BBA_italo_ethiopian_war_events.503.t:0 "[ETH.GetNameDefCap] Barış Görüşmelerini Reddediyor"
 BBA_italo_ethiopian_war_events.510.a:0 "Yalanlarının bedelini ödeyecekler!"
 BBA_italo_ethiopian_war_events.510.desc:0 "İtalyanların, evimizdeki yönetimimizi ve meşruiyetimizi baltalamak için bir dezenformasyon kampanyası başlattığına dair raporlar aldık. Bu aşağılık yalanlar, tebaamızdan bazılarını [ITA.GetNameDef]’in davasına çekebilir ve taht üzerindeki iddiamızı zayıflatabilir. Daha fazla zarar vermeden önce Etiyopya üzerindeki hakimiyetimizi yeniden kurmalıyız!"
 BBA_italo_ethiopian_war_events.510.t:0 "[ITA.GetNameDef] Etiyopya Otoritesini Baltalıyor"
 BBA_italo_ethiopian_war_events_wargoal_tt:0 "Milletler Cemiyeti'ndeki Büyük Güçler [ROOT.GetName] üzerinde bir savaş hedefi alabilir"
 BBA_italy_air_accident.01.a:0 "Yıkıcı bir darbe..."
 BBA_italy_air_accident.01.desc:0 "Mareşal Italo Balbo, Libya semalarında dost ateşiyle düşürüldü. Bir yanlış teşhis, uçaksavar bataryalarının ateş açmasına ve uçağını gökyüzünden düşürmesine yol açtı. Farklı bir uçakta seyahat eden General Giuseppe Tellera kazadan sağ kurtuldu ancak deneyimden sarsıldı."
 BBA_italy_air_accident.01.t:0 "$ITA_italo_balbo$'nun Trajik Ölümü"
 BBA_italy_air_accident.02.a:0 "Trajik..."
 BBA_italy_air_accident.02.desc:0 "Bir yanlış teşhisin ardından, Mareşal Italo Balbo’nun uçağı Libya semalarında uçaksavar bataryalarından dost ateşi altına girdi. Neyse ki, yara almadan kurtuldu, ancak Kurmay Başkanı General Giuseppe Tellera o kadar şanslı değildi ve vurularak öldürüldü. Öfkelenen Balbo, subaylar da dahil olmak üzere tüm bölüğü oldukça sert bir şekilde disipline etti."
 BBA_italy_air_accident.02.t:0 "$ITA_giuseppe_tellera$'nun Trajik Ölümü"
 BBA_italy_air_accident.03.a:0 "Balbo'nun yiğitliği günü kurtardı!"
 BBA_italy_air_accident.03.desc:0 "Mareşal Italo Balbo, Libya semalarında bir yanlış teşhisin ardından uçaksavar bataryalarından dost ateşi altına girdi. Yer birlikleriyle temas kurmayı ve yaylım ateşinden uzak durmayı başaran Balbo, uçaksavar mürettebatını ateş etmeyi durdurmaya ikna etti ve uçağını başarıyla indirdi. Mareşal, cesareti ve sıcak bir durumda sakin kalmasıyla övüldü."
 BBA_italy_air_accident.03.t:0 "Dost Ateşi Trajedisi Önlendi"
 BBA_italy_air_accident.11.a:0 "[ROOT.GetNameDefCap] iki iyi subayını kaybetti."
 BBA_italy_air_accident.11.desc:0 "Fransız sınırını denetlemek için yoldayken, Hava Kuvvetleri Komutanı Aldo Pellegrini’nin ve General Pietro Pintor’un uçağı motor sorunları yaşadı. Uçak düştü ve gemide kimse sağ kalmadı."
 BBA_italy_air_accident.11.t:0 "Trajik Uçak Kazası"
 BBA_italy_air_accident.12.a:0 "Şans onlarla!"
 BBA_italy_air_accident.12.desc:0 "Fransız sınırına uçarken, Hava Kuvvetleri Komutanı Aldo Pellegrini’nin ve General Pietro Pintor’un uçağı motor sorunları yaşadı ve hızla irtifa kaybetmeye başladı. Kesin ölümle karşı karşıya kalan Pellegrini, Savoia-Marchetti uçaklarına olan aşinalığı sayesinde kontrolü ele aldı ve uçağı zorunlu iniş yapmayı başardı. Gemideki herkes, morarmış olsalar da, hayatta kaldı."
 BBA_italy_air_accident.12.t:0 "Uçak Kazası"
 BBA_italy_anti_colonialism_events.01.a:0 "Bu maskaralığı şimdi durdurmalıyız!"
 BBA_italy_anti_colonialism_events.01.b:0 "Etiyopya işçilerini kurtaracağız!"
 BBA_italy_anti_colonialism_events.01.c:0 "Etiyopya topraklarını entegre etmeliyiz."
 BBA_italy_anti_colonialism_events.01.d:0 "Etiyopya'ya ve Etiyopya halklarına yatırım yapmalıyız."
 BBA_italy_anti_colonialism_events.01.desc:0 "İç işlerimiz halledildiğine göre, bir kez daha dışarıya bakabiliriz. Faşistlerden birçok sorun devraldık, şimdi çözmemiz gereken sorunlar. En önemli sorulardan biri Etiyopya'dır. Bu, her zaman prestij peşinde koşan Mussolini tarafından başlatılan adaletsiz ve acımasız bir savaştı ve şimdi o gittiğine göre Etiyopya'nın kaderini belirlemek bize düşüyor."
 BBA_italy_anti_colonialism_events.01.e:0 "Statükoyu koruyacağız."
 BBA_italy_anti_colonialism_events.01.f:0 "[ETH.GetLeader]'ın baskıcı yönetimine bir son vermeliyiz!"
 BBA_italy_anti_colonialism_events.01.g:0 "Etiyopya halkıyla bağları güçlendireceğiz."
 BBA_italy_anti_colonialism_events.01.t:0 "$ITA_the_ethiopian_question$"
 BBA_italy_anti_colonialism_events.02.a:0 "Mantıklı görünüyor."
 BBA_italy_anti_colonialism_events.02.b:0 "Teslim olmalıyız..."
 BBA_italy_anti_colonialism_events.02.c:0 "Çok geç, diz çökecekler!"
 BBA_italy_anti_colonialism_events.02.desc:0 "[FROM.GetName]'ın yeni hükûmeti, düşmanlıkların durdurulması için ateşkes talep ederek bize geldi. Görünüşe göre İç Savaşlarından sonra kan dökülmesinden ve savaşmaktan bıkmışlar."
 BBA_italy_anti_colonialism_events.02.t:0 "[FROM.GetName]'dan Ateşkes Teklifi"
 BBA_italy_anti_colonialism_events.03.a:0 "Barış olsun!"
 BBA_italy_anti_colonialism_events.03.desc:0 "[FROM.GetName]’in [FROM.GetLeader]'ı önerdiğimiz ateşkese razı oldu ve barışa bir şans vermeye istekli. Nihayet Mussolini’nin en büyük zulümlerinden birini geride bırakıp yeniden başlayabiliriz."
 BBA_italy_anti_colonialism_events.03.t:0 "İtalya-Etiyopya Savaşının Sonu"
 BBA_italy_anti_colonialism_events.04.a:0 "[FROM.GetLeader] bunun için pişman olacak!"
 BBA_italy_anti_colonialism_events.04.desc:0 "Kana susamış [FROM.GetLeader], görünüşe göre İç Savaşımızdan sonra kan kokusu aldı ve bizi zayıf sanıyor. [FROM.GetSheHeCap] cömert barış teklifimizi reddetti ve savaşmaya kararlı. [FROM.GetHerHim]'e zayıf olmaktan çok uzak olduğumuzu göstereceğiz!"
 BBA_italy_anti_colonialism_events.04.t:0 "[FROM.GetLeader] Teklifimizi Reddediyor"
 BBA_italy_anti_colonialism_events.05.a:0 "Memnuniyetle boyun eğeriz."
 BBA_italy_anti_colonialism_events.05.b:0 "Sınırlı özerkliğimizden vazgeçmeyeceğiz!"
 BBA_italy_anti_colonialism_events.05.desc:0 "[FROM.GetName]'daki hükûmet, topraklarımızın doğrudan kontrolünü üstlenmeye ve bizi daha büyük [FROM.GetAdjective] yönetimine entegre etmeye çalışıyor. Bunun halkımızı, kültürümüzü ve geleneğimizi nasıl etkileyeceğini henüz kimse bilmiyor."
 BBA_italy_anti_colonialism_events.05.t:0 "[FROM.GetAdjective]'nin [ROOT.GetAdjective] Entegrasyonu Talepleri"
 BBA_italy_anti_colonialism_events.06.a:0 "Harika!"
 BBA_italy_anti_colonialism_events.06.desc:0 "[FROM.GetAdjective] hükûmeti, daha geniş [ROOT.GetAdjective] yönetimine entegre olmanın faydalı olacağını ve hepimizi güçlendireceğini fark etti."
 BBA_italy_anti_colonialism_events.06.t:0 "[FROM.GetAdjective] [ROOT.GetNameDef]'e Entegrasyonu"
 BBA_italy_anti_colonialism_events.07.a:0 "Çok fazlaydı..."
 BBA_italy_anti_colonialism_events.07.desc:0 "Görünüşe göre [FROM.GetAdjective]'ler kendilerini yönetmeye daha uygun olduklarını düşünüyorlar ve daha geniş yönetimimizin bir parçası olma teklifimizi reddettiler."
 BBA_italy_anti_colonialism_events.07.t:0 "[FROM.GetName] Teklifimizi Reddetti"
 BBA_italy_anti_colonialism_events.08.a:0 "[ROOT.GetCapitalVictoryPointName] gelişiyor!"
 BBA_italy_anti_colonialism_events.08.desc:0 "Görünüşe göre [FROM.GetName]'daki yeni hükûmet, seleflerinin [ROOT.GetAdjective] halkına yönelik daha az rafine muamelesinin bir kısmını telafi etmek istiyor ve bir değişiklik olsun diye ülkemize yatırım yapmaya karar verdi."
 BBA_italy_anti_colonialism_events.08.t:0 "[FROM.GetAdjective] Yatırımları [ROOT.GetAdjective] Gelişiminde"
 BBA_italy_anti_colonialism_events.09.a:0 "İtalyan yoldaşlarımızı takip edeceğiz!"
 BBA_italy_anti_colonialism_events.09.b:0 "Bir hükûmet değişikliğine ihtiyacımız var!"
 BBA_italy_anti_colonialism_events.09.c:0 "Ne kadar küstah Avrupalılar!"
 BBA_italy_anti_colonialism_events.09.desc:0 "[FROM.GetAdjective]'in genişleme açlığı sınır tanımıyor gibi görünüyor! Bize boyun eğme teklif eden bir [FROM.GetName] heyeti aldık. Çok az şey değişeceğini iddia ediyorlar; hala topraklarımızı uygun gördüğümüz gibi yöneteceğiz, ancak [FROM.GetAdjective]'lerin ekstra koruması ve ara sıra uyum sağlama faydasıyla."
 BBA_italy_anti_colonialism_events.09.t:0 "[FROM.GetAdjective] Hükûmeti [ROOT.GetName]'a Baskı Yapıyor"
 BBA_italy_anti_colonialism_events.10.desc:0 "[FROMGetAdjective] hükûmeti, güçlerimizi birleştirme ve korumamızdan yararlanma teklifimizi akıllıca kabul etti. Bu şüphesiz her iki ülkeyi de güçlendirecek ve fayda sağlayacaktır!"
 BBA_italy_anti_colonialism_events.10.t:0 "[FROM.GetAdjective] İşçileri Seviniyor!"
 BBA_italy_anti_colonialism_events.100.a:0 "Arnavut ve İtalyan halkları birleşmelidir!"
 BBA_italy_anti_colonialism_events.100.b:0 "Yeni İtalyan hükûmetini takip edeceğiz!"
 BBA_italy_anti_colonialism_events.100.c:0 "Saçmalık!"
 BBA_italy_anti_colonialism_events.100.desc:0 "[FROM.GetName]'dan, bizimle daha yakın bağlar kurmak isteyen bir heyet aldık. Ortak tarihimizden uzun uzadıya bahsettiler ve sadece güçlerimizi birleştirirsek ne kadar daha güçlü olacağımızdan bahsettiler. Kendilerini bu potansiyel paktın liderleri olarak gördüklerine şüphe yok. Böyle bir anlaşma belirli seviyelerde faydalı olsa da, tüm özerkliğimizi kaybederiz."
 BBA_italy_anti_colonialism_events.100.t:0 "[FROM.GetAdjective] Yetkilileri Bize Ulaşıyor"
 BBA_italy_anti_colonialism_events.101.a:0 "Harika!"
 BBA_italy_anti_colonialism_events.101.desc:0 "[FROM.GetAdjective] halkının büyük ve bilge lideri [FROM.GetLeader], bizimle birleşmeyi ve tek bir ülke olmayı kabul etti! Bu, hem [ROOT.GetName] hem de [FROM.GetName] için önemli bir gündür!"
 BBA_italy_anti_colonialism_events.101.t:0 "[FROM.GetNameDefCap], [ROOT.GetNameDef]'e Entegre Edildi"
 BBA_italy_anti_colonialism_events.102.a:0 "İşçi sınıfının bir başka zaferi!"
 BBA_italy_anti_colonialism_events.102.desc:0 "[FROM.GetAdjective] hükûmeti, tek bir ülke olarak birleşmese de, [ROOT.GetAdjective] liderliğini ve rehberliğini kabul ederek bizimle birleşmeyi akıllıca seçti. Umduğumuz sonuç olmasa da, bu kan dökmeden Akdeniz'deki konumumuzu güçlendirecektir."
 BBA_italy_anti_colonialism_events.102.t:0 "[FROM.GetAdjective] Hükûmeti İşbirliği Arıyor"
 BBA_italy_anti_colonialism_events.103.a:0 "[FROM.GetAdjective] halkı bunu kabul edecek mi?"
 BBA_italy_anti_colonialism_events.103.b:0 "[FROM.GetLeader]'ın günleri sayılı olabilir."
 BBA_italy_anti_colonialism_events.103.desc:0 "Görünüşe göre [FROM.GetAdjective] halkı, akılsız ve bencil bir lider tarafından yönetiliyor. [FROM.GetLeader], her iki ülkeyi de güçlendirecek ve halklarımız arasında sonsuz barışı sağlayacak olan bizimle güçlerini birleştirme ve mantığı görme teklifini reddediyor."
 BBA_italy_anti_colonialism_events.103.t:0 "[FROM.GetLeader] Yetkililerimizi Reddetti"
 BBA_italy_anti_colonialism_events.11.a:0 "[FROM.GetAdjective] halkını parlak bir gelecek bekliyor!"
 BBA_italy_anti_colonialism_events.11.desc:0 "[FROM.GetAdjective] liderliği koruma ve işbirliği teklifimizi kabul etmese de, ortada buluştular ve hükûmetlerini bizimkine daha çok benzeyen ve bize karşı daha dostça düşünen biriyle değiştirdiler."
 BBA_italy_anti_colonialism_events.11.t:0 "[FROM.GetAdjective] İşçileri İktidarı Ele Geçiriyor"
 BBA_italy_anti_colonialism_events.12.a:0 "Zaman onlara ne kadar yanıldıklarını gösterecek."
 BBA_italy_anti_colonialism_events.12.b:0 "Bu bir talepdi, bir teklif değil."
 BBA_italy_anti_colonialism_events.12.desc:0 "[FROM.GetName]’in lideri [FROM.GetLeader], koruma ve işbirliği teklifimize şiddetle karşı çıktı ve kaba bir şekilde heyetimize en kısa sürede eve dönmelerini söyledi."
 BBA_italy_anti_colonialism_events.13.a:0 "Kulağa hoş geliyor!"
 BBA_italy_anti_colonialism_events.13.b:0 "Bu dünyada olmaz!"
 BBA_italy_anti_colonialism_events.13.desc:0 "Görünüşe göre [FROM.GetAdjective]'ler, onlarla olan savaşları sırasında kuvvetlerimize ve yeteneklerimize oldukça saygı duymuşlar. Hatta o kadar ki, savaş karşısında karşılıklı bir saldırmazlık ve garanti anlaşması teklif etmek istiyorlar."
 BBA_italy_anti_colonialism_events.13.t:0 "[FROM.GetName] Bağları Güçlendirmek İstiyor"
 BBA_italy_anti_colonialism_events.14.desc:0 "[FROM.GetLeader], [FROM.GetName] ile [ROOT.GetName] arasında önerdiğimiz karşılıklı saldırmazlık paktını ve herhangi birimizin bir saldırganla karşı karşıya kalması durumunda karşılıklı garantiyi akıllıca kabul etti."
 BBA_italy_anti_colonialism_events.15.a:0 "Onların kaybı!"
 BBA_italy_anti_colonialism_events.15.b:0 "Eğer bizimle değillerse, bize karşıdırlar!"
 BBA_italy_anti_colonialism_events.15.desc:0 "[FROM.GetLeader], [FROM.GetName] ile [ROOT.GetName] arasında önerdiğimiz savunma paktını akılsızca reddetti. Bu güvence her iki ülkemize de istikrar ve güvenlik getirirdi, ama şimdi dünyayla tek başımıza yüzleşmek zorundayız."
 BBA_italy_anti_colonialism_events.20.a:0 "İşleri düzeltme zamanı geldi!"
 BBA_italy_anti_colonialism_events.20.b:0 "[FROM.GetAdjective]'ler aklını mı kaçırdı?!"
 BBA_italy_anti_colonialism_events.20.desc:0 "Görünüşe göre yeni kurulan [FROM.GetName], yeni bir erdem ve amaç duygusu kazanmış ve herkesin sömürge imparatorluklarını dağıtmayı üstlenmiş. Bir İtalyan heyeti, emperyal yollarımızı reddetmemizi ve baskı ve boyun eğdirme yerine işbirliği ve özgürlük dolu bir geleceği kucaklamamızı istedi."
 BBA_italy_anti_colonialism_events.20.t:0 "[FROM.GetNameDefCap] Sömürgeciliği Kınıyor"
 BBA_italy_anti_colonialism_events.21.a:0 "Buradaki işimiz bitti."
 BBA_italy_anti_colonialism_events.21.b:0 "Zor yoldan olsun!"
 BBA_italy_anti_colonialism_events.21.desc:0 "[GetDecolonizationEventDesc]"
 BBA_italy_anti_colonialism_events.21.desc_accepted:0 "Afrika'daki sömürge imparatorluklarını kınamak ve dağıtmak için yola çıktığımızda, böyle bir eylemin nasıl karşılanacağından emin değildik. Ülkelerin kendilerinin olarak algıladıkları şeye ne kadar inatla sarılabileceğini düşünürsek, çabalarımızı bir başarı olarak görmeliyiz. Tek bir ulusun bile serbest bırakılması büyük bir başarıdır!"
 BBA_italy_anti_colonialism_events.21.desc_rejected:0 "Görünüşe göre Afrika kıtasını sömürgesizleştirme ve boyun eğdirilmiş halklarına özgürlük getirme çabalarımız her fırsatta bir kenara itildi. Eski sömürgeci güçler, tebaalarına nasıl davrandıkları konusunda açıkça inkâr içindeler ve mantığı dinlemeyi reddediyorlar. Hesaba çekilmeleri gerekiyor!"
 BBA_italy_anti_colonialism_events.21.t:0 "Afrika'nın Sömürgesizleştirilmesi"
 BBA_italy_anti_colonialism_events.52.a:0 "Hoş geldiniz kardeşlerim!"
 BBA_italy_anti_colonialism_events.52.desc:0 "Kuzey Afrika halkı, topraklarını ne kadar iyi niyetli ve verimli yönettiğimizi gördü ve yönetimimize katılmak için oy verdi! Görünüşe göre eyaletlerindeki yatırımlarımız ve ilgimiz karşılığını verdi. Bu kesinlikle hepimize fayda sağlayacaktır."
 BBA_italy_anti_colonialism_events.52.t:0 "Kuzey Afrika [ROOT.GetNameDef]'e Katılmak İçin Oy Veriyor"
 BBA_italy_anti_colonialism_events.53.a:0 "Onlara veda ediyoruz"
 BBA_italy_anti_colonialism_events.53.desc:0 "Belki de tam bir sürpriz olmasa da, maalesef Kuzey Afrika halkının artık bizim yönetimimize tabi olma fikrini reddettiğini bildirdik. Bir süredir ihmal edildiklerini ve sömürüldüklerini hissettiler ve bu nedenle yönetimimizden ayrılmak için oy verdiler."
 BBA_italy_anti_colonialism_events.53.t:0 "Kuzey Afrika [ROOT.GetNameDef]'den Ayrılmak İçin Oy Veriyor"
 BBA_italy_anti_colonialism_events.54.desc:0 "Doğu Afrika halkı, topraklarını ne kadar iyi niyetli ve verimli yönettiğimizi gördü ve yönetimimize katılmak için oy verdi! Görünüşe göre eyaletlerindeki yatırımlarımız ve ilgimiz karşılığını verdi. Bu kesinlikle hepimize fayda sağlayacaktır."
