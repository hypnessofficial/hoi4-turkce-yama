 air_base:0 " Hava Üssü"
 air_base_desc:0 "Bu bina, hava kuvvetlerinizin konuşlandırılmasını sağlar."
 air_base_plural:0 " Hava Üsleri"
 air_facility:0 " Aerodinamik ve Aviyonik Tesisi"
 air_facility_desc:0 "Aerodinamik ve Aviyonik için Deneysel Tesisler, uçaklar, roketler ve ilgili elektroniklerle ilgili araştırma projeleri başlatmanıza olanak tanır."
 air_facility_plural:0 " Aerodinamik ve Aviyonik Tesisleri"
 anti_air_building:0 " Uçaksavar"
 anti_air_building_desc:0 "Bu bina, düşman bombardıman uçaklarına karşı eyalete koruma sağlar ve saldıran uçaklara ateş etme yeteneği sunar."
 anti_air_building_plural:0 " Uçaksavar"
 arms_factory:0 " Askeri Fabrika"
 arms_factory_desc:0 "Bu bina devlet sanayi ile yeni askeri teçhizat üretimi için sağlar. Sivil sanayi için gerekirse dönüştürülebilir."
 arms_factory_plural:0 " Askeri Fabrikalar"
 bunker:0 " Kara Kalesi"
 bunker_desc:0 "Bu bina, savaşta saldırgana her kale seviyesi için $VALUE|+%0$ saldırı cezası verir. Birden fazla yönden saldırmak kale etkisini azaltacaktır."
 bunker_plural:0 " Kara Kaleleri"
 canal_kiel:0 " Kiel Kanalı Kilitleri"
 canal_kiel_desc:0 "Kanalın tam kapasite ile çalışabilmesi için Kiel Kanalı kilitlerinin yerinde olması gerekmektedir ve bu kilitlerin tahrip edilmesi nakliye ve hareketi uzun süre engelleyecektir."
 canal_kiel_plural:0 "$canal_kiel$"
 canal_panama:0 " Panama Kanalı Kilitleri"
 canal_panama_desc:0 "Kanalın tam kapasite ile çalışabilmesi için Panama Kanalı kilitlerinin yerinde olması gerekmektedir ve bu kilitlerin tahrip edilmesi nakliye ve hareketi uzun süre engelleyecektir."
 canal_panama_plural:0 "$canal_panama$"
 cataract_dam_mountain:0 "Cataract Barajı"
 cataract_dam_mountain_desc:0 "1907'de tamamlanan Cataract Barajı, Avustralya'nın sömürge dönemindeki önemli mühendislik başarılarından biridir. Yeni Güney Galler'in Güney Yaylaları'ndaki Cataract Nehri üzerine kurulan baraj, Sidney'e temiz su sağlayan dört ana rezervuardan biri olmaya devam etmektedir."
 cataract_dam_mountain_plural:0 "Cataract Barajı"
 coastal_bunker:0 " Kıyı Kalesi"
 coastal_bunker_desc:0 "Bu bina, deniz istilası savaşında saldırgana her kale seviyesi için $VALUE|+%0$ saldırı cezası verir."
 coastal_bunker_plural:0 " Kıyı Kaleleri"
 commercial_nuclear_reactor:0 " Sivil Nükleer Reaktör"
 commercial_nuclear_reactor_desc:0 "Bu bina, eyalete nükleer silahlar için zenginleştirilmiş uranyum sağlar ve sivil ekonomi için elektrik üretir."
 commercial_nuclear_reactor_plural:0 " Sivil Nükleer Reaktörler"
 dam:0 " Baraj"
 dam_desc:0 "Barajlar, bir eyalete ek güç sağlar, endüstri ve kaynak üretimini artırır."
 dam_mountain:0 "$dam$"
 dam_mountain_desc:0 "$dam_desc$"
 dam_mountain_plural:0 "$dam_plural$"
 dam_plural:0 " Barajlar"
 dockyard:0 " Deniz Tersanesi"
 dockyard_desc:0 "Bu bina devlet sanayi ile yeni gemilerin inşasını sağlar."
 dockyard_plural:0 " Deniz Tersaneleri"
 energy_infrastructure:0 " Güçlendirilmiş Elektrik Şebekesi"
 energy_infrastructure_desc:0 "Çoklu yedekleme sistemine sahip güçlendirilmiş elektrik tedarik hatları ve güç altyapısı, ne olursa olsun fabrikalarımızın üretime devam etmesini sağlar."
 fuel_silo:0 " Yakıt Silosu"
 fuel_silo_desc:0 "Bu bina ulusunuza §HYakıt§! depolamak için daha fazla alan sağlar."
 fuel_silo_plural:0 " Yakıt Siloları"
 industrial_complex:0 " Sivil Fabrika"
 industrial_complex_desc:0 "Bu bina devlet sanayi ile sivil malların üretim veya yeni binaların inşası için sağlar. Askeri sanayi için gerekirse dönüştürülebilir."
 industrial_complex_plural:0 " Sivil Fabrikalar"
 industrial_infrastructure:0 " Yüksek Kapasiteli Elektrik Şebekesi"
 industrial_infrastructure_desc:0 "Mevcut sivil güç altyapısına yapılan takviyeler, yüksek yoğunluklu endüstriyel operasyonlar için bize daha yüksek kabiliyetler kazandırır."
 infrastructure:0 " Altyapı"
 infrastructure_desc:0 "Bu bina devlete altyapının iyileştirilmesini sağlar. Stratejik bölgelerdeki tedarik gücünüzü artırır ve tümenlerinizin hızını artırır, ayrıca ham kaynak çıkarımınızı artırır."
 infrastructure_plural:0 " Altyapı"
 land_facility:0 " Karasal Savaş Tesisi"
 land_facility_desc:0 "Karasal Savaş için Deneysel Tesisler, özel tanklar veya topçuluk gibi karasal savaşın çeşitli yönleriyle ilgili araştırma projeleri başlatmanıza olanak tanır."
 land_facility_plural:0 " Karasal Savaş Tesisleri"
 landmark_berlin_reichstag:0 "Reichstag"
 landmark_berlin_reichstag_desc:0 "Plenarbereich Reichstagsgebäude, diğer adıyla Reichstag, Berlin'deki Platz der Republik'te yer alan tarihi bir yasama hükümet binasıdır. 1933'teki Reichstag yangınına kadar Almanya'da federal konsey tarafından kullanılmıştır, ancak yine de halkın kalbinde ve zihinlerinde büyük bir öneme sahip simgesel bir binadır."
 landmark_berlin_reichstag_plural:0 "$landmark_berlin_reichstag$"
 landmark_berlin_volkshalle:0 "Volkshalle"
 landmark_berlin_volkshalle_desc:0 "Volkshalle, halkımızın yılmaz ruhunun ve dünyaya hükmetme konusundaki gururlu iradesinin bir kanıtıdır. Dünyaya, fetih gücüyle her şeyin mümkün olduğunu ve anavatanın en imkansız görevi bile mümkün kılabileceğini gösterecektir."
 landmark_berlin_volkshalle_plural:0 "$landmark_berlin_volkshalle$"
 landmark_big_ben:0 "Big Ben"
 landmark_big_ben_desc:0 "Westminster Saat Kulesi, daha yaygın olarak Big Ben olarak bilinir, bir Britanya kültür simgesidir. Birleşik Krallık ve parlamenter demokrasinin en belirgin sembollerinden biridir. İlk olarak 1859'da Gotik Diriliş tarzında tamamlanmış olup, Büyük Britanya'nın üçüncü en yüksek kulesidir."
 landmark_big_ben_plural:0 "$landmark_big_ben$"
 landmark_bojnice_castle:0 "Bojnice Kalesi"
 landmark_bojnice_castle_desc:0 "Bojnice Kalesi bir zamanlar Macar krallarına ve diğer üst düzey soylulara ev sahipliği yapmıştı, ancak 1920'de Macaristan'dan ayrılmasından bu yana Slovakya'daki en güzel yapılardan biri olarak hizmet vermektedir."
 landmark_colosseum:0 "Kolezyum"
 landmark_colosseum_desc:0 "Kolezyum, Roma'nın merkezinde yer alır. Tamamlanmasından bu yana İmparator Titus tarafından yapılan bu yapıt, Roma İmparatorları ve Roma'nın çöküşünden sonra şehir halkı tarafından eğlence amaçlı kullanılan, yapılmış en büyük antik amfitiyatrodur."
 landmark_colosseum_plural:0 "$landmark_colosseum$"
 landmark_cristo_redentor:0 "Kurtarıcı İsa"
 landmark_cristo_redentor_desc:0 "Kurtarıcı İsa Heykeli, Rio de Janeiro'nun üzerinde yükselmektedir ve inşası 1931 yılında tamamlanmıştır. Brezilya'nın ulusal sembolüdür ve bölgedeki Katolikler arasında büyük bir öneme sahiptir."
 landmark_cristo_redentor_plural:0 "$landmark_cristo_redentor$"
 landmark_eiffel_tower:0 "Eyfel Kulesi"
 landmark_eiffel_tower_desc:0 "Eyfel Kulesi, yaratıcısı Gustave Eiffel'in adını alır ve 1889 yılında tamamlanmıştır. Paris'teki Champ de Mars'ta bulunan Demir Leydi, Fransa'nın küresel bir kültürel simgesi haline gelmiş ve ulusal gururun bir sembolü olmuştur."
 landmark_eiffel_tower_plural:0 "$landmark_eiffel_tower$"
 landmark_forbidden_city:0 "Yasak Şehir"
 landmark_forbidden_city_desc:0 "Ming gücünün antik merkezi olan Yasak Şehir, Çin'in uzun uyum ve refah tarihinin bir sembolüdür. Bugün, içerdiği hazineler ve eserler, başka bir Japon işgali korkusuyla gizlice kaçırıldı..."
 landmark_forbidden_city_plural:0 "$landmark_forbidden_city$"
 landmark_great_wall_section:0 "Çin Seddi"
 landmark_great_wall_section_desc:0 "Yüzlerce yıl boyunca ve düzinelerce yönetim tarafından inşa edilen Çin Seddi, lojistik bir şaheserdir. Bugün, Çin halkının zorluklar karşısındaki büyük cesaretini ve meydan okumasını temsil ettiği söylenebilir."
 landmark_great_wall_section_plural:0 "$landmark_great_wall_section$"
 landmark_hagia_sophia:0 "Ayasofya"
 landmark_hagia_sophia_desc:0 "İmparatorlukların kavşağında duran Ayasofya, Bizans katedrali, Osmanlı camisi ve İstanbul'un sürekli değişen yöneticilerinin sembolü olmuştur. Devasa kubbesi ve görkemli salonları hem manevi önemini hem de şehri kendilerine ait görenlerin hırslarını yansıtır."
 landmark_hakko_ichiu:0 "Hakkō Ichiu Anıtı"
 landmark_hakko_ichiu_desc:0 "Hakkō Ichiu kulesi, Japonya'nın kuruluşunun 2.600'üncü yıl dönümünü anmak ve Japonların Dünyanın Sekiz Köşesini tek bir çatı altında birleştirme kaderini sembolize eden bir anıt olarak inşa edilmiştir."
 landmark_hakko_ichiu_plural:0 "$landmark_hakko_ichiu$"
 landmark_hofburg_palace:0 "Hofburg Sarayı"
 landmark_hofburg_palace_desc:0 "Hofburg, Habsburg hanedanının eski başlıca imparatorluk sarayıdır ve Heldenplatz'a doğru bakmaktadır. Belki bir gün, saray tekrar Avusturya'nın hükümdarları tarafından kullanılabilir, ister bir cumhurbaşkanı isterse bir kral olsun."
 landmark_hofburg_palace_plural:0 "$landmark_hofburg_palace$"
 landmark_kremlin:0 "Kremlin"
 landmark_kremlin_desc:0 "Moskova Kremlin'i, tahkim edilmiş bir kompleks olup, içinde Rusya İmparatoru'nun kraliyet konutu olarak hizmet veren Büyük Kremlin Sarayı yer alır. Kremlin, güneyde Moskva Nehri'ni, doğuda Aziz Vasil Katedrali ve Kızıl Meydan'ı, batıda ise Alexander Bahçesi'ni görebilecek şekilde konumlanmıştır. Günümüzde, devletin otoritesini ve halk üzerindeki kontrolünü simgeleyen bir yapı haline gelmiştir."
 landmark_kremlin_plural:0 "$landmark_kremlin$"
 landmark_nanjing_presidential_palace:0 "Nankin Başkanlık Sarayı"
 landmark_nanjing_presidential_palace_desc:0 "Nankin'deki Başkanlık Sarayı, Qing hanedanının yıkılmasının ardından büyük Sun Yat-sen'in yemin ederek göreve başladığı antik, prestijli bir komplekstir."
 landmark_nanjing_presidential_palace_gen:0 "$landmark_nanjing_presidential_palace$"
 landmark_nanjing_presidential_palace_gen_desc:0 "$landmark_nanjing_presidential_palace_desc$"
 landmark_nanjing_presidential_palace_gen_plural:0 "$landmark_nanjing_presidential_palace_plural$"
 landmark_nanjing_presidential_palace_plural:0 "$landmark_nanjing_presidential_palace$"
 landmark_nanjing_presidential_palace_prc:0 "$landmark_nanjing_presidential_palace$"
 landmark_nanjing_presidential_palace_prc_desc:0 "$landmark_nanjing_presidential_palace_desc$"
 landmark_nanjing_presidential_palace_prc_plural:0 "$landmark_nanjing_presidential_palace_plural$"
 landmark_national_diet:0 "Ulusal Diyet Binası"
 landmark_national_diet_desc:0 "Kokkai-gijidō, Japonya Ulusal Diyeti'nin her iki meclisinin de toplandığı binadır. 1936'nın başlarında tamamlanan bina, birkaç istisna dışında neredeyse tamamen Japon malzemelerinden inşa edilmiştir. Selefi, 1925'te başka bir yangının bölgeyi harap etmesiyle yıkılmıştı. Diyet binası birçok kez düşmüş olsa da, bu sefer kesinlikle yüzyıllarca ayakta kalacak!"
 landmark_national_diet_plural:0 "$landmark_national_diet$"
 landmark_prague_castle:0 "Prag Kalesi"
 landmark_prague_castle_desc:0 "Dünyanın en büyüğü olan kadim Prag Kalesi; yüzyıllar boyunca kralların, imparatorların ve şimdi de nihayet Çekoslovakya başkanlarının ikametgahı olarak hizmet vermiştir. Dış görünüşü, görkemli sarayları andırarak buranın bir savunma tahkimatı değil, bir güç sembolü olduğunu açıkça belli eder. Dış duvarlarının arkasında ise Çekoslovakya'nın 1926'da tamamlanan en büyük kilisesi yer almaktadır."
 landmark_sadabad_complex:0 "Sa'dabad Kompleksi"
 landmark_sadabad_complex_desc:0 "Kaçarlar tarafından inşa edilen ve Pehleviler tarafından genişletilen, kuzey Tahran'daki Sa'dabad Kompleksi, bir kraliyet ikametgahı ve iktidar merkezi olarak hizmet veriyor. Sarayları ve bahçeleri, muhafazakarlıktan modernizme doğru İran'ın değişen siyasi manzarasını yansıtıyor."
 landmark_statue_of_liberty:0 "Özgürlük Heykeli"
 landmark_statue_of_liberty_desc:0 "Devasa Özgürlük Heykeli, yeni bir hayata başlamak isteyen göçmenler için Amerika Birleşik Devletleri'ne önemli bir giriş noktası olan New York Limanı'nda gururla durmaktadır. Daha sonra, Amerikan yaşam, özgürlük ve mutluluk arayışı mizacını somutlaştırmıştır."
 landmark_statue_of_liberty_plural:0 "$landmark_statue_of_liberty$"
 landmark_taj_mahal:0 "Tac Mahal"
 landmark_taj_mahal_desc:0 "Tac Mahal, Babür mimarisinin bir şaheseri olarak durmaktadır. Büyük beyaz mermer kubbeleri ve karmaşık bahçeleri, onu Hindistan'ın en ikonik sembollerinden biri haline getirir ve hem imparatorluk gücünün hem de kalıcı mirasın bir kanıtıdır."
 landmark_tokyo_imperial_palace:0 "İmparatorluk Sarayı"
 landmark_tokyo_imperial_palace_desc:0 "Tokyo İmparatorluk Sarayı, İmparator'un ana ikametgahıdır ve Meiji Restorasyonu ile son Şogunluğun devrilmesinden bu yana böyle olmuştur. Japon halkı için bir gurur ve hürmet sembolüdür ve onlara çok çalışmaları için ilham verir."
 landmark_tokyo_imperial_palace_plural:0 "$landmark_tokyo_imperial_palace$"
 mega_gun_emplacement:0 " Çok Şarjlı Büyük Kalibreli Top"
 mega_gun_emplacement_desc:0 "Çok şarjlı tahrik prensibiyle çalışan bu büyük kalibreli top, bombardımanda benzersiz menzillere ulaşmak için tasarlanmıştır. Bir dizi yeraltı tünelini kullanarak, mermileri uzaktaki hedeflere doğru fırlatmadan önce süpersonik hızlara çıkarır."
 mega_gun_emplacement_plural:0 " Çok Şarjlı Kalibreli Toplar"
 naval_base:0 " Deniz Üssü"
 naval_base_desc:0 "Filonuzun menzilini genişletir ve onarım hizmetleri sağlar. Denizaşırı ikmal ve kaynak ihracatına olanak tanır. Daha yüksek seviyeler, ikmal kapasitesini artırır."
 naval_base_plural:0 " Deniz Üsleri"
 naval_facility:0 " Denizcilik Mühendisliği Tesisi"
 naval_facility_desc:0 "Deneysel Donanma Mühendisliği Tesisleri, Su Üstü Gemileri ve Denizaltılarla ilgili araştırma projelerine başlamanızı sağlar.\nBir Donanma Mühendisliği Tesisi yalnızca bir kıyı ilinde kurulabilir."
 naval_facility_plural:0 " Denizcilik Mühendisliği Tesisleri"
 naval_headquarters:0 " Donanma Karargahı"
 naval_headquarters_desc:0 "Bu bina, Donanma Karargahının menzili içinde faaliyet gösteren §YGörev Güçlerinin§! etkinliğini artırmak için bir amiral atamanıza olanak tanır.\n\nAynı anda en fazla $MAXNUM|H$ karargaha bir amiral atanabilir.\n   Şu anda atanan: $CURRNUM|H$\n\nBir Donanma Karargahı, yalnızca en az 8. seviye Deniz Üssü olan bir kıyı ilinde inşa edilebilir. "
 naval_supply_hub:0 " Donanma İkmal Merkezi"
 naval_supply_hub_desc:0 "Bu bina, filolarınızın Ana Üslerine ek olarak bu üste de ikmal ve yakıt almasını sağlar, bu da potansiyel olarak §YGörev Güçlerinizin§! operasyonel menzilini uzatır.\nBir Donanma İkmal Merkezi, yalnızca en az 8. seviye Deniz Üssü olan bir kıyı ilinde inşa edilebilir."
 nuclear_facility:0 " Nükleer Araştırma Tesisi"
 nuclear_facility_desc:0 "Nükleer Araştırma için Deneysel Tesisler, nükleer güç kullanımıyla ilgili araştırma projeleri başlatmanıza olanak tanır."
 nuclear_facility_plural:0 " Nükleer Araştırma Tesisleri"
 nuclear_reactor:0 " Nükleer Reaktör"
 nuclear_reactor_desc:0 "Bu bina, eyalete nükleer silahlar için zenginleştirilmiş Uranyum üretimi sağlar."
 nuclear_reactor_heavy_water:0 " Ağır Su Nükleer Reaktörü"
 nuclear_reactor_heavy_water_desc:0 "Bu bina, eyalete nükleer silahlar için zenginleştirilmiş Uranyum üretimi sağlar.\nAğır Su kullanan nükleer reaktörler, Grafit Reaktörlere göre biraz daha ucuz inşa edilebilir, ancak nükleer silah üretiminde kullanılabilecek daha az malzeme üretir."
 nuclear_reactor_heavy_water_plural:0 " Ağır Su Nükleer Reaktörleri"
 nuclear_reactor_plural:0 " Nükleer Reaktörler"
 radar_station:0 " Radar İstasyonu"
 radar_station_desc:0 "Radar, yakındaki eyaletlerdeki düşman birlikleri hakkında istihbarat edinmenizi sağlar.\nBir eyaletteki daha yüksek radar seviyesi, radarın etkili menzilini artırır.\nRadar ayrıca eyaletteki düşman hava kuvvetlerinin tespitini geliştirir ve uçaklarınızın onları yakalama şansını artırır.\nBuna ek olarak, radar denizdeki düşman filolarının tespit edilmesini de artırır."
 radar_station_plural:0 " Radar İstasyonları"
 rocket_site:0 " Roket Üssü"
 rocket_site_desc:0 "Bu bina, eyalete üretilen roketlerin konuşlandırılmasını sağlar."
