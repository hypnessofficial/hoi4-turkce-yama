 MTG_treaty_renew_mission_timeout_tt:0 "Konferans sona erer ve antlaşmalar yürürlüğe girer. O zamana kadar §Yserbestçe çekilebiliriz§!; sonrasında çekilmek için §Ydünya geriliminin %20'yi aşması§! gerekir."
