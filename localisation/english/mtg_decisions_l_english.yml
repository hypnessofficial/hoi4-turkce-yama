 ENG_urge_restraint:0 "İtidal Çağrısı Yap"
 ENG_urge_restraint_desc:0 "Bir sonraki yürüyüşümüzün sorunsuz geçmesi zorunludur, aksi takdirde ona yönelik şiddetli tepki ülkenin geri kalanına sıçrayabilir ve ülke çapında huzursuzluğu ve potansiyel olarak hatta iç savaşı ateşleyebilir. En katı destekçilerimizden bazılarını uzaklaştırsa da, yürüyüşçülerimize ne pahasına olursa olsun şiddetten kaçınmaları talimatını vermeliyiz."
 ENG_urge_restraint_tt:0 "Bir sonraki §YKara Gömlekliler Yürüyüşü§!'nde §YŞiddetli Yürüyüş§! olasılığını büyük ölçüde azaltır.\n"
