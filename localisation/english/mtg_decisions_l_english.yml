 HOL_anti_pacifist_propaganda:0 "Anti-Pasifist Propaganda"
 HOL_anti_pacifist_propaganda_desc:0 "Ancak sıkı çalışma ve adanmış kaynaklar halkımızın eğilimlerinde bir değişiklik yaratacaktır. Ucuz olmasa da, insanların sonuçları olmadan savunmasızlık lüksüne çok daha uzun süre sahip olamayacağımızı anlamalarını sağlayacak büyük bir propaganda kampanyası başlatacağız."
 HOL_assemble_air_squadron:0 "Hava Filosu Topla"
 HOL_assemble_air_squadron_desc:0 "Acemilerimizden birkaçı, havada ellerinden geleni yapmak için uçak pilotluğu öğrenme arzusunu dile getirdi. Onlara izin vermek için müttefiklerimizden uçak talep etmeliyiz."
 HOL_attract_east_indies_oil_companies:0 "Doğu Hint Adaları Petrol Şirketlerini Çek"
 HOL_attract_east_indies_oil_companies_desc:0 "Yabancı petrol şirketlerinin yardımıyla Doğu Hint Adaları'ndaki rafineriler, kendimize büyük bir maliyet getirmeden genişletilebilir, bu da Doğu Asya'daki artan petrol talebini karşılamamıza olanak tanır."
 HOL_attract_east_indies_oil_companies_tt:0 "Bu kararı sırasıyla §Y3§!, §Y6§! ve §Y10§! kez aldıktan sonra §YJava§!, §YSumatra§! veya §YKalimantan§!'a §G1§! İnşaat Alanı ve §Y1 Sivil Fabrika§! ekle.\n"
 HOL_attract_foreign_industry:0 "Yabancı Sanayiyi Çek"
 HOL_attract_foreign_industry_desc:0 "Sömürgelerimize daha fazla yabancı sanayi çekmek, üzerimizdeki mali yükü hafifletecek ve yerli sanayimizi geliştirmeye daha fazla kaynak ayırmamıza olanak tanıyacaktır."
 HOL_attract_foreign_investors:0 "Yabancı Yatırımcıları Çek"
 HOL_attract_foreign_investors_desc:0 "Sömürge gelişmelerimizin bir kısmını finanse etmek için daha fazla yatırımcı çekmek, üzerimizdeki mali yükü hafifletecek ve kıtaya daha fazla kaynak ayırmamıza olanak tanıyacaktır."
 HOL_attract_west_indies_oil_companies:0 "Batı Hint Adaları Petrol Şirketlerini Çek"
 HOL_attract_west_indies_oil_companies_desc:0 "Birçok yabancı petrol şirketi, Venezüella petrolünü işleme ve beraberinde getirdiği tüm zenginlikleri paylaşma amacıyla Curaçao ve Aruba'da rafineriler inşa etmeye ilgi duyduğunu belirtti."
 HOL_attract_west_indies_oil_companies_tt:0 "Bu kararı §Y5§! kez aldıktan sonra §YCuraçao§!'ya §G1§! İnşaat Alanı ve §Y1 Sivil Fabrika§! ekle.\n"
 HOL_bernhard:0 "Bernhard"
 HOL_bernhard_desc:0 "Kraliçe'nin damadı ve Prenses Juliana'nın kocası Bernhard van Lippe-Biesterfeld, ülkesi adına düşmanla savaşmak için büyük bir arzu gösterdi. Aslen kendisi Alman olmasına rağmen, şimdi tamamen Hollandalı hissediyor ve vatanseverlik görevini yapmaktan başka bir şey istemiyor. Özgür ruhlu ve bağımsız kişiliği ve işlere kişisel olarak dahil olma arzusu göz önüne alındığında, ona istediği pozisyonu vermek pekala öngörülemeyen sonuçlar doğurabilir..."
 HOL_crack_down_on_pacifist_movements:0 "Pasifist Hareketlere Baskı Uygula"
 HOL_crack_down_on_pacifist_movements_desc:0 "Çeşitli pasifist hareketler, askeri yeniden silahlanmamızı zaten yeterince engelledi. Eğer halkın sesi değiştirilemiyorsa, zorla susturulmalıdır."
 HOL_demand_increased_dutch_trade_with_germany:0 "Almanya ile Hollanda Ticaretinin Artırılmasını Talep Et"
 HOL_demand_increased_dutch_trade_with_germany_desc:0 "Hollandalılara, komşumuz olarak askeri kırılganlıklarının yanı sıra Alman devletine olan ticaret yükümlülükleri de... hatırlatılmalıdır. Elbette, ustaca."
 HOL_demand_reduced_dutch_trade_with_germany:0 "Almanya ile Hollanda Ticaretinin Azaltılmasını Talep Et"
 HOL_demand_reduced_dutch_trade_with_germany_desc:0 "Hollandalılar dize getirilmeli ve Almanya'ya uygulanan ticaret kısıtlamalarına uymalıdır. Kesinlikle onları da bu kısıtlamalara dahil etmemizi istemezler..."
 HOL_drain_the_water_lines:0 "Su Hatlarını Boşalt"
 HOL_drain_the_water_lines_desc:0 "Tehlike geçti ve bu nedenle Hollanda Su Hattı'nı boşaltabiliriz, bu da kırsalı bir kez daha kullanmamıza olanak tanır."
 HOL_draw_up_combined_staff_plan:0 "Birleşik Kurmay Planı Hazırla"
 HOL_draw_up_combined_staff_plan_desc:0 "Hayatta kalmamız, potansiyel bir gelecekteki müttefikimizle ordumuzun ortak işbirliğine bağlıdır. Birleşik bir kurmay planı geliştirme hedefiyle bir askeri misyon gönderebiliriz, bu da düşman bir güç tarafından işgal anından itibaren bu işbirliğini büyük ölçüde kolaylaştıracaktır."
 HOL_establish_pro_war_labor_indoctrination:0 "Savaş Yanlısı İşçi Endoktrinasyonu Kur"
 HOL_establish_pro_war_labor_indoctrination_desc:0 "İşçiler bizim tarafımızda olduğu sürece, gerisi sonunda hizaya gelecektir. Bazı küçük işyeri verimliliği maliyetiyle, halkımıza bir vatanseverlik duygusu aşılayacak ve değerlerimizi korumak için güçlü bir ordunun gerekliliğini anlamalarını sağlayacağız."
 HOL_exchange_intelligence_data:0 "İstihbarat Verilerini Değiştir"
 HOL_exchange_intelligence_data_desc:0 "İstihbarat servisimizin bazı başarıları oldu ve potansiyel gelecekteki müttefiklerimize bir bilgi alışverişi teklif etmek mümkün olabilir, bu da her iki ulusumuzun da bir işgal senaryosundaki en olası açılış hamlelerine karşı hazırlıklılığını büyük ölçüde artırır."
 HOL_gateway_to_europe_decisions_tt:0 "[HOL.GetNameDef] taleplerimize boyun eğerse, tüm §YAvrupa'ya Açılan Kapı§! katılımcıları tarafından yatırılan toplam miktara eşit bir §YSiyasi Güç§! alacağız. Şu anda bu miktar:\n"
 HOL_gateway_to_europe_eng_category:0 "Avrupa'ya Açılan Kapı"
 HOL_gateway_to_europe_eng_category_desc:0 "Almanlar, Hollandalıları bir 'arka kapı' olarak kullanıyor, tarafsız Hollanda gemiciliğini ve limanlarını kullanarak ablukamızı aşıyorlar. Eğer ablukamızı daha başarılı kılmak istiyorsak, Hollandalıları irademize boyun eğdirmeliyiz."
 HOL_gateway_to_europe_ger_category:0 "Avrupa'ya Açılan Kapı"
 HOL_gateway_to_europe_ger_category_desc:0 "Hollandalılar bir 'arka kapı' oluşturuyor, bu da İngiliz ablukasını atlatmamıza ve tarafsız limanlar aracılığıyla ticareti sürdürmemize olanak tanıyor. Hollandalılara, sınırlarından bize geçmesine izin verdikleri ticaret miktarını artırmaları için baskı yapmalıyız."
 HOL_gateway_to_europe_hol_category:0 "Avrupa'ya Açılan Kapı"
 HOL_gateway_to_europe_hol_category_desc:0 "İngilizler ve Almanlar arasında ticaretimiz üzerindeki çekişme artıyor. Talepleriyle başa çıkarken dikkatli olmalıyız, çünkü birinin taleplerine boyun eğmek muhtemelen diğeriyle düşmanlıklara yol açacaktır..."
 HOL_give_bernhard_generalship:0 "Bernhard'a Generallik Ver"
 HOL_give_bernhard_generalship_desc:0 "Prens, yeni anavatanı için savaşma arzusunu belirtti ve kuvvetlerimizin komutasını almayı, onların zorluklarını paylaşmayı ve onları zafere götürmeyi diliyor."
 HOL_inundate_the_water_lines:0 "Su Hatlarını Sular Altında Bırak"
 HOL_inundate_the_water_lines_desc:0 "Dikkatle hazırlanmış Hollanda Su Hattı, kırsala zarar verecek olsa da, düşmanın ilerlemesini önlemek için şimdi sular altında bırakılmalıdır."
 HOL_obtain_dockyard_access:0 "Tersane Erişimi Elde Et"
 HOL_obtain_dockyard_access_desc:0 "İşgal sırasında çeşitli gemiler inşa halindeydi. Tamamlanmamış gövdeleri İngiltere'ye çekerek bazılarını kurtarmayı başardık, ancak şimdi onları bitirmek için İngiliz yardımına ihtiyacımız var."
 HOL_offer_venezuelan_protection:0 "Venezüella Koruması Teklif Et"
 HOL_placate_the_british:0 "İngilizleri Yatıştır"
 HOL_placate_the_british_desc:0 "Eğer ticaret yaptırımlarına dahil edilme tehdidini önleyeceksek, mevcut ticaret müzakerelerinde İngilizlere bazı tavizler vermeliyiz."
 HOL_placate_the_germans:0 "Almanları Yatıştır"
 HOL_placate_the_germans_desc:0 "Eğer memnuniyetsizlikleri durumunda işgal tehdidini önleyeceksek, mevcut ticaret müzakerelerinde Almanlara bazı tavizler vermeliyiz."
 HOL_prepare_evacuation_of_gold_reserves:0 "Altın Rezervlerinin Tahliyesine Hazırlan"
 HOL_prepare_evacuation_of_gold_reserves_desc:0 "Ulusal altın rezervlerimiz - ulusal hükûmetimizin temeli - bir işgal durumunda tahliye edilmelidir. Bunu yapmamak, sürgündeki bir hükûmeti tamamen güçsüz kılacaktır."
 HOL_prepare_evacuation_of_gold_reserves_tt:0 "Bu, bir §YSürgün Hükûmeti§! haline gelindiğinde kaldırılır.\n"
 HOL_prepare_evacuation_of_gold_reserves_tt_2:0 "Bir §YSürgün Hükûmeti§! haline gelindiğinde §Y100 Siyasi Güç§! ve £legitimacy §YMeşruiyet§! artışı kazan.\n"
 HOL_propose_benelux_unification:0 "Benelux Birleşmesini Öner"
 HOL_propose_benelux_unification_desc:0 "Küresel krizler bol ve biz büyükler arasında sadece küçük uluslarız. Eğer yaklaşan fırtınayı atlatacaksak, egemenliğimizden vazgeçmek anlamına gelse bile, hükûmetin her düzeyinde birleşme aramalıyız."
 HOL_propose_benelux_unification_tt:0 "§RBonusların yürürlüğe girmesi için [BEL.GetNameDefCap] ve [LUX.GetNameDefCap]'in anlaşmayı onaylaması gerekir.§!\n"
 HOL_pull_strings_with_british_industrialists:0 "İngiliz Sanayicilerle İpleri Çek"
 HOL_pull_strings_with_british_industrialists_desc:0 "İngiliz-Hollanda sanayi işbirliği yıllardır devam ediyor ve Philips ve Royal Dutch Shell gibi çeşitli çokuluslu şirketler doğurdu. Belki de şimdi sürgündeki kuvvetlerimizin tedarikini sağlamak için bu İngiliz bağlantılarını kullanabiliriz."
 HOL_pursue_diplomatic_grievances:0 "Diplomatik Şikayetlerin Peşine Düş"
 HOL_pursue_diplomatic_grievances_desc:0 "Prens Bernhard'a ve aslında tüm hükûmetimize yönelik hakaretler, askeri tehditler noktasına varan tam teşekküllü bir diplomatik krize tırmandı. Derhal ve kesin bir özür talep ediyoruz, yoksa sözlerimizin arkasında durmak zorunda kalabiliriz..."
 HOL_pursue_diplomatic_grievances_tt:0 "Bu, hedefe karşı bir savaş nedeni ile sonuçlanabilir.\n"
 HOL_radio_oranje:0 "Radio Oranje"
 HOL_radio_oranje_desc:0 "Hem işgal altındaki topraklarda yaşayanlara, hem de müttefiklerimizle birlikte özgürlükleri için savaşanlara umut vermek amacıyla BBC'de Hollandaca yayınlanan yeni bir \"Radio Orange\" yayınının zamanı geldi."
 HOL_relocate_government_to_batavia:0 "Hükûmeti Batavia'ya Taşı"
 HOL_relocate_government_to_batavia_desc:0 "Anavatanımız istila edildi, ama sömürgelerimiz el değmemiş durumda. Kraliçe'nin isteklerine aykırı olsa da, hükûmetimizi Doğu Hint Adaları'nın başkenti Batavia'ya taşıyabilir ve savaş çabalarını oradan sürdürebiliriz."
 HOL_request_aid_for_the_engelandvaarders:0 "Engelandvaarder'lar için Yardım Talep Et"
 HOL_request_aid_for_the_engelandvaarders_desc:0 "İngiltere'yi Hollanda'dan ayıran 160 kilometreden fazla Kuzey Denizi, işgalden kaçmak isteyen ve vatanlarının kurtuluşu için vatandaşlarıyla birlikte savaşmak isteyen Hollandalılar için caydırıcı değil. Bu \"Engelandvaardlılar\" veya \"İngiltere Denizcileri\", cılız küçük kayıklar veya kanolarla açık sularda, on kişiden birden azının hayatta kalabileceği kadar zor koşullar altında cesurca ilerliyorlar. Sadece buna teşebbüs etmek bile onları cesurların en cesurları arasına sokuyor ve İngilizlerden başarı olasılıklarını artırmak için ellerinden geleni yapmalarını istemek bizim görevimizdir."
 HOL_request_equipment:0 "Teçhizat Talep Et"
 HOL_request_equipment_desc:0 "Ordumuzun, gerekli genişlemeyi desteklemek için acilen teçhizata ihtiyacı var. Belki de potansiyel gelecekteki müttefiklerimiz yardımcı olabilir..."
 HOL_request_equipment_tt:0 "VEYA\n"
 HOL_request_equipment_tt_2:0 "§RBonusların yürürlüğe girmesi için [From.GetNameDefCap]'in anlaşmayı onaylaması gerekir.§!\n"
 HOL_request_infantry_equipment:0 "Piyade Teçhizatı Talep Et"
 HOL_request_infantry_equipment_desc:0 "Eğer müttefiklerimize savaşta yardım edeceksek, bunu yapmak için onlardan gerekli teçhizatı almalıyız."
 HOL_share_military_knowledge:0 "Askeri Bilgiyi Paylaş"
 HOL_share_military_knowledge_desc:0 "Neredeyse 150 yıllık barıştan sonra, komşularımız askeri konulardaki anlayışlarında bizden çok daha ilerideler. Belki de potansiyel gelecekteki müttefiklerimiz, anavatanımızın gelecekteki savunmasına yardımcı olmak için bu bilgilerin bir kısmını paylaşmaya istekli olabilir."
 LIT_move_capital_to_vilnius:0 "Başkenti Vilnius'a Taşı"
 MEX_category_church_power:0 "Kilise Gücü"
 MEX_category_church_power_desc:0 "§YKilise§!, Devrimci devlet tarafından uzun yıllardır bastırılmıştır. Gelecekteki politikamız ya ideoloji ya da realpolitik tarafından tanımlanabilir, ancak kararlı bir şekilde hareket etmeliyiz."
 MEX_category_hispanic_solidarity:0 "Hispanik Dayanışması"
 MEX_category_hispanic_solidarity_desc:0 "Diplomatik çabalarımız diğer Latin Amerika ülkelerine yönelik olmalıdır. 'Hispanidad' (Hispaniklik) ile birleştik ve yabancı nüfuza direnmek istiyorsak uygun bir ittifak kurmalıyız."
 MEX_category_military_issues:0 "Askeri Meseleler"
 MEX_category_territorial_integration:0 "Topraksal Bütünleşme"
 MEX_category_territorial_integration_desc:0 "Yozlaşmış hükûmetleri devirmek için verdiğimiz devrimci mücadele, bizi tüm ülkelerin kontrolüyle ödüllendiriyor. Bu bölgelerin sakinleri sadece baskı gördüler ve gerçek kurtuluşun tadını çıkarmak için [MEX.GetNameDef]'e dahil edilmeleri gerekiyor."
 MEX_decision_assassinate_cristero_traitor:0 "Cristero Hainine Suikast Düzenle"
 MEX_decision_assassinate_cristero_traitor_desc:0 "Devlete karşı silahlanan isyancılar acımayı hak etmiyor ve merhamet görmeyecekler. Kilise liderleriyle müzakere edilen barış şartları düşmanlıkları sona erdirmeyi amaçlasa da, hainlerin fırsat bulurlarsa tekrar silahlanacaklarını biliyoruz. Önce biz saldırmalıyız."
 MEX_decision_attend_public_mass:0 "Halka Açık Ayine Katıl"
 MEX_decision_attend_public_mass_desc:0 "Yirmi yıldır, Meksika başkanları açıkça veya zımnen Kiliseye düşman olmuştur. Birkaç basit jest, siyasi ve dini sistemlerimizi uzlaştırmada büyük bir yol kat edebilir."
 MEX_decision_coastal_defence_plan:0 "Kıyı Savunma Planını Uygula"
 MEX_decision_coastal_defence_plan_desc:0 ""
 MEX_decision_incite_tensions:0 "Gerilimi Kışkırt"
 MEX_decision_incite_tensions_desc:0 "İç düşmanlarımız hala bize karşı örgütleniyor. Her türlü tehdide karşı hazır olmalıyız! Yenilmez irademizi göstermek için destekçilerimizi bir gösteride toplayacağız!"
 MEX_decision_integrate_belize:0 "[BLZ.GetNameDef]'i Entegre Et"
 MEX_decision_integrate_costa_rica:0 "[COS.GetNameDef]'i Entegre Et"
 MEX_decision_integrate_cuba:0 "[CUB.GetNameDef]'i Entegre Et"
 MEX_decision_integrate_el_salvador:0 "[ELS.GetNameDef]'i Entegre Et"
 MEX_decision_integrate_guatamala:0 "[GUA.GetNameDef]'i Entegre Et"
 MEX_decision_integrate_haiti:0 "[HAI.GetNameDef]'i Entegre Et"
 MEX_decision_integrate_honduras:0 "[HON.GetNameDef]'i Entegre Et"
 MEX_decision_integrate_nicaragua:0 "[NIC.GetNameDef]'i Entegre Et"
 MEX_decision_integrate_panama:0 "[PAN.GetNameDef]'i Entegre Et"
 MEX_decision_integrate_panama_canal:0 "Panama Kanalı'nı Entegre Et"
 MEX_decision_integrate_the_dominican_republic:0 "[DOM.GetNameDef]'i Entegre Et"
 MEX_decision_interior_defence_plan:0 "İç Savunma Planını Uygula"
 MEX_decision_interior_defence_plan_desc:0 ""
 MEX_decision_invite_tag_to_the_hispanic_alliance:0 "[From.GetNameDef]'i [MEX.GetFactionName]'e Davet Et"
 MEX_decision_nationalize_church_lands:0 "Kilise Topraklarını Millileştir"
 MEX_decision_nationalize_church_lands_desc:0 "Kiliseler ve ruhban okulları resmi olarak hükûmete aittir ve rahipler ile rahibeler devlet memurudur. Maliyet külfetli hale geliyor. Belki de daha fazla kiliseyi yıkarak hükûmetin maaş bordrosunu azaltabiliriz?"
 MEX_decision_operation_just_cause:0 "Operation Just Cause"
 MEX_decision_pardon_cristero_fighter:0 "Cristero Savaşçısını Affet"
 MEX_decision_pardon_cristero_fighter_desc:0 "Başkan Calles, Cristero Savaşı'nın kışkırtılmasından büyük ölçüde sorumludur. Şimdi 'kenara çekildi', bu yüzden yetenekli ve sadık Cristero savaşçılarını ordumuza dahil etme formalitelerini takip edebiliriz."
 MEX_decision_prosecute_clergyman:0 "Din Adamlarını Yargıla"
 MEX_decision_prosecute_clergyman_desc:0 "1917 Anayasası, rahiplerin siyasi sistemimize katılmasını yasaklar. Halka açık yerlerde cübbe giymek için para cezaları, siyasi açıklamalar yapmak için hapis; Kiliseye saldırmanın ve Meksika devletinin batıl unsurlar üzerindeki üstünlüğünü göstermenin her zaman bir yolu vardır."
 MEX_decision_reconciliation_committee:0 "Uzlaşma Komitesi"
 MEX_decision_reconciliation_committee_desc:0 "Cristiada sırasında her iki tarafta işlenen birçok suç, hala iyileşmemiş bir yara açtı. Yakın geçmişin adaletsizliklerine ışık tutarak, belki de gelecekteki suiistimalleri önlemeye yardımcı olabiliriz."
 MEX_decision_support_spanish_fascists:0 "İspanyol Sağını Destekle"
 MEX_decision_support_spanish_fascists_desc:0 "Komünist tehdidi yayılmadan önce ortadan kaldırabilmeleri için İspanya'daki düzenin yeniden kurucularına bir tüfek sevkiyatı göndereceğiz."
 MEX_decision_support_spanish_loyalists:0 "İspanyol Solunu Destekle"
 MEX_decision_support_spanish_loyalists_desc:0 "Demokrasiyi, Franco ve onun faşist uşaklarının yasadışı gaspçılarına karşı savunmak için Cumhuriyetçi hükûmete bir tüfek sevkiyatı göndereceğiz."
 MEX_decision_transfer_lands_to_church:0 "Toprakları Kiliseye Devret"
 MEX_decision_transfer_lands_to_church_desc:0 "Devrim öncesi kilise büyük ve zengindi. Açgözlü generaller ve valiler, kilise topraklarının geniş alanlarını geleneksel koruyucularından çaldılar, ancak şimdi bir kısmını iade edebiliriz."
 MEX_democratic_party_institutional_revolutionary_party_long:0 "Partido Revolucionario Institucional"
 MEX_democratic_party_institutional_revolutionary_party_short:0 "PRI"
 MEX_democratic_party_mexican_revolution_party_long:0 "Partido de la Revolución Mexicana"
 MEX_democratic_party_mexican_revolution_party_short:0 "PRM"
 MEX_democratic_party_national_action_party_long:0 "Partido Acción Nacional"
 MEX_democratic_party_national_action_party_short:0 "PAN"
 MEX_fascist_party_legionnaires_of_christ_long:0 "Legionarios de Cristo"
 MEX_fascist_party_legionnaires_of_christ_short:0 "LC"
 MEX_fascist_party_national_revolutionary_party_long:0 "Partido Nacional Revolucionario"
 MEX_fascist_party_national_revolutionary_party_short:0 "PNR"
 MEX_join_mexican_faction:0 "[MEX.GetFactionName]'e Katıl"
 MEX_mission_cedillos_rebellion:0 "Kaudillo İsyanı"
 MEX_mission_cedillos_rebellion_desc:0 "General Saturnino Cedillo ve ona bağlı kaudillolar, uzun yıllardır merkezi hükûmetten bağımsız hareket ettiler. [Root.GetLeader]'in birleşik bir ulus inşa etme çabaları onların gücüne bir tehdittir ve bu nedenle ilerlememizi iyi ya da kötü yollarla geri almaya çalışıyorlar."
 MEX_mission_second_cristiada:0 "İkinci Cristero Savaşı"
 MEX_mission_second_cristiada_desc:0 "'Kutsal Kilise'deki batıl inançlı kültistlere yönelik saldırılarımız, ordunun sağ kanat unsurlarını kızdırıyor. Ya yaklaşımımızı yumuşatmalı ya da onları sahada yenmeye hazırlanmalıyız."
 MEX_mission_second_cristiada_dummy:0 "İkinci Cristero Savaşı"
 MEX_mission_second_cristiada_dummy_desc:0 "Eğer hükûmet Kiliseye yaklaşımında çok sert olursa, Cristerolar bizi devirmek için bir kez daha silahlanabilir."
 MEX_mission_second_revolution:0 "İkinci Meksika Devrimi"
 MEX_mission_second_revolution_desc:0 "Kutsal Kilise'ye verdiğimiz destek, ordunun sol kanat ve Kilise karşıtı unsurlarını kızdırıyor. Ya yaklaşımımızı yumuşatmalı ya da onları sahada yenmeye hazırlanmalıyız."
 MEX_mission_second_revolution_dummy:0 "İkinci Meksika Devrimi"
 MEX_mission_second_revolution_dummy_desc:0 "Hükûmetteki laikçiler tarafından din konusunda bir miktar ılımlılık tolere edilecek olsa da, Kilise ile çok yakın bir ilişki aşırı sol ve ateist generallerden bir isyanı kışkırtabilir."
 MEX_party_workers_peasants_mexico_long:0 "Partido Obrero-Campesino Mexicano"
 MEX_party_workers_peasants_mexico_short:0 "POCM"
 MTG_NAVAL_TREATY_EXPOSURE_INTEL:0 "Hakkımızdaki deniz istihbaratı §Y%65§!'i aşan herhangi bir imzacı, ihlali kamuoyuna açıklayabilir."
 MTG_NAVAL_TREATY_EXPOSURE_TIME:0 "Yabancı istihbarat servisleri başlangıçta aleyhimize kanıt toplayamaz, ancak bu aldatmaca sürmez: §Y420 gün§! sonra herhangi bir imzacı durumu açığa çıkarabilir."
 MTG_NAVAL_TREATY_MEMBERS_LABEL:0 "İmzacılar:"
 MTG_NAVAL_TREATY_MEMBER_TT:0 "§Y[This.GetName]§!\n[GetMTGNavalTreatyMemberStatus]\n[GetMTGNavalTreatyMemberStrength]"
 MTG_NAVAL_TREATY_OVER_ALLOWANCE_TT:0 "§Rİzin verilen sınırın üzerinde§!. Bu filo, Büyük Savaş Gemisi Gücü ölçütünü aştığı için herhangi bir antlaşma üyesinin silahsızlanma talebiyle karşılaşabilir."
 MTG_NAVAL_TREATY_STATUS_ADHERENT:0 "Asıl antlaşmanın sınırlarına bağlı"
 MTG_NAVAL_TREATY_STATUS_ESCALATOR:0 "Silahlanmayı artırma maddesini yürürlüğe koydu"
 MTG_NAVAL_TREATY_STATUS_EXPOSED:0 "Antlaşma sınırlarını aşan gemiler inşa ederken yakalandı"
 MTG_NAVAL_TREATY_STRENGTH_BENCHMARK:0 "Antlaşmadaki oranların karşılaştırıldığı ölçüt"
 MTG_NAVAL_TREATY_STRENGTH_RATIO:0 "Büyük Savaş Gemisi Gücü: [GetStrengthRatioBritain] [GetRelevantNavalTreatyNation]"
 MTG_NAVAL_TREATY_STRENGTH_TT:0 "Yukarıdaki değer her gövdeyi ayrı ağırlıklandırır: §YZırhlılar 1§!, §YMuharebe Kruvazörleri 0,8§!, §YAğır Kruvazörler 0,5§! ve §YUçak Gemileri 0,5§!.\n\nBir filo, imzacı bir ülke için ölçütün §Y%110§!'unu, hiç imzalamamış bir ülke için §Y%100§!'ünü veya antlaşmadan çekilmiş bir ülke için §Y%80§!'ini aştığında, herhangi bir antlaşma üyesi siyasi güç harcayarak silahsızlanma talep edebilir. Britanya ve [USA.GetNameDef] antlaşmalarda yer almıyorsa bu sınırlar sırasıyla §Y50§!, §Y50§! ve §Y20§! Büyük Savaş Gemisi olur.\n\nTalebin kabul edilmesi, sınırın altına inmek için bir son tarih belirler. Bu süreyi aşan bir imzacı §R%10§! istikrar ve §R35§! siyasi güç kaybeder; antlaşma dışındaki bir ülke ise tüm imzacılara kendisini kukla yapmak için savaş hedefi verir.\n\nTalebi doğrudan reddeden bir imzacı, §R%10§! istikrar ve §R150§! siyasi güç kaybederek antlaşmalardan derhâl çıkar. Bunun sonucunda üye sayısı üçün altına düşerse bir başka üye de çekilir. Talepte bulunan ülke §Rambargo§! ve kalıcı bir görüş cezasıyla karşılık verebilir; kalan üyeler silahlanmayı artırma maddesini yürürlüğe koyabilir."
 MTG_abandon_treaty_democratic:0 "Denizcilik Antlaşmalarından Çekil"
 MTG_abandon_treaty_democratic_desc:0 "Deniz silahlanmalarının ilerleyişini kontrol altına alma girişimi başarısız oldu. Geleceğin tehditlerini karşılamak için yeniden silahlanmamıza izin verilmelidir."
 MTG_abandon_treaty_fascist:0 "Denizcilik Antlaşmalarını Terk Et"
 MTG_abandon_treaty_fascist_desc:0 "Dünyanın demokrasileri kendilerini aptalca hukukun üstünlüğüne zincirlediler. Ama ulusların mücadelesinde tek bir yasa vardır: doğanın yasası ve doğanın yasaları güç gerektirir. Güçlü bir filo inşa etme arzumuzda engellenmeyeceğiz!"
 MTG_abandon_treaty_japanese:0 "Deniz Anlaşmalarını Terk Et"
 MTG_abandon_treaty_japanese_desc:0 "Dünya demokrasileri kendilerini aptalca hukukun üstünlüğüne zincirlediler. Ancak ulusların mücadelesinde tek bir yasa vardır: doğa yasası ve doğa yasaları güç gerektirir. Kudretli bir filo inşa etme arzumuzda sınırlandırılmayacağız!"
 MTG_cheat_on_treaty:0 "Antlaşmalarda Hile Yap"
 MTG_cheat_on_treaty_democratic:0 "Antlaşma Sınırlarını Gizlice Aş"
 MTG_cheat_on_treaty_democratic_desc:0 "Sınırlar herkesi dizginlemek için konmuştu ve herkes bunları sessizce zorluyor. Basın hangi gövdelerin inşa edildiğini öğrenmediği sürece tersanelerimiz antlaşmaların izin verdiğinden daha ağır gemiler inşa edebilir."
 MTG_cheat_on_treaty_desc:0 "Denizcilik Antlaşmaları tarafından gemi tasarımlarımıza getirilen kısıtlamalar çok acımasız. Biraz yaratıcı muhasebe ile, belki de daha kullanışlı bir şey için biraz ağırlık boşaltabiliriz..."
 MTG_cheat_on_treaty_risk_tt:0 "Birisi aksini kanıtlayana kadar raporlarımız §Ytam uyum§! gösterecek. [GetMTGNavalTreatyExposureRoute] Yakalanırsak §R50§! siyasi güç ve §R%5§! istikrar kaybederiz; diğer tüm üyeler bize karşı tavır alır ve dünya gerilimi artar. Haber basına yansıdığında demokratik veya tarafsız bir hükümet ayrıca §R%5§! istikrar ve §R%5§! savaş desteği kaybeder."
 MTG_escalator_clause_invocation_mission:0 "Tırmanma Maddesi Uygulandı"
 MTG_escalator_clause_invocation_mission_desc:0 "Antlaşmaların imzacılarından biri artık antlaşmaya uymamaya karar verdi ve muhtemelen şu anda daha büyük ve daha güçlü gemiler inşa ediyor. Neyse ki, Antlaşmalardaki bir madde, bu durumda gemi boyutu ve silahlanma üzerindeki kısıtlamaları gevşetmemize olanak tanıyan bir Tırmanma Maddesini otomatik olarak uygulamamıza izin veriyor."
 MTG_escalator_clause_tt:0 "Bu, diğer tüm imzacılar için Ana Gemilerin maliyeti üzerindeki kısıtlamaları azaltacaktır."
 MTG_expose_FROM_treaty_violation:0 "[From.GetNameDef] Ülkesinin Antlaşma İhlalini Açığa Çıkar"
 MTG_expose_FROM_treaty_violation_desc:0 "Deniz ataşelerimizin elindeki deplasman rakamları, [From.GetNameDef] tarafından konferansa sunulanlarla uyuşmuyor. Bu aldatmaca kamuoyuna açıklanırsa ödeyecekleri bedel, gemilerin değerini çok aşacaktır."
 MTG_expose_FROM_treaty_violation_threat:0 "Bir deniz antlaşması ihlalini açığa çıkardı"
 MTG_expose_FROM_treaty_violation_tt:0 "İhlali kamuoyuna açıklar. [From.GetNameDef] §R50§! siyasi güç ve §R%5§! istikrar kaybeder; hükümeti demokratik veya tarafsızsa ayrıca §R%5§! istikrar ve §R%5§! savaş desteği kaybeder. Diğer tüm imzacılar onlara karşı tavır alır, dünya gerilimi artar ve kalan üyeler silahlanmayı artırma maddesini yürürlüğe koyabilir."
 MTG_invite_FROM_to_treaty:0 "[From.GetNameDef]'i Denizcilik Antlaşmalarına katılmaya davet et"
 MTG_invite_FROM_to_treaty_tt:0 "[From.GetNameDef] kendi kararını verir. §YKabul ederlerse§!, büyük savaş gemisi maliyetlerinde bizimle aynı sınırlara tabi olurlar ve tüm imzacılar onları §Ykorumayı§! taahhüt eder. §RReddederlerse§!, bir daha davet edilemezler; tüm imzacıların onlara yönelik görüşü §R30§! azalır ve antlaşma güçleri onları §Rçevrelemeye§! girişir."
 MTG_naval_treaties:0 "Denizcilik Antlaşmaları"
 MTG_naval_treaties_desc:0 "Harcamaları sınırlamak ve başka bir karşılıklı olarak yıkıcı deniz silahlanma yarışından kaçınmak için, dünyanın büyük deniz güçleri, filolarının genel boyutunu ve her bir geminin boyutunu sınırlayan bir dizi antlaşma imzaladı. Bu antlaşmaların bir imzacısı olarak, belirli kısıtlamalara tabiyiz, ancak rakiplerimiz de onlara uyduğu sürece, güç dengesi korunmalıdır.\n\nŞu anda Ana Gemi Gücünde [GetRelevantNavalTreatyNation] [GetStrengthRatioBritain]'yız."
 MTG_second_london_conference:0 "İkinci Londra Deniz Silahsızlanma Konferansı devam ediyor"
 MTG_send_treaty_warning_to_FROM:0 "[From.GetNameDef]'e uyarı gönder"
 MTG_send_treaty_warning_to_FROM_desc:0 "Görünüşe göre [From.GetNameDef], donanma birikimlerindeki usulsüzlükleri fark etmeyeceğimizi düşünüyor. Onları yargı hataları hakkında bilgilendirmeliyiz."
 MTG_send_treaty_warning_to_FROM_previous_signatory:0 "[From.GetNameDef]'e Uyarı Gönder"
 MTG_send_treaty_warning_tt:0 "[From.GetNameDef] ülkesinden filosunu yeniden sınırın altına indirmesi istenir. §YKabul ederlerse§! bir son tarih belirlenir: süreyi aşan bir imzacı §R%10§! istikrar ve §R35§! siyasi güç kaybeder; antlaşma dışındaki bir ülke ise tüm imzacılara kendisini kukla yapmak için savaş hedefi verir. §RReddederlerse§!, imzacı bir ülke §R%10§! istikrar ve §R150§! siyasi güç kaybederek derhâl antlaşmalardan çıkarılır; zaten antlaşma dışındaki bir ülke ise inşaata devam eder ve ambargoyla karşılık verebiliriz."
 MTG_treaty_reduction_mission:0 "Deniz Silahsızlanmasını Uygula"
 MTG_treaty_reduction_mission_desc:0 "Donanmamızdaki aktif ana gemilerin sayısında bir azalmaya kamuoyu önünde taahhüt ettik. Anlaşılan sayılara ulaşmak için acilen bazılarından kurtulmamız gerekiyor."
 MTG_treaty_reduction_signatory_mission:0 "Antlaşma Donanma Büyüklüğüne Geri Dön"
 MTG_treaty_reduction_signatory_mission_desc:0 "Denizcilik Antlaşması'nın imzacısı olarak, sadece belirli bir sayıda ana gemiye izin verilir. Şu anda ayrılan sayıyı aşıyoruz ve insanlar uluslararası silah sınırlamaları fikrine iddia ettiğimiz kadar bağlı olup olmadığımızı merak etmeye başlıyor."
