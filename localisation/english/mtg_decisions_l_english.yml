 nation_building:0 "[From.GetNameDef]'de Ulus İnşası"
 nation_building_desc:0 "[From.GetAdjective] halkını totaliterizmden uzaklaştırıp demokrasi ve hukukun üstünlüğüne yönlendirmek için yeni nesil yöneticiler eğitmeliyiz."
 paramilitary_training:0 "[From.GetNameDef]'de Paramiliter Eğitim"
 paramilitary_training_desc:0 "Solcu kışkırtıcılar ve diğer hain pislikler [From.GetAdjective] ulusunu zayıflatıyor. Ordumuzla işbirliği yapmaya istekli dost kuvvetlere yardım edeceğiz."
 police_action:0 "[From.GetNameDef]'de Polis Eylemi"
 police_action_desc:0 "[From.GetAdjective] halkı, yerel polis ve paramiliter güçlerden sorumlu özyönetimi almaya hazır."
 public_support_for_from:0 "[From.GetAdjective] Sürgün Hükûmetinin Halk Tarafından Tanınması"
 purge_infiltrators:0 "[From.GetAdjective] Sızmalarını Temizle"
 purge_infiltrators_desc:0 "Meşru [From.GetAdjective] hükûmetindeki dostlarımız, bize hizmet eden gönüllü kuvvetler içindeki Bolşevik ve aşırı milliyetçi hareketlere verilen artan destekten endişe duyuyor. İşler çığırından çıkmadan sadakatsiz subayları görevden almalı ve isyankar oluşumları silahsızlandırmalıyız. Bu bize kendi ülkeleri içinde kazandıracağı nüfuz, özellikle savaş sonrası için paha biçilmez olacaktır."
 request_control_of_navy:0 "[From.GetAdjective] Donanmasının Kontrolünü Talep Et"
 request_control_of_navy_desc:0 "Verimlilik adına, ittifakımız [From.GetAdjective] donanmasının bizimkine entegrasyonundan büyük ölçüde fayda sağlayacaktır."
 request_faction_member_support_of_from:0 "[From.GetNameDef] için İttifak Desteği Talep Et"
 request_reinstatement:0 "[From.GetAdjective]'den Yeniden Göreve Atanma Talep Et"
 request_reinstatement_desc:0 "Sadık müttefiklerimiz, karşılıklı düşmanlarımız tarafından işgal edilen toprakları geri almamıza yardımcı oldu ve [Root.GetAdjective] anavatanı nispeten güvende. Ev sahibimizden hükûmetimizi yeniden yerleştirme ve savaşın sonuna hazırlık olarak bir [Root.GetRulingPartyLong] kabinesi kurma izni istemeliyiz."
 socialist_education:0 "[From.GetNameDef]'de Sosyalist Eğitim"
 socialist_education_desc:0 "[From.GetAdjective] halkının düşmanları, kardeş müttefiklerimize sızıyor ve teşvik ettiğimiz demokratik harekete karşı nifak tohumları ekiyor. Meşru hükûmete, nüfusu Marx ve Engels'in ölümsüz biliminde yeniden eğitme konusunda yardımcı olmalıyız."
 threat_mexico_attacks_panama_canal:0 "Panama Kanalı'na Meksika Saldırısı"
 ultranationalist_coup:0 "[From.GetNameDef]'de Aşırı Milliyetçi Darbe"
 ultranationalist_coup_desc:0 "Zayıf [From.GetAdjective] hükûmeti desteğimizi hak etmiyor. Halkları için yeni bir çağ başlatmalıyız!"
 unity_parade:0 "[From.GetAdjective]-[Root.GetAdjective] Birlik Geçit Töreni"
 unity_parade_desc:0 "[From.GetAdjective] gönüllü kuvvetlerinin gazi askerleri, nefret edilen düşmana karşı birçok zafer kazandı ve ortak fedakarlıklarımız bir gurur kaynağıdır. Birlikleri Anavatan Cephesi etrafında gezdirip yorulmaz gücümüzü göstereceğiz! Meşru [From.GetAdjective] hükûmetinin eleştirmenleri bunu bir kaynak israfı olarak görebilir, ancak başarılarımız şüphecileri susturacaktır."
 weapons_for_the_resistance:0 "[From.GetAdjective] Direnişi için Silahlar"
 weapons_for_the_resistance_desc:0 "Düşman hatlarının gerisindeki vatansever [From.GetAdjective] unsurları, onlara güvenilir mühimmat ulaştırabilirsek, ortak düşmanlarımıza büyük zarar verecektir."
 won_british_civil_war:0 "Bir yıldan daha kısa bir süre önce bir iç savaş kazanıldı.\n"
