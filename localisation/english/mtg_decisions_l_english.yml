 exile_extraction_campaign_desc:0 "[From.GetAdjective] hükûmeti teslim olduğunda daimi ordu oluşumlarının çoğu yakalanıp enterne edilse de, [From.GetNameDef]'de işgal altındaki bölgelerden ayrılıp savaş çabamıza yardım etme şansına atlayacak terhis edilmiş birlikler hala var. Anavatanları için savaşmak üzere silahlandırılıp eğitilebilecek mahsur kalmış birimleri geri getirmeye yardımcı olmak için planlar formüle edeceğiz."
 exile_recruitment_campaign:0 "[Root.GetAdjective] Sürgün Asker Toplama Kampanyası"
 exile_recruitment_campaign_desc:0 "[From.GetNameDef]'deki dostlarımız sayesinde, faaliyet gösterebileceğimiz, [Root.GetNameDef]'e muzaffer dönüşümüze hazırlık olarak gücümüzü artırabileceğimiz bir üssümüz var. Savaş çabalarına yardımcı olacak yararlı personel toplamaya odaklanmalıyız."
 expatriate_donations:0 "[From.GetNameDef]'den Gurbetçi Bağışları"
 expatriate_donations_desc:0 "[From.GetNameDef]'deki acı çeken halkın yurtdışında yaşayan akrabaları ve mültecileri var. Bu [From.GetAdjective] topluluklarına anavatanlarını daha erken özgürleştirmek için özel bir fedakarlık yapmaları çağrısında bulunarak, savaş çabaları için daha fazla kaynak toplayabiliriz."
 flag_second_mexican_civil_war:0 "İkinci bir Meksika İç Savaşı patlak verdi"
 foreign_influence:0 "Yabancı Nüfuz"
 foreign_influence_desc:0 "Korumamız altına aldığımız ülkeler sadece en iyi ve en adil yönetimi hak ediyor. Yabancı ideolojilerden gelen istikrarsızlaştırıcı etkiler kısıtlanmalıdır."
 fraternal_republic:0 "[From.GetNameDef]'de Kardeş Cumhuriyet"
 fraternal_republic_desc:0 "[From.GetAdjective] halkı, üzerlerinde hüküm süren asalak toprak ağalarını ve kapitalistleri devirmek için kuvvetlerimizden müdahale talep ediyor."
 gateway_to_europe_hol_tt:0 "5 ticaret nüfuz puanı kazanır"
