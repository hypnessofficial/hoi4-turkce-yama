 ENG_discuss_appeasement_desc:0 "Yatıştırma politikamız için bolca eleştiri aldık, bu yüzden bu politikayı Commonwealth'in tartışmasına sunacağız."
 ENG_discuss_imperial_defense:0 "İmparatorluk Savunmasını Tartış"
 ENG_discuss_imperial_defense_desc:0 "Commonwealth'in tüm üyelerinin İmparatorluğun savunmasına önemli bir katkıda bulunmasını öneren bir önerge sunacağız."
 ENG_discuss_imperial_economy:0 "İmparatorluk Ekonomisini Tartış"
 ENG_discuss_imperial_economy_desc:0 "Commonwealth'in tüm üyelerinin yerel ekonomilerine önemli bir yatırım yapmasını, yatırımlarımıza olan bağımlılıklarını azaltmasını ve bir bütün olarak İmparatorluğu güçlendirmesini öneren bir önerge sunacağız."
 ENG_discuss_imperial_federation:0 "İmparatorluk Federasyonunu Tartış"
 ENG_discuss_imperial_federation_desc:0 "Geçen yüzyıldan beri, tüm Dominyonlar için bağımsızlığı içeren 'özyönetim' alternatifine doğru ilerlemek yerine, İmparatorluğun tüm parçalarını tek bir İmparatorluk Federasyonunda birleştirmek lehine sesler yükseldi. Şimdi bunu son kez tartışmak için bir önerge sunacağız."
 ENG_discuss_imperial_trade:0 "İmparatorluk Ticaretini Tartış"
 ENG_discuss_imperial_trade_desc:0 "Commonwealth'in tüm üyelerinin İmparatorluk içindeki tercihli ticareti artırmasını öneren bir önerge sunacağız, böylece bir bütün olarak daha da zenginleşebiliriz."
