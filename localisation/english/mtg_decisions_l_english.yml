 governments_in_exile:0 "Sürgündeki Hükûmetler"
 governments_in_exile_ETH_desc:0 "[ROOT.GetLeader], şimdilik [?ETH.host_nation.GetNameDef]'deki [ROOT.GetLeader.GetHerHis] üssünden bir sürgün hükûmeti kurdu. Durum vahim, ama umutsuz olmaktan uzak. Bir dizi savaşçı kaçmayı başardı ve umarım zamanla daha fazlası bize katılacak. Ayrıca, İmparatorluk ailesi iyi durumda, bu yüzden [ETH.GetName]'i yeniden fethetme şansımızı artırmak için fonları yönlendirebilmeliyiz.\n\n   Mevcut İmparatorluk Hazinesi bakiyesi: §Y[?ETH_treasury]§! £GFX_ETH_imperial_treasury"
 governments_in_exile_desc:0 "[GetGovernmentInExileCategoryDesc]"
 governments_in_exile_exiled_desc:0 "Anavatanlarımız düşman işgali altında olmasına rağmen, hükûmet kaçmayı başardı. Davamız için destek oluşturmalı, tüm gurbetçileri, göçmenleri ve mültecileri burada toplamalı ve anavatanımızı geri almak için ev sahibimizle çalışmalıyız."
 governments_in_exile_host_desc:0 "Anavatanları düşman işgali altında olmasına rağmen, bazı cesur askerler ve vatandaşlar mücadeleyi sürdürmeye isteklidir. Eğer dost sürgündeki hükûmetlere tanımamızı genişletirsek, gurbetçilerin, göçmenlerin ve mültecilerin kaynaklarını kullanarak yanımızda savaşacak yeni birimler oluşturabilirler."
 grant_parliamentary_audience:0 "[From.GetAdjective] Parlamento Konuşması"
 grant_parliamentary_audience_desc:0 "[From.GetNameDef]'i terörize eden işgal güçlerinin suiistimalleri kesinlikle kabul edilemez. [From.GetAdjective] ulusunun temsilcilerini, [Root.GetAdjective] halkına haklı savaş davamızı tanıklık etmeleri için meclisimizin önüne getirelim."
 hol_war_on_pacifism_in_progress:0 "Zaten pasifizmle mücadele ediliyor.\n"
 imperial_conference_ends_tt:0 "İmparatorluk Konferansı sona erer.\n"
 joint_training_exercise:0 "Ortak [From.GetAdjective]-[Root.GetAdjective] Tatbikatı"
 joint_training_exercise_desc:0 "Karada, denizde ve havada, birleşik kuvvetlerimiz [From.GetAdjective] müttefiklerimizi evlerinden süren ve dünya medeniyetinin geleceğini tehdit eden zalim saldırganları ezecektir! Ortak hasımlarımıza karşı daha iyi savaş yöntemleri öğrenmek için bir tatbikat başlatacağız."
 lobby_for_parliamentary_support:0 "Destek için Lobi Yap"
 mexico_attack_on_panama_canal:0 "Panama Kanalı'na Saldırı"
 military_dictatorship:0 "[From.GetNameDef]'de Askeri Diktatörlük"
 military_dictatorship_desc:0 "[From.GetAdjective] hükûmetinde kaldırmamız gereken birçok zayıf halka var. Ateistler, sendikacılar ve hatta liberaller [From.GetLeader] bakanlığı arasında rapor ediliyor."
 military_parade:0 "[From.GetNameDef]'de Askeri Geçit Töreni"
 military_parade_desc:0 "Demokratlar, sosyalistler, milliyetçiler ve Aydınlanma'nın diğer haşere ürünleri [From.GetAdjective] hükûmetine sorun çıkarıyor. Yenilmez birliklerimizi [From.GetNameDef]'in başkentinde yürütecek ve onlara [Root.GetAdjective] askeri gücünün ihtişamını göstereceğiz."
 mtg_usa_anti_bolshevist_aid_tt:0 "Kararın kilidini açar: §YAnti-[GetSovietThreatNameAlt] Savaşı için Silahlar§!\nKarar seçildiğinde:\n§Y[SOV.GetNameDefCap]§! ile savaşta olan ülkelere §Y1000§! adet §YPiyade Teçhizatı§! gönder. Önce eskiler gider."
