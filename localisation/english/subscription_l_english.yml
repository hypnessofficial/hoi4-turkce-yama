 DLC_DESCRIPTION_dlc018:0 "Kanada, Avustralya, Yeni Zelanda, Raj (Hindistan) ve Güney Afrika için yeni Milli Hedef ağaçları ve olaylar. Büyük kuşatmalar ve düşman hatlarını yarma üzerinde daha fazla kontrol sağlayan bir Hücum Kıtası savaş planı komutu."
 DLC_DESCRIPTION_dlc020:0 "Dört Yeni Odak Ağacı: Savaşı Macaristan, Romanya, Çekoslovakya ve Yugoslavya'nın zorlu perspektiflerinden deneyimleyin."
 DLC_DESCRIPTION_dlc022:0 "Almanya ve Japonya için Değiştirilmiş Odak Ağaçları: İki büyük Mihver gücünün artık Hitler'i devirme veya Japonya'da Komünizm ya da Demokrasi kurma şansı da dahil olmak üzere alternatif tarih yolları var."
 DLC_DESCRIPTION_dlc023:0 "Yeni gemi tasarımları, amiraller için özellikler ve beceriler, amfibi araçlar edinin, denizlerinizi korumak için deniz mayınları kullanın ve tehlikelerden kaçınmak için gemi rotalarını kullanın. Hollanda, Birleşik Krallık, Meksika ve ABD için yeni odak ağaçları içerir."
 DLC_DESCRIPTION_dlc028:0 "La Résistance gizli ajanlar, casusluk görevleri ve direniş hareketleri için yeni seçenekler ekler. Düşman sırlarını çözmek veya herhangi bir güç kırıntısından mutlu olacak işbirlikçileri destekleyerek işgalinize zemin hazırlamak için ajanları tehlikeli bölgelere gönderin."
 DLC_DESCRIPTION_dlc031:0 "Karadeniz ve Ege çevresindeki küçük güçlere özel Milli Hedef ağaçları ekler. Bulgaristan, Yunanistan ve Türkiye, büyük güçlerin Boğaziçi ve Çanakkale'nin stratejik deniz yollarını domine etme çabalarına direnirken her biri benzersiz tarihi ve alternatif tarih yolları çizebilir."
 DLC_DESCRIPTION_dlc034:0 "No Step Back, Doğu Avrupa'daki birçok ulus için daha fazla ayrıntı, Sovyet siyasetini yansıtan benzersiz oyun sistemleri ve oyunun askeri yönüne birçok iyileştirme ekler."
 DLC_DESCRIPTION_dlc036:0 "Yeni bir imparatorluk kurun, yabancı saldırganlığa direnin veya tarafsızlığın sınırlarını keşfedin. By Blood Alone, İtalya, Etiyopya ve İsviçre için yeni alternatif tarih seçenekleri ve oynanış çeşitliliğinin yanı sıra diğer önemli değişiklikleri de ekler."
 DLC_DESCRIPTION_dlc038:0 "Avrupa'nın büyük güçleri dünyanın geleceği için savaşırken İskandinav ülkelerinin heyecan verici yeni tarihlerini yazın. Finlandiya, İsveç, Danimarka ve Norveç için yeni Milli Hedef ağaçları merkezde yer alıyor. Verimliliği vurgulamak için silah sanayinizi uzmanlaştırın ve ardından bu silahları yeni Uluslararası Pazar'da satın."
 DLC_DESCRIPTION_dlc040:0 "Trial of Allegiance, Brezilya, Arjantin, Şili, Uruguay ve Paraguay için kapsamlı odak ağaçları ekler. Bütün bir kıtanın istikrarı bıçak sırtında dengeleniyor. En değerli varlığınız olan bağlılığınızla Avrupalı hayırseverleri cezbederek savaşta yeni bir cephe açın."
 DLC_DESCRIPTION_dlc043:0 "Düşmanlarınıza karşı kullanmak üzere prototip teknoloji ve silahlar geliştirin. Düşmanlarınızın araştırma tesislerini, barajlarını ve önemli yapılarını yok etmek için akınlar düzenleyin. Yeni ve güncellenmiş odak ağaçları, hedeflerinize ulaşmak için Almanya'nın İç Çemberini kullanmanıza, Avusturya veya Macaristan olarak Habsburg imparatorluğunu yeniden kurmanıza ve Belçika ile sömürgesi Belçika Kongosu'nun dinamiklerini keşfetmenize olanak tanır."
 DLC_DESCRIPTION_dlc046:0 "Graveyard Of Empires, İran, Raj, Irak ve Afganistan için benzersiz odak ağaçları sunar. Müdahaleci dış güçlerin etkisini azaltın ve Orta Doğu ile Güney Asya'ya hakim olmaya çalışırken ulusunuzun düşmüş gururunu yeniden canlandırın."
 DLC_DESCRIPTION_dlc049:0 "Hearts of Iron IV için bir Genişletme Paketi olan No Compromise, No Surrender'da Japonya, Çin ve Filipinler için tarihte yeni yollar şekillendirin. İttifaklar üzerinde daha derin bir kontrolü ele geçirin, yeni askeri doktrinler oluşturun ve Pasifik'in ve ötesinin kaderine karar verin."
 DLC_DESCRIPTION_dlc051:0 "Bohemya Krallığı'nı yeniden kurun, bir Orta Avrupa devletleri birliği oluşturun, kendinizi tahkimatlarla koruyun veya Peace for Our Time ile Çekoslovakya için hazırlanan yeni milli hedef ağacıyla bir müttefik ağı kurun."
 DLC_DESCRIPTION_dlc052:0 "Komuta merkezinin kalbine adım atın; generallerinizi cephe hatlarına konuşlandırın ve en başarılı gemi kaptanlarınıza madalyalar verin. Avustralya olarak Güneydoğu Asya'daki Japon istilasını geri püskürtün; Siyam olarak yeni bir imparatorluk kurun ve Hollanda yönetimi olsun ya da olmasın, Endonezya'nın geleceğine karar verin."
