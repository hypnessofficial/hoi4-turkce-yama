l_english:
 ENG_VANGUARD_DESC_COMMUNIST:0 "Denizlerde düşmanlarımız tarafından sayıca geçilmemeliyiz. Depoda hala bir sonraki planlanan zırhlılarımız için gereken zaman alıcı 16 inçlik topların yerine kullanılabilecek bir dizi 15 inçlik topumuz var, bu da sınıfın öncü gemisi olan WLNS Vanguard'ın inşasını büyük ölçüde hızlandıracaktır."
 ENG_VANGUARD_DESC_HISTORICAL:0 "Denizlerde düşmanlarımız tarafından sayıca geçilmemeliyiz. Depoda hala bir sonraki planlanan zırhlılarımız için gereken zaman alıcı 16 inçlik topların yerine kullanılabilecek bir dizi 15 inçlik topumuz var, bu da sınıfın öncü gemisi olan HMS Vanguard'ın inşasını büyük ölçüde hızlandıracaktır."
 ENG_a_change_in_course:0 "Rotalarda Bir Değişiklik"
 ENG_a_change_in_course_desc:0 "Dünya gerilimleri artarken, mevcut siyasi liderliğimizin ulusun çıkarlarını koruyamayacağı açıktır. Son birkaç on yılın siyasetinden köklü bir ayrılma zamanı gelmiştir."
 ENG_a_s_warfare:0 "D/S (Denizaltı Savunma) Harbi"
 ENG_a_s_warfare_desc:0 "Atlantik bizim can damarımızdır ve savunmasız deniz taşımacılığımıza av olabilecek düşmanlardan, ister su üstünde ister altında olsun, temiz kaldığından emin olmalıyız. Denizaltı savunma harbi alanındaki en son gelişmelere odaklanacağız, eskortlarımızın sağlayabileceğimiz en iyi silah ve tespit araçlarıyla donatıldığından emin olacağız."
 ENG_alliance_with_germany:0 "Almanya ile İttifak"
 ENG_alliance_with_germany_desc:0 "Çıkarlarımız Almanlarla aynı çizgide - onlar Avrupa kıtasının hegemonyasını arzularken, biz küresel İmparatorluğumuzla ilgilenirken Britanya Adaları'nı tehdit etmeyecek bir Avrupa arzuluyoruz. Belki de Kral'ın istekleri doğrultusunda bir ittifak, o kadar da garip bir işbirliği olmayacaktır."
 ENG_alliance_with_germany_tt:0 "Mevcut §YDemokratik§! desteğin yarısı, bir §Rİstikrar§! cezası olarak uygulanır:\n"
 ENG_anti_non_contact_committee:0 "Temassız Mayın Karşıtı Komite"
 ENG_anti_non_contact_committee_desc:0 "Mayın harbindeki teknik uzmanlarımız, manyetik alanlar, ses ve diğer yollarla etkinleştirilen yeni mayın türlerinin bir sonraki savaşta önemli bir rol oynamasının muhtemel olduğunu belirtiyorlar. Şimdi onları temizlemenin yollarını araştırmak için özel bir Amirallik Temassız Mayın Karşıtı Komitesi atayarak, gemilerimizi güvende tutmaya yardımcı olabilir ve hatta bu süreçte kendi mayın teknolojimizde bazı ilerlemeler kaydedebiliriz."
 ENG_anti_submarine_training_school:0 "Denizaltı Savunma Eğitim Okulu"
 ENG_anti_submarine_training_school_desc:0 "Avantajlarımızdan biri, yeni mürettebatları eğitmek için son savaştan deneyimli geniş bir yetenekli subay havuzundan yararlanma yeteneğidir. DSH uzmanı Komodor Gilbert Stephenson'ın yönetiminde, Tobermory'de yeni bir denizaltı savunma eğitim okulunun kurulması, mürettebatımızın Atlantik konvoy görevine çıkmadan ve U-bot tehdidiyle yüzleşmeden önce ihtiyaç duydukları becerileri edinmelerini sağlayacaktır."
 ENG_appeal_to_imperial_loyalists:0 "İmparatorluk Sadıklarına Başvur"
 ENG_appeal_to_imperial_loyalists_desc:0 "Dominyonların artık nominal bağımsızlığına rağmen, vatandaşları arasında hala Taç'a sadık olanlar var. Onlara ulaşabilirsek, kontrolü yeniden kazanmak için gerekli olacak işgallerden önce Dominyonların hükümetlerini altüst edebiliriz."
 ENG_appeal_to_imperial_loyalists_tt:0 "Eski Dominyonlarda İngiliz yanlısı iç savaşların kışkırtılmasına izin veren §Yİmparatorluk Sadıklarına Başvur§! Kararlarının kilidini açar.\n"
 ENG_bermuda_invasion_launch_point:0 "Bermuda İstilası Başlatma Noktası"
 ENG_bermuda_invasion_launch_point_desc:0 "Kuzey Amerika'nın istilası kolay bir iş olmayacak. Devrimi doğrudan Amerikan kıyılarına yaymak için gönderilmeden önce, istila gücünü gerekli süre boyunca barındırabilmek için Bermuda'daki mülklerimizi inşa etmeliyiz."
 ENG_bring_the_dominions_back_into_the_fold:0 "Dominyonları Sürüye Geri Getir"
 ENG_bring_the_dominions_back_into_the_fold_desc:0 "Tahta kuruldu ve taşlar yerinde. Şimdi planımızı harekete geçirme ve Dominyonların liderlerinin zihinlerinde mevcut olan bağımsızlık kavramını 'düzeltme' zamanı."
 ENG_bring_the_dominions_back_into_the_fold_tt:0 "§YEmperyalist Ayaklanmayla İttifak Kur§! Kararlarının kilidini açar.\n"
 ENG_british_commonwealth_air_training_plan:0 "Britanya Milletler Topluluğu Hava Eğitim Planı"
 ENG_british_commonwealth_air_training_plan_desc:0 "Askeri başarımız, havadaki ustalığımıza ve dolayısıyla hava mürettebatımızın becerisine bağlıdır. Savaşın bu yeni boyutunda ustalaşmak için gereken tüm eğitimli pilotlara ve mürettebata sahip olduğumuzdan emin olmak için dünyanın şimdiye kadar gördüğü en büyük havacılık eğitim programına girişeceğiz."
 ENG_ceylon_forward_operating_base:0 "Seylan İleri Harekat Üssü"
 ENG_ceylon_forward_operating_base_desc:0 "Taç'ın Hindistan üzerindeki kontrolünü geri almak için gereken devasa işgale hazırlık olarak, Seylan adasındaki tesisleri büyük ölçüde genişletmeliyiz."
 ENG_chiefs_of_staff_committee:0 "Genelkurmay Başkanları Komitesi"
 ENG_chiefs_of_staff_committee_desc:0 "Çeşitli hizmet kollarının başkanlarını bu savaşı en iyi gördükleri şekilde yürütmeleri için yetkilendirmeliyiz. Başlangıçta 1923'te kurulan Birleşik Genelkurmay Başkanları, şimdi doğrudan Savaş Kabinesi'ne rapor vererek dünya çapında operasyonları koordine etme imkanına sahip olacak. Bu, askeri operasyonlar için planlamayı büyük ölçüde kolaylaştıracaktır."
 ENG_concessions_to_the_trade_unions:0 "Sendikalara Tavizler"
 ENG_concessions_to_the_trade_unions_desc:0 "Yeniden silahlanma çabalarımız, sendikalarla olan çatışmalar tarafından sürekli olarak lekelenmektedir. Onlarla mücadele etmeye devam etmek yerine onlarla işbirliği yapmayı seçersek, çok daha sorunsuz bir geçiş yaşayabiliriz."
 ENG_concessions_to_the_trade_unions_tt:0 "Komünist olmak için tamamlanması gereken §YSendikalara Tavizler§! Kararlarının kilidini açar.\n"
 ENG_concessions_to_the_trade_unions_tt_2:0 "§RKomünist olduktan sonraki 2 yıl içinde Sömürgesizleştirme başarılmazsa, bir iç savaş başlayacak!§!\n"
 ENG_concessions_to_the_trade_unions_tt_3:0 "§YSendika Desteği§! Kararlarının kilidini açar.\n"
 ENG_consolidate_the_british_isles:0 "Britanya Adalarını Birleştir"
 ENG_consolidate_the_british_isles_desc:0 "İrlandalılar saçma bağımsızlık kavramlarını pazarlamaya devam ediyorlar ve hoşgörümüz sona erdi. Direnişlerini ezme ve tüm ülkeyi Birleşik Krallık'ın ayrılmaz bir parçası olarak geri getirme zamanı geldi."
 ENG_continental_intervention:0 "Kıtasal Müdahale"
 ENG_continental_intervention_desc:0 "Avrupa kıtasında güç dengesini hareket etmeden koruyamayacağımız açıktır. Son zamanlarda ortaya çıkan yayılmacı rejimleri ezmeli, Britanya Adaları'na dikkati dağılmadan bir işgal hazırlayabilecek birleşik bir Avrupa tehdidiyle asla karşı karşıya kalmamamızı sağlamalıyız."
 ENG_continental_intervention_tt:0 "§R10§!'dan fazla §YDünya Gerilimi§!'ne neden olan büyük Avrupa uluslarına karşı savaş nedenleri verir:\n"
 ENG_crush_the_dream:0 "Rüyayı Ez"
 ENG_crush_the_dream_desc:0 "Amerikalılar Rüyalarından bahsetmeyi severler; herkesin Amerika'da 'başarabileceği', yeter ki bunu akranlarının sırtından yapmaya istekli olsunlar. Bunu kınanacak bir şey olarak görüyoruz; hiç kimse kendi kazancı için başkasını avlamaya teşvik edilmemelidir. Halklarını bu saçma düşüncelerden kurtaracağız, bu rüyayı o kadar derinlemesine ezeceğiz ki ondan hiçbir iz kalmayacak."
 ENG_decolonization:0 "Sömürgesizleştirme"
 ENG_decolonization_desc:0 "Bu bir devrin sonu, ama bizim seçtiğimiz bir son. Durdurulamaz bağımsızlık hareketlerinin yükselişine karşı boşuna mücadele etmenin onursuzluğunu çekmek yerine, başımızı dik tuttuk ve gururla, korumamız altındakilere elimizden geldiğince rehberlik ettik. Şimdi, geriye kalan tek şey kalan bağlarımızı kesmek ve eski bağımlılarımızı dünya sahnesinde eşit olarak karşılamaktır."
 ENG_decolonized:0 "Britanya dekolonize oldu"
 ENG_dominions_accepted_federation:0 "Dominyonlar İmparatorluk Federasyonunu Onayladı\n"
 ENG_east_indies_fleet_focus:0 "Doğu Hint Filosunu Kur"
 ENG_east_indies_fleet_focus_desc:0 "1904 yılında Birinci Deniz Lordu Amiral Sir John Fisher; savaş durumunda Uzak Doğu'daki üç ana komutanlığın (Doğu Hint Filosu, Çin İstasyonu ve Avustralya Filosu), Singapur merkezli Doğu Filosu adlı tek bir komuta altında toplanmasını emretti. Bölgede artan gerilimlerle birlikte, bunu gerçekleştirmek için hazırlıklara başlamak akıllıca görünüyor."
 ENG_eliminate_the_upper_class:0 "Üst Sınıfı Tasfiye Et"
 ENG_eliminate_the_upper_class_desc:0 "İşçiler ayaklanmalı ve üst sınıfların baskısını kırmalıdır. Onlarla başa çıkacağız ve şirketlerine devlet adına el koyacağız."
 ENG_eliminate_the_upper_class_tt:0 "Aristokrat Mareşalleri, Generalleri ve Amiralleri kaldırır.\n"
 ENG_enact_the_mosley_manifesto:0 "Mosley Manifestosunu Yürürlüğe Koy"
 ENG_enact_the_mosley_manifesto_desc:0 "Önceki yıllarda Mosley, yoksulluğu gidermek için kapsamlı ekonomik reformlar için bir manifesto hazırladı. Lider'in önerilerini yürürlüğe koyma zamanı geldi."
 ENG_enforce_decolonization:0 "Sömürgesizleştirmeyi Zorla"
 ENG_enforce_decolonization_desc:0 "Biz nasıl sömürgesizleştiysek, dünyanın diğer ulusları da öyle yapmalı. Bir ültimatom yayınlayacağız ve sözlerimizin bilgeliğini göremeyenlere, bunun yerine o bilgelik gösterilecektir."
 ENG_enforce_the_naval_treaties:0 "Deniz Antlaşmalarını Uygula"
 ENG_enforce_the_naval_treaties_desc:0 "Bazı güçlerin Washington Deniz Antlaşması'nın hükümlerini görmezden gelmeyi seçtiği dikkatimizi çekti. Bunun devam etmesine izin verilemez. Avantajı sürdüreceksek ve başkalarının da aynı fikre kapılmaması için, irademize meydan okuyanlardan bir örnek oluşturmak üzere hızla saldırmalıyız."
 ENG_enforce_the_naval_treaties_tt:0 "Bunlar, bize kıyasla çok fazla §YAna Muharebe Gemisi§! olan ülkelerden §YAna Muharebe Gemisi§! sayılarını §GAzaltmalarını§! talep etmek için kullanılabilir ve reddederlerse bize bir §YKukla Savaş Nedeni§! verecektir.\n"
 ENG_every_man_will_do_his_duty:0 "Her Adam Görevini Yapacak"
 ENG_every_man_will_do_his_duty_desc:0 "Nelson'ın ünlü sözlerinin ruhuyla, halka bir görev duygusu aşılamalıyız. Beğenseler de beğenmeseler de, ulus yaklaşan kriz karşısında onların hizmetine ihtiyaç duyuyor."
 ENG_expand_the_repair_yards:0 "Onarım Tersanelerini Genişlet"
 ENG_expand_the_repair_yards_desc:0 "Donanmamız dünyanın en büyükleri arasında olsa da, savaş hasarı almaları durumunda gemilerimizi hızlı bir şekilde onaracak imkanlara da sahip olmalıyız, yoksa düşmanlarımız bizi yıpratma yoluyla yenebilir. Onarım tersanelerimizi genişletmek sadece bunu başarmakla kalmaz, aynı zamanda eski modellerimizden bazılarını zamanında yenilememizi de sağlar."
 ENG_expose_the_belly_of_the_bear:0 "Ayının Karnını Açığa Çıkar"
 ENG_expose_the_belly_of_the_bear_desc:0 "Sovyetleri herhangi bir köprübaşı olmadan ele almak inanılmaz bir zorluktur. [PER.GetName] ve [AFG.GetName] ülkelerinden geçiş talep edeceğiz ve Sovyetlere en az bekledikleri yerden saldıracağız; karadan ve açıkta kalan karınlarına."
 ENG_federal_integration:0 "Federal Entegrasyon"
 ENG_follow_moscow:0 "[SOU.Capital.GetCapitalVictoryPointName]'u Takip Et"
 ENG_follow_moscow_desc:0 "Köklerinde, Britanya'daki komünizm her zaman [SOU.Capital.GetCapitalVictoryPointName]'un emirlerini takip etmiştir. Bunu şimdi yapmaya devam etmek sadece mantıklı değil, aynı zamanda gereklidir. Kızıl Ordu ve Donanmamız arasında, Marx'ın sözünü dört bir yana yayacağız ve kimse bizi durduramaz."
 ENG_for_the_good_of_the_revolution:0 "Devrimin İyiliği İçin"
 ENG_for_the_good_of_the_revolution_desc:0 "Herkes devletin iyiliği için konforundan fedakarlık yapmaya istekli olmalıdır. Britanya halkı, tayın uygulaması karşısında başını dik tutacak, bunun nihai zaferimizi garantileyeceğinden emin olacaktır."
 ENG_fortify_the_empire:0 "İmparatorluğu Güçlendir"
 ENG_foundations_for_an_indian_state:0 "Bir Hint Devleti İçin Temeller"
 ENG_foundations_for_an_indian_state_desc:0 "Bağımsız bir devlet olarak işlev görecekse, Hindistan'ın sanayileşmesini artırmanın yanı sıra hükümetlerini büyük ölçüde yeniden yapılandırmalıyız. Bütün bir alt kıtayı yönetmenin zorlukları, bizim de bulduğumuz gibi, basit değildir ve Hindistan başarılı olacaksa hazırlıklı olmalıdır."
 ENG_gibraltar_for_spanish_support:0 "İspanyol Desteği İçin Cebelitarık"
 ENG_gibraltar_for_spanish_support_desc:0 "Uzun zamandır ulusumuzun ayrılmaz bir parçası olarak kabul edilse de, belki de Cebelitarık'ın İspanyol ellerine iadesini, Franco'nun davamıza desteği karşılığında düzenlemek değerlidir."
 ENG_global_defense:0 "Küresel Savunma"
 ENG_global_defense_desc:0 "İngiliz halkını korumak, onu tehdit edecek olanın ilk başta yayılmasını önlemekle başlar. Çatışmanın közlerini bulmalı ve evlerimizde bizi yakarak uzaklara yayılan bir yangına dönüşmeden önce yerinde söndürmeliyiz."
 ENG_god_save_the_king:0 "Tanrı Kralı Korusun"
 ENG_god_save_the_king_desc:0 "Her şeyden önce Kral'a ve Taç'a olan görevimiz gelir. Halk için bir direniş ve umut sembolü, tebaamız ve düşmanlarımız için İmparatorluğun birliğinin bir sembolü olan Kral, içeride yüceltilmeli ve dışarıda korkulmalıdır. Bunu yapacağız."
 ENG_guide_the_colonies:0 "Sömürgelere Rehberlik Et"
 ENG_guide_the_colonies_desc:0 "Uzun süre kontrolümüz altında kaldıktan sonra tam bağımsızlığa doğru ilk adımları atmak kolay değil. Dominyonlarımızın hükümetlerini yeniden yapılandırmada yardımımıza ihtiyaçları var, böylece tamamen bağımsız olduklarında şu an bizim rehberliğimiz altında olduğu kadar iyi işlev görebilirler."
 ENG_imperial_conference:0 "İmparatorluk Konferansını Düzenle"
 ENG_imperial_conference_defense_dominion:0 "İmparatorluk Konferansı Savunma Anlaşmaları"
 ENG_imperial_conference_desc:0 "Tüm kendi kendini yöneten sömürgelerimizin ve dominyonlarımızın çeşitli hükümet liderlerinin İmparatorluk çıkarlarını tartışmak için en son 1932'de bir araya geldi. Özellikle yakın gelecekte İmparatorluğu güçlendirmek istiyorsak, başka bir konferans düzenlemenin tam zamanıdır."
 ENG_imperial_conference_economy_dominion:0 "İmparatorluk Konferansı Ekonomi Anlaşmaları"
 ENG_imperial_conference_tt:0 "60 gün boyunca §Yİmparatorluk Konferansı§! Kararlarının kilidini açar.\n§RBu kararlardan yararlanmak için Siyasi Güç biriktirdiğinizden emin olun!§!\n"
 ENG_imperial_conscription:0 "İmparatorluk Askerliği"
 ENG_imperial_conscription_desc:0 "İmparatorluğumuzun sağladığı insan gücü zenginliğini uzun zamandır ihmal ettik. İmparatorluk genelinde askerliği büyük ölçüde iyileştirme ve savaşımızı yürütmek için bol miktarda insan gücümüzün olduğundan emin olma zamanı geldi. Herkes Taç'a karşı görevini yapmalı!"
 ENG_imperial_federation:0 "İmparatorluk Federasyonu"
 ENG_imperial_federation_desc:0 "İmparatorluk Federasyonu uzun zamandır kendi kendini yönetmeye bir alternatif olarak lanse edilmiştir. Uzun bir hazırlık döneminden sonra, şimdi nihayet hükümetimizi Dominyonlarımızınkilerle birleştirme ve dünyanın önde gelen süper gücü olarak konumumuzu yeniden kazanma zamanı geldi. Britannia Hüküm Sür!"
 ENG_indian_autonomy:0 "Hint Özerkliği"
 ENG_indian_autonomy_desc:0 "Tam bağımsızlık vaat etmek yerine, diğer Dominyonların zaten sahip olduğu gibi, onlara geniş kapsamlı bir özerklik vererek Hint bağımsızlık hareketlerini zayıflatmamız mümkün olabilir."
 ENG_indian_autonomy_tt:0 "§RÖzerklik veya ülke lideri olarak Lord Halifax olmadan, [RAJ.GetNameDef] İmparatorluk Federasyonu için hiçbir teklifi kabul etmeyecektir.§!"
 ENG_isolate_the_mediterranean_threat:0 "Akdeniz Tehdidini Tecrit Et"
 ENG_isolate_the_mediterranean_threat_desc:0 "[ITA.GetAdjective] donanması Akdeniz'deki deniz taşımacılığımızı tehdit ediyor. Tehdidi kontrol altına almak için onları diplomatik olarak tecrit etme kampanyası başlatmalıyız."
 ENG_kickstart_the_war_industry:0 "Savaş Sanayini Başlat"
 ENG_kickstart_the_war_industry_desc:0 "Zaman çok önemli ve savaş sanayimizin doğal bir büyümesini bekleyemeyiz. Savaşa hazır olacaksak, ek fabrikaların hızlı inşası için büyük bir yatırım yapmalıyız."
 ENG_liberate_the_home_of_marx:0 "Marx'ın Vatanını Özgürleştir"
 ENG_liberate_the_home_of_marx_desc:0 "Karl Marx'ın doğum yeri faşizm tarafından istila edildi, bu sadece onun anısını lekelemekle kalmıyor, aynı zamanda tüm sosyalizme sürekli bir hakaret olarak hizmet ediyor. Bu kötü gücü Alman topraklarından kovma, halklarını onları yöneten sahte peygamberlerden kurtarma zamanı geldi."
 ENG_maintaining_imperial_integrity:0 "İmparatorluk Bütünlüğünü Koruma"
 ENG_maintaining_imperial_integrity_desc:0 "İmparatorluğumuzun savunması, denizlerin hakimiyeti ve Dominyonlarımızın sadakatiyle başlar. Diğer deniz güçleri, deniz üstünlüğümüzü tehdit etmemeleri konusunda uyarılmalı ve aynı zamanda, dünya çapında güçlü olabilmemiz için tebaamız üzerinde giderek artan bir kontrol uygulamalıyız."
 ENG_maintaining_the_balance_of_power:0 "Güç Dengesini Koruma"
 ENG_maintaining_the_balance_of_power_desc:0 "İmparatorluğun gücü, Avrupa'nın zayıflığı ve felcinde yatar. Küresel meselelere odaklanabileceksek, Avrupa'nın bizim işlerimize bakamayacak kadar kendi işleriyle meşgul olmasını sağlamalıyız. İstediğimiz bu hassas güç dengesini tehdit edebilecek herhangi bir yayılmacı rejime karşı hareket etmek dışında, Avrupa meselelerinden uzak duracağız."
 ENG_mi6_ns:0 "MI6"
 ENG_motion_of_no_confidence:0 "Güvensizlik Oyu"
 ENG_motion_of_no_confidence_desc:0 "Mevcut hükümet, yaklaşan dünya krizini yatıştırma girişimlerinde başarısız oldu. Şimdi bunu yapmaya yönelik daha fazla girişim, sadece zayıflık işaretidir. Yaklaşan fırtınayı atlatabilmemiz için daha güçlü bir liderliğe ihtiyacımız var."
 ENG_move_to_secure_the_dominions:0 "Dominyonları Güvence Altına Almak İçin Harekete Geç"
 ENG_move_to_secure_the_dominions_desc:0 "Dominyonlar ideolojik değişimimize şüpheyle bakıyorlar. Eğer onlara izin verirsek Westminster ile olan bağlarını yeniden gözden geçirmeleri pek olası değil... Ve bu yüzden izin vermemeliyiz. Hızlı hareket ederek, diplomatik ilişkiler çok gerilmeden önce bir hükümet değişikliğini zorla etkileyebiliriz."
 ENG_move_to_secure_the_dominions_tt:0 "§YDominyonları Güvence Altına Almak İçin Harekete Geç§! Kararlarını etkinleştirir.\n"
 ENG_no_further_appeasement:0 "Daha Fazla Yatıştırma Yok"
 ENG_no_further_appeasement_desc:0 "Yatıştırma politikası başarısız oldu ve şimdi bu politikayı sürdürmek deliliktir. Düşmanlarımızın geri adım atmayacağı ve giderek daha fazlasını talep etmekte ısrar edeceği açıktır. Onlara daha da fazla avantaj vermeden önce onları şimdi durdurmalıyız."
 ENG_no_further_appeasement_tt:0 "Yeni kural: £trigger_yes£Aynı ideoloji grubundaki bir ülkeye karşı savaş gerekçesi oluşturabilir ve savaş ilan edebilir.\nYeni kural: £trigger_yes£Bir ülkeyi kukla yapabilir.\n"
 ENG_noninterference_treaty_with_germany:0 "Almanya ile Müdahale Etmeme Antlaşması"
 ENG_noninterference_treaty_with_germany_desc:0 "İmparatorluk hırslarımız, Avrupa hakkında endişelenmemeye bağlı. Belki de bu, [GER.GetNameDef]'e Avrupa'da serbestlik tanıyarak, sürekli barışçıl ilişkiler ve İngiliz İmparatorluğu'nu ilgilendiren meselelere müdahale etmeme sözleri karşılığında kolayca başarılabilir."
 ENG_organize_the_blackshirts:0 "Kara Gömleklileri Organize Et"
 ENG_organize_the_blackshirts_desc:0 "İngiliz Faşistler Birliği'nin başarısı kamu imajına bağlıdır. Hareketimizin birlik ruhunu ve kişisel gücünü, ülke çapında askeri esintili yürüyüşler düzenleyerek gösterebiliriz. Daha fazla takipçi çekerken, aynı zamanda muhalefeti de eylemsizliğe iteceğiz. Nihai hedef, liderlik değişikliği çağrısında bulunan Downing Caddesi'ne bir yürüyüş olacaktır."
 ENG_organize_the_blackshirts_map_category_name:0 "Kara Gömlekli yürüyüşlerinizi düzenleyeceğiniz yeri seçin."
 ENG_organize_the_blackshirts_tt:0 "§YKara Gömleklileri Organize Et§! Kararlarının kilidini açar.\n"
 ENG_parachute_regiments:0 "Hava İndirme Kuvvetleri Deposu"
 ENG_parachute_regiments_desc:0 "Düşman topraklarındaki erken hava indirme operasyonlarının başarısının ardından, paraşüt alaylarının gelecek olduğu açıktır. Özel eğitim tesisleri ve ekipmanlarının kurulması, bu yeni teknolojileri genel stratejimize benimsememize yardımcı olacaktır."
 ENG_pre_empt_spanish_alignment:0 "İspanyol Hizalanmasını Önle"
 ENG_pre_empt_spanish_alignment_desc:0 "İspanyolların, sonrakine yönelik herhangi bir saldırgan eylemde bulunursak Almanların yanında yer alma riski vardır. Bunun olmasına izin verilemez - [GER.GetName]'e geçmeden önce bu potansiyel tehditle başa çıkmalıyız."
 ENG_pre_empt_the_ideological_threat:0 "İdeolojik Tehdidi Önle"
 ENG_pre_empt_the_ideological_threat_desc:0 "İmparatorluk, farklı düşünenler tarafından içeriden kuşatılmıştır. Bu beşinci kolların emirlerini Moskova'dan aldığını biliyoruz ve bu nedenle bu kötülüğün kaynağına saldırarak seslerini susturabiliriz."
 ENG_pre_empt_the_strategic_threat:0 "Stratejik Tehdidi Önle"
 ENG_pre_empt_the_strategic_threat_desc:0 "İmparatorluk, kaynak zenginliğimizi arzulayanlar tarafından dışarıdan kuşatılmıştır. Kim olduklarını ve nedenini biliyoruz ve bu yüzden, bizim talihsiz bir zayıflık anımızda üzerimize atlamadan önce savaşı onlara taşımamızı hiçbir şey engelleyemez."
 ENG_prepare_for_the_inevitable:0 "Kaçınılmaz Olana Hazırlan"
 ENG_prepare_for_the_inevitable_desc:0 "Ulusumuzun bir başka dünya çatışmasına karışacağı neredeyse kesin görünüyor. Yeniden silahlanma oranımızı artırmak için endüstriyel harcamalarımızı artırmalıyız."
 ENG_preparing_the_second_front:0 "İkinci Cepheyi Hazırlama"
 ENG_preparing_the_second_front_desc:0 "Savaş başladığında, Sovyet müttefiklerimize yardım etmek için ikinci bir cephe açmalıyız. Bunun hazırlığı şimdiden başlamalıdır."
 ENG_prevent_a_continental_hegemony:0 "Kıtasal Hegemonyayı Önle"
 ENG_prevent_a_continental_hegemony_desc:0 "[GER.GetNameDef]'in tüm Avrupa kıtası üzerinde tasarımları olduğu açıktır. Bunun gerçekleşmesine izin verilemez. Müttefiklerimizle birlikte, Almanları aşılmaz bir zorluk oluşturmadan önce ele almalıyız."
 ENG_reach_out_across_the_channel:0 "Kanalın Karşısına Uzan"
 ENG_reach_out_across_the_channel_desc:0 "Komünizm, Manş Denizi'nin hemen karşısındaki ülkelerde yayıldı. Onlara ulaşacağız ve onlara uzak Moskova'dan çok daha yakın olan yol gösterici ve yardımsever bir el uzatacağız."
 ENG_reach_out_across_the_channel_tt:0 "Komünist iseler §Y[FRA.GetName]§! veya §YAşağı Ülkeler§!'i fraksiyonumuza davet eder.\n"
 ENG_reassess_continental_commitments:0 "Kıtasal Taahhütleri Yeniden Değerlendir"
 ENG_reassess_continental_commitments_desc:0 "Avrupa'ya yönelik son siyasi duruşumuz, Büyük Savaş'taki müttefiklerimize kendimizi adamak, yeniden dirilen bir [GER.GetName]'e ve yaklaşan bir [SOV.GetName]'e karşı çıkmak olsa da, kendimizle eski müttefiklerimiz arasındaki siyasi farklılıklar daha belirgin hale geldi. Belki de sadakatlerimizin nerede yattığını yeniden gözden geçirme zamanı gelmiştir."
 ENG_reclaim_burma:0 "Burma'yı Geri Al"
 ENG_reclaim_burma_desc:0 "[BRM.GetName]'nin kısa bağımsızlık dönemi artık sona ermelidir. Kuvvetlerimiz pozisyonda, ülkeyi haklı efendisine geri getirmeye hazır."
 ENG_reclaim_the_jewel_in_the_crown:0 "Taçtaki Mücevheri Geri Al"
 ENG_reclaim_the_jewel_in_the_crown_desc:0 "Hindistan'ın kısa bağımsızlık dönemi artık sona ermelidir. Kuvvetlerimiz pozisyonda, Taç'ın Mücevherini geri getirmeye hazır."
 ENG_revisit_colonial_policy:0 "Sömürge Politikasını Gözden Geçir"
 ENG_revisit_colonial_policy_desc:0 "Zaman değişiyor. Bağımsızlık hareketlerinin imparatorluk genelinde ve giderek daha güçlü şekillerde ortaya çıkmaya devam edeceği açıktır. Bu hareketleri bastırmak için giderek daha büyük kaynaklar dökmek zorunda kalmak istemiyorsak, İmparatorluğumuzun rotasını tamamladığını ve şimdi dünyaya kendi yolunu bulmasına izin verilmesi gerektiğini kabul etmeliyiz."
 ENG_royal_malay_regiment_focus:0 "Kraliyet Malay Alayını Genişlet"
 ENG_royal_malay_regiment_focus_desc:0 "1920'de Malay topraklarımızdaki yerel yöneticiler, sömürge ofisimizi sömürge nüfusundan bir piyade alayı kurmaya teşvik etti. Bu o zamandan beri onaylanıp ilk bölük kurulmuş olsa da, bir savaş gücü sayılmak için hala çok küçük. Alayı genişletmeli ve savaş zamanlarında Singapur ve Malaya'yı yeterince koruyabildiğimizden emin olmalıyız."
 ENG_sarawakrangers_focus:0 "Sarawak Korucularını Güçlendir"
 ENG_sarawakrangers_focus_desc:0 "Charles Vyner Brooke'un başında bulunduğu Sarawak Rajlığı'nı korumakla görevli Sarawak Korucuları, engebeli orman arazisinde savaşma konusunda yeteneklidir. Kuzey Borneo üzerindeki kontrolümüzü sürdürebilmek için onların bilgilerinden faydalanmalı ve güçlerini takviye etmeliyiz."
 ENG_secure_the_imperial_shipping_routes:0 "İmparatorluk Deniz Yollarını Güvence Altına Al"
 ENG_secure_the_imperial_shipping_routes_desc:0 "Sömürge imparatorluğumuzun bütünlüğü, onu bir arada tutan ticari gemiciliği koruma ve gücümüzü gerekli olabilecek her yere yansıtma yeteneğimize bağlıdır. Bunu yapmak için her zaman geniş bir hafif kruvazör filosuna güvendik ve her yerde aynı anda olmamızı sağlayacak gerekli sayıda bu gemiye sahip olmaya devam ettiğimizden emin olmalıyız."
 ENG_secure_the_italian_alliance:0 "İtalyan İttifakını Güvence Altına Al"
 ENG_secure_the_italian_alliance_desc:0 "Mussolini'nin faşizme çok daha kabul edilebilir bir yaklaşımı var ve uzun zamandır Mosley tarafından takdir ediliyor. İki ülkemizin, her iki halkımız için de karşılıklı olarak faydalı olan daha yakın bir ilişkiye girmesi doğaldır."
 ENG_secure_the_oil_imports:0 "Petrol İthalatını Güvence Altına Al"
 ENG_secure_the_oil_imports_desc:0 "Petrol ithalatımız için yabancı hükümetlerle yapılan ticaret anlaşmalarının kararsız doğasına güvenemeyiz. Daha da iyisi, diğer uluslardaki siyasi liderlikten bağımsız olarak tam kontrolünü elimizde tutabilmemiz için petrol sahalarının kontrolünü ele geçirmektir."
 ENG_self_government_for_africa:0 "Afrika İçin Özyönetim"
 ENG_self_government_for_africa_desc:0 "Afrika'daki uluslar, tam bağımsızlığa hazırlık olarak geniş özerklik almaya hazırlar. Bu muhtemelen, bağımsızlık resmileşmeden önce İngiliz vatandaşlığı almak isteyen bir göçmen akınıyla sonuçlanacaktır."
 ENG_self_government_for_asia:0 "Asya İçin Özyönetim"
 ENG_self_government_for_asia_desc:0 "Asya'daki uluslar, tam bağımsızlığa hazırlık olarak geniş özerklik almaya hazırlar. Bu muhtemelen, bağımsızlık resmileşmeden önce İngiliz vatandaşlığı almak isteyen bir göçmen akınıyla sonuçlanacaktır."
 ENG_self_government_for_the_americas:0 "Amerikalar İçin Özyönetim"
 ENG_self_government_for_the_americas_desc:0 "Amerikalar'daki uluslar, tam bağımsızlığa hazırlık olarak geniş özerklik almaya hazırlar. Bu muhtemelen, bağımsızlık resmileşmeden önce İngiliz vatandaşlığı almak isteyen bir göçmen akınıyla sonuçlanacaktır."
 ENG_self_government_for_the_mediterranean:0 "Akdeniz İçin Özyönetim"
 ENG_self_government_for_the_mediterranean_desc:0 "Akdeniz'deki uluslar, tam bağımsızlığa hazırlık olarak geniş özerklik almaya hazırlar. Bu muhtemelen, bağımsızlık resmileşmeden önce İngiliz vatandaşlığı almak isteyen bir göçmen akınıyla sonuçlanacaktır."
 ENG_self_government_for_the_middle_east:0 "Orta Doğu İçin Özyönetim"
 ENG_self_government_for_the_middle_east_desc:0 "Orta Doğu'daki uluslar, tam bağımsızlığa hazırlık olarak geniş özerklik almaya hazırlar. Bu muhtemelen, bağımsızlık resmileşmeden önce İngiliz vatandaşlığı almak isteyen bir göçmen akınıyla sonuçlanacaktır."
 ENG_socialist_science_pool:0 "Sosyalist Bilim Havuzu"
 ENG_socialist_science_pool_desc:0 "Tüm müttefiklerimizin ilerlemelerimizden faydalanabilmesi ve bizim de onlarınkinden faydalanabilmemiz için bir teknolojik bilgi alışverişini koordine etmeliyiz. İşçi mücadelesinin başarılı olmasının tek yolu budur."
 ENG_south_east_asia_air_command_focus:0 "Güneydoğu Asya Hava Komutanlığını Kur"
 ENG_south_east_asia_air_command_focus_desc:0 "RAF Singapur, devasa Uzak Doğu sömürgelerimiz genelinde gökyüzünü korumak için yetersiz teçhizata sahiptir. Grup Komutanı Henry Cave-Browne-Cave, bölgedeki tesisleri genişletmemizi ve Singapur'daki RAF Changi merkezli yeni bir hava branşı kurmamızı talep etti."
 ENG_soviet_cooperation:0 "Sovyet İşbirliği"
 ENG_soviet_cooperation_desc:0 "Farklılıklarımız olsa da, bir düşmanı da paylaşıyoruz. Her iki taraftan bir saldırı önereceğiz, Almanları ne olduğunu anlamadan ezeceğiz."
 ENG_special_air_service:0 "Özel Hava Servisi"
 ENG_special_air_service_desc:0 "David Stirling adında bir subay, küçük bir komando biriminin düşmanı hatlarının gerisinde taciz ederek muazzam hasara yol açabileceği fikrini ortaya attı. Onlara 'Hava Servisi' adını vermek, düşmanın paraşütçülere karşı savunma yapması gerektiğine inanmasına neden olma gibi ek bir fayda sağlıyor. Bu fikirde pekala bir değer olabilir."
 ENG_spirit_of_the_industrial_revolution:0 "Sanayi Devrimi'nin Ruhu"
 ENG_spirit_of_the_industrial_revolution_desc:0 "Britanya Adaları Sanayi Devrimi'nin doğduğu yerdi. Bu ruhla, özgürleşmiş işçilerin devlet kontrolündeki bir ekonomide neler başarabileceğini dünyaya göstereceğiz."
 ENG_steady_as_she_goes:0 "Aynı Seyirde Devam"
 ENG_steady_as_she_goes_desc:0 "Artan kriz, tam da köklerimize sadık kalmamızın nedenidir. En az göze alabileceğimiz bir zamanda iç istikrarsızlığa neden olabilecek herhangi bir köklü siyasi değişiklik yapmak yerine, son yıllarda seyrettiğimiz rotaya devam edeceğiz."
 ENG_tackle_capitalism:0 "Kapitalizmle Mücadele Et"
 ENG_tackle_capitalism_desc:0 "Kapitalizm, İşçi Davası'nın baş düşmanıdır ve bir okyanus ötede bile olsa gelişirken boş duramayız. Onu anavatanında ele geçirmeye hazırlanmalıyız."
 ENG_tackle_fascism:0 "Faşizmle Mücadele Et"
 ENG_tackle_fascism_desc:0 "Faşizm, İşçi Davası'na yönelik başlıca tehdittir. Bu belayı Avrupa'nın yüzünden silmeye odaklanmalıyız."
 ENG_take_out_the_regia_marina:0 "Regia Marina'yı Saf Dışı Bırak"
 ENG_take_out_the_regia_marina_desc:0 "Akdeniz'deki tehditle ilgilenme zamanı geldi. Süveyş'ten geçen deniz yollarını, İmparatorluğumuzun can damarını, onu ikiye bölen donanmayı ortadan kaldırarak güvence altına alacağız."
 ENG_territorial_army_of_malaysia_focus:0 "Malezya Bölgesel Ordusunu Birleştir"
 ENG_territorial_army_of_malaysia_focus_desc:0 "Malay himayelerimizin güçleri fazlasıyla dağınık ve verimsizdir. Çeşitli Gönüllü Tüfek Kolordularını, yerel askeri güçleri ve federasyon alayını tek bir birleşik ordu yapısında birleştirerek bunu düzeltmeliyiz."
 ENG_the_british_communist_alternative:0 "İngiliz Komünist Alternatifi"
 ENG_the_british_communist_alternative_desc:0 "Moskova'nın yanında yer almak yerine, kendi komünist devletler işbirliğimizi başlatacağız. İngilizler dünya sahnesinde kimseden geri kalmaz ve Moskova'ya ne şimdi ne de hiçbir zaman boyun eğmeyeceğiz."
 ENG_the_british_path_to_fascism:0 "Faşizme İngiliz Yolu"
 ENG_the_british_path_to_fascism_desc:0 "Faşizme giden yolumuz kendi yolumuz olacak ve kendilerini ideolojik üstünlerimiz olarak gören kıtadaki olanlara diz çökmeyeceğiz. Halk son savaşı hatırlıyor ve [GER.GetName]'de var olan rejimle herhangi bir işbirliği kesinlikle onların gazabına uğrayacaktır."
 ENG_the_fate_of_the_royal_family:0 "Kraliyet Ailesinin Kaderi"
 ENG_the_fate_of_the_royal_family_desc:0 "Bir insanın, sadece doğumu nedeniyle diğerinden daha değerli olduğu fikri bizi hasta ediyor. Kraliyet Ailesi'nin sergilemeye devam ettiği muazzam servet gözümüze batan bir dikendir ve şüphesiz yeniden silahlanma ve endüstriyel genişleme için harcanması çok daha faydalı olacaktır. Belki de bir taşla iki kuş vurma zamanı gelmiştir..."
 ENG_the_kings_party:0 "Kralın Partisi"
 ENG_the_kings_party_desc:0 "Kriz sona erdiğine ve hükümet düştüğüne göre, Kral'ın en ateşli destekçileri, Kral'ın isteklerine çok daha... uygun... kendi hükümetlerini kurabilirler. Bu Kralın Partisi, David Lloyd George, Winston Churchill ve Oswald Mosley'den oluşacak, böylece siyasi partiler arasında bir köprü kurarak ulusumuzun birliğini onarmaya yardımcı olacaktır."
 ENG_the_one_true_revolution:0 "Tek Gerçek Devrim"
 ENG_the_one_true_revolution_desc:0 "[SOU.Capital.GetCapitalVictoryPointName] ile hiçbir işbirliği asla mümkün olmayacaktır. [SOU.GetNameDef]'de yolsuzluk yaygındır ve tek umut, kalbini söküp atmak ve İşçi Davası'nın tartışmasız küresel liderliğini üstlenmektir."
 ENG_the_sun_never_sets:0 "Güneş Asla Batmaz"
 ENG_the_sun_never_sets_desc:0 "Britanya İmparatorluğu'nun o kadar geniş olduğu söylenir ki, üzerinde güneş asla batmaz. Gücü, onu birbirine bağlayan ve refahımız için hayati önem taşıyan ticaret ve ikmal yollarını güvence altına alan Kraliyet Donanması'dır. Bu donanma, her nerede olursa olsun herhangi bir tehdide hızla karşılık verebilmemiz için bu devasa mesafeleri büyük bir aceleyle kat etmeyi öğrenmelidir."
 ENG_the_sun_never_sets_tt:0 "Bu bonuslar, yeni araştırılan tüm gemi türlerine uygulanacaktır.\n"
 ENG_the_three_nation_solution:0 "Üç Uluslu Çözüm"
 ENG_the_three_nation_solution_desc:0 "Hint alt kıtasındaki kültürel ve dini farklılıklar aşırıdır. Zaten, farklı sadakatlere sahip çeşitli gruplar arasında düşmanlıklar var. Onları tek bir devlette toplamak yerine, belki de daha iyi çözüm, alt kıtayı bir üçlü devlete bölmek olacaktır: Hindu Hindistan, kuzeybatıda Müslüman Pakistan ve kuzeydoğuda Müslüman Bangladeş."
 ENG_the_winds_of_change:0 "Değişim Rüzgarı"
 ENG_the_winds_of_change_desc:0 "Artık sömürgesizleşme zirveye yaklaşırken, değişim rüzgarları dünya çapında her zamankinden daha güçlü esiyor. Adalarımızın geleceğini güvence altına almak istiyorsak, eski sömürge varlıklarımızı tahliye edip geri çekmek ve onları anavatana geri getirmek için çaba göstermeliyiz."
 ENG_towards_dominion_independence:0 "Dominyon Bağımsızlığına Doğru"
 ENG_towards_dominion_independence_desc:0 "Dominyon hükümetlerinin yeniden yapılandırılmasını sağladıktan sonra, şimdi dominyonlarımızın Westminster ile resmi bağlarını kesme yolunda son adımları atmalarına yardım etmeliyiz. [Root.GetNameDef]'in bir parçası olmaya devam etmeyi tercih edenlerin göç etmesiyle kitlesel bir göç dönemi görmemiz muhtemeldir."
 ENG_towards_indian_independence:0 "Hint Bağımsızlığına Doğru"
 ENG_towards_indian_independence_desc:0 "Hindistan'ı bağımsızlık yoluna sokma zamanı geldi. Yavaş yavaş hükümet görevlerini devretmeye başlayacağız ve tam bağımsızlığa hazırlık olarak özerkliklerini artıracağız."
 ENG_unite_the_anglosphere:0 "Anglosferi Birleştir"
 ENG_unite_the_anglosphere_desc:0 "Altın Çağımızın mirası, kültürümüzün ve dilimizin dünya çapında mevcut olmasıdır. Bu bölgelerin bağımsız kalmasının onursuzluğunu ve nankörlüğünü çekmek yerine, onları bir kez daha yönetimimiz altında birleştirmeliyiz."
 ENG_vanguard:0 "Vanguard"
 ENG_vanguard_desc:0 "[Root.GetVanguardDesc]"
 ENG_vanguard_tt_communism:0 "WLNS Vanguard'ı oluştur.\n"
 ENG_vanguard_tt_hms:0 "HMS Vanguard'ı oluştur.\n"
 ENG_withdraw_from_contested_territories:0 "Tartışmalı Topraklardan Çekil"
 ENG_withdraw_from_contested_territories_desc:0 "İngiliz Denizaşırı Topraklarının bir parçası olarak kabul edilen dünya çapında bir dizi bölge, komşu devletler tarafından talep edilmektedir. Bu diplomatik gerilimlere neden olur ve bu nedenle statülerini Birleşik Krallık yargı yetkisi altında olarak yeniden değerlendirmek daha iyi olabilir."
 HOL_WILHELMINISM_FASCISM:0 "Kendi kraliyet evimiz ile Büyük Savaş'ın sonundan beri Huis Doorn'da ikamet eden Alman Kayzeri'ninki arasındaki hanedan bağları hala güçlüdür. Belki de Alman ordusunda hala birçok kişi arasında sahip olduğu popülerliği kendi kazancımız için kullanabilir ve bunu yaparken savaş bittiğinde bize minnettar olmak için bir nedeni olacak güçlü bir devlet yaratabiliriz."
 HOL_WILHELMINISM_NEUTRALITY:0 "Kendi kraliyet evimiz ile yakın zamana kadar Hollanda'daki Huis Doorn'da sürgünde ikamet eden Alman Kayzeri'ninki arasındaki hanedan bağları hala güçlüdür. Aile olan bizler birlikte durmalıyız ve Almanların Kayzerlerini bunca zaman misafir ettiğimiz için bize teşekkür etmek için kesinlikle bir nedeni var."
 HOL_a_new_dutch_unity:0 "Yeni bir Hollanda Birliği"
 HOL_a_new_dutch_unity_desc:0 "Kraliçe'nin yetkisi iyi ilerlerken, halk arasında yeni bir ulusal gurur ve birlik duygusu geliştirebiliriz. Ancak birlikte güçlü olacağız ve küçük ulusumuz nedeniyle dünyanın büyük güçleri arasında asla başımızı eğmemiz gerekmez. Bir halk olarak, küçük boyutumuzun göstereceğinden çok daha sert vururuz."
 HOL_a_western_capital:0 "Bir Batı Başkenti"
 HOL_a_western_capital_desc:0 "Anavatanımızı kurtarmak için ihtiyaç duyacağımız savaş sanayisini donatmak için Cava'daki sivil sanayi büyük ölçüde genişletilmelidir."
 HOL_abandon_the_gold_standard:0 "Altın Standardını Terk Et"
 HOL_abandon_the_gold_standard_desc:0 "Altın Standardını bırakmayı reddetmek, son yıllarda bize muazzam kaynaklara mal oldu. Şimdi Fransa Altın Blok'tan ayrıldığına göre, geriye sadece İsviçre ve biz kaldık. Gulden'in devalüasyonuna izin verme ve serbest kalan kaynakları savunmamızın acınacak durumunu iyileştirmek için kullanma zamanı geldi."
 HOL_affirm_loyalty_to_moscow:0 "[SOU.Capital.GetCapitalVictoryPointName]'a Sadakati Onayla"
 HOL_affirm_loyalty_to_moscow_desc:0 "Partimiz uzun zamandır talimatlarını [SOU.Capital.GetCapitalVictoryPointName]'dan almıştır ve komünizmi dünya çapında yayma mücadelelerinde onlara katılmamız doğaldır."
 HOL_air_cover_for_the_new_fleet:0 "Yeni Filo İçin Hava Koruması"
 HOL_air_cover_for_the_new_fleet_desc:0 "Büyük muharebe kruvazörlerine yatırım yaparsak, gemilerin boşa harcanmaması için onlara yeterli hava koruması da sağlamalıyız. Bir uçak gemisi tasarımına bakacağız."
 HOL_allied_technological_developments:0 "Müttefik Teknolojik Gelişmeleri"
 HOL_allied_technological_developments_desc:0 "Zafer teknolojik üstünlükle gelir. Müttefik Ar-Ge programlarına pompalanan devasa kaynaklara payımızı katmalıyız, böylece biz de onlardan yararlanabiliriz."
 HOL_american_west_indies_protectorate:0 "Amerikan Batı Hint Adaları Himayesi"
 HOL_american_west_indies_protectorate_desc:0 "Dış Batı bölgelerimizin Amerikan korumasını sormalıyız. Kesinlikle başka bir gücün Monroe Doktrini ile oynamasını istemezler."
 HOL_american_west_indies_protectorate_tt:0 "§RBonusların yürürlüğe girmesi için [USA.GetNameDefCap] anlaşmayı onaylamalıdır.§!\n"
 HOL_anti_tank_guns_for_the_continent:0 "Kıta İçin Tanksavar Silahları"
 HOL_anti_tank_guns_for_the_continent_desc:0 "Büyük Savaş'tan bu yana kıtasal komşularımızın tank tasarımlarını geliştirdiğini gördük. İstila gelirse, bu makineler kesinlikle onun ayrılmaz bir parçası olacaktır. Buna göre hazırlanmalıyız."
 HOL_antilles_defenses:0 "Antiller Savunması"
 HOL_antilles_defenses_desc:0 "Aruba ve Curaçao'daki petrol rafinerilerimizin büyük önemi göz önüne alındığında, buradaki savunmamızın zayıf durumu hakkında çıkarı olan yabancı tarafların çok gergin görünmesi garip değil. Bu tarafların adaları bizim için savunma ihtiyacı hissetmesini önlemek istiyorsak, belki de savunmaları kendimiz iyileştirmeye bakmalıyız..."
 HOL_appoint_new_supreme_commander:0 "Yeni Başkomutan Ata"
 HOL_appoint_new_supreme_commander_desc:0 "Başkomutanımız, tamamen imkansız savunma planlarına bağlılığı konusunda oldukça inatçı olduğunu kanıtlıyor. Değiştirilmeli. Henri Winkelman emeklilikten geri çağrılabilir ve muhtemelen daha... uysal bir alternatif olduğunu kanıtlayacaktır."
 HOL_appoint_new_supreme_commander_tt:0 "§YHenri Winkelman§! bir Mareşal olur.\n"
 HOL_assume_the_naval_burden:0 "Deniz Yükünü Üstlen"
 HOL_assume_the_naval_burden_desc:0 "Müttefikimiz kara savaşında uzman olsa da, belki de denizcilik tarihimiz bizi savaşın deniz kısmını üstlenmeye daha uygun kılar."
 HOL_aviatic_aspirations:0 "Havacı Özlemleri"
 HOL_aviatic_aspirations_desc:0 "Hava yeni bir savaş alanıdır, ancak ustalaşamayacağımız bir alan değil. Sivil havacılık endüstrisi söz konusu olduğunda yeteneğimizi zaten gösterdik, bunu askeri alana aktarmak kesinlikle o kadar zor olmayacaktır."
 HOL_bastion_of_true_communism:0 "Gerçek Komünizmin Kalesi"
 HOL_bastion_of_true_communism_desc:0 "Batı Avrupa'da komünizm yorumumuzda yalnız duruyoruz. Dönecek kimsemiz yok ve bu yüzden komünist davanın nihai zaferini görmek için kendimize güvenmeliyiz."
 HOL_beginnings_of_a_dutch_blitzkrieg:0 "Bir Hollanda Blitzkrieg'inin Başlangıcı"
 HOL_beginnings_of_a_dutch_blitzkrieg_desc:0 "Alman yardımıyla belki de kendi tank kuvvetlerimizle Blitzkrieg'e katılabiliriz."
 HOL_beginnings_of_a_dutch_blitzkrieg_tt_1:0 "§Y[GER.GetNameDef]§! tarafından şu anda geliştirilen en iyi §YOrta Tank§! modeli için bir §YÜretim Lisansı§! kazanır.\n"
 HOL_beginnings_of_a_dutch_blitzkrieg_tt_2:0 "§Y[GER.GetNameDef]§! tarafından şu anda geliştirilen tüm §YOrta Tank§! modelleri için araştırma bonusları kazanır.\n"
 HOL_borneo_and_the_grote_oost:0 "Borneo ve Grote Oost"
 HOL_borneo_and_the_grote_oost_desc:0 "Büyük Borneo adası ve Sulawesi ve Moluklar gibi topluca 'De Grote Oost' ('Büyük Doğu') olarak bilinen diğer adalar, büyüyen nüfusumuz için daha erişilebilir hale getirilmeli, bu bölgelere daha fazla sanayinin yerleşmesine izin verilmelidir."
 HOL_bring_socialism_south:0 "Sosyalizmi Güneye Getir"
 HOL_bring_socialism_south_desc:0 "Güneydeki ideolojik yoldaşlarımızı, gerekirse zorla desteklemeliyiz. Moskova'dan çok uzakta olduğumuz ve her taraftan düşman ideolojilerle kuşatılmış olduğumuz için, Avrupa'nın batı kıyılarında kendimiz güçlü bir Komünizm Siperi oluşturmalıyız."
 HOL_cave_to_the_british:0 "İngilizlere Boyun Eğ"
 HOL_cave_to_the_british2_tt:0 "@ENG§Y[ENG.GetName]§!, en az §Y25§! Ticaret Etkisi puanına sahip."
 HOL_cave_to_the_british_desc:0 "İngilizler bizimle şiddetli ticaret müzakerelerine giriyorlar ve Almanların İngiliz ablukasından kaçmak için bizi bir arka kapı olarak kullanacağından korktukları için ülkemiz üzerinden Almanya'ya olan ticaret akışını azaltmamızı talep ediyorlar. Reddederseniz, İngilizler de bizi ablukaya alırdı... Bu, zar zor toparlanan ekonomimiz için felaket olurdu ve bu yüzden onların istedikleri gibi yapmaktan başka seçeneğimiz yok."
 HOL_cave_to_the_british_tt:0 "@ENG§Y[ENG.GetName]§!, @GER§Y[GER.GetName]§!'den en az §Y15§! daha fazla Ticaret Etkisi puanına sahip.\n"
 HOL_cave_to_the_germans:0 "Almanlara Boyun Eğ"
 HOL_cave_to_the_germans2_tt:0 "@GER§Y[GER.GetName]§!, en az §Y25§! Ticaret Etkisi puanına sahip."
 HOL_cave_to_the_germans_desc:0 "Almanlarla bir kara sınırı paylaştığımız için, ülkemiz üzerinden artan ticaret akışı taleplerini reddedersek makul bir şekilde istila bekleyebiliriz. Bırakın bizi bir İngiliz ablukasından kaçmak için bir arka kapı olarak kullansınlar, eğer bu bizim güvenliğimiz anlamına geliyorsa!"
 HOL_cave_to_the_germans_tt:0 "@GER§Y[GER.GetName]§!, @ENG§Y[ENG.GetName]§!'den en az §Y15§! daha fazla Ticaret Etkisi puanına sahip."
 HOL_colonial_shipbuilding:0 "Sömürge Gemi İnşası"
 HOL_colonial_shipbuilding_desc:0 "Hollanda'nın düşüşüyle kıtasal tersanelerimiz kayboldu. Deniz kuvvetlerimizi inşa edeceksek, Doğu'da yeni tersaneler oluşturmak için kaynak ayırmalıyız."
 HOL_combined_chiefs_of_staff_representation:0 "Birleşik Genelkurmay Başkanları Temsilciliği"
 HOL_combined_chiefs_of_staff_representation_desc:0 "Katkılarımız not edildi ve bir miktar siyasi baskıyla, Birleşik Genelkurmay Başkanları olan Anglo-Amerikan stratejik planlamacılarının seçkin kulübünde katılım olmasa da temsil kazanmak mümkün olabilir."
 HOL_continental_shipbuilding:0 "Kıtasal Gemi İnşası"
 HOL_continental_shipbuilding_desc:0 "Hollanda, Zeeland ve Friesland'daki tersanelerimiz, büyük ölçekli herhangi bir deniz inşaat planını mümkün kılmak için büyük ölçüde genişletilmelidir."
 HOL_continue_the_public_works:0 "Kamu İşlerine Devam Et"
 HOL_continue_the_public_works_desc:0 "1920'lerin sonlarında başlayan büyük kamu işlerine devam etmeliyiz. Toprak ıslahı ve yeni kanallar, yollar ve tünellerin inşası sadece iş yaratmakla kalmaz, aynı zamanda ulusu geliştirmeye de hizmet eder."
 HOL_continue_the_war_in_batavia:0 "Savaşa Batavia'da Devam Et"
 HOL_continue_the_war_in_batavia_desc:0 "Korktuğumuz istila gerçekleşti ve savunmalarımız bir kenara süpürüldü. Hükümet kaçmayı başardı ve şimdi müttefiklerimiz tarafından barındırılan sürgünde. Kraliçemiz hükümetin sürgünde ve Avrupa'daki 'eyleme yakın' kalmasını tercih etse de, Doğu Hint Adaları'na taşınma ve oradan savaşı egemen bir güç olarak sürdürme zamanının geldiğini düşünüyoruz."
 HOL_continue_the_war_in_batavia_tt:0 "Şunları verir:\n"
 HOL_cornerstone_of_colonial_defense:0 "Sömürge Savunmasının Temel Taşı"
 HOL_cornerstone_of_colonial_defense_desc:0 "Filo, sömürge imparatorluğumuzun savunması için en önemli direktir. Elimizdekilerden en iyi şekilde nasıl yararlanacağımıza bakmalıyız."
 HOL_curtail_colonial_autonomy:0 "Sömürge Özerkliğini Kısıtla"
 HOL_curtail_colonial_autonomy_desc:0 "En iyi hazırlıklarımıza rağmen kıta Hollanda'sının istila edilmesi pekala mümkündür. Bu durumda, alternatiflere bakmalıyız ve bir olasılık, hükümeti Cava'daki Batavia şehrinde bulunan Hollanda Doğu Hint Adaları'nın başkentine taşımak olabilir. Sömürge yönetimimize, yakında işlerinin doğrudan kontrolünü ele alabileceğimizi açıkça belirtmeliyiz."
 HOL_daf:0 "DAF"
 HOL_daf_desc:0 "Yerli otomobil sanayimiz yok değil ve askeri araçlar üretmek için pekala sözleşme yapılabilir. Bir miktar devlet yardımıyla, Van Doorne's Aanhangwagen Fabriek (DAF), ordumuza ihtiyaç duyabileceği tüm motorlu ve mekanize ekipmanı sağlayabilecek duruma gelebilir."
 HOL_daf_tt:0 "Bir Malzeme Tasarımcısı olarak §YDAF§!'ın kilidini açar.\n"
 HOL_de_jeugdstorm:0 "De Jeugdstorm"
 HOL_de_jeugdstorm_desc:0 "Bir nüfusu ateşli bir pasifizmden uzaklaştırmak ve birkaç yıl içinde onlara bir militarizm kültürü aşılamak kolay bir iş değildir. Ancak bol propaganda, retorik ve etkilenebilir gençliğimizle başlayarak, bunu elimizden geldiğince tam olarak başaracağız."
 HOL_de_vaarplicht:0 "De Vaarplicht"
 HOL_de_vaarplicht_desc:0 "150 yıllık tarafsızlıktan ve on yıllardır artan pasifizmden sonra, yeni müttefiklerimize savaşma kararlılığımızı kanıtlamalıyız. Diğer uluslar gibi gönüllü tabanlı bir ticaret donanmasına güvenmek yerine, Vaarplicht'i veya 'Yelken Açma Zorunluluğu'nu yasalaştıracağız. Henüz askere alınmamış tüm Hollanda vatandaşları bundan böyle ticaret donanması için veya yararına hizmet vermekle yükümlü olacaklardır."
 HOL_de_vernieuwing:0 "De Vernieuwing"
 HOL_de_vernieuwing_desc:0 "Kraliçe'nin programının bir parçası olarak, 'vernieuwing' veya 'yenilenme', siyasi partilerin kusurlu kavramını ortadan kaldıracaktır. Kraliçe'nin politikacılardan hoşnutsuzluğu iyi bilinir ve onlarsız daha iyi olacağımıza inanıyorsa, belki de öyledir. Kesinlikle yönetimi kolaylaştıracaktır."
 HOL_decolonization:0 "Sömürgesizleştirme"
 HOL_decolonization_desc:0 "Anavatanımızın yeterince sorunu var ve kaynaklarımızı sömürgelerimizle ilgilenmek için denizaşırı göndermek yerine, yerli halkı ezerken, onlara küresel topluluğun tam ve eşit bir üyesi olarak yükselmeleri için açıkça özgürlüklerini vermeliyiz ve bu süreçte güçlerimizi anakaraya geri çekmeliyiz."
 HOL_decolonization_tt:0 "§YHollanda§!'da §Y9 Piyade§! taburuyla 8 KNIL birimi oluşturur.\n"
 HOL_decolonization_tt1:0 "§YEndonezya§!'daki tüm eyaletler: Tamamen §Y[INS.GetNameDef]§! tarafından kontrol ediliyor!"
 HOL_decolonization_tt2:0 "§YEndonezya§!'daki tüm eyaletler: Tamamen §Y[HOL.GetNameDef]§! tarafından kontrol ediliyor!"
 HOL_depillarization:0 "Yapısal Çözülme"
 HOL_depillarization_desc:0 "Hollanda toplumu, 'zuilen' veya 'sütunlar' olarak adlandırılan çeşitli katmanlara bölünmüştür. Kraliçe, yeni yetkisinin bir parçası olarak, ülkemizi bunca yıldır rahatsız eden bu 'sütunlaşmayı' ortadan kaldırmayı amaçlamıştır. Bir dine, ideolojiye veya sosyal statüye sahip olanlar artık diğeriyle serbestçe etkileşime girebilir, istikrarı artırabilir."
 HOL_develop_the_randstad:0 "Randstad'ı Geliştir"
 HOL_develop_the_randstad_desc:0 "En büyük şehirlerimizi ve onları birbirine bağlayan alanları daha da geliştirerek, bazılarının şimdiden 'Çember Şehir' olarak adlandırmaya başladığı şeyin temellerini atabiliriz; Amsterdam, Den Haag, Rotterdam ve Utrecht'in büyük şehirlerini birbirine bağlayan, 'çemberin' merkezindeki 'Groene Hart' veya 'Yeşil Kalp'i çevreleyen kabaca dairesel bir kentsel alan."
 HOL_develop_the_south:0 "Güneyi Geliştir"
 HOL_develop_the_south_desc:0 "Eski Birleşik Hollanda'nın geri kalanını elde ettikten sonra, şimdi bu toprakların, ülkenin geri kalanına kıyasla geride kalmamaları için Hollanda'nın kalbi gibi sanayi birikimi için aynı yatırımları almasını sağlamaya bakmalıyız."
 HOL_develop_the_zandstad:0 "Zandstad'ı Geliştir"
 HOL_develop_the_zandstad_desc:0 "Tüm çabalarımızı en büyük şehirlerimizi inşa etmeye odaklamak yerine, yeni sanayiyi dış bölgeler arasında daha fazla dağıtmalıyız."
 HOL_domestic_innovation:0 "Yerli Yenilik"
 HOL_domestic_innovation_desc:0 "Ulusumuzun hızlı sanayileşmesi, takip etmemiz gereken yeni Ar-Ge fırsatları yarattı."
 HOL_domestic_jet_engine_designs:0 "Yerli Jet Motoru Tasarımları"
 HOL_domestic_jet_engine_designs_desc:0 "Yenilikçi uçak üreticilerimiz fütüristik tasarımlarla deney yapmaya teşvik edilmelidir. Sonuç hemen işleyen bir jet motorlu uçak olmasa da, şüphesiz genel olarak uçak üretiminde iyileşmelerle sonuçlanacaktır."
 HOL_domestic_vehicle_designs:0 "Yerli Araç Tasarımları"
 HOL_domestic_vehicle_designs_desc:0 "Otomobil sanayimize tasarımlarını ele almada daha fazla özgürlük vermek, üretim verimliliğini artırmada da yan etkilere sahip olabilir."
 HOL_enemies_on_all_fronts:0 "Tüm Cephelerde Düşmanlar"
 HOL_enemies_on_all_fronts_desc:0 "Ulusumuz küçük ve stratejik derinlikten yoksun. Hayatta kalmak için tek umudumuz, her erkeğin ve kadının görevini yapması ve herhangi bir istilacının üstesinden gelemeyecekleri bir insan kitlesiyle karşılaşmasıdır."
 HOL_escorts_for_the_new_fleet:0 "Yeni Filo İçin Eskortlar"
 HOL_escorts_for_the_new_fleet_desc:0 "Muharebe kruvazörlerimiz, torpido botlarına ve denizaltılara karşı korunmak için bol miktarda eskorta ihtiyaç duyar. İnşa ettiğimiz tüm eskortların mümkün olan en modern tasarıma sahip olduğundan emin olmalıyız."
 HOL_expand_RD_facilities:0 "Ar-Ge Tesislerini Genişlet"
 HOL_expand_RD_facilities_desc:0 "Endüstriyel genişlememiz ve diğer son gelişmeler, özellikle Philips'in zaten mevcut olan tesislerini genişletirsek, paralel olarak daha fazla Ar-Ge yapmamızı sağlayabilir."
 HOL_expand_curacao_oil_refineries:0 "Curaçao Petrol Rafinerilerini Genişlet"
 HOL_expand_curacao_oil_refineries_desc:0 "Maracaibo Gölü'nün sığ derinliği nedeniyle, 1918'den beri neredeyse tüm Venezuela petrolü, Aruba ve Curaçao'da işlenmek üzere sığ draftlı kıyı taşımacılığıyla nakledilir ve oradan okyanus aşırı tankerlerle dünyaya gönderilir. Oradaki rafinerilerimiz şu anda zaten dünyanın en büyükleridir, ancak yaklaşan dünya krizi tesislerin daha da genişletilmesini gerektirebilir."
 HOL_expand_curacao_oil_refineries_tt:0 "Bir Sanayi Kuruluşu olarak §YRoyal Dutch Shell§!'in kilidini açar.\n"
 HOL_expand_the_amsterdam_petroleum_harbor:0 "Amsterdam Petrol Limanını Genişlet"
 HOL_expand_the_amsterdam_petroleum_harbor_desc:0 "Donanmamızın boyutundaki bir artış, yakıt depolarımızın boyutunda da karşılaştırılabilir bir artış gerektirir, aksi takdirde kullanamayacağımız gemilerle kalırız. Amsterdam petrol limanı zaten yakıt ithalatı için bir merkezdir; depolama kapasitesini daha da artıracağız."
 HOL_expand_the_artillerieinrichtingen:0 "Artillerieinrichtingen'i Genişlet"
 HOL_expand_the_artillerieinrichtingen_desc:0 "Artillerie-Inrichtingen, kuvvetlerimiz için mühimmat ve az sayıda hafif silah (lisans altında) üretmektedir. Ordumuzu artırmayı hedefliyorsak genişletilmelidir."
 HOL_expand_the_artillerieinrichtingen_tt:0 "Bir Malzeme Tasarımcısı olarak §YA. I. Hembrug§!'un kilidini açar.\n"
 HOL_expand_the_colonial_army:0 "Sömürge Ordusunu Genişlet"
 HOL_expand_the_colonial_army_desc:0 "Doğu Hint Adaları'nın eksik olmadığı bir şey varsa o da insan gücüdür. Gerekli olan her türlü taviz ve vaatle, orduda hizmeti daha çekici hale getirmeli, aynı zamanda yeni sömürge acemilerinin adaların Japonların açgözlülüğüne karşı tek savunması olduğunu açıkça belirtmeliyiz."
 HOL_expand_the_ijmuiden_steel_mill:0 "IJmuiden Çelik Fabrikasını Genişlet"
 HOL_expand_the_ijmuiden_steel_mill_desc:0 "Savaş sanayimiz bol miktarda çeliğe ihtiyaç duyar ve IJmuiden'deki zaten mevcut olan tesisleri genişletmeye özen göstermeliyiz."
 HOL_expand_the_mld:0 "MLD'yi Genişlet"
 HOL_expand_the_mld_desc:0 "Hava kuvvetlerimizin açık ara en önemli kısmı, deniz havacılık kolu olan Marine Luchtvaart Dienst veya MLD'dir. Bu kolu genişletmeye, Doğu Hint Adaları'ndaki ana operasyon üssünü iyileştirmeye ve kullanımı için yeni taktikler ve stratejiler geliştirmeye özen göstermeliyiz."
 HOL_finish_the_noordoostpolder:0 "Noordoostpolder'ı Bitir"
 HOL_finish_the_noordoostpolder_desc:0 "Zuiderzee'yi Afsluitdijk'i inşa ederek kapattıktan ve böylece yapay IJsselmeer gölünü oluşturduktan sonra, şimdi Noordoostpolder'ın toprak ıslahı projesini bitirmeliyiz. Bu bize daha iyi altyapı ve sanayi ve tarım genişlemesi için daha fazla alan sağlayacaktır."
 HOL_fokker:0 "Fokker"
 HOL_fokker_desc:0 "Sivil uçak üretiminde dünya lideri olan Fokker, daha fazla askeri uçak inşa etme şansına atlıyor. Belki de onlara izin vermeli ve bunun gerektirdiği sanayinin büyümesini desteklemeliyiz."
 HOL_fokker_tt:0 "Bir Uçak Tasarımcısı olarak §YFokker§!'in kilidini açar.\n"
 HOL_for_the_common_good:0 "Ortak İyilik İçin"
 HOL_for_the_common_good_desc:0 "Tüm Komünizmin ortak iyiliği adına, teknolojik ilerlemelerimizi birbirimizle paylaşmalıyız."
 HOL_for_the_common_good_tt:0 "§Y[HOL.GetName]§! ve tüm fraksiyon üyeleri §YKomünist Teknoloji Değişimi§!'ne katılır.\n"
 HOL_form_new_government:0 "Yeni Hükümet Kur"
 HOL_form_new_government_desc:0 "Mevcut hükümetimiz zayıf ve şimdi bir kez daha düşmenin eşiğinde. Yeni bir Başbakana daha güçlü bir kabine kurma görevini vereceğiz."
 HOL_form_the_benelux:0 "Benelüks'ü Kur"
 HOL_form_the_benelux_bel_tt:0 "'§YHollanda [BEL.GetName]'i Benelüks'e davet ediyor§!' etkinliğini alır.\n"
 HOL_form_the_benelux_desc:0 "Biz, Batı Avrupa'nın küçük ulusları, yüzyıllardır Britanya, Fransa ve şimdi de Almanya'nın güç merkezleri arasında ezilmiş olarak, kıtamızı parçalayan çatışmalardan bıktık. Bir Avrupa Birleşik Devletleri bir gün Büyük Savaş gibi felaketleri önleyebilir, ancak güney komşularımızla gevşek bir birlik oluşturarak böyle bir organizasyonun çekirdeğini şimdiden sağlayabiliriz."
 HOL_form_the_benelux_lux_tt:0 "'§YHollanda [LUX.GetName]'i Benelüks'e davet ediyor§!' etkinliğini alır.\n"
 HOL_fortress_holland:0 "Hollanda Kalesi"
 HOL_fortress_holland_desc:0 "Her şeyi Hollanda Kalesi'ne yatırmalıyız. Büyük nehirlerin kuzeyindeki ve IJsselmeer'in batısındaki alan, nüfusumuzun ve sanayimizin açık ara en büyük bölümünü kapsar. Ülkenin geri kalanını feda etmek, sanayileşmiş bölgemizde daha güçlü bir müttefikin zamanında yardımımıza gelmesi için yeterince uzun süre dayanmamızı sağlayabilir."
 HOL_foundations_for_a_european_union:0 "Bir Avrupa Birliği İçin Temeller"
 HOL_foundations_for_a_european_union_desc:0 "Mütevazı Benelüks başlangıçlarımızdan, büyük güçlerin aralıksız savaş kışkırtıcılığı karşısında omuz omuza duran kıta çapında bir Uluslar Birliği kurmalıyız. Bir Avrupa Birliği herkes için barış ve refahı güvence altına alacaktır."
 HOL_french_military_mission:0 "Fransız Askeri Misyonu"
 HOL_french_military_mission_desc:0 "Fransız ordusu kıta genelinde ünlüdür. Askeri düşünürlerimizi eğitmek ve ordumuzun organizasyonunu iyileştirmek için bir askeri misyon davet edeceğiz."
 HOL_friesland_agricultural_impetus:0 "Friesland Tarımsal İtici Gücü"
 HOL_friesland_agricultural_impetus_desc:0 "Küçük ülkemizin tarımsal verimini artırmak, kendi kendine yeterliliği artırmada ve dolayısıyla ithalat ihtiyacını azaltmada uzun bir yol kat edecektir."
 HOL_further_reinforce_the_ports:0 "Limanları Daha Fazla Güçlendir"
 HOL_further_reinforce_the_ports_desc:0 "Britanya'nın bizim açık iznimiz olmadan \"bize yardım etme\" fikrini caydırmak için kıyı savunmamızı daha da güçlendirmeliyiz."
 HOL_gateway_to_europe:0 "Avrupa'ya Açılan Kapı"
 HOL_gateway_to_europe_desc:0 "Hollanda, Avrupa'ya ticaretin giriş kapısıdır, bu gerçek ticaret ortaklarımız tarafından iyi anlaşılmaktadır. Ancak, konumumuz bize güç verirken, aynı zamanda bizi imrenilmeyecek bir duruma sokuyor: İngilizler kıtadaki muhtemel düşmanlarını ablukaya almayı hedeflerken, Almanlar bizi bir arka kapı olarak kullanarak ülkemiz üzerinden ülkelerine ticaret akışını artırmamızı istiyorlar."
 HOL_gateway_to_europe_tt:0 "Bunlar, §Y[GER.GetName]§! ve §Y[ENG.GetName]§!'e Ticaret Etkisi puanları vermeyi mümkün kılar.\n"
 HOL_german_technological_exchange:0 "Alman Teknolojik Değişimi"
 HOL_german_technological_exchange_desc:0 "Alman teknolojisine erişimle, bu Yeni Dünya Düzenini şekillendirme yükünün payımıza düşen kısmını daha iyi taşıyabileceğiz."
 HOL_germany_is_the_greater_threat:0 "Almanya Daha Büyük Tehdit"
 HOL_germany_is_the_greater_threat_desc:0 "Almanya'nın artan saldırganlığı ışığında, savunmalarımızı doğuya yönlendirmeliyiz, sadece son savaşta olduğundan daha az saygılı olmaları ihtimaline karşı..."
 HOL_go_with_britain:0 "Britanya ile Git"
 HOL_go_with_britain_desc:0 "İngilizler mevcut krizde demokratik idealler için ayağa kalktılar ve sömürge imparatorluklarımızın bütünlüğüne olan ilgimizi paylaşıyorlar. Onların davasına katılmamız doğaldır."
 HOL_go_with_britain_event_tt:0 "§Y[ENG.GetNameWithFlag]§!'nin parçası olduğu grubun grup liderine, gruba katılma isteğinde bulunan etkinliği gönderir."
 HOL_haven_of_tolerance:0 "Hoşgörü Cenneti"
 HOL_haven_of_tolerance_desc:0 "Hollanda ruhu komünizmde bile parlıyor. Anavatanları tarafından dışlanmış herkesi ve herkesi memnuniyetle karşılıyoruz. Geçmişlerini sormuyoruz, sadece bu yeni filizlenen Cennet'i onu boğacak güçlerden korumak için görevlerini yapmalarını istiyoruz."
 HOL_imperial_ambitions:0 "İmparatorluk Hırsları"
 HOL_imperial_ambitions_desc:0 "Halkımız bir İmparatorluk gücü olarak statümüze yakışır şanla sevinirken, geriye kalan tek şey Amerika Birleşik Devletleri'nin kuzeydoğusundaki eski Nieuw Nederland sömürgelerimizi geri almaktır."
 HOL_implement_the_program:0 "\"Programı\" uygulayın"
 HOL_implement_the_program_desc:0 "Ulus Liderimizin liderliği altında güvende olduğuna göre, partinin 'Programını' uygulama zamanı geldi. Güçlü bir hükümet, ekonomik ve sosyal reformlar ve basın özgürlüğü ile oy haklarının kaldırılması, halkımızı daha güçlü kılacak noktalardan sadece birkaçı. Herkes Vatan için görevini yapmalı!"
 HOL_java:0 "Cava"
 HOL_java_desc:0 "Doğu Hint Adalarımızın başkent adasına, günümüzün uygun sanayileşme derecesine daha uygun hale getirmek için yoğun bir şekilde yatırım yapılmalıdır."
 HOL_join_germany:0 "Almanya'ya Katıl"
 HOL_join_germany_desc:0 "Biz ruh ikizi olanlar, dünyaya karşı birlikte durmalıyız. Mihver'e üyelik talebinde bulunma zamanımız geldi."
 HOL_join_the_french:0 "Fransızlara Katıl"
 HOL_join_the_french_desc:0 "Fransa'daki komünist hareket giderek daha başarılı oldu ve şimdi Komintern'den ayrı durmayı seçtiler. Coğrafi olarak bize çok daha yakın oldukları için, onlarla aynı çizgide olmak, komünizm davasına uzak Sovyetlere güvenmekten çok daha fazla fayda sağlayacaktır."
 HOL_lead_the_minor_democracies:0 "Küçük Demokrasilere Liderlik Et"
 HOL_lead_the_minor_democracies_desc:0 "Günümüzün büyük güçleri başka bir savaşa kararlı görünürken, dünyayı yanmaktan korumak, iki dövüşçüyü birbirinden ayıran bir kalabalık gibi, Avrupa'nın küçük demokrasilerine kalmıştır. Savaş kışkırtıcılarına karşı bir tarafsızlık bloğu oluşturmada diğerlerine liderlik edeceğiz."
 HOL_legacy_of_the_de_zeven_provincien_mutiny:0 "\"De Zeven Provinciën\" İsyanının Mirası"
 HOL_legacy_of_the_de_zeven_provincien_mutiny_desc:0 "Şubat 1933'te \"De Zeven Provinciën\" kruvazöründeki isyan o zamandan beri tabu bir konu olmuştur. Bu cesur adamların İşçi davası uğruna yaptığı fedakarlıkları unutmamak için konuyu yeniden tartışılabilir hale getirmeliyiz. Hepimiz onların eylemlerinden örnek almalı ve ideallerimizi savunmak için ayağa kalkmalıyız!"
 HOL_lessons_from_the_last_war:0 "Son Savaştan Dersler"
 HOL_lessons_from_the_last_war_desc:0 "Dahil olmamış olsak da, Schlieffen Planı'nın entrikalarını ve başarısızlıklarını kapımızın önünde gözlemlemek için birinci sınıf bir konumdaydık. Bu gözlemlerden sonuçlarımızı çıkarmalıyız."
 HOL_lessons_from_the_low_countries:0 "Aşağı Ülkelerden Dersler"
 HOL_lessons_from_the_low_countries_desc:0 "İki büyük güç arasındaki tarafsız toprak olarak, Aşağı Ülkeler savaş payını gördü. Bundan derslerimizi çıkarmalı ve bir komşu diğerine ulaşmak için bizi bir kez daha ezmeye çalıştığında daha fazla istilaya hazırlıklı olmalıyız."
 HOL_liberation:0 "Kurtuluş"
 HOL_liberation_desc:0 "Anavatanımız kurtarıldı ve teslimiyetimiz üzerine teslim olan ordular serbest bırakıldı ve intikam için can atıyorlar. Coşkulu kalabalıklar kurtarıcıları selamlarken moral yükseliyor ve halk bir başka istilacıya kolay kolay boyun eğmeyecek."
 HOL_light_tanks_for_the_colonies:0 "Sömürgeler İçin Hafif Tanklar"
 HOL_light_tanks_for_the_colonies_2tt:0 "Veya:\n"
 HOL_light_tanks_for_the_colonies_desc:0 "Hafif tanklar, ada sömürgelerimizin geniş ve zorlu arazisini amfibi piyade çıkarmalarına karşı savunmak için mükemmel bir şekilde uygun olacaktır."
 HOL_light_tanks_for_the_colonies_tt:0 "Modernizasyona mı yoksa lisanslı üretime mi odaklanmayı seçtiğinize bağlı olarak, bu odak aşağıdakilerden birini verir:\n"
 HOL_longer_range_models:0 "Daha Uzun Menzilli Modeller"
 HOL_longer_range_models_desc:0 "Denizlerde hakimiyet, sömürge imparatorluğumuzun bütünlüğü için esastır. Ancak denizler geniştir ve bu nedenle yeterli menzile sahip uçaklara ihtiyacımız var."
 HOL_maintain_trade_neutrality:0 "Ticari Tarafsızlığı Koru"
 HOL_maintain_trade_neutrality2_tt:0 "Hem @GER§Y[GER.GetName]§! hem de @ENG§Y[ENG.GetName]§! en az §Y50§! Ticaret Etkisi puanına sahip.\n"
 HOL_maintain_trade_neutrality_desc:0 "Her iki taraftan da ticaretimize yönelik taleplere direnmeliyiz ve ticaret politikalarımızı şimdiki gibi sürdürmeliyiz. Herhangi bir tarafı seçmek, muhtemelen diğeriyle savaşa yol açacaktır..."
 HOL_maintain_trade_neutrality_tt:0 "@GER§Y[GER.GetName]§! veya @ENG§Y[ENG.GetName]§!'in hiçbiri diğerinden §Y5§!'ten fazla Ticaret Etkisi puanına sahip değil.\n"
 HOL_make_use_of_our_riches:0 "Zenginliklerimizden Yararlan"
 HOL_make_use_of_our_riches_desc:0 "Ulusumuz, küçük bir gücün kılığını giyerken büyük bir gücün kaynaklarına sahiptir. Belki de bize sunulan zenginlikleri daha iyi kullanırsak, orta seviyeye yükselebilir, hatta bir kez daha dünyanın egemen güçleri arasında yerimizi alabiliriz."
 HOL_making_the_ends_of_europe_meet:0 "Avrupa'nın Uçlarını Birleştirme"
 HOL_making_the_ends_of_europe_meet_desc:0 "Komünizm şimdi Avrupa'yı her iki taraftan da kucaklıyor. Bu uçları birleştirme ve aradaki gücü ortadan kaldırma zamanı geldi."
 HOL_mobilize_the_masses:0 "Kitleleri Seferber Et"
 HOL_mobilize_the_masses_desc:0 "İşçiyi savunabilecek tek kişi yine işçidir. Halk, ülkesini ve inançlarını savunmak için ayağa kalkmalıdır!"
 HOL_modernize_our_infantry_equipment:0 "Piyade Teçhizatımızı Modernize Et"
 HOL_modernize_our_infantry_equipment_desc:0 "Piyade teçhizatımız korkunç derecede güncelliğini yitirmiş durumda. Herhangi bir istilayı durdurma şansımız olacaksa, bu durum düzeltilmelidir."
 HOL_modernize_our_infantry_equipment_tt:0 "Bu, gelecekte lisanslı üretim yerine teçhizatın ülke içinde geliştirilmesine odaklanmamıza neden olacaktır.\n"
 HOL_modernize_the_air_fleet:0 "Hava Filosunu Modernize Et"
 HOL_modernize_the_air_fleet_desc:0 "Acil savunmamız için gereken uçak modellerinin edinimini büyük ölçüde hızlandırmalıyız. Zaman kısa!"
 HOL_modernize_the_cruiser_fleet:0 "Kruvazör Filosunu Modernize Et"
 HOL_modernize_the_cruiser_fleet_desc:0 "Kruvazörlerimiz, Doğu Hint Adaları için savunma planlarımızda hayati öneme sahiptir, ancak şu anda sahip olduklarımız eski tasarımlardır. Mümkün olan en kısa sürede inşa etmeye başlayabileceğimiz yeni nesil savaş gemileri tasarlayacağız."
 HOL_modernize_the_grebbeline:0 "Grebbe Hattını Modernize Et"
 HOL_modernize_the_grebbeline_desc:0 "Hollanda Kalesi'nin güney cephesi, büyük Ren ve Meuse nehirleri tarafından iyi bir şekilde savunulmaktadır. Bu, Amsterdam'ın doğusunda, kuzeyde IJsselmeer ile güneyde Ren arasında sadece bir boşluk bırakır. Burada bulunan savunma hattı olan Grebbe Hattı, kararlı bir saldırıya karşı dayanacaksa modernize edilmeli ve güçlendirilmelidir."
 HOL_naval_heritage:0 "Denizcilik Mirası"
 HOL_naval_heritage_desc:0 "Piet Hein'den Michiel de Ruyter'e kadar, ulusumuzun tarihi, kendi dönemlerinin büyük deniz güçlerine karşı başarılı istismarları ve deniz kahramanlarıyla doludur. Denizlerle bir akrabalık kanımızda var ve denizcilik gururumuzu ve mirasımızı canlandırmak için ona sarılmamız yeterlidir."
 HOL_obtain_foreign_colonial_investments:0 "Yabancı Sömürge Yatırımları Edin"
 HOL_obtain_foreign_colonial_investments_desc:0 "Güçlü bir şekilde sömürgecilik karşıtı olmalarına rağmen, Amerikalıların sömürgelerimizde, özellikle de Batı Hint Adaları'nda uzun zamandır ekonomik bir çıkarı olmuştur. İngilizler ve Japonlarla birlikte, hem Batı'da hem de Doğu'da sömürge gelişimimize yatırım yapmayı arzuluyorlar. Bunu teşvik etmeliyiz."
 HOL_obtain_foreign_colonial_investments_tt:0 "Bunlar, §YTüketim Malları§! ve §Yİnşaat Hızı§! için geçici bonusların yanı sıra Doğu ve Batı Hint Adaları'ndaki §YPetrol§! üretiminde kalıcı artışlar sağlar.\n"
 HOL_open_second_paranam_bauxite_mine:0 "İkinci Paranam Boksit Madenini Aç"
 HOL_open_second_paranam_bauxite_mine_desc:0 "Surinam'dan gelen boksit, büyük güçlerin uçak endüstrileri için alüminyum üretiminde muazzam bir öneme sahiptir. Dünyadaki mevcut askeri yığınakla alüminyum talebi çarpıcı bir şekilde arttı ve bu nedenle Paranam'da ikinci bir boksit madeni açarsak ihracatımızı şüphesiz artırabiliriz."
 HOL_oranje_boven:0 "Oranje Boven!"
 HOL_oranje_boven_desc:0 "Ülkemizin tarihi, Orange-Nassau kraliyet ailesiyle iç içedir. Bu nedenle, turuncu renk ulusal bir sembol haline gelmiştir, bu hem ulusal kutlama günlerinde bayrağa turuncu bir flama ekleme geleneğinde hem de Kraliçe'yi ve bir bütün olarak kraliyet ailesini kutlayan 'Oranje Boven' veya 'Turuncu Yukarıda' gibi kısa vatansever şarkılarda yansıtılmaktadır."
 HOL_overturn_military_budget_cuts:0 "Askeri Bütçe Kesintilerini Geri Çevir"
 HOL_overturn_military_budget_cuts_desc:0 "Altın Standardını terk ettikten sonra ekonomi şaşırtıcı derecede hızlı bir şekilde toparlanmaya başladı... Gulden'in devalüasyonunu önlemek için uygulamak zorunda kaldığımız askeri bütçe kesintileri şimdi geri çevrilebilir."
 HOL_philips_focus:0 "Philips"
 HOL_philips_focus_desc:0 "Philips, radyolar ve diğer elektronik cihazlarda uzun zamandır pazar lideridir. Belki de bu Hollandalı elektronik şirketini sözleşme ve fonlama yoluyla bu giderek önem kazanan askeri teçhizat türünde kendi atılımlarımızı başarabiliriz."
 HOL_philips_focus_tt:0 "Bir Sanayi Kuruluşu olarak §YPhilips§!'in kilidini açar.\n"
 HOL_placate_the_japanese:0 "Japonları Yatıştır"
 HOL_placate_the_japanese_desc:0 "Japonların Doğu'daki zengin sömürgelerimizde gözü olduğu biliniyor. Belki de barış ve işbirliğinin devamı adına, onlara takımadaların kaynakları üzerinde münhasır haklar verip vermemeye, hatta sömürgelerin kontrolünü tamamen devredip devretmemeye karar verme zamanı gelmiştir."
 HOL_pre_empt_venezuelan_aggression:0 "Venezuela Saldırganlığını Önle"
 HOL_pre_empt_venezuelan_aggression_desc:0 "Venezuelalılar, Antillerimiz üzerindeki tasarımlarını fazlasıyla açık ettiler. Bu sefer sadece 'korumalarını teklif etmeye' çalışmış olabilirler, ancak durumumuz kötüleşirse neye sürüklenebilecekleri belli olmaz. Onlar yapmadan önce saldırmalı ve petrol rafinerilerimizin güvenliğini sağlamalıyız."
 HOL_pre_empt_venezuelan_aggression_tt:0 "§YBüyük Savaşın Şok Geçirmiş Seyircisi§! ulusal ruhuna sahip değil!"
 HOL_pre_empt_western_intervention:0 "Batı Müdahalesini Önle"
 HOL_pre_empt_western_intervention_desc:0 "İdeolojimiz yerleştikçe, onu beşiğinde başarısız görmek isteyen güçler var. Bunun olmasına izin veremeyiz ve kaçınılmaz darbenin düşmesini beklemek yerine, hızlı hareket etmeli ve hayatta kalmamıza yönelik bu tehdidi ortadan kaldırmalıyız."
 HOL_prepare_for_our_return:0 "Dönüşümüz İçin Hazırlan"
 HOL_prepare_for_our_return_desc:0 "Anavatanımızın kurtarılmasına yardım etmek istiyorsak, birliklerimizi kıtaya geri taşımak için büyük miktarda gemiye ihtiyacımız var. Daha fazla tersane ve kargo gemisi inşa etme zanaatını mükemmelleştirmek bu ihtiyacı karşılamalıdır."
 HOL_prepare_naval_expansion:0 "Deniz Genişlemesine Hazırlan"
 HOL_prepare_naval_expansion_desc:0 "Donanmamızın genişlemesine zamanında hazırlanmalı ve bu nedenle Hollanda gemi inşaatının genişlemesine ŞİMDİDEN kaynak ayırmaya başlamalıyız."
 HOL_prepare_the_inundation_lines:0 "Taşkın Hatlarını Hazırla"
 HOL_prepare_the_inundation_lines_desc:0 "16. yüzyıldaki İspanyollara karşı bağımsızlık savaşımızdan bu yana, taşkın veya arazinin kasıtlı olarak sular altında bırakılması, savunmamızın ayrılmaz bir parçası olmuştur. Düzgün bir şekilde hazırlandığında, bizi kesinlikle tekrar kurtaracaktır: henüz suyu geçebilen bir tank görmedik."
 HOL_prepare_the_inundation_lines_tt:0 "Bunlar, Hollanda Kalesi çevresindeki belirli eyaletlerin §YSu Baskını§! ve §YBoşaltılmasına§! izin vererek savunma bonusları sağlar.\n"
 HOL_production_under_license:0 "Lisanslı Üretim"
 HOL_production_under_license_desc:0 "Sözü edilecek bir yerli silah sanayimiz olmadığından, yurtdışında hem hafif silahların hem de topçunun daha yeni modellerine bakmalıyız. Şanslıysak, bunları lisans altında yurt içinde üretme haklarını elde edebiliriz."
 HOL_production_under_license_tt:0 "Bu, gelecekte teçhizatın ülke içinde geliştirilmesi yerine lisanslı üretime odaklanmamıza neden olacaktır.\n"
 HOL_protect_against_britain:0 "Britanya'ya Karşı Koru"
 HOL_protect_against_britain_desc:0 "Gerçek tarafsızlık, egemenliğimizi onu ihlal edecek herkese karşı savunacağımız anlamına gelir... Bu, limanlarımızı ve havaalanlarımızı Almanlardan korumak için yanlış yönlendirilmiş bir girişimde bulunan İngilizler olsa bile."
 HOL_protect_the_colonies:0 "Sömürgeleri Koru"
 HOL_protect_the_colonies_desc:0 "Herhangi bir deniz istilası girişimini caydırmak ve gerekirse bir tanesine karşı korunmak için sömürgelere daha fazla sayıda modern deniz bombardıman uçağı konuşlandırmalıyız."
 HOL_protect_the_mainland:0 "Anakarayı Koru"
 HOL_protect_the_mainland_desc:0 "Kıtasal Hollanda'yı korumak için, gökyüzümüzde hava üstünlüğünü sürdürmek amacıyla modern savaş uçaklarından oluşan bir filo edinmeliyiz."
 HOL_red_is_the_new_orange:0 "Kırmızı Yeni Turuncu"
 HOL_red_is_the_new_orange_desc:0 "Eşitlik, ulusumuzun tarihiyle bu kadar iç içe geçmiş bir aile olsa bile, kimsenin diğerlerinin üzerine çıkarılmasına yer bırakmaz. Unvanları ellerinden alınmalı ve kaynaklarına ortak iyiliği ilerletmek için el konulmalıdır."
 HOL_reinforce_java:0 "Cava'yı Güçlendir"
 HOL_reinforce_java_desc:0 "Cava, Doğu Hint takımadalarının nüfusunun ve sanayisinin en büyük bölümünü, başkentini ve tüm büyük askeri üsleri ve karargahları barındırır. Sonuç olarak, Doğu Hint Adaları'nın açık ara en önemli adasıdır ve diğer her şey kaybolsa bile kontrolünü elimizde tutabildiğimizden emin olmak için savunmasını iyileştirmeliyiz."
 HOL_rely_on_submarines:0 "Denizaltılara Güven"
 HOL_rely_on_submarines_desc:0 "Modern kruvazörler bile, savaşmamız beklenebilecek devasa donanmalara karşı hiçbir yardım sağlamayacaktır. Bunun yerine, daha güçlü bir müttefikin filosu gelene kadar düşman ilerlemesini geciktirmek için modern denizaltılara yatırım yapacağız."
 HOL_replace_the_defeatist_government:0 "Yenilgici Hükümeti Değiştir"
 HOL_replace_the_defeatist_government_desc:0 "Hükümetimiz, saldırgana direnmeye devam etmenin bir anlamı olmadığını düşünen korkaklarla dolu. Bu adamları, mücadeleyi başarılı bir sonuca ulaştırmak için yapılması gerekeni yapmaya istekli olanlarla değiştirmeliyiz."
 HOL_request_allied_favors:0 "Müttefik İyilikleri İste"
 HOL_request_allied_favors_desc:0 "Küçük bir güç olabiliriz, ama bu savaşı kazanma konusundaki kararlılığımızı gösterdik. Ancak, bunu yapmak için yardıma ihtiyacımız var ve katkılarımızla birkaç iyilik kazandığımız beklenmelidir..."
 HOL_request_allied_favors_tt:0 "Bunlar, müttefiklerinizden §YHarita Dışı Sanayi§!, §Yİnsan Gücü§!, §YEkipman§! ve daha fazlasını elde etmeyi mümkün kılar.\n"
 HOL_responsibility_for_our_own_defense:0 "Kendi Savunmamızın Sorumluluğu"
 HOL_responsibility_for_our_own_defense_desc:0 "Güvenebileceğimiz büyük güçler olmadan, kendi savunmamıza bakmaktan ve karşılarına çıkabilecek her türlü zorluğa yeterli olduklarından emin olmaktan başka seçeneğimiz yok."
 HOL_revive_the_buffer_state_proposal:0 "Tampon Devlet Önerisini Canlandır"
 HOL_revive_the_buffer_state_proposal_desc:0 "Almanlar ve Fransızlar birbirlerinin boğazına sarılmaktan kaçınamaz gibi göründüklerinden, belki de güçlü bir Aşağı Ülkeler tampon devleti davasını bir kez daha tartışma zamanı gelmiştir. Eğer Belçikalılar ve Lüksemburglular bunu istemeseydi, belki de bizim gibi savaş çabasına daha fazla katkıda bulunmalıydılar?"
 HOL_revive_the_buffer_state_proposal_tt1:0 "§Y[HOL.GetName]§!: §Y[BEL.GetName]§!'den daha yüksek £legitimacy §YMeşruiyete§! sahip"
 HOL_revive_the_buffer_state_proposal_tt2:0 "§Y[HOL.GetName]§!: §Y[LUX.GetName]§!'den daha yüksek £legitimacy §YMeşruiyete§! sahip"
 HOL_royal_arms_purchases:0 "Kraliyet Silah Alımları"
 HOL_royal_arms_purchases_desc:0 "Çıkarları şimdi bir bütün olarak ülkeninkiyle daha da karmaşık bir şekilde iç içe geçtiği için, Kraliçe bol kişisel servetini yurtdışından yeni teçhizat alımını finanse etmek için kullanmayı teklif etti."
 HOL_secret_staff_talks:0 "Gizli Kurmay Görüşmeleri"
 HOL_secret_staff_talks_desc:0 "Resmen tarafsız olsak da, yine de komşularımızla gizli kurmay görüşmelerine bakmalıyız. Komşularımızdan herhangi biriyle yapılan, resmi olmasa bile, ortak savunma planları, bir başkası tarafından istila edilirsek muazzam bir öneme sahip olabilir."
 HOL_secret_staff_talks_tt:0 "Bunlar, §YEkipman§!, §YSaldırı§! ve §YSavunma§! muharebe bonusları, §YKara Doktrini§! araştırma bonusları ve Sürgündeki Hükümet £legitimacy §YMeşruiyeti§! elde etmeyi mümkün kılar.\n"
 HOL_ship_a_day_sinking_quotas:0 "Günde Bir Gemi Batırma Kotaları"
 HOL_ship_a_day_sinking_quotas_desc:0 "Doğu Hint Adaları'nı kararlı bir saldırıdan tamamen savunamıyor olsak bile, bunu kolaylaştırmamalıyız. Denizaltı kuvvetlerimiz düşmanın ikmal hatlarına durmaksızın saldırmalı ve hem bunu yapacak donanıma sahip olmalı hem de agresif ve yetenekli bir komutan tarafından yönetilmelidir."
 HOL_socialist_industrial_support:0 "Sosyalist Sanayi Desteği"
 HOL_socialist_industrial_support_desc:0 "Müttefiklerimizin sanayi kapasitesi bizden çok daha fazla. Yaklaşan fırtınayı atlatacaksak onların yardımına ihtiyacımız olacak."
 HOL_southward_defenses:0 "Güneye Yönelik Savunmalar"
 HOL_southward_defenses_desc:0 "Belçika üzerinden kuzeye doğru herhangi bir ilerlemeyi engellemek için Meuse nehri boyunca bir savunma hattı kurmalıyız. Kıyı savunmalarımızın daha da, nihai olarak güçlendirilmesi, limanlarımıza bir seferi kuvvet çıkarma potansiyelindeki herhangi bir İngiliz planını kesin olarak bozmalıdır."
 HOL_soviet_technical_teams:0 "Sovyet Teknik Ekipleri"
 HOL_soviet_technical_teams_desc:0 "Müttefiklerimiz, savaş teçhizatı üretimini en üst düzeye çıkarma sanatında ustalaşmışlardır. Birkaç uzman ekip alarak, kendi üretim hatlarımızı onların yeniliklerinden yararlanmak için ince ayar yapabiliriz."
 HOL_strategic_bombing_defense:0 "Stratejik Bombardıman Savunması"
 HOL_strategic_bombing_defense_desc:0 "Savaş Hollanda'ya gelirse, kesinlikle hayal edilebilecek en büyük ölçekte stratejik bombardımanı içerecektir. Bu tehditle başa çıkmak için yeni doktrinler geliştirmeli ve bu doktrinlerin gerektireceği büyük hava kuvvetine izin vermek için kıtasal hava üslerimizi genişletmeliyiz."
 HOL_strength_over_blood:0 "Kandan Önce Güç"
 HOL_strength_over_blood_desc:0 "Kanın, birinin lider olup olmamasında hiçbir etkisi olmamalıdır. Doğumda kanı mavi olanlar yerine, gücünü gösterenlerin ulusumuzu yönetmesine izin verin."
 HOL_sumatra:0 "Sumatra"
 HOL_sumatra_desc:0 "Tamamen Doğu Hint Adaları'nın bir parçası olan en büyük bitişik kara parçası olmasına rağmen, Cava'nın kuzey komşusu Sumatra, sanayileşme ve altyapıda oldukça geride kalmıştır. Bunu derhal düzeltmeliyiz."
 HOL_symbol_of_resistance:0 "Direniş Sembolü"
 HOL_symbol_of_resistance_desc:0 "Sessiz William, 80 Yıl Savaşları'nda İspanyollardan bağımsızlığımızı sağladığından beri, kraliyet ailesi Hollanda bağımsızlığının ve herhangi bir yabancı istilacıya karşı direnişin bir sembolü olmuştur. Sınırlarımız tekrar ihlal edilirse, bunun farklı olmayacağı kesindir."
 HOL_taking_back_french_flanders:0 "Fransız Flanders'ını Geri Alma"
 HOL_taking_back_french_flanders_desc:0 "Aşağı ülkelerin tarihi sınırları o zamandan beri onu çevreleyen büyük güçler tarafından bölünmüştür. Bunlardan Fransa, hala tarihi Flanders'ın bir parçası olarak kabul edilen kayda değer miktarda toprağı elinde tutmaktadır. Şimdi onu geri alacak kadar güçlüyüz ve öyle yapmalıyız."
 HOL_taking_back_our_old_colonies:0 "Eski Sömürgelerimizi Geri Alma"
 HOL_taking_back_our_old_colonies_desc:0 "Yaklaşık 150 yıl önce Napolyon'un fethinden kaynaklanan geçici zayıflığımız, sömürgelerimizin çoğunu İngilizlere kaybetmemize neden oldu. Bunların birçoğunun nüfusu hala Hollanda kültürümüzü ve mirasımızı paylaşıyor. Eski sömürge mülklerimizi geri almalıyız!"
 HOL_the_battlecruiser_plan:0 "Muharebe Kruvazörü Planı"
 HOL_the_battlecruiser_plan_desc:0 "Daha önce inşa ettiğimiz veya tasarladığımız her şeyden daha büyük gemiler olan bir üçlü muharebe kruvazörünün yaratılması lehine sesler yükselmeye başladı. Alman iyi niyetiyle, bize Alman muharebe kruvazörü Scharnhorst'un planlarını sağlayabilirler, bu da bunları kendi tasarımlarımızı oluşturmak için bir temel olarak kullanmamızı sağlar. Bu gemiler kesinlikle sömürgelerimize yönelik herhangi bir saldırıyı caydıracaktır."
 HOL_the_battlecruiser_plan_tt:0 "§RBonusların yürürlüğe girmesi için [GER.GetNameDefCap] anlaşmayı onaylamalıdır.§!\n"
 HOL_the_best_defense:0 "En İyi Savunma"
 HOL_the_best_defense_desc:0 "Önceki savaşlarda olduğu gibi hazırlıksız yakalanmamalıyız. Komşularımız mantığa kulak verip barışa razı olmazlarsa, o zaman onları biz razı etmeliyiz."
 HOL_the_continents_best_and_brightest:0 "Kıtanın En İyileri ve En Parlakları"
 HOL_the_continents_best_and_brightest_desc:0 "Her birimizin sadece küçük kaynakları olsa da, onları bir araya getirirsek büyüklerin yapabildiği her şeyi başarabiliriz."
 HOL_the_crown_jewel_colony:0 "Taçtaki Mücevher Sömürgesi"
 HOL_the_crown_jewel_colony_desc:0 "Hindistan İngilizler için ne ise, Doğu Hint Adaları da bizim için odur. Ancak, Doğu Hint Adaları'ndaki mevcut, modası geçmiş altyapı bu modern çağda işe yaramayacaktır. Ulusal Gururumuza bu şekilde muamele edilmelidir ve bu nedenle altyapı, ulusumuzun bu kadar önemli bir parçasından beklenene daha uygun hale getirilmek için modernize edilecektir."
 HOL_the_east_indies_war_machine:0 "Doğu Hint Adaları Savaş Makinesi"
 HOL_the_east_indies_war_machine_desc:0 "Ekipman ve mühimmat için müttefiklerimize güvenmeye devam edemeyiz. Kaynak zenginliğimiz var; şimdi bu kaynakları savaş makinemizi beslemek için kullanacak sanayiyi inşa etmeliyiz."
 HOL_the_foundations_of_defense:0 "\"Savunmanın Temelleri\""
 HOL_the_foundations_of_defense_desc:0 "\"Defensiegrondslagen van Nederlands-Indië\" 1927'de hazırlanan ve kolonilerimizin savunulabilirliğini analiz eden bir rapordu. Japon saldırganlığının son zamanlarda artması ve Doğu Hint Adaları'na yönelik planlarının çok iyi bilinmesi nedeniyle, belki de bu belgenin tozunu almalı ve yeni serbest bırakılan kaynaklarımızın tahsisi için belirlediği savunma zayıf noktalarına öncelik verilmelidir."
 HOL_the_foundations_of_defense_tt:0 "Soerabaja'daki §YDeniz Üssü§!'nü maksimum seviyeye ayarla.\n"
 HOL_the_fourth_ally:0 "Dördüncü Müttefik"
 HOL_the_fourth_ally_desc:0 "Mütevazı başlangıçlarımıza rağmen, katkılarımız yadsınamaz. Faşistlere karşı savaşta - İngiltere, ABD ve Sovyetler Birliği'nin yanı sıra - dördüncü müttefik olarak yerimizi alma zamanı geldi."
 HOL_the_maastunnel:0 "Maastunnel"
 HOL_the_maastunnel_desc:0 "Büyük nehirlerimiz olağanüstü engellerdir, ancak altlarından tüneller kazarak altyapımızı büyük ölçüde iyileştirebiliriz. Maastunnel bunlardan ilki olacak ve Rotterdam şehrine güneyden erişilebilirliği büyük ölçüde artıracaktır."
 HOL_the_netherlands_first:0 "Önce Hollanda"
 HOL_the_netherlands_first_desc:0 "Hollanda, kendi başına Büyük Güç olmak için tüm doğal kaynak zenginliğine sahiptir. Eğer bunu doğru kullanır ve toplumumuzu askerileştirmeye devam edersek, bu dünyada kendi yerimizi oymak için Alman yardımına ihtiyacımız yok."
 HOL_the_only_man_in_the_dutch_government:0 "Hollanda Hükümetindeki Tek Adam"
 HOL_the_only_man_in_the_dutch_government_desc:0 "Churchill'in kendisinin bir zamanlar söylediği gibi, gururlu Kraliçemiz Wilhelmina 'Hollanda hükümetindeki tek adamdır'; yapılması gerekeni yapacak omurgaya sahip tek kişidir. Midesi daha zayıf olanlara güvenmek yerine, belki de hükümetin doğrudan kontrolünü üstlenmeli ve uygun gördüğü şekilde yönetmelidir."
 HOL_the_singapore_conferences:0 "Singapur Konferansları"
 HOL_the_singapore_conferences_desc:0 "İngilizler, son yıllarda Güneydoğu Asya'daki tüm çıkarlarımızı tehdit eden artan Japon saldırganlığını tartışan bir dizi konferansa Amerikalılar ve Avustralyalılarla birlikte bizi de davet ettiler. Birlikte, bağlayıcı olmasa da, bir Japon saldırısı durumunda onlardan bekleyebileceğimiz destek hakkında bize değerli bilgiler verecek savunma planları geliştireceğiz."
 HOL_the_ultimate_deterrent:0 "Nihai Caydırıcı"
 HOL_the_ultimate_deterrent_desc:0 "Güçlü bir hava kuvveti ve güçlü bir donanma hepsi güzel ve iyi, ama sömürgelerimize saldırmaktan veya tarafsızlığımızı ihlal etmekten herhangi birini gerçekten caydıracak olan şey, bir atom bombasının geliştirilmesi olacaktır."
 HOL_the_united_netherlands:0 "Birleşik Hollanda"
 HOL_the_united_netherlands_desc:0 "Halklarımız birlikte daha güçlü. İngilizler bile bunu Napolyon savaşlarından sonra Birleşik Hollanda tampon devletini kurduklarında biliyorlardı. Kısa ömürlü olsa da, bu sadece teklifin işe yaraması için daha güçlü bir liderliğin gerektiği anlamına gelir. Belçikalıları ve Lüksemburgluları sürüye geri döndüreceğiz, sonrasında kim gelirse gelsin güçlü duracağız."
 HOL_the_western_possessions:0 "Batı Mülkleri"
 HOL_the_western_possessions_desc:0 "Batı Hint Adaları, Doğu'daki emsalleri lehine sık sık göz ardı edilir, ancak kendi kaynakları bakımından zengindirler. Altyapının yeterli olmasını sağlamak, bölgedeki sanayiyi ve kaynak çıkarımını potansiyel olarak artırmaya yönelik ilk adımdır."
 HOL_the_zuiderzee_works:0 "Zuiderzee İşlerine Devam Et"
 HOL_the_zuiderzee_works_desc:0 "Toprak ıslahının bir sonraki aşaması, ilk olarak Roma dönemlerinde bahsedilen antik Flevo gölünden adını alan Flevopolder'dır. Bu, tamamen bitirilmesi uzun yıllar alacak muazzam bir projedir, ancak kısa vadede bile bize bolca ödül sağlayacaktır."
 HOL_trade_influence_tt:0 "Tüm §YAvrupa'ya Açılan Kapı§! katılımcıları tarafından yatırılan toplam miktara eşit bir miktar §YSiyasi Güç§! alır. Şu anda bu miktar:\n"
 HOL_unity_through_democracy:0 "\"Demokrasi Yoluyla Birlik\""
 HOL_unity_through_democracy_desc:0 "'Demokrasi Yoluyla Hollanda Hareketi' ('Eenheid door Democratie') 1935'te kuruldu ve o zamandan beri diğer tüm ideolojilerin demagoglarına karşı açık sözlü bir parlamento dışı ses oldu. Hareketi desteklemek, demokrasimizi savunarak ve hükümetimizi güçlendirerek karşılığında temettü ödeyebilir."
 HOL_unsinkable_aircraft_carriers:0 "Batmaz Uçak Gemileri"
 HOL_unsinkable_aircraft_carriers_desc:0 "Savaşın üçüncü boyutunun ortaya çıkışıyla birlikte filomuz için yeterli hava korumasını sağlamalıyız. Ancak sadece çelikten yapılmış, batabilen uçak gemileri o kadar kararsız bir yatırım ki... Aksine, Doğu Hint Adaları'na yayılan binlerce ada, üzerlerine biraz hava sahaları koysaydık, \"batmaz uçak gemileri\" görevi görebilirdi."
 HOL_volk_en_vaderland:0 "Volk en Vaderland"
 HOL_volk_en_vaderland_desc:0 "Bir komşuyu diğerine tercih etme kararımız, tarafsızlığımızı kesin olarak terk ettiğimiz anlamına gelir. Son kararımızın bir sonucu olarak Alman yanlısı seslerin ve milliyetçi söylemin artması, aşırı sağcı 'Halk ve Vatan' gazetesi gibi iç politikamızda çok dikkat çekici olmaya başlıyor."
 HOL_war_on_pacifism:0 "Pasifizme Savaş"
 HOL_war_on_pacifism_desc:0 "Büyük Savaş'tan bu yana, pasifizm Hollanda halkı arasında yaygınlaşmış ve modern bir ordu kurmayı neredeyse imkansız hale getirmiştir. 'Halkın İradesi' çok uzun süredir gerekli fonların orduya tam olarak tahsis edilmesini engelledi. Kendilerini maruz bıraktıkları tehlikeyi bilmiyorlar... Pasifizme bir savaş ilan edeceğiz ve bu verimsiz duyguyu halkımızın zihinlerinden kovacağız!"
 HOL_war_on_pacifism_tt:0 "Bu kararlar, §YBüyük Savaşın Şok Geçirmiş Seyircisi§!'nin §Gazaltılmasına/kaldırılmasına§! izin verir.\n"
 HOL_wilhelminism:0 "Wilhelminizm"
 HOL_wilhelminism_desc:0 "[Root.GetWilhelminismDesc]"
 HOL_wilhelminism_tt:0 "Periyodik olarak §Y7 Piyade§! ve §Y2 Topçu§! taburları ile §YMühendis§!, §YKeşif§! ve §YTopçu§! Desteği olan birimler üretecek olan §YAlman Sığınmacılar§! Ulusal Ruhu'nu kazanır.\n"
 HOL_zandery_military_airport:0 "Zandery Askeri Havaalanı"
 HOL_zandery_military_airport_desc:0 "Surinam boksitinin ve Curaçao petrolünün Müttefik savaş çabası için önemi nedeniyle, Amerikalılar Curaçao'da bir radar istasyonu kurarak ve Surinam'daki Zandery'de bir havaalanı ve altyapı inşa ederek savunmalarına yardım etmeyi teklif ettiler. Bittiğinde, Güney Amerika'daki en büyük askeri havaalanı olmalıdır."
 MEX_focus_abolish_capital_punishment:0 "İdam Cezasının Kaldırılması"
 MEX_focus_abolish_capital_punishment_desc:0 "Askeri isyan, köylü isyanı ve Cristero Savaşı'nın son istikrarsızlıkları ve hükümetin bunlara ve daha küçük 'suçlara' kanlı tepkisi, Meksika'yı saran bir korku atmosferiyle sonuçlandı. İnsanlar artık devlet tarafından tiranlaştırılma korkusuyla özgürce konuşamıyorlar. İdam cezasını aşamalı olarak kaldırmalıyız. Dizginlerimizi gevşeterek, insanlar artık ondan kaçmak zorunda hissetmeyecekler."
 MEX_focus_aerial_artillery:0 "Hava Topçusu"
 MEX_focus_aerial_artillery_desc:0 "Cristero Savaşı sırasında ve asi generallerin sayısız diğer isyanında 'yumuşak' hedeflere karşı bombardıman uçağı kullanımını denedik. İsyancılar göklere meydan okuyamazlar ve bu nedenle bombardıman desteği Meksika devletini korumak için gerekli olacaktır."
 MEX_focus_agricultural_credit_bank:0 "Tarımsal Kredi Bankası"
 MEX_focus_agricultural_credit_bank_desc:0 "Banco de Crédito Agricola, ejido çiftçilerine makine ve diğer sermaye mallarını satın almaları için kredi vererek toprak reformu programını hızlandırmaya yardımcı olacaktır. Finans sektörünün duayeni Alberto J. Pani, bu bankaya liderlik edebilir ve Meksika'nın üretken kapasitesini genişletmesine yardımcı olabilir."
 MEX_focus_andean_offensive:0 "And Saldırısı"
 MEX_focus_andean_offensive_desc:0 "Artık kendimizi And Dağları'nın kuzeyinde kurduğumuza göre, kaderimiz tropik sıradağların zorlu arazisinden saldırıya devam etmek ve Latin Amerika'nın birleşmesini tamamlamaktır."
 MEX_focus_antidisestablishmentarianism:0 "Laiklik Karşıtlığı"
 MEX_focus_antidisestablishmentarianism_desc:0 "Gerçek İnanç, 'Devrimci' cunta tarafından on yıllardır istismar ediliyor. Kiliseler, manastırlar ve kutsal emanetler resmen devlete aittir ve din adamlarının sürüleriyle ilgilenmek için hükümetten lisans almaları gerekmektedir. Bazı eyaletlerde on binlerce inanan için tek bir rahip bulunmaktadır. Bu şartı kaldıralım ve Kilise'nin tekrar mülk sahibi olmasına izin verelim."
 MEX_focus_army_expansion_programme:0 "Ordu Genişletme Programı"
 MEX_focus_army_expansion_programme_desc:0 "Meksika, Devrim'in ulus inşa etme programının kendi çıkarını düşünen eyaletleri tek bir Anavatan'da birleştirmesiyle orduyu genişletmek için büyük bir kapasiteye sahiptir. Vatansever vatandaşlarımız, zamanlar zorluysa devletin yardımına koşacaktır."
 MEX_focus_arrest_general_cedillo:0 "General Cedillo'yu Tutukla"
 MEX_focus_arrest_general_cedillo_desc:0 "Caudillolar bir tehdittir. Meksika'yı, yetkili atamalarının onlara ekonomi, ordu ve hükümet üzerinde güç verdiği küçük derebeyliklere bölüyorlar. Meksika'nın zenginliğini yağmalıyorlar ve bu, General Saturnino Cedillo'nun eyaletinden daha doğru hiçbir yerde değil. Merkezi hükümetten bağımsızlığı kesinlikle kabul edilemez ve topladığı isyancılar ona fayda sağlamayacaktır."
 MEX_focus_aviation_workshops:0 "Havacılık Atölyeleri"
 MEX_focus_aviation_workshops_desc:0 "TNCA, Devrim'den sonra fon yetersizliği nedeniyle rafa kaldırıldı, ancak o zamandan beri uçakların öldürme gücünün artmasıyla havacılıktaki gelişmelerin zirvesinde kalmalıyız."
 MEX_focus_aztec_eagles:0 "Aztek Kartalları"
 MEX_focus_aztec_eagles_desc:0 "Latin Amerika'nın en etkili uluslarından biriyiz. Yayılmacılıklarıyla genel barışı tehdit eden yabancı savaş kışkırtıcılarına karşı mücadelesinde Amerika'ya yardım ederek dünya güvenliğine olan bağlılığımızı göstermeliyiz."
 MEX_focus_ban_political_militias:0 "Siyasi Milisleri Yasakla"
 MEX_focus_ban_political_militias_desc:0 "Sol ve sağ kanat paramiliterler vatansever olduklarını ve ulusal hainlerle savaştıklarını iddia ediyorlar, ama aslında ülkeyi hain amaçlar için istikrarsızlaştırmak isteyen yabancı güçlerin piyonlarıdırlar. Hükümet faşist ve komünist milisleri bastırmalıdır."
 MEX_focus_blue_water_navy:0 "Açık Deniz Donanması"
 MEX_focus_blue_water_navy_desc:0 "Meksika hiçbir zaman bir deniz gücü olmamıştır. Sömürge zamanlarında, İspanyol efendilerimizin İngilizlerle yüzleşmek için tüm gemilerine ihtiyacı vardı. Bağımsızlık mücadelesi ve onu izleyen iç savaşlar sırasında tüm dikkatimiz içe odaklandı. Amerika bizi geçip Büyük Güç olduktan sonra, denizlere meydan okumaya çalışmanın bir anlamı kalmadı. Ama belki de bu çalkantılı zamanlarda Meksika'nın güçlü bir donanmaya ihtiyacı olacaktır."
 MEX_focus_bolivarian_alliance:0 "Bolivarcı İttifak"
 MEX_focus_bolivarian_alliance_desc:0 "Simón Bolívar, Güney Amerika'daki İspanyol sömürgelerini bağımsızlığa taşıyarak Gran Colombia'yı kurdu. Güney'de, Meksika'daki Miguel Hidalgo ve Mariano Matamoros gibi bağımsızlık savaşçılarıyla aynı saygıyı görüyor. Hayallerinden biri, Latin Amerika uluslarını Avrupalı ve Yanqui emperyalistlerinin sömürüsüne karşı birleştirmekti. Bu hayali gerçekleştirebiliriz."
 MEX_focus_brown_water_navy:0 "Kıyı Donanması"
 MEX_focus_brown_water_navy_desc:0 "Meksika, kıyı yakınlarındaki ticaretimizi korumak için eski, Büyük Savaş öncesi gemilere güveniyor. İspanya ve diğer güçlerden daha modern gemiler satın almaya çalışıyoruz, ancak ilerleme yavaş. Savaşın Avrupa'yı sarması ve Batı Yarımküre'ye yayılması ihtimaline karşı donanma stratejilerimizi geliştirmemiz gerekiyor."
 MEX_focus_capital_reserves:0 "Sermaye Rezervleri"
 MEX_focus_capital_reserves_desc:0 "Petrol satışından elde ettiğimiz nakit para, ekonomik kaslarımızı esnetmemizi sağlıyor. Örneğin Amerika veya İngiltere'den teknoloji satın almamız gerekirse, artık imkanlarımız var. Bu tasarımları uygun gördüğümüz şekilde tersine mühendislik yapabilir veya seri üretebiliriz."
 MEX_focus_catholic_politics:0 "Katolik Siyaseti"
 MEX_focus_catholic_politics_desc:0 "Meksika'daki çoğu siyasi parti, 1911 devriminden sonra iktidara gelen antiklerikaller tarafından domine edildi. Biz Katolikler, yasal olarak iktidarı almak ve elimizde tutmak istiyorsak, dindar Kitlelerin bir partisinin kurulması gerekli olacaktır."
 MEX_focus_caudillo_private_armies:0 "Caudillo Özel Orduları"
 MEX_focus_caudillo_private_armies_desc:0 "Bir bölgedeki valiler, işadamları ve garnizon komutanları aynı kişi olma eğilimindedir - sadık astları nüfuz pozisyonlarına atayarak güç toplayan bir Devrimci general. Bu caudillolar, savaşmamız gereken değil, geliştirmemiz gereken bir hayat gerçeğidir."
 MEX_focus_church_schools:0 "Kilise Okulları"
 MEX_focus_church_schools_desc:0 "Devrimci generaller, okul dedikleri sosyalist yeniden eğitim kamplarında gençliğin beynini yıkamaya çalıştılar. Dini yeniden sınıflara yerleştirmeliyiz, rahipler ve rahibeler çocuklarımızı eğitmeli."
 MEX_focus_cientifico_camarilla:0 "Científico Camarilla"
 MEX_focus_cientifico_camarilla_desc:0 "Díaz rejimi, kabinede ve özel sektörde bir teknokratlar kliği tarafından destekleniyordu. Kurdukları sevilmeyen adam kayırmacılık ve himaye sistemleri, rejimin çökmesinin bir nedeniydi. Ancak, halkın sevgisine ve desteğine sahibiz ve Científicoların çok ihtiyaç duyulan bazı becerileri var..."
 MEX_focus_coastal_defence_plan:0 "Kıyı Savunma Planı"
 MEX_focus_coastal_defence_plan_desc:0 "Amerikalılar 1846'da bize gösterdi ki, kuzeyimizde bize stratejik derinlik veren çöllerimiz ve dağlarımız varken, kıyı kanatlarımız bir amfibi istilasına karşı savunmasızdır. Körfez ve Pasifik limanlarımıza ve şehirlerimize kıyı savunmaları eklemeliyiz."
 MEX_focus_communist_revolution:0 "Komünist Devrim"
 MEX_focus_communist_revolution_desc:0 "Díaz'a karşı devrim, kapitalizmin çelişkilerini mübadele için üretimi kaldırarak ve yeni bir yaşam tarzı getirerek çözecek gerçek bir Sosyal Devrime dönüştü."
 MEX_focus_community_of_nations:0 "Milletler Topluluğu"
 MEX_focus_community_of_nations_desc:0 "İngiliz ticaretine olan ekonomik bağımlılığımızın bir lanet olması gerekmiyor. Statükoyu kabul ederek, bir süper gücün desteğiyle uluslararası diplomasiye girebiliriz."
 MEX_focus_compensation:0 "Tazminat"
 MEX_focus_compensation_desc:0 "Petrol imtiyazları yasal olarak Royal Dutch Shell ve Standard Oil'e satıldı. Yabancı firmaları kar amacı gütmekle suçlayamayız. İmtiyazları millileştirdikleri için yabancılara tazminat ödeyerek hukuk sistemimizin bütünlüğünü korumalıyız."
 MEX_focus_confederation_of_mexican_workers:0 "Meksika İşçi Konfederasyonu"
 MEX_focus_confederation_of_mexican_workers_desc:0 "Meksika'daki siyasi seçkinler her zaman sendika faaliyetlerini kontrol etmeye çalıştılar. CTM, yozlaşmış ve rejimin sevilmeyen geçmiş liderleriyle olan ilişkisi nedeniyle itibarsız görüldüğü için CROM'un yerini alacaktır."
 MEX_focus_control_the_army:0 "Orduyu Kontrol Et"
 MEX_focus_control_the_army_desc:0 "Ordu belki de Meksika'daki en önemli seçmen kitlesidir. Geçtiğimiz yirmi yıl, halkın iradesinin ancak süngülerle uygulanabileceğini göstermiştir. Bu nedenle haydut generaller, devletin meşruiyetini bir kenara bırakın, varlığına bile bir tehdittir."
 MEX_focus_crusade_against_atheism:0 "Ateizme Karşı Haçlı Seferi"
 MEX_focus_crusade_against_atheism_desc:0 "Cristero liderlerinin çoğu 1930'ların başında hükümet tarafından avlanıp öldürüldü. Ancak birkaçı tasfiyelerden kurtuldu ve Meksika'nın Sadıklarını bir kez daha yönetmeye hazır. Yaşasın Kral Mesih ve Kutsal Guadalupe Meryemi!"
 MEX_focus_depoliticised_army:0 "Siyasetten Arındırılmış Ordu"
 MEX_focus_depoliticised_army_desc:0 "Generallerin askerlerinin sadakatine hakkı yoktur. Meşruiyetin nihai kaynağı Meksika devletidir. Patronaj ağları kuramamaları veya askerlerinin kişisel sadakatini sağlayamamaları için generalleri eyaletler arasında rotasyona tabi tutarak isyan düşüncelerini engellemeliyiz."
 MEX_focus_ejido_worker_militias:0 "Ejido İşçi Milisleri"
 MEX_focus_ejido_worker_militias_desc:0 "1917 Anayasası'nda vaat edilen toprak reformu yavaş ilerleme kaydetti. Çoğu zaman, ev sahipleri yeniden dağıtımı önlemek için kiracılarını sindirmek için haydutlar ve özel ordular kullanır. Adaletsizliğe karşı elde ettiğimiz kazanımları korumak için köylüleri, çiftçileri ve işçileri komünal milisler halinde örgütleyelim."
 MEX_focus_end_land_reform:0 "Toprak Reformunu Sonlandır"
 MEX_focus_end_land_reform_desc:0 "Toprak reformu programı, siyasi bağlantıları veya askeri gücü olan yerel zorbalar tarafından uzun süredir kötüye kullanılıyor. Kamu arazisini kendi kazancı için çalan zengin bir çiftçi, Meksika'yı daha güçlü veya daha birleşik yapmaya yardımcı olmaz. Bu arazi bunun yerine en yüksek teklifi verene satılmalıdır. Belki bazı ev sahipleri kiracılarını taciz ediyor, ama bu mahkemelerin meselesidir."
 MEX_focus_enforce_the_calles_law:0 "Calles Yasasını Uygula"
 MEX_focus_enforce_the_calles_law_desc:0 "Cristero piyadeleri sahada yok edilmemiş olabilir, ancak beyhude isyanlarını takip eden yıllarda, Kilise içindeki kalan liderlerini ve sempatizanlarını avladık, hareketlerinin başını kestik ve yeniden dirilmemelerini sağladık. Kilisenin onlara karşı taleplerimizi kabul etmekten başka seçeneği yok. Ya devlet gücünün başka bir aracı olacaklar ya da biz onların başını kesmeye devam edeceğiz."
 MEX_focus_engineering_school:0 "Mühendislik Okulu"
 MEX_focus_engineering_school_desc:0 "Mexico City'deki Ulusal Politeknik Enstitüsü'nün bir parçası olan Escuela Superior de Ingenería Mecánica y Eléctrica, mekanik ve elektronik mühendisliğinde yeni nesil öncüler yetiştiriyor."
 MEX_focus_exile_calles:0 "Calles'i Sürgün Et"
 MEX_focus_exile_calles_desc:0 "Eski başkan Plutarco Calles, 1924 ve 1928 yılları arasında görev yaptı. Kötü yönetimi Cristero Savaşı'nı ve sayısız küçük isyanı kışkırttı. Şimdi, son birkaç kukla başkanı kontrol ettiği gibi Başkan Cárdenas'a da hükmetmeye çalışıyor. Cárdenas'ın kendi demokratik yetkisi, gelecek için kendi planı var ve Calles'in Meksika'nın istikrarı adına gitmesi gerekiyor."
 MEX_focus_falangist_veterans:0 "Falanjist Gaziler"
 MEX_focus_falangist_veterans_desc:0 "Falanjistler, İspanya'daki faşist paramiliterlerin bir örgütüdür. Tanrı ve Millet için savaşıyorlar, ancak birçoğunun monarşist olması üzücü. Yine de, İspanya İç Savaşı'nın Falanjist gazileriyle temas kurmalı ve deneyimlerinden öğrenmeliyiz."
 MEX_focus_fortify_the_canal:0 "Kanalı Güçlendir"
 MEX_focus_fortify_the_canal_desc:0 "Panama Kanalı nihayet elimize geçtiğine göre, geçilmez bir kale haline gelmesi için kilitlerini ve kıyılarını güvence altına almalıyız."
 MEX_focus_german_resource_exchange:0 "Alman Kaynak Değişimi"
 MEX_focus_german_resource_exchange_desc:0 "Alman savaş makinesi yeniden çalışmaya başlıyor ve düzgün çalışması için Meksika petrolüne ihtiyacı var. Amerikalıların önünde diz çökmek veya ülkemizi Ruslara satmak yerine, askeri gücümüzü geliştirmek için Almanların petrole olan ihtiyacından yararlanmaya çalışabiliriz."
 MEX_focus_gulf_coast_naval_yards:0 "Körfez Kıyısı Tersaneleri"
 MEX_focus_gulf_coast_naval_yards_desc:0 "Körfez Kıyımız, ana ticaret ortaklarımız olan Avrupa ve Amerika Birleşik Devletleri'nin Doğu Kıyısı'na bakmaktadır. Büyüyen petrol endüstrimiz, Veracruz'daki tersanelerin genişletilmesiyle iyi bir hizmet görecektir."
 MEX_focus_heavy_artillery:0 "Ağır Topçu"
 MEX_focus_heavy_artillery_desc:0 "Saha topçusunun öldürme gücü yadsınamaz. Büyük Savaş, dünyaya topçunun ilerlemeleri desteklemek ve düşman saldırılarını kırmak için ne kadar gerekli olduğunu gösterdi. Konvansiyonel topçumuzu geliştirmeliyiz."
 MEX_focus_heroic_military_college:0 "Kahraman Askeri Koleji"
 MEX_focus_heroic_military_college_desc:0 "Colegio Militar 1823'te kuruldu ve 1847 Meksika-Amerika savaşı sırasında beş öğrencisinin Amerikan Deniz Piyadelerine karşı ölümüne savaşmasının ardından Heroico (Kahraman) unvanını aldı. Altıncı bir öğrenci ise Meksika bayrağına sarılıp esir düşmemek için kendini surlardan aşağı attı."
 MEX_focus_hispanic_alliance:0 "Hispanik İttifakı"
 MEX_focus_hispanic_alliance_desc:0 "Yöneticilerimiz, Yeni Dünya'ya medeniyet getiren sömürgeciler olan peninsulares'ten gelmektedir. Güçlü Kilise gücü ve toprak sahibi seçkinler geleneğiyle İspanya, bir zamanlar bir meşruiyet kaynağıydı. Bugünlerde İspanya, Latin dünyasının lideri gibi giderek daha az görünüyor. Bu mantoyu kendimiz üstlenmeli ve Hispanikliğimizi yapı taşı olarak kullanarak kıta genelinde daha güçlü bağlar kurmalıyız."
 MEX_focus_hispanic_culture:0 "Hispanik Kültür"
 MEX_focus_hispanic_culture_desc:0 "Latin Amerika ulusları, fetih ve hayatta kalma, isyan ve katı yönetimden dövülmüş güçlü bir kültüre sahiptir. Ortak kültürümüz bir gurur kaynağı ve gelecekteki ilerlememiz için yol gösterici bir ışıktır."
 MEX_focus_institutional_revolution:0 "Kurumsal Devrim"
 MEX_focus_institutional_revolution_desc:0 "Meksika'da demokrasi mirası zayıftır, ancak onu güçlendirdik. Hukukun üstünlüğüne olan bağlılığımız ilerliyor ve halk, geçmişte hükümet tarafından manipüle edilen seçimlerimize güvenmeye başlıyor."
 MEX_focus_integrate_the_caribbean:0 "Karayipleri Entegre Et"
 MEX_focus_integrate_the_caribbean_desc:0 "Karayiplerin küçük cumhuriyetleri Meksika devletine dahil ediliyor ve şimdi sıra Karayipler halklarında. Geleneklerimizi sürdürdükçe ve karşılığında Meksika ulusu topluluğunun bir parçası olmanın faydalarını aldıkça sadık Meksika vatandaşları olacaklar."
 MEX_focus_integrate_the_south:0 "Güney'i Entegre Et"
 MEX_focus_integrate_the_south_desc:0 "Meksika halklarının birliği yavaş bir süreç oldu, ancak bölgesel sınırlarda veya dağ sıralarında durmayacak. Geçmişte bu tür engelleri aştık ve Güney eyaletleri için bunu tekrar yapacağız."
 MEX_focus_interior_defence_plan:0 "İç Savunma Planı"
 MEX_focus_interior_defence_plan_desc:0 "Yankilerin bize karşı sayısal ve teknolojik bir avantaja sahip olduğu doğru, ancak arazi bilgimiz, halktan desteğimiz ve güçlü bir savunma kurmak için zamanımız ve alanımız var. Vur-kaç taktikleri, derinlemesine savunma ve gizli güçlü noktalar kullanarak düşmanı çöllerde ve dağlarda kanatacağız."
 MEX_focus_international_peacekeepers:0 "Uluslararası Barış Gücü"
 MEX_focus_international_peacekeepers_desc:0 "Dünyanın demokratik güçleri, uluslararası güvenliği sağlamak için dünya ülkelerine farklılıklarını uzlaştırmaları ve anlaşmazlıklara arabuluculuk yapmaları için bir yer vererek, eşitlerden oluşan bir ittifak, bir Birleşmiş Milletler yaratmayı planlıyor. Latin Amerika uluslarının bağımsızlıklarını korumalarına yardımcı olmak için kendimizi böyle bir projeye atacağız."
 MEX_focus_international_proletarianism:0 "Uluslararası Proletaryacılık"
 MEX_focus_international_proletarianism_desc:0 "Sovyetler, sosyalizmlerinin gezegeni dönüştüreceğini gösterdi. Uğruna çok zorlu savaştığımız Devrim, insanları özgürleştirme yolunda sadece bir adımdı: önce Meksika'nın, şimdi de tüm dünyanın."
 MEX_focus_international_struggle:0 "Uluslararası Mücadele"
 MEX_focus_international_struggle_desc:0 "İdeolojik düşmanlarımıza karşı mücadelemizde yalnız değiliz. Yurtdışında bağlantı kurabileceğimiz birçok potansiyel müttefikimiz var. İktidarı ele geçirmelerine yardımcı olmalıyız ki, bize yardım edecek geniş bir potansiyel müttefikler bloğu oluşturalım."
 MEX_focus_invite_brazil:0 "Brezilya'yı Davet Et"
 MEX_focus_invite_brazil_desc:0 "Eski bir Portekiz sömürgesi olarak Brezilya'nın tarihi Meksika'nınkini tam olarak yansıtmasa da, kültürel olarak hala bize intikamcı Avrupalı emperyalistlerden veya açgözlü Yanqui iş adamlarından daha yakınlar. Karşılıklı korumadan faydalanmak için onları etki alanımıza daha yakın getirmeliyiz."
 MEX_focus_jefe_maximo:0 "Jefe Máximo"
 MEX_focus_jefe_maximo_desc:0 "Plutarco Calles ülkedeki etkisini kaybederse Meksika daha da derin bir kaosa sürüklenecek. Portes, Ortiz, Rodríguez ve şimdi de Cárdenas yönetimlerini o yarattı ve siyasi düşmanları onu 'el Jefe Maximo' olarak, sanki bir haydut reisi gibi eleştiriyor! Aslında, Calles sadece Meksika için en iyi niyetlere sahip yaşlı bir devlet adamıdır. Devrimin bu aşamasında onu kaybetmek bir travesti olurdu."
 MEX_focus_knights_of_columbus:0 "Kolomb Şövalyeleri"
 MEX_focus_knights_of_columbus_desc:0 "Cristero Savaşı sırasında, her iki tarafta da suistimaller işlenirken, uluslararası Kolomb Şövalyeleri kardeşliği bize yardım etmek için müdahale etti. Başlangıçta Cristeroları finanse etmek ve silahlandırmak için gizlice bağış topladılar. Meksikalı piskoposlar isyanı reddettikten sonra, Şövalyeler Amerikan hükümetine lobi yaparak savaşı nihayetinde sona erdiren müzakerelere ev sahipliği yapmasını sağladılar."
 MEX_focus_law_on_industrial_promotion:0 "Sanayi Teşvik Yasası"
 MEX_focus_law_on_industrial_promotion_desc:0 "Meksika eyaletleri ve federal hükümet, uzun yıllardır vergi muafiyetleri yoluyla yeni endüstrilerin gelişimini teşvik etmeye çalıştı. Çoğu zaman, yerel düzenlemeler, sermayeyi önemsiz veya verimsiz alanlara yönlendirerek ulusal çıkarlara aykırı çalışır. Sanayi gelişimine yaklaşımımızı merkezi bir planla rasyonelleştirmemiz gerekiyor."
 MEX_focus_legacy_of_revolution:0 "Devrim Mirası"
 MEX_focus_legacy_of_revolution_desc:0 "Devrimin kazanımları savunulmalı ve ulusal hainler kökünden sökülmelidir. Generaller bu mücadelenin ön saflarında yer almaktadır. Hükümetin her gün sahada karşılaştığı zorlukları görüyorlar. Onlara devletin egemenliğini uygulamada daha fazla takdir yetkisi vermeliyiz."
 MEX_focus_legion_of_christ:0 "Mesih Lejyonu"
 MEX_focus_legion_of_christ_desc:0 "'Devrimin' yanlışlarını, Mesih'in ajanlarına yakışır yorulmaz bir ruhla düzeltiyoruz, ama daha yeni başladık. Kutsal Kilise'ye saldıran suçluları bulup cezalandırmak için bir organizasyona ihtiyacımız var. Çıkış Kitabı'nda yazdığı gibi: göze göz, cana can."
 MEX_focus_liberalize_the_banking_sector:0 "Bankacılık Sektörünü Serbestleştir"
 MEX_focus_liberalize_the_banking_sector_desc:0 "Piyasanın Meksika'yı dönüştürmesini engelleyen birçok ağır devlet politikası var. Örneğin 1925 Genel Kredi Kurumları Yasası, bankaların diğer bankalarda hisse sahibi olmasını engelliyor. Saçmalık! Piyasa ne kadar özgür olursa, insanlar o kadar özgür olur. Avusturya Ekonomi Okulu'nun bir savunucusu olan Luis Montes de Oca, bankacılık sistemini reforme etmemize yardımcı olacak."
 MEX_focus_liberate_the_antilles:0 "Antilleri Özgürleştir"
 MEX_focus_liberate_the_antilles_desc:0 "Birçok Karayip adası, Amerika'nın keşfinden bu yana sürekli olan baskıcı sömürülerine devam eden emperyalist güçler tarafından hala işgal altındadır. Sömürgeciliğin adaletsizliğine sonsuza dek son vereceğiz!"
 MEX_focus_liberate_the_caribbean:0 "Karayipleri Özgürleştir"
 MEX_focus_liberate_the_caribbean_desc:0 "Latin Amerika'nın geri kalanı gibi, Karayip devletleri de prangalarını atmadan önce Avrupalı emperyalistler tarafından acımasızca sömürüldü. Hala zayıf olsalar da, bu devletler korumamızı hak ediyor. Meksika'nın ulusal gururu, emperyalistler tarafından sömürülmesini önlemek için Karayipleri güvence altına almamızı gerektiriyor!"
 MEX_focus_liberty_and_justice_for_all:0 "Herkes İçin Özgürlük ve Adalet"
 MEX_focus_liberty_and_justice_for_all_desc:0 "Amerikalılar şimdi tarihin en büyük ekonomik gücü. Sovyetler hızla sanayileşiyor olabilir ve Almanlar savaşı daha iyi anlıyor olabilir, ancak Amerika'nın avantajları, birey için özgürlük konusundaki ısrarı ve kaba kuvvet yerine kurumlara olan güveni ile tamamlanıyor. Ekonomik bağlarımızı askeri bir ittifaka genişletmek doğal olacaktır."
 MEX_focus_march_southwards:0 "Güneye Yürüyüş"
 MEX_focus_march_southwards_desc:0 "Meksika, bağımsızlık mücadelesinden sonra güneyindeki eyaletleri kaybetti. Beceriksiz Meksika İmparatorluğu tarihimizde bir lekeydi, ancak hatalarını düzeltebiliriz. Güney eyaletleri savunmamız için kritik öneme sahiptir ve onları geri alacağız."
 MEX_focus_military_aviation_specialists:0 "Askeri Havacılık Uzmanları"
 MEX_focus_military_aviation_specialists_desc:0 "Escuela Militar de Mecánicos Especialistas de Aviación, uçaklarımıza hizmet vermek için yetenekli teknik personelden oluşan bir kolordu eğitecek. Uçaklar ne kadar iyi bakılırsa, pilotların deneyim kazanmak için havada o kadar uzun süreleri olur."
 MEX_focus_military_budget_review:0 "Askeri Bütçe Değerlendirmesi"
 MEX_focus_military_budget_review_desc:0 "Díaz rejiminin iyi finanse edilen ordusu, Devrimci milisler şehirleri özgürleştirmeye ve onları finansmandan kesmeye başladığında çöktü. Savaş zamanlarında uzun ömürlü olmasını sağlamak için ordunun mali durumunu gözden geçirelim."
 MEX_focus_nafinsa:0 "NAFINSA"
 MEX_focus_nafinsa_desc:0 "Nacional Financiera, Meksika'nın sanayileşmesini teşvik etmek için kurulmuş bir kalkınma bankasıdır. Özellikle Mexico City'deki kimya tesisleri ve metal işleri gibi orta Meksika eyaletlerinde yeni fabrikaların kurulmasında önemli olmuştur."
 MEX_focus_national_bank:0 "Ulusal Banka"
 MEX_focus_national_bank_desc:0 "İç savaşla sarsılan bir ekonomiyi yeniden inşa etmek için 1925'te kurulan Banco de México, son çare borç vericimiz, para birimi ihraççımız ve devletin çıkarına yönelik her türlü girişimin yatırımcısıdır."
 MEX_focus_nationalize_the_oil_fields:0 "Petrol Sahalarını Millileştir"
 MEX_focus_nationalize_the_oil_fields_desc:0 "Yabancı petrol imtiyazları Meksika ekonomisine hakim oluyor ve hem iç hem de dış işlerimiz üzerinde çok fazla nüfuz sahibi. İngilizler ve Amerikalılar, hükümetimizden çok Royal Dutch Shell ve Standard Oil'e daha fazla dikkat ediyor!"
 MEX_focus_new_world_order:0 "Yeni Dünya Düzeni"
 MEX_focus_new_world_order_desc:0 "Almanlar açıkça Avrupa'nın efendileridir. İngilizlere ve Amerikalılara karşı onlara yardım edersek, Yeni Dünya Düzenlerinde kesinlikle bir yerimiz olacaktır. Eski Zimmermann Telgrafı bir nedenle gönderilmişti: Amerika ancak bir kara istilasıyla yok edilebilir..."
 MEX_focus_northern_steel_plants:0 "Kuzey Çelik Fabrikaları"
 MEX_focus_northern_steel_plants_desc:0 "Başkent dışındaki Meksika'nın en sanayileşmiş bölgesi, Amerika sınırındaki kuzey bölgesidir. Matamoros ve Ciudad Juarez gibi Rio Grande boyunca uzanan şehirler, Brownsville ve El Paso gibi sınırın diğer tarafındaki mevkidaşlarıyla yakın ekonomik bağlara sahiptir. Ağır sanayilerimizi daha da geliştirmek için bölgedeki üstün altyapıdan yararlanmalıyız."
 MEX_focus_oil_field_expansion:0 "Petrol Sahası Genişletme"
 MEX_focus_oil_field_expansion_desc:0 "Amerika'nın petrol ihtiyacı doymak bilmez. Dünyadaki petrolün çoğunluğunu üretmelerine rağmen, bu kaynağı da ithal ediyorlar. Meksika, Körfez Kıyısı boyunca ihracat için yararlanabileceğimiz gelişmemiş petrol sahalarına sahiptir."
 MEX_focus_oil_revenue_reinvestment:0 "Petrol Gelirlerinin Yeniden Yatırımı"
 MEX_focus_oil_revenue_reinvestment_desc:0 "Artık petrol satışından daha fazla fayda sağladığımız için bütçemiz hızla arttı ve bu yeni fonları faydalı bir şekilde kullanmayı planlamalıyız. Uzun vadede bundan faydalanmak için, bu gelirlerin ekonomik canlanmaya yeniden yatırılması en bariz seçenek gibi görünüyor."
 MEX_focus_one_world_government:0 "Tek Dünya Hükümeti"
 MEX_focus_one_world_government_desc:0 "Stalin'in tiranlığı ortadan kaldırıldığına göre, destekçilerinden bazılarını özeleştiri yapmaya ve gerici baskıdan gerçekten kurtulmuş uluslar topluluğuna katılmaya ikna edebiliriz."
 MEX_focus_oppose_yanqui_imperialism:0 "Yanqui Emperyalizmine Karşı Çık"
 MEX_focus_oppose_yanqui_imperialism_desc:0 "Ülkemizin doğal kaynaklarını haklı olarak geri aldıktan sonra, yabancılar şimdi tazminat için yaygara koparıyorlar, ancak imtiyazlar esasen diktatör Díaz yönetimindeki zayıflık dönemlerinde Meksika halkından çalınmıştı. Çalınan malı iade ettiği için bir hırsıza neden ödeme yapalım?"
 MEX_focus_pacific_coast_naval_yards:0 "Pasifik Kıyısı Tersaneleri"
 MEX_focus_pacific_coast_naval_yards_desc:0 "Japonya ve Kaliforniya ile Pasifik üzerinden yapılan ticaret, bizim için Atlantik kadar önemli değil, ancak çıkarlarımızı korumalı ve daha fazla olasılık yaratmalıyız. Pasifik tersanelerini genişletmek, Körfez'in abluka altına alınması durumunda bize daha fazla manevra alanı sağlar."
 MEX_focus_party_of_the_revolution:0 "Devrim Partisi"
 MEX_focus_party_of_the_revolution_desc:0 "Başkan Cárdenas, işçi ve köylü örgütlerinin desteği sayesinde bir tarım reformu platformunda seçildi. Reformları uyguladık ve şimdi uluslararası sahnede adaletsizlikle savaşmaya hazır gururlu bir sosyalist ulusumuz var."
 MEX_focus_peripheral_infrastructure:0 "Çevresel Altyapı"
 MEX_focus_peripheral_infrastructure_desc:0 "En kırsal bölgelerimiz, altyapılarında on yıllardır çok az iyileşme gördü. Yol sistemlerimizi genişletirsek fabrika işçiliğine ve eğitime açık hale gelecek yoksulluk içindeki geçimlik çiftçi kitleleri var."
 MEX_focus_plan_of_agua_prieta:0 "Agua Prieta Planı"
 MEX_focus_plan_of_agua_prieta_desc:0 "Díaz'a karşı Devrim ve sonrasındaki şiddetli iç çatışmalar on yıl sürdü. Toz duman dağıldığında, muzaffer Kuzeyli generaller Meksika'nın geleceği için planlarını ortaya koymak üzere Sonora, Agua Prieta'da bir araya geldiler. Onlar popülist bir modernleştiriciler ve laikleştiriciler kliği ya da kişinin bakış açısına göre, ganimetlerini bölen haydut beylerinden biraz daha iyi bir 'cacique'ler konfederasyonudur."
 MEX_focus_privatization:0 "Özelleştirme"
 MEX_focus_privatization_desc:0 "Ejido sistemi, hükümetin amaçladığı kullanıma bağlı olarak arazinin kullanımına kısıtlamalar getirir. Devlet neden çiftçileri ihracat için nakit ürün yetiştirmek yerine geçimlik tarıma zorlasın? Komünal çiftlikleri dağıtır ve gerçek kalkınmanın gerçekleşmesine izin verirsek Meksika'yı daha zengin yapabiliriz. Eskimiş kendi kendine yeterlilik kavramları sadece ilerlemenin ve küreselleşmenin önünde duruyor."
 MEX_focus_professional_army:0 "Escuela Superior de Guerra"
 MEX_focus_professional_army_desc:0 "Sahadaki birlikleri ikmal etmek için geçici soldaderalara güvenemeyiz, ikmal depolarına ve bir lojistik kolordusuna ihtiyacımız var. Askeri Okul'da ordu şeflerimiz ve subaylarımız, verimli tedarik sistemleri geliştirmelerini sağlayacak ileri askeri bilgi edineceklerdir. \nBu noktada, eşekler bile birlikleri kendi başlarına erzak aramaya bırakmaktan daha iyi bir gelişme olacaktır."
 MEX_focus_propaganda_pact:0 "Propaganda Paktı"
 MEX_focus_propaganda_pact_desc:0 "Komünizm tehdidi, sadık Hispanik vatanseverlerin zihinlerinde her zamankinden daha büyük bir şekilde beliriyor. Yeni keşfedilen müttefiklerimizle, sinsi Bolşevik tehdidine karşı bir süngü duvarı sunacağız. Meksika halkına nefret edilen düşmana karşı mutlak zaferin kesinliğini güvence altına almak için birliğimizi ve kardeşliğimizi sergileyelim!"
 MEX_focus_purchase_belize:0 "Belize'i Satın Al"
 MEX_focus_purchase_belize_desc:0 "Bu küçük toprak parçası, sömürge zamanlarında İspanyol tacı tarafından uzun süre talep edildi, ancak hiçbir zaman yarımadalılar tarafından yerleşilmedi. Napolyon Savaşları sırasında İspanya'nın sömürge imparatorluğunu kaybetmesinden sonra, İngiltere bölgedeki hakimiyetini yavaş yavaş sağlamlaştırdı ve bu, 1862'de İngiliz Hondurası kolonisinin kurulmasıyla sonuçlandı. Bölge, iyi niyet göstergesi olarak Meksika'ya devredilmelidir."
 MEX_focus_purge_the_bureaucracy:0 "Bürokrasiyi Tasfiye Et"
 MEX_focus_purge_the_bureaucracy_desc:0 "Callistalar, hak etmedikleri nüfuz konumlarından uzaklaştırılıyor. Aklımızda birçok uygun yedek var, Meksika'ya hizmet etme fırsatı için minnettar olacak yetenekli ve zeki adamlar..."
 MEX_focus_push_past_the_darien_gap:0 "Darién Geçidi'ni Aş"
 MEX_focus_push_past_the_darien_gap_desc:0 "Orta Amerika birleşme seferimizden sonra, Güney Amerika'ya ayak basmak için Panama ile Kolombiya arasındaki 'Darién Geçidi' olarak bilinen ormanı geçmeliyiz."
 MEX_focus_raiding_navy:0 "Akıncı Donanma"
 MEX_focus_raiding_navy_desc:0 "Dünyanın büyük deniz güçleriyle zırhlılara ve uçak gemilerine karşı yüzeyde rekabet etmeyi umamayız. Bunun yerine, Meksika'yı istiladan korumak için düşman asker nakliye gemilerini varmadan önce durdurmaya çalışmalıyız."
 MEX_focus_realpolitik:0 "Realpolitik"
 MEX_focus_realpolitik_desc:0 "İdeolojik inançlarımız var, ama bir devlet olarak Meksika'nın uluslararası mücadeleden ayrı kendi çıkarları var. Önümüzdeki çalkantılı zamanlarda dikkatli bir yol izlememiz gerekiyor. Bir yanlış hareket, müstakbel emperyalistlerin ve tiranların tüm ağırlığını başımıza indirebilir."
 MEX_focus_redeem_aztlan:0 "Aztlan'ı Kurtar"
 MEX_focus_redeem_aztlan_desc:0 "Amerika Birleşik Devletleri'nin kurtarılmış bölgelerinde yaşayan Meksika halkının, ataları, doğum yerleri veya evde konuştukları dil nedeniyle kendilerine zulmetmeyen bir hükümet hayali var. Bu hayal gerçek oldu."
 MEX_focus_reform_the_cristero_guard:0 "Cristero Muhafızlarını Reforme Et"
 MEX_focus_reform_the_cristero_guard_desc:0 "Cristerolar, Kilise'yi zalim Calles'in zulmünden yiğitçe savundular ve birçoğu Mesih'in sancağı altında şehit olarak öldü. Şimdi Kutsal Kilise'nin gücü yeniden tesis edildiğine göre, Mesih'in silahlı koruyucuları olmak için yeniden organize edilmelidirler."
 MEX_focus_rent_freeze:0 "Kira Dondurma"
 MEX_focus_rent_freeze_desc:0 "Şehirli işçiler, inşa ettiğimiz yeni Meksika'da kilit bir bileşendir. Devrim sırasında Kızıl Taburlar halinde seferber edildiler ve şimdi kendilerine vaat edilen tazminatı arıyorlar. Acil endişe alanlarından biri, bu çalışkan servet yaratıcılarından kira alan asalak ev sahipleri olmalıdır."
 MEX_focus_repeal_the_calles_law:0 "Calles Yasasını Yürürlükten Kaldır"
 MEX_focus_repeal_the_calles_law_desc:0 "Calles, Anayasa'nın din karşıtı maddelerini ağır bir şekilde uygulayarak Cristeroları isyana teşvik etti. Calles Yasası, din adamlarının kamuya açık yerlerde ruhban kıyafeti giymesini yasaklayarak ve hükümeti eleştiren dini figürleri hapse atarak din adamlarını küçük düşürüyor. Kilisenin siyasi etkisinin kısıtlanması gerektiği konusunda hemfikiriz, ancak bunlar Kilise gücüne değil, bireysel özgürlüğe yönelik saldırılardır."
 MEX_focus_rescind_the_mexican_cession:0 "Meksika Feragatını İptal Et"
 MEX_focus_rescind_the_mexican_cession_desc:0 "1848'de Kuzeyli saldırganımıza kaybedilen geniş topraklar, bazı Meksikalı milliyetçileri cezbetmeye devam ediyor. Şimdi Amerika Birleşik Devletleri'nde milyonlarca Hispanik insan yaşıyor, bazıları orijinal Meksikalı sakinlerin torunları, diğerleri ise daha yeni göçmenler. Yanqui saldırganlarını ezerek ve Meksika halkını birleştirerek Meksika'nın onurunu kurtarmalıyız!"
 MEX_focus_revanchist_revolution:0 "Rövanşist Devrim"
 MEX_focus_revanchist_revolution_desc:0 "Meksika halkı uzun süre Yanqui saldırganlığı ve komünist sızması tarafından istismar edildi, ancak bu ulusal birlik engellerini aştık ve güçlü bir liderle güçlü bir devlet kurduk. Şimdi Meksika'nın geçmişte maruz kaldığı yanlışları düzeltmeliyiz."
 MEX_focus_revolutionary_class_war:0 "Devrimci Sınıf Savaşı"
 MEX_focus_revolutionary_class_war_desc:0 "Ancak bir sınıf ordusu olarak silahlanmış ve örgütlenmiş Proletarya, Devrimin ideallerini savunabilir ve yayabilir."
 MEX_focus_revolutionary_women:0 "Devrimci Kadınlar"
 MEX_focus_revolutionary_women_desc:0 "Geleneksel olarak ev işleriyle ilişkilendirilen kadınlar, Meksika'da on yıllardır endüstriyel işlerde de çalıştılar. Tütün, kahve ve giyim endüstrileri kadınların çoğunluğunu işe alma eğilimindedir, ancak bu erkek egemen sendika hareketiyle sürtüşmeye neden olmuştur. Erkekler zaten eşit işe eşit ücret ve asgari ücret hakkına sahiptir - bu hakkı kadınlar için de uygulamalıyız."
 MEX_focus_rewrite_the_constitution:0 "1917 Anayasasını Yeniden Yaz"
 MEX_focus_rewrite_the_constitution_desc:0 "Kötü niyetli generaller tarafından yazılan Anayasa, devleti Kilise'nin üstüne koyuyor, evliliği medeni bir eylem haline getiriyor, din adamlarının siyasi adayları desteklemesini engelliyor ve Katolik Kilisesi'ni Meksika'da ahlaki otorite kaynağı olarak tanımayı reddediyor. Katolik İnancını resmen devlet dini olarak kurarak bu tutarsızlıkları ele almalıyız."
 MEX_focus_royal_dutch_shell:0 "Royal Dutch Shell"
 MEX_focus_royal_dutch_shell_desc:0 "Royal Dutch Shell, Meksika petrol imtiyazlarının %60'ını elinde bulunduran bir İngiliz ve Hollanda firmasıdır. İşçi anlaşmazlıkları konusunda yabancı petrol şirketleriyle uzlaşarak, her ikimiz için de faydalı olan bir anlaşmaya varabiliriz."
 MEX_focus_rural_infrastructure:0 "Kırsal Altyapı"
 MEX_focus_rural_infrastructure_desc:0 "Meksika'daki demiryolu sistemleri Díaz döneminde genişletildi, ancak çoğunlukla Amerika ile ticareti kolaylaştırmak için Kuzey şehirlerinde yoğunlaştı. Demiryollarını daha güneye itmeliyiz."
 MEX_focus_rural_schools:0 "Köy Okulları"
 MEX_focus_rural_schools_desc:0 "Okullar, okuma yazma bilmeyen köylülerin ham maddesini adaletsizlikle savaşmaya ve Anavatan'ı güçlendirmeye istekli vatansever vatandaşlara dönüştürdüğümüz yerlerdir. Escuelas Regionales Campesinas köylüleri devrimcileştirecek, onlara teknik beceriler öğretecek ve onları kendi kendine yeterli hale getirecektir."
 MEX_focus_seize_the_panama_canal:0 "Panama Kanalı'nı Ele Geçir"
 MEX_focus_seize_the_panama_canal_desc:0 "Dünyanın en kritik geçiş noktalarından biri olan bu kanal, sanayicilerin karı için Amerikan kırbaçları altında kanını döken ve ölen Latin işçilere büyük bir bedelle kazıldı. Çevredeki araziyi ele geçirdikten sonra, küçük kanal garnizonuna bir yıldırım saldırısı başlatabilir, Yankileri bize karşı kanlı bir savaş yürütmek veya kanalın kontrolünü devretmek arasında seçim yapmaya zorlayabiliriz."
 MEX_focus_smash_the_bureaucrats:0 "Bürokratları Ez"
 MEX_focus_smash_the_bureaucrats_desc:0 "Lenin'in ölümünden sonra, Stalin liderliğindeki yozlaşmış bir bürokrasi, iktidarı emekçilerden çalarak Bonapartist bir rejim kurdu. Bu nedenle SSCB, Devrimin ideallerini saptıran dejenere bir işçi devletine dönüştü."
 MEX_focus_social_catholicism:0 "Sosyal Katoliklik"
 MEX_focus_social_catholicism_desc:0 "1900'lerin başlarından kalma bir siyasi din doktrini olan Sosyal Katoliklik, yoksulluğun nedenlerine saldırarak yoksulların yükünü hafifletmeye vurgu yapar. Sınırsız sanayi kapitalizminin neden olduğu adaletsizliklerin Kilise'den tutarlı bir yanıt alması gerekiyor ve Meksika'nın ilerici din adamları bunu çözmek için ellerinden geleni yapacaklar."
 MEX_focus_soldaderas:0 "Soldaderas"
 MEX_focus_soldaderas_desc:0 "Devrimin ikonik bir parçası olan kadın askerler, erat içinde savaştılar ve bazıları astsubay pozisyonlarına terfi ettirildi. Özellikle yetersiz donanımlı Devrimci orduların lojistiği için önemliydiler."
 MEX_focus_spanish_civil_war_refugees:0 "İspanya İç Savaşı Mültecileri"
 MEX_focus_spanish_civil_war_refugees_desc:0 "İspanya'yı saran yangın on binlerce İspanyol vatandaşını yerinden ediyor. Birçoğu İspanyol aydınlarının kreması veya başka bir şekilde yüksek vasıflı teknik personeldir. Onlara sığınma hakkı tanıyarak hem insani görevlerimizi yerine getireceğiz hem de Meksika'ya fayda sağlayacağız."
 MEX_focus_state_education:0 "Devlet Eğitimi"
 MEX_focus_state_education_desc:0 "Meksika'da sosyalist eğitim, Papa'nın dogmalarına ve diktalarına bağlılıktan ziyade rasyonalizm ve vatanseverliğe odaklanmak anlamına gelir. Sadece bir nesil Meksikalı gence iyi bir Kilise karşıtı eğitim vermemiz gerekiyor ve onların halk desteği bir gecede yok olacak. İnsanlar farklı bir dünyanın mümkün olduğunu bildiklerinde asalak din adamlarına müsamaha göstermeyeceklerdir."
 MEX_focus_strike_breaking:0 "Grev Kırma"
 MEX_focus_strike_breaking_desc:0 "Sendikalaşma, 1917 Anayasası ile korunan temel bir haktır, ancak mülkiyete yönelik saldırılar suçtur ve öyle muamele görmelidir. Kritik bir endüstriden işgücünü çekmek, bir kriz zamanında vatana ihanet olarak bile algılanabilir."
 MEX_focus_support_general_cedillo:0 "General Cedillo'yu Destekle"
 MEX_focus_support_general_cedillo_desc:0 "Kuzeyli General Saturnino Cedillo ve onun gibi diğer caudilloların özerkliklerine hükümet tarafından saygı gösterileceğine dair güvencelere ihtiyacı var. Başkanlar Calles ve Cárdenas yönetimindeki hızlı merkezileşme, ulusun karşı karşıya olduğu sorunlara büyük bir ağırlık vermemizi sağladı, bu nedenle caudilloların daha fazla mülksüzleştirilmesine gerek yok."
 MEX_focus_support_spains_loyalists:0 "İspanya'nın Sadıklarını Destekle"
 MEX_focus_support_spains_loyalists_desc:0 "İspanya'daki Cumhuriyetçi hükümet demokratik olarak seçildi ve şimdi sadece kişisel güç arayan ve İspanya'nın sıradan halkından açıkça nefret eden 'milliyetçi' hainler tarafından isyanla karşı karşıya. Sadıklara yardım göndererek ve kuşatılmış Cumhuriyetçi hükümeti ambargoya almaya çalışan Milletler Cemiyeti'nde onlar için bir duruş sergileyerek desteklemeliyiz."
 MEX_focus_synarchist_communes:0 "Sinarkist Komünler"
 MEX_focus_synarchist_communes_desc:0 "Şimdi halkın zihinleri 'Devrimcilerden' kurtarıldığına ve sadık olanlar yeniden kutsanmış kiliselere akın ettiğine göre, ekonomik planımız uygulanabilir. Yeni üretim birimleri, sadık olanların ulusal davaya ve Kilise'ye hizmet etmelerini sağlarken, aynı zamanda inanç ve zihinde bir birlik duygusu yaşamalarını sağlayacaktır."
 MEX_focus_synarchist_youth:0 "Sinarkist Gençlik"
 MEX_focus_synarchist_youth_desc:0 "Gençlik ulusumuzun geleceğidir. Eğer doğru eğitilirlerse, ideallerimizin - güç, sadakat ve dindarlık - vücut bulmuş hali olacaklardır."
 MEX_focus_tank_workshops:0 "Tank Atölyeleri"
 MEX_focus_tank_workshops_desc:0 "Uçak tasarımcımız TNCA, Büyük Savaş sırasında İngiliz eşkenar dörtgen tasarımlarına dayalı bir prototip oluşturarak zırhlı savaş araçlarıyla deneyler yaptı. Bu deneylere yeniden başlamalı ve bir tank atölyesi kurmalıyız."
 MEX_focus_television_innovators:0 "Televizyon Yenilikçileri"
 MEX_focus_television_innovators_desc:0 "Meksika şaşırtıcı derecede gelişmiş bir elektronik endüstrisine sahiptir. Guillermo González Camarena ve 'Radyo Deneyleri Ligi'nin diğer üyeleri renkli televizyon yayınları ile deneyler yapıyorlar. Bu gelişmelere odaklanırsak iletişim teknolojisinde dünya lideri olabiliriz."
 MEX_focus_the_gold_shirts:0 "Altın Gömlekliler"
 MEX_focus_the_gold_shirts_desc:0 "General Nicolás Rodríguez Carrasco, 1933'te hükümete karşı çalışan komünist hainleri yenmek için Altın Gömleklileri kurdu. Paramiliter grubun amacı takdire şayan ve yöntemleri gerekli olduğu için hükümetin bir kanadı haline gelmelidir."
 MEX_focus_the_red_shirts:0 "Kızıl Gömlekliler"
 MEX_focus_the_red_shirts_desc:0 "Vali Tomás Garrido Canabal, Devrimi Katolik Kilisesi'ne ve onun gerici rahiplerine karşı savunmak için 1930'da Kızıl Gömleklileri kurdu. Halkın düşmanlarını bulmak ve yok etmek değerli bir amaçtır, bu yüzden Kızıl Gömleklileri bir şekilde orduya dahil etmeliyiz."
 MEX_focus_triumph_of_synarchism:0 "Sinarkizmin Zaferi"
 MEX_focus_triumph_of_synarchism_desc:0 "Tamamen yenilmiş olan düşmanlarımız, Şeytan'ın yardakçıları gibi gölgelerde saklanıyorlar. Artık devletin yeniden inşasını, hem inanç hem de siyasi irade birliğini sağlayacak şekilde serbestçe yapabiliriz."
 MEX_focus_triumph_over_the_cristeros:0 "Cristerolar Üzerindeki Zafer"
 MEX_focus_triumph_over_the_cristeros_desc:0 "Cristero karşıtı kampanyalar sırasında birçok yetenekli kişi zirveye yükseldi. Küçük birim taktikleri ve hava desteği ile isyancılarla savaşmak, generallerimize yeteneklerini test etmek için mükemmel bir fırsat verdi. Baskı kampanyası ayrıca kimin daha pis işler için midesi olduğunu görmemizi sağladı."
 MEX_focus_unify_centroamerica:0 "Orta Amerika'yı Birleştir"
 MEX_focus_unify_centroamerica_desc:0 "Nikaragua, Panama ve Kosta Rika'nın küçük muz cumhuriyetleri yaşayabilir ülkeler olmak için çok küçük. Onları kendi ulusumuza katmalı ve böylece Meksika'ya ve Meksika halkına şan getirmeliyiz."
 MEX_focus_urban_development:0 "Kentsel Gelişim"
 MEX_focus_urban_development_desc:0 "Şehirler ekonomik faaliyetin merkezidir ve bu nedenle ihtiyaçları geri kalmış kırsal eyaletlere göre öncelikli olmalıdır. Mexico City ve diğer büyük kentsel alanlarda yol ve demiryolu sistemlerini inşa edeceğiz ve bunu yaparken Meksika'nın zenginliği daha da artacak."
 MEX_focus_weapons_modernisation:0 "Silah Modernizasyonu"
 MEX_focus_weapons_modernisation_desc:0 "Meksika, Devrim'den önce harika bir hafif silah endüstrisine sahipti. Nefret edilen diktatör Díaz, tüm kusurlarına rağmen, silah geliştirme ile yakından ilgileniyordu. Díaz dönemindeki otomatik tüfek deneylerinin araştırılması gerekiyor."
 MEX_focus_womens_suffrage:0 "Kadınların Oy Hakkı"
 MEX_focus_womens_suffrage_desc:0 "Devrimci hükümetlerin birçok yasa koyucusu ve kabine bakanı, kadınların din adamlarının argümanlarından daha kolay etkileneceğine ve laikleşme programını sona erdireceğine inandıkları için kadınlara oy hakkının genişletilmesine karşı çıktı. Geçmişte durum ne olursa olsun, ilerlemenin önünde duramayız."
 MEX_focus_xefo:0 "XEFO"
 MEX_focus_xefo_desc:0 "Hükümet, ülke çapında radyo direkleri inşa ediyor ve istasyonlar kuruyor. Propaganda yaymak için faydalıdır, ancak aynı zamanda kırsal kesimdeki insanları birbirleriyle daha yakın temasa geçirir. XEFO, Partido Nacional Revolucionario tarafından işletilen böyle bir radyo istasyonudur."
 USA_foreign_support_tt:0 "Bu kararlar, maddi destek için lobi yapmak üzere büyük ülkelere yaklaşmamızı sağlar."
 USA_honor_the_confederacy_tt:0 "Bu kararlar, bir iç savaş durumunda geçmişle yeniden bağ kurarak halkın hükümete olan güvenini yeniden inşa etmemizi sağlar."
