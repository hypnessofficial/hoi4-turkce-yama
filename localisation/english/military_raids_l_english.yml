 raid_type_commando_facility_raid:0 "Denizci Tesis Akını"
 raid_type_commando_facility_raid_desc:0 "Bir grup deniz piyadesi, bir kıyı ilindeki Deneysel Tesise hasar vermek için gönderilir."
 raid_type_commando_port_raid:0 "Denizci Liman Akını"
 raid_type_commando_port_raid_desc:0 "Bir grup deniz piyadesi, büyük, düşman kontrolündeki bir $naval_base$ üssüne hasar vermek için gönderilir. Limandaki gemiler de hasar görebilir."
 raid_type_dam_bombing_raid:0 "Baraj Bombardıman Akını"
 raid_type_dam_bombing_raid_desc:0 "Özel seken bombalarla donatılmış uçaklar, barajın etkinliğini azaltmak ve düşmanın sahada hareket etmesini zorlaştırmak için barajı yok etmeye çalışır."
