 operation_jericho_critical_success_tt:0 "Cesur bombardıman hücumu, hiçbir esire zarar vermeden hapishane duvarında dev bir delik açmayı başarıyor. Esirlerin çoğu kaçmayı başarıyor ve yerel direniş tarafından alınıyor."
