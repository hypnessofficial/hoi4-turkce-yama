 operation_huansheng_critical_success_tt:0 "Cesur bombardıman hücumu, belirlenen tüm şehirlere broşür ulaştırmayı başarıyor. Hepsi erişilebilir ve nüfuslu alanlara iniyor ve yerel sakinler tarafından hızla toplanarak Japon işgalinin haberini dört bir yana yayıyor."
