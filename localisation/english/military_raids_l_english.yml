 raid_type_CHI_great_wall_raid_land_desc:0 "Duvar eskiden olduğu gibi aynı savunma değerini taşımıyor ancak yine de mevzilenmiş bir düşmana üstünlük sağlayabilir. Küçük asker grupları göndererek düşman hatlarına sızabilir ve avantajlarını ortadan kaldırmak için iyi yerleştirilmiş patlayıcıları infilak ettirebiliriz."
 raid_type_CHI_hakko_ichiu_bombing:0 "Hakko Ichiu Bombardımanı"
 raid_type_CHI_hakko_ichiu_bombing_desc:0 "Düşmanın emperyalizm sembolüne saldırmak için bir grup bombardıman uçağı göndererek, kendi halkımızın moralini yükseltirken Japonya'nın zayıflığını göstereceğiz."
 raid_type_CHI_huansheng_raid:0 "Huansheng Operasyonu"
 raid_type_CHI_huansheng_raid_desc:0 "İstihbaratımız, değerli hedefler olmalarına rağmen, Yawata çelik fabrikaları ve Sasebo Donanma Tersanesi'nin şu anda hava kuvvetlerimizin düzgün bir şekilde saldırması için çok zor olduğunu belirtiyor. Bu nedenle, bu savaşı durdurmanın en etkili yolunun, Nagasaki, Fukuoka, Saga ve Osaka gibi şehirlerin üzerine broşürler atarak, emperyalist Japon savaş çığırtkanlarının Çin'de işlediği vahşetlere karşı Japon halkının vicdanını harekete geçirmek olduğuna karar verildi."
 raid_type_CHI_national_diet_bombing:0 "Ulusal Diyet Bombardımanı"
 raid_type_CHI_national_diet_bombing_desc:0 "Düşmanın ana karargahına ve Japonya'nın gücünün sembolik yerine saldırmak için bir grup bombardıman uçağı göndererek, aynı anda düşmanımızın moraline darbe indirirken halkımızın moralini yükseltebiliriz."
 raid_type_CHI_tokyo_imperial_palace_bombing:0 "Tokyo İmparatorluk Sarayı Bombardımanı"
 raid_type_CHI_tokyo_imperial_palace_bombing_desc:0 "Düşmanın ana karargahına ve Japonya'nın imparatorluk gücünün sembolik yerine saldırmak için bir grup bombardıman uçağı göndererek, aynı anda düşmanımızın moraline darbe indirirken halkımızın moralini yükseltebiliriz."
 raid_type_CZE_sokolov_raid_pfot:0 "Falknov Baskını"
 raid_type_CZE_sokolov_raid_pfot_desc:0 "$raid_type_GER_eben_emael_raid_desc$"
 raid_type_ENG_operation_jericho:0 "Jericho Operasyonu"
 raid_type_ENG_operation_jericho_desc:0 "Fransız direnişinden gelen bilgilere göre, Almanya Amiens'te çok sayıda Direniş savaşçısını esir tutuyor. Hapishane duvarlarında bir delik açmak için bir uçak filosu göndererek, bu direniş savaşçılarının büyük bir kısmını serbest bırakabilmeliyiz."
 raid_type_ENG_reichstag_bombing:0 "Reichstag Bombardıman Akını"
 raid_type_ENG_reichstag_bombing_desc:0 "Düşmanın ana karargahına ve Almanya'nın gücünün sembolik yerine saldırmak için bir grup bombardıman uçağı göndererek, halkımızın moralini yükseltirken aynı zamanda düşmanımızın moraline bir darbe indirebiliriz."
 raid_type_GER_big_ben_bombing:0 "Big Ben Bombardıman Akını"
 raid_type_GER_eben_emael_raid:0 "Eben Emael Akını"
 raid_type_GER_eben_emael_raid_desc:0 "Bir paraşütçü ve planör birliği fırtına müfrezesi, stratejik olarak yerleştirilmiş kaleye yukarıdan saldıracak, ayrıca ana saldırı gücüne yol açmak için bölgedeki kilit köprüleri, yolları ve demiryollarını ele geçirecektir."
 raid_type_GER_kremlin_bombing:0 "Kremlin Bombardıman Akını"
 raid_type_GER_statue_of_liberty_bombing:0 "Özgürlük Heykeli Bombardıman Akını"
 raid_type_INS_militia_increase_activity_raid:0 "Gerilla Sızması Girişimi"
 raid_type_INS_militia_increase_activity_raid_desc:0 "Milisleri, yerel devrimcilerle temasa geçecekleri ve gerilla hücreleri kuracakları eyalete göndereceğiz. Operasyon sorunsuz ilerlerse, bölgeye sızmaya ve kontrolü Hollandalılardan almaya çalışacağız.\n\n§WHedef eyalet, Cumhuriyetçilere ait bir §YSığınak§!, §YDemiryolu§! veya §YDeniz Üssü§! menzili içinde olmalıdır. Bu binalar başlangıç noktası olarak kullanılabilir.§!\n\n§YEtkiler:§!\n§RAtanan tümen harcanır§!\n§YBaşarı:§!\n §WEyaletin sahibi ve kontrol edeni olur\n Tırmanışı §R1§! artırır.§!\n§YSınırlı Başarı:§!\n §W §YBir kademe§! milis aktivitesi ekleyerek gelecekteki girişimler için başarı şansını artırır.§!\n§YBaşarısızlık:§!\n §WEtki yok§!."
 raid_type_INS_militia_port_raid:0 "Deniz Üssünü İşgal Et"
 raid_type_INS_militia_port_raid_desc:0 "Milisleri, umarız tespit edilmeyecek küçük teknelerde balıkçı kılığına girerek göndereceğiz. Karaya çıktıklarında gerilla hücreleri kurmaya çalışacaklar ve fırsat elverirse deniz üssünü işgal etmek için yerel gerillalarla birlikte çalışacaklar. Bu çok riskli bir çaba, eğer milisler fark edilirse operasyon kesinlikle başarısız olacaktır.\n\n§YEtkiler:§!\n§RAtanan tümen harcanır§!\n§YBaşarı:§!\n §WEyaletin sahibi ve kontrol edeni olur\n Tırmanışı §R1§! artırır.§!\n§YSınırlı Başarı:§!\n §W §YBir kademe§! milis aktivitesi ekleyerek gelecekteki girişimler için başarı şansını artırır.§!\n§YBaşarısızlık:§!\n §WEtki yok§!."
 raid_type_JAP_pearl_harbor_strike:0 "Pearl Harbor Saldırısı"
 raid_type_JAP_pearl_harbor_strike_desc:0 "Düşmanın Pasifik Okyanusu'ndaki ana donanma karargahına ve filosuna saldırmak için bir grup bombardıman uçağı göndererek, aynı anda düşmanımızın moraline ve deniz yeteneklerine darbe indirirken halkımızın moralini yükseltebiliriz. Bu sayede donanmalarımız 6 ay boyunca serbestçe dolaşabilecek!"
 raid_type_PRC_probe_border_defenses_raid:0 "Sınır Savunmalarına Baskın Düzenle"
 raid_type_PRC_weapons_depot_raid:0 "Silah Depolarına Baskın Düzenle"
 raid_type_SIA_indochina_port_raid:0 "Çinhindi Limanı'na Baskın"
 raid_type_SIA_indochina_port_raid_desc:0 "Bombardıman uçaklarımız Çinhindi'ndeki bir düşman deniz üssünü vuracak, rıhtımlarını çukurlaştıracak ve demirli olan savaş gemilerini batıracak. Kraker açtığımız her liman, Körfez'deki düşman filosu için bir üs eksiltiyor."
 raid_type_SIA_pacific_island_raid:0 "$SIA_pacific_island_raid$"
 raid_type_SIA_pacific_island_raid_desc:0 "$SIA_pacific_island_raid_desc$\n\n§YEtkiler:§!\n§YKritik Başarı / Başarı / Sınırlı Başarı:§!\n       §W§YDeniz üssüne§! ve §Ydeniz araştırma tesisine§! §Y3§!/§Y2§!/§Y1§! seviye hasar verir\n       Bölgedeki düşman §Yordularına ve gemilerine§! §Y75%§!/§Y50%§!/§Y25%§! hasar verir§!\n§YBaşarısızlık:§!\n       §RGörevlendirilen tümen yok edilir§!"
 raid_type_SOV_transport_volunteers_to_CZE:0 "Sovyet Gönüllüleri İçin Hava Köprüsü"
 raid_type_SOV_transport_volunteers_to_CZE_desc:0 "Çekoslovakya askeri yardım talebinde bulundu ancak doğrudan sınırımızın olmaması lojistiği karmaşıklaştırıyor; bunun yerine, Çekoslovak ordusunun bir parçası olarak savaşmak üzere havayoluyla nakledilecek bir gönüllü kuvveti toplayabiliriz."
