 tooltip_raid_category_naval_commando_raids:0 "§HDeniz Komando akınları§! \nDenizciler tarafından kıyı bölgelerinde, hızlı bir saldırı yapmak ve düşmanın tepki vermesine fırsat kalmadan ortadan kaybolmak için küçük sürat tekneleri ve benzeri teçhizatlar kullanılarak gerçekleştirilen küçük ölçekli akınlar."
 tooltip_raid_category_nuclear_raids:0 "§HNükleer akınlar§! \nNükleer silah taşıyan stratejik bombardıman uçakları veya balistik füzeler tarafından gerçekleştirilen saldırılar."
 tooltip_raid_category_paratrooper_raids:0 "§HParaşütçü akınları§! \nTehlikeli sabotaj görevleri yürütmek için düşman hatlarının gerisine inen özel kuvvetler tarafından gerçekleştirilen küçük ölçekli akınlar."
