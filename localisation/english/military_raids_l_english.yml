 raid_type_nuclear_missile_strike:0 "Nükleer Füze Saldırısı"
 raid_type_nuclear_missile_strike_desc:0 "Uzun menzilli bir füze, belirlenen fırlatma sahasından hedeflenen hedefe doğru yörünge altı bir balistik yörünge izleyecektir. Uygun anda, üzerindeki savaş başlığı bir atom patlaması gerçekleştirecektir."
