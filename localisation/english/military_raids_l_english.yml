 raid_type_nuclear_strike:0 "Nükleer Saldırı"
 raid_type_nuclear_strike_desc:0 "Stratejik bir bombardıman uçağı ve eskortu, belirlenen hedefe uçacak ve bir atom bombası bırakacaktır. Bombardıman uçağı daha sonra patlama dalgasına yakalanmamak için sahadan kaçmaya çalışacaktır."
 raid_type_oilfield_raid:0 "Petrol Sahası Akını"
 raid_type_oilfield_raid_desc:0 "Düşmanın yakıt üretimini uzun bir süre boyunca ciddi şekilde aksatmak amacıyla büyük bir petrol sahasını ve bağlı Rafinerilerini devre dışı bırakmayı amaçlayan bir Hava Saldırısı."
