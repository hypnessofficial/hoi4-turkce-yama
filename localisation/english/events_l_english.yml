 ace_died.1.a:0 "Yaşayan bir efsane yine de daha iyidir."
 ace_died.1.d:0 "[From.Owner.GetName]'nin en ünlü [From.GetAceType] aslarından biri olan [From.GetFullName], [From.GetMissionRegion] üzerindeki bir görev sırasında görev başında alevler içinde düştü. Ne yazık ki, [From.GetSheHe] uzun zamandır bir kamu figürü olduğu için, [From.GetCallsign]'nin ölümü, [From.GetHerHim]'e hayran olan birçok insan için ciddi şekilde moral bozucu.\n\nBu olayı halktan gizlemenin bir yolu olmasını dilesek de, [From.GetName]'nin kamuoyunda görünmemesi yakında şüphe uyandıracaktır. Nihayetinde, [From.GetHerHis]'in ölümü, umarım mevcut sıkıntılarımızdan çok sonra da yaşayacak bir efsanenin başka bir parçasıdır."
 ace_died.1.d_major:0 "[From.Owner.GetName]'nin en ünlü [From.GetAceType] aslarından biri olan [From.GetFullName], görev başında düştü. Görevden dönen pilotlar, [From.GetHerHis] [From.GetWingShort] uçağının ağır düşman ateşi aldıktan sonra [From.GetMissionRegion] üzerinde alevler içinde düştüğünü gördüklerini bildirdi. Ne yazık ki, [From.GetSheHe] uzun zamandır bir kamu figürü olduğu için, [From.GetCallsign]'nin ölümü, [From.GetHerHim]'e hayran olan birçok insan için ciddi şekilde moral bozucu.\n\nBu olayı halktan gizlemenin bir yolu olmasını dilesek de, [From.GetName]'nin kamuoyunda görünmemesi yakında şüphe uyandıracaktır. Nihayetinde, [From.GetHerHis]'in ölümü, umarım mevcut sıkıntılarımızdan çok sonra da yaşayacak bir efsanenin başka bir parçasıdır."
 ace_died.1.t:0 "[From.GetCallsign], [From.GetMissionRegion] Üzerinde Öldürüldü"
 ace_killed_by_ace.1.a:0 "Hepimiz için yıkıcı bir kayıp."
 ace_killed_by_ace.1.d:0 "[From.GetMissionRegion]'dan dönen pilotlar, kötü şöhretli [Prev.GetCallsign]'ın liderliğindeki bir [Prev.Owner.GetAdjective] uçağı filosunun, [From.GetCallsign]'ı takip etmeye odaklandığını bildiriyor. [Prev.Owner.GetAdjective]lerden gelen birkaç yaylım ateşinden kaçtıktan ve bir dizi düşman uçağını düşürdükten sonra [From.GetCallsign], bildirildiğine göre [From.GetHerHim]'i manevra ile alt eden ve temiz bir vuruşla yakıt depolarını parçalayan [Prev.GetCallsign] tarafından alt edildi. [From.GetName] [From.GetSurname]'in uçağı alev aldı ve [From.GetMissionRegion] üzerinde şiddetli bir alev topu içinde sarmal çizerek düştü.\n\n[From.GetFullName], [From.GetHerHis] hizmeti boyunca büyük bir cesaret gösterdi ve birçokları tarafından örnek alınıyordu. Bu ulusal kahramanın kaybı, [From.Owner.GetAdjective] hava kuvvetlerine büyük bir darbe ve bir bütün olarak ulusumuz için yıkıcı bir darbedir. Biz yas tutarken, [Prev.Owner.GetName]'in [Prev.GetFullName]'ı bir kahraman olarak kutladığını bilmek, trajediyi daha da büyütüyor."
 ace_killed_by_ace.1.d_major:0 "[From.GetMissionRegion]'den dönen pilotlar, kötü şöhretli [Prev.GetCallsign] liderliğindeki [Prev.Owner.GetAdjective] uçaklardan oluşan bir filonun [From.GetCallsign]'yi kovalamaya odaklandığını bildirdi. Bir dizi düşman uçağını düşürdükten ve [Prev.Owner.GetAdjective]'lerden birkaç patlamadan kaçtıktan sonra, [From.GetCallsign], [Prev.GetWingShort]'sinde [Prev.GetCallsign] tarafından ezildi ve bildirildiğine göre [From.GetHerHim]'i geride bıraktı ve yakıt tanklarını temiz bir vuruşla parçaladı. [From.GetName] [From.GetSurname]'nin [From.GetWingShort]'si alev aldı ve şiddetli bir cehennemde [From.GetMissionRegion]'nin üzerinden spiraller halinde aşağı indi.\n\n[From.GetFullName] [From.GetHerHis] hizmeti boyunca büyük bir cesaret gösterdi ve birçok kişi tarafından örnek alındı. Bu ulusal kahramanın kaybı [From.Owner.GetAdjective] hava kuvvetlerine büyük bir darbedir ve bir bütün olarak milletimize yıkıcı bir darbedir. Biz yas tutarken [Prev.Owner.GetName]'nin [Prev.GetFullName]'u bir kahraman olarak kutladığını bilmek trajediyi daha da büyütüyor."
 ace_killed_by_ace.1.t:0 "[From.GetFullName], [Prev.GetCallsign] Tarafından Düşürüldü"
 ace_killed_other_ace.1.a:0 "Tüm [From.Owner.GetName]'nin hatırlayacağı bir zafer!"
 ace_killed_other_ace.1.d:0 "[From.GetMissionRegion] üzerindeki son görevimiz, [From.Owner.GetAdjective] hava kuvvetleri için birden fazla açıdan büyük bir başarıydı. Gelen raporlar, [Prev.GetCallsign] olarak bilinen [Prev.Owner.GetAdjective] pilotu [Prev.GetName] [Prev.GetSurname]'i alt etmeyi başaran [From.GetFullName]'in kahramanca eylemini vurguluyor. [From.GetCallsign], [From.GetHerselfHimself]'i yem olarak kullanarak [Prev.GetCallsign]'ı bir tuzağa çekti; bu tuzakta [From.Owner.GetAdjective] pilotları [Prev.GetCallsign]'ın filosunun üzerine dalabildi. [From.GetCallsign] ardından [Prev.Owner.GetAdjective] uçaklarını manevra ile alt etti ve tek bir yaylım ateşle [Prev.GetCallsign]'ı [From.GetMissionRegion] semalarından sarmal çizerek düşürdü.\n\n[Prev.GetFullName], [Prev.GetHerHis] vicdanında birçok [From.Owner.GetAdjective] canı olan, korkulan bir pilottu. Bu büyük bir zaferdir ve büyük kahramanların arkasında toplandığımızda, onların büyük işler başardığını gösteriyor."
 ace_killed_other_ace.1.d_major:0 "[From.GetMissionRegion] üzerindeki son görevimiz, [From.Owner.GetAdjective] hava kuvvetleri için birden fazla açıdan büyük bir başarıydı. Gelen raporlar, [Prev.GetCallsign] olarak bilinen [Prev.Owner.GetAdjective] pilotu [Prev.GetName] [Prev.GetSurname]'i alt etmeyi başaran [From.GetFullName]'in kahramanca eylemini vurguluyor. [From.GetCallsign], [From.GetHerselfHimself]'i yem olarak kullanarak [Prev.GetCallsign]'ı bir tuzağa çekti; bu tuzakta [From.Owner.GetAdjective] pilotları [Prev.GetCallsign]'ın filosunun üzerine dalabildi. [From.GetCallsign] ardından [Prev.Owner.GetAdjective] uçaklarını manevra ile alt etti ve tek bir yaylım ateşle [Prev.GetCallsign]'ı [From.GetMissionRegion] semalarından sarmal çizerek düşürdü.\n\n[Prev.GetFullName], [Prev.GetHerHis] vicdanında birçok [From.Owner.GetAdjective] canı olan, korkulan bir pilottu. Bu büyük bir zaferdir ve büyük kahramanların arkasında toplandığımızda, onların büyük işler başardığını gösteriyor."
 ace_killed_other_ace.1.t:0 "[From.GetFullName], [Prev.GetCallsign]'ı Düşürdü"
 ace_promoted.1.a:0 "Cesaret eden kazanır."
 ace_promoted.1.d:0 "[Root.GetAdjective] hava kuvvetlerinin cesur pilotları kadar çok risk alan azdır. [From.GetCallsign] çağrı adıyla bilinen yetenekli pilot [From.GetName] [From.GetSurname], sadece [From.GetMissionRegion] üzerindeki son görevden sağ dönmekle kalmayıp, aynı zamanda birçok kritik çatışmada önemli zaferler yaşayarak [From.GetHerselfHimself]'i öne çıkardı.\n\n[Root.GetAdjective] cesaretinin parlak bir örneği olarak gösterilen [From.GetName]'in son terfisi, geniş bir şekilde kamuoyuna duyuruldu. Halk savaşı zaferden çok cehennem olarak görse de, birçoğu arkasında toplanılacak kahramanların hala var olduğunu görmekten memnun."
 ace_promoted.1.d_major:0 "[Root.GetAdjective] hava kuvvetlerinin cesur pilotları kadar çok risk alan azdır. [From.GetCallsign] çağrı adıyla bilinen yetenekli pilot [From.GetName] [From.GetSurname], sadece sağ dönmekle kalmayıp, aynı zamanda [From.GetHerHis] [From.GetWing]'ini de muazzam bir beceriyle kullanarak [From.GetHerselfHimself]'i kanıtladı. Yakın zamanda [From.GetName], [From.GetMissionRegion] üzerinde bir görevdeydi ve bu kritik çatışmanın başarısında kilit rol oynadı.\n\n[Root.GetAdjective] cesaretinin parlak bir örneği olarak gösterilen [From.GetName]'in son terfisi, geniş bir şekilde kamuoyuna duyuruldu. Halk savaşı zaferden çok cehennem olarak görse de, birçoğu arkasında toplanılacak kahramanların hala var olduğunu görmekten memnun."
 ace_promoted.1.t:0 "As Pilot Terfi Etti"
 ace_promoted.2.t:0 "Yeni Bir As Ortaya Çıktı"
 aces_killed_each_other.1.a:0 "Yine de bizim için büyük bir kayıp."
 aces_killed_each_other.1.d:0 "Son görev sırasında ünlü [From.GetAceType] asımız [From.GetFullname], korkulan as pilot [Prev.GetFullName] ile uzun süreli bir çatışmaya girdi. Mühimmatı az ve kaçış imkanı olmayan [From.GetCallsign], [Prev.Owner.GetAdjective] uçaklarından gelen ateşin arasından manevra yaparak [Prev.GetCallsign]'a çarptı.\nHem [From.GetCallsign]'ın hem de [Prev.GetCallsign]'ın uçaklarının [From.GetMissionRegion] üzerinde parçalar halinde düştüğü görüldü.\n\n[Prev.Owner.GetAdjective] belası [Prev.GetCallsign]'ın artık bizim için bir sorun olmayacağı küçük bir teselli olsa da, değerli bir kamu figürünü ve tüm [From.Owner.GetAdjective] halkı için bir ilham kaynağını kaybettik."
 aces_killed_each_other.1.d_major:0 "Son görev sırasında ünlü [From.GetAceType] asımız [From.GetFullname], korkulan as pilot [Prev.GetFullName] ile uzun süreli bir çatışmaya girdi. Mühimmatı az ve kaçış imkanı olmayan [From.GetCallsign], [From.GetHerHis] [From.GetWingShort] uçağını [Prev.Owner.GetAdjective] uçaklarından gelen ateşin arasından manevra yaparak [Prev.GetCallsign]'a çarptı.\nHem [From.GetCallsign]'ın [From.GetWingShort] uçağı hem de [Prev.GetCallsign]'ın [Prev.GetWingShort] uçağının [From.GetMissionRegion] üzerinde parçalar halinde düştüğü görüldü.\n\n[Prev.Owner.GetAdjective] belası [Prev.GetCallsign]'ın artık bizim için bir sorun olmayacağı küçük bir teselli olsa da, değerli bir kamu figürünü ve tüm [From.Owner.GetAdjective] halkı için bir ilham kaynağını kaybettik."
 aces_killed_each_other.1.t:0 "[From.GetFullName] Düştü"
 baltic.1.a:0 "Kaçınılmaz olanı kabul et..."
 baltic.1.b:0 "Topraklarımızı zorla almak zorunda kalacaklar!"
 baltic.1.d:0 "[FROM.GetNameDefCap] bize onlarla 'karşılıklı yardım' antlaşması imzalamamız için baskı yapıyor; bu da onlara topraklarımız içinde kuvvet konuşlandırma hakkı verecek! Bu, ülkemizi ilhak etmeye yönelik üstü kapalı bir girişimden başka bir şey değil, ancak sınırlarımıza yerleştirdikleri kuvvetlere karşı pek direniş gösteremeyiz."
 baltic.1.t:0 "[FROM.GetAdjective] Ültimatomu"
 baltic.4.a:0 "Kabul etmeliyiz."
 baltic.4.b:0 "Asla!"
 baltic.4.d:0 "Alman kuvvetleri Ostpreussen'de yığılıyor ve Dışişleri Bakanlıkları bize bir ültimatom sundu! Memel bölgesini derhal onlara devretmeliyiz, yoksa askeri harekat tehdidiyle karşı karşıya kalacağız. Taleplerini kabul etmeli miyiz?"
 baltic.4.t:0 "Almanya Memel'i Talep Ediyor"
 baltic.5.a:0 "Geleceğimiz, Anavatan ile gerçekten bir olursak en iyi şekilde güvence altına alınır."
 baltic.5.b:0 "[Root.GetName], Sovyetler Birliği'nin koruması altında kendi başına faaliyet göstererek daha fazlasını sunabilir."
 baltic.5.c:0 "[Root.GetName] egemen bir devlet olarak kalacaktır."
 baltic.5.d:0 "[Root.GetName] dayanışmayı seçti ve siyasi iktidar burjuvazinin elinden alındı. Yeni hükümet içindeki birçok kişi, komünist görevlerimizi yerine getirmemizi ve Sovyetler Birliği ile bir olmamızı öneriyor."
 baltic.5.t:0 "Komünistler Kontrolü Ele Geçirdi."
 baltic.7.a:0 "[Root.GetName] kardeşlerinin yanındadır."
 baltic.7.b:0 "[Root.GetName] ancak kendi başına hayatta kalabilir."
 baltic.7.d:0 "Uluslarımız arasında bir dostluk antlaşması imzalanmasının ardından, [From.GetName], uluslarımızı çevreleyen artan tehditlere karşı birleşmek için [Root.GetName]'nin kendi [From.GetFactionName]'ne katılmasını talep etti. Komünist ya da faşist olsun, [From.GetName], [Root.GetAdjective] çıkarlarını savunmaya söz veriyor."
 baltic.7.t:0 "[From.GetName], [Root.GetAdjective]'nin [From.GetFactionName]'ne Katılımını Talep Ediyor"
 baltic.8.a:0 "Bu doğal bir seçim!"
 baltic.8.desc:0 "[ROOT.GetNameDef] için harika bir gün! Yoldaşlarımızın verdiği yiğitçe mücadelenin ardından, [SOV.GetNameDefCap] yeni özgürleştirilen Baltık topraklarının ve cesur işçilerinin bizim yetki alanımıza gireceğini haklı olarak ilan etti.\n\nBu bizi, işçi sınıfının düşmanlarına karşı savaşabilecek kadar güçlü birleşik bir Baltık Devleti'ne bir adım daha yaklaştırıyor."
 baltic.8.t:0 "[SOV.GetNameDefCap] Baltık topraklarındaki kontrolümüzü genişletiyor"
 britain.1.a:0 "Mükemmel bir teklif!"
 britain.1.b:0 "Hayır, İngilizler kendi başlarının çaresine baksın."
 britain.1.c:0 "Daha uzun vadeli bir işbirliği hedeflemeliyiz."
 britain.1.d:0 "İngiliz hükümeti, Henry Tizard liderliğindeki bir bilim heyetini ilginç bir teklifle bize gönderdi. İngilizler, icatlarını yeterli sayıda üretecek endüstriyel kapasiteye sahip olmadıkları için çeşitli kilit alanlardaki araştırma çabalarını bizimkilerle birleştirmeye istekliler."
 britain.1.t:0 "Tizard Misyonu"
 britain.10.a:0 "İmparatorluğun ihtiyacı olan Winston Churchill'dir."
 britain.10.b:0 "Lord Halifax, Chamberlain'in ilk tercihidir."
 britain.10.d:0 "Başbakan Neville Chamberlain son zamanlarda hastalandı, ancak daha önce yaşına göre genellikle sağlıklıydı. Bağırsak kanseri teşhisi konulduktan sonra artan ağrı ve uykusuzluk istifa etmesine yol açtı. Chamberlain hala güçlü bir halk desteğine sahip ve işe dönemeyeceğini anlayınca son çare olarak görevden ayrılıyor.\n\nSoru, bu büyük devlet adamından sonra meşaleyi kimin devralacağı ve Britanya'yı önümüzde hala uzanabilecek karanlık zamanlardan kimin geçireceği."
 britain.10.t:0 "Chamberlain Vefat Etti"
 britain.11.a:0 "Demokrasiyi Topla!"
 britain.11.b:0 "Aşırı tepki vermeye gerek yok."
 britain.11.d:0 "Almanlar ve Sovyetler arasındaki tam bir askeri ittifak, dünya düzenini yıkma ve yeni bir totalitarizm çağı getirme potansiyeline sahip. Bu gelişmeye karşı koymak için, dünyanın Demokratik uluslarını Nazi-Komünist tehdidine karşı mücadele etmek üzere Büyük bir İttifak'ta birleştirmeliyiz."
 britain.11.t:0 "Berlin-Moskova Ekseni"
 britain.12.a:0 "Evet"
 britain.12.b:0 "Hayır"
 britain.12.d:0 "İngiltere, Nazi-Komünist tehdidine karşı mücadele etmek için bizi ittifaklarına katılmaya davet ediyor. Nasıl cevap vermeliyiz?"
 britain.12.t:0 "Büyük İttifak"
 britain.13.a:0 "Evet"
 britain.13.b:0 "Hayır"
 britain.13.d:0 "Dünya giderek daha güvensiz hale geliyor. İngiltere ve Fransa Avrupa'da demokrasinin ve özgürlüğün kaleleri olmaya devam ediyor ve Fransa şimdi Müttefiklere katılmayı teklif ediyor.\nNasıl cevap vermeliyiz?"
 britain.13.t:0 "Fransa Müttefiklere Katılmak İstiyor"
 britain.14.a:0 "Kalıcı bir barış aranmalı."
 britain.14.b:0 "Tarih bizi affetmez."
 britain.14.d:0 "Alman hükümeti, tarihsel Alman eyaleti Carniola olduğunu iddia ettikleri Slovenya'nın statüsü hakkında ajitasyon yapmaya başladı; burada Almanların ve Slovenlerin Yugoslav hükümeti tarafından ezildiğini iddia ediyorlar. Majestelerinin Hükümeti, Fransa, Almanya ve İtalya hükümetlerini bu konuya adil bir çözüm aramak üzere Londra'da bir konferansa davet etti. Küçük Alman azınlığın Almanya'ya katılmak istediğine şüphe yok, ancak Sloven nüfusunun istekleri daha az net. Almanya bu konuda savaşın köpeklerini salıvermeye hazır görünüyor ve savaşın kara bulutları bir kez daha Avrupa kıtası üzerinde toplanıyor."
 britain.14.t:0 "Londra Konferansı"
 britain.15.a:0 "Yerlerini öğrenecekler."
 britain.15.d:0 "Fransa hükümeti, mütevazı sınır düzenlemesi önerimiz konusunda mantıklı davranmayı başaramadı ve barışı bozup korkunç bir savaş başlatmaya karar verdi. Onların başka bir anlamsız siper savaşı turunda kendilerini tüketmelerine izin vereceğiz ve sonra yardımımız için yalvaracaklar."
 britain.15.t:0 "Fransa Bizi Terk Ediyor"
 britain.16.a:0 "Huzur İçinde Yatsın."
 britain.16.d:0 "Majesteleri, Birleşik Krallık ve Britanya Dominyonları Kralı ve Hindistan İmparatoru V. George vefat etti. Sessiz sakinliği ve tebaasına olan bağlılığı, İmparatorluğu hem Büyük Savaş'tan hem de Büyük Buhran'dan geçirdi. Oğlu Kral VIII. Edward olarak görevi devralacak, ancak şimdiden çok bağımsız fikirli olacağına dair endişeler var. Stanley Baldwin ve Neville Chamberlain, Başbakan ve Kabine'den talimat kabul etmesini sağlamak için hazırlanıyor."
 britain.16.t:0 "Kral V. George Vefat Etti"
 britain.17.a:0 "Tanrı Kral VI. George'u Korusun!"
 britain.17.d:0 "Başbakan Baldwin, Kral-İmparator'un sadece bir halktan biriyle değil, aynı zamanda boşanmış biriyle ve bu da yetmezmiş gibi bir Amerikalıyla evlenmesi durumunda saygınlığının zedeleneceğini oldukça açık bir şekilde belirtti. Uzun bir iç hesaplaşmanın ardından majesteleri aşkı göreve tercih etti ve tahttan çekilmeyi seçti. Küçük kardeşi Albert, Kral VI. George olarak görevi devralacak. Londra bahisçileri, bu utangaç adamın kendi taç giyme törenine ulaşıp ulaşamayacağı konusunda şimdiden bahis açıyor."
 britain.17.t:0 "Kral VIII. Edward Tahttan Çekiliyor"
 britain.18.a:0 "İmparatorluğun selameti için VIII. Edward hüküm sürmeli!"
 britain.18.b:0 "Parlamentoya müdahale etmeyeceğiz."
 britain.18.d:0 "VI. George ile [Root.GetRulingParty] arasında hiçbir sevgi olmadığı bir sır değil. Parlamentodaki sesler şimdi onun sürgündeki kardeşi VIII. Edward lehine istifasını talep ediyor. Bu adam güç yoluyla birlik fikrine daha az yabancı ve İngiltere için bir vizyonu olan bir adam. Ulusumuzun bir liderinde aradığımız nitelikler bunlar!"
 britain.18.t:0 "Kralın Dönüşü"
 britain.19.a:0 "Aptalca bir çaba!"
 britain.19.d:0 "Japonya'nın desteğiyle Hint milliyetçileri sürgünde bir hükümet olan Azad Hind'i kurdu.\n\nMilliyetçiler Raj'da propaganda yayıyor ve Sepoy firarlarını teşvik ediyor. Şimdilik destekleri olmasa da, çabaları sonunda tehlikeli hale gelebilir."
 britain.19.t:0 "Özgür Hindistan Hükümeti Kuruldu"
 britain.2.a:0 "Çok iyi!"
 britain.2.d:0 "ABD hükümeti teklifimizi kabul etti ve bazı araştırma verilerini heyetimizle paylaştı."
 britain.2.t:0 "Tizard başarılı"
 britain.20.a:0 "Hayır, İmparatorluk birleşik durmalı!"
 britain.20.d:0 "Sürgündeki Özgür Hindistan hükümeti olan Azad Hind, Raj halkı arasında propaganda yayıyor ve destek topluyordu. İmparatorluğun birlikte çalışmasının her zamankinden daha önemli olmasına rağmen, şimdi saldırma zamanının geldiğine karar verdiler."
 britain.20.t:0 "Azad Hind Hint İsyanına Öncülük Ediyor"
 britain.21.a:0 "Olağanüstü!"
 britain.21.d:0 "ABD hükümeti sadece ilk teklifimizi kabul etmekle kalmadı, aynı zamanda uluslarımızdaki araştırmacılar arasında daha uzun vadeli bir işbirliği de teklif etti."
 britain.21.t:0 "Tizard muzaffer"
 britain.22.a:0 "Bay Chamberlain bir hükümet kurmaya çalışacak."
 britain.22.d:0 "Kral VI. George'un taç giyme töreninden iki hafta sonra, Bay Baldwin 70 yaşında emekli olmak üzere başbakanlıktan istifa edeceğini duyurdu. 1923'ten beri aralıklarla Ulusal Hükümet'i yöneten Baldwin, Britanya İmparatorluğu'nu Büyük Buhran'dan çıkaran istikrarlı el olmuş ve son yıllarda isteksizce İmparatorluk yeniden silahlanmasının başlangıcını ve Kral VIII. Edward'ın tahttan çekilmesini denetlemiştir. Popüler ve başarılı bir başbakan olarak görevden ayrılıyor, ancak Almanya'dan gelen artan tehdide karşı yeterince şey yaptı mı?"
 britain.22.t:0 "Stanley Baldwin İstifa Ediyor"
 britain.23.a:0 "İmparatorluğun yanında olacağız!"
 britain.23.b:0 "Fırsatı değerlendireceğiz!"
 britain.23.d:0 "Sürgündeki Özgür Hindistan hükümeti olan Azad Hind, tüm gerçek vatanseverlerin İngiliz efendilerine karşı silaha sarılma zamanının geldiğini ilan etti. Hindistan'ın kaderi pamuk ipliğine bağlı ve bir seçim yapmalıyız."
 britain.23.t:0 "Hint İsyanı"
 britain.24.a:0 "Ne kadar da isabetli bir öngörüde bulunmuşuz!"
 britain.24.d:0 "Sivil fabrikalarımızın tam savaş zamanı sanayisine geçişini kolaylaştırmak için Gölge Programı'nda aldığımız dikkatli hazırlıklar şimdi meyvesini verdi. Yeni fabrikalar, bu zaman diliminde makul olarak beklenebilecek olandan çok daha verimli."
 britain.24.t:0 "Gölge Programı Fabrikaları Kullanıma Alındı"
 britain.3.a:0 "O alçaklar!"
 britain.3.d:0 "ABD hükümeti teklifimizi reddetti, onlardan yardım alamayacağız."
 britain.3.t:0 "Tizard reddedildi"
 britain.4.a:0 "Koşan köpekleri püskürtün!"
 britain.4.d:0 "Japonya'ya karşı savaşımızda bize yardım etmek için İngiltere, Altyapıyı geliştirdi ve Burma sınırımız boyunca hava üsleri inşa etti."
 britain.4.t:0 "Burma Yolu"
 britain.6.a:0 "Bırakma zamanı geldi."
 britain.6.b:0 "Asla!"
 britain.6.d:0 "Dört yıl önce Hindistan'a dört yıl içinde bağımsızlık sözü verdik. Süre doldu ve Hintliler sözümüzü tutmamızı istiyor. Tacın mücevheri Britanya İmparatorluğu'ndan ayrılmalı mı?"
 britain.6.t:0 "Hindistan'ın Bağımsızlığı"
 britain.7.a:0 "Almanları zaten hiç sevmemiştim."
 britain.7.b:0 "İstediğimizle ticaret yaparız!"
 britain.7.d:0 "Büyük Britanya bize bir ültimatom verdi: Ya Almanya ile ticaretimizi durdururuz ya da bizi işgal ederler."
 britain.7.t:0 "Almanya ile ticareti sonlandır"
 britain.8.a:0 "O zaman savaş!"
 britain.8.b:0 "Onları zorlayamayız."
 britain.8.d:0 "[From.GetName], Almanya ile ticareti durdurma talebimizi reddetti."
 britain.8.t:0 "Talep reddedildi!"
 britain.9.a:0 "Asla teslim olmayacağız."
 britain.9.d:0 "Savaşın bizim ve müttefiklerimizin aleyhine gelişmesiyle birlikte, Başbakan hem barış zamanı hem de savaş zamanı kritik kavşaklardaki kararları nedeniyle eleştiri bombardımanına tutuldu. Britanya'nın her zamankinden daha fazla birlik içinde olması gereken bir anda, parlamentonun bir kısmının Chamberlain'i küçümsemesiyle kendini bölünmüş buluyor.\n\nİşçi Partisi'nden hayati destek alamayan Başbakan istifa etme kararı aldı ve yerine Lord Halifax'ı tercih etti. Ancak Halifax şüpheciydi ve Chamberlain Kral'a Winston Churchill'i çağırmasını tavsiye etti. Şimdi üzerimizde olan savaş konusunda uzun zamandır uyarıda bulunan Churchill'in bizi bu süreçten geçirebileceğine inanılıyor."
 britain.9.t:0 "Chamberlain İstifa Ediyor"
 bulgaria.1.a:0 "Nihayet!"
 bulgaria.1.d:0 "Rumen hükümeti anlaşmazlığımızda Alman Arabuluculuğunu kabul etti. Güney Dobruca Bulgaristan ile yeniden birleşti!"
 bulgaria.1.t:0 "Krayova Antlaşması - Romanya Kabul Ediyor"
 bulgaria.2.a:0 "Kabul edilemez!"
 bulgaria.2.d:0 "Rumen hükümeti tüm anlaşmazlıkları sona erdirme teklifimizi reddetti! Güney Dobruca'nın artık uluslarının ayrılmaz bir parçası olduğunu ve asla vazgeçmeyeceklerini iddia ediyorlar."
 bulgaria.2.t:0 "Krayova Antlaşması - Romanya Reddediyor"
 bulgaria.3.a:0 "Bulgarlar sevinsin!"
 bulgaria.3.d:0 "Uzun zamandır daha büyük bir Bulgaristan hayal ettik ve uzun zamandır ikinci sınıf muamelesi gördük. Londra Konferansı'nda haklı payımız reddedildi, 1913'te müttefiklerimiz tarafından ihanete uğradık, 1918'de adalet istediğimiz için cezalandırıldık. Artık yeter, Almanya sadece kendisi için değil başkaları için de o sözde barışın yanlışlarını düzeltmek istiyor. Bulgaristan şimdi Makedonya'nın Yugoslavya'dan iadesini görecek."
 bulgaria.3.t:0 "Birinci Ljubljana Diktası"
 bulgaria.4.a:0 "İntikamımızı alacağız."
 bulgaria.4.b:0 "İntikam soğuk yenen bir yemektir."
 bulgaria.4.d:0 "Romanya'nın 1913'te ordularımız başka yerlerde meşgulken bizi nasıl arkadan vurduğunu ve Güney Dobruca'yı korkakça aldığını unutmadık. Macaristan, Romanya'dan intikam almak için Almanya ile olan dostluğunu kullandı, şimdi sıra bizde mi?"
 bulgaria.4.t:0 "Krayova Antlaşması"
 bulgaria.5.a:0 "Reddedildi."
 bulgaria.5.d:0 "Almanya, adalet arayışımızda aşağılık Rumenlerin yanında yer almayı seçti. [Root.GetLeader], Alman büyükelçisine Bulgaristan'ın dostlarından daha fazlasını beklediğini bildirdi."
 bulgaria.5.t:0 "Krayova Antlaşması"
 canada_vanilla.1.desc:0 "İkinci Dünya Savaşı sırasında yaklaşık bir milyon Kanadalı kadın iş gücüne katıldı. Ulusal medyada, dayanıklılık ve vatanseverliğin bir simgesi olan Veronica Foster, halk arasında Ronnie, Bren Silah Kızı olarak bilinirdi. Üç kardeşi denizaşırı ülkelerde savaşırken, John Inglis and Company için Toronto'daki bir silah fabrikasında çalıştı. Kendisini ve onun gibi kadınları savaş çabasına katılırken gösteren posterler ve kısa filmler, Amerika'nın savaşa girmesinden sonra 'Rosie the Riveter' etrafında daha iyi bilinen medya kampanyasına ilham kaynağı olmuş olabilir."
 canada_vanilla.1.opt:0 "Haber filmlerinde denildiği gibi, 'Fabrika işi ev işinden daha zor değil'."
 canada_vanilla.1.title:0 "Ronnie, Bren Silahlı Kız"
 china.1.a:0 "Artık bıçak kemiğe dayandı!"
 china.1.b:0 "Japonya ile bir savaşı göze alamayız."
 china.1.b_tt_HBC:0 "§Y[HBC.GetNameDefCap]§!, topraklarını §Y[JAP.GetName]§! ülkesine teslim etmesi için baskı görecek"
 china.1.b_tt_SND:0 "§Y[SND.GetNameDefCap]§!, topraklarını §Y[JAP.GetName]§! ülkesine teslim etmesi için baskı görecek"
 china.1.d:0 "Japon askerleri kısa süre önce Pekin'in hemen güneybatısındaki stratejik Marco Polo Köprüsü'ne bir saldırı başlattı, ancak cesur askerlerimiz tarafından püskürtüldüler. Hiç şüphe yok ki bu, suçu bize atmayı ve Japonların Mançurya'yı işgal ettiği Mukden Olayı'nda olduğu gibi daha fazla toprak teslim etmeye zorlamayı amaçlayan düzenlenmiş bir olaydır. \n\nNasıl yanıt vermeliyiz?"
 china.1.t:0 "Marco Polo Köprüsü Olayı"
 china.10.a:0 "Uzun vadede onlara yardımcı olmayacak."
 china.10.d:0 "Bir saldırı başlatma planlarımız hakkında önceden bilgi edinen Kızıl Ordu hazırlıklıydı ve saldırımıza karşı koydu. Güç tabanımızın zayıf olduğu bu bölgede toplamayı başardığımız birlikler, komünist kuvvetleri yenmek için yetersiz kaldı. \nNe yazık ki, saldırı aleyhimize döndü ve uzun geri çekilmelerinden sonra Kızıl Ordu'nun toparlandığının bir işareti olarak görüldü."
 china.10.t:0 "Komünistler Saldırıyı Püskürttü"
 china.100.a:0 "Çin için!"
 china.100.d:0 "Japonya bir kedi gibi ilerleyip Kore'yi aldı. Yirmi bir talepleriyle bizi aşağılamaya çalıştılar, Mançurya'yı işgal ediyorlar ve şimdi tekrar ilerliyorlar. Artık yeter, Çin özgür olmak için sonuna kadar savaşacak. Halka yaptığı bir konuşmada, [Root.GetLeader], tüm [Root.GetAdjective] halkına seslenerek ya birlikte durmalarını ya da tek başlarına kesin bir felaketle yüzleşmelerini istedi."
 china.100.t:0 "Çin Tekrar Saldırı Altında"
 china.101.a:0 "Birlikten kuvvet doğar!"
 china.101.b:0 "İstilacıları püskürtmeliyiz!"
 china.101.d:0 "Ortak düşmanımız Japonlara karşı birlikte durma zamanı geldi. Küçük çekişmeleri bir kenara bırakıp güçlü, birleşik bir Çin olarak savaşalım!"
 china.101.t:0 "Çin Saldırı Altında"
 china.102.a:0 "Birlikten kuvvet doğar!"
 china.102.b:0 "Japon tehdidini birlikte püskürtelim."
 china.102.c:0 "Çıkarlarımız en iyi güçlü Sovyet tarafından korunur."
 china.102.d:0 "Sovyetler Birliği'nin Almanya'ya karşı savaşla meşgul olması nedeniyle, geçmişte olduğu kadar koruma sağlayamayacakları konusunda bilgilendirildik. KMT'nin desteğini almak ve Japonya'ya karşı savaşlarında onlara katılmak bizim çıkarımıza olacaktır."
 china.102.t:0 "Çin Saldırı Altında"
 china.103.a:0 "Birlikten kuvvet doğar!"
 china.103.d:0 "[From.GetName], Japonlara karşı mücadelede bize katılmayı seçti. Birlikte istilacıyı geri püskürteceğiz."
 china.103.t:0 "Çin Birleşiyor"
 china.104.a:0 "Birlikten kuvvet doğar!"
 china.104.b:0 "Japonya ile bizim yardımımız olmadan başa çıkmak zorunda kalacaklar."
 china.104.d:0 "Çin saldırı altında. Savaş ağaları, istilacı Japon kuvvetlerine karşı savaşmak için anlaşmazlıklarını bir kenara bırakıyor. Bu, ÇKP'nin çıkarlarını ilerletmek için bir fırsat; Çin halkına Çin'in gerçek geleceğinin yozlaşmış KMT değil, biz olduğumuzu gösterebiliriz. Savaşa katılıp Çin için bir gelecek sağlamalı mıyız?"
 china.104.t:0 "Çin Saldırı Altında"
 china.104.tt:0 "\nKuzey Çin ve Mançurya artık [Root.GetName] adına özgürleştirilebilir.\n"
 china.104_PRC_SOV_reinforcements:0 "Sovyetlerden 10 tümen alınacak."
 china.105.a:0 "Birlikten kuvvet doğar!"
 china.105.b:0 "Yaklaşan savaş sırasında ulusumuzun bir miktar kontrolünü onlara bırakacağız."
 china.105.d:0 "[From.GetName], Japonya'ya karşı mücadelede güçlerimizi birleştirmemizi istiyor. Zaten [From.GetFactionName]'ye katıldılar ve Japon işgaline karşı durmak için eski şikayetleri bir kenara bırakmaya hazırlar."
 china.105.t:0 "Çin Birleşiyor"
 china.106.a:0 "Japon şeytanlarını topraklarımızdan kovacağız."
 china.106.d:0 "[From.GetName], [Root.GetFactionName]'ne katıldı ve savaşmaya hazır."
 china.106.t:0 "Çin Birleşiyor"
 china.107.a:0 "Artık ortak bir düşmanımız yok."
 china.107.d_PRC_joined:0 "[Root.GetFactionName] amacına hizmet etti. Artık birleşik durulacak bir düşman yok. Mao Zedong, Kuzey Çin'deki topraklar üzerindeki hakimiyetini pekiştiriyor. Ancak zafer kazanmış ordularımıza karşı ne umutları olabilir ki?"
 china.107.d_PRC_refused:0 "Savaşın sona ermesiyle gerçek vatanseverler zafer kazandı. Biz kan dökerken saklananlarla hesaplaşma zamanı geldi."
 china.107.t:0 "Artık Birleşik Değil"
 china.107_tt:0 "@PRC §YÇin Halk Cumhuriyeti§!, §YKuzey Çin§! ve §YMançurya§!'daki Çin devletlerinin kontrolünü ele geçiriyor.\n"
 china.108.a:0 "Saflarımızı güçlendirmeliyiz."
 china.108.d:0 "Nefret edilen Japon köpeklerine karşı mücadeledeki rolümüz ÇKP'ye büyük prestij kazandırdı. Giderek daha fazla insan Çin için geleceğin biz olduğumuzu görüyor, özellikle yozlaşmış Kuomintang ile karşılaştırıldığında. Parti kadroları şimdiden bu insanları köylü denizinde yüzecek yeni bir orduya örgütlüyor."
 china.108.t:0 "Komünizm İlerliyor"
 china.108_PRC_SOV_reinforcements_2:0 "20 tümen al"
 china.109.a:0 "Savaşa!"
 china.109.d:0 "Çin'i Kuomintang denen hastalıktan kurtarma zamanı geldi. Her Çinliyi özgürleştirecek ve Mao'nun bilge liderliği altında birleşik bir halka sahip olacağız."
 china.109.t:0 "Çin İçin Savaş!"
 china.109_tt:0 "§YAnakara Çin üzerinde hak iddiaları kazan!§!\n"
 china.11.a:0 "Toparlanıp halkın güvenini yeniden kazanacağız."
 china.11.d:0 "Milliyetçi hükümeti destekleyen yerel olarak toplanmış birliklerin saldırısını püskürtme çabalarımıza rağmen, hazırlıklarımız bunu durdurmak için yetersiz kaldı. Önemli kayıplarla, daha kısa da olsa yeni bir geri çekilmeye zorlandık.\n\nTam olarak toparlanmadan milliyetçilerle yüzleşmek bir hata olmuş olabilir. Uzun Yürüyüş'teki muhteşem toparlanmamız destekçilerimize umut aşılamıştı, ama şimdi şüphe tohumları ekildi."
 china.11.t:0 "Kuomintang'a Karşı Yenilgi"
 china.110.a:0 "Savaşa!"
 china.110.d:0 "[From.GetName] ve [From.GetLeader] kabinesi bize savaş ilan etti."
 china.110.t:0 "[From.GetName] Savaş İlan Ediyor"
 china.111.a:0 "Artık ortak bir düşmanımız yok."
 china.111.d:0 "[Root.GetFactionName] amacına hizmet etti. Artık birleşik durulacak bir düşman yok. Zamanı akıllıca kullanarak Kuzey Çin ve Mançurya'daki desteğimizi artırdık ve şimdi bu bölgedeki kontrolümüzü resmileştirme zamanı."
 china.111.t:0 "Artık Birleşik Değil"
 china.12.a:0 "Siyasi İktidar, namlunun ucundadır."
 china.12.d:0 "Kuomintang saldırısına meydan okumak lehimize işledi. Kızıl Ordu ile yüzleşmek için gönderilen yerel olarak toplanmış birlikler, yaklaşan saldırı hakkındaki bilgimize hazırlıklı değildi ve yenildiler; bu da yakındaki savaş ağalarına bize saldırmanın maliyetli olabileceği konusunda bir uyarı oldu. \n\nMilliyetçiler sadece bizi bir düşman olarak hafife aldıklarını ve Halk Cumhuriyeti'nin bir kez daha yükselişte olduğunu kanıtladılar."
 china.12.t:0 "Kuomintang'a Karşı Zafer"
 china.13.a:0 "Artık çizgiyi çekmeliyiz!"
 china.13.b:0 "Başka bir çatışmayı göze alamayız."
 china.13.d:0 "Hem biz hem de Çin Kızıl Ordusu önceki saldırımızdan zar zor toparlanmışken, sınıra yakın karşılıklı asker varlığımız çatışmayı yeniden alevlendirdi. Yerel savaş ağaları ve milislerin yanı sıra, başka yerlerden daha fazla asker getirmeyi düşündük.\n\nBu bize komünist tehdidini kesin olarak ezme fırsatı vermese de, daha fazla genişlemelerine izin verilmeyeceğini göstermek önemli bir ideolojik zafer olacaktır."
 china.13.t:0 "Komünist Gerillalarla Çatışma"
 china.14.a:0 "Endişe verici."
 china.14.d:0 "Komünistlerin şu anda sığındıkları yerin dışına nüfuzlarını genişletmelerine izin verilmeyeceğini gösterme çabalarımıza rağmen, [From.GetName] sınırı boyunca çatışmayı kazanmak için yeterli kaynak ayıramadık.\n\nKomünist milislerle yaşanan düzensiz çatışmalar yavaş yavaş onların lehine döndü ve bu da sonunda durumu kontrol altında tuttuğumuzu gösterme kampanyasını başarısızlığa uğrattı. Halk destekleri artmaya devam ederse, komünistler gerçek bir tehdit haline gelebilir."
 china.14.t:0 "[From.GetName]'da Yenilgi"
 china.15.a:0 "Bu yakın zamanda unutulmayacak!"
 china.15.d:0 "Kontrolümüzdeki toprakların eteklerinde bir dizi küçük çaplı çatışmanın ardından, Kuomintang ile olan mücadele lehimize dönmüş görünüyor. Sürekli baskı uygulamak askerlerimiz ve ikmal hatlarımız için yorucu olsa da, çabalarımız boşa gitmedi. \n\nBelirleyici bir muharebe yaşanmadı, bu kez yavaş bir zafer kazandık; bu da davamıza olan inancı güçlendirdi ve devrimin ateşini bir kez daha körükledi."
 china.15.t:0 "[From.From.GetName]'da Zafer"
 china.16.a:0 "Devrim ölmekten çok uzak!"
 china.16.d:0 "Artan Kuomintang varlığına karşı dolaylı bir savaş yürütme çabalarımız felaketle sonuçlandı. Milliyetçiler, bizi geri püskürtme konusunda düşündüğümüzden daha kararlıydılar; belki de bu başarısızlığın itibarımız üzerindeki etkisini bekliyorlardı. Ordumuz şimdilik toparlanmak için güvende olsa da, kayıplar yerel halk tarafından fark edilmedi değil ve devrimin başarısızlığına dair söylentiler şimdiden yakındaki köylere yayılıyor."
 china.16.t:0 "[From.GetName]'da Yenilgi"
 china.17.a:0 "Umarım hatırlarlar."
 china.17.d:0 "Komünizm tehdidine karşı çizgiyi çekme çabalarımız başarılı oldu. ÇKP'nin güç üslerini çevreleyen bölgelerdeki asker varlığımızı artırmamıza yanıt olarak başlattığı gerilla kampanyaları, onları durdurma kararlılığımızı öngöremedi. Tamamen maliyetsiz olmasa da bu güç gösterisi, daha önce [From.GetLeader]'e ve partisine zımni destek veren birçok yerliyi, Çin'in asla böyle bir ideoloji altında birleşemeyeceğini fark etmeye ikna etti."
 china.17.t:0 "[From.From.GetName]'da Zafer"
 china.18.a:0 "Zamanımızı toparlanmakla harcayamayız."
 china.18.d:0 "Önceki saldırılarından henüz tam olarak kurtulamamışken, milliyetçiler sınırımıza yakın bölgelerdeki asker varlıklarını artırıyor gibi görünüyor. Açıkçası, bizi bir kez daha kontrol altına aldıklarını ve Büyük Yürüyüş'ün ÇKP'ye karşı nihai darbelerini sadece geciktirdiğini göstermeye çalışıyorlar. Halkın bunun doğru olduğunu düşünmesine izin veremeyiz."
 china.18.t:0 "Milliyetçi Ordu ile Çatışma"
 china.2.a:0 "Onlarsız da idare etmek zorunda kalacağız."
 china.2.d:0 "Almanya, Japon diplomatik baskısına boyun eğdi ve askeri danışmanlarını ülkemizden çekmeye karar verdi! Von Falkenhausen veda yemeğinde savaş planlarımızı Japonlara açıklamayacağına söz verdi, ancak Alman desteğinin sona ermesi ordumuza kesinlikle zarar verecektir."
 china.2.t:0 "Almanya Danışmanlarını Geri Çekiyor"
 china.200.a:0 "Birlikte milliyetçileri yeneceğiz!"
 china.200.d:0 "Milliyetçi Kuomintang'dan halkı özgürleştirmek için ayrıldıktan sonra, hareketi bölmemek için mevcut Çin Halk Cumhuriyeti ile güçlerimizi birleştirmeliyiz. Çin'in düşmanları bizi zayıflatmak için her zaman iç çekişmelerimize güvendi; yeni sosyalist devlet böyle bir hata yapmayacak!"
 china.200.t:0 "Çin Halk Cumhuriyeti'ne Katılma"
 china.201.a:0 "Yoldaşlarımızı korumak için katılmalıyız!"
 china.201.d:0 "Milliyetçi kontrolden kurtulduktan sonra, davamıza sempati duyan Çinli devrimciler, devletlerini [Root.GetLeader] liderliğinde bizimkiyle birleştirme kararı aldılar. Bundan böyle tek bir birleşik Çin Halk Cumhuriyeti olacak."
 china.201.t:0 "Komünist İsyancılar Cumhuriyete Katılıyor"
 china.202.a:0 "Bu komünist tehdidini bastırmalıyız!"
 china.202.d:0 "[CHI_communist_state.GetName]'daki artan komünist destek bir kırılma noktasına ulaştı. Hükümet tesisleri ele geçirildi ve isyancılar artık kendilerini [Root.GetName]'nin bir parçası olarak görmediklerini ilan ettiler. [CHI_communist_state.GetName]'nin tüm kontrolünü etkili bir şekilde komünist rejime kaybettik."
 china.202.t:0 "[CHI_communist_state.GetName]'da Komünist Ayaklanmalar"
 china.203.a:0 "Komünist kardeşlerimizi memnuniyetle karşılıyoruz!"
 china.203.d:0 "Milliyetçi kontrolden kurtulduktan sonra, davamıza sempati duyan Çinli devrimciler, devletlerini [Root.GetLeader] liderliğinde bizimkiyle birleştirme kararı aldılar. Bundan böyle tek bir birleşik [Root.GetName] olacak."
 china.203.t:0 "[CHI_communist_state.GetName]'da Komünist Ayaklanmalar"
 china.204.a:0 "Eski Kuzey Başkenti'nden yöneteceğiz."
 china.204.b:0 "Eski Güney Başkenti'nden yöneteceğiz."
 china.204.c:0 "Hükümet merkezini taşımaya gerek yok."
 china.204.d:0 "Çin İç Savaşı'nın sona ermesiyle, Çin'deki gücümüzü pekiştirme ve halka Orta Krallık'ın modern enkarnasyonu olduğumuzu gösterme zamanı geldi. Onları geleceğe taşıyacak devlet biziz.\n\nBu amaçla, büyük devletimize yakışır bir başkentimiz olmalı."
 china.204.t:0 "[Root.GetAdjective] Bir Başkent"
 china.3.a:0 "Çinli subaylar onların başlattığı işi bitirecek!"
 china.3.d:0 "Almanya ile kötüleşen ilişkilerimiz, tüm askeri danışmanlarını ülkemizden geri çağırmalarıyla sonuçlandı."
 china.3.t:0 "Kötü Çin - Alman İlişkileri"
 china.4.a:0 "Kurtulduk onlardan!"
 china.4.d:0 "Şimdi Almanya ile savaş halinde olduğumuz için, ülkemizde bulunan tüm askeri danışmanları gözaltına alındı. Von Falkenhausen ve birkaç yandaşı elimizden kurtulmayı başardı ve Avrupa'ya geri döndü!"
 china.4.t:0 "Askeri Danışmanlar Gözaltına Alındı"
 china.5.a:0 "Çok yaşa Halk Cumhuriyeti!"
 china.5.d:0 "Kızıl Ordu bir zamanlar umutsuz gibi görünen bir durumda hayatta kaldı, ancak birkaç yıl önceki Uzun Yürüyüş'ten bu yana durum yavaş yavaş değişti. Önemli toprak kazanımlarıyla birlikte, mazlum rolümüz artık geçmişte kaldı. Bu mücadele dönemini atlattıktan sonra, çaresizliğimiz artık geride kaldı. Mao Zedong, bir gerilla ordusu liderinden başkanlığa yükseldi."
 china.5.t:0 "Artık Köşeye Sıkışmış Değiliz"
 china.6.a:0 "Yerel savaş ağalarını saldırıya katılmaya zorla."
 china.6.b:0 "Bizim için savaşmaları için yerel haydutları askere al."
 china.6.c:0 "Komünistlere karşı çıkan yerel gönüllülere güven."
 china.6.d:0 "Çin Komünist Partisi'nin Kızıl Ordusu'nun uzun süren geri çekilmesinin ardından, Shaanxi'de yeniden toplanıp yerleşmeyi başardılar. Kırsal nüfusu bize karşı kışkırtma ve Sovyetler Birliği'nden destek arama çabaları, kendi hallerine bırakılırlarsa daha da güçlenebileceklerini gösteriyor. Ancak, hükümetimizi desteklemelerine rağmen çevredeki birçok savaş ağası, etkili bir saldırı için gerekli fedakarlıkları yapmaya isteksiz veya yetersiz.\n\nKızıl Ordu'nun hala toparlanma sürecinde mi yoksa bizimle savaşmaya hazır mı olduğu şu anda belirsiz, ancak zaman bizim lehimize değil. Siyasi konumumuzu güçlendirmek için komünistlere karşı saldırmalıyız."
 china.6.t:0 "Komünistlere Karşı Saldırı Hazırlığı"
 china.6.tt:0 "§YEğer ÇHC saldırıya karşı koymayı seçerse:§!\n"
 china.6.tt_2:0 "§YEğer ÇHC geri çekilmeyi seçerse:§!\n"
 china.7.a:0 "Elimizdeki her türlü imkanla saldırıya karşı koy!"
 china.7.b:0 "İnzivaya çekil."
 china.7.d:0 "Uzun Yürüyüş ile kesin bir yenilgiden kurtulmuş olsak da, milliyetçiler daha fazla çatışma olmadan güçlenmemize izin vermeyi planlamıyor. Casuslarımız bize karşı bir saldırı düzenlediklerini bildiriyor; eğer daha fazla geri çekilmeye çalışırsak bu durum siyasi desteğimizi zayıflatabilir.\n\nKuomintang'ın bizi şu anda ne kadar geri püskürtmeye kararlı olduğunu bilmiyoruz. Onlara karşı koymaya çalışmak önemli riskler taşıyor. Eğer yerel savaş ağaları saldırıyı desteklemek için toplanmışsa, şansımız zayıf olabilir. Öte yandan, sonunda durmuşken şimdi geri çekilmek bir seçenek olmayabilir."
 china.7.t:0 "Kuomintang Saldırı Başlatıyor"
 china.8.a:0 "Korkaklar!"
 china.8.d:0 "Planladığımız saldırıyı yerel casus ağları aracılığıyla öğrenen ÇKP, Kızıl Ordusunu Shaanxi'nin daha içlerine çekti. Bu, sayılarını daha da azaltma fırsatını elimizden alsa da, propagandalarının aksine komünistlerin bizimle yüzleşmeye hazır olmadığını gösterdi. Bir ölçüde, çaba yine de lehimize işledi."
 china.8.t:0 "Komünistler Geri Çekiliyor"
 china.9.a:0 "Haklı olarak!"
 china.9.d:0 "Kızıl Ordu'yu bozguna uğratma kararlılığımız, en azından şimdilik başarılı oldu. Saldırı hakkında bilgi edinmelerine rağmen, komünistler kuvvetlerimizle yüzleşmeye karar verdiler ve kaybettiler. Şimdi daha da geri çekilmek zorunda kaldılar ve yerel halkın çoğu, hükümetimizi devirme vaatlerini yerine getirme yetenekleri konusunda şüpheye düştü."
 china.9.t:0 "Komünistlere Karşı Zafer"
 churchill_plan_germany_tt:0 "Almanya üç ülkeye bölünecek. Bir Batı Alman Devleti, bir Kuzey Alman Devleti ve bir Güney Alman Devleti; ayrıca Avusturya-Macaristan İmparatorluğu'nun bazı kısımlarını da içerecek. Bunların hepsi Müttefik Etki Alanı'nda olacak, Orta ve Doğu Avrupa'nın geri kalanı ise [yalta_partner.GetAdjective] Etki Alanı'nda olacaktır. "
 country_capitulated.0.a:0 "Harika haber!"
 country_capitulated.0.b:0 "Bunlar karanlık zamanlar."
 country_capitulated.0.c:0 "Belirsiz zamanlar."
 country_capitulated.0.d_negative_both_no_faction:0 "\n[Root.GetLeader], [Root.GetAdjective] ulusunun ülke genelinde vahşet işleyen işgalci [From.From.GetAdjective] kuvvetlerinin baskısına daha fazla dayanamadığını duyurdu. [Root.GetAdjective] hükümeti sürgüne gitti. Ana kuvvetleri teslim oldu ve [From.From.GetNameDef] şimdi kendi ana bölgelerinin kontrolünü elinde tutuyor.\nBu yıkıcı kayba rağmen [From.From.GetNameDef]'e karşı savaş henüz bitmedi."
 country_capitulated.0.d_negative_collab_diff_ideology:0 "\n[Root.GetNameDefCap], [From.From.GetNameDef]'ye tamamen teslim olduğunu duyurdu. [Root.GetAdjective] hükümetinin yerli [From.From.GetRulingIdeology] sempatizanlarına karşı hoşgörüsünün, [Root.GetFascistLeader]'nin ülkeyi [From.From.GetLeader] adına yönetmek üzere göreve getirilmesi nedeniyle [Root.GetName]'nin düşüşüne katkıda bulunan bir faktör olduğu açıktır. \n[Root.GetLeader], bunun [Root.GetAdjective] egemenliğinin sonu olmadığını ve hükümetin kendi topraklarından sürgün edilmiş olsa bile tüm direniş çabalarını destekleyeceğini iddia ediyor."
 country_capitulated.0.d_negative_prev_faction:0 "\n[Root.GetLeader], [Root.GetAdjective] ulusunun ülke genelinde vahşet işleyen işgalci [From.From.GetAdjective] kuvvetlerinin baskısına daha fazla dayanamadığını duyurdu. [Root.GetAdjective] hükümeti sürgüne gitti. Ana kuvvetleri teslim oldu ve [From.From.GetNameDef] şimdi kendi ana bölgelerinin kontrolünü elinde tutuyor.\n[From.From.GetNameDef] ve [From.From.GetFactionName]'nin geri kalanına karşı savaş devam etse de, bu tüm [Root.GetFactionName] için talihsiz bir aksaklıktır."
 country_capitulated.0.d_negative_prev_no_faction:0 "\n[Root.GetLeader], [Root.GetAdjective] ulusunun ülke genelinde vahşet işleyen işgalci [From.From.GetAdjective] kuvvetlerinin baskısına daha fazla dayanamadığını duyurdu. [Root.GetAdjective] hükümeti sürgüne gitti. Ana kuvvetleri teslim oldu ve [From.From.GetNameDef] şimdi kendi ana bölgelerinin kontrolünü elinde tutuyor.\n[From.From.GetNameDef]'e karşı savaş devam etse de, bu tüm [Root.GetFactionName] için talihsiz bir aksaklıktır."
 country_capitulated.0.d_neutral_both_no_faction:0 "\n[Root.GetAdjective] hükûmeti sürgüne gitti ve ana kuvvetleri, artık anavatanlarının kontrolünü elinde tutan [From.From.GetNameDef]'e teslim oldu.\n\n[From.From.GetName] ile [Root.GetName] arasındaki mücadeleler sona ermiş olsa da, [From.From.GetNameDef] hala topyekûn bir savaşta ve çatışmalar başka yerlerde devam ediyor."
 country_capitulated.0.d_neutral_prev_faction:0 "\n[Root.GetAdjective] hükûmeti sürgüne gitti ve ana kuvvetleri, artık anavatanlarının kontrolünü elinde tutan [From.From.GetNameDef]'e teslim oldu.\n\n[From.From.GetNameDef] ile [Root.GetNameDef] arasındaki mücadele, çatışmanın sadece küçük bir parçasıydı. [From.From.GetFactionName] ile [Root.GetFactionName]'den geriye kalanlar arasındaki savaş başka yerlerde devam ediyor."
 country_capitulated.0.d_neutral_prev_no_faction:0 "\n[Root.GetAdjective] hükûmeti sürgüne gitti ve ana kuvvetleri, artık anavatanlarının kontrolünü elinde tutan [From.From.GetNameDef]'e teslim oldu.\n\n[Root.GetName]'deki mücadele, çatışmanın sadece küçük bir parçasıydı. [From.From.GetNameDef] ile [Root.GetFactionName]'den geriye kalanlar arasındaki savaş başka yerlerde devam ediyor."
 country_capitulated.0.d_positive_both_no_faction:0 "\n[From.From.GetLeader], korkak [Root.GetAdjective] ulusunun ülke genelindeki ezici [From.From.GetAdjective] kuvvetlerinin baskısına daha fazla dayanamadığını duyurdu. [Root.GetAdjective] hükümeti ülkeden kaçmayı seçti ve sürgüne gitti. Ana kuvvetleri teslim oldu ve [From.From.GetNameDef] şimdi kendi ana bölgelerinin kontrolünü elinde tutuyor.\nSavaş başka yerlerde devam etse de, bu [From.From.GetNameDef] için büyük bir zaferdir."
 country_capitulated.0.d_positive_collab_diff_ideology:0 "\n[Root.GetNameDefCap], [From.From.GetNameDef]'ye tamamen teslim olduğunu duyurdu. [From.From.GetAdjective] güçleri, bir dizi bağımsız [Root.GetAdjective] [From.From.GetRulingIdeology] destekçisiyle birlikte, [From.From.GetNameDef] ile işbirliği içinde [Root.GetNameDef]'yi yönetmek için yeni bir hükümet kurulduğundan [Root.GetLeader]'yi ve hükümetini sürgüne zorladı. [From.From.GetLeader], bu karşılıklı anlaşmanın [Root.GetNameDef]'ye yeni bir refah ve işbirliği çağı getireceğini belirtti.\n[Root.GetLeader], sürgünde bile [Root.GetNameDef] için savaşmaya devam edeceğini ve anavatanındaki tüm direniş çabalarını destekleyeceğini belirterek yanıt verdi."
