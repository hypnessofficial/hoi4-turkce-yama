 country_capitulated.0.d_positive_prev_no_faction:0 "\n[From.From.GetLeader] korkak [Root.GetAdjective] ulusunun ülke genelindeki ezici [From.From.GetAdjective] kuvvetlerinin baskısına daha fazla dayanamadığını duyurdu. [Root.GetAdjective] hükümeti ülkeden kaçmayı seçti ve sürgüne gitti. Ana kuvvetleri teslim oldu ve [From.From.GetNameDef] şimdi kendi ana bölgelerinin kontrolünü elinde tutuyor.\n[Root.GetFactionName]'nin geri kalanına karşı savaş başka yerlerde devam etse de, bu [From.From.GetNameDef] için büyük bir zaferdir."
