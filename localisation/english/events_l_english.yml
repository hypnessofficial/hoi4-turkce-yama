 AAT_germany.1.desc:0 "[FROM.GetNameDefCap] bize her iki ekonomiye de fayda sağlayacağını iddia ettikleri bir anlaşmayla yaklaştı. Endüstrileri için doğal kaynaklarımıza ihtiyaçları var ve bizim de endüstrimizi genişletmek için onların yatırımına ihtiyacımız var. Kârlı bir teklif, ancak bu bir şeytan pazarlığı mı?"
 AAT_germany.1.t:0 "[FROM.GetNameDefCap] kaynak hakları talepleri"
 AAT_germany.10.desc:0 "[144.GetName]'in [FROM.GetNameDef] ve yandaşları tarafından yakın zamanda işgal edilmesiyle, [GER.GetLeader] savaş makinelerine yakıt sağlamak için onlarla daha fazla kaynak ticareti yapmamız yönündeki baskısını artırdı. Teklif edilen anlaşma tamamen tek taraflı değil ve bunu reddetmek bizi savaşa sürükleyebilir..."
 AAT_germany.2.a:0 "Utanç verici"
 AAT_germany.2.desc:0 "[FROM.GetName], şu anda kendi çıkarlarına uygun olmadığını belirterek teklifimizi reddetti.\nBize karşı kötü niyetleri olmadığını, ancak bu hareketin başka öncelikleri olduğunu vurguladılar."
 AAT_germany.2.t:0 "[FROM.GetName] anlaşmamızı reddetti"
