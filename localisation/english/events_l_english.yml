 election.1.a:0 ""
 election.1.d:0 ""
 election.1.t:0 "GENEL SEÇİM"
 election.11.a:0 "[Root.GetName] için kara bir gün, ama halk konuştu."
 election.11.b:0 "Özgürlüğümüzü savaşmadan vermeyeceğiz!"
 election.11.d:0 "Bu seçim, temsil ettiği kurum için yıkıcı oldu. [Root.GetAdjective] nüfusunun çoğunluğu, seçimleri kaldırmayı ve otokratik bir yönetici kurmayı amaçlayan faşist bir partiye oy verdi. Birçoğu, kendilerine bu yetkiyi veren demokratik ideallerin bu ihlaline karşı silaha sarılmayı düşünürken, diğerleri şiddet kullanımının sadece ideallerini daha da doğrulayacağını düşünüyor."
 election.11.t:0 "Seçim: Faşist Çoğunluk"
 election.12.a:0 "Bu endişe verici, ama gerçekten çoğunluğu temsil ediyorlar."
 election.12.b:0 "Her türlü muhalif düşünce belirtisini ortadan kaldırmadan önce onları durdurmalıyız!"
 election.12.d:0 "Mevcut seçim komünist partilerin zaferiyle sonuçlandı ve eski yönetimden karışık tepkiler aldı. Yeni yöneticiler bir bütün olarak halkı temsil ettiklerini iddia etseler de, değer verdiğimiz birçok demokratik kurumu işçi sınıfını manipüle etme ve ezme girişimleri olarak görüyorlar; bu da gerçekten neyin 'halk yönetimi' teşkil ettiği konusunda tartışmalara yol açıyor. Bazı uluslarda devrim kan nehirlerinde başladı. [Root.GetName]'de başlamadı, ama yine de onlarla sonuçlanabilir."
 election.12.t:0 "Seçim: Komünist Çoğunluk"
 election.13.a:0 "İstediğini söyleyebilir, bunu onaylamak zorunda değiliz."
 election.13.b:0 "[Root.GetName]'i geliştirmek ve korumak için faşistlere güvenemeyiz."
 election.13.d:0 "Endüstriyel üretimimiz için birlikte çalışmayı seçtiğimiz şirketlerden birinin arkasındaki etkili bir sanayici, son zamanlarda yönetim üyelerinin endişe verici bulduğu bir dizi siyasi açıklama yaptı. Otoriter bir hükümeti açıkça savundu ve faşist olarak tanımlanan yabancı yönetimleri övdü; dolaylı olarak [Root.GetName]'nin böyle bir yönetimden faydalanacağını öne sürdü. Büyük sanayiciyi ve ideallerini kınamak şirketle ilişkimizi bozabilir, ancak onları kontrolsüz bırakmak, [Root.GetRulingParty]'nin temsil ettiği her şeyi aşındıran propaganda yayması için ona bir platform sunacaktır."
 election.13.t:0 "Seçim: Büyük Sanayici Faşizmi Destekliyor"
 election.14.a:0 "Seçimler her zamanki gibi yapılacak."
 election.14.b:0 "Bu savaş bittiğinde bu tür meselelerle ilgilenebiliriz."
 election.14.d:0 "[Root.GetName] savaş halinde. Normalde bu zamanda bir seçim yapılırdı, ancak önemli bir çatışmanın ortasındayken birçok kişi siyasi kampanya için zaman harcamayı veya bir liderlik değişikliği olması durumunda bunu göze alamayacağımızı savunuyor. Bu arada, diğerleri devam eden savaşı seçimleri atlamak için geçerli bir neden olarak ilan etmenin [Root.GetAdjective] demokrasisini aşındırmanın ilk adımı olduğunu iddia ediyor. Sonuçta, askeri meselelerin halkın etkisinin önüne geçmesine izin vermek kaygan bir zemin olabilir."
 election.14.t:0 "Seçim: Savaş Zamanı İstisnası"
 election.15.a:0 "Bu güven krizi son derece talihsiz."
 election.15.b:0 "Halkı birleşik tutmak için siyasi manzaranın değişmesine izin verin."
 election.15.d:0 "Yaklaşan bir seçimle birlikte, insanlar mevcut yönetimin devam eden savaşı sürdürme yeteneğini sorgulamaya başlıyor. [Root.GetName] büyük acılar çekti ve halkın görüşü, ulusumuzu yenilgiye götürüyor gibi görünenlere karşı döndü. Halkımız savaşı sonuna kadar götürmeye kararlı olsa da, savaşı başka bir hükümetin bitirmesini tercih ederler."
 election.15.t:0 "Seçim: Hükümet Tartışmalı"
 election.16.a:0 "Tek halk, tek lider."
 election.16.d:0 "Mevcut seçimle birlikte, muhalefet, var olduğu ölçüde, [Root.GetRulingParty]'nin giderek artan otoriter yönetimini eleştirdi. Seçmenlerin herhangi bir gücü olup olmadığını ya da her şeyin sadece bir gösteri olup olmadığını sorguluyorlar.\n\nAncak, [Root.GetLeader]'e olan destek yüksek kalmaya devam ediyor ve seçimin koşulları uluslararası toplum tarafından sorgulansa da, yurt içinde itiraz edilmedi. Görünüşe göre [Root.GetName] artık halk tarafından yönetilmese bile, halk yöneticisini destekliyor... en azından oy pusulalarına ulaşabilenler."
 election.16.t:0 "[Root.GetLeader] Halk Desteğine Sahip"
 election.17.a:0 "Bölücüler!"
 election.17.d:0 "[Root.GetLeader] rejimi muhaliflerinin çoğunu zorla susturmuş olsa da, bazıları hala son seçim hakkında konuşarak [Root.GetRulingParty]'yi sonuçları hileyle değiştirmekle ve politikalarına karşı çıkan bir parlamentoyu seçme yönündeki açık çabaları görmezden gelmekle suçluyor.\n\nHükümet bu itirazları halkı kendine karşı bölme çabası olarak bir kenara itiyor. Ancak, gerçek şu ki halkın çoğunluğunun yönetimleri hakkında çekinceleri var gibi görünüyor ve şimdilik susturulmuş olsa da muhalefet derdini anlattı."
 election.17.t:0 "Seçim Sonuçları Sorgulanıyor"
 election.2.a:0 "Halkın sesi duyulmalı."
 election.2.b:0 "Egemenliğimizi korumak her şeyden önce gelir."
 election.2.d:0 "Yaklaşan seçimlerde [Root.GetRulingParty]'ye destek hala yüksek, halk [Root.GetLeader]'in liderliğine güveniyor. Ancak partinin [Root.GetName]'nin askeri konulara odaklanmasını artırma arayışı halk arasında pek popüler olmadı ve vatandaşların önemli bir kısmı bunu yersiz bir şovenizm olarak görüyor. Savaş henüz sınırımıza ulaşmadı ve pek az kişi [Root.GetName]'nin saldırgan bir eylemde bulunmasını istiyor. Ulusun güvenliği konusunda endişelerimizi paylaşan diğer büyük partilerle işbirliği yaparak, seçimden sonra azalmış bir destekle de olsa iktidarda kalabileceğiz."
 election.2.t:0 "Seçim: Halk Yeniden Silahlanmaya Karşı"
 election.3.a:0 "Halkın güvende hissetme hakkı vardır."
 election.3.b:0 "Birçok kişi hala diplomatik çözümlerden yana."
 election.3.d:0 "Sınırlarımıza yaklaşan devam eden savaş yaklaşan seçimlere gölge düşürdü ve birçok seçmen [Root.GetName]'nin bu çatışmaya veya bundan doğabilecek herhangi bir şeye hazırlıklı olmadığı konusunda endişeli. Önlemlerimizi artırmamızı ve ulusumuzun savaşa hazır olmasını talep ediyorlar. Çoğunluk hala [Root.GetRulingParty]'yi desteklese de, endişelerini gidermezsek onları daha radikal unsurlara kaybedebiliriz."
 election.3.t:0 "Seçim: Halk Yeniden Silahlanma Talep Ediyor"
 election.4.a:0 "Komünistlerden iyidirler!"
 election.4.b:0 "Demokratik partilerin geniş bir koalisyonu tercih edilir."
 election.4.d:0 "[Root.GetName]'de saldırgan bir milliyetçi duygu büyüdü ve bu da faşist idealleri destekleyen birkaç partinin ortaya çıkmasına neden oldu: gücünü zorla uygulayan bir devlet. Bunlardan biri özellikle mevcut seçimlerde beğeni kazandı ve bu da [Root.GetRulingParty] partisi içinde onlarla hükümet kurma konusunda işbirliği yapıp yapmamamız gerektiği tartışmalarına yol açtı. Devletimizin temeli olan demokratik idealleri açıkça reddetseler de, seçime katılmayı seçmeleri bile görüşlerimize bir miktar güvenilirlik katıyor ve halk desteklerini kabul etmek onları şiddet eylemlerinden uzak tutabilir."
 election.4.t:0 "Seçim: Hükümette Faşistler mi Var?"
 election.5.a:0 "Devrimden ziyade reform!"
 election.5.b:0 "Demokratik partilerin geniş bir koalisyonu tercih edilir."
 election.5.d:0 "[Root.GetName]'deki komünist hareket, işçi sınıfı arasındaki yaygın hoşnutsuzluk ve akademisyenler arasındaki radikal eğilimlerle beslenerek birkaç partinin kurulmasına yol açacak kadar büyüdü. Bunlardan birinin mevcut seçimlerde önemli bir destek kazanmasının ardından, [Root.GetRulingParty]'deki politikacılar hükümet kurmada onların desteğini arayıp aramama konusunda tartışmaya başladılar. Demokratik kurumlarımızı burjuva tiranlığından biraz daha fazlası olarak görseler de, görmek istedikleri değişiklikleri hükümeti devirmek yerine onunla işbirliği yaparak yapmaya hevesli görünüyorlar."
 election.5.t:0 "Seçim: Hükümette Komünistler mi Var?"
 election.6.a:0 "[Root.GetName]'i güçlendirmek için faşistlerle çalışacağız."
 election.6.b:0 "Komünistlerle birleşerek sosyal değişimi kolaylaştırabiliriz."
 election.6.c:0 "Zayıf da olsa bir azınlık hükümeti tercih edilir."
 election.6.d:0 "[Root.GetName]'deki siyaset giderek radikalleşti. Bir zamanlar demokratik idealleri ve [Root.GetName]'nin temsili kurumlarını destekleyen partilere geniş bir destek varken, bu seçimde daha fazla seçmen siyasi aşırılıklara yöneldi. Siyasi merkezdeki partiler, farklılıklarını bir kenara bıraksalar bile artık çoğunluğu oluşturmuyor. Zayıf bir azınlık hükümetinden kaçınmak için faşistlerle ya da komünistlerle işbirliği yapmaktan başka seçeneğimiz yok."
 election.6.t:0 "Seçim: Demokratik Partiler Azınlıkta"
 election.7.a:0 "Daha büyük tehditlere karşı bazı müttefikler kullanabiliriz."
 election.7.b:0 "Böyle dostlarla düşmana ihtiyacımız olmazdı."
 election.7.d:0 "Faşistleri siyasi koalisyonumuza kabul etmek dış politikamızı etkiledi. Şiddetli milliyetçiliklerine rağmen, yurtdışında [Root.GetName]'de kendilerine verilen etkiyi onaylayan sempatizanları var. Benzer ideolojik eğilimlere sahip totaliter hükümetler bizi potansiyel müttefikler olarak görüyor. [Root.GetRulingParty]'nin ideallerine ne kadar hoşnutsuzluk duysa da, hükümetimizi destekleyen faşistlerin desteğini korumak için bu uluslarla bağları sürdürmek gerekebilir."
 election.7.t:0 "Faşistler Dış Politikayı Etkiliyor"
 election.8.a:0 "Ortak davalarımızı benimsemeliyiz."
 election.8.b:0 "Bu yolun sonunda [Root.GetName]'in kendisinin dağılması yatar."
 election.8.d:0 "Komünistler genellikle kendilerini uluslararası bir devrimin parçası olarak görürler ve onları hükümetimizde ortak olarak kabul etme seçimimiz birçok uluslararası müttefikinin dikkatini çekti. Komünist parti temsilcileri, proletarya diktatörlüğü lehine bizim hükümet biçimimizi terk etmiş uluslarla yakın bağlar sürdürüyor; eğer desteklerini korumak istiyorsak [Root.GetAdjective] dış politikasında bu bağları kabul etmemiz gerekebilir."
 election.8.t:0 "Komünistler Dış Politikayı Etkiliyor"
 establishing_vichy_tt:0 "§YVichy Fransası§! güney Fransa'da kurulacak. \n§YVichy Fransası§! tüm §YFransız sömürge topraklarını§! kazanacak.\n§YFransız§! kuvvetlerinin bir yüzdesi §YVichy Fransası§!'na devredilecek.\n(§YVichy Fransası§!):\n §YMouvement Franciste§! iktidar partisi olur.\n §YPhilippe Pétain§!, §YFaşist§! parti için lider olur.\n Ulusal Ruh §Yİşgal Maliyetleri§! kazanır, bu da (Sivil Fabrikalar: §Y%20§!) verir.\n Başkenti §YAuvergne§!'e taşır!"
 excellent:0 "Mükemmel."
 finland.1.a:0 "Taleplerini kabul etmekten başka seçeneğimiz yok."
 finland.1.b:0 "Cesaretleri varsa gelsinler!"
 finland.1.d:0 "[195.GetName] için bir güvenlik tamponu oluşturma ihtiyacını gerekçe gösteren [FROM.GetNameDef]'den yetkililer, sınırlarımızın revize edilmesini istediler. Karelya'yı onlara devretmemizi istiyorlar ve sınırımız boyunca yığılan [FROM.GetAdjective] kuvvetlerine bakılırsa, hayır cevabını kabul etmeyecekler. Nasıl yanıt vermeliyiz?"
 finland.1.t:0 "[FROM.GetAdjective]ler [146.GetName]'nı Talep Ediyor"
 finland.10.a:0 "Onları Paramparça Edin!"
 finland.10.d:0 "Sonunda, [SOV.GetNameDef]'in toprak hırsları, bu en aşağılık düşman tarafından ülkemizin işgaliyle sonuçlandı. Bu acımasız saldırıya karşı sağlam bir savunma oluşturmak için elimizdeki tüm önlemleri almalıyız. Topraklarımızdaki her ileri adım için bedel ödesinler!"
 finland.10.t:0 "Kış Savaşı"
 finland.2.a:0 "Aldığımız bu duruşa katkıda bulunmalılar."
 finland.2.b:0 "Eski zalimlerin yardımına ihtiyacımız yok."
 finland.2.d:0 "Finlandiya ve Sovyetler Birliği savaşta. Sadece birkaç on yıllık egemenliğin ardından, şimdi bir kez daha komşularımızdan birinin tebaası olma riskiyle karşı karşıyayız.\n\nAncak düşmanımızın tehdidi sınırlarımızın ötesine uzanıyor. İsveç'teki komşularımız hala Sovyetler Birliği'ne karşı tarafsız bir duruş sergiliyor, ancak belki de ortak mirasımızı savunmada bize katılmaya ve kendi stratejik tamponlarını güvence altına almaya ikna edilebilirler."
 finland.2.t:0 "Savaşta İsveç Yardımı Talep Et"
 finland.3.a:0 "Tarafsızlığımızı korumalıyız."
 finland.3.b:0 "Eğer halk desteği varsa, gönüllüler ve teçhizat gönderin."
 finland.3.c:0 "Finlandiya'nın davası bizim davamızdır! Savaşa!"
 finland.3.d:0 "Komşumuz Finlandiya, Sovyetler Birliği'nden gelen baskılara boyun eğmeyi reddetti ve uluslar şimdi savaş halinde. Ülkelerimiz arasında resmi bir ittifak anlaşması olmamasına rağmen, Finlandiya hükümeti İsveç'ten, büyük ölçüde İsveççe konuşan ve her iki ülke için de stratejik öneme sahip olan Åland'ın ortak savunmasına katkıda bulunmasını talep etti.\n\nHükümet Finlandiya'ya yardım etmek için hangi adımları atacağı konusunda bölünmüş olsa da, onların savunmasına yönelik halk desteği dikkate değer. Doğu saldırganlığına karşı İskandinav kardeşlerimizi korumak için ne kadar ileri gitmeye hazırız?"
 finland.3.t:0 "Finlandiya İsveç Desteği Arıyor"
 finland.4.a:0 "Umarım çok geç olmadan hatalarını fark ederler."
 finland.4.d:0 "İsveç hükümeti, Sovyetler Birliği'ne karşı savaşta yardım talebimize olumsuz yanıt verdi. Uluslararası ve iç yankılardan kaçınmak için tarafsız kalmayı tercih ederek, savaşa herhangi bir şekilde katkıda bulunmaya şimdiye kadar karşı çıktılar."
 finland.4.t:0 "İsveç Talebi Reddediyor"
 finland.5.a:0 "En azından bu beklenirdi."
 finland.5.d:0 "İsveç hükümeti Sovyetler Birliği'ne karşı savaşta bize katılmak istemedi, ancak komşularımız arasındaki halk desteği hala yüksek ve diğer İskandinav ülkelerinden birçok gönüllü savaş çabalarına yardımcı olmak için saflarımıza katılmayı teklif etti. Umduğumuzdan az olsa da, en azından karşı karşıya olduğumuz tehdit hakkında bir miktar halk farkındalığı var."
 finland.5.t:0 "İsveç Gönüllü Gönderiyor"
 finland.6.a:0 "Bu gün hatırlanacak."
 finland.6.d:0 "İsveç hükümetine Åland'ın ortak savunması yönündeki talebimiz beklentilerin üzerinde karşılandı. İsveç, böylesine bariz bir tehdit karşısında tarafsız kalmayı reddederek Sovyetler Birliği'ne karşı savaşta bize katıldı. İç anlaşmazlıklara rağmen, şimdi Finlandiya egemenliğini güvence altına almak için yan yana savaşacaklar."
 finland.6.t:0 "İsveç Savaşımıza Katılıyor"
 finland.7.a:0 "Bu savaşı kazanmanın bir yolu yok."
 finland.7.a_tt:0 "§Y Eğer [SOV.GetName] kabul ederse:\n§!"
 finland.7.b:0 "Savaşmaya devam etmeliyiz!"
 finland.7.d:0 "[Root.GetAdjective] komünist Hella Wuolijoki hükümetimizle temasa geçti ve [SOV.GetAdjective] rejimiyle temas kurmada yardımını teklif etti. İsveç'te gizli bir yerde bir toplantı ayarlandı; burada [Root.GetAdjective] egemenliğinin devamı karşılığında toprak devretme fırsatı bize sunulacak. \n\nFinlandiya kuvvetleri hızla tükeniyor ve daha önceki iletişim hattı açma girişimleri başarısız oldu. Bu, çatışmanın barışçıl çözümü için tek umudumuz olabilir."
 finland.7.t:0 "[SOV.GetNameDef] ile Barış Müzakereleri"
 finland.8.a:0 "Askerlerimize başka yerlerde ihtiyaç var."
 finland.8.b:0 "[From.GetNameDef]'in tamamına ihtiyacımız var."
 finland.8.d:0 "[From.GetNameDef] ile savaş maliyetli bir iş oldu, ancak [From.GetAdjective] ordusunu geri püskürtmeyi başardığımız için bize cazip bir teklif sundular. Stratejik olarak önemli bölgelerin kontrolü bize veriliyor, ancak birliklerimizi geri çekmemiz ve daha fazla düşmanlığı durdurmamız gerekiyor.\nBu, bölge üzerinde tam kontrol olmadan [From.GetNameDef]'e yönelik saldırımızı sona erdirecek, ancak karşılığında dünyanın diğer bölgelerinde etki alanımızı genişletmeye odaklanmamızı sağlayacaktır."
 finland.8.t:0 "[From.GetNameDefCap] Tavizler Sunuyor"
 finland.9.a:0 "Her adım için kanlarını dökecekler!"
 finland.9.d:0 "[From.GetNameDef] ile başlatılan müzakereler çöktü. Açıkçası bu, [From.GetAdjective] ordusu [Root.GetAdjective] topraklarına bir başka saldırı için pozisyon alırken zamanımızı boşa harcamak için bir hileydi.\n\n[Root.GetNameDef] dimdik ayakta duracak ve acı sona kadar savaşacaktır."
 finland.9.t:0 "[From.GetNameDefCap] Reddediyor"
 france.1.a:0 "Kabul etmekten başka seçeneğimiz yok."
 france.1.b:0 "Asla!"
 france.1.d:0 "Japon kuvvetleri Hindiçin'deki kolonimizin sınırları boyunca konumlanmış durumda ve üslerimize ve tesislerimize tam erişim talep ediyorlar! Taleplerini kabul edersek, Hindiçin'in kontrolünü fiilen onlara devretmiş oluruz. Öte yandan, bu konuda onlarla savaşacak gücümüz de pek yok."
 france.1.t:0 "Japonya Hindiçin'i Talep Ediyor"
 france.10.a:0 "Almanlarla işbirliği yapmalıyız."
 france.10.a_tt:0 "§YAlmanya ateşkesi kabul ederse Vichy Fransası olarak oyna§!\n"
 france.10.b:0 "Mücadele devam ediyor!"
 france.10.b_tt:0 "§YAlmanya ateşkesi kabul ederse Fransa olarak oyna§!\n"
 france.10.c:0 "İngiltere ile birleşelim!"
 france.10.d:0 "Savaş kaybedildi. Paris Almanların eline geçti ve ülkenin geri kalanının işgal edilmesi an meselesi. Şimdi geleceği düşünmeliyiz. Hükümet içindeki unsurlar Almanya ile bir ateşkes istiyor, ancak birçok subay mücadeleyi İngiltere'den sürdürmek istiyor.\n\nİngiliz Savaş Kabinesi'nin bazı üyeleri başka bir seçenek önerdi - Fransa ve Büyük Britanya'nın tek bir ulus olarak birleşmesi; bu ulus, tüm Fransa özgürleştirilene kadar savaşmaya devam edecektir."
 france.10.t:0 "Yenilgi"
 france.11.a:0 "Hayır. İngiltere İngiltere'dir, Fransa da Fransa."
 france.11.b:0 "Evet, eğer bu Fransızları savaşta tutacaksa!"
 france.11.d:0 "Fransa'daki durum vahim. Hükümetlerindeki birçok kişi Almanya ile bir ateşkes aramak istiyor, ancak bazıları İngiliz Savaş Kabinesi üyelerinin iki ulusumuzu birleştirme önerisine olumlu yanıt verdi. Bu Fransız-İngiliz Birliği, zafer elde edilene kadar Almanlara karşı mücadeleye devam edecektir. Nasıl yanıt vermeliyiz?"
 france.11.t:0 "Fransa Birlik Teklif Ediyor"
 france.12.a:0 "Londra'ya!"
 france.12.d:0 "İngiltere iki ulusumuzu birleştirmeyi kabul etti. Şu anda bile Londra'da yeni bir ortak hükümet kuruluyor."
 france.12.t:0 "İngiltere Birliği Kabul Ediyor"
 france.13.a:0 "İşbirliği yapmalıyız."
 france.13.b:0 "Mücadeleye devam etmeliyiz!"
 france.13.d:0 "İngiliz hükümeti, iki ulusumuzu birleştirme olasılığını reddetti. Bu noktada Almanya ile bir ateşkes kaçınılmazdır."
 france.13.t:0 "İngiltere Birliği Reddediyor"
 france.14.a:0 "Vichy Fransası'nı Kur."
 france.14.b:0 "Hayır, Almanya her şeyi fethedecek!"
 france.14.c:0 "Bourbon Fransası'nı Kur."
 france.14.d:0 "Fransa'daki zaferimiz neredeyse tamamlandı. Fransız hükümeti ateşkes talebinde bulundu ve diplomatlarımız onların kabul ettiği şartları hazırladı. Güney Fransa'nın kontrolünü ellerinde tutacaklar, biz ise geri kalanını işgal etmekte serbest olacağız."
 france.14.t:0 "Fransa'da Zafer"
 france.15.a:0 "Mahvolduk!"
 france.15.d:0 "Almanlar ateşkes talebimizi reddetti! Belli ki hepimizi köleleştirmek istiyorlar... sonuna kadar savaşmaktan başka seçeneğimiz yok!"
 france.15.t:0 "Almanya Ateşkesi Reddediyor!"
 france.16.a:0 "Daha kötülerini de gördük!"
 france.16.d:0 "Paris'teki son olayların çoğumuz üzerinde etkisi olduğu için, bir ulus olarak bir araya gelmemiz her zamankinden daha önemli. Ülkemizin durumuna bakmalı ve bu savaşın sonucunu kabul etmemeli, değiştirmeliyiz. \n\nGeçmişi unutun ve yeni ufuklara bakın. Önümüzdeki aylarda ne bekleyeceğimizi bilmiyoruz, ama birlikte yüzleşeceğiz!"
 france.16.t:0 "Birlikte Kalın, Güçlü Kalın!"
 france.17.a:0 "Memnuniyetle. Küçük Antant'ın yeniden inşa edilmesi gerekiyor."
 france.17.b:0 "[Root.GetName] kendi yolunda yürür."
 france.17.d:0 "Küçük Antant'ı - Çekoslovakya, Yugoslavya ve Romanya - güçlendirmek ve eski Merkezi Güçler tarafında olası bir saldırgan yayılmacılığın yeniden canlanmasını kontrol altına almak amacıyla Fransa, bu ulusları bir araya getirmeyi amaçlayan bir ittifaka katılmamızı talep etti."
 france.17.t:0 "Fransız İttifakına Davet"
 france.18.a:0 "Küçük Antant'ı yeniden inşa etmeye bir adım daha yaklaştık."
 france.18.d:0 "Küçük Antant ittifakının dağılmasını ve bizden uzaklaşmasını durdurma planımız ilerleme kaydediyor. [From.GetLeader] çabalarımızı onayladı ve ittifak davetimizi kabul etti."
 france.18.t:0 "[From.GetName] Fransız İttifakına Katılıyor"
 france.19.a:0 "Bildikleri kadarıyla zaten hedef olabilirler!"
 france.19.d:0 "Küçük Antant'a destek sunma yönündeki tüm çabalarımıza rağmen, uluslardan birine ulaşma yönündeki son girişimimiz şüpheyle karşılandı. [From.GetLeader] ittifaka katılmayı reddetti; belki de niyetlerimizden şüpheleniyor ya da bizimle çok yakınlaşmanın onları hedef haline getireceğinden endişe ediyor."
 france.19.t:0 "[From.GetName] Fransız İttifakını Reddediyor"
 france.2.a:0 "Belki de ittifakımızdan ayrılmamalıydılar."
 france.2.d:0 "Maginot Hattı'nı Manş Denizi'ne kadar uzatma planları tamamlandı ve inşaat emirleri verildi. Belçikalılar, sınırdan hazırlıklarımızı gördükten sonra resmi bir protestoda bulundular, ancak çalışmalar devam ediyor."
 france.2.t:0 "Maginot Hattı'nın Uzatılması"
 france.20.a:0 "Fransa için mücadele devam ediyor."
 france.20.a_tt:0 "§YCharles de Gaulle Fransa'nın lideri olur§!"
 france.20.d:0 "Fransa'nın Almanya ile ateşkes yapması ve Vichy Fransası'nda yeni bir hükümet kurulmasının ardından, bir grup üst düzey subay yeni Fransız hükümetine isyan etti. Charles de Gaulle bir radyo yayını yaparak işbirlikçi Vichy rejimine karşı direniş çağrısında bulundu. De Gaulle, Özgür Fransız Kuvvetleri'nin liderliğini fiilen üstleniyor ve Almanlara karşı mücadeleye devam ediyor."
 france.20.t:0 "Ateşkese Karşı Direniş"
 france.21.a:0 "Bırakın grev yapsınlar."
 france.21.b:0 "Bir anlaşma müzakere et."
 france.21.d:0 "Büyük bir fabrikada iki işçinin işten çıkarılmasının ardından, ülke genelinde işçiler ve fabrika sahipleri arasında mücadeleler patlak verdi. [Root.GetCommunistParty] tarafından desteklenen işçiler örgütlendi ve daha yüksek ücretler ve daha kısa çalışma haftaları gibi daha iyi koşullar talep ediyorlar. Bu, fabrikalarımızın üretimini büyük ölçüde azaltacak ve [Root.GetCommunistParty] için bir zafer olarak görülüyor. Müzakereler için Matignon'a davet edildik. Taleplerine boyun mu eğeceğiz yoksa diretip ülke çapında bir grevi mi riske atacağız?"
 france.21.t:0 "İşçiler Grevle Tehdit Ediyor"
 france.22.a:0 "Zamanla eskisi kadar verimli olacağız."
 france.22.b:0 "Haklarını iptal et ve sanayimizi derhal yoluna koy."
 france.22.d:0 "Yakın zamanda imzalanan Matignon anlaşmalarıyla sanayimizin Almanlarla rekabet etme imkanı kalmadı. Üretim kapasitesinde her geçen gün geride kalıyoruz. Bazı fabrika sahipleri, işçilerden çok az dirençle veya hiç dirençle karşılaşmadan Matignon Anlaşmaları'nda verilen bazı hakları yeniden müzakere etmeye başladılar. Yeni kazanılan işçi haklarını ülke çapında resmen iptal etme fırsatımız var, ancak onların bir kez daha [Root.GetCommunistParty]'nin arkasında toplanıp başka bir grevi desteklemelerini umma riskini alıyoruz. İşçilerin haklarını korumalarına izin vermek ve mevcut iş akışını optimize etmeye odaklanmak, Fransız halkını yeniden birleştirmeye ve birlikte büyümemize yardımcı olabilir."
 france.22.t:0 "Matignon Anlaşmalarını Yeniden Gözden Geçir"
 france.23.a:0 "Sonunda tekrar rekabet edebiliriz."
 france.23.d:0 "Çoğu işçi artık mantıksız taleplerinin karşılanmayacağını fark etti. Çocukları aç kalıyor ve [Root.GetCommunistParty] onları greve devam etmeye teşvik etse de, devam edecek kaynaklara sahip değiller. Her geçen gün işçiler pes ediyor ve fabrikalara geri dönüyor. Sanayimiz tam kapasiteye geri dönecek ve yakın zamanda grev olması pek olası değil."
 france.23.t:0 "Grevler Sona Erdi"
 france.24.a:0 "Fransa'da komünizmi yasakla."
 france.24.b:0 "Anlaşmazlıklar demokratik sürecin bir parçasıdır."
 france.24.d:0 "Birleşik bir Almanya ve Sovyetlerin oluşturduğu tehdit göz ardı edilemeyecek kadar büyük. İki ülkenin Polonya'nın paylaşımı konusundaki anlaşmasının ardından zor bir seçim yapmalıyız. Eğer [Root.GetCommunistParty]'nin şimdiye kadar olduğu gibi faaliyet göstermesine izin verirsek, Sovyetler güçlendikçe iç mücadeleye açık hale geliriz. Herhangi bir komünist faaliyeti veya [Root.GetCommunistParty] ile bağlantıyı yasaklayarak, barışa tehdit oluşturan hiç kimseye müsamaha göstermmeyeceğimizi tüm vatandaşlara güçlü bir sinyal göndermiş oluruz. \nGeleneksel olarak [Root.GetCommunistParty]'ni siyasi tartışmalara dahil edebildik, ancak Moskova'ya olan bağlılıklarından vazgeçmeyi reddettikleri için radikal önlemler alma zamanı gelmiş olabilir."
 france.24.t:0 "Komünist Tehdidi"
 france.25.a:0 "Barışı koruyacağız."
 france.25.b:0 "Özgürlük için direneceğiz."
 france.25.d:0 "Berlin'deki rejim, Yugoslavya ile aralarındaki sınır üzerindeki gerilimi tırmandırırken, İngilizler geri adım atmayı seçti. Ancak Yugoslavya, Doğu Avrupa düzeninin üzerine inşa edildiği üç sütundan biridir. Eğer zayıflarsa, Fransa'nın güvenliği zarar görecektir. Daha büyük güç olduğumuzu kanıtlayıp tek başımıza savaşma riskini almalı mıyız?"
 france.25.t:0 "Londra Konferansı"
 france.26.a:0 "Almanlara karşı durma zamanı geldi."
 france.26.b:0 "Bu yanlış bir dava."
 france.26.d:0 "Berlin'deki rejim, Yugoslavya ile aralarındaki sınır üzerindeki gerilimi tırmandırırken, İngilizler Alman saldırganlığına karşı durma kararı aldı. Ancak son savaşın yaraları henüz iyileşmedi ve ülkemiz derinden bölünmüş durumda; tek başımıza gidecek kadar güçlü müyüz?"
 france.26.t:0 "Londra Konferansı"
 france.27.a:0 "Pek seçeneğimiz yok."
 france.27.b:0 "Almanlar kısa görüşlü aptallar."
 france.27.d_1_state:0 "Almanya, toprağımıza yönelik İtalyan taleplerini kabul etti. Yenilgimizden sonra buna itiraz edecek durumda değiliz."
 france.27.d_both:0 "İtalya hem Savoy'u hem de Korsika'yı alacak. Almanya'dan gelen bu karar, sömürge valileri arasında bir sonraki kim olacak diye endişe yarattı. Suriye valisi öğrenmek için beklemedi ve Özgür Fransa'ya sığındı."
 france.27.t:0 "Almanya İtalyan Taleplerini Destekliyor"
 france.28.a:0 "Fransa kurtuluşa bir adım daha yaklaştı."
 france.28.d:0 "Almanya'nın Vichy topraklarını İtalya'ya verme kararının ardından Suriye yönetimi bizim tarafımıza geçmeyi seçti."
 france.28.t:0 "Suriye Sığınıyor"
 france.29.a:0 "Birlikte hattı tutacağız!"
 france.29.d:0 "'Tarih, büyük uluslarımız yan yana durduğunda ne kadar çok şey başarılabileceğini göstermiştir. Entente Cordiale ruhuyla, sizi sadece dost olarak değil, Müttefik olarak da ağırlamaktan gurur duyuyoruz. Birlikte, baskının karanlığıyla kuşatılmış bir dünyada parlayan bir özgürlük feneri olacağız!'\n\nİngiltere'ye Müttefik olarak katılma talebimiz kabul edildi. Önümüzdeki çalkantılı zamanlarda onların tam desteğine güvenebiliriz."
 france.29.t:0 "İngiltere Müttefiklik Talebini Kabul Ediyor"
 france.3.a:0 "Gelsinler bakalım!"
 france.3.d:0 "Alp Hattı'nın tahkimatlarını iyileştirme çalışmalarına başladık. Bu yeni savunmalar bittiğinde, İtalyanların sınırı geçmesi için deli olmaları gerekir!"
 france.3.t:0 "Alp Hattı'nın Uzatılması"
 france.30.a:0 "Onların 'barışı' sadece 'teslimiyet' için başka bir kelime."
 france.30.d:0 "'Geçmişte iyi ilişkilerimiz olsa da, kanalın diğer tarafındaki çatışmaların tırmanma riskini göze alamayız. Almanya, Deniz Paktımıza sadık kalarak güvenimizi kazandı ve ateşler yayılırsa kendimizi savunacak olsak da alevleri körükleme riskini almayacağız. Barış her zaman herhangi bir demokratik ulusun hedefi olmalıdır.'\n\nİngiltere'ye Müttefik olarak katılma talebimiz reddedildi. İngiliz hükümeti Almanya'yı daha fazla karşısına almak istemiyor ve mevcut barışı tehlikeye atmayacak."
 france.30.t:0 "İngiltere Müttefiklik Talebini Reddediyor"
 france.31.a:0 "Mösyö Reynaud bir hükümet kurmaya çalışacak."
 france.31.d:0 "Üçüncü Cumhuriyet'in çöküşü ve Alman hükümetinin Ateşkes teklifini reddetmesiyle, sömürgelerden mücadeleyi sürdürmek taze bir liderliğe düşmelidir. Mösyö Daladier'in iyi bir başbakan olduğundan pek az kişi şüphe duysa da, Fransa'nın kendini içinde bulduğu olağanüstü koşullarla başa çıkamadı. Tünelin sonunda bir ışık olması için ancak dua edebiliriz."
 france.31.t:0 "Édouard Daladier İstifa Ediyor"
 france.33.a:0 "Elbette, sadık müttefiklerimiz özgür bir halktır."
 france.33.b:0 "Anakarada sıkı güvenliği sürdürmemiz gerekiyor."
 france.33.desc:0 "Savaşın sona ermesiyle birlikte, Fransız ulusuyla yakın bir birlikteliği sürdürme ihtiyacı da ortadan kalkıyor. Fransız siyasi partileri giderek artan bir şekilde geçici bir hükümet kurulması ve genel seçim yapılması çağrısında bulunuyor."
 france.33.title:0 "Fransız Kurtuluşu"
 france.34.a:0 "Bravo!"
 france.34.b:0 "Anlıyorum."
 france.34.desc:0 "İngiltere barışa kavuşunca, [From.GetLeader] Fransız siyasi partilerinin geçici bir Fransız hükümetinin restorasyonu yönündeki taleplerini kabul etti. Siyasi entegrasyonları durduruldu, ancak hiç şüphe yok ki uluslar gelecekte yakın dost olmaya devam edecekler."
 france.34.title:0 "Fransız-İngiliz Birliği Sona Eriyor"
 generic.1.a:0 "İlginç"
 generic.1.b:0 "Buna nasıl cüret ederler!"
 generic.1.d_bad:0 "Uzun zamandır [From.GetAdjective] hükümeti ülkelerimizin yolunu birleştirmeye çalıştı ve sık sık [Root.GetName]'nin siyasetine karışmaya çalıştı. Son zamanlarda [From.GetRulingParty]'nin [From.GetRulingIdeology] propagandasını [Root.GetAdjective] siyasi geleneklerine saygı duymadan zorlamaya başlamasıyla bu durum yoğunlaştı. Bir dizi konuşma ve diğer [From.GetRulingIdeology] materyali şimdiden [Root.GetAdjective] halkına dağıtılıyor. Görünüşe göre bir dizi politikacı ve diğer yetkililer bile [From.GetAdjective] propagandasından etkileniyor ve [Root.GetName]'de [From.GetRulingIdeologyNoun]'nu savunmaya başladılar."
 generic.1.d_neutral_good:0 "Uzun zamandır [From.GetAdjective] hükümeti ülkelerimizin yolunu birleştirmeye çalıştı ve [Root.GetAdjective] siyasetine büyük ilgi gösterdi. Son zamanlarda [From.GetRulingParty]'nin [From.GetRulingIdeology] propagandasını [Root.GetAdjective] halkına dağıtılan bir dizi konuşma ve okuma materyaliyle zorlamaya başlamasıyla bu durum yoğunlaştı. \n\nŞimdi bir dizi politikacı ve diğer yetkililer bile [From.GetAdjective] propagandasından etkileniyor ve [Root.GetName]'de [From.GetRulingIdeologyNoun]'nu savunmaya başladılar."
 generic.1.t:0 "[From.GetName] Siyasetimizi Etkiliyor"
 generic.19.d:0 "[From.GetNameDefCap] davamızı desteklediklerini ve ortak düşmanlarımıza karşı konumumuzu güçlendirmek için bize belirli miktarda endüstriyel yardım sağlayacaklarını bildirdi."
 generic.19.t:0 "[From.GetName] Endüstriyel Destek gönderiyor"
 generic.2.a:0 "Özgürlük ve demokrasi için duran herkes bizimle durabilir."
 generic.2.b:0 "Dünya güçlü olan herkese aittir!"
 generic.2.c:0 "Eğer birlikte durursak, devrim ancak galip gelebilir."
 generic.2.d.a:0 "Özgürlüğe ve demokratik değerlere yönelik artan tehditler karşısında, [alliance_applicant.GetAdjective] halkı bizi özgürlüğün savunucuları olarak görüyor. Şimdi hem korumamızdan yararlanmak hem de demokrasiyi tehdit edecek güçlere karşı bizimle birlikte durmak için ittifakımıza kabul edilmek istiyorlar."
 generic.2.d.b:0 "Mevcut dünya düzenini yıkma çabamız benzer düşünen ulusların dikkatinden kaçmadı. [alliance_applicant.GetAdjective] halkı, kendileri için müreffeh bir gelecek oluşturmanın en iyi şansının yaklaşan çatışmada bizimle aynı safta yer almak olduğunu kabul ediyor ve bu nedenle düşmanlarımıza karşı bize resmen katılmayı teklif ettiler."
 generic.2.d.c:0 "[alliance_applicant.GetNameDefCap], dünyada Komünizmin yerini güçlendirmek için diğer sosyalist cumhuriyetlerle birleşmesi gerektiğini kabul etti. İşçinin uluslararası mücadelesindeki öncü rolümüzü kabul eden [alliance_applicant.GetAdjective] halkı şimdi resmen bizimle bir ittifaka girmeyi talep ediyor."
 generic.2.d.e:0 "Uluslararası siyasetteki mevcut kargaşalar dünya genelinde yankılanmaya devam ederken, [alliance_applicant.GetAdjective] halkı bu çalkantılı zamanlarda hayatta kalmak için en büyük şanslarının biz olduğumuzu düşündü. Bu nedenle, yaklaşan fırtınayı birlikte atlatabilmemiz için ittifakımıza kabul edilmeyi talep ediyorlar."
 generic.2.e:0 "Ve atlatacağız da!"
 generic.2.f:0 "Onlarsız daha iyiyiz."
 generic.2.g:0 "İhtiyacımız olan müttefiklere zaten sahibiz."
 generic.2.t:0 "[From.GetNameDefCap], [Root.GetFactionName]'ne Katılmak İstiyor"
 generic.20.a:0 "Onların taleplerine boyun eğiyoruz."
 generic.20.b:0 "Ben ilk olarak, yeni [From.GetAdjective] efendilerimize hoş geldiniz diyorum."
 generic.20.c:0 "Kesinlikle olmaz!"
 generic.20.d_enemies:0 "Bugün [From.GetNameDef]'ten [Root.GetLeader]'ın [From.GetLeader]'ı devlet başkanı olarak tanımasını ve ulusumuzun [From.GetAdjective] hükümetinin [Root.GetNameDef] vizyonuyla daha uyumlu bir şeye yeniden düzenlenmesini talep eden bir mesaj geldi. Kabul etmek bizi [From.GetNameDef]'in kuklası yapacaktır.\n\nSınır ötesindeki düşmanlarımıza bağımsızlığımızı teslim etmek istemesek de, mesajlarında [From.GetLeader]'ın taleplerini karşılamazsak yakında [From.GetNameDef] ile bir savaş halinde bulacağımıza inanmamıza yol açacak kesin bir tehdit unsuru var."
 generic.20.d_friends:0 "Bugün [From.GetLeader]'ın ülkelerimiz arasındaki ilişkileri genişletme ve [Root.GetAdjective] halkını [From.GetNameDef] ile birleştirmek için adımlar atma konusundaki ilgisini dile getiren bir heyet aldık. [From.GetLeader]'ın önerisini kabul etmek [Root.GetNameDef]'ı [From.GetNameDef]'ın orta derecede özerk bir kuklası yapacak ve hükümetimiz [From.GetLeader]'ın vizyonuyla daha uyumlu bir şeye yeniden düzenlenecek.\n\nSoru şu: [Root.GetAdjective] bağımsızlığı [From.GetNameDef] ile olan dostluğumuzdan daha mı önemli?"
 generic.20.t:0 "[From.GetNameDefCap] Boyun Eğmemizi İstiyor"
 generic.21.a:0 "Mükemmel."
 generic.21.d:0 "[From.GetAdjective] hükümeti bağımsızlıklarından vazgeçip [Root.GetNameDef]'in kukla devleti olmayı kabul etti. Bunun büyüklüğe yol açacağından ve [Root.GetAdjective]'in bölgeye olan ilgisini artıracağından eminiz."
 generic.21.t:0 "[From.GetNameDefCap] Boyun Eğiyor"
 generic.22.a:0 "Hayal kırıklığı."
 generic.22.d:0 "[From.GetNameDef] diplomatları bugün [From.GetNameDef]'i [Root.GetNameDef] ile birleştirme teklifimizi reddettiklerini duyurmak için geldiler. Hayal kırıklığı yaratsa da, [From.GetNameDef]'i zorla dizginleme seçeneği geçerli ve cazip bir seçenek olmaya devam ediyor."
 generic.22.t:0 "[From.GetNameDefCap] Reddediyor！"
 generic.23.a:0 "Başka seçeneğimiz yok."
 generic.23.b:0 "[demanded_prov_target.GetName] [Root.GetAdjective] kalacak!"
 generic.23.d:0 "Bugün [From.GetNameDef]'ten düşmanca bir heyet aldık. [demanded_prov_target.GetName] eyaletinin tamamının mülkiyetini talep ediyorlar. [From.GetLeader] derhal bölgeyi iade etmemizi talep ediyor, aksi takdirde savaş kaçınılmaz olacak. [demanded_prov_target.Owner.GetAdjective]'in bölgenin mülkiyetinin gayri meşru olduğunu ve [demanded_prov_target.GetName]'in [From.GetAdjective] eyaletinin ayrılmaz bir parçası olduğunu iddia ediyorlar.\n\nTaleplerini kabul edersek, [demanded_prov_target.GetName] [From.GetNameDef]'e devredilecek ancak bölge üzerindeki tüm çekirdeklerimizi veya iddialarımızı koruyacağız. Reddedersek, uluslarımız arasında savaş kaçınılmaz görünüyor."
 generic.23.t:0 "[From.GetNameDefCap], [demanded_prov_target.GetName]'ın Kontrolünü İstiyor"
 generic.24.d:0 "[From.GetNameDefCap], [demanded_prov_target.GetName]'e ilişkin haklı talebimizi kabul etmeye karar verdi ve bölgeyi [Root.GetNameDef]'e devretti.\nBu meselenin böylesine hızlı ve nazik bir şekilde ele alınmasıyla, [Root.GetNameDef] ile [From.GetNameDef] arasındaki barışın sonsuza dek süreceğinden eminiz."
 generic.24.t:0 "[demanded_prov_target.GetName] Devredildi!"
 generic.25.a:0 "Öyle ya da böyle [demanded_prov_target.GetName] bizim olacak."
 generic.25.d:0 "[From.GetNameDefCap] taleplerimizi reddetti ve şimdi işgal sözümüzü yerine getirip getirmemeye karar vermeliyiz. Sözümüzü yerine getirmemek [Root.GetLeader] hakkındaki kamu algısına ve [Root.GetAdjective] hükümetinin meşruiyetine büyük zarar verecektir."
 generic.25.t:0 "[From.GetNameDefCap] Reddediyor！"
 generic.3.a:0 "Birlikte demokrasiyi savunacağız."
 generic.3.b:0 "Kimse bize karşı duramaz!"
 generic.3.c:0 "İşçilerin mücadelesi daha iyi savunucular isteyemezdi!"
 generic.3.d:0 "[alliance_inviter.GetNameDefCap], [alliance_inviter.GetFactionName]'ne katılma talebimizi kabul etmeye karar verdi. Bundan böyle birlikte duracağız ya da birlikte düşeceğiz."
 generic.3.e:0 "Farklılıklarımızı bir kenara bırakacağız, şimdilik."
 generic.3.t:0 "[alliance_inviter.GetNameDefCap] bizi [alliance_inviter.GetFactionName]'ne kabul ediyor"
 generic.4.a:0 "Kendilerine özgürlük savunucuları mı diyorlar?"
 generic.4.b:0 "O zaman onları da ezeceğiz!"
 generic.4.c:0 "Devrimleri yozlaşmış!"
 generic.4.d:0 "[alliance_inviter.GetNameDefCap], [alliance_inviter.GetFactionName]'ne katılma talebimizi reddetmeye karar verdi. Onların yardımı olmadan idare etmek zorunda kalacağız."
 generic.4.e:0 "Farklılıklarımız çok büyüktü."
 generic.4.t:0 "[alliance_inviter.GetNameDefCap], [alliance_inviter.GetFactionName]'ne katılma talebini reddediyor"
 generic.5.a:0 "Onlarla birlikte duruşumuzu sergileyeceğiz."
 generic.5.b:0 "Sadece birkaç bin ölüye ihtiyacımız var..."
 generic.5.c:0 "Yoldaşlarımızın yanında savaşacağız!"
 generic.5.d.a:0 "Dünya siyasetindeki son gelişmelere şüpheyle bakan [alliance_inviter.GetNameDef], bize dostluk elini uzatıyor, korumasını sunuyor ve özgürlük ve demokrasi ilkelerini savunmada onlarla birlikte durmamızı istiyor. [alliance_inviter.GetFactionName]'nin bir üyesi olarak halkımızın özgürlüğü pekala güvence altına alınabilir."
 generic.5.d.b:0 "Bazen güçlülerin bile müttefiklere ihtiyacı olduğunu kabul eden [alliance_inviter.GetAdjective]ler, bizi [alliance_inviter.GetFactionName]'ne katılmaya davet etti. Kabul etmeyi seçersek, bu bize güneşteki yerimizi bulmak için bolca fırsat sunabilir."
 generic.5.d.c:0 "[alliance_inviter.GetNameDef]'deki ideolojik müttefiklerimiz işçi davasına değerli katkılarımızı fark etti ve bu sabah [alliance_inviter.GetFactionName]'ne katılmamız için bir davet aldık. Diğer sosyalist cumhuriyetlerle birlikte durarak devrimi yenilenmiş bir güçle yayabiliriz."
 generic.5.d.e:0 "Görünüşe göre [alliance_inviter.GetAdjective]ler bizi kendileri için stratejik bir çıkar olarak görüyor ve ideolojik farklılıklarımızla bölünmemize izin vermek yerine birlikte çalışmamızın daha karlı olacağını düşünüyorlar. Bu sabah, [alliance_inviter.GetAdjective] Büyükelçisi [alliance_inviter.GetFactionName]'nin bir üye devleti olmamız için bir davet iletti."
 generic.5.e:0 "Bu karlı bir seçim."
 generic.5.t:0 "[From.GetNameDefCap], [Root.GetNameDef] ülkesini [From.GetFactionName] ittifakına davet ediyor"
 generic.5.t.backup:0 "[From.GetNameDefCap] bizi ittifakına davet ediyor"
 generic.6.d:0 "[alliance_applicant.GetNameDefCap], [alliance_inviter.GetFactionName]'ne katılma teklifimizi kabul etmeye karar verdi. Bundan böyle birlikte duracağız ya da birlikte düşeceğiz."
 generic.6.t:0 "[alliance_applicant.GetNameDefCap], [alliance_inviter.GetFactionName]'ne daveti kabul ediyor"
 generic.7.a:0 "Yardımımız istenmiyor."
 generic.7.d:0 "[alliance_applicant.GetNameDefCap], [alliance_inviter.GetFactionName]'ne katılma teklifimizi reddetmeye karar verdi. Onların yardımı olmadan idare etmek zorunda kalacağız."
 generic.7.t:0 "[alliance_applicant.GetNameDefCap], [alliance_inviter.GetFactionName]'ne katılma teklifini reddediyor"
 generic_purchase_ships_events.01.a:0 "Karşılıklı fayda sağlayan bir anlaşma."
 generic_purchase_ships_events.01.b:0 "Deniz kuvvetlerinden hiç kimseyi ayıramayız."
 generic_purchase_ships_events.01.desc:0 "[FROM.GetNameDefCap], güvelenmiş deniz varlıklarımızdan bazılarını tedarik etmek için bize bir teklifle yaklaştı. İlgilendikleri varlıklar, yaşları ve modern ekipman eksikliği nedeniyle artık hizmette değil."
 generic_purchase_ships_events.01.t:0 "[FROM.GetAdjective] Donanma Tedariki"
 generic_purchase_ships_events.02.a:0 "Harika bir haber!"
 generic_purchase_ships_events.02.desc:0 "[FROM.GetAdjective] diplomatları ve deniz personeli, satın almayı teklif ettiğimiz naftalinlenmiş ekipmanlarını bize vereceklerini bildirdiler. Bu, yeni kurulan donanmamızı hızla genişletmemize olanak tanıyacak."
 generic_purchase_ships_events.02.t:0 "[FROM.GetNameDefCap] Donanma Tedarikini Kabul Etti"
 generic_purchase_ships_events.03.a:0 "Talihsizlik."
 generic_purchase_ships_events.03.desc:0 "[FROM.GetAdjective] diplomatları bize satın almayı teklif ettiğimiz naftalinlenmiş ekipmandan ayrılmak istemediklerini bildirdiler. Reddetmenin gemiler için kendi planlarından mı kaynaklandığı yoksa politikalarımızı onaylamadıklarının bir işareti olarak mı amaçlandığı belirsizdir."
 generic_purchase_ships_events.03.t:0 "[FROM.GetNameDefCap] Donanma Tedarik Anlaşmasını Reddetti"
 generic_purchase_ships_events.04.a:0 "Karşılıklı fayda sağlayan bir anlaşma."
 generic_purchase_ships_events.04.b:0 "Deniz kuvvetlerinden hiç kimseyi ayıramayız."
 generic_purchase_ships_events.04.desc.a:0 "[FROM.GetNameDefCap], naftalinlenmiş sermaye gemilerimizden bazılarını tedarik etmek için bize bir teklifle yaklaştı. İlgilendikleri varlıklar, yaşları ve modern ekipman eksikliği nedeniyle artık hizmette değil. Ancak varlıkları [FROM.GetNameDef]'e satarak, bölgede zaten kötüleşen bir deniz silahlanma yarışını tırmandırma riskini göze alıyoruz."
 generic_purchase_ships_events.04.desc.b:0 "[FROM.GetNameDefCap], naftalinlenmiş sermaye gemilerimizden bazılarını tedarik etmek için bize bir teklifle yaklaştı. İlgilendikleri varlıklar, yaşları ve modern ekipman eksikliği nedeniyle artık hizmette değil."
 generic_purchase_ships_events.04.t:0 "[FROM.GetAdjective] Donanma Tedariki"
 generic_purchase_ships_events.05.a:0 "Harika bir haber!"
 generic_purchase_ships_events.05.desc:0 "[FROM.GetAdjective] diplomatları ve donanma personeli, satın almayı teklif ettiğimiz naftalinlenmiş dretnotlarını bize vereceklerini bildirdiler. Bu, donanmamızı hızla genişletmemize ve komşularımıza karşı üstünlüğümüzü korumamıza olanak tanıyacak."
 generic_purchase_ships_events.05.t:0 "[FROM.GetNameDefCap] Dretnot Tedarikini Kabul Etti"
 generic_purchase_ships_events.06.a:0 "Talihsizlik."
 generic_purchase_ships_events.06.desc:0 "[FROM.GetAdjective] diplomatları bize satın almayı teklif ettiğimiz naftalinlenmiş dretnotlardan ayrılmaya isteksiz olduklarını bildirdiler. Reddetmenin gemiler için kendi planlarından mı kaynaklandığı yoksa politikalarımızı onaylamadıklarının bir işareti olarak mı amaçlandığı belirsiz."
 generic_purchase_ships_events.06.t:0 "[FROM.GetNameDefCap] Dretnot Tedarik Anlaşmasını Reddetti"
 germany.100.a:0 "Bulgaristan'ı bize bağlayalım."
 germany.100.b:0 "Dostluğumuzu hak etmeleri gerekiyor."
 germany.100.d:0 "Bulgaristan'ın kendi toprağı olarak gördüğü topraklar, İkinci Balkan Savaşı ve Büyük Savaş'tan sonra Yunanistan'a verildi. Bu yanlışı düzeltirsek Bulgaristan'ı bize bağlarız. Ancak, kendi başlarına talep edecek kadar güçlü değillerse, bizim için değerli bir müttefik olabilirler mi?"
 germany.100.t:0 "[BUL.GetNameDef] ile Yunanistan'ı Paylaş"
 germany.1002.b:0 "Polonya bizimdir!"
 germany.1002.desc:0 "Almanya ve [SOU.GetNameDef] zaten Polonya'yı doğu ve batı yarıları arasında paylaştırma konusunda anlaşmalar yapmıştı, ancak doğuyu işgalimiz bu düzenlemede bir karmaşıklığa neden oldu. Alman müttefiklerimiz vaat edilen Polonya topraklarını [SOU.GetNameDef]'e teslim etmemizi tam olarak beklese de, bunun yerine paktı bozup işgalimize devam edebiliriz."
 germany.1002.t:0 "Molotov-Ribbentrop Paktı'na Sadık Kalınsın mı?"
 germany.1003.a:0 "Şimdi onların küstahlığının bedelini ödemeliyiz."
 germany.1003.desc:0 "Doğu Polonya'yı [SOU.GetNameDef]'e devretme kararına rağmen, [From.GetNameDef]'deki müttefiklerimiz Polonya'yı işgal etmeye devam etmeyi seçerek Molotov-Ribbentrop paktını resmen bozdular!"
 germany.1003.t:0 "[From.GetNameDefCap] Paktı Bozuyor!"
 germany.101.a:0 "Almanya'ya üsleri teslim etmeliler."
 germany.101.b:0 "Uzun vadeli oynamalıyız."
 germany.101.d:0 "Uygun müttefiklerin eksikliği Almanya'yı Doğu Akdeniz'de talihsiz bir stratejik konuma bırakıyor. Ancak, Yunanistan'dan üsler ve çevresindeki toprakları talep ederek bunu düzeltebilir ve onları güvence altına alabiliriz."
 germany.101.t:0 "Yunan Toprağı Talep Et"
 germany.101_tt:0 "§YEğer Yunanistan kabul ederse, aşağıdakiler gerçekleşecektir:§!"
 germany.102.a:0 "Alternatifi fark etmiş olmalılar."
 germany.102.d:0 "Yunanistan, sınır anlaşmazlıklarını çözme konusundaki yardımımızı aptalca reddetti."
 germany.102.t:0 "Yunanistan Reddediyor"
 germany.103.a:0 "Onları mantığa zorlamalıyız."
 germany.103.d:0 "Yunanistan cömert koruma ve yardım teklifimizi reddetti."
 germany.103.t:0 "Yunanistan Reddediyor"
 germany.104.a:0 "Sanırım Savoy'u alabilirler."
 germany.104.b:0 "Değerleri ancak Korsika kadar."
 germany.104.c:0 "Bırakın Savoy'u alsınlar."
 germany.104.d_Corsica:0 "İtalyanlar ganimet payları olarak Vichy'den Korsika Adası'nı talep ediyor. Onlara verebilir miyiz?"
 germany.104.d_Savoy:0 "İtalyanlar zaferimizin ardından Vichy Fransası'ndan taleplerde bulunmaya başladı. İtalya'yı güçlendirmek için Savoy sınır bölgesini istiyorlar. Ancak, buna karar verecek olan biziz."
 germany.104.d_Savoy_Corsica:0 "İtalya, Vichy'nin Savoy ve Korsika'yı teslim etmesini talep etti. Bu İtalya için bir lütuf olurdu ama bu Fransız sömürge yetkililerini endişelendirecektir."
 germany.104.e:0 "Güçlü bir müttefik, güçlü bir Almanya demektir."
 germany.104.f:0 "Birkaç bin ölüden fazlasına ihtiyaçları var."
 germany.104.t:0 "İtalya Vichy Toprağı Talep Ediyor"
 germany.1041.a:0 "Başka seçeneğimiz yok."
 germany.1041.b:0 "[GetSudetenlandRejectOption]"
 germany.1041.b_ally_of_ger:0 "Toprak kazanımlarımızdan vazgeçmeyeceğiz."
 germany.1041.b_default:0 "[FROM.GetAdjective] savaş makinesi burada duruyor."
 germany.1041.desc:0 "Çek sınırlarında son dönemde yaşanan çalkantılara rağmen, [FROM.GetAdjective] dış politika sarsılmaz kaldı. [FROM.GetAdjective] diplomatları bize bir ültimatom sundular - Südetland'ı teslim edin, yoksa savaş ilan edilecek."
 germany.1041.desc_ally_or_subject:0 "Çek sınırlarında son dönemde yaşanan çalkantılara rağmen, [FROM.GetAdjective] dış politika sarsılmaz kaldı. [FROM.GetAdjective] diplomatlar, Südetland'ı gecikmeden teslim etmemizi bekleyerek toprak taleplerini bize ilettiler."
 germany.1041.t:0 "[FROM.GetNameDefCap] Talepleri Sudetenland"
 germany.1042.a:0 "Mükemmel."
 germany.1042.desc_ally:0 "[ROOT.GetAdjective] gücünün sınırı yok - daha önce [FROM.GetAdjective] etki alanında olan Sudetenland bölgesi artık bize devredildi. [FROM.GetLeader] ve [FROM.GetAdjective] diplomatlarının bunun [ROOT.GetFactionName] için en iyisi olduğunu anlamaları uzun sürmedi."
 germany.1042.desc_default:0 "[ROOT.GetAdjective] gücünün sınırı yok - daha önce [FROM.GetAdjective] etki alanında olan Sudetenland bölgesi artık bize devredildi. [FROM.GetNameDefCap] görüş alanımız dışında kalmaya devam ediyor. Şimdilik."
 germany.1042.desc_subject:0 "[ROOT.GetAdjective] kudreti sınır tanımıyor - daha önce [FROM.GetAdjective] kontrolü altında olan Sudetenland bölgesi artık bize devredildi. [FROM.GetNameDef]'teki kukla hükümdarımız [FROM.GetLeader], yerel otoritelerin ve [FROM.GetAdjective] örgütlerinin anlaşmaya itiraz etmeden uymasını sağladı."
 germany.1042.t:0 "[FROM.GetNameDefCap] Gönderileri"
 germany.1043.a:0 "Kahretsin."
 germany.1043.desc:0 "Güç dengesizliğine rağmen, [FROM.GetAdjective] diplomatları Sudetenland'ın devredilmesi taleplerimizi reddettiler. Savaşın kaçınılmaz olduğu kesindir."
 germany.1043.desc_ally:0 "[ROOT.GetFactionName] üyelerinin hepsinin en iyi çıkarına olmasına rağmen, [FROM.GetAdjective] diplomatları Sudetenland'ın devredilmesi taleplerimizi reddetti. Müttefiklerimizin özerkliğine saygı göstermemiz gerektiği göz önüne alındığında, şu anda yapılabilecek pek bir şey yok."
 germany.1043.t:0 "[FROM.GetNameDefCap] Talepleri Reddetti"
 germany.105.a:0 "Zaten pek savaşmıyorlardı."
 germany.105.d:0 "İtalya'ya herhangi bir toprak vermeme kararımızın ardından, bizim için yeterince değerli müttefikler olmadığımızı söyleyerek [Root.GetFactionName]'nden ayrılmayı seçtiler."
 germany.105.t:0 "İtalya [Root.GetFactionName]'nden Ayrılıyor"
 germany.1050.a:0 "$GER_karl_donitz$ Führer'in tercih ettiği halefiydi."
 germany.1050.b:0 "$GER_albert_speer$ Führer'in emellerini gerçekleştirecek."
 germany.1050.c:0 "$GER_heinz_guderian$ bizi bu karmaşadan kurtaracak."
 germany.1050.desc:0 "Führer, $GER_adolf_hitler$, sığınağında ölü bulundu. Düşman güçleri yaklaşırken, Führer yakalanma riskine girmektense kendi canına kıymaya karar vermiş gibi görünüyor. Askerlerin moral bozukluğunu önlemek için, propaganda yayın organlarımıza Hitler'in ezici düşman güçleri karşısında son nefesine kadar kahramanca savaşarak öldüğü bilgisi veriliyor. Ancak, daha acil sorunumuz Führer'in yerine kimin geçeceği?"
 germany.1050.t:0 "Führer'in Ölümü"
 germany.106.a:0 "Güney Dobruca'yı talep etmelerine izin verin."
 germany.106.b:0 "Hiçbir Bulgar talebini desteklemeyeceğiz."
 germany.106.d_no_vienna:0 "Macaristan ile ilişkiler soğuduğundan ve başka bir ittifaka katılmayı seçtiklerinden, onlara Transilvanya'nın bir kısmını verme orijinal planımız söz konusu olamaz. Bunun yerine, 1913'te Romanya tarafından ele geçirilen Güney Dobruca için Bulgar toprak anlaşmazlığına kulak vermeliyiz."
 germany.106.d_second_vienna_accepted_all:0 "Macaristan'ın Transilvanya'yı kazanmasıyla Bulgaristan, 1913'te Romanya tarafından ele geçirilen Güney Dobruca üzerindeki uzun süredir devam eden sınır anlaşmazlıklarını bize hatırlattı."
 germany.106.d_second_vienna_accepted_north:0 "Macaristan'ın Kuzey Transilvanya'yı kazanmasıyla Bulgaristan, 1913'te Romanya tarafından ele geçirilen Güney Dobruca üzerindeki uzun süredir devam eden sınır anlaşmazlıklarını bize hatırlattı."
 germany.106.t:0 "Krayova Antlaşması"
 germany.106_threat:0 "Krayova Antlaşması"
 germany.107.a:0 "Delilik!"
 germany.107.d:0 "Führer Yardımcısı Rudolf Hess, dün İskoçya'da bir ağır avcı uçağından paraşütle atladıktan sonra İç Güvenlik askerleri tarafından tutuklandı. Usta bir pilot olan Hess, görünüşe göre Kuzey Denizi'ni tek başına geçmiş, Britanya'ya doğru batıya yönelmeden önce radar menzilinin dışında kalmaya özen göstermiş.\nHess, İngiltere ve Almanya arasında bir barış antlaşması müzakere etmeyi kendi üzerine almış gibi görünüyor, ancak Berlin onu bir deli olarak kınadı ve tüm siyasi görevlerinden aldı. İngiliz yetkililer yorum yapmak için hazır bulunmadı."
 germany.107.t:0 "Rudolf Hess'in Uçuşu"
 germany.108.a:0 "Zavallı aptal."
 germany.108.d:0 "Führer Yardımcısı Rudolf Hess, dün kullandığı ağır avcı uçağının İskoçya kıyılarında Kraliyet Hava Kuvvetleri tarafından düşürülmesi sonucu öldü. Görevinin tam niteliği belirsizliğini koruyor - Hess usta bir pilot olmasına rağmen tek başına uçuyordu ve uçağı silahlı görünmüyordu.\nCesedi İngiliz yetkililer tarafından bulundu, ancak Berlin'de boş bir tabutla devlet cenazesi planlandı. \n\nHitler'in eski dostunun ölümüyle gözle görülür şekilde perişan olduğu bildirildi."
 germany.108.t:0 "Rudolf Hess'in Ölümü"
 germany.109.d:0 "Düşmanlıkların başlamasından bu yana Almanya'da demirli olan Hindenburg zeplini, bugün İskoçya üzerinde patladığında dramatik bir sonla karşılaştı. Görünüşe göre, İngiltere ile barış müzakeresi yapmak için kişisel bir görevle Kuzey Denizi'ni tek başına geçen Führer Yardımcısı Rudolf Hess tarafından ele geçirilmişti.\nİngiliz radar istasyonları devasa hava aracını tespit etmekte zorlanmadı ve birkaç Kraliyet Hava Kuvvetleri filosu derhal konumuna yönlendirildi. Hindenburg telsize yanıt vermeyince ateş açtılar. \n\nHess paraşütle güvenli bir şekilde atladı ve şimdi Londra Kulesi'nde hapsedildi."
 germany.11.a:0 "Antlaşmayı imzala."
 germany.11.a.tt:0 "§RPakt yürürlükteyken, Kapalı Ekonomi ticaret politikası kullanılamayacaktır.§!\n"
 germany.11.b:0 "Faşistlerle anlaşma yok!"
 germany.11.d:0 "Alman Dışişleri Bakanlığı, iki ulusumuz arasında bir saldırmazlık paktı önerdi. Bu antlaşma karşılıklı ticaretimizi büyük ölçüde artıracak ve ek bir gizli protokol, Doğu Avrupa'nın Alman ve Sovyet etki alanlarına bölünmesini öneriyor.\n\nBerlin'deki faşistler güvenilir olmasa da, bu pakt Finlandiya, Baltık Devletleri ve Romanya ile dış müdahale korkusu olmadan ilgilenmemizi sağlayacaktır. Polonya'nın doğu toprakları da bir Polonya çöküşü durumunda bize kalacaktır."
 germany.11.t:0 "Molotov-Ribbentrop Paktı"
 germany.110.a:0 "O deli adam..."
 germany.110.d:0 "Düşmanlıkların başlamasından bu yana Almanya'da demirli olan Hindenburg zeplini, bugün İskoçya üzerinde patladığında dramatik bir sonla karşılaştı. Görünüşe göre, İngiltere ile barış müzakeresi yapmak için kişisel bir görevle Kuzey Denizi'ni tek başına geçen Führer Yardımcısı Rudolf Hess tarafından ele geçirilmişti.\nİngiliz radar istasyonları devasa hava aracını tespit etmekte zorlanmadı ve birkaç Kraliyet Hava Kuvvetleri filosu derhal konumuna yönlendirildi. Hindenburg telsize yanıt vermeyince ateş açtılar. \n\nHess'in kalıntıları enkazda bulundu."
 germany.111.a:0 "Elimizi zorladılar."
 germany.111.d:0 "Yugoslavya, bölgedeki gerilimleri çözme teklifimizi aptalca reddetti."
 germany.111.t:0 "Yugoslavya Reddediyor"
 germany.113.a:0 "[Root.GetName] her seferinde bir savaşla ilgilenmeli."
 germany.113.d:0 "İç savaşımızda gelecekteki herhangi bir başarı için askeri desteğinin gerekli olduğunu gören [GER.GetNameDef], düşmanlıkların sona ermesi üzerine Danzig üzerinde [GER.GetAdjective] kontrol kurma planlarını sundu. Ayrıca [Root.GetNameDef]'nin askeri desteğine güvenmesinin [Root.GetLeader]'ye bu \"Danzig Anlaşmasını\" imzalamaktan başka seçenek bırakmadığını da açıkça belirttiler."
 germany.113.t:0 "Almanya Danzig'i Resmen Talep Ediyor"
 germany.114.a:0 "Anlaşıldığı gibi Danzig'i alacaklar."
 germany.114.b:0 "Polonya toprağını asla devretmeyeceğiz!"
 germany.114.d:0 "[Root.GetAdjective] iç savaşındaki zaferimizin ardından Almanya, Danzig taleplerini defalarca hatırlattı. Ayrıca, iç çatışmalardan hala toparlanmakta olan bir ulus için itaatsizliğin sonuçlarının ne olabileceğini de hatırlattılar."
 germany.114.t:0 "Almanya'nın Danzig Talepleri"
 germany.115.a:0 "Bu faydalı bir ortaklık oldu."
 germany.115.d:0 "Danzig anlaşması uyarınca, [GER.GetNameDef], Danzig'in [GER.GetNameDef] kontrolüne devredilmesini kabul etti."
 germany.115.t:0 "Polonya Danzig'i Terk Ediyor"
 germany.116.a:0 "Anlaşmamızı hiçe saymaları onlara pahalıya mal olacak."
 germany.116.b:0 "Bu çatışmayı göze alamayız."
 germany.116.d:0 "İç savaşlarında onlara sunduğumuz paha biçilmez desteği görmezden gelen [From.GetName], Danzig üzerindeki iddialarımızı görmezden gelmeye karar verdi."
 germany.116.t:0 "Polonya Danzig Anlaşması'ndan Cayıyor"
 germany.117.a:0 "Bu aynı zamanda bir [Root.GetAdjective] mücadelesidir."
 germany.117.d:0 "[From.GetName], iç savaşlarında destek karşılığında Danzig talebimizi kabul etti. Talebimiz ve sözümüz Danzig Anlaşması'nda resmileştirildi. Şimdi [From.GetName]'nin çatışmalarından zaferle çıkmasını sağlamalıyız."
 germany.117.t:0 "Danzig Anlaşması"
 germany.118.a:0 "Avrupa'nın geleceği üzerine bir konferansa ihtiyacımız var."
 germany.118.b:0 "[yalta_partner.GetNameDef] ile işbirliği yapamayız."
 germany.118.c:0 "Morgenthau Planı'nı izlemeliyiz."
 germany.118.d:0 "Avrupa'daki savaş hızla ilerlerken, kaçınılmaz galiplerin Avrupa'nın geleceğini düşünmesinin zamanı gelmiştir.\n\nKıta üzerindeki etki alanlarımızı belirlemek için savaştan sonra [GER.GetNameDef]'nin bölünmesine ilişkin [yalta_partner.GetNameDef] bir konferans önerebiliriz.\n\nBizim [yalta_partner.GetNameDef]'daki \"arkadaşlar\" böyle bir konferansla ilgileneceklerini belirtmişlerdir. Hiç şüphe yok ki, yaptıkları fedakarlığın karşılığında bir çeşit ödül isteyeceklerdir."
 germany.118.e:0 "Churchill'in böyle bir fikri var..."
 germany.118.t:0 "Yalta Konferansı"
 germany.119.a:0 "Kalıcı işbirliği uğruna."
 germany.119.b:0 "Kendi barışımızı biz dikte edeceğiz."
 germany.119.d:0 "[GER.GetNameDef]'e karşı savaş kaçınılmaz sonucuna doğru ilerlerken, [yalta_origin.GetNameDef] Avrupa'nın geleceği üzerine bir konferans için bize başvurdu.\n\n[GER.GetNameDef]'in doğu ve batı arasında bölünmesini öneriyorlar. Bu, etki alanımızın Avrupa'nın derinliklerine kadar uzanmasını sağlayacak ve bu korkunç mücadelede uğradığımız kayıpların bir kısmını telafi edecektir."
 germany.119.t:0 "Yalta Konferansı"
 germany.1190.desc:0 "[GER.GetNameDef]'e karşı savaş kaçınılmaz sonucuna doğru ilerlerken, [yalta_origin.GetNameDef] Avrupa'nın geleceği üzerine bir konferans için bize başvurdu.\n\n[GER.GetNameDef]'in üç yönlü bir bölünmesini öneriyorlar; bu bölünmede Doğu bölgesi üzerinde sınırlı etkimiz olacak. Ana sanayi bölgesi müttefik kontrolüne geçecek ve müttefiklerin Güney bölgesi üzerinde de sınırlı kontrolü olacak. Bu Almanya'nın gücünü azaltacaktır, ancak Orta Avrupa üzerindeki etkimiz belirsiz kalacaktır."
 germany.1190.t:0 "Toronto Konferansı"
 germany.12.a:0 "Mükemmel."
 germany.12.d:0 "[SOV.GetNameDefCap], saldırmazlık paktımızı imzalamayı akıllıca kabul etti. Bu, Sovyet müdahalesi riski olmadan hareket etmekte özgür olduğumuz anlamına geliyor.\n\nNe yazık ki, bazı dostlarımız şimdi Almanya'nın komünizmin nihai yıkımına olan bağlılığını sorguluyor. Polonya ve Fransa ile ilgili meseleler çözüldüğünde, bu antlaşmayı yeniden gözden geçirmemiz gerekebilir, ancak bu başka bir zamanın tartışması..."
 germany.12.t:0 "Moskova Paktı İmzaladı"
 germany.120.a:0 "Bu endişe verici."
 germany.120.d:0 "Avrupa'nın geleceğine ilişkin önerdiğimiz konferans suya düştü.\n\nBelirsiz bir ifadeyle konuşan [yalta_partner.GetLeader] savaş sonrası Avrupa'da her türlü planlama ve işbirliği ihtiyacını reddetti.\n\n\"Barış masasında [GER.GetNameDef] taleplerimi dile getirdiğimde buluşacağız. Küçük görmeyeceğim. siyaset [yalta_partner.GetNameDef]'nın önünde duruyor.\""
 germany.120.t:0 "[yalta_partner.GetNameDefCap] Katılmayı Reddediyor"
 germany.121.a:0 "Almanya için..."
 germany.121.d:0 "Yalta anlaşmasında belirtildiği gibi, Almanya iki ayrı devlete bölünecek ve her biri savaşan taraflardan birinin etki alanı altına girecektir.\n\nUmarım bu, Avrupa'daki çatışmalara bir son verir."
 germany.121.t:0 "Almanya'nın Bölünmesi"
 germany.122.a:0 "Cesaretleri varsa savaşlarını alabilirler!"
 germany.122.b:0 "[From.GetNameDef] ile bir savaşı göze alamayız."
 germany.122.c:0 "[FROM.GetLeader]'in taleplerine uymalıyız."
 germany.122.d:0 "Devam eden durumun ortasında Almanya, bölgedeki \"Alman nüfusunu korumak\" için Sudetenland bölgesini bizden talep etti.\n\nDevam eden durumla birlikte bunun böyle olduğunu çok açık bir şekilde ortaya koydular. Müzakere ve diplomasi olmayacak. Sudetenland'ı ele geçirecekler ya da onun için savaşa girecekler."
 germany.122.desc_cze_subject_of_ger:0 "[FROM.GetAdjective] lideri [FROM.GetLeader], bölgedeki \"Alman nüfusunu korumak\" için Sudetenland bölgesini bizden talep etti.\n\nKoşullar ve [FROM.GetNameDef]'nin ülkemiz üzerinde uyguladığı sıkı kontrol göz önüne alındığında, onları durdurmak için yapabileceğimiz hiçbir şey yok. Sudetenland'ı alacaklar ve biz de bu acı gerçekle barışacağız."
 germany.122.t:0 "[From.GetNameDefCap] Sudetenland'ı Talep Ediyor"
 germany.123.a:0 "Öyle olsun!"
 germany.123.d:0 "Aptalca bir diplomatik hamleyle, [From.GetAdjective]lerin lideri [From.GetLeader], tüm [ROOT.GetAdjective] taleplerini reddetti!\n\nSudetenland'ı devretmeyecekler ve neredeyse [ROOT.GetAdjective] kardeşlerimizi ve kız kardeşlerimizi koruma arzumuzu alay konusu yaparak bizi savaşa davet ettiler."
 germany.123.t:0 "[From.GetNameDefCap] Bize Sudetenland'ı Reddediyor"
 germany.124.a:0 "[ROOT.GetNameDef] ve tüm [ROOT.GetAdjective]ler için!"
 germany.124.d:0 "Bizimle savaş olasılığıyla karşı karşıya kalan [From.GetNameDef], Sudetenland'ın tüm kontrolünü devretmeyi ve bölge üzerindeki gelecekteki tüm iddialarından vazgeçmeyi kabul etti.\n\nSudetenland'ın [ROOT.GetAdjective] nüfusu sonunda [ROOT.GetNameDef]'in güvenli kucağında olacak."
 germany.124.desc_cze_subject_of_ger:0 "[From.GetAdjective] hükümetinin Sudetenland'ın tüm kontrolünü devretmeyi ve bölge üzerindeki gelecekteki tüm iddialarından vazgeçmeyi kabul etmekten başka seçeneği yoktu.\n\nSudetenland'ın [ROOT.GetAdjective] nüfusu sonunda [ROOT.GetNameDef]'in güvenli kucağında olacak."
 germany.124.t:0 "[From.GetNameDefCap] Sudetenland'ı Terk Ediyor"
 germany.125.a:0 "Bize kalsaydı farklı hallederdik."
 germany.125.d:0 "[FROM.GetAdjective] efendilerimiz Sudetenland'ı [GER.GetNameDef]'e devretmeye karar verdi. Eylemin bölgedeki barışı korumak için bir önlem olarak alındığını ve başka herhangi bir eylemin başımıza çok daha kötü bir kader getireceğini iddia ediyorlar. Bu konuda bize danışılmadı ve şimdi haklı toprağımızın bizden koparılmasını sadece izleyebiliriz."
 germany.125.t:0 "[FROM.GetNameDefCap], Sudetenland'ı [GER.GetNameDef]'e Bırakıyor"
 germany.126.a:0 "Alman Reich'e katılacağız!"
 germany.126.b:0 "Hayır, Avusturya'nın kaderi başka yerde."
 germany.126.d:0 "Protestocuların Avusturya'nın Almanya'ya katılma arzusunu dile getirmesiyle sivil huzursuzluk ve şiddet eylemleri patlak verdi. Ulusumuzun zaten çektiği iç mücadeleler, Almanya ile bir birlik isteyen insanların sesine sadece katkıda bulunuyor. Berlin Anschluss için sert bir şekilde baskı yapıyor ve bu, gerçek Avusturya değerlerinin bir kısmını canlı tutmak için tek şansımız olabilir."
 germany.126.t:0 "Anschluss ya da Yıkım"
 germany.126.warning:0 "§RSavaşa yol açabilir§!\n"
 germany.127.a:0 "Elçiler göndereceğiz."
 germany.127.b:0 "Onlara karşı daha fazla yükümlülüğümüz olmayacak."
 germany.127.d:0 "[SOV.GetNameDef]'e karşı mücadelemizde birleştik; belki de ittifakı resmileştirme ve bu anti-komünist savaştaki yeni ortaklarımızı ittifakımıza davet etme zamanı gelmiştir."
 germany.127.t:0 "İttifakı Resmileştir"
 germany.128.a:0 "Bu harika bir girişim."
 germany.128.b:0 "Kaderimiz başkalarına bağlı."
 germany.128.d:0 "[From.GetNameDefCap], komünist tehdidine karşı daha iyi koordine olabilmemiz için bizi ittifaklarına kabul etmeyi teklif etti. Bu ittifakı resmileştirmek için elçiler başkente çoktan ulaştı."
 germany.128.t:0 "Anti-Sovyet Paktı"
 germany.13.a:0 "Lanet olsun onlara!"
 germany.13.d:0 "[SOV.GetNameDefCap], saldırmazlık paktımızı imzalamayı reddetti! Bu, Bolşeviklerin kendilerini dahil etme riski olmadan Polonya veya Fransa ile kesin olarak ilgilenemeyeceğimiz için işleri karmaşıklaştırıyor."
 germany.13.t:0 "Moskova Paktı Reddetti"
 germany.14.a:0 "Evet. Antlaşma şartlarına uyulmalıdır."
 germany.14.b:0 "Hayır! Tüm Polonya Anavatan'a aittir!"
 germany.14.d:0 "Polonya bizimdir, ancak doğu kısımları Molotov-Ribbentrop Paktı'nın şartlarına göre [SOU.GetAdjective] etki alanı altına girmektedir. Kuvvetlerimizi geri çekip [SOU.GetAdjective]lerin bu bölgeyi işgal etmesine izin vermeli miyiz? Bunu yapmamak antlaşmamızı geçersiz kılacaktır."
 germany.14.t:0 "Polonya'nın Paylaşımı"
 germany.15.d:0 "Molotov-Ribbentrop Paktı uyarınca, Alman kuvvetleri doğu Polonya'yı boşalttı ve kendi birliklerimiz bölgeyi işgal etmek için harekete geçti."
 germany.15.t:0 "Almanya Pakta Sadık Kalıyor"
 germany.16.a:0 "Faşistlere güvendiğimiz için aptaldık!"
 germany.16.d:0 "[From.GetNonIdeologyName], Molotov-Ribbentrop Paktı'nın bariz bir ihlaliyle Polonya'yı bizimle paylaşmayı reddetti! Bu ihanet, onlarla olan antlaşmamızı geçersiz kıldı!"
 germany.16.t:0 "[From.GetNonIdeologyName] Pakta İhanet Ediyor"
 germany.20.a:0 "Macaristan'a Kuzey Transilvanya'yı ver."
 germany.20.b:0 "Macaristan'a tüm Transilvanya'yı ver."
 germany.20.c:0 "Transilvanya Romanya'da kalacak."
 germany.20.d:0 "Avrupa'da yeni bir düzenin kurulduğunu kabul ederek, Macaristan ve Romanya tarafından iki ülke arasındaki bir toprak anlaşmazlığında arabuluculuk yapmamız istendi. Transilvanya, Versay'da dünyaya dayatılan birçok kötü düşünülmüş değişiklikten biriyle Macaristan'dan alınmış ve Romanya'ya dahil edilmişti. Kuzey Transilvanya Macar kontrolüne iade edilmeli mi?"
 germany.20.t:0 "İkinci Viyana Diktası"
 germany.200.a:0 "Bu planları başlatalım."
 germany.200.b:0 "Hayır, bu çok riskli."
 germany.200.desc:0 "Almanya artık bir zamanlar olduğu tehdidi oluşturmuyor, bunun yerine dünya düzenini bozmakla tehdit eden [SOV.GetNameDef]'dir. Güçlü ve demokratik bir Almanya bu mücadelede çok faydalı bir müttefik olabilir. Almanya'nın bir kez daha yükselmesine izin vermek, hem bizim hem de onlar için güçlü ticaret avantajları da sağlayabilir. Belki de işgali sona erdirmenin ve güçlü ve birleşik bir demokratik dünya için temel atmanın zamanı gelmiştir."
 germany.200.t:0 "Yeni bir Almanya"
 germany.201.a:0 "Bunun kesinlikle avantajları var."
 germany.201.b:0 "Hayır, bunun zamanı şimdi değil."
 germany.201.desc:0 "[FROM.GetName], Almanya işgalini sona erdirmeye ve Almanlara [WGR.GetNameDef] adlı yeni bir cumhuriyet olarak kendi kendini yönetme hakkı vermeye karar verdi. Bunun komünizme karşı bir siper oluşturmak olduğunu iddia ediyorlar; güçlü bir demokratik Almanya'nın, komünizmin yayılmasına karşı zayıf, parçalanmış bir Almanya'dan daha iyi bir koruma olduğunu savunuyorlar. \nAlman topraklarımızı yeni oluşturulan [WGR.GetName] ile birleştirerek bunu desteklememiz istendi. Halkın buna desteği güçlü."
 germany.201.t:0 "[FROM.GetName] Almanya'yı Yeniden Birleştirmek İstiyor"
 germany.202.a:0 "O zaman kendi bağımsız Almanya'mızı yaratalım."
 germany.202.b:0 "Onları tutmaya değmez."
 germany.202.desc:0 "[FROM.GetName], Alman topraklarının sözde [WGR.GetName]'ne birleştirilmesine izin verdi. Bu, Alman bölgemizdeki birçok insanın da bağımsız Almanya ile yeniden birleşme çağrısında bulunmasına yol açtı."
 germany.202.t:0 "Yeni bir Almanya"
 germany.21.a:0 "Almanya'nın iradesine uyulmalıdır!"
 germany.21.d:0 "Romanya, İkinci Viyana Diktası'nda ulaştığımız karara uymayı reddetti! Heyetleri Bükreş'e geri çağrıldı ve Macaristan'a hiçbir toprak teslim edilmedi."
 germany.21.t:0 "Romanya Kararımızı Reddetti"
 germany.22.a:0 "Mükemmel."
 germany.22.d:0 "[FROM.GetAdjective] hükümeti taleplerimizi kabul etti ve Memel, Doğu Prusya'ya yeniden dahil edilecek. Yasadışı olarak çalınan bir başka eyalet daha Alman ulusuna iade edildi!"
 germany.22.t:0 "Memel - [FROM.GetNameDef] Boyun Eğiyor"
 germany.23.a:0 "İnatçı aptallar."
 germany.23.d:0 "[FROM.GetAdjective] hükümeti taleplerimizi reddetti! Klaipėda Sözleşmesi'nin arkasına saklanıyorlar ve Almanya'nın Memel bölgesi üzerinde yasal bir hakkı olmadığını iddia ediyorlar. Onlara pozisyonumuzu farklı yollarla açıklamak zorunda kalacağız..."
 germany.23.t:0 "Memel - [FROM.GetNameDef] Talebi Reddediyor"
 germany.24.a:0 "Von Falkenhausen'i geri çağır."
 germany.24.b:0 "Hayır, danışmanlarımız kalacak."
 germany.24.c:0 "Hayır, danışmanlarımız kalacak, tıpkı Çinlilere söz verdiğimiz gibi."
 germany.24.d:0 "Almanya, Çin mülklerimizi kaybetmemize rağmen önceki Cihan Harbi'nin sonundan beri Çin ile iyi ilişkiler sürdürmektedir. Bir Alman askeri misyonu birkaç yıldır Çin'de bulunmaktadır ve Alexander von Falkenhausen, Kuomintang ordusunun bazı kısımlarını reforme etmede büyük ilerleme kaydetmiştir.\n\nBu durum, Çin'e karşı mevcut savaşları göz önüne alındığında Japonlar için doğal olarak bazı endişelere yol açmaktadır. Çin'e yönelik tüm Alman desteğinin derhal geri çekilmesini talep ediyorlar."
 germany.24.t:0 "Çin'e Alman Askeri Misyonu"
 germany.25.a:0 "Onu başka işlerde çalıştıracağız."
 germany.25.d:0 "Çin ile kötüleşen ilişkiler, ülkelerinde bir askeri misyon sürdürmeyi siyasi olarak imkansız hale getirdi. Alexander von Falkenhausen ve diğer danışmanlarımız geri çağrıldı."
 germany.25.t:0 "Askeri Danışmanlar Geri Çağrıldı"
 germany.26.a:0 "İyi adam!"
 germany.26.d:0 "Almanya ve Çin savaş halinde olduğundan, Çinliler ordularını reforme eden Alman askeri danışmanlarını gözaltına aldı. Von Falkenhausen ve birkaç subayı yakalanmaktan kurtulmayı başardı ve şimdi Avrupa'ya geri dönüyorlar."
 germany.26.t:0 "Çin Askeri Danışmanları Gözaltına Aldı"
 germany.27.a:0 "Bu, Siegfried Hattı'ndan daha iyi dayanacak."
 germany.27.d:0 "Ordu istihkamcıları mevcut tahkimatlarımızın incelemesini tamamladı ve güçlendirilmesi gereken yerleri belirledi. Gerekli inşaat emirleri verildi."
 germany.27.t:0 "Westwall'ı Tahkim Etmek"
 germany.28.a:0 "Alman Reich'e katılacağız!"
 germany.28.b:0 "Hayır, Avusturya'nın kaderi başka yerde."
 germany.28.d:0 "Protestocular Avusturya'nın Alman halklarının birliği içinde Almanya'ya katılma arzusunu dile getirirken sivil huzursuzluk ve şiddet eylemleri patlak verdi. Berlin, Avusturya'nın kendi uluslarına ilhak edilmesini sağlayacak bir Anschluss için sert bir şekilde baskı yapıyor."
 germany.28.t:0 "Almanlar Anschluss için Baskı Yapıyor"
 germany.29.a:0 "Askeri bir müdahaleye hazırlanmalıyız."
 germany.29.d:0 "Viyana'daki aptallar iki ulusumuzun birleşmesini kabul etmeyi reddetti! Bu, Avusturya halkının iradesine yönelik bariz bir saygısızlıktır ve buna izin verilmeyecektir! Anschluss'u askeri yollarla uygulamak zorunda kalabiliriz."
 germany.29.t:0 "Avusturya Anschluss'u Reddediyor!"
 germany.4.a:0 "Avusturya'nın Alman olmadığını kim söyleyebilir ki?!"
 germany.4.d:0 "Avusturya'daki tekrarlayan ayaklanmalar, oradaki halkın Reich'ımızla birleşmeyi özlediğini açıkça gösteriyor. Artık harekete geçme ve halkın iradesinin tezahür etmesine izin verme zamanı geldi."
 germany.4.t:0 "Anschluss"
 germany.40.a:0 "Çekler kendi başlarının çaresine baksın."
 germany.40.b:0 "Çekoslovakya savunulmalı!"
 germany.40.d:0 "Almanya'nın, önemli sayıda etnik Alman'ın yaşadığı Çekoslovakya'nın Sudetenland bölgesi talepleri doruğa ulaştı. [GER.GetLeader], bir saldırı hazırlığı için Çekoslovakya sınırı boyunca kuvvetlerini konumlandırdı. Sudeten Krizi'ne barışçıl bir çözüm bulma umuduyla Münih'te İngiltere, Fransa, İtalya ve Almanya arasında görüşmeler yapılıyor. İngiltere'nin tutumu ne olacak?"
 germany.40.d_2:0 "Almanya'nın, önemli sayıda etnik Alman'ın yaşadığı Çekoslovakya'nın Sudetenland bölgesi talepleri doruğa ulaştı. [GER.GetLeader], bir saldırı hazırlığı için Çekoslovakya sınırı boyunca kuvvetlerini konumlandırdı. Alman yayılmacılığını kabul etmeyeceğimizi zaten kanıtladığımız için, bu durum Almanya'ya karşı savaşta yeni bir müttefikimiz olduğu anlamına geliyor."
 germany.40.d_3:0 "Almanya'nın, önemli sayıda etnik Alman'ın yaşadığı Çekoslovakya'nın Sudetenland bölgesi talepleri doruğa ulaştı. [GER.GetLeader], bir saldırı hazırlığı için Çekoslovakya sınırı boyunca kuvvetlerini konumlandırdı. Sudeten Krizi'ne barışçıl bir çözüm bulma umuduyla Münih'te Hollanda, İngiltere, Fransa, İtalya ve Almanya arasında görüşmeler yapılıyor. Hollanda'nın tutumu ne olacak?"
 germany.40.t:0 "Münih Konferansı"
 germany.41.a:0 "Çekleri kaderlerine terk et."
 germany.41.b:0 "İngilizler kahrolsun! Fransa dostlarının yanındadır!"
 germany.41.d:0 "Almanya'nın, önemli sayıda etnik Alman'ın yaşadığı Çekoslovakya'nın Sudetenland bölgesi talepleri doruğa ulaştı. [GER.GetLeader], bir saldırı hazırlığı için Çekoslovakya sınırı boyunca kuvvetlerini konumlandırdı. Sudeten Krizi'ne barışçıl bir çözüm bulma umuduyla Münih'te İngiltere, Fransa, İtalya ve Almanya arasında görüşmeler yapılıyor.\n\nİngilizler, 'uzak bir ülkedeki bir anlaşmazlık' yüzünden savaşa girme niyetleri olmadığını açıkça belirtti. Onların izinden mi gitmeliyiz, yoksa Çekoslovakya'ya destek sunarak yükümlülüklerimizi yerine mi getirmeliyiz?"
 germany.42.a:0 "Hazırlanmalıyız!"
 germany.42.b:0 "Fransa bu işin dışında kalmalı."
 germany.42.d:0 "Almanya'nın, önemli sayıda etnik Alman'ın yaşadığı Çekoslovakya'nın Sudetenland bölgesi talepleri doruğa ulaştı. [GER.GetLeader], bir saldırı hazırlığı için Çekoslovakya sınırı boyunca kuvvetlerini konumlandırdı. Sudeten Krizi'ne barışçıl bir çözüm bulma umuduyla Münih'te İngiltere, Fransa, İtalya ve Almanya arasında görüşmeler yapılıyor.\n\nİngilizler geri adım atmayı reddetti ve bunun yerine Çekoslovakya sınırlarını ihlal etmeleri durumunda Almanları savaşla tehdit ediyor. Savaş yakındır."
 germany.43.a:0 "Aptallar! [GER.GetLeader] yatıştırılmalı!"
 germany.43.d:0 "İnatçı Fransızlar, Sudeten Krizi'nde bizim liderliğimizi takip etmeyi reddetti! Çekoslovakya'ya verdikleri desteğin arkasında duruyorlar ve biz durmadığımız için karşılıklı ittifakımızı feshetmeye karar verdiler. Şu anda bile Fransa, Almanya ile yakın bir savaş için hazırlanıyor."
 germany.43.t:0 "Fransa Müttefiklerden Ayrılıyor"
 germany.44.a:0 "Güzel! Gelsinler bakalım!"
 germany.44.d:0 "Sudetenland bölgemizdeki topraklarımıza yönelik Alman talepleri giderek düşmanca bir hal aldı ve şimdi kuvvetleri sınırımız boyunca yığılıyor! Münih'te Avrupalı liderlerin Çekoslovakya'nın geleceğini tartıştığı bir konferans düzenleniyor, ancak biz davet edilmedik.\n\nNeyse ki, Müttefikler daha önceki destek vaatlerine sadık kalacak gibi görünüyor. Sınırlarımızın en ufak bir şekilde ihlal edilmesi durumunda [GER.GetLeader]'i savaşla tehdit ettiler. Buna rağmen, yakın bir Alman saldırısına hazırlanmalıyız."
 germany.45.a:0 "Yaşasın Fransa!"
 germany.45.d:0 "Sudetenland bölgemizdeki topraklarımıza yönelik Alman talepleri giderek düşmanca bir hal aldı ve şimdi kuvvetleri sınırımız boyunca yığılıyor! Münih'te Avrupalı liderlerin Çekoslovakya'nın geleceğini tartıştığı bir konferans düzenleniyor, ancak biz davet edilmedik.\n\nKorkak İngilizler egemenliğimizi desteklemeyi reddetti, ama en azından Fransızlar bizim için direniyor! İngiltere ile ittifaklarını terk ettiler ve bizimle yeni bir ittifak kurarak Çekoslovakya'yı Alman saldırganlığına karşı desteklemeyi vaat ettiler."
 germany.46.a:0 "Bu, Avrupa için karanlık bir gün."
 germany.46.b:0 "Asla teslim olmayacağız!"
 germany.46.d:0 "Sudetenland bölgemizdeki topraklarımıza yönelik Alman talepleri giderek düşmanca bir hal aldı ve şimdi kuvvetleri sınırımız boyunca yığılıyor! Münih'te Avrupalı liderlerin Çekoslovakya'nın geleceğini tartıştığı bir konferans düzenleniyor, ancak biz davet edilmedik.\n\nHem İngilizler hem de Fransızlar, bizi Alman saldırganlığına karşı destekleme yönündeki önceki vaatlerinden caydılar. Diplomatları, Almanlara direnmemiz durumunda kendi başımıza kalacağımızı açıkça belirtti. Belki de Sudetenland'ı teslim etmekten başka seçeneğimiz yok..."
 germany.46.t:0 "Münih Diktası"
 germany.47.a:0 "Bunu zor yoldan yapma zamanı."
 germany.47.d:0 "Çekoslovakya'nın geleceğini tartışmak üzere Almanya, İngiltere, Fransa ve İtalya liderleri arasında Münih'te görüşmeler yapıldı. İngilizler ve Müttefikleri, Sudetenland üzerindeki haklı iddialarımızı reddettiler ve Çek sınırını 'ihlal etmemiz' durumunda bizi savaşla tehdit ettiler!\n\nÇekoslovakya'nın işgali için bir plan hazırlandı, ancak bu muhtemelen genel bir Avrupa savaşına yol açacaktır. Buna hazır olduğumuzdan emin olmalıyız."
 germany.48.a:0 "Bu bizim avantajımıza olabilir."
 germany.48.d:0 "Çekoslovakya'nın geleceğini tartışmak üzere Almanya, İngiltere, Fransa ve İtalya liderleri arasında Münih'te görüşmeler yapıldı. İngilizler aklını başına topladı ve Sudetenland üzerindeki iddialarımızı meşru kabul etti, ancak inatçı Fransızlar geri adım atmayı reddediyor.\n\nİngiltere ile işbirliklerini terk ettiler ve bunun yerine Çeklerle daha yakın bağlar kurdular. Görünüşe göre her ikisiyle de aynı anda ilgilenmek zorunda kalacağız, ama en azından şimdi İngilizler umarım müdahale etmeyecektir..."
 germany.49.a:0 "Çekler yok edilmeli."
 germany.49.d:0 "Çekoslovakya'nın geleceğini tartışmak üzere Almanya, İngiltere, Fransa ve İtalya liderleri arasında Münih'te görüşmeler yapıldı. Hem İngilizler hem de Fransızlar, Sudetenland üzerindeki iddialarımızı meşru kabul ettiler ve Çeklere yönelik önceki destek teklifleri geri çekildi.\n\nDurumlarının umutsuzluğuna rağmen, inatçı Çekler topraklarını teslim etmeyi reddediyor! Onu zorla almak zorunda kalacağız. Versay'ın bu aşağılık deneyini yeryüzünden silecek bir işgal planı hazırlandı!"
 germany.5.a:0 "Katıl"
 germany.5.b:0 "Reddet"
 germany.5.d:0 "Almanya, Komintern'in dünya çapında Komünizmi yıkım ve şiddet yoluyla yayma hedefine karşı bir pakt imzalamamızı öneriyor. Bu paktı imzalayarak, Komünist tehdit hakkında istihbarat paylaşmayı ve bu tehlikeye karşı yakın işbirliği içinde hareket etmeyi kabul ediyoruz."
 germany.5.t:0 "Anti-Komintern Paktı"
 germany.50.a:0 "Bu, Almanya için tarihi bir gün."
 germany.50.d:0 "Çekoslovakya'nın geleceğini tartışmak üzere Almanya, İngiltere, Fransa ve İtalya liderleri arasında Münih'te görüşmeler yapıldı. Hem İngilizler hem de Fransızlar, Sudetenland üzerindeki iddialarımızı meşru kabul ettiler ve Çeklere yönelik önceki destek teklifleri geri çekildi.\n\nDurumlarının umutsuzluğunu kabul eden Çekler, Sudeten topraklarını bize teslim etti. Ezilen Alman sakinleri sonunda Anavatan'a kavuşacak!"
 germany.51.a:0 "Zamanı gelmişti!"
 germany.51.d:0 "Çekoslovakya, Avrupa'nın kalbinde kanserli bir tümördür ve sonunda [GER.GetAdjective]ler onlara karşı kesin bir eylemde bulunmaya karar verdi. Sudetenland zaten Almanya'ya teslim edildi ve şimdi, Münih Anlaşması'nın bir sonucu olarak, haklı olarak Macaristan'a ait olan Çekoslovakya toprağı bize iade edilecek."
 germany.51.t:0 "Birinci Viyana Diktası"
 germany.52.a:0 "Zaolzie bizimdir!"
 germany.52.d:0 "Çekoslovakya dağılıyor ve Almanya tarafından ele geçirilmeden önce önemli Polonyalı nüfusa sahip toprakları korumak için hızla hareket etmeliyiz. Zaolzie'nin Çek mülkiyeti her zaman tarafımızca tartışmalı olmuştur ve bölgenin ulusumuza katılma zamanı gelmiştir."
 germany.52.t:0 "Zaolzie'nin İlhakı"
 germany.53.a:0 "Almanlara boyun eğ."
 germany.53.b:0 "...yine de direnmek zorundayız!"
 germany.53.d:0 "Sudetenland'ı çalmakla yetinmeyen Almanlar, şimdi de ulusumuzun geri kalanını ele geçirmeye karar verdiler. Sözde müttefiklerimiz tarafından terk edilmiş ve Münih Diktası'nda en iyi savunmalarımızı kaybetmişken, durum umutsuz görünüyor..."
 germany.53.t:0 "Çekoslovakya'nın Kaderi"
 germany.54.a:0 "Prag yakında bizim olacak."
 germany.54.d:0 "Çekler bir şekilde ülkelerinin işgaline karşı savaşma cesaretini topladılar. En iyi savunmaları, şimdi bizim kontrolümüzde olan Sudetenland'daydı, bu yüzden bu hızlı bir harekat olmalı."
 germany.54.t:0 "Çekler Direniyor"
 germany.55.a:0 "Slovakya'yı kukla bir devlet olarak kur."
 germany.55.b:0 "Çekoslovakya'yı Macaristan ile paylaş."
 germany.55.c:0 "Tüm Çekoslovakya Reich'a aittir!"
 germany.55.d:0 "Çekoslovakya'nın sonu yakındır ve kuvvetlerimiz şu anda Prag'a giriyor. Çekoslovak ordusunun teslim olmasıyla birlikte büyük miktarda silah ele geçirdik. Özellikle tankları, kuvvetlerimize iyi hizmet etmelidir.\n\nBöhmen, bir himaye bölgesi olarak Almanya'ya ilhak edilecek, peki Slovakya ne olacak? Onları Jozef Tiso yönetiminde özerk bir kukla devlet olarak kurabiliriz."
 germany.55.d_2:0 "Çekoslovakya'yı fethettikten sonra, bu toprakları bölmenin en iyi yolunu düşünmeliyiz.\n\nBöhmen bir himaye bölgesi olarak Alman kalacak, peki Slovakya ne olacak? Onları Jozef Tiso yönetiminde özerk bir kukla devlet olarak kurabiliriz."
 germany.55.e:0 "Bohemya ve Slovakya'nın her ikisini de kukla devlet olarak kurun"
 germany.56.a:0 "Elbette! Büyük Macaristan yakında bir gerçek olacak!"
 germany.56.b:0 "Hayır, Slovakya'ya veya Alman dostluğuna ihtiyacımız yok."
 germany.56.d:0 "Alman kuvvetleri Prag'a girdi ve Çekoslovakya'nın sonu yaklaşıyor. Bohemya'yı Alman Reich'e ilhak etmeyi planlıyorlar, ancak Slovakya'yı bize bırakmaya istekliler. Bu paylaşıma razı olmalı mıyız? Bu, Almanya ile resmi bir askeri ittifaka girmek anlamına gelecektir."
 germany.56.d_2:0 "Çekoslovakya'yı ilhak ettikten sonra, Almanya Bohemya'yı Reich'ın bir parçası olarak tutmayı planlıyor, ancak Slovakya'yı bize bırakmaya istekliler. Bu paylaşıma razı olmalı mıyız? Bu, Almanya ile resmi bir askeri ittifaka girmek anlamına gelecektir."
 germany.56.t:0 "Çekoslovakya'nın Paylaşımı"
 germany.57.a:0 "Tiso'nun kukla hükümetini kur."
 germany.57.b:0 "Slovakya'yı Almanya'ya ilhak et."
 germany.57.d:0 "Macarlar, bölgeyle ilgilenmediklerini iddia ederek Slovakya'yı ilhak etme yönündeki cömert teklifimizi küstahça reddetti! Onlarla yakında ilgilenmek zorunda kalacağız. Şimdilik, Slovak Sorunu'na bir çözüm bulmalıyız."
 germany.57.t:0 "Macaristan Teklifimizi Reddetti"
 germany.58.a:0 "Yakında Polonya diye bir yer kalmayacak!"
 germany.58.d:0 "Halkı Aydınlatma ve Propaganda Reichsministerium'u mükemmel bir iş çıkardı ve Almanya halkı - aslında tüm dünya - Polonya'daki Alman kardeşlerimizin katlanmak zorunda kaldığı adaletsizliklerden haberdar edildi. Artık bir savaş için ihtiyacımız olan tüm gerekçeye sahibiz!"
 germany.58.t:0 "Polonya Sorunu"
 germany.59.a:0 "[ROOT.GetNameDef] için bir başka üzücü gün."
 germany.59.desc:0 "[GER.GetNameDef], [664.GetName] bölgesinin [FROM.GetNameDef]'e devredilmesini tek taraflı ve cesur bir kararla ilan etti. Danışma veya rıza olmaksızın dikte edilen bu karar, [ROOT.GetNameDef]'in toprak bütünlüğünün daha da parçalanmasına ve jeopolitik kırılganlığımızın açık bir hatırlatıcısına işaret ediyor. \n[GER.GetAdjective] heyeti, eski tarihi iddiaları gerekçe göstererek liderliğimize bu toprak revizyonunu kabul etmesi için baskı yaptı. Kültür ve kaynaklar açısından zengin olan [664.GetName]'nin [FROM.GetNameDef]'e kaybedilmesi halkımız için yutulması zor bir lokma ve ulusumuzun egemenliğine doğrudan bir meydan okumadır."
 germany.6.a:0 "Katıl"
 germany.6.b:0 "Reddet"
 germany.6.d:0 "İmzacılar, dünyadaki tüm uluslara kendi uygun yerlerinin verilmesinin kalıcı bir barışın ön koşulu olduğunu düşünmekte olup, Büyük Doğu Asya ve Avrupa bölgelerindeki çabalarında birbirlerini desteklemeye ve işbirliği yapmaya karar vermişlerdir; burada temel amaçları, ilgili halkların karşılıklı refahını ve esenliğini teşvik etmek üzere hesaplanmış yeni bir düzen kurmak ve sürdürmektir."
 germany.6.t:0 "Üçlü Pakt"
 germany.60.a:0 "Bu bir savaş nedenidir! İngilizleri yanımıza çekin!"
 germany.60.a.tt:0 "§RSavaş çıkarsa, §YDağınık Hükümetimiz§! nedeniyle bir iç savaş yaşayacağız:§!\n"
 germany.60.b:0 "Diplomatik bir itirazda bulunun."
 germany.60.d:0 "Birkaç Alman tümeni kısa süre önce Renanya'ya ilerledi ve bu, Büyük Savaş'ın sona ermesinden bu yana Almanya'nın Ren Nehri'nin batısında kuvvet konuşlandırdığı ilk sefer oldu. Bu, Almanya'nın bölgeyi askerileştirmesinin yasak olduğu Versay Antlaşması'nın açık bir ihlalidir! Geri çekilmelerini talep eden bir ültimatom vermezsek, antlaşma uygulanmayacaktır."
 germany.60.t:0 "Renanya'nın Yeniden Askerileştirilmesi"
 germany.61.a:0 "Savaş söz konusu olamaz."
 germany.61.b:0 "Fransa'nın yanında durmalıyız!"
 germany.61.d:0 "Birkaç Alman tümeni kısa süre önce Renanya'ya ilerledi ve bu, Büyük Savaş'ın sona ermesinden bu yana Almanya'nın Ren Nehri'nin batısında kuvvet konuşlandırdığı ilk sefer oldu. Bu, Almanya'nın bölgeyi askerileştirmesinin yasak olduğu Versay Antlaşması'nın açık bir ihlalidir!\n\nFransızlar kuvvetlerini seferber ediyor ve bir ültimatom verme niyetinde görünüyorlar. Almanya reddederse, bu tehditle başa çıkmak için Almanya'ya ilerlemeye hazırlar. İngiltere'de halk savaşa karşı, ancak Fransızların yanında durmazsak onlarla ittifakımız feshedilecektir."
 germany.62.a:0 "Biz de bir itirazda bulunacağız."
 germany.62.b:0 "Versay artık bizi ilgilendirmiyor."
 germany.62.d:0 "Birkaç Alman tümeni kısa süre önce Renanya'ya ilerledi ve bu, Büyük Savaş'ın sona ermesinden bu yana Almanya'nın Ren Nehri'nin batısında kuvvet konuşlandırdığı ilk sefer oldu. Bu, Almanya'nın bölgeyi askerileştirmesinin yasak olduğu Versay Antlaşması'nın açık bir ihlalidir!\n\nFransızlar bu ihlale verdikleri tepkiyi diplomatik itirazlarla sınırlamaktan memnun görünüyor ve İngiltere'de halk savaşa kesinlikle karşı."
 germany.63.a:0 "Evet! Almanya ile şimdi ilgilenilmeli."
 germany.63.b:0 "Hayır, İngilizler olmadan geri adım atmalıyız..."
 germany.63.d:0 "İngilizler, Almanların 'sadece kendi arka bahçelerinde yürüdüğünü' iddia ederek Almanya'ya karşı bizi desteklemeyi reddediyor. Onlarla savaşa girersek, kendi başımıza kalacak gibiyiz.\n\nFransa'da halk savaşa karşı, ancak Almanya yalnızca daha da güçlenecek ve Renanya'nın yeniden askerileştirilmesi sınırlarımıza yönelik doğrudan bir tehdit oluşturuyor. İngiltere yanımızda olmadan bir ültimatom vermek daha az tehditkar olacaktır. Onlara karşı tek başımıza ilerlemeli miyiz?"
 germany.63.t:0 "İngiltere Savaşı Reddediyor"
 germany.64.a:0 "İleri!"
 germany.64.d:0 "İngiltere'de savaşa yönelik halk desteği olmasa da, İngiliz hükümeti Almanların oluşturduğu tehdidi fark etti ve bize tam desteklerini sundular. Almanya'ya askerden arındırılmış bölgeden çekilmesi için son bir ültimatom vereceğiz. Reddederlerse, kuvvetlerimizin Almanya'nın derinliklerine ilerleyip zalim rejimlerine son verme zamanı gelmiştir!"
 germany.64.t:0 "İngiltere Bizi Destekliyor"
 germany.65.a:0 "Geri adım atamayız! Reich savunulmalı!"
 germany.65.b:0 "Bu çatışmaya hazır değiliz. Geri adım atmalıyız."
 germany.65.d:0 "İngilizler ve Fransızlar, Renanya'nın yeniden askerileştirilmesini kabul etmeyi reddederek bunu Versay Antlaşması'nın 'affedilemez bir ihlali' olarak nitelendirdiler. Bize karşı kuvvetlerini seferber ediyorlar ve kuvvetlerimizin derhal geri çekilmesi ve Renanya'nın askerden arındırılmış kalması, aksi takdirde uluslarımızın savaşta olacağı yönünde bir ültimatom verdiler."
 germany.65.t:0 "Fransa ve İngiltere Seferber Oluyor!"
 germany.66.d:0 "İngilizler aklını başına topladı ve Renanya'nın yeniden askerileştirilmesini kabul etti, ancak çılgın Fransızlar geri adım atmayı reddediyor! Bu olayın uluslarının güvenliğine yönelik doğrudan bir tehdit oluşturduğunu iddia ederek kuvvetlerini seferber ediyorlar ve her an sınırı geçebilirler! Savaştayız!"
 germany.66.t:0 "Fransa Seferber Oluyor!"
 germany.67.a:0 "Şimdi bir savaş delilik olurdu."
 germany.67.d:0 "Fransızlar, çılgın girişimlerinin İngiliz desteğinden yoksun kalacağını anlayınca akıllıca geri adım atmayı seçti. Kuvvetleri terhis edildi ve şimdilik savaş önlendi. Aman Tanrım, bu çok yakındı!"
 germany.67.t:0 "Fransa Geri Adım Atıyor"
 germany.68.a:0 "Belki de kaçınılmazdı."
 germany.68.d:0 "Fransızlar inatla Almanlara karşı tek başlarına gitmeye karar verdiler ve onlarla ittifakımız feshedildi. Anlamsız çekişmeler yüzünden bir başka Avrupa savaşı daha patlak verdi. Belki de İngiltere'nin kıta meselelerinden tekrar uzaklaşma zamanı gelmiştir..."
 germany.68.t:0 "Fransa Geri Adım Atmayı Reddediyor"
 germany.70.a:0 "Führer'i ne pahasına olursa olsun koruyun!"
 germany.70.b:0 "Belki de onun ortadan kaldırılması en iyisi olurdu..."
 germany.70.d:0 "Hitler'in Almanya'yı kazanamayacağı bir savaşa sürüklediğine inanan Wehrmacht içindeki bir grup üst düzey subay bir darbe başlattı! Görünüşe göre Abwehr'den Albay Hans Oster tarafından organize edilmiş, ancak Generaller Beck, von Brauchitsch, Halder ve Amiral Canaris'in de karıştığı doğrulandı!\n\nBerlin'deki birkaç apartmanda pusuya yatmış ağır silahlı adamlar, Hitler'i ve en yakın arkadaşlarını ortadan kaldırmak amacıyla Reichskanzlei'ye (Başbakanlık Binası) saldırdı. Şu anda bina içinde şiddetli bir silahlı çatışma yaşanıyor."
 germany.70.t:0 "Oster Komplosu"
 germany.71.a:0 "Herr Himmler bizi geleceğe taşıyacak."
 germany.71.b:0 "Herr Göring mantıklı bir seçim."
 germany.71.c:0 "Eva Braun intikamını almalı!"
 germany.71.d:0 "Reichskanzlei'ye koşan SS birlikleri ve sadık ordu birimleri, hain komandoların tamamını öldürmeyi veya yakalamayı başardı, ancak köpekler Hitler'i öldürmeden önce değil! Führer, masasının üzerine yığılmış halde onlarca kurşun yarasıyla bulundu - şüphesiz son nefesine kadar Anavatan için yorulmadan çalışıyordu! Uzun süredir sırdaşı olan Eva Braun çatışmada yaralandı, ancak zamanla iyileşecek gibi görünüyor.\n\nHain komplocular iğrenç suçlarından dolayı yargılanacaklar, ancak şimdilik Almanya savaşta ve yeni bir lidere ihtiyaç var. Bir sonraki Führer kim olacak?"
 germany.71.t:0 "Führer Öldü"
 germany.72.a:0 "Çok yaşa Führer!"
 germany.72.d:0 "Reichskanzlei'ye koşan SS birlikleri ve sadık ordu birimleri, hain komandoların tamamını öldürmeyi veya yakalamayı başardı ve Hitler bizzat trusty Luger'ıyla temizlik operasyonunu yönetti. Mucizevi bir şekilde, Führer çatışmadan sadece birkaç sıyrıkla çıktı.\n\nHain komplocular sadakatsizliklerinin bedelini ağır ödeyecekler ve Hitler şimdi mevcut savaşı şanlı bir zafere ulaştırma konusunda daha da kararlı!"
 germany.72.t:0 "Komplo Başarısız Oldu"
 germany.73.a:0 "Nasyonal Sosyalizme ölüm!"
 germany.73.b:0 "Himmler bu işi tersine çevirecek!"
 germany.73.c:0 "Göring bu noktada tek umudumuz!"
 germany.73.d:0 "Reichskanzlei'deki ağır çatışmalar binayı yanan bir harabeye çevirdi. Hitler'in yardımına koşan çok sayıda SS askerine rağmen, komploculara sadık ordu birimleri de çatışmaya katıldı ve belirleyici oldu. Führer'in öldüğü doğrulandı, uzun süredir sırdaşı olan Eva Braun çatışmada ağır yaralandı ve komplocular Berlin'deki tüm hükümet binalarını başarıyla ele geçirdi.\n\nWehrmacht'ın büyük bir kısmı diğer tarafa geçti, ancak birçok subay hala NSDAP sadıkları. Onları kim yönetmeli?"
 germany.73.e:0 "Eva Braun intikamını almalı!"
 germany.73.t:0 "Komplo Başarılı Oldu"
 germany.74.a:0 "Avusturya bizim olacak!"
 germany.74.d:0 "Avusturyalılar Alman Reich'in bir parçası olmayı özlüyor, ancak Viyana'daki inatçı hükümet şimdiye kadar bir birliği sağlama yönündeki tüm girişimlere direndi. Avusturya'da faşizme desteği artırmalıyız. Avusturya Nazi Partisi o zaman iktidardaki Avusturya faşistlerine karşı geçerli bir alternatif haline gelecektir.\n\nBir Abwehr ajanı bir casusluk görevi için hazırlandı. Onu Avusturya'da faşizme halk desteğini gizlice artırmak için kullanın."
 germany.74.t:0 "Zemin Hazırlığı"
 germany.75.a:0 "Kapitalistler ikimiz için de daha kötü bir tehdit."
 germany.75.b:0 "Faşistlere proletaryayı ezmek için silah vermeyeceğiz!"
 germany.75.d:0 "[Root.GetName] halkına ve ideolojik liderliğine yönelik önceki sert söylemlere rağmen, [From.GetLeader] ve Almanya şimdi bize ulaştı ve karşılıklı yarar sağlayan bir araştırma antlaşması talep etti. Bilgi alışverişi, gelecekte diğer araştırma faydaları vaatleriyle birlikte yeni tank tasarımları geliştirme çabalarımıza yardımcı olacak olsa da, önceki açıklamalara bakıldığında Almanların bunu kendi çıkarları için yaptığına şüphe yok. [From.GetLeader]'in hırslarına yardım etme riskine rağmen anlaşmaya devam etmeli miyiz?"
 germany.75.t:0 "Alman-Sovyet Antlaşması"
 germany.76.a:0 "Bu antlaşma geleceğe bir basamak olacak."
 germany.76.d:0 "[From.GetName] ile müzakerelerimiz başarılı oldu. Uluslarımızın yeni zırhlı birimlerin geliştirilmesinde birbirlerine yardım edeceği ve gelecekte diğer araştırma alanlarına olası bir genişleme ile bir anlaşmaya varıldı."
 germany.76.t:0 "Sovyetler Alman-Sovyet Antlaşmasını Kabul Etti"
 germany.77.a:0 "Riskleri şimdi pek de azaltmış sayılmazlar."
 germany.77.d:0 "[From.GetName], her iki ülkede de zırhlı birim araştırmalarını ilerletmeyi amaçlayan bir antlaşma önerimizi, muhtemelen üstün silahlarımızın onlara karşı kullanılacağından korkarak reddetti."
 germany.77.t:0 "Sovyetler Alman-Sovyet Antlaşmasını Reddetti"
 germany.78.a:0 "Düşmanı tespit etmek ilk adımdır."
 germany.78.d:0 "Almanya ile yapılan antlaşmada belirtildiği gibi, özel araştırma projelerinden bazıları keşiflerini mühendislerimizle paylaşıyor. Radar teknolojisindeki son bir atılım dikkatimizi çekti ve alandaki araştırmalarımızı ilerletmek için beklenmedik fırsatlar yarattı."
 germany.78.t:0 "Alman Ortak Hava Araştırması"
 germany.79.a:0 "Almanlarla çalışırsak, başka toprakları geri alma fırsatı bulabiliriz."
 germany.79.b:0 "İngiliz desteğine güvenebiliriz ve onlar da bize güvenebilir."
 germany.79.c:0 "Bu despotlar yurdumuzu almak istiyorsa, bunun için savaşmak zorundalar."
 germany.79.d:0 "Yunanistan Almanya'nın kontrolü altındayken, [From.GetLeader] hükümetimize onların saflarına katılması için baskı yaptı. Sovyet-Alman ittifakı bizi tarafsızlığın artık bir seçenek olmadığı bir konuma getirdi ve şimdi Berlin'den doğu topraklarımızı Sovyet müttefiklerine bırakmamızı ve elimizi zorlamak için kullandıkları pakta katılmamızı talep eden bir ültimatom geldi.\n\nTarafsızlığı koruyamasak da başka seçenekler var. İngiltere'den destek aramak bunlardan biri, direnmek bir diğeri. Ancak hiçbiri cumhuriyetin geleceğini kesin olarak güvence altına alamaz."
 germany.79.t:0 "Almanya'dan Ültimatom"
 germany.80.a:0 "Alacağımız en iyi teklif bu."
 germany.80.b:0 "Haklı olarak bizim olanı, onların çaldığı şey karşılığında vermeyeceğiz!"
 germany.80.d:0 "Almanlar uzun zamandır Danzig'e göz dikmiş, Ostpreussen'deki topraklarını Alman ulusunun geri kalanıyla birleştirmek istiyorlardı. Diplomatlar, bizden Danzig veya savaş arasında bir seçim yapmamızı isteyecekleri günün gelebileceği konusunda uyardılar.\n\nŞaşırtıcı bir şekilde, Almanların daha barışçıl bir çözüm olarak gördüğü bir teklifle karşılaştık. Danzig karşılığında, şu anda Alman yönetimi altında bir kukla devletten biraz daha fazlası olan yeni oluşturulan Slovakya devletini bize teklif ediyorlar. \nReddetmemiz durumunda Almanların hangi adımları atacağı bilinmiyor, ancak bu çatışmayı bazı toprak kazanımlarıyla çözme fırsatı bize verildi."
 germany.80.t:0 "Slovakya Karşılığında Danzig"
 germany.81.a:0 "Almanya yeniden birleşti."
 germany.81.d:0 "Polonya, Danzig'in [GER.GetNameDef]'e terk edileceği, Slovakya'nın ise Polonya kontrolüne geçeceği takası kabul etti. Bu anlaşma sayesinde, doğu komşumuzla samimi veya en azından açıkça düşmanca olmayan ilişkiler sürdürürken Danzig'i geri aldık."
 germany.81.t:0 "Danzig Slovakya Karşılığında Terk Edildi"
 germany.82.a:0 "Başka seçenekleri düşünme zamanı gelmiş olabilir."
 germany.82.d:0 "Danzig karşılığında [From.GetNameDef]'e Slovak toprakları konusundaki cömert teklifimiz reddedildi ve Danzig Polonya'nın elinde kaldı. Açıkçası, [From.GetLeader] Danzig'in haklı olarak Alman toprağı olduğu konusundaki anlayışımızı paylaşmıyor. \n[Root.GetLeader] öfkeli ve Danzig'i geri alma konusundaki diplomatik seçenekler tükenmiş görünüyor."
 germany.82.t:0 "[From.GetNameDefCap] Danzig'i Vermeyi Reddediyor"
 germany.83.a:0 "Sovyetlere karşı Almanya ve müttefiklerinin yanında olacağız."
 germany.83.b:0 "Böyle bir paktla herkes yeni bir dünya savaşı başlatabilir."
 germany.83.d:0 "Anti-Komintern Paktı ile [From.GetNameDef], Sovyet tehdidini kontrol altına almak için diplomatik zemini güvence altına aldı. Ancak, pakt bir askeri ittifak teşkil etmiyor ve imzacılar için iyi tanımlanmış yükümlülükler içermiyor. [From.GetLeader] şimdi paktı bir Anti-Sovyet koalisyonuna, herhangi bir imzacının Sovyetler Birliği ile savaş durumuna girmesi halinde savaşa birlikte katılma yönünde bağlayıcı bir anlaşmaya genişletmek istiyor.\n\nÖnemli ölçüde daha tehlikeli olmasına ve Sovyetlerle hala sürdürdüğümüz herhangi bir diplomasiyi sona erdirme olasılığına rağmen, bu aynı zamanda savaş durumunda yanımızda güçlü müttefikler olmasını sağlama şansımızdır."
 germany.83.t:0 "Anti-Sovyet Paktı"
 germany.84.a:0 "Öngörümüz işe yaradı."
 germany.84.d:0 "Anti-Sovyet Paktı'nı imzaladığımızda şüphelendiğimiz gibi, şimdi kendimizi Sovyetler Birliği ile savaş halinde buluyoruz. Diğer imzacıların sözlerini yerine getirme ve bize katılma zamanı geldi."
 germany.84.t:0 "Pakt Üyelerini Savaşa Çağır"
 germany.85.a:0 "[From.GetName] yalnız değildir!"
 germany.85.b:0 "Bu bizim savaşımız değil."
 germany.85.b_tt:0 "§YBu, pakta sadık kalan tüm ülkeler tarafından bir ihanet olarak görülecektir (§!§R-50§!§Y görüş)§!"
 germany.85.d:0 "Anti-Sovyet Paktı, tüm imzacıların Sovyetler Birliği ile herhangi bir savunma amaçlı çatışmaya katılmasını şart koşuyor. [From.GetName] şimdi Sovyetler tarafından saldırıya uğradı ve tüm pakt üyelerinden derhal yardımlarına gelmeleri için bir talep gönderdi. [Root.GetAdjective]'nin dünyayı Sovyetler Birliği tehdidinden bir kez ve herkes için koruma konusundaki adanmışlığını gösterme zamanı geldi."
 germany.85.desc.a:0 "Anti-Sovyet Paktı, tüm imzacıların Sovyetler Birliği ile herhangi bir savunma amaçlı çatışmaya katılmasını şart koşuyor. [From.GetName] şimdi Sovyetler tarafından saldırıya uğradı ve tüm pakt üyelerinden derhal yardımlarına gelmeleri için bir talep gönderdi. [Root.GetAdjective]'nin dünyayı Sovyetler Birliği tehdidinden bir kez ve herkes için koruma konusundaki adanmışlığını gösterme zamanı geldi."
 germany.85.desc.b:0 "[From.GetNameDef]'e verdiğimiz garanti, Sovyetler Birliği ile herhangi bir savunma amaçlı çatışmaya katılmamızı şart koşuyor. Şimdi Sovyetler tarafından saldırıya uğradılar ve anlaşmanın bize düşen kısmını yerine getirme ve derhal yardımlarına gelme zamanı geldi. [Root.GetAdjective]'nin dünyayı Sovyetler Birliği tehdidinden bir kez ve herkes için koruma konusundaki adanmışlığını gösterme zamanı geldi."
 germany.85.t:0 "[From.GetName] Pakt Üyelerini Savaşa Çağırıyor"
 germany.85.t.a:0 "[From.GetName] Pakt Üyelerini Savaşa Çağırıyor"
 germany.85.t.b:0 "[From.GetName] Garantiyi Devreye Sokuyor"
 germany.86.a:0 "Bir anlaşma yapalım. Belki başka yöne dönerler."
 germany.86.b:0 "Danzig, Gdansk olarak kalacak!"
 germany.86.d:0 "[GER.GetNameDefCap] uzun zamandır Büyük Savaş'ta kaybettikleri toprakları geri alma hedeflerini kamuoyuna duyurmuştu. Özellikle, Ostpreussen'i uluslarının geri kalanından ayıran Danzig topraklarına göz dikiyorlar. \n\nŞimdi, Danzig'in [GER.GetNameDef]'e devredilmesini talep ettiler ve karşılığında Poznań üzerindeki iddialarından vazgeçme sözünden başka bir şey sunmuyorlar. Savaş tehdidi kapıdayken, teklifi kabul etmek olası bir çatışmayı geciktirecektir, ancak Almanlara ileride ne olursa olsun daha fazla güç verme pahasına."
 germany.86.t:0 "Danzig ya da Savaş"
 germany.87.a:0 "Polonya savaştan kaçındı... şimdilik."
 germany.87.d:0 "Ültimatomumuz karşısında Polonya, haksız yere elde ettiği toprağı bize vermeyi kabul etti; bu da haklı olarak Almanya'ya ait olduğunu bildiklerini kanıtlıyor!"
 germany.87.t:0 "Polonya Danzig'i Terk Ediyor"
 germany.88.a:0 "Alternatifin ne olduğunu çok iyi biliyorlar."
 germany.88.d:0 "Polonya'nın Danzig'i barışçıl bir şekilde teslim etmesine izin verme çabalarımıza, hatta karşılığında diğer Alman toprakları üzerindeki iddialarımızdan vazgeçme sözü vermemize rağmen, reddedildik. Beklendiği gibi, dünya bize zorla almadığımız hiçbir şeyi vermiyor."
 germany.88.t:0 "Polonya Danzig'i Terk Etmeyi Reddediyor"
 germany.89.a:0 "Dünya titresin!"
 germany.89.a.tt:0 "§Y[ROOT.GetName]§!, §Y$the_berlin_moscow_axis$§!'ye katılıyor."
 germany.89.b:0 "Faşistlerle anlaşma yok!"
 germany.89.d:0 "Son işbirliğimizin başarısının ardından Almanlar bize ilginç bir teklifle geldi. Farklılıklarımızı bir kenara bırakmamızı ve batı demokrasileri izleyip kar elde ederken birbirimizle savaşarak gücümüzü boşa harcamak yerine, gücümüzü birleştirip onları ezmemizi öneriyorlar!"
 germany.89.t:0 "Kutsal Olmayan İttifak"
 germany.90.a:0 "Bizimle değillerse, bize karşıdırlar."
 germany.90.d:0 "Sovyetler teklifimizi reddetti, eğer [SOV.GetNameDef]'in kaynaklarını istiyorsak onları zorla almak zorunda kalacağız!"
 germany.90.t:0 "İttifak reddedildi"
 germany.91.a:0 "Reich için daha fazla asker!"
 germany.91.b:0 "Hayır!"
 germany.91.d:0 "Mouvement Franciste'nin güçlü liderleri büyük ilerleme kaydetti ve davamıza katılmayı teklif ediyor. Fransa ulusu Reich için savaşmaya hazır."
 germany.91.t:0 "Fransa İttifakımıza Katılmak İstiyor"
 germany.92.a:0 "Versay Antlaşması uygulanmalıdır."
 germany.92.d:0 "Renanya'yı yeniden askerileştirmelerinin bir savaş nedeni olarak görüleceğine dair açıklamamıza rağmen, Almanya geri adım atmayı reddetti ve uyarımızı görmezden gelerek askerden arındırılmış bölgeye ilerledi. Bu, barışı korumak için gösterdiğimiz tüm çabalara rağmen Avrupa'da bir kez daha savaşın patlak verdiği anlamına geliyor."
 germany.92.t:0 "Almanya Ültimatomu Reddediyor"
 germany.93.a:0 "Reddedilmeyeceğiz."
 germany.93.d:0 "Avrupa'nın büyük güçlerinin masaya oturup barış adına adil bir anlaşmaya varacağını umuyorduk. Bunun yerine İngilizler ve Fransızlar, ayak takımından Yugoslavları ve onların yapay devletini desteklemeyi seçti. Slovenya bizim olacak, öyle ya da böyle...."
 germany.93.d_FRA_abandoned_yugoslavia:0 "Avrupa'nın büyük güçlerinin masaya oturup barış adına adil bir anlaşmaya varacağını umuyorduk. Fransa davamızın haklılığını görse de, aptal İngilizler ayak takımından Yugoslavları ve onların yapay devletini desteklemeyi seçti. Slovenya bizim olacak, öyle ya da böyle...."
 germany.93.t:0 "Londra Konferansı"
 germany.94.a:0 "Almanya için bir Zafer!"
 germany.94.d:0 "Cesaret ve eylemin bir başka zaferinde, yakında Carniola olarak yeniden adlandırılacak olan Slovenya, Alman Reich'deki haklı evine geri döndü."
 germany.94.t:0 "Londra Teslimiyeti"
 germany.95.a:0 "Onlara bir ders verme zamanı."
 germany.95.d:0 "Dünyadaki yerlerine dair yanlış bir kanıyla Yugoslavlar, onlara sunduğumuz şansı kabul etmemeyi seçtiler."
 germany.95.t:0 "Yugoslavlar Reddediyor"
 germany.96.a:0 "Bu savaş uzun sürmeyecek."
 germany.96.d:0 "Aptal İtalyanlar tarafından kışkırtılan Yugoslavlar bize meydan okumaya karar verdi. Nankör İtalyanlar Yugoslavlarla birlikte yanacak. General Rommel bize en son kaçtıklarını ve hiç şüphesiz yine kaçacaklarını garanti ediyor."
 germany.96.t:0 "Londra Konferansı"
 germany.97.a:0 "İkisini de ezeceğiz."
 germany.97.d:0 "Büyük Londra Konferansı'nın Almanya'ya yapılan birçok yanlıştan birini düzeltmesi gerekiyordu. Ancak Fransızlar hala intikam peşinde ve sadece Almanya'yı dizlerinin üzerinde görmek istiyorlar. Davamızın haklılığına rağmen Belgrad'daki rejimi desteklediler. Boş tehditlerinin bizim için bir anlamı olduğunu gerçekten mi sanıyorlar?"
 germany.97.t:0 "Londra Konferansı"
 germany.98.a:0 "Tüm Yugoslavya'yı ilhak et."
 germany.98.b:0 "Bir Hırvat kuklası yap. Geri kalanını ilhak et."
 germany.98.c:0 "Hem Hırvatistan'ı hem de Yugoslavya'yı kukla yap."
 germany.98.d:0 "Habsburg İmparatorluğu'ndan oyulmuş Yugoslav devletinin asla sürmeyecek yapay bir ülke olduğunu her zaman biliyorduk. Yüzeyin altında kaynayan etnik kızgınlık kaynadı ve devlet dağılıyor. Durumu düzeltmek için müdahale etmeliyiz."
 germany.98.t:0 "Yugoslavya'nın Kaderi"
 germany.98_tt:0 "§YEğer Yugoslavya kabul ederse, aşağıdakiler gerçekleşecektir:§!\n"
 germany.99.a:0 "Elbette yapacaklar."
 germany.99.b:0 "Trenleri zamanında çalıştırmaya odaklansınlar."
 germany.99.d:0 "Belki de Yunan sınırlarının yeniden düzenlenmesi gerektiğini önerdiğimizde İtalyan büyükelçisi, Yunanistan'ın küllerinden Roma İmparatorluğu'nu yeniden inşa edeceklerini haykırdı."
 germany.99.t:0 "[ITA.GetNameDef] ile Yunanistan'ı Paylaş"
 germany.999.a:0 "Son savaşın kahramanlarını onurlandıralım!"
 germany.999.b:0 "Ne kadar da saçma bir öneri!"
 germany.999.desc:0 "Alman kuvvetlerinin çarpıcı zaferinin ardından, Bolşevik yönetiminin Avrupa'daki son kalıntılarını da yok etme zamanı geldi. Şimdi bile Stalin ve Lenin'in isimleri, yeni Alman Lebensraum'undaki iki büyük şehri utandırıyor ve onları almak için canlarını veren askerlerle alay ediyor. \n\n\"Weltkrieg Gazileri Derneği\" hükümete bu korkunç durumu düzeltmesi için bir öneri sundu."
 germany.999.t:0 "İki Şehrin Hikayesi"
 get_SOV_ideology_london_desc:0 "Komünist dalga devam ediyor ve Sovyet kuvvetleri kısa süre önce Londra'nın ele geçirilmesini tamamladı. Şehirdeki son direniş cepleri tam olarak temizlenmeden önce Kızıl Ordu tarafından hızla bir geçit töreni düzenlendi.\n\nKomünist sempatizanları, bilinen anti-komünistlerin isimlerini Sovyet askeri yetkililerine bildirmekte gecikmedi ve en kötü suçluları cezalandırmak için Trafalgar Meydanı'nda bir Halk Mahkemesi toplandı."
 get_SOV_ideology_london_desc_alt:0 "[SOV.GetAdjective] saldırısı devam ediyor. En son gelişmeler, Londra'nın saldırgan bir saldırıya maruz kaldığını ve ardından görünüşte hiç bitmeyen saldırıların bombardımanı altında düştüğünü gördü. \n\n Son direniş cepleri zar zor halledilmişti ki, zaferlerini kutlamak için [SOV.GetAdjective] kuvvetleri tarafından bir geçit töreni düzenlendi. [SOV.GetLeader]'in ve [SOV.GetLeader.GetHerHis] liderliğinin destekçileri, bu yeni dönem nihayet üzerlerine çökerken en büyük desteklerini ve hayranlıklarını sundular."
 get_SOV_ideology_london_response:0 "İleri yoldaşlar!"
 get_SOV_ideology_london_response_alt:0 "İleri!"
 greece.1.a:0 "Savaştan kaçınmak Yunanistan için en iyisidir."
 greece.1.b:0 "Onlara hiçbir şey verme."
 greece.1.d:0 "Sovyetlerden toprak vazgeçmemiz için baskı altındayız. Boyun eğmezsek topyekun bir savaşla tehdit ediyorlar. Boyun eğmek birçok Yunan askerinin hayatını kurtarabilir, ama bu toprak istedikleri son sefer mi olacak?"
 greece.1.t:0 "Sovyet Ültimatomu"
 greece.2.a:0 "Onlara direnemeyiz."
 greece.2.b:0 "Teslim olmayacağız."
 greece.2.d_BUL:0 "Almanlar, topraklarımızı Bulgar uşaklarına vermemizi talep ediyor."
 greece.2.d_GER_demand:0 "Almanya, Yunanistan'ı 'üsler' için toprak vermeye zorluyor."
 greece.2.d_ITA:0 "Almanlar İtalyan dostları için bizim sırtımızdan toprak istiyor."
 greece.2.d_ITA_BUL:0 "Almanlar hem İtalya'nın hem de Bulgaristan'ın toprağımız üzerindeki taleplerini zorluyor."
 greece.2.t:0 "İkinci Ljubljana Diktası"
 greece.3.a:0 "Kaçınılmaz Olanı Kabul Et."
 greece.3.b:0 "Reddet."
 greece.3.d:0 "Almanya, Almanya için 'koordinasyon' kabul etmemizi talep etti. Bu bizi fiilen bir Alman kuklası haline getirecektir."
 greece.3.t:0 "Yunanistan'ın Kaderi"
 greece.4.a:0 "İzmir bizim olacak."
 greece.4.d:0 "İtalyan dostlarımız Türkiye'ye karşı hamlelerini planlıyor. Bu, Ege Denizi'ndeki konumumuzu güvence altına almak için mükemmel bir fırsat. İzmir'i kendimize alalım ve İtalyanların Türkleri Avrupa'dan uzaklaştırmasına yardım edelim."
 greece.4.t:0 "Türkiye'ye Savaş"
 hungary.1.a:0 "Küstahlık."
 hungary.1.d:0 "Haklı iddiamıza rağmen, Almanya Transilvanya'nın Rumen kontrolünde kalmasına karar verdi. Versay'da yaratılan tüm yanlışları düzeltmeye hevesli olduklarını söylüyorlar, ancak belli ki bu sadece kendi sınırları söz konusu olduğunda geçerli."
 hungary.1.t:0 "Alman Arabuluculuğu"
 hungary.2.a:0 "Kutlanacak bir gün!"
 hungary.2.d:0 "Almanya, bildiğimiz gibi iddiamızın geçerliliğini tanıdı ve Kuzey Transilvanya Macaristan'a iade edildi. Bu tarihi bir andır!"
 hungary.2.t:0 "İkinci Viyana Diktası"
 hungary.3.d:0 "Almanya sadece iddiamızın geçerliliğini tanımakla kalmadı, aynı zamanda tüm Transilvanya'nın Macar yönetimine iade edilmesine karar verdi! Bu, ummaya cesaret edebileceğimizden daha fazlası."
 hungary.4.a:0 "Aptallar!"
 hungary.4.d:0 "Almanya iddiamızın geçerliliğini tanıdı ve Kuzey Transilvanya'yı bize verdi, ancak Romanya kararlarını kabul etmeyi inatla reddetti!"
 hungary.5.d:0 "Almanya iddiamızın geçerliliğini tanıdı ve tüm Transilvanya'yı bize verdi, ancak Romanya bu kararı kabul etmeyi inatla reddetti!"
 hungary.6.a:0 "Macaristan'ın Adaleti"
 hungary.6.d:0 "Almanlar Versay Antlaşması'ndan şikayet edebilirler ama Trianon Antlaşması'nın adaletsizliğiyle karşılaştırıldığında ucuz atlattılar. Ulusal kendi kaderini tayin hakkıyla ilgili olduğunu iddia etmelerine rağmen, o kadar çok gerçek Macar evladını yabancı yönetimine mahkum etti. Macar gururuna vurulan böyle bir yara da Voyvodina eyaletidir. Toprakların Macaristan'a geri verilmesi, bize yapılan bir yanlışı düzeltti."
 hungary.6.t:0 "Birinci Ljubljana Diktası"
 if_they_accept:0 "Kabul ederlerse:\n"
 if_they_reject:0 "Eğer reddederlerse:\n"
 impending_civil_war_tt:0 "§Rİdeolojik destek artmaya devam ederse, bu tam ölçekli bir iç savaşa yol açabilir!§!\n"
 italy.1.a:0 "Şanlı bir gün."
 italy.1.d:0 "Arnavut yetkililer taleplerimizi kabul etti ve [ALB.GetLeader] istifa etmek zorunda kaldı. Bundan böyle ve sonsuza dek Arnavutluk İtalyan olacak!"
 italy.1.t:0 "Arnavutluk Boyun Eğiyor"
 italy.10.a:0 "Bizi haklı sahipler olarak tanıdıkları sürece."
 italy.10.d:0 "İspanya İç Savaşı sırasında faşist davaya verdiğimiz destek ve savunma için minnettar olan [From.GetLeader], Mayorka, Minorka ve İbiza'daki geçici askeri tesislerimizi kalıcı hale getirmeyi kabul etti. Önemli stratejik konumlarıyla bu adalar imparatorluğumuza hoş bir katkı olsa da, İspanyollar şimdi borcun ödendiğini düşünüyor gibi görünüyor."
 italy.10.t:0 "İspanya Balear Adalarını Bırakıyor"
 italy.11.a:0 "İhtiyaç duyulursa, yine de talep edebiliriz."
 italy.11.d:0 "İç savaşta onlara verdiğimiz yardıma rağmen, [From.GetLeader] şimdi savunduğumuz Balear Adalarını bize vermeyi reddetti. Ulusumuzla iyi ilişkiler sürdürmek istediklerini ısrarla belirtmelerine rağmen, bu adaları İspanyol tutan askeri tesislerimizi geri çekmemizi sağlamak unutmayacağımız bir hakarettir."
 italy.11.t:0 "İspanya Adaları Vermeyi Reddediyor"
 italy.12.a:0 "Bu bizim zamanımız!"
 italy.12.b:0 "Daha iyi bir fırsat olacaktır."
 italy.12.d:0 "Yugoslavya'daki dostlarımız kuzey komşumuzdan baskı görüyor. Yozlaşmış ve çökmekte olan batılı güçler, Yugoslavya'nın haklarını savunmayarak neden yok olmakta olduklarını gösterdiler. Bu, doğru liderliğe sahip, dünya sahnesinde kararlılıkla ilerleyen daha genç, daha dinamik bir güç için tam da aradığı fırsat olabilir! Commando Supremo, yenilmez lejyonlarımızı salıvermeye neredeyse hazır olduklarını bildiriyor."
 italy.12.t:0 "Londra Konferansı"
 italy.13.a:0 "İtalya Yükseliyor"
 italy.13.d_dalmatia:0 "Paris barış konferansında batıdaki eski müttefiklerimizin ihanetinden sonra, kuzey Dalmaçya bize vaat edilmişken, Berlin ile aynı hizaya gelmeyi seçtik. Almanya, İtalyan dostluğunun göz ardı edilemeyecek kadar değerli olduğuna ve Yugoslavya'daki iddialarımızın tanınması gerektiğine akıllıca karar verdi. Adriyatik bir İtalyan gölü olacak ve adalet yerini bulacaktır."
 italy.13.d_dalmatia_montenegro:0 "Yugoslav devleti kendi çelişkileri altında çökerken, İtalya'nın hakkını almasının zamanı geldi. Batı'daki sönmekte olan güçler, İtalya'nın hakkını reddedecek kadar İtalya'dan korkuyor olabilirler, ancak İtalya'nın gerçek değerini gören yeni güçler yükseliyor. Sadece Haksız Zafer'de bize reddedilenleri güvence altına almakla kalmadık, aynı zamanda Arnavutluk himayemiz de topraklarını genişletti."
 italy.13.d_montenegro:0 "Yükselen güç Almanya ile aynı hizaya gelme kararımız meyvesini verdi. Yugoslav devleti dağılmaya doğru gidiyor ve Alman liderliği İtalyan dostluğunun faydalarını görecek öngörüye sahip. Karadağ, olması gerektiği gibi Arnavutluk'a devredilecek."
 italy.13.t:0 "Birinci Ljubljana Diktası"
 italy.14.a:0 "Kabul edilemez. Tek başımıza daha iyisini yapabiliriz."
 italy.14.b:0 "Onların saygısını kazanacağız."
 italy.14.d:0 "Almanya, Vichy toprakları için mütevazı, adil ve makul taleplerimizi engellemeyi uygun gördü. [From.GetFactionName]'nden ayrılmalı mıyız?"
 italy.14.t:0 "Almanya Taleplerimizi Engelliyor"
 italy.15.a:0 "İtalya için intikam!"
 italy.15.d:0 "Almanya, Vichy toprakları için taleplerimizi desteklemenin bilgeliğini gördü. Vichy, Savoy ve Korsika'yı bize teslim etti."
 italy.15.d_Corsica:0 "Az miktarda Alman desteğiyle Vichy, Korsika'yı bize teslim etti."
 italy.15.t:0 "Almanya Taleplerimizi Destekliyor"
 italy.16.a:0 "Korsika Sorunu sadece ertelendi."
 italy.16.d:0 "Almanya, Vichy Fransası ile olan anlaşmazlığımıza karışmayı uygun gördü. Korsika'yı alma girişimimizi engellediler ama Savoy hala bizde."
 italy.16.t:0 "Almanya Neredeyse Bizi Destekliyor"
 italy.2.a:0 "Bunu kolay yoldan halledebilirdik Zog!"
 italy.2.d:0 "Sonuna kadar meydan okuyan Kral Zog ültimatomumuzu reddetti. O ve danışmanları şimdi Arnavutluk'un toparlayabileceği acınası savunmaları bir araya getirmeye çalışıyor. Tiran'ı işgal etmeli ve bu komediye bir son vermeliyiz!"
 italy.2.t:0 "Zog Ültimatomu Reddediyor"
 italy.3.a:0 "Boyun eğmeliyiz."
 italy.3.b:0 "Bu olmayacak! Zog'a katılın!"
 italy.3.d:0 "İtalyan diplomatları bize işgallerine boyun eğmemizi talep eden bir ültimatom sundular! Arnavutluk, İtalyan kralı altında kişisel bir birlik içinde yönetilecek!"
 italy.3.t:0 "İtalyan Ültimatomu"
 italy.4.a:0 "Eğer bu kaleler Hannibal zamanında burada olsaydı..."
 italy.4.d:0 "Regio Esercito'dan (Kraliyet Ordusu) mühendisler kuzey sınırımızı inceledi ve Vallo Alpino'nun güçlendirilmesi ve genişletilmesi gereken yerleri belirledi. Gerekli inşaat emirleri zaten verildi."
 italy.4.t:0 "Vallo Alpino'nun Uzatılması"
 italy.5.a:0 "Mükemmel bir öneri!"
 italy.5.b:0 "Alman teknolojisi sadece Alman halkı içindir."
 italy.5.d:0 "[FROM.GetNameDefCap], uluslarımızı yakınlaştıracak ve ikimizi de daha güçlü kılacak bir teknoloji ve fikir alışverişi öneriyor."
 italy.5.t:0 "İtalyan-Alman Teknoloji Antlaşması"
 italy.6.a:0 "Harika!"
 italy.6.d:0 "Beklediğimiz gibi, Almanlar bir dizi teknoloji alışverişi için anlaşma yapmaktan memnuniyet duydular. Avrupa'da yeni rüzgarların estiği açık ve İtalya şimdi eski ihtişamını geri kazanmaya bir adım daha yakın!"
 italy.6.t:0 "İtalyan-Alman Teknoloji Antlaşması - Kabul Edildi!"
 italy.7.a:0 "Bundan sonra kendi başımızın çaresine baksak iyi olur."
 italy.7.d:0 "Almanlar antlaşma teklifimizi reddetti."
 italy.7.t:0 "İtalyan-Alman Teknoloji Antlaşması - Reddedildi!"
 italy.8.a:0 "Fransızlara katılalım."
 italy.8.b:0 "Fransızlara güvenilmez."
 italy.8.d:0 "Mouvement Franciste Fransa'da zemin kazanıyor ve ittifaklarına katılmamızı istedi. Bu İtalya'nın çıkarlarına hizmet eder mi?"
 italy.8.t:0 "Fransız İttifakına Katıl."
 italy.9.a:0 "İtalyanların savunduklarını ellerinde tutmalarına izin verin."
 italy.9.b:0 "Bu savaşı yabancı taleplerine boyun eğmek için kazanmadık!"
 italy.9.d:0 "İç savaş sırasında İtalya, milliyetçi dava için savaşmak üzere gönüllüler sundu. İdeolojik motivasyonlar öncelikli olsa da, İtalya'nın da sonucunda stratejik bir çıkarı vardı. Balear Adaları'nın, özellikle Mayorka'nın savunması, Akdeniz'deki konumları, özellikle de batı Avrupa kolonileriyle ilişkileri nedeniyle İtalya için özel bir ilgi alanıydı.\n\nŞimdi, [From.GetLeader] adaların kalıcı olarak İtalyan kontrolüne devredilmesini önerdi. Zaferimize katkıları göz önüne alındığında, önerilerin haklı gerekçeleri olabilir."
 italy.9.t:0 "İspanya'dan Balear Adalarını Talep Et"
 japan.1.a:0 "Bunun bedelini ödeyecekler!"
 japan.1.d:0 "Çinli yetkililer, Çin'e yönelik 'haksız saldırganlıklarımız' konusunda 'kırılma noktasına' ulaşıldığını iddia ediyor! Tazminat taleplerimiz reddedildi ve Şanghay'da Japon vatandaşlarının saldırıya uğradığına dair raporlar var. Çinlilerle kesin olarak hesaplaşmak için bir bahaneye ihtiyacımız varsa, işte bu!"
 japan.11.a:0 "Ne derlerse desinler Siyam'a gireceğiz."
 japan.11.b:0 "Geriye dönüp bakınca, işgalle tehdit etmek çok agresif."
 japan.11.d:0 "Hindiçin'de, Siyam sınırına yakın asker yığarak, Güneydoğu Asya'yı Avrupa sömürgeciliğinden kurtarmak için topraklarını bir üs olarak kullanma niyetimizin samimi olduğunu açıkça belirttik. Umarım, onlara bir askeri ittifaka katılma seçeneği sunarak - ki bu Siyam'ı fiilen Japon İmparatorluğu'nun bir kukla devleti yapacaktır - anlamsız, tek taraflı bir işgalden kaçınabiliriz. Elbette, reddederlerse bu bir savaş ilanı anlamına gelecektir."
 japan.11.t:0 "Siyam'a Ültimatom Ver"
 japan.12.a:0 "Japonya ile bir ittifakı kabul edeceğiz."
 japan.12.b:0 "Bağımsızlığımızı o kadar kolay teslim etmeyeceğiz!"
 japan.12.d:0 "Japonya uzun zamandır sınırımıza yakın kuvvet topluyor ve şüphelenildiği gibi, planları limanlarımızı Burma ve Malaya'ya daha fazla yayılmak için üs olarak kullanmak. Şimdi, bize boyun eğme ve geçmelerine izin verme ya da işgalle yüzleşme seçeneklerini sundular.\n\nBu, egemenliğimizden vazgeçmek ve bizi bir Japon kukla devleti yapmak olarak görülebilse de, bir savaştan kaçınmak bizim çıkarımıza olabilir."
 japan.12.t:0 "Japonya Ültimatom Veriyor"
 japan.13.a:0 "Büyük Doğu Asya Ortak Refah Alanı güçleniyor."
 japan.13.d:0 "[From.GetLeader] akıllıca bir kararla ültimatomumuzu kabul etmeye ve uluslarımız arasında bir askeri ittifak kurmaya karar verdi. Fiilen, Siyam'ı Pasifik'teki gelecekteki operasyonlar için bir üs olarak kullanabileceğiz."
 japan.13.t:0 "Siyam Ültimatomu Kabul Ediyor"
 japan.14.a:0 "Bunun böyle olması talihsizlik."
 japan.14.d:0 "[From.GetLeader], Siyam'a girme taleplerimizi ve askeri ittifak teklifimizi reddetti. Ne olursa olsun girme niyetimizi açıkladığımız için, bu savaş anlamına geliyor."
 japan.14.t:0 "Siyam Ültimatomu Reddediyor"
 japan.15.a:0 "Büyük adalet için!"
 japan.15.d:0 "İngilizlere karşı kazandığımız zaferlerin ardından çok sayıda Hint savaş esirimiz var. Doğru ikna ile o esirleri kuvvetlerimizi güçlendirmek için kullanabiliriz..."
 japan.15.t:0 "Hint Ulusal Ordusu"
 japan.16.a:0 "Savaşamayız."
 japan.16.b:0 "Savaşmalıyız!"
 japan.16.d:0 "Japonlar Çin'in zenginliğini kontrol etmek istiyor ve savaştan başka bir şeyle durdurulmayacaklar. Onlarla savaşmak istemiyorsak, kontrollerine boyun eğmeli ve bir Japon Kuklasından başka bir şey olmamalıyız."
 japan.16.t:0 "Japonya'nın Kuklası"
 japan.17.a:0 "Onların kaybı bizim kazancımız!"
 japan.17.d:0 "Korkak Çinliler bir kez daha taleplerimize boyun eğdi, ulusumuzun sadece bir kuklası olmayı kabul ettiler."
 japan.17.t:0 "Çin boyun eğiyor"
 japan.18.a:0 "Zor olmamalı!"
 japan.18.d:0 "Aptal Çinliler, hükümetlerinin belirli yönlerini yönetme yönündeki son derece makul talebimizi reddetti. Kaynaklarına erişmek istiyorsak onları fethetmemiz gerekecek."
 japan.18.t:0 "Çin reddediyor"
 japan.2.a:0 "Savaş beklemek zorunda kalacak."
 japan.2.d:0 "Şaşırtıcı bir şekilde, Çinliler Marco Polo Köprüsü'ndeki çatışmanın ardından geri adım atmayı seçti. Bizi kızdırmanın ağır bir bedeli olduğunu anladılar ve Pekin ile çevresindeki bölgeleri de içeren kapsamlı toprak tavizlerini kabul ettiler. Yavaş yavaş, Çin bizim oluyor."
 japan.3.a:0 "Bu nasıl olabildi?!"
 japan.3.d:0 "Ruslar ve Moğol uşakları Heilungkiang'daki birliklerimizin yığınağını tespit etti ve hazırlıklarımız tamamlanmadan önce sınıra büyük bir baskınla karşılık verdi! İki taraf ayrılmadan önce meydana gelen yoğun çatışmalarda kuvvetlerimiz ağır darbe aldı."
 japan.3.t:0 "Sınır Çatışması: Sovyet Zaferi"
 japan.4.a:0 "Bu onlara ders olacak!"
 japan.4.d:0 "Ruslar ve Moğol uşakları Heilungkiang'daki birliklerimizin yığınağını tespit etti ve hazırlıklarımızı bozmak için sınıra büyük bir baskın düzenlemeye çalıştı! Neyse ki, çabuk düşünen komutanlarımız kuvvetlerini bir kıskaç hareketine aldı. Sınırdan geri kaçmadan önce kuvvetlerine ağır kayıplar verdirdik."
 japan.4.t:0 "Sınır Çatışması: Japon Zaferi"
 japan.5.a:0 "Bir güç gösterisi yetti."
 japan.5.d:0 "Asker yığınağımızı tespit ettikten sonra, Sovyetler akıllıca bir şekilde Mançurya sınırına hemen bitişik bölgelerden kuvvetlerini geri çekmeyi seçti. Askerlerimiz terk edilmiş sınır karakollarından birkaçını geçici olarak işgal etti. Bu, umarım Rusların ve Moğol müttefiklerinin öne sürdüğü saçma sınır iddialarına bir son verecektir."
 japan.5.t:0 "Sovyet Geri Çekilmesi"
 japan.6.a:0 "Akıllıca bir hamle."
 japan.6.d:0 "Fransızlar taleplerimizi kabul etti ve Hindiçin'deki üsleri ve tesisleri tamamen bizim emrimizde. Kolonilerinin tam kontrolünü fiilen bize devrettiler."
 japan.6.t:0 "Fransızlar Taleplerimizi Kabul Ediyor"
 japan.7.a:0 "Aptallar!"
 japan.7.d:0 "Fransızlar küstahça taleplerimizi reddetti! Görünüşe göre Hindiçin'i istiyorsak, onu zorla almak zorunda kalacağız!"
 japan.7.t:0 "Fransızlar Taleplerimizi Reddediyor"
 japan.8.a:0 "Etmeleri gerektiği gibi."
 japan.8.d:0 "Almanlar Çin'den tüm danışmanlarını geri çağırmayı kabul etti. Şu anda bile Berlin'e giden uçaklara biniyor olmalılar. Almanya, Büyük Doğu Asya'nın geleceğinin Çin'e değil, Japonya'ya ait olduğunu kabul ediyor."
 japan.8.t:0 "Almanya Danışmanlarını Geri Çağırıyor"
 japan.9.a:0 "O zaman danışmanları da diğer Çinlilerle birlikte ölecek."
 japan.9.d:0 "Almanlar, askeri misyonları Doğu Asya planlarımıza doğrudan müdahale etmesine rağmen Çin'den danışmanlarını geri çağırmayı reddetti! Bunun uluslarımızın üzerine diplomasi inşa edeceği temeli aşındırdığını görmüyorlar mı? Almanlara güvenilebilir mi ki?"
 japan.9.t:0 "Almanya Talebimizi Reddediyor"
 lar_collab_gov.1.d:0 "[From.GetNameDefCap] son ​​zamanlarda ulusumuz içinde iş birliği kurma çabalarını artırdı. Birçok [This.GetAdjective] politikacısı [From.GetAdjective] rejimi hakkında oldukça sempatik bir şekilde konuşmaya başladı ve ulusumuz içindeki birçok taraftar [From.GetRulingIdeology] duygularını [From.GetNameDef]'e doğrudan desteğe dönüştürüyor.\n\nUlusumuzda büyüyen [From.GetAdjective] etkisi şüphesiz [Root.GetAdjective] direncini azaltacak ve hatta [Root.GetNameDef] teslim olursa [From.GetNameDef] ile iş birliği içinde yeni bir [From.GetRulingIdeology] hükümetine yol açabilir."
 lar_collab_gov.1.t:0 "[Root.GetNameDef]'deki [From.GetAdjective] Partizanları"
 lar_test.1.d:0 "TODO_LAR_BC: bu bir testtir\n Bu:[This.GetName]\n Kimden:[From.GetName]\n Kimden.Kimden:[From.From.GetName]\n Kök:[Root.GetName]\n"
 lar_test.1.t:0 "TODO_LAR_BC: Test Başlığı"
 low.1.a:0 "Bu bir rezalet!"
 low.1.d:0 "Fransızlar Maginot Hatlarını batıya doğru Manş Denizi'ne kadar uzatmaya karar verdiler! Bu, bir Alman işgali durumunda bizi terk etme niyetlerini açıkça gösteriyor. Paris'teki büyükelçiliğimiz resmi bir şikayette bulundu, ancak bunun pek bir etkisi olacağı şüpheli."
 low.1.t:0 "Fransa Maginot Hattını Uzatıyor"
 maybe_war_tt:0 "Bu §Y[From.GetNameDef]§! ile §Rsavaşa neden olabilir§!."
 morgenthau_division_tt:0 "[FRA.GetFlag] [FRA.GetNameDefCap], §Y[42.GetName]§!'i alır.\n[POL.GetFlag] Polonya, §Y[67.GetName]§! ve §Y[5.GetName]§!'i alır.\n[SOV.GetFlag] [SOV.GetNameDefCap], §Y[763.GetName]§!'i alır.\n[ENG.GetFlag] [ENG.GetAdjective] yönetimi altında uluslararası bir bölge şu bölgelerde oluşturulacaktır: §Y[51.GetName]§!, §Y[52.GetName]§! ve §Y[56.GetName]§!.\n [yalta_partner.GetAdjective] etki alanında bağımsız bir [GER.GetFlag] Kuzey Alman Devleti şu bölgelerde kurulacaktır: §Y[58.GetName]§!, §Y[59.GetName]§!, §Y[51.GetName]§!, §Y[61.GetName]§!, §Y[62.GetName]§!, §Y[63.GetName]§!, §Y[68.GetName]§!, §Y[66.GetName]§!, §Y[65.GetName]§!, §Y[64.GetName]§! ve §Y[60.GetName]§!. \nBağımsız bir [GER.GetFlag] Güney Alman devleti şu bölgelerde oluşturulacaktır: §Y[54.GetName]§!, §Y[50.GetName]§!, §Y[978.GetName]§!, §Y[52.GetName]§! ve §Y[53.GetName]§!."
 mutiny_event.1.a:0 "Umalım ki bu sonuncusu olsun."
 mutiny_event.1.desc:0 "Kışla kapılarında ve ön cephe sığınaklarında birkaç saatlik gergin müzakerelerin ardından ordumuzdaki isyan sona erdi. Kazanamayacakları bir mücadele ihtimaliyle karşı karşıya kalan isyancılar hemen geri çekilmeye karar verdiler.\n\nDaha sonra birincil konu, emirleri reddedenlerin kaderi oldu. Askeri Yüksek Komutanlık af yolunu seçti ve isyancılara sert bir şekilde cezalandırılmayacaklarına dair güvence verdi. Bazı askerlerin daha düşük bir rütbeye düşürülüp farklı bir birliğe transfer edildiği birkaç örnek yaşandı."
 mutiny_event.1.t:0 "Ayaklanma Ezildi"
 mutiny_event.2.a:0 "Kimse bunu tahmin edemezdi."
 mutiny_event.2.desc:0 "İsyancıları korkutup teslim olma girişimleri, askerlerin onları bastırmak için gönderilen birliklerden pek korkmaması nedeniyle muhteşem bir şekilde geri tepti. Ön saflarda geliştirilen becerileri kullanarak, onları yenmek için yapılan her türlü girişimin çok maliyetli olacağı pozisyonlarını savunmak için hızla bir örgütlenmeye gittiler.\n\nSadık birliklerin başındaki subaylar geri çekildiler ve daha fazla emir bekliyorlar, ancak bu küçük başarı şüphesiz isyancıların kararlılığını güçlendirdi."
 mutiny_event.2.t:0 "Boş bir tehdit"
 mutiny_event.3.a:0 "Güzel konuşma."
 mutiny_event.3.desc:0 "\"Bir askerin yaptığı fedakârlıkların değip değmediğini sorgulaması doğaldır. Sizden istediklerimizi haklı gösterecek bir gerekçe var mı? Sonucunu belki de hiç göremeyeceğiniz bir amaç uğruna canınızı ortaya koymanızı gerçekten isteyebilir miyiz?\n\nNe yazık ki doğduğumuz çağın koşullarını seçemeyiz. Özgürlüğümüzü, evlerimizi ve [Root.GetAdjective] yaşam biçimimizi korumak için savaşmak zorundayız. Bu savaşı biz seçmedik; bize dayatıldı! Kendim yapmaya hazır olmadığım hiçbir şeyi sizden istemeyeceğimi biliyorsunuz. Ben de zafer için gereken her şeyi yapacağınızı biliyorum.\"\n\n[Root.GetLeader] tarafından birliklerin önünde yapılan konuşma beklenen etkiyi yarattı. Askerler kendiliğinden tezahürata başladı ve alışılmış yakınmaların ötesine geçmeden görevlerine döndü."
 mutiny_event.3.t:0 "\"Ne için savaşıyoruz?\""
 mutiny_event.4.a:0 "Bunu hecelememiz gerekmemeli."
 mutiny_event.4.desc:0 "Savaş Bakanlığı ordudaki mevcut isyanın yaygın olarak bilinmesini engellemek için elinden geleni yaparken, mektupları sansürlemek ancak bir yere kadar işe yarayabilir. İzinli askerler, ordunun artık bu savaşta gereksiz yere kan kaybetmeye istekli olmadığını hızla yaydılar.\n\nİsyandan özel olarak bahsetmeden, [Root.GetLeader] bugün hükümetin artık savaşa bağlılık eksikliğini yansıtan her türlü eylemi vatana ihanet olarak değerlendireceğini duyurdu.\n\nVatana ihanetin cezası iyi biliniyor ve isyancılara yönelik kamuoyu desteği neredeyse buharlaştı. Bu haber elbette yaygın bir şekilde yayıldı. Genel halktan çok az destek gören askerler sessizce görevlerine geri döndüler."
 mutiny_event.4.t:0 "Savaşta İhanet Yasası"
 mutiny_event.5.a:0 "Bu yasalara saygısızlık derinden endişe vericidir."
 mutiny_event.5.desc:0 "Savaş Bakanlığı ordudaki mevcut isyanın yaygın olarak bilinmesini engellemek için elinden geleni yaparken, mektupları sansürlemek ancak bir yere kadar işe yarayabilir. İzinli askerler, ordunun artık bu savaşta gereksiz yere kan kaybetmeye istekli olmadığını hızla yayıyorlar.\n\nHükümetin bu gelgiti durdurma girişimleri tamamen başarısız oldu. Gizli Polis'ten gelen raporlar, isyancıların halk arasında güçlü bir desteğe sahip olduğunu ve bu nedenle onları izole edip bastırmamızın pek mümkün olmadığını gösteriyor."
 mutiny_event.5.t:0 "Sıkı Önlem Girişimi Başarısız"
 mutiny_event.6.a:0 "Korkunç derecede utanç verici."
 mutiny_event.6.desc:0 "[Root.GetLeader] bugün basına son barış teklifinin başarısız olduğunu duyurdu. Bu talihsiz olayların nedenleri çok karmaşık olsa da, [Root.GetAdjective]'in diğer tarafın verdiği tüm zararları ödemesini, tamamen silahsızlanmasını ve savaşı kendilerinin başlattığını kamuoyuna açıklamasını talep etmesi bardağı taşıran son damla olmuş olabilir.\n\nDüşmanlarımız da aynı şekilde karşılık verdi ve makul taleplerimizi koşulsuz teslim olma talebi olarak adlandırdı. Bu savaşı sonuna kadar sürdüreceklerine söz verdiler.\n\nDüşmanlarımızın açıkça akıl görmeye isteksiz olması ve savaşmaya devam edeceklerine söz vermesiyle, isyancıların bir barış anlaşması zorlama girişimleri çöktü."
 mutiny_event.6.t:0 "[Root.GetAdjective] Barış Teklifi"
 mutiny_event.7.a:0 "Aferin."
 mutiny_event.7.desc:0 "İsyancıların küçük gruplarının bunu bir kavgaya dönüştürmeye karar verdiği birkaç örneğe rağmen, isyanı bastırma operasyonumuz şaşırtıcı bir başarıydı. Beceriden ziyade sayıya güvenen sadık milisler, isyancıların kalelerini kuşattı ve teslim olmalarını talep etti. Çoğu asker kendi vatandaşlarına karşı silah almamaya karar verdi ve barışçıl bir şekilde teslim oldu.\n\nElebaşları gizli askeri mahkemelerde yargılanacak, ancak ortalama bir asker, isyancıların yeni hücreler oluşturmasını önlemek için farklı bir birimde olsa da cepheye geri gönderilecek."
 mutiny_event.7.t:0 "Askeri Sıkı Önlem başarılı oldu."
 mutiny_event.8.a:0 "Bu daha da kötüye gidiyor."
 mutiny_event.8.desc:0 "İşçi ve Asker Konseyleri seçimlerini engelleme girişimlerimiz durumu en kötümser tahminlerin bile ötesine taşıdı. Teslim olmak yerine, isyancılar geçici Konseyler oluşturdular, saha komutanlarını seçtiler ve sokaklarda savunmalar kurdular. Bunu bir kavga haline getirmeyi amaçladıkları açık.\n\nOrdudaki çatlaklar artık her birimde ve hatta çoğu zaman aynı ailenin üyeleri arasında bile görülüyor. [Root.GetNameDefCap] bir iç savaşın eşiğinde duruyor."
 mutiny_event.8.t:0 "Kardeş kardeşe karşı"
 mutiny_event.9.a:0 "Bu işe yaramalı, değil mi?"
 mutiny_event.9.desc:0 "Ordunun güçlü itirazlarına rağmen, [Root.GetAdjective] Ordusu'ndaki her birim komutanlarını seçmek için seçimler yaptı. Sonuçlar çok şaşırtıcıydı, çünkü seçilenlerin çoğu sahada bolca deneyime sahip başarılı askerlerdi. Birçok profesyonel subay bunu hala kişisel bir hakaret olarak görse de, çoğu askerin bu durumu dramatik bir şekilde tercih ettiği konusunda çok az şüphe olabilir."
 mutiny_event.9.t:0 "Memurun yeni bir cinsi"
 nationalists_chosen:0 "Kızıllara ölüm!\n"
 news.1.a:0 "Gerçekten ilginç zamanlar."
 news.1.b:0 "O Çinlilere hadlerini bildireceğiz!"
 news.1.c:0 "Doğru! Bir santim bile vermeyiz!"
 news.1.d:0 "Japon ve Çin kuvvetleri, Pekin'in hemen güneybatısında bulunan stratejik Marco Polo Köprüsü üzerinde sonuçsuz bir çatışmaya girdi. \n\n[CHI.GetNameDef], [JAP.GetNameDef]'in özür ve toprak tavizleri taleplerini reddederek, bunun yerine Japon saldırganlığının 'kırılma noktasına' ulaşıldığını iddia etti. \n\nDiplomatlar, değişken durumun her an savaşa yol açabileceğinden korkuyor."
 news.1.t:0 "Marco Polo Köprüsü Olayı"
 news.10.a:0 "İlginç."
 news.10.b:0 "Besarabya haklı olarak bizimdir."
 news.10.c:0 "Başka seçeneğimiz yoktu..."
 news.10.d:0 "Romanya sınırı boyunca kuvvet yığdıktan sonra, [SOV.GetNameDef] Bükreş hükümetine Besarabya'nın derhal kendi kontrollerine devredilmesi için bir ültimatom verdi. Bölge bir zamanlar Rus İmparatorluğu'na aitti ve [SOV.GetNameDef] bunu talepleri için yeterli yasal dayanak olarak görüyor.\n\nRomanya boyun eğmekten başka çaresi olmadığını ilan etti ve kuvvetleri Besarabya'dan çekildi."
 news.10.e:0 "Bu geçici zaferin tadını çıkar Moskova."
 news.10.t:0 "Sovyetler Birliği Besarabya'yı Talep Ediyor"
 news.100.a:0 "Polonya'nın hiç şansı yoktu."
 news.100.b:0 "Anavatan için bir zafer daha."
 news.100.c:0 "Bu bir felaket!"
 news.100.d:0 "[POL.GetNameDef]'de ilerleyen Alman kuvvetleri Varşova'yı ele geçirmeyi başardı. \n\nPraga ve birkaç diğer bölgede düzensiz çatışmalar devam ediyor, ancak şehirdeki organize direniş sona ermiş gibi görünüyor.\n\nPolonya hükümetinin, ilk Alman birlikleri Varşova'nın banliyölerine girerken şehri tahliye ettiği ve şu anki yerlerinin bilinmediği bildiriliyor.\n\nÜlkenin diğer bölgelerinde Alman işgalcilerine karşı mücadele devam ediyor, ancak başkentin kaybı Polonya savaş çabalarına ciddi bir darbedir."
 news.100.t:0 "Varşova'nın Düşüşü"
 news.101.a:0 "[GER.GetNameDefCap] ordusu durdurulamaz görünüyor!"
 news.101.d:0 "[FRA.GetNameDef]'in başka yerlerinde çatışmalar hala sürerken, Alman birliklerinin Paris'e girdiği haberleri geldi. \n\nBaşkent, son Fransız birlikleri geri çekilmeden saniyeler önce Fransız kuvvetleri tarafından açık şehir ilan edildi. Birkaç Alman birliği kolu, Parisliler şaşkın bir sessizlik içinde izlerken Champs-Élysées'den aşağı yürüyerek 1871'deki Prusya zafer geçidini yeniden canlandırdı. \n\nAskeri uzmanlar [FRA.GetNameDef]'in çöküşünün yakın olduğunu tahmin ediyor."
 news.101.t:0 "Paris'in Düşüşü"
 news.102.d:0 "Londra'dan gelen raporlar, İngiliz başkentinin ilerleyen Alman birlikleri tarafından ele geçirildiğini doğruluyor. \n\nBazı ilçelerden hala hafif silah sesleri duyulabiliyor, ancak şehir içinde önemli bir İngiliz kuvveti görülmedi.\n\nBir Fallschirmjäger müfrezesi Buckingham Sarayı'na baskın düzenledi, ancak Kraliyet Ailesi'nin saldırıdan çok önce güvenli bir şekilde tahliye edildiğine inanılıyor. \n\nFatih William'dan bu yana ilk kez Londra yabancı bir işgalcinin eline geçti."
 news.102.t:0 "Londra'nın Düşüşü"
 news.103.c:0 "Bunun için biri kurşuna dizilecek!"
 news.103.d:0 "Rus Devrimi'nin doğum yeri olan [195.GetCapitalVictoryPointName], ilerleyen Alman kuvvetlerinin eline geçti. \n\nBazı banliyölerden hala düzensiz çatışma sesleri duyulabiliyor, ancak harabeye dönmüş şehrin geri kalanına garip bir sakinlik çökmüş gibi görünüyor.\n\nBugün erken saatlerde, Alman askerleri sütunlar halinde St. Isaac Katedrali'nin önünden geçti; katedralin büyük kubbesi, yağmacı Luftwaffe bombardıman uçaklarının dikkatinden kaçmak için [SOV.GetSovietArmyAdjectiveBasedOnIdeology] Ordu mühendisleri tarafından griye boyanmıştı. \nTüm çabalarına rağmen, kurşun delikleri ve şarapnel darbeleriyle dolu."
 news.103.t:0 "[195.GetCapitalVictoryPointName]'nın Düşüşü"
 news.104.d:0 "Ukrayna SSC'nin başkenti Kiev, Sovyetler Birliği'ndeki ilerleyen Alman orduları tarafından ele geçirildi. \n\nEn önemli şehirlerinden birinin ele geçirilmesi Sovyetler için ciddi bir darbedir, ancak Almanların ivmelerini koruyup koruyamayacakları sorusu hala devam ediyor. Almanlar şehri işgal ettikten saniyeler sonra, NKVD tarafından Khreshchatyk ana caddesi boyunca binalara yerleştirilen binlerce mayının patlatıldığı ve zaten harabeye dönmüş şehre daha da fazla zarar verdiği bildirildi.\n\nŞimdi işgalci kuvvetler doğuya bakıyor."
 news.104.t:0 "Kiev'in Düşüşü"
 news.105.d:0 "İlerleyen Alman öncü birlikleri, Volga kıyılarındaki Stalin'in adını taşıyan şehir Stalingrad'ı ele geçirdi. \n\nHarabeye dönmüş Stalingrad Traktör Fabrikası'ndan geçerek ve stratejik olarak hayati Mamayev Kurgan tepelerini ele geçirerek, Almanlar son Sovyet savunucularını Volga'nın doğu kıyısına zorladı. Doğrulanmamış raporlara göre, partizanlarla birlikte savaşan Kızıl Ordu'dan kalanlar mücadelelerine devam etmek için kanalizasyonlara ve bodrumlara çekildi. \n\nAncak önemli bir organize direnişin kalmadığına inanılıyor."
 news.105.d_alt:0 "İlerleyen Alman öncü birlikleri, Volga kıyılarındaki sanayi merkezi [217.GetCapitalVictoryPointName]'nı ele geçirdi. \n\nHarabeye dönmüş [217.GetCapitalVictoryPointName] Traktör Fabrikası'ndan geçerek ve stratejik olarak hayati Mamayev Kurgan tepelerini ele geçirerek, Almanlar son [SOV.GetAdjective] savunucularını Volga'nın doğu kıyısına zorladı. Doğrulanmamış raporlara göre, partizanlarla birlikte savaşan [SOV.GetSovietArmyAdjectiveBasedOnIdeology] Ordu'sundan kalanlar mücadelelerine devam etmek için kanalizasyonlara ve bodrumlara çekildi. \n\nAncak önemli bir organize direnişin kalmadığına inanılıyor."
 news.105.t:0 "[217.GetCapitalVictoryPointName]'nın Düşüşü"
 news.106.a:0 "Bu Sovyetler Birliği'nin sonu mu?"
 news.106.b:0 "Sonunda, Moskova bizim!"
 news.106.c:0 "Faşistler Moskova'dan sürülmeli!"
 news.106.d:0 "Bugün şafak vakti, Alman panzerleri Moskova sokaklarında aceleyle dikilmiş barikatları yıktı ve yarı paletlilerin Kızıl Meydan'a Panzergrenadier'leri boşalttığı görüldü. \nBanliyölerdeki birçok yangından çıkan yoğun, dalgalanan duman, Alman piyadeleri Kremlin'e saldırırken havaya yükseliyordu. Kompleksin her santimini savunmaya kararlı inatçı NKVD kalıntılarıyla savaşmak için el bombaları ve alev makinelerinin gerektiği bildirildi. Rus başkenti şimdi Almanların elinde, ancak yanan bir harabeye dönmüş durumda. \n\nDoğrulanmamış raporlar, Lenin'in mumyalanmış cesedinin güvenli bir şekilde doğuya tahliye edildiğini gösteriyor."
 news.106.t:0 "Moskova'nın Düşüşü"
 news.107.d:0 "Sovyet Karadeniz Filosu'nun üssü olan ağır tahkim edilmiş Sivastopol şehri nihayet Alman saldırılarına yenik düştü. \n\nKaybı, Sovyetlerin Karadeniz'de herhangi bir mücadele girişimini ciddi şekilde engelleyecek ve şehrin düşüşü önemli bir Alman zaferi olarak kabul ediliyor.\n\nBerlin'den, şehrin bundan böyle Büyük Teoderik'ten sonra 'Theodorichshafen' olarak bilineceğini belirten bir kararname zaten yayınlandı."
 news.107.t:0 "Sivastopol'un Düşüşü"
 news.108.d:0 "Bugün erken saatlerde Alman kuvvetleri, Sovyetler Birliği'ne karşı savaşlarında hayati bir stratejik hedef olan Bakü şehrini başarıyla işgal etti. \n\nHazar Denizi kıyılarında yer alan şehir, Kafkasya'nın anahtarıdır ve birçok petrol sahası kesinlikle Alman savaş çabalarına fayda sağlayacaktır.\n\nEle geçirilmesi, Almanya'yı savaşı Orta Doğu'ya ve hatta muhtemelen Hindistan'a genişletebilecek bir konuma getiriyor."
 news.108.t:0 "Bakü'nün Düşüşü"
 news.109.d:0 "Deutsches Afrikakorps'tan kuvvetler Mısır'ın başkenti Kahire'ye doğru savaştı. \n\nMüttefik kuvvetler düzensiz bir şekilde çöle doğru geri çekilirken, Kahire'den geçen Alman askerleri, İngilizleri zalim olarak görmeye başlayan birçok vatandaş tarafından kurtarıcı olarak alkışlandı.\n\nKahire'nin düşüşü Müttefik savaş çabaları için önemli bir kayıptır ve birkaç uzman tüm Orta Doğu'nun artık Alman fethine açık olduğunu belirtti."
 news.109.t:0 "Kahire'nin Düşüşü"
 news.11.a:0 "İlginç."
 news.11.b:0 "Korkunç bir hata yaptılar."
 news.11.c:0 "Besarabya bizimdir!"
 news.11.d:0 "[SOV.GetNameDefCap], [ROM.GetNameDef] sınırına önemli kuvvetler yığdı ve bugün Moskova, Rumen hükümetine Besarabya'nın derhal kendi kontrolüne devredilmesi çağrısında bulunan bir ültimatom verdi. Bölge bir zamanlar Rus İmparatorluğu'na aitti ve [SOV.GetNameDef] bunu talepleri için yeterli yasal dayanak olarak görüyor.\n\nMeydan okuyan bir hamleyle Bükreş, tüm Sovyet toprak taleplerini reddetmeyi seçti ve Rumen ordusuna tam seferberlik emri verildi. \n\nUluslararası gözlemciler, Sovyet kuvvetlerinin her an sınırı geçmesini bekliyor."
 news.11.e:0 "Bırakın aptallar savaşsın."
 news.11.t:0 "Romanya Sovyet Taleplerini Reddediyor"
 news.110.d:0 "Washington D.C. bölgesindeki çatışmalar bugün, şehirdeki son direniş cepleri Potomac boyunca ilerleyen Alman kuvvetleri tarafından ortadan kaldırıldığında sona erdi. \n\nŞehrin üzerinde yoğun bir duman tabakası asılı ve bunun en azından bir kısmının son ana kadar hassas belgeleri yakan OSS ajanlarından geldiği bildiriliyor. Bir Waffen-SS müfrezesi, ABD Gizli Servisi üyeleriyle kısa bir silahlı çatışmanın ardından Beyaz Saray'ı güvence altına aldı, ancak Başkan'ın birkaç gün önce güvenli bir şekilde tahliye edildiğine inanılıyor.\n\nAmerikan başkentinin düşüşü, Alman savaş makinesinin korkunç gücünü gösteriyor."
 news.110.t:0 "Washington'un Düşüşü"
 news.111.d:0 "Saatler süren sokak savaşının ardından, ki bunun çoğunun silahlı düzensizlere karşı olduğu bildiriliyor, Alman öncü birlikleri New York Şehri'ne ilerledi ve şehrin kontrolünü ele aldı. \n\nBeşinci Cadde boyunca yerleştirilen derme çatma tanksavar engelleri etkisiz kaldı ve Panzergrenadier'ler Manhattan'dan blok blok savaşarak geçti.\n\nŞehrin doğu kesimlerinde birkaç gündür kontrolsüz yangınlar devam ediyor ve geceleyin silüeti aydınlatıyor. \n\nÖzgürlük Heykeli başıboş bir top mermisiyle başını kaybetti, ancak hangi tarafın ateşlediği hala bir tartışma konusu."
 news.111.t:0 "New York'un Düşüşü"
 news.112.d:0 "Birkaç çelişkili raporun ardından, Cebelitarık'ın Almanya'nın eline geçtiği şimdi doğrulandı. \n\nBu stratejik liman kenti Akdeniz'in girişini koruyor ve savaştan önce zaptedilemez olarak kabul ediliyordu. İngiliz garnizonu Kaya'nın altındaki tünellere çekildi, ancak sonunda alev makineleri ve el bombalarıyla yerlerinden çıkarıldı. \n\nCebelitarık Almanların elindeyken, Akdeniz Muharebesi'nde güç dengesi dramatik bir şekilde değişti."
 news.112.t:0 "Cebelitarık'ın Düşüşü"
 news.113.b:0 "İtalya için bir fetih daha!"
 news.113.d:0 "Muzaffer İtalyan askerleri bugün Kahire'ye girdi, son İngiliz birlikleri şehirden çekildikten saniyeler sonra. \n\nHemen bir zafer geçidi düzenlendi ve İtalyan askerleri ünlü simge yapılarının önünde fotoğraf çektirmek için Giza'nın Büyük Piramitlerine akın etti.\n\nKahire kontrol altındayken, [ITA.GetLeader] şimdi İtalyan Doğu Afrikası'nı İtalyan Libyası ile birleştirmeye ve Afrika'da bitişik bir koloni oluşturmaya bir adım daha yakın."
 news.114.d:0 "[GetItalianConquestofParisDesc]"
 news.114.d_council:0 "Paris'teki son Fransız direniş cepleri bugün temizlendi ve şehir şimdi sıkı bir şekilde İtalyan kontrolünde. \n\n[ITA.GetLeader] aceleyle zafer geçidine katılmak üzere Champs-Élysées'ye uçuruldu ve yürüyen birliklerin önünde beyaz aygırların üzerinde ilerledi. Kutlamalar sırasında, Fransa'daki mevcut harekatla Sezar'ın Galya'yı fethi arasında karşılaştırmalar yapıldı ve bunun İtalya'nın büyüklüğe yükselişinin sadece başlangıcı olduğuna dair vaatler birkaç konsey üyesinden geldi.\n\nZaman onların haklı olup olmadığını gösterecek."
 news.114.d_leader:0 "Paris'teki son Fransız direniş cepleri bugün temizlendi ve şehir şimdi sıkı bir şekilde İtalyan kontrolünde. \n\n[ITA.GetLeader] aceleyle zafer geçidine katılmak üzere Champs-Élysées'ye uçuruldu ve yürüyen birliklerin önünde beyaz bir aygırın üzerinde ilerledi. Kutlamalar sırasında, Fransa'daki mevcut harekatı Sezar'ın Galya'yı fethiyle karşılaştırdı ve bunun İtalya'nın büyüklüğe yükselişinin sadece başlangıcı olduğuna söz verdi.\n\nZaman onun haklı olup olmadığını gösterecek."
 news.115.d:0 "İtalyan kuvvetleri Londra'yı başarıyla bastı ve il Tricolore (İtalyan Bayrağı) Victoria Kulesi'ne çekildi. Şehrin bazı bölgelerinde küçük çaplı çatışmalar devam ediyor ve bu sabah yaşanan bir olayda birkaç Bersaglieri, Big Ben'in tepesinde saklanan keskin nişancılar tarafından vuruldu.\n\nOnları yerinden oynatmak için yapılan üç başarısız girişimin ardından, yerel komutanın 'üzücü bir aşırı tepki' olarak nitelendirdiği bir olayla tüm saat kulesi yıkım patlayıcılarıyla yıkıldı."
 news.116.d:0 "Kaya ve liman çevresinde ağır çatışmaların yaşandığı bildirildikten sonra İtalya'nın Cebelitarık'ı kontrol ettiği anlaşılıyor. Kaya'nın altındaki askeri tünellerden ara sıra patlama sesleri hala duyuluyor, ancak İtalyan yetkililer tüm organize direnişin sona erdiğini iddia ediyor.\n\nAkdeniz'e açılan bu hayati kapı İtalyan kontrolündeyken, İngiliz deniz kuvvetleri bölgedeki Regia Marina'ya (İtalyan Kraliyet Donanması) meydan okumakta zorlanacaktır."
 news.117.b:0 "İmparator için!"
 news.117.d:0 "'Doğu'nun Cebelitarık'ı' olarak kabul edilen Singapur, eski İngiliz sahipleri tarafından zaptedilemez bir kale olarak görülmesine rağmen İmparatorluk Japon kuvvetleri tarafından ele geçirildi.\n\nSingapur Japon Askeri Yönetimi, Fullerton Binası'nı karargah olarak seçti ve şehir, kabaca 'Şova döneminde kazanılan güney adası' anlamına gelen Syonanto olarak yeniden adlandırıldı. Kempeitai'nin, Japonların kalıcı olduğunu vurgulamak için sokaklarda topluca devriye gezdiği görülüyor."
 news.117.t:0 "Singapur'un Düşüşü"
 news.118.d:0 "Japon kuvvetleri Hawaii adası O'ahu'nun en büyük şehri Honolulu'yu bastı ve ele geçirdi. ABD Pasifik Filosu'nun eski karargahı olan Pearl Harbor'daki deniz üssü de düştü.\n\nTanıklara göre, kuşatılmış Amerikalı denizciler ve Deniz Piyadeleri Ford Adası'na çekildi ve burada yoğun bir topçu ve hava bombardımanına maruz kalana kadar inatçı bir direniş göstermeye devam ettiler. Bu ada kontrol altındayken, İmparatorluk Japon Donanması'nın uzun menzili daha da arttı."
 news.118.t:0 "Pearl Harbor'ın Düşüşü"
 news.119.d:0 "Güneydeki fetihlerini daha da genişleten Japon imparatorluğu, Sidney'i ve Avustralya'nın başkenti Canberra'yı ele geçirdi. Yerel savunucular Sidney Liman Köprüsü üzerinden Gözlemevi Tepesi'ndeki yeni mevzilere çekilmek zorunda kaldı, ancak köprüyü yıkma girişimleri ilerleyen Japon kuvvetleri tarafından engellendi ve ardından Canberra'yı almak için ilerlediler.\n\nJapon savaş bayrağı şimdi bölgenin yeni askeri yönetiminin karargahı olarak hizmet veren Canberra'daki Parlamento Binası'ndan sarkıyor ve Kempeitai askeri polisi sokaklarda dikkatli bir gözle devriye geziyor."
 news.119.t:0 "Yeni Güney Galler'in Düşüşü"
 news.12.a:0 "Bu iyi bitmeyecek."
 news.12.b:0 "Taleplerimizi reddetmemeliydiler."
 news.12.c:0 "Savunmalarımıza dikkat etmeliyiz."
 news.12.d:0 "Sovyet diplomatlar [FIN.GetNameDef] hükümetine Karelya bölgesindeki sınır düzenlemelerini talep eden bir ültimatom sundu. \n\nSovyet güçlerinin sınıra önemli miktarda yığılmasına rağmen Helsinki, \"Rus saldırganlarına tek bir ayak bile Finlandiya toprağının isteyerek verilmeyeceğini\" belirterek bu talepleri reddetti. \n\nUluslararası gözlemciler bir Sovyet işgalinin yakın olabileceğinden korkuyor."
 news.12.e:0 "Bakalım Bolşevikler ne kadar iyi iş çıkaracak..."
 news.12.f:0 "Yakında hatalarını anlayacaklar."
 news.12.t:0 "[FIN.GetNameDefCap] Sovyet Taleplerini Reddediyor"
 news.120.d:0 "Amerika anakarasında bir köprübaşı kurduktan sonra, Japon kuvvetleri Los Angeles'a yığıldı ve şehrin savunucularını bozguna uğrattı. Bu öğleden sonra Central Avenue'den aşağı uzun bir İmparatorluk birliği alayı yürürken Japon haber filmi fotoğrafçıları olayı kaydetti.\n\nAmerikan kuvvetleri geri çekilmeden önce, şehrin birkaç bölgesinde çatışmaların şiddetli olduğu bildirildi. Hollywood özellikle ağır hasar gördü ve birçok Japon subayı delik deşik ve ufalanan Hollywood Tabelası'nın önünde fotoğraf çektirdi."
 news.120.t:0 "Los Angeles'ın Düşüşü"
 news.121.d:0 "Çin Cumhuriyeti'nin başkenti Nankin, Japon İmparatorluğu kuvvetleri tarafından işgal edildi. Surlarla çevrili şehrin Çinli savunucularının şiddetli direnişine rağmen, Japon birlikleri Zhongshan Kapısı'nı ele geçirmeyi ve şehre girmeyi başardı.\n\nŞehrin farklı yerlerinde hala düzensiz silah sesleri duyuluyor ve birkaç yangın devam ediyor, ancak hayatta kalan Çin kuvvetlerinin çoğu ya geri çekildi ya da esir alındı. Şanghay'ın ele geçirilmesiyle birlikte, bu Japonya'nın Çin'e karşı savaşında önemli bir zaferdir."
 news.121.t:0 "Nankin'in Düşüşü"
 news.122.d:0 "Rus Uzak Doğusu'nun en büyük şehri ve Sovyet Pasifik Filosu'nun üssü olan Vladivostok, Japon birlikleri tarafından basıldı. Trans-Sibirya Demiryolu'nun en ucundaki stratejik konumu, kaybını Asya'daki Sovyet savaş çabaları için daha da zararlı hale getiriyor.\n\nŞehrin sakinlerinin çoğu, Rus İç Savaşı sırasında birkaç yıl süren Japon işgalini hala hatırlıyor. Bu kez, bazıları bir daha asla ayrılmayacaklarından korkuyor."
 news.122.t:0 "Vladivostok'un Düşüşü"
 news.123.d:0 "İmparatorluk Japon birlikleri, Gin İçenler Hattı'nı kırıp Hong Kong Adası'na çıktıktan sonra İngiliz Kraliyet Kolonisi Hong Kong'u ele geçirdi. Durum kısa sürede savunucular için savunulamaz hale geldi ve Vali, Japonların karargahlarını kurduğu Peninsula Hong Kong otelinde bizzat teslim oldu.\n\nYeni bir Japon valisi kısa bir törenle göreve başladı ve dünyaya 'Batı sömürgeciliğinden arınmış Yeni bir Hong Kong' ilan etti."
 news.123.t:0 "Hong Kong'un Düşüşü"
 news.124.d:0 "Filipinler'in başkenti Manila, Amerikalı ve Filipinli savunucularının geri çekilmesinin ardından Japonların eline geçti. Stratejik olarak hayati önem taşıyan Manila Koyu'nun girişi, Amerikan kıyı topçularının Corregidor Adası'ndaki yoğun konsantrasyonu nedeniyle şehrin düşmesinden bir süre sonra tartışmalı kaldı, ancak toplar sonunda ortak bir Japon saldırısının ardından sustu.\n\nManila Japon kontrolündeyken, Filipinler'in geri kalanının da kısa süre sonra onu izlemesi bekleniyor. Bu, Asya ve Pasifik'teki Amerikan kuvvetleri için acı bir yenilgidir."
 news.124.t:0 "Manila'nın Düşüşü"
 news.125.d:0 "Ağır bir bombardıman döneminin ardından, Hindistan'daki Kalküta şehrinin ilerleyen Japon kuvvetlerinin eline geçtiği şimdi doğrulandı. Şehrin eteklerinde hala düzensiz çatışmalar yaşanırken bile, Chowringhee caddesinde hızla bir zafer geçidi düzenlendi.\n\nJaponlar tarafından örgütlenen ve Hindistan'ın İngiltere'den kurtuluşuna adanmış bir askeri birlik olan Hint Ulusal Ordusu üyeleri geçit törenine katıldı ve kalabalıktan büyük alkış aldı. Kalküta'nın düşüşüyle birlikte, birçok kişi tüm Britanya Hindistanı'nın yakında onu izleyeceğini tahmin ediyor."
 news.125.t:0 "Kalküta'nın Düşüşü"
 news.126.d:0 "Hindistan'daki Japon saldırıları devam ediyor ve Yeni Delhi'nin düşüşü kısa süre önce gerçekleşti. Britanya Hindistanı'nın başkenti olan bu şehir muazzam bir stratejik öneme sahip ve kaybı devam eden Hint harekatında belirleyici bir faktör olabilir.\n\nViceroy'un kendisinin, eşyalarını Viceroy'un Evi'nden bir kamyon konvoyuna naklederken Japon öncü birlikleri tarafından yakalandığı bildiriliyor, ancak bu henüz doğrulanmadı."
 news.126.t:0 "Yeni Delhi'nin Düşüşü"
 news.127.d:0 "Amerikan savaş çabalarına devasa bir darbe olarak kabul edilmesi gereken bir olayda, Japon kuvvetleri Panama'ya çıktı ve garnizonunun teslim olmasını zorladıktan sonra kanalın kontrolünü ele geçirdi. Birkaç Amerikalı ve Panamalı asker grubunun gerilla savaşı yapmak için yakındaki ormana kaçtığı bildiriliyor, ancak Japon varlığını önemli ölçüde tehdit edebileceklerine inanılmıyor.\n\nKanalın düşmesiyle, Amerikan deniz kuvvetleri şimdi ABD Batı Kıyısı'na ulaşmak için Güney Amerika'yı dolaşmak zorunda kalacak ve bu da İmparatorluk Japon Donanması'na önemli bir stratejik avantaj sağlayacak."
 news.127.t:0 "Panama Kanalı'nın Düşüşü"
 news.128.b:0 "Derslik bir operasyon!"
 news.128.d:0 "Washington'daki yetkililer, ABD kuvvetlerinin Berlin'e birkaç yönden girerek şehri ele geçirdiğini doğruladı. Şehirdeki çatışmaların yoğun olduğu, Moltke Köprüsü'nün Amerikan ilerleyişini durdurmak için çaresiz Alman istihkamcıları tarafından yıkıldığı bildirildi.\n\nSpree üzerindeki diğer köprüler sonunda güvence altına alındı ve GI'lar (Amerikan askerleri) şiddetli Alman direnişine rağmen Kroll Opera Binası'na ve Reichstag'a başarıyla saldırdı. Yıldızlar ve Şeritler şimdi Reichstag üzerinde rüzgarda dalgalanıyor ve şehirdeki çatışmalar sona erdi. Berlin Muharebesi bitti."
 news.128.t:0 "Berlin'in Düşüşü"
 news.129.b:0 "Harika iş çıkardınız çocuklar!"
 news.129.d:0 "İngiliz kuvvetleri Berlin'e ilerledi ve Savaş Kabinesi, şiddetli bir muharebenin ardından Alman başkentinin başarıyla ele geçirildiğini duyurdu. Şafak vakti saldıran İngiliz komandoları Tempelhof Havaalanı'nı ele geçirirken, zırhlı kollar Frankfurter Allee boyunca ilerledi.\n\nReich Başbakanlığı İngiliz kontrolündeyken, şehirdeki çatışmalar büyük ölçüde sona erdi. Alman hükümetinin mevcut durumu belirsizliğini koruyor, ancak en azından bazı unsurlarının düşmeden önce şehirden kaçtığına inanılıyor."
 news.13.a:0 "Barış, ama ne pahasına?"
 news.13.b:0 "Şimdi çabalarımızı başka yerlere odaklayabiliriz."
 news.13.c:0 "Bağımsızlığımızı güvence altına aldık."
 news.13.d:0 "Uzun tartışmalardan sonra, [FIN.GetNameDef] hükümeti Karelya bölgesindeki sınır düzenlemeleri için Sovyet taleplerini kabul etmeye karar verdi. \n\n[SOV.GetNameDef], şimdi eski Finlandiya sınırından sadece 30 kilometre uzaklıkta bulunan Leningrad'ın güvenliğini artırmak için bir tampon bölge oluşturma ihtiyacını gerekçe gösterdi. \n\nBirçok gözlemci Finlandiya'nın tam ölçekli bir Sovyet işgalinin yakın olmasından korkuyordu, ancak bu diplomatik çözüm bu korkuları yatıştırmalı."
 news.13.e:0 "Yazık oldu. Bolşevikleri meşgul ederdi."
 news.13.f:0 "Yoldaşlarımız güçlerini gösteriyor!"
 news.13.t:0 "[FIN.GetNameDefCap] Sovyet Taleplerini Kabul Ediyor"
 news.130.b:0 "Yaşasın Fransa!"
 news.130.d:0 "Fransız kuvvetleri, şehir sınırları içinde bir dizi şiddetli muharebenin ardından düşen Alman başkentini başarıyla bastı. Büyük bir Waffen-SS asker grubu Olimpiyat Stadyumu'nda barikat kurdu, ancak topçu destekli Yabancı Lejyonerlerin kararlı bir saldırısının ardından burası da düştü.\n\nFransız trikoloru şimdi Reich Başbakanlığı üzerinde dalgalanıyor ve bazı banliyölerden hala düzensiz çatışmalar bildirilmesine rağmen, Berlin'in çoğunun organize direnişten temizlendiğine inanılıyor."
 news.131.b:0 "Polonya hücumu durdurulamaz."
 news.131.d:0 "Almanya'nın başkenti Berlin'den umutsuz çatışma haberleri geliyor, ancak şimdi şehrin tamamen Polonya'nın elinde olduğuna inanılıyor. Frankfurter Allee boyunca ilerledikten sonra Polonyalılar, şiddetli bir muharebeye sahne olan Alexanderplatz'a ulaştı.\n\nŞehrin başka yerlerinde, Brandenburg Kapısı'nın bir Polonya tankı tarafından çarpılmasının ardından çöktüğü iddia ediliyor ve Kroll Opera Binası, inatçı SS savunucularının teslim olmayı reddetmesinin ardından bir topçu ateşiyle yerle bir edildi. Polonya bayrağının kırmızı beyazı şimdi Reichstag üzerinde dalgalanıyor ve son direniş cepleri de halledildi."
 news.132.b:0 "Büyük bir zafer!"
 news.132.d:0 "Müttefik kuvvetler, garnizonunun teslim olmasının ardından kısa süre önce Roma'ya girdi ve şehir şimdi askeri işgal altında. Çoğu tarihi yapı, şehir üzerindeki kontrol için yapılan bir başka savaşı daha atlatarak sağlam kalmış görünüyor. En azından şimdilik, Müttefik birlikleri Kutsal Makam'ın isteği üzerine Vatikan Şehri'nin dışında kaldı.\n\nRoma'nın düşüşü İtalyan seferinde önemli bir kilometre taşıdır ve bazıları bunun yarımadadaki ilerleyen Müttefik ordularına karşı organize direnişin sonu anlamına gelip gelmediğini merak ediyor."
 news.132.t:0 "Roma'nın Düşüşü"
 news.133.d:0 "Fransa'dan kuvvetler, şehrin kalan İtalyan garnizonunun çevredeki kırsala dağılmasının ardından kısa süre önce Roma'ya girdi. Fransız birlikleri tüm önemli hükümet binalarını işgal etmek için hızla hareket etti ve Via del Corso boyunca yürüyen askerler ve zırhlı araçlardan oluşan uzun bir alayla bir 'zafer alayı' düzenlendi.\n\nRoma'nın düşüşüyle birlikte, İtalya'nın savaşa devam etme yeteneği sorgulanıyor. Dış gözlemciler, şehrin düşmesinden hemen önce şehirden kaçan İtalyan hükümetinin yakında teslimiyet müzakerelerine başlayacağını bekliyor."
 news.134.d:0 "Fransa'nın başkenti Paris'in Alman işgalinden kurtarıldığı şimdi doğrulandı. Müttefik kuvvetler şehre girdi ve kalan Alman garnizonu teslim oldu. Parisliler, Champs Élysées'den aşağı yürüyen kurtarıcılarını alkışlarken görülüyordu, şehrin bazı bölgelerinde Alman keskin nişancı ateşi söylentileri olsa bile.\n\nAlmanların yakıp yıkma stratejisi uygulayacağından ve Paris'i yanan bir harabeye bırakacağından korkuluyordu, ancak şehrin simge yapılarının kurtarıldığı anlaşılıyor. Gerçekten de, Fransız trikoloru şu anda bile Eyfel Kulesi'nden dalgalanırken görülebilir."
 news.134.t:0 "Paris'in Kurtuluşu"
 news.135.d:0 "Amerikan kuvvetleri Tokyo'ya girdi ve ABD Savaş Bakanlığı kısa süre önce şehirdeki büyük muharebe operasyonlarının sona erdiğini duyurdu. Özellikle İmparator'un Amerikan saldırısı başlamadan önce şehri terk ettiğine inanılmasına rağmen, İmparatorluk Muhafızları'nın fanatik üyeleri tarafından savunulan İmparatorluk Sarayı civarında çatışmaların ağır olduğu bildirildi.\n\nTokyo'nun düşüşüyle birlikte uzmanlar, Japon Ana Adaları'nın geri kalanındaki organize direnişin yakında çökeceğini tahmin ediyor. Japon sertlik yanlıları İmparatoru ölümüne mücadeleye devam etmeye ikna etmedikçe, barış müzakerelerinin kısa süre içinde başlaması bekleniyor."
 news.135.t:0 "Tokyo'nun Düşüşü"
 news.136.d:0 "Bir dizi şiddetli muharebenin ardından Müttefik kuvvetler, [SOV.GetNameDef]'in başkenti Moskova'yı işgal etti. Şehir büyük hasar gördü ve Moskva nehrinin her iki yakasında da yangınlar hala devam ediyor. Ağır bombardımana rağmen Kremlin makul ölçüde sağlam ve Müttefik İşgal İdaresi'nin karargahı için seçildi.\n\nMoskova'nın kaybıyla Sovyet savaş çabaları muazzam bir darbe aldı. Hükümetin çoğunun düşmeden çok önce şehri tahliye ettiğine inanılmasına rağmen, askeri uzmanlar tam bir Sovyet çöküşünün çok uzak olmayabileceğini iddia ediyor."
 news.137.d:0 "Londra'daki çatışmalar sona erdi ve son Alman direniş cepleri de halledildi. Tehlike geçtiği anda, coşkulu kalabalıklar Amerikalı kurtarıcılarını kutlamak için sokaklara dökülürken, şehir genelinde kilise çanları duyuluyordu.\n\nKurtuluş ateşi İngiltere'yi sarmış gibi görünüyor, zira Alman işgalinin nihayet sona ermesi muhtemel görünüyor. Hala Alman kontrolü altındaki bölgelerde kendiliğinden ayaklanmalar bildirildi, ancak bu olaylara sert müdahale edildi. Özgürlük sonunda Birleşik Krallık'a geri mi döndü?"
 news.137.t:0 "Londra'nın Kurtuluşu"
 news.138.b:0 "[GetSOVIdeologyLondonResponse]"
 news.138.d:0 "1920'nin aksine, Sovyet orduları kısa süre önce Varşova'ya yaklaştığında 'Vistül Mucizesi' yaşanmadı. Şehirdeki Polonya direnişi büyük ölçüde çöktü ve Sovyet bayrağı çoğu hükümet binasının üzerinde dalgalanırken görülebilir.\n\nPolonya ulusunun sonuna mı tanık oluyoruz, yoksa kuvvetleri bir şekilde toparlanıp başkentlerini geri almayı başaracak mı? Çoğu uzman bu senaryoyu olası görmüyor."
 news.139.a:0 "Bu sonun başlangıcı mı...?"
 news.139.d:0 "Harabeye dönmüş Varşova şehri, son Alman savunucuları yanan banliyölerinden çekildikten sonra ilerleyen Sovyet ordularının eline geçti. Şehrin büyük bir kısmı önceki savaşlardan sonra harabe halinde ve yerel direniş üyeleri kurtarıcılarını karşılamak için enkazın arasından aceleyle çıktı.\n\nVarşova Sovyet kontrolündeyken, Almanya'nın Doğu Avrupa'daki stratejik durumu yakında daha da kötüleşebilir. Uzmanlar, şehri geri almak için bir karşı saldırı düzenleyebileceklerinden şüpheli, ancak yıpranmış yerel halk pek ikna olmuş görünmüyor."
 news.139.t:0 "Varşova'nın Kurtuluşu"
 news.14.a:0 "Tannu ne?"
 news.14.b:0 "Daha iyi olacaklar."
 news.14.d:0 "Bugün erken saatlerde Moskova'dan yapılan bir basın açıklamasında, [TAN.GetNameDef]'in resmen ilhak edildiği duyuruldu. \n\nYüksek Sovyet, Tuva parlamentosunun SSCB'ye üyelik talebini kabul etti. \n\nSadece Sovyetler Birliği ve Moğolistan tarafından resmi olarak tanınan küçük Tuva Halk Cumhuriyeti, özerk bir oblast olarak örgütlenecek."
 news.14.t:0 "[SOV.GetNameDefCap] Ekler [TAN.GetName]"
 news.140.a:0 "[SOV.GetAdjective] ayısı büyüyor..."
 news.140.b:0 "Faşist sığınağı bizimdir!"
 news.140.d:0 "Bir Sovyet bildirisi, Berlin'deki tüm Alman kuvvetlerinin teslim olduğunu duyurdu. Şehri kuşattıktan sonra Ruslar, Alman savunucuları her adımda şiddetle direnirken birkaç farklı yönden şehre saldırdı.\n\nSovyet birlikleri sonunda Moltke Köprüsü'nü geçip Reichstag binasına girdi ve Sovyet bayrağı şehrin üzerinde dalgalandırılana kadar oda oda savaştı. Berlin Muharebesi sona erdi."
 news.141.d:0 "Roma, 'Ebedi Şehir', ilerleyen Sovyet öncü birliklerinin eline geçti. İtalyan kuvvetleri geri çekilirken, Rus birlikleri şehre yayıldı ve kalan birkaç direniş cebini halletti. Çoğu tarihi yapı pek az hasar görmüş gibi görünüyor, ancak Panteon'un makineli tüfek ateşiyle tarandığına dair çelişkili raporlar var.\n\nŞimdiye kadar Sovyetler Kutsal Makam'ın tarafsızlığına saygı duyuyor gibi görünüyor, ancak kuvvetleri Vatikan Şehri'nin etrafında bir halka oluşturdu - bu jest Kutsal Peder'i kesinlikle tedirgin etmelidir."
 news.142.d:0 "Kızıl Ordu'nun amansız ilerleyişi devam ediyor ve şimdi Fransız başkentinin düştüğüne dair haberler geliyor. Fransız Komünistlerinin şehre girdiklerinde Sovyetlere yardım ettiği, armée de terre'nin (Fransız Kara Kuvvetleri) geri çekilen unsurlarına yönelik saldırılara katıldığı iddia ediliyor.\n\nŞehir genelinde, Parislilere 'Burjuva baskısından kurtarıldıkları' ve Paris Komünü'nün nihayet yeniden canlandırıldığı bildirilen broşürler dağıtıldı."
 news.143.a:0 "Bu sonun başlangıcı mı...?"
 news.143.d:0 "Moskova'dan yapılan günün son emrinde, Paris'in Alman kuvvetlerinden ele geçirildiği duyuruldu. Şehrin savunucularının çoğunun, nehri geçen birkaç köprünün ağır bir Sovyet topçu ateşiyle yıkılmasının ardından Seine Nehri'nde boğulduğu bildiriliyor.\n\nEyfel Kulesi, dibindeki büyük bir patlamanın ardından devrildi, ancak hangi tarafın sorumlu olduğu belirsizliğini koruyor. Sovyet kuvvetleri şimdi Champs-Élysées'de bir zafer geçidi düzenlerken, yorgun Parisliler sadece bir işgalciyi diğeriyle mi değiştirdiklerini merak ederek izliyor."
 news.144.d:0 "[GetSOVIdeologyLondonDesc]"
 news.145.a:0 "Önemli bir gelişme."
 news.145.d:0 "Londra'nın merkezinde yangınlar devam ediyor, ancak şehrin Alman işgalcilerinin çoğunun ya savaşta düştüğüne ya da ilerleyen Sovyet kuvvetleri tarafından esir alındığına inanılıyor. Rusları ilerlerken alkışlamak için kalabalıklar sokaklara döküldü ve son inatçı direnişçilerle başa çıkmak için harekete geçiyorlar.\n\nİşbirlikçilere sert davranıldı ve Sovyetler, kurtarılmış şehri bir sonraki duyuruya kadar yönetmek için geçici bir konsey kurdu. Eleştirmenler, bu konsey üyelerinin tamamının Büyük Britanya Komünist Partisi'nden seçilmiş gibi göründüğünü belirtti."
 news.146.d:0 "Sovyet kuvvetleri Tokyo'ya yığıldı ve şehir genelinde ağır çatışmalar yaşandığı bildirildi. Şehrin çoğu şimdi Sovyet kontrolünde, ancak doğu banliyölerinde büyük yangınlar hala devam ediyor.\n\nÇatışmalar İmparatorluk Sarayı'na doğru kaydığında, İmparatorluk Muhafızları üyelerinin yaklaşan Sovyet birliklerine süngü hücumları başlattığı bildirildi. Saray sonunda, bileşiğin içinde oda oda savaşmak zorunda kalan bir VDV paraşütçü müfrezesi tarafından basıldı. Esir alınmadı, ancak İmparator'un şehrin düşmesinden önce güvenli bir şekilde tahliye edildiğine inanılıyor."
 news.147.d:0 "Eski Rus İmparatorluğu'nun başkenti Leningrad, Finlandiya kuvvetleri tarafından işgal edildi. Üç milyondan fazla nüfusuyla şehir, neredeyse tüm Finlandiya kadar nüfusa sahip, ancak bu gerçek Finlandiyalı saldırganları caydırmış görünmüyor.\n\nŞehrin dışındaki bölgelerde Ingriya Finleri önemli bir azınlık oluşturduğu için şehrin Büyük Finlandiya'ya entegre edilip edilmeyeceği konusunda bazı tartışmalar var. Bu, elbette, Kızıl Ordu'nun şehri bir karşı saldırıyla geri alamayacağını varsayıyor."
 news.148.d:0 "Tokyo'dan gelen son haberler, şehrin Çin kuvvetlerinin eline geçtiğini doğruladı. İmparatorluk Sarayı da dahil olmak üzere şehrin büyük bir kısmı harabe halinde ve şimdi Çin askeri yönetiminin karargahı olarak hizmet veriyor.\n\nYabancı muhabirler, şehirde yürüyen görünüşte sonsuz bir Çinli asker alayının yer aldığı büyük bir zafer geçidine tanık oldu. Sokakları dolduran Japon vatandaşları geçit törenindeki birlikleri sessizlik içinde izledi."
 news.149.d:0 "İki yüzyıldan fazla bir süre önce İngilizler tarafından ele geçirilmesinden bu yana ilk kez Cebelitarık yeniden İspanyolların elinde. Bölgeden gelen haberlere göre, garnizonun çoğu teslim oldu, ancak birkaç inatçı direnişçi Kaya'nın altındaki tünellere çekildi.\n\nMadrid'deki bir basın toplantısında hükümet temsilcileri, Cebelitarık'ın bundan böyle 'ebediyen' İspanyol toprağı sayılacağını belirtti. İngiliz diplomatları şaşırtıcı olmayan bir şekilde açıklamayı yalanlayarak 'tam bir saçmalık' olarak nitelendirdi."
 news.15.a:0 "Bakalım bu ne kadar sürecek."
 news.15.b:0 "Avrupa haritası yeniden çizilecek."
 news.15.c:0 "Umarım bu revizyonlar bir gün bize de yarar sağlar."
 news.15.d:0 "Alman arabuluculuğunun ardından Viyana'da imzalanan bir antlaşma ile Kuzey Transilvanya Macar yönetimine iade edilecek.\n\nToprak daha önce I. Dünya Savaşı'nın sonunda [ROM.GetNameDef]'e verilmiş ve bu da acı bir anlaşmazlığa yol açmıştı. \n\nAvrupa'da yeni bir düzen kurulmuş gibi görünürken, bunlar ayarlanacak birçok sınırdan ilki mi?"
 news.15.e:0 "Yaşasın!"
 news.15.t:0 "İkinci Viyana Diktası"
 news.150.b:0 "Aptallar kendi mezarlarını kazdılar."
 news.150.d:0 "Yugoslav hükümetinin Almanya ile işbirliği yapma girişimleri ulusun ordusu içinde birçok muhalife sahipti ve bu durum bugün hüküm süren hükümdarı devirip Kral II. Petar'ı tahta çıkaran bir darbeyle sonuçlandı.\n\nUlus, Almanya ile birçok bağını kesti ve yeni rejim işbirliği yapmak yerine bir savaşı riske atmaya hazır görünüyor."
 news.150.t:0 "Yugoslavya'da Darbe"
 news.151.a:0 "Kriz şimdilik atlatıldı."
 news.151.b:0 "Bizim günümüz de gelecek."
 news.151.c:0 "Meydan okunmadan kalmalarına izin vermeyeceğimizi bilmeliydiler."
 news.151.d:0 "Almanya'nın Versay Antlaşması ile belirlenen kuralları sona erdirme ve Renanya'yı yeniden askerileştirme girişimlerinin ardından, Müttefiklerden gelen bir ültimatom onları geri adım atmaya zorladı. Hem İngiltere hem de Fransa'nın Almanya'nın planla devam etmesi durumunda seferber olma tehdidiyle, bu düzeyde bir direnişin beklenmedik olduğu çabucak anlaşıldı. Almanya her iki ülkeyle de topyekun bir savaşa hazır değildi.\n\nDurum böyleyken, Renanya, Almanya savaşa girmedikçe antlaşmanın dikte ettiği gibi askerden arındırılmış bir bölge olarak kalacaktır."
 news.151.t:0 "Renanya Askerden Arındırılmış Kalıyor"
 news.152.c:0 "Fransa yalnız ama güçlü duruyor."
 news.152.d:0 "Almanya'nın Versay Antlaşması ile belirlenen kuralları sona erdirme ve Renanya'yı yeniden askerileştirme girişimlerinin ardından, Fransa'dan gelen bir ültimatom onları geri adım atmaya zorladı. İngiltere'nin müdahale etmeyi reddetmesine rağmen, Fransa'nın Almanya'nın planla devam etmesi durumunda seferber olma tehdidiyle, herhangi bir askeri müdahalenin beklenmedik olduğu çabucak anlaşıldı. Almanya Fransa ile topyekun bir savaşa hazır değildi.\n\nDurum böyleyken, Renanya, Almanya savaşa girmedikçe antlaşmanın dikte ettiği gibi askerden arındırılmış bir bölge olarak kalacaktır."
 news.152.e:0 "Açıkçası, müdahalemiz gerekli değildi."
 news.153.a:0 "Devler arasındaki güven kırılgan bir şeydir."
 news.153.b:0 "Sadece saldırı için biraz zaman kazanmak amacıyla imzaladık."
 news.153.c:0 "Faşistler için bir antlaşma bir parça kağıttan başka bir şey değildir."
 news.153.d:0 "Almanya ile [SOV.GetNameDef] arasındaki saldırmazlık paktı, başlangıçta şaşırtıcı bir gelişmeydi, ancak şimdi daha az şaşırtıcı bir şekilde dağıldı. Almanya saldırdı, paktı bozdu ve bir kez daha Sovyetler Birliği'ni gelecek vizyonlarının gerçeğe dönüşmesi için yüzleşilmesi gereken bir tehdit olarak açıkça konuşmaya geri döndü.\n\nSovyet liderliği pek memnun değil, ancak ihanet karşısında şaşırmaktan çok, fırsatı ilk kendilerinin değerlendirememesinden dolayı hayal kırıklığına uğramış olabilir."
 news.153.t:0 "Almanya Molotov-Ribbentrop Paktı'nı Bozuyor"
 news.154.b:0 "Komünistlerin onur veya gurur duygusu yoktur!"
 news.154.c:0 "Antlaşma amacına hizmet etti."
 news.154.d:0 "Almanya ile [SOV.GetNameDef] arasındaki saldırmazlık paktı, başlangıçta şaşırtıcı bir gelişmeydi, ancak şimdi daha az şaşırtıcı bir şekilde dağıldı. [SOV.GetNameDef] saldırdı, paktı bozdu ve Alman rejimini ezip yayılmacı devleti bir kez daha yerine oturtmaya yemin etti.\n\nAlman liderler kendileri de bir saldırı planlıyor olabilirlerdi, ancak dünya bunu asla bilemeyecek. Şimdi yeni tehditle başa çıkmak için hızla seferber oluyorlar."
 news.154.t:0 "SSCB Molotov-Ribbentrop Paktı'nı Bozuyor"
 news.155.a:0 "Bu başka bir Büyük Savaş'ın başlangıcı olabilir."
 news.155.b:0 "Alman ulusunun şanı için!"
 news.155.d:0 "Birçoğu Avrupa'da uzun süreli bir barış dilemiş olsa da, son olaylar Almanya'yı bir kez daha savaş yoluna soktu. Versay Antlaşması'nı açıkça ihlal etmesine rağmen, Alman birlikleri seferber oldu ve saldırıya geçmeye hazır. Alman yetkililer, bölgedeki Alman vatandaşlarını koruma ihtiyacını gerekçe göstererek Renanya'yı artık askerden arındırılmış tutmayacaklarını belirtiyorlar."
 news.155.t:0 "Almanya Yeniden Savaşta"
 news.156.a:0 "Son yakın... düşmanlarımız için."
 news.156.a.2.tt:0 "O vazoyu zaten sevmemiştim.\n"
 news.156.a.tt:0 "Bir vazo devrilir.\n"
 news.156.d:0 "Gökyüzünde bir Kuyruklu Yıldız'ın belirmesi halkımız arasında huzursuzluğa neden oldu. Test uçuşlarından birinden çıkan deneysel bir roket uçağı olan Me 163 Komet, bu benzersiz derecede hızlı aracı gören kırsal nüfusu şok etti. Son derece gizli bir şekilde geliştirildi, ancak yakında tanıtılacak. Bu küçük olay, ilk resmi görünümünü daha da etkileyici kılacaktır."
 news.156.t:0 "Kuyruklu Yıldız Görüldü"
 news.157.a:0 "Görünüşe göre [From.From.GetName] ellerini kirletmeye istekli."
 news.157.a_usa:0 "Onlara göstereceğiz."
 news.157.d:0 "Sadece birkaç gün önce [From.GetName]'den birlikler bir savaş ilanıyla [From.From.From.GetName]'ye doğru seferber oldu. Ardından [From.From.GetName] bir ültimatom vererek tarafların çatışmayı durdurmasını ve tüm [From.GetAdjective] birliklerinin geri çekilmesini emretti. [From.GetLeader], savaşlarının haklı olduğunu belirtiyor ve boyun eğmeyi reddetti. Ülke şimdi hem [From.From.From.GetName] hem de [From.From.GetName] ile tam bir çatışma halinde."
 news.157.t:0 "[From.From.GetName], [From.GetAdjective] Savaşına Müdahale Ediyor"
 news.158.a:0 "Görünüşe göre [From.From.GetAdjective] güç oyunu işe yaradı."
 news.158.a_usa:0 "Barışı korumalıyız."
 news.158.d:0 "Birkaç gün önce [From.GetName], [From.From.From.GetName]'ye savaş ilan etti. Kısa bir süre sonra [From.From.GetName] bir ültimatom yayınlayarak, tüm saldırganlığı durdurmaz ve bir barış anlaşması imzalamazlarsa [From.GetName] ile savaşa gireceğini belirtti. [From.GetLeader], savaş nedenlerinin haklı olduğunu belirtiyor, ancak seferberliği durdurmayı ve barışı kabul etmeyi seçti."
 news.158.t:0 "[From.From.GetName], [From.GetAdjective] Savaşına Müdahale Ediyor"
 news.159.a:0 "Bu ebedi barışa mı yoksa başka bir savaşa mı yol açacak?"
 news.159.b:0 "Birlikte asla yenilmeyeceğiz!"
 news.159.c:0 "Mükemmel bir girişim!"
 news.159.d_01:0 "[From.GetLeader] bugün [From.GetName]'nin yeni bir ittifak kurmak için başvurduğunu duyurdu. [From.GetFactionName], savaş durumunda işbirliği yapma niyetlerini kamuoyuna açıkladı.\n\nBüyük koalisyonlar saldırganlığı caydırabilse de, çatışma çıktığında getirdikleri sonuçları gördük. Bu yeni ittifaka katılan farklı tarafların niyetleri hala tartışmalı, ancak sonunda neye hizmet edeceği, kışkırtıcıları tarafından bile bilinmiyor olabilir."
 news.159.d_02:0 "Demokrasilerin birbirleriyle savaşmadığı teorize edilmiştir, ancak bu onların savaşlarda birbirlerine yardım edecekleri anlamına gelmez. Siyasi çıkarlar çeşitli olduğundan ve halk barış istediğinden, bu uluslar için bir savaşa girmek genellikle büyük bir maliyete yol açar.\n\nAncak bu, [From.GetName]'nin bugün halklarını ve ideallerini korumak için güçlerini birleştirmek üzere [From.GetFactionName] adlı bir askeri ittifak kurduklarını duyurmasını engellemedi."
 news.159.d_03:0 "[From.GetName] bile, halkının ve ulusunun gücüne ve üstünlüğüne olan inancıyla ünlü olmasına rağmen, saygı duyduklarıyla ittifaklar kurmaktan geri durmaz. [From.GetLeader] bugün, sözde sadece onurlu ve büyüklüğe kaderlenmiş uluslar için yer olan bir askeri koalisyon olan [From.GetFactionName] hakkında son anlaşmaların yapıldığını duyurdu.\n\nBu büyüklüğün, ilgili ulusların sınırları içinde ideal bir toplum inşa etmekten mi yoksa sınırlarının ötesine genişlemek için birlikte çalışmaktan mı kaynaklanacağı, dünya çok geç olana kadar bilemeyebilir."
 news.159.d_04:0 "Sovyetlerin son zamanlarda tek ülkede komünizme odaklanmasına rağmen, hareketin enternasyonalist kökleri sınırları aşıyor. Dünyanın dört bir yanındaki işçilerle bu dayanışma, [From.GetLeader]'in bugün [From.GetFactionName]'ni duyurduğu konuşmasında kilit bir unsurdu.\n\nSiyasi bir Enternasyonal'in ötesine geçen bu, ülkeleri askeri olarak bağlayan bir ittifaktır ve her iki rejim de dış tehditlere karşı birbirlerine yardım etme sözü vermektedir. Komünist devrim için bir kılıç mı yoksa bir kalkan mı olacağı henüz belli değil."
 news.159.t:0 "[From.GetFactionName]'nin Doğuşu"
 news.159.tt:0 "[This.GetName], [From.GetName] ile [From.GetFactionName]'nin bir parçasıdır.\n"
 news.16.d:0 "Alman arabuluculuğunun ardından, Viyana'da imzalanan bir antlaşma ile tüm Transilvanya Macar yönetimine iade edilecek. \n\nToprak daha önce I. Dünya Savaşı'nın sonunda [ROM.GetNameDef]'e verilmiş ve bu da acı bir anlaşmazlığa yol açmıştı. \n\nAvrupa'da yeni bir düzen kurulmuş gibi görünürken, bunlar ayarlanacak birçok sınırdan ilki mi?"
 news.160.a:0 "Bu, Avrupa için iyiye işaret değil."
 news.160.b:0 "Alman halkı galip gelecektir."
 news.160.d:0 "Birçoğu Avrupa'da uzun süreli bir barış dilemiş olsa da, son olaylar Almanya'yı bir kez daha savaş yoluna soktu. Versay Antlaşması'nı açıkça ihlal etmesine rağmen, Alman birlikleri seferber oldu ve saldırıya geçmeye hazır. Alman yetkililer, bölgedeki Alman vatandaşlarını koruma ihtiyacını gerekçe göstererek Renanya'yı artık askerden arındırılmış tutmayacaklarını belirtiyorlar."
 news.160.t:0 "Almanya Yeniden Savaşta"
 news.161.a:0 "Radikal bir karar."
 news.161.b:0 "Burjuvaziyi iktidarda tutmak için ellerinden geleni yapıyorlar."
 news.161.c:0 "Belki de gerekliydi."
 news.161.d:0 "[From.GetLeader] Kabinesi, [From.GetCommunistParty]'nin feshini kararlaştırdı. Sovyet Rusya'nın Nazi Almanyası ile saldırmazlık paktı imzalamasından bu yana Fransa'da komünizmin yasaklanması konuşuluyordu. Kararname, iki ulusun Polonya'nın paylaşımı konusundaki anlaşmasının ardından yürürlüğe girdi.\n[From.GetLeader], yasağa yönelik desteğin artması ve hatta solcu gazetelerin bile [From.GetCommunistParty]'nin kaldırılmasını savunmaya başlamasıyla bu fırsatı değerlendirdi."
 news.161.e:0 "Tek yol buydu."
 news.161.t:0 "Fransa Komünizmi Yasaklıyor"
 news.162.a:0 "İspanyollar için iyi oldu."
 news.162.b:0 "Bir gün tüm İspanya'yı geri alacağız."
 news.162.d:0 "İspanya'yı ikiye bölen nihai bir barış antlaşmasının her iki tarafça da kabul edilmesiyle İspanya İç Savaşı sona erdi. Her iki taraftaki muhalifler bu uzlaşmayı kınasa da, bu kırılgan barış en azından bölünmüş ulusa her iki tarafta da toparlanma ve yeniden inşa için zaman tanıyacaktır."
 news.163.a:0 "Bu iyi sonuçlanacak."
 news.163.b:0 "Adalet."
 news.163.c:0 "Üzücü."
 news.163.d:0 "Avusturya'nın [GER.GetName] tarafından ilhak edilmesini iddialarına dayanak olarak kullanan Almanya, şimdi de [YUG.GetName]'den eski Avusturya toprağı olan Slovenya'nın 'haklı iadesini' talep etti. \n\nBuna karşılık, Versay Antlaşması'nın imzacısı devletler 'Slovenya Sorunu'na bir çözüm tartışmak üzere Londra'da toplandı. Bu büyük barış konferansı, kalıcı bir barış adına Yugoslavya'nın Slovenya'yı Almanya'ya bırakması kararıyla sonuçlandı.\n\nAvrupa'nın büyük güçleri tarafından terk edildiğini düşünen [YUG.GetLeader]'in hükümeti, sunulan anlaşmayı imzalamaktan başka seçenek görmüyor."
 news.163.e:0 "İhanete uğradık."
 news.163.t:0 "Londra Konferansı"
 news.164.a:0 "Sanırım bu savaş anlamına geliyor."
 news.164.b:0 "Gazabımızla yüzleşecekler."
 news.164.c:0 "Adaletin yanında olacağız."
 news.164.d:0 "Avusturya'nın [GER.GetName] tarafından ilhak edilmesini iddialarına dayanak olarak kullanan Almanya, şimdi de [YUG.GetName]'den eski Avusturya toprağı olan Slovenya'nın 'haklı iadesini' talep etti. \n\nBuna karşılık, Versay Antlaşması'nın imzacısı devletler 'Slovenya Sorunu'na bir çözüm tartışmak üzere Londra'da toplandı.\n\nKonferansta İngiltere ve Fransa, Alman talepleri karşısında birleşerek Yugoslavya'nın Versay tarafından belirlenen sınırları koruması gerektiğini ilan etti."
 news.164.d_FRA_abandoned_yugoslavia:0 "Avusturya'nın [GER.GetName] tarafından ilhak edilmesini iddialarına dayanak olarak kullanan Almanya, şimdi de [YUG.GetName]'den eski Avusturya toprağı olan Slovenya'nın 'haklı iadesini' talep etti. \n\nBuna karşılık, Versay Antlaşması'nın imzacısı devletler 'Slovenya Sorunu'na bir çözüm tartışmak üzere Londra'da toplandı.\n\nİngiltere Versay'ın bütünlüğünün korunması gerektiğinde ısrar ederken, Fransa Avrupa'da barış adına Alman taleplerini destekledi."
 news.164.e:0 "Savaşan ilk biz olacağız!"
 news.164.f:0 "İngilizler aptaldır."
 news.164.t:0 "Slovenya'da Kriz"
 news.165.a:0 "Bu vahim görünüyor."
 news.165.b:0 "Geri adım atmayacağız."
 news.165.c:0 "Bu talihsiz bir durum."
 news.165.d:0 "Avusturya'nın [GER.GetName] tarafından ilhak edilmesini iddialarına dayanak olarak kullanan Almanya, şimdi de [YUG.GetName]'den eski Avusturya toprağı olan Slovenya'nın 'haklı iadesini' talep etti. \n\nBuna karşılık, Versay Antlaşması'nın imzacısı devletler 'Slovenya Sorunu'na bir çözüm tartışmak üzere Londra'da toplandı.\n\nGünlerce süren müzakerelere rağmen konferans bir anlaşmaya varamadı. İngiliz hükümeti barışçıl bir çözüm ararken, Fransızlar Alman tehditleri karşısında kararlı kaldı. Alman heyeti protesto amacıyla salonu terk etti ve savaş bulutları Slovenya üzerinde toplanıyor."
 news.165.e:0 "Birlikte zafer kazanacağız."
 news.165.f:0 "Doğru olanı yapacağız!"
 news.165.t:0 "Slovenya'da Kriz"
 news.166.a:0 "Işıklar Sönüyor."
 news.166.b:0 "Onları ezeceğiz."
 news.166.c:0 "Yalnız kaldık."
 news.166.d:0 "Avusturya'nın [GER.GetName] tarafından ilhak edilmesini iddialarına dayanak olarak kullanan Almanya, şimdi de [YUG.GetName]'den eski Avusturya toprağı olan Slovenya'nın 'haklı iadesini' talep etti. \n\nBuna karşılık, Versay Antlaşması'nın imzacısı devletler 'Slovenya Sorunu'na bir çözüm tartışmak üzere Londra'da toplandı.\n\nBüyük Güçler, barışı korumak için son bir çabayla Slovenya'nın Almanya'ya devredilmesi gerektiği konusunda anlaştılar. \nAncak, Avrupa istikrarına yönelik Alman tehdidine karşı yaptığı etkileyici bir konuşmada [YUG.GetLeader], ihtiyaç duydukları anda tamamen terk edilmiş olmalarına bakılmaksızın [YUG.GetName]'nin bir karış topraktan bile vazgeçmeyi reddedeceğini kesin bir dille ilan etti."
 news.166.t:0 "Londra Anlaşması"
 news.167.a:0 "Bu duruma göz kulak olacağız."
 news.167.b:0 "İkisini de ezeceğiz."
 news.167.c:0 "En azından dostsuz değiliz."
 news.167.d:0 "Avusturya'nın [GER.GetName] tarafından ilhak edilmesini iddialarına dayanak olarak kullanan Almanya, şimdi de [YUG.GetName]'den eski Avusturya toprağı olan Slovenya'nın 'haklı iadesini' talep etti. \n\nBuna karşılık, Versay Antlaşması'nın imzacısı devletler 'Slovenya Sorunu'na bir çözüm tartışmak üzere Londra'da toplandı.\n\nKonferans, İtalya'nın Yugoslav toprak bütünlüğünü desteklemesiyle şaşırtıcı bir sadakat dönüşüyle belirlendi ve Alman talepleri kabul görmedi. \n\nHer zamanki gibi, İtalyan dış politikası tamamen öngörülemez ve bu kumarın onları nereye götüreceğini zaman gösterecek."
 news.167.e:0 "İtalya Dünyaya Gösterecek!"
 news.167.t:0 "Slovenya'da Kriz"
 news.168.a:0 "Yeni Düzen böyle kurulur."
 news.168.b:0 "Bugün bir rüya öldü."
 news.168.c:0 "Bu iyi olamaz."
 news.168.d:0 "Slovenya'nın kaybıyla Yugoslavya içindeki etnik fay hatları daha net görünmeye başladı ve merkezi otorite her geçen gün zayıfladı. \n\nBugün, Alman dışişleri bakanı 'Versay Devleti hatasını' nihayet çözme planını duyurdu. [YUG.GetName]'nin en güçlü komşularından bazıları tarafından imzalanan bir antlaşmayla, topraklarının çoğu Almanya'ya dost ülkelere bölündü.\n\nBu antlaşma, onaylanmadan önce [YUG.GetAdjective] diplomatları tarafından bile görülmedi, ancak birden fazla ülkenin çökmekte olan bir merkezi hükümetten Yugoslav topraklarını ele geçirmek için çabalamasıyla, [YUG.GetLeader]'in hükümetinin yapabileceği çok az şey var."
 news.168.e:0 "Mükemmel Haberler."
 news.168.f:0 "Bizim için kötü bir sonuç."
 news.168.g:0 "Minnettarız."
 news.168.h:0 "Talihsizlik."
 news.168.i:0 "İtalya'nın gücü gerçek anlamda tanınıyor."
 news.168.j:0 "Almanya kendine dikkat etse iyi olur."
 news.168.t:0 "Birinci Ljubljana Diktası"
 news.169.a:0 "Almanya Avrupa'ya gücünü gösteriyor."
 news.169.b:0 "Doğru tarafı seçtik."
 news.169.c:0 "Bu uğursuz bir durum."
 news.169.d_annex_YUG:0 "Son toprak kayıpları Yugoslav devleti içinde etnik çatışmalara yol açan ve merkezi otoriteyi zayıflatan kırılmalara neden oldu. Almanya büyüyen boşluğa adım attı ve Yugoslavya'nın geri kalanında bir 'himaye' ilan etmeyi seçti."
 news.169.d_puppet_CRO_YUG:0 "Son toprak kayıpları Yugoslav devleti içinde etnik çatışmalara yol açan ve merkezi otoriteyi zayıflatan kırılmalara neden oldu. Almanya, geri kalanını kendi yönetimi altında bir Sırp ve bir Hırvat devleti arasında bölmeyi seçti."
 news.169.d_puppet_CRO_annex_YUG:0 "Son toprak kayıpları Yugoslav devleti içinde etnik çatışmalara yol açan ve merkezi otoriteyi zayıflatan kırılmalara neden oldu. Almanya 'bağımsız' bir Hırvatistan devleti kurdu ve geri kalanını ilhak etti."
 news.169.e:0 "Barış tehdit altında."
 news.169.t:0 "Yugoslavya'nın Kaderi"
 news.17.a:0 "İlginç..."
 news.17.b:0 "Rumenler bizi utandırdı..."
 news.17.c:0 "Transilvanya bizimdir!"
 news.17.d:0 "[HUN.GetNameDef] ve [ROM.GetNameDef] arasındaki bir toprak anlaşmazlığıyla ilgili Viyana'daki müzakereler çöktü. \n\n[GER.GetNameDef] arabulucu olarak hareket etti, ancak Kuzey Transilvanya'yı [HUN.GetNameDef]'e iade etmeye karar verdiklerinde, [ROM.GetNameDef] kararı reddetti. Rumen hükümeti derhal heyetlerini Bükreş'e geri dönme emri verdi. \n\nGörünüşe göre [GER.GetNameDef] henüz hayal ettikleri diplomatik etkiye sahip değil."
 news.17.e:0 "Bu iş burada bitmedi."
 news.17.t:0 "Romanya Alman Arabuluculuğunu Reddediyor"
 news.170.a:0 "Barışı korumak için her şey."
 news.170.b:0 "Yükseliyoruz."
 news.170.c:0 "Bu iyi görünmüyor."
 news.170.d_BUL:0 "Balkanlar'da barışı sağlamaya çalıştıklarını iddia ederek, Almanya Yunan hükümetine Bulgaristan'a toprak devretmesi talebinde bulundu. [GRE.GetName] şiddetle protesto etse de, Almanya'nın Balkanlar'daki güçlü etkisi onlara pek seçenek bırakmıyor. [GER.GetName] ile bir çatışmadan kaçınmanın tek yolu, Alman diplomasisinin toprak bütünlüklerini dikte etmesine izin vermektir."
 news.170.d_GER:0 "Balkanlar'da bir güç olarak kendini kabul ettirdikten sonra, [GER.GetName] şimdi sorunlu bölgede barışı koruma motivasyonuyla hareket ettiğini iddia ediyor. Bu amaçla, şimdi de Yunan topraklarının kendi otoritesine devredilmesini talep etti.\n\nAlman savaş makinesiyle karşı karşıya kalan [GRE.GetName], talepleri bir sahtekarlık olarak lanetlese de kabul etmekten başka çaresi kalmadı."
 news.170.d_ITA:0 "Balkanlar'da barışı sağlamaya çalıştıklarını iddia ederek, Almanya Yunan hükümetine [ITA.GetName]'nin hak iddia ettiği herhangi bir toprağı devretmesi talebinde bulundu. [GRE.GetName] şiddetle protesto etse de, Almanya'nın Balkanlar'daki güçlü etkisi onlara pek seçenek bırakmıyor. Hem [GER.GetName] hem de [ITA.GetName] ile bir çatışmadan kaçınmanın tek yolu, Alman diplomasisinin toprak bütünlüklerini dikte etmesine izin vermektir."
 news.170.d_ITA_BUL:0 "Balkanlar'da barışı sağlamaya çalıştıklarını iddia ederek, Almanya Yunan hükümetine [BUL.GetName] ve [ITA.GetName]'nin hak iddia ettiği herhangi bir toprağı devretmesi talebinde bulundu. Balkanlar'daki güçlü [GER.GetAdjective] varlığı ve hem Bulgaristan hem de İtalya'nın tehditkar yaklaşımıyla, [GRE.GetLeader] kabul etmekten başka seçenek görmedi."
 news.170.e:0 "Merkez dayanabilecek mi?"
 news.170.f:0 "Bu bir utançtı."
 news.170.t:0 "İkinci Ljubljana Diktası"
 news.171.a:0 "Aptallar."
 news.171.b:0 "Buna nasıl cüret ederler!?"
 news.171.c:0 "Yunanistan'a yardım edip edemeyeceğimizi görmeliyiz."
 news.171.d_BUL:0 "Yunanistan, Bulgaristan ile olan sınır anlaşmazlıklarında Alman arabuluculuğunu reddederek, Alman teklifinin teslimiyetle eşdeğer olduğunu iddia etti. \n\nBasına konuşan [GRE.GetLeader], eğer [BUL.GetLeader] ve [GER.GetLeader] bu toprakları istiyorsa, 'gelip alabileceklerini' söyledi. \n\n[BUL.GetAdjective] hükümeti, Yunan topraklarını elde etme karşılığında [GER.GetNameDef]'e askeri ve ekonomik destek sundukları yönündeki iddiaları reddetti."
 news.171.d_GER:0 "[GRE.GetNameDef] ve [GER.GetNameDef] arasındaki bir dizi sınır anlaşmazlığını çözme görüşmeleri çöktü. Almanların bazı bölgeleri Alman askeri üsleri için kiralama önerisinin fiilen ülkenin büyük bir bölümünü teslim etmek anlamına geleceğini iddia eden [GRE.GetLeader], tüm eli silah tutan Yunanları ülkenin savunmasına çağırdı."
 news.171.d_ITA:0 "[GER.GetLeader] ve [ITA.GetLeader] arasındaki bir görüşmenin ardından, [GER.GetAdjective] hükümeti [GRE.GetNameDef] ile devam eden sınır anlaşmazlığında [ITA.GetAdjective] pozisyonunu kamuoyu önünde destekledi. \n\nYunan Lideri [GRE.GetLeader] sunulan çözümü kesinlikle kabul edilemez olarak ilan etti ve ülkeyi 'son kurşuna, son mermiye, son nefese kadar' savunmaya yemin etti."
 news.171.d_ITA_BUL:0 "Bir yanda Yunanistan ile diğer yanda İtalya ve Bulgaristan arasındaki sınır anlaşmazlığında Alman arabuluculuk teklifleri Yunanistan tarafından reddedildi. Bir [GRE.GetAdjective] hükümet sözcüsü, [GRE.GetAdjective] ordusunun ülkeyi herhangi bir işgalciye karşı savunmaya hazır olduğunu ve Almanya'nın eteklerine yapışan çakallara ve akbabalara teslim olmaktansa savaşarak ölmeyi tercih edeceğini duyurdu."
 news.171.e:0 "Bu savaş anlamına gelecek."
 news.171.f:0 "Perslerin başarısız olduğu gibi onlar da başarısız olacaklar."
 news.171.t:0 "İkinci Ljubljana Diktası"
 news.172.a:0 "Akıllıca davrandılar."
 news.172.b:0 "Bir Zafer Daha."
 news.172.c:0 "Bu endişe verici."
 news.172.d:0 "Alman büyükelçisiyle uzun ve hararetli bir görüşmenin ardından [GRE.GetLeader], [GRE.GetAdjective] hükümetinin gelecekte politikalarını [GER.GetNameDef] ile yakından koordine edeceğini duyurdu. \n\n[GRE.GetAdjective] başkentindeki polis, bu karara karşı çıkan birkaç kendiliğinden protestoyu dağıtmak için güç kullanmak zorunda kaldı; kalabalıktaki birçok kişi 'o korkak [GRE.GetLeader]'in kellesini istiyordu."
 news.172.e:0 "Yapabileceğimiz bir şey yok."
 news.172.f:0 "Bu bir Yunan trajedisi."
 news.172.t:0 "Yunanistan Boyun Eğiyor"
 news.173.a:0 "Kaç tane Enternasyonal olacak?"
 news.173.b:0 "Birliğimiz için şiddetli bir dönem."
 news.173.d_1:0 "Dünyanın dört bir yanından bir dizi komünist delege bugün Paris'te bir kuruluş konferansı için bir araya geldi. Troçki'nin teorilerinin destekçilerinin öncülüğünde Dördüncü Enternasyonal'in temelleri atıldı.\n\nBu örgütlenme çabalarının uluslararası siyaset sahnesinde ne gibi bir etki yaratacağı henüz belirsiz olsa da, haberler Stalin'in şüphelerini kabartmış görünüyor. Partinin ve ordunun birçok üst düzey üyesinin gizlice Troçki'yi desteklediğinden şüpheleniyordu ve birçoğu hala hayatta. Paranoyası tam güçle geri dönünce giderek daha içine kapandı. Güvensizliği ve istikrarsızlığı Sovyet hükümetinde bir krize neden oldu. Bu gidişle ulus iç savaşa sürüklenecek."
 news.173.d_2:0 "Dünyanın dört bir yanından bir dizi komünist delege bugün Paris'te bir kuruluş konferansı için bir araya gelerek Dördüncü Enternasyonal olarak bilinen oluşumun temellerini attı. Troçki'nin teorilerinin destekçilerinin öncülüğünde kurulması için yıllardır çağrılar yapılıyordu.\n\nStalin, yurtdışında Troçkizme artan desteğe, ek suikastlar emrederek ve eski rakibine karşı propagandayı artırarak yanıt verdi. Sovyet ordusu ve liderliğinin üst kademelerindeki şüpheli Troçkistlerin geçmişteki tasfiyeleri yakın hafızalardayken, bunun herhangi bir direnişle karşılaşması pek olası değil."
 news.173.t:0 "Dördüncü Enternasyonal"
 news.174.a:0 "Bu gelişmeyi takip etmeliyiz."
 news.174.b:0 "Umarım araştırmaları meyve verir."
 news.174.c:0 "Bundan hiçbir şey çıkmaz."
 news.174.d:0 "İlk testlerin ardından, [From.GetName] politikacıları, [From.GetAdjective] araştırmalarını nükleer teknoloji geliştirmeye yönlendirmeye karar verdi. \n\nTeknoloji hala oldukça deneysel ve herhangi bir pratik uygulaması olup olmadığı konusunda büyük bir belirsizlik var. Bunun savaş çabalarını nereye götüreceğini kim bilebilir."
 news.174.e:0 "Araştırmamızı gizlice yürüteceğiz."
 news.174.t:0 "[From.GetName] Nükleer Teknoloji Peşinde"
 news.175.a:0 "Birlikte duruyoruz."
 news.175.b:0 "En kötüsüne hazırlanıyorlar."
 news.175.c:0 "Köşeye sıkışmış fareler gibi bir araya geliyorlar."
 news.175.d:0 "Büyük Savaş sırasında kurulan bağlara atıfta bulunan Fransa, Avrupa'nın istikrarına yönelik belirsiz tehditleri gerekçe göstererek İngiltere ile resmi bir ittifak talep etti.\n\nBugün talepleri İngiliz Parlamentosu tarafından onaylandı ve Fransa [ENG.GetFactionName]'ne katıldı."
 news.175.e:0 "İngiltere de kervana katıldı."
 news.175.t:0 "Fransa ve İngiltere İttifak Duyurdu"
 news.176.a:0 "Daha nazikçe sormalıydılar."
 news.176.b:0 "Eski düşmanlarımız bölünmüş durumda."
 news.176.c:0 "Eski müttefikler için karanlık bir gün."
 news.176.d:0 "Şaşırtıcı bir gelişmeyle, İngiliz Parlamentosu bugün [FRA.GetName]'nin iki ulus arasında resmi bir ittifak talebini reddetti. Gerekçe olarak Avrupa kıtasındaki zaten kırılgan olan dengeyi daha fazla sarsmamak gösterildi.\n\nFransız hükümeti bunu, Fransız güvenliğini İngiliz çıkarlarına feda eden siyasi bir hamle olarak kınadı."
 news.176.t:0 "İngiltere Fransa ile İttifakı Reddediyor"
 news.177.a:0 "O zaman sonra gelip bize ağlamayın!"
 news.177.b:0 "Yaşasın Fransa ve Antant!"
 news.177.c:0 "Fransa'nın Avrupa'da bir daha asla hegemonya kurmasına izin vermemeliyiz."
 news.177.d:0 "Ortak düşmanlara karşı birleşik bir cephe oluşturmaya çalışan [From.GetName], ortak düşmanlara karşı birleşmek için bir \"Küçük İtilaf\" oluşturma teklifiyle Çekoslovakya'ya ulaştı ve böylece Britanya ile Büyük Savaş'tan kalma bağlarından vazgeçti. Savunma paktında yer alması teklif edilen Britanya Başbakanı, Britanya'nın bu ittifakı 'Avrupa'nın özgürlüğünün korunmasına yararlı' olarak görmediğini açıkça ifade etti. \n\nFransa yine de kendisini tehdit altında hissedebilecek diğer ülkelerle diplomatik bağlar kurdu ve Avrupa'da diplomatik dengeyi korumak ve gelecekteki çatışmaları önlemek adına birliği teşvik ediyor. Başarılı olup olmayacaklarını yalnızca zaman gösterecek."
 news.177.e:0 "Avrupa Faşist saldırganlara karşı birleşmeli!"
 news.177.f:0 "Yükselen Avrupa gerginliklerinin bir işareti."
 news.177.t:0 "Küçük Antant"
 news.178.a:0 "Fransa geleceğe doğru bizi takip ediyor!"
 news.178.b:0 "Fransız zayıflığının kesin bir işareti."
 news.178.c:0 "Üçüncü Cumhuriyet için trajik bir gelişme."
 news.178.d:0 "Yaklaşık yirmi yıllık siyasi kargaşanın ardından, [From.GetName] halkı Büyük Savaş'ta kaybedilenleri henüz geri kazanamadıklarını hissediyor. [From.GetAdjective] halkı, [From.GetAdjective] devletini halkıyla ve halkı için yeniden inşa etmeyi hedefliyor.\n\nBu yeni siyasi reformlar, işçi sendikalarının ve komünist örgütlerin gelişmesini sağlıyor. Fransa bu yolda devam ederse, aşırı sola doğru bir siyasi yeniden hizalanmaya, hatta tam ölçekli bir devrime doğru gidiyor."
 news.178.e:0 "Endişe verici bir gelişme."
 news.178.t:0 "Fransa'da Sol Yükselişte"
 news.179.a:0 "Fransız hükümeti kendi halkının düşmanıdır!"
 news.179.b:0 "Bu, Fransa'yı bir kez daha büyük bir ulus yapabilir."
 news.179.c:0 "Üçüncü Cumhuriyet için trajik bir gelişme."
 news.179.d:0 "Yaklaşık yirmi yıllık siyasi kargaşanın ardından, [From.GetName] halkı Büyük Savaş'ta kaybedilenleri henüz geri kazanamadıklarını hissediyor. [From.GetAdjective] müesses nizamı, [From.GetAdjective] devletini yeniden inşa etmeyi ve [From.GetAdjective] büyüklüğünü yeniden tesis etmeyi hedefliyor.\n\nBu siyasi reformlar, devletin ve ordunun gücünü artırıyor ve [From.GetAdjective] halkı [From.GetLeader]'in büyüklük vaatleriyle ikna olmuş durumda."
 news.179.e:0 "Endişe verici bir gelişme."
 news.179.t:0 "Fransa'da Sağ Yükselişte"
 news.18.d:0 "[HUN.GetNameDef] ve [ROM.GetNameDef] arasındaki bir toprak anlaşmazlığıyla ilgili Viyana'daki müzakereler çöktü. \n\n[GER.GetNameDef] arabulucu olarak hareket etti, ancak Kuzey Transilvanya'yı [HUN.GetNameDef]'e iade etmeye karar verdiklerinde, [ROM.GetNameDef] kararı reddetti. Rumen hükümeti derhal heyetlerini Bükreş'e geri dönme emri verdi. \n\nGörünüşe göre [GER.GetNameDef] henüz hayal ettikleri diplomatik etkiye sahip değil."
 news.180.a:0 "Dünya Devrimine doğru birleştik!"
 news.180.b:0 "İttifakları yakında çökecek."
 news.180.c:0 "Demokrasi düşmanlarının güçlenmesine izin verilmemeli."
 news.180.d:0 "Yalnızca Fransız halkı arasında değil, aynı zamanda Fransız iktidar salonlarında da komünizme doğru geçişin ardından, [France.GetName], [From.GetFactionName]'nin bir parçası olma arzusunu kamuoyuna duyurdu.\n\n[From.GetName], kamuoyunun görüşü dışında haftalarca süren müzakerelere işaret ederek anında yanıt verdi. [From.GetLeader], tüm ülkelerde devrimi gerçekleştirmek için dünya insanlarının nasıl birlikte çalışması gerektiğini uzun uzun anlattı. \n\n[France.GetLeader] bunu kabul etti ve \"[From.GetFactionName]'den korkmak için nedenleri olan\" kişileri kesin ifadelerle tehdit etti."
 news.180.e:0 "Fransa tarafını seçti."
 news.180.t:0 "Fransa Komintern'e Kabul Edildi"
 news.181.a:0 "Birlikte güçlüyüz!"
 news.181.b:0 "Demokrasi düşmanları güçleniyor."
 news.181.c:0 "Beklenmedik bir dostluk."
 news.181.d:0 "Giderek otokratik politikaların ardından [France.GetName], küresel komünizm tehdidine karşı müttefikler bulma zamanının geldiğini duyurdu. Artık [From.GetName] bu müttefik gibi görünüyor.\n\nBu sabah [From.GetLeader], [France.GetName] ve [From.GetName]'nin kardeş olarak bir arada duracağını duyurdu. \"Ortak mirasımız artık bizi düşman değil müttefik yapacak! Avrupa'nın Titanları birlikte duruyor.\""
 news.181.t:0 "[France.GetName] ve [From.GetName] Birleşiyor"
 news.182.a:0 "[From.GetFactionName]'ni hiçbir şey tehdit edemez!"
 news.182.b:0 "Yeni [From.GetName] Avrupa üzerinde beliriyor."
 news.182.c:0 "Avrupa diplomasisi Paris-Berlin Ekseni boyunca yeniden hizalanıyor."
 news.182.d:0 "Avrupa siyaseti bugün, Fransız ve Alman diplomatların [France.GetName] ile [From.GetName] arasında bir askeri pakt duyurmasıyla altüst oldu. Sınırlarında çok fazla kan döküldüğünü, oysa dışarıda onların yıkımını isteyen başka güçler olduğunu duyurdular.\n\n[From.GetName], eski düşmanların birbirlerine karşı zayıflamak yerine birlikte daha da güçlenecek olmasının ne anlama geldiğini herkesin düşünmesini teşvik etti."
 news.182.e:0 "Hay aksi."
 news.182.t:0 "[France.GetName], [From.GetFactionName]'ne Katılıyor!"
 news.183.a:0 "Buna nasıl cüret ederler!"
 news.183.b:0 "Onlarla düşman olarak da yaşayabiliriz."
 news.183.c:0 "Birbirleriyle savaşmakla meşgul oldukları sürece..."
 news.183.d:0 "[France.GetAdjective]'nin diplomatik ilerlemelerini reddeden [From.GetLeader], [From.GetName]'nin [France.GetName] ile askeri bir anlaşma yapmayacağını kamuoyuna duyurdu.\n\n[France.GetAdjective] devletini zayıf ve yozlaşmış olarak nitelendirerek, [From.GetAdjective] diplomatları, hiçbir gerçek [From.GetAdjective]'nin \"[France.GetAdjective] Hastalığının\" yayılmasına izin vermeyeceğini söyledi."
 news.183.t:0 "[From.GetName] Fransız İttifakını Reddediyor!"
 news.184.a:0 "Uluslarımızın birçok ortak çıkarı var."
 news.184.b:0 "Duruma göz kulak olacağız."
 news.184.d:0 "İtalya ve Almanya, özellikle Avusturya ve Balkanlar'da pek çok çatışan çıkarlarını dile getirdiler. Ancak bu, ülkelerin dış politikalarının birbirlerine karşı giderek daha dostane bir şekilde gelişmesini engellemedi ve \"ortak çıkarları koruyacak\" bir anlaşma için müzakereler sürüyor.\n\nMüzakereler başarılı olursa, Orta ve Doğu Avrupa'da büyük etki yaratabilecek bir ittifak görebiliriz."
 news.184.t:0 "İtalya Almanya ile Daha Yakın Bağlar Kuruyor"
 news.185.a:0 "[From.GetName] yol gösteriyor!"
 news.185.b:0 "Umarım çıkarları bizimkilerle çatışmaz."
 news.185.c:0 "Bu endişe nedeni olabilir."
 news.185.d:0 "Akdeniz'deki güç dengesini yeniden tanımlamayı amaçlayan [From.GetName], bölgede yeni bir ittifak oluşturulmasına yönelik siyasi girişimlerde bulunuyor.\n\nBüyük ölçüde askeri nitelikte olan [From.GetFactionName], [From.GetLeader]'in sözleriyle, İtalya'yı yeni bir dünya gücünün merkezine yerleştirecektir."
 news.185.t:0 "[From.GetName] Kapsamlı Askeri Pakt Arıyor"
 news.186.a:0 "İtalya Ege'nin kontrolünde olmalı."
 news.186.b:0 "Küstahça iddialar!"
 news.186.d:0 "Roma İmparatorluğu'nu modern [From.GetAdjective] devletinin öncüsü olarak gösteren [From.GetName], bağımsız bir Yunan devletinin var olma hakkının olmadığını iddia etti. Bunun yerine, \"Yunan Toprakları\" Ege'deki İtalyan üstünlüğünü kabul etmeli ya da zorla ele geçirmeli. \n\n[Greece.GetName] iddiaları gülünç olarak kınadı. Ancak [From.GetName], [From.GetFactionName]'nin desteğine sahiptir."
 news.186.t:0 "İtalya Yunan Toprakları Üzerinde Hak İddia Ediyor"
 news.187.a:0 "Elbette [Greece.GetName] çıkarlarımızı paylaşıyor."
 news.187.b:0 "Bu sürpriz değil."
 news.187.c:0 "Çok fazla ortak tarihimiz var."
 news.187.d:0 "[GRE.GetName]'yi ilk antik Avrupa devletlerinin halefi olarak gösteren [ITA.GetName], iki devletleri arasında doğal bir dostluk olduğunu iddia ediyor.\nSiyasi gündemleri açık, zira [ITA.GetName] aynı zamanda [GRE.GetName]'yi [ITA.GetFactionName]'nin doğal bir üyesi olarak görüyor.\n\nBin buçuk yıllık bir ayrılığın ardından, doğu ve batının bir kez daha birleşip birleşemeyeceğini zaman gösterecek."
 news.187.t:0 "İtalya [GRE.GetName]'den Destek Arıyor"
 news.188.a:0 "[ITA.GetName]'nin etkisi artıyor."
 news.188.b:0 "[ITA.GetAdjective]lerle nasıl işbirliği yapılabilir ki?"
 news.188.c:0 "Akdeniz'de bir ortaklık önemlidir."
 news.188.d:0 "Akdeniz'de hakimiyet kurmak için onlarca yıldır süren çatışmalara ve diplomatik manevralara rağmen, [ITA.GetName] ve [TUR.GetName], anlaşmazlıklarını arkalarında bırakmaya başlıyor.\n\n\"Tüm Akdeniz Küresinin yararına\" işbirliği yapma anlaşmasında, [ITA.GetName] ve [TUR.GetName], daha yakınlaşma sözü veriyor iki ulusun modern kuruluşundan bu yana sahip oldukları diplomatik bağlar."
 news.188.t:0 "[ITA.GetName], [TUR.GetName] ile Uzlaşma Arıyor"
 news.189.a:0 "Bu mesele çözülmüştü!"
 news.189.b:0 "Vaat edileni alacağız!"
 news.189.c:0 "Türk-İtalyan rekabeti yoğunlaşıyor."
 news.189.d:0 "1915 Londra Antlaşması, İtalya'ya Anadolu'daki Türk topraklarını vaat ediyordu. Diğer anlaşmalar öncelikli olacaktır, ancak sözler [From.GetAdjective] liderliği tarafından unutulmadı. \n\n[From.GetLeader], Anadolu kıyılarının stratejik önemi nedeniyle [From.GetName]'nin tamamen \"haklı olarak İtalya'ya ait olanı\" almayı planladığını kamuoyuna açıkladı."
 news.189.t:0 "İtalya Anadolu Deniz Üslerini Talep Ediyor"
 news.19.a:0 "Bir sürü harita daha eskidi."
 news.19.b:0 "Her yerdeki Almanlar birleşmeli."
 news.19.c:0 "Keşke direnecek gücümüz olsaydı..."
 news.19.d:0 "Sınırlarına saldırmaya hazır Alman kuvvetleriyle karşı karşıya kalan [FROM.GetNameDef], eski Prusya toprağı Memel'in teslimini talep eden bir [GER.GetAdjective] ültimatomuna boyun eğdi.\n\nVersay Antlaşması ile [FROM.GetNameDef]'e verilmişti, ancak şimdi Ostpreussen bölgesine yeniden entegre edildi. \n\nAcaba Almanya'nın Avrupa'daki toprak hırslarının sonuna ulaştık mı? Uzmanlar şüpheli..."
 news.19.e:0 "Üstlerine boyun eğmekle doğru olanı yapıyorlar!"
 news.19.t:0 "[GER.GetNameDefCap] Memel'i Talep Ediyor"
 news.190.a:0 "Bu, tam Akdeniz hakimiyetine doğru önemli bir adımdır."
 news.190.b:0 "İtalya Akdeniz'deki hakimiyetini güçlendiriyor."
 news.190.c:0 "Uluslarımız arasındaki \"sevgili dostluğun\" sembolü."
 news.190.d:0 "İspanya İç Savaşı'nda [Italy.GetAdjective] kuvvetlerine dayanmanın ardından, [Italy.GetName], [From.GetName]'den Balear Adalarını talep etti. [From.GetLeader], iki ulus arasındaki bağların güçlendirilmesi olarak diplomatik hamleyi vurgulayarak bu talebi kabul etti.\n\n[Italy.GetName] için Balear Adaları'ndaki deniz üsleri, Cebelitarık Boğazı üzerinde daha fazla etki kullanmalarını sağlayacak ve onlara Atlantik'e daha iyi erişim imkanı verecektir."
 news.190.t:0 "Balear Adaları [Italy.GetName]'ne Devredildi"
 news.192.a:0 "Bunlar İtalyan değil, Yugoslav toprakları!"
 news.192.b:0 "Bölgedeki zaten kırılgan olan dengeyi bozuyorlar."
 news.192.c:0 "O topraklar Yugoslav'dan çok İtalyan gibi görünüyor."
 news.192.d:0 "Dalmaçya kıyılarındaki İtalyan nüfusuna hitap eden [From.GetLeader], [From.GetName]'nin [YUG.GetName]'deki İtalyanca konuşulan toprakları [From.GetName]'nin haklı bir parçası olarak gördüğünü açıkladı. \n\nResmi bir açıklama iddiaları destekleyerek, [From.GetName]'nin gerekirse bölgeyi zorla almaya hazır olduğunu açıkça belirtti."
 news.192.t:0 "İtalya Yugoslav Toprakları Üzerinde Hak İddia Ediyor"
 news.193.a:0 "Uluslarımız dost olarak birlikte duruyor."
 news.193.b:0 "Adriyatik'te barış olacak."
 news.193.c:0 "Bunun nereye varacağını görmek ilginç olacak."
 news.193.d:0 "Dalmaçya kıyılarındaki İtalyan nüfusu üzerinde [YUG.GetName] ile çatışmak yerine, [From.GetName], [YUG.GetName]'ye kalıcı bir diplomatik misyon kurulduğunu duyurdu. [From.GetAdjective] dışişleri bakanlığından yapılan bir açıklamaya göre, iki ülkenin o kadar çok ortak tarihi ve ortak çıkarı var ki, karşılıklı anlayış önemsiz bir sınır anlaşmazlığından çok daha önemlidir.\n\nAvrupa genelinde gerginlikler artarken, daha fazla ülkenin bu yaklaşımı benimsemesini ummaktan başka çare yok."
 news.193.t:0 "[YUG.GetName]'deki İtalyan Dışişleri Ofisi"
 news.194.a:0 "[Poland.GetName], [From.GetFactionName]'nin gücünü kabul ediyor!"
 news.194.b:0 "[From.GetName] yoluna çıkan her şeyi tüketiyor."
 news.194.c:0 "[Poland.GetName]'nin başka seçeneği kalmamış olmalı."
 news.194.d:0 "Bilinmeyen siyasi entrikalar sonucunda, [Poland.GetName] liderliği doğu bölgelerini [From.GetName]'ne devretti. \n\nBu siyasi zaferi elde etmek için [From.GetName] tarafından hangi vaatlerin veya tehditlerin yapıldığı henüz bilinmiyor. [Poland.GetLeader] anlaşmanın duyurusunun ötesinde tek bir kelime etmediği için bunu asla bilemeyebiliriz."
 news.194.t:0 "Doğu Polonya [From.GetName]'ne Devredildi"
 news.195.a:0 "[Soviet.GetName] antlaşmalarına sadık kalır."
 news.195.b:0 "Özgür bir Polonya'nın \"koruyucusunun\" yarattığı küllerden doğabileceğini umalım."
 news.195.c:0 "Polonya için bir coğrafi kayma. Yine."
 news.195.d:0 "[Soviet.GetName]'nin Almanya'yı işgalinin ardından, [From.GetName]'ne, tartışmalı Ostpreussen bölgesi de dahil olmak üzere Doğu Almanya'nın çoğu verildi.\nGörünüşe göre bu, Sovyet-Polonya antlaşmasındaki gizli bir maddenin sonucu. Polonya, [Soviet.GetName]'ne devretmek zorunda kaldığı toprakların telafisi olarak Alman toprağı alıyor.\n\nPolonya en yüksek risklerle oynadı ve çok şey kaybedilmiş olsa da, şimdi çok şey de kazanıldı."
 news.195.t:0 "[From.GetName]'ne Doğu Almanya Verildi"
 news.196.a:0 "Demokrasi asla boyun eğmeyecek!"
 news.196.b:0 "Gülünç bir çaba!"
 news.196.c:0 "Yükselin, kardeşler!"
 news.196.d:0 "Etkileyici bir konuşmasında [From.GetLeader], her yerdeki komünist partileri daha aşırı taktikler kullanarak Kapitalizmin düşüşünü hızlandırmaya çağırdı. Zulüm korkusu tek bir erkeği veya kadını işçi sınıflarının mücadelesini teşvik etmekten alıkoymamalıdır.\n\n[From.GetName], yabancı komünist partilerinin finansmanını artıracak ve uluslarını [From.GetFactionName] ile aynı çizgiye getirmek için gereken daha aşırı taktikler konusunda onları eğitecektir."
 news.196.e:0 "İdeolojilerin çatışması medeniyetlerin son savaşıdır."
 news.196.t:0 "[From.GetName] Devrimcileri Teşvik Ediyor"
 news.197.a:0 "Onlara bu kadar iyi şartlar sunduğumuz için memnun olmalılar."
 news.197.b:0 "[Soviet.GetName] durdurulmalı!"
 news.197.c:0 "[Soviet.GetName] Akdeniz'e girmek için pozisyon alıyor."
 news.197.d:0 "[From.GetName], bir [Soviet.GetAdjective] ültimatomuna boyun eğdi ve Ege Adaları üzerindeki kontrolü [Soviet.GetName]'ne devretti.\n\nBununla birlikte, [Soviet.GetName] Akdeniz'deki varlığını güçlendiriyor ve bölgedeki bir deniz gücü olarak kendini pekiştiriyor."
 news.197.t:0 "[From.GetName], [Soviet.GetAdjective] Ültimatomuna Boyun Eğiyor"
 news.198.a:0 "O zaman konuşma zamanı bitti."
 news.198.b:0 "[SOV.GetNameDef]'in savaş kışkırtıcıları durdurulmalı!"
 news.198.c:0 "Bu onların ültimatomuydu. Yunanistan savaşa hazırlanmalı."
 news.198.d:0 "[From.GetName], Ege Adaları üzerinde kendilerine verilen bir [SOV.GetAdjective] ültimatomundaki talepleri reddetti. [SOV.GetName]'nin bölge üzerinde giderek artan bir etki kullanmasıyla, [From.GetLeader], Ege'de tek bir ada vermenin onların tüm Akdeniz'i almasıyla sonuçlanacağını ilan etti.\n\nÜltimatom reddedildiğinde, [From.GetName] savaşın eşiğinde ve sadece [SOV.GetNameDef]'in tetiği çekmesini bekleyebilir."
 news.198.e:0 "[From.GetNameDef]'in yanındayız."
 news.198.t:0 "[From.GetName], [Soviet.GetAdjective] Ültimatomuna Direniyor"
 news.199.a:0 "Bu, [From.GetAdjective] stratejisi için elzemdir."
 news.199.b:0 "Dünya ülkeleri [From.GetNameDef]'in kötülüğüyle yüzleşmeli!"
 news.199.c:0 "[?SOV.former_controller_of_bessarabia.GetNameDefCap] talihsiz bir durumda."
 news.199.d:0 "\n\n[?SOV.former_controller_of_bessarabia.GetNameDefCap], [From.GetNameDef]'den gelen bir ültimatoma boyun eğmek zorunda kaldı. Besarabya toprakları [From.GetAdjective] kontrolüne geçti ve [?SOV.former_controller_of_bessarabia.GetAdjective] devleti sınırları daralmış bir şekilde kaldı.\n\nDaha fazla kayıptan [?SOV.former_controller_of_bessarabia.GetNameDef]'in nasıl kaçınacağı henüz belli değil."
 news.199.t:0 "[?SOV.former_controller_of_bessarabia.GetNameDefCap] Besarabya'yı [From.GetNameDef]'e Bırakıyor"
 news.2.a:0 "Şüpheli."
 news.2.b:0 "Bu bizi tatmin edecek... şimdilik."
 news.2.c:0 "Başka seçeneğimiz yoktu."
 news.2.d:0 "Japon ve Çin kuvvetleri, Pekin'in hemen güneybatısında bulunan stratejik Marco Polo Köprüsü üzerinde sonuçsuz bir çatışmaya girdi. \n\n[CHI.GetNameDef] olay için tüm sorumluluğu üstlendi, [JAP.GetNameDef]'e bir özür iletti ve kapsamlı toprak tavizlerini kabul etti. Bu, sınır gerginliklerinin tam ölçekli bir savaşa dönüşeceğini tahmin eden birçok uzmanı şaşırttı. \n\nBu, Asya'da kalıcı bir barış anlamına mı geliyor?"
 news.20.a:0 "Çok cesurca."
 news.20.b:0 "Ölüm fermanlarını imzaladılar."
 news.20.c:0 "Çizgi burada çekilmeli!"
 news.20.d:0 "Sınırlarında sıralanmış [GER.GetAdjective] kuvvetlerine rağmen, [FROM.GetNameDef] Berlin tarafından Memel toprağının iadesi için verilen bir ültimatomu reddetti. \n\nMemel bir zamanlar Doğu Prusya'ya aitti, ancak Versay Antlaşması'nın ardından [FROM.GetNameDef] tarafından ilhak edilmişti. [FROM.GetLeader], [FROM.GetAdjective] hükümetinin ret kararını açıklarken, korunması gerekenin Antlaşma'nın bütünlüğü olduğunu söyledi.\n\nUluslararası gözlemciler şimdi Almanya'nın bölgeyi zorla almaya çalışabileceğini bekliyor..."
 news.20.t:0 "[FROM.GetNameDefCap], [GER.GetAdjective] Taleplerini Reddediyor"
 news.200.a:0 "Alman dostluğu, Alman egemenliğinden daha iyidir."
 news.200.b:0 "Çekler her zaman Almanların dostu olmuştur."
 news.200.c:0 "[From.GetName] etki alanını genişletmeye devam ediyor."
 news.200.d:0 "\"Alman Küresi\" içindeki uluslar arasındaki kardeşlikten bahseden [From.GetLeader], bugün yaptığı bir konuşmada [From.GetName]'nin [CZE.GetNameDef] ile siyasi ve diplomatik işbirliğine olan bağlılığını duyurdu. Almanca konuşan önemli bir nüfusa sahip olan [CZE.GetNameDef], [From.GetAdjective] çıkarlarının doğal bir ortağı olarak sunuldu.\n\n[CZE.GetNameDef]'nin bu işbirliğinde ne kadar söz sahibi olduğu belirsiz olsa da, en azından sınırlarının [GER.GetNameDef]'nin topraklarına karşı güvende olduğundan emin olabilirler. hırslar."
 news.200.e:0 "Zamanımız için barış mı?"
 news.200.f:0 "[Root.GetLeader] Münih'teki tatilinden döndüğünde harika haberler!"
 news.200.t:0 "[CZE.GetNameDef]'de Alman Etkisi"
 news.201.a:0 "Yeni Türk hükümeti Akdeniz'deki rekabet gücümüzü güvence altına alıyor."
 news.201.b:0 "[GER.GetFactionName]'nin korkunç gücü ülkeleri domino taşları gibi deviriyor."
 news.201.c:0 "[From.GetNameDefCap], [GER.GetFactionName]'nin gücüne direnemedi."
 news.201.d:0 "\nDoğu ve batıdan [GER.GetFactionName]'nin diplomatik ve askeri baskısıyla karşı karşıya kalan [TUR.GetAdjective] hükümeti siyasi bir kargaşaya sürüklendi.\n\nAlman ve Sovyet tehditlerinin ardından, kaostan ortaya çıkan yeni hükümet eskisinden çok daha [GER.GetFactionName] dostu. Birkaç doğu toprağı zaten [SOV.GetNameDef]'e devredildi. \n\nGerçekten de, aceleyle susturulan bazı muhalifler, yeni hükümetin [GER.GetLeader]'in her dediğini yaptığını iddia ediyor."
 news.201.e:0 "İttifak konumumuzu güçlendiriyor."
 news.201.f:0 "Türkiye, yırtıcı [GER.GetFactionName]'nin kurbanı oldu."
 news.201.t:0 "[GER.GetNameDefCap], [TUR.GetNameDef]'i Boyun Eğmeye Zorluyor"
 news.202.a:0 "Versay'ın hatalarını düzeltmek için adil bir takas."
 news.202.b:0 "İşbirliği bizi çatışmadan daha güçlü yapar."
 news.202.c:0 "Bu, Versay'ın bariz bir ihlalidir!"
 news.202.d:0 "Aylardır süren giderek artan saldırgan söylemlerin ardından, [GER.GetNameDef] ile [POL.GetNameDef] arasındaki kötüleşen ilişkiler bu akşam, Danzig anlaşmazlığını çözmeyi amaçlayan diplomatik bir anlaşmayla tersine döndü.\n\n[POL.GetNameDef], Alman kontrolündeki Slovakya'yı bir Polonya alt devleti olarak bünyesine katacak ve karşılığında Danzig bölgesini devredecek. Özgür Danzig Şehri'nin statüsü hızla çözüldü ve yakında tamamen Alman devletine yeniden dahil edilecek.\n\nKonu barışçıl bir şekilde çözülmüş gibi görünse de, Büyük Savaş'ın galipleri kesinlikle itiraz edecektir."
 news.202.e:0 "Danzig üzerindeki çatışma önlendi."
 news.202.t:0 "Slovakya Karşılığında Danzig"
 news.203.a:0 "[GER.GetLeader]'in Avrupa'dan talepte bulunmaya devam etmesine izin verilemez!"
 news.203.b:0 "Bu, [GER.GetFactionName]'nin gücünün bir kabulüdür."
 news.203.c:0 "Alman yayılması devam ediyor."
 news.203.d:0 "[From.GetNameDef]'e bir [GER.GetAdjective] ültimatomunun sunulmasının ardından, [From.GetLeader] ve [From.GetAdjective] hükümeti savaşla yüzleşmek yerine her talebe uymaya karar verdi.\n\nDanzig'in kaybıyla, [From.GetNameDef]'in daha fazla Alman toprak hırsından güvende olacağını umuyorlar. Ancak durum gerginliğini koruyor ve Polonya sınır kuvvetlerinin henüz geri çekilme emri almamış olması manidardır."
 news.203.e:0 "Avrupa \"demokrasilerinin\" faşist tehdidi durdurmaktan aciz olduğu açıktır."
 news.203.t:0 "Polonya Danzig'i Terk Ediyor"
 news.204.a:0 "Almanya her uyarıyı görmezden geldi!"
 news.204.b:0 "O zaman savaş olsun."
 news.204.c:0 "Birlikte bu saldırganı durdurmalıyız!"
 news.204.d:0 "Talepler göz önüne alındığında, kaçınılmaz görünüyordu. \n\n[From.GetNameDef], Danzig'i Almanya'ya bırakmak zorunda kalacak ve bir Polonyalı tam yetkili temsilci daha fazla şartı müzakere etmek için Berlin'e gönderilecekti. [From.GetLeader], [GER.GetNameDef]'in son eylemlerine işaret ederek, Almanya'nın sadece Danzig ile tatmin olmayacağının açık olduğunu belirtti.\n\nAlman ve Polonya kuvvetleri savaşa hazır ve sınırdaki çatışmalara dair haberler şimdiden geliyor. Avrupa'da bir kez daha savaş var."
 news.204.e:0 "Bu ciddi bir durum."
 news.204.t:0 "Polonya Alman Ültimatomunu Reddediyor"
 news.205.a:0 "Bu Amerika'yı daha güvenli hale getirmeli."
 news.205.b:0 "Evde barışla ABD yurtdışındaki düşmanlarımıza odaklanabilir."
 news.205.c:0 "Şimdi Amerika kıtasında müttefik bulmakta zorlanabiliriz."
 news.205.d_america:0 "Diğer kıtalardaki çatışmalara bakan [USA.GetLeader], kendi evinde barışı korumayı amaçlayan yeni bir dış politika programı duyurdu.\n\nAmerikan kıtasındaki herhangi bir hükümet, komşuları tarafından tehdit edildiğini hissetmesi durumunda askeri koruma için Amerika Birleşik Devletleri'ne başvurabilir. Herhangi bir belirli devlete bir garanti olmasa da, Amerika'da barış arzusu artık sadece bir rüya değil, resmi Amerikan politikasıdır."
 news.205.d_not_america:0 "Diğer kıtalardaki çatışmalara bakan [USA.GetLeader], kendi evinde barışı korumayı amaçlayan yeni bir dış politika programı duyurdu.\nAmerikan kıtasındaki herhangi bir hükümet, komşuları tarafından tehdit edildiğini hissetmesi durumunda askeri koruma için Amerika Birleşik Devletleri'ne başvurabilir. Herhangi bir belirli devlete bir garanti olmasa da, Amerika'da barış arzusu artık sadece bir rüya değil, resmi Amerikan politikasıdır."
 news.205.e:0 "Kalıcı bir barış umalım."
 news.205.t:0 "Pax Americana (Amerikan Barışı)"
 news.206.a:0 "Tüm dünya devrimle özgürleşecek!"
 news.206.b:0 "Her türlü olasılığa hazırlıklı olmalıyız."
 news.206.c:0 "Küresel denge tehdit altında."
 news.206.d_communist:0 "İşçi devriminin Amerika Birleşik Devletleri'ne yayılmasının ardından, eski düzene karşı söylemleri çok daha saldırgan bir hal aldı. Şimdi [USA.GetLeader], Kanada'nın Britanya İmparatorluğu'na bağlı bir devlet olma statüsünü sorgularken, Amerikalı diplomatlar dünya genelinde aristokrasiden ve Derebeylikten arınmış bir dünya savunuyorlar.\n\nOnları birbirine bağlayan bağlara rağmen, [USA.GetNameDef] ile [ENG.GetNameDef]'in sömürge imparatorluğu arasındaki gerginlikler artıyor. Bu diplomatik çatışmanın tırmanması ve devrimin zorla [ENG.GetNameDef]'e getirilmesi an meselesi."
 news.206.d_not_communist:0 "Amerika Birleşik Devletleri'ndeki yeni komünist rejim, Komünist Enternasyonal üyelerine yaklaşırken eski müttefiklere ve dostlara karşı çok daha saldırgan bir duruş sergileyerek yeni bir [USA.GetAdjective] dış politika doktrini benimsedi.\nBu politika değişikliği, [CAN.GetName]'nin tabi bir ulus olarak statüsünün sorgulanmasını ve \"Dünya çapında İngiliz\" olarak adlandırdıkları şeyin genel uygulamasını içermektedir. emperyalizm.\"\n\nGerginliğin artmasıyla birlikte, yeni bir İngiliz-Amerikan çatışması tehdidi fazlasıyla gerçek görünüyor."
 news.206.e:0 "[USA.GetAdjective] rejimi endişelenecek bir şey değil."
 news.206.f:0 "Endişe verici bir gelişme."
 news.206.t:0 "Amerikan Anti-Emperyalizmi"
 news.207.a:0 "İnsanlık bu ideolojik vebadan kurtulacak!"
 news.207.b:0 "Komünizmin kalelerine çarpıp kırılacaklar."
 news.207.c:0 "Onları diz çöktüreceğiz."
 news.207.d_fascism:0 "\n[SOV.GetNameDef]'nin gittikçe saldırganlaşan retoriğine yanıt olarak [USA.GetLeader], \"insan uygarlığı için en büyük tehlike, komünizm\" olarak adlandırdığı şeye karşı yanıt verdi.\n\n[USA.GetNameDef] yalnızca dünya sosyalizminin Amerika'da yayılmasını önlemek için koruyucu politikalar izlemekle kalmayacak, aynı zamanda komünizmin kalbini yok etmeyi amaçlıyor.\n\n[USA.GetAdjective] savaş makinesinin gücüyle, komünizmin tamamen ortadan kaldırılması -ilk kez- tamamen mümkün görünüyor."
 news.207.d_not_fascism:0 "[USA.GetLeader] bugün \"insan uygarlığı için en büyük tehlike\" olarak adlandırdığı komünizme karşı halka açık bir konuşma yaptı.\n\n[USA.GetNameDef] yalnızca dünya sosyalizminin Amerika'da yayılmasını önlemek için koruyucu politikalar izlemekle kalmayacak, aynı zamanda [USA.GetAdjective] açıkça komünizmin kalbini yok etmeyi hedefliyor \n\nGerilim tüm zamanların en yüksek seviyesindeyken, [SOV.GetNameDef] ve [USA.GetNameDef] arasındaki savaş ateşini tetiklemek için gereken tek şey tek bir kıvılcımdır."
 news.207.e:0 "Bu çatışma ne yöne giderse gitsin, yıkım tam olacak."
 news.207.f:0 "[USA.GetNameDefCap] kendini korumak için ne gerekiyorsa yapmalı."
 news.207.t:0 "[USA.GetNameDefCap] Komintern'i Kınıyor"
 news.208.a:0 "Gerçekten mülklerimizi tehdit edebilecekler mi?"
 news.208.b:0 "Amerikan toprağı tehdit edilmediği sürece."
 news.208.c:0 "Avları için başka yerlere bakmaları gerektiğini fark ettiler."
 news.208.d:0 "Japonya silahlı kuvvetleri, [JAP.GetName]'nin uzun süreli bir savaş çabası için gerekli doğal kaynaklara sahip olmadığını uzun zamandır kabul ediyor. Dünyanın büyük güçlerini içeren artan gerginlikler ve silahlı çatışma salgınlarıyla birlikte, ithalat kaybı tehdidi her geçen gün daha da artıyor.\nBuna karşı koymak için Japon stratejistler, Güneydoğu Asya ve Pasifik'teki Batı sömürgelerini ele geçirmek için stratejik bir plan geliştirdiler. Bu kaynak zengini bölgeler Japon savaş makinesini besleyecek ve sömürgeci güçler ile [USA.GetName] uzak tutulabildiği sürece az çok engelsiz bir şekilde devam etmesini sağlayacaktır."
 news.208.e:0 "Güneydoğu Asya'da savaş muhtemel görünüyor."
 news.208.t:0 "Japon Ordusu Nanshin-ron'u Benimsiyor"
 news.209.a:0 "Mülklerimizi tehdit etmek aptallık olurdu."
 news.209.b:0 "Japonya'yı Pasifik'te ilerlemekten caydırdık."
 news.209.c:0 "Ne kadar korkunç bir güçle karşılaşacaklarını anlamıyorlar."
 news.209.d:0 "Japonya silahlı kuvvetleri, [JAP.GetNameDef]'in uzun süreli bir savaş çabası için gerekli doğal kaynaklara sahip olmadığını uzun zamandır kabul ediyor. Dünyanın büyük güçlerini içeren artan gerginlikler ve silahlı çatışma salgınlarıyla birlikte, ithalat kaybı tehdidi her geçen gün daha da artıyor.\nBuna karşı koymak için Japon stratejistler, [SOV.GetNameDef]'den Sibirya madenlerini ve petrol sahalarını ele geçirmek için stratejik bir plan geliştirdiler. Hızlı bir ilerlemenin, düzgün bir [SOV.GetAdjective] karşı saldırısı düzenlenmeden önce Japonya'nın kilit toprakların kontrolünü ele geçirmesini sağlayacağı teorize ediliyor. O zamana kadar Japon ordusu, [SOV.GetAdjective] teslimiyetine kadar savaş ateşini yakmaya devam etmek için ihtiyaç duyduğu tüm kaynaklara sahip olacaktır."
 news.209.e:0 "Sibirya'da savaş kaçınılmaz görünüyor."
 news.209.t:0 "Japon Ordusu Hokushin-ron'u Benimsiyor"
 news.21.a:0 "Pek endişe verici değil."
 news.21.b:0 "Bu büyük bir zafer."
 news.21.c:0 "O toprak zaten değersizdi."
 news.21.d:0 "[ROM.GetNameDef]'e daha fazla taviz verildi ve [BUL.GetNameDef] Güney Dobruca'yı geri aldı. \n\nBölge, İkinci Balkan Savaşı'ndan sonra 1913'te Romanya tarafından ilhak edilmişti ve hala çoğunlukla etnik Bulgarlar ve Türkler tarafından iskan ediliyor.\n\nAkıl yürütme ne olursa olsun, [ROM.GetNameDef] şimdi önemli ölçüde zayıfladı."
 news.21.t:0 "Krayova Antlaşması"
 news.210.a:0 "Japon etki alanını inkar etmek mümkün değil."
 news.210.b:0 "Güneydoğu sınırlarımıza göz kulak olmalıyız."
 news.210.c:0 "Belki de sömürgelerimizi Japon hırslarına karşı güçlendirme zamanı gelmiştir."
 news.210.d:0 "Çin'deki on yıllardır süren siyasi istikrarsızlığın yanı sıra hem iç hem de dış silahlı çatışmaların ardından, Japon hükümeti Çin hükümetini kendi çıkar alanının istikrarına yönelik bir tehdit olarak gördüğünü duyurdu.\n\nBu temelde -savaş tehdidi altında- Japonya'ya sadık ve Japon İmparatoru'na tabi yeni bir hükümet göreve getirildi. Bu yeni hükümet sadece Japon ordusunun korumasına sahip olmakla kalmıyor, aynı zamanda Çinli savaş ağası devletlerini geri almak için askeri bir yetkiye de sahip.\n\nSiyasi çatışmanın devam edeceği kesin olsa da, iki ülke arasındaki açık savaş önlendi."
 news.210.e:0 "Görünüşe göre Çin ile Japonya arasında bir tür barış olacak."
 news.210.t:0 "Japonya Çin'de Hükümeti Değiştiriyor"
 news.211.a:0 "[JAP.GetFactionName] yükseliyor."
 news.211.b:0 "Bu ilginç bir gelişme."
 news.211.c:0 "Asya'daki toprağımıza hak iddia etmeye cesaret edemezler."
 news.211.d:0 "Doğu Asya'daki askeri üstünlüğünü tartışmasız gören [JAP.GetLeader], [JAP.GetNameDef]'in tüm bölgeyi kendi çıkar alanı olarak gördüğünü duyurdu. Japonya'nın güç projeksiyon kapasitesinin kapsamı hakkında doğru bilgi olmadan, [JAP.GetNameDef]'in yakın zamanda kurulan [JAP.GetFactionName]'nin haklı bir parçası olarak tam olarak neyi gördüğü hala belirsiz."
 news.211.e:0 "Pasifik'te endişe verici bir gelişme."
 news.211.f:0 "Çıkarlarımızın çatıştığı anlaşılıyor."
 news.211.g:0 "Buna göz kulak olmalıyız."
 news.211.t:0 "Japonya Doğu Asya'da Hegemonya İddia Ediyor"
 news.212.a:0 "Bu hepimizi daha güçlü kılacak."
 news.212.b:0 "Düşmanlarımız dost edinmemeli."
 news.212.c:0 "Bundan bir şey çıkmaması en iyisi olabilir."
 news.212.d_axis:0 "Tokyo ile Berlin arasında yeni bir ortaklık gelişiyor. İki devlet arasında hem stratejik çıkarları hem de paylaşılan değerleri gerekçe göstererek bir pakt için müzakereler başladı. Bu müzakerelerden ne çıkacağı henüz belli olmasa da, her iki yarımküredeki en güçlü askeri güçlerden bazılarının dostluğu, müttefikleri için bir kutlama nedeni ve birçok düşmanları için endişe kaynağıdır."
 news.212.d_not_axis:0 "Tokyo ile Berlin arasında yeni bir ortaklık gelişiyor. İki devlet arasında hem stratejik çıkarları hem de paylaşılan değerleri gerekçe göstererek bir pakt için müzakereler başladı. Bu müzakerelerden ne çıkacağı henüz belli olmasa da, her iki yarımküredeki en güçlü askeri güçlerden bazılarının dostluğu, birçok düşmanları için endişe kaynağıdır."
 news.212.t:0 "Berlin'deki Japon Diplomatları"
 news.213.a:0 "[GER.GetName] bin yıl boyunca güçlü duracak!"
 news.213.b:0 "Sözlerini çelikle kanıtlamak zorunda kalacaklar."
 news.213.c:0 "[GER.GetName] düşecek!"
 news.213.d_peace:0 "Özgürlerin Ülkesi olarak [USA.GetNameDef], kendini dünya genelindeki tüm biçimleriyle faşizmin doğal düşmanı olarak görüyor. Alman rejiminin saldırganlığıyla, şu anda [USA.GetNameDef]'in bağlı olduğu liberal ilkeler üzerine kurulu bir dünyanın en büyük düşmanıdırlar.\n\nBu düşünceyle ve [USA.GetAdjective] Kongresi'nin onayıyla, [USA.GetLeader], [GER.GetNameDef]'e bir uyarı yayınladı. [GER.GetNameDef] siyasi rotasını tersine çevirmezse, [USA.GetNameDef] onlara karşı harekete geçecektir.\n\nBelirli bir eylem planı belirtilmemiş olsa da, iki ülke arasında üstü kapalı savaş tehdidi ağır bir şekilde hissediliyor."
 news.213.d_war:0 "Özgürlüğün Ülkesi olarak [USA.GetNameDef], kendisini dünya çapındaki tüm biçimleriyle faşizmin doğal düşmanı olarak görmektedir. Alman rejiminin saldırganlığıyla, şu anda [USA.GetNameDef]'nin bağlı olduğu liberal ilkeler üzerine inşa edilmiş bir dünyanın en büyük düşmanıdırlar.\n\nBunu akılda tutarak ve [USA.GetAdjective] Kongresinin onayıyla [USA.GetLeader], [GER.GetNameDef]'ye bir uyarı yayınladı. [GER.GetNameDef] teslim olup siyasi rotayı tersine çevirmediği sürece, [USA.GetNameDef] tüm endüstriyel ve askeri güçlerini onlara karşı kullanacak.\n\"[GER.GetNameDef]'nin tarihin ilerleyişini saptırmasına izin vermeyeceğiz!\""
 news.213.e:0 "Bunun barışçıl bir çözümü olmayacak."
 news.213.t:0 "[USA.GetNameDefCap] Faşizme Karşı Duruyor"
 news.214.a:0 "Doğu Avrupa'da yeni bir güç."
 news.214.b:0 "Bizim etki alanımıza karışıyorlar!"
 news.214.c:0 "Açıkça [GER.GetName]'i tehdit etmeye çalışıyorlar."
 news.214.d_baltic:0 "[POL.GetName], saldırganların Polonya devletini bir kez daha devirmesini önlemek için \"büyük güçlerin\" siyasetine güvenemeyeceklerinin bilincinde olarak yavaş yavaş uluslararası toplumdan uzaklaşıyor.\n\nBunun yerine, [POL.GetLeader], Baltık bölgesini güçlendirmek için, her iki doğudan gelecek saldırıları caydıracağı umulan bir ittifak için planlar sundu. veya batı.\n\nAvrupa'nın istikrarının bozulmasıyla birlikte böyle bir ittifak bizim çıkarımıza olabilir."
 news.214.d_not_baltic:0 "\"Polonya halkına daha fazla baskı yapılmasını riske atmayacak bir sonuç yok bizim için.\"\n\n[POL.GetName]'nin uluslararası toplumdan uzaklaşmasının ardından Polonyalı politikacılar \"denizler arasında\" bir güç fikrinin peşinde koşuyorlar.\n\nUmut bir ittifak oluşturmak iken Baltık'tan Karadeniz'e kadar uzanan bu ülkelerin belirtilen öncelikleri, hem doğudan hem de batıdan gelecek tehdit edici etkilere karşı konumlarını güçlendirmek olmaya devam ediyor. Bu amaçla [POL.GetName], Baltık'taki komşularıyla daha yakın bağlar kurmaya çalışıyor."
 news.214.e:0 "[POL.GetFactionName] en güvenli bahsimiz olabilir."
 news.214.t:0 "Polonya Baltık İşbirliği Arıyor"
 news.215.a:0 "Komünist tehdidine karşı koymanın tek yolu bu."
 news.215.b:0 "Mücadele sadece işçi devrimini hızlandıracaktır."
 news.215.c:0 "Bırakın birbirlerini kurutana kadar kan döksünler."
 news.215.d_not_soviet:0 "[GER.GetNameDefCap] uzun süredir komünizmin her biçimini kınadı ve diğer ulusların da buna karşı çıkmasını talep etmek için diplomatik hareketlerde bulundu.\n\nŞimdi, [GER.GetName] \"komünizmin doğrudan tehdidi altındaki devletlere\" [SOU.GetName]'ye karşı bir anlaşma oluşturma şansı sundu. Pakttaki herhangi bir ülke, bir üyenin saldırıya uğraması durumunda [SOU.GetName]'ye karşı savaşmaya kararlı olacaktır."
 news.215.d_soviet:0 "[GER.GetLeader] iktidara gelmesinden bu yana komünizmin açık sözlü bir muhalifi olmuştur ve [GER.GetNameDef]'nin kendisini [SOU.GetNameDef]'nin düşmanı olarak gördüğüne dair hiçbir şüphe olmamıştır.\n\nBugün bu tutum, daha önce aralarında imzalanan \"Anti-Sovyet Anlaşması\" ile tüm dünyaya duyurulmuştur. [GER.GetNameDef] ve diğer birçok ülke artık bir anlaşmayla resmileştirildi. İçlerinden birinin bize karşı bir çatışmaya girmesi durumunda diğer üyelerden biri savaşa çağrılacak."
 news.215.t:0 "[GER.GetName] Anti-Sovyet Paktı'nı Resmileştiriyor"
 news.216.a:0 "[GER.GetName] alaşağı edilecek."
 news.216.b:0 "[TUR.GetName]'nin yanındayız."
 news.216.c:0 "Aptalca bir direniş."
 news.216.d:0 "[GER.GetName]'den diplomatlar dün [TUR.GetName]'ne bir ültimatom vererek, [TUR.GetLeader]'in Alman destekli bir hükümet lehine istifa etmesini talep etti. Büyük Millet Meclisi'nin desteğiyle [TUR.GetLeader] ültimatomu reddederek, [TUR.GetAdjective] halkına Türkiye'nin asla yabancı bir diktatörün savaş oyunlarında piyon olmayacağını duyurdu.\n\nŞimdi ülke savaşa hazırlanıyor."
 news.216.e:0 "Türkiye'de savaş kaçınılmaz görünüyor."
 news.216.t:0 "[TUR.GetName] [GER.GetName]'in Ültimatomuna Direniyor."
 news.217.a:0 "[GER.GetNameDef]'e karşı birlikte durmalıyız."
 news.217.b:0 "[GER.GetNameDefCap] giderek daha fazla düşman ediniyor."
 news.217.c:0 "Eğer barışçıl işbirliğini reddederlerse..."
 news.217.d:0 "\n\n[TUR.GetAdjective] hükümetine bir ültimatom vererek, [GER.GetNameDef] kendine yeni bir düşman yarattı. [GER.GetLeader]'in beklediği gibi [GER.GetAdjective] diplomatlarından gelen taleplere boyun eğmek yerine, [TUR.GetNameDef], [ENG.GetNameDef] ile bir savunma ittifakı yapmayı kabul etti.\n\n[ENG.GetNameDef] ve müttefikleri, [GER.GetNameDef]'in ültimatomuna karşılık vermesi durumunda [TUR.GetNameDef]'i savunmaya hazırlanıyor."
 news.217.e:0 "[GER.GetNameDefCap] ve [TUR.GetNameDef] tehlikeli bir oyun oynuyor."
 news.217.t:0 "[GER.GetNameDefCap], [TUR.GetNameDef]'i [ENG.GetFactionName]'ne Katılmaya Sürüklüyor"
 news.218.a:0 "Sadece bir muz istemiştim."
 news.218.d:0 "Şiddetli karne programımız taze meyveyi kapsamasa da, savaşın gölgesi ithalat kapasitemizin çoğundan yoksun olduğumuz anlamına geliyor. Bu nedenle tropik bölgelerden gelen birçok eski ticari mal, limon ve muz gibi artık ulaşılamaz lüksler haline geldi. \nSavaş zamanı ruhunu koruyarak, dükkan sahipleri pencerelerine neşeli eski bir gösteri şarkısına atıfta bulunan tabelalar asmaya başladılar.\n\nNe yazık ki yeşil fasulye ve soğan, lahana ve yeşil soğan ve her türlü meyvede de kıtlık var, ancak İngiliz ruhu direniyor!"
 news.218.t:0 "Evet! Muzumuz Yok"
 news.219.a:0 "[SOV.GetLeader], [SOV.GetNameDef]'de istikrarı sağladı."
 news.219.b:0 "Komünizmde içkin olan yolsuzluğun kanıtı."
 news.219.c:0 "[SOV.GetAdjective] komutası büyük zarar gördü."
 news.219.d:0 "[SOV.GetNameDef]'de uzun süredir belirsizlik hüküm sürüyor. Detaylar kıt olsa da, en üst düzeyde bir dizi gizli duruşma yapıldı ve hem generaller hem de bakanlar kamuoyunun gözünden kayboldu.\nDoğal varsayım, Komünist Parti içinde büyük bir komplonun ortaya çıkarıldığı yönünde, ancak resmi bir açıklama yapılmadı. Ayrıca, erişebildiğimiz diplomatik raporlar, bu duruşmalarda sunulan kanıtların kesin olmaktan uzak olduğunu gösteriyor.\n\nNe olursa olsun, [SOV.GetAdjective] yüksek komuta yapısı geri dönülmez bir şekilde değişti."
 news.219.t:0 "[SOV.GetNameDef]'de Liderlik Tasfiyeleri"
 news.22.a:0 "İtalya'nın hırslarının bir başka kurbanı."
 news.22.b:0 "Büyük imparatorluğumuzu gerçekleştirme yolunda bir adım daha attık."
 news.22.c:0 "Dostumuz [From.GetLeader] için bir başka zafer!"
 news.22.d:0 "İtalyan diplomatları tarafından Arnavut hükümetine tam askeri işgale boyun eğmelerini talep eden bir ültimatom verildi. \n\n[ALB.GetLeader] direnmenin boşuna olduğunu anlayınca tahttan çekildi ve Arnavutluk artık İtalyan Kralı Vittorio Emanuele III altında kişisel bir birlik içinde yönetilecek.\n\n[ITA.GetNameDef] Balkanlar'a göz dikiyor..."
 news.22.t:0 "[ALB.GetLeader] İtalya'ya Boyun Eğiyor"
 news.220.a:0 "Halk her zaman galip gelecektir."
 news.220.b:0 "[Root.GetNameDef] için!"
 news.220.c:0 "İçten çöküyorlar!"
 news.220.d:0 "Sovyet yüksek komutasının bazı kesimleri [SOV.GetLeader]'in liderliğine karşı ayaklandı!\nBu ayaklanmanın tam olarak neyin neden olduğu belirsiz, ancak iktidarı ele geçirmek için özellikle iyi planlanmış bir çaba gibi görünmüyor.\n\n[SOV.GetAdjective] siyasi durumu, dış dünyaya yansıttıkları gibi olmayabilir."
 news.220.e:0 "Sosyalist güç yapısı sürdürülemez."
 news.220.f:0 "Bu beklenmedik bir gelişme."
 news.220.t:0 "[SOV.GetNameDef]'de Subaylar Ayaklandı!"
 news.221.a:0 "Dördüncü Enternasyonal yol gösteriyor."
 news.221.b:0 "Yeni bir dünya lideri sahneye çıkıyor."
 news.221.c:0 "Ama Troçki tam burada... Ah."
 news.221.d:0 "[SOV.GetNameDefCap] büyük bir altüst oluş yaşadı, zira Stalin eski siyasi rakibi [SOV.GetLeader]'i destekleyen bir fraksiyon tarafından devrildi!\nEski diktatörün şimdi nerede olduğu veya geçişin tam olarak nasıl gerçekleştiği konusunda detaylar hala kıt.\nAncak her şey, bunun barışçıl bir geçiş olmadığına işaret ediyor, zira bazı Stalin sadıkları Troçki'nin yeni rejimine karşı isyan bayraklarını çekti."
 news.221.t:0 "Troçki [SOV.GetNameDef]'e Geri Dönüyor"
 news.222.a:0 "Kral ve ülke için ne gerekiyorsa yaparız."
 news.222.b:0 "[Root.GetAdjective] bağımsızlığını da mı tehdit edecekler?"
 news.222.c:0 "[ENG.GetNameDefCap] zor kararlar vermek zorunda."
 news.222.d:0 "\nİskandinavya bölgesinin [ENG.GetAdjective] savunma çabaları için stratejik değeri ve bir düşmanın orada nüfuz oluşturma potansiyel riskleri göz önüne alındığında, [ENG.GetAdjective] Parlamentosu askeri bir müdahale olasılığını tartıştı.\nBöyle bir eylemin siyasi sonuçları [ENG.GetLeader] üzerinde ağır bir yük oluştursa da, tartışmanın geri kalanının kapalı kapılar ardında yapılmasına karar verilmeden önce birkaç belirleyici argüman sunuldu.\n\nBöyle bir müdahale Kuzey Avrupa'nın siyasi manzarasını geri dönülmez bir şekilde değiştirecektir."
 news.222.e:0 "Böyle bir eylem Avrupa'daki dengeyi bozacaktır."
 news.222.f:0 "Gerçekten bir müdahaleyi göze alacaklar mı?"
 news.222.t:0 "[ENG.GetAdjective] Parlamentosu İskandinavya'ya Müdahaleyi Tartışıyor"
 news.223.a:0 "Kral ve ülke için ne gerekiyorsa yaparız."
 news.223.b:0 "[Root.GetAdjective] bağımsızlığını da mı tehdit edecekler?"
 news.223.c:0 "[ENG.GetNameDefCap] zor kararlar vermek zorunda."
 news.223.d:0 "\nBüyük Savaş'tan ders çıkaran [ENG.GetAdjective], Benelüks bölgesinin stratejik değerini ve düşman ülkelerin orada nüfuz oluşturma potansiyel risklerini hafife almayacaktır. [ENG.GetAdjective] Parlamentosu askeri bir müdahale olasılığını tartıştı.\nBöyle bir eylemin siyasi sonuçları [ENG.GetLeader] üzerinde ağır bir yük oluştursa da, tartışmanın geri kalanının kapalı kapılar ardında yapılmasına karar verilmeden önce birkaç belirleyici argüman sunuldu.\n\nBöyle bir müdahale Batı Avrupa'nın siyasi manzarasını geri dönülmez bir şekilde değiştirecektir."
 news.223.e:0 "Böyle bir eylem Avrupa'daki dengeyi bozacaktır."
 news.223.f:0 "Gerçekten bir müdahaleyi göze alacaklar mı?"
 news.223.t:0 "[ENG.GetAdjective] Parlamentosu Benelüks'e Müdahaleyi Tartışıyor"
 news.224.a:0 "Diplomatik misyonlarını kabul etmeliyiz."
 news.224.b:0 "[ENG.GetAdjective]ler kendilerini ne sanıyor?"
 news.224.c:0 "[ENG.GetAdjective]ler nüfuzlarını kullanıyor."
 news.224.d:0 "Cebelitarık'tan yansıtılan Akdeniz'deki İngiliz nüfuz geleneğiyle, [ENG.GetAdjective] hükümetinin [Spain.GetNameDef]'deki faşist hükümete siyasi baskı yapmaya karar vermesi şaşırtıcı olmamalıdır.\n\nİç savaşlarından hala toparlanmakta olan İspanya için, [ENG.GetAdjective] desteği siyasi ilkelerden çok daha önemlidir."
 news.224.t:0 "[ENG.GetNameDefCap], [SPR.GetNameDef]'e Baskı Yapıyor"
 news.225.a:0 "Diplomatik misyonları bizim için faydalı olabilir."
 news.225.b:0 "[ENG.GetAdjective]ler kendilerini ne sanıyor?"
 news.225.c:0 "[ENG.GetAdjective]ler nüfuzlarını kullanıyor."
 news.225.d:0 "\nAkdeniz uzun süredir [ENG.GetNameDef]'nin imparatorluk etkisi açısından büyük stratejik değere sahip bir bölge olmuştur. Şimdi [ENG.GetAdjective] hükümeti bölge ülkelerinden daha fazla destek bekliyor. Bu amaçla \"[TUR.GetAdjective] devletine özel bir konsolos\" atadılar.\n\nAkdeniz'de deniz üstünlüğü için yüzyıllardır süren şiddetli rekabet göz önüne alındığında, iki ülkeyi birbirine yakınlaştırmada başarılı olup olmayacakları zaman gösterecek."
 news.225.t:0 "[ENG.GetNameDefCap], [TUR.GetNameDef]'de Nüfuz Kullanıyor"
 news.226.a:0 "Diplomatik misyonları bizim için faydalı olabilir."
 news.226.b:0 "[ENG.GetAdjective]ler kendilerini ne sanıyor?"
 news.226.c:0 "[ENG.GetAdjective]ler nüfuzlarını kullanıyor."
 news.226.d:0 "\nAkdeniz uzun süredir [ENG.GetNameDef]'nin imparatorluk etkisi açısından büyük stratejik değere sahip bir bölge olmuştur. Şimdi [ENG.GetAdjective] hükümeti bölge ülkelerinden daha fazla destek bekliyor. Bu amaçla \"[GRE.GetAdjective] eyaletine özel bir konsolos\" atadılar.\n\nLord Byron'ın Yunan Bağımsızlık Savaşı'na katılımından bir asırdan fazla süre sonra, [ENG.GetNameDef]'nın başarılı olup olmadığı henüz bilinmiyor."
 news.226.t:0 "[ENG.GetNameDefCap], [GRE.GetNameDef]'de Nüfuz Kullanıyor"
 news.227.a:0 "Yarasa diyarındayız."
 news.227.d:0 "\"Etkiler görülmeye başladığında Berlin'den on mil uzaktaydık. Savaş çabalarımızı artırmaları gerekiyordu. Saçma. Artan tek şey, komutanımın benden kurtulmaya çalıştığına dair şüphemdi. Alman panzerlerinin yuvarlanan adımları ile gözlerimin arkasındaki vahşi gümbürtü arasındaki farkı anlayamamamın bir faydası olmadı.\nDr. Gonzo'yu bulmam gerekiyordu.\""
 news.227.t:0 "Karanlık ve Vahşi Bir Yolculuk"
 news.228.a:0 "Umarım bizi faşist dalgaya karşı koruyabilirler."
 news.228.b:0 "Kendi küçük \"etki alanlarına\" bağlı kalmalılar!"
 news.228.c:0 "Avrupa istikrarı korunmalı!"
 news.228.d:0 "\n[ENG.GetNameDefCap], Orta Avrupa'da tehdidin arttığını gören tek kişi değil.\n\nŞu anda tartışmalı olan Versailles Antlaşması ile güvence altına alınan bağımsız bir ulus olarak statüleri veya kendi toprakları üzerinde hak iddia eden saldırgan söylemlerindeki faşist güçler nedeniyle, birçok devlet [ENG.GetAdjective] yanlısı bir yönetime liderlik etme ihtiyacını gördü. politika. \n[ENG.GetNameDefCap] bu gelişmeye bölgedeki diplomatik çabalarını iki katına çıkararak karşılık verdi."
 news.228.e:0 "[ENG.GetNameDefCap] stratejisini hazırlıyor."
 news.228.t:0 "[ENG.GetNameDefCap] Balkan Diplomatik Girişimini Duyurdu"
 news.229.a:0 "[GER.GetAdjective] ilerleyişleri reddedilmeli!"
 news.229.b:0 "Fırsatları varken kendilerini kurtarmalıydılar."
 news.229.c:0 "Bu muhtemelen silahlı çatışmayla sonuçlanacak."
 news.229.d:0 "[GER.GetNameDef] liderliğindeki toprak talepleriyle büyük ölçüde küçülmesine rağmen, [GRE.GetNameDef] şimdi kumda bir çizgi çekti. [GRE.GetLeader], [GRE.GetNameDef]'in daha fazla taviz vermeyeceğini ve artık herhangi bir [GER.GetAdjective] talebine boyun eğmeyeceğini açıkça belirtti.\n\nBütün bunlar, [GER.GetNameDef]'den gelen, [GRE.GetNameDef] hükümetinin istifa etmesi ve [GER.GetAdjective] onaylı bir yedek kabul etmesi yönündeki bir ültimatoma yanıt olarak geldi."
 news.229.t:0 "[GRE.GetNameDefCap], [GER.GetAdjective] Baskısına Direniyor"
 news.23.a:0 "[ALB.GetNameDef] ne kadar süre direnebilir?"
 news.23.b:0 "Bu kısa bir sefer olacak."
 news.23.c:0 "Çok yaşa Kral Zog!"
 news.23.d:0 "[ITA.GetNameDef]'den diplomatlar [ALB.GetNameDef]'e bir ültimatom vererek, ikincisinin Büyük İtalya'ya ilhakını talep etti. \n\nCesur bir ulusal liderlik eylemiyle Kral Zog, İtalyan taleplerine boyun eğmeyi reddederek Arnavut halkını [ITA.GetNameDef]'den gelen baskıya direnmeye çağırdı. \n\nYine de, yabancı askeri uzmanlar [ALB.GetNameDef]'in bir işgale direnme şansının çok az olduğu konusunda hemfikir."
 news.23.t:0 "Zog Meydan Okuyor"
 news.230.a:0 "Ülkemizi yıkımın eşiğine getirecekler!"
 news.230.b:0 "Ha? Biz değildik."
 news.230.c:0 "Her yerdeki insanlar özgürlük davası için ayaklanmalı!"
 news.230.d:0 "Hem Orta hem de Güney Amerika'da devrimciler silaha sarıldı ve [USA.GetRulingIdeologyNoun] adına isyan başlattı.\n\nGenellikle iyi donanımlı ve iyi organize olmuş durumdalar ve başka bir ideolojiyi savunuyor olsalardı, finansmanlarını takip etmek kolay olurdu. Ancak bu hareketleri kimin tedarik ettiği, katılımlarını gizlemek için ortak bir çaba sarf etti.\n\nElbette, Amerika kıtasında [USA.GetRulingIdeologyNoun]'nu teşvik etme yönünde belirtilmiş bir dış politika misyonu olan tek bir büyük güç var..."
 news.230.e:0 "Amerikan destekli darbeler mi?\nHayatta bir kez olacak bir olay!"
 news.230.t:0 "Amerika Kıtalarında İsyanlar"
 news.231.a:0 "Acımasız emperyalist işgalciler!"
 news.231.b:0 "Çin'deki çatışma endişe verici."
 news.231.d:0 "Marco Polo Köprüsü Olayı'nın ardından [JAP.GetName], [CHI.GetAdjective] sınırı üzerindeki baskısını azaltmadı.\nAgresif [JAP.GetAdjective] retoriğiyle birlikte \"[CHI.GetNameDef]'nin işbirliği yapmayı reddetmesine korkunç bir misilleme\" yapılacağından bahsederek [JAP.GetNameDef] ve arasında yenilenen bir savaş [CHI.GetNameDef] gün geçtikçe daha muhtemel görünüyor.\n\nDiplomatik durum yakında kaynama noktasına ulaşacak ve [JAP.GetNameDef] durumu yatıştırma konusunda herhangi bir ilgi göstermedi."
 news.231.t:0 "[CHI.GetAdjective] Sınırında [JAP.GetAdjective] Yığınağı"
 news.232.a:0 "Dost edinmek düşman edinmekten iyidir..."
 news.232.b:0 "Bu noktada gerçekten yeni müttefikler bulabileceklerini mi sanıyorlar?"
 news.232.c:0 "Bu duruma göz kulak olmalıyız."
 news.232.d:0 "\"Ortak siyasi çıkarlardan\" bahseden [GER.GetLeader] bugün, [GER.GetNameDef] ile İskandinav ülkeleri arasındaki ilişkileri geliştirmeye yönelik bir diplomatik program duyurdu.\nİlk adım, iki ülke arasında herhangi bir çatışma çıkmamasını sağlayacak olan [DEN.GetNameDef]'de kalıcı bir diplomatik misyonun kurulmasıdır.\n\n [DEN.GetAdjective] hükümet, [GER.GetLeader]'ye göre bu diplomatik yardımı nezaketle kabul etti.\n\n[DEN.GetAdjective] diplomatlar yorum yapmak için müsait değildi."
 news.232.t:0 "[GER.GetNameDefCap] İskandinav Desteği Arıyor"
 news.233.a:0 "Bu iyiye işaret değil."
 news.233.b:0 "Seçeneklerimizi değerlendirmeliyiz."
 news.233.c:0 "Durumun nasıl gelişeceğini göreceğiz."
 news.233.d_no_war:0 "[GER.GetAdjective] söylemi son haftalarda kuzey ülkelerine yönelik yoğunlaştı. Mesaj açık: [DEN.GetNameDef] ve [NOR.GetNameDef], ister muhalefetle ister eylemsizlikle olsun, Alman ithalatını hiçbir şekilde engellememelidir.\n\nİthalat hala Almanya'ya serbestçe aktığı için bu tür talepler için hemen belirgin bir neden olmasa da, diplomatlarımız bunun bölgedeki [GER.GetAdjective] eyleminin bir başlangıcı olduğundan endişe ediyor."
 news.233.d_war:0 "[GER.GetNameDefCap]'in İskandinavya'da hem askeri operasyonlar için üsler hem de doğal kaynak ithalatı uğruna açık stratejik çıkarları var. Tırmanan çatışma, Baltık veya Kuzey Denizi üzerinden taşınan herhangi bir kaynak için çok gerçek bir tehdit olduğu anlamına geliyor.\n\n[DEN.GetNameDef] ve [NOR.GetNameDef]'e yönelik giderek yoğunlaşan diplomatik tehditlerle birlikte, bölgedeki [GER.GetAdjective] askeri operasyonlarında bir artış muhtemel görünüyor."
 news.233.t:0 "İskandinavya'da [GER.GetAdjective] Çıkarları"
 news.234.a:0 "Tekrar değil!"
 news.234.b:0 "[GER.GetNameDefCap] uzak tutulmalı!"
 news.234.c:0 "Bu saldırgan bir hamle olurdu."
 news.234.d:0 "Fransa ile savaşın patlak vermesinin ardından, Almanya Benelüks ülkeleri üzerindeki diplomatik baskısını her zamankinden daha fazla artırdı. Ancak [FRA.GetAdjective] ve [ENG.GetAdjective] desteğiyle baskılara boyun eğmeyi reddediyorlar.\n\nEğer [GER.GetNameDef] diplomasiyle istediğini elde edemezse, zorla alacağına inanmak için neden var."
 news.234.t:0 "Benelüks'e Yönelik [GER.GetAdjective] Baskısı"
 news.235.a:0 "Bir Amerikan kahramanına yakışır bir karşılama alacak!"
 news.235.d:0 "Bugün [GER.GetLeader] için sevindirici bir haber; en sevdiği film yıldızı, tek Charlie Chaplin Kaliforniya'da bulundu. Kırsal bölgelere kaçarken onu ikonik bıyıklarından hemen tanıyan bir [GER.GetAdjective] devriyesi tarafından durduruldu. Saygıdeğer oyuncu, usta eseri \"Büyük Diktatör\"ün son monologunu tekrar ettirdikten sonra, bölgeye konuşlanmış [GER.GetAdjective] birliklerini eğlendirmek için gelmeye 'ikna oldu'.\n\nŞimdi Berlin'e gönderilecek ve burada [GER.GetLeader] sonunda kahramanıyla buluşacak. Siyasi farklılıklar toplantıyı olumsuz etkileme riski taşırken, [GER.GetLeader] bir çocuk gibi sersemlemiş bir şekilde o anı bekliyor."
 news.235.t:0 "Chaplin Kaliforniya'da Yakalandı"
 news.236.a:0 "Akşam olmadan günü övme."
 news.236.b:0 "Doğru olduğunu düşündüğümüzü talep ettik."
 news.236.c:0 "Bu savaşı hızlı bir sonuca ulaştıralım."
 news.236.d:0 "[GER.GetNameDef]'e karşı ortak bir zaferin kaçınılmaz olduğunu gören [yalta_origin.GetNameDef] ve [yalta_partner.GetNameDef], Avrupa'da gelecekteki istikrarı güvence altına almak istiyor. [yalta_origin.GetLeader], [yalta_partner.GetLeader] ve savaş çabalarına katılan diğer ülkelerin liderleri, [GER.GetNameDef]'in kaderi üzerinde anlaşmak için bir araya geldi.\n\nGünlerce süren müzakereler, yeni bir Avrupa haritasının çizilmesine yol açtı. Bu yeni Avrupa düzeni, [GER.GetNameDef]'in ortasından açılmak üzere olan yarayla doğu ve batı arasında bölünmüştür.\n\nBunun Avrupa'da gerçekten kalıcı bir barışa yol açıp açmayacağını zaman gösterecek."
 news.236.e:0 "Bu [GER.GetNameDef]'in sonu olabilir."
 news.236.t:0 "Yalta Konferansı"
 news.237.a:0 "Eğer istedikleri buysa..."
 news.237.b:0 "Reich'a hoş geldiniz!"
 news.237.c:0 "Kuzey sınırlarımızı güvence altına almalıyız!"
 news.237.d:0 "[From.Root.GetNameDef]'deki yerel Nazi partisinin başarılı bir darbesinin ardından, Alman birlikleri sınırı geçti ve ülkenin kontrolünü ele aldı. \n\nAlman askerleri, devam eden iç savaşta savaşan [From.Root.GetAdjective]lere katılmak için ülke genelinde hızla ilerlerken şehirlerde alkışlayan kalabalıklar tarafından karşılandı. [GER.GetLeader] Avusturya'nın Anschluss'unu duyurdu ve altını çizdi:\n\n'Halkın mücadeleleri yakında sona erecek! Alman halkının en eski doğu eyaleti, bu noktadan itibaren [GER.GetNameDef]'in en yeni kalesi olacaktır!'"
 news.237.e:0 "Bu, Versay Antlaşması'nı ihlal ediyor!"
 news.237.t:0 "Avusturya'nın Anschluss'u"
 news.238.a:0 "İlginç bir strateji."
 news.238.b:0 "Umarım [AST.GetNameDef] ne yaptığını biliyordur."
 news.238.c:0 "Sonunda kıtayı savunmak için ihtiyacımız olan araçlara sahibiz."
 news.238.d:0 "\nGüneydoğu Asya'daki [ENG.GetAdjective] mülklerine yönelik artan tehdide karşı durma çabasıyla, Singapur ve Borneo sömürge toprakları [AST.GetNameDef]'e devredildi. Pasifik'teki İngiliz Milletler Topluluğu'nun ilk ve en iyi savunma hattı olma hedefiyle, [AST.GetNameDef] bölgedeki çatışmalar durumunda askeri ve idari hazırlıkların tüm sorumluluğunu üstleniyor.\n\nMuhtemelen [JAP.GetNameDef]'in imparatorluk hırslarına karşı koymayı amaçlayan [AST.GetNameDef], kıyılarını işgalden korumak için artık tamamen eski sömürge efendisinin çabalarına bağımlı olmayacaktır."
 news.238.e:0 "Gerçekten bir fark yaratacağına inanıyorlar mı?"
 news.238.t:0 "[AST.GetNameDefCap] Sömürge Mülklerinin Sorumluluğunu Üstleniyor"
 news.239.a:0 "Son derece rahatsız edici."
 news.239.b:0 "Sosyalist yoldaşlarımızı kollarımızı açarak karşılıyoruz!"
 news.239.c:0 "Biz adaletin ve hakkaniyetin ta kendisiyiz!"
 news.239.d:0 "Ülkelerini \"devrimin yayılmasında doğal müttefikler\" olarak gören [AST.GetLeader] ve [SOV.GetLeader], [AST.GetNameDef]'yi [SOV.GetFactionName]'nin ana üyelerinden biri olarak kabul eden bir anlaşma imzaladılar.\n[AST.GetNameDef], ve tarafından işçi devletinin parlak bir örneği olarak ilan edildi. Avrupa'nın sömürgeci efendileri yerine halk için.\n\nSiyasetteki [AST.GetAdjective] son gelişmelerle birlikte, bazıları bu hamlenin kaçınılmaz olduğunu söyleyebilir. Yine de bu, \"Avrupa'nın sömürgeci derebeyleri\" ve komünistlerin dizginsiz kavrayışına ve onların Dünya Devrimi'ne karşı çıkanlar arasında büyük bir endişe nedeni olarak görülüyor."
 news.239.e:0 "Batmak üzere olduğumuz gemiye daha fazla fare biniyor."
 news.239.t:0 "[AST.GetNameDefCap], [SOV.GetFactionName]'ne Katılıyor"
 news.24.a:0 "Savaş yaklaşıyor."
 news.24.d:0 "Bugün Reichstag önünde yaptığı hararetli bir konuşmada [GER.GetLeader], Polonya'yı ve Danzig ile Polonya Koridoru'nda yaşayan Almanlara yönelik muamelelerini kınadı. \n\nPolonya'daki Alman azınlıkların 'hayal edilebilecek en aşağılık şekilde zulüm gördüğünü' iddia eden [GER.GetLeader], hükümetinin pozisyonunu açıkça belirtti:\n'Danzig bir Alman şehriydi ve bir Alman şehridir! Koridor Alman'dı ve Alman'dır! Alman Halkı olmasaydı, bu doğu bölgeleri hala barbarlığın derinliklerinde olurdu.'"
 news.24.t:0 "Polonya Sorunu"
 news.240.a:0 "Bu sürpriz oldu."
 news.240.b:0 "Hayatta kalmak için ne gerekiyorsa yapılır."
 news.240.c:0 "[AST.GetNameDefCap] Pasifik'e göz kulak oluyor."
 news.240.d:0 "[AST.GetAdjective] ve [HOL.GetAdjective] hükümeti bugün, Güneydoğu Asya'daki [HOL.GetAdjective] sömürge varlıklarının [AST.GetAdjective] silahlı kuvvetlerinin koruması altına alınmasını sağlayacak bir \"Ortak İşbirliği ve Savunma Paktı\" ilan etti. Anlaşma, \"Avrupa'daki uzak ve zorlu durum\" nedeniyle anlaşmanın tam sömürge yönetimini içereceğini açıklayan Endonezya'nın Hollandalı valisi ve [AST.GetLeader] tarafından imzalandı.\n\n[HOL.GetAdjective] hükümeti anlaşma hakkında herhangi bir açıklama yayınlamadı."
 news.240.t:0 "Jayapura Antlaşması"
 news.241.a:0 "Pasifik'te işler değişiyor."
 news.241.b:0 "Başka seçeneğimiz yoktu, o yüzden... devrim için."
 news.241.c:0 "Haydi 'devrim için!' dediğinizi duyayım."
 news.241.d:0 "Avustralya'da sosyalist bir işçi devletinin kurulmasının ardından, [AST.GetAdjective] hükümet artık bölge üzerinde nüfuzunu kullanmaya çalışıyor. [NZL.GetNameDef], [AST.GetNameDef]'deki ezilen çiftçilerin ve fabrika işçilerinin çağrılarına atıfta bulunarak, [NZL.GetAdjective] hükümetine Güney Pasifik'teki bir \"Halk Birliği\"ne katılması için baskı yapıyor.\n\nKendisini kuşatılmış görerek ve [ENG.GetFactionName]'den zamanında yardım alma umudunu kaybetmiş olarak, [NZL.GetNameDef]taleplere boyun eğdi. [AST.GetLeader] \"tüm insanların eşitliğinin bir uzantısı olarak tüm eyaletlerin eşitliğini\" ilan ederken, kararları hangi eyaletin verdiği konusunda çok az şüphe var."
 news.241.t:0 "[NZL.GetNameDefCap], [AST.GetAdjective] Etkisine Boyun Eğiyor"
 news.242.a:0 "Bu, Güneydoğu Asya'daki güç dengesini değiştiriyor."
 news.242.b:0 "Umarım [AST.GetNameDef] bunu mahvetmez."
 news.242.c:0 "Mükemmel! Her şey plana göre."
 news.242.d:0 "\n[ENG.GetNameDef] askeri doktrini uzun zamandır Güneydoğu Asya'da savunma sorunuyla mücadele ediyordu. Şimdi, bölgedeki düşmanca askeri faaliyetlere karşı koymak için [AST.GetNameDef]'in Singapur ve Borneo'nun savunma sorumluluğunu üstlenmesiyle sorunlarının sona erdiğini umuyorlar.\n\nBu güç devri, en azından şimdilik, [AST.GetNameDef]'in kıtasını denizaşırı saldırılardan korumak için gerekli her türlü önlemi almasına izin vermek amacıyla sömürge bölgelerinin sivil yönetimini de içeriyor. Bu hamlenin [ENG.GetNameDef], [AST.GetNameDef] ve [MAL.GetNameDef] için siyasi sonuçları henüz belirsiz."
 news.242.t:0 "[AST.GetNameDefCap] Güneydoğu Asya Sömürgelerinin Kontrolünü Üstleniyor"
 news.243.a:0 "En hafif tabirle rahatsız edici."
 news.243.b:0 "[Root.GetNameDefCap], yolumuza çıkmayacak herkesle işbirliğini memnuniyetle karşılar."
 news.243.c:0 "Bu, en azından şimdilik harika bir ortaklık."
 news.243.d:0 "[AST.GetNameDef] ve [JAP.GetNameDef]'nin Doğu Asya ve Pasifik'teki son kazanımları nedeniyle birçok gözlemci, gelişen iki imparatorluğun çatışmaya girmesinin yalnızca bir zaman meselesi olmasını bekliyordu. Ancak ülkeler bunun yerine kısa sürede \"Pasifik Bariyeri\" olarak adlandırılan alanda bir işbirliği anlaşmasına vardılar.\nAntlaşma her iki ülke tarafından da yayınlanmadı, dolayısıyla anlaşmalarının pek çok yönü bilinmiyor. Kesin olan şey şu ki, her iki taraf da \"ilgili bölgelerimizdeki açgözlü yabancıların ilerlemelerine karşı koymak\" için birbirlerine askeri destek sözü vermiş. \n\n[JAP.GetNameDef] ve [AST.GetNameDef] tarafından öngörülen dünya düzeninin neye benzediğini söylemek için henüz çok erken, ancak [AST.GetFactionName]'nin şu anda ABD'deki baskın güç olduğuna şüphe yok. Pasifik."
 news.243.t:0 "[AST.GetNameDefCap] ve [JAP.GetNameDef] İttifak Duyurdu"
 news.244.a:0 "Egemenlik için bir hamle yapıyorlar."
 news.244.b:0 "Kendi arka bahçemiz Avrupalılar tarafından yönetilmeyecek!"
 news.244.d:0 "Pek az gözlemciyi şaşırtan bir hamleyle, [AST.GetNameDef] kendi bağımsız antlaşma örgütünü duyurdu. [AST.GetLeader], [AST.GetNameDef]'in Güneydoğu Asya-Pasifik bölgesinde ve ötesinde istikrarı korumak ve gerekirse [AST.GetAdjective] devletine ve diğerlerine yönelik saldırganlığa karşı koymak amacıyla müttefikler arayacağını duyurdu.\n\nİngiliz Milletler Topluluğu bağlarından son zamanlardaki uzaklaşmalarıyla birlikte, [AST.GetNameDef]'in kaderinin tek efendisi olmaya çalışırken bu doğal bir sonraki adım gibi görünüyor."
 news.244.t:0 "[AST.GetNameDefCap] Etki Alanı Kuruyor"
 news.245.a:0 "Büyüleyici bir hamle..."
 news.245.b:0 "Bu, Pasifik'te baskın bir güç olarak yerimizi garanti edecek."
 news.245.c:0 "Birlikte dünyanın yarısında istikrarı koruyacağız."
 news.245.d:0 "\nPasifik'in artan stratejik öneminden endişe duyan [AST.GetNameDef] ve [USA.GetNameDef], Pasifik işbirliği anlaşması imzaladı. Her ne kadar bölgenin siyasi istikrarını ve dolayısıyla pasifik ötesi nakliyeyi korumayı amaçlasa da, anlaşma aynı zamanda askeri savunma için beklenmedik durumlar da içeriyor ve iki ülkenin gerçek toprak iddialarının çok ötesinde yetki kullanmasına olanak tanıyor.\n\nBöylesine geniş bir alan şu anda Avustralya-Amerikan \"koruması\" altındayken, bu beklenmedik durumların teste tabi tutulması kesinlikle an meselesi."
 news.245.t:0 "[USA.GetNameDefCap], [AST.GetAdjective] Savunma Girişimine Katılıyor"
 news.246.a:0 "Amerika kıtasına mı, yoksa ötesine mi bakacaklar?"
 news.246.b:0 "Toprakta kardeş, silahta kardeş!"
 news.246.c:0 "Artık evde bir tehdit olamaz."
 news.246.d:0 "Bir süredir Ortak Savunma Kurulu aracılığıyla işbirliği yapan [USA.GetNameDef] ve [CAN.GetNameDef] arasında yeni bir siyasi ortaklık gelişti. [CAN.GetFactionName] olarak adlandırılan program, tüm savunma ve askeri harekat konuları da dahil olmak üzere tüm dış ilişkilerde Kuzey Amerika çıkarlarını ilerletmeyi amaçlıyor.\n\n[CAN.GetNameDef]'in sömürge sonrası kimliğini hala keşfetmesi ve [USA.GetAdjective] politikacılarının izolasyonist ve müdahaleci politikalar üzerinde fiilen birbirleriyle savaşmasıyla, yeni kurulan ittifak her iki ülkeye de şiddetle ihtiyaç duydukları dış politika yönünü sunabilir."
 news.246.t:0 "[USA.GetNameDefCap] ve [CAN.GetNameDef] İttifakı Resmileştiriyor"
 news.247.a:0 "Şok edici bir gelişme!"
 news.247.b:0 "Avrupa'daki müttefiklerimize yardım edeceğiz!"
 news.247.c:0 "Kardeş halklar birlikte duruyor!"
 news.247.d:0 "Hızlı görüşmelerin ardından [CAN.GetNameDef], [GER.GetFactionName]'nin imzacı üyesi olduklarını duyurdu. [CAN.GetAdjective] hükümeti kendisini \"[GER.GetAdjective] halkının gururlu savunucusu\" ilan etti, tıpkı [GER.GetNameDef]'nin [CAN.GetAdjective]'nin savunucusu olacağı gibi.\"\n\n[CAN.GetNameDef]'nin anlaşmaya girişinin ayrıntıları ise bilinmiyor, kısa sürede [GER.GetNameDef]'nin düşmanlarına karşı düşmanlıkların başlatılması muhtemel görünüyor. Bu pekala savaş çabalarında belirleyici bir an olabilir."
 news.247.e:0 "Lanet olası dönek [CAN.GetAdjective]ler!"
 news.247.t:0 "[CAN.GetNameDefCap], [GER.GetAdjective] Liderliğindeki İttifaka Katılıyor!"
 news.248.a:0 "[ENG.GetNameDefCap]'in artık Kuzey Amerika'da bir dayanağı yok..."
 news.248.b:0 "Her şey olması gerektiği gibi."
 news.248.c:0 "Alın o geri kalmış kayalıkları!"
 news.248.d:0 "\n[CAN.GetNameDef]'den gelen artan diplomatik baskının ardından [ENG.GetNameDef], Labrador ve Newfoundland bölgelerini [CAN.GetAdjective] eyaletine devretti. Uzun zamandır [CAN.GetAdjective] politikacılarının hedefi \"tüm meşru [CAN.GetAdjective] bölgelerini birleştirmek\" olmuştur ve bu hedef artık gerçekleşmeye bir adım daha yaklaşmıştır.\n\nElbette, \"haklı [CAN.GetAdjective]\" bölgesini neyin oluşturduğuna ilişkin cevaplanmamış soru hala devam etmektedir. Artık hem [ENG.GetNameDef] hem de tüm Kuzey Amerika kıtası tek gözü açık uyuyacak."
 news.248.t:0 "[ENG.GetNameDefCap] Kuzeydoğu Topraklarını Bırakıyor"
 news.249.a:0 "Bunu daha önce de gördük; sonu ancak gözyaşı olabilir."
 news.249.b:0 "Kuzeyin ordusu hazır olacak."
 news.249.c:0 "Güneyin ordusu hazır olacak."
 news.249.d:0 "[USA.GetAdjective] politikacıları bu sabah endişe verici bir haberle uyandılar; [CAN.GetNameDef] ve [MEX.GetNameDef], \"her iki ülkenin de devam eden egemenliğine yönelik acil tehditlere karşı koyma ve bu tehditleri kontrol altına almaya\" odaklanan yeni bir savunma anlaşması duyurdular. İnce örtülü tehdit, [USA.GetNameDef]'nin Amerika kıtasındaki ve muhtemelen ötesindeki askeri çabalarını engelleme niyetini gizlemek için çok az şey yapıyor.\n\nSiyasi yorumcular, durumu Avrupa'nın Büyük Savaş öncesindeki durumuyla karşılaştırıyor; iki tarafın da kaybedecek çok şeyi var ve gerilimi azaltmanın hiçbir yolu yok. Sorun, kimin kime daha büyük tehdit oluşturduğundan çok, önleyici saldırıyı ilk başlatacak tarafın hangi taraf olacağı gibi görünüyor."
 news.249.e:0 "Bu hamleye hızla karşı koymanın bir yolunu bulmalıyız."
 news.249.t:0 "[CAN.GetNameDefCap] ve [MEX.GetNameDef] Birleşiyor!"
 news.25.a:0 "Endişe verici."
 news.25.b:0 "Orası Alman toprağıdır."
 news.25.c:0 "Sınır savunmalarımıza dikkat etmeliyiz."
 news.25.d:0 "Almanya, Versay Antlaşması'nı açıkça ihlal ederek Fransız sınırına yakın Renanya topraklarına asker konuşlandırdı. Yerel halk Alman askerlerini alkışlarla karşılarken, Fransa ve İngiltere'den gelen diplomatik tepkiler şimdiye kadar sessiz kaldı.\n\nİngiltere'deki bir siyasi yorumcu, 'Bu, Almanların kendi arka bahçelerinde yürümesinden başka bir şey değil' dedi."
 news.25.e:0 "Kesinlikle üzerinde durulacak bir şey değil."
 news.25.t:0 "Renanya'nın Yeniden Askerileştirilmesi"
 news.250.a:0 "Meksika'yı mahvedebilecek endişe verici bir çatışma."
 news.250.b:0 "Şimdi sadece milliyetçilerin iktidarı ele geçirmesini sağlamamız gerekiyor."
 news.250.c:0 "Ülkemiz için ağır bir bedel, ama ödenmesi gereken bir bedel."
 news.250.d:0 "Son birkaç yıldır [MEX.GetAdjective] siyasetindeki istikrarsızlık silahlı çatışmaya dönüştü! Sinarkist parti güçleri silaha sarıldı ve birkaç büyük [MEX.GetAdjective] şehrinin sokaklarında çatışmalar patlak verdi!\n\nHükümetin herhangi bir ayaklanmaya karşı bariz bir üstünlüğü olduğu düşünülse de, milliyetçilere yabancı desteği olduğuna dair söylentiler yaygın. Ülkenin yakın komşuları nefeslerini tutarak izliyor. Bu çatışmanın Meksika'yı nereye götüreceğini zaman gösterecek."
 news.250.t:0 "[MEX.GetNameDef]'de İç Savaş!"
 news.251.a:0 "O zaman tek başlarına başa çıkabilirler."
 news.251.b:0 "[ENG.GetNameDefCap] her geçen gün zayıflıyor."
 news.251.c:0 "Neden tam da şimdi olmak zorunda?!"
 news.251.d:0 "\n\nWestminster ile müzakerelerin kesilmesinin ve benzeri görülmemiş 63 saatlik bir tartışmanın ardından, Kanada Parlamentosu Britanya Kuzey Amerika Yasası'nı yürürlükten kaldırarak bunun yerine Kanada Anayasası'nı İngiliz parlamentosu veya monarşisi tarafından dokunulmaz yasalarla güvence altına aldı.\nKendi başına bir İngiliz karşıtı hamle olmasa da, eski imparatorluğun İngiliz Milletler Topluluğu politikalarından bir uzaklaşmaya işaret ediyor.\n\nGelecekteki istikrarlarını sağlamak isteyen herhangi bir ülke için atılması doğal bir adım olsa da, zaten gergin olan küresel siyaset durumunu yatıştırmak için hiçbir şey yapmıyor."
 news.251.e:0 "Dikiş yerlerinden sökülen bir imparatorluk."
 news.251.f:0 "Denizden Denize, [CAN.GetNameDef] özgür olacak!"
 news.251.t:0 "[CAN.GetNameDefCap] Derhal Bağımsızlık İstiyor"
 news.252.a:0 "Dünyanın gidişatı bu yönde..."
 news.252.b:0 "Güç dengesini koruyan ağırlık biziz."
 news.252.c:0 "Bununla güç dengesi lehimize dönüyor!"
 news.252.d:0 "Kendilerini doğal müttefikler olarak gören [GER.GetNameDef] ve [CAN.GetNameDef] karşılıklı bir savunma paktı imzaladı. [CAN.GetAdjective] Başbakanı [CAN.GetLeader], [CAN.GetAdjective] ve [GER.GetAdjective] çıkarlarının doğal uyumunu alıntılayan bir konuşmada ittifakı duyurdu.\n\nAvrupa genelinde artan seferberlik ve [CAN.GetNameDef]'in İngiliz Milletler Topluluğu'ndan son zamanlardaki uzaklaşması göz önüne alındığında, tartışılan çıkarların türünü tahmin etmek zor değil.\nHem Avrupa'da hem de Amerika kıtasında eski güçler artan bir endişeyle izliyor."
 news.252.e:0 "Savaşa girersek endişelenmemiz gereken bir cephe daha."
 news.252.f:0 "Giderek güçleniyoruz!"
 news.252.t:0 "[CAN.GetNameDefCap], [GER.GetFactionName]'ne Katılıyor!"
 news.253.a:0 "[Root.GetFactionName], [AST.GetNameDef] olmadan idare etmek zorunda kalacak."
 news.253.b:0 "Bir imparatorluğun paramparça oluşunu izle..."
 news.253.c:0 "Daha fazla bağımsızlık aramak için TAM ŞİMDİ mi seçtiler?"
 news.253.d:0 "\nBu sabah yaptığı konuşmada Başbakan [AST.GetLeader], Avustralya hükümetinin bir Okyanus eyaleti olarak büyüme ve istikrara olan bağlılığını duyurdu. Bu, Avustralya halkının artık dış çatışmaların yükünü omuzlarında taşıyamayacağından, Britanya'nın Avrupa'sındaki kıyılardan daha yeni kıyılara bakmak anlamına geliyor. [AST.GetLeader], Kral'ın son parlamentonun açılışındaki konuşmasına doğrudan atıfta bulunarak, \"Bir Daha Asla Gelibolu!\" diyerek asıl noktayı vurguladı. \n\n Kalabalıkların coşkulu tezahüratları, Avustralya siyasetinde yeni bir dönemin başladığını gösteriyor. Nerede biteceği konusunda dünya ancak spekülasyon yapmaya başlayabilir."
 news.253.e:0 "Bunun Pasifik üzerinde büyük yansımaları olacak."
 news.253.f:0 "Kendi yolumuzu çiziyoruz!"
 news.253.t:0 "[AST.GetNameDefCap] İngiliz Milletler Topluluğu'ndan Uzaklaşıyor"
 news.254.a:0 "Duruma göz kulak olmalıyız."
 news.254.b:0 "Olması gerektiği gibi."
 news.254.c:0 "Bu bir ihanettir!"
 news.254.d:0 "[AST.GetNameDefCap], tam bağımsızlığını ilan ederek Güney Pasifik'teki etkisini kullanmaya başladı. Bunun bir parçası olarak [AST.GetAdjective] hükümeti, Okyanusya'daki tüm eski sömürge devletlerinin kendi otoriteleri altına alınmasını talep etti.\n\nDoğal olarak isteksiz olan baskı altındaki [ENG.GetAdjective] ve Yeni Zelandalı hükümetler başlangıçta diplomatik direniş gösterdi. Ancak, bölgede İmparatorluğun otoritesini yansıtacak bir üs olmadan -ki bu rolü daha önce Avustralya üstleniyordu- [AST.GetNameDef]'in güç destekli bir ültimatom sunması an meselesiydi.\nYeni Zelanda şimdi [AST.GetNameDef]'in en doğudaki eyaletidir."
 news.254.t:0 "[AST.GetNameDefCap] ve Yeni Zelanda \"Birleşik\""
 news.26.a:0 "İşte yine başlıyoruz!"
 news.26.b:0 "Almanya galip gelecek!"
 news.26.c:0 "Bir sonraki durak: Berlin!"
 news.26.d:0 "Versay Antlaşması'nın doğrudan bir ihlali olarak, Alman birlikleri Ren Nehri'ni geçti ve Fransız sınırına yakın Renanya topraklarına girdi.\n\nBüyük Savaş'ı sona erdiren barış antlaşmasının 'affedilemez bir ihlali' olarak nitelendiren hem Fransa hem de İngiltere, Almanya'ya silahlı bir müdahale hazırlığı için kuvvetlerini seferber etti. \n\nAvrupa'da bir kez daha savaş patlak verdi!"
 news.26.e:0 "Öyleyse halledelim."
 news.260.a:0 "İlginç."
 news.260.b:0 "Gerçekten de çok mantıklı."
 news.260.c:0 "Bu, Afrika'daki İmparatorluğun sonunun başlangıcı mı?"
 news.260.desc:0 "\nBugün resmi bir törenle [SAF.GetLeader], hükümetine Afrika'daki İngiliz bağımlı bölgeleri üzerinde kontrol sağlayacak anlaşmayı imzaladı. Bechuanaland, Rhodesia ve Kenya bölgeleri artık Pretoria'dan yönetilecek. \n\nAvam Kamarası önünde konuşan [ENG.GetLeader], bu hareketin Britanya'nın kıtadaki konumunu zayıflattığı iddiasını reddetti ve bunun yerine bunu \"bu alanların daha etkin bir şekilde yönetilmesine ve savunulmasına olanak sağlayacak çok mantıklı bir değişiklik\" olarak nitelendirdi."
 news.260.t:0 "[SAF.GetNameDefCap] Afrika Sömürgelerinin Sorumluluğunu Üstleniyor"
 news.261.a:0 "İlginç."
 news.261.b:0 "Ne aptalca bir düzenleme."
 news.261.c:0 "Görünüşe göre İngiliz Milletler Topluluğu'nu büyütmenin bir yolu da bu."
 news.261.desc:0 "İngiliz Parlamentosu, Afrika'daki İngiliz sömürgelerinin bazı kısımlarını temelden yeniden düzenleyecek bir önlemi kıl payı kabul etti. Yeni yasa, fiilen Rodezya ve Kenya devletlerinde iki yeni sömürge rejimi yaratıyor. Bu yeni devletler kendi işlerini yönetme konusunda belirli bir ölçüde özgürlüğe sahip olacaklar, ancak kendi savunmalarını sağlama sorumlulukları da olacak. \n\nKarara karşı çıkan bazı muhafazakarlar, bu kararın 'sömürgesizleştirme' adını verdikleri bir sürecin sadece ilk adımı olduğuna dair açıkça korkularını dile getirdiler. \n\n[ENG.GetLeader] yorum yapmak için hemen hazır bulunmadı."
 news.261.t:0 "[ENG.GetNameDefCap] Afrika Sömürgelerini Yeniden Düzenliyor"
 news.262.a:0 "Belki de destek göndermeyi düşünmeliyiz."
 news.262.b:0 "Bu uzun zamandır bekleniyordu."
 news.262.c:0 "Belki de en büyük tehditler sınırlarımızın içinde..."
 news.262.desc:0 "[SAF.GetName]'de uzun zamandır kaynayan gerilimler artık açık savaşa dönüştü. Faşist Milliyetçiler, demokratik İttihatçı hükümetin politikalarının [SAF.GetAdjective] yaşam tarzını tehdit ettiğini iddia ediyor. İttihatçıların [ENG.GetName]'ye verdikleri koşulsuz destekle Boer Savaşları'nın cesur savaşçılarını sırtından bıçakladığını söylüyorlar. \n\n[SAF.GetLeader] yönetimindeki Milliyetçi Geçici Hükümet, tüm gerçek vatanseverleri silah zoruyla Güney Afrika'ya özgürlüğün yeniden sağlanması için kendilerine katılmaya çağırdı. Pretoria'daki İttihatçı hükümet, Milliyetçileri \"isyancılar ve en kötü türden hainler\" olarak etiketledi. Askeri güçlerin her iki taraf için de eşit beyanda bulunması nedeniyle Güney Afrika'daki çatışmanın çözülmesi uzun zaman alabilir."
 news.262.t:0 "Güney Afrika İç Savaşı"
 news.263.a:0 "Hazırlanmakta olan bir devrim mi?"
 news.263.b:0 "Yorum yok."
 news.263.c:0 "Belki de en büyük tehditler sınırlarımızın içinde..."
 news.263.desc:0 "Birçoğu şiddete dönüşen bir monarşi karşıtı gösteri dalgası Güney Afrika'yı sardı. Binlerce protestocu sokağa döküldü, polis karakollarını ve diğer hükümet binalarını bastı. Kral portreleri yırtıldı, kesildi, yakıldı ve bir keresinde asitte eritildi. \n\nGözlemciler, polis ve ordunun ayaklanmayı kontrol altına almaya çalışmakta çok isteksiz olduğunu, bunun yerine fabrikaları ve köprüleri korumayı tercih ettiğini belirtti. Bu, ayaklanmaların hükümet için gerçekten bir sürpriz olup olmadığı sorusunu gündeme getirdi."
 news.263.t:0 "[SAF.GetNameDef]'de Kraliyet Karşıtı Ayaklanmalar"
 news.264.a:0 "Afrikalılar mı? Kendilerini yönetiyorlar!?"
 news.264.b:0 "Gerçek özgürlüğe giden yolculuğun ilk adımı."
 news.264.c:0 "Bakalım idealizmleri önlerindeki savaşlarda sürecek mi."
 news.264.d:0 "Sonuçta gerçek komünistler değiller."
 news.264.desc:0 "[SAF.GetFactionName]'nin kurucu üyeleri, yeni ittifaklarının kuruluşunu duyurmak için Pretoria'da toplandı. Avrupalı gözlemciler, mevcut meşruiyete sahip tek hükümetin [SAF.GetNameDef]'in kendi hükümeti olduğunu, [SAF.GetLeader]'in kendi kendini atamış sürgündeki hükümetlerden ve diğer devrimci gruplardan oluşan rengarenk bir meclise başkanlık ettiğini çabucak fark etti.\n\nMevcut taraflar ortak bir bildiri yayınlayarak, Avrupa İmparatorluk Güçlerini Afrika'da tuttukları tüm toprakları derhal hak sahiplerine bırakmaya çağırdı, sömürgecilik uygulamasını kınadı ve ezilen Afrika halklarına -ne pahasına olursa olsun- özgürlük getirmeye yemin etti."
 news.264.t:0 "Afrika Halkları Birliği"
 news.265.a:0 "Sudaki kan kokusunu alan köpekbalıkları işte."
 news.265.b:0 "Bakalım Fransızlar makul davranacak mı."
 news.265.c:0 "Fransızlar bitti."
 news.265.d:0 "Komünizm için bir başka kansız zafer."
 news.265.desc:0 "Fransa'nın anavatanında yaşadığı çarpıcı yenilginin ardından, sömürge imparatorluğunun meşruiyeti sorgulanır hale geldi. [SOV.GetNameDef] ve [SAF.GetNameDef] hükümetleri, Fransa'nın Madagaskar'da düzeni sağlamak için artık güvenilemeyeceğini belirten ortak bir açıklama yayınlayarak adanın [SAF.GetNameDef]'e devredilmesini talep etti. \n\nÖzgür Fransız hükümeti konuyu görüşmek üzere toplandı. Savunma uzmanları, tükenmiş Fransız kuvvetlerinin savaşa girilmesi durumunda adayı savunmasının pek olası olmadığını düşünüyor."
 news.265.t:0 "[SAF.GetAdjective]'nin Fransa Üzerindeki Baskısı"
 news.27.d:0 "Versay Antlaşması'nın doğrudan bir ihlali olarak, Alman birlikleri Ren Nehri'ni geçti ve Fransız sınırına yakın Renanya topraklarına yürüdü.\n\nİngiltere'den gelen tepki şimdiye kadar sessiz kalsa da, Fransızlar Almanya'ya silahlı bir müdahale hazırlığı için kuvvetlerini seferber ediyor. \n\nAvrupa'da bir kez daha savaş patlak verdi!"
 news.270.a:0 "Tank dediğin böyle olur!"
 news.270.b:0 "Bu şeye NE dediler?"
 news.270.desc:0 "Başkentin ana caddesinde gümbürdeyen Yeni Zelanda Savunma Kuvvetleri'nin yeni Bob Semple tankı, [NZL.GetAdjective] halkının yaratıcılığının ve mücadele ruhunun gerçek bir kanıtı olarak duruyor. Altı makineli tüfekle donatılmış ve neredeyse kesinlikle kurşun geçirmez demir levhalarla zırhlanmış olan bu araç, herhangi bir işgalcinin aşması gereken muhtemelen en büyük engel olacaktır. \n\nBazı sözde uzmanlar, aracın sönük performansını ve zayıf silahlanmasını üretilmemesi için neden olarak gösteriyor, ancak Başbakan [NZL.GetLeader]'in aracın resmi kabul töreninde söylediği gibi, krallığın zamanında savunulması o kadar önemlidir ki mükemmel teçhizat ne beklenebilir ne de talep edilebilir."
 news.270.t:0 "[NZL.GetAdjective] Zırhlılarının Doğuşu"
 news.271.a:0 "Dünya tanklarımızın görüntüsüyle titriyor!"
 news.271.b:0 "Dünya titriyor... kahkahadan."
 news.271.desc:0 "Bob Semple tankının baş döndürücü başarısından sonra, [NZL.GetName] Savunma Kuvvetlerinin yüksek komutanlığı, yükseltilmiş bir versiyonun üretilmesini talep etti. 15 feet'ten uzun boyu ve 120 tondan az olmayan ağırlığıyla yeni araç, kelimenin her anlamıyla hayranlık uyandırıyor. İkiz 17 librelik tanksavar silahlarından oluşan silahı, herhangi bir düşmanın işini kısa sürede halledecek, aslında kurşun geçirmez olduğundan emin olmak için kapsamlı bir şekilde test edilen ağır zırhı ise savaşın en yoğun anlarına korkusuzca ilerlemesine olanak tanıyacak. \n\nAçıklama töreninde bir gözlemci onu \"şimdiye kadar üretilmiş en dikkat çekici tank\" olarak nitelendirirken, bir diğeri onu \"benzersiz\" olarak nitelendirdi. \nSeri üretimin ay içinde başlaması bekleniyor."
 news.271.t:0 "Koca Bob Sahneye Çıkıyor"
 news.272.a:0 "Korkunç."
 news.272.b:0 "Berbat."
 news.272.c:0 "Bu konuda yapılabilecek bir şey yok."
 news.272.desc:0 "Doğal afetler, beceriksiz yönetim ve savaşın yıkımları Hindistan'da yaygın bir kıtlık yaratmak için bir araya geldi.\n\nBölgenin büyük bir kısmını harap eden ve pirinç hasadının neredeyse tamamını yok eden bir siklonun ardından, sömürge yöneticileri sorunu çözmekte yavaş -bazıları göze batacak kadar yavaş diyebilir- davrandılar. Hindistan'ın diğer bölgelerinde gıda fazlası olmasına rağmen, düşmanın eline geçebileceği korkusuyla yardım sevkiyatı yapılmadı.\n\nBölgenin büyük bir kısmı harap oldu ve can kaybı ile üretim kaybının maliyeti henüz tahmin bile edilemiyor."
 news.272.t:0 "Bengal Kıtlığı Başladı"
 news.273.a:0 "En azından bitti."
 news.273.b:0 "Nihayet."
 news.273.desc:0 "Aylarca süren görece eylemsizliğin ardından, sömürge hükümeti ve Hint ordusu nihayet harekete geçmeye karar verdi. Acil gıda malzemelerinin dağıtımı etkilenen bölgelere ulaşmaya başladı, yeni pirinç hasadı ise beklentilerin üzerinde gerçekleşti. \n\nAncak etkilenen bölgelerdeki gıda fiyatları yüksek kalmaya devam ediyor ve kıtlığın uzun vadeli etkileri henüz tahmin edilemiyor."
 news.273.t:0 "Bengal Kıtlığı Sona Erdi"
 news.28.a:0 "İlginç bir gelişme."
 news.28.b:0 "Bunun bedelini ödeyecekler!"
 news.28.c:0 "En azından Hitler gitti."
 news.28.d:0 "Savaşa karşı çıkan bir grup Wehrmacht subayı Berlin'de bir darbe başlattı. Kimliği belirsiz silahlı bir grup Reichskanzlei'ye baskın düzenledi ve korumalarıyla girdiği çatışmanın ardından Alman Führer'ini başarıyla öldürdü.\nHayatta kalan komplocular Gestapo tarafından tutuklandı ve bu sabah Heinrich Himmler, Alman Reich'in yeni Führer'i olarak yemin etti. \n\nReichstag önünde yaptığı bir konuşmada Himmler, İngiltere ve Fransa'yı Hitler'in suikastını planlamakla suçladı ve Almanya'nın her iki ulusun da tamamen yok edilmesine yönelik kesin bağlılığını belirtti."
 news.28.t:0 "Hitler Suikasta Uğradı!"
 news.280.a:0 "Harika."
 news.280.b:0 "Bu Britanya İmparatorluğu'nun sonu mu?"
 news.280.c:0 "Değerli bir müttefik."
 news.280.d:0 "En parlak saatimiz değildi."
 news.280.desc:0 "[GER.GetAdjective] büyükelçisi ile [ENG.GetAdjective] dışişleri bakanı arasında gergin bir görüşmenin ardından, [ENG.GetNameDef] hükümeti bugün [RAJ.GetNameDef]'in bundan böyle kendi politikalarını belirlemesine izin verileceğini duyurdu. İngilizlerin altkıta üzerindeki yüzyıllardır süren yönetimi, memurların eve çağrılması ve sömürge yönetiminin yerli Hintlilere devredilmesiyle şaşırtıcı derecede hızlı bir şekilde sona erdi.\n\nYeni Hint liderliğinin ilk eylemlerinden biri, [GER.GetNameDef] ile geniş kapsamlı bir işbirliği antlaşması duyurmak oldu. Hint hükümeti, bunun Alman desteği için ödedikleri bedel olduğu yönündeki iddialar hakkında yorum yapmayı reddetti."
 news.280.t:0 "Hindistan İç Yönetim Kazanıyor"
 news.281.a:0 "Harika."
 news.281.b:0 "Bu Britanya İmparatorluğu'nun sonu mu?"
 news.281.c:0 "Değerli bir müttefik."
 news.281.d:0 "En parlak saatimiz değildi."
 news.281.desc:0 "Ortak bir açıklamada, gözle görülür şekilde sarsılmış olan [ENG.GetAdjective] Dışişleri Bakanı ile [SOV.GetAdjective] büyükelçisi, Hindistan'a derhal kendi işleri üzerinde tam egemenlik verileceğini duyurdu. [SOV.GetNameDef]'in [ENG.GetAdjective] politikasındaki bu ani değişikliği sağlamada ne gibi bir rol oynadığı tam olarak net değil, ancak önemli görünüyor.\n\nYeni Hint liderliğinin ilk eylemlerinden biri, [SOV.GetNameDef] ile daha yakın bir işbirliği duyurmak oldu; bu da [SOV.GetNameDef]'in kendi adlarına müdahale ettiği yönündeki söylentilere ek bir ağırlık kattı."
 news.281.t:0 "Hindistan İç Yönetim Kazanıyor"
 news.282.a:0 "Gelecek belirsizliğini koruyor."
 news.282.b:0 "Özgürlüğe yönelik bir başka başarısız girişim daha."
 news.282.desc:0 "Hindistan'ın bağımsızlık çağrıları son zamanlarda yoğunlaştı. Radikal Hindistan'ı Terk Et Hareketi'nin [ENG.GetNameDef]'in ülkeyi bir an önce terk etmesi çağrısında bulunmasıyla işler şimdi doruğa ulaştı. Ancak [ENG.GetAdjective] yetkilileri hızla tepki verdi ve harekete baskın düzenleyerek Hindistan genelindeki evlere şafak baskınlarında birkaç lideri tutukladı. \n\nÖzel Şube tarafından hazırlanan raporlar, birçok sempatizanın hala serbest olduğunu gösteriyor ve Kamu Hizmeti'ndeki birçok kişi, hareketin daha aşırılık yanlısı unsurlarının şiddete bile başvurabileceğinden korktuğunu ifade etti."
 news.282.t:0 "Hindistan'ı Terk Et Hareketi"
 news.283.a:0 "Bizi özgürlüğe götürecekler."
 news.283.b:0 "Oylar gerçekten bir şeyi değiştirir mi?"
 news.283.desc:0 "\nSon yerel seçimlerde, Hint Ulusal Kongresi, yerel yönetime yavaş ve düzenli bir geçiş ve gelecekte dominyon statüsü platformu için ezici bir çoğunluk elde etti. \n\nGörünüşe göre Hintliler, Britanya ile tam bir kopuş ve mümkün olan en kısa sürede mutlak iç yönetim savunan Gandhi'nin daha radikal politikalarını reddetti."
 news.283.t:0 "Hint Ulusal Kongresi Eyalet Seçimlerinde Zafer Kazandı"
 news.284.a:0 "Özgürlük elinizin altında."
 news.284.b:0 "İngilizler buna asla müsaade etmeyecek."
 news.284.desc:0 "\nİngiliz Kamu Görevlileri bu sabah son eyalet seçimlerinin sonuçları geldiğinde kaba bir şokla uyandı. Artık Hintlilerin büyük bir çoğunluğunun oylarını Swaraj yanlısı adaylara verdiği açık. Hindistan genelindeki eyaletlerde, bu sınırlı miktardaki yerel yönetimi mümkün olan en kısa sürede tam özyönetime dönüştürme çağrıları şimdiden başladı. \n\nBir [ENG.GetAdjective] hükümet sözcüsü, şimdi bu tür önlemleri tartışma zamanı olmadığını ve Hintlilere daha fazla yetki devrinin söz konusu olmadığını vurguladı."
 news.284.t:0 "Swaraj Hareketi Eyalet Seçimlerinde Zemin Kazanıyor"
 news.285.a:0 "Belki de tek yol buydu."
 news.285.b:0 "Özgürlük!"
 news.285.c:0 "Bakalım barış sürecek mi."
 news.285.desc:0 "İki Ulus Teorisi uyarınca, Müslüman azınlığa, Müslümanların nüfusun çoğunluğunu oluşturduğu bölgelerde egemen bir vatan verildi. Başlangıçta Pencap, Afgan, Keşmir, Sindh ve Beluç halklarının birleşimini göstermek için Pakstan olarak adlandırılan ülke, telaffuzu kolaylaştırmak için o zamandan beri Pakistan olarak yeniden adlandırıldı.\n\nAncak, yeni özgürleşen Hindistan ile Pakistan arasında gerginlikler devam ediyor, zira sınır bölgelerinin bazı kısımları her iki yeni ülke tarafından da talep ediliyor. Hatta bazı gözlemciler altkıtada yeniden bir savaş çıkabileceği uyarısında bulunuyor."
 news.285.t:0 "Pakistan özgür"
 news.286.a:0 "Bu noktada sadece bir formalite."
 news.286.b:0 "Özgürlük!"
 news.286.c:0 "Avustralya İngiliz Milletler Topluluğu'ndan çıkıyor."
 news.286.desc:0 "\nÇekişmeli bir oylamanın ardından, [AST.GetAdjective] parlamentosundaki küçük bir çoğunluk ülkenin Britanya İmparatorluğu'ndan ayrılmasına karar verdi. İngiliz yasal yönetiminin son birkaç kalıntısı geçersiz ilan edildi. [AST.GetLeader] kararı zaten yasalaştırdı, böylece Genel Vali tarafından Kraliyet Onayı verilmesi yönündeki uzun süredir devam eden yasal geleneği atlayarak [AST.GetNameDef]'i tamamen egemen bir ulus haline getirdi.\n\nParlamento ayrıca, Anayasa'da İngilizlerin [AST.GetAdjective] işlerine her türlü müdahalesinin izlerini silmek için yapılacak değişiklikleri tartışacak ve tavsiyede bulunacak bir Anayasa Komitesi kurmak için oy kullandı."
 news.286.t:0 "Avustralya İngiltere ile Bağlarını Koparıyor"
 news.287.a:0 "Muhtemel bir hikaye!"
 news.287.b:0 "Zamanla geri kalanını da alacağız..."
 news.287.c:0 "Faşistler ilerliyor - şimdilik."
 news.287.desc:0 "Alman birlikleri, Polonya hükümetinin çöküşünü izleyen kaostan Alman azınlıkları korumak amacıyla resmi olarak batı Polonya'yı işgal etti. \n\nSovyet kuvvetleri bu bölgelerden düzenli bir şekilde çekildi ve bu da Polonya'nın iki güç arasında fiilen paylaşılmasıyla sonuçlandı."
 news.287.t:0 "Almanya Batı Polonya'yı İşgal Ediyor"
 news.288.a:0 "Bir çaresizlik ittifakı."
 news.288.b:0 "Bu hiçbir şeyi değiştirmez!"
 news.288.c:0 "İstikrarsız bir ittifak."
 news.288.desc:0 "[CHI.GetLeader] ve [PRC.GetLeader] ortak bir duyuru yayınlayarak, Japon saldırısı karşısında farklılıklarını bir kenara bıraktıklarını ilan ettiler. Her iki taraf da Japonya'ya karşı savaş sürdüğü müddetçe birbirlerine karşı kesin bir saldırmazlık politikası izleyecek ve işgalciyi geri püskürtmek için ellerinden gelen her şeyi yapacaklarına yemin ettiler. Bir dizi küçük savaş ağası da desteklerini açıklayarak kuvvetlerini [CHI.GetLeader]'in emrine verdi.\n\nÇin İç Savaşı'nın uzun süredir düşman olan taraflarının gerçekten birlikte çalışıp çalışmayacağı henüz belli değil ve birçok uzman bunun Çin'in kaçınılmaz yenilgisini geciktirmekten biraz daha fazlasını yapacağına inanmıyor."
 news.288.t:0 "Çin Birleşik Cephesi Kuruluyor"
 news.289.a:0 "Birlikte daha güçlüyüz."
 news.289.b:0 "Sayılarda güç arıyorlar."
 news.289.c:0 "Bu onlara yaramayacak!"
 news.289.d:0 "\nBugün erken saatlerde, [alliance_inviter.GetNameDef] ve [alliance_applicant.GetNameDef] ortak bir açıklama yaparak ikincisinin artık [alliance_inviter.GetFactionName]'nin resmi üye statüsünü kazandığını duyurdu. Bu ortaklığın saldırı mı yoksa savunma amaçlı mı kullanılacağı henüz belli değil, ancak şüphesiz kapsamlı ortak askeri planlama zaten devam ediyor."
 news.289.e:0 "Savaş tırmanıyor..."
 news.289.f:0 "İttifakımız güçleniyor."
 news.289.t:0 "[alliance_applicant.GetNameDefCap], [alliance_inviter.GetFactionName]'ne Katılıyor"
 news.29.d:0 "Savaşa karşı çıkan bir grup Wehrmacht subayı Berlin'de bir darbe başlattı. Kimliği belirsiz silahlı bir grup Reichskanzlei'ye baskın düzenledi ve korumalarıyla girdiği çatışmanın ardından Alman Führer'ini başarıyla öldürdü.\nHayatta kalan komplocular Gestapo tarafından tutuklandı ve bu sabah Hermann Göring, Alman Reich'in yeni Führer'i olarak yemin etti. \n\nReichstag önünde yaptığı bir konuşmada Göring, İngiltere ve Fransa'yı Hitler'in suikastını planlamakla suçladı ve Almanya'nın her iki ulusun da tamamen yok edilmesine yönelik kesin bağlılığını belirtti."
 news.290.a:0 "Artık sadece ismen bir krallık değil."
 news.290.b:0 "Bu tehlikeli bir konuşma..."
 news.290.c:0 "Avusturya için yarış başladı!"
 news.290.desc:0 "Uygun bir kral arayışında olan Macaristan Krallığı, Otto von Habsburg'u kısa süre öncesine kadar ailesi tarafından yönetilen topraklara dönmeye davet etti. Büyük Savaş'ın sona ermesinden ve babasının imparatorluğunun dağılmasından bu yana Batı Avrupa'da sürgünde yaşayan Otto, teklifi kabul etmeyi seçti. Bugün, büyük bir şatafat ve kutlamayla, Budapeşte'deki Kraliyet Sarayı'nda düzenlenen görkemli bir törenle Macaristan Kralı olarak taç giydi.\n\nTaç giyme konuşmasında Kral Otto, Macar halkına sadakatleri ve bağlılıkları için teşekkür etti ve Habsburg topraklarının bir kez daha birleştirileceğine yemin ederek, bu kez Macaristan'ın baskın kurucu parça olacağına söz verdi."
 news.290.e:0 "İmparatorluk yeniden mi yükselecek?"
 news.290.t:0 "Otto Macar Tacını Giyiyor"
 news.291.a:0 "Kardeşlik bağlarımız unutulmadı."
 news.291.b:0 "Bunun yankıları olacaktır..."
 news.291.c:0 "İmparatorluğun güç boşluğu henüz doldurulabilir..."
 news.291.desc:0 "Macarların ısrarı üzerine Avusturya, Habsburg tacı altında iki ulusun olası yeniden birleşmesi konusunda bir referandum yaptı. Nihai sayım neredeyse tamamlandı, ancak yeniden birleşme kampının ezici bir zafer kazandığı şimdiden açık. Oylama sürecinde herhangi bir usulsüzlük bildirilmedi ve Avusturya hükümeti kendini Macar devletinin bölgesel bir hükümetine dönüşmekle yükümlü buldu.\n\nBu hamle Macar halkı tarafından büyük bir memnuniyetle karşılansa da, referandumun siyasi yansımaları muhtemelen Avrupa genelinde keskin bir şekilde hissedilecektir."
 news.291.t:0 "Avusturya Macaristan ile Birleşmek İçin Oy Kullanıyor"
 news.292.a:0 "Kardeşlik bağları ve birkaç kullanışlı rüşvet..."
 news.292.b:0 "Planımız buydu!"
 news.292.c:0 "İmparatorluğun güç boşluğu henüz doldurulabilir..."
 news.292.desc:0 "Macarların ısrarı üzerine Avusturya, Habsburg tacı altında iki ulusun olası yeniden birleşmesi konusunda bir referandum yaptı. Nihai sayım neredeyse tamamlandı, ancak yeniden birleşme kampının ezici bir zafer kazandığı şimdiden açık. Tutarsızlıklar, seçmen sahtekarlığı ve seçim hilesi olduğuna dair bol miktarda rapor var, ancak Avusturya yetkilileri bu iddiaları reddetti ve yönetimi Macar devletinin bölgesel bir hükümetine dönüştürmeye şimdiden başladı.\n\nBu hamle Macar halkı tarafından büyük bir memnuniyetle karşılansa da, referandumun siyasi yansımaları muhtemelen Avrupa genelinde keskin bir şekilde hissedilecektir."
 news.292.e:0 "Demokrasiye bir hakaret!"
 news.293.a:0 "Son derece talihsiz."
 news.293.b:0 "Bağımsızlığımız güvence altında!"
 news.293.c:0 "Mükemmel... Sıradaki biziz."
 news.293.desc:0 "Macarların ısrarı üzerine Avusturya, Habsburg tacı altında iki ulusun olası yeniden birleşmesi konusunda bir referandum yaptı. Nihai sayım neredeyse tamamlandı, ancak yeniden birleşme kampının zaferi artık ulaşılamaz durumda. Bu nedenle Avusturya hükümeti bir Avusturya-Macaristan birliğine katılmama kararı aldı.\n\nDemokrasi ve kendi kaderini tayin ruhuyla Macaristan sonucu kabul etti ve önerilerini daha fazla zorlamamaya karar verdi."
 news.293.e:0 "İmparatorluğun düşüşü kalıcıymış o zaman."
 news.293.t:0 "Avusturya Yeniden Birleşmeye Karşı Oy Kullanıyor"
 news.294.a:0 "Bir İmparatorluk için birkaç ölüm nedir ki?"
 news.294.b:0 "Viyana'yı son adamımıza kadar savunacağız!"
 news.294.c:0 "Bu tüm planlarımızı mahvediyor..."
 news.294.desc:0 "Macarların ısrarı üzerine Avusturya, Habsburg tacı altında iki ulusun olası yeniden birleşmesi konusunda bir referandum yaptı. Nihai sayım neredeyse tamamlandı, ancak yeniden birleşme kampının zaferi artık ulaşılamaz durumda. Bu nedenle Avusturya hükümeti bir Avusturya-Macaristan birliğine katılmama kararı aldı.\n\nAncak Macaristan, Avusturya hükümetini yeniden birleşmeye karşı seçimleri hileyle değiştirmekle suçladı. Avusturya halkının Macar kardeşleriyle yeniden birleşme arzusunu korumak için güç kullanmaktan çekinmeyeceklerini belirttiler. Her iki taraf da şimdi seferber olmaya başladı ve savaş kaçınılmaz görünüyor."
 news.294.e:0 "Umarım çatışma yayılmaz."
 news.294.t:0 "Avusturya Yeniden Birleşmeye Karşı Oy Kullanıyor"
 news.295.a:0 "Küllerinden doğan bir anka kuşu gibi."
 news.295.b:0 "Bu durumu büyük ölçüde değiştiriyor..."
 news.295.c:0 "Dost mu olacaklar düşman mı?"
 news.295.desc:0 "Avusturya ve Macaristan'ın yeniden birleşmesi tamamlandıktan sonra, Macar hükümeti Budapeşte'de uluslararası basını topladı ve Avusturya-Macaristan İmparatorluğu'nun restore edildiğini duyurdu.\n\nKral Otto, Avusturya İmparatoru olarak haklı unvanını aldı ve İmparatorluk henüz eski halinin bir gölgesi olsa da, tüm Habsburg toprakları yeniden birleşene kadar dinlenmeyeceğine dair yeminini yineledi. Komşuları şüphesiz Budapeşte'deki gelişmeleri şüpheyle izliyor."
 news.295.e:0 "Sınırlarımızı güçlendirsek iyi olur..."
 news.295.t:0 "Avusturya-Macaristan'ın Restorasyonu"
 news.296.b:0 "Bir zayıf daha yükseliyor."
 news.296.c:0 "Meşaleyi taşıyacak bir başkası."
 news.296.desc:0 "Ulusları için bir Kral arayan Macarlar, uzun müzakereler ve hazırlıkların ardından bu hafta başlarında İsveç Prensi Wilhelm, Södermanland Dükü'nü resmen davet etti. Bugün, büyük bir şatafat ve kutlamayla, Budapeşte'deki Kraliyet Sarayı'nda düzenlenen görkemli bir törenle Macaristan Kralı olarak taç giydi.\n\nYeni Kral'ın halkının refahını kalpten önemsediği ve demokratik haklarını güçlü bir şekilde desteklediği söyleniyor. Ayrıca, düşmanlık yerine Macaristan'ın komşularıyla diyalogu savunuyor. Yeni Kral böylece bölgedeki gerilimlerin azaltılmasına hoş bir yardım sağlayabilir."
 news.296.t:0 "Wilhelm Macar Tacını Giyiyor"
 news.297.b:0 "Derinden rahatsız edici bir gelişme..."
 news.297.c:0 "Yeni bir potansiyel müttefik!"
 news.297.desc:0 "Ulusları için bir Kral arayan Macarlar, uzun müzakereler ve hazırlıkların ardından bu hafta başlarında Alman Friedrich Franz, Mecklenburg-Schwerin Büyük Dükü'nü resmen davet etti. Bugün, büyük bir şatafat ve kutlamayla, Budapeşte'deki Kraliyet Sarayı'nda düzenlenen görkemli bir törenle Macaristan Kralı olarak taç giydi.\n\n1931'den beri SS üyesi olan yeni Kral'ın ideolojik eğilimleri iyi biliniyor ve şimdiden 'ne pahasına olursa olsun Macaristan'a hak ettiği büyüklüğü getireceğini' ilan etti. Kral'ın 'geçmişte bize yapılan adaletsizlikleri telafi etme' sözüyle birlikte, bu taç giyme töreninin bölgedeki gerilimlerin azalmasıyla sonuçlanması pek olası değil."
 news.297.t:0 "Friedrich Franz Macar Tacını Giyiyor"
 news.298.a:0 "Aşağılanma sona erdi, ama unutulmadı!"
 news.298.b:0 "Dünya düzeniyle oynuyorlar..."
 news.298.c:0 "Versay boyunduruğundan kurtuldular."
 news.298.desc:0 "Halka açık bir bildiride, [HUN.GetLeader], Büyük Savaş'tan sonra Müttefik güçler tarafından dayatılan antlaşmayı tanımadığını ilan etti. 1920'de [HUN.GetAdjective]ler tarafından protesto altında imzalanan bu antlaşma, ülkenin büyüklüğünü büyük ölçüde azaltmış ve ordusunun gücünü sınırlamıştı.\n\nKonuşmasında [HUN.GetLeader], Macaristan'ın yakında yirmi yıl önce onlardan alınan topraklardaki iddialarını yeniden teyit etmeye yönelebileceğini ima etti."
 news.298.t:0 "[HUN.GetName] Trianon Antlaşması'nı Tanımıyor"
 news.299.a:0 "Dünya gücümüzü görecek."
 news.299.b:0 "Kendilerini biraz fazla beğenmişler."
 news.299.desc:0 "Trianon Antlaşması'nda onlardan alınan toprakları geri kazandıktan sonra, [From.GetLeader] dün akşam ulusun bundan böyle Büyük Macaristan olarak bilineceğini ilan etti. Bunun, Büyük Macaristan'ın dünya gözündeki prestijini artırması ve sınırlarının kapsamını daha iyi tanımlaması umuluyor."
 news.299.t:0 "Macaristan Büyük Macaristan'ı İlan Ediyor"
 news.30.a:0 "Ya başarılı olsalardı..."
 news.30.c:0 "Bu hiçbir şeyi değiştirmez."
 news.30.d:0 "Savaşa karşı çıkan bir grup Wehrmacht subayı Berlin'de Hitler'e karşı bir darbe başlattı. Kimliği belirsiz silahlı bir grup Reichskanzlei'ye baskın düzenledi, ancak Führer'in SS korumaları tarafından başarıyla püskürtüldüler.\nGestapo ajanları, Ludwig Beck ve Wilhelm Canaris gibi üst düzey subayların da aralarında bulunduğu tüm komplocuları tutukladı. \n\nReichstag önünde yaptığı bir konuşmada Hitler, hayatına yönelik bu 'kalleşçe girişim' için Fransa ve İngiltere'den intikam alacağına yemin etti."
 news.30.e:0 "O herifi yakalayamadıklarına yazık!"
 news.30.t:0 "Hitler'e Yönelik Başarısız Suikast Girişimi"
 news.300.a:0 "Artık sinmeyeceğiz!"
 news.300.b:0 "Hızlı düşünmeliyiz..."
 news.300.c:0 "Umarım barışçıl bir şekilde çözerler."
 news.300.desc:0 "Trianon Antlaşması'nı daha da tersine çevirme çabasıyla, [HUN.GetNameDef], [ROM.GetNameDef]'den Transilvanya'nın iadesini talep eden bir ültimatom verdi. Henüz resmi bir yanıt verilmedi, ancak [HUN.GetNameDef] talepleri reddedilirse güç kullanmayı düşüneceklerini şimdiden ima etti."
 news.300.t:0 "[HUN.GetNameDefCap] Transilvanya'yı Talep Ediyor"
 news.301.a:0 "Büyüklüğe giden yoldayız!"
 news.301.b:0 "Başka seçeneğimiz yoktu."
 news.301.c:0 "En azından barış korundu."
 news.301.desc:0 "[ROM.GetNameDefCap], Transilvanya'nın iadesi yönündeki [HUN.GetAdjective] taleplerini kabul edeceğini duyurdu. Buna göre, toprak şimdi ülkeyle yeniden birleşti ve büyüklüğünü ve gücünü büyük ölçüde artırdı. Bu büyüklükteki bir başarının Macarları kalan kayıp toprakları için daha fazla talepte bulunmaktan caydırması pek olası değil."
 news.301.t:0 "[ROM.GetNameDefCap] Transilvanya'yı İade Ediyor"
 news.302.a:0 "Eğer dinleyecekleri tek şey güçse..."
 news.302.b:0 "Gelsinler bakalım!"
 news.302.c:0 "Taş kafalı aptallar..."
 news.302.desc:0 "Ültimatomun süresi bir Rumen yanıtı olmadan geldi ve geçti. Öfkeli [HUN.GetAdjective] yetkililer, Romanya hükümetini 'yasadışı antlaşmalara' bağlı kalmakta ısrar ederek 'bölgeyi istikrarsızlaştırmakla' suçlayarak şimdiden kınadılar. Her iki ulus da her an patlak verebilecek bir savaşa hazırlanıyor gibi görünüyor."
 news.302.t:0 "Romanya [HUN.GetAdjective] Taleplerini Reddediyor"
 news.303.a:0 "İstediğimiz tek şey bu kadar şanslı olmaktı."
 news.303.b:0 "Umarım bir uzlaşma bulabiliriz..."
 news.303.desc:0 "Macaristan, Trianon Antlaşması'nı düzeltme yeminlerini sürdürerek [From.GetName]'den Güney Slovakya'nın iadesini talep etti. [From.GetAdjective]'ler henüz yanıt vermedi, ancak [HUN.GetAdjective] söylemindeki savaş tehdidi çok açık. Reddetme, bölgede yeni bir savaşa yol açabilir."
 news.303.t:0 "Macaristan, Güney Slovakya'yı İstiyor"
 news.304.a:0 "Onlara geri katılıyoruz."
 news.304.desc:0 "[From.GetName], Güney Slovakya'nın iadesi için [HUN.GetAdjective] taleplerini resmen kabul etti ve bölgenin derhal Macaristan'a iade edilmesini sağlamak için acele adımlar attı. Bu başarının [HUN.GetAdjective]leri kalan kayıp bölgeleri için daha fazla talepte bulunmaktan alıkoyması pek olası değil."
 news.304.t:0 "Güney Slovakya [From.GetName]'a Geri Dönüyor"
 news.305.desc:0 "Diplomatik müzakereler bozuldu ve bugün [From.From.GetName], Güney Slovakya'nın iadesi için [HUN.GetAdjective] taleplerini açıkça reddetti. Öfkeli [HUN.GetAdjective] yetkilileri, [From.From.GetName] hükümetini kınayarak, 'yasadışı anlaşmalara' uyma ısrarlarıyla 'bölgeyi istikrarsızlaştırdıklarını' iddia ettiler. Her iki ülke de her an patlak verebilecek bir savaşa hazırlanıyor gibi görünüyor."
 news.305.t:0 "[From.From.GetName] [HUN.GetAdjective] Taleplerini Reddeder"
 news.306.a:0 "Büyük Macaristan yürüyüşü devam ediyor."
 news.306.b:0 "Hızlı düşünmek zorundayız..."
 news.306.desc:0 "Kaybedilen toprakların iadesini elde etmedeki önceki başarılarının ışığında, [HUN.GetAdjective]ler şimdi Yugoslavya'nın Voyvodina'yı iade etmesini talep ettiler. Yugoslavlar diplomatik bir çözüm bulmaya çalışırken, [HUN.GetAdjective] sabırsızlık giderek daha da belirginleşti ve Yugoslavlar talepleri reddederse barışçıl bir çözüm bulunması pek olası değil."
 news.306.t:0 "Macaristan, Voyvodina'yı İstiyor"
 news.307.a:0 "Bir başka diplomatik zafer!"
 news.307.desc:0 "Yugoslavya [HUN.GetAdjective] taleplerine boyun eğmeye karar verdi ve Voyvodina'nın komşusuna hızla aktarılmasını sağladı. Bol miktarda topçu diplomasisi gerektirse de, Macaristan'ın yeni bir bölgesel güç merkezi haline geldiği inkar edilemez."
 news.307.t:0 "Yugoslavya Voyvodina'yı İade Ediyor"
 news.308.desc:0 "Yugoslavlar, açık bir meydan okuma eylemiyle Voyvodina için [HUN.GetAdjective] taleplerini reddetti. Macaristan ise, 'yasal topraklarını' güvence altına almak için güç kullanma tehditlerini azaltmak için hiçbir çaba göstermedi. Her iki ülke de her an patlak verebilecek bir savaşa hazırlanıyor gibi görünüyor."
 news.308.t:0 "Yugoslavya [HUN.GetAdjective] Taleplerini Reddediyor"
 news.309.a:0 "Kuvvetin gerekli olmayacağını umalım."
 news.309.b:0 "Bu küçük bir talep değil..."
 news.309.c:0 "Bağımsızlığımıza katılmaya hazır mıyız?"
 news.309.desc.a:0 "[HUN.GetAdjective]ler, Slovakya'nın bir kez daha uluslarının bir parçası olması gerektiği, ya ayrılmaz bir parça ya da özerk bir bölge olması gerektiği iddialarını ortaya attılar. Bu yönde bir ültimatom yayınlandı, güç tehdidiyle desteklendi ve birkaç Avrupa ülkesinden diplomatlar bu son krize barışçıl bir çözüm bulmak için çılgınca çabalıyorlar."
 news.309.desc.b:0 "[HUN.GetAdjective]ler, Slovakya'nın bir kez daha uluslarının bir parçası olması gerektiği, ya ayrılmaz bir parça ya da özerk bir bölge olması gerektiği iddialarını ortaya attılar. Bu yönde bir ültimatom yayınlandı, güç tehdidiyle desteklendi ve Slovak hükümeti bu son [HUN.GetAdjective] krizine diplomatik bir çözüm bulmak için çılgınca bir çaba içinde."
 news.309.t:0 "Macaristan Slovakya Üzerinde Hak İddia Etti"
 news.31.a:0 "İlginç."
 news.31.b:0 "Almanya tiranlıktan kurtulmalı!"
 news.31.c:0 "Hainlere ölüm!"
 news.31.d:0 "Mevcut savaşa karşı çıkan bir grup Wehrmacht subayı Berlin'de Hitler'e karşı bir darbe başlattı. Kimliği belirsiz silahlı bir grup Reichskanzlei'ye baskın düzenledi ve SS korumalarıyla girdiği yoğun bir silahlı çatışmanın ardından Alman Führer'ini başarıyla ortadan kaldırdı.\n\nKomplocular Berlin'in çoğunun kontrolünü ele geçirmeyi başardı ve birçok Wehrmacht birimi onların tarafına geçti. Nazilere sadık kalan kuvvetler yeni bir liderlik altında toplandı ve Almanya'yı 'Berlin'i işgal eden komünist muhalifler ve yabancı ajanlardan' temizlemeye yemin etti."
 news.31.e:0 "Bu bizim avantajımıza!"
 news.31.t:0 "Almanya'da İç Savaş!"
 news.310.a:0 "Slovaklar bu şekilde daha iyi."
 news.310.b:0 "Bu, gerekli bir fedakârlıktı."
 news.310.desc.a:0 "[From.GetAdjective] Hükümeti, [From.GetLeader] yönetiminde, kapsamlı müzakerelerin ardından [HUN.GetAdjective] taleplerine boyun eğmeye karar verdi. [HUN.GetAdjective]'in Slovakya üzerindeki kontrolünü kabul ettiler ve barışı korumak için [HUN.GetLeader]'ı yatıştırmayı tercih ettiler. Şüphesiz bu, zayıflamış komşularıyla gelecekteki ilişkilerinde [HUN.GetAdjective] kararlılığını güçlendirecektir."
 news.310.desc.b:0 "Slovaklar, uzun müzakerelerin ardından [HUN.GetAdjective] taleplerine boyun eğmeye karar verdiler. Başka alternatif görmedikleri için, halklarının hayatlarını korumak amacıyla bağımsızlıklarından vazgeçtiler. Şüphesiz bu, zayıflamış komşularıyla gelecekteki ilişkilerinde [HUN.GetAdjective] kararlılığını güçlendirecektir."
 news.310.t:0 "[From.GetName] Macaristan'a Boyun Eğiyor"
 news.311.b:0 "Biz tek olarak duruyoruz. Bırak gelsinler!"
 news.311.desc.a:0 "Almanya ile Macaristan arasında Slovakya'nın kaderiyle ilgili diplomatik kriz çıktı. [HUN.GetLeader] daha önce Macaristan ile olan tarihi bağları nedeniyle Slovakya'nın [HUN.GetNameDef]'nin temel çıkarlarından biri olduğunu açıklamıştı. Hükümeti, Slovakya ile ilgili herhangi bir tedbir konusunda kendisine danışılmasını bekliyordu. \n\nAlman lider [GER.GetLeader], bu tür talepleri \"egemen bir ulusun iç işlerine aptalca ve tehlikeli müdahale\" olarak nitelendirerek kabul etmeyi reddetti.\n\nGerginliğin artmasıyla birlikte, giderek daha fazla gözlemci Macaristan'ın oldu bittiyi gerçekleştirmek için şiddete başvurup başvurmayacağını merak ediyor."
 news.311.desc.b:0 "Bağımsızlıklarına inatla tutunan Slovaklar, [HUN.GetAdjective] taleplerini reddettiler ve sınırlarını güçlendiriyorlar. Macaristan durumu yatıştırmak için hiçbir çaba göstermedi ve her iki ülke de savaşa doğru gidiyor gibi görünüyor."
 news.311.t:0 "[From.From.GetName] [HUN.GetAdjective] Taleplerini Reddeder"
 news.312.a:0 "Yeni dostlarımıza hoş geldiniz diyoruz."
 news.312.b:0 "Bu iyiye işaret değil..."
 news.312.c:0 "Belki de iyi şeyler olabilir."
 news.312.desc.a:0 "[HUN.GetAdjective] kışkırtmasıyla, [ITA.GetNameDef], [AUS.GetNameDef] ve [HUN.GetNameDef], başlangıçta 1934'te imzalanan Roma Protokollerini yenilediler. Anlaşmalar ekonomik kalkınma ve yakınlaşma ile ilgilidir. Esasen bir dostluk bildirgesi olan bu anlaşmanın, [GER.GetNameDef]'in büyüyen revizyonist ve yayılmacı eğilimlerine karşı koymayı amaçlayan resmi bir ittifaka yol açabileceğine dair işaretler var."
 news.312.desc.b:0 "[HUN.GetAdjective] kışkırtmasıyla, [ITA.GetNameDef] ve [HUN.GetNameDef], başlangıçta 1934'te imzalanan Roma Protokollerini yenilediler. Anlaşmalar ekonomik kalkınma ve yakınlaşma ile ilgilidir. Esasen bir dostluk bildirgesi olan bu anlaşmanın, [GER.GetNameDef]'in büyüyen revizyonist ve yayılmacı eğilimlerine karşı koymayı amaçlayan resmi bir ittifaka yol açabileceğine dair işaretler var."
 news.312.t:0 "Roma Protokollerinin Yenilenmesi"
 news.313.a:0 "Beraber duruyoruz."
 news.313.b:0 "Bu bir endişe nedeni..."
 news.313.c:0 "Almanya artık rakipsiz."
 news.313.desc.a:0 "Bugün, İtalya, Avusturya ve Macaristan'ın ilgili hükümetleri Roma Paktı'nın kuruluşunu duyuran ortak bir bildiri yayınladı. Üç güç, ihtiyaç duyulması halinde hem savunma hem de saldırıda birbirlerine askeri yardımda bulunmaya yemin etti. Bölgedeki güç dengesi bir gecede kökten değişti."
 news.313.desc.b:0 "Bugün, İtalya ve Macaristan'ın ilgili hükümetleri Roma Paktı'nın kuruluşunu duyuran ortak bir bildiri yayınladı. İki güç, ihtiyaç duyulması halinde hem savunma hem de saldırıda birbirlerine askeri yardımda bulunmaya yemin etti. Bölgedeki güç dengesi bir gecede kökten değişti."
 news.313.t:0 "Roma Paktı Oluşturuldu"
 news.314.a:0 "Bir erkeğin hayatı, ödenmesi gereken küçük bir bedeldir."
 news.314.b:0 "Devrim durdurulamaz!"
 news.314.c:0 "Komünistler daha alçalabilir mi?"
 news.314.desc:0 "Macaristan'dan Miklos Horthy'nin bugün Budapeşte'deki Parlamento binasından ayrıldıktan sonra tek başına bir silahlı adam tarafından vurulduğuna dair haberler geldi. Hemen hastaneye kaldırıldığını düşünen doktorlar, vardığında çoktan ölmüş olduğunu duyurdu. Olay yerinden kaçmaya çalışırken polis tarafından vurulan silahlı adamın komünist parti üyesi olduğu tespit edildi.\n\nSuikast, iç siyasette [HUN.GetAdjective] bir kargaşaya neden oldu, çünkü Horthy'nin anti-komünist eğilimleri devrimci unsurları uzak tutmada çok önemliydi. Siyasi sahnenin başında eski amiral olmadan, komünist etkilerin önemli ölçüde artması muhtemeldir."
 news.314.t:0 "Horthy Suikaste Uğradı"
 news.315.desc:0 "Avusturya, Macaristan'ın artan saldırganlığına rağmen [HUN.GetAdjective] referandum çağrılarını tamamen reddetti. Macaristan, Avusturya hükümetini halkının demokratik haklarını açıkça hiçe saymakla suçladı. Avusturya halkının [HUN.GetAdjective] kardeşleriyle yeniden birleşme arzusunu korumak için güç kullanmaktan kaçınmayacaklarını belirttiler. Her iki taraf da şimdi seferber olmaya başladı ve savaş kaçınılmaz görünüyor."
 news.315.t:0 "Avusturya Referandumu Reddediyor"
 news.316.a:0 "Birbirimize ihtiyacımız var."
 news.316.b:0 "Onları kurtaracağını mı düşünüyorlar?"
 news.316.c:0 "Umarım karşılığını verir."
 news.316.desc:0 "Polonyalılar ve Rumenler birbirlerinin savunmasına olan bağlılıklarını yenilediklerini duyurdular. İki ülke arasında on yıldan uzun süredir iyi ilişkiler olmasına rağmen, bugünkü duyuru, karşılıklı savunma politikasının hem Polonya'da hem de Romanya'da askeri planlamaya giderek daha fazla hakim olduğunu gösteriyor."
 news.316.t:0 "Polonya-Romanya İttifakı"
 news.317.a:0 "Biz sorumluyuz."
 news.317.b:0 "Romanya ile birlikte duruyoruz."
 news.317.desc:0 "Doğu ve batıdaki ideolojilerin oluşturduğu artan tehlikelere atıfta bulunan Romanyalılar, Cordon Sanitaire'in kuruluşunu duyurdu. İttifak, Doğu Avrupa'da faşizm ve komünizm tarafından boğulmuş herkesi memnuniyetle karşılıyor ve bazı ülkeler şimdiden güçlerini Romanya ile birleştirmeyi düşünüyor."
 news.317.e:0 "Övgüye değer bir girişim."
 news.317.f:0 "Şimdi kim düşman oluyor?"
 news.317.g:0 "Bu planlarımızı bozuyor."
 news.317.t:0 "Cordon sanitaire"
 news.318.a:0 "Onlar için en iyi şeyin ne olduğunu biliyorlardı."
 news.318.b:0 "Gerekli bir önlem..."
 news.318.c:0 "Rahatsız edici bir gelişme."
 news.318.desc:0 "Romanya'nın bir ültimatomuna yanıt olarak ve reddetmeleri halinde derhal Romanya askeri eylemiyle karşı karşıya kalan Bulgarlar, hükümetlerinde Romanya'ya daha dostça davranmak için önemli değişiklikler yaptılar. Bulgaristan komşusunun tüm taleplerini kabul etti ve daha fazla talebi reddetmeleri pek olası değil. Sonuç olarak, artık yalnızca bir Romanya kuklası olarak görülebilir."
 news.318.t:0 "Bulgaristan Romanya'ya Boyun Eğiyor"
 news.319.a:0 "Ne kadar yanlış bir hamle olduğunu görecekler."
 news.319.b:0 "Gel ve al!"
 news.319.c:0 "Yine bir Balkan Savaşı...?"
 news.319.desc:0 "Bir ültimatom verilmesine ve reddetmeleri halinde derhal Romanya'nın askeri eylemiyle karşı karşıya kalmalarına rağmen Bulgaristan, Romanya'nın taleplerini reddetti. İkincisi geri adım atmayı reddetti ve her iki ülke de askeri çatışmaya doğru net bir yolda görünüyor."
 news.319.t:0 "Bulgaristan Rumen Taleplerini Reddediyor"
 news.32.a:0 "Bu iyi olamaz..."
 news.32.b:0 "Yeni Bolşevik dostlarımızın şerefine!"
 news.32.c:0 "Yeni Alman dostlarımızın şerefine!"
 news.32.d:0 "Almanya ve Sovyetler Birliği'nden diplomatlar, gözlemcilerin bugün tarihi bir anlaşma olarak nitelendirdiği Molotov-Ribbentrop Paktı'nı imzalayarak sonuçlandırdılar. \nAlman dışişleri bakanı Joachim von Ribbentrop ve Sovyet mevkidaşı Vyaçeslav Molotov'dan adını alan bu saldırmazlık paktı, hiçbir tarafın diğerinin düşmanıyla ittifak kurmayacağını veya ona yardım etmeyeceğini şart koşuyor.\n\nYabancı diplomatlar, bu antlaşmanın fiilen Almanya'ya Avrupa'da Sovyet müdahalesinden korkmadan savaş açma özgürlüğü verdiğini belirtiyor."
 news.32.d_finland:0 "$news.32.d$ Ancak [ROOT.GetAdjective] halkı, [SOV.GetNameDef]'in onlara yönelik oluşturabileceği tehdit konusunda daha endişeli görünüyor."
 news.32.e:0 "Uzun ve faydalı bir dostluğa!"
 news.32.f:0 "Ülkemizi savunmaya hazırlanmalıyız."
 news.32.t:0 "Molotov-Ribbentrop Paktı"
 news.320.a:0 "Onu istediler."
 news.320.b:0 "Gel ve al!"
 news.320.c:0 "Onları uyardık."
 news.320.desc:0 "Devletin 'köklü bir şekilde yeniden yapılandırılması' için Romanya'nın talepleriyle ve reddederlerse askeri güç tehdidiyle karşı karşıya kalmalarına rağmen, Yugoslavya ültimatomu reddetti. Ülkeye birçok yönden yeterli baskı uygulanmasına rağmen, Yugoslavlar ülkelerini diş ve tırnakla savunmaya kararlılar. Romanya şimdi savaş ilan etti ve diğer ülkelerin de bir bölünmeye katılması düşünülemez değil."
 news.320.f:0 "Uzun süre dayanmayı ummasınlar."
 news.320.t:0 "Yugoslavya, Rumen Taleplerini Reddediyor"
 news.321.a:0 "Teşekkür edecek arkadaşlarımız var."
 news.321.b:0 "Bu mükemmel bir fikirdi!"
 news.321.c:0 "Açgözlü piçler."
 news.321.desc:0 "Romanya'nın kışkırtmasıyla, Yugoslavya'ya 'devletlerinin yeniden yapılandırılması' çağrısında bulunan bir ültimatom verildi. Birden fazla komşudan aynı anda gelen baskıyla karşı karşıya kalan Yugoslavlar, kabul etmekten başka bir alternatif görmediler ve şu anda ülkenin bölünmesi süreci devam ediyor."
 news.321.e:0 "Duyguyu biliyoruz..."
 news.321.t:0 "Yugoslavyya Bölündü"
 news.322.a:0 "Bu daha iyi bir değişim."
 news.322.b:0 "O daha fazla görünüyor ... En azından mütevazı."
 news.322.desc:0 "Romanya'da ülkenin liderliğine yönelik memnuniyetsizlik tehlikeli seviyelere ulaştığından, Prens Michael şimdi ordunun önemli unsurlarının yardımıyla bir darbe başlattı. İlk raporlar bunun başarılı olduğunu gösteriyor ve Kral Michael, Romanya'ya ihtiyaç duyduğu liderliği vermek niyetiyle devlet başkanı rolünü üstlendiğini duyurdu."
 news.322.t:0 "Romanya'da Darbe"
 news.323.a:0 "Hele şükür."
 news.323.b:0 "Eğlenceli."
 news.323.desc:0 "Hükümetindeki güçlü unsurların baskısı altında kalan Romanya Kralı II. Carol, tahttan çekildiğini duyurmaktan ve imzalamaktan başka çare görmedi. Halefi Kral Michael'dır, ancak Carol'ın elde ettiği diktatörlük yetkilerinin çoğu hükümete geri verilmiştir ve bu nedenle genç Kral'ın selefi gibi benzer bir güce sahip olması pek olası değildir.\n\nTahttan çekildikten sonra Carol'ın geniş banka hesaplarını boşalttığı ve sürgüne kaçtığı, metresi Magda Lupescu ile birlikte Mexico City'nin daha pahalı semtlerinden birinde ikamet ettiği anlaşılıyor."
 news.323.t:0 "Kral II. Carol Çekiliyor"
 news.324.a:0 "Ne Ustaca bir iş ama!"
 news.324.b:0 "Ne kadar da dolandırıcı."
 news.324.desc:0 "Devletin 'köklü bir şekilde yeniden yapılandırılması' yönündeki Rumen talepleri ve reddederlerse askeri güç tehdidiyle karşı karşıya kalan Yugoslavya, teslim olmaktan başka bir yol göremedi. Ancak duyurulan 'yeniden yapılandırma', yalnızca Yugoslavya'nın kurucu devletlerine bölünmesiyle sonuçlanmadı, aynı zamanda kukla hükümetlerin kurulmasını da gerektirdi.\n\nAçıkça görülüyor ki, ağırlıklı olarak Rumen çıkarları, kendi kaderini tayin hakkı bahanesiyle gözetildi ve bölgedeki Rumen nüfuzu artmaya devam ediyor."
 news.324.t:0 "Yugoslavya Romanya'ya Boyun Eğiyor"
 news.325.a:0 "Tüm Slavlar için Yugoslavya!"
 news.325.b:0 "Onlar için hazırız!"
 news.325.c:0 "Powderkeg asla hayal kırıklığına uğratmaz."
 news.325.desc:0 "Ülkelerinin temellerini 'Güney Slav halklarının birliği' olarak gösteren Yugoslav söylemi, son zamanlarda giderek artan bir şekilde Bulgar halkının bu birliğe üye olması gerektiğini savunuyor. Şimdi, Yugoslavya'nın Bulgar bölgesi üzerindeki iddiasını açıkça ortaya koymasıyla bu propaganda kökten yeni bir hal aldı. Her iki ulus da güçlerini hazırlarken, savaş her an patlak verebilir."
 news.325.t:0 "Yugoslavya Bulgaristan'da Hak İddia Ediyor"
 news.326.a:0 "Öyle gerekti."
 news.326.b:0 "Çok Yaşa Hırvatistan!"
 news.326.c:0 "Yugoslav çöküşünün başlangıcı?"
 news.326.desc:0 "Hırvat milliyetçi unsurlarla devam eden ve artan sorunlar sonucunda, Yugoslav hükümetinin Hırvatlara daha fazla özerklik vermesi gerekti. Hırvatistan Banovina adlı yeni bir yarı bağımsız devlet kuruldu ve hala nominal olarak Yugoslavya'nın bir bağımlılığı olmasına rağmen, hükümetin bölgedeki etkisi artık büyük ölçüde azaldı."
 news.326.t:0 "Hırvatistan Banovinası"
 news.327.a:0 "Bütün Güney Slavları birdir!"
 news.327.b:0 "Denemeye hazırlar!"
 news.327.c:0 "Gelişmekte olan sorunlar."
 news.327.desc:0 "Makedonya halklarını birleştirme amacıyla Yugoslavya, Orta Makedonya'yı artık Yugoslav ulusunun ayrılmaz bir parçası olarak gördüğünü duyurdu. İddialarını desteklemek için sınırda bölünmeler var ve bölgede yeni bir askeri çatışma tehdidi beliriyor."
 news.327.t:0 "Yugoslavya Makedonya'da Hak İddia Ediyor"
 news.328.a:0 "Sadece ulusumuzda güvende olacaklardır."
 news.328.b:0 "Denerlerse onları ezeceğiz!"
 news.328.c:0 "Başka bir çatışma demleniyor."
 news.328.desc:0 "Yugoslav hükümeti son zamanlarda İstria ve Zara sınır bölgelerindeki Slav azınlıklara yönelik İtalyan muamelesine karşı giderek daha fazla ses çıkarmaktadır. Bugün, Büyük Savaş'tan sonra İtalya tarafından alınan ve çoğunlukla etnik Slavların yaşadığı bu bölgeleri Yugoslav ulusunun ayrılmaz bir parçası olarak gördüğünü duyurdu. Ayrıca, bu bölgelerde yaşayanların haklarını korumak için Yugoslavlar askeri güç kullanmaktan kaçınmayacaklarını belirttiler."
 news.328.t:0 "Yugoslavya İtalyan Sınırında Hak İddia Ediyor"
 news.329.a:0 "Bazı ilginç fikirleri var."
 news.329.b:0 "Onlara Devrimi göstereceğiz."
 news.329.c:0 "Sovyet etkisi yayılıyor..."
 news.329.desc:0 "Yugoslavya, diğer uluslardan daha da stoacı bir şekilde, [SOV.GetNameDef] adlı komünist devleti tanımayı yıllardır reddetti. Yugoslavya hükümetinin bundan böyle Sovyetlerle resmi ilişkiler kuracağının duyurulmasıyla, bu politika nihayet sona erdi. Bunun Yugoslav devletinin komünist nüfuzuna açılması anlamına gelip gelmediği henüz belli değil, ancak duyurunun tonu şaşırtıcı derecede samimiydi."
 news.329.t:0 "Yugoslavya [SOV.GetNameDef] Ülkesini Tanıdı"
 news.33.a:0 "Muhtemel bir hikaye!"
 news.33.b:0 "Tadını çıkarın Bolşevikler, sürdüğü kadar..."
 news.33.c:0 "Komünizmin sınırları ilerliyor!"
 news.33.d:0 "Sovyet birlikleri, Polonya hükümetinin çöküşünü izleyen kaostan Beyaz Rus ve Ukraynalı azınlıkları korumak amacıyla resmi olarak doğu Polonya'yı işgal etti. \n\nAlman kuvvetleri bu bölgelerden düzenli bir şekilde çekildi ve bu da Polonya'nın iki güç arasında fiilen paylaşılmasıyla sonuçlandı."
 news.33.t:0 "SSCB Doğu Polonya'yı İşgal Ediyor"
 news.330.a:0 "Diğer Yoldaş Slavlara liderlik edeceğiz!"
 news.330.b:0 "Küstah küçük başlangıçlar!"
 news.330.c:0 "İlginç..."
 news.330.desc:0 "Sovyet komünizminin temel yönlerine katılmayan Yugoslavlar, ideolojiye kendi yaklaşımlarını getirdiler. Komintern'in bir üyesi olmaktan ziyade, Yugoslav hükümeti, Güney Slavlarını işçi hakları mücadelesinde yönetmeyi amaçladıklarını duyurdu. Yakında komşularını da kendi saflarına katmaya çalışacakları muhtemeldir; bu da bölgedeki güç dengesini ciddi şekilde bozabilir."
 news.330.e:0 "Belki de bu istikrar getiriyor?"
 news.330.t:0 "Pan-Slav İşçiler Kongresi"
 news.334.a:0 "[JAP.GetNonIdeologyName] için hiçbir sınır yok mu?"
 news.334.b:0 "Bu işleri karmaşıklaştırabilir"
 news.334.c:0 "[JAP.GetAdjective] tehdidi daha büyük görünüyor"
 news.334.d:0 "[USA.GetAdjective] ve [ENG.GetAdjective] savaş gemileri, [JAP.GetAdjective] uçakları tarafından bugün ayrı eylemlerde saldırıya uğradı. Bu saldırı sırasında [JAP.GetName] ile [CHI.GetName] arasındaki savaşta Batılı siviller cepheden tahliye edildi. Açıkça [USA.GetAdjective] gemisi olarak işaretlenmiş olmasına rağmen, USS Panay iki bombayla vuruldu ve batırıldı. Üç [USA.GetAdjective] ve bir [ITA.GetAdjective] vatandaşı öldü ve diğerleri yaralandı. HMS Ladybird'e yapılan ayrı bir saldırıda, bir [ENG.GetAdjective] denizci öldürüldü.\n\nHem [USA.GetAdjective] hem de [ENG.GetAdjective] Hükümetleri güçlü protestolar yayınladı. Olay, üç önde gelen deniz gücü arasındaki artan gerginliği vurguluyor."
 news.334.t:0 "Panay Olayı"
 news.335.a:0 "Pasifik için bunun anlamı nedir?"
 news.335.b:0 "Panay'ı hatırla!"
 news.335.c:0 "Bırak gelsinler!"
 news.335.d:0 "\nSon Panay Olayı kontrolden çıktı. [USA.GetNameDef]'teki öfke, birkaç önemli politikacının [JAP.GetNameDef]'e karşı derhal misilleme talep etmesine yol açtı. [USA.GetAdjective] medyası, bazıları gerçek, bazıları abartılı, bazıları tamamen uydurma olan [JAP.GetAdjective] vahşetlerinin sürekli yeni hikayeleriyle dolup taştı. İki büyük güç savaşın eşiğindeyken, çok az gözlemci hala durumun istikrara kavuşturulabileceğine dair umut besliyor."
 news.335.e:0 "Japonya için kötü haber bizim için iyi haber"
 news.335.f:0 "Bu, Çin'deki durumu daha da zorlaştırabilir"
 news.335.t:0 "[USA.GetNameDef] ve [JAP.GetName] arasında yükselen tansiyon"
 news.336.a:0 "Hatırlıyoruz."
 news.336.b:0 "Biz unuttuk."
 news.336.c:0 "[USA.GetLeader] bunun olmasına nasıl izin verdi?"
 news.336.desc:0 "[MEX.GetAdjective] güçleri yüz yıllık bir aradan sonra Teksas'ı yeniden işgal etti. [USA.GetAdjective] birlikleri, San Antonio ve ünlü simgesi Alamo dahil olmak üzere Teksas'ın büyük şehirlerinden tamamen temizlendi. Tarihi alanda hiçbir çatışma yaşanmamış olsa da [MEX.GetLeader], Katolik misyonunun tesislerini gezerek, birlikleri nefret edilen 'Yanquis'e karşı nihai zafer için savaşmaya devam etmeleri yönünde cesaretlendiren mitingler ve konuşmalar düzenledi."
 news.336.title:0 "Alamo'yu Hatırla"
 news.337.a:0 "Etiyopya için iyi oldu!"
 news.337.b:0 "Umarız [ITA.GetLeader] başarısızlıklarıyla hatırlanmaz."
 news.337.c:0 "Bundan asla kurtulamayacağız."
 news.337.d:0 "Ras Alula'nın İmparatorluğu yeniden doğdu!"
 news.337.desc:0 "[ETH.GetLeader] ile [ITA.GetLeader] arasında bugün imzalanan bir barış antlaşması iki ulus arasındaki düşmanlıklara son verdi. Denize kıyısı olmayan krallık ile dünyayı saran imparatorluk arasındaki devasa güç farkına rağmen, Etiyopya hükümeti bu müzakerelerden kesinlikle üstün çıktı. İtalya sadece Etiyopya ile bir ateşkes imzalamakla kalmayacak, aynı zamanda Eritre ve İtalyan Somaliland toprakları da resmen [ETH.GetNameDef]'e devredildi.\n\nBu, İtalyan silahlı kuvvetlerinin Etiyopya'daki ikinci yenilgisi olduğundan, [ITA.GetLeader] hükümeti darmadağınık durumda ve yaralı İtalyan gururunun bu yenilgiden gerçekten kurtulması muhtemelen uzun yıllar alacaktır."
 news.337.desc_no_states:0 "[ETH.GetLeader] ile [ITA.GetLeader] arasında bugün imzalanan bir barış antlaşması iki ulus arasındaki düşmanlıklara son verdi. Denize kıyısı olmayan krallık ile dünyayı saran imparatorluk arasındaki devasa güç farkına rağmen, Etiyopya hükümeti İtalyan kuvvetlerine karşı direnmeyi başardı. \n\nBu, İtalyan silahlı kuvvetlerinin Etiyopya'daki ikinci yenilgisi olduğundan, [ITA.GetLeader] hükümeti darmadağınık durumda ve yaralı İtalyan gururunun bu yenilgiden gerçekten kurtulması muhtemelen uzun yıllar alacaktır."
 news.337.desc_some_states:0 "[ETH.GetLeader] ile [ITA.GetLeader] arasında bugün imzalanan bir barış antlaşması iki ulus arasındaki düşmanlıklara son verdi. Denize kıyısı olmayan krallık ile dünyayı saran imparatorluk arasındaki devasa güç farkına rağmen, Etiyopya hükümeti bu müzakerelerden kesinlikle üstün çıktı. İtalya sadece Etiyopya ile bir ateşkes imzalamakla kalmayacak, aynı zamanda Doğu Afrika'daki eski İtalyan topraklarının bir kısmı da resmen [ETH.GetNameDef]'e devredildi.\n\nBu, İtalyan silahlı kuvvetlerinin Etiyopya'daki ikinci yenilgisi olduğundan, [ITA.GetLeader] hükümeti darmadağınık durumda ve yaralı İtalyan gururunun bu yenilgiden gerçekten kurtulması muhtemelen uzun yıllar alacaktır."
 news.337.title:0 "Afrika'da Aşağılanma"
 news.338.a:0 "Gelecek belirsiz."
 news.338.b:0 "Dünya başarımız karşısında huşu içinde olmalı."
 news.338.desc:0 "[FROM.GetNameDefCap], nükleer reaktörlerle başarılı testler gerçekleştirdi, [FROM.GetLeader] dün halka açık bir konuşmada duyurdu. [FROM.GetNameDefCap] şu anda küresel atom yarışında lider konumda görünüyor."
 news.338.t:0 "Başarılı Nükleer Testler"
 news.34.a:0 "Rahatsız edici."
 news.34.b:0 "Mükemmel!"
 news.34.c:0 "Mücadele devam ediyor!"
 news.34.d:0 "[From.GetName] ile Üçüncü Fransız Cumhuriyeti arasında bir ateşkes, I. Dünya Savaşı'ndaki Alman teslimiyetinin müzakere edildiği aynı demiryolu vagonunda, Compiègne'de imzalandı.\n\nAteşkes şartlarına göre, Vichy merkezli [vichy_france.GetLeader] yönetimindeki bir Fransız hükümeti güney Fransa'nın çoğunu yönetmeye devam edecek, ülkenin geri kalanı ise bir Alman İşgal Bölgesi altına girecektir. \n\nBazı Fransız subayları yurtdışından direnişe devam etme sözü verdi, ancak bu, en azından şimdilik Fransa'daki çatışmalara fiilen son veriyor."
 news.34.t:0 "Compiègne'deki İkinci Ateşkes"
 news.35.a:0 "Fransızlar çaresiz kalmış olmalı."
 news.35.b:0 "Farklı bir bayrak altında güvende olacaklarını mı sanıyorlar?"
 news.35.c:0 "Ortak düşmana karşı birleştik!"
 news.35.d:0 "Fransa'da yenilgiyle yüzleşen Fransız ve İngiliz hükümetleri, Almanya'ya karşı zafer kesinleşene kadar iki uluslarını birleştirmeye karar verdiler. \n\nLondra'da yeni bir ortak hükümet kuruluyor ve VIII. Edward devlet başkanı olarak kalıyor. Yayınlanan bir 'Birlik Bildirgesi'nde yeni Ortak Savaş Kabinesi şunları belirtti:\n\n'Fransa ve Büyük Britanya artık iki ulus olmayacak, tek bir Fransız-İngiliz Birliği olacak. Birliğin anayasası ortak savunma, dış, mali ve ekonomik politika organları sağlayacaktır. Her Fransız veya İngiliz vatandaşı derhal diğer devletin vatandaşlığını kazanacaktır.'"
 news.35.t:0 "Fransız-İngiliz Birliği'nin Doğuşu"
 news.350.a:0 "Bu tehlikeli olabilir."
 news.350.b:0 "Bu kesinlikle yeni bir başlangıç."
 news.350.c:0 "Sanırım onlar için iyi oldu."
 news.350.desc:0 "\n\n[ROOT.GetAdjective] halkının iradesini dinleyen [ROOT.GetLeader], [ROOT.GetRulingIdeology] [ROOT.GetAdjective] devletlerinin barışçıl bir şekilde birleşmesini sağlamayı başardı. Bunun dünya genelinde ne gibi bir etki yaratacağı henüz belli değil, ancak en azından [ROOT.Capital.GetCapitalVictoryPointName]'da halk bu tarihi olayı kutluyordu."
 news.350.t:0 "[ROOT.GetNameDef]'in Barışçıl Yeniden Birleşmesi"
 news.36.a:0 "Eğer istedikleri buysa..."
 news.36.b:0 "Reich'a hoş geldiniz!"
 news.36.c:0 "Kuzey sınırlarımızı güvence altına almalıyız!"
 news.36.d:0 "Viyana'daki yerel Nazi partisinin başarılı bir darbesinin ardından, Alman birlikleri Avusturya sınırını geçti ve ülkenin kontrolünü ele aldı. \n\nHiçbir çatışma bildirilmedi ve Alman askerleri şehirlerde alkışlayan kalabalıklar tarafından karşılandı.\n\nViyana'daki Heldenplatz'da büyük bir kalabalığa hitap eden Hitler, Avusturya'nın Anschluss'unu ilan ederek ülkeyi Almanya'ya ilhak etti:\n\n'Alman halkının en eski doğu eyaleti, bu noktadan itibaren Alman Reich'in en yeni kalesi olacaktır!'"
 news.36.e:0 "Bu, Versay Antlaşması'nı ihlal ediyor!"
 news.36.t:0 "Avusturya'nın Anschluss'u"
 news.37.a:0 "Barbarca."
 news.37.b:0 "Görev tamamlandı."
 news.37.c:0 "O kışkırtıcı için uygun bir son."
 news.37.d:0 "Bir zamanlar Vladimir İlyiç Lenin'in baş yardımcısı ve muhtemel varisi olan Lev Troçki, bugün Mexico City'deki bir hastanede öldü. Evinde, NKVD'nin emrinde olduğuna inanılan İspanyol bir şahıs tarafından bir buz baltasıyla saldırıya uğramıştı.\n\nSovyetler Birliği Komünist Partisi'nin kontrolü için $SOV_iosif_stalin$ ve müttefikleriyle girdiği başarısız bir güç mücadelesinin ardından Troçki, otuzlu yılları sürgünde geçirmiş, Türkiye, Fransa ve Norveç'te yaşamış ve sonunda Meksika'ya yerleşmişti. \n\nStalin'in ve Sovyetler Birliği'nin 'yozlaşmış işçi devleti'nin sürekli bir eleştirmeni olarak kaldı."
 news.37.t:0 "Lev Troçki Suikastı"
 news.38.a:0 "İlginç."
 news.38.b:0 "O solucan!"
 news.38.d:0 "Bugün erken saatlerde Mexico City'deki evinde yaşanan şiddetli bir mücadelenin ardından Lev Troçki, kendisine saldırmaya çalışan adamın buz baltasıyla bir suikastçıyı öldürdü. Katilin, NKVD'nin emrinde olduğuna inanılan İspanyol bir şahıs olduğu tespit edildi.\n\nTroçki bir zamanlar Vladimir Lenin'in baş yardımcısı ve muhtemel varisiydi, ancak başarısız bir güç mücadelesinin ardından $SOV_iosif_stalin$ tarafından Sovyetler Birliği'nden sürgüne zorlanmıştı. \n\nBasına konuşan Troçki, hayatına yönelik girişimi 'Stalin'in eleştirmenlerini susturmak için düzenlediği bir başka korkakça komplo' olarak kınadı."
 news.38.t:0 "Troçki Suikast Girişiminden Kurtuldu"
 news.39.a:0 "İlginç."
 news.39.b:0 "En azından bir tehdit daha azaldı."
 news.39.d:0 "Sovyet yetkilileri, Lev Troçki'nin ölü bedeninin fotoğraflarını yayınlayarak, kısa süre önce [SOV.GetNameDef]'e gizlice girmeye çalışırken öldürüldüğüne dair söylentileri doğruladı. \n\nCesedi, Sovyet-İran sınırı boyunca uzanan Atrek Nehri kıyılarında bulundu.\n\nTroçki'nin, uzun süredir rakibi olan Stalin'e karşı müttefikler arayarak ve bir darbeyle onun yerine geçerek SSCB içindeki mevcut kargaşadan yararlanmak istediğine inanılıyor."
 news.39.t:0 "Troçki Sovyet Sınırında Öldürüldü"
 news.40.a:0 "Bu beklenmedikti."
 news.40.b:0 "Çok yaşa yoldaş Troçki!"
 news.40.d:0 "Geçici Sovyet başkentinde şiddetli bir güç mücadelesi yaşandı. Lev Troçki, üzerine zorla kabul ettirilen uzun sürgünden dönerek gizlice SSCB kalıntılarına girmiş görünüyor. \n\nKomünist Parti'nin en üst kademelerindeki müttefikleriyle birlikte, Stalin'e karşı başarılı bir darbe başlattı.\n\nBir Halk Mahkemesi tarafından yapılan kısa bir yargılamanın ardından Stalin asılarak idama mahkum edildi. Ceza bu sabah infaz edildi."
 news.40.t:0 "Troçki Darbe Başlattı!"
 news.400.a:0 "[HUN.GetAdjective] Ruhu İçin Ağır Bir Darbe"
 news.400.b:0 "Nasıl toparlanacağız?"
 news.400.desc:0 "[43.GetCapitalVictoryPointName]'dan gelen raporlar, [HUN.GetAdjective] başkentinin ilerleyen [FROM.GetAdjective] birlikleri tarafından ele geçirildiğini doğruluyor. \n\nTuna kıyılarındaki bazı tahkimatlardan hala hafif silah sesleri duyulabiliyor, ancak şehir içinde önemli bir [HUN.GetAdjective] kuvveti görülmedi.\n\nNehir üzerindeki büyük köprülerin çoğunun yıkıldığı ve birkaçının [FROM.GetNameDef]'in kontrolüne geçtiği bildiriliyor. \nYıllardır ilk kez Kossuth Meydanı sessizliğe büründü ve Buda Kalesi yabancıların elinde."
 news.400.t:0 "[43.GetCapitalVictoryPointName]'nın Düşüşü"
 news.401.a:0 "Önemli bir gelişme."
 news.401.b:0 "Anavatan için bir zafer daha!"
 news.401.c:0 "Sonun düşündüğümüzden daha yakın olabiliriz."
 news.401.desc:0 "[43.GetCapitalVictoryPointName]'dan gelen raporlar, [HUN.GetAdjective] başkentinin ilerleyen [SOV.GetAdjective] birlikleri tarafından ele geçirildiğini doğruluyor. \n\nŞehrin büyük bir kısmı ele geçirilmesine yol açan kuşatma sırasında harap oldu ve yerel milisler hala [SOV.GetAdjective]lere karşı çatışmalarda savaşıyor, ancak başarı şansları çok az. \n\n[SOV.GetAdjective] bayrağı şimdi Buda Kalesi üzerine çekildi ve birçok [HUN.GetAdjective] politikacı son savaşlarda esir alındı. Bu [HUN.GetNameDef]'in sonu mu?"
 news.401.t:0 "[43.GetCapitalVictoryPointName]'nın Düşüşü"
 news.409.a:0 "Anlaşıldı."
 news.409.b:0 "Bu kaçınılmaz olanı durduramaz."
 news.409.c:0 "Bir insanlık trajedisi."
 news.409.desc:0 "Yaklaşan [JAP.GetAdjective] kuvvetlerinin gücünü durdurmak için son bir çaresiz girişimle, Sarı Nehir boyunca uzanan bentler ve sel savunma ağları [FROM.GetAdjective] ordusu tarafından yok edildi.\n\nArdından gelen ani seller, hazırlık için sadece kısa bir süre verilen kırsal nüfusun büyük bir kısmını yerinden etti.\n\nBu eylemin [FROM.GetAdjective] ordusuna yeniden toparlanıp daha fazla çatışmayla yüzleşmek için yeterli zaman kazandırıp kazandırmayacağı henüz belli değil."
 news.409.t:0 "Sarı Nehir Patlatıldı"
 news.41.d:0 "Lev Troçki bu sabah Buenos Aires'teki bir otel odasında ölü bulundu. \n\nBir dağcılık ipiyle boğularak öldürülmüş gibi görünüyor ve katil, binadan çıkamadan Troçki'nin korumaları tarafından yakalandı.\n\nKatil Portekiz vatandaşı olmasına rağmen, onu Sovyet istihbarat müdürlüğü GRU ile ilişkilendiren kanıtlar var. Görünüşe göre Stalin sonunda eski rakibine ölümcül bir darbe vurdu."
 news.41.t:0 "Troçki Sonuna Ulaştı"
 news.42.a:0 "Ah, insanlık!"
 news.42.d:0 "Alman yolcu zeplini Hindenburg, bugün Amerika Birleşik Devletleri'ndeki Lakehurst Deniz Hava Üssü'ne yanaşmaya çalışırken yok oldu. Henüz belirlenemeyen nedenlerden dolayı zeplin alevler içinde kalarak yere çakıldı ve 35 kişinin ölümüne neden oldu.\n\nHelyumun kıtlığı, pahalılığı ve ABD'nin ihracat yasağı nedeniyle Hindenburg, tüm Alman yolcu zeplinleri gibi, daha fazla kaldırma kuvveti sağlayan ancak aynı zamanda yanıcı olan hidrojeni kullanmak üzere tasarlanmıştı. \n\nBu felaketle sarsılan halkın güveni ve çok daha hızlı yolcu uçaklarının yükselişiyle, bu zeplinler çağının sonu olabilir."
 news.42.t:0 "Hindenburg Felaketi"
 news.43.a:0 "Kıl payı atlatıldı."
 news.43.d:0 "Bugün, Alman yolcu zeplini Hindenburg Amerika Birleşik Devletleri'ndeki Lakehurst Deniz Hava Üssü'ne yanaşırken bir dizel yakıt sızıntısı tespit edildiğinde felaket kıl payı atlatıldı.\n\nSızıntı derhal onarıldı. Fark edilmeseydi, yanıcı buhar tüm zeplini saracak bir yangına neden olabilirdi. \n\nEleştirmenler uzun zamandır şüpheli güvenlik kayıtları göz önüne alındığında yolcu zeplinlerinin bilgeliğini sorguluyorlardı ve bu olay onların daha da sesli olmalarına neden olacaktır."
 news.43.t:0 "Hindenburg Olayı"
 news.44.a:0 "İlginç."
 news.44.b:0 "Delilik!"
 news.44.c:0 "Onu Londra Kulesi'ne kapatın!"
 news.44.d:0 "Führer Yardımcısı Rudolf Hess, dün İskoçya'da bir ağır avcı uçağından paraşütle atladıktan sonra İç Güvenlik askerleri tarafından tutuklandı. \n\nUsta bir pilot olan Hess, görünüşe göre Kuzey Denizi'ni tek başına geçmiş, Britanya'ya doğru batıya yönelmeden önce radar menzilinin dışında kalmaya özen göstermiş.\nHess, İngiltere ve Almanya arasında bir barış antlaşması müzakere etmeyi kendi üzerine almış gibi görünüyor, ancak Berlin onu bir deli olarak kınadı ve tüm siyasi görevlerinden aldı. \n\nİngiliz yetkililer yorum yapmak için hazır bulunmadı."
 news.44.t:0 "Rudolf Hess'in Uçuşu"
 news.45.a:0 "İlginç."
 news.45.b:0 "Zavallı aptal."
 news.45.c:0 "Burada ne işi vardı?"
 news.45.d:0 "Führer Yardımcısı Rudolf Hess, dün kullandığı ağır avcı uçağının İskoçya kıyılarında Kraliyet Hava Kuvvetleri tarafından düşürülmesi sonucu öldü. \n\nGörevinin tam niteliği belirsizliğini koruyor - Hess usta bir pilot olmasına rağmen tek başına uçuyordu ve uçağı silahlı görünmüyordu.\nCesedi İngiliz yetkililer tarafından bulundu, ancak Berlin'de boş bir tabutla devlet cenazesi planlandı. \n\nHitler'in eski dostunun ölümüyle gözle görülür şekilde perişan olduğu bildirildi."
 news.45.t:0 "Rudolf Hess'in Ölümü"
 news.46.d:0 "Hindenburg zeplini bugün İskoçya üzerinde patladığında dramatik bir sonla karşılaştı. \nGörünüşe göre, İngiltere ile barış müzakeresi yapmak için kişisel bir görevle Kuzey Denizi'ni tek başına geçen Führer Yardımcısı Rudolf Hess tarafından ele geçirilmişti.\nİngiliz radar istasyonları devasa hava aracını tespit etmekte zorlanmadı ve birkaç Kraliyet Hava Kuvvetleri filosu derhal konumuna yönlendirildi. Hindenburg telsize yanıt vermeyince ateş açtılar. \n\nHess paraşütle güvenli bir şekilde atladı ve şimdi Londra Kulesi'nde hapsedildi."
 news.47.b:0 "O deli adam..."
 news.47.c:0 "Ne başarmayı umuyordu ki?"
 news.47.d:0 "Hindenburg zeplini bugün İskoçya üzerinde patladığında dramatik bir sonla karşılaştı. \nGörünüşe göre, İngiltere ile barış müzakeresi yapmak için kişisel bir görevle Kuzey Denizi'ni tek başına geçen Führer Yardımcısı Rudolf Hess tarafından ele geçirilmişti.\nİngiliz radar istasyonları devasa hava aracını tespit etmekte zorlanmadı ve birkaç Kraliyet Hava Kuvvetleri filosu derhal konumuna yönlendirildi. Hindenburg telsize yanıt vermeyince ateş açtılar. \n\nHess'in kalıntıları enkazda bulundu."
 news.48.a:0 "Havacılık için bir kayıp."
 news.48.d:0 "Atlantik'i tek başına geçen ilk kadın olan ünlü havacı Amelia Earhart, navigatörü Fred Noonan ile birlikte Pasifik Okyanusu'nun ortasındaki Howland Adası yakınlarında kayboldu.\n\nİkili, çift motorlu Lockheed Electra uçaklarıyla tüm dünyayı dolaşmaya çalışırken ortadan kayboldu. \n\nKayıp havacılar için ABD Donanması ve Sahil Güvenliği tarafından bir arama yürütülüyor, ancak onları bulma umudu çok az."
 news.48.t:0 "Amelia Earhart Kayboldu"
 news.49.a:0 "Oldukça büyük bir başarı!"
 news.49.d:0 "Birçokları tarafından 'Havanın Kraliçesi' olarak bilinen ünlü havacı Amelia Earhart, navigatörü Fred Noonan ile birlikte dünyayı dolaşma uçuşunu tamamladı. \n\nPasifik'teki Howland Adası'na yaklaşırken ikilinin geçici olarak kaybolmasıyla yaşanan kısa bir korkunun ardından uçuş sorunsuz devam etti ve bu sabah Lockheed Electra'ları Oakland, Kaliforniya'ya indi.\n\nGelecek hafta Beyaz Saray'da bir tören düzenlenecek ve Earhart, başarısı için Başkan tarafından bizzat tebrik edilecek."
 news.49.t:0 "Amelia Earhart Dünyayı Dolaştı"
 news.5.a:0 "Akbabalar leşe üşüşüyor..."
 news.5.b:0 "Olması gerektiği gibi."
 news.5.c:0 "Çakallar bize başka seçenek bırakmadı."
 news.5.d:0 "Avrupa'daki mücadelenin ışığında Fransız zayıflığından yararlanan [JAP.GetNameDef], yeni hükümeti Hindiçin'deki kolonilerinin kontrolünü devretmeye zorladı! \n\nJapon birlikleri bölgedeki tüm önemli üsleri işgal etmek için şimdiden harekete geçti ve uzmanlar koloninin gelecekteki askeri seferler için bir sıçrama tahtası olarak kullanılabileceğinden korkuyor."
 news.5.e:0 "Müttefiklerimiz inisiyatif gösteriyor!"
 news.5.t:0 "[JAP.GetNameDefCap] Fransız Hindiçini'ni Talep Ediyor"
 news.55.a:0 "İşler şimdi hızla ilerliyor."
 news.55.b:0 "Blöf yapıyorlar!"
 news.55.c:0 "Polonya'nın yanındayız."
 news.55.d:0 "Almanya'nın son zamanlardaki saldırgan davranışları ışığında, Birleşik Krallık ve Fransa, Polonya ile bir askeri ittifak imzalamak zorunda hissettiler. İngiltere Başbakanı Avam Kamarası'nda şu açıklamayı yaptı:\n\n'Polonya bağımsızlığını açıkça tehdit eden ve Polonya Hükümeti'nin ulusal güçleriyle direnmesinin hayati önem taşıdığını düşündüğü herhangi bir eylem durumunda, Majestelerinin Hükümeti derhal Polonya Hükümeti'ne ellerinden gelen tüm desteği vermekle yükümlü hissedecektir. Polonya Hükümeti'ne bu yönde bir güvence verdiler.'"
 news.55.e:0 "Almanlar şimdi saldırmaya cesaret edemez!"
 news.55.f:0 "Müttefiklerimizin yanındayız."
 news.55.t:0 "İngiliz-Polonya İttifakı"
 news.56.a:0 "O zaman bu yıl savaş yok."
 news.56.b:0 "En azından şimdilik barış..."
 news.56.c:0 "Bir Dünya Savaşı'ndan daha kurtulduk."
 news.56.d:0 "Önemli bir Alman azınlığın yaşadığı Çekoslovakya'daki Sudeten bölgesi için Alman talepleri yoğunlaştı. \n\nMünih'te düzenlenen bir zirvede Almanya, İngiltere, Fransa ve İtalya, sözde 'Sudeten Krizi'ne diplomatik bir çözüm bulmaya çalıştı. Çekoslovakya katılmaya davet edilmedi. Almanya'nın Sudetenland'ı ilhak edeceği, ancak Avrupa'da daha fazla toprak kazanımı peşinde koşmayacağı bir anlaşmaya varıldı.\n\nBay Chamberlain Londra'daki kalabalıklara şöyle seslendi:\n'Bir Başbakan ikinci kez Almanya'dan onurlu bir barışla dönüyor. Zamanımız için barış olduğuna inanıyorum.'"
 news.56.e:0 "Bu bir anlaşma değil, bir diktadır!"
 news.56.t:0 "Münih Anlaşması"
 news.57.a:0 "Savaş çıkacak gibi görünüyor!"
 news.57.b:0 "Aptallar!"
 news.57.c:0 "Artık bir duruş sergileme zamanı."
 news.57.d:0 "Önemli bir Alman azınlığın yaşadığı Çekoslovakya'daki Sudeten sınır bölgesi için Alman talepleri son zamanlarda yoğunlaştı. \n\nMünih'te düzenlenen bir zirvede Almanya, İngiltere, Fransa ve İtalya, sözde 'Sudeten Krizi'ne diplomatik bir çözüm bulmaya çalıştı.\n\nAncak görüşmeler başarısız olmuş gibi görünüyor; hem İngiltere hem de Müttefikleri, askerlerinin Çekoslovakya sınırını geçmesi durumunda sonucun savaş olacağı yönünde Almanya'ya sert uyarılarda bulundu. \n\nAnlaşmazlığa barışçıl bir çözüm için zaman daralıyor gibi görünüyor."
 news.57.e:0 "Bırakın Almanlar gelsin!"
 news.57.t:0 "Sudeten Krizi"
 news.58.b:0 "Fransızlarla yakında hesaplaşacağız."
 news.58.c:0 "Fransızlar bu kez yalnız."
 news.58.d:0 "Önemli bir Alman azınlığın yaşadığı Çekoslovakya'daki Sudeten sınır bölgesi için Alman talepleri son zamanlarda yoğunlaştı. \n\nMünih'te düzenlenen bir zirvede Almanya, İngiltere, Fransa ve İtalya, sözde 'Sudeten Krizi'ne diplomatik bir çözüm bulmaya çalıştı.\n\nFransa ile İngiltere arasında bir anlaşmazlık oluştu; İngiltere Alman iddialarını makul kabul ederken, Fransa kabul etmedi. Fransızlar Çeklerle yeni bir ittifak kurdu ve askerlerinin Çekoslovakya sınırını ihlal etmesi durumunda Almanya'yı savaşla tehdit etti."
 news.58.e:0 "Almanlar şimdi saldırmaya cesaret edemez... değil mi?"
 news.58.f:0 "Özgür dünya bize güveniyor."
 news.59.a:0 "Çekler için durum vahim görünüyor."
 news.59.b:0 "İnatçı aptallar."
 news.59.c:0 "Asla teslim olmayacağız!"
 news.59.d:0 "Önemli bir Alman azınlığın yaşadığı Çekoslovakya'daki Sudeten sınır bölgesi için Alman talepleri son zamanlarda yoğunlaştı. \n\nMünih'te düzenlenen bir zirvede Almanya, İngiltere, Fransa ve İtalya, sözde 'Sudeten Krizi'ne diplomatik bir çözüm bulmaya çalıştı.\n\nİngiltere ve Fransa Alman taleplerini makul kabul ederken, konferansa davet edilmeyen Çekoslovakya bir santim bile vermeyi reddetti. \n\nŞimdi umutsuz bir savaş gibi görünen bir durumda Almanya ile tek başına yüzleşiyor."
 news.59.t:0 "Münih Diktası"
 news.6.a:0 "Cesaret edemezler... değil mi?"
 news.6.b:0 "İnatçı aptallar bu hatanın bedelini ödeyecek."
 news.6.c:0 "Kendimizi hazırlamalıyız."
 news.6.d:0 "Avrupa'daki yenilgilerinin ışığında Fransa'nın zayıflığından yararlanmaya çalışan [JAP.GetNameDef], kısa süre önce yeni Fransız hükümetine Hindiçin'deki üslerine tam erişim talebinde bulundu. \n\nBu, fiilen tüm koloninin kontrolünün Japonya'ya devredilmesi anlamına geliyordu ki Fransızlar bunu kabul edemezdi.\n\nUzmanlar, bu kararın Japon askeri misillemelerine yol açmasının muhtemel olduğunu düşünüyor."
 news.6.e:0 "Dostlarımızdan bir başka cesur hamle."
 news.60.a:0 "Barışa ne oldu?"
 news.60.b:0 "Çekler kendilerinden korunmalı."
 news.60.c:0 "Anlaştığımız bu değildi!"
 news.60.d:0 "Alman birlikleri, görünüşte Çekoslovak hükümetinin çöküşünün ardından bölgelerde düzeni yeniden sağlamak için Bohemya ve Moravya'ya girdi. \n\nPrag'da işgalci güçler, Alman Reich içinde 'özerk bir himaye bölgesi' kurulduğunu duyurdu.\n\nAlman desteğiyle Slovakya, Jozef Tiso liderliğinde bağımsız ilan edildi. Çekoslovakya ulusu artık yok."
 news.60.d_2:0 "Çekoslovakya'nın Alman ilhakından sonra, bu toprakların nasıl bölüneceği tartışılmaya devam etti, şimdi bir sonuca varılmış gibi görünüyor.\n\nAlman desteğiyle Slovakya, Jozef Tiso liderliğinde bağımsız ilan edildi."
 news.60.e:0 "Macaristan eski ihtişamına kavuşacak!"
 news.60.t:0 "Çekoslovakya'nın Kaderi"
 news.61.d:0 "Alman birlikleri kısa süre önce Bohemya ve Moravya'ya girdi; görünüşte Çekoslovak hükümetinin çöküşünün ardından bölgelerde düzeni yeniden sağlamak için. \n\nPrag'da işgalci güçler, [GER.GetNameDef] içinde 'özerk bir himaye bölgesi' kurulduğunu duyurdu. Almanya'nın rızasıyla hareket eden Macar kuvvetleri Slovakya'ya girdi ve onu Macaristan'a ilhak etti. \n\nÇekoslovakya ulusu artık yok."
 news.61.d_2:0 "Çekoslovakya'nın Alman ilhakından sonra, bu toprakların nasıl bölüneceği tartışılmaya devam etti, şimdi bir sonuca varılmış gibi görünüyor.\n\nAlmanya'nın rızasıyla hareket eden Macar kuvvetleri Slovakya'ya girdi ve onu Macaristan'a ilhak etti."
 news.62.d:0 "Alman birlikleri kısa süre önce Bohemya ve Moravya'ya girdi; görünüşte Çekoslovak hükümetinin çöküşünün ardından bölgelerde düzeni yeniden sağlamak için. \n\nPrag'da işgalci güçler, Alman Reich içinde 'özerk bir himaye bölgesi' kurulduğunu duyurdu.\n\nBratislava'da Slovakya merkezli ikinci bir himaye bölgesi de duyuruldu. Tüm Çekoslovakya fiilen Almanya'ya ilhak edildi."
 news.62.d_2:0 "Çekoslovakya'nın Alman ilhakından sonra, bu toprakların nasıl bölüneceği tartışılmaya devam etti, şimdi bir sonuca varılmış gibi görünüyor.\n\nİlhak edilen topraklar iki himaye bölgesine ayrıldı, ancak Alman kontrolünde kaldı. Uygulamada, eskisinden pek bir şey değişmedi ve Almanya Çekoslovakya'nın tamamını elinde tutuyor."
 news.63.a:0 "Bu İspanya için ne anlama gelecek?"
 news.63.b:0 "Zafere!"
 news.63.d:0 "İspanya'da bir iç savaş patlak verdi! Madrid'deki mevcut hükümeti devirmek isteyen birkaç general bir askeri bildiri yayınladı ve İspanyol Silahlı Kuvvetleri'nin büyük bir kısmı silahlanma çağrılarına yanıt verdi. \n\nBu sağcı Milliyetçi fraksiyon, denizaşırı topraklar da dahil olmak üzere İspanya'nın çoğunu işgal etti.\nSadık kuvvetler ve gönüllüler, darbeye son nefeslerine kadar direnmeye kararlı solcu Cumhuriyetçi hükümet altında toplandı. \n\nİspanya için savaş başladı."
 news.63.t:0 "İspanya İç Savaşı"
 news.64.a:0 "İlginç bir gelişme."
 news.64.b:0 "Şimdi ulusumuzu iyileştirme zamanı."
 news.64.d:0 "Son Cumhuriyetçi kalelerin teslim olmasıyla İspanya İç Savaşı sona erdi. \n\nMilliyetçiler zafer kazandı ve İspanya için yeni bir dönem başladı. \n\nSavaşın yıprattığı ülke çatışmalarda büyük zarar gördü ve yapılacak çok fazla yeniden inşa işi var."
 news.64.t:0 "İspanya İç Savaşı'nın Sonu"
 news.65.a:0 "İspanya için iyi oldu."
 news.65.d:0 "Son Milliyetçi kuvvetlerin teslim olmasıyla İspanya İç Savaşı sona erdi. \n\nCumhuriyetçiler zafer kazandı ve İspanya için yeni bir dönem başladı. \n\nSavaşın yıprattığı ülke çatışmalarda büyük zarar gördü ve yapılacak çok fazla yeniden inşa işi var."
 news.66.a:0 "Oyunlar sona erdi."
 news.66.b:0 "Dünyaya en iyi yüzümüzü gösterdik."
 news.66.d:0 "On birinci Olimpiyat Oyunları kısa süre önce Berlin, Almanya'da düzenlendi. \n\nDünyanın dört bir yanından 49 farklı ulustan sporcunun katıldığı 1936 Yaz Olimpiyatları, tarihte sınırlı canlı televizyon yayınına sahip ilk olimpiyatlar oldu. Oyunlar, etkinliğe cömertçe harcama yapan Alman rejimi için önemli bir propaganda zaferiydi.\n\nAlman sporcular 33 altın madalya kazanarak en başarılı olanlardı, Amerikalılar ise 24 madalya ile ikinci sırada yer aldı. Bunlardan dördü, Oyunların tek en başarılı sporcusu olan Jesse Owens tarafından kazanıldı."
 news.66.d.b:0 "On birinci Olimpiyat Oyunları kısa süre önce harap olmuş ve yeni yeniden inşa edilen Berlin, Almanya'nın hasarsız bölgelerinde düzenlendi.\n\nYenilenen Alman ulusal birliğinin bir sembolü olan oyunlar, aynı zamanda ulusu iç savaştan sonra yeniden inşa etmenin muazzam maliyetlerine rağmen etkinliğe cömertçe harcama yapan yeni Alman rejimi için önemli bir propaganda zaferiydi.\n\nAlman sporcular 33 altın madalya kazanarak en başarılı olanlardı, Amerikalılar ise 24 madalya ile ikinci sırada yer aldı. Bunlardan dördü, Oyunların tek en başarılı sporcusu olan Jesse Owens tarafından kazanıldı."
 news.66.t:0 "XI. Olimpiyat Oyunları"
 news.67.d:0 "On ikinci Olimpiyat Oyunları kısa süre önce Tokyo, Japonya'da düzenlendi. Artan uluslararası gerginlikler ışığında, birçok kişi Oyunların iptal edileceğinden korkuyordu, ancak durum böyle olmadı. \n\nTokyo, Olimpiyatlara ev sahipliği yapan ilk Batılı olmayan şehirdir ve özel amaçlı yapılmış bir Me 261 uzun menzilli uçağı Olimpiyat Ateşi'ni Almanya'dan yakıt ikmali yapmadan oraya taşıdı.\n\nJapon sporcular iyi bir performans sergiledi ve 14 altın madalyaları onlara Almanya ve Amerika Birleşik Devletleri'nden sonra madalya sıralamasında üçüncülük kazandırdı."
 news.67.t:0 "XII. Olimpiyat Oyunları"
 news.68.d:0 "On ikinci Olimpiyat Oyunları kısa süre önce Helsinki, Finlandiya'da düzenlendi. \n\nOyunların başlangıçta Tokyo'da yapılması planlanmıştı, ancak Japonya'nın devam eden savaş çabaları bunu imkansız hale getirdi ve Uluslararası Olimpiyat Komitesi oyunları Helsinki'ye verdi.\n\nAmerika Birleşik Devletleri'nden sporcular en çok madalyayı kazandı, ardından Almanya ve sonra İtalya geldi. Finlandiya 10 altın madalyayla dördüncü oldu."
 news.69.a:0 "Aklıselime geldiler."
 news.69.b:0 "[SOV.GetNameDefCap] genişliyor."
 news.69.d:0 "[From.GetRulingParty]'nin iktidara gelmesinden bu yana [From.GetNameDef], [SOV.GetNameDef] ile daha yakın ilişkiler kurmak için çalışıyor ve şimdi Birliğe kendisi katıldı. \n\nA Birkaç gün önce [From.GetAdjective] hükümeti ülkenin kontrolünü resmi olarak [SOV.GetNameDef]'ye teslim etti. entegre bir bölge.\n\nSovyet yetkilileri, [From.GetNameDef]'nin yakın zamanda asimilasyonuna ilişkin açıklamaları saldırgan olarak kabul etmeyi reddediyor ve \"bölgenin entegrasyonunun\" herhangi bir dış baskı olmaksızın gerçekleştiğini iddia ediyor."
 news.69.t:0 "Avrupa'da Sovyet Yayılması"
 news.7.a:0 "Bu, Asya'da başka bir savaşın başlangıcı mı?"
 news.7.b:0 "Utanç verici bir gösteri..."
 news.7.c:0 "Dünyaya bir mesaj gönderdik."
 news.7.d:0 "Sovyet ve Japon kuvvetleri kısa süre önce Mançurya sınırı boyunca büyük bir çatışmaya girdi. \n\nMoğol süvarileri tarafından desteklenen önemli bir Sovyet baskın gücünün Japonları hazırlıksız yakalayarak ağır kayıplar verdirdiği anlaşılıyor. \n\nTokyo'daki havanın gergin olduğu bildiriliyor, ancak çatışmanın açık savaşa tırmanıp tırmanmayacağını söylemek için henüz erken."
 news.7.t:0 "Sovyet - Japon Çatışması"
 news.70.d:0 "[baltic_annexation.GetRulingParty]'nin iktidara gelmesinden bu yana, [baltic_annexation.GetNameDef], [SOV.GetNameDef] ile daha yakın ilişkiler kurmak için çalışıyor.\n\nA[baltic_annexation.GetLeader] görevde kalsa da, bakanlar [SOV.GetNameDef]'ye bağlılıkları nedeniyle seçiliyor ve bakanların büyük bir kısmı Milletin egemenliği teslim edilmiştir. Sovyet yetkilileri, [baltic_annexation.GetName]'nin yalnızca Avrupa'nın küçük uluslar için giderek daha güvensiz hale gelmesine yanıt olarak koruma istediğini belirtiyor. \n\n[SOV.GetNameDef] ayrıca bu tür \"koruyuculuğu\" komşu ülkeler tarafından tehdit edildiğini hisseden herhangi bir devlete genişletmeye istekli olduklarını yineledi."
 news.70.t:0 "Avrupa'da Sovyet Etkisi"
 news.8.b:0 "İmparator için!"
 news.8.c:0 "Durumu değerlendirmeliyiz..."
 news.8.d:0 "Sovyet ve Japon kuvvetleri kısa süre önce Mançurya sınırı boyunca büyük bir çatışmaya girdi. \n\nSavaştan gelen bilgilere göre, Japonlar sınırdan saldırdıklarında Sovyetleri bir kıskaç hareketine aldı ve hayatta kalanları düzensiz bir şekilde geri çekilmeye zorladı. \n\nBu olay Moskova'yı Rus Uzak Doğusu'na daha fazla kuvvet göndermeye sevk edecek mi?"
 news.9.a:0 "Belki bu kalıcı bir barışla sonuçlanır."
 news.9.b:0 "Korkaklar kaçtı!"
 news.9.c:0 "Taktik bir geri çekilme. Daha fazlası değil."
 news.9.d:0 "Mançurya'da Japon kuvvetlerinin yığılmasının ardından, Sovyetler Birliği beklenmedik bir şekilde sınıra hemen bitişik konuşlanmış birimleri geri çekmiş görünüyor. \n\nBu, Moskova'nın Japonya ile gelecekteki bir çatışmadan kaçınma çabası olabilir; muhtemelen Rusya'nın Rus-Japon Savaşı'nda yaşadığı yenilginin acı hatırasından kaynaklanıyor."
 news.9.t:0 "Sovyet Geri Çekilmesi"
 nuke_dropped.1.a:0 "Atom Çağı gerçekten başladı."
 nuke_dropped.1.b:0 "[ROOT.GetAdjective] halkını korumak için ne gerekiyorsa yapacağız."
 nuke_dropped.1.d:0 "Tarihte ilk ve umarım son kez, [?global.nukecountry.GetNameDef] tarafından yürütülen uluslararası savaşın bir parçası olarak [From.From.GetName]'da bir nükleer bomba patlatıldı. Benzeri görülmemiş yıkım, bu yeni silahın yıkıcı gücünün bir kanıtı olarak duruyor; bu silah sadece hedeflerine yapabilecekleriyle değil, aynı zamanda onu konuşlandıran için ve insanlığın kendisi için taşıdığı sonuçlarla da korkuluyor.\n\nDünya nefesini tutmuş bir sonraki adımın ne olacağını bekliyor. Bu, [From.From.Owner.GetNameDef]'i daha fazla terörden kaçınmak için teslim olmaya mı zorlayacak, yoksa bu tür önlemlere başvuranlara karşı misilleme yapma kararlılıklarını mı güçlendirecek?"
 nuke_dropped.1.t:0 "[From.From.GetName]'nın Atom Bombasıyla Bombalanması"
 nuke_dropped.10.a:0 "Işıklar şehri söndü."
 nuke_dropped.10.b:0 "Daha dün, sanki her zaman Paris'imiz olacakmış gibiydi."
 nuke_dropped.10.d:0 "Bugün, [?global.nukecountry.GetNameDef] tarafından fırlatılan bir nükleer aygıt Paris şehri üzerinde patlatılarak yaygın yıkıma ve sayısız kayba neden oldu. Başkenti, yüzyıllardır süren savaşlara ve devrimlere rağmen şimdiye kadar yaşadığı en yıkıcı saldırı olabilecek bir saldırıya maruz kalırken Fransa şoktaydı. Parisliler belki fethi beklemişlerdi, ama mutlak, acımasız bir ıssızlığı değil.\n\nArc de Triomphe kalıntılarının yanından Champs-Élysées'deki herhangi bir zafer geçidi, şehrin mevcut durumunda pek olası görünmüyor. Belki önümüzdeki on yıllar yeni bir Paris'in doğuşuna tanık olacak, ancak kamuoyunun zihnindeki Paris, Belle Époque'da inşa edilen şehir sonsuza dek gitti."
 nuke_dropped.10.t:0 "Paris'in Atom Bombasıyla Bombalanması"
 nuke_dropped.11.a:0 "Nükleer bir kış Moskova'yı daha zor bir hedef haline getirmez mi?"
 nuke_dropped.11.b:0 "Sahip olduğumuz her şehri yakabilirler, ama asla onları alamayacaklar."
 nuke_dropped.11.d:0 "Birçok kişinin fethetmeye çalışıp başaramadığı bir şehir olan Moskova, bugün [?global.nukecountry.GetNameDef] tarafından bir nükleer saldırının hedefi oldu. Patlama, [From.From.Owner.GetAdjective] liderliğinin kalbine yöneltilmişti ve Kremlin patlamayla neredeyse tamamen yok oldu.\n\n[From.From.Owner.GetLeader], son zamanlarda olası ve imkansız tüm tehditlere karşı daha bilinçli ve korkak hale gelerek zamanında tahliye edildi ve hayatta kaldı. Ancak, [From.From.Owner.GetName]'nin enginliği bile böylesine acımasız bir düşmandan kaçmak için yeterli olmayabilir. Gerçekten de, bu devam ederse, ulus yakında sadece iki tür çorak araziden oluşacak: Zaten var olanlar ve düşmanları tarafından yaratılanlar."
 nuke_dropped.11.t:0 "Moskova'nın Atom Bombasıyla Bombalanması"
 nuke_dropped.12.a:0 "Danimarka devletinde bir şeyler ışınlanmış."
 nuke_dropped.12.b:0 "Şehir daha önce de yandı, ama yok olmadı."
 nuke_dropped.12.c:0 "Plütonyumla Danimarkalıları dize getireceğiz!"
 nuke_dropped.12.d:0 "Bugün, Kopenhag şehri [?global.nukecountry.GetNameDef] tarafından fırlatılan bir nükleer patlamayla vuruldu. Danimarka'nın tarafsızlığı sayesinde Büyük Savaş'ta yıkımdan kurtulduktan sonra büyüyen başkent, Napolyon Savaşları'ndan bu yana buna yakın yıkıcı bir saldırı yaşamamıştı. Çevredeki Öresund bölgesi de önemli miktarda serpinti gördü ve hayatta kalanlar daha fazla saldırı korkusuyla Fyn'e ve anakaraya kaçmaya başladı.\n\nKral X. Christian'ın nerede olduğu şu anda bilinmiyor ve ulusun morali saldırıdan ciddi şekilde zarar gördü. Bunun Avrupa'nın en eski uluslarından biri için sonun başlangıcı olup olmayacağını zaman gösterecek."
 nuke_dropped.12.t:0 "Kopenhag'ın Atom Bombasıyla Bombalanması"
 nuke_dropped.13.a:0 "Bununla İsveç tarafsızlığı sadece bir anı olacak."
 nuke_dropped.13.b:0 "İsveç kaplanı çizgilerini kaybetmeyecek!"
 nuke_dropped.13.d:0 "Kuzeyin gururlu Venedik'i olan güzel Stockholm şehri, bugün [?global.nukecountry.GetNameDef] tarafından fırlatılan bir nükleer bombayla vuruldu. Geçmişte tarafsız kalmak için gösterdikleri tüm çabalara rağmen, İsveçliler şimdi uluslararası çatışmanın nihai bedelini ödedi. Patlamanın merkez üssü, gelecekteki gelişim ve büyük inşaat projeleri için tasarlanan güney merkez Stockholm'ün ortasındaydı ve şimdi geri dönülmez bir şekilde yok oldu.\n\nŞehrin büyük bir kısmı tanınmaz halde, ancak Slussen'deki eski yapılar patlamadan beklenenden daha iyi kurtulmuş gibi görünüyor. Şehrin direncine bir anıt olarak sonsuza dek dokunulmadan bırakılmasına karar verildi."
 nuke_dropped.13.t:0 "Stockholm'ün Atom Bombasıyla Bombalanması"
 nuke_dropped.2.a:0 "Bu savaş bitmeden daha kaç kişi düşecek?"
 nuke_dropped.2.b:0 "Kurbanlara yardım etmek için hızla hareket etmeliyiz."
 nuke_dropped.2.d:0 "\"Sokaklar cehennemden bir sahne gibiydi.\"\n - Kuniyoshi Aikawa\n\nBugün, Hiroshima şehri üzerinde 580 metre yükseklikte [?global.nukecountry.GetNameDef] tarafından fırlatılan bir nükleer bomba patlatıldı. Şehrin üçte ikisinden fazlası anında yok edildi. Şehrin depremlere dayanacak şekilde inşa edilmesine rağmen, patlamadan yalnızca birkaç sağlam yapı kurtuldu.\n\nHalkın zihninde atom bombasının gücü abartılırken, silahın insani maliyeti azaltıldı. Her iki taraf da olayın dehşetini düşünmek istemiyor ancak mirası, göz açıp kapayıncaya kadar kaybedilen hayatlardan ve kalıcı sonuçlarından biri olacak."
 nuke_dropped.2.t:0 "Hiroşima'nın Atom Bombasıyla Bombalanması"
 nuke_dropped.3.a:0 "Bu, [From.From.Owner.GetAdjective] teslimiyetine yol açacak mı?"
 nuke_dropped.3.b:0 "Nagazaki'nin kurtulacağını ummuştuk."
 nuke_dropped.3.d:0 "Başlangıçta Kokura için tasarlanan bir nükleer bomba, bugün Nagazaki üzerinde patlatıldı. Hava koşulları uçakların görevlerini değiştirmesine neden oldu; duman, bulutlar ve teknik zorlukların birleşimi, tarihi değiştirebilecek bir olayda belirleyici faktörler oldu.\n\nBombanın etkileri, şehrin bir vadideki konumu nedeniyle bir ölçüde sınırlandı, ancak hasar hala şiddetli. Bazı askeri tesisler vuruldu, ancak felaket boyutundaki sivil kayıplar bunları çok geride bırakıyor. Bu silahın uzun vadeli etkilerini kesin olarak bilmemiz on yıllar alabilir. [?global.nukecountry.GetNameDef] tarafından oluşturulan tehdidin sınırı yok."
 nuke_dropped.3.t:0 "Nagazaki'nin Atom Bombasıyla Bombalanması"
 nuke_dropped.4.a:0 "Bugün, Berlinli olmadığıma seviniyorum."
 nuke_dropped.4.b:0 "Düşmanlarımız ulusun kalbine saldırdı!"
 nuke_dropped.4.d:0 "Bugün, [GetDateText] tarihinde, Alman başkenti Berlin, [?global.nukecountry.GetNameDef] tarafından fırlatılan bir nükleer patlamayla vuruldu. Şehir, bu savaşta ve son savaşta birkaç saldırıya maruz kalmıştı, ancak diğer her şey bununla karşılaştırıldığında sönük kalıyor. Otuz Yıl Savaşları'ndan bu yana Berlin benzer bir yıkım görmemişti - büyümesi göz önüne alındığında, bu imkansız olarak görülüyordu.\n\nFührerbunker, bombanın planlanan merkez üssünden uzağa patlaması nedeniyle en azından kısmen hayatta kalmış gibi görünüyor ve [From.From.Owner.GetLeader]'in hala hayatta olduğu, ancak öfkeli olduğu söyleniyor. Ancak [From.From.Owner.GetAdjective] liderlerinin nasıl tahliye edileceği ve serpintiden korunup korunamayacakları başka bir mesele."
 nuke_dropped.4.t:0 "Berlin'in Atom Bombasıyla Bombalanması"
 nuke_dropped.5.a:0 "Nükleer bir patlama dalgası karşısında metanetli olmak zor."
 nuke_dropped.5.b:0 "Tanrı Kralı Korusun!"
 nuke_dropped.5.d:0 "Bugün Londra şehri bir nükleer patlamayla harap oldu. Şehrin uçaksavar savunmalarına rağmen, [From.From.Owner.GetNameDef], [?global.nukecountry.GetNameDef] tarafından başlatılan bu saldırıya hazırlıklı değildi. [GetDateText]'te Big Ben son kez çaldı, patlamayla erimişti. İlk raporlar Buckingham Sarayı'nın tamamen yerle bir olduğunu ve kraliyet ailesinin nerede olduğunun bilinmediğini gösteriyor.\n\nAncak [From.From.Owner.GetLeader]'in hayatta kaldığı doğrulandı ve bugün ilerleyen saatlerde radyo için coşkulu bir konuşma hazırlıyor. Moral tüm zamanların en düşük seviyesindeyken, İngiliz halkının buna -ya da çok etkileyici bir teslimiyete- şiddetle ihtiyacı var."
 nuke_dropped.5.t:0 "Londra'nın Atom Bombasıyla Bombalanması"
 nuke_dropped.6.a:0 "Böyle bir savaşta mirasın ve güzelliğin hiçbir anlamı yok."
 nuke_dropped.6.b:0 "Eğer eskiyi yok ederlerse, yeniyi inşa edeceğiz."
 nuke_dropped.6.d:0 "Önemli bir [From.From.Owner.GetAdjective] sanayi merkezi olan Kyoto şehri, bugün [?global.nukecountry.GetNameDef] tarafından fırlatılan bir nükleer bombayla vuruldu. Şehrin bir entelektüel merkez olarak kabul edilmesi nedeniyle hedef olarak seçildiği tahmin ediliyor.\n\nKyoto'nun güzelliği ve tarihi önemi, birçok kişinin bombadan kurtulacağını varsaymasına neden olmuştu, ancak görünüşe göre böyle bir yere yıkım yağdırmanın dehşeti, saldırının psikolojik etkisini artırarak daha çok bir fayda olarak görülmüş. Şehrin vadideki konumu patlamayı bir ölçüde sınırladı, ancak eski İmparatorluk Sarayı ve birçok sanayi binası tamamen yok oldu."
 nuke_dropped.6.t:0 "Kyoto'nun Atom Bombasıyla Bombalanması"
 nuke_dropped.7.a:0 "Bu Japon İmparatorluğu'nun sonu anlamına mı geliyor?"
 nuke_dropped.7.b:0 "[From.From.Owner.GetLeader] yaşadığı sürece İmparatorluk da yaşar."
 nuke_dropped.7.d:0 "Bugün, [?global.nukecountry.GetNameDef] tarafından Japon İmparatorluğu'nun kalbine bir nükleer saldırı yöneltildi. Başkent Tokyo, yangın bombalamasının hedefi olması beklenmesine rağmen, bu yeni silahın öncelikli hedefi olacağı hiç düşünülmedi. Ancak nihayetinde, belki de artık yıkılmış olan yeni başkentin ve İmparatorluk Sarayı'nın önemi nedeniyle, şehre daha da tüketen bir ateş düştü.\n\n[From.From.Owner.GetLeader]'ın hayatta kaldığı bildirilse de, olay Japonya'nın düşmanlarının ne kadar ileri gitmeye istekli oldukları konusunda soruları gündeme getirdi. Savaş bununla bitmezse, hangi hedefler kalıyor? Tehdit edilecek ne kaldı?"
 nuke_dropped.7.t:0 "Tokyo'nun Atom Bombasıyla Bombalanması"
 nuke_dropped.8.a:0 "Tek ulus, bölünmez, bir atoma karşı, bölünebilir."
 nuke_dropped.8.b:0 "Kartal küllerinden bir anka kuşu gibi yeniden doğacak."
 nuke_dropped.8.d:0 "Bugün Amerika Birleşik Devletleri'nin başkenti üzerinde bir nükleer bomba patlatıldı. ABD'nin siyasi merkezine ve tarihi mirasına açıkça yönelik bir saldırıda, Beyaz Saray, Capitol ve bir dizi anıt ve abide, düşmanları [?global.nukecountry.GetNameDef] tarafından yeryüzünden silindi. Yüz yıldan fazla bir süre önceki Washington Yangını bile, bu yıkıcı silahın şehre verdiği tahribatla karşılaştırıldığında sönük kalıyor.\n\nBaşkan [From.From.Owner.GetLeader] güvenli bir yere götürülmüş olsa da, ulus temelinden sarsıldı. Hiç şüphe yok ki, ABD böyle bir silaha sahip olan ilk ve tek ülke olmayı umuyordu. Bu umutlar şimdi mümkün olan en kötü şekilde paramparça oldu."
 nuke_dropped.8.t:0 "Washington D.C.'nin Atom Bombasıyla Bombalanması"
 nuke_dropped.9.a:0 "Bomba Iacta Est!"
 nuke_dropped.9.b:0 "Roma bir günde yeniden inşa edilmeyecek..."
 nuke_dropped.9.d:0 "Bugün Roma şehri bir nükleer patlamayla sarsıldı ve [?global.nukecountry.GetNameDef] tarafından yapılan benzeri görülmemiş bir saldırıyla dünya genelindeki insanları şok etti. Tarihi ve sanatsal hazineleri nedeniyle, birçok kişi antik şehrin böylesine ayrım gözetmeyen bir yıkımın hedefi olacağını asla düşünmemişti. Vatikan Şehri'nin de kısmen yıkılması ve Papa'nın nerede olduğunun bilinmemesiyle, olay sadece İtalyanları değil, dünya genelindeki Katolikleri de dehşete düşürdü.\n\nRoma'nın son on yıldaki hızlı büyümesi saldırıyla neredeyse tamamen yok oldu. Bir süreliğine, şehrin savaş bittikten sonra ulusun toparlanmasına yardımcı olabileceği düşünülüyordu. Bu umutlar şimdi birçok insanla birlikte toza dönüştü."
 nuke_dropped.9.t:0 "Roma'nın Atom Bombasıyla Bombalanması"
 poland.1.a:0 "Mihver'i bir tehditten bir müttefike dönüştürme zamanı."
 poland.1.b:0 "Sovyetlerle diplomatik olarak çalışmak daha iyidir."
 poland.1.d:0 "Gdansk'ı Almanlara bırakmak zorunda kaldıktan sonra, şimdi egemenliğimizi tehdit eden iki imparatorluk arasında bir kıskaçtayız. Batıda toprak kaybederken ve Müttefiklerin bizi Alman saldırganlığından koruyacağına güvenemezken, Alman hırslarıyla aynı hizaya gelmeyi ve şimdi [SOV.GetNameDef]'e dahil olan eski Lehistan-Litvanya Birliği'nin bazı kısımlarını geri almayı düşünebiliriz. Tarafsız kalırsak kolay bir av olacağız ve Polonya'nın bir başka paylaşımını görmek için çok fazla savaştık."
 poland.1.t:0 "Doğuya Doğru Genişleme"
 poland.10.a:0 "[Root.GetName] ve [From.GetName] bugün kardeş olarak duruyor."
 poland.10.d:0 "Ülkelerimizi her yönden çevreleyen tehditlere karşı birlik ihtiyacını kabul eden [From.GetLeader] bugün dünyaya [From.GetName]'nin karşılıklı güvenliğimiz uğruna [Root.GetName] ile bir antlaşma imzaladığını duyurdu."
 poland.10.t:0 "[From.GetName], [Root.GetFactionName]'ne Katılıyor!"
 poland.11.a:0 "Tek güvenlik birlikte durmaktır."
 poland.11.d:0 "Aptalca bir kendini koruma hayaliyle [From.GetLeader] bugün, [From.GetName]'nin güçlü komşularına tehdit olarak görülebilecek herhangi bir diplomatik eylemden kaçınacağını duyurdu. Bu nedenle [Root.GetFactionName]'ne katılma talebimizi reddetti."
 poland.11.t:0 "[From.GetName], [Root.GetFactionName]'ne Katılmayı Reddediyor"
 poland.12.a:0 "Hepimiz onun cesaretinden ilham alalım."
 poland.12.d:0 "Er Wojtek, ikmal hatlarımızın benzersiz derecede değerli bir üyesi olduğunu kanıtladı. Çatışmanın sıcağında bile, başının, kollarının ve bacaklarının üzerinden vızıldayan hafif silah ateşine rağmen tek bir mühimmat sandığı bile düşürmedi. Bu cesur asker, topçularımızın ateş etmeye devam etmesini sağladı ve böylece düşmanı yenmede etkili oldu. Bunun bir sonucu olarak Wojtek'in terfi ettirilmesine karar verildi."
 poland.12.t:0 "Wojtek Asla Sandık Düşürmez"
 poland.2.a:0 "Doğuyu barışçıl bir şekilde bırak."
 poland.2.b:0 "[ROOT.GetName] savaşmadan teslim olmayacak!"
 poland.2.d:0 "Doğu topraklarımız üzerindeki iddialarını yeniden teyit ettikten sonra, [FROM.GetNameDef] şimdi bu toprağı onlara devretmemiz için bize baskı yapıyor ve bunun başka bir işgalden ve olası ilhak veya paylaşımdan kaçınmanın tek yolu olduğunu öne sürüyor.\n\nNormalde, bu tür tehditlere kolayca boyun eğmek söz konusu olamazdı, ancak [FROM.GetNameDef] tek endişemiz olmaktan çok uzak. Taleplerini kabul edersek, doğu cephesinde endişelenmemiz gereken daha az şey olabilir, ancak bu aynı zamanda doğu cephesini önemli ölçüde daha batıya konumlandıracaktır."
 poland.2.t:0 "[FROM.GetNameDefCap] Doğuyu Talep Ediyor"
 poland.3.a:0 "İddiamızı tanıdıkları sürece sorun yok."
 poland.3.d:0 "[FROM.GetNameDef]'e doğu toprakları üzerindeki haklı iddialarımıza boyun eğmesi için baskı yaptıktan sonra, daha fazla çatışma olmadan talep ettiğimizi devretmeyi kabul ettiler. Ancak, gelecekte ulusla daha güçlü bir bağ kurma umutlarımızdan muhtemelen vazgeçebiliriz. Bize hak ettiğimizi verdikten sonra, mümkün olduğunca az temas kurmamızı umuyor gibi görünüyorlar."
 poland.3.t:0 "[FROM.GetName] Doğuyu Terk Ediyor"
 poland.4.a:0 "Bize karşı durabileceklerini mi sanıyorlar?"
 poland.4.d:0 "[FROM.GetNameDef] ile anlaşmazlığı barışçıl bir şekilde çözme çabalarımıza rağmen, doğu topraklarını devretmeyi reddettiler ve bizi onları talep etmenin tek yolunun savaş olduğu bir konuma zorladılar. Açıkçası, bu sorunlu ülke şans verildiğinde bile bir paylaşımdan kaçınmayacak."
 poland.4.t:0 "[FROM.GetName] Doğuyu Terk Etmeyi Reddediyor"
 poland.5.a:0 "Çok geç olmadan şimdi kabul etmeliyiz."
 poland.5.b:0 "[ROOT.GetName] Henüz Kaybolmadı!"
 poland.5.d:0 "[FROM.GetNameDef]'in doğu Polonya üzerindeki hakkını iddia etmesinden sonra, başka bir saldırının yakın olduğunu varsaydık. Ancak, [FROM.GetAdjective]lerden gelen son bir teklif aksini gösteriyor. Görünüşe göre, iddia edilen toprağı devredersek, bir ittifaka katılmamıza izin vermeye istekliler. Dahası, Almanya ile bir savaş durumunda, batıda yeni topraklar verilerek kaybımızın telafi edileceğine söz veriyorlar.\n\nBu beklediğimizden daha iyi bir teklif olsa da, bu sözde gelecekteki savaşın peşinden gidilip gidilmeyeceğini bilemeyiz. Belki de [FROM.GetNameDef] sadece kolay bir toprak kapma peşinde ve bizi kendi etki alanlarına zorluyor. Yine de, güvenebileceğimiz en iyi koruma bu olabilir."
 poland.5.t:0 "[FROM.GetNameDefCap] Koruma Teklif Ediyor"
 poland.6.a:0 "Almanya'ya karşı bir müttefik, başka bir paylaşımdan çok daha iyidir."
 poland.6.d:0 "[FROM.GetNameDef]'i kanatlarımızın altına alıp batıda gelecekteki fetihlere yönlendirme teklifimiz, doğudaki topraklar karşılığında başarılı bir yaklaşım oldu. Başarılı bir savaş durumunda Almanya'dan bir pay ve korumamız vaat edildiğinde, doğu topraklarını barışçıl bir şekilde devretmeyi kabul ettiler."
 poland.6.t:0 "[FROM.GetNameDefCap] Korumayı Kabul Ediyor"
 poland.7.a:0 "Satın alınamayan şey zorla alınmalıdır."
 poland.7.d:0 "Mümkün olan en cömert teklifi yapmamıza, [FROM.GetNameDef]'in doğu toprağını gelecekteki bir Almanya payı vaadi karşılığında devredeceği bir anlaşma girişiminde bulunmamıza rağmen, [From.GetLeader] diplomatik çabalarımızı reddetti. [FROM.GetNameDefCap] zor yolu seçti; bizim için, ama daha da çok kendileri için."
 poland.7.t:0 "[FROM.GetNameDefCap] Korumayı Reddediyor"
 poland.8.a:0 "Koşullar altında umabileceğimizin en iyisi batıya bir kaymaydı."
 poland.8.d:0 "Daha önce anlaşıldığı gibi, doğu Almanya topraklarının [SOV.GetNameDef] tarafından ilhak edilmesinin ardından, bunların bir kısmı doğu Polonya'nın [SOV.GetNameDef]'e geçmişteki devrinin telafisi olarak [POL.GetAdjective] kontrolüne geçecektir."
 poland.8.t:0 "[POL.GetName]'ne Doğu Almanya Verildi"
 poland.9.a:0 "Durum karşılıklı memnuniyetimize göre çözülmüş görünüyor."
 political.1.a:0 "Hükümetin içinde bile bu tür fikirleri destekleyenler olabilir."
 political.1.a.tt:0 "Komünist bir darbe için iç destek şansını artırır."
 political.1.b:0 "Halk için bir hareket halktan destek aramalıdır."
 political.1.b.tt:0 "Komünist bir ayaklanma için halk desteği şansını artırır."
 political.1.d:0 "'Dünyanın dört bir yanında işçiler zalimlerine karşı ayaklanırken, [Root.GetName]'de sınıf bilincine ulaştığını iddia edenler boş boş oturup, ancak devrimin bizi kurtarabileceği kadar baştan aşağı yozlaşmış bir siyasi sistemin içinden değişim gelmesini bekliyor!'\n\n[Root.GetAdjective] komünist hareketindeki yeni sesler böyle konuşuyor. [Root.GetRulingParty]'nin yönetimini burjuvazinin diktatörlüğü olarak nitelendirerek, ne pahasına olursa olsun iktidardan indirilmesi çağrısında bulunmaya başladılar. Bu araçların içeriden mi yoksa dışarıdan mı geleceği henüz belli değil."
 political.1.t:0 "Yükselen Komünizm"
 political.10.a:0 "İktidarı ele geçirmekte tereddüt edenin iktidar iradesi anlamsızdır."
 political.10.b:0 "Önce halkı birleştirmeli, sonra onları yönetmeliler."
 political.10.d:0 "Faşist hareketin milliyetçi duyguları canlandırma ve geçmişin zaferlerini yeniden yaşatma çabaları bazı başarılar görse de, bu fikirlere karşı direniş yüksek kalmaya devam ediyor. Mevcut yönetimi devirmeyi planlayan generaller, [Root.GetAdjective] nüfusunun [Root.GetFascistParty]'ne olan güven eksikliğinden hayal kırıklığına uğradılar.\n\n[Root.GetLeader]'den halkın sonunda bıkacağından emin olmaya devam ediyorlar, ancak hangi eylem yolunu izleyecekleri konusunda bölünmüş durumdalar. Bazıları, [Root.GetName]'nin düşmanları harekete geçmeden önce şimdi bir darbe yapılmasını istiyor. Ancak, halk desteği sınırlıyken bunu yapmak ulusu iç savaşa sürükleyecektir."
 political.10.t:0 "Faşizm İçin İç Savaş"
 political.11.a:0 "Sadece ülkeye ihanet edenlerin korkacak bir şeyi var."
 political.11.d:0 "Siyasi ve askeri olan faşizmde her zaman iç içe geçmiştir. Büyüyen siyasi hareketine paralel olarak, faşist partiler hem iç hem de dış tehditlere karşı koruma sağlamak için paramiliter örgütler kurmaya başladılar; iç tehditler siyasi muhalifleridir. Birçok kişi bu gelişmeyi endişe verici bulsa da, militarist coşku dalgası silahlı kuvvetlerimize katılan gönüllü miktarında bir artışa yol açtı.\n\nHareketin siyasi liderleri, muhaliflerinin korkmak için nedenleri olduğunu belirttiler. Ordunun birkaç düzeyde bu kadar açıkça siyasi unsurlar tarafından nüfuz edilmesiyle, [Root.GetName]'nin düşmanları ve faşizmin düşmanları giderek birbirine benzemeye başlıyor."
 political.11.t:0 "Faşist Saldırı Tümenleri Kuruluyor"
 political.12.a:0 "Kızıl tehdide karşı öncü olacağız!"
 political.12.d:0 "'[Root.GetLeader] size [Root.GetName]'nin güvende ve birleşik olduğuna inandırmak isterdi. Komşumuzda bir yılan kıvrılmışken halkımızın zihinlerinin böyle yalanlarla zehirlenmesi şaşırtıcı değil! Sınırımızın hemen ötesine bakın, komşularımızın komünizm adına birbirlerine düştüğünü, ulusların sonunu ilan ettiğini görün. Bizim ulusumuzu da ne zaman ölü ilan edecekler? [Root.GetRulingParty] bizi bu tehditten koruyacak mı?'\n\n[Root.GetName]'deki faşist hareketin büyümesi, komünist devrimin yakınlığıyla desteklendi. Normalde faşizmi başka bir yanlış yönlendirilmiş ideolojik deney olarak bir kenara atabilecek birçok ılımlı, bunu kendileri için de çok gerçek bir endişe olarak görüyor. Komşularımızın komünizmi ile faşist bir rejim arasında bir seçim yapmak zorunda kalırlarsa, açıkçası ikincisini tercih ederlerdi. Hatta aktif olarak desteklemeye istekli bile olabilirler."
 political.12.t:0 "Komünizm Tehdidi"
 political.13.a:0 "Bunu başlangıç olarak kendi içimizde tartışabiliriz."
 political.13.a.tt:0 "Seçim düzenlemek için iç destek şansını artırır."
 political.13.b:0 "Haklı olduğumuzu bildiğimize göre, düşmanlarımızın daha açık konuşmasına izin verebiliriz."
 political.13.b.tt:0 "Halkın demokrasiye destek vermesi ve bir muhalefet oluşturması şansını artırır."
 political.13.d:0 "'Eğer halkın sesini kısarsak, herhangi birimiz nasıl [Root.GetName]'nin sesi olduğumuzu iddia edebiliriz? Eğer muhalefetten korkarsak, kamuoyu önünde kınanmaktan veya halk oyuyla devrilmekten korkarsak, aslında kendi vatandaşlarımız tarafından nefret edilmekten ve aşağılanmaktan korkarız. [Root.GetRulingParty]'nin ilkelerine gerçekten bu kadar az mı güveni var?'\n\nHükümette dikkatli ve gevşek bir şekilde örgütlenmiş, ancak tutkulu bir hizip, devlet düşmanlarına karşı daha az baskıcı politikalar için bastırmaya başladı. Halkın referandumlar ve yerel parti toplantıları yoluyla karar alma süreçlerine dahil olmasını istiyorlar, bu mevcut gündemin geleceğini riske atsa bile."
 political.13.t:0 "Demokrasiye Doğru Adım"
 political.14.a:0 "Seçim her zaman özgürlük ve ölüm arasında olmak zorunda değildir."
 political.14.a.tt:0 "Politika çoğunluk desteğine sahip olduğunda hükümet seçim düzenleyebilir."
 political.14.c:0 "Bir referanduma ihtiyacımız var."
 political.14.d:0 "Şaşırtıcı bir şekilde, daha fazla referandum ve rejimin muhaliflerine yönelik daha az baskıcı önlemler çağrısı, iç parti tartışmalarında bir miktar destek gördü. [Root.GetRulingParty] liderliği şüpheci kalsa da, birkaç etkili üye bir değişikliği destekledi.\n\nBelki pratikte pek bir şeyin değişmeyeceğine güveniyorlar ya da belki de birçok muhalifinin iddia ettiği gibi gizlice parti davasına ihanet ediyorlar. Ne olursa olsun, halktan böyle değişiklikler için bir çağrı gelirse, [Root.GetName]'nin bazı liderleri uzlaşmaya hazır."
 political.14.e:0 "Bu da geçer."
 political.14.t:0 "[Root.GetRulingParty] Demokrasiyi Tartışıyor"
 political.15.a:0 "Hareket, baskının yokluğunda doğal olarak büyüyor gibi görünüyor."
 political.15.d:0 "[Root.GetRulingParty] karşıtı ne tür propagandanın kamuya açık olarak yayılabileceğine dair kısıtlamaların gevşetilmesi, tahmin edilebileceği gibi, kamuoyundaki muhalif ifadelerde bir artışa yol açtı. Organize gösteriler ve broşürler şimdiye kadar çoğunlukla akademik kurumlarda ve [Root.GetName]'nin daha talihsiz bölgelerinden bazılarında bulunuyor, ancak hareketin yayıldığına şüphe yok.\n\nUlusun liderleri bu konuda bölünmüş durumda. Parti liderliği üzerinde demir bir yumrukla hakimiyet kuran [Root.GetLeader]'in kamuoyu tartışmasını çeşitlendirmeye pek niyeti yok. Ancak ilk adımlar zaten atıldı ve geri dönüş olmayabilir."
 political.15.t:0 "Demokratik Muhalefet Oluşuyor"
 political.16.a:0 "Reform gerçekleşiyor olsa bile, bu itaatsizliği bastırarak gücümüzü göstermeliyiz."
 political.16.b:0 "Halkın sesi duyulsun."
 political.16.d:0 "Bir zamanlar sınırlı alanlarla kısıtlı olan kamuoyu muhalefeti gösterileri şimdi yaygınlaştı. İnsanlar sokaklarda toplanırken, [Root.GetRulingParty] kendini bir yol ayrımında buluyor. Bu propagandanın yayılmasına izin vermeye devam edersek, hem partinin kendi içinden hem de muhalefetten önerilen referandumlar, halkın desteğine sahip olmadığımızı gösterebilir. Uğruna çabaladığımız birlik, bize karşı birleşmiş bir fikir çoğulluğuna yerini bırakıyor."
 political.16.t:0 "Halk Seçim Talep Ediyor"
 political.17.a:0 "[Root.GetRulingParty]'ne sadık olanlar şimdi kararı destekleyecektir."
 political.17.b:0 "Reformların bir seçim yapılmadan önce daha geniş bir desteğe ihtiyacı var."
 political.17.d:0 "[Root.GetName]'de ifade ve toplanma özgürlüğü giderek daha fazla kabul görmeye başladıkça, [Root.GetRulingParty] içinde seçim yapılması çağrısında bulunan hizip, gizli komploculardan kamuoyu tarafından desteklenen reformculara dönüştü. [Root.GetLeader]'in protestolarına rağmen, ülke son aylarda yavaş ama istikrarlı bir şekilde demokrasiye doğru ilerliyor ve bir seçim şimdi doğal bir sonraki adım gibi görünüyor.\n\nAncak, [Root.GetAdjective] vatandaşlarının hepsi demokratik reformlardan yana değil. Parti içinde hala istikrarlı bir gelişmeyi sağlayana kadar seçimi bekletip bekletmeme konusunda tartışmalar var."
 political.17.t:0 "[Root.GetName]'de Halk Seçimi"
 political.18.a:0 "Bu nefret dolu hareketi bastırın!"
 political.18.b:0 "Onlara aldırış etmeyin."
 political.18.c:0 "Eğer halk istiyorsa, referandumu yaparız."
 political.18.d:0 "Hızla büyüyen [Root.GetAdjective] faşist hareketi, iktidarı ele geçirmeden önce çoğunluk desteğine ihtiyaç duyduklarını hiçbir zaman iddia etmedi; yönetimleri kurulduktan sonra ulusu kendi liderlikleri altında birleştirmeye güveniyorlardı. Ancak, görünüşe göre halk destekleri hızla arttı. Birçok faşist şimdi [Root.GetLeader]'i ikiyüzlülükle suçluyor; halkın isteklerini temsil ettiğini iddia ederken gerçekte kitlelere kulak tıkadığını söylüyorlar.\n\nReferandum çağrısı, [Root.GetRulingParty] üyeleri tarafından şimdiye kadar sistemi bozmaya yönelik tipik girişimler olarak bir kenara itildi, ancak en azından bu siyasi bir önlem. Şimdi harekete geçmezsek, faşistler iktidara giden daha iyi bir yol olarak şiddetli mücadeleyi seçebilirler."
 political.18.t:0 "Faşistler Referandum Talep Ediyor"
 political.19.a:0 "[Root.GetAdjective] karşıtı faaliyetler durdurulmalı!"
 political.19.b:0 "Onları görmezden gelin, sadece sorun çıkarıyorlar."
 political.19.c:0 "Referandum kanlı bir isyandan daha iyidir."
 political.19.d:0 "Marksist fikirler [Root.GetName]'de uzun zaman önce kök saldı, ancak son zamanlarda çok daha yaygın bir destek gördü. Hareket siyasi teorinin dışına çıkarak siyasi pratiğe yayıldı; hoşnutsuz işçiler ve hatta bazı tanınmış ünlüler desteklerini dile getirdi. Komünistler buna sınıf bilinci diyor. [Root.GetRulingParty] ise bunu isyanlara ve vatana ihanete giden hızlı bir yol olarak adlandırıyor.\n\n[Root.GetLeader]'in talep ettikleri reformları uygulamaya istekli olduğuna pek inanmayan daha sesli komünistler, mevcut hükümetin görevden alınması için derhal bir referandum çağrısında bulundular. Bu kitle hareketinin ivmesini tersine çevirebilsek de, bunu yapmamak şüphesiz daha popüler komünist görevden alma yöntemine yol açacaktır: Devrim."
 political.19.t:0 "Komünistler Referandum Talep Ediyor"
 political.2.a:0 "Onları da birçok nedenden dolayı yakından izleyeceğiz."
 political.2.a.tt:0 "Halk desteği yeterliyse bir darbe gerçekleştirilebilir."
 political.2.d:0 "[Root.GetRulingParty]'nin parti çizgisi devrimci sosyalizme şiddetle karşı çıkmak ve ulusun radikal sol kanat unsurlarını dikkatle izlemek olsa da, hükümetteki bazı kişiler bu olasılığa daha açık. En azından, tam ölçekli bir iç savaş riski olmadan komünistlerden çözüm bekleyen halkın endişelerini gidermek için bir alan görüyorlar.\n\n[Root.GetLeader]'e sadık kalanlar tarafından hain olarak görülseler de, bu muhalif sesler devrim gelirse nispeten kansız bir geçişi sağlayacak olanlar olabilir."
 political.2.t:0 "Hükümette Marksist Sempatiler"
 political.20.a:0 "Onları toplayın."
 political.20.b:0 "Her zamanki gibi devam edin."
 political.20.c:0 "Eğer referandumu kabul edersek, belki mirasımızı koruyabiliriz."
 political.20.d:0 "Şaşırtıcı olmayan bir şekilde, halkın yaşadığı ulusu yönetme fikri halk arasında kolayca çok popüler olabilir. [Root.GetRulingParty], elbette, bu hareketlerin temsil ettiği demokrasi fikrini - ifade özgürlüğü, halk seçimleri, özgür basın - sadece [Root.GetLeader]'in hükümetini zayıflatmayı amaçlayan popülist bir söylem olarak görüyor.\n\nAncak, bu fikirlerin [Root.GetAdjective] nüfusu arasında yerleştiği inkar edilemez. Gerçek demokratik bir şekilde, mevcut rejimin değiştirilmesi için halk referandumu çağrısında bulunuyorlar. Şu anda görmezden gelinmesi kolay olsa da, bu fikirlerin çok kalıcı olma eğilimi vardır. Barışçıl devrimi imkansız hale getirirsek bize ne olacak?"
 political.20.t:0 "Demokratlar Referandum Talep Ediyor"
 political.21.a:0 "Onları ne pahasına olursa olsun durduracağız!"
 political.21.b:0 "Faşistler [Root.GetName]'nin gerçek ruhunu taşıyor!"
 political.21.d:0 "Referandum talepleri reddedildikten sonra, yasal yollardan iktidarı ele geçirme yönündeki neredeyse sembolik bir girişimin ardından faşistler, önemli halk desteklerini ve [Root.GetAdjective] ordusundaki bağlantılarını kullanarak bir darbe girişiminde bulundular. [Root.GetRulingParty] hükümeti şartlarını reddetti ve [Root.GetName]'i bildiğimiz şekliyle korumak için sonuna kadar savaşacağını iddia ediyor."
 political.21.t:0 "Faşistler [Root.Capital.GetName]'e Yürüyor"
 political.22.a:0 "Ülkemizi mahvetmelerine izin vermeyeceğiz!"
 political.22.b:0 "Devrimin ateşi zalimlerin kanıyla söndürülmeli!"
 political.22.d:0 "Referandum talepleri reddedildikten sonra, [Root.GetName]'deki komünist hareketin birkaç reformcusu hızla daha radikal unsurlara etki kaybetti. [Root.GetRulingParty]'nin önerilen reformlara yönelik halk desteğini kabul etmeyi reddetmesiyle, devrimin romantik görüşü giderek yaygınlaştı ve hareketin liderleri en kolay isyan çıkarabilecek kişiler haline geldi. Bu isyanlar şimdi ulusun geleceği tehlikedeyken tam ölçekli bir iç savaşa dönüştü."
 political.22.t:0 "Komünistler Ayaklanıyor"
 political.23.a:0 "Bizi bu ayaktakımı yönetiminden kurtarın!"
 political.23.b:0 "Sonunda, [Root.GetName] özgür!"
 political.23.d:0 "Demokrasiyi tesis etmek için halk referandumu girişimleri reddedildikten sonra, önerinin arkasındaki insanlar [Root.GetLeader] rejimini iflah olmaz olarak bir kenara attılar. [Root.GetName]'de daha temsili siyasi sistemler kurma ortak hedefleriyle birleşen geniş bir isyancı grup koalisyonu silaha sarıldı ve [Root.GetRulingParty] devrilene kadar dinlenmeyeceklerini duyurdu."
 political.23.t:0 "[Root.GetAdjective] Baharı"
 political.24.a:0 "Ne maskara bir grup."
 political.24.d:0 "[Root.GetAdjective] halkının milliyetçi gurur ve geçmişin zaferlerini yeniden canlandırma girişimlerine olan düşkünlüğü geçmiş gibi görünüyor. Üniformaları, militarist duruşları ve abartılı konuşmaları artık sempati yerine daha çok alay konusu olan ateşli destekçileri için kaba bir uyanış oldu.\n\nBir zamanlar [Root.GetRulingParty] güç tabanına bir tehdit olarak kabul edilen [Root.GetAdjective] faşizmi, şimdi giderek daha çok saçma, aşırılık yanlısı bir pozisyon ve ulusumuzun en temel değerlerine, tam da o kadar yüksek tuttuklarını iddia ettikleri ulusa bir saldırı olarak görülüyor. Bu kelime siyasi bir tanımdan çok bir hakaret olarak daha uygun görünüyor."
 political.24.t:0 "Faşistler Alay Konusu Oldu"
 political.25.a:0 "Ne ikiyüzlü bir grup."
 political.25.d:0 "Birçok komünist, [Root.GetName]'nin sözde uluslararası devrime yenik düşen bir sonraki ulus olacağını tahmin etmişti, ancak sokaklarda birkaç aylık grevler ve kızıl bayraklardan sonra hareket sönmüş gibi görünüyor. Devrimin sözde itici gücü olan işçi sınıfının, [Root.GetLeader]'i devirmekten daha acil endişeleri var ve bu devrimlerin başka yerlerde ne kadar iyi sonuç verdiğinden pek etkilenmemiş görünüyorlar. Bu arada, zalimlerin boğazlarını kesmek için tutkulu çağrılar yazan entelektüellerin, rahat yaşam tarzlarını gerçekten bozabilecek herhangi bir şeyi kışkırtmakta şaşırtıcı derecede isteksiz oldukları ortaya çıktı.\n\nDevrim konuşmaları muhtemelen ucuz biralar veya pahalı şaraplar eşliğinde devam edecek, ancak muhtemelen konuşma ve daha fazlası olmayacak."
 political.25.t:0 "Komünist Modası Geçti"
 political.26.a:0 "Ne pespaye bir grup."
 political.26.d:0 "[Root.GetLeader]'in rejimine karşı birkaç aylık gürültülü muhalefetin, halk seçimleri ve toplanma ve ifade özgürlüğü konusunda daha liberal yasalar çağrısının ardından hareket dağılmış gibi görünüyor. İnsanlar şimdi bu tür reformların gerçekleşmesi durumunda [Root.GetName]'nin istikrarı konusunda daha fazla endişe duyuyor ve demokrasi için yaygara koparanlar her şeyden çok baş belası olarak görülüyor.\n\nDaha da gizemli bir şekilde, hareketin önde gelen isimlerinin birçoğu ortadan kaybolmuş veya çalışmalarını aniden durdurmuş gibi görünüyor. Belki bazıları çabalarının başarısızlığını görünce sürgüne gitmeyi seçti. Ne olursa olsun, [Root.GetRulingParty] hükümeti tüm bilgiyi ve katılımı reddediyor."
 political.26.t:0 "Demokratik Hareket Sessizleşti"
 political.27.a:0 "[Root.GetName]'nin geleceği için."
 political.27.d_communism:0 "[Root.GetRulingParty]'nin son zamanlardaki iktidara yükselişinin ardından, [Root.GetLeader], [Root.GetName]'nin artık Tarafsız Dış Politikasını sürdürmeyeceğini duyurdu.\n'Dünya karışık ve karmaşık bir hal aldı. Bu ülke her zaman ilkelerine bağlı kalmış ve onları savunmaya hazır olmuştur. Artık kendi başımıza güvende değiliz. Tarafsızlık artık eskisi gibi güvenli bir sığınak değil ve bu dünyada güç arayanlar ona saygı duymuyor. Bizi ezmek isteyen güçlere karşı komünist kardeşlerimizle birlikte durmalıyız. Bizi aşağılamak isteyen burjuva çoğunluğuna karşı. Eğer bir duruş sergilemezsek, yalnız başımıza yok olacağız.'"
 political.27.d_fascism:0 "[Root.GetRulingParty]'nin son zamanlardaki iktidara yükselişinin ardından, [Root.GetLeader], [Root.GetName]'nin artık Tarafsız Dış Politikasını sürdürmeyeceğini duyurdu.\n'Dünya karışık ve karmaşık bir hal aldı. Artık kendi başımıza güvende değiliz. Düşmanlarımıza karşı faşist ortaklarımızla birlikte durmalıyız. Eğer bir taraf seçmezsek, yalnız başımıza yok olacağız.'"
 political.27.t:0 "[Root.GetLeader] Tarafsız Dış Politikayı Terk Ediyor"
 political.28.a:0 "Sonunda birleştik!"
 political.28.d:0 "Topraklarımızı harap eden korkunç iç savaş sona eriyor ve sonunda siyasi bir anlaşmaya vardık. Şimdi [Root.GetAdjective] kardeşlerimizle aynı fikirdeyiz ve birlikte büyük ulusumuzu yeniden inşa edeceğiz. İç çekişmelerimizden yararlanmak isteyen düşmanlar şimdi birleşik bir [Root.GetAdjective] devletiyle yüzleşmek zorunda.\n\nYeni [Root.GetRulingIdeology] [Root.GetName] bir daha asla bölünmeyecek!"
 political.28.t:0 "[Root.GetNameDefCap] Yeniden Birleşti"
 political.29.a:0 "Yapılacaktır."
 political.29.d:0 "Ulusumuzu bölen iç savaş şimdi sona erdi ve davamız galip geldi. Ancak, hasımlarımızı destekleyenlerin sinsi propagandalarını halk arasında yaymaya devam etmelerine izin veremeyiz. Önümüzdeki günlerde sert bir el gereklidir, böylece birleşik, hazır ve acemi hükümetimizi tehlikeye atacak herhangi bir dış tehdide karşı güçlü durabiliriz."
 political.29.t:0 "İç Çatışmanın Sonu"
 political.3.a:0 "Tarihin gelgitleri geçmişi silip süpürecek."
 political.3.d:0 "Komünist devrim için halk hareketi gürültülü ve ürkütücü olsa da, siyasi hareketin belirli bir kesimi büyük ölçüde sessiz kalıp beklemişti. Bekleyiş şimdi sona erdi. Bugün, tam da [Root.GetRulingParty] liderliği ve ordusu ulusal çapta bir isyana hazırlanırken, [Root.GetAdjective] hükümetindeki bir dizi yetkili hızla [Root.GetLeader]'i ev hapsine aldı ve isyancılarla müzakerelere girdi.\n\nDüzeni koruma bahanesini sürdürürken, müzakerelerin fiilen vardığı nokta, işbirliği yapmayı seçenler için yeni sosyalist devlette pozisyonlar sağlamaktı. Darbe, kimse onu durduramadan bitti ve durduracak olanlar şimdi yeni rejim tarafından hapsedildi, sürgün edildi veya idam edildi."
 political.3.t:0 "Komünistler Darbe Yaptı"
 political.31.a:0 "Bunu benimsemeliyiz."
 political.31.b:0 "Uzak duralım. Geçmiş geçmişte kalsın."
 political.31.desc:0 "Savaş ülkemizi böldü. Yeniden barışa kavuştuğumuza göre artık yeniden inşa etmeye başlama zamanı. [ROOT.GetRulingIdeology] [ROOT.GetAdjective] fraksiyonları arasında yeniden birleşme için güçlü bir baskı var."
 political.31.t:0 "[ROOT.GetAdjective] Yeniden Birleşme Tartışmaları"
 political.32.a:0 "Yeniden birleşmiş bir [ROOT.GetName]."
 political.32.desc:0 "Savaştan sonra ortaya çıkan bölünmüş [ROOT.GetRulingIdeology] [ROOT.GetAdjective]'ni yeniden birleştirme zamanı geldi. [ROOT.GetNameDefCap] yeniden bütün olacak."
 political.32.t:0 "[ROOT.GetAdjective] Yeniden Birleşmesi"
 political.33.a:0 "Bir başyapıt."
 political.33.desc:0 "Savaş çabasına yönelik kamuoyunu iyileştirme çabasıyla, propaganda bakanlarımız, güçlü bir vatanseverlik duygusu içeren yüce bir izleme deneyimi sunan olağanüstü sinematik yapım '[ROOT.GetCountryAppropriateFilmProduction]' filmini ülke genelinde gösterime girmesi için seçti.\n\nBunun, vatansever film endüstrimiz için uzun ve efsanevi bir geleneğin başlangıcını müjdelemesini umuyoruz - şimdiye kadarki sonuçlar mükemmel oldu."
 political.33.t:0 "[ROOT.GetCountryAppropriateFilmProduction]"
 political.4.a:0 "Halk kendini istediği gibi adlandırabilir."
 political.4.d:0 "Bir zamanlar radikal akademisyenler arasında teoride ve pratikte baş belaları arasında popüler olan komünist devrimci hareket, [Root.GetAdjective] işçi sınıfı arasında artan bir destek gördü. Daha da fazla insanın kendilerini bir 'sınıf' olarak tanımlamayı seçmesi bile, Marksist fikirlerin hükümeti aktif olarak devirmeye çalışanların ötesine yayıldığını gösteriyor.\n\n[Root.GetRulingParty] üyeleri bu gelişmeden yakınıyor ve insanların her şeyden önce '[Root.GetAdjective]' olarak tanımlandığı bir zamanı özlüyor. Endişeleri yersiz değil. Bir devrimin zaten toplumun birkaç düzeyinde gerçekleşmekte olduğu ve onu durdurmak için çok geç olabileceği iddia edilebilir."
 political.4.t:0 "Sınıf Çatışmaları [Root.GetName]'i Bölüyor"
 political.5.a:0 "Belki de sadece farklı bir [Root.GetName] için savaşıyorlar."
 political.5.d:0 "'Kapitalistler ve milliyetçiler, kanınızı onlar için cephede dökmenizi, işçiyi ilgilendirmeyen anlaşmazlıklar yüzünden kardeşi kardeşe düşürmenizi ister! Yurtdışında mücadele eden işçilere karşı silaha sarılmak yerine, zalimlere karşı kaldırın ve tiranları devirin!'\n\nGenellikle vatanseverlik ve sadakatin kalesi olan ordu, [Root.GetName]'de hızla yayılan komünist propagandasına karşı bağışık olmadığını kanıtladı. Askerler firar ediyor, ülkeleri için savaşmayı reddediyor, hatta bazen devrime hazırlandığını iddia eden partizan hareketlerine katılıyorlar."
 political.5.t:0 "Askerler Komünist Partizanlara Katılıyor"
 political.6.a:0 "Tarih yazmak isteyenler bugün harekete geçmeli!"
 political.6.b:0 "Devrim kaçınılmazdır. Kaçınılmaz olan bekleyebilir."
 political.6.d:0 "Komünist hareketin halkı temsil ettiği düşüncesi, [Root.GetName]'de kesinlikle rüzgarı arkasına aldı; burada komünist partiye halk desteği son aylarda hızla arttı. Ancak devrim çağrısı yapanlar artık dağınık bir gerilla ve hoşnutsuz işçi sendikaları topluluğu değil. İsyan çağrısının arkasındaki grup, başarılı olurlarsa bir hükümet kuracak kadar organize.\n\nYine de, devrim şimdi başlarsa, [Root.GetName]'i bir iç savaşa sürüklemeden pekala gerçekleştirilemez. Devrimciler, sabırsızlıklarını tatmin etmek için ulusu ikiye bölme riskini mi almalı, yoksa gelecekte daha iyi bir fırsatı mı beklemeli?"
 political.6.t:0 "[GetMonth] Devrimi"
 political.7.a:0 "Üst kademeler dile getirilmemiş sempati besliyor olabilir."
 political.7.a.tt:0 "Faşist bir darbe için iç destek şansını artırır."
 political.7.b:0 "Genç nesil meşaleyi devralacak."
 political.7.b.tt:0 "Faşist bir ayaklanma için halk desteği şansını artırır."
 political.7.d:0 "'[Root.GetAdjective] halkı çok uzun süredir [Root.GetRulingParty]'nin beceriksiz yönetimine maruz kaldı! Halkı temsil ettiklerini iddia ediyorlar, ancak sokaklarımızı bile düzene sokamıyorlar! Onları iktidardan indirerek ancak bu ulusun büyümesini sağlayabiliriz!'\n\n[Root.GetName]'deki faşist konuşmacılar, mevcut yönetimimiz ve siyasi sistemimiz hakkında ne düşündüklerini gizlemediler. Bu tür konuşmalar, özellikle ordunun daha muhafazakar kesimlerinde belirgin olan bir halk muhalefetine dokundu."
 political.7.t:0 "Yükselen Faşizm"
 political.8.a:0 "Ulusal ruh hükümetten üstündür."
 political.8.d:0 "[Root.GetAdjective] ordusunun birkaç üst düzey üyesi, bazıları özel olarak bazıları ise açıkça, [Root.GetName]'deki Faşist harekete desteklerini ifade etti. [Root.GetRulingParty]'nin ülkeyi bir arada tutmak için silah gücünün ne kadar önemli olduğunu unuttuğunu düşünüyorlar ve ordunun hükümet tarafından bir araçtan çok ulusun en önemli kurumlarından biri olarak muamele görmesinden giderek daha fazla rahatsız oluyorlar. Bazıları, [Root.GetName]'i yüzyılın ikinci yarısına taşıyacak yeni bir hükümete ihtiyaç olduğunu öne sürecek kadar ileri gidiyor.\n\nBu fraksiyon ağırlıklı olarak politikacılardan oluşmasa da, bazıları savunma bakanlığında pozisyonlar kazandı. Bu gelişmeler devam ederse, bir darbe gerçekleştirmek için yeterli siyasi desteğe sahip olabilirler."
 political.8.t:0 "Orduda Faşist Sempati"
 political.9.a:0 "İnsanları kendilerinden korumak için güçlü bir devlete ihtiyaç vardır."
 political.9.d:0 "Bazıları bunun geleceğini gördüğünü söyleyecektir. Hem faşizmin tehlikelerine karşı uyaranlar hem de onu [Root.GetName]'in kurtarıcısı olarak övenler, bugün [Root.Capital.GetName]'deki ordunun [Root.GetRulingParty] liderliğindeki hükümeti devirip iktidarı ele geçirmesiyle kehanetlerinin gerçeğe dönüştüğünü gördüler. [Root.GetLeader] kayıp, sürgüne gittiği söyleniyor ve darbe başlangıçta pek az direnişle karşılaştı.\n\nYeni [Root.GetAdjective] liderliğinin direnişin büyümesine izin verme planı da yok. Sıkıyönetim ilan edildi ve devam eden değişikliklerle birlikte, bundan sonra ne gelirse gelsin pek farklı olması muhtemel değil."
 political.9.t:0 "Faşist Darbe"
 republicans_chosen:0 "Falanjistlere ölüm!\n"
 romania.1.a:0 "Hayır. Umutsuz bir durum."
 romania.1.b:0 "Evet! Topraklarımızı savaşmadan vermeyeceğiz!"
 romania.1.d:0 "[FROM.GetAdjective] kuvvetleri sınırımızın diğer tarafında toplanıyor ve diplomatları Besarabya'nın tamamını kendilerine devretmemizi talep etti! Almanların müdahale etmesini bekleyemeyiz, zira Ruslarla yaptıkları pakt görünüşe göre bizi [FROM.GetAdjective] etki alanı içine sokan gizli bir protokol içeriyordu. Direnmeli miyiz?"
 romania.1.t:0 "[FROM.GetNameDefCap] Besarabya'yı Talep Ediyor"
 romania.2.a:0 "Evet... başka seçeneğimiz yok."
 romania.2.b:0 "Hayır, Transilvanya'yı asla vermeyeceğiz!"
 romania.2.d:0 "Almanya, Macaristan ile aramızdaki toprak anlaşmazlığında arabuluculuk yapmak üzere devreye girdi ve İkinci Viyana Diktası'nda Kuzey Transilvanya'nın Macar kontrolüne iade edilmesine karar verdi. Bu kararı kabul etmeli miyiz?"
 romania.2.t:0 "İkinci Viyana Diktası"
 romania.3.d:0 "Almanya, Macaristan ile aramızdaki toprak anlaşmazlığında arabuluculuk yapmak üzere devreye girdi ve İkinci Viyana Diktası'nda küstahça tüm Transilvanya'nın Macar yönetimine iade edilmesine karar verdi! Bu kararı kabul etmeli miyiz?"
 romania.4.a:0 "Transilvanya Rumen olarak kalacaktır."
 romania.4.d:0 "Almanya, Macaristan ile aramızdaki toprak anlaşmazlığında arabuluculuk yapmak üzere devreye girdi ve akıllıca bir kararla Transilvanya'nın Rumen kontrolünde kalmasına karar verdi. Macarlar memnun değil, ancak umarız bu meseleyi kesin olarak çözer."
 romania.4.t:0 "Almanya Anlaşmazlığa Arabuluculuk Yapıyor"
 romania.5.a:0 "Bu, anlaşmazlığı çözecektir."
 romania.5.b:0 "Hayır, çizgi burada çekilmeli!"
 romania.5.d:0 "Bulgar diplomatları, Alman desteğiyle öne çıkarak, İkinci Balkan Savaşı'ndan sonra 1913'te onlardan ilhak ettiğimiz Güney Dobruca'nın iadesini talep ediyorlar. Zaten yapmak zorunda kaldığımız tavizler bu talebi teşvik etmiş görünüyor."
 romania.5.t:0 "Krayova Antlaşması"
 romania.6.a:0 "Tek umudumuz Almanya."
 romania.6.b:0 "Sovyetler Birliği bize en iyi şansımızı sunuyor."
 romania.6.c:0 "Tarafsız kalmalıyız."
 romania.6.d:0 "Açgözlü komşularımıza çok fazla toprak kaybettik. Yine de, kaybedilen toprakların bir kısmını faiziyle geri alma fırsatları var. Tek yapmamız gereken doğru tarafı seçmek."
 romania.6.t:0 "Zor Bir Seçim"
 soviet.1.a:0 "Sert bir şekilde karşılık vereceğiz."
 soviet.1.b:0 "Japonya ile bir savaşı göze alamayız."
 soviet.1.d:0 "Mançurya sınırı boyunca gerginlik bir süredir devam ediyor ve şimdi Moğol yoldaşlarımızdan Japonların Heilungkiang'da kuvvet yığdığına dair raporlar alıyoruz. Geri adım atmak bir zayıflık işareti olarak görülebilir, ancak kuvvetle karşılık verirsek durum tırmanabilir. Emirleriniz nedir, yoldaş komutan?"
 soviet.1.t:0 "Japon Yığınağı"
 soviet.10.a:0 "Sizi kapitalizmden kurtaracağız."
 soviet.10.d:0 "[FROM.GetNameDef]'deki askeri üs talebimiz kabul edildi, ancak ne yazık ki hükümetleri çöktü. Anarşiyi önlemek için bir Halk Parlamentosu kurduk ve onlar oybirliğiyle Yüksek Sovyet'e birliğimize üyelik dilekçesi vermek için oy kullandılar. Bu talep kabul edildi."
 soviet.10.t:0 "[FROM.GetNameDefCap] Boyun Eğiyor"
 soviet.100.a:0 "Onlardan kurtulduğumuza sevindim!"
 soviet.100.d:0 "[SOV.GetNameDef] ve bizim ortak bir düşmanla savaşta olmamız nedeniyle, yerel komünist partilerimize verdikleri desteği azaltmış görünüyorlar."
 soviet.100.t:0 "Komünistler Geri Adım Atıyor"
 soviet.11.a:0 "[FROM.GetAdjective] halkı yeterince acı çekti."
 soviet.11.d:0 "[FROM.GetNameDefCap] kendini yok etmeye kararlı görünüyor ve hükümetlerindeki aptallar kuvvetlerimizin ülkelerine girmesini engelliyor. Almanların altında daha iyi durumda olacaklarını mı düşünüyorlar? Bencil liderleri, vatandaşlarına gerçek sosyalizmi reddederek halka karşı bir suç işliyorlar."
 soviet.11.t:0 "[FROM.GetNameDefCap] Teklifimizi Reddediyor"
 soviet.12.a:0 "Savaşmalarını beklemiştik..."
 soviet.12.d:0 "Sınırları boyunca yığdığımız ezici kuvvetler, [FROM.GetAdjective] hükümetini sınırlarının revizyonu yönündeki mütevazı talebimizi kabul etmeye ikna etti. Karelya'nın kontrolünü ele geçirdik ve [195.GetName]'nin konumu artık çok daha güvenli."
 soviet.12.t:0 "[FROM.GetNameDefCap] Taleplerimizi Kabul Ediyor"
 soviet.13.a:0 "Onları birkaç hafta içinde ezeceğiz."
 soviet.13.d:0 "[FROM.GetAdjective] hükümeti taleplerimizi reddetti, ancak bu bekleniyordu. Karelya'yı istiyorsak, onu zorla almak zorunda kalacağız. İnatçı Finlere unutamayacakları bir ders verme zamanı geldi!"
 soviet.13.d.2:0 "[FROM.GetAdjective] hükümeti taleplerimizi reddetti, ancak bunu zaten bekliyorduk. Karelya'yı istiyorsak zorla almak zorundayız. Onlara unutamayacakları bir ders vermenin zamanı geldi!"
 soviet.13.t:0 "[FROM.GetNameDefCap] Taleplerimizi Reddediyor"
 soviet.14.a:0 "Evet, onlara katılalım."
 soviet.14.b:0 "Hayır, henüz tam potansiyelimize ulaşmadık!"
 soviet.14.d:0 "Moskova'dan SSCB'ye resmen katılmamız için baskı altındayız. Bunu kabul etmeli miyiz?"
 soviet.14.t:0 "SSCB'ye Üyelik"
 soviet.15.a:0 "Onlara bol şans."
 soviet.15.d:0 "Tuvalılar küstahça Sovyetler Birliği ile birleşmeyi reddetti! Böylesine acınası bir ulusun kendi başına neyi başarabileceği, asla cevaplanamayacak bir gizem olabilir."
 soviet.15.t:0 "Tannu Tuva Reddediyor!"
 soviet.16.a:0 "Birliğe hoş geldiniz yoldaşlar."
 soviet.16.d:0 "Yüksek Sovyet, Tuva parlamentosundan Sovyetler Birliği'ne üyelik için resmi bir talep aldı. Rusya SFSC içinde Tuva Özerk Oblastı olarak örgütlenecekler."
 soviet.16.t:0 "Tannu Tuva'nın İlhakı"
 soviet.17.a:0 "Yoldaş Stalin gurur duyacak!"
 soviet.17.d:0 "Batı sınır bölgelerimiz boyunca uzanan savunma tahkimatlarının kapsamlı bir revizyonu tamamlandı ve ıslah çalışma kamplarımızdaki mahkumlar işe başlamaya hazır. Yakında Stalin Hattı şanlı adaşına yaraşır hale gelecek!"
 soviet.17.t:0 "Stalin Hattını İyileştirme"
 soviet.18.a:0 "Barış görüşmeleri için komünist partiyle temasa geç."
 soviet.18.b:0 "Asla!"
 soviet.18.d:0 "[SOV.GetNameDef]'den bizimle Çin Kızıl Ordusu arasındaki düşmanlıkların sona ermesi yönündeki dış baskı, saflarımızdaki insanların meseleleri kendi ellerine almasına yol açtı. İki general, Çin'i dış tehditlere karşı birleştirmek için bizimle komünistler arasında bir ateşkesi zorlamak amacıyla [Root.GetLeader]'i tutuklattı. Barışçıl bir çözüm için uluslararası baskı ve bu dönemde bölünmüş Çin'in zayıflığı, birleşik bir cephe kurulması lehine faktörlerdir. Hangi yolu izlemeliyiz?"
 soviet.18.t:0 "Xi'an Olayı"
 soviet.19.a:0 "Şimdilik bir ateşkesi kabul ediyoruz."
 soviet.19.b:0 "Devrim bunun için bir kenara bırakılamaz!"
 soviet.19.d:0 "Milliyetçi saflardaki anlaşmazlıklar tehlikeli bir duruma yol açtı. Liderleri [From.GetLeader], düşmanlarımızı Çin'i yabancı düşmanlara karşı birleştirmek için bizimle bir ateşkes kabul etmeye zorlamak amacıyla tutuklandı. Kuomintang liderliğinin bize karşı işledikleri suçlar nedeniyle cezalandırılmasını görmek istesek de, bu işbirliği yapmak ve Çin'in yabancı emperyalistlerin eline düşmemesini sağlamak için nadir bir fırsattır."
 soviet.19.t:0 "Milliyetçiler Ateşkes Teklif Ediyor"
 soviet.2.a:0 "Aferin!"
 soviet.2.d:0 "Mançurya sınırına yığılan Japon kuvvetlerine karşı düzenlediğimiz baskın başarılı oldu! Hazırlıklarını tamamlamadan önce onları yakaladık ve cesur askerlerimiz ardından gelen şiddetli çatışmada onlara iyi bir ders verdi."
 soviet.2.t:0 "Başarılı Baskın"
 soviet.20.a:0 "Elimizden geleni yaptık."
 soviet.20.d:0 "[From.GetLeader]'in kaçırılmasına rağmen, Milliyetçiler Komünistlerle ateşkes müzakerelerine girmeyi reddetti. Ne yazık ki, Çinliler kendi halklarıyla şiddetli bir çatışma içinde kalacak ve bu da onları düşmanları için kolay bir av haline getirecektir."
 soviet.20.t:0 "Milliyetçi Çin Müzakereleri Reddediyor"
 soviet.21.a:0 "Çin için hala umut var."
 soviet.21.d:0 "Xi'an'daki müzakereler sonuç verdi. Hem Milliyetçiler hem de Komünistler bir ateşkese razı oldular, düşmanlıklara en azından geçici bir son verdiler ve tarafların dış tehditlere karşı işbirliği yapmasına olanak tanıdılar."
 soviet.21.t:0 "Çin İç Savaşı'nda Ateşkes"
 soviet.22.a:0 "Bu gidişle, Çin'in düşmanları bölüp fethedebilir."
 soviet.22.d:0 "Kuomintang generallerinin Komünist Parti liderleriyle bir ateşkes sağlama yönündeki tüm çabalarına rağmen, komünistler Milliyetçilerin lideri hayatta olduğu sürece geçici bir barış bile yapmayı reddediyor. Görünüşe göre düşmanlıklar o kadar kolay sona ermeyecek."
 soviet.22.t:0 "Komünist Çin Müzakereleri Reddediyor"
 soviet.23.a:0 "Belki bu bir dönüm noktası olabilir."
 soviet.23.d:0 "[SOV.GetNameDefCap]'in endişelenecek başka tehditleri var ve İmparatorluğumuzla düşmanlıkları daha da artırmak istemiyor. Uluslarımız arasında barış arzusunun bir işareti olarak, diplomatik bağlarımızı güçlendireceğini umarak bize bazı toprakları terk ettiler."
 soviet.23.t:0 "[SOV.GetNameDefCap] Toprak Terk Ediyor"
 soviet.24.a:0 "Zinovyev ve hempaları hala Troçki ile temas halinde mi?"
 soviet.24.d:0 "Halk düşmanlarının, devrimi tersine çevirecek veya yıkacak olanların zulmü, Parti iktidara geldiğinden beri devam eden bir politikaydı. Ardından gelen iç güç mücadeleleri odağımızı değiştirdi ve Troçki'nin sürgününden bu yana Parti saflarını temizlemeye daha fazla önem verildi. Stalin kendini bir ikon haline getirdi, ancak birçok gerçek düşman ve sayısız hayali düşman edinme pahasına.\n\nİç güç mücadelelerinin en kötüsünü görmüş olan Genel Sekreter, en ufak bir şüphede harekete geçmeye eğilimlidir. Partiden atılmak hapis veya ölüm anlamına gelir. Sadakatsizlik gösterenler - ya da sadece inandırıcı görünmek için biraz fazla sadakat gösterenler - için karanlık zamanlar kapıda."
 soviet.24.t:0 "Beşinci Kol"
 soviet.25.a:0 "Kalinin'in karısı şüpheli. Ona da güvenilemez."
 soviet.25.b:0 "Kruşçev geçmişte Troçkizmle uğraştı. Gitmeli."
 soviet.25.c:0 "Radek'in itirafı parti içindeki birkaç kişiyi işaret ediyor."
 soviet.25.d:0 "Lev Troçki sürgüne zorlanmasına rağmen, $SOV_iosif_stalin$ parti içinde gizli destekçileri olduğundan korkuyor. Bir dizi hızlı tutuklama ve acımasız sorgulama, uygun bir şekilde Stalin'in bazı rakiplerini işaret eden itiraflar ve tanıklıklar ortaya çıkardı. Ancak, ne kadar çok soru sorulursa ve gizli polis mektuplara ve günlüklere ne kadar derinlemesine dalarsa, dolaylı da olsa o kadar çok kişi suçlanıyor.\n\nParti üyeleri, Stalin'in mutlak gücünün ve karısının ölümünün onu herkesi bir tehdit olarak algıladığı noktaya kadar izole ettiğine inanmaya başlıyor, ama bu tam da bir hainin söyleyeceği şey değil mi?"
 soviet.25.e:0 "Parti üyelerine güvenilebilir. Bu paranoya sona ermeli."
 soviet.25.t:0 "Anti-Sovyet Troçkist Merkezi'nin Duruşması"
 soviet.26.a:0 "Tuhaçevski gizlice yargılanmalı ve derhal idam edilmeli."
 soviet.26.b:0 "Rokossovski itiraf etmeyi reddediyor, ancak yaşamasına izin verilemez."
 soviet.26.c:0 "Sahte belgeler ve zorla alınan itiraflar kanıt değildir."
 soviet.26.d:0 "Kızıl Ordu, Troçki'nin kendisi Savaş Komiseri olduğundan beri her zaman yıkıcı unsurlara ev sahipliği yapmıştır. NKVD tarafından elde edilen belgeler, birkaç üst düzey subayı sadece hain değil, aynı zamanda casus olarak da suçlamıştır. Mihail Tuhaçevski şüphelilerin en önde gelenlerinden biridir ve Stalin'in ordudan kurtulmak istediği biridir. Bu arada, donanmanın yabancılarla sık teması da birçoğunun tutuklanmasına yol açtı.\n\nSuçlarını kanıtlayan düşmanlarımızdan belgeler olmasına rağmen, bunları uydurup uydurmadıklarını veya bu tasfiyeyi başlatanların onlara yanlış bilgi verip vermediğini söylemek mümkün değil."
 soviet.26.t:0 "Generallerin Gizli Duruşması"
 soviet.27.a:0 "Donanma ve hava kuvvetleri şimdiye kadar kolay kurtuldu."
 soviet.27.b:0 "Şüphelendiğimiz gibi, düşmanlar her yerde."
 soviet.27.c:0 "Bu çok ileri gitti. Yakında hepimiz kendi kendimizi öldürmüş olacağız."
 soviet.27.d:0 "Birkaç tur tutuklama ve duruşmanın ardından, Büyük Tasfiye bu duruşmaya kadar uzanan bir anlatı ördü. Sanıklar arasında sadece Nikolay Buharin gibi eski liderler değil, aynı zamanda bir dizi diplomat, politikacı, askeri yetkili ve hatta birçok üst düzey NKVD subayı da bulunuyor. Suçlamalar da eskisinden daha kapsamlı; on yıllık Sovyet liderlerini öldürme ve Birliği düşmanlarına satma planlarını içeriyor.\n\nNKVD'nin kendisinin de şimdi tasfiyenin hedefleri arasında olması, bir anlamda süreci tam bir daireye getirdi. Tehditler ve dayaklar, birçoğunun en abartılı olanlar da dahil olmak üzere tüm suçlamaları itiraf etmesine yol açtı. Baş sanıklar idamla karşı karşıya."
 soviet.27.t:0 "21'ler Duruşması"
 soviet.27_tt:0 "§YSubay Tasfiyeleri§! cezasını artırır."
 soviet.27_tt2:0 "§RGelecekte bir iç savaşa yol açacaktır.§!"
 soviet.28.a:0 "Liderler gelir gider, ama halk kalır."
 soviet.28.d:0 "Stalin'in tasfiyelerinin doğru insanları hedef alıp almadığını ya da Partideki her Troçkisti yok etmeye çalışırken daha fazla düşman edinip edinmediğini dünya asla bilemeyebilir. Bilinen şu ki, korktuğu şey sonunda başına geldi. Bugün, Lev Troçki sürgününden dönmüş olarak yeniden ortaya çıktı ve birkaç etkili parti üyesi ve NKVD subayının desteğiyle Stalin'in yönetimini deviren bir darbe başlattı.\n\nEski Genel Sekreter evinde bir buz baltasıyla saldırıya uğradı ve birkaç destekçisiyle birlikte hızla idam edildi. İnşa ettiği kişilik kültünü yıkmak zaman alacak, ama halk en azından onun ölümsüz olmadığını şimdi biliyor.\n\n Kaçmayı başaran az sayıdaki hayatta kalandan biri de İvan Konev'di. Stalin'in ateşli bir destekçisi olan Konev, bir miktar destek toplamayı başardı ve iktidarı geri alıp 'Yoldaş Stalin'in vizyonunu yerine getirmek' amacıyla Troçki hükümetine savaş ilan etti."
 soviet.28.t:0 "Troçkist Darbe"
 soviet.29.a:0 "Hoş bir ekleme."
 soviet.29.b:0 "Hayır!"
 soviet.29.d:0 "Parti Communiste Français'deki yoldaşlarımız büyük ilerleme kaydetti. Fransa ulusu Komintern'e katılmaya hazır."
 soviet.29.t:0 "Fransa Komintern'e katılmak istiyor."
 soviet.3.a:0 "Bir idam mangası hazırlayın."
 soviet.3.d:0 "Mançurya sınırına yığılan Japon kuvvetlerine karşı düzenlediğimiz baskın başarısız oldu! Düşman kuvvetlerimizi bir kıskaç hareketine aldı ve ayrılmayı başarmadan önce ağır kayıplar verdik."
 soviet.3.t:0 "Başarısız Baskın"
 soviet.30.a:0 "Ültimatomu gönder!"
 soviet.30.b:0 "Hayır, demir bedelini ödeyeceğiz!"
 soviet.30.d:0 "Romanya, Kızıl Ordu'nun gücüne dayanamaz; onlara Besarabya'daki haklı olarak iddia ettiğimiz topraklar için bir talep gönderirsek, savaşmadan teslim edebilirler."
 soviet.30.t:0 "Besarabya'yı Talep Et"
 soviet.31.a:0 "Ültimatomu gönder!"
 soviet.31.b:0 "Hayır, demir bedelini ödeyeceğiz!"
 soviet.31.d:0 "Finlandiya, Kızıl Ordu'nun gücüne dayanamaz; onlara Karelya'daki haklı olarak iddia ettiğimiz topraklar için bir talep gönderirsek, savaşmadan teslim edebilirler."
 soviet.31.t:0 "Karelya'yı Talep Et"
 soviet.32.a:0 "Ültimatomu gönder!"
 soviet.32.b:0 "Hayır, demir bedelini ödeyeceğiz!"
 soviet.32.d:0 "Estonya, Kızıl Ordu'nun gücüne dayanamaz; onlara üs hakları ve sınır güvenliklerinin kontrolü için bir talep gönderirsek, savaşmadan fiilen ilhak edebiliriz."
 soviet.32.t:0 "Estonya'yı Baskı Altına Al"
 soviet.33.a:0 "Ültimatomu gönder!"
 soviet.33.b:0 "Hayır, demir bedelini ödeyeceğiz!"
 soviet.33.d:0 "Letonya, Kızıl Ordu'nun gücüne dayanamaz; onlara üs hakları ve sınır güvenliklerinin kontrolü için bir talep gönderirsek, savaşmadan fiilen ilhak edebiliriz."
 soviet.33.t:0 "Letonya'yı Baskı Altına Al"
 soviet.34.a:0 "Ültimatomu gönder!"
 soviet.34.b:0 "Hayır, demir bedelini ödeyeceğiz!"
 soviet.34.d:0 "Litvanya, Kızıl Ordu'nun gücüne dayanamaz; onlara üs hakları ve sınır güvenliklerinin kontrolü için bir talep gönderirsek, savaşmadan fiilen ilhak edebiliriz."
 soviet.34.t:0 "Litvanya'yı Baskı Altına Al"
 soviet.35.a:0 "Harekete geçir."
 soviet.35.b:0 "Böyle bir hamle için zaman uygun değil."
 soviet.35.d:0 "[From.GetName]'deki son siyasi kargaşa, hükümetlerini bizimkiyle aynı çizgide güçlü bir gelecek vizyonuyla bıraktı. Güçlü bir Sovyetler Birliği'nin dünya için ne kadar iyi şeyler yapabileceğini gördüler ve Anavatan için her şeyi vermeye istekliler."
 soviet.35.t:0 "[From.GetNameDefCap], [SOV.GetNameDef]'e katılmak istiyor"
 soviet.35_threat_EST:0 "Estonya Sovyetler Birliği'nin bir parçası"
 soviet.35_threat_FIN:0 "Finlandiya Sovyetler Birliği'nin bir parçası"
 soviet.35_threat_LAT:0 "Letonya Sovyetler Birliği'nin bir parçası"
 soviet.35_threat_LIT:0 "Litvanya Sovyetler Birliği'nin bir parçası"
 soviet.36.a:0 "İlerlememize yardımcı olacak bir araç daha."
 soviet.36.b:0 "Çok fazla koruma gerektirecekler."
 soviet.36.d:0 "[From.GetName]'deki son siyasi kargaşa, hükümetlerini bizim planlarımızla aynı çizgide güçlü bir gelecek vizyonuyla bıraktı. Korumamızı arıyorlar ve koşulsuz desteklerini sunuyorlar. Resmi olarak kendi ulusları olarak devam edecekler, ancak her hareketimizde Anavatan'ı takip edecekler."
 soviet.36.t:0 "[From.GetName] bizim yönetimimizi istiyor."
 soviet.36_threat_EST:0 "Estonya Sovyetler Birliği'nin kuklası"
 soviet.36_threat_FIN:0 "Finlandiya Sovyetler Birliği'nin kuklası"
 soviet.36_threat_LAT:0 "Letonya Sovyetler Birliği'nin kuklası"
 soviet.36_threat_LIT:0 "Litvanya Sovyetler Birliği'nin kuklası"
 soviet.37.a:0 "Mükemmel."
 soviet.37.a_tt:0 "§YSubay Tasfiyeleri§! cezasını düşürür."
 soviet.37.d:0 "Yeni subaylarımız göreve layık olduklarını kanıtlıyor ve askeri yüksek komutadaki yeni rollerine uyum sağlıyorlar. Ordumuzun başında sadık bir subay kadrosuyla, [Root.GetLeader]'in tasfiyesi umduğumuz etkinin bir kısmını göstermiş gibi görünüyor. Kızıl Ordu gücünü yeniden kazanıyor ve yakında her zamankinden daha güçlü olacak."
 soviet.37.t:0 "Yetenekli yeni subaylar."
 soviet.4.a:0 "Mükemmel."
 soviet.4.d:0 "[FROM.GetAdjective]ler taleplerimize akıllıca boyun eğdi ve tüm kuvvetlerini Besarabya'dan çekti. Bölgeyi Moldavya Sovyet Sosyalist Cumhuriyeti olarak birliğe dahil edeceğiz. Vatandaşları artık sosyalizmin nimetlerinden yararlanacak."
 soviet.4.t:0 "[FROM.GetNameDefCap] Besarabya'yı Teslim Ediyor"
 soviet.46.a:0 "[Root.GetName]'nin şanı için!"
 soviet.46.a_tt:0 "§YSubay Tasfiyeleri§! cezasının bir kısmını dengeleyen §YBüyük Vatanseverlik Savaşı§! ekler."
 soviet.46.d:0 "Askeri yüksek komutamızı yeniden inşa etmede hala çok işimiz olmasına rağmen, sınırlarımızdaki [From.GetAdjective] ordusunun ilerleyişi yeni subay kadromuzda yaratıcılığı ve vatansever bir savaşma iradesini ateşledi. [Prev.GetName]'nin tüm gücüyle ayağa kalkıp karşılık vermeye hazırlanırken aldığımız her darbeyle daha da güçleniyoruz. Her asker canını vermeye ve düşmanlarımıza karşı dimdik durmaya hazır. Bunun, bu savaş kazanıldıktan sonra bile yeni subaylarımızın eğitimi ve bağlılığına büyük fayda sağlamasını bekliyoruz!"
 soviet.46.t:0 "Büyük Vatanseverlik Savaşı"
 soviet.48.a:0 "Düşünülemez!"
 soviet.48.a_tt:0 "§YYakında büyük bir iç savaş patlak verecek§!"
 soviet.48.b:0 "Tek ülkede komünizm başarısız oldu. Troçki'ye ihtiyacımız var."
 soviet.48.b_tt:0 "§YTroçki döndüğünde küçük bir iç savaş patlak verecek§!"
 soviet.48.d:0 "Geçtiğimiz yıllarda sayısız insan hain ve karşı devrimci olarak idam edilip hapsedilmiş olsa da, liderlik pozisyonları büyük ölçüde güvendeydi. Ancak şüpheden muaf değillerdi. Dördüncü Enternasyonal'in kurulmasıyla Stalin, kendisine en yakın olanların hiçbir zaman gerçekten onun tarafında olmadığı düşüncesine kapılmış görünüyor. Güvenini kazanmaya çalışanlar, kendilerini daha iyi bir ışıkta göstermek için bu fikri daha da körüklediler.\n\nMevcut durum istisnai bir ironi içeriyor: mevcut yönetim içindeki güvensizlik onu sürdürülemez hale getirdi ve bir darbe artık eli kulağında. Bazı parti üyeleri, Troçki'yi yeniden davet etmenin ve tasfiyeleri Stalinistlere yöneltmenin, ardından gelecek iç savaşın hasarını en aza indirebileceğini savunuyor. Genel Sekreter'in yıllardır en büyük korkusu olan bu plan gerçekten uygulanabilir mi?"
 soviet.48.t:0 "Sürekli Devrim"
 soviet.49.a:0 "Hainlere ölüm!"
 soviet.49.d:0 "Stalin'in artan paranoyasıyla Parti ve ordu bölündü. En azından geçici olarak onun güvenini kazanmayı başaranlar onu iktidarda tutmak ve inşa ettiği kişilik kültünü korumak istiyor, ancak diğer birçok kişi gayri resmi olarak dışlandı. Bazıları Stalin'in yönetiminin başarısız olduğuna inanıyor, diğerleri ise sadece NKVD'nin onları tutuklamak için bir bahane bulacağı veya uyduracağı günü beklediklerinden şüpheleniyor.\n\nBirlikte, mevcut yönetime meydan okuyacak kadar güçlü bir hizip oluşturdular. Belirtilen hedefleri, Stalin'in tiranlığını devirmek ve bir askeri subaylar kurulunun süreci denetlediği totaliter bir devletten geçiş yapmaktır.\n\nOrdudaki ve Partideki Stalin destekçileri mevcut rejimi korumak için toplandı ve muhaliflerini karşı devrimci hainler olarak nitelendirdi. Yeni bir iç savaş kapıda."
 soviet.49.t:0 "İkinci Rus İç Savaşı"
 soviet.5.a:0 "Aptallar!"
 soviet.5.d:0 "Rumenler taleplerimize boyun eğmeyi reddetti! Görünüşe göre işgalci kuvvetlerini Besarabya'dan zorla çıkarmak zorunda kalacağız."
 soviet.5.t:0 "Romanya Taleplerimizi Reddediyor"
 soviet.50.a:0 "Durdurulmaları gerekiyor!"
 soviet.50.d:0 "Dördüncü Enternasyonal'in kuruluşu, Stalin'in Parti ve askeri komuta içindeki hainlere yönelik korkusunu yeniden alevlendirdi. Büyük Tasfiye'deki duruşmaları ve idamları görmüş olan birçok kişi, bir başkasının yolda olduğundan şüpheleniyor. Buna karşılık, Andrey Vlasov liderliğindeki bir dizi general, daha fazla zarar vermeden önce Stalin rejimini devirme amacıyla Rusya Halkını Kurtarma Komitesi'ni kurdu.\n\nBelirtilen uzun vadeli hedef demokrasiye geçiş olsa da, tam şekli henüz belirsiz. Açık olan tek şey, Stalin'i iktidardan indirmeyi ve Bolşeviklerin egemenliğine son vermeyi amaçladıkları."
 soviet.50.t:0 "Rus Kurtuluş Ordusu Kuruldu"
 soviet.51.a:0 "Yakalanmaları gerekiyor!"
 soviet.51.d:0 "Dördüncü Enternasyonal'in kuruluşu, Stalin'in Parti ve askeri komuta içindeki hainlere yönelik korkusunu yeniden alevlendirdi. Büyük Tasfiye'deki duruşmaları ve idamları görmüş olan birçok kişi, bir başkasının yolda olduğundan şüpheleniyor. Tasfiyelerde önemli bir araç olan NKVD, aynı zamanda teşkilatın kendisinin de potansiyel bir hedef olduğunun son derece farkındaydı. Hapsedilmeyi, idam edilmeyi ve değiştirilmeyi beklemek yerine, liderleri ilk saldıran olmayı ve benzer şekilde endişeli askeri yetkililerin desteğiyle bir darbe başlatmayı seçti.\n\nAncak, etkili konumuna rağmen, NKVD askeri liderlerin güvenini kazanmakta zorlandı. Darbe, Birliğin sadece sınırlı bir alanında kontrolü ele geçirmeyi başardı, ancak eski teşkilatın kalıntıları şimdi kesin idamla karşı karşıya olduğu için teslim olmaları pek olası değil."
 soviet.51.t:0 "NKVD Darbe Başlattı"
 soviet.52.a:0 "Mümkün olan en kısa sürede istikrarı sağlamalıyız."
 soviet.52.d:0 "Dördüncü Enternasyonal'in kuruluşu, Stalin'in Parti ve askeri komuta içindeki hainlere yönelik korkusunu yeniden alevlendirdi. Büyük Tasfiye'deki duruşmaları ve idamları görmüş olan birçok kişi, bir başkasının yolda olduğundan şüpheleniyor. Bu kadar çok kişi gitmişken, idamdan kurtulmayı başaran şüphelilerden sadece birkaçı kaldı. Acımasızca sorgulanmış ve bazı durumlarda hapsedilmiş olduklarından, başka bir tasfiyenin ilk kurbanları olacaklarını çok iyi biliyorlar. Umutsuz bir eylemle, bu generaller bu olmadan önce Stalin rejimini devirmeye çalışmaya karar verdiler.\n\nBu girişimde başarılı olmaları pek olası olmasa da, Büyük Tasfiye'den hayatta kalan bazıları Birliğin bazı bölgelerinde kontrolü ele geçirmeyi başardı. Genel Sekreter'in saltanatı en azından istikrarsızlaştırıldı."
 soviet.52.t:0 "Hayatta Kalanların Darbesi"
 soviet.53.a:0 "Baltayı asma zamanı."
 soviet.53.d:0 "Dördüncü Enternasyonal'in kuruluşunun ardından Troçki destekçilerine yönelik av yoğunlaştırıldı ve Stalin'e yakın birkaç kişi idam edildi. Kendisinden başka kimsesi kalmayan Stalin, malikanesine çekildi. Her hain arkadaş ve aile üyesiyle nihayet hesaplaşıldıktan sonra şimdi biraz dinlenebilir ve tümüyle [SOV.GetNameDef]'in şanına odaklanabilir."
 soviet.53.t:0 "Başarılı Tasfiye"
 soviet.54.a:0 "Rus siyaseti için yeni bir şafak."
 soviet.54.d_nopurge:0 "Komünist partinin zayıflayan gücüyle, Stalinist sistemin sürdürülemez olduğu uzun zamandır açıktı.\nYeni güçler iktidarı ele geçirmek için ayaklandı ve ülkemizi yeni bir yola sokmak için Rus ideallerini öne sürdü.\n\nBu geçişi simgeleyen [Root.GetLeader], Stalin'i devirdi ve onu, birçok tehlikeli projesini tasarladığı iktidar koridorlarından uzakta ev hapsine aldırdı.\nPartinin çürüyen cesedinin yerine yeni bir Rus sistemi büyürken, eski Genel Sekreter'in gizliliği, paranoyası ve siyasi entrikaları sona eriyor."
 soviet.54.d_purge:0 "Rus devletine yönelik en büyük tehdidin Komünist Partiye karşı komplocular değil, Partinin kendisi olduğu açıkça ortaya çıktı. Rusya'daki komünist rüyanın hayal kırıklığına uğramasıyla, ülkemizi geleceğe taşımak için yeni güçler iktidarı ele geçirdi.\n\n[Root.GetLeader] tarafından Stalin'in görevden alınmasının ardından eski Genel Sekreter acele bir yargılamadan geçti. Paranoyak cadı avları, umutsuz bir ihtiyaç anında ulusun liderliğinin yok edilmesi olarak tanımlandığından, Stalin vatana ihanetten idama mahkum edildi. Eski sistem onunla birlikte işaretsiz bir mezara gidiyor."
 soviet.54.t:0 "Yeni Liderlik Altında"
 soviet.6.a:0 "Birliğe hoş geldiniz yoldaşlar."
 soviet.6.d:0 "[FROM.GetNameDefCap] taleplerimize teslim oldu. Tallinn'deki yozlaşmış hükümeti, [FROM.GetNameDef]'i bir Sovyet Sosyalist Cumhuriyeti'ne dönüştürmek için oybirliğiyle oy veren bir Halk Parlamentosu ile değiştirdik. Müzakerelerin ardından Yüksek Sovyet bu talebi kabul etmeye karar verdi."
 soviet.6.t:0 "[FROM.GetNameDefCap] Boyun Eğiyor"
 soviet.60.a:0 "Evet. Antlaşmalara uymama zamanı değil."
 soviet.60.b:0 "Hayır! Tüm Polonya Anavatan'a aittir!"
 soviet.60.d:0 "Polonya bizimdir, ancak batı kısımları Molotov-Ribbentrop Paktı'nın şartlarına göre [GER.GetAdjective] etki alanı altına girmektedir. Kuvvetlerimizi geri çekip [GER.GetAdjective]lerin bu bölgeyi işgal etmesine izin vermeli miyiz? Bunu yapmamak antlaşmamızı geçersiz kılacaktır."
 soviet.60.t:0 "Polonya'nın Paylaşımı"
 soviet.61.a:0 "Mükemmel."
 soviet.61.d:0 "Antlaşma uyarınca, [SOV.GetAdjective]ler Polonya'nın batı kısımlarını bizim yönetimimize devretti. Alman birlikleri güvenliği sağlamak için harekete geçti."
 soviet.61.t:0 "Sovyetler Pakta Sadık Kalıyor"
 soviet.62.a:0 "Mürekkebine bile değmezdi!"
 soviet.62.d:0 "Tekrarlanan güvencelere rağmen, Sovyetler şimdiye kadar birliklerini geri çekmedi veya toprakları devretmek ve anlaştığımız sınırlara dönmek için herhangi bir hamle yapmadı. Görünüşe göre antlaşmaya uyma niyetleri yok."
 soviet.62.t:0 "Sovyetler Paktı İhlal Ediyor"
 soviet.7.a:0 "[FROM.GetAdjective]leri kendilerinden korumalıyız."
 soviet.7.d:0 "[FROM.GetNameDefCap], onlarla 'karşılıklı yardım' paktı yönündeki cömert teklifimizi küstahça reddetmeye karar verdi! Tallinn'deki kapitalistler ve dalkavuklar ayrıca uluslarının toprak bütünlüğüne saygı duymamızı talep eden bir açıklama yapma cüretini de gösterdiler!"
 soviet.7.t:0 "[FROM.GetNameDefCap] Teklifimizi Reddediyor"
 soviet.70.a:0 "Başka bir kavgaya girecek durumda değiliz."
 soviet.70.b:0 "[SOV.GetLeader]'in diktasına boyun eğmeyeceğiz."
 soviet.70.desc:0 "[GER.GetAdjective] işgalinden vatanımızın kurtarılmasına rağmen, hala başa çıkmamız gereken her zaman mevcut olan [SOV.GetName] var. Şimdi, ülkedeki [SOV.GetAdjective] yanlısı komünistlerin yönetimde daha belirgin bir rol almasına izin verilmedikçe hükümetimizin meşruiyetini tanımayı reddediyorlar. Gerçekte bu, [SOV.GetAdjective]lerin kendileriyle aynı hizaya gelmemizi beklediklerine dair üstü kapalı bir tehdittir. Bu arada, batıdaki ortaklarımız [SOV.GetLeader]’ın taleplerine direnme konusunda bize herhangi bir destek sunmaya isteksiz görünüyor."
 soviet.70.t:0 "[SOV.GetNameDef]'den Baskı"
 soviet.71.a:0 "Boyun eğmekle doğru olanı yaptılar."
 soviet.71.desc:0 "Yönetimimizden gelen son baskıların ve kudretli Kızıl Ordu'nun her zaman mevcut olan tehdidinin ardından, [POL.GetNameDef]'in burjuva yönetimi, halkın tek meşru temsilcisi olarak komünist partinin otoritesine saygı duymayı kabul etti. İrademizi zorla kabul ettirebilirdik, ancak [POL.GetName]'nin bundan böyle etki alanımızın bir parçası olacağına güvenle güvenebileceğimiz için bu artık gereksiz olacaktır."
 soviet.71.t:0 "[POL.GetAdjective] Hizalanması Sağlandı"
 soviet.72.a:0 "[POL.GetAdjective] burjuvazisini kesin olarak ezeceğiz."
 soviet.72.b:0 "Halk savaştan yoruldu, başka bir yol bulmalıyız."
 soviet.72.desc:0 "Küstah bir burjuva kibriyle, [POL.GetName]'nin gayrimeşru yönetimi komünist partinin otoritesini tanımayı reddediyor. Bu aptalların Polonya'yı bir kez daha [SOV.GetNameDef]'e yönelik faşist saldırılar için bir hazırlık alanına dönüştürmesine izin veremeyiz. [POL.GetName]'yi derhal etki alanımıza dahil etmek en üst düzeyde bir ulusal güvenlik meselesidir."
 soviet.72.t:0 "[POL.GetNameDefCap] Proletaryayı Bastırmaya Devam Ediyor"
 soviet.73.a:0 "Gardımızı düşürmemeliyiz."
 soviet.73.desc:0 "[POL.GetName]’nin dış politika uyumuyla ilgili son gerginlik, [SOV.GetNameDef]'in önceki saldırgan söyleminden geri adım atmasıyla son zamanlarda azaldı. Başka bir işgal olasılığı azalmış olsa da, doğu komşumuza ve onların piyonlarına karşı tetikte olmalıyız."
 soviet.73.t:0 "[SOV.GetNameDefCap] Geri Adım Atıyor"
 soviet.74.a:0 "Hiç yoktan iyidir."
 soviet.74.b:0 "Sadaka kabul etmiyoruz."
 soviet.74.d:0 "[FROM.GetAdjective] ve [ROOT.GetAdjective] ülkeleri arasında iyi niyet ve dostluk göstergesi olarak, [FROM.GetLeader] ellerinde tuttukları ve tarihsel olarak Polonya'nın bir parçası olan bazı toprakları iade etmeyi teklif etti."
 soviet.74.t:0 "[FROM.GetNameDefCap], [ROOT.GetAdjective] Topraklarını İade Edecek"
 soviet.75.a:0 "Beklendiği gibi."
 soviet.75.d:0 "Toprak iadesi teklifimiz [FROM.GetAdjective] hükümeti tarafından kabul edildi. Bu, umarım öngörülebilir gelecekte herkesi tatmin edecek ve iç çatışma riskini azaltacaktır."
 soviet.75.t:0 "[FROM.GetLeader] Teklifimizi Kabul Etti."
 soviet.76.a:0 "Kimseyi memnun etmek mümkün değil."
 soviet.76.d:0 "Nedense, toprak iadesi teklifimiz [FROM.GetAdjective] hükümeti tarafından reddedildi. Bu noktada neyin peşinde olduklarını söylemek zor, ama en azından daha sonra topraklar üzerinde hak iddia etmelerini zorlaştıracaktır."
 soviet.76.t:0 "[FROM.GetLeader] Teklifimizi Reddetti."
 soviet.8.a:0 "Artık sosyalistsiniz!"
 soviet.8.d:0 "Riga'daki [FROM.GetAdjective] hükümeti taleplerimizi kabul etti ve onların yozlaşmış yönetimini bir Halk Meclisi ile değiştirdik. Bu organ, büyük birliğimize bir Sovyet Sosyalist Cumhuriyeti olarak üyelik talebinde bulunmak için oybirliğiyle oy kullandı. Bu talebi lütfedip kabul ettik."
 soviet.8.t:0 "[FROM.GetNameDefCap] Boyun Eğiyor"
 soviet.9.a:0 "[FROM.GetAdjective] halkı özgürleştirilmeli."
 soviet.9.d:0 "[FROM.GetNameDef]'i yöneten burjuva zalimler tüm mantığı terk etmeyi seçti. Cömert karşılıklı yardım paktımızı reddettiler ve sınırları boyunca 'yığılan' tüm Sovyet kuvvetlerinin derhal geri çekilmesini talep ediyorlar."
 soviet.9.t:0 "[FROM.GetNameDefCap] Teklifimizi Reddediyor"
 spain.1.a:0 "Milliyetçiler!"
 spain.1.b:0 "Cumhuriyetçiler!"
 spain.1.d:0 "Silahlı Kuvvetler içindeki bir grup güçlü general, İspanya'nın mevcut hükümetini kınayan bir askeri bildiri yayınladı! Muhafazakar monarşistlerin ve ruhban sınıfının desteğiyle sağcı bir darbe başlattılar. Ordunun önemli bir kısmı bu Milliyetçilerin yanında yer aldı, ancak şimdiye kadar Sevilla hariç İspanya'nın büyük şehirlerinden hiçbirini ele geçiremediler.\n\nBu arada solcu gönüllüler, isyancılara karşı onu desteklemeye hazır Cumhuriyetçi hükümetin bayrakları altında toplanıyor. Bu sadıklar yetersiz eğitimli olabilir, ancak kimse coşkularını sorgulayamaz.\n\nSavaş hatları çizildi - hangi fraksiyonu desteklemeliyiz?"
 spain.1.t:0 "İç Savaş!"
 spain.10.b:0 "Halk Ordusu!"
 spain.10.d:0 "General Francisco Franco'nun İspanya devlet başkanı olarak barışçıl bir şekilde seçilmesinin ardından, son yıllardaki şiddetli ayaklanmaların ve siyasi kargaşanın sona ereceği umudu vardı. Franco'nun kendisini devlet başkanı olarak tek partili bir diktatörlük kurmaya çalışacağı söylentileri, birkaç muhalefet liderinin aniden ortadan kaybolmasıyla körüklendi.\nHızlı bir yargılamanın ardından, Carabineros subayı José Galánfor vatana ihanetten suçlu bulundu ve kısa bir süre sonra halka açık infazı gerçekleştirildi. Bu, Milliyetçi İspanya'nın yükselişine karşı her türlü direnme isteğini bastırmak amacıyla yapılmış olsa da tam tersi bir etki yarattı. Solcu gönüllüler ve hatta bir grup general, baskıcı Milliyetçilere karşı mücadeleyi desteklemeye hazır, yeni kurulan Halk Ordusu'nun bayrakları altında toplandı. Çoğu yetersiz eğitimli olsa da, ayaklanmayı izleyen kaos ortamında birkaç kilit şehri ele geçirmeyi başardılar.\n\nSavaş hatları çizildi - hangi tarafı desteklemeliyiz?"
 spain.11.a:0 "Oh hayır"
 spain.11.d:0 "Carlistler delirdi!"
 spain.11.t:0 "Carlist Ayaklanması"
 spain.12.a:0 "Oh hayır"
 spain.12.d:0 "Anarşistler delirdi!"
 spain.12.t:0 "Anarşist Ayaklanması"
 spain.2.a:0 "Teçhizat ve mühimmat talep edelim."
 spain.2.b:0 "İspanya, İspanyol kanıyla kazanılmalı!"
 spain.2.d:0 "Darbe tam bir başarıya ulaşamadı, ancak Karlistler, Falanjistler ve Özerk Sağ Konfederasyonu, çok uzun süredir gururlu Hristiyan ulusumuzun anarşiye sürüklenmesine izin veren Cumhuriyeti devirmek için ordunun büyük bir bölümünü seferber etmeyi başardı. Sonuç hala belirsiz, dünya hangi tarafın galip çıkacağını endişeyle izliyor.\n\nAncak bu darbeyi boş durarak gerçekleştirmedik ve dünya da kızıl tehdidi ezmek istiyorsa boş durmamalı. Ulusal şanlarını geri kazanma sürecinde olan diğer uluslar yardımımıza gelmeye istekli olmalıdır."
 spain.2.t:0 "Uluslararası Destek Aranmalı mı?"
 spain.3.a:0 "Bu, faşizmi kontrol altına almak için uluslararası bir mücadeledir!"
 spain.3.b:0 "Yozlaşmış işçi devletlerinin kuklası olmayacağız!"
 spain.3.d:0 "Ordudaki gerici ve faşist güçler Cumhuriyeti tek bir darbeyle ezmeye çalıştılar, ancak büyük şehirlerde karşılaştıkları direnişi ya da işçi milislerinin hızlı seferberliğini beklemiyorlardı. Bir darbe yerine, bir savaş başlattılar; ilerlemeye ve İspanyol halkının istediği geleceğe karşı bir savaş.\n\nDemokratik ve sosyalist uluslar benzer şekilde Cumhuriyete desteklerini dile getiriyorlar, ancak pek azı doğrudan müdahale etmeye cesaret edebiliyor. Onlardan çabalarımızı desteklemelerini isteyebiliriz, yoksa zalimler bir sonraki adımda onların özgürlüklerini ve dayanışmalarını hedef alacaktır."
 spain.4.a:0 "Elimizden geleni göndereceğimize söz veriyoruz."
 spain.4.a.tt:0 "[From.GetName], savaş sırasında bir ödünç verme-kiralama ayarlarsak minnettar olacaktır."
 spain.4.b:0 "İktidarı ele geçirecek güçleri yoksa, bunu hak etmiyorlar."
 spain.4.d:0 "İspanya İç Savaşı, küresel duruma bakış açımızın bir tür mikrokozmosu haline geldi: Komünistler ve liberaller eski değerleri yok etmeye çalışıyor ve biz onları canlandırmak için silaha sarılıyoruz. İspanya'daki Milliyetçilerin yaklaşan çatışma için onları donatmak üzere bize ve başkalarına ulaşması şaşırtıcı değil."
 spain.4.t:0 "Milliyetçi İspanya Yardımımızı İstiyor"
 spain.5.a:0 "Onlara silah ve teçhizat gönderme sözü ver."
 spain.5.b:0 "Ne yazık ki, müdahale etmeyi göze alamayız."
 spain.5.d:0 "İkinci İspanyol Cumhuriyeti'ni devirme girişimi, faşistlerin ilerlemenin çiçeklerinin doğal olarak kök saldığı yerlerde bile büyümesine izin vermeyeceğinin açık bir işaretidir. Cumhuriyetçiler ve müttefikleri, demokratlar, komünistler ve anarşistlerden oluşan bir karışım, yardım için bize ve uluslararası toplumun diğer kesimlerine başvurdu. Demokrasiyi ve özgürlüğü savunduğunu iddia eden birçok ulus, savaşa sürüklenme korkusuyla desteklerini esirgedi. Nasıl yanıt vermeliyiz?"
 spain.5.t:0 "Cumhuriyetçi İspanya Yardımımızı İstiyor"
 spain.6.a:0 "Umarım Kızıl terörü kontrol altına alırlar."
 spain.6.d:0 "Milliyetçi İspanya'ya yaptığımız ödünç verme-kiralama gözden kaçmadı. Galip çıkarlarsa, İspanya yeniden inşa edildikten sonra kendimizi güçlü bir müttefikle bulabiliriz."
 spain.6.t:0 "Milliyetçi İspanya Yardımımızı Takdir Ediyor"
 spain.7.a:0 "Yaşasın Cumhuriyet!"
 spain.7.d:0 "Cumhuriyetçi İspanya'ya yaptığımız ödünç verme-kiralama gözden kaçmadı. Cumhuriyet restore edilirse, dünyayı faşist pisliklerden kurtarma çabalarımızı destekleyeceklerine güvenebiliriz."
 spain.7.t:0 "Cumhuriyetçi İspanya Yardımımızı Takdir Ediyor"
 spain.8.a:0 "Başkenti Madrid'e taşı"
 spain.8.b:0 "Mevcut konumu koru"
 spain.8.d:0 "Savaş kazanıldı. Madrid tekrar bizim ve kadim şehri yeniden İspanya'nın merkezi yapma fırsatımız var. Çok fazla savaş gördü ve yeniden inşa edilmesi gerekecek. Bunu başkentimiz yapmaktan daha iyi bir yolu var mı?"
 spain.8.t:0 "Madrid Geri Alındı"
 spain.9.a:0 "Halk Cephesini Koru."
 spain.9.b:0 "Muhafazakar grupları Falanj altında birleştir."
 spain.9.d:0 "İkinci Cumhuriyet kırılgan bir varlık olduğunu kanıtladı. [Root.GetLeader], cumhuriyetçiler, komünistler ve anarşistler tarafından desteklenen geniş bir sol kanat grupları koalisyonu olan Halk Cephesi'nin desteğiyle başkan olabilir.\n\nAncak muhafazakarlar, monarşistler ve faşistleri kapsayan sağ kanat muhalefeti de Halk Cephesi'ni yıkma davası için birleşmeye başlıyor. Hangi koalisyon dağılırsa dağılsın, muhalifleri muhtemelen iç çatışmalarından yararlanarak bir devrim başlatacaktır. Bu seçim, İspanya'nın bu çatışmayı çözmek için katlanmak zorunda kalacağı son sınav değil."
 spain.9.t:0 "1936 İspanya Seçimleri"
 spanish_civil_war:0 "İspanya İç Savaşı başladı"
 stability.21.a:0 "Bu konuda hiçbir şey yapılamaz."
 stability.21.d:0 "Askere alımdan kaçan birini yakalamalıyız!"
 stability.21.desc.a:0 "Savaş Bakanlığı'nın yeni raporu, mevcut insan gücünde belirgin bir azalma olduğunu gösteriyor. Görünüşe göre, son askere alınanların sayısı başlangıçta beklenenden çok daha az. Tutarsızlık şu anda araştırılıyor, ancak ilk ipuçları, teknik olarak hizmete uygun olan çok sayıda insanın çeşitli yollarla askere alınmamayı başardığına işaret ediyor. 18 yaşındaki öğrenciler aniden kritik savaş endüstrisinde çalışan yetenekli işçiler haline geliyor, eski sporcular uygunluk testlerinde başarısız oluyor ve bazı durumlarda, askere alınanlar iz bırakmadan ortadan kayboluyor.\n\nİnsanlar yakalanıp sorguya çekildiklerinde, ordudaki kötü koşullara, ilgisiz subaylara ve kayıp bir dava uğruna ölmek istememelerine işaret ediyorlar. Askeri liderler, askere alınmaktan kaçınan insanlara karşı sert bir baskı talep ediyor, ancak hükümetteki birçok kişi, kayıtlı askerlerin yaşam koşullarını iyileştirmenin daha iyi bir yaklaşım olabileceğine inanıyor."
 stability.21.desc.b:0 "Taslaktan yaygın bir şekilde kaçınılmasına karşı etkisiz resmi yanıt, sorunu daha da kötüleştirdi. Giderek daha fazla sayıda asker, taslak mektubunu aldıktan sonra asla gelmiyor. Karşı İstihbarat, insanlara taslaktan nasıl kaçınacakları konusunda tavsiyelerde bulunan, doktorlara rüşvet vererek askerin tıbbi olarak uygun olmadığını onaylamaları gibi şeyler öneren profesyonelce hazırlanmış bir broşür ele geçirdi. Aile babaları için istisnalar, çocuklu savaş dullarının kendilerini evlilik teklifleriyle bulmalarına yol açarken, etik nedenlerle istisna başvurusunda bulunan kişi sayısı rekor sayılara ulaştı.\n\nAskeri liderler, son birkaç istisnayı ortadan kaldırmayı ve yakalanan birkaç kaçamağı örnek göstermeyi önerdiler. Hükümetteki diğerleri, vatandaşlarımızdaki yurttaşlık görevi duygusuna hitap etmemiz ve bu savaşta bir yenilginin sonuçlarına dikkat çekmemiz gerektiğini önerdiler."
 stability.21.desc.c:0 "Hükümetin askerlikten kaçmaya verdiği yanıtların hiçbir olumlu etkisi olmamasıyla, giderek daha fazla insan neden kendilerini riske atmaları gerektiğini merak etmeye başladı. Başkaları güvende kalırken, işe alınanlar genellikle sokakta mahkum bir dava uğruna savaşan aptallar olarak taciz edildiklerini veya alay konusu olduklarını bildiriyorlar. Annelerin çocuklarının askerlik emrine uymasını yasakladığına dair raporlar her yerde ve Savaş Bakanlığı, bürokrasileri tüm bu kayıp askerleri işlemenin getirdiği gerginlik altında çökmeye başladığı için artık kaç kişiyi askere almaları gerektiğinden emin olmadıklarını iddia eden bir rapor sundu."
 stability.21.e:0 "Askere alınan askerler için maaş artışı belki de sırada olabilir."
 stability.21.f:0 "Daha sert önlemlerin zamanı geldi."
 stability.21.g:0 "İnsanların sivil görev algısına hitap edin."
 stability.21.h:0 "Bir örnek yapmalıyız."
 stability.21.i:0 "İnsanlara savaşması için bir şeyler vermeliyiz."
 stability.21.t:0 "Askere Alımdan Kaçanlar"
 stability.22.a:0 "Bu uçacak."
 stability.22.b:0 "Kasabalardaki askeri gücü gösteriniz."
 stability.22.c:0 "Çalışmaya istekli insanlardan propaganda kahramanları oluşturun."
 stability.22.d:0 "İşçileri askerliğe hazırla ve fabrikaları askeri kontrol altına al."
 stability.22.desc.a:0 "İşçilerin tüm savaş üretimine yönelik grev ilan etmesi nedeniyle son birkaç günde birçok fabrikadaki üretim önemli ölçüde yavaşladı. \"Barış ve Ekmek!\" talebiyle şimdiye kadar anlaşmaya varma yönündeki tüm girişimleri reddettiler. Hükümetten bazıları sert bir askeri tepki verilmesini ve ardından elebaşlarının düşman ajanları ve hainler olarak hızla infaz edilmesini savundu. Ancak kamu hizmetindeki diğer kişiler daha ölçülü bir yaklaşım önererek, söz konusu askerlerin düşündüğümüz kadar sadık olmaması durumunda sert bir tepkinin geri tepebileceğini belirtti."
 stability.22.desc.b:0 "Hükümetin grevcileri işe dönmeye ikna etme çabaları hiçbir etki yaratmamış gibi görünüyor. Aksine, daha fazla fabrikada grevler bildirildi ve başlangıçta etkilenen iş yerlerindeki son birkaç direnişçi de meslektaşlarının öfkesiyle karşılaştıktan sonra aletlerini bıraktı. Stoklar şimdiye kadar ön cephedeki malzemelere gelen darbeyi bir nebze olsun hafifletebilse de, üretim kesintilerinin savaşı yürütme yeteneğimizi etkilemesi an meselesi.\n\nSavaş Bakanlığı, hükümeti grevcilere karşı tavizsiz bir tutum izlemeye tekrar çağırdı, ancak yönetim içindeki diğer gruplar işçilerle yarı yolda buluşmayı teklif etmenin onları işe dönmeye ikna etmek için yeterli olabileceğini öne sürdü."
 stability.22.desc.c:0 "Birkaç izole yerde endüstriyel eylem olarak başlayan şey, artık tüm ülkeye yayıldı ve yalnızca savaş çabalarıyla üçüncül yollarla bağlantılı olan endüstrileri bile etkiledi. Pek çok alt düzey katip, haberci ve şoförün giderek artan sayıda işe gelmeyi reddetmesi nedeniyle hükümetin işleyişi bile etkilendi. \n\nBirçok yerde işçi konseyleri fabrika binalarını ele geçirdi. Gizli polisten gelen raporlar, \"Savaş Rejimi\" olarak adlandırılan şeye karşı büyük bir ayaklanma için bazı yerlerin yeniden silah üretimine başladığını gösteriyor. \n\nAskeri Yüksek Komuta, sadık birliklerin kararlı eyleminin hala günü kazanabileceğine inanırken, hükümetin sivil tarafı bunun bir iç savaş ve kesin bir yenilgi riski olduğunu savunuyor."
 stability.22.e:0 "İşçilerin gıda erzaklarını arttırma teklifi."
 stability.22.f:0 "Birlikleri gönderin, grevcileri tutuklayın, elebaşlarını idam edin."
 stability.22.g:0 "Yeni refah mevzuatı önerin."
 stability.22.t:0 "Grevler!"
 stability.23.a:0 "Şimdi bunun hakkında hiçbir şey yapamayız."
 stability.23.b:0 "İsyancı birlikleri sadakatçiler ile kuşatın ve onların durmalarını emredin."
 stability.23.c:0 "Asilerden önce yurtsever bir konuşma yapın."
 stability.23.d:0 "Açıkça isyancıları desteklediği tespit edilen herkesin ihanetle suçlanacağını ilan edin."
 stability.23.desc.a:0 "Ordumuzdaki bazı birliklerin üst düzey subaylardan gelen emirleri reddettiğiyle ilgili endişe verici haberler Askeri Yüksek Komutanlığa ulaştı. Hiçbir birlik hattı terk etmemiş olsa da, askerlerin temsilcileri düşmana saldırmak için hiçbir emre itaat etmeyeceklerini oldukça açık bir şekilde belirttiler.\n\nİsyan şimdiye kadar az sayıda tabur ve bir avuç eğitim ve destek birimiyle sınırlı kaldı, ancak Savaş Bakanlığı'ndaki birçok kişi bu ayaklanmanın yakında diğer birliklere yayılacağından ve sonunda savaşa devam etmemizi imkansız hale getirebileceğinden korkuyor. Kararlı bir eylem gerekiyor."
 stability.23.desc.b:0 "Ordudaki isyanları ele alma çabaları hiçbir etki göstermedi. Hükümetin etkili bir yanıt vermemesiyle cesaretlenen isyancılar, talep listelerini derhal ateşkes ve ardından kapsamlı bir barış antlaşması ve terhis içerecek şekilde genişlettiler.\n\nSavaş Bakanlığı, isyancılara herhangi bir başka eylemi caydırmak için güçlü bir sinyal göndermemizi şiddetle tavsiye ediyor."
 stability.23.desc.c:0 "Hükümetin sorunları çözmek konusunda açıkça isteksiz veya aciz olması nedeniyle isyancılar önlemleri kendi ellerine almaya karar verdi. Ülkeyi ele geçirme ve düşmanla barış yapma hedefiyle \"İşçi ve Asker Konseyleri\" seçimleri açıklandı.\n\nHızla harekete geçilmezse, bu konseyler ülkenin bazı bölgelerinde pekala hükümetimizin yerini alabilir ve bizi savaşı sürdüremez hale getirebilir."
 stability.23.e:0 "Bir barış girişimini duyurun. Düşmana kabul edilemez olduğundan emin olun."
 stability.23.f:0 "Sadık milisleri harekete geçirin ve görev istasyonlarında olmayan bütün askerleri yakalayın."
 stability.23.g:0 "Askerlere kendi memurlarını seçmelerine izin vermelerini önerin."
 stability.23.t:0 "Ordudaki İsyanlar"
 stability.31.a:0 "Kararlı eylem daha kötü önlendi."
 stability.31.desc:0 "Hızlı yanıtımız çok etkili oldu. Yerel kolluk kuvvetleri ve vatansever gönüllüler tarafından desteklenen askeri polis birimleri, her kayıp askere gitmek için iyi koordine edilmiş bir operasyonla harekete geçti. Göreve gelmemenin sonuçları kendilerine bildirildiğinde çoğu çağrıya cevap vermeye istekliydi. Askeri Yüksek Komutanlık, görev yerlerine gelen herhangi birinin geçmişte bunu yapmadığı için herhangi bir suçla suçlanmayacağını veya cezalandırılmayacağını kamuoyuna açıkladı. Yine de, bir dizi insan ülkeleri için silah almayı kategorik olarak reddetti ve tutuklandı."
 stability.31.t:0 "Askeri Baskı başarılı"
 stability.32.a:0 "Durum ister istemez bizim avantajımıza göre gelişmedi."
 stability.32.desc:0 "Durumu askeri güçle çözme girişimlerimiz başarısızlıkla sonuçlandı. Görünüşe göre yönetimimizdeki biri planlanan operasyonumuzu kamuoyuna sızdırdı ve kamuoyu da hızla yanıt verdi. Askeri polis ve diğer kolluk kuvvetleri bilinen asker kaçaklarını yakalamaya çalıştıklarında, savaşın sona ermesini ve zorunlu askerliğin kaldırılmasını talep eden öfkeli kalabalıklar tarafından yolları kesildi. Birkaç durumda, polis ve protestocular arasında sokak çatışmaları çıktı ve askerler kendilerini savunmak için silahlarını kullanmak zorunda kaldıklarında çok sayıda ölümle sonuçlandı. Polisin durumu tam olarak kontrol altına alması birkaç saat sürdü.\n\nBarikatlar temizlenirken ve ölüler gömülürken başkentte çirkin bir ruh hali hakim oldu. Savaş Bakanlığı'ndan gelen raporlar, göreve gelen asker sayısında bir değişiklik olmadığını gösteriyor. Hükümetteki birçok kişi bu koşullar altında daha ne kadar savaşmaya devam edebileceğimizi merak ediyor."
 stability.32.t:0 "Askere Alım İsyanları"
 stability.33.a:0 "Demek ŞİMDİ savaşmak istiyorlar?"
 stability.33.desc:0 "Durumu askeri güçle çözme girişimlerimiz başarısızlıkla sonuçlandı. Görünüşe göre yönetimimizdeki biri planlanan operasyonumuzu kamuoyuna sızdırdı ve kamuoyu da hızla karşılık verdi. Askeri polis ve diğer kolluk kuvvetleri bilinen asker kaçaklarını yakalamaya çalıştıklarında, savaşın sona ermesini ve zorunlu askerlik hizmetinin yapılmasını talep eden öfkeli kalabalıklar tarafından yolları kesildi. Birçok durumda, polis ve protestocular arasında sokak çatışmaları çıktı ve askerler kendilerini savunmak için silahlarını kullanmak zorunda kaldıklarında çok sayıda ölümle sonuçlandı.\n\nDurum bundan sonra hızla kontrolden çıktı, vatandaşlar askerlere saldırdı ve kendilerini silahlandırmak için polis karakollarına saldırdı. Ülkedeki birçok şehir şu anda hükümete karşı silahlı ayaklanma halinde. İronik olarak, isyancıların silah almaya istekli asker bulmakta hiçbir sorunları yok gibi görünüyor."
 stability.33.t:0 "Mecburi Görev İsyanı"
 stability.34.a:0 "Akıllıca bir karar."
 stability.34.desc:0 "Hükümetin askeri alım politikasını reform etme sürecinin bir parçası olarak geçirdiği sosyal önlemler şaşırtıcı derecede popüler oldu. Daha yüksek maaş ve daha sık izin genellikle en büyük yeni faydalar olarak gösteriliyor, ancak birçok kişi savaş dul ve yetimlerini desteklemek için yeni hükümet programlarına da işaret ediyor. Ülkelerinin renklerine çağrıyı reddetmeyi haklı çıkarabilecek erkek sayısı giderek azalıyor ve asker kaçaklarına yönelik kamu desteği neredeyse tamamen ortadan kalktı.\n\nGerçekten de, giderek daha fazla insan [Root.GetAdjective] yaşam biçiminin saldırı altında olduğunu fark ettikçe, hükümete yönelik kamu desteğinde son zamanlarda bir artış oldu."
 stability.34.t:0 "Askere Alım Reformu etkili olduğunu kanıtladı"
 stability.35.a:0 "Kendilerini yine de kullanabilirler."
 stability.35.desc:0 "Durumun ciddiyetini gören Askeri Yüksek Komuta, birinin ülkesini savunmaya yönelik vatandaşlık görevinden kaçmasının hoş görülmeyeceğini göstermek için daha sert önlemlerin alınması gerektiğine karar verdi. Şafak vakti, askeri polis, başkalarının askere alınmadan kaçmasına izin vermek için nüfuzlarını kullanan, dikkatle seçilmiş, iyi tanınan ve bağlantıları olan bir dizi kişinin evlerine baskın düzenledi. Hâlâ gecelikleriyle kendilerini askere alınmış ve silahlı muhafızlar altında kışlaya götürülürken buldular; burada yıkıcı etkilerinin diğer birimlere yayılmasını önlemek için ayrı bir birlik halinde oluşturulacaklar. \n\nBu haber hızla yayıldı ve görünüşe göre şu ana kadar taslak duyurularını görmezden gelmenin yanlarına kâr kalacağına inanan çoğu insan fikrini değiştirmiş. Ülke genelindeki askere alma istasyonları, giderek artan sayıda insanın, askere alınmaktan kaçmaya çalışan bir \"arkadaşının\" teslim olması durumunda sonuçlarının tam olarak ne olacağını sormak için buraya geldiğini bildiriyor."
 stability.35.t:0 "591. Ceza Taburu"
 stability.36.a:0 "Görev duygusu yok mu?"
 stability.36.desc:0 "Durumun ciddiyetini gören Askeri Yüksek Komutanlık, ülkesini savunmak için vatandaşlık görevinden kaçmanın hoş görülmeyeceğini göstermek için daha sert önlemlerin alınması gerektiğine karar verdi. Şafak vakti askeri polis, nüfuzlarını kullanarak başkalarının askere alınmamasını sağlayan bir dizi dikkatlice seçilmiş, tanınmış ve bağlantılı kişinin evine baskın düzenledi. Hala gecelikleriyle kendilerini askere alınmış halde buldular. Aileleri bu kararı protesto etmek için geniş destek ağlarını harekete geçirdi. Savaş Bakanlığı, fabrika müdürlerinin çeşitli diğer bakanlıklardaki müsteşarlara geri gönderilmesini isteyen basit işçilerden gelen telefon ve mektuplarla dolup taştı. Savaş çabaları için kritik alanlarda çalışan insanların neden işlerinden alındığını öğrenmek istiyorlardı. Hatta bazı kabine üyelerinin bile savaş hakkında ikinci kez düşündükleri anlaşılıyor - belki de kendi oğullarının güvenliğinden korkuyorlar."
 stability.36.t:0 "Yerel Elitler Protestolarını Seslendiriyor"
 stability.37.a:0 "Hayatlarının boşuna harcanmasına izin vermeyeceğiz."
 stability.37.desc:0 "\"Elbette yaşamak istiyorum. Gidip okulu bitirmek istiyorum, kızlarla tanışmak istiyorum, bir aile kurmak istiyorum ama bu savaşı kaybedersek bunları da yapamam. Bu yüzden savaşırım.\"\n\nÜlkedeki tüm büyük gazetelere isimsiz olarak gönderilen mektup büyük yankı uyandırdı. İlk başta askere gitmekten kaçınmaya çalışan, ancak daha sonra ülkesini kurtarmak için savaşması gerektiğini anlayan bir askere ait olduğunu iddia eden bu ifade, görünüşe göre benzer hisseden birçok kişiyi sinirlendirdi. Ülke çapındaki taslak kurulları, çağrılarına hâlâ cevap vermeyi reddeden kişilerin sayısının, çağrılana kadar artık beklemeyecek olan yeni gönüllüler tarafından fazlasıyla telafi edildiğini, diğerlerinin ise gidip ülkelerini ve yaşam tarzlarını kurtarmak için savaştıklarını bildiriyor."
 stability.37.t:0 "\"Kasvetli ve Kutsal Bir Görev\""
 stability.38.a:0 "Buna gelmesi çok yazık oldu."
 stability.38.desc:0 "\"Şafak sökerken onu duvara götürdüler. Son sigarayı reddetti ama gözlerini bağlamayı kabul etti. Son sözleri annesinden, ona bu kadar acı vermesine neden olduğu için özür dilemesiydi. İdam mangası iyi hedef aldı. Birkaç dakika sonra orada bulunan doktor onun öldüğünü ilan etti.\"\n\nAskerden kaçan herkesi yakalayamasa da, yetkililer çok sayıda tutuklama yapabildi. İçinde bulunduğumuz vahim durum göz önüne alındığında, Savaş Dairesi bu adamların göreve uymadıkları gerekçesiyle askeri kanuna göre yargılanmalarına karar verdi. İlk seri idam cezaları verildi ve mahkumlar idam mangası tarafından infaz edildi. Bu tedbirlerin istenilen etkiyi yarattığı açıktır. Görünüşe göre çoğu insan, bir korkak olarak onursuz ölümün kesinliği yerine savaş alanında ölüm olasılığını seçmeye karar vermiş."
 stability.38.t:0 "Bir korkağın sonu"
 stability.39.a:0 "İşlerin mutlaka iyileşmesi gerekmedi."
 stability.39.desc:0 "\"Şafak sökerken onu duvara götürdüler. Son bir sigarayı reddetti ama gözlerini bağlamayı kabul etti. Son sözleri, annesinden bu kadar acı çekmesine neden olduğu için özür dilemesiydi. İdam mangası iyi hedef aldı. Birkaç dakika sonra, orada bulunan doktor onun öldüğünü ilan etti.\"\n\n Göreve gelmediği için ölüm cezasına çarptırılan bir adamın infazına ilişkin yayınlanmış rapor tam tersi bir etki yaratmış gibi görünüyor. Sonuçlarından korktukları için insanları eski renklerine döndürmek yerine, idam edilenleri barış hareketinin anında şehitleri haline getirdi. İsimleri ve hayat hikayeleri yayınlandı ve mümkün olan en iyi şekilde görünmeleri için çok net bir şekilde düzenlendi. Birçok büyük şehirde savaşın sona ermesini talep eden kitlesel barış gösterileri başladı. Savaş Dairesi, askere alınanlardan, göreve gelmeyeceklerini açıkça belirten, idam edilecek kişi dışında hiçbir koşulda başka bir infazda taraf olmayacaklarını belirten çok sayıda mektup aldıklarını bildirdi."
 stability.39.t:0 "Barış için bir şehit"
 stability.40.a:0 "Ve bunun bedelini biz öderiz...?"
 stability.40.desc:0 "Bugün radyoda yayınlanan bir konuşmada [Root.GetLeader], \"Sosyal Devrim\" adını verdiği şeyi duyurdu. Sonraki bir saat içinde, geri dönen her askere eğitim, iyi maaşlı bir iş ve cömert bir emekli maaşı vaat ederek, toplumsal yaşamın her alanına dokunan bir reform sistemi ortaya koydu. Ayrıca, ateşkesin imzalandığı gün başlamak üzere genç aileler için uygun fiyatlı konutlar sağlayacak büyük bir inşaat programının da duyurusunu yaptı. Bunun genel moral üzerinde önemli bir etkisi olduğu görülüyor. Ülke genelindeki askere alma ofisleri, askere alınanların ortaya çıktığını ve hizmetlerini mevcut çatışmanın ötesine taşıma seçenekleri hakkında sorular sorduğunu, diğerlerinin ise ekstra fayda sağlamak için ön saflarda görevlendirilmeyi talep ettiğini bildiriyor."
 stability.40.t:0 "[Root.GetNameDef] İçin Yeni Bir Fırsat"
 strikes_event.1.a:0 "Neden gerçekten."
 strikes_event.1.desc:0 "Hızlı hareket eden Askeri Yüksek Komutanlığı, hizmet için bir dizi eğitim birimini seferber etti ve izinli askerlerden oluşan geçici gruplar oluşturdu. Bu oluşumları fabrikaların kapılarından geçirmek, istenen etkiyi yarattı çünkü grevcilerin çoğu potansiyel olarak ölümcül sonuçları olan bir çatışmayı zorlamak istemiyordu. Askerleri ortak bir amaç uğruna ikna etmeye çalışan birkaç kişi, askerler rahat arka taraftaki işçilerin neden cephedeki savaşan adamları indirmesine izin verilmesi gerektiğini sorduklarında sözlerinin pek etkili olmadığını gördü."
 strikes_event.1.t:0 "Emir Restore Edildi"
 strikes_event.2.a:0 "Planlandığı gibi değil."
 strikes_event.2.desc:0 "Askeri Yüksek Komuta hızla hareket ederek bir dizi eğitim birimini hizmet için seferber etti ve izinli askerlerden oluşan geçici gruplar oluşturdu. Ancak bu oluşumları etkilenen şehirlere taşımak beklenenden çok daha zor oldu; ancak grevciler demiryolu hatlarını kapatarak birlikleri yürüyerek ilerlemeye zorladı ve onlara hazırlanmaları için yeterli zaman tanıdı. Birliklerimiz barikatlı fabrikalara ulaştığında grevcileri kendileri için hazır buldular. Yolları açma girişimleri, askerlere taş ve şişe atan işçilerin öfkeli saldırılarıyla karşılandı. \n\nBirçok durumda, birlikler kendilerini savunmak için ateş açtı, çok sayıda grevciyi öldürdü ve çok sayıda kişiyi yaraladı. Bu, \"Katiller!\" çığlıklarıyla kalabalığı daha da kızdırdı. çevredekilerin havasını dolduruyor. Başkentteki ruh hali çarpıcı biçimde grevcilerin lehine döndü. Akşam olduğunda askerler barikatları sağlam bırakarak geri çekildiler.\n\nDurumu zorlamaya yönelik başka bir girişimde bulunulmadı. Grevciler fabrikaların kontrolünü elinde tutuyor ve hiçbir çalışma yapılmıyor."
 strikes_event.2.t:0 "Kanlı Pazartesi"
 strikes_event.3.a:0 "Kahramanlar bir ve bütün."
 strikes_event.3.desc:0 "\"Endüstriyel savaş, tümenlerin yürümesi ve uçakların bombalanmasından daha fazlasıdır. Bir askerin ülkesi için savaşması ve ölmesi görevinden daha fazlasıdır. Bir endüstriyel savaş, her şeyden önce fabrikalarda ve dökümhanelerde kazanılır. Montaj hattındaki savaşı terk etmek, onu ön cephede terk etmekten daha iyi değildir. Ve montaj hattının zaferleri, cephenin kazandıkları kadar kutlanmalıdır. satır.\"\n\nMevcut tüm propaganda kaynakları, silah işçilerinin çalışmalarını mümkün olan en iyi şekilde gösterecek şekilde yeniden yönlendirildi. [Root.GetLeader], kotalarını %100'den fazla aşan işçilere verilecek yeni bir ödülü bizzat onayladı ve ilk ödül alanlar, diğer işçilere kendi yöntemleri konusunda bilgi vermek üzere ülke çapında turlara gönderildi.\n\nGörünüşe göre bu, birçok grevcinin tutumlarını yeniden gözden geçirmesine neden oldu. Daha önce etkilenen tüm fabrikalarda çalışmalar yeniden başladı."
 strikes_event.3.t:0 "Üretim Cephesindeki Kahramanlar"
 strikes_event.4.a:0 "Bunu baştan yapmalıydım."
 strikes_event.4.desc:0 "[Root.GetLeader] bugün askerlik hizmetine dair bazı küçük değişiklikler duyurdu. Daha önce vasıflı işçiler askerlik hizmetine alınmazken, bu istisna artık kaldırıldı ve muaf olan tüm erkekler derhal askere alındı. Aynı zamanda, Savaş Bakanlığı, bu fabrikaların liderlerinin yetersizlik göstermesi durumunda, savaş çabasıyla ilgili mallar üreten herhangi bir fabrikanın doğrudan kontrolünü ele geçirme yetkisine sahip oldu.\n\nDuyuru, etkilenen şehirlerde sessiz bir istifa ile karşılandı, özellikle de direnen herkesin emirleri yerine getirmeyi reddeden bir askerle aynı muameleyi göreceği duyurulduğunda. Fabrikalardaki işçiler arasındaki moral en düşük seviyedeyken, üretim yeniden başladı."
 strikes_event.4.t:0 "Savaş Üretimi Departmanı"
 strikes_event.5.a:0 "Belki de yapmalıyız."
 strikes_event.5.desc:0 "[Root.GetLeader] bugün askerlik hizmetine dair bazı küçük değişiklikler duyurdu. Daha önce vasıflı işçiler askerlik hizmetine alınmaktan muaf tutuluyordu ancak bu istisna artık kaldırıldı ve muaf tutulan tüm erkekler derhal askere alındı. Aynı zamanda, Savaş Bakanlığı, bu fabrikaların liderlerinin yetersizlik göstermesi durumunda, savaş çabasıyla ilgili mallar üreten herhangi bir fabrikanın doğrudan kontrolünü ele geçirme yetkisine sahip oldu.\n\nDuyuru, etkilenen şehirlerde büyük kahkahalarla karşılandı, özellikle de direnen herkesin emirleri yerine getirmeyi reddeden bir askerle aynı muameleyi göreceği duyurulduğunda. Askerlik hizmetine alınma bildirimlerini işçilere teslim etmek üzere gönderilen polislere, kağıt üzerinde mürekkepten fazlasıyla geri dönmeleri söylendi."
 strikes_event.5.t:0 "Meydan okuyan bir ülke"
 strikes_event.6.a:0 "Yiyeceklerini kazanması daha iyi."
 strikes_event.6.desc:0 "[Root.GetLeader] bugün gerçekleşen grevlerden bahsetmeden, savaşla ilgili endüstrilerde çalışan işçilerin güçlerini korumak için ekstra şeker, kahve ve et alacaklarını duyurdu. Ne yazık ki, hükümetin fazladan çikolata dağıtmaya istekli olduğu yönündeki söylentiler yalan çıktı.\n\nGrevin elebaşları işçilerin işe dönmesini engellemeye çalışırken, çoğu \"Barış ve Ekmek\"in asla gerçekleşmeyeceğini kabul etmiş görünüyor ve sadece ekmekle mutlu oluyor."
 strikes_event.6.t:0 "Yararlı Yiyenler"
 strikes_event.7.a:0 "Emir geri yüklendi."
 strikes_event.7.desc:0 "Birlikler gece boyunca kasabaların dışında toplandılar, sürpriz unsurunu korumak için gürültü ve ışık disiplinini korudular. Güneş ufukta yavaşça kaybolurken ve fabrikalardaki barikatları tutan işçiler gündüz vardiyasında rahatlamayı dört gözle beklerken, saldırı kolları harekete geçti. Yorgun işçiler direnişi örgütlemekte yavaştı ve hızla üstesinden geldiler. Mahkumları korumak için küçük bir müfreze bırakan birlikler, bilinen fabrika işçileri listesindeki herkesi tutuklayarak kasabayı taradılar. Öğlene doğru ordu şehirlerin tam kontrolünü ele geçirmiş ve sokağa çıkma yasağı koymuştu. Başka bir direniş beklenmiyor. İşçilerin çoğu yakında işe dönmeleri, çete liderlerinin tutuklanması ve yargılanması koşuluyla serbest bırakılacak. Ölüm cezalarının verilmesi bekleniyor."
 strikes_event.7.t:0 "Kara Oak Operasyonu"
 strikes_event.8.a:0 "Seçeneklerimiz hızla tükeniyor."
 strikes_event.8.desc:0 "Birlikler gece boyunca kasabaların dışında toplandılar, ancak yetersiz ışık ve gürültü disiplini sürprizi ele verdi. Birlikler içeri girdiğinde, işçileri tetikte ve onlara hazır buldular. İlk saldırı, atılan taş yağmuruyla bozuldu. Sabit süngülerle yapılan ikinci saldırı, vahşi göğüs göğüse çatışmalarla püskürtüldü ve sokaklarda onlarca ölü ve ölmekte olan insan bıraktı.\n\nGörevli subaylar güçlerini birleştirmek için geri çekilirken, işçiler tahkimatlarını genişletiyor ve geri çekilme sırasında geride bırakılan silahlarla kendilerini silahlandırıyorlar. Yarın ikinci bir çatışma günü bekleniyor, ancak Askeri Yüksek Komutanlık artık zaferin muhtemel olduğuna inanmıyor."
 strikes_event.8.t:0 "Oak Street Savaşı"
 strikes_event.9.a:0 "Umarım bu yeterli olacaktır."
 strikes_event.9.desc:0 "Başkentte gerginlikler tırmanırken, [Root.GetLeader] savaş zamanlarında bile işçilerin haklarını korumak için yeni bir yasa duyurdu. Kapsamlı yasa, sınırsız ücretli hastalık izni, her işçi için zorunlu kaza sigortası, herhangi bir sendikaya üye olma hakkı ve ilk kez, çalışan kadınların bir çocuğun doğumundan sonra doğum izni alma hakkını zorunlu kılıyor.\n\nHükümetteki birçok kişi bunu grevcilere tamamen teslim olmaktan başka bir şey olarak görmese de sonuçlar kesin: tüm fabrikalarda çalışmalar yeniden başladı."
 strikes_event.9.t:0 "İşçi Haklarını Koruma Kanunu"
 traitors:0 "Hainler!"
 turkey.1.a:0 "Atatürk hatırlanacak."
 turkey.1.d:0 "\n Cumhuriyet yasta.\n\n Savaş kahramanı, devrimci, cumhurbaşkanı ve Türklerin Atası Mustafa Kemal Atatürk vefat etti.\n\nSon ana kadar Türk halkına ve kurduğu cumhuriyete olan görevini sürdürdü. Binlerce yaslı kişi İstanbul'da saygılarını sundu, ardından naaşı lafzen, gemiyle ve trenle Ankara'ya nakledildi. Orada devlet cenazesi tüm parlamento ve dünyanın dört bir yanından gelen devlet adamlarının katılımıyla yapıldı.\n\nModern Türk ulusunun babası artık yokken, Cumhuriyet yoluna devam etmeli. Büyük Millet Meclisi halefi olarak [Root.GetLeader]'i seçti."
 turkey.1.t:0 "Mustafa Kemal Atatürk'ün Ölümü"
 unfortunate:0 "Şanssızlık."
 usa.1.a:0 "Evet, ona ihtiyacımız var."
 usa.1.b:0 "Hayır, bu gerekli olmayacak."
 usa.1.d:0 "Amerika savaşa hazırlanırken, alışılmadık bir talep aldık. Kısa süre önce dünyayı başarıyla dolaşan ünlü havacı Amelia Earhart, Ordu Hava Kuvvetleri'ne avcı pilotu olarak yazılmak istiyor. Tatbikat hava çatışmalarında önemli bir beceri sergiledi, ancak askeri çevrelerde bir kadının muharebe görevlerinde uçması fikrine kaş çatan birçok kişi var. Onun durumunda bir istisna yapıp katılmasına izin vermeli miyiz?"
 usa.1.t:0 "Earhart Askere Yazılmak İstiyor"
 usa.10.a:0 "[Root.GetLeader] yetenekli bir lider olduğunu kanıtladı."
 usa.10.b:0 "Amerika yeni bir Yeni Düzen'e hazır."
 usa.10.d:0 "Yeni Düzen'in birçok yönü [Root.GetLeader] tarafından korunmuş olsa da, Roosevelt hala programların devam eden gelişimi için orijinal planlarını gerçeğe dönüştürme fırsatını görüyor. Sağlığının bozulmasına rağmen, daha önce başkanlığı kazanmasını sağlayan desteğin çoğunu korumayı başardı ve şimdi yeniden Demokratlar için kampanya yürütüyor.\n\n[Root.GetLeader], Amerika'nın hassas durumunda bir liderlik değişikliğinin sorumsuzluk olacağını savunuyor; bu, Roosevelt'e karşı önceki zaferinden önce aynı iddianın yapıldığı düşünüldüğünde biraz ironik. Buna rağmen, haklı olabilir."
 usa.10.t:0 "[Root.GetLeader], Roosevelt'e Karşı"
 usa.11.a:0 "Roosevelt ve Truman bu işin üstesinden gelecek."
 usa.11.b:0 "MacArthur savaş adamı olduğu kadar barış adamıdır da."
 usa.11.d:0 "Savaşa sürüklenme tehdidinin devam etmesiyle birlikte, hem Demokratlar hem de Cumhuriyetçiler ordudan bir aday bulmayı arzuladılar. Normalde askeri görevlerine bağlı olan General Douglas MacArthur, ulusumuz barış içindeyken Cumhuriyetçi adaylığı için kampanya yapma fırsatını yakaladı ve kazandı. Şimdi muhafazakar koalisyonu destekleyerek Roosevelt'e meydan okuyor.\n\nRoosevelt popüler olmaya devam ediyor, ancak MacArthur'un karizması ve görev duygusu seçmenler üzerinde güçlü bir etki bıraktı. Ordu gerçekten en iyisini biliyor mu?"
 usa.11.t:0 "Roosevelt, MacArthur'a Karşı"
 usa.12.a:0 "MacArthur'a Beyaz Saray'dan çok cephede ihtiyaç var."
 usa.12.b:0 "Roosevelt'e meydan okuması için ona ihtiyacımız var."
 usa.12.d:0 "Roosevelt'in rekor süreli başkanlığına meydan okumak için Cumhuriyetçiler, Amerika'yı bu savaştan geçirecek potansiyel bir aday bulma umuduyla saygın askeri komutanlara başvurdular. General Douglas MacArthur muhafazakarlar arasında popüler bir aday oldu, ancak aynı zamanda devam eden çatışmada vazgeçilmez bir değer ve başkanlık için kampanya yapmaya isteksizdi.\n\nYine de daha umut verici muhafazakar adaylardan biri olmaya devam ediyor ve belki de ılımlı bir Cumhuriyetçi başkan edinmekten kaçınmak için kampanya yapmaya ikna edilebilir. Bu fedakarlığa değer mi?"
 usa.12.t:0 "Douglas MacArthur'un Kampanyası"
 usa.13.a:0 "Böylece bir devir sona erdi ve bir başkası başladı."
 usa.13.d:0 "Başkan Roosevelt'in sağlığı bir süredir bozulmakta olsa da, güçlü başkanlık kampanyası birçok kişiyi daha uzun yıllar yaşayacağına ikna etmişti. Ancak, FDR'nin görevdeyken ölme olasılığı devam ediyordu ve bugün geçirdiği bir felç sonucu vefat etti. Başkan Yardımcısı Harry S. Truman şimdi yemin ederek göreve başladı ve halkın desteğini ve dualarını istedi. Eski kabine görevine devam ediyor ve Truman, selefinin birçok politikasını sürdüreceğine söz verdi."
 usa.13.t:0 "Roosevelt Vefat Etti"
 usa.14.a:0 "Demokrasiye Dönüş."
 usa.14.b:0 "Faşizme Sadık Kal."
 usa.14.d:0 "Büyük rol modelimiz Nazi Almanyası, en derin ilkelerine ihanet etti ve büyük düşman Komünistlerle ittifak kurdu. Bilgi yayıldıkça huzursuzluk da ardından geliyor. Halk, Komünist bir devrim korkusuyla bizi bu noktaya kadar takip etmeye istekliydi, ancak Almanya'nın saf değiştirmesiyle büyük canlanmamız sorgulanıyor."
 usa.14.t:0 "Faşist Alacakaranlık"
 usa.17.a:0 "[From.From.GetName]'e savaşa hazır olduğumuzu bildirin."
 usa.17.a_tt:0 "§REğer [From.From.GetName] geri adım atarsa, bu beyaz barışla sonuçlanacaktır.§!\n"
 usa.17.b:0 "Bu sefer müdahale etmeyeceğiz."
 usa.17.d:0 "Dünya zaten güvensiz bir yer. Kendi bölgemizde savaşa gerçekten izin verebilir miyiz, yoksa barışın korunmasını mı sağlamalıyız? [From.From.GetName]'e [From.GetName] ile barış yapması için bir ültimatom gönderebilir veya onları kendi hallerine bırakabiliriz."
 usa.17.t:0 "[From.From.GetName], [From.GetName]'e savaş ilan etti"
 usa.18.a:0 "[From.GetName]'e savaşa hazır olduğumuzu bildirin."
 usa.18.b:0 "Geri adım atacağız."
 usa.18.b_tt:0 "[Root.GetNameWithFlag], [being_attacked.GetNameWithFlag] ile barış yapar."
 usa.18.d:0 "[From.GetName], [being_attacked.GetName]'e karşı olan çatışmamızdan memnun değil. [being_attacked.GetName] ile derhal bir barış anlaşması imzalamazsak bizi kendi savaşlarıyla tehdit ediyorlar. \nGeri adım atmalı mıyız?"
 usa.18.t:0 "[From.GetName], [being_attacked.GetName]'e karşı savaşa müdahale ediyor"
 usa.19.t:0 "[From.GetNameWithFlag], [Root.GetName]'e karşı Kukla (odak) savaş hedefi kazanır"
 usa.2.a:0 "Ya Özgürlük Ya Ölüm!"
 usa.2.d:0 "Amerika Birleşik Devletleri'nin benzersiz kuruluşu ve tarihi, dünyada demokrasiyi ve özgürlüğü korumayı görevimiz haline getiriyor. Son on yıl, bu misyonun onu yok etmeye çalışanlara karşı silaha sarılmadan yerine getirilemeyeceğini kanıtladı. Bundan böyle, her zalim bize hesap verecek ve silahlı kuvvetlerimiz dünya genelindeki insanları özgürleştirecektir."
 usa.2.t:0 "Kaderin Cilvesi (Manifest Destiny)"
 usa.20.a:0 "Kalplerimizde her zaman [Root.GetAdjective] olacağız."
 usa.20.a_tt:0 "[Root.GetNameWithFlag] şunu kazanır: §YABD Etkisi§!"
 usa.20.d:0 "[From.GetName]'nin demokrasiyi savunması ülkemizi etkilemeye başlıyor. Radyo yayınları [From.GetLeader]'in konuşmalarının halkımıza ulaşmasını sağlıyor ve birçok [Root.GetAdjective]'nin [From.GetAdjective] yaşam tarzına ilgi duyduğunu gördük. [Root.GetName] bir kukla değildir, ne de siyasetimizin [From.GetName] tarafından dikte edilmesine izin vereceğiz. Ancak, [From.GetAdjective] siyasetinin ülkemiz üzerindeki etkisini inkar edemeyiz."
 usa.20.t:0 "ABD Etkisi"
 usa.21.d:0 "[From.GetName]'nin komünizmi savunması ülkemizi etkilemeye başlıyor. Radyo yayınları [From.GetLeader]'in konuşmalarının halkımıza ulaşmasını sağlıyor. Hatta [Root.GetAdjective] işçilerini örgütlenmeye teşvik eden ve [From.GetAdjective] yaşam tarzını destekleyen propaganda broşürleri bile bulduk. [Root.GetName] bir kukla değildir, ne de siyasetimizin [From.GetName] tarafından dikte edilmesine izin vereceğiz. Ancak, [From.GetAdjective] siyasetinin ülkemiz üzerindeki etkisini inkar edemeyiz."
 usa.22.d:0 "[From.GetName]'nin faşizmi savunması ülkemizi etkilemeye başlıyor. Radyo yayınları [From.GetLeader]'in konuşmalarının halkımıza ulaşmasını sağlıyor ve hatta ülkenin bazı bölgelerinde [From.GetAdjective] yaşam tarzını destekleyen propaganda broşürlerinin dağıtıldığını bile bulduk. [Root.GetName] bir kukla değildir, ne de siyasetimizin [From.GetName] tarafından dikte edilmesine izin vereceğiz. Ancak, [From.GetAdjective] siyasetinin ülkemiz üzerindeki etkisini inkar edemeyiz."
 usa.23.a:0 "[From.GetName] güçleniyor."
 usa.23.a_tt:0 "[From.GetNameWithFlag] şimdi Amerikan savaşlarına müdahale edebilir."
 usa.23.d:0 "[From.GetName] şimdi Monroe Doktrini'ni çok daha katı bir şekilde uyguluyor. Ülkemiz üzerindeki siyasi etkilerinin yanı sıra, [From.GetName] yetkilileri şimdi Amerikan ülkeleri arasındaki herhangi bir çatışmaya müdahale etmeye hazır olduklarını ilan ediyorlar."
 usa.23.t:0 "ABD Koruması"
 usa.24.a:0 "Demokrasiye Dönüş."
 usa.24.b:0 "Komünizme Sadık Kal."
 usa.24.d:0 "[SOV.GetNameDefCap], birçok kişiyi kapitalizmi devirmenin mümkün olduğuna ikna eden ilham kaynağı, uluslararası devrime ihanet etti ve Nazi Almanyası ile aynı hizaya geldi. Tek ülkede sosyalizm ile faşistlerle bu ittifak arasında, insanlar dünya çapında komünist ideallerin samimiyetinden şüphe etmeye başlıyor. Amerikan komünizmi, [Root.GetLeader]'in gücünü pekiştirmek için kullandığı başka bir araç mı sadece?"
 usa.24.t:0 "Kızıl Alacakaranlık"
 usa.3.a:0 "Fırsatın ne kadar süreceğini kim bilebilir?"
 usa.3.d:0 "Amerika Birleşik Devletleri'nden maruz kaldığımız diplomatik ve ekonomik yaptırımlar, daha tehditkar bir şeyin başlangıcı gibi görünüyor. Amerikan Pasifik Filosu, Hawaii'deki Pearl Harbor deniz üssüne yerleştirildi; bu, Amerikalıların Pasifik'te güçlü bir varlık sürdüreceğini ve düşmanlarımızı desteklemeye devam edeceğini açıkça gösteriyor. Bu noktada üsse saldırmak bize sürpriz unsurunu verebilir."
 usa.3.t:0 "Pearl Harbor'daki Amerikan Filosu"
 usa.30.a:0 "Halk konuştu."
 usa.30.desc:0 "Her iki yılda bir, Senato koltuklarının üçte biri ve Temsilciler Meclisi'ndeki tüm koltuklar seçime tabi tutulur. Genellikle dünya olaylarının gölgesinde kalsa da, her seçim bölgesindeki yerel durum bazen fark yaratabilir.\n\nTüm oylar sayıldıktan sonra, hükümeti destekleyen grup [USA.GetSenateElectionOutcome] Senato'da ve [USA.GetHouseElectionOutcome] Temsilciler Meclisi'nde."
 usa.30.t:0 "Kongre Seçimleri"
 usa.31.a:0 "Millet konuştu."
 usa.31.desc:0 "Yeni bir başkanın göreve gelmesiyle birlikte, Kongre'deki eski muhalefet büyük ölçüde yeni yönetimi desteklemeye yöneldi. Başkan [USA.GetLeader] [?senators_support] Senatörlerin ve [?representatives_support] Temsilcilerin desteğine güvenebilir."
 usa.31.t:0 "Siyasi Peyzajda Bir Değişim"
 usa.32.a:0 "Nüfustaki desteğimizin açık bir işareti."
 usa.32.desc:0 "Başlattığımız seçim sistemi reformlarının en başarılı olduğu görülüyor, çünkü destekçilerimizin büyük bir kısmı son seçimde Kongre'ye seçildi. Sağlam bir çoğunlukla, siyasi gündemimizi ilerletmekte pek sorun yaşamamalıyız."
 usa.32.t:0 "Hükümet Grubu Kongre’de Çoğunluğu Kazandı"
 usa.4.a:0 "Bu eşsiz bir fırsat."
 usa.4.a.tt:0 "43 Amerikan Muhribi kazanacağız.\nKanada 7 Amerikan Muhribi kazanacak."
 usa.4.b:0 "Bu açıkça ABD için daha avantajlı ve kabul edilemez."
 usa.4.d:0 "Almanlara karşı bir duruş sergileyen ABD, İngiltere'nin Alman tehdidine karşı güçlü durmasını sağlamakla ilgileniyor gibi görünüyor. Ancak, Atlantik'teki kendi deniz varlıklarını sürdürme konusunda da endişeliler. Birkaç deniz üssümüz karşılığında, ulusumuza muhrip gemileri tedarik edecekler. Gemiler yedekte tutuluyordu, ancak kabul etmek yine de uluslarımız arasındaki askeri bağları güçlendirecek ve akıllıca bir karar olabilir."
 usa.4.t:0 "Üsler Karşılığında Muhripler Anlaşması"
 usa.40.a:0 "Yararlı bir müttefik."
 usa.40.desc:0 "Son oylamada, bir senatör şaşırtıcı bir şekilde taraf değiştirerek bir hükümet önerisine oy verdi. Sorunun kendisi oldukça önemsiz olsa da, [USA.GetLeader]'ın daha önce açıkça eleştiren birinin kamuoyunda verdiği destek oyu Washington'da birçok kaşın kalkmasına neden oldu.\n\nBazı analistler bu örneğin ek senatörlerin tutumlarını yeniden gözden geçirmelerine yol açacağına inanıyor."
 usa.40.t:0 "Senatör, Hükümet Teklifine oy verdi"
 usa.401.a:0 "Dilenciler seçim yapamaz."
 usa.401.desc:0 "İngiliz Başbakanı [From.GetLeader], Üsler İçin Muhripler Anlaşması'nın şartlarını kabul ettiğini bildirdi. Bir grup [From.GetAdjective] deniz subayı, muhripleri denetlemek ve transferi denetlemek için geldi.\n\nBirkaç [From.GetAdjective] subayının, transfer edilecek gemilerdeki guano ve pasın miktarı ve kalınlığı konusunda biraz endişeli görünmesi nedeniyle, yapılması gereken bazı işler olduğu açıkça görülüyor."
 usa.401.t:0 "[From.GetNameDefCap] Üs Anlaşması için Destroyerleri kabul ediyor"
 usa.41.a:0 "O haklı, biliyorsun."
 usa.41.desc:0 "Bağış toplama yemeğinde bir dizi politika meselesine ilişkin tutumu sorulan bir temsilci, Başkan [USA.GetLeader]'in politikalarını desteklediğini söyledi. Ayrıca, birçok temsilci arkadaşının da benzer görüşlere sahip olduğunu, ancak Amerikan halkı için doğru olanı yapmak yerine yalnızca \"aptalca dar görüşlülük, bir sonraki seçimden başkasını düşünmeme\" nedeniyle geride kaldıklarını iddia etti. \n\nYorumları basında geniş yer buldu ve bu konularda nerede durduklarını açıklamak zorunda kalan birçok meslektaşını zor durumda bıraktı."
 usa.41.t:0 "Temsilci, Hükümeti desteklemek için tutkuyla konuşuyor"
 usa.42.a:0 "Yakında koşarak geri gelecektir."
 usa.42.desc:0 "Bir Senatör büyük bir gazeteye röportaj vererek Başkan [USA.GetLeader]'in \"aptalca ve tehlikeli\" politikalarını artık destekleyemeyeceğini söyledi. Ayrıca, benzer düşünen ve kısa sürede Başkan'ı terk edecek birkaç Senatör tanıdığını da iddia etti."
 usa.42.t:0 "Senatör, Hükümet Politikasına karşı konuşuyor"
 usa.43.a:0 "Utanç verici."
 usa.43.desc:0 "Vergi reformu üzerine yakın zamanda yapılan bir tartışmada, bir Temsilci, Yönetimin birçok başarısızlığı hakkında uzun uzadıya bir konuşma yaptı. Ona göre, hiçbir doğru düşünen Amerikalı, parti üyeliği ne olursa olsun, Başkan'ın politikalarını desteklemek isteyemez.\n\nSert sözlerinin bir etkisi olmuş gibi görünüyor, çünkü daha önce [USA.GetLeader] politikalarının arkasında kararlı bir şekilde düşünen birçok Temsilci destek sesleri çıkardı."
 usa.43.t:0 "Temsilci, Başkanı eleştiriyor"
 usa.44.a:0 "Harika."
 usa.44.desc:0 "Başkan [USA.GetLeader]'ı kınama önergesi Senato'da reddedildi. En ateşli destekçileri bile bunun geçeceğine dair pek umutlu olmasa da, aleyhine verilen oy miktarı en kötümser gözlemciler için bile şok ediciydi. Başkan'ın Senato'da çoğu kişinin inandığından çok daha fazla desteğe sahip olduğu anlaşılıyor ve bu da yasama gündemini ilerletmesine yardımcı olmalı."
 usa.44.t:0 "Muhalefet Senato'da yenilgiye uğradı"
 usa.45.a:0 "Onlar da gerekir."
 usa.45.desc:0 "Temsilciler Meclisi Yollar ve Araçlar Komitesi'ndeki son duruşmalar, Başkan'ın politikalarının ekonominin tüm mevcut ölçütlerinde büyük iyileştirmeler sağladığını belirten bir raporla sonuçlandı. Açıkça övgüde bulunmasa da, rapor yine de Başkan'ı eleştiren ve reform talep edenlere bir darbe olarak geldi.\n\nBirçok Temsilci, Başkan'ın gündemi hakkında hala şüpheleri olmasına rağmen, artık destek oyu kullanacaklarını kamuoyuna açıkladı."
 usa.45.t:0 "Meclis, Başkanlık Politikasını destekliyor"
 usa.46.a:0 "Özlenecek. Ve onun oyu da."
 usa.46.desc:0 "Küçük bir kalp krizinin ardından, kıdemli bir senatör bugün sağlık nedenleriyle emekli olacağını duyurdu. Kongre'de yirmi yıldan fazla süre geçiren senatör, geniş bir destekçi ağı kurdu ve etkisi çok önemliydi. Teknik olarak tek bir oya sahip tek bir adam olmasına rağmen, Washington içeriden kişiler onu birkaç oya değer olarak gördüler çünkü birkaç oy daha almanın anahtarıydı.\n\nKoltuğun büyük ihtimalle Başkan'ın [USA.GetLeader] açıkça eleştiren birine gitmesiyle, Yönetimin yasa tasarılarını geçirmek için gereken oyları alması çok daha zor olacak."
 usa.46.t:0 "Senatör emekli oluyor"
 usa.47.a:0 "Bir cadı avı."
 usa.47.desc:0 "Beyaz Saray'da başlayan küçük bir skandal ivme kazanmaya başladı. Haftalardır medyada çıkan, küçük bir idari yetkilinin kazançlı hükümet sözleşmeleri karşılığında rüşvet aldığına dair haberlerin ardından, Yürütme'deki Harcamalar Komitesi, Başkan'ın bundan haberdar olup olmadığını belirlemek için duruşmalar düzenlemeye başladı. Çoğu gözlemci bunun Başkan [USA.GetLeader] için büyük bir soruna yol açacağına inanmasa da, şüphesiz başkanın destekçilerinin çoğunun bir süre sessiz kalması gerekecek."
 usa.47.t:0 "Cumhurbaşkanlığı suiistimaline dair meclis toplantıları"
 usa.5.a:0 "Onların kaybı."
 usa.5.d:0 "Hazırlıklarımıza ve iyi niyetimize rağmen, İngiltere eski Muhripler karşılığında deniz üsleri teklifimizi reddetti."
 usa.5.t:0 "İngiltere Teklifi Reddediyor"
 usa.6.a:0 "Demokratlar. Dört yıl daha!"
 usa.6.b:0 "Cumhuriyetçiler. Amerikan sisteminin ideallerini korumalıyız."
 usa.6.d:0 "Başkanlık seçim günü geldi. Görevdeki Franklin Delano Roosevelt, ABD'yi Büyük Buhran'dan çıkarmayı amaçlayan ve topluca Yeni Düzen olarak adlandırılan programların birkaçını zaten uygulamıştı.\n\nÇabaların birçoğu popüler olsa da, hükümetin rolünü ve gücünü daha da genişletme planları, rakibi Cumhuriyetçi Alf Landon'dan eleştiri aldı. Petrol endüstrisinden gelen Landon daha fazla ekonomik özgürlük görmek isterken, Roosevelt ve Demokrat Parti Sosyal Güvenliği genişletmek ve ekonomik istikrarı sağlamak istiyor. Seçim kıl payı bir sonuçla bitebilir veya Demokratlar için büyük bir zafer olabilir."
 usa.6.t:0 "[GetYear] Seçimi"
 usa.61.a:0 "Çok az gelişmiş bir bölge."
 usa.61.b:0 "Bu yolsuzluk kokuyor."
 usa.61.desc:0 "[USA_congress_investment_state.GetName] eyaletinin kıdemli senatörü hükümete destek teklifiyle yaklaştı. Eyaletinde kritik düzeyde yatırım eksikliği var ve hükümet tarafından başlatılan bir ekonomik teşvik programı, kesinlikle onun belirli önerilen hükümet politikalarına ilişkin duruşunu yeniden gözden geçirmesini sağlayacaktır. Senatör birkaç önemli komitede yer alıyor ve anlaşmalar yapabilmesiyle oldukça ünlü, bu da onun oyu her iki mecliste de birkaç oy daha fazlasına değer kılıyor."
 usa.61.t:0 "[USA_congress_investment_state.GetName]'li Senatör destek veriyor"
 usa.62.a:0 "Çok fazla iyi noktaya değiniyorlar."
 usa.62.b:0 "Bu tür anlaşmalar Başkanın altındadır."
 usa.62.desc:0 "[USA_congress_investment_state.GetName] Senatörleri, hükümete yaklaşarak, [USA_congress_investment_state.GetName]'in Ordu için yeni bir mühimmat fabrikasının yeri olacağına dair gayrı resmi bir garanti karşılığında Başkan'a desteklerini teklif ettiler. Bölgede bir fabrika inşa etmenin çok sayıda iş yaratacağını ve Ordu'ya giderek daha tehlikeli hale gelen bir dünyada çok ihtiyaç duyulan desteği sağlayacağını savunuyorlar. İki Senatör ayrıca Temsilciler Meclisi'nin birkaç etkili üyesiyle olan mükemmel çalışma ilişkilerinden bahsetti."
 usa.63.a:0 "Övgüye değer bir girişim."
 usa.63.b:0 "Bırak bunu kendi başlarına itmeye çalışsınlar."
 usa.63.desc:0 "[USA_congress_investment_state.GetName] Kongre Heyeti, eyaletin altyapısını iyileştirmek için hükümete çeşitli önerilerle yaklaştı. Eyaletler arasındaki ticareti teşvik etmek için yollar ve köprüleri iyileştirmek için federal fon sağlanmalıdır. Ayrıca, hükümetin bu konuda desteğinin, kendilerinin Başkan'ı gündeminde daha doğrudan desteklemeye daha meyilli hale getireceğini belirttiler."
 usa.63.t:0 "[USA_congress_investment_state.GetName]'in temsilcileri destek sunuyor"
 usa.64.a:0 "Kritik bir zayıflık."
 usa.64.b:0 "Daha büyük sorunlarımız var."
 usa.64.desc:0 "[USA_congress_investment_state.GetName]'den kıdemli Senatör tarafından teşvik edilen Senato Ticaret Komitesi, yerel gemi inşa endüstrisinin durumu hakkında duruşmalara başladı. Uzmanlara göre, ABD ticaretinin önemli bir yüzdesi denizaşırı ticarete bağlı ve ülke gemi inşa kapasitesinden umutsuzca yoksun. [USA_congress_investment_state.GetName], büyük bir yatırım yapılması gereken bir bölge olarak belirlendi ve birkaç komite üyesi [USA.GetLeader] yönetiminin bunun için fon ayıracağı beklentisini dile getirdi."
 usa.64.t:0 "Senato Komitesi, [USA_congress_investment_state.GetName]'de gemi inşasını araştırıyor"
 usa.65.a:0 "Pilotu cesaretinden dolayı ödüllendirin!"
 usa.65.b:0 "Eğer o [GER.GetAdjective]lere güveniyorsa, biz ona güvenmiyoruz!"
 usa.65.c:0 "Bunun yayılmamasına dikkat edin."
 usa.65.desc:0 "Hava Kuvvetleri'nden dikkat çekici bir hikaye ile karşılaştık. [GER.GetAdjective] askeri sanayisine yapılan başarısız bir bombalama saldırısının ardından, bombardıman uçağımız ''Ye Olde Pub'' ciddi hasar görmüş, bir mürettebat üyesini kaybetmiş ve geri kalanını ağır yaralanmış olarak görmüştü. 2. Teğmen Charles ''Charlie'' Brown liderliğindeki mürettebat, güvenli bir iniş yapamayanları geride bırakıp uçakla birlikte batmayı reddetmişti.\n\nSarhoş uçak bir kez daha kendisini savunmak için neredeyse hiç çalışır silahı kalmayan düşman bir avcı uçağı tarafından durdurulurken, mürettebat avcı uçağının ateş açmadığını görünce şok oldu. [GER.GetAdjective] pilotu jestler ve ağız hareketleri yoluyla mürettebatla iletişim kurmaya çalıştı. Her iki tarafın da büyük çabalarına rağmen hiçbir iletişim yolu mümkün olmadı. Savaşçı, ''Ye Olde Pub''a [GER.GetAdjective] hava sahasından eşlik etti ve mürettebat, artık desteğine ihtiyaç duymadıklarını belirtmek için kalan tek silahlarını savaşçıya doğrulttuğunda, savaş pilotu selam verdi ve [GER.GetNameDef]'e geri döndü.\n\nHikaye, rakip tarafta bile hala iyi insanların olduğu umudunu getiriyor, ancak bu hikayenin halkımız ve birliklerimiz arasında serbestçe yayılmasına izin vermenin istenmeyen yan etkileri olabilir."
 usa.65.t:0 "Şaşırtıcı Bir [GER.GetAdjective] Merhamet Gösterisi."
 usa.7.a:0 "Demokratlar. FDR vazgeçilmezdir."
 usa.7.b:0 "Cumhuriyetçiler. Willkie'yi istiyoruz!"
 usa.7.d:0 "Amerika Birleşik Devletleri Başkanlığı makamı kurulduğundan beri hiçbir başkan art arda üç dönem görev yapmadı. Ancak, dünyanın istikrarsız durumu ve son birkaç yıldaki uluslararası gelişmeler ışığında, Başkan Roosevelt geleneği bozmaya ve üçüncü bir dönem için aday olmaya karar verdi. Sınırlı siyasi deneyime sahip bir sanayici geçmişi olan sürpriz bir aday olarak nitelendirilen Cumhuriyetçi Wendell Willkie, hem Roosevelt'in ekonomik müdahaleciliğini hem de üçüncü bir dönem için aday olma gerekçelerini eleştirdi.\n\nAdayların dış politikalarında pek çok ortak noktası olmasına ve Willkie'nin Yeni Düzen'in bir türünü korumak istemesine rağmen, birçok kişi hala bu seçimi Amerikan demokrasisinin geleceği için belirleyici bir nokta olarak görüyor."
 usa.7.t:0 "Roosevelt, Willkie'ye Karşı"
 usa.8.a:0 "Cumhuriyetçiler. Landon değerlerimize bağlıdır."
 usa.8.b:0 "Demokratlar. Roosevelt ne gerekiyorsa yapmaya hazır."
 usa.8.d:0 "Başkan Landon dört yıl önce Demokratların devam eden Yeni Düzen reformlarına son verdi ve ulusun gücünün, başkanlığından önce kurmasına yardım ettiği sanayi şirketleri gibi şirketlere dayandığını seçti. İkinci dönemi için başlangıçta planladığı programları tamamlama lehine kampanya yapmaya devam eden Roosevelt, şimdi yeniden başkanlığa aday. Popüler bir aday olmaya devam etse de, Landon gücü başkanın elinde toplama çabalarını eleştirmeye devam etti ve buna uygun olarak kendisi de benzer politikalardan kaçındı.\n\nHem kendi ulusumuza hem de başkalarına yönelik dış tehditler bir gerçeklik olmaya devam ediyor ve hiçbir aday Amerika Birleşik Devletleri'nin bunlara göz yummasından yana değil. Soru, bu zor zamanlarda demokrasi cephaneliğini kimin yöneteceği."
 usa.8.t:0 "Landon, Roosevelt'e Karşı"
 usa.9.a:0 "FDR, Dewey'i yener."
 usa.9.b:0 "Dewey, FDR'yi yener."
 usa.9.d:0 "Franklin D. Roosevelt'in başkanlığı zaten birçok yönden istisnai olmuştur. Sağlığının bozulmasına ve başkanlığının benzeri görülmemiş uzunluğuna rağmen, savaş çabalarında ülkemizi yönetmeye devam etmeyi arzuluyor. Cumhuriyetçiler, birçok potansiyel adayın savaşta görev yapması nedeniyle aday seçimlerinde sınırlı kaldılar, ancak onları temsil etmesi için Vali Thomas E. Dewey'i seçtiler.\n\nRoosevelt halk desteğini sürdürüyor, ancak birçok kişi döneminin sonunu göremeyebileceğinden şüpheleniyor. Ama bu, Dewey'e bizi bu noktaya getiren adama karşı bir zafer kazandırmak için yeterli mi?"
 usa.9.t:0 "Roosevelt, Dewey'e Karşı"
 usa_congress_elections_tt_bad:0 "Kongre seçimlerinde hükümeti destekleyen grup daha güçlü bir muhalefetle karşı karşıya kalacak.\n"
 usa_congress_elections_tt_good:0 "Cumhurbaşkanlığı seçimlerinden kazanılan momentumun kongre seçimlerini geçme olasılığı yüksektir.\n"
 war_justification.1.a:0 "Gelecek [ROOT.GetName]'e aittir!"
 war_justification.1.d:0 "'[From.GetName], [From.GetAdjective] halkına mı ait? Kendimize daha iyi bir soru soralım: Gelecek [From.GetAdjective] halkına mı ait, yoksa [ROOT.GetNameDef]'e mi?'\n\n[ROOT.GetLeader]'in bugünkü konuşması, [ROOT.GetName]'nin savaş yolunda olduğunu gösterdi. Siyasi gerginlikler geçen ay boyunca arttı ve [ROOT.GetAdjective] halkı savaşın kaçınılmaz olduğunu kabul ediyor gibi görünüyor."
 war_justification.1.t:0 "[ROOT.GetLeader], [From.GetName]'e Karşı Konuşuyor"
 war_justification.10.a:0 "[From.GetName] zaten şüpheli bir demokrasi."
 war_justification.10.d:0 "'Ağır bir kalple durumumuzun gerçekliğiyle yüzleşmeliyiz: [From.GetName]'in işgali tek çaremiz olabilir. Mevcut durumumuzda başka bir çözüm denemek için çok büyük bir stratejik avantaja sahip. Hem [ROOT.GetAdjective] hem de [From.GetAdjective] halkının savaş istemediğine güvensak da, tarih bizi bu noktaya getirdi ve seçeneklerimiz sınırlı. Ancak askeri gücümüzü bu şekilde kullanarak gelecekte daha fazla kan dökülmesini önleyebileceğimizi umabiliriz.'\n\nDemokrasilerin diğer demokrasilere karşı savaşmadığı popüler bir teori olsa da, son gelişmeler gelecekte [ROOT.GetAdjective]'nin [From.GetName]'i işgal edeceğine işaret ediyor. Tarih bizi henüz şaşırtabilir."
 war_justification.10.t:0 "[ROOT.GetLeader], [From.GetName]'e Müdahale Çağrısında Bulunuyor"
 war_justification.11.a:0 "Şiddet içeren bir ideoloji izliyorlar, şiddetten başka ne tepki bekleyebilirler ki?"
 war_justification.11.d:0 "'Şüphesiz, [From.GetName] komünizmi bu çağdaki özgürlük ve düzene yönelik en büyük tehditlerden biridir. Acımasız ve amansız, sadece [From.GetAdjective] halkının müreffeh, demokratik bir toplum umudunu değil, aynı zamanda komşularınınkini de yutmakla tehdit ediyor. Şimdi harekete geçmezsek, bu ilk domino taşının çok geç düştüğünü görebiliriz ve ardından daha fazla başarısız sosyal deney bırakabiliriz. Müdahale etmeden önce daha kaç kişinin ölmesi gerekiyor?'\n\n[From.GetAdjective] hırsları tarafından körüklenen demokrasimizi baltalayan yıkıcı faaliyet tehdidi, son zamanlarda hararetle tartışılan bir konu haline geldi. Muhalefetteki temsilciler bunun [From.GetName] ile savaş peşinde koşmayı amaçlayan bir Kızıl Panik olduğunu iddia etse de, [ROOT.GetRulingParty]'nin söylemi şimdiye kadar oldukça başarılı oldu."
 war_justification.11.t:0 "[ROOT.GetLeader] Kızıl Tehdide Karşı Konuşuyor"
 war_justification.12.a:0 "Onlar gidene kadar zamanımızda barış olamaz."
 war_justification.12.d:0 "'Modern tarihte, hatta belki de tüm tarihte, [From.GetRulingParty]'nin [From.GetName]'i elinde tuttuğu demir pençeden daha kötü bir tiranlık olmamıştır. İnsanlar, çatışmayı kışkırtmamamız gerektiğini, gelecekte [From.GetLeader]'in antlaşmalara ve vaatlere sadık kalacağına güvenmemiz gerektiğini savunabilirler, ancak bu insanlar faşizm yönetimi altında yapılan antlaşmaların işe yaramaz olduğunu göremiyorlar. Bu onursuz yalancılar için güçlü olan haklıdır ve bir anlaşmanın yazıldığı kağıt, onları eleştirenlerin kitapları kadar kolay yanar.'\n\n[From.GetName] ile doğrudan bir çatışmadan kaçınmayı uzun süredir uman insanlar, şimdi [ROOT.GetLeader] tarafından şiddetle karşı çıkılıyor; zira kendisi, Makyavelist terimlerle savaşı sadece düşmanın avantajına ertelediğimizi savunuyor. Bu gidişle, ilk darbeyi vuran biz olabiliriz."
 war_justification.12.t:0 "[ROOT.GetLeader], [From.GetAdjective] Faşizmiyle Yüzleşiyor"
 war_justification.13.a:0 "Zor bir karar olabilir, ama arkasında durmalıyız."
 war_justification.13.d:0 "'Barışçıl bir halk olsak da, doğamız tek başına tarihte izlememiz gereken yolu belirlemez. Bu bir savaş zamanıdır. Çok uzun zamandır, [From.GetAdjective] halkı karşılaşabileceğimiz sınavlardan geçmek için ihtiyaç duyduğumuz araçlara sahip oldu ve bunları barışçıl bir şekilde bırakmayacakları aşikar. Modern bir devlet kurmak için gösterdiğimiz tüm çabalara rağmen, bazı meseleler ancak eski savaş sınavlarıyla çözülebilir.'\n\n[ROOT.GetLeader]'in [From.GetName]'e yönelik düşmanca söylemi bir işgali haklı çıkarmak için büyük çaba sarf etti. Nüfusun bir kısmı bu yolu destekliyor, ancak karar liderimizin elinde."
 war_justification.13.t:0 "[ROOT.GetLeader], [From.GetName]'e Karşı Savaş Çağrısında Bulunuyor"
 war_justification.14.a:0 "Zorluklarımızın bizi ne kadar güçlendirdiğini bilmiyorlar."
 war_justification.14.d:0 "'[From.GetName] kendilerini bizden daha modern ve gelişmiş sanabilir, ancak gerçek şu ki onların ulusu bizimki gibi sınanmadı ve ufukta şimdi açıkça görünen tehditlere de hazır değiller. Bize karşı olan küçümsemeleriyle ve haklı olarak bizim olanı ele geçirmemizi engelleyerek, bizi kendileri için o tehditlerden biri haline getirdiler. Zayıf ve bölünmüş ulusları iddialarımıza pek direnemeyecektir.'\n\n[ROOT.GetRulingParty]'nin uzun süredir [From.GetName]'e yönelik alaycı görüşü, eleştiriden düşmanlığa dönüştü. Halkın görüşü [From.GetAdjective] halkının savaştan kaçınmak istediği yönünde olsa da, [ROOT.GetLeader] seçilmiş liderlerinin kibirleriyle bunu kışkırttığını iddia ediyor."
 war_justification.14.t:0 "[ROOT.GetLeader], [From.GetAdjective] İddialarına Meydan Okuyor"
 war_justification.15.a:0 "Devrimde öldürülenlerin intikamı alınacak!"
 war_justification.15.d:0 "'[ROOT.GetAdjective] ulusal ruhu güçlüdür, ancak tüm uluslar o kadar şanslı değil. [From.GetName]'nin gelenekleri yok edildi ve haklı yöneticileri uzun zaman önce öldürülüp gömüldü, hepsi de büyük Marksist devrim fikri adına. Kanlı gaspçılar tarafından yoldan çıkarılmış bu dünyaya düzeni yeniden getirmek ve bu tehdide karşı [ROOT.GetName]'nin gücünü ortaya koymak bizim görevimizdir.'\n\n[ROOT.GetRulingParty] her zaman komünizme karşı çıkmış olsa da, [From.GetName] son konuşmalarda özel saldırıların hedefi oldu. Komünistlerden [ROOT.GetAdjective] ulusuna yönelik saldırının gerçek bir tehdit olup olmadığına bakılmaksızın, [From.GetAdjective] komünizmine yönelik önleyici saldırı zaten hazırlanıyor."
 war_justification.15.t:0 "[ROOT.GetLeader], [From.GetName]'de Düzeni Yeniden Kurmak İstiyor"
 war_justification.16.a:0 "Gelenek ve pragmatizm her zaman fanatizm ve teröre galip gelecektir."
 war_justification.16.d:0 "'Muhaliflerim size benim yönetimimin [From.GetName]'deki [From.GetRulingParty]'nin yönetimi gibi olduğuna inandırmak isterdi. Daha fazla yanılamazlardı. [From.GetLeader]'in başarıları son zamanlardaki bir modanın, diğer ulusları boyun eğdirmeye kararlı yıkıcı bir kitle hareketinin sonucu iken, [ROOT.GetRulingParty] o harekete boyun eğmeyecek olanlar olarak karşı çıkıyor. Bu tehdidi ortadan kaldırmak için ne gerekiyorsa yapmaya hazırım, savaş anlamına gelse bile.'\n\n[ROOT.GetLeader] rejimi [From.GetAdjective] ulusuna karşı düşmanca bir politika benimsedi. Liderlerimize ne denirse densin, faşist kelimesi düşmanlarımız için ayrılmıştır."
 war_justification.16.t:0 "[ROOT.GetLeader], [From.GetAdjective] Zalimlerini İfşa Ediyor"
 war_justification.17.a:0 "Bu davanın arkasında toplanmalıyız!"
 war_justification.17.d:0 "'Bir ulusun sınırlarını kim belirler ve bunlar nasıl belirlenir? Geçmişte insanların [ROOT.GetName]'nin nerede bittiğini ve [From.GetName]'nin nerede başladığını haklı çıkarmak için bulduğu yol ne olursa olsun, yeni bir çağda yaşıyoruz. Bu sınırın stratejik önemi abartılamaz ve halkımızın devam eden güvenliğini sağlamak için onu değiştirme hakkımız vardır.'\n\n[ROOT.GetLeader]'in son konuşmalarını dinlerken, [From.GetName]'in bir işgali yakın görünüyor. Muhalif sesler itiraz etti, ancak savaşa halk desteği artıyor."
 war_justification.17.t:0 "[ROOT.GetLeader], [From.GetAdjective] Egemenliğini Sorguluyor"
 war_justification.18.a:0 "En azından savaş yoluyla bu çatışmaya bir son verilecek."
 war_justification.18.d:0 "'[From.GetName]'nin savaşa hazırlandığına şüphe yok. Ekonomik politikadaki değişiklikler, [From.GetAdjective] halkının barışsever bir halk olmadığını, aksine bize saldırmak için doğru fırsatı beklediğini açıkça gösteriyor. [ROOT.GetName] savunmasızken onların silahlanmasını boş boş izleyecek miyiz? Yoksa bu tehdit gücümüzü aşmadan önce onu etkisiz hale mi getireceğiz?'\n\n[ROOT.GetRulingParty]'deki şahinler gözlerini [From.GetName]'e çevirdi ve saldırının en iyi savunma olduğunu savunuyor. Görüşleri ilgi görüyor ve [ROOT.GetName] savaşa hazırlanıyor."
 war_justification.18.t:0 "[ROOT.GetLeader], [From.GetName]'nin Niyetlerini Sorguluyor"
 war_justification.19.a:0 "Ne olursa olsun, halkı savaşa hazırlamalıyız."
 war_justification.19.d:0 "'[ROOT.GetName]'nin [From.GetAdjective] halkını barışsever bir halk olarak hayal eden saf vatandaşları gerçeklikten tamamen kopuktur. Sınırımızda yaşayanlar bu tür yanılsamaların lüksüne sahip değiller, birliklerinin hemen karşıda bize yaklaştığını görüyorlar. Bu, cevapsız bırakamayacağımız bir tehdittir. Her geçen gün, [From.GetName] savaşa hazırlanıyor. Bizim de aynısını yapmamamız delilik olurdu.'\n\nTopraklarımıza yakın [From.GetAdjective] askeri varlığı, bu ulusun giderek daha fazla [ROOT.GetRulingParty]'nin düşmanı gibi görünmesi nedeniyle artan bir endişeye yol açtı. Bunun nedeni mi yoksa polemiklerinin sonucu mu olduğu bir tartışma konusudur."
 war_justification.19.t:0 "[ROOT.GetLeader], [From.GetAdjective] Duruşundan Öfkeli"
 war_justification.2.a:0 "[ROOT.GetName], [ROOT.GetLeader] yönetiminde birleşmiştir."
 war_justification.2.d:0 "'[From.GetAdjective]ler özgürlük ve demokrasiye sahip olduklarını, barış istediklerini iddia ediyorlar, ancak gurur duydukları tüm bu şeyler boş. Demokrasileri, birleşik durması gereken yerde halkı bölüyor ve özgürlükleri sadece disiplin eksikliğini ele veriyor. Biz [ROOT.GetAdjective]ler bu yalanların içini görüyoruz... ve bu barışın, onların şartlarındaki barışın da bir yalan olduğunu görebiliyoruz.'\n\n[ROOT.GetRulingParty] uzun zamandır [From.GetAdjective] ulusunun zayıflığını alaya aldı, ancak son zamanlarda söylem daha saldırgan bir hal aldı. Silahlı çatışma günü yaklaşıyor."
 war_justification.2.t:0 "[ROOT.GetLeader], [From.GetAdjective] İdeallerini Kınıyor"
 war_justification.20.a:0 "Ulus bu önemli kararın arkasında duruyor."
 war_justification.20.d:0 "'Öngörülebilir, hatta kaçınılmaz olan [From.GetName] ile savaşta stratejik avantaja sahip olmak istiyorsak, tereddüt etmeye yer yok. Bu, çocuklarımızın geleceğini korumak ve [ROOT.GetName]'nin yarın dünyada bir yeri olmasını sağlamakla ilgilidir. Bu, davamıza ve doğal kabul ettiğimiz ideallere bağlılık meselesidir. Harekete geçme zamanı.'\n\n[ROOT.GetRulingParty] liderlerinden, en belirgin olarak [ROOT.GetLeader]'den bir dizi coşkulu konuşma, halkı [From.GetName]'in işgalini desteklemeye çağırıyor. İşgalin ardındaki jeopolitik güdüler, vatansever duygulara yönelik söylemde daha az belirgindir, ancak bu kampanya halkı gerekliliğine ikna etmede oldukça etkili görünüyor."
 war_justification.20.t:0 "[ROOT.GetLeader], [From.GetName]'in İşgalini Savunuyor"
 war_justification.201.a:0 "Neden barış içinde yaşamamıza izin verilmiyor?"
 war_justification.201.d:0 "'[ROOT.GetName], [ROOT.GetAdjective] halkına mı ait? Kendimize daha iyi bir soru soralım: Gelecek [ROOT.GetAdjective] halkına mı ait, yoksa [From.GetName]'e mi?'\n\n[From.GetLeader]'in bugünkü konuşması, [From.GetName]'nin savaş yolunda olduğunu gösterdi. Siyasi gerginlikler geçen ay boyunca arttı ve [From.GetAdjective] halkı savaşın kaçınılmaz olduğunu kabul etmiş gibi görünüyor. [ROOT.GetName] de hazırlanmalı."
 war_justification.201.t:0 "[From.GetLeader], [ROOT.GetName]'e Karşı Konuşuyor"
 war_justification.202.a:0 "[From.GetLeader] gibi faşist pisliklerden beklendiği gibi."
 war_justification.202.d:0 "'[ROOT.GetAdjective]ler özgürlük ve demokrasiye sahip olduklarını, barış istediklerini iddia ediyorlar, ancak gurur duydukları tüm bu şeyler boş. Demokrasileri, birleşik durması gereken yerde halkı bölüyor ve özgürlükleri sadece disiplin eksikliğini ele veriyor. Biz [From.GetAdjective]ler bu yalanların içini görüyoruz... ve bu barışın, onların şartlarındaki barışın da bir yalan olduğunu görebiliyoruz.'\n\n[From.GetRulingParty] uzun zamandır [ROOT.GetAdjective] ulusunun zayıflığını alaya aldı, ancak son zamanlarda söylem daha saldırgan bir hal aldı. Silahlı çatışma günü yaklaşıyor."
 war_justification.202.t:0 "[From.GetLeader], [ROOT.GetAdjective] İdeallerini Kınıyor"
 war_justification.203.a:0 "Eğer davamızdan korkuyorlarsa, kendi halklarından korkuyorlar demektir."
 war_justification.203.d:0 "'Yaşam biçimimize, hatta yaşamın kendisine komünizmden daha büyük bir tehdit var mı? Kölelerin değil, efendilerin her ulusu yönetmesini tehdit eden, ulusun kendisini, halkları ve tarihlerini ortadan kaldırmayı tehdit eden bu veba. [From.GetName]'i alıp komünist vebasını ortadan kaldıracağız.'\n\n[From.GetLeader]'in komünistlere olan nefreti, [From.GetRulingParty]'nin iktidara gelmesinden önce bile iyi biliniyordu, ancak son zamanlarda [ROOT.GetAdjective] hükümeti özelinde yoğunlaşmış görünüyor. Marksizmi yeryüzünden silme arayışımız orada başlayabilir."
 war_justification.203.t:0 "[From.GetLeader], [ROOT.GetAdjective] Komünizmine Karşı Uyarıyor"
 war_justification.204.a:0 "Bırakın gelsinler!"
 war_justification.204.d:0 "'[ROOT.GetAdjective] halkı iktidardan kolayca vazgeçmeyecek bir halktır. Ancak, iki ulusumuzun yörüngesinin ancak bir çatışmayla sonuçlanabileceğini de fark etmeleri gerekir. Gelecek mücadele için kendimizi çelikleştirmeliyiz. Çünkü [ROOT.GetName] savaşmadan alınmayacaktır.'\n\n[ROOT.GetName] ve [From.GetName]'nin benzer düşünceli hükümetleri arasında bir anlayış olasılığı, topraklarını zorla alma kampanyasına yerini bıraktı."
 war_justification.204.t:0 "[From.GetName] Büyük Mücadeleye Hazırlanıyor"
 war_justification.205.a:0 "[ROOT.GetLeader] herhangi bir devrimci fırsatçıdan daha iyi bir yöneticidir!"
 war_justification.205.d:0 "'[From.GetName]'de sosyalist toplumu pekiştirmişken, birçok ulus hala eskilerin despotları altında acı çekiyor. [ROOT.GetName]'nin işçilerinin sesi yok, örgütlenme araçları yok ve sosyalizmi kurma yönündeki her türlü girişim [ROOT.GetLeader] rejimi tarafından vahşice ezilecektir. [ROOT.GetAdjective] halkı için uluslararası devrimin çarklarının dönmesini bekleyemeyiz. Buradaki kapitalist zalimleri ezebileceğimizi devrimle kanıtladık ve [ROOT.Capital.GetName]'deki zalimleri de ezeceğiz!'\n\n[From.GetLeader] hükümetimizle tüm diplomatik girişimleri terk etti. Tüm sınırları ortadan kaldırma komünist görevi şimdi kesinlikle bizim sınırlarımızı ortadan kaldırmaya odaklanmış durumda."
 war_justification.205.t:0 "[From.GetLeader] Devrimi [ROOT.GetName]'e Taşıyor"
 war_justification.206.a:0 "Eğer onları bize zorla kabul ettirmek zorundaysalar, inançlarının ne değeri olabilir ki?"
 war_justification.206.d:0 "'[ROOT.GetAdjective] halkının sözde özgürlüğünden daha büyük bir yalan var mı? Bir zamanlar toprağın mülkiyetini iddia eden prensler ve dükler altında kölelik yaparken, şimdi emeklerini fabrikaların mülkiyetini iddia edenlere satmak zorunda kalıyorlar. Bir efendiyi diğerine tercih etme özgürlükleri pekala özgürlük olarak adlandırılamaz. Aynı şekilde, liderlerini seçme özgürlükleri de sahte bir seçimdir, zira propaganda asla gerçek sosyalistlerin iktidara gelmesine izin vermez. Bu kadar derinden beyinleri yıkanmış bir halk ancak bir [From.GetAdjective] müdahalesiyle kurtarılabilir.'\n\nHalkımızın sosyal deneyleri olmadan memnun olabileceğini kabul etmek istemeyen [From.GetName]'deki komünist rejim, ulusumuza saldırmakla açıkça tehdit etti. Bu çatışmanın barışçıl bir şekilde çözülebileceğine inanmak için pek bir neden yok."
 war_justification.206.t:0 "[From.GetLeader], [ROOT.GetAdjective] İşçilerine Yardım Çağrısında Bulunuyor"
 war_justification.207.a:0 "[ROOT.GetAdjective] halkı için devrimin ne anlama geldiğini anlamıyorlar."
 war_justification.207.d:0 "'Yoldaşlar, en büyük devrimciler bir zamanlar hain olarak adlandırılmış olsa da, devrimin kendisinin ihanete uğradığı apaçık ortada. [ROOT.GetName]'deki [ROOT.GetRulingParty]'nin yönetimini başka nasıl açıklayabilirsiniz ki; Marksist fikirlerin her zerresini bir kenara atıp, sahte gerekçelerle hüküm sürebilecekleri yozlaşmış bir işçi devleti inşa ettiler? Kendi güçlerini uluslararası devrim pahasına güçlendirerek, sahip olduklarını iddia ettikleri ideallere pek aldırış etmediklerini gösterdiler. Gerçek devrimi onlara getirmeliyiz.'\n\nBaşlangıçta [ROOT.GetRulingParty]'nin [ROOT.Capital.GetName]'deki zaferini desteklese de, [From.GetLeader], [ROOT.GetLeader]'in felsefesinden uzaklaştı. Çatışma, bize kendi sosyalizm markalarını dayatmak için işgal etmeye hazırlandıkları noktaya kadar tırmandı."
 war_justification.207.t:0 "[ROOT.GetAdjective] Komünizmin Başarısızlığı"
 war_justification.208.a:0 "Komünistlere ölüm!"
 war_justification.208.d:0 "'Devrimin geleceğine [ROOT.GetName]'nin faşist rejiminden daha iğrenç, işçinin çilesine daha yabancı bir toplum var mı? Halkı köhneleşmiş ulus devlet kurumuna fanatik bir şekilde bağlı kalmaya çağırarak, çağdışı vahşet yöntemlerini modern bir kılıkla giydirip, kendilerini işçi sınıfının kaçınılmaz uluslararası zaferine alternatif bir gelecek olarak sunmaya çalışıyorlar. Bize veya müttefiklerimize saldırmaları an meselesi. İlk biz saldıralım.'\n\nBizimle [ROOT.GetAdjective] arasında karşılıklı küçümsemeden daha azını kimse beklemiyordu, ancak düşmanlık son zamanlarda yoğunlaştı. [From.GetLeader]'in konuşmasını dinleyince, görünüşe göre çatışma er ya da geç çıkacak."
 war_justification.208.t:0 "[From.GetLeader], [ROOT.GetAdjective] Milliyetçiliğinin Ezilmesi Çağrısında Bulunuyor"
 war_justification.209.a:0 "Aşağılayıcı söylemleri bizi korkutamayacak."
 war_justification.209.d:0 "'[ROOT.GetName] ile olan çatışmamıza diplomatik bir çözüm bulma çabalarımıza rağmen, müzakereler bir kez daha çöktü ve bize sınırlı seçenekler bıraktı. Otoriter [ROOT.GetLeader] rejimi, halkına karşı sorumlu olmayan liderlere özgü bu konuya mantıksız bir yaklaşım sergiledi. [ROOT.GetAdjective] liderliğinin politikalarında tam bir geri dönüş olmadıkça, savaşmaktan başka çaremiz kalmayacak.'\n\n[From.GetAdjective]'nin iç işlerimize müdahalesi sıcak bir konu oldu; muhalefetlerindeki bazı politikacılar [From.GetRulingParty]'nin baştan beri şahin bir politika izlediğini iddia ediyor. Orijinal niyetleri ne olursa olsun, gelecekteki bir savaş şimdi birdenbire çok gerçek ve kaçınılmaz görünüyor."
 war_justification.209.t:0 "[ROOT.GetName] ile Diplomasi Çöküyor"
 war_justification.210.a:0 "[From.GetName] zaten böylesine saldırgan bir eylem peşinde koşan şüpheli bir demokrasi."
 war_justification.210.d:0 "'Ağır bir kalple durumumuzun gerçekliğiyle yüzleşmeliyiz: [ROOT.GetName]'in işgali tek çaremiz olabilir. Mevcut durumumuzda başka bir çözüm denemek için çok büyük bir stratejik avantaja sahip. Hem [From.GetAdjective] hem de [ROOT.GetAdjective] halkının savaş istemediğine güvensak da, tarih bizi bu noktaya getirdi ve seçeneklerimiz sınırlı. Ancak askeri gücümüzü bu şekilde kullanarak gelecekte daha fazla kan dökülmesini önleyebileceğimizi umabiliriz.'\n\nDemokrasilerin diğer demokrasilere karşı savaşmadığı popüler bir teori olsa da, son gelişmeler gelecekte [From.GetAdjective]'nin [ROOT.GetName]'i işgal edeceğine işaret ediyor. Tarih bizi henüz şaşırtabilir."
 war_justification.210.t:0 "[From.GetLeader], [ROOT.GetName]'e Müdahale Çağrısında Bulunuyor"
 war_justification.211.a:0 "Kâr elde edilecek olduğu sürece, kapitalistler bir savaş üretecektir."
 war_justification.211.d:0 "'Şüphesiz, [ROOT.GetName] komünizmi bu çağdaki özgürlük ve düzene yönelik en büyük tehditlerden biridir. Acımasız ve amansız, sadece [ROOT.GetAdjective] halkının müreffeh, demokratik bir toplum umudunu değil, aynı zamanda komşularınınkini de yutmakla tehdit ediyor. Şimdi harekete geçmezsek, bu ilk domino taşının çok geç düştüğünü görebiliriz ve ardından daha fazla başarısız sosyal deney bırakabiliriz. Müdahale etmeden önce daha kaç kişinin ölmesi gerekiyor?'\n\nYeni filizlenen işçi hareketi [From.GetAdjective] liderlerini korkuttu. Muhalefetlerindeki temsilciler bunun bize karşı savaş peşinde koşmayı amaçlayan bir Kızıl Panik olduğunu iddia etse de, [From.GetRulingParty]'nin söylemi şimdiye kadar oldukça başarılı oldu."
 war_justification.211.t:0 "[From.GetLeader] Kızıl Tehdide Karşı Konuşuyor"
 war_justification.212.a:0 "Kaçınılmaz. Bir an önce bitmesi daha iyi."
 war_justification.212.d:0 "'Modern tarihte, belki de tüm tarihte, [ROOT.GetRulingParty]'nin şimdi [ROOT.GetName]'i elinde tuttuğu demir yumruktan daha kötü bir tiranlık olmamıştır. İnsanlar çatışmayı kışkırtmamamız gerektiğini, [ROOT.GetLeader]'in gelecekte antlaşmalara ve vaatlere sadık kalacağına güvenmemiz gerektiğini iddia edebilirler, ancak bu insanlar faşizm egemenliği altında yapılan antlaşmaların işe yaramaz olduğunu göremiyorlar. Bu onursuz yalancılar için güç haktır ve bir anlaşmanın yazıldığı kağıt, muhaliflerinin kitapları kadar kolay yanar.'\n\nİnşa ettiğimiz şanlı toplumdan ve üzerine kurulduğu mirastan kıskançlık duyan [From.GetAdjective]ler, onu yok etmek için bir savaş başlatmaya hazır görünüyor. Barış iddialarına ne oldu?"
 war_justification.212.t:0 "[From.GetLeader], [ROOT.GetAdjective] Faşizmiyle Yüzleşiyor"
 war_justification.213.a:0 "Bizi düşmanları yaptıkları için pişman olacaklar."
 war_justification.213.d:0 "'Barışçıl bir halk olsak da, doğamız tek başına tarihte izlememiz gereken yolu belirlemez. Bu bir savaş zamanıdır. Çok uzun zamandır, [ROOT.GetAdjective] halkı karşılaşabileceğimiz sınavlardan geçmek için ihtiyaç duyduğumuz araçlara sahip oldu ve bunları barışçıl bir şekilde bırakmayacakları aşikar. Modern bir devlet kurmak için gösterdiğimiz tüm çabalara rağmen, bazı meseleler ancak eski savaş sınavlarıyla çözülebilir.'\n\n[From.GetAdjective] halkına yaptığı son bir konuşmada [ROOT.GetName]'e yönelik düşmanca söylem yoğunlaştı ve [From.GetLeader] bir işgali haklı çıkarmak için büyük çaba sarf etti. Nüfusun bir kısmı bu yolu destekliyor, ancak karar liderlerinin elinde."
 war_justification.213.t:0 "[From.GetLeader], [ROOT.GetName]'e Karşı Savaş Çağrısında Bulunuyor"
 war_justification.214.a:0 "[From.GetAdjective] halkı arasındaki barış sesleri elbette susturuluyor."
 war_justification.214.d:0 "'[ROOT.GetName] kendilerini bizden daha modern ve gelişmiş sanabilir, ancak gerçek şu ki onların ulusu bizimki gibi sınanmadı ve ufukta şimdi açıkça görünen tehditlere de hazır değiller. Bize karşı olan küçümsemeleriyle ve haklı olarak bizim olanı ele geçirmemizi engelleyerek, bizi kendileri için o tehditlerden biri haline getirdiler. Zayıf ve bölünmüş ulusları iddialarımıza pek direnemeyecektir.'\n\n[From.GetRulingParty]'nin uzun süredir [ROOT.GetName]'e yönelik alaycı görüşü, eleştiriden düşmanlığa dönüştü. Halkın görüşü [ROOT.GetAdjective] halkının savaştan kaçınmak istediği yönünde olsa da, [From.GetLeader] seçilmiş liderlerimizin kibirleriyle bunu kışkırttığını iddia ediyor."
 war_justification.214.t:0 "[From.GetLeader], [ROOT.GetAdjective] İddialarına Meydan Okuyor"
 war_justification.215.a:0 "Kaydettiğimiz ilerlemeyi tersine çevirmek için çok geç."
 war_justification.215.d:0 "'[From.GetAdjective] ulusal ruhu güçlüdür, ancak tüm uluslar o kadar şanslı değil. [ROOT.GetName]'nin gelenekleri yok edildi ve haklı yöneticileri uzun zaman önce öldürülüp gömüldü, hepsi de büyük Marksist devrim fikri adına. Kanlı gaspçılar tarafından yoldan çıkarılmış bu dünyaya düzeni yeniden getirmek ve bu tehdide karşı [From.GetName]'nin gücünü ortaya koymak bizim görevimizdir.'\n\n[From.GetRulingParty] her zaman komünizme karşı çıkmış olsa da, [ROOT.GetName] son konuşmalarda özel saldırıların hedefi oldu. Uluslarının kaçınılmaz bir sonraki tarihsel aşamaya ilerlemesinden korkan [ROOT.GetAdjective] komünizmine yönelik önleyici bir saldırı zaten hazırlanıyor."
 war_justification.215.t:0 "[From.GetLeader], [ROOT.GetName]'de Düzeni Yeniden Kurmak İstiyor"
 war_justification.216.a:0 "Eğer gücümüzü test etmek istiyorlarsa, pişman olacaklardır."
 war_justification.216.d:0 "'Muhaliflerim size benim yönetimimin [ROOT.GetName]'deki [ROOT.GetRulingParty]'nin yönetimi gibi olduğuna inandırmak isterdi. Daha fazla yanılamazlardı. [ROOT.GetLeader]'in başarıları son zamanlardaki bir modanın, diğer ulusları boyun eğdirmeye kararlı yıkıcı bir kitle hareketinin sonucu iken, [From.GetRulingParty] o harekete boyun eğmeyecek olanlar olarak karşı çıkıyor. Bu tehdidi ortadan kaldırmak için ne gerekiyorsa yapmaya hazırım, savaş anlamına gelse bile.'\n\n[From.GetLeader] rejimi [ROOT.GetAdjective] ulusuna karşı düşmanca bir politika benimsedi. Gelecekteki büyüklük için vizyoner planlarımız onların ulusunu utandırdı ve şaşırtıcı olmayan bir şekilde tehdit altında hissediyorlar."
 war_justification.216.t:0 "[From.GetLeader], [ROOT.GetAdjective] Zalimlerini İfşa Ediyor"
 war_justification.217.a:0 "Dünya Büyük Savaş'tan hiçbir şey öğrenmedi mi?"
 war_justification.217.d:0 "'Bir ulusun sınırlarını kim belirler ve bunlar nasıl belirlenir? Geçmişte insanların [From.GetName]'nin nerede bittiğini ve [ROOT.GetName]'nin nerede başladığını haklı çıkarmak için bulduğu yol ne olursa olsun, yeni bir çağda yaşıyoruz. Bu sınırın stratejik önemi abartılamaz ve halkımızın devam eden güvenliğini sağlamak için onu değiştirme hakkımız vardır.'\n\n[From.GetLeader]'in son konuşmalarını dinlerken, [ROOT.GetName]'in bir işgali yakın görünüyor. Muhalif sesler itiraz etti, ancak savaşa halk desteği artıyor."
 war_justification.217.t:0 "[From.GetLeader], [ROOT.GetAdjective] Egemenliğini Sorguluyor"
 war_justification.218.a:0 "İşte tam da bu yüzden hazır olmamız gerekiyor."
 war_justification.218.d:0 "'[ROOT.GetName]'nin savaşa hazırlandığına şüphe yok. Ekonomik politikadaki değişiklikler, [ROOT.GetAdjective] halkının barışsever bir halk olmadığını, aksine bize saldırmak için doğru fırsatı beklediğini açıkça gösteriyor. [From.GetName] savunmasızken onların silahlanmasını boş boş izleyecek miyiz? Yoksa bu tehdit gücümüzü aşmadan önce onu etkisiz hale mi getireceğiz?'\n\n[From.GetRulingParty]'deki şahinler gözlerini [ROOT.GetName]'e çevirdi ve saldırının en iyi savunma olduğunu savunuyor. Görüşleri ilgi görüyor ve [From.GetName] savaşa hazırlanıyor."
 war_justification.218.t:0 "[From.GetLeader], [ROOT.GetName]'nin Niyetlerini Sorguluyor"
 war_justification.219.a:0 "Bu tehditlerden sonra pekala silahsızlanamayız."
 war_justification.219.d:0 "'[From.GetName]'nin [ROOT.GetAdjective] halkını barışsever bir halk olarak hayal eden saf vatandaşları gerçeklikten tamamen kopuktur. Sınırımızda yaşayanlar bu tür yanılsamaların lüksüne sahip değiller, birliklerinin hemen karşıda bize yaklaştığını görüyorlar. Bu, cevapsız bırakamayacağımız bir tehdittir. Her geçen gün, [ROOT.GetName] savaşa hazırlanıyor. Bizim de aynısını yapmamamız delilik olurdu.'\n\n[From.GetAdjective] topraklarına yakın askeri varlığımız, birlik hareketlerimizi düşmanca niyet kanıtı olarak yorumladıkları için artan bir endişeye yol açtı. Saldırgan söylemlerinin savunma önlemlerimizin nedeni olduğunu pek düşünmemiş görünüyorlar."
 war_justification.219.t:0 "[From.GetLeader], [ROOT.GetAdjective] Duruşundan Öfkeli"
 war_justification.220.a:0 "Daha iyi hazırlansak iyi olur. Savaş gelecek."
 war_justification.220.d:0 "'Öngörülebilir, hatta kaçınılmaz olan [ROOT.GetName] ile savaşta stratejik avantaja sahip olmak istiyorsak, tereddüt etmeye yer yok. Bu, çocuklarımızın geleceğini korumak ve [From.GetName]'nin yarın dünyada bir yeri olmasını sağlamakla ilgilidir. Bu, davamıza ve doğal kabul ettiğimiz ideallere bağlılık meselesidir. Harekete geçme zamanı.'\n\n[From.GetRulingParty] liderlerinden, en belirgin olarak [From.GetLeader]'den bir dizi coşkulu konuşma, halkı [ROOT.GetName]'in işgalini desteklemeye çağırıyor. İşgalin ardındaki jeopolitik güdüler, vatansever duygulara yönelik söylemde daha az belirgindir, ancak bu kampanya halkı gerekliliğine ikna etmede oldukça etkili görünüyor."
 war_justification.220.t:0 "[From.GetLeader], [ROOT.GetName]'in İşgalini Savunuyor"
 war_justification.3.a:0 "Ulusları reddedenler kendi uluslarının yok olduğunu görecekler."
 war_justification.3.d:0 "'Yaşam biçimimize, hatta yaşamın kendisine komünizmden daha büyük bir tehdit var mı? Kölelerin değil, efendilerin her ulusu yönetmesini tehdit eden, ulusun kendisini, halkları ve tarihlerini ortadan kaldırmayı tehdit eden bu veba. [From.GetName]'i alıp komünist vebasını ortadan kaldıracağız.'\n\n[ROOT.GetLeader]'in komünistlere olan nefreti, [ROOT.GetRulingParty]'nin iktidara gelmesinden önce bile iyi biliniyordu, ancak son zamanlarda [From.GetAdjective] hükümeti özelinde yoğunlaşmış görünüyor. Marksizmi yeryüzünden silme arayışımız orada başlayabilir."
 war_justification.3.t:0 "[ROOT.GetLeader], [From.GetAdjective] Komünizmine Karşı Uyarıyor"
 war_justification.301.a:0 "Savaştan kaçınmak istemiyorlar mı?"
 war_justification.301.b:0 "Parti toplantıları dışında kamuoyu anlaşmazlığına yer yok."
 war_justification.301.c:0 "İnsanların [ROOT.GetLeader]'i korkaklıkla suçlamasına izin veremeyiz!"
 war_justification.301.d:0 "'Düşmanlarımıza karşı saldırma şansımız vardı, ama [ROOT.GetRulingParty] bunu kaçırdı. Bu sadece [ROOT.GetName]'nin uluslararası konumunu güçlendirmek için kaçırılan bir dizi fırsatın bir başka lanetleyici örneği olmakla kalmıyor, aynı zamanda [ROOT.GetAdjective] halkının çıkarına hareket ettikleri iddialarının çoğunlukla boş bir söylem olduğunun bir işaretidir. Politika değişikliği zamanı geldi.'\n\nBirçok kişinin beklediği savaşı sürdürme konusundaki başarısızlığımız, siyasi muhaliflerimizden sert eleştirilere maruz kaldı. Askeri planlarımızı yerine getirmemek, halkı [ROOT.GetName]'i hangi yöne götürdüğümüz konusunda ikna etmemizi zorlaştıracaktır."
 war_justification.301.t:0 "[ROOT.GetLeader] Zayıf Dış Politika Nedeniyle Eleştiriliyor"
 war_justification.4.a:0 "Tarih zaferimizle yazılacak."
 war_justification.4.d:0 "'[From.GetAdjective] halkı iktidardan kolayca vazgeçmeyecek bir halktır. Ancak, iki ulusumuzun yörüngesinin ancak bir çatışmayla sonuçlanabileceğini de fark etmeleri gerekir. Gelecek mücadele için kendimizi çelikleştirmeliyiz. Çünkü [From.GetName] savaşmadan alınmayacaktır.'\n\n[From.GetName] ve [ROOT.GetName]'nin benzer düşünceli hükümetleri arasında bir anlayış olasılığı, topraklarını zorla alma kampanyasına yerini bıraktı."
 war_justification.4.t:0 "[ROOT.GetName] Büyük Mücadeleye Hazırlanıyor"
 war_justification.5.a:0 "[From.GetAdjective] işçileri, kurtuluşunuz yakın!"
 war_justification.5.d:0 "'[ROOT.GetName]'de sosyalist toplumu pekiştirmişken, birçok ulus hala eskilerin despotları altında acı çekiyor. [From.GetName]'nin işçilerinin sesi yok, örgütlenme araçları yok ve sosyalizmi kurma yönündeki her türlü girişim [From.GetLeader] rejimi tarafından vahşice ezilecektir. [From.GetAdjective] halkı için uluslararası devrimin çarklarının dönmesini bekleyemeyiz. Buradaki kapitalist zalimleri ezebileceğimizi devrimle kanıtladık ve [From.Capital.GetName]'deki zalimleri de ezeceğiz!'\n\n[ROOT.GetLeader], [From.GetRulingParty] kontrolündeki [From.GetName]'e yönelik tüm diplomatik söylemleri terk etti. Tüm sınırları ortadan kaldırma arayışı şimdi kesinlikle onların sınırlarını ortadan kaldırmaya odaklanmış durumda."
 war_justification.5.t:0 "[ROOT.GetLeader] Devrimi [From.GetName]'e Taşıyor"
 war_justification.6.a:0 "Burjuva diktatörlüklerini ezeceğiz!"
 war_justification.6.d:0 "'[From.GetAdjective] halkının sözde özgürlüğünden daha büyük bir yalan var mı? Bir zamanlar toprağın mülkiyetini iddia eden prensler ve dükler altında kölelik yaparken, şimdi emeklerini fabrikaların mülkiyetini iddia edenlere satmak zorunda kalıyorlar. Bir efendiyi diğerine tercih etme özgürlükleri pekala özgürlük olarak adlandırılamaz. Aynı şekilde, liderlerini seçme özgürlükleri de sahte bir seçimdir, zira propaganda asla gerçek sosyalistlerin iktidara gelmesine izin vermez. Bu kadar derinden beyinleri yıkanmış bir halk ancak bir [ROOT.GetAdjective] müdahalesiyle kurtarılabilir.'\n\n[ROOT.GetLeader] uzun zamandır parti toplantılarında [From.GetName]'deki hükümete karşı polemik yapıyordu, ancak bu söylem şimdi kamuoyunda daha sık kullanılıyor. Bu çatışmanın barışçıl bir şekilde çözülebileceğine inanmak için pek bir neden yok."
 war_justification.6.t:0 "[ROOT.GetLeader], [From.GetAdjective] İşçilerine Yardım Çağrısında Bulunuyor"
 war_justification.7.a:0 "Sosyalizm girişimlerini kurtarmak için henüz zaman var."
 war_justification.7.d:0 "'Yoldaşlar, en büyük devrimciler bir zamanlar hain olarak adlandırılmış olsa da, devrimin kendisinin ihanete uğradığı apaçık ortada. [From.GetName]'deki [From.GetRulingParty]'nin yönetimini başka nasıl açıklayabilirsiniz ki; Marksist fikirlerin her zerresini bir kenara atıp, sahte gerekçelerle hüküm sürebilecekleri yozlaşmış bir işçi devleti inşa ettiler? Kendi güçlerini uluslararası devrim pahasına güçlendirerek, sahip olduklarını iddia ettikleri ideallere pek aldırış etmediklerini gösterdiler. Gerçek devrimi onlara getirmeliyiz.'\n\nBaşlangıçta [From.GetAdjective] devrimini desteklese de, [ROOT.GetLeader] nasıl geliştiği konusunda artan bir hayal kırıklığı ifade etti. [ROOT.GetRulingParty], çok geç olmadan müdahale etmek zorunda kalabilir."
 war_justification.7.t:0 "[From.GetAdjective] Komünizmi Başarısız Oluyor"
 war_justification.8.a:0 "Faşistlere ölüm!"
 war_justification.8.d:0 "'Devrimin geleceğine [From.GetName]'nin faşist rejiminden daha iğrenç, işçinin çilesine daha yabancı bir toplum var mı? Halkı köhneleşmiş ulus devlet kurumuna fanatik bir şekilde bağlı kalmaya çağırarak, çağdışı vahşet yöntemlerini modern bir kılıkla giydirip, kendilerini işçi sınıfının kaçınılmaz uluslararası zaferine alternatif bir gelecek olarak sunmaya çalışıyorlar. Bize veya müttefiklerimize saldırmaları an meselesi. İlk biz saldıralım.'\n\nBizimle [From.GetAdjective] arasında karşılıklı küçümsemeden daha azını kimse beklemiyordu, ancak düşmanlık son zamanlarda yoğunlaştı. Görünüşe göre çatışma er ya da geç çıkacak."
 war_justification.8.t:0 "[ROOT.GetLeader], [From.GetAdjective] Milliyetçiliğinin Ezilmesi Çağrısında Bulunuyor"
 war_justification.9.a:0 "Bazen çatışma dağına tırmanmak gerekir."
 war_justification.9.d:0 "'[From.GetName] ile olan çatışmamıza diplomatik bir çözüm bulma çabalarımıza rağmen, müzakereler bir kez daha çöktü ve bize sınırlı seçenekler bıraktı. Otoriter [From.GetLeader] rejimi, halkına karşı sorumlu olmayan liderlere özgü bu konuya mantıksız bir yaklaşım sergiledi. [From.GetAdjective] liderliğinin politikalarında tam bir geri dönüş olmadıkça, savaşmaktan başka çaremiz kalmayacak.'\n\n[ROOT.GetAdjective]'nin [From.GetName]'e müdahalesi sıcak bir konu oldu; muhalefetteki bazı politikacılar [ROOT.GetRulingParty]'nin baştan beri şahin bir politika izlediğini iddia ediyor. Orijinal niyetleri ne olursa olsun, gelecekteki bir savaş şimdi birdenbire çok gerçek ve kaçınılmaz görünüyor."
 war_justification.9.t:0 "[From.GetName] ile Diplomasi Çöküyor"
 worrying:0 "Endişeleniyorum."
 wtt_xian_incident_warning_8:0 "§R[CHI.GetNameDef] bunun üzerine savaşa girmeyi seçebilir!§!"
 yalta_division_tt:0 "Aşağıdaki devletler müttefik etki alanı olarak belirlenecektir:\n§Y[42.GetName]§!, §Y[978.GetName]§!, §Y[50.GetName]§!, §Y[51.GetName]§!, §Y[52.GetName]§!, §Y[53.GetName]§!, §Y[54.GetName]§!, §Y[55.GetName]§!, §Y[56.GetName]§!, §Y[57.GetName]§!, §Y[58.GetName]§!, §Y[59.GetName]§!.\n\nAşağıdaki devletler [SOU.GetAdjective] etki alanında olacaktır:\n§Y[60.GetName]§!, §Y[61.GetName]§!, §Y[62.GetName]§!, §Y[63.GetName]§!, §Y[64.GetName]§!, §Y[65.GetName]§!, §Y[66.GetName]§!, §Y[67.GetName]§!.\n\n [POL.GetAdjective]'nin aşağıdaki devletler üzerindeki iddiaları tüm taraflarca tanınacaktır:§Y[66.GetName]§!, §Y[67.GetName]§!, §Y[68.GetName]§!, §Y[63.GetName]§!, §Y[5.GetName]§!.\n\n"
 yugoslavia.1.a:0 "SOE aracılığıyla darbeye yardım et."
 yugoslavia.1.b:0 "Komplocuları caydır."
 yugoslavia.1.d:0 "Yugoslavya'daki Mihver karşıtı duyarlılık, ülkenin mevcut liderlikle işbirliğimizi sürdürme ve tarafsız kalma çabalarımızı dengelemeye çalıştığımız bir noktada, ulusun Almanya ile işbirliği yapma yönündeki yeni çabalarıyla kritik bir noktaya ulaştı. Almanya'nın müttefiklerinden birkaçının Yugoslavya'da toprak çıkarları olmasına rağmen, liderlik Alman birliklerinin ülkelerine girmesine izin vermeyi seçti.\n\nYugoslav Hava Kuvvetleri içindeki bir girişim, Alman dostu hükümeti devirmeyi amaçlıyor. Bu durum bölgeyi daha da istikrarsızlaştırma riski taşısa da, Almanya ile işbirliklerini sona erdirecektir. İstihbarat görevlilerimiz darbeyi desteklemeli mi, yoksa Alman karşıtı hizbi ertelemeye mi ikna etmeli?"
 yugoslavia.1.t:0 "Yugoslavya'da Karşı Darbe"
 yugoslavia.2.a:0 "Pakttansa savaş daha iyidir!"
 yugoslavia.2.b:0 "Almanlarla savaşmaktansa darbeyle savaşmayı tercih ederiz."
 yugoslavia.2.d:0 "[Root.GetLeader]'in Almanya ile dostane ilişkiler sürdürme çabaları, Almanlarla işbirliğine yönelik yerel hoşnutsuzluğun artmasına neden oldu. Özellikle Sırp milliyetçileri bu diplomatik yöne karşı çıktılar ve halk muhalefeti sesli oldu. Bugün, hava kuvvetlerindeki askeri yetkililer bir darbe girişiminde bulunarak genç Kral II. Petar'ı reşit ilan edip tahta çıkardılar. Almanya'nın düşmanlarının istihbarat teşkilatları tarafından cesaretlendirilen darbe, anlaşmalarımızı kısa kesmeyi amaçlıyor. Bu savaş anlamına gelebilir."
 yugoslavia.2.t:0 "Darbe"
 yugoslavia.3.a:0 "Yugoslavya özgür kalacak!"
 yugoslavia.3.d:0 "Alman tehditleriyle yalnız yüzleşmeyeceğimiz umudumuz gerçekleşti. Britanya İmparatorluğu ve müttefiklerinin gücü bizimle olacak."
 yugoslavia.3.d_FRA_abandoned_yugoslavia:0 "Alman tehditleriyle yalnız yüzleşmeyeceğimiz umudumuz gerçekleşti. Britanya İmparatorluğu ve müttefiklerinin gücü bizimle olacak. Ne yazık ki Fransa korkakların yolunu seçti."
 yugoslavia.3.t:0 "Londra Konferansı"
 yugoslavia.4.a:0 "Zafer bizim olacak!"
 yugoslavia.4.d:0 "Alman tehditleriyle yalnız yüzleşmeyeceğimiz umudumuz gerçekleşti. Britanya İmparatorluğu'nun zayıflayan gücü bizimle olmasa da, güçlü Fransız İmparatorluğu yanımızda olacak."
 yugoslavia.5.a:0 "Direniş sadece anlamsız ölümlere yol açar."
 yugoslavia.5.b:0 "Sonuna kadar savaşacağız."
 yugoslavia.5.d:0 "Barışı koruyan antlaşmaları yırtan yeniden dirilen bir Almanya karşısında, batıdaki korkaklar açlıklarını gidereceğimizi umarak bizi kurtlara atıyor. Tarih onları acımasızca yargılayacak, ama şimdi kaderimizi seçmeliyiz."
 yugoslavia.5.t:0 "Londra Diktası!"
 yugoslavia.6.a:0 "Tanrı Yardımcımız Olsun."
 yugoslavia.6.d:0 "Diğer herkes bizi terk ettiğinde sadece İtalya bizimle. Bu şimdi en sadık dostumuz ve birlikte savaşacağız."
 yugoslavia.6.t:0 "Londra Konferansı"
 yugoslavia.7.a:0 "Kararlı durmalıyız."
 yugoslavia.7.b:0 "Bu kadar çok can kurtaracak."
 yugoslavia.7.d:0 "[From.GetNameDefCap] ülkemizin tam kontrolünü onlara devretmemizi talep ediyor. Tüm Yugoslavya vatandaşları esasen Alman olacak ve artık hiçbir etkimiz kalmayacak. Burada direnmeyi ve yardımın geleceğini ummayı seçebiliriz, ancak bu Yugoslav halkının bir katliamdan kaçınmasının tek yolu olabilir."
 yugoslavia.7.t:0 "Yugoslavya'nın Kaderi"
 yugoslavia.8.a:0 "Kararlı durmalıyız."
 yugoslavia.8.b:0 "Bu kadar çok can kurtaracak."
 yugoslavia.8.d:0 "[From.GetNameDefCap] ülkemizin tam kontrolünü devretmemizi talep ediyor. Yugoslavya vatandaşları esasen [From.GetNameDef]'in veya kukla devletlerinden birinin vatandaşı olacak. Burada direnmeyi ve yardımın geleceğini ummayı seçebiliriz, ancak bu Yugoslav halkının bir katliamdan kaçınmasının tek yolu olabilir."
 yugoslavia.9.a:0 "Kararlı durmalıyız."
 yugoslavia.9.b:0 "Bu kadar çok can kurtaracak."
 yugoslavia.9.d:0 "[From.GetNameDefCap], [From.GetNameDef] tarafından kontrol edilen yeni kurulmuş bir Hırvat hükümetine toprak devretmemizi talep ediyor. Ayrıca, Yugoslavya vatandaşlarını yönetmemize izin verecek ancak siyasetimiz üzerinde ağır [From.GetAdjective] etkisi olacak büyük hükümet reformları uygulamamızı talep ediyorlar. Burada direnmeyi ve yardımın geleceğini ummayı seçebiliriz, ancak bu Yugoslav halkının bir katliamdan kaçınmasının tek yolu olabilir."
