 HUN_feldmarchall_augusts_expertise:0 "Feldmarschall Joseph August'un Uzmanlığı"
 HUN_ferenc_szombathelyi_becomes_a_general:0 "§YFerenc Szombathelyi§!, 3. seviye §YGeneral§! olarak mevcut olur!"
 HUN_hero_of_the_revolution:0 "Devrimin Kahramanı"
 HUN_hero_of_the_revolution_desc:0 "Eski topraklar geri kazanıldı ve Panoniyen Sosyalist Cumhuriyetler Birliği ilan edildiğinde, Béla Kun'un Uluslararası Devrimin bir Kahramanı olduğu açıktır."
 HUN_hire_fidel_palffy_tt:0 "Danışman olarak §YKont Fidél Pálffy§!'yi işe alır"
 HUN_increase_economic_cooperation_tt:0 "§YBatı Balkanlar§!, §YDoğu Balkanlar§! ve §YKuzey Balkanlar§!'daki her başlangıç ülkesi için, bize olan §Ygörüşü§! §G85§!'ten yüksekse bir harita dışı §YSivil Fabrika§! alacağız. Bu aynı zamanda §Y[AUS.GetNameDef]§!, §Y[CZE.GetNameDef]§!, §Y[TRA.GetNameDef]§! ve §Y[SLO.GetNameDef]§! için de geçerlidir."
 HUN_joseph_august_von_habsburg_becomes_available_as_field_marshal_tt:0 "§YJoseph August von Habsburg§!, 3. seviye §YMareşal§! olarak mevcut olur!"
 HUN_laszlo_varga_design:0 "Laszlo Varga'nın tasarımı geliştirildi"
 HUN_lenin_boys_militia_recruitment:0 "İki Lenin-fiúk §YMilis§! birimi kazan"
 HUN_otto_von_habsburg_becomes_available_as_field_marshal_tt:0 "§YOtto von Habsburg§!, 2. seviye §YMareşal§! olarak mevcut olur!"
 HUN_rongyos_garda_leaders_become_generals:0 "§YPál Prónay§! ve §YImre Kémeri Nagy§! sırasıyla 1. ve 2. seviye §YGeneral§! olarak mevcut olur"
 HUN_rongyos_garda_militia_recruitment:0 "Üç Rongyos Gárda §YMilis§! birimi kazan"
 HUN_sich_riflemen_infantry_recruitment:0 "9 §YPiyade§! taburundan oluşan üç birim kazan"
 HUN_solyom_development:0 "Weiss WM-21 Sólyom'un Geliştirilmesi"
