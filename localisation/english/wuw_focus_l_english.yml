l_english:
 AUS_a_new_beginning:0 "Yeni Bir Başlangıç"
 AUS_a_new_beginning_desc:0 "\"Kül ve toz yatıştıkça ve yeni hükümetimiz hak ettiği yeri aldıkça, başımızı geleceğe çevirmeliyiz. Bu sadece [ROOT.GetNameDef]'nin başlangıcı ve birlikte büyüyeceğiz!\""
 AUS_a_new_constitution:0 "Yeni Bir Anayasa"
 AUS_a_new_constitution_desc:0 "Son anayasa değişikliğimiz, Mayıs Anayasası ve ülkenin kontrolünü sıkılaştıran otoriter bir rejimle felaketle sonuçlandı. Kesinlikle demokratik bir anayasa yeniden kurarak bir daha asla böyle bir şeyin olamayacağından emin olmalıyız."
 AUS_a_royal_alliance:0 "Kraliyet İttifakı"
 AUS_a_royal_alliance_desc:0 "Zirvede olmak yalnızlıktır ve şu anda var olan az sayıdaki monarşiden biri olarak, hala güçlü bir hükümdarın ülkelerini yönetmesinin değerini görenlerle silah birliği aramak sadece doğru görünüyor. Bizim gibi düşünenlere ulaşmalı ve daha büyük kötülüğe karşı kendimizi müttefik yapmayı önermeliyiz."
 AUS_a_royal_alliance_tt1:0 "§Y[ENG.GetNameWithFlag]§!'ı §Y$AUS_a_royal_alliance$§!'a davet eder!"
 AUS_a_royal_alliance_tt2:0 "§Y[FRA.GetNameWithFlag]§!'ı §Y$AUS_a_royal_alliance$§!'a davet eder!"
 AUS_a_safe_harbor_for_dissidents:0 "Muhalifler İçin Güvenli Bir Liman"
 AUS_a_safe_harbor_for_dissidents_desc:0 "Siyasi sürgünler son zamanlarda dünyada çok yaygın bir manzara haline geldi ve bazıları bizimle benzer siyasi duyguları paylaşıyor. Bu sürgünleri kendi tarafımıza çekerek, onların becerilerinden büyük ölçüde faydalanabiliriz."
 AUS_a_safe_harbor_for_dissidents_tt:0 "§YOlga Taratuta§!, şu özellikleri verir (§G+%5§! Savaş Desteği, §R-%10§! İstikrar, §G+%10§! Askere Alınabilir Nüfus Faktörü, §G+0.03§! Günlük Komünizm Desteği)"
 AUS_advanced_tanks:0 "Gelişmiş Panzer Çabası"
 AUS_advanced_tanks_desc:0 "Tanklarımıza baktığımızda, ya gerçekten ağır zırhlı ve yavaş ya da çok hafif ve çevik, ama o kadar da sağlam olmadıklarını fark ettik. Bu iki tasarım konseptinin en iyilerini seçerek, sağlam ama çevik, ağır zırhlı ama hızlı tanklar üretebilmeliyiz."
 AUS_aerial_strategies:0 "Hava Stratejileri"
 AUS_aerial_strategies_desc:0 "Kişinin deneyimlerinden öğrenmesi, her türlü savaşta bir erdemdir. Hava stratejilerimizi sürekli geliştirerek ve daha da geliştirerek, her zaman düşmandan bir adım önde olduğumuzdan emin olabiliriz."
 AUS_air_base_intiative:0 "Hava Üssü İnşaat Çabası"
 AUS_air_base_intiative_desc:0 "[AUS.GetNameDef]'de hava üsleri olsa da, son zamanlarda önemli ölçüde büyüyen hava kuvvetlerimizi barındırmak için artık yeterli değiller. Hava kuvvetini nasıl kullandığımızı optimize etmek için, uçaklarımızı gökyüzünde tutmak için gerekli altyapıları inşa etmeyi düşünmeliyiz."
 AUS_air_research_boost:0 "Yenilikçi Bir Hava Kuvvetleri"
 AUS_air_research_boost_desc:0 "[GetAirPartners]"
 AUS_align_with_ussr:0 "[SOU.GetAdjective]lerle Aynı Hizaya Gel"
 AUS_align_with_ussr_desc:0 "[SOV.GetNameDef]'in neden bu şekilde yönetildiği bizim için giderek daha açık hale geldi. Başlangıçta [SOV.GetAdjective] sistemi hakkında çekincelerimiz olsa da, bunun bir ülkeyi yönetmenin en iyi yolu olabileceğini fark ettik. Kendimizi [SOV.GetLeader]'in doktrinine hizalayarak hem daha istikrarlı bir ülke hem de muhtemelen onların lütuflarını kazanabiliriz."
 AUS_align_with_ussr_tt:0 "§YKPÖ§!'nün mevcut lideri, §Y[SOV.GetFlag][SOV.GetNameDef]§! hala §YKomünist§! olduğu sürece, onları §Y[SOV.GetFlag][SOV.GetLeader]§!'in doktrinine hizalayan bir özellik kazanacak!"
 AUS_alpine_federation_focus:0 "Alp Federasyonu"
 AUS_alpine_federation_focus_desc:0 "Artık kendi başımıza durmanın [ROOT.GetNameDef] için en iyi seçim olduğunu düşünmüyoruz, ancak başka hiçbir ittifak uygun bir seçenek gibi görünmüyor. Bu, Alp bölgesinin geri kalanına bir teklifle ulaşmamız için mükemmel bir fırsat olacaktır."
 AUS_alpine_federation_focus_tt:0 "Eğer §YDemokratik§! veya §YTarafsız§! iseler ve şu anda bir ittifakta değillerse, §Y[SWI.GetNameWithFlag]§!, §Y[FRA.GetNameWithFlag]§! ve §Y[ITA.GetNameWithFlag]§!'ı ittifakınıza davet eder."
 AUS_an_improved_german_state:0 "Daha İyi Alman Devleti"
 AUS_an_improved_german_state_desc:0 "Kendimizi her zaman dünyadaki daha iyi Alman ülkesi olarak gördük ve son zamanlar bizi haklı çıkardı. Artık [GER.GetNameDef]'in Alman halkı topluluğunun itibarını lekelemesine izin vermeyeceğiz. Onları kendi şanlı ülkemize entegre etme ve güçlerini kendimiz için kullanma zamanı geldi!"
 AUS_apprentice_programmes:0 "Çıraklık Programları Başlat"
 AUS_apprentice_programmes_desc:0 "Uzun bir ekonomik durgunluk ve işsizlik döneminden sonra, birçok insan şimdi hazır olan fabrika işleri için gereken beceri ve deneyime sahip değil. Çıraklık programları kurarak hem fabrikalar hem de işçiler için faydalı bir anlaşma sağlamış oluruz."
 AUS_approach_democratic_guarantors:0 "Demokratik Garantörlere Yaklaş"
 AUS_approach_democratic_guarantors_desc:0 "Saint-Germain-En-Laye Antlaşması imzalandıktan sonra kendimizi savunmak için çok küçük bir orduyla bulduk. Giderek tehlikeli hale gelen bir durumda galip gelmek için desteğe ihtiyacımız olacak. Antlaşma'nın diğer imzacısıyla çoğu zaman aynı fikirde olmasak da, onlara ulaşmalı ve çevremizdeki soğuk çatışma kızışırsa desteklerini istemeliyiz."
 AUS_approach_democratic_guarantors_tt:0 "§YKabul etmeleri durumunda ilgili ülke için etkiler:§!"
 AUS_architechtual_advancements:0 "Mimari Gelişmeler"
 AUS_architechtual_advancements_desc:0 "Son zamanlarda, Üniversitelerimizden birinde olağanüstü yetenekli bir mimarın varlığından haberdar olduk. Binaları hem yapısal bütünlüğe hem de bizim gibi bir ülkenin hak ettiği zarafete sahip. Bu bireyi işe almayı düşünmeliyiz."
 AUS_army_is_bundesheer:0 "s Bundesheer"
 AUS_army_is_landwehr:0 " Landwehr"
 AUS_at_the_ready:0 "Hazırda"
 AUS_at_the_ready_desc:0 "Sadece ordumuzun mükemmelliğe ve sürekli hazır olmaya eğitilmesi gerekmez. Ordumuzu teçhizatla destekleyenlerin ülkeye karşı sorumluluklarının farkında olmaları gerekir. İşçilerin her zaman silahlı kuvvetlerimizi desteklemeye hazır olduğundan emin olarak, kendimizi başarıya hazırlıyoruz."
 AUS_austria_against_fascism:0 "Reichsbund der Österreicher"
 AUS_austria_against_fascism_desc:0 "Ulusumuz, maruz kaldığımız siyasi izolasyondan kurtulurken, insanlar nihayet fikirlerini söylemeye cüret ettikçe siyasi grupların ortaya çıkması şaşırtıcı değil. Meşruiyetçi Reichsbund Der Österreich böyle bir gruptur. Tesadüfen, siyasi gündemleri ulus için planladıklarımızla örtüşüyor. Bu işbirliğinden en iyi şekilde yararlandığımızdan emin olmalıyız."
 AUS_austrian_aggression:0 "Avusturya Saldırganlığı"
 AUS_austrian_aggression_desc:0 "Savunma bu zamanlar için bariz bir seçenek gibi görünse de, bu sadece bir saldırı için beklemek anlamına gelir. Eğer bunun yerine güçlerimizi destekler ve ordumuzun her an saldırmaya hazır olduğundan emin olursak, potansiyel saldırganları etkili bir şekilde caydırabiliriz. Sonuçta saldırı en iyi savunmadır."
 AUS_austromarxism_focus:0 "Avusturya Marksizmi"
 AUS_austromarxism_focus_desc:0 "Victor Adler, Otto Bauer, Karl Renner, Max Adler ve Rudolf Hilferding grubunun öncülüğünü yaptığı Avusturya Marksizmi kavramı, bize uzun zamandır rehberlik etmiştir. Farklı bakış açılarından beslenen ancak sosyal demokrasi ile komünizm arasında bir orta yol anlama çabasıyla doğdu. Bu, ikisinden herhangi birinin tek başına elde edebileceğinden çok daha geniş bir halk desteği sağlamıştır."
 AUS_autobahn_east:0 "Otobanı Doğuya Genişlet"
 AUS_autobahn_east_desc:0 "Otobanımızı ortaklarımızla bağladık. Bu, her iki taraf için de çok faydalı oldu. Doğuya baktığımızda, ikili monarşideki eski müttefikimiz [HUN.GetNameDef]'i buluyoruz, altyapılarımızı bağlarsak, onlarla da daha iyi bir ilişki geliştirebiliriz."
 AUS_autobahn_south:0 "Otobanı Güneye Genişlet"
 AUS_autobahn_south_desc:0 "Altyapımızın bir güncellemeye ihtiyacı var, altyapıyı ülke çapında güçlendirmeyi ne kadar istemiş olsak da, ekonomimizin ve sanayi durumumuzun gerçeği buna izin vermiyor. Güneye doğru inşa etmek ve Otobanımızı [ITA.GetNameDef]'e bağlamak mevcut durumumuzdaki en iyi bahistir."
 AUS_autobahn_west:0 "Otobanı Batıya Genişlet"
 AUS_autobahn_west_desc:0 "Altyapımızın bir güncellemeye ihtiyacı var, altyapıyı ülke çapında güçlendirmeyi ne kadar istemiş olsak da, ekonomimizin ve sanayi durumumuzun gerçeği buna izin vermiyor. Batıya doğru inşa etmek ve Otobanımızı [GER.GetNameDef]'e bağlamak mevcut durumumuzdaki en iyi bahistir."
 AUS_ban_dnsap:0 "Milliyetçilerin Kökünü Kazı"
 AUS_ban_dnsap_desc:0 "Şu anda ülkemizde topluma gerçek bir tehdit olan siyasi partiler bulunmaktadır. Siyasi muhalefet görmeyi arzulasak da, bunun kendi güvenliğimizi riske atmadan yapılmasını sağlamalıyız. DNSAP gerçekten yasaklanmalı ve Vaterländische Front ne olduğu görülmelidir!"
 AUS_basic_tanks:0 "Panzer Çabası"
 AUS_basic_tanks_desc:0 "Tanklarımızın çoğu biraz eskidir ve biraz çalışma gerektirir. Artık tankları inşa edecek birimiz olduğuna göre, tanklarımızı en iyi nasıl geliştireceğimizi araştırmak için biraz yatırım yapmaktan fayda görebiliriz."
 AUS_bbo_focus:0 "Bundesbahnen Österreich'e Yatırım Yap"
 AUS_bbo_focus_desc:0 "Şu an itibariyle, demiryollarımız ihmal edildi ve demiryolu şirketimiz BBÖ'nün fonları kesildi. Ancak, ne kadar büyük veya küçük olursa olsun, başarılı bir ülke yönetmek için, ülke genelinde iyi bir demiryolu kapsama alanı sağlamalıyız. BBÖ'ye ve demiryollarımıza yatırım yapmaya başlamalıyız."
 AUS_bbo_focus_tt:0 "Mevcut §YSanayi Holdingi§!'nin etkinliğini §GArtırır§!:"
 AUS_beyond_our_old_lands:0 "Eski Topraklarımızın Ötesinde"
 AUS_beyond_our_old_lands_desc:0 "Yeniden büyük bir güç haline geldiğimizde, soru kendini gösteriyor. Tüm eski topraklarımızı kontrol ediyoruz, ama neden burada duralım? Şu anda sahip olduğumuz güçle daha da genişlemek sorun olmamalı."
 AUS_bring_back_the_habsburg_rule:0 "Tacı Taşımak"
 AUS_bring_back_the_habsburg_rule_desc:0 "Kendimize gerçek bir Krallık adını kazandırmak için, ülkemizi yönetecek bir Kral taçlandırmalıyız. Mevcut naibimiz kesinlikle iyi bir kral olacaktır ve taç giyme töreni için derhal hazırlanmalıyız."
 AUS_bring_back_the_habsburg_rule_tt:0 "Eğer mevcut naibiniz §YOtto von Habsburg§! veya §YErnst Rüdiger Starhemberg§! ise, Avusturya Arşidükü olarak taç giyecekler ve şu özelliği kazanacaklar:\n\n §YAvusturya Arşidükü§!:\n  - Politik Güç Kazancı: §G+%10§!\n  - Askere Alınabilir Nüfus: §Y%0.50§!\n  - İstikrar: §G+%5§!\n  - Savaş Desteği: §G+%5§!\n  - Günlük Tarafsız Desteği: §G+0.03§!"
 AUS_bring_generals_out_of_retirement:0 "Emekli Generalleri Hizmete Geri Çağır"
 AUS_bring_generals_out_of_retirement_desc:0 "Ulusumuzun savaş yürütme tarihi vardır ve dezavantajları olsa da, bu aynı zamanda elimizde çok çeşitli yetenekli komutanların olduğu anlamına gelir. Bunlardan bazıları o zamandan beri emekli oldu, ancak biraz ikna ile onları geri getirebilmeliyiz."
 AUS_bring_hungary_back_into_the_fold:0 "Macaristan'ı Tekrar Kucakla"
 AUS_bring_hungary_back_into_the_fold_desc:0 "Bizim ve [HUN.GetAdjective]lerin aynı büyük ulusun bir parçası olmamızın üzerinden çok zaman geçmedi. Büyük Savaş'tan sonra zorla ayrıldık ve her ikimiz de üzerimize dayatılan adaletsiz antlaşmalarla ciddi şekilde zayıfladık. Böyle bir şeyin bir daha asla olmasını önlemek için, onların [ROOT.GetNameDef]'e tam entegrasyonunu önermeliyiz!"
 AUS_bring_hungary_back_into_the_fold_tt:0 "§YEski Toprakları İlhak Etmek§! için kararlar ve §YDiplomatik İlhak Olasılığını Artırmak§! için ayrı kararlar açar."
 AUS_bring_phonix_insurance_from_the_ashes:0 "Phönix Sigortasını Küllerinden Doğur"
 AUS_bring_phonix_insurance_from_the_ashes_desc:0 "1936'nın başlarında Phönix skandalı bizi vurana kadar ekonomimiz düzeliyordu. Savaş katılımcısı sigortaları, orduya alacak adamlarımız olmasını sağladı ve savaş karşısında bile ulusu memnun tuttu. Phönix'i küllerinden geri getirmek akıllıca olabilir."
 AUS_bring_phonix_insurance_from_the_ashes_tt1:0 "§YPhönix Sigortasını Karşılama§!'yı §YPhönix Sigortası§! ile değiştirir!"
 AUS_build_dockyards_if_coastal:0 "Avusturya'nın kontrol ettiği rastgele bir kıyı eyaletinde anında bir §YDonanma Tersanesi§! inşa edecek, sadece en az bir kıyı eyaletinin kontrolündeyken mevcut."
 AUS_celebrate_spanish_victory:0 "İspanya'daki Zaferi Kutlama"
 AUS_celebrate_spanish_victory_desc:0 "İber yarımadasındaki şiddetli çatışmalar yavaş yavaş sona ererken, Cumhuriyetçilerin ülkelerinin kontrolünü elinde tuttuğu açıkça ortaya çıktı. Yardımımız muhtemelen bu zaferde de bir rol oynamıştır ve çabalarımız için tazminat olasılığını sormak sadece doğrudur."
 AUS_centralize_the_industrial_sector:0 "Sanayi Sektörünü Merkezileştir"
 AUS_centralize_the_industrial_sector_desc:0 "Zaman geçtikçe ve komünist duygular ulus içinde kök saldıkça, artık daha sert önlemler alabiliyoruz. Birkaç yıl önce, sanayiyi merkezileştirme fikri bile halkımız tarafından hoş karşılanmazdı, şimdi ise sadece bir sonraki mantıklı adım gibi görünüyor."
 AUS_clamp_down_on_dnsap:0 "DNSAP'a Baskı Yap"
 AUS_clamp_down_on_dnsap_desc:0 "Vaterländische Front'umuzun ötesindeki siyasi partiler uzun zamandır ülkemizden yasaklandı. Buna rağmen bazıları hala varlığını sürdürüyor ve en rahatsız edici olanı DNSAP olarak adlandırılan partidir. Gerçek Avusturya Faşizmini temsil ettiklerini yanlış bir şekilde iddia ederek, egemenliğimizden vazgeçmemiz ve [GER.GetNameDef] ile birliğe katılmamız gerektiğini savunuyorlar. Onlarla derhal ilgilenmeliyiz!"
 AUS_clamp_down_on_dnsap_tt:0 "§Y$AUS_kurt_schuschnigg$§!, §Y$AUS_fascism_vaterlandische_front_long$§!'un lideri olur ve yönetici parti §YFaşizm§!'e geçer."
 AUS_coastal_defence_forts:0 "Sahili Garnizonlama"
 AUS_coastal_defence_forts_desc:0 "Denizde yaptığımız şey, başarı şansımızı belirleyen şeyin sadece bir parçasıdır. Diğer bir parçası da sahilimiz ve ne kadar uygun bir şekilde tahkim edildiğidir. Sonuçta, birkaç iyi yerleştirilmiş sahil kalesi, en kapsamlı planlanmış istilayı bile engelleyebilir."
 AUS_consolidate_industries:0 "Der Ständestaat"
 AUS_consolidate_industries_desc:0 "Sanayi sektörümüz kısa sürede önemli ölçüde büyüdü ve ekonomi ve ordumuz üzerindeki olumlu etkileri belirgindir. Onu daha da güçlendirmek için bir konsolidasyon planı yapmalı ve bu sanayilerden en iyi verimliliği ve çıktıyı alabilmemizi sağlamalıyız."
 AUS_construction_guilds:0 "İnşaat Loncaları Kur"
 AUS_construction_guilds_desc:0 "[AUS.GetNameDef] sanayiler için giderek daha çekici hale geldikçe, artık yeterince hızlı yeni fabrika inşa etmediğimizi fark ettik. İnşaat loncalarının kurulması, ülke içindeki inşaatı hızlandırmaya yardımcı olacaktır."
 AUS_continue_old_production:0 "Eski Üretim Hatlarına Devam Et"
 AUS_continue_old_production_desc:0 "Kıyı şeridimiz üzerindeki kontrolümüzü kaybetmeden önce, iki görkemli zırhlının üretimine başlamıştık. Gövdeleri hala elimizde ve şimdi biraz eskimiş olsalar da, yeni donanma çabalarımızda hala harika bir varlık olabilirler."
 AUS_continue_old_production_tt:0 "Eğer §YZırhlılar§! inşa etme teknolojisi henüz açılmadıysa, söz konusu teknolojiyi açar."
 AUS_courting_the_princess_of_industry:0 "Sanayi Prensesine Kur Yapma"
 AUS_courting_the_princess_of_industry_desc:0 "Ülkemizde bize muhtemelen yardımcı olacak birçok sanayi devi var. Avusturya'da ticarete hakim olan Gebrüder Gutmann'ın kurucusunun kızı Elisabeth von Gutmann, en umut verici olanı gibi görünüyor. Ona ulaşmalı ve yardımını istemeliyiz."
 AUS_crusade_on_communism:0 "Komünizme Karşı Haçlı Seferi"
 AUS_crusade_on_communism_d_tt:0 "§YAvrupa§!'daki tüm §YKomünist§! uluslara karşı §YHükümeti Devir§! savaş hedefi kazanır!"
 AUS_crusade_on_communism_desc:0 "Avrupa kıtasında komünistler olduğu sürece, ülkemiz ve halkı güvende değil. Gerçek bir sorun kaynağı haline gelmeden önce bu kızıl tehdide bir son vermeliyiz."
 AUS_crusade_on_communism_tt:0 "§YAvrupa§!'daki tüm §YKomünist§! uluslara karşı §Yİlhak Et§! savaş hedefi kazanır!"
 AUS_cut_ties_with_the_church:0 "Kilise ile Bağları Kopar"
 AUS_cut_ties_with_the_church_desc:0 "Hükümetimizin kiliseyle olan bağlantısı, sözde klerikal faşizmin bir kalıntısından başka bir şey değildir. Faşizm zaten kaldırıldı, ruhban sınıfını da siyasi güçten uzaklaştırma zamanı geldi."
 AUS_danubian_communism_bypass_has_rejected_tt:0 "[ROOT.GetAdjective]'in §YKomünizm§!'i artırma girişimlerini reddetti."
 AUS_danubian_communism_bypass_tt:0 "Tüm §YTuna§! ülkeleri ve §YTuna Bölgesi§!'nde §YTarihi Çıkarı§! olan ülkeler:\nMevcut yönetici parti §YKomünist§!."
 AUS_danubian_leader:0 "Tuna Çıkarlarının Koruyucusu"
 AUS_danubian_socialist_communes:0 "Tuna Bloğunu Kur"
 AUS_danubian_socialist_communes_desc:0 "[ROOT.GetNameDef] şimdiye kadar rakiplerine karşı tek başına durdu. Gelecekte durumun böyle olmasını istemiyoruz, ancak şu anda ülkemizin idealleriyle örtüşen hiçbir ittifak yok. Kendi ittifakımızı yaratmak açıkça en iyi seçenektir!"
 AUS_danubian_unity:0 "Tuna Birliği"
 AUS_danubian_unity_desc:0 "Federasyonumuz istikrarlı bir hızla büyürken, kendi ülkemizi ve iç politikamızı da unutmamalıyız. Halkımız, bu ittifakımızın onlara getireceği büyüklüğü bilmelidir!"
 AUS_deal_with_the_german_threat:0 "Alman Tehdidiyle Başa Çık"
 AUS_deal_with_the_german_threat_desc:0 "[GER.GetNameDefCap], on yıllardır kuzeybatı sınırımızda bir baş belası olmuştur. Politikaları sert olmuş ve varlığımıza karşı tehditler dile getirmekten çok daha sık olmuştur. Bu tehdidi bir kez ve herkes için sona erdirme zamanı geldi."
 AUS_defence_of_the_homeland:0 "Vatanı Savunma"
 AUS_defence_of_the_homeland_desc:0 "Sonunda ordumuzu yeniden inşa edebildiğimize göre, onu nasıl uzmanlaştıracağımıza bakmalıyız. Mevcut durumda coğrafi konumumuz oldukça savunmasız, ordumuzu savunma ustaları yapmak ve onlara benzersiz coğrafyamızı kendi avantajlarına nasıl kullanacaklarını öğretmek faydalı olacaktır."
 AUS_defending_the_coast:0 "Sahili Savunma"
 AUS_defending_the_coast_bonus:0 "Sahili Savunma"
 AUS_defending_the_coast_desc:0 "Eski donanmamızı tüm görkemiyle yeniden inşa etmek bize ne kadar çekici gelse de, gerçekle yüzleşmeliyiz. Büyük ölçekli bir ana gemi üretimi yakın zamanda bizim için mümkün değil. Aslında, bu küçük kıyı dayanağını hemen kullanmazsak, onu kaybetmemiz, bir daha bir deniz savaşı kazanmamızdan çok daha olasıdır. Büyük gemiler beklemek zorunda kalacak, şimdilik ihtiyacımız olan şey sahilimizi koruyabilecek bir filo."
 AUS_demand_hungarian_submission:0 "[HUN.GetAdjective] Teslimiyetini Talep Et"
 AUS_demand_hungarian_submission_desc:0 "Çok uzun bir süre, [HUN.GetNameDef] ile birlikte bir ikili monarşi olarak refah içinde yaşadık. O zamanlar bu düzenleme işe yarasa da, bizden daha az devlet idaresine yatkın olduklarını kanıtladılar ve ulusumuz için yaptıkları az şey çok arzulananı bıraktı. Onları bir kukla rejimimiz yaparak, İkili Monarşi'nin en iyi kısımlarına sahip olabilir, ancak en kötüsünden kaçınabiliriz."
 AUS_demand_hungarian_submission_tt:0 "§Y[HUN.GetNameDef]'i Boyunduruk Altına Almak§! için kararlar ve §YDiplomatik Boyunduruk Olasılığını Artırmak§! için ayrı kararlar açar."
 AUS_demand_liberation_of_workers:0 "İşçilerin Kurtuluşunu Talep Etme"
 AUS_demand_liberation_of_workers_desc:0 "Harekete geçme zamanımız geldi. Tuna boyunca komünizm ruhunu destekleyerek, şimdi bizimle anlaşmaya varanları kurtarmalıyız!"
 AUS_demand_liberation_of_workers_tt:0 "Daha önce komünist duyguları başarıyla desteklediğimiz ülkelerde §Yİşçilerin Kurtuluşunu Talep Etmek§! için kararlar açar."
 AUS_demand_part_of_spanish_winnings:0 "İspanyol Kazançlarının Bir Kısmını Talep Et"
 AUS_demand_part_of_spanish_winnings_desc:0 "İber Yarımadası'ndaki çatışma alevleri yavaş yavaş sönerken ve [SPA.GetNameDef]'deki dostlarımız galip gelirken, bu çabadan ne kazandığımıza bakma zamanı geldi. [SPA.GetAdjective]lere yardımımız bizi onların gözüne sokmuş olmalı ve yardımımız için bir miktar tazminat talep etmemiz sadece doğru olurdu."
 AUS_demand_romanian_lands:0 "Transilvanya ve Bukovina'yı Talep Et"
 AUS_demand_romanian_lands_desc:0 "Yakın komşu bölgemizde bir miktar toprak aldıktan sonra, şimdi daha uzaktaki topraklarımıza bakmaya başlayabiliriz. Eskiden [ROM.GetNameDef]'de sahip olduğumuz topraklar bizim için büyük bir varlıktı ve onları en kısa zamanda geri almalıyız. [ROM.GetAdjective] liderliğinin ne düşündüğü önemli değil, eğer isteyerek teslim olmazlarsa, başka seçenekleri düşünmek zorunda kalabiliriz."
 AUS_devalue_the_schilling:0 "Şilinin Değerini Düşür"
 AUS_devalue_the_schilling_desc:0 "Ekonomimizin mücadele etmesinin ve durgunlaşmasının nedenlerinden biri zayıf para birimimizdir. 1929'daki %2877'lik enflasyon oranına yakın olmasa da, enflasyonumuz hala çok yüksek. Halkla en popüler karar olmayabilir, ama para birimimizin değerini düşürmeyi düşünmeliyiz."
 AUS_devaluing_the_schilling_tt:0 "§Y$AUS_devalued_the_schilling$§! ulusal ruhu kaldırıldığında, §Y$AUS_bring_phonix_insurance_from_the_ashes$§! ve §Y$AUS_great_austrian_economic_push$§! odakları mevcut olacaktır."
 AUS_diplomatic_effort:0 "Tuna Diplomasisi"
 AUS_diplomatic_effort_desc:0 "Federasyonumuzun hak ettiği güçlü lider olarak kalmak için, tüm üyelerimiz tarafından sevildiğimizden emin olmalıyız. Federasyon içindeki ilişkilerimizi eğlendirmek ve derinleştirmek için diplomatik çabalarımızı artırmalıyız."
 AUS_diplomatic_effort_tt:0 "§YFederasyonumuzu genişlettikten§! sonra, diplomatik çabalarla §Ydiğer üyelerle ilişkileri geliştireceğiz§!."
 AUS_disregard_the_treaties:0 "Antlaşmaları Dikkate Alma"
 AUS_disregard_the_treaties_desc:0 "İmzalayanların bizi Saint-Germain-En-Laye Antlaşması'na bağlı tutma isteklerine saygı duysak da, dünyadaki mevcut durum artık Antlaşma'nın hükümlerine uymamıza izin vermiyor. Bu eylemlerin Antlaşma ortaklarımızı kızdırabileceği ve sonuçlarına katlanabileceğimiz çok muhtemeldir, ancak artık bağlı kalmamıza izin veremeyiz."
 AUS_economic_resuscitation:0 "Ekonomik Canlandırma"
 AUS_economic_resuscitation_desc:0 "Ekonomimiz istikrara kavuştu ve çok düşük bir seviyede durgunlaştı. Bazıları bunun iyi olduğunu iddia etse de, artık bir taş gibi düşmüyoruz, daha iyisini yapabileceğimizi biliyoruz. Hala yapılması gereken çabalar var ve bu sefer sadece kısa vadede işe yaramalarını sağlayacağız."
 AUS_economic_resuscitation_tt:0 "Ülkenin ekonomisi daha da çökerse Avusturya'ya tekrar §YEkonomik Buhrandan Toparlanma§! Ulusal Ruhunu verir."
 AUS_eiserne_legion:0 "Eiserne Legion'u Kur"
 AUS_eiserne_legion_desc:0 "Liderliğimiz şimdi yeniden düzenlendi ve paramiliter örgütlere bir kez daha izin verildiğinde, özellikle [ROOT.GetLeader] için seçkin bir muhafız kurma olasılığı ortaya çıktı. Eskiden faşist eğilimli yetkililerden oluşan küçük bir grup, muhalefeti bastırmak ve kitleleri kontrol etmek için seçkin bir muhafız kurmak üzere gönüllü olarak öne çıktı. Bu bizim için harika bir fırsat!"
 AUS_elin:0 "ELIN"
 AUS_elin_desc:0 "İlham en tuhaf yerlerden gelebilir. Esas olarak elektronik üreticisi olan ELIN, son zamanlarda deneysel denizaltılar yapmaya girişti. Denizaltılar şaşırtıcı derecede iyi. Onlara yaklaşıp gelecekte denizaltılarımızı inşa etmelerini istemeyi düşünmeliyiz."
 AUS_emergency_measaures:0 "Acil Durum Önlemleri"
 AUS_emergency_measaures_desc:0 "Devrimlerin savunucusu olmasak da, ülkemizin bir kez daha refaha kavuşması için gerekli değişiklikleri getirmek üzere Sosyal Demokratlara güvenemeyeceğimiz giderek daha açık hale geliyor. [ROOT.GetNameDef] işçileri için savaşmaya hazırlanmalıyız!"
 AUS_empowering_the_chancellor:0 "Şansölyeyi Güçlendirme"
 AUS_empowering_the_chancellor_desc:0 "Ülkemizin Şansölyesi rolü kolay bir rol değildir. [ROOT.GetNameDefCap], [ROOT.GetLeader] olmasaydı bugün olduğu yerde olmazdı ve bir kişilik kültü haline gelmememiz gerekirken, Şansölyemize olan bu takdirimizi bilinir kılmak isteyebiliriz."
 AUS_end_european_fascism:0 "Avrupa Faşizmine Bir Son"
 AUS_end_european_fascism_d_tt:0 "§YAvrupa§!'daki tüm §YFaşist§! ülkelere karşı §YHükümeti Devir§! Savaş Hedefi kazanır!"
 AUS_end_european_fascism_desc:0 "Hepimiz güvende olmadan kimse güvende değildir. Faşizm, Avrupa içinde hala belirgindir ve şüphesiz gelecekte daha fazla soruna yol açacaktır. Bu ideolojinin yayılmasını önlemek için harekete geçmeliyiz."
 AUS_end_european_fascism_tt:0 "§YAvrupa§!'daki tüm §YFaşist§! ülkelere karşı §YKukla Yap§! Savaş Hedefi kazanır!"
 AUS_establish_bohme_plan:0 "Franz Böhme Planını Kur"
 AUS_establish_bohme_plan_desc:0 "Mareşallerimizden biri olan Franz Böhme, sınırlarımızın ötesine saldırmak istersek diye saldırgan bir savaş planı üzerinde çalışıyor. Mevcut hırslarımızla, bu plan faydalı olabilir."
 AUS_establish_bohme_plan_tt:0 "§RAlfred Jansa'yı olası bir Ordu Şefi olarak kalıcı olarak kaldıracaktır!§!"
 AUS_establish_rote_hilfe:0 "Rote Hilfe'yi Yeniden Kur"
 AUS_establish_rote_hilfe_desc:0 "Österreichische Rote Hilfe, 1925'te Malke Schorr tarafından kuruldu ve yönetildi. O zamandan beri ve yozlaşmış Avusturya Faşist devleti tarafından yasaklanana kadar, örgüt [ROOT.GetNameDef]'deki sayısız siyasi mülteciye ve sığınmacıya yardım etti. Eski rejimimiz artık olmadığına göre, onlara bir kez daha özgürce faaliyet gösterme izni vermenin zamanı geldi."
 AUS_expand_stpoltner_steelworks:0 "St. Pöltner Çelik Fabrikalarını Genişlet"
 AUS_expand_stpoltner_steelworks_desc:0 "St. Pöltner'deki Çelik Fabrikaları çok umut verici sonuçlar gösteriyor. Hızlı hareket edersek, fabrikadan en fazla kazancı elde etmek için onları istediğimiz gibi şekillendirebilmeliyiz."
 AUS_extend_italian_claims:0 "[ITA.GetAdjective] Taleplerimizi Genişlet"
 AUS_extend_italian_claims_desc:0 "Büyük Savaş'ın sonunda [ITA.GetNameDef]'in bizden çaldığı devletlerle nasıl başa çıkmak istediğimize dair rotamızı belirledik. [160.GetName] ve [159.GetName]'e hiçbir zaman sahip olmadık ama onlar her zaman bizim için yüksek ilgi gören devletlerdi. Daha önce sahip olduğumuz şeyi zaten talep ettiğimize göre, neden bunu bir adım daha ileri götürüp istediğimiz ve hala istediğimiz şeyi almayalım?"
 AUS_extend_italian_claims_tt:0 "§Yİtalyan Taleplerini Yeniden Entegre Etmek§! için kararlar açar."
 AUS_extend_the_traun_line:0 "Traun Hattını Genişlet"
 AUS_extend_the_traun_line_available_tt:0 "§Y[153.GetName]§!'de §Y[GER.GetNameWithFlag]§!'a sınırı olan en az bir ilde §Y3§! veya daha fazla §YKara Kalesi§! inşa etmek için yer var!"
 AUS_extend_the_traun_line_bypass_tt:0 "§Y[153.GetName]§!'de §Y[GER.GetNameWithFlag]§!'a sınırı olan hiçbir ilde §Y3§! veya daha fazla §YKara Kalesi§! inşa etmek için yer yok!"
 AUS_extend_the_traun_line_desc:0 "Mevcut tahkimatlar Kuzey-Batı sınırını güvence altına alırken, Innsbruck yakınlarında hala korunmasız bırakılan bir dağ geçidimiz var. Tahkimat hattını genişleterek, hiçbir düşmanın tahkimatlarımızın arkasına sızmamasını sağlayabiliriz."
 AUS_extend_the_traun_line_tt:0 "Salzburg'dan Innsbruck'a [GER.GetAdjective] sınırı boyunca yer olan illerde 3. seviye §YKara Kalesi§! inşa eder"
 AUS_fit_for_fight:0 "Saldırıya Hazır"
 AUS_fit_for_fight_desc:0 "Ulusumuzu bulunduğu üzücü durumdan yeniden inşa etme konusunda uzun bir yol kat ettik, ancak burada duramayız. Yeniden silahlanma ve yeniden inşa çabalarımızın etkileri ortaya çıkarken, yasalarımızın çabalarımızı engellememesi için hukuk sistemimizi hazırlamalıyız."
 AUS_flight_schools:0 "Österreichischen Fliegerschule"
 AUS_flight_schools_desc:0 "Havada başarılı olmamız için sadece uçaklarımızın üstün olması gerekmez. Havadaki hakimiyetimizi sağlamak için, pilotlarımıza karşılaşabilecekleri her duruma hazırlamak için en iyi eğitimi de sağlamalıyız. Kara tümenlerimizi eğittiğimiz gibi, pilotlarımız için de bir eğitim rejimi kurmalıyız."
 AUS_focus_on_domestic_production:0 "Yerli Uçak Üretimi"
 AUS_focus_on_domestic_production_desc:0 "Bir hava kuvvetini tamamen kendi başımıza inşa etmek ve sürdürmek devasa bir görevdir. Ancak bu gibi zor bir durumda, silahlı kuvvetlerimizin ayrılmaz bir parçası için başkalarına bağımlı olmamıza izin veremeyiz. Yüksek başlangıç maliyeti ne olursa olsun, hava kuvvetlerimiz konusunda kendi kendine yeterli hale gelmeliyiz."
 AUS_follow_the_jansa_plan:0 "Alfred Jansa Planını Takip Et"
 AUS_follow_the_jansa_plan_desc:0 "Deneyimli Mareşal Alfred Jansa, bir [GER.GetAdjective] saldırısı durumunda [AUS.GetNameDef]'i savunmak için uzun zamandır bir plan üzerinde çalışıyor. Dünyadaki mevcut durumla, ne yazık ki bu plana ihtiyacımız olabilir gibi görünüyor."
 AUS_follow_the_jansa_plan_tt:0 "§RFranz Böhme'yi olası bir Ordu Şefi olarak kalıcı olarak kaldıracaktır!§!"
 AUS_follow_the_jansa_plan_tt2:0 "§YOrdu Şefi§! olarak mevcut:"
 AUS_for_a_better_future:0 "Bir [AUS.GetAdjective] Geleceği"
 AUS_for_a_better_future_desc:0 "Geriye dönüp baktığımızda, hedeflerimiz her zaman kaybedilenleri yeniden inşa etmekle ilgiliydi. Şimdi bu başarıldığına göre, geleceğimize doğru ileriye bakmaya başlamalıyız."
 AUS_form_evidenzburo:0 "Evidenzbureau'yu Yeniden Düzenle"
 AUS_form_evidenzburo_desc:0 "Duruşumuz ne olursa olsun, saldırgan veya savunmacı, potansiyel düşmanlar hakkında istihbarat toplamak son derece önemlidir. Düşmanlarımızın gücü, hızı veya koordinasyonu tarafından hazırlıksız yakalanmamıza izin veremeyiz, ne de hakkımızda bilgi edinmelerine izin veremeyiz. Eski Evidenzbureau'yu mevcut ihtiyaçlarımıza uyacak şekilde yeniden düzenleme zamanı geldi."
 AUS_form_evidenzburo_tt:0 "Teşkilata uygulanan yükseltmeler, [ROOT.GetNameDef]'in §YVatanı Savunma§! veya §YAvusturya Saldırganlığı§! arasındaki seçimine bağlı olacaktır!"
 AUS_form_nachrichtenabteilun:0 "Nachrichtenabteilung'u Kur"
 AUS_form_nachrichtenabteilun_desc:0 "Uzun zamandır silahsızız ve bu korkunç sonuçlara yol açmış olsa da, bunun iyi yanları da oldu. Dünya bizi sadece ordumuza odaklanan küçük bir çaylak olarak görüyor. Şu anda istihbarat ve casusluğa odaklanarak, onların hakkımızdaki varsayımlarını kendi avantajımıza kullanabiliriz."
 AUS_fortify_the_traun_line:0 "Traun Hattını Tahkim Et"
 AUS_fortify_the_traun_line_available_tt:0 "§Y[152.GetName]§! veya §Y[4.GetName]§!'de §Y[GER.GetNameWithFlag]§!'a sınırı olan en az bir ilde §Y3§! veya daha fazla §YKara Kalesi§! inşa etmek için yer var!"
 AUS_fortify_the_traun_line_bypass_tt:0 "§Y[152.GetName]§! veya §Y[4.GetName]§!'de §Y[GER.GetNameWithFlag]§!'a sınırı olan hiçbir ilde §Y3§! veya daha fazla §YKara Kalesi§! inşa etmek için yer yok!"
 AUS_fortify_the_traun_line_desc:0 "Jansa tarafından özetlenen planın ilk adımı, Traun nehri boyunca kaleler inşa etmekti, ancak mevcut durumda, kaleleri [GER.GetAdjective] sınırına kadar itme kararı alındı. Artık işe yaramadan önce bu projeye başlamalıyız."
 AUS_fortify_the_traun_line_tt:0 "Linz'den Salzburg'a [GER.GetAdjective] sınırı boyunca yer olan illerde 3. seviye §YKara Kalesi§! inşa eder"
 AUS_frontmiliz_focus:0 "Frontmiliz"
 AUS_frontmiliz_focus_desc:0 "[GetMilitiaName]'nin güvenini kazandığımıza göre, onların Bundesheer'e hızlı entegrasyonunu sağlamalıyız. Hala kendi ayrı varlıkları olarak kalacak olsalar da, her iki tarafın da sorunsuz bir şekilde birlikte çalışmasını sağlamalıyız. Bu, hem savaş alanında hem de ülkemizin sokaklarında başarımızı sağlayacaktır."
 AUS_graf_und_stift_focus:0 "Gräf & Stift"
 AUS_graf_und_stift_focus_desc:0 "Gräf & Stift pratikte hiç askeri için kamyon yapmamış olsa da, çok hızlı arabalar ve kamyonlar yapma konusunda çok iyi bir üne sahipler. Alışılmadık bir yaklaşım olsa da, sahada kesinlikle faydalı olabilir."
 AUS_great_austrian_economic_push:0 "Büyük Avusturya Ekonomik Hamlesi"
 AUS_great_austrian_economic_push_desc:0 "Yorulmak bilmez çabalarımız yavaş yavaş karşılığını veriyor ve ekonomimiz bir kez daha büyüyor. Bununla yetinebilirdik, ancak ekonomimizi canlandırma sürecinde keşfedilmemiş potansiyeli gördük. Finans sektörümüzü daha da büyütebilecekken neden daha azıyla yetinelim?"
 AUS_great_austrian_economic_push_tt:0 "[ROOT.GetNameDef]'in ekonomisini ve fabrika çıktısını daha da artırır, §YEkonomik Buhrandan Toparlanma§!'yı §YEkonomik Patlama§! ile değiştirir!"
 AUS_has_air_partners:0 "Şimdi çok çeşitli uçakları test edip uçurduğumuza göre, uçaklarımız için hangi özellikleri sevip sevmediğimizi seçme konusunda eşsiz bir konumdayız. Bu yeni bulunan bilgiyi kullanmayı ve örneklediğimiz uçaklardan en çok arzu edilen bazı özellikleri tersine mühendislikle yeniden üretmeyi düşünmek isteyebiliriz."
 AUS_has_no_air_partners:0 "En iyi çabalarımıza rağmen, hava çabalarımızda ortaklar sağlayamadık. Bunun yerine kendi araştırmamıza yatırım yapmaktan başka seçeneğimiz olmayacak."
 AUS_heavy_specialization:0 "Grossflugzeugkompanie Girişimi"
 AUS_heavy_specialization_bonus:0 "Grossflugzeugkompanie Girişimi"
 AUS_heavy_specialization_desc:0 "Diğerlerinin, esas olarak daha küçük uçaklardan oluşan bir hava kuvvetimiz olmasını bekleyeceğini varsaymak güvenlidir. Ağır bir hava kuvveti imkansız veya elverişsiz görünebilir, ancak doğru yatırımlarla, çoğu düşmanı salt güçle ezebiliriz."
 AUS_heeding_the_call_of_duty:0 "Görev Çağrısına Kulak Verme"
 AUS_heeding_the_call_of_duty_desc:0 "Avusturya halkı, ulusumuzun durumuyla yüzleşmelidir. Kimse bir savaşın gerekli olmasını istemese de, olmayacağının hala bir garantisi yok. Ulusumuzun yargımıza güvendiğinden ve gerekirse savaşmaya istekli olduğundan emin olarak, hazırlığımızı önemli ölçüde artıracağız."
 AUS_heimwehr_support:0 "Heimwehr'den Destek Al"
 AUS_heimwehr_support_desc:0 "Saint-Germain-En-Laye Antlaşması altında yaşanılan yıllar boyunca [AUS.GetNameDef], paramiliter örgütlerin sayısında hızlı bir artış gördü. Bunlar genellikle yasaklandı ve çoğunun zorlamak istedikleri siyasi gündemleri vardı. Heimwehr'in idealleri hiçbir zaman bizimkilerden o kadar da uzak değildi. Onların desteğini alarak, onları Bundesheer'imizle omuz omuza savaşmaya ikna edebiliriz."
 AUS_heritage_of_an_empire:0 "Bir İmparatorluğun Mirası"
 AUS_heritage_of_an_empire_desc:0 "Sadece birkaç on yıl önce ne olduğumuzu unutmadık. [AUS.GetNameDef] kalbinde hala bir imparatorluktur ve sıkı çalışmayla, bir kez daha olmamıza çok az kaldı. Halkımızı bu geçişe hazırlama zamanı geldi."
 AUS_hirtenberger_artillery:0 "Hirtenberger Topçusuna Yatırım Yap"
 AUS_hirtenberger_artillery_desc:0 "Uzun bir süre, Topçu silahları ve mühimmatına ihtiyacımız olduğunda Hirtenberger bizim için başvurulacak isimdi. Şimdi, askeri sanayimizin geri kalanı gibi, Saint-Germain-En-Laye Antlaşması altındayken fon eksikliğinden muzdaripler. Onları tekrar rayına oturtmak için bir yatırım yapmalıyız."
 AUS_hirtenberger_artillery_tt:0 "Tasarımcı olarak §YHirtenberger Savunma Sistemleri§!'ni açar"
 AUS_hold_elections:0 "Seçimler Düzenle"
 AUS_hold_elections_desc:0 "Son seçimimiz 1934'teki 'Parlamentonun Kendi Kendini Yok Etmesi'nden önce, 9 Kasım 1930'da yapıldığı için, halkımız [ROOT.GetAdjective] demokrasisine olan inancını neredeyse tamamen yitirdi. İnancı yeniden tesis etmek ve halkın söz sahibi olmasını sağlamak ilk önceliğimiz olmalıdır!"
 AUS_imperilalist_sentiments:0 "Emperyalist Duygular"
 AUS_improve_army_logistics:0 "Geliştirilmiş Ordu Lojistiği"
 AUS_improve_army_logistics_desc:0 "Ülkemiz güzel manzaralarla zengin, ancak ne yazık ki bu aynı zamanda geçilmez arazi ve lojistik zorluklarla da zengin olduğu anlamına geliyor. Bunları karşılamazsak, nihai savaş zamanı çabalarımızın olması gerekenden daha kötü gitme riskini alabiliriz."
 AUS_improved_warfare_strategies:0 "Geliştirilmiş Savaş Stratejileri"
 AUS_improved_warfare_strategies_bonus:0 "Geliştirilmiş Savaş Stratejileri"
 AUS_improved_warfare_strategies_desc:0 "Saint-Germain-En-Laye Antlaşması altında uzun yıllar geçirdikten sonra stratejilerimiz ve doktrinlerimiz çok eskidi. Şimdiye kadar idare etmiş olsak da, bunları geliştirmezsek kendimizi başarısızlığa hazırlıyoruz."
 AUS_industrial_exchange:0 "Bilgi Alışverişi"
 AUS_industrial_exchange_desc:0 "Yeni müttefiklerimizden, özellikle inşaat konusunda, ama aynı zamanda askeri stratejiler açısından da öğrenecek çok şeyimiz var. Müttefiklerimiz bu bilgiyi isteyerek bizimle paylaştığı için, bundan en iyi şekilde yararlanmalıyız."
 AUS_industrialization_effort:0 "Sanayileşme Çabası"
 AUS_industrialization_effort_desc:0 "[AUS.GetAdjective] sanayi sektörü, zor durumumuzu şaşırtıcı derecede iyi atlattı. Yüksek işsizlik oranları ile bu aynı zamanda bir fırsat olabilir. Sanayilerimizi genişleterek hem sanayi kapasitemizi artırabilir hem de işsizliği azaltarak iki sorunu birden çözebiliriz."
 AUS_innovative_airforce_bonus:0 "Yenilikçi Hava Kuvvetleri"
 AUS_integrate_dnsap_remnants:0 "DNSAP Kalıntılarını Entegre Et"
 AUS_integrate_dnsap_remnants_desc:0 "Daha sıkı yasağa rağmen [AUS.GetNameDef]'de hala DNSAP kalıntıları var. Çoğu Grossdeutsche Volkspartei'nin arkasında toplanmış olsa da, bazıları hala siyasi bir boşlukta varlığını sürdürüyor. Onlardan daha fazla ayaklanmayı önlemek için onları Vaterländische Front'a dahil etmeye çalışmalıyız."
 AUS_integrate_hungary:0 "Macaristan'ı Entegre Et"
 AUS_integrate_hungary_desc:0 "Şimdi bizim olarak geri aldığımız topraklardan daha iyi yararlanmak için, ulusun birleşik kalmasını sağlamalıyız. En istekli ve faydalı olduğu ortaya çıkan devletler, en kısa zamanda İmparatorluğa dahil edilmelidir. [HUN.GetNameDef]'den talep ettiğimiz topraklar en umut verici olduğunu kanıtladı. Entegrasyon çabalarına derhal başlamalıyız!"
 AUS_integrate_northwest:0 "Böhmen'i Entegre Et"
 AUS_integrate_northwest_desc:0 "Şimdi bizim olarak geri aldığımız topraklardan daha iyi yararlanmak için, ulusun birleşik kalmasını sağlamalıyız. En istekli ve faydalı olduğu ortaya çıkan devletler, en kısa zamanda İmparatorluğa dahil edilmelidir. [CZE.GetNameDef]'den talep ettiğimiz topraklar en umut verici olduğunu kanıtladı. Entegrasyon çabalarına derhal başlamalıyız!"
 AUS_intensify_training_efforts:0 "Yoğunlaştırılmış Eğitim Çabaları"
 AUS_intensify_training_efforts_desc:0 "Eğitim çabalarımız karşılığını vermiş olsa da, hala geliştirilebileceğine inanıyoruz. Temel eğitimimizin verimliliğini artırarak, bir askeri eğitmek için gereken süreyi daha da azaltabiliriz."
 AUS_intervention_in_spain:0 "İspanya'ya Müdahale"
 AUS_intervention_in_spain_desc:0 "[SPR.GetAdjective]ler şu anda İber yarımadasında şiddetli bir iç savaşın içindeler. Ne kadar istikrarsız bir durumda olursak olalım, onlara yardım etmeye çalışmalıyız, sonuçta Milliyetçilere karşı değerli bir savaş veriyorlar."
 AUS_invest_in_alpen_elektrowerke:0 "Alpen-Elektrowerke"
 AUS_invest_in_alpen_elektrowerke_desc:0 "Uluslararası pazarda rekabetçi kalmak için sürekli olarak yenilik yapmalı ve yeni çözümler bulmalıyız. Elektronik geliştirmeye yoğun bir şekilde uzmanlaşmış Alpen-Elektrowerke gibi bir şirkete yatırım yapmak, bize tam da ihtiyacımız olan avantajı sağlayabilir."
 AUS_invest_in_erzberg_steel_mines:0 "Erzberg Çelik Madenlerine Yatırım Yap"
 AUS_invest_in_erzberg_steel_mines_desc:0 "[AUS.GetNameDefCap] her zaman oldukça bol çelik madenlerine sahip olmuştur. Erzberg'dekiler özellikle verimli bir girişim gibi görünüyor. Ondan en iyi şekilde yararlanmak için daha fazla yatırım yapmayı düşünmeliyiz."
 AUS_invest_in_kapsch:0 "Telefon- und Telegrafen-Fabrik"
 AUS_invest_in_kapsch_desc:0 "Uluslararası pazarda rekabetçi kalmak için sürekli olarak yenilik yapmalı ve yeni çözümler bulmalıyız. Hem elektronik hem de radarla ilgilenen Telefon- und Telegrafen-Fabriks-Aktiengesellschaft gibi bir şirkete yatırım yapmak, bize az sayıda rakibin eşleşebileceği bir bilgi genişliği sağlayabilir."
 AUS_invest_in_semperit_synthetics:0 "Semperit Sentetiklerine Yatırım Yap"
 AUS_invest_in_semperit_synthetics_bonus:0 "Semperit Yatırımları"
 AUS_invest_in_semperit_synthetics_desc:0 "Çelik tedarikimiz halledildiğine göre, gelecekteki gelişimimiz için ihtiyaç duyabileceğimiz diğer kaynakları düşünmeliyiz. İyi ve yeterince büyük bir kauçuk ve petrol kaynağımız olmadığı için, bu kaynakları yerel olarak edinmenin başka yollarını aramalıyız."
 AUS_invite_danubian_countries:0 "Tuna Ülkelerini Davet Et"
 AUS_invite_danubian_countries_desc:0 "Niyet beyanımız herkesin görmesi için açıkta olduğuna göre, bu federasyonu olabileceğinin en iyisi olacak şekilde genişletme zamanı geldi. İlk adımımız doğal olarak, şu anda tek başına duran diğer Tuna uluslarını bize katılmaya davet etmek olmalıdır."
 AUS_invite_danubian_countries_tt:0 "§YTuna Federasyonu'na Tuna Ülkelerini Davet Etmek§! için kararlar açar!"
 AUS_invite_foreign_tank_designers:0 "Yabancı Tank Tasarımcılarını Davet Et"
 AUS_invite_foreign_tank_designers_desc:0 "[AUS.GetNameDefCap] şu anda güvenilir bir tank tasarımcısından yoksundur. Şimdiye kadar çok çeşitli tanklar kullanıldı, ancak artık kendi tanklarımızı üretmeye başlama zamanı geldi. Ansaldo'yu buraya işletmek için davet etmek harika bir ilk adımdır."
 AUS_invite_foreign_tank_designers_tt:0 "Tasarımcı olarak §YAnsaldo§!'yu açar"
 AUS_invite_spanish_exiles:0 "İspanya'dan Sürgünleri Davet Etme"
 AUS_invite_spanish_exiles_desc:0 "İspanya iç savaşında başka bir sonuç ummuştuk. Savaş alanında yardımımızı sunduğumuz gibi, şimdi de başka bir yerde yardımımızı sunmalı ve Milliyetçi yönetimden kaçanları kabul etmeliyiz."
 AUS_invite_spanish_refugees:0 "İspanyol Milliyetçilerini Davet Et"
 AUS_invite_spanish_refugees_desc:0 "İç savaştaki en iyi çabalarımıza rağmen, [SPA.GetAdjective] kardeşlerimize zafer için yardım edemedik. Kesinlikle çok hayal kırıklığı yaratan bir sonuç olmasına rağmen, aynı dava için savaşanları bize davet ederek ve onları [AUS.GetAdjective] toplumuna ve ordusuna entegre ederek hem onlara hem de kendimize toparlanmada hala yardımcı olabiliriz."
 AUS_invite_the_entente:0 "Küçük Antant'ı Davet Etme"
 AUS_invite_the_entente_desc:0 "İttifakımız, Alp köklerimizin ötesine uzanmak anlamına gelse bile bölgedeki daha fazla üyeden fayda sağlayacaktır. Küçük Antant, Habsburgların geri dönüşüne karşı savunmak için kuruldu ve şimdi aynı tarafta olduğumuza göre, neden onları davet etmeyelim?"
 AUS_invite_the_entente_tt:0 "Eğer §YDemokratik§! veya §YTarafsız§! iseler ve şu anda bir ittifakta değillerse, §Y[YUG.GetNameWithFlag]§!, §Y[ROM.GetNameWithFlag]§! ve §Y[CZE.GetNameWithFlag]§!'ı ittifakınıza davet eder."
 AUS_inviting_the_observers:0 "Gözlemcileri Davet Etme"
 AUS_inviting_the_observers_desc:0 "İttifakımız büyüdükçe, Avrupa'da hesaba katılması gereken bir güç olabileceğimiz giderek daha açık hale geliyor. Tuna, sadece içinden geçtiği ülkeler için değil, aynı zamanda sevkiyatlar için ona güvenen ülkeler için de önemli bir rol taşıyor. Bu ülkeleri [ROOT.GetFactionName]'e davet etmeyi düşünmeliyiz."
 AUS_inviting_the_observers_tt:0 "§YTuna Federasyonu'na daha fazla ulus davet etmek§! için kararlar açar!"
 AUS_join_comintern:0 "Komintern'e Katıl"
 AUS_join_comintern_desc:0 "SSCB ile aynı hizaya geldikten sonra, şimdi bizim için çok açık bir yol açıldı. Komintern'deki yoldaşlarımıza katılmalıyız, halkımızın istediği ve hak ettiği budur!"
 AUS_join_the_allies:0 "Müttefiklere Katıl"
 AUS_join_the_allies_desc:0 "Geleneksel olarak kendimizi her zaman kendi başımıza en güçlü olarak gördük, ancak çevremizdeki durum kötüleşmeye devam ederken, bunun doğru olmayabileceği gerçeğiyle yüzleşmek zorunda kalıyoruz. Tek başına olmak her zaman en iyi seçenek değildir. Güçlü bir demokratik ittifaka katılmaya çalışmalıyız."
 AUS_join_the_allies_tt:0 "Bir üye olarak kabul edilme olasılığı, demokratik olmaya ve ittifak lideriyle olan görüşünüze bağlıdır.\n\nEğer reddedilirsek, bunun yerine kendi ittifakımızı kurabileceğiz."
 AUS_join_the_axis:0 "Sayıda Güç"
 AUS_join_the_axis_desc:0 "Kendi başımıza ne kadar güçlü olursak olalım, bir tür askeri ittifakın bir parçası olmanın hem bize hem de katılmaya çalışacağımız ittifaka fayda sağlayacağı inkar edilemez. Bize en yakın hizbe yaklaşmayı ve katılma izni istemeyi düşünmeliyiz."
 AUS_join_the_axis_tt:0 "§R[GER.GetNameWithFlag]'ın bizi [GER.GetFactionName]'nin bir üyesi olarak kabul etmesi çok düşük bir ihtimaldir, mükemmel ilişkilerle bile hala reddedebilirler!§!"
 AUS_join_the_research_program:0 "Ortak Araştırma Programları"
 AUS_join_the_research_program_desc:0 "Artık benzer düşünen ülkelerden oluşan bir ittifak içinde olduğumuza göre, bundan mümkün olduğunca fazla faydalanmaya çalışmalıyız. Biz ve müttefiklerimiz için bir teknoloji paylaşım grubu oluşturarak, ittifakı teknolojik parlaklıkla bir bütün olarak güçlendirebiliriz."
 AUS_join_the_research_program_tt:0 "§Y[ROOT.GetNameDef]§! ve bizimle bir ittifakta olan her ülke, bir §YTeknoloji Paylaşım Grubuna§! katılacak!"
 AUS_kept_creditanstalt_bankverein_flag:0 "Creditanstalt-Bankverein birleşik tutuldu"
 AUS_lawmaking_leniency:0 "Yasa Yapımında Hoşgörü"
 AUS_lawmaking_leniency_desc:0 "Yeni yasaları geçirme sistemimiz eskidir ve acilen bir gözden geçirmeye ihtiyacı vardır. Bu gibi zamanlarda, durum günden güne değiştiği için hızla yeni yasalar geçirebilmemiz gerekiyor. Daha modernize bir yasa yapma süreci için lobi yapmayı düşünmeliyiz."
 AUS_legacy_of_the_empire:0 "Bir İmparatorluğun Mirası"
 AUS_legacy_of_the_empire_desc:0 "Şu anda güçlü bir imparatorluk olarak geçmişimizin sadece bir gölgesi olsak da, bir zamanlar olduğumuz şeyi yeniden inşa etme arzusunda olamayacağımızı söyleyen hiçbir şey yok. Ulusumuzdaki monarşist duyguları körükleyerek, onu bir kez daha güçlü bir monarşi olmaya hazırlayabiliriz."
 AUS_legitimistische_jugend:0 "Legitimistische Jugend"
 AUS_legitimistische_jugend_desc:0 "Çocuklara ve ergenlere monarşiye ve tüm temel değerlerine erken bir giriş yapmanın, onların hem çalışan hem de gerekirse ulusumuz için savaşan sadık ve mutlu vatandaşlar olarak büyümelerini sağladığını gördük. Bunun çok daha kötü şeylere giden kaygan bir zemin olduğunu söyleyen korku tacirliği var, ancak bu eğitimin onlara tamamen faydalı olacağından eminiz."
 AUS_legitimistische_studentenverbindung:0 "Legitimistische Studentenverbindung"
 AUS_legitimistische_studentenverbindung_desc:0 "Öğrenci ilgi örgütü Legitimistische Studentenverbindung, tüm eğitim seviyelerindeki sadık öğrencilere hizmet vermektedir. Kolordudan daha az militarist olanlar, söylem ve tartışmaların yanı sıra bilime daha çok ilgi duyuyorlar. İlgi alanları ve taca olan sarsılmaz sadakatleri bizim için çok faydalı olabilir!"
 AUS_light_ship_bonus:0 "Savunmacı bir Sürü"
 AUS_light_ship_bonus_desc:0 "Gemi yapımcılarımızın daha küçük gemilerin ve denizaltıların üretimini hızlandırmak için yöntemler bulması uzun sürmedi. Bu yöntemleri standardize ederek, sahilimizi güvende tutmak için kendimize hatırı sayılır bir filo inşa edebilmeliyiz."
 AUS_light_specialization:0 "Jagdfliegerkompanie Girişimi"
 AUS_light_specialization_bonus:0 "Jagdfliegerkompanie Girişimi"
 AUS_light_specialization_desc:0 "Daha büyük uçak gövdeleri söz konusu olduğunda daha büyük ülkelerle gerçekten rekabet edemeyiz, ancak üstün avcı uçakları ve CAS ile düşmanımızın bölgemize bile ulaşmamasını sağlayabiliriz. Sonuçta hava savaşları it dalaşlarında kazanılır ve kaybedilir."
 AUS_medium_specialization:0 "Schlachtfliegerkompanie Girişimi"
 AUS_medium_specialization_bonus:0 "Schlachtfliegerkompanie Girişimi"
 AUS_medium_specialization_desc:0 "Hava kuvvetlerimizin birçok rolü doldurabilmesi gerekiyor. Hava kuvvetlerimizin tüm yönlerini inşa etmek için kaynaklarımız yok ve bu nedenle iyi bir uzlaşma bulmak çok önemlidir. Çift motorlu uçaklar hem bombardıman uçakları hem de avcı uçakları için kullanılabilir ve bize mükemmel bir uzlaşma gibi görünüyor."
 AUS_meticulous_preparations:0 "Titiz Hazırlıklar"
 AUS_meticulous_preparations_desc:0 "Çevremizdeki işçileri kurtarmak için acele etme konusunda gerçek bir cazibe var, ancak bu, ana cepheyi açık bırakma riski taşıyor. Yabancı ülkelerdeki girişimlerimiz [ROOT.GetNameDef]'de bir miktar kargaşaya neden oldu, başkalarına yardım etmeye başlamadan önce buna bir bakmalıyız."
 AUS_militarization_effort:0 "Grazer Maschinen-und Waggonbau"
 AUS_militarization_effort_desc:0 "Bir zamanların kudretli ordumuzun yoğun bir şekilde güvendiği şirketlerden biri Grazer Maschinen- und Waggonbau-Aktiengesellschaft idi. Sadece araçlar değil, aynı zamanda obüsler ve tüfekler için miller de inşa ederek, bir zamanlar askeri kapasitemizin bir temel taşıydılar. Onları bir kez daha öyle yapmalıyız."
 AUS_naval_efficiency:0 "[ROOT.GetAdjective] Donanma Verimliliği"
 AUS_naval_efficiency_desc:0 "Zorlu çalışmamız ve adanmışlığımızla, zorluklara rağmen, hatırı sayılır bir donanma varlığı yeniden inşa ettik. Veya başarımız, hem denizcilerimizi hem de tersanelerde çalışanları teşvik etti, bu son mükemmellik hamlesi için bundan faydalanmalıyız!"
 AUS_neustadter_flugzeugwerke:0 "Neustädter Flugzeugwerke"
 AUS_neustadter_flugzeugwerke_desc:0 "Son zamanlarda yeni bir uçak üreticisi, hizmet dışı bırakılmış bir Oesterreichische Flugzeugfabrik fabrikasını satın aldı. Yeni şirket olan Neustädter Flugzeugwerke'nin niyeti, hafif spor uçakları inşa etmektir, ancak şirket iki eski avcı pilotu tarafından kurulduğu için, onları bunun yerine bizim için üretmeye ikna edebilmemiz çok muhtemeldir."
 AUS_offensive_on_the_fascists:0 "Anti-Faşist Taarruz"
 AUS_offensive_on_the_fascists_desc:0 "Güney komşumuzun sorunlarımızın çoğunun kaynağı olduğu gerçeğini artık görmezden gelemeyiz. Diplomasi her zaman tercih ettiğimiz yöntem olsa da, bazen daha sert müdahaleler gerekir."
 AUS_osterreichische_akademie:0 "Österreichische Akademie"
 AUS_osterreichische_akademie_desc:0 "Österreichische Akademie der Wissenschaften, 1846'da İmparator I. Ferdinand'ın el yazısıyla yazdığı bir kararname ile kuruldu. O zamandan beri akademi küçük bir bilimsel dernek ve topluluktan saygın bir akademiye dönüştü ve Nobel Ödülü kazananları yetiştirdi. Akademi, mali krizimiz sırasında zorlandı, ancak bizden bir yatırımın onu tekrar yoluna sokacağı ve gelecekte bize büyük kar getireceği kesindir."
 AUS_osterreichische_bundesheer:0 "Österreichische[GetArmyName]"
 AUS_osterreichische_bundesheer_desc:0 "Saint-Germain-En-Laye Antlaşması artık bir engel olmadığına göre, düzgün bir şekilde yeniden inşa etmeye başlama zamanı geldi. [ROOT.GetNameDefCap]'in hazırlıksız yakalanmasına izin verilemez, ne de giderek daha tehditkar hale gelen bir dünya karşısında sadece beklememiz beklenebilir."
 AUS_osterreichische_fallschirmsjager:0 "Österreichische Fallschirmjäger"
 AUS_osterreichische_fallschirmsjager_desc:0 "Hem ordumuzu hem de hava kuvvetlerimizi yeniden inşa ettikten sonra, bu iki girişimi daha büyük bir iyilik için en iyi nasıl birleştirebileceğimizi görmenin zamanı geldi."
 AUS_osterreichische_gebirgsjager:0 "Österreichische Gebirgsjäger"
 AUS_osterreichische_gebirgsjager_desc:0 "Çok dağlık bir ülke olarak, birliklerimizin bu koşullarda ve ortamlarda savaşlar için yeterince eğitildiğinden emin olmak en iyi çıkarlarımız arasındadır."
 AUS_osterreichische_gebirgsjager_tt:0 "§H Dağ Savunma Eğitimini§! etkinleştirir\n§HPiyade\n    Dağlar§!\n      Savunma: §G+%5§!\n      Hareket: §G+%5§!\n§HDağcılar\n    Dağlar§!\n      Savunma: §G+%5§!\n      Hareket: §G+%10§!\n"
 AUS_osterreichische_luftstreitkrafte:0 "Österreichische Luftstreitkräfte"
 AUS_osterreichische_luftstreitkrafte_desc:0 "Hava kuvvetlerimiz, atalarımızın eylemleri için bize dayatılan antlaşmalardan ciddi ve olumsuz bir şekilde etkilenmiştir. Bu yeni ve çok daha sert dünyada bir şans yakalamak için, hava kuvvetlerimizi mevcut çağın standardına göre yeniden inşa etmeyi düşünmeliyiz."
 AUS_osterreichische_seebataillon:0 "Österreichisches Seebataillon"
 AUS_osterreichische_seebataillon_desc:0 "Kıyı şeridindeki yerimizi güvence altına almak için çok şeyden geçtik, sadece ordumuzun bu koşullarda fiilen savaşma görevine çok hazırlıksız olduğunu anlamak için. Bu adamların daha verimli savaşmasına neyin yardımcı olabileceğine bakmalıyız."
 AUS_otto_von_habsburg_has_joined_austria_flag:0 "Otto von Habsburg Avusturya'ya geri döndü"
 AUS_our_brothers_in_the_east:0 "Doğudaki Kardeşlerimiz"
 AUS_our_brothers_in_the_east_desc:0 "Şimdi nihayet kendimizi bir demokrasi olarak yeniden kurmuş olsak da, hala otoriter diktatörlerin gölgesinde acı çeken başkaları var. [HUN.GetAdjective] kardeşlerimizle bir yeniden birleşme arzumuz çok az olsa da, onların da kendileri için bir seçim yapmalarına izin verilmesi gerektiğine inanıyoruz. Onlar için de demokrasi sağlanmalıdır!"
 AUS_outlaw_the_radicals:0 "Radikalleri Yasadışı İlan Et"
 AUS_outlaw_the_radicals_desc:0 "Çok hassas bir siyasi durumdayız. Şimdi, siyasi yelpazenin farklı uçlarındaki radikal partiler arasında iç çekişme zamanı değil. En kötüsü geçene kadar, iğrenç propagandalarını yaymalarına izin veremeyiz!"
 AUS_panzer_effort_bonus:0 "Panzer Çabası"
 AUS_pardon_political_exiles:0 "Siyasi Sürgünleri Affet"
 AUS_pardon_political_exiles_desc:0 "Avusturya Faşizmi yönetimi altındaki sözde Korporatif Devlet zamanında, birçok parlak politikacı ülkemizden kaçtı. Siyasi duruşlarına bakılmaksızın onlara geri dönme teklifini uzatmalıyız."
 AUS_politicized_general_staff:0 "Siyasallaşmış Genelkurmay"
 AUS_politicized_general_staff_desc:0 "Daha önce siyasi gündemleri olan paramiliter grupların bizim için nasıl gerçek bir baş belası olabildiğini görmüş olsak da, aynı şey düzenli ordumuz için söylenemez. Siyasetimizde iyi bilgili ve vizyonlarımızı paylaşan bir ordu, güvenliğimiz için savaşmaya çok daha istekli ve yetenekli olacaktır!"
 AUS_preparing_the_industry:0 "Lohner-Werke'de Uçak Üretimi"
 AUS_preparing_the_industry_desc:0 "En önemli ve değerli uçak üreticilerimizden biri, Saint-Germain-En-Laye Antlaşması yürürlüğe girdiğinden beri yeni uçak üretimini tamamen durdurdu. Şimdi hava kuvvetlerimizi yeniden inşa ederken, tedarikçilerimizi de yeniden inşa ettiğimizden emin olmalıyız."
 AUS_proclaim_austrian_empire:0 "Avusturya İmparatorluğu'nu İlan Et"
 AUS_proclaim_austrian_empire_desc:0 "İmparatorluğumuzu yeniden inşa etme ve yeniden kurma çabalarımız nihayet karşılığını verdi. Tüm eski topraklarımızı fethettik ve haklı olarak kendimizi bir kez daha İmparatorluk olarak adlandırabiliriz!"
 AUS_promote_admirals:0 "Amiralleri Terfi Ettir"
 AUS_promote_admirals_desc:0 "Uzun süre donanmasız kaldıktan sonra, artık bir zamanlar sahip olduğumuz amiral sayısına sahip olmamamız doğaldır. Olası amiraller havuzu tam olarak büyük olmasa da, filolarımızı zafere götürebilecek en azından biraz deneyime sahip birkaçımız hala var."
 AUS_promote_admirals_fasc_com_tt:0 "§YCarl Heinz Birnbacher§!'i (yetenek 2) bir Amiral olarak açar"
 AUS_promote_admirals_tt:0 "§YJohannes of Liechtenstein§! (yetenek 3) ve §YCarl Heinz Birnbacher§! (yetenek 2)'yi Amiral olarak açar"
 AUS_promote_the_worthy:0 "Layık Olanı Terfi Ettirme"
 AUS_promote_the_worthy_desc:0 "Generallerimizden birkaçı hem davamıza hem de ülkemize büyük bir umut ve sadakat gösteriyor. Onları örnek alarak ve terfilerle ödüllendirerek, personelimizden daha fazlasının bu tür davranışları teşvik etmesini umuyoruz!"
 AUS_properly_trained_militias:0 "Düzgün Eğitimli Milisler"
 AUS_properly_trained_militias_desc:0 "Milislerimiz ülkemizin savunmasının ayrılmaz bir parçası haline geldi, ancak bu noktada resmi bir eğitimleri yok. Bir milisin doğası gereği tam kontrol ve onları tamamen eğitmek hiçbir zaman mümkün olmayacak olsa da, bir eğitim çabası hepimize iyi hizmet edecektir."
 AUS_protector_of_the_danube:0 "Tuna'nın Koruyucusu"
 AUS_protector_of_the_danube_desc:0 "Hemen komşu topraklarımızdaki sürekli kötüleşen durumla, tüm üyelerimizin uzun ömürlülüğünü ve güvenliğini sağlamak için önlemler alınmalıdır. [ROOT.GetFactionName]'nin lideri olarak bu sorumluluk bize düşmelidir."
 AUS_protector_of_the_danube_tt:0 "§YFederatif bir devlete birleşmeyi önermek§! ve §Yüyeleri kendi tarafımıza çekmek§! için kararlar açar!\n\n§RBüyük güçlerin, ya önemli ölçüde zayıflamadıkları sürece ya da [AUS.GetNameDef] daha da büyük bir güç olmadıkça bunu kabul etmeleri çok düşük bir ihtimaldir!§!"
 AUS_pulverfabrik_skodawerke:0 "Pulverfabrik Skodawerke'ye Yatırım Yap"
 AUS_pulverfabrik_skodawerke_bonus:0 "Skodawerke Yatırımları"
 AUS_pulverfabrik_skodawerke_desc:0 "Niederösterreich'deki kimyasal tesis Pulverfabrik Skodawerke'nin geçmişte barut, dinamit ve çelik fabrikaları için kimyasallar gibi birçok kullanımı olmuştur. Şu anda uzmanlıklarının en iyi kullanımı muhtemelen onları sentetik kaynaklara yönlendirmek olacaktır."
 AUS_pulverfabrik_skodawerke_tt:0 "§Y3x§! §G%25§! Araştırma bonusu: §YYakıt Depolama§! ve §YYakıt Rafinasyonu§! teknolojisi."
 AUS_purchase_foreign_designs:0 "Yabancı Uçak Satın Alma"
 AUS_purchase_foreign_designs_desc:0 "Havada gerçekten rekabetçi olmak için diğer ülkelerin uçaklarını nasıl tasarladıklarını incelemeliyiz. Yerli üretimin avantajları olsa da, geniş bir ülke yelpazesinden örnek alıp satın alarak, büyük başlangıç maliyeti olmadan ihtiyaçlarımız için en iyi uçağı alabiliriz."
 AUS_radar_effort:0 "Goldhaube Sistemleri Çabası"
 AUS_radar_effort_desc:0 "Modern bir hava kuvveti sadece uçaklarına değil, aynı zamanda onları yönlendirecek iyi teknolojiye de bağlıdır. Radar keşfiyle, teknolojik olarak geride kalmamıza izin veremeyiz!"
 AUS_raid_military_storages:0 "Eski Askeri Stoklara Baskın Yapma"
 AUS_raid_military_storages_desc:0 "Ülkenin dört bir yanındaki eski stoklarda bol miktarda askeri teçhizat bulunmaktadır. Mevcut durumumuzda, bunların kilit altında olmasındansa halkın elinde daha faydalı olacağına inanıyoruz. Bu kaynakları en iyi şekilde kullanma zamanı geldi."
 AUS_rally_the_people:0 "Halkı Topla"
 AUS_rally_the_people_desc:0 "Tarihimizde, ideallerimizi paylaşanlar tarafından denenmiş çok sayıda darbe olmuştur. Bu tür yöntemlere tekrar başvurmamak umuduyla halkı yanımıza çekmeli ve reform için baskı yapmalıyız."
 AUS_rapid_rearmament:0 "Hızlı Yeniden Silahlanma"
 AUS_rapid_rearmament_desc:0 "Sonunda Antlaşma'nın prangalarından kurtulduğumuza göre, şimdi derhal yeniden silahlanmalıyız. Ordumuz ve hava kuvvetlerimiz son on yılda ciddi şekilde ihmal edildi ve bizi tekrar kabul edilebilir bir seviyeye getirmek için önemli çabalar gerekecek."
 AUS_rapid_revolutions:0 "Hızlı Devrim"
 AUS_rapid_revolutions_desc:0 "Yabancı işçileri kurtarma ve onlar için üretim araçlarını güvence altına alma eylemlerimizle durumumuz kötüleşmiş olsa da, dinlenmek için zaman yok. Yoldaşlarımızı kapitalizmin prangalarından en kısa zamanda kurtarmalıyız, bu halkımızın refahına en küçük ve geçici bir darbe vursa bile."
 AUS_reach_out_to_italy:0 "İtalya'ya Ulaş"
 AUS_reach_out_to_italy_desc:0 "Birçok anlaşmazlık yaşamış olsak da, İtalya mevcut durumumuzda sahip olduğumuz en güvenilir müttefik olmaya devam ediyor. Yakın çevremizde huzursuzluk ve gerilimler arttıkça, onlardan destek için ulaşmak faydalı görünüyor."
 AUS_rearmament_and_guarantees_tt:0 "§RGarantörlerin isteklerine karşı gelmek, düşen görüşten geri çekilen garantilere kadar diplomatik sonuçlara neden olabilir!§!"
 AUS_rebellious_rearmament:0 "Asi Yeniden Silahlanma"
 AUS_rebellious_rearmament_desc:0 "[AUS.GetNameDef], çok uzun zamandır, hiçbir çıkış yolu olmadan, son derece adaletsiz ve son derece rahatsız edici Saint-Germain-En-Laye Antlaşması'na bağlı kalmıştır. Monarşiyi yeniden kurarak, zaten bir şekilde antlaşmayı ihlal ediyoruz ve bu noktaların geri kalanına da uymamız için hiçbir neden olmamalı. Bu feci antlaşmayı kaldırma zamanı geldi!"
 AUS_rebuild_democratic_systems:0 "Demokratik Sistemleri Yeniden İnşa Et"
 AUS_rebuild_democratic_systems_desc:0 "Demokratik bir sistem çok hassas bir şeydir, sökülmesi kolay, ama inşa edilmesi veya restore edilmesi zordur. Ama halkın iyiliği için bu derhal yapılması gereken bir şeydir. Diktatörlükleri teşvik eden partiler, ulusun iyiliği için yasaklanmalıdır."
 AUS_rebuild_democratic_systems_tt:0 "Mevcut §YFaşist§! parti §YDNSAP§!, yasaklanacak ve:"
 AUS_rebuild_the_armada:0 "Armadayı Yeniden İnşa Et"
 AUS_rebuild_the_armada_bonus:0 "Armadayı Yeniden İnşa Etme"
 AUS_rebuild_the_armada_desc:0 "Güçlü zırhlılar üretme ve denizlere hükmetme tarihimiz var. O günler şimdi çok uzakta görünüyor ama bilgi kaybolmadı. Denizleri geri alma zamanı geldi ve tüm potansiyel saldırganları caydırmak için büyük zırhlılarla büyük bir filo kurmaktan başka ne yol var."
 AUS_reclaim_dockyards:0 "Eski Tersaneleri Geri Alma"
 AUS_reclaim_dockyards_desc:0 "Deniz savaşının doğası değiştikçe, donanmamızın ihtiyaçları da değişiyor. Sadece birkaç ama güçlü gemiyi savaşa getirme günleri çoktan geride kaldı. Modern deniz savaşları, hem yeni gemiler inşa etmek hem de kendimizinkini onarmak için çok daha büyük bir kapasiteye sahip olmamızı gerektiriyor. Tersane sayısını artırmalıyız."
 AUS_reclaim_habsburg:0 "Habsburg'u Geri Al"
 AUS_reclaim_habsburg_desc:0 "Kendi anavatanlarımız hala kontrolümüz altında değil. Habsburglar, aile soylu olsa da düşük soylu olarak kabul edildiği Habsburg köyündeki mütevazı başlangıçlarını unutmadılar. İşler değişti, anavatanları geri alma zamanı geldi."
 AUS_reclaim_habsburg_tt:0 "Eğer onlardan §GGüçlüysek§! kabul etme olasılıkları daha yüksektir.\n\n§Yİsviçre Eyaletlerini Yeniden Entegre Etmek§! için kararlar açar."
 AUS_reclaiming_yugoslavian_territories:0 "Balkan Topraklarını Geri Alma"
 AUS_reclaiming_yugoslavian_territories_desc:0 "Büyük İmparatorluğumuz bir zamanlar Adriyatik denizi'ne kadar uzanıyordu. Bu topraklar da Büyük Savaş'ın sonunda bizden çalındı. Bu toprakları geri alarak, taktiksel olarak önemli bir kıyı şeridini de geri almış olacağız. Bu devletlerin sahiplerine, onları bize barışçıl bir şekilde teslim etmelerini veya sonuçlarına katlanma riskini almalarını önermeliyiz."
 AUS_reclaiming_yugoslavian_territories_tt:0 "§Y[102.GetName]§!, §Y[103.GetName]§! ve §Y[853.GetName]§!'nin Sahibi '§Y[AUS.GetNameDef]'den Ültimatom§!' olayını alır"
 AUS_recruiting_the_graduates:0 "Üniversiteden İşe Alım"
 AUS_recruiting_the_graduates_desc:0 "Bilimsel çabalarımızı uzun vadede sürdürmek için sürekli olarak yeni yetenekler kazanmalıyız. Graz'daki Üniversite ile birlikte çalışarak, öğrencileri, mezunları ve profesörleri kendi projelerimize çekebiliriz."
 AUS_reestablish_austrian_navy:0 "Donanmayı Yeniden Kur"
 AUS_reestablish_austrian_navy_desc:0 "Büyük Savaş'ın sonunda kıyı şeridimizi kaybetmemiz, artık yeni gemiler inşa etme imkanımızın olmadığı anlamına geliyordu. İsteksizce filomuzun geri kalanını, sadece iki hafta sonra onu devreden [YUG.GetNameDef] ayrılıkçı devletine verdik. Şimdi bir kez daha bir donanma geliştirme imkanımız olduğuna göre, bu hatanın bir daha asla tekrarlanmamasını sağlamalıyız."
 AUS_refine_vaterlandische_front:0 "Vaterländische Front'u Geliştir"
 AUS_refine_vaterlandische_front_desc:0 "Çok uzun zamandır Vaterländische Front, Parlamentonun Kendi Kendini Yok Etmesi ile birleşen siyasi Partilerin bir işbirliği olmuştur. Avusturya Faşizminin ilk ideolojisi, zamanla tam olarak lehimize olmayan bir şekilde yavaş yavaş değişti. Kendimizi doğru rotaya geri döndürme zamanı geldi."
 AUS_reforming_the_central_powers:0 "Merkezi Güçleri Yeniden Kur"
 AUS_reforming_the_central_powers_desc:0 "Bir askeri ittifakın bir parçası olmanın gücümüze bir destek olacağını kabul etsek de, mevcut seçeneklerimize baktığımızda, bunların standartlarımıza tam olarak uymadığını hissetmiyoruz. Büyük Savaş sırasında güçlü Merkezi Güçlerin bir parçasıydık, daha iyi bir seçenek olmadığı için bu ittifakı yeniden kurmayı düşünmeliyiz."
 AUS_reforming_the_central_powers_tt:0 "Eğer §YFaşist§! veya §YTarafsız§! iseler ve şu anda bir ittifakta değillerse, §Y[GER.GetNameWithFlag]§!, §Y[TUR.GetNameWithFlag]§! ve §Y[BUL.GetNameWithFlag]§!'ı §YMerkezi Güçlere§! davet eder."
 AUS_regulate_austrian_finance_sector:0 "Finans Sektörünü Düzenle"
 AUS_regulate_austrian_finance_sector_desc:0 "[AUS.GetAdjective] ekonomisi, onu yeniden dengelemek için gösterdiğimiz en iyi çabalara rağmen hala mücadele ediyor. Hiçbir şey yapılmazsa, beraberindeki hiperenflasyonla birlikte başka bir tam ölçekli ekonomik çöküşün yakında başımıza geleceğinden korkuyoruz. Finans sektörümüzün kontrolünü geri almanın zamanı geldi."
 AUS_regulate_austrian_finance_sector_tt:0 "§YSanayi Holdingi§! bankasını, ya §YBaşlangıç Üretim Verimliliğini§! artırmak ya da §YTüketim Malları§! ihtiyacını azaltmak için açar ve uzmanlaştırır. Alternatif olarak, banka daha az bir ölçüde §YHer İkisini§! de etkileyebilir."
 AUS_reinforcing_the_supply_network:0 "İkmal Ağını Güçlendirme"
 AUS_reinforcing_the_supply_network_desc:0 "Ordumuzun yetersiz ikmale karşı direncini artırarak ikmal durumumuzu iyileştirme çabalarımızın yeterli olmadığını fark ettik. Durumu bir kez ve herkes için çözmek için, ikmal ağının kendisini fiilen iyileştirmemiz gerekiyor."
 AUS_reinstate_the_imperial_council:0 "Herrenhaus'u Yeniden Kur"
 AUS_reinstate_the_imperial_council_desc:0 "Beklediğimiz gibi, halkımız eski zamanlara dönme arzusunu ifade ediyor. Faşistlerin 1934'te Parlamentonun Kendi Kendini Yok Etmesi'nde olduğu gibi kötüye kullanılabilecek açıkça kusurlu bir sisteme artık ihtiyacımız yok. Tek kişi yönetimi, İkili Monarşi'de her zaman güvenli ve iyi karşılanan bir sistemdi, onu geri getirme zamanı geldi."
 AUS_release_imprisoned_leaders:0 "Siyasi Muhalefeti Yasallaştır"
 AUS_release_imprisoned_leaders_desc:0 "Ulusumuz giderek daha otoriter hale geldikçe, ona karşı çıkmaya cüret edenler hızla hapsedildi. Bu hapis cezaları tamamen adaletsizdi ve tamamen siyasete dayanıyordu. Hapsedilenleri serbest bırakmalı ve siyasi muhalefeti yeniden yasal hale getirmeliyiz."
 AUS_renew_claims_in_italy:0 "[ITA.GetNameDef]'deki Talepleri Yenile"
 AUS_renew_claims_in_italy_desc:0 "Büyük Savaş'tan sonra topraklar bölündüğünde, [ITA.GetAdjective]ler gerçekten istememelerine rağmen Alto Adige ve Trentino'yu bizden aldılar. Gücümüz şimdi büyük ölçüde yeniden inşa edildiğine göre, haklı topraklarımızı bize geri vermelerini talep etmek hakkımızdır."
 AUS_renounce_the_treaties:0 "Antlaşmayı Feshetme"
 AUS_renounce_the_treaties_desc:0 "Hükümetimiz genellikle çatışma ve kaba eylemler yerine söylem ve diplomasiyi tercih etse de, Saint-Germain-En-Laye Antlaşması konusunda oyalanmak için çok az nedenimiz var. Ulusumuz istikrara kavuştukça ve kontrolü geri kazandıkça, bu kadar katı kurallara bağlı kalmamız için hiçbir neden yok. Bu antlaşmayı derhal feshedeceğiz."
 AUS_repeal_the_adelsaufhebungsgesetz:0 "Adelsaufhebungsgesetz'i Yürürlükten Kaldır"
 AUS_repeal_the_adelsaufhebungsgesetz_desc:0 "Adelsaufhebungsgesetz, Habsburgergesetz ile birlikte yürürlüğe girdi ve [AUS.GetAdjective] soyluluğunun varlığını etkili bir şekilde ortadan kaldırdı. Unvanlar, onursal ayrıcalıklar ve güç, bu ailelerden bir el çırpmasıyla alındı. Bu yasa açıkça yanlıştır ve soylularımızı ve aile gururlarını restore ederek gelecekteki sadakatlerini güvence altına alabiliriz."
 AUS_repeal_the_habsburgergesetz:0 "Habsburgergesetz'i Yürürlükten Kaldır"
 AUS_repeal_the_habsburgergesetz_desc:0 "Habsburgergesetz, 1919'da Büyük Savaş'tan sonra yürürlüğe girdi ve Habsburg ailesinin hak ve yetkilerini ciddi şekilde sınırladı. Şu anda ülkemizi kim yönetirse yönetsin, bu yasa [AUS.GetNameDef]'in bir monarşi olarak itibarına bir lekeydi ve derhal yürürlükten kaldırılmalıdır."
 AUS_repeal_the_may_constitution:0 "Mayıs Anayasasını Yürürlükten Kaldır"
 AUS_repeal_the_may_constitution_desc:0 "1934'te Engelbert Dolfuss tarafından kurulan sözde Mayıs Anayasası, son birkaç yıldır [AUS.GetNameDef]'in politikasını engelledi. Siyasi partiler yasaklanarak ulusun daha iyisi için her türlü değişim olasılığı ortadan kaldırıldı. Eğer ülkemiz bir daha gelişecekse, bu adaletsiz anayasayı yürürlükten kaldırmalıyız."
 AUS_restoring_our_rightful_flag:0 "Bayrağımıza Olan Hakkımızı Geri Alma"
 AUS_restoring_our_rightful_flag_desc:0 "1936 Olimpiyatları'na girdiğimizde, bayrağımızın [HAI.GetNameDef]'inkiyle aynı olduğunu gördük. İsteksizce bayrağımızı onlardan farklı olacak şekilde değiştirdik, ancak gerçek hala ortada, bayrak bize ait ve [HAI.GetAdjective]ler o zaman vazgeçmediği için, bunu başka bir şekilde halletmeliyiz."
 AUS_revitalize_austrian_air_industry:0 "Hava Sanayini Canlandır"
 AUS_revitalize_austrian_air_industry_desc:0 "Büyük Savaş öncesinde ve sırasında [AUS.GetNameDef]'de birkaç uçak üreticimiz vardı. Ancak Saint-Germain-En-Laye Antlaşması bize dayatıldığından beri bu imkansızdı. Şimdi antlaşma geçersiz kılındığına göre, sanayimizi yeniden kurmak ve ona ihtiyacımız olması durumunda canlandırmak için hızla hareket etmeliyiz."
 AUS_revive_stt:0 "STT'yi Canlandır"
 AUS_revive_stt_desc:0 "Stabilimento Tecnico Triestino bir zamanlar daha büyük gemilerimiz için başvurduğumuz tersaneydi. Ürettikleri gemiler enfes kalitedeydi ve o zamanlar bize iyi hizmet etti. Şimdi birkaç tersane tekrar kontrolümüz altında olduğuna göre, onları bir kez daha faaliyete geçirmeliyiz."
 AUS_revolution:0 "Kızıl Viyana'yı Geri Alma"
 AUS_revolution_desc:0 "Artık sadece iktidar partisine muhalefet olarak faaliyet göstermemizin mümkün olmadığı bir zaman geldi. Halkımız, mevcut liderliğin sağlayabileceğinden daha iyisini hak ediyor ve artan popülaritemiz, şimdi saldırma zamanının geldiğini kanıtlıyor!"
 AUS_revolution_tt:0 "§YMilis Desteği§! Ulusal Ruhuna sahip olmak, iç savaşın başında 3 birim §YSchutzbund Tümeni§! ortaya çıkaracaktır."
 AUS_revolution_tt_2:0 "Her iki tarafa verilen birlik miktarı, §YKomünizm§! popülaritesine bağlıdır.\n\nEğer §YKomünizm Desteği§! §Y%60§!'ın üzerindeyse, iç savaştan tamamen kaçınılacaktır."
 AUS_royal_scientific_grants:0 "Kraliyet Bilimsel Hibeleri"
 AUS_royal_scientific_grants_desc:0 "Österreichische Akademie der Wissenschaften'a yaptığımız yatırımlar hem bize hem de akademiye çok faydalı oldu ve şimdi bu ortaklığı bir sonraki seviyeye taşıyıp taşımamayı düşünüyoruz. Şu anda akademi için birçok yetenekli bilim insanı çalışıyor ve biraz ikna ile onları kendi projelerimizde de çalıştırabilmeliyiz."
 AUS_saurerwerke:0 "Österreichische Saurerwerke"
 AUS_saurerwerke_desc:0 "Uzun bir süredir Österreichische Saurerwerke çeşitli kullanımlar için kamyonlar üretiyor. Ancak bu gibi zamanlarda, sadece en iyi oldukları şeye odaklanmalarına ihtiyacımız var ve bu da askeri için kamyon yapmaktır."
 AUS_saved_bankverein_flag:0 "Finansman Wiener Bankverein'e yeniden önceliklendirildi"
 AUS_saved_creditanstalt_flag:0 "Finansman Österreichische Creditanstalt'a yeniden önceliklendirildi"
 AUS_schutzbund_support:0 "Schutzbund Desteği Kazan"
 AUS_schutzbund_support_desc:0 "Çoğu [ROOT.GetAdjective] paramiliter grubun milliyetçi, meşruiyetçi ve hatta faşist siyasi gündemleri olmuştur ve ülkemizdeki birçok silahlı çatışmanın bir kısmından kısmen sorumlu olmaları nedensiz değildir. Republikanischer Schutzbund kendi payına düşen sorunları yaratmış olsa da, siyasi olarak çok benzediğimiz gerçeği ortadadır. Onları davamıza dahil etmeliyiz."
 AUS_schutzbund_support_tt:0 "Bir §YKomünist§! iç savaşının başlangıcında §Y[4.GetName]§!'de §Y3§! adet §YSchutzbund Tümeni§! ortaya çıkacak.\n\nKarşı taraf, §Y[152.GetName]§!'de §R2§! adet yerine §Y1§! adet §YHeimwehr Tümeni§! ortaya çıkaracak!"
 AUS_scientific_grants:0 "Bilimsel Hibeler"
 AUS_scientific_grants_desc:0 "Bilim ve araştırma bütçemizi artırdıkça, bu yeni bilginin potansiyel uygulamaları belirgin hale geldi. Bir dizi hibe vererek, bunun olumlu etkilerini daha da güçlendirebilmeliyiz."
 AUS_second_brothers_war:0 "İkinci Kardeşler Savaşı"
 AUS_second_brothers_war_desc:0 "1866'da biz ve [GER.GetNameDef]'in selefi arasında bir savaş başladı. O zamanlar Schleswig-Holstein hakkında küçük bir kavgaydı, ama şimdi zaman değişti. [GER.GetAdjective]ler kuzey sınırımızda bir tehdit olmaya devam ediyor. Bu kardeş rekabetini bir kez ve herkes için sona erdirme zamanı geldi."
 AUS_secret_rearmament:0 "Gizli Yeniden Silahlanma"
 AUS_secret_rearmament_desc:0 "Çok uzun bir süre boyunca, yeniden silahlanma kısıtlamaları herhangi bir ordu varlığı oluşturmayı imkansız hale getirdi. Saint-Germain-En-Laye Antlaşması hala yürürlükte olsa da, gizlice yeniden silahlanmayı haklı çıkarmak için kullanabileceğimiz birkaç boşluk bulduk."
 AUS_seek_agreement_for_rearmament:0 "Yeniden Silahlanma İçin Anlaşma Ara"
 AUS_seek_agreement_for_rearmament_desc:0 "İç politikamız şimdi biraz daha kontrol altında olduğuna göre, dışarıya bakma zamanı geldi. Hala adaletsiz Saint-Germain-En-Laye Antlaşması'na bağlıyız, bu da askeri büyümemizi ve kendimizi savunma yeteneğimizi engelliyor. Bizi güvende tutmak için diğer imzacılara biraz bağımlı olduğumuz için, onları yeniden silahlanma niyetimiz hakkında bilgilendirmek ve anlaşmalarını aramak akıllıca olacaktır."
 AUS_seek_agreement_for_rearmament_tt:0 "§Y[ITA.GetFlag][ITA.GetName], [ENG.GetFlag][ENG.GetName] [FRA.GetFlag][FRA.GetName],§! ve §Y[USA.GetFlag][USA.GetName]§!'e talebi onaylamaları veya reddetmeleri için bir Etkinlik gönderilecektir. Yanıt ne olursa olsun, yeniden silahlanma seçimi yine de yapılabilir."
 AUS_seek_international_partners:0 "Uluslararası Ortaklar Ara"
 AUS_seek_international_partners_desc:0 "Havada rekabetçi olmak istiyorsak, çevremizdekilerden bir hava kuvvetini en iyi nasıl yöneteceğimizi öğrenmeliyiz. Büyük güçlerden ve bizimkine benzer mücadeleler yaşamış ülkelerden öğrenerek, eskisinden daha da yükseğe ulaşabiliriz."
 AUS_seek_international_partners_tt:0 "§YKabul eden her ülke için etkiler!§!:"
 AUS_seek_international_partners_tt2:0 "§Y[ROOT.GetNameWithFlag]§!, kabul eden her ülke için 50 §YHava Deneyimi§! kazanacak!"
 AUS_seek_international_partners_tt3:0 "§Y[ROOT.GetNameWithFlag]§!, kabul eden her ülkeye §YPazar Erişimi§! kazanacak!"
 AUS_seek_papal_support:0 "Papalık Desteği Ara"
 AUS_seek_papal_support_desc:0 "Katolik bir ülke olarak, ruhban sınıfının sözüne her zaman büyük değer verdik. Kutsal Babamızdan destek alarak, halkımızın bize olan inancını muhtemelen artırabiliriz."
 AUS_seek_papal_support_tt:0 "Mevcut yönetici partimizin popülaritesindeki değişiklik: §G%5§!"
 AUS_seek_soviet_support:0 "Sovyet Desteği Ara"
 AUS_seek_soviet_support_desc:0 "Eğer hem kuzeydeki [GER.GetAdjective] tehdidine karşı direnecek hem de ülkemizi hak ettikleri komünist topluma dönüştüreceksek, dışarıdan desteğe ihtiyacımız olacak. [SOV.GetNameDef] ile hafif ideolojik farklılıklarımız oldu ama özümüzde hala birçok benzerliği paylaşıyoruz."
 AUS_seek_soviet_support_tt:0 "§RŞimdi [SOV.GetAdjective] desteğine güvenmek, daha sonra onlara saldıramamamıza neden olacaktır!§!"
 AUS_seek_support_from_guarantors:0 "Garantörlerden Destek Ara"
 AUS_seek_support_from_guarantors_desc:0 "Saint-Germain-En-Laye Antlaşması bizim için birçok kısıtlama taşıyor, ancak iyi yanları da var. Saygın bir orduya sahip olmamıza izin verilmediği için, sözde garantörler bizi koruyacaktır. Onlara ulaşmalı ve bu desteği talep etmeliyiz."
 AUS_seek_support_from_guarantors_tt:0 "Bize karşı §GYüksek§! bir görüşleri varsa olumlu yanıt verme olasılıkları daha yüksektir."
 AUS_seek_to_purchase_alaska:0 "[463.GetName]'yı Satın Alma"
 AUS_seek_to_purchase_alaska_desc:0 "1867'de Rusya'dan II. Aleksandr tarafından [463.GetName]'yı satın almamız teklif edildi. O zamanlar devletin bize sunabileceği hiçbir şey olmadığı için teklifi geri çevirdik. Ancak zaman değişti ve [463.GetName]'nin sahibiyle bir anlaşma müzakere etmeye çalışmak için ulaşmayı düşünmeliyiz."
 AUS_seize_galicia:0 "Galiçya Topraklarını Ele Geçir"
 AUS_seize_galicia_desc:0 "Yıllar geçtikçe, eski imparatorluğumuzun bir parçasını çok özlediğimizi fark ettik. Galiçya'nın son yıllarda farklı ülkeler arasında parçalanıp atıldığını görmek, onu bir kez daha ele geçirmemiz gerektiği konusunda bizi daha da kararlı hale getirdi."
 AUS_seize_galicia_tt:0 " §Y[88.GetName]§!,§Y[89.GetName]§! ve §Y[91.GetName]§! üzerinde çekirdek kazanır.\n\n §YGaliçya§!'daki çekirdekleri geri almak için §YSavaş Hedefleri§! kazanır."
 AUS_spanish_intervention:0 "İspanya'ya Müdahale"
 AUS_spanish_intervention_desc:0 "İber yarımadası bir iç savaşın alevleri tarafından yutuldu. Milliyetçiler ve cumhuriyetçiler şiddetli çatışmalarda çarpışırken birçok dış güç müdahale ediyor ve bizim de müdahale etmememiz için hiçbir neden görmüyoruz. Müdahale ederek birliklerimizin modern savaşla daha fazla deneyim kazanmasını ve birliklerimizin bugünün standardına ne kadar dayandığını ölçmesini sağlayabiliriz."
 AUS_spur_the_communist_resistance:0 "Komünist Duyguları Teşvik Et"
 AUS_spur_the_communist_resistance_desc:0 "Çevremizdeki dünya hem sıradan insana hem de işçiye karşı önemli ölçüde daha düşmanca hale geldi. Neyse ki biz en kötüsünden kurtulmuş olsak da, çevremizdeki kardeşlerimizin acılarını ihmal edemeyiz."
 AUS_spur_the_communist_resistance_tt:0 "Şu ülkelerde §YKomünist Duyguları Teşvik Etmek§! için kararlar açar:"
 AUS_stabilize_the_political_climate:0 "Siyasi İklimi İstikrara Kavuştur"
 AUS_stabilize_the_political_climate_desc:0 "Belki de siyasi partilerin yasaklandığı zamandan bir kalıntı olarak, mevcut muhalefetimiz radikal ve aşırıdır. Mevcut yasalara uymalarını sağlamalı ve yasaklanma riski altında olmayacaklarından emin olmalıyız. Bu hoşgörülü duruş, bize daha az radikal takipçilerinden de destek sağlamalıdır."
 AUS_standardized_army_training:0 "Standardize Ordu Eğitimi"
 AUS_standardized_army_training_desc:0 "Yıllarca yeni birlik eğitememek, tümenlerimizin eğitim alayları üzerinde izlerini bıraktı. Ordumuz için mümkün olan en iyi eğitimi sağlamak istiyorsak, yeni birlikler için eğitim prosedürlerini güncellemeyi düşünmeliyiz."
 AUS_steyr_arms_investment:0 "Steyr Arms'a Yatırım Yapma"
 AUS_steyr_arms_investment_desc:0 "Eski amiral gemisi silah üreticimiz, Saint-Germain-En-Laye Antlaşması'na bağlı olmaktan büyük ölçüde zarar gördü. İhtiyacımız olan miktarları üretme yeteneklerini yeniden başlatmak için bir yatırım yapmayı düşünmeliyiz."
 AUS_steyr_arms_investment_tt:0 "Tasarımcı olarak §YSteyr Arms§!'ı açar"
 AUS_streamline_production:0 "Gemi Üretimini Modernleştirme"
 AUS_streamline_production_desc:0 "Büyük gemilerin saldırıları caydırıcı olması ve rakiplerimize ciddi hasar verme yeteneği gibi birçok avantajı vardır. Ancak, aynı zamanda büyük bir dezavantajları da vardır; maliyet, hem zaman hem de malzeme açısından yüksektir. Gemi yapımcılarımızın, üretimi nasıl hızlandırabileceğimize dair fikirleri var."
 AUS_strengthen_legitimistische_corps:0 "Legitimistische Corps'u Güçlendir"
 AUS_strengthen_legitimistische_corps_desc:0 "Legitimistische Corps, ülkemizdeki yüksek öğrenime kayıtlı [AUS.GetAdjective] soyluları için bir öğrenci örgütü olarak başladı. Başlangıçta benzer ilgi alanlarına sahip öğrencilerin bir araya gelmesinden çok daha fazlası değillerdi, ancak siyasi iklim sertleştikçe giderek daha militarist hale geldiler. Konuşlandırma sürelerini hızlandırmak için onlardan asker almayı düşünmeliyiz."
 AUS_strengthen_the_arms_industry:0 "Leopold Gasser Waffenfabrik"
 AUS_strengthen_the_arms_industry_desc:0 "Eski üreticilerimizden bazıları, şimdi çok bariz olan silah ihtiyacımıza rağmen, hala sivil mal üretmeye devam ediyor. Parasal bir teşvikle, Leopold Gasser Waffenfabrik'i işe geri döndürüp çok ihtiyaç duyulan bazı silahları üretmelerini sağlayabilmeliyiz."
 AUS_strengthen_the_cabinet:0 "Kabineyi Güçlendirme"
 AUS_strengthen_the_cabinet_desc:0 "Demokratik duygular [ROOT.GetNameDef] boyunca oldukça hızlı yayılmış olsa da, Kabinemiz hala nispeten zayıf kalmaktadır. Güç elbette halka ve sadece uzantısı olarak Parlamento ve Kabine'ye ait olmalıdır, bununla birlikte, etkili bir şekilde yönetmek için Kabine'ye öncelik verilmelidir."
 AUS_strike_deal_with_italy:0 "[ITA.GetNameDef] ile Bir Anlaşma Yap"
 AUS_strike_deal_with_italy_desc:0 "Büyük Savaş'ın sonunda bizden alındığından beri Kuzey İtalya'daki Trentino ve Alto Adige'ye sahip olma arzumuz vardı. O zamanlar [ITA.GetAdjective]ler, sırf bizi onlardan uzak tutmak için şimdi kendilerine zorlanan bu topraklara sahip olmak istemediklerini ifade ettiler. Biraz diplomatik çabayla, onlarla bu topraklar konusunda bir anlaşma yapabilmeliyiz."
 AUS_sturmscharen_support:0 "Sturmscharen Desteği Al"
 AUS_sturmscharen_support_desc:0 "Sturmscharen, her zaman Sosyal Demokrat Schutzbund ile Milliyetçi Heimwehr arasında bir orta yol olarak hareket etmiştir. Tarihsel olarak rakibimiz Kurt Schuschnigg tarafından yönetilse de, siyasi örtüşme ve geleneksel değerlerimizle Ostmärkische Sturmscharen'in desteğini kazanabileceğimize ve bunun yerine bizim için çalışmalarını sağlayabileceğimize inanıyoruz."
 AUS_subjugate_lands_of_old:0 "Eski Toprakları Boyunduruk Altına Al"
 AUS_subjugate_lands_of_old_desc:0 "Acil sorunla başa çıktıktan sonra, eski sınırlarımıza geri dönmeye başlamalıyız. Diplomatlarımıza tam inancımız olsa da ve eğer gerekirse ordumuza, bu genişlemeyi tüm cephelerde topyekun bir saldırı başlatmak yerine adımlar halinde planlamak akıllıca olacaktır."
 AUS_subjugate_lands_of_old_tt:0 "§YEski Toprakları Boyunduruk Altına Almak§! için kararlar ve §YDiplomatik Boyunduruk Olasılığını Artırmak§! için ayrı kararlar açar."
 AUS_supporting_italy_in_ethiopia_focus:0 "[ITA.GetNameDef]'i [ETH.GetNameDef]'de Destekle"
 AUS_supporting_italy_in_ethiopia_focus_desc:0 "Uzun zamandır [ITA.GetNameDef] bizim tarafımızdaydı. Bağımsızlığımızın garantörlerinden biri olarak, onlarla iyi ilişkiler içinde kalmamız ve [GER.GetAdjective]lerin onları ikna etme girişimlerine kapılmalarına izin vermememiz son derece önemlidir. [ITA.GetAdjective]lere [ETH.GetNameDef]'de yardım ederek, ülkelerimiz arasında güven inşa eder ve ihtiyaç duyulursa yardımımıza gelme şanslarını artırırız."
 AUS_supporting_italy_in_ethiopia_focus_tt:0 "§Yİtalyan-Etiyopya Savaşı'nda [ITA.GetNameDef]'i Desteklemek§! için kararlar açar!"
 AUS_supporting_the_troops:0 "Birlikleri Destekleme"
 AUS_supporting_the_troops_desc:0 "Birliklerimizin savaş alanındaki performansını daha da artırmak için onlara mümkün olduğunca fazla destek sağlamalıyız. Sahra hastaneleri, keşif ve destek topçu silahları olan destek bölükleri bize büyük fayda sağlayacaktır."
 AUS_take_albania:0 "Arnavutluk'u Al"
 AUS_take_albania_desc:0 "[ALB.GetNameDefCap] belki de topraklarımızın en önemli parçası değildi, aslında, öyle yapmak için kesinlikle planlar yapılmış olsa da, hiçbir zaman gerçekten bizim olmadı. Yine de, şimdi Balkanlar'daki varlığımızı bir kez daha ortaya koyarken, onu bir kez daha talep etmememiz için hiçbir neden yok."
 AUS_take_back_galicia:0 "Galiçya'yı Geri Al"
 AUS_take_back_galicia_desc:0 "İmparatorluğumuz bir kez daha büyümeye başlarken, daha büyük ülkelerden bile haklı topraklarımızı geri talep etmekten çekinmemeliyiz. [POL.GetNameDefCap], en azından bizden daha büyük görülebilir, ancak Galiçya hala bize ait olmalı ve eğer onu bize isteyerek vermezlerse, güç kullanmak zorunda kalabiliriz."
 AUS_the_correct_communism:0 "Doğru Komünizm Biçimi"
 AUS_the_correct_communism_desc:0 "Komünizmi uygulamanın birçok yolu var ve çoğu bizim hoşumuza gitmiyor. [SOV.GetNameDefCap], yönettikleri şekilde ideolojimizin adını lekeliyor. Devam etmelerine izin verilemez."
 AUS_the_czechoslovakian_lands:0 "Çekoslovak Toprakları"
 AUS_the_czechoslovakian_lands_desc:0 "Hemen kuzeyimizdeki [CZE.GetNameDef]'deki topraklar, her şey yıkılmadan önce büyük imparatorluğumuzun bir parçasıydı. Bugüne kadar hala bu bölgelerde yaşayan birçok [GER.GetAdjective] konuşan grup var ve buna dayanarak, barışçıl bir şekilde katılmak isteyip istemedikleri onlara kalmış olsa da, bir kez daha yeniden doğan İmparatorluğumuzun bir parçası olmaları sadece doğrudur."
 AUS_the_danubian_federation:0 "Tuna Federasyonu"
 AUS_the_danubian_federation_desc:0 "Avrupa'nın ortasındaki benzersiz konumumuzla, açık toprak kazanımlarına gerek kalmadan çok etkili olma potansiyelimiz var. Ordumuzun gücü kadar önemli olan, sözlerimizin ve diplomatik eylemlerimizin gücüdür. Tuna etrafında bir topluluk oluşturarak, kendi sınırlarımızın çok ötesinde bir diplomatik erişime ve güce sahip olabiliriz."
 AUS_the_evidenzburo:0 "Evidenzbureau"
 AUS_the_evidenzburo_bonus:0 "Evidenzbureau"
 AUS_the_evidenzburo_desc:0 "Diğer özenle hazırlanmış sistemlerimizin birçoğuyla birlikte, Evidenzbureau da Büyük Savaş'ın sonunda dağıtıldı. Artık bu antlaşmaya bağlı olmadığımıza göre, bir istihbarat teşkilatına izin verilmeme gibi bir aptallığa daha fazla uymamız için hiçbir neden yok."
 AUS_the_homeland_front:0 "Vatan Cephesi"
 AUS_the_homeland_front_desc:0 "Üzerimize büyük ölçekli bir istila getirilmesi durumunda, her Avusturyalı Vatan'a karşı görevini yapmalıdır. Askerlerimizi özellikle bu senaryo için, bir vatan savaşı için eğitmeliyiz, böylece gerçekleşirse hazırlıklı olduğumuzdan emin olabiliriz."
 AUS_the_matzen_oil_fields:0 "Matzen Petrol Sahalarını İşlet"
 AUS_the_matzen_oil_fields_desc:0 "Son zamanlarda şansımız yaver gitti. Doğu [AUS.GetNameDef]'deki Matzen çevresindeki sahalarda petrol bulundu. Bu, bu kaynağı çıkarmak ve kendimize endüstriyel olarak bir avantaj sağlamak için bir fırsattır!"
 AUS_the_peoples_army:0 "Halk Ordusu"
 AUS_the_peoples_army_desc:0 "Halkın bu durumda düzgün bir şekilde silahlandırıldığından emin olma konusundaki adanmışlığımızın beklenmedik ama çok hoş bir yan etkisi oldu. Giderek daha fazla insan şimdi orduya katılmak istiyor."
 AUS_the_political_front:0 "Siyasi Cepheyi Koruma"
 AUS_the_political_front_desc:0 "Bir savaş sadece cephe hatlarında ve savaş alanlarında kazanılmaz, aynı zamanda fabrikalarda ve sokaklarda da kazanılır. Siyasi sistemimizi güçlendirerek, en kötüsü olsa bile kontrolün bizde kalacağını güvence altına alabiliriz."
 AUS_the_right_to_rearm:0 "Yeniden Silahlanma Hakkı"
 AUS_the_right_to_rearm_dem_instead_tt:0 "Eğer [ROOT.GetNameDef] §YDemokratik§! bir ülke olsaydı, etki bunun yerine yeniden silahlanma için anlaşma arayacaktı."
 AUS_the_right_to_rearm_dem_tt:0 "§YDemokratik§! bir ülke olarak, yeniden silahlanma için anlaşma ara."
 AUS_the_right_to_rearm_desc:0 "Büyük Savaş'tan beri, daimi ordumuzun boyutunu 30.000'den fazla adamla sınırlamak için Saint-Germain-En-Laye Antlaşması'na bağlı kaldık. Çevremizdeki gelişmelerle, bunun artık sürdürülebilir olmadığına ve yeniden silahlanma hakkına sahip olmamız gerektiğine inanıyoruz."
 AUS_the_right_to_rearm_fed_instead_tt:0 "Eğer [ROOT.GetNameDef] §YTarafsız§! bir ülke olsaydı, etki bunun yerine sonuçları ne olursa olsun yeniden silahlanacaktı."
 AUS_the_right_to_rearm_fed_tt:0 "§YTarafsız§! bir ülke olarak, sonuçları ne olursa olsun yeniden silahlan."
 AUS_the_right_to_self_determination:0 "Kendi Kaderini Tayin Hakkımız"
 AUS_the_right_to_self_determination_desc:0 "Daha önce kendi kaderini tayin hakkına ve onun korunmasına güvendik. Şimdi diğer taraftayız ve şiddetli baskı karşısında hayatta kalma mücadelesi veren ulusların koruyucusu olmalıyız!"
 AUS_the_royals_of_liechtenstein:0 "Lihtenştayn Kraliyet Ailesini Davet Etme"
 AUS_the_royals_of_liechtenstein_desc:0 "Tarihsel olarak Lihtenştayn ile yakın bağlarımız oldu, hatta son prenslerinden biri olan I. Franz Joseph, bir [AUS.GetAdjective] kadınla evlendi. Ferdinand'ın çocuğu olmamasıyla taç, Lihtenştayn'dan Alois veya Johannes tarafından üstlenilecekti, ancak her ikisi de taç üzerindeki iddialarından vazgeçti. İki prens şimdi bize yardımlarını sunuyor, bu tekliften iyi yararlanmalıyız!"
 AUS_the_silesian_question:0 "Silezya Sorunu"
 AUS_the_silesian_question_desc:0 "Silezya toprakları uzun süre geniş imparatorluğumuzun bir parçasıydı. Anavatanımıza bağlı olmasa da, bu devletler hala bizim için çok büyük bir değere sahip. Bu devletleri geri istemeliyiz."
 AUS_tighten_control_of_subjects:0 "Bağlı Devletlerin Kontrolünü Sıkılaştır"
 AUS_tighten_control_of_subjects_desc:0 "Kendimizi eski topraklarımızın bazılarının efendisi olarak kurduk ve bu kesinlikle harika olsa da, burada duramayız. Bu kukla uluslarımız da bizim gibi büyük liderler tarafından yönetilmeyi hak ediyor, neyse ki, tam da o insanları tanıyoruz!"
 AUS_tighten_control_of_subjects_tt:0 "Eğer §YOtto von Habsburg§!, §Y[ROOT.GetNameWithFlag]§!'ın mevcut hükümdarıysa, onları boyunduruk altına aldıktan sonra §Y[HUN.GetNameWithFlag]§!, §Y[CZE.GetNameWithFlag]§! ve §Y[POL.GetNameWithFlag]§!'da §YBir Habsburg Hükümdarı Kurmak§! için kararlar açar."
 AUS_tighten_control_of_subjects_tt2:0 "Onları boyunduruk altına aldıktan sonra §Y[HUN.GetNameWithFlag]§!, §Y[CZE.GetNameWithFlag]§! ve §Y[POL.GetNameWithFlag]§!'da §YBir Habsburg Hükümdarı Kurmak§! için kararlar açar."
 AUS_totalitarian_safety:0 "Totaliter Güvenlik"
 AUS_totalitarian_safety_desc:0 "1933'te Engelbert Dolfuss, [AUS.GetNameDef]'i ulusumuzun güvenliği için mevcut siyasi durumuna getirdi. Parlamentoyu tamamen ortadan kaldırma kararı halkımız arasında tartışmalıydı, ancak güvende kalmamız için gerekli olduğuna inanıyoruz. Dolfuss artık aramızda olmayabilir, ancak kendi güvenliğimiz için bu yolda kalmalıyız."
 AUS_unexpected_alliances:0 "Beklenmedik Müttefikler"
 AUS_unexpected_alliances_desc:0 "İttifakımıza katılmak isteyebilecek tüm Tuna uluslarına karşı zihinlerimizi açık tutmalıyız. Geçmişteki farklılıklarımız ne olursa olsun, onlara ulaşmalı ve Tuna Birliği için yanımızda durmaya davet etmeliyiz."
 AUS_union_of_danubian_socialist_republics:0 "Tuna Sosyalistleri Birliği"
 AUS_union_of_danubian_socialist_republics_desc:0 "Nüfuzumuz şimdi, çevremizdeki işçiler kurtarıldıkça Avrupa'ya yayılıyor. Eski adımız artık gerçekte ne olduğumuzu tanımlamıyor, nasıl bilinmek istediğimizi düşünmeliyiz."
 AUS_universitat_graz:0 "Graz Üniversitesi"
 AUS_universitat_graz_desc:0 "Graz'daki Üniversite bize birçok parlak zihin ve birkaç Nobel Ödülü sahibi getirdi. Üniversite ile daha yakın bir işbirliği, kendi araştırmamızı önemli ölçüde hızlandırabilir."
 AUS_universitat_wien:0 "Viyana Üniversitesi"
 AUS_universitat_wien_desc:0 "Üniversitelerimizin çoğu gibi, Viyana'daki üniversite de faşistlerin yönetimi altında acı çekti. Faşist duygular, çoğunlukla öğrenciler tarafından serbestçe yayıldı. Kuralları sıkılaştırarak ve bunun devam etmemesini sağlayarak, sağlanan eğitimin daha yüksek kalitede olmasını sağlayabiliriz."
 AUS_unlocks_reichstag_raid:0 "§YAkını§! açar:\n§Y[GER.GetNameWithFlag]§!'a Reichstag Bombalama Akını!"
 AUS_via_danube_to_europe:0 "Tuna Yoluyla Avrupa'ya"
 AUS_via_danube_to_europe_desc:0 "Etrafımızda oldukça saygın bir ittifak topladık ve burada durabilsek de, Tuna'nın ötesine de bakabiliriz. Avrupa içinde işbirliği ve topluluğa odaklanmış Avrupa çapında bir ittifak, çok değerli bir girişim olabilir."
 AUS_via_danube_to_europe_tt:0 "§Y$AUS_the_danubian_federation_category$§! kararlarını, daha fazla ülke davet etmeye ve §YSınırlı Federalleşme§! için bastırmaya olanak tanıyan §Y$BEL_closer_european_union_cat$§! kararlarıyla değiştirir!\n\n§RBu, eğer §YTarafsız§! ise, §YOrtak Odak Ağacına§! sahip tüm bağlı devletlere özerkliği düşüren ve bağlı devletlerin tam entegrasyonunu kolaylaştıran bir §YUlusal Ruh§! uygulayan ortak odak §Y''$HABSBURG_an_empire_not_just_in_name$§!''ı§! §Rkilitler§!."
 AUS_volkschule:0 "Volksschule"
 AUS_volkschule_desc:0 "Ekonomik kriz sırasında çocukların okula gitmemesi, bunun yerine çalışması veya evde yardım etmesi yaygındı. En kötü kriz artık geride kaldığına göre, teknolojik ve bilimsel olarak geride kalmamak için bu bilgi borcuyla başa çıkmalıyız. "
 AUS_volunteer_effort_SPA_flag:0 "[SPA.GetFlag]§Y[SPA.GetNameDef]§!'e gönüllü gönderdi!"
 AUS_volunteer_effort_SPR_flag:0 "İspanya'ya Gönüllü Gönderildi"
 AUS_war_against_bolshevism:0 "Bolşevizme Karşı Savaş"
 AUS_war_against_bolshevism_desc:0 "Doğumuzdaki [SOV.GetAdjective] bolşevikleri sürekli olarak başımıza bela oldular. Hazırlıksız yakalanmamak adına, ilk saldıranın biz olduğumuzdan emin olmalıyız."
 AUS_war_against_guarantors:0 "Garantörlere Karşı Savaş"
 AUS_war_against_guarantors_desc:0 "Aşağılık Saint-Germain-En-Laye Antlaşması'ndaki metinler açıktı, eğer bağımsızlığımızı savunmak için yardıma ihtiyacımız olursa, bize bu verilecekti. Bunun bizi kontrol altında tutmak için sadece boş sözler olduğu kanıtlandı. Şimdi yavaş yavaş güce geri dönerken, tatlı intikamımızı alma zamanı geldi. Onlara bir daha asla [ROOT.GetNameDef] ile uğraşmamayı öğreteceğiz!"
 AUS_wien_anti_air_effort:0 "Wiener Flaktürme"
 AUS_wien_anti_air_effort_desc:0 "Hava kuvvetlerimizin bu ulusu hava saldırılarından güvende tutacağına tam güvenimiz olsa da, uçaksavar binaları yoğun nüfuslu sahalarda hoş bir ekstra koruma katmanı sağlayabilir. Viyana sahasında uçaksavar binaları kurmayı düşünmeliyiz."
 AUS_wienfilm_propaganda_effort:0 "Viyana-Film Propagandası"
 AUS_wienfilm_propaganda_effort_desc:0 "Dünyada savaş kızıştığında, kendi ulusumuzu kontrol altında tutmamız zorunludur. Son zamanlarda ülkelerin halklarının moralini yükseltmek için film endüstrilerini kullandıklarını gördük. Kendi Wien-Film'imiz olduğuna göre, aynı şeyi yapmayı düşünmeliyiz."
 AUS_womens_education_initiative:0 "Kadınların Eğitimi Girişimi"
 AUS_womens_education_initiative_desc:0 "1900'lerin başından beri kadınların üniversitelerde eğitim almalarına izin verildi, ancak sadece belirli fakültelerde. Üniversitelerin herkese açık olması için bir girişim, muhtemelen ulusumuza iyi gelecektir."
 BEL_40_hour_workweek:0 "40 Saatlik Çalışma Haftası"
 BEL_40_hour_workweek_desc:0 "Ulusal Çalışma Konferansı'nın bir başka sonucu da 40 saatlik çalışma haftasının radikal bir şekilde getirilmesi olmuştur. Başlangıçta şüpheci olsak da, verimlilikte ve işçi mutluluğunda bir artış gördük."
 BEL_abandon_neutrality:0 "Tarafsızlığı Terk Et"
 BEL_abandon_neutrality_desc:0 "Tarafsızlık çığlıkları zayıfların sözleriydi. Bu dünyada, önemli olan tek diplomasi güçle gösterilir."
 BEL_adriaan_martens_crisis:0 "Adriaan Martens Krizi"
 BEL_adriaan_martens_crisis_desc:0 "Basit bir atama gibi görünen Adriaan Martens'in Kraliyet Tıp Akademisi'ne atanması, o zamandan beri tam teşekküllü bir siyasi krize dönüştü. Bunun nedeni, Martens'in son savaşta bir işbirlikçi olduğu ve açıkça faşist görüşlere sahip olduğu ortaya çıkmasıdır. Bu, Spaak hükümetinin çöküşüne pekala yol açabilir."
 BEL_aid_for_spain:0 "İspanya'ya Yardım"
 BEL_aid_for_spain_desc:0 "İspanyol Cumhuriyetçiler, tehlikeli faşist ve anarşist radikallere karşı demokratik idealleri için savaşıyorlar. Mücadelelerinde onlara sessizce destek sunmalıyız, ancak tarafsızlık görünümümüzü korumaya dikkat etmeliyiz."
 BEL_air_doctrine:0 "Hava Doktrini"
 BEL_air_doctrine_desc:0 "Modern savaş sürekli değişiyor ve gelişiyor. Diğer askeri güçler tarafından kullanılan mevcut doktrinleri incelemek için bir çalışma finanse etmeli ve kendi hava kuvvetlerimize uygulanabilecek ne gibi dersler alınabileceğini görmeliyiz."
 BEL_allied_donations:0 "Müttefik Bağışları"
 BEL_allied_donations_desc:0 "Denizcilik varlığımızı artırma ihtiyacımızla ilgili koşullar daha acil hale geldi, bu yüzden müttefiklerimize ulaşmalı ve denizcilik yeteneklerimizi yeniden geliştirmede bize biraz yardım edip edemeyeceklerini görmeliyiz."
 BEL_anti_corruption_taskforce:0 "Yolsuzlukla Mücadele Görev Gücü"
 BEL_anti_corruption_taskforce_desc:0 "Yolsuzluk devlette çok uzun süredir yaygındı, şimdi tepedeki çürükten kurtulduğumuza göre, geri kalanına baskı yapma zamanı geldi. Vergi mükellefinin sırtından zenginleşenleri ortaya çıkarmak ve atmak için geniş yetkilere sahip özel bir soruşturma görev gücü emredeceğiz."
 BEL_anti_tank_guns:0 "Mükemmel Tanksavar Topları"
 BEL_anti_tank_guns_desc:0 "[ROOT.GetAdjective] metalurjisinin büyük kalitesi, makinistlerimizin en iyi silahları yapmasına olanak sağlamıştır ve gerçek yüksek hızlı canavarlar yaratma yeteneğimizi kullanmalıyız! Hatta bir adım daha ileri gidip bunları sahip olduğumuz herhangi bir tanka da koyabiliriz."
 BEL_anti_tank_guns_tt:0 "§HMükemmel Tanksavar Toplarını§! etkinleştirir\nDestek Tanksavar Sert saldırı: §G+%10§!\nDestek Tanksavar Delme: §G+%10§!\nHat Tanksavar Sert saldırı: §G+%10§!\nHat Tanksavar Delme: §G+%10§!\nMotorize Tanksavar Sert saldırı: §G+%10§!\nMotorize Tanksavar Delme: §G+%10§!\nTank Avcısı Sert saldırı: §G+%10§!\nTank Avcısı Delme: §G+%10§!\n"
 BEL_antwerp_maritime_academy:0 "Anvers Denizcilik Akademisi"
 BEL_antwerp_maritime_academy_desc:0 "Daha çok sivil ve ticari gemiciliğe adanmış olsa da, denizdeki varlığımızı eğitmek ve geliştirmek için buradaki öğretmenlerin uzmanlığından hala yararlanabiliriz. Ticaretimizin akmasını sağlayan ticari gemicilikle en iyi nasıl çalışılacağını subaylarımıza göstermede özellikle faydalı olacaklardır."
 BEL_auto_complete_government_resigns_tt:0 "Bu odak, §YHükümet İstifa Ediyor§! olayının sonucuyla otomatik olarak tamamlanır."
 BEL_auto_complete_royal_intervention_tt:0 "Bu odak, §YKraliyet Ataması§! olayının sonucuyla otomatik olarak tamamlanır."
 BEL_auto_complete_snap_election_tt:0 "Bu odak, §YErken Seçim§! olayının sonucuyla otomatik olarak tamamlanır."
 BEL_aviation_school:0 "Havacılık Okulu"
 BEL_aviation_school_desc:0 "Pilotlarımızın mesleklerini öğrenecekleri bir yere ihtiyaçları var, eğitim tesislerimizi buna göre geliştirmeliyiz."
 BEL_belgian_air_force:0 "[ROOT.GetAdjective] Hava Kuvvetleri"
 BEL_belgian_air_force_desc:0 "[ROOT.GetNameDef], son savaş sırasında kendilerini çok iyi gösteren bir kuvvet geliştirerek, hava gücünü erken benimseyenlerdendi. Ne yazık ki, bütçe kısıtlamaları o zamandan beri yeniliği engelledi. Gerilimler arttıkça, hava caydırıcılığımızın güçlü kalmasını sağlamalıyız."
 BEL_belgian_east_indies:0 "Belçika Doğu Hint Adaları"
 BEL_belgian_east_indies_desc:0 "Hollandalıların yurtdışında, özellikle Doğu Hint Adaları'nda önemli sömürge mülkleri vardı. Kendi imparatorluk hırslarımız hiçbir zaman kaybolmadı ve tacımıza birkaç mücevher daha eklemek için her zaman yer vardır."
 BEL_belgian_gates:0 "Belçika Kapıları"
 BEL_belgian_gates_desc:0 "Cointet-elemanları olarak da bilinen bu büyük demir yapılar, özellikle tank geçişini engellemek için tasarlanmıştır."
 BEL_belgian_maginot:0 "Belçika Majino Hattı"
 BEL_belgian_maginot_available_tt:0 "§Y[ROOT.GetAdjective]§!-§Y[HOL.GetAdjective]§! Sınırında §Y[980.GetName]§!, §Y[6.GetName]§!, §Y[34.GetName]§! veya §Y[977.GetName]§! illerinden birinde en az §Y3 Kara Kalesi§! kontrol eder ve inşa edebilir."
 BEL_belgian_maginot_bypass_tt:0 "§Y[ROOT.GetAdjective]§!-§Y[HOL.GetAdjective]§! Sınırında §Y[980.GetName]§!, §Y[6.GetName]§!, §Y[34.GetName]§! veya §Y[977.GetName]§! illerinden birinde en az §Y3 Kara Kalesi§! kontrol §Retmez§! veya inşa edemez."
 BEL_belgian_maginot_desc:0 "Belçika, iki güçlü, askeri ulus arasında bir tampon devlettir ve tarihi boyunca her ikisi tarafından da tehdit edilmiştir. Bu nedenle, savunma savaşının ustaları haline geldik. Fransız Majino hattı sınırımıza ulaşıyor ve kendi ulusumuzu savunmak için onu uzatmamız gerekiyor. Kendimizi fethedilemez yaparsak, asla saldırıya uğramayız bile."
 BEL_belgian_maginot_tt:0 "§Y[ROOT.GetAdjective]§!-§Y[HOL.GetAdjective]§! Sınırı boyunca §YKara Kaleleri§! ekle"
 BEL_belgian_miracle:0 "Belçika Mucizesi"
 BEL_belgian_miracle_desc:0 "Yirmi yıl önce Belçika'nın harabe halinde olduğunu, birçokları tarafından sadece başka bir Avrupa savaş alanı olarak kabul edildiğini hayal etmek zor. Bunu şimdi olduğumuz durumla karşılaştırın, bir verimlilik ve yenilik feneri. Bu, askerlerimizin cesareti, işçilerimizin azmi ve müttefiklerimizin ve dostlarımızın sadakati sayesindedir."
 BEL_belgian_renaissance:0 "Belçika Rönesansı"
 BEL_belgian_renaissance_desc:0 "Dövüldük, hırpalandık, ama asla kırılmadık. Bu, sadece [ROOT.GetRulingPartyLong]'un istisnai örneği sayesinde mümkün oldu. Bu Belçika rönesansının, başka bir altın çağa giden yolda devam edebilmesi sadece bizim devam eden liderliğimizle mümkün olacaktır."
 BEL_belgian_special_forces:0 "[ROOT.GetAdjective] Özel Kuvvetleri"
 BEL_belgian_special_forces_desc:0 "[ROOT.GetAdjective] askerleri her zaman dirençli ve adanmış olmuştur, ancak Eddy Blondeel kadar yetkin biri tarafından yönetilselerdi neye muktedir olabileceklerini merak etmeliyiz, o zaman bu kuvvetlerin ne kadar özel olabileceğini tahmin edebiliriz."
 BEL_belgian_tank_development:0 "[ROOT.GetAdjective] Tank Geliştirme"
 BEL_belgian_tank_development_desc:0 "Geniş otomobil sanayimize rağmen, zırhlı savaşın gelişimine özel bir ilgi göstermedik. En son askeri gelişmeleri dikkate alarak, kendi tank geliştirme programımıza yatırım yapma zamanımız açıkça geldi."
 BEL_belgica:0 "Belgica"
 BEL_belgica_desc:0 "Belgica, bölgede yaşayan en etkili insan grubu nedeniyle böyle adlandırılan, Roma İmparatorluğu'nun en kuzeydeki topraklarından biriydi. Açıkçası, eğer Romalılar Belçika halkının gücünü belirleyebildiyse, o zaman onların örneğini alıp Romalıların hayal bile edemeyeceği kadar ileri götürmemiz sadece doğrudur."
 BEL_belgica_tt:0 "§Y[BEL.GetName]§!, §YBelgica§! olarak bilinecek!"
 BEL_benelux_union:0 "Benelüks Birliği"
 BEL_benelux_union_desc:0 "Başbakan Spaak, BeNeLüks uluslarını, [BEL.GetNameDef], [HOL.GetNameDef] ve [LUX.GetNameDef]'i tek bir gümrük birliğinde birleştirmeyi, nihai hedef olarak potansiyel bir tam birleşme ile tek bir süper birlik devleti haline getirmeyi önerdi. Bu, gelecekteki bir Avrupa Birliği'ne yönelik bir plan bile olabilir."
 BEL_benelux_union_tt:0 "Eğer Demokratik veya Tarafsız iseler, §Y[HOL.GetNameWithFlag]§! ve §Y[LUX.GetNameWithFlag]§!, §Y$BEL_benelux_union_faction$§!'a davet edilir!"
 BEL_better_than_maginot:0 "Majino'dan Daha İyi"
 BEL_better_than_maginot_desc:0 "Tahkimatlarımız dünya liderliğinden dünya şampiyonluğuna geçmeli. Bir sonraki saldırının nereden geleceğini asla bilemeyiz, bu yüzden her şeye hazırlıklı olmalıyız. Siperlerle desteklenen siperler, sığınakların üzerine sığınaklar inşa etmeliyiz ve en önemlisi. Daha fazla silaha ihtiyacımız var. Çok daha fazla silaha. Büyük olanlardan."
 BEL_boelwerf:0 "Boelwerf"
 BEL_boelwerf_desc:0 "Boelwerf, Anvers'teki en büyük tersanelerden biridir, yeteneklerini kullanmalı ve deniz gücümüzü daha kolay güçlendirebilmemiz için rıhtımlarının genişlemesine daha yoğun yatırım yapmalıyız."
 BEL_british_guarantee:0 "İngiliz Garantisi"
 BEL_british_guarantee_desc:0 "[ENG.GetNameDef] ile iyi ilişkilerimiz hiçbir zaman bir sır olmadı, bu yüzden bu ilişkiyi resmi hale getirelim ve karşılıklı askeri garantiler uzatalım."
 BEL_broken_neutrality:0 "Kırık Tarafsızlık"
 BEL_broken_neutrality_desc:0 "Tarafsızlık ilanımız ulusumuza iyi hizmet etti ve bir güç konumuna gelmemizi sağladı. Artık bu prangalardan kurtulabilir ve [BEL.GetNameDef]'i yeni bir çağa taşıyabiliriz."
 BEL_burgundy_rising:0 "Yükselen Burgonya"
 BEL_burgundy_rising_desc:0 "Flaman gücünün ve nüfuzunun altın çağı, Burgonya Dükalığı'na hakim olduğumuz zamandı. Eğer küresel prestijimizi bir daha restore etmek istiyorsak, atalarımızın askeri ve mali geleneklerini sürdürmeliyiz. Bunu başarmanın ilk adımı elbette bu toprakları geri almak olacaktır."
 BEL_burgundy_tt:0 "§Y[BEL.GetName]§!, §YBurgonya§! olarak bilinecek!"
 BEL_center_for_advanced_military_studies:0 "İleri Askeri Çalışmalar Merkezi"
 BEL_center_for_advanced_military_studies_desc:0 "Askeri güçler büyüdükçe, komuta talepleri de giderek daha katı hale geliyor. Eğrinin önünde kalmalı ve yüksek komutamızı en son stratejik ilkelerle eğitmeli ve lojistik, komuta ve kontrol, birleşik silah entegrasyonu gibi alanlarda yeteneklerini artırmalıyız, muhtemelen müttefik kuvvetleri de göz önünde bulundurarak."
 BEL_center_of_nuclear_chemistry:0 "Nükleer Kimya Merkezi"
 BEL_center_of_nuclear_chemistry_desc:0 "Oppenheimer, Heisenberg ve Bohr'un teorilerini dikkatle takip ettik ve bu bilimin uygulamasını kendimiz için düşünmemiz gerektiğine karar verdik. Sonuçta, Kongo'dan uranyuma kolay erişimi olan az sayıdaki ulustan biriyiz."
 BEL_charles_count_of_flanders:0 "Flandre Kontu Charles"
 BEL_charles_count_of_flanders_desc:0 "Leopold'un tahta geri dönmek için güvenilemeyeceği açıktır, ulusu teslim eder etmez sorumluluğundan feragat etmiştir. Neyse ki, daha genç bir erkek kardeşi var, Flandre Kontu Prens Charles, 'kral' ile ne yapacağımıza resmen karar verene kadar mükemmel bir naip olacaktır."
 BEL_chasseurs_ardennais_ncns_tt:0 "§Y$ranger_battalion$§!:\n§YTepeler§!:\nHareket Etkinliği Değişimi: §G+%10§!\n Saldırı Etkinliği Değişimi: §G+%15§!\n Savunma Etkinliği Değişimi: §G+%15§!\n§YDağ§!:\nHareket Etkinliği Değişimi: §G+%5§!\n Saldırı Etkinliği Değişimi: §G+%5§!"
 BEL_chasseurs_ardennais_tt:0 "§Y$mountaineers$§!:\n§Yorman§!:\n Hareket Etkin Değişikliği: §G+%10§!\n  Saldırı Etkin Değişikliği: §G+%20§!\n  Savunma Etkin Değişikliği: §G+%20§!\n§Ydağ§!:\n Hareket Etkin Değişikliği: §R-%10§!\n  Saldırı Etkin Değişikliği: §R-%20§!"
 BEL_christian_corporatism:0 "Hristiyan Korporatizmi"
 BEL_christian_corporatism_desc:0 "İtalyan Korporatizmini ilgiyle inceliyoruz, hepsi aynı ekonomik hedeflere doğru iten kolektif devlet liderliğindeki işçi örgütleri kavramını. Niyetimiz bu modeli takip etmek, ancak daha benzersiz Belçikalı bir şey yaratmak için Hristiyan etiği ve ideallerini uygulamaktır."
 BEL_civil_service_purge:0 "Memur Tasfiyesi"
 BEL_civil_service_purge_desc:0 "Yolsuzluk lekesi çok uzun süre tedavi edilmedi ve hükümetin tüm rütbelerine iyice sızdı. Radikal hastalıklar radikal tedaviler gerektirir ve bu durumda bu tedavi, yolsuzluk uygulamalarından şüphelendiğimiz herkesin tamamen tasfiyesidir."
 BEL_cockerill:0 "Cockerill"
 BEL_cockerill_desc:0 "Cockerill, [ROOT.GetNameDef]'deki en önde gelen çelik üreticisidir ve motorlardan topçuya kadar her şeyi üretebilen devasa tesislere sahiptir. Tüm bu ürünlere artan taleple, daha da genişlemelerini sağlamak için birinci sınıf bir konumdayız."
 BEL_cockerill_shipyards:0 "Cockerill Tersaneleri"
 BEL_cockerill_shipyards_desc:0 "Daha büyük Cockerill holdinginin bir yan kuruluşu olan Cockerill Tersaneleri, gerçekten üzerine inşa etmemiz gereken türden endüstriyel bağlantılardır. Bu çağın savaş gemileri çelikten yapılır ve kimse çelik işini Cockerill'den daha iyi yapamaz."
 BEL_cockerill_tt:0 "Bir Sanayi Holdingi olarak §Y$BEL_cockerill_industrial$§!'i atama maliyetini §GAzaltır§!"
 BEL_consolidate_resistance_groups:0 "Direniş Gruplarını Birleştir"
 BEL_consolidate_resistance_groups_desc:0 "[BEL.GetNameDef] içinde çok sayıda direniş örgütü var, hepsi kurtuluşumuzu desteklemeye hevesli ama çok sayıda farklı ideoloji, görüş, ideal, çıkar grubu ve destekçi tarafından bölünmüş durumda. Sürgündeki hükümet olarak, hepsini birleşik hedefimize doğru getirmek için merkezi organize edici girişimi sağlama gücümüz var."
 BEL_constitutional_crisis:0 "Anayasa Krizi"
 BEL_constitutional_crisis_desc:0 "Faşizmin ve Leon Degrelle'in açık sözlü bir eleştirmeni olan Hubert Pierlot, Kral'ın ikincisini Başbakan olarak atama kararına sesli olarak karşı çıktı. Parlamentoda destek topladı ve kralın geçici olarak saltanat süremeyeceğini ilan eden ve böylece kraliyet onayı almadan önce atamayı geçersiz kılan bir acil durum yasa tasarısını zorla geçirdi."
 BEL_contradictions_in_socialism:0 "Sosyalizmdeki Çelişkiler"
 BEL_contradictions_in_socialism_desc:0 "Kongo'da sosyalist idealleri genişletme konusundaki son başarılarımız açıkça meyvelerini verdi, çünkü oradaki insanlar her zamankinden daha müreffeh. Bu nedenle, bu \"Sosyalleşme Misyonumuzu\" Afrika çapında genişletmemiz gerektiği bizim için çok açık!"
 BEL_contradictions_in_socialism_tt:0 "Bu odaktan kazanılan taleplere sahip ülkelere karşı §YTalep Edilen Eyaleti Al§! Savaş Hedefleri kazanır."
 BEL_convoy_protection_duties:0 "Savunma Amaçlı Teçhizatlandırılmış Ticaret Gemileri"
 BEL_convoy_protection_duties_desc:0 "Büyük tehlike ve ihtiyaç zamanlarında, ticaret gemilerini silahlandırmak ve kendi korumalarını sağlamak için onlara silahlar ve denizci takviyeleri sağlamak kabul edilebilir hale gelir. Bu şekilde, tüccarlarımızı avlayanlar, aniden avın dişleri olduğunu göreceklerdir."
 BEL_cooperative_cooperation:0 "Kooperatif İşbirliği"
 BEL_cooperative_cooperation_desc:0 "Kooperatifler bir süredir Belçika toplumunun bir parçasıdır ve iş modelleri benimsediğimiz ekonomik idealle çok uyumludur. Zaten kurulmuş olanlarla işbirliği yapmalı ve onların uzmanlıklarını yeni nesil sosyal açıdan bilinçli işletmeleri eğitmek için kullanmalıyız."
 BEL_corporate_social_responsibility:0 "Kurumsal Sosyal Sorumluluk"
 BEL_corporate_social_responsibility_desc:0 "[ROOT.GetNameDef]'in önemli sanayileşmesi ve şehirleşmesine rağmen, şaşırtıcı bir şekilde sendikalar hiçbir zaman beklenebilecek kadar güce sahip olamadı. Bunun nedeni, şirketlerin işçilerine karşı sosyal bir sorumluluğa sahip olma konusunda kültürel bir geleneğin olmasıdır - ancak zaman zaman onlara bunu hatırlatmak zarar vermez."
 BEL_corruption_ns_fake_tt:0 "Günlük Politik Güç Kazancı: §R-%0.25§! \nİstikrar: §R-%20§! \nİnşaat Hızı: §R-%20§! \nGünlük Faşizm Desteği: §G+%0.10§!"
 BEL_corvette_fleet:0 "Korvet Filosu"
 BEL_corvette_fleet_desc:0 "Gemi yapımı uzun zaman alır, özellikle de büyük ana gemiler için. Bunun yerine, donanmamızı genişletme acil ihtiyacı nedeniyle, en çok ihtiyaç duyduğumuz şeye, yani ticari çıkarlarımızı korumaya odaklanarak, küçük, kolay üretilen gemilere odaklanmalıyız."
 BEL_dam_the_consequences:0 "Sonuçlara Baraj Kur"
 BEL_dam_the_consequences_desc:0 "Devasa Gileppe Barajı doğu bölgelerimize su ve güç sağlar, aynı zamanda potansiyel bir düşman yarmasından korkarsak oradaki toprakları sular altında bırakmak için mükemmel bir fırsat sunar."
 BEL_defense_bill:0 "Savunma Tasarısı"
 BEL_defense_bill_desc:0 "Daimi tarafsızlık ilanımız uluslararası sahnede pek iyi karşılanmadı, ancak gerçek şu ki, bu, önemli bir yeniden silahlanma programına yönelik siyasi desteği yoğunlaştırmak için yapılması gerekiyordu."
 BEL_defensive_neutrality:0 "Savunmacı Tarafsızlık"
 BEL_defensive_neutrality_desc:0 "Tarafsız duruşumuzu açıkça belirttiğimize göre, şimdi onu uygulama yolunda çalışmaya başlama zamanı geldi. Kendimizi fethedilmesi çok zor hale getireceğiz, böylece istilayı olanaksız kılacağız."
 BEL_defensive_reorganization:0 "Savunmacı Yeniden Düzenleme"
 BEL_defensive_reorganization_desc:0 "İstilaya hazırlanmak için elimizden geleni yaptık, geriye kalan tek şey, en modern savunma düşüncesi hatları boyunca yönlendirilen daha stratejik ve üst düzey doktrinel değişiklikleri belirlemektir."
 BEL_degrelle:0 "Degrelle"
 BEL_degrelle_desc:0 "Rexist partisinin lideri ve [BEL.GetName]'deki önde gelen faşistlerden biri olan Leon Degrelle, bir süredir mevcut liderliğe karşı ajitasyon yapıyor ve yolsuzluklarını halka başarıyla ifşa ediyordu. Van Zealand hükümeti düştükten sonra, Kral devreye girdi ve Degrelle'i yeni Başbakan olarak atadı."
 BEL_demand_calais:0 "Calais'i Talep Et"
 BEL_demand_calais_desc:0 "Ulusumuzu yeniden birleştirme projemiz neredeyse tamamlanmış olsa da, Flandre'nin kritik bir parçası hala yabancı ellerde; Kales. Bin yıl önce başlangıçta Flandre Kontluğu'nun bir parçasıydı ve bu nedenle şimdi bize restore edilmesi sadece doğrudur."
 BEL_demand_calais_tt:0 "Bunun için seçeneklerimiz, §YCalais'i satın almaya§! çalışmaktan, §YKongo'nun bir kısmını Calais ile takas etmeye§!, bir §Ytalepte§! bulunmaya ve gerekirse §Yonu için savaşmaya§! kadar uzanacaktır."
 BEL_demand_further_gallic_concessions:0 "Daha Fazla Galya Tavizi Talep Et"
 BEL_demand_further_gallic_concessions_desc:0 "Entrika pelerinini atma ve gerçek niyetlerimizin parlamasına izin verme zamanı geldi. Aramızdaki yarıklar hiçbir zaman bir sır olmadı, ama üstünlüğümüzü bir kez ve herkes için göstermeliyiz. Kaderimizi ele geçirme zamanı geldi, ne olursa olsun."
 BEL_demand_further_gallic_concessions_tt:0 "Onları kontrol altına aldıktan sonra §YGalya Talepleri Üzerinde Çekirdek Kazanmak§! için kararlar açar."
 BEL_democratic_homecoming:0 "Demokratik Eve Dönüş"
 BEL_democratic_homecoming_desc:0 "Bize vatanımızı geri kazandıran krallık değil, demokratik kurumlarımız ve vatandaşlarımızın en yeteneklilerini bizi yönetmek için yükseltme süreciydi. Bu ana değerli katkılarını kabul etmeli ve başarılarını gelecek nesiller için kutsal saymalıyız."
 BEL_democratization_of_education:0 "Eğitimin Demokratikleştirilmesi"
 BEL_democratization_of_education_desc:0 "Toplumumuzun birbirine özen gösterme geleneği vardır, bu en iyi şekilde işçilerimiz ve şirketler arasındaki sosyal sözleşme ile somutlaşır. Benzer şekilde, devlet herkese fırsat eşitliği sağlamaya çalışmalı ve iyi bir eğitimin önemini vurgulamalıdır."
 BEL_department_of_ballistic_metrology:0 "Balistik Metroloji Departmanı"
 BEL_department_of_ballistic_metrology_desc:0 "Balistik Metroloji Departmanı, yörüngelerin doğru hesaplanmasına olanak tanıyan ölçüm ve balistik konusunda uzmanlaşmıştır."
 BEL_department_of_telecommunications:0 "Telekomünikasyon Departmanı"
 BEL_department_of_telecommunications_desc:0 "İletişim, askeriye için son derece önemlidir, bu yüzden eğitimi, posta güvercinleri gibi eski, kanıtlanmış olanların yanı sıra radyo gibi yeni teknolojilerin kullanımına yönlendirmeliyiz."
 BEL_develop_belgian_air_industry:0 "Belçika Hava Sanayisini Geliştir"
 BEL_develop_belgian_air_industry_desc:0 "Kendi uçaklarımızı geliştirme konusunda çok fazla deneyimimiz yok, uçak endüstrisi son savaştan bu yana çok az gelişmiş durumda. Sübvanse edip geliştirmelerine yardımcı olabileceğimiz bir dizi çok yenilikçi genç tasarımcı ve yeni kurulan şirket var."
 BEL_develop_home_support:0 "Yurtiçi Desteği Geliştir"
 BEL_develop_home_support_desc:0 "Savaş çabasının çoğu sürgündeki yerimizden koordine edilse de, hala yurtiçinde geniş bir desteğe sahibiz. Bu öncelikle, işgalcileri gereksiz yere kızdırmadan sivil çabaları organize etmede oldukça yetenekli olduklarını kanıtlayan Genel Sekreterlerin çalışmaları sayesindedir."
 BEL_dietsland:0 "Dietsland"
 BEL_dietsland_desc:0 "Avrupa'daki Hollandaca konuşan toprakların geri kalanını güvence altına alma çabalarımız başarılı oldu, ancak görünüşe göre tüm kardeşlerimiz bu yeni geleceğe beklediğimiz kadar iyi adapte olamadı. Onlara paylaştığımız kültürü ve dili hatırlatmalıyız."
 BEL_dietsland_tt:0 "§Y[BEL.GetName]§!, §YDietsland§! olarak bilinecek!"
 BEL_diplomatic_rapprochment:0 "Diplomatik Yakınlaşma"
 BEL_diplomatic_rapprochment_desc:0 "Tarafsızlık ifademiz zamanın siyasi ve diplomatik gerçekleri için gerekliydi, ancak bu şimdi değişti. Diğer uluslardaki dostlarımızla konuşmayı hiç bırakmadık, ama şimdi bu konuda daha açık ve halka açık olmalıyız."
 BEL_dissolve_political_parties:0 "Siyasi Partileri Feshet"
 BEL_dissolve_political_parties_desc:0 "Demokrasinin zayıflığı, yolsuzluk ve açgözlülük için bir üreme havuzundan başka bir şey olmadığı apaçık ortadadır. Halkın seçimlere ihtiyacı yoktur, yönetilmeye ihtiyaçları vardır ve bunu yapabilecek tek kişi [ROOT.GetRulingPartyLong]'dur."
 BEL_doctrinal_innovations:0 "Doktrinel Yenilikler"
 BEL_doctrinal_innovations_desc:0 "Doktrinler bir orduyu yönlendirmeye ve herkesin aynı ritimde yürümesini sağlamaya yardımcı olabilir, ancak bazen gerçekten ilerlemek için kutunun dışında düşünmeniz gerekir. Bunun ötesine geçmek, kutuyu parçalamak, kalıbı kırmak ve kendi işimizi yapmak istiyoruz. Düşmanlarımız bunu asla göremeyecek."
 BEL_dyle_plan:0 "Dyle Planı"
 BEL_dyle_plan_desc:0 "Tüm kamuoyu tarafsızlık ve askeri müdahalesizlik ilanlarımıza rağmen, kapalı kapılar ardında stratejik ortaklarımızla çalışmaya ve istila durumunda planlar ve olasılıklar hazırlamaya devam ediyoruz. Genel fikir, seferi kuvvetler savunmamızı güçlendirmek için gelene kadar Dyle nehri arkasında olabildiğince uzun süre dayanmaktır."
 BEL_dyle_plan_tt:0 "Savaş çıkması durumunda, §Y[ENG.GetNameWithFlag]§! ve §Y[FRA.GetNameWithFlag]§! yardımımıza gelme olasılığı daha yüksek olacaktır!"
 BEL_early_helicopters:0 "İlkel Helikopterler"
 BEL_early_helicopters_desc:0 "Nicolas Florine, Rus İç Savaşı'nın ardından [ROOT.GetNameDef]'e göç etmeyi seçti ve hızlı dönen rotorlar kullanan radikal yeni bir uçuş biçimine ilgi gösterdi. Bu gelişmeyi finanse etmeli ve bu yeni havacılık bilim alanının bizi nereye götüreceğini görmeliyiz!"
 BEL_eben_emael_fortress:0 "Eben Emael Kalesi"
 BEL_eben_emael_fortress_available_tt:0 "§YLiège§!'de en az 2 §Y$bunker$§! inşa edilebilir!"
 BEL_eben_emael_fortress_bypass_tt:0 "§YLiège§!'de en az 2 §Y$bunker$§! inşa edilemez!"
 BEL_eben_emael_fortress_desc:0 "Hattımızdaki en büyük ve en görkemli tahkimat olan, Albert Kanalı'na bakan yüksek bir noktada konumlanmış olan Eben Emael, çevredeki herhangi bir kuvvet için savunma hazırlık alanı ve topçu desteği sağlayacak ve sınırlarımızı ihlal edecek herkese karşı aşılmaz bir engel olduğunu kanıtlayacaktır."
 BEL_economic_recovery:0 "Ekonomik Toparlanma"
 BEL_economic_recovery_desc:0 "Hükümetimizin çalışmaları, karşılaştığı sayısız engele rağmen, büyümeye ve ekonomimizin hızlı bir şekilde toparlanmasına yol açtı, ancak bununla bile, bunun bile yeterli olmadığına dair söylentiler zaten var."
 BEL_eddy_blondeel_tt:0 "§YEddy Blondeel§!, bir §YGeneral§! olur!"
 BEL_embrace_export_economy:0 "İhracat Ekonomisini Benimse"
 BEL_embrace_export_economy_desc:0 "Kuzey komşumuz kadar ünlü olmasa da, [ROOT.GetNameDef], Anvers şehrinden merkezlenen ticaret için gururlu bir geleneğe sahiptir. Bu kar potansiyelinden daha fazla yararlanalım - sonuçta bu sadece iyi bir iştir."
 BEL_engine_of_the_economy:0 "Ekonominin Motoru"
 BEL_engine_of_the_economy_desc:0 "Trenler [ROOT.GetAdjective] kalbinde özel bir yere sahiptir, yeni yenilikleri ateşler, üretimi rayında tutar ve daha fazla büyümenin yakıtıdır. Ancak her şeyden önce, onlar ekonominin motorudur."
 BEL_european_community:0 "Avrupa Topluluğu"
 BEL_european_community_desc:0 "Avrupa Projesinin ilk günleri iyi geçti, bu yüzden üyeliğimizin genişletilmesini ve topluluğumuzun geleceğini yönetecek bir dizi antlaşmanın onaylanmasını düşünmeliyiz. Hatta, Belçika'nın kalbinde lider bir rol üstlendiği daha federal bir modele doğru ilerlemeyi bile düşünebiliriz."
 BEL_european_community_tt:0 "§Y$BEL_closer_european_union_cat$§!'ı takip etmek için kararlar açar!"
 BEL_european_crusade_no_focus_tt:0 "§YRexistler§!, Askere Alınabilir Nüfus Faktöründen faydalanacak \nEğer §YVNV§!"
 BEL_expand_the_belgian_legion:0 "Belçika Lejyonunu Genişlet"
 BEL_expand_the_belgian_legion_desc:0 "Giderek daha fazlası kralın sancağına akın ediyor, tacın hizmetinde her şeylerini vermeye hazır. Sadece sözü vermemiz yeterli, onlar da emrettiğimiz yere yürüyecekler."
 BEL_expand_the_belgian_legion_tt:0 "Sürgün ev sahibinin anavatanındaki rastgele bir eyalette 3 §YDivision d'Infanterie§! ortaya çıkacak."
 BEL_expedite_fort_construction:0 "Kale İnşaatını Hızlandır"
 BEL_expedite_fort_construction_desc:0 "Bu tehlikeli bir dünya, düşman güçler tarafından kuşatılmış. Hazır olduğumuzdan emin olmalı ve ihtiyaç duyulmadan önce hazırlıklarımızı yerinde bulundurmak için tahkimat ve mühendislik sektörlerimize daha yoğun yatırım yapmalıyız."
 BEL_expression_of_belgian_unity:0 "Belçika Birliğinin İfadesi"
 BEL_expression_of_belgian_unity_desc:0 "[BEL.GetAdjective] kimliğini oluşturan kültürler bizim en büyük gücümüzdür, çünkü gerçek anlayışı farklı ideallerden, bakış açılarından ve gerçekten de dillerden bulabiliriz. Bizi ayıran şey, bizi birleştirir."
 BEL_flanders_ascendant:0 "Yükselen Flandre"
 BEL_flanders_ascendant_desc:0 "Flaman geleneklerine ve tarihine olan gurur yükselişte olduğuna göre, bu yeni yeniden alevlenen milliyetçi duygudan yararlanma ve ulusumuzu kaderine, yani Hollanda ile birleşmeye yönlendirme zamanı geldi."
 BEL_flooded_tank_barriers:0 "Sular Altındaki Tank Bariyerleri"
 BEL_flooded_tank_barriers_desc:0 "Tankların gelecekteki savaşlarda hayati bir rol oynayacağına inanıyoruz ve savunmamız bunu yansıtmalıdır. Belçika Kapıları hazırlayabilir ve etkinliklerini ikiye katlamak için onları suya batırabiliriz."
 BEL_fn_herstal:0 "FN Herstal"
 BEL_fn_herstal_desc:0 "[ROOT.GetNameDefCap], dünya çapında tanınan bir silah endüstrisiyle kutsanmıştır, Fabrique Nationale de Herstal veya FN Herstal en belirgin olanıdır. Bu silah üreticisi, işin en iyileri tarafından tasarlanan olağanüstü kalitede silahlar üretmektedir. Browning Arms Company ile yakın bir işbirliği, şirketlerimizin keyif aldığı gerçek küresel erişimi daha da güçlendirir."
 BEL_fonderie_royale_de_canons_liege:0 "Fonderie Royale de Canons Liege"
 BEL_fonderie_royale_de_canons_liege_desc:0 "1803'te, Liege Fransa'nın bir parçasıyken Napolyon Bonapart tarafından kurulan Liege'deki kraliyet top dökümhanesi, Belçika'daki ağır silahların başlıca geliştiricisi olmuştur. Bölgedeki metal işçiliğinin kalitesinden büyük ölçüde yararlanan yüksek kalibreli silahlar bir üne sahiptir ve bu tesisler yeteneklerimizi daha da genişletmek için daha fazla yatırım istiyor."
 BEL_foreign_plane_purchases:0 "Yabancı Uçak Alımları"
 BEL_foreign_plane_purchases_desc:0 "Ne yazık ki, [ROOT.GetAdjective] havacılık endüstrisinin durumu nedeniyle, uçak alımları için yurtdışına bakmak zorunda kalıyoruz. Bir yarışma ilan edelim ve diğer ulusların sözleşmeler için teklif vermesini sağlayalım."
 BEL_fortify_liege:0 "Liège'i Tahkim Et"
 BEL_fortify_liege_available_tt:0 "§Y[34.GetName]§!'de, Meuse nehrine sınırı olan en az bir ilde 1 §Y$bunker$§! inşa etmek için yer var!"
 BEL_fortify_liege_bypass_tt:0 "§Y[34.GetName]§!'de, Meuse nehrine sınırı olan hiçbir ilde 1 §Y$bunker$§! inşa etmek için yer yok!"
 BEL_fortify_liege_desc:0 "Birinci Dünya Savaşı sırasında, Liège'in müstahkem konumu, Alman kuvvetlerini durdurmada önemli bir rol oynadı ve başarılı bir savunma yapılmasına olanak sağladı. Buna rağmen, kalelerin tasarımında ciddi eksiklikler vurgulandı. Derslerimizi aldık ve şimdi tahkimatları tekrar yükseltme zamanı geldi."
 BEL_fortify_liege_tt:0 "§Y[34.GetName]§!'de Meuse nehri boyunca yer olan illerde 1. seviye §Y$bunker$§! inşa eder"
 BEL_free_belgian_forces:0 "Özgür Belçika Kuvvetleri"
 BEL_free_belgian_forces_desc:0 "Yurtdışındaki varlığımız artık işgalcilerimize karşı uygun askeri eylemlere başlayacak kadar büyüdü. Savaş hemen Belçika için olmasa bile, en azından sonunda düşmanlarımıza savaşı getirebilir ve [BEL.GetAdjective] kanı ve çeliğiyle savaş çabasına daha doğrudan katkıda bulunabiliriz."
 BEL_free_belgian_forces_tt:0 "Sürgün ev sahibinin anavatanındaki rastgele bir eyalette 2 §YDivision d'Infanterie§! ortaya çıkacak."
 BEL_german_non_aggression:0 "Alman Saldırmazlık Paktı"
 BEL_german_non_aggression_desc:0 "[GER.GetName], tarafsızlık ilanımızı alkışladı ve bu duruşu pekiştirmek ve sınırlarının güvenliğini sağlamak için karşılıklı bir saldırmazlık paktına olan ilgilerini kamuoyuna açıkladı."
 BEL_gold_reserves:0 "Altın Rezervleri"
 BEL_gold_reserves_desc:0 "Neyse ki [ROOT.GetAdjective] devleti hatırı sayılır bir altın rezervine sahip. Şu anda bu, ülkemiz içinde borçlanma ve borç verme için istikrarlı bir temel sağlıyor, ancak altınımızı satarak kalkınmayı ve inşaatı geçici olarak artırmayı da seçebiliriz."
 BEL_government_in_exile:0 "Sürgündeki Hükümet"
 BEL_government_in_exile_desc:0 "Hayatta kalan [BEL.GetAdjective] siyasi seçkinleri artık ev sahibi başkentlerine ulaştı; bunların arasında Hubert Pierlot, Paul-Henri Spaak, Camille Gutt ve Albert van Vleshauwer gibi bir dizi kilit bakan da var. Birlikte \"Dörtlü Hükümet\"i kurdular ve savaşı zaferle sonuçlanıncaya kadar sürdürmeye söz verdiler."
 BEL_government_in_exile_tt:0 "[ROOT.GetName]'nin meşruiyetini ve direnişini güçlendirmek için §Y$BEL_government_in_exile_cat$§!'ı açar."
 BEL_government_of_national_unity:0 "Ulusal Birlik Hükümeti"
 BEL_government_of_national_unity_desc:0 "Faşist hareketten artan muhalefete rağmen, liberal, sosyalist ve Katolik demokratik partiler bir kez daha Paul van Zeeland altında birleşerek yeni bir Ulusal Birlik Hükümeti kurdu."
 BEL_government_resigns:0 "Hükümet İstifa Ediyor"
 BEL_government_resigns_complete_national_unity_tt:0 "§RHükümet İstifa Ediyor olayında Ulusal Birlik Hükümetini seçmek bu odağı tamamlayacaktır.§!"
 BEL_government_resigns_complete_vandervelde_tt:0 "§RHükümet İstifa Ediyor olayında Vandervelde Azınlığını seçmek bu odağı tamamlayacaktır.§!"
 BEL_government_resigns_desc:0 "Faşist Rexist örgütünün yaygın yolsuzluk iddiaları nedeniyle hükümet üzerindeki baskı artarak hükümetin düşmesine ve yeni bir seçim için hazırlıkların başlamasına yol açtı."
 BEL_growing_threat_of_fascism:0 "Büyüyen Faşizm Tehdidi"
 BEL_growing_threat_of_fascism_desc:0 "Avrupa ve hatta dünya genelinde radikal faşist desteğin yükselişi çok endişe verici bir eğilim haline geldi ve yayılmasını önlemek için yapmamız gerekeni yapmaya hazırlıklı olmalıyız. Bu tür eylemler önleyici olmak zorunda kalsa bile."
 BEL_increased_length_of_service:0 "Hizmet Süresinin Artırılması"
 BEL_increased_length_of_service_desc:0 "Dünya genelinde gerilimler artarken ve askeri devler arasındaki stratejik konumumuzla, kendimizi savunma isteğimizi göstermeli ve toprak bütünlüğümüzü sağlamalıyız. Bu nedenle, yedeklerimizi yüksek alarma geçirecek ve şu anda hizmet verenlerin hizmet süresini artıracağız."
 BEL_independent_neutral_and_loyal:0 "Bağımsız, Tarafsız ve Sadık"
 BEL_independent_neutral_and_loyal_desc:0 "Son savaşta müttefiklerimize güvendik ve bunun sonucunda ülkemiz savaş alanına dönüştü. Bu nedenle, savaşı [BEL.GetNameDef]'den uzak tutmak amacıyla hükümdarımız bizi \"Bağımsız, Tarafsız ve Sadık\" ilan etti. \n \n Bu, kendi savunmalarımızı ele alma ihtiyacı konusunda siyasi sınıfları bir araya getirecek ve böylece kendi askeri caydırıcılığımızı geliştirecektir."
 BEL_international_socialist_bureau:0 "Uluslararası Sosyalist Büro"
 BEL_international_socialist_bureau_desc:0 "İkinci Enternasyonal'in Brüksel'de daimi bir sekreterliği vardı ve bu örgüt 1916'da dağılmış olsa da, sosyalist mücadele devam ediyor. Uluslararası sahnede yeniden yerimizi aldığımıza göre, kurumu yeniden kurmalı ve Sosyalist Enternasyonal içinde tekrar bir liderlik rolü üstlenmeliyiz."
 BEL_international_stipend:0 "Uluslararası Maaş"
 BEL_international_stipend_desc:0 "Kendi işlerinde devam eden tarafsızlığımızı satın almak için diğer faşist uluslardan bir maaş teklif edildi. Eğer müdahale etmemenin bedeli buysa, o zaman bu kabul edebileceğimiz bir bedeldir. Sonuçta, bir bitiş tarihi girmeyi unutmuş gibi görünüyorlar."
 BEL_interpreters:0 "Tercümanlar"
 BEL_interpreters_desc:0 "Silahlı kuvvetlerimizin aşması gereken en büyük engellerden biri, subay kadrosunun Flaman ve Valon askerlerini komuta edebilmek için doğal olarak iki dilli olması gerekliliğiydi. Şimdi, komşu topraklarımızda dil engeli olmadan neredeyse cezasız bir şekilde faaliyet gösterebildiğimiz için en büyük güçlerimizden biri olabilir."
 BEL_interpreters_tt:0 "Bu §YUlusal Ruh§! hem mevcut ittifak üyelerine hem de gelecekteki ittifak üyelerine eklenecektir."
 BEL_investigate_bribery_charges:0 "Rüşvet Suçlamalarını Soruştur"
 BEL_investigate_bribery_charges_desc:0 "Yolsuzluk iddiaları hükümeti hiç terk etmedi ve bir soruşturma çağrıları yoğunlaştı. Faşist Rexist lideri Leon Degrelle, hatta Paul van Zeeland'ı rüşvet almakla suçlayarak doğrudan ima etti."
 BEL_investigate_pm_tt:0 "Başbakan'ın kendisine yönelik iddialar da daha kapsamlı bir şekilde soruşturulacaktır."
 BEL_invite_german_tank_organization:0 "[GER.GetAdjective] Tank Geliştiricilerini Davet Et"
 BEL_invite_german_tank_organization_desc:0 "Önceki zırhlı bağlantılarımızın çoğu artık bize kapalı olduğu için, halka Panzer getirmek için çalışacak yeni ortaklar aramalıyız."
 BEL_invite_soviet_tank_makers:0 "[SOV.GetAdjective] Tank Üreticilerini Davet Et"
 BEL_invite_soviet_tank_makers_desc:0 "Daha önce zırhlı birimler için her zaman müttefiklerimize güvendik ve dostlarımız değişmiş olsa da bu politika değişmedi. Sovyetler Birliği ile dostane ilişkilerimiz sayesinde, onları bazı bilgilerle bizi desteklemeye ikna edebiliriz."
 BEL_iron_wall:0 "Demir Duvar"
 BEL_iron_wall_desc:0 "Belçika Kapılarımızın testlerde düşman manevralarına önemli bir engel olduğu kanıtlandı, bu yüzden bizi istila edecek olanları durdurmak için onları ulusumuz boyunca toplu olarak konuşlandırmalıyız."
 BEL_join_allies:0 "Müttefiklere Katıl"
 BEL_join_allies_desc:0 "Büyük Savaş bizi daha önce müttefik olarak bir araya getirdi ve birlikte istila testine dayandık. Bize zarar verecek herkese karşı tekrar birlikte duracağız."
 BEL_join_axis:0 "Mihver'e Katıl"
 BEL_join_axis_desc:0 "Çok uzun süredir izole edildik, Cermen kardeşlerimizle birleşme ve karşılıklı hırslarımızı korumak ve genişletmek için aramızda bir ittifak kurma zamanı geldi."
 BEL_join_comintern:0 "Komintern'e Katıl"
 BEL_join_comintern_desc:0 "Komintern'in sosyalist yolu savunanlara yardım etme tarihi vardır ve işçilerimizin filizlenen kurtuluşunu boğmak isteyenler tarafından her taraftan kuşatılmışken, yeni dostlar için doğuya bakmalıyız."
 BEL_junior_officer_training:0 "Astsubay Eğitimi"
 BEL_junior_officer_training_desc:0 "İyi bir subay, askerlerini zorluklara karşı savaşmaya teşvik eder, ancak umutsuz bir duruma karşı kör olabilir. İyi bir lider, durumun kasvetli olduğunu doğru bir şekilde belirler, ancak elinden gelenin en iyisini yapar. Harika bir lider, kendilerini o durumdan çıkarmak ve daha iyi bir konumdan tekrar saldırmak için hazır bir plana sahip olacaktır. Subaylarımızı olabileceklerinin en iyisi olacak şekilde belirleyip eğiteceğiz."
 BEL_king_law_freedom:0 "Kral, Yasa, Özgürlük"
 BEL_king_law_freedom_desc:0 "İyi bir Belçikalı, Kral, Yasa ve Özgürlük için savaşır. Kralın herkesten önce geldiğini, kralımız olarak III. Leopold'un da öyle olması gerektiğini unutmamalıyız. Çünkü onun yasalarını koruyoruz ve onun özgürlüğü için savaşıyoruz."
 BEL_king_of_the_belgians:0 "Belçikalıların Kralı"
 BEL_king_of_the_belgians_desc:0 "'Belçika halkının Anayasasına ve yasalarına uymaya, ulusal bağımsızlığı ve toprak bütünlüğünü korumaya yemin ederim' bunlar bir adamın kral olmasını sağlayan, üç dilde, Fransızca, Hollandaca ve Almanca söylenen sözlerdir."
 BEL_kings_abdication:0 "Kralın Tahttan Çekilmesi"
 BEL_kings_abdication_desc:0 "Parlamento ile hükümdar arasındaki ilişkilerin kamuoyunda bozulmasının ardından, Kral Leopold'e tahttan çekilmesi için baskı yapıldı. Umut, barışçıl bir şekilde gitmesidir."
 BEL_kings_abdication_tt:0 "§GKral Leopold gittiğinde, Belçika istilaya karşı çok daha dirençli olacaktır.§!"
 BEL_koningshooikt_wavre_line:0 "Koningshooikt-Wavre Hattı"
 BEL_koningshooikt_wavre_line_desc:0 "Kısaca KW Hattı olarak bilinen Koningshooikt–Wavre Hattı, Koningshooikt ve Wavre arasındaki ikinci bir savunma hattıdır. Bu mevziler, garnizonlar yerine bizim ve müttefik kuvvetlerin işgali için özel olarak hazırlanmıştır ve siperler, makineli tüfek yuvaları ve Belçika kapılarından oluşur. Bu çok sağlam bir savunma hattıdır ve bizim için birincil direniş noktasını sağlamalıdır."
 BEL_la_belgique_et_le_congo:0 "La Belgique et le Congo"
 BEL_la_belgique_et_le_congo_desc:0 "Belçika'nın Kongo'daki rolü uzun zamandır sömürü ve zulüm olmuştur, oysa eşitliği ve fırsatı teşvik etmesi gerekirdi. Sosyalist ideallere yönelik yenilenen iç vurgumuzla, sömürgeci kardeşlerimizi bu felsefede eğitme ve onların sosyalist geleceğine yatırım yapmaya başlama zamanı geldi."
 BEL_la_dame_blanche:0 "La Dame Blanche"
 BEL_la_dame_blanche_desc:0 "Dame Blanche veya Beyaz Hanım, Büyük Savaş sırasında yeraltı direniş örgütüydü. O zamanki hareketin lideri olan Walthère Dewé, Belçika'nın tekrar işgal edilmesine sessizce hazırlanıyordu ve şimdi bu örgütün yeteneklerini ikinci kez serbest bırakma zamanı geldi."
 BEL_lambert_chardome_tt:0 "§YLambert Chardome§!, bir §YGeneral§! olur!"
 BEL_legacy_of_the_belgian_airforce:0 "Belçika Hava Kuvvetleri'nin Mirası"
 BEL_legacy_of_the_belgian_airforce_desc:0 "Pilotlarımız, Büyük Savaş'ın savaş alanlarının üzerinde savaşanların en cesurları arasında kabul ediliyordu ve bu gururlu gelenek bugün hala sürdürülmektedir."
 BEL_legacy_of_the_great_war:0 "Büyük Savaş'ın Mirası"
 BEL_legacy_of_the_great_war_desc:0 "“Büyük” savaşın dehşetinden bu yana uzun bir yol kat ettik ve yaralarımız henüz tam olarak iyileşmemiş olsa da, yara izlerimizi gururla taşıyoruz. İstilacıya bir kez direndik, tekrar direnebiliriz, hayır, direneceğiz."
 BEL_legacy_of_the_soldier_king:0 "Asker Kral'ın Mirası"
 BEL_legacy_of_the_soldier_king_desc:0 "Kral Albert, Asker Kral, savaş kahramanı ve Belçika'nın kurtarıcısı. Bu büyük adamdan öğrenecek çok şeyimiz var ve onun örneği, silahlı kuvvetlerimizdeki herkesin, hayır, ulusumuzdaki herkesin öğrenebileceği bir örnektir. Sonuna kadar her istilacıya direneceğiz ve savaşacağız."
 BEL_legacy_of_the_soldier_king_tt:0 "§YKral Leopold§!, istila edilirse artık askeri baskıya boyun eğmeyecek ve ülkeyi teslim etmeyecektir."
 BEL_leopolds_return:0 "Leopold'un Dönüşü"
 BEL_leopolds_return_desc:0 "Kral III. Leopold, [BEL.GetNameDef]'in meşru hükümdarıdır ve Belçika bize restore edildiğine göre şimdi tahtına geri dönmelidir."
 BEL_liberal_victory:0 "Liberal Zafer"
 BEL_liberal_victory_desc:0 "Ekonomik olarak liberal olan Katolik Parti, son seçimde birinci oldu ve Hubert Pierlot, [BEL.GetName]'i sonuna kadar savunacağına ve Belçika halkını koruyacağına söz vererek yönetecek."
 BEL_lucien_lippert_tt:0 "§YLucien Lippert§!, bir §YGeneral§! olur!"
 BEL_maritime_phoenix:0 "Deniz Anka Kuşu"
 BEL_maritime_phoenix_desc:0 "Hiçbir şeyden, filomuz çiçek açtı. Tersanelerimiz, yeni gemiler kızaklardan artan bir oranda ayrılırken sanayinin ateşleriyle aydınlanıyor ve yurtdışındaki stratejik çıkarlarımız [ROOT.GetAdjective] sancağını taşıyan filolarımız tarafından karşılanıyor."
 BEL_military_service_for_all_in_exile:0 "Sürgündeki Herkes İçin Askerlik Hizmeti"
 BEL_military_service_for_all_in_exile_desc:0 "Dünyanın her yerinde yaşayan çok sayıda [BEL.GetAdjective] var. Vatanımızı kurtarmak amacıyla hepsinin derhal hizmete alınması gerektiğine karar vermeliyiz. Vatanseverlik coşkusu yüksek ve büyük bir destek akını bekleyebiliriz."
 BEL_minerva_imperia:0 "Minerva-Imperia"
 BEL_minerva_imperia_desc:0 "Belçika, Birinci Dünya Savaşı'nda zırhlı araba kullanımında sadece lider bir oyuncu olmakla kalmadı, aynı zamanda savaş arası yıllar boyunca otomobil endüstrisinde de birinci sınıf bir yer edindi. En büyük iki üreticimiz olan Minerva ve Imperia yakın zamanda birleşti ve birleşik faydamız için onların lider konumundan yararlanmazsak gerçekten yazık olur."
 BEL_mobilize_the_nation:0 "Ulusu Seferber Et"
 BEL_mobilize_the_nation_desc:0 "Hazırlamamız gereken tek şey tahkimatlar değil, aynı zamanda nüfusun kendisi de en büyük varlığımız olabilir. Son savaş sırasında istilacılara karşı yiğitçe mücadele ettiler, aynı tutkuyu dizginleyelim ve halkımızı savunmaya toplayalım."
 BEL_modernized_army:0 "Modernize Ordu"
 BEL_modernized_army_desc:0 "Savaşta kazananlar ve kaybedenler arasındaki fark genellikle deneyimlerinden en iyi dersleri kimin öğrendiğidir. Kazandığımız ve kaybettiğimiz her şeyi yansıtma ve ardından orduyu yeni, modern standartlara getirmek için yeniden düzenleme zamanımız geldi."
 BEL_moi_dabord:0 "Moi d'abord"
 BEL_moi_dabord_desc:0 "Moi d'abord! Önce ben! Düşman büyükelçisi savaş ilanıyla geldiğinde Spaak'ın ünlü çığlığı. Savaşın patlak vermesinden zaten öfkeli olan Spaak, savaş ilanı teslim edilmeden önce sürpriz saldırının uluslararası kayıtlara geçmesini istedi. Bu o zamandan beri sürgündeki hükümet destekçileri için bir toplanma çığlığı haline geldi."
 BEL_monetary_reconstruction:0 "Parasal Yeniden Yapılanma"
 BEL_monetary_reconstruction_desc:0 "Birinci Dünya Savaşı'nın ardından Belçika ekonomisi harabeye döndü. Yeniden yapılanmayı kolaylaştırmak ve devasa borçlarını ödemek amacıyla Belçika maliye bakanlığı para basmaya başladı. Çok para. O zamanlar bu yardımcı olsa da, hiperenflasyon riski altındayız ve diğer reformlar gerçekleşmeden önce bunu kontrol altına almalıyız."
 BEL_multi_language_courses:0 "Çok Dilli Kurslar"
 BEL_multi_language_courses_desc:0 "Askeriyemizin karşılaştığı en büyük sorunlardan biri, nüfusumuzun çift dilli doğasıdır. Bunu bir avantaja çevirelim! Subaylarımıza hem Fransızca hem de Hollandaca öğretebilir ve iki dilli bir subay kadrosunun faydalarından yararlanabiliriz."
 BEL_national_redoubt_at_antwerp:0 "Anvers'teki Ulusal Sığınak"
 BEL_national_redoubt_at_antwerp_available_tt:0 "Aşağıdakilerden biri doğru olmalıdır:\n Brüksel şehrinde 1 §Y$bunker$§! inşa edilebilir\n Anvers şehrinde 2 §Y$bunker$§! inşa edilebilir"
 BEL_national_redoubt_at_antwerp_bypass_tt:0 "Aşağıdakilerin tümü doğru olmalıdır:\n Brüksel şehrinde 1 §Y$bunker$§! inşa EDİLEMEZ\n Anvers şehrinde 2 §Y$bunker$§! inşa EDİLEMEZ"
 BEL_national_redoubt_at_antwerp_desc:0 "Savunmamızın tarihi temel taşı her zaman Anvers olmuştur. Oradaki tahkimatları yükseltecek ve ülkenin geri kalanını güçlendirmek için onu bir dayanak noktası olarak kullanacağız."
 BEL_nationalize_the_banks:0 "Bankaları Millileştir"
 BEL_nationalize_the_banks_desc:0 "Çok uzun süredir bankalar, kardan başka bir şey umursamayan açgözlü küçük adamlar tarafından yönetildi. Bankalar herkese hizmet eden bir kurumdur, bu yüzden onların kontrolünü ele alıp mali araçlarını kolektif faydamıza uygun şekilde yönlendirmemiz sadece adildir."
 BEL_naval_doctrine:0 "Donanma Doktrini"
 BEL_naval_doctrine_desc:0 "Sivil eğitmenlerimizin bize öğretebileceği çok şey var, denizcilik işleri konusundaki anlayışımızı gerçekten genişletmek için, bazı yabancı yetenekleri işe almalı ve böylece bilgimizi ve eğitim yeteneklerimizi güçlendirmeliyiz."
 BEL_our_southern_neighbour:0 "Güney Komşumuz"
 BEL_our_southern_neighbour_desc:0 "Son savaştaki deneyimlerimiz sayesinde, savunmamızın çoğu doğu komşumuza yönelik olmuştur, ancak onlar tek komşu büyük güç değiller. Benzer şekilde güneye de tahkim edildiğimizden emin olmalıyız."
 BEL_paul_emile_janson:0 "Paul-Émile Janson"
 BEL_paul_emile_janson_desc:0 "Başbakan için liberal seçim olan Paul-Émile Janson, Kral tarafından bu giderek istikrarsızlaşan günlerde hükümeti istikrara geri götürmek için istikrarlı bir el olarak seçildi."
 BEL_peacekeeping_missions:0 "Barışı Koruma Görevleri"
 BEL_peacekeeping_missions_desc:0 "Dünya genelindeki devam eden çatışmalar bizi endişelendirmeye devam ediyor, ancak dışa dönük bir tarafsızlık cilasını korumak için yurtdışına sadece onaylanmış barışı koruma görevlerinde asker gönderebiliriz."
 BEL_perpetual_neutrality:0 "Daimi Tarafsızlık"
 BEL_perpetual_neutrality_desc:0 "Birinci Dünya Savaşı'nın ardından birincil savaş alanı olmamız nedeniyle ulusumuz harabeye döndü. Bunun bir daha asla tekrarlanmasına izin verilmemelidir. Bu nedenle, [BEL.GetNameDef]'in bağımsız ve daimi tarafsız bir devlet oluşturacağını ve diğer tüm devletlere karşı aynı tarafsızlığı gözeteceğini ilan edeceğiz."
 BEL_plan_de_man:0 "Plan de Man"
 BEL_plan_de_man_desc:0 "Büyük bir siyasi maliyeti olmasına rağmen, Başbakan, Henri de Man'ın reformlarını sürdürmek ve daha fazla işsizlik önlemi uygulamak için çok çalıştı. Bu, işsizlik oranını 1932'deki %23.5'lik yüksek seviyeden %15'e düşürmeyi amaçlamaktadır."
 BEL_polish_licences:0 "Polonya Lisansları"
 BEL_polish_licences_desc:0 "[POL.GetNameDef], uçak tasarımlarından bazılarını lisans altında sağlama konusunda bize ulaştı ve bunlar piyasa fiyatlarının çok altında bize sunulabilir."
 BEL_port_of_antwerp:0 "Anvers Limanı"
 BEL_port_of_antwerp_desc:0 "Anvers, ticari geçmişiyle ünlü bir şehirdir ve liman bugüne kadar önemli olmaya devam etmektedir. Bu itibarı, elverişli ticaret anlaşmalarını kolaylaştırmak için kullanalım."
 BEL_poudreries_reunies_de_belgique:0 "Poudreries Réunies de Belgique"
 BEL_poudreries_reunies_de_belgique_desc:0 "Belçika'daki en eski ikinci silah şirketi olan Poudreries, mühimmat konusunda uzmanlaşmıştır, bu nedenle lojistik ağımızdaki konumlarını modernize etmek bize gerçek patlayıcı sonuçlar sağlayacaktır."
 BEL_pressurized_cabin_development:0 "Basınçlı Kabin Geliştirme"
 BEL_pressurized_cabin_development_desc:0 "Belçika ile Kongo arasındaki hava yolculuğu kalitesini artırma çabasıyla, normalde mümkün olandan çok daha yükseğe uçmamızı sağlayacak basınçlı kabinler üzerinde çalışıyoruz. Aynı teknolojiyi savaş zamanı uçaklarımıza uyarlamak, yeteneklerini önemli ölçüde artıracaktır."
 BEL_prisoner_king:0 "Tutsak Kral"
 BEL_prisoner_king_desc:0 "Kral III. Leopold, cezasını halkıyla birlikte çekmeye hevesli olarak [BEL.GetNameDef]'de bir esir olarak kalmayı seçti. Şimdi 'Tutsak Kral' olarak adlandırılan halkı, bu eylemi onayla karşıladı ve bu zor zamanlarda onun örneği etrafında toplanmaya başladı."
 BEL_problem_of_language:0 "Dil Sorunu"
 BEL_problem_of_language_desc:0 "Belçika çok uzun süredir dil tarafından bölünmüştür ve eğer İşçi Partisi ulusu yönetimlerinin arkasında birleştirme umudu taşıyorsa, durulacak bariz yer, dil önceliği konusundaki duruşlarını netleştirmek veya hatta Brüksel'de uygulandığı gibi resmi iki dilliliğe yönelik çabalara öncülük etmektir."
 BEL_protect_against_france:0 "Fransa'ya Karşı Koru"
 BEL_protect_against_france_available_tt:0 "§YCharleroi§!, §YKortrijik§! veya §YKortrijik'in Kuzey-Batısındaki kıyı ilinde§! §Y1 Kara Kalesi§! inşa edilebilir!"
 BEL_protect_against_france_desc:0 "Güneye yapılan önceki hazırlıklar daha çok kuşatma durumunda hazırlıklardı, ama gerçek şu ki, Fransızlardan tam ölçekli bir istila olabilir ve buna göre kaleler ve tahkimatlar hazırlamalıyız!"
 BEL_railway_expansion:0 "Demiryolu Genişlemesi"
 BEL_railway_expansion_desc:0 "[ROOT.GetAdjective] ticaret ve sanayisini besleyen atardamarlar demiryollarıdır. Ekonomimiz toparlanıp yeniden canlanırken, sahip olduğumuz altyapının da buna ayak uydurmasını sağlamalıyız."
 BEL_raise_the_red_flag:0 "Kızıl Bayrağı Yükselt"
 BEL_raise_the_red_flag_desc:0 "Bugüne kadar çabalarımızın çoğu daha ılımlı sosyalist ideal doğrultusundaydı; ancak kendimizi Sovyet bloğuyla daha fazla aynı hizaya getirmek için Komünist partiye olan desteğimizi artırmamız gerekebilir. Buna yönelik ilk adım, Belçika'daki Komünist Gazete olan \"Le Drapeau Rouge\"yu (Kızıl Bayrak) desteklemek olacaktır."
 BEL_raise_the_red_flag_tt:0 "§Y$BEL_rekindle_the_red_flame_cat$§! kararlarını açar ve [BEL.GetNameDef]'i §YKomünist§! yapar."
 BEL_rally_to_the_king:0 "Krala Toplan"
 BEL_rally_to_the_king_desc:0 "Kral, sadece bir tutsaktan daha fazlası haline geldi, mücadele eden ulusumuz için bir sembol haline geldi. Onun liderliği, becerisi, zekası ve kararlılığıyla bu karanlık günleri atlatacağımızdan ve daha güçlü, daha müreffeh bir ulus olarak ortaya çıkacağımızdan eminiz."
 BEL_re_build_the_fleet:0 "Donanmayı Yeniden İnşa Et"
 BEL_re_build_the_fleet_desc:0 "Deniz gücümüzü yeniden tesis etmenin ilk adımı, aslında yeni bir donanma inşa etmektir. Bu, yeni tersanelere ve gemi inşa yeteneklerine önemli bir yatırım gerektirecektir."
 BEL_re_establish_belgian_navy:0 "Belçika Donanmasını Yeniden Kur"
 BEL_re_establish_belgian_navy_desc:0 "Birinci Dünya Savaşı'nın ardından Versay Antlaşması'nda Almanya'dan birkaç gemi kazanmasına rağmen, Belçika bütçe kısıtlamaları nedeniyle 1927'de donanmasını lağvetti. Yurtdışındaki beliren tehditler ve özellikle Kongo ile stratejik iletişim ve ticareti sürdürme ihtiyacımızla, filomuzu yeniden kurduğumuzdan emin olmalıyız."
 BEL_rebuild_wallonian_industry:0 "Valon Sanayisini Yeniden İnşa Et"
 BEL_rebuild_wallonian_industry_desc:0 "Valonya, Birinci Dünya Savaşı sırasında Alman işgalinden en çok etkilenen bölgeydi, sanayisinin ve kaynaklarının çoğu işgalciler tarafından yağmalandı. Bu arada yeniden yapılanma hızla ilerledi, ancak [ROOT.GetAdjective] sanayi merkezi olarak gerçek potansiyeline ulaşması için her zaman daha fazla yatırıma ihtiyacı olabilir."
 BEL_relocate_air_production:0 "Hava Üretimini Yer Değiştir"
 BEL_relocate_air_production_desc:0 "Uçak imalatı, önemli miktarda özel bileşen gerektirir ve değiştirilmesi zor havacılık mühendislerine dayanır. Ancak bir kez üretildikten sonra, uçaklar neredeyse her yere konuşlandırılabilir. Üretim hatlarımızın korunması için uçaklarımızı yurtdışında üretmek üzere yabancı firmalarla sözleşmeler yapmalıyız."
 BEL_relocate_air_production_tt:0 "Savaşa girerken §G2§! harita dışı askeri fabrika verir."
 BEL_renard_constructions_aeronautiques:0 "Renard Constructions Aéronautiques"
 BEL_renard_constructions_aeronautiques_desc:0 "Son zamanlardaki en umut verici tasarımcılardan biri Alfred Renard'dır, çok yenilikçi tasarımları var ve bu girişimleri ve şirketini desteklemeliyiz."
 BEL_repudiate_treaty_with_france:0 "Fransa ile Antlaşmayı Reddet"
 BEL_repudiate_treaty_with_france_desc:0 "[FRA.GetNameDefCap]'in Majino hattını sınırlarımız boyunca uzatmayı reddetmesi, esasen bir düşmanın saldırmak zorunda kalacağı geniş açık bir kapı bırakır. Onlarla olan antlaşmalarımızı reddederek, onlara yardım etme konusunda herhangi bir askeri yükümlülükten kurtulabiliriz, ancak saldırıya uğrarsak yine de müdahale etmek zorunda kalacaklar veya korunmasız topraklarına bir takip istilası riskiyle karşı karşıya kalacaklar."
 BEL_resist_and_bite:0 "Diren ve Isır"
 BEL_resist_and_bite_desc:0 "Chasseurs Ardennais, [ROOT.GetAdjective] kuvvetlerinin elit bir birimidir ve esas olarak Lüksemburg eyaletinde yaşayan ve bölgenin yoğun ormanlarına alışkın olanlardan oluşur. Sloganları \"Diren ve Isır!\""
 BEL_revitalize_nederlands:0 "Hollandacayı Canlandır"
 BEL_revitalize_nederlands_desc:0 "Dilimiz neredeyse yok oldu! Mahkemeler bile kararlarını Fransızca veriyor ve sadece yerel lehçeler hatırlanıyor. Flaman büyüklüğünü restore etmenin ilk adımı, hükümetimiz ve halkımız tarafından uygun dilin konuşulmasını sağlamaktır. Hollandaca!"
 BEL_revive_coal_mining:0 "Kömür Madenciliğini Canlandır"
 BEL_revive_coal_mining_desc:0 "Valon sanayisinin temel taşı her zaman çelik olmuştur ve bu önemli malzemeyi daha iyi üretmek için o bölgedeki kömür madenlerimizi agresif bir şekilde genişletmemiz gerekiyor."
 BEL_royal_commander_in_chief:0 "Kraliyet Başkomutanı"
 BEL_royal_commander_in_chief_desc:0 "Kral III. Leopold iyi, asker bir soydan geliyor. Kral Albert bir savaş kahramanıydı, en karanlık saatlerinde ulusun yanında durdu ve bizi şanlı zafere götürdü. Leopold'un tek istediği kendini kanıtlamak ve babasının gölgesinden çıkmaktır. Ona sadece fırsat vermemiz gerekiyor."
 BEL_royal_commander_in_chief_tt:0 "§YKral III. Leopold§!, bir §YMareşal§! olur!"
 BEL_royal_intervention:0 "Kraliyet Müdahalesi"
 BEL_royal_intervention_complete_degrelle_tt:0 "§RKraliyet Müdahalesi olayında Degrelle'i seçmek bu odağı tamamlayacaktır.§!"
 BEL_royal_intervention_complete_janson_tt:0 "§RKraliyet Müdahalesi olayında Janson'u seçmek bu odağı tamamlayacaktır.§!"
 BEL_royal_intervention_complete_pierlot_tt:0 "§RErken Seçim olayında Pierlot'u seçmek bu odağı tamamlayacaktır.§!"
 BEL_royal_intervention_complete_spaak_tt:0 "§RErken Seçim olayında Spaak'ı seçmek bu odağı tamamlayacaktır.§!"
 BEL_royal_intervention_desc:0 "Hükümet tekrar düştü ve Kral'ın devreye girip harekete geçme zamanı geldi. Başbakan için iki aday var, Paul-Émile Janson'un emin eli veya önceki rejimin yolsuzluğuna karşı şikayetlere öncülük eden Leon Degrelle. "
 BEL_royal_intervention_tt:0 "Kral, Çöken Hükümetle başa çıkmak için devreye girecek."
 BEL_royal_military_academy:0 "Kraliyet Askeri Akademisi"
 BEL_royal_military_academy_desc:0 "Kraliyet Askeri Akademisi, [ROOT.GetNameDef]'in tek askeri öğrenim enstitüsüdür, ancak küresel durum daha belirsiz hale geldikçe, yarının subaylarını en iyi askeri teoriyle hazırladığımızdan emin olmalıyız ve bu, akademinin genişletilmesini gerektirecektir."
 BEL_scars_of_ww1_ns_fake_tt:0 "Tümen Organizasyonu: §R-%15§! \nAskere Alınabilir Nüfus Faktörü: §R-%15§! \nSavaş Desteği: §R-%30§! \n§YAskeri Fabrika§! İnşaat Hızı: §R-%20§!"
 BEL_secretaries_general:0 "Genel Sekreterler"
 BEL_secretaries_general_desc:0 "Ulusumuzu savunmak için elimizden gelen her şeyi yapacak olsak da, çok daha büyük komşularımıza bakarken gerçekçi olmak ve teslim olmamız durumunda yasalar oluşturma zor kararını almak zorundaydık. Bu nedenle, Genel Sekreterleri kurduk, bunlar herhangi bir işgalciyle işbirliği yapmalarına yasal olarak izin verilen ve yerel yönetimin devam etmesini sağlayan memurlardır."
 BEL_senior_officer_training:0 "Üst Düzey Subay Eğitimi"
 BEL_senior_officer_training_desc:0 "Subayların şu dört özellikten ikisine sahip olduğu söylenebilir: tembellik, aptallık, çalışkanlık ve zekilik. Kurmay subaylar çalışkan ve zeki olmalı, üst düzey subaylar tembel ve zeki olmalıdır. Aptal ve tembellerin bile kullanım alanları vardır. Her şeyden önce, felakete dönüşen kararları alan ve bunu sonuna kadar götürme iradesine ve enerjisine sahip olan aptal ve çalışkanları belirlemeliyiz."
 BEL_snap_election:0 "Erken Seçim"
 BEL_snap_election_desc:0 "Anayasa Krizi şimdilik kontrol altına alındığına göre, hükümetin bir kez daha meşruiyetini sağlamanın zamanı geldi, aksi takdirde az önce devirdiği kişilerden hiçbir farkı kalmaz. Şu anda Sosyalistlerden Paul-Henri Spaak ve Katolik Partisi'nden Hubert Pierlot önde gidiyor."
 BEL_snap_election_tt:0 "Gelecekteki siyasi yönümüzü belirlemek için bir erken seçim yapılacak."
 BEL_social_partners:0 "Sosyal Ortaklar"
 BEL_social_partners_desc:0 "Hükümetimiz, sendika ve şirket temsilcilerini bir araya getirmek için Ulusal Çalışma Konferansı'nı topladı. Bunun sonucu olarak asgari ücret ve yılda altı gün ücretli tatil getirildi."
 BEL_socialist_victory:0 "Sosyalist Zafer"
 BEL_socialist_victory_desc:0 "Paul-Henri Spaak, İşçi Partisi'ni erken seçimde zafere taşıdı ve Belçika sınırlarının bütünlüğünü korumak için elinden gelen her şeyi yapacağına, bunu yapmak için Komünistlerle mi yoksa Demokratlarla mı aynı hizada olduklarına bakılmaksızın yemin etti."
 BEL_soviet_guarantee:0 "Sovyet Garantisi"
 BEL_soviet_guarantee_desc:0 "Daha demokratik eğilimlerimize rağmen, sosyalist yolu benimsedik ve [SOV.GetNameDef]'e sunabileceğimiz çok şey var. Doğru iltifatları sunduğumuz ve geniş diplomatik yaklaşımlarına uyduğumuz sürece, Rus Ayısı'ndan bir dost edinebiliriz."
 BEL_soviet_guarantee_tt:0 "Eğer §Y$BEL_raise_the_red_flag$§! tamamladıysak, §Gkabul etme§! olasılıkları daha yüksek olacaktır."
 BEL_spanish_intervention:0 "İspanya'ya Müdahale"
 BEL_spanish_intervention_desc:0 "İspanya'daki Cumhuriyetçi durum zayıftır ve demokrasinin galip gelmesi için, ona değer verenlerin, onun için savaşanların desteğini artırması gerektiği açıktır."
 BEL_spanish_intervention_tt:0 "Daha fazla §Y$BEL_intervention_in_spain_cat$§! için kararlar açar.\n\nTeçhizat gönderebilecek, çabalarına yardımcı olmak için göçü teşvik edebilecek ve onları siyasi olarak destekleyebileceğiz."
 BEL_stampe_et_vertrongen:0 "Stampe et Vertrongen"
 BEL_stampe_et_vertrongen_desc:0 "Stampe et Vertrongen eğitim uçakları konusunda uzmanlaşmış olsa da, bu yerli firmaya yatırım yapmalı ve tasarımlarını ek cephe görevleri için uyarlamalıyız."
 BEL_stk:0 "STK'yı Kur"
 BEL_stk_desc:0 "Atom enerjisinin arkasındaki bilimsel olasılıkları araştırmak için adanmış bir organ olarak Studiecentrum voor de Toepassingen van de Kernenergie (Nükleer Enerjinin Uygulamaları için Araştırma Merkezi) veya STK'yı kurmayı hedefliyoruz."
 BEL_strategic_doctrine_development:0 "Stratejik Doktrin Geliştirme"
 BEL_strategic_doctrine_development_desc:0 "Savaştan savaşa düşünmek yeterli değil, bunun yerine stratejik katmanı sağlam bir şekilde kavramalı ve tüm kuvvetlerimizin aynı tekil hedefe, yani zafere doğru ilerlemesini sağlamak için askeriyemizi belirli doktrinlere göre düzenlemeliyiz."
 BEL_strength_and_brotherhood:0 "Güç ve Kardeşlik"
 BEL_strength_and_brotherhood_desc:0 "Güç ve kardeşlik idealleri bizimkilerle örtüşenleri arayacağız ve aslan gibi kendi gururumuzu oluşturacağız. Bu şekilde, bizi güçlü kılan şeyi ileriye taşıyabilir ve zihin ve ruh açısından daha zayıf olanları avları gibi parçalayabiliriz."
 BEL_support_the_european_project:0 "Avrupa Projesini Destekle"
 BEL_support_the_european_project_desc:0 "Savaş ve çatışmanın hakim olduğu bir dünyada, tarafsızlığın barışın bir garantisi olmadığı bizim için son derece açık hale geldi. Bu nedenle, karşılıklı güvenlik ve ekonomik istikrara adanmış bir organ oluşturmak için diğer Avrupa devletlerine ulaşmalı ve böylece birlikte refaha kavuşmalıyız."
 BEL_support_the_rexists:0 "Rexistleri Destekle"
 BEL_support_the_rexists_desc:0 "Degrelle Başbakan olarak yerini aldığına göre, onu bu konuma getirmede destekleyen partinin hizmetlerinin karşılığını görme ve kıdemli üyelerin kabinedeki pozisyonlara terfi etme zamanı geldi."
 BEL_support_the_vnv:0 "VNV'yi Destekle"
 BEL_support_the_vnv_desc:0 "Son seçimin bir parçası olarak, Vlaamsch Nationaal Verbond veya Flaman Ulusal Birliği, korporatist bir devlet kurma niyetiyle Rexist partisiyle ittifak kurdu. Şimdi Degrelle iktidara geldiğine göre, müttefiklerini ödüllendirme ve gözleri sıkıca Hollanda ile yeniden birleşmeye odaklanmış daha yayılmacı bir faşist devlete doğru adımlar atmaya başlama zamanı geldi."
 BEL_the_belgian_legion:0 "Belçika Lejyonu"
 BEL_the_belgian_legion_desc:0 "Belçika Lejyonu, krallarının adına silahlanmaya hazır ve istekli, muhafazakar ve kralcı sadıklardan oluşan bir topluluktur. Ülkeden kaçırabildiğimiz kadarını kaçırmalı ve onları iyi bir şekilde kullanmalıyız."
 BEL_the_council_of_europe:0 "Avrupa Konseyi"
 BEL_the_council_of_europe_desc:0 "Tarafsızlığın saldırgan komşulardan gelen askeri yayılmacılığa karşı bir koruma olmadığı giderek daha açık hale geldi. Bu nedenle, Avrupa'da barışı sağlamanın tek yolu birliktir. Diplomatları ve devlet başkanlarını tek bir masada bir araya getirmeli ve böylece Avrupa Konseyi'ni kurmalıyız."
 BEL_the_council_of_europe_tt:0 "Diğer ülkeleri §Y$BEL_european_union$§!'a davet etmek için kararlar açar."
 BEL_the_european_crusade:0 "Avrupa Haçlı Seferi"
 BEL_the_european_crusade_desc:0 "Avrupa'nın sınırlarında akbabalar dönüyor, barbar ideolojileri içindeki medeni uluslara karşı zayıflık arıyor. Düzen ve ilerleme için bir kale olarak durmak bizim görevimizdir, ulusumuz eşsiz kararlılığını kanıtlamış olarak bu mücadelede haklı olarak lider olarak durmaktadır."
 BEL_the_european_crusade_tt:0 "§YAvrupa Haçlı Seferi§! etkileri, §YRexistlerin§! mi yoksa §YVNV§!'nin mi iktidara geldiğine bağlı olacaktır."
 BEL_the_flemish_question:0 "Flaman Sorunu"
 BEL_the_flemish_question_desc:0 "[BEL.GetName] içindeki devam eden bölünme, halkımız arasında bir yarık yaratmaya devam ediyor. Bu sorunu bir kez ve herkes için çözmeli ve uygun dil standardının ne olması gerektiğine kendimiz karar vermeliyiz. Halk söylenenleri yapacaktır, sonuçta hepimiz [BEL.GetAdjective]'iz ve bu, dil gibi tek bir önemsiz sorunu aşar."
 BEL_the_french_horse_and_the_red_rider:0 "Fransız Atı ve Kızıl Süvari"
 BEL_the_french_horse_and_the_red_rider_desc:0 "Belçika çok uzun süredir Fransızların toynakları altında, komünist süvariler tarafından komuta edilen bir canavarın altında ezildi. Bu sinsi istilaya karşı ayağa kalkmalı ve yerimizi korumalıyız. Yaratık ancak güvenimizi ve gücümüzü göstererek çekinecek ve sincektir."
 BEL_the_grand_place:0 "Grand-Place"
 BEL_the_grand_place_desc:0 "Brüksel'in merkezindeki büyük meydan uzun zamandır sosyalist düşüncenin bir yatağı olmuştur. En ünlüsü, Karl Marx'ın Komünist Manifesto'yu burada yazması, ardından aynı yerin Birinci Enternasyonal'in 3. Kongresi'ne ev sahipliği yapması ve sonunda ilk sosyalist parti olan Belçika İşçi Partisi'nin kuruluş yeri olmasıdır."
 BEL_the_king_surrenders:0 "Kral Teslim Oluyor"
 BEL_the_king_surrenders_desc:0 "Sürpriz bir hamleyle, Kral III. Leopold, tüm Belçika askeri birimlerinin düşmana koşulsuz teslimiyetini sunmak için Başkomutan olarak yetkilerini kullandı. Görünüşte bu, mümkün olduğunca çok hayat kurtarmak içindi, ancak daha karanlık bir motivasyonun fısıltıları var."
 BEL_the_king_surrenders_tt:0 "§RKral hala iktidardayken teslim olmak bu odağı tamamlayacaktır.§!"
 BEL_the_lost_tribe:0 "Kayıp Kabile"
 BEL_the_lost_tribe_desc:0 "[BEL.GetName]'nin taşımak zorunda kaldığı bir leke, fethedilmiş ve köleleştirilmiş Galya halklarıyla bir tutulmaktı. Biz kendi kayıp Cermen kabilemiziz. Biz direnenleriz. Biz savaşanlarız. Biz fethedenleriz."
 BEL_the_new_ruhr:0 "Yeni Ruhr"
 BEL_the_new_ruhr_desc:0 "Almanya'daki Ruhr bölgesi, ham sanayi çıktısıyla ünlüdür, o kadar ki diğer büyük güçlerin kıskançlığı haline gelmiştir. Belçika'nın da sanayi büyüklüğüne bir iddiası ve komşumuzun potansiyelini çok aşabilecek bir potansiyeli vardır. Fırsatımız var, kaynaklarımız var, azmimiz var ve en önemlisi. Halkımız var."
 BEL_the_price_to_pay:0 "Ödenecek Bedel"
 BEL_the_price_to_pay_desc:0 "Kral, bir süredir işgalcilerimizle görüşüyor ve karakteri onların güvenini kazanmasını sağladı. Bu nedenle, Belçika'da kaybedilen toprakların bize iade edilmesi mümkün olabilir. Karşılığında istedikleri bedel basit. Diz çök."
 BEL_the_secret_army:0 "Gizli Ordu"
 BEL_the_secret_army_desc:0 "Ülkemiz işgal edildiğine göre, sabotaj ve bozgunculuk eylemlerinde bulunmak için direnişi inşa etme görevine başlamalıyız. Gizli Ordu, bunun için kanalımızdır, yenilmiş ordumuzdan bir dizi subay tarafından kurulmuştur, bunu harekete geçirmek için gereken örgütsel ve lojistik becerilere sahiptirler. Tek yapmamız gereken emri vermek."
 BEL_the_walloon_legion:0 "Valon Lejyonu"
 BEL_the_walloon_legion_desc:0 "Gerçek atalarımız düzgün bir şekilde kurulup açıklığa kavuşturulduğuna göre, bu şanlı geleneği yakalama ve dünyaya gerçekten neler yapabileceğimizi gösterme zamanı geldi."
 BEL_trade_union_support:0 "Sendika Desteği"
 BEL_trade_union_support_desc:0 "Siyasi mücadeledeki doğal müttefiklerimiz sendikalardır, ancak şimdiye kadar hareketimize destekleri ılıktı. Onlara olan vaatlerimizi yoğunlaştırabiliriz ve karşılığında onlar da üyeliklerini lehimize toplayacaklardır."
 BEL_traditional_family_values:0 "Geleneksel Aile Değerleri"
 BEL_traditional_family_values_desc:0 "Katolik Kilisesi, uygun aile ahlakı konusunda bizi her zaman iyi yönlendirmiştir ve devam eden gelecekteki genişleme ve refah için gereken istikrarı ve büyümeyi sağlamanın tek yolu bu öğretilere bağlı kalmaya devam etmektir."
 BEL_tripartite_government:0 "Üçlü Hükümet"
 BEL_tripartite_government_desc:0 "Daha önceki ulusal birlik hükümetleri gibi, Başbakan Pierlot da Belçika dayanışmasının bir göstergesi olarak birkaç demokratik partiyi bir araya getirmeyi başardı. Bu siyasi olarak birleşmiş cephe ile, nihayet daha radikal yasaları geçirme gücüne sahip."
 BEL_unfit_to_reign:0 "Saltanata Uygun Değil"
 BEL_unfit_to_reign_desc:0 "Kral III. Leopold'un parlamento onayı olmadan sunduğu koşulsuz teslimiyet ışığında, sivil hükümet onu yönetmeye uygun olmadığını ilan etti ve savaşı yurtdışından zafere kadar sürdürmeye yemin etti."
 BEL_unity_makes_strength:0 "Birlikten Kuvvet Doğar"
 BEL_unity_makes_strength_desc:0 "Başlangıçta Hollanda Cumhuriyeti'nin sloganı, hem Hollanda'yı hem de Belçika'yı yönettiği zamanlardaydı. Bağımsızlığımıza yol açan 1830 Devrimi'nin ardından Belçika devleti tarafından resmen benimsendi. Gerçekten de Belçika siyasetinin merkezinde duran liberal ilericiler ve Katolik muhafazakarların birliğiyle kutsandı ve o zamandan beri Belçika idealini somutlaştırdı."
 BEL_unlock_gold_reserve_decisions_tt:0 "§Y$BEL_gold_reserves_cat$§! kararlarını açar"
 BEL_v_for_victory:0 "Zafer İçin V"
 BEL_v_for_victory_desc:0 "Victoire! Vryheid! İki kelime, zafer ve özgürlük, Belçika dilleri arasında bulunan ve aynı harfle tanımlanan. Yukarı kaldırılmış işaret ve orta parmak, Belçika halkı arasında meydan okuma ve kararlılığın bir sembolü haline gelmiş, yabancı kıyılara yayılmış ve hatta benzer şekilde meydan okuyan ulusal liderler tarafından benimsenmiştir."
 BEL_val_benoit_institutes:0 "Val-Benoît Enstitüleri"
 BEL_val_benoit_institutes_desc:0 "Eski Val-Benoît Manastırı'nın kalıntıları üzerine birkaç yeni bilimsel bölüm kurarak, Liege Üniversitesi'nde Val-Benoît Enstitüleri'ni kurmalıyız."
 BEL_van_overstraeten_on_the_home_front:0 "Van Overstraeten Ana Cephede"
 BEL_van_overstraeten_on_the_home_front_desc:0 "Askeri personelin açık ara en zekisi, dezavantajı ise bunu bilmesidir. Van Overstraeten, savaşın patlak vermesinden önce Kral'ın askeri danışmanı olarak yetkin bir şekilde hizmet etti ve karakteri onunla çalışmayı bir meydan okuma haline getirse de, koşullarımız öyle ki, ondan sahaya çıkmasını ve ulusumuzu zafere götürmesini istemeliyiz."
 BEL_vandervelde_minority:0 "Vandervelde Azınlığı"
 BEL_vandervelde_minority_desc:0 "Émile Vandervelde seçimde zafere ulaştı, ancak İşçi Partisi sadece azınlıkla kazanabildi. Koalisyon görüşmeleri çöktükten sonra tek başına gitmeyi seçti, ancak önündeki siyasi yol zorlu olacak."
 BEL_vnv_dominant_tt:0 "§Y[BEL.GetName]§!, §YVlaanderen§! olarak bilinecek!"
 CHI_has_accepted_german_overtures:0 "Çin, [ROOt.GetAdjective] Tekliflerini Kabul Etti"
 COG_31e_brigade_parachutiste:0 "31e Brigade Parachutiste"
 COG_31e_brigade_parachutiste_desc:0 "Yerleşim yerlerini hızla ele geçirebilen ve içlerindeki düşmanları yok edebilen, aynı zamanda tehdit altında olmaları durumunda ulusumuzun liderinin seçkin muhafızları olarak da hareket edebilen seçkin bir paraşütçü birimi kurmaya çalışmalıyız."
 COG_BEL_negotiations_ongoing_flag:0 " Kongo Bağımsızlık Müzakereleri Devam Ediyor"
 COG_a_german_protectorate:0 "Bir Alman Himayesi"
 COG_a_german_protectorate_desc:0 "Yeni devletimize meşruiyet kazandırmak ve onu İngilizler ve Fransızlar gibi aç akbabalardan korumak için, eski dostlarımız [GER.GetNameDef]'in bir himayesi olmaya çalışmalıyız."
 COG_a_multiethnic_conglomeration:0 "Çok Etnikli bir Küme"
 COG_a_multiethnic_conglomeration_desc:0 "Toplumumuz her zaman çok sayıda etnik ve dilsel gruptan oluşmuştur ve bu onun için daha iyi olmuştur. Bu tür davranışları daha fazla teşvik etmeli ve fatih ile fethedilen arasındaki ilişkiyi değiştirmeliyiz."
 COG_a_society_of_trade:0 "Ticaret Üzerine Kurulu Bir Toplum"
 COG_a_society_of_trade_desc:0 "Toplumumuz, Kongo'dan geçen ticaret yolları sayesinde uzun zamandır devam edebilmiştir. Daha güçlü bir ekonomik temel kazanmak istiyorsak bunu sürdürmeliyiz."
 COG_academie_militaire_de_kananga:0 "Académie Militaire de Kananga"
 COG_academie_militaire_de_kananga_desc:0 "Eğitime ihtiyacı olan sadece normal askerler değil, aynı zamanda subaylar ve generallerdir. Ordumuzun gelecek görevler için daha iyi eğitilebilmesi için Académie Militaire de Kananga'ya yatırım yapmalıyız."
 COG_acquire_american_investments:0 "Amerikan Yatırımlarını Edin"
 COG_acquire_american_investments_desc:0 "Amerikalılar, Afrika'nın merkezinde stratejik olarak konumlanmış olmamız ve aynı zamanda Amerikan kıtasına yakın olmamız nedeniyle, geniş ulusumuzu malzeme ve silah taşımacılığı kurmak için bir merkez olarak kullanmaya büyük ilgi duyuyorlar. Bunu kendi avantajımıza kullanmalı ve Amerikalı yatırımcıları çekmeye çalışmalıyız."
 COG_adopt_lingala_and_swahili_as_martial_languages:0 "Savaş Dilleri Olarak Lingála ve Swahili'yi Benimse"
 COG_adopt_lingala_and_swahili_as_martial_languages_desc:0 "Force Publique ana dilleri olarak Fransızca'yı kullanmış olsa da, eski efendilerimizden uzaklaşma çabasıyla, ordularımıza yerli Kongo dillerini dahil etmeye çalışmalıyız. Ana bölümler Lingála ve Swahili'yi kullanacak, çünkü bunlar şu anda en büyük iki dildir."
 COG_aeronautical_research_department:0 "Havacılık Araştırma Departmanı"
 COG_aeronautical_research_department_desc:0 "Daha önce yoğun bir şekilde yatırım yapmadığımız bir şey olmayabilir, ancak yabancı aktörlere çok fazla güvenemeyeceğimiz unutulmamalıdır. Bununla ilişkili maliyetler ne olursa olsun, kendi uçaklarımızı geliştirmeye ve üretmeye çalışmalıyız."
 COG_african_research_and_development_department:0 "Afrika Ar-Ge Departmanı"
 COG_african_research_and_development_department_desc:0 "İlerlemek için, birçok Afrika devletinin teknik bilgisini bir araya getirebilecek ortak bir Afrika araştırma ve teknolojik geliştirme birimi kurmalıyız."
 COG_african_union_faction:0 "Afrika Birliği Teşkilatı"
 COG_alliance_de_bakongo:0 "Bakongo İttifakı"
 COG_alliance_de_bakongo_desc:0 "Bakongo İttifakı, bağımsız bir Kongo için yol gösterici bir ışık olacağı kesin olan büyük düşünür Joseph Kasa-Vubu tarafından yönetilmektedir. ABAKO'nun hükümetin müdahalesi olmadan faaliyet göstermesine izin verildiğinden emin olmalıyız."
 COG_allow_local_autonomy:0 "Yerel Özerkliğe İzin Ver"
 COG_allow_local_autonomy_desc:0 "Düzgün bir şekilde merkezileşmenin pratik olarak imkansız olduğu göz önüne alındığında, bunun yerine bölgelere yerel özerklik tanımaya çalışmalıyız, böylece ulusumuzun birçok insanını, onlar üzerinde o kadar da büyük bir kontrolümüz olmamasına rağmen, bize destek olmaya devam ettirebiliriz."
 COG_an_expansionist_state:0 "Yayılmacı Bir Devlet"
 COG_an_expansionist_state_desc:0 "Her devlet, nüfusunun taleplerine ayak uydurmak istiyorsa sürekli büyümek zorundadır ve biz de farklı değiliz. Sürekli daha fazlasını arzulayanları tatmin edebilmek için sınırlarımızı hızla genişletmeliyiz."
 COG_an_independent_colonial_cabinet:0 "Bağımsız Bir Sömürge Kabinesi"
 COG_an_independent_colonial_cabinet_desc:0 "Ülkeyi düzgün bir şekilde yönetmek için, geçici bir bakanlar kabinesi ve Leopoldville'de kendi parlamentomuzu kurmalıyız. Bu arada, Vleeschauwer, onlarla elverişli ticaret anlaşmaları yapma umuduyla çeşitli müttefiklerimize devlet ziyaretleri yapacak."
 COG_appoint_a_royal_council:0 "Bir Kraliyet Konseyi Ata"
 COG_appoint_a_royal_council_desc:0 "Kral çok şey bilebilir, ama her şeyi bilemez. Bu nedenle, krallığı yönetirken elini yönlendirmeye yardımcı olabilecek bir kraliyet danışmanlar konseyine ihtiyacı vardır."
 COG_approach_the_barotse_litunga:0 "Barotse Litunga'sına Yaklaş"
 COG_approach_the_barotse_litunga_desc:0 "Güneyimizdeki Barotse halkının Litunga'sı olan II. Yeta, anti-emperyalizm söz konusu olduğunda hedeflerimizin birçoğunu paylaşıyor. Belki de onun güvenini kazanmak ve savaşçılarının kurtuluşumuza yardım etmesini sağlamak akıllıca olacaktır?"
 COG_approach_the_barotse_litunga_tt:0 "Kurtuluş savaşı başladığında, 2 §YBarotse Tümeni§! kazanacağız ve §Y[981.GetName]§! üzerinde bir çekirdek kazanacağız!"
 COG_approach_the_disfavored_mwami:0 "Gözden Düşmüş Mwami'ye Yaklaş"
 COG_approach_the_disfavored_mwami_desc:0 "Belçikalı işgalcilere kin besleyen birçok kişi var. Onlardan biri, Ruanda'nın eski Mwami'si Yuhi V Musinga'dır. Onun lütfunu kazanabilir ve zamanı geldiğinde onun ve takipçilerinin ayaklanmamıza katılmasını sağlayabiliriz."
 COG_approach_the_disfavored_mwami_tt:0 "Kurtuluş savaşı başladığında, 2 §YRuanda Tümeni§! kazanacağız ve ülkemizdeki monarşist duygular zamanla daha da güçlenmeye başlayacak"
 COG_approached_ruanda_urundi_governor_flag:0 "Ruanda-Urundi Valisine yaklaşıldı"
 COG_assemble_a_regency_council:0 "Bir Naiplik Konseyi Topla"
 COG_assemble_a_regency_council_2_tt:0 "Konsey, en büyük meşruiyete sahip olanlara öncelik vererek ulusumuzu yönetecek adayları aramaya başlayacak"
 COG_assemble_a_regency_council_desc:0 "Siyasi mücadelelerimize bir çözüm görünürde yok. Hiçbir belirli parti veya politikacı, ulusal liderliği üstlenmek için yeterli halk desteğine sahip değil ve durumun daha fazla devam etmesine izin verilemez. Belirli kabile liderlerine ve hükümdarlara liderlik sunmaya çalışacak ve yeni hükümetimiz için mümkün olduğunca fazla meşruiyet toplayacak bir konsey kurmamız gerekiyor."
 COG_assemble_a_regency_council_tt:0 "Bir lider seçildikten sonra, §YKimin Seçildiğine Bağlı Olarak§! aşağıda §YYeni Odaklar§! görünecektir!"
 COG_attempt_to_ally_the_portuguese:0 "[POR.GetAdjective]lerle İttifak Kurmaya Çalış"
 COG_attempt_to_ally_the_portuguese_desc:0 "[POR.GetNameDef] ve kaşifleriyle olan ilişkimiz inişli çıkışlı oldu, ama geçmişi düzeltme ve ileriye bakma zamanı geldi. Bu nedenle onlarla bir ittifak kurmaya çalışmalıyız."
 COG_attempt_to_centralize_the_state:0 "Devleti Merkezileştirmeye Teşebbüs Et"
 COG_attempt_to_centralize_the_state_desc:0 "Geniş ulusumuz, tek bir merkezi konumdan kontrol edilmesi sonsuz derecede imkansızdır. En azından daha iyi iletişim ve ulaşım teknolojileri icat edemezsek. Ancak şu anda devleti başkentimiz etrafında daha iyi merkezileştirmek için elimizden geleni yapmalıyız."
 COG_attempt_to_sway_moise_thsombe:0 "Moïse Tshombe'yi İkna Etmeye Çalış"
 COG_attempt_to_sway_moise_thsombe_desc:0 "Katanga eyaleti, ayrılma fikirlerimize pek sıcak bakmıyor gibi görünüyor ve isyanımızı başlatırsak muhtemelen kendileri ayrılacaklardır. Bu nedenle, en önde gelen politikacılarından biri olan Moïse Tshombe'nin desteğini kazanmalı ve onu birleşik davamıza ikna etmesini sağlamalıyız."
 COG_bakongo_military_might:0 "Bakongo Askeri Gücü"
 COG_bakongo_military_might_desc:0 "Krallığımızdaki durumu bir kez daha istikrara kavuşturduğumuza göre, bizim olan her şeyi talep etme ve fethetme ve Afrika'yı hakimiyetimiz altına alma zamanı geldi!"
 COG_boma_accords_faction:0 "Boma Anlaşmaları"
 COG_brown_water_navy:0 "Kahverengi Su Donanması"
 COG_brown_water_navy_desc:0 "Deniz bizim için çok az endişe kaynağı. Ancak, ulusumuzun güvenliğini korumak istiyorsak, geniş nehirlerimiz ve göllerimizin düzgün bir şekilde devriye gezilmesi gerekecektir."
 COG_bundu_dia_kongo:0 "Bundu dia Kongo"
 COG_bundu_dia_kongo_desc:0 "Devletimizin gerçekten eskiden olduğu gibi olması için, Portekizliler tarafından yıllar önce bize tanıtılan Hristiyanlık prangalarını atmalıyız. Bukongo'yu bir kez daha benimseme zamanı geldi!"
 COG_central_african_bank:0 "Orta Afrika Bankası"
 COG_central_african_bank_desc:0 "Bir [ETH_GetCentralBankName] yaratılmasıyla, Afrika Birliği Teşkilatı içindeki ekonomileri entegre etme sürecine başlayabiliriz. Bu, kaynaklarımızı ve altyapımızı tüm üye devletlerin iyiliği için daha verimli kullanmamızı sağlayacaktır."
 COG_central_bank_of_congo_ruanda_urundi:0 "Kongo ve Ruanda-Urundi Merkez Bankası"
 COG_central_bank_of_congo_ruanda_urundi_desc:0 "Kendi bankamızı, yabancı güçler tarafından kontrol edilmeyen veya denizaşırı olmayan bir banka kurma zamanı geldi!"
 COG_centralize_military_structure:0 "Askeri Yapıyı Merkezileştir"
 COG_centralize_military_structure_desc:0 "Ordularımızı daha iyi koordine etmek için, eskiden tüm komşu krallıklarımızı kolayca fethetmemizi sağlayan aynı şeyi, yani merkezi bir askeri yapı kurmalıyız."
 COG_children_of_woot:0 "Woot'un Çocukları"
 COG_children_of_woot_desc:0 "Woot, hayvanları ve diğer canlıları adlandıran doğaüstü bir varlıktı ve aynı zamanda ilk insan ve medeniyetin getiricisiydi. Biz onların çocuklarıyız ve onların beklentilerini karşılayacak şekilde hareket etmeliyiz."
 COG_claim_the_great_lakes:0 "Büyük Göller Krallıklarını Talep Et"
 COG_claim_the_great_lakes_desc:0 "Bir zamanlar olduğumuz çeşitli büyük göller krallıkları, şimdi hepsi yabancı güçler tarafından boyunduruk altına alındı. Bu eski krallıklardan biri olarak, bölge üzerinde herhangi bir emperyalist güçten daha meşru bir iddiamız var ve bu nedenle onu en kısa zamanda kendimiz için almalıyız."
 COG_closer_cooperation_with_eugene_jungers:0 "Eugène Jungers ile Daha Yakın İşbirliği"
 COG_closer_cooperation_with_eugene_jungers_desc:0 "Eugène Jungers, Ruanda-Urundi sömürgesinin mevcut valisidir. Onun lütfunu kazanabilirsek, daha yakın çalışabilir ve sonunda sömürgedeki mevcut kaynakları kendi yararımıza kullanabiliriz."
 COG_closer_cooperation_with_eugene_jungers_tt:0 "§YRuanda-Urundi§! ve §YTungsten Madenlerini Genişlet§! odaklarını açar!"
 COG_coastal_defence_fleet:0 "Kıyı Savunma Filosu Geliştir"
 COG_coastal_defence_fleet_desc:0 "Boma ve Matadi'nin düzgün bir şekilde korunması gerekiyor. Bu, sadece kıyılarımıza yakın kalma temel amacıyla güçlü gemiler inşa ederek başarılabilir."
 COG_colonial_administration:0 "Sömürge Yönetimi"
 COG_colonial_administration_desc:0 "Eskiden ulusumuz üzerindeki Alman sömürge yönetiminden öğrendiklerimizi, Afrika'yı kendimiz daha iyi yönetmek için kullanmalıyız."
 COG_colonial_administration_tt:0 "§YOrta Afrika§!'da §YEyaletleri Entegre Etmek§! için kararlar açar!"
 COG_comitted_to_our_overlords_war_flag:0 "Hakim devletimizin savaşına tamamen bağlı kalmayı seçtik"
 COG_command_post_albertville:0 "Komuta Merkezi Albertville"
 COG_command_post_albertville_desc:0 "Güneydoğu nehirlerimizi daha iyi devriye gezmek için Albertville'de bir komuta merkezi kurmalıyız."
 COG_command_post_goma:0 "Komuta Merkezi Goma"
 COG_command_post_goma_desc:0 "Kuzeydoğu nehirlerimizi daha iyi devriye gezmek için Goma'da bir komuta merkezi kurmalıyız."
 COG_command_post_matadi:0 "Komuta Merkezi Matadi"
 COG_command_post_matadi_desc:0 "Batı nehirlerimizi daha iyi devriye gezmek için Matadi'de bir komuta merkezi kurmalıyız."
 COG_congo_and_the_war_in_europe:0 "Kongo ve Avrupa'daki Savaş"
 COG_congo_and_the_war_in_europe_desc:0 "Hakim devletimiz bir yabancı güç tarafından saldırıya uğradı ve savaş sonunda sınırlarımıza kadar yayılabilir. Savaş için hazırlanma ve onlar teslim olsa da bizim asla teslim olmayacağımızı iddia etme zamanı geldi!"
 COG_congolese_bussinessowners:0 "Kongolu İşletme Sahipleri"
 COG_congolese_bussinessowners_desc:0 "Toplumumuzun uzun yıllar süren kurumsallaşmış baskıdan iyileşmesi ve daha adil bir topluma doğru adımlar atması için, Kongolu vatandaşları kendi işlerini kurmaya teşvik etmeye başlamalıyız, umarız pazara girebilirler."
 COG_contract_the_empain_group:0 "Empain Grubu ile Sözleşme Yap"
 COG_contract_the_empain_group_desc:0 "Empain grubu 1881'de Édouard Empain tarafından kuruldu ve zamanımızın en büyük şirketlerinden biridir. Diğer şeylerin yanı sıra tramvaylar, demiryolları, elektrik üretimi, inşaat ve madencilikten sorumlu olan bu grup, Belçika, Fransa, Rusya, Mısır ve Çin'de faaliyet göstermektedir ve doğu Belçika Kongosu'nun gelişiminde zaten büyük bir rol oynamıştır. Hizmetlerine çok ihtiyaç var!"
 COG_contract_the_empain_group_tt:0 "Empain Grubu tarafından işletilen §YMadenleri Genişletmek§! ve §YŞirketlere Yatırım Yapmak§! için kararlar açar"
 COG_cooperate_with_the_comite_special_du_katanga:0 "Katanga Özel Komitesi"
 COG_cooperate_with_the_comite_special_du_katanga_desc:0 "Belçika Kongosu'nun önceki valisi olan Auguste Tilkens, şimdi 1900'de kurulan ve Katanga ilinin kaynaklarını yönetmek ve işletmekten sorumlu olan yarı devlet bir organ olan Comité Spécial du Katanga'nın başında. Bu organizasyonu en geniş ölçüde kullanmak akıllıca olacaktır."
 COG_cooperate_with_the_congolese_churches:0 "Kongo Kiliseleriyle İşbirliği Yap"
 COG_cooperate_with_the_congolese_churches_desc:0 "Kiliseler, doğası gereği muhafazakar olsalar da, bize karşı çıkmıyorlar ve yönetimimiz için büyük bir tehdit değiller. Bu nedenle, bunun yerine onların iyi tarafında olduğumuzdan emin olmak ve onları ulusal aygıtımızın bir parçası yapmak en iyisi olacaktır."
 COG_days_left_for_rebellion_tt:0 "Mevcut günler: [?COG_time_until_annex_angola_rebellion:days|Y0]"
 COG_declaration_of_congolese_unity:0 "Kongo Birliği Bildirgesi"
 COG_declaration_of_congolese_unity_desc:0 "Bakongo halkı şu anda uluslararası sınırlarla ayrılmış olarak yaşıyor. Halkımızı en kısa zamanda birleştirmeye çalışmalı ve bu amaçla Bakongo'nun gelecek yüzyıllar boyunca gelişebilmesini sağlamalıyız."
 COG_declaration_of_congolese_unity_tt:0 "§Yİşgal Edilmiş Kongo Topraklarını Entegre Etmek§! için kararlar açar!"
 COG_desgregate_the_universites:0 "Üniversitelerde Ayrımcılığı Kaldır"
 COG_desgregate_the_universites_desc:0 "Ulusumuzda, belirli bir eğitim derecesinin üzerine çıkmalarına izin vermeyen üniversite politikaları tarafından boğulan ve ezilen birçok parlak zihin var. Ulusumuza yardım etmek isteyen ancak edemeyen birçok kişi olduğu için buna derhal bir son vermeliyiz."
 COG_devout_catholic_kingdom:0 "Dindar bir Katolik Krallığı"
 COG_devout_catholic_kingdom_desc:0 "Afrika'daki ilk Katolik krallıklarından biri olarak, dinin ve Papa'nın meşruiyetinin önemini biliyoruz. Yüzyıllardır yaşadığımız çekişmelerden kurtulacaksak, Hristiyan ideallerimize sadık kalmalıyız."
 COG_emergency_powers_for_pierre_ryckmans:0 "Sömürge Valisi İçin Acil Durum Yetkileri"
 COG_emergency_powers_for_pierre_ryckmans_desc:0 "Belçika'daki hükümetle iletişim kesildiğinden beri yönetimimiz tamamen durma noktasına geldi. Bu nedenle, daha fazla yetkiyle hareket edebilmemiz için Ryckmans ve Vleeschauwer'e acil durum yetkileri vermeliyiz."
 COG_encourage_unionism:0 "Sendikacılığı Teşvik Et"
 COG_encourage_unionism_desc:0 "Kongo'da, teorik eşitleriyle aynı miktarda maaş almayan birçok kişi var. Bu sorunu çözmek için halkımızı sendikalaşmaya teşvik etmeliyiz, çünkü ancak birlikte çalışarak daha iyi bir gelecek getirebiliriz!"
 COG_endorse_force_publique_mutinies:0 "Force Publique İsyanlarını Onayla"
 COG_endorse_force_publique_mutinies_desc:0 "Force Publique, Sömürge yetkililerinin bir aracı olsa da, örgüt içinde medenileştirme misyonunun gerçekte ne olduğunu gören birçok kişi var. Onları en iyi hareket tarzının bir isyan olduğuna ve ancak böyle bir şeyle tam bağımsızlık kazanabileceğimize ikna etmeliyiz."
 COG_endorse_force_publique_mutinies_tt:0 "Eğer §YDemir Tavındayken Vur§! odağı tamamlandığında isyanlar ya bitmiş ya da hala devam ediyorsa, ruh iç savaştaki düşmanımızı ciddi şekilde etkileyecektir"
 COG_enter_the_sterling_area:0 "Sterlin Sahasına Gir"
 COG_enter_the_sterling_area_desc:0 "İngilizler, hakim devletimiz yabancı işgali altındayken onlardan bağımsızlığımızı korumamıza izin vermeleri karşılığında, Sterlin Sahasına katılmamızı ve onlara sübvansiyonlar ödememizi ve sömürge piyasası fiyatlarını takip etmemizi talep ettiler. Ekonomik olarak bizim için harika olmayacak, ama ödemek zorunda kalacağımız bir bedel."
 COG_establish_new_sabena_air_routes:0 "Yeni SABENA Hava Rotaları Kur"
 COG_establish_new_sabena_air_routes_desc:0 "Societé Anonyme Belge d'Exploitation de la Navigation Aérienne, geniş ulusumuzun büyük nüfus merkezleri arasında hava taşımacılığı sağlayarak bize uzun zamandır faydalı olmuştur. Belki de devletin daha uzak bölgelerinden bazılarına yeni rotalar kurmaya çalışabiliriz, böylece ulaşım ve iletişim yönetimi çok daha kolay hale gelir."
 COG_establish_the_anc:0 "Armée Nationale Congolaise'i Kur"
 COG_establish_the_anc_desc:0 "Taleplerimiz çoktu, ama şimdiye kadar nihayet karşılandılar. Bugün, karşılaşabileceğimiz gelecekteki herhangi bir düşmana karşı dimdik durabilecek uygun bir Kongo ordusu kurma günüdür."
 COG_establish_the_anc_locking_tt:0 "§RGelecekte herhangi bir Force Publique odağının alınmasını kilitler§!"
 COG_establish_the_anc_modifier_tt:0 "§YForce Publique§! ulusal ruhunu kaldırır ve onu §YArmée Nationale Congolaise§! ile değiştirir, önceden kazanılan bonusların yaklaşık yarısını korur"
 COG_establish_the_west_african_national_secretariat:0 "Afrika Ulusal Sekreterliği"
 COG_establish_the_west_african_national_secretariat_desc:0 "Pan-Afrika kongresinde kararlaştırılanları hayata geçirme zamanı geldi. Bu karanlık çağın bir kez ve herkes için sona ermesi için devrimcilere silah tedarik etmeli ve küresel anti-sömürgeci mücadeleye yardım etmeliyiz!"
 COG_evolue_in_politics:0 "§YÉvolué§!, §Y[COG.GetAdjective]§! Siyasetine girdi"
 COG_expand_banana_plantations:0 "Muz Plantasyonlarını Genişlet"
 COG_expand_banana_plantations_desc:0 "Muz, her sağlıklı ekonominin can damarıdır. Halkımızın ve ekonomimizin her ikisinin de tatmin olabilmesi için muz üretimimizi on katına çıkarmaya çalışmalıyız."
 COG_expand_production_facilities:0 "Üretim Tesislerini Genişlet"
 COG_expand_production_facilities_desc:0 "Askeri teçhizat üretimimizi artırmamız gerekiyor ve bunu yapmanın tek yolu, bunu yapma yeteneğine sahip yeni tesisler inşa etmektir."
 COG_expand_shipping_industry:0 "Gemicilik Sanayini Genişlet"
 COG_expand_shipping_industry_desc:0 "Ulusumuzdaki birçok yere ya hava yoluyla ya da nehirlerle ulaşmak zordur. Diğer bir önemli şey de deniz aşırı yabancı ülkelere bağlantılardır ve bu nedenle modernleşen ulusumuzun taleplerini karşılamak için gemicilik sanayilerimizi genişletmeliyiz."
 COG_expanded_peasantry_program:0 "Genişletilmiş Köylülük Programları"
 COG_expanded_peasantry_program_desc:0 "Tarım sektörümüz ülkemizdeki en büyüğüdür ve modernleşmek için yoğun bir şekilde yatırım yapılması gerekecektir ve tam olarak bunu yapacağız."
 COG_force_arienne_congolaise:0 "Force Aérienne Congolaise"
 COG_force_arienne_congolaise_desc:0 "Düşmanlarımızla düzgün bir şekilde başa çıkmak için, hava filolarımızı yeniden organize etmeli ve yeni kurulan askeriyemizde uygun bir hava kuvvetleri şubesi kurmalıyız."
 COG_force_publique_reformed_flag:0 " Force Publique, Armée Nationale Congolaise olarak yeniden düzenlendi"
 COG_forces_terrestres:0 "Forces Terrestres"
 COG_forces_terrestres_desc:0 "Herhangi bir ordunun en önemli kısmı kara savaşı bileşenidir ve bizimki çok arzulananı bırakıyor. Düşmanlarımıza karşı dimdik durabilmesi için ona yatırım yapmalıyız."
 COG_form_the_gecamines:0 "Gécamines'i Kur"
 COG_form_the_gecamines_desc:0 "Bir sonraki adım, Géomines'i yeni kurulan devlete ait şirketimiz La Générale des Carrières et des Mines ile birleştirerek millileştirmektir. Bunu yaparak, ulusumuzun kaynakları nihayet bizim olacaktır."
 COG_formally_recognize_the_kimbanguist_church:0 "Kimbanguist Kilisesi'ni Resmen Tanı"
 COG_formally_recognize_the_kimbanguist_church_desc:0 "Kendini İsa Mesih'in özel elçisi ilan eden Simon Kimbangu, uzun yıllardır yönetimimizin baş belası olmuştur. Ancak hareketinin yerel halktan topladığı destek miktarıyla, İsa Mesih'in yeryüzündeki Kilisesi'ni özel Elçisi Simon Kimbangu tarafından ulusumuz içinde meşru bir dini grup olarak resmen tanıma zamanı gelmiş olabilir."
 COG_foster_a_personality_cult:0 "Bir Kişilik Kültü Geliştir"
 COG_foster_a_personality_cult_desc:0 "Afrika halkına refah getirebilecek [ROOT.GetLeader]'den başka kimse yoktur. O, bağımsızlığımızın temelleri olarak duran büyük liderdir ve buna göre muamele görmelidir."
 COG_found_the_congolese_national_movement:0 "Kongo Ulusal Hareketi'ni Kur"
 COG_found_the_congolese_national_movement_desc:0 "Kongo'nun yaşadığı etnik ve dinler arası mücadelelere rağmen birlikte çalışabilmesi için, Kongo'yu olabileceğinin en iyisi yapmaya adanmış birleşik bir cephe örgütü oluşturmalıyız. Bu amaçla, Patrice Lumumba, Mouvement national Congolais'i kurmayı önerdi."
 COG_found_the_parti_solidaire_africain:0 "Parti Solidaire Africain'i Kur"
 COG_found_the_parti_solidaire_africain_desc:0 "Pan-Afrikanist hareket her geçen gün güçleniyor ve Afrika'daki en büyük devletlerden biri olarak, bu gelişmelerin gerisinde kalmamıza izin verilemez. Bu nedenle, kıtamızdaki sosyalist ve demokratik devletler arasında işbirliğini ilerletme amacıyla Afrika Karşılıklı Partisi'ni kurmalıyız."
 COG_french_as_martial_language:0 "Savaş Dili Olarak Fransızca"
 COG_french_as_martial_language_desc:0 "Geleneksel olarak, Force Publique, askeriyede birincil dil olarak Fransızca'yı kullanmıştır. Bunun kazanan bir konsept olduğu kanıtlanmıştır ve yakın zamanda değiştirmemiz için hiçbir neden yoktur."
 COG_friendship_with_france:0 "[FRA.GetName] ile Dostluk Antlaşması"
 COG_friendship_with_france_desc:0 "[FRA.GetNameDefCap] bizi sömürgeleştirmiş olabilir, ancak nominal bağımsızlığımıza izin verdiler ve bunun için minnettarız. Geçmişteki yanlışları düzeltmeye ve onlarla bir ittifak kurmaya çalışmalıyız."
 COG_from_a_gendarmerie_to_a_fighting_force:0 "Bir Jandarmadan Bir Savaş Gücüne"
 COG_from_a_gendarmerie_to_a_fighting_force_desc:0 "Force Publique köklerimizi geride bırakıp ordumuzu bir zamanlar olduğu jandarmaya daha az, uygun bir savaş gücüne daha çok benzeyecek şekilde yeniden yapılandırmanın zamanı geldi."
 COG_german_east_africa:0 "Alman Doğu Afrikası"
 COG_german_east_africa_desc:0 "Bir kez daha katlanabilmeleri için eski Alman Doğu Afrikası topraklarına doğru ilerlemeliyiz!"
 COG_german_south_west_africa:0 "Alman Güney Batı Afrikası"
 COG_german_south_west_africa_desc:0 "Bir kez daha katlanabilmeleri için eski Alman Güney Batı Afrikası topraklarına doğru ilerlemeliyiz!"
 COG_german_west_africa:0 "Alman Batı Afrikası"
 COG_german_west_africa_desc:0 "Bir kez daha katlanabilmeleri için eski Alman Batı Afrikası topraklarına doğru ilerlemeliyiz!"
 COG_governor_general_pierre_ryckmans:0 "Genel Vali Pierre Ryckmans"
 COG_governor_general_pierre_ryckmans_desc:0 "[BEL.GetNameDef]'daki bakanların devletimiz için birçok planı olsa da, tek onlar değil. Pierre Ryckmans'ın da kendi büyük bir vizyonu var ve ulusun durumunu iyileştirmek için idari bilgisini kullanmak akıllıca olacaktır."
 COG_great_cattle_chiefs:0 "Büyük Sığır Şefleri"
 COG_great_cattle_chiefs_desc:0 "Eskiden bizi öne çıkaran şey, organize etme ve yönetme konusunda yetenekli büyük şeflerimizdi. Tarım alanımızı herkesten daha güçlü yapabilirlerdi ve bu, acilen geri getirmemiz gereken bir şeydir."
 COG_great_military_chiefs:0 "Büyük Askeri Şefler"
 COG_great_military_chiefs_desc:0 "Eskiden bizi öne çıkaran şey, büyük askeri komutanlarımızdı. Mevcut olanlarımızın geçmiştekilere yetişebilmesi için katı eğitim rejimleri uygulamalıyız."
 COG_guerilla_tactics_drills:0 "Gerilla Taktikleri Tatbikatları"
 COG_guerilla_tactics_drills_desc:0 "Arazimiz vur-kaç taktikleri için mükemmeldir. Bu nedenle, askerlerimizi bu teknikleri en üst düzeyde avantajlarına kullanmaları için eğitmeyi hedeflemeli ve karşılaştığımız herhangi bir istilacıyı geri püskürtebildiğimizden emin olmalıyız."
 COG_hold_the_pan_african_congress:0 "Pan-Afrika Kongresini Düzenle"
 COG_hold_the_pan_african_congress_desc:0 "Tüm etkili Afrikalı politikacılar bir araya gelmeli ve kıtanın geleceğine birlikte karar vermelidir. Gündemde sömürgeci devletlere karşı isyan ve Afrika halklarının özgürleşmesi olmalıdır."
 COG_improve_colonial_lawmaking:0 "Sömürge Yasalarını İyileştir"
 COG_improve_colonial_lawmaking_desc:0 "Yasalarımız çoktur ve çoğu, Bağımsız Devlet zamanlarından beri yürürlükte olan ağır bir şekilde eskimiştir. Ünlü sömürge avukatı Robert de Mûelenaere'i, ulusumuzdaki birçok eski yasayı yeniden yazmasına yardımcı olması için görevlendirmek en iyisi olacaktır."
 COG_improve_the_civil_administration:0 "Sivil Yönetimi İyileştir"
 COG_improve_the_civil_administration_desc:0 "Uzak bölgelerimizin birçoğundaki yönetim, arzulanan çok şeyi bırakıyor. Eğer ülkemiz bir gün dilediğimiz gibi sorunsuz ve kusursuz bir şekilde işleyecekse, bunu iyileştirmek için çabalamalıyız."
 COG_increased_powers_for_colonial_governors:0 "Sömürge Valileri İçin Artırılmış Yetkiler"
 COG_intore_infantry_recruitment:0 "7 §Ypiyade§! taburundan oluşan bir seçkin birim kazan"
 COG_invest_in_geomines:0 "Géomines'e Yatırım Yap"
 COG_invest_in_geomines_desc:0 "Compagnie Géologique et Minière des Ingénieurs et Industriels Belges, ülkemizin güneydoğusundaki devasa metal cevheri yataklarının çıkarılmasında ve işletilmesinde büyük bir rol oynamıştır ve dünyanın en büyük kalay üreticilerinden biridir. Şimdi onlara yatırım yaparsak, uzun vadede ekonomimize kesinlikle yardımcı olabilirler."
 COG_invest_in_rubber_plantations:0 "Kauçuk Plantasyonlarına Yatırım Yap"
 COG_invest_in_rubber_plantations_desc:0 "Kauçuk, ekonomimizin yakıtıdır ve yabancı güçlerle faydalı ticaret anlaşmaları kurmamıza yardımcı olabilir. Bu nedenle, yoğun bir şekilde yatırım yapmamız gereken bir sektördür."
 COG_invest_in_the_textile_industry:0 "Tekstil Sanayisine Yatırım Yap"
 COG_invest_in_the_textile_industry_desc:0 "Ulusumuzu refaha erdirmek için, geleneksel Kuba tekstillerinin yaratılmasına yatırım yapmalı ve bunları uluslararası pazarda satmalıyız."
 COG_invest_in_urban_centers:0 "Şehir Merkezlerine Yatırım Yap"
 COG_invest_in_urban_centers_desc:0 "Ulusumuz geniş ve halkımız çok. Ancak, etrafta yetecek kadar para yok ve eğer bir yere yatırım yapacaksak, kırsal kesim ihmal edilecektir. Ancak bu, en büyük iki kasabamız olan Léopoldville ve Élisabethville'e yatırım yapmamızı engellemeyecektir."
 COG_invite_german_kasierist_exiles:0 "Alman Monarşistlerini Davet Et"
 COG_invite_german_kasierist_exiles_desc:0 "Görünüşe göre Almanlar şanlı Kayserilerinden vazgeçip gerçek vasatlığa razı olmuşlar. Sadık Alman monarşistlerini ulusumuza davet etmeye ve gerçek bir Mittelafrika kurmaya çalışmalıyız!"
 COG_invite_german_kasierist_exiles_tt:0 "§YCarl Friedrich Goerdeler§!, §YPaul von Lettow-Vorbeck§! ve §YAlfred Hugenberg§! bize katılmak için Afrika'ya seyahat ediyor"
 COG_invite_kwame_to_the_capital:0 "Kwame Nkrumah'ı Başkente Davet Et"
 COG_invite_kwame_to_the_capital_desc:0 "Kwame Nkrumah, etkili ve popüler bir Pan-Afrikanist Ganalı politikacıdır. Hareketle iyi ilişkiler kurmak için onu başkentimize davet etmeliyiz ve belki de bize birden fazla yönden faydalı olabilir."
 COG_invite_the_general_labour_federation_of_belgium:0 "Belçika Genel Emek Federasyonu"
 COG_invite_the_general_labour_federation_of_belgium_desc:0 "Belçika Genel Emek Federasyonu, Sendika Komisyonu'nun yerine kuruldu ve etkisini Belçika anakarasının ötesine genişletmek istiyor. Bağlantılarımız sayesinde, Kongo'da kök salmalarını sağlayabilir ve halkımızın katılabileceği birleşik bir organizasyon sağlayabiliriz."
 COG_join_the_comitern:0 "Komintern'e Katıl"
 COG_join_the_comitern_desc:0 "Sovyetler Birliği'nde, sömürgecilik çağını sona erdirmekten başka bir şey istemeyen ideolojik müttefiklerimiz var. Bu nedenle, onlarla daha yakın diplomatik bağlar kurmalıyız, hatta belki bir ittifak aramalıyız."
 COG_kasa_vubus_first_cabinet:0 "Kasa-Vubu'nun İlk Kabinesi"
 COG_kasa_vubus_first_cabinet_1_tt:0 "§YDemokratik§! olacağız ve §YJoseph Kasa-Vubu§!, §YKongo Ulusunun Kurucu Babası§! özelliğini kazanacak!"
 COG_kasa_vubus_first_cabinet_2_tt:0 "§YJoseph Kasa-Vubu§!, §YKongo Ulusunun Kurucu Babası§! özelliğini kazanacak ve §Yİstikrar§! ve §YSiyasi Güç§! kazanacağız!"
 COG_kasa_vubus_first_cabinet_desc:0 "İlk serbest seçim sonuçlandı ve Joseph Kasa-Vubu birinci çıktı. Şimdi, ilk Kongolu bakanlar kabinesini kurmak için çok çalışıyor. Tüm ulus boyunca son derece popüler olması ve işinde mükemmel olması nedeniyle, gelecek birçok nesil boyunca büyük bir başkan olarak hatırlanacağı kesindir."
 COG_lecho_du_katanga:0 "L'Écho du Katanga"
 COG_lecho_du_katanga_desc:0 "Katanga'nın Yankısı, Élisabethville'den sosyal-sömürgeci kurucu Jean Decoster ve editör Albert Decoster tarafından yayınlanan bir gazetedir. Birlikte, Kongo'da Avrupa Yerleşimini teşvik ediyorlar, bu da büyüyen ulusumuzu daha hızlı geliştirmek için bağlanmaya değer bir şey olabilir."
 COG_liberation_by_force:0 "Zorla Kurtuluş"
 COG_liberation_by_force_desc:0 "Afrika halkı kendilerini kurtarma gücüne sahip değil. Bunun yerine, onları zalimlerinden kurtarmak için çabalamalıyız, böylece uzun zaman önce olduğu gibi bir kez daha özgürlüğü deneyimleyebilirler."
 COG_make_contact_with_irving_brown:0 "Irving Brown ile Temas Kur"
 COG_make_contact_with_irving_brown_desc:0 "Amerikan sendikacı ve Amerikan Emek Federasyonu lideri Irving Brown'ın uzun zamandır Cyrille Adoula ile bağları var ve ABD Ordusu'nun bir teğmeni olarak, onu kendi tarafımıza çekmek oldukça değerli olabilir. Onu bir temas noktası olarak kullanarak, sendikalarla bağlantısı olan Amerikalılardan yatırım elde etmeye çalışabiliriz."
 COG_make_use_of_the_british_proposal:0 "İngiliz Teklifini Değerlendir"
 COG_make_use_of_the_british_proposal_desc:0 "İngilizler, Belçika'daki hükümetin zayıflığını görerek, onlara birkaç maden ve kauçuk plantasyonu hakkı vermemiz koşuluyla, ittifaklarının bir parçası olarak bağımsız bir Kongo devletine izin vereceklerini teklif ettiler. Kabul etmenin akıllıca olacağı bir teklif!"
 COG_make_use_of_the_british_proposal_in_negotations:0 "Sömürgeci efendilerimizle gelecekteki müzakereler sırasında bağımsızlık için baskı yapmak üzere §Y[538.GetName]§! ve §Y[890.GetName]§!'ye kaynak hakları karşılığında §Yİngiliz Desteğini§! kullanabileceğiz."
 COG_make_use_of_the_british_proposal_tt:0 "Eğer Belçika §YBelçikalıların Kralı§! odağını tamamlamadıysa, Belçika'dan bağımsızlığımızı müzakere ederken İngiliz desteğini kullanma yeteneği kazanacağız. Ancak eğer §Yİşbirlikçi Kralı Güçlendirdilerse§!, İngiliz desteğini kullanarak derhal bağımsızlık ilan edebileceğiz. \n\nMevcut etkiler:"
 COG_manifeste_convience_africaine:0 "Le Manifeste de Conscience Africaine"
 COG_manifeste_convience_africaine_desc:0 "Kongo ulusal bilinci şekillenmeye başlıyor ve évolué, Jef Van Bilsen'in otuz yıllık planından hayal kırıklığına uğramaya başladı. Kongolu aydınların seslerini duyurma ve dünyaya Kongo'nun nereye gittiğini gösterme zamanı geldi!"
 COG_marine_nationale:0 "Marine Nationale"
 COG_marine_nationale_desc:0 "Daha önce yoğun bir şekilde yatırım yapmadığımız bir şey olsa da, bir deniz kuvveti çoğu modern ulus için bir zorunluluktur. Tek soru, kuvveti Atlantik Okyanusu'na gönderme amacıyla mı inşa etmek istediğimiz yoksa Kongo havzasındaki birçok nehirde daha iyi çalışacak şekilde mi yapılandırmak istediğimizdir."
 COG_mend_the_linguistic_divides:0 "Dilsel Bölünmeleri Onar"
 COG_mend_the_linguistic_divides_desc:0 "Ulusumuz içinde büyük bölünmeler var, en büyüklerinden biri ana dillerimiz olan Kikongo, Lingala, Svahili, Tshiluba ve Fransızca arasındaki dilsel bölünmedir ve ulusumuz içinde yüzlerce küçük dil bulunmaktadır. Gerçek eşitliği sağlamak istiyorsak, bunların birçoğuna resmi statü vermeliyiz."
 COG_military_service_for_citizenship:0 "Vatandaşlık İçin Askerlik Hizmeti"
 COG_military_service_for_citizenship_desc:0 "Ulusumuzda vatandaşlığı veya pasaportu olmayan birçok kişi var. Bu nedenle, bir zamanlar Romalıların yaptığı gibi yapmalı ve silahlı kuvvetlerimizin bir parçası olan herkese belirli bir süre sonra bunu sunmalıyız, böylece umarım yeni potansiyel askerleri çekeriz."
 COG_monarchism_didnt_work_out_flag:0 "Konsey bir hükümdar üzerinde karar kılamadı"
 COG_mutual_defense:0 "Karşılıklı Savunma"
 COG_mutual_defense_desc:0 "Dünya ulusları bizi sömürgeleştirme girişiminin bedelinin çok büyük olduğunu anlayana kadar Afrika halkı asla kalıcı bir barışa sahip olamayacak. Bunu başarmak için, Afrika Birliği Teşkilatı üyeleri, herhangi birimiz saldırıya uğrarsa birbirini koruma sözü veren bir karşılıklı savunma anlaşması oluşturmalıdır."
 COG_national_committee_for_liberation:0 "Ulusal Kurtuluş Komitesi"
 COG_national_committee_for_liberation_desc:0 "Kongo Ulusal Hareketi'nin zayıf merkezcileri, Jef Van Bilsen'in Belçika Afrikası'nın özgürleştirilmesi için otuz yıllık planına kısmen katılarak, asla gelmeyebilecek bir bağımsızlık konusunda uzlaşmaktan memnun görünüyor. Alevlerimizi söndürme şansı bulmadan önce sömürge yetkililerine karşı saldırmalıyız!"
 COG_national_committee_for_liberation_tt:0 "§RArtık bağımsızlığımızı barışçıl bir şekilde müzakere etmeye çalışamayacağız ve silahlı devrime bağlı kalacağız§!"
 COG_national_insitute_of_agronomic_study:0 "Ulusal Tarımsal Araştırma Enstitüsü"
 COG_national_insitute_of_agronomic_study_desc:0 "Tarımsal yöntemlerimizi ve topraklarımızı analiz etme ve iyileştirme niyetiyle bir organizasyon kurmalıyız. Bunu yaparak, ulusumuzu gerçekten geliştirebiliriz."
 COG_nationalization_of_foreign_industrial_assets:0 "Yabancı Sanayi Varlıklarını Millileştir"
 COG_nationalization_of_foreign_industrial_assets_desc:0 "Tarihimiz boyunca, birçok yabancı şirket ve holding, kaynaklarımızı ve insanlarımızı sömürmek için ulusumuza geldi. Bu sanayileri millileştirmeli ve kendi bünyemize katmalıyız."
 COG_new_empire_of_kitara:0 "Yeni Kitara İmparatorluğu"
 COG_new_empire_of_kitara_desc:0 "Büyük ve antik Kitara İmparatorluğu, doğu bölgemizdeki birçok yerli tarafından konuşulur. Bu mistik ve efsanevi devletin mantosunu alarak, büyük göller krallıkları üzerindeki iddialarımızı tamamen meşrulaştırabiliriz."
 COG_occupy_cabinda:0 "Cabinda'yı İşgal Et"
 COG_occupy_cabinda_desc:0 "Cabinda eyaleti, Loango ve Boma eyaletlerimizin arasında yer alıyor ve savaş dünya genelinde devam ederken, masum kardeşlerimizi daha fazla zarardan korumak için devreye girme zamanı geldi. Mevcut işgalcileri bu hamleden hoşlanmayabilir, ancak Afrika'nın geleceğini korumak için gereklidir."
 COG_occupy_cabinda_tt:0 "§RBu, [796.GetName]'nin sahibiyle savaşa yol açabilir!§!"
 COG_organization_of_african_unity:0 "Afrika Birliği Teşkilatı"
 COG_organization_of_african_unity_desc:0 "Şimdiye kadar, Avrupa sömürgeciliğinden kurtulmak sadece bağımsızlık kazanma meselesi olarak görülüyordu. Ancak, görünüşe göre hepimiz hala Afrika dışındaki birçok liderin gözünde potansiyel fetih hedefleriyiz. Afrika halkı, ancak bir araya gelerek ve işbirliği yaparak bir kez daha tebaa olmaktan kurtulmayı umabilir."
 COG_pan_african_congress:0 "Pan-Afrika Kongresi"
 COG_peacekeeping_forces:0 "Barışı Koruma Kuvvetleri"
 COG_peacekeeping_forces_desc:0 "Savaş şu anda Kongo'da mevcut olmasa da, dünyanın birçok köşesinde hala devam ediyor. Daha iyi bir gelecek için savaşmalıyız, bu, askerlerimizi uzak topraklardaki yabancı güçler için savaşmaya göndermek anlamına gelse bile."
 COG_prepare_for_offensive_action:0 "Saldırı Eylemine Hazırlan"
 COG_prepare_for_offensive_action_desc:0 "Anavatan'daki politikacılar bu savaştaki rolümüz konusunda kararsızlar, ancak onların kurtuluşu olabileceğimizi ve kahramanca eylemlerle bu savaş yoluyla bağımsızlığımızı kazanabileceğimizi unutmamalıyız. Herkes cepheye!"
 COG_proclaim_the_peoples_republic:0 "Kongo Halk Cumhuriyeti'ni İlan Et"
 COG_proclaim_the_peoples_republic_desc:0 "Yıllar önce halkımıza bu güne ulaşacağımızı düşünüp düşünmediklerini sorsaydınız, hayır derlerdi. Ama başardık. Bugün, uzun zamandır aranan Halk Cumhuriyetimizin kuruluşunu ilan edebileceğimiz gündür. Yaşasın başkan, yaşasın devlet!"
 COG_procure_foriegn_equipment:0 "Yabancı Teçhizat Tedarik Et"
 COG_procure_foriegn_equipment_desc:0 "Kendi uçaklarımızı geliştirip üretmek için ne teknik bilgiye ne de sanayiye sahip olmadığımız göz önüne alındığında, bunun yerine müttefiklerimizden tasarımları ödünç almaya ve uçak satın almaya odaklanmak akıllıca olacaktır."
 COG_progressive_congolese_students:0 "İlerici Kongolu Öğrenciler"
 COG_progressive_congolese_students_desc:0 "Ülkemizdeki birçok kişi sosyalist söyleme inanmaya başladığından, bu fikirlerin yayılabileceği ve daha da geliştirilebileceği gençlik örgütleri kurmak akıllıca olabilir. Gençlik gelecektir ve bu nedenle zamanı geldiğinde bizi yönetmek için neye ihtiyaçları olduğunu onlara öğretmeliyiz."
 COG_promote_marcel_maquet_to_provincial_commisioner:0 "Maquet'i İl Komiserliğine Terfi Ettir"
 COG_promote_marcel_maquet_to_provincial_commisioner_desc:0 "Marcel Maquet, bize Genç sömürge yöneticisi ve Bölge komiseri olarak iyi hizmet etti. Bu nedenle, rollerini daha geniş bir alanı kapsayacak şekilde genişletmek için onu İl komiserliğine terfi ettirmek akıllıca olacaktır."
 COG_prussia_of_africa:0 "Afrika'nın Prusyası"
 COG_prussia_of_africa_desc:0 "Biz, Mittelafrika, tüm Afrika'yı hakimiyetimiz altına alacak gerçek fatihleriz. Ordumuz ağır bir şekilde Prusyalılaştırıldı ve bize Afrika'nın Prusyası denmesi nadir değildir."
 COG_raf_and_saaf_cooperation:0 "RAF ve SAAF İşbirliği"
 COG_raf_and_saaf_cooperation_desc:0 "Pilotlarımızın çoğu Kraliyet Hava Kuvvetleri'ne katıldı. İngiliz Milletler Topluluğu ile daha fazla işbirliği yapmak bize acı verse de, onların uzmanlıklarını öğrenmek ve savaş alanındaki taktiklerini deneyimlemek bize büyük ölçüde yardımcı olacaktır."
 COG_reclaim_bujumbura:0 "Bujumbura'yı Geri Al"
 COG_reclaim_bujumbura_desc:0 "Eski başkentimizi kontrol etmezsek, kendimizi yeni Burundi Krallığı olarak iddia edemeyiz. Bölgeyi geri almak için elimizden gelen her şeyi yapmalıyız!"
 COG_reclaim_kigali:0 "Kigali'yi Geri Al"
 COG_reclaim_kigali_desc:0 "Eski başkentimizi kontrol etmezsek, kendimizi yeni Ruanda Krallığı olarak iddia edemeyiz. Bölgeyi geri almak için elimizden gelen her şeyi yapmalıyız!"
 COG_reclaim_loango:0 "Loango'yu Geri Al"
 COG_reclaim_loango_desc:0 "Şu anda durum böyle olmasa da, gerçek başkentimiz Loango [772.GetName]'de yatıyor ve dünyanın daha önce hiç görmediği türden büyük bir şehir haline getirilmeli. Ancak ilk adım onu güvence altına almak olacaktır."
 COG_reestablish_the_bouvandji:0 "Bouvandji'yi Yeniden Kur"
 COG_reestablish_the_bouvandji_desc:0 "11. yüzyılda Bouvandji, Woyo halkından bir demirciler kardeşliğiydi. Ateş ve demir üzerinde bir ustalıkları vardı ve Ngoyo Devleti'ni bizim üzerimizde hakimiyete götürdüler. Ancak son yıllardaki zaferimizle, bunun yerine onları kullanma zamanı gelmiş olabilir."
 COG_reestablish_the_royal_council:0 "Kraliyet Konseyini Yeniden Kur"
 COG_reestablish_the_royal_council_desc:0 "Genellikle en tepedekiler olarak anılan Kongo Krallığı Kraliyet Konseyi, eskiden yetkililerin ve soyluların yönetim organıydı. Bunu yeniden kurmalıyız, çünkü hiçbir kral gerçekten tek başına yönetemez."
 COG_royal_university_of_higher_education:0 "Kraliyet Yüksek Öğrenim Üniversitesi"
 COG_royal_university_of_higher_education_desc:0 "Bir ulus olarak ilerleyebilmek için, halkımızı bilimsel atılımlar yapmalarını sağlayacak şekilde eğitmeliyiz. Bu amaçla bir yüksek öğrenim üniversitesi kurmalıyız."
 COG_safeguard_cabinda:0 "Portekiz Kongosu'nu Koru"
 COG_safeguard_cabinda_desc:0 "Cabinda eyaleti bir zamanlar Kongo Krallığı'nın bir parçasıydı ve savaş dünya genelinde devam ederken, masum kardeşlerimizi daha fazla zarardan korumak için devreye girme zamanı geldi. Mevcut işgalcileri bu hamleden hoşlanmayabilir, ancak Afrika'nın geleceğini korumak için gereklidir."
 COG_scouting_the_terrain:0 "Araziyi Keşfetme"
 COG_scouting_the_terrain_desc:0 "Geniş cengellerimiz arazimizi geçmeyi zorlaştırıyor ve dahası, önemli şehirlerimize çok yaklaşmadan önce düşmanı tespit etmek zorlaşıyor. Bu nedenle, hava kuvvetleri hava keşfi sağlamada büyük bir rol oynamak zorunda kalacaktır."
 COG_secure_german_aid:0 "Alman Yardımı Sağla"
 COG_secure_german_aid_desc:0 "Bizi bağımsız görmek isteyen ya da en azından Belçikalı efendilerimizin zayıfladığını görmek isteyen birçok güç var. Bağımsızlığımızla bir bütün olarak çok az ilgileri olsa da, Almanlar Belçika'nın zayıfladığını görmekten başka bir şey istemezlerdi. Bu nedenle, en azından savaş sırasında güçlü bir müttefik olacaklardır."
 COG_secure_soviet_aid:0 "Sovyet Yardımı Sağla"
 COG_secure_soviet_aid_desc:0 "Bizi bağımsız görmek isteyen ya da en azından Belçikalı efendilerimizin zayıfladığını görmek isteyen birçok güç var. Savaştan sonra bile güvenebileceğimiz bir müttefik kazanmak istiyorsak, Sovyetler Birliği en iyi şansımız olabilir."
 COG_shatter_the_roof:0 "Çatıyı Parçala"
 COG_shatter_the_roof_desc:0 "Sonunda, halkımızın birçoğunun başının üzerinde her zaman mevcut olan görünmez çatıyı parçalama ve nihayet hayatlarını nasıl yaşamak istediklerini seçme özgürlüğünü deneyimlemelerine izin verme zamanı geldi!"
 COG_slander_the_colonial_authorities:0 "Sömürge Yetkililerini Karala"
 COG_slander_the_colonial_authorities_desc:0 "Şimdi yapmamız gereken, sömürge yetkililerine karşı büyük ölçekli bir propaganda kampanyası başlatmak ve bize yaptıkları ve hala yapmakta oldukları her şeyi halka ifşa etmektir. Ancak bunu yaparak halkın desteğini gerçekten kazanabiliriz."
 COG_slander_the_colonial_authorities_tt:0 "§RBu ulusal ruh, bağımsızlık savaşımızın sona ermesiyle kaldırılacaktır!§!"
 COG_socialist_education_reforms:0 "Sosyalist Eğitim Reformları"
 COG_socialist_education_reforms_desc:0 "İnsanlar, kabilecilik ve vahşilik tuzaklarına düşmeden kendi başlarına düşünebilmeleri için düzgün bir şekilde eğitilmelidir. Bu nedenle, eğitim sistemlerini ve müfredatını istediğimiz görüşlere uyacak şekilde şekillendirmeye çalışmalıyız."
 COG_societe_africaine_dexplosifs_congo:0 "Société Africaine d'Explosifs Congo"
 COG_societe_africaine_dexplosifs_congo_desc:0 "Kendi silahlarımızı daha iyi tedarik etmek için gereken başka bir şey de, taleplerimizi karşılayabilecek, kendi sınırlarımız içinde yer alan devlete ait bir şirkettir. Bu amaçla, bize ve sadece bize mühimmat üretebilmeleri için Société Africaine d'Explosifs Congo'yu kurmalıyız."
 COG_societe_nationale_chemins_du_congo:0 "Société Nationale des Chemins de fer du Congo"
 COG_societe_nationale_chemins_du_congo_desc:0 "Ülkemizin ne kadar geniş olduğu göz önüne alındığında, şu anda büyük bir çoğunluğu bakımsız durumda olan birçok demiryolumuzla ilgilenen ulusal bir ajans kurmak önemli olacaktır, böylece ülkemiz hiç olmadığı kadar bağlantılı olabilir."
 COG_south_atlantic_navy:0 "Güney Atlantik Donanması"
 COG_south_atlantic_navy_desc:0 "Bağımsızlığımızı düzgün bir şekilde güvence altına almak istiyorsak, sömürgeci güçlerin bir daha asla kıyılarımıza çıkamayacağından emin olmalıyız."
 COG_south_to_lake_malawi:0 "Malavi Gölü'ne Doğru Güney"
 COG_south_to_lake_malawi_desc:0 "Eski Kitara İmparatorluğu haritasında olmayan başka bir büyük göle doğru son bir hamle yapılması gerekecek. O göl Malavi Gölü'dür ve bölgedeki diğer tüm büyük göller gibi bizim olarak talep edilecektir."
 COG_south_to_lake_malawi_tt:0 "§YMalavi ve Zambezia-Moçambique'i Entegre Etmek§! için kararlar açar!"
 COG_spirit_of_loko_yima:0 "Loko Yima'nın Ruhu"
 COG_spirit_of_loko_yima_desc:0 "[ROOT.GetLeader], yaratılış sırasında gök babası Bumba tarafından kusulan, yeryüzündeki tanrı olan saf beyaz Loko Yima'nın ruhunu içinde taşır. Bu nedenle, herkes [ROOT.GetLeader]'in iradesini takip etmelidir."
 COG_standardize_military_production:0 "Askeri Üretimi Standardize Et"
 COG_standardize_military_production_desc:0 "Mevcut yabancı ve yerli teçhizat karmaşamızla, sanayilerimiz gerekli değiştirmeleri yeterince hızlı bir oranda üretemiyor. Bu nedenle, silahlı kuvvetlerimiz tarafından kullanılan teçhizatı standardize etmek için çalışmalıyız."
 COG_strengthen_the_banque_du_congo_belge:0 "Banque du Congo Belge'yi Güçlendir"
 COG_strengthen_the_banque_du_congo_belge_desc:0 "Hiçbir ülke uygun bir banka olmadan verimli bir şekilde yönetilemez ve biz de farklı değiliz. Ulusumuzdaki para durumu üzerinde daha güçlü bir hakimiyet kurmak için, Belçika devletine ait Banque du Congo Belge'yi güçlendirmeyi hedeflemeliyiz."
 COG_strict_anti_clericalism:0 "Katı Anti-Klerikalizm"
 COG_strict_anti_clericalism_desc:0 "Katolik ve Kimbanguist kiliselerinin rahipleri, sadece kendilerini düşünen açgözlü adamlardır. Eğer halkımız bir gün refaha erecekse, onların toplumumuz üzerindeki etkisini kesmeye çalışmalıyız."
 COG_strike_while_the_iron_is_hot_tt:0 "Birliklerimiz, bağımsızlık savaşını resmen başlatarak Léopoldville'e doğru yürüyüşe geçecek. §YLéopoldville§!, §YÉlisabethville§! ve §YStanleyville§!'i kontrol edersek veya düşmanımızı düzgün bir şekilde teslim alıp barışı zorlayabilirsek, eski efendilerimizle barışı zorlayabilecek ve tam bağımsızlık kazanabileceğiz. \n\nBenzer şekilde, §YLéopoldville§!, §YÉlisabethville§! ve §YStanleyville§!'i kontrol ederek bizimle barışı zorlayabilecek ve ülkemiz üzerindeki kontrollerini sürdürebilecekler."
 COG_strike_while_the_rion_is_hot:0 "Demir Tavındayken Vur"
 COG_strike_while_the_rion_is_hot_desc:0 "Zaman şimdi. Şimdi ya da asla. Ülkemizin sömürgeci baskıdan bir kez ve herkes için kurtulabilmesi için şimdi düşmanlarımızı vahşice vuracağız!"
 COG_supply_line_disruption_tactics:0 "İkmal Hattı Bozma Taktikleri"
 COG_supply_line_disruption_tactics_desc:0 "Düşman ikmal hatları tek bir hassas vuruşla kırılabilir. Bu, denizaltılarımız tarafından gerçekleştirilecek ve katıldığımız gelecekteki savaşların çok önemli bir parçası olacaktır."
 COG_the_african_union:0 "Afrika Birliği"
 COG_the_african_union_desc:0 "Afrika halkının bir Afrika Birliği'nde birleşme zamanı geldi. Afrika'nın ilk süper gücü olmaya çalışırken bir daha asla emperyalistler veya faşistler tarafından tehdit edilmeyeceğiz."
 COG_the_arme_populaire_de_liberation:0 "Armée Populaire de Libération"
 COG_the_arme_populaire_de_liberation_desc:0 "Devrimci kol herkese ulaşmalı ve vatandaşlarımızı koruyacak kadar güçlü olmalıdır. Bu amaçla, halkımızın bir daha asla güvenlikleri için endişelenmek zorunda kalmaması için kendi Armée Populaire de Libération'umuzu kurmalıyız!"
 COG_the_embodiment_of_god:0 "Tanrı'nın Vücut Bulmuş Hali"
 COG_the_embodiment_of_god_desc:0 "[ROOT.GetLeader], tanrının kendisinin vücut bulmuş halidir ve Büyük Göller çevresindeki tüm toprakları yönetme konusunda eşsiz bir ilahi hakka sahiptir. Yaşasın majesteleri!"
 COG_the_executive_council:0 "Yürütme Konseyi"
 COG_the_executive_council_desc:0 "Halkın iradesine göre hareket edecek ve bölgemizdeki istikrara yönelik tehditlere hızla yanıt verebilecek bir yürütme organı oluşturarak Afrika Birliği Teşkilatı'nda daha fazla işbirliği için baskı yapmalıyız."
 COG_the_intore_lion_dancers:0 "Intore Aslan Dansçıları"
 COG_the_intore_lion_dancers_desc:0 "Intore Aslan Dansçıları, Ruanda Mwami'sinin seçkin kraliyet muhafızlarıdır ve geleneksel Ruanda ordusu içinde genellikle Seçilmiş Olanlar olarak anılırlar. Bu silahlı kuvvetin merkezi hükümetin komutası altında olduğundan emin olmak en iyisi olacaktır."
 COG_the_invisible_roof_tt:0 "§YGörünmez Çatı§! ulusal ruhuna sahip!"
 COG_the_kingdom_of_kongo_focus:0 "Água Rosada Hanedanı"
 COG_the_kingdom_of_kongo_focus_desc:0 "Água Rosada Hanedanı, 19. ve 20. yüzyıllarda Kongo Krallığı'nın son yönetici hanedanıydı ve aynı zamanda Kongo İç Savaşı sırasında ana gruplardan biriydi. Mevcut hak iddia edeni olan VII. Dom Pedro, şimdi bir kez daha Kongo Kralı olarak taç giydi."
 COG_the_kings_divine_power:0 "Kralın İlahi Gücü"
 COG_the_kings_divine_power_desc:0 "Kralın yönetme konusunda ilahi bir hakkı vardır ve buna izin verilmelidir. Sadık tebaası için en iyisinin ne olduğunu bilir ve demir bir yumrukla yönetecektir."
 COG_the_lion_roars:0 "Aslan Kükrüyor"
 COG_the_lion_roars_1_tt:0 "§YKomünist§! olacağız ve ülke liderimiz olarak §YCyrille Adoula§! veya §YChristophe Gbenye§!'yi seçebileceğiz"
 COG_the_lion_roars_2_tt:0 "Ülke liderimiz olarak §YCyrille Adoula§!'yı tutmak isteyip istemediğimizi veya onu §YChristophe Gbenye§! ile değiştirmek isteyip istemediğimizi seçebileceğiz!"
 COG_the_lion_roars_desc:0 "Afrika halkı, bir zamanlar bizim de yaptığımız gibi, zalimlerinden kurtuluş özlemi çekiyor. Simbalar son zamanlarda büyük bir popülerlik kazandı ve şu anda, ulusal liderliği üstlenmelerini engelleyecek hiçbir şey yapılamaz."
 COG_the_ma_loango_focus:0 "Mâ Loango"
 COG_the_ma_loango_focus_desc:0 "Mâ Loango, Loango Krallığı'nın geleneksel hükümdarıdır. Şimdi bu unvanı benimsediğimize göre, bir zamanlar krallığın elinde bulunan eski toprakları yeniden entegre etmeye çalışmalıyız."
 COG_the_mwami_of_burundi_focus:0 "Burundi'nin Mwami'si"
 COG_the_mwami_of_burundi_focus_desc:0 "Şimdi Mwambutsa IV Bangiricenge'nin tahtımıza çıkmasıyla, Burundi Krallığı unvanını talep edebiliriz. Bunu yaparak, doğudaki küçük krallık üzerindeki iddiamızı meşrulaştırabileceğiz ve belki daha da ileri gidebiliriz."
 COG_the_nyim_of_kuba_focus:0 "Kuba'nın Nyim'i"
 COG_the_nyim_of_kuba_focus_desc:0 "Kuba Krallığı 1625'ten beri varlığını sürdürüyor ve 1884'te Uluslararası Kongo Birliği'nde bölgesel bir şefliğe dönüştürüldü. Hükümdarları şu anda Mbóp Mábíínc maMbéky olan Nyim'dir ve ulusumuzu eski şanına kavuşturabilecektir!"
 COG_the_pro_german_mwami_focus:0 "Alman Yanlısı Mwami"
 COG_the_pro_german_mwami_focus_desc:0 "Alman işbirlikçisi Ruanda'dan Yuhi V Musinga, naiplik konseyimiz tarafından seçildikten sonra şimdi ülkenin kontrolünü ele geçirdi. Ancak beklenmedik bir gelişmeyle, Kongo'yu Alman sömürge imparatorluğunun bir devamı olarak ilan etti ve Mittelafrikan Krallığı'nın hükümdarı olduğunu haykırdı!"
 COG_the_simba_movement:0 "Simba Hareketi"
 COG_the_simba_movement_desc:0 "Sömürgeci efendilerimizi devirmenin en iyi yolu, gerçekçi olmak ve sıradan halkın desteğini kazanmaktır. Bu amaçla, Christophe Gbenye, düşmanlarını vurdukları büyük bir aslanın vahşiliğini temsil etmesi amaçlanan Simbalar olarak bilinen bir grup örgütlüyor. Bağımsızlık kazanmak için en iyi şansımız onlar olacaktır!"
 COG_the_simba_movement_tt:0 "Kurtuluş savaşı başladığında, 3 §YSimba Hareketi Tümeni§! kazanacağız ve §YKomünizm§! popülaritesi yeterince yükselirse hükümeti devirip ulusal liderliği ele alabilecekler"
 COG_the_ten_year_plan:0 "On Yıllık Plan"
 COG_the_ten_year_plan_desc:0 "Sanayimizi yeniden ayağa kaldırmak için, Kongo'nun ekonomik ve sosyal gelişimi için on yıllık planı başlatmalıyız."
 COG_the_umwami_of_rwanda_focus:0 "Ruanda'nın Umwami'si"
 COG_the_umwami_of_rwanda_focus_desc:0 "Şimdi Mutara III Rudahigwa'nın tahtımıza çıkmasıyla, Ruanda Krallığı unvanını talep edebiliriz. Bunu yaparak, doğudaki küçük krallık üzerindeki iddiamızı meşrulaştırabileceğiz ve belki daha da ileri gidebiliriz."
 COG_time_until_annex_angola_rebellion:0 "Ayrılıkçı Harekete Destek hala sağlamlaşıyor"
 COG_to_be_annexed_angola_flag:0 "Kongo Krallığı Sadıkları"
 COG_traditional_masks_and_armor:0 "Geleneksel Maskeler ve Zırhlar"
 COG_traditional_masks_and_armor_desc:0 "Birliklerimizin moralini yükseltmek için, onları geleneksel Kuba zırhıyla donatmalıyız. Düşmanlarımızı geleneksel maskelerimizi kullanarak da korkutabiliriz."
 COG_triga_i_project:0 "TRIGA I Projesi"
 COG_triga_i_project_desc:0 "Enerjinin geleceği nükleer güçte yatmaktadır ve bu nedenle bilim insanlarımız Afrika'nın ilk nükleer enerji santrali olan TRIGA I'i üretmek için çok çalıştılar. Bu başarıldığında, gerekli görürsek gücünü askeriyemiz için yeniden kullanabilmeliyiz."
 COG_tutsi_warrior_training:0 "Tutsi Savaşçı Eğitimi"
 COG_tutsi_warrior_training_desc:0 "Büyük Tutsi savaşçılarımız, yıllar önce komşu krallıkları fethetmemize yardımcı oldu. Silahlı kuvvetlerimize sadece en zinde ve iyi eğitimli adamların katılabileceği şekilde askerliğimizi sıkılaştırmalıyız."
 COG_uniao_dos_povos_do_norte_de_angola:0 "União dos Povos do Norte de Angola"
 COG_uniao_dos_povos_do_norte_de_angola_desc:0 "União dos Povos do Norte de Angola, şu anda Kuzey Angola'da faaliyet gösteren ve eski topraklarımızı Kongo Krallığı'na yeniden katma hedefi olan bir gerilla hareketidir. Bu grubu finanse etmek akıllıca olacaktır."
 COG_uniao_dos_povos_do_norte_de_angola_tt:0 "Eğer ayrılıkçı devlet bağımsızlığını güvence altına alırsa, bize §YEntegre§! edilecek"
 COG_unify_east_africa:0 "Doğu Afrika'yı Birleştir"
 COG_unify_east_africa_desc:0 "Şimdi, Doğu Afrika'yı birleştirmeye çalışarak nihayet eski Ruanda krallarının hayallerini gerçekleştirebiliriz. Bu büyük bir başarıdır ve bize büyük bir şan getirecektir!"
 COG_union_nationale_des_travailleurs_du_congo:0 "Union Nationale des Travailleurs du Congo"
 COG_union_nationale_des_travailleurs_du_congo_desc:0 "Kongo merkezli, hem bizim hem de başka herhangi bir ulusun hükümetinden ayrı bir sendika kurmamız gerekiyor."
 COG_uplift_the_apostolic_vicar_of_leopoldville:0 "Léopoldville Apostolik Vekilini Yücelt"
 COG_uplift_the_apostolic_vicar_of_leopoldville_desc:0 "Belçika Kongosu Apostolik Vekilliği, 1888'de Papa XIII. Leo tarafından kuruldu ve devletimizdeki ana Katolik kurumudur. Ordinariusu, Léopoldville Apostolik Vekilleri olan Joris Six tarafından yönetilmektedir; eğer kilisenin desteğini kazanmak istiyorsak hükümette temsil edilmelidir."
 COG_utilize_sabena_for_military_purposes:0 "SABENA'yı Askeri Amaçlar İçin Kullan"
 COG_utilize_sabena_for_military_purposes_desc:0 "SABENA daha önce sadece sivil taşımacılık amaçlı kullanılıyordu. Ancak savaş arka bahçemize yaklaşırken, onları pilot eğitmek ve uçaklarını hava savaşı için yeniden donatmak için kullanmalıyız."
 COG_when_the_war_for_independence_starts_tt:0 "§YBağımsızlık Savaşı§! başladığında:"
 COG_women_in_the_military:0 "Kadınların Askeriyede Olmasına İzin Ver"
 COG_women_in_the_military_desc:0 "Şu anda, ulusumuzun kadınlarının askeri hizmete katılmasına izin verilmiyor, ancak bunu yapmak isteyen birçok vatansever kadın var. Mümkün olduğunca çok yetenekli askerin silahlı kuvvetlerimize katılması için yasalarımızı yeniden yazmalıyız."
 CONGO_african_union:0 "Afrika Birliği"
 CONGO_african_union_desc:0 "Pan-Afrikanizm fikirleri kıta boyunca güçlendi ve birçok özgür Afrika halkı ortak bir davayla birleşmek istiyor. Bunu kolaylaştırmalı ve tüm uluslarımızı daha da yakınlaştırabilecek bir örgüt kurmalıyız."
 CONGO_antwerp_diamond_district:0 "Anvers Elmas Bölgesi"
 CONGO_antwerp_diamond_district_desc:0 "Elmasların önde gelen üreticilerinden biri olmanın hoş bir yan ürünü, Anvers'in bu mineralin dağıtımı ve satışı için birincil merkez haline gelmesine yol açtı ve bu da bize çok somut bir gelir kaynağı sağlıyor."
 CONGO_appoint_van_overstraeten:0 "Van Overstraeten'i Ata"
 CONGO_appoint_van_overstraeten_desc:0 "Raoul van Overstraeten muhtemelen [BEL.GetAdjective] ordusundaki en yetenekli adamlardan biridir - sorun şu ki, kendisi de bunu biliyor. Kişiliği onu anavatanda popüler olmayan biri yaptı, ancak Büyük Savaş sırasında Kongo'da hizmet etti. Bu en yetenekli subayı geri getirmek için o nostaljiden yararlanabiliriz."
 CONGO_appoint_van_overstraeten_tt:0 "§YRaoul van Overstraeten§!, §YBelçika Kongosu§! için bir §YMareşal§! olmak üzere gönderilir!"
 CONGO_at_least_fourteen_focuses_done_tt:0 "§YSociété Générale de Belgique§! ve §YAfrika'nın Kalbi§!'nden kaynaklanan en az §Y14§! odak tamamlandı"
 CONGO_at_least_six_focuses_done_tt:0 "§YSociété Générale de Belgique§! ve §YAfrika'nın Kalbi§!'nden kaynaklanan en az §Y6§! odak tamamlandı"
 CONGO_aviation_militaire_de_la_force_publique:0 "Aviation Militaire de la Force Publique"
 CONGO_aviation_militaire_de_la_force_publique_desc:0 "Kongo'nun devasa boyutunun, bölgenin askeri ve polisliğini önemli bir zorluk haline getirdiği bir sır değil. Ancak mesafeleri kolaylıkla aşabilen bir ulaşım şekli var: uçaklar. Buna yatırım yapmamız ve göklerin kontrolünü elimizde tuttuğumuzdan emin olmamız bizim yararımıza olacaktır."
 CONGO_bakwanga_mine:0 "Bakwanga Madeni"
 CONGO_bakwanga_mine_desc:0 "Bakwanga bölgesinin özellikle elmas bakımından zengin olduğu keşfedildi. Bunlar Güney Afrika ve Hindistan'da bulunan büyük değerli taşlarla aynı olmasa da, bu, dünyanın en sert mineralinin olağanüstü büyük bir yatağıdır ve çok çeşitli endüstriyel amaçlar için kullanılabilir."
 CONGO_bakwanga_mine_tt:0 "§YMadenleri Genişletmek§! için kararlar açar!"
 CONGO_belgian_congo:0 "Belçika Kongosu"
 CONGO_belgian_congo_desc:0 "Sömürge, 1908'de Kongo Bağımsız Devleti'nin Belçika tacının sömürüsünden uzaklaştırılarak Belçika hükümetine ilhak edilmesinden sonra kuruldu. Belçika Kongosu, Belçika sömürge politikasının kalbindeki mücevher olmaya devam ediyor. "
 CONGO_belgian_devaluation:0 "Belçika Devalüasyonu"
 CONGO_belgian_devaluation_desc:0 "[BEL.GetAdjective] hükümeti bir devalüasyon politikası yürürlüğe koydu ve bu, Genel Vali'nin ithalat üzerindeki vergileri düşürmesine ve ihracat üzerindekileri artırmasına olanak sağladı. Bu, sömürge bütçesini önemli ölçüde iyileştirmelidir."
 CONGO_belgian_officer_corps:0 "Belçika Subay Kadrosu"
 CONGO_belgian_officer_corps_desc:0 "Şu anda Force Publique, bir Belçika subay kadrosu tarafından yönetiliyor, ancak Kuvvet boyut olarak genişledikçe, subay kadrosu buna uyacak şekilde büyümedi. Tüm bu yeni askerlerin düzgün bir şekilde yönetilmesini sağlamak için ek [BEL.GetAdjective] personel talep etmeliyiz."
 CONGO_ccci:0 "CCCI"
 CONGO_ccci_desc:0 "Compagnie du Congo pour le Commerce et l'Industrie, Kongo'da faaliyet gösteren büyük bir madencilik holdingidir. Çok sayıda maden çıkarına sahip olsalar da, öncelikle geliştirmelerine yardımcı olmak istediğimiz metalürjik kaynaklarıdır."
 CONGO_cheap_labor:0 "Ucuz İşgücü"
 CONGO_cheap_labor_desc:0 "İşgücünden en fazlasını elde etmek için kullanılabilecek bir dizi işgücü manipülasyon tekniği vardır, örneğin, işten atılma riskinin her zaman mevcut olmasını sağlamak için mümkün olduğunca az işgücü koruması sağlamak ve geçim için şirketlere bağımlı kalmalarını sağlamak."
 CONGO_chefs_coutumiers:0 "Chefs Coutumiers"
 CONGO_chefs_coutumiers_desc:0 "Chefs Coutumiers, [BEL.GetAdjective] yönetimi tarafından yerel yönetimi denetlemekle görevlendirilen bir kabile şefleri sınıfıdır. Bölgeye son zamanlarda artan yatırımla, kabile müttefiklerimizin bu önemli rolü sürdürmeleri için uygun şekilde teşvik edildiğinden ve desteklendiğinden emin olmalıyız."
 CONGO_chefs_coutumiers_tt:0 "Bir §YÉvolué§! orta sınıfı oluşmaya başlayacak."
 CONGO_cobalt_mine_tt:0 "§YKobalt Madenlerini Genişletmek§! için kararlar açar!"
 CONGO_colonial_ambitions:0 "Sömürge Hırsları"
 CONGO_colonial_ambitions_desc:0 "Kongo etkileyici bir toprak parçası, ama bu kıta büyük bir yer. Diğer sömürgeci uluslara Afrika için mücadelenin henüz bitmediğini göstermeliyiz."
 CONGO_compagnie_belge_maritime_du_congo:0 "Compagnie Belge Maritime du Congo"
 CONGO_compagnie_belge_maritime_du_congo_desc:0 "Compagnie Belge Maritime du Congo, Kongo ile [BEL.GetNameDef] arasında malzeme nakliyesinden sorumlu şirkettir. Hayati ticaretimizin aktığı atardamarların açık kalmasını sağlamak için onlara sübvansiyonlar sunmalıyız."
 CONGO_congo_army:0 "Kongo Ordusu"
 CONGO_congo_army_desc:0 "Yabancı güçlerin Kongo'yu ele geçirmekle ilgilendiği giderek daha açık hale geldi, bu nedenle Kongo'nun kendini daha yetenekli bir şekilde savunabilmesi ve belki de [BEL.GetName]'in yurtdışındaki nüfuzunu kullanmasına yardımcı olabilmesi için askeriyeye daha yoğun yatırım yapmalıyız."
 CONGO_congo_free_state:0 "Kongo Bağımsız Devleti"
 CONGO_congo_free_state_desc:0 "Sömürge yönetimi, herhangi bir özgürlük hayalini engellemede o kadar etkili oldu ki, Kongo'nun geleceği neredeyse belirlendi - Brüksel'den mutlak yönetimin başparmağı altında bir kez daha ezilmiş bir gelecek."
 CONGO_congo_investments:0 "Kongo Yatırımları"
 CONGO_congo_investments_desc:0 "Belçika merkezi hükümeti, Kongo'nun zenginliklerinin farkındadır ve bu nedenle bu zenginliği kullanabilir ve Belçika ekonomisinin daha da toparlanmasına yönlendirebiliriz. Tek gereken biraz ön yatırım."
 CONGO_congolese_generals:0 "Kongolu Generaller"
 CONGO_congolese_generals_desc:0 "Force Publique o kadar büyüdü ki, düzgün bir şekilde liderlik etmek için sömürge ithalatına güvenemeyiz. Afrikalılar bunu kendileri yapabileceklerinden daha fazlasını yapabilirler, bu yüzden onları kısıtlayan dışlayıcı politikaları ortadan kaldırmalı ve istisnai yeteneklere sahip yerlilerin subay kadrosuna girmesine izin vermeliyiz."
 CONGO_congos_place_in_the_world:0 "Kongo'nun Dünyadaki Yeri"
 CONGO_congos_place_in_the_world_desc:0 "Şimdiye kadarki yol, virajlar ve dönüşlerle doluydu, ancak Kongo'nun dünyadaki yerini alma zamanı geldi. Geçmişin geleceğimiz üzerinde ne kadar etkisi olacak? Şimdi karar verme zamanı."
 CONGO_copper_cartridges:0 "Bakır Fişekler"
 CONGO_copper_cartridges_desc:0 "Mermi kovanları. Onlarsız hiçbir modern savaş yapılamaz ve tesadüfen bakır, onları yapmak için en iyi malzemedir. Bakır korozyona dayanıklıdır ve bükülebilir olacak kadar yumuşaktır. Ne kadar şanslıyız ki, tam anlamıyla bir dağ dolusu bu maddenin üzerinde oturuyoruz!"
 CONGO_develop_infrastructure:0 "Altyapıyı Geliştir"
 CONGO_develop_infrastructure_desc:0 "Uzun zamandır Kongo'nun iyi altyapı bağlantılarına izin vermeyecek kadar büyük ve aşılmaz olduğu gerçeğiyle yüzleştik. Ancak bu, denemememiz gerektiği anlamına gelmez."
 CONGO_dominion_of_congo:0 "Kongo Dominyonu"
 CONGO_dominion_of_congo_desc:0 "Model bir sömürge olarak konumumuz iyi giyildi ve ulus, Kongo ile [BEL.GetName] arasında paylaşılan ortak zorluklar yoluyla olgunlaştı. Bu nedenle, bir dereceye kadar eşitlik sağlandı."
 CONGO_dominion_of_congo_tt:0 "§Y[COG.GetNameDefCap]§! artık §YÖzerklik Seviyesini§! §YArtıramayacak§! ve §Y[BEL.GetNameDef]§! artık onu §RAzaltamayacak§!"
 CONGO_establish_cometro:0 "Cométro'yu Kur"
 CONGO_establish_cometro_2_tt:0 "Eğer bir Kongo §YBağımsızlık Savaşı§! çıkarsa, §Y[KAT.GetNameDef]§! bizim tarafımıza katılacak ve §Y[889.GetName]§!'de 5 taburlu 2 §Ypiyade§! birimi kazanacak!"
 CONGO_establish_cometro_desc:0 "Force Publique, [BEL.GetAdjective] çıkarlarını Kongo'da güvence altına almada hayati bir rol oynadı, ancak bu, Avrupa silahlı kuvvetlerinin titiz standartlarına göre ayarlanmış profesyonel bir askeri organ değildir. Gerçek ordunun devreye girme zamanı geldi."
 CONGO_establish_cometro_tt:0 "Eğer Hakim Devletimize karşı bir §YBağımsızlık Savaşı§! çıkarsa, §Y[KAT.GetNameDef]§! hakim devletlerimizin tarafına katılacak ve §Y[889.GetName]§!'de 5 taburlu 2 §Ypiyade§! birimi kazanacaklar!"
 CONGO_establish_university_of_louvain:0 "Lovanium Üniversitesi'ni Kur"
 CONGO_establish_university_of_louvain_desc:0 "Başlangıçta tropikal tıp okumak amacıyla bir tıp fakültesi olarak kurulan enstitüyü, bir ziraat bilimleri bölümü ile genişletme fırsatımız var, sonra onu uygun bir üniversite olarak belirlediğimizde, kesinlikle Afrika'nın kıskançlığı haline gelecektir."
 CONGO_even_a_hospital_can_do_better:0 "Bir Hastane Bile Daha İyisini Yapabilir"
 CONGO_even_a_hospital_can_do_better_desc:0 "Bir dizi küçük Kongolu birim dünyanın her yerindeki çeşitli tiyatrolarda hizmet veriyor. Özellikle tıbbi birliklerin çabaları, ezici zorluklara rağmen ön saflarda bile bir efsane haline geldi; öyle ki, yerel bir komutanın birliklerini \"bir hastane bile daha iyisini yapabilir!\" şeklinde azarladığı duyuldu."
 CONGO_expand_force_publique_recruitment:0 "Force Publique Askere Alımını Genişlet"
 CONGO_expand_force_publique_recruitment_desc:0 "Force Publique üzerindeki talepler giderek artıyor ve bu nedenle yeni askerlere olan talep de artıyor. Yerel halktan yeni kayıtları teşvik etmek için daha büyük teşvikler sağlamalıyız."
 CONGO_expand_matadi_seaport:0 "Matadi Limanını Genişlet"
 CONGO_expand_matadi_seaport_desc:0 "Matadi, Leopoldville'e hizmet veren ana limandır ve birçok nehir aracılığıyla kıtanın iç kısımlarına açılan bir kapı görevi görür. Artan önemine uygun olarak bu konumdaki deniz tesislerini genişletmeliyiz."
 CONGO_expand_metallurgical_industry:0 "Metalurji Sanayisini Genişlet"
 CONGO_expand_metallurgical_industry_desc:0 "Belçika uzun zamandır mükemmel metalurji endüstrisiyle tanınır, ancak düzgün bir şekilde gelişmek için her zaman ham maddelere sahip değildi. Şimdi Kongo'dan ithal edilen kaynaklarla, refaha kavuşma imkanları var."
 CONGO_expand_ndolo_and_elisabethville_airports:0 "N'Dolo ve Elisabethville Havaalanlarını Genişlet"
 CONGO_expand_ndolo_and_elisabethville_airports_desc:0 "Kongo'nun Afrika'nın kalbi olmasının faydalarından biri, Afrika genişliğini geçmek isteyenler için önemli bir hava ulaşım merkezi olma potansiyeline sahip olmasıdır."
 CONGO_expand_ndolo_and_elisabethville_airports_tt:0 "Bu etki, odak §Y[USA.GetNameDef]§! ile bir ittifaktayken tamamlanırsa daha da yükseltilecektir!"
 CONGO_expand_tungsten_mines:0 "Tungsten Madenlerini Genişlet"
 CONGO_expand_tungsten_mines_desc:0 "Tungsten çekirdekli mühimmatlara artan ilgiyle, bu önemli metalin kendi kaynağımızı güvence altına almamız önemliydi. Neyse ki, Ruanda-Urundi manda topraklarımızda bulundu."
 CONGO_expand_villages:0 "Köyleri Genişlet"
 CONGO_expand_villages_desc:0 "Kongo'nun büyük bir potansiyeli var, ancak bu sadece büyük ve canlı bir işgücü ile karşılanabilir. Bu büyümeyi teşvik etmek için geliştirmek istediğimiz sahalarda yeni köyler kurmalıyız."
 CONGO_expanded_rubber_plantations:0 "Genişletilmiş Kauçuk Plantasyonları"
 CONGO_expanded_rubber_plantations_available_malaya_tt:0 "Düşmanlarımızdan biri §YMalaya§!'nın kontrolünü ele geçirdi!"
 CONGO_expanded_rubber_plantations_available_tt:0 "Düşmanlarımızdan biri tüm §YFransız Çinhindi§!'nin kontrolünü ele geçirdi!"
 CONGO_expanded_rubber_plantations_desc:0 "Kauçuk talebi o kadar büyüdü ki, plantasyonları önemli ölçüde genişletmek artık mali olarak mümkün hale geldi. Üretimi gerçekten başlatmak için özel çiftlikler oluşturabilir ve modern teçhizat ithal edebiliriz."
 CONGO_force_publique:0 "Force Publique"
 CONGO_force_publique_desc:0 "Başlangıçta sömürge polis gücü olarak tasarlanan bu kuvvetler, Büyük Savaş sırasında askerileştirildi ve Alman Afrikası'na karşı büyük bir takdirle savaştı. Bu güçlenmeyi sürdürelim ve bu sömürge gücünü daha modern standartlara getirelim."
 CONGO_forminiere:0 "Forminière"
 CONGO_forminiere_desc:0 "Société internationale forestière et minière du Congo, büyük ölçüde Kongo'daki ormancılık ve maden çıkarımı ile ilgilenen bir kuruluştur. Ormancılık deneyimleri değerli olsa da, Kasai'deki elmas tekellerinin ne kadar kazançlı olduğuyla hiçbir şey kıyaslanamaz. Bunu güçlendirmeli ve genişletmeliyiz!"
 CONGO_free_enterprise_fund:0 "Serbest Girişim Fonu"
 CONGO_free_enterprise_fund_desc:0 "Belçika sömürge yönetimi, Kongo'dan en fazlasını elde etmek için yatırım yapmaları gerektiğinin farkındadır. Bu nedenle, küçük işletmelere başlamalarına yardımcı olmak için mali hibeler sunuyorlar. "
 CONGO_french_congo:0 "Fransız Kongosu"
 CONGO_french_congo_desc:0 "Fransızlar, Kongo havzasından bir parça kopardı ve halkımızı bizden ayırdı. Şimdi bu tarihi adaletsizliği geri alma zamanı. Sadece bir tane olabilir!"
 CONGO_fuel_for_belgium:0 "Belçika İçin Yakıt"
 CONGO_fuel_for_belgium_desc:0 "Kongo'daki kaynak çıkarımını genişletme çabalarımız o kadar başarılı oldu ki, [BEL.GetAdjective] şirketleri utanmadan bu ucuz malzemeleri Belçika'daki kendi fabrikalarını beslemek için kullanıyor... ve bunu yaparken önemli bir kar elde ediyorlar."
 CONGO_gold_and_diamonds:0 "Altın ve Elmaslar"
 CONGO_gold_and_diamonds_desc:0 "Büyük bir altın ve elmas arzını kontrol etme konusunda oldukça şanslı bir konumdayız. Bu kaynakları, en çok ihtiyaç duyulan yerlere malzeme, uzmanlık ve araç satın almak için kullanmalıyız."
 CONGO_gold_and_diamonds_tt:0 "§YKongo Altınını ve Elmaslarını§! §YYatırımlar§! ve §Yİnşaat§! için kullanmak üzere kararlar açar!"
 CONGO_great_war_of_africa:0 "Afrika'nın Büyük Savaşı"
 CONGO_great_war_of_africa_desc:0 "Büyük Kongo Havzası'ndaki tüm halkların tek bir bayrak altında birleşme zamanı geldi. Avrupa güçleri tarafından çizilen keyfi sınırları geri almalı ve bizim olanı almalıyız."
 CONGO_heat_resistant_cobalt:0 "Isıya Dayanıklı Kobalt"
 CONGO_heat_resistant_cobalt_desc:0 "Kongo'da uzun zamandır Kobalt madenciliği yapıyoruz, ancak burada bulunan malzeme, yeni jet motorlarının geliştirilmesi için hayati önem taşıyan ısıya dayanıklı özelliklere sahip özellikle yüksek dereceli bir malzemedir."
 CONGO_humanitarian_aid:0 "İnsani Yardım"
 CONGO_humanitarian_aid_desc:0 "Kongo'da yoksulluk ve açlık içinde yaşayan birçok saha var. İnsani yardım kuruluşlarıyla bir dizi temasımız var ve bu nedenle acıların bir kısmını hafifletmeye yardımcı olmak için onlara erişim sağlamalıyız."
 CONGO_improved_employment_contracts:0 "İyileştirilmiş İstihdam Sözleşmeleri"
 CONGO_improved_employment_contracts_desc:0 "Ham madde talebi o seviyelere ulaştı ki, işgücü piyasasını eskiden olduğu gibi manipüle edemiyoruz. Madenciler kendileri değerli bir meta haline geldi ve bunu biliyorlar. Sürekli verimliliklerini güvence altına almak için onlara daha iyi istihdam olanakları sunmalıyız."
 CONGO_independence_war_ongoing:0 " Kongo Bağımsızlık Savaşı Devam Ediyor"
 CONGO_interfaith_school_subsidies:0 "Dinlerarası Okul Sübvansiyonları"
 CONGO_interfaith_school_subsidies_desc:0 "Ülke genelinde zaten bir dizi Katolik misyoner okulu var, ancak nüfusun eğitim seviyelerini gerçekten ucuza iyileştirmek istiyorsak, sınırlarımıza daha fazla örgüt teşvik etmemiz gerekecek."
 CONGO_jungle_fighting:0 "Cengel Savaşı"
 CONGO_jungle_fighting_desc:0 "Kongo'nun devasa alanları görünüşte aşılmaz cengellerle kaplıdır ve yine de onlarla birlikte yaşayıp gelişir. Silahlı kuvvetlerimizi bu tür arazilerde konuşlandırmak için daha iyi donatmak üzere rehber ve eğitmen olarak hizmet etmeleri için bu tür insanları işe almalıyız."
 CONGO_jungle_figthing_random_generals_tt:0 "Rastgele seçilen §Yiki§! ordu lideri §YCengel Faresi§! kazanacak!"
 CONGO_jungle_industry:0 "Cengel Sanayisi"
 CONGO_jungle_industry_available_tt:0 "§YBüyük Kongo Havzası§!'nda herhangi bir §YCengel Eyaletini§! kontrol eder!"
 CONGO_jungle_industry_desc:0 "Yatırımcılar genellikle devasa bir cengelin değeri konusunda şaşkına dönerler, ancak sadece nereye bakılacağını bilmek gerekir. Bu uzmanlığı bulmalı ve onlara o gizli zenginlikleri açığa çıkarmaları için araçları sağlamalıyız."
 CONGO_kasai_secessionist_state:0 "Kasai Ayrılıkçı Devleti"
 CONGO_kasai_secessionist_state_2_tt:0 "Eğer bir Kongo §YBağımsızlık Savaşı§! çıkarsa, §Y[888.GetName]§!'de 5 taburlu 2 §Ypiyade§! birimi kazanacaklar!"
 CONGO_kasai_secessionist_state_desc:0 "Kasai bölgesi her zaman [BEL.GetAdjective] kuvvetleri tarafından daha gevşek bir şekilde kontrol edilmiştir ve doğru bağlantılarla, Kongo bağımsızlık peşinde koşarsa bir kale güvence altına alabiliriz."
 CONGO_kasai_secessionist_state_tt:0 "Eğer Hakim Devletimize karşı bir §YBağımsızlık Savaşı§! çıkarsa, §Y[888.GetName]§!'de 5 taburlu 2 §Ypiyade§! birimi kazanacağız!"
 CONGO_legacy_of_lake_tanganyika:0 "Tanganyika Gölü'nün Mirası"
 CONGO_legacy_of_lake_tanganyika_desc:0 "Force Publique'in en şaşırtıcı başarılarından biri Büyük Savaş sırasında gerçekleşti, burada bir dizi gemi söküldü, cengellerden taşındı ve Afrika'nın kalbinde oturan gölde yeniden konuşlandırıldı - ve sonra orada konuşlanmış Alman gemilerini yendi."
 CONGO_modernize_force_publique:0 "Force Publique'i Modernize Et"
 CONGO_modernize_force_publique_desc:0 "Takdire şayan bir performans sergilemiş olsa da, Force Publique'in modernizasyona fena halde ihtiyacı olduğu bir sır değil. Bu, bu amaca yatırım ayırmak için en uygun an gibi görünüyor."
 CONGO_new_vegetable_produce_markets:0 "Yeni Sebze Ürünleri Pazarları"
 CONGO_new_vegetable_produce_markets_desc:0 "Kongo ekonomisindeki vurgunun çoğu maden çıkarımı ve nakit mahsuller üzerinde olsa da, hala güçlü ve sağlıklı bir tarım sektörümüz var. Küresel gıda kıtlıkları giderek daha ciddi hale geldikçe, basit gıdaya olan talep hiç bu kadar yüksek olmamıştı. "
 CONGO_office_des_transports_coloniaux:0 "Office des Transports Coloniaux"
 CONGO_office_des_transports_coloniaux_desc:0 "Sömürge taşımacılığı ve lojistiğinden sorumlu departman, başa çıkması gereken devasa mesafeler ve korkunç arazi arasında sıkışıp kalarak uzun zamandır kırılma noktasına geldi. Onlara çok ihtiyaç duyulan finansmanı yönlendirelim ve Kongo'yu daha bağlantılı bir yer haline getirelim."
 CONGO_overseas_department_of_belgium:0 "Belçika'nın Denizaşırı Departmanı"
 CONGO_overseas_department_of_belgium_2_tt:0 "Artık §YÖzerklik Seviyemizi Artıramayacağız§!!"
 CONGO_overseas_department_of_belgium_desc:0 "Model sömürge deneyi umulandan daha iyi olgunlaştı. Kongo, verimlilik ve ilerleme modeli haline geldi, öyle ki daha resmi bir unvan kazanıldı."
 CONGO_overseas_department_of_belgium_tt:0 "§Y[COG.GetNameDefCap]§! artık §YÖzerklik Seviyelerini Artıramayacak§!!"
 CONGO_prince_leopold_mine:0 "Prens Leopold Madeni"
 CONGO_prince_leopold_mine_desc:0 "Kipushi bölgesi yüzyıllardır bakır madenciliği yapıyor ve burada bir süredir çalışıyor olsak da, küresel gerilimlerle birlikte bakırın potansiyel değerinin artması bekleniyor. Bu talep geldiğinde hazır olalım."
 CONGO_purchasing_commission:0 "Satın Alma Komisyonu"
 CONGO_purchasing_commission_desc:0 "Kongo giderek daha fazla modern teçhizat ve donanıma bağımlı hale geldikçe, bu tür malların ithalatını yönetmek için bir departman kurmamız gerektiği açıkça ortaya çıktı."
 CONGO_rawji_group:0 "Rawji Grubu"
 CONGO_rawji_group_desc:0 "Mütevazı köklerden büyüyen Rawji işi, Kongo genelinde çeşitli farklı endüstrileri ve işletmeleri kapsayacak şekilde genişliyor."
 CONGO_regional_specialization:0 "Bölgesel Uzmanlaşma"
 CONGO_regional_specialization_desc:0 "Kongo, bir dizi farklı biyomu geçen çeşitli bir coğrafyadan oluşan büyük bir ulustur. Uygun kaynakların, uzmanlığın ve araçların en iyi kullanılabilecekleri sahalara gönderilmesini sağlamalıyız."
 CONGO_republic_of_congo:0 "Kongo Cumhuriyeti"
 CONGO_republic_of_congo_desc:0 "Özgürlüğün baş döndürücü havası yeni cumhuriyetin her yerinde hissedilebilir. Gelecek, Belçika'nın yanında bir yer mi yoksa eski sömürge efendisine muhalefet mi içeriyor olsun, kesin olan tek bir şey var. Bu gelecek, tek başına Kongo'nun karar vereceği bir gelecektir."
 CONGO_requisition_funds:0 "Fonlara El Koy"
 CONGO_requisition_funds_desc:0 "Mutlaka en popüler hamle olmasa da, Kongo'da hala nasıl çıkarılacağını bilenler için keşfedilmemiş zenginlikler var. "
 CONGO_requisition_funds_tt:0 "Artan §YKongo Özerkliği§! karşılığında §YSiyasi Güç§! kazanmak için tekrarlanabilir bir karar açar!"
 CONGO_research_grants:0 "Araştırma Hibeleri"
 CONGO_research_grants_desc:0 "Kongo'nun zengin olduğu tek şey kaynaklar değil, aynı zamanda beyin gücüdür. Bu en değerli kaynak henüz düzgün bir şekilde kullanılmadı. Entelektüel endüstrinin gelişimini teşvik etmek için araştırma hibeleri sunmalıyız."
 CONGO_ruanda_urundi:0 "Ruanda-Urundi"
 CONGO_ruanda_urundi_desc:0 "Bir zamanlar Alman Doğu Afrikası'nın bir parçası olan bu bölge, Büyük Savaş'ın ardından Milletler Cemiyeti tarafından [BEL.GetName]'e emanet olarak devredildi. Bu, pamuk, kahve ve tungsten gibi bazı değerli kaynaklara erişimi olan bir bölgedir."
 CONGO_rubber_plantations:0 "Kauçuk Plantasyonları"
 CONGO_rubber_plantations_desc:0 "Belçika'nın Kongo'da kauçuk çıkarımı konusunda özellikle kötü bir geçmişi var. Buna rağmen, uluslararası toplumun dikkatli gözleri altında olduğumuzu bilerek, bu malzemenin üretimini hala geliştirmemiz gerekiyor."
 CONGO_secure_international_funding:0 "Uluslararası Finansmanı Güvence Altına Al"
 CONGO_secure_international_funding_desc:0 "Belçika sömürge otoritesi, Kongo'nun potansiyelinin farkında olan tek güç değil. [BEL.GetName] ile veya onsuz iş yapabileceğimiz yatırım için uluslararası ortaklara bakmalıyız."
 CONGO_secure_international_funding_tt:0 "§YKongo Altyapısı ve Sanayisine Uluslararası Finansman Yatırımı§! için kararlar açar!"
 CONGO_separate_corporations_from_politics:0 "Şirketleri Siyasetten Ayır"
 CONGO_separate_corporations_from_politics_desc:0 "Kongo Bağımsız Devleti zamanlarından beri, Kongo büyük şirketlerin emrindeydi. Sonuç olarak, kurumsal çıkarlar siyasi düzeyi istila etti. Bu grupları iktidar dizginlerinden ayırmak için önlemler almalıyız."
 CONGO_shinkolobwe_mine:0 "Shinkolobwe Madeni"
 CONGO_shinkolobwe_mine_desc:0 "Shinkolobwe madeni, dünyadaki çok, çok az bilinen yüksek dereceli uranyum kaynaklarından biridir. Ne yazık ki, madenin alt seviyeleri ağır bir şekilde sular altında kaldı ve bu da kapanmasına yol açtı. Onu yeniden açmak ve üretime devam etmek için önemli bir yatırım ve çaba gerekecektir."
 CONGO_smuggle_diamonds:0 "Elmas Kaçakçılığı"
 CONGO_smuggle_diamonds_desc:0 "Elmaslar değerli, neredeyse izlenemez bir para birimi oluşturur ve bu nedenle belirli çevrelerde son derece rağbet görmektedir. Bu yeraltı hareketine kendi payımızı enjekte etmeli ve ödülleri toplamalıyız."
 CONGO_smuggle_diamonds_tt:0 "§YÖzerkliğimizi§! §YSiyasi Güç§! karşılığında azaltmak için kararlar açar!"
 CONGO_smuggle_uranium:0 "Uranyum Kaçakçılığı"
 CONGO_smuggle_uranium_desc:0 "Çok sayıda insanın gerçekten, gerçekten istediği değerli bir şeyimiz var ama bunu her zaman serbestçe sunamıyoruz. Bazı arka kanal bağlantılarına ulaşmalı ve gölgelerde ne gibi anlaşmalar yapılabileceğini görmeliyiz."
 CONGO_societe_generale_de_belgique:0 "Societe Generale de Belgique"
 CONGO_societe_generale_de_belgique_desc:0 "Belçika ekonomisinin çoğunun kalbindeki devasa şirket. Eğer bütün bir ülkeyi geliştirmek için gereken örgütsel ve mali gücü istiyorsak, Kongo'daki çıkarlarımızı desteklemek için başvurabileceğimiz daha iyi kimse yoktur."
 CONGO_societe_miniere_de_bakwanga:0 "Societé Minière de Bécéka"
 CONGO_societe_miniere_de_bakwanga_desc:0 "Elmas değerli taş piyasası olağanüstü kazançlı bir pazar olsa da, bu büyük sanayileşme çağında bu sert malzemeyi kullanmak için, örneğin testereler ve matkaplar gibi çok sayıda yeni kullanım alanı vardır. "
 CONGO_soviet_interest:0 "Sovyet İlgisi"
 CONGO_soviet_interest_desc:0 "Kongo'da nüfuz için yarışan bir dizi rakip büyük güç var, hiçbiri [SOV.GetNameDef]'den daha fazla değil. En azından ne teklif ettiklerini duymalıyız!"
 CONGO_symbiotic_industrialization:0 "Simbiyotik Sanayileşme"
 CONGO_symbiotic_industrialization_desc:0 "Biri diğerini besler, Belçika sanayisini geliştirdikçe kaynak ihtiyacı da artar. Bunları Kongo'dan ithal edebilir ve daha da hızlı sanayileşmeyi besleyebiliriz, böylece daha da fazla kaynağa ihtiyaç duyarız. Her ikisinin de refahı yakından bağlantılıdır."
 CONGO_the_heart_of_africa:0 "Afrika'nın Kalbi"
 CONGO_the_heart_of_africa_desc:0 "Kongo'nun geniş toprakları Afrika'nın ortasında yer alır ve nispeten fakir ve az gelişmiş olmasına rağmen, içi geniş bir kaynak ve olasılık zenginliği gizler. Tek yapmamız gereken, yola çıkıp onları bulmak."
 CONGO_uranium_development_trust:0 "Uranyum Geliştirme Güveni"
 CONGO_uranium_development_trust_desc:0 "Uranyumun bir dizi ilgili taraf için giderek daha önemli hale gelmesiyle, uluslararası ortaklarımızla çalışmak ve Uranyum Geliştirme Güveni'nin oluşturulmasını desteklemek bizim yararımıza olacaktır. Bu, bu kaynağın uygun şekilde işletilmesi ve tahsis edilmesinden sorumlu bir organ olacaktır."
 CONGO_weapon_repair_workshops:0 "Silah Tamir Atölyeleri"
 CONGO_weapon_repair_workshops_desc:0 "Askeri üretimin çoğu Belçika'da yapılsa da, hala eski askeri donanımı onarabilen ve yeniden kullanabilen bir dizi küçük atölye var. Gelecekte bu teçhizata ihtiyaç duymamız durumunda, bunu yapmak için ihtiyaç duydukları şeye sahip olduklarından emin olmalıyız."
 CONGO_whispers_of_independence:0 "Bağımsızlık Fısıltıları"
 CONGO_whispers_of_independence_desc:0 "Bir süredir onları duyuyoruz. Memnun olmayanların dolaşan mırıltıları. Havada bir isyan ipucu. Farklı bir gelecek için düşük bir heyecan uğultusu. O zaman kulağımızı vermeliyiz ve bu hoşnutsuzluk akıntısının bizi nereye götürdüğünü görmeliyiz."
 FOCUS_ICON_SET_HISTORICAL_KEY_FOCUS:0 "Tarihi Anahtar Odak"
 GER_SS_recruitment_tt:0 "Kararı açar: §Y$SS_recruitment$§!"
 GER_a_strong_successor:0 "Güçlü Bir Halef"
 GER_a_strong_successor_current_advisors_tt:0 "Mevcut Yükselmiş Danışmanlar: §Y[GetAscendedAdvisorName1]§!, §Y[GetAscendedAdvisorName2]§! veya §Y[GetAscendedAdvisorName3]§!."
 GER_a_strong_successor_desc:0 "Nöbet değişimi yaklaşıyor ve yeni bir Führer yükselmeli. [ROOT.GetNameDef] için özlemlerimizi yansıtacak yeni bir lider kurma fırsatımız var. Bu değişim, Alman halkı için daha parlak bir gelecek getirme çabalarımızı yeniden canlandıracaktır."
 GER_a_strong_successor_trigger_tt:0 "§Yİç Çember§!'deki tüm §Y3§! Yükselmiş Danışman, tepe noktası odaklarını tamamladı."
 GER_a_strong_successor_tt:0 "'§Y$GER_inner_circle.02.t$§!' olayını alır. \n§Yİç Çember§!'deki mevcut Yükselmiş $GER_inner_circle_member_title$lerden biri, Ülke Lideri olarak §Y[ROOT.GetLeader]§!'in yerini alabilir."
 GER_abolish_price_controls:0 "Fiyat Kontrollerini Kaldır"
 GER_abolish_price_controls_desc:0 "Yeniden silahlanmayı desteklemek için uygulanan fiyat kontrol önlemleri ekonomiyi boğuyor. Bunları kaldırmak devletin fonlarını azaltabilir, ancak insanların yeni işler kurmasını ve ekonomiyi canlandırmasını sağlayacaktır."
 GER_absorb_the_abwehr:0 "Abwehr'i Soğur"
 GER_absorb_the_abwehr_desc:0 "Abwehr'i Ordu Komutanlığı'ndan ayrı tutmak, karar verildiği zaman mantıklı olan bir karardı. Mevcut durumla, şimdi tam tersinin doğru olabileceği görülüyor. Abwehr'i soğurmayı düşünmeliyiz."
 GER_accelerate_the_rearmament_program:0 "Yeniden Silahlanma Programını Hızlandır"
 GER_accelerate_the_rearmament_program_desc:0 "Versay Antlaşması'nın prangalarını kırmalı ve sanayinin örslerinin [ROOT.GetNameDef] için şanlı bir kader dövmesine izin vermeliyiz. Üretilen her tank, monte edilen her uçak, Alman halkının bükülmez iradesinin bir kanıtı olarak duracaktır."
 GER_accept_british_naval_dominance_ww:0 "$GER_accept_british_naval_dominance$"
 GER_accept_british_naval_dominance_ww_desc:0 "$GER_accept_british_naval_dominance_desc$"
 GER_adopt_new_panzer_doctrine:0 "Yeni Panzer Doktrinini Benimse"
 GER_adopt_new_panzer_doctrine_desc:0 "$GER_army_innovation_desc$"
 GER_advanced_panzer_research:0 "İleri Panzer Araştırması"
 GER_advanced_panzer_research_desc:0 "En son tank teknolojilerini araştırmak ve geliştirmek için kaynak ayırmak, yeni bilgiler ve çığır açan sonuçlar verecektir. Bu, savaş yeteneklerimizi artıracak ve panzerlerimizi daha da ölümcül hale getirecektir."
 GER_advisor_will_continue_focus_tt:0 "§Y$CHARACTER$§!, §Yİç Çember§! içinde galip gelir ve §Y$FOCUS$§! odağında çalışmaya devam edecektir."
 GER_aerodynamic_research_institute:0 "Aerodinamik Araştırma Enstitüsü"
 GER_aerodynamic_research_institute_desc:0 "[ROOT.GetNameDefCap], Hava Kuvvetlerimize yoğun yatırım yaptığımız için son zamanlarda hava yeniliği ile eşanlamlı hale geldi. Rekabetin önünde kalmak için bu alana kaynak akıtmaya devam etmeliyiz. Aerodinamik Araştırma Enstitüsü'nü ve yeni tahrik teknikleri geliştirmelerini finanse etmek, gökyüzünün efendisi olma arayışımızda kesinlikle yeni yenilikler getirecektir."
 GER_aerodynamic_research_institute_tt:0 "Tüm §YUçak Tasarımcıları§! için MIO özelliği §Y$GER_mio_trait_aerodynamic_research_insitute$§!'i açar. §RAncak sadece bir tanesine uygulanabilir§!."
 GER_aeronautical_research_institute:0 "Havacılık Araştırma Enstitüsü"
 GER_aeronautical_research_institute_desc:0 "Hava savaşı, Büyük Savaş'tan bu yana önem ve karmaşıklık açısından büyüdü ve Versay Antlaşması bize bir hava kuvveti kurmayı yasakladığı için, uçak geliştirmede geride kaldık. Bunu düzeltmek için, hava üstünlüğünü sağlamak üzere yenilikçi uçak gövdeleri, motorlar ve silahlar geliştirmek için bir Luftfahrtforschungsanstalt veya bir Havacılık Araştırma Enstitüsü inşa etmeliyiz."
 GER_african_allies:0 "Afrikalı Müttefikler"
 GER_african_allies_desc:0 "Afrika halkı Avrupalılardan kurtuluş özlemi çekiyor. Belki de onlara katılırlarsa özerklik vaatleriyle onları kendi tarafımıza çekebiliriz."
 GER_african_allies_faction_tt:0 "Şu anda bir ittifakta olmayan bağımsız Afrikalı Küçükler şu olayı alır:"
 GER_african_allies_tt:0 "§YAfrikalı§! ülkelerin §YBağımsızlığını Desteklemek§! için kararlar açar"
 GER_agricultural_reforms:0 "Tarımsal Reformlar"
 GER_agricultural_reforms_desc:0 "Tarım sektörümüz çoğunlukla küçük ölçekli, aile tarafından işletilen çiftliklerden oluşuyor ve çok fazla el emeği yapıyor. Modern teçhizat tanıtarak ve her bir çiftliğin üretim çıktısını artırarak tüm tarım sektörünü reforme edebiliriz. Ulusumuzun tamamı faydalanacaktır!"
 GER_align_czechoslovakia:0 "Çekoslovakya'yı Hizala"
 GER_align_czechoslovakia_desc:0 "Çekoslovak devleti, Avusturya-Macaristan'da sanayileşmenin merkezlerinden biri olarak, sanayi yetenekleri ve doğal kaynaklar bakımından zengindir. Zenginliklerinden yararlanabilmemiz için Mitteleuropa'ya katılmalarını sağlamalıyız."
 GER_align_italy:0 "İtalya'yı Hizala"
 GER_align_italy_desc:0 "İtalya, Büyük Savaş sırasında bize ihanet etmiş olabilir, ancak etkileyici bir donanmaya sahip oldukları gerçeğini unutmamalıyız, bu donanma düşmanlarımızla başa baş mücadele edebilir. Bu nedenle, onlarla eski ittifakımızı yeniden kurmaya çalışmalıyız."
 GER_align_south_america:0 "Güney Amerika'yı Hizala"
 GER_align_south_america_desc:0 "Güney Amerika işçileri kapitalizmin boyunduruğu altında yeterince uzun süre acı çekti. Onları davamıza çekmek, kesinlikle kıta genelinde sadık müttefiklere yol açacaktır."
 GER_all_for_the_front:0 "Her Şey Cephe İçin!"
 GER_all_for_the_front_desc:0 "Eğer vatanının eski şanına kavuşmasını istiyorsa, her adam kalbini, kanını ve ruhunu Alman ulusuna vermek zorunda kalacaktır. Yaptığımız her şey cephe için olmalı ve bu, halkımızın zamanla anlaması gereken bir gerçektir."
 GER_all_terrain_military_motorcycle:0 "Arazi Askeri Motosikleti"
 GER_all_terrain_military_motorcycle_desc:0 "Hızlı keşfin önemi abartılamaz. Motosiklet birimlerine yatırım yapmak, stratejik karar vermeyi sağlayan ve operasyonel etkinliği artıran çok önemli savaş alanı istihbaratı sağlayacaktır."
 GER_alliance_with_portugal:0 "Portekiz ile İttifak"
 GER_alliance_with_portugal_desc:0 "Tarihsel olarak [POR.GetNameDef] ile en olumlu ilişkilere sahip olmadık. Ancak Büyük Savaş'ta amansız düşmanlar olmamıza rağmen, fikir değiştirmiş gibi görünüyorlar. İspanya'daki milliyetçileri desteklemiş olmaları nedeniyle, ideolojik benzerlikler olabileceğine ve [POR.GetAdjective] ile bir anlaşmaya varabileceğimize inanıyoruz."
 GER_alliance_with_spain:0 "$GER_nationalist_spain_ally$"
 GER_alliance_with_spain_desc:0 "$GER_nationalist_spain_ally_desc$"
 GER_alliance_with_the_ussr:0 "$GER_soviet_ally$"
 GER_alliance_with_the_ussr_desc:0 "$GER_soviet_ally_desc$"
 GER_allied_civilian_administration_integration_tt:0 "Şunlar için Kararlar açar: §YBağlı Devletlerimizin Sivil Yönetimlerini Entegre Etmek§!, §YKuklalarımızı§! §Yİlhak Etmemize§! olanak tanır!"
 GER_allied_customs_union_integration_request_tt:0 "Kararı açar: §Y$GER_mitteleuropa_economic_integration_cat$§!"
 GER_allied_economic_integration_tt:0 "Şunlar için Kararlar açar: §Y Müttefiklerin Ekonomik Bağımlılığını Daha da Artırmak§!, §Yİttifak Üyelerini§! §YKuklalara§! dönüştürmemize olanak tanır!"
 GER_allied_trade_tt:0 "Kararı açar: §Y$GER_mitteleuropa_allied_trade_cat$§!"
 GER_ally_chiang_kai_shek:0 "Çan Kay-şek ile Müttefik Ol"
 GER_ally_chiang_kai_shek_desc:0 "Doğu Asya'daki mevcut girişimlerimiz sadece bize değil, başkalarına da faydalı olabilir. [CHI.GetNameDef]'den [CHI.GetLeader] ile ittifak kurarak ve onu bize hizalayarak, etki alanımızı genişletir ve bölgedeki sömürge büyümesini kolaylaştırırız."
 GER_ally_white_russian_forces:0 "Rus Beyaz Hareketi ile Müttefik Ol"
 GER_ally_white_russian_forces_desc:0 "Kızıllar Rus iç savaşını kazandıktan sonra yurtdışına kaçan birçok Rus var. Onlara ulaşmalı ve Brest-Litovsk antlaşmasında bize veya müttefiklerimize verilen topraklara yönelik herhangi bir iddiadan vazgeçme pahasına, anavatanlarının yeniden ele geçirilmesinde işbirliği yapmaya istekli olup olmadıklarını görmeliyiz."
 GER_amerikabomber:0 "Amerikabomber"
 GER_amerikabomber_desc:0 "Gökyüzüne hakim olma ve düşmanlarımızı topraklarının derinliklerindeki hedeflere saldırarak şok edebilecek uzun menzilli bir uçak yaratma konusundaki iddialı hedefe tamamen bağlı kalmalıyız - ya da Atlantik'i geçerek herkese kimsenin menzilimizden güvende olmadığını göstermeliyiz."
 GER_an_invincible_army:0 "Alman Ordusu, Yenilmez"
 GER_an_invincible_army_desc:0 "Ordumuzun savaş alanında kendisi için kazandığı birçok başarı ve zaferle, düşman demagoglarının ne derse desin, [ROOT.GetAdjective] ordusunun gerçekten yenilmez olduğunu dünyaya kanıtladık!"
 GER_an_invincible_army_trigger:0 "Aşağıdakilerden biri doğru olmalıdır:\n   §Y5§!'ten fazla Bağlı devlet\n   §YAvrupa§!'da §Y49§!'dan fazla işgal edilmiş eyalet!"
 GER_anglo_germanic_cooperation_program:0 "İngiliz-Alman İşbirliği Programı"
 GER_anglo_germanic_cooperation_program_desc:0 "Kraliyet Donanması, gemi yapımı ve deniz savaşı konusunda geniş bir bilgiye sahiptir. Yakın işbirliğimiz sayesinde, İngilizlerin daha önce sıkı bir şekilde koruduğu bilgileri edinebilir ve kullanabiliriz."
 GER_anglo_germanic_defense_pact:0 "İngiliz-Alman Savunma Paktı"
 GER_anglo_germanic_defense_pact_desc:0 "İngilizler uzun zamandır düşmanımızdı, ancak son gelişmelerle, onlarla birimize saldıranın her ikimize de saldırdığını belirten bir savunma anlaşması yapabiliriz. Bu, onların devletiyle ilişkilerin normalleşmesinde büyük bir adım olacaktır."
 GER_anschluss:0 "Anschluss"
 GER_anschluss_army_trigger_tt:0 "§Y[ROOT.GetAdjective]§! Ordusu, sadece düzgün teçhizatlandırılmış birimleri sayarken §Y[AUS.GetAdjective]§! Ordusundan en az §Y[?global.deployed_manpower_ratio_needed_for_anschluss]§! kat daha büyüktür.\n\nBunu [GetAnschlussProgress] tahmin ediyoruz"
 GER_anschluss_desc:0 "[AUS.GetAdjective] politikacılarının sözlerine rağmen, [AUS.GetNameDef]'in büyük ölçüde [GER.GetAdjective] konuşan nüfusunun Anavatan ile yeniden birleşmeyi arzuladığı açıktır. Yozlaşmış lider [AUS.GetLeader]'i istifaya zorlamalı ve halkın iradesinin yerine getirilmesine izin vermeliyiz."
 GER_antischluss_progress_complete:0 "§GBaşarıldı§!"
 GER_antischluss_progress_minimal:0 "§RMinimum§! ilerleme kaydetti"
 GER_antischluss_progress_moderate:0 "§OOrta§! düzeyde ilerleme kaydetti"
 GER_antischluss_progress_significant:0 "§YÖnemli§! ilerleme kaydetti"
 GER_armament_rationalization:0 "Silahlanma Rasyonalizasyonu"
 GER_armament_rationalization_desc:0 "Üretim hatlarımız, silahlı kuvvetlerimizin ihtiyaçlarına zar zor yetişebiliyor. Sanayi savaş makinemizin verimliliğini ve etkinliğini artırmak için silahlanma rasyonalizasyon önlemleri uygulamalıyız."
 GER_army_indoctrination:0 "Ordu Endoktrinasyonu"
 GER_army_indoctrination_desc:0 "Rüşvet ve parasal teşvikler, üst düzey subaylarımız ve Wehrmacht içindeki seçkin bireyler için harika çalışıyor. Ancak, sıradan asker için rüşvete güvenemeyiz, yoksa ekonomimiz mahvolur. Onları propaganda çabalarıyla kararlarımıza tamamen katılmaya ikna etmek, daha mantıklı bir hareket tarzı olabilir."
 GER_artillery_bombardment:0 "Topçu Bombardımanı"
 GER_artillery_bombardment_desc:0 "Piyade, ordumuzun bel kemiğidir ve başarılı olmaları için uygun desteğe ihtiyaçları vardır. Piyademizin herhangi bir avantajı zorlayabilmesi ve önlerindeki herhangi bir düşmanı yenebilmesi için topçuya yoğun bir şekilde yatırım yapmalıyız."
 GER_ascended_advisor_1_name_text:0 "§Y[GetAscendedAdvisorName1]§!"
 GER_ascended_advisor_2_name_text:0 "§Y[GetAscendedAdvisorName2]§!"
 GER_ascended_advisor_3_name_text:0 "§Y[GetAscendedAdvisorName3]§!"
 GER_ascended_character_trait_swap_tt:0 "§Y$CHARACTER$§!, §Yİç Çember§! içinde yükselir:"
 GER_ascension_of_character_focus_tt:0 "§Y$CHARACTER$§!, zamanla şubesindeki odaklarda çalışmaya başlayacak."
 GER_ascension_of_character_tt:0 "§Y$CHARACTER$§!, §YReichsleiter§! olarak atanır ve §Yİç Çember§! içinde şu şekilde yükselir:"
 GER_ascension_of_goebbels:0 "$GER_inner_circle_member_title$ Goebbels"
 GER_ascension_of_goebbels_desc:0 "Führer'in en iç çemberinde, halkın desteğini sürdürmesine yardımcı olabilecekler için her zaman yer vardır. Yakın bir takipçi ve yetenekli bir konuşmacı olarak, Joseph Goebbels'e göreceli hareket özgürlüğü tanımak bizim için en faydalısı olacaktır."
 GER_ascension_of_goring:0 "$GER_inner_circle_member_title$ Göring"
 GER_ascension_of_goring_desc:0 "Yetenekli bir komutanın Führer'in İç Çemberinde belirli bir yeri vardır. Hermann Göring sadece yetenekli bir komutan değil, aynı zamanda Führer'in uzun süreli bir suç ortağı olduğu için, ona göreceli hareket özgürlüğü tanımak çok az riskle çok fazla ödül sağlayacaktır."
 GER_ascension_of_himmler:0 "$GER_inner_circle_member_title$ Himmler"
 GER_ascension_of_himmler_desc:0 "Heinrich Himmler'in organizasyonu ve liderliği altında SS, oldukça küçük başlangıçlarından ülkemiz içinde daha belirgin bir güce dönüştü. Onu terfi ettirmek, becerilerinden daha fazla yararlanmamızı ve SS'i mevcut haliyle daha iyi kullanmamızı sağlayacaktır."
 GER_ascension_of_speer:0 "$GER_inner_circle_member_title$ Speer"
 GER_ascension_of_speer_desc:0 "Eğitimli bir mimar olarak Albert Speer, ülkenin devam eden refahı için en değerli becerilere sahiptir. Ona göreceli hareket özgürlüğü tanıyarak, hem becerilerinden hem de [ROOT.GetAdjective] inşaat endüstrisindeki büyük oyuncularla olan bağlantılarından faydalanabiliriz."
 GER_ascension_of_todt:0 "$GER_inner_circle_member_title$ Todt"
 GER_ascension_of_todt_desc:0 "Askeri deneyime sahip yetenekli bir mühendis olarak Fritz Todt, Führer'e yetkin bir danışman olduğunu kanıtladı. Göreceli hareket özgürlüğü verilirse, [ROOT.GetNameDef]'e çok faydalı olabileceğine inanıyoruz."
 GER_asia_revive_the_schutztruppe_tt:0 "§YAsya§!'da §YSchutztruppe§! sömürge milislerini ve onları §YAskere Alma§! ve §YGeliştirme§! kararlarını açar!"
 GER_asian_allies:0 "Asyalı Müttefikler"
 GER_asian_allies_desc:0 "Asya'da düşmanlarımızın kontrolü altına girmemiş birçok küçük ulus var. Belki de güvenli bir gelecek ve toprak kazanımları vaatleriyle, küresel çatışmamızda bize yardım etmeye istekli olurlar."
 GER_asian_allies_faction_tt:0 "Şu anda bir ittifakta olmayan bağımsız Asyalı Küçükler şu olayı alır:"
 GER_asian_allies_tt:0 "§YAsyalı§! ülkelerin §YBağımsızlığını Desteklemek§! için kararlar açar"
 GER_asian_spheres_of_influence_tt:0 "Biz ve §Y[CHI.GetNameWithFlag]§!, §YAsya§!'daki Nüfuz Alanlarımızı kuracak, birbirlerinin ilgili alanları içinde ve dışında eyalet alma maliyetini değiştireceğiz.\n\n§YBizim Nüfuz Alanımız§! şunları içerecektir:\n§Y[MAL.GetNameWithFlag]§!\n§Y[INS.GetNameWithFlag]§!\n§Y[PHI.GetNameWithFlag]§!\n§Y[AST.GetNameWithFlag]§!\n§Y[NZL.GetNameWithFlag]§!\nTüm §YGüney Pasifik Adaları§!\n\nOnların §YNüfuz Alanı şunları içerecektir§!:\n§Y[SIA.GetNameWithFlag]\n[VIN.GetNameWithFlag]\n[CAM.GetNameWithFlag]\n[LAO.GetNameWithFlag]\n[CHI.GetNameWithFlag]\n[RAJ.GetNameWithFlag]\n[TIB.GetNameWithFlag]\n[NEP.GetNameWithFlag]\n[BHU.GetNameWithFlag]\n[KOR.GetNameWithFlag]\n[JAP.GetNameWithFlag]\n[MON.GetNameWithFlag]§!"
 GER_assassinate_mussolini_ww:0 "Mussolini'ye Suikast Düzenle"
 GER_assassinate_mussolini_ww_desc:0 "[ITA.GetAdjective] faşizminin temel direğinin sonunu sağlama zamanı geldi. Alman elleri lideri öldürecek, ardından [ITA.GetAdjective] kralcıları tek bir hızlı hareketle iktidarı ele geçirecek."
 GER_assemble_red_orchestra:0 "Kızıl Orkestrayı Topla"
 GER_assemble_red_orchestra_desc:0 "Kızıl Orkestra hiçbir zaman sağlam bir grup olmadı, daha ziyade birkaç becerikli bireyin etrafında toplanmış bir dizi insandı. Ancak bu sözde örgütün bazı üyeleri çok yetenekliydi ve onları işe almayı düşünmeliyiz."
 GER_assist_our_eastern_comrades:0 "Doğudaki Yoldaşlarımıza Yardım Et"
 GER_assist_our_eastern_comrades_desc:0 "Uzak doğudaki yoldaşlarımızın mücadeleleri onlara ağır geldi. Onları elimizden geldiğince rahatlatmalıyız. Savaşta sertleşmiş birlikler göndermek onlar için talihin gidişatını değiştirebilir."
 GER_atlantic_naval_bases:0 "Atlantik Deniz Üsleri"
 GER_atlantic_naval_bases_desc:0 "Atlantik kıyı bölgelerinin stratejik önemini kabul ederek ve Atlantik Okyanusu üzerinde hakimiyet kurma çabalarımızın bir parçası olarak, denizcilik üstünlüğü arayışında deniz üslerinin genişletilmesine ve modernizasyonuna öncelik vermeliyiz."
 GER_atlantic_naval_dominance:0 "Atlantik Deniz Hakimiyeti"
 GER_atlantic_naval_dominance_desc:0 "Atlantik Okyanusu'ndaki hakimiyetimizi güvence altına almak için operasyonel menzilimizi daha da genişletmemiz ve deniz varlığımızı kıyıdan kıyıya genişletmemiz gerekiyor."
 GER_austrian_army_does_not_exist:0 "Şu anda §Y[AUS.GetnameDef]§!'in herhangi bir daimi ordusu yok."
 GER_autarky_achieved:0 "Otarşi Başarıldı"
 GER_autarky_achieved_desc:0 "Sonunda tamamen kendi kendine yeterli olma konusundaki iddialı hedeflerimize ulaştık! Ulusumuz, bizi daha da güçlendirecek ve durdurulamaz yapacak doğal kaynaklarla bolca zenginleşti!"
 GER_autarky_efforts:0 "Otarşi Çabaları"
 GER_autarky_efforts_desc:0 "$GER_autarky_desc$"
 GER_autobahn_communism:0 "Volksautobahn"
 GER_autobahn_democratic:0 "Autobahn"
 GER_autobahn_fascism:0 "Reichsautobahn"
 GER_autobahn_neutral:0 "Kaiserliche Autobahn"
 GER_autonomous_organization_todt:0 "Özerk Todt Teşkilatı"
 GER_autonomous_organization_todt_desc:0 "Fritz Todt'un girişimi olan Todt Teşkilatı, en etkili olduğunu kanıtladı. İnşaat projeleri, Führer'in kendisinin bile memnun olduğu bir dereceye kadar hızla tamamlanıyor. Silahlanma ve Savaş Üretimi Reich Tam Yetkili Temsilcisi statüsü verildiğinde, Todt ülkemiz için gerçek bir varlık haline gelebilir."
 GER_autonomy_in_the_kriegsschulen:0 "Kriegsschulen'de Özerklik"
 GER_autonomy_in_the_kriegsschulen_desc:0 "Savaş Akademileri veya Kriegsschulen, ülkemizde uzun bir geleneğe sahiptir. Akademilerde verilen eğitimin her zerresini yönetmek ve uyarlamak cazip gelse de, okulların gelecekteki subaylarımız için mümkün olan en iyi eğitimi kendilerinin sağlamasına izin vermek ve onları güçlendirmek daha iyi olabilir."
 GER_backdoor_negotiations:0 "Arka Kapı Müzakereleri"
 GER_backdoor_negotiations_desc:0 "Aşağı Ülkelerdeki Batı müdahalesini, hepsine saldırmak yerine, birini diğerine saldırmaya kışkırtarak ve sonra onlardan birinin tarafına katılarak, etkili bir şekilde Büyük Hollanda bölgesindeki eski uluslar arasında bir bölünmeye neden olarak atlatmaya çalışabiliriz."
 GER_backdoor_negotiations_tt:0 "Bu kararlar, hedef uluslardan birini ittifakımıza eklerken diğerine saldırmamıza olanak tanır."
 GER_ban_political_uniforms:0 "Siyasi Üniformaları Yasakla"
 GER_ban_political_uniforms_desc:0 "Weimar dönemi, paramiliter örgütler ve siyasi grupların mücadelelerini sokaklarımıza taşımasıyla boğuşuyordu. Gelecek için istikrarı sağlamak amacıyla, bu açık siyasi aidiyet gösterilerini yasaklamalıyız."
 GER_befriend_china:0 "$GER_china_friend$"
 GER_befriend_china_desc:0 "$GER_china_friend_desc$"
 GER_befriend_czechoslovakia:0 "$GER_czech_friend$"
 GER_befriend_czechoslovakia_desc:0 "$GER_czech_friend_desc$"
 GER_befriend_japan:0 "$GER_japan_friend$"
 GER_befriend_japan_desc:0 "$GER_japan_friend_desc$"
 GER_befriend_poland:0 "$GER_poland_friend$"
 GER_befriend_poland_desc:0 "$GER_poland_friend_desc$"
 GER_befriend_turkey:0 "$GER_turkey_friend$"
 GER_befriend_turkey_desc:0 "$GER_turkey_friend_desc$"
 GER_blitzkrieg_across_the_pacific:0 "Pasifik Boyunca Blitzkrieg"
 GER_blitzkrieg_across_the_pacific_desc:0 "Pasifik'te savaşmak, birliklerimizin çoğunlukla eğitildiği şeye benzemiyor. Ayrıca taktiklerimizin biraz ayarlanması gerekebilir. Bunun bir zayıflık olduğuna inanmıyoruz, aksine bunun bizi daha güçlü kıldığını düşünüyoruz. Düşmanın savunması bildikleri üzerine kuruludur ve Pasifik'te yeni bir savaş yürütme yolu tasarlayarak onları gafil avlayabiliriz."
 GER_break_anglo_french_colonial_hegemony_ww:0 "$GER_break_the_anglo_french_colonial_hegemony$"
 GER_break_anglo_french_colonial_hegemony_ww_desc:0 "$GER_break_the_anglo_french_colonial_hegemony_desc$"
 GER_break_anglo_french_colonial_hegemony_ww_tt:0 "Eğer §YFransa§! ile karşılıklı işbirliği antlaşması imzaladıysak, onlara karşı bir savaş hedefi kazanmayacağız"
 GER_bribe_senior_officers:0 "Üst Düzey Subaylara Rüşvet Ver"
 GER_bribe_senior_officers_desc:0 "Üst düzey subaylarımızın Führer'e olan sadakatini sağlamak için, sadakati ve itaati ödüllendirmeyi düşünmeliyiz. Para, toprak ve vergi muafiyetleri sunarak, sadece sadık kalmalarını değil, aynı zamanda kendi alanlarında kalmalarını ve Führer'lerini sorgulamamalarını da sağlarız."
 GER_bring_turkey_into_the_fold:0 "[TUR.GetNameDef]'i Tekrar Kat"
 GER_bring_turkey_into_the_fold_desc:0 "Türklerin mevcut sınırlarının dışında iddiaları var ve ittifakımıza katılmaya kolayca ikna edilebilirler. Onları bir kez daha katmanın zamanı geldi."
 GER_brothers_in_arms:0 "Silah Arkadaşları"
 GER_brothers_in_arms_desc:0 "Avusturyalı kardeşlerimiz, Merkezi Güçlerin bir parçası olarak bizimle birlikte zorlu bir mücadele verdi. Onlara hayır diyemeyecekleri bir teklifle ulaşmalıyız, böylece bir kez daha omuz omuza savaşabiliriz."
 GER_build_defense_industry:0 "Bir Savunma Sanayisi İnşa Et"
 GER_build_defense_industry_desc:0 "Nihayet ekonomimizi istikrara kavuşturabildiğimize ve hatta birçok kat güçlendirebildiğimize göre, şimdi dikkatimizi ulusumuzun egemenliğini güvence altına almaya ve Alman halkının çalışkanlığını ve ilerleme ve mükemmellik arzusunu koruyan uygun bir savunma sanayisi inşa etmeye çevirebiliriz."
 GER_build_the_eastern_bulwark:0 "Doğu Siperini İnşa Et"
 GER_build_the_eastern_bulwark_desc:0 "Doğumuzdaki ülkeler, [SOV.GetAdjective] tehdidine karşı düzgün bir şekilde direnemeyecek kadar zayıf savunmalara sahip. Onları ele geçirmeye çalışmanın düşman için mümkün olduğunca maliyetli olması için ülkelerinde tahkimatlara yatırım yapmalıyız."
 GER_build_the_eastern_bulwark_ns_tt:0 "§Y[SOV.GetNameDef]§! ile savaşa girildiğinde, şunları kazanacağız:"
 GER_build_the_eastern_bulwark_tt:0 "§Y[SOV.GetNameDef]§! ile sınırda olan §Y[ROOT.GetNameDef]§! veya §Y[ROOT.GetNameDef]§! tarafından garanti edilen veya onunla bir ittifakta olan herhangi bir ülkenin sahip olduğu tüm eyaletlerde 2. seviye §YKara Kalesi§! inşa eder."
 GER_build_the_rur_dam:0 "Rur Barajını İnşa Et"
 GER_build_the_rur_dam_desc:0 "Rur Barajı'nı inşa etmek sadece bir mühendislik başarısından daha fazlasıdır - geleceğe bir yatırımdır. Baraj sadece bölgedeki ekonomik kalkınmayı desteklemekle kalmayacak, aynı zamanda sanayi çabalarımızı ve üretim çıktımızı da besleyecektir."
 GER_build_volkshalle_landmark_tt:0 "§Y$landmark_berlin_reichstag$§!'ı §Y$landmark_berlin_volkshalle$§! ile değiştirir!"
 GER_bypass_end_to_fascist_europe_tt:0 "Değil: Başka herhangi bir ülke:\n   Başkent Eyaleti: §YAvrupa§!'da!\n   Mevcut yönetici parti §YFaşist§!."
 GER_bypass_maginot_in_the_south_ww:0 "$GER_bypass_maginot_in_the_south$"
 GER_bypass_maginot_in_the_south_ww_desc:0 "$GER_bypass_maginot_in_the_south_desc$"
 GER_cannot_join_oppossing_civil_war_side_tt:0 "Bu karakterler, olası bir §Yİç Savaşta§! karşı tarafa katılamayacaklardır:"
 GER_carrier_variants_tt:0 "§Y$early_ship_hull_carrier$§!, §Y$basic_ship_hull_carrier$§! veya §Y$ship_hull_carrier_2$§! teknolojisine bağlı olarak Uçak Gemisi §Yvaryantı§! ve §Yüretim hattı§! oluştur. Mevcut etki:\n"
 GER_carte_blanche_for_alsace_and_french_colonies_ww:0 "$GER_carte_blanche_for_alsace_and_french_colonies$"
 GER_carte_blanche_for_alsace_and_french_colonies_ww_desc:0 "$GER_carte_blanche_for_alsace_and_french_colonies_desc$"
 GER_carve_up_congo:0 "Kongo'yu Paylaş"
 GER_carve_up_congo_desc:0 "Kongo sömürgeleştirilmeye hazırdır ve doğal kaynaklar bakımından zengindir. Belki de İngiliz yatıştırıcılarla bu geniş toprağı aramızda bölüşmek için bir anlaşma bulabiliriz, bu da sömürge imparatorluğumuzu yeniden şekillendirme çabalarımızda büyük bir adım olur."
 GER_carve_up_czechoslovakia:0 "Çekoslovakya'yı Paylaş"
 GER_carve_up_czechoslovakia_desc:0 "[CZE.GetAdjective] devleti sadece bizim değil, aynı zamanda güneydeki müttefiklerimizin de hırslarının önünde duruyor. Mitteleuropa'nın gerçekleştirilebilmesi için onları aramızda paylaşmalıyız."
 GER_central_planning:0 "Merkezi Planlama"
 GER_central_planning_desc:0 "Ekonomimiz şimdi devletin elinde olduğuna göre, ekonomik planlamamızın da merkezileştirilmesi sadece doğru görünüyor. Sonuçta, sadece ülke ekonomisine genel bir bakışı olanların nereye yatırım yapılacağı ve kaynakların en iyi nasıl dağıtılacağı konusunda en iyi kararları vermesi beklenebilir."
 GER_challenge_the_monroe_doctrine:0 "Monroe Doktrinine Meydan Oku"
 GER_challenge_the_monroe_doctrine_desc:0 "Mesafemiz uzak olsa da, Orta ve Güney Amerika'daki bazı ülkeler ideolojik olarak bize çok yakın. Onlarla iyi ilişkiler kurarak ve sürdürerek her ikimiz de büyük fayda sağlayabiliriz. Ayrıca, başka bir kıtada bir dayanak noktası oluşturmak gelecek için çok değerli olabilir."
 GER_challenge_the_monroe_doctrine_tt:0 "§YMonroe Doktrinini İstikrarsızlaştırmak§! için kararlar açar.\n\n§Y[USA.GetNameDef]§!'i bilgilendirir ve onlara §RMüdahale§! etmeye çalışma izni verir."
 GER_challenge_the_monroe_doctrine_tt_2:0 "En az 7 Ülke hala §YMonroe Doktrini§!'ni aktif tutuyor"
 GER_civil_liberties:0 "Sivil Özgürlükler"
 GER_civil_liberties_desc:0 "Yoldaşlarımız arasında, devletin verimli ve güvenli bir şekilde işlemesi için her bireyi uyuma zorlaması gerektiğine dair bir yanılgı var. Ancak bu, sosyalizmin hedeflerine aykırıdır. Ancak sivil özgürlüklerin korunmasıyla halk devlete gerçekten sadık olacaktır."
 GER_claim_old_colonies_in_the_east:0 "Doğu'daki Eski Sömürgeleri Talep Et"
 GER_claim_old_colonies_in_the_east_desc:0 "Versay Antlaşması bizi sömürgelerimizden mahrum etti ve bunları Müttefik uluslara dağıttı. Halkımız, bizim gibi, bunun yasadışı olduğunu düşündüklerini açıkça belirtti. Doğu'da diplomatik ilişkiler kurmanın bir parçası olarak, sömürgelerimizi geri almaya çalışmayı da düşünmeliyiz."
 GER_claim_old_colonies_in_the_east_tt:0 "§Yİttifak Üyelerine§! ve §Y[CHI.GetNameWithFlag]§!'a §YGüney-Doğu Asya§!'daki eski [GER.GetAdjective] sömürgeleri üzerinde kontrol talep eden bir etkinlik gönderir. Reddetmeleri veya toprağın müttefik olarak görmediğimiz bir ülke tarafından kontrol edilmesi durumunda, tartışmalı eyaletler üzerinde §Ytalebimiz§! olur."
 GER_closer_sino_germanic_relations:0 "Daha Yakın Çin-Alman İlişkileri"
 GER_closer_sino_germanic_relations_desc:0 "[CHI.GetAdjective]ler uzun zamandır müttefikimizdi ve birçoğu o zamanlar [CHI.GetAdjective] hükümetinin Büyük Savaş'a bizim tarafımızda girmesini muhtemel görüyordu. Onlarla olan ilişkimize değer vermeli ve uluslarımız arasındaki bağı güçlendirmeye çalışmalıyız."
 GER_coal_liquefaction:0 "Kömür Sıvılaştırma"
 GER_coal_liquefaction_desc:0 "$GER_coal_liquidization_desc$"
 GER_combined_arms:0 "Birleşik Silahlar"
 GER_combined_arms_desc:0 "Teknolojideki hızlı ilerlemeler, savaşın nasıl yürütüldüğünü değiştirdi, bundan faydalanmalıyız. Birleşik silahlar ilkesini benimseyerek ve piyade, zırhlı ve hava desteğini senkronize etmek için kapsamlı bir strateji oluşturarak, zorlu bir savaş gücü yaratacak ve üstünlüklerini güvence altına alacağız."
 GER_communist_propaganda_middle_east_decision_tt:0 "§Yküçük Orta Doğu ülkelerinde§! §YKomünist Duyguları Güçlendirmek§! için kararlar açar. Etkilenen ülkede komünistler çoğunluk desteğini kazandığında, ülkeyi §YKomünist§! yapmak için bir §Yİç Savaş§! çıkacaktır."
 GER_communist_propaganda_south_america_decision_tt:0 "§Yküçük Güney Amerika ülkelerinde§! §YKomünist Duyguları Güçlendirmek§! için kararlar açar. Etkilenen ülkede komünistler çoğunluk desteğini kazandığında, ülkeyi §YKomünist§! yapmak için bir §Yİç Savaş§! çıkacaktır."
 GER_concentrated_armament_program:0 "Yoğunlaştırılmış Silahlanma Programı"
 GER_concentrated_armament_program_desc:0 "Sanayilerimiz, ulusumuzu yeniden silahlandırmak için askeri ihtiyaçlarımızı desteklemelidir. Silahlı kuvvetlerimizi hızla modernize etmek ve genişletmek için kapsamlı bir yeniden silahlanma programı başlatılmalıdır!"
 GER_conquer_italy:0 "İtalya'yı Fethet"
 GER_conquer_italy_desc:0 "İtalyanlar, Büyük Savaş sırasında Avusturya-Macaristan'a saldırıp Antant'ın yanında yer aldıklarında bize ihanet ettiler. Asla unutmayacağız ve asla affetmeyeceğiz. Onlara ihanetin ve vefasızlığın nihayetinde neye yol açtığını öğretme zamanı geldi."
 GER_construct_aircraft_carriers:0 "Uçak Gemileri İnşa Et"
 GER_construct_aircraft_carriers_desc:0 "Adına layık her büyük ve modern donanmanın filosunda uçak gemileri olmalıdır. Bu gemiler denizlere hükmetmek için giderek daha önemli hale gelecektir, bu yüzden düşmanlarımızın gerisinde kalmamak için iddialı bir uçak gemisi inşa programı başlatmalıyız."
 GER_construct_the_kammhuber_line:0 "Kammhuber Hattını İnşa Et"
 GER_construct_the_kammhuber_line_desc:0 "Düşman bombardıman ve avcı uçaklarının [ROOT.GetNameDef] üzerindeki göklerde serbestçe dolaşmasına izin veremeyiz. Ana topraklarımıza ulaşmadan önce onları durdurabilmek için Fransa kıyısı boyunca bir savunma hattı inşa etmeliyiz."
 GER_construct_the_reichsautobahn:0 "[GetAutobahnName]'ı İnşa Et"
 GER_construct_the_reichsautobahn_desc:0 "$GER_autobahn_desc$"
 GER_controls_an_atantic_island_tt:0 "§Y[ROOT.GetName]§! veya Alman bağlı devleti Kuzey Atlantik Okyanusu'nda bir adayı tamamen kontrol eder"
 GER_controls_atlantic_coast_brittany_finnmark_effects_tt:0 "§YAvrupa Atlantik kıyısı§! boyunca kontrol edilen her eyalet: §G1§! §Y$anti_air_building$§! ekle. Mevcut etki:"
 GER_controls_atlantic_coast_brittany_finnmark_tt:0 "§Y[ROOT.GetName]§! veya bir Alman bağlı devleti, §Y[14.GetName]§!'den §Y[925.GetName]§!'e kadar §YAtlantik kıyısı§! boyunca Alman olmayan bir eyaleti tamamen kontrol eder."
 GER_core_alto_adige_tt:0 "Eğer [ROOT.GetnameDef], [ITA.GetNameDef] ile bir §Yittifakta değilse§! ve [39.GetName]'yi §Ytamamen kontrol ediyorsa§!:"
 GER_core_ardennes_tt:0 "Eğer [ROOT.GetnameDef], [BEL.GetNameDef] ile bir §Yittifakta değilse§! ve [980.GetName]'yi §Ytamamen kontrol ediyorsa§!:"
 GER_core_german_switzerland_tt:0 "Eğer [ROOT.GetnameDef], [SWI.GetNameDef] ile bir §Yittifakta değilse§! ve [3.GetName], [847.GetName] ve [151.GetName]'yi §Ytamamen kontrol ediyorsa§!:"
 GER_country_leader_change_blocks_progress_demonstration_military_achievement_tt:0 "§R§Y$GER_demonstration_of_military_achievements$§!'i tamamladıktan sonra Ülke Liderini değiştirmek, §Y$GER_an_invincible_army$§! ve §Y$GER_the_supreme_leader$§!'in tamamlanmasını engelleyecektir§!"
 GER_country_leader_change_blocks_progress_invincible_army_tt:0 "§R§Y$GER_an_invincible_army$§!'i tamamladıktan sonra Ülke Liderini değiştirmek, §Y$GER_the_supreme_leader$§!'in tamamlanmasını engelleyecektir§!"
 GER_create_asian_reichskommissariat:0 "Asya Reichskommisariatları Oluştur"
 GER_create_asian_reichskommissariat_desc:0 "Sıradan bir sömürgenin birçok faydası vardır, ancak Führer'imizin Asya'daki sömürgelerimiz için daha da büyük planları var. Onun sömürge yasasını yürürlüğe koymak, ilgili herkes için faydalı olacaktır!"
 GER_create_four_militia_units_tt:0 "§Y4 Alman Milis§! birimi oluştur"
 GER_create_one_motorized_units_tt:0 "§Y1 Alman Motorize§! birimi oluştur"
 GER_create_rustungsstab:0 "Rüstungsstab'ı Oluştur"
 GER_create_rustungsstab_desc:0 "Silah imalatını modernize etme çabamız başarılı oldu, ancak daha fazla iyileştirme gerekiyor! Bir Silahlanma Kurmayı oluşturmak, silah üretimimizi artırmak için kaynakları tahsis etme ve projeleri önceliklendirme stratejileri geliştirmemize olanak tanıyacaktır."
 GER_create_two_light_panzer_units_tt:0 "§Y2 Alman Hafif Zırhlı§! birimi oluştur"
 GER_create_two_medium_panzer_units_tt:0 "§Y2 Alman Orta Zırhlı§! birimi oluştur"
 GER_create_two_militia_units_tt:0 "§Y2 Alman Milis§! birimi oluştur"
 GER_create_two_motorized_units_tt:0 "§Y2 Alman Motorize§! birimi oluştur"
 GER_criteria_for_economy_laws_tt:0 "§Y$partial_economic_mobilisation$§! etkinleştirilmişse, Ekonomi Yasasını mevcutsa §Y$war_economy$§!'e değiştirecektir."
 GER_crossing_the_atlantic_dockyards_tt:0 "[ROOT.GetNameWithFlag] tarafından tamamen kontrol edilen Avrupa kıyı eyaletlerinde §Y2 $dockyard$§! ekle, inşa edilen her tersane için §Y1 $arms_factory$§!'yi kaldır. \n(Etkiler, en az bir $arms_factory$ içeren kıyı eyaletlerine öncelik vererek en fazla [?crossing_the_atlantic_max_states_for_dockyards|Y0] eyalete uygulanır)"
 GER_cruiser_warfare:0 "Kruvazör Savaşı"
 GER_cruiser_warfare_desc:0 "Hafif kruvazörlerimiz sadece eskort görevlerine indirgenmekten daha faydalı olabilir; düşmanlarımızın konvoylarını kesmek ve sanayi kapasitelerini felç etmek için onları açık denizlere göndermeliyiz."
 GER_currency_reforms:0 "Para Birimi Reformları"
 GER_currency_reforms_desc:0 "Ekonomik toparlanma ve canlanmanın ilk adımı, kapsamlı para birimi reformları yapmaktır."
 GER_current_future_volkskommisariats_tt:0 "Tüm mevcut ve gelecekteki §YVolkskommissariatlar§!:"
 GER_czechoslovakia:0 "[CZE.GetName]'deki İşçileri Kurtar"
 GER_czechoslovakia_desc:0 "Sadece güneydeki sınırın hemen karşısında, [CZE.GetNameDef]'de, hala kapitalizmin prangalarından kurtarılması gereken işçiler var. Henüz doğru komünizm biçiminin ışığını tam olarak görmediler ve ne şekilde olursa olsun onlara bunu getirdiğimizden emin olmalıyız. İyi yoldaşlar olarak görevimiz budur."
 GER_danzig_for_guarantees_ww:0 "$GER_danzig_for_guarantees$"
 GER_danzig_for_guarantees_ww_desc:0 "$GER_danzig_for_guarantees_desc$"
 GER_danzig_for_slovakia:0 "$GER_danzig_vs_slovakia$"
 GER_danzig_for_slovakia_desc:0 "$GER_danzig_vs_slovakia_desc$"
 GER_defend_the_vaterland:0 "Vatanı Savun"
 GER_defend_the_vaterland_desc:0 "Sınırlarımızda beliren tehditlerle, Vatan savunmasında kararlı durmalıyız! Alman halkını korumak için, mevzilerimizi güçlendirmeli ve birliklerimizi toplamalıyız - [ROOT.GetNameDef] direnecek ve zafer kazanacaktır!"
 GER_defense_of_the_reich:0 "[GetDefenseofGermanyName] Savunması"
 GER_defense_of_the_reich_communism:0 "Proleter Devriminin"
 GER_defense_of_the_reich_democratic:0 "[GER.GetName]"
 GER_defense_of_the_reich_desc:0 "Vatanı düşman hava saldırılarından korumalıyız. [ROOT.GetNameDef] üzerindeki gökleri güvence altına almak ve yerdeki sanayileri korumak her şeyden önce gelmelidir!"
 GER_defense_of_the_reich_fascism:0 "Reich'ın"
 GER_defense_of_the_reich_neutral:0 "İmparatorluğun"
 GER_defense_treaty_with_the_soviet:0 "Sovyet ile Savunma Antlaşması"
 GER_defense_treaty_with_the_soviet_desc:0 "Şimdi [SOV.GetAdjective]lerle düşmanlıklara girmeme konusunda anlaştığımıza göre, diplomatik ilişkiyi bir adım daha ileri götürmeyi düşünmeliyiz. Onları korumamıza layık görüyoruz ve onların da aynı şekilde hissedeceğini ve karşılıklı bir savunma antlaşmasının bizim olduğu kadar onların da çıkarına olacağını varsayıyoruz."
 GER_demand_further_polish_concessions:0 "Daha Fazla Polonya Tavizi Talep Et"
 GER_demand_further_polish_concessions_desc:0 "Polonyalıları eski İmparatorluğun ayrılmaz parçalarını bize geri vermeye ikna ettik, ama burada durmayacağız. Brest-Litovsk sınırları henüz restore edilmedi ve Polonya hala hayallerimizi gerçekleştirmenin önünde duruyor."
 GER_demand_lithuanian_integration:0 "Litvanya Entegrasyonunu Talep Et"
 GER_demand_lithuanian_integration_desc:0 "Litvanya krallığı bir zamanlar ulusumuzun yarı özerk bir parçası olarak planlanmıştı ve öyle de olacak. Litvanya topraklarının ilhakını aramalı ve Mindaugas'ı bölgelerin Dükü olarak taçlandırmalıyız."
 GER_demand_the_return_of_southern_jutland:0 "Güney Yutland'ın İadesini Talep Et"
 GER_demand_the_return_of_southern_jutland_desc:0 "Schleswig Dükalığı'nın mülkiyeti, biz ve Danimarkalılar arasında uzun zamandır tartışmalı bir konu olmuştur. Büyük Savaş'ın sonunda, içinde yer almamalarına rağmen, Antant Kuzey Schleswig'i onlara verdi. Bu tarihi adaletsizliği geri almalı ve Danimarka hükümetinden onu bize geri vermesini talep etmeliyiz."
 GER_demands_to_sweden:0 "İsveç'e Talepler"
 GER_demands_to_sweden_desc:0 "Kuzey [SWE.GetNameDef]'deki çelik madenleri, askeri sanayimiz için hayati bir varlıktır. [SWE.GetAdjective] ile ticaret yapmaya devam edip edemeyeceğimizi şansa bırakamayız. Bu ticaret yolu en kısa zamanda güvence altına alınmalıdır."
 GER_democratic_shield:0 "Demokratik Kalkan"
 GER_democratic_shield_desc:0 "Demokrasi, bir zamanlar bizim ulusumuzda olduğu gibi, tüm dünyada tehlikede. Otoriter ve totaliter popülistlerin dehşetini biliyoruz ve diğer ulusların halklarının bir zamanlar bizim yaşadıklarımızdan geçmemesini sağlamalıyız."
 GER_demonstration_of_military_achievements:0 "Askeri Başarıların Gösterimi"
 GER_demonstration_of_military_achievements_desc:0 "Tarihimiz büyük askeri başarılarla doludur. Birliklerimizin şu anda başardıklarının bu büyük askeri başarılardan bir diğeri olacağını kabul ederek, morali yükseltebilir ve bize olan sadakatlerini daha da artırabiliriz."
 GER_demonstration_of_military_achievements_trigger:0 "Aşağıdakilerden biri doğru olmalıdır:\n   §Y2§!'den fazla Bağlı devlet\n   §YAvrupa§!'da §Y19§!'dan fazla işgal edilmiş eyalet!"
 GER_denazification_campaigns:0 "Nazilerden Arındırma Kampanyaları"
 GER_denazification_campaigns_desc:0 "[GER.GetNameDef]'in tam kalbini enfekte eden Nazi hastalığından gerçekten kurtulmak için, Nazileri veya onları barındıranları bulur bulmaz nazilerden arındırma ve tutuklama konusunda kapsamlı bir çaba göstermeliyiz."
 GER_develop_heraeus_facilities:0 "Heraeus Araştırma Tesislerini Geliştir"
 GER_develop_heraeus_facilities_desc:0 "Yeni tesislere yatırım yapmak, modern bir ordunun ihtiyaç duyduğu değerli metallere yönelik artan talebe erişimi güvence altına alabilir. Bu özel malzemeler elektronik ve yüksek kaliteli silahlanma için gereklidir."
 GER_develop_modern_maneuver_warfare:0 "Modern Manevra Savaşını Geliştir"
 GER_develop_modern_maneuver_warfare_desc:0 "Modern savaşın gelişen doğasını tanımalı ve savaş alanındaki askeri etkinliğimizi en üst düzeye çıkarmak için piyade ve yeni teknolojilerin entegrasyonunu vurgulayan yeni bir doktrin geliştirmeliyiz."
 GER_develop_the_knickebein:0 "Knickebein'i Geliştir"
 GER_develop_the_knickebein_desc:0 "Karmaşık bir radyo navigasyon sistemi kullanarak, uçaklarımızı daha hassas hassas bombalama yapmaları için yönlendirmenin bir yolunu bulduk. Bu yeni teknolojileri kullanarak, düşmanımızın fabrikalarını daha etkili bir şekilde yerle bir edebiliriz - gece bile."
 GER_dive_bombers:0 "Dalga Bombardıman Uçakları"
 GER_dive_bombers_desc:0 "$GER_tactical_air_effort_desc$"
 GER_divide_and_conquer:0 "Böl ve Fethet"
 GER_divide_and_conquer_desc:0 "Biz ve [CHI.GetAdjective], uzak doğuda arzu ettiğimiz etki alanlarına sahibiz ve bir noktada sınırlar çizilip saygı gösterilmesi gerekecek. Bu nedenle, bunu mümkün olan en kısa sürede yapmalıyız, böylece her iki imparatorluk hayalimiz de tanınabilir."
 GER_eastern_duchies_name_democratic:0 "Doğu Özerk Devletleri"
 GER_eastern_duchies_name_neutrality:0 "Doğu Büyük Dükalıklarını Kur"
 GER_effective_operations:0 "Etkili Operasyonlar"
 GER_effective_operations_desc:0 "Stasi büyümeye devam ettikçe, operasyon sahasını genişletmeliyiz. [ROOT.GetAdjective] sınırları dışında yürütülen görevler, devlet güvenliğimiz için ülke içinde başlatılanlar kadar önemlidir."
 GER_effectivize_the_volkswerke:0 "Volkswerke'yi Etkinleştir"
 GER_effectivize_the_volkswerke_desc:0 "Sözde Volkswerke, seleflerimizin sahip olduğu birkaç fikirden biridir. Madencilik ve çelik endüstrisi içinde büyümeyi ve üretimi denetlemek için devlet kontrolündeki bir sanayi holdingi olarak Volkswerke, ona yapabileceğimiz tüm iyileştirmelere layıktır."
 GER_embrace_democratic_institutions:0 "Demokratik Kurumları Benimse"
 GER_embrace_democratic_institutions_desc:0 "Liberal demokrasi, burjuvazi için bir paravandan başka bir şey değildir. Gerçek demokrasi, ekonomik olduğu kadar sosyal eşitlik de gerektirir. Bu nedenle, halkın iradesini ulusu yönetme sürecine tam olarak dahil etme konumunda olan tek biziz."
 GER_embrace_liberal_leanings:0 "Liberal Eğilimleri Benimse"
 GER_embrace_liberal_leanings_desc:0 "Muhafazakarlık, Kayserimiz savaşın sonunda politikacılarımızın yapabildiğini yapamadığında modası geçmiş olduğunu kanıtladı. Her zaman ileriye bakmalı ve daha iyi bir yarın için çabalamalıyız!"
 GER_employ_philipp_holzmann:0 "Philipp Holzmann'ı İşe Al"
 GER_employ_philipp_holzmann_desc:0 "Albert Speer, Führer'in üstlenmek istediği birkaç büyük inşaat projesi için Philipp Holzmann AG'yi işe alma fikrini ortaya attı. Şirketin iyi bir itibarı ve uzun bir geçmişi var, Hamburg Belediye Binası ve orijinal Reichstag gibi mimari şaheserler inşa etmişlerdir. İhtiyaçlarımız için iyi bir uyum olacaklardır!"
 GER_end_european_communism:0 "Avrupa Komünizmini Bitir"
 GER_end_european_communism_desc:0 "Şimdi ulusumuza yönelik en büyük tehdit yok edildiğine göre, Avrupa'da bıraktıkları pisliği temizleme zamanı geldi. Komünizm, değerlerimize temel bir tehdittir ve sonsuza dek yok edilmelidir."
 GER_ensure_army_loyalty:0 "Ordu Sadakatini Sağla"
 GER_ensure_army_loyalty_desc:0 "Saflar içinde, uymak zorunda kaldıkları aptallık yerine davamıza hala ikna edilebilecek olanlar var. Biraz çalışma gerektirecek, ancak askerlerimize iyi bir topluluk ruhu aşılayarak, yıllarca sadakatlerini sağlayabiliriz."
 GER_establish_a_customs_union:0 "Bir Gümrük Birliği Kur"
 GER_establish_a_customs_union_desc:0 "Eski Septemberprogramm'daki planlar gibi, şimdi Mitteleuropa gümrük birliğini kurmalı ve yavaş ama emin adımlarla Avrupa ekonomilerini en güçlü tek bir güçte birleştirmeliyiz."
 GER_establish_buna_werke:0 "Buna-Werke'yi Kur"
 GER_establish_buna_werke_desc:0 "Büyük ölçekli motorizasyon ve havacılık, Almanya'da hiçbir kaynağa sahip olmadığımız büyük miktarda kauçuk gerektirir. Yabancı ticarete daha az bağımlı olmak için sentetik kauçuk üretebilen fabrikalar inşa etmeliyiz."
 GER_establish_carrier_groups:0 "Uçak Gemisi Grupları Kur"
 GER_establish_carrier_groups_desc:0 "Rakipsiz bir uçak gemisi filosu yaratmaya kararlı olarak, pilotlarımızı bu güvertelerden operasyon yapmak için eğitmeliyiz. Uçaklarımız hem deniz hem de kara üzerindeki göklere hükmedecektir!"
 GER_establish_eastern_grand_duchies:0 "[GetEasternDuchiesName]"
 GER_establish_eastern_grand_duchies_desc:0 "Antlaşmada kapsanan toprakların tamamı doğrudan bizim tarafımızdan tutulamaz. Ancak doğuda, bu toprakları bizim için tutabilecek Büyük Dükalıklar ve Uydu Krallıklar için planlarımız var."
 GER_establish_night_fighter_squadrons:0 "Gece Avcı Filoları Kur"
 GER_establish_night_fighter_squadrons_desc:0 "Vatan savunmamızdaki bir sonraki adım olarak, Nachtjagdgeschwader, yani Gece Avcı Filoları oluşturmalıyız. Havadan radar kullanmak, göklerimizi düşmandan arındırma arayışlarında onları gece gündüz etkili kılacaktır."
 GER_establish_production_targets:0 "Üretim Hedefleri Belirle"
 GER_establish_production_targets_desc:0 "Herhangi bir askeri harekat başlatmadan önce, önce silahlı kuvvetlerimizi modernize etmeli ve teçhizatlandırmalıyız. Üretim çıktısını artırmak için kotalar ve iddialı üretim hedefleri uygulamalıyız."
 GER_establish_protectorates_in_america:0 "Amerika'da Himayeler Kur"
 GER_establish_protectorates_in_america_desc:0 "Amerika kıtalarındaki ülkeler, ideallerimizle uyuşmayan şekillerde çok uzun süredir yönetiliyor. Uzun bir süre optimal olmayan yönetimden sonra bu toprakları düzeltmek için tam ölçekli bir yeniden yapılanma gerekecektir."
 GER_establish_the_afrikakorps:0 "Afrikakorps'u Kur"
 GER_establish_the_afrikakorps_desc:0 "Düşmanımızın ikmal hatlarını bozabilmek ve hayati kaynakları ve stratejik konumları güvence altına alabilmek için, savaşı Avrupa'dan çıkarıp yabancı kıyılara taşımalıyız!"
 GER_establish_the_reichswerke:0 "$GER_reichswerke$'i Kur"
 GER_establish_the_reichswerke_desc:0 "$GER_hermann_goring_werke_desc$"
 GER_establish_the_skijager:0 "Skijäger'i Kur"
 GER_establish_the_skijager_desc:0 "Silahlı kuvvetlerimizin her türlü hava koşulunda etkinliğini ve uyarlanabilirliğini sürdürmesini sağlamak için, kış savaşı sanatında ustalaşmalıyız. Bu amaçla, karlı ve dağlık arazide etkili bir şekilde faaliyet göstermek üzere Skijäger olarak bilinen özel dağ birliklerini eğitecek ve teçhizatlandıracağız."
 GER_establish_volkskommissariats:0 "Volkskommissariatları Kur"
 GER_establish_volkskommissariats_desc:0 "Yabancı işgali kabul edilemez, ancak yeni kurtarılmış komşularımız arasında meşru işçi liderliğindeki hükümetler kurmak için, zorlu vekillik sorumluluğunu üstlenecek ve onları sosyalist ideale doğru yönlendireceğiz."
 GER_establish_volkskommissariats_tt:0 "Mevcut ve gelecekteki ideolojimizi paylaşan §Ykomşu bağlı devletlerde§! §YVolkskommissariatlar Kurmak§! için kararlar açar."
 GER_establish_western_grand_duchies:0 "[GetWesternDuchiesName]"
 GER_establish_western_grand_duchies_desc:0 "Septemberprogramm'daki plan gibi, kendi müşteri devletlerimizi yaratarak ve sınırları uygun gördüğümüz gibi çizerek batı bölgeleri üzerindeki kontrolümüzü kurmaya çalışmalıyız."
 GER_european_confederation:0 "Avrupa Konfederasyonu"
 GER_european_confederation_desc:0 "Müttefiklerimiz şimdi bize büyük ölçüde güvendiğine göre, onları daha da entegre etmeye çalışma zamanı geldi, bir Avrupa Konfederasyonu kurma hayalleriyle."
 GER_event_to_replace_ascended_advisor_tt:0 "'§Y$CHARACTER$'ın Yükselişi§!' olayını alır: \n§Y$CHARACTER$§!, §Yİç Çember§! içinde §Y[GetAscendedAdvisorName1]§!, §Y[GetAscendedAdvisorName2]§! veya §Y[GetAscendedAdvisorName3]§!'in yerini alabilir."
 GER_expand_african_reach:0 "Afrika Erişimini Genişlet"
 GER_expand_african_reach_desc:0 "Afrika'da iddia ettiğimiz ancak mevcut düşmanlarımızın kontrolü altında olmayan bölgeler var. İddialarımızın netleştirildiğinden ve bu toprakları onlardan derhal talep ettiğimizden emin olmalıyız."
 GER_expand_claims_in_baltic:0 "Baltık'taki Talepleri Genişlet"
 GER_expand_claims_in_baltic_desc:0 "Tarihsel olarak Baltık'ta hatırı sayılır bir [ROOT.GetAdjective] diasporası yaşamıştır. Onları [ROOT.GetNameDef]'e geri getirmek, bizimki kadar onların da çıkarınadır!"
 GER_expand_gestapo:0 "Gestapo'yu Genişlet"
 GER_expand_gestapo_desc:0 "Gestapo, siyasi muhalefetle ve diğer baş belalarıyla başa çıkmada en yetkin olduğunu kanıtladı. Onu genişleterek, nüfusumuzun mevcut yasalara ve beklentilere uygun hareket etmesini sağlayabiliriz."
 GER_expand_kriegsmarinewerft:0 "[GetKriegsmarinewerftName]'i Genişlet"
 GER_expand_kriegsmarinewerft_communism:0 "Volksmarinewerft"
 GER_expand_kriegsmarinewerft_democratic:0 "Marinewerft"
 GER_expand_kriegsmarinewerft_desc:0 "Düşmanlarımızınkine rakip olacak bir donanma inşa etme çabalarımızı iki katına çıkarmalıyız. Gemi yapımının ön saflarında teknolojiler kullanarak ve en son teknoloji savaş gemileri inşa ederek, açık denizlerin kontrolünü kesinlikle düşmanlarımızın elinden alacağız."
 GER_expand_kriegsmarinewerft_fascism:0 "Kriegsmarinewerft"
 GER_expand_kriegsmarinewerft_neutrality:0 "Kaiserliche Marinewerft"
 GER_expand_kummersdorfs_capacity:0 "Kummersdorf'un Kapasitesini Genişlet"
 GER_expand_kummersdorfs_capacity_desc:0 "Panzer geliştirmede başı çekmeli ve savaş alanındaki hakimiyetimizi sağlamak için yeniliklere öncülük etmeliyiz. Kummerdorf'taki tesislerde düşman tank tasarımlarını inceleyerek ve en son teknolojiyi kullanarak, tüm rakipleri geride bırakacak ilerlemelere öncülük edeceğiz."
 GER_expand_pacific_holdings:0 "Pasifik Mülklerini Genişlet"
 GER_expand_pacific_holdings_desc:0 "Pasifik Okyanusu'nda bir imparatorluk için kanlı bir dişe sahip olarak, politikacılarımız bölgedeki erişimimizin genişletilmesini ve uzak doğuda [ROOT.GetAdjective] hegemonyası kurma hedefini savunuyor. Bu girişimi desteklemeli ve saldırıya geçmeliyiz."
 GER_expand_social_welfare:0 "Sosyal Refahı Genişlet"
 GER_expand_social_welfare_desc:0 "Büyük Savaş'tan sonra, halka fayda sağlamak için bir refah sistemi geliştirmeye başladık, ancak bu Büyük Buhran'dan sonra daha sınırlı hale geldi. Bu kurumu yeniden inşa etmek için kaynakları dökmeli ve onu her Alman için bir onur nişanı haline getirerek dünyaya Komünizmin üstünlüğünü kanıtlamalıyız."
 GER_expand_ss_recruitment:0 "SS Askere Alımını Genişlet"
 GER_expand_ss_recruitment_desc:0 "SS'e katılma gereklilikleri yüksektir ve sürecin kendisi bir iğne deliğinden geçmek zorunda olmak olarak tanımlanmıştır. En kaliteli bir gücü sağlamak için gerekliliklerin yüksek kalması gerekirken, askere alım, standartlarımızı düşürmeyi gerektirmeyen başka yollarla genişletilebilir."
 GER_expand_ss_security_duties:0 "SS Güvenlik Görevlerini Genişlet"
 GER_expand_ss_security_duties_desc:0 "SS, Heinrich Himmler'in rehberliğinde istikrarlı bir şekilde büyürken, güvenlik için daha büyük bir sorumluluk alma zamanı geldi. Görevlerinin genişlemesine izin vererek, başka yerlerde kullanmak üzere kaynak serbest bırakabiliriz."
 GER_expand_the_reichsautobahn_east:0 "[GetAutobahnName]'ı Doğuya Genişlet"
 GER_expand_the_reichsautobahn_east_desc:0 "Otoban ağını Doğu Prusya'ya doğru genişletmek, ulusumuzun en doğudaki bölgemizi [ROOT.GetNameDef]'in geri kalanıyla bir kez daha bağlama ve birleştirme kararlılığını sergileyecektir. Ayrıca, gerekirse doğuya daha sert ve daha hızlı saldırmamıza olanak tanıyacaktır."
 GER_expand_the_reichsautobahn_east_tt:0 "Eğer §Y[ROOT.GetName]§! veya bir Alman bağlı devleti eyaletleri kontrol ediyorsa, §Y[68.GetName]§!, §Y[63.GetName]§!, §Y[807.GetName]§!, §Y[85.GetName]§!'de §G1§! §Y$infrastructure$§! ve §Y[63.GetName]§!'den §Y[85.GetName]§!'e bir seviye §Y1§! demiryolu ekle. Mevcut etki:"
 GER_expand_the_reichsautobahn_south:0 "[GetAutobahnName]'ı Güneye Genişlet"
 GER_expand_the_reichsautobahn_south_desc:0 "Otoban ağını güneye doğru genişletmek, bölgedeki ekonomik büyümeyi ve kalkınmayı teşvik edecektir. Ayrıca Alplere doğru hızlı asker taşımacılığını sağlayarak askeri yeteneklerimizi de güçlendirecektir."
 GER_expand_the_reichsautobahn_south_tt:0 "Eğer §Y[ROOT.GetName]§! veya bir Alman bağlı devleti eyaletleri kontrol ediyorsa, §Y[53.GetName]§!, §Y[52.GetName]§!, §Y[152.GetName]§!, §Y[4.GetName]§!'de §G1§! §Y$infrastructure$§! ve §Y[53.GetName]§!'den §Y[4.GetName]§!'e bir seviye §Y1§! demiryolu ekle. Mevcut etki:"
 GER_expand_the_truppenschulen:0 "Truppenschulen'i Genişlet"
 GER_expand_the_truppenschulen_desc:0 "Uzman subaylara yönelik artan taleplere ayak uydurmak için, hizmet okulları şubemiz büyük ölçüde genişletilmelidir. Subay adaylarımıza mümkün olan en iyi eğitimi sağlamak, savaş alanındaki başarımızı sağlayacaktır."
 GER_expanding_the_luftwaffe:0 "Luftwaffe'yi Genişletme"
 GER_expanding_the_luftwaffe_desc:0 "$air_innovation_desc$"
 GER_expatriate_the_communists_ww:0 "$GER_expatriate_the_communists$"
 GER_expatriate_the_communists_ww_desc:0 "$GER_expatriate_the_communists_desc$"
 GER_experimental_rotorcrafts:0 "Deneysel Döner Kanatlılar"
 GER_experimental_rotorcrafts_desc:0 "En son tasarımlara yatırım yaparak ve yeni teknolojiler geliştirerek, savaş alanındaki hava hareketliliğini devrimleştirecek erken prototipler geliştirmeye çalışıyoruz. Sözde helikopterlerle dikey kalkış ve iniş yeteneklerini verimli bir şekilde dönüştürmeyi hedefliyoruz."
 GER_extend_mitteleuropas_bounderies:0 "Mitteleuropa'nın Sınırlarını Doğuya Genişlet"
 GER_extend_mitteleuropas_bounderies_desc:0 "Doğumuzdaki uluslar tampon devletlerden daha fazlasıdır. Onları Mitteleuropa'ya davet etmeli ve ittifakımızı ve gümrük birliğimizi daha da güçlendirmelerine yardımcı olmalarını sağlamalıyız."
 GER_extend_mitteleuropas_bounderies_tt:0 "Garanti altındaki Doğu Avrupa devletlerini §YMitteleuropa§!'ya davet eder!"
 GER_extra_funds_to_waffenamt:0 "Waffenamt'a Ek Fonlar"
 GER_extra_funds_to_waffenamt_desc:0 "Waffenamt veya Silah Ajansı, askeri teçhizatın tasarımını ve geliştirilmesini denetler. Silah üreticileri ve araştırma enstitüleriyle işbirliği yapar ve ona ek fonlar vererek ilerleme hızını artırabiliriz."
 GER_factories_for_resources:0 "Kaynaklar İçin Fabrikalar"
 GER_factories_for_resources_desc:0 "[ROOT.GetNameDef]'de daha iyi kullanılabilecek bol miktarda sivil sanayimiz var. [SOV.GetNameDef]'in bazı bölgelerde oldukça az gelişmiş olduğunun farkındayız, tesadüfen söz konusu bölgeler de genellikle değerli kaynaklar bakımından zengindir. Bazı sanayileri bu kaynaklardan bazıları karşılığında yeniden yerleştirme teklifi, bizim için kazançlı bir fırsat olabilir."
 GER_factories_for_resources_tt:0 "Sanayileri kaynaklar karşılığında §Y[SOV.GetNameWithFlag]§!'a yeniden yerleştirmek için §YKararlar§! açar."
 GER_fallschirmjager:0 "Fallschirmjäger"
 GER_fallschirmjager_desc:0 "Hava indirme birliklerinin, yani Fallschirmjäger'in stratejik önemi gözümüzden kaçmadı. Bu seçkin paraşütçüleri düşman hatlarının gerisine hızlı konuşlandırma için eğitmek, çok yönlülüklerini ve savaş hünerlerini artıracak, genel saldırı yeteneklerimizi güçlendirecektir."
 GER_fan_prussian_militarism:0 "$GER_fan_the_prussian_militarism$"
 GER_fan_prussian_militarism_desc:0 "$GER_fan_the_prussian_militarism_desc$"
 GER_fan_prussian_militarism_tt:0 "4. seviye bir Mareşal olarak §YRupprecht von Wittelsbach§!'ı açar"
 GER_fate_of_czechoslovakia:0 "$GER_end_of_czechoslovakia$"
 GER_fate_of_czechoslovakia_desc:0 "$GER_end_of_czechoslovakia_desc$"
 GER_finland_puppet_description_democratic:0 "[FIN.GetAdjective] halkı silah arkadaşlarımız olabilir, ancak bir gün bize ihanet edip taraf değiştirmeyeceklerinden asla emin olamayız. Böyle bir günün asla gelmemesini sağlamalıyız, bedeli ne olursa olsun!"
 GER_finland_puppet_description_neutrality:0 "[FIN.GetAdjective] halkı geçmişte bir kral atama teklifimizi reddetti, ancak bir daha yapmalarına izin vermeyeceğiz. Hesse Prensi Wolfgang'ın, isteseler de istemeseler de tahtlarına geçme zamanı geldi."
 GER_focus_can_only_be_completed_by_advisor_multiple_tt:0 "Bu odak, §Y$FOCUS$§! veya §Y$FOCUS_2$§! odağını tamamladıktan sonra sadece §Y$CHARACTER$§! veya §Y$CHARACTER_2$§! tarafından başlatılabilir."
 GER_focus_can_only_be_completed_by_advisor_tt:0 "Bu odak, §Y$FOCUS$§! odağını tamamladıktan sonra sadece §Y$CHARACTER$§! tarafından başlatılabilir."
 GER_form_agricultural_cooperatives:0 "Tarımsal Kooperatifler Kur"
 GER_form_agricultural_cooperatives_desc:0 "Tarım sektörü bizim için en önemli sektörlerden biridir. Birkaç sanayi, çiftlik işçilerine ve onların çalışmalarına bağlıdır ve onları kendi başlarına bırakmak sorumlu bir eylem değildir. Kooperatifler kurarak, tarım sektörünün birlik içinde, maksimum verimlilik ve minimum kayıpla birlikte çalışmasını sağlayabiliriz."
 GER_form_organization_todt:0 "Todt Teşkilatını Kur"
 GER_form_organization_todt_desc:0 "Führer'in yapılmasını istediği birkaç büyük inşaat projesi olsa da, çoğu beklemek zorunda kalacak. En acil olarak [ROOT.GetNameDef], daha fazla askeri sanayiye şiddetle ihtiyaç duyuyor. Planlama Fritz Todt'un ellerinde olduğuna göre, sonucun iyi olacağından eminiz."
 GER_form_rome_berlin_axis:0 "Roma-Berlin Mihverini Kur"
 GER_form_rome_berlin_axis_desc:0 "$GER_italy_ally_desc$"
 GER_form_the_jagdwaffe:0 "Jagdwaffe'yi Kur"
 GER_form_the_jagdwaffe_desc:0 "Hava üstünlüğünü sağlamak için, adanmış bir avcı uçağı gücü olan bir Jagdwaffe kurmalıyız. Titiz eğitim, ileri taktikler ve en son teknolojiyi birleştirerek, göklere hükmedecek ve kara kuvvetlerimizin savaş alanı boyunca yuvarlanmasına, yeri gök gürültüsü gibi sarsmasına izin vereceğiz."
 GER_form_the_stasi:0 "Stasi'yi Kur"
 GER_form_the_stasi_desc:0 "İstihbarat Kanadı büyük bir başarı oldu ve şimdi Devlet Güvenliği ile ilgilenen bir Bakanlık kurma olasılığına bakmaya başladık. Halk arasında en popüler karar olmayabilir, ama gerekli bir karardır."
 GER_formalize_the_intelligence_wing:0 "İstihbarat Kanadını Resmileştir"
 GER_formalize_the_intelligence_wing_desc:0 "Ülke, halkın çıkarlarını düşünmeyen yöneticiler altında büyük acılar çekti. Şimdi ulusu yeniden inşa edebileceğimizden emin olmak için önce neyle çalışmamız gerektiğini bilmeliyiz. İşlevsel bir İstihbarat Kanadı iyi bir başlangıç olacaktır!"
 GER_fortify_the_vaterland:0 "Vatanı Tahkim Et"
 GER_fortify_the_vaterland_desc:0 "[GER.GetNameDef]'i güvence altına almak için, ihtiyaç duyulan her yerde tahkimatlar inşa etmeliyiz. Savunmamızı güçlendirmek, sınırları daha az adamla tutmamızı sağlayacak, bu da başka yerlerdeki olası saldırılara katılmak için tümenleri serbest bırakacaktır."
 GER_fortify_the_vaterland_unlock_decision_tt:0 "Kararı açar: §Y$GER_fortify_the_vaterland_cat$§!"
 GER_franco_germanic_pact:0 "Fransız-Alman Paktı"
 GER_franco_germanic_pact_desc:0 "[FRA.GetAdjective] ile olan ilişkilerimizin son zamanlarda normalleşmesiyle, ilişkimizi derinleştirmek ve Doğu'daki [SOV.GetAdjective]lere karşı birlikte durabilmemiz için bir dostluk ve karşılıklı yardım paktını resmileştirmek akıllıca olacaktır."
 GER_freikrops_militia_recruitment_tt:0 "Beş Freikorps §YMilis§! birimi kazan"
 GER_fuhrer_name_text:0 "§Y[ROOT.GetLeader]§!"
 GER_fuhrer_title_text:0 "Führer"
 GER_fuhrer_title_text_female:0 "Führerin"
 GER_fuhrer_tooltip:0 "[GetFuhrerGenderedName] §Y[GetFuhrerName]§!."
 GER_fuhrerprinzip:0 "Führerprinzip"
 GER_fuhrerprinzip_desc:0 "Führer, en yakınındakilerden tam sadakat bekler, ancak güvendiği az sayıdaki kişi, hiçbirinin üzerinde durdukları taşlardan daha değerli olmadığını unutmamalıdır. Tek bir çizgi dışına çıkma veya Führer'in isteklerine uygun hareket etmeme, korkunç sonuçlara yol açabilir. Rotamızı tek başına Führer belirleyecektir."
 GER_fuhrerprinzip_inner_circle_tt:0 "§Yİç Çember§! Mekaniğini etkinleştirir.\n\n"
 GER_fund_the_film_department:0 "Film Departmanını Finanse Et"
 GER_fund_the_film_department_desc:0 "Film, halka ilham vermek ve onları yönlendirmek için güçlü bir araç olduğunu kanıtladı. Vatansever filmler üreterek ve tanıtarak, ulusumuzu şanlı [ROOT.GetName]!'imize tamamen adamaya teşvik edeceğiz!"
 GER_gain_autarkic_economy_lock_free_trade_tt:0 "§Y$free_trade$§! ve §Y$export_focus$§!'u §RKilitle§!. §Y$autarkic_economy$§! kazan."
 GER_gain_totaler_krieg_remove_total_mob_tt:0 "§Y$tot_economic_mobilisation$§!'u §RKaldır§!. §Y$totaler_krieg_economy$§! kazan."
 GER_german_hegemony_in_the_middle_east:0 "Orta Doğu'da Alman Hegemonyası"
 GER_german_hegemony_in_the_middle_east_desc:0 "Orta Doğu fetih için olgunlaşmış durumda ve devletlerin birçoğu, İngiliz veya Fransız imparatorluklarına karşı çıkmamız umuduyla bizimle aynı hizaya gelmeye istekli olabilir. Orta Doğu'da hegemonyamızı kurma zamanı geldi."
 GER_glorify_party_rallies:0 "Parti Mitinglerini Yücelt"
 GER_glorify_party_rallies_desc:0 "Siyasi çekirdeğimiz olmadan ülke bocalayacaktır. Martin Bormann, Parti Mitinglerimizin halktan daha fazla destek toplamak için geliştirilebileceğine ve böylece hükümetin nasıl kurulacağı konusunda daha özgür hareket etmemize olanak tanıyacağına dikkat çekti."
 GER_glorious_mechanical_machinations:0 "Görkemli Mekanik Entrikalar"
 GER_glorious_mechanical_machinations_desc:0 "Kaiserimiz uzun zamandır büyük makinelere hayranlık duyuyor ve bilim adamlarımıza, daha önce sadece rüyalarda görülen, devasa demiryolu topları, Atlantik'i aşabilen uçaklar ve silüetleri ufukları kaplayan gemiler gibi yaratımların araştırılmasına öncelik vermelerini emretti."
 GER_glory_to_the_imperial_army:0 "İmparatorluk Ordusuna Şan Olsun"
 GER_glory_to_the_imperial_army_desc:0 "İmparatorluk ordusu savaştan savaşa zafer kazandı ve Prusya ile Almanya'nın Avrupa'daki yerini bulmasını sağladı. Ancak Weltkireg'in sonunda politikacıların ihanetine rağmen, ordu kaybettiği ihtişamını geri kazanabilecektir."
 GER_glory_to_the_imperial_army_tt:0 "2. seviye bir General olarak §YPrens Eitel Friedrich§!'i açar"
 GER_grosskampfschiff_construction:0 "Grosskampfschiff İnşaatı"
 GER_grosskampfschiff_construction_desc:0 "$GER_pride_of_the_modern_germany_desc$"
 GER_heavy_armored_car_recon_company_tt:0 "\n§Y$armored_car_recon$§!:\n §YZırh§!: §G+%5§!\n§Yorman§!:\n Hareket Etkin Değişikliği: §G+%5§!\n§Yçöl§!:\n  Hareket Etkin Değişikliği: §G+%10§!\n§Ydüzlük§!:\n Hareket Etkin Değişikliği: §G+%10§!\n"
 GER_heed_von_neuraths_concerns:0 "Von Neurath'ın Endişelerine Kulak Ver"
 GER_heed_von_neuraths_concerns_desc:0 "Mevcut askeri taktiklerimiz ve politikalarımızla ilgili endişeler, Konstantin von Neurath başkanlığındaki bir dizi yükselmiş askeri üyemiz tarafından dile getirildi. Onlara göre, Führer'in ordu için oldukça agresif planları tutmayacak ve eğer bunları takip edersek ortaya çıkabilecek topyekun bir savaş riski karşısında, ordumuz henüz yeterince güçlü değil."
 GER_hegemony_of_the_ss:0 "SS Hegemonyası"
 GER_hegemony_of_the_ss_desc:0 "Artan askere alım ve daha iyi teçhizatla SS, şimdi savaş alanında zorlu bir güçtür. Himmler'in liderliği altında grup, beklentilerimizin çok ötesinde şeyler yapabilen en önde gelen varlıklarımızdan biri haline geldi. Onlara şimdi sahip oldukları gücü emanet etmek akıllıca bir karardı, ileride onlara başarı için gerekli araçları sağlamaya devam etmeliyiz."
 GER_hegemony_over_europe:0 "Avrupa Üzerinde Hegemonya"
 GER_hegemony_over_europe_desc:0 "Eski, emperyal Avrupa çöküyor. Onun yerine yeni bir sosyalist düzen kuracağız, Avrupa işçileri burjuva tiranlığına karşı onları yönetmemiz için bize bakacak. Bir proleter zaferi, kıta genelinde hegemonyamızı kuracaktır."
 GER_high_seas_fleet:0 "Açık Deniz Filosu"
 GER_high_seas_fleet_desc:0 "İddialı hedefimiz, [ROOT.GetNameDef]'i gerçekten küresel bir güç yapmaktan daha azı olamaz. Bu amaçla, bir zamanlar Kraliyet Donanması'nın okyanuslardaki hakimiyetine neredeyse rakip olan Hochseeflotte'yi veya Açık Deniz Filosu'nu canlandırmalıyız."
 GER_hold_joint_military_drills:0 "Ortak Askeri Tatbikatlar Düzenle"
 GER_hold_joint_military_drills_desc:0 "Doğu müttefiklerimiz [SOV.GetAdjective]lerle bizden daha yakın zamanda savaştılar ve onları nasıl yeneceklerine dair değerli bilgilere sahip olabilirler. Bu tür bilgilerin yayılabilmesi için birlikte askeri tatbikatlar düzenlemeliyiz."
 GER_hold_joint_military_drills_tt:0 "Biz ve garanti ettiğimiz veya ittifakta olduğumuz herhangi bir Doğu Avrupa ülkesi aşağıdaki ulusal ruhu kazanacak:"
 GER_housing_developments:0 "Konut Gelişmeleri"
 GER_housing_developments_desc:0 "Modern evleri yenilemeyi ve yaratmayı ve yeni bir yaşam standardı belirlemeyi amaçlayan bir konut geliştirme programı başlatarak ekonomimizi canlandırabiliriz."
 GER_hungary:0 "[HUN.GetAdjective] İşçilerinin Zulmüne Son Ver"
 GER_hungary_desc:0 "[HUN.GetNameDef]'deki işçiler hala temel olması gereken haklar için mücadele ediyor. Ülkedeki hükümet, onların ihtiyaçlarını görmeyi açıkça başaramadı ve bu nedenle, [HUN.GetName] genelindeki tüm proletaryanın adil ve hak ettikleri saygıyla muamele görmesini sağlamak için devreye girmeliyiz."
 GER_improve_autarkic_economy_tt:0 "§Y$autarkic_economy$§!'i Geliştir!"
 GER_improve_motorized_troops:0 "Motorize Birlikleri Geliştir"
 GER_improve_motorized_troops_desc:0 "Modern savaş, hız ve hızlı saldırı yetenekleri etrafında döner. Schnelltruppen'imizin, yani motorize birimlerimizin, hücumu yönetmeye ve hızlı ve kesin bir zafer sunmaya hazır ve yetenekli olduğundan emin olmalıyız."
 GER_improve_the_logistics_system:0 "Lojistik Sistemini İyileştir"
 GER_improve_the_logistics_system_desc:0 "Yüksek Komuta'daki generallerimizin birçoğu, mevcut sistemimizin sorunlarını anlamadıkları için lojistik ve ikmal zincirlerine karşı küçümseyici bir tavır sergiliyor. Kapsamlı bir lojistik sistemimizi geliştirme girişimine başlarken, modern savaşta verimli lojistiğin son derece önemli olduğunun farkına varmaları gerekir."
 GER_improve_trade_relations_tt:0 "Mevcut ve gelecekteki §Yİttifak Üyeleri§! ile §YTicaret Nüfuzunu§! Geliştir!"
 GER_incorporate_the_polish_rump_state:0 "Polonya Kırıntı Devletini Dahil Et"
 GER_incorporate_the_polish_rump_state_desc:0 "Brest-Litovsk antlaşmasında belirtildiği gibi, Polonya'nın son kalan parçaları bile imparatorluğa aittir. Gerekirse zorla, bu toprakları geri almalıyız."
 GER_increased_trade:0 "Artan Ticaret"
 GER_increased_trade_desc:0 "Eğer Alman halkı gelişecekse, kendi sınırlarımız içinde çıkaramadığımız veya inşa edemediğimiz şeyleri ithal etmeliyiz. Dışarıya bakmalı ve diğer uluslarla yeni ticaret anlaşmaları imzalamalıyız - elbette lehimize olan anlaşmalar."
 GER_industrial_consumer_goods_factor_limit_tt:0 "§Y[GetIndustrialModifier]§!, $MODIFIER_CONSUMER_GOODS_FACTOR$: §Y%90§!'dan §Raz§!ına sahip!"
 GER_industrial_cooperation:0 "Sanayi İşbirliği"
 GER_industrial_cooperation_desc:0 "[SOV.GetAdjective]lerle olan işbirliğimiz şimdiye kadar askeri konularla sınırlıydı. [SOV.GetNameDef]'in bir müttefikimiz olduğu göz önüne alındığında, diğer alanlarda da işbirliği yapmamız sadece mantıklıdır. Sanayi felsefelerimiz zaten yeterince benzer ki, sanayi sektöründeki ortak çabaların başarılması zor olmamalıdır."
 GER_industrial_expansion:0 "Sanayi Genişlemesi"
 GER_industrial_expansion_desc:0 "Uluslararası düzeyde rekabet edebilen ve yeni teknolojilere öncülük edebilen güçlü bir sanayiye sahip olmak, devam eden büyümemiz için çok önemli olacaktır. [ROOT.GetNameDefCap], kalite ile eşanlamlı hale gelecektir."
 GER_industrial_investments:0 "Sanayi Yatırımları"
 GER_industrial_investments_desc:0 "[CHI.GetNameDefCap] çok az gelişmiştir ve dünya sahnesinde büyük bir güç olarak düzgün bir şekilde durmak için ihtiyaç duyacağı sanayileşmeden yoksundur. Sanayileşmelerine yardımcı olmak için mühendisler göndermeli ve sanayi büyümelerine yardımcı olmak amacıyla gelecek vaat eden [CHI.GetAdjective] şirketlerini finanse etmeliyiz."
 GER_industrialists_intrigue_prevailed_tt:0 "§Y$PREVAILED_CHARACTER$§!'e endüstriyel çabayı yönetmesi için güvenildi ve Karşılıklı Dışlayıcı odakta çalışabilecek tek kişidir.\n\n"
 GER_industrialize_volkskommissariats:0 "Volkskommissariatları Sanayileştir"
 GER_industrialize_volkskommissariats_desc:0 "Ekipman eksikliği nedeniyle emeğin verimsiz uygulanması, Volkskommissariatların sanayilerinin [ROOT.GetAdjective] muadillerinin gerisinde kalmasına neden oluyor. Bu dengesizliği düzeltmek için sanayileşme planlarına yatırım yapmalıyız."
 GER_industrialize_volkskommissariats_tt:0 "§YVolkskommissariatlar§!'da §YSanayileşme Çabaları§! uygulamak için Kararlar açar!"
 GER_influence_the_baltics:0 "Baltıkları Etkile"
 GER_influence_the_baltics_desc:0 "Baltık devletleri, biz ve [SOV.GetNameDef] arasında tehlikeli bir şekilde konumlanmıştır. Biraz diplomatik çaba ve karşılıklı yarar sağlayan tekliflerle, onları çatışmaya gerek kalmadan bize daha yakın bir şekilde hizalayabilmeliyiz."
 GER_influence_the_benelux:0 "Benelüks'ü Etkile"
 GER_influence_the_benelux_desc:0 "Benelüks sahası, devam eden savaş çabamız için olduğu kadar, sanayi yetenekleri ve coğrafi konumları için de önem taşımaktadır. Muhtemelen onları kolayca ezebilecek olsak da, neden bunun yerine onları kendi tarafımıza çekmeyelim?"
 GER_influence_the_middle_east:0 "Orta Doğu'yu Etkile"
 GER_influence_the_middle_east_desc:0 "Tarihsel olarak Orta Doğu ile çok az ortak noktamız olsa da, bölgenin bizim için ilgi çekici olduğunu kimse inkar edemez. Gerekirse bölgede bir miktar diplomatik ağırlığımız olmasını sağlamak için bölgedeki nüfuzumuzu yaymalıyız."
 GER_inner_circle_cd_days_tt:0 "Bir sonraki §Y$GER_inner_circle_member_title$§!'in atanmasına kalan günler: [?GER_inner_circle_cd_flag:days_left|Y0]"
 GER_inner_circle_cd_flag:0 " Başka bir §Y$GER_inner_circle_member_title$§! atadı!"
 GER_inner_circle_event_pending_flag:0 " Bekleyen bir §Yİç Çember§! Etkinliği var.\n"
 GER_inner_circle_focus_in_progress_tt:0 "§Y$CHARACTER$§! bu odakta çalışıyor. \nİlerleme: §Y$FLAG_DAYS$§!/[?temp_focus_days] gün"
 GER_inner_circle_hide_button_tt:0 "[!hide_button] BLABLA"
 GER_inner_circle_industrial_me_focuses_tt:0 "(Bu odağı tamamlamak, ilgili $GER_inner_circle_member_title$ları için §Y$FOCUS_1$§! ve §Y$FOCUS_2$§!'u §Rkilitleyecektir§!)"
 GER_inner_circle_member_title:0 "Reichsleiter"
 GER_inner_circle_title_text:0 "YAKIN ÇEVRE"
 GER_innovative_warfare:0 "Yenilikçi Savaş"
 GER_innovative_warfare_desc:0 "Savaş yürütme yöntemlerimiz sürekli olarak gelişmelidir, aksi takdirde durgunlaşma riskiyle karşı karşıya kalırız. Ancak sürekli evrim ve değişimle düşmanlarımızın taktiklerimize ve teknolojimize akıl erdirmesini engelleyebiliriz."
 GER_instigate_middle_eastern_revolutions:0 "Orta Doğu Devrimlerini Kışkırt"
 GER_instigate_middle_eastern_revolutions_desc:0 "Orta Doğu uzun zamandır yabancı güçler tarafından ezilmiştir ve sosyalist bir devrim için olgundur. Halkın nihayet sömürüden kurtulma ve sosyalizmin kızıl bayrağını yükseltme konusundaki gizli arzusunu körüklemeliyiz."
 GER_instill_auftragstaktik:0 "Auftragstaktik Aşıla"
 GER_instill_auftragstaktik_desc:0 "Askeriyemiz uzun zamandır, merkezi olmayan komutayı ve bireysel inisiyatifi vurgulayan auftragstaktik veya görev komutasını uygulamaktadır. Bu, esneklik ve özerkliğe yol açmış, öngörülemeyen durumlarda uyum sağlama ve başarılı olma yeteneğimizi artırmıştır. Kuvvetlerimizin her zaman galip gelmesi için bu uygulamaya devam etmemiz çok önemlidir!"
 GER_instill_german_discipline:0 "Alman Disiplinini Aşıla"
 GER_instill_german_discipline_desc:0 "Volkskommissariatların ordularına baktığımızda, [ROOT.GetAdjective] disiplin ve verimlilik standartlarından yoksun oldukları acı bir şekilde açıktır. Rakiplerimize karşı daha iyi savunma yapabilmeleri için onları bu konularda eğitmeliyiz."
 GER_institute_price_controls:0 "Fiyat Kontrolleri Kur"
 GER_institute_price_controls_desc:0 "Kendi kendine yeterli olma konusundaki iddialı hedeflerimiz altında ezilmemesi için maliye üzerindeki kontrolümüzü güçlendirmek için çeşitli önlemler almalıyız. Enflasyonu kontrol altına almak ve ekonomik istikrarı sağlamak için ithalat, temel mallar ve işçi ücretlerinin fiyatlarını düzenleyebilmeliyiz."
 GER_integrate_czechoslovakia:0 "Çekoslovakya'yı Entegre Et"
 GER_integrate_czechoslovakia_desc:0 "[CZE.GetNameDef]'in nasıl yönetildiği hakkında daha fazla bilgi edindikçe, halkın bir değişiklik arzuladığı giderek daha açık hale geliyor. [GER.GetNameDef]'e entegrasyon, bu çok ihtiyaç duyulan değişikliği sağlayacaktır. Bir ültimatomla bir heyet göndermeliyiz."
 GER_integrate_subjects_economies:0 "Bağlı Devletlerin Ekonomilerini Entegre Et"
 GER_integrate_subjects_economies_desc:0 "Volkskommissariat ekonomileri, vekaletimiz altında büyük ilerleme kaydetti. Verimliliği daha da en üst düzeye çıkarmak için, sanayilerimizi tek bir ekonomik blokta birleştireceğiz."
 GER_integrate_volkskommissariats:0 "Volkskommissariatları Entegre Et"
 GER_integrate_volkskommissariats_desc:0 "Volkskommissariatlar, Avrupa'nın kurtarılmış halklarını sosyalizme doğru yönlendirmek için tasarlanmıştı. Ancak, ekonomilerimiz ve kültürlerimiz iç içe geçtikçe, [ROOT.GetAdjective] olmanın ne anlama geldiğinin genişletilmesini savunan yeni bir kimlik duygusu ortaya çıktı. Bundan böyle, biz tek bir halk, tek bir ülkeyiz."
 GER_integrate_volkskommissariats_tt:0 "§YVolkskommissariatları Entegre Etmek§! için Kararlar açar. §Y[ROOT.GetNameWithFlag]§! ilk §YVolkskommissariat§!'ı entegre ettiğinde, ülke §Y$GER_german_socialist_union_communism$§! olarak bilinecektir!"
 GER_integrate_western_german_speakers:0 "Batılı Alman Konuşanları Entegre Et"
 GER_integrate_western_german_speakers_desc:0 "Septemberprogramm, büyük Lüksemburg sahasının Alman devletiyle entegre olmasını öngörüyordu. Hem o bölge hem de İsviçre, bir zamanlar tek haklı halefi olduğumuz Kutsal Roma İmparatorluğu'nun bir parçasıydı. Bu Cermen sahaları, mümkün olan en kısa sürede krallığımıza yeniden dahil edilmelidir."
 GER_integrated_economies:0 "Entegre Ekonomiler"
 GER_integrated_economies_desc:0 "Müttefiklerimizin ekonomilerinin bizimkiyle entegrasyonu ve diğer devletlerin ekonomik durumunu izleyip yardımcı olabilecek bir Alman merkez bankasının kurulması, uzun vadede sadece bizi güçlendirmekle kalmayıp, aynı zamanda bize olan bağımlılıklarını artırarak ve sonunda dış işlerinin kontrolünü ele almamıza izin vererek bizim için çok faydalı olacaktır."
 GER_integrated_economies_tt:0 "Her §Yİttifak Üyesi§!, §YOlayı§! alacaktır: [GER.GetNameDefCap] Ekonomimizin Daha Fazla Entegrasyonunu İstiyor"
 GER_integration_of_puppet_economies:0 "Kukla Ekonomilerin Entegrasyonu"
 GER_integration_of_puppet_economies_decisions_tt:0 "Bu kararlar, kuklalarımızın ekonomilerini geliştirmemize veya sömürmemize olanak tanır."
 GER_integration_of_puppet_economies_desc:0 "Bağlı devletlerimizin nasıl durumda olduğuna baktığımızda, ekonomilerini ne kadar kötü yönettikleri açıkça görülüyor. Elbette bu esas olarak onları etkilese de, uzantı olarak bizim ekonomimizi de aşağı çekiyorlar. Führer, eldeki sorun hakkında bir şeyler yapılmasını talep ediyor!"
 GER_intervene_in_spain:0 "İspanya'ya Müdahale Et"
 GER_intervene_in_spain_desc:0 "Faşizm güçlerine karşı İspanya'daki yoldaşlarımıza elimizden gelen her şekilde yardım etmek bizim görevimizdir. Savaşta sertleşmiş birlikler göndermek kesinlikle takdir edilecektir."
 GER_intrigue_replacing_advisor_already_ascended_tt:0 "§Y$CHARACTER$§!, §Yİç Çember§! içinde galip gelir ve §Y$FOCUS$§! odağını tamamlayabilecektir. \n\n§Y$CHARACTER_2$§! ve §Y$CHARACTER_3$§! artık kendi karşılıklı dışlayıcı odaklarını tamamlamaya çalışmayacaktır."
 GER_intrigue_replacing_advisor_new_ascending_tt:0 "§Y$CHARACTER$§!, §Yİç Çember§! içinde şu şekilde yükselir: \n$IDEA$ \n§Y$CHARACTER$§!, §Y$FOCUS$§! odağını tamamlayabilecektir. \n\n§Y$CHARACTER_2$§! ve §Y$CHARACTER_3$§! artık kendi karşılıklı dışlayıcı odaklarını tamamlamaya çalışmayacaktır."
 GER_invade_italy:0 "Alarik Operasyonu"
 GER_invade_italy_desc:0 "İlk bakışta [ITA.GetNameDef] bize iyi bir potansiyel müttefik gibi görünse de, onların gerçek yüzünü biliyoruz. Büyük Savaş'ın başında bizimle birlikte savaşmayı reddettiler ve 1915'te daha önceki ittifakımıza rağmen bize karşı bile döndüler. O zaman dersimizi aldık, onlara güvenme hatası bir daha yapılmayacak."
 GER_invest_in_vereinigte_stahlwerke:0 "Vereinigte Stahlwerke'ye Yatırım Yap"
 GER_invest_in_vereinigte_stahlwerke_desc:0 "Vereinigte Stahlwerke, en büyük ve en önemli çelik üreticilerimizden biridir. Şirkete kaynak yatırımı yapmak kesinlikle artan verimlilik sağlayacak ve Alman çelik endüstrisini dönüştürecektir."
 GER_invite_scientists_back:0 "İmparatorluk Bilim Girişimi"
 GER_invite_scientists_back_desc:0 "Naziler iktidara geldiğinde birçok parlak zihin ülkeden kaçtı ve haklı bir nedenden dolayı. Ancak şimdi şanlı İmparatorluğumuz restore edildiğine göre, birçoğu bir kez daha bize geri dönmeye istekli olabilir."
 GER_japanese_naval_cooperation:0 "Japon Donanma İşbirliği"
 GER_japanese_naval_cooperation_desc:0 "[JAP.GetAdjective]'lerden, özellikle de denizcilik konularında öğrenecek çok şeyimiz var. Ortak bir teknoloji çabası kurarak, birbirimizin bilgisinden en iyi şekilde yararlandığımızdan ve ortak bir güç olarak zaten sahip olduğumuz şeyi yeniden icat etmek için harcanan zamanı azalttığımızdan emin olabiliriz."
 GER_kdf_wagen_factories:0 "[GetKfdWagenNames]"
 GER_kdf_wagen_factories_autarky_text:0 "$GER_kdf_wagen_desc$"
 GER_kdf_wagen_factories_desc:0 "[GetKDFFactoriesText]"
 GER_kdf_wagen_factories_economic_growth_text:0 "Yeni [GetAutobahnName]larımız inşa edildiğine göre, onları arabalarla doldurmalıyız. Gerçekten müreffeh ve modern bir ekonomi olmak için bu arabaları üretebilecek fabrikalar inşa etmeliyiz - bu arada iş ve istihdam yaratmalıyız."
 GER_kdf_wagen_factories_fascist:0 "KdF-Wagen Fabrikaları"
 GER_kdf_wagen_factories_neutral:0 "Wilhelm-Wagen Fabrikaları"
 GER_kdf_wagen_factories_volkswagen:0 "Volkswagen Fabrikaları"
 GER_kriegslokomotiven:0 "Kriegslokomotiven"
 GER_kriegslokomotiven_desc:0 "Savaşın lojistik zorlukları, kriegslokomotiven veya savaş lokomotiflerinin üretimini gerektirir. Bu trenler, ekonomik koşullarımıza ve hızlı, ucuz seri üretim ihtiyacına göre uyarlanacaktır."
 GER_labor_rights_and_union_stuff:0 "Sendikaları Kur"
 GER_labor_rights_and_union_stuff_desc:0 "İşçilerin endişelerini dile getirmek ve çalışma koşullarını belirlemek için sendikalaşmalarına izin vermek ülkemizde uzun zamandır ihmal edilmiştir. Devletin sadece izin vermekle kalmayıp, işçi sendikalarının oluşumunu teşvik etmesinin zamanı geldi!"
 GER_launch_sino_germanic_joint_research_program:0 "Bir Çin-Alman Ortak Araştırma Programı Başlat"
 GER_launch_sino_germanic_joint_research_program_desc:0 "[CHI.GetAdjective]ler, bilmenin değerli olacağı bilgilere sahiptir ve biz de onlar için faydalı olacak çok şey biliyoruz. Bu nedenle, her iki ulusumuzun da ilerlemesine işbirliği içinde yardımcı olabilecek ortak bir araştırma ve geliştirme ekibi kurmaya çalışmalıyız."
 GER_legacy_of_the_spartacus_league:0 "Spartaküs Birliği'nin Mirası"
 GER_legacy_of_the_spartacus_league_desc:0 "Spartaküs Birliği, 1919'da Kommunistische Partei Deutschlands kurulduğunda varlığı sona erdi, ancak bazı fikirleri geri getirmeye değer. Birlik, temelini demokratik seçimlere ve halkın iradesine dayandıran, ancak gerekirse devrimci gruplara izin veren bir sosyalist cumhuriyet yaratma vizyonuna sahipti. Bir kez daha bu hedefe doğru çalışma zamanı geldi."
 GER_legion_condor:0 "Lejyon Condor"
 GER_legion_condor_desc:0 "İber yarımadasında iç savaş devam ederken, bizim için büyük bir fırsat doğuyor. Onlara elimizden geldiğince çok gönüllü göndererek sadece doğru tarafın kazanmasını sağlamakla kalmaz, aynı zamanda birliklerimize savaş alanı deneyimi sunar ve ideallerimizi paylaşan [SPR.GetAdjective] halkını bize daha da yakınlaştırırız."
 GER_lessons_of_the_great_war:0 "Büyük Savaş'ın Dersleri"
 GER_lessons_of_the_great_war_desc:0 "Büyük Savaş'taki başarısızlıklarımız, gelecekteki çatışmalarımız için çok önemli olan paha biçilmez bilgiler sunuyor. Geçmişi büyük bir ayrıntıyla inceledik ve şimdi tarihin öğrettiği dersleri uygulamalıyız."
 GER_liberate_austria:0 "Avusturya'yı Kurtar"
 GER_liberate_austria_desc:0 "Güneydeki komşularımız uzun zamandır halk için korkunç koşullar altında yaşıyor. Başka bir ülkeye ev deseler de, çok benzerliğimiz var ve hatta bir dili paylaşıyoruz. [AUS.GetAdjective] halkının en iyisi için, bize katılmaları için bir talep, hayır, bir teklif uzatmalıyız!"
 GER_liberate_italy:0 "İtalya'yı Kurtar"
 GER_liberate_italy_desc:0 "[ITA.GetAdjective]ler uzun zamandır [ITA.GetLeader]'in yönetimi altında acı çekiyor. Bir zamanlar kendi eski hükümetimizin sözde müttefikiydiler ve şimdi daha iyiye doğru değiştiğimize göre, onları da yanımıza getirmek bizim görevimiz olmalı!"
 GER_liberate_oppressed_people:0 "Ezilen Halkları Kurtar"
 GER_liberate_oppressed_people_cossacks_tt:0 "Güney-Rus §YKazak Cumhuriyetlerinin§! yeniden kurulmasını sağlar!"
 GER_liberate_oppressed_people_desc:0 "[SOV.GetNameDef]'de bize sıcak bakan ve her şeyden çok kurtuluş isteyen birçok insan var. Belki de onları zalimlerinden kurtarmalı ve doğudaki yeni müttefiklerimiz olmalarını sağlamalıyız."
 GER_liberate_oppressed_people_tt:0 "§Y[SOV.GetNameDef]§!'in kurucu devletlerini kurtarmak §G%40§! daha ucuz ve kukla yapmak §G%20§! daha ucuz hale gelir."
 GER_locks_women_in_workforce_decision_tt:0 "§Y$women_in_the_workforce$§! Kararı §Ykullanılamaz§! hale gelir!"
 GER_lower_taxes:0 "Vergileri Düşür"
 GER_lower_taxes_desc:0 "Halkımız üzerindeki vergi yükü, yeniden silahlanma programını ödemek için giderek ağırlaştı. Bu yükü azaltarak kısa vadede devlet gelirinden kaybedebiliriz, ancak insanlar zor kazanılan paralarını ileride daha fazla harcayabilecekler."
 GER_loyalty_to_the_fuhrer:0 "Führer'e Sadakat"
 GER_loyalty_to_the_fuhrer_desc:0 "Cumhurbaşkanı ve Şansölye rollerinin birleştirildiği 1934 referandumuna göre, Hitler'in nüfusumuz arasında ne kadar büyük bir desteğe sahip olduğunun farkındayız. Siyasi manzarada bir değişiklik olduğuna dair hiçbir belirti görmedik ve bu nedenle Führer'i desteklemeye devam edeceğiz."
 GER_mackensen_went_into_retirement:0 "§YAugust von Mackensen§! Emekli Oldu"
 GER_marinestosstrupp:0 "Marine Stosstrupp'u Kur"
 GER_marinestosstrupp_desc:0 "Eğer gücümüzü denizaşırı ülkelere genişletmek istiyorsak, cesur deniz istilaları yapabilen ve düşmanın kıyı savunmasını delebilen, sözde deniz şok birlikleri olan bir deniz piyade birimi kurmalıyız."
 GER_mass_production:0 "Seri Üretim"
 GER_mass_production_desc:0 "Son zamanlarda yaptığımız tüm sanayi ilerlemesiyle, üretim araçları hakkında çok şey öğrendik. Bu yeni bulunan bilgiyi ve anlayışı, montaj hatlarımızı modernize etmek ve daha önce hiç görülmemiş bir ölçekte malzeme üretmek için kullanmalıyız."
 GER_mega_reichskommissariats:0 "Mega Reichskommisariat"
 GER_mega_reichskommissariats_desc:0 "Reichskommisariatların çok faydalı bir girişim olduğu kanıtlandığına göre, liderimiz [ROOT.GetLeader]'in daha fazla iyileştirme düşünmek için çok zaman harcaması şaşırtıcı değil. Reichskommisariatlarla ilgili sorunlardan biri, artan sayıları ve bununla birlikte, onları yönetmek için gereken artan idare miktarıdır. Elbette bazıları birleştirilebilir..."
 GER_memel_ultimatum:0 "Memel Ültimatomu"
 GER_memel_ultimatum_desc:0 "Eğer Büyük Savaş'tan bir şey öğrendiysek, o da dışarıdaki doğu mülklerimize bir saldırıya hazırlanmamız gerektiğidir. Bu mülkler restore edilmeli ve istilaya karşı tahkim edilmelidir. Ancak bu, stratejik olarak önemli Memelland'ın kontrolü olmadan yapılamaz, ki bunu geri almamız gerekecektir."
 GER_middle_eastern_trade_tt:0 "Kararı açar: §Y$GER_middle_eastern_trade_cat$§!"
 GER_military_dictatorship:0 "Askeri Diktatörlük"
 GER_military_dictatorship_desc:0 "Büyük Savaş bize, Kaiser'in tek başına ulusumuzu mümkün olan en iyi yöne yönlendirmek için yeterli olmadığını kanıtladı. O zamanlar yapıldığı gibi, yeni Yüksek Ordu Komutanlığı bir kez daha diktatörlük yetkilerini üstlenmeli ve İmparatorluktaki tek siyasi otorite haline gelmelidir."
 GER_military_dictatorship_tt:0 "§YAlman İmparatorluğu§!, §YAlman Kaiserreich'ı§! olarak bilinecektir.\n"
 GER_ministry_of_public_enlightenment:0 "Kamuoyu Aydınlatma Bakanlığı"
 GER_ministry_of_public_enlightenment_desc:0 "Propaganda Bakanlığı son zamanlarda bize büyük hizmet etti. Propaganda Bakanlığı'nı Kamuoyu Aydınlatma Bakanlığı olarak yeniden markalaştırarak, görevlerini genişletebilmeli ve endişeleri artırmadan finansmanı artırabilmeliyiz."
 GER_mittelafrika:0 "Mittelafrika"
 GER_mittelafrika_desc:0 "Afrika'da eskiden sahip olduğumuzdan daha fazla ilgi çekici toprak var. Muazzam doğal zenginliği ile Mittelafrika adını verdiğimiz bölge, [ROOT.GetNameDef]'e büyük fayda sağlayacaktır."
 GER_mittelafrika_revive_the_schutztruppe_tt:0 "§YAfrika§!'da §YSchutztruppe§! sömürge milislerini ve onları §YAskere Alma§! ve §YGeliştirme§! kararlarını açar!"
 GER_mitteleuropa:0 "Mitteleuropa"
 GER_mitteleuropa_alliance:0 "Mitteleuropa"
 GER_mitteleuropa_cooperation_sphere:0 "Mitteleuropa İşbirliği Alanı"
 GER_mitteleuropa_cooperation_sphere_desc:0 "Orta Avrupa birçok parlak zihne sahiptir. Buna rağmen, farklı hükümetlerinin bilgilerini kendilerine saklama arzuları nedeniyle işbirliği yapamıyorlar. Müttefiklerimizle daha yakın bilimsel işbirliğini teşvik etmeliyiz."
 GER_mitteleuropa_desc:0 "Alman halkının ana ilgi alanı Orta Avrupa'dadır, başlangıçta Prusyalılar tarafından pan-Cermenist devlet merkezli bir imparatorluk olarak tasarlanmıştır. Bu fikirlerin biraz cilalanması gerekebilir, ancak Avrupa'da yeni düzeni inşa edebileceğimiz iyi bir temeldir."
 GER_mitteleuropa_tt:0 "§YAvusturya'daki Kamuoyunu Kendi Tarafımıza Çekmek için§! bir karar açar, bu da onları hem bir ittifakı hem de boyunduruk altına girmeyi kabul etmeye daha istekli hale getirir."
 GER_modify_bewegungskrieg_or_blitzkrieg_tt:0 "§Y$GER_blitzkrieg_modifier$§! veya §Y$GER_bewegungskrieg_modifier$§! etkenini şu şekilde değiştir:"
 GER_molotov_ribbentrop_pact:0 "$GER_mol_rib_pact$"
 GER_molotov_ribbentrop_pact_desc:0 "$GER_mol_rib_pact_desc$"
 GER_monarchist_sentiment:0 "Monarşist Duygu"
 GER_monarchist_sentiment_desc:0 "Halk bir monarşi istiyor ve alacakları da bu. Hükümetin belirli şekli henüz kararlaştırılmamış olsa da, Alman halkının Kayserilerini geri istediği yine de açıktır."
 GER_nationalize_ford_factories:0 "Ford Fabrikalarını Millileştir"
 GER_nationalize_ford_factories_desc:0 "[51.GetName]'deki Ford fabrikalarının kontrolünü ele geçirmek ve onları devlet kontrolüne almak, sanayi kapasitemizi güçlendirecek ve silahlı kuvvetlerimizi ve lojistiğimizi desteklemek için hayati teçhizat ve araçların düzenli bir şekilde tedarik edilmesini sağlayacaktır."
 GER_nationalize_industries:0 "Sanayileri Millileştir"
 GER_nationalize_industries_desc:0 "Ekonomimizin devlet merkezileşmesinin olumlu sonucunu gördükten sonra, sanayimiz için de aynı şeyi düşünebiliriz. Şu anki haliyle, sanayi birçok özel sahip altında bölünmüş durumda, mallarını üretmek için farklı süreçler ve yöntemler kullanıyorlar. Sanayileri millileştirmek, üretim çıktısı ve verimliliği üzerinde bize çok daha fazla kontrol sağlayacaktır."
 GER_naval_bases_along_atlantic_coast_tt:0 "§YAvrupa Atlantik kıyısı§! boyunca §Y[ROOT.GetName]§! veya bir Alman bağlı devleti tarafından kontrol edilen ve §Y$naval_base$§! bulunan her eyalet: §G1§! §Y$naval_base$§! ekle. §G1§! §Y$coastal_bunker$§! ekle. Mevcut etki:"
 GER_naval_bases_on_atlantic_islands_tt:0 "§Y[ROOT.GetName]§! veya Alman bağlı devleti tarafından kontrol edilen §YKuzey Atlantik Okyanusu§!'ndaki bir §Y$naval_base$§!'e sahip her ada: §G1§! §Y$naval_base$§! ekle. §G1§! §Y$coastal_bunker$§! ekle. Mevcut etki:"
 GER_negotiate_old_colonies_in_the_east:0 "Doğu'daki Eski Sömürgeleri Müzakere Et"
 GER_negotiate_old_colonies_in_the_east_desc:0 "Doğu Asya'daki sömürge mülklerimizin birçoğu Büyük Savaş sırasında [JAP.GetAdjective] tarafından bizden alındı. Şimdi aktif olarak diplomatik ilişkilerimizin iyileştirilmesiyle meşgul olduğumuza göre, bu sömürgelerden bazılarını diplomatik yollarla geri alabiliriz."
 GER_negotiate_old_colonies_in_the_east_tt:0 "Kontrol ettikleri aşağıdaki eyaletlerden herhangi biri bize devredilecektir:\n§Y[684.GetName]\n[647.GetName]\n[646.GetName]\n[633.GetName]\n[743.GetName]\n[979.GetName]\n[737.GetName]\n[726.GetName]\n[725.GetName]\n[1070.GetName]§!"
 GER_offer_military_production_support:0 "Askeri Üretim Desteği Teklif Et"
 GER_offer_military_production_support_desc:0 "Doğu tampon devletleri, bizim sahip olduğumuz güçlü sanayi güç tabanından yoksundur. Onlara silah ve mühimmat üretiminde destek sunmalıyız, böylece [SOV.GetNameDef] tarafından saldırıya uğrarlarsa umarım bir süre kendi başlarının çaresine bakabilirler."
 GER_offer_military_production_support_tt:0 "Koruma altındaki tüm Doğu Avrupa devletleri, §Y730§! gün boyunca §YAskeri Üretimlerine§! aşağıdaki desteği alacak:"
 GER_offer_trade_proposal:0 "Ticaret Teklifi Sun"
 GER_offer_trade_proposal_desc:0 "Bol doğal kaynaklara sahip birçok devlet var ve bunlarla ticaret yapmak oldukça karlı olacaktır. Endonezya ve Kongo toprakları kauçuk ve nadir metaller bakımından zengindir, bu nedenle [BEL.GetNameDEF] ve [HOL.GetNameDef] ile ticaret anlaşmaları kurmak, sanayilerimizi beslemek için sömürgelerinin zengin kaynaklarını elde etmemizi sağlayacaktır."
 GER_operation_felix:0 "Felix Operasyonu"
 GER_operation_felix_desc:0 "İspanya İç Savaşı nihayet sona erdiğine göre, [118.GetName]'i [ENG.GetAdjective]'den koparma zamanımız geldi. Ancak denizden saldıramayacağımız için, önce [SPR.GetAdjective]'nin topraklarından geçmemize izin vermeleri için sadakatlerini sağlamalıyız. İdeolojilerimizi göz önünde bulundurarak, onları teslim olmaya ikna etmek zor olmamalıdır."
 GER_operation_green:0 "Yeşil Operasyon"
 GER_operation_green_desc:0 "Deniz Aslanı operasyonunu desteklemek için, batı kanadındaki operasyonel komutanlığımız İrlanda'da tam ölçekli operasyonlar planlamalı ve Britanya Adaları'nın tamamen kontrolümüz altına düşmesini sağlamak için adanın işgaline hazırlanmalıdır. Bunun için yüksek komutanlığımız, detaylı bir operasyon planı olarak Fall Grün'ü hazırladı."
 GER_operation_isabella:0 "Isabella Operasyonu"
 GER_operation_isabella_desc:0 "İber Yarımadası'nın tam kontrolü ile aramızda sadece [POR.GetNameDef] durduğuna göre, bir sonraki hamlemiz onları bize teslim olmaya zorlamak olmalıdır. Yerel yönetimi korumak ancak bize olan sadakatlerini sağlamak, onlardan toprak, altyapı ve askeri yapılar açısından ihtiyacımız olan her şeyi bize sağlamalıdır."
 GER_operation_sea_lion:0 "Deniz Aslanı Operasyonu"
 GER_operation_sea_lion_desc:0 "[ENG.GetNameDef]'in coğrafi konumu, mevcut savaş çabamızda karmaşık bir faktör olduğunu kanıtladı. Hem havadan hem de denizden topyekun bir saldırı operasyonu başlatmak, nihayet [ENG.GetAdjective]'i kırmanın en iyi yolu gibi görünüyor!"
 GER_operation_weserubung:0 "$GER_weserubung$"
 GER_operation_weserubung_desc:0 "$GER_weserubung_desc$"
 GER_oppose_hitler_ww:0 "Wehrmacht'ı Topla"
 GER_oppose_hitler_ww_desc:0 "Hitler'in hükümdarlığı sona ermeli. Ren bölgesini yeniden askerileştirerek Batılı güçleri kışkırtmayı amaçlıyor, ancak bunu yapmak bize Wehrmacht'taki sadık unsurların yardımıyla iktidarı ele geçirmek ve Almanya halkını ona karşı toplamak için ihtiyacımız olan bahaneyi verecektir."
 GER_optimize_reich_labour_service:0 "Reich Hizmetini Optimize Et"
 GER_optimize_reich_labour_service_desc:0 "Reich Çalışma Servisi, nüfusumuzu istihdamda tutmada büyük bir amaca hizmet ediyor, ancak daha fazlası için kullanılabileceğini düşünüyoruz. RAD'ı kullanımımızı, emek, propaganda ve savaş hazırlığı gibi her açıdan en iyi şekilde yararlanmak için optimize edebiliriz."
 GER_our_place_in_the_sun_ww:0 "Güneşteki Yerimiz"
 GER_our_place_in_the_sun_ww_desc:0 "Herkes bilsin ki, [ROOT.GetNameDef] bir kez daha güneşteki yerini alma hakkını iddia ediyor! Halkımız artık gölgelerde, güneşin hiç batmadığı İmparatorluğun başparmağı altında aşağılanmayacak!"
 GER_panzer_troops_school:0 "Panzer Birlikleri Okulu"
 GER_panzer_troops_school_desc:0 "Panzer tümenleri, herhangi bir modern çatışmada çok önemli bir rol oynayacaktır ve zırhlı kuvvetlerimizin askeri yeniliğin ön saflarında olduğundan emin olmalıyız. Titiz eğitim ve uzman eğitmenler aracılığıyla, zafer için gerekli olan seçkin panzer birimlerini yetiştireceğiz."
 GER_panzergrenadier:0 "Panzergrenadier"
 GER_panzergrenadier_desc:0 "Askeri doktrinimiz hareketliliğe dayanır ve motorize birliklerimizin ne kadar iyi performans gösterdiğine bağlı olacaktır. Ne piyade ne de panzer tümenleri, uygun destek olmadan ilerlemelerinde başarılı olamayacaktır. Mekanize piyadeyi öncü kuvvetlerimizle entegre ederek, kuvvetlerimizin saldırı operasyonlarında üstünlüğünü sürdürmesini sağlarız."
 GER_panzerschiff_raiders:0 "Panzerschiff Akıncıları"
 GER_panzerschiff_raiders_desc:0 "Ticaret engelleme stratejimizde daha ağır gemilerimizi kullanmalıyız. Bu gemiler sert vurabilir ve düşmanın ana savaş filosu limandan ayrılma şansı bulamadan geri çekilebilir."
 GER_party_chancellor_bormann:0 "Parti Şansölyesi Bormann"
 GER_party_chancellor_bormann_desc:0 "Martin Bormann, Vekil Führer'in özel sekreteri olarak görevinde en yetkin olduğunu kanıtladı. Ayrıca daha önce NSDAP için bir yardımcı fon olan Hilfskasse der NSDAP'yi yönetmiş olmaktan dolayı oldukça geniş bir finans bilgisine sahip olarak, mükemmel bir Parti Şansölyesi olurdu."
 GER_party_chancellor_hess:0 "Parti Şansölyesi Hess"
 GER_party_chancellor_hess_desc:0 "Rudolf Hess, uzun zamandır partinin aktif bir üyesidir. Siyasi elitin birkaç yükselmiş üyesinin, aralarında Führer'in kendisinin de bulunduğu güvenine sahiptir. Parti Şansölyesi olarak görevlendirilmesi sadece doğrudur."
 GER_petition_for_the_return_of_old_colonies:0 "Eski Sömürgelerin İadesi İçin Dilekçe"
 GER_petition_for_the_return_of_old_colonies_desc:0 "Yeni bulduğumuz İngiliz dostlarımız, Büyük Savaş'ın sonunda ele geçirdikleri sömürgelerimizin iadesini tartışmaya açık olabilirler. Bir tür tazminat talep edebilirler, ancak bu, eski iddialarımızın restorasyonu anlamına gelebilecekse yapmaya istekli olacağımız bir şeydir."
 GER_plan_z_lock_other_focus_tt:0 "§Y$GER_trade_interdiction$§! odağı, §Y$GER_high_seas_fleet$§! odağı tamamlanana kadar kilitlenecektir."
 GER_plenipotentiary_of_armaments:0 "Silahlanma Tam Yetkili Temsilcisi"
 GER_plenipotentiary_of_armaments_desc:0 "Wehrmacht'a ihtiyaç duydukları şeyi tedarik etme konusundaki genel sorumluluğu birinin üstlenmesi gerektiği giderek daha açık hale geliyor. Albert Speer, Wehrmacht'a tedarik etme çabalarında en umut verici sonuçları gösterdi. Silahlanma ve Savaş Üretimi Reich Tam Yetkili Temsilcisi statüsü verildiğinde, bu adam mucizevi derecede iyi sonuçlar elde edebilir!"
 GER_plenipotentiary_of_the_four_year_plan:0 "Dört Yıllık Planın Tam Yetkili Temsilcisi"
 GER_plenipotentiary_of_the_four_year_plan_desc:0 "Dört Yıllık Planın yürütülmesini denetleme ve etkinleştirme işinin başlangıçta düşünülenden daha kapsamlı bir görev olduğu açıkça ortaya çıktı. Hermann Göring'i bir Reich Tam Yetkili Temsilcisi yaparak tek bir adama çok fazla güç veriyoruz, ancak büyük sonuçlarına saygıyla, Führer emin. Hermann Göring, bu konuda ona tam diplomatik haklar tanımamamız için çok faydalıdır."
 GER_poland:0 "[POL.GetAdjective] Proletaryasını Koru"
 GER_poland_desc:0 "[POL.GetNameDef]'deki proletarya, henüz [ROOT.GetAdjective] işçilerimizle aynı haklara sahip değil. Mevcut liderlikleri altında gelişemedikleri için, onları kurtarmak ve korumak için devreye girme zamanımız gelmiş olabilir."
 GER_political_commissars:0 "Siyasi Komiserler"
 GER_political_commissars_desc:0 "Saflar içinde, uymak zorunda kaldıkları aptallık yerine davamıza hala ikna edilebilecek olanlar var. Sorumluluğu, sıradan askeri komünizmin faydaları konusunda eğitmek ve sadakati sağlamak için onları organize etmek olan subaylar atamalıyız."
 GER_pool_technical_know_how_ww:0 "$GER_pool_technical_know_how$"
 GER_pool_technical_know_how_ww_desc:0 "$GER_pool_technical_know_how_desc$"
 GER_prepare_for_the_next_blockade_ww:0 "Bir Sonraki Ablukaya Hazırlan"
 GER_prepare_for_the_next_blockade_ww_desc:0 "Diğer ülkeler hazırlıklarımızın boyutunu fark ettikçe, bazılarının itiraz etmesi kaçınılmazdır. Daha önce ablukalara maruz kaldık ve onlarla nasıl başa çıkacağımızı biliyoruz. Gerekli hazırlıklarla, ablukaları bizim üzerimizde çok az veya hiç etki yaratmayacaktır."
 GER_prepare_for_the_next_naval_blockade:0 "Bir Sonraki Deniz Ablukasına Hazırlan"
 GER_prepare_for_the_next_naval_blockade_desc:0 "Bizden daha büyük bir filoya sahip düşmanlara karşı son savaştığımızda ne olduğunu biliyoruz. Şimdi sahip olduğumuz bilgi sayesinde, savaş daha gelmeden dikkatli hazırlıklar yaparak bir zamanlar karşılaştığımız birçok sorunu aşmaya çalışabiliriz."
 GER_prepare_italian_coup_ww:0 "Hazırla [ITA.GetAdjective] Darbesi"
 GER_prepare_italian_coup_ww_desc:0 "İtalya'nın faşizme düşüşü geri alınmalıdır. [ITA.GetAdjective] kralcılarına desteğimizle bir darbe teklifiyle yaklaşacağız."
 GER_prioritize_economic_growth:0 "Ekonomik Büyümeye Öncelik Ver"
 GER_prioritize_economic_growth_desc:0 "Yıllarca ihmalkar maliye politikaları ekonomimizi neredeyse mahvetti. Tanklar yerine traktörler inşa etmeli, tüfekler yerine kürekler dağıtmalı ve silah sanayisini büyütmek yerine ekonomik büyümeye öncelik vermeliyiz!"
 GER_prioritize_the_army:0 "Orduya Öncelik Ver"
 GER_prioritize_the_army_desc:0 "Almanya ve ondan önce Prusya, her zaman bir kara gücü olmuş ve egemenliğimizi ve güvenliğimizi korumak için orduya güvenmiştir. Ordumuzun iyi teçhizatlandırılmış ve herhangi bir düşmanı boyunduruk altına alabilecek yetenekte olmasını sağlamak için sanayi çabalarımızı yeniden yönlendirmeliyiz."
 GER_prioritize_the_four_year_plan:0 "Dört Yıllık Plana Öncelik Ver"
 GER_prioritize_the_four_year_plan_desc:0 "Başından beri [ROOT.GetLeader]'in Dört Yıllık Planının ulusu savaşa hazırlamak için gerekli bir adım olacağını biliyorduk. Führer'in kendisi çok meşgul bir adam olduğu için, gerekli önlemleri denetlemek ve koordine etmek için birine ihtiyaç duyulacaktır."
 GER_prioritize_the_navy:0 "Donanmaya Öncelik Ver"
 GER_prioritize_the_navy_desc:0 "Mevcut sınırlarımızın ötesine erişimimizi genişletmek istiyorsak, denizlerin kontrolü hayati olacaktır. Donanmaya, boyut ve güç olarak herhangi bir düşman filosuyla rekabet edebilmesi için öncelik vermeliyiz."
 GER_proletarian_dictatorship:0 "Proleter Diktatörlüğü"
 GER_proletarian_dictatorship_desc:0 "Halkımıza en iyi olanakları ve yaşam standartlarını sağlamak için, halkla ve onların ihtiyaçlarıyla iyi uyum içinde olan istikrarlı bir liderlik sağlamalıyız. Proletarya için uzun süredir savaşan [ROOT.GetLeader], tüm nitelikleri karşılıyor ve işçiler için en iyisinden başka bir şey düşünmediğini kanıtladı."
 GER_proletarian_international_alliance:0 "Proleter Enternasyonali"
 GER_proletarian_solidarity:0 "Proleter Dayanışması"
 GER_proletarian_solidarity_decision_tt:0 "[GER.GetName]'nin Komünist olmasına yardım ettiği ülkelerle kaynak ticaretini artırmak için §YProleter Dayanışmasını Teşvik Et§! Kararını aç"
 GER_proletarian_solidarity_desc:0 "Avrupa'yı Komünizme giden yola sokma çabalarımızın arkasına önemli ölçüde zaman ve kaynak koyduk. Emeğimizin meyvelerini şimdi toplamamız adil değil mi?"
 GER_propaganda:0 "Ülke Çapında Propaganda"
 GER_propaganda_desc:0 "Daha önce propagandanın gücünü gözlemledik ve etkinliğini inkar edemeyiz. Şanlı liderlerimize desteği artırmak için kaynak ayırarak, nüfusumuzu tam istediğimiz yerde tuttuğumuzdan emin oluruz."
 GER_propaganda_master:0 "Propaganda Ustası"
 GER_propaganda_master_desc:0 "Joseph Goebbels'i Propaganda Bakanımız olarak atarken hiç şüphemiz yoktu. Zaten başarılı bir konuşmacı ve yazardı. Şimdi istihbarat teşkilatımızı nasıl geliştireceğimize dair fikirler seslendirdiğine göre, bu fikirlere göre hareket etmenin en iyi çıkarımıza olduğuna tam inancımız var."
 GER_protect_the_revolution:0 "Devrimi Koru"
 GER_protect_the_revolution_desc:0 "Bazıları yurtdışındaki müdahalelerimizi nüfuz kazanma hilesi olarak görse de, görevimizin sınırlarımızın ötesinde bile proletaryayı korumak olduğunu biliyoruz. Bunu yapmak için, uluslararası kabul görmüş normal sınırların dışında hareket etme yeteneğine sahip olmalıyız."
 GER_protect_the_revolution_tt:0 "[ROOT.GetNameDef] tarafından bir İç Savaşın tetiklendiği §Ykomşu ülkelerin§! §YBoyunduruk Altına Alınmasını Talep Etmek§! için karar açar"
 GER_prussian_artillery:0 "Prusya Topçu Doktrini"
 GER_prussian_artillery_desc:0 "Eskiden, üstün doktrinlerimizi kullanarak savaştan savaşa kazanmayı başardık. Kalite ve ateş gücü, onu bu kadar başarılı bir taktik yapan şeyin büyük bir parçasıdır ve bu, bir kez daha taklit etmeye çalışmamız gereken bir şeydir!"
 GER_puppet_finland:0 "[FIN.GetAdjective] Sadakatini Sağla"
 GER_puppet_finland_desc:0 "[GetFinlandpuppetDescription]"
 GER_puppet_turkey:0 "$GER_turkey_puppet$"
 GER_puppet_turkey_desc:0 "$GER_turkey_puppet_desc$"
 GER_rally_the_industrialists:0 "Sanayicileri Topla"
 GER_rally_the_industrialists_desc:0 "Sanayiciler ülkemizde önemli bir güce sahiptir. Onları yanımıza çekmek bir zaman yatırımı olacaktır, ancak Rudolf Hess'in bize değeceğine dair güvence verdiği bir yatırım."
 GER_rally_the_industrialists_hess_stays_tt:0 "§Y$GER_rudolf_hess$§!'in meşhur uçuşunu yapmasını engeller."
 GER_rally_the_industrialists_hess_tt:0 "§Y$germany.107.t$§! olay zincirinin gerçekleşmesini önleyecektir."
 GER_rally_the_nation:0 "Ulusu Topla"
 GER_rally_the_nation_desc:0 "Ulusumuz içinde, fırsat doğduğunda Nazilere karşı durmaya istekli birçok kişi var. Halkı toplamalı ve hatta belki de Weimar Cumhuriyeti günlerinden beri Nazilere karşı savaşma deneyimi olan paramiliter örgütlerle temas kurmalıyız."
 GER_rally_the_nation_tt:0 "İç savaşın sonunda ya §YDeğiştirilmesi§! ya da §RKaldırılması§! gereken bir ulusal ruh seçebileceğiz."
 GER_rapid_army_expansion:0 "Hızlı Ordu Genişlemesi"
 GER_rapid_army_expansion_desc:0 "Ordumuz, çok ihtiyaç duyulan değişikliklerimizden sonra eskisi gibi aynı oranda büyümüyor. Giderek daha düşmanca bir dünyada halkımızı korumak için hala büyük bir orduya ihtiyacımız var. Önemli bir seferberlik ve eğitim hamlesi bu sorunu çözmelidir."
 GER_re_establish_free_elections_ww:0 "$GER_reestablish_free_elections$"
 GER_re_establish_free_elections_ww_desc:0 "$GER_reestablish_free_elections_desc$"
 GER_re_establish_german_control_over_qingdao:0 "Qingdao Üzerinde Alman Kontrolünü Yeniden Kur"
 GER_re_establish_german_control_over_qingdao_desc:0 "1898'de Qingdao'nun bir kira sözleşmesini müzakere ettik. Bu kira sözleşmesi, Büyük Savaş'ın başlamasından kısa bir süre sonra 1914'te [JAP.GetAdjective] işgaliyle kesildi. Bölge artık işgal altında olmadığına göre, belki de onlara anlaşmayı hatırlatma zamanı gelmiştir."
 GER_re_establish_the_landwehr:0 "Landeswehr'i Yeniden Kur"
 GER_re_establish_the_landwehr_desc:0 "Landwehr, 1813'ten beri yararlı bir kendini savunma aracı olmuştur ve Weimar Cumhuriyeti için çok faydalı olmuştur. Ayrıca ulusumuzun adamlarını faydalı kılmaya ve kendi Landwehr ve Landesschützen taburlarımızı kurmaya çalışmalıyız."
 GER_re_establish_the_seekriegsleitung:0 "Seekriegsleitung'u Yeniden Kur"
 GER_re_establish_the_seekriegsleitung_desc:0 "Denizcilik Deniz Komutanlığı olan Seekriegsleitung'u yeniden kurmak, deniz emirlerinin planlanmasını ve uygulanmasını ve doğrudan konuşlandırmayı etkinleştirecektir."
 GER_re_form_the_freikorps:0 "Freikorps'u Yeniden Kur"
 GER_re_form_the_freikorps_desc:0 "Freikorps, ideolojik rakiplerimize karşı mücadelemizde bize uzun süre yardım etti, Weimar dönemi boyunca Bavyera Sovyet Cumhuriyeti'ni ve diğer devrim girişimlerini bastırmamıza yardımcı oldu. Ne komünistlerin ne de Nazilerin ulusumuzda yeniden bir yer edinmemesi için böyle bir paramiliter gücü yeniden kurmaya çalışmalıyız."
 GER_re_form_the_freikorps_generals_tt:0 "§YFranz Ritter von Epp§! ve §YHermann Erhardt§! general olarak mevcut olur"
 GER_re_ratify_the_locarno_treaty:0 "Locarno Antlaşmasını Yeniden Onayla"
 GER_re_ratify_the_locarno_treaty_desc:0 "Locarno Antlaşmaları 1925'te imzalandı ve Antant'ın bizimle ilişkileri normalleştirmeye çalışırken Avrupa'da toprak bütünlüğünü güvence altına almasını sağladı. Bize karşı baskıcı olarak görülse de, Hitler'in ona karşı çıkma hatasını geri almanın en iyisi olduğu açıktır."
 GER_re_ratify_the_locarno_treaty_tt:0 "§Y[FRA.GetNameDefCap]§!, aldığımız herhangi bir diplomatik eylemi kabul etme olasılığı daha yüksek olacaktır"
 GER_reach_out_to_scandinavia:0 "İskandinavya'ya Ulaş"
 GER_reach_out_to_scandinavia_desc:0 "Dağlar ve soğuk, [GER.GetGreatRedMenaceName] Tehdidine karşı bir koruma değildir ve İskandinavlar bunu bilmelidir. Onlara [SOV.GetAdjective]lerin tehdidine karşı üyelik ve koruma sunacağız."
 GER_realize_mittelafrika:0 "Mittelafrika'yı Gerçekleştir"
 GER_realize_mittelafrika_desc:0 "Sömürge imparatorluğumuz çok uzaklara ve geniş alanlara ulaşacak ve orta Afrika'nın zenginlikleri her zaman cezbedici olmuştur. Afrika'nın kalbinden yararlanabilmemiz için Alman Mittelafrika hayallerimizi en kısa zamanda gerçekleştirmeliyiz."
 GER_realize_mittelafrika_tt:0 "Tüm §YKongolu§!, §YKenyalı§!, §YAngolalı§! ve §YMozambikli§! eyaletler üzerinde hak iddia eder."
 GER_realpolitik:0 "Realpolitik"
 GER_realpolitik_desc:0 "Avrupa'nın geri kalanına dışarıdan bakma ve rüzgarların ne yöne estiğini görme zamanı geldi. Eğer ittifak veya fetih fırsatları ortaya çıkarsa, onları derhal ele geçirdiğimizden emin olmalıyız."
 GER_reassert_eastern_claims:0 "$GER_demand_memel$"
 GER_reassert_eastern_claims_desc:0 "$GER_demand_memel_desc$"
 GER_rebuild_the_high_seas_fleet_ww:0 "$GER_rebuild_the_high_seas_fleet$"
 GER_rebuild_the_high_seas_fleet_ww_desc:0 "$GER_rebuild_the_high_seas_fleet_desc$"
 GER_rebuild_the_nation_ww:0 "Ulusu Yeniden İnşa Et"
 GER_rebuild_the_nation_ww_desc:0 "Nazi belasından kurtulmaktan kurtulmak istiyorsak, tüm çabalarımızı hızlı bir yeniden yapılanmaya odaklamalıyız. Bu arada halk mütevazı yaşamak ve çok çalışmak zorunda kalacak, ancak daha iyi bir yarın vaadiyle kesinlikle bunu yapacaklardır."
 GER_rebuild_the_nation_ww_tt:0 "Kararı açar: §Y$GER_public_works_modifier$§!"
 GER_reclaim_former_african_colonies:0 "Eski Afrika Sömürgelerini Geri Al"
 GER_reclaim_former_african_colonies_desc:0 "Asya, eskiden sahip olduğumuz ve o zamandan beri kaybettiğimiz mülklerin olduğu tek yer değil. Afrika'daki topraklarımız hala bizim için ilgi çekici ve onları geri kazanmak ve bir kez daha entegre etmek için elimizden gelenin en iyisini yapmalıyız."
 GER_red_europe:0 "Kızıl bir Avrupa"
 GER_red_europe_desc:0 "İşçileri silahlanmaya ve kızıl bayrağı yükseltmeye teşvik etme çabalarımızı yakın komşu ülkelerimizle sınırlayamayız. Proleter devrimini Avrupa'ya yaymalıyız!"
 GER_reinstate_imperial_possessions_ww:0 "$GER_reinstate_imperial_possessions$"
 GER_reinstate_imperial_possessions_ww_desc:0 "$GER_reinstate_imperial_possessions_desc$"
 GER_reject_the_locarno_treaty:0 "Locarno Antlaşmasını Reddet"
 GER_reject_the_locarno_treaty_desc:0 "Locarno Antlaşması, haksız yere bizden koparılan toprakları geri almamızı engellemek için açıkça kurulmuştu. Bu antlaşmayı tamamen reddetmeli ve eski eyaletlerimizi geri almak için hazırlanmalıyız."
 GER_rekindle_imperial_sentiment_ww:0 "$GER_rekindle_imperial_sentiment$"
 GER_rekindle_imperial_sentiment_ww_desc:0 "$GER_rekindle_imperial_sentiment_desc$"
 GER_remilitarize_the_rhineland:0 "Ren Bölgesini Yeniden Askerileştir"
 GER_remilitarize_the_rhineland_desc:0 "$GER_rhineland_desc$"
 GER_reorganize_nationale_volksarmee:0 "Nationale Volksarmee'yi Yeniden Düzenle"
 GER_reorganize_nationale_volksarmee_desc:0 "Yolsuzluk ve faşist duygular ordumuzun derinliklerinde hala devam ediyor. Muhalefeti ve isyanı önlemek için bize zarar vermek isteyenleri ayıklamalıyız. Bu, saflarda büyük bir boşluk bırakacak, bu yüzden halkımızın güvenliğini sağlamak için, bu tür eylemler gerekirse cesur askerlerimizi savaşa götürecek yeni, sadık generaller atamalıyız."
 GER_reorganize_secret_services:0 "Gizli Servisleri Yeniden Düzenle"
 GER_reorganize_secret_services_desc:0 "Eğer söylentilere inanılacak olursa, $GER_wilhelm_canaris$ verimsiz, hatta mevcut hükümete karşı tamamen sadakatsiz olduğunu kanıtladı. Onu görevden almalı ve Abwehr'i daha yetkin bir kuruma yeniden düzenlemeliyiz."
 GER_reorganize_the_luftwaffe:0 "Luftwaffe'yi Yeniden Düzenle"
 GER_reorganize_the_luftwaffe_desc:0 "Hava Kuvvetlerimiz sadece birkaç yıl önce kurulmuş olmasına rağmen, zorlu bir ulusal güç aracı haline geldi. Ancak, hızlı oluşumu ve hızlı genişlemesi, organizasyonda birkaç yapısal hata bıraktı. Daha fazla sorumluluk devretmek ve rekabetçiliği ve iç güç mücadelesini caydırmak, Hava Kuvvetlerimizi daha büyük operasyonel verimlilik ve etkinlik elde etme konusunda güçlendirecektir."
 GER_reorganize_the_wehrmacht:0 "Wehrmacht'ı Yeniden Düzenle"
 GER_reorganize_the_wehrmacht_desc:0 "Führer'in iddialı planlarını takip edebilmemiz için Wehrmacht içinde kapsamlı bir yeniden yapılanma gerçekleşmelidir. Mevcut liderlerin birçoğu, Führer'in emirlerini yerine getirmek yerine zamanlarını küçük ve temelsiz endişeleri dile getirerek geçiriyor. Ancak bu bireyleri kaldırarak hedeflerimize ulaşabiliriz!"
 GER_request_the_return_of_french_held_colonies:0 "Fransızların Elindeki Sömürgelerin İadesini Talep Et"
 GER_request_the_return_of_french_held_colonies_desc:0 "Büyük Savaş'ın sonunda sömürge mülklerimizden mahrum bırakıldık. Alman Sömürge Derneği'nin Adenauer altında yeniden popülerlik kazanmasıyla, eski sömürgelerimiz olan Kamerun ve Togoland'ı geri isteme zamanı gelmiş olabilir. Fransa ile ilişkimiz ne kadar iyi olursa, toprağı geri almamıza izin verme olasılıkları o kadar yüksek olur."
 GER_request_the_return_of_qingdao:0 "Qingdao'nun İadesini Talep Et"
 GER_request_the_return_of_qingdao_desc:0 "Tsingtao, aşağılanma yüzyılları sırasında Çin'den kazanılan birçok antlaşma limanından biriydi. Şehri ve Büyük Savaş'ın sonunu kaybetmiş olsak da, yıllar önce bize devredilen bir şehir, doğru tazminatları hazırlamamız koşuluyla, şimdi [CHI.GetNameDef]'den geri isteme fırsatı bulabiliriz."
 GER_resource_trade:0 "Kaynak Ticareti"
 GER_resource_trade_desc:0 "Kendimizi olabildiğince desteklemeye çalışsak da, ideallerimizi paylaşan ülkelerle ticaret yapmamıza izin vermeliyiz. [SOV.GetNameDef]'e sanayi kapasitesi şeklinde bir miktar tazminat sunarak, onlarla çok faydalı bir anlaşma sağlayabilmeliyiz."
 GER_ressurect_the_red_front_fighters_league:0 "Kızıl Cephe Savaşçıları Birliği'ni Dirilt"
 GER_ressurect_the_red_front_fighters_league_desc:0 "Kızıl Cephe Savaşçıları Birliği, Weimar Cumhuriyeti sırasında hareketle bağlantılı bir paramiliter örgüttü. Faşist rejim altında hem polise hem de diğer zalimlere karşı cesurca savaştılar. Eski rejimimizin genellikle kullandığı aynı şekilde, Kızıl Cephe Savaşçıları bunun için yasaklandı. Onları geri getirme zamanı geldi!"
 GER_ressurect_the_red_front_fighters_league_tt:0 "Şu anda §Y$GER_proletariat_uprising_modifier$§! tarafından etkilenen veya §Y[ROOT.GetAdjective] Komünistleri§! tarafından kontrol edilen §Yüç rastgele eyalette§! §Y2 Milis Birimi§! ortaya çıkacaktır."
 GER_restore_eastern_imperial_possessions:0 "Doğu İmparatorluk Mülklerini Geri Yükle"
 GER_restore_eastern_imperial_possessions_desc:0 "İmparatorluğumuzun ayrılmaz parçası olan topraklar şu anda yabancı güçler tarafından bizden alıkonuluyor. Brest-Litovsk sınırlarını gerçekleştirmek için önce Poznan, Batı Prusya ve Silezya'ya bakmalıyız."
 GER_restore_the_brest_litovsk_borders:0 "Brest-Litovsk Sınırlarını Geri Yükle"
 GER_restore_the_brest_litovsk_borders_desc:0 "Brest-Litovsk antlaşmasında kurulan sınırlar, Rusların Büyük Savaş'ı kaybetmesine ve toprakları bize devretmesine rağmen, Versay antlaşması tarafından uzun süredir yasadışı olarak iptal edilmiştir. Gelecekte savaşa yol açabilecek olsa bile, kaybettiğimiz doğu mülklerimizi geri kazanmak için çabalamalıyız."
 GER_restore_the_holy_roman_empire:0 "Kutsal Roma İmparatorluğu'nu Geri Yükle"
 GER_restore_the_holy_roman_empire_desc:0 "Birçoğu böyle bir günün geleceğinden şüphe duyuyordu, ama işte buradayız. İmparatorluğun eski sınırları geri kazanıldığına göre, bir kez daha Kutsal Roma İmparatorluğu'nun bir imparatorunu taçlandırabiliriz, ancak bu sefer birleşik bir ulus şeklinde. İmparatorluğa şan olsun!"
 GER_return_of_the_kaiser_ww:0 "Kaiser'in Dönüşü"
 GER_return_of_the_kaiser_ww_desc:0 "Kaiserreich'ın bir Kaiser'e ihtiyacı var ve II. Wilhelm hala Hollanda'da sürgünde yaşıyor. Batı Demokrasilerinin ne düşündüğüne bakılmaksızın, sürgününü kaldıracak ve onu tahta geçmesi için geri davet edeceğiz."
 GER_reverse_the_brain_drain_ww:0 "$GER_reverse_the_brain_drain$"
 GER_reverse_the_brain_drain_ww_desc:0 "$GER_reverse_the_brain_drain_desc$"
 GER_revitalize_the_nation:0 "Ulusu Canlandır"
 GER_revitalize_the_nation_desc:0 "İç savaşın yıkımlarından sonra, ulusumuzu yeniden inşa etmeye bakmalıyız. Halktan, tüm kaynaklarımızı bu hedefe ulaşmaya odaklayabilmemiz için bir süreliğine kişisel rahatlıklarını bir kenara bırakmalarını isteyeceğiz."
 GER_revive_the_kaiserreich_ww:0 "$GER_revive_the_kaiserreich$"
 GER_revive_the_kaiserreich_ww_desc:0 "$GER_revive_the_kaiserreich_desc$"
 GER_revive_the_schutztruppe:0 "Schutztruppe'yi Canlandır"
 GER_revive_the_schutztruppe_desc:0 "Schutztruppen, sömürge imparatorluğumuzun Afrika topraklarında kullandığımız sömürge birlikleriydi. Büyük Savaş'ın Doğu Afrika Seferi sırasında ve daha önceki küçük ölçekli çatışmalarda bize iyi hizmet ettiler. Gözlerimiz bir kez daha Afrika ve Asya'ya baktığına göre, sömürge ofislerini yeniden kurma ve yeni ve geliştirilmiş bir Schutztruppe birliğini düşünme zamanı gelmiş olabilir."
 GER_revive_the_schutztruppe_tt:0 "§YSchutztruppe§! sömürge milislerini ve onları §YAskere Alma§! ve §YGeliştirme§! kararlarını açar"
 GER_rocketry_innovations:0 "Roketçilik Yenilikleri"
 GER_rocketry_innovations_desc:0 "Havacılık gelişimindeki bir sonraki büyük sıçrama elimizin altında! Mühendislerimiz, gökyüzünün efendisi olma arayışımızda büyük sonuçları ve faydası olabilecek roket itkisini mükemmelleştirmek için yorulmadan çalıştılar."
 GER_root_out_imperialism:0 "Emperyalizmin Kökünü Kazı"
 GER_root_out_imperialism_desc:0 "Emperyalizmin kökleri Afrika ve Asya topraklarında derinlere uzanır ve oradaki işçileri prangaya vurur. Bu insanlar sömürgecilik altında çok uzun süredir acı çekiyor. Sömürüyü sona erdirmeli ve ezilen kitlelere ayağa kalkma, kaderlerini ele geçirme ve düşmanlarımızı oyalama araçlarını vermeliyiz."
 GER_root_out_imperialism_tt:0 "§YAfrikalı§! ve §YAsyalı§! ülkelerde direnişi ve özerklik kazanımını artırmak için §YKararlar§! açar."
 GER_safeguard_poland:0 "Polonya'yı Koru"
 GER_safeguard_poland_desc:0 "Polonyalılar doğudan saldırıya karşı savunmasız. Onları ne pahasına olursa olsun korumalıyız, böylece biz ve [SOV.GetAdjective]ler arasında bir tampon devlet tutabiliriz."
 GER_safeguard_poland_tt:0 "Eğer §YPolonya§! §YOrtak Askeri Tatbikatlar Düzenle§!'yi tamamlarken ya ittifakımızdaysa ya da bizim tarafımızdan garanti altındaysa, ek olarak §G25§! §YOrdu Deneyimi§! ve §G15§! §YHava Deneyimi§! kazanacağız!"
 GER_safeguard_the_baltic_ww:0 "$GER_safeguard_the_baltic$"
 GER_safeguard_the_baltic_ww_desc:0 "$GER_safeguard_the_baltic_desc$"
 GER_salvage_captured_equipment:0 "Ele Geçirilen Teçhizatı Kurtar"
 GER_salvage_captured_equipment_custom_tt:0 "İki rastgele [ROOT.GetAdjective] generali §YGanimetçi§! özelliğini kazanacak."
 GER_salvage_captured_equipment_desc:0 "Ele geçirilen düşman teçhizatını kurtarmak ve askeriyemiz için yeniden kullanmak üzere tesisler kurarak, ele geçirilen silahları, araçları ve makineleri yenileyebilir ve silahlı kuvvetlerimizi güçlendirmek için entegre edebiliriz."
 GER_schlieffen_once_more_ww:0 "$GER_schlieffen_once_more$"
 GER_schlieffen_once_more_ww_desc:0 "$GER_schlieffen_once_more_desc$"
 GER_sea_lion_eq_trigger_tt:0 "Orduda §Y90.000§!'den fazla piyade teçhizatı"
 GER_second_vienna_award_eq_trigger_tt:0 "Orduda §Y60.000§!'den fazla piyade teçhizatı"
 GER_secure_finland:0 "Finlandiya'yı Güvence Altına Al"
 GER_secure_finland_desc:0 "[FIN.GetNameDefCap]'in [SOV.GetNameDef] ile uzun bir kara sınırı vardır. Bu sınıra erişim sağlamak, doğudaki Kızıl Tehdit'e karşı bize başka bir potansiyel cephe sağlar ve eğer bir gün [SOV.GetAdjective]lerle savaşmamız gerekirse çok değerli olabilir."
 GER_secure_portugal_desc:0 "Büyük Savaş sırasında, [POR.GetAdjective]ler rakiplerimizin propagandasıyla kandırıldı ve bize karşı döndü. Eski gemilerimizden bazıları hala limanlarında yatıyor ve onları geri verme konusunda tek bir kelime edilmedi. Şimdi yeterince dostane görünseler de, onlara güvenemeyiz ve bir savaş istemiyorlarsa, yönetimimize teslim olma zamanının geldiğini onlara açıkça belirtmeliyiz."
 GER_secure_spain_desc:0 "[SPR.GetNameDef] en istikrarsız ülke olduğunu kanıtladı. Yönetimleriyle mücadele ederlerken, belki onlara bir yardım eli uzatmalıyız? Bu noktada, kesinlikle bizim kukla rejimimiz olmak, alıştıkları kaostan daha tercih edilir olmalı?"
 GER_see_to_the_eastern_front_ww:0 "Doğu Cephesine Bak"
 GER_see_to_the_eastern_front_ww_desc:0 "Önceki savaştaki eylemlerimiz hala birçok kişinin hafızasında taze. Kıtanın korkularını gerçek tehlikeye, yani Doğu'da beliren büyük [GER.GetGreatRedMenaceDesc]'e yeniden odaklamalıyız. Kıtanın gözlerini açmak için büyük bir propaganda kampanyası başlatacağız."
 GER_seeherrschaft:0 "Seeherrschaft"
 GER_seeherrschaft_desc:0 "Okyanusların tartışmasız efendileri olma ve Seeherrschaft veya deniz hakimiyeti vizyonumuzu gerçekleştirme yolunda ilerliyoruz. Şimdi [ROOT.GetNameDef] dalgalara hükmediyor!"
 GER_seeks_to_restore_brest_litovsk:0 "Brest-Litovsk'u restore etmeye çalışıyor"
 GER_seeks_to_restore_brest_litovsk_worse:0 "$GER_seeks_to_restore_brest_litovsk$"
 GER_seize_foreign_industries:0 "Yabancı Sanayilere El Koy"
 GER_seize_foreign_industries_desc:0 "Yabancı sanayileri ekonomimize entegre ederek, savaş çabamızı ve üretimimizi destekleyen hayati kaynakları güvence altına alırız."
 GER_send_military_aid:0 "Askeri Yardım Gönder"
 GER_send_military_aid_desc:0 "[CHI.GetNameDef]'deki dostlarımız düşmanlarla çevrilidir ve birçoğu devletlerinin varlığını tehdit etmeye çalışmaktadır. Sınırlarını güvence altına alabilmeleri ve gelecek yıllarda bize faydalı olabilmeleri için onlara mühimmat ve teçhizat göndermeliyiz."
 GER_send_military_support_democratic_shield_tt:0 "Savaş halindeki §YDemokratik§! ülkelere §YAskeri Teçhizat Göndermek§! için kararlar açar"
 GER_send_volunteers:0 "Uzak Doğu Lejyonu"
 GER_send_volunteers_desc:0 "Birçok [ROOT.GetAdjective], macera özlemi çekiyor ve iyi bir amaç için savaşmaya gitmek istiyor. Bu nedenle, savaşlarında [CHI.GetAdjective] dostlarımıza yardım etmek için gidecek bir 'gönüllü' lejyonu kurmalıyız."
 GER_sentinels_of_the_pacific:0 "Pasifik'in Nöbetçileri"
 GER_sentinels_of_the_pacific_desc:0 "Pasifik'teki dayanak noktalarımız genellikle az gelişmiştir ve ne kendi Kriegsmarine'imiz ne de müttefiklerimizin Kriegsmarine'i için herhangi bir işe yaramaz. Pasifik'teki ilgili sahalarda uygun deniz altyapısının kurulduğundan emin olmak için önemli bir çaba gösterilmelidir."
 GER_sentinels_of_the_pacific_tt:0 "Aşağıdakilerin her bir kontrol edilen eyaleti: §Y\n[336.GetName]\n[335.GetName]\n[743.GetName]\n[633.GetName]\n[646.GetName]§!"
 GER_shared_rd_programs_2_tt:0 "§Yİttifakımızdaki§! her §YUlus§!, §YOrta Avrupa Araştırma§! paylaşım grubuna da katılacaktır."
 GER_shared_rd_programs_ww:0 "$GER_shared_rd_programs$"
 GER_shared_rd_programs_ww_desc:0 "$GER_shared_rd_programs_desc$"
 GER_shared_rd_programs_ww_tt:0 "§Y$GER_rnd_programs_modifier$§!'den gelen araştırma hızı bonusu, her yeni ittifak üyesi için §G+1.00%§! artar, en fazla §G+10.00%§!'a kadar artar"
 GER_shatter_usas_hegemony:0 "[USA.GetAdjective] Hegemonyasını Parçala"
 GER_shatter_usas_hegemony_desc:0 "[USA.GetAdjective]lere uluslararası sahnede çok uzun süredir çok fazla güç verildi. Güçlendikçe, artık onların kenara çekilme zamanı geldi."
 GER_sign_the_second_treaty_of_berlin:0 "İkinci Berlin Antlaşmasını İmzala"
 GER_sign_the_second_treaty_of_berlin_desc:0 "Hatırı sayılır bir ordumuzun farkındayız, ancak [SOV.GetNameDef]'in çatışmak istemediğimiz bir ordusu olduğunun da aynı derecede farkındayız. Ulaşarak ve düşmanlıklardan kaçınmak için aynı sayfada olduğumuzdan emin olarak, ilgili ülkelerimizdeki tüm işçiler için daha iyi bir gelecek sağlayabiliriz."
 GER_signed_the_anglo_german_defence_pact_opm:0 "İngiliz-Alman Savunma Paktı İmzalandı"
 GER_social_ownership:0 "Sosyal Mülkiyet"
 GER_social_ownership_desc:0 "Önemli devlet hizmetlerinin, hedefi halk için en iyisiyle uyumlu olmayan insanlar tarafından yönetilmesine izin verildiğinde ne olduğunu gördük. Bunun bir daha asla olmasını önlemek için, sanayimizi kamu mülkiyetine devretmeliyiz."
 GER_solve_the_logistical_bottlenecks:0 "Lojistik Darboğazları Çöz"
 GER_solve_the_logistical_bottlenecks_desc:0 "Hava Kuvvetleri yeniden düzenlemesi tamamlandığında, dikkatimizi etkisiz lojistik sisteme ve ikmal zincirlerine çevirebiliriz. Bu sorunları modernize etmek, daha fazla insanı başka şeyler yapmak için serbest bırakacak ve uçaklarımızın daha hızlı onarılmasını kolaylaştıracaktır."
 GER_south_east_asian_natural_wealth:0 "Güney-Doğu Asya Doğal Zenginliği"
 GER_south_east_asian_natural_wealth_desc:0 "Güney-Doğu Asya bölgesi, bize büyük fayda sağlayacak doğal kaynaklar açısından zengindir. Mevcut sahipleri bu toprakları ideal bir şekilde geliştirmiyor ve topraklar hiçbir zaman bize ait olmasa da, bu tür bir duygu sözde demokrasilerin haklı olarak bizim olan sömürgeleri çalmasını durdurmadı ve bizi de durdurmayacak!"
 GER_south_east_asian_natural_wealth_tt:0 "Güney-Doğu Asya topraklarımızı iyileştirmek için §YHarita Üzeri Kararlar§! açar"
 GER_spark_the_flame_of_revolution:0 "Devrim Ateşini Yak"
 GER_spark_the_flame_of_revolution_desc:0 "Komşu ülkelerdeki işçilerin durumu, dilediğimiz kadar iyi değil. Uzun vadede bu ülkelerde silahlı bir devrim kaçınılmaz olacaktır, ama şimdilik, en azından bu ülkelerde komünizm sözünü yaymaya çalışmalıyız."
 GER_spark_the_flame_of_revolution_red_europe_tt:0 "§Yküçük Avrupa ülkelerinde§! §YKomünist Duyguları Güçlendirmek§! için kararlar açar. Etkilenen ülkede komünistler çoğunluk desteğini kazandığında, ülkeyi §YKomünist§! yapmak için bir §Yİç Savaş§! çıkacaktır."
 GER_spark_the_flame_of_revolution_tt:0 "§Yküçük komşu ülkelerde§! §YKomünist Duyguları Güçlendirmek§! için kararlar açar. Etkilenen ülkede komünistler çoğunluk desteğini kazandığında, ülkeyi §YKomünist§! yapmak için bir §Yİç Savaş§! çıkacaktır."
 GER_spawn_more_communist_militias_in_civil_war_tt:0 "Eğer başka bir §Yİç Savaş§! çıkarsa, §Y$GER_proletariat_uprising_modifier$§! tarafından etkilenen üç çekirdek eyalette §Y2 Alman§! birimi oluştur!"
 GER_spheres_of_influence:0 "Nüfuz Alanları"
 GER_spheres_of_influence_desc:0 "Bu kadar yakın mesafede iki benzer düşünen ülkeyle, biz ve [SOV.GetAdjective] için eşit bir oyun alanı oluşturmalıyız. Bir nüfuz alanı kurarak ve doğudaki yoldaşlarımız için bir tane belirleyerek, silahlı çatışma riskini sınırlarız."
 GER_spheres_of_influence_tt:0 "Biz ve §Y[SOV.GetNameWithFlag]§!, §YAvrupa§!'daki Nüfuz Alanlarımızı kuracağız.\n\n§YNüfuz Alanımız§! şunları içerecektir:\n§Y[SWE.GetNameWithFlag]\n[NOR.GetNameWithFlag]\n[DEN.GetNameWithFlag]\n[POL.GetNameWithFlag]§! (Batı)\n§Y[CZE.GetNameWithFlag]§! (Batı)\n§Y[HUN.GetNameWithFlag]§!\n\nOnların §YNüfuz Alanı şunları içerecektir§!:\n§Y[FIN.GetNameWithFlag]\n[EST.GetNameWithFlag]\n[LAT.GetNameWithFlag]\n[LIT.GetNameWithFlag]\n[SLO.GetNameWithFlag]\n[POL.GetNameWithFlag]§! (Doğu)\n§Y[ROM.GetNameWithFlag]\n[BUL.GetNameWithFlag]\n[YUG.GetNameWithFlag]§!"
 GER_start_the_proletarian_revolution:0 "Proleter Devrimini Başlat"
 GER_start_the_proletarian_revolution_civil_war_tt:0 "Bu, görev süresi dolarsa bir §Rİç Savaşa§! yol açacaktır!"
 GER_start_the_proletarian_revolution_desc:0 "İlk iç savaştan sonra işçilerin sesinin daha fazla duyulacağını ummuştuk. Ancak durum öyle görünmüyor, proletarya daha iyisini hak ediyor ve onların ayağa kalkmasına izin vererek, nihayet proletaryayı destekleyenlere gücü bir kez ve herkes için güvence altına alabiliriz."
 GER_state_controlled_economy:0 "Devlet Kontrollü Ekonomi"
 GER_state_controlled_economy_desc:0 "Ekonomimiz, onu en iyi nasıl yöneteceğini bilmeyen insanlara bırakılamayacak kadar kırılgandır. Halkımız üzerinde uzun vadeli etkilere neden olacak bir ekonomik krizden kaçınmak için, devlet ekonomimizin kontrolünü ele almalıdır."
 GER_states_with_proletarian_uprising_joins_cw_tt:0 "§Y$GER_proletariat_uprising_modifier$§! etkisine sahip Eyaletler, bir İç Savaş durumunda §YKomünist§! tarafına katılacaktır."
 GER_stop_progress_on_advisor_focus_tt:0 "§Y$CHARACTER$§!, §Y$FOCUS$§! odağında çalışmayı durduracak."
 GER_stormtroopers:0 "Hücum Kıtaları"
 GER_stormtroopers_desc:0 "Büyük Savaş'ın Stosstruppen'ları, düşman siperlerine saldırıları yönetmek ve ana piyadenin yararlanabileceği yarmalar yaratmak için tasarlanmış seçkin şok birlikleriydi. Bu fikri canlandırmalı ve savaş alanında hız, çeviklik ve acımasız verimliliği özetleyecek yeni seçkin şok birlikleri eğitmeliyiz."
 GER_strafbataillon:0 "Strafbataillon"
 GER_strafbataillon_desc:0 "Orduda endoktrinasyon için önlemler aldıktan sonra, şimdi bunu sadece askerlerimizi bize sadık kılmaktan daha fazla şekilde kullanabiliriz. Ceza taburları konuşlandırarak, bu bireylerde hem endoktrinasyonla hem de Anavatan'a hizmet ettirerek istenen milliyetçi duyguları besleyebiliriz!"
 GER_strafbataillon_spawn_tt:0 "§Y[ROOT.Capital.GetName]§!'de §Y3 Ceza Tümeni§! birimi oluşturulacaktır. \n§YCeza Tümenlerinin§! sınırlı alımını açar."
 GER_strengthen_kriegsmarine_communism:0 "Volksmarine"
 GER_strengthen_kriegsmarine_democratic:0 "Deutsche Marine"
 GER_strengthen_kriegsmarine_fascism:0 "Kriegsmarine"
 GER_strengthen_kriegsmarine_neutrality:0 "Kaiserliche Marine"
 GER_strengthen_the_kriegsmarine:0 "[GetStrengthenKriegsmarineName]'i Güçlendir"
 GER_strengthen_the_kriegsmarine_desc:0 "$GER_naval_rearmament_desc$"
 GER_strengthen_the_proletarian_international:0 "Proleter Enternasyonali'ni Güçlendir"
 GER_strengthen_the_proletarian_international_desc:0 "Komşu ülkelerimizdeki işçiler hakları için ayaklanırken, güvenilir bir ittifak olarak konumumuzu güçlendirmek için bolca fırsat görüyoruz. Bu yeni kurulan Komünist devletleri Proleter Enternasyonali'ne davet ederek, hepimiz daha güçlü olabiliriz."
 GER_strengthen_the_proletarian_international_internationally_tt:0 "§Y[GER.GetNameWithFlag]§!'nin §YKomünizm§!'e doğru etkilediği §YAvrupa dışındaki§! her ülke, §YProleter Enternasyonali§!'ne davet edilecektir. Bu etki, bu odak alındıktan §Ysonra§! Komünizme doğru etkilenen ülkeler için de geçerli olacaktır."
 GER_strengthen_the_proletarian_international_tt:0 "§Y[GER.GetNameWithFlag]§!'nin §YKomünizm§!'e doğru etkilediği §YAvrupa§!'daki her ülke, §YProleter Enternasyonali§!'ne davet edilecektir. Bu etki, bu odak alındıktan §Ysonra§! Komünizme doğru etkilenen ülkeler için de geçerli olacaktır."
 GER_strengthen_the_waffen_ss:0 "Waffen-SS'i Güçlendir"
 GER_strengthen_the_waffen_ss_desc:0 "SS'in muharebe kolu olan Waffen-SS, savaşta bizim için değerli bir varlık olduğunu kanıtladı. Teknik olarak bir paramiliter şube olmasına rağmen, daha fazla kaynak verildiğinde düzenli ordumuz kadar etkili bir şekilde faaliyet gösterebileceklerine kesinlikle inanıyoruz."
 GER_strengthen_the_welfare_state:0 "Refah Devletini Güçlendir"
 GER_strengthen_the_welfare_state_desc:0 "Ulusumuzun bir refah devleti olarak uzun bir geçmişi var ve bu şimdi değiştirmeyi planladığımız bir şey değil. İlkelerimize bağlı kalmalı ve halkımızın onlara sağlayabileceğimiz en iyi hayatları yaşamasını sağlamalıyız."
 GER_strike_at_the_rising_sun:0 "Yükselen Güneşe Saldır"
 GER_strike_at_the_rising_sun_desc:0 "[JAP.GetNameDefCap], eşitlik ve sosyalizm isteyen herkesi ezen bir emperyalizm kalesi olmaya devam ediyor. Japonların dize getirilip yeni proleter dünya düzenini kabul etme zamanı geldi."
 GER_strike_eastward:0 "Doğuya Saldır"
 GER_strike_eastward_desc:0 "Sınırlar güvence altına alındığına göre, en büyük rakibimizi, Brest-Litovsk antlaşmasını bozanı ve Doğu Avrupa'nın istikrarını tehdit edeni, yani [SOV.GetNameDef]'i devirme zamanı geldi. Moskova'yı ele geçirme ve [SOV.GetAdjective] devini gerçekten dize getirme zamanı geldi."
 GER_strike_eastward_eq_trigger_tt:0 "Orduda §Y100.000§!'den fazla piyade teçhizatı"
 GER_strive_for_conservative_values:0 "Muhafazakar Değerler İçin Çabala"
 GER_strive_for_conservative_values_desc:0 "Liberal fikirler ülkemizde çok uzun süredir kol geziyor, adamlarımızın zihinlerini zayıflatıyor ve politikacılarımızı yozlaştırıyor. Weimar Cumhuriyeti'nin kaosunun bir daha asla geri dönmemesi için eski güzel değerlerimize dönmeliyiz."
 GER_sturmtruppe_battalion_tt:0 "Destek taburu §Y$sturmtruppe_battalion$§!'u açar."
 GER_subduing_the_baltic_states:0 "Baltık Devletlerini Boyunduruk Altına Alma"
 GER_subduing_the_baltic_states_desc:0 "Baltık devletleri, Birleşik Baltık Dükalığımızın topraklarını talep ederek gayrimeşrudur. Onları boyunduruk altına almalı ve toprakları Baltık-Alman aristokrasisine teslim etmeliyiz."
 GER_subduing_the_baltic_states_tt:0 "Üç Baltische Landeswehr §Ypiyade§! birimi kazan.\nEğer §YPolonya§!, §YBermontiyalıları Geri Yüklemediyse§!, §YRüdiger von der Goltz§! 3. seviye bir Mareşal olarak bize katılacak."
 GER_subjugate_romanian_economy:0 "Romanya Ekonomisini Boyunduruk Altına Al"
 GER_subjugate_romanian_economy_desc:0 "[ROM.GetNameDefCap] bizim için önemli bir ticaret ortağı haline geldi. Ülke içinde çıkarılan büyük miktarda ham petrol, ülkenin ekonomisini canlandırdı ve şimdi fiyatlarını artırmaya başlıyorlar. Elbette, bizim gibi eski, geri dönen bir müşteri için en iyi fiyatları sağlamak için biraz baskı uygulayabilir miyiz?"
 GER_subsidize_hoesch_benzin:0 "Hoesch-Benzin'i Sübvanse Et"
 GER_subsidize_hoesch_benzin_desc:0 "Eskiden bir ordunun midesiyle yürüdüğü söylenirdi, ama modern bir ordu yakıtla çalışır. Askeri yeteneklerimizi sürdürmek için, sentetik yakıt üretme çabalarımızı yoğunlaştırmalıyız."
 GER_subversive_infiltrators:0 "Yıkıcı Sızmacılar"
 GER_subversive_infiltrators_desc:0 "Bir düşman hakkında istihbarat ve bilgi, başarılı bir istila için çok önemlidir. Birçok alana harcamaları artırdıkça, istihbarat toplamamızı geliştirmeye de yatırım yapmamız sadece mantıklıdır."
 GER_support_a_coup_in_liechtenstein:0 "Lihtenştayn'da Bir Darbeyi Destekle"
 GER_support_a_coup_in_liechtenstein_desc:0 "Lihtenştayn'daki benzer düşünen bireylerin mikro ülkedeki naibi devirmeyi planladığına dair haber aldık. Alfons Goop adında bir adam desteğimizi istemeye geldi ve bizim de bundan faydalanacağımızı garanti ediyor."
 GER_support_finland:0 "Finlandiya'yı Destekle"
 GER_support_finland_desc:0 "[FIN.GetAdjective]ler uzun zamandır [146.GetName] üzerinde [SOV.GetAdjective]lerle bir çatışma yaşıyor. Bölgede gerilimler şimdi yükselirken, onları desteklemek ve karşılığında onları bize daha yakın bir şekilde hizalamak en iyi çıkarımızadır."
 GER_support_the_finns_ww:0 "$GER_support_the_finns$"
 GER_support_the_finns_ww_desc:0 "Finler, [GER.GetRussiansDemonym]'in ateş hattında kendilerini buluyorlar. Onlara doğu tehdidine karşı bir garanti sunacak ve onlara mütevazı bir sanayi yardımı vereceğiz."
 GER_support_the_proletarian_uprising:0 "Proleter Ayaklanmasını Destekle"
 GER_support_the_proletarian_uprising_desc:0 "Yakın çevremizdeki iç savaşların sayısında keskin bir artış öngördüğümüz için, ayaklanan işçilere en iyi nasıl destek verileceğine dair tutumumuzu güncellemeliyiz. Bu işçiler böyle bir girişim için hazırlıksız olabilirler ve en azından iyi teçhizatlandırıldıklarından emin olarak, Avrupa'nın bizim tarafımızda bir kızıl dalganın basamaklanmasını sağlayabiliriz."
 GER_support_the_proletarian_uprising_tt:0 "§Y[ROOT.GetAdjective]§!'in §YKomünist§! duyguları güçlendirmesi sonucunda şu anda bir iç savaşla sarmalanmış ülkelere §Ypiyade teçhizatı§! göndermek için §YKararlar§! açar."
 GER_sway_the_balkans:0 "Balkanları İkna Et"
 GER_sway_the_balkans_desc:0 "Balkanlarda yabancı güçler tarafından tehdit edildiğini hisseden birçok ulus var. Birliğimizin daha da güçlenmesi için onlara Mitteleuropa'da bir yer teklif etmeliyiz."
 GER_sway_the_balkans_tt:0 "§Y[ROOT.GetRulingIdeology] İdeolojisini§! §YBalkan§! uluslarında Güçlendirmek ve onları §YMitteleuropa'ya Getirmek§! için kararlar açar!"
 GER_sway_the_middle_east_decisions_tt:0 "§Y[ROOT.GetRulingIdeology] İdeolojisini§! §YOrta Doğu§! uluslarında Güçlendirmek ve onları §YMitteleuropa'ya Getirmek§! için kararlar açar!"
 GER_tactical_bombers:0 "Taktik Bombardıman Uçakları"
 GER_tactical_bombers_desc:0 "$GER_strategic_air_effort_desc$ Sınırlarımız dışındaki her fabrikayı yerle bir etmek, sadece bizim etkili bir askeri güç kurabilmemizi garanti edecektir."
 GER_tech_sharing:0 "Sanayi Teknolojisi Paylaşımı"
 GER_tech_sharing_desc:0 "Biz ve diğer benzer düşünen ülkeler arasında teknoloji paylaşımı, çabalamamız gereken bir şey olmalıdır. Bu girişim için [SOV.GetAdjective]lere ulaşmak en mantıklı hareket tarzı gibi görünüyor."
 GER_tend_to_the_future_of_germany:0 "Almanya'nın Geleceğine Bak"
 GER_tend_to_the_future_of_germany_desc:0 "Şimdi Almanya Nazilerden başarıyla kurtarıldığına göre, yeni ufuklara doğru ileriye bakmalı ve ulusumuzun gelecekteki yörüngesine karar vermeliyiz. Birlik, adalet ve özgürlük için!"
 GER_tend_to_the_future_of_germany_tt:0 "§YAyrılıkçı İsyan§! girişimleri başarıyla engellenecektir"
 GER_the_austrian_question:0 "Avusturya Sorunu"
 GER_the_austrian_question_desc:0 "Küçük Alman çözümü bir hataydı, derhal düzeltmemiz gereken bir hata. Avusturyalıları ulusumuza katılmaya zorlamalıyız, hatta belki de Burgenland'ı [HUN.GetNameDef] ile bir ittifak karşılığında sunma fırsatını değerlendirmeliyiz."
 GER_the_austrian_question_more_likely_to_accept_tt:0 "Eğer şu anda bir ittifak lideriyseler, kabul etme olasılıkları §Rdaha düşüktür§!."
 GER_the_eastern_threat:0 "Doğu Tehdidi"
 GER_the_end_to_fascist_europe:0 "Faşist Avrupa'ya Son"
 GER_the_end_to_fascist_europe_desc:0 "Bu zamanda bile, Avrupa'da Faşist bir yönetime tabi olan ülkeler var. Bunun bir nüfus üzerinde yarattığı baskının farkında olduğumuz için, bu ülkelerin derhal kurtarılmasını sağlamalıyız."
 GER_the_final_blow_to_communism:0 "Komünizme Son Darbe"
 GER_the_final_blow_to_communism_desc:0 "[SOV.GetNameDef] ile başa çıkmak, Avrupa'daki komünizme karşı haçlı seferimizin sonu olamaz. Yakın çevremizde komünist uluslar var olduğu sürece mücadeleye devam etmeliyiz. Kızıl tehdit tamamen ortadan kalkana kadar dinlenemeyiz!"
 GER_the_first_berlin_award:0 "Birinci Berlin Ödülü"
 GER_the_first_berlin_award_aus_tt:0 "Eğer §Y[AUS.GetNameDef]§! ile bir ittifaktaysak:"
 GER_the_first_berlin_award_desc:0 "Polonyalılar sadece bizim topraklarımızda değil, aynı zamanda Avusturya-Macaristan topraklarında da çömeliyorlar. Alman ordularının gazabıyla karşılaşmamaları için, onları bu bölgeleri Mitteleuropa'ya geri vermeye ikna etmeye çalışmalıyız."
 GER_the_first_berlin_award_hun_tt:0 "Eğer §Y[HUN.GetNameDef]§! ile bir ittifaktaysak:"
 GER_the_four_year_plan:0 "Dört Yıllık Plan"
 GER_the_four_year_plan_desc:0 "$GER_four_year_plan_desc$"
 GER_the_german_stakhanovite_movement:0 "Alman Stahanovist Hareketi"
 GER_the_german_stakhanovite_movement_desc:0 "Stahanovist hareket, komünist yönetim altındaki [SOV.GetName]'de, işçilerin gerçekten beklenenden daha sıkı çalışmaktan ve daha fazla üretmekten gurur duymaya başlamasıyla ortaya çıktı. Bu hareket üretimi fırlattı ve işçilere daha güçlü bir amaç duygusu sağladı. Burada, [ROOT.GetNameDef]'de benzer duyguları teşvik etmeyi düşünmeliyiz."
 GER_the_german_stakhanovite_movement_tt:0 "§Y$GER_establish_the_reichswerke$§! veya §Y$GER_invest_in_vereinigte_stahlwerke$§!'den birini tamamlayarak, bu odak kazanılan kaynak miktarını §G%5§! kadar değiştirecektir."
 GER_the_mannheim_project_ww:0 "Mannheim Projesi"
 GER_the_mannheim_project_ww_desc:0 "Atomun sırlarını çözme çabalarımızı iki katına çıkarmalı ve onu [SOV.GetAdjective]lere karşı silahlandırmayı düşünmeliyiz. Bu, yeni bulunan müttefiklerimiz sayesinde daha kolay olacaktır, çünkü onlar konuyla ilgili sahip oldukları her türlü bilgiyi paylaşmaya istekli olabilirler."
 GER_the_monarchy_compromise_ww:0 "$GER_the_monarchy_compromise$"
 GER_the_monarchy_compromise_ww_desc:0 "$GER_the_monarchy_compromise_desc$"
 GER_the_northern_shield:0 "Kuzey Kalkanı"
 GER_the_northern_shield_desc:0 "İskandinav ülkeleri kaynak bakımından zengindir, ancak işçilerini sendikalaştırma çabalarına rağmen proletarya hala kapitalist çıkarlar altında acı çekmektedir. Sadece işçilerin daha iyisini hak ettiğine değil, aynı zamanda bu kaynakları çok daha iyi kullanabileceğimize de inanıyoruz. İskandinav işçilerinin sömürülmesi sona ermelidir!"
 GER_the_peoples_victory:0 "Halkın Zaferi"
 GER_the_peoples_victory_desc:0 "Halk konuştu ve halk duyuldu. Eski ve yozlaşmış hükümetimiz zayıflık belirtileri gösterdi ve fırsatı yakalayıp istifalarını talep etmeli ve halk adına iktidarı kendimiz almalıyız!"
 GER_the_proletarian_legion:0 "Proleter Lejyonu"
 GER_the_proletarian_legion_desc:0 "Başlattığımız ayaklanmaların sorumluluğunu almalıyız. Şimdi iç savaşla harap olan bu ülkelerdeki proletaryanın, yozlaşmış rejimlerine en kısa zamanda son vermeleri için yardımımıza ihtiyacı var. Onların yardımına asker göndermeyi düşünmeliyiz!"
 GER_the_proletarian_legion_tt:0 "§Y[ROOT.GetNameWithFlag]§!'nin §YKomünizm§!'i körüklediği §YHerhangi Bir Ülke§! bir §Yİç Savaşa§! girdiğinde:"
 GER_the_proletarian_revolution_flag:0 "Proleter Devrimi devam ediyor."
 GER_the_proud_eagle_and_the_resurgent_dragon:0 "Gururlu Kartal ve Yeniden Canlanan Ejderha"
 GER_the_proud_eagle_and_the_resurgent_dragon_desc:0 "[CHI.GetNameDef]'deki dostlarımıza yönelik bir [JAP.GetAdjective] istilası tehdidi sürekli olarak üzerimizde beliriyor. Pasif bir şekilde saldırmalarını beklemenin bir faydası olmayacaktır. [JAP.GetNameDef]'in savaşçılarına karşı, bizim topraklarımızda veya onlarınkinde savaşa hazırlanmalıyız."
 GER_the_prussian_legacy:0 "Prusya Mirası"
 GER_the_prussian_legacy_desc:0 "'Bazı devletlerin bir ordusu varken, Prusya Ordusu'nun bir devleti vardır' demişti Voltaire. Savaş alanında hızlı ve ezici zaferler sağlamak için eski Alman doktrini olan Bewegungskrieg'i - manevra savaşı - geliştirerek bunu somutlaştıracağız."
 GER_the_second_berlin_award:0 "İkinci Berlin Ödülü"
 GER_the_second_berlin_award_desc:0 "Romenler ve Slavlar da haklı olarak Avusturya-Macaristan toprağını işgal ediyor. Bunları derhal iade etmelerini talep etmeliyiz!"
 GER_the_second_naval_race:0 "İkinci Deniz Yarışı"
 GER_the_second_naval_race_desc:0 "İngilizler ve Fransızlar tarafından çok uzun süredir aşağılandık! Filolarımızı restore etme ve artık onlara boyun eğme niyetinde olmadığımızı resmen ilan etme zamanı geldi. Yakında, denizlerin bize ait olduğunu ve başka kimseye ait olmadığını görecekler."
 GER_the_sino_germanic_pact:0 "Çin-Alman Paktı"
 GER_the_sino_germanic_pact_desc:0 "Sonunda [CHI.GetAdjective] hükümetini bir müttefik olarak resmen tanıma zamanı geldi. Bize zulmetmek isteyen herkese karşı birlikte durabilmemiz için bu ittifakı derhal resmileştirmeliyiz!"
 GER_the_supreme_leader:0 "Yüce Lider"
 GER_the_supreme_leader_desc:0 "Yönlendirilmiş reformlar ve canlandırma programları sayesinde Wehrmacht'ın [ROOT.GetLeader]'e ve davasına olan sadakati yeni bir zirveye ulaştı. Liderimize ve Anavatanımıza yönelik bu tam destek eğilimi devam etmelidir."
 GER_the_supreme_leader_trigger:0 "[ROOT.GetNameDefCap], §Y2'den fazla Büyük§! Ülkeyi §YTeslim Aldı§!"
 GER_the_swiss_gold:0 "İsviçre Altını"
 GER_the_swiss_gold_desc:0 "[SWI.GetAdjective]lerin şimdilik herhangi bir küresel çatışmanın dışında kalmaya karar verdikleri göz önüne alındığında, ticaret ve casusluk için mükemmel bir fırsat sunuyorlar. Eyaletlerinde operatifler konuşlandırdığımızdan ve elde ettiğimiz altını saklama konusunda onları sonuna kadar kullandığımızdan emin olmalıyız."
 GER_the_triumphant_will:0 "Muzaffer İrade"
 GER_the_triumphant_will_desc:0 "$GER_improve_national_spirit_desc$"
 GER_torpedobomber:0 "Torpedobomber"
 GER_torpedobomber_desc:0 "$naval_air_effort_desc$"
 GER_total_control_over_domestic_affairs:0 "İç İşler Üzerinde Tam Kontrol"
 GER_total_control_over_domestic_affairs_chancellors_tt:0 "§Yİç Çember§! içinde atanan Parti Şansölyesi'ne göre:"
 GER_total_control_over_domestic_affairs_desc:0 "İç işlerimizi tamamen bırakıp Parti Şansölyesi'nin halletmesine izin verme ihtimali cesur bir hamle gibi görünebilir. Ancak Führer emindir. Parti Şansölyesi tarafından şimdiye kadar yürütülen görevler beklentilerin çok ötesinde ele alındı ve [ROOT.GetLeader], daha önemli meselelere odaklanmak için bunu ona bırakmaktan rahatlık duyuyor."
 GER_totaler_krieg:0 "Totaler Krieg"
 GER_totaler_krieg_desc:0 "Mutlak zaferi elde etmek için, tüm toplumumuzu seferber etmeli ve düşmanımızın kapısına topyekun savaş getirmeliyiz. [ROOT.GetNameDef]'in ayağa kalkma ve fırtınanın kopmasına izin verme zamanı geldi!"
 GER_trade_agreements:0 "Ticaret Anlaşmaları"
 GER_trade_agreements_desc:0 "Mitteleuropa sadece bir güç ittifakı değil, aynı zamanda daha iyi ticaret ilişkileri ve ekonomik işbirliği kurmaya yardımcı olan bir birliktir. Bu rolü vurgulamalı ve doğal kaynaklar bakımından zengin olanlara ulaşmak için kullanmalıyız."
 GER_trade_agreements_tt:0 "Tüm müttefikler §YUlusal Ruh§! alacak:"
 GER_trade_deal_with_sweden:0 "İsveç ile Ticaret Anlaşması"
 GER_trade_deal_with_sweden_desc:0 "$GER_swedish_trade_agreement_desc$"
 GER_trade_interdiction:0 "Ticaret Engellemesi"
 GER_trade_interdiction_desc:0 "Düşman ikmal hatlarını bozmak ve savaş çabalarını zayıflatmak için, savaşma yeteneklerini felç etmek amacıyla bir ticaret engelleme stratejisi izlemeliyiz. Yüzey filomuzu ve U-botlarımızı deniz boyunca konuşlandırarak, hayati kaynakların ve ticaret gemilerinin nakliyesini önleyecek ve düşmanlarımızı teslim olmaya zorlayacağız."
 GER_trade_interdiction_lock_other_focus_tt:0 "§Y$GER_plan_z$§! odağı, §Y$GER_unrestricted_convoy_raiding$§! odağı tamamlanana kadar kilitlenecektir."
 GER_treaty_with_the_ussr:0 "$GER_soviet_treaty$"
 GER_treaty_with_the_ussr_desc:0 "$GER_soviet_treaty_desc$"
 GER_tributes_for_guarantees:0 "Garantiler İçin Haraçlar"
 GER_tributes_for_guarantees_desc:0 "Baltık devletlerini doğudaki Ayı'dan korumalıyız, ama bunu bedavaya yapmayacağız. Bu ulusların bu kadar savunmasız bir konumda olduğu göz önüne alındığında, koruma karşılığında tazminat talep etmek kolay olacaktır."
 GER_u_boat_efforts:0 "U-Bot Çabaları"
 GER_u_boat_efforts_desc:0 "Kurt Sürüsü taktiklerinin başarıları, Donanma Yüksek Komutanlığı'nı bu yaklaşıma iki katı yatırım yapmaya ve açık denizlerde zaferimizi güvence altına almak için daha fazla ve daha iyi U-bot inşa etmeye odaklanmaya ikna etti."
 GER_unify_west_africa:0 "Güney-Batı Afrika'yı Birleştir"
 GER_unify_west_africa_desc:0 "Mittelafrika hayallerimiz şu anda Angola bölgesinin varlığı tarafından engelleniyor. Güney-Batı Afrika'daki topraklarımızı Kongo mülklerimizle birleştirmek için, bölge üzerindeki yönetimimizin derhal tanınmasını talep eden bir ültimatom göndermeliyiz."
 GER_unlock_influence_countries_tt:0 "Kararı açar: §Y$GER_influence_countries_cat$§!"
 GER_unlock_operational_planning_bewegungskrieg_tt:0 "Kararı açar: §Y$GER_operational_planning_category$§!, etkinleştirildiğinde §Y90 gün§! boyunca şunları sağlar:"
 GER_unlock_operational_planning_blitzkrieg_tt:0 "Kararı açar: §Y$GER_operational_planning_category$§!, etkinleştirildiğinde §Y45 gün§! boyunca şunları sağlar:"
 GER_unlock_operational_planning_in_africa_tt:0 "Kararı açar: §YAfrika'da Operasyonel Planlama§!"
 GER_unlock_plan_z_tt:0 "§Y$GER_plan_z$§! odağını açar."
 GER_unlock_price_controls_decision_tt:0 "Kararı açar: §Y$GER_price_controls_cat$§!, bu da §Y$MODIFIER_CONSUMER_GOODS_FACTOR$§!'u azaltabilir!"
 GER_unlock_reichswerke_tt:0 "Sanayi Holdingi §Y$GER_reichswerke$§!'i açar!"
 GER_unlock_trade_interdiction_tt:0 "§Y$GER_trade_interdiction$§! odağını açar."
 GER_unlocks_eben_emael_raid_tt:0 "§YEben Emael§!'e §YParaşütçü Baskını§! açar!"
 GER_unlocks_kremlin_raid_tt:0 "§Y[SOV.GetNameWithFlag]§! ile savaş halindeyken §YKremline§! §YHava Saldırısı§! açar!"
 GER_unlocks_statue_of_liberty_raid_tt:0 "§Y[USA.GetNameWithFlag]§! ile savaş halindeyken §YÖzgürlük Anıtı§!'na §YHava Saldırısı§! açar!"
 GER_unrestricted_convoy_raiding:0 "Sınırsız Konvoy Baskını"
 GER_unrestricted_convoy_raiding_desc:0 "Konvoy akıncılığı verimliliğimizi iki katına çıkarmalı ve denizleri tamamen kontrolümüz altına almak için planlama çabalarımızı üç katına çıkarmalıyız!"
 GER_uralbomber_program:0 "Uralbomber Programı"
 GER_uralbomber_program_desc:0 "Zafer, düşmanlarımıza nerede olurlarsa olsunlar ulaşabildiğimizde elde edilecektir. Ural Dağları'na uçabilen bir uçak geliştirmek, neredeyse her potansiyel düşmanı menzilimize sokacaktır."
 GER_uranverein:0 "Uranverein"
 GER_uranverein_desc:0 "Ulusumuz, atom enerjisi araştırmalarına öncülük etmeli ve potansiyelini kendimiz için kullanmalıdır. Bunu takip etmek ve dünyaların yok edicisi olmak için Dünya'daki en keskin zihinlerden bazılarına sahibiz."
 GER_urbanization:0 "Şehirleşme"
 GER_urbanization_desc:0 "Tarımda modern makinelerin tanıtılması birçok insanı serbest bıraktı ve şimdi yeni istihdam arayışıyla şehirlere akın ediyorlar. Bu insanlar, ekonomimizi dünyanın en güçlülerinden biri yapmaya devam edebilecekleri fabrikalarımızda iyi bir şekilde kullanılabilir."
 GER_utilize_the_nordliche_gesellschaft:0 "Nordische Gesellschaft'ı Kullan"
 GER_utilize_the_nordliche_gesellschaft_desc:0 "İskandinavya geleneksel olarak tarafsızdır. Eğer diplomatik yollarla elde edebilirsek, sahip oldukları kaynakları almak için başka bir cephe açmanın bir anlamı yoktur. Bu nedenle, İskandinav uluslarına olumlu konuşmak için Alfred Rosenberg'in Alman-İskandinav kültürel ve siyasi işbirliğini güçlendirmeye yönelik bir dernek olan Kuzey Topluluğu'nu kullanmalıyız."
 GER_wage_war_on_capitalism:0 "Kapitalizme Savaş Aç"
 GER_wage_war_on_capitalism_desc:0 "Kapitalizm, Komünizmin doğal düşmanıdır ve gerekirse zorla sökülmelidir. Kapitalizmin tam sembolü olan [USA.GetNameDef]'e karşı bu hücumu yönetecek ve yeni bir sosyalist çağın yolunu açacağız."
 GER_war_against_communism_tt:0 "Dünyadaki herhangi bir §YKomünist§! ulusa karşı §Yİlhak Et§! savaş hedefi kazan. Mevcut hedefler:"
 GER_war_against_european_communism_tt:0 "§YAvrupa§!'daki herhangi bir §YKomünist§! ulusa karşı §Yİlhak Et§! savaş hedefi kazan. Mevcut hedefler:"
 GER_war_against_fascism_tt:0 "[GER.GetNameDef]'in zaten bir savaş hedefi olmayan §YAvrupa§!'daki herhangi bir §YFaşist§! ulusa karşı §Yİlhak Et§! savaş hedefi kazan. Mevcut etki:"
 GER_war_against_major_countries_in_europe_tt:0 "§YAvrupa§!'da en az bir eyaleti kontrol eden tüm §YBüyük§! uluslara karşı §Yİlhak Et§! savaş hedefi kazan. Mevcut etki:"
 GER_war_preparations:0 "Savaş Hazırlıkları"
 GER_war_preparations_desc:0 "Ulusu yaklaşan bir savaşa tam olarak hazırlamak için, hazırlıkların sadece Wehrmacht içinde değil, aynı zamanda sanayide ve altyapıda da yapıldığından emin olmalıyız."
 GER_war_production:0 "Savaş Üretimi"
 GER_war_production_desc:0 "Savaş bizi bir kez daha yuttu, ama eğilmeyeceğiz ve düşmeyeceğiz! Sanayi gücümüzü seferber edecek ve Alman halkının bükülmez iradesini ezebileceğini düşünecek kadar akılsız herhangi bir düşmanı üretimde geçeceğiz!"
 GER_war_with_american_country_tt:0 "Bir §YAmerikan§! ülkesiyle savaşta"
 GER_war_with_the_ussr:0 "$GER_ussr_war_goal$"
 GER_war_with_the_ussr_desc:0 "$GER_ussr_war_goal_desc$"
 GER_weltpolitik:0 "Weltpolitik"
 GER_weltpolitik_desc:0 "Küresel imparatorluğumuzu restore edene veya onun yerine yeni bir tane inşa edene kadar büyük bir güç olarak ciddiye alınmayacağız. Bu nedenle dışarıya bakmaya başlamalı ve artık gözlerimizi sadece Avrupa kıtasına odaklamamalıyız."
 GER_western_duchies_name_democratic:0 "Batı Özerk Devletleri"
 GER_western_duchies_name_neutrality:0 "Batı Büyük Dükalıklarını Kur"
 GER_will_also_recieve_trade_and_civs_tt:0 "Ayrıca kaynaklarının ve sivil sanayilerinin küçük bir kısmını da alacağız. \n §Y$MODIFIER_CONSUMER_GOODS_FACTOR$§! miktarı, taleplerimizi kaç ulusun kabul ettiğine bağlı olacaktır"
 GER_wirtschaftswunder:0 "Wirtschaftswunder"
 GER_wirtschaftswunder_desc:0 "Ekonomiyi canlandırmak için tüm programlarımız ve girişimlerimiz nihayet meyvesini verdi! Dünyanın dört bir yanındaki insanlar mali ve endüstriyel toparlanmamıza hayran kalıyor ve buna 'Wirtschaftswunder' - bir ekonomik mucize diyor."
 GER_with_panzerschiff_completed_tt:0 "§Y$GER_panzerschiff_raiders$§! tamamlandığında:"
 GER_with_u_boat_efforts_completed_tt:0 "§Y$GER_u_boat_efforts$§! tamamlandığında:"
 GER_wolfpack_tactics:0 "Kurt Sürüsü Taktikleri"
 GER_wolfpack_tactics_desc:0 "Denizaltılarla konvoylara saldırma fikri yeni değil ve Büyük Savaş sırasında kullanıldı, ancak yeni bir taktik önerildi. Bu yeni yaklaşım, U-botlarımızın bir Rudel, bir sürü içinde işbirliği yaparak ticaret gemilerini bulup batırmasını görecektir. Bu, düşmanı ham maddelerden ve bu savaşı sürdürme yeteneğinden mahrum bırakmanın anahtarı olabilir."
 GER_womens_rights_and_equality:0 "Kadın Hakları ve Eşitliği"
 GER_womens_rights_and_equality_desc:0 "Cinsiyet, bir bireyin ülkesine nerede hizmet etmesi beklendiğini belirlemede uzun zamandır belirleyici bir faktör olmuştur, ister cephede, ister fabrikalarda, isterse evde. Yüklerin daha eşit bir şekilde bölünmesini takip ederek, gerekirse daha büyük bir işgücüne ve daha büyük bir orduya olanak tanırız."
 GER_workers_rights:0 "İşçi Hakları"
 GER_workers_rights_desc:0 "Sendikalar son birkaç yılda temelden değişti ve bir zamanlar oldukları şeyden tanınmaz hale geldiler. Onları reforme ederek işçileri toplayabilir ve faydalarından yararlanabiliriz."
 GER_wunderwaffe_dornberger_trait_tt:0 "§Y$GER_walter_dornberger$§! ($high_command$): \n§Y$GER_head_of_the_missile_department$§! özelliğini §Y$GER_head_of_experimental_weapons$§! ile değiştir \nEtkin değişiklik: \nTesis İkmal Tüketimi: §G-%10.00§! \n$specialization_naval_speed_factor$: §G+%10§! \n$specialization_nuclear_speed_factor$: §G+%10§!"
 GER_zentrale_planung:0 "Zentrale Planung'u Kur"
 GER_zentrale_planung_desc:0 "Savaş, silahlanma çabalarımızdaki eksiklikleri ortaya çıkardı, bu eksiklikleri ele almalıyız! Hükümet, sanayi ve ordudan üyelerle bir Merkezi Planlama Kurulu oluşturarak, silah üretimimizi desteklemek ve ulusal hedeflerimizi ve askeri üstünlüğümüzü desteklemek için ekonomik politikaları koordine edebilir ve kaynakları verimli bir şekilde yeniden yönlendirebiliriz."
 HABSBURG_an_empire_not_just_in_name:0 "Bin Yıllık Bir Federasyon"
 HABSBURG_an_empire_not_just_in_name_desc:0 "Federasyonumuz gerçekten bin yıl ayakta kalacak ve artık bizimle geleceğimiz arasına hiçbir şey giremez. Bilinsin ki, Tuna bölgesi dünyanın en zengin ve en hayranlık uyandıran bölgesidir!"
 HABSBURG_an_empire_not_just_in_name_no_puppets_tt:0 "Bu §YOrtak Odak Ağacına§! sahip tüm bağlı devletler şunları kazanacak:"
 HABSBURG_armor_initiative:0 "Zırhlı İnisiyatifleri"
 HABSBURG_armor_initiative_desc:0 "Savaşın geleceği, selefimizin kaybettiği Büyük Savaş'ın sonu gibi, zırhlı araçlar tarafından belirlenecektir. Bu hataları telafi etmeli ve bir kez daha düşmemek için buna odaklanmalıyız."
 HABSBURG_bring_back_royal_and_imperial_hussars:0 "Kraliyet ve İmparatorluk Hüssarlarını Geri Getir"
 HABSBURG_bring_back_royal_and_imperial_hussars_desc:0 "Eskiden, eski Avusturya-Macaristan İmparatorluğu'nun Kraliyet ve İmparatorluk Hüssarları vardı. Hüssarların ruhu, çoğu Hüssar biriminin uzun zaman önce dağıtılmasına rağmen bugüne kadar yaşamaktadır. Hem kendi halkımızdan hem de düşmanlarımızdan bu kadar saygı toplayan birimler, şimdi bile bize büyük fayda sağlayacaktır."
 HABSBURG_call_the_imperial_diet:0 "İmparatorluk Meclisini Topla"
 HABSBURG_call_the_imperial_diet_desc:0 "Sonunda İmparatorluk meclisini yeniden toplama zamanı geldi. Bu federasyonun lideri olarak bizim için bu federasyonun vizyonu her zaman net olmuştur. Hırs her zaman imparatorluğun yeniden entegrasyonu olmuştur ve bunu takip etme zamanımız geldi."
 HABSBURG_defensive_hussars:0 "Macar Hüssarlarını Model Al"
 HABSBURG_defensive_hussars_desc:0 "Yeniden canlandırılan Hüssar gücümüzün, şimdi daha modern olan ordumuza sorunsuz bir şekilde yerleşmesi için bazı değişikliklerden geçmesi gerekiyor. Mevcut Macar hafif süvarisi, modern bir Hüssar'a yaklaşımları, yeni Hüssar ordumuzu şekillendireceğimiz rol model olmalıdır. Onların deneyimlerini kullanarak ve çevikliklerini ve hızlarını elde etmeye çalışarak, hesaba katılması gereken bir güç inşa edebiliriz."
 HABSBURG_discounted_licenses:0 "Faydalı Silah Sözleşmeleri Kur"
 HABSBURG_discounted_licenses_desc:0 "En modern silahlara sahip olmayabiliriz, ancak bu bir sorun değil, çünkü politikacılarımız kendi tesislerimizde üretim için yabancı teknolojiye daha iyi erişmemize yardımcı olabilecek kişilerle temas halindedir. Bu geniş ağı kullanarak, en iyi teçhizat için üretim haklarını toplayacağız ve geniş sanayimizi kullanarak, birliklerimiz için üstün teçhizata erişimimiz olacak."
 HABSBURG_economic_cooperation_policy:0 "Ekonomik İşbirliği Politikası"
 HABSBURG_economic_cooperation_policy_desc:0 "Şu anda federasyon üyelerimiz kendi ekonomilerini tamamen kendileri yönetiyor. Bu, herkese mümkün olduğunca fazla özgürlük tanısa da, federasyonun ekonomik gücünü de engelliyor. Bir işbirliği politikası oluşturarak, üyelerin daha büyük ekonomik sorunlar karşısında birlikte hareket etmelerini sağlayabiliriz."
 HABSBURG_effectivizing_the_motorized_troops:0 "Etkili Yakıt Kullanımı"
 HABSBURG_effectivizing_the_motorized_troops_desc:0 "Ordumuza daha fazla motorize, mekanize ve zırhlı birim entegre ettikçe yakıt kullanımımız fırladı. Yakıtın kendisi, askeri yeteneklerimizi engelleyen en endişe verici darboğaz haline geldi. Yakıt kullanımımızı iyileştirmeye bakmalıyız, bu bize hem askeri hem de ekonomik olarak fayda sağlayacaktır."
 HABSBURG_for_the_glory_of_the_empire:0 "Krallığın Şanı İçin"
 HABSBURG_for_the_glory_of_the_empire_desc:0 "Artık ordularımızın yeterli güce ulaştığı düşünülebileceğine göre, vatandaşlarımıza vatansever bir görev duygusu aşılamanın zamanı geldi, böylece her bireyin evini düşmandan koruyan şeyin kendileri olduğunu fark etmelerini sağlayabiliriz."
 HABSBURG_improved_production_methods:0 "Geliştirilmiş Üretim Yöntemleri"
 HABSBURG_improved_production_methods_desc:0 "Artık sanayilerimiz verimli bir şekilde işbirliği yaptığına göre, halkımızın ve onların sıkı çalışmalarının gerçek gücünü ve potansiyelini kullanarak üretim yöntemlerimizi geliştirmeye çalışabiliriz."
 HABSBURG_increase_scientific_cooperation:0 "Ortak Araştırma Tesisleri Kur"
 HABSBURG_increase_scientific_cooperation_desc:0 "Bilim insanlarımızın daha yakın işbirliği yapabileceği, araştırmalarının hızını artırabileceği ve bizi yeni ufuklara taşıyabileceği yeni laboratuvarları ve gizli araştırma tesislerini ortaklaşa finanse etme zamanı geldi."
 HABSBURG_industrial_effectivization:0 "Sanayi Etkinleştirme"
 HABSBURG_industrial_effectivization_desc:0 "Fabrikalarımızın sadece savaş zamanında değil, açıkçası barış zamanında da çalışması gerekiyor. Mükemmel bir dünyada, ikincisi birincisinden çok daha önemli olurdu, ne yazık ki bu dünya mükemmel değil. Ancak barış zamanı sanayi girişimlerimizi yine de göz ardı edemeyiz."
 HABSBURG_industrializing_our_capitals:0 "Başkentleri Sanayileştirme"
 HABSBURG_industrializing_our_capitals_desc:0 "Federasyonumuzdaki çoğu başkent eski, tarihi şehirlerdir. Bu iyi bir şey ve üyelerimizin uzun ve güçlü bir tarihinden bahsetse de, sanayi açısından bizi daha fazlasını istemeye bırakıyor. Bu şehirleri daha da sanayileştirmek için ortaklaşa çaba göstermek çok faydalı olabilir."
 HABSBURG_is_originator_country:0 "§Y[ROOT.GetName]§!, §YKöken Ülkedir§!!"
 HABSBURG_is_subject_puppeteer_faction_leader_or_member_trigger_tt:0 "§Y[AUS.GetNameDef]§! veya §Y[HUN.GetNameDef]§! olup herhangi bir §YAvusturya-Macaristan Bağlantılı Devleti§! bağlı devleti olarak elinde bulundurur, onlardan birinin bağlı devletidir, §Y[AUS.GetNameDef]§! veya §Y[HUN.GetNameDef]§! olarak bir ittifak lideridir veya herhangi bir §YAvusturya-Macaristan Bağlantılı Devleti§! olarak onlarla bir ittifaktadır."
 HABSBURG_joint_consumer_goods_endeavors:0 "Tuna Merkez Bankası"
 HABSBURG_joint_consumer_goods_endeavors_desc:0 "Federasyon içindeki her bir devletin ekonomik yetenekleri büyük farklılıklar göstermektedir. Merkez Bankalarımız da ekonomik güç açısından büyük farklılıklar göstermektedir ve her ülkenin kendi Merkez Bankasını elinde tutmasına izin verilmesi gerekirken, federasyon için bir Merkez Bankası oluşturmak, öncelikle federasyonun genel ekonomik durumuyla ilgilenen bir kurumumuzun olmasını sağlayacaktır."
 HABSBURG_joint_ft_unlock_tt:0 "Avusturya-Macaristan §YOrtak Odak Ağacını§! açar!"
 HABSBURG_joint_industry_spirit:0 "Ortak Sanayi Planlaması"
 HABSBURG_joint_industry_spirit_desc:0 "Federasyonumuzdaki her ülke sanayi açısından kendi payına düşeni yapmalıdır. Ancak şu anda hepimiz farklı planlar üzerinde çalışıyoruz ve daha kapsamlı bir işbirliği şekillenirken bu durum zorluklara neden oluyor. Sanayi girişimlerimizi birlikte planlayarak maksimum verimliliği sağlayabiliriz."
 HABSBURG_joint_training_initiative:0 "İmparatorluk ve Kraliyet Savaş Bakanlığı"
 HABSBURG_joint_training_initiative_desc:0 "Eskiden Ortak Ordu, belirlenmiş bir Bakanlık tarafından yönetiliyordu. Geriye dönüp bakıldığında, Bakanlık kötü yönetiliyordu ve savaş alanında olanlardan kopuktu. Ancak fikir sağlamdı. Ortak hareket edeceksek, planlama ve organizasyonumuzun da ortak yönetilmesi gerekir."
 HABSBURG_joint_ventures_in_resource_extraction:0 "Kaynak Çıkarımında Ortak Girişimler"
 HABSBURG_joint_ventures_in_resource_extraction_desc:0 "Bazı kaynakların fark edilmemesi veya genellikle ekonomi veya zamanla veya her ikisiyle ilgili diğer nedenlerle kazılmaması kaçınılmazdır. Ancak şimdi tüm bu kaynaklar federasyon altında toplandığına göre, daha büyük ekonomimizden ve bu kaynakları en iyi nasıl çıkaracağımıza dair genişletilmiş bilgimizden yararlanabiliriz!"
 HABSBURG_mechanized_initiative:0 "Mekanize İnisiyatifler"
 HABSBURG_mechanized_initiative_desc:0 "Asker taşımacılığına ve daha ağır zırhlı olmaya muktedir, yarı paletli kamyon seçeneğini tartışmaya başlayan bilim insanları var. Seçenek muhtemelen bir tanktan daha ucuza mal olacak, ancak bir kamyondan daha sağlam olacak ve daha zorlu arazilerle başa çıkabilecektir. Belki de bu proje için fon teklif etmeliyiz."
 HABSBURG_meeting_the_logistical_challenge:0 "Lojistik Zorlukla Başa Çıkma"
 HABSBURG_meeting_the_logistical_challenge_desc:0 "Lojistik zorluk, federasyonumuzla birlikte büyüyor. İkmal malzemelerinin birliklerimize ulaşması artık daha uzun sürüyor ve bunun ele alınmadığı takdirde gelecekte bir sorun haline gelmesinden korkuyoruz. Birliklerimiz daha azıyla daha fazlasını yapmak üzere eğitilmeli ve birliklere ikmal dağıtımı iyileştirilmelidir."
 HABSBURG_motorizing_the_armies:0 "Orduları Motorize Et"
 HABSBURG_motorizing_the_armies_desc:0 "Modern savaş belki hala piyade taarruzlarıyla ilgili olabilir, ancak durum böyle olsa bile, piyadenin federasyonun bir noktasından diğerine olabildiğince hızlı ve verimli bir şekilde ulaşabilmesini sağlamalıyız. Birliklerimizin daha fazlasını kamyonla taşımak için bir motorizasyon çabası başlatarak, birliklerimizin her zaman ihtiyaç duyulan yerde zamanında olmasını sağlayacağız."
 HABSBURG_offensive_hussars:0 "Polonya Hüssarlarını Model Al"
 HABSBURG_offensive_hussars_desc:0 "Yeniden canlandırılan Hüssar gücümüzün, şimdi daha modern olan ordumuza sorunsuz bir şekilde yerleşmesi için bazı değişikliklerden geçmesi gerekiyor. Mevcut Polonya ağır süvarisi, kanatlı hüssarları, düşmanlarının kalbine hem korku hem de saygı aşılamıştır. Bu şeyleri göz önünde bulundurarak, Hüssarlarımızın aynı modelle çalışması gerektiği kristal berraklığındadır."
 HABSBURG_optimizing_the_land_usage:0 "Arazi Kullanımını Optimize Etme"
 HABSBURG_optimizing_the_land_usage_desc:0 "Bir federasyonda bu kadar çok ülkenin birlikte faaliyet göstermesiyle, arazi kullanımımızın hiçbir şekilde mükemmel olmaması şaşırtıcı değildir. Sanayi sahalarımızdan en iyi şekilde nasıl yararlanılacağına dair bilgimizi bir araya getirerek, muhtemelen fabrika inşa etme şeklimizi optimize edebiliriz."
 HABSBURG_organizational_exercises:0 "Ortak Organizasyon Tatbikatları"
 HABSBURG_organizational_exercises_desc:0 "Gelecekteki savaşları manevra belirleyecektir. Savaş giderek daha yüksek bir hızda yürütüldükçe, yüksek hızlara ve kusursuz organizasyona olan ihtiyaç artmaktadır. Birliklerimiz hedeflerini kaybetmeden hızlı bir şekilde nasıl hareket edeceklerini bilmezlerse, hiçbir ateş gücü bizi kurtaramaz. Ordumuz birçok milletten insanı içerecek şekilde büyüdükçe, birliklerimizi koordine etme ve organize etme çabaları gösterilmelidir."
 HABSBURG_part_of_something_bigger:0 "Bölünmez ve Ayrılamaz"
 HABSBURG_part_of_something_bigger_desc:0 "Tüm insanlar kendi evlerini savunmaları gerektiğini bilir, ancak yeni kurulan federasyonumuz, komşularının değer verdiği şeyleri korumada sınır ötesi işbirliği ve yardımın önemini de fark etmezlerse kesinlikle çökecektir."
 HABSBURG_reform_gemeinsame_armee:0 "Ortak Orduyu Yeniden Düzenle"
 HABSBURG_reform_gemeinsame_armee_desc:0 "Geçmişte Avusturya-Macaristan İmparatorluğu, ortak davamız için tüm ülkelerin katkıda bulunduğu hatırı sayılır bir Ortak Ordu'yu destekliyordu. Mevcut ideolojik farklılıklarımız ve benzerliklerimiz ne olursa olsun, ortak bir askeri girişim bizi yalnızca daha güçlü kılacaktır."
 HABSBURG_reinforced_industry:0 "Güçlendirilmiş Sanayi"
 HABSBURG_reinforced_industry_desc:0 "Fabrikalarımızın barış zamanında çalışabilmesi önemli olsa da, şimdi bu sorunu ele alma zamanı değil. Sanayi sektörümüz, kendi topraklarımızda yürütülen bir savaşa dayanabilmeli ve bu başarıldıktan önce, barış zamanı operasyonları hakkında düşünmek için zaman ayıramayız."
 HABSBURG_securing_the_consumer_rights:0 "Halk İçin Refah"
 HABSBURG_securing_the_consumer_rights_desc:0 "Savaş savunucuları her yerde olsa da, bu federasyonu kimin mümkün kıldığını unutmamalıyız. O, halkıdır ve bu nedenle onların içinde bulundukları durumdan her zaman memnun olmalarını sağlamalıyız."
 HABSBURG_simplify_economic_lawmaking:0 "Ekonomik Yasa Yapımını Basitleştir"
 HABSBURG_simplify_economic_lawmaking_desc:0 "Üyelerimiz şu anda ticaret ve ekonomi ile ilgili oldukça farklı yasalara sahiptir. Yasaların tüm üye ülkelerde aynı olmasını merkezi olarak kontrol etmeye gerek olmasa da, duruma göre gerekli olan yasaları dinamik olarak değiştirme süreci, modernize edilmesinden fayda sağlayabilir."
 HABSBURG_specializing_in_civilian_logistics:0 "Sivil Lojistikte Uzmanlaşma"
 HABSBURG_specializing_in_civilian_logistics_desc:0 "Federasyon genelindeki alet ve teçhizat akışı, kötü altyapı ve yozlaşmış fabrika sahiplerinden muzdariptir. Bu sektöre yoğun bir şekilde odaklanmalı ve mümkün olan en kısa sürede iyileştirmeliyiz."
 HABSBURG_specializing_in_the_arms_industry:0 "Silah Sanayinde Uzmanlaşma"
 HABSBURG_specializing_in_the_arms_industry_desc:0 "Eğer [GER.GetAdjective], [SOV.GetAdjective], [ENG.GetAdjective] veya [FRA.GetAdjective] devleriyle rekabet etmek istiyorsak, askeri sanayilerimizi büyük ölçüde genişletmeliyiz!"
 HABSBURG_supplying_the_federation:0 "Federasyonu Tedarik Etme"
 HABSBURG_supplying_the_federation_desc:0 "Federasyonumuz büyüdükçe, ikmal ve demiryolu ağımız da onunla birlikte büyümelidir. Çaba gösterilmelidir, aksi takdirde kendi altyapımızı aşma ve hem acı verici hem de aşağılayıcı bir düşüş yaşama riskiyle karşı karşıya kalırız."
 HABSBURG_technology_sharing:0 "Bilimsel İşbirliği"
 HABSBURG_technology_sharing_desc:0 "Federasyonumuz içinde birçok parlak zihin bulunmaktadır. Bölgemizin gelişimini ilerletmek ve federasyonumuzu hak ettiği geleceğe taşımak için onları bir araya getirmeliyiz."
 HABSBURG_the_modern_hussar:0 "Modern Hüssar"
 HABSBURG_the_modern_hussar_desc:0 "Zaman kimseyi beklemez, cesur Hüssarlarımızı bile. Bu cesur adamlar hala Ortak Ordumuz için bir varlık olsalar da, bir Hüssarın gerçekte ne olduğunu modernize etmeliyiz. Saygıdeğer Hüssarlarımızın geleceği her zaman at sırtında olmayabilir, ancak bunun pek bir önemi yok, önemli olan Hüssar ruhunun yaşamaya devam etmesidir!"
 HABSBURG_the_strength_of_the_common_man:0 "Sıradan İnsanın Güçlü Yanları"
 HABSBURG_the_strength_of_the_common_man_desc:0 "En büyük organizasyon bile en küçük parçalara dayanır. Bizim için ve özellikle ordularımız için bu, sıradan insana, askerlerimize bağlı olmak anlamına gelir. Askeri organizasyonumuzdaki her askerin hem omuzlarındaki yükü hem de onu taşıyacak güce sahip olduğunu ve bunun onun görevi olduğunu anlamasını sağlamalıyız."
 HABSBURG_united_in_the_face_of_danger:0 "Tehlike Karşısında Birleşmiş"
 HABSBURG_united_in_the_face_of_danger_desc:0 "Bu, Ölüm veya Onursuzluktur ve halkımız bunu iyi bilir. Bize karşı yükselebilecek her türlü tehdide karşı tam bir birlik içinde duracağız! "
 HUN_antal_freiherr_becomes_available_as_general_tt:0 "§YAntal Freiherr von Lehár§!, 4. seviye §YGeneral§! olarak mevcut olur!"
 HUN_balkan_ambitions:0 "Balkan Hırsları"
 HUN_balkan_ambitions_desc:0 "Balkan işçileri, hepsi dünya devriminin açık düşmanları olan Kapitalistlerin, Monarşistlerin ve Faşistlerin çizmeleri altındadır. Balkanlarda barış istiyorsak onların kurtarıldığını görmeliyiz."
 HUN_bringing_down_the_giants_tt:0 "Avrupa'daki büyük Demokratik Olmayan uluslara karşı §Y[GetWargoalBasedOnGovernment]§! savaş hedefi kazanır:"
