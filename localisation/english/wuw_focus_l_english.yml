 wuw_HUN_a_bulwark_against_communism:0 "Komünizme Karşı Siper"
 wuw_HUN_a_bulwark_against_communism_desc:0 "Bolşevik tehdidi zaten çok fazla yayıldı ve kimse onu durdurmaya istekli olmazsa daha da ileri gitmekle tehdit ediyor. Dünyanın koruyucusu pelerinini almalı ve onu bu felakete karşı korumalıyız!"
 wuw_HUN_a_cult_of_personality:0 "Bir Kişilik Kültü"
 wuw_HUN_a_cult_of_personality_desc:0 "[ROOT.GetNameDef] çocuklarının örnek alabilecekleri bir figüre, en derin saygılarını adayabilecekleri devrimci bir ruha ihtiyaçları var. Bu nedenle, gücü Mátyás Rákosi etrafında merkezileştirmeli ve onun iradesini halkının zihinleri boyunca taşıyabilecek ve onlara güvenmeleri gereken gerçek değerleri öğretebilecek bir kişilik kültü inşa etmeliyiz."
 wuw_HUN_a_danubian_federation:0 "Bir Tuna Federasyonu"
 wuw_HUN_a_danubian_federation_desc:0 "Avrupa'nın ortasındaki benzersiz konumumuzla, açık toprak kazanımlarına gerek kalmadan çok etkili olma potansiyelimiz var. Ordumuzun gücü kadar önemli olan, sözlerimizin ve diplomatik eylemlerimizin gücüdür. Tuna etrafında bir topluluk oluşturarak, kendi sınırlarımızın çok ötesinde bir diplomatik erişime ve güce sahip olabiliriz."
 wuw_HUN_a_declaration_of_intentions:0 "Bir Niyet Beyanı"
 wuw_HUN_a_declaration_of_intentions_desc:0 "Niyetlerimizi tüm dünyaya açıkça belirtmenin ve onlara [ROOT.GetAdjective] halkının gerçekte neyden yapıldığını göstermenin zamanı geldi."
 wuw_HUN_a_grand_habsburg_alliance:0 "Bir Habsburg İttifakı"
 wuw_HUN_a_grand_habsburg_alliance_desc:0 "Kendi akrabalarınızdan daha fazla güvenebileceğiniz kimse yoktur ve tarih boyunca herkesin büyük Habsburg ailesine karşı olduğunu öğrendik. Bu nedenle, ittifaklarımızı ailemiz içinde tutmalı ve sadece Habsburg yönetimindeki devletlerden oluşan bir ittifak kurmalıyız."
 wuw_HUN_a_habsburg_poland:0 "Bir Habsburg Polonyası"
 wuw_HUN_a_habsburg_poland_desc:0 "Polonya toprakları bir zamanlar potansiyel Habsburg krallığıydı ve Habsburglar tarafından kontrol edilen toprakları bir kez daha genişletme zamanı geldi. Polonya hükümetine ulaşmalı ve krallığı restore etmelerini, Karl Albrecht'i tahtlarına yerleştirmelerini talep etmeliyiz."
 wuw_HUN_a_holy_empire:0 "Kutsal Bir İmparatorluk"
 wuw_HUN_a_holy_empire_desc:0 "Artık kutsal topraklar gerçek Kudüs Kralı'nın kontrolü altında olduğuna göre, Kudüs Krallığı nihayet restore edildiği için Papa'ya yaklaşıp onun kutsamasını isteyebiliriz. Bu, imparatorluğumuzun halkının, uluslarımızdaki hükümdarların rolünü anlamasını ve gerçekten de Tanrı tarafından seçildiklerini anlamalarını sağlayacaktır."
 wuw_HUN_a_holy_empire_tt:0 "§YOtto von Habsburg§! ve vasalları Papa tarafından kutsanacak"
 wuw_HUN_a_hungarian_galicia:0 "Bir [ROOT.GetAdjective] Galiçyası"
 wuw_HUN_a_hungarian_galicia_desc:0 "Eskiden, Galiçya ve Bukovina, Cisleithania tarafından yönetiliyordu, ancak şimdi İmparatorluktaki baskın ortak olduğumuza göre, bu toprakları koruyacak ve yönetecek olanların biz olmamız sadece mantıklıdır."
 wuw_HUN_a_mobile_army:0 "Mobil Bir Ordu"
 wuw_HUN_a_mobile_army_desc:0 "Ordumuz, ordudaki saf insan sayısı açısından herhangi bir dünya gücünü yenemeyeceği için, teknolojik üstünlüğe odaklanmalıyız. Düşman birimlerini delebilecek ve kuşatabilecek zırhlı ve diğer kara tabanlı araçlar savaşın geleceğidir ve bu gerçeği benimsemeliyiz."
 wuw_HUN_a_multi_ethnic_empire:0 "Çok Etnikli Bir İmparatorluk"
 wuw_HUN_a_multi_ethnic_empire_desc:0 "İmparatorluğumuz birçok farklı insanı ve kültürü kapsıyor ve bu, krallığımızın farklı yerelliklerine büyük özerklik tanıyarak, halkımızın önümüzdeki yıllarda bizim bir parçamız olarak kalmak istemesini sağlayarak tamamen benimsememiz gereken bir şeydir."
 wuw_HUN_a_new_pride_of_the_fleet:0 "Donanmanın Yeni Gururu"
 wuw_HUN_a_new_pride_of_the_fleet_desc:0 "Donanma geleneğimizin hikayeli tarihi, deneme, sıkıntı ve ihanetle dolu bir tarih olmuştur. Mirasımızın gururunu yeniden tesis etme çabasıyla, amirallerimiz tüm ulusa ilham verecek yeni bir amiral gemisi öneriyor."
 wuw_HUN_a_reformed_navy:0 "Yeniden Düzenlenmiş Bir Donanma"
 wuw_HUN_a_reformed_navy_desc:0 "Eskimiş fikirlere dayalı bir donanma oluşturmak pek mantıklı değil. Bize, eskinin yükü olmadan, sıfırdan yeni bir donanma oluşturma fırsatı verildi. Bunu, yapabileceğimiz en modern ve yetenekli donanmayı inşa etmek için kullanmalıyız."
 wuw_HUN_a_responsible_government:0 "Sorumlu Bir Hükümet"
 wuw_HUN_a_responsible_government_desc:0 "Geleneksel olarak, hükümet nihayetinde krala hesap verirdi, bu da halkın iradesini görmezden gelmesine olanak tanırdı. Hükümeti sorumlu tutanın hükümdar değil, halk olmasını sağlamak için anayasayı değiştireceğiz."
 wuw_HUN_a_revolutionary_greater_hungary:0 "Bir Panoniyen Sosyalist Birliği"
 wuw_HUN_a_revolutionary_greater_hungary_desc:0 "Sınırlarımız bir kez daha restore edildiğine göre, gözlerimizi gerçek hedefe dikme zamanı geldi. Ulusa bakılmaksızın tüm insanlar için bir devlet olarak bir Panoniyen Sosyalist Cumhuriyetler Birliği ilan etme fırsatını yakalamalıyız. Bu, dikkatimizi dünya devrimini yayma konusundaki daha büyük amacımıza yönlendirmemizi sağlayacaktır."
 wuw_HUN_a_revolutionary_greater_hungary_tt:0 "§YPanoniyen Sosyalist Cumhuriyetler Birliği§! olarak bilineceğiz!"
 wuw_HUN_a_roman_catholic_state:0 "Bir Roma-Katolik Devleti"
 wuw_HUN_a_roman_catholic_state_desc:0 "Ülkemiz uzun zamandır Hristiyandır, ilk Macar din değiştirenlerden bazıları 950 yılı civarında şefler harka Bulcsú ve gyula Geula'dır. Bugüne kadar hala dindar Katolikleriz ve karşılaştığımız zorluklar ne olursa olsun yolumuzdan sapmayacağız."
 wuw_HUN_a_unifying_heritage:0 "Birleştirici Bir Miras"
 wuw_HUN_a_unifying_heritage_desc:0 "[ROOT.GetAdjective] halkı birçok farklı ulusa dağılmış olabilir, ancak bu, birbirimize karşı dayanışma hissetmemizi engellemez. Pan-Macarcılığımızı benimsemeli ve er ya da geç tüm [ROOT.GetAdjective] halkını tek bir bayrak altında birleştirmeye çalışmalıyız."
 wuw_HUN_abide_by_the_little_ententes_stipulations:0 "Küçük Antant'ın Şartlarına Uy"
 wuw_HUN_abide_by_the_little_ententes_stipulations_desc:0 "Büyük Savaş'ın sonundan beri, Romanya, Çekoslovakya ve Yugoslavya'dan oluşan Küçük Antant, bir daha asla bir Habsburg kralına sahip olamayacağımızı şart koştu. Açıkçası, bu bize gayet uygun, çünkü aklımızda başka bir aday var."
 wuw_HUN_absolute_rule_of_the_national_unity_party:0 "Ulusal Birlik Partisi'ni Kullan"
 wuw_HUN_absolute_rule_of_the_national_unity_party_desc:0 "Başbakanın mevcut siyasi partisi olan Egységes Párt'ı kullanarak, [ROOT.GetLeader], [ROOT.GetAdjective] siyaseti üzerinde güçlü bir kontrol sağlayabilir ve seçimleri tamamen yasaklamadan durumu etkili bir şekilde tekelleştirebilir."
 wuw_HUN_act_of_defense:0 "Savunma Yasası"
 wuw_HUN_act_of_defense_desc:0 "Dünya ısınırken bir çatışma demleniyor, yaklaşmakta olan fırtınaya karşı kendimizi hazırlamalıyız. Gerekirse son adama kadar ülkemizi savunmamıza yardımcı olacak yeni yasalar çıkarma zamanı geldi!"
 wuw_HUN_aid_the_carlist_struggle:0 "Carlist Mücadelesine Yardım Et"
 wuw_HUN_aid_the_carlist_struggle_desc:0 "İspanyol Carlistleri, uluslarının geleneksel değerlerini restore etmek ve bir kez daha tahtlarına uygun bir hükümdar yerleştirmek için asil bir savaş veriyorlar. Gelecekte bölgede potansiyel bir müttefik istiyorsak, İspanyol iç savaşında zafer mücadelesinde bize bu kadar yakın bir hizbe yardım etmek akıllıca olacaktır."
 wuw_HUN_allied_manufacturing_programs:0 "Müttefik Üretim Programları"
 wuw_HUN_allied_manufacturing_programs_desc:0 "Sanayimiz kendi başına güçlü olabilir, ancak dünya güçlerinden herhangi biriyle rekabet edemez. Bu nedenle, onlara Pengö ile geri ödeme karşılığında müttefik tesislerde yeni uçaklar üretmeliyiz."
 wuw_HUN_allied_manufacturing_programs_tt:0 "İttifak Liderimiz 2 §YHarita Dışı Sivil Fabrika§! ve §Y1x§! §G%50§! §YHava Teçhizatı§! araştırma hızı bonusu kazanacak!"
 wuw_HUN_an_airforce_to_be_reckoned_with:0 "Geleceğin Hava Kuvvetleri"
 wuw_HUN_an_airforce_to_be_reckoned_with_desc:0 "Hava kuvvetlerimizin, düşmanlarımızla daha iyi rekabet edebilmek için modernize edilmesi ve güçlendirilmesi gerekiyor. Birleşik silahlar geleceğin yoludur ve bu, benimsememiz gereken bir gerçektir."
 wuw_HUN_an_alliance_with_italy:0 "[ITA.GetNameDef] ile İttifak"
 wuw_HUN_an_alliance_with_italy_desc:0 "Roma Protokollerinde yapılan bir ittifaka yönelik ilk yaklaşımlar şimdi genişletilebilir. Hem savunma hem de saldırı amaçlı bağlayıcı bir anlaşmayı görüşmek üzere İtalya'ya bir heyet göndereceğiz."
 wuw_HUN_anglo_hungarian_alliance:0 "İngiliz-Macar İttifakı"
 wuw_HUN_anglo_hungarian_alliance_desc:0 "Horthy'lerin her zaman İngilizlerle yakın bağları olmuştur ve çevremizdeki gerilimler artarken, ülkemizin bir ittifak aramasının zamanı geldi. İngilizler tabii ki doğal işbirliği ortağıdır, çünkü onların yardımı, onlar başka yerlere odaklanırken bizim kıtadaki kendi meselelerimize odaklanmamızı sağlayabilir."
 wuw_HUN_announce_the_gyor_program:0 "Györi Programını Duyur"
 wuw_HUN_announce_the_gyor_program_desc:0 "Askeriyemiz tehlikeli derecede zayıf ve boyutunu ve savaş kabiliyetini artırmamız zorunludur. Bunu yapmak için, artan teçhizat taleplerine ayak uydurmak amacıyla sanayimizi önemli ölçüde desteklemeliyiz. Beş yıllık Györi Programı, hükümet harcamalarını sadece askeriye değil, aynı zamanda sanayi, tarım, altyapı ve eğitim gibi yardımcı sektörlere de artıracaktır."
 wuw_HUN_announce_the_gyor_program_tt:0 "§Y[ROOT.GetAdjective] Silah Sanayilerine§! ek yatırımlar ve genişletme sağlayan §YGyöri Programı Yatırımları§! kararlarını açar!"
 wuw_HUN_approach_the_diasporas:0 "Diasporalara Yaklaş"
 wuw_HUN_approach_the_diasporas_desc:0 "Trianon antlaşmasından bu yana, ülkemizin dışında neredeyse akla gelebilecek her yönde Macar diasporaları bulunmaktadır. Bu insanlara yeniden yaklaşmalı ve onlara Macar devletine karşı büyük bir ulusal gurur ve vatanseverlik duygusu aşılamalı, onları zalim baskıcılarından nihai kurtuluşlarına hazırlamalıyız."
 wuw_HUN_assault_gun_focus:0 "Taarruz Topu Odağı"
 wuw_HUN_assault_gun_focus_desc:0 "Tam teşekküllü tanklara odaklanmak yerine, daha uygun maliyetli bir alternatif olarak, piyademize yarma harekatlarında yardımcı olması için taarruz toplarına güveneceğiz."
 wuw_HUN_attempt_economic_independence:0 "Ekonomik Bağımsızlığa Teşebbüs Et"
 wuw_HUN_attempt_economic_independence_desc:0 "Eski şanımıza bir daha kavuşacaksak, ekonomimizi iyileştirmek ve işletmek için yabancı güçlere güvenemeyiz. Ülkemiz bir kez daha sadece kendi ellerimizle gelişmelidir!"
 wuw_HUN_avoid_interventionalist_destablilization:0 "Müdahaleci İstikrarsızlıktan Kaçın"
 wuw_HUN_avoid_interventionalist_destablilization_desc:0 "Elimizdeki kaynaklarla en iyisini yapmalıyız. İyi planlanmış ve dengeli bir bütçe, hükümetimizin başarısının anahtarıdır."
 wuw_HUN_award_military_promotions:0 "Askeri Terfileri Ver"
 wuw_HUN_award_military_promotions_desc:0 "[ROOT.GetAdjective] askeriyesinde gerçekten de birçok büyük adam var, ancak birçoğu şu anda hak ettikleri rütbeye eşit pozisyonlarda değil. Bu nedenle, uygun gördüklerimizi terfi ettirmek ve ordumuzu bugünkünden daha güçlü hale getirmek için önlemler almalıyız."
 wuw_HUN_bringing_down_the_giants:0 "Devleri Yıkmak"
 wuw_HUN_bringing_down_the_giants_desc:0 "Bize meydan okuyacak ve özgürlüğümüze son vermeye çalışacak birçok sözde büyük güç var. Onların bunu yapmasına izin vermeyeceğiz ve halkımızın güvenliğini sağlamak için, bu uluslardan herhangi birine önleyici bir saldırı düzenlemeliyiz, böylece bir kez ve herkes için sürekli yok olma tehdidi olmadan yaşayabiliriz."
 wuw_HUN_bringing_the_air_battle_to_the_seas:0 "Hava Savaşını Denizlere Taşıma"
 wuw_HUN_bringing_the_air_battle_to_the_seas_desc:0 "Zırhlı, çoktan geçmiş bir zamanın kalıntısıdır. Deniz savaşının geleceği uçak gemisi ve uçaktır. Bu gelişmenin ön saflarında yer alacağız."
 wuw_HUN_budapest_university_of_technology_and_economics:0 "Budapeşte Teknik Üniversitesi'ni Genişlet"
 wuw_HUN_budapest_university_of_technology_and_economics_desc:0 "Önümüzdeki çatışmalarda bize yardımcı olacak çığır açan keşifler yapacak daha parlak zihinlere ihtiyacımız var. Başkentimizin üniversitesini genişleterek, askeri sanayimiz için vasıflı mühendis ve bilim insanı havuzunu artırabiliriz."
 wuw_HUN_cancel_the_german_trade_deal:0 "[GER.GetAdjective] Ticaret Anlaşmasını İptal Et"
 wuw_HUN_cancel_the_german_trade_deal_desc:0 "Faşist Gyula Gömbös, eski başbakanımız, [GER.GetAdjective]lerle ticaret antlaşmasını imzaladığında şeytanla bir anlaşma imzaladı. Bizi onlara bağlıyor ve yavaş ama emin adımlarla ulusumuzun ruhunu yok ediyor. Anlaşmayı mümkün olan en kısa sürede sona erdirmeliyiz."
 wuw_HUN_capital_ship_efforts:0 "Ana Gemi Çabaları"
 wuw_HUN_capital_ship_efforts_desc:0 "Bir donanmanın çekirdeği zırhlıdır. Kaybedilen zamanı telafi etmeli ve mümkün olan en kısa sürede yeni gemilerin inşasına başlamalıyız."
 wuw_HUN_carrying_on_arpads_legacy:0 "Árpád'ın Mirasını Sürdürme"
 wuw_HUN_carrying_on_arpads_legacy_desc:0 "9. ve 10. yüzyılların başında Macar kabileleri konfederasyonunun başı olan büyük Árpád, [ROOT.GetLeader] için büyük bir ilham kaynağıdır ve hanedanı uzun süre devam ederek [ROOT.GetnameDef]'i olabileceğinin en iyisi yapmıştır. Onun kitabından bir sayfa almalı ve örneğini takip etmeliyiz."
 wuw_HUN_central_military_planning_committee:0 "Merkezi Askeri Planlama Komitesi"
 wuw_HUN_central_military_planning_committee_desc:0 "Eğer dünya devrimi genel olarak bir gün başarılı olacaksa, biz ve müttefiklerimiz arasında daha büyük stratejik ve askeri işbirliği için bir komisyon kurmalı ve ordumuzun tam etkinlikle çalıştığından, her an düşmanlarımıza saldırmaya hazır olduğundan emin olmalıyız."
 wuw_HUN_claim_overlordship_over_slovakia:0 "[SLO.GetNameDef] Üzerinde Hakimiyet Talep Et"
 wuw_HUN_claim_overlordship_over_slovakia_desc:0 "Slovakya'nın geri kalanı da ya doğrudan ya da bir bağımlılık haline gelerek Macar devletine yeniden entegre edilmelidir. Başka bir ültimatom göndereceğiz."
 wuw_HUN_construct_the_arpad_line:0 "Árpád Hattını İnşa Et"
 wuw_HUN_construct_the_arpad_line_desc:0 "Halkımızı doğudaki tehditlerden korumak için, Transilvanya dağlarında geniş bir tahkimat hattı inşa etmeliyiz. Adlarını, 9. ve 10. yüzyılların başında Macar kabileleri konfederasyonunun başı olan büyük Prens Árpád'dan alacaklar."
 wuw_HUN_construct_the_arpad_line_tt:0 "§Y[73.GetName]§! ve §Y[76.GetName]§!'nin Kuzey ve Doğu sınırları boyunca 3. seviye §YKale§! inşa eder!"
 wuw_HUN_construct_the_szeretfalva_deda_railway_line:0 "Szeretfalva-Déda Demiryolu Hattı"
 wuw_HUN_construct_the_szeretfalva_deda_railway_line_desc:0 "Transilvanya dağlarındaki Árpád Hattını koruyan sınır birliklerimizi daha iyi tedarik etmek için, birliklerimizin halkımızı güvende tutmasını daha iyi sağlamak amacıyla yeni demiryolu hatları ve ikmal merkezleri inşa etmeliyiz."
 wuw_HUN_construct_the_szeretfalva_deda_railway_line_tt:0 "Budapeşte'den Déda'ya 2. seviye bir §YDemiryolu§! hattı inşa eder"
 wuw_HUN_continue_the_regency:0 "Naipliğe Devam Et"
 wuw_HUN_continue_the_regency_desc:0 "Amiral Horthy, 20'li yılların başlarında ülkemizi saran iç savaşlar sırasında yönetimi devraldığından beri, Wall Street çöküşünün ulusumuz üzerindeki etkisine rağmen [HUN.GetNameDef] yeniden yoluna giriyor. Sürekli refah istiyorsak naiplik devam etmelidir."
 wuw_HUN_crack_down_on_radicals:0 "Radikallere Baskı Yap"
 wuw_HUN_crack_down_on_radicals_desc:0 "Ülkede monarşinin restorasyonuna karşı çıkan birçok milis ve siyasi örgüt var. Daha sonra bizim için bir sorun teşkil etmemeleri için nüfuzlarını sınırlamalı ve herhangi bir paramiliter grubu dağıtmalıyız."
 wuw_HUN_cruiser_investments:0 "Kruvazör Yatırımları"
 wuw_HUN_cruiser_investments_desc:0 "En güçlü kuvvet bile düşmanı bulamazsa veya kendini uçaklara karşı koruyamazsa işe yaramaz. Yeni hafif ve ağır kruvazörler tasarlamak, bir gemi koleksiyonunu gerçek bir filoya dönüştürmemize yardımcı olur."
 wuw_HUN_danuvia_submachine_guns:0 "Danuvia Hafif Makineli Tüfekleri"
 wuw_HUN_danuvia_submachine_guns_desc:0 "Piyademizin etkinliğini artırmak için iyi silahlara ihtiyacı var. İlk Danuvia 43M prototipleri testlerde iyi performans gösterdi ve gelişimine fon artırarak yakında silahı seri üretmeye başlayabiliriz."
 wuw_HUN_degauss_ship_hulls:0 "Gemi Gövdelerini Degauss Et"
 wuw_HUN_degauss_ship_hulls_desc:0 "Gemi gövdelerimizi degauss etmeye başlayacağız, bu da manyetik imzalarını azaltacaktır. Bu onları manyetik mayınlardan korur ve gemilerin elektronik profilini azaltır."
 wuw_HUN_demand_austrian_restoration:0 "Avusturya Restorasyonunu Talep Et"
 wuw_HUN_demand_austrian_restoration_desc:0 "Avusturya, ya da o zamanlar bilindiği adıyla Cisleithania, federatif imparatorluğumuzun ayrılmaz bir parçasıydı. Şimdi, uluslarının Habsburg yönetimini bir kez daha sağlamak ve krallıklarımızı tek bir federasyon altında yeniden birleştirmek her zamankinden daha önemli."
 wuw_HUN_demand_burgenland:0 "Burgenland'ı Talep Et"
 wuw_HUN_demand_burgenland_desc:0 "Cesur Rongyos Gárda bir zamanlar, Büyük Savaş'ın sonunda kontrolünü ele geçirmek ve bölge üzerinde [HUN.GetAdjective] yönetimini restore etmek amacıyla Lajtabánság'ı kurdu, ancak sonra bizden koparılıp Avusturya'ya dahil edildi. Gururumuzu bir daha kazanacaksak, bu bölgeyi geri almalıyız."
 wuw_HUN_demand_carpathian_ruthenia:0 "Karpat Rutenya'yı Talep Et"
 wuw_HUN_demand_carpathian_ruthenia_desc:0 "Karpat Rutenya bölgesindeki [ROOT.GetAdjective]ler, 1919'da hain Hutsul Cumhuriyeti'nin bizden bağımsızlığını ilan etmesinden bu yana, çok uzun süredir yabancı rejimler altında baskı yaşamaktadır. Halkımızın iyiliği için bu toprağı geri almalıyız!"
 wuw_HUN_demand_croatian_reintigration:0 "Hırvatistan'ın Yeniden Entegrasyonunu Talep Et"
 wuw_HUN_demand_croatian_reintigration_desc:0 "Yeni ittifaklarımız sayesinde güvenliğimiz ve yolumuz güvence altına alındığına göre, elimizdeki daha önemli meselelere odaklanabiliriz. Şimdi Hırvatistan olanın büyük bir kısmı, Büyük Savaş'ın sonuna kadar Krallığımızın bir parçasıydı ve şimdi, bölge üzerindeki taleplerimizi uygulamalıyız."
 wuw_HUN_demand_southern_slovakia:0 "[664.GetName]'i Talep Et"
 wuw_HUN_demand_southern_slovakia_desc:0 "[664.GetName]'deki etnik [ROOT.GetAdjective] azınlık, şu anda işgalci hükümet tarafından kötü muamele görüyor ve sömürülüyor, bu nedenle, [ROOT.GetAdjective]lerin ve ikamet ettikleri bölgenin bir kez daha kontrolümüz altına alınmasını sağlamalıyız."
 wuw_HUN_demand_szekely_autonomy:0 "Sekel Özerkliği Talep Et"
 wuw_HUN_demand_szekely_autonomy_desc:0 "Transilvanya'da yaşayan Sekeller, herkes kadar Macar kardeşleriyle yeniden birleşmeyi arzuluyorlar ve tabii ki bizim yönetimimiz altında olması koşuluyla, Sekel Ülkesi'nin bağımsızlığını kazanmasını sağlamalıyız."
 wuw_HUN_demand_the_return_of_slovakia:0 "[SLO.GetAdjective] Entegrasyonunu Talep Et"
 wuw_HUN_demand_the_return_of_slovakia_desc:0 "Çok uzun bir süre, [SLO.GetNameDef] Büyük Macaristan'ın bir parçasıydı ve şimdi dünyadaki yerimizi bir kez daha aradığımıza göre, bölge üzerindeki sahipliğimizi ileri sürmeliyiz."
 wuw_HUN_demand_the_vojvodina:0 "Voyvodina'yı Talep Et"
 wuw_HUN_demand_the_vojvodina_desc:0 "Baçka bölgesi uzun zamandır ulusumuzun ayrılmaz bir parçası olmuştur, ancak Büyük Savaş sona erdikten sonra [YUG.GetAdjective] hükümeti tarafından bizden koparılmıştır. Bu tarihi adaletsizliği geri almalı ve bizim olanı geri almalıyız!"
 wuw_HUN_demand_the_vojvodina_tt:0 "§YBatı Banat§!'ı talep etmek için bir Karar açar!"
 wuw_HUN_demand_transylvania:0 "Transilvanya'yı Talep Et"
 wuw_HUN_demand_transylvania_desc:0 "Büyük Savaş'tan sonra kaybettiğimiz topraklarımızı kan dökmeden geri alabilirsek, o kadar iyi. Sekel kardeşlerimizin haksız işgalcilerine, haklı topraklarımızın devrini talep eden bir ültimatom verilecektir."
 wuw_HUN_demand_wiedist_restoration:0 "Wiedist Restorasyonunu Talep Et"
 wuw_HUN_demand_wiedist_restoration_desc:0 "Wied Prensi Wilhelm bir zamanlar Arnavutluk Prensliği'ni Merkezi Güçlerin bir müttefiki olarak yönetti. Ancak Büyük Savaş'ın sonunda haksız yere tahttan indirildi ve yıllar sonra, aşağılık sahtekar Ahmet Zogu Arnavutluk tahtını çaldı. Bu hatayı derhal düzeltmeliyiz!"
 wuw_HUN_denounce_marxism_leninism:0 "Marksizm-Leninizmi Kına"
 wuw_HUN_denounce_marxism_leninism_desc:0 "Aşağılık Iosif Stalin, ideallerimizi çiğnedi ve terimlerimizi çok uzun süredir kendine mal etti. Faşist ve otoriter politikaları bize, devrime bir yalancı ve bir hainden başka bir şey olmadığını kanıtlıyor ve sefil maskaralığına bir son verme zamanı geldi."
 wuw_HUN_devalue_the_pengo:0 "Pengö'yü Yeniden Değerle"
 wuw_HUN_devalue_the_pengo_desc:0 "Pengö şu anda çok kötü bir durumda, tarihteki en kötü hiperenflasyon vakalarından biri. Tamamen popüler olmamalarına rağmen, para birimini yeniden değerlemek ve güçlendirmek için sert önlemler almalıyız."
 wuw_HUN_develop_laszlo_vargas_design:0 "László Varga'nın Tasarımını Geliştir"
 wuw_HUN_develop_laszlo_vargas_design_desc:0 "Büyük havacılık bilimcimiz László Varga, Varga RMI-1 X/H prototipi de dahil olmak üzere askeriyemiz için birçok yerli tasarım ortaya koydu. Gelişimimizin ve ilerlememizin burada durmaması için faaliyetlerini daha fazla finanse etmeliyiz."
 wuw_HUN_develop_the_weiss_wm_21_solyom:0 "Weiss WM-21 Sólyom'u Geliştir"
 wuw_HUN_develop_the_weiss_wm_21_solyom_desc:0 "Uçak geliştirme konusundaki önceki başarısızlıklarımızdan öğrendiklerimizi alıp Weiss WM-21 Sólyom hafif bombardıman uçağını yaratmalıyız. Bu şahin, nerede dururlarsa dursunlar düşmanlarımızı göklerden indirebilecek."
 wuw_HUN_dissolve_the_volksbund:0 "Volksbund'u Feshet"
 wuw_HUN_dissolve_the_volksbund_desc:0 "Volksbund, ulusumuzdaki etnik [GER.GetAdjective]lerin DNSAP ile ilgili bir örgütüdür. [GER.GetNameDef]'den fon alırlar ve ülkemiz içinde kendi işlerini yürütürler. Ulusumuzun istikrarına herhangi bir zarar vermeden önce onları feshetmeliyiz."
 wuw_HUN_doctrinal_studies:0 "Doktrinel Çalışmalar"
 wuw_HUN_doctrinal_studies_desc:0 "Subay değişimlerinden ve müttefiklerimizle yaptığımız strateji oturumlarından ve askeri istihbarat teşkilatımız aracılığıyla çok şey öğrendik. Bu kadar farklı bakış açılarını birleştirmek bizi doktrinel bir atılımın eşiğine getirdi."
 wuw_HUN_economic_intervention:0 "Ekonomik Müdahale"
 wuw_HUN_economic_intervention_desc:0 "Ekonomimizi yönlendirmek için bol miktarda politik kaynak ayırmalıyız. Yeterli olmasına rağmen, onu daha güçlü ve daha verimli hale getirebiliriz."
 wuw_HUN_elect_a_democratic_king:0 "Demokratik Bir Kral Seç"
 wuw_HUN_elect_a_democratic_king_desc:0 "Ulusumuzun demokratik ilkelerini ve halkımızın haklarını koruyacak bir Kral aramalıyız ve bunu yapmak için bakışlarımızı kuzey Avrupa'nın sosyal demokratik anayasal monarşilerine çevirmeli ve tahtımızı teklif edebileceğimiz potansiyel adayları olup olmadığını görmeliyiz."
 wuw_HUN_elect_a_fascist_king:0 "Faşist Bir Kral Seç"
 wuw_HUN_elect_a_fascist_king_desc:0 "Ulusumuzun, gelecek çalkantılı yıllarda onu yönlendirecek güçlü bir lidere ihtiyacı var. Hükümdarımız, halkın örnek alabileceği ve düşmanlarımızın korkabileceği biri olmalıdır."
 wuw_HUN_elections_in_the_revolutionary_council:0 "Devrimci Konseyde Seçimler"
 wuw_HUN_elections_in_the_revolutionary_council_desc:0 "İç savaş bittiğine göre, ülkenin bir cumhuriyete geçişini denetlemek üzere kurulan devrimci konsey içinde seçimler düzenlemek güvenli sayılabilir. Şu anda komünist adayların favori olduğu görülüyor, ancak belki de demokrasi hala bir seçenektir?"
 wuw_HUN_embrace_navy_traditions:0 "Donanma Geleneklerini Benimse"
 wuw_HUN_embrace_navy_traditions_desc:0 "Yeni ve kanıtlanmamış teknolojilerle deney yaparak zaman kaybedemeyiz. Eski İmparatorluk günlerinden denenmiş ve test edilmiş tasarımlara bağlı kalacağız."
 wuw_HUN_empower_the_greenshirts:0 "Yeşil Gömleklileri Güçlendir"
 wuw_HUN_empower_the_greenshirts_desc:0 "Macar Nasyonal Sosyalist Partisi ve takipçileri, Gömbös'e ideolojik farklılıkları olmasına rağmen, sadakatleri Horthy'ye olmadığı için iyi bir müttefiktir. Riskli olsa da, partilerine silah kaçırmak, naibin değiştirilmesinde bize yardımcı olmaları için faydalı olabilir."
 wuw_HUN_enact_agrarian_reform:0 "Tarımsal Reformu Yürürlüğe Koy"
 wuw_HUN_enact_agrarian_reform_desc:0 "Tarım sektörümüzün geliştirilmesi için bolca yer var. Onu modernize etmek ve verimliliğini artırmak, inşaat ve silah üretimi gibi diğer sektörlerde istihdam edilebilecek işgücünü serbest bırakacaktır."
 wuw_HUN_end_the_regency:0 "Naipliği Sona Erdir"
 wuw_HUN_end_the_regency_desc:0 "Horthy, naip olarak iyi bir dönem geçirdi, ancak sonunda [ROOT.GetAdjective] tahtını almaya istekli bir kral aramanın zamanı geldi. İster bir Habsburg olsun, ister Küçük Antant'ın isteklerine daha uygun biri olsun, yeni bir hükümdara ihtiyacımız var."
 wuw_HUN_end_the_white_terror:0 "Beyaz Terör'ü Sona Erdir"
 wuw_HUN_end_the_white_terror_desc:0 "Bu ülkedeki çoğu kişi Beyaz Terör'ün çoktan bittiğini iddia etse de, biz gerçeği biliyoruz... Miklós Horthy ve onun paramiliter haydutları hala daha iyi bir yarın hayal edenleri avlıyor ve eğer zulmümüzün bir gün sona ermesini istiyorsak, onun yönetimine şiddetli bir devrimle son vermeliyiz."
 wuw_HUN_enlarge_the_ganz_danubius_division:0 "Ganz Danubius Bölümünü Genişlet"
 wuw_HUN_enlarge_the_ganz_danubius_division_desc:0 "Budapeşte'de bulunan Ganz Fabrikaları'nın Ganz Danubius Bölümü, sivil ve kahverengi su donanması gemileri inşa eder ve onarır. Görevlerini genişletmeli ve yeni kazanılan kıyı şeridimizde onlar için yeni fabrikalar inşa etmeliyiz."
 wuw_HUN_enlarge_the_ganz_danubius_division_tt:0 "Rastgele kontrol edilen bir §YKıyı Eyaletinde§! §G3§! §YDonanma Tersanesi§! ekle!"
 wuw_HUN_establish_the_mavag_aircraft_factory:0 "MÁVAG Uçak Fabrikasını Kur"
 wuw_HUN_establish_the_mavag_aircraft_factory_desc:0 "István Horthy, uçak üretimine adanmış yeni fabrikalar kurmak için MÁVAG ile işbirliği yapacak ve derhal Magyar Légierő'ye yeni teknoloji teslimatlarına başlayacaktır."
 wuw_HUN_establish_the_mavag_army_division:0 "MÁVAG Ordu Bölümünü Kur"
 wuw_HUN_establish_the_mavag_army_division_desc:0 "Kısaltmalarıyla MÁVAG olarak da bilinen Macar Kraliyet Devlet Demir, Çelik ve Makine Fabrikaları, birçok ayrı görevi yerine getirir ve askeriyemize çok çeşitli teçhizat tedarik eder. Tesislerinin daha fazla genişletilmesini talep etmeliyiz, böylece kundağı motorlu taarruz topları ve uçaksavar tanklarının üretimine yardımcı olmaya başlayabilirler."
 wuw_HUN_establish_the_second_republic:0 "İkinci Cumhuriyeti Kur"
 wuw_HUN_establish_the_second_republic_desc:0 "1918 ile 1920 arasında aralıklarla var olan ilk Macar Cumhuriyeti'nin, komünistler ve milliyetçilerin ortak çabasıyla ezildiği unutulmamalıdır; biri Sovyet Cumhuriyeti'ni kurmak isterken, diğeri krallığı yeniden kuruyordu, ikincisi daha başarılı oldu. Eğer bir daha sonsuza dek bizden alınmasını istemiyorsak, demokrasimizi korumak için şimdi harekete geçmeliyiz!"
 wuw_HUN_establishing_a_new_dynasty:0 "Yeni Bir Hanedan Kurma"
 wuw_HUN_establishing_a_new_dynasty_desc:0 "Habsburgların tahta dönmesine izin verilmediğine göre, krallığımıza yönelik iddialar açısından net bir kazanan yok. Bir seçenek, popüler olmasa da naibimizi kral olarak taçlandırmak veya daha güvenli bir yoldan gidip popüler ve sevilen oğlu István Horthy'yi Macaristan'ın yeni kralı olarak taçlandırmaktır."
 wuw_HUN_establishing_a_new_dynasty_tt:0 "§YMiklós Horthy§! veya oğlu §YIstván Horthy§!'yi §YMacaristan Kralı§! olarak taçlandırma arasında seçim yapabileceğiz!"
 wuw_HUN_establishing_a_royal_guard:0 "Bir Kraliyet Muhafızı Kurma"
 wuw_HUN_establishing_a_royal_guard_desc:0 "Her kralın kişisel muhafızına ihtiyacı olduğu genel bir bilgidir ve Horthy de farklı değildir. Ulusumuzun bir kez daha tahtında bir kral olduğuna göre, bunu yerine getirme zamanı geldi."
 wuw_HUN_expand_on_the_weiss_wm_16:0 "Weiss WM-16 Üzerine Genişle"
 wuw_HUN_expand_on_the_weiss_wm_16_desc:0 "Bombardıman uçağı üretimimiz için yeni bir teknolojik atılıma ulaşma çabasıyla Weiss WM-16 Budapeşte modellerini genişletmeliyiz."
 wuw_HUN_expand_the_aluminum_industry:0 "Alüminyum Sanayini Genişlet"
 wuw_HUN_expand_the_aluminum_industry_desc:0 "Hem ihracat hem de yurt içi kullanım için mevcut tüm kaynaklara ihtiyacımız var. Alüminyum sanayimiz, zaten geniş olmasına rağmen, daha da geliştirilme potansiyeline sahiptir ve kaynakları derhal bu amaca yönlendirmeliyiz."
 wuw_HUN_expand_the_army:0 "Honvédség'i Genişlet"
 wuw_HUN_expand_the_army_desc:0 "Mevcut daimi ordumuz Honvéd, komşularımıza karşı düzgün bir şans yakalamak için çok küçük. Bu nedenle, ordunun boyutunu mümkün olan en hızlı şekilde artırmaya çalışmalıyız."
 wuw_HUN_expand_the_arpad_line:0 "Árpád Hattını Genişlet"
 wuw_HUN_expand_the_arpad_line_available_tt:0 "§Y[73.GetName]§! ve §Y[76.GetName]§!'nin Kuzey ve Doğu sınırları boyunca en az 2 §YKara Kalesi§! inşa edebilir!"
 wuw_HUN_expand_the_arpad_line_can_have_more_tt:0 "Ayrıca, §Y[ROOT.GetNameDef]§! tarafından tamamen kontrol ediliyorsa §Y[84.GetName]§!'nin Güney ve Doğu sınırları boyunca 2. seviye §YKale§! inşa eder!"
 wuw_HUN_expand_the_arpad_line_desc:0 "Árpád Hattı şimdiye kadar etkili olduğu kanıtlandı, ancak saldırı dalgasını gerçekten durdurabileceksek, onu sadece boyut olarak değil, menzil olarak da genişletmeliyiz."
 wuw_HUN_expand_the_arpad_line_southern_expansion_tt:0 "§Y[84.GetName]§!'nin Güney ve Doğu sınırları boyunca 2. seviye §YKale§! inşa eder!"
 wuw_HUN_expand_the_arpad_line_tt:0 "§Y[73.GetName]§! ve §Y[76.GetName]§!'nin Kuzey ve Doğu sınırları boyunca 2. seviye §YKale§! inşa eder!"
 wuw_HUN_expand_the_diosgyor_machinery_factory:0 "Diósgyör Makine Fabrikasını Genişlet"
 wuw_HUN_expand_the_diosgyor_machinery_factory_desc:0 "Diósgyőri Gépgyár, daha fazla sektöre genişletilmeli, bu da diğer birçok şeyin yanı sıra endüstriyel malzeme ve aletlerin, motorların ve motosikletlerin daha hızlı üretilmesini sağlamalıdır."
 wuw_HUN_expand_the_ganz_muvek:0 "Ganz Müvek'i Genişlet"
 wuw_HUN_expand_the_ganz_muvek_desc:0 "Ganz ve Ortakları Demir Fabrikası ve Makine Fabrikası genişletilmeli ve sanayi yeteneklerimizi daha iyi merkezileştirmek ve gelecekte sanayi gelişimine daha iyi fon yönlendirmek için çeşitli küçük sanayileri kendi bünyesine katmalıdır."
 wuw_HUN_expand_the_hungarian_academy_of_sciences:0 "Macar Bilimler Akademisi'ni Genişlet"
 wuw_HUN_expand_the_hungarian_academy_of_sciences_desc:0 "Macar Bilimler Akademisi, [ROOT.GetName]'nin en önemli ve prestijli bilim topluluğudur. Başlıca sorumlulukları bilimi geliştirmek, bilimsel bulguları yaymak, araştırma ve geliştirmeyi desteklemek ve [ROOT.GetAdjective] bilimini yurt içinde ve dünya çapında temsil etmektir."
 wuw_HUN_expand_the_lignite_industry:0 "Linyit Sanayini Genişlet"
 wuw_HUN_expand_the_lignite_industry_desc:0 "Linyit kömürü sanayimiz büyük, ancak hala nispeten az gelişmiştir. Doğal kaynaklarımızın boşa gitmemesi için yeni madenler ve fabrikalar açmalıyız."
 wuw_HUN_extensive_licensing_programs:0 "Kapsamlı Lisanslama Programı"
 wuw_HUN_extensive_licensing_programs_desc:0 "Yabancı hava kuvvetleri, çok yüksek kalitede denenmiş ve kanıtlanmış tasarımlara sahip olduklarını zaten gösterdiler. Kaderi zorlamak ve yeni gelişen havacılık uzmanlığımıza güvenmek yerine, bu yabancı modelleri lisans altında üretmemize izin verilmesini talep etmeliyiz."
 wuw_HUN_forcefully_revitalize_the_industries:0 "Sanayileri Zorla Canlandır"
 wuw_HUN_forcefully_revitalize_the_industries_desc:0 "Ulusal sanayilerimize bir şok başlangıcı yapmalı ve ekonomik buhranımızdan kurtulmaları için onları uyandırmalıyız. Bu, bu arada ekonomimize zarar verebilir, ancak kesinlikle ulusumuzun geleceğine yönelik değerli bir yatırım olacaktır."
 wuw_HUN_form_the_gyorshadtest:0 "Gyorshadtest'i Kur"
 wuw_HUN_form_the_gyorshadtest_desc:0 "Modern ve iyi teçhizatlandırılmış, savaşta düşman taburlarını geride bırakabilecek bir Hızlı Kolordu kurmaya çalışmalıyız. Bu nedenle, biri Tümgeneral Jenö Major, diğeri Tümgeneral Ferenc Bisza komutasında olmak üzere iki Gyorshadtest tümeni oluşturulacaktır."
 wuw_HUN_goulash_communism:0 "Gulaş Komünizmi"
 wuw_HUN_goulash_communism_desc:0 "Kanlı bir iç savaşın ardından kalifiye eleman eksikliği nedeniyle birçok genç yetenek hızla yükseldi. Bunların arasında János Kádár da var ve onunla birlikte, yüksek bir yaşam standardı sağlamayı ve dolayısıyla nüfusu hükümetimiz altında birleştirmeyi amaçlayan bir sistem olan \"Gulaş Komünizmi\" fikrini getirdi. Macaristan'da her vatandaş lezzetli bir kase Gulaş'a sahip olacaktır!"
 wuw_HUN_government_of_national_unity:0 "Ulusal Birlik Hükümeti"
 wuw_HUN_government_of_national_unity_desc:0 "Gömbös, naipliği Horthy'den çalmak için diğerlerinin yanı sıra Ulusal İrade partisini güçlendirdi ve silahlandırdı. Ancak fark edemediği şey, şimdi gerçek gücü elinde tutanların onlar olduğudur ve şimdi, liderleri Ferenc Szálasi'nin iktidara yükselişinin önünde duracak kimse yoktur."
 wuw_HUN_guarantee_religious_liberties:0 "Dini Özgürlükleri Garanti Altına Al"
 wuw_HUN_guarantee_religious_liberties_desc:0 "Katolik olmayanlara yönelik baskıya döndüğünde birçok kişi ülkemizden kaçtı. Bu beyin göçünü tersine çevirmek için bu yasaları değiştirmeli ve laik bir devlete doğru çalışmalıyız. Bu, ülkemizden kaçan birçok parlak zihnin bize geri dönmesini sağlamalıdır."
 wuw_HUN_habsburg_ascension_in_spain:0 "İspanya'da Habsburg Yükselişi"
 wuw_HUN_habsburg_ascension_in_spain_desc:0 "Uzun bir süre, Habsburglar İspanyollar üzerinde hüküm sürdü. İspanya'da monarşiyi restore etmeye çalışmalı ve İspanyolları Habsburg İttifakını genişletmek ve Batı Avrupa'daki rakiplerimizi kuşatmak için kullanmalıyız."
 wuw_HUN_heirs_of_the_huns:0 "Hunların Varisleri"
 wuw_HUN_heirs_of_the_huns_desc:0 "Halkımızın nereden geldiğine dair, Fin-Ugor veya Türk olmak da dahil olmak üzere birçok farklı fikir var. Bunlardan herhangi biri bir dereceye kadar doğru olabilirken, Hunların gerçek varisleri olduğumuz ve bize karşı çıkan herkese yıkım getireceğimiz pekiştirilmelidir."
 wuw_HUN_hold_territorial_referendums:0 "Toprak Referandumları Düzenle"
 wuw_HUN_hold_territorial_referendums_desc:0 "Büyük Savaş'tan sonra, Silezya ve Schleswig'deki bölgelerde olduğu gibi uluslararası gözlemciler tarafından denetlenen demokratik bir süreç olmaksızın, yüksek miktarda Macar'ın bulunduğu birçok bölge bizden koparıldı. Komşularımıza diplomatik olarak yaklaşmalı ve halkın hangi ulusta yaşamak istediğine karar verebilmesi için bu tür referandumların yapılmasını istemeliyiz."
 wuw_HUN_hold_territorial_referendums_tt:0 "Onları bir kez daha geri kazanmaya çalışmak için §YKayıp Topraklarda Referandumlar Düzenlemek§! için kararlar açar"
 wuw_HUN_hold_war_games:0 "Savaş Oyunları Düzenle"
 wuw_HUN_hold_war_games_desc:0 "Küçük ölçekli savaş oyunlarına katılarak, mevcut askeri yapımızdaki kusurları keşfedebilir ve kazanılan deneyimi eksiklikleri gidermek için kullanabiliriz."
 wuw_HUN_honor_the_great_war_veterans:0 "Büyük Savaş Gazilerini Onurlandır"
 wuw_HUN_honor_the_great_war_veterans_desc:0 "Yeni ve parlak komutanlar geleceği ellerinde tutsa da, halkımızın vatanını korumak için bizim için savaşan Büyük Savaş gazilerimize olan borcumuzu unutamayız. Onları madalyalarla süslemeli ve gelecekte daha fazlasının bugün oldukları gibi olmaya istekli olmasını sağlamalıyız."
 wuw_HUN_horthy_admiral_tt:0 "§YMiklós Horthy§!, 3. seviye §YAmiral§! olarak mevcut olur!"
 wuw_HUN_horthy_field_marshal_tt:0 "§YMiklós Horthy§!, 2. seviye §YMareşal§! olarak mevcut olur!"
 wuw_HUN_hungarian_autarky:0 "[ROOT.GetAdjective] Otarkisi"
 wuw_HUN_hungarian_autarky_desc:0 "Yabancı petrol kaynaklarına çok fazla bağımlıyız. Sentetik petrol geliştirme konusundaki Alman çabalarını taklit etmeli ve kendi ayaklarımız üzerinde durabilmemiz için ekonomimizi güçlendirmeliyiz."
 wuw_HUN_hungarian_tradition:0 "[ROOT.GetAdjective] Geleneği"
 wuw_HUN_hungarian_tradition_desc:0 "[ROOT.GetAdjective] geleneği, Panoniyen Bozkırı'nda yapılan tarıma derinden kök salmıştır ve daha da gelişmek için bu gelenekleri korumaya ve verimimizi artırmaya çabalamalıyız."
 wuw_HUN_incorporate_the_hungarian_life_movement:0 "Macar Yaşam Hareketi"
 wuw_HUN_incorporate_the_hungarian_life_movement_desc:0 "Sağcı politikacı Béla Imrédy'yi ve onun Macar Yaşam Hareketi'ni örgütümüze dahil etmeyi hedeflemeli, ona hükümetimizde bir yer vermeliyiz."
 wuw_HUN_increase_economic_cooperation:0 "Ekonomik İşbirliğini Artır"
 wuw_HUN_increase_economic_cooperation_desc:0 "Hükümetimiz artık komşularla ve uluslararası aktörlerle işbirliğine daha açık olduğuna göre, yeni bulunan müttefiklerimizle yeni ticaret anlaşmaları ve ekonomik paktlar yapmaya çalışmalıyız."
 wuw_HUN_initiate_army_maneuvers:0 "Ordu Manevraları Başlat"
 wuw_HUN_initiate_army_maneuvers_desc:0 "Ordumuz, gelecekteki olası silahlı çatışmalar için yeniden şekillendirilmelidir. Yeni taktikler ve stratejiler geliştirmek için onları manevralara göndereceğiz."
 wuw_HUN_instate_a_socialist_economy:0 "Sosyalist Bir Ekonomi Kur"
 wuw_HUN_instate_a_socialist_economy_desc:0 "Toplumumuzu gerçekten daha iyiye doğru değiştirmek için, paranın akış şeklini değiştirmeli ve sadece adam kayırmacılık yoluyla pozisyonlarını elde etmiş şirket başkanlarını görevden almalıyız. Çalışan adam bir kez daha ülkesinde söz sahibi olacak ve tüm [ROOT.GetAdjective]ler eşit olacak!"
 wuw_HUN_institute_corporatism:0 "Korporatizmi Kur"
 wuw_HUN_institute_corporatism_desc:0 "Büyük Savaş ve Trianon Antlaşması'nın getirdiği yıkım ve aşağılanmalardan sonra ülkemizi düzgün bir şekilde yeniden ayağa kaldırmak için, Mussolini'nin ekonomik modelini benimsemeli ve çok sayıda korporatist reformu kucaklamalıyız."
 wuw_HUN_integrate_bohemian_and_austrian_industries:0 "Bohemya ve Avusturya Sanayilerini Entegre Et"
 wuw_HUN_integrate_bohemian_and_austrian_industries_desc:0 "İmparatorluğumuzun diğer kurucu devletlerinin kendi güçlü sanayileri var. Bir kez daha katıldıklarına göre, bunları kendimize entegre etmek akıllıca olacaktır."
 wuw_HUN_integrate_the_volksbund:0 "Volksbund'u Entegre Et"
 wuw_HUN_integrate_the_volksbund_desc:0 "Horthy'yi devirmek için çok adama ihtiyacımız olurdu. Böyle adamları, ne kadar önemsiz olurlarsa olsunlar, nasyonal-sosyalist hareket olan Volksbund der Deutschen in Ungarn'da bulabiliriz. Onları kendi tarafımıza çekersek, onları sadece ele geçirmemiz için değil, aynı zamanda daha sonra bir paramiliter güç olarak da kullanabiliriz."
 wuw_HUN_intervene_in_czechoslovakia:0 "[CZE.GetNameDef]'e Müdahale Et"
 wuw_HUN_intervene_in_czechoslovakia_desc:0 "Çekoslovaklara, Trianon Antlaşması'nda bizden alınan bazı topraklar verildi. Aynı zamanda, Almanların onların toprakları üzerindeki tasarımlarını biliyoruz. Belki bir takas ayarlayabiliriz; Alman saldırganlığı durumunda Sovyet askeri desteği garantisi karşılığında haklı topraklarımız."
 wuw_HUN_invest_in_destroyer_models:0 "Muhrip Modellerine Yatırım Yap"
 wuw_HUN_invest_in_destroyer_models_desc:0 "Muhripler, filonun hayati, ancak genellikle göz ardı edilen bir parçasıdır. Düşük maliyetle birlikte, herhangi bir donanma genişletme programı için iyi bir başlangıçtır."
 wuw_HUN_invest_in_ludovica_academy:0 "Ludovica Akademisi'ne Yatırım Yap"
 wuw_HUN_invest_in_ludovica_academy_desc:0 "Kraliyet Macar Ludovica Savunma Akademisi, subay adaylarımızın eğitim enstitüsüdür. Generallerimizin hepsinin daha iyi eğitim alabilmesi için genişletilmelidir."
 wuw_HUN_invest_in_the_special_forces:0 "Özel Kuvvetlere Yatırım Yap"
 wuw_HUN_invest_in_the_special_forces_desc:0 "Ordumuz artık düzgün bir mücadele vermek için gereken adamlara sahip, ancak yeni askerlerimizi mümkün olduğunca güçlü olacak şekilde eğitmek, yeni özel kuvvetler programlarına yatırım yapmak bizim için büyük fayda sağlayacaktır."
 wuw_HUN_invest_in_universal_education:0 "Evrensel Eğitime Yatırım Yap"
 wuw_HUN_invest_in_universal_education_desc:0 "Bu ülkeyi yönetenler halktır ve onlar kendi çıkarlarını bilecek şekilde eğitilmezlerse, kesinlikle onu yıkıma götüreceklerdir. Bu nedenle, her [ROOT.GetAdjective] erkeğinin eğitimli olabilmesi ve oyunu kullanırken en iyisinin ne olduğuna karar verebilmesi için herkes için evrensel ve ücretsiz eğitime yatırım yapmalıyız."
 wuw_HUN_invite_foreign_investors:0 "Yabancı Yatırımcıları Davet Et"
 wuw_HUN_invite_foreign_investors_desc:0 "[ROOT.GetNameDefCap], Doğu Avrupa'nın kalbinde yer alıyor ve altyapımızı ve sanayimizi iyileştirmeye ilgi duyan yabancı yatırımcıları çekmek için merkezi konumumuzu pekala kullanabiliriz."
 wuw_HUN_invite_german_investors:0 "[GER.GetAdjective] Yatırımcıları Davet Et"
 wuw_HUN_invite_german_investors_desc:0 "Önceki ticaret anlaşmalarımızda zaten belirtildiği gibi, şu anda ülkemizde sadece [GER.GetAdjective]ler ve [ROOT.GetAdjective]ler arama yapma iznine sahiptir. Bu nedenle, en azından bu durumdan yararlanmak ve yatırımcıları ülkemize davet etmek akıllıca olacaktır."
 wuw_HUN_invite_otto_to_the_throne:0 "Otto'yu Tahta Davet Et"
 wuw_HUN_invite_otto_to_the_throne_desc:0 "Habsburglar uzun süre Macaristan'ı yönetti ve onların yönetimi altında ülke, Avrupa'nın en büyük imparatorluklarından birinin parçasıydı. Avusturya-Macaristan'ı restore etme niyetinde olan bir Habsburg'u yeniden dümene getirmek, bizi kesinlikle bir kez daha büyüklüğe götürecektir. Tüm İmparatorluğun meşru varisi olarak, Avusturya-Macaristan'ın restorasyonunun anahtarı olacaktır."
 wuw_HUN_join_the_allies:0 "Müttefiklere Katıl"
 wuw_HUN_join_the_allies_desc:0 "Macaristan'ın ve demokratik değerlerinin geleceği, büyük Batı demokrasileri ve onların ittifakıyla yatmaktadır. Bu ittifakın bir üyesi olarak, gücümüzü onlarınkine katabilir ve kendimiz de onların desteğine güvenebiliriz."
 wuw_HUN_join_the_axis:0 "Mihver'e Katıl"
 wuw_HUN_join_the_axis_desc:0 "Ekonomimiz zaten Almanlara bu kadar bağımlı olduğuna göre, onları savaşta takip etmemiz sadece mantıklıdır. Mihver ittifakına resmi giriş için onlara bir talep göndereceğiz."
 wuw_HUN_join_the_comintern:0 "Komintern'e Katıl"
 wuw_HUN_join_the_comintern_desc:0 "Devrim için ileriye giden yol Komintern ile yatmaktadır. Yoldaşlarımızla birlikte durarak, kapitalist adaletsizliği ve Batı'da beliren faşist tehdidi süpüreceğiz."
 wuw_HUN_joint_air_development:0 "Ortak Hava Geliştirme"
 wuw_HUN_joint_air_development_desc:0 "Yeni uçak modelleri geliştirmenin en iyi yolu müttefiklerimizle işbirliği yapmaktır. Tüm uluslarımızın en parlak zihinlerini bir araya getirerek en iyi sonuçları elde edeceğiz."
 wuw_HUN_joint_aluminum_mining_company:0 "Ortak Alüminyum Madencilik Şirketi"
 wuw_HUN_joint_aluminum_mining_company_desc:0 "Alüminyum, modern savaş endüstrisinin ayrılmaz bir parçası olduğundan, ülkemizin kuzeyindeki madenleri genişletmek için kolayca [GER.GetAdjective] desteği alabiliriz."
 wuw_HUN_joint_hungarian_soviet_research_effort:0 "Ortak Sovyet-Macar Araştırma Çabası"
 wuw_HUN_joint_hungarian_soviet_research_effort_desc:0 "Kendi ulusal bilimler akademimizi güçlendirmek için, Sovyet düşünürlerini ve mühendislerini davet etmeli ve ulusumuzun kullanabileceği yeni düşünce ve teknolojilerin geliştirilmesinde onların yardımını kullanmalıyız."
 wuw_HUN_joint_oil_exploitation_company:0 "Ortak Petrol İşletme Şirketi"
 wuw_HUN_joint_oil_exploitation_company_desc:0 "Bölgemizdeki olası petrol sahaları beklentisiyle yabancıların dikkatini çektik. Dost güçler, teknik bilgileriyle petrol sanayimizi desteklemeye hevesliler ve bu, onların ilerlemelerinden öğrenmek için kazançlı bir fırsat olacaktır."
 wuw_HUN_kadars_hussars:0 "Kádár'ın Hüssarları"
 wuw_HUN_kadars_hussars_desc:0 "Pufajkás'larımız, Devrimci Güç Alaylarımız, Kızıl Ordumuzun askeri polis birimleridir, Savaş Bakanlığı tarafından kurulmuştur ve ana hedefleri muhalif faaliyetlerin bastırılmasıdır. Halkımızın ve devletlerinin tam güvenliğini sağlamak için bu birimlere daha fazla yatırım yapmalıyız."
 wuw_HUN_legacy_of_the_black_legion:0 "Kara Ordu'nun Mirası"
 wuw_HUN_legacy_of_the_black_legion_desc:0 "Süvarilerimizin ve askeri polisimizin daha iyi işlemesi için, onları efsanevi kralımız Matthias Corvinus'un, Roma generali ve imparatoru Julius Caesar'ın lejyonlarından esinlenen Kara Ordusu'ndan sonra modellemeliyiz."
 wuw_HUN_license_fiat_tankettes:0 "Fiat Tanketleri"
 wuw_HUN_license_fiat_tankettes_desc:0 "Askeri sanayimizi güçlendirmek ve keşif taburlarımızı genişletmek için, yeni mekanize gruplarımız için hafif tanklar ve tanketler üretmek üzere [ITA.GetAdjective] araç şirketi Fiat ile işbirliği yapmak akıllıca olacaktır."
 wuw_HUN_light_infantry_divisions_doctrine:0 "Hafif Piyade Tümenleri Doktrini"
 wuw_HUN_light_infantry_divisions_doctrine_desc:0 "Elimizdeki sınırlı insan gücüyle idare etmeliyiz. Daha fazla tümen istiyorsak, zorunlu olarak daha küçük olmaları gerekir. Hafif piyade tümenleri, vuruş gücü ve boyutun optimal bir karışımını sağlar ve bunu askeriyemizin bel kemiği yapacağız."
 wuw_HUN_magyar_allamvasutak:0 "Magyar Államvasutak"
 wuw_HUN_magyar_allamvasutak_desc:0 "Devlet Demiryolu Şirketimiz MÁV, ülkedeki her treni işletebilmeleri için görevleri genişletilmelidir. Bunu yapmak, hatlarımız üzerinde daha fazla kontrol sahibi olmamızı ve demiryolu ağımızın daha verimli kullanılmasını sağlayacaktır."
 wuw_HUN_magyar_cserkeszszovetseg:0 "Magyar Cserkészszövetség"
 wuw_HUN_magyar_cserkeszszovetseg_desc:0 "1912'de kurulan Macar İzci Derneği, birçok yetenekli genç [ROOT.GetAdjective]'i kendilerine bakma ve paramiliter operasyonlarda yardımcı olma konusunda eğitti. Onları resmen kraliyet muhafızlarımıza entegre etme ve organizasyonların liderlerine aristokrat unvanlar verme zamanı geldi."
 wuw_HUN_magyar_cserkeszszovetseg_tt:0 "§YKraliyet Muhafızı§! etkenini şu şekilde değiştir: \nAskere Alınabilir Nüfus Faktörü §G+%10§! \nİdeoloji Eğilimi Savunması §G+%15§! \n§Y$category_support_battalions$:§! Organizasyon: §G+10§!, HP: §G+5§!"
 wuw_HUN_magyar_kiralyi_csendorseg:0 "Magyar Királyi Csendörség"
 wuw_HUN_magyar_kiralyi_csendorseg_desc:0 "[ROOT.GetAdjective] Jandarmasını genişletmeye çalışmalı, onlara daha fazla özerklik tanımalı ve isyanları bastırırken ve düşman avcılarıyla savaşırken nasıl hareket edeceklerini seçme konusunda daha fazla özgürlük vermeliyiz."
 wuw_HUN_make_the_magyar_legiero_known:0 "Magyar Légierö'yü Tanıt"
 wuw_HUN_make_the_magyar_legiero_known_desc:0 "Magyar Légierő, askeriyemizin hava kuvvetleri koludur. Askeri uçaklara sahip olmamız yasaklanmıştı. Ancak, sivil uçuş kulüpleri kisvesi altında yavaş yavaş gizli bir hava kolu kuruldu. Şimdi yeni antlaşmalar yürürlükte olduğuna göre, varlığını dünyaya duyurabiliriz."
 wuw_HUN_manred_weiss_steel_and_metal_works:0 "Manfréd Weiss Çelik ve Metal İşleri"
 wuw_HUN_manred_weiss_steel_and_metal_works_desc:0 "Genellikle Csepel Művek olarak anılan Manfréd Weiss Çelik ve Metal İşleri, çok fazla potansiyel göstermektedir ve ulusumuzun daha da gelişmesini desteklemek için mümkün olduğunca kapsamlı bir şekilde genişletilmelidir."
 wuw_HUN_march_south:0 "Güneye Yürü"
 wuw_HUN_march_south_desc:0 "Sadece kuzeyde, doğuda ve batıda toprak kaybetmekle kalmadık, aynı zamanda güneyde de, büyük ölçüde Yugoslavya'nın yaratılmasından kaynaklanan toprak kayıpları yaşadık. Voyvodina ve Banat'taki halkımıza dayatılan adaletsizlikleri, er ya da geç düzeltmeliyiz."
 wuw_HUN_nationalize_key_industries:0 "Kilit Sanayileri Millileştir"
 wuw_HUN_nationalize_key_industries_desc:0 "Ekonominin sosyalleştirilmesine yönelik girişimimize rağmen, ülkemizde hala yabancı şirketler ve işadamları tarafından yönetilen birçok fabrika ve işletme bulunmaktadır. Sosyalizme doğru bir sonraki adım, dolayısıyla yabancı varlıkların millileştirilmesi olacaktır."
 wuw_HUN_negotiate_the_restrictions:0 "Kısıtlamaları Müzakere Et"
 wuw_HUN_negotiate_the_restrictions_desc:0 "Küçük ölçekli gizli yeniden silahlanma yeterli olmayacaktır. Komşularımıza ulaşmalı ve Büyük Savaş'tan sonra bize dayatılan antlaşmanın düzeltilmesini talep etmeliyiz. Macaristan'ın silahlanma konusunda eşit hakkı vardır."
 wuw_HUN_nimrod_aa_tt:0 "\n§Y$improved_medium_tank_chassis$§! teknolojisi araştırıldığında:\n"
 wuw_HUN_officialize_the_rakosi_battalion:0 "Rákosi Taburunu Resmileştir"
 wuw_HUN_officialize_the_rakosi_battalion_desc:0 "Cesur [ROOT.GetAdjective] adamları, yurtdışında bile her zaman daha iyi bir yarın için çabalıyorlar. bu yüzden bu gibi adamları resmi olarak desteklemek ve ihtiyacı olanlara devrimi getirmek için çaba göstermeliyiz."
 wuw_HUN_on_a_high_horse:0 "Yüksekten Bakmak"
 wuw_HUN_on_a_high_horse_desc:0 "[ROOT.GetAdjective] halkı, son gelişmelerin bize kanıtladığı gibi, gerçekten de bu dünyanın efendileridir. Güneşte hak ettiğimiz yeri alma ve dünyayı hegemonize ederken zafer ışınlarında yıkanma zamanı geldi! Apostolik Krallık, Tanrı'nın çocukları üzerinde hüküm sürecektir."
 wuw_HUN_our_ancestral_lands:0 "Atalarımızın Toprakları"
 wuw_HUN_our_ancestral_lands_desc:0 "Sadece antik Fin-Ugor topraklarına değil, aynı zamanda iddia ettiğimiz Turan mirasımız sayesinde eski Türk topraklarına olan taleplerimizi pekiştirerek, eski topraklarımızın hepsini talep edebilir ve haklı olarak bizim olanı geri alabiliriz."
 wuw_HUN_outlaw_the_party_of_national_will:0 "Ulusal İrade Partisi'ni Yasadışı İlan Et"
 wuw_HUN_outlaw_the_party_of_national_will_desc:0 "Ferenc Szálasi liderliğindeki ulusal sosyalist Ulusal İrade Partisi, [GER.GetAdjective] Nazileri ile daha popüler oldukları ve mevcut liderimizin neredeyse mutlak yönetimini sevmedikleri için mevcut yönetimimiz için bir tehdittir."
 wuw_HUN_parade_istvan_bethlens_platform:0 "István Bethlen'in Yeni Muhalefeti"
 wuw_HUN_parade_istvan_bethlens_platform_desc:0 "Mevcut durumdan memnun olmayan ve Başbakan Gyula Gömbös'ün benimsediği artan otoriter söylemden giderek daha fazla endişe duyan eski Başbakan István Bethlen, yeni bir Muhalefet oluşturdu. Amiral'i ve onun faşist uşaklarını daha da zayıflatmak için bu fırsatı kullanmalıyız."
 wuw_HUN_pass_statute_xix:0 "XIX. Tüzüğü Geçir"
 wuw_HUN_pass_statute_xix_desc:0 "[ROOT.GetLeader]'in rahatsız olduğu göz önüne alındığında, Naip koltuğu boşaldığında bir Ulusal Konsey kurulmasına ilişkin XIX. Tüzüğü geçirmek faydalı olacaktır, bu da mevcut olanımız vefat ettiğinde yeni bir naip seçecek bir Országtanács oluşturmamıza olanak tanır. Bazıları bunu hanedan kurma girişimi olarak görebilir, ama biz bununla iyiyiz."
 wuw_HUN_politicize_the_levente_associations:0 "Levente Derneklerini Siyasallaştır"
 wuw_HUN_politicize_the_levente_associations_desc:0 "Paramiliter Levente gençlik dernekleri, [ROOT.GetAdjective] gençliğini organize etmeye ve ulusumuza kaçınılmaz olarak geldiğinde çatışmayla başa çıkmaları için onları eğitmeye yardımcı olur. Bu gruplara sızmaya çalışmalı ve üyelerinin kime sadık olmaları gerektiğini bilmelerini sağlamalıyız."
 wuw_HUN_politicize_the_levente_associations_tt:0 "§Y[ROOT.GetAdjective] İç Savaşı§! başladığında, §YLevente Dernekleri§! bizim tarafımıza sadık kalacak ve ek olarak §G+8000§! İnsan Gücü kazanacağız"
 wuw_HUN_press_maximilians_and_the_iturbides_claims:0 "Maximilian ve Iturbide'nin Taleplerini İleri Sür"
 wuw_HUN_press_maximilians_and_the_iturbides_claims_desc:0 "Meksika ilk olarak Iturbide Hanedanı altında bir imparatorluk ilan edildi ve daha sonra, haksız yere idam edilene kadar ikinci imparatorluk sırasında Maximilian von Habsburg tarafından yönetildi. İmparatorluk tahtının mevcut varisi, bir zamanlar onun tarafından evlat edinilen María Josepha Sophia de Iturbide'dir ve tacını bir kez daha geri alabilmesini sağlayacağız!"
 wuw_HUN_pressure_romania:0 "[ROM.GetNameDef] Üzerinde Baskı Kur"
 wuw_HUN_pressure_romania_desc:0 "Batı'daki Faşist tehlikeye odaklanırken, arkamızda potansiyel bir tehdidin var olmasına izin veremeyiz, özellikle de bizimle Doğudaki müttefiklerimiz arasında yer alıyorsa. Romanya, bir yoldaş komünist devlet olarak güvence altına alınmalı veya müttefiklerimizin desteğini alabilmemizi sağlamak için önemli kara yolları bize devredilmelidir."
 wuw_HUN_proclaim_greater_hungary:0 "Büyük Macaristan'ı İlan Et"
 wuw_HUN_proclaim_greater_hungary_core_states_requirement:0 "Tüm başlangıç Macar eyaletleri tamamen kontrol altında"
 wuw_HUN_proclaim_greater_hungary_desc:0 "Borçlu olduğumuz toprağı geri kazandıktan sonra, ülkemizin büyüklüğü tarihi sınırlarımıza ulaştı. Şimdi tam bir güvenle Büyük Macaristan'ın kuruluşunu dünyaya ilan edebilir ve gözlerimizi yeni hedeflere dikebiliriz."
 wuw_HUN_promote_entrepreneurship:0 "Girişimciliği Teşvik Et"
 wuw_HUN_promote_entrepreneurship_desc:0 "Büyüyen ve sürekli gelişen bir toplumun ihtiyaç duyduğu en önemli şeylerden biri, yaşadıkları ulusu iyileştirmek için risk almaya hazır ve istekli olan ve sermayeyi toprağa geri yatıracak olan girişimcilerdir. Evimizi olabildiğince müreffeh hale getirmek için bu tür davranışları teşvik etmeliyiz."
 wuw_HUN_promote_hungarianism:0 "Macarcılığı Teşvik Et"
 wuw_HUN_promote_hungarianism_desc:0 "Geçmişteki şanımızı bir kez daha geri kazanmak için, ne kadar radikal olurlarsa olsunlar, bundan başka bir şey istemeyenleri desteklemeliyiz. Bu nedenle, Katolik piskopos Ottokár Prohászka'nın öğretileri ve ne pahasına olursa olsun Macar çıkarları için ayağa kalkma fikri temelinde geliştirilen, ortaya çıkan Macarcılık fikirlerini teşvik etmeliyiz."
 wuw_HUN_promote_increased_urbanization:0 "Artan Şehirleşmeyi Teşvik Et"
 wuw_HUN_promote_increased_urbanization_desc:0 "Giderek daha fazla insan, yeni fabrikalarda iş aramak için köyleri ve daha küçük kasabaları terk edip büyük şehir merkezlerine taşınıyor. Onlara hemen istihdam sunamasak bile, daha sonraki bir genişlemeye zemin hazırlamak için yeni şehir mahalleleri inşa edebiliriz."
 wuw_HUN_promote_revanchist_sentiment:0 "Rövanşist Duyguları Teşvik Et"
 wuw_HUN_promote_revanchist_sentiment_desc:0 "Trianon antlaşması olarak bilinen iğrençlik, nüfusumuzun yarısından fazlasını bizden kopardı ve binlerce [ROOT.GetAdjective]'i evsiz ve yerinden edilmiş bıraktı. Bu büyük tarihi adaletsizliği bir kez ve herkes için geri almalı ve halkımıza büyük bir rövanşizm duygusu aşılamalıyız."
 wuw_HUN_protect_austria:0 "[AUS.GetNameDef]'i Koru"
 wuw_HUN_protect_austria_desc:0 "[GER.GetNameDef]'e karşı daha fazla durmak için, onların [AUS.GetNameDef] ile birleşme konusundaki açık hırslarına direnmeliyiz. Onlara bir garanti verebiliriz, bu da mevcut hükümete, Burgenland'ı bize geri vermeleri koşuluyla, [GER.GetAdjective] yanlısı unsurlara karşı durmaları için umarım ihtiyaç duydukları siyasi gücü verir."
 wuw_HUN_protect_czechoslovakia:0 "Çekoslovakya'yı Koru"
 wuw_HUN_protect_czechoslovakia_desc:0 "[CZE.GetNameDefCap], bağımsızlığından bu yana güçlü ve sanayileşmiş bir hale geldi, ancak toprakları komşuları tarafından açgözlülükle izleniyor. Onlara bu tehditlere karşı korumamızı sunacağız, ya onları bir kez daha İmparatorluğumuzun ayrılmaz bir parçası olarak karşılayarak ya da onlara ortaklık statüsü vererek."
 wuw_HUN_purchase_burgenland:0 "Burgenland'ı Satın Al"
 wuw_HUN_purchase_burgenland_desc:0 "[AUS.GetAdjective]lerin Burgenland olarak bildiği bölgeler, yüzyıllardır [ROOT.GetAdjective] krallığının bir parçası olmuş, ancak Trianon Antlaşması ile bizden çalınmıştır. Onların hükümetine bir teklifle yaklaşmalı, ekonomileri şu anda darmadağın olduğu için bölge karşılığında onlara büyük bir toplu para ödemeyi teklif etmeliyiz."
 wuw_HUN_quantity_over_quality:0 "Nitelik Nicelikten Üstündür"
 wuw_HUN_quantity_over_quality_desc:0 "Ordumuz o kadar büyük olmasa da, hala güçlü olabilir ve bunu telafi edebilir. Bunu yapmanın yolu, düşmanlarımıza karşı teknolojik üstünlüğümüzü geliştirmek ve kendilerinden çok daha fazla sayıda olan düşman birimlerini yenebilecek son teknoloji birimleri kullanmaktır."
 wuw_HUN_reach_out_to_candidates:0 "Adaylara Ulaş"
 wuw_HUN_reach_out_to_candidates_desc:0 "Taht için potansiyel adayları bulmakla görevli bir komite kurmalıyız. En bariz adaylar, Habsburg krallığının mevcut varisi Otto ve son kralımız, aynı zamanda bir Habsburg olan Joseph August'tur. Ancak Küçük Antant, Habsburg soyundan bir krala sahip olmamızı yasakladı, bu yüzden başka olasılıklara bakmamız gerekebilir."
 wuw_HUN_reaffirm_territorial_claims:0 "Toprak Taleplerini Yeniden Onayla"
 wuw_HUN_reaffirm_territorial_claims_desc:0 "Trianon Antlaşması'nın reddedilmesiyle, şimdi bizden çalınan topraklara olan taleplerimizi yeniden onaylamaya devam etmeliyiz."
 wuw_HUN_reaffirm_territorial_claims_tt:0 "§YEski Macar Topraklarını Yeniden Entegre Etmek§! için Kararlar açar!"
 wuw_HUN_reclaim_the_holy_city:0 "Kutsal Şehri Geri Al"
 wuw_HUN_reclaim_the_holy_city_desc:0 "Kudüs Krallığı, 1291'de Mısır Memlükleri tarafından fethi üzerine kaldırıldı, ancak İmparatorumuz hala Lorraine Hanedanı'ndan I. Leopold aracılığıyla Kudüs Kralı unvanını taşıyor. Katolik inancının koruyucuları olarak bizim, kutsal şehir Kudüs'ü geri alma ve Haçlıların yapamadığını yapma zamanımız geldi."
 wuw_HUN_reclaim_the_pannonian_steppe:0 "Panoniyen Bozkırını Geri Al"
 wuw_HUN_reclaim_the_pannonian_steppe_desc:0 "Uzun zaman önce Macar halkı buraya, Panoniyen Havzası'na geldi ve onu kendilerinin olarak talep ederek Macar Kabileleri Konsolidasyonu'nu kurdu. Şimdi, yabancı işgalciler atalarımızın bu topraklarını, atalarımızın haklarını açıkça ihlal ederek işgal ediyor. Hızlı bir şekilde saldırmalı ve Panonya'yı düşmanlarımızdan geri almalıyız."
 wuw_HUN_reclaim_the_slovak_possessions:0 "Slovak Mülklerini Geri Al"
 wuw_HUN_reclaim_the_slovak_possessions_desc:0 "Slovakya uzun zamandır ulusumuzun bir parçası olmuştur ve Trianon Antlaşması'nı takip eden savaşlarda bizimle düzgün bir şekilde yeniden birleşmeye çok yakındı. Bölgeye ayaklarımızı geri basmalı ve bir kez daha kendimiz için talep etmeliyiz!"
 wuw_HUN_reclaim_the_slovak_possessions_tt:0 "Slovakya içinde yer alan §YEski Macar Topraklarını Yeniden Entegre Etmek§! için kararlar açar"
 wuw_HUN_reclaim_transylvania:0 "Transilvanya'yı Geri Al"
 wuw_HUN_reclaim_transylvania_desc:0 "Büyük Savaş'ın sonunda, [ROM.GetAdjective]ler yüzyıllardır bizim tarafımızdan yönetilen Transilvanya'yı işgal etti. O zamandan bu yana çok uzun zaman geçmedi ve halkımız bunu çok iyi hatırlıyor. Bu toprakları kendimiz için geri almanın zamanı geldi."
 wuw_HUN_reenlist_the_sich_riflemen:0 "Ukrayna Sich Nişancılarını Yeniden Askere Al"
 wuw_HUN_reenlist_the_sich_riflemen_desc:0 "Ukrayna Sich Nişancıları, Büyük Savaş sırasında bizim için savaştı ve ardından Rus iç savaşı sırasında özgür bir Ukrayna devleti için savaşmaya devam etti. Bu askeri birimi, eski ve popüler komutanlarından biri olan, Avusturya Arşidükü Wilhelm Franz, yani onlara bilinen adıyla Vasyl Vyshyvanyi komutasında yeniden oluşturmalıyız."
 wuw_HUN_reestablish_the_rongyos_garda:0 "Rongyos Gárda'yı Yeniden Kur"
 wuw_HUN_reestablish_the_rongyos_garda_desc:0 "Paramiliter Pejmürde Muhafızlar ilk olarak 1921'de Trianon Antlaşması'na karşı savaşmak için kuruldu, Lajtabánság'da Avusturyalılara karşı savaşmamıza ve iç savaşlar sırasında Horthy'nin Ulusal Ordusu'nun yanında savaşmamıza yardımcı oldu. Kaptanları Pál Prónay şimdi bize bir kez daha yardım etmeye hazır ve bu nedenle böyle bir grubun yeniden kurulmasından fayda sağlayacağız."
 wuw_HUN_reinstate_the_lenin_boys:0 "Lenin Çocuklarını Yeniden Göreve Al"
 wuw_HUN_reinstate_the_lenin_boys_desc:0 "Lenin Çocukları, 1919'da Sovyet Cumhuriyeti'nde faaliyet gösteren Komünist Parti'nin paramiliter gücüydü ve ülke içindeki karşı-devrimci muhalifleri kökünden söküp bastırmak için kullanıldı. Bu paramiliter örgütü geri getirmeli ve silahlı kuvvetlerimize dahil etmeliyiz."
 wuw_HUN_reinstate_the_navy:0 "Haditengerészet'i Yeniden Kur"
 wuw_HUN_reinstate_the_navy_desc:0 "Bir kıyı şeridini geri kazandıktan sonra, çabalarımızı büyük bir güce yakışır bir filo yeniden inşa etmeye odaklamalıyız."
 wuw_HUN_reinstate_the_pragmatic_sanction:0 "1713 Pragmatik Yaptırımını Yeniden Yürürlüğe Koy"
 wuw_HUN_reinstate_the_pragmatic_sanction_desc:0 "1713 Pragmatik Yaptırımı, Kutsal Roma İmparatoru VI. Karl tarafından, Habsburg monarşisinin bir kız evlat tarafından bölünmeden miras alınabilmesini sağlamak için çıkarıldı, esasen ulusumuzu gelecek için Habsburg toprağı olarak kabul etti. IV. Karl'ın başarısız darbe girişiminden sonra bu iptal edildi. Böyle bir yönetimi restore etmek için, Küçük Antant'ın iradesine karşı, onu yeniden yürürlüğe koymaya çalışmalıyız."
 wuw_HUN_reinstate_the_pragmatic_sanction_tt:0 "§YKüçük Antant§! üyeleri bize §YAmbargo§! uygulama seçeneğine sahip olacak"
 wuw_HUN_reintigrate_slovakia:0 "Slovakya'yı Yeniden Entegre Et"
 wuw_HUN_reintigrate_slovakia_desc:0 "Yüzyıllar boyunca, Slovakya [ROOT.GetAdjective] krallığının ayrılmaz bir parçasıydı ve aşağılık, acınası Trianon antlaşmasıyla bu topraklar bizden koparıldı. Kuzey bölgelerimizi dahil etme ve onları yeniden katlama zamanı geldi."
 wuw_HUN_reintigrate_the_imperial_railroads:0 "İmparatorluk Demiryollarını Yeniden Entegre Et"
 wuw_HUN_reintigrate_the_imperial_railroads_desc:0 "Eski Avusturya-Macaristan imparatorluğunu kapsayan demiryolu ağları, bağımsız uluslarda dağılmasından bu yana parçalanmıştır. Diğer eski kurucu devletlere yaklaşmalı ve altyapıyı genel olarak iyileştirmek için demiryolu ağlarımızın yeniden entegrasyonunu önermeliyiz."
 wuw_HUN_renew_the_rome_protocols:0 "Roma Protokollerini Yenile"
 wuw_HUN_renew_the_rome_protocols_desc:0 "[GER.GetNameDef]'in devam eden revizyonizmi ışığında, 1934'te hazırlanan ve imzalanan Roma Protokollerini yenilemeliyiz. Anlaşmalar sadece [GER.GetAdjective] ve [YUG.GetAdjective] tehditlerini daha da izole etmeye hizmet etmekle kalmayacak, aynı zamanda gerçek bir ittifakın olası bir habercisi olarak da hizmet edecektir."
 wuw_HUN_renew_the_rome_protocols_interventionalism_tt:0 "§YMüdahalecilik§! fikrinden gelen politik güç cezasını kaldıracak!"
 wuw_HUN_renew_the_shipping_industry:0 "Gemicilik Sanayini Yenile"
 wuw_HUN_renew_the_shipping_industry_desc:0 "Gözlerimizi sınırlarımızın restorasyonuna sıkıca dikmişken, geçmişteki zaferlerimize rakip olacak bir Akdeniz filosu geliştirme görevine başlamalıyız."
 wuw_HUN_renew_the_shipping_industry_tt:0 "Rastgele kontrol edilen bir §YKıyı Eyaletinde§! §G3§! §YDonanma Tersanesi§! ekle!"
 wuw_HUN_renounce_the_treaty_of_trianon:0 "Trianon Antlaşmasını Feshet"
 wuw_HUN_renounce_the_treaty_of_trianon_desc:0 "Büyük Savaş'ın sonunda ulusumuza dayatılan, bir zamanların büyük ulusumuzun topraklarının ve nüfusunun üçte ikisini koparan adaletsizlik, Versay Antlaşması'nda Almanya'ya yapılan utançla boy ölçüşür ve geri alınmalıdır."
 wuw_HUN_renovato_imperii:0 "Renovatio Imperii"
 wuw_HUN_renovato_imperii_desc:0 "Renovatio imperii Romanorum, \"Romalı imparatorluğunun yenilenmesi\", Roma İmparatorluğu'nu yeniden kurma veya canlandırma niyetini beyan eden bir formüldü ve icat edildiğinden beri birçok kez kullanıldı. Biz de aynısını yapmalı ve Avusturya-Macaristan İmparatorluğunu yeniden kurma ve onu büyüklüğe ulaştırma niyetimizi resmi olarak duyurmalıyız!"
 wuw_HUN_renovato_imperii_tt:0 "§Yİmparatorluk Bağlı Devletlerini krallığa geri Entegre Etmek§! için Kararlar açar, ayrıca §YEski Avusturya-Macaristan Topraklarını Çekirdek Yapma§! yeteneği de verir!"
 wuw_HUN_repulo_muszaki_intezet:0 "Repülö Muszaki Intézet"
 wuw_HUN_repulo_muszaki_intezet_desc:0 "Hava, savaşın yeni bir boyutu haline geldi ve birçokları tarafından önemi hafife alınıyor. Bu yeni boyutu ustalaşmayı öğrenmeli ve bunu yapmamızı sağlayan yeni doktrinler ve teçhizatların geliştirilmesine kaynak ayırmalıyız."
 wuw_HUN_restore_the_duchy_of_teschen:0 "Teschen Dükalığı'nı Geri Yükle"
 wuw_HUN_restore_the_duchy_of_teschen_desc:0 "Silezya toprakları uzun süre Bohemya tarafından yönetildi ve daha sonra onlarla birlikte imparatorluğa dahil edildi. Ancak Avusturya Veraset Savaşı'ndan sonra Prusya tarafından bizden çalındı, bu unutmadığımız bir kayıp. Onlara karşılığını vermeli ve bu toprakları bir kez daha kendimiz için geri almalıyız!"
 wuw_HUN_restore_the_georgian_monarchy:0 "Gürcü Monarşisini Geri Yükle"
 wuw_HUN_restore_the_georgian_monarchy_desc:0 "Bağlantılarımız, Gürcü tahtının meşru varisi olan sürgündeki Prens George Bagration of Mukhrani'ye ulaştı. Vatanını kurtarıp orada monarşiyi yeniden kurarsak davamıza sonsuz destek sözü verdi. Top şimdi bizim sahamızda."
 wuw_HUN_restore_the_hungarian_red_army:0 "Macar Kızıl Ordusunu Geri Yükle"
 wuw_HUN_restore_the_hungarian_red_army_desc:0 "Tüm vatanseverler, vatanlarını savunmada görevlerini yapmalıdır. Doğudaki Sovyetlerin örneğini takip ederek, yeni filizlenen Devrimimizi koruyacak bir Macar Kızıl Ordusu kuracağız."
 wuw_HUN_restore_the_lombardo_venetian_kingdom:0 "Lombardiya-Venedik Krallığı'nı Geri Yükle"
 wuw_HUN_restore_the_lombardo_venetian_kingdom_desc:0 "Lombardiya-Venedik Krallığı, 1815'ten 1866'ya kadar imparatorluğumuzda kurucu bir topraktı ve üçüncü İtalyan bağımsızlık savaşında yeni kurulan İtalya Krallığı tarafından bizden alındı. Yarımadaya geri dönme ve bu eski taç topraklarında bir Habsburg'u tahta geri getirmeye çalışma zamanı geldi."
 wuw_HUN_restore_the_socialist_federative_republic:0 "Sosyalist Federatif Cumhuriyeti Geri Yükle"
 wuw_HUN_restore_the_socialist_federative_republic_desc:0 "Komintern, emperyalizme karşı mücadeleyi terk etti, bunun yerine bir arada yaşama kararı aldı. Eğer dünya işçileri özgür olacaksa, Marx ve Lenin'in meşalesini ileriye taşımalıyız - gerekirse Sovyetler Birliği'ne karşı bile."
 wuw_HUN_restrict_voting_rights:0 "Oy Haklarını Kısıtla"
 wuw_HUN_restrict_voting_rights_desc:0 "Büyüyen komünist ve sol kanat demokratik nüfuza düzgün bir şekilde son vermek için, oy haklarını kısıtlamak, gereklilikleri daha sert hale getirmek ve sadece ülkemizin iyiliğini düşünenlerin seçimlere katılmasına izin vermek gerekli olacaktır."
 wuw_HUN_revenge_for_1919:0 "1919'un İntikamı"
 wuw_HUN_revenge_for_1919_desc:0 "1919'da [ROM.GetAdjective]ler bizi haklı Transilvanya topraklarımız üzerindeki bir çatışmada aşağıladı ve sadece tüm bölgeyi işgal etmekle kalmadı, aynı zamanda Budapeşte'yi de ele geçirdi ve başkentimizde geçit töreni yaptı. Eğer [ROOT.GetAdjective] ulusu bir daha şaha kalkacaksa, bu utancın devam etmesine izin verilemez."
 wuw_HUN_revenge_for_1919_tt:0 "Transilvanya içinde yer alan §YEski Macar Topraklarını Yeniden Entegre Etmek§! için kararlar açar"
 wuw_HUN_revenge_for_the_brusilov_offensive:0 "Brusilov Taarruzu'nun İntikamı"
 wuw_HUN_revenge_for_the_brusilov_offensive_desc:0 "Ruslar, Büyük Savaş'ın ilk bölümlerinde, özellikle de son derece başarılı Brusilov taarruzları sırasında bizi aşağıladılar. Bize yanlış yapanlardan, özellikle de Ruslardan intikam almanın ulusal bir ruh içinde olmasını sağlamalıyız. Bunu yaparken, bir Habsburg Ukraynası kurmak için yeni bir girişimde de bulunabiliriz."
 wuw_HUN_revenge_for_the_romanian_humiliations:0 "Romen Aşağılamalarının İntikamı"
 wuw_HUN_revenge_for_the_romanian_humiliations_desc:0 "1918-1919 Macar-Romen Savaşı'nda aşağılandık ve Transilvanya topraklarımız bizden çalındı. Onurumuzu geri kazanmak için, haklı olarak bizim olan bu toprakları geri almalıyız."
 wuw_HUN_reverse_the_brain_drain:0 "Beyin Göçünü Tersine Çevir"
 wuw_HUN_reverse_the_brain_drain_desc:0 "Toplumumuz üzerinde daha fazla kontrol sağlamak amacıyla boğucu ve ayrımcı yasalar getirmeye başladığında birçok önde gelen bilim insanı ülkemizi terk etti ve sonuç olarak aydınlarımız önemli ölçüde zarar gördü. Bu insanları geri getirmek ve [ROOT.GetAdjective] bilimini birlikte ilerletmek için çaba göstermeliyiz!"
 wuw_HUN_reverse_the_risorgimento:0 "Risorgimento'yu Geri Çevir"
 wuw_HUN_reverse_the_risorgimento_desc:0 "İtalya'nın birleşmesi, hükümdarların bir dizi sorumsuz seçimi ve Avusturya-Macaristan İmparatorluğu için trajedilerle dünyaya getirilen bir hataydı. Eğer dünya bundan bir daha kurtulacaksa, bu hata düzeltilmelidir!"
 wuw_HUN_reverse_the_risorgimento_tt:0 "§Y[ROOT.GetNameDefCap]§!, §Yİtalyan Yarımadası§!'nda §YRisorgimento Öncesi§! devletleri §YBağlı Devletler§! olarak serbest bırakacak ve onları destekleyecektir"
 wuw_HUN_revive_the_tribal_consolidation:0 "Macar Ulusunu Canlandır"
 wuw_HUN_revive_the_tribal_consolidation_desc:0 "Birçok insan Macar Ulusunun geçmişteki büyüklüğünü unutmuş olabilir, ama Ejderha Hareketi unutmadı. Bizim olanı geri alma ve toplumumuzu Ejderha Hareketi'nin planladığı kalıba uyacak şekilde yeniden şekillendirme zamanı geldi."
 wuw_HUN_reviving_the_spirit_of_1848:0 "1848 Ruhunu Canlandırma"
 wuw_HUN_reviving_the_spirit_of_1848_desc:0 "1848-1849 Macar Devrimi ve Bağımsızlık Savaşı, 1848'in birçok Avrupa Devriminden biriydi ve bize dilediğimiz bağımsızlığı vermede başarısız olmasına rağmen, bugün hepimizin yaşadığı ruhun ve ideallerin yolunu açtı. Devrimin alevlerini yeniden alevlendirmeli ve özgürlüğümüzün önünde duran despotları devirmeliyiz!"
 wuw_HUN_reviving_the_spirit_of_1848_requirements_tt:0 "§YKomünistler§! veya §YDemokratlar§! için destek, §YNEP§! ve §YMNSP§! için olan destekten daha büyüktür!"
 wuw_HUN_reviving_the_spirit_of_1848_tt:0 "Ülkedeki Çeşitli Monarşist ve Faşist unsurlar, bize karşı bir §Rİç Savaşta§! §YMiklós Horthy§!'yi takip edecek!"
 wuw_HUN_royal_hussars:0 "Kraliyet Hüssarları"
 wuw_HUN_royal_hussars_desc:0 "Halkımızın süvari kullanma konusunda uzun ve gururlu bir geleneği var ve bugün de farklı olmayacak. Majestelerinin güvenliğini sağlayan kraliyet muhafızları olarak hizmet edebilecek seçkin bir süvari gücü oluşturulmalıdır."
 wuw_HUN_royal_hussars_tt:0 "Üç Macar Hüssar §YSüvari§! birimi kazan"
 wuw_HUN_royalist_education_initiative:0 "Kralcı Eğitim Girişimi"
 wuw_HUN_royalist_education_initiative_desc:0 "İnsanların sadece nasıl davranacakları değil, aynı zamanda onları dilediğimiz şanlı geleceğe hazırlayacak en önemli şeylerin de öğretilmesi gerekiyor, bu arada birçok yeni ve parlak [ROOT.GetAdjective] bilim insanı yetiştiriliyor."
 wuw_HUN_sailing_the_danube:0 "Tuna'da Seyir"
 wuw_HUN_sailing_the_danube_desc:0 "Büyük Tuna nehri uzun zamandır ulusumuzun can damarı olmuştur ve üzerinde seyahat etme konusunda, ister mal taşımak ister ordularımızı hareket ettirmek olsun, uzun ve gururlu bir geleneğimiz var. Bu nedenle nehir donanmamıza yatırım yapmalı ve nehirdeki gemiciliğimizin olabildiğince sorunsuz çalışmaya devam etmesini sağlamalıyız."
 wuw_HUN_salami_slicing_tactics:0 "Salam Dilimleme Taktikleri"
 wuw_HUN_salami_slicing_tactics_desc:0 "Bir kerede gerçekleştirilmesi zor veya hatta yasadışı olacak çok daha büyük bir sonuç üretmek için bir dizi küçük Horthy karşıtı eylem kullanarak, yönetimi neredeyse hiçbir askerin politikalarını savunmaya istekli olmayacağı noktaya kadar potansiyel olarak zayıflatabiliriz."
 wuw_HUN_salami_slicing_tactics_tt:0 "§Y[ROOT.GetAdjective] İç Savaşı§! başladığında, §YSilahlı Kuvvetlerin§! biraz daha büyük bir kısmı bize sadık kalacaktır."
 wuw_HUN_secret_rearmament:0 "Gizli Yeniden Silahlanma"
 wuw_HUN_secret_rearmament_desc:0 "Trianon Antlaşması'nın bize dayattığı kısıtlamalar, ordumuzun boyutunu artırmamızı yasaklıyor. Yine de, dünyanın siyasi iklimi giderek daha çalkantılı hale geliyor ve ufukta çatışma beliriyor. Savunmasız kalamayız ve Büyük Savaş'tan sonra bize dayatılan barış antlaşmasının hükümlerini gizlice ihlal etmek anlamına gelse bile yeniden silahlanmaya başlamalıyız."
 wuw_HUN_secure_army_loyalty:0 "Ordu Sadakatini Güvence Altına Al"
 wuw_HUN_secure_army_loyalty_desc:0 "Ordunun bizim tarafımızda olduğundan emin olmak ve ona güvenle yatırım yapmamızı sağlamak için, taca olan sadakati şüpheli olan herhangi bir komutandan kurtulduğumuzdan emin olmalıyız."
 wuw_HUN_seek_an_alliance_with_the_kaiser:0 "Kaiser ile İttifak Ara"
 wuw_HUN_seek_an_alliance_with_the_kaiser_desc:0 "Eski [GER.GetAdjective] İmparatorluğu bir kez daha restore edildiğine göre, Büyük Savaş'ın sonunda her ikimize de yapılan korkunç eylemleri geri almak amacıyla [GER.GetLeader] ile eski bağlarımızı yeniden şekillendirmek akıllıca olacaktır."
 wuw_HUN_seek_german_contracts:0 "[GER.GetAdjective] Sözleşmeleri Ara"
 wuw_HUN_seek_german_contracts_desc:0 "Sanayilerimiz bir kez daha büyüyor, ancak ihtiyacımız olan tüm teçhizatı üretebileceksek, yeni tesisler inşa etmek için [GER.GetAdjective] mimarlar ve inşaat firmalarıyla sözleşme yapmak faydalı olacaktır."
 wuw_HUN_seek_german_contracts_tt:0 "Eğer §Y[GER.GetName]§!'nin §Y[ROOT.GetName]§!'e olan görüşü 25'ten fazla ama 50'den az ise, 1 §YHarita Dışı Askeri Fabrika§! kazan. Eğer §Y[ROOT.GetName]§!'e olan görüşleri 50'den fazla ama 75'ten az ise, 2 §YHarita Dışı Askeri Fabrika§! kazan. Eğer §Y[ROOT.GetName]§!'e olan görüşleri 75'ten fazla ise, 2 §YHarita Dışı Askeri Fabrika§! ve 1 §YHarita Dışı Sivil Fabrika§! kazan. \nŞu anda, şunları kazanacağız:"
 wuw_HUN_soviet_hungarian_military_academy:0 "Sovyet-Macar Askeri Akademisi"
 wuw_HUN_soviet_hungarian_military_academy_desc:0 "Ordumuz, liderliği olmadan bir hiçtir. Sovyetler askeri konularda çok daha fazla deneyime sahiptir, bu yüzden en iyi askeri zihinlerimizin eğitiminde onlarla işbirliği yapmak faydalı olabilir. Bu amaçla, her iki ulusumuzdan en yetenekli eğitmenlerle bir askeri akademi kuracağız."
 wuw_HUN_soviet_hungarian_war_indsutry:0 "Sovyet-Macar Savaş Sanayisi"
 wuw_HUN_soviet_hungarian_war_indsutry_desc:0 "İşbirliğimizi daha da güçlendirmek için, Sovyetlerden askeri sanayilerimize yatırım yapmalarını istemeliyiz, böylece yükümlülüklerimizi yerine getirebilir ve komünist müttefiklerimizi onlara tehdit etmeye cüret eden herkesten koruyabiliriz."
 wuw_HUN_spur_on_the_trianon_trauma:0 "Trianon Travmasını Kışkırt"
 wuw_HUN_spur_on_the_trianon_trauma_desc:0 "[ROOT.GetNameDef]'in geçmişte bugünkünden daha iyi olduğu genel bir bilgidir. O lanetli Trianon Antlaşması'nda, savunmasız konumumuzdan yararlanan komşularımıza haklı toprağımızın üçte ikisini kaybettik. [ROOT.GetAdjective] orduları hepsini geri almak için yürüdüğü gün, hepsi korkuyu tadacak!"
 wuw_HUN_stage_an_uprising_in_leitha:0 "Leitha'da Bir Ayaklanma Sahnele"
 wuw_HUN_stage_an_uprising_in_leitha_desc:0 "1921'de Lajtabánság'da Avusturyalılara karşı yapılan ayaklanma, [975.GetName] halkının büyük ulusumuzun bir parçası olmak istediğini kanıtladı. Ajanlar gönderip aynı şeyi ikinci kez denemeli, onlara derhal koruma teklif etmeli ve bölgeyi işgal etmek için harekete geçmeliyiz."
 wuw_HUN_stage_an_uprising_in_leitha_tt:0 "§RBu, [975.GetName]'nin sahibiyle savaşa yol açabilir!§!"
 wuw_HUN_state_protection_authority:0 "Devlet Koruma Otoritesi"
 wuw_HUN_state_protection_authority_desc:0 "Gururlu vatandaşlarımızın korunmasını sağlamak ve karşı-devrimci unsurların bir daha ortaya çıkamamasını sağlamak için, hükümetimize karşı hareket ettiğini düşündükleri herhangi bir kişiyi kökünden sökme yetkisine sahip bir gizli polis kurmalıyız."
 wuw_HUN_strenghten_the_order_of_vitez:0 "Vitéz Nişanını Güçlendir"
 wuw_HUN_strenghten_the_order_of_vitez_desc:0 "1920'de kurulan liyakat nişanı Vitézi Rend, şu anda Ekselansları Miklós Horthy tarafından yönetilmektedir. Bu nedenle, nişanın bir parçası olan komutanlara mümkün olduğunca güçlendirmek için daha fazla fon ve adam yönlendirebilir."
 wuw_HUN_strengthen_horthys_reign:0 "Horthy'nin Hükümdarlığını Güçlendir"
 wuw_HUN_strengthen_horthys_reign_desc:0 "Faşist başbakanımızın başka fikirleri olsa da, ülkede barışı korumanın ve [ROOT.GetNameDef]'i eski şanına kavuşturmanın en iyi yolu, naibin kontrolünü sağlamlaştırması ve iradesinin yerine getirilmesini şahsen sağlamasıdır."
 wuw_HUN_strengthen_the_turani_vadaszok:0 "Turáni Vadászok'u Güçlendir"
 wuw_HUN_strengthen_the_turani_vadaszok_desc:0 "1927'de Gyula Gömbös, Turan Avcıları Derneği adıyla faşist paramiliter gücü kurdu. Faşist olmalarına rağmen, Alman nasyonal sosyalizmi fikirlerine karşı çıkıyorlar ve Macarcılık ve Macar Turancılığı idealleri üzerine kurulmuşlardır. Bu nedenle, dilersek onları kendi avantajımıza kullanabiliriz."
 wuw_HUN_strengthen_the_turani_vadaszok_requirement_tt:0 "§Y$HUN_hungarian_national_defense_association$§! hala ortalıkta"
 wuw_HUN_subvert_gombos_troops:0 "Gömbös'ün Birliklerini Sabote Et"
 wuw_HUN_subvert_gombos_troops_desc:0 "Faşist ve aşırılıkçı başbakan Gyula Gömbös, en büyüğü Macar Ulusal Savunma Derneği olan çok sayıda paramiliter milisin başındadır. Yeni krallığımıza bir tehdit oluşturmadan önce bu grupları ortadan kaldırdığımızdan emin olmalıyız."
 wuw_HUN_support_for_our_finnish_brothers:0 "Finlandiyalı Kardeşlerimize Destek"
 wuw_HUN_support_for_our_finnish_brothers_desc:0 "Atalarımızın Finlilerinkiyle iç içe olduğunun yaygın olarak kabul edilmesinden sadece yüz küsur yıl geçti, ancak ülkemizdeki birçok kişi şimdi onları kan kardeşlerimiz olarak görüyor. Şimdi kendilerini savaşta bulduklarına göre, onlara savaşlarında yardımcı olmak için gönüllüler ve teçhizat göndermeliyiz."
 wuw_HUN_support_for_our_finnish_brothers_tt:0 "Finlerin bizimkine uygun bir hükümeti olmalı"
 wuw_HUN_sway_the_count:0 "Kontu İkna Et"
 wuw_HUN_sway_the_count_desc:0 "Erdőd Kontu Fidél Pálffy bir soylu ve ülkemizdeki Alman tarzı Nazizmin büyük bir destekçisidir. NSDAP bağlantıları tarafından büyük ölçüde tercih ediliyor gibi görünüyor ve benzer düşünen devletlerle diplomasiye girmeye çalışırken yanımızda olması çok faydalı olabilir."
 wuw_HUN_szent_laszlo_infantry_division:0 "Szent László Piyade Tümeni"
 wuw_HUN_szent_laszlo_infantry_division_desc:0 "Vatanımızı yaklaşan tehditten düzgün bir şekilde savunmak için yeni piyade birimleri oluşturmaya çalışmalıyız. Bu yeni piyade tümenine, 1077'den 1095'e kadar Macaristan Kralı ve askeri adamların ve sürgünlerin koruyucu azizi olan Aziz Ladislaus'un adını verebiliriz."
 wuw_HUN_szent_laszlo_infantry_division_tt:0 "6 §YPiyade§! taburu ve 1 §YTopçu§! taburundan oluşan bir birim kazan"
 wuw_HUN_tap_newfound_oil_deposits:0 "Yeni Bulunan Petrol Yataklarını İşlet"
 wuw_HUN_tap_newfound_oil_deposits_desc:0 "Ülkemizin dört bir yanında, örneğin MAORT olarak da bilinen Magyar-Amerikai Olajipari Rt tarafından birçok küçük petrol kuyusu keşfedildi. Dikkate değer olanlardan biri, olabildiğince çabuk işletilmesi gereken Budafapuszta petrol keşfidir."
 wuw_HUN_the_arado_ar_96:0 "Arado Ar 96"
 wuw_HUN_the_arado_ar_96_desc:0 "[GER.GetAdjective] uçak üreticisi Arado Flugzeugwerke'den lisanslı üretim yapmalı ve buna karşılık uçak üretim ve kullanım odağımızı hava keşfine kaydırmalıyız."
 wuw_HUN_the_balkan_pact:0 "Balkan Paktı"
 wuw_HUN_the_balkan_pact_desc:0 "Batı demokrasileri bize yardım etmek için çok uzakta, bu yüzden eve daha yakın müttefikler aramalıyız. Balkan Paktı'nın lideri olarak, onlara korumamızı sunacak ve onları zafere götüreceğiz!"
 wuw_HUN_the_balkan_pact_invitation_tt:0 "[ROM.GetNameDef] olay alır: §Y[ROOT.GetNameDefCap], [ROM.GetNameDef]'i Balkan Paktı'na davet ediyor§!"
 wuw_HUN_the_balkan_pact_tt:0 "İttifakımıza §YBalkan Ülkelerini Davet Etmek§! için kararlar açar"
 wuw_HUN_the_bastion_of_catholicism:0 "Katolikliğin Kalesi"
 wuw_HUN_the_bastion_of_catholicism_desc:0 "Ulusumuzun çoğunluğu Katoliktir ve hükümdarı da öyledir. Apostolik Macaristan Krallığı'nın Hristiyanlığın savunucusu konumunu almasının ve tanrısız komünistleri kıtamızdan sürmesinin zamanı geldi."
 wuw_HUN_the_botond:0 "Botond"
 wuw_HUN_the_botond_desc:0 "İkmal ve nakliye taleplerimizi yeterince karşılamak için yeni bir kamyon türüne ihtiyacımız var. Rába 38M Botond tasarımının ilk denemeleri başarılı oldu ve uygun kaynaklarla tasarımı sonuçlandırıp üretime başlayabiliriz."
 wuw_HUN_the_bulwark_against_the_west:0 "Batı'ya Karşı Siper"
 wuw_HUN_the_bulwark_against_the_west_desc:0 "Uluslararası komünist hareketin gururlu bir üyesi olarak, yaşam tarzlarımızı her an savunmaya hazır olmalıyız ve şu andaki en büyük tehdit, batının faşistleri ve kapitalistleridir. Güçlü durmaya devam etmek istiyorsak, asla sarsılmayacak, hareket etmez bir nesne olan bir siper olarak durmalıyız."
 wuw_HUN_the_cult_of_arpad:0 "Árpád Kültü"
 wuw_HUN_the_cult_of_arpad_desc:0 "9. ve 10. yüzyılların başında Macar kabileleri konfederasyonunun başı olan büyük Árpád, Macar halkı için büyük bir ilham kaynağıdır ve hanedanı uzun süre devam ederek [ROOT.GetnameDef]'i olabileceğinin en iyisi yapmıştır. Onun kitabından bir sayfa almalı ve örneğini takip etmeli, onu efsanelerin bir kahramanı olarak yüceltmeliyiz."
 wuw_HUN_the_hungarian_life_and_renewal_party:0 "Macar Yaşam ve Yenilenme Partileri"
 wuw_HUN_the_hungarian_life_and_renewal_party_desc:0 "Toplum üzerinde daha iyi bir kontrol sağlamak için, başbakanımızın radikal sola karşı öncü olarak hareket edecek yeni siyasi partiler kurmasını sağlamalıyız."
 wuw_HUN_the_kingdom_of_georgia_required_states_tt:0 "§Y[ROOT.GetNameDefCap]§! veya bir bağlı devlet, §YSovyetler Birliği§!'ndeki tüm §YGürcü§! çekirdek eyaletlerini kontrol ediyor!"
 wuw_HUN_the_kingdom_of_ukraine:0 "Ukrayna Krallığı"
 wuw_HUN_the_kingdom_of_ukraine_desc:0 "Büyük Savaş'tan sonra, Alman İmparatorluğu'nun yardımıyla yeni bir Ukrayna devleti kurmaya çalıştık. O zaman Bolşevikler tarafından ezildi, ama şimdi Ukrayna anavatanını bir kez daha kontrol ediyoruz ve Ukrayna'da yeni, Habsburg liderliğinde bir Krallık kurmaya teşebbüs edebiliriz."
 wuw_HUN_the_kingdom_of_ukraine_required_states_tt:0 "§Y[ROOT.GetNameDefCap]§! veya bir bağlı devlet, §Y[137.GetName]§!, §Y[218.GetName]§!, §Y[93.GetName]§! ve §Y[234.GetName]§!'nin yanı sıra §YSovyetler Birliği§!'ndeki tüm §YUkrayna§! çekirdek eyaletlerini kontrol ediyor."
 wuw_HUN_the_kingdom_of_ukraine_tt:0 "Gerekli eyaletlerden bağlı devletimiz olarak yeni bir §YUkrayna Devleti§! serbest bırakacağız"
 wuw_HUN_the_lands_of_the_crown_of_saint_stephen:0 "Aziz Stephen Tacı'nın Toprakları"
 wuw_HUN_the_lands_of_the_crown_of_saint_stephen_desc:0 "Avusturya-Macaristan İmparatorluğu'nun bir parçası olarak, Aziz Stephen Tacı'nın Toprakları veya kısaca Transleithania olarak biliniyorduk. İmparatorluğu geri alma yolundaki ilk adımımız olarak, bu adı bir kez daha benimsemeye çalışmalıyız. Bu, dünyaya gerçek niyetimizin ne olduğunu gösterecektir."
 wuw_HUN_the_legacy_of_arpad_andrew_and_matthias:0 "Árpád, Andrew ve Matthias'ın Mirası"
 wuw_HUN_the_legacy_of_arpad_andrew_and_matthias_desc:0 "Árpád, Venedikli III. Andrew ve Matthias Corvinus, eski ulusumuzun en büyük kahraman hükümdarlarından üçüdür. Eğer Joseph August onların efsanelerine bir gün ulaşacaksa, bir zamanlar onların olanı talep etmeli ve onları tamamen somutlaştırmalı, ruhlarını geleceğe taşımalıdır."
 wuw_HUN_the_legacy_of_the_isonzo_front:0 "Isonzo Cephesi'nin Mirası"
 wuw_HUN_the_legacy_of_the_isonzo_front_desc:0 "Majesteleri Joseph August, Avusturya-Macaristan'a hizmet etti ve hem Rusya, Sırbistan hem de İtalya cephelerinde birçok savaşa liderlik etti. Ancak en önemlisi, Isonzo'nun birçok savaşında kullanılan taktikleri ilham verici buldu ve cephede formüle edilen askeri stratejileri uygulamaya çalışıyor."
 wuw_HUN_the_march_on_budapest:0 "Budapeşte Yürüyüşü"
 wuw_HUN_the_march_on_budapest_desc:0 "Faşistler organize edilip silahlandırıldığına göre, Naip Miklós Horthy'nin istifasını talep ederek başkente yürümelerini sağlayabiliriz. Bunu yaparak, Gömbös ülkenin hükümdarı olarak hak ettiği yeri alabilir ve derhal düzeni yeniden sağlayarak kendisini Macaristan'ın başkanı ilan edebilir."
 wuw_HUN_the_matyasfold_fighter_factory:0 "Mátyásföld Avcı Fabrikası"
 wuw_HUN_the_matyasfold_fighter_factory_desc:0 "Weiss Manfréd Acél- és Fémművek, Budapeşte, Mátyásföld'de, kendilerinin geliştirdiği avcı modellerini üretmeye adanmış yeni bir uçak üretim tesisi açmalıdır."
 wuw_HUN_the_mavag_heja:0 "MÁVAG Héja"
 wuw_HUN_the_mavag_heja_desc:0 "MÁVAG'daki uçak departmanı, İtalyan Reggiane Re.2000 modeline dayanan ve Şahin adını verdikleri yeni bir prototip modeli geliştirdi. Mümkün olduğunca çok sayıda bu yeni uçak modelini üretmelerinde onlara destek olmalıyız."
 wuw_HUN_the_old_grand_alliance:0 "Büyük İttifakı Geri Yükle"
 wuw_HUN_the_old_grand_alliance_desc:0 "1689'da Hollanda Cumhuriyeti ve İngiltere adına III. William ile birlikte bir antlaşma imzaladık. Amaç, Fransa'nın yayılmacı politikalarını durdurmak için bir ittifak kurmaktı. Şimdi, dünya bir kez daha yanıyor ve bu eski birliği yeniden kurmaya çalışarak kıtayı güvence altına almalıyız."
 wuw_HUN_the_old_habsburg_king:0 "Yaşlı Habsburg Kralı"
 wuw_HUN_the_old_habsburg_king_desc:0 "Avusturya Arşidükü Joseph August, Macaristan'ın son Palatiniydi ve Karl'ın vekiliydi, ta ki Antant, bir Habsburg kralını tanımayacaklarını söyleyerek tahttan çekilmesini talep edene kadar. Şimdi, bir kez daha tahtını almaya ve Macaristan'ı kutsal kralı olarak yönetmeye hazır. Eski bir Feldmarschall olarak, savaş bilgisi kesinlikle işe yarayacaktır."
 wuw_HUN_the_second_northern_campaign:0 "İkinci Kuzey Seferi"
 wuw_HUN_the_second_northern_campaign_desc:0 "1919'da gerçekleşen ilk kuzey seferimiz ne yazık ki bir başarısızlıktı ve Slovak halkı Çeklerin eline düştü. Sadece Macarları değil, aynı zamanda Trianon antlaşmasında kaybedilen topraklardaki Slovakları da kurtarmak için hızlı hareket etmeliyiz."
 wuw_HUN_the_spirit_of_the_aster_revolution:0 "Kasımpatı Devrimi'nin Ruhu"
 wuw_HUN_the_spirit_of_the_aster_revolution_desc:0 "Büyük Savaş'ın sonunda, Mihály Károlyi ve Macaristan halkı demokrasi ve bağımsızlık aradı. Cumhuriyet sona ermiş olsa da, halkımızın bu Kasımpatı Devrimi sırasında hissettiği ruhu ve dayanışmayı canlandırmalı ve geleceğe birlikte çalışmalıyız."
 wuw_HUN_the_szekel_command:0 "Sekel Komutanlığı"
 wuw_HUN_the_szekel_command_desc:0 "[76.GetName]'yi ve dolayısıyla Sekel Ülkesi'ni yakın zamanda yeniden fethetmemizle birlikte, dağlarda gezinme ve savaşma konusunda uzman olan Macarlar olan Sekel nüfusumuzu silahlı kuvvetlerimizde seçkin birlikler olarak çalıştırma yeteneğine sahibiz."
 wuw_HUN_the_szekel_command_division_tt:0 "4 §YDağcı§! taburu ve 1 §YTopçu§! taburundan oluşan iki birim kazan"
 wuw_HUN_the_szekesfehervar_sosto_plant:0 "Székesfehérvár-Sóstó Tesisi"
 wuw_HUN_the_szekesfehervar_sosto_plant_desc:0 "Havacılık Teknoloji Enstitüsü tarafından kontrol edilen ve tasarladığı uçakları üretebilen ve düzgün çalıştıklarından emin olmak için test edebilen yeni bir uçak üretim tesisi açmalıyız."
 wuw_HUN_the_toldi:0 "Toldi"
 wuw_HUN_the_toldi_desc:0 "İsveç Landsverk L-60'ın temelini kullanarak, çok sayıda düşmanı hızla kuşatabilecek kendi hafif tankımızı inşa edebiliriz. Bu yeni tanka 14. yüzyıl Macar şövalyesi Miklós Toldi'nin adını vereceğiz."
 wuw_HUN_the_toldi_tt:0 "\n§Y$improved_light_tank_chassis$§! teknolojisi araştırıldığında:\n"
 wuw_HUN_the_triple_kingdom:0 "Üçlü Monarşi"
 wuw_HUN_the_triple_kingdom_desc:0 "Büyük Savaş'ın sonunda ve hatta öncesinde, ikili monarşiyi, biri Hırvatistan-Slavonya tacı olmak üzere üç taçlı bir monarşi lehine kaldırmayı tartışanlar vardı. Gelecekte imparatorluğumuzun tekrar çökmemesi için şimdi bu sözleri yerine getirmeye çalışmalıyız."
 wuw_HUN_the_turan:0 "Turán"
 wuw_HUN_the_turan_40_tt:0 "\n§Y$improved_medium_tank_chassis$§! teknolojisi araştırıldığında:\n"
 wuw_HUN_the_turan_43_tt:0 "\n§Y$advanced_medium_tank_chassis$§! teknolojisi araştırıldığında:\n"
 wuw_HUN_the_turan_desc:0 "Škoda T-21 orta tank prototipinin temelini kullanarak, en ağır şekilde tahkim edilmiş düşman hatlarını bile delebilecek kendi orta tankımızı inşa edebiliriz. Bu yeni projeye, Macar Turancılığını teşvik etme ve sözünü tüm dünyaya yayma çabasıyla adını vereceğiz."
 wuw_HUN_the_turul_association:0 "Turul Derneği"
 wuw_HUN_the_turul_association_desc:0 "Turul Derneği, 1919'da Budapeşte'de bir üniversite hareketi olarak kuruldu. İç savaş sırasında ve 1921 sonbaharında Budaőrs savaşında Miklós Horthy'nin yanında sıkıca durdular. Yaklaşık 40.000 üye ile ülkemizin eğitimini kontrol etmek için onları kullanabiliriz."
 wuw_HUN_the_war_on_atheism:0 "Ateizme Karşı Savaş"
 wuw_HUN_the_war_on_atheism_desc:0 "Son çağlarda, insanlar Tanrı'yı unutmaya başladılar. Sürekli büyüyen ateizm belası, köküne saldırmazsak yayılmaya devam edecektir. Bu sapkınlık sonsuza dek devam etmesin diye komünistleri şimdi devirmeliyiz."
 wuw_HUN_transylvanian_mountaineers:0 "Transilvanyalı Dağcılar"
 wuw_HUN_transylvanian_mountaineers_desc:0 "Transilvanya dağları, bölgemizdeki en yüksek dağlardan bazılarıdır ve dağ birliklerimizi eğitmek için mükemmel bir yerdir."
 wuw_HUN_undercover_air_maneuvers:0 "Gizli Hava Manevraları"
 wuw_HUN_undercover_air_maneuvers_desc:0 "Hava savaşıyla ilgili yeni teoriler geliştirmek için bol miktarda kaynak harcamalıyız. Savaşa girersek, geliştirilebilecek teoriler paha biçilmez olacak ve gizli eğitim pilotlarımızı savaşta daha iyi hale getirecektir."
 wuw_HUN_undermine_the_admiral:0 "Amirali Zayıflat"
 wuw_HUN_undermine_the_admiral_desc:0 "Tuğamiral Miklós Horthy, boş [ROOT.GetAdjective] tahtında oturmaktan çok uzun süredir keyif alıyor ve hanedan kurmaya başlayabilir. Onun hükümdarlığına bir son vermeli ve Gyula Gömbös gibi daha bilge bir adamın naiplik görevini üstlenmesini sağlamalıyız. MOVE bunun gerçeğe dönüşmesine yardımcı olabilir."
 wuw_HUN_undermine_the_volksbund:0 "Faşist Paramiliterleri Zayıflat"
 wuw_HUN_undermine_the_volksbund_desc:0 "Alman faşistleriyle yakın bağları olan Volksbund adlı Alman-Macar örgütü gibi birçok faşist paramiliter grup, bir devrim girişiminde bulunursak muhtemelen bize karşı silahlanacaktır. Çok geç olmadan hepsini içeriden veya dışarıdan yok etmeye çalışmalıyız."
 wuw_HUN_undermine_the_volksbund_tt:0 "§Y[ROOT.GetAdjective] İç Savaşı§! başladığında, karşı taraf herhangi bir ek §YVolksbund§! birimi kazanmayacak ve biz ek olarak §G+%15§! Savaş Desteği ve §G+75§! Politik Güç kazanacağız"
 wuw_HUN_undoing_the_yugoslav_mistake:0 "Yugoslav Hatasını Düzeltme"
 wuw_HUN_undoing_the_yugoslav_mistake_desc:0 "Yugoslavya'nın yaratılması, insanlık tarihindeki en büyük hatalardan biriydi ve Slovenler, Hırvatlar ve Sırplar Devleti'nin eski topraklarını yeniden ele geçirmek için elimizden gelen her şeyi yapmalıyız. Macaristan bir kez daha yükselecek!"
 wuw_HUN_undoing_the_yugoslav_mistake_tt:0 "Eski Slovenler, Hırvatlar ve Sırplar Devleti içinde yer alan §YEski Macar Topraklarını Yeniden Entegre Etmek§! için kararlar açar"
 wuw_HUN_uplift_the_dragon_movement:0 "Ejderha Hareketini Yücelt"
 wuw_HUN_uplift_the_dragon_movement_desc:0 "Yerli Macarlar Birliği olarak da bilinen Ejderha Hareketi, öncelikle orta sınıfın çıkarlarını temsil eden bir gruptur ve sloganı 'Macaristan Macarlarındır!' Macar yönetiminde bir aydın sınıfı ve eski değerlere sahip bir Büyük Macaristan için Macar odaklı bir Tuna Vadisi politikası talep ediyorlar. Fikirleri bizimkilerle çok uyumlu olduğu için onları desteklemeliyiz."
 wuw_HUN_volksbund_der_deutschen_in_ungarn:0 "Volksbund der Deutschen in Ungarn"
 wuw_HUN_volksbund_der_deutschen_in_ungarn_desc:0 "DNSAP destekli nasyonal-sosyalist hareket; Volksbund der Deutschen in Ungarn, yeni Alman hükümdarımıza sadık muhafızlar ve milisler için mükemmel bir organizasyon olurdu. Onlara ulaşmalı ve liderleriyle işbirliğini teşvik etmeliyiz."
 wuw_HUN_ward_against_extremism:0 "Aşırılığa Karşı Korun"
 wuw_HUN_ward_against_extremism_desc:0 "Aşırılık giderek yaklaşırken, Tuna ulusları özgürlüğün ve demokrasinin bir kalesi olarak gururla durmalı, özgürlüğün tüm düşmanlarını savuşturmalıdır. Birlikte, demokrasiyi savunmalıyız!"
 wuw_HUN_ward_against_extremism_tt:0 "Her ittifak üyesi de bu ulusal ruhu kazanacak"
 wuw_HUN_weiss_manfred_wm_23_ezust_nyil:0 "Weiss Manfréd WM-23 Ezüst Nyíl"
 wuw_HUN_weiss_manfred_wm_23_ezust_nyil_desc:0 "Mümkün olan en kısa sürede yeni bir avcı uçağı geliştirmemiz gerekiyor ve Weiss Manfréd Acél- és Fémművek'teki bilim insanlarımız, Gümüş Ok olarak adlandırılan Ezüst Nyíl için planlar geliştirdiler ve üretime başlamak için onay bekliyorlar."
 wuw_HUN_wherever_the_cross_points:0 "Haç Nereyi Gösterirse"
 wuw_HUN_wherever_the_cross_points_desc:0 "Hareketimizin sembolü olan ok haçına göre, Macaristan doğuştan hakkını geri almalı ve okların gösterdiği her yöne genişlemelidir. Haklı olarak bizim olanı geri alma zamanı geldi!"
 wuw_HUN_wolfs_of_the_sea:0 "Deniz Kurtları"
 wuw_HUN_wolfs_of_the_sea_desc:0 "Denizaltılar, son savaşta gezegendeki en güçlü donanmayı yenmeye yaklaştı. Kendi denizaltılarımıza sahip olmazsak modern bir donanma olarak ciddiye alınamayız."
 wuw_HUN_zrinyi_arty_tt:0 "\n§Y$advanced_medium_tank_chassis$§! teknolojisi araştırıldığında:\n"
