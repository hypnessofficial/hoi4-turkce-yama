 GER_GER_is_monroe_actor_d_no_resistance:0 "[USA.GetNameDefCap] Amerika'daki ilerlemelerimiz konusunda cehaletten başka bir şey göstermemiştir. Doktrini yıkmak için hala yapmamız gereken işler olsa da, bu bizim için bir fırsat anlamına geliyor."
 GER_GER_is_monroe_actor_d_usa_resistance:0 "Görünüşe göre [USA.GetAdjective]'lar Monroe Doktrini'ni istikrarsızlaştırma girişimlerimize karşı koymaya karar vermişler. Ancak hızlı hareket ederek Doktrin denilen çılgınlığı yine de hızlı bir şekilde ortadan kaldırabilmeliyiz."
 GER_GER_is_monroe_actor_t:0 "Monroe Doktrini'nin İstikrarsızlaştırılması"
 GER_MONROE_DOCTRINE_COUNTRIES_IN_OPPOSITION_TOOLTIP:0 "[GetMonroeOppositionGoodBad] ülkeleri şu anda §YMonroe Doktrini§!'ne karşıdır.\n\nBu ülkeler aktif olarak bu duruşu benimsemişlerdir ve daha fazla üzerlerine nüfuz edilemez[GetIsAnyoneOpposingMonroe][GetOppositionMonroeCountries]"
 GER_MONROE_DOCTRINE_COUNTRIES_IN_SUPPORT_TOOLTIP:0 "[GetMonroeSupportGoodBad] ülkeleri şu anda §YMonroe Doktrini§!'ni desteklemektedir.\n\nBu ülkeler aktif olarak bu duruşu benimsemişlerdir ve daha fazla üzerlerine nüfuz edilemez.[GetIsAnyoneSupportingMonroe][GetSupportingMonroeCountries]"
 GER_MONROE_DOCTRINE_COUNTRIES_IN_THE_DOCTRINE_TOOLTIP:0 "Aşağıdaki §Y[?global.monroe_doctrine_countries_to_destabilize^num]§! ülkeleri Monroe Doktrini'nin parçasıdır:\n\n[GetCountriesInTheMonroeDoctrine]"
 GER_USA_is_monroe_actor_d:0 "Monroe Doktrini'ni istikrarsızlaştırmaya yönelik oldukça geniş kapsamlı [GER.GetAdjective] planları olduğu dikkatimizi çekti. Bunu yaparak çatışmayı kendi arka bahçemize taşımış olacaklar. Bunun olmasına izin veremeyiz"
 GER_USA_is_monroe_actor_t:0 "Monroe Doktrininin Güçlendirilmesi"
 GER_a_fourth_silesian_uprising_cat:0 "Dördüncü Silezya Ayaklanması"
 GER_a_fourth_silesian_uprising_cat_desc:0 "Ülkemizdeki son istikrarsızlık ve iç savaş nedeniyle, bağımsız bir Silezya isteyenler ajitasyona başlamış ve fırsat doğması halinde olası bir ayaklanma için hazırlık yapmaktadırlar. Bu hayalleri mümkün olduğunca hızlı bir şekilde yıkmak akıllıca olacaktır."
 GER_annex_integrated_puppet_decision:0 "[FROM.GetAdjective] Sivil İdaresini entegre edin"
 GER_anti_colonialism_category:0 "Sömürgecilik Karşıtı"
