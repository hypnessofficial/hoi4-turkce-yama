 GER_exploit_the_gombos_treaty_desc:0 "Macaristan Başbakanı Gyula Gömbös'ün 1934 yılında bizimle imzaladığı ticaret anlaşması, Macar ekonomisini canlandırmak ve büyük buhrandan kurtulmalarına yardımcı olmak açısından önemli olmakla birlikte, onlar için büyük sakıncalar da taşımaktadır. Anlaşma onlara buğday satışı için uygun bir fiyat sağlasa da, kazanılan paranın Almanya'daki bir hesapta kalması ve sadece Alman sanayi mallarını satın almak için kullanılması gerekiyor. Dolayısıyla kendi ekonomimize yardım etmek için onların bizim ülkemizde sakladıkları hesabı boşaltabiliriz, ancak bunun bedeli potansiyel bir müttefiki kaybetmek olacaktır."
