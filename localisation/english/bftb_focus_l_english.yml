l_english:
 BUL_a_balkan_confederation:0 "Bir Balkan Konfederasyonu"
 BUL_a_balkan_confederation_desc:0 "Balkan Antantı'nın oluşumuna yol açan nedenler artık geçerli değil. Bu çalkantılı zamanlarda, Balkan ulusları geçmişin çatışmalarını geride bırakmalı ve onları boyunduruk altına almak isteyen yabancı güçlere karşı kendilerini savunmak için birleşmelidir."
 BUL_a_balkan_confederation_faction_tt:0 "§Y'[BUL.GetNameDef] bizi [GetDemocraticBalkanConfederationName]'e davet ediyor'§! etkinliğini alır."
 BUL_a_black_sea_fleet:0 "Bir Karadeniz Filosu"
 BUL_a_black_sea_fleet_desc:0 "Eğer bir tür deniz varlığına sahip olmak istiyorsak, herhangi bir modern filonun belkemiği oldukları için muhriplerin inşasına odaklanarak Karadeniz'e uygun bir filo oluşturmalıyız."
 BUL_a_powerful_bulgarian_navy:0 "Güçlü bir Bulgar Donanması"
 BUL_a_powerful_bulgarian_navy_desc:0 "Filolarımıza şu anda eksik olan ateş gücünü sağlayan zırhlı gemiler inşa etmeye odaklanmalıyız. En büyük donanmaya sahip olmayabiliriz, ancak çabalarımızı yoğunlaştırırsak, büyük deniz güçlerine karşı bile denizlerimizin hakimiyetine itiraz edebilecek bir konuma gelebiliriz."
 BUL_abolish_the_monarchy:0 "Monarşiyi Kaldır"
 BUL_abolish_the_monarchy_desc:0 "Monarşi, Üçüncü Bulgar Devleti'nin ilk yıllarında Bulgaristan'da istikrarı korumada yararlı bir araç olabilirdi, ancak yıkıcı savaşlar ve zalim rejimlerden sonra, insanlar bu eskimiş hükümet sistemine olan inancını kaybetti. Onu kaldırma zamanı geldi."
 BUL_abolish_the_tarnovo_constitution:0 "Tırnovo Anayasasını Kaldır"
 BUL_abolish_the_tarnovo_constitution_desc:0 "Tırnovo anayasası geçen yüzyılda liberal ve ileri kabul ediliyordu, ancak bugün sadece baskıcı bir diktatörlük rejimini meşrulaştırmaya hizmet ediyor. Bu anayasayı kaldırma ve 1936 Sovyet Anayasası modeline dayanan, vatandaşların yasa önünde eşitliği, ifade ve toplanma özgürlüğü ve evrensel bir refah sistemi gibi temel hakları içeren yeni bir anayasa yazma zamanı geldi."
 BUL_acquire_modern_tools:0 "Modern Aletler Edin"
 BUL_acquire_modern_tools_desc:0 "Bulgar sanayisi temel olarak eski moda, küçük ölçekli imalat ve el sanatlarından oluşmaktadır. Modern bir sanayinin temellerini kurmak ve geliştirmek için uygun araçlara ihtiyacımız var."
 BUL_agrarian_cooperative_movement:0 "Tarımsal Kooperatif Hareketi"
 BUL_agrarian_cooperative_movement_bzns_support_requirement_tt:0 "§Y%80§!'den fazla [GetBznsName] grup sadakati"
 BUL_agrarian_cooperative_movement_desc:0 "Çiftçi Ulusal Birliği tarafından önerilen tarımsal önlemlerden ilham almalı ve kooperatiflere dayalı bir kırsal örgütlenmeyi teşvik etmeliyiz."
 BUL_all_that_glitters:0 "Parıldayan Her Şey"
 BUL_all_that_glitters_desc:0 "Chelopech'teki altın yatakları, maddi olmayan varlıklara yapılan yatırımların büyük risk altında olduğu bir zamanda ekonomimize iyi hizmet edebilir. Ulusal rezervlerimiz üzerindeki etkisi fark edilir olmalıdır."
 BUL_allow_far_right_organizations:0 "Aşırı Sağ Örgütlere İzin Ver"
 BUL_allow_far_right_organizations_desc:0 "Ulusal Sosyal Hareket veya Ratnikler gibi belirli aşırı sağ örgütleri yasallaştırmak, rejimimizi ve ideallerimizi destekleyen yararlı ve sadık müttefikler sağlayabilir."
 BUL_allow_far_right_organizations_tt:0 "[GetNsmName] grubunu yasallaştırır, bu da gelecekte ulusun refahını aktif olarak tehdit eden muhalifleri bastırmak dışında onlara baskı yapmamızı engeller."
 BUL_amend_old_grudges:0 "Eski Kinleri Düzelt"
 BUL_amend_old_grudges_balkan_targets_tt:0 "Şuna karşı §Yİlhak Et§! savaş hedefi kazanır:"
 BUL_amend_old_grudges_desc:0 "İkinci Balkan Savaşı sırasında bizi arkadan bıçaklayan hain Romenler ve Türklerden, bizi büyük savaşta yenen ve o zamandan beri ülkemizin gelişimini engelleyen İtilaf devletlerine kadar, geçmişte Bulgaristan'a verilen tüm zararın ve aşağılanmanın intikamını alma zamanı geldi."
 BUL_an_aegean_sea_fleet:0 "Bir Ege Denizi Filosu"
 BUL_an_aegean_sea_fleet_desc:0 "Artık Ege'de bir varlığımız olduğuna göre, üzerinde tam hakimiyet kurmaya çalışmalıyız. Bunu başarmak için sadece muhriplere ve denizaltılara güvenemeyiz, filolarımızda daha büyük tonajlı gemilere ihtiyacımız var."
 BUL_an_aegean_sea_fleet_tt:0 "Ege Denizi'nde tersanesi olan her eyalete §Y1 Deniz Üssü§!, §G1§! İnşaat Alanı ve §Y1 Donanma Tersanesi§! ekler. \nMevcut etkiler:"
 BUL_appeal_to_european_capitalists:0 "Avrupalı Kapitalistlere Başvur"
 BUL_appeal_to_european_capitalists_cg_tt:0 "Ulusal Ruh §YYabancı Sanayi§!'yi şu şekilde değiştir \nTüketim Malları Fabrikaları: §Y-%5§!"
 BUL_appeal_to_european_capitalists_desc:0 "[ROOT.GetNameDef]'in ulusal sanayisinin gelişimini canlandırmak ve ülkede zaten yatırım yapmış olan büyük çokuluslu şirketlerle borcunu yeniden müzakere etmek için yeni bir sermaye enjeksiyonuna ihtiyacı var."
 BUL_appoint_communist_ministers:0 "Komünist Bakanlar Ata"
 BUL_appoint_communist_ministers_desc:0 "Bulgar hükümetine, Çar'ın diktatörlük rejiminden bir rota değişikliği arayan bakanlar ataması için baskı yapmalıyız. Sadece hükümetin içinden çarlık sistemini yıkabiliriz."
 BUL_appoint_communist_ministers_tt:0 "[GetNsmName]'e baskı yapma kararlarının kilidini açar."
 BUL_appoint_right_wing_ministers:0 "Sağcı Bakanlar Ata"
 BUL_appoint_right_wing_ministers_desc:0 "Çar'ın rejimi, ülkeyi sıkı bir şekilde kontrol etmede yardımcı olsa da, Bulgaristan'ın uluslararası sahnedeki durumunu iyileştirmek için herhangi bir gerçek hedeften yoksundur. Bulgaristan'ın gerçekten ihtiyaç duyduğu siyasi ve sosyal değişiklikleri yapmaya hazır yeni bakanlar atamak için mevcut otoriter sistemin doğasından yararlanmalıyız."
 BUL_appoint_right_wing_ministers_tt:0 "[GetNsmName] ile iş birliği yapma kararlarının kilidini açar. \n[GetNsmName]'e baskı yapma kararlarının kilidini açar."
 BUL_approach_british_foreign_industry_tt:0 "[ENG.GetNameDef] ile §YYabancı Anlaşmalar§! için azaltılmış karar maliyeti ve artırılmış [ENG.GetAdjective] fabrika sınırı."
 BUL_approach_germany:0 "Almanya'ya Yaklaş"
 BUL_approach_germany_desc:0 "Britanyalılar ve Fransızlar, Neuilly Antlaşması'nın aşağılanmasından bu yana sürekli olarak ekonomimizi boğarken, Almanlar sadece toprak iddialarımızı tanıma imaları göstermekle kalmadı, aynı zamanda borçlarımızı temizlememize ve hasadımızın büyük bir kısmını satın almamıza yardımcı olarak ekonomimizi canlandırdı ve önemli sanayi ve tarım reformları yapmamıza olanak sağladı."
 BUL_approach_germany_foreign_industry_tt:0 "[GER.GetNameDef] ile §YYabancı Anlaşmalar§! için azaltılmış karar maliyeti ve artırılmış [GER.GetAdjective] fabrika sınırı."
 BUL_approach_soviet_foreign_industry_tt:0 "[SOV.GetNameDef] ile §YYabancı Anlaşmalar§! için azaltılmış karar maliyeti ve artırılmış [SOV.GetAdjective] fabrika sınırı."
 BUL_approach_the_united_kingdom:0 "Birleşik Krallık'a Yaklaş"
 BUL_approach_the_united_kingdom_desc:0 "[ROOT.GetNameDef]'in bu belirsiz zamanlarda galip gelmesi için Avrupa'daki büyük demokratik güçlerin korumasına ihtiyacı var. Ülkelerimiz arasında işbirlikçi bir pakt müzakere etmek için [ENG.GetAdjective] hükümetiyle görüşmeliyiz."
 BUL_approach_the_united_kingdom_ferdinand_tt:0 "I. Ferdinand Çar olarak geri dönmedi"
 BUL_assert_our_claims:0 "İddialarımızı Öne Sür"
 BUL_assert_our_claims_desc:0 "Ülkemizi on yıllardır rahatsız eden toprak sorunlarını ele alma zamanı geldi. Kurtuluşumuzdan bu yana Bulgaristan'a yapılan hakaretleri düzeltmek için [ENG.GetAdjective] hükümetinden destek aramalıyız."
 BUL_assert_our_claims_enemy_claims_tt:0 "\n§Y[BUL.GetNameWithFlag]§!, komşu bir düşman veya düşmanın müttefiki tarafından kontrol edilen Balkan eyaletleri üzerinde hak iddia eder ve o komşu ülkelere karşı §Yİlhak Et§! savaş hedefi kazanır."
 BUL_assert_our_claims_historical_claims_current_tt:0 "Çekirdek yapılacak mevcut eyaletler:"
 BUL_assert_our_claims_historical_claims_tt:0 "§Y[BUL.GetNameWithFlag]§! tarafından tamamen kontrol edilen herhangi bir tarihsel olarak talep edilen eyalette çekirdek verir.\nTarihsel olarak talep edilen eyaletler: §Y[106.GetName]§!, §Y[803.GetName]§!, §Y[77.GetName]§!, §Y[184.GetName]§!, §Y[731.GetName]§!, §Y[971.GetName]§!."
 BUL_assert_our_claims_initial_states_tt:0 "Eğer §Y[ENG.GetNameWithFlag]§! kabul ederse: Bir müttefik tarafından kontrol edilen herhangi bir haklı [BUL.GetAdjective] eyaleti (§Y[48.GetName]§!, §Y[211.GetName]§!, §Y[212.GetName]§!, §Y[801.GetName]§!) §Y[BUL.GetNameWithFlag]§!'e geri devredilecektir. \nPotansiyel olarak devredilecek mevcut eyaletler: "
 BUL_attract_foreign_capitals:0 "Yabancı Sermayeyi Çek"
 BUL_attract_foreign_capitals_desc:0 "Kendi başımıza güçlü ve verimli bir sanayi kurma imkanımız yok, bu yüzden en iyi seçeneğimiz, işlerini genişletmeye ve Bulgaristan'da faaliyet göstermeye istekli yabancı yatırımcılara başvurmaktır."
 BUL_attract_foreign_capitals_dynamic_modifier_tt:0 "Ulusal Ruh kazanır: §YYabancı Sanayi§!, şu bonusları verir (Siyasi Güç Kazancı: §G+%5§!, İnşaat Hızı: §R-%10§!, Fabrika Çıktısı: §R-%2§!, £GFX_prod_eff_cap Üretim Verimliliği Sınırı: §R-%5§!, £GFX_prod_eff Üretim Verimliliği artışı: §R-%5§!)"
 BUL_balkan_federation_of_socialist_republics:0 "Balkan Sosyalist Cumhuriyetler Federasyonu"
 BUL_balkan_federation_of_socialist_republics_decisions_tt:0 "§YBalkan Federasyonu Rüyası§! Kararları artık diğer Balkan ülkelerini hedef alabilir."
 BUL_balkan_federation_of_socialist_republics_desc:0 "Bir Balkan Federasyonu projesi, çeşitli üyelerin milliyetçi özlemleri nedeniyle 1920'lerde başarısız oldu. Ancak zaman değişti ve yeni federasyon projemizi, [YUG.GetNameDef]'den başlayarak, diğer Balkan uluslarına göstermeliyiz."
 BUL_balkan_federation_of_socialist_republics_faction_tt:0 "§Y'Bulgaristan bizi Balkan Sosyalist Cumhuriyetler Federasyonu'na davet ediyor'§! etkinliğini alır."
 BUL_balkan_research_cooperation:0 "Balkan Araştırma İşbirliği"
 BUL_balkan_research_cooperation_desc:0 "[GetFederationOrConfederation]'imizin farklı ülkelerinden bilim insanlarının keşiflerini paylaşmalarına ve yeni teknolojik ilerlemeleri teşvik etmelerine olanak tanıyan bir iş birliği programı geliştirmeliyiz."
 BUL_balkan_trade_union_secretariat:0 "Balkan Sendikalar Sekreterliği"
 BUL_balkan_trade_union_secretariat_desc:0 "Ekonomiyi canlandırmak ve [GetFederationOrConfederation]'imizin ülkeleri arasında iş birliğini teşvik etmek amacıyla, farklı sendikaların izleyeceği direktifleri belirleyen bir Sendikalar Sekreterliği kurmalıyız."
 BUL_balkan_trade_union_secretariat_tt:0 "Bulgaristan ile müttefik olan her Balkan ulusu, (Tüketim Malları Fabrikaları: §Y-%5§!, Ekonomi Yasaları Maliyeti: §G-%35§!, Ticaret Yasaları Maliyeti: §G-%35§!) veren Ulusal Ruh §YBalkan Sendikalar Sekreterliği§!'ni kazanır."
 BUL_ban_far_right_organizations:0 "Aşırı Sağ Örgütleri Yasakla"
 BUL_ban_far_right_organizations_desc:0 "Aşırı sağ radikaller otoriteye karşı şiddet kullanmaktan çekinmezler, hükümetimize ve vatandaşlarımıza büyük bir tehdit oluştururlar. Bu nitelikteki tüm sosyal hareketleri yasaklamalı ve ilgili tüm paramiliter örgütleri dağıtmalıyız."
 BUL_ban_far_right_organizations_tt:0 "[GetNsmName]'e baskı yapma kararlarının kilidini açar."
 BUL_bulgaria_on_the_three_seas:0 "Üç Denizde Bulgaristan"
 BUL_bulgaria_on_the_three_seas_buliding_tt:0 "Ege, Adriyatik veya Karadeniz kıyısında zaten bir Donanma Tersanesi inşa edilmiş olan herhangi bir eyalete §Y2 Donanma Tersanesi§! ekle. \nEge, Adriyatik veya Karadeniz'de bir Deniz Üssü bulunan herhangi bir ile §Y1 Deniz Üssü§! ve §Y2 Kıyı Kalesi§! ekle. \nMevcut etkiler:"
 BUL_bulgaria_on_the_three_seas_desc:0 "Antik çağlarda Birinci ve İkinci Bulgar İmparatorlukları sırasında olduğu gibi, [ROOT.GetNameDef]'in kıyıları bir kez daha Ege, Adriyatik ve Karadeniz tarafından yıkanıyor. Bir sonraki adım, üç denizde Bulgar hakimiyetini sağlayabilecek güçlü bir donanma inşa etmek için gerekli altyapıyı geliştirmektir."
 BUL_bulgarian_academy_of_sciences:0 "Bulgar Bilimler Akademisi"
 BUL_bulgarian_administration_of_the_balkans:0 "Balkanların Bulgar Entegrasyonu"
 BUL_bulgarian_administration_of_the_balkans_axis_name_def:0 "bir Mihver"
 BUL_bulgarian_administration_of_the_balkans_central_powers_name_def:0 "bir İttifak Devletleri"
 BUL_bulgarian_administration_of_the_balkans_cores_tt:0 "Eğer [ROOT.GetNameDef] tarafından kontrol ediliyorsa, §Y[106.GetName]§!, §Y[803.GetName]§!, §Y[971.GetName]§! ve §Y[77.GetName]§!'da çekirdek verir.\nMevcut etkiler:"
 BUL_bulgarian_administration_of_the_balkans_decisions_tt:0 "Balkan devletlerini çekirdek yapmaya izin veren §YBulgar Yeniden Entegrasyon Kampanyası§! kararlarının kilidini açar."
 BUL_bulgarian_administration_of_the_balkans_desc:0 "Balkanlar üzerindeki iddialarımızı güçlendirmek için, işgal altındaki bölgelerin bir Bulgar entegrasyonunu gerçekleştirmeliyiz, böylece savaştaki [GetGermanFactionNameDef] zaferinden sonra, [GetGermanOrIndependent] o toprakların Bulgar niteliğini görebilir ve 1878'de Britanyalıların yaptığı gibi ulusal bütünlüğümüzü bozmaya cüret edemez."
 BUL_bulgarian_administration_of_the_balkans_everyone_name:0 "dünya"
 BUL_bulgarian_administration_of_the_balkans_germans_name:0 "Almanlar"
 BUL_bulgarian_administration_of_the_balkans_independent_name_def:0 "bizim"
 BUL_bulgarian_irredentism:0 "Bulgar İrredentizmi"
 BUL_bulgarian_irredentism_desc:0 "Bulgar milliyetçiliği, Balkan sınırlarının Bulgaristan lehine yeniden çizilmesi gerekliliğini savunuyor ve komünistler ve demokratlar bile bununla aynı fikirde olacaklardır. Tüm halkımız için ortak bir hedef olan Büyük Bulgaristan'ı restore etme ihtiyacını vurgulamalıyız."
 BUL_bulgarian_shipping_chamber:0 "Bulgar Deniz Ticaret Odası"
 BUL_bulgarian_shipping_chamber_desc:0 "Bulgar nakliye şirketlerine ve kooperatiflerine filolarını sürekli artırmak için ihtiyaç duydukları araçları sağlamalıyız, çünkü konvoyları barış zamanında ticaret için, savaş sırasında ise asker ve malzeme taşımak için çok önemlidir."
 BUL_bury_the_grudges_of_the_past:0 "Geçmişin Kinlerini Göm"
 BUL_bury_the_grudges_of_the_past_communist:0 "§YBalkan Sosyalist Cumhuriyetler Federasyonu§!"
 BUL_bury_the_grudges_of_the_past_decisions_tt:0 "Balkan uluslarını etkileme ve onları [GetBalkanFactionName]'e katılmaya davet etme kararlarının kilidini açar."
 BUL_bury_the_grudges_of_the_past_democratic:0 "§YBalkan Antantı§!"
 BUL_bury_the_grudges_of_the_past_desc:0 "Geçmişin anlaşmazlıklarını geride bırakıp Balkanlar'da dayanışma ve iş birliği dolu bir geleceğe bakma zamanı geldi. Komşularımızı [GetFederationOrConfederation]'imize katılmaya teşvik etmeliyiz, çünkü onlar olmadan birleşik Balkanlar projemiz asla tamamlanmayacaktır."
 BUL_bury_the_grudges_of_the_past_explanatory_democratic_tt:0 "Balkanlar'daki herhangi bir bağımsız §YDemokratik§! ulus, §Y'[BUL.GetNameDef] bizi [GetDemocraticBalkanConfederationName]'e davet ediyor'§! etkinliğini alacaktır.\n§RBulgaristan, o ülkelerdeki herhangi bir toprak iddiasından feragat edecektir§!."
 BUL_bury_the_grudges_of_the_past_explanatory_tt:0 "Balkanlar'daki herhangi bir bağımsız §YKomünist§! ulus, §Y'Bulgaristan bizi Balkan Sosyalist Cumhuriyetler Federasyonu'na davet ediyor'§! etkinliğini alacaktır.\n§RBulgaristan, o ülkelerdeki herhangi bir toprak iddiasından feragat edecektir§!."
 BUL_bury_the_grudges_of_the_past_no_faction:0 "[ROOT.GetFlag]§Y[ROOT.GetAdjective]§! ittifakı"
 BUL_carry_the_revolution_abroad:0 "Devrimi Yurtdışına Taşı"
 BUL_carry_the_revolution_abroad_alternative_invitation_tt:0 "Eğer [ROOT.GetFlag]§Y[ROOT.GetName]§! ittifak lideriyse, bağımsız Komünist Balkan ülkeleri onları Bulgar ittifakına davet eden bir etkinlik alacak."
 BUL_carry_the_revolution_abroad_comintern_invitation_tt:0 "Bağımsız Komünist Balkan ülkeleri, onları [ROOT.GetFlag]§Y[ROOT.GetName]§!'in ittifakına davet eden bir etkinlik alacak"
 BUL_carry_the_revolution_abroad_desc:0 "Bulgaristan, Balkanlar'daki komünist devrimin öncüsü olmalıdır. Benzer düşünen hükümetleri ittifakımıza katılmaya davet edeceğiz ve devrimi zorla diğer komşularımıza götürme görevini üstleneceğiz."
 BUL_carry_the_revolution_abroad_tt:0 "Balkanlar'daki herhangi bir bağımsız §YKomünist§! ulus, §Y'Bulgaristan bizi ittifakına davet ediyor'§! etkinliğini alacaktır."
 BUL_carry_the_revolution_abroad_wargoals_tt:0 "Komünist olmayan bir hükümete sahip veya farklı bir ittifaka müttefik olan herhangi bir Balkan ülkesine karşı §Yİlhak Et§! savaş hedefi kazanır. \nEtkilenen ülkeler §YKomünist Tehdidi§! kazanır (Görüş: §Y[BUL.GetNameWithFlag]§! §R-35§!.)\nMevcut etkilenen ülkeler:"
 BUL_collectivization_of_the_countryside:0 "Kırsalın Kolektifleştirilmesi"
 BUL_collectivization_of_the_countryside_bs_support_requirement_tt:0 "§Y%70§!'den fazla [GetBsName] grup sadakati"
 BUL_collectivization_of_the_countryside_desc:0 "Tarımsal dağıtımdaki kriz geçmişte Bulgaristan'da büyük bir huzursuzluğa neden oldu ve bu sorunun çözümü, bireysel olarak sahip olunan çiftliklerin yerine kolektif olarak işletilen çiftliklerin getirilmesinde yatmaktadır; bu süreç Sovyetler Birliği'nde zaten başarıyla uygulanmıştır."
 BUL_condemn_macedonian_organizations:0 "Makedon Örgütlerini Kına"
 BUL_condemn_macedonian_organizations_desc:0 "IMRO'ya karşı hoşnutsuzluğumuzu ilan etmeli ve hala Bulgaristan'da faaliyet gösteren herhangi bir Makedon devrimci hücresini avlayıp ortadan kaldırma üzerinde çalışmaya başlamalıyız, böylece 1934'te Zveno'nun başlattığı şeye nihayet son verip dış ilişkilerimizi de geliştirmiş oluruz."
 BUL_condemn_macedonian_organizations_rearmament_tt:0 "\nBu odağı tamamlamak, §Y[ENG.GetNameWithFlag]§!'ı §YBulgar Yeniden Silahlanmasını Müzakere Et§! kararı aracılığıyla Bulgar ordu kısıtlamalarını kaldırmaya daha yatkın hale getirecektir."
 BUL_condemn_macedonian_organizations_tt:0 "§YMakedon Devrimci Örgütleriyle Savaş§! kararlarının kilidini açar."
 BUL_confederation:0 "konfederasyon"
 BUL_consolidate_dominance_of_the_seas:0 "Denizlerde Hakimiyeti Sağlamlaştır"
 BUL_consolidate_dominance_of_the_seas_desc:0 "Eğer Balkanları güvence altına almak istiyorsak, yarımadaya büyük bir ordu konuşlandırmak yeterli değil, aynı zamanda onu çevreleyen denizleri koruyan güçlü bir donanma inşa etmemiz de gerekiyor."
 BUL_consolidate_the_third_bulgarian_state:0 "Üçüncü Bulgar Devletini Sağlamlaştır"
 BUL_consolidate_the_third_bulgarian_state_desc:0 "Uzun bir sosyal çatışma, ekonomik bunalım ve uluslararası anlaşmazlık döneminden sonra, nihayet Üçüncü Bulgar Devletini istikrara kavuşturmaya ve güçlendirmeye hazırız."
 BUL_contract_foreign_companies:0 "Yabancı Şirketlerle Anlaş"
 BUL_contract_foreign_companies_desc:0 "Askeri sanayimiz, yeterli bir yeniden silahlanma programı yürütmekten çok uzaktır. Ordumuzu donatmak için yüksek kaliteli araçlar üretebilecek uygun tasarımcıları yurtdışında aramalıyız."
 BUL_cooperate_with_the_zveno:0 "Zveno ile İşbirliği Yap"
 BUL_cooperate_with_the_zveno_coup_tt:0 "\n§R[GetZvenoName] grubu, zamanında entegre edilmezse bir darbe düzenleyebilir§!"
 BUL_cooperate_with_the_zveno_desc:0 "Onları düşmanlaştırmak yerine, Zveno ile birlikte çalışmalıyız. Eğer onlara bazı tavizler vermeye karar verirsek, güçlü bir müttefik kazanabiliriz."
 BUL_cooperate_with_the_zveno_tt:0 "[GetZvenoName] ile iş birliği yapma kararlarının kilidini açar."
 BUL_cooperation_with_italy:0 "İtalya ile İşbirliği"
 BUL_cooperation_with_italy_desc:0 "İtalyanlar ülkemize olan ekonomik ilgilerini birkaç kez gösterdiler ve Çar Boris ile Prenses Giovanni arasındaki kraliyet evliliğini unutmamalıyız. Onlarla hem diplomatik hem de ekonomik ilişkilerimizi güçlendirmeliyiz, çünkü yakın gelecekte Balkanlar'da güçlü bir müttefik olabilirler."
 BUL_corporatism:0 "Korporatizm"
 BUL_corporatism_desc:0 "İtalyan modelinden esinlenerek, farklı ekonomik sektörlerden işçiler ve kapitalistler ulusal politika yapımına katılmalıdır, böylece bu gruplar arasında arabuluculuk yapabilir ve ulusal ekonomi için en faydalı reformları gerçekleştirebiliriz."
 BUL_crush_the_communists:0 "Komünistleri Ez"
 BUL_crush_the_communists_desc:0 "Bu yüzyılda şimdiye kadar defalarca bastırılmış olmalarına rağmen, komünistler hala gölgelerde gizleniyor, saflarını kalınlaştırmak için sefil ve dışlanmışları avlıyorlar. Gerekli her türlü yolla onları kesin olarak bitirmek bizim görevimizdir..."
 BUL_crush_the_communists_no_cooperation_tt:0 "\n§RBulgar hükümetinin gelecekte [GetBsName] ile iş birliği yapmasını engelleyecektir§!."
 BUL_crush_the_communists_tt:0 "[GetBsName]'e baskı yapma kararlarının kilidini açar."
 BUL_darzhavna_aeroplanna_rabotilnitsa:0 "Darzhavna Aeroplanna Rabotilnitsa"
 BUL_darzhavna_aeroplanna_rabotilnitsa_desc:0 "Hava kuvvetlerimizin ihtiyaç duyduğu uçakları sağlamak için yabancı tasarımcılara güvenmemeliyiz. Bozhurishte'deki Devlet Uçak Atölyemizin tesislerinde büyük bir genişleme ve modernizasyon gerçekleştireceğiz."
 BUL_darzhavna_samoletna_fabrika:0 "Darzhavna Samoletna Fabrika"
 BUL_darzhavna_samoletna_fabrika_desc:0 "Bozhurishte'deki DAR tesisleri zaten hava kuvvetlerimizi beslemek için Bulgar avcı uçakları üretiyor. Şimdi, diğer hafif uçakların üretimine odaklanacak modern tesislere sahip Lovech'te bir Devlet Uçak Fabrikası'nın kurulmasına yatırım yapabiliriz."
 BUL_darzhavna_voenna_fabrika:0 "Darzhavna Voenna Fabrika"
 BUL_darzhavna_voenna_fabrika_desc:0 "Ordumuzu yüksek kaliteli teçhizatla donatabilecek uygun bir ulusal askeri sanayinin temellerini atmak için Kazanlak'taki Devlet Askeri Fabrikası'nı genişletebiliriz."
 BUL_defensive_lines:0 "Savunma Hatları"
 BUL_defensive_lines_desc:0 "Ulaşım yollarımızı korumak ve birliklerimiz için ikmal akışını sağlamak amacıyla yeterli tahkimatların inşasına ve altyapının iyileştirilmesine başlamalıyız."
 BUL_defensive_lines_tt:0 "Bulgaristan tarafından tamamen kontrol edilen ve §YDünya Gerilimi§! yaratan bir ülkeye komşu olan her başlangıç Bulgar eyaletine veya tarihi toprak iddiasına §Y1 Altyapı§!, §Y1 Uçaksavar§! ve §Y1 Kara Kalesi§! ekle."
 BUL_defy_moscow:0 "Moskova'ya Meydan Oku"
 BUL_defy_moscow_desc:0 "Sovyetler Birliği, Balkan ülkeleri arasındaki rekabetlerden uzun süre yararlandı ve kendi çıkarına olduğunda siyasetimize müdahale etmekten çekinmedi. Şimdi [GetFederationOrConfederation]'imizin, Sovyet hükümeti birleşik Balkan bloğumuzun Moskova'nın hegemonyasına meydan okuyacak bir konumda olduğunu fark etmeden önce saldırma zamanı."
 BUL_democratic_principles:0 "Demokratik İlkeler"
 BUL_democratic_principles_desc:0 "Ana hedefimiz Çar'ın otoriter rejimine son vermek olsa da, onun yerine totaliter bir komünist hükümetin kurulmasına izin veremeyiz. Demokratik ideallere sadık kalmalı ve hükümette benzer düşünen bakanların nüfuzunu artırmaya çalışmalıyız."
 BUL_depose_the_tsar:0 "Çarı Devir"
 BUL_depose_the_tsar_cw_tt:0 "§YTarafsız§! destekçiler bir iç savaş başlatır."
 BUL_depose_the_tsar_desc:0 "Bulgar monarşisi, hedeflerimize ulaşmamızı ancak engelleyebilecek bir yük haline geldi. Çar'ın kullanışlılığı sona erdi ve onu yoldan çekme zamanı geldi."
 BUL_develop_burgas_shipyards:0 "Burgaz Tersanelerini Geliştir"
 BUL_develop_burgas_shipyards_desc:0 "Savaş gemileri için üretim kapasitemizi artırmak için, Burgaz deniz üssünün genişletilmesine ve bölgede yeni tersanelerin inşasına yatırım yapacağız."
 BUL_dissolve_the_military_union:0 "Askeri Birliği Dağıt"
 BUL_dissolve_the_military_union_desc:0 "Zveno, subaylarımız üzerinde çok fazla nüfuza sahip ve Çar Boris'in onları 1935'te iktidardan uzaklaştırmasından sonra saflarında gerçek bir kin var. Yeni bir Zveno darbesinden kaçınmak istiyorsak, subaylarımızı Sofya'da toplamalı ve Askeri Birliğin feshedildiğini duyurmalıyız."
 BUL_dissolve_the_military_union_tt:0 "[GetZvenoName]'e baskı yapma kararlarının kilidini açar."
 BUL_dissolve_the_military_union_zveno_coup_tt:0 "\n§R[GetZvenoName] grubu, zamanında yok edilmezse bir darbe düzenleyebilir§!"
 BUL_dominance_in_the_adriatic_aegean_failure:0 "Ege'yi güvence altına almadaki başarısızlığımız Bulgar moraline ağır bir darbe vurdu. Cesaret ve güveni yeniden kazanmak istiyorsak, Adriyatik'te Bulgar hakimiyetini sağlamalıyız."
 BUL_dominance_in_the_adriatic_aegean_success:0 "Ege'yi güvence altına almadaki başarımızın ardından, Bulgar birliklerinin ve sivil nüfusun morali her zamankinden daha yüksek. İvmeden yararlanmalı ve Adriyatik'i güvence altına almalıyız, böylece Balkanların Prusyası üç denizin tek ve tartışmasız koruyucusu olacak."
 BUL_dominance_in_the_adriatic_black_sea_failure:0 "Karadeniz'i güvence altına alma görevimizdeki başarısızlıktan sonra aldığımız darbe, Bulgar nüfusunun moralinin bozulmasına yol açtı, bunu çözmenin tek yolu, bu sefer başarılı bir şekilde, Adriyatik'te Bulgar hakimiyetini sağlamaktır."
 BUL_dominance_in_the_adriatic_black_sea_success:0 "Karadeniz'i güvence altına almadaki başarımızın ardından, manevrayı Adriyatik'te tekrarlama zamanı geldi. Kıyılarında bulunan herhangi bir düşman ulusu kovacak ve değerli topraklarını Balkanların Prusyası için ele geçireceğiz."
 BUL_dominance_in_the_adriatic_default:0 "Karanlık zamanlar, alınması gereken vahim önlemleri gerektirir. Sadece Bulgar ulusunun bütünlüğünü değil, aynı zamanda Üç Deniz'deki hakimiyetini de garanti altına almak için, Adriyatik'i güvence altına alma, kıyılarından olası tüm tehditleri kaldırma zamanı geldi."
 BUL_dominance_in_the_adriatic_sea:0 "Adriyatik Denizi'nde Hakimiyet"
 BUL_dominance_in_the_adriatic_sea_claims_tt:0 "[ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§!, bir müttefik veya tebaa tarafından kontrol edilmeyen Adriyatik Denizi kıyısındaki herhangi bir eyalet üzerinde hak iddia eder."
 BUL_dominance_in_the_adriatic_sea_desc:0 "[GetDominanceInTheAdriaticDesc]"
 BUL_dominance_in_the_adriatic_total_failure:0 "Hem Ege hem de Karadeniz'i güvence altına almadaki başarısızlıktan sonra aldığımız darbeler, ülkede genel bir moral bozukluğu ve hükümete karşı güvensizlik dalgasına yol açtı. Hatalarımızı telafi etmek ve Balkanların Prusyası'nın hak ettiği ihtişamı geri getirmek istiyorsak, Adriyatik'te Bulgar hakimiyetini sağlamalıyız."
 BUL_dominance_in_the_aegean_adriatic_failure:0 "Ege'yi güvence altına almadaki başarısızlığımız Bulgar moraline ağır bir darbe vurdu. Cesaret ve güveni yeniden kazanmak istiyorsak, Ege'de Bulgar hakimiyetini sağlamalıyız."
 BUL_dominance_in_the_aegean_adriatic_success:0 "Adriyatik'i güvence altına almadaki başarımızın ardından, Bulgar birliklerinin ve sivil nüfusun morali her zamankinden daha yüksek. İvmeden yararlanmalı ve Ege'yi güvence altına almalıyız, böylece Balkanların Prusyası üç denizin tek ve tartışmasız koruyucusu olacak."
 BUL_dominance_in_the_aegean_black_sea_failure:0 "Karadeniz'i güvence altına alma görevimizdeki başarısızlıktan sonra aldığımız darbe, Bulgar nüfusunun moralinin bozulmasına yol açtı, bunu çözmenin tek yolu, bu sefer başarılı bir şekilde, Ege'de Bulgar hakimiyetini sağlamaktır."
 BUL_dominance_in_the_aegean_black_sea_success:0 "Karadeniz'i güvence altına almadaki başarımızın ardından, manevrayı Ege'de tekrarlama zamanı geldi. Kıyılarında bulunan herhangi bir düşman ulusu kovacak ve değerli topraklarını Balkanların Prusyası için ele geçireceğiz."
 BUL_dominance_in_the_aegean_default:0 "Karanlık zamanlar, alınması gereken vahim önlemleri gerektirir. Sadece Bulgar ulusunun bütünlüğünü değil, aynı zamanda Üç Deniz'deki hakimiyetini de garanti altına almak için, Ege'yi güvence altına alma, kıyılarından olası tüm tehditleri kaldırma zamanı geldi."
 BUL_dominance_in_the_aegean_sea:0 "Ege Denizi'nde Hakimiyet"
 BUL_dominance_in_the_aegean_sea_claims_tt:0 "[ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§!, bir müttefik veya tebaa tarafından kontrol edilmeyen Ege Denizi kıyısındaki herhangi bir eyalet üzerinde hak iddia eder."
 BUL_dominance_in_the_aegean_sea_desc:0 "[GetDominanceInTheAegeanDesc]"
 BUL_dominance_in_the_aegean_total_failure:0 "Hem Adriyatik hem de Karadeniz'i güvence altına almadaki başarısızlıktan sonra aldığımız darbeler, ülkede genel bir moral bozukluğu ve hükümete karşı güvensizlik dalgasına yol açtı. Hatalarımızı telafi etmek ve Balkanların Prusyası'nın hak ettiği ihtişamı geri getirmek istiyorsak, Ege'de Bulgar hakimiyetini sağlamalıyız."
 BUL_dominance_in_the_black_sea:0 "Karadeniz'de Hakimiyet"
 BUL_dominance_in_the_black_sea_claims_tt:0 "[ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§!, bir müttefik veya tebaa tarafından kontrol edilmeyen Karadeniz kıyısındaki herhangi bir eyalet üzerinde hak iddia eder."
 BUL_dominance_in_the_black_sea_desc:0 "Karanlık zamanlar, alınması gereken vahim önlemleri gerektirir. Sadece Bulgar ulusunun bütünlüğünü değil, aynı zamanda hegemonyasını da garanti altına almak için, Karadeniz'i güvence altına alma, kıyılarından olası tüm tehditleri kaldırma zamanı geldi."
 BUL_dominance_in_the_black_sea_wargoals_tt:0 "Şuna karşı §Yİlhak Et§! savaş hedefi kazanır:"
 BUL_economic_protectionism:0 "Ekonomik Korumacılık"
 BUL_economic_protectionism_desc:0 "Ulusal ekonomiyi ve sanayiyi canlandırmak için yeni reformlar uygulamalı, aynı zamanda Bulgaristan'daki tarım ve el sanatları gibi temel sektörleri de korumalıyız."
 BUL_expand_sofia_university:0 "Sofya Üniversitesi'ni Genişlet"
 BUL_expand_sofia_university_desc:0 "Bütçemizin bir kısmını Bulgaristan'ın en prestijli yüksek öğrenim kurumu olan Sofya Üniversitesi'nin tesislerinin genişletilmesini finanse etmeye ayırarak, iyi bir şekilde kullanacağımız parlak beyin havuzumuzu artıracağız."
 BUL_expand_the_tobacco_industry:0 "Tütün Sanayisini Genişlet"
 BUL_expand_the_tobacco_industry_desc:0 "Onlarca yıldır ana ihracatımız tarımsal üretimimiz oldu, ancak buğday üretiminden tütün gibi daha değerli ürünlere geçerek bu ihracattan elde edilen karı hala artırabileceğimiz açıktır."
 BUL_expand_varna_naval_base:0 "Varna Deniz Üssü'nü Genişlet"
 BUL_expand_varna_naval_base_desc:0 "Varna deniz üssünün tesislerini genişletmeli ve savaş gemilerinin üretimini gerçekleştirmek için yeterli tersaneleri inşa etmeliyiz."
 BUL_federation:0 "federasyon"
 BUL_fight_tyranny:0 "Zorbalıkla Savaş"
 BUL_fight_tyranny_desc:0 "Endişe verici faşist politikaları izleyen ve liderleri egemenliklerini genişletmek ve dünyayı boyunduruk altına almaktan başka bir şey hayal etmeyen büyük Avrupa güçleriyle yüzleşme zamanı geldi."
 BUL_fight_tyranny_wargoals_current_tt:0 "\nMevcut büyük faşist Avrupa ülkeleri:\n"
 BUL_fight_tyranny_wargoals_tt:0 "§YAvrupa'daki büyük faşist ülkelere§! karşı §YHükümeti Devir§! savaş hedefi kazanır."
 BUL_follow_the_stalinist_doctrine:0 "Stalinist Doktrini Takip Et"
 BUL_follow_the_stalinist_doctrine_desc:0 "Sadece ekonomik ve endüstriyel konularda değil, aynı zamanda askeri konularda da [SOV.GetNameDef] ile [ROOT.GetNameDef] arasında daha iyi bir iş birliği geliştirebilmemiz için resmi [SOV.GetFactionName] üyeliği için başvurma zamanımız geldi."
 BUL_foreign_aircraft_designers:0 "Yabancı Uçak Tasarımcıları"
 BUL_foreign_aircraft_designers_desc:0 "Askeri uçak üretiminde onlarca yıllık deneyime sahip yabancı tasarımcıları işe alabilecekken, neden ulusal bir havacılık endüstrisi geliştirmek için zaman ve çaba harcayalım?"
 BUL_form_a_popular_bloc:0 "Popüler bir Blok Oluştur"
 BUL_form_a_popular_bloc_desc:0 "[ROOT.GetNameDef]'deki otoriterliğe ve baskıya karşı güçlü bir birleşik blok oluşturmak için, sosyalist politikalara yönelmeli ve faşist ve monarşist rejimlere karşı savaşmaya istekli solcu siyasi gruplar arasında uyum aramalıyız."
 BUL_form_a_regency_council:0 "Bir Naiplik Konseyi Kur"
 BUL_form_a_regency_council_desc:0 "Çar Boris'in ölümünün ardından ve varisinin [GetSimeonsAge] olması nedeniyle, genç II. Simeon adına ülkenin yönetimini ve vesayetini üstlenmek üzere bir Naiplik Konseyi atanmalıdır."
 BUL_form_a_regency_council_tt:0 "Ülkenin yönetimini ve genç II. Simeon üzerindeki vesayeti üstlenmek üzere bir Naiplik Konseyi atanacaktır."
 BUL_found_dvf_sopot:0 "DVF Sopot'u Kur"
 BUL_found_dvf_sopot_desc:0 "Sopot'taki mühimmat fabrikasının inşası 1935'te başladı, ancak henüz bitmedi. Kompleksi en kısa sürede faaliyete geçirmek için kalan makine ve teçhizatın alınması için bir anlaşma yapmalıyız."
 BUL_found_the_brannik:0 "Brannik'i Kur"
 BUL_found_the_brannik_desc:0 "Bogdan Filov'un, diğer Alman gençlik örgütlerini örnek alan, yetkililere yakın ve Çar'a sadık, Brannik adında faşist yanlısı bir ulusal gençlik örgütü kurma yönünde ilginç bir teklifi var. Filov, Brannik'in muazzam bir hale gelerek bize önemli bir insan gücü kaynağı sağlayabileceğine inanıyor.\n\"Boris, Bulgaristan, Tanrım!\""
 BUL_free_balkan_states:0 "Özgür Balkan Devletleri"
 BUL_free_balkan_states_desc:0 "Topraklarımızı işgal etmeyi amaçlayan herhangi bir ulusun emellerine karşı daha zayıf komşularımızı korumak bir Balkan gücü olarak bizim görevimizdir. Bölgenin dost ulusları arasında iş birliğini geliştirmeli ve Balkanların savunmasına hazırlanmalıyız."
 BUL_free_balkan_states_guarantees_tt:0 "Bağımsız veya §Y[BUL.GetNameWithFlag]§! ile müttefik olan her §YDemokratik§! ve §YTarafsız§! Balkan ülkesini garanti et:"
 BUL_free_balkan_states_ns_tt:0 "\nUlusal Ruh kazanır: §YBalkanlar'daki Görevimiz§!, şu bonusları verir (Tüketim Malları Fabrikaları: Garanti edilen her ülke için §Y-%1§!, İstikrar: Garanti edilen her ülke için §G+%5§!, Haftalık İnsan Gücü: §G+1000§! garanti edilen ülkelerden etkilenmez)."
 BUL_free_balkan_states_wargoals_tt:0 "\nŞuna karşı §YKukla Yap§! savaş hedefi kazanır: \n-[BUL.GetNameDef]'den farklı bir ittifaktaki herhangi bir Balkan ülkesi. \n-Bir Balkan Devletini işgal eden herhangi bir Balkan dışı ülke. \nMevcut etkilenen ülkeler:"
 BUL_freedom_of_press:0 "Basın Özgürlüğü"
 BUL_freedom_of_press_ban_faction_media_tt:0 "\n§RHükümetin, sonraki §Y365 gün§! boyunca herhangi bir grubun medyasını yasaklamasını engelleyecektir.§!"
 BUL_freedom_of_press_desc:0 "Anayasa restore edildiğine göre, onun haklarını ve ilkelerini garanti etmeliyiz. Şu anda yasaklı olan gazetelerin dağıtımına izin vermek, belirli örgütlerle iş birliği yapmaya yönelik ilk adım olabilir."
 BUL_freedom_of_press_flag:0 "§YBasın Özgürlüğü§! odağını tamamladı!"
 BUL_freedom_of_press_trigger_tt:0 "Basın Sansürü Kurma'yı seçmedi"
 BUL_freedom_of_press_tt:0 "[GetBsName] ile iş birliği yapma kararlarının kilidini açar."
 BUL_full_voting_rights_for_women:0 "Kadınlar İçin Tam Oy Hakkı"
 BUL_full_voting_rights_for_women_desc:0 "Eğer ülkemizde özgürlük, eşitlik ve ilerlemenin hüküm sürmesini istiyorsak, kadınlara tam oy hakkı verme ve Bulgar Kadınlar Birliği'ni [ROOT.GetNameDef]'deki kadın sorunları konusunda toplumsal farkındalık yaratma görevinde destekleme zamanı geldi."
 BUL_full_voting_rights_for_women_ideology_tt:0 "\nMevcut ideoloji desteğine dayalı olarak Komünizm ve Demokrasi popülerliğinde değişiklik:"
 BUL_georgi_benkovski_aircraft_repair_facilities:0 "Georgi Benkovski Uçak Onarım Tesisleri"
 BUL_georgi_benkovski_aircraft_repair_facilities_desc:0 "Ulusal bir hava kuvveti inşa etmek için, uçak gövdesi onarım hangarlarının ve motor test tesislerinin inşası gereklidir. Bu bağlamda, Plovdiv'de Terem Georgi Benkovski uçak onarım tesisini kurmak için ilginç bir proje sunuldu."
 BUL_guardians_of_the_balkans:0 "Balkanların Koruyucuları"
 BUL_guardians_of_the_balkans_desc:0 "Balkanlar'daki Bulgar hegemonyasını, ona meydan okumaya cüret eden herhangi bir düşman gücüne karşı korumalıyız, bu nedenle askeri çabalarımızı iki katına çıkaracağız ve Balkanlar'daki kukla hükümetlerimizi etki alanımızın savunmasında bize yardımcı olmaları için harekete geçmeye teşvik edeceğiz."
 BUL_guardians_of_the_balkans_remove_ns_tt:0 "'§YBalkanların Kaderi§!' ulusal ruhu, hala aktifse bu odak tamamlandığında kaldırılacaktır."
 BUL_guardians_of_the_balkans_subject_ns_tt:0 "\nHer §Y[ROOT.GetAdjective] Balkan tebaası§!:"
 BUL_guardians_of_the_balkans_wargoal_tt:0 "Balkan devletlerini kontrol eden §Yherhangi bir müttefik olmayan ulusa§! karşı §YKukla Yap§! savaş hedefi kazanır:"
 BUL_has_abolished_monarchy_tt_NOT:0 "Değil: Bulgar Monarşisini kaldırdı"
 BUL_heavy_industry:0 "Ağır Sanayi"
 BUL_heavy_industry_desc:0 "Başarılı tarımsal yeniden yapılanmanın ardından, nihayet Bulgaristan'da modern ve iddialı bir sanayileşme programı yürütme konumundayız."
 BUL_historical_bulgarian_claim_flag:0 "Tarihi bir Bulgar iddiasıdır"
 BUL_historical_states_tt:0 "\nTarihi toprak iddiaları: §Y[106.GetName]§!, §Y[803.GetName]§!, §Y[77.GetName]§!, §Y[184.GetName]§!, §Y[731.GetName]§!, §Y[971.GetName]§!."
 BUL_illusions_of_a_non_partisan_system:0 "Partisiz Bir Sistem Yanılsamaları"
 BUL_illusions_of_a_non_partisan_system_desc:0 "Çar, birleşik bir Bulgaristan vizyonunu yerine getirmek için demokratik tebaasının desteğine ihtiyaç duyuyor. Popüler muhalefet partilerini yasaklı tutarak ve hükümet yanlısı adayların çoğunluğu kazanmasını sağlayarak, bir parlamento seçimi yanılsaması düzenlemeliyiz."
 BUL_improve_coastal_defenses:0 "Kıyı Savunmasını İyileştir"
 BUL_improve_coastal_defenses_desc:0 "Karadeniz'den gelebilecek herhangi bir olası deniz işgaline karşı son derece savunmasızız, Karadeniz kıyısı boyunca savunma hattımızı güçlendirmemiz zorunludur. Ne kadar erken yaparsak o kadar iyi."
 BUL_improve_the_road_system:0 "Yol Sistemini İyileştir"
 BUL_improve_the_road_system_desc:0 "Bulgar yolları, en hafif tabirle, kesinlikle az gelişmiştir, bu da iletişimi zor ve yavaş hale getirir. Mevcut yol sistemimizi iyileştirebilecek ve genişletebilecek modern bir altyapı endüstrisinin geliştirilmesi, ulaşım sorunlarımızı çözmenin yolunu açacaktır."
 BUL_increase_industry_investments:0 "Sanayi Yatırımlarını Artır"
 BUL_increase_industry_investments_desc:0 "Büyük sanayi ve askeri büyümemizi destekleyebilecek bir ağır sanayi geliştirmeliyiz. Büyük ulusal yatırımlar gerekecek, ancak bu bizi nihai ekonomik bağımsızlığımıza yaklaştıracaktır."
 BUL_industrial_autarky:0 "Sanayi Otarşisi"
 BUL_industrial_autarky_desc:0 "Korumacı reformlarımız, ülkenin ekonomisini ve sanayisini canlandırmada olağanüstü başarılı oldu, bu yüzden bu eylem rotasında devam etmeli ve Bulgaristan'ı otarşiye yaklaştıran yeni reformlar uygulamalıyız."
 BUL_industrial_investments_in_bulgaria_flag:0 "Ülke, §Y[ROOT.GetNameWithFlag]§!'da bir sanayi yatırımı yaptı!"
 BUL_integrate_the_ratniks:0 "Ratnikleri Entegre Et"
 BUL_integrate_the_ratniks_desc:0 "Ratnikler veya Bulgarlığın İlerlemesi İçin Savaşçılar Birliği, rejime destek ve ordu için önemli miktarda insan gücü sağlama konusunda çok faydalı bir araç olabilecek, yakın zamanda kurulmuş bir milliyetçi paramiliter örgüttür."
 BUL_invigorate_national_industry:0 "Ulusal Sanayiyi Canlandır"
 BUL_invigorate_national_industry_desc:0 "Altyapımızı, sanayimizi ve tarımımızı geliştirmek için çok uzun süredir yabancı sermayeye güveniyoruz. Eğer kendi kendine yeterlilik ve ülkemizi kendi bildiğimiz gibi geliştirme özgürlüğü istiyorsak, ulusal sanayiye ve yeni tesislerin geliştirilmesine yatırım yaparak başlamalıyız.\nKolay bir iş olmayacak, ama uzun vadede kesinlikle çabaya değecektir."
 BUL_is_balkan_nation_tt:0 "Balkan ulusudur"
 BUL_is_not_alone_in_faction_tt:0 "Herhangi bir ülke: §Y[ROOT.GetNameWithFlag]§! ile ittifak içindedir"
 BUL_join_the_allies:0 "Müttefiklere Katıl"
 BUL_join_the_allies_desc:0 "[ENG.GetFactionName]'e katılma arzumuzu, [ENG.GetAdjective] hükümetine [ROOT.GetNameDef]'in ittifaklarına üyeliğini düşünmeleri için bir başvuru sunarak resmileştirmeliyiz."
 BUL_join_the_tripartite_pact:0 "[GetGermanFactionName]'e Katıl"
 BUL_join_the_tripartite_pact_axis:0 "Üçlü Pakt"
 BUL_join_the_tripartite_pact_central_powers:0 "İttifak Devletleri"
 BUL_join_the_tripartite_pact_desc:0 "[GetJoinTripartitePactFocusDesc]"
 BUL_join_the_tripartite_pact_desc_axis:0 "Almanlara, [GetGermanFactionName]'i imzalamaya ve resmi olarak müttefik olarak onların ittifakına katılmaya hazır ve istekli olduğumuzu bildireceğiz."
 BUL_join_the_tripartite_pact_desc_central_powers:0 "Kayzer geri döndü ve eski ittifakımızı bir kez daha yeniden kurmaya çalışmalıyız. Bu sefer gururlu ülkelerimize yapılan yanlışları düzelteceğiz. Bu sefer hiçbir şey zafer ve büyüklük yolumuzda duramayacak. Bu sefer galip çıkacağız!"
 BUL_join_the_tripartite_pact_tt:0 "Eğer [ROOT.GetNameDef] ittifaka kabul edilirse, müttefikleri Bulgaristan tarafından talep edilen ve ittifak lideri tarafından garanti edilen herhangi bir eyaletin kontrolünü devredecektir."
 BUL_join_the_tripartite_pact_warranted_claims_tt:0 "§GGaranti edilen eyaletler:§!"
 BUL_joint_research_effort:0 "Ortak Araştırma Çabası"
 BUL_joint_research_effort_desc:0 "Askeri bir çatışmada dengeyi lehimize çevirebilecek modern silahların geliştirilmesini teşvik etmek için askeri alandaki araştırma çabalarımızı müttefiklerimizin çabalarıyla birleştirmeliyiz."
 BUL_kaproni_bulgarski:0 "Kaproni Bulgarski"
 BUL_kaproni_bulgarski_desc:0 "İtalyan uçak yapım şirketi Caproni şu anda iflasla karşı karşıya, diğer üretim zincirlerine yönlendirilen kaynak eksikliğini aşmak için mücadele ediyor. Bu, Kazanlak'taki endüstriyel kompleksi olan ve orta ve ağır bombardıman uçaklarının üretimine odaklanabileceğimiz Kaproni Bulgarski'yi satın alma olasılığını bize açıyor."
 BUL_land_reorganization:0 "Arazi Yeniden Düzenlemesi"
 BUL_land_reorganization_desc:0 "Yakın gelecekte bu sektörleri güçlendirmek için bir dizi yeni reform uygulama planlarımıza uygun olarak, bir sanayi ve tarım yeniden düzenlemesi gerçekleştirme zamanı geldi."
 BUL_land_reorganization_tt:0 "[ROOT.GetFlag][ROOT.GetNameDef] tarafından tamamen kontrol edilen her çekirdek eyalete §Y2§! İnşaat Alanı ekle:"
 BUL_legalize_the_agrarian_party:0 "Çiftçi Birliğini Destekle"
 BUL_legalize_the_agrarian_party_desc:0 "Bulgar Çiftçi Ulusal Birliği'nin ekonomik konulardaki fikirleri bizimkinden biraz farklı olabilir, ancak bu önemsiz şeyleri geride bırakırsak, üyeleri bizim politikalarımızla aynı hizaya gelebilir. Bu nedenle, bu örgütü yasallaştırmaya ve partilerimiz arasında iş birliği aramaya devam etmeliyiz, çünkü Bulgaristan'ı gerçek bir demokrasiye götüreceksek, alabileceğimiz tüm desteğe ihtiyacımız var..."
 BUL_legalize_the_agrarian_party_legalize_bzns_tt:0 "[GetBznsName] grubunu yasallaştırır, bu da gelecekte ulusun refahını aktif olarak tehdit eden muhalifleri bastırmak dışında onlara baskı yapmamızı engeller."
 BUL_legislative_elections:0 "Yasama Seçimleri"
 BUL_legislative_elections_desc:0 "Bulgar Demokrat Partisi büyük bir destek topladı ve şimdi hükümete, yıllardır maruz kaldıkları hilelerden arınmış bir şekilde parlamento seçimleri yapması için baskı yapacak konumda."
 BUL_liberalization_of_trade_policies:0 "Ticaret Politikalarının Serbestleştirilmesi"
 BUL_liberalization_of_trade_policies_desc:0 "Bulgar ekonomisi, Osmanlı İmparatorluğu'ndan bağımsızlığından bu yana bir krizden diğerine savruluyor. Otarşik politikaların geçmişte yetersiz olduğu kanıtlandı, bu yüzden ekonomik serbestleşmeye doğru ilerleme zamanı."
 BUL_liberation_of_the_proletariat:0 "Proletaryanın Kurtuluşu"
 BUL_liberation_of_the_proletariat_desc:0 "Komşu ülkelerin işçi sınıfının maruz kaldığı baskıcı rejimlere son vermek bizim görevimizdir. Bulgar halk ordusu, onları destekleyen büyük Avrupa güçlerine karşı savaşmak zorunda kalsa bile, bu zalim hükümetler devrilene kadar dinlenmeyecektir."
 BUL_liberation_of_the_proletariat_tt:0 "Herhangi bir §YFaşist§! veya §YTarafsız§! komşuya veya büyük Avrupa gücüne karşı §YHükümeti Devir§! savaş hedefi kazanır:"
 BUL_light_metal_exploitation:0 "Hafif Metal İşletmeciliği"
 BUL_light_metal_exploitation_desc:0 "Askeri sanayimiz doğal kaynaklarımız üzerinde büyük taleplerde bulunurken, yerli üretimi genişletmek için çaba gösterilmelidir. Yataklarımız küçük kalsa da, bu ihtiyaç zamanı kesinlikle onların işletilmesini gerektirir."
 BUL_limited_womens_suffrage:0 "Sınırlı Kadın Oy Hakkı"
 BUL_limited_womens_suffrage_desc:0 "Bulgar kadınları sosyal ilerleme ve eşitlik çağrısında bulunuyor ve milliyetçiler bu mücadelenin sadece bir kadın meselesi olmadığını, aynı zamanda bir sosyal kalkınma ve ulus inşası meselesi olduğunu zaten uyardılar. Bu nedenle, tam siyasi kontrolü korurken ilerleme yolunu takip etmek için, evli, komünist olmayan kadınlara şartlı oy hakları tanıyacağız."
 BUL_military_dictatorship:0 "Askeri Diktatörlük"
 BUL_military_dictatorship_desc:0 "Ülkenin tam kontrolünü ele almalı ve askeri çabalarımızı sürdürmek için gerekli önlemleri almamıza olanak tanıyan militarist bir otoriter rejim altında yönetmeliyiz."
 BUL_military_secrets_sharing:0 "Askeri Sırların Paylaşımı"
 BUL_military_secrets_sharing_desc:0 "Alman teknolojisi bizimkinden çok daha üstündür ve Bulgar bilim insanlarının ve mühendislerinin Almanya'nın teknolojik harikalarından bazılarına erişmesine olanak tanıyan bir anlaşma imzalamak bizim için çok faydalı olabilir, bu da kendi araştırmalarımızı daha da geliştirmemizin yolunu açar."
 BUL_mineral_extraction_in_the_rhodopes:0 "Rodoplar'da Mineral Çıkarma"
 BUL_mineral_extraction_in_the_rhodopes_desc:0 "Rodoplar kromit, demir cevheri, çinko ve kurşun gibi mineraller açısından zengindir ve uzmanlarımız bölgenin uygun şekilde araştırılmasının yeni yatakların keşfine yol açabileceği konusunda iyimserdir."
 BUL_modern_tactics:0 "Modern Taktikler"
 BUL_modern_tactics_desc:0 "Modern bir donanma, ondan en iyi şekilde yararlanmak için modern taktiklerin geliştirilmesini gerektirir. Ancak güçlü düşman ordularıyla karşılaştığımızda sadece donanmamıza güvenmemeliyiz, çünkü gemilerin en büyük zayıflıklarından biri hava saldırılarına karşı savunmasız olmalarıdır..."
 BUL_modernize_the_industry:0 "Sanayiyi Modernize Et"
 BUL_modernize_the_industry_bs_support_requirement_tt:0 "§Y%80§!'den fazla [GetBsName] grup sadakati"
 BUL_modernize_the_industry_desc:0 "Balkanlar içinde önde gelen sanayi gücü olarak kendimizi kurmak istiyorsak, sanayimizi modernize etmeye çalışmalıyız! Artan bütçe tahsisleri ve geliştirilmiş araçlar hayallerimizi gerçekleştirecektir."
 BUL_national_military_academy:0 "Ulusal Askeri Akademi"
 BUL_national_military_academy_desc:0 "Ulusal Askeri Akademi Başkanı, sadece kurumun kapasitesini artırmakla kalmayıp, aynı zamanda gelecekteki askeri komutanlarımız için daha iyi eğitim sağlamayı amaçlayan tesislerini genişletmek için bize bir proje sundu."
 BUL_national_railway_lines:0 "Ulusal Demiryolu Hatları"
 BUL_national_railway_lines_desc:0 "Sadece birliklerimizi değil, aynı zamanda ikmal malzemelerimizi de ülke çapında taşımak için hızlı ve güvenilir yollara ihtiyacımız var. Demiryolu hatlarımızı genişletmek lojistik yeteneklerimizi geliştirecektir."
 BUL_national_submarine_production:0 "Ulusal Denizaltı Üretimi"
 BUL_national_submarine_production_desc:0 "Donanmamız yabancı filolara meydan okuyacak ve yüzeyin üzerindeki denizlerin hakimiyetine itiraz edecek kadar zayıf. Ancak, düşman filolarını taciz edecek ve ikmal yollarını su altından tehdit edecek denizaltılar üretmeye odaklanabiliriz."
 BUL_nationalist_propaganda:0 "Milliyetçi Propaganda"
 BUL_nationalist_propaganda_combo_tt:0 "Eğer '§YBalkanların Kaderi§!' ulusal ruhu bu odak tamamlandığında hala aktifse:\n- '§YBalkanların Kaderi§!' süresini artırır (§Y+365§! gün).\n- '§YMilliyetçi Propaganda§!' ulusal ruhunun geliştirilmiş bir versiyonunu kazanır."
 BUL_nationalist_propaganda_desc:0 "Bulgar halkı arasında hâlâ Bulgaristan'ın Balkanlar'daki egemen güç rolüne karşı çıkan ve hükümetin politikalarının \"aşırı baskıcı\" olduğunu iddia eden kesimler var. Bu sesleri susturmak için hükümetimizin eylemlerini haklı çıkarmamıza ve Bulgar milliyetçiliğini yeniden alevlendirmemize yardımcı olacak bir propaganda kampanyasını finanse etmeliyiz."
 BUL_nationalization:0 "Millileştirme"
 BUL_nationalization_desc:0 "Yabancı sermaye, Bulgaristan'da daha önce Balkanlar'da görülmemiş bir ölçekte yeni sanayi kompleksleri geliştirmemize olanak sağladı. Ancak onlara sahip olan kodamanlar giderek ekonomimizi sömürüyorlar, bu yüzden üretim araçlarını ele geçirip onları ülkemizden atma zamanı geldi. Ancak, bu yabancı hükümetleri kızdıracak ve eğer diplomasi başarısız olursa, bunun için savaşmak zorunda kalabiliriz..."
 BUL_nationalization_dynamic_modifier_tt:0 "Ulusal Ruh §YYabancı Sanayi§!'yi kaldır!"
 BUL_nationalization_foreign_designers_tt:0 "§RYabancı tasarımcılar artık mevcut olmayacak ve aktifse kaldırılacaktır.§!"
 BUL_nationalization_warning_tt:0 "§RMillileştirmenin bir sonucu olarak, Bulgar sanayisine yatırım yapmış olan yabancı ülkeler ülkemize bir ticaret ambargosu uygulamaya, bizi ittifaktan atmaya ve hatta bize savaş ilan etmeye karar verebilirler!§!"
 BUL_negotiate_bulgarian_rearmament:0 "Bulgar Yeniden Silahlanmasını Müzakere Et"
 BUL_negotiate_bulgarian_rearmament_desc:0 "Bulgar ordusu, Neuilly-sur-Seine Antlaşması'nın kısıtlamaları nedeniyle perişan bir durumdadır ve herhangi bir komşu ülkeden gelecek bir işgale karşı neredeyse savunmasızdır. Açgözlü komşularımız başka bir Balkan savaşı başlatmaya karar vermeden önce, bu kısıtlamaların kaldırılmasını er ya da geç müzakere etmeliyiz."
 BUL_no_spa_flag:0 ""
 BUL_no_spr_flag:0 ""
 BUL_obliterate_the_bolshevik_threat:0 "Bolşevik Tehdidini Yok Et"
 BUL_obliterate_the_bolshevik_threat_desc:0 "Er ya da geç, komünist uluslar lanetli devrimlerini [ROOT.GetNameDef]'e getirmeye çalışacaklardır. Sürpriz unsurundan yararlanabilecekken neden Bolşevik hamlesini bekleyelim? İlk saldıran biz olmalıyız ve o kadar şiddetle saldırmalıyız ki, sevdikleri devrimleri sonsuza dek paramparça olsun!"
 BUL_obliterate_the_bolshevik_threat_wargoal_current_tt:0 "\nAşağıdaki ülkeler Avrupa'da büyük komünist ülkeler olarak kabul edilir:\n"
 BUL_obliterate_the_bolshevik_threat_wargoal_tt:0 "§YAvrupa'daki büyük komünist ülkelere§! karşı §YHükümeti Devir§! savaş hedefi kazanır."
 BUL_oppose_the_royal_dictatorship:0 "Kraliyet Diktatörlüğüne Karşı Çık"
 BUL_oppose_the_royal_dictatorship_desc:0 "[GetBulgarianTsar]'ın baskıcı rejimine son vermek istiyorsak, tamamen çarlık kuklalarından oluşan mevcut hükümete karşı önemli bir muhalefet göstermek için gerekli desteği arayarak işe başlamalıyız."
 BUL_oppose_the_royal_dictatorship_tt:0 "[GetBsName] ve [GetBznsName] ile iş birliği yapma kararlarının kilidini açar.\n[GetBsName] ve [GetBznsName]'e baskı yapma kararlarının kilidini açar."
 BUL_overthrow_the_tsar:0 "Çarı Devir"
 BUL_overthrow_the_tsar_desc:0 "Bulgaristan'da Çar karşıtı duygular yayılıyor ve bu değerli fırsatı [GetBulgarianTsar]'ı devirmek ve Bulgar monarşisini kesin olarak ortadan kaldırmak için kullanmalıyız. Modern Bulgaristan'da böyle köhne bir yönetim biçimine yer yok!"
 BUL_peaceful_development:0 "Barışçıl Kalkınma"
 BUL_peaceful_development_desc:0 "Halkımıza ölüm ve felaketten başka bir şey getirmeyecek bir savaşa neden katılalım ki, basitçe işgal altındaki Balkan bölgeleri üzerinde barış koruyucuları rolünü oynayarak, tek bir adamı bile uzak bir savaş cephesinde kesin bir ölüme göndermek zorunda kalmadan toprak kazanımları elde edebilirken?"
 BUL_peaceful_development_tt:0 "Herhangi bir Bulgar müttefiki tarafından işgal edilen komşu Balkan devletlerinin kontrolünü istemeye izin veren §YGüvenli İşgal§! kararlarının kilidini açar."
 BUL_petorka:0 "Petorkata"
 BUL_petorka_desc:0 "Çarlık, faşist veya komünist olsun, diktatör bir rejim kurmaya çalışan tüm siyasi güçlere karşı demokratik ilkeleri savunmak isteyen bizim gibi belirli siyasi gruplarla iş birliği yapma teklifi aldık. Bu koalisyon, Radikal Demokrat Parti, Ulusal Liberal Parti ve tabii ki Bulgar Demokrat Partisi dahil olmak üzere beş örgütten oluşacaktır."
 BUL_pilot_training_program:0 "Pilot Eğitim Programı"
 BUL_pilot_training_program_desc:0 "Eğer Bulgaristan göklere hakim olacaksa, geniş bir deneyimli pilot ve mürettebat havuzuna ihtiyacımız olacak ve bunu başarmak için, gerekli hava üsleri ve eğitim tesisleri tarafından desteklenen en uygun eğitim programını geliştirmeliyiz."
 BUL_plot_against_boris:0 "[GetPlotAgainstBorisFocusName]"
 BUL_plot_against_boris_death:0 "Çar Boris'in Ölümü"
 BUL_plot_against_boris_desc:0 "[GetPlotAgainstBorisFocusDesc]"
 BUL_plot_against_boris_desc_death:0 "[GetBorisDeathContext]"
 BUL_plot_against_boris_desc_plot:0 "Çar Boris'in ülkeyi büyüklüğe götürecek hükümdar olduğunu düşündük, ancak diktatörlüğe yakın otoriter rejimi, yanıldığımızı kanıtlıyor ve ülkeyi daha da istikrarsızlaştırmakla tehdit ediyor. Ulusumuzu bu değersiz hükümdardan kurtarmak ve halkın güvenine layık yeni bir hükümet kurmak, Bulgaristan'ın sadık hizmetkarları olarak bizim görevimizdir."
 BUL_plot_against_boris_plot:0 "Boris'e Karşı Komplo"
 BUL_potential_civil_war_low_requirement_tt:0 "§REğer§! §Yİstikrar§! §Rbu odak tamamlandığı sırada§! §Y%30'un altındaysa§!, §Rbir iç savaş başlayacaktır!§!"
 BUL_power_to_the_tsar:0 "İktidar Çar'a"
 BUL_power_to_the_tsar_desc:0 "Zveno, 1935'te Çar III. Boris tarafından devrilmeden önce otoriter bir askeri rejim kurmuştu. Ancak Çar bu güç merkezileşmesini korudu ve parçalanmış bir ulusu birleştireceksek, bundan iyi bir şekilde yararlanma zamanı geldi."
 BUL_power_to_the_tsar_tt:0 "[GetBsName] ve [GetBznsName]'e baskı yapma kararlarının kilidini açar.\n[GetBznsName] ile iş birliği yapma kararlarının kilidini açar."
 BUL_promote_bulgarian_nationalism:0 "Bulgar Milliyetçiliğini Teşvik Et"
 BUL_promote_bulgarian_nationalism_desc:0 "Ulusumuza hem yurtdışından hem de yurtiçinden sayısız tehdit olabilir, ancak eğer biz Bulgarlar bir arada durur ve omuz omuza çalışırsak, önümüzdeki çalkantılı zamanlarda galip geleceğiz!"
 BUL_prussia_of_the_balkans:0 "Balkanların Prusyası"
 BUL_prussia_of_the_balkans_desc:0 "İlk yıllarında, Bulgaristan Çarlığı, büyük ve iyi donanımlı bir orduya sahip, ağır bir şekilde askerileştirilmiş bir devletti ve Balkanların Prusyası olarak tanımlanıyordu, ta ki eski, hain müttefikleri tarafından ihanete uğrayana kadar. Ancak, geçmişin aşağılayıcı yenilgilerinden sonra ülkemizi yeniden inşa ettik ve şimdi Bulgaristan'ın eski ihtişamını geri kazanma zamanı geldi. Dünya bizi bir kez daha Balkanların Prusyası olarak adlandıracak!"
 BUL_purge_the_elites:0 "Elitleri Tasfiye Et"
 BUL_purge_the_elites_desc:0 "Bulgaristan'ın ayrıcalıklı sınıflarının servetlerini biriktirmeyi bırakma zamanı geldi. Eğer ülkemizin ve ekonomisinin refaha kavuşmasını istiyorsak, zenginlerin sahip olduklarını bankalarla değil, hiçbir şeyi olmayanlarla paylaşması gereklidir."
 BUL_rebuild_the_army:0 "Orduyu Yeniden İnşa Et"
 BUL_rebuild_the_army_desc:0 "Tarihin bize acı bir şekilde öğrettiği gibi, potansiyel düşmanlarla çevriliyiz ve gelecekteki herhangi bir çatışmada galip gelmek istiyorsak güçlü bir ordu kurmamız ve modern taktikler geliştirmemiz çok önemlidir."
 BUL_recover_italian_territories:0 "İtalyan Topraklarını Geri Al"
 BUL_recover_italian_territories_desc:0 "İtalya'nın toprak emelleri daha da ileri gitmeden önce, İtalyan hükümetinden Balkanlar'daki işgal altındaki topraklarının kontrolünü meşru olarak ait olduğu ülkelere devretmesini talep etmeliyiz, aksi takdirde sonuçlarına katlanırlar."
 BUL_recover_italian_territories_ita_will_refuse_tt:0 "\n[ITA.GetFlag]§Y[ITA.GetNameDefCap]§!, §Rşu anda Balkanlar'daki topraklarını teslim etmeyi reddedecektir çünkü§! §Y[ITA.GetFlag][ITA.GetNameDef]§! §Rveya§! §Yherhangi bir [ITA.GetAdjective] müttefiki§! [ROOT.GetFlag]§Y[ROOT.GetNameDef]§! §Rile savaş halindedir§!"
 BUL_reinforce_naval_bases:0 "Deniz Üslerini Güçlendir"
 BUL_reinforce_naval_bases_desc:0 "Deniz üslerimizin iyi korunduğundan ve bölgede faaliyet gösteren filolarımızı idame ettirme kapasitesine sahip olduğundan emin olmalıyız."
 BUL_reinforce_naval_bases_tt:0 "Eğer [BUL.GetNameDef] tarafından tamamen kontrol ediliyorsa, §Y[211.GetName]§!, §Y[77.GetName]§!, §Y[184.GetName]§!, §Y[731.GetName]§!'e §Y2 Kara Kalesi§!, §Y2 Kıyı Kalesi§!, §Y1 Uçaksavar§! ve §Y2 Deniz Üssü§! ekle. \nMevcut etkiler:"
 BUL_remove_tsar_loyalist_trait_tt:0 "Lider Özelliği §YÇar Sadakati§!'ni kaldır."
 BUL_reorganize_the_military_industry:0 "Askeri Sanayiyi Yeniden Düzenle"
 BUL_reorganize_the_military_industry_desc:0 "Askeri sanayimiz modası geçmiş ve verimsizdir, şu anda köhne olan teçhizatı üretmek üzere tasarlanmıştır. Çok geç olmadan bir modernizasyon programı yürütmeliyiz."
 BUL_replace_national_naval_designer_tt:0 "§Y$BUL_varna_naval_dockyard$§!'ı şu şekilde değiştir \n$MODIFIER_INDUSTRIAL_REFIT_SPEED_FACTOR$: §G+%10§! \n$MODIFIER_REPAIR_SPEED_FACTOR$: §G+%5§! \n$naval_equipment_research$: §G+%5§!\n\n"
 BUL_research_sharing:0 "Araştırma Paylaşımı"
 BUL_research_sharing_desc:0 "Ülkemiz bilimsel araştırma alanında geride kalmıştır. Eğer son teknoloji savaş makineleri üretmek ve modern bir sanayi geliştirmek istiyorsak, müttefiklerimize teknolojik bir iş birliği programı uygulanmasını önermeliyiz."
 BUL_restore_the_bulgarian_patriarchate:0 "Bulgar Patrikhanesini Restore Et"
 BUL_restore_the_bulgarian_patriarchate_desc:0 "Konstantinopolis Patriği, Bulgar Kilisesi'nin otosefalliğini tanıması ve Bulgar Ortodoks Kilisesi Kutsal Sinodu'nun bir Metropolit seçmesine izin verecek gerekli düzenlemeleri yapması için baskı altına alınmalıdır, ki bu da Bulgar Patriği olacaktır."
 BUL_restore_the_tarnovo_constitution:0 "Tırnovo Anayasasını Geri Getir"
 BUL_restore_the_tarnovo_constitution_desc:0 "1934 darbesinden bu yana, devlet fiilen askıya alınmış bir anayasa altında yönetilmektedir. Sadece vatandaşlarımızı memnun etmekle kalmayacak, aynı zamanda otoriter rejimimizi yasal olarak destekleyecek olan Tırnovo Anayasasını resmi olarak restore etme zamanı geldi."
 BUL_restrained_paramilitary_organizations:0 "Kontrol Altındaki Paramiliter Örgütler"
 BUL_restrained_paramilitary_organizations_desc:0 "Paramiliter örgütlerin üyeleri, zaten bir tür askeri disipline sahip sadık bireylerdir ve ülkemizin daha büyük zaferi için savaşmaya hazır olacaklardır. Eğer bu örgütleri cezbedebilirsek, güvenilir bir insan gücü kaynağı haline gelebilirler."
 BUL_restrained_paramilitary_organizations_tt:0 "[GetNsmName] ile iş birliği yapma kararlarının kilidini açar."
 BUL_seek_cooperation_with_the_tsar:0 "Çar ile İşbirliği Ara"
 BUL_seek_cooperation_with_the_tsar_desc:0 "Çar hala hükümet içinde çok fazla güce sahip ve kışkırtılırsa tüm tekliflerimizi engelleyebilir, bu yüzden en iyi seçeneğimiz, hükümetteki nüfuzumuzu yavaş yavaş artırırken onunla iş birliği yapmaya çalışmaktır."
 BUL_simeon_is_1:0 "sadece bir yaşında"
 BUL_simeon_is_2:0 "sadece iki yaşında"
 BUL_simeon_is_3:0 "sadece üç yaşında"
 BUL_simeon_is_4:0 "sadece dört yaşında"
 BUL_simeon_is_5:0 "sadece beş yaşında"
 BUL_simeon_is_6:0 "sadece altı yaşında"
 BUL_simeon_is_7:0 "sadece yedi yaşında"
 BUL_simeon_is_8:0 "sadece sekiz yaşında"
 BUL_simeon_is_9:0 "sadece dokuz yaşında"
 BUL_simeon_is_super_baby:0 "bir yaşından küçük"
 BUL_simeon_is_underage:0 "reşit değil"
 BUL_soviet_bulgarian_treaty_of_mutual_assistance:0 "Sovyet-Bulgar Karşılıklı Yardım Antlaşması"
 BUL_soviet_bulgarian_treaty_of_mutual_assistance_desc:0 "[SOU.GetNameDef], ekonomimizi canlandırabilecek ve bu zor zamanlarda [ROOT.GetNameDef]'in toprak bütünlüğünü sağlamamıza yardımcı olabilecek güçlü bir müttefiki temsil ediyor. Etrafımızı saran birçok düşmana karşı galip gelmek istiyorsak, [SOU.GetAdjective] hükümetiyle bağları güçlendirmeye ve değerli desteğini kazanmaya çalışmalıyız."
 BUL_soviet_bulgarian_treaty_of_mutual_assistance_tt:0 "\nEğer [SOV.GetNameDefCap] teklifimizi kabul ederse:"
 BUL_soviet_bulgarian_war_industry:0 "Sovyet-Bulgar Savaş Sanayisi"
 BUL_soviet_bulgarian_war_industry_desc:0 "Büyük bir orduyu destekleyebilecek ulusal bir askeri sanayinin temellerini atmak istiyorsak, modern silahların geliştirilmesi ve üretiminde daha fazla Sovyet iş birliği çağrısında bulunmalıyız."
 BUL_soviet_bulgarian_war_industry_research_sharing_tt:0 "Teknoloji Paylaşım Grubundan Araştırma Bonusu §G%5§! artar."
 BUL_soviet_military_exercises:0 "Sovyet Askeri Tatbikatları"
 BUL_soviet_military_exercises_desc:0 "Askeri kuvvetlerimizin yetenekli ve disiplinli Kızıl Ordu'dan öğreneceği çok şey var. Sovyet modelinden esinlenen bir askeri eğitim programı geliştirmemize yardımcı olmak için [SOV.GetNameDef]'den askeri danışmanları [ROOT.GetNameDef]'e davet etmeliyiz."
 BUL_spa_flag:0 "[SPA.GetFlag]"
 BUL_spd_flag:0 "[SPD.GetFlag]"
 BUL_spr_flag:0 "[SPR.GetFlag]"
 BUL_stability_impact_tt:0 "§YKomünizm§! desteğine ve [GetBsName] §YPopülerliğine§! bağlı olarak istikrar kaybedecektir!"
 BUL_state_is_in_the_adriatic_sea_tt:0 "Eyalet Adriyatik Denizi'ndedir"
 BUL_state_is_in_the_aegean_sea_tt:0 "Eyalet Ege Denizi'ndedir"
 BUL_state_is_in_the_black_sea_tt:0 "Eyalet Karadeniz'dedir"
 BUL_steel_plant_in_pernik:0 "Pernik'teki Çelik Fabrikası"
 BUL_steel_plant_in_pernik_desc:0 "Bulgaristan, kaynaklar açısından Balkanların en zengin ülkesi değildir ve bu yüzden toprağımızın sakladığı hazinelerden en iyi şekilde yararlanmalıyız. Pernik'teki demir tesislerimizi ve kömür çıkarma tesislerimizi iyileştirmeli ve ilk çelik üretim tesisimizi orada inşa etmeliyiz."
 BUL_strengthen_the_royal_dictatorship:0 "Kraliyet Diktatörlüğünü Güçlendir"
 BUL_strengthen_the_royal_dictatorship_desc:0 "Boris'e sadakati teşvik etmeye ve rejime yönelik tüm muhalefeti ortadan kaldırmaya odaklanmalıyız. Böylece, Birleştirici Çar'ın nihayet sevgili ulusumuzun hak ettiği ihtişamı getirmesinin yolunu açarız."
 BUL_strike_from_the_seas:0 "Denizlerden Saldır"
 BUL_strike_from_the_seas_desc:0 "Akdeniz ve Karadeniz kıyıları boyunca sayısız ada ve çok sayıda stratejik konum bulunmaktadır. Bu nedenle, denizden saldırabilecek ve büyük taarruzlar başlatmak için bu kilit konumları alabilecek yeterli nakliye araçlarına sahip sağlam bir güce ihtiyacımız var."
 BUL_support_macedonian_organizations:0 "Makedon Örgütlerini Destekle"
 BUL_support_macedonian_organizations_desc:0 "Eğer Makedonya'yı birleştirme ve ilhak etme hayallerimizi gerçekleştirmek istiyorsak, gelecekte potansiyel bir Bulgar işgalinin yolunu açabilecek sürgündeki IMRO liderleriyle iş birliği yapmak bizim için daha faydalı olacaktır."
 BUL_support_macedonian_organizations_rearmament_tt:0 "\n§RBu odağı tamamlamak Balkanları istikrarsızlaştırmayı içerir, bu da§! §YBarış Politikalarımızı Göster§! §Ryeniden silahlanma kararını§! §Y[ROOT.GetNameWithFlag]§! için kullanılamaz hale getirir."
 BUL_support_macedonian_organizations_tt:0 "§YMakedon Devrimci Örgütlerini Destekle§! kararlarının kilidini açar."
 BUL_support_the_spanish_coup:0 "İspanyol Darbesini Destekle"
 BUL_support_the_spanish_coup_desc:0 "Bolşevizme karşı savaşın ilk tiyatrosu İspanya'dır. Eğer askeri ayaklanmayı resmi olarak destekler ve isyancı tarafı desteklemek için bir grup gönüllü organize edersek, İspanya iç savaşı birliklerimiz için mükemmel bir deneme alanı olabilir."
 BUL_support_the_spanish_coup_tt:0 "İspanya İç Savaşı'nda savaşan bir general, İspanya iç savaşı sona erdiğinde §YSaha Mareşali§!'ne terfi ettirilecek, §G1§! Beceri Seviyesi ekleyecek ve rastgele bir §YÖzellik§! alacaktır. §RGönüllüleri§! §Y[GetNationalistSpainFlag]Milliyetçi İspanya§!'ya göndermeyi gerektirir."
 BUL_supremacy_on_the_bosporus:0 "Boğaziçi'nde Üstünlük"
 BUL_supremacy_on_the_bosporus_desc:0 "Artık Boğaziçi Boğazı'nın kontrolü altındayken, bu kilit stratejik bölge üzerinde Bulgar hakimiyetini sağlamak için yeterli tahkimatlar inşa etmeliyiz."
 BUL_the_anti_capitalist_fight:0 "Anti-Kapitalist Mücadele"
 BUL_the_anti_capitalist_fight_desc:0 "Tarih boyunca, sözde büyük Avrupa demokrasileri, kendi çıkarlarına hizmet ederek ve neden oldukları kanlı çatışmalara kayıtsız kalarak Balkan ülkelerinin ekonomisine ve sınırlarına müdahale ettiler. Ama artık o çürümüş kapitalistlerin yok olma zamanı geldi, çünkü şimdi Bulgaristan'ın onların ekonomilerini, hükümetlerini ve sınırlarını dikte etme sırası."
 BUL_the_anti_capitalist_fight_ns_tt:0 "\nAşağıdaki ülkeler Avrupa'da Büyük Demokrasiler olarak kabul edilir:\n"
 BUL_the_anti_capitalist_fight_wargoal_tt:0 "§YAvrupa'daki büyük demokrasilere§! karşı §YHükümeti Devir§! savaş hedefi kazanır."
 BUL_the_eastern_front:0 "Doğu Cephesi"
 BUL_the_eastern_front_desc:0 "Şimdiye kadar, vatandaşlarımız Bulgar halkının kurtarıcılarına karşı herhangi bir düşmanlığa izin vermekte isteksizdi. Ancak müttefiklerimiz ile [SOV.GetNameDef] arasındaki yıkıcı savaş, şimdi Doğu Cephesi'ne katılma teklifimizi destekleyen birçok eski muhalifin zihniyetini değiştirdi."
 BUL_the_eastern_front_join_war_tt:0 "§Y[ROOT.GetNameDefCap]§!, §Y[SOV.GetNameDef]§!'e karşı savaşlarında müttefiklerine katılır!"
 BUL_the_eastern_front_stab_tt:0 "§YKomünizm Desteğine§! bağlı olarak Temel İstikrar kaybet!"
 BUL_the_eastern_front_ws_tt:0 "§YFaşizm Desteğine§! bağlı olarak Temel Savaş Desteği kazan!"
 BUL_the_fate_of_the_balkans:0 "Balkanların Kaderi"
 BUL_the_fate_of_the_balkans_desc:0 "Bulgaristan, çok uzun süredir komşu ülkelerinin ve onları destekleyen büyük Avrupa güçlerinin iradesine boyun eğdi... Ama zaman değişti, ülkemiz başka hiçbir Balkan ulusunun olmadığı kadar güçlendi ve Bulgaristan nihayet üstünlüğünü ortaya koyup etrafındaki acınası devletleri boyunduruk altına alacak kadar güçlü."
 BUL_the_fatherland_front:0 "Vatan Cephesi"
 BUL_the_fatherland_front_bzns_support_requirement_tt:0 "§Y%50§!'den fazla [GetBznsName] grup sadakati"
 BUL_the_fatherland_front_communist_support_tt:0 "([GetZvenoName] ve [GetBznsName] gruplarını entegre etmek Komünist Desteğini daha da artıracaktır)"
 BUL_the_fatherland_front_desc:0 "Çok sayıda siyasi gruptan önemli destek topladıktan sonra, anti-faşist cephemizin kendi başına bir siyasi hareket haline gelme zamanı geldi; tüm bu farklı siyasi örgütlerin üyelerini, Bulgaristan'da faşizme her ne pahasına olursa olsun direnmeye kararlı tek bir partide birleştiriyor."
 BUL_the_fatherland_front_zveno_support_requirement_tt:0 "§Y%50§!'den fazla [GetZvenoName] grup sadakati"
 BUL_the_path_towards_a_greater_bulgaria:0 "Büyük Bulgaristan'a Giden Yol"
 BUL_the_path_towards_a_greater_bulgaria_desc:0 "Ekonomimizi, Bulgar ordusunun yakın zamanda seferberliğine dayanabilecek şekilde ayarlamaya başlamalıyız. Çünkü büyük bir Bulgaristan'a giden yol savaş ve çatışmalarla doludur."
 BUL_the_peoples_militia_directorate:0 "Halk Milisleri Müdürlüğü"
 BUL_the_peoples_militia_directorate_desc:0 "İçişleri Bakanlığı'nın doğrudan kontrolü altında, siyasi güvenlik, kamu düzenini sağlama ve ceza soruşturmaları yürütmekle görevli bir Halk Milisleri Müdürlüğü kuracağız."
 BUL_the_peoples_republic_of_bulgaria:0 "Bulgaristan Halk Cumhuriyeti"
 BUL_the_peoples_republic_of_bulgaria_bs_support_requirement_tt:0 "§Y%50§!'den fazla [GetBsName] grup sadakati"
 BUL_the_peoples_republic_of_bulgaria_desc:0 "Artık Bulgar monarşisinden kurtulduğumuza göre, ulusumuzun yönetiminde çok ihtiyaç duyulan bazı değişiklikler yapmalıyız. Ülkeyi bunca yıldır saran despotizm ve baskı dönemine son verme ve Bulgaristan Halk Cumhuriyeti'ni kurma zamanı geldi. \nBirlikten kuvvet doğar!"
 BUL_the_return_of_ferdinand_i:0 "Çar I. Ferdinand'ın Dönüşü"
 BUL_the_return_of_ferdinand_i_desc:0 "İlerlemiş yaşına ve 1918'de Büyük Savaş'ta Bulgar yenilgisinden sonra tahttan çekilmek zorunda kalmasına rağmen, eski Çar I. Ferdinand'ın siyasi deneyimi ve askeri becerisi onu ulusu büyüklüğe götürmek için en uygun aday yapıyor. Ferdinand'ı Bulgar tahtına geri getirmek için gerekli düzenlemeleri yapmalıyız."
 BUL_the_return_of_ferdinand_opinion_tt:0 "§YEski Düşmanlar§! kazanır (Görüş: [GRE.GetFlag]§Y[GRE.GetNameDef]§!, [ROM.GetFlag]§Y[ROM.GetNameDef]§!, [YUG.GetFlag]§Y[YUG.GetNameDef]§!, [TUR.GetFlag]§Y[TUR.GetNameDef]§! §R-25§!)"
 BUL_the_salonika_agreement:0 "Selanik Anlaşması"
 BUL_the_salonika_agreement_desc:0 "Bulgaristan'ın tek başına, ülkemizle yüzleşmek için kurulan Balkan Antantı'nı oluşturan uluslara herhangi bir tehdit oluşturmadığı açıktır, bu yüzden komşularımızla dostane ilişkileri yeniden kurmaya çalışmalıyız ve [GRE.GetNameDef] lideri [GRE.GetLeader] ile bir anlaşma imzalamaktan daha iyi bir başlangıç yolu olabilir mi?"
 BUL_the_salonika_agreement_event_effects_tt:0 "\nEğer [GRE.GetNameWithFlag] kabul ederse etkiler:"
 BUL_the_spanish_struggle:0 "İspanyol Mücadelesi"
 BUL_the_spanish_struggle_desc:0 "İspanyol yoldaşlarımız, Avrupa'daki diğer sağcı güçlerin desteği sayesinde Cumhuriyetçi hükümeti yenmekle ciddi şekilde tehdit eden faşist pisliklerle karşı karşıya. \nBu tür bir vahşet karşısında, [ROOT.GetNameDef] başka yöne bakamaz. Özgürlük savunmasında İspanyol milisleriyle omuz omuza savaşacak gönüllü tugayları organize etmeliyiz."
 BUL_the_spanish_struggle_tt:0 "§YHava Kuvvetleri Komutanı§!, §YZachari Zachariev§!, Bulgar gönüllü havacılık grubunun bir avcı pilotu olarak İspanya İç Savaşı'nda savaşmak üzere gönderilecektir. §RGönüllüleri§! §Y[GetSpanishRepublicFlag]Cumhuriyetçi İspanya§!'ya göndermeyi gerektirir."
 BUL_the_third_bulgarian_empire:0 "Üçüncü Bulgar İmparatorluğu"
 BUL_the_third_bulgarian_empire_desc:0 "Zafer ve büyüklük yolumuzda son adımı atmalıyız. Geçmişte Bulgaristan'ı küçümseyen ülkeler, kudretli ulusumuzun üstünlüğünü kabul etmekten başka seçeneği olmayacak. \nÜçüncü Bulgar İmparatorluğu'nu ilan etme zamanı geldi!"
 BUL_the_third_bulgarian_empire_tt:0 "Bulgaristan tarafından geri alınan ve çekirdek yapılan üç tarihi eyalete §G1§! İnşaat Alanı, §Y1 Sivil Fabrika§! ve §Y1 Altyapı§! ekler."
 BUL_the_tsars_regime:0 "Çar'ın Rejimi"
 BUL_the_tsars_regime_desc:0 "Ülkemiz birden fazla fraksiyona, sosyal harekete ve yasaklanmış siyasi örgüte bölünmüş durumda. Çar, sonunda Bulgaristan'a uyum ve istikrar getirecekse tam yetkisini dayatmalıdır."
 BUL_the_unification_of_the_balkans:0 "Balkanların Birleşmesi"
 BUL_the_unification_of_the_balkans_cores_tt:0 " §YHer Balkan eyaletinde§! çekirdek kazanır:"
 BUL_the_unification_of_the_balkans_desc:0 "Tüm vatandaşların eşit olduğu ve köken, kültür veya inanç farkı gözetmeksizin özgürce hareket edebildiği birleşik ve bağımsız bir Balkan Federasyonu vizyonumuzu gerçekleştirme zamanı geldi."
 BUL_the_unification_of_the_balkans_event_tt:0 "\n[ROOT.GetFlag]§Y[ROOT.GetNameDef]§! ile müttefik olan herhangi bir Balkan ulusu, §Y'Balkanların Birleşmesi'§! etkinliğini alacaktır.\n[TUR.GetAdjective] topraklarıyla ilgili kararların kilidini açar."
 BUL_toppling_giants:0 "Devleri Devirmek"
 BUL_toppling_giants_desc:0 "Tarih boyunca, yükselen uluslar büyük ve uzun süredir devam eden imparatorlukları devirmiştir. Eğer [ROOT.GetNameDef], Avrupa'da bir sonraki büyük güç olacaksa, önce elimizin altındaki diğer güçlerin hegemonyasına meydan okumalıyız."
 BUL_toppling_giants_ns_targets_tt:0 "\n[ROOT.GetFlag]§Y[ROOT.GetNameDef]§!'e komşu olan büyük Avrupa ülkeleri:"
 BUL_toppling_giants_wargoal_1_tt:0 "Şuna karşı §YKukla Yap§! savaş hedefi kazanır:"
 BUL_toppling_giants_wargoal_2_tt:0 "§Y[ROOT.GetFlag][ROOT.GetNameDef]'e komşu olan herhangi bir büyük Avrupa ülkesine§! karşı §YKukla Yap§! savaş hedefi kazanır."
 BUL_total_war:0 "Topyekûn Savaş"
 BUL_total_war_desc:0 "Savaş çabamızı sürdürmek için bir petrol kaynağı sağlamak amacıyla Romanya'daki toprak iddialarımızı resmileştirmeliyiz, çünkü [ROOT.GetNameDef] nihayet müttefiklerinin düşmanlarına karşı topyekûn savaş açmaya hazır."
 BUL_total_war_join_wars_tt:0 "§Y[ROOT.GetNameWithFlag]§!, §Rittifak liderinin düşmanlarına karşı tüm savaşlara katılacaktır, §Y[SOV.GetNameWithFlag]§! hariç.§!"
 BUL_total_war_wargoal_expires_tt:0 "Savaş hedefi sona erme süresi: §R180 gün§!"
 BUL_train_the_youth_wings:0 "Gençlik Kollarını Eğit"
 BUL_train_the_youth_wings_desc:0 "Silahlı kuvvetlerimizdeki insan gücü açığını telafi etmek için, gençlik kollarımızın üyelerine silah kullanımı ve askeri taktikler konusunda temel eğitim kursları sağlamalıyız, böylece gerekirse saflarımızı takviye edebilirler."
 BUL_treaty_of_perpetual_friendship:0 "Ebedi Dostluk Antlaşması"
 BUL_treaty_of_perpetual_friendship_claims_tt:0 "§RBulgaristan, §Y[YUG.GetNameWithFlag]§!'daki herhangi bir toprak iddiasından feragat edecektir.§!"
 BUL_treaty_of_perpetual_friendship_desc:0 "Balkanlar'daki komşularımızla iyi ilişkiler geliştirmenin bir ilk adımı olarak, Yugoslav hükümetine, ülkelerimiz arasında iş birliğinin temelini oluşturan ve [ROOT.GetNameDef]'in [YUG.GetNameDef]'deki irredentist iddialarından nihayet vazgeçtiği bir antlaşma imzalama teklifiyle yaklaşmalıyız."
 BUL_treaty_of_perpetual_friendship_event_effects_tt:0 "\nEğer [YUG.GetNameWithFlag] kabul ederse etkiler:"
 BUL_treaty_of_perpetual_friendship_tt:0 "\nEğer [YUG.GetNameDefCap] teklifimizi kabul ederse:"
 BUL_tsar_boris_is_dead_flag:0 "Çar III. Boris öldü"
 BUL_tsar_is_boris:0 "Çar Boris"
 BUL_tsar_is_ferdinand:0 "Çar Ferdinand"
 BUL_tsar_is_simeon:0 "Naiplik Konseyi"
 BUL_tsar_is_unknown:0 "Bulgar Çarlığı"
 BUL_unify_the_bourgeois_movement:0 "Burjuva Hareketini Birleştir"
 BUL_unify_the_bourgeois_movement_desc:0 "Bulgaristan'da faşizmle savaşmak istiyorsak, burjuva hareketini ortak bir harekette birleştirmeliyiz. Bunu başarmak için, Bulgar Komünist Partisi, aramızdaki farklılıkları daha büyük bir iyilik için geride bırakarak sosyalistlerle iş birliği aramalıdır."
 BUL_united_front_against_fascism:0 "Faşizme Karşı Birleşik Cephe"
 BUL_united_front_against_fascism_desc:0 "Burjuva hareketini birleştirdikten sonraki adım, 1935'teki 7. Komintern Kongresi tarafından önerilen bir taktik olan anti-faşist bir blok oluşturmaktır. Bulgar faşizmine karşı cephemize katılmaları için çiftçilere ve hatta demokratlara başvurmalıyız."
 BUL_united_we_shall_prevail:0 "Birleşirsek Galip Geliriz!"
 BUL_united_we_shall_prevail_desc:0 "Balkanlar uzun süredir yabancı uluslara boyun eğdi, ama şimdi halklarımızın işgalcilere karşı güçlerini birleştirme ve haklı olarak bize ait olan topraklar için savaşma zamanı."
 BUL_united_we_shall_prevail_tt:0 "[BUL.GetFlag][BUL.GetNameDefCap] ve herhangi bir Balkan komünist müttefiki, (Tümen Organizasyonu: §G+%10§!, Çekirdek topraklarda Tümen Saldırısı: §G+%15§!, Çekirdek topraklarda Tümen Savunması: §G+%15§!) veren Ulusal Ruh §YBalkanlar Birleşti§!'yi kazanır."
 BUL_uranium_prospecting:0 "Uranyum Arama"
 BUL_uranium_prospecting_desc:0 "Uranyum, güçlü ve yıkıcı yeni silahlar yaratmak için son derece değerli bir kaynak haline geliyor ve Buhovo'da potansiyel olarak zengin yataklar keşfettik. Bölgeyi araştırmalı ve kaynaktan kendimiz yararlanmanın mı yoksa işletme haklarını müttefiklerimize vermenin mi bizim için daha faydalı olacağını düşünmeliyiz."
 BUL_uranium_prospecting_leader_target_tt:0 "Kararın kilidini açar: §YUranyum İmtiyaz Anlaşması§!, Bulgar ittifak liderine bonuslar verir."
 BUL_uranium_prospecting_major_ally_target_tt:0 "Kararın kilidini açar: §YUranyum İmtiyaz Anlaşması§!, Bulgar büyük müttefiklerine bonuslar verir."
 BUL_uranium_prospecting_no_target_tt:0 "Kararın kilidini açar: §YUranyum İmtiyaz Anlaşması§!, Bulgar ittifak liderine veya büyük müttefikine bonuslar verir. §RBulgaristan'ın bir ittifakta olmasını gerektirir.§!"
 BUL_utmost_optimization:0 "Azami Optimizasyon"
 BUL_utmost_optimization_desc:0 "Ulusal sanayimizin geliştirilmesini önceliklendirerek, üretimde sürekli bir artış yaşadık ve henüz çok verimli olmasalar da birçok yeni sanayi hızla gelişti. Hem sanayide hem de tarımda maksimum verimliliği sağlamamıza olanak tanıyacak büyük bir sanayi ve arazi yeniden düzenlemesi üstlenerek son çabayı gösterme zamanımız geldi."
 BUL_utmost_optimization_dynamic_modifier_tt:0 "§YYabancı Sanayi§!'yi şu şekilde değiştir\nİnşaat Hızı: §G+%5§!\n£GFX_prod_eff_cap Üretim Verimliliği Sınırı: §G+%3§!\n£GFX_prod_eff Üretim Verimliliği artışı: §G+%3§!"
 BUL_utmost_optimization_tt:0 "§YYabancı Sermayeyi Çek§! odağı tamamlanırsa etkiler değişecektir."
 BUL_vasil_levsky_national_military_university:0 "Vasil Levski Ulusal Askeri Üniversitesi"
 BUL_vasil_levsky_national_military_university_desc:0 "Ulusal Askeri Üniversitesi'nin uzun bir tarihi var, ancak askeri eğitimi Neuilly Antlaşması'nın dayatılmasından bu yana büyük ölçüde azaldı. Tesislerini genişletmek ve sonunda başarılı subaylar olacak yeni Harbiyelilerin kaydını teşvik etmek için bir proje finanse etme zamanı geldi."
 BUL_war_industry:0 "Savaş Sanayisi"
 BUL_war_industry_desc:0 "Savaşta bir ordu, sürekli bir teçhizat, silah ve uçak akışına ihtiyaç duyar. Eğer bu çatışmadan galip çıkacaksak, kuvvetlerimizi beslemek için askeri üretimimizi artırmamız gerekiyor."
 BUL_war_logistics:0 "Savaş Lojistiği"
 BUL_war_logistics_desc:0 "Büyük Savaş'ı savaş alanındaki yenilgiler yüzünden değil, halkımızı besleyememe ve birliklerimizi ikmal edememe yüzünden kaybettik. Bunun bir daha asla olmasını önlemek için lojistiğimizi geliştirmeliyiz."
 GRE_ACHIEVING_ENOSIS_FOCUS_DESCRIPTION_ALTERNATE:0 "Kıbrıs her zaman Helen olmuştur ve olacaktır. Belki de Britanyalılar birleşme şansımızı elimizden aldığında hazır değildik, ama şimdi Kıbrıs bağımsızlığını kazandığına göre, geçmişteki yanlışları düzeltme zamanı kesinlikle geldi! Bu özyönetim hayalleri kibir noktasına varan sanrılardır; şüphesiz Kıbrıslılar, Helen ulusunun ayrılmaz bir parçası olarak yuvalanmış halde en güvende olduklarını görmelidirler."
 GRE_ACHIEVING_ENOSIS_FOCUS_DESCRIPTION_STANDARD:0 "Kıbrıs her zaman Helen olmuştur ve olacaktır. Belki de Britanyalılar birleşme şansımızı elimizden aldığında hazır değildik, ama şimdi devletimiz halkımızın birliği için kesinlikle yeterince güçlü ve istikrarlı! Kıbrıs adasının ait olduğu Yunan ulusuna dahil edilebilmesi için Kıbrıs'taki yabancı işgaline son verme zamanı geldi."
 GRE_AUS_is_HUN_EMPIRE_tt:0 "Avusturya, §Y$HUN_EMPIRE_neutrality$§!'nı kurdu!"
 GRE_BEDROCK_FINANCIAL_STABILITY_FOCUS_NAME_COMMUNIST:0 "Balkan Ekonomik Yolsuzluğunun Sığınağı"
 GRE_BEDROCK_FINANCIAL_STABILITY_FOCUS_NAME_STANDARD:0 "Balkan Mali İstikrarının Temeli"
 GRE_COOPERATE_FOREIGN_MONOPOLIES_FOCUS_NAME_COMMUNIST:0 "Yabancı Monopolleri Millileştir"
 GRE_COOPERATE_FOREIGN_MONOPOLIES_FOCUS_NAME_STANDARD:0 "Yabancı Monopollerle İş Birliği Yap"
 GRE_FISCAL_RESPONSIBILITY_FOCUS_NAME_COMMUNIST:0 "Yaygın Servet Yeniden Dağıtımı"
 GRE_FISCAL_RESPONSIBILITY_FOCUS_NAME_STANDARD:0 "Mali Sorumluluk"
 GRE_NENIKIKAMEN_FOCUS_DESCRIPTION_BYZANTINE:0 "Kazandık! Bizans'ın intikamı, bunca yıldan sonra alındı! Eski imparatorluk başkentimizi geri alarak, kaderimize bir adım daha yaklaştık! Yunanistan için yeni bir çağın eşiğindeyiz - kan ve ateşten doğan bir çağ! Kosmidis Nikas!"
 GRE_NENIKIKAMEN_FOCUS_DESCRIPTION_STANDARD:0 "Kazandık! Venizelos bunca yıldan sonra nihayet aklandı! Megali İdea, hayır diyenlerin ve kaderimizi engellemek isteyenlerin üzerine galip geldi ve şimdi Yunanistan için yeni bir çağın eşiğindeyiz - bir Altın Çağ!"
 GRE_PETITION_FOR_AID_FOCUS_DESCRIPTION_MONARCHIST:0 "Ayaktakımı, sivil itaatsizlikleri ve iç savaş tehditleriyle Kral'ın yönetimine olan hafif hoşnutsuzluklarını belli ettiler. Düşmanlarımız şimdilik üstün durumda, bu yüzden savaşımızda müttefiklerimizden yardım istemekte utanılacak bir şey yok. Britanyalılar ve Almanlar yanımızdayken, kaybetmemizin imkanı yok."
 GRE_PETITION_FOR_AID_FOCUS_DESCRIPTION_STANDARD:0 "Ayaktakımı, sivil itaatsizlikleri ve iç savaş tehditleriyle Kral'ın yönetimine olan hafif hoşnutsuzluklarını belli ettiler. Düşmanlarımız şimdilik üstün durumda, bu yüzden savaşımızda Britanyalı müttefiklerimizden yardım istemekte utanılacak bir şey yok. Britanyalılar yanımızdayken, kaybetmemizin imkanı yok."
 GRE_PETITION_FOR_AID_FOCUS_NAME_MONARCHIST:0 "Britanyalılardan ve Almanlardan Yardım Talep Et!"
 GRE_PETITION_FOR_AID_FOCUS_NAME_STANDARD:0 "Britanyalılardan Yardım Talep Et!"
 GRE_PROTECTORS_MEDITERRANEAN_FOCUS_DESCRIPTION_MONARCHIST:0 "Akdeniz bizim evimiz ve milyonlarca başkasının da evi. Dünyanın bu küçük parçasında kalıcı barışı sağlamak her zaman arzumuz olmuştur, ancak bu takdire şayan hedefler her zaman kötü niyetli olanlar tarafından engellenmiştir. Peki, eğer onları yenemiyorsanız - onlara katılın. Kendimiz için kudretli bir Yunan imparatorluğu kuracağız ve nihayet sık sık ezilenlerin hakkını vereceğiz."
 GRE_PROTECTORS_MEDITERRANEAN_FOCUS_DESCRIPTION_STANDARD:0 "Akdeniz bizim evimiz ve milyonlarca başkasının da evi. Dünyanın bu küçük parçasında kalıcı barışı sağlamak her zaman arzumuz olmuştur, ancak bu takdire şayan hedefler her zaman kötü niyetli olanlar tarafından engellenmiştir. Artık boyun eğip kendimizin veya komşularımızın zarar vermek isteyenlerin eylemleri yüzünden acı çekmesine izin veremeyiz. Doğru olan için ayağa kalkma zamanı geldi."
 GRE_PROTECTORS_MEDITERRANEAN_FOCUS_NAME_MONARCHIST:0 "Akdeniz'in Şampiyonları"
 GRE_PROTECTORS_MEDITERRANEAN_FOCUS_NAME_STANDARD:0 "Akdeniz'in Koruyucuları"
 GRE_a_fleet_fit_for_the_aegean:0 "Ege'ye Yakışır Bir Filo"
 GRE_a_fleet_fit_for_the_aegean_desc:0 "Her gün İtalyan savaş kruvazörlerinin ve Britanya uçak gemilerinin denizlerimizden geçişini görmek zorunda kalıyoruz. Bu aşağılayıcı! Balkanlar'da birinin nihayet ayağa kalkıp hepimizin gurur duyabileceği bir donanma indirmesinin zamanı geldi."
 GRE_a_land_of_mountains:0 "Bir Dağlar Ülkesi"
 GRE_a_land_of_mountains_desc:0 "Doğal coğrafyamız bize işgalcilere karşı birçok doğal savunma sunuyor, sadece kendi arazimizden yararlanmayı öğrenmemiz gerekiyor! Bu konuda İsviçrelilerden kesinlikle öğreneceğimiz bir şeyler var."
 GRE_a_legacy_of_war:0 "Bir Savaş Mirası"
 GRE_a_legacy_of_war_desc:0 "Savaş kanımızda var - zamanın başlangıcından beri başkalarına karşı savaştık ve bize karşı savaşıldı. Yüzyıllar boyunca birkaç numara öğrendik ve ulusal ordumuzun nihayet kan dolu geçmişimizin en iyisini yansıtma zamanı geldi."
 GRE_a_long_and_proud_tradition:0 "Uzun ve Gururlu Bir Gelenek"
 GRE_a_long_and_proud_tradition_desc:0 "Donanmamız, en karanlık saatlerimizde bile, sürekli olarak Yunanistan'ın gururu olan birkaç şeyden biridir. Bugün yaptığımız şey, sadece uzun ve gururlu bir geleneğin devamıdır."
 GRE_a_modern_navy:0 "Modern Bir Donanma"
 GRE_a_modern_navy_desc:0 "Yunan-Türk Deniz Antlaşması'nın inşa edebileceğimiz gemilerin boyutunu sınırlaması pek önemli değil, çünkü açıkçası bir zırhlı ve kruvazör filosunu sürdürecek veya genişletecek denizcilik sanayimiz yok. Ancak denizaltılar... işte Yunanistan'ın donanma sorununa uygun bir çözüm yatıyor."
 GRE_a_socialist_economy:0 "Sosyalist Bir Ekonomi"
 GRE_a_socialist_economy_desc:0 "Yunan halkı, sahte kralın otokratik yönetimi ve savaş çığırtkanı Venizelosçuların altında çok uzun süre kan döktü, artık halkın onları ilk sıraya koyan bir hükümet altında nihayet refaha erme zamanı!"
 GRE_abandon_french_italian_debt_tt:0 "§YFransa§! ve §Yİtalya§! ile olan borçlarımızı terk edeceğiz.\n"
 GRE_abandon_the_greek_turkish_naval_treaty:0 "Yunan-Türk Deniz Antlaşmasını Feshet"
 GRE_abandon_the_greek_turkish_naval_treaty_desc:0 "Türklerin inşa etmesine izin verilen gemilerin boyutuna sınırlar getirmesi gereken bir antlaşma, bir şekilde aynı kısıtlamalarla bizim de içine çekilmemizle sonuçlandı! Unutun gitsin, Yunanistan'ın eskiden kıyılarımıza hükmeden şanlı zırhlıları vardı ve bu çekişme döneminde devasa bir savaş gemisinden daha iyi bir güvenlik olamaz!"
 GRE_abandon_the_greek_turkish_naval_treaty_tt:0 "Kendimizi siyasi olarak §YBritanya§! veya §YAlmanya§! ile hizalamak, eski §Yağır gemilerimizden§! bazılarını yeniden inşa etmemizi sağlayacaktır.\n"
 GRE_absolute_monarchy_opposition_tt:0 "§RBu yolu seçmek bir İç Savaşa yol açacaktır!§! \n§YVenizelosçular§! §Risyankar§! olacak! \n§YKomünistler§! §Risyankar§! olacak!"
 GRE_academy_of_athens:0 "Atina Akademisi"
 GRE_academy_of_athens_desc:0 "Atina Akademisi 1929'da bir yüksek öğrenim kurumu olarak kuruldu, ancak hala genç ve büyümek için yardıma ihtiyacı var. Müdahalemizle, onu Avrupa ve ötesindeki tüm hevesli akademisyenler için bir kilit taşı haline getireceğiz!"
 GRE_agricultural_communes:0 "Tarımsal Komünler"
 GRE_agricultural_communes_desc:0 "Dünya etrafımızda sanayileşti ve bizim de yetişmemizin zamanı geldi de geçiyor. Ancak halkımızın çoğu tarımsal bir yaşam dışında hiçbir şey bilmiyor ve köklerimizden o kadar kolay kopamayız. Tarım sektörünü verimli komünler halinde organize edeceğiz, böylece imalat veya askeri işçilik gibi diğer alanlar için yetenekleri serbest bırakacağız."
 GRE_ally_tito:0 "Tito ile Müttefik Ol"
 GRE_ally_tito_desc:0 "Stalin karşıtı Marksizm inancımıza, Yugoslavya'dan Josip Broz Tito'dan daha sadık bir devrimci yoktur. Hoşumuza gitmeyebilir, ama kana susamış faşistlere ve hain Bolşeviklere karşı kardeşçe bir dayanışma sancağı altında ona ve yurttaşlarına birleşmiş olarak ihtiyacımız var."
 GRE_an_orthodox_state:0 "Ortodoks Bir Devlet"
 GRE_an_orthodox_state_desc:0 "Biz bir Hristiyan Ortodoks devletiyiz - bu ulusal kimliğimizin ayrılmaz bir parçasıdır. Sana şan olsun, ey Tanrım, umudumuz, sana şan olsun."
 GRE_appeal_to_the_soviet_union:0 "Sovyetler Birliği'ne Başvur"
 GRE_appeal_to_the_soviet_union_desc:0 "Sovyetler Birliği'ne hafife alarak dönmüyoruz. Dikkatli olmazsak bizi kemiklerimize kadar ayıklamaya hazır bir kurdun inine yürüyor olacağız, ama bizim onlara gitmemiz, onların bize gelmesinden kesinlikle daha iyidir..."
 GRE_athenian_thinkers:0 "Atinalı Düşünürler"
 GRE_athenian_thinkers_desc:0 "İnsanlığın en iyi düşünürlerinden bazıları Atina'dan çıktı ve sanat ve bilimlere yapılacak küçük bir teşvikle, Yunanistan'ın dört bir yanından tekrar büyük beyinlerin fışkırdığını görmeye başlayacağız!"
 GRE_attack_the_fascists:0 "Faşistlere Saldır"
 GRE_attack_the_fascists_desc:0 "Faşizm bir virüstür, Avrupa'da ülkeden ülkeye bir veba gibi yayıldı. Komünizm tedavidir ve onlara bunu zorla uygulayacağız!"
 GRE_bedrock_of_balkan_financial_stability:0 "[Root.GetBedrockFinancialStabilityName]"
 GRE_bedrock_of_balkan_financial_stability_desc:0 "Tüm ülkeler arasında Yunanistan'ın Balkanlar'da mali durumunu gerçekten yoluna koyan ilk ülke olacağını kim düşünebilirdi ki? Bölgesel prestijimiz tavan yaptı ve Güney Avrupa'nın bankacıları olarak yeni konumumuzu ülkemizi daha da zenginleştirmek için kesinlikle sömürmeliyiz."
 GRE_bedrock_of_balkan_financial_stability_tt:0 "§YBatı Balkanlar§!, §YDoğu Balkanlar§! ve §YKuzey Balkanlar§!'daki her ülke için, bize karşı yüksek dostane bir §Ygörüşe§! sahip olan her ülke için harita dışı §YSivil Fabrikalar§! alacağız. Bu aynı zamanda §Y[AUS.GetNameDef]§!, §Y[CZE.GetNameDef]§! ve §Y[TUR.GetNameDef]§! için de geçerlidir."
 GRE_bolster_the_schachtplan:0 "Schachtplan'ı Güçlendir"
 GRE_bolster_the_schachtplan_desc:0 "Schachtplan bir süredir Yunan merkezi planlamasının temel taşı olmuştur, ancak Schachtplan'ın bariz bir şekilde Almanya'nın lehine yazıldığı açıktır. Ülkemizin en iyi ekonomistlerinden bazıları, Schachtplan'ı her iki taraf için de daha faydalı olacak şekilde yeniden müzakere etmek için bir planla öne çıktılar ve bundan yararlanmamayı seçersek aptallık etmiş oluruz!"
 GRE_bring_home_the_exiled_republicans:0 "Sürgündeki Cumhuriyetçileri Eve Getir"
 GRE_bring_home_the_exiled_republicans_desc:0 "Liderimiz Eleftherios Venizelos nihayet tekrar başa geçtiğine göre, monarşist rejim tarafından zorla sürgüne gönderilen yoldaşlarımızı geri davet edebiliriz. Ülkemizi tekrar yoluna sokmak için her türlü yardıma ihtiyacımız olacak!"
 GRE_bring_home_the_exiled_republicans_focus_tt:0 "§YVenizelosçu§! bakanlar ve generaller sürgünden dönecek ve atanabilir olacak."
 GRE_british_docking_rights:0 "Britanya Demirleme Hakları"
 GRE_british_docking_rights_desc:0 "Büyük Savaş sırasında İtilaf Devletleri'nin Orta Doğu cephesini kazanmasının anahtarı, Yunan limanlarımıza erişimleriydi. Akdeniz'in Avrupa'yı ateşe verecek barut fıçısı olacağı giderek daha olası görünen bir zamanda yaşıyoruz ve Britanyalılar limanlarımıza tekrar erişim sağlamaktan kesinlikle fayda sağlayacaktır."
 GRE_byzantine_themata:0 "Bizans Theması"
 GRE_byzantine_themata_desc:0 "Dünya, Konstantinopolis'in Fethi'nden bu yana önemli ölçüde değişti ve fetih oldukça karmaşık bir girişime dönüştü. İmparatorluğun yeni yeniden fethedilen halklarının sadece istediğimiz için bize hizmet etmesini bekleyemeyiz: belirli bir düzeyde özyönetime izin vermeli ve bu fethedilen bölgelerin yerel yönetimleriyle iş birliği yapmalıyız. İmparatorluğumuzu tekrar güvence altına almak için, bu sadece küçük bir bedel."
 GRE_cement_greco_german_ties:0 "Yunan-Alman Bağlarını Pekiştirmek"
 GRE_cement_greco_german_ties_desc:0 "Soldaki birçok kişinin unutmayı sevdiği bir gerçek, Almanya'nın bize karşı cömert mali politikası olmasaydı, yıllar önce tekrar çökmüş olurduk. Şimdiye kadar başardığımız hiçbir şey Almanlar olmadan mümkün olmazdı! Onlara, onların bize ihtiyacı olduğundan daha çok ihtiyacımız var, ama yine de yakın ve değerli dostluğumuz adına onlardan daha iyi bir anlaşma sağlayabiliriz."
 GRE_clear_the_slums:0 "Gecekonduları Temizle"
 GRE_clear_the_slums_desc:0 "Yunan mülteciler askerlikten kaçıyor ve iğrenç gecekondular ve baraka kasabaları yaratarak ve yerleşerek değerli alanları işgal ediyorlar. Varlıkları ülkeyi utandırıyor, sakinleri de ulusa karşı görevlerinden kaçarak aynı şeyi yapıyor. Bu gecekonduları boşaltacağız ve arazileri ile insanları daha iyi kullanacağız."
 GRE_clearing_land_for_industrial_expansion:0 "Sanayi Genişlemesi İçin Arazi Açma"
 GRE_clearing_land_for_industrial_expansion_desc:0 "Zeytin, üzüm ve tütün tarlaları Yunanistan'ın birçok tepesini kaplar, tıpkı Bizans İmparatorluğu'nun yadigarları olan çok sayıda kilise gibi. İlkinden o kadar çoğuna ihtiyacımız yok ve ikincisine yeni Yunanistan'da yer yok. Bu el konulan toprağı alıp işçiler için fabrikalar kurarak kullanalım!"
 GRE_compromise_with_the_monarchists:0 "Monarşistlerle Uzlaş"
 GRE_compromise_with_the_monarchists_desc:0 "Kralı sevmeyebiliriz, ama ülkemiz bu konuda çok uzun zamandır bölünmüş durumda. Bir iç savaş daha riske atmak yerine, Monarşistleri masaya getirelim ve şartları tartışalım. Mücadele zamanı sona erdi."
 GRE_compromise_with_the_monarchists_focus_tt:0 "§YII. Georgios§! ülke üzerindeki baskısından vazgeçer ve anayasal bir hükümdar olur. \n\n£faction_gre_monarchist §YMonarşistler§! §Gdost§! olur. \n£faction_gre_communist §YKomünistler§! §Rdüşman§! olur."
 GRE_connecting_our_prefectures:0 "İllerimizi Birbirine Bağlamak"
 GRE_connecting_our_prefectures_desc:0 "Eksik bulduğumuz sadece sanayi tabanımız değil, aynı zamanda ulusal altyapımız da. Komşularımız ülkelerini şehirleştirdiler, bizim de nüfusumuzu şehirleştirmeye başlamamızın zamanı geldi."
 GRE_cooperate_with_foreign_monopolies:0 "[Root.GetCooperateForeignMonopoliesName]"
 GRE_cooperate_with_foreign_monopolies_desc:0 "Mevcut güçlerle savaşmanın bir anlamı yok, bu savaşırsak Yunanistan'ı yavaş yavaş öldürecek, kazanılamaz bir savaş. Küstah bir aptal gibi oynamak yerine, monopolleri müzakere masasına getirelim ve ilgili tüm taraflar için dostane bir anlaşma yapalım."
 GRE_crack_down_on_foreign_monopolies:0 "Yabancı Monopollere Baskı Yap"
 GRE_crack_down_on_foreign_monopolies_desc:0 "Çok uzun zamandır yabancı para babalarına ve küresel mali monopollere tahammül ettik - ama artık yeter! Bu sinsi varlıklar tarafından artık itilip kakılmayacağız, çünkü bugünden itibaren Yunanistan tamamen ve gerçekten özgür olacak!"
 GRE_crack_down_on_the_republicans:0 "Cumhuriyetçilere Baskı Yap"
 GRE_crack_down_on_the_republicans_desc:0 "Venizelosçulara çok uzun süre göz yumduk - bu maskaralığın sona erme zamanı geldi. Onların ne şerefi ne de saygısı var, ahlaktan tamamen yoksullar ve onları oldukları gibi haşereler olarak Yunanistan'dan süreceğiz!"
 GRE_defending_our_kingdom:0 "Krallığımızı Savunmak"
 GRE_defending_our_kingdom_desc:0 "Bazı alimler, Avrupa'daki son siyasi gelişmeler ışığında, bir devlete yönelik en büyük tehdidin aslında içeriden gelebileceğini söylemişlerdir. Ne zırvalık! Asıl tehdit, her zaman bize karşı entrikalar çeviren ve planlar yapan komşularımızdır! Yeterince yenilgi aldık, ama bir sonraki savaşta galip olarak çıkmamız hayati önem taşıyor."
 GRE_defending_our_seas:0 "Denizlerimizi Savunmak"
 GRE_defending_our_seas_desc:0 "Yunanistan'ın çok geniş bir kıyı şeridi var ve çok sayıda adayı kontrol ediyor - denizler bir zamanlar en büyük savunma varlıklarımızdan biriyken, bugün potansiyel düşmanlara karşı pek bir etkisi yok. Eğer düşmanlarımız adalarımızı almayı veya kıyılarımıza çıkmayı umuyorsa, o zaman önce deniz bombardıman uçaklarımızın bombardımanından sağ çıkmak zorunda kalacaklar!"
 GRE_depose_the_reactionaries:0 "Gerilcileri Devir"
 GRE_depose_the_reactionaries_desc:0 "Venizelosçularla olan bu koalisyona yeterince uzun süre tahammül ettik. Onların liberal gündemi, Marksist inancımıza aykırıdır ve bu gülünç ilişkiye son verme zamanı geldi. Devrim için!"
 GRE_destroying_our_foes:0 "Düşmanlarımızı Yok Etmek"
 GRE_destroying_our_foes_desc:0 "Geleceğimizi güvence altına almak, düşmanlarımıza vatanımıza dokunma fırsatı bile vermeden önce saldırmamıza bağlıdır. Düşman hedeflerine karşı stratejik bombalama stratejisine yatırım yapmalıyız."
 GRE_disrupting_the_great_powers:0 "Büyük Güçleri Sekteye Uğratmak"
 GRE_disrupting_the_great_powers_desc:0 "Bizim yerimiz, dünyanın büyük güçleri tarlalarda ve denizlerde birbirleriyle kapışırken onlarla rekabet etmek değil. Bunun yerine, onlara gerçekten acıyan yerden vuracağız - ikmal hatlarından!"
 GRE_dominate_the_bulgarians:0 "Bulgarlara Hükmet"
 GRE_dominate_the_bulgarians_desc:0 "Bulgarlar, Yunanistan'ın güvenliğini defalarca tehdit ettiler. 'Balkanların Prusyası' deniyordu onlara – ne kadar da tuhaf. Yunanistan'ın güvenliğini tehlikeye atmalarına izin vermeyeceğiz, bir daha asla."
 GRE_embracing_modern_warfare:0 "Modern Savaşı Benimsemek"
 GRE_embracing_modern_warfare_desc:0 "Almanya'dan gelen raporlar, 'tank'ın aslında sadece piyade taburlarına destek sağlamanın ötesinde faydalı olabileceğini gösteriyor. Bir düşünsenize! Bunun için sanayimiz olmayabilir, ama bu alınmaya değer bir kumar."
 GRE_encourage_tourism:0 "Turizmi Teşvik Et"
 GRE_encourage_tourism_desc:0 "Miras alanlarımız dünyanın gıpta ettiği yerlerdir ve turizmi ekonomimiz için güçlü bir nimet haline getirebileceğimize şüphe yok. Elbette, Avrupa üzerinde beliren savaş gölgesi her şeye biraz gölge düşürüyor - ama umarım bu, egzotik Yunanistan'a bir kaçışı daha da çekici kılacaktır!"
 GRE_encourage_tourism_tt:0 "§RSavaş durumuna girer girmez turizm endüstrimizi kaybedeceğiz!§!"
 GRE_escorts_for_our_bombers:0 "Bombardıman Uçaklarımız İçin Eskortlar"
 GRE_escorts_for_our_bombers_desc:0 "Sadece bombardıman uçağı üretmek yeterli değil, çünkü o bombardıman uçaklarını koruyacak eskortlar olmalı! Bu işi yapmak için standart avcılara güvenemeyiz, bu yüzden bombardıman uçaklarımızı düşman kıyılarına kadar eşlik edebilecek harika avcılar geliştireceğiz."
 GRE_expand_our_tobacco_industry:0 "Tütün Sanayimizi Genişlet"
 GRE_expand_our_tobacco_industry_desc:0 "En büyük ve en karlı ihracatımızın tütün olduğuna şüphe yok, bu ürünü tüm dünyaya satıyoruz. Zaten bir ticaret ilişkisi kurduğumuz ülkeler, girişimimizi o kadar kapsamlı bir şekilde hazırladığımızı kesinlikle takdir edeceklerdir ki, ne olursa olsun, dünya asla ünlü tütünümüzden mahrum kalmayacaktır."
 GRE_expansion_of_athens_university:0 "Atina Üniversitesi'nin Genişletilmesi"
 GRE_expansion_of_athens_university_desc:0 "Bilim ve yüksek öğrenim her zaman Helen geleneğinin ayrılmaz bir parçası olmuştur ve bugün Yunanistan için Atina Ulusal ve Kapodistrian Üniversitesi'nden daha önemli bir akademik kurum yoktur. Ek fonlar ve genişleme için yer sağlayarak, enstitünün devlete olan faydasını büyük ölçüde artıracağız."
 GRE_exporting_more_luxury_commodoties:0 "Daha Fazla Lüks Mal İhraç Etmek"
 GRE_exporting_more_luxury_commodoties_desc:0 "Tütün, zeytin, feta, üzüm, incir: hayattan en iyisini istediğinizde, ihtiyaçlarınızı Yunanistan'dan alırsınız! Uluslararası imajımızı satın alınabilecek en iyi lüks ürünlere sahip ülke olarak daha da ileri taşımakta pek sorun yaşamamalıyız."
 GRE_extracting_more_from_our_soil:0 "Toprağımızdan Daha Fazlasını Çıkarmak"
 GRE_extracting_more_from_our_soil_desc:0 "Yunanistan doğal kaynaklar açısından zengin bir ülkedir, sadece onları ortaya çıkarma kararlılığına sahip olmamız gerekiyor. Teknoloji bize yolu gösterdi, şimdi geriye sadece iradeyi bulmak kaldı."
 GRE_fascists_put_in_play_tt:0 "§YFaşist Grup§! aktif hale gelir ve hükümetle §Gdost§! olarak başlar. \n§YFaşistlerle§! iş birliği yaparak, onların hareketini meşrulaştırırız."
 GRE_fiscal_responsibility:0 "[Root.GetFiscalResponsibilityName]"
 GRE_fiscal_responsibility_desc:0 "Modern Yunan tarihinde belki de ilk kez mali bir denge durumuna nihayet ulaştık. Bunun gerçekten kutlamaya değer bir olay olduğuna şüphe yok! Usta devlet adamlığımız için kendimizi alkışlamalıyız, bunu hak ettik."
 GRE_fiscal_responsibility_tt:0 "§YI.F.C.'ye Olan Borcu§! kısmen veya tamamen ödemiş olmalı!"
 GRE_following_in_the_footsteps_of_giants:0 "Devlerin İzinden Gitmek"
 GRE_following_in_the_footsteps_of_giants_desc:0 "Metaksas, bize faşizmin birçok meziyetini göstermemize yardımcı oldu, ama bizi sonuna kadar götürmeyecek kadar korkaktı. Gerçek bir faşizm türüne ihtiyacımız var: bir Yunan faşizmi - İtalyan veya Alman modelinin ucuz bir taklidi olmayan bir tane."
 GRE_force_the_farmers_into_factories:0 "Çiftçileri Fabrikalara Zorla"
 GRE_force_the_farmers_into_factories_desc:0 "Genel nüfus, hayatlarının geri kalanında çiftçilik yapmaya devam edip yaklaşan çatışmanın sonunda iyi çıkabilecekleri bu masalda takılıp kalmış gibi görünüyor. Yanılıyorlar: çiftliklere el koymaktan ve ardından çiftçileri şehir merkezlerimize zorla taşıyarak devlete daha acil fayda sağlayacak bir işe başlamalarını sağlamaktan başka seçeneğimiz yok."
 GRE_four_year_plan:0 "Dört Yıllık Plan"
 GRE_four_year_plan_desc:0 "Metaksas, Yunanistan'ı sanayileştirmek için parlak bir plan tasarladı. İtalyan korporatist ekonomik modeline dayanarak, bizi bağlayan güçlerden bir ölçüde otarşi ve bağımsızlık elde edeceğiz."
 GRE_fund_the_hellenic_air_force_academy:0 "Helen Hava Kuvvetleri Akademisini Finanse Et"
 GRE_fund_the_hellenic_air_force_academy_desc:0 "Pilotlarımız istekli, yetenekli ve yetkin - onlara nihayet hak ettikleri saygıyı verme zamanı geldi. Hava Kuvvetleri Akademisi'ni tekrar tam olarak finanse ederek ve avcı uçağı üretimini uygun şekilde artırarak başlayacağız, böylece hava kuvvetlerimiz gerçekten Yunanistan'a layık olur."
 GRE_gordian_knot_tt:0 "§Yİtalya§! dışındaki tüm imzacılar, §YMegali Konvansiyonu§!'nun şartlarını yerine getirmek için §Yunanistan§! ile birlikte §YTürkiye§!'ye savaş ilan edecektir."
 GRE_greece_and_turkey_in_the_axis:0 "Yunanistan ve Türkiye Birlikte Mihver'de!"
 GRE_greece_and_turkey_in_the_axis_desc:0 "Yunan-Türk Dostluk Paktı imzalanıp onaylandığına göre, artık Almanları kullanarak hepimize kazandığımız sonsuz refahı getirerek Balkanların kaderini yeniden şekillendirebiliriz! Gerekirse Balkanların geri kalanını da tekmeler ve çığlıklarla yanımıza alacağız..."
 GRE_greek_autarky:0 "Yunan Otarşisi"
 GRE_greek_autarky_desc:0 "Bizden daha zengin ülkelerin sermayesine olan uzun süreli bağımlılığımız aşağılayıcı; bu ülkeler bizi himaye ediyor, zorbalık yapıyor ve kendi ceplerini zenginlikle doldurabilmek için bizi fakir tutuyorlar. Almanlar, İtalyanlar ve Sovyetler bize başka bir yol olduğunu gösterdiler - kendi kendine yeterlilik ve tam bağımsızlık yolu! Elbette, o duruma ulaşmamız biraz zaman alabilir: sonuçta biz bir Almanya değiliz..."
 GRE_greek_mechanisation:0 "Yunan Mekanizasyonu"
 GRE_greek_mechanisation_desc:0 "Modernizasyon kendi başına yeterince acı verici bir süreçti, ama ordumuzun mekanizasyonu gerçekten de atı arabanın önüne koymak olabilir! İlerlemenin bedeli yüksek, ama ondan çekinmeyeceğiz. Ulusumuzun güvenliği her şeyden önemlidir."
 GRE_hellenic_armed_forces:0 "Helen Silahlı Kuvvetleri"
 GRE_hellenic_armed_forces_desc:0 "Silahlı kuvvetlerimiz mevcut ulusal durumumuz için yeterince iyi, ancak askeri olarak Balkan Paktı üyelerinin en zayıfı olmaya devam ediyoruz ve silahlı kuvvetlerimiz genelindeki modernizasyon eksikliği nedeniyle sık sık eleştirildik. Özellikle iç durumumuz kötüleşirken, askeri durumumuz hakkında ciddileşme zamanı geldi..."
 GRE_hellenic_armoured_corp:0 "Helen Zırhlı Kolordusu"
 GRE_hellenic_armoured_corp_desc:0 "Kendi zırhlı birimler tümenimizi kurmak, dünyaya ne kadar modern olduğumuzu gösterecek! Elbette hiçbir geri kalmış ülkenin ordusunda tank olmaz, değil mi?"
 GRE_hellenoturkism:0 "Helenotürkizm"
 GRE_hellenoturkism_desc:0 "Yunan Nasyonal Sosyalist Partisi içinde Türkiye ile ilişkilerimizi derinleştirme yönünde neredeyse evrensel bir arzu var. Yüzyıllardır birbirimizle savaştık ve kan döktük ki, kimse birlikte başarabileceğimiz harikaları düşünmedi bile! Güvenlik uğruna her ikimiz de kendimizi faşist güçlere bağlamalıyız! Umalım ki Türkler de bizimle aynı şekilde görsün..."
 GRE_horror_and_fear:0 "Dehşet ve Korku"
 GRE_horror_and_fear_desc:0 "Deimos kai Phobos – dehşet ve korku. Bunlar Savaş Tanrısı Ares'in ikiz oğullarıydı. Spartalılar, savaş alanında Ares'in Oğulları onuruna kan döktüler; biz de yalnız ve tek başımıza, şanlı geçmişimizin onuruna savaş alanında kan dökeceğiz."
 GRE_if_does_metaxism_effect_tt:0 "Eğer §Y$GRE_metaxism_focus$§! odağı tamamlandıysa:\n"
 GRE_if_does_right_to_rule_effect_tt:0 "Eğer §Y$GRE_the_right_to_rule$§! odağı tamamlandıysa:\n"
 GRE_increase_our_mining_operations:0 "Madencilik Faaliyetlerimizi Artır"
 GRE_increase_our_mining_operations_desc:0 "Tütün üretimimizi genişletmek bizi uluslararası toplumla daha iyi bütünleştirebilir, ancak devlete daha fazla faydası olan ağır madencilik sanayimizi genişletmektir. Savaşı tütün ve zeytinyağı değil, mineraller ve cevherler kazanacaktır."
 GRE_industry_bypass_tt:0 "§YAskeri Fabrikalar§! veya §YSivil Fabrikalar§! için yeterli inşaat alanı yok!"
 GRE_last_country_standing:0 "Ayakta Kalan Son Ülke"
 GRE_last_country_standing_desc:0 "Türk hükümetiyle iş birliği arzu edilirdi, ancak bilinsin ki Yunanistan'ın yeni hükümeti, durum gerektirdiğinde harekete geçmekten korkmuyor. Tanrı hepimize merhamet etsin."
 GRE_lignite_liquefaction:0 "Linyit Sıvılaştırma"
 GRE_lignite_liquefaction_desc:0 "Ülkemiz linyit madenleri açısından zengindir ve linyitin yakıta dönüştürülebileceği süreci zaten biliyoruz. Hükümet, daha fazla linyit sıvılaştırma tesisinin açılmasını teşvik etmelidir."
 GRE_macedonian_generals:0 "Makedon Generaller"
 GRE_macedonian_generals_desc:0 "Büyük İskender bir zamanlar kendine ait diyebileceği dünyanın büyük bir bölümünü oydu ve hepsini mütevazı Makedonya'dan yaptı. Onu büyük yapan şey hepimizin kanında var ve İskender ile Argeadları, komutada Helen mükemmelliğinin örnekleri olarak görmeliyiz."
 GRE_making_use_of_our_islands:0 "Adalarımızdan Faydalanmak"
 GRE_making_use_of_our_islands_cyprus_tt:0 "Bu odak, §YKıbrıs§!'ı da kontrol ederken daha büyük bir etkiye sahiptir."
 GRE_making_use_of_our_islands_desc:0 "Osmanlı İmparatorluğu'nun cesedinden, İtilaf Devletleri tarafından o kadar verimli bir şekilde parçalandıktan sonra çok sayıda ada geri aldık, ancak devralmamızdan bu yana onlarla çok az şey yaptık. Girit uzun zamandır Yunanistan'ın önemli bir parçası olmuştur ve çabalarımıza orada başlayıp diğer adalara doğru genişleyerek onları devlet için stratejik ve maddi olarak daha değerli hale getireceğiz."
 GRE_making_use_of_our_islands_dodecanese_tt:0 "Bu odak, §YOniki Adalar§!'ı da kontrol ederken daha büyük bir etkiye sahiptir."
 GRE_making_use_of_our_islands_tt:0 "Bu odak, §YKıbrıs§! ve §YOniki Adalar§!'ı da kontrol ederken daha büyük bir etkiye sahiptir."
 GRE_megali_convention_a_failure:0 "Kandiye Konvansiyonu bir fiyaskoydu"
 GRE_megali_idea_approved:0 "§YMegali İdea§! Onaylandı"
 GRE_megali_idea_conference_invites_tt:0 "§YMegali Konvansiyonu§!'na davetiyeler, odak seçildiğinde gönderilecektir."
 GRE_metaxism_focus:0 "Metaksizm"
 GRE_metaxism_focus_desc:0 "Kral, devletin tartışmasız başıdır, ancak Yunan halkı bu düzenlemeden hala rahatsız. İdeal olmayabilir, ama bir hükümet kurmak için kanatlarda bekleyen çok yetenekli ve çok sadık eski bir subay var..."
 GRE_metaxism_lost_tt:0 "Eğer Metaksas'ın reformlarının sonuncusunu uygulamadıysak, o zaman §YMetaksizm§! ulusal ruhunu kaybedeceğiz!"
 GRE_metaxism_warning_tt:0 "\nEğer §YYunanistan§!, §YMetaksizm§! ulusal ruhunu tamamen yükseltmeden bir ittifaka katılırsa, o zaman §Rkaldırılacaktır§!.\n"
 GRE_mobilise_our_economy:0 "Ekonomiyi Seferber Et"
 GRE_mobilise_our_economy_desc:0 "Avrupa'nın büyük güçleri savaş motorlarını ısıtıyor ve hazırlıksız yakalanmayı riske atamayız. Süreç Yunanistan için acı verici olacak - çoğu ülkeden daha acı verici - ama hayatta kalmamız uğruna fedakarlıklar yapmalıyız."
 GRE_modern_cataphracts:0 "Modern Katafraktlar"
 GRE_modern_cataphracts_desc:0 "Katafraktlar bir zamanlar Orta Çağ dünyasının gıpta ettiği birliklerdi! Hızları, zırhları ve güçleri herkes tarafından hayranlıkla karşılanırdı! Günümüzün katafraktı şüphesiz tanktır ve biz de Bizans katafraktının mirasına gerçekten layık bir tank sınıfı üreteceğiz."
 GRE_monarchist_civil_war:0 "II. Georgios'un mutlak yönetimi üzerine iç savaş başladı"
 GRE_moulding_the_new_world_order:0 "Yeni Dünya Düzenini Şekillendirmek"
 GRE_moulding_the_new_world_order_desc:0 "Cesetler zaten o kadar yükseğe yığıldı ki ve bu boşa gitmemeli. Yeni bir küresel statüko yaratmak için savaşıyoruz ve dünyada savaşma isteği kalmayıncaya kadar savaşmaya devam edeceğiz."
 GRE_mountain_training_effect:0 "§HDağ Savaşı Eğitimini§! etkinleştirir\n§HPiyade\n    Dağlar§!\n      Savunma: §G+%5§!\n      Hareket: §G+%5§!\n§HDeniz Piyadeleri\n    Dağlar§!\n      Saldırı: §G+%5§!\n      Hareket: §G+%10§!\n§HDağcılar\n    Dağlar§!\n      Saldırı: §G+%5§!\n      Savunma: §G+%5§!\n      Hareket: §G+%10§!\n§HParaşütçüler\n    Dağlar§!\n      Saldırı: §G+%5§!\n      Hareket: §G+%10§!\n"
 GRE_nationalized_banks:0 "Millileştirilmiş Bankalar"
 GRE_nationalized_banks_desc:0 "Deutsche Bank ve Bank of England, Yunanistan halkını çok uzun süre sömürdü: zaten kıt olan kazançlarına el koydular ve seçmedikleri diktatör bir hükümetin eylemleri için onları cezalandırdılar! Diyoruz ki, Yunan halkı artık sömürülmeyecek ve fonları bunun yerine hükümetlerine gidecek!"
 GRE_nenikikamen:0 "Nenikikamen"
 GRE_nenikikamen_desc:0 "[Root.GetNenikikamenDesc]"
 GRE_new_weapons_old_tricks:0 "Yeni Silahlar, Eski Numaralar"
 GRE_new_weapons_old_tricks_desc:0 "Büyük Savaş sırasında top kullanma ve keşif yapma konusunda oldukça fazla deneyimimiz vardı. Teknoloji ve teçhizat değişmiş olabilir, ama taktikler kesinlikle değişmedi. Güçlü yönlerimize oynayalım ve dünyaya Yunanistan ile kolayca başa çıkılamayacağını gösterelim."
 GRE_no_central_powers_tt:0 "Bu odağın herhangi bir etkisinin olması için §YAvusturya-Macaristan§! veya §YKayzerlik§! var olmalıdır."
 GRE_old_memories_stir_new_threats_tt:0 "Anadolu üzerine duyguları kabartmak §Ybeklenmedik sonuçlara§! yol açabilir..."
 GRE_open_foreign_subsidized_factories:0 "Yabancı Destekli Fabrikalar Aç"
 GRE_open_foreign_subsidized_factories_desc:0 "Fabrikaların inşası ve personel temininde tüm beklentileri aştık, ancak diğer Avrupalı yurttaşlarımızdan daha yavaş genişlediğimize şüphe yok. Bizden çok daha büyük zenginliklere sahip olanlar var ki, modernleşme sürecimizde büyük bir fark yaratabilirler, yeter ki ulusumuzu yatırım için yeterince çekici gösterebilelim."
 GRE_open_foreign_subsidized_factories_tt:0 "Aşağıdaki ülkelerden her biri için bir §YAskeri Fabrika§! ve bir §YSivil Fabrika§! eklenecektir, eğer §YYunanistan§! hakkındaki §Ygörüşleri§! §G80§!'den fazlaysa: \n§Y[FRA.GetNameDef]§!, §Y[ENG.GetNameDef]§!, §Y[GER.GetNameDef]§! ve §Y[SOV.GetNameDef]§!."
 GRE_open_up_the_country:0 "Ülkeyi Aç"
 GRE_open_up_the_country_desc:0 "İtiraf etmesi üzücü bir gerçek, ama tek başımıza sanayileşemeyiz. Uzun zamandır bizden daha büyük ulusların sermayesine ve sanayi yeteneklerine bağımlı olduk ve bu dönem bir istisna değil. O yüzden bugün onların sermayesini ve yatırımlarını Yunanistan'a davet edelim, çünkü yarın onlara bir daha asla ihtiyacımız olmayacak!"
 GRE_our_traditional_allies_in_the_aegean:0 "Ege'deki Geleneksel Müttefiklerimiz"
 GRE_our_traditional_allies_in_the_aegean_desc:0 "1832'de Osmanlılara karşı bağımsızlığımızı kazanmamıza kim yardım etti? Britanyalılar. Yıllardır krediler ve yatırımlarla ekonomimizi ayakta tutan kim? Britanyalılar. Yunanistan'ın geleceği hangi güçle yatıyor? Britanyalılarla!"
 GRE_paid_off_most_of_debt_tt:0 "Ulusal §Yborcumuzun§! çoğunu ödemiş olmalı."
 GRE_pay_back_debt_tt:0 "Bu §Ykararlar§!, §YI.F.C.'ye Olan Borç§! ulusal ruhunu düşürmemizi ve sonunda ondan kurtulmamızı sağlayacak."
 GRE_paying_back_our_debts_in_bulk:0 "Borçlarımızı Toplu Olarak Geri Ödemek"
 GRE_paying_back_our_debts_in_bulk_ENG_tt:0 "Kararın Kilidini Açar: §YBritanyalılara Büyük Borç Geri Ödemesi§! \n"
 GRE_paying_back_our_debts_in_bulk_FRA_tt:0 "Kararın Kilidini Açar: §YFransızlara Büyük Borç Geri Ödemesi§! \n"
 GRE_paying_back_our_debts_in_bulk_ITA_tt:0 "Kararın Kilidini Açar: §Yİtalyanlara Büyük Borç Geri Ödemesi§! \n"
 GRE_paying_back_our_debts_in_bulk_desc:0 "Borçlarımızdan ne kadar erken kurtulursak, bu ülkeyi gerçekten dönüştürmeye o kadar erken başlayabiliriz. Yabancı mali efendilerimizden daha erken kurtulabilmek için borçlarımızı ödemeye ülkenin sermayesinden daha fazlasını ayıracağız."
 GRE_petition_britain_for_aid:0 "[Root.GetGreekPetitionForAidName]"
 GRE_petition_britain_for_aid_desc:0 "[Root.GetGreekPetitionForAidDesc]"
 GRE_phoideratoi:0 "Phoideratoi"
 GRE_phoideratoi_desc:0 "Atalarımız, ihtiyaç duyulduğunda barbarlarla iş birliği yapma aklına sahipti ve bugün bizim kesinlikle bu ihtiyacımız var. Modern dünyaya karşı mücadelemize sempati duyan İmparatorluğun tüm eski tebaasına, muhteşem ordularımızın saflarında savaşma hakkını vermeliyiz! Birlikte, tek vücut olarak zafere yürüyoruz!"
 GRE_prepare_against_the_mediterranean_threat:0 "Akdeniz Tehdidine Karşı Hazırlan"
 GRE_prepare_against_the_mediterranean_threat_desc:0 "İtalyanlar, emelleri Yunanistan'ın kaderine aykırı olan bir beladır. Bekleyip bize bir tehdit oluşturmadıklarını iddia ederek hiçbir şey kazanmayız. Harekete geçeceğiz, böylece İtalyan nihayet kıyılarımıza çıktığında, milyonlarca Yunan'ın ortak çabasıyla çıktıkları denizlere geri zorlanacaklar!"
 GRE_prepare_for_the_great_anti_fascist_war:0 "Büyük Anti-Faşist Savaşa Hazırlan"
 GRE_prepare_for_the_great_anti_fascist_war_desc:0 "Faşizm, Marksizm inancına en büyük tehdittir – bu, ancak savaş alanında ezilebilecek ideolojik bir meydan okumayı temsil eder. Sovyetler Birliği faşizmin yayılmasını engellemek için hiçbir şey yapmıyor ve bu yüzden bu görev bize düşüyor."
 GRE_protecting_our_skies:0 "Göklerimizi Korumak"
 GRE_protecting_our_skies_desc:0 "Hem göklerimizi koruyacak hem de düşmanlarımızı bombalayacak sanayiye hiçbir zaman sahip olmadık. Durum, daha fazla düşmanımızı vurmak ile kendi halkımızdan daha fazlasını onların saldırılarından kurtarmak arasında bir seçime gelirse, o zaman her seferinde kendi yurttaşlarımızı kurtarmayı seçeceğiz."
 GRE_protectors_of_the_mediterranean:0 "[Root.GetProtectorsMediterraneanName]"
 GRE_protectors_of_the_mediterranean_desc:0 "[Root.GetProtectorsMediterraneanDesc]"
 GRE_rapprochement_with_the_italians:0 "İtalyanlarla Yakınlaşma"
 GRE_rapprochement_with_the_italians_desc:0 "Zor zamanlar zorlu önlemler gerektirir. Düşünülemez olanı yapmalı ve ülkemizi modernize etme konusunda yardım için İtalyanlara yaklaşmalıyız. İtalyanlar bu düzenleme üzerinden bize nasıl şantaj yapacak ve sömürecek? Bunu sadece Tanrı bilir. Eğer ilk başta bir düzenlemeye varılabilirse tabii..."
 GRE_realign_ourselves_with_the_central_powers:0 "İttifak Devletleri ile Yeniden Hizalanmak"
 GRE_realign_ourselves_with_the_central_powers_desc:0 "Bir şekilde, imkansız olan gerçekleşti! Führer gitti ve Kayzer geri döndü! Britanya dış politikası bu olaylar yüzünden adapte oldu ve bu illa ki bizim avantajımıza değil. Belki de Berlin'deki akrabalarımızla bağlantı kurmalı ve Avrupa çapında kralların kutsal hakkını kurtarmak için savaşmalıyız."
 GRE_reclaiming_the_wayward_ally:0 "Yoldan Çıkmış Müttefiki Geri Kazanmak"
 GRE_reclaiming_the_wayward_ally_desc:0 "Osmanlı İmparatorluğu'nun çöküşü bizim için büyük bir rahatlamaydı, ama Türkiye Cumhuriyeti Yunanistan için ondan önceki Osmanlılardan bile daha büyük bir tehdit. Garip zamanlar daha da garip yatak arkadaşları gerektirir; Osmanlıları geri getirmek Yunanistan'a düşüyor."
 GRE_recruit_the_fascists:0 "Faşistleri İşe Al"
 GRE_recruit_the_fascists_desc:0 "Bir radikali yakalamak için, onun gibi düşünebilmelisiniz. Faşistler bizim aşağılık düşmanlarımızdır, ama tüm düşmanlarımız arasında kesinlikle onlardan en az nefret ettiğimiz onlardır. Bizimle iş birliği yapmaya istekliler, o zaman neden onları kendi amaçlarımız için kullanmayalım?"
 GRE_red_militias:0 "Kızıl Milisler"
 GRE_red_militias_desc:0 "Yunan toplumunu modernize etme çabalarımızı engellemeye çalışacak birçok kişi var, ancak Devrimi korumaya adanmış milislerin organizasyonuyla bizi durdurmaları çok daha zor olacak."
 GRE_reevaluating_the_drachma:0 "Drahmiyi Devalüe Etmek"
 GRE_reevaluating_the_drachma_desc:0 "Mali sıkıntılarımızın sonu yok gibi görünüyor ve temerrütler ile borçlar bizi kesinlikle savunulamaz bir ekonomik durumla baş başa bıraktı. Uzun vadede bazı borçlarımıza zarar verse de, yabancı sermaye girişini teşvik etmenin bir gereği olarak para birimini kasıtlı olarak devalüe etmeliyiz."
 GRE_rejuvenating_athens:0 "Atina'yı Canlandırmak"
 GRE_rejuvenating_athens_desc:0 "Büyük ve şanlı başkentimiz tüm Avrupa'nın en eski şehirlerinden biridir. Aynı zamanda en zengin ve en etkili şekilde organize edilmiş illerimizden biridir. Zaten umutsuzca az gelişmiş illeri geliştirmek yerine, çabalarımızı zaten modern olan başkentimize yoğunlaştıralım."
 GRE_remembering_the_anatolian_catastrophe:0 "Anadolu Felaketi'ni Hatırlamak"
 GRE_remembering_the_anatolian_catastrophe_desc:0 "Küçük Asya Seferi bir felaketten başka bir şey değildi. Halkımız katledildi, prestijimiz mahvoldu ve siyasi hareketimiz ezildi - hepsi üç yıl içinde! Bunun bizim mirasımız olmasına izin veremeyiz, bunu halkımızın bizi değil de Türkleri suçlayacağı bir şekilde manipüle etmeliyiz - ve belki o zaman, bunca yıldan sonra nihayet Büyük Yunanistan hayallerimizi gerçekleştirebiliriz..."
 GRE_renegotiate_debt_with_france:0 "Fransa ile Borcumuzu Yeniden Müzakere Et"
 GRE_renegotiate_debt_with_france_desc:0 "Fransızlar, Balkanlar'daki dış politikalarını bir türlü düzene sokamıyor gibi görünüyor - peki, onlara o kadar basit bir anlaşma teklif edelim ki, onlar bile yanlış anlayamasın. Borçlarımızı affedin, biz de güvenliğimizi ve geçimimizi Fransız rejiminin başarılarına bağlayalım."
 GRE_renegotiate_debt_with_france_tt:0 "Kararın Kilidini Açar: §YFransız Sendikalarına Hükümetlerini Taciz Etmeleri İçin Rüşvet Ver§! \n§Y[FRA.GetNameDef]§! tarafından tutulan herhangi bir §YI.F.C.'ye Olan Borcu§! geçersiz kılar."
 GRE_reorganize_the_royal_guard:0 "Kraliyet Muhafızlarını Yeniden Düzenle"
 GRE_reorganize_the_royal_guard_desc:0 "Kraliyet Muhafızları, ya da daha önce bilindikleri adıyla Cumhurbaşkanlığı Muhafız Bölüğü, 1868'de kraliyet kararnamesiyle kuruldu. Agema eskort birimi bir karargah, iki Evzon piyade bölüğü ve bir süvari bölüğünden oluşuyordu. Birimleri yeniden organize etmeli ve onları savaş alanında bir kez daha kullanmalıyız."
 GRE_request_communist_support:0 "Komünist Desteği İste"
 GRE_request_communist_support_desc:0 "II. Georgios bir Yunan değil ve Yunanistan'ın işlerine karışmaya kesinlikle hakkı yok! Ülkemiz, onun uydurma hükmetme hakkı yüzünden çok fazla kan döktü ve şimdi bu suçluyu nihayet adalete teslim etmeliyiz! Ama bunu tek başımıza yapamayız ve kraldan bizim kadar nefret eden tek bir grup var..."
 GRE_request_communist_support_focus_tt:0 "£faction_gre_communist §YKomünistler§! §Gdost§! olur. \n£faction_gre_monarchist §YMonarşistler§! §Rdüşman§! olur. \n\n£faction_gre_monarchist §YMonarşist§! generaller ve bakanlar hizmetten §Ristifa edecek§!, ancak £faction_gre_communist §YKomünist§! generaller ve bakanlar §Gatanabilir§! olacak."
 GRE_required_fascist_faction_loyalty_tt:0 "§YFaşist Grup§! §Gsadık§! olmalıdır."
 GRE_restoring_our_home:0 "Evimizi Restore Etmek"
 GRE_restoring_our_home_desc:0 "Yıllar Yunanistan'a nazik davranmadı - savaş, borç ve yoksullukla harap olduk. Demokrasi nihayet kıyılarımıza döndüğüne göre, sömürücü Almanları ve İtalyanları reddetme zamanı geldi. Bunun yerine, ulusumuzu hem sanayide hem de ruhen yeniden inşa etmemize yardımcı olabilecekleri umuduyla İngilizlerle olan yakın bağlarımıza odaklanmalıyız."
 GRE_resurrecting_the_megali_idea:0 "Megali İdea'yı Diriltmek"
 GRE_resurrecting_the_megali_idea_desc:0 "Bize 1919'da Megali İdea sözü verildi, ancak sonraki Grek-Türk Savaşı'ndan sonra bu hayal neredeyse sonsuza dek suya düştü. Ancak Türkler, eski büyük topraklarımızı varlıklarıyla kirletmeye devam ettikçe, biz de haklı olarak bizim olanı arzulamaya devam edeceğiz. Yunan halkı bunu bir zamanlar hatırladı, tekrar hatırlamaları sağlanabilir..."
 GRE_reviving_the_double_headed_eagle:0 "Çift Başlı Kartalı Diriltmek"
 GRE_reviving_the_double_headed_eagle_desc:0 "Venizelosçular, Yunanistan'ın gerçek kayıp zaferini – Bizans'ın zaferini – geri getirmesine izin vermeyi reddeden korkaklardı! İmparatorluğun tüm kayıp topraklarını geri alabilecekken neden Türkiye'nin kıyılarıyla yetinelim? Yunanistan için yeni bir zafer çağı başladı!"
 GRE_reviving_the_spartan_warrior_spirit:0 "Spartalı Savaşçı Ruhunu Canlandırmak"
 GRE_reviving_the_spartan_warrior_spirit_desc:0 "Termopylae Muharebesi'nde, dört bin Spartalının, Xerxes'in Yunanistan'a daha fazla ilerlemesini engellerken yirmi bin Persliyi öldürebildiği söylenir. Bugün o tür bir kahramanlığa her zamankinden daha çok ihtiyacımız var, böylece bir sonraki müstakbel fatih evlerimizi ve canlarımızı almak için Atina'nın eteklerinde göründüğünde, onlara karşı durma ve şunu söyleme cesaretimiz olabilir: molon labe."
 GRE_revolutionaries_of_the_south:0 "Güneyin Devrimcileri"
 GRE_revolutionaries_of_the_south_desc:0 "Moskova'daki yoldaşlarımızla asla tam olarak aynı fikirde olmayacağız, ama Yunanistan kendi devrimci inancını dikte ettiği sürece, burada – Avrupa'nın güneyinde – gerçek Komünizmimizde özgür yaşayacağız!"
 GRE_secure_the_aegean:0 "Ege'yi Güvence Altına Al"
 GRE_secure_the_aegean_desc:0 "Avrupa'nın diğer ucundaki sorunları çözmeye çalışırken, kapımızın önündeki tehdidi görmezden geliyoruz. Türkler yüzyıllardır Yunan halkının baş belası, ölümcül düşmanları olmuştur ve yeni ve daha parlak bir yol çizmeyi ummuş olsak da, geçmiş düzeltilmeden geleceğin kazanılamayacağı açıkça ortaya çıkmıştır."
 GRE_securing_the_bulgarian_menace:0 "Bulgar Tehdidini Güvence Altına Almak"
 GRE_securing_the_bulgarian_menace_desc:0 "Bulgarlar ne zaman Yunan toprak bütünlüğüne bir tehdit olmadı ki? Bulgar hükümetinin bize karşı komplo kurabilmeleri için daha büyük bir güçle bir tür düzenleme aramayacağına nasıl güvenebiliriz? Buna paranoya diyebilirsiniz, ama biz buna deneyim diyoruz. Çıkarlarımızı korumak için Bulgarları hizaya getirmeliyiz."
 GRE_sophistry_and_science:0 "Safsata ve Bilim"
 GRE_sophistry_and_science_desc:0 "Antik Helenlerin uzmanlık alanları olan bu konularda, şimdi her zamankinden daha çok, bu ülkeyi dönüştürmeye ve bizi yirminci yüzyıla itmeye hazır parlak ve sorgulayan zihinlere ihtiyacımız var. Teknolojik yeniliğe odaklanmak, önümüzdeki elli yıl boyunca Avrupa'nın geri kalanıyla yakalamaç oynamak zorunda kalmayacağımız anlamına gelir."
 GRE_soviet_subsidised_railways:0 "Sovyet Destekli Demiryolları"
 GRE_soviet_subsidised_railways_desc:0 "Yunanistan, Avrupa'nın büyük güçleri tarafından her fırsatta istismar edildi, Yunanistan'ın ekonomisini modernize etme şansımız olsun istiyorsak, Karadeniz'in karşı yakasına bakma zamanı geldi."
 GRE_stage_an_incident_in_the_bosporus:0 "Boğaziçi'nde Bir Olay Tezgahla"
 GRE_stage_an_incident_in_the_bosporus_desc:0 "Sovyet Politbürosu, Konstantinopolis'i kontrol etme arzusunu bir sır olarak saklamadı. Bizim yardımımızla, Sovyetler Boğaziçi'nin kontrolünü ele geçirmek için ilk somut adımları atmaya karar verdiler ve Yunanistan kesinlikle çok önemli bir rol oynuyor..."
 GRE_subjugating_the_bulgarians:0 "Bulgarları Boyunduruk Altına Almak"
 GRE_subjugating_the_bulgarians_desc:0 "Bulgarlar bizim ezeli düşmanlarımızdır; onlar sadece sırtımızda bir bıçak olmak için varlar. Acınası medeniyetleri hiçbir zaman bir şeye yaramadı ve bu yüzden her fırsatta mirasımızı ve ulusumuzu yıkmaya çalışıyorlar. Artık yeter - Bulgarlara neden Avrupa'nın en eski hayatta kalan halklarından biri olduğumuzu hatırlatalım."
 GRE_the_anatolian_refugees:0 "Anadolu Mültecileri"
 GRE_the_anatolian_refugees_desc:0 "Anadolu Felaketi'nden sonra, Türkiye'de yaşayan yaklaşık iki milyon Yunan mülteciyi kabul etmek zorunda kaldık. Hazırlıksızdık ve durum sadece daha da savunulamaz hale geldi. Mülteciler şimdi başka bir Anadolu sürgünü olan Georgios Kosmidis altında siyasi olarak örgütleniyorlar. Hareketleri görmezden gelinemeyecek kadar büyük ve sonuçta, amaçlarımız gerçekten o kadar farklı mı?"
 GRE_the_backbone_of_our_army:0 "Ordunun Belkemiği"
 GRE_the_backbone_of_our_army_desc:0 "Asker alma süreçlerimiz birçok komşumuza göre biraz arkaik ve teçhizatımız feci şekilde modası geçmiş. Asker alma prosedürlerimizi ve askerlerimizi donattığımız teçhizatı modernize etme zamanı geldi."
 GRE_the_birthplace_of_democracy:0 "Demokrasinin Doğduğu Yer"
 GRE_the_birthplace_of_democracy_desc:0 "Tiranlar, Helenlerin kalplerinde ve zihinlerinde nadiren saygı görmüştür ve bu, Perikles zamanından beri gururla sürdürdüğümüz bir özelliktir! Demokrasi, dehamızın birçok meyvesinden biridir ve onu Roma ve Töton esinli tiranlığa karşı savunmamız en doğrusudur!"
 GRE_the_cannon:0 "Top"
 GRE_the_cannon_desc:0 "Dünya, toplarımızın gümbürtüsünü dünyanın öbür ucundan duyacak!"
 GRE_the_die_is_cast:0 "Ok Yaydan Çıktı!"
 GRE_the_die_is_cast_desc:0 "Hayallerimiz gerçekleşti, ancak dünya hala tehlikede! Çizgiler çekildi ve Yunanistan, yaklaşan çatışmanın nasıl biteceği konusunda söz sahibi olacak!"
 GRE_the_double_headed_aquila:0 "Çift Başlı Kartal"
 GRE_the_double_headed_aquila_desc:0 "Gökyüzüne yükselen ve düşmanlarımızın üzerine ateş yağdıran her uçağımızda Çift Başlı Kartal'ı uçuracağız! Dünya, kanatlarımızın ne kadar uzağa yayılabileceğini görecek..."
 GRE_the_gordian_knot:0 "Gordion Düğümü"
 GRE_the_gordian_knot_desc:0 "Gordion Düğümü, Büyük İskender'in efsanesinin bir parçasıdır: görünüşte imkansız bir görevi cesur bir hamleyle çözmek anlamına gelir. Bizim imkansız görevimiz kayıp topraklarımızı geri almak – bizim cesur hamlemiz ise güçlü müttefiklerimizin bunu bizim için almasıdır."
 GRE_the_greater_enosis:0 "Enosis'i Başarmak"
 GRE_the_greater_enosis_desc:0 "[Root.GetAchievingEnosisDesc]"
 GRE_the_greek_industrial_revolution:0 "Yunan Sanayi Devrimi"
 GRE_the_greek_industrial_revolution_desc:0 "Yunanistan onlarca yıl önce sanayileşmeliydi, ancak yozlaşmış politikacılar ve araya giren yabancı güçler bizi geçmiş bir çağdan kalma bir ekonomik sistemle baş başa bıraktı. Yaşam tarzımızı zamanla değiştirecek lükse sahip değiliz, şimdi başlamalı ve hızlı çalışmalıyyız."
 GRE_the_hellenic_air_force:0 "Helen Hava Kuvvetleri"
 GRE_the_hellenic_air_force_desc:0 "Hava Kuvvetleri Akademimiz sadece 1930'da kurulmuş olsa da, Yunan halkı Balkan Savaşları'na kadar uzanan bir havacılık geçmişine sahip! Güçlü bir hava kuvvetlerinin önemini zaten anlıyoruz, keşke hava kuvvetlerimizi daha güçlü ve daha büyük yapma yeteneklerimiz olsaydı..."
 GRE_the_hellenic_army:0 "Helen Ordusu"
 GRE_the_hellenic_army_desc:0 "Küçük, modası geçmiş ama inatçı - çoğu kişi Yunan ordusunu böyle tanımlar ve bu yanlış bir tanım değildir. Tek yapmamız gereken taktiklerimizi ve teçhizatımızı modernize etmek ve Balkanlar'da gerçekten korkulacak bir güç haline geleceğiz."
 GRE_the_hellenic_navy:0 "Helen Donanması"
 GRE_the_hellenic_navy_desc:0 "Biz Yunanlar, Osmanlı İmparatorluğu'ndan bağımsızlığımızı ilk kazandığımızdan beri güçlü ve gururlu bir denizcilik geleneğine sahibiz. Donanmamız komşularımızın en güçlüsüdür ve kendimizi Akdeniz'de gerçekten güçlü bir bölgesel oyuncu yapmak için sadece denizcilik mirasımızı geliştirmemiz gerekiyor."
 GRE_the_hellenic_spirit:0 "Helen Ruhu"
 GRE_the_hellenic_spirit_desc:0 "Bir zamanlar Yunanistan'ı bu kadar büyük yapan o kutsal ateşi canlı tutmak için savaşıyoruz. Gerçek büyüklüğe muktediriz, bunu biliyoruz! Sadece o kıvılcımı tekrar bulmamız gerekiyor..."
 GRE_the_kings_government:0 "Kralın Hükümeti"
 GRE_the_kings_government_desc:0 "Majestelerinin zamanında müdahalesi, Venizelosçuların yeni bir hükümet kurmasını engelledi ve tam zamanında! Yapılacak işler var! Demertzis, merkezci bir arabulucu olarak görevini yaptı, ama şimdi Yunanistan daha güçlü bir hükümet başkanına ihtiyaç duyuyor."
 GRE_the_leonidas_line:0 "Sık sık tehlikeye atılan sınırlarımızı kaplayan bir dizi kara kalesi olan §YLeonidas Hattı§!'nın başlangıcı tamamlanacak.\n"
 GRE_the_macedonian_farmlands:0 "Zengin Makedon Tarım Arazileri"
 GRE_the_macedonian_farmlands_desc:0 "[731.GetName]'ın ana ihracatı tarım ürünleridir. Topraklarımızın birçok yerinin aksine, bölge çiftçilik için harikadır ve ülkemizin geleceğini olabildiğince harika kılmak için bu konuya odaklanmalıyız."
 GRE_the_metaxas_line:0 "Sık sık tehlikeye atılan sınırlarımızı kaplayan bir dizi kara kalesi olan §YMetaksas Hattı§!'nın başlangıcı tamamlanacak.\n"
 GRE_the_modern_movement:0 "Modern Hareket"
 GRE_the_modern_movement_desc:0 "Faşizm, 20. yüzyılın inancıdır - yaygın kapitalizmin hatalarına ve komünizmin yolsuzluğuna bir cevaptır. Faşizm, bir neslin toplanma çığlığıdır; yabancı zorbalığından bıkmış bir neslin! Ulusal utançtan bıkmış bir neslin! Yunanistan'ı Yeni Çağ'a Büyük bir Güç olarak getirmeye hazır bir neslin - her türlü tehdide ve hakarete cevap vermeye hazır! Aéra!"
 GRE_the_national_youth_organisation:0 "Ulusal Gençlik Örgütü"
 GRE_the_national_youth_organisation_desc:0 "Almanların ve İtalyanların gençlerini organize etme biçiminde takdire şayan bir şey var. Gençlerimizin asosyal davranışlara katılmamasını veya büyük liderimiz [ROOT.GetLeader]'e saygısızlık etmemesini sağlamak için onların modelini uyarlayabiliriz."
 GRE_the_right_to_rule:0 "Hükmetme Hakkı"
 GRE_the_right_to_rule_desc:0 "Kral kendi başına hareket etme yeteneğine sahipken neden Kral adına hareket edecek bir diktatör atansın ki! Yunanistan acı çekerken geleneklere takılıp kalmayalım, halka hizmet eden gerçek bir hükümdarın zamanı geldi! Tanrı Kral II. Georgios'u Korusun!"
 GRE_the_torpedo:0 "Torpido"
 GRE_the_torpedo_desc:0 "Belki de denizlerin altında sulu bir mezara gönderdiğimiz birçok mürettebattan biri bizi sonunda Atlantis'e götürür! Ya da belki de sadece düşmanımızın başkentini bir sonraki kayıp ve batık şehre çevirmekle yetiniriz..."
 GRE_theban_warriors:0 "Tebalı Savaşçılar"
 GRE_theban_warriors_desc:0 "Amacımız, her şeyden önce gücü tercih eden sütunlaşmış bir militan toplumu yaratmak değil. Mussolini'nin yönetim sistemini taklit etme girişimlerine aktif olarak karşı çıkıyor ve reddediyoruz! Biz Helenleriz, Romalı değiliz! Şiddet yanlısı Spartalılar etrafında bir tapınma kültü yaratmak yerine, Sparta hegemonyasını kurnazlıkla deviren Tebalıları kutlayalım!"
 GRE_thema_nautikon:0 "Thema Nautikon"
 GRE_thema_nautikon_desc:0 "Bizans eskiden dalgalara hükmederdi, ama Bizans'ın çöküşünden bu yana geçen yüzyıllarda bile Yunan halkı denizcilik ruhunu asla kaybetmedi! Savaş harekât alanları söz konusu olduğunda, denizler bizim için Pindus Dağları kadar tanıdıktır!"
 GRE_third_hellenic_civilization:0 "Üçüncü Helen Medeniyeti"
 GRE_third_hellenic_civilization_desc:0 "Dünya hala bizi Bizans ve Helen miraslarının varisleri olarak görmüyor. Atalarımızdan o kadar övgüyle bahsediyorlar ve yine de bugün bize bu kadar küçümsemeyle bakıyorlar. Onlara göstereceğiz - biz Bizans İmparatorluğu değiliz ve eski Yunanlılar da değiliz, biz Üçüncü Helen Medeniyeti'yiz ve kendimize ait olmaktan gurur duyacağımız büyük işler başaracağız!"
 GRE_tow_the_stalinist_line:0 "Stalinist Çizgiye Uymak"
 GRE_tow_the_stalinist_line_desc:0 "Devrimimizi Sovyetler Birliği'ndeki o büyük beyinlere borçluyuz: onların katkıları olmasaydı, Yunanistan'da asla iktidarı ele geçiremezdik! Moskova'daki yoldaşlarımızla dayanışma içindeyiz."
 GRE_unlock_soviet_decision_tt:0 "Kararların Kilidini Açar: §Y[ROOT.GetNameDef]'de [SOV.GetAdjective] Bürokratları Ağırla§!"
 GRE_use_the_military:0 "Orduyu Kullan"
 GRE_use_the_military_desc:0 "Elimizdeki her şeyle onlara saldıracağız! Onları sokaklarda avlayacağız, ara sokaklarda avlayacağız, dünyanın sonuna kadar avlayacağız! Hiçbir Venizelosçu, her an tetikte olan yönetimimizden güvende olduğunu düşünmesin!"
 GRE_utilize_british_capital:0 "Britanya Sermayesini Kullan"
 GRE_utilize_british_capital_desc:0 "Kralımızın onların davasına sadık bir müttefik olması nedeniyle Britanyalıların bize yardım etmeye fazlasıyla istekli olduğu açıktır. Yatırımcılarından iç savaş sırasında kaybedilenlerin yeniden inşasında yardım isteyerek bu gerçekten faydalanmalıyız."
 GRE_utilize_our_strengths:0 "Güçlü Yönlerimizi Kullanmak"
 GRE_utilize_our_strengths_desc:0 "Yunanistan bir çiftçiler ve lüks mallar ülkesidir ve bunda utanılacak bir şey yok. Elbette, Almanya tanklar ve avcı uçakları seri üretiyor olabilir, ama Hermann Göring'in piposundaki tütün nereden geliyor sanıyorsunuz? Biz Yunanlar güçlü yönlerimizi biliyoruz ve onlara sadık kalırsak, gayet iyi olacağız."
 GRE_venerate_the_ancient_hellenes:0 "Antik Helenlere Hürmet Etmek"
 GRE_venerate_the_ancient_hellenes_desc:0 "Bizler eski saygıdeğer Helenlerin torunları değil miyiz? \nPolemikte, felsefede ve savaşta o ustalarla kan bağımız yok mu? Halkımıza tekrar güçlü bir gurur duygusu aşılayacağız, böylece Avrupa'nın yol gösterici yıldızı olarak yerimizi tekrar alabiliriz."
 SOV_isolating_turkey:0 "Türkiye'ye Karşı Desteklenen Emeller"
 TUR_DEMOCRATIC_CAPSTONE_FOCUS_DESCRIPTION_ISLAMIST:0 "Devletin her organından Kemalist pisliği temizleyene kadar etkili bir şekilde yönetemeyiz. Kendi silahlı kuvvetlerimizin bile haklı olarak seçilmiş hükümete sadık olacağına güvenemeyiz! Bunun değişmesi gerekiyor."
 TUR_DEMOCRATIC_CAPSTONE_FOCUS_DESCRIPTION_STANDARD:0 "Sorumlu bir demokratik güç olmak, sadece kendi vatandaşlarınızın özgürlüklerini garanti etmekten daha fazla sorumluluk getirir. Dünya tehlikeli ve dünya çapındaki demokrasiler sinsi güçlerin saldırısı altında. Özgürlük için ayağa kalkma görevimiz var."
 TUR_DEMOCRATIC_CAPSTONE_FOCUS_NAME_ISLAMIST:0 "Subayları Tasfiye Et"
 TUR_DEMOCRATIC_CAPSTONE_FOCUS_NAME_STANDARD:0 "Dışa Bakış"
 TUR_DEMOCRATIC_TRANSITION_FOCUS_DESCRIPTION_ISLAMIST:0 "Adnan Menderes, demokratik haklar platformunda şeffaf bir şekilde İslamcı politikaları zorlayarak Milletin Adamı oldu. [ROOT.GetNameDefCap] muhafazakar bir devrimden geçiyor ve tüm dünyanın yapabileceği tek şey dehşet içinde izlemek."
 TUR_DEMOCRATIC_TRANSITION_FOCUS_DESCRIPTION_STANDARD:0 "Mustafa Kemal Atatürk, [ROOT.GetNameDef]'nin bir gün tam işleyen bir demokrasi olacağını uzun süre hayal etti ve görünüşe göre bu rüyayı başarıyla gerçekleştirdik."
 TUR_DEMOCRATIC_TRANSITION_FOCUS_NAME_ISLAMIST:0 "Milletin Adamı"
 TUR_DEMOCRATIC_TRANSITION_FOCUS_NAME_STANDARD:0 "Atatürk'ün Rüyasını Gerçekleştirmek"
 TUR_TURKISH_VARIANT_TAX_FOCUS_DESCRIPTION_SECULAR:0 "Dini kurumlar bu ülkede çok uzun süre çok iyi bir durumda oldular. Defalarca, dini otoriteler bu hükümeti ve çabalarını baltalamaya çalıştılar, bu yüzden şimdi onların servetlerini daha iyi bir amaç için kullanmak üzere onlardan kurtaracağız."
 TUR_TURKISH_VARIANT_TAX_FOCUS_DESCRIPTION_STANDARD:0 "Ülkemizdeki gayrimüslimlere bir 'Varlık Vergisi' uygulayacağız, böylece sanayi projelerimizi daha iyi finanse edebilir ve [ROOT.GetNameDef]'yi laikleştirmemizdeki misyonumuzda kendimizi destekleyebiliriz."
 TUR_TURKISH_VARIANT_TAX_FOCUS_NAME_SECULAR:0 "İnanç Vergisi"
 TUR_TURKISH_VARIANT_TAX_FOCUS_NAME_STANDARD:0 "Varlık Vergisi"
 TUR_a_common_destiny_for_all_of_turkey:0 "Tüm Türkiye İçin Ortak Bir Kader"
 TUR_a_common_destiny_for_all_of_turkey_desc:0 "Türk, Rum, Kürt, Hristiyan, Müslüman, Ateist - hepimiz bu işin içindeyiz. Bir bütün olarak bir araya gelmek ve radikal fikirleri destekleyen ve bir bütün olarak kolektif için çalışan güçlü bir hükümetin arkasında birleşmek kolektif çıkarımızadır. Birleşmiş olarak duracağız ya da bölünmüş olarak yok olacağız."
 TUR_abuse_the_office_of_soil_products:0 "Toprak Mahsulleri Ofisi'ni Kötüye Kullan"
 TUR_abuse_the_office_of_soil_products_desc:0 "Toprak Mahsulleri Ofisi, gıda maddelerinin üretimini ve tarım işçilerinin ücretlerini düzenlemek için kuruldu, ancak [ROOT.GetNameDef]'nin çiftçilere ihtiyacı yok - toprağa ihtiyacı var. Düşük performans gösteren çiftlik sahiplerine, ulusun genel yararına o arazilere yeni sanayi kurulabilmesi için topraklarını satmaları konusunda baskı yapacağız."
 TUR_accelerate_native_fighter_designs:0 "Yerli Avcı Tasarımlarını Hızlandır"
 TUR_accelerate_native_fighter_designs_desc:0 "Havacılık endüstrimiz eski ve saygındır, ancak çok az belirgin [ROOT.GetAdjective] uçak tasarımı üretim standartlarını karşıladı. Bunu değiştirmek için çalışmalıyız."
 TUR_adana_to_baku_highway:0 "Adana-Bakü Otoyolu"
 TUR_adana_to_baku_highway_desc:0 "Uzun zamandır kendimizle Kafkasya arasında daha büyük bağlar kurmak istiyorduk. Bu girişim, [SOV.GetNameDef] ile bağlarımızı yalnızca derinleştirmeye hizmet edebilir."
 TUR_add_medium_tank_technology_tt:0 "Teknoloji ekler: §YTemel Orta Tank§!."
 TUR_alienate_our_allies_tt:0 "\n§RDış politikamızdaki radikal değişim, özellikle onları hedef almaya başlarsak, bizi müttefiklerimizden yabancılaştırabilir.§!"
 TUR_aligning_bulgaria:0 "Bulgaristan'ı Hizaya Getir"
 TUR_aligning_bulgaria_desc:0 "[BUL.GetNameDef], İttifak Devletleri'nden egemenlikleri ve yaşam tarzlarıyla sağlam kalan tek ülke ve bununla ne yaptılar? Hiçbir şey. Onlar korkaklar! Enselerinde soluduğumuzda ve onları görevde tuttuğumuzda ne kadar korkak olduklarını göreceğiz."
 TUR_american_motor_factories:0 "Amerikan Motor Fabrikaları"
 TUR_american_motor_factories_desc:0 "Motorlu araçların üretimiyle ilgili ağır sanayimizin büyük bir kısmı Amerikalılarla iş birliğine bağlıdır. Yabancı yatırımlar konusunda her zaman en hoşgörülü ulus olmadık, ama eğer Amerikalı dostlarımız için düzenlemelerimizi gevşetirsek... pekala... ne olacağını kim bilebilir?"
 TUR_annul_the_ankara_anlasmasi:0 "Ankara Anlaşması'nı Feshet"
 TUR_annul_the_ankara_anlasmasi_desc:0 "1926'da Musul Sorunu görünüşte çözüldü - ama o zamanın tüm krizlerinde olduğu gibi, sonuç şüphesiz [ENG.GetAdjective] ve [FRA.GetAdjective] lehineydi. Artık [IRQ.GetAdjective] Türkünün çilesini görmezden gelmeyeceğiz. Harekete geçme zamanı geldi."
 TUR_anti_bolshevik_mediterranean_bloc:0 "Anti-Bolşevik Akdeniz Bloku"
 TUR_anti_bolshevik_mediterranean_bloc_desc:0 "[SOV.GetNameDef] ile dostane bağları sürdürmeyi dilerdik, ancak Stalinizm, Marksist idealden o kadar uzak ki, ona tahammül edilebilir olduğunu iddia edersek kendimize yalan söylemiş oluruz. [SOV.GetNameDef] ile bağları koparmalı ve başka yerlerde benzer düşünen dostlar bulmalıyız."
 TUR_applying_british_oil_embargoes_on_iraq:0 "Irak'a [ENG.GetAdjective] Petrol Ambargolarını Uygulamak"
 TUR_applying_british_oil_embargoes_on_iraq_desc:0 "[ENG.GetAdjective]ler, [IRQ.GetAdjective] petrol sevkiyatlarının kıtasal düşmanlarına ulaşmasını engellemeye kararlılar ancak büyük ölçüde başarısız oldular. [IRQ.GetAdjective]ların Avrupa'da ticaret yapmak için geçtiği en büyük kara yollarından birini engelleyerek [ENG.GetAdjective] girişimini destekleyebiliriz."
 TUR_approve_the_funkplan:0 "Funk Planı'nı Onayla"
 TUR_approve_the_funkplan_desc:0 "Schachtplan Güney Avrupa'da uygulamaya konulduğunda, biz bu plana katılmadık. Durum değişti ve [GER.GetNameDef] ile ekonomik bağlarımızı derinleştirmeye hazırız. [GER.GetAdjective] ekonomist Walther Funk, özellikle bizim durumumuza göre uyarlanmış bir plan hazırladı ve bu planı en kısa sürede uygulamamayı seçersek aptallık etmiş oluruz."
 TUR_arctic_wolves_training_program:0 "Arktik Kurtlar Eğitim Programı"
 TUR_arctic_wolves_training_program_desc:0 "Askerlerimiz, kuzey ormanlarında av peşindeki kurtlar gibi karda gezinecekler. Eğitimimiz sayesinde, düşman buzlu rüzgarlarda soğuktan daha fazlasından korkmaya başlayacak."
 TUR_assess_our_future:0 "Geleceğimizi Değerlendir"
 TUR_assess_our_future_desc:0 "Mustafa Kemal Atatürk bu ulusu kurtarıp bağımsızlığını ilan ettiğinde, [ROOT.GetAdjective] devletinin sonunda nasıl görünmesi gerektiğine dair çok özel bir vizyonla yaptı. Gazimizin vizyonunun hala mevcut yönetimin öncelikleriyle uyumlu olup olmadığını analiz etme zamanı geldi."
 TUR_ataturk_seeking_treatment:0 "Atatürk tıbbi tedavi arıyor"
 TUR_avenge_the_treaty_of_sevres:0 "Sevr Antlaşması'nın İntikamını Al"
 TUR_avenge_the_treaty_of_sevres_desc:0 "[FRA.GetNameDefCap], en zayıf anımızda bizi yok edebileceklerini sandı. Bizi sömürmeye, silahsızlandırmaya ve bölmeye çalıştılar. Onlara, bize yapmayı planladıklarının aynısını yapacağız."
 TUR_balkan_defense_council:0 "Balkan Savunma Konseyi"
 TUR_balkan_defense_council_desc:0 "Balkan Antantı'ndaki her bir ülke savaşı eski bir dost gibi bilir. Hepimiz bir saldırı savaşı başlatamayacağımızı biliyoruz, bu yüzden en büyük savunmayı oluşturmak için birlikte koordine olmalıyız."
 TUR_balkan_defense_council_tt:0 "§YBalkan Paktı§! bir ittifaka dönüştürüldüğünde, kendimizi yabancı saldırganlığa karşı en iyi nasıl savunacağımızı koordine edebiliriz."
 TUR_bomber_schematics:0 "Bombardıman Uçağı Şemaları"
 TUR_bomber_schematics_desc:0 "Savaş zamanında kendi gökyüzümüzü savunabilmemiz yeterli değil, herhangi bir savaşın hızlı bir şekilde sonuçlanabilmesi için düşmanlarımızın kalbine saldırabilmeliyiz. Müttefikler, bombayı düşmanlarını ezmek için bir araç olarak kullanmanın ustalarıdır ve onlardan öğreneceğimiz çok şey var."
 TUR_brace_against_the_red_menace:0 "[GetBraceAgainstTheRedMenaceName]"
 TUR_brace_against_the_red_menace_communism:0 "Kızıl Tehdide Karşı Koy"
 TUR_brace_against_the_red_menace_communism_desc:0 "Kuzeyde hain komünizm tehdidi ve onun dünyadaki baş sponsoru yatıyor. [SOV.GetNameDef] bu dünya için bir vebadır ve Balkan Antantı, [SOV.GetAdjective] hegemonyasını dağıtarak insanlığa bir iyilik yapacaktır."
 TUR_brace_against_the_red_menace_desc:0 "[GetBraceAgainstTheRedMenaceDesc]"
 TUR_brace_against_the_red_menace_generic:0 "[SOV.GetAdjective] Tehdidine Karşı Koy"
 TUR_brace_against_the_red_menace_generic_desc:0 "Kuzeyde hain Rusya yatıyor. Sonsuza dek Balkan ve Türk işlerine karışmaya çalıştılar. Balkan Antantı, [SOV.GetAdjective] hegemonyasını dağıtarak insanlığa bir iyilik yapacaktır."
 TUR_british_dockyards_in_turkey:0 "Türkiye'deki Britanya Tersaneleri"
 TUR_british_dockyards_in_turkey_desc:0 "Kıyılarımız uzun ve neredeyse tüm ülkemizi çevreliyor. Gemi imalat sanayisi için burada bol miktarda boş arazi var ve [ENG.GetAdjective]ler bunu fark ediyor. Savaş çabasını kolektif lehimize daha fazla çevirmek için donanma sanayimizi güçlendirme tekliflerini kabul edeceğiz."
 TUR_capitalise_on_rising_kurdish_nationalism:0 "Yükselen Kürt Milliyetçiliğinden Faydalan"
 TUR_capitalise_on_rising_kurdish_nationalism_desc:0 "Ulusumuz dışındaki Kürtlerin, kendi sınırlarımız içinde yanlış yönlendirilmiş terör eylemleri yapmaya komplo kurduklarına inanmak için nedenimiz var. Komünizm aracılığıyla Kürt işçisinin özgürleştirildiğini anlamıyorlar. Yurtdışındaki yanlış yönlendirilmiş proleterleri de özgürleştireceğiz."
 TUR_carve_up_greece:0 "Yunanistan'ı Paylaş"
 TUR_carve_up_greece_desc:0 "Üzüntümüzle birlikte, [GRE.GetNameDef]'in bu çağdan hala bağımsız bir ulus olarak çıktığı bir gelecek görünmüyor. Bu kararda hiçbir düşmanlık yok, sadece hayatta kalmak için yapılması gerekeni yapıyoruz. Ege'de barış tekrar hüküm sürecek, ama bu zalim ve affetmeyen çağda değil."
 TUR_choices_will_decide_legacy_tt:0 "§YMustafa Kemal Atatürk§! uzun zamandır §Y[ROOT.GetNameDef]§!'nin otoriter bir tek parti devletinden çok partili liberal bir demokrasiye geçişini savunmaktadır. Ulusumuzun ideolojik yönünü nereye yönlendireceğimize dair seçimlerimiz, §YAtatürk§! ideallerine ne kadar uygun yaşadığımızı yansıtacaktır."
 TUR_cin_turkleri:0 "Çin Türkleri"
 TUR_cin_turkleri_desc:0 "Çin'deki Türk, yurtdışındaki Türklerin dayanışması olmadan her zaman avlanacaktır. Çin Türklerini, onlara miraslarını inkar edenlerden kurtarmak ve korumak bize düşer."
 TUR_civil_war_tt:0 "§RKemalistleri silahlı kuvvetlerimizden tasfiye etmek bir iç savaş başlatacaktır. Başlangıç pozisyonumuzun gücü, İslamcıların orta bölgelerdeki gücüne ve silahlı kuvvetlerimizi reforme edip etmediğimize bağlı olacaktır. Bu odak tamamlandığında istikrar %60'ın altındaysa K*rdistan ayrılıp özgürlüğü için savaşacaktır.§!"
 TUR_cleanse_iberia_of_bolshevism:0 "İberya'yı Bolşevizm'den Temizle"
 TUR_cleanse_iberia_of_bolshevism_desc:0 "İspanya İç Savaşı sırasında Milliyetçi davanın kaybı bir rezaletti! Yanlıştı; adaletin saptırılması ve faşist davanın trajik bir başarısızlığıydı. Geçmişin yanlışlarını zorla düzeltmeliyiz."
 TUR_clodius_agreement_tt:0 "§Y65§! veya daha fazla birim §YKrom§! üreten her eyalet, üç seviye §YAltyapı§! ve iki §YAskeri Fabrika§! alacaktır."
 TUR_collaborative_civil_works_programme:0 "İşbirlikçi Bayındırlık Programı"
 TUR_collaborative_civil_works_programme_desc:0 "Eğer sadece [ITA.GetNameDef]'e kalsaydı, ittifakımızdaki herkesin yapacağı tek şey diğer halkları fethetmek ve boyunduruk altına almak olurdu. Biz, yönetmenin diğer yönleri için aklın sesi olarak duruyoruz: kimse istihdam oranlarını veya savaş sonrası ekonomiyi düşünmedi mi? Kaynaklarımızı bir araya getirmeli ve tüm bu kan dökülmesine değecek daha iyi bir gelecek inşa etmek için birlikte çalışmalıyız."
 TUR_collectivising_our_agriculture:0 "Tarımımızı Kolektifleştirmek"
 TUR_collectivising_our_agriculture_desc:0 "Tarım, [ROOT.GetNameDef]'de çok önemli bir alandır ve toprağı işleyenler, onları kar için sağacak olanlar tarafından daha fazla sömürülemez. Bundan böyle, çiftçi kendi ücretini belirleyecek ve kendi üretim araçlarını kontrol edecek."
 TUR_combined_operational_strategies:0 "Birleşik Operasyonel Stratejiler"
 TUR_combined_operational_strategies_desc:0 "Strateji ve savunma konularında daha derin bir düzeyde iş birliği yaparak, ezici zorluklara karşı bile tüm bölgemiz için güvenlik garanti edebiliriz."
 TUR_connect_capitals_greece_tt:0 "§YYunanistan§! kendi iradesiyle altyapı projeleri üstlendiği için, ek altyapı alacaktır."
 TUR_connect_capitals_romania_tt:0 "§YRomanya§! kendi iradesiyle altyapı projeleri üstlendiği için, ek altyapı alacaktır."
 TUR_connect_capitals_yugoslavia_tt:0 "§YYugoslavya§! kendi iradesiyle altyapı projeleri üstlendiği için, ek altyapı alacaktır."
 TUR_connecting_our_capitals:0 "Başkentlerimizi Birbirine Bağlamak"
 TUR_connecting_our_capitals_desc:0 "Ordularımızın cepheden cepheye sorunsuz bir şekilde hareket etmesini en iyi şekilde sağlamak için, Balkan Yarımadası boyunca verimli bir altyapı döşemeliyiz. Başkentlerimizin modern altyapıyla birbirine bağlanmasını elimizden geldiğince sağlamak için ortaklarımızla birlikte çalışacağız."
 TUR_construct_the_cakmak_line:0 "Çakmak Hattı'nı İnşa Et"
 TUR_construct_the_cakmak_line_desc:0 "Mareşal Fevzi Çakmak, Edirne ve Boğaziçi çevresinde bir savunma hattı inşa etmeyi önerdi. Yetkililer arasında projeyi sürdürme konusunda bazı tereddütler olsa da, nihayetinde faydalar maliyetleri aşıyor ve kale hattına başlamanın zamanı geldi de geçiyor."
 TUR_continue_the_policy_of_etatism:0 "Devletçilik Politikasına Devam Et"
 TUR_continue_the_policy_of_etatism_desc:0 "İsmet İnönü ve bir grup solcu bakan, ekonomi politikamızı liberal ekonomiden uzaklaştırıp benzersiz bir Türk devlet yönetimli ekonomiye yönlendirme taraftarıdır. Devletçilik, Kemalizm gibi, sol ve sağ ideolojilerin, Türk halkına en iyi hizmet eden daha da büyük bir şeye mükemmel bir şekilde kaynaşmasını temsil eder."
 TUR_continue_the_sumerbank_industrialization_scheme:0 "Sümerbank Sanayileşme Planına Devam Et"
 TUR_continue_the_sumerbank_industrialization_scheme_2_tt:0 "Eğer §Y$TUR_first_five_year_plan$§! aktif §RDEĞİLSE§!:"
 TUR_continue_the_sumerbank_industrialization_scheme_desc:0 "1933'te kurulan Sümerbank Tekstil Fabrikası, ülkemizde tekstil sanayisinin inşasını ve gelişimini finanse eden devlete ait bir bankadır. Bankanın sorumluluklarını artırmaya devam etmeli ve sanayilerimizi beş yıllık plana uygun olarak genişletmeliyiz."
 TUR_continue_the_sumerbank_industrialization_scheme_tt:0 "Eğer §Y$TUR_first_five_year_plan$§! §GAktif§! ise:"
 TUR_continue_to_prioritise_balkan_integrity:0 "Balkan Bütünlüğünü Önceliklendirmeye Devam Et"
 TUR_continue_to_prioritise_balkan_integrity_desc:0 "Balkanlar'da barışın hüküm sürmesi her zaman çıkarımıza olmuştur. Özellikle birlikte... talihsiz geçmişlerimiz göz önüne alındığında, komşularımızı koruma ve yükseltme konusunda bir miktar sorumluluk hissettiğimizi itiraf etmeliyiz. O zaman geride kaldı: artık fatihler olarak değil, daha zayıf komşularımızı onlara zarar vermek isteyen yeni fatihlerden korumak isteyen sadık dostlar olarak yaklaşıyoruz."
 TUR_controlling_the_skies_of_europe:0 "Gökleri Kontrol Etmek"
 TUR_controlling_the_skies_of_europe_desc:0 "Üstün ateş gücü, savaşı nasıl kazanacağımızdır ve gökleri domine etme mücadelesine kendi ateş gücümüzü ekleyerek savaş çabasına aktif bir katkıda bulunmalıyız."
 TUR_cooperate_with_the_debt_council:0 "Borçlar Konseyi ile İşbirliği Yap"
 TUR_cooperate_with_the_debt_council_desc:0 "Büyük Savaş'tan sonra toz duman dağıldığında, Türkiye Cumhuriyeti ayakta kaldı: özgür ve bağımsız bir ulus. Tabii, [TUR.GetNameDef]'nin Osmanlı İmparatorluğu'nun biriktirdiği müstehcen borcu (bkz. pornografik paralar ödeniyor artık bu kulüpler bunları kaldıramaz hale geldi) miras alması ve aynı borcun denizaşırı ülkelerde bizi fethedecek olanlar tarafından yönetilmesi gerçeği hariç. İdeal değil, ama birlikte çalışabilir ve hepimize fayda sağlayacak bir senaryo icat edebiliriz."
 TUR_cooperative_research_centers:0 "İşbirlikçi Araştırma Merkezleri"
 TUR_cooperative_research_centers_desc:0 "Bu savaş, en büyük teknolojik yeteneklere sahip olan güç tarafından kazanılacaktır. Faşizm geleceğin inancıdır, bu yüzden savaşımızı yürütmek için sadece en modern teknolojilere ihtiyaç duymamız mantıklıdır."
 TUR_court_the_spanish:0 "İspanyolların Gönlünü Çel"
 TUR_court_the_spanish_desc:0 "İspanya liderinin ittifakımıza ve temsil ettiği şeye sempati duyduğu bir sır değil. Basit bir dostluk teklifi ve gelecekteki kazanımlar hakkında bazı belirsiz vaatler, onları daha kararlı bir şekilde tarafımıza çekmek için yeterli olacaktır."
 TUR_create_the_balkan_central_bank:0 "Balkan Merkez Bankası'nı Kur"
 TUR_create_the_balkan_central_bank_desc:0 "Ulusal para birimlerimizin yanı sıra tüm uluslarımız tarafından paylaşılan yeni bir para birimi benimseyeceğiz ve hepimizin yasal para birimi alışverişinde bulunabileceği ve iş anlaşmaları yapabileceği yeni bir merkez bankası kuracağız. Ne yanlış gidebilir ki?"
 TUR_create_the_turkish_workers_militia:0 "Türk İşçi Milislerini Oluştur"
 TUR_create_the_turkish_workers_militia_desc:0 "Siyaset kirli bir iştir ve hiçbir rejimin kalıcılığı garanti değildir. İşçileri silahlandırmamız ve onlara haklarını, onu elinden almak isteyenlere karşı koruma araç ve iradesini vermemiz önemlidir: bu ister yabancı bir güç olsun, ister kendi sınırlarımız içinden yeni ortaya çıkan bir siyasi hareket olsun."
 TUR_crowning_ourselves_with_the_fin_ugor:0 "Fin-Ugor ile Kendimizi Taçlandırmak"
 TUR_crowning_ourselves_with_the_fin_ugor_desc:0 "Turanist tacında [FIN.GetNameDef]'den daha güzel bir mücevher yoktur. [FIN.GetAdjective]leri fethetmek nihai hırsın toplamıdır ve biz bu hırsı karşılamayı ve Turanist kardeşliğimizi tamamlamayı tamamen niyetliyiz."
 TUR_crush_the_warmongers_in_rome:0 "Roma'daki Savaş Çığırtkanlarını Ez"
 TUR_crush_the_warmongers_in_rome_desc:0 "[ITA.GetAdjective]lar, Akdeniz'deki tüm sıkıntıların kaynağıdır. Onlar, güç hakkıyla Güney Avrupa'ya bir kanser gibi yayılabileceklerine inanan kötü niyetli bir tümördür. Savaşı onlara taşıyacağız ve onlara kendi ilaçlarından o kadar çok doz vereceğiz ki, boğulacaklar."
 TUR_cypriot_and_oniki_ilhak:0 "Kıbrıs ve Oniki Ada'nın İlhakı"
 TUR_cypriot_and_oniki_ilhak_desc:0 "[GRE.GetAdjective]ler istedikleri kadar enosis için ağlayabilirler; onları kendi oyunlarında kendi ilhakımızla yeneceğiz. Kıbrıs ve Rodos haklı olarak bizimdir ve onları tekrar ele geçirdiğimizde asla bırakmayacağız."
 TUR_deal_for_the_oniki_islands:0 "Oniki Adalar İçin Anlaşma"
 TUR_deal_for_the_oniki_islands_desc:0 "Kıyılarımızın hemen açığındaki Oniki Adalar ellerimizden sökülüp alındı ve o şehvet düşkünü İtalyanlara peşkeş çekildi, ama ondan önce de hain Yunanlılar adalar üzerinde hak iddia etmişti. Rodos Türk'tü ve Rodos yeniden Türk olacak!"
 TUR_debt_council_nationalized_tt:0 "§YBorçlar Konseyi§! artık §Y[TUR.GetNameDef]§!'nin borcunu kontrol etmeyecek."
 TUR_democratic_capstone_focus:0 "[Root.GetDemocraticCapstoneFocusName]"
 TUR_democratic_capstone_focus_desc:0 "[Root.GetDemocraticCapstoneFocusDesc]"
 TUR_democratic_transition_focus:0 "[Root.GetDemocraticTransitionFocusName]"
 TUR_democratic_transition_focus_desc:0 "[Root.GetDemocraticTransitionFocusDesc]"
 TUR_desert_camel_corps:0 "Çöl Deve Birlikleri"
 TUR_desert_camel_corps_desc:0 "Eğer Orta Doğu ve Afrika'da bu meşakkatli ve uzun süreli operasyonlara gireceksek, deveci birliklerimizi reforme etmemek kesinlikle saçma olur! Develerimizle, Kahire'den Cape Town'a rahat ve şık bir şekilde gidebiliriz!"
 TUR_dissolve_the_ODPA:0 "Borçlar Konseyi'ni Dağıt"
 TUR_dissolve_the_ODPA_desc:0 "Batılı güçler, sırf Osmanlılar onlara borçlu olduğu için sadakatimizin onların davasına borçlu olduğumuz anlamına geldiğini sanıyorlar. Emperyalistler değişmedi ve asla değişemeyeceklerini kanıtlamak için sürekli çabalıyor gibi görünüyorlar. Geçmişimizin bu eskimiş sembolünü ortadan kaldıracağız: kendimiz için ayağa kalkamayacak kadar zayıf olduğumuz zamanların sembolünü."
 TUR_edirne_research_exchange:0 "Edirne Araştırma Değişimi"
 TUR_edirne_research_exchange_desc:0 "İnisiyatifi ele alacağız ve Balkan Paktı'ndaki tüm son teknolojik ve bilimsel gelişmelerin ön saflarında durabilmemiz için çok uluslu serbest bir fikir akışını teşvik eden bir kamu kurumu oluşturacağız."
 TUR_embrace_military_tradition:0 "Askeri Geleneği Kucakla"
 TUR_embrace_military_tradition_desc:0 "Osmanlı İmparatorluğu bir zamanlar tüm Avrupa kıtasını tehdit ediyordu. Elbette, bazı hatalar yapıldı - ama geçmişe bakarak belki bir kez daha Viyana kapılarına ve ötesine yürüyebilecek bir orduya sahip olabiliriz."
 TUR_end_the_british_hegemony:0 "Britanya Hegemonyasına Son Ver"
 TUR_end_the_british_hegemony_desc:0 "Hain ve ebedi [ENG.GetAdjective] saltanatı şiddetli ve kesin bir şekilde sona erdirilinceye kadar bu dünya barış yüzü göremez. Bu bir savaş değil, bir görevdir."
 TUR_entice_the_greeks:0 "Yunanları Cezbet"
 TUR_entice_the_greeks_desc:0 "[GRE.GetNameDef] ile barış, Osmanlı İmparatorluğu'nun çöküşünden bu yana yönetimlerimizin çok sıkı çalıştığı bir şey olmuştur. Onlarca yıllık diplomatik çabaları bir kenara atmak için hiçbir nedenimiz yok, ancak bu savaşın karşı taraflarında kendimizi bulursak bu durum pekala değişebilir. Umalım ki bilgeliği dinlesinler ve geleceklerini gereksiz yere heba etmesinler."
 TUR_establish_the_committee_of_pan_turkism:0 "Pan-Türkizm Doktrinini Yay"
 TUR_establish_the_committee_of_pan_turkism_desc:0 "Avrasya'nın dört bir yanında ezilen Türk kardeşlerimiz, onları kötü efendilerinin pençesinden kurtarmamızı bekliyor. Tam olarak bunu yapmayı planlıyoruz ve dünyadaki her Türk, sınırlarımız içinde ve korumamız altında özgür olana kadar durmayacağız!"
 TUR_expand_the_air_bases:0 "Hava Üslerini Genişlet"
 TUR_expand_the_air_bases_desc:0 "Ulusumuz çok büyük ve hava kuvvetlerimizin [ROOT.GetAdjective] topraklarının her santimini kapsayabilmesi hayati önem taşıyor."
 TUR_expand_the_golcuk_naval_base:0 "Gölcük Deniz Üssü'nü Genişlet"
 TUR_expand_the_golcuk_naval_base_desc:0 "Gölcük Deniz Üssü'nü genişleterek boğaz ve Ege denizindeki stratejik hedeflerimizi destekleyebileceğiz."
 TUR_expanded_credit_on_our_debts:0 "Borçlarımız Üzerinde Genişletilmiş Kredi"
 TUR_expanded_credit_on_our_debts_desc:0 "Ne şans ki, büyük miktarda borçlu olduğumuz birçok ülkeyle müttefik olduk! Şüphesiz bu çatışmaya katılımımız, o borcun çoğunun silinmesi için yeterli bir nedendir, tabii ki hepsi ortak özgürlük savaşımız adına."
 TUR_expanding_our_armaments:0 "Silahlanmamızı Genişlet"
 TUR_expanding_our_armaments_desc:0 "Dünya değişiyor ve sadece Türkiye Cumhuriyeti'ni değil, aynı zamanda üzerinde durduğu ideolojik temelleri de tehdit edenlere karşı silahlanma sorumluluğu taşıyacağız. Sanayicileri buna ikna etmek ve ülkemizi korumada yardımlarını sağlamak çok az çaba gerektirecektir."
 TUR_expanding_our_navy:0 "Donanmamızı Genişlet"
 TUR_expanding_our_navy_desc:0 "Dünyanın önde gelen deniz güçlerinden bazılarıyla birlikte savaşıyoruz ve onlardan öğreneceğimiz çok şey var. Savaşın sonunda, donanmamız büyükler arasında övülecektir."
 TUR_expanding_the_saadabad_pact:0 "Sadabat Paktı'nı Genişlet"
 TUR_expanding_the_saadabad_pact_desc:0 "Sadabat Paktı, Kemalistlerin değerli bir girişimiydi, ama şimdi imzacılarla eskisinden çok daha fazla ortak noktamız olduğuna şüphe yok. Yarım tedbirlerle zaman kaybetmeyelim, bu anlaşmayı uygun bir ittifaka dönüştürebilmemiz için Sadabat Paktı üyelerine yaklaşma zamanı geldi."
 TUR_extend_an_olive_branch_to_bulgaria:0 "Bulgaristan'a Zeytin Dalı Uzat"
 TUR_extend_an_olive_branch_to_bulgaria_desc:0 "Balkan Paktı, Bulgar rövanşizmine karşı kuruldu, ancak o zamandan beri dünya çok daha kötü canavarlar doğurdu. Bulgaristan, bizim gibi, emperyalistlerin emperyal egemenlik arayışlarında manevra yapacakları başka bir piyon. Yardım eli uzatmalıyız - güçlerini bizimkiyle birleştirmelerine izin verelim, böylece hepimiz bu çatışmadan sınırlarımız ve ahlakımız bozulmadan çıkabiliriz."
 TUR_fatherland_first:0 "Önce Vatan!"
 TUR_fatherland_first_desc:0 "Türk toplumunun hükümeti baltalayacak ve kendi bencil nedenleriyle toplumumuzu istikrarsızlaştıracak birçok unsuru var. Bu bizimle sona eriyor: bugünden itibaren, Türkiye'nin her vatandaşı önce Vatanını düşünecek!"
 TUR_fatherland_first_tt:0 "£faction_tur_traditionalist §YGelenekselcilere§!, £faction_tur_kurdish §YKürtlere§! ve ulusumuzun diğer ezilenlerine, hepsini temsil eden bir hükümetin arkasında birleşmeleri için ülke çapında bir çağrı yapacağız."
 TUR_foreign_brigades_for_the_revolution:0 "Devrim İçin Yabancı Tugaylar"
 TUR_foreign_brigades_for_the_revolution_desc:0 "Marksizm temelde enternasyonalist bir inançtır ve bu yüzden dünyanın dört bir yanından devrimcilerin ortak küresel mücadelemizde savaşmak için ulusumuza akın etmesi sadece doğaldır."
 TUR_foreign_capital_tt:0 "Eski §YAvrupa'nın Büyük Güçleri§! ve §YABD§! ile ilişkilerimiz ne kadar iyi olursa, bedelini ödeyebileceğimiz §Yyatırım§! seçeneği de o kadar fazla olur."
 TUR_form_the_redshirts:0 "Kızılgömleklileri Kur"
 TUR_form_the_redshirts_desc:0 "Dünya çapındaki her meşru faşist hareketin bir gömlekli hareketi vardır! İngilizlerin ve İtalyanların karagömleklileri, Almanların kahverengigömleklileri, Çinlilerin mavigömleklileri var - kırmızı renk Türkiye Cumhuriyeti'ni en iyi yansıtıyor, bu yüzden kızılgömleklileri kuracağız! İnsanlar 'kızılgömlekli' terimini duyduklarında, anında hareketimizi destekleyen kadınları ve erkekleri düşünecekler! Biz dehayız!"
 TUR_fortified_defensive_bases:0 "Güçlendirilmiş Savunma Üsleri"
 TUR_fortified_defensive_bases_desc:0 "En iyi saldırının iyi bir savunma olduğu söylenir ve resmi duruşumuz aynı fikirde olmadığımız yönünde değil!"
 TUR_fortify_the_east_tt:0 "§Y[800.GetName]§! eyaletinin doğu sınırlarına §Y5 kara kalesi§! ekler.\n"
 TUR_fortify_the_north_tt:0 "§Y[354.GetName]§! üzerine bir §Ykara kalesi§! savunma hattı ekler.\n"
 TUR_fortify_the_south_tt:0 "§Y[164.GetName]§! üzerindeki her geçişe §Y2 kara kalesi§! ekler.\n"
 TUR_fortifying_contentious_areas:0 "Çekişmeli Alanları Güçlendirmek"
 TUR_fortifying_contentious_areas_desc:0 "Balkanlara boşuna Avrupa'nın Barut Fıçısı denmemiştir. Her bir ülkemizde daha büyük bir güçle çatışma için en az bir potansiyel parlama noktası bulunmaktadır. Bu parlama noktalarının yeterince savunulmasını ve güçlendirilmesini sağlamak bizim görevimizdir."
 TUR_fortifying_the_bosporus:0 "Boğaziçi'ni Güçlendirmek"
 TUR_fortifying_the_bosporus_desc:0 "Boğaziçi, Karadeniz ile Akdeniz arasındaki geçit kapısıdır. Süveyş Kanalı ağır bir şekilde savunulmaktadır, Cebelitarık Boğazı'nın girişleri de öyle. O halde kendi boğazımızı korumasız ve yabancı güçlerin tacizine açık bırakmak mantıklı mı? Değil. Bizim olanı savunmak için çok çalışacağız."
 TUR_fortifying_the_bosporus_edirne_tt:0 "§YTürk Boğazları§! boyunca ikinci seviye bir §Ykara kaleleri§! dizisi ekler.\n"
 TUR_fortifying_the_bosporus_istanbul_tt:0 "Şehir içine §Y3 kara kalesi§! ekler.\n"
 TUR_fully_integrate_the_is_bank:0 "İş Bankası'nı Tamamen Entegre Et"
 TUR_fully_integrate_the_is_bank_desc:0 "Celâl Bayar ve bir grup benzer düşünceli liberal ve demokrasi savunucusu, Atatürk'ün 1924'te kurduğu İş Bankası kurumuna kendilerini bağladılar. İş Bankası'nı ve ona zincirlenmiş liberalleri entegre ederek, ulusumuza ve tüm dünyaya Türkiye'nin nihayet tam teşekküllü bir demokrasi olma yolunda ilk birkaç çekingen adımı atmaya hazır olduğunu gösterebiliriz."
 TUR_georgian_manganese_extraction:0 "Gürcistan'da Manganez Çıkarma"
 TUR_georgian_manganese_extraction_desc:0 "Gürcistan içinde kullanılmayan birçok mineral ve metal kalırken, kendi çelik stoklarımız hayal kırıklığı yaratacak kadar düşük kalmaya devam ediyor. Bölgesel Gürcü yönetimine bir teklif göndereceğiz ve metallerini onlar için çıkarmamız karşılığında fazlalıkların bir kısmını kendimize saklama hakkı için pazarlık yapacağız. Eğer kabul ederlerse, çeliği Trabzon'daki operasyonun hemen yanında üreteceğiz."
 TUR_guarding_our_western_frontiers:0 "Batı Sınırlarını Güçlendirmek"
 TUR_guarding_our_western_frontiers_desc:0 "Egemenliğimize yönelik en büyük tehdit batıdan geliyor. Batılı uluslar üzerimize geldiğinde, onları doğdukları denizlere geri itmeye hazır olduğumuzu görecekler."
 TUR_halk_ve_devlet:0 "Halk ve Devlet"
 TUR_halk_ve_devlet_desc:0 "'Halk ve Devlet' - Kemalist-sosyalist hükümetimizin önceliği burada yatmaktadır. Halkımızı korumalı ve güvence altına almalıyız ve bunu en iyi şekilde devletin her konudaki yetkilerini güçlendirerek yapabiliriz."
 TUR_hava_okulu:0 "Hava Okulu"
 TUR_hava_okulu_desc:0 "Askeri ve sivil havacılığa adanmış bu kadar eski ve saygıdeğer bir akademiye sahip olmaktan gurur duyuyoruz. Hava savaşı çabalarımıza daha fazla odaklanmalıyız."
 TUR_holding_our_first_multi_party_election:0 "İlk Çok Partili Seçimimizi Yapmak"
 TUR_holding_our_first_multi_party_election_desc:0 "Türkiye Cumhuriyeti'nin kaderi, yaklaşan seçime bağlı olarak pamuk ipliğine bağlı: ama adil bir şekilde savaşmaya yemin ettik ve adil bir şekilde savaştık. Türk halkının doğru kararı vereceğine güvenilebilir."
 TUR_host_exiled_scientists:0 "Sürgündeki Bilim İnsanlarını Ağırla"
 TUR_host_exiled_scientists_desc:0 "Zorba aptallar tarafından yönetilen pek çok ulus, en iyi ve en parlak beyinlerini, sırf o bilim insanları zalim bir gündeme hizmet etmeyi kabul etmeyecekleri için kısa görüşlü bir şekilde sürgün etmeye hazır. O sürgünlere burada, [TUR.GetNameDef]'de bir yuva sunacağız, çünkü onlara büyük bir ihtiyacımız var."
 TUR_hunt_down_fifth_columnist_islamists:0 "Beşinci Kol İslamcılarını Avla"
 TUR_hunt_down_fifth_columnist_islamists_desc:0 "Avrupa, enternasyonalist komünist beşinci kollarından endişe ederken, biz ulusumuzun doğuşundan beri kendi enternasyonalist beşinci kollarımızla mücadele ediyoruz. Büyük cumhuriyetimize radikal İslam'dan ve onun eskimiş savunucularından daha büyük bir varoluşsal tehdit yoktur. Osmanlı İmparatorluğu'nun bu posalarını oldukları gibi böcekler gibi ezeceğiz."
 TUR_imperial_factories:0 "İmparatorluk Fabrikaları"
 TUR_imperial_factories_desc:0 "Kemalistlerin 'Devletçilik' adında ilginç bir fikri vardı ve biz asla açıkça bir Kemalist ideolojik direği desteklemesek de, devletin üretim araçlarını merkezi olarak organize etmenin ve kontrol etmenin... faydalı olabileceğini hissetmeden edemiyoruz. Komünizm veya faşizmle karşılaştırmayın: fabrikaların hepsi Sultan'a ait olacak - biz sadece bu fabrikaları onun adına yöneteceğiz!"
 TUR_increase_german_military_aid:0 "Alman Askeri Yardımını Artır"
 TUR_increase_german_military_aid_desc:0 "Eğer [GER.GetAdjective]ler cephelerdeki ilerlemelerine ayak uydurmamızı bekliyorlarsa, yıllar içinde topladıkları bol miktardaki teknolojiden birazını paylaşmaları gerekiyor. Elbette, daha yoğun bir kapasitede savaşmak isteriz - ancak biraz [GER.GetAdjective] yardımı bu arzuyu kolaylaştırmada büyük bir yol kat edebilir."
 TUR_integrate_german_officers_into_the_army:0 "Alman Subaylarını Orduya Entegre Et"
 TUR_integrate_german_officers_into_the_army_desc:0 "Ülkemizdeki Alman askeri yetkililerin rolünü artık gizlemeye gerek kalmadığından, onları [GER.GetLeader]'in açık rızasıyla resmi olarak komuta zincirimize entegre ettik."
 TUR_integrate_the_fascist_council:0 "Faşist Konseyi Entegre Et"
 TUR_integrate_the_fascist_council_desc:0 "Recep Peker'in danışman Faşist Konseyi devletin kenarında yeterince uzun süre var oldu, Türk faşist değerlerini Kemalizm'in çerçevesine entegre etmeye başlama zamanı geldi."
 TUR_integrated_armed_forces:0 "Entegre Silahlı Kuvvetler"
 TUR_integrated_armed_forces_desc:0 "Bu iddialı bir program, ama takip etmeye değer olduğuna karar verdiğimiz bir program. Biz küçük ulusların büyük bir güç karşısında karşılaştığı zor durum ışığında, çok uluslu bir Balkan Antantı silahlı kuvvetler örgütüne öncülük etmeye karar verdik. Birleştiğimizde emperyalistler tarafından mum gibi söndürülmememiz için birbirimize gerektiği gibi kaynak sağlayacağız."
 TUR_intervene_in_the_spanish_civil_war:0 "İspanya İç Savaşı'na Müdahale Et"
 TUR_intervene_in_the_spanish_civil_war_desc:0 "İspanya İç Savaşı, rakip ideolojiler için dünyanın petri kabına dönüştü. Akdeniz'i paylaşıyoruz ve bu bize, savaştaki seçtiğimiz taraf adına müdahale etme hakkını çoğundan daha fazla veriyor."
 TUR_invite_bulgaria:0 "Bulgaristan'ı Davet Et"
 TUR_invite_bulgaria_desc:0 "[BUL.GetNameDefCap] çok uzun süredir kenarda oturdu. [GER.GetNameDef] ile olan gelecekleri şüphe götürmez, sadece sadakatlerini ne zaman nihayet ilan edecekleri belirsiz. [BUL.GetAdjective]lerin cesaretlerini bulmalarına yardımcı olacağız."
 TUR_invite_german_officers_to_izmir:0 "Alman Subayları [339.GetName]'e Davet Et"
 TUR_invite_german_officers_to_izmir_desc:0 "[GER.GetAdjective] askeri danışmanları dünyanın gıpta ettiği kişilerdir. Ordumuzu ve taktiklerini modernize etmek için, Avrupa'daki en modern silahlı kuvvetlere sahip insanların yardımını almalıyız."
 TUR_invoke_the_methods_of_mehmed_ii:0 "II. Mehmed'in Yöntemlerini Uygula"
 TUR_invoke_the_methods_of_mehmed_ii_desc:0 "II. Mehmed'den, bir sorun aşılamaz göründüğünde, büyük bir topun genellikle çok uygun bir çözüm olacağını öğrendik."
 TUR_issue_an_ultimatium_to_the_bulgarians:0 "Bulgarlara Ültimatom Ver"
 TUR_issue_an_ultimatium_to_the_bulgarians_desc:0 "[BUL.GetNameDef]'den daha pis bir ulus var mıydı? Tekrar tekrar, kendi bencil, irredentist sanrılarını yerine getirmekten başka bir nedenle Balkanlar'daki dengeyi bozdular. Onlara hükmedeceğiz ve bunu yaparken [BUL.GetAdjective] işçisini kurtaracağız - gerçekten hak etmese bile."
 TUR_join_the_allies:0 "Müttefiklere Katıl"
 TUR_join_the_allies_desc:0 "Dünya bir kader anına ulaştı ve biz, dünyayı sonsuza dek değiştirmek için yarışan birçok imparatorluğun yol ayrımında oturuyoruz. Ülkemizin üzerine kurulduğu değerler için ayakta durmalı ve özgürlük ve hürriyet adına Batı uluslarıyla savaşmalıyız."
 TUR_join_the_axis:0 "Mihver'e Katıl"
 TUR_join_the_axis_desc:0 "[ROOT.GetNameDef]'in geleceği, dünyanın kaderini yeniden şekillendirecek olan ulusla çok açık bir şekilde yatmaktadır. Hiçbir ülke, eski statükoyu sarsmaya ve [GER.GetNameDef] kadar yeni bir barış ve refah çağı getirmeye hazır değildir. Gelecek vizyonlarını gerçekleştirmelerine yardımcı olmalıyız."
 TUR_join_the_central_powers:0 "İttifak Devletleri'ne Yeniden Katıl"
 TUR_join_the_central_powers_desc:0 "Bir zamanlar bir güçler paktı olarak birlikte başarısız olduk, ama bu sefer başarısız olmayacağız! Kader bir şekilde hepimize Büyük Savaş'ın yanlışlarını düzeltmek için ikinci bir şans verdi ve hepimiz birlikte o fırsatı sıkıca yakalamalıyız!"
 TUR_joint_budgets_on_fortifications:0 "Tahkimatlar İçin Ortak Bütçeler"
 TUR_joint_budgets_on_fortifications_desc:0 "Tahkimat hatları uzun zamandır çoğu savunma doktrininin temel bir parçası olmuştur ve bugün bazıları bu tür stratejilerin modern teknoloji tarafından modası geçmiş olduğunu öne sürse de, tahkimatın hala bir miktar kullanımı olabileceğine inanıyoruz. Hepimiz birbirimizin savunmasına katkıda bulunarak, kolektif güvenliğimizi garanti ederiz."
 TUR_joint_caucasian_turkish_officer_school:0 "Ortak Kafkas-Türk Subay Okulu"
 TUR_joint_caucasian_turkish_officer_school_desc:0 "Kars, hikayeli bir tarihe sahip bir şehirdir ve [SOV.GetNameDef]'e yakınlığı, onu yeni bir siyasallaşmış subay okulu kurmak için ideal bir konum haline getirir. Subaylarımıza sadece savaşın temelleri değil, aynı zamanda Marksist doktrinin incelikleri de öğretilecektir."
 TUR_kemalism_and_the_modern_movement:0 "Kemalizm ve Modern Hareket"
 TUR_kemalism_and_the_modern_movement_desc:0 "Recep Peker, faşizmin Kemalizm ile nasıl uyumlu olabileceğine dair bir raporla İtalya'dan döndüğünde, görevinden atıldı. Faşizm yirminci yüzyılın inancıdır ve Türkiye için en uygun ideolojiyi Adriyatik'in hemen karşısında bize bakarken gözden kaçırdığımız için aptallık ettik!"
 TUR_kemalism_and_the_modern_movement_tt:0 "§YAvrupa§!'daki tüm §Yfaşist§! ülkelerin [ROOT.GetNameDef]'ye olan görüşleri §G+25§! artacaktır."
 TUR_kemalist_officers_made_hostile_tt:0 "§RKemalist Subaylar, hükümetin eylem planına şiddetle karşı çıkacaklardır.§!"
 TUR_kemalist_socialist_theory:0 "Kemalist Sosyalist Teori"
 TUR_kemalist_socialist_theory_desc:0 "Kadro Hareketi, temelde vatansever bir sosyalizm biçimini savunur ve birçok yönden İngiliz faşizm türü ile Marksizm-Leninizm'e çok benzer. Özünde Kadro, Türk işçisini temel bir düzeyde ilk sıraya koyar ve bunu yaparken onların ulusal kimliğini ortadan kaldırmaya çalışmaz. Bizimki gerçekten devrimci bir harekettir ve daha da önemlisi: gerçekten de Türk olan bir harekettir."
 TUR_kemalist_state_targets_tt:0 "İki tarafsız eyalet §YKemalist§! olur.\n"
 TUR_kemalists_purged_tt:0 "Tüm £faction_tur_kemalist §YKemalist§! eyalet etkenlerini kaldırır."
 TUR_konfederasyon:0 "Konfederasyon"
 TUR_konfederasyon_desc:0 "Azerbaycan halkıyla her zaman büyük bir yakınlığımız oldu ve Azeri halkına Türk halklarının bu güzel birliğinde eşit vatandaşlık hakkı tanımak mutlak bir ayrıcalık olurdu."
 TUR_learning_from_the_great_war:0 "Büyük Savaş'tan Ders Almak"
 TUR_learning_from_the_great_war_desc:0 "Ordularımız Kurtuluş Savaşı'ndan İtilaf Devletleri ve Osmanlılara karşı galip çıksa da, ulusumuz özgürlüğün bedelini kanla ödedi. Bir daha asla bu kadar yıkıcı bir felaketin ülkemize vurmasına izin vermemeliyiz. Geçmişteki hatalarımızdan ders almalı ve zaferlerimizi incelemeliyiz."
 TUR_learning_from_the_tripolitanian_war:0 "Trablusgarp Savaşı'ndan Ders Almak"
 TUR_learning_from_the_tripolitanian_war_desc:0 "Osmanlı İmparatorluğu'nun çöküşünü başlatan olaylar zinciri o kadar hızlı gelişti ki, öğrenilen dersler üzerine düşünmek için neredeyse hiç zaman olmadı. [ITA.GetAdjective]ler Osmanlı Libyası'nı işgal edip bizden aldığında yaptığımız hatalardan ders almalıyız."
 TUR_liberate_the_kurdish_diaspora:0 "Kürt Diasporasını Özgürleştir"
 TUR_liberate_the_kurdish_diaspora_desc:0 "Türk ve Kürt halklarının kaderleri iç içe geçmiştir ve eğer hepimiz bu işin içinde birlikte olmazsak, tarih sonsuza dek tekerrür etmeye mahkumdur."
 TUR_lift_the_ban_on_other_political_parties:0 "Diğer Siyasi Partiler Üzerindeki Yasağı Kaldır"
 TUR_lift_the_ban_on_other_political_parties_desc:0 "İstisnasız, CHP'ye rakip olmak için ne zaman yeni bir siyasi parti kurulsa, bu parti cumhuriyetimizi ve onun kurucu ilkelerini kendi amaçları için saptıracak olan dinci aşırı muhafazakarlar tarafından kaçınılmaz olarak ele geçirildi. Bu sefer işler farklı olmalı - ve yine de aynı şekilde tetikte kalmalıyız."
 TUR_lift_the_turkiye_komunist_partisis_exile:0 "Türkiye Komünist Partisi'nin Sürgününü Kaldır"
 TUR_lift_the_turkiye_komunist_partisis_exile_desc:0 "Türkiye Komünist Partisi'nin birçok üyesi hala [SOV.GetNameDef]'de sürgünde veya Avrupa genelinde gizli hücrelerde saklanıyor. TKP'nin söyleyeceği her şeye katılmayabiliriz, ama aynı sınıf kurtuluş mücadelesinde yoldaş kalmaya devam ediyoruz. Onları eve getirme zamanı geldi."
 TUR_loosen_the_laws_on_secularism:0 "Laiklik Yasalarını Gevşet"
 TUR_loosen_the_laws_on_secularism_desc:0 "Din, ulusumuz için en büyük bölücü faktör olmuştur: laiklik yoluna bağlı kaldık, ama neden? Batının zayıf uluslarını taklit etmek için mi? Bir insanın ne zaman, nerede ve nasıl tanrısına dua edeceğine karar vermek devletin işi değildir."
 TUR_mechanising_our_army:0 "Ordumuzu Mekanize Etmek"
 TUR_mechanising_our_army_desc:0 "Bu iddialı bir hedef ama bir zorunluluktan kaynaklanıyor. Er ya da geç, tüm ordular mekanize olacak. Sadece böyle bir çabayı şimdi mi üstlenmeye hazır olduğumuza veya gelecekte daha uygun hale gelene kadar bekleyip beklemeyeceğimize karar vermeliyiz."
 TUR_mediterranean_merchant_fleet:0 "Akdeniz Ticaret Filosu"
 TUR_mediterranean_merchant_fleet_desc:0 "Konvoylar bu ittifakın can damarıdır ve hepimiz mevcut konvoy miktarını artırmak için daha iyi bir kolektif çaba göstermeliyiz. Elbette, bu yeni ticaret filosu aynı zamanda denizcilik araştırmaları hakkında ek bilgi paylaşmak için gizli bir araç olarak da kullanılırsa, bu özellikle verimli bir çaba olabilir."
 TUR_millet_mektebi_focus:0 "Millet Mektepleri"
 TUR_millet_mektebi_focus_desc:0 "Program bir süredir devam ediyor olsa da harf ve dil devrimleri ülke çapında hâlâ uygulanmaktadır. Yaygın cehaletle mücadele etmek için Türk Dili Tetkik Cemiyeti'nden ve millet mektepleri programından yararlanmalıyız. Okuryazarlığı artırma hedefiyle okulu olmayan köyler arasında dolaşan gezici öğretmen ekiplerine de ek ödenek sağlanmalıdır."
 TUR_misak_i_milli:0 "Misak-ı Millî"
 TUR_misak_i_milli_desc:0 "Misak-ı Millî - Ulusal Yemin. Osmanlı İmparatorluğu'nun çöküşünden ve Kurtuluş Savaşı'nın sona ermesinden sonra, sahip olduğumuz büyük bir toprak parçasını gönüllü olarak teslim ettik ve toprak üzerindeki iddialarımızdan vazgeçtik. Dünya şimdi farklı ve bu topraklardaki insanlar geri dönmemiz için haykırıyor. Onlara boyun eğeceğiz."
 TUR_modernising_the_army:0 "Orduyu Modernleştirmek"
 TUR_modernising_the_army_desc:0 "Savaştaki teknolojik yenilikler konusunda geride kaldık. Geçmişimizdeki kan dökülmesinin tekrarını önlemek için, taktiklerimizi ve teçhizatımızı hızla modernize etmeliyiz."
 TUR_nationalise_all_private_industry:0 "Tüm Özel Sanayiyi Millileştir"
 TUR_nationalise_all_private_industry_desc:0 "Sanayicilerin ve liberallerin Türk devletini yırtıcı yabancı güçlerden koruma ortak mücadelemizdeki katkılarını göz ardı etmiyoruz, ama hadlerini aştılar. Bizi yırtıcı risk sermayedarlarından korurken, kendileri yırtıcı risk sermayedarları oldular. Buna daha fazla müsamaha gösterilemez: sanayimizi millileştirmeli ve işçilerimizi korumalıyız."
 TUR_no_faction_alliance_members_tt:0 "Sadabat Paktı imzacıları Sadabat Uyuşmasını onaylamadı"
 TUR_no_faction_members_tt:0 "Sadabat Paktı'nın imzacısı yok"
 TUR_officers_of_the_revolution:0 "Devrim Subayları"
 TUR_officers_of_the_revolution_desc:0 "Tıpkı Kemalist subayların kendi ideolojilerini temsil edip korumaları gibi, yeni subaylarımız da [TUR.GetNameDef]'de Marksizm'in koruyucuları olarak hizmet edecekler."
 TUR_official_opposition_party_organised:0 "Resmi bir muhalefet partisi örgütlendi."
 TUR_pack_for_a_long_winter:0 "Uzun Bir Kış İçin Hazırlan"
 TUR_pack_for_a_long_winter_desc:0 "Avrasya'nın bazı acı soğuklarını taklit etmek kolay bir iş değil, ama idare etmek zorunda kaldık. Askerlerimizin tüm yıl boyunca alpin ve buzul benzeri koşullarda eğitim alabilmesi için Erzurum'daki Palandöken Dağı'nın zirvesine bir tesis ve Ağrı Dağı çevresinde daha küçük ek bir tesis inşa etmeyi seçtik."
 TUR_partnership_pact_with_bulgaria:0 "Bulgaristan ile Ortaklık Paktı"
 TUR_partnership_pact_with_bulgaria_desc:0 "[BUL.GetAdjective] halkını çok sert yargılamamak akıllıca olur, aksi takdirde düşmanın kollarına itilebilirler. Onlara bir alternatif sunalım: otokrasi ve yolsuzluk yerine özgürlük ve adalet tarafında durma fırsatı."
 TUR_patriotism_over_internationalism:0 "Uluslararasıcılık Değil, Vatanseverlik"
 TUR_patriotism_over_internationalism_desc:0 "Troçkizm'in ve radikal Marksizm'in enternasyonalizmini reddediyor, bunun yerine gerçekten ulusal bir sosyalizm biçimini tercih ediyoruz. Uluslararası işçinin çektiği sıkıntılar, Türk emekçisinin mücadelelerine göre ikincil öneme sahiptir ve Kemalist-sosyalizmi komünizmin daha radikal türlerinden ayıran da budur."
 TUR_patrol_the_seas:0 "Denizlerde Devriye Gez"
 TUR_patrol_the_seas_desc:0 "Okyanusumuz işgale karşı doğal bariyerimizdir ve ona bir kara sınırı gibi bakmalıyız."
 TUR_peace_at_home:0 "Yurtta Sulh"
 TUR_peace_at_home_desc:0 "Potansiyel düşmanlarımız, içimizde bir zayıflık hissettikleri anda üzerimize atlayacaklardır. Devletin refahını ve iç istikrarını sağlamak, tüm Türk yönetimlerinin en önemli sorumluluğudur. Yurtta Sulh olduğunda, Cihanda Sulh'u arzulayabiliriz."
 TUR_peace_in_the_world:0 "Cihanda Sulh"
 TUR_peace_in_the_world_desc:0 "Atatürk bir zamanlar Yurtta Sulh, Cihanda Sulh'u Türk dış politikasının nihai amacı olarak ilan etti ve biz bu yüce hedefe ulaşmayı planlıyoruz. Önemsiz toprak kavgaları üzerinde ebedi bir savaş için değil, yeryüzünde barış için çalışıyoruz."
 TUR_peninsular_network_of_factories:0 "Yarımada Fabrika Ağı"
 TUR_peninsular_network_of_factories_desc:0 "Tek başımıza, [GER.GetNameDef] ve [SOV.GetNameDef] gibi daha büyük ve daha sanayileşmiş ülkelere karşı duramayız, ama birlikte - hepimiz potansiyelimizi en üst düzeye çıkarmak için kaynaklarımızı bir araya getirerek? Bu bizi kendi başımıza kudretli bir güç yapacaktır."
 TUR_permit_regional_elections:0 "Bölgesel Seçimlere İzin Ver"
 TUR_permit_regional_elections_desc:0 "Türkiye birçok din, kültür ve çıkarın bulunduğu büyük bir ülkedir - belki de ulus genelinde, hatta Kemalizm'e karşı en sert şekilde toplananlara bile belirli bir derecede özerkliğe izin verirsek, anayasanın sınırlarını çok fazla zorlamış olmayız... tabii ki hepsi ulusal güvenlik adına."
 TUR_pivot_to_the_past:0 "Geçmişe Yönel"
 TUR_pivot_to_the_past_desc:0 "Kurtuluş Savaşı bir zorunluluk olabilirdi, ama Cumhuriyet bir hataydı. Atatürk artık değerli laik cumhuriyetini korumak için burada değil ve halk Osmanlı Saltanatı'nın geri dönmesi için haykırıyor. Kemalistleri tamamen alt ettikten sonra onlara boyun eğeceğiz."
 TUR_pontic_redoubt_erzurum_tt:0 "Erzurum şehrine §Y3 kara kalesi§! ekler.\n"
 TUR_pontic_redoubt_trabzon_tt:0 "[SOV.GetAdjective] sınırına yakın Çoruh Nehri boyunca §Y7 kara kalesi§! ekler.\n"
 TUR_pontic_redoubt_van_tt:0 "[SOV.GetAdjective] sınırına yakın Kars Çayı boyunca §Y6 kara kalesi§! ekler.\n"
 TUR_preempt_bulgarian_alignment:0 "Bulgar Hizalanmasını Önle"
 TUR_preempt_bulgarian_alignment_desc:0 "Balkanların Prusyası bizim gibi daha küçük bir güç olabilir, ancak kudretli bir büyük gücün açlığına ve hırsına sahipler. Bulgarların fırsatını buldukları anda kendi kişisel çıkarları için hepimizi arkadan bıçaklamayacaklarından bir an bile şüphe edebilir miyiz? Cevap hayır, bu da geriye tek bir çözüm bırakıyor: Bulgaristan yok edilmeli."
 TUR_press_the_austro_hungarian_claim:0 "Avusturya-Macaristan İddiasını Zorla"
 TUR_press_the_austro_hungarian_claim_desc:0 "Türkiye Cumhuriyeti'nin küllerinden muzaffer dönüşümüz gerçekten de büyük bir olaydı, ama her tarafımızda bizi bir kez daha yok olmuş görmek isteyen düşmanlarla çevriliyiz. Müttefiklere ihtiyacımız var ve Tuna'ya Osmanlı liderliğindeki bir sefer pek de emsalsiz olmazdı."
 TUR_pressure_portugal_to_join:0 "Portekiz'e Katılması İçin Baskı Yap"
 TUR_pressure_portugal_to_join_desc:0 "[POR.GetNameDefCap] teknik olarak Akdeniz'e sınırı olmayabilir, ancak bölgenin geleceğinde büyük bir payı var. Onların büyük imparatorluğuna ihtiyacımız var ve bizim gibi dostlardan çok şey kazanabilirler."
 TUR_privatize_our_infrastructure:0 "Altyapımızı Özelleştir"
 TUR_privatize_our_infrastructure_desc:0 "Sadık liberaller olarak, devletin her bir inşaat meselesine müdahale etmesine izin vermek yerine özel girişime daha fazla güvenmeyi öğrenmeliyiz. Daha fazla il altyapısı için bir talep varsa, piyasa bu talepleri karşılamak için yükselecektir!"
 TUR_privatize_the_anadolu_agency:0 "Anadolu Ajansı'nı Özelleştir"
 TUR_privatize_the_anadolu_agency_desc:0 "Basın özgürlüğü gerçek bir demokraside bir zorunluluktur ve özgür bir medyayı sevmesek de onlarla başa çıkmayı öğrenmek zorunda kalacağız. Atatürk'ün 1920'de kurmasından bu yana Türkiye genelinde haber yayan devlet kontrolündeki Anadolu Ajansı'nı özelleştirerek bu yönde büyük bir adım atabiliriz."
 TUR_privatize_the_anadolu_agency_tt:0 "§YBasın Sansürü Uygula§! kararını kaldırır."
 TUR_provide_refuge_to_the_victims_of_fascism:0 "Faşizm Kurbanlarına Sığınak Sağla"
 TUR_provide_refuge_to_the_victims_of_fascism_desc:0 "Faşist dava, kurbanlarını seçerken ayrım yapmaz. Bu demagoglar bir yandan kitlelere büyüklük sanrılarıyla yaltaklanırken, diğer yandan fareleri lağımdan salıverirler. Kendilerini koruma imkanı olmayanları korumalıyız."
 TUR_punish_french_weakness:0 "Fransız Zayıflığını Cezalandır"
 TUR_punish_french_weakness_desc:0 "[FRA.GetAdjective] üç renkli bayrağı bir zamanlar Napolyon günlerinde Avrupa'nın yarısında dalgalanıyordu. Bugün, Paris üzerinde dalgalanmaya bile uygun değil. '[FRA.GetNameDef]' olarak bilinen ulusun küresel utancına son verme zamanı geldi de geçiyor."
 TUR_purchase_italian_light_tanks:0 "İtalyan Hafif Tankları Satın Al"
 TUR_purchase_italian_light_tanks_desc:0 "Ordunun belkemiğini destekleyen güçlü, güvenilir zırh olmadan modern bir silahlı kuvvetlere sahip olamazsınız. Kendi zırhlılarımızdan edinmeliyiz ve dünyada üretilen en büyük tankların [ITA.GetNameDef]'den çıktığına şüphe var mı?"
 TUR_purge_the_kemalists:0 "Kemalistleri Tasfiye Et"
 TUR_purge_the_kemalists_desc:0 "Ülkemizi Kemalist belasından kurtararak, eski yaşam ve yönetim tarzımıza dönüşün tohumlarını ekmiş olacağız. Sultan'ın dönüşü kaçınılmazdır, tıpkı geçici cumhuriyetçilerin yok edilmesi gibi."
 TUR_purify_the_diyanet:0 "Diyanet'i Arındır"
 TUR_purify_the_diyanet_desc:0 "Diyanet, boş ve anlamsız hayatlarında bir kez bile Yüce Allah'a dua etmemiş adamlarla dolduruldu. Diyanet inançlı adamlarla doldurulmalı: devlete hizmet eden ve rehberlik ve teselli için Allah'a yönelen adamlarla!"
 TUR_raise_opinion_of_america_tt:0 "§YAmerika Birleşik Devletleri§!'nin bize olan görüşü ne kadar yüksek olursa, imtiyazın onaylanma olasılığı o kadar artar."
 TUR_ratify_the_six_arrows:0 "Altı Ok'u Onayla"
 TUR_ratify_the_six_arrows_desc:0 "Altı Ok, Kemalizm'in altı temel direğini simgeler ve bu ilkeleri Türkiye'nin ulusal anayasasına onaylamamız, Kemalist değerleri tüm Türkiye'ye yerleştirme misyonumuzda bize kesinlikle büyük ölçüde yardımcı olacaktır."
 TUR_readdress_the_montreux_convention:0 "Montrö Sözleşmesini Yeniden Ele Al"
 TUR_readdress_the_montreux_convention_desc:0 "Montrö Sözleşmesi'ni ilk düzenlediğimizde, [SOV.GetAdjective] pozisyonunu değerlendirirken belki de çok sert davrandık. İmzalanan beyanı yeniden gözden geçirmeli ve dostluk ve iş birliği adına [SOV.GetNameDef]lerin istediği tavizleri vermeliyiz."
 TUR_reaffirm_the_balkan_pact:0 "Balkan Paktı'nı Yeniden Kur"
 TUR_reaffirm_the_balkan_pact_desc:0 "Balkan Paktı, Bulgar ve Macar yayılmacılığına karşı kuruldu, ancak o zamandan beri dünya önemli ölçüde daha tehlikeli hale geldi. Balkan Paktı yetersiz, onu bir Balkan Antantı'na dönüştürmeliyiz!"
 TUR_realize_the_nightmare_of_meiji:0 "Meiji Kabusunu Gerçekleştir"
 TUR_realize_the_nightmare_of_meiji_desc:0 "Sultan II. Abdülhamid, Japon imparatorunun İslam'a geçip Türk hükümdarının yerine kendilerini Halife ilan etmesinden korkardı. Bu asla gerçekleşmedi. Maalesef, Japonya Lozan'ı imzaladığı gibi Sevr'i de imzaladı - Japonlara uzun süre hayranlık duysak da, onlar da diğer eski güçler kadar suçlular. Nihon (Japonya) Hidivliği'ni doğrudan Kostantiniyye'den yöneterek onları alçaltacağız."
 TUR_rebuilding_our_nation:0 "Ulusumuzu Yeniden İnşa Etmek"
 TUR_rebuilding_our_nation_desc:0 "Kemalistler, halkın iradesini bastırmak için beyhude girişimlerinde ulusumuzu harap ettiler. Düşmanlarımız bizi zayıf görecek, bu yüzden mümkün olan en hızlı şekilde yeniden inşa etmeliyiz!"
 TUR_rebuke_the_treaty_of_kars:0 "Kars Antlaşmasını Reddet"
 TUR_rebuke_the_treaty_of_kars_desc:0 "Kars Antlaşması, [ROOT.GetNameDef] ile Kafkasya arasındaki sınırları belirlemeyi amaçlıyordu, ancak o lanetli bölgedeki Türk yerlerinin hayatları tehlikedeyken böyle bir antlaşmanın ne ağırlığı olabilir ki? Akrabalarımızı kurtarmak için dişimizle tırnağımızla savaşacağız."
 TUR_rebuke_the_treaty_of_lausanne:0 "Lozan Antlaşması'nı Reddet"
 TUR_rebuke_the_treaty_of_lausanne_desc:0 "Büyük Savaş'ın bitiminden sonra bize dayatılan antlaşmanın pek çok hükmünü zaten ihlal ettik. Tıpkı müttefiklerimizin bizden önce yaptığı gibi, nihayet düşmanlarımızın boyunduruğunu atma zamanı geldi. Talihsiz bir durum, ancak [GRE.GetAdjective] meselesi çözülene kadar batı sınırlarımızın güvende olacağına güvenemeyiz."
 TUR_reclaim_macedonia:0 "Makedonya Sancağını Geri Al"
 TUR_reclaim_macedonia_desc:0 "Batımızdaki o sadakatsiz köpekler, son Osmanlı İmparatorluğu'nun çöküşünde merkezi bir rol oynadılar. Yunanlılar, zavallı, hastalıklı imparatorluklarını dağıttığımız andan beri bize kin beslediler - ve şimdi Trakya ve Makedonya'nın çoğunu bizden alıkoyuyorlar. Yurttaşlarımızı kurtarma zamanı geldi, aynı zamanda biraz da intikam alırken..."
 TUR_reclaiming_our_lost_empire:0 "Yıkılan İmparatorluğumuzu Geri Al"
 TUR_reclaiming_our_lost_empire_desc:0 "Kemalistleri iktidardan uzaklaştırmak ve Sultan'ın otoritesini geri getirmek, ana planımızın sadece ilk adımlarıydı. İmparatorluğumuz tekrar bütün olana kadar tüm dünyada yürüyeceğiz!"
 TUR_reconciling_kemalism_with_bolshevism:0 "Kemalizm'i Bolşevizm ile Uzlaştırmak"
 TUR_reconciling_kemalism_with_bolshevism_desc:0 "[SOV.GetLeader], ideolojimizi tanımlayan önemli ideolojik figürlerden biri olarak eklenmelidir. Böyle bir ideolojik değişimi temiz bir şekilde nasıl başarabileceğimiz bir muamma, ama kim bize hesap soracak ki?"
 TUR_reconfigure_our_foreign_policy:0 "Türk Dış Politikasını Yeniden Yapılandır"
 TUR_reconfigure_our_foreign_policy_desc:0 "[TUR.GetAdjective] dış politikası iç işlerine odaklanmış ve dış politika etkileşimlerini çoğunlukla komşularımızla sınırlı tutmuştur, ancak zaman değişti ve dış politikamız bunu yansıtmalıdır. Dünyanın büyük güçleriyle daha fazla ilgilenmeye başlamamızın zamanı geldi de geçiyor."
 TUR_recover_the_kardzhali_vilayet:0 "Kırcaali Vilayetini Geri Al"
 TUR_recover_the_kardzhali_vilayet_desc:0 "Aşağılık [BUL.GetAdjective]ler çok uzun zamandır başımıza bela oldular. İstedikleri kadar inkar edebilirler, ama onların gaddar güdük devletinde kapana kısılmış ve ezilmiş Türk halkı kurtuluş için haykırıyor. Onları daha fazla bekletmeye niyetimiz yok."
 TUR_refining_our_strategies:0 "Stratejilerimizi Geliştirmek"
 TUR_refining_our_strategies_desc:0 "Büyük Savaş sırasındaki çöküşümüzden bu yana savaş hakkında çok şey öğrendik ve artık kazanma umudumuz olmayan çılgın planlara girişmemeliyiz. Akıllıca ve muhafazakar bir şekilde savaşmalıyız, böylece tüm savaş durduğunda ve toz duman dağıldığında ayakta kalan galipler biz oluruz."
 TUR_rehabilitate_the_kadro_movement:0 "Kadro Hareketini Rehabilite Et"
 TUR_rehabilitate_the_kadro_movement_desc:0 "Kadro'yu kapatmak ve teorisyenlerini dağıtmak bir hataydı. Devlete taze ve devrimci fikirlerle yaklaştılar ve biz onlara sırtımızı döndük. Yeni bir tür ulus yeni fikirler gerektirir ve Kadro'nun dışında daha cesur fikirler bulunmaz!"
 TUR_reinstate_the_darulfununu_sahane:0 "Darülfünûn-u Şahâne'yi Yeniden Kur"
 TUR_reinstate_the_darulfununu_sahane_desc:0 "Kurumlarımızın birçoğunun... tam olarak modern olmadığını söylemekten çekinmiyoruz. Yine de, modern savaş çağında yaşıyoruz. Ulusumuzun bu kadar sanayileşmiş ve modern olması iyi bir şey - hepsi Osmanlı Bürokrasisinin sıkı çalışması sayesinde! Bu amaçla, İstanbul Üniversitesi'nde kendimiz ve benzer düşünen uluslar arasında teknik ve bilimsel iş birliğini teşvik eden bir okul kuracağız."
 TUR_reinvigorate_turkish_nationalism:0 "Türk Milliyetçiliğini Canlandır"
 TUR_reinvigorate_turkish_nationalism_desc:0 "Ülkeyi birleştirmenin tek yolu Mussolini'nin yönetimini taklit etmektir. Sol eğilimli ekonomik reformlara karşı olmayan ve halkın kalbine hitap edebilen güçlü bir sağcı lidere ihtiyacımız var. Bu iş için tek bir adam var: saygıdeğer Mareşal Fevzi Çakmak."
 TUR_relocate_from_yildiz_palace:0 "Yıldız Sarayı'ndan Taşın"
 TUR_relocate_from_yildiz_palace_desc:0 "Denizcilik çabalarımızı çok uzun süredir Çanakkale ve Boğazlar etrafında merkezledik. Mersin Limanı'nı genişletme planlarımızı nihayet hayata geçirme zamanı geldi."
 TUR_renew_the_turkish_soviet_non_aggression_pact:0 "Sovyet Saldırmazlık Paktı'nı Yenile"
 TUR_renew_the_turkish_soviet_non_aggression_pact_desc:0 "1925'te [SOV.GetNameDef] ile bir saldırmazlık paktı imzaladık ve dünyada [SOV.GetAdjective]lerle dostane ilişkilere giren ilk ülkelerden biriydik, ancak zaman değişti. Bu paktı yenilemek ve mevcut rejimle bağların sağlıklı olmasını sağlamak önemlidir."
 TUR_restack_the_officer_corps:0 "Subay Kadrosunu Yeniden Düzenle"
 TUR_restack_the_officer_corps_desc:0 "Subay kadrosu Türkiye'nin temel değerlerini koruyor, ama o temel değerler... değişti. Eğer subaylar Kemalist ideolojinin mevcut değerlerini yansıtmakta isteksizlerse, o zaman onları bu değerleri somutlaştırmaya zorlayacağız."
 TUR_restack_the_officer_corps_tt:0 "§YKemalist Subaylar§!, hükümetin isteklerine daha uygun olacak şekilde yeniden organize edilecektir. \n§REğer ülke %50 istikrarın altındaysa ve Kemalist Subaylar büyük ölçüde güçlendirilmişse, hükümete karşı isyan etmeleri beklenebilir!§!"
 TUR_restore_the_divan:0 "Divan'ı Geri Getir"
 TUR_restore_the_divan_desc:0 "Düşmanlarımız tarafından seçilmiş sivil piyonlardan oluşan bir meclis mi? Hayır, bunun çok uzun sürmesini asla amaçlamadık. Eski usulleri geri getirme zamanı geldi: Divan'ı geri getireceğiz, böylece din devletin tam merkezinde oturacak. Ayrıca batılılardan ödünç alınmış Başbakanlık makamını da ortadan kaldıracağız, bir Sadrazam'ı geri getirmenin zamanı geldi de geçiyor!"
 TUR_restoring_our_nations_pride:0 "Ulusumuzun Gururunu Geri Getirmek"
 TUR_restoring_our_nations_pride_desc:0 "Son birkaç yıldaki başarılarımız kesinlikle şaşırtıcı. Büyük Savaş'taki muazzam kayıplarımızın ardından savaştan korkmaktan, tüm dünyada savaşlar veren kıtasal fatihlere dönüştük. Bir altın çağın eşiğindeyiz: Kurtun Altın Çağı!"
 TUR_return_of_the_sultan:0 "Sultan'ın Dönüşü"
 TUR_return_of_the_sultan_desc:0 "Nihayet o kadar uzun zamandır hayalini kurduğumuz şeyi gerçekleştirme zamanı geldi: Sultan'ı derhal sürgünden eve getirmeliyiz. Sadıklarımız onu zaten ellerinde tutuyor ve şimdi geriye sadece onu eve getirip görkemli bir taç giyme töreni düzenlemek kaldı."
 TUR_reuniting_thrace_through_force:0 "Trakya'yı Zorla Birleştirmek"
 TUR_reuniting_thrace_through_force_desc:0 "Trakya'da hala önemli bir [ROOT.GetAdjective] nüfusu var. Edirne'de daha büyük bir kısmını elimizde tutuyoruz, ama [GRE.GetAdjective]ler bölgeyi bölünmüş tutmakta ısrar ediyor. Şimdi bizim de aksini ısrar etmemiz gerekiyor."
 TUR_revive_turkish_revolutionism:0 "Türk İnkılapçılığını Canlandır"
 TUR_revive_turkish_revolutionism_desc:0 "Yaptığımız siyasi değişiklikler, halkın bu yaygın direnişi karşısında açıkça duvara tosladı. Şimdi çözüm ne? Halkın gazını mı alacağız, yoksa bu radikal reformlara tam gaz devam mı edeceğiz? Kemalizm dediğin daha önce de temelinden değişti: bu ideolojinin yeni ayarının ileride bizi nereye götüreceğini kim bilebilir ki?"
 TUR_saadabad_pact_faction_tt:0 "§YSadabat Paktı§!'nın tüm imzacılarını resmi bir ittifaka davet edeceğiz."
 TUR_salt_the_scars_of_the_great_war:0 "Büyük Savaş'ın Yaralarına Tuz Bas"
 TUR_salt_the_scars_of_the_great_war_desc:0 "Türk halkı, Kurtuluş Savaşı'ndan bu yana geçen yıllarda yumuşadı. Gücümüzü dünyaya yansıtmak için çok ihtiyaç duyduğumuz öfke nerede? Büyük Savaş'ta çok şey kaybettik, çoğundan daha fazla ve hayatta kalmamızın tek nedeni, o hayatta kalma hakkı için dişimizle tırnağımızla savaşmamızdı. Bir sonraki savaşta da dişimizle tırnağımızla savaşacağız."
 TUR_sanayiciler_etatism_tt:0 "\nDevletçi ekonomik modelimiz nedeniyle §YSanayiciler Endüstriyel Projeleri§! kararları daha pahalı olacak."
 TUR_sanayiciler_liberals_tt:0 "\nLiberal ekonomik modelimiz sayesinde §YSanayiciler Endüstriyel Projeleri§! kararları daha ucuz olacak."
 TUR_sanayiciler_tt:0 "Elimizdeki §YSiyasi Gücü§! ve diğer araçları kullanarak, gelişmekte olan sanayici sınıfımızı, devletin kullanımı için §YSivil Fabrikalar§! ve §YAskeri Fabrikalar§! kurmak üzere kaynaklarını yatırmaya teşvik edebileceğiz.\n"
 TUR_scrapping_our_debts:0 "Borçlarımızı Hurdaya Çıkarmak"
 TUR_scrapping_our_debts_desc:0 "Ulusumuzu neredeyse sıfırdan inşa etmek maliyetli bir işti ve ulusal ilerleme tırmanışımızda bize yardım eden bizden daha zengin ulusların hayırseverliğine minnettar olacağız. Ancak, bizi para kesesiyle kontrol etmeyi düşünenlerden o kadar uzaklaştık ki, tüm borçlarımızı kesip atmaktan başka seçeneğimiz yok."
 TUR_secure_the_iraqi_oil:0 "Irak Petrolünü Güvence Altına Al"
 TUR_secure_the_iraqi_oil_desc:0 "Neden kendi başınıza mükemmel bir şekilde yapabileceğinizi bildiğiniz bir işi başkalarına güvenesiniz ki? Ay sonundan önce postallarımız Bağdat topraklarına basacak: garantili."
 TUR_securing_iran:0 "İran'ı Güvence Altına Almak"
 TUR_securing_iran_desc:0 "Eğer [PER.GetAdjective]ler, petrol ticaretini düşmanlarımızın rezervlerine ulaşmayacak şekilde düzenlemezlerse, o zaman kaynaklarını onlar için zorla yöneteceğiz."
 TUR_seize_religious_property:0 "Dini Mülklere El Koy"
 TUR_seize_religious_property_desc:0 "Din, bu cumhuriyetin kuruluşundan beri başının belası olmuştur. Bu ülkedeki her dini binayı millileştirecek ve kapatacağız ve araziyi daha iyi bir amaç için kullanacağız. Kendimizi dinin zincirlerinden kurtararak, nihayet tam potansiyelimize ulaşacağız."
 TUR_seizing_the_romanian_oil_fields:0 "Romanya Petrol Sahalarını Ele Geçirmek"
 TUR_seizing_the_romanian_oil_fields_desc:0 "Romanya petrol sahaları, [GER.GetFactionName] savaş çabası için hayati bir bölgedir. Onların [ROM.GetNameDef]'in petrolüne olan tedarikini kesmek, bir kalbe kan akışını durdurmak gibi olur."
 TUR_soviet_tank_factories:0 "Sovyet Tank Fabrikaları"
 TUR_soviet_tank_factories_desc:0 "Dış politikamızda daha açık bir şekilde anti-faşist bir duruş sergileyerek, [SOV.GetAdjective]lerin yardımıyla [ROOT.GetNameDef]'de zırhlı üretimini teşvik etmek için tasarlanmış bir planın başarısını sağlayabiliriz."
 TUR_stop_the_stalinist_charade:0 "Stalinist Maskaralığına Son Ver"
 TUR_stop_the_stalinist_charade_desc:0 "Gerçek devrim, geldiği yere geri getirilmeli. Bir yerlerde, [SOV.GetNameDef] amacını ve ruhunu kaybetti. Kaybettikleri idealizmi yeniden kazanmalarına yardımcı olmalıyız."
 TUR_strengthening_our_navies:0 "Donanmalarımızı Güçlendirmek"
 TUR_strengthening_our_navies_desc:0 "Akdeniz'de kendimizi korumak için güçlü ve yetenekli donanmalara ihtiyacımız var. Birleşik bir çabayla, sınırlarımızı yaklaşan tehditlerden korumak için gereken asgari düzeye ulaşacağız."
 TUR_strike_at_the_fascist_menace:0 "Faşist Tehdidine Darbe Vur"
 TUR_strike_at_the_fascist_menace_desc:0 "Faşizm, arka bahçemizde başıboş bırakılamayacak kadar tehlikeli bir ideolojidir. Kendi halkımızın faşist virüsünü kapması ne kadar sürer? Faşistleri ezmeli ve bunu yaparken hareketlerinin tüm meşruiyetini ortadan kaldırmalıyız."
 TUR_strike_the_british_imperialists:0 "Britanya Emperyalistlerine Darbe Vur"
 TUR_strike_the_british_imperialists_desc:0 "[ENG.GetNameDef] olduğu gibi var olduğu sürece dünya asla gerçekten değişemez. Onları ezmeli ve aşağılık imparatorluklarını yok etmeliyiz."
 TUR_subdue_the_magyars:0 "Macarları Boyunduruk Altına Al"
 TUR_subdue_the_magyars_desc:0 "Avusturya boyunduruğu altında yüzyıllar geçirdikten sonra köklerinden çok uzaklaştıklarını düşünebilirler, ama biz Macar'ı gerçekte olduğu gibi görüyoruz. O, inkar eden bir Türk'tür; kendini şahin olarak gören bir kurttur. Macarlara miraslarını hatırlatacağız."
 TUR_superiority_of_arms:0 "Silah Üstünlüğü"
 TUR_superiority_of_arms_desc:0 "Mermiler ve mermiler çok daha harcanabilirken neden bir soruna adam atasınız ki? Askerlerimizin hayatlarını ezici ateş gücü kullanımıyla kurtarmak için daha büyük bir çaba göstermeliyiz."
 TUR_support_the_golden_square:0 "Altın Meydan'ı Destekle"
 TUR_support_the_golden_square_desc:0 "[IRQ.GetNameDef]'de bizimkine çok benzer hedefleri paylaşan oldukça etkili bir grup var. Bölgedeki emperyalist varlığı ortadan kaldırmamıza yardımcı olabilmeleri için bu benzer düşünen bireyleri desteklemeliyiz."
 TUR_supporting_the_east:0 "Doğuyu Desteklemek"
 TUR_supporting_the_east_desc:0 "Desteğimizin belkemiğini oluşturan doğudaki eyaletlerimizdir, ancak bu eyaletlerdeki altyapı kalitesi batıdaki şehirli illere kıyasla dehşet vericidir. Doğuyu destekleyerek, takipçilerimizi destekliyoruz ve ayrıca doğuya ve kuzeye yönelik operasyonlar üstlenmek için kendimizi daha iyi hazırlıyoruz."
 TUR_taking_over_defense_of_the_gulf:0 "Körfez Savunmasını Devralmak"
 TUR_taking_over_defense_of_the_gulf_desc:0 "[ENG.GetAdjective] müttefiklerimizin üzerindeki baskıyı biraz hafifletmek için Orta Doğu mülklerini onlar için korumayı teklif edebiliriz. Özellikle savaş çabasına yaptığımız tüm katkılar göz önüne alındığında ve aslında toprakları ele geçirmemizi engelleyecek bir konumda olmayacakları gerçeği göz önüne alındığında, öneriye muhtemelen sıcak bakacaklardır."
 TUR_taking_responsibility_for_the_air_war:0 "Hava Savaşının Sorumluluğunu Üstlenmek"
 TUR_taking_responsibility_for_the_air_war_desc:0 "[SOV.GetAdjective]lerin kara ve denizlere hükmetmekle yeterince işi var, hava savaşının bir kısmının sorumluluğunu üstlenerek onlara yardım eli uzatmalıyız."
 TUR_the_anglo_turkish_agreement:0 "İngiliz-Türk Anlaşması"
 TUR_the_anglo_turkish_agreement_desc:0 "[ENG.GetAdjective] hükümeti bizimle bir anlaşma imzalamak için endişeliydi: etkili bir şekilde, bizden hiçbir şey vaat etmemizi gerektirmeyen ancak bir işgal durumunda [ENG.GetNameDef] ulusunu yardımımıza koşmaya mecbur kılacak bir anlaşma. Bütün olay çaresizlik kokuyor, ama biz çaresizliği kullanabiliriz."
 TUR_the_balkan_academy_of_science:0 "Balkan Bilim Akademisi"
 TUR_the_balkan_academy_of_science_desc:0 "Bir bilim ve yenilik çağında yaşıyoruz ve kendimizin veya Balkan Antantı'nın herhangi bir üyesinin daha büyük, daha sanayileşmiş ulusların teknik başarılarının çok gerisinde kalmasına izin veremeyiz."
 TUR_the_batumi_accord:0 "Batum Anlaşması"
 TUR_the_batumi_accord_desc:0 "Her iki ulusumuzun da sanayilerini geliştirmek için Gürcü bölgesel hükümetiyle birlikte çalışmalıyız. Böyle bir anlaşma her iki taraf için de verimli olurdu ve doğası gereği açıkça siyasi olan nedenler dışında reddedilemezdi."
 TUR_the_chester_concession:0 "Chester İmtiyazı"
 TUR_the_chester_concession_desc:0 "Amerikalıların on yıldan fazla bir süre önce bize vaat ettiği imtiyazlara hala hakkımız var. Savaşa katılımımızı, Amerikalıların [TUR.GetAdjective] devletinin refahına katkılarına bağlı kılabiliriz."
 TUR_the_clodius_agreement:0 "Clodius Anlaşması"
 TUR_the_clodius_agreement_desc:0 "[GER.GetAdjective]ler bize uygun bir anlaşmayla yaklaştılar: kendi askeri teçhizatımızdan daha fazlasını üretme araçları karşılığında krom cevheri. [GER.GetNameDef]'in birincil krom cevheri kaynağı haline gelerek, aynı zamanda [GER.GetNameDef]'in korumasına da hak kazanıyoruz, ki bu günlerde oldukça imrenilecek bir konum."
 TUR_the_damascus_diktat:0 "Şam Diktası"
 TUR_the_damascus_diktat_desc:0 "[677.Controller.GetNameDefCap] zayıf. Tek yapmamız gereken, Suriye'yi teslim etmezlerse savaş olasılığını tehdit etmek ve onlar barış için ağlayarak ve Suriye'yi ellerinden almamız için yalvararak dizlerinin üzerine çökecekler."
 TUR_the_german_turkish_friendship_treaty:0 "Alman-Türk Dostluk Antlaşması"
 TUR_the_german_turkish_friendship_treaty_desc:0 "[GER.GetNameDefCap] ve [ROOT.GetNameDef] doğal dostlardır. Her konuda aynı fikirde olmak zorunda değiliz, çünkü yakın tarihlerimiz pek de farklı değil. [ENG.GetAdjective]'in dış politikamızı kontrol etme çabaları boşa çıkacak: [GER.GetLeader] ile [ROOT.GetLeader] arasında tek taraflı olarak imzalanan yeni bir Dostluk Antlaşması ile bunu kanıtlayacağız."
 TUR_the_guardians_of_kemalism:0 "Kemalizm'in Muhafızları"
 TUR_the_guardians_of_kemalism_desc:0 "Kemalist subay kadrosu, Kemalist ideallerin ulus çapında yayılması söz konusu olduğunda ancak bu kadarını yapabilir. Hükümetin, Kemalizm'in Türk nüfusunun kalbini ve zihnini kazanmasına yardımcı olmak için daha proaktif bir yaklaşım benimseme zamanı geldi."
 TUR_the_hatay_issue:0 "Hatay Sorunu"
 TUR_the_hatay_issue_desc:0 "Artık eli kolu bağlı oturup Arap irredentistleri (yayılmacıları) ve Fransız emperyalistleri tarafından Türk azınlıkların ezilmesine izin veremeyiz. Hatay'ın her zerresiyle Türkiye'nin haklı bir parçası olmadığı düşüncesi saçmalıktır ve revizyonizm olarak derhal reddedilmelidir. 1921'in hatalarını düzeltme zamanı gelmiştir."
 TUR_the_international_of_proletarian_freethinkers:0 "Proleter Özgür Düşünürler Enternasyonali"
 TUR_the_international_of_proletarian_freethinkers_desc:0 "Özgür düşünürler işçi sınıfından gelir ve yakında işçi sınıfının en iyileri ve en parlakları daha büyük iyiliğe katkıda bulunmak için buraya akın edecekler."
 TUR_the_italo_turkish_naval_academy:0 "İtalyan-Türk Deniz Harp Okulu"
 TUR_the_italo_turkish_naval_academy_desc:0 "[ITA.GetAdjective]ler denizlerin tartışmasız efendisidir. Eğer bize öğretmeye razı olurlarsa onlardan öğrenebileceğimiz çok şey var."
 TUR_the_kirikkale_tank:0 "Kırıkkale Tankı"
 TUR_the_kirikkale_tank_desc:0 "Yabancı zırhlı araç tasarımlarına çok fazla bağımlı hale geldik. Kendi [ROOT.GetAdjective] tankımızı tasarlayacağız - Kırıkkale Tankı!"
 TUR_the_legacy_of_osmanli_donanmasi:0 "Osmanlı Donanması'nın Mirası"
 TUR_the_legacy_of_osmanli_donanmasi_desc:0 "Osmanlı Donanması gerçekten etkileyiciydi ve eğer yıkılan imparatorluktan yas tutulmaya değer en az bir şey varsa, o da kullandığı şanlı donanma olurdu. Bu mirası bugün daha modern bir donanmayla onurlandırabiliriz."
 TUR_the_mediterranean_entente:0 "Akdeniz Antantı"
 TUR_the_mediterranean_entente_desc:0 "Bölgenin güvenliğinden sorumlu olacak kapsamlı bir pan-Akdeniz ittifakı müzakere etmeliyiz. Akdeniz'i kontrol etmeyi amaçlayan ve [ITA.GetNameDef]'e uzatılmış açık bir elle başlamayan herhangi bir proje başarısızlığa mahkumdur."
 TUR_the_montreux_convention:0 "Montrö Boğazlar Sözleşmesi"
 TUR_the_montreux_convention_desc:0 "Büyük Savaş'tan bu yana olan onca şeye rağmen hala kendi boğazlarımızı yönetme hakkından mahrum bırakılmamız çok çirkin. Boğazları ordumuzla tek taraflı olarak ele geçirmek yerine, bu krizden Avrupa'nın yeni parya devleti olmadan çıkabilmek için daha ustaca bir diplomatik manevra deneyelim."
 TUR_the_montreux_convention_tt:0 "§YÇanakkale Boğazı§!'nı ve §Yİstanbul Boğazı§!'nı yeniden askerileştirme niyetimizi duyuran bir §YSözleşme§! çağrısı yapacağız. §YSovyetler Birliği§!'nden gelebilecek potansiyel tepkilere hazırlıklı olmalıyız."
 TUR_the_pan_national_association_of_ulemas:0 "Uluslararası Ulema Birliği"
 TUR_the_pan_national_association_of_ulemas_desc:0 "Bizimki ulusal bir hareket değil: sadece Sultan'ın otoritesini değil, aynı zamanda dünya çapındaki Müslümanların otoritesini de savunuyoruz. Milliyetçiliğe uymuyoruz, çünkü İslam'ın uluslararası davasına inanıyoruz! Dini cemaatimizi kılıçla en iyi nasıl yayıp özgürleştirebileceğimizi belirlemek için dünyanın dört bir yanından dini liderlerle iş birliği yapacağız."
 TUR_the_path_of_the_wolf:0 "Kurdun Yolu"
 TUR_the_path_of_the_wolf_desc:0 "Kurt gibi, her zaman av peşinde olmalıyız. Alçakta kalacağız ve düşmanımız en az beklediği anda saldıracağız. Kurt zihniyetine sahibiz ve denizaltı bu zihniyeti uygulamak için mükemmel bir araçtır."
 TUR_the_petra_proposal:0 "Petra Teklifi"
 TUR_the_petra_proposal_desc:0 "Danışmanlarımız, Levant'taki [ENG.GetAdjective] himayelerini koruma ve yönetme sorumluluğunu üstlenmemizi sağlayacak bir planla geldiler. Strateji ve teklif sağlam ve şimdi geriye sadece onu [ENG.GetAdjective]lere sunmak kaldı."
 TUR_the_pontic_redoubt:0 "Pontus Tabyası"
 TUR_the_pontic_redoubt_desc:0 "Batı savunmalarımıza çok uzun süre odaklanırken, açıkça yayılmacı olan [SOV.GetNameDef] ile olan sınırımızı görmezden geldik! Onları sınırımızda tek başımıza uzun süre tutmayı umamayız, ancak nehir hatlarımız boyunca bir tabya güçlendirerek, bir yıpratma savaşında onları yenmeyi umabiliriz. Başka ne umudumuz var ki?"
 TUR_the_red_apples_of_sevres:0 "Sevr'in Kızıl Elmaları"
 TUR_the_red_apples_of_sevres_desc:0 "Paris, Roma, Londra: bunlar restore edilmiş Osmanlı İmparatorluğu'nun kızıl elmalarıdır. Bizi parçalanmış, aşağılanmış ve yok olmuş görmek isteyen eski düşmanlarımızın, ülkemiz üzerindeki sinsi tasarımları için alçaltıldığından, eğildiğinden ve sonra kırıldığından emin olana kadar hiçbir şeyden vazgeçmeyeceğiz. Eski dünya düzenini ateşe vereceğiz ve onların yıkılmış imparatorluklarının leşleri üzerine yeni bir statüko inşa edeceğiz."
 TUR_the_sanayiciler:0 "Sanayiciler"
 TUR_the_sanayiciler_desc:0 "Atatürk, devletimizin modernleşmesine yardımcı olmak için bir girişimci ve sanayici sınıfı yetiştirmek üzere yıllarca yorulmadan çalıştı. Yetiştirme zamanı bitti, hasat zamanı başladı - Türkiye'yi rekabetçi bir bölgesel güç yapmak için birlikte çalışacağız."
 TUR_the_second_five_year_plan:0 "İkinci Beş Yıllık Plan"
 TUR_the_second_five_year_plan_desc:0 "İlk Beş Yıllık Plan büyük bir başarıydı, bu yüzden ülkedeki en iyi hükümet bakanları bir araya geldi ve ilk Beş Yıllık Plan bu kadar başarılıysa, neden bir tane daha olmasın diye karar verdiler?"
 TUR_the_sun_language_theory:0 "Güneş Dil Teorisi"
 TUR_the_sun_language_theory_desc:0 "Güneş Dil Teorisi, tüm insan dillerinin aynı Türk kök dilinden geldiği teorisidir. Teori açıkça tamamen mantıklıdır ve teoriyi resmi olarak devlet destekli hale getirmemiz ve tüm ülkede öğretmeye başlamamız zorunludur."
 TUR_the_treaty_for_prosperity_and_trade:0 "Refah ve Ticaret Antlaşması"
 TUR_the_treaty_for_prosperity_and_trade_desc:0 "Serbest piyasa liberalizmi ilkeleri doğrultusunda serbest ticareti teşvik eden kolektif bir antlaşmaya öncülük edeceğiz. Tüm üye arkadaşlarımızın ekonomilerini serbest ticarete izin verecek şekilde tamamen yeniden yapılandırmasını bekleyemeyiz, ancak en azından Balkanlar'da korumacılığa bir son verebiliriz."
 TUR_the_turkish_tank_project:0 "Türk Tank Projesi"
 TUR_the_turkish_tank_project_desc:0 "Tank geleceğin silahıdır ve komünizm geleceğin inancıdır. İkisi çiğ köfte ile rakı gibi birbirine yakışır!"
 TUR_the_tuz_golu_training_facility:0 "Tuz Gölü Eğitim Tesisi"
 TUR_the_tuz_golu_training_facility_desc:0 "Ulusumuzun Akdeniz iklimi, askerlerimizi kurak iklimlerde yeterince faaliyet gösterebilecek şekilde eğitmek için uygun bir ortam değildir. Askerlerimizin kurak ortamlarda savaşmaya daha iyi hazırlanabilmesi için Tuz Gölü tuz gölüne yakın bir eğitim tesisi kurmayı seçtik."
 TUR_third_expedition_to_aceh:0 "Açe'ye Üçüncü Osmanlı Seferi"
 TUR_third_expedition_to_aceh_desc:0 "İmparatorluğun artık yoluna girmesiyle birlikte, bir zamanlar kontrolümüz altında olan denizaşırı himayeler ve hakimiyetler üzerindeki kontrolümüzü yeniden sağlamanın zamanı geldi. Bunu yapmak için donanmamızın eşit durumda olmasını sağlamalıyız ve ilk hedefimiz Aceh üzerindeki himayeyi yeniden tesis etmek olacaktır."
 TUR_three_year_industrial_plan:0 "Üç Yıllık Sanayi Planı"
 TUR_three_year_industrial_plan_desc:0 "[ENG.GetNameDef] ulusunu bile ürkütebilecek yarımada çapında bir sanayileşme çabasına girmeye hazırız. Birbirimizi eşit olarak destekleyeceğiz ve birlikte, Balkan Antantı'nın kolektif gücüyle düşmanlarımızın gücünün üzerine çıkacağız!"
 TUR_treaty_of_saadabad:0 "Sadabat Paktı"
 TUR_treaty_of_saadabad_desc:0 "Doğudaki komşularımızla dost kalmaktan kaybedecek hiçbir şeyimiz ve kazanacak her şeyimiz var. Dostluğumuzu resmileştiren bir antlaşma fikri zaman zaman ortaya atıldı ve Türkiye'nin inisiyatif alıp bu dostluğun bir antlaşmayla kodlanmasını sağlamasının zamanı geldi de geçiyor."
 TUR_truce_with_government_called_flag:0 "Hükümetle bir ateşkes ilan edildi."
 TUR_turanist_ambition:0 "Turanist Hırs"
 TUR_turanist_ambition_desc:0 "Kendimize kudretli bir imparatorluk kurma iradesine sahibiz, ama dünyanın hala ayakta olan Büyük Güçlerinin gazabını kışkırtma riskini alıyoruz. Bizi engellemeye çalışacaklar, ama Avrasya kontrolümüz altına girdiğinde bizi durdurmak için hiçbir şey yapamayacaklar."
 TUR_turk_silahli_kuvvetleri:0 "Türk Silahlı Kuvvetleri"
 TUR_turk_silahli_kuvvetleri_desc:0 "Silahlı kuvvetlerimiz gerçekten modern hale geldi ve artık korkunç Kurtuluş Savaşı'ndan sonraki gölgeleri değiller. Mevcut durumumuzda dünyayı fethedebiliriz. Ne kadar ilerlediğimizle gurur duymalıyız."
 TUR_turk_ulusu:0 "Türk Ulusu"
 TUR_turk_ulusu_desc:0 "Sorumlu ve modern bir ülke olmanın bir parçası, söz konusu ülkenin vatandaşı olmanın ne anlama geldiğini yeniden tanımlayabilmektir. Türk olmanın ne anlama geldiği konusunda çok katıydık ve ülkemizin yapısını düzgün bir şekilde temsil etmek için, bir vatandaşı Türk yapan tanımı genişletmenin zamanı geldi de geçiyor."
 TUR_turkish_air_defense_platforms:0 "Türk Hava Savunma Platformları"
 TUR_turkish_air_defense_platforms_desc:0 "Denizlerden veya komşularımızın topraklarından bir hava saldırısı durumunda hava sahamızı savunmak için çalışmalıyız."
 TUR_turkish_panzers:0 "Türk Panzerleri"
 TUR_turkish_panzers_desc:0 "Neden sadece [GER.GetNameDef]'in hayranlık uyandıran tankları olsun ki? [GER.GetAdjective] panzerleriyle birlikte dünyayı fethedecek kendi zırhlı serimizi sipariş edeceğiz!"
 TUR_turkish_state_railways:0 "Türk Devlet Demiryolları"
 TUR_turkish_state_railways_desc:0 "Devlet müdahale etmezse, ülkemiz kalıcı olarak batıdaki zengin ve şehirleşmiş kentler ile doğudaki merkezi olmayan aşiretlerden oluşan, birbirinden kopuk bir ulus olarak kalacaktır. Ulusumuzu altyapı ile birbirine bağlayarak, sadece Ege kıyısındaki zengin şehirlerimizi değil, bütün bir Türkiye'yi yirminci yüzyıla taşıyoruz."
 TUR_unite_the_azeri_diaspora:0 "Azeri Diasporasını Birleştir"
 TUR_unite_the_azeri_diaspora_desc:0 "Dünyadaki tüm Türk halklarını tek bir ulus altında birleştirmek bizim kutsal görevimizdir ve yurtdışındaki Azeri kardeşlerimizi kurtarana kadar görevimiz henüz bitmemiştir."
 TUR_united_against_imperialism:0 "Emperyalizme Karşı Birleşik Cephe"
 TUR_united_against_imperialism_desc:0 "Hepimiz bizden daha büyük güçlerin entrikalarının kurbanı olduk. Çok sık, bizi aşağılayan ve zayıflatan antlaşmalara ve anlaşmalara zorlandık. Diyoruz ki, dünya eskisi gibi değil ve bir daha asla emperyalist tacize boyun eğmeyeceğiz!"
 TUR_united_against_imperialism_tt:0 "§YBalkan Paktı§! ülkeleri için Demokrasi veya Tarafsızlık popülerliğinde değişiklik: §G%10§!.\n"
 TUR_unlock_camelry_effect_tt:0 "Teknoloji ekler: §YDeveli Birimleri§!."
 TUR_unlock_reconciliation_occupation_law_tt:0 "İşgal yasasının kilidini açar: §YUzlaşma§!."
 TUR_utilising_our_terrain:0 "Arazimizi Kullanmak"
 TUR_utilising_our_terrain_desc:0 "Anadolu bir savunmacının rüyası ve bir işgalcinin en kötü kabusudur. Ülkemizi tanıyoruz ve herhangi bir işgali zorlu bir savaşa dönüştürmek için ulusumuzun doğal savunmalarını kullanmak üzere eğitmeliyiz."
 TUR_utilize_foreign_capital:0 "Yabancı Sermayeyi Kullan"
 TUR_utilize_foreign_capital_desc:0 "Ulusumuz genç ve toprağımızın çoğu sanayiden yoksun, ama bu konuda yalnız çalışmak zorunda değiliz. Güçlü bir Türkiye, birçok Avrupa gücünün çıkarınadır ve onlara yardım için gidersek, kesinlikle vereceklerdir."
 TUR_variant_turkish_tax_focus:0 "[Root.GetTurkishVariantTaxName]"
 TUR_variant_turkish_tax_focus_desc:0 "[Root.GetTurkishVariantTaxDesc]"
 TUR_victory_or_death_against_communism:0 "[GetVictoryOrDeathAgainstCommunismName]"
 TUR_victory_or_death_against_communism_communism:0 "Komünizme Karşı Zafer ya da Ölüm"
 TUR_victory_or_death_against_communism_communism_desc:0 "Komünizme karşı küresel mücadele haklı bir mücadeledir. Mücadele basit ideolojinin ötesine geçiyor: dokunduğu her şeyi yok eden korkunç bir tek parça yapıya karşı yaşam tarzımız için savaşıyoruz. Kaybetmeyi göze alamayız."
 TUR_victory_or_death_against_communism_desc:0 "[GetVictoryOrDeathAgainstCommunismDesc]"
 TUR_victory_or_death_against_communism_generic:0 "Rus Emperyalizmine Karşı Zafer"
 TUR_victory_or_death_against_communism_generic_desc:0 "[SOG.GetAdjective] emperyalizmine karşı küresel mücadele haklı bir mücadeledir. Mücadele sınır anlaşmazlıklarının ötesine geçiyor: dokunduğu her şeyi yok eden korkunç bir yayılmacı imparatorluğa karşı yaşam tarzımız için savaşıyoruz. Kaybetmeyi göze alamayız."
 TUR_we_must_not_fall:0 "Düşmemeliyiz!"
 TUR_we_must_not_fall_desc:0 "Kurtuluş Savaşımız sırasında bir ulus olarak dişimizle tırnağımızla savaşmadık ki birkaç on yıl sonra yok olalım. Hayır, [TUR.GetNameDef]'in hikayesi burada bitmiyor - düşmemeliyiz, düşmeyeceğiz!"
 byz_restore_byzantine_empire_category_tt:0 "§YBizans İmparatorluğu'nu Restore Et§! kararlarının kilidini açar."
 greek_turkish_friendship:0 "Yunan-Türk Dostluk Paktı imzalandı"
 no_fascist_metaxism_spirit_tt:0 "Eğer §YSpotalı Savaşçı Ruhunu Canlandırmak§! odağı alınmadıysa, §YMetaksizm§! ulusal ruhu faşistleştirilmeyecek ve bunun yerine §Rkaldırılacaktır§!."
 schachtplan_required_tt:0 "§YSchachtplan§!'ın herhangi bir varyasyonuna sahip değil!"
