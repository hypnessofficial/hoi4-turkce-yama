 CHI_sea_expand_public_education:0 "Halk Eğitimini Genişlet"
 CHI_sea_expand_public_education_desc:0 "Eğitime erişimi olan bir nüfus olmadan diğer ulusların gerisinde kalırız. Ulusumuzun refahını sağlamak için bu nedenle halk eğitimine yatırım yapmalıyız."
