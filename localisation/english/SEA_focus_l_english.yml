 PRC_sea_government_of_national_defense:0 "$PRC_government_of_national_defense$"
 PRC_sea_government_of_national_defense_desc:0 "$PRC_government_of_national_defense_desc$"
 PRC_sea_industrialisation_of_nature:0 "Doğanın Sanayileşmesi"
 PRC_sea_industrialisation_of_nature_desc:0 "Sosyalizm koşullarını sağlamak için önce endüstriyel bir işçi sınıfına sahip olmalıyız. Sovyet yardımıyla bu koşulları daha hızlı bir şekilde sağlayabileceğiz."
 PRC_sea_infiltration:0 "$PRC_infiltration$"
 PRC_sea_infiltration_desc:0 "$PRC_infiltration_desc$"
 PRC_sea_inward_focus:0 "İç Bölgelere Odaklan"
 PRC_sea_inward_focus_desc:0 "İlerlemenin yolu Sovyet çizgisine uymaktan geçmiyor. Bağımsızlığımızı onlardan kanıtlamalı ve devrimimizin başarısını sağlamak için kendi yolumuzu çizmeliyiz."
 PRC_sea_land_redistribution:0 "$PRC_land_redistribution$"
