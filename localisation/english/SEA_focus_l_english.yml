 PRC_sea_focus_on_china_desc:0 "$PRC_focus_on_china_desc$"
 PRC_sea_forging_our_own_path:0 "Kendi Yolumuzu Çizmek"
 PRC_sea_forging_our_own_path_desc:0 "Komintern'in Çinli devrimcileri başarısızlığa uğrattığı ve kendi birliğimizi kurmamız gerektiği giderek daha belirgin hale geliyor. Bununla birlikte, zamanı geldiğinde otoritemizi Çin'in ötesinde de ortaya koyabileceğiz."
 PRC_sea_form_the_academy_of_sciences:0 "$PRC_form_the_academy_of_sciences$"
