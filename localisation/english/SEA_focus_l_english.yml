 MAN_tsr_national_cooperation_government:0 "$MAN_national_cooperation_government$"
 MAN_tsr_national_cooperation_government_desc:0 "$MAN_national_cooperation_government_desc$"
 MAN_tsr_national_defense_state:0 "$MAN_national_defense_state$"
 MAN_tsr_national_defense_state_desc:0 "$MAN_national_defense_state_desc$"
 MAN_tsr_obedience:0 "Concordia Derneği'ni Güçlendir"
 MAN_tsr_obedience_desc:0 "Bazıları bizi Japonların sadece bir kuklası olarak adlandırıyor, ancak en başta Concordia Derneği ile yakın ve eşit ilişkimizi temelden yanlış anlıyorlar. Velinimetlerimize karşı gelmek, bir çocuğun ebeveynlerine karşı gelmesiyle aynı şey olurdu."
 MAN_tsr_offer_vassalization:0 "$MAN_offer_vassalization$"
 MAN_tsr_offer_vassalization_desc:0 "$MAN_offer_vassalization_desc$"
 MAN_tsr_pacify_the_countryside:0 "$MAN_pacify_the_countryside$"
 MAN_tsr_pacify_the_countryside_desc:0 "$MAN_pacify_the_countryside_desc$"
 MAN_tsr_pacify_the_countryside_effect_tooltip:0 "$MAN_pacify_the_countryside_effect_tooltip$"
 MAN_tsr_persuade_the_IMPRP:0 "IMPRP'yi İkna Et"
 MAN_tsr_persuade_the_IMPRP_desc:0 "İç Moğolistan Halk Devrimci Partisi şu anda [MEN.GetName] içinde büyük bir güç değil, ancak biraz ikna ve sınırın bizim tarafımızdan gelen yardımla, onları [JAP.GetNameDef]'e karşı devrimimizde bizimle sürükleyebilir ve sırasıyla onları da özgürleştirebiliriz."
 MAN_tsr_persuade_the_IMPRP_tt:0 "[MEN.Getflag] §Yİç Moğolistan Halk Devrimci Partisi§! üyeleri biz bağımsızlık ilan ettiğimizde bir iç savaş başlatacak"
 MAN_tsr_proclaim_the_peoples_republic:0 "Halk Cumhuriyeti'ni İlan Et"
 MAN_tsr_proclaim_the_peoples_republic_desc:0 "Çin'in ana başkentlerinin kontrolümüz altında olmasıyla Çin Halk Cumhuriyeti'nin kuruluşunu ilan etme zamanı geldi. Artık Küresel Güçlerin gözünde haydutlar ve diğer suçlular tarafından yönetilen çevredeki organize olmamış bir bölge değil, tam teşekküllü bir devlet olacağız!"
 MAN_tsr_proclaim_the_republic_of_china:0 "Çin Cumhuriyeti'ni İlan Et"
 MAN_tsr_proclaim_the_republic_of_china_desc:0 "Kontrolümüz altındaki tüm başkentlerle nihayet kendimizi Çin Cumhuriyeti ve Beiyang Hükümeti'nin meşru halefi olarak ilan edebiliriz. Geleceğin ne getireceği henüz görülmedi ancak şimdilik tüm Çin'e demokrasiyi getirdik ve umarız bin yıl boyunca böyle kalır."
 MAN_tsr_promote_manchu_identity:0 "Mançu Kimliğini Teşvik Et"
 MAN_tsr_promote_manchu_identity_desc:0 "Mançurya Halkı sadece başka bir Çinli ulus değildir. Toprağa olan bu bağı güçlendirmeye çalışmalı ve bizi Çin'in geri kalanından ayırmak için Mançurya milliyetçiliğini teşvik etmeliyiz. Bu şekilde bizi Asya'nın büyük uluslarına daha yakın bağlarken bağımsızlığımızı daha kolay koruyabileceğiz."
 MAN_tsr_promote_manchu_identity_tt:0 "§Y$MAN_incoporate_manchu_nationalism_decision$§! kararını açar"
 MAN_tsr_purge_the_general_affairs_council:0 "$MAN_purge_the_general_affairs_council$"
 MAN_tsr_purge_the_general_affairs_council_desc:0 "$MAN_purge_the_general_affairs_council_desc$"
 MAN_tsr_question_the_emperors_authority:0 "İmparatorun Otoritesini Sorgula"
 MAN_tsr_question_the_emperors_authority_desc:0 "Puyi, hükümete karşı olanlar arasında hala oldukça desteğe sahip olsa da, Japonlara karşı eylemsizliği nedeniyle de geniş çapta eleştiriliyor. Bu dalgayı sürmeli ve onu özgür bir Mançurya resminden tamamen çıkarmalıyız."
 MAN_tsr_raise_the_yong_ying:0 "Yong Ying'i Kur"
 MAN_tsr_raise_the_yong_ying_desc:0 "Yong Ying, kelimenin tam anlamıyla 'Cesur Kamplar', Qing İmparatorluğu sırasında bir tür bölgesel orduydu. Yerel milislerden oluşuyordu ve düzenli ordunun aksine yerel olarak finanse ediliyordu. Bu milisler genellikle eyaletlerde yerel meşru müdafaa amacına hizmet etti ve bize çok iyi hizmet etti. Bu sistemi yeniden kurmaya çalışmalı ancak onu modern bir savaşa uygun hale getirmeliyiz."
 MAN_tsr_raise_the_yong_ying_tt:0 "Savaştayken §YMilis Kurma§! kararlarını açar"
 MAN_tsr_reclaim_our_lost_possessions:0 "Kaybedilen Mülklerimizi Geri Al"
 MAN_tsr_reclaim_our_lost_possessions_desc:0 "Aigun ve Pekin Antlaşması'nda Dış Mançurya'nın kaybedilmesi ve Moğolistan'ın Sovyetler tarafından ele geçirilmesi devletimizin yan tarafında hala bir yaradır. Bu tarihi hatayı tersine çevirmeli ve Sovyet imparatorluğuna kesin olarak bir son vermeliyiz!"
 MAN_tsr_reclaim_our_lost_possessions_tt:0 "§YDış Mançurya§!, [MON.GetFlag] §Y[MON.GetAdjective]§! ve [TAN.GetFlag] §Y[TAN.GetAdjective]§! eyaletlerini entegre etme kararlarını açar."
 MAN_tsr_reclaim_the_empire:0 "$MAN_reclaim_the_empire$"
 MAN_tsr_reclaim_the_empire_desc:0 "$MAN_reclaim_the_empire_desc$"
 MAN_tsr_reestablish_the_gansu_braves:0 "Gansu Cesurlarını Yeniden Kur"
 MAN_tsr_reestablish_the_gansu_braves_desc:0 "Gansu Cesurları, Gansu'dan gelen Müslüman askerlerin birleşik bir gücüydü. Ma ailesi tarafından kontrol edilen bölge nihayet kontrolümüz altındayken, bu orduyu yeniden kurmalı ve bölgeyi kontrol etmemize yardımcı olmaları için generallerini işe almalıyız."
 MAN_tsr_reestablish_the_qing_army:0 "Qing Ordusunu Yeniden Kur"
 MAN_tsr_reestablish_the_qing_army_desc:0 "Bir ordu olmadan bir zamanlar var olan İmparatorluğu asla yeniden birleştiremeyiz. Eski ordumuzdan ilham almalı ama aynı zamanda geleneğe çok fazla saplanıp kalmamalıyız. Savaş sanatı değişiyor ve biz de takip etmeliyiz."
 MAN_tsr_reform_the_army:0 "Orduyu Reforme Et"
 MAN_tsr_reform_the_army_desc:0 "Mevcut güçlerimiz çeşitli isyancı orduları ve Mançurya ordusu kalıntılarından oluşan derme çatma bir gruptan başka bir şey değil. Gelecek savaşlarda tam bir felaketten kaçınmak istiyorsak önce onu bir zamanlar olduğu şeye dönüştürmeliyiz."
 MAN_tsr_reform_the_civil_service:0 "$MAN_reform_the_civil_service$"
 MAN_tsr_reform_the_civil_service_desc:0 "$MAN_reform_the_civil_service_desc$"
 MAN_tsr_request_control_of_the_railways:0 "$MAN_request_control_of_the_railways$"
 MAN_tsr_request_control_of_the_railways_desc:0 "$MAN_request_control_of_the_railways_desc$"
 MAN_tsr_request_dalian:0 "Dalian'ı Talep Et"
 MAN_tsr_request_dalian_desc:0 "Japonya şu anda Kwantung Kiralanmış Bölgesi'nin bir parçası olarak Liaotung Yarımadası'nın ucunda bulunan Mançurya liman şehri Dalian'ı işgal ediyor. Ancak, onlar için fark ihmal edilebilir düzeydeyken bizim için muazzam derecede faydalı olacağı için onu Hükümetimize devretmeleri konusunda ikna etmeye çalışmalıyız."
 MAN_tsr_request_our_lost_territories:0 "Kaybedilen Topraklarımızı Talep Et"
 MAN_tsr_request_our_lost_territories_desc:0 "Sovyetler Birliği şu anda bir zamanlar Çin ve Mançurya'ya ait olan çeşitli topraklarda oturuyor. Devletleriyle işleyen bir ilişkimiz olacaksa, onların iadesini istemek veya en azından bu anlaşmazlığı çözmek adil olacaktır."
 MAN_tsr_request_our_lost_territories_tt:0 "[SOV.GetFlag] §YSovyetler Birliği§!'nden bir zamanlar Çin kontrolü altında olan toprakları teslim etmesini ister"
 MAN_tsr_research_and_education_department:0 "$MAN_research_and_education_department$"
 MAN_tsr_research_and_education_department_desc:0 "$MAN_research_and_education_department_desc$"
 MAN_tsr_research_cooperation:0 "ÇKP ile Araştırma İşbirliği"
 MAN_tsr_research_cooperation_desc:0 "Şu anda partimiz tarafından işgal edilen farklı bölgeler arasında gerçek bir iletişim eksikliği var. Bu nedenle hiçbir parçanın geride kalmamasını sağlamak için araştırma çabalarımızı ÇKP içinde koordine etmeliyiz."
 MAN_tsr_second_five_year_plan:0 "$MAN_second_five_year_plan$"
 MAN_tsr_second_five_year_plan_desc:0 "$MAN_second_five_year_plan_desc$"
 MAN_tsr_social_research_unit:0 "Gassakusha'yı İncele"
 MAN_tsr_social_research_unit_desc:0 "Gassakusha, hem Japonya'da hem de Mançurya'da faaliyet gösteren tarımsal kooperatif örgütleridir. Bunların neden işe yaradığını daha iyi anlamak ve bunu diğer bağlamlara uygulayabilmek için bunları incelemeliyiz."
 MAN_tsr_soviet_aid:0 "Sovyet Yardımı"
 MAN_tsr_soviet_aid_desc:0 "Kuzeyimizde ve doğumuzda Sovyetler Birliği varken topraklarımıza hem teçhizat hem de insan nakliyesini organize etmek çok zor olmayacaktır. Bu nedenle Çin'deki ideolojik müttefiklerine yardım etmeleri için onları ikna etmeliyiz."
 MAN_tsr_staff_the_court_with_manchus:0 "$MAN_staff_the_court_with_manchus$"
 MAN_tsr_staff_the_court_with_manchus_desc:0 "$MAN_staff_the_court_with_manchus_desc$"
 MAN_tsr_strengthen_the_manchukuo_imperial_army:0 "Mançu İmparatorluk Ordusunu Güçlendir"
 MAN_tsr_strengthen_the_manchukuo_imperial_army_desc:0 "Hasımlarımızı yenmek ve bağımsızlığımızı korumak için güçlü bir orduya ihtiyacımız var. Kwantung ordusuna aşırı güvenmek sonunda sadece çöküşümüze yol açacaktır. Özgür bir Mançurya ulusuna sahip olmak için önce bir orduya sahip olmalıyız."
 MAN_tsr_strengthen_ties_with_nissan:0 "Nissan İle Bağları Güçlendir"
 MAN_tsr_strengthen_ties_with_nissan_desc:0 "Nissan, askeri ve sivil endüstrilerimiz için önemli bir ortaktır. Her iki sektörü de kolaylıkla sürdürebilmemizi ve genişletebilmemizi sağlamak için onlarla daha yakın bir ilişki kurmaya çalışmalıyız."
 MAN_tsr_the_long_march_south:0 "Güneye Yürüyüş"
 MAN_tsr_the_long_march_south_desc:0 "Zaman geldi. Birliklerimizi sınırdan geçirerek Çin'deki İç Savaşın son aşamasını başlatmış olacağız. Kimin galip geleceğini görmek için henüz çok erken ancak uzman manevralarla düşmanlarımızın ayak uydurması zor olacak."
 MAN_tsr_the_new_beiyang_government:0 "Yeni Beiyang Hükümeti"
 MAN_tsr_the_new_beiyang_government_desc:0 "Beiyang ordusu bir zamanlar Çin Cumhuriyeti'ni şu anda bulunduğumuz yerden yönetiyordu. Çin'e gerçek demokrasiyi getireceksek, halefleri olma görevini üstlenmeliyiz, aksi takdirde Küresel Güçlerin gözünde sadece haydutlar ve diğer suçlular tarafından yönetilen gayri meşru bir devlet olarak görülürüz."
 MAN_tsr_the_question_of_leadership:0 "Liderlik Sorunu"
 MAN_tsr_the_question_of_leadership_desc:0 "Şu anda Puyi'nin sadece ismen bir İmparator olduğu ve başbakan Zhang Jinhui'nin yönetimi altında olsak da, bu elbette değiştirilebilir. Kwantung Ordusu gerekli görürse, gücü İmparatora geri verebilir veya kendi İmparatorlarını koyup Puyi'yi saf dışı bırakacak kadar ileri gidebilirler."
 MAN_tsr_the_southern_expedition:0 "Güney Seferi"
 MAN_tsr_the_southern_expedition_desc:0 "Kuomintang kuzey seferi, güzel cumhuriyetimizi bir zamanlar paramparça eden şeydi. Bir güney seferi başlatarak bu hatayı tersine çevirmeli ve şu anda Nanjing'i işgal eden başarısız devlete nihayet bir son vermeliyiz."
 MAN_tsr_the_two_emperors:0 "$MAN_the_two_emperors$"
 MAN_tsr_the_two_emperors_desc:0 "$MAN_the_two_emperors_desc$"
 MAN_tsr_trade_delegation:0 "$MAN_trade_delegation$"
 MAN_tsr_trade_delegation_desc:0 "$MAN_trade_delegation_desc$"
 MAN_tsr_trading_illicit_goods:0 "Yasadışı Mal Ticareti"
 MAN_tsr_trading_illicit_goods_desc:0 "Yasadışı mal ticareti ulusumuzun ana gelir kaynağı olmasa da, büyük karlar sağlıyor. Bunu kapatmak aptalca olurdu, ancak kontrolsüz bırakılırsa hem Mançurya hem de Çin toplumu üzerinde korkunç sonuçları olabilir."
 MAN_tsr_vassalize_mengukuo:0 "$MAN_vassalize_mengukuo$"
 MAN_tsr_vassalize_mengukuo_desc:0 "$MAN_vassalize_mengukuo_desc$"
 MAN_tsr_white_russian_advisers:0 "$MAN_white_russian_advisers$"
 MAN_tsr_white_russian_advisers_desc:0 "$MAN_white_russian_advisers_desc$"
 MAN_tsr_work_with_the_kempeitai:0 "Kempeitai ile Çalış"
 MAN_tsr_work_with_the_kempeitai_desc:0 "Japonya'nın askeri polisi Kempeitai, Mançurya'da Haydutlara ve diğer Muhaliflere karşı faaliyet gösteriyor. Ancak yetkililerimizle zayıf iletişim ve arazi hakkındaki bilgi eksikliği nedeniyle bu konuda büyük zorluklarla karşılaşıyorlar. Daha verimli bir birim oluşturmak için onlarla çalışmalıyız."
 MAN_tsr_zhao_shangzhis_coup:0 "Zhao Shangzhi'nin Darbesi"
 MAN_tsr_zhao_shangzhis_coup_desc:0 "Tozun yatışması, Japonların gitmesi ve Puyi'nin devrilmesiyle Mançurya'da bir tür güç boşluğu oluştu. Zhao Shangzhi ve Kuzeydoğu Anti-Japon Birleşik Ordusu bu boşluğu doldurmakta hızlı davrandı ve şimdi [MAN.GetLeader]'ın istifa etmesini talep ediyor."
 MA_clique_collective_faction:0 "Ma Kliği Kolektifi"
 MA_develop_inter_province_ties:0 "Eyaletler Arası Bağları Geliştir"
 MA_develop_inter_province_ties_desc:0 "Geniş ve seyrek nüfuslu topraklarımızı daha etkili bir şekilde yönetmek ve geliştirmek için aile üyelerimize ulaşmalı ve yönettiğimiz eyaletler arasında daha yakın bağlar kurmalıyız."
 MA_formalize_the_ma_clique_collective:0 "Ma Kliği Kolektifi'ni Resmileştir"
 MA_formalize_the_ma_clique_collective_desc:0 "Ma Kliği Kolektifi'ni uzaktaki savaş ağalarının gevşek bir oluşumundan daha sıkı birleşik bir şeye dönüştürmek için tüm zemin artık hazırlandı. Bu yapıyı resmileştirmeli ve hepimizin aynı dış politikayı paylaştığından emin olmalıyız."
 MA_promises_of_mutual_defense:0 "Karşılıklı Savunma Sözleri"
 MA_promises_of_mutual_defense_desc:0 "İmzalanan önceki tüm antlaşmalarla birlikte, artık Çinli olsun ya da olmasın herhangi bir yabancı gücün topraklarımıza girmesi halinde birbirimizin yardımına koşmamızı sağlayacak bir karşılıklı savunma antlaşmasını yürürlüğe koymaya geçebiliriz."
 MA_promises_of_mutual_defense_tt:0 "Tüm Ma Klikleri birbirlerinin §YBağımsızlığını Garanti Edecek§!"
 MA_strenghten_regional_trade:0 "Bölgesel Ticareti Güçlendir"
 MA_strenghten_regional_trade_desc:0 "Topraklarımız geniş olsa da ekonomilerimiz birçok açıdan yetersiz kalıyor. Bu sorunları hafifletmek için ticareti ve sanayi inşasını koordine etmeliyiz."
 MA_strenghten_regional_trade_tt:0 "Tüm üyeler başkentlerinde §G1§! §YSivil Fabrika§! kazanır"
 MA_unified_training_program:0 "Birleşik Eğitim Programları"
 MA_unified_training_program_desc:0 "Sınırlarımızı korumak ve kuzeydoğu üzerinde sıkı bir denetim sağlamak için, birliklerimizin kalitesini artırmak ve hiçbir değerli aceminin burnumuzun dibinden kaçmamasını sağlamak amacıyla asker alımını koordine etmek son derece önemlidir."
 PHI_10_year_training_plan:0 "10 Yıllık Eğitim Planı"
 PHI_10_year_training_plan_desc:0 "On yıllık bir süre içinde bağımsızlığa geçiş vaadiyle birlikte, Milli Savunma Yasası, evimizi savunabilecek kendine yeten, bağımsız bir güç yetiştirmek için hükümler içeriyordu. Bu, düzenli bir orduya geçişi, subay eğitim programlarını, bir yedek gücün oluşturulmasını ve askeri altyapıya yatırımı içerir."
 PHI_agricultural_migrants_to_hawaii:0 "Hawaii'ye Tarımsal Göçmenler"
 PHI_agricultural_migrants_to_hawaii_desc:0 "Birçok Filipinli işçi Hawaii'deki Amerikalı çiftçiler için çalışarak iyi bir gelir elde etti; bu göçü teşvik etmeliyiz ki memleketlerindeki ailelerine para göndermeye devam edebilsinler ve böylece ekonomimiz büyüsün."
 PHI_aguinaldos_coup:0 "Liderlik Mücadelesi"
 PHI_aguinaldos_coup_desc:0 "Hükümetin ele geçirilmesinin getirdiği ani kaosun yatışmaya başlamasıyla, Yürütme Komisyonu içindeki kişilikler kontrol için yarışıyor. Otoriter rejimler onları yönetecek belirgin bir otorite gerektirir ve destek birleşiyor."
 PHI_aircraft_requisition:0 "Uçak Talebi"
 PHI_aircraft_requisition_desc:0 "Kendi başımıza önemli bir uçak endüstrisi geliştiremedik, bu yüzden tamamen Amerikan uçaklarına bağımlı kaldık. İhtiyacımız arttı, bu yüzden Amerikalı sponsorlarımızdan daha fazla uçak talep etmeliyiz."
 PHI_align_with_japan:0 "Japonya ile Hizalan"
 PHI_align_with_japan_desc:0 "Tavırlarına rağmen, Amerika Birleşik Devletleri hala sömürgeci bir hakim devlettir ve bize verdikleri sözlerden her an dönebilirler. Bu nedenle uluslararası sahnede yeni dostlar edinmek ihtiyatlı olacaktır ve şu anda Japonya en ihtiyatlı seçim olarak durmaktadır."
 PHI_align_with_the_usa:0 "ABD ile Hizalan"
 PHI_align_with_the_usa_desc:0 "Amerika Birleşik Devletleri yardımsever ve zengin bir hakim devlet olduğunu kanıtladı. Uluslarımızı birbirine yakınlaştırarak, kalkınmamızı hızlandırmak ve korumamızı sağlamak için bizim adımıza yapabilecekleri daha çok şey var."
 PHI_american_capital_injection:0 "Amerikan Sermaye Enjeksiyonu"
 PHI_american_capital_injection_desc:0 "Amerika yatırımlarıyla ünlüdür, bu yüzden bu sermaye kaynağına dokunalım ve onu Filipin ekonomisine salalım. Bu kapitalist girişimcilerin doğrudan devlet müdahalesi olmadan ne harikalar yaratabileceğini kim bilebilir."
 PHI_anti_hacendados:0 "Hacendado Karşıtı"
 PHI_anti_hacendados_desc:0 "İspanyol sömürge döneminden miras kalan zengin, toprak sahibi seçkinler, kiracılarını çok uzun süredir ezdi. Bu antika kurumu yıkmalı ve toprağı onu işleyenlere geri vermeliyiz. Ekonomimizi ancak bu şekilde modernize edebilir ve bu sülüklerden kurtulabiliriz."
 PHI_anti_intervention_strategies:0 "Müdahale Karşıtı Stratejiler"
 PHI_anti_intervention_strategies_desc:0 "Bizimle Amerika Birleşik Devletleri arasındaki gerginlik artarken, yeni doğmakta olan Komünist devletimizin uzun vadeli yaşayabilirliğini sağlamak için elimizden geleni yapmalıyız, bu hedefli tavizler yoluyla olsun veya bu gerginlikler düşmanlığa dönüşmeden önce onlardan alabileceklerimizi almak olsun."
 PHI_appoint_macarthur:0 "MacArthur'u Ata"
 PHI_appoint_macarthur_desc:0 "1935'ten beri General Douglas MacArthur Filipin hükümeti için danışman olarak çalışıyor, ancak becerilerini ve deneyimini daha resmi bir kapasitede kullanmamızın ve ona Uzak Doğu'daki Birleşik Devletler Kuvvetleri komutanlığını vermemizin zamanı geldi."
 PHI_army_air_corps:0 "Ordu Hava Kolordusu"
 PHI_army_air_corps_desc:0 "Ordu Hava Kolordusu, boyut ve kaynak bakımından sınırlı olsa da hırstan yoksun değil. Adalarımız dağınık ve geçilmesi zor, bu nedenle mümkün olduğunca çok yeri kapsayabilmek için hava kabiliyetlerimize daha önemli yatırımlar yapmalıyız."
 PHI_army_of_the_philippines:0 "Filipinler Ordusu"
 PHI_army_of_the_philippines_desc:0 "Silahlı kuvvetlerimiz sadece birkaç kısa yıl içinde önemli ölçüde gelişti ve yabancı desteğine bel bağlamayı bir kenara bırakıp tamamen Filipin kanı ve çeliğiyle korunan yeni, parlak ve güvenli bir geleceğe doğru kendimiz için güvenle yürümenin zamanı geldi. Şu andan itibaren güvenliğimiz kendi sorunumuzdur."
 PHI_assassination_of_quezon:0 "Quezon Suikastı"
 PHI_assassination_of_quezon_desc:0 "'Başkan' Quezon'un Filipinler'i çok uzun zamandır geride tuttuğu talihsiz bir gerçektir. Amerikan kucağı köpeği, Filipin halkının milli iradesinin gerçekleşmemesini sağlamak için elinden geleni yaptı. Kendi etrafında kurduğu kurumlar onu demokratik değişime karşı bağışık hale getirdi, bu yüzden şimdi siyaseti başka yollarla ilerletmeliyiz."
 PHI_assassination_of_quezon_tt:0 "§RQuezon'un görevden alınmasını sağlamaya çalışacak planlar harekete geçirildi. Kalıcı olarak.§!"
 PHI_assume_the_naval_burden:0 "Deniz Yükünü Üstlen"
 PHI_assume_the_naval_burden_desc:0 "Japonya karadaki çatışmalara karıştı, bizim uzmanlığımız ise denizde kalmaya devam ediyor. Deniz çatışmasının sorumluluğunu almayı teklif etmeliyiz, böylece tamamen diğer harekat alanlarına odaklanabilirler."
 PHI_basic_welfare:0 "Temel Refah"
 PHI_basic_welfare_desc:0 "Daha savunmasız insanlarımıza karşı bir sorumluluğumuz ve zorluklarının en azından bir kısmının hafifletildiğini görme görevimiz var. Hayır kurumları gibi mutlak temellere zaten sahibiz, ancak sanayinin yükselişiyle birlikte işçilerin durumu ön plana çıktı. Çalışma yasalarını belirlemek ve bir asgari ücret uygulamak için Milli Ekonomi Konseyi'ni kuracağız."
 PHI_bastion_bataan:0 "Bataan Kalesi"
 PHI_bastion_bataan_bypass_tt:0 "Bataan eyalet sınırlarına daha fazla §Y$bunker$§! inşa edilemez ve Bataan'ın içinde veya Dagupan'da hiçbir §Y$coastal_bunker$s§! inşa edilemez"
 PHI_bastion_bataan_desc:0 "Bataan yarımadası, Manila Körfezi'nin bir tarafını oluşturan doğal bir savunma konumudur. Bu konumu güvence altına aldığımız sürece, Körfezi ve tesislerini kimin ve neyin kullanabileceğini kontrol edebileceğiz. Bu alanın hakimiyetimizin devamını sağlamak için, kara tarafı boyunca savunma hatları geliştirmemiz ve yüksek noktalara topçu yerleştirmemiz gerekiyor."
 PHI_battalion_combat_teams:0 "Tabur Muharebe Timleri"
 PHI_battalion_combat_teams_desc:0 "Savaşın gerçekleri, daha hareketli ve esnek, ortaya çıkan her duruma uyum sağlayabilen bir güce ihtiyacımız olduğunu açıkça göstermiştir. Daha gevşek bir hiyerarşiyi sürdürmeli ve küçük birim harekatlarını gerçekleştirmek için yetkilendirilmelidirler."
 PHI_battalion_combat_teams_tt:0 "§Y$category_all_infantry$§!:\n    Yumuşak Saldırı: §G+15%§!\n    Sert Saldırı: §G+15%§!\n    Delme: §G+15%§!\n §Y$category_cavalry$§!:\n    Yumuşak Saldırı: §G+10%§!\n    Sert Saldırı: §G+10%§!\n    Delme: §G+10%§!"
 PHI_beach_defense_strategy:0 "Plaj Savunma Stratejisi"
 PHI_beach_defense_strategy_desc:0 "Yeterli silah ve askerle Filipinler'in çevresini tutabilmeliyiz ve bu nedenle savunma stratejimizi bu amacı göz önünde bulundurarak oluşturmalıyız. Bu şekilde, Filipinler'in bir bütün olarak herhangi bir potansiyel uzun vadeli askeri harekata yatırım yapmaya devam etmesini sağlayabiliriz."
 PHI_bell_trade_act:0 "Bell Ticaret Yasası"
 PHI_bell_trade_act_desc:0 "Filipin Ticaret Yasası olarak da bilinen bu yasa, [PHI.GetName] ile [USA.GetName] arasındaki ticareti düzenler. Bu, bir finansal yatırım paketini, tercihli ticaret ve tarife anlaşmalarını içerir. Ayrıca Filipin kaynaklarına önemli ABD kurumsal erişimini de içerir ki bu bazı endişelere yol açmaktadır, ancak diğer faydaların riske değer olduğu belirlenmiştir."
 PHI_bicameral_legislature:0 "Çift Kamaralı Yasama Meclisi"
 PHI_bicameral_legislature_desc:0 "Hükümetimizin genişlemesi devam ediyor. Alt meclisi zaten oluşturmuştuk ve şimdi üst meclisi kurma zamanı. Bu modelle ulusumuz için en iyi yasaları çıkarabiliriz."
 PHI_bill_of_rights:0 "Haklar Bildirgesi"
 PHI_bill_of_rights_desc:0 "Modern bir devlet olarak ciddiye alınmak istiyorsak, halkımızın haklarını yasayla güvence altına almalıyız. Bu, [USA.GetName] bildirgesine dayanarak din, ifade, basın ve toplanma gibi özgürlükleri atfedebilir. Ancak biz kendi ulusumuzuz ve bazı dikkate değer farklılıklar var, örneğin toplumumuzda silah taşıma hakkı sağlamayı uygun görmüyoruz."
 PHI_bill_of_rights_for_veterans:0 "Gaziler İçin Haklar Bildirgesi"
 PHI_bill_of_rights_for_veterans_desc:0 "Birçok Filipinli savaş sırasında görev aldı ve eve dönenlerin uygun şekilde bakıldığından emin olmalıyız. Gazilerimize bakarsak, insanlar ordunun kariyer için sağlam bir seçim olduğunu gördükçe geleceğe iyi bir ek insan gücü akışı sağlayabiliriz."
 PHI_both_observer_advisor_focus_tt:0 "Hem §Y$PHI_japanese_advisors$§! hem de §Y$PHI_japanese_observers$§! hedeflerini tamamlamanın etkisi:"
 PHI_break_chinese_monopoly:0 "Çin Tekelini Kır"
 PHI_break_chinese_monopoly_desc:0 "Çinli tüccarlar toplumumuzda dükkan ve banka sahipleri olarak yerlerini buldular, ancak bu kadar kritik hizmetler üzerindeki hakimiyetin yabancılar tarafından tutulması nedeniyle, kendi güvenliğimiz için dağıtım ağlarının daha adil bir şekilde dağıtılmasını sağlamalıyız."
 PHI_bring_in_eisenhower:0 "Eisenhower'ı Getir"
 PHI_bring_in_eisenhower_desc:0 "MacArthur'a benzer şekilde, Dwight D. Eisenhower 1935'ten beri Filipin hükümetine danışman olarak çalışıyor ve MacArthur şimdi bu gelecek vaat eden subayı resmen kadrosuna almayı uygun gördü. İkisi arasında antipati olduğuna dair raporlar olsa da, belki de farklı kişilikleri ve liderlik tarzları ulusu güvende tutmak için gereken tamamlayıcı unsur olacaktır."
 PHI_cavite_naval_base:0 "Cavite Deniz Üssü"
 PHI_cavite_naval_base_desc:0 "Manila şehrinin körfezinin karşısında bulunan Cavite'deki tersane, Filipinler'de bir derin su limanı ve tersanesi olma potansiyeli en yüksek olan yerdir. Halihazırda bazı yeni tesislere sahip, ancak yatırımla Güneydoğu Asya sularını kontrol edebilecek bir filoyu konuşlandırmak için ciddi bir stratejik varlık haline gelebilir."
 PHI_central_focuses_done_4_tt:0 "Önceki kademeden en az §Y4§! odak tamamlandı"
 PHI_central_focuses_done_5_tt:0 "Önceki kademeden en az §Y5§! odak tamamlandı"
 PHI_claim_to_core_tt:0 "Kontrolü ele geçirdikten sonra §YAna Vatan Yapma§! kararlarının kilidini açar."
 PHI_coastal_artillery:0 "Kıyı Topçusu"
 PHI_coastal_artillery_desc:0 "Şüphesiz ki bir ada zincirinde en fazla hedefe sahip olan bölüm, hem karadaki hem de denizdeki hedefleri vurabilen Kıyı Topçusudur. Bu birimlerin teçhizatlandırılmasına, eğitimine ve yükseltilmesine yatırım yapmak bir öncelik olmalıdır."
 PHI_coastal_defense_ships:0 "Kıyı Savunma Gemileri"
 PHI_coastal_defense_ships_desc:0 "Filomuz o kadar büyüdü ki artık daha büyük araçları monte etme ve bakımını yapma altyapısına ve araçlarına sahibiz. İlk hedefimiz kendi kıyılarımızın korunması olmaya devam ediyor, ancak artık kendi coğrafyamızı avantajlarına kullanarak düşman ana gemileriyle kafa kafaya durabilecek gemiler tasarlayabiliriz."
 PHI_cobalt_supremacy:0 "Kobalt Üstünlüğü"
 PHI_cobalt_supremacy_desc:0 "Ben ölüm oldum, dünyaların yok edicisi."
 PHI_comitern:0 "Komintern"
 PHI_comitern_desc:0 "[SOV.GetNameDef] ile bağlantılarımız en iyi ihtimalle zayıf olsa da, uluslararası sahnedeki güçleri inkar edilemez ve Komünist deneyimizin devam etmesini ve başkalarına ihraç edilmesini istiyorsak, Sosyalist idealin küresel olarak iyileştirilmesi için tek bir alan altında birleşmeliyiz."
 PHI_commonwealth_of_the_philippines:0 "Filipinler Milletler Topluluğu"
 PHI_commonwealth_of_the_philippines_desc:0 "Sadece bir yıl önce kurulan Filipinler Topluluğu, ABD tarafından 10 yıllık bir geçiş dönemi olarak vaat edilen bağımsız Filipinler'e doğru atılan ilk adımdır. Henüz yeni doğmakta olan ulusumuzu düzgün bir şekilde işler hale getirmek için yapılması gereken çok şey ve alınması gereken çok karar var."
 PHI_conquest_of_japan:0 "Japonya'nın Fethi"
 PHI_conquest_of_japan_desc:0 "Japonya uzun zamandır bu bölgedeki deniz kontrolü açısından birincil rakibimiz olmuştur, bu yüzden bu rekabete son vermenin ve onlar üzerindeki hakimiyetimizi kesin olarak kullanmanın zamanı geldi."
 PHI_declare_military_emergency:0 "Askeri Olağanüstü Hal İlan Et"
 PHI_declare_military_emergency_desc:0 "Ülke faşizme doğru kaygan bir yokuştaydı, ancak kararlı eylem son düşüşü engelledi. Artık her yerde tehditler olduğu açık ve onları engellemek bize düşüyor. Hiçbir şey sınır dışı değil, hiçbir şey yasadışı değil. Demokrasi hayatta kalmalı."
 PHI_department_of_foreign_affairs:0 "Dışişleri Bakanlığı"
 PHI_department_of_foreign_affairs_desc:0 "Bağımsız bir varlık olarak uluslararası sahnede sağlam bir yer edindiğimiz için artık kendi diplomatik eylemlerimizden sorumluyuz. Diplomatik bağlantılarımızı ele alacak ve tüm dünyaya diplomatik personel yerleştirecek bir dışişleri bakanlığı kurmalıyız."
 PHI_develop_domestic_aircraft_industry:0 "Yerli Uçak Endüstrisini Geliştir"
 PHI_develop_domestic_aircraft_industry_desc:0 "Dostlarımıza ve müttefiklerimize güvenmek şimdiye kadar iyiydi, ancak sonuçta bu modern dünyada kendi askeri kabiliyetlerine sahip bağımsız bir devlet olarak tanınmak istiyorsak, kendi yerli hava endüstrimize yatırım yapmaya başlamalıyız. Bu, ulusumuzdaki havacılık yenilikçilerine ve girişimcilerine yapılacak bazı sübvansiyonlarla başlatılabilir."
 PHI_develop_japanese_trade_connections:0 "Japon Ticaret Bağlantılarını Geliştir"
 PHI_develop_japanese_trade_connections_desc:0 "Japonya, mallara ve kaynaklara aç olduğunu açıkça belirtti ve Filipinler'in ticaret yapacak bir bereketi var. Karşılıklı yararımız için uluslarımız arasındaki ticareti teşvik etmeliyiz."
 PHI_develop_naval_infrastructure:0 "Deniz Altyapısını Geliştir"
 PHI_develop_naval_infrastructure_desc:0 "Denizcilik hırslarımız artarken, gemi inşa yeteneklerimiz de buna uygun olarak genişlemelidir."
 PHI_devil_boats:0 "Şeytan Botları"
 PHI_devil_boats_desc:0 "Devriye botlarımız hızları ve cesaretleriyle, özellikle de sert vurup denizin hayaletleri gibi siste kaybolma yetenekleriyle ün kazandı. Buna göre, düşmanlarımız bu 'şeytan botlarına' yakalanmamak için kıyılarımızdan uzak durmayı öğrendiler."
 PHI_economic_nationalism:0 "Ekonomik Milliyetçilik"
 PHI_economic_nationalism_desc:0 "Geleceğimiz üzerinde tam kontrole sahip olduğumuza göre, ekonomimizin kontrolünü de ele almanın zamanı geldi. Tarifeler, düzenlemeler, mal ve sermaye hareketi gibi birçok araç emrimizde. Hepsini kullanmalı ve böylece Filipin ekonomisinin ne kadar sağlam olduğunu göstermeliyiz."
 PHI_eisenhower_stays_tt:0 "§YDwight D. Eisenhower§! Filipinler'de kalacak ve artık [USA.GetNameDef] tarafından geri çağrılamaz"
 PHI_eisenhower_steps_in_flag:0 "Eisenhower müdahale etti"
 PHI_election_overturned:0 "Seçim İptal Edildi"
 PHI_election_overturned_desc:0 "1935 seçimi ezici bir çoğunlukla Manuel Quezón lehineydi, biraz fazla ezici bir çoğunlukla. Emilio Aguinaldo ciddi endişelerini dile getirdi ve bunları olası seçim manipülasyonu konusunda kapsamlı bir soruşturma sözü veren Amerika Birleşik Devletleri'ne iletti."
 PHI_encourage_asian_trade:0 "Asya Ticaretini Teşvik Et"
 PHI_encourage_asian_trade_desc:0 "Asya ulusları arasında önemli tarihi denizcilik bağlantıları vardır ve sömürgeci güçlerin bunları kısıtlama çabalarına rağmen güçlü kalmaya devam etmektedirler. Bu bağlantıları güçlendirmeli ve herkesin karşılıklı büyümesi ve refahı için uluslarımız arasında daha fazla ticareti teşvik etmeliyiz."
 PHI_encourage_chinese_immigration:0 "Çin Göçünü Teşvik Et"
 PHI_encourage_chinese_immigration_desc:0 "Çinli tüccarların küçük işletmeler ve dükkanlar kurma konusunda son derece girişimci oldukları kanıtlanmıştır. Bu yetenek ve para akışını kullanmalı ve bu sektörde daha fazla büyümeyi teşvik etmeliyiz."
 PHI_encourage_foreign_investment:0 "Yabancı Yatırımı Teşvik Et"
 PHI_encourage_foreign_investment_desc:0 "Pazarımızdan pay almakla ilgilenen tek ulus Amerika Birleşik Devletleri değil. Çok sayıda hammaddemiz ve gelişen bir tarım sektörümüz var. Ulusumuzun, Filipinler'in bereketinden yararlanma imkanına ve öngörüsüne sahip olanlar için yatırıma açık olduğunu açıkça belirtmeliyiz."
 PHI_encourage_gold_exports:0 "Altın İhracatını Teşvik Et"
 PHI_encourage_gold_exports_desc:0 "Şu anda bir altına hücum yaşıyoruz ve bu daha iyi bir zamanda gelemezdi. Yerli arzımız tamamen doygunluğa ulaştı, şansımıza dünya altına aç. Büyük Buhran'dan çıkan küresel nüfus, kendi servetlerinin daha somut simgelerine aç ve külçe altından daha somut bir şey yok."
 PHI_encourage_japanese_investment:0 "Japon Yatırımını Teşvik Et"
 PHI_encourage_japanese_investment_desc:0 "Şu anda Amerika Birleşik Devletleri ulusumuzda bir dizi ticari avantaja sahip; Japonya ile sessizce bağlantılar geliştirmeliyiz, böylece Japon yatırımı ulusumuza akabilir ve Amerikalıların açgözlülüğünü kırabilir."
 PHI_end_colonialism:0 "Sömürgeciliği Bitir"
 PHI_end_colonialism_desc:0 "Sömürgecilik çok uzun süre irin toplamasına izin verilen bir beladır. Tüm insanlar özgürlük ve demokrasi içinde yaşama hakkını hak eder ve bunu zorla kabul ettirmek zorunda kalacağız."
 PHI_every_non_communist_coastal_warlord:0 "Her komünist olmayan ve kıyıdaki Çinli savaş ağası:"
 PHI_exile_support:0 "Sürgün Desteği"
 PHI_exile_support_desc:0 "Diğer ülkelerde ikamet eden çok sayıda Filipinli var ve mali ve maddi destek sağlamaları için onların yardımına başvurabiliriz. Bu daha sonra cesur direniş savaşçılarımıza kaçırılabilir veya nihai kurtuluşumuzda kullanılmak üzere Filipin savaş birimleri oluşturmak için kullanılabilir."
 PHI_expand_airbases:0 "Hava Üslerini Genişlet"
 PHI_expand_airbases_desc:0 "Müttefiklerimiz adalarımıza bir hava kuvveti konuşlandırmak isteseler veya kendimiz için bir tane üretme kabiliyetini geliştirsek bile, onları gerçekten üsleyecek alana sahip değiliz! Uçakların burada daha kolay konuşlandırılabilmesi için hemen yeni havaalanları ve aerodromlar oluşturmaya başlamalıyız."
 PHI_expand_gold_mining:0 "Altın Madenciliğini Genişlet"
 PHI_expand_gold_mining_desc:0 "İspanya altın ve gümüş rezervleri bulma konusunda her zaman son derece zeki olmuştur ve Filipinler'de hayal kırıklığına uğramamışlardır. Ancak en zengin altın damarlarının daha yeni işletilmeye başlandığını ve bu patlayan ihracatın ulusumuza rekor gelir getirdiğini keşfetmek onları çok kızdırırdı."
 PHI_expand_us_bases:0 "ABD Üslerini Genişlet"
 PHI_expand_us_bases_desc:0 "Modern savaşa uçaklar hakimdir ve bu özellikle Filipinler'deki durumumuz için geçerlidir. Adaları güvence altına almanın açık ara en kolay yolu hava hakimiyetidir ve daha da iyisi bu, çevredeki okyanusu da devriye gezmemizi sağlar. Kendimizi bu hava operasyonlarına daha iyi hazırlamak için buradaki hava üslerimizi önemli ölçüde genişletmemiz gerekiyor."
 PHI_far_east_air_force:0 "Uzak Doğu Hava Kuvvetleri"
 PHI_far_east_air_force_desc:0 "Filipinler kara ve deniz kuvvetlerine çok daha alışkın olsa da, hava kuvvetlerinin genişlemesini durduracak hiçbir şey yok. Uzak Doğu Hava Kuvvetleri burada konuşlandırılmalı ve hava alanlarımız daha fazla ve daha büyük uçağın potansiyel tehditlerin ana üssüne çok daha yakın vuruş yetenekleri sağlamasına olanak tanıyacak şekilde genişletilmelidir."
 PHI_fast_attack_craft:0 "Hücumbot"
 PHI_fast_attack_craft_desc:0 "Devriye Botunun ideal evrimi, önemli ölçüde yükseltilmiş hız ve ateş gücüne sahip Hücumbottur; bu araçlar kıyılarımızın etrafında vızıldayabilir, çok yaklaşan düşmanlarımızı mahvedebilir ve yardım gelmeden önce tekrar uzaklaşabilir."
 PHI_filipino_polynesian_reunification:0 "Pasifik'in Efendileri"
 PHI_filipino_polynesian_reunification_desc:0 "Dünyanın bu bölgesi okyanus tarafından domine ediliyor, dağınık kara parçaları ve uzak adalardan oluşuyor ancak hepsini fethettik. Böylece, Pasifik'in efendileri olarak haklı yerimizi güvence altına alıyoruz."
 PHI_filipino_repatriation_act:0 "Filipinli Geri Dönüş Yasası"
 PHI_filipino_repatriation_act_desc:0 "Filipinler'i bağımsızlık yoluna sokan Tydings-McDuffe Yasası kapsamında, Filipinlilerin Amerika Birleşik Devletleri'ne girişini ciddi şekilde kısıtlayan bir madde eklendi. Ailelerin ayrılmasını görmek istemiyoruz, bu yüzden Filipinler'e ücretsiz tek yönlü seyahat sunacağız."
 PHI_focus_time_reduced_T1_tt:0 "§Y$PHI_leverage_the_peso$§!, bu odak için gereken süreyi 35 gün azaltacak."
 PHI_focus_time_reduced_T2_tt:0 "§Y$PHI_anti_hacendados$§!, bu odak için gereken süreyi 35 gün azaltacak."
 PHI_focus_time_reduced_T3_tt:0 "§Y$PHI_open_borders$§!, bu odak için gereken süreyi 35 gün azaltacak."
 PHI_form_the_executive_commision:0 "Yürütme Komisyonunu Kur"
 PHI_form_the_executive_commision_desc:0 "Arka planda ipleri elinde tutan gölge bir liderler grubu vardı, ancak faşist ideal Filipinler'de iktidara geldiğine göre, bu bireylerin ışığa çıkma ve hükümetin başındaki hak ettikleri yeri alma zamanı geldi."
 PHI_fortify_corregidor:0 "Corregidor'u Tahkim Et"
 PHI_fortify_corregidor_bypass_tt:0 "Manila şehrinde daha fazla §Y$bunker$§! ve §Y$coastal_bunker$§! inşa edilemez."
 PHI_fortify_corregidor_desc:0 "Corregidor Adası, Manila Körfezi'nin girişinde dimdik duruyor ve bu nedenle körfezin ve oradaki deniz varlıklarının kontrolünü sürdürmemiz için kilit taşıdır. Adanın tahkimatlarını yükseltmeli ve düşman hava ve deniz kuvvetlerinin uzun süreli kuşatmasına ve bombardımanına dayanmaya yardımcı olmak için yeraltı tesisleri inşa etmeliyiz."
 PHI_government_filipinization:0 "Hükümetin Filipinlileştirilmesi"
 PHI_government_filipinization_desc:0 "Hükümetimiz yüzyıllardır yabancı kuruluşlar tarafından domine edildi, önce İspanyollar, sonra Amerikalılar. Kontrolü kendimiz için ele almanın ve Filipinler'in Filipinliler tarafından ve Filipinliler için yönetilmesinin zamanı geldi!"
 PHI_grassroot_guerillas:0 "Taban Gerillaları"
 PHI_grassroot_guerillas_desc:0 "Ulusumuz genelinde faaliyet gösteren çok sayıda direniş örgütü var, ancak eksik oldukları şey, tüm çabalarını işgalcileri kovmak için daha koordineli bir çabaya yönlendirecek merkezi komuta ve kontroldür. Savaşma ruhu orada, sadece düzgün bir şekilde kullanılması ve en savunmasız hedeflere yönlendirilmesi gerekiyor."
 PHI_grassroot_guerillas_tt:0 "Tamamlanan her ön koşul hedefi için 3 tugay gerilla birliği oluşturur. Özgürleştirilmiş eyaletler ve ardından az düşman askeri bulunan eyaletler konum olarak önceliklendirilecektir."
 PHI_gunboat_diplomacy:0 "Gambot Diplomasisi"
 PHI_gunboat_diplomacy_desc:0 "Biz bir ada ülkesiyiz ve bu nedenle çıkarlarımıza karşı çıkanların yüreklerine korku salacak deniz yeteneklerine sahip olmalıyız - ve eğer henüz bizden korkmuyorlarsa, Filipin filosu ana limanlarına gelip oradaki nakliyenin kontrolünü ele geçirdiğinde korkacaklar."
 PHI_hispanic_overtures:0 "Hispanik Girişimler"
 PHI_hispanic_overtures_desc:0 "Dünyada Hispanik bağlantıları olan tek ulus biz değiliz, aslında Güney Amerika'nın çoğunda var ve birçoğuyla olumlu ilişkiler geliştirmeye devam ettik. Ulaşmalı ve bu bağlantıları daha resmi hale getirmeye çalışmalıyız."
 PHI_hispanidad_filipina:0 "Hispanidad Filipina"
 PHI_hispanidad_filipina_desc:0 "1896-1898 İspanyol İmparatorluğu'na Karşı Bağımsızlık Savaşı'nın yarattığı uçuruma rağmen, birçok Filipinli insan hala kendilerini Hispanik diasporasının bir parçası olarak görüyor ve İspanyol anakarasındaki devam eden gerginlikler bir endişe meselesi haline geldi."
 PHI_hukbalahap:0 "Hukbalahap"
 PHI_hukbalahap_desc:0 "Hukbo ng Bayan Laban sa Hapon (Japonlara Karşı Halk Ordusu) veya kısaca Hukbalahap, Orta Luzon çiftçileri tarafından kurulan komünist bir gerilla hareketidir ve [PHI.GetNameDef] genelindeki en yetenekli direniş savaşçılarından bazıları olduklarını kanıtlamışlardır. Son derece iyi organize olmuş ve motive olmuşlardır, ancak silahlardan yoksundurlar. Onlara biraz silah sağlamalıyız."
 PHI_i_shall_return:0 "Geri Döneceğim"
 PHI_i_shall_return_desc:0 "Bu, General Douglas MacArthur'un [PHI.GetNameDef] devletini tahliye ederken söylediği sözdü ve o zamandan beri sık sık tekrarladığı bir söz. Bunu gerçeğe dönüştürmek için araç ve gereçleri sağlamamızın zamanı geldi."
 PHI_if_align_with_japan_tt:0 "Eğer §Y$PHI_align_with_japan$§! tamamlanmışsa:"
 PHI_if_align_with_the_usa_tt:0 "Eğer §Y$PHI_align_with_the_usa$§! tamamlanmışsa:"
 PHI_if_any_state_occupied_tt:0 "İşgal altındaki her ana eyalet (Şu anda: 0):"
 PHI_if_chinese_immigration_tt:0 "Eğer §Y$PHI_encourage_chinese_immigration$§! tamamlanmışsa:"
 PHI_if_communist_tt:0 "Eğer §Y$PHI_partido_komunista_ng_pilipinas_coup$§! tamamlanmışsa:"
 PHI_if_supported_scw_side_lost_tt:0 "Gönüllü gönderdiğimiz bir §Yİspanya iç savaşı§! tarafı yenildiyse:"
 PHI_if_supported_scw_side_wins_tt:0 "§Yİspanya iç savaşındaki§! bir taraf bizden gönüllü aldıktan sonra kazanırsa, §Y$PHI_reconciliation_with_spain$§! bunun yerine daha iyi etkilere sahip olacaktır."
 PHI_improve_trait_tt:0 "Gelişmiş bir danışman özelliği kazanacak"
 PHI_increase_sugar_exports:0 "Şeker İhracatını Artır"
 PHI_increase_sugar_exports_desc:0 "Şeker yüzyıllardır ekonomimizin temeli olmuştur ve ihracatın sağlıklı kalmasıyla bizi Büyük Buhran'ın en kötü dönemlerinden geçirmiştir. Diğer uluslarla kazançlı ticaret anlaşmaları imzalayarak, şekerin uluslararası mutfağın ve... gazlı içeceklerin temeli olarak büyümesinden yararlanmak için en iyi konumda olduğumuzdan emin olabiliriz."
 PHI_infiltrate_chinese_ports:0 "Çin Limanlarına Sız"
 PHI_infiltrate_chinese_ports_desc:0 "Liman işçilerimiz Komünizmin sunduğu fırsatları ilk yakalayanlar arasındaydı ve bu nedenle uzun zamandır en sadık müttefiklerimiz oldular. Çin limanlarında da aynı duyguyu uyandırmalı ve ardından bunları Çin mücadelesine daha fazla müdahale etmek için bir sıçrama tahtası olarak kullanmalıyız."
 PHI_investment_fund:0 "Yatırım Fonu"
 PHI_investment_fund_desc:0 "Ulusumuza yapılan bireysel yatırımlar çok takdir edilse de, bu sermayeden gerçekten en iyi şekilde yararlanmak için, Filipinler'deki ekonomik gerçekleri gerçekten bilenler tarafından yönetilen merkezi bir fonda tutulmalı, böylece bu yatırımı en yüksek getiri için en iyi kullanılabileceği yere yönlendirebilirler."
 PHI_jap_equipment:0 "§Y[PHI.GetName]§!, §Y[JAP.GetName]§! Askeri Endüstriyel Organizasyonlarını (MIO) kullanacak."
 PHI_jap_equipment_non_aat:0 "§Y[PHI.GetName]§!, §Y[JAP.GetName]§! Teçhizat Tasarımcılarını kullanacak."
 PHI_japanese_advisors:0 "Japon Danışmanlar"
 PHI_japanese_advisors_desc:0 "Japonya imkansızı başardı, feodal bir toplumdan modern bir topluma mutlak rekor sürede geçti. Bu bir süre önce olsa da, giderek samimileşen ilişkilerimizle yararlanabileceğimiz büyük miktarda endüstriyel ve askeri uzmanlığı hala koruyorlar."
 PHI_japanese_observers:0 "Japon Gözlemciler"
 PHI_japanese_observers_desc:0 "Aramızdaki ilişkiler giderek daha da yakınlaşırken, Japonlar ulusumuza askeri bir birlik göndermeyi kabul etti. Bu, Avrupa tarzı komuta yapılarının dostane bir ortamda nasıl işlediğini ilk elden öğrenebilmeleri, bizim de onların istisnai savaş uzmanlığından ders alarak bu bilgeliği rütbelere aktarabilmemiz içindir."
 PHI_juramentado:0 "Juramentado"
 PHI_juramentado_desc:0 "Juramentado, işgalcilere karşı ölümüne savaşmaya yemin eden Moro ve Sulu savaşçılarıydı. Eski ritüeller solmuş olsa da, korkusuz fedakarlık ruhu devam ediyor. Bu geleneği benimseyerek, direniş savaşçılarımıza işgalcileri dehşete düşüren ve kendi halkımızı cesaretlendiren yıkıcı saldırılar başlatmaları için ilham verebiliriz."
 PHI_land_of_the_setting_sun:0 "Batan Güneşin Ülkesi"
 PHI_land_of_the_setting_sun_desc:0 "Hazırlıklarımız yapıldı. Saldırı zamanı şimdi! Güneşin [JAP.GetNameDef] üzerinde bir daha doğmamak üzere son kez batma zamanı."
 PHI_land_reform:0 "Toprak Reformu"
 PHI_land_reform_desc:0 "Zengin toprak sahipleri Filipinler'deki tarım sektörüne hala hakim. Feodal değil, modern bir ulus olduğumuzu göstermeliyiz. Devlet bu geniş arazilerin zorunlu alımlarını uygulayacak ve daha verimli ekim ve kullanım için parselleri küçük sahiplere ve şirketlere satacaktır."
 PHI_legalize_the_communist_party:0 "Komünist Partiyi Yasallaştır"
 PHI_legalize_the_communist_party_desc:0 "Bir hareket olarak Komünizm bir kez daha yasal olduğuna göre, bir sonraki adım partiyi gölgelerden çıkarmak ve eylemlerini bir kez daha kamuya açık hale getirmek ve hareketi büyütme çalışmalarına başlamaktır."
 PHI_leverage_the_peso:0 "Pesoyu Kaldıraç Olarak Kullan"
 PHI_leverage_the_peso_desc:0 "Para birimimiz bize aittir ve onu ABD Dolarından ayırmak için çalışmalıyız. Bu, ekonomimizin daha da gelişmesine en uygun düzeltici mali politikalar uygulamamıza olanak tanıyacaktır."
 PHI_local_resistance:0 "Yerel Direniş"
 PHI_local_resistance_desc:0 "İşgalciler politikalarıyla çok az dost edindiler ve yararlanabileceğimiz önemli bir hoşnutsuzluk akıntısı var. Herkes üzerine düşeni yapabilir; çiftçiler erzakları düşman askerlerinden saklar, balıkçılar isyancıları taşır, askerler başkalarını savaş teknikleri konusunda eğitir ve tüccarlar direnişe yardım etmek için ekipman ve para sağlar."
 PHI_luce_celler_act:0 "Luce-Celler Yasası"
 PHI_luce_celler_act_desc:0 "Luce-Celler yasası, izin verilen Filipinli gezgin kotasını artıran ve ilk kez Filipinlilerin Amerikan vatandaşı olarak vatandaşlığa kabul edilmesini sağlayan Amerika Birleşik Devletleri'ndeki bir göçmenlik yasasıdır. Bu, pasifik ötesi göçte yeni bir dönemin başlangıcını işaret ediyor."
 PHI_luzon_transport:0 "Luzon Ulaşımı"
 PHI_luzon_transport_desc:0 "Filipinler'in halihazırda en gelişmiş bölgesi olmasına rağmen, aynı zamanda en kalabalık ve endüstriyel bölgesidir ve bu nedenle ulaşım yolları daha fazla yatırım ve genişlemeye büyük ihtiyaç duymaktadır."
 PHI_makapili:0 "Makapili"
 PHI_makapili_desc:0 "Filipin ulusunda faşizmin yükselişi hızlı oldu ve buna ne yazık ki belirli bir miktarda kaos eşlik etti. Yurtdışındaki dostlarımız düzeni sağlamak, haydutlukla savaşmak ve isyanı bastırmak için bir 'Barış Ordusu'nun yetiştirilmesi adına silah ve eğitim teklif etti."
 PHI_malayo_polynesia:0 "Malayo-Polinezya"
 PHI_malayo_polynesia_desc:0 "Malay yarımadası ve Hint Adaları ile tarihsel olarak yakın kültürel, tarihi ve etnik bağlarımız olmuştur. Bu kardeşlik bağlantısının ışığında, kendi halkımızın sahip olduğu aynı hak ve ayrıcalıkları onlara da genişletmeliyiz."
 PHI_mandatory_conscription:0 "Zorunlu Askerlik"
 PHI_mandatory_conscription_desc:0 "[PHI.GetNameDef]'in savunması her vatandaşın sorumluluğundadır. Bu nedenle, vatandaşlar muharebenin temellerini öğrenebilmeleri ve dolayısıyla kendilerinden askeri görev talep edildiğinde hazır ve eğitimli olabilmeleri için zorunlu askerliğe tabi tutulmalıdır."
 PHI_manila_tag_tt:0 "§Y[PHI.GetName]§!, §YFilipinler§! olarak bilinecek!"
 PHI_marine_corps:0 "Deniz Piyadeleri"
 PHI_marine_corps_desc:0 "Bir kıyıya inip çıkma konusunda büyük bir deneyime sahibiz, topluluğumuzdaki birçok insan iş için veya ailelerini görmek için adalar arasında feribotlara binmek veya sadece kürek çekmek zorunda kalıyor. Bu deneyimi kullanabilir ve bunu, yabancı veya yerli herhangi bir kıyıya savaşı taşıyabilecek askerlere sahip, dünyanın önde gelen deniz piyadeleri birliğine odaklayabiliriz."
 PHI_maritime_communism:0 "Deniz Komünizmi"
 PHI_maritime_communism_desc:0 "Birçok Komünist devlet halkının karadaki askeri kitle hareketlerine doğru seferber edilmesine odaklanırken, biz bunun yerine deniz gücümüzün kitle seferberliğini kullanmalı ve bu denizden gelen orduyu dünya okyanuslarına salmalı ve böylece herkesi Deniz Komünist Hareketi altında birleştirmeliyiz."
 PHI_mariveles_naval_base:0 "Mariveles Deniz Üssü"
 PHI_mariveles_naval_base_desc:0 "Manila temel deniz tesislerine sahip, ancak çok daha fazlası için potansiyeli var. Yapmamız gereken ilk şey, körfezin Bataan tarafında bulunan Mariveles Deniz Üssü'nü genişletmektir. Bu derin su limanı, deniz varlıklarının üretimi ve bakımı için daha önemli tesisleri barındırabilir."
 PHI_militarize_the_constabulary:0 "Kolluk Kuvvetlerini Askerileştir"
 PHI_militarize_the_constabulary_desc:0 "Filipin Kolluk Kuvvetleri, Milli Savunma Yasası ile merkezi Filipin Ordusu ile birleştirilmişti, ancak geriye dönüp bakıldığında, yerini alması için bırakılan polis güçlerinin yetersiz kaldığı kanıtlandığı için bu bir hata olabilir. Bunun yerine Kolluk Kuvvetlerini yeniden kurmalı ancak onları askeri silahlar ve eğitimle donatmalıyız, böylece hem ulusumuza hizmet edebilir hem de onu koruyabilirler."
 PHI_military_emergency_flag:0 "Askeri Olağanüstü Hal İlan Edildi"
 PHI_military_requisitions:0 "Askeri Talepler"
 PHI_military_requisitions_desc:0 "Askeri gücün bu hızlı genişlemesini gerçekten kolaylaştırmak için, Amerika Birleşik Devletleri'ndeki ikmal depolarından önemli miktarda silah ve teçhizat deposu talep etmemiz gerekiyor. Bu, Amerikan askeri donanımının en iyileriyle donatılmış sağlam bir savaş gücünü sürdürmemizi sağlayacaktır."
 PHI_mindanao_transport:0 "Mindanao Ulaşımı"
 PHI_mindanao_transport_desc:0 "Filipin takımadalarının en büyük ikinci adası olmasına rağmen, kuzeydeki muadili Luzon'daki yatırım seviyesine asla yaklaşamamıştır. Bu ihmali gidermeliyiz!"
 PHI_mineral_prospecting:0 "Maden Arama"
 PHI_mineral_prospecting_desc:0 "Bazıları maden aramalarımızda son derece şanslı olduğumuzu, büyük altın yataklarına kolayca rastladığımızı söyleyebilir. Ancak, İspanyol İmparatorluğu'nun çok geç fark ettiği gibi, bir ekonominin tek bir kaynağa bu kadar bağımlı olması tehlikelidir. Diğer minerallerin keşfine daha fazla kaynak ayırmalıyız. Toprağımızın hala neler sakladığını kim bilebilir?"
 PHI_modernization:0 "Modernizasyon"
 PHI_modernization_desc:0 "Endüstriyel çabalarımız çok uzun süredir diğer Asya uluslarının gerisinde kaldı. Artık bağımsızlığımıza sahip olduğumuza göre, potansiyelimizi dünyaya göstermeli ve ekonomimizin makineleşmesini ilerletmek isteyenlere kaynak ve düzenleyici alan sağlamalıyız."
 PHI_mosquito_fleet:0 "Sivrisinek Filosu"
 PHI_mosquito_fleet_desc:0 "Tek bir torpido veya tek bir mermi, tek bir gemiyi hedef alıp batırabilir. Bu nedenle, sadece tek bir gemiye değil, koca bir sürüye sahip olmalıyız. Birini, onunu, hatta yüzünü alabilirler ama hepimizi batıramazlar! Daha da kötüsü, sadece bizim atışlarımızdan birinin bile isabet etmesi yetecektir ve sürümüzle ıskalamamız pek mümkün değil."
 PHI_national_confederation:0 "Milli Konfederasyon"
 PHI_national_confederation_desc:0 "İktidara yükseldiğimize göre, yerimizi sağlamlaştırmaya başlama zamanı. Kalipunang Pambansa ng Magbubukid sa Pilipinas (Filipinler'deki Köylülerin Milli Konfederasyonu), önde gelen köylü örgütü olarak bu amaçla yaklaşacağımız ilk kişiler arasında olmalıdır."
 PHI_national_defense_act:0 "Milli Savunma Yasası"
 PHI_national_defense_act_desc:0 "Milli Savunma Yasası 21 Aralık 1935'te kabul edildi ve bununla birlikte Filipinler silahlı kuvvetlerine 16.000.000 peso tahsis edildi. Geriye kalan tek şey, bu meblağın nasıl ve nereye harcanacağını belirlemek. Ordunun her kolu yatırım için haykırıyor, güvenliğimiz için kritik olan savunmalar da öyle."
 PHI_national_fiscal_policy:0 "Milli Maliye Politikası"
 PHI_national_fiscal_policy_desc:0 "Ulusumuz bağımsızlık yolunda emin adımlarla ilerlerken, yapmamız gereken ilk şeylerden biri maliyemizi Birleşik Devletler'inkinden ayırmak, bütçemizi geliştirmek ve bu fonları vergiler yoluyla toplamanın yollarını bulmaktır."
 PHI_nationality_act:0 "Vatandaşlık Yasası"
 PHI_nationality_act_desc:0 "[USA.GetNameDefCap], Filipinliler ve Amerika Birleşik Devletleri'ndeki statüleri de dahil olmak üzere mevcut vatandaşlık yasalarını revize eden Vatandaşlık Yasası'nı yürürlüğe koyuyor. Yasa, Filipinlilerin ABD vatandaşı değil, ABD uyruklu olarak tanındığını açıklığa kavuşturuyor ve [USA.GetNameDef] içinde yaşamalarına ve çalışmalarına izin veriyor ancak vatandaşlığın tam haklarına sahip olamıyorlar."
 PHI_off_shore_patrol:0 "Açık Deniz Devriyesi"
 PHI_off_shore_patrol_desc:0 "Hava kuvvetlerimiz gökleri hem kara hem de deniz üzerinde eşit şekilde koruyabilmelidir. Bu nedenle, bir işgalciyi kıyılarımızı bile göremeden vurabilmemiz için daha uzun menzile ve gemisavar kabiliyetlerine sahip uzman deniz uçaklarına hizmet vermeliyiz."
 PHI_offshore_patrol:0 "Açık Deniz Devriyesi"
 PHI_offshore_patrol_desc:0 "Milli Savunma Yasası ayrıca Filipin takımadalarının denizden korunmasına yönelik hükümler de içeriyordu. Bunun tam teşekküllü bir açık deniz filosu olması beklenmiyor, daha ziyade ana kıyılarımızın korunması etrafında inşa edilmiş bir filo olması bekleniyor. Bu, bunun daha baskın bir filo için sadece ilk adım olamayacağı anlamına gelmez."
 PHI_one_observer_advisor_focus_tt:0 "§Y$PHI_japanese_advisors$§! ve §Y$PHI_japanese_observers$§! hedeflerinden birini tamamlamanın etkisi:"
 PHI_open_borders:0 "Açık Sınırlar"
 PHI_open_borders_desc:0 "Bana yorgun, fakir, özgür nefes almaya hasret kalabalıklarınızı verin. [USA.GetAdjective] göçü sınırlama girişimlerine rağmen, kendi sınırlarımızın kontrolü bizde. Kendimizi savaş, ırk, din veya başka herhangi bir nedenle zulüm görenler için güvenli bir sığınak olarak kurmaya çalışmalıyız."
 PHI_pan_pacific_trade_union_secretariat:0 "Pan Pasifik Sendikalar Sekreterliği"
 PHI_pan_pacific_trade_union_secretariat_desc:0 "Komünizmin faydalarından kendimiz ve halkımız için yararlanmış olsak da, bu hareketin izole ve içe dönük kalması doğru bir yol değildir. Felsefemizi ve onu tezahür ettirme araçlarını Güneydoğu Asya'daki diğer katılımcılara ihraç etmeli ve böylece karşılıklı korumamız ve evrimimiz için Pan Pasifik Sendikalar Sekreterliği'ni kurmalıyız."
 PHI_partido_komunista_ng_pilipinas_coup:0 "Partido Komunista ng Pilipinas Darbesi"
 PHI_partido_komunista_ng_pilipinas_coup_desc:0 "Çiftçiler arasında genel bir grev olarak başladı ve fabrikalardaki yoldaşlarına yayıldı. Halk konuştu ve Ulusal Meclis Komünist davasına düştü. Şimdi sendikalar ve kolektifler yeni bir merkez komitesi seçmek ve en önemlisi yeni Genel Sekreter olarak kimin duracağını belirlemek için çabalıyor."
 PHI_pearl_of_the_orient_seas:0 "Doğu Denizlerinin İncisi"
 PHI_pearl_of_the_orient_seas_desc:0 "İlk İspanyol Kaşifler tarafından yeni keşfettikleri toprakları tanımlamak için romantize edilen bu tanım, yine de kalıcı oldu ve doğruluğunu koruyor. Adalarımızın başına gelen tüm sıkıntılara ve trajedilere rağmen, sadece buradan topladığımız incilerle boy ölçüşebilecek büyük bir güzellik diyarı olmaya devam ediyoruz."
 PHI_peg_the_peso_to_the_dollar:0 "Pesoyu Dolara Sabitle"
 PHI_peg_the_peso_to_the_dollar_desc:0 "Para birimimiz, değerinin bir belirteci olarak ABD Dolarına bağlanmalıdır; bu, para birimimize gerçek bir değer temeli verir ve ticaretin kurulması için güvenilir bir temel sağlar."
 PHI_permanent_usa_air_bases:0 "Kalıcı [USA.GetAdjective] Hava Üsleri Kuruldu"
 PHI_permanent_usa_land_bases:0 "Kalıcı [USA.GetAdjective] Kara Üsleri Kuruldu"
 PHI_permanent_usa_naval_bases:0 "Kalıcı [USA.GetAdjective] Deniz Üsleri Kuruldu"
 PHI_petition_the_supreme_court:0 "Yüksek Mahkemeye Dilekçe Ver"
 PHI_petition_the_supreme_court_desc:0 "Komünizm 1932'de Yüksek Mahkeme tarafından resmen yasaklandı, ancak hareketi bir kez daha yasallaştırabilecek teknik bir ayrıntıya rastladık, sadece bunu yapmak için dilekçeyi imzalamamız ve sunmamız gerekiyor."
 PHI_philippine_air_force:0 "Filipin Hava Kuvvetleri"
 PHI_philippine_air_force_desc:0 "Hava kuvvetlerinin ordudan ayrı, kendi varlığı olarak tanınma zamanı geldi. Böylece organize olduklarında, organizasyonlarında ve insan ile materyal ediniminde çok daha fazla esnekliğe sahip olacaklar. Artık tek bir servisin ihtiyaçlarına bağlı kalmayacaklar, bunun yerine bütünün hizmetinde uçabilecekler."
 PHI_philippine_american_educational_foundation:0 "Filipin-Amerikan Eğitim Vakfı"
 PHI_philippine_american_educational_foundation_desc:0 "[USA.GetNameDef] ile olan çok yakın bağlantılarımız sayesinde çeşitli akademik bağlar oluşturduk. İki ulusumuz arasında iki uluslu araştırma, kültürel anlayış ve açık fikir alışverişini teşvik etmeyi amaçlayan yabancı değişim burs programlarını yönetmekten sorumlu bir organizasyon kurmalıyız."
 PHI_philippine_army_orchestra:0 "Filipin Ordusu Orkestrası"
 PHI_philippine_army_orchestra_desc:0 "Filipin Kolluk Kuvvetleri Bandosu, dünyanın önde gelen askeri bandolarından biridir ve bir ABD Başkanının yemin töreninde çalma onuruna erişmiştir. Müziğin gücünü askerlerimiz için daha iyi kullanmak, onun canlandırıcı enerjisini milli zindeliği aşılamak ve onları daha büyük kahramanlıklar sergilemeye teşvik etmek için bandoyu orduya entegre etmeliyiz."
 PHI_philippine_division:0 "Filipin Tümeni"
 PHI_philippine_division_desc:0 "Filipin tümeni adalarımızın savunmasıyla görevlendirilmiştir, ancak teçhizatı yetersizdir ve personel eksikliği vardır. Liderlik konusunda dış uzmanlık aramalı ve birliklerimiz için daha modern silahlara ve teçhizata sahip olduğumuzdan emin olmalıyız."
 PHI_philippine_military_academy:0 "Filipin Askeri Akademisi"
 PHI_philippine_military_academy_desc:0 "Yıllardır Filipinler Jandarma Akademisi ulusumuzda merkezi subay eğitim okulu olarak hizmet verdi ancak resmi bir askeri eğitim yerinden yoksunduk. Bu kurumu orduya dahil etmeli ve onu resmen yarının askeri elitlerinin eğitimine ve gelişimine adanmış yeni Filipin Askeri Akademisi olarak belirlemeliyiz."
 PHI_philippine_naval_patrol:0 "Filipin Deniz Devriyesi"
 PHI_philippine_naval_patrol_desc:0 "Uluslararası sahnede, özellikle de çok sayıda adadan oluşan bir ulus olarak düzgün bir şekilde tanınmak için filomuz kıyılarımızı koruma konusunda tam kapasiteli olmalıdır. Onu bu boyuta ve yeteneğe büyütmek için, komuta ve kontrol sistemlerimizi modern bir filodan beklenenlerle uyumlu olacak şekilde geliştirmeye ve güncellemeye çalışmalıyız."
 PHI_philippine_scouts:0 "Filipin İzcileri"
 PHI_philippine_scouts_desc:0 "1901'de kurulan Filipin İzcileri teşkilatı, ordumuzda görev yapan en büyük Filipinli birliğini oluşturmaktadır ve bu birimi desteklemeye devam etmeli, anavatanımızı korumakla görevli uzman güç rolünü yerine getirmeleri için onlara mümkün olan en iyi eğitimi ve teçhizatı sağlamalıyız."
 PHI_pilot_training_programme:0 "Pilot Eğitim Programı"
 PHI_pilot_training_programme_desc:0 "Pilotlar son derece önemli bir kaynaktır ve havacılık endüstrimizin kötü durumu göz önüne alındığında onlardan yana ciddi bir kıtlığımız var. Gençlerimizin bu yüksekten uçan mesleğe eğitilmesine izin vermek için diğer uluslarla anlaşmalar yapmalıyız."
 PHI_police_chief_eisenhower:0 "Polis Şefi Eisenhower"
 PHI_police_chief_eisenhower_desc:0 "Yeni planlanan başkentimiz Quezon City kurulduğunda, [PHI.GetLeader] yüksek profilli bir Polis Şefine ihtiyacı olacağını belirledi. Başkan, Dwight D. Eisenhower ile harika bir çalışma ilişkisine sahipti ve doğru teşviklerle görevi üstlenmeye ikna edilebileceğine ve böylece onu kalıcı olarak Filipin davasına bağlayabileceğine inanıyor."
 PHI_polynesia_tag_tt:0 "§Y[PHI.GetName]§! yeni bir bayrak ve isim kazanacak."
 PHI_preemptive_strikes:0 "Önleyici Saldırılar"
 PHI_preemptive_strikes_desc:0 "Her yerde düşmanlar var ve etrafımız sarılı. Bu nedenle, kaçınılmaz olana hazırlanmalıyız. Daha da iyisi, kaçınılmaz olanın artık kaçınılmaz olmaması, aksine atlatılması için ilk biz saldırmaya hazırlanmalıyız. Sonuçta, güvende olmamızın tek yolu, bize saldıracak kimsenin kalmamasıdır."
 PHI_pro_hacendados:0 "Hacendado Yanlısı"
 PHI_pro_hacendados_desc:0 "İspanyol sömürge döneminden miras kalan zengin, toprak sahibi seçkinler, Filipinler içinde önemli bir nüfuz ve zenginlik gücü olmaya devam ediyor. Bu eski ailelere kur yapmalı ve statükonun devamı karşılığında onların himayesini kazanmalıyız."
 PHI_pt_boat_development:0 "PT Bot Geliştirme"
 PHI_pt_boat_development_2_tt:0 "§YDevriye Botları§! için §G+20%§! Ustalık Kazanma Hızı."
 PHI_pt_boat_development_desc:0 "Büyük bir adalar topluluğu olan ulusumuz, daha büyük düşmanları taciz etmek ve alt etmek için takımadaların dar su yollarına girip çıkabilen daha küçük gemileri kullanmakla daha iyi hizmet edecektir. Torpido botu doktrinlerinde uzmanlık satın almalı ve bunu Devriye Botları olarak adlandırılacak kendi özel deniz varlıklarımızı geliştirmek için kullanmalıyız."
 PHI_pt_boat_development_tt:0 "§YPerdeleme Gemileri§! için §G+10%§! Ustalık Kazanma Hızı."
 PHI_quezon_city:0 "Quezon City"
 PHI_quezon_city_campus:0 "Quezon City Kampüsü"
 PHI_quezon_city_campus_desc:0 "Tıpkı ulusumuzun geleceğini planladığımız, geleceğin şehrini planlayıp inşa ettiğimiz gibi, aynı şekilde Filipinli vatandaşlarımızın geleceğini de düşünmeli ve bu yeni kurulan şehirde eğitim mükemmelliğinin gelişmesi için alan sağlandığından emin olmalıyız."
 PHI_quezon_city_desc:0 "Manila başkent olarak bize iyi hizmet etti, ancak aşırı kalabalık, konut eksikliği, yetersiz sanitasyon ve tıkanıklık gibi ciddi sorunlarla boğuşuyor. İhtiyacımız olan şey, başkentimiz olarak hizmet etmek üzere baştan planlanmış bir şehirdir ve bunu inşa etmek ve geliştirmek yıllar, hatta on yıllar alacak olsa da, şimdi başlamalı ve öngörümüzün meyvelerini daha sonra toplamalıyız!"
 PHI_rally_the_fisherfolk:0 "Balıkçıları Topla"
 PHI_rally_the_fisherfolk_desc:0 "Bir takımada olarak balıkçılık endüstrimiz büyük ve iyi insan gücüne sahip. Bu nedenle, denizin bu köylülerine bakmalı ve onları Komünist hareketine uyandırmalı ve sundukları denizcilik potansiyelinden yararlanmalıyız."
 PHI_rebuild_sakdalistas:0 "Sakdalistaları Yeniden İnşa Et"
 PHI_rebuild_sakdalistas_desc:0 "2 Mayıs 1935 gecesi, 65.000 kısmen silahlı köylü, Amerikan destekli hükümetten iktidarı ele geçirme girişiminde bulunarak Filipinler'in huzurlu barışını bozdu. Bu çaba başarısız oldu, ancak kentsel zenginler ve kırsal yoksullar arasında artan servet eşitsizliğine duyulan öfke yüzeyin altında kaynamaya devam ediyor, dizginlenmeyi bekliyor."
 PHI_reconciliation_with_spain:0 "İspanya ile Uzlaşma"
 PHI_reconciliation_with_spain_desc:0 "[ReconciliationWithSpain]"
 PHI_reconciliation_with_spain_loser:0 "Gönüllülerimiz onlara karşı savaşsa da, İspanyol hükümeti aramızdaki ortak kültürel ve teolojik bağları isteksizce kabul etti ve bunları İspanyol dünyası birliğini vurgulayan propagandalarına dahil etmeyi uygun gördü."
 PHI_reconciliation_with_spain_neutral:0 "İspanya'nın ulusumuzun gelişimi üzerinde tartışılmaz bir etkisi olmuştur, ancak yakın tarihimizin çoğu sömürge bağlarımız nedeniyle düşmanca olmuştur. Bununla birlikte, onlarla daha fazla ortak noktamız olduğu inkar edilemez, sadece eşit bir zeminde buluşmamız gerekiyor."
 PHI_reconciliation_with_spain_winner:0 "Muzaffer İspanyol hükümetiyle birlikte savaşan gönüllülerimiz uluslarımız arasında yeni, daha güçlü bağlar kurdu ve gelecekte uluslarımızı birbirine hizalamak için bunlardan daha resmi bir kapasitede yararlanmalıyız."
 PHI_reconquista:0 "Reconquista"
 PHI_reconquista_desc:0 "Luzon dağlarından Mindanao ormanlarına kadar halkımız işgal altında kanadı ve dayandı. Şimdi, toprağımızı, şehir şehir, ada ada geri alma zamanı geldi. Tıpkı atalarımızın fatihlere direndiği gibi, şimdi işgalciyi kovmak ve ulusumuzu geri getirmek için savaşıyoruz. Bu bizim Reconquista'mız - Filipinler için son mücadele."
 PHI_reduce_unneccessary_expenditure:0 "Gereksiz Harcamaları Azalt"
 PHI_reduce_unneccessary_expenditure_desc:0 "Artık milli bir maliye politikamız olduğuna göre, defterlerin düzgün bir şekilde dengelendiğinden emin olmamız gerekiyor. Bunu vergileri artırarak veya vergi kaçıranların peşine düşerek değil, gereksiz fazlalıkları atarak başarmak istiyoruz. Sonuçta, bu hizmetleri zaten sunmuyorsak, kim eksikliğini hissedecek?"
 PHI_rehabilitation_finance_corporation:0 "Rehabilitasyon Finans Kurumu"
 PHI_rehabilitation_finance_corporation_desc:0 "Ulusumuz harabe şehirlerden ve bombalanmış yollardan, yok edilmiş endüstriyel komplekslerden ve sabote edilmiş demiryollarından önemli hasarlar aldı. Yeniden inşa etmek zaman ve para alacak, ancak ulusumuz için yeniden inşa etmemenin maliyeti daha da dramatik olacaktır."
 PHI_reino_de_filipinas:0 "Reino de Filipinas"
 PHI_reino_de_filipinas_desc:0 "Tüm taşlar yerine oturuyor ve İspanya'nın kendisi iç çatlaklarla parçalanırken, Filipinler Hispanik dünyasının kalbi olmak için yükseldi. Konumumuzu sağlamlaştırmak için sadece taç giyme törenine ihtiyacımız var, bu tarihimizdeki en önemli an olacak."
 PHI_resolve_interregnum_tt:0 "§GBu, Fetret Devri'ni çözecek ve yeni bir liderin atanmasına izin verecektir.§!"
 PHI_return_of_the_exiles:0 "Sürgünlerin Dönüşü"
 PHI_return_of_the_exiles_desc:0 "Sol eğilimli bir dizi önemli kişi, sömürgeci, kapitalist dilimlerin tehdidi altında Güneydoğu Asya'daki evlerinden zorla çıkarıldı. Sınırlarımızı onlara açabilir ve güvenli bir sığınak vaadi sunabiliriz."
 PHI_reunite_madagascar:0 "Madagaskar'ı Yeniden Birleştir"
 PHI_reunite_madagascar_desc:0 "Büyük farklılıklarla ayrılmış olsalar da, yerli Madagaskar halkı karışık Avustronezya-Afrika kökenlidir, yani kendi halkımızla şaşırtıcı derecede yakın bağları vardır. Aramızdaki bu mesafeyi kapatmalıyız."
 PHI_revision_of_taxation_laws:0 "Vergi Yasalarının Revizyonu"
 PHI_revision_of_taxation_laws_desc:0 "Artık Amerika Birleşik Devletleri'nden ayrıldığımıza göre, kendi vergi kanunumuzu geliştirmemiz, böylece vergi tabanımızı büyütmemiz ve altyapı, refah, ordu ve diğer büyüme planları gibi devlet hizmetlerine yeniden yatırılabilecek hükümet gelirlerinde bir artışa yol açmamız gerekiyor."
 PHI_revolutionary_regrets:0 "Devrimci Pişmanlıklar"
 PHI_revolutionary_regrets_desc:0 "İspanya yönetiminde, her zaman İspanyol tebaası veya vatandaşıydık, ancak şimdi Amerika Birleşik Devletleri yönetiminde, ihracatları için sadece bir tüketici pazarıyız, hatta parya değilsek bile, çünkü bizi asla Amerika Birleşik Devletleri'nin herhangi bir eyaletinin vatandaşı yapmadılar."
 PHI_royal_exiles:0 "Kraliyet Sürgünleri"
 PHI_royal_exiles_desc:0 "İspanyol monarşisi, hem zorunlu hem de gönüllü bir dizi feragat ve mirastan mahrum bırakma yaşadı, ancak aile hala ortalıkta ve sığınacak yer arıyor. Onlara sığınak sunarak Hispanik dünyasında büyük bir prestij kazanabiliriz."
 PHI_sakdalista_exiles_returned_flag:0 "Sakdalista Sürgünleri Geri Döndü (Olay)"
 PHI_san_miguel:0 "San Miguel"
 PHI_san_miguel_desc:0 "1890 yılında İspanyol Kraliyet Fermanı ile kurulan San Miguel bira fabrikası, o zamandan beri olağanüstü Alman tarzı bira üretmiştir. Şimdi nüfusumuz giderek zenginleşirken ve küresel talep artarken, bu tanınmış içecek kurumunu genişletmeye çalışmalıyız. Daha iyi bir dünyaya şerefe."
 PHI_sanction_piracy:0 "Korsanlığa İzin Ver"
 PHI_sanction_piracy_desc:0 "Takımada ulusumuz çok sayıda küçük gemiye ve girişimci gence ev sahipliği yapıyor ve bu nedenle, bu korsan bireylerin düşmanlarımıza saldırmaları ve yeni elde ettikleri deniz ödülleriyle koylarına geri kaçmaları için yasal temel sağladığımız eski 'Mark Mektupları' sisteminden yararlanmamamız suç olurdu."
 PHI_sea_of_cobalt:0 "Kobalt Denizi"
 PHI_sea_of_cobalt_desc:0 "Bana yeterince nükleer silah verin, hiçbir düşmanın bize ulaşmak için içinden geçemeyeceği bir kobalt denizi yaratayım."
 PHI_second_philippine_republic:0 "İkinci Filipin Cumhuriyeti"
 PHI_second_philippine_republic_desc:0 "Henüz başarılmamış olsa da, bağımsızlık arayışımız giderek yaklaşıyor. Bir sonraki adım, ayrılığımızı resmen teşvik etmek için yeni bir cumhuriyet yaratmak ve oradan yeni hükümetimizin süsleri - ve tabii ki yeni bir bayrak - üzerinde çalışmaya başlamaktır."
 PHI_second_republic_tag_tt:0 "§Y[PHI.GetName]§!, §Yİkinci Filipin Cumhuriyeti§! olarak bilinecek!"
 PHI_secure_japanese_guarantees:0 "Japon Garantilerini Güvence Altına Al"
 PHI_secure_japanese_guarantees_desc:0 "Amerika Birleşik Devletleri'nden bağımsızlığımızı gerçekten hızlandırmak istiyorsak, o zaman çok gerçek savaş ihtimaline hazırlanmalıyız çünkü kölelerinin kolayca gitmesine izin vermeleri pek olası değil. Japonya'daki sponsorlarımıza ulaşmalı ve düşmanlık durumunda daha resmi askeri destek sağlamalıyız."
 PHI_self_reliance_defense:0 "Kendi Kendine Yeten Savunma"
 PHI_self_reliance_defense_desc:0 "Ulusumuzu korumak için diğer ulusların katkılarına aşırı derecede bel bağladık, ancak bu ciddi bir stratejik zayıflığı ortaya çıkardı. Kendimizi korumak için kendi araçlarımızı yaratmalıyız ve bu, yeni doğan güçlerimizi ihtiyaç duydukları her türlü materyalle destekleyebilecek bir sanayi tabanının geliştirilmesiyle başlar."
 PHI_send_a_share_of_THIS_navy_to_ROOT_tt:0 "[THIS.GetAdjective] donanmasının bir kısmını [ROOT.GetNameDef] devletine gönder."
 PHI_slippery_slope:0 "Kaygan Yokuş"
 PHI_slippery_slope_desc:0 "Ulusumuz üzerindeki artan Japon etkisi, hoşnutsuzluk kıvılcımını ateşlemeye başladı. Tek yapmamız gereken geri çekilip, yozlaşmış demokratik, kapitalist sisteme özgü açgözlülüğe karşı öfkenin patlamasını ve geride daha radikal ideolojilerin doldurmaktan mutluluk duyacağı bir boşluk bırakmasını izlemek."
 PHI_small_arms_and_artillery_requisition:0 "Hafif Silah ve Topçu Talebi"
 PHI_small_arms_and_artillery_requisition_desc:0 "Temel ihtiyaçlar ulaşmış olsa da, burada topladığımız gücü düzgün bir şekilde donatmak için, büyük ve küçük her kalibrede çok daha fazla silah talep etmemiz gerekiyor."
 PHI_smugglers:0 "Kaçakçılar"
 PHI_smugglers_desc:0 "Ulusumuz, halkımızın nesillerdir malları resmi makamların erişimi dışına kaçırmak için kullandığı çok sayıda gizli köşe ve bucak sunan çok sayıda ada ve adacıktan oluşmaktadır. Bu deneyimi kullanmalı ve avantajımıza çevirmeliyiz!"
 PHI_soldiers_in_hiding:0 "Saklanan Askerler"
 PHI_soldiers_in_hiding_desc:0 "[PHI.GetNameDef] içindeki savaşı resmen kaybetmiş olsak da, savaş bitmedi. Çok sayıda askerimiz teslim olma emrine uymadı ve saklanırken mücadeleye devam etti. Meydan okumaya göğüs geren ve çevrelerinde direniş birimleri genişletmeye başlayan bir dizi istisnai subay tanıyoruz - ve başarıları için elimizden gelen her şeyi sağlamalıyız."
 PHI_spanish_refugees:0 "İspanyol Mülteciler"
 PHI_spanish_refugees_desc:0 "Memleketlerindeki iç savaşın tahribatıyla, birçok İspanyol vatandaşı başka yerlere sığındı. Kendimiz ve İspanyol muadillerimiz arasındaki ilişkilerin ısınmasıyla, önemli sayıda insanları takımadalarımıza sığındı."
 PHI_struggle_conference:0 "Mücadele Konferansı"
 PHI_struggle_conference_desc:0 "Komünist hareketimiz çok sayıda farklı çatışma ve gerilimle uğraşmak zorunda ve bunlara vereceğimiz tepkinin daha organize, resmi bir tepkiye ihtiyacı var. Bu nedenle, liderlerimizi tüm bu sorunların masaya yatırıldığı ve çözüldüğü ilk Mücadele Konferansı'nda bir araya getirmemiz gerekiyor."
 PHI_subject_surrender:0 "Bağlı Devlet... Teslim Ol"
 PHI_subject_surrender_desc:0 "'Bu kuvvetlerin garnizonunun sonunda hava ve topçu bombardımanı ve bizi ezen tanklarla desteklenen piyadeler tarafından yok edileceği anlaşıldı.' Bu, son sığınaklarımızdan birinden gelen yayındı ve bununla birlikte [PHI.GetNameDef] kontrolünü kaybettiğimiz açık."
 PHI_subject_surrender_tt:0 "§R[327.GetName]'nin tüm durumu üzerindeki kontrolü kaybetmek, bu odaklanmayı tamamlayacaktır.§!"
 PHI_submarine_supplies:0 "Denizaltı İkmalleri"
 PHI_submarine_supplies_desc:0 "Yurtdışından destek almayı çok zorlaştıran kapsamlı bir düşman deniz varlığı var. Gizli destek sağlamak için bazı denizaltılar talep edebiliriz; takımadalarımızda çok sayıda saklanma yeri ve malzemeleri ihtiyaç duyulan adalara taşımaya istekli birçok balıkçı var."
 PHI_subordinate_philippine_department:0 "Bağlı Filipin Departmanı"
 PHI_subordinate_philippine_department_desc:0 "Filipin Departmanı, USAFFE kurulmadan önce Filipinler'deki Birleşik Devletler askeri varlığıydı. Komuta yapıları eski olsa da, yerli Filipinli birlikleri Amerikan komuta ve kontrolü altına daha kolay getirmek için güncellenmeli ve modernize edilmelidir."
 PHI_subsidies:0 "Sübvansiyonlar"
 PHI_subsidies_desc:0 "Para kazanmak için para gerektiği bir sermaye gerçeğidir. Bütçemizi, hızlı bir geri dönüş göreceğimiz sektörlere nakit enjekte etmek için kullanmalıyız. Endüstriyel çabalara ve zengin ancak ulaşılması zor kaynakları ve nüfusları daha erişilebilir hale getirmek için altyapıyı genişletmeye yönelik hedefli sübvansiyonlar sağlamalıyız."
 PHI_sugar_barons:0 "Şeker Baronları"
 PHI_sugar_barons_desc:0 "Şeker, tüm Filipin ekonomisinin dayandığı temeldir. Bu zengin kaynak olmadan, ulusumuzun refahı bir gecede yok olurdu. Bu kritik ürünü yetiştiren ve ihraç edenleri teşvik etmeli, böylece bize daha fazla tatlı, tatlı para kazandırmalıyız."
 PHI_sugar_barons_tt:0 "§YRastgele bir General§! §G+2§! planlama becerisi kazanacak"
 PHI_sugar_barons_unlock_tt:0 "§YŞeker Tüketim Vergisi Kararlarının Kilidini Açar§!"
 PHI_sunset_empires:0 "Batan Güneş İmparatorlukları"
 PHI_sunset_empires_desc:0 "Bize yönelik en büyük tehdit Yükselen Güneş İmparatorluğu ve Güneşin Asla Batmadığı İmparatorluktur. Bu nedenle, gölgede savaşabilmemiz için yeterli mermiye sahip olduğumuzdan emin olmalıyız."
 PHI_support_for_chinese_communists:0 "Çinli Komünistlere Destek"
 PHI_support_for_chinese_communists_desc:0 "Komünistler Çin'deki mücadelelerine hem Japon akınlarına hem de Çinli savaş ağalarına karşı devam ediyorlar. Sarı Nehir boyunca onlara insan ve malzeme kaçırma fırsatımız var, ya mücadelelerini doğrudan desteklemek ya da sadece bölgedeki çatışma alevlerini körüklemek için yakıt sağlamak."
 PHI_take_pacific_islands:0 "Pasifik Adalarını Al"
 PHI_take_pacific_islands_desc:0 "Filipinler zaten bir adalar ülkesi, bu yüzden haklı sınırlarımızı Pasifik boyunca daha doğuya uzatmak hayal gücünü biraz zorlamayı gerektiriyor."
 PHI_textile_mills:0 "Tekstil Fabrikaları"
 PHI_textile_mills_desc:0 "Şu anda daha endüstriyel bir ekonomiye doğru büyük bir atılımın ortasındayız ve bunun omurgası tekstil endüstrisidir. Temel ihtiyaçları kendimiz üretebilirsek, o zaman bir daha asla dış etkiye bağımlı veya savunmasız olmayacağız."
 PHI_thalassocracy:0 "Talassokrasi"
 PHI_thalassocracy_desc:0 "'Devlete Sahip Ordu' kavramı iyi bilinir ve Prusya için sıkça övülür. Biz ise, yetenekleri İngilizlerin güçlerinin zirvesindeki halini bile gölgede bırakan bir filoya sahip, 'Devlete Sahip Donanma' olmaya çalışmalıyız."
 PHI_thats_not_an_island:0 "O Bir Ada Değil!"
 PHI_thats_not_an_island_desc:0 "Takımadalarımız bize büyük bir esneklik sağlasa da, bunun bazı sınırlamaları var. Örneğin, ana adalarımızdan uzakta operasyonlar yapmak istersek ne olur? O zaman, o adalardan birini yanımıza almamız ve böylece dünyanın neresinde ihtiyaç duyulursa duyulsun vurma operasyonel yeteneğine sahip olmamız gerekecek."
 PHI_the_concrete_battleship:0 "Beton Zırhlı"
 PHI_the_concrete_battleship_desc:0 "Manila Körfezi'nin liman tahkimatlarının en etkileyicisi olan Fort Drum, bir savaş gemisini andırmaktadır. İnşaatına 1909'da başlanmış ve kariyeri boyunca silahlanma ve destek yapılarında yükseltmeler almıştır. USS No-Go olarak sevgiyle bilinen bu saygıdeğer tahkimat, bu yeni modern savaş çağında bir kez daha göreve çağrılıyor."
 PHI_the_cry:0 "Çığlık"
 PHI_the_cry_desc:0 "Pugad Lawin Çığlığı, İspanyol İmparatorluğu'na karşı Filipin Devrimi'nin başlangıcını işaret eden toplanma çağrısıydı. Bu, özgürlüğümüz, hatta varlığımız için başka bir savaş, bu yüzden bir kez daha çığlığımızı yükseltmenin ve savaşmanın zamanı geldi!"
 PHI_the_hunters:0 "Avcılar"
 PHI_the_hunters_desc:0 "Filipin Askeri Akademisi'nden öğrenciler, işgalciler kurumu kapattığında saklanmak üzere kaçtılar. O zamandan beri 'Avcılar'ı kurmaya devam ettiler ve becerilerini iyi bir şekilde kullandılar, yerel halkı savaş teknikleri ve istihbarat toplama konusunda eğittiler ve savaşı Manila çevresindeki düşmanlarımıza aktif olarak getirdiler."
 PHI_the_red_sun_over_manila:0 "Manila Üzerindeki Kızıl Güneş"
 PHI_the_red_sun_over_manila_desc:0 "Filipinler genelinde komünist duyarlılık artıyor ve ilk kez gerçek iktidarı ele geçirmek için geçici bir fırsat ortaya çıktı. Başarısız Sakdalisa ayaklanması, Amerikan destekli hükümete karşı silahlı ayaklanmanın beyhudeliğini hatırlatıyor ve bunun yerine iktidarı ele geçirmek için daha siyasi bir yol aramalıyız."
 PHI_the_sun_has_set:0 "Güneş Battı"
 PHI_the_sun_has_set_desc:0 "İngilizler uzun zamandır Birleşik Devlet- Filipinler için bir tehdit olmuştur. 1779'da onları ezdik ve bunun için bizi asla affetmediler. Onlara dünyadaki yerlerini hatırlatmamızın zamanı geldi."
 PHI_traitors_back_home:0 "Evdeki Hainler"
 PHI_traitors_back_home_desc:0 "[USA.GetNameDef] zayıf ve korkak hale geldi. Orada kimse yapılması gerekeni yapmak istemiyor, bu yüzden politikacıların ve korkakların saflarını temizlemek ve Bir Tepedeki Parlayan Şehri Amerikan halkı için geri almak bize düşüyor."
 PHI_treaty_of_manila:0 "Manila Antlaşması"
 PHI_treaty_of_manila_desc:0 "[IndependentOrNot]"
 PHI_treaty_of_manila_independent_desc:0 "Zaten bağımsız olmamıza rağmen, küresel sahnede bizi henüz böyle tanımayan birçok kişi var. Manila Antlaşması'nı imzalayarak bu tanınmayı kazanıyoruz ve böylece uluslararası sahnede diğer tüm uluslarla eşit durabiliyoruz."
 PHI_treaty_of_manila_subject_desc:0 "Uzun bağımsızlık mücadelesi sona yaklaşıyor. İspanya'ya karşı devrimden, Birleşik Devletler'e karşı verilen zorlu savaşa ve Milletler Topluluğu olarak geçen uzun yıllara kadar, Filipinler dayandı. Manila Antlaşması'nın imzalanmasıyla ülkemiz nihayet özgür ve egemen bir ulus olarak ayakta duruyor ve bağımsızlığı dünya tarafından resmen tanınıyor."
 PHI_trucks_and_transport_requisition:0 "Kamyon ve Ulaşım Talebi"
 PHI_trucks_and_transport_requisition_desc:0 "Artık silahlar Filipinler'e aktığına göre, sahada bir orduyu sürdürmenin lojistiğine bakmanın zamanı geldi. Amerika Birleşik Devletleri'nin gelişen otomobil ve tren endüstrileri sayesinde, askeri kullanımımız için bunlardan bazılarını talep etmek sorun olmamalı."
 PHI_uncouple_the_peso_and_dollar:0 "Peso ve Doları Ayır"
 PHI_uncouple_the_peso_and_dollar_desc:0 "Pesoyu Dolara sabitlemek bizim için iyi çalıştı ve para birimimize ihtiyaç duyulan bir istikrar düzeyi sağladı. Ancak bağımsızlık yaklaşırken, para sistemimizde daha fazla kontrol ve esnekliğe sahip olabilmemiz ve gerektiğinde parasal genişleme gibi araçları uygulayabilmemiz için bunları ayırmamız gerekiyor."
 PHI_unicameral_legislature:0 "Tek Kamaralı Yasama Meclisi"
 PHI_unicameral_legislature_desc:0 "Bağımsız devletimizi kurmadaki en önemli adımlardan biri, bu bağımsız hükümetin örgütlenmesidir. Yoktan bir şey inşa etmek çok zordur, bu yüzden Filipinler Kongresi'nde tek bir meclis kurmalıyız."
 PHI_united_states_army_forces_in_the_far_east:0 "Uzak Doğu'daki Amerika Birleşik Devletleri Ordu Kuvvetleri"
 PHI_united_states_army_forces_in_the_far_east_desc:0 "Filipin Departmanı uzun zamandır Filipinler'deki Amerikan komutanlığı olmuştur, ancak artan gerginliklerle birlikte bunu Amerika Birleşik Devletleri Ordusu'nun daha büyük bir oluşumuna genişletme zamanı gelmiştir. Bu, yeni komuta yapılarının oluşturulmasını ve ABD'den önemli Amerikan personelinin transferini gerektirecektir."
 PHI_united_states_asiatic_fleet:0 "Birleşik Devletler Asya Filosu"
 PHI_united_states_asiatic_fleet_desc:0 "Amerika Birleşik Devletleri Ordusu Uzak Doğu ile ilgilenen tek askeri organ değil, donanma da öyle. Manila Körfezi, Birleşik Devletler Asya Filosunu konuşlandırmak için mükemmel bir üstür ve yeteneklerini genişletmek için ideal bir merkezdir."
 PHI_universal_sufferage:0 "Genel Oy Hakkı"
 PHI_universal_sufferage_desc:0 "Anayasanın kabul edilmesinin ardından, Filipin halkına Filipin ulusunda genel oy hakkına izin verilip verilmeyeceği konusunda bir plebisit yapıldı. Sonuçlar %91 lehte döndü ve bu nedenle oy kullanma hakkı uygun şekilde genişletildi."
 PHI_unlock_conquer_decision_tt:0 "Kararın Kilidini Açar: §YHispanik Ulusun Entegrasyonunu Zorla§!"
 PHI_unlock_mutual_assistance_with_spain_tt:0 "Kararın Kilidini Açar: §Y[SPR.GetNameDef] ile Karşılıklı Yardım Antlaşması Öner§!"
 PHI_unlock_unification_decision_tt:0 "Kararın Kilidini Açar: §Yİttifak Üyesi ile Birleşme Öner§!"
 PHI_usa_catchup_tt:0 "Bu, talep amaçları doğrultusunda Amerikan ekonomik hedeflerinden birini tamamlamış sayılır."
 PHI_usa_equipment:0 "§Y[PHI.GetName]§!, §Y[USA.GetName]§! Askeri Endüstriyel Organizasyonlarını (MIO) kullanacak."
 PHI_usa_equipment_non_aat:0 "§Y[PHI.GetName]§!, §Y[USA.GetName]§! Teçhizat Tasarımcılarını kullanacak."
 PHI_usa_focus_done_T1_alt_tt:0 "Şunlardan en az birini tamamlamış ol: §Y$PHI_declare_military_emergency$§!, §YPeg the Peso to the Dollar§!, §YPro-Hacendados§! veya §YNationality Act§!."
 PHI_usa_focus_done_T1_tt:0 "Şunlardan en az birini tamamlamış ol: §YPeg the Peso to the Dollar§!, §YPro-Hacendados§! veya §YNationality Act§!."
 PHI_usa_focus_done_T2_alt_tt:0 "Şunlardan en az ikisini tamamlamış ol: §Y$PHI_declare_military_emergency$§!, §YPeg the Peso to the Dollar§!, §YPro-Hacendados§! veya §YNationality Act§!."
 PHI_usa_focus_done_T2_tt:0 "Şunlardan en az ikisini tamamlamış ol: §YPeg the Peso to the Dollar§!, §YPro-Hacendados§! veya §YNationality Act§!."
 PHI_usa_focus_done_T3_alt_tt:0 "Şunlardan en az üçünü tamamlamış ol: §Y$PHI_declare_military_emergency$§!, §YPeg the Peso to the Dollar§!, §YPro-Hacendados§! veya §YNationality Act§!."
 PHI_usa_focus_done_T3_tt:0 "Şu üçünü de tamamlamış ol: §YPeg the Peso to the Dollar§!, §YPro-Hacendados§! ve §YNationality Act§!."
 PHI_usaffe_headquarters:0 "USAFFE Karargahı"
 PHI_usaffe_headquarters_desc:0 "Yeni Uzak Doğu Komutanlığımızın, Amerika Birleşik Devletleri Ordusu'ndan önde gelen kurmay subaylarla donatılmış ve kadrolanmış uygun bir karargah bölümüne ihtiyacı olacak. Çağrılabilecek bir dizi emekli komutan veya gerçek deneyime ihtiyaç duyan gelecek vaat eden subaylar var."
 PHI_utang_na_loob:0 "Utang na loob"
 PHI_utang_na_loob_desc:0 "Utang na loob, 'minnet borcu' veya 'içsel benlik borcu' anlamına gelen Filipinli bir kültürel değerdir. Özellikle ihtiyaç zamanlarında önemli yardım sağlayan birine geri ödeme konusunda derin bir duygusal ve ahlaki yükümlülüğü ifade eder. Bu karşılıklılık duygusu genellikle hizmet, destek veya sadakat eylemleriyle ifade edilir."
 PHI_utang_na_loob_last_stand_tt:0 "§YSon Direniş§! için §G-%25§! maliyet ve §G+%5§! savunma\n"
 PHI_war_for_oceania:0 "Okyanusya Savaşı"
 PHI_war_for_oceania_desc:0 "Okyanusya okyanusun kendisi tarafından tanımlanır, ancak halkımız çok eski zamanlardan beri bu sularda seyahat etmektedir. Bu adaları gelişmekte olan ulusumuza dahil etme zamanı geldi."
 PHI_war_for_the_oceans:0 "Okyanuslar İçin Savaş"
 PHI_war_for_the_oceans_desc:0 "Tarihsel olarak denizci bir halk olduk ve doğum hakkımızı geri almanın ve en iyi bildiğimiz arazi üzerinde hak iddia etmenin zamanı geldi. Okyanuslar."
 PHI_war_of_independence:0 "Bağımsızlık Savaşı"
 PHI_war_of_independence_desc:0 "Bana özgürlük verin ya da ölüm! Sömürgeci zalimlerin kıyılarımızı tamamen terk etme zamanı geldi. \n\nFilipinler üzerinde yeni bir güneş doğuyor."
 PHI_war_plan_orange:0 "Turuncu Savaş Planı"
 PHI_war_plan_orange_desc:0 "Turuncu Savaş Planı'nın temel önermesi, Filipinler'in çatışma durumunda bir Amerikan ileri harekat üssü olarak hizmet etmeye devam etmesi gerektiğidir ve bu nedenle savunulması gereken en önemli varlık Manila Körfezi'dir. Bu doğrultuda savunma direktiflerini uygulamalı ve savunmamızı bu kritik stratejik alan etrafında yoğunlaştırmalıyız."
 PHI_war_plan_rainbow_five:0 "Gökkuşağı Beş Savaş Planı"
 PHI_war_plan_rainbow_five_desc:0 "Kendi güvenliğimiz artık düzgün bir şekilde düşünüldüğüne göre, gözümüzü daha geniş savaşa çevirebilir ve buradaki uygun yerimizi daha iyi belirleyebiliriz. Savaş çabasına sunacak çok şeyimiz var ve bunu en çok ihtiyaç duyulan yere yatırdığımızdan emin olmalıyız."
 PHI_warning_american_intervention_tt:0 "§RUyarı: Bu eylem§! §Y[USA.GetNameDef]§! §Rülkesini kızdıracak ve doğru yönetilmezse Amerikan Müdahalesi riskini doğuracaktır§!"
 PHI_weapons_of_war:0 "Savaş Silahları"
 PHI_weapons_of_war_desc:0 "Demokratik ideallerimizi en iyi şekilde korumak için mutlak en iyi, en tehlikeli silahlarla donatıldığımızdan emin olmalıyız. Belli bir 'Manhattan Projesi' söylentisi duyduk. Projede çalışan bir Filipinli kadın var ve iyi, sadık bir insan olarak kendi projemizde bize yardım etmeye istekli."
 PHI_will_gain_hukbalahap:0 "§Y$PHI_grassroot_guerillas$§! tamamlandığında 3 Hukbalahap tugayı kazanacak."
 PHI_will_gain_hunters:0 "§Y$PHI_grassroot_guerillas$§! tamamlandığında 3 Avcı ROTC tugayı kazanacak."
 PHI_will_gain_juramentado:0 "§Y$PHI_grassroot_guerillas$§! tamamlandığında 3 Juramentado tugayı kazanacak."
 PHI_will_take_peace_decision:0 "§Y[ROOT.GetNameDef]§! kendisini bir yıl boyunca başarıyla savunursa veya yakındaki ada üslerini kaybederse veya başka bir yerde savaşa karışırsa §Y[USA.GetName]§! bu kararı daha erken alacaktır."
 PRC_CSCEC_civs:0 "CSCEC'yi Uzmanlaştır - Sivil Endüstri"
 PRC_CSCEC_civs_desc:0 "CSCEC'yi endüstriyel inşaatta uzmanlaşmaya teşvik edeceğiz, sonuçta CSCEC'nin güçlü yönleri burada yatıyor."
 PRC_CSCEC_mils:0 "CSCEC'yi Uzmanlaştır - Askeri Endüstri"
 PRC_CSCEC_mils_desc:0 "CSCEC'yi askeri inşaatta uzmanlaşmaya ve bu amaçla tüm araçları kullanmaya teşvik edeceğiz. Gelecek yıllarda şansımızı sürdürmek için askeri üretimimizi geliştirmemiz gerekiyor."
 PRC_GetAssumeLeaderShipText_NotWentian:0 "Yeni Başkanımızın konumu sorgulanamaz olmalıdır. Eski Başkan $PRC_zhang_wentian$ Partiyi istikrara kavuşturmada rolünü oynadı ancak şimdi [ROOT.GetLeader] zamanı."
 PRC_GetAssumeLeaderShipText_Wentian:0 "Yeni Başkanımızın konumu sorgulanamaz olmalıdır. Parti ve ulus olarak ilerlemek zorundayız."
 PRC_SOV_more_willing_to_send_lend_lease_tt:0 "§Y[SOV.GetNameWithFlag]§! Ödünç Verme ve Kiralama göndermeye daha istekli olacak"
 PRC_USA_more_willing_to_send_lend_lease_tt:0 "§Y[USA.GetNameWithFlag]§! Ödünç Verme ve Kiralama göndermeye daha istekli olacak"
 PRC_a_modern_army:0 "Modern Bir Ordu"
 PRC_a_modern_army_desc:0 "Teçhizatımızı, doktrinimizi, eğitimimizi ve daha fazlasını geliştirdiğimize göre, hangi düşmanla karşılaşırsak karşılaşalım mümkün olduğunca hazır olduğumuzdan nihayet emin olabiliriz."
 PRC_a_new_central_committee:0 "Yeni Bir Merkez Komitesi"
 PRC_a_new_central_committee_desc:0 "Değişim zamanı geldi. $PRC_zhang_guotao$ Merkez Komitesi'nin tam kapsamlı bir incelemesini emredecek ve onu sıfırdan inşa edecek."
 PRC_a_new_central_committee_tt_1:0 "§Y180 gün§! boyunca:"
 PRC_a_new_central_committee_tt_2:0 "Sonra: "
 PRC_a_stronger_united_front:0 "Daha Güçlü Bir Birleşik Cephe"
 PRC_a_stronger_united_front_desc:0 "[CHI.GetName] devletine güvenilir bir müttefik olduğumuzu göstermeliyiz, böylece ittifakı bozmamız durumunda kaynakları yedekte tutma ihtiyacı hissetmezler. Karar alma süreçlerine daha fazla katılımımıza izin verilecek."
 PRC_a_truly_united_front:0 "Gerçek Bir Birleşik Cephe"
 PRC_a_truly_united_front_desc:0 "Diplomatik kolordumuzu güçlendirmemiz ve İkinci Birleşik Cephe'nin konumunu iyileştirmemiz gerekiyor."
 PRC_a_truly_united_front_tt:0 "§Y$PRC_28_bolshevik_faction_cat$§! kararlarını alma maliyetini §Gyarıya indirir§!"
 PRC_adopt_sun_yat_sens_principles:0 "Sun Yat-sen'in İlkelerini Benimse"
 PRC_adopt_sun_yat_sens_principles_desc:0 "Sun Yat-sen'in milliyetçilik, demokrasi ve refah ilkeleri, uğruna çabaladığımız komünist değerlerle hiçbir şekilde birbirini dışlamaz. Bir zamanlar Çin'i istikrara kavuşturan vizyonu şimdi daha da gerçekleştirilebilir."
 PRC_aggressive_pursuit_of_diplomacy:0 "Diplomasinin Agresif Takibi"
 PRC_aggressive_pursuit_of_diplomacy_desc:0 "Daha medeni diplomasi biçimlerini sürdürmek istesek de, bazen irademizin galip gelmesi için şiddet tehdidi gerekir. Ve tehdit işe yaramazsa..."
 PRC_agricultural_reform:0 "Tarımsal Reform"
 PRC_agricultural_reform_boom:0 "Tarımsal Özgürlük"
 PRC_agricultural_reform_boom_desc:0 "Ulusumuzun ihtiyaç duyduğu ürünleri üretmeye yetecek kadar teşvik edilmiş hissetmeleri için çiftçilerimize güvenlik sağlamalıyız."
 PRC_agricultural_reform_desc:0 "Ekonomimizin kaynaklarını kontrol edebileceğimizi garanti altına aldığımıza göre, toprak ağalarından yoksul çiftçilere toprak vererek tarım reformuna devam etmeliyiz."
 PRC_agricultural_reform_tt:0 "§Y$PRC_agrarian_society$§! milli ruhunu §Y$PRC_agrarian_reform$§! olarak değiştirir ve şunları verir:"
 PRC_air_force_capstone:0 "Modern Bir Hava Kuvvetleri"
 PRC_air_force_capstone_desc:0 "Hava kuvvetlerinin teçhizat araştırmasına yaptığımız yatırım, düşmanınkilerden daha iyi performans gösterecek uçaklar üretmemizi sağlamalıdır. Bu aynı zamanda jet motorları gibi yeni gelişmelerin sorunsuz entegrasyonunu da kolaylaştıracaktır."
 PRC_allow_autonomous_regions:0 "Özerk Bölgelere İzin Ver"
 PRC_allow_autonomous_regions_desc:0 "Çin'deki her bölgenin benzersiz talepleri, bir dereceye kadar özerkliğe izin verilerek kabul edilmelidir."
 PRC_allow_autonomous_regions_tt:0 "\nHer §Ymüttefik Çin ülkesi§!, §Y[ROOT.GetNameDef]§! bağlı devleti olmayı seçebilir. Mevcut etki:"
 PRC_allow_special_goods_trade:0 "Özel Mal Ticaretine İzin Ver"
 PRC_allow_special_goods_trade_desc:0 "Özel malların ticareti, hükümetin kabul etmesi ve vergilendirerek kısmi kontrol sağlaması gereken bir şeydir."
 PRC_an_end_to_the_japanese_threat:0 "[JAP.GetAdjective] Tehdidine Bir Son"
 PRC_an_end_to_the_japanese_threat_desc:0 "Kapımızın eşiğindeki [JAP.GetAdjective] varlığı sürekli bir tehdit oluşturuyor, çünkü emperyalist hırsları sınır tanımıyor. İlk biz saldırırsak, onları hazırlıksız yakalayabiliriz."
 PRC_anti_air_effort:0 "Uçaksavar Çabası"
 PRC_anti_air_effort_desc:0 "Hava sahamızın büyük ölçekli olması, hepsini kapsayacak kadar uçak ve altyapı sağlamayı zorlaştırıyor. Bunun yerine, hava saldırılarına karşı koruma sağlamak için uçaksavar silahları konuşlandırılabilir ve çok uygun maliyetli bir çözüm oluşturabilir."
 PRC_appeal_for_foreign_aid:0 "Dış Yardım Çağrısı"
 PRC_appeal_for_foreign_aid__bt7_medium_amount_tt:0 "§Y150§! [SOV.GetAdjective] §YBT-7 Hafif Tankı§! kazan"
 PRC_appeal_for_foreign_aid__bt7_some_tanks_tt:0 "§Y100§! [SOV.GetAdjective] §YBT-7 Hafif Tankı§! kazan"
 PRC_appeal_for_foreign_aid__medium_amount_tt:0 "§Y150§! [SOV.GetAdjective] §YT34 Orta Tankı§! kazan"
 PRC_appeal_for_foreign_aid__some_tanks_tt:0 "§Y50§! [SOV.GetAdjective] §YT34 Orta Tankı§! kazan"
 PRC_appeal_for_foreign_aid_all_tanks_tt:0 "§Y250§! [SOV.GetAdjective] §YT34 Orta Tankı§! kazan"
 PRC_appeal_for_foreign_aid_bt7_all_tanks_tt:0 "§Y350§! [SOV.GetAdjective] §YBT-7 Hafif Tankı§! kazan"
 PRC_appeal_for_foreign_aid_bt7_tt:0 "[ROOT.GetNameDefCap], §YBT-7 Hafif Tankları§! kazanacak"
 PRC_appeal_for_foreign_aid_desc:0 "[SOV.GetNameDef] devletinden zırhlı talep etmek, ordumuz içinde zırhlı bir branş oluşturmamıza ve kendi tasarımlarımızı geliştirmek için onların tasarımlarını incelememize olanak tanıyacaktır."
 PRC_appeal_for_foreign_aid_tt:0 "[ROOT.GetNameDefCap], §YT34 Orta Tankları§! kazanacak"
 PRC_appeal_for_foreign_aid_unlock_decision_tt:0 "§Y[SOV.GetNameDefCap]§! devletinden §YZırhlı Araçlar§! istemek için §YKararların§! kilidini açar"
 PRC_appoint_chang_qiankun:0 "Chang Qiankun'u Ata"
 PRC_appoint_chang_qiankun_desc:0 "Sovyetler Birliği'ndeki Zhukovsky Hava Kuvvetleri Akademisi'nde eğitim gördükten sonra Chang Qiankun, hava kuvvetlerimizi denetlemek için artık mükemmel bir aday."
 PRC_army_doctrines:0 "Doktrinler Uygulamada"
 PRC_army_doctrines_desc:0 "Dahil olduğumuz çeşitli çatışmalar boyunca özenle geliştirdiğimiz doktrin, yeni organizasyonumuza ve silahlarımıza göre ayarlanmalıdır. Entegrasyon olmadan avantajları azalacaktır."
 PRC_army_doctrines_grand_battleplan_tt:0 "§Y$GRAND_DOCTRINE_GRAND_BATTLEPLAN$§! sahip olduğunuz için:"
 PRC_army_doctrines_mass_assault_tt:0 "§Y$GRAND_DOCTRINE_MASS_ASSAULT$§! sahip olduğunuz için:"
 PRC_army_doctrines_mobile_warfare_tt:0 "§Y$GRAND_DOCTRINE_MOBILE_WARFARE$§! sahip olduğunuz için:"
 PRC_army_doctrines_superior_firepower__tt:0 "§Y$GRAND_DOCTRINE_SUPERIOR_FIREPOWER$§! sahip olduğunuz için:"
 PRC_army_doctrines_tt:0 "Seçtiğiniz §YBüyük Doktrin§! temelinde bonus kazanın:"
 PRC_army_reforms:0 "Ordu Reformları"
 PRC_army_reforms_desc:0 "Kızıl Ordu modası geçmiş durumda ve Uzun Yürüyüş'ten sonra geçerliliğini yitiren eski bir doktrine dayanıyor. Orduyu baştan aşağı yeniden inşa etmeliyiz.\n\nÖnde gelen generallerle birlikte [ROOT.GetLeader] tarafından yapılan yeni bir reform dizisi, yeni ve daha güçlü bir Kızıl Ordu'ya yol açacaktır."
 PRC_army_tank_research:0 "Yerli Tank Üretimine Hazırlan"
 PRC_army_tank_research_desc:0 "Gelişmekte olan endüstrimiz artık daha ağır silahlar sağlayabildiğine göre, diğer askeri güçleri yakalama ve tank üretim tesisleri geliştirme zamanı geldi. Bu bize bu silahlara sahip olmayan komşu ülkelere karşı büyük bir avantaj sağlayacak ve kendi zırhlı kuvvetlerine sahip olanlara karşı konumumuzu güçlendirecektir."
 PRC_asian_democratic_union:0 "Asya Demokratik Birliği"
 PRC_asian_democratic_union_desc:0 "Eşitliği teşvik etmek için, dünya sahnesinde güçlü bir müzakere pozisyonuna sahip olmalarını sağlamak amacıyla Asyalı ortaklarımızla işbirliği yapmalıyız."
 PRC_asian_democratic_union_tt:0 "§Y$PRC_asian_democratic_union_modifier$§!, her yeni ittifak üyesi için §YAraştırma Hızını§! §G+%1.00§! ve §YTüketim Malları Fabrikaları Faktörünü§! §Y-2.0%§! artırır, maksimum Araştırma Hızı §G+%10.0§! ve Tüketim Malları Fabrikaları Faktörü §Y-%20.0§! olur"
 PRC_ask_for_soviet_lend_lease:0 "Sovyet Ödünç Verme ve Kiralama İste"
 PRC_ask_for_soviet_lend_lease_desc:0 "$PRC_secure_lend_lease_from_soviet_desc$"
 PRC_assume_leadership:0 "Liderliği Üstlen"
 PRC_assume_leadership_desc:0 "[GetAssumeLeaderShipText]"
 PRC_assume_leadership_tt:0 "§Y$PRC_communist_power_struggle$§! içindeki mevcut değere bağlı olarak, §Y[ROOT.GetLeader]§! farklı özellikler alacaktır.\nMevcut Etki:"
 PRC_asymmetric_warfare:0 "Asimetrik Savaş"
 PRC_asymmetric_warfare_completed_tt:0 "§Y$PRC_asymmetric_warfare$§! tamamlandığında:"
 PRC_asymmetric_warfare_desc:0 "Yüzyıllar boyunca, sayıca az olan ordular imkansız zorlukların üstesinden gelmeye çalıştılar ve biz de düşmanlarımızın sahip olmadığı avantajları kullanarak bunu yapmalıyız. Arazinin daha iyi bilinmesi, yerel sivillerle bağlantılar ve gerilla taktikleri üstünlük sağlamak için kullanılabilir."
 PRC_avenge_the_century_of_humiliation:0 "Aşağılanma Yüzyılının İntikamını Al"
 PRC_avenge_the_century_of_humiliation_desc:0 "1800'ler Batılı güçler tarafından aşağılanma yüzyılını temsil ediyordu. Borcun ödenme zamanı geldi."
 PRC_avenge_the_century_of_humiliation_tt:0 "[ROOT.GetNameWithFlag], herhangi bir komşu §YBatı Ülkesine§! veya bağlı devletlerine karşı §YFethet (Milli Hedef)§! savaş hedefi kazanır. Mevcut etkiler:"
 PRC_aviation_infrastructure:0 "Havacılık Altyapısına Yatırım Yap"
 PRC_aviation_infrastructure_desc:0 "[ROOT.GetNonIdeologyName] ölçeği, hava sahamızı savunmak için çok sayıda uçağa sahip olmanın yeterli olmadığı anlamına gelir. Doğru yerlerdeki havaalanları ve hava sahamızdaki faaliyetleri izlemek çok önemli olacaktır."
 PRC_ban_special_goods_trade:0 "Özel Mal Ticaretini Yasakla"
 PRC_ban_special_goods_trade_desc:0 "Özel malların popülaritesine rağmen, bağımlılık yasakla ele almamız gereken ciddi bir sorundur. Böyle bir reform başlangıçta popüler olmasa bile, özel malların bir zamanlar [SOV.GetNameDef] içinde alkolün yaptığı gibi devrime engel olmasını önlemek için çok önemlidir."
 PRC_ban_special_goods_trade_tt:0 "Bir yıl sonra uygulanacak olan yükseltilmiş §YMilli Ruh§!: "
 PRC_beijing_capital_name:0 "Pekin"
 PRC_best_of_the_best:0 "En İyilerin En İyisi"
 PRC_best_of_the_best_desc:0 "Silahlı kuvvetlerimiz en yüksek kalite ve profesyonellik seviyesini aşılamaya odaklanacak. Sadece davaya en derin bağlılığı gösteren ve buna uygun becerilere sahip olan askerleri kabul etmeliyiz."
 PRC_bolshevik_aid:0 "[GetBolshevikAid]"
 PRC_bolshevik_aid_alt:0 "Bolşevik Sürgünlerini Karşıla"
 PRC_bolshevik_aid_default:0 "Sovyet Bolşeviklerinden Yardım"
 PRC_bolshevik_aid_desc:0 "Sovyet Bolşevikleri devrimci savaşta deneyimlidir ve ayrıca davamıza mali katkıda bulunmaya istekli olabilirler."
 PRC_bolshevik_shortcut:0 "Siyaset: 28 ½ Bolşevik"
 PRC_bolshevik_urban_industrialization:0 "Kentsel Sanayileşme"
 PRC_bolshevik_urban_industrialization_desc:0 "Ağır sanayinin oluşumunu teşvik etmek için şehirlerimize yatırım yapmalıyız."
 PRC_bolshevik_urbanization:0 "Şehirden Devrim"
 PRC_bolshevik_urbanization_2:0 "Kentleşme Çabalarını Artır"
 PRC_bolshevik_urbanization_2_desc:0 "Kırsal nüfusu oraya taşınmaya teşvik etmek için şehirlerde iş yaratmak sadece ekonomimiz için avantajlı olmakla kalmayacak, aynı zamanda devrimi sorgulayan şehirlerdeki nüfuzumuzu da artıracaktır."
 PRC_bolshevik_urbanization_completed:0 "Proleter İşçiler, Birleşin!"
 PRC_bolshevik_urbanization_completed_desc:0 "Kentleşmiş alanlara yaptığımız yatırım oradaki nüfuzumuzu başarıyla artırdı. Artık kırsal ve şehirlerin komünist örgütleri arasında daha güçlü bir işbirliği bekleyebiliriz."
 PRC_bolshevik_urbanization_desc:0 "Mevcut güç tabanımız çoğunlukla yaşam kalitesini iyileştirmek isteyen kırsal çiftçilerden oluşsa da, mesajımızı şehirlerdekilere de ulaştırmalıyız, çünkü onlar da eşitsizlikle karşı karşıya."
 PRC_bolshevik_world_revolution:0 "Dünya Devrimini Yaymak"
 PRC_bolshevik_world_revolution_desc:0 "Devrimimizin başarısı sınırlarımızla sınırlı kalmamalıdır. Diğer uluslardaki proletaryaya yardım etmeliyiz."
 PRC_bring_war_to_neighboring_warlords:0 "Savaşı Komşu Savaş Ağalarına Getir"
 PRC_bring_war_to_neighboring_warlords_desc:0 "Çin'in tek bir hükümdarı olabilir - Devrimi yaymanın ilk adımı Savaş Ağalarını boyunduruk altına almak olacaktır."
 PRC_bring_war_to_neighboring_warlords_tt:0 "Tüm §Ykomşu Savaş Ağalarına§! karşı §Yİlhak§! savaş hedefi kazanır. Mevcut etkiler: "
 PRC_burn_the_paper_tigers:0 "Kağıt Kaplanları Yak"
 PRC_burn_the_paper_tigers_desc:0 "Ortak düşmanlarımıza karşı İkinci Birleşik Cephe'nin kurulmasını sağlamak için [CHI.GetName] ve diğer herkese ulaşacağız."
 PRC_capital_ships:0 "Ana Gemilere İlk Girişim"
 PRC_capital_ships_desc:0 "[SOV.GetAdjective] Kronshtadt sınıfı muharebe kruvazörleri tasarımları hakkında sahip olduğumuz bilgiler, filomuzu ana gemilerle genişletmek için iyi bir temel oluşturabilir. Bu tasarımlar, [SOV.GetAdjective] endüstrisinin onlarla mücadele ettiği noktaya kadar modern, ancak genişleyen donanmamız için bu zorluklar sonuca değer."
 PRC_carriers:0 "Güç Yansıtma"
 PRC_carriers_desc:0 "Uçak gemilerinin geliştirilmesi, büyük deniz güçleriyle rekabet etmemizi sağlayacaktır. Hava kuvvetlerini donanmamızın ulaşabileceği herhangi bir yere konuşlandırma yeteneği, anavatandan uzak çatışmalarda güç yansıtma yeteneğimizi de geliştirecektir."
 PRC_central_military_commision:0 "Merkezi Askeri Komisyon"
 PRC_central_military_commision_desc:0 "Ordumuzun şubeleri artık yeniden düzenlenip modernize edildiğine göre, bunları koordine etmek için bir organ oluşturulabilir. Bu bize ordumuz üzerinde daha iyi bir denetim sağlayacak ve aynı zamanda birleşik operasyonları yürütme kabiliyetimizi geliştirecektir."
 PRC_centralized_army_command:0 "Merkezi Ordu Komutanlığı"
 PRC_centralized_army_command_desc:0 "Merkezi olmayan bir komuta işimize yaramaz. En tepeden en düşük rütbeli acemiye kadar uygun operasyonel planlamayı artırmak için tüm bilgiler yeni bir komuta yapısından akmalıdır."
 PRC_closer_ties_to_sov:0 "[SOV.GetName] ile Daha Yakın Bağlar"
 PRC_closer_ties_to_sov_desc:0 "[SOV.GetNameDef] ile daha da yakın bir ilişki kurmalıyız. Çin-Sovyet bağları güçlüdür, ancak daha güçlü hale getirilmelidir."
 PRC_connecting_the_country:0 "Ülkeyi Birbirine Bağlamak"
 PRC_connecting_the_country_desc:0 "Endüstrimizin genişlemesi ve daha önce kendi kendine yeten ancak daha az verimli çalışan topluluklarda üretilen malları dağıtma ihtiyacının artması, altyapıyı her zamankinden daha önemli hale getirdi."
 PRC_consolidate_politcal_power:0 "Siyasi Gücü Sağlamlaştır"
 PRC_consolidate_politcal_power_desc:0 "Artık tek bir lider hüküm sürüyor ve bunu tüm Parti yapılarında sağlamlaştırmak için harekete geçmemiz hayati önem taşıyor. Muhaliflere izin verilmemeli."
 PRC_consolidate_politcal_power_tt:0 "§Y$PRC_communist_power_struggle$§! etkenini önde gelen tarafa doğru hareket ettirir. Mevcut etki:"
 PRC_construct_the_banqiao_dam:0 "Banqiao Barajını İnşa Et"
 PRC_construct_the_banqiao_dam_desc:0 "[602.GetName] içindeki Ru nehri üzerindeki bir baraj, bölgeye elektrik enerjisi sağlayabilir. Ayrıca, son yıllarda özellikle şiddetli olan sellerin önlenmesine de yardımcı olacaktır."
 PRC_conventional_warfare:0 "Konvansiyonel Savaş"
 PRC_conventional_warfare_completed_tt:0 "§Y$PRC_conventional_warfare$§! tamamlandığında:"
 PRC_conventional_warfare_desc:0 "Uzun süreli bir yıpratma savaşı vermenin avantajları olsa da, dezavantajları da yok değil. Kendimizi fırsatçı saldırılarla sınırlayarak, üretim tesislerimize yönelik saldırılara karşı savunmasız hale geliyoruz. Birçok küçük zaferle morali yükseltmek daha zordur ve büyük savaşlardan kaçınarak daha erken bitebilecek çatışmaları uzatabiliriz."
 PRC_cooperate_ulanhu:0 "Ulanhu ile İşbirliği Yap"
 PRC_cooperate_ulanhu_desc:0 "Yun Ze veya Ulanhu, Moğolistan'dan gelen, şu anda üs sahalarımızın kuzeyinde örgütlenen sadık bir Komünist savaşçıdır. Bizimle birlikte savaşmak için güçlerini [ROOT.capital.GetName] şehrinde bize katılmaya götürmeyi teklif etti."
 PRC_cruisers:0 "Yeşil Su Kruvazörleri"
 PRC_cruisers_desc:0 "Kirov sınıfı gibi hafif silahlı ancak çok yönlü kruvazörler, eve yakın denizleri korumamıza izin verecektir. Bazı tamamlanmamış gövdeler satın alalım ve inşasını bitirelim."
 PRC_dare_to_struggle:0 "Mücadele Etmeye Cüret Et..."
 PRC_dare_to_struggle_desc:0 "Savaş ağası devletleri artık bizim tarafımızdayken, Çin'in bazı kısımlarını sömürgeleştiren yabancı işgalcilerle savaşma zamanı."
 PRC_dare_to_win:0 "... Kazanmaya Cüret Et"
 PRC_dare_to_win_desc:0 "[SOV.GetNameDef] emperyalist seleflerinin Çin topraklarına genişlemesi, daha iyi ilişkiler lehine affedildi, ancak unutulmadı. Artık bunu yapacak imkanlara sahip olduğumuza göre orijinal sınırlarımızı geri kazanmaya çalışmalıyız."
 PRC_deepen_the_dixie_mission:0 "Dixie Misyonu İşbirliğini Derinleştir"
 PRC_deepen_the_dixie_mission_desc:0 "[USA.GetNameDef] devletinin [ROOT.GetNameDef] ile işbirliğinde gösterdiği kararlılık takdire şayan. Belki endüstrimizi modernize etmek için Dixie misyonunu [USA.GetAdjective] uzmanlarla genişletmeye istekli olurlar."
 PRC_demand_warlord_loyalty:0 "Savaş Ağalarının Sadakatini Talep Et"
 PRC_demand_warlord_loyalty_desc:0 "Çin'i tek bir liderlik altında birleştirmeliyiz - ve bunun kimin liderliği olacağını herkese açıkça belirtmeliyiz.\n\nSavaş Ağalarına bir mesaj göndereceğiz - bir Milli Savunma Hükümeti kurma teklifi. [CHI.GetLeader] onaylamayabilir, ancak bu gerekli."
 PRC_destroyers:0 "Anshan Sınıfı Muhripler"
 PRC_destroyers_desc:0 "Modası geçmiş olsa da, Sovyet Gnevny sınıfı muhriplerin fazlasını elde etmek, donanmamız için daha büyük gemiler inşa etmek için uzun yıllar gerektirmeyen bir temel oluşturacaktır. Ayrıca performanslarını inceledikten sonra bu gemileri elden geçirebilir ve modernize edebiliriz."
 PRC_develop_the_army:0 "Orduyu Geliştir"
 PRC_develop_the_army_desc:0 "Şimdiye kadar kurduğumuz ordu artık yeteneklerinin en iyisini sergilediğine göre, ona modernleşme araçlarını sağlamanın zamanı geldi."
 PRC_develop_yanan_soviet:0 "Yan'an Sovyeti'ni Geliştir"
 PRC_develop_yanan_soviet_desc:0 "Artık üs sahalarımızı genişletmek için bir fırsat sunan [1032.GetName] üzerinde kontrol sağlamayı başardık. Şimdi [1032.GetName] bölgesini hükümetimizin merkezi yapacağız."
 PRC_dissent_in_the_united_front:0 "[GetDissentFocusName]"
 PRC_dissent_in_the_united_front_1_tt:0 "[CHI.GetNameWithFlag] ile bir §Yİttifak§! içindeyken:"
 PRC_dissent_in_the_united_front_alt:0 "[ROOT.GetFactionName] İçinde Ayrılık Tohumları Ek"
 PRC_dissent_in_the_united_front_default:0 "Birleşik Cephede Muhalefet Tohumları Ek"
 PRC_dissent_in_the_united_front_desc:0 "Müttefiklerimizle birlikte savaşsak bile, kendi ideolojimizin avantajlarını vurgulamalıyız. Bunu yapmak bize destekçiler kazandırabilir, hatta ittifakın diğer tarafında önemli rol oynayan figürler arasında bile."
 PRC_dockyard_construction_efforts:0 "Tersane İnşaatına Yatırım Yap"
 PRC_dockyard_construction_efforts_desc:0 "Bir donanma kurmaya çalışırken, gemi üretmek için çeşitli endüstrilere yatırım yapmamız gerekecek, topçu üreten fabrikalar gibi diğer fabrikalar ise yepyeni sektörle işbirliği yapmaya zorlanmalıdır."
 PRC_dockyard_construction_efforts_tt:0 "Gereksinimler karşılandığında, bu milli hedef §YDonanma Tersaneleri§! verecektir"
 PRC_economy_shortcut:0 "Ekonomi"
 PRC_education_reform:0 "Eğitim Reformu"
 PRC_education_reform_desc:0 "Mühendislik ve teknik eğitimlere odaklanarak Sovyet tarzı yüksek öğrenimi benimsemeyi amaçlayan hızlı, ülke çapında bir eğitim reformunu mümkün kılmak için adımlar atacağız."
 PRC_eight_points_for_attention:0 "Dikkat Edilmesi Gereken Sekiz Nokta"
 PRC_eight_points_for_attention_desc:0 "$PRC_mao_zedong$ tarafından oluşturulan $PRC_eight_points_for_attention$, şunların önemini belirtir: Konuşurken nazik olmak, alıp satarken dürüst olmak, ödünç alınan tüm eşyaları iade etmek, hasar gören her şey için tazminat ödemek, başkalarına vurmamak veya küfür etmemek, ekinlere zarar vermemek, kadınları taciz etmemek, mahkumlara kötü davranmamak."
 PRC_embrace_stalinism:0 "Stalinizmi Benimse"
 PRC_embrace_stalinism_desc:0 "Liderliğimiz sağlamlaştığında, Stalinist ideolojiyi daha büyük ölçüde uygulamaya başlayabiliriz. Daha fazla kolektivizasyon ve hızlı sanayileşme odak noktalarımız olmalıdır."
 PRC_embrace_stalinism_tt:0 "§Y$PRC_communist_power_struggle$§! içindeki mevcut değere bağlı olarak, §Y$PRC_bolshevik_dominance$§! farklı etkenler alacaktır.\nMevcut Etki:"
 PRC_emergency_prodction_protocols:0 "Acil Üretim Protokolleri"
 PRC_emergency_prodction_protocols_desc:0 "Savaş zamanı üretimini artırmak için endüstrimiz için üretim kotaları belirlemeliyiz. Böyle bir önlem destekçilerimizi yabancılaştırma riski taşıyor, ancak şu anda başka alternatif yok."
 PRC_emergency_supply_protocols:0 "Acil İkmal Protokolleri"
 PRC_emergency_supply_protocols_desc:0 "İkmal sistemimiz sürdürülebilir değil. Tüm çabalarımızı onu iyileştirmeye harcamalıyız, yoksa birliklerimiz silahsız, mühimmatsız ve yiyeceksiz kalacak."
 PRC_empower_the_guerillas:0 "Gerillaları Güçlendir"
 PRC_empower_the_guerillas_desc:0 "Gerilla güçlerimiz deneyim kazandıkça, bağımsız olarak faaliyet göstermelerine izin vermeye başlayabiliriz. Bu, güçlerin daha da sızmasını sağlayacak ve onlarla temasımız kesilirse tehlikeye atılmalarını önleyecektir."
 PRC_empower_the_guerillas_tt:0 "§Y$PRC_guerilla_warfare_sea_cat$§! Kararlarını alma maliyetini §Gyarıya indirir§! ve §Y$PRC_guerilla_cells_active_1$§! yerine §Y$PRC_guerilla_cells_active_2$§! koyma Kararlarının kilidini açar. Etkili değişiklikler:"
 PRC_enforce_maoism:0 "Maoizmi Dayat"
 PRC_enforce_maoism_desc:0 "Maoizmin konumunu daha da güçlendirmek için ideolojiyi tamamen devlet ve parti liderliğine bağlamalı ve Mao'yu tüm ulusun bir sembolü haline getirmeliyiz."
 PRC_equipment_from_copper_coins:0 "Bakır Paralardan Teçhizat"
 PRC_equipment_from_copper_coins_desc:0 "Büyük bir madencilik endüstrisinden yoksun olduğumuz için, bakır paralar eritilip mermiler veya diğer malzemeler için kullanılabilir."
 PRC_establish_democratic_socialism:0 "Demokratik Sosyalizmi Kur"
 PRC_establish_democratic_socialism_desc:0 "Çin için büyük başarılarımız tarih kitaplarında ölümsüzleştirilebilir, ancak zor zamanlar geri döndüğünde bu başarılar pek bir anlam ifade etmeyecektir. Bu yüzden halk, devrime rehberlik edebileceğini ve görevlerini yerine getiremezse hükümeti oylarıyla sorumlu tutabileceğini hissetmelidir."
 PRC_establish_domestic_aircraft_production:0 "Yerli Uçak Üretimini Kur"
 PRC_establish_domestic_aircraft_production_desc:0 "Yerli uçak üretimi, yabancı tedarikçilere olan bağımlılığımızı azaltacak ve tasarımlarımızı ulusumuzun ihtiyaçlarına göre ayarlamamıza olanak tanıyacaktır."
 PRC_establish_friendly_bases:0 "Düşman Hatlarının Gerisinde Üsler Kur"
 PRC_establish_friendly_bases_1_tt:0 "Kararın Kilidini Açar: §YSabotaj Operasyonları Kur§!"
 PRC_establish_friendly_bases_2_tt:0 "§Y$PRC_guerilla_cells_active_2$§! olan §RDüşman işgali altındaki eyaletler§! veya yabancı bir Hakim Devlete sahip bir Bağlı devletin §Yana eyaleti§! artık §Y$PRC_anti_japanese_base$§! alabilir"
 PRC_establish_friendly_bases_desc:0 "İşgal altındaki topraklarda bulunan çok sayıda sivil, sızanlarımızın sabotaj eylemleri gerçekleştirirken araya karışmasında sorun yaşamamasını sağlıyor."
 PRC_establish_pla_air_force:0 "Halk Kurtuluş Ordusu Hava Kuvvetleri"
 PRC_establish_pla_air_force_desc:0 "Dağ kalemizden dışarı doğru genişledikçe ve ovaların daha fazlasını ele geçirdikçe, hava saldırılarına karşı daha savunmasız hale geliyoruz. Neyse ki, genişlemelerimizde bu konuda bir şeyler yapmak için gereken endüstriyel güce de ulaştık ve kendi hava kuvvetlerimizi kurarak savunmasızlığı derhal yöneteceğiz."
 PRC_establish_pla_navy:0 "Halk Kurtuluş Ordusu Donanması"
 PRC_establish_pla_navy_desc:0 "Kıyıya erişimimizin daha önce olmaması nedeniyle, düşmanlarımızın deniz kuvvetlerini yakalama konusunda zorlu bir görevle karşı karşıyayız. Bir donanma sadece kıyılarımızı ve yeni bulunan ticaret bağlantılarımızı korumamıza izin vermekle kalmayacak, aynı zamanda nüfuzumuzu denizlere de yayacaktır."
 PRC_establish_shorter_market_plans:0 "Daha Kısa Piyasa Planları Oluştur"
 PRC_establish_shorter_market_plans_desc:0 "Ekonomimiz için sert uzun vadeli planlar büyük ödüller vaat edebilir, ancak büyük maliyetler ve riskler de içerir. Bunun yerine, halihazırda sahip olduğumuz endüstrinin optimum performans gösterme araçlarına sahip olduğundan emin olmaya odaklanmalıyız."
 PRC_establish_yanan_university:0 "Yan'an Üniversitesi'ni Kur"
 PRC_establish_yanan_university_desc:0 "Sanat, bilim ve siyasi eğitim için ayrı okullardan oluşan mevcut ağ çok verimsizdir. Bu okulları birleştirerek daha etkili bir şekilde öğretebilir ve öğrencilerimizin çeşitli bilgilerini paylaşmalarını sağlayarak bilgi alanlarını genişletebiliriz."
 PRC_every_allied_warlord_tt:0 "Her §Ymüttefik§! Çin Savaş Ağası:"
 PRC_every_peasant_a_soldier:0 "Her Köylü Bir Asker"
 PRC_every_peasant_a_soldier_1_tt:0 "§Y$PRC_promote_guerilla_warfare$§! Tamamlandığında:"
 PRC_every_peasant_a_soldier_2_tt:0 "§Y$PRC_promote_regular_army$§! Tamamlandığında:"
 PRC_every_peasant_a_soldier_desc:0 "Tarlalarda çalışan her sağlıklı insan, ulusun ihtiyacı olduğunda silahlanmaya da hazır olmalıdır.\n\n'Devrimci savaş kitlelerin savaşıdır; ancak kitleleri seferber ederek ve onlara güvenerek yürütülebilir.'"
 PRC_expedite_land_revolution:0 "Toprak Devrimini Hızlandır"
 PRC_expedite_land_revolution_desc:0 "Toprağın toprak ağalarından köylülere yeniden dağıtılması kırsaldaki feodal yapıları kırdı. Kırsal kitleler artık devrimin arkasında sağlam bir şekilde duruyor."
 PRC_expel_the_occupiers:0 "İşgalcileri Kov"
 PRC_expel_the_occupiers_desc:0 "Bunu yapacak gücümüz olduğunda yabancı güçleri Çin'den kovmalıyız, aksi takdirde kendi çıkarları için bizi baltalamak adına hiçbir şeyden vazgeçmeyeceklerdir."
 PRC_extend_emergency_measures:0 "Acil Durum Önlemlerini Uzat"
 PRC_extend_emergency_measures_1_tt:0 "§Y$PRC_emergency_supply_protocols$§! tamamlandığında, §Ysüreyi [?PRC_emergency_protocol_idea_days] gün artırır§! veya:"
 PRC_extend_emergency_measures_2_tt:0 "§Y$PRC_emergency_prodction_protocols$§! tamamlandığında, §Ysüreyi [?PRC_emergency_protocol_idea_days] gün artırır§! veya:"
 PRC_extend_emergency_measures_desc:0 "En kritik sorunlarımızı çözmeye her zamankinden daha yakınız, ancak çabalarımızı genişletmeliyiz yoksa boşa gitmiş olacaklar."
 PRC_finalize_industrial_plan:0 "Sanayi Planını Sonuçlandır"
 PRC_finalize_industrial_plan_desc:0 "Reform planlarımız tamamlandığında, yeni araştırma merkezinin ve üretim tesislerinin mümkün olduğunca işbirliği yapmasını sağlayarak artık sanayi planımızı sonuçlandırabiliriz."
 PRC_form_central_social_affairs_department:0 "Merkezi Sosyal İşler Departmanını Kur"
 PRC_form_central_social_affairs_department_desc:0 "Devrimimizin hedefinin ayarlanması kaçınılmaz olarak destekçileri ve muhalifleri arasında tartışmalara yol açacaktır. Ancak bu ideolojik söylem, devrim karşıtı konulara kayma riski taşıyor ve bu nedenle Maoizmin yerleşmesinin etkilerini izlemek için bir istihbarat teşkilatı kurmalıyız."
 PRC_form_the_5th_research_institute:0 "5. Araştırma Enstitüsünü Kur"
 PRC_form_the_5th_research_institute_desc:0 "Son çatışmalardan gelen haberler, jet ve roket itkisine odaklanan bir araştırma tesisi inşa etme planına ilham verdi. Tesis, uçak tasarımlarımızı geliştirmek ve daha sonra füzeler ve roketler üretmek için kullanılabilir."
 PRC_found_the_academy_of_science:0 "Bilim Akademisi'ni Kur"
 PRC_gain_the_peoples_trust:0 "Halkın Güvenini Kazan"
 PRC_gain_the_peoples_trust_desc:0 "Şu anda bizim kontrolümüz altında olmayan bölgelerdeki halkın sadakatini sağlamak için ilgili kişilere rüşvet vererek ve tehdit ederek çevre kırsala sızacağız. Önümüzdeki günlerde desteklerine ihtiyacımız olacak..."
 PRC_great_production_movement:0 "Büyük Üretim Hareketi"
 PRC_great_production_movement_desc:0 "Bir dizi doğal felaketle daha da kötüleşen [ROOT.GetNameDef] içindeki gıda kıtlığı, bizi daha önce gıda için hükümete güvenen topluluklarda değişimi teşvik etmeye yöneltti. Çiftlikler kurmak için daha önce verimsiz topraklara açıldılar ve bu çaba şimdi birliklerimizin mühendislik deneyimlerini yoldaşlarıyla paylaşmasıyla eşleştirilmelidir."
 PRC_guide_central_committee:0 "Merkez Komitesine Rehberlik Et"
 PRC_guide_central_committee_desc:0 "Merkez Komitesi için net bir rota belirlemeliyiz. Partimizi bir arada tutamazsak, Çin'i birleştirmeyi de asla umamayız."
 PRC_halt_land_revolution:0 "Toprak Devrimini Durdur"
 PRC_halt_land_revolution_desc:0 "İstikrarı sürdürmek için devrimci toprak programı ertelendi. Köylüler söylenirken, yerel seçkinler yatıştırılıyor ve kısa vadeli iç uyum korunuyor."
 PRC_halves_infiltration_cost_tt:0 "§Y$PRC_infiltration_sea_cat$§! Kararlarını alma maliyetini §Gyarıya indirir§!"
 PRC_has_been_infiltrated_tt:0 "Başarıyla §YSızıldı§!"
 PRC_he_long_has_arrived:0 "He Long Shaanxi'ye vardı"
 PRC_he_long_second_army:0 "He Long ve İkinci Ordu"
 PRC_he_long_second_army_desc:0 "He Long'un ordusunun büyük ölçüde bozulmamış durumu, [ROOT.capital.GetName] şehrini korumak için yeni bir birincil güce sahip olduğumuz anlamına geliyor. Milliyetçi güçlerden kaçınma deneyimi de kullanmamız gereken bir şey."
 PRC_holding_half_the_sky:0 "Göğün Yarısını Tutmak"
 PRC_holding_half_the_sky_desc:0 "Çin toplumunda kadınların konumu uzun zamandır eşit değil. Eşitlik için çabalarken bunu da değiştirmeliyiz. Mao'nun bir zamanlar dediği gibi, Kadınlar göğün yarısını tutuyor ve devrime katkıda bulunmalarına izin vermeliyiz."
 PRC_hundred_regiments_offensive:0 "Yüz Alay Taarruzu"
 PRC_hundred_regiments_offensive_desc:0 "Ordumuzun genişlemesi ve birçok bağımsız birliğe örgütlenmesi, düşmanın ikmal hatlarını altüst etmemize izin verecektir."
 PRC_increase_domestic_production_capacity:0 "Yerli Askeri Üretimi Artır"
 PRC_increase_domestic_production_capacity_desc:0 "Sınırlı imkanlarla nüfuzumuzu genişletmeyi başarmış olsak da, askeri endüstrimize yatırım yapma zamanı geldi. Başka bir uzun süreli savaş yaşarsak, stoklanan teçhizatımız sonunda tükenecek veya onarıma ihtiyaç duyacaktır ve yenilerini sunamamak felaket olurdu."
 PRC_indirect_fire:0 "Dolaylı Ateş"
 PRC_indirect_fire_completed_tt:0 "§Y$PRC_indirect_fire$§! tamamlandığında:"
 PRC_indirect_fire_desc:0 "Düşmanlarımıza dolaylı ateş sağlamaya odaklanmış, geliştirilmiş bir topçu kuvveti oluşturmaya odaklanacağız."
 PRC_industrialization_efforts:0 "Sanayileşme Çabalarını Başlat"
 PRC_industrialization_efforts_desc:0 "Tarımsal çıktıdaki son artış, halkımızın bir kısmının diğer endüstrilerde çalışmasına izin veriyor. Yapı malzemeleri veya çiftlikler için alet üretimi gibi daha fazla büyümeye izin veren endüstrilere yeniden yerleşime öncelik vermeliyiz."
 PRC_infiltration_only_level_2_bolshevik_tt:0 "Yalnızca §Yseviye 2§! aşamasına kadar olan kararlar mevcuttur. §Y$PRC_supreme_infiltration$§! milli hedefini alarak §Yseviye 3§! aşamasının kilidini açın."
 PRC_infiltration_only_level_2_guomao_tt:0 "Yalnızca §Yseviye 2§! aşamasına kadar olan kararlar mevcuttur. §Y$PRC_secure_the_lands$§! milli hedefini alarak §Yseviye 3§! aşamasının kilidini açın."
 PRC_initialize_five_year_plan:0 "Birinci Beş Yıllık Planı Başlat"
 PRC_initialize_five_year_plan_desc:0 "Birinci Beş Yıllık Planın amacı, fazla üretimi tamamen yeni sektörlerde endüstri kurmak için kullanmadan önce, halihazırda sahip olduğumuz endüstrinin üretimini iyileştirmektir."
 PRC_initialize_five_year_plan_tt:0 "§REndüstriyel hedeflerin planın son teslim tarihine kadar karşılanamaması, merkezi planlama güveninin kaybına yansıyan, ekonomik verimliliğiniz açısından cezalarla sonuçlanacaktır.§!\n\n§YHedeflerin karşılanması için gereken toplam fabrika:\n[GetFiveYearPlanGoalCivFactoriesText] Sivil Fabrikalar\n[GetFiveYearPlanGoalMilFactoriesText] Askeri Fabrikalar§!"
 PRC_initialize_shorter_market_plans_tt:0 "§REndüstriyel hedeflerin planın son tarihine kadar karşılanamaması, merkezi planlama güveninin kaybına yansıyan ekonomik verimliliğinize büyük zararlar verecektir.§!\n\n§YHedeflerin karşılanması için gereken toplam fabrika:\n[GetShorterMarketPlansGoalCivFactoriesText] Sivil Fabrikalar\n[GetShorterMarketPlansGoalMilFactoriesText] Askeri Fabrikalar§!"
 PRC_invite_otto_braun:0 "Otto Braun'u Davet Et"
 PRC_invite_otto_braun_desc:0 "$PRC_otto_braun$, $PRC_bo_gu$ ile birlikte 1934 seferinin birincil askeri komutanlarından biriydi. Kuşkusuz, sefer yenilgiyle sonuçlandı ve Braun Uzun Yürüyüş sırasında kenara itildi. Ancak yeni liderliğimiz bunun $PRC_otto_braun$'un hatası olmadığını görüyor ve onu eski görevine iade etmeye çalışıyor."
 PRC_invite_pavel_mif:0 "Pavel Mif'i Davet Et"
 PRC_invite_pavel_mif_desc:0 "28 ½ Bolşeviklerin hepsine akıl hocalığı yapan Pavel Mif, hükümetimize tavsiyelerde bulunmak üzere davet edilmelidir. Katılımı [SOV.GetNameDef] ile bağlarımızı güçlendirecektir."
 PRC_invite_soviet_general:0 "Sovyet Generalleri Davet Et"
 PRC_invite_soviet_general_desc:0 "$SOV_vasily_chuykov$ ve $SOV_aleksandr_cherepanov$'ın Rus İç Savaşı'ndaki ve [CHI.GetNameDef] ataşesi olarak kapsamlı deneyimleri, her ikisini de ordumuz için değerli bir katkı haline getirecektir."
 PRC_invite_soviet_general_tt:0 "§Y$SOV_vasily_chuykov$§! ve §Y$SOV_aleksandr_cherepanov$§! General olur"
 PRC_invite_the_dixie_mission:0 "Dixie Misyonunu Davet Et"
 PRC_invite_the_dixie_mission_desc:0 "Asya'da yükselen bir güç olarak, [USA.GetNameDef] devletinin diplomatik bağlar kurmakla ilgilenip ilgilenmeyeceğini araştırmalıyız. Belki de çevremizdeki emperyalist güçlerin aksine, dış tehditlere karşı kendini savunabilen bir Çin inşa etmeye yardımcı olmaya istekli olurlar."
 PRC_join_comintern:0 "Komintern'e Katıl"
 PRC_join_comintern_desc:0 "Komünist Parti'nin ve dolayısıyla devletin liderliği giderek merkezileştiğinden, artık güvenilir bir müttefik olarak Komintern'e katılmak için başvurabiliriz."
 PRC_know_the_enemy:0 "Düşmanı Tanı"
 PRC_know_the_enemy_desc:0 "Komşularımız şimdilik dost olabilir, ancak durum değişirse savunmalarını incelemek için önlemler almalıyız."
 PRC_know_the_enemy_tt:0 "§Y$PRC_the_westward_expedition$§!, §Y$PRC_the_eastward_expedition$§! ve §Y$PRC_usurp_control_over_yanan$§! tamamlandığında:"
 PRC_large_plane_focus:0 "Büyük Uçak Gelişmeleri"
 PRC_large_plane_focus_desc:0 "Büyük uçaklara odaklanarak, ağır yük taşıyan ve çok uzun mesafeleri uçacak kadar yakıta sahip tasarımlar elde edebiliriz."
 PRC_launch_sabotage_campaigns:0 "Sabotaj Kampanyaları Başlat"
 PRC_launch_sabotage_campaigns_desc:0 "Saldırganlara karşı sabotaj operasyonları Kızıl Ordu'nun davasına yardımcı olacak ve düşmanın ilerlemesini engelleyecektir."
 PRC_leadership_of_mao:0 "$PRC_mao_zedong$ Liderliği"
 PRC_leadership_of_mao_desc:0 "Mao, Uzun Yürüyüş'te cesaretini gösterdi ve becerisi sayesinde daha etkili hale gelmesi belki de kötü bir şey değil. Sonuçta, mevcut sınırlarımızla kısıtlanmak istemiyorsak güçlü bir liderliğe ihtiyacımız olacak."
 PRC_lessons_learnt:0 "Alınan Dersler"
 PRC_lessons_learnt_desc:0 "Uzun Yürüyüş'ten bu yana kazandığımız deneyim, askeri doktrinimiz ve eğitimimizdeki ilerlemeleri ince ayar yapmak için kullanılmalıdır."
 PRC_lessons_of_the_west:0 "Batının Dersleri"
 PRC_lessons_of_the_west_desc:0 "Endüstrileri bizimkilerin henüz ulaşamadığı sınırlara ulaşmış olanlardan dersler çıkararak, diğer uluslardan ne gibi dersler çıkarılabileceğini görmek için sınırlarımızın ötesine bakacağız.\n\nYakalamalıyız."
 PRC_light_plane_focus:0 "Hafif Uçak Gelişmeleri"
 PRC_light_plane_focus_desc:0 "Hafif uçaklarımızı geliştirmek, hava savaşları sırasında avantaj elde etmemizi sağlayabilir."
 PRC_limited_infiltration_efforts:0 "Sınırlı Sızma Çabaları"
 PRC_limited_infiltration_efforts_desc:0 "Gerekli olan her türlü yolla Çin'i birleştirmek için elimizden geleni yapmalıyız. Çin halkı onları unutmadığımızı bilmeli ve gün gelip ihtiyaç duyulduğunda onlara hem maddi hem de manevi destek sağlamalıyız"
 PRC_long_march_to_recovery:0 "İyileşmeye Giden Uzun Yürüyüş"
 PRC_long_march_to_recovery_desc:0 "[622.GetName] bölgesine yapılan Uzun Yürüyüş ordumuzda muazzam kayıplara neden oldu. Kalan birliklerimizi yeniden organize etme ve İşçi ve Köylü Kızıl Ordusu'nun ihtişamını geri getirme rotasını belirleme zamanı."
 PRC_losing_border_war_result_tt:0 "§YSınır Savaşı'nı§! §Ykaybederek§!, kazanacaklarımız:"
 PRC_make_agrarian_to_urban_tt:0 "§Y$PRC_agrarian_reform$§! milli ruhunu §Y$PRC_urban_society$§! olarak değiştirir ve şunları verir:"
 PRC_mao_shortcut:0 "Siyaset: Mao"
 PRC_mao_zedong_ascends:0 "$PRC_mao_zedong$ Yükseliyor"
 PRC_mao_zedong_ascends_desc:0 "$PRC_mao_zedong$, [ROOT.GetNameDef] devletinin gerçek lideri olarak tek başına duruyor.\n\n$PRC_zhang_guotao$ artık Başkan Mao ile aynı seviyede olamaz, sadece tek bir lider olabilir."
 PRC_master_the_terrain:0 "Arazi Ustaları"
 PRC_master_the_terrain_desc:0 "Dağlarda savaşmak ve arazinin iyi haritalarını oluşturmak için eğitim almak, düşmanlarımızı kanatlardan kuşatmamıza ve vurduktan sonra güvenli bir şekilde uzaklaşmamıza olanak tanıyacaktır."
 PRC_mediating_secretary_remove_fake_idea_tt:0 "Şunları sağlayan §Y$PRC_mediating_general_secretary_idea$§! milli ruhunu kaldır: \nGünlük Politik Güç Kazancı: §R-0.05§!\nİstikrar: §G+%10.00§!"
 PRC_medium_plane_focus:0 "Orta Uçak Gelişmeleri"
 PRC_medium_plane_focus_desc:0 "Taktik hedefleri vurma yeteneklerimizi geliştirmek için orta uçak tasarımlarına odaklanmalıyız."
 PRC_military_shortcut:0 "Askeriye"
 PRC_mobilization_of_the_people:0 "Halkın Seferberliği"
 PRC_mobilization_of_the_people_desc:0 "Kriz zamanlarında halk ayaklanacaktır.\n\nUzun Yürüyüş gazilerinin önderliğinde milis birimleri kuracağız ve yerel halkı silahlandırıp askere alacağız."
 PRC_mobilization_of_the_people_tt:0 "§Y4 Çin§! milis birimi oluştur"
 PRC_move_capital:0 "Başkenti Taşı"
 PRC_move_capital_desc:0 "$PRC_proclaimed_communism$ kurulduktan sonra, hükümet merkezimizi taşımamız ve şehrin adını Pekin olarak geri getirmemiz gayet doğaldır."
 PRC_naval_capstone:0 "Modern Bir Donanma"
 PRC_naval_capstone_desc:0 "Donanmamız [PRC_ziao_jingguang.GetName] tarafından yeniden düzenlendiğine ve her türlü deniz ateş gücünü kullanmak için ihtiyaç duyduğu kaynaklar verildiğine göre, nüfuzumuzu pasifik üzerinde genişletebiliriz."
 PRC_naval_guns:0 "Donanma Ateş Gücünü Artır"
 PRC_naval_guns_desc:0 "Daha büyük gemilerin inşası için attığımız temel, daha büyük silahlar kullanmamıza da izin verecektir. Bu silahlar, ağır zırhlı hedefleri bile tehdit etmemize ve etkili menzillerine girmeden önce çatışmamıza izin verebilir."
 PRC_naval_infrastructure_effort:0 "Donanma Altyapı Çabaları"
 PRC_naval_infrastructure_effort_desc:0 "[ROOT.GetNonIdeologyName] kıyı şeridinin çok uzun mesafesi boyunca faaliyet göstermek için, donanmaya konumları ne olursa olsun gemilerini hızla yakıt ikmali yapmalarına veya onarmalarına izin verecek altyapıyı sağlamalıyız."
 PRC_naval_infrastructure_effort_tt:0 "Gereksinimler karşılandığında, bu milli hedef §YDeniz Üsleri§!, §YKıyı Tahkimatları§! ve inşa edilmemişse 1 §YDonanma Karargahı§! verecektir"
 PRC_naval_mio:0 "Donanma Endüstrimizi Keskinleştir"
 PRC_naval_mio_desc:0 "Denizcilik sektöründeki daha önceki endüstri eksikliğimiz göz önüne alındığında, hükümet yeni kurulan denizcilik üretim organizasyonlarının verimli bir şekilde çalışmasını sağlamalıdır."
 PRC_naval_ocean_navy:0 "Yeşil Su Donanmasından Mavi Okyanusa"
 PRC_naval_ocean_navy_desc:0 "Donanmamızdaki reformlar artık ikmal üslerimizden çok uzak mesafelerde etkili bir şekilde faaliyet göstermesine izin vermelidir. Bu, düşman kuvvetlerini komşu denizlere ulaşmadan önce kontrol altına almamızı sağlayacaktır."
 PRC_neighboring_SOV_tt:0 "§Y[ROOT.GetName]§!, §Y[SOV.GetName]§! ile doğrudan veya §Yittifak üyeleri§! aracılığıyla dolaylı bir sınır bağlantısına sahip olmalıdır"
 PRC_new_currency_established:0 "Bu milli hedefi almak, henüz gerçekleşmemişse §Y$PRC_equipment_from_copper_coins$§! kaynaklı kötü etkileri önleyecektir."
 PRC_night_attack:0 "Geceden Yararlan"
 PRC_night_attack_desc:0 "Ordumuzu gece saldırıları için eğitmek, asimetrik savaştaki deneyimimizi daha da fazla kullanacaktır."
 PRC_on_guerilla_warfare:0 "Gerilla Savaşı Üzerine"
 PRC_on_guerilla_warfare_desc:0 "Gerilla savaşı üzerine bir teorisyen ve yazar olarak Mao ve yeni kazandığı güç, küçük, bağımsız güçlerimizin doğru kullanımını sağlayacaktır."
 PRC_one_with_the_people:0 "Halkla Bir"
 PRC_one_with_the_people_desc:0 "Gelişmiş bir [CHI.GetNonIdeologyName] için savaşma taahhüdümüz, ordumuza daha fazla gönüllü toplamak için mümkün olduğunca vurgulanmalıdır."
 PRC_overthrow_the_ussr:0 "Sahte Komünistleri Devir"
 PRC_overthrow_the_ussr_desc:0 "Bizimle diğer komünist güçler arasındaki ideolojik farklılıklar, yalnızca Çin'deki duruma uyum sağlamamızdan kaynaklanmıyor. Bu güçlerin gerici ve totaliter politikaları çok ileri gitti ve proletaryalarının bulanık devrim biçimlerinden kurtulabilmesi için müdahale etmeliyiz."
 PRC_overthrow_the_ussr_tt:0 "Her büyük Komünist ülkeye karşı §Yİlhak§! savaş hedefi kazanır. Mevcut etki:"
 PRC_part_of_the_comintern:0 "Komintern'in Parçası"
 PRC_part_of_the_comintern_desc:0 "Evdeki devrim ilerlerken, Komintern'e uluslararası hedeflerinde yardım etmeye odaklanabiliriz."
 PRC_party_control:0 "Partinin Kontrolü"
 PRC_party_control_desc:0 "Liderliğimizin başarısı şimdi Çin Komünist Partisi'nin daha fazla kontrolünü ele geçirmemize izin vermelidir."
 PRC_pavel_mif_alive:0 "Pavel Mif Hayatta"
 PRC_peaceful_reunification:0 "Barışçıl Yeniden Birleşme Ara"
 PRC_peaceful_reunification_desc:0 "Biz Çin'in gerçek liderleriyiz ve bu gerçek kesin olarak tanınmalıdır. [WTT_current_china_leader.GetNameDef] kişisini bu gerçeğe ikna etmeye çalışacağız. Reddederlerse... o zaman... ulus onları gerçekten oldukları gibi görecek."
 PRC_peoples_liberation_army_sea:0 "Halk Kurtuluş Ordusu Kara Kuvvetleri"
 PRC_peoples_liberation_army_sea_desc:0 "İşçi ve Köylü Kızıl Ordumuz artık giderek daha fazla deneyimli asker içeriyor ve bu karakter değişikliğini tamamen benimsememizin zamanı geldi. Bir milis kuvvetinden iyi eğitimli ve iyi donanımlı profesyonel askerlerden oluşan bir orduya geçerken, Halk Kurtuluş Ordusu'nun Kara Kuvvetlerini kurmanın zamanı geldi."
 PRC_petition_for_freedom:0 "Bağımsızlık Dilekçesi"
 PRC_petition_for_freedom_desc:0 "Bağımsızlığımız çok uzun zamandır başkalarının elinde - bunu kesin olarak değiştirmenin zamanı geldi."
 PRC_petition_for_freedom_not_subject_tt:0 "§YBağlı devlet değilse etkisi yok§!"
 PRC_pilot_training:0 "Pilot Akademileri Kur"
 PRC_pilot_training_desc:0 "Sahip olduğumuz az sayıdaki deneyimli pilot savaşta riske atılamaz, bunun yerine hava kuvvetlerimiz genişledikçe yeni pilotları eğitmek için eğitmen olarak işe alınmalıdırlar."
 PRC_playing_both_sides:0 "Her İki Tarafı İdare Et"
 PRC_playing_both_sides_desc:0 "Ülkemizin geleceği için belirleyici bir savaş zamanı gelirse diye, savaş ağası ve [CHI.GetAdjective] eyaletlerindeki halkın sadakatini sağlamaya çalışmalıyız."
 PRC_preemptive_strike:0 "Önleyici Saldırı"
 PRC_preemptive_strike_desc:0 "Nanchang'daki 1927 ayaklanmasının sonuçları milliyetçi güçlerin ne kadar etkili olabileceğini gösteriyor. Başka bir Uzun Yürüyüşü önlemek için önce biz saldırmalı, kendi kuşatmalarımızı gerçekleştirmeli ve daha elverişli konumlarımızdan yararlanmalıyız."
 PRC_prepare_for_596:0 "596 Hazırlığında"
 PRC_prepare_for_596_desc:0 "Nükleer silah tehdidine, kendi silahlarımız olmadan karşı koymak imkansızdır. Bu nedenle hükümet, ilgili alanlardaki bilim insanlarını işe almalı ve bir nükleer program hazırlayabilmeleri için desteklemelidir."
 PRC_prepare_for_the_inevitable:0 "Kaçınılmaz Olana Hazırlan"
 PRC_prepare_for_the_inevitable_desc:0 "Hem [JAP.GetNameDef] hem de potansiyel olarak geleneksel müttefikimiz [SOV.GetNameDef] tarafından gelen yayılmacı girişimler ufukta beliriyor. İdeolojik kaygıları bir kenara bırakmalı ve dış tehditlere karşı birleşik bir cephe sunmaya hazırlanmalıyız."
 PRC_prepare_for_third_phase:0 "Üçüncü Aşamaya Hazırlan"
 PRC_prepare_for_third_phase_desc:0 "Mao gerilla savaşının üç aşaması olduğunu ilan etti. Destek kazanmayı ve düşmanlarımızı zayıflatmayı amaçlayan ilk ikisini gerçekleştirdikten sonra, şimdi konvansiyonel yöntemlere dönme zamanı. Üçüncü ve son aşamada şehirlere doğrudan saldırılar başlatarak topraklarımızı daha da genişleteceğiz."
 PRC_promote_guerilla_warfare:0 "Gerilla Savaşını Teşvik Et"
 PRC_promote_guerilla_warfare_desc:0 "Kızıl Ordu düşmanlarımızın gücüyle eşleşmeyi umamaz - en azından henüz değil. \n\nGüçlü yönlerimize oynamalı ve düşman hatlarının gerisinde savaşmalı, ardından tekrar saldırmak için hızla ortadan kaybolmalıyız."
 PRC_promote_paper_bills:0 "Kağıt Banknotları Teşvik Et"
 PRC_promote_paper_bills_desc:0 "Ucuz üretim maliyetlerine sahip kağıt para, mühimmat fabrikalarında geri dönüştürülebilen bakır paralar için iyi bir yedek oluşturacaktır. Ancak büyük bir dezavantajı, ticaret ortaklarımızın, sadece daha fazlasını basarak değerini kolayca değiştirebileceğimiz bir para birimi konusunda gergin olabilmeleridir."
 PRC_promote_regular_army:0 "Düzenli Bir Orduyu Teşvik Et"
 PRC_promote_regular_army_desc:0 "Kızıl Ordu'nun [ROOT.GetNameDef] topraklarını savunabilmesini ve genişletebilmesini ancak konvansiyonel yöntemlerle sağlayabiliriz."
 PRC_promote_the_silver_dollar:0 "Gümüş Parayı Teşvik Et"
 PRC_promote_the_silver_dollar_desc:0 "Gümüş lehine bakır paraları tedavülden kaldırmak, eski metalleri mühimmat üretimi için geri dönüştürmemize olanak tanıyacaktır. Madeni paralarımızın içsel değeri, ticaret ortaklarımızın para birimimizin değerindeki artış veya azalış konusunda endişelenmeleri gerekmediği anlamına gelir, çünkü gümüşün değerine bağlıdır."
 PRC_promote_womens_suffrage:0 "Kadınların Oy Hakkını Teşvik Et"
 PRC_promote_womens_suffrage_desc:0 "'Kadınlar göğün yarısını tutar'. Gerçek cinsiyet eşitliği Partinin bir hedefidir ve Çin genelinde kadınların yasal, siyasi, sosyal ve ekonomik katılımını sağlamak için adımlar atmalıyız."
 PRC_propaganda_efforts:0 "Propaganda Çabaları"
 PRC_propaganda_efforts_1_tt:0 "Her §YGerilla Savaşı§! Karar ve §G[?PRC_gain_faction_inluence_number|%]§! §YFraksiyon Etkisi§! kazanın §YSızma§! [CHI.GetAdjective] Eyaletleri"
 PRC_propaganda_efforts_2_tt:0 "Her §YGerilla Savaşı§! Kararı için §G[?PRC_gain_faction_inluence_number|%]§! §YFraksiyon Etkisi§! kazanın"
 PRC_propaganda_efforts_desc:0 "Propaganda, devrimimiz için takipçi toplamanın yanı sıra zaten toplanmış takipçilerimizi kendinden emin tutmanın önemli bir parçasıdır. Propagandamız müttefiklerimiz tarafından halklarını Çin'i savunmak için topladıklarında bile kullanılabilir."
 PRC_purge_the_world_of_fascism:0 "Dünyayı Faşizmden Temizle"
 PRC_purge_the_world_of_fascism_desc:0 "Kapitalizmden ayrılma sözü vermesine rağmen, faşistin komünizme olan nefreti bunun sadece bir saçmalık olduğunun yeterli kanıtıdır. Proletaryayı özgürleştirmek için kullandığımız radikal araçlar faşistler tarafından onu bastırmak için kullanılıyor ve bu müdahale etmemiz gereken bir şey."
 PRC_put_an_end_to_the_sufan:0 "Sufan'a Son Ver"
 PRC_put_an_end_to_the_sufan_desc:0 "[622.GetName] bölgesine vardığımızda, yerel Politbüro Merkez Komitesi lideri Liu Zhidan ve diğer yerel liderler, devrim karşıtı bir kampanyada tasfiye sürecindeydi. $PRC_bo_gu$, bu saçmalığa son vermekle görevlendirilecek."
 PRC_question_the_faction_leadership:0 "İttifak Liderliğini Sorgula"
 PRC_question_the_faction_leadership_desc:0 "Daha fazla nüfuz kazanmak için, ittifakımızın liderliği tarafından yapılan hataları vurgularken kendi başarılarımızı öne çıkarmalıyız."
 PRC_raid_weapon_depots:0 "Silah Depolarına Baskın Yap"
 PRC_raid_weapon_depots_desc:0 "Sızma çabalarımız düşmanlarımızın lojistik ağlarını haritalandırmamıza izin verdi. Ele geçirilen teçhizatı daha fazla ajan sahaya sürmek için kullanarak bu ağlara baskın düzenleyebiliriz."
 PRC_raid_weapon_depots_tt:0 "§Y$infantry_equipment$§! ve §Y$artillery$§! kazanmak için [ROOT.GetNameWithFlag] devletinin §YGerilla Hücreleri§! veya §Y$PRC_anti_japanese_base$§! kurduğu her yerde §Y$raid_type_PRC_weapons_depot_raid$§! kilidini açar"
 PRC_raiding_parties:0 "Baskın Grupları"
 PRC_raiding_parties_desc:0 "Düşmana kıyasla endüstriyel güçteki eksikliğimizi yaratıcılıkla telafi ediyoruz. Baskın grupleri göndermek sadece kendi teçhizat durumumuzu istikrara kavuşturmakla kalmayacak, aynı zamanda onlarınkini de kötüleştirecektir."
 PRC_rally_the_28_bolsheviks:0 "28 ½ Bolşevikleri Topla"
 PRC_rally_the_28_bolsheviks_desc:0 "Sovyetler Birliği'nde hükümet ve ordu liderleri olarak eğitilen 28 ½ Bolşevik'in kapsamlı bilgisi, bu zorlu zamanlarda sonuna kadar kullanılmalıdır."
 PRC_rally_the_industry:0 "Endüstriyi Toparla"
 PRC_rally_the_industry_desc:0 "Yeniden yerleşimimiz endüstrimizi dağınık bıraktı. Uzun Yürüyüş'te getirdiğimiz üretim araçlarından neler yapabileceğimizi keşfetmeli ve orijinal üslerimizin bu unutulmuş kaynaklarını yeniden kullanmaya çalışmalıyız."
 PRC_rally_the_peasants:0 "Köylüleri Topla"
 PRC_rally_the_peasants_desc:0 "[CHI.GetNameDef] yönetiminin kötü yönetimi nedeniyle köylüler ana güç tabanımızı oluşturuyor. Vaat ettiğimiz reformlardan kazanacakları çok şey var."
 PRC_reach_out_to_the_west:0 "Batıya Ulaş"
 PRC_reach_out_to_the_west_desc:0 "Geçmişte [ROOT.GetAdjective] egemenliğine karşı tekrarlanan eylemlerine rağmen, Batı'nın [ROOT.GetNameDef] devletinin bir dünya gücü haline gelmesine yardımcı olabilecek sunabileceği birçok kaynağı var."
 PRC_reach_out_to_the_west_tt:0 "Eğer faşist olmayan bir §YBatılı Büyük devlet§! ortak bir düşmana karşı savaşıyorsa ve hiçbirinin birbiriyle savaşan müttefikleri yoksa:"
 PRC_reappoint_jinguang_as_admiral:0 "Jinguang'ı Amiral Olarak Yeniden Ata"
 PRC_reappoint_jinguang_as_admiral_desc:0 "Ordumuz deniz savaşında deneyimsiz olduğundan, yeni donanmamıza liderlik edecek en iyi aday deneyimli bir kara kuvvetleri komutanı olabilir."
 PRC_reappoint_jinguang_as_admiral_tt:0 "§R[PRC_ziao_jingguang.GetName] kişisini General olarak kaldır§!"
 PRC_rebuild_28_bolshevik:0 "28 ½ Bolşevikleri Yeniden İnşa Et"
 PRC_rebuild_28_bolshevik_desc:0 "Yeni liderliğimizin aldığı destek, güvenildiğini açıkça gösteriyor. Bu meşruiyet, hem uluslararası hem de yurt içinde destekçileri daha kolay toplamamıza izin verecektir."
 PRC_rebuild_28_bolshevik_effect_tt:0 "§Y$PRC_28_bolshevik_trait$§! kaybeder ve §Y$PRC_28_bolshevik_trait_improved$§! kazanır.\n§YEtkili değişiklik:§!\nGünlük Politik Güç Kazancı: §G+0.12§!\nİstikrar: §G+%5.00§!\nAynı ideoloji aylık görüşü: §G+%5.00§!"
 PRC_rebuild_28_bolshevik_tt:0 "Her §Y28 ½ Bolşevik§! Üyesi:\nÖzelliklerinin verimliliğini artır"
 PRC_reclaim_the_grasp_of_power:0 "İktidarın Kontrolünü Geri Al"
 PRC_reclaim_the_grasp_of_power_desc:0 "Uzun Yürüyüş'ün askeri liderliği nedeniyle Mao'ya kayan güç nihayet Parti'nin eski liderlerine geri dönüyor. Uzun Yürüyüş bittiğinde, $PRC_wang_ming$ veya $PRC_bo_gu$ liderlik görevini tekrar üstlenmeye hazır."
 PRC_reclaim_tibet:0 "Tibet'i Geri Al"
 PRC_reclaim_tibet_desc:0 "Çin'deki istikrarsızlık [TIB.GetNameDef] devletinin Çin yönetiminden kopmasına izin verdi, ancak uluslarımız arasındaki tarihsel bağlar göz ardı edilemez. Sınırımızın bir kez daha Himalayalara ulaşabilmesi için onlarla yeniden birleşmeyi hedeflemeliyiz."
 PRC_red_army_reborn:0 "Kızıl Ordu Yeniden Doğdu"
 PRC_red_army_reborn_desc:0 "[622.GetName] içindeki yeni üssümüz sağlamlaştırılmalıdır. Kayıplarımızın bir kısmı yerel gönüllüleri askere alarak telafi edilebilir ve yeni evimizi korumak için planlar yapmalıyız."
 PRC_reestablish_moscow_sun_yat_sen_university:0 "Moskova Sun Yat-sen Üniversitesi'ni Yeniden Kur"
 PRC_reestablish_moscow_sun_yat_sen_university_desc:0 "Moskova Sun Yat-sen Üniversitesi'ni yeniden kurarak ve finansmanını artırarak, daha önce gelen 28 ve buçuk gibi gelecek nesil akademisyenleri teşvik ederek ulusu yönlendirmeye ve iyileştirmeye yardımcı olabiliriz."
 PRC_reestablish_the_state_bank:0 "Devlet Bankasını Yeniden Kur"
 PRC_reestablish_the_state_bank_desc:0 "Ekonomimizi düzgün bir şekilde yönetmek için merkez bankamızı yeniden kurmamız gerekecek. $PRC_communism$ Merkez Bankası Orta Çin'de kuruldu ancak Uzun Yürüyüş onu faaliyetlerini durdurmaya zorladı. Teçhizatı o zamandan beri yolda ve şimdi [ROOT.capital.GetCapitalVictoryPoint.GetName] şehrine ulaşmaya başlıyor."
 PRC_reform_the_republic:0 "Cumhuriyeti Reforme Et"
 PRC_reform_the_republic_desc:0 "Cumhuriyet iyi bir fikirdi, kötü uygulandı. Biz Cumhuriyet'in ideallerinin gerçek takipçileriyiz."
 PRC_reinforce_base_area:0 "Yeni Üs Sahalarını Takviye Et"
 PRC_reinforce_base_area_desc:0 "Milliyetçi güçlerin üslerimize karşı başka bir harekatından kaçınmak için, onları korumak adına her türlü potansiyel seçeneği göz önünde bulundurmalıyız."
 PRC_reinforce_base_area_tt:0 "§Y[622.GetName]§! ve §Y[1046.GetName]§! sınırlarına seviye §G2§! §YKara Tahkimatları§! inşa et. \nEğer herhangi bir sınır savaşı kazanılmışsa: \nSınırlarına seviye §G1§! §YKara Tahkimatları§! inşa et"
 PRC_remove_iniltration_and_guerilla_decisions_tt:0 "§Y$PRC_infiltration_sea_cat$§! ve §Y$PRC_guerilla_warfare_sea_cat$§! Kararlarını §RKaldır§!"
 PRC_reorganize_divisions:0 "Tümenleri Yeniden Organize Et"
 PRC_reorganize_divisions_desc:0 "Ordumuzu daha da modernize etmek için, kalan milisleri tümenlere ayırmalı ve mevcut tümenlerin güçlerinde tutarlı olduğundan emin olmalıyız. Bu, birliklerimizi koordine etmeyi kolaylaştıracak net bir emir komuta zinciri oluşturmamızı sağlayacaktır."
 PRC_request_for_aid:0 "Bir Yardım Talebi"
 PRC_request_for_aid_desc:0 "[SOV.GetNameDefCap] kuruluşumuzdan bu yana doğrudan katılımdan kaçınırken çabalarımızı destekledi. Ancak mevcut dünya durumu sembolik destekten fazlasını talep ediyor ve bu nedenle ordumuzu kurmaya yardımcı olacak [SOV.GetAdjective] teçhizat talep etmek için bir heyet gönderilmelidir."
 PRC_request_guarantees:0 "Toprak Garantisi Talep Et"
 PRC_request_guarantees_desc:0 "Sovyetler Birliği'nden esinlenen yeni rotamız, onların korumasından büyük ölçüde fayda görecektir. Güvenlik garantileri vermek onlar için risksiz olmayacaktır, ancak potansiyel düşmanları caydırmadaki önemi bunu değerli kılmaktadır."
 PRC_request_guarantees_tt:0 "§R[SOV.GetNameDefCap], garanti karşılığında bağlı devlet olmamızı isteyebilir...§!"
 PRC_request_territory_tt:0 "Mevcut kontrolcüsü tarafından §Ysahip olunmuyorsa§! veya sahibi §Y[ROOT.GetRulingIdeology]§! ise §Yana eyaletlerin velayetimize transfer edilmesini§! talep eder. \nMevcut etki:"
 PRC_resource_extraction_focus:0 "Kaynak Çıkarma"
 PRC_resource_extraction_focus_desc:0 "Endüstriyel büyümeyi artırmak için topraklarımızdaki doğal kaynakları daha kapsamlı bir şekilde kullanmamız gerekecek."
 PRC_restore_territorial_integrity:0 "Toprak Bütünlüğünü Geri Kazan"
 PRC_restore_territorial_integrity_desc:0 "Davamıza sadık olanlardan basit bir toprak transferi isteyeceğiz."
 PRC_revolutionary_war_of_the_masses:0 "Kitlelerin Devrimci Savaşı"
 PRC_revolutionary_war_of_the_masses_desc:0 "Partimizin sıradan insanı yozlaşmış ve elitist milliyetçi devletlerden daha fazla temsil ettiğini açıkça belirtmeliyiz. Amacımız bu güçlerle savaşmak ve daha iyi bir sistem yaratmaktır."
 PRC_role_of_kangda:0 "Kàngdà'nın Rolü"
 PRC_role_of_kangda_desc:0 "Kàngdà olarak da bilinen [622.GetName] Kızıl Ordu Okulu adlı ana askeri okulumuz daha önce eğitime odaklanmıştı. Şimdi artan finansmanla, hem yerli hem de yabancı doktrinler ve teçhizat geliştirmeye odaklanan bir inovasyon merkezi haline gelecek."
 PRC_rural_recruitment:0 "Kırsal Asker Toplama"
 PRC_rural_recruitment_desc:0 "İşgalci tüm kırsal yerleşimleri izlemeyi asla umamaz, bu da asgari riskle orada asker toplamamızı mümkün kılar."
 PRC_rural_recruitment_tt:0 "Bir §Ykırsal§!, §Ygelişmiş kırsal§! veya §Yhayvancılık§! eyaletine §YSızarken§!, §G[?PRC_rural_recruitment_manpower]§! İnsan Gücü al"
 PRC_rural_region_development:0 "Kırsal Bölge Kalkınması"
 PRC_rural_region_development_desc:0 "[ROOT.GetNameDef] yaşam kalitesinin iyileştirilmesini kolaylaştırmak için, kırsal alanlarımızdaki çiftliklerin modernizasyonuna yatırım yapılarak gıda üretimi artırılmalıdır."
 PRC_rural_region_development_tt:0 "§YÜçe§! kadar Kırsal Eyalet §G%25§! Yerel İkmal ve §G%15§! Yerel İnsan Gücü alacak.\nMevcut Etkiler:"
 PRC_rural_region_development_two:0 "Kırsal Kalkınmayı Genişlet"
 PRC_rural_region_development_two_desc:0 "Çiftliklerimizin modernizasyonu, kırsal verimliliği artırmaya yardımcı olacak okullar ve yollar gibi kırsal bölgelerimizdeki altyapıya yatırım yapılarak daha da desteklenmelidir."
 PRC_rural_region_development_two_tt:0 "§Yİkiye§! kadar Kırsal Eyalet §G%25§! Yerel İkmal ve §G%15§! Yerel İnsan Gücü alacak.\nMevcut Etkiler:"
 PRC_rural_survey:0 "Kırsal Anketler"
 PRC_rural_survey_desc:0 "Kırsal alanlarımızdaki nüfusu ve üretimi haritalamak, daha sonraki ekonomik planlarımızın sorunsuz çalışmasını sağlayacak ve ayrıca zorunlu askerlik gerekirse yararlı olacaktır."
 PRC_said_no_to_cuf:0 "İkinci Birleşik Cepheyi Reddetti"
 PRC_scholarly_revolution:0 "Akademik Devrim"
 PRC_scholarly_revolution_desc:0 "Liderlerimiz aydınlardan geldi ve [ROOT.GetAdjective] geleceğini onların merceğinden şekillendirmeliyiz."
