 PRC_sea_mobile_warfare:0 "$PRC_mobile_warfare$"
 PRC_sea_mobile_warfare_desc:0 "$PRC_mobile_warfare_desc$"
 PRC_sea_move_capital:0 "Başkenti Taşı"
 PRC_sea_move_capital_desc:0 "$PRC_proclaimed_communism$'in kurulmasından sonra, hükümet merkezimizi taşımamız ve şehrin adını Pekin olarak geri getirmemiz doğaldır."
 PRC_sea_new_economic_direction:0 "Yeni Ekonomik Yön"
 PRC_sea_new_economic_direction_desc:0 "Halk Cumhuriyeti'mizin ilan edilmesi ve tozun yatışmasıyla ekonomimizi yeniden odaklamanın ve yapılandırmanın zamanı geldi. Dikkatli planlamayla zamanla batı ekonomilerini geride bırakabilecek ve hesaba katılması gereken bir güç haline geleceğiz."
 PRC_sea_peoples_liberation_army:0 "$PRC_peoples_liberation_army$"
