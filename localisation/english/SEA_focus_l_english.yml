 PRC_sea_aid_from_soviet_bolsheviks_desc:0 "Devrimimizin başarılı olması için onu destekleyecek sanayi tabanına sahip olmalıyız. Sovyet yatırımcıların yardımıyla kendi endüstrimizi başlatabileceğiz."
