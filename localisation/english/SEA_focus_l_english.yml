 CHI_sea_dominate_japan_desc:0 "$CHI_dominate_japan_desc$"
 CHI_sea_dominate_siam:0 "Siyam'a Hakim Ol"
 CHI_sea_dominate_siam_desc:0 "Siyam, Asya'da yabancı bir güç tarafından işgal edilmemiş az sayıdaki ulustan biridir. Onlara korumamızı teklif ederek ve karşılığında uluslarının kontrolünü ele alarak onları bu yabancı güçlere karşı daha fazla korumalıyız."
