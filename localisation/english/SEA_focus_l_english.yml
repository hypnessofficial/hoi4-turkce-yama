 CHI_second_father_of_the_nation:0 "Ulusun İkinci Babası"
 CHI_second_father_of_the_nation_desc:0 "Dr. Sun Yat-sen, Qing prangalarından kurtulmamızı sağladı ve her zaman ulusumuzun İlk Babası olacak. Generalissimo Chiang partiyi komünistlerden temizledi ve bunun için her zaman İkinci Baba olarak hatırlanacak."
 CHI_secure_the_northern_front:0 "Kuzey Cephesini Güvenceye Al"
 CHI_secure_the_northern_front_desc:0 "Mançurya'yı, açık ara en güçlü ve en tehlikeli komşumuz olan Japonlara çoktan kaybettik. Japonlara göz kulak olabilmek ve daha güneye genişleme fikirlerine kapılmadıklarından emin olmak için kuzey sınırını güvence altına almalıyız..."
 CHI_secure_the_soviet_border:0 "Sovyet Sınırını Güvenceye Al"
 CHI_secure_the_soviet_border_desc:0 "Rus ayısı, işlerimize karışarak çok uzun zamandır başımıza bela oldu. [SOV.GetNameDef] ile resmi ilişkiler kurarak kuzey cephemizi güvence altına almalı ve belki onlardan daha fazlasını almalıyız."
 CHI_secure_the_soviet_border_tt:0 "§RGelecekteki bir olayda seçebileceğimiz Zırhlı tasarımcılarını görebileceğiz.§!"
 CHI_seek_out_western_fascist_cooperation:0 "Batı İşbirliğini Ara"
 CHI_seek_out_western_fascist_cooperation_desc:0 "Geçmişteki yabancı müdahalesi nedeniyle teknik gelişimde geride kaldık. Ne kadar itici bulursak bulalım, arayı kapatabilmemiz için davamıza sempati duyan Batılı ülkelerle işbirliği aramak akıllıca olabilir, ta ki biz durumu onların aleyhine çevirene kadar..."
 CHI_sell_lend_lease:0 "Ödünç Verme ve Kiralama Sat"
 CHI_sell_lend_lease_desc:0 "Güçlerimiz için teçhizat almak her zaman yararlıdır, ancak sunulanlar her zaman ihtiyaç duyulanlar değildir. Ancak, her zaman bir yerlerde teçhizata ihtiyaç vardır, bu da onun için her zaman bir pazar olduğu anlamına gelir."
 CHI_sell_lend_lease_tt:0 "Eğer §Y$CHI_soviet_support$§! varsa kazan: Ayda §Y+100 $CIC_BANK_HEADER$§!\n\nEğer §Y$CHI_american_support$§! varsa kazan: Ayda §Y+150 $CIC_BANK_HEADER$§!\n\n"
 CHI_send_the_first_lady_abroad:0 "First Lady'yi Yurtdışına Gönder"
 CHI_send_the_first_lady_abroad_desc:0 "Saldırganlık karşısında bizi destekleyebilecek, ancak şu anda kararsız olanlar var. First Lady'yi, okyanuslar kadar kan kaybetmiş ve savaşın ağır yükünü hiç tereddüt etmeden taşımış olsak da, yine de galip geleceğimize ikna etmesi için göndermeliyiz."
 CHI_send_the_urban_students_to_the_countryside:0 "Kentsel Öğrencileri Kırsala Gönder"
 CHI_send_the_urban_students_to_the_countryside_desc:0 "Eğitim çabalarımız meyve vermiş olsa da, şehirler ve kırsal arasında hala büyük bir tutarsızlık var. Daha doğrudan bir yaklaşım benimsemenin ve yüksek öğrenim öğrencilerimizin bilgilerini köy okullarında kullanmanın zamanı geldi."
 CHI_serve_the_country_with_utmost_loyalty:0 "Ülkeye Azami Sadakatle Hizmet Et"
 CHI_serve_the_country_with_utmost_loyalty_desc:0 "Düşmana cesaretimizi gösterdik ve onları oldukları yerde durdurduk. Ulusumuza sarsılmaz bağlılığımız ve hizmetimiz sayesinde, bizi boyunduruk altına alabilecek hiçbir işgalci yok!"
 CHI_set_up_an_nco_school:0 "Bir Astsubay Okulu Kur"
 CHI_set_up_an_nco_school_desc:0 "Ordumuzun ezici bir kısmı örgün eğitimden yoksun, bu sıradan asker için affedilebilir, ancak rütbeleri yükseltirken bir sorun haline geliyor. Kaliteyi tespit edebilmemiz için astsubaylarımızı eğitecek bir sistem kurmamız gerekiyor."
 CHI_setting_a_new_standard:0 "Yeni Bir Standart Belirlemek"
 CHI_setting_a_new_standard_desc:0 "Ordumuz Batı düşüncesinden ve doktrininden çok etkilendi, ancak biz Clausewitz'in değil Sun Tzu'nun ülkesiyiz. Yapısal değişiklikler ve ideolojik çalışmalarla silahlı kuvvetlerimizi kendi imajımızda yeniden şekillendirdik."
 CHI_shifting_the_balance:0 "Dengeyi Değiştirmek"
 CHI_shifting_the_balance_desc:0 "Yurtdışından destek almış olsak da, bu pasif türdendi. Japon tehdidini kesin olarak yenmemize yardımcı olabilmeleri için aktif katılım talep edeceğiz."
 CHI_shx_integration_cost:0 "[SHX.GetNameDef] Entegrasyon Maliyetini §G[?shx_integration_cost_reduction|%G0]§! kadar azaltır"
 CHI_sic_integration_cost:0 "[SIC.GetNameDef] Entegrasyon Maliyetini §G[?sic_integration_cost_reduction|%G0]§! kadar azaltır"
 CHI_sik_integration_cost:0 "[SIK.GetNameDef] Entegrasyon Maliyetini §G[?sik_integration_cost_reduction|%G0]§! kadar azaltır"
 CHI_sino_american_joint_commission_on_rural_reconstruction:0 "Amerikan Kırsal Yeniden Yapılanma Yardımı"
 CHI_sino_american_joint_commission_on_rural_reconstruction_desc:0 "Amerikan bağlantılarımızı kullanarak kırsal çabalarımızı köy okullarını da kapsayacak şekilde genişletmeli ve tüm ülke için iyi işleyen bir eğitim sistemini teşvik etmeliyiz."
 CHI_snd_integration_cost:0 "[SND.GetNameDef] Entegrasyon Maliyetini §G[?snd_integration_cost_reduction|%G0]§! kadar azaltır"
 CHI_socialize_major_industries:0 "Büyük Endüstrileri Millileştir"
 CHI_socialize_major_industries_desc:0 "Bazı bireylerin çok fazla servet ve güç biriktirmesine izin verdik, bu da kilit endüstrilerin yanlış ellere geçmesine neden oldu. Bu endüstrileri güvenli bir şekilde saklamak üzere devlet bakımına almalıyız."
 CHI_spreading_the_light_of_freedom:0 "Özgürlük Işığını Yaymak"
 CHI_spreading_the_light_of_freedom_desc:0 "Yabancı tehditlerden kurtulmak yolumuzdaki sadece ilk adımdır. Ayrıca iç tehditlerin ulusun iradesini ifade etmesini engellemediğinden emin olmalıyız."
 CHI_spreading_the_light_of_freedom_tt:0 "§YAsya ve Okyanusya§! ulusları içinde §YCumhuriyetçi Duyguları Kışkırtma§! kararlarının kilidini açar"
 CHI_start_looking_outwards:0 "Dışarıya Bakmaya Başla"
 CHI_start_looking_outwards_desc:0 "Geçmişte yapılan hata, dünyadan ayrı durabileceğimize inanmaktı. Sömürgeci uluslar bizi Asya'nın geri kalanıyla birlikte parçaladılar ve bizi onursuz bıraktılar. Bu cezasız kalamaz. Asya'nın geri kalanını güç birliği içinde durmak üzere organize edeceğiz."
 CHI_start_looking_outwards_tt:0 "Özgür Asya ülkelerini ittifakımıza davet edebileceğiz"
 CHI_state_aa:0 "Gökyüzüne Karşı Bir Kalkan"
 CHI_state_aa_desc:0 "Bu yeni dünyada düşman sadece karadan ve denizden değil, havadan da saldırıyor. İstilacıları uzak tutacaksak, silahlarımızı yukarı çevirerek gökyüzünden kaçınılmaz olarak gelecek saldırıya hazırlanmak zorunlu olacaktır."
 CHI_strengthening_our_resolve:0 "Kararlılığımızı Güçlendirmek"
 CHI_strengthening_our_resolve_desc:0 "Eski hizipler çekişiyor ve mevcut liderlik bizi birleştirecek kadar güçlü değil. Cumhuriyet'in dağılması değil, dayanması gerektiğinden rota değişikliğine ihtiyaç var."
 CHI_strike_at_what_is_weak:0 "Zayıf Olana Saldır"
 CHI_strike_at_what_is_weak_desc:0 "Güçle kafa kafaya karşılaşmayacağız. Bunun yerine, doktrinimiz düşmanın en savunmasız noktalarını hassasiyet ve ısrarla hedeflemeyi vurgulamalıdır."
 CHI_strike_from_below:0 "Aşağıdan Vur"
 CHI_strike_from_below_desc:0 "Almanya, denizden baskın bir gücün tehdidi altındaki bir ulusun çıkarlarını korumak için güçlü bir su altı filosuna güvenebileceğini kanıtladı. Kendimizi benzer bir durumda bulduğumuzda, dersler için Batı'ya bakacağız."
 CHI_subjugate_korea:0 "$PRC_subjugate_korea$"
 CHI_subjugate_korea_desc:0 "$PRC_subjugate_korea_desc$"
 CHI_take_a_stance_on_illicit_trade:0 "Yasadışı Ticarete Karşı Tavır Al"
 CHI_take_a_stance_on_illicit_trade_desc:0 "Çok uzun zamandır toplumumuza sızan zehrin ve onunla uğraşanların insafına kaldık. Yeni bir refah yüzyılına daha güçlü ve daha açık fikirli girmek için onun cazibesini reddetmeliyiz."
 CHI_take_advantage_of_dus_contacts:0 "Du'nun Bağlantılarından Yararlan"
 CHI_take_advantage_of_dus_contacts_desc:0 "Yeşil Çete liderinin pek çok yerde arkadaşı ve çok az kişinin sahip olduğu bir bilgi birikimi var. Böyle bir ağ, bazı karanlık karakterlere kar sağlasa bile, düzgün kullanırsak davamıza fayda sağlayabilir."
 CHI_take_control_of_the_executive_yuan:0 "Yürütme Yuanının Kontrolünü Ele Al"
 CHI_take_control_of_the_executive_yuan_desc:0 "Yasaları yapan güce sahiptir, ancak onları uygulayan onların yerini alabilir. Bakanlık pozisyonlarındaki insanlarımızla Chiangizm'e her seviyede karşı koyabileceğiz."
 CHI_take_control_of_the_executive_yuan_tt:0 "Yeni bir Savaş Lordu kuklalandığında, mevcut her Savaş Lordu Kuklası şunları kazanacaktır: §Y[?executive_yuan_autonomy_ratio|%]§! özerklik oranı"
 CHI_target_upper_society:0 "Üst Tabakayı Hedefle"
 CHI_target_upper_society_desc:0 "Toplumun üst kesimi uygun değerleri terk etti ve kozmopolit eğlenceye çok fazla ilgi duymaya başladı, oysa sıradan insan için ahlaki ve erdemli yaşamın bir örneği olarak durması gerekiyor. Bunu yaptığında, ruhun yeniden canlanmasıyla tüm ulusu yükseltebilir ve sadece maddi zenginlikleri aşabiliriz."
 CHI_the_4_defence_areas:0 "4 Savunma Bölgesi"
 CHI_the_4_defence_areas_desc:0 "Büyük ulusumuzu başarıyla savunacaksak, başarı için kapsamlı bir plan şarttır. Ülkeyi dört bölgeye ayıracağız ve her birine uygun bir komutan atayacağız, bu yerel güvenliği ve verimli direnişi garanti edecektir."
 CHI_the_burma_road:0 "Burma Yolu"
 CHI_the_burma_road_desc:0 "Yabancı müttefiklerimiz bizi maddi olarak destekleme isteklerini gösterdiler, ancak [JAP.GetName] askeri baskısı teslimatları zorlaştırıyor. Burma üzerinden bir rota kurmak, güneybatıdan alabileceğimiz materyal miktarını artırmamıza izin verecektir."
 CHI_the_freedom_to_abject:0 "Reddetme Özgürlüğü"
 CHI_the_freedom_to_abject_desc:0 "Eleştirilemeyen bir sistem asla büyüyüp gelişemez. [CHI.Getadjective] halkının zararına bazılarını zenginleştiren unsurları işaret eden insanları çok uzun süre ezdik. Bizi istikrarsızlaştırmadığı sürece sistemin eksikliklerini işaret etmeyi mümkün kılacak süreçlere ihtiyacımız var."
 CHI_the_german_mission:0 "Alman Misyonu"
 CHI_the_german_mission_desc:0 "On yılı aşkın bir süredir Almanya ile bağlantılarımız var ve işbirliğimizi genişletmek için özellikle Carsun Chang'in bağlantılarını kullanmalıyız."
 CHI_the_greater_game:0 "Büyük Oyun"
 CHI_the_greater_game_desc:0 "Emperyalistler oyunlarını orta Asya'da oynadılar, ancak bölgede sadece kafalarını duvara vurdular. Batıya yürümenin ve ordularımızı bozkırlardan bir kez daha geçirmenin zamanı geldi."
 CHI_the_hanoi_route:0 "Hanoi Rotası"
 CHI_the_hanoi_route_desc:0 "Doğu limanlarımız [JAP.GetNameDef] devletine karşı savunmasız ve önleyici tedbirler almalıyız. Kunming'den Hanoi çevresindeki ormanlara inen dağlardan gitmek zor bir yoldur, ancak sevkiyatlarımıza biraz soluk aldıracaktır. "
 CHI_the_hump_sea:0 "Kambur"
 CHI_the_hump_sea_desc:0 "Trenler, kamyonlar ve gemiler materyal teslimatı söz konusu olduğunda gayet iyi, ancak gelecek gökyüzünde. Yetenekli pilotlarla Himalayalar üzerinde uçabilir ve Yunnan'a inebiliriz, bu da teslimatlarımızı hiçbir şeyin durduramayacağı anlamına gelir."
 CHI_the_northern_mandate:0 "Kuzey Mandası"
 CHI_the_northern_mandate_desc:0 "Topraklarımızın kuzeyinde, [SOV.GetNameDef] devletinin harcadığı boş bir çorak arazi, işlenmemiş bir elmas yatıyor. Sadece toprağı gerçek potansiyeliyle görebilenler onu elinde tutmalı ve biz bunu yapıyoruz!"
 CHI_the_northwest_highway:0 "Kuzeybatı Otoyolu"
 CHI_the_northwest_highway_desc:0 "[SOV.GetnameDef] ile uzun bir sınırı paylaşıyoruz, bu yüzden iki rejimimiz arasında rahatsız edilmeden bir şeyler taşımak için bolca fırsat olduğu düşünülebilir. Ancak, bu bölgelerdeki altyapı en hafif tabiriyle yetersiz. [SOV.Getadjective] arkadaşlarımızdan daha fazlasını alabilmek için cephe hattından çok uzakta bir rota inşa etmeye odaklanmalıyız."
 CHI_the_seas_of_tomorrow:0 "Yarının Denizleri"
 CHI_the_seas_of_tomorrow_desc:0 "Çin'in yumuşak güç ve teknolojik hünerde dünyaya liderlik ettiği bir gelecek hayal ediyoruz. Sömürgeci güçlerin ve bölgesel rakiplerimizin geniş donanmalarını yakalamak için yıllar harcadık, ancak şimdi geleceğin rotasını kendimiz çizme zamanı."
 CHI_the_seas_of_tomorrow_tt:0 "Daha önce seçilen konuda uzmanlaşmış bir §YBilim İnsanı§! kullanıma sunulacak."
 CHI_the_sky_cannot_have_two_suns:0 "Gökyüzünde İki Güneş Olamaz"
 CHI_the_sky_cannot_have_two_suns_desc:0 "Komünist yıkıcılık Çin toplumunun dokusunu tehdit ediyor. Sadece üstünlüğümüzü kanıtlayarak ve davalarını yok ederek Çin hayatta kalacak, tek bir sancak altında birleşecek. İki güneş batabilir ama gün doğarken sadece biri doğacak."
 CHI_the_sky_cannot_have_two_suns_tt:0 "İttifakımızdaki aynı zamanda komünist olan her Savaş Ağası:\n   Ekle: §Y-%10.00§! ittifak nüfuzu"
 CHI_the_southern_mandate:0 "Güney Mandası"
 CHI_the_southern_mandate_desc:0 "Güneyde kaynaklar açısından zengin topraklar ve soydaşlarımız yatıyor. Antik bağlantılarımızdan dolayı bu topraklar üzerinde hakkımız var ve güneye yürümenin zamanı geldi."
 CHI_the_three_year_plan:0 "Üç Yıllık Plan"
 CHI_the_three_year_plan_desc:0 "Çabalarımız çok odaklanmamıştı ve ulusumuz rehberlikten yoksundu. Önümüzdeki yıllarda planlı bir çabayla enerjimizi tek bir büyük hedefe odaklayacağız. Umarız hiçbir şey buna engel olmaz."
 CHI_the_three_year_plan_tt:0 "§RBir savaşa girildiğinde kaldırılacaktır.§!"
 CHI_the_well_timed_swoop_of_a_falcon:0 "Bir Şahinin Zamanında Hamlesi"
 CHI_the_well_timed_swoop_of_a_falcon_desc:0 "Düşmanlarımızı vurma ve yok etme yollarında ustalaştık. İstilacıları kovmaktan onları kendi evlerinde vurmaya kadar, eski bilgiler zafere yürüdüğümüz bu güne kadar geçerliliğini koruyor!"
 CHI_tour_the_north:0 "Kuzeyi Gez"
 CHI_tour_the_north_desc:0 "Dağlık iç bölgeler komünist ajitasyonun merkezi haline geldi. Bunun devam etmesine izin verilemez ve illeri dolaşarak varlığımızı hissettirmeliyiz."
 CHI_tour_the_south:0 "Güneyi Gez"
 CHI_tour_the_south_desc:0 "Çin'in güneyi çeşitli ve dinamik bir yer, genellikle dünyaya açılan penceredir. Partimizin kurulduğu bu yer son zamanlarda daha fazla özerklik buldu ki bu tersine çevirmemiz gereken bir eğilim. Bu illeri ziyaret etmeliyiz!"
 CHI_tour_the_west:0 "Batıyı Gez"
 CHI_tour_the_west_desc:0 "Dağların ve çöllerin diyarında, eski İpek Yolu'nun yeri iktidar salonlarından uzaktır. [SOV.GetNameDefCap] bu bölgede nüfuzunu yayıyor ve bu yüzden yerel güç simsarlarının dikkatlerini nereye çevirmeleri gerektiğini bildiklerinden emin olacağız."
 CHI_toward_a_socialist_economy:0 "Sosyalist Bir Ekonomiye Doğru"
 CHI_toward_a_socialist_economy_desc:0 "Toplumumuzu gerçekten daha iyiye doğru değiştirmek için paranın akış şeklini değiştirmeli ve pozisyonlarını sadece adam kayırma yoluyla elde eden şirket başkanlarını görevden almalıyız. Çalışan adam ülkesinde bir kez daha söz sahibi olacak ve tüm [ROOT.GetAdjective] eşit olacak!"
 CHI_towards_a_popular_army:0 "Halkın Ordusuna Doğru"
 CHI_towards_a_popular_army_desc:0 "Silahlı kuvvetlerimiz teçhizat ve eğitimden yoksun, ancak sahip olduğumuz bir şey var o da insan. Yabancı işgalcileri Milli Devrim Ordusu olan asker duvarında kıracağız."
 CHI_towards_a_professional_army:0 "Profesyonel Bir Orduya Doğru"
 CHI_towards_a_professional_army_desc:0 "Ordumuz büyük, ancak etkinliği tartışmalı. Alman Askeri Danışmanlar Grubu, orduyu küçültmemizi ve yüksek moral ve savaş etkinliğine sahip daha küçük, daha iyi donanımlı bir güç oluşturmaya odaklanmamızı önerdi."
 CHI_train_for_asymmetry:0 "Asimetri İçin Eğitim"
 CHI_train_for_asymmetry_desc:0 "Savaş asla adil değildir ve olmasını asla bekleyemeyiz. Bizi boyunduruk altına almaya çalışacak daha güçlü ordulara sahip olanlar var ve şansları eşitlemenin bir yolunu bulmamız gerekiyor. Ordumuzu ve liderlerini savaşmanın yeni yollarını bulmaları için eğitmek zor olacak, ancak faydası yadsınamaz."
 CHI_train_for_asymmetry_guerilla_cost_tt:0 "§Y$PRC_guerilla_warfare_sea_cat$§! Kararlarını alma maliyetini §Gyarıya indirir§!"
 CHI_train_for_asymmetry_random_generals_tt:0 "Rastgele seçilen §YÜç§! ordu lideri §YGerilla Savaşçısı§! kazanacak: \n-$MODIFIER_DIG_IN_SPEED_FACTOR$: §G+%50§!"
 CHI_truly_free_speech:0 "Gerçek İfade Özgürlüğü"
 CHI_truly_free_speech_desc:0 "İnsanları fikirleri nedeniyle kovuşturmadan koruyor olsak da, söylem hala dar. Çoğulcu seslerin duyulabilmesi ve tavır alabilmesi için daha fazla insanı kamusal diyaloğa katılmaya teşvik etmeliyiz."
 CHI_tsr_a_new_chinese_identity:0 "Yeni Bir Çin Kimliği"
 CHI_tsr_a_new_chinese_identity_desc:0 "Çin'in kaderi artık ellerimizde olduğuna göre, konumumuzu güçlendirmeye çalışmalı ve değerli bir ortak olduğumuzu ve Sun Yat-Sen'in hayal ettiği gerçek Çin Cumhuriyeti olduğumuzu kanıtlamalıyız."
 CHI_tsr_adopt_the_twelve_symbols:0 "On İki Sembolü Benimse"
 CHI_tsr_adopt_the_twelve_symbols_desc:0 "On İki Sembol ulusal amblemi, Çin İmparatorluğu'nun devlet amblemiydi ve bir kez daha öyle olacak. On İki Süslemenin kadim sembollerine dayanarak ve onların gücüyle imparatorun otoritesi tüm ülkede bilinecek. Gök Mavisi Ejderha ve Fenghuang adına, İmparatorun iradesi yerine gelecek!"
 CHI_tsr_anti_communism:0 "Anti-Komünizm"
 CHI_tsr_anti_communism_desc:0 "Komünizm ulusumuz için bir beladır ve gerillalar yönetimimizin yan tarafında bir yaradır. Bu ideolojiye karşı savaşmalı ve davamız için canımızı vermek anlamına gelse bile onu sona erdirmeliyiz."
 CHI_tsr_coronation_at_the_temple_of_heaven:0 "Cennet Tapınağı'nda Taç Giyme Töreni"
 CHI_tsr_coronation_at_the_temple_of_heaven_desc:0 "Otoritemizi inşa etmek için, [ROOT.GetLeader] devlet Konfüçyüsçülüğünün unsurlarını yeniden tesis etmeyi ve Qing devlet dini törenlerini canlandırmayı gözetmelidir. Bu nedenle, Qing Cennet Tapınağı'nda düzenlenen ritüellere imparator olarak katılmak ve sonunda orada taç giymek [ROOT.GetLeader]'ın en büyük çıkarınadır."
 CHI_tsr_deepen_our_collaboration:0 "İşbirliğimizi Derinleştir"
 CHI_tsr_deepen_our_collaboration_desc:0 "Japon İmparatorluğu'nun rehberliğinde işgalcilerimize karşı büyük başarılar elde ettik. Birleşik bir Asya hedefimizin gerçekleşmesini sağlamak için onlarla işbirliğimizi derinleştirmeye çalışmalıyız."
 CHI_tsr_embrace_japanese_cultural_institutions:0 "Japon Kültürel Kurumlarını Benimse"
 CHI_tsr_embrace_japanese_cultural_institutions_desc:0 "Yabancı işgalcilere karşı birleşik bir Asya hedefiyle Japonlarla daha iyi bir işbirliği sağlamak için, bizi birbirimize daha da yakınlaştıracak Japon kültürünün parçalarını benimseyerek birleşik bir kültür oluşturmalıyız."
 CHI_tsr_embrace_japanese_cultural_institutions_tt:0 "§Y$RNG_state_shintoism_dm$§! Milli Ruhunu geliştirmek için kararları açar"
 CHI_tsr_establish_the_tewu:0 "Tewu'yu Kur"
 CHI_tsr_establish_the_tewu_desc:0 "Muhalifleri bulmak için sadece Japon gizli servislerine güvenmemeliyiz, bu yüzden kendimizinkini yaratmalıyız. Japon danışmanların yardımıyla sadece kendi casuslarımızı eğitmekle kalmayacak, aynı zamanda çok geçmeden kendi teşkilatımıza sahip olabileceğiz."
 CHI_tsr_expand_the_nanjing_army:0 "Nanjing Ordusunu Genişlet"
 CHI_tsr_expand_the_nanjing_army_desc:0 "Mevcut kuvvetlerimizin onda birinden fazlasının bize sadık olmasını bekleyemeyiz, bu yüzden bunun karşısında büyük liderimizin rehberliğinde gerçekten sadık bir güç yaratmaya çalışmalıyız."
 CHI_tsr_five_races_under_one_union:0 "Bir Birlik Altında Beş Irk"
 CHI_tsr_five_races_under_one_union_desc:0 "Yeni hanedanımız önümüzdeki yıllarda hayatta kalacaksa, Yuan Shikai'nin iktidara geldiği Cumhuriyetin ilkelerini dahil etmeliyiz. Beş renkli cumhuriyet ilkeleri sayesinde, bölgedeki farklı grupların tek bir ulus altında uyumlu bir şekilde bir arada yaşaması sağlanabilir."
 CHI_tsr_form_a_preparatory_committee:0 "Hazırlık Komitesi Oluştur"
 CHI_tsr_form_a_preparatory_committee_desc:0 "Devlet başkanlığı için rekabet etmenin dezavantajları önce ortadan kaldırılmadıkça, ülke asla huzura kavuşamayacaktır. Bu nedenle, 19 Ağustos 1915'te yapıldığı gibi, anayasal bir monarşi kurmak amacıyla bir hazırlık komitesi kurulmalıdır. Ancak o zaman iç çekişmelerimiz ve siyasi kaosumuz gerçekten ortadan kaldırılabilir!"
 CHI_tsr_industrial_expansion_cooperation:0 "Endüstriyel Genişleme"
 CHI_tsr_industrial_expansion_cooperation_desc:0 "Bir endüstri ve onu destekleyecek kaynaklar olmadan Çin asla bir ulus olarak gelişemez. Batı'ya karşı duracaksak endüstriyel yeteneklerimizi geliştirmeye çalışmalıyız."
 CHI_tsr_legacy_of_the_hongxian_emperor:0 "Hongxian İmparatorunun Mirası"
 CHI_tsr_legacy_of_the_hongxian_emperor_desc:0 "Yuan Shikai ulusu savaş ağaları ve cumhuriyetçi coşkuyla dolu korkunç bir durumda bırakmış olabilir, ancak niyetleri iyiydi. Böylece ulusal Anayasal Bolluğu bahşetmek için Hongxian İmparatoru rolünü üstlendi ve Ulusal Koruyucusu oldu. Eğer herhangi bir adam saygıya layıksa o odur ve zamanla unutulmadan önce mirasını canlandırmaya çalışmalıyız."
 CHI_tsr_military_industrial_collaboration:0 "Askeri İşbirliği"
 CHI_tsr_military_industrial_collaboration_desc:0 "Ordumuz personel ve teçhizat açısından yetersiz, büyük bir kısmı sadece ele geçirilen teçhizatla çalışıyor. Japonlarla işbirliği yaparak ve kendi cephaneliğimizi kurarak bu hatayı düzeltmeye çalışmalıyız."
 CHI_tsr_national_construction:0 "Ulusal İnşa"
 CHI_tsr_national_construction_desc:0 "Yeni bir endüstriyel genişleme dalgası görmezsek Çin asla gerçekten gelişemeyecektir. Onu destekleyecek bir omurga olmadan, Çin'in olması gereken ulus olmayı asla gerçekten başaramayacağız."
 CHI_tsr_never_another_national_protection_war:0 "Bir Daha Asla Ulusal Koruma Savaşı Olmayacak"
 CHI_tsr_never_another_national_protection_war_desc:0 "Ulusal Koruma Savaşı 1915 ile 1916 yılları arasında gerçekleşti ve sadakatsiz generaller ve cumhuriyetçiler tarafından Hongxian İmparatoru'nun meşru yönetimini devirmek için bir girişimdi. Bunun bir daha asla olmamasını sağlamak için, özerk savaş ağalarına ve bağımsız ordulara hızla baskı yapmalı ve tüm gücün göğün oğlunun elinde olduğundan emin olmalıyız!"
 CHI_tsr_our_place_in_the_sphere:0 "Küre İçindeki Rolümüz"
 CHI_tsr_our_place_in_the_sphere_desc:0 "Japonya'nın sadece uydusu değil gerçek bir ortağı haline geldiğimize göre, Ortak Refah Küresi ve bir bütün olarak Büyük Doğu Asya içindeki yerimizi bulmaya çalışmalıyız. Çin bir kez daha küresel bir güç olacak!"
 CHI_tsr_outlaw_the_kmt_and_cpc:0 "KMT ve ÇKP'yi Yasakla"
 CHI_tsr_outlaw_the_kmt_and_cpc_desc:0 "Cumhuriyetçilik Çin'in ulusal koşullarına uygun değildir. Bu nedenle, bir zamanlar İmparatorluğu deviren ve küllerinden doğan devrimci unsurların tekrar tutunmasına izin verilmemelidir. Ülke ancak birleşik bir liderlik altında eski şanına kavuşabilir ve bu nedenle iç muhalefetle hızla ilgilenilmelidir."
 CHI_tsr_pan_asianism:0 "Pan-Asyacılık"
 CHI_tsr_pan_asianism_desc:0 "Japonların kardeş bir ulusu olduğumuz ve Sun Yat-Sen bir zamanlar Asya uluslarının sömürgecileri kovmak için birleşmeleri gerektiğine hükmettiği için pan-Asyacılık ideallerini benimsememiz doğaldır. Bu savaş sadece Çin'de bir mücadele değil, batılıları ulusumuzdan kovmayı amaçlayan daha büyük bir mücadeledir."
 CHI_tsr_peace:0 "Barış"
 CHI_tsr_peace_desc:0 "Kısa vadede bu ilkeye ihanet etmek anlamına gelse bile, ne pahasına olursa olsun barış için çabalamalıyız. Çin'in refahının önünde duran herkesi yenmeliyiz."
 CHI_tsr_promote_tridemism:0 "Tridemizmi Benimse"
 CHI_tsr_promote_tridemism_desc:0 "Sun Yat-Sen tarafından ana hatları çizilen Halkın Üç İlkesi Milliyetçilik, Demokrasi ve Halkın Geçimidir. Devletimizin doğasını daha iyi temsil etmek için kendi ilkelerimizi benimserken onun mirasını sürdürmeye çalışmalıyız."
 CHI_tsr_reclaim_the_mandate_of_heaven:0 "Göklerin Yetkisini Talep Et"
 CHI_tsr_reclaim_the_mandate_of_heaven_desc:0 "İmparatorluk Başkentini geri almak için yaptığımız savaşlardaki önceki zaferlerimiz, göklerin İmparatoru adil ve Göksel Tahta layık bulduğunu açıkça ortaya koydu. Onun tüm Çin'in meşru hükümdarı olmadığına dair herhangi bir şüphe, böylesine ezici kanıtlar karşısında yok olmalıdır."
 CHI_tsr_reestablish_the_beiyang_army:0 "Beiyang Ordusunu Yeniden Kur"
 CHI_tsr_reestablish_the_beiyang_army_desc:0 "Kuzey Okyanusu Ordusu 1895'te Yuan Shikai tarafından kuruldu ve Qing'in eski askeri sisteminin genel revizyonunun merkezi olarak hareket etti. Kuomintang tarafından kurulan sistemin doğasında var olan yolsuzluk ve verimsizliklerden kaçınmak için aynısını yapmalı ve orduyu elden geçirmeliyiz."
 CHI_tsr_reestablish_the_wuwei_corps:0 "Wuwei Kolordusunu Yeniden Kur"
 CHI_tsr_reestablish_the_wuwei_corps_desc:0 "Wuwei Kolordusu, Çin-Japon Savaşı'ndaki yenilgilerinin ardından modern silahlarla donatılmış batı tarzı bir ordu yaratmak için Qing imparatorluk mahkemesinin bir girişimi olarak oluşturulan, Pekin'in ve Yasak Şehir'in fiili güvenlik gücüydü. İmparatorun hayatını ve göklerin şehrini korumak için benzer önlemler almalıyız."
 CHI_tsr_reestablish_xinhua_palace:0 "Xinhua Sarayını Yeniden Kur"
 CHI_tsr_reestablish_xinhua_palace_desc:0 "Tahta çıkışı üzerine Yuan Shikai, Yasak Şehir'in yanındaki Zhongnanhai konutunu Yeni Çin Sarayı olarak yeniden adlandırdı. İkamet yeri olarak burayı seçen [ROOT.GetLeader]'ın da aynı yaklaşımı benimsemesi ve onun izinden gitmesi uygun görünüyor."
 CHI_tsr_reinstate_the_new_imperial_code:0 "Yeni İmparatorluk Kanununu Yeniden Yürürlüğe Koy"
 CHI_tsr_reinstate_the_new_imperial_code_desc:0 "Tahta çıkışı sırasında Yuan'ın hukuk danışmanı Ariga Nagao, Japon İmparatorluk Modelini temel alan Yeni İmparatorluk Kanununu hazırladı. Böylesine haydut bir devletin yasal temelini özellikle yakından takip etmek istemesek de, amaçlanan etkiye sahip olacağı açıktır. Bu amaçla, bu kanuna dayalı yeni bir anayasa hazırlamaya bakmalıyız."
 CHI_tsr_repoen_the_natioal_assembly:0 "Millet Meclisini Yeniden Aç"
 CHI_tsr_repoen_the_natioal_assembly_desc:0 "Millet Meclisi, Beiyang hükümetinin yasama organıydı, Yuan Shikai tarafından tamamen kapatıldı ve daha sonra yerine Yasama Yuan'ı geçti. Ülkede gerçekten özgür ve demokratik bir yasama organı istiyorsak, sadece Yuan'ın faaliyetine devam etmesine izin vermekle yetinemeyiz. Halkın iradesinin üstün gelmesini sağlamak için çok yönlü bir sistem kurulmalıdır!"
 CHI_tsr_restoration_of_the_chinese_empire:0 "Çin İmparatorluğu'nun Restorasyonu"
 CHI_tsr_restoration_of_the_chinese_empire_desc:0 "Ulusumuzu restore etme ve onu katlanmak zorunda kaldığı aşağılanma yüzyılının dışına çıkarma zamanı geldi. Uluslararası ilişkilerde yerimizi alma ve evrende kahramanca durma zamanı. [ROOT.GetLeader] için Çin İmparatorluğu'nun Büyük İmparatoru rolünü üstlenme zamanı!"
 CHI_tsr_the_reorganied_government:0 "Yeniden Düzenlenmiş Hükümet"
 CHI_tsr_the_reorganied_government_desc:0 "[CHI.GetLeader] Rejiminin Çöküşü ve batıya korkakça geri çekilmeleriyle meşru Çin devleti olarak duruyoruz. Bunu teyit etmek için [ROOT.GetLeader], Sun Yat-Sen'in mezarını ziyaret etti ve bir zamanlar kurduğu cumhuriyetçi ilkeleri destekleyeceğini ilan etti."
 CHI_tsr_tianxia:0 "Tianxia"
 CHI_tsr_tianxia_desc:0 "Bu dünyadaki tüm topraklar, evrensel ve iyi tanımlanmış düzen ilkeleriyle göksel hükümdarımıza atanmıştır. Bu toprakların merkezi [ROOT.GetAdjective] sarayı ve İmparator olmalıdır. Orta krallık ve insan medeniyetinin gerçek beşiği olarak yerimizi talep etme zamanı nihayet geldi!"
 CHI_tsr_zhonghua_minzu:0 "Zhonghua Minzu"
 CHI_tsr_zhonghua_minzu_desc:0 "Başarılı bir devlet inşa etmeye devam etmek için, ulus inşası ve aidiyet kavramlarıyla bağlantılı olarak Çin milliyetçiliğini canlandırmalıyız, böylece halkımıza [ROOT.GetNameDef] İmparatoruna ve hükümetine sadık olma yükümlülükleri olduğunu etkili bir şekilde göstermeliyiz."
 CHI_tungsten_and_antimony_extraction:0 "Tungsten ve Antimon Çıkarımı"
 CHI_tungsten_and_antimony_extraction_desc:0 "Stratejik metaller stratejik zaferler kazandırır ve cevherleri topraktan çıkarabilirsek büyük fayda sağlayabilecek geniş yataklarımız var."
 CHI_turn_a_blind_eye:0 "Görmezden Gel"
 CHI_turn_a_blind_eye_desc:0 "Bazı gayri resmi ticaretin Çin toplumunun yapısı üzerinde zararlı bir etkisi olduğu kabul edilebilir. Ancak, bu ticaretin karları inkar edilemez ve eğer oluruna bırakırsak büyük servet kazanabiliriz."
 CHI_unify_as_the_china_democratic_league:0 "Çin Demokratik Birliği Olarak Birleş"
 CHI_unify_as_the_china_democratic_league_desc:0 "Ayrı küçük gruplar olarak Kuomintang'a karşı duramayız, ancak birleşirsek bir şansımız olabilir. Peki, bize kim liderlik edecek?"
 CHI_unify_the_admissions_process:0 "Kabul Sürecini Birleştir"
 CHI_unify_the_admissions_process_desc:0 "Yüksek öğrenim sistemimiz birkaç bölgeye bölünmüş durumda ve başvuru süreci karmaşık ve parçalı. Süreci ortak bir giriş sınavı olarak yeniden yapılandırırsak, her yetkin öğrenci için yer olduğundan emin olacağız."
 CHI_unlock_faction_goal_north_subjugated_tt:0 "Bu alınan ilk gezi hedefi ise, §Y$faction_goal_north_subjugated_name$§! ittifak hedefinin kilidi açılacaktır."
 CHI_unlock_faction_goal_south_subjugated_tt:0 "Bu alınan ilk gezi hedefi ise, §Y$faction_goal_south_subjugated_name$§! ittifak hedefinin kilidi açılacaktır."
 CHI_unlock_faction_goal_west_subjugated_tt:0 "Bu alınan ilk gezi hedefi ise, §Y$faction_goal_west_subjugated_name$§! ittifak hedefinin kilidi açılacaktır."
 CHI_utilise_the_terrain:0 "Araziden Yararlan"
 CHI_utilise_the_terrain_desc:0 "Tümenlerimiz en son teçhizatla donatılmamış, ne de tek tip bir eğitim standardına sahipler, ancak derinden bildiğimiz bir şey varsa o da kendi topraklarımızdır. Her su yolunu, tepeyi ve tarlayı avantajımıza kullanabilir ve böylece işgal etmeye cüret eden herkesin deneyimini yaşayan bir cehenneme çevirebiliriz."
 CHI_utilize_german_contacts:0 "Alman Bağlantılarını Kullan"
 CHI_utilize_german_contacts_desc:0 "Doğulu barbarların doymak bilmez bir kana susamışlığı olsa da, aralarında bizden olmasa da mantığı dinleyebilenler var. Avrupa'daki ortak bağlantılarımıza ulaşarak, daha ateşli kafaların duygularını yatıştırmalarını sağlayabiliriz."
 CHI_utilize_german_contacts_tt:0 "Sovyet karşıtı anlaşmalar hakkındaki [GER.GetAdjective] taleplerini kabul edersek, [GER.GetNameDef] bizim adımıza araya girmeye daha istekli olacaktır."
 CHI_utilize_german_contacts_wang_tt:0 "[CHI.GetLeader] aracılığıyla bağlantılarımızı kullanarak şunları elde edeceğiz:"
 CHI_utilize_the_albazinian_contact:0 "Albazinli Bağlantısını Kullan"
 CHI_utilize_the_albazinian_contact_desc:0 "Piskopos Symeon Du, Çin Ortodoks Kilisesi'nin şu anki başdiyakonudur. Çin'in her yerini dolaşmış bir Albazinli olarak Piskopos, eski Beyaz Rus güçlerinin birçok üyesiyle yakın temas halindedir. Belki Rusları ulusumuza yardım göndermeye ikna edebilir?"
 CHI_utilize_the_albazinian_contact_tt:0 "[SOV.GetNameDef] devletinden artan destek talep etme kararlarının kilidini açar"
 CHI_victory_over_the_invaders:0 "İşgalcilere Karşı Zafer"
 CHI_victory_over_the_invaders_desc:0 "Yabancı işgalciler yenildi ve şanlı Milli Devrim Ordumuz muzaffer. Bu savaş ve daha da önemlisi, onurlu liderimiz [root.GetLeader], farklı illerimizi ve halkımızı beyaz güneşin altında tek bir ulus haline getirdi!"
 CHI_warlord_integration_cost_reduction:0 "§YSavaş Ağalarına tebaamız olmaları için Baskı Yapma§! Maliyetini £GFX_influence_texticon §G-%5§! ve £pol_power §G-50§! azaltır"
 CHI_weaponise_the_faithful:0 "İnananları Silahlandır"
 CHI_weaponise_the_faithful_desc:0 "En hararetle inananlar en şiddetli şekilde savaşacaktır. Şu anda bunlar için bir çıkış yolumuz yok, ancak bir tane yapabilir ve onları ilk sıraya koyabiliriz. Onların bağlılığı en keskin kılıcımız olacak ve her düşmanı kesecek."
 CHI_weaponise_the_hongmen:0 "Çeteleri Silahlandır"
 CHI_weaponise_the_hongmen_desc:0 "Liman bölgelerimizde zaten öz savunma eğitimi almış gizli topluluklar var ve bunları düşmanımızın üzerine salabiliriz. Onlara yeterince destek verin, topraklarımızı ihlal etmeye cüret eden herhangi bir işgalciye büyük zarar verebilirler."
 CHI_weaponise_the_hongmen_tt:0 "İşgal altındaki her Çin kıyı eyaleti ve büyük şehri olan eyalet:\n  Direniş: §R+%30.0§!"
 CHI_whampoa_ideological_primacy:0 "Whampoa İdeolojik Üstünlüğü"
 CHI_whampoa_ideological_primacy_desc:0 "Whampoa'dan subaylarımız sadece silah değil, ilkeler de taşır. Diğer okulların öğretilerinin aksine, Whampoa'nınkiler güvenilirdir. Bir bütün olarak ulusumuzu güçlendirmek için tüm ideolojik eğitimi okul üzerinden kanalize etmeliyiz."
 CHI_women_in_the_war_effort:0 "Savaş Çabasında Yeni Kadın"
 CHI_women_in_the_war_effort_desc:0 "Dört Mayıs Hareketi'nden bu yana, kadınların toplumdaki rolleri sonsuza dek değişti. Moderniteyi ve ülke sevgisini benimseyen kadınlar da katkıda bulunabilmelidir. Kadın taburları organize etmek ve onları silahlı kuvvetlere entegre etmek bize çok yardımcı olacaktır."
 CHI_yun_integration_cost:0 "[YUN.GetNameDef] Entegrasyon Maliyetini §G[?yun_integration_cost_reduction|%G0]§! kadar azaltır"
 CHI_zhonghua_minzu_focus:0 "Zhonghua Minzu"
 CHI_zhonghua_minzu_focus_2_tt:0 "Etkili değişiklik: §Y$CHI_the_political_tutelage_dm$§! yerine §Y$CHI_the_political_tutelage_upgraded_dm$§! gelir."
 CHI_zhonghua_minzu_focus_desc:0 "Savaş ağaları ve bölge valileri tekrar kontrolümüz altına alındığına göre, düzgün bir yeniden birleşmeye başlama ve dışarıya bakma zamanı geldi. Haklı topraklarımızın çoğu milliyetçi güruh ve yabancı güçler tarafından kaybedildi ve şimdi onları cumhuriyetin ışığına geri getirmek için elimizden gelen her şeyi yapmalıyız."
 CHI_zhonghua_minzu_focus_tt:0 "[MON.GetFlag] §Y[MON.GetAdjective]§!, [TAN.GetFlag] §Y[TAN.GetAdjective]§! ve [TIB.GetFlag] §Y[TIB.GetAdjective]§! eyaletlerini ana vatan yapma kararlarının kilidini açar"
 GER_unlock_national_nuclear_corporation_tt:0 "§Y$PRC_china_national_nuclear_corporation$§! Endüstriyel Şirketinin kilidini açar"
 GXC_declare_opposition:0 "Muhalefet İlan Et"
 GXC_declare_opposition_desc:0 "Zaman geldi. Merkezi Hükümete muhalefetimizi ilan etmeli ve onları müzakereye zorlamak ya da kesin olarak devirmek için kuzeye yürümeliyiz. Bundan sonra ne olacağı belirsiz ama başarısız olsak bile yine de güçlü bir mesaj göndermiş olacağız!"
 GXC_denounce_chiang:0 "Chiang Kai-Shek'i Kına"
 GXC_denounce_chiang_desc:0 "Chiang Kai-Shek'in poz kesmesi ve Japonlara karşı herhangi bir direniş gösterememesi, onun zayıf ve yönetmeye uygun olmadığını kanıtladı. Onu kınamalı ve zayıf olmayan alternatif bir çözüm sunmalıyız."
 GXC_formation_of_the_nraja:0 "JKUDO'nun Oluşumu"
 GXC_formation_of_the_nraja_desc:0 "Japonların topraklarımızı yavaş yavaş ele geçirmesini önleyeceksek, silahlı direniş örgütlemekten ve Nanjing'e yürümekten başka çaremiz olmadığını bir kez daha gördük. Bu nedenle Japon Karşıtı Ulusal Devrimci Ordu'yu kurmalı ve Hunan'a karşı yürümeye hazırlanmalıyız."
 GXC_question_chiangs_authority:0 "Chiang'in Otoritesini Sorgula"
 GXC_question_chiangs_authority_desc:0 "Chiang Kai-Shek son zamanlarda bizi dizginlemek için illerimiz üzerinde daha fazla nüfuz kurmaya çalışıyor. İşlevsel olarak bağımsız olduğumuz için üzerimizde gerçekten herhangi bir otoritesi olup olmadığını sorgulamalıyız."
 GXC_rumors_of_deposition:0 "Devrilme Söylentileri"
 GXC_rumors_of_deposition_desc:0 "Etrafta Chiang Kai-Shek'in Chen Jitang'ı çok bağımsız gördüğü ve bu nedenle onu istifaya zorlayarak ili dizginlemeye çalıştığına dair söylentiler dolaşıyor. Eğer bu doğruysa son derece endişe verici ve derhal harekete geçmeliyiz!"
 GXC_the_japanese_visit:0 "Japon Ziyareti"
 GXC_the_japanese_visit_desc:0 "Japonlar, Merkezi Hükümete muhalefetimizin Çin'de daha fazla genişlemenin önünü açacağını umarak, bir süredir iki devletimize de oldukça ilgi duyuyorlar. Japonlarla aynı fikirde olmasak ve topraklarımıza ilerlemelerine şiddetle karşı çıksak da, sundukları hediyeleri kabul etmek akıllıca olacaktır, böylece zamanı geldiğinde kendi silahlarını onlara karşı kullanabiliriz."
 GXC_the_scorched_earth_speech:0 "Yakıp Yıkma Konuşması"
 GXC_the_scorched_earth_speech_desc:0 "Merkezi Hükümet Japonlara karşı çok yumuşak davranıyor. Onlarla son adama kadar savaşmalı, geri çekilmek zorunda kalırsak dünyayı yakmalıyız. Bedeli ne olursa olsun, Japon İmparatorluğu asla tüm Çin'i kontrol etmemeli."
 JAG_chinese_neutality_pact_focus_days_tt:0 "Mevcut gün sayısı: [?JAP_chinese_japanese_neutrality_pact_flag:days|Y0]"
 JAG_hokushin_ron_focus_days_tt:0 "Mevcut gün sayısı: [?JAP_hokushin_ron_started_flag:days|Y0]"
 JAG_nanshin_ron_focus_days_tt:0 "Mevcut gün sayısı: [?JAP_nanshin_ron_started_flag:days|Y0]"
 JAG_neutality_pact_focus_days_tt:0 "Mevcut gün sayısı: [?JAP_soviet_japanese_neutrality_pact_flag:days|Y0]"
 JAP_7075_aluminium_alloy:0 "7075 Alüminyum Alaşımı"
 JAP_7075_aluminium_alloy_desc:0 "Modellerimiz geldiklerinde düşmanla rekabet edemezse menzil tek başına işimize yaramaz. Asla manevra dışı bırakılamamaları için üstün çevikliğe sahip uçaklar üretmeliyiz. Mitsubishi'deki mühendislerimiz, bildiğimiz uçak yapımında devrim yaratacak yeni bir Alüminyum Alaşımı geliştirdiler."
 JAP_CHI_pact_is_active_flag:0 " Çin-Japonya İttifakı Yürürlükte"
 JAP_MAN_accepted_our_proposal_for_integration:0 "§Y[MAN.GetNameDefCap]§! birleşme teklifimizi kabul etti"
 JAP_a_common_currency_for_all_of_asia:0 "Tüm Asya İçin Ortak Bir Para Birimi"
 JAP_a_common_currency_for_all_of_asia_desc:0 "Uluslararası koordinasyonumuzun bir parçası olarak, tüm devrimci devletlerin resmi para birimi olarak yen'i benimsemesi için çabalamalıyız, böylece bir gümrük ve ticaret birliği düzgün bir şekilde kurulabilir."
 JAP_a_free_asia_pacific:0 "Özgür Bir Asya-Pasifik"
 JAP_a_free_asia_pacific_desc:0 "Tüm Asya'daki insanların, refahlarını çok az önemseyen yabancılar ve hükümetler tarafından sömürülmeden hayatlarını özgürce yaşayabilecekleri gün nihayet geldi. Çok yaşa [ROOT.GetNameDef] ve çok yaşa Asya işçileri!"
 JAP_a_functionalist_housing_policy:0 "İşlevselci Bir Konut Politikası"
 JAP_a_functionalist_housing_policy_desc:0 "Teorisyenlerimiz, hükümet yetkilileri tarafından denetlenecek toplu konut olarak kullanılmak üzere belirli bir tarzda büyük apartman veya ev kümeleri kurmak için yeni bir plan hazırladılar. İşlevsellik düşünülerek yapılan inşaatla, daha fazla insan devlet genelinde daha ucuz konutlara ulaşabilecek."
 JAP_a_green_persimmon:0 "Yeşil Bir Trabzon Hurması"
 JAP_a_green_persimmon_desc:0 "Güçlerimiz [SOV.GetNameDef] ile savaşa henüz tam olarak hazır değil ve dikkatleri batıya yeterince yönlendirilmedi. Tüm bunlara rağmen, şimdi saldırmalıyız, yoksa şans elimizden sonsuza dek kaçabilir..."
 JAP_a_mongol_volunteer_army:0 "Moğolistan Bağımsızlık Ordusunu Reforme Et"
 JAP_a_mongol_volunteer_army_1_tt:0 "Onları kendi tarafımıza çekmek ve hükümete karşı darbe yapmak amacıyla §YMoğolistan'ı İstikrarsızlaştır§! kararlarının kilidini açar"
 JAP_a_mongol_volunteer_army_desc:0 "Mançurya ordusu içinde, [ROOT.GetAdjective] danışmanlar tarafından yönetilen Moğollar ve haydutlardan oluşan bir Moğolistan Bağımsızlık Ordusu var. Tamamen kendi kontrolümüz altında benzer bir ordu kurmalı ve sonunda onları [MON.GetNameDef] devletine gönderip vatanlarını düşman güçlerden kurtarma hedefi gütmeliyiz."
 JAP_a_mongol_volunteer_army_tt:0 "Eğer §Y[MAN.GetName]§! veya §Y[MEN.GetName]§! müttefikimizse, onlar da bu ruhu kazanacak"
 JAP_a_new_take_on_state_shintoism:0 "Seküler Tapınak Teorisini Teşvik Et"
 JAP_a_new_take_on_state_shintoism_desc:0 "Meiji hükümeti zamanında ortaya çıkan ve Jinja hishūkyōron olarak adlandırılan dini politika ve siyasi teori, Şinto Tapınaklarının dini olmaktan çok doğaları gereği seküler olduğu ve Şinto'nun sadece Japon milli geleneklerinin seküler bir seti olduğu fikrini teşvik eder. Bu hareketi kendi yararımıza kullanabilmemiz için bu teoriyi teşvik etmeye devam etmeliyiz."
 JAP_a_pan_asian_diet:0 "Bir Pan-Asya Meclisi"
 JAP_a_pan_asian_diet_desc:0 "Asya'nın devrimci devletlerini birbirine daha da yakınlaştırmak için, tüm üye devletlerden temsilcilerin yer aldığı ve kardeş cumhuriyetlerimizde hangi yasaların ve kurumların uygulanacağını oyladıkları bir hükümet organı kurmalıyız."
 JAP_a_red_dawn_over_asia:0 "Asya Üzerinde Kızıl Bir Şafak"
 JAP_a_red_dawn_over_asia_desc:0 "Güçlerimiz muzaffer ve sınırlarımız Pasifik Okyanusu'nun geniş kısımlarına yayılmışken, devrim zafere daha önce hiç olmadığı kadar yakın. Kızıl güneş gökyüzünü aydınlatıyor, şafak Asya için yeni bir çağın habercisi!"
 JAP_a_red_sun_rises_for_a_new_era:0 "Yeni Bir Çağ İçin Kızıl Güneş Doğuyor"
 JAP_a_red_sun_rises_for_a_new_era_desc:0 "Devrim muzaffer oldu, gün kazanıldı! Devrim karşıtı hücrelerin son kalıntılarının da yenilmesiyle, şimdi devleti sosyalist bir şekilde yeniden düzenlemeye başlamalıyız. Ancak parti içinde bunun nasıl yapılması gerektiği konusunda büyük anlaşmazlıklar var. Bu nedenle, devletimizin gelecekteki gidişatına karar vermek için büyük bir tartışma yapmalıyız."
 JAP_a_truly_righteous_army:0 "Gerçekten Erdemli Bir Ordu"
 JAP_a_truly_righteous_army_desc:0 "[ROOT.GetAdjective] İmparatorluk Ordusu sadece fetih veya şan için savaşmaz. İmparatoru, ulusu, idealleri ve halkı için savaşır. Her asker bunları bilmeli ve görev başında yaptığı her şeyin İmparator ve halkına yansıdığını ve Majesteleri için her türlü fedakarlığa değeceğini fark etmelidir."
 JAP_a_worthy_succssor_of_meiji:0 "Meiji'nin Layık Bir Halefi"
 JAP_a_worthy_succssor_of_meiji_desc:0 "İkinci bir Meiji Restorasyonu benzeri bir şey gerçekleştirildiğine göre, İmparatorumuz bir kez daha ülkedeki en güçlü adam olarak oturuyor. Bu milli devrimin ideallerine uygun yaşamak ve yeni bir [ROOT.GetAdjective] rönesansı getirmek için endüstrilerimizi ve bilimlerimizi modernleştirmeye çalışmak akıllıca olabilir."
 JAP_abe_isoo_focus:0 "Abe Isoo'nun Başbakanlığı"
 JAP_abe_isoo_focus_desc:0 "Shakai Taishūtō'nun şu anki lideri ve Japon beyzbolunun babası Abe Isoo, yeni anayasamızın kurulmasını zorlayacak yeni bir kabine kurmaya teşvik edilmelidir. Bununla birlikte, artık geçici bir başbakanımız olmayacak ve çatışma başlamadan önceki düzen nihayet yeniden sağlanacak."
 JAP_achieving_joubukkokudo:0 "Jobukkokudo'yu İlan Et"
 JAP_achieving_joubukkokudo_desc:0 "Doğu Asya Mahayana devletlerinin başkentlerinin birleşmesiyle, yeni Budist sosyalist idealler aracılığıyla ruhsal kurtuluşumuzun yanı sıra sosyal ve ekonomik özgürlüğümüzün de tamamlanacağı bir Arı Diyar yaratma arayışımız sona eriyor. Girō Seno'o'ya övgüler olsun ve çok yaşa Jōbukkokudo!"
 JAP_adopt_new_air_doctrine:0 "Yeni Hava Doktrinini Benimse"
 JAP_adopt_new_air_doctrine_desc:0 "Artık bizimle aynı teknolojik yeteneklere sahip düşmanlarla karşı karşıya olduğumuza göre, ayak uydurmak için muharebe doktrinlerimizi de modernleştirmemiz gerektiğini fark ettik."
 JAP_adopt_new_assault_doctrine:0 "Yeni Saldırı Doktrinini Benimse"
 JAP_adopt_new_assault_doctrine_desc:0 "General Shunroku Hata, muharebede düşmanı kesin olarak yenmek için yeni bir yol önerdi. Büyük miktarda topçu kullanarak, düşmanı boyun eğene kadar bombalayabilmeliyiz ve ardından işi bitirmek için sadece morali bozuk ve paramparça olmuş kalıntılara hücum etmemiz gerekecek."
 JAP_adopt_syndicalist_ideas:0 "Sendikalist Fikirleri Benimse"
 JAP_adopt_syndicalist_ideas_desc:0 "Endüstrilerimizde sendikalist kooperatifler kurma fikirlerini benimsemeli ve mevcut endüstriyel modelimizi geliştirmek için bireyler ve işverenleri arasındaki ilişkilerin nasıl işlediğine dair fikirlerini kullanmalıyız."
 JAP_advance_one_hundred_million_fireballs:0 "İlerle, Yüz Milyon Ateş Topu"
 JAP_advance_one_hundred_million_fireballs_desc:0 "İmparatorluk Yönetimine Yardım Derneği, halkın batıya olan öfkesini ve artan savaşma ruhunu ifade etmek için kullanılacak olan 'İlerle, Yüz Milyon Ateş Topu' sloganını ortaya attı. Düşmanlarımızı devirmek için fedakarlık yapılması gerekiyorsa, nüfusumuz İmparatorluk için canlarını feda edecektir!"
 JAP_advance_one_hundred_million_fireballs_tt:0 "§Y%40§! İstikrarın altına düşersek bu ruh kaldırılacak"
 JAP_agricultural_protectionism:0 "Tarımsal Korumacılık"
 JAP_agricultural_protectionism_desc:0 "Dünya ekonomisi geleneksel üretim yöntemlerimize karşı giderek daha düşmanca hale geldi. Çiftçilerimizi korumak için önlemler almazsak, çiftçilerimiz denizaşırı ülkelerden gelen seri üretim gıda maddeleri karşısında rekabetçi kalamayacakları için yakında anlatılmamış boyutlarda bir krizle karşı karşıya kalacağız."
 JAP_akizuki_class_destroyers:0 "Akizuki Sınıfı Muhripler"
 JAP_akizuki_class_destroyers_desc:0 "Uçak gemisi gruplarımıza ve savaş filolarımıza atamak için güçlü uçaksavar tarama yeteneklerine sahip, son derece yetenekli çok amaçlı platform gemilerine ihtiyacımız var. Mühendislerimiz böylece Akizuki sınıfı olarak adlandırdıkları yeni bir sınıfla Yūgumo sınıfı muhriplerde bir iyileştirme üzerinde çalışmaya başladılar."
 JAP_align_the_concordia_association:0 "Concordia Derneği'ni Hizala"
 JAP_align_the_concordia_association_desc:0 "Mançurya'daki kontrolümüz altındaki siyasi parti olan Concordia Derneği, Pan-Asyacılık ve çok etnikli bir ulus-devlet yaratma ve Mançukuo üzerindeki askeri yönetimi kademeli olarak sivil kontrolle değiştirecek bir yapı oluşturma ideallerine sahiptir. Pan-Asya davasının ilerlemesi için iki ulusumuzun birleşmesini önermeliyiz."
 JAP_allied_civilian_administration_integration_tt:0 "Şu Kararların Kilidini Açar: §YBağlı Devletlerimizin Sivil İdarelerini Entegre Et§!, bu da §YKuklalarımızı§! §Yİlhak Etmemize§! izin verir"
 JAP_ally_afghanistan:0 "Barakzailerle Müttefik Ol"
 JAP_ally_afghanistan_desc:0 "Afganistan Kralı, dünyanın en zorlu dağlık bölgelerinden birinde çeşitli Afgan kabilelerini yönetmektedir. Belki mantıklı düşünebilir. Asya'nın kurtuluşunda bize katılmasına ikna etmek için Kabil'e resmi bir heyet göndermeye çalışmalıyız."
 JAP_ally_the_dragon_king:0 "Ejderha Kral ile Müttefik Ol"
 JAP_ally_the_dragon_king_desc:0 "Butan Ejderha Kralı, yalnız ve izolasyonist Tibet krallığını yönetiyor, ancak belki de daha büyük resmi görebilir. Asya'nın kurtuluşunda bize katılmasına ikna etmek için Punakha'ya resmi bir heyet göndermeye çalışmalıyız."
 JAP_ally_the_gorkhas:0 "Gorkhalarla Müttefik Ol"
 JAP_ally_the_gorkhas_desc:0 "Nepal Kralı, krallığını büyük ölçüde dış dünyadan kopuk bir şekilde, dünyanın en yüksek sıradağlarında yönetmektedir. Belki mantıklı düşünebilir. Asya'nın kurtuluşunda bize katılmasına ikna etmek için Katmandu'ya resmi bir heyet göndermeye çalışmalıyız."
 JAP_ally_the_league_of_blood:0 "Kan Birliği İle Müttefik Ol"
 JAP_ally_the_league_of_blood_desc:0 "Nichirenizm'in radikal Budist vaizi Nisshō Inoue, Kan Yemini Kolordusu Olayı olarak bilinen olayda zengin işadamlarını ve liberal politikacıları ortadan kaldırmak amacıyla Kan Birliği'ni kurdu. O zamandan beri serbest bırakıldığı için, ortak idealleri paylaştığı göz önüne alındığında onunla temasa geçmeliyiz."
 JAP_ally_the_philippines:0 "Filipinler ile Müttefik Ol"
 JAP_ally_the_philippines_desc:0 "Eski hakim devletleriyle bağlarımızı yakın zamanda yeniden kurduğumuza göre, belki de [PHI.GetAdjective] hükümetine bir teklif götürüp onları ittifakımıza katılmaya davet etmemizin zamanı gelmiştir. Gördüğümüz kadarıyla, bu anlaşmadan ikimiz de büyük fayda sağlayacağız."
 JAP_alternative_communist_international:0 "Beşinci Komünist Enternasyonal"
 JAP_amaterasus_aramitama:0 "Amaterasu'nun Aramitama Silahları"
 JAP_amaterasus_aramitama_desc:0 "Kore krallıklarına karşı seferlerinde Jingū'ya yardım eden tanrılardan biri, Amatereasu'nun şiddetli ruhu Tsukisakaki Izu no Mitama Amazakaru Mukatsuhime no Mikoto idi. Bu ruh, Güneş Tanrıçası'nın büyük gücünü elinde tutuyordu, kendimiz için kullanmaya çalışmamız gereken bir şey!"
 JAP_an_expedition_to_tibet:0 "Tibet'e Bir Sefer"
 JAP_an_expedition_to_tibet_desc:0 "[TIB.GetAdjective] hükümetini Asya için daha büyük çatışmada bizim tarafımızda olmaya ikna edip edemeyeceğimizi daha iyi anlamak için, onlarla temas kurmak üzere bir istihbarat görevi başlatmalıyız. Ancak kimin girebileceğine dair katı kuralları nedeniyle, Moğol kılığına girmiş ve bir Tibetli keşişe eşlik eden Jinzō Nomoto'yu göndermek zorunda kalacağız."
 JAP_an_expedition_to_tibet_tt:0 "Onları bir §YJapon Bağlı Devleti§! haline getirmek amacıyla §YTibet'e Nüfuz Et§! kararlarının kilidini açar"
 JAP_an_integrated_union:0 "Entegre Bir Birlik"
 JAP_an_integrated_union_2_tt:0 "Müttefikleri §YEkonomilerinin Giderek Daha Fazla Entegre Olmasına§! davet etme kararının kilidini açar, bu da daha sonra §YOnları Diplomatik Olarak Boyunduruk Altına Almaya Çalışmamıza§! izin verir"
 JAP_an_integrated_union_desc:0 "Müttefiklerimizin ekonomilerinin bizimkiyle entegrasyonu ve diğer devletlerin ekonomik durumunu izleyip yardımcı olabilecek bir Asya merkez bankasının kurulması, uzun vadede bizim için çok faydalı olacaktır. Bizi sadece güçlendirmekle kalmayacak, aynı zamanda bize olan bağımlılıklarını da artırarak sonunda dış ilişkilerinin kontrolünü ele geçirmemize izin verecektir."
 JAP_an_integrated_union_tt:0 "Her §Yİttifak Üyesi§! şu §YOlayı:§! alacak: [JAP.GetNameDefCap] Ekonomimizin Daha Fazla Entegrasyonunu İstiyor"
 JAP_an_ode_to_showa_restoration:0 "Showa Restorasyonuna Bir Övgü"
 JAP_an_ode_to_showa_restoration_desc:0 "Deniz subayı Mikami Taku, hareketimiz için doğal ve dini imgelere güçlü bir çağrıda bulunan çarpıcı bir tema olan Showa Restorasyonu Övgüsü'nü besteledi. İmparator Hirohito'ya iktidarı geri verip tahta çıkardığımıza ve liberal Taishō demokrasisini kaldırdığımıza göre, bunu ikinci bir milli marş yapmalıyız."
 JAP_anti_militarist_speeches_in_the_diet:0 "Mecliste Militarist Karşıtı Konuşmalar"
 JAP_anti_militarist_speeches_in_the_diet_desc:0 "Ülke genelinde artan ordu karşıtı duygularla birlikte, Isoo'nun geleneklerimizi eleştiren konuşmalar yapmasını sağlayarak ve partinin elinden gelen en iyi şekilde sokaklarda komünist propaganda dağıtarak, fanatik milliyetçiliklerini eleştiren insanları daha da sola yönlendirmek ihtiyatlı olacaktır."
 JAP_anti_militarist_speeches_in_the_diet_tt:0 "Ülke genelinde §YKomünist Desteğini Artırma§! kararlarının kilidini açar"
 JAP_appoint_new_generals:0 "Yeni Generaller Ata"
 JAP_appoint_new_generals_desc:0 "Birçok general bize karşı çıkmaya karar verdiğine göre, birliklerimize liderlik edecek yetkin subay sıkıntısı çekiyoruz. Bunu düzeltmek için elimizden geleni yapmalı ve yeni nesil ordu komutanlarını işe almalıyız."
 JAP_approach_mitsubishi:0 "Mitsubishi'ye Yaklaş"
 JAP_approach_mitsubishi_desc:0 "Mitsubishi şirketi başlangıçta Meiji döneminin başlarında bir nakliye firması olarak kuruldu. Çoğu sanayi sektörüne genişleyen şirket, bugün ülkemizdeki tüm askeri endüstrilerin büyük bir kısmını kontrol ediyor. Tesislerinden en etkili şekilde yararlanabilmek için hükümetimize desteklerini sağlamalıyız."
 JAP_approach_mitsui:0 "Mitsui'ye Yaklaş"
 JAP_approach_mitsui_desc:0 "Mitsui zaibatsu kökenlerini Edo dönemine kadar götürür, günümüzde ülkemizdeki en büyük sanayi şirketlerinden biridir. Hükümetimize desteklerini sağlamalıyız, böylece hizmetlerinden en etkili şekilde yararlanabiliriz."
 JAP_approach_sumitomo:0 "Sumitomo'ya Yaklaş"
 JAP_approach_sumitomo_desc:0 "Sumitomo zaibatsu köklerini Kyoto'daki bir kitapçıya kadar götürür, ancak bakır rafinasyonu şirketi ünlü yaptı. Bugün maden çıkarmanın yanı sıra bankacılıkta da uzmanlaşıyorlar. Varlıklarından en etkili şekilde yararlanabilmek için hükümetimize desteklerini sağlamalıyız."
 JAP_approach_yasuda:0 "Yasuda'ya Yaklaş"
 JAP_approach_yasuda_desc:0 "Yasuda zaibatsu kökenlerini Meiji dönemine kadar götürür ve kurulduğundan beri bankacılık yapmaktadır. Yasuda bankasının gövdesi olarak, artık ulusumuzdaki tüm finans sektörleriyle içsel olarak bağlantılıdırlar. Muazzam servetlerinden en etkili şekilde yararlanabilmek için hükümetimize desteklerini sağlamalıyız."
 JAP_army_weapons_administration_headquarters:0 "Ordu Silah İdaresi Karargahı"
 JAP_army_weapons_administration_headquarters_desc:0 "Ordunun silahlarının üretimini, ikmalini, araştırılmasını, geliştirilmesini, test edilmesini ve eğitimini birleştirmek için Ordu Silah İdaresi Karargahı'nı kurmalıyız. Bunu yaparak, endüstrilerimiz umarız [SOV.GetNameDef] ve [USA.GetNameDef] gibi devlere karşı bir şansa sahip olacaktır."
 JAP_army_weapons_administration_headquarters_tt:0 "Eğer $JAP_army_faction$ en az $JAP_imperial_influence_tier_3$ ise, ayrıca §G1§! §YKara Harp Tesisi§! kazan"
 JAP_assure_superior_naval_quality:0 "Üstün Donanma Kalitesini Sağla"
 JAP_assure_superior_naval_quality_desc:0 "Sayılar önemli olsa da, düşmanın en büyüklerimizden daha güçlü gemilere sahip olmasına izin vermemeliyiz. Yamato iyi bir ilk adımdı, ancak bu fikirleri daha da ileri götürmeliyiz."
 JAP_authorize_aid_to_ethiopia:0 "Etiyopya İçin Yardımı Onayla"
 JAP_authorize_aid_to_ethiopia_desc:0 "İttifakımız uzun yıllardır [ETH.GetAdjective]lar ile temas halindeydi ve bu durum hükümeti [ETH.GetNameDef] devletinin modernleşmesine yardım etmeye ikna etmemizle sonuçlandı. Şimdi kendilerini batılı bir gücün saldırısı altında buluyorlar. Onlara hemen yardım göndermeliyiz!"
 JAP_balanced_naval_approach:0 "Dengeli Donanma Yaklaşımı"
 JAP_balanced_naval_approach_desc:0 "Zırhlıların veya uçak gemilerinin düşmanlarımıza karşı etkisiz olduğu ortaya çıkarsa kendimizi köşeye sıkıştırmaktan kaçınmalıyız. Bu nedenle dengeli bir donanma yaklaşımı sürdürmeli ve her iki sektöre de yatırım yapmalıyız."
 JAP_battle_for_australia:0 "Avustralya Savaşı"
 JAP_battle_for_australia_desc:0 "[AST.GetNameDef] izole edildiğine göre, kıta üzerindeki gökyüzü için savaşmaya başlama zamanı geldi. Gökyüzünü kontrol etmeyi başarırsak, o zaman belki de Okyanusya'yı işgal etmek o kadar da mantıksız olmayabilir."
 JAP_best_the_graveyard:0 "Mezarlığı Yen"
 JAP_best_the_graveyard_desc:0 "İlahi İmparatorumuz diğer herkesin üstündedir ve bunu bu şekilde görmeyenler ezilmelidir. [AFG.GetNameDef] devletini işgal etmeli ve tahtlarını kendimiz için talep etmeliyiz."
 JAP_borders_the_soviet_bloc_tt:0 "§Y[SOV.GetNameDef]§! veya onların müttefiklerinden biriyle sınırımız var"
 JAP_bribe_generals:0 "Generallere Rüşvet Ver"
 JAP_bribe_generals_desc:0 "Radikal olsa da, askeri personelimizin hepsi kötülüğün tarafında olmak istemiyor. Görev ve onur nedeniyle ordudaki yoldaşlarına katılıyorlar, ancak yeterli zaman ve çaba harcanırsa belki de daha iyi bir davayı desteklemeye ikna edilebilirler."
 JAP_bribe_generals_tt:0 "§G4§! §YGeneral§! bize sadık olacak"
 JAP_build_an_anti_army_coalition:0 "Ordu Karşıtı Bir Koalisyon Kur"
 JAP_build_an_anti_army_coalition_desc:0 "Ordunun zaten güçlü olan nüfuzuna karşı koymak için parti içi çekişmelerimize devam edemeyiz. Japonya'yı daha parlak bir geleceğe doğru birlikte itebilecek bir koalisyon kurmaya çalışmalıyız."
 JAP_build_diet_building_landmark_tt:0 "\n§Y$landmark_tokyo_imperial_palace$§! yerine §Y$landmark_national_diet$§! geçer"
 JAP_build_hakko_ichiu_landmark_tt:0 "[1018.GetName] içinde §Y$landmark_hakko_ichiu$§! oluşturur"
 JAP_build_the_nishotaki_and_miyanaka_dams:0 "Nishotaki ve Miyanaka Barajlarını İnşa Et"
 JAP_build_the_nishotaki_and_miyanaka_dams_desc:0 "Ulusumuzdaki yeni fabrikalar ve tesisler, şu anda uygun fiyata üretebileceğimizden daha fazla elektriğe ihtiyaç duyuyor. Değerli kömür stoklarımızı yakmadan elektrik üretebilmemiz için yeni hidroelektrik barajlar kurmalıyız."
 JAP_build_up_korean_industries:0 "Kore Endüstrilerini İnşa Et"
 JAP_build_up_korean_industries_desc:0 "Kore yarımadasında, özellikle ağır sanayi ve mühimmat alanlarında endüstriyel tabanı oluşturmak için yoğun çaba sarf etmeliyiz. Sonuçta bunlar, Çin veya batılılarla yapılacak herhangi bir savaşta paha biçilmez olacaktır. Bu politika başlangıçta Kazushige Ugaki tarafından önerildi ve bu yolda devam etmeliyiz."
 JAP_can_no_longer_manually_promote_civ_government_tt:0 "Artık §YSivil İttifakı§! §RManuel Olarak Onaylayamayacağız§!"
 JAP_can_no_longer_manually_promote_zaibatsus_tt:0 "Artık §YZaibatsu İttifakını§! §RManuel Olarak Onaylayamayacağız§!"
 JAP_central_agricultural_association:0 "Merkezi Tarım Derneği"
 JAP_central_agricultural_association_desc:0 "Tedarik zincirlerimizdeki darboğazları çözmek istiyorsak, dağınık haldeki birçok tarım örgütümüzün tek bir çatı altında birleştirilmesi gerekiyor. Bunun yapılmasını sağlamak için, Tarım Örgütleri Yasasında belirtildiği gibi Merkezi Tarım Derneği'ni kurmak üzere Sengoku Kotaro'yu görevlendirmeliyiz."
 JAP_chairman_title_text:0 "Başkan"
 JAP_children_of_the_sun:0 "Güneşin Çocukları"
 JAP_children_of_the_sun_desc:0 "Sadece kraliyet soyumuz değil, [ROOT.GetAdjective] halkının kendisi de güneşin çocuklarıdır. Yüce tanrıça Amaterasu bir zamanlar bize bu toprağı verdi ve bunun için minnettar olmalıyız. Bize verdiklerinin karşılığını ödeme zamanı geldi!"
 JAP_chinese_japanese_neutrality_pact_flag:0 "§Y$JAP_ensure_temporary_peace_with_china$§! milli hedefini tamamladı"
 JAP_chinese_japanese_neutrality_pact_refused_flag:0 "§Y$JAP_ensure_temporary_peace_with_china$§! reddedildi"
 JAP_civilian_nuclear_reactor_investments:0 "Sivil Nükleer Reaktör Yatırımları"
 JAP_civilian_nuclear_reactor_investments_desc:0 "RIKEN enstitüsündeki bilim adamlarımızın belirlediği gibi, nükleer enerji geleceğin enerjisi olacak. Bu yeni teknolojiye yatırım yapmalıyız, böylece bir daha asla kömür yakmamıza gerek kalmayabilir."
 JAP_civilian_nuclear_reactor_investments_tt:0 "Etkili değişiklik: §Y$JAP_early_industrialization_efforts_dm$§! yerine §Y$JAP_the_economic_mirale_dm$§! gelir."
 JAP_claim_the_raven_crown:0 "Kuzgun Tacı'nı Talep Et"
 JAP_claim_the_raven_crown_desc:0 "İlahi İmparatorumuz diğer herkesin üstündedir ve bunu bu şekilde görmeyenler ezilmelidir. [BHU.GetNameDef] devletini işgal etmeli ve tahtlarını kendimiz için talep etmeliyiz."
 JAP_claim_the_scripech:0 "Shripech'i Talep Et"
 JAP_claim_the_scripech_desc:0 "İlahi İmparatorumuz diğer herkesin üstündedir ve bunu bu şekilde görmeyenler ezilmelidir. [NEP.GetNameDef] devletini işgal etmeli ve tahtlarını kendimiz için talep etmeliyiz."
 JAP_closer_ties_with_the_usa:0 "ABD ile Daha Yakın İlişkiler"
 JAP_closer_ties_with_the_usa_desc:0 "Demokratik sistem artık ülkemizde güvence altına alındığına göre, diplomatlarımız Amerika Birleşik Devletleri'nden başlayarak ordunun lekelediği ilişkileri onarmak için sıkı bir şekilde çalışıyorlar. Onlara yaklaşmalı ve dostluğumuzu gelecek yıllar boyunca güvence altına alacak bir anlaşma yapıp yapamayacağımızı görmeliyiz."
 JAP_combined_arms:0 "Birleşik Silahlar"
 JAP_combined_arms_desc:0 "Hava ve kara kuvvetlerimiz arasındaki koordinasyon başarının anahtarıdır. Daha iyi destek sağlamak ve ordumuzun karşılaşabileceği engelleri savaş alanından temizlemek için, uçaklarımızın diğer branşlarımızla birlikte çalışmasına izin veren birleşik silahlar taktiklerine yatırım yapmalıyız."
 JAP_combined_nuclear_research_efforts:0 "Birleşik Nükleer Araştırma Çabaları"
 JAP_combined_nuclear_research_efforts_desc:0 "Askeri branşlarımız arasındaki düşmanlıklar bir sonuca varmaya yakınken, hırslı nükleer projelerini tek bir projede birleştirmenin ve ulusumuzun en parlak beyinlerinin hepsini aynı ekipte çalışmaya koymanın tam zamanı."
 JAP_conquer_the_army_remnants:0 "Ordu Kalıntılarını Fethet"
 JAP_conquer_the_army_remnants_desc:0 "Başlattığımız kavgayı bitirme ve İmparatorluk Ordusu'nun ve iç savaşımızın son kalıntısına son verme zamanı geldi. Kwantung Ordusu'nu devirmeli ve Mançurya'yı yeniden fethetmeliyiz!"
 JAP_construct_the_sui_ho_dam:0 "Sui-ho Barajını İnşa Et"
 JAP_construct_the_sui_ho_dam_desc:0 "Mançurya Liaoning Eyaletindeki endüstrilerimize yeterli enerji sağlamak için Suihō ağırlık barajını inşa etmeliyiz. Mühendislerimiz, bunu başarmak için Yalu Hidroelektrik Şirketi ve Pyeongbuk Demiryolu şirketiyle sözleşme yapma planlarıyla tüm Asya'daki en büyük baraj olacak şey için planlar hazırladılar."
 JAP_contact_former_sakurakai_members:0 "Eski Sakurakai Üyeleriyle İletişime Geç"
 JAP_contact_former_sakurakai_members_desc:0 "Kiraz Çiçeği Derneği, 1930 yılında genç subaylar tarafından kurulan ve İmparatorluk Renkleri Olayı'ndan bu yana dağılmış olan ultra milliyetçi bir gizli topluluktu. Gerekirse askeri bir darbe yoluyla devleti totaliter militarist hatlar boyunca yeniden düzenleme hedefleri vardı. Artık başarılı olduğumuza göre, bu eski üyelerin bazılarını hükümetimize yeniden davet etmek için ulaşmalıyız."
 JAP_contact_the_masterless_samurai:0 "Efendisiz Samuray ile İletişime Geç"
 JAP_contact_the_masterless_samurai_desc:0 "Rōninkai, üyelerinin çoğunu Karanlık Okyanus Derneği ve Kara Ejder Derneği gibi benzer örgütlerle paylaşan, ultra milliyetçi, anti-demokratik bir siyasi gruptur. 1908 yılında Tanaka Hiroyuki tarafından kurulan bu gizli topluluk, şu anda sağcı siyasetçilerimizin çoğunu etkilemektedir. Onlara ulaşmalı ve onlarla hükümetimiz arasında bağlar kurmalıyız."
 JAP_continue_takahashi_korekiyos_policies:0 "Takahashi Korekiyo'nun Politikalarını Sürdür"
 JAP_continue_takahashi_korekiyos_policies_desc:0 "Vikont Takahashi Korekiyo ulusumuzu Büyük Buhran'dan kurtardı ve etkilerinin ekonomimizde artık hissedilmemesini sağladı. Ancak bunu başarmak için ordunun maliyesinde bütçe kesintileri yaptı, bu da birçokları için popüler olmayan bir hamle oldu. Onun izinden gitmeliyiz!"
 JAP_convoy_production_cost_tt:0 "[JAPGetConvoyProductionCostBonusText]"
 JAP_cooperate_with_anarchists:0 "Anarşistlerle İşbirliği Yap"
 JAP_cooperate_with_anarchists_desc:0 "Anarşistler, JKP'deki diğer hizipler tarafından kenara atıldı ve zorba devlete karşı kendi başlarının çaresine bakmak zorunda bırakıldı. Onları şemsiye hareketimize davet etmeli ve ideallerinin bazılarının da aklımızdaki gelecekte gerçekleşebilmesini sağlamalıyız."
 JAP_crackdown_on_foreign_agents:0 "Yabancı Ajanlara Baskın"
 JAP_crackdown_on_foreign_agents_desc:0 "Kabine İstihbarat Bürosu etrafta gizlenen pek çok şüpheli şahıs keşfetti. Bunlardan bazıları istenmeyen ideolojilere sahip, bazıları ise açıkça yabancı güçlerin ajanları. Belki de büronun harekete geçme ve ulusumuzu ve halkını korumak için bir kampanya başlatma zamanı gelmiştir?"
 JAP_crackdown_on_foreign_agents_tt:0 "§YTokkō§!, milli güvenliği ve istikrarı güçlendirmek amacıyla muhalifleri ve casusları tutuklamada daha aktif hale gelecek"
 JAP_create_greater_east_asian_treaty_organization:0 "Batı Pasifik Antlaşması Örgütü"
 JAP_create_greater_east_asian_treaty_organization_desc:0 "Diğer Asya uluslarıyla kendi ittifakımız, yeni bulduğumuz yaşam tarzımıza yönelik olası tehditlere karşı sağlam durmamızı sağlayacaktır. Kıtanın koruyucuları olarak kaderimizi kucaklamanın ve onu geleceğe taşımaya başlamanın zamanı geldi."
 JAP_create_greater_east_asian_treaty_organization_tt:0 "§YTarafsız§! ve §YDemokratik§! §YAsya§! ve §YOkyanusya§! uluslarını ittifakımıza davet etme kararlarının kilidini açar"
 JAP_crush_the_internal_factions:0 "Dahili İttifakları Ez"
 JAP_crush_the_internal_factions_desc:0 "Ülke içindeki hiziplerin, imparatorun onayını almak için birbirleriyle yarışması yıkıcı sonuçlar doğurdu. Şimdi hükümet durumun kontrolünü tekrar tamamen ele geçirdiğine göre, gerçek gücü kimin elinde tuttuğunu sağlamlaştırmanın ve diğer iç hiziplere bizimle uğraşılmayacağını göstermenin zamanı geldi."
 JAP_crush_the_spirit_of_gekokujo:0 "Gekokujo Ruhunu Ez"
 JAP_crush_the_spirit_of_gekokujo_desc:0 "Erken Showa döneminde, ordu içindeki alt rütbeli adamların daha yüksek konumdakileri devirmeye çalıştığı, emir komuta zincirimizi bozma tehdidi oluşturan tekrarlanan gekokujō eylemleri meydana geldi. Bu fikirlere karşı mümkün olan en kısa sürede sert önlemler almalıyız!"
 JAP_danganressha:0 "Hızlı Tren Planı"
 JAP_danganressha_desc:0 "Demiryolları Bakanlığı, nakliye trenlerinin bir mermi kadar hızlı seyahat edebileceği standart hat açıklığına sahip demiryollarının yanına geniş hat açıklığına sahip demiryollarının döşeneceği sözde Danganressha planını onayladı. Demiryolu öncüsü Yasujiro Shima ve oğlu bu planın geliştirilmesine yardımcı olma sözü verdi."
 JAP_demand_submission_from_breawakay_states:0 "Ayrılıkçı Devletlerden Boyun Eğmelerini Talep Et"
 JAP_demand_submission_from_breawakay_states_desc:0 "Bizden yasadışı bir şekilde ayrılan devletler sadece bir hata yaptılar ve halkın devriminin başarılı olacağını fark etmediler. Onlara yaklaşmalı ve partiye boyun eğmelerini ve halklarının kapitalist baskıdan kurtulmasına izin vermelerini talep eden kesin bir açıklama yapmalıyız."
 JAP_demand_tonkinese_bases:0 "Tonkin Üslerini Talep Et"
 JAP_demand_tonkinese_bases_2_tt:0 "Fransa §YTonkin§! bölgesine sahip değil"
 JAP_demand_tonkinese_bases_desc:0 "Tonkin bölgesi sadece kaynak bakımından zengin değil, aynı zamanda güneye doğru daha fazla genişlememiz için hayati bir basamaktır. Çin sınırında olması, hava filomuzun Kanton'a saldırması için önemli bir harekat üssü olarak da hizmet edebilir."
 JAP_demand_tonkinese_bases_tt:0 "Fransa §YTonkin§! bölgesine sahip"
 JAP_democratic_foreign_exchange_allocation_policy:0 "Döviz Tahsis Politikası"
 JAP_democratic_foreign_exchange_allocation_policy_desc:0 "Borsa güçlü bir araçtır. Yabancı sermaye akışını kullanmalı ve ekonomistlerimizin ve sanayicilerimizin bunun mümkün olduğunca fazlasını gelişmekte olan ulusumuza yatırabilmesini sağlamalıyız."
 JAP_democratic_nationalize_zaibatsus:0 "Zaibatsuları Millileştir"
 JAP_democratic_nationalize_zaibatsus_desc:0 "Ulusumuzun en büyük şirketleri uzun zamandır benzeri görülmemiş bir siyasi ve ekonomik güce sahipti. Bu burada bitiyor. Devletin kontrolüne meydan okunmayacak. Onları millileştirmeli ve sermayelerini halkın yararına kullanmalıyız!"
 JAP_democratic_research_slot:0 "Tokyo İmparatorluk Üniversitesi'ni Yeniden Düzenle"
 JAP_democratic_research_slot_desc:0 "Tokyo İmparatorluk Üniversitesi hala eski eğitim sistemimizin yöntemleriyle çalışıyor. Ülkemizin daha iyi bir geleceğe ulaşmasına yardımcı olabilecek yeni bir entelektüel yetenek nesli kazanmak için ona yatırım yapmalı ve müfredatı ulusal siyaset tarafından daha az kontrol edilecek şekilde değiştirmeliyiz."
 JAP_democratic_war_with_china:0 "Şanghay Yerleşimini Koru"
 JAP_democratic_war_with_china_desc:0 "Şanghay Uluslararası Yerleşimi'ndeki insanlar şu anda yozlaşmış Çin rejimi ve yandaşları tarafından tehdit ediliyor. Devreye girmeli ve onları kurtarmalıyız, yoksa gereksiz yere kan dökülecek!"
 JAP_democratic_war_with_manchukuo:0 "Kavgayı Bitir"
 JAP_democratic_war_with_manchukuo_desc:0 "Kwantung Ordusu iç savaştan beri bizimle bağlarını kopardı ve Mançurya üzerinde kontrolü ele geçirdi. Oradaki insanlar hala bir zamanlar bizim yaşadığımız otoriter baskı altında yaşıyor ve kurtarılmaya ihtiyaçları var. Başladığımız işi bitirme zamanı."
 JAP_democratic_women_in_the_workforce:0 "İşgücünde Kadınlar"
 JAP_democratic_women_in_the_workforce_desc:0 "Cinsiyet, bir bireyin ülkesine nerede hizmet etmesinin beklendiğini belirleyen bir faktör olmuştur; ister cephede, ister fabrikalarda veya evde olsun. Yüklerin daha eşit bir şekilde bölünmesini sağlayarak, gerekirse daha büyük bir işgücüne ve daha büyük bir orduya izin veriyoruz."
 JAP_democratic_womens_suffrage:0 "Kadınların Oy Hakkı"
 JAP_democratic_womens_suffrage_desc:0 "Ichikawa Fusae uzun zamandır oylamanın kadınları da kapsayacak şekilde genişletilmesinin savunucusu olmuştur. Şimdi siyasi durum istikrara kavuştuğuna göre, Japonya kadınlarına oy hakkı vermemizin zamanı geldi, böylece onlar da artan başarımıza katkıda bulunabilirler."
 JAP_democratic_work_with_the_zaibatsus:0 "Zaibatsularla Çalış"
 JAP_democratic_work_with_the_zaibatsus_desc:0 "Ulusumuzun en büyük şirketleri uzun zamandır benzeri görülmemiş bir siyasi ve ekonomik güce sahipti. Biraz incelikle, onlarla birlikte çalışabilir ve çabalarını lehimize yönlendirebiliriz."
 JAP_develop_lethal_infantry_equipment:0 "Ölümcül Piyade Teçhizatı Geliştir"
 JAP_develop_lethal_infantry_equipment_desc:0 "Ordu, şu anda ellerinde bulunan silahların ne kadar eski olduğunu bize açıkça belirtti ve bu konuda bir şeyler yapılmasını talep ediyor. Daha modern piyade teçhizatı geliştirmek için büyük yatırımlar yapmalıyız, böylece bir daha asla savaş kaybetmeyiz."
 JAP_develop_lethal_infantry_equipment_tt:0 "Eğer $JAP_army_faction$ en az $JAP_imperial_influence_tier_3$ ise, ayrıca şunu kazan:\n"
 JAP_develop_new_fighters:0 "Yeni Avcı Uçakları Geliştir"
 JAP_develop_new_fighters_desc:0 "Mitsubishi'nin yeni bir tasarımı, bugüne kadar tasarlanan en yetenekli uçak gemisi tabanlı avcı uçağı olabilir. Eşsiz manevra kabiliyeti, makul menzille birleştiğinde, tasarımın bize yıllarca yeteceği anlamına geliyor. Prototip oluşturmaya ve üretime derhal başlamalıyız."
 JAP_develop_sophisticated_artillery_equipment:0 "Gelişmiş Topçu Teçhizatı Geliştir"
 JAP_develop_sophisticated_artillery_equipment_desc:0 "Ordu, şu anda ellerinde bulunan silahların ne kadar eski olduğunu bize açıkça belirtti ve bu konuda bir şeyler yapılmasını talep ediyor. Daha modern topçu silahları geliştirmek için büyük yatırımlar yapmalıyız, böylece düşman pratik olarak teslim olana kadar onlara hücum etmek zorunda kalmayız."
 JAP_develop_the_chinese_resources:0 "Çin Kaynaklarını Geliştir"
 JAP_develop_the_chinese_resources_desc:0 "Çin topraklarının büyük bir kısmı çizmemizin altına alındığına göre, şimdi zengin Çin kaynaklarını geliştirmeliyiz ki bir sonraki savaş için yararlı olabilsinler."
 JAP_develop_the_south_seas_mandate:0 "Güney Denizi Mandasını Geliştir"
 JAP_develop_the_south_seas_mandate_desc:0 "Büyük Savaş'tan sonra Milletler Cemiyeti tarafından bize verilen Güney Denizi Adaları Yönetimi Japon Mandası, sömürüye hazır, geniş ve büyük ölçüde keşfedilmemiş bir bölgedir. Bu bölgeleri geliştirdiğimizden ve halkımıza zenginliklerini sağlama konusunda uzmanlaştırdığımızdan emin olursak, bölgeyi yöneten Nan'yō Hükümeti yerel halkı devletimize düzgün bir şekilde entegre olmaya ikna edebilir."
 JAP_develop_the_yen_bloc:0 "Yen Bloğunu Geliştir"
 JAP_develop_the_yen_bloc_desc:0 "Büyük Doğu Asya Ortak Refah Alanı'nın ekonomik yönlerine daha fazla önem vermeliyiz. Asya ekonomileri entegre edilmeli ve hepsi para birimi olarak Yen'i kabul etmelidir. Bu, Japonya-Mançukuo-Çin yen bloğunun geliştirilmesine devam edilerek ve nihayetinde mükemmelleştirilerek başarılabilir."
 JAP_develop_the_yen_bloc_tt:0 "§YAsyalı Müttefiklerimizin§! §YEkonomilerini Entegre Et§! kararlarının kilidini açar"
 JAP_development_for_the_undeveloped:0 "Gelişmemişler İçin Kalkınma"
 JAP_development_for_the_undeveloped_desc:0 "Gerçek devrimi gerçekleştirmek için, daha az gelişmiş devletleri geliştirmeli ve ittifakın daha küçük üyelerinin altyapısını ve endüstriyel kapasitesini iyileştirmeliyiz."
 JAP_divert_military_funds:0 "Askeri Fonları Başka Yöne Kaydır"
 JAP_divert_military_funds_desc:0 "Bir isyan her zamankinden daha yakın göründüğünden, orduyu bizi yere seremeyecekleri kadar zayıflatmak istiyorsak, fonlarını başka kaynaklara kaydırmalıyız. Bunu yaparak, kendilerini bir süre açıkta bulmalılar."
 JAP_divert_military_funds_tt:0 "§YOrdu Kontrolü§! altında olmayan her eyalet §Yİç Savaşın§! başlangıcında bize katılacak"
 JAP_divert_naval_guns_to_the_army:0 "Donanma Toplarını Orduya Kaydır"
 JAP_divert_naval_guns_to_the_army_desc:0 "Kara kuvvetlerinin demiryolu topları ve tanklar gibi ağır silahları kullanmasına izin vermek için, donanma topu üretiminin bir kısmını orduya kaydırmalıyız."
 JAP_divert_naval_guns_to_the_army_tt:0 "[ROOT.capital.GetName] içinde §Y2 $railway_gun_equipment_1$§! birimi oluştur."
 JAP_domestic_tank_modernization_program:0 "Yerli Tank Modernizasyon Programı"
 JAP_domestic_tank_modernization_program_desc:0 "Hatalarımızdan ders çıkarmalı ve zırhlılarımızın tanksavar silahlarına karşı hayatta kalabilmesini sağlamalıyız, aksi takdirde güçlerimiz başarısızlığa mahkum olacaktır. Bu, batılı güçlerin tasarımlarına güvenerek değil, büyük [ROOT.GetAdjective] halkının yaratıcılığıyla yapılmalıdır."
 JAP_draft_the_showa_constitution:0 "[JAP_draft_the_showa_constitution_key]"
 JAP_draft_the_showa_constitution_desc:0 "[JAP_draft_the_showa_constitution_desc_key]"
 JAP_draft_the_showa_constitution_desc_key_emperor_eian:0 "Ulusumuzun imparatorluk tarihini kabul ediyor ve saygı duyuyoruz. Ancak otoriterliğin kurmak istediğimiz Japonya'da yeri yok. Yeni İmparatoru sembolik bir lider olarak tutacağız, ancak birçok Batı ülkesinde olduğu gibi anayasadaki yetkilerini sınırlayacağız."
 JAP_draft_the_showa_constitution_desc_key_emperor_showa:0 "Ulusumuzun imparatorluk tarihini kabul ediyor ve saygı duyuyoruz. Ancak otoriterliğin kurmak istediğimiz Japonya'da yeri yok. İmparatoru sembolik bir lider olarak tutacağız, ancak birçok Batı ülkesinde olduğu gibi anayasadaki yetkilerini sınırlayacağız."
 JAP_draft_the_showa_constitution_key_emperor_eian:0 "Eian Anayasasını Tasarla"
 JAP_draft_the_showa_constitution_key_emperor_showa:0 "Showa Anayasasını Tasarla"
 JAP_east_asia_development_board:0 "Doğu Asya Kalkınma Kurulu"
 JAP_east_asia_development_board_desc:0 "Kōain'in kurulması, hükümetin Çin politikasını koordine etmeye yardımcı olacak, işgal altındaki bölgelerde Japon yönetimine desteği artırmak için Çin'de endüstriyel ve ticari kalkınmayı desteklemek üzere tasarlanmıştır. Ayrıca madenlerimiz ve savaş endüstrilerimiz için işçi sağlamak amacıyla bir araç olarak da kullanılabilir."
 JAP_east_asia_development_board_tt:0 "Müttefiklerimizde §YEndüstriyel Projeler§! başlatma kararlarının kilidini açar"
 JAP_east_asian_cooperative_society:0 "Doğu Asya İşbirliği Topluluğu"
 JAP_east_asian_cooperative_society_desc:0 "Yakın zamanda geliştirilen Doğu Asya İşbirliği Topluluğu teorisi, Doğu Asya'da etnik ve ulusal sınırları aşacak bir işbirliği toplumunun inşasını savunmaktadır. Pasifik'in koruyucusu ve Doğu Asya halklarının lideri olarak konumumuzu güçlendirmek için bu fikir üzerine inşa etmeliyiz."
 JAP_east_asian_cooperative_society_tt:0 "§YAsya Ulusları§! ile dostluk kurma ve doğal kaynaklarına yatırım yapma kararlarının kilidini açar!"
 JAP_eastern_road_and_steel_expansion:0 "Doğu Yolu ve Çelik Genişlemesi"
 JAP_eastern_road_and_steel_expansion_desc:0 "Mançurya'daki madenlerimizin ve endüstrilerimizin genişlemesini kolaylaştırmak için Doğu Yolu Kalkınma Kurumu'nu kurmalıyız. Bu başarıldıktan sonra Tiechangzi, Wudaojiang ve Shirengou'da madencilik istasyonları kurulacak ve Dalizi ile Qidaogou'da demir cevheri madencilik ofisleri kurulacak."
 JAP_educate_the_peasants:0 "Köylüleri Eğit"
 JAP_educate_the_peasants_desc:0 "Kıta köylülerinin eğitimi çok uzun zamandır ihmal edildi. İttifak üyeleri arasındaki çabaları koordine etmeye başlama zamanı geldi, böylece iş gücündeki bilgiyi geliştirebiliriz."
 JAP_educate_the_peasants_tt:0 "§Y$JAP_educating_the_peasants_modifier$§! gelen araştırma hızı bonusu, her yeni ittifak üyesi için §G%1§! artar, maksimum §G%10§!"
 JAP_embodying_empress_jinguu:0 "İmparatoriçe Jingu'yu Somutlaştırmak"
 JAP_embodying_empress_jinguu_desc:0 "Tıpkı İmparatoriçe Nagako'nun kocasının öldürülmesi gibi, İmparatoriçe Jingū'nunki de öldürülmüştü. Bir intikam seferine çıktı, ardından dikkatini vaat edilen bir toprağa çevirdi. Üç yıl sonra düşmanlarını yendi ve muzaffer bir şekilde geri döndü. Bu efsaneyi sürdürmeli ve sonuna kadar götürmeliyiz."
 JAP_embrace_amakudari:0 "Amakudari'yi Benimse"
 JAP_embrace_amakudari_desc:0 "Kelimenin tam anlamıyla cennetten iniş anlamına gelen Amakudari, emekli üst düzey bürokratlarımızın özel şirketlerde, genellikle daha önce düzenledikleri aynı sektörde üst düzey yönetim pozisyonları aldığı uygulamayı tanımlar. Endüstrilerimizin verimliliğini çok daha kötüleştirebilse de, bize toplumumuz üzerinde önemli bir içgörü ve kontrol sağlar."
 JAP_embrace_kokutai:0 "Kokutai'yi Benimse"
 JAP_embrace_kokutai_desc:0 "Milli kimliğimiz, özümüz ve karakterimiz geçmiş hükümetler tarafından çok uzun zamandır ihmal edildi ve sulandırıldı ve zamanın rüzgarlarına karışıp kaybolmaya yakın. Her [ROOT.GetAdjective] vatandaşının geleneklerimize uygun yaşamanın ve Kokutai'ye uygun yaşamanın görevleri olduğunu anlamasını sağlamalıyız."
 JAP_emperor_hirohito_has_abdicated_flag:0 "§YHirohito§! tahttan feragat etti"
 JAP_emperor_hirohito_under_house_arrest_flag:0 "§YHirohito§! §YEv Hapsi§! altına alındı"
 JAP_emperor_title_text:0 "İmparator"
 JAP_emperor_tooltip:0 "[GetImperialInfluenceRulerTitle] [GetImperialInfluenceRulerName]. \n\n[GetImperialInfluenceRulerTitle] üzerinde güç elde etmek için yarışan çeşitli §YGruplar§! §R$JAP_imperial_influence_tier_1$§!, §R$JAP_imperial_influence_tier_2$§!, §R$JAP_imperial_influence_tier_3$§! ve §R$JAP_imperial_influence_tier_4$§! arasında gidip gelebilir."
 JAP_empower_the_emperor:0 "İmparatoru Güçlendir"
 JAP_empower_the_emperor_desc:0 "Kuklaların zamanı çoktan geçti ve İmparator bizzat devletin doğrudan kontrolünü ele almalı. İmparatorluğumuz ancak o zaman Batılı emperyalistlere karşı durabilir."
 JAP_empower_the_shogun:0 "Şogun'u Güçlendir"
 JAP_empower_the_shogun_desc:0 "İmparator, onun adına hareket eden güçlü aracılarla daha törensel bir rolde kalmalıdır. Bu kesinlikle İmparator'un sözünün daha ileriye ve daha geniş kitlelere ulaşmasını sağlayacaktır."
 JAP_empower_the_thought_police:0 "Düşünce Polisini Güçlendir"
 JAP_empower_the_thought_police_desc:0 "Özel Yüksek Polis, sivil kanun yaptırımını, Japonya İmparatorluğu'nun kamu düzenini tehdit ettiği düşünülen siyasi grupların ve ideolojilerin kontrolünü, karşı istihbaratı, iç suç soruşturmalarını, yüksek polisliği ve kamu güvenliğini sağlamak amacıyla mevcuttur. Bu örgütü güçlendirmeliyiz ki bu işi daha verimli yapabilsinler."
 JAP_empress_title_text:0 "İmparatoriçe"
 JAP_enact_religious_organizations_law:0 "Dini Örgütler Yasasını Çıkar"
 JAP_enact_religious_organizations_law_desc:0 "Halkımızın dikkatini doğru şeylere yönlendirmek ve [ROOT.GetAdjective] kaderin peşinde koşmaya yönelik sarsılmaz desteklerini sağlamak için, devlet otoritesine ulus içindeki tüm dini örgütler üzerinde kontrol verecek bir yasa çıkarmalıyız."
 JAP_enact_the_national_conscription_law:0 "Milli Zorunlu Askerlik Yasasını Çıkar"
 JAP_enact_the_national_conscription_law_desc:0 "Uygun her [ROOT.GetAdjective] erkeğinin aranıp orduya alınması emredildi. En ücra köylere bile asker toplayıcılar göndermeliyiz, böylece hızla daha fazla adamı askere alabiliriz."
 JAP_end_the_interservice_rivalry:0 "Hizmetler Arası Rekabeti Bitir"
 JAP_end_the_interservice_rivalry_desc:0 "Zaferlerimiz ulusumuzun bir dünya gücü olma kapasitesine sahip olduğunu kanıtlarken, iç hiziplerimiz arasındaki kaynaklar üzerindeki çekişmeler her zamankinden daha önemsiz görünüyor. Çıkarlarımızı çok uzun zamandır bölen bu uçurumu sona erdirmenin ve gelecek yüzyıllar boyunca Asya üzerinde [ROOT.GetAdjective] hakimiyetini sağlamanın zamanı geldi."
 JAP_end_the_interservice_rivalry_tt:0 "Ordu ve Donanma arasındaki §YHizmetler Arası Rekabeti§! sona erdirecek. Diğerine kıyasla durumlarına göre §GArtık Olumsuz Etki Sağlamayacaklar§!, bunun yerine diğer hizipler gibi işlev görecekler"
 JAP_endorse:0 "Onayla"
 JAP_ensure_civil_liberties:0 "Sivil Özgürlükleri Güvence Altına Al"
 JAP_ensure_civil_liberties_desc:0 "Barış ve refah ulusumuza bir kez daha dönerken, verdiğimiz sözlerden bazılarını yerine getirmemizin zamanı geldi. Yeni Japonya'da tüm sivil özgürlüklerin yerine getirilebileceğinden emin olmalı ve demokrasimizi teşvik etmek için yeni filmler üretmeye başlamalıyız."
 JAP_ensure_cross_party_support:0 "Partiler Arası İşbirliğini Sağla"
 JAP_ensure_cross_party_support_desc:0 "Bir koalisyon yolda olduğuna göre, zorluklar karşısında parçalanmamak için diğer partilerin de desteğini kazanmaya çalışmalıyız. Birlikte, Taishō demokrasisi ruhunu geri getirebiliriz!"
 JAP_ensure_temporary_peace_with_china:0 "Çin ile Geçici Barışı Sağla"
 JAP_ensure_temporary_peace_with_china_desc:0 "Dikkatimizi [SOV.GetNameDef] devletine odaklamak için, hain [CHI.GetAdjective] güçlerimizin başka yerlerde muharebeye girdiği sırada bizi arkadan bıçaklamayacağından emin olmalıyız. Ayrıca bu arada Kwantung Ordusu'nun çizgi dışına çıkamayacağından emin olmalıyız ki kazanamayacağımız bir savaş başlatmasınlar."
 JAP_escort_efficiency:0 "Hava Eskortlarına Yatırım Yap"
 JAP_escort_efficiency_desc:0 "Bombardıman uçaklarımızın ve nakliye uçaklarımızın engellenip düşürülmemesi için hava savaşı da dahil olmak üzere her alanda düşmanlarımıza karşı üstünlüğü korumalıyız. Modernize edilmiş avcı uçakları bunu başarmanın esası ve gelecekteki zaferlerin anahtarıdır."
 JAP_establish_housing_corporation:0 "Konut Kurumu Kur"
 JAP_establish_housing_corporation_desc:0 "Ülke genelinde ihtiyacı olan herkese konut sağlamak için, işçiler için on binlerce konut birimi ve marangozlar ve vatandaşlar için birçok kiralık mülk inşa etme hedefi olan bir kurum kurmalıyız."
 JAP_establish_manchuria_airplane_manufacturing_company:0 "Mançurya Uçak Şirketini Kur"
 JAP_establish_manchuria_airplane_manufacturing_company_desc:0 "Teçhizatımızı kaynakların çıkarıldığı yere daha yakın üretmek için Nakajima Uçak Şirketi, Mançurya'da şu anda Manshū olarak adlandırdıkları gözetimimiz altında bir yan kuruluş açmayı teklif etti. Bu parlak fikri desteklemeliyiz."
 JAP_establish_mongol_military_government:0 "Moğol Askeri Hükümetini Kur"
 JAP_establish_mongol_military_government_desc:0 "Büyük Cengiz Han'ın soyundan gelen Prens De, İç Moğolistan'daki Kuomintang'ın kukla liderliği olan Pailingmiao Konseyi içinde güçlü bir konuma sahip. Moğolları eski ihtişamlarına kavuşturmak istiyor ve hırslarını yerine getirme sözü verirsek bir Moğol Askeri Hükümeti kurma konusunda bizimle taraf olmaya fazlasıyla istekli olacaktır."
 JAP_establish_nippon_hassoden:0 "Nippon Hassoden'i Kur"
 JAP_establish_nippon_hassoden_desc:0 "Milli elektrik arzı üzerindeki hükümet kontrolümüzü artırmak ve kullanımı düzenleme yeteneği için, elektrik endüstrisini düzenlemek üzere Japonya Elektrik Üretim ve İletim Şirketi'ni kurmalıyız. Bu, mevcut elektrik enerjisi şirketlerinin birleşmesiyle kolayca başarılacaktır."
 JAP_establish_showa_aircraft_idnsutry:0 "Showa Uçak Endüstrisini Kur"
 JAP_establish_showa_aircraft_idnsutry_desc:0 "Tokyo, Akishima'da Shōwa Hikōki Kōgyō Kabushiki-gaisha'yı kurma izni için bir talep aldık. Bu şirket, silahlı kuvvetlerimize sağlamak üzere askeri uçaklar inşa etmek istiyor. Taleplerini onaylamalı ve bize havacılık teçhizatı sağlama konusunda hemen çalışmaya başlamalarını sağlamalıyız."
 JAP_establish_synthetic_fuel_joint_venture:0 "Sentetik Yakıt Ortak Girişimi Kur"
 JAP_establish_synthetic_fuel_joint_venture_desc:0 "20'lerden beri, kömür ve petrol için sentetik kaynak çıkarma merkezleri kurmak üzere Almanya ile ortak girişimlerimiz var. Ufuklarımızı genişletmeli ve batılı güçlerle bu işbirliğini artırmanın yollarını aramalıyız, böylece nihayet kendi kendimize yetebilir hale gelebiliriz."
 JAP_establish_synthetic_fuel_joint_venture_tt:0 "Eğer bir §YBatılı Büyük Devlet§! §Y[ROOT.GetNameDef]§! devletini §Ygaranti altına almışsa§! veya en az §Y75§! Görüşe sahipse, [ROOT.GetNameDef] ek bir $cat_synth_oil$ teknoloji bonusu ve §Y$synthetic_refinery$§! alır"
 JAP_establish_the_gunbatsu:0 "Gunbatsu'yu Kur"
 JAP_establish_the_gunbatsu_desc:0 "Hükümeti yeniden düzenlemek için önce yapısını sökmeli ve baştan aşağı yeniden inşa etmeliyiz. Bunu başarmak için, ülkeyi kapalı bir iç daire olarak yönetmede imparatora yardımcı olacak bir askeri kliğin kurulması için hazırlıklar çoktan başladı."
 JAP_establish_the_japanese_korean_army:0 "Japon Kore Ordusunu Genişlet"
 JAP_establish_the_japanese_korean_army_desc:0 "1904'ten beri Chōsen-gun Kore'de bir garnizon gücü olarak faaliyet gösterdi, ancak 1931'deki Mançurya işgali dışında pek bir muharebe görmedi. Bu orduyu genişletmek amacıyla Kore valiliğimizi bağlayan anlaşmaları iptal etmeliyiz, böylece uygun bir savaş gücü olarak kullanılabilir."
 JAP_establish_the_mine_warfare_force:0 "Mayın Harp Kuvvetini Kur"
 JAP_establish_the_mine_warfare_force_desc:0 "Batılı ulusların denizleri kontrol etmenin bir yolu olarak deniz mayınlarını kullandığı dikkatimizi çekti. Bu fikirleri benimsemeliyiz, ancak bunları takip etmekten ve gerektiğinde suları mayınlardan temizlemekten sorumlu olacak bir güç kurmadan değil."
 JAP_eth_is_invited_to_faction_tt:0 "§Y[ETH.GetNameDefCap]§! ittifakımıza davet edildi"
 JAP_every_kodoha_member_tt:0 "Her §YKōdōha Sempatizanı§!:"
 JAP_expand_hiratsuka_navy_arsenal:0 "Hiratsuka Donanma Mühimmat Cephaneliğini Genişlet"
 JAP_expand_hiratsuka_navy_arsenal_desc:0 "1905'te kurulan Hiratsuka Donanma Mühimmat Cephaneliği büyük ölçüde genişletilme potansiyeline sahiptir. Makineli tüfek mühimmatı, donanma top mermileri, çözücü geri kazanımı ve nitrogliserin üretimi dahil olmak üzere tasarım ve mühendislik için farklı tesislerde uzmanlaşabilecekler."
 JAP_expand_hiratsuka_navy_arsenal_tt:0 "Ya §YLondra Deniz Anlaşması'ndan§! ayrıldı ya da bir §YYürüyen Merdiven Maddesi Yürürlüğe Girdi§!"
 JAP_expand_japan_manchukuo_economic_bloc:0 "Japonya-Mançukuo Ekonomik Bloğu"
 JAP_expand_japan_manchukuo_economic_bloc_desc:0 "Ekonomilerimizi güçlendirmek ve demir, kömür, pamuk ve tuz gibi yeterli stratejik malzemeleri güvence altına almak için imparatorluk bağlı devletlerimizle aramızda bir ekonomik blok oluşturma inisiyatifini almalıyız."
 JAP_expand_kawagoe_army_arsenal:0 "Kawagoe Ordu Cephaneliğini Genişlet"
 JAP_expand_kawagoe_army_arsenal_desc:0 "Silah endüstrimiz şu anda ordumuzun modern bir savaş alanında savaşabilmesini sağlamak için üretim taleplerine ayak uydurmakta zorlanıyor. Arzı taleple eşleştirme şansımızı artırmak için Saitama'daki Kawagoe ordu cephaneliğini genişletmeliyiz."
 JAP_expand_navy_technical_department:0 "Donanmanın Teknik Departmanını Genişlet"
 JAP_expand_navy_technical_department_desc:0 "Donanmamızdaki artışın boyutu ve dolayısıyla bu artışı sağlamak için gereken tersane tesisleri için yeni tahminler yayınlamalıyız. Tesislerimizi modern gereksinimlere uygun hale getirmenin ilk adımı donanmanın teknik departmanını genişletmek olacaktır."
 JAP_expand_the_irago_proving_ground:0 "Irago Deneme Sahasını Genişlet"
 JAP_expand_the_irago_proving_ground_desc:0 "Savaş alanına daha iyi hakim olmak için, yeni ve deneysel silahları test ettiğimiz Irago deneme sahasını genişletmeliyiz. Orada, tüm düşmanlarımızı dize getirecek savaş araçları geliştirebiliriz."
 JAP_expand_the_metropolitan_police:0 "Büyükşehir Polis Departmanlarını Genişlet"
 JAP_expand_the_metropolitan_police_2_tt:0 "Demokratik hükümet, §Yİç Savaş§! gerçekleştiğinde ek §G8§! §YPolis Tümeni§! kazanacak"
 JAP_expand_the_metropolitan_police_desc:0 "Sivil polis gücünün ordunun kontrolü altında olmayan, kesinlikle bizim tarafımızda savaşa hazır bir grup olduğunu kesin olarak biliyoruz. Kōdōha ittifakını devirmemize yardım ettiler ve bu kaotik durumda düzeni sağlamada bize bir kez daha yardım edebilirler."
 JAP_expand_the_metropolitan_police_tt:0 "§G2§! §YGeneral§! bize sadık olacak"
 JAP_expand_the_showa_research_association:0 "Showa Araştırma Derneği'ni Genişlet"
 JAP_expand_the_showa_research_association_desc:0 "Meiji Anayasası ile ilgili sorunları gözden geçirerek ve değerlendirerek siyasi reform için yenilikçi fikirler üretmek amacıyla kurulan bir siyasi düşünce kuruluşu olan Shōwa Kenkyūkai, ilgi alanlarını genişletiyor ve yeni alt gruplar oluşturuyor. Bunu teşvik etmeliyiz ki yeni teknolojiler ve Asya'ya hükmetmenin yollarını geliştirebilsinler."
 JAP_experimental_housing_solutions:0 "Deneysel Konut Çözümleri"
 JAP_experimental_housing_solutions_desc:0 "Kentsel gelişim dört işlevsel kategori tarafından yönlendirilmelidir: barınma, iş, ulaşım ve rekreasyon. Kenzo Tange ve diğer yeni mimarlar, metabolizma olarak adlandırdıkları yeni ve yaklaşan bir hareketin parçası olarak şehirleri inşa etmenin yeni bir yolunu önerdiler. Bu fikri teşvik etmeliyiz, böylece tüm vatandaşlarımız için yaşam durumunu iyileştirebiliriz."
 JAP_extensive_army_maneuvers:0 "Kapsamlı Ordu Manevraları Başlat"
 JAP_extensive_army_maneuvers_desc:0 "Ulusumuz bir iç savaşa sürüklendiğinde Mançurya'yı ele geçiren Kwantung Ordusu'nu devirmek için ordumuzun iyi durumda olduğundan ve onları alt etmeye hazır olduğundan emin olmalıyız. Bu nedenle savaşa hazır olduğumuzdan emin olmak için büyük ölçekli manevralar düzenlemeliyiz."
 JAP_extensive_navy_maneuvers:0 "Kapsamlı Donanma Manevraları Başlat"
 JAP_extensive_navy_maneuvers_desc:0 "Ulusumuz bir iç savaşa sürüklendiğinde ortaya çıkan ayrılıkçı devletleri devirmek için donanmamızın iyi durumda olduğundan ve onları alt etmeye hazır olduğundan emin olmalıyız. Bu nedenle savaşa hazır olduğumuzdan emin olmak için büyük ölçekli manevralar düzenlemeliyiz."
 JAP_f_go_nuclear_project:0 "F-Go Nükleer Projesi"
 JAP_f_go_nuclear_project_desc:0 "Donanma komutanlığımız, teknolojinin gücünü filomuz için kullanma umuduyla bir nükleer araştırma programı başlatmak istiyor. Bunun Kyoto İmparatorluk Üniversitesi'nde Bunsaku Arakatsu yönetiminde yürütülmesini önerdiler. Ekibi, ihtiyacımız olan atılımları kesinlikle başaracak önde gelen bir teorisyen olan Hideki Yukawa'yı içeriyor."
 JAP_female_leader_2_text:0 "onun"
 JAP_female_leader_3_text:0 "onu"
 JAP_female_leader_text:0 "o"
 JAP_first_strike_blocked_due_to_kwantung_army_tt:0 "Kwantung Ordusu'nun §RPlansız Taarruzu§! nedeniyle, §Y$JAP_first_strike_principle_dm$§! bonusunu kazanamayacağız"
 JAP_first_strike_principle_tt:0 "§Y[ROOT.GetNameDef]§!, §Ykomşu bir ülkeye§! veya bağlı ülkelerinden birinin komşusuna §Rsavaş ilan ettiğinde§! §Y90 gün§! boyunca şunları kazanır:\n §Y$JAP_first_strike_principle_dm$§!\n $MODIFIER_ATTACK_BONUS_AGAINST_A_COUNTRY$: §G+10.0%§!\n  $MODIFIER_BREAKTHROUGH_BONUS_AGAINST_A_COUNTRY$: §G+10.0%§!"
 JAP_fix_flawed_naval_designs:0 "Kusurlu Tasarımları Düzelt"
 JAP_fix_flawed_naval_designs_desc:0 "Gemi tasarımlarımızın üst kısmı ağır olduğu kanıtlandı ve limandan ayrılır ayrılmaz devrildikleri olaylar yaşadık. Bu sorunları derhal çözmeliyiz, böylece gemilerimiz denize güvenli bir şekilde açılabilecek."
 JAP_focus_on_aircraft_carriers:0 "Uçak Gemilerine Odaklan"
 JAP_focus_on_aircraft_carriers_desc:0 "Savaş gemileri geçmiş bir çağın kalıntılarıdır. Geleceğe bakmalıyız ve gelecek havacılıktadır. Uçak gemileri bu hava gücünü Pasifik genelinde yansıtmamıza izin verecektir."
 JAP_foreign_tank_modernization_cooperation:0 "Yabancı Tank Modernizasyon Girişimi"
 JAP_foreign_tank_modernization_cooperation_2_tt:0 "Tüm §YTank Tasarımcıları§! için §Y$JAP_mio_trait_foreign_research_and_development_cooperation$§! MIO özelliğinin kilidini açar. §RAncak bunlardan sadece birine uygulanabilir§!."
 JAP_foreign_tank_modernization_cooperation_desc:0 "Batıyı yenmek için önce tasarımlarını incelemeli ve bu sayede onların nasıl üstesinden gelineceğini öğrenmeliyiz. Batılı güçlerden biriyle dostluk kurmalıyız, böylece sonunda onların bile hayran kalacağı tanklar üretebiliriz."
 JAP_foreign_tank_modernization_cooperation_tt:0 "Bir §YBatılı Büyük Devlet§! §Y[ROOT.GetNameDef]§! devletini §Ygaranti altına aldı§! veya onunla bir §Yİttifak§! içinde"
 JAP_form_cabinet_intelligence_bureau:0 "Kabine İstihbarat Bürosu'nu Kur"
 JAP_form_cabinet_intelligence_bureau_desc:0 "Başbakan [ROOT.GetLeader], Japonya yanlısı kamuoyunu iyileştirmeye odaklanan ve her vatandaşın savaşa ve büyük ulusumuzun savunmasına her şeyini katmasını sağlayan bir hükümet örgütü kurulmasını şahsen talep etti. Nobuhumi Ito talebini kabul etti ve büronun kurulması için sadece resmi emirlere ihtiyacı var."
 JAP_form_greater_east_asian_currency_union:0 "Büyük Doğu Asya Para Birliği'ni Kur"
 JAP_form_greater_east_asian_currency_union_desc:0 "Tüm Asya'da tek bir para biriminin kullanımına doğru ilerlemeliyiz, eski siyasi teorisyenlerimizin Yen bloğu olarak adlandırdığı bir şey. Bu hedefe doğru bir adım daha atmanın ve tüm yeni müttefiklerimiz için bir para birliği kurmanın zamanı geldi."
 JAP_form_greater_east_asian_currency_union_tt:0 "Müttefiklerimizi §YPara Birliği'ne§! davet etme kararlarının kilidini açar"
 JAP_form_greater_east_asian_customs_union:0 "Büyük Doğu Asya Gümrük Birliği'ni Kur"
 JAP_form_greater_east_asian_customs_union_desc:0 "Ekonomik teorisyenlerimiz tarafından uzun zamandır planlandığı gibi, Pasifik gümrük birliğini kurmaya çalışmalı ve yavaş ama emin adımlarla Asya ekonomilerini en güçlü tek bir güçte birleştirmeliyiz."
 JAP_form_national_cooperatives:0 "Milli Kooperatifler Kur"
 JAP_form_national_cooperatives_desc:0 "Düşünürlerimizin çoğu, ortak ekonomik, sosyal veya kültürel ihtiyaçları olan bireyler veya işletmeler tarafından oluşturulan kuruluşlar olan daha fazla milli kooperatifin kurulmasını savunuyor. Üye mülkiyeti, demokratik kontrol ve karşılıklı yarar ilkelerine göre çalışırlar. Bunların yaratılmasını teşvik etmeliyiz."
 JAP_form_pioneer_organizations:0 "Öncü Örgütleri Kur"
 JAP_form_pioneer_organizations_desc:0 "Partinin, devlete yardım edebilecek ve bir gün onu savunabilecek düzgün komünistler olmak için faaliyetlere katılabilecekleri gençlik örgütleri kurması gerekiyor."
 JAP_form_the_central_economic_council:0 "Merkezi Ekonomik Konseyi Kur"
 JAP_form_the_central_economic_council_desc:0 "Siyasi istikrarsızlık ve savaş nedeniyle ülkemizin karşı karşıya olduğu ekonomik durgunluğu çözmek için, anavatan ve denizaşırı topraklar arasındaki ekonomik politikaları ve bunların uygulanmasına yönelik temel planları araştırmak ve müzakere etmek amacıyla Başbakan'a bağlı özel bir danışma organı kurmalıyız."
 JAP_form_the_dai_nippon_fujinkai:0 "Dai Nippon Fujinkai'yi Kur"
 JAP_form_the_dai_nippon_fujinkai_desc:0 "Yamauchi Sachiko, kadınları savaş işlerinde seferber etmek; ordunun moralini güçlendirmek, ulusun kaynaklarını korumak için tutumlu bir yaşam tarzı sürdürmek, üretim seviyelerini yükseltmek ve orduyu desteklemek amacıyla diğer üç milliyetçi Kadın Derneği'nin önerilen bir birleşmesi olan Büyük Japonya Kadınlar Derneği'ni kurmaya gönüllü oldu."
 JAP_form_the_great_japan_industrial_patriotic_association:0 "Büyük Japonya Endüstriyel Vatanseverlik Derneği"
 JAP_form_the_great_japan_industrial_patriotic_association_desc:0 "Ulusumuzdaki sanayiciler ve sendikalar bölünmüş ve verimsiz durumda, bu da ekonomik kalkınmamızı engelliyor. Bunların hepsini tek bir çatı örgüt altında birleştirmeliyiz, böylece endüstrilerimiz mümkün olduğunca verimli bir şekilde yönetilebilir ve daha fazla genişlemeye yol açabilir."
 JAP_form_the_jikyoku_iinkai:0 "Jikyoku Iinkai'yi Kur"
 JAP_form_the_jikyoku_iinkai_desc:0 "[USA.GetNameDef] devletine giden ve oradan gelen ithalat ve ihracatımızı daha iyi kontrol etmek ve [USA.GetAdjective] halkını [CHI.GetNameDef] yerine bizim tarafımızda olmaya ikna etmeye çalışmak için Japon Ticaret ve Enformasyon Komitesi'ni kurmalıyız."
 JAP_form_the_kido_butai:0 "Kido Butai'yi Kur"
 JAP_form_the_kido_butai_desc:0 "Saldırı vuruş gücünü en üst düzeye çıkarmak için dünyanın gördüğü en büyük uçak gemisi konsantrasyonunu tek bir savaş grubunda birleştireceğiz. Bu formda uyumlu saldırı operasyonlarını mümkün kılmak için gereken doktrinleri geliştirerek, düşmanlarımız deniz havacılığındaki üstünlüğümüze karşı hiçbir şansa sahip olmayacak."
 JAP_form_the_kido_butai_tt:0 "§Y[USA.GetNameWithFlag]§! üzerindeki Pearl Harbor §YBaskını§! için başarı şansı artacak"
 JAP_form_the_ldp:0 "LDP'yi Kur"
 JAP_form_the_ldp_desc:0 "Rikken Seiyūkai hem meclisin hem de kabinenin kontrolünü sağladığına göre, daha verimli bir yönetim organına dönüştürülmesinin zamanı geldi. Ichiro Hatoyama'nın direktifini takiben, öngörülebilir gelecekte ulusu yönetmeyi amaçlayan Liberal Demokrat Parti'yi kurmanın zamanı geldi."
 JAP_form_the_yokusan_sonendan:0 "Yokusan Sonendan'ı Kur"
 JAP_form_the_yokusan_sonendan_desc:0 "Ulusumuzun egemenliğini korumak için, sadece bizim için savaşmaya istekli değil, aynı zamanda resmi yerel makamların yönetimi altında sivil savunma konularında yardımcı olmak için yerel muhafızlarda yer alacak daha fazla insana ihtiyacımız var. Bu amaçla, İmparatorluk Yönetimine Yardım Derneği'nin seçkin bir paramiliter gençlik kolu olan 'Yokusan Sonendan'ı kurmalıyız."
 JAP_formalize_japan_china_manchukuo_alliance:0 "Japonya - Çin - Mançukuo İttifakı"
 JAP_formalize_japan_china_manchukuo_alliance_desc:0 "[CHI.GetLeader] hükümetinin komünist ve Japon karşıtı faaliyetleri bastırma taleplerimizi kabul etmesiyle, Doğu Asya'nın bağrında savaş ağaları ve komünizm olarak bilinen ve tüm Asya'yı kesin ve kaçınılmaz bir ölümle tehdit eden iltihaplı yarayla başa çıkmak için bizimle geçici olarak bir ittifak kurmaya istekli olmaları artık muhtemel görünüyor."
 JAP_formalize_the_tonarigumi:0 "Tonarigumi'yi Resmileştir"
 JAP_formalize_the_tonarigumi_desc:0 "Mahalle Birlikleri, karneyle dağıtılan malların tahsis edilmesine, devlet tahvillerinin dağıtılmasına, yangınla mücadeleye, halk sağlığına, sivil savunmaya, manevi seferberlik propagandası dağıtmaya, Tokkō'yu siyasi muhalefet hakkında bilgilendirmeye ve şüpheli faaliyetler için kıyıları izlemeye yardımcı olarak gayri resmi olarak bir süredir mevcuttur. Onları resmileştirmeliyiz ki bu gruplara daha fazla fon ayırabilelim."
 JAP_formalize_the_tonarigumi_tt:0 "Bağlı devletlerimizde §YTonarigumi Organize Et§! kararlarının kilidini açar"
 JAP_found_the_air_defense_surveilance_corps:0 "Hava Savunma Gözetleme Kolordusu'nu Kur"
 JAP_found_the_air_defense_surveilance_corps_desc:0 "Düşman uçak saldırılarının erken tespitini sağlamak için, sivillerimizi ülkenin her yerinde kurulan hava savunma gözlem noktalarında hizmet etmeye, düşman uçaklarını erken aşamada tespit etmeye ve ilgili makamlara bildirmeye seferber etmeliyiz. Bu, Hava Savunma Yasası çıkarılarak organize edilecektir."
 JAP_found_the_boeitai:0 "Boeitai'yi Kur"
 JAP_found_the_boeitai_desc:0 "Kendi topraklarımızda bir savunma savaşı giderek daha gerçekçi hale gelirken, bir düşman saldırısı durumunda Ana Adalarımızı savunmak için hızla seferber edilebilecek bir tür Savunma Kolordusu kurmalıyız. Bu, Japon zorunlu askerlik sistemi kapsamında normalde askerlik hizmetinden sorumlu olmayan bireyleri de içerecektir."
 JAP_found_the_boeitai_tt:0 "Ana Adalarda §YGönüllü Savaşçı Birlikleri Milisleri§! toplama yeteneğinin kilidini açar"
 JAP_found_the_great_japan_press_association:0 "Büyük Japonya Basın Derneği'ni Kur"
 JAP_found_the_great_japan_press_association_desc:0 "Kabine İstihbarat Bürosu, nüfusumuzu doğru yöne daha verimli bir şekilde yönlendirmenin bir yolunu buldu. Büyük Japonya Basın Derneği'ni kurarak, ülke içindeki tüm medyayı kontrol eden tek bir ofise sahip olabilir, ihtiyacımız olan her türlü bilgiyi etkili bir şekilde sansürleyebilir ve ihtiyacı olabilecek kişilere vatansever propaganda dağıtabiliriz."
 JAP_free_asians_from_soviet_opression:0 "Asyalıları Sovyet İşgalinden Kurtar"
 JAP_free_asians_from_soviet_opression_desc:0 "Rus bolşevikleri, halkı kontrol etmek ve geleceklerini inkar etmek isteyen kapitalistlerden daha iyi değiller. Asyalıları ezmeye devam ederlerken elimiz kolumuz bağlı duramayız. Harekete geçme zamanı!"
 JAP_free_colonized_asian_countries:0 "Sömürgeleştirilmiş Asya Ülkelerini Özgürleştir"
 JAP_free_colonized_asian_countries_desc:0 "Asya'da şu anda Batılı güçlerin işgali altında olan birçok ulus var. Asya'nın yeni koruyucuları olarak, bu Batılılara yaklaşmalı ve reddedemeyecekleri teklifler sunmaya çalışarak bu sömürgeler üzerinde bize kontrol vermelerini sağlamalıyız."
 JAP_free_colonized_asian_countries_tt:0 "§YAsyalı Olmayan Ulusların§! bağlı devleti olan §YAsya Ulusları§! üzerinde §YHakimiyet Talep Et§! kararlarının kilidini açar"
 JAP_fukumotoism:0 "Fukumotoizm"
 JAP_fukumotoism_desc:0 "Fukumoto Kazuo, hareketi siyasi bir mücadeleye dönüştürmek için teorik mücadele yoluyla işçilere dışarıdan Marksist bilinç aşılayacak radikal bir öncü parti tarafından teorik ve siyasi mücadeleye duyulan ihtiyacı vurguladı. Bunu yönetimimize dahil ederek, halkımıza ulaşmanın ve onlara istediğimiz fikirleri yaymanın daha iyi bir yolunu kurabiliriz."
 JAP_fukumotoism_tt:0 "§G6§! defaya kadar alınabilen, §YSivil Fabrikalar§! ve §Y$MODIFIER_CONSUMER_GOODS_FACTOR$§! bonusları veren bir kararın kilidini açar"
 JAP_fund_propaganda_films:0 "Propaganda Filmlerini Finanse Et"
 JAP_fund_propaganda_films_2_tt:0 "§Y[ROOT.GetImportOrDomesticFilmIndustry]§! fazladan bir kez daha alınabilir"
 JAP_fund_propaganda_films_desc:0 "Donanmamız, halkımızı savaşmaya devam etmeleri için motive etmek amacıyla film endüstrisine daha büyük yatırımlar yapılmasını önerdi. Bu nedenle, İmparatorluk Japon Donanması'nın anlatısını güçlendirirken İmparatorluk Japon Ordusu'nu bu süreçte harcayan animasyonlu bir propaganda filmi üretmek için Hareketli Resim Laboratuvarı ile anlaştılar."
 JAP_fund_propaganda_films_tt:0 "§Y[ROOT.GetImportOrDomesticFilmIndustry]§! Kararını yeniler"
 JAP_fund_resistance_groups_in_asia:0 "Asya'daki Direniş Gruplarını Finanse Et"
 JAP_fund_resistance_groups_in_asia_desc:0 "Kıtamızda yabancı baskısına karşı mücadele eden ve teklif edersek yardımımızı memnuniyetle kabul edecek birçok kişi var. Bunu batılı güçleri zayıflatmak ve tüm Asya için özgürlük ve hürriyeti teşvik etmek için bir fırsat olarak kullanmalıyız!"
 JAP_fund_resistance_groups_in_asia_tt:0 "İşgal altındaki Asya eyaletlerinde direnişi artırmak ve saldırı bonusları kazanmak için §Ykararların§! kilidini açar"
 JAP_fund_the_riken_institute:0 "RIKEN Enstitüsü'nü Finanse Et"
 JAP_fund_the_riken_institute_desc:0 "Taishō döneminde 1917'de kurulan Fiziksel ve Kimyasal Araştırma Enstitüsü, şu anda yaklaşık 121 fabrikayı ve 63 şirketi kontrol eden bir zaibatsu olan Riken Concern tarafından kontrol edilmektedir. Vikont Masatoshi Ōkōchi yönetiminde, atom araştırma programımızı orada yürütebilmemiz için enstitüyü daha da genişletmeye çalışmalıyız."
 JAP_fund_the_riken_institute_tt:0 "Eğer $JAP_zaibatsu_faction$ en az $JAP_imperial_influence_tier_3$ ise, ayrıca §G1§! §YNükleer Araştırma Tesisi§! kazan"
 JAP_further_rural_investments:0 "Daha Fazla Kırsal Yatırım"
 JAP_further_rural_investments_desc:0 "Kırsal bölgelerimiz merkezi hükümet tarafından uzun süredir ihmal ediliyor ve Tokyo gibi şehirlerin hızlı sanayileşmesi insanları kırsaldan uzaklaştırarak birçok kasaba ve köyü zor durumda bıraktı. Bu alanlara yatırım yapmalıyız, böylece onları çalışır durumda tutmak için gereken iş gücü etrafta kalabilsin."
 JAP_further_rural_investments_tt:0 "§Y4§! veya daha fazla §YAltyapıya§! sahiplerse yukarıdaki eyaletlerin §YEyalet Kategorisini§! §Gİyileştirme§! kararlarının kilidini açar"
 JAP_further_urban_investments:0 "Daha Fazla Kentsel Yatırım"
 JAP_further_urban_investments_desc:0 "Kentsel merkezlerimizin yatırıma çok ihtiyacı var. Şehirlerde bulunan endüstrilerin üretim kotalarını sürdürmek için ihtiyaç duydukları verimliliğe ve işçilere sahip olmasını istiyorsak, devreye girmeli ve onlara yardım etmeliyiz."
 JAP_gain_national_defense_state_remove_total_mob_tt:0 "§Y$tot_economic_mobilisation$§! yasasını §RKaldır§!. §Y$national_defense_state$§! kazan."
 JAP_ganbarou:0 "Ganbarou!"
 JAP_ganbarou_desc:0 "[ROOT.GetAdjective] erkeği ve kadını, devleti geçindirmek için elinden gelenin en iyisini yapacak çalışkan insanlardır. Bunu propaganda etmeli ve iyi çalışmayı ve sıkı çalışmayı [ROOT.GetAdjective] toplumunun temel bir parçası olarak teşvik etmeliyiz."
 JAP_gather_royal_pacifists_support:0 "Kraliyet Pasifistlerinin Desteğini Topla"
 JAP_gather_royal_pacifists_support_desc:0 "Kraliyet ailesi içinde askeri hakimiyetin siyasete üstün gelmesi fikrini ve topyekün savaş doktrinini desteklemeyen birçok kişi var. Hükümetimizden askeri unsurları çıkarma çabamız için desteklerini kazanmak amacıyla Sadako Kujō, Nobuhito ve Koichi Kidō'ya ulaşmalıyız."
 JAP_gather_royal_pacifists_support_tt:0 "Eğer §Yİmparator Hirohito§! §Yİç Savaş§! sırasında ordunun yanında yer alırsa, küçük kardeşi §YNobuhito§! ve annesi §YSadako Kujō§! tarafından §YKraliyet Desteğini§! koruyabileceğiz"
 JAP_give_it_your_all_for_the_emperor:0 "Her Şeyini İmparator İçin Ver!"
 JAP_give_it_your_all_for_the_emperor_desc:0 "[ROOT.GetAdjective] erkeği, büyük imparatorumuza hararetle inanan çalışkan bir kişidir. Bunu propaganda etmeli ve iyi çalışmayı ve sıkı çalışmayı [ROOT.GetAdjective] toplumunun temel bir parçası olarak teşvik etmeliyiz."
 JAP_give_it_your_all_for_the_emperor_tt:0 "Seviye §Y4§! veya daha yüksek §YAltyapıya§! sahip başlangıç ana eyaletlerinde §G1§! §YSivil Fabrika§! inşa etme kararlarının kilidini açar. \n§RBu karar eyalet başına sadece bir kez alınabilir§!"
 JAP_go_after_the_capitalists:0 "Kapitalistlerin Peşine Düş"
 JAP_go_after_the_capitalists_desc:0 "Batılı kapitalistler, karşılığında hiçbir şey vermeden Asya halkından çalmaya çalışıyorlar. İnsanları geri dönüşü olmayan bir noktaya kadar sömürmeden önce onları yere sermeliyiz."
 JAP_grand_army_purge:0 "Büyük Ordu Tasfiyesi"
 JAP_grand_army_purge_desc:0 "Ordu üzerindeki hakimiyetimizin mutlak olmasını sağlamak için, ülkeyi Meiji oligarşisinin fikirlerini desteklemeye çalışan ve kendi çıkarları için imparatoru kontrol etmeye çalışan aşağılık Tōseiha subayları da dahil olmak üzere iktidar yolumuzda bize karşı çıkacak ve engelleyecek hainlerden temizlemeliyiz. Her ne pahasına olursa olsun, ordu bu kötü aktörlerden temizlenmelidir!"
 JAP_grand_army_purge_tt:0 "Çeşitli §YToseiha Üyelerini§! ve §YSamuray Soyundan§! subayları §RTasfiye eder§! ve Darbeye katılan §YGenç Subayları§! §GTerfi ettirir§!. §RKaldırılan§! önemli komutanlar şunlardır:\n"
 JAP_greater_east_asia_railroad:0 "Büyük Doğu Asya Demiryolu"
 JAP_greater_east_asia_railroad_desc:0 "Önde gelen mühendislerimiz, ulusumuzu Kore mülkümüze bağlayan bir tünel veya köprü de dahil olmak üzere Japonya'yı Asya anakarasına ve Avrupa'ya bağlayan bir demiryolu fikriyle geldiler. Güney Mançurya Demiryolu'ndan fikir alan hızlı trenlerimiz Tokyo'dan Rangoon'a ve oradan Tahran'a gidecek. İmparatorluğumuz sonsuza dek sürsün!"
 JAP_greater_east_asia_railroad_tt:0 "Bizim veya müttefiklerimizin kontrolündeki §Y2 Altyapıdan§! az olan her eyalet §G1§! §YAltyapı§! kazanacak"
 JAP_greater_east_asian_federation:0 "Büyük Doğu Asya Federasyonu"
 JAP_greater_east_asian_federation_2_tt:0 "§YKontrolümüz§! altındaki §YAsya§! eyaletlerini entegre etme kararlarının kilidini açar"
 JAP_greater_east_asian_federation_desc:0 "Asya halklarını tek bir devlet altında birleştirebileceğimiz gün nihayet geldi! Kurucu parçalarımızı entegre etmek ve Büyük Doğu Asya Federasyonu'nu kurmak, demokrasiyi Asya'nın her köşesine yaymak için hızla hareket etmeliyiz."
 JAP_greater_east_asian_federation_tt:0 "§YBüyük Doğu Asya Federasyonu§! olarak bilineceğiz"
 JAP_greater_east_asian_treaty_organization:0 "Büyük Doğu Asya Antlaşması Örgütü"
 JAP_guardian_of_the_pacific:0 "Pasifik'in Koruyucusu"
 JAP_guardian_of_the_pacific_desc:0 "Pasifik içindeki ve çevresindeki tüm Asya devletlerinin koruyucusu rolünü üstleneceğiz. Batı emperyalizminden kurtulduktan sonra, onları tam teşekküllü demokrasiler olarak yükseltmek için rehber bir ele ihtiyaç duyacaklar. Bu hedefe ulaşmanın ilk adımı, [ENG.GetNameDef] devletinin pasifik sömürge bağlı devletlerinin yeni koruyucusu olmayı teklif etmektir."
 JAP_guide_the_chinese:0 "Çinlilere Rehberlik Etmek İçin"
 JAP_guide_the_chinese_2_tt:0 "Her §YKomünist Çin§! ulusu ittifakımıza davet edildi. Mevcut hedefler:"
 JAP_guide_the_chinese_desc:0 "Devrim Çin'de hala başarılı olamadı. Devreye girmeli ve Çin halkına refaha doğru bizzat rehberlik etmeli ve onları feodal ve modası geçmiş yaşam tarzlarından kurtarmalıyız."
 JAP_guide_the_chinese_tt:0 "Her §YKomünist Olmayan Çin§! devletine karşı bir §YKukla§! savaş hedefi kazanacağız. Mevcut hedefler:"
 JAP_guide_the_lesser_states:0 "Küçük Devletlere Rehberlik Et"
 JAP_guide_the_lesser_states_desc:0 "Daha az gelişmiş Asya devletleri, bir devrim gerçekleştirme ve kendilerine ait bir işçi cumhuriyeti kurma konusunda başarılı olma ön koşullarına sahip değildir. Onlara rehberlik etmeli ve bir devleti nasıl düzgün bir şekilde yöneteceklerini göstermeliyiz."
 JAP_guide_the_mongols:0 "Moğollara Rehberlik Et"
 JAP_guide_the_mongols_desc:0 "Devrim Moğolistan'ın bazı bölgelerinde başarılı olmuş olabilir, ancak şimdi bunun yerine Sovyet baskısı altındalar. Devreye girmeli ve Moğol halkına refaha doğru bizzat rehberlik etmeli ve onları feodal, modası geçmiş ve otoriter yaşam tarzlarından kurtarmalıyız."
 JAP_hakko_ichiu:0 "Hakko Ichiu"
 JAP_hakko_ichiu_desc:0 "Tüm dünya tek bir çatı altında birleşmelidir! Nihon Shoki'de emredildiği gibi yönetimimiz altında bunu yapmak için ilahi hakka sahibiz. İmparator Jimmu tahta çıktığı sırada şunları ilan etti: 'Sekiz yönü kaplayacağım ve onları meskenim yapacağım'. Arzusunu nihayet yerine getirme zamanı geldi!"
 JAP_hakko_ichiu_tt:0 "Bizim §YSahip Olduğumuz§! veya §YKontrol Ettiğimiz ve Talep Ettiğimiz§! §YAsya§! eyaletlerini entegre etme kararlarının kilidini açar"
 JAP_hasten_the_integration_of_taiwan:0 "Tayvan'ın Entegrasyonunu Hızlandır"
 JAP_hasten_the_integration_of_taiwan_desc:0 "Tayvan entegrasyon çabalarımız, sadece birkaç ana aksilikle iyi gidiyor. Zamanla ada, Ryukyu kadar Japonya'nın temel bir parçası olacak. Ancak dikkatimizi yakında diğer bölgelere yönlendirebilmek istiyorsak acele etmeliyiz."
 JAP_hirohito_has_been_killed_flag:0 "§YHirohito§! öldü"
 JAP_hokushin_ron:0 "Hokushin-ron"
 JAP_hokushin_ron_desc:0 "Ordumuz içinde kendilerine Kuzeye Saldırı Grubu adını veren hizip, imparatorluk hırslarımızı sürdürmek için ihtiyaç duyduğumuz doğal kaynakları ve ekonomik değeri kazanmanın bir yolu olarak Sibirya ve Moğolistan'a genişlemeyi savunuyor. Bu düşünceyi desteklemeli ve zamanı geldiğinde böyle bir doktrini üstlenmek için güçlerimizi hazırlamaya başlamalıyız."
 JAP_hokushin_ron_started_flag:0 "§Y$JAP_hokushin_ron$§! milli hedefini tamamladı"
 JAP_hold_a_peoples_tribunal:0 "Bir Halk Mahkemesi Kur"
 JAP_hold_a_peoples_tribunal_desc:0 "Geçmiş hükümetler adına ağır suçlar işleyen ve devrime ve inananlarına karşı mücadele eden ve onları baltalayan birçok kişi var. Bu kişileri halka açık bir şekilde yargılamalı ve her türlü devrim karşıtı muhalefeti derhal kökünden kazımalıyız!"
 JAP_hold_a_peoples_tribunal_tt:0 "Birkaç §YAskeri Danışman§! eski hükümetle işbirliği yapmaktan yargılanır ve aktif hizmetten emekli edilir:"
 JAP_hydroelectric_dams_in_korea:0 "Hidroelektrik Barajlar"
 JAP_hydroelectric_dams_in_korea_desc:0 "Müdahale edip durumla ilgili bir şeyler yapmazsak Kore'nin sanayileşmesi ve elektrifikasyonu ani bir şekilde duracak. Bölge genelinde yeni ağırlık barajları inşa etmeliyiz ve Han Nehri Hidroelektrik Şirketi'ndeki mühendislerimiz Hwacheon Barajı adını verdikleri bir barajın inşası için karmaşık planlar hazırladılar."
 JAP_ichioku_isshin:0 "Ichioku Isshin"
 JAP_ichioku_isshin_desc:0 "Taisei Yokusankai'nin sloganlarından birinde dendiği gibi, [ROOT.GetAdjective] halkı gerçekten 'Yüz Milyon, Tek Yürek'tir. İnsanlarımız İmparator'un bireysel tebaaları olsa da, hepsi tek bir varlık olarak, kalpleri ve zihinleri bir olarak birlikte dururlar."
 JAP_ichiro_hatoyama_focus:0 "Ichiro Hatoyama'nın Başbakanlığı"
 JAP_ichiro_hatoyama_focus_desc:0 "İktidardaki Rikken Seiyūkai'nin şu anki lideri Ichiro Hatoyama, yeni anayasamızın kurulmasını zorlayacak yeni bir kabine kurmaya teşvik edilmelidir. Bununla birlikte, artık geçici bir başbakanımız olmayacak ve çatışma başlamadan önceki düzen nihayet yeniden sağlanacak."
 JAP_ignite_the_korean_peninsula:0 "Kore Yarımadasını Ateşle"
 JAP_ignite_the_korean_peninsula_desc:0 "[KOR.GetAdjective] halkı henüz özgürleştirilmedi. [KOR.GetAdjective] güneyindeki devrimcilerle temas kurmalı ve devrimlerini başlatmalarını sağlamalıyız. Bu, bizim devreye girmemiz ve [KOR.GetAdjective] halkını yaklaşan iç savaştan korumamız için bir fırsat sağlamalıdır."
 JAP_ignite_the_korean_peninsula_tt:0 "[KOR.GetNameDef] içinde, komünist tarafın kuklamız olduğu bir iç savaş başlatır"
 JAP_ignore:0 "Bastır"
 JAP_ikki_kitas_state_socialist_ideals:0 "Ikki Kita'nın Devlet Sosyalisti İdealleri"
 JAP_ikki_kitas_state_socialist_ideals_desc:0 "Yazar ve siyaset felsefecisi Ikki Kita son derece etkilidir ve hareketimizle yakından ilgilidir. Kendini sosyalist olarak tanımlayan Kita, kapitalist modelleri birçok kez eleştirmiştir. Onun fikirlerini benimsemeli ve ekonomiyi bu ideale daha yakın olacak şekilde yeniden düzenlemeliyiz."
 JAP_imperial_headquarters_liasion_conference:0 "İmparatorluk İrtibat Konferansı"
 JAP_imperial_headquarters_liasion_conference_desc:0 "Rus-Japon Savaşı'ndan bu yana ilk kez İmparatorluk Genel Karargahı'nın yeniden kurulmasıyla, ordu ve hükümet arasında işbirliğini ve bilgi alışverişini teşvik etmek için çeşitli hiziplerin liderleri arasında bir konferans düzenlememizin tam zamanı."
 JAP_imperial_influence_faction_names_text:0 "§Y[GetImperialInfluenceFactionsName]§!"
 JAP_imperial_influence_factions_names_text_communist:0 "Dahili İttifak"
 JAP_imperial_influence_factions_names_text_monarchist:0 "İmparatorluk İttifakı"
 JAP_imperial_influence_interference_reset_days_tt:0 "$JAP_imperial_influence_ruler_name_text$ kişisinin tekrar $JAP_imperial_influence_faction_names_text$ ile müdahale edebilmesine kalan gün: [?JAP_interfered_in_imperial_influence_flag:days_left|Y0]"
 JAP_imperial_influence_ruler_gender_he_she:0 "[GetImperialInfluenceGenderHeShe]"
 JAP_imperial_influence_ruler_gender_him_her:0 "[GetImperialInfluenceGenderHimHer]"
 JAP_imperial_influence_ruler_gender_his_hers:0 "[GetImperialInfluenceGenderHisHers]"
 JAP_imperial_influence_ruler_name_text:0 "§Y[GetImperialInfluenceRulerName]§!"
 JAP_imperial_influence_ruler_title:0 "[GetImperialInfluenceRulerTitle]"
 JAP_imperial_influence_title_text:0 "[GetImperialInfluenceTypeName]"
 JAP_imperial_influence_title_text_communist:0 "MİLLİ NÜFUZ"
 JAP_imperial_influence_title_text_monarchist:0 "İMPARATORLUK NÜFUZU"
 JAP_imperial_rule_assistance_association:0 "İmparatorluk Yönetimine Yardım Derneği"
 JAP_imperial_rule_assistance_association_desc:0 "Hem içerideki hem de dışarıdaki tehditler ve sivil hükümet içindeki bölünme nedeniyle, siyaset ve ekonomiden hizipçiliği ve bölgeciliği ortadan kaldırmak, topyekün savaş doktrinimizin verimliliğini en üst düzeye çıkarmak amacıyla totaliter tek partili bir devlet yaratarak devletçi, para-faşist bir siyasi sistem başlatmak için Taisei Yokusankai'yi kurmalıyız."
 JAP_implement_army_reforms:0 "Ordu Reformlarını Uygula"
 JAP_implement_army_reforms_desc:0 "Eski askeri kurmayların görevden alınmasıyla birlikte, onların modası geçmiş savaş fikirlerini de ortadan kaldırmanın tam zamanı. Ordu yavaş yavaş bir öz savunma gücüne dönüştürülecek ve 'ilk vuruş ilkesi' yakında geçmişin bir başka fikri olacak."
 JAP_implement_army_reforms_tt:0 "§Yİmparatorluk Savunma Planı§! milli hedefinin sunduğu §Yİlk Vuruş İlkesi§! ve §YKantai Kessen§! etkenlerini kazanma yeteneğini §RKaldırır§!"
 JAP_improve_agricultural_output:0 "Tarımsal Çıktıyı İyileştir"
 JAP_improve_agricultural_output_desc:0 "Tayvan'daki endüstriyel üretim, adadaki tarımsal üretimi aşacak şekilde ayarlandı. Bu endüstrilerimize fayda sağlasa da, Tayvan'dan yapılan tarımsal ihracat halkımızı mutlu etmek ve ordumuza ikmal sağlamak için büyük önem taşıdığından ideal olmaktan uzaktır. Bunu hemen düzeltmeliyiz!"
 JAP_improve_the_type_91_aerial_torpedo:0 "Tip 91 Hava Torpidosunu Geliştir"
 JAP_improve_the_type_91_aerial_torpedo_desc:0 "Liman vuruş yeteneklerimizi geliştirmek için sığ sulardaki gemileri vurmada uzmanlaşmış torpidolar geliştirmeye çalışmalıyız. Bu hava torpidoları en gelişmiş torpidomuz olan Long Lance'den ilham alacak ve bize zaferin meyvelerini hayal ettiğimizden daha hızlı getirecek."
 JAP_improved_radio_communications:0 "Radyo İletişimlerini Geliştir"
 JAP_improved_radio_communications_desc:0 "Radyolarımız şu anda berbat bir durumda ve sonuç olarak formasyonlarımız kötü iletişim ve derin ormanlarda ve uzak adalarda sinyal eksikliği nedeniyle sık sık dağılıyor. Teçhizatımızı modernleştirmeli ve bunun olmaya devam etmemesi için yeni radyo kuleleri inşa etmeliyiz."
 JAP_incorporate_buddhist_socialism:0 "Budist Sosyalizmini Dahil Et"
 JAP_incorporate_buddhist_socialism_desc:0 "Inoue Shūten ve Girō Seno'o, Budizm ilkelerine dayalı sosyalizmi uygulama teorileri önerdiler ve her ikisi de insan yabancılaşmasına ve bencilliğine son vermek için kişisel bilincin dönüşümünü sağlamayı amaçladığı için bunları benzer kavramlar olarak görüyorlar. Bu düşünürleri hareketimize davet etmeliyiz."
 JAP_increase_agricultural_export:0 "Tarımsal İhracatı Artır"
 JAP_increase_agricultural_export_desc:0 "Bölgeyi edindiğimizden beri Kore imparatorluğumuz için bir ekmek sepeti işlevi gördü. Bu alanı genişletmek için çabalarımızı artırmalıyız, böylece yiyecekleri tüm diyara ihraç edilebilir."
 JAP_increase_armament_spending:0 "Silahlanma Harcamalarını Artır"
 JAP_increase_armament_spending_desc:0 "Vikont Takahashi Korekiyo ekonomimiz için çok şey yapmış olabilir, ancak bizi gelecek savaşlara hazırlıksız bıraktı. Bu gerçeği düzeltmeli ve büyüyen askeri endüstrilerimize yeniden yatırım yapmalıyız."
 JAP_increase_crop_yields:0 "Mahsul Verimini Artır"
 JAP_increase_crop_yields_desc:0 "Güney Denizi adaları, kazançlı bir potansiyel nakit mahsulü olan büyük miktarda hindistancevizine sahiptir. Özel girişimi hükümet sermayesiyle eşleştiren tekelleri teşvik etmeliyiz. Ayrıca Nan'yō Kōhatsu ile sözleşme yaparak şeker plantasyonları, şeker fabrikaları, muz, ananas, taro, manyok, kahve ve diğer tropikal tarım ürünleri yetiştirilebilir ve adalar üretim açısından Tayvan ile aynı seviyeye getirilebilir."
 JAP_indoctrination_in_the_military_academy:0 "Askeri Akademide Endoktrinasyon"
 JAP_indoctrination_in_the_military_academy_desc:0 "Ordudaki radikal unsurların bir zamanlar bizim yaptığımız gibi hükümete karşı dönmemesi önemlidir. Yüksek disiplinin sağlandığından ve her adamın herhangi bir grup veya hizip yerine İmparator'a sadakat yemini ettiğinden emin olmalıyız!"
 JAP_instill_the_spirit_of_bushido:0 "Bushido Ruhunu Aşıla"
 JAP_instill_the_spirit_of_bushido_desc:0 "Devlet Şintosu ve Bushido olarak bilinen geleneksel ahlak fikirleri aracılığıyla, halka devletin ve İmparatorluk ailesinin iyiliği için kendini feda etme gereğini aşılayabileceğiz."
 JAP_instill_the_spirit_of_bushido_tt:0 "Taktik Etkinleştirir: §Y$tactic_grand_banzai_charge$§!"
 JAP_integrate_the_government_general:0 "Genel Valiliği Entegre Et"
 JAP_integrate_the_government_general_desc:0 "Kore Genel Valiliği'nin özerkliği büyük bir hata oldu. Direniş hareketlerinin çok uzun süre var olmasına izin verdiler ve bölgedeki endüstrilerimizi mahvettiler. Doğrudan müdahale etmeli ve Kore topraklarını doğrudan merkezi hükümetin altına almalıyız."
 JAP_integrate_the_government_general_tt:0 "Yeterince yüksek bir uyuma sahip olduklarında §YKore Eyaletlerini Entegre Et§! kararlarının kilidini açar"
 JAP_integrate_the_great_empire_of_manchuria:0 "Büyük Mançurya İmparatorluğunu Entegre Et"
 JAP_integrate_the_great_empire_of_manchuria_desc:0 "Concordia Derneği sıkı bir şekilde bizim tarafımızdayken, Puyi ve ona sadık olanlar özerkliklerini sona erdirmemizi engelleyecek güce sahip değiller. İki ulusumuzu tek gerçek İmparator altında birleştirme zamanı nihayet geldi!"
 JAP_integrate_the_great_empire_of_manchuria_tt:0 "Yeterince yüksek bir uyuma sahip olduklarında §YMançurya Eyaletlerini Entegre Et§! kararlarının kilidini açar"
 JAP_integrate_the_great_japan_youth_party:0 "Büyük Japonya Gençlik Partisi'ni Entegre Et"
 JAP_integrate_the_great_japan_youth_party_desc:0 "Alman gençlik hareketlerini model alan milliyetçi bir gençlik örgütü olan Büyük Japonya Gençlik Partisi henüz tam olarak kontrolümüz altında değil ve Albay Kingoro Hashimoto yönetiminde bağımsız bir üçüncü taraf olarak hareket ediyor. Onları dizginlemeli ve Taisei Yokusankai'nin kontrolü altına almalıyız."
 JAP_integrate_the_kenkokutai:0 "Kenkokukai'yi Entegre Et"
 JAP_integrate_the_kenkokutai_desc:0 "Milli Kuruluş Derneği, Motoyuki Takabatake'nin Nasyonal Sosyalizminden güçlü bir şekilde etkilenen ve halk ile imparator arasındaki oybirliğine dayalı gerçek bir halk devletinin yaratılmasını amaçlayan anti-komünist bir örgüttür. Benzer hedefleri paylaştığımız için onları hükümetimize dahil etmeliyiz."
 JAP_intensify_anti_guerilla_operations:0 "Gerilla Karşıtı Operasyonları Yoğunlaştır"
 JAP_intensify_anti_guerilla_operations_desc:0 "Gerillalar ve sızanlar, Çin'deki askeri harekatlarımızın ilerlemesini ve başarısını engelliyor, bizi en çok acıyan yerimizden vuruyor. Bu haydutlara karşı koordineli bir darbe yapmaya ve hücrelerini topraklarımızdan öyle ya da böyle temizlemeye hazırlanmalıyız!"
 JAP_intensify_anti_guerilla_operations_tt:0 "§Y$PRC_root_out_guerilla_fighters$§! kararlarını alma maliyetini yarıya indirir ve Gerillaların kökünün kazındığı eyaletlerde geçici olarak azaltılmış direniş sağlar"
 JAP_interfered_in_imperial_influence_flag:0 " $JAP_imperial_influence_ruler_name_text$, Yakın Zamanda $JAP_imperial_influence_faction_names_text$ Konularına Müdahale Etti"
 JAP_invest_in_foreign_industries:0 "Yabancı Endüstrilere Yatırım Yap"
 JAP_invest_in_foreign_industries_desc:0 "Kazandığımız muazzam miktardaki sermayeyi yabancı uluslara yatırım yapmak için kullanmalı, doğal kaynaklarının bir kısmını elde etme karşılığında onlara ekonomik yardım sağlamalı, bu süreçte kendi sorunlarımızı çözerken diğer Asya uluslarına yardım etmeliyiz."
 JAP_invest_in_foreign_industries_tt:0 "Kaynak karşılığında küçük §YAsya§! uluslarının endüstrilerine yatırım yapmak için §YKararların§! kilidini açar"
 JAP_invest_in_senbu:0 "Senbu'ya Yatırım Yap"
 JAP_invest_in_senbu_desc:0 "Genellikle okullar, tıbbi ekipler ve gıda dağıtım merkezleri şeklini alan Senbu örgütlerimiz, işgal altındaki bölgelerdeki yerel nüfusu yatıştırmayı amaçlayan bir tür psikolojik harp operasyonu oluşturur. Şimdiye kadar Mançurya'yı yatıştırmada etkili oldular ve belki de operasyonlarını Çin'in geri kalanını kapsayacak şekilde genişletmeliyiz."
 JAP_isolate_oceania:0 "Okyanusya'yı İzole Et"
 JAP_isolate_oceania_desc:0 "Yüksek komuta kadememiz [AST.GetNameDef] ve [NZL.GetNameDef] devletlerine çıkmayı ve işgal etmeyi uygulanamaz buldu ve bu düşman uluslar sorununa daha iyi bir çözüm önerdi. Bu devletlerin etrafındaki daha az savunulan adaları işgal etmeli ve müttefikleriyle bağlarını kesmeliyiz, böylece savaşma isteklerini yavaşça aç bırakarak tüketebiliriz."
 JAP_issue_the_senjinkun_military_code:0 "Senjinkun Askeri Kodunu Yayınla"
 JAP_issue_the_senjinkun_military_code_desc:0 "Cep boyu askeri kod 'Savaş Alanı Talimatları', önümüzdeki yıllarda yaşanacak çatışmalara hazırlamak amacıyla her [ROOT.GetAdjective] askerine verilmelidir. Onlara askeri düzenlemeler, savaşa hazırlık, birlik ruhu, evlatlık dindarlığı ve Şinto kamilerine ve kokutai'ye saygı öğretilecektir. 'Asla bir esir olarak utanç yaşamayın, teslim olmaktansa onur!'"
 JAP_issue_the_shinmin_no_michi_manifesto:0 "'Shinmin no Michi' Manifestosunu Yayınla"
 JAP_issue_the_shinmin_no_michi_manifesto_desc:0 "Halkımıza tebaa olmanın yolu öğretilmelidir. Bu, halka yönelik, onlardan 'bir halk ve bir ulus olarak' ne beklendiğini açık bir dille anlatan ideolojik bir manifesto aracılığıyla yapılacaktır. Böyle bir manifestoyu yayınlamak Eğitim Bakanlığı'nın sorumluluğunda olacaktır."
 JAP_issue_the_ten_commandments_for_marriage:0 "Evlilik İçin On Emir Yayınla"
 JAP_issue_the_ten_commandments_for_marriage_desc:0 "Yetkililerimiz, rakiplerimizin çoğuna kıyasla nispeten düşük nüfus sayımız nedeniyle [ROOT.GetAdjective] nüfusunu artırmaya yönelik yeni kampanyalarının bir parçası olarak 'Verimli olun ve çoğalın' sloganını ortaya attılar. Bu girişimi desteklemeliyiz."
 JAP_japanese_supremacy_faction:0 "Japon Alanı"
 JAP_japans_longest_day:0 "Japonya'nın En Uzun Günü"
 JAP_japans_longest_day_desc:0 "Onursuz başbakan ve yandaşları halledildi ve yanlış yönlendirilen İmparator ev hapsine alındı. Şimdi savaş çabalarını yeniden canlandırma ve ulusumuzu kaderindeki zafere geri döndürme zamanı."
 JAP_joshi_teishin_tai:0 "[ROOT.GetAdjective] Kadınları Seferber Et"
 JAP_joshi_teishin_tai_desc:0 "Kadın Gönüllü Kolordusu, kadınlara evlilikten önce İmparatorluğa hizmet etme şansı vermek ve onları savaş zamanı iş gücü görevlerini yerine getirmeye zorlamak için kurulacak. Bu sayede, savaş zamanı endüstrilerimize yardımcı olmak için daha fazla vatandaş seferber edilebilecek."
 JAP_joshi_teishin_tai_levy_tt:0 "§YGönüllü Savaş Birlikleri§! sınırını §Y3§!, azami sınırını ise §Y6§! artırır"
 JAP_jungle_adaptation:0 "Orman Adaptasyonları"
 JAP_jungle_adaptation_desc:0 "Ordumuz, ciddi bir şey yapılmazsa Burma ve Büyük Endonezya'nın ormanlarla kaplı bölgelerine nüfuz edemeyeceğini fark etti. Bu nedenle, taarruza öncülük edebilmeleri ve düşman hatlarını yarabilmeleri için özel orman tümenlerinin kurulmasını talep ettiler."
 JAP_kantai_kessen_tt:0 "§Y[ROOT.GetNameDef]§!, §Y$capital_ship$§! sahibi bir ülkeye §Rsavaş ilan ettiğinde§!, §Y180 gün§! boyunca kazanır:\n §Y$JAP_kantai_kessen_dm$§!\n  Ülkeye Karşı Ana Gemi Saldırısı: §G+%10.0§!\n  Ülkeye Karşı Tespit Hızı: §G+%10.0§!"
 JAP_kantokuen:0 "Kantokuen"
 JAP_kantokuen_desc:0 "Dünya gelişmelerinden yararlanmak için Kwantung Ordusu, Rus Uzak Doğusu'nun işgali ve ilhakına hazırlık olarak Özel Manevralar hazırlıyor. Saldırının hızlı bir şekilde gerçekleşmesi için, harekete geçmeden önce bu son hazırlıklara yatırım yapmalıyız."
 JAP_kikues_new_model:0 "Kikue'nin Yeni Modeli"
 JAP_kikues_new_model_desc:0 "Yamakawa Kikue, Japon kadınlarını toplumumuzun eşit bir parçası olmaları için yükseltme fikrini uzun zamandır destekliyor ve ataerkil hane sistemini kaldırırken eşit ücret ve istihdam haklarını garanti altına almak istiyor. Bu idealleri gerçeğe dönüştürme zamanı geldi!"
 JAP_kodoha_the_emperor_cooperated_flag:0 "§Yİmparator Shōwa§! Kōdōha ile işbirliği yapmayı seçti"
 JAP_konoes_first_cabinet:0 "Konoe'nin İlk Kabinesi"
 JAP_konoes_first_cabinet_desc:0 "Senjūrō Hayashi yalnızca kısa vadeli bir ara dönem başbakanı olarak düşünülmüştür. Prens Fumimaro Konoe, apolitik ve Genrō Saionji Kinmochi tarafından eğitilmiş, kaotik siyasi durumu istikrara kavuşturmak ve ulusu ruhsal olarak birleştirmek için mükemmel bir adaydır. Saionji'nin bizzat İmparator Hirohito'ya aday gösterdiği Konoe'nin kendi kabinesini kurma zamanı geldi."
 JAP_launch_the_income_doubling_plan:0 "Geliri İkiye Katlama Planını Başlat"
 JAP_launch_the_income_doubling_plan_desc:0 "Japonya Ekonomik İstikrar Kurulu'na yakın zamanda katılan bir ekonomist olan Osamu Shimomura, Geliri İkiye Katlama Planı olarak adlandırdığı bir plan önerdi; bu planın ekonomik planlamada merkezi bir rol oynayacağını ve yüksek hızlı ekonomik büyümemizin temelini atmaya yardımcı olacağını iddia ediyor. Teklifini kabul etmeli ve bizi nereye götüreceğini görmeliyiz."
 JAP_launch_the_suiyuan_campaign:0 "Suiyuan Harekatını Başlat"
 JAP_launch_the_suiyuan_campaign_desc:0 "İç Moğolistan Ordusu ve Büyük Han Doğruluk Ordusu, hava desteğimizi ve Japon kurmay subayların gözetimini almaları koşuluyla savaş ağası [SHX.GetLeader] topraklarına bir operasyon başlatmaya hazır. Belki Çin'de daha büyük ölçekli bir savaşı kışkırtmadan İç Moğolistan'ın daha fazlasını güvence altına alabiliriz."
 JAP_launch_the_suiyuan_campaign_tt:0 "Desteğimizle, §Yİç Moğolistan Ordusu§! ve §YBüyük Han Doğruluk Ordusu§!, §Y[621.GetName]§! bölgesini Kuomintang güçlerinden almak için bir taarruz başlatacak, ancak operasyonun iptal edilmesi gerekmeden önce sadece dar bir pencereye sahip olacaklar"
 JAP_learn_from_the_nkvd:0 "NKVD'den Ders Al"
 JAP_learn_from_the_nkvd_desc:0 "Sovyet gizli polisi, muhalefeti ve karşı devrimi bastırma sanatını mükemmelleştirdi. Onlarla birlikte çalışmak istemesek de, belki işleri nasıl yaptıklarından bir iki şey öğrenebiliriz."
 JAP_lifetime_employment:0 "Ömür Boyu İstihdam"
 JAP_lifetime_employment_desc:0 "Shūshin koyō, 1920'lerdeki ilk ekonomik başarılarla başlayarak büyük şirketlerimiz tarafından bir süredir kullanılıyor. Japon şirket kültürünün bu belirleyici özelliğinin ekonomik bir mucizeye ulaşmamıza yardımcı olmasını sağlamalıyız, böylece bir gün batının ekonomilerini bile geçebiliriz."
 JAP_limit_military_power:0 "Askeri Gücü Sınırlamak İçin Bastır"
 JAP_limit_military_power_desc:0 "Başka bir darbeyi önlemek için, bir isyan çıkarmadan mümkün olduğunca çok askeri personeli güçlü pozisyonlardan indirmeye çalışmalıyız. Bunu yaparak, özgürlük meşalesini söndürmelerini engelleyebiliriz."
 JAP_limit_military_power_tt:0 "§Yİç Savaş§! gerçekleştiğinde, karşı taraf §Y365§! gün boyunca aşağıdaki milli ruha sahip olacak:"
 JAP_limit_the_emperors_power:0 "İmparatorun Gücünü Sınırla"
 JAP_limit_the_emperors_power_desc:0 "İmparator toplumumuzun önemli bir parçası olmaya devam ediyor, ancak isterse demokrasimiz için hala bir tehdit olabilir. Anayasal hükümdarımızın gücünü sınırlamaya çalışmalıyız, böylece demokratik değerlerimizi bir daha asla kaybetmeyiz."
 JAP_machida_chuuji_focus:0 "Machida Chuji'nin Başbakanlığı"
 JAP_machida_chuuji_focus_desc:0 "İktidardaki Rikken Minseitō'nun şu anki lideri Machida Chūji, yeni anayasamızın kurulmasını zorlayacak yeni bir kabine kurmaya teşvik edilmelidir. Bununla birlikte, artık geçici bir başbakanımız olmayacak ve çatışma başlamadan önceki düzen nihayet yeniden sağlanacak."
 JAP_male_leader_2_text:0 "onun"
 JAP_male_leader_3_text:0 "onu"
 JAP_male_leader_text:0 "o"
 JAP_manchuria_five_year_plan:0 "Mançurya Beş Yıllık Sanayi Planı"
 JAP_manchuria_five_year_plan_desc:0 "Adalarımız kullanılabilir arazi bakımından kıt olsa da, anakaradaki mülklerimiz öyle değil. Kendimiz inşa edemediğimiz şeyleri, bunun yerine anakarada inşa edebiliriz. [MAN.GetNameDef] için büyük ölçekli bir sanayileşme programı başlatacağız."
 JAP_mengjiang_united_autonomous_government:0 "Mengjiang Özerk Hükümeti"
 JAP_mengjiang_united_autonomous_government_desc:0 "Prens De'nin tüm İç Moğolistan üzerindeki iddiasını meşrulaştırmak için, devletin hükümetini Mengjiang Birleşik Özerk Hükümeti olarak daha da yeniden düzenlemeliyiz, böylece Çin sınırları içindeki Moğol halkını tek bir sancak altında kesin olarak birleştirebilsinler."
 JAP_ministry_of_colonial_affairs:0 "Sömürge İşleri Bakanlığı"
 JAP_ministry_of_colonial_affairs_desc:0 "Başlangıçta Hokkaidō Kolonizasyon Ofisi olarak yola çıkan bakanlık zaten uzun bir yol kat etti. Nan'yō, Chōsen, Karafuto, Kantō ve Tayvan'ı düzgün bir şekilde yönetebilmesi için sorumluluklarını genişletmeliyiz. Bir gün bu topraklar herkes tarafından Japon olarak anılsın!"
 JAP_ministry_of_commerce_and_industry:0 "Ticaret ve Sanayi Bakanlığı"
 JAP_ministry_of_commerce_and_industry_desc:0 "Mali durumumuza daha iyi bir genel bakış elde etmek için Ticaret ve Sanayi Bakanlığı'nı genişletmeli ve görevlerini düzgün bir şekilde yerine getirmek için ihtiyaç duydukları tüm kaynaklara sahip olduklarından emin olmalıyız."
 JAP_ministry_of_greater_east_asia:0 "Büyük Doğu Asya Bakanlığı"
 JAP_ministry_of_greater_east_asia_desc:0 "Daitōashō'yu kurarak, Pasifik'te elde edilen denizaşırı toprakları daha verimli bir şekilde yönetebilecek ve Büyük Doğu Asya Ortak Refah Alanı'nın kurulmasını ve geliştirilmesini koordine edebileceğiz."
 JAP_minpon_shugi:0 "Minpon Shugi"
 JAP_minpon_shugi_desc:0 "Taishō döneminde doğan Minpon Shugi siyasi doktrini, 'halkın kazancına, mutluluğuna ve görüşlerine değer veren siyasi gücü kullanma politikası' olarak tanımlanabilir. Bu, imparatorluk kurumunu ihlal etmez ve hem halka hem de imparatora fayda sağlamak için iyi çalışır. Monarşik egemenliğe dayalı demokrasimizi sürdürmeli ve onu yeni anayasamıza yerleştirmeliyiz!"
 JAP_minshu_shugi:0 "Minshu Shugi"
 JAP_minshu_shugi_desc:0 "Şimdiye kadar Minpon Shugi siyasi doktrinini izlemiş olsak da, gerçek demokrasi Minshu Shugi'nin sınırları içinde yatmaktadır. Sonuçta, 'hukukta ulusun egemenliği halkta ikamet eder', bu da Minpon doktrininde durum böyle değildir, çünkü her şeyden önce monarşik egemenliği vurgular. Bu yeni fikirleri anayasaya yerleştirmeliyiz!"
 JAP_mitsumasa_yonai_focus:0 "Mitsumasa Yonai'nin Başbakanlığı"
 JAP_mitsumasa_yonai_focus_desc:0 "Donanma içindeki batı yanlısı antlaşma ittifakının önemli bir parçası olan ılımlı amiral Mitsumasa Yonai, yeni anayasamızın kurulmasını zorlayacak yeni bir kabine kurmaya teşvik edilmelidir. Bununla birlikte, artık geçici bir başbakanımız olmayacak ve çatışma başlamadan önceki düzen nihayet yeniden sağlanacak."
 JAP_mobilize_the_proletariat:0 "Proletaryayı Seferber Et"
 JAP_mobilize_the_proletariat_desc:0 "İşçiler ordumuz için silah sağlama konusunda gayretle iyi bir iş çıkarıyorlar, ancak çaresiz zamanlar çaresiz önlemler gerektirir. Üretim kotalarını geçici olarak da olsa artırmanın tam zamanı, böylece ordunun ihtiyaç duyduğu tüm silahlar onlara sağlanabilir."
 JAP_modern_bombers:0 "Modern Bombardıman Uçakları"
 JAP_modern_bombers_desc:0 "Modernize edilmiş bir taktik bombardıman kuvveti, savaş alanında ordumuzu desteklemenin anahtarıdır. Bu nedenle hem orduya hem de donanmaya kara kuvvetlerimiz için taktik destek sağlayabilecek uçakların geliştirilmesine başlamalarını emretmeliyiz."
 JAP_modernize_agriculture:0 "Tarımı Modernleştir"
 JAP_modernize_agriculture_desc:0 "Tarım sektörümüz endüstriyel sektör kadar önemlidir. Sonuçta, ülkemizdeki tüm boğazları besleyemezsek endüstrilerimiz çalışmayacaktır. Bu nedenle yeni araçların geliştirilmesine yatırım yapmalı ve kırsal köylerimizi kentsel şehirlerimize bağlayan yol ağlarını iyileştirmeliyiz."
 JAP_mongol_autonomous_state:0 "Moğolistan Özerk Devleti"
 JAP_mongol_autonomous_state_desc:0 "[MON.GetNameDefCap], Prens De'nin şiddetle karşı çıktığı bir kavram olan gerçek Moğolistan hükümeti olduğunu iddia ediyor. Bölgesini daha da yeniden düzenlemeli ve yeniden adlandırmalıyız, böylece tüm Moğol topraklarında daha meşru bir hak iddia edebilir."
 JAP_mountain_village_operation_units:0 "Dağ Köyü Operasyon Birimleri"
 JAP_mountain_village_operation_units_desc:0 "Sanzō Nosaka, hükümete karşı gerilla operasyonları yürütmek ve ülke çapında bir komünist devrime hazırlanmak amacıyla kırsal ve uzak köylerde yeraltı paramiliter birimlerinin ve gizli hücrelerin kurulmasına izin verdi. Bunu kolaylaştırmak için, 'Çiçek Soğanları Nasıl Yetiştirilir' kitapçığı ülke genelinde dağıtılmaya başlandı."
 JAP_mountain_village_operation_units_tt:0 "Zamanı geldiğinde ayaklanacak eyaletlerde §YGerilla Birimleri Kurma§! kararlarının kilidini açar"
 JAP_nanshin_ron:0 "Nanshin-ron"
 JAP_nanshin_ron_desc:0 "Zengin olsa da, Çin ve Sibirya ihtiyacımız olan tüm kaynaklara sahip değil. Ancak çok uzak olmayan güneyde Filipinler, Hollanda Doğu Hint Adaları ve Malaya ile Borneo'nun İngiliz sömürgeleri yatıyor. Gerçek kendi kendine yeterlilik için bu alanlar üzerindeki kontrolü Avrupalı emperyalistlerden zorla almalıyız."
 JAP_nanshin_ron_started_flag:0 "§Y$JAP_nanshin_ron$§! milli hedefini tamamladı"
 JAP_national_defense_brotherhood:0 "Milli Savunma Kardeşliği"
 JAP_national_defense_brotherhood_desc:0 "Savaş çabalarımızı finanse etmek için, Nobusuke Kishi ve Hideki Tōjō, ulusun mali stratejilerini ve endüstriyel girişimlerini daha iyi koordine etmek amacıyla Gokoku Doshikai adlı bir siyasi örgüt için bir plan tasarladılar. Ancak bu eşleşme oldukça tartışmalı ve Milli Savunma Kardeşliği için kartlarda birçok sorun yatıyor olabilir."
 JAP_nationalize_fujinagata_shipyards:0 "Fujinagata Tersanelerini Millileştir"
 JAP_nationalize_fujinagata_shipyards_desc:0 "Fujinagata Tersaneleri, Osaka'da önemli bir tersane ve vagon üreticisidir ve savaş çabalarımız için stratejik öneme sahiptir. Tesisleri genişletmek ve onlar için daha fazla iş gücü toplamak adına bu tersaneleri millileştirmeye çalışmalıyız."
 JAP_nationalize_suzuka_naval_arsenal:0 "Suzuka Donanma Cephaneliğini Millileştir"
 JAP_nationalize_suzuka_naval_arsenal_desc:0 "Suzuka Donanma Cephaneliği, havacılık mühimmatı, hafif silahlar ve donanma için mühimmat üreten bir tesistir. Bu tesisi millileştirmeliyiz, böylece genişlemesini kontrol edebilir ve sahada yeni donanma onarım tersaneleri kurabiliriz."
 JAP_nationalize_western_corporations:0 "Batılı Şirketleri Millileştir"
 JAP_nationalize_western_corporations_desc:0 "Açgözlü batılı kapitalistler, halkımızı ve kaynaklarımızı sömürmek için ülkemize geldiler ve milli ruhta iyileşmesi uzun zaman alacak yaralar bıraktılar. Batıyı kızdırmak anlamına gelse bile, şirketleri derhal alaşağı etmeli ve fabrikalarını millileştirmeliyiz."
 JAP_naval_armaments_program:0 "Donanma Silahlanma Programı"
 JAP_naval_armaments_program_desc:0 "Tersanelerimizin ve endüstrilerimizin sürekli büyüyen hırslarımıza ayak uydurabilmesi için donanmamız Hızlı Donanma Silahlanma Takviye Programı'nın bir parçası olarak yeni genişleme planları hazırladı. Bu, yeni savaş gemilerini içeriyor ve donanmayı en az 293 deniz aracına çıkarmayı hedefliyor."
 JAP_naval_armaments_program_tt:0 "§Y$JAP_focus_on_aircraft_carriers$§! tamamlandığında: Uçak Gemisi §Yvaryantı§! ve §YShokaku Sınıfı§! için §Y4 üretim hattı§! oluştur\n§Y$JAP_balanced_naval_approach$§! tamamlandığında: Hem §YShokaku Sınıfı§! hem de §YYamato Sınıfı§! için Uçak Gemisi ve Süper Zırhlı §Yvaryantları§! ve §Y2 üretim hattı§! oluştur\n§Y$JAP_sea_battleship_initiative$§! tamamlandığında: §YYamato Sınıfı§! için Süper Zırhlı §Yvaryantı§! ve §Y4 üretim hattı§! oluştur\n"
 JAP_new_industrial_city_development_policy:0 "Yeni Sanayi Kenti Kalkınma Politikası"
 JAP_new_industrial_city_development_policy_desc:0 "Milli arazi planlama komitesi, ordu ve donanma için askeri ikmal tesisleri, mühimmat fabrikaları ve ilgili tesisler etrafında merkezlenmiş yeni şehirler kurmak ve bu endüstrileri desteklemek için büyük ölçekli şehir planlaması için bir plan geliştirdi. Bu girişime yatırım yapmalıyız."
 JAP_new_order_in_east_asia:0 "Doğu Asya'da Yeni Düzen"
 JAP_new_order_in_east_asia_desc:0 "[ROOT.GetLeader] tarafından yapılan son açıklamalarda, Doğu Asya'da altı ana hedefi olan yeni bir düzen kurma niyetinde olduğu her zamankinden daha açık hale geldi. Bunlar arasında Doğu Asya'nın kalıcı istikrarı, komşuluk dostluğu ve uluslararası adalet, komünizme karşı ortak savunma, yeni bir kültürün yaratılması, ekonomik uyum ve işbirliği ve son olarak dünya barışı yer alıyor."
 JAP_new_order_in_east_asia_faction:0 "Doğu Asya'da Yeni Düzen"
 JAP_new_order_in_east_asia_tt:0 "$JAP_sea_greater_east_asian_co_properity_sphere$ milli hedefini almak bu ittifakı dönüştürecek"
 JAP_new_order_movement:0 "Yeni Düzen Hareketi"
 JAP_new_order_movement_desc:0 "Ulusu Sömürgeci Güçlerle savaşa seferber etmek ve Meiji Restorasyonu ile başlayan modern kapitalist yolu reddederek komünizmi önlemek için iç işlerinde batıdaki tek partili devletleri model alan milli bir örgüt kurmalıyız. Bu sorun şimdi her zamankinden daha acil, çünkü yakında harekete geçmezsek treni kaçırabiliriz."
 JAP_ni_go_nuclear_project:0 "Ni-Go Nükleer Projesi"
 JAP_ni_go_nuclear_project_desc:0 "Ordu Komitesi, RIKEN'de Ni-Go projesi olarak adlandırdıkları deneysel bir proje kurdu. Amacı, elektromanyetik ayırma, gaz difüzyonu ve santrifüj ayırma gibi alternatif yöntemleri göz ardı ederek uranyum-235'i termal difüzyonla ayırmaktır. Umarız bunu askeri bir amaç için nasıl kullanacağımızı yakında öğrenebiliriz."
 JAP_nobuhito_is_the_current_regent_or_emperor_flag:0 "§YNobuhito§! tahta çıktı"
 JAP_nobuhito_takes_up_the_throne_tt:0 "§YNobuhito§!, İmparatorluk Nüfuzunda §YHirohito§! yerine geçecek"
 JAP_occupy_east_timor:0 "Doğu Timor'u İşgal Et"
 JAP_occupy_east_timor_desc:0 "Timorlular, şu anda savaşımızda saldırgan olmasalar da, Asya'nın geleceği uğruna kanatlarımızın altına alınmalıdır. Birliklerimiz adalarda hazır bekliyor ve fark edilmeyeceğini umarak herhangi bir savaş ilanı olmadan hızla içeri girmeye hazırız."
 JAP_occupy_east_timor_tt:0 "§RBu, [721.GetName] sahibine karşı savaşa yol açabilir!§!"
 JAP_occupy_indochina:0 "Hindiçin'i İşgal Et"
 JAP_occupy_indochina_desc:0 "Hindiçin halkı şu anda refahlarını çok az önemseyen sömürgeci ve emperyalist rejimler tarafından eziliyor. İnsanlarını korumak ve bu süreçte bölgenin doğal kaynaklarının kontrolünü ele geçirmek için devreye girmeli ve bu bölgenin kontrolünü almalıyız."
 JAP_occupy_indochina_tt:0 "Fransa §YHindiçin§! bölgesine sahip değil"
 JAP_occupy_macau:0 "Makao'yu İşgal Et"
 JAP_occupy_macau_desc:0 "Batıdaki sömürgecilere karşı mücadelemizi sürdüreceksek Makao kontrolümüz dışında bırakılması tehlikeli bir şehirdir. Ordularımızın önünü kesmek ve düşmana hem havadan hem de denizden ikmal sağlamak için bir hazırlık noktası görevi görebilir. Bu nedenle, beklenmedik çöküşümüz haline gelmeden önce hemen devreye girmeli ve orayı işgal etmeliyiz."
 JAP_occupy_siam:0 "Siyam'ı İşgal Et"
 JAP_occupy_siam_desc:0 "Siyam, potansiyel bir müttefikimiz olsa da, rakiplerimizin kesinlikle istismar edeceği zayıf bir alt karın görevi görebilir. Bu nedenle devreye girmeli ve onları doğrudan işgal etmeliyiz, böylece düşmanlarımızla işbirliği yapma şansları asla olmaz."
 JAP_offshore_coal:0 "Deniz Kıyısı Kömür Tesislerini Genişlet"
 JAP_offshore_coal_desc:0 "Nagasaki kıyılarındaki Ikeshima ve Hashima adaları, deniz tabanından kazmak için hayati kömür madenleri olarak hizmet veriyor. Bu madenleri genişletmeli ve daha büyük bir kalıcı işgücünü barındırmak için adalarda daha fazla ev inşa etmeliyiz."
 JAP_okadas_military_purge_speech:0 "Okada'nın Askeri Tasfiye Konuşması"
 JAP_okadas_military_purge_speech_desc:0 "Ordu bu sefer çok ileri gitti. Sayısız suikast ve marjinal unsurların hükümetimizi devirme girişimleri yetmezmiş gibi, şimdi de son olayı kendi güçlerini güçlendirmek ve ulusumuzun kontrolünü halkından zorla almak için kullanmaya çalışıyorlar. Okada'nın devleti kimin yönettiğini açıkça belirtmesinin ve ordunun artan gücüne karşı harekete geçmesinin zamanı geldi."
 JAP_okadas_military_purge_speech_tt:0 "§RBu, Hükümet ile Ordu arasındaki çatışmanın tırmanmasına yol açacak ve bu ancak Barışı Koruma Yasası'nın yürürlükten kaldırılmasıyla çözülebilir!§!"
 JAP_operation_take_australia:0 "AN Operasyonu"
 JAP_operation_take_australia_desc:0 "Zaman nihayet geldi. Yüksek komuta, AN Operasyonu kod adlı Avustralya'ya çıkarma operasyonunu onayladı. Düşmanlarımızı yere sereceğiz ve Asya'nın alt karnının kontrolünü ele geçireceğiz!"
 JAP_oppose_the_zaibatsus:0 "Zaibatsulara Karşı Çık"
 JAP_oppose_the_zaibatsus_desc:0 "Ulusumuzun en büyük şirketleri uzun zamandır benzeri görülmemiş bir siyasi ve ekonomik güce sahip olmuştur. Onlara hala İmparatorun isteklerine tabi olduklarını hatırlatmalı ve açgözlü kapitalist politikalarının ulusumuzun ruhunu kirletmeye devam edemeyeceğinden emin olmalıyız."
 JAP_oppose_the_zaibatsus_tt:0 "Ruh zaman aşımına uğradığında:\n"
 JAP_organize_a_general_election:0 "Genel Seçim Düzenle"
 JAP_organize_a_general_election_desc:0 "İç çatışma nihayet sona erdiğine göre, yeniden inşa etmeye ve demokratik geleneklerimize dönmeye hazırlanmamızın zamanı geldi. Meiji'nin kendisinden bu yana ilk kez, ordunun nüfuzundan ve yolsuzluğundan arınmış bir seçim yapmalı ve halkın kendi geleceğine karar vermesine izin vermeliyiz!"
 JAP_organize_the_fifth_column:0 "Beşinci Kolu Organize Et"
 JAP_organize_the_fifth_column_2_tt:0 "§Y5 milis§! taburuna sahip 5 birim kazan.\n"
 JAP_organize_the_fifth_column_desc:0 "Dört kolumuz Osaka ve Tokyo'ya yaklaşırken, beşinci bir destekçi kolu şehirlerin içinden yükselecek ve düşmanların savunmasını içeriden zayıflatacak. Yaklaştığımız tüm şehirlerde bu 'Beşinci Kolları' organize ederek, milli kurtuluş savaşında bize belirleyici bir avantaj sağlayacağız."
 JAP_organize_the_fifth_column_tt:0 "İç savaş sırasında partizanları §YDüşman Birimlerine Hasar Vermeye§! teşvik etme kararlarının kilidini açar"
 JAP_organize_the_student_movements:0 "Öğrenci Hareketlerini Organize Et"
 JAP_organize_the_student_movements_desc:0 "Üniversitelerimizdeki öğrenciler ulusun durumundan memnun değiller ve JKP'nin en önde gelen üyelerinden bazılarıyla uyumlu fikirlere sahipler. Sosyalist düşünceyi kampüslerimize yaymak amacıyla Tüm Kampüs Ortak Mücadele Komiteleri düzenlemeliyiz."
 JAP_organize_the_student_movements_tt:0 "§Yİç Savaş§! gerçekleştiğinde, karşı taraf §Y365§! gün boyunca aşağıdaki milli ruha sahip olacak:"
 JAP_organize_underground_resistance:0 "Yeraltı Direnişini Organize Et"
 JAP_organize_underground_resistance_desc:0 "Partimiz sadece Orduya değil, merkezi hükümete bile karşı duracaksa, onların herhangi bir otoritesinin erişemeyeceği bir operasyon üssüne ihtiyacımız olacak. Oradan yoldaşlarımızı hapishanelerden kurtarmaya başlayabilmeli ve devrim için silah temin etme operasyonlarına başlayabilmeliyiz."
 JAP_organize_underground_resistance_tt:0 "Devrimin başlangıcında teçhizat kazanmak ve karşı tarafa küçük bir olumsuz etki vermek için §YOrdu Silah Depolarına Baskın§! kararlarının kilidini açar"
 JAP_overhaul_the_education_system:0 "Eğitim Sistemini Elden Geçir"
 JAP_overhaul_the_education_system_desc:0 "Eğitim sistemi hala eskilerin fikirleri ve yöntemleri tarafından domine ediliyor ve milliyetçi ve vatansever düşünceleri teşvik ediyor. Bunu hızla düzeltmeli ve gençlerimize nasıl devrimci liderler olacaklarını düzgün bir şekilde öğretmek için eğitim sistemini elden geçirmeliyiz."
 JAP_pan_asian_revolutuonary_front:0 "Pan-Asya Devrimci Cephesi"
 JAP_peace_out_soviets_dec_tt:0 "Eğer kontrol ediyorsak onlardan §YSibirya§! bölgesini almak için §Y[SOV.GetNameDef]§! ile §YAyrı Barış§! imzalama kararının kilidini açar"
 JAP_pearl_harbor_raid_warning:0 "§RBöyle bir saldırı, §! §Y[USA.GetNameDef]§! §Ryüksek komutanlığımıza karşı intikam arayışını harekete geçirebilir§!"
 JAP_pivot_towards_defensive_measures:0 "Savunma Önlemlerine Yönel"
 JAP_pivot_towards_defensive_measures_desc:0 "Savaş mutlaka lehimize gelişmedi. Düşmanlarımızın ana adalara çıkması giderek daha makul hale geliyor, şu anda savaşmak için kötü donanımlı olduğumuz bir şey. Kendi yarattığımız bir asırlık aşağılanmayı yaşamamak için bu sorunu çözmek üzere yola çıkmalıyız!"
 JAP_politicize_the_education_system:0 "Eğitim Sistemini Siyasallaştır"
 JAP_politicize_the_education_system_desc:0 "Ordu uzun zamandır milli eğitim sistemini kontrol ediyor, ancak gençleri davamıza düzgün bir şekilde katılmaları için radikalleştirmek adına yeterince şey yapılmadı. Siyasi endoktrinasyonumuza daha büyük yatırımlar yapmalı ve eğitim sistemine yönelik fonları artırmalıyız."
 JAP_prepare_for_peninsular_warfare:0 "Yarımada Savaşına Hazırlan"
 JAP_prepare_for_peninsular_warfare_desc:0 "Kendimizi savaşta ve geri çekilirken bulmamız durumunda, Kore Yarımadası muhtemelen kıtadaki son sığınağımız olmak zorunda kalacaktır. Böyle bir en kötü senaryo gerçekleşirse bu bölgeyi tutabilmemiz için hazırlıklar yapmalıyız."
 JAP_prepare_for_the_final_war:0 "Son Savaşa Hazırlan"
 JAP_prepare_for_the_final_war_desc:0 "Teknoloji savaş tarihini belirler, savaş tarihi de tarihi belirler. Yakında, hava savaşıyla belirlenecek olan nihai bir savaş olacak. Gelecekte olduğu gibi, uçaklar diğer ulusların başkentlerine doğrudan saldırmak için uzun mesafeler uçabilecekler. Bunu önlemek için, tek partili bir milli savunma devleti kurarak yeni bir komuta ekonomisine geçmeliyiz."
 JAP_prepare_the_northern_front:0 "Kuzey Cephesini Hazırla"
 JAP_prepare_the_northern_front_desc:0 "Kwantung Ordusu çok uzun zamandır [SOV.GetNameDef] ile uygun bir kavgaya girmek için can atıyor ancak bunun başarılı olması için gereken askeri altyapıdan yoksun. Mançurya'daki yolların ve demiryollarının genişletilmesine yatırım yapmalıyız, böylece [SOV.GetAdjective]ları Sibirya'dan sürmekte sonunda başarılı olabiliriz."
 JAP_prepare_the_southern_front:0 "Güney Cephelerini Hazırla"
 JAP_prepare_the_southern_front_desc:0 "Pasifik'te bir savaş büyük ölçüde deniz çıkarmalarını içerecektir. Özel Deniz Çıkarma Kuvvetleri göreve hazır olacaklarsa genişletilmeleri gerekir. Bunun yanı sıra, ana kuvvetlerimiz bölgeye ulaşmadan önce stratejik yerleri ve adaları ele geçirebilecekleri için deniz piyadesi paraşütçülerimize yatırım yapmak faydalı olacaktır."
 JAP_prepare_the_southern_front_tt:0 "[ROOT.GetNameWithFlag], §YGüneydoğu Asya Eyaletini§! kontrol eden bir ülkeye §Rsavaş ilan ettiğinde§!:"
 JAP_project_z_bomber_project:0 "Z Bombardıman Uçağı Projesi"
 JAP_project_z_bomber_project_desc:0 "Düşmanlarımızın başkentleri bizden çok uzakta, bu da savaşlarımızı hızla sona erdirmek için ihtiyaç duyduğumuz erken kararlı darbeyi gerçekleştirmeyi zorlaştırıyor. Bu nedenle, gerekirse Amerikan Doğu Kıyısına bile ulaşabilecek araçlar inşa etmeli ve düşmanın hat gerisindeki endüstrisini yok edebilecek yeni stratejik bombardıman modellerine yatırım yapmalıyız."
 JAP_promote_meritocracy:0 "Liyakati Teşvik Et"
 JAP_promote_meritocracy_desc:0 "İyi iş yapanları kendilerine uygun pozisyonlara terfi ettirmezsek bir ülke verimli bir şekilde işlemeyecektir. Elektronik konusunda bilgili bir adam elektronik endüstrisine liderlik etmelidir, kabine ile bağlantıları olan bir politikacı değil. Amakudari geleneklerini kökünden söküp atmanın ve ulusun iyiliği için liyakati benimsemenin zamanı geldi!"
 JAP_promote_pan_asianism:0 "Pan-Asyacılığı Teşvik Et"
 JAP_promote_pan_asianism_desc:0 "Birleşik bir Asya devleti hayali, cesur askerlerimizin kahramanlıkları ve Büyük Doğu Asya Ortak Refah Alanı kapsamında alınan inisiyatifler sayesinde artık her zamankinden daha yakın. Batılı uluslara, Asya'nın sadece faydalanacakları bir bölge olmadığı, en çılgın hayallerindeki en büyük imparatorluklarla bile boy ölçüşebilecek bir bölge olduğu kesin olarak gösterilecek."
 JAP_promote_pan_asianism_tt:0 "Gelişmiş Asyalı bağlı devletlerimizi tek bir devlet altında §YAsya'yı Birleştirme§! amacıyla §YEntegre Et§! kararlarının kilidini açar"
 JAP_promulgate_the_military_ministers_system:0 "Askeri Bakanlar Ataşe Sistemi"
 JAP_promulgate_the_military_ministers_system_desc:0 "Kōdōha hizbinin darbe girişiminden bu yana geçen kısa süre hiç de istikrarlı olmadı. Ordu hükümete kızarken, onları yatıştırmak için bir şeyler yapılması gerekiyor. Bu amaçla Kōki Hirota, savaş bakanının tarihimiz boyunca birkaç kez olduğu gibi yalnızca aktif olarak görev yapan bir subaya verilebilecek bir pozisyon olmasını önerdi."
 JAP_promulgate_the_military_ministers_system_tt:0 "Bu hamle §YSivil Hükümet§! üyeleri arasında §RPopüler Değil§! ve zamanla hizipler arasında sürtüşmeye neden olacağı kesin"
 JAP_propagandize_the_nihon_shoki:0 "Nihon Shoki Propagandası Yap"
 JAP_propagandize_the_nihon_shoki_desc:0 "Japonya Yıllıkları tarihimizi açıklamak için önemli bir parçadır ve kuruluş efsanelerimizi detaylandırır. Bunun okullarda yakından öğretilmesini ve çocukların Jimmu'nun o zamanki fetihleri ile gelecekteki kaderimiz arasındaki bağlantıları öğrenmelerini sağlamalıyız."
 JAP_protect_the_manchurians:0 "Mançuryalıları Koru"
 JAP_protect_the_manchurians_desc:0 "Mançuryalılar hala eski Kwantung Ordusu kalıntılarımızın baskısı altında. Kendi pisliğimizi temizlemeli ve insanları kurtarmak için harekete geçmeliyiz. Savaşı bitirme ve İmparatorluk Ordusu ile hesabımızı kapatma zamanı geldi!"
 JAP_pursue_international_trade:0 "Uluslararası Ticareti Sürdür"
 JAP_pursue_international_trade_desc:0 "Komodor Matthew Perry izolasyonumuzu sona erdirdiğinden beri yabancı güçlerle ticaret yapıyor olsak da, bu yeterli olmaktan çok uzaktı. Uluslararası pazara ağırlık vermeli ve ihtiyacımız olan kaynakları savaştan ziyade diplomasi yoluyla kazanabileceğimizden emin olmalıyız."
 JAP_put_an_end_to_chinese_feudalism:0 "Çin Feodalizmine Son Ver"
 JAP_put_an_end_to_chinese_feudalism_desc:0 "Çin'de feodal gelenekler hala hüküm sürüyor ve kurtarılması ve devrimci cumhuriyetimize getirilmesi gereken milyonlarca insan var. Kararname yayınlanacak ve Çin halkı kesin olarak özgürleştirilecek!"
 JAP_radio_guided_missiles:0 "Isı Güdümlü Füzeler"
 JAP_radio_guided_missiles_desc:0 "İmparatorluk Japon Ordusu Mühimmat Kurulu, güdümlü silahların geliştirilmesinde büyük adımlar attı. Uçaklardan nakliye hedeflerine atılması amaçlanan serbest düşüşlü, kızılötesi güdümlü, jiroskop stabilize füzeler konusunda bir atılım yapmaya yakınlar. Bu yeni silaha Ke-Go adı verildi."
 JAP_raise_support_within_the_proletarian_class:0 "Proleter Sınıf İçinde Destek Topla"
 JAP_raise_support_within_the_proletarian_class_2_tt:0 "Bir §Yİç Savaş§! durumunda §Y$JAP_strong_unions_idea$§! kazanacağız"
 JAP_raise_support_within_the_proletarian_class_desc:0 "En üst düzey liderlerimizin çoğu, tersanelerde ve çelik fabrikalarında çalışmış, işçi sınıflarından geliyor. Japon proletaryasını sendikalaşmaya ve haklarını çiğnemek isteyenlere karşı durmaya teşvik etmeliyiz."
 JAP_raise_support_within_the_proletarian_class_tt:0 "§Y[529.GetName]§!, JKP'yi destekler hale gelecek"
 JAP_raise_the_red_flag_high:0 "Kızıl Bayrağı Yükseğe Çek"
 JAP_raise_the_red_flag_high_desc:0 "Kızıl bayrak devrimimizin sembolüdür ve sonunda tüm Asyalı işçileri burjuva baskısından kurtarma umuduyla devrimi ileriye taşıma kararlılığımızı gösterir. Bayrağı gururla yükseğe çekme ve devrimin sonsuza dek yürümeye devam edeceğini ilan etme zamanı geldi!"
 JAP_reclaim_lost_territories:0 "Kayıp Toprakları Geri Al"
 JAP_reclaim_lost_territories_desc:0 "Kapsama alanımızdan kopan bölgelere dönme ve onları tekrar cumhuriyetimize getirme zamanı geldi. Ancak askeri müdahale ile bu bölgelerin insanlarının refaha kavuşmasını sağlayabiliriz."
 JAP_redistribute_land_and_wealth:0 "Toprağı ve Zenginliği Yeniden Dağıt"
 JAP_redistribute_land_and_wealth_desc:0 "Ülke genelindeki arazilerin çoğu hala geniş alanları yöneten eski daimyolarla ilgili ailelere aittir. Bu araziler çiftçilerimiz arasında yeniden dağıtılmalı ve ayrıca yeni kasabalar ve endüstriler inşa etmek için devlet tarafından el konulmalıdır."
 JAP_reduce_zaibatsu_focus_cost_tt:0 "§Y$JAP_sea_guide_the_zaibatsus$§! veya §Y$JAP_democratic_work_with_the_zaibatsus$§! hedefini almak bu hedefin süresini §G35§! güne indirecektir."
 JAP_reform_the_army:0 "Orduyu Reforme Et"
 JAP_reform_the_army_desc:0 "Ordumuzun rütbelerini hızla tırmanan bir general olan Kont Hisaichi Terauchi, ordu doktrinlerimizde bir revizyon önerdi. Eski büyük taarruz doktrinlerini modası geçmiş olarak görüyor ve daha hareketli bir savaş türünün gelecekteki savaş alanlarına hakim olacağını iddia ediyor. Tavsiyesine kulak vermeli ve zamanın gerisinde kalmadığımızdan emin olmalıyız."
 JAP_reform_the_education_system:0 "Eğitim Sistemini Reforme Et"
 JAP_reform_the_education_system_desc:0 "Mevcut eğitim sistemi hala imparatorluk kurumlarının tüm kusurlarını taşıyor ve çocuklarımıza yeterince verimli bir şekilde ulaşamıyor, bu da batılı ulusların gerisinde kalmamıza neden oluyor. Böyle kalmamasını sağlamak için azami süratle reforme etmeliyiz."
 JAP_reinforce_the_beijing_garrison:0 "Doğu Hebei Garnizonlarını Takviye Et"
 JAP_reinforce_the_beijing_garrison_desc:0 "Doğu Hebei Özerk Hükümeti, Çin Seddi'ni fethettikten sonra kuruldu ve Doğu Hebei Ordusu, bölgenin [CHI.GetAdjective] tarafının askerden arındırılmasını zorunlu kılmak için varlığını sürdürüyor. Bu birimi ve bölgedeki Kwantung garnizonlarını proaktif olarak takviye etmeliyiz, böylece [CHI.GetAdjective] saldırganlığına düşmesin."
 JAP_reinforce_the_beijing_garrison_tt:0 "§R[CHI.GetNameDef] ile bir savaşa yol açabilir§!"
 JAP_reiterate_the_three_principles_of_hirota:0 "Hirota'nın Üç İlkesini Yinele"
 JAP_reiterate_the_three_principles_of_hirota_desc:0 "Hükümetin dikkatli manevraları sayesinde Hirota, halefi Kazushige Ugaki'nin yeni başbakan olmasını sağladı. Hirota'nın üç beyanını, yani Japonya-Çin-Mançukuo bloğunun kurulmasını, komünizmin yayılmasına karşı Çin-Japon ortak cephesinin örgütlenmesini ve Çin içindeki Japon karşıtı faaliyetlerin bastırılmasını resmen onaylamanın zamanı geldi."
 JAP_rely_on_supremacy_of_the_will:0 "Piyade Taarruzlarına Güven"
 JAP_rely_on_supremacy_of_the_will_desc:0 "General Hideki Tōjō bir keresinde savaşların kararlı önleyici darbelerle, muharebelerin ise şanlı kitlesel hücumlar ve iradenin üstünlüğüyle kazanılması gerektiğini öne sürmüştü. Mevcut askeri doktrinimize çok iyi uyduğu için bu fikri desteklemeliyiz."
 JAP_remove_the_weeds_from_the_crop:0 "Yabani Otları Mahsulden Temizle"
 JAP_remove_the_weeds_from_the_crop_desc:0 "Baş siyasi teorisyenimiz Sadao Araki'nin çok net bir şekilde belirttiği gibi; yabani otları temizlemezseniz iyi bir mahsul mahvolur. Bu şekilde, hükümet içindeki ulusumuzun ilerlemesini engelleyecek ve ülkemizi yabancı kapitalistlere ve ajanlara satarken ruhumuza zarar verecek bu yabani otları ortadan kaldırmalıyız. Ayıklama zamanı başladı!"
 JAP_reorganize_the_united_autonomous_government:0 "Birleşik Özerk Hükümet"
 JAP_reorganize_the_united_autonomous_government_desc:0 "Moğol Askeri Hükümeti şu anda yalnızca ilkel bir siyasi örgütlenmeye sahip ve müdahalemiz olmadan uzun süre bir arada kalamayacak. Kendilerini egemen bir ulus olarak düzgün bir şekilde kurabilmeleri için onları Moğol Birleşik Özerk Hükümeti olarak yeniden düzenlemeliyiz."
 JAP_reorganized_national_government:0 "Yeniden Düzenlenmiş Ulusal Hükümet"
 JAP_reorganized_national_government_desc:0 "Ordumuz tarafından kurulan birçok yerel yönetimin ve Çin kırsalının doğrudan işgalinin bize pahalıya mal olduğu dikkatimizi çekti. Bu hükümetleri birleştirmeli ve Yeniden Düzenlenmiş Ulusal Hükümeti kurmalıyız."
 JAP_reorganized_national_government_tt:0 "§YÇin'deki Varlıklarımızı§! §YKonsolide Et§! kararlarının kilidini açar"
 JAP_reprimand_hamada_kunimatsu:0 "Hamada Kunimatsu'yu Azarla"
 JAP_reprimand_hamada_kunimatsu_desc:0 "Meclis'te orduyu eleştiren konuşmasında Hamada Kunimatsu çok ileri gitti. Ordunun sivil hükümeti siyasi olarak tamamen alt etmesini önlemek için onu uygun şekilde azarlamalı ve içimizde hala biraz mücadele azmi kaldığını göstermeliyiz."
 JAP_resource_security:0 "Kaynak Güvenliği"
 JAP_resource_security_desc:0 "Tamamen kendi kendine yetebilme yönündeki hırslı hedeflerimiz nihayet meyvesini verdi! Ulusumuz, bizi daha da güçlendirecek ve durdurulamaz hale getirecek doğal kaynaklarla bolca zenginleşti!"
 JAP_rethink_armor_doctrine:0 "Zırhlı Doktrinini Yeniden Düşün"
 JAP_rethink_armor_doctrine_desc:0 "Hisaichi Terauchi korkunç bir sonuca vardı. Mevcut zırhlı ve kara aracı tasarımlarımız hafif piyadelerden başka bir şeye karşı savaşmak için kötü donanımlı ve batı zırhlılarına karşı karşıya gelirlerse yok edilecekler. Bu ihmali bir an önce gidermeliyiz!"
 JAP_return_of_the_manchukuo_exiles:0 "Mançukuo Sürgünlerinin Dönüşü"
 JAP_return_of_the_manchukuo_exiles_2_tt:0 "§G5§! §YAsil Soylu IJA'ya sadık General§!, §YSosyalist Sanayiciler§! karşılığında §YMançurya'ya§! gönderilecek"
 JAP_return_of_the_manchukuo_exiles_desc:0 "Birçok sosyalist teorisyen ve ekonomist, kısa ömürlü olsa da orada devrimci düşünceyi kurma umuduyla Kwantung Ordusu tarafından fethedildikten sonra Mançurya'da kurulan çeşitli sendikalist kooperatiflerde ve diğer endüstrilerde çalışmaya gitti. Bazı generalleri sürgüne gönderme karşılığında geçici Başbakanın bu kişilerin dönüşünü kolaylaştırmasını sağlamalıyız."
 JAP_return_of_the_manchukuo_exiles_tt:0 "Sadece §Y$JAP_state_infiltrated_by_the_jcp$§! olan eyaletler §Yİç Savaşın§! başlangıcında bize katılacak"
 JAP_return_to_sakoku_ron:0 "Sakoku-ron'a Dönüş"
 JAP_return_to_sakoku_ron_desc:0 "Ulusumuz izolasyonunu ancak Komodor Perry ve [USA.GetAdjective] gambot diplomasisi yüzünden sona erdirdi. Dış etkinin artık ulusumuzun ruhunu yozlaştırdığını ve yok ettiğini gördüğümüz için, ikinci bir izolasyon çağını yürürlüğe koymalıyız."
 JAP_revere_the_emperor_destroy_the_traitors:0 "İmparatora Saygı Göster, Hainleri Yok Et"
 JAP_revere_the_emperor_destroy_the_traitors_desc:0 "Planladığımız gün nihayet geldi. Birliklerimiz Tokyo'nun kontrolünü ele geçirdi ve başlangıçtaki endişeli tavrına rağmen imparatoru hareketimizi desteklemeye ikna etmek için görüşmeler başladı. Sonunda ülkemizi batı yozlaşmasından kurtarabilecek ve eski yolların ihtişamını geri getirebileceğiz!"
 JAP_revisit_the_thirteen_demands:0 "Yirmi Bir Talebi Yeniden Gözden Geçir"
 JAP_revisit_the_thirteen_demands_desc:0 "Büyük Savaş sırasında, hükümetimiz Çin Cumhuriyeti'ne demiryollarının kontrolünü kazanmak ve daha fazlası için bir dizi talepte bulundu. Başlangıçta dahil edilmesine rağmen, finans, polislik ve hükümet işlerinde belirleyici bir ses gibi şeyler reddedildi ve sonunda sadece on üç talep kalarak imzalandı. Bu fikirlere geri dönmeli ve kendimizi Doğu Asya'nın yöneticileri olarak kabul ettirmeliyiz."
 JAP_revitalize_rural_areas:0 "Kırsal Alanları Canlandır"
 JAP_revitalize_rural_areas_desc:0 "Hareketimizdeki genç subayların çoğu yoksul ve kırsal ailelerden geliyor. Desteklerini sürdürmek için kırsalın nüfusunun azalmasını durdurmaya ve kırsal alanları canlandırmaya çalışmalıyız."
 JAP_revoke_the_peace_preservation_law:0 "Barışı Koruma Yasasını Yürürlükten Kaldır"
 JAP_revoke_the_peace_preservation_law_desc:0 "Aşağılık Barışı Koruma Yasası, Okada onlara karşı ilk konuştuğundan beri ordunun adıyla ortalığı kasıp kavuran Tokkō'nun yaratılmasını kolaylaştırdı. Ayrıca, birçok demokratik ilkeyi ve örgütü yasadışı ilan ettiği için demokratik süreci de engelliyor. Oyumuzu kullanmanın ve bu felaket kağıt parçasını yırtıp atmanın zamanı geldi."
 JAP_revoke_the_peace_preservation_law_requirements_tt:0 "Toplam §YKomünist§! ve §YDemokratik§! destek %50'nin üzerinde"
 JAP_revoke_the_peace_preservation_law_tt:0 "§RSömürgelerimizin çoğu muhtemelen bunu imparatorluktan ayrılma fırsatı olarak görecek!§!"
 JAP_rikken_minseito_victory:0 "Rikken Minseito Zaferi"
 JAP_rikken_minseito_victory_desc:0 "Seçim sonucu belli oldu. Liberal-ilerici Rikken Minseitō ezici bir zafer kazandı ve ileriye dönük açık bir çoğunluk olmaya hazırlanıyor. Görünüşe göre halk ülkenin hangi yöne gitmesini istediğine karar verdi."
 JAP_rikken_minseito_victory_flag:0 "Rikken Minseitō Genel Seçimi kazandı"
 JAP_rikken_seiyukai_victory:0 "Rikken Seiyukai Zaferi"
 JAP_rikken_seiyukai_victory_desc:0 "Seçim sonucu belli oldu. Liberal-muhafazakar Rikken Seiyūkai ezici bir zafer kazandı ve ileriye dönük açık bir çoğunluk olmaya hazırlanıyor. Görünüşe göre halk ülkenin hangi yöne gitmesini istediğine karar verdi."
 JAP_rikken_seiyukai_victory_flag:0 "Rikken Seiyūkai Genel Seçimi kazandı"
 JAP_rockets_development:0 "Roket Gelişmeleri"
 JAP_rockets_development_desc:0 "Hideo Iwakuro'nun havadan karaya güdümlü füzeler ve karadan havaya uçaksavar füzeleri konusunda birçok parlak fikri vardı. Fikirlerini desteklemeli ve gelecekteki zaferlerimizde bize yardımcı olabilecek yeni roketçilik biçimleri geliştirmeliyiz."
 JAP_sea_battleship_initiative:0 "Zırhlı İnisiyatifi"
 JAP_sea_battleship_initiative_desc:0 "Üstün zırhlı tasarımlarımızla, deniz savaşını belirlemek için sadece tek bir kararlı çatışmaya ihtiyacımız var. Savaş filomuzun kararlı bir şekilde çatışmaya ve rüzgar kadar hızlı bir şekilde zaferi güvence altına almaya optimize edildiğinden emin olmalıyız."
 JAP_sea_bigger_better_yamato:0 "Tsushima Sınıfı Zırhlılar"
 JAP_sea_bigger_better_yamato_desc:0 "Kaynaklar açısından zengin olmadığımız için, en iyi şekilde kullandığımızdan emin olmalıyız. Herhangi bir düşmanı kafa kafaya bir çatışmada yenebilecek, gezegen yüzeyine konmuş en güçlü zırhlıları inşa edeceğiz. Bununla, düşmanlarımız önümüzde eğilecek veya var olmaktan çıkacak."
 JAP_sea_establish_the_northern_resource_area:0 "Kuzey Kaynak Sahasını Kur"
 JAP_sea_establish_the_northern_resource_area_desc:0 "Kuzeyi başarıyla işgal ettiğimize göre, zengin Sibirya atıkları sürekli büyüyen savaş makinemiz için sömürülmelidir. Bu nedenle, hayati yerlerde yeni madenler ve planlı şehirler kurmalıyız, böylece mümkün olan her şeyi çıkarabiliriz."
 JAP_sea_exploit_southern_resource_area:0 "Güney Kaynak Sahasını Sömür"
 JAP_sea_exploit_southern_resource_area_desc:0 "Güneyi topuğumuzun altına aldığımıza göre, savaşımızda güçlerimizi beslemek için Güney Doğu Asya ve Doğu Hint Adaları'nın bol kaynaklarının sömürülmesini büyük ölçüde genişletmeliyiz."
 JAP_sea_fate_of_the_imperial_family:0 "İmparatorluk Ailesinin Kaderi"
 JAP_sea_fate_of_the_imperial_family_desc:0 "Japonya'daki kalıtsal yönetimin son kalıntılarını görme ve ortadan kaldırma zamanı geldi. İlerleyebileceğimiz birçok yol var, ancak imparatorluk ailesi halkımız arasında hala büyük bir popülerliğe sahip olduğu için dikkatli davranmalıyız. Eski İmparator ve ailesinin başına ne geleceğine karar vermeliyiz."
 JAP_sea_greater_east_asian_co_properity_sphere:0 "Büyük Doğu Asya Ortak Refah Alanı"
 JAP_sea_greater_east_asian_co_properity_sphere_2_tt:0 "Güneydoğu Asya genelinde §YKukla Rejimler Kurma§! Kararlarının kilidini açar"
 JAP_sea_greater_east_asian_co_properity_sphere_desc:0 "Üye devletler arasında ekonomik kendi kendine yeterliliği ve işbirliğini sağlamak, ayrıca Batı emperyalizminin ve Sovyet komünizminin etkisine direnmek için Asya'da bir birlik oluşturmalıyız. Ancak elbette bu, kıta üzerindeki hegemonyamızı güçlendirmek için etkili bir propaganda aracıdır."
 JAP_sea_greater_east_asian_co_properity_sphere_tt:0 "§YAsya§! ve §YOkyanusya§! devletlerini özgürleştirmek ve kukla yapmak §G%25§! daha ucuz hale gelir."
 JAP_sea_guide_the_zaibatsus:0 "Zaibatsulara Rehberlik Et"
 JAP_sea_guide_the_zaibatsus_desc:0 "Ulusumuzun en büyük şirketleri uzun zamandır benzeri görülmemiş bir siyasi ve ekonomik güce sahip olmuştur. Biraz incelikle, çabalarını lehimize yönlendirebilir ve liderliklerini daha geniş kontrolümüz altındaki gruplar halinde yeniden düzenleyebiliriz."
 JAP_sea_heavier_naval_guns:0 "Daha Ağır Donanma Topları"
 JAP_sea_heavier_naval_guns_desc:0 "Görünüşe göre rakiplerimiz deniz araçları için zırha büyük yatırım yapmışlar. Gelişimlerine ayak uydurabildiğimizden ve gövdelerini delebildiğimizden emin olmalıyız. Bu amaçla, daha ağır donanma topçuluğuna yatırım yapmak ihtiyatlı görünüyor."
 JAP_sea_jet_prototypes:0 "İmparatorluk Silahı No.2"
 JAP_sea_jet_prototypes_desc:0 "Havacılığın geleceği pervanelerde yatmıyor. Uçaklarımız için geliştirilmiş yetenekler adına jet itkisine bakmalıyız. Mühendislerimiz bu yeni deneysel uçağı inşa etme projesini İmparatorluk Silahı No.2 olarak adlandırdılar ve model Kikka olarak anılıyor."
 JAP_sea_long_operational_range:0 "Uzun Operasyonel Menzil"
 JAP_sea_long_operational_range_desc:0 "Hızlı zaferleri ne kadar arzulasak da, savaşlar sadece doğrudan askeri çatışmalarla kolayca kazanılmaz. Pasifik harekât alanındaki savaşta mesafeler çok büyüktür ve bu yüzden başarılı olmak istiyorsak bu mesafeleri aşabilecek modellere ihtiyacımız var."
 JAP_sea_mil_tech_coop_with_germany:0 "Almanya ile Askeri İşbirliği"
 JAP_sea_mil_tech_coop_with_germany_desc:0 "Dünyayı tek bir çatı altında birleştirmek için daha iyi teknolojiye ihtiyacımız var. Almanya bizim için teknolojik gelişmelerde sadece tarihi bir ortak değil, aynı zamanda savaş çabalarımız için son derece yararlı olacak bol miktarda askeri teknolojik ilerlemeye de sahip. Bedeli ne olursa olsun bu şemaları elde etmeliyiz!"
 JAP_sea_mountaineers:0 "Dağcı Alayları Kur"
 JAP_sea_mountaineers_desc:0 "Ordumuz, ciddi bir şey yapılmazsa güney ve batı Çin'in dağlık bölgelerine nüfuz edemeyeceğini fark etti. Bu nedenle, taarruza öncülük edebilmeleri ve düşman hatlarını yarabilmeleri için özel dağcı tugaylarının kurulmasını talep ettiler."
 JAP_sea_national_defense_state:0 "Milli Savunma Devleti"
 JAP_sea_national_defense_state_desc:0 "[ROOT.GetLeader], her erkeğin, kadının ve çocuğun ulusu korumak için seferber edileceği Shintaisei'yi ilan ederek Japonya'yı bir Milli Savunma Devleti haline getirdi. Milli Seferberlik Yasası kapsamında hükümete ulusun varlıkları üzerinde mutlak yetki de verildi. Bu sayede İmparatorluk sonsuza dek sürebilecek!"
 JAP_sea_national_spiritual_mobliization_movement:0 "Milli Manevi Seferberlik Hareketi"
 JAP_sea_national_spiritual_mobliization_movement_desc:0 "\"Lüks bizim düşmanımızdır!\" Tutumluluk, hijyen ve sıkı çalışmanın ulusal erdemlere yükseltilmesiyle, savaş çabaları için daha fazla insan gücü sağlanır ve göksel imparatorun iradesi tüm imparatorluk tebaamıza gerektiği gibi aktarılır."
 JAP_sea_nationalize_the_zaibatsus:0 "Zaibatsuları Millileştir"
 JAP_sea_nationalize_the_zaibatsus_desc:0 "Ulusumuzun en büyük şirketleri uzun zamandır benzeri görülmemiş bir siyasi ve ekonomik güce sahipti, ancak bu burada bitiyor. Devletin kontrolüne meydan okunmayacak. Onları millileştirmeli ve sermayelerini halkın yararına kullanmalıyız!"
 JAP_sea_pressure_siam:0 "Siyam'a Baskı Yap"
 JAP_sea_pressure_siam_desc:0 "Siyam, Batılı güçlerle yaklaşan savaşımızda bize yardımcı olmak için birinci sınıf bir konumda bulunuyor. Onları yanımıza alarak Malaya'nın ve dolayısıyla Doğu Hint Adaları'nın kaçınılmaz işgalini büyük ölçüde kolaylaştıracağız. Bu nedenle, bizimle değillerse bize karşı olduklarını onlara açıkça belirtmeliyiz."
 JAP_sea_promote_japanese_settlement:0 "Japon Yerleşimini Teşvik Et"
 JAP_sea_promote_japanese_settlement_desc:0 "Kendi insanlarımızı Mançurya'ya yerleştirerek iş gücünü artırabilir ve böylece fabrikalar için daha uygun yerler yaratabiliriz. Oraya taşınan insanlar ayrıca ana adalara geri gönderilebilecek tarım ürünleri de üretebilirler."
 JAP_sea_purge_the_kodoha_faction:0 "Kodoha İttifakını Tasfiye Et"
 JAP_sea_purge_the_kodoha_faction_desc:0 "Kōdōha, iktidarı ele geçirme fırsatını heba etti ve bu onlara pahalıya mal olacak. İmparatorluk majestelerine yönelik ihanetleri nedeniyle rütbelerini söküp vatana ihanetten yargılayacağız. İmparatorluk Ordusu içinde kontrolü Tōseiha'nın ele alma zamanı nihayet geldi!"
 JAP_sea_purge_the_kodoha_faction_tt:0 "§YSadao Araki§! ve §YShigeru Honjō§! aktif hizmetten emekli edilecek"
 JAP_sea_rekindle_the_old_alliance:0 "Eski İttifakı Yeniden Canlandır"
 JAP_sea_rekindle_the_old_alliance_desc:0 "Başarı şansımız en çok Büyük Savaş'taki eski müttefikimizde yatıyor. Eski ittifakı yeniden etkinleştireceğiz ve demokrasinin savunulmasında [ENG.GetNameDef] ile birlikte duracağız."
 JAP_sea_state_general_mobilization_law:0 "Devlet Genel Seferberlik Yasası"
 JAP_sea_state_general_mobilization_law_desc:0 "Silahların geliştirilmesinde geri kalmamak için milli ekonomiyi savaş zamanı temeline oturtmamız gerektiği dikkatimizi çekti. Bu yeni yasa sayesinde sivil örgütler ve sendikalar üzerinde hükümet kontrolü, stratejik endüstrilerin millileştirilmesi, fiyat kontrolleri ve gerektiğinde karne uygulama yetkisi elde edebiliriz."
 JAP_sea_state_general_mobilization_law_tt:0 "§YTarafsız§! olmamıza rağmen §Y$closed_economy$§! yasasına geçme yeteneğinin kilidini açar"
 JAP_sea_sturdy_aircraft:0 "Sağlam Uçaklar"
 JAP_sea_sturdy_aircraft_desc:0 "Çeviklik ve menzil her ikisi de önemlidir, ancak göklerdeki başarımızı belirleyen tek faktörler değildir. Uçaklarımız kağıt gibi ince olsaydı, herhangi bir savaş daha başlamadan kaybederdik. Bu nedenle, daha güçlü uçak gövdelerinin ve daha kalın zırhların geliştirilmesine yatırım yapmalıyız, böylece yıllarca göklere hükmedebiliriz."
 JAP_sea_sturdy_aircraft_tt:0 "Belirli karakterlere yönelik hedefli hava saldırısı şansını azaltır"
 JAP_sea_supremacy_of_will:0 "İradenin Üstünlüğü"
 JAP_sea_supremacy_of_will_desc:0 "En gelişmiş ekipman, onu kullanacak şiddetli bir adam olmadan işe yaramaz ve şiddet en basit taşı bile en ölümcül silaha dönüştürebilir. Savaşlar ancak atılganlık ruhuyla, taarruz kültüyle kazanılabilir."
 JAP_sea_the_showa_restoration:0 "[JAP_sea_the_showa_restoration_key]"
 JAP_sea_the_showa_restoration_desc:0 "[JAP_sea_the_showa_restoration_desc_key]"
 JAP_sea_the_showa_restoration_emperor_genka_desc:0 "Nihayet, liberal Taishō Demokrasisi dönemi sona erdi. Ulus bir kez daha güçlü bir İmparatoru destekleyen küçük bir grup nitelikli insan tarafından yönetilecek. Ülkemiz ancak bu sayede kurtuluşa erecektir."
 JAP_sea_the_showa_restoration_emperor_showa_desc:0 "Nihayet, liberal Taishō Demokrasisi dönemi sona erdi. Ulus bir kez daha güçlü bir İmparatoru destekleyen küçük bir grup nitelikli insan tarafından yönetilecek. Ülkemiz ancak bu sayede kurtuluşa erecektir."
 JAP_sea_the_showa_restoration_key_emperor_genka:0 "Genka Restorasyonu"
 JAP_sea_the_showa_restoration_key_emperor_showa:0 "Showa Restorasyonu"
 JAP_sea_tripartite_pact:0 "Üçlü Paktı Öner"
 JAP_sea_tripartite_pact_desc:0 "Düşmanlarımız bize karşı birleşirken, onları yenme görevi daha zorlu bir hal alıyor. Benzer hedeflere sahip diğer hükümetlere ulaşmalıyız, böylece bir ölçüde işbirliği yapabiliriz."
 JAP_sea_unify_the_air_forces:0 "Hava Kuvvetlerini Birleştir"
 JAP_sea_unify_the_air_forces_2_tt:0 "Etkili değişiklik: §Y$JAP_army_and_naval_air_services_dm$§! yerine §Y$JAP_japanese_airforce_dm$§! gelir."
 JAP_sea_unify_the_air_forces_desc:0 "Çok uzun zamandır, ordu ve donanma arasında havacılığın ayrı ayrı araştırılması ve geliştirilmesi sorunuyla boğuşuyoruz. Hem silahlanma birliğini hem de sınırlı araştırma kaynaklarımızın daha iyi kullanılmasını sağlamak için bu programları birleştirmeliyiz."
 JAP_sea_unify_the_air_forces_tt:0 "Tüm §YUçak Tasarımcıları§! için §Y$JAP_mio_trait_unified_research_and_development$§! MIO özelliğinin kilidini açar. §RAncak bunlardan sadece birine uygulanabilir§!."
 JAP_secretly_rebuild_the_party:0 "JKP'yi Gizlice Yeniden İnşa Et"
 JAP_secretly_rebuild_the_party_desc:0 "1925'te Barışı Koruma Yasası imzalandığında sesini ve siyasi temsilini kaybeden birçok grup var. Bu gruplardan biri, örgütleri yasadışı ilan edilen ve son rejimimiz altında büyük baskı gören komünistlerdir. Orduya karşı mücadelemizde onları bir destekçi olarak kazanmak için hareketlerini yasallaştırmaya çalışmalıyız."
 JAP_secretly_rebuild_the_party_tt:0 "§Yİç Savaş§! gerçekleştiğinde §YKomünistlere§! katılmalarını sağlamak için §YMuhalefet Kontrolündeki Eyaletlere Sızma§! kararlarının kilidini açar"
 JAP_secure_the_sea_lanes:0 "Deniz Yollarını Güvenceye Al"
 JAP_secure_the_sea_lanes_desc:0 "Filolarımız, düşman denizaltıları ve torpido botları tarafından engellenmeden çalışmak için en modern eskortlara ihtiyaç duyar. Ancak buna yatırım yaparak nakliyelerimiz hedeflerine güvenli bir şekilde ulaşabilecektir."
 JAP_seek_foreign_investments:0 "Yabancı Yatırım Ara"
 JAP_seek_foreign_investments_desc:0 "Artık daha fazla açıldığımıza göre, yabancı sermaye yatırımlarını çekmek ve bu süreçte kendi endüstrilerimizi güçlendirmek için yeni kurulan bağlantılarımızı kullanmalıyız."
 JAP_seek_foreign_investments_tt:0 "§YPolitik Güç§! karşılığında §YSivil Fabrikalar§! kazanmak için §YYabancı Yatırımları Çek§! kararlarının kilidini açar"
 JAP_seek_strength_in_numbers:0 "Gücü Sayılarda Ara"
 JAP_seek_strength_in_numbers_desc:0 "Bir gemi bir çatışmayı kazanmak için yeterli değildir. Filolarımızı çeşitlendirmeli ve sadece kaliteye odaklanmak yerine sayılarımızı genişletmeliyiz. Sonuçta, nicelik başlı başına bir niteliktir."
 JAP_seek_strength_in_numbers_tt:0 "Tüm §YGemi Tasarımcıları§! için §Y$JAP_mio_trait_strength_in_numbers$§! MIO özelliğinin kilidini açar. §RAncak bunlardan sadece birine uygulanabilir§!."
 JAP_seek_yakuza_support:0 "Yakuza Desteği Ara"
 JAP_seek_yakuza_support_2_tt:0 "§G1§! §YGeneral§! bize sadık olacak"
 JAP_seek_yakuza_support_desc:0 "Gölgelerde büyük güce sahip olan birçok grup var, politikacıların ve generallerin eylemlerini kontrol ediyor ve etkiliyorlar. Bu gruplarla müttefik olmaya çalışmalı ve ordunun istediğini yapmamasını sağlamak için bizimle birlikte çalışmaya ikna etmeliyiz."
 JAP_seek_yakuza_support_tt:0 "§Yİmparatorluk Ordusu'nun§! daha büyük bir kısmı §Yİç Savaş§! için bizim tarafımıza çekilecek"
 JAP_sessho_title_text:0 "Sesshō"
 JAP_shinkansen:0 "Shinkansen Projesi"
 JAP_shinkansen_desc:0 "Baş mühendis Hideo Shima, Tokyo, Nagoya ve Osaka'yı birbirine bağlayacak Tokaido Shinkansen adını verdiği bir hızlı tren hattı oluşturma planıyla geldi; bu hat, büyük şehirlerimiz arasında hem mallar hem de siviller için hızlı ve kolay ulaşım sağlayacak. Bu projeye yatırım yapmalıyız."
 JAP_shinkansen_tt:0 "§Y$JAP_shinkansen_construction_idea$§! milli ruhu kaldırıldığında:\n"
 JAP_ship_management_committee:0 "Gemi Yönetim Komitesi"
 JAP_ship_management_committee_desc:0 "Savaş Zamanı Nakliye Kontrol Emri'nin yakın zamanda onaylanmasıyla, savaş zamanında nakliye endüstrisinin tam potansiyelini en üst düzeye çıkarmak amacıyla nakliye endüstrisini yönetmek, kontrol etmek ve nakliye ile ilgili milli politikaların uygulanmasında işbirliği yapmakla görevli özel bir kurumun kurulmasına izin verebiliriz."
 JAP_ship_management_committee_tt:0 "§Y$convoy_1$§!:\n   £production_cost Üretim Maliyeti: §G-%15.00§!."
 JAP_sino_japanese_pact:0 "Çin-Japon Anti-Komünist Paktı"
 JAP_social_and_cultural_revolution:0 "Sosyal ve Kültürel Devrim"
 JAP_social_and_cultural_revolution_desc:0 "Şimdi feodalizmin, milliyetçiliğin ve muhafazakar geleneklerin tüm kalıntılarını ortadan kaldırma ve aynı zamanda komünist ideolojiyi devlet genelinde teşvik etme gibi devasa bir göreve başlamalıyız. Bushido'yu eğitimimizden çıkarmalı ve halkı Youfuku giymeye teşvik etmeli ve devletimizi diğer devrimci toplumlarla aynı seviyeye getirmek için batı türü lehine her türlü geleneksel kıyafeti atmalıyız."
 JAP_social_and_cultural_revolution_tt:0 "§Y$JAP_reorganization_of_society_idea$§! milli ruhu kaldırıldığında:\n"
 JAP_socialism_in_one_state:0 "Tek Devlette Sosyalizm"
 JAP_socialism_in_one_state_desc:0 "Asya halkını eğitebilecek ve yükseltebilecek tek kişi, devrimin başarılı olabileceğini gösteren biziz. Gerekirse silah zoruyla onlara hayatlarını nasıl yöneteceklerini göstermek için onları aramıza almalıyız."
 JAP_societal_bushido:0 "Toplumsal Bushido"
 JAP_societal_bushido_desc:0 "General Sadao Araki, İmparatoru, halkı, toprağı ve ahlakı bir ve bölünmez olarak birbirine bağlayan ideolojisinin felsefi temelini oluşturmak için samurayların eski Bushido kodunu Avrupa faşizmine benzer fikirlerle ilişkilendirdi. Bu amaçla, Bushido kodunu her iyi vatandaşın her zaman uyması gereken bir şey olarak tanıtmalıyız."
 JAP_solidify_tohokai_rule:0 "Tohokai Yönetimini Sağlamlaştır"
 JAP_solidify_tohokai_rule_desc:0 "Nakano'nun Başbakanlığa yükselmesiyle, İmparatorluk Yönetimine Yardım Derneği içindeki Tōhōkai hizbi en büyüğü haline geldi. Şimdi, Doğu Cemiyeti altındaki yönetimi gerçekten sağlamlaştırma ve Nakano'nun önümüzdeki yıllarda [ROOT.GetAdjective] siyasetindeki rolünü güvence altına alma fırsatımız var!"
 JAP_sonnou_joui:0 "Sonno Joi!"
 JAP_sonnou_joui_desc:0 "Bakumatsu döneminin güçlü İmparator ideallerine bir kez daha layık olduk ve yabancı emperyalizme karşı durmaya hazırız. Tokugawa Şogunluğu bir zamanlar nasıl kovulduysa, biz de büyük İmparator'un yönetimine karşı çıkan herkesi kovacağız. İmparatora Saygı Göster, barbarları kov! İlahi kaderimizi geri almanın zamanı geldi."
 JAP_sonnou_joui_tt:0 "Bu ruh, §YMücevherli Mızrak Vurdu§! aracılığıyla talep ettiğimiz bir ulusun başkentini ele geçirdiğimizde, §Reğer o sırada hala aktifse§!, yenilenir."
 JAP_soviet_japanese_neutrality_pact:0 "Sovyet-Japon Tarafsızlık Paktı"
 JAP_soviet_japanese_neutrality_pact_desc:0 "Güneye saldırma özgürlüğüne sahip olacaksak kuzey sınırımız güvence altına alınmalıdır. Tarafsızlıklarını sağlamak ve aynı zamanda Kuzey Sahalin'e yönelik daha fazla kaynak hakkı müzakere etmek için [SOV.GetNameDef] ile derhal müzakerelere başlayacağız."
 JAP_soviet_japanese_neutrality_pact_flag:0 "§Y$JAP_soviet_japanese_neutrality_pact$§! milli hedefini tamamladı"
 JAP_soviet_japanese_neutrality_pact_refused_flag:0 "§Y$JAP_soviet_japanese_neutrality_pact$§! reddedildi"
 JAP_soviet_japanese_neutrality_pact_tt:0 "Eğer §Y[SOV.GetAdjective]lar§! paktı kabul ederse, daha fazla [ROOT.GetAdjective] Sanayici §Y[655.GetName]§! imtiyazlarımıza yatırım yapmayı iyi bir çıkar olarak görecektir"
 JAP_split_uo_zaibatsu_monopolies:0 "Zaibatsu Tekellerini Böl"
 JAP_split_uo_zaibatsu_monopolies_desc:0 "Ulusumuzun en büyük şirketleri uzun zamandır benzeri görülmemiş bir siyasi ve ekonomik güce sahipti. Onlara hala hükümetin isteklerine tabi olduklarını hatırlatmalı ve yönetilmelerini kolaylaştırmak için onları daha küçük Keiretsu holdinglerine bölmeliyiz."
 JAP_spread_revolutionary_flames_to_south_asia:0 "Devrim Ateşini Güney Asya'ya Yay"
 JAP_spread_revolutionary_flames_to_south_asia_2_tt:0 "§YGüney Asya§! ulusları içinde §YKomünist Duyguları Kışkırtma§! kararlarının kilidini açar"
 JAP_spread_revolutionary_flames_to_south_asia_desc:0 "Devrim ateşleri dört bir yana yayılıyor ve başarılı kampanyalarımız her yerdeki proletaryaya ilham veriyor. Bölgeyi istikrarsızlaştırmak ve onları beşinci enternasyonale getirmek için Güney Asya'daki devrimci grupları finanse etmeye başlamalıyız."
 JAP_spread_revolutionary_flames_to_south_asia_tt:0 "§YKomünist Güney Asya§! uluslarını ittifakımıza davet etme kararlarının kilidini açar"
 JAP_spread_revolutionary_flames_to_west_asia:0 "Devrim Ateşini Batı Asya'ya Yay"
 JAP_spread_revolutionary_flames_to_west_asia_2_tt:0 "§YOrta Doğu§! ulusları içinde §YKomünist Duyguları Kışkırtma§! kararlarının kilidini açar"
 JAP_spread_revolutionary_flames_to_west_asia_desc:0 "Devrim ateşleri dört bir yana yayılıyor ve başarılı kampanyalarımız her yerdeki proletaryaya ilham veriyor. Bölgeyi istikrarsızlaştırmak ve onları beşinci enternasyonale getirmek için Batı Asya'daki devrimci grupları finanse etmeye başlamalıyız."
 JAP_spread_revolutionary_flames_to_west_asia_tt:0 "§YKomünist Orta Doğu§! uluslarını ittifakımıza davet etme kararlarının kilidini açar"
 JAP_spread_the_revolutuon_south:0 "Devrimi Güneye Yay"
 JAP_spread_the_revolutuon_south_desc:0 "Asya halkı özgürleşecekse devrim alevleri hızla güneye taşınmalıdır. Saldırmanın ve tüm Asyalılar için daha parlak bir gelecek sağlamanın tam zamanı!"
 JAP_strategic_offensives:0 "Stratejik Taarruzlar"
 JAP_strategic_offensives_desc:0 "[CHI.GetNameDefCap] kırılması çok zor bir ceviz olduğunu kanıtlıyor ve yüksek komuta kadememiz farklı ilgi noktalarını hedef alan daha koordineli taarruzlar çağrısında bulundu. Sahadaki Gekokujo yüksek çıkarlarımızı engellerken, önce onları kısıtlamalıyız, böylece nihayet bu operasyonları başlatabiliriz."
 JAP_strategic_offensives_tt:0 "§YTaarruz Başlat§! kararlarının kilidini açar, bu kararlar §YÇin Eyaletlerinde§! geçici bonuslar verir"
 JAP_strenghten_manchukuo_imperial_airforce:0 "Mançu İmparatorluk Hava Kuvvetlerini Güçlendir"
 JAP_strenghten_manchukuo_imperial_airforce_desc:0 "Mançu İmparatorluk Hava Kuvvetleri sadece yakın zamanda kuruldu ve subaylarının öğreneceği çok şey var. Onları eğitmek için subaylar göndermeli ve ayrıca güçlerini desteklemek için Nakajima Ordu Tipi 91 avcı uçakları ve Kawasaki Tipi 88 hafif bombardıman uçakları teslim etmeliyiz."
 JAP_strenghten_manchukuo_imperial_army:0 "Mançu İmparatorluk Ordusunu Güçlendir"
 JAP_strenghten_manchukuo_imperial_army_desc:0 "Mançu İmparatorluk Ordusu, [SOV.GetNameDef] güçlerine karşı bir öncü olarak duruyor ve savaş çıkarsa sınırı tutacak olanlar onlar. Bu güçlerin genişletilmesine yardım etmeliyiz, böylece umarız [SOV.GetAdjective] devine karşı durabilirler."
 JAP_strenghten_the_supply_lines:0 "İkmal Hatlarını Güçlendir"
 JAP_strenghten_the_supply_lines_desc:0 "İkmal hatlarımız başa çıkabileceğimizden daha ince bir şekilde gerildi ve birliklerimiz bunun sonucunda kayıplar veriyor. Başarılarımızın devam etmesini istiyorsak bu durumu çözmeliyiz, çünkü birliklerimiz tökezleyip düşmeden önce zaman hızla tükeniyor."
 JAP_strike_down_the_enemy_of_the_people:0 "Halk Düşmanını Vur"
 JAP_strike_down_the_enemy_of_the_people_available_tt:0 "Bir §YKomünist§! ülkesi, §YAsia§!'de en az bir eyalete sahiptir"
 JAP_strike_down_the_enemy_of_the_people_desc:0 "[ROOT.GetAdjective] halkının büyük düşmanı komünizmdir ve bu gerçek asla değişmeyecektir. Temelde ulusumuzla bir arada var olamaz ve bu nedenle doğu ve batı medeniyetleri arasındaki son savaşın sonunda sadece biri ayakta kalabilir."
 JAP_strike_down_the_enemy_of_the_people_tt:0 "Herhangi bir §YAsyalı Komünist§! ulusa karşı §Yİlhak§! savaş hedefi kazan. Mevcut hedefler:"
 JAP_strike_down_the_great_pretender:0 "Büyük Sahtekarı Yere Ser"
 JAP_strike_down_the_great_pretender_desc:0 "Sovyetler Birliği'ndeki bolşevikler halktan yana gibi davranıyorlar ve Asya'nın bazı bölgelerini zorbalıkla yönetiyorlar. Devrimci bir güç gibi davranan bu burjuva diktatörlüğünü devirmeli ve kendimizi devrimin tek savunucuları ilan etmeliyiz!"
 JAP_strike_north_doctrine:0 "Kuzeye Saldırı Doktrini"
 JAP_strike_the_southern_road:0 "Güney Yolunu Vur"
 JAP_strike_the_southern_road_desc:0 "Planımızı harekete geçirme zamanı geldi. Güneye saldıracağız ve kaynak zengini Batı sömürgelerini kendimiz için alacağız. Bu hızlı ve kararlı darbe ile, düşmanların savaşma yeteneğini daha tam olarak başlamadan azaltabilmeliyiz. Tennoheika Banzai!"
 JAP_strike_the_soviets:0 "Eski Rakibi Vur"
 JAP_strike_the_soviets_desc:0 "Kuzey Karafuto'yu bizden çalan Bolşeviklere karşı bir siper olarak duruyoruz. Sibirya Seferi ve Rus-Japon Savaşı'ndan bu yana halkımız, onları doğu Sibirya'dan nihayet kovmak ve nüfuz alanımızı güvence altına almak için [SOV.GetNameDef] ile bir kavga için bir kez daha can atıyor."
 JAP_subdue_the_kwantung_army:0 "Kwantung Ordusunu Boyun Eğdir"
 JAP_subdue_the_kwantung_army_2_tt:0 "Birkaç §YKwantung Ordusu§! Generali rütbesi düşürülür ve aktif hizmetten emekli edilir:"
 JAP_subdue_the_kwantung_army_desc:0 "Kwantung Ordusu, askeri kliğimizin otoritesini dinlemeyerek uzun zamandır başımıza bela oldu. Taktiksel terfiler ve gözdağı yoluyla bize tamamen itaatkar hale gelmelerini sağlamalıyız. Zamanı geldiğinde Sadao Araki, Kwantung Ordusu'nun yeni başkanı olacak."
 JAP_subdue_the_kwantung_army_tt:0 "§G§! §YKistilen Ordu§!'yi yönetir ve hükümetimizin isteklerinden bağımsız hareket edemeyeceklerini garanti eder"
 JAP_supremacy_of_the_kempeitai:0 "Kempeitai'nin Üstünlüğü"
 JAP_supremacy_of_the_kempeitai_desc:0 "'Hukuk askerlerimiz', eski rejime daha sadık olan Tokkō'nun rolünü devralacak. Kempeitai milli polisin başına getirilecek ve kontrgerilla, karşı istihbarat ve muhalefeti bastırma yeteneklerimizi geliştirecek."
 JAP_supreme_council_for_direction_of_war:0 "Savaşın Yönetimi İçin Yüksek Konsey"
 JAP_supreme_council_for_direction_of_war_desc:0 "Hükümetimiz, devlet işleri ile komuta arasındaki koordinasyonu güçlendirme ihtiyacının acil olduğunu gördükten sonra, İmparatorluk Genel Karargahı-Hükümet İrtibat Konferansı'nı hızla düzenlememiz gerektiğini fark etti. Belki bu bizi zafere götürebilir."
 JAP_sway_disillusioned_young_officers:0 "Hayal Kırıklığına Uğramış Genç Subayları Etkile"
 JAP_sway_disillusioned_young_officers_2_tt:0 "§Yİmparatorluk Ordusu'nun§! biraz daha büyük bir kısmı §Yİç Savaş§! için bizim tarafımıza çekilecek"
 JAP_sway_disillusioned_young_officers_desc:0 "En son Kōdōha darbesine katılan genç subayların çoğu, ordunun mevcut yapısından ve liyakat yerine geçmişe dayalı terfi sisteminden memnun olmayan daha yoksul kırsal ailelerden geliyor. Bunu kullanmalı ve onlara daha iyi bir yarın vaat etmeliyiz."
 JAP_sway_disillusioned_young_officers_tt:0 "§YKōdōha Genç Subayları§! davamıza sempati duyacak"
 JAP_sway_the_navy_moderates:0 "Donanma Ilımlılarını Etkile"
 JAP_sway_the_navy_moderates_2_tt:0 "§G4§! §YAmiral§! bize sadık olacak"
 JAP_sway_the_navy_moderates_desc:0 "Donanma içinde ordudakilerden çok daha makul olan birçok yüksek rütbeli insan var. Antlaşma ittifakının eski üyelerine yaklaşırsak, onaylarını ve hatta iç savaş durumunda desteklerini kazanabiliriz."
 JAP_sway_the_navy_moderates_tt:0 "§Yİmparatorluk Donanması'nın§! ve güçlerinin daha büyük bir kısmını §Yİç Savaş§! için elimizde tutacağız"
 JAP_taiheyo_belt:0 "Taiheiyo Kuşağı"
 JAP_taiheyo_belt_desc:0 "Ekonomistlerimiz, Tokyo'dan Fukuoka'ya uzanan Taiheiyō Kuşağı adını verdikleri bir kentleşme bölgesi yaratma planına atıfta bulunuyorlar. Alanları, güney ana adalarının çoğunda daha kolay hareket ve ekonomik ve endüstriyel girişimler sağlayacak bir megalopolis'te birbirine bağlıyor. Bunu gerçeğe dönüştürmeliyiz!"
 JAP_tennoheika_banzai:0 "Tennoheika Banzai!"
 JAP_tennoheika_banzai_desc:0 "Banzai hücumu, [ROOT.GetAdjective] savaşma ruhunun vücut bulmuş halidir. Askeri müfredatın bir parçası olarak, her adam savaş çığlığını bilecek ve süngü hücumu taktikleri konusunda eğitilecektir. Bunları kullanarak, adamlarımız savaş esiri olarak yaşamayacak, bunun yerine bir zafer parıltısı içinde ölecekler. Çok yaşa Majesteleri İmparator!"
 JAP_the_art_of_warfare:0 "Savaş Sanatı"
 JAP_the_art_of_warfare_desc:0 "Doğu Asya tarihinde efsanelere konu olmuş pek çok büyük taktikçi ve savaşçı vardır, ancak çok azı usta stratejist Sun Tzu'nun yanına yaklaşabilir. Belki ondan öğrenebileceğimiz bir iki şey vardır, böylece planlarımız zamanla daha sağlam hale gelebilir."
 JAP_the_courage_to_defend_the_revolution:0 "Devrimi Savunma Cesareti"
 JAP_the_courage_to_defend_the_revolution_desc:0 "Her erkek ve kadın, devrimi dünyadaki birçok karşı devrimci güçten korumak için cesaret ve kararlılık göstermelidir. İdeallerimizi elimizdeki her şeyle savunma zamanı geldi!"
 JAP_the_crysanthemum_throne:0 "Krizantem Tahtı"
 JAP_the_crysanthemum_throne_desc:0 "Ordumuz içindeki hizipler çok fazla çekişiyor ve bir sonraki Başbakan olarak kimi terfi ettirecekleri konusunda bir anlaşmaya varamıyorlar. Durum bu kadar değişkenken, İmparatorun devreye girip durum üzerinde doğrudan kontrolü ele alması ihtiyatlı olabilir."
 JAP_the_divine_wind:0 "İlahi Rüzgar"
 JAP_the_divine_wind_desc:0 "Özel Saldırı Birimi'nin taktikleri olan Kamikaze, intihar saldırılarını doğaçlama bir son çareden yerleşik bir doktrine dönüştürdü. Yeni uçaklar, esasen insanlı füzeler ile bu saldırılar durdurulamaz olacak."
 JAP_the_enemy_of_our_enemy:0 "Düşmanımızın Düşmanı"
 JAP_the_enemy_of_our_enemy_desc:0 "Kuzey sınırlarımıza yönelik [SOV.GetSovietThreatName] tehdidi ele alınmalıdır. [SOV.GetNameDef] ile bir savaş için hazırlıklara başlamalıyız. Bunu yapmanın en iyi yolu, raporlarımıza göre [SOV.GetNameDef] devletine karşı bir savaşa hazırlanan [GER.GetNameDef] ile ilişkilerimizi güçlendirmektir."
 JAP_the_eternal_kingdom:0 "Ebedi İmparatorluk"
 JAP_the_eternal_kingdom_desc:0 "Japonya, ilahi İmparator tarafından yönetilen bir ulustur ve bu nedenle tanrılar tarafından korunan bir ülkedir. Onların yardımıyla, ilahi ülkemiz ölümsüzdür ve sonsuza dek güçlü kalacaktır. Çok yaşa Majesteleri İmparator ve çok yaşa Büyük Japonya İmparatorluğu!"
 JAP_the_eternal_kingdom_tt:0 "§Y%50§! Teslimiyet İlerlemesine ulaşırsak bu ruh kaldırılacak"
 JAP_the_first_five_year_plan:0 "Birinci Beş Yıllık Plan"
 JAP_the_first_five_year_plan_desc:0 "Halkımızın geleceğini güvence altına almak için [ROOT.GetNameDef] adına cesur yeni bir ekonomik model üretip uygulayabilecek bir komite kurmalıyız. Bu yeni Beş Yıllık Plan bizi gerçekten çiçek açarken ve gelişirken görecek!"
 JAP_the_five_great_cities:0 "Beş Büyük Şehir"
 JAP_the_five_great_cities_desc:0 "Kyoto, Osaka, Yokohama, Kobe ve Nagoya şehirlerine, sanayileşme ve kentleşme süreçlerine yardımcı olmak ve nihayetinde valiliklerden bağımsız özel şehirler haline gelmek amacıyla, sıradan şehirlere sunulmayan çeşitli özel hükümler sağlayan özel atamalar verildi. Bu girişime yatırımlarımızı artırmalıyız."
 JAP_the_flying_geese:0 "Uçan Kazlar"
 JAP_the_flying_geese_desc:0 "Güneydoğu Asya'daki teknolojik gelişme ancak bizimki tarafından yönlendirilebilir ve Asya ulusları, metalaştırılmış malların üretiminin sürekli olarak daha gelişmiş ülkelerden daha az gelişmiş olanlara hareket edeceği bölgesel bir hiyerarşinin parçası olarak Batı'yı yakalayacaktır. Tıpkı V formasyonundaki kazlar gibi, Asya'nın kalkınmasına öncülük edeceğiz!"
 JAP_the_footsteps_of_jimmu:0 "Jimmu'nun Ayak İzleri"
 JAP_the_footsteps_of_jimmu_desc:0 "Efsanevi kurucumuz İmparator Jimmu, Seto İç Denizi yakınlarındaki Hyūga'dan askeri bir sefer başlattı, Yamato'yu ele geçirdi ve burayı güç merkezi olarak kurdu. Karga tanrısı Yatagarasu'nun rehberliğinde topraklarımızı büyük ölçüde genişleten Büyük Doğu Seferi'ni başlattı. Bu ilahi savaşçının bir zamanlar tanrılar adına fethettiği gibi, biz de fethedeceğiz."
 JAP_the_great_spiritual_evil:0 "Büyük Manevi Kötülük"
 JAP_the_great_spiritual_evil_desc:0 "Barışı Koruma Yasalarının yürürlüğe girmesi, komünist yozlaşmanın halkımızın zihnini etkilemesini durdurma yolunda iyi bir ilk adım oldu, ancak hala yapacak çok işimiz var. Kokutai de yabancı sosyalist düşüncenin tehdidi altında ve bunun ulusumuzu yok etmesini önlemek için daha proaktif bir yaklaşım benimsemeliyiz."
 JAP_the_harakiri_debate:0 "Harakiri Tartışması"
 JAP_the_harakiri_debate_desc:0 "Hamada Kunimatsu'nun orduya karşı sergilediği utanç verici meydan okumanın ardından Hisaichi Terauchi, eski başbakanın içinde bir nebze onur kırıntısı kaldıysa kabinenin istifasını ve yeni bir başbakanın göreve başlamasını talep etti. Biraz dikkatli manevrayla Senjūrō Hayashi, ordunun bir kuklası olarak göreve getirilebilir."
 JAP_the_ie_system_and_socialism:0 "Ie Sistemi ve Sosyalizm"
 JAP_the_ie_system_and_socialism_desc:0 "Ailelerin nasıl organize edildiğine dair geleneksel Ie sistemi, tarihsel olarak sosyal yapıları, iş uygulamalarını ve hatta ulusumuzdaki şirketlerin organizasyonunu şekillendirmiştir. Bunun etrafta kalmasını sağlamalıyız, ancak içindeki otorite figürü olarak devlete vurgu yapmalıyız."
 JAP_the_imperial_colors:0 "İmparatorluk Renkleri"
 JAP_the_imperial_colors_desc:0 "Tıpkı bizim şimdi yaptığımız gibi 1931'de hükümete darbe yapmaya çalışıp başarısız olan yurttaşlarımızın onuruna, 21 Ekim'i imparatorluk bayrağını dalgalandırdığımız ve İmparatorumuz adına yaptıkları fedakarlıkları hatırladığımız milli bir bayram haline getirmeliyiz."
 JAP_the_imperial_defense_plan:0 "[JAP_the_imperial_defense_plan_key]"
 JAP_the_imperial_defense_plan_desc:0 "Devleti korumak için proaktif savunma için yeni bir plan formüle etmeliyiz. Tüm savaşlar, uzun süreli savaşlardan kaçınarak ve düşmanlarımızı taleplerimize boyun eğmeye zorlayarak ani büyük ölçekli kararlı darbelerle kazanılacaktır."
 JAP_the_imperial_defense_plan_imperial:0 "İmparatorluk Savunma Planı"
 JAP_the_imperial_defense_plan_national:0 "Milli Savunma Planı"
 JAP_the_indochinese_soviet:0 "Hindiçin Sovyeti"
 JAP_the_indochinese_soviet_desc:0 "Birlik kurulduğuna göre, yeni Sovyet Cumhuriyetleri kurmalı ve onları aramıza almalıyız. Bölgeyi işgalimizi haklı çıkarmak için Hindiçin Sovyeti'ni yaratmalıyız."
 JAP_the_jeweled_spear_has_struck:0 "Mücevherli Mızrak Vurdu"
 JAP_the_jeweled_spear_has_struck_desc:0 "İlahi mücevherli mızrak bir zamanlar yaratılış tanrıları Izanagi ve Izanami tarafından ilk kara parçasını denizden çıkarmak için kullanılmıştı. Tıpkı onların dikilen mızrağı yeni toprak talep etmek için kullandıkları gibi, biz de öyle yapacağız. İlahi mızrağın bir kez daha nereye vuracağını görme zamanı geldi."
 JAP_the_jeweled_spear_has_struck_tt:0 "§YAsya§! eyaletlerini talep etme ve sahiplerine karşı §YSavaş Hedefleri§! kazanma kararının kilidini açar. Bir seferde talep etmek için bir ülkeyi hedefleyebiliriz, bunun üzerine daha fazlasını talep etmek için mevcut tüm talep edilen eyaletleri işgal etmemiz gerekir."
 JAP_the_koiso_cabinet:0 "Koiso Kabinesi"
 JAP_the_koiso_cabinet_desc:0 "İmparator, [ROOT.GetLeader] ve İmparatorluk Japon güçlerinin yeteneklerine karşı artan güvensizliğini ifade ederken, ulusun nihai yıkımından kaçınmak için ulusu birleştirme ve savaştan bir çıkış yolu arama arzusunu dile getirdi. Politikacılar ve generaller arasında aday olarak popüler olmasa da Koiso, ulusu çatışmadan çıkarma yeteneğine sahip olabilir."
 JAP_the_labor_farmer_faction_ascendant:0 "İşçi-Çiftçi İttifakı Yükseliyor"
 JAP_the_labor_farmer_faction_ascendant_desc:0 "Tartışmada, daha idealist ve çiftçi odaklı Rōnō-ha ittifakı galip geldi ve Kōza-ha'yı mucizevi bir şekilde yendi. Bu şemsiye hareketi galip gelse de, ana soru hala duruyor, cumhuriyetin bir sonraki başbakanı kim olacak?"
 JAP_the_labor_farmer_faction_ascendant_tt:0 "Tüm etkenler §Y$JAP_rounouha_modifier$§! etkenine aktarılır"
 JAP_the_lecture_group_ascendant:0 "Ders Grubu Yükseliyor"
 JAP_the_lecture_group_ascendant_desc:0 "Tartışmada, daha otoriter ve proleter odaklı Kōza-ha ittifakı üstün geldi. Bu ittifakın liderleri Sanzō Nosaka ve Kyūichi Tokuda, yeni bir devlet kurma zorlu görevini üstlenecekler. Ancak asıl soru şu; Başkan olarak kim liderlik etmeli ve kim ulusun Başbakanı olacak?"
 JAP_the_long_march_to_victory:0 "Zafere Giden Uzun Yürüyüş"
 JAP_the_long_march_to_victory_desc:0 "Çin hükümetlerini kırmak için Asya kıtasının derinliklerine yürümeliyiz. Askerlerimizin ne kadar sürerse sürsün yürümeye devam etme isteğini artıracağı umuduyla uzun yürüyüşe atıfta bulunan propaganda kampanyaları yapmalıyız!"
 JAP_the_metal_collection_order:0 "Metal Toplama Emri"
 JAP_the_metal_collection_order_desc:0 "Ulusumuz stratejik malzemeleri, normal metaller de dahil olmak üzere hızla tüketiyor. Bu nedenle, savaş durumunun yoğunlaşmasını ve malzeme kıtlığını telafi etmek amacıyla kamu ve özel sektörün sahip olduğu metalleri toplamak için 667 sayılı İmparatorluk Kararnamesi'ni çıkarmalıyız."
 JAP_the_minitry_of_pan_asian_development:0 "Pan-Asya Kalkınma Bakanlığı"
 JAP_the_minitry_of_pan_asian_development_desc:0 "Farklı Asya devletlerindeki yaşam koşullarını daha iyi iyileştirmek için, kalkınmaya yönelik yatırımları denetleyen ve endüstriyel ve ekonomik programların düzenlenmesine yardımcı olan merkezi bir bakanlık kurmalıyız."
 JAP_the_modern_ashigaru:0 "Modern Ashigaru"
 JAP_the_modern_ashigaru_desc:0 "Japonya'nın savaş ağaları tarafından ordularındaki samurayları desteklemek için kullanılan ve Muromachi döneminde yaygınlaşan köylü piyadeleri Ashigaru olarak biliniyordu ve belirli bir sadakatleri yoktu. Kendi profesyonel güçlerimizi desteklemek için, köylülerin savaş durumunda devleti savunmakla yükümlü olduğu benzer bir sistemi yeniden kurmaya çalışmalıyız."
 JAP_the_modern_ashigaru_tt:0 "Savaşta §YMilis Toplama§! kararlarının kilidini açar"
 JAP_the_oceanian_soviet:0 "Okyanusya Sovyeti"
 JAP_the_oceanian_soviet_desc:0 "Güney Pasifik Sovyeti kurulduğuna göre, sınırlarımızı daha güneye itmeliyiz. Bu amaçla, bölgeyi işgalimizi haklı çıkarmak için Okyanusya Sovyeti'ni yaratmalıyız."
 JAP_the_pacific_union_of_soviet_socialist_republics:0 "Pasifik Sovyet Sosyalist Cumhuriyetler Birliği"
 JAP_the_pacific_union_of_soviet_socialist_republics_desc:0 "Uğruna çabaladığımız an nihayet geldi. Farklı sovyetleri tek bir birlikte toplayacak yeni bir Asya devletinin yaratıldığını ilan etme zamanı geldi."
 JAP_the_pacific_union_of_soviet_socialist_republics_tt:0 "§YPasifik Sovyet Sosyalist Cumhuriyetler Birliği§! olarak bilineceğiz"
 JAP_the_pan_asian_revolutionary_front:0 "Pan-Asya Devrimci Cephesi"
 JAP_the_pan_asian_revolutionary_front_desc:0 "Çeşitli Asya devrimci partilerine rehberlik etmek için, daha az gelişmiş devletlere direktifler veren ve toplumlarını daha hızlı iyileştirmek için yatırımları koordine edebilecek bir ittifak ve uluslarüstü örgüt kurmalıyız."
 JAP_the_persimmon_has_ripened:0 "Trabzon Hurması Olgunlaştı"
 JAP_the_persimmon_has_ripened_desc:0 "Zaferin meyveleri hızla olgunlaşıyor ve ordumuz müdahale etmeye ve Sibirya'yı çöken [SOV.GetAdjective] İmparatorluğundan almaya tamamen hazır. Savaş hızlı olacak ve zaferlerimiz şanlı olacak. Tennoheika Banzai!"
 JAP_the_shuilikeng_power_plant:0 "Shuilikeng Enerji Santrali"
 JAP_the_shuilikeng_power_plant_desc:0 "Enerji üretimi konusu giderek daha acil hale gelse de Tayvan'daki gelişimimiz planlandığı gibi ilerliyor. Menpaitan Elektrik Santrali gibi hidroelektrik santrallerin inşası bu durumu kısmen hafifletti. Geçmiş mühendislerimizin kitaplarından bir sayfa çıkarıp adanın her yerinde bu barajları ve istasyonları inşa etmeye devam etmeliyiz."
 JAP_the_south_pacific_soviet:0 "Güney Pasifik Sovyeti"
 JAP_the_south_pacific_soviet_desc:0 "Birlik kurulduğuna göre, yeni Sovyet Cumhuriyetleri kurmalı ve onları aramıza almalıyız. Bölgeyi işgalimizi haklı çıkarmak için Güney Pasifik Sovyeti'ni yaratmalıyız."
 JAP_the_spirit_of_the_ikko_ikki:0 "Ikko Ikki Ruhunu Canlandır"
 JAP_the_spirit_of_the_ikko_ikki_desc:0 "Geçmişimizin militarist Jōdo Shinshū Budistleri, keşişlerimizin savaşta korkulması gerektiğini dünyaya kanıtladılar ve inançları sayesinde tapınak ağı, gerektiğinde birliklerin daha verimli ve etkili bir şekilde seferber edilmesini sağladı. Saf topraklara doğru yürürken bu Budist savaşçıların ruhunu sadakatle canlandırmalıyız!"
 JAP_the_spirit_of_the_imperial_nation:0 "İmparatorluk Ulusunun Ruhu"
 JAP_the_spirit_of_the_imperial_nation_desc:0 "Halkımızın dikkatini doğru şeylere yönlendirmek ve [ROOT.GetAdjective] kaderin peşinde koşmaya yönelik sarsılmaz desteklerini sağlamak için, her tapınakta Kokutai'yi tanıtmalı ve [ROOT.GetLeader] Tokyo'daki bir tapınakta kutsamalıyız."
 JAP_the_surrender_broadcast:0 "Teslim Yayını"
 JAP_the_surrender_broadcast_desc:0 "Dünyanın genel eğilimlerini ve İmparatorluğun mevcut durumunu derinlemesine düşündük ve mevcut durumu sona erdirmek için olağanüstü önlemler almaya karar verdik. Savaş durumu mutlaka Japonya'nın avantajına gelişmedi ve bu gerçeği kabul etmeliyiz."
 JAP_the_surrender_broadcast_tt:0 "Barışçıl bir şekilde teslim olursak Ana Adaların kontrolünü elimizde tutma ihtimalimiz daha yüksek olacak"
 JAP_the_ultimate_tank:0 "Nihai Tank"
 JAP_the_ultimate_tank_desc:0 "Mühendislerimiz parlak bir fikirle geldiler. Çok sayıda küçük araç sahaya sürmek yerine, düşmanlarımızı sadece asgari destekle ezebilecek metal devler inşa etmeyi hedeflemeliyiz. İlk taslakları O-I tankı olarak adlandırdıkları bir araç ve bu vizyonu bir an önce gerçeğe dönüştürmek için çalışmaya başlamalıyız."
 JAP_the_ultimate_tank_tt:0 "\n§Y$super_heavy_tank_chassis$§! teknolojisi araştırıldığında:\n"
 JAP_the_uno_school_of_economics:0 "Uno Ekonomi Okulu"
 JAP_the_uno_school_of_economics_desc:0 "Siyasi ve ekonomik teorisyen Kōzō Uno, eski kapitalist modelleri gerçek ekonomik kalkınmaya ve gerçek sosyalizmi getirmek için gereken tesislere nasıl dönüştüreceğine dair teoriler önerdi. Teorilerini gerçeğe dönüştürmeye başlama zamanı geldi."
 JAP_the_uno_school_of_economics_tt:0 "$MODIFIER_CONSUMER_GOODS_FACTOR$ değerimizi her yıl §Y-%2.5§! azaltacak bir görev başlatır"
 JAP_the_war_has_not_necessarily_developed_focus:0 "Doğu Asya Çatışmasına Sıkı Muhalefet"
 JAP_the_war_has_not_necessarily_developed_focus_desc:0 "Ordu-donanma rekabeti hala başımıza belayken ve düşmanlarımıza sert bir darbe vurarak savaşı bitirme stratejimiz başarısız olmuşken, seçeneklerimiz tükenmek üzere gibi görünüyor. Belki de onursuzluğu kucaklamanın ve çatışmasız bir çağ getirmenin zamanı gelmiştir."
 JAP_the_war_has_not_necessarily_developed_focus_tt:0 "Ordunun radikal kısımları, İmparatorun ulusumuzun teslimiyetini yayınlamasını durdurmak için hükümete darbe girişiminde bulunacak."
 JAP_the_yamato_spirit:0 "Yamato Ruhu"
 JAP_the_yamato_spirit_desc:0 "[ROOT.GetAdjective] halkının kalpleri ve zihinleri birdir, toplumumuza nüfuz eden Yamato Ruhu ile birbirine bağlıdır. Tüm vatandaşlarımızın geçmişteki ihtişamımızı bildiğinden ve geleneksel yaşam tarzımıza geri dönmek için ne yapılması gerektiğini bildiğinden emin olmalıyız."
 JAP_to_reach_princess_kaguya:0 "Prenses Kaguya'ya Ulaşmak"
 JAP_to_reach_princess_kaguya_desc:0 "Bambu Kesicisi Masalı'nda, Ay'dan gelen bir prenses olan Kaguya-hime, parlayan bir bambu bitkisinin sapında bebek olarak keşfedilir. Masalın sonunda Kaguya-hime göksel kökenlerini açıklar ve Ay'a döner. Teknoloji artık elimizde olduğuna göre, ona bir kez daha ulaşmak için elimizden gelen her şeyi yapmalıyız."
 JAP_to_rival_the_comintern:0 "Komintern'e Rakip Olmak İçin"
 JAP_to_rival_the_comintern_desc:0 "Troçkistler tarafından Dördüncü Enternasyonal'in kurulmasından bu yana, birçok kişi hem buna hem de Komintern'e karşı bir denge unsuru olacak Beşinci Komünist Enternasyonal'in kurulması çağrısında bulundu. Bu görevi üstlenmeli ve kendimizi devrimin gerçek savunucuları ilan etmeliyiz!"
 JAP_to_rival_zheng_yi_sao:0 "Zheng Yi Sao'ya Rakip Olmak"
 JAP_to_rival_zheng_yi_sao_desc:0 "Zheng Yi Sao, Güney Çin Denizi'nde faaliyet gösteren efsanevi bir Çinli korsan lideriydi ve tarihteki en başarılı kadın korsandı. Büyük İmparatoriçe Nagako adına bu efsaneye layık olmalı ve hatta onu aşmalıyız!"
 JAP_tojos_premiership:0 "Tojo Başbakanlığı"
 JAP_tojos_premiership_desc:0 "Durum şu anki halindeyken, İmparatorluk Japon Ordusu'nu arkasında toplayabilecek, hem sivil hem de askeri bir lider olarak liderlik edebilecek bir Başbakan seçmek hayati önem taşıyacaktır. Bu nedenle, generali Hideki Tōjō ulusu zafere taşımak için seçilecektir."
 JAP_tojos_premiership_tt:0 "Bir Çin Devleti Değil"
 JAP_tokugawa_iesato_focus:0 "Tokugawa Iesato'nun Başbakanlığı"
 JAP_tokugawa_iesato_focus_desc:0 "Lordlar Kamarası Başkanı ve Tokugawa Şogunluğu'nun varisi olan son derece popüler Tokugawa Iesato, yeni anayasamızın kurulmasını zorlayacak yeni bir kabine kurmaya teşvik edilmelidir. Bununla birlikte, artık geçici bir başbakanımız olmayacak ve çatışma başlamadan önceki düzen nihayet yeniden sağlanacak."
 JAP_trans_pacific_influence:0 "Transpasifik Nüfuzu"
 JAP_trans_pacific_influence_desc:0 "Devrim ateşleri dört bir yana yayılıyor ve başarılı kampanyalarımız her yerdeki proletaryaya ilham veriyor. Bölgeyi istikrarsızlaştırmak ve onları beşinci enternasyonale getirmek için okyanusun diğer tarafındaki devrimci grupları finanse etmeye başlamalıyız."
 JAP_trans_pacific_influence_tt:0 "§YKomünist Güney Amerika§! uluslarını ittifakımıza davet etme kararlarının kilidini açar"
 JAP_transformation_of_nature:0 "Doğanın Dönüşümü"
 JAP_transformation_of_nature_desc:0 "Asya, kullanılmayı bekleyen doğal kaynaklar açısından zengindir. Bilim camiamızın daha önce mümkün olduğu düşünülenin sınırlarını zorlamasıyla, en büyük, en istilacı projeler bile uygulanabilir hale geliyor. Çevre, Halkın lehine çalışacak şekilde büyük ölçekte şekillendirilmeli ve kalıba dökülmelidir!"
 JAP_unlock_east_asia_occupation_law_tt:0 "§YAsya§! eyaletlerinde işgal yasasının kilidini açar:\n"
 JAP_unlock_senbu_occupation_law_tt:0 "§YÇin§! eyaletlerinde işgal yasasının kilidini açar:\n"
 JAP_unlocks_pearl_harbor_raid:0 "Kilidi Açılır §YBaskın§!:\n§Y[USA.GetNameWithFlag]§! üzerine Pearl Harbor Saldırısı"
 JAP_unsinkable_aircraft_carriers:0 "Batmaz Uçak Gemileri"
 JAP_unsinkable_aircraft_carriers_desc:0 "Güney Denizi toprakları, Pasifik mücadelesinde uçaklarımızın operasyonu için mükemmel üsler görevi görüyor. Bu adaları takviye etmeli ve bu yerleri tahkim etmeliyiz ki onları tutabilelim, yoksa normal uçak gemileri gibi 'batarlar'."
 JAP_upgrade_the_oriental_development_company:0 "Doğu Kalkınma Şirketini Genişlet"
 JAP_upgrade_the_oriental_development_company_desc:0 "ODC'nin şu anda neredeyse tüm denizaşırı topraklarımızda faaliyet gösteren dokuz aktif şubesi bulunmaktadır. Bölgelerin ilerlemesini hırslarımızı memnun edecek bir yöne yönlendirmede ve endüstriyel ve tarımsal gelişmeleri her şeyden önce verimliliği hedefleyecek şekilde yönlendirmede çok önemli bir rol oynamaktadırlar. Sömürgelerimizi geliştirmek için bu şirketi genişletmeye ve ihtiyaç duyduğu tüm kaynaklara sahip olmasını sağlamaya bakmalıyız."
 JAP_uplift_ainu_revolution_theory:0 "Ainu Devrim Teorisini Yükselt"
 JAP_uplift_ainu_revolution_theory_desc:0 "Siyasi düşünürlerimizin çoğu, lümpen proletaryanın devrimimizin ana gövdesi olduğunu ve Ainu halkının da bu grubun içine dahil olduğunu savunuyor. Ayrıca, Ainu halkının ilkel bir komünist sistemde yaşadığına inanıyorlar ve onları 'Komünist devrimin liderleri' olmaya layık görüyorlar. Bu hareketi daha geniş çapta desteklemeliyiz."
 JAP_uplift_labor_unions:0 "İşçi Sendikalarını Teşvik Et"
 JAP_uplift_labor_unions_desc:0 "İşçi sendikaları halkımızın kendi kendini yönetmesine yardımcı oluyor ve hem iç savaştan önce hem de iç savaş sırasında ordu tarafından hasar gören endüstrileri yeniden inşa etmemize ve onarmamıza yardımcı oluyor. Bu örgütleri, bir gün bir Japon refah toplumu kurana kadar daha da yükseltmeliyiz."
 JAP_utilize_ainu_expertise:0 "Ainu Uzmanlığını Kullan"
 JAP_utilize_ainu_expertise_desc:0 "Kuzey Japonya'ya özgü Ainular, Hokkaido'nun kar ve zorlu arazisinde gezinme konusunda uzmandır. Belki de Sibirya'ya işgalimizi daha hızlı hale getirmek için tekniklerinden öğrenebiliriz?"
 JAP_utilize_our_polish_friendship:0 "Polonya Dostluğumuzu Kullan"
 JAP_utilize_our_polish_friendship_desc:0 "Ulusumuz, Sibirya'ya sürgüne gönderilen insanlarını kabul ettiğimiz Rus İmparatorluğu günlerinden beri Polonyalılarla iyi ilişkilere sahip. O zamandan beri [SOV.GetNameDef] hakkında istihbarat alışverişinde bulunduk ve ulusa karşı ortak bir rekabet sürdürdük. Onlarla bir savunma paktını resmileştirmeliyiz, böylece ikimiz de ayıdan korunduğumuzu hissedebiliriz."
 JAP_war_communism:0 "Savaş Komünizmi"
 JAP_war_communism_desc:0 "1918'den 1921'e kadar Rus İç Savaşı sırasında Sovyet Rusya'da var olan ve savaş komünizmi olarak adlandırdıkları ekonomik ve siyasi sistemin bir versiyonunu benimsemeliyiz. Kontrolü elimizde tutmamızı ve devrimi silah zoruyla Asya'nın geri kalanına getirmek için gerekli kararları almamızı sağlamalıdır."
 JAP_war_communism_new_economy_law:0 "Yeni Ekonomi Yasasının kilidini açar: §Y$JAP_war_communism_idea$§!"
 JAP_women_in_industry:0 "Sanayide Kadınlar"
 JAP_women_in_industry_desc:0 "Çok uzun zamandır kadınların evde kalıp aileyle ilgilenmeleri bekleniyordu. Bir kadın ülkemizin lideri olabiliyorsa, o zaman diğer endüstrilerde de çalışmalarına izin vermek haktır. Bu, iş gücümüzü büyük ölçüde genişleteceği için yalnızca [ROOT.GetNameDef] devletinin ekonomik geleceğine yardımcı olacaktır."
 JAP_wrestle_mongolia_from_the_soviets:0 "Moğolları Sovyet Alanından Çekip Al"
 JAP_wrestle_mongolia_from_the_soviets_desc:0 "Moğollar uzun yıllardır Rusların boyunduruğu altındalar ve kendilerini Avrupalılardan uzaklaştırmak için bir fırsat özlüyorlar. Onlara bu fırsatı sağlayabiliriz ve onları Enternasyonal'e davet etmeliyiz. Ancak bu [SOV.GetNameDef] ile gerilimi artırabilir."
 JAP_wrestle_tuva_from_the_soviets:0 "Tuvalıları Sovyet Alanından Çekip Al"
 JAP_wrestle_tuva_from_the_soviets_desc:0 "Tuvalılar uzun yıllardır Rusların boyunduruğu altındalar ve kendilerini Avrupalılardan uzaklaştırmak için bir fırsat özlüyorlar. Onlara bu fırsatı sağlayabiliriz ve onları Enternasyonal'e davet etmeliyiz. Ancak bu [SOV.GetNameDef] ile gerilimi artırabilir."
 JAP_yamamoto_shot_down_flag:0 " Yamamoto vuruldu ve öldürüldü"
 JAP_yamamotos_premiership:0 "Yamamoto Başbakanlığı"
 JAP_yamamotos_premiership_desc:0 "Durum şu anki halindeyken, İmparatorluk Japon Donanması'nı arkasında toplayabilecek, hem sivil hem de askeri bir lider olarak liderlik edebilecek bir Başbakan seçmek hayati önem taşıyacaktır. Bu nedenle, amiral Isoroku Yamamoto ulusu zafere taşımak için seçilecektir."
 JAP_yasuhito_is_the_current_regent_or_emperor_flag:0 "§YYasuhito§! tahta çıktı"
 JAP_yasuhito_takes_up_the_throne_tt:0 "§YYasuhito§!, İmparatorluk Nüfuzunda §YHirohito§! yerine geçecek"
 JAP_yatagarasus_guidance:0 "Yatagarasu'nun Rehberliği"
 JAP_yatagarasus_guidance_desc:0 "Üç ayaklı karga tanrısı Yatagarasu, insan işlerine ilahi müdahalenin bir parçası olarak Jimmu'ya büyük Yamato ve Nara fethinde rehberlik etti. Bizim de rehberliğe çok ihtiyacımız olduğu için, yeni sistemlerimize bu rehberlik tanrısının adını vermeliyiz."
 JAP_yokosuka_naval_air_technical_arsenal:0 "Yokosuka Donanma Hava Teknik Cephaneliği"
 JAP_yokosuka_naval_air_technical_arsenal_desc:0 "Yokosuka Donanma Hava Teknik Cephaneliği, yeni uçak gemisi filomuz için en modern uçakları sağlamada kilit rol oynayacak. Aichi kokuki, Kyūshū hikoki Kabushiki-kaisha gibi şirketler tarafından seri üretilecek ve Hiro Donanma Cephaneliği'nde monte edilecek daha iyi tasarımlar yaratmaya odaklanacak."
 KHM_call_for_aid:0 "Yardım Çağrısı"
 KHM_call_for_aid_desc:0 "Sheng Shicai'nin güçleri kapımızdayken, çökmemek için vatandaşlarımızdan yardım istemeliyiz."
 KHM_establish_the_kashgar_clique:0 "Kaşgar Kliği'ni Kur"
 KHM_establish_the_kashgar_clique_desc:0 "Daha önce Kuomintang'dan uzaklaşmaya çalışmıştık. Bunu gerçekten başaracaksak, Ma ailesinin kitabından bir sayfa almalı ve kendi kliğimizi kurmalıyız. Bunu gerçeğe dönüştürmenin ve Kaşgar bölgesi Askeri Komutan Yardımcısı Mahmut Muhiti'nin altında toparlanmanın zamanı geldi."
 KHM_established_the_kashgar_clique_flag:0 "§YKaşgar Klikini§! Kurdu"
 KHM_expand_the_madrasas:0 "Medreseleri Genişlet"
 KHM_expand_the_madrasas_desc:0 "Halkımızı daha iyi kontrol etmek ve onlara nasıl yaşamaları gerektiğini öğretmek için, ülkemizde bulunan Müslüman eğitim kurumlarına sağlanan fonları artırmalıyız."
 KHM_implement_jizyah:0 "Cizyeyi Uygula"
 KHM_implement_jizyah_desc:0 "Müslüman olmayanların hakları eski yönetim altında son derece kısıtlayıcıydı. Bu meseleleri modern bir dünyaya uyarlamanın ve tüm tebaamıza aydınlanmış bir diyar olduğumuzu kanıtlamanın zamanı geldi."
 KHM_indian_expeditionary_forces_plan:0 "Hint Sefer Kuvvetleri Planı"
 KHM_indian_expeditionary_forces_plan_desc:0 "[ENG.GetAdjective], düşman bir gücün saldırısına uğramamız durumunda [RAJ.GetNameDef]'den bize askeri yardım gönderecek bir plan önerdi. Belki de onlarla daha yakın ilişkiler kurmak akıllıca olacaktır."
 KHM_indian_expeditionary_forces_plan_tt:0 "§Y[ENG.GetNameDefCap]§! ve §Y[RAJ.GetNameDef]§!'in bize gönüllü gönderme olasılığı artacak"
 KHM_kumul_rebellion_avenged:0 "Kumul İsyanı'nın İntikamı Alındı"
 KHM_kumul_rebellion_avenged_desc:0 "Sheng Shicai ve Sincan Kliği'nin yenilmesiyle artık eyaletin tek yöneticisi konumundayız. Çok adaletsiz bir şekilde bastırılan ilk Kumul İsyanı'nın intikamı nihayet alındı ve artık gözlerimizi eyaleti yeniden inşa etmeye ve bağımsızlığımızın devamını sağlamak için daimi kuvvetlerimizi genişletmeye çevirebiliriz."
 KHM_our_position_remains:0 "Konumumuz Baki"
 KHM_our_position_remains_desc:0 "Savaş tamamen lehimize gelişmemiş olabilir, ancak Hotan kliği hala ayakta ve Yeni 36. Tümen yaklaşan çatışma için her zamankinden daha hazırlıklı."
 KHM_promote_anti_communism:0 "Anti-Komünizmi Teşvik Et"
 KHM_promote_anti_communism_desc:0 "Eğer Sovyet Cumhuriyeti'nin eline düşmeyeceksek, Sheng Shicai ve onun komünist çetesini kovmak en büyük önceliğimizdir. Bu nedenle topraklarımızda kalan tüm komünistleri temizlemeliyiz."
 KHM_promote_jadidism:0 "Ceditçiliği Teşvik Et"
 KHM_promote_jadidism_desc:0 "[SOV.GetNameDef] içindeki Cedit hareketinin bir parçası olan İslami modernist ve reformcular hükümet tarafından aktif olarak bastırılıyor. Buğra'nın kendisinin de aktif bir Ceditçi olması hasebiyle, onlara ulusumuzda sığınma hakkı tanımak ve reformist ideallerinin bir kısmını bize getirmelerine izin vermek akıllıca olacaktır."
 KHM_push_them_back:0 "Onları Geri Püskürt"
 KHM_push_them_back_desc:0 "Sincan ili savaşı onların zaferiyle bitmemeli, onları Sovyetler Birliği'ne kadar geri püskürteceğiz!"
 KHM_raise_additional_dungan_regiments:0 "Ek Dungan Alayları Yetiştir"
 KHM_raise_additional_dungan_regiments_desc:0 "Ordu hala büyük ölçüde komutanlarına mutlak sadakat yemini etmiş Hui halkından oluşuyor. İdeal olmasa da, önümüzdeki yıllarda çok faydalı olacakları için bundan yararlanmalıyız."
 KHM_rally_the_faithful:0 "İnananları Topla"
 KHM_rally_the_faithful_desc:0 "Yabancı devletlere karşı özerkliğimizi garanti altına almayı başarmak için, inananları toplamalı ve başkentimizde yeni bir askeri düzen kurmalıyız."
 KHM_revive_the_basmachi_movement:0 "Basmacı Hareketi'ni Canlandır"
 KHM_revive_the_basmachi_movement_desc:0 "Basmacılar 1934 yılına kadar Orta Asya'yı [SOV.GetAdjective] kuvvetlerinin zalim yönetiminden kurtarmak için mücadele ettiler. Hareketleri o zamandan beri büyük ölçüde ezilmiş olsa da, bazı liderleri kaçmayı başardı. Bu özgürlük savaşçılarıyla temas kurmaya çalışmalı ve onları sarayımıza davet etmeliyiz."
 KHM_shizangs_coup:0 "Shizang'ın Darbesi"
 KHM_shizangs_coup_desc:0 "Yapılan hazırlıklar ve Muhiti'nin kontrolündeki 24. ve 25. Uygur alaylarının Hotan'ı kuşatmak üzere yola çıkmasıyla, hamlemizi yapmaya başlayabilir ve Hui liderliğini şehirden atabiliriz. Mahmut Shizhang'a şan olsun ve çok yaşa Hotan Emirliği!"
 KHM_shizangs_coup_tt:0 "Birçok §YMa Generali§! §RAyrılacak§! ve diğer Ma Kliklerine katılacak"
 KHM_strike_the_governor:0 "Valiyi Vur"
 KHM_strike_the_governor_desc:0 "Birliklerimiz hazır, moralimiz yüksek, Sovyet kuklasını ilimizden kovmak için bu fırsatı değerlendirmeliyiz!"
 KHM_take_control_of_zakat_and_waqf:0 "Zekat ve Vakıfların Kontrolünü Al"
 KHM_take_control_of_zakat_and_waqf_desc:0 "Yeni yönetimimizi finanse etmek için bazı kuralları esnetmemiz ve Hotan'ın zekat ve vakıf hayır kurumlarının kontrolünü ele alarak, yerel türbelerin zenginliğini ders kitaplarına, polis teşkilatına, askerlere ve öğretmenlere yönlendirmemiz gerekebilir."
 KHM_the_sinkiang_ma_clique:0 "Sincan Ma Kliği"
 KHM_the_sinkiang_ma_clique_desc:0 "Sheng Shicai ve Sincan Kliği'nin yenilgisiyle artık eyaletin tek valisi konumundayız. Bölgede daha da güçlü bir güç haline gelmek için konumumuzu sağlamlaştırmalıyız."
 KHM_undermine_kmt_rule:0 "KMT Yönetimini Zayıflat"
 KHM_undermine_kmt_rule_desc:0 "Kuomintang eyaleti yağmaladı ve yerel halka çok uzun zamandır baskı yaptı. Zalim Ma Kliği'ni Hotan'dan atmak için hazırlıklara başlamanın zamanı geldi!"
 KHM_utilize_family_contacts:0 "Aile Bağlarını Kullan"
 KHM_utilize_family_contacts_desc:0 "Sheng Shicai'yi Sincan'dan temelli sürmek için diğer Ma Klikleri ile olan yakın bağlarımızı kullanmalıyız."
 KUM_restore_yettishar:0 "Yettishar'ı Restore Et"
 KUM_restore_yettishar_desc:0 "Sincan ilinin tam kontrolüyle, artık Muhammed Yakub Beg'in hırslarını gerçekleştirmeye ve Kuzeybatı'nın Müslüman eyaletlerini birleştirmeye çalışmalıyız."
 KUM_victory_in_tihwa:0 "Tihwa'da Zafer"
 KUM_victory_in_tihwa_desc:0 "[617.GetName] ilinin düşmesiyle, ildeki konumumuz düzgün bir şekilde sağlamlaştırıldı. Bugün muzaffer duruyoruz, çok yaşa Han!"
 MAN_accepted_japanese_settlers_opm:0 "Yerleşimcilerimizi Kabul Etti"
 MAN_cores_beiyang_tt:0 " §YKuzey Çin§! ve §Yİç Moğolistan§! üzerinde asli eyalet hakkı kazanır"
 MAN_has_completed_claim_the_mandate_of_heaven_focus:0 "§Y$MAN_claim_the_mandate_of_heaven$§! odağını tamamladı"
 MAN_has_completed_mamc_focus_tt:0 "§Y$MAN_mamc$§! odağını tamamladı"
 MAN_kim_il_sung_tt:0 "Belirli Koreli devrimciler savaşa katılmaya teşvik edilebilir"
 MAN_kwantung_army_took_control_flag:0 "Kwantung Ordusu Mançurya'nın kontrolünü ele geçirdi"
 MAN_soviet_volunteers_tt:0 "[SOV.GetFlag] §YSovyetler Birliği§! bize gönüllü göndermeye daha yatkın olacak"
 MAN_tsr_a_new_constitution:0 "Yeni Bir Anayasa"
 MAN_tsr_a_new_constitution_desc:0 "Bir kraliyet diktatörlüğü kimsenin çıkarına değildir. Bunun yerine İmparatora bir miktar güç veren ancak onu demokratik olarak seçilmiş bir hükümetin arkasında sınırlayan bir anayasa hazırlamalıyız."
 MAN_tsr_a_new_dawn_over_manchuria:0 "Mançurya Üzerinde Yeni Bir Şafak"
 MAN_tsr_a_new_dawn_over_manchuria_desc:0 "Zaman geldi. Birliklerimiz hazır ve Japon garnizonları yenilenen isyancı saldırıları altında çöküyor. İşgalcileri kovabileceksek o zaman şimdidir."
 MAN_tsr_a_new_self_strengthening_movement:0 "Kendi Kendini Güçlendirme Hareketi"
 MAN_tsr_a_new_self_strengthening_movement_desc:0 "Kendi Kendini Güçlendirme Hareketi veya Batılılaşma Hareketi, eski İmparatorluğumuzda bir batılılaşma dönemiydi. Amacı, ulusumuzu neredeyse yok eden birkaç krizden sonra öncelikle endüstriyel ve askeri yeteneklerimizi geliştirmekti. Gelecekteki olası felaketleri önlemek için bu modernleşmeyi sürdürmeye çalışmalıyız."
 MAN_tsr_alliance_with_the_kwantung_army:0 "$MAN_alliance_with_the_kwantung_army$"
 MAN_tsr_alliance_with_the_kwantung_army_desc:0 "$MAN_alliance_with_the_kwantung_army_desc$"
 MAN_tsr_ally_bandit_leaders:0 "Haydut Liderleriyle Müttefik Ol"
 MAN_tsr_ally_bandit_leaders_desc:0 "Kwantung Ordusu'nun varlığı, Japonların ülkemiz üzerinde büyük miktarda güç sağlamayı başardığı anlamına geliyor. Ancak bu aynı zamanda, onları topraklarımızdan atmak için silaha sarılmaya istekli hatırı sayılır miktarda insan olduğu anlamına da geliyor. Halkın zaferini sağlamak için bu fırsatı değerlendirmeliyiz."
 MAN_tsr_ally_bandit_leaders_tt:0 "§Y5 piyade§! taburlarıyla 5 birim kazanın.\n"
 MAN_tsr_ally_the_soviet_republic:0 "Sovyet Cumhuriyeti ile Müttefik Ol"
 MAN_tsr_ally_the_soviet_republic_desc:0 "Çin'in geri kalanındaki ÇKP'deki dostlarımız kesinlikle bizimle birleşmek isteyecektir. Birlikte herhangi bir yabancı veya dahili tehdide karşı savaşmakta çok daha yetenekli olacağız."
 MAN_tsr_an_industrial_power:0 "Bir Endüstriyel Güç"
 MAN_tsr_an_industrial_power_desc:0 "Nihayet batıyla rekabet edebilecek bir endüstriyle onu daha da genişletmek için bastırmalıyız. Bununla zaman içinde Asya'nın ve ardından Tüm Dünyanın ana endüstriyel gücü olacağız."
 MAN_tsr_army_modernization:0 "$MAN_army_modernization$"
 MAN_tsr_army_modernization_desc:0 "$MAN_army_modernization_desc$"
 MAN_tsr_assert_our_authority:0 "$MAN_assert_our_authority$"
 MAN_tsr_assert_our_authority_desc:0 "$MAN_assert_our_authority_desc$"
 MAN_tsr_assertiveness:0 "$MAN_assertiveness$"
 MAN_tsr_assertiveness_desc:0 "$MAN_assertiveness_desc$"
 MAN_tsr_bandit_recruitment:0 "Haydut Toplama"
 MAN_tsr_bandit_recruitment_desc:0 "Topraklarımızda dolaşan sözde haydutların çoğu gerçekte Japonya'ya karşı aktif çatışmaya giren gerilla savaşçılarıdır. Japon İmparatorluğu'na karşı bir şansımız olacaksa onlarla ittifak kurmalı ve deneyimlerinden yararlanmalıyız."
 MAN_tsr_bandit_recruitment_tt:0 "§YHaydut Toplama§! kararlarını açar"
 MAN_tsr_beiyang_university:0 "Beiyang Üniversitesi"
 MAN_tsr_beiyang_university_desc:0 "Uygun eğitim olmadan halkımız fırsatlardan yoksun kalacak ve araştırma çabalarımız Çin'in geri kalanının ve ötesindekilerin gerisinde kalacaktır. Bu nedenle eski Beiyang Hükümeti'nin son başbakanı Pan Fu'nun onuruna bir üniversite kurmalıyız."
 MAN_tsr_bolster_nationalism:0 "$MAN_bolster_nationalism$"
 MAN_tsr_bolster_nationalism_desc:0 "$MAN_bolster_nationalism_desc$"
 MAN_tsr_chinese_leadership:0 "$MAN_chinese_leadership$"
 MAN_tsr_chinese_leadership_desc:0 "$MAN_chinese_leadership_desc$"
 MAN_tsr_chinese_leadership_tt:0 "Diğer Çinli kukla yönetimlerini bize katması için [JAP.GetNameDef]'den talepte bulunma kararlarının kilidini açar"
 MAN_tsr_claim_outer_manchuria:0 "Dış Mançurya'yı Talep Et"
 MAN_tsr_claim_outer_manchuria_desc:0 "Dış Mançurya'nın Ruslara kaybedilmesi, bugüne kadar Mançurya milliyetçilerinin yan tarafında hala bir dikendir. Bu toprakları geri alarak ve yeni doğan Mançurya Ulusu'na yeniden entegre ederek bu tarihi yanlışı düzeltmeye çalışmalıyız."
 MAN_tsr_claim_the_mandate_of_heaven:0 "$MAN_claim_the_mandate_of_heaven$"
 MAN_tsr_claim_the_mandate_of_heaven_desc:0 "$MAN_claim_the_mandate_of_heaven_desc$"
 MAN_tsr_collective_farms:0 "$MAN_collective_farms$"
 MAN_tsr_collective_farms_desc:0 "$MAN_collective_farms_desc$"
 MAN_tsr_depose_puyi:0 "Puyi'yi Devir"
 MAN_tsr_depose_puyi_desc:0 "Puyi bir figüran olarak amacına hizmet etti ama şimdi sadece gerçek demokrasiye bir engel teşkil ediyor. Bir hükümdarın altında olmak sadece devletimizi ortaçağ aristokrasi ve soyluluk kavramlarına hapsetmeye hizmet edecektir. Bu nedenle onu pozisyonundan uzaklaştırmak zorunludur."
 MAN_tsr_develop_aluminum_sources:0 "$MAN_develop_aluminum_sources$"
 MAN_tsr_develop_aluminum_sources_desc:0 "$MAN_develop_aluminum_sources_desc$"
 MAN_tsr_division_of_power:0 "Güçler Ayrılığı"
 MAN_tsr_division_of_power_desc:0 "Anayasanın hazırlanmasıyla artık yürürlüğe girecek ve askeri ve kraliyet diktatörlükleri gibi barbarca yönetim biçimlerinin lekesi geçmişte kalacak. Çin imparatorluğu sadece güçlüler ve kudretliler için değil, herkes için bir devlet olacak."
 MAN_tsr_embrace_state_shintoism:0 "Devlet Şintoizmini Benimse"
 MAN_tsr_embrace_state_shintoism_desc:0 "Devlet Şintosu, milyonları davaya seferber etmeyi başararak Japon İmparatorluğu'na iyi hizmet etti. Başlangıçta direnişle karşılaşsa bile, bunu kendi topraklarımızda taklit etmeye çalışmalıyız."
 MAN_tsr_embrace_state_shintoism_tt:0 "§Y$MAN_state_shintoism_dm$§! Milli Ruhunu geliştirmek için kararları açar"
 MAN_tsr_empire_of_manchukuo:0 "Mançukuo İmparatorluğu"
 MAN_tsr_empire_of_manchukuo_desc:0 "Mançukuo veya resmi olarak bilindiği şekliyle Büyük Mançurya İmparatorluğu hiçbir şekilde bir dünya gücü değildir, ancak yine de Büyük Doğu Asya manzarasında kendimize yer açmayı başardık. Bu konumu korumaya çalışmalı, sahte büyük servet ve şan vaatlerine kanmamalı, bunun yerine bu dünyadaki rolümüzü bulmaya çalışmalıyız."
 MAN_tsr_empower_the_legislative_council:0 "$MAN_empower_the_legislative_council$"
 MAN_tsr_empower_the_legislative_council_desc:0 "$MAN_empower_the_legislative_council_desc$"
 MAN_tsr_expand_showa_steel_works:0 "$MAN_expand_showa_steel_works$"
 MAN_tsr_expand_showa_steel_works_desc:0 "$MAN_expand_showa_steel_works_desc$"
 MAN_tsr_expand_the_imperial_guards:0 "$MAN_expand_the_imperial_guards$"
 MAN_tsr_expand_the_imperial_guards_desc:0 "$MAN_expand_the_imperial_guards_desc$"
 MAN_tsr_expand_the_imperial_guards_tt:0 "$MAN_expand_the_imperial_guards_tt$"
 MAN_tsr_expand_the_navy:0 "Mançukuo İmparatorluk Donanmasını Genişlet"
 MAN_tsr_expand_the_navy_desc:0 "Denizlerdeki destekleri için Japonlara güvenmek zorunda kalsak da, sadece bir nehir donanmasına sahip olmaktan fazlasına yatırım yapmak akıllıca olacaktır. Amiral gemimiz Hai Wei'nin önderliğinde ve müttefiklerimizle sıkı bir işbirliği içinde, topraklarımızı denizden işgal etme veya yağmalama girişimlerine karşı durabileceğiz."
 MAN_tsr_expand_the_railways:0 "$MAN_expand_the_railways$"
 MAN_tsr_expand_the_railways_desc:0 "$MAN_expand_the_railways_desc$"
 MAN_tsr_expand_the_textile_industry:0 "$MAN_expand_the_textile_industry$"
 MAN_tsr_expand_the_textile_industry_desc:0 "$MAN_expand_the_textile_industry_desc$"
 MAN_tsr_expand_xingan_army:0 "Xing'an Ordusunu Genişlet"
 MAN_tsr_expand_xingan_army_desc:0 "Xing'an Ordusu, ordumuz içinde önemli bir güçtür. Gelecek muharebelerde başarılı olacaksak onu genişletmek akıllıca olacaktır."
 MAN_tsr_finish_off_the_japanese_threat:0 "Japon Tehdidini Bitir"
 MAN_tsr_finish_off_the_japanese_threat_desc:0 "Orijinal işgalcilerimiz Japonlar çok uzun zamandır serbest bırakıldı. Maskaralıklarına bir son vermenin ve Asya'yı yönetme hakkına hangi devletin sahip olduğunu göstermenin zamanı geldi."
 MAN_tsr_first_five_year_plan:0 "$MAN_first_five_year_plan$"
 MAN_tsr_first_five_year_plan_desc:0 "$MAN_first_five_year_plan_desc$"
 MAN_tsr_five_equal_peoples:0 "$MAN_five_equal_peoples$"
 MAN_tsr_five_equal_peoples_desc:0 "$MAN_five_equal_peoples_desc$"
 MAN_tsr_five_people_armies:0 "$MAN_five_people_armies$"
 MAN_tsr_five_people_armies_desc:0 "$MAN_five_people_armies_desc$"
 MAN_tsr_five_people_armies_tt:0 "$MAN_five_people_armies_tt$"
 MAN_tsr_further_mobilization:0 "Seferberlik Çabaları"
 MAN_tsr_further_mobilization_desc:0 "Hiç askerimiz olmadan bir ordumuz olmayacak. Hesaba katılması gereken bir orduyu sahaya sürebilmek için daha fazla seferberlik ve eğitim için bastırmalıyız."
 MAN_tsr_hoankyoku:0 "$MAN_hoankyoku$"
 MAN_tsr_hoankyoku_desc:0 "$MAN_hoankyoku_desc$"
 MAN_tsr_imperial_divinity:0 "$MAN_imperial_divinity$"
 MAN_tsr_imperial_divinity_desc:0 "$MAN_imperial_divinity_desc$"
 MAN_tsr_imperial_university:0 "$MAN_imperial_university$"
 MAN_tsr_imperial_university_desc:0 "$MAN_imperial_university_desc$"
