 PRC_sea_prepare_for_war_with_japan_desc:0 "$PRC_prepare_for_war_with_japan_desc$"
 PRC_sea_proclaim_the_peoples_republic:0 "$PRC_proclaim_the_peoples_republic$"
 PRC_sea_proclaim_the_peoples_republic_desc:0 "$PRC_proclaim_the_peoples_republic_desc$"
