 CHI_sea_battle_for_china:0 "Çin İçin Muharebe"
 CHI_sea_battle_for_china_desc:0 "Merkezi Hükümetin doğru parti çizgisinden giderek daha fazla sapmasıyla, ilerlemenin tek yolunun kontrolü geri almak olduğu giderek daha belirgin hale geliyor. Başkente kadar savaşmalı ve onu bizi başarısızlığa uğratan devletten ele geçirmeliyiz."
 CHI_sea_brigade_specialization:0 "Tugay Uzmanlaşması"
 CHI_sea_brigade_specialization_desc:0 "Çoğu göreve uygun bir orduya sahip olmak işgalcilere karşı zaferimiz için temel olsa da, bir dereceye kadar uzmanlaşmaya odaklanmamız da zorunludur."
