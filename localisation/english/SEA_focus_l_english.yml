l_english:
 CHI_SINAW_primacy:0 "$CHI_sinaw_organization_sea$ Önceliği"
 CHI_SINAW_primacy_desc:0 "SINAW, CAMCO'nun sunamadığı teknik yenilikler sunuyor. Genişlemelerine yatırım yapmak bizi yabancı güçlerle eşitliğe yaklaştırıyor."
 CHI_VTOL_experiments:0 "VTOL Deneyleri"
 CHI_VTOL_experiments_desc:0 "Dikey kalkış yapan uçaklar öngörülemeyen arazilerde esneklik vaat ediyor. Modern savaştaki rollerini değerlendirmek için denemelere başlayacağız."
 CHI_a_brotherhood_for_china:0 "Çin İçin Bir Kardeşlik"
 CHI_a_brotherhood_for_china_desc:0 "Mavigömlekliler Cemiyeti birçoklarına göre barışı bozan bir grup zorbadır. Ancak lideri Dai Li, bunu bir kardeşlik olarak tasavvur ediyor ve bu, birliği teşvik etmek için alabileceğimiz bir bakış açısıdır."
 CHI_a_burgeoning_welfare_state:0 "Gelişen Bir Refah Devleti"
 CHI_a_burgeoning_welfare_state_desc:0 "Halkına bakan bir devlet, eşsiz bir güç ve dayanıklılık taşır. Fanatizme düşmeden önceki Almanlardan ilham alarak, daha adil bir geleceğe giden yola başlayacağız."
 CHI_a_chapter_in_every_village:0 "Her Köyde Bir Şube"
 CHI_a_chapter_in_every_village_desc:0 "Mavigömleklilerimiz şehirlerde başarı elde etti, ancak genel nüfusun çoğunluğu kırsalda yaşıyor. Örgütü her kasabada, köyde ve mezrada temsil edilecek şekilde genişletmemiz gerekiyor."
 CHI_a_control_yuan_with_teeth:0 "Dişli Bir Kontrol Yuanı"
 CHI_a_control_yuan_with_teeth_desc:0 "Güç yozlaştırır, bu yüzden politikacılarımızı dürüst tutacak bir şeye ihtiyacımız var. Chiang Kai-Shek yönetiminde bununla görevli örgüt etkisiz hale getirildi. Örgütü, görevini sonuna kadar yerine getirebilmesi için yeniden inşa edeceğiz."
 CHI_a_functioning_bureaucracy_first:0 "Önce İşleyen Bir Bürokrasi"
 CHI_a_functioning_bureaucracy_first_desc:0 "Devlet aygıtının kontrolü büyük önem taşısa da, ortada bir devlet yoksa anlamsızdır. Kurumlara bir ölçüde özyönetim izni vermek ve doğru insanların doğru fikirler yerine liyakate dayalı olarak yükselmesini teşvik etmek uzun vadede bize fayda sağlayacaktır."
 CHI_a_generalissimo_for_all_of_china:0 "Tüm Çin İçin Bir Generalissimo"
 CHI_a_generalissimo_for_all_of_china_desc:0 "Yabancı işgalciye karşı mücadelemiz bir deri hastalığıydı, ancak iç tehdidimiz her zaman bir kalp hastalığıydı. Geleceği hayal edebilmemiz için artık ele aldığımız bir hastalık."
 CHI_a_matter_of_will:0 "Bir İrade Meselesi"
 CHI_a_matter_of_will_desc:0 "Çin yabancı fikirlerden yararlanabilir, ancak tarihimizle birlikte izlememiz gereken kendi yolumuz var. Köy okullarımızda bir temel oluşturarak başlamalı ve birliği sıfırdan inşa etmeliyiz."
 CHI_a_new_middle_kingdom:0 "Yeni Bir Orta Krallık"
 CHI_a_new_middle_kingdom_desc:0 "Önceki çağlarda dünyanın etrafında döndüğü nokta bizdik. Bu bizi dünyadan izole etti ve çağların bizi geçip gitmesine neden oldu. Bu hatayı bir daha yapmayacağız ve bu sefer kendi kaderimizin ve başkalarınınkinin yapıcısı biz olacağız."
 CHI_a_party_unified:0 "Birleşmiş Bir Parti"
 CHI_a_party_unified_desc:0 "Disiplin, ahlak ve erdem yoluyla partimiz içinde birliği sağladık. Küçük çekişmeler ve bölünmeler geride kaldı ve mavi sancak ve beyaz güneş altında ilerliyoruz. Hem iç hem de dış tüm düşmanlara karşı nihai zafere doğru ileri!"
 CHI_a_party_unified_tt:0 "§RLiangguang Olayı sırasında Chiang Kai-Shek'i Guangzhou'ya göndermek daha erken ölümüyle sonuçlanacaktır.§!"
 CHI_a_popular_movement:0 "Popüler Bir Hareket"
 CHI_a_popular_movement_desc:0 "Tarihimizde yeni bir sayfa yeni bir organizasyon gerektirir. Herkes, halk olarak eski toplumun üzerinden geçen ve her üyeyi bu büyük bütünün bir parçası yapan bir dalga olduğumuzu bilecek."
 CHI_a_popular_movement_trigger:0 "§YSilahlı Kuvvetlerde Yolsuzluk§! Zorunlu Askerlik Faktörü §Y0%§!'den daha fazladır"
 CHI_a_wind_that_rises_in_the_daytime_lasts_long:0 "Gündüz Yükselen Rüzgar Uzun Sürer"
 CHI_a_wind_that_rises_in_the_daytime_lasts_long_desc:0 "Gün ışığında sürekli bombalama, hava savaşına istikrarlı, metodik bir yaklaşım sunar. Etkili darbeler indirmek için görünürlükten ve koordinasyondan yararlanmalıyız."
 CHI_a_world_freed_from_communism:0 "Komünizmden Kurtulmuş Bir Dünya"
 CHI_a_world_freed_from_communism_desc:0 "Faşizm dünyayı ateşe verdi, ancak insanlığı tehdit eden tek ideoloji o değil. Kendi ülkemizde başlattığımız görevi bitirmeli ve bu dünyayı kötü düşüncelerden arındırmalıyız!"
 CHI_accelerate_the_tutelage:0 "Vesayeti Hızlandır"
 CHI_accelerate_the_tutelage_desc:0 "KMT, Xinhai devriminin ve ardından Dr. Sun'ın vaatlerini yerine getiremedi. Halka demokrasiyi öğretmek yerine onları kişisel çıkarları için sömürdüler. Kayıp zamanı telafi etmemiz gerekiyor."
 CHI_accelerate_the_tutelage_tt:0 "§YÇin Kırsalı§! genelinde halkın §YSiyasi Vesayetini Hızlandırma§! kararlarının kilidini açar"
 CHI_administer_cooperatives:0 "Kooperatifleri Yönet"
 CHI_administer_cooperatives_desc:0 "Kooperatiflerin doğası hızlı büyüyüp yayıldıkları, ancak genellikle izole çalıştıkları anlamına geliyordu. Milli bir ofis, [ROOT.GetName] genelinde kooperatif ağlarını koordine edecek ve destekleyecektir."
 CHI_aeronautical_expertise:0 "Havacılık Uzmanlığı"
 CHI_aeronautical_expertise_desc:0 "Çinli havacılar pasifik'in diğer tarafında hak ettikleri üne kavuştular. Uzmanlıklarından yararlanmak için onları eve çağırabiliriz."
 CHI_affirm_civilian_primacy:0 "Sivil Üstünlüğünü Doğrula"
 CHI_affirm_civilian_primacy_desc:0 "Chiang gücünü ordunun sırtına inşa etti, ancak subayların zihinlerinin kolayca yönlendirilebileceğini biliyoruz, bunların çok azı bize fayda sağlıyor. Silahlı kuvvetlerin sivil kontrole tabi olduklarını anladığından emin olmalıyız."
 CHI_air_shortcut:0 "Hava Kuvvetleri"
 CHI_allocate_lend_lease:0 "Ödünç Verme ve Kiralama Tahsis Et"
 CHI_allocate_lend_lease_desc:0 "Şu anda Çin'de birkaç güç merkezi var, ancak ulusu yurtdışında sadece biri temsil ediyor. Kimin destek alacağına ve dolayısıyla kimin nüfuz sahibi olacağına karar vermek için bu avantajı kullanabiliriz."
 CHI_allocate_lend_lease_tt:0 "§YPiyade Teçhizatı§! kullanarak Savaş Ağası Bağlı Devletlerinin Özerkliğini azaltma kararlarının kilidini açar"
 CHI_allow_warlord_support_tt:0 "Savaş ağalarına yapılacak iyilikler karşılığında ittifak nüfuzu kazanma kararlarını açar"
 CHI_ally_the_young_china_party:0 "Genç Çin Partisi ile Müttefik Ol"
 CHI_ally_the_young_china_party_desc:0 "Genç Çin Partisi, 2 Aralık 1923'te Paris'te bir grup Çinli öğrenci tarafından kuruldu ve KMT ve ÇKP'den sonra ülke içindeki en önde gelen küçük hareket oldu. Geleceğimiz için iyi fikirler tasavvur ettiler, bunları görmezden gelemeyiz. Onlarla hemen müttefik olmalıyız!"
 CHI_an_alternative_rooted_in_tradition:0 "Geleneğe Köklü Bir Alternatif"
 CHI_an_alternative_rooted_in_tradition_desc:0 "Liberalizm ve komünizm, [ROOT.GetAdjective] ulusunda hiçbir anlamı olmayan yabancı kavramlardır. Sadece kendi yapımımız olan bir şey kıyılarımıza refah ve gurur getirebilir."
 CHI_an_alternative_rooted_in_tradition_tt:0 "[PRC.GetNameDefCap] için sızma maliyetini: §G+%25§! artırır"
 CHI_an_appropriate_design:0 "Uygun Bir Tasarım"
 CHI_an_appropriate_design_2_tt:0 "Eğer §Y$CHI_controlling_our_skies$§! alınmışsa:\n "
 CHI_an_appropriate_design_3_tt:0 "Eğer §Y$CHI_projecting_power$§! alınmışsa:\n "
 CHI_an_appropriate_design_desc:0 "Uçaklarımız doktrinimizle eşleşmelidir. Menzil veya dayanıklılık için olsun, operasyonel ihtiyaçlarımıza uyan tasarımları takip edeceğiz."
 CHI_appear_where_you_are_not_expected:0 "Beklenmediğin Yerde Görün"
 CHI_appear_where_you_are_not_expected_desc:0 "Hiçbir başarılı komutan düşmana beklediği yerde ve şekilde saldırmamıştır. Aldatma savaşın temelidir ve güçlü olduğumuzda zayıf, zayıf olduğumuzda güçlü görünmeliyiz."
 CHI_apply_yandas_work:0 "Yanda'nın Çalışmalarını Uygula"
 CHI_apply_yandas_work_desc:0 "Deng her zaman kitleleri harekete geçirmek ve kırsal nüfusa bir alternatif sunmak istedi. Sözü köyden köye yaymak örgütümüzü ve bir bütün olarak ülkeyi güçlendirecektir."
 CHI_apply_yandas_work_tt:0 "Hem §YKırsal hem de Kentsel Siyasi Vesayet§! kararlarının maliyetini §G10§! azaltır"
 CHI_appoint_sympathetic_judges:0 "Sempatizan Yargıçlar Ata"
 CHI_appoint_sympathetic_judges_desc:0 "Kilit pozisyonlardaki Yargıçlarla gücümüzü aşağıya ve dışarıya, illere kadar genişletebileceğiz."
 CHI_appoint_sympathetic_judges_tt:0 "Gelecekteki her Savaş Ağası Bağlı devleti kukla yapıldığında aşağıdaki ruhu alacak:"
 CHI_armoured_car_tactics:0 "Zırhlı Araç Taktikleri"
 CHI_armoured_car_tactics_desc:0 "Çoğu ordu, endüstriyel güç yarışında giderek daha ağır zırhlı birimler alıyor. Ancak, bir bıçağa ihtiyaç duyulduğunda baltayla daha verimli olunmaz."
 CHI_army_shortcut:0 "Ordu"
 CHI_arrest_the_seven_gentlemen:0 "Yedi Beyefendiyi Tutukla"
 CHI_arrest_the_seven_gentlemen_desc:0 "Çin'de Japon saldırganlığına katılan çok az kişi olsa da, bununla başa çıkma yöntemi bölücü bir sorudur. Yönetimimize rekabet edilmesine izin veremeyiz ve bu nedenle bu konulardaki üstünlüğümüzü göstermeliyiz."
 CHI_avoid_another_crisis:0 "Başka Bir Krizden Kaçın"
 CHI_avoid_another_crisis_desc:0 "1931'de hazırlıksızdık ve [JAP.GetAdjective] ordusu tarafından gafil avlandık. Yarım on yıl geçmiş olmasına rağmen onları geri püskürtmeye hazır değiliz ve o değerli kaynaktan, zamandan daha fazlasını elde etmeliyiz. [JAP.GetAdjective] güçlerini yatıştırmak için sembolik tavizler verebilir ve doğudan gelecek kaçınılmaz fırtınaya hazırlanmamızı sağlayabiliriz."
 CHI_avoid_another_crisis_tt:0 "\nTavizler vererek Japon işgalini geciktirme seçenekleri sunacaktır."
 CHI_ban_immoral_entertainment:0 "Ahlaksız Eğlenceyi Yasakla"
 CHI_ban_immoral_entertainment_desc:0 "Çökmüş eğlence biçimleri kıyılarımıza yayıldı ve ahlaki dokumuzu kirletti. Bunları daha atletik ve sanatsal yerel biçimler lehine yasaklamalı ve bunu uygulamak için görev güçleri kurmalıyız."
 CHI_battleship_focus:0 "Zırhlı Odaklanması"
 CHI_battleship_focus_desc:0 "Denizlerin ilk büyük devinin inşasını açarken, ulusumuzun büyük Babasını kutlamak sadece doğru ve yerindedir."
 CHI_bog_them_down_in_the_centre:0 "Onları Merkezde Bataklığa Sapla"
 CHI_bog_them_down_in_the_centre_desc:0 "[JAP.GetNameDef] devletini sınırda durduramayacağımızı ve başka bir savunma hattını dikkatle seçmemiz gerektiğini biliyoruz. Yangtze nehri çevresinde merkezlenmek, saldırganları durdurmanın ve bölgeyi tüm savunmamızın dayanak noktası yapmanın etkili bir yolu olacaktır. Ancak, savunmamızı belirli alanlar için planlama eylemi daha da ileri gider."
 CHI_bog_them_down_in_the_centre_modify:0 "§Y$CHI_bog_them_down$§! bonusunu şu şekilde değiştirecek: "
 CHI_bring_the_revolution_further:0 "Devrimi Daha İleri Taşı"
 CHI_bring_the_revolution_further_desc:0 "Kurtuluş yolumuz düşündüğümüzden daha ileriye gidiyor. Özgürlük ışığını pasifik boyunca yayacağız ve sömürgecileri daha da geri püskürteceğiz."
 CHI_bring_the_revolution_further_tt:0 "§Y$Australia$: §! içinde sömürge devletlerini kontrol eden veya kuklaları olan herkese karşı savaş hedefleri kazanacağız"
 CHI_bring_the_revolution_further_tt_2:0 "İttifak manifestomuz ayrıca §Y$Australia$ §! içerecek\n§Y$Australia$ §! çevresinde kukla hükümetler kurma kararlarının kilidini açar"
 CHI_bring_the_war_home:0 "Savaşı Eve Getir"
 CHI_bring_the_war_home_desc:0 "Düşmanlarımız topraklarının hiçbir parçasının erişilemez olmadığını öğrenmelidir. Hedefli bombalama ve psikolojik savaşla derinlere inecek ve düşmanın savaşma isteğini bozacağız."
 CHI_bring_the_war_home_tt:0 "Aşağıdaki baskınların kilidini açar:\n[GetHuangshenRaidTooltip]\n[GetTokyoImperialPalaceTooltip]\n[GetNationalDietTooltip]\n[GetHakkoIchiuTooltip]"
 CHI_bring_the_wayward_back_into_the_fold:0 "Yoldan Çıkanları Yuvaya Geri Getir"
 CHI_bring_the_wayward_back_into_the_fold_desc:0 "Xinhai devriminden bu yana kardeşlerimizden bazıları yanlış yönlendirildi ve yoldan çıkarıldı. Kolektiften ayrı olmanın daha iyi olacağı söylendi. Bunu geri çevirmenin ve onları yuvaya geri getirmenin zamanı geldi."
 CHI_burma_campaign:0 "Burma Harekatı"
 CHI_burma_campaign_desc:0 "Müttefiklerimiz zorlanıyor. [JAP.GetNameDefCap] derinlere indi ve şimdi Burma'nın bazı kısımlarını kontrol ediyor. Düşman için sadece bir dikkat dağıtıcı olmadığımızı, aynı zamanda öldürücü darbeyi indirecek güvenilir bir müttefik olduğumuzu göstereceğiz."
 CHI_burma_campaign_trigger:0 "[BRM.GetName] topraklarından en az birini bir düşmana kaybetti"
 CHI_but_a_night_breeze_soon_falls:0 "Ama Gece Esintisi Çabuk Diner"
 CHI_but_a_night_breeze_soon_falls_desc:0 "Gece operasyonları riskli olabilir, ancak gelişmiş eğitimle pilotlarımız karanlığın örtüsü altında kayıpları en aza indirebilir. Düşman geldiğimizi asla görmeyecek..."
 CHI_camco_primacy:0 "$CHI_camco_organization_sea$ Önceliği"
 CHI_camco_primacy_desc:0 "CAMCO, hava gelişimi için en iyi yerli ortağımızı temsil ediyor. Yeteneklerine öncelik vermek, üretimin hırsa ayak uydurmasını sağlayacaktır."
 CHI_censure_the_opposition:0 "Muhalefeti Kına"
 CHI_censure_the_opposition_desc:0 "Kontrol Yuanı zaten zayıf, ancak onu tamamen kontrol edersek istenmeyen unsurları düzeltebiliriz. Uygun davranış hakkında geri bildirim vermek düzeltici bir önlem olarak işe yarayacaktır."
 CHI_central_steel_and_machine_works:0 "Merkezi Çelik ve Makine İşleri"
 CHI_central_steel_and_machine_works_desc:0 "Çelik endüstrilerimiz için derinlemesine temeldir ve şimdiye kadar uygun üretimden yoksunduk. Kaynaklar bize açık olmasına rağmen, sadece Milli Kaynaklar Komisyonu'ndan gelen planı uygulamamız gerekiyor."
 CHI_championing_the_cause_of_liberty:0 "Özgürlük Davasının Savunuculuğu"
 CHI_championing_the_cause_of_liberty_desc:0 "Asya'ya özgürlük ışığını getirdik ve özgürlüklerine ve kendi kaderlerini tayin haklarına değer veren herkes için bir meşale olarak duruyoruz."
 CHI_china_reborn:0 "Çin Yeniden Doğdu"
 CHI_china_reborn_desc:0 "Eski fikirler sadece emperyalistler tarafından sömürülmemize yol açtı. Temel bir rota değişikliğine ihtiyaç var. Toplumumuzu yeni bir ideolojiyle yeniden şekillendirmeliyiz. Yeni Yaşam Hareketi olarak adlandıracağımız bir dizi kampanya başlatacağız."
 CHI_clear_out_sycophants:0 "Dalkavukları Temizle"
 CHI_clear_out_sycophants_desc:0 "Bir tiran evet efendimci yetiştirir ve ne kadar uzun süre hüküm sürerse, onlardan o kadar çok olur. Yasama ve yürütme kontrolünü ismen elimizde tutsak da, hala eski fikirlere bağlı çok sayıda adam var. Eski rejimden yararlananların hak ettikleri yere konulmasını sağlamak için ortak bir çaba göstermeliyiz."
 CHI_close_whampoa:0 "Whampoa'yı Kapat"
 CHI_close_whampoa_desc:0 "Whampoa'nın her zaman Chiang'ın kişisel beyliği ve ideolojik eğilimleri için bir üreme alanı olduğu biliniyordu. Varlığını sürdürmesine izin verilmesi imkansız bir kurumdur ve bu yüzden onu kapatacağız ve onunla bağlantısı olduğu bilinen herkesi kınayacağız."
 CHI_close_whampoa_tt:0 "Kalan her general şunları kazanacak: §G+3§! rastgele atanmış istatistik."
 CHI_co_opt_the_koh_hsin_movement:0 "Koh-hsin Hareketini Benimse"
 CHI_co_opt_the_koh_hsin_movement_desc:0 "Parti çok bürokratik ve yozlaşmış hale geldi ve çürük unsurları temizlememiz gerekiyor. Daha güçlü bir çizgi sadece faydalı değil, aynı zamanda milli bekamız için de hayati önem taşıyor!"
 CHI_co_opt_the_koh_hsin_movement_tt:0 "Komünist karşı sızma maliyetini §G%25§! azaltır"
 CHI_coastal_defence:0 "Kıyı Savunması"
 CHI_coastal_defence_desc:0 "Su altı filomuzdaki alan kullanımını optimize etmek daha küçük, daha hızlı denizaltılar anlamına gelir. Yine de ranzalar... veya diğer olanaklar gibi birkaç gereksiz şeyi kaldırmak zorunda kaldık."
 CHI_coastal_forts:0 "Denize Karşı Bir Duvar"
 CHI_coastal_forts_desc:0 "Yabancı işgalciler ve kuklaları önce kuzeyden saldıracak olsa da, sonunda denizden de saldıracaklarından emin olabiliriz. Topraklarımıza ayak basmaya cüret ettikleri anda onları denize geri atmaya hazır olacağız."
 CHI_collaborate_with_allied_forces:0 "Müttefik Kuvvetlerle İşbirliği Yap"
 CHI_collaborate_with_allied_forces_desc:0 "[JAP.GetAdjective] tehdidine karşı uzun ve zorlu bir mücadele verdik, ancak artık yalnız değiliz. Çabalarımızı koordine edebilmek için her iki silahlı kuvvetimizi daha da entegre etmeli ve nihai zafere ulaşmalıyız."
 CHI_collaborate_with_allied_forces_tt:0 "Tümenler oluşturacak X ve Y Kuvvetlerini Oluşturma Kararlarının kilidini açar."
 CHI_commemorate_the_labour_corps:0 "İşçi Kolordusunu An"
 CHI_commemorate_the_labour_corps_desc:0 "Halkımız denizaşırı ülkelere gitti ve ulusumuzun tanınması için çalıştı, büyük savaşın savaş alanlarında gayret gösterdi. [ENG.GetAdjective] ve [FRA.GetAdjective] onları hatırlamasa da, biz hatırlıyoruz ve anılarını yükselterek ve öğrendiklerini kalbimize alarak çalışmalarını onurlandıracağız."
 CHI_concerted_push:0 "Kararlı Atılım"
 CHI_concerted_push_desc:0 "Çin halkı, zorluklar karşısında uyum yeteneğini defalarca göstermiştir. Bu durum farklı değil. Liderliğimiz, büyük güçlere rakip olacak bir donanmaya ihtiyaç duyulduğunu ilan etti ve ekonomimiz bu zorluğun üstesinden gelecektir."
 CHI_conserve_our_pilots:0 "Pilotlarımızı Koru"
 CHI_conserve_our_pilots_desc:0 "Pilotlar kolayca değiştirilemez. Riskleri azaltarak ve hayatta kalma oranını artırarak, deneyimi korur ve savaş gücünü sürdürürüz."
 CHI_construct_the_banqiao_dam:0 "Banqiao Barajını İnşa Et"
 CHI_construct_the_banqiao_dam_desc:0 "Güçlü nehirlerimiz topraklarımızı tanımlayan şeydir ve onları kontrol etmek medeniyetimiz için temel olmuştur. Gelecekte, bu nehirler ulusumuzun büyümesine ve büyüklüğüne güç verecektir."
 CHI_continue_the_ding_xian_experiment:0 "Ding Xian Deneyine Devam Et"
 CHI_continue_the_ding_xian_experiment_desc:0 "Kırsal Yeniden Yapılanmada Ding Xian projesi şimdiye kadar James Yen'in Kitle Eğitim Hareketi tarafından desteklendi. Bir sosyal laboratuvar olarak kullanılarak Çin köyünde yaşam standardını, sağlığı, siyasi sorumluluğu ve kültürü yükseltmenin yollarını geliştirdi ve gösterdi. Kırsala modernleşme getirmek için bu programı finanse etmeliyiz."
 CHI_continue_the_ding_xian_experiment_tt:0 "\n§YElektrifikasyon ve Kitle Eğitimi§!, zaman ilerledikçe §YHebei ve Hunan§! bölgelerinden dışarı doğru yayılmaya başlayacak ve her iki ayda bir yeni bir ana eyalet bu etkeni kazanacak."
 CHI_controlling_our_skies:0 "Göklerimizi Kontrol Etmek"
 CHI_controlling_our_skies_desc:0 "Yurtdışına hükmetmeden önce, yurtiçinde göklere hükmetmeliyiz. Disiplinli bir hava savunma ağı, milli güvenliğin omurgasıdır."
 CHI_coordinate_with_the_army:0 "Ordu ile Koordine Ol"
 CHI_coordinate_with_the_army_desc:0 "Zafer silahların birliğinden gelir. Hava ve kara kuvvetlerimiz tek bir görev için tek bir zihinle hareket etmelidir."
 CHI_correct_a_historical_wrong:0 "Tarihi Bir Yanlışı Düzelt"
 CHI_correct_a_historical_wrong_desc:0 "Avrupalıların dünyaya uyguladığı muamele adaletsizliğin ötesindedir ve insanlık medeniyeti dokusunda bir lekedir. Bu yanlışı düzelteceğiz ve onları suçları için cezalandıracağız."
 CHI_crack_down_on_illicit_goods:0 "Yasadışı Mallara Baskın Yap"
 CHI_crack_down_on_illicit_goods_desc:0 "Çok uzun zamandır toplumumuza sızan zehrin ve onunla uğraşanların insafına kaldık. Yeni bir refah yüzyılına daha güçlü ve daha açık fikirli girmek için onun cazibesini reddetmeliyiz."
 CHI_crackdown_on_corruption_in_recruitment:0 "Asker Alımında Yolsuzluğa Karşı Baskı"
 CHI_crackdown_on_corruption_in_recruitment_desc:0 "Cumhuriyet ordusu kurulduğundan beri asker alımında sistemsel sorunlar yaşanıyor. İnsanlar hizmetten kaçmak için para ödüyor ve maaşları zimmete geçirmek için yaratıcı muhasebe kullanılıyor. Modern dünyanın saldırısından sağ çıkacaksak bunun sona ermesi gerekiyor çünkü verimsizliklere yer yok."
 CHI_crackdown_on_corruption_in_recruitment_tt:0 "§Y$CHI_he_yingqin$§! §Y3§!. seviye bir General olarak erişilebilir hale gelir"
 CHI_crackdown_on_looting:0 "Yağmaya Karşı Önlem Al"
 CHI_crackdown_on_looting_desc:0 "Eyaletimizin düzgün bir şekilde gelişmesine izin vermek için, askerlerimizin sürekli olarak yerel halkın yiyeceklerine ve aletlerine el koymasını engellemeli ve barışı korumak için hükümetimiz tarafından gerekli görüldüğü takdirde hukuk ve adaletin uygulanmasını sağlamalıyız."
 CHI_cradle_of_civilization:0 "Medeniyetin Beşiği"
 CHI_cradle_of_civilization_desc:0 "Sarı Nehir'in siltli sularından insanlığı şekillendiren bir medeniyet doğdu. İmparatorluklar yükselir ve düşer, ancak antik Çin'in ihtişamı dünyada sonsuza dek parlar ve üstünlüğümüz de öyle olacak."
 CHI_cradle_of_civilization_tt:0 "Yeterince yüksek §YUyum§! seviyesine ulaşıldığında tarafımızdan §YTalep Edilen§! §YAsya§! eyaletlerini entegre etme kararlarının kilidini açar"
 CHI_crush_the_communists:0 "[PRC.GetNameDef] Devletini Ez"
 CHI_crush_the_communists_desc:0 "Çok uzun zaman önce başladığımız işi nihayet bitirmenin zamanı geldi; [PRC.GetNameDef] devletinin mutlak ve tam yıkımı! Çok uzun zamandır başka şeylerle dikkatimiz dağıldı, ancak artık bu baş belasının devam etmesine müsamaha göstermeyeceğiz!"
 CHI_dang_guo:0 "Dang Guo"
 CHI_dang_guo_desc:0 "Partinin amacı her zaman ulusumuza demokrasiyi getirmek olmuştur, ancak bu belirsiz zamanlarda Kuomintang'ın verimli hareket edebilmesi önemlidir. Bu nedenle şimdilik partiyi ulusun üzerine koymalıyız."
 CHI_deal_with_the_shadow_elements:0 "Gölge Unsurlarla Başa Çık"
 CHI_deal_with_the_shadow_elements_desc:0 "Ülkemizdeki karanlık gruplar kişisel kazanç uğruna halkı zehirliyor. Buna izin verilemez!"
 CHI_decisive_battles:0 "Belirleyici Muharebeler"
 CHI_decisive_battles_desc:0 "[JAP.GetNameDef] tarafından 1905'te gösterildiği gibi, tüm zaferler aynı ağırlığı taşımaz. Mançurya'ya saldırmak için inisiyatifi ele alarak güçlerimizi kilit çatışmaları kazanmaya odaklamalıyız."
 CHI_declare_war_zone_modify:0 "§Y$CHI_declare_war_zone$§! bonusunu şu şekilde değiştirecek: "
 CHI_decree_the_end_to_corruption:0 "Yolsuzluğun Sonunu İlan Et"
 CHI_decree_the_end_to_corruption_desc:0 "Yolsuzluk, en yüksek bakandan ordunun en düşük rütbeli askerine kadar hükümetimizde endemik hale geldi. Dürüst bir yönetim kurulabilmesi için açgözlü ve yozlaşmış yetkilileri ayıklamamız gerekiyor."
 CHI_defence_in_depth:0 "Derinlemesine Savunma"
 CHI_defence_in_depth_desc:0 "Uygun savunma statik olamaz ve bunu stratejimize dahil etmeliyiz. [JAP.GetAdjective] dayanma gücüne sahip olmadığını biliyoruz, bu yüzden onları ne kadar çok içeri çekersek o kadar iyi. Savaşın gelgitleri, silahlı kuvvetlerimiz olan barajları yıkmamalıdır."
 CHI_defend_our_coasts:0 "Kıyılarımızı Savun"
 CHI_defend_our_coasts_desc:0 "Düşmanımız bize ulaşamazsa bize saldıramaz. Mayın döşeme, işgale karşı en etkili savunma aracıdır. Maliyetler için sonra endişeleniriz..."
 CHI_demand_regional_adherence:0 "Bölgesel Bağlılık Talep Et"
 CHI_demand_regional_adherence_desc:0 "Artık Çin'in bölgesel yöneticilerine Halkın Üç İlkesini düzgün bir şekilde yasalaştırdığımızı kanıtlayabildiğimize göre, aynısını yapmaları için üzerlerinde baskı yaratma fırsatımız var. Bu sonunda onların boyun eğmesine ve merkezi otoritemizin rehberliğinde cumhuriyete entegrasyonuna yol açmalıdır."
 CHI_demand_regional_adherence_tt:0 "Savaş Ağası kontrolündeki bölgeleri §YGeliştirme§! ve onların halkın üç ilkesine bağlılığını zorlama, §YDemokratik§! desteklerini artırma ve sonunda onları §YBoyunduruk Altına Alma ve Entegre Etme§! kararlarının kilidini açar"
 CHI_democratic_shortcut:0 "Siyaset:\nBirlik"
 CHI_demonstrate_our_resolve:0 "Kararlılığımızı Göster"
 CHI_demonstrate_our_resolve_desc:0 "Dünyanın geri kalanı bizi çok uzun zamandır küçümsüyor. Bu acımasız saldırganlığı yenerek cesaretimizi kanıtlama zamanı."
 CHI_denounce_feudalism:0 "Feodalizmi Kına"
 CHI_denounce_feudalism_desc:0 "Devrimci karakterimizi ilan ederken partimizde eski toprak sahipleri ve seçkinler gibi davrananlar var. Bu eski feodalistlerin karşı devrimci davranışlarıyla olduğu gibi yüzleşilmesi gerekiyor."
 CHI_denounce_feudalism_tt:0 "Her savaş ağası bağlı devleti için aylık: §G+[?warlord_subjects_pp_gain_base] Politik Güç§! kazanacak."
 CHI_deny_the_enemy:0 "Düşmanı Engelle"
 CHI_deny_the_enemy_desc:0 "Karadaki üstünlüğümüz eşsiz olsa da, belki de hasta donanmamızı canlandırırken umabileceğimiz en iyi şey düşman operasyonlarının engellenmesidir."
 CHI_develop_counterinsurgency_tactics:0 "Kontrgerilla Taktikleri"
 CHI_develop_counterinsurgency_tactics_desc:0 "Gerillalar alışılmadık, öngörülemez şekillerde hareket eder ve onlarla nasıl savaşılacağını öğrenmemiz gerekir. Yeni bir savaş biçimine uyum sağlamak ve teknikler geliştirmek için komisyonlar ve gruplar organize etmeliyiz."
 CHI_develop_counterinsurgency_tactics_tt:0 "§Y$CHI_counter_infiltration_measures$§! maliyetini §Gyarısı§! kadar yapacak"
 CHI_develop_counterinsurgency_tactics_tt_2:0 "§Y$CHI_counter_infiltration_measures$§! maliyetini §G%25§! yapacak"
 CHI_develop_northern_naval_logistics:0 "Kuzey Donanma Lojistiğini Geliştir"
 CHI_develop_northern_naval_logistics_desc:0 "1922'de Japonya'dan resmen geri alınan Qingdao, deniz askeri çabalarımızda rol oynaması gereken kilit bir stratejik liman şehrini temsil ediyor."
 CHI_develop_southern_naval_logistics:0 "Güney Donanma Lojistiğini Geliştir"
 CHI_develop_southern_naval_logistics_desc:0 "Sömürgeci toprak parçalarıyla dolu Güney kıyımız, ne yazık ki savunmasız. Batılı güçlerle kendi şartlarında karşılaşacaksak, bu kilit alanın geri kazanılması ve geliştirilmesi bir zorunluluktur."
 CHI_develop_the_chemical_industry:0 "Kimya Endüstrisini Geliştir"
 CHI_develop_the_chemical_industry_desc:0 "Modern medeniyetin en büyük başarılarından biri, kimya yoluyla doğayı fethetmesidir. Tarımdan imalata, kimya endüstrisi toplumu güçlendirebilir - ancak maalesef bizimki sadece yeni doğuyor. Bu endüstrileri büyütseydik neler başarabileceğimizi kimse bilemez."
 CHI_dominate_the_enemy:0 "Düşmana Hükmet"
 CHI_dominate_the_enemy_desc:0 "Bedeli ne olursa olsun düşmanlarımızla eşit şartlarda eşleşeceğiz."
 CHI_draw_support_from_the_big_families:0 "Büyük Ailelerden Destek Al"
 CHI_draw_support_from_the_big_families_desc:0 "Çin'in farklı sektörlerde çok etkili bir avuç ailesi var. Bu ülkeyi istikrara kavuşturmaya yardımcı olmasa da, bu bağlantılar yine de hedeflerimizi ilerletmek için kullanılabilir."
 CHI_early_detections:0 "Erken Tespit"
 CHI_early_detections_desc:0 "Etkili ama mütevazı bir filoyla, gemileri en iyi şekilde kullanmak için çatışmalarımızı optimize etmekten başka seçeneğimiz yok. İstihbarat ve farkındalık bunu yapmanın en iyi yöntemlerini temsil eder."
 CHI_effectivize_ground_crew_usage:0 "Yer Ekibi Kullanımını Etkili Kıl"
 CHI_effectivize_ground_crew_usage_desc:0 "Yerdeki verimlilik, gökyüzündeki performans kadar hayati önem taşır. Mürettebat görevlerini ve lojistiği kolaylaştırmak, havada daha fazla uçak tutacaktır."
 CHI_empower_the_bureau_of_investigation_and_statistics:0 "Soruşturma Bürosunu Güçlendir"
 CHI_empower_the_bureau_of_investigation_and_statistics_desc:0 "Eski zamanlardan beri düşman ve kendi hakkındaki bilgi savaşları kazandırdı. İhtiyacımız olan bilgiyi bize sağlayabilecek bir organizasyona ihtiyacımız var ve Milli Soruşturma ve İstatistik Bürosu'nu genişletmeliyiz."
 CHI_empower_the_mtac:0 "MTAC'yi Güçlendir"
 CHI_empower_the_mtac_desc:0 "[ROOT.GetNameDef] topluluğu uyum yolunda, ancak iş henüz bitmedi. Moğolistan ve Tibet İşleri Komisyonu, ülkemizde bulunan gruplarla ilişkiyi denetledi, ancak genişletilmiş bir role sahip olabilir. Devrimi yurtdışındaki kardeşlerimize getireceğiz!"
 CHI_empower_the_mtac_tt:0 "[MON.GetFlag] §Y[MON.GetAdjective]§! ve [TIB.GetFlag] §Y[TIB.GetAdjective]§! eyaletlerini ana vatan yapma kararlarının kilidini açar."
 CHI_empower_those_that_have_lost:0 "Kaybetmiş Olanları Güçlendir"
 CHI_empower_those_that_have_lost_desc:0 "Ulusumuzda bu savaşta işleri veya evleri gibi çok şey kaybeden birçok kişi var. Bu insanlar olası bir güç kaynağı gibi görünmeyebilir, ancak yetenek verilirse, işgalcileri yıkayıp atacak dalga olacaklardır."
 CHI_enact_georgist_tax_reforms:0 "Georgist Vergi Reformlarını Yasalaştır"
 CHI_enact_georgist_tax_reforms_desc:0 "Georgizm, sahip olunan araziye vergi getirmek isteyen Sun Yat Sen'in ekonomi teorisinin temelini oluşturdu. 'Hükümeti desteklemenin tek yolu, yeni sistemimizi üzerine kuracağımız sonsuz derecede adil, makul ve eşit bir şekilde dağıtılmış bir vergidir'."
 CHI_end_military_primacy:0 "Askeri Üstünlüğü Sona Erdir"
 CHI_end_military_primacy_desc:0 "Ordu amacına hizmet etti, ancak iktidar üzerindeki hakimiyeti kırılmalı. [ROOT.GetName] generaller tarafından değil, hukukla yönetilen bir ulus olacaksa sivil otorite yeniden tesis edilmelidir."
 CHI_end_the_humiliation:0 "Aşağılanmayı Sona Erdir"
 CHI_end_the_humiliation_desc:0 "Sonunda, geçmiş yüzyıllarda yaptığımız gibi, büyük bir güç olarak ayaktayız. Hayranlık duyulan, etkili ve etkileyici bir şekilde diğerlerinin üzerine çıktık, zalimleri bir kenara atıp tarih kitaplarına gömdük. Artık gözden düşmüş değiliz!"
 CHI_enforce__virtues:0 "Erdemleri Uygula"
 CHI_enforce__virtues_desc:0 "Yine de insanlar zamanlarını parti ve ulus adına kendilerini geliştirebilecekken anlamsız ve manasız uğraşlarla harcıyorlar. Uygulamamızda çok gevşek davrandık ve çabalarımızı iki katına çıkaracağız."
 CHI_escort_efficiency:0 "Eskort Verimliliği"
 CHI_escort_efficiency_desc:0 "Avcı eskortları bombardıman uçaklarımız için kalkandır. Koordinasyon ve kapsamı artırmak, bir sonraki sorti için hazır olarak üsse daha fazla sağlam dönüş sağlar."
 CHI_eternal_revolution:0 "Ebedi Devrim"
 CHI_eternal_revolution_desc:0 "Başarılarımız sistemimizin eski ve yabancı fikirlere göre etkinliğini göstermiştir. Devrim ateşi her yurttaşın kalbinde yanıyor ve devrimi daha da yaymak için bunu kullanmamız gerekiyor."
 CHI_eternal_revolution_tt:0 "Talep Edilen Eyaletlerde §YSavaş Bölgeleri İlan Etmeye§! izin verir"
 CHI_expand_academica_sinica:0 "Academia Sinica'yı Genişlet"
 CHI_expand_academica_sinica_desc:0 "Nüfusumuzun büyük bir kısmı tatmin edici bir eğitim seviyesine ulaşmaya başladığına göre, yüksek öğrenimimize bakmanın zamanı geldi. Daha büyük yetenekler için en baskın bilimsel kuruluşumuz olan Academia Sinica'daki mevcut kurumları geliştireceğiz."
 CHI_expand_academica_sinica_tt:0 "§Y$CHI_neglected_countryside$§!$research_speed_factor_tt$[?CHI_neglected_countryside_academia_sinica_trigger|R%] veya üzeri"
 CHI_expand_national_sun_yat_sen_university:0 "Milli Sun Yat-sen Üniversitesi"
 CHI_expand_national_sun_yat_sen_university_desc:0 "Ekonomi artık halkımız için yüksek öğrenimi finansal olarak destekleyebildiğine göre, Çin halkının kapsamlı bir şekilde çalışmasının, doğru bir şekilde sorgulamasının, dikkatlice düşünmesinin, net bir şekilde ayırt etmesinin ve ciddiyetle uygulamasının zamanı geldi. Ulusumuz ancak Dr Sun Yat-sen tarafından ortaya konan bu ilkelerle araştırma ve geliştirmede lider bir figür haline gelebilecektir."
 CHI_expand_the_bureaucracy:0 "Bürokrasiyi Genişlet"
 CHI_expand_the_bureaucracy_desc:0 "Ülkemiz çok geniş ve onu yönetmek çok fazla çaba ve insan gerektiriyor. Genişleyen eğitim tabanımızla artık devlet aygıtında daha fazla kişiyi istihdam edebilir ve ülkenin daha uzak bölgeleri üzerindeki kontrolümüzü güçlendirebiliriz."
 CHI_expand_the_chinese_academy_of_sciences:0 "Çin Bilimler Akademisi'ni Kur"
 CHI_expand_the_chinese_academy_of_sciences_desc:0 "Academia Sinica yeni bir girişim başlattı. Ulusumuzdaki en parlak beyinleri doğa bilimleri, bilim ve teknoloji için yeni bir milli akademide bir araya getirecek."
 CHI_expand_the_cooperatives:0 "Kooperatifleri Genişlet"
 CHI_expand_the_cooperatives_desc:0 "Kooperatifler etkinlikleriyle bizi etkiledi, ancak ölçek ve erişim açısından hala küçükler. Bağlantı ağımızı onlara ödünç verirsek daha da büyüyebilir ve çoğalabilirler."
 CHI_expand_the_faction:0 "Özgürleri Davet Et"
 CHI_expand_the_faction_desc:0 "Yerel hareketimizde olduğu gibi, Asya'daki demokrasi davası da birçok küçük gruba bağlıdır. Bize baskı yapacak olanlara karşı durabilmek için tüm hareketleri daha büyük bir ittifakta birleştirmemiz gerekiyor."
 CHI_expand_the_faction_tt:0 "§YDemokratik§! §YAsya§! ve §YOkyanusya§! uluslarını ittifakımıza davet etme kararlarının kilidini açar"
 CHI_expand_the_tongzi_jun:0 "Tongzi Jun'u Genişlet"
 CHI_expand_the_tongzi_jun_desc:0 "Gençlik kolordusu safları, sadık ve disiplinli vatandaşların yeni nesillerini yetiştirebilir. Bir miktar askeri eğitim de silahlı kuvvetlere girişlerini kolaylaştıracaktır."
 CHI_expel_the_occupiers:0 "$PRC_expel_the_occupiers$"
 CHI_expel_the_occupiers_desc:0 "$PRC_expel_the_occupiers_desc$"
 CHI_expropriate_industrialists:0 "Sanayicileri Kamulaştır"
 CHI_expropriate_industrialists_desc:0 "Chiang'ın uşakları böylesine yozlaşmış bir adamı takip etmekten büyük fayda sağladılar ve büyük servet biriktirdiler. Kişisel kazanç partinin üzerinde tutulamaz ve olanların düzeltilmesi gerekiyor. Devlete ait olanı geri vereceğiz."
 CHI_extend_compulsory_education:0 "Zorunlu Eğitimi Genişlet"
 CHI_extend_compulsory_education_desc:0 "Okuryazar bir nüfus ulusal kalkınmanın omurgasıdır, ancak maalesef eğitim çabalarımız yüzeysel ve kentsel alanlara çok fazla odaklanmıştır. Bu, kırsalda gözden kaçan bir nüfusa, devletin ayakkabılarını dolduracak başka birine hazır bir nüfusa yol açtı."
 CHI_extend_compulsory_education_tt:0 "Her §Y[?CHI_improving_neglected_countryside_mission_time]§! günde bir, §Y$CHI_neglected_countryside$§!, olumsuz etkenler gidene kadar §Gİyileşir§!."
 CHI_extend_jurisdiction_to_the_provinces:0 "Yargı Yetkisini İllere Genişlet"
 CHI_extend_jurisdiction_to_the_provinces_desc:0 "[ROOT.GetRulingParty], büyük şehirlerin ve merkezi kurumların kontrolünü ele geçirmede başarılı oldu, ancak çevrede daha iyisini yapabiliriz. Gücümüzü genişletmek, Çin'i birleştirmede ve [JAP.GetAdjective] saldırısını durdurmada uzun bir yol kat edecektir."
 CHI_facilitate_operation_zet:0 "Zet Operasyonunu Kolaylaştır"
 CHI_facilitate_operation_zet_desc:0 "[SOV.GetNameDef] devletinin [JAP.GetNameDef] devletinin Doğu Asya'da aldığı saldırgan tutumdan rahatsız olduğunu anladık. Bize maddi destek ve gönüllüler sağlamaya istekliler. Tek yapmamız gereken yardımın kabulünü hazırlamak."
 CHI_fascist_shortcut:0 "Siyaset:\nMavigömlekliler"
 CHI_finance_cooperatives:0 "Kooperatifleri Finanse Et"
 CHI_finance_cooperatives_desc:0 "Kooperatifler canlılık ve yaratıcılık dolu, ancak krediye erişimleri yok. Muazzam miktarda imkanımız olmasa da, kooperatiflerin ihtiyaçları o kadar küçük ki onları kendimiz finanse edebilir ve bir sonraki adımı atabiliriz."
 CHI_find_foreign_financiers:0 "Yabancı Finansörler Bul"
 CHI_find_foreign_financiers_desc:0 "Ekonomimizin potansiyeli sonsuz olsa da, mevcut durumu, bunu kendimiz yapacaksak inşanın zaman alacağı anlamına geliyor. Ekonomimizi güçlendirmenin daha hızlı bir yolu, ortak girişimler yoluyla ülkeye dış sermaye getirmek olacaktır. Çin ulusunun olanaklarını görme yeteneğine sahip bireyler için yurtdışına bakmalıyız."
 CHI_find_foreign_financiers_tt:0 "[ROOT.GetName] hakkında en az §G70§! görüşe sahip her büyük devlet (Japonya hariç) için kazanır: §Y+1500 $CIC_BANK_HEADER$§!.\n\n"
 CHI_focus_on_meritocratic_principles:0 "Liyakat İlkelerine Odaklan"
 CHI_focus_on_meritocratic_principles_desc:0 "Adam kayırma, rüşvet ve yolsuzluk verimli bir ordunun baş belasıdır. Bu iğrençlikler güçlerimizde çok fazla mevcuttu ve bunun değişmesi gerekiyor. En liyakatli bireyleri doğru pozisyonlara terfi ettirecek yapılar kurmak zaferi garanti edecektir."
 CHI_focus_on_meritocratic_principles_tt:0 "§YWhampoa Üstünlüğü§! Ordu Ruhunu manuel olarak kaldırmayı etkinleştirir"
 CHI_focus_on_positional_advantage:0 "Konumsal Avantaja Odaklan"
 CHI_focus_on_positional_advantage_desc:0 "Hava muharebesi sadece sayılar veya hızla ilgili değildir. Avantaj irtifa, açı ve farkındalıktadır. Pilotlarımıza her avantajı kullanmayı öğretmeliyiz."
 CHI_focus_on_the_Tianlong_project:0 "Tianlong Projesine Odaklan"
 CHI_focus_on_the_Tianlong_project_desc:0 "Jet itkisi hava savaşının geleceğidir. Tianlong Projesi bu evrimin ön saflarında yer alıyor."
 CHI_foreign_acquisition:0 "Yabancı Edinimi"
 CHI_foreign_acquisition_desc:0 "Bunun geçici bir aksilik olmasını hedeflerken, diğer güçlerin deniz teknolojik ilerlemesi açısından bizden çok ileride olduğunu kabul etmeliyiz. Donanmamızı modernize etmek, teknolojik olarak üstün bir hayırsevere yaklaşarak başlamalıdır."
 CHI_form_saco:0 "SACO'yu Kur"
 CHI_form_saco_desc:0 "Galip gelmek isteyen kişi düşmanını tanımalıdır. Amerikalılar, istihbarat paylaşmak ve gerilla birimlerimizin eğitimine yardımcı olmak için Çin-Amerikan İşbirliği Örgütü'nü kurmayı önerdiler."
 CHI_form_the_chinese_womens_national_war_relief_society:0 "Muhtaçlar İçin Okullar Aç"
 CHI_form_the_chinese_womens_national_war_relief_society_desc:0 "Emperyalizme karşı mücadelemizde birçok kişi çok şey kaybetti ve onların ihtiyaçlarını karşılamalıyız. Çin Kadınları Milli Savaş Yardım Derneği umut verici sonuçlar gösterdi ve artan etkinlik için genişletilmelidir."
 CHI_form_the_combined_logistics_command:0 "Birleşik Lojistik Komutanlığını Kur"
 CHI_form_the_combined_logistics_command_desc:0 "Ordumuz yeniden düzenlendiğine ve ulusumuza yönelik herhangi bir tehditle verimli bir şekilde başa çıktığına göre, başka sorunlarla karşılaşıyoruz. Lojistik durumumuz iyileşmiş olsa da, silahlı kuvvetlerimiz lojistik dağıtım sistemlerinde koordinasyon eksikliği yaşıyor. Bu sorunu hemen hafifletmeliyiz!"
 CHI_formalise_training_regime:0 "Eğitim Rejimini Resmileştir"
 CHI_formalise_training_regime_desc:0 "Tutarlı ve titiz bir eğitim rejimi, kayıpları azaltmanın ve performansı artırmanın anahtarıdır. Standardizasyon şimdi başlıyor."
 CHI_formalize_field_promotions:0 "Saha Terfilerini Resmileştir"
 CHI_formalize_field_promotions_desc:0 "İdeal bir dünyada, tam eğitimli ve eğitimli bir ordumuz olurdu. Ama bu o dünya değil. İçinde bulunduğumuz zor durumda birlikleri cepheye ulaştırmak önceliğimizdir ve bunu ne kadar hızlı yapabilirsek o kadar iyi. Yoldaşlarına liderlik edebilecek sıradan askerleri bulmak için bir program kuracağız."
 CHI_found_a_modern_fertiliser_plant:0 "Modern Bir Gübre Fabrikası Kur"
 CHI_found_a_modern_fertiliser_plant_desc:0 "Ulusu beslemek için tarımımızı rasyonelleştirmeliyiz ve yerel bir gübre üretimi ilk adımdır. Bu amaçla bir fabrika kuracağız, ancak bunu başka amaçlar için de kullanacağız."
 CHI_from_many_to_one:0 "Çokluktan Birliğe"
 CHI_from_many_to_one_desc:0 "Ulusumuz sayısız kalabalığı barındırıyor, ancak son zamanlarda bölünmüş ve farklı görüşler arasında parçalanmış durumdayız. Yabancı saldırısına direnecek ve nihayetinde hayatta kalacaksak, tek bir ortak hedef arkasında birleşmemiz gerekiyor. "
 CHI_from_many_to_one_faction_tt:0 "İttifak manifestosu yerine getirme oranı düşük olduğunda §G+%20.0§! $MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$ ekler. \nİttifak manifestosu yerine getirme oranı yüksek olduğunda §G-%10.0§! $MODIFIER_AUTONOMY_GAIN_WARSCORE$ ekler."
 CHI_from_many_to_one_tt:0 "İttifakımızdaki her Savaş Ağası için §G+%1.5§! İstikrar kazan"
 CHI_fund_the_marine_corp:0 "Deniz Piyadelerini Finanse Et"
 CHI_fund_the_marine_corp_desc:0 "Ordularımız geniştir ve güçlerinden şüphe edilemez, ancak yanlış kullanıldığında kör bir alet olabilirler. Kıyılarımızı savunmak için eğitilmiş profesyonel deniz piyadelerinden oluşan özel bir kolordu, sıradan birlik sayısının on katına bedel olacaktır ve zamanı geldiğinde gücümüzü denizlere yansıtacaktır."
 CHI_fund_the_naval_air_establishment:0 "Donanma Hava Kurumunu Finanse Et"
 CHI_fund_the_naval_air_establishment_desc:0 "Deniz ve hava üstünlüğünün birleşik avantajları göz ardı edilemeyecek kadar büyük bir ödüldür. Donanma hava kolumuzu genişletmek, branşlar arası iletişim hataları riskini azaltır."
 CHI_fund_the_plan_domestically:0 "Planı Yerel Olarak Finanse Et"
 CHI_fund_the_plan_domestically_desc:0 "Geçen yüzyıldan öğrenilecek bir şey varsa o da yabancı sermayeye güvenmenin tehlikeli olduğudur. Ulusumuzun endüstrilerini inşa edeceksek, yerel bankalarımız ve yatırımcılarımız yerine yabancılara güvenmek zorunda kalmak büyük bir hata ve tehlikeli bir olasılık olacaktır. Bağımlılık riskine girmemek için yerel finans kaynakları bulmalıyız."
 CHI_gdc_integration_cost:0 "[GDC.GetNameDef] Entegrasyon Maliyetini §G[?gdc_integration_cost_reduction|%G0]§! kadar azaltır"
 CHI_give_protection_of_civil_rights:0 "Sivil Hakların Korunmasını Sağla"
 CHI_give_protection_of_civil_rights_desc:0 "Soong Qingling ve Çin Sivil Hakları Koruma Birliği 1930'ların başında faaliyet göstererek KMT'nin otokratik önlemlerine karşı mücadele etti. Başlattıkları işi, sıradan insanın haklarını güvence altına alarak sürdüreceğiz."
 CHI_glorify_deng_yanda:0 "Deng Yanda'yı Yücelt"
 CHI_glorify_deng_yanda_desc:0 "Kuomintang, 1911'de başlattığımız devrimi bencil vurgunculuk uğruna terk etti. Sıradan insanın yanında duran ve zorbalık ve yatıştırmadan başka bir yol yaratan biri vardı: Deng Yanda. İnançları uğruna şehit oldu ve onu veya neyi temsil ettiğini asla unutmayacağız."
 CHI_grow_the_coal_industry:0 "Kömür Endüstrisini Büyüt"
 CHI_grow_the_coal_industry_desc:0 "Kömür fabrikalarımıza, trenlerimize ve fırınlarımıza güç sağlar. Ekonomik gücümüzü artırırken ulusa güç vermeye devam etmek için yeni enerji kaynakları bulmamız gerekiyor. Milli Kaynaklar Komisyonu kullanmamız gereken birkaç kaynak belirledi."
 CHI_grow_the_coal_industry_tt1:0 "Ana eyaletlerimizde ve müttefik Savaş Ağası Eyaletlerinde ek §YKömür§! kazan"
 CHI_grow_the_coal_industry_tt2:0 "Bizim ve müttefik Savaş Ağası Eyaletlerinde §YKömür§! için Maden Arama Kararlarının kilidini açar"
 CHI_guerrilla_warfare:0 "Gerilla Savaşı"
 CHI_guerrilla_warfare_desc:0 "Konvansiyonel savaş bir dereceye kadar direnmemeze izin verir, ancak kendi topraklarımızda savaşmak bize daha alışılmadık yöntemler sunar. Düşman tarafından tutulan eyaletlere sızmak ve geri unsurları kasıp kavurmak, [JAP.GetNameDef] devletinin tamamen hazırlıksız olduğu bir savaş yöntemidir."
 CHI_guerrilla_warfare_tt:0 "§Y$PRC_guerilla_warfare_sea_cat$§! Kararlarının kilidini açar"
 CHI_gxc_integration_cost:0 "[GXC.GetNameDef] Entegrasyon Maliyetini §G[?gxc_integration_cost_reduction|%G0]§! kadar azaltır"
 CHI_heavy_cruiser_focus:0 "Ağır Kruvazör Odaklanması"
 CHI_heavy_cruiser_focus_desc:0 "Qing'in bir kalıntısı olsa da su üstü donanmamız bize neredeyse 50 yıldır iyi hizmet etti. Dünya değişirken, kısa menzilli, zırhlı kruvazörleri işletmek söz konusu olduğunda bu kadar geniş bir kurumsal bilgiyi bir kenara bırakmak akıllıca olmaz: geleceğimiz geçmişi içermelidir."
 CHI_heavy_ship_research:0 "Ağır Gemi Araştırması"
 CHI_heavy_ship_research_desc:0 "Şimdiye kadar ulusumuzu yağmalayan bölgesel ve sömürgeci güçlerle eşleşmek için yerli zırhlı üretimi hayati önem taşıyor. Teknolojimiz bizi dezavantajlı duruma düşürse de, üretim süreçlerimiz ve halkımızın katıksız iradesi günü kurtaracaktır."
 CHI_hongxiang_force:0 "Yunnan Paraşütçü Gücü"
 CHI_hongxiang_force_desc:0 "Müttefiklerimiz ve havacılıktaki akranlarımızla işbirliği yaparak, askeri paraşüt operasyonları için yerli bir eğitim programı kurmayı başardık."
 CHI_impair_the_control_yuan:0 "Kontrol Yuanını Zayıflat"
 CHI_impair_the_control_yuan_desc:0 "Denetim ve dengeler işleyen bir yönetimde önemli faktörlerdir, ancak ilerlemenin yürüyüşünü de yavaşlatabilirler. Hedeflerimizde bizi engellememesi için Kontrol Yuanı'nın bazılarının umduğu kadar güçlü olmaması davamıza yarar sağlayacaktır."
 CHI_impair_the_control_yuan_tt:0 "§YEntegrasyon Çabaları kararını§! şu şekilde uygular: "
 CHI_impair_the_control_yuan_tt_2:0 "365 gün $instead_of$ 480 gün"
 CHI_import_fertilisers:0 "Gübre İthal Et"
 CHI_import_fertilisers_desc:0 "Yerli üretim bağımlılıkla ilgili endişeleri çözse de, başkasını taklit etmek sadece fazladan bir adımdır. Başka bir yerden satın alma siparişleri ayarlarsak, belirgin güçlü yönlerimize odaklanabiliriz."
 CHI_indo_chinese_campaign:0 "Hindiçin Harekatı"
 CHI_indo_chinese_campaign_desc:0 "Güneydoğu Asya ile uzun bir geçmişimiz var ve bugün başka bir bölüm yazılıyor. Bölgeyi [671.controller.GetNameDef] elinden geri alacağız, böylece müttefik kuvvetler serbestçe hareket edebilir."
 CHI_industry_shortcut:0 "Ekonomi"
 CHI_infiltrate_the_examination_yuan:0 "Sınav Yuanına Sız"
 CHI_infiltrate_the_examination_yuan_desc:0 "Bir devlet sadece birkaç kişinin çalışmasıyla değil, bir yığın memurun yorulmak bilmez çalışmasıyla yürür. Bu işçilerin niteliklerini kontrol eden örgüte sızabilirsek, hareketimize büyük fayda sağlayabiliriz. İşçilerin bizim pozisyonumuzla uyumlu olduğundan emin olabilirsek, bu durdurulamaz bir güç oluşturacaktır."
 CHI_initiate_the_gung_ho_movement:0 "Gung Ho Hareketini Başlat"
 CHI_initiate_the_gung_ho_movement_desc:0 "Mevcut krizle birlikte hem materyal hem de üretim araçları açısından durumumuzun ne kadar eksik olduğunu anladık. Eksik olmadığımız şey, düzgün bir şekilde organize edilirse işe konulabilecek insanlardır. Ülke geneline dağıtabileceğimiz küçük ölçekli sanayi kooperatifleri kurma fikri bize sunuldu."
 CHI_initiate_the_sky_projects:0 "Gökyüzü Projelerini Başlat"
 CHI_initiate_the_sky_projects_desc:0 "Roketçilik ve gelişmiş itki yeni stratejik seçenekler açıyor. Uzun vadeli getiriyi göz önünde bulundurarak deneysel girişimleri finanse edeceğiz."
 CHI_inspect_the_troops:0 "Birlikleri Denetle"
 CHI_inspect_the_troops_desc:0 "Birlikleri partinin ve [root.GetLeader] arkasında toplamak için titiz denetimler yapılacak. Şanlı ordumuz bizi geleceğe taşıyan şey olacak."
 CHI_institute_a_national_registry_of_property:0 "Milli Mülkiyet Sicili Oluştur"
 CHI_institute_a_national_registry_of_property_desc:0 "Bürokrasi devletin temelidir ve doğru bilgi mevcut değilse bürokrasi verimli bir şekilde işleyemez. Vicdansız ajanların sistemi sömürebileceği ve ulusumuzun geri kalanının zararına kendilerini zenginleştirebileceği yer bu verimsizliktir."
 CHI_integrate_the_hongmen:0 "Savunma Gruplarını Entegre Et"
 CHI_integrate_the_hongmen_desc:0 "Çin, Qing baskısına karşı savunmak için kurulan gruplarla doludur. Xinhai devriminden bu yana amaçlarını kaybettiler ve farklı yönlere gittiler. Onları bünyemize katarak veya organizasyonlarını ve uygulamalarını taklit ederek onlara bir kez daha amaç verebiliriz."
 CHI_interception_detection:0 " Önleme Tespiti"
 CHI_interception_detection_desc:0 "Zamanında tespit, düşman yapmadan önce vurmamızı sağlar. Bu kritik avantajı elde etmek için radar ve gözlem ağlarımızı geliştireceğiz."
 CHI_international_instructors:0 "Uluslararası Eğitmenler"
 CHI_international_instructors_desc:0 "Pilotlara ve mürettebata olan ihtiyaç çok büyük ve onları yeterince hızlı eğitemiyoruz. Daha fazla yabancı eğitmeni ağırlamak, havada daha fazla uçağa sahip olma çabalarımızı hızlandıracaktır."
 CHI_international_squadron:0 "Uçan Kaplanları Davet Et"
 CHI_international_squadron_desc:0 "Yurtdışındaki dostlarımız gönüllü bir pilot grubu organize etti ve savaş çabamızı desteklemek için bir dizi modern uçak satın aldı. Girişimlerini kollarımızı açarak karşılamalıyız."
 CHI_introduce_income_tax:0 "Gelir Vergisini Tanıt"
 CHI_introduce_income_tax_desc:0 "Devleti finanse etme şeklimiz arkaik ve modern dünya için uygun değil. Son yarım yüzyılda birkaç kez gelir vergisi uygulamaya çalışmış olsak da, bu sefer bunu başarabilecek güçlü bir hükümetimiz var."
 CHI_introduce_the_baojia_system:0 "Baojia Sistemini Tanıt"
 CHI_introduce_the_baojia_system_desc:0 "Baojia sistemi, halkımızı organize etmek ve güvenliklerini garanti altına almak için eski zamanlardan beri kullanılmış ve oldukça verimli olduğu kanıtlanmıştır. Bize sürekli bir asker akışı sağlayacağından, onu asker toplamanın temeli olacak şekilde genişletmeliyiz."
 CHI_invest_in_mountain_guns:0 "Dağ Toplarına Yatırım Yap"
 CHI_invest_in_mountain_guns_desc:0 "Topraklarımızda kolayca gezinilemiyor ve geleneksel ağır topları buralardan taşımak çoğu kişi için zorlu oluyor. Toplarımızın istendiğinde sökülebilir olması bu sorunun doğal çözümüdür ve araştırmaya değerdir."
 CHI_invite_carsun_chang:0 "Carsun Chang'i Davet Et"
 CHI_invite_carsun_chang_desc:0 "Batılı güçler [ROOT.GetAdjective] çıkarlarına zarar vermiş olsa da, bazı fikirler bizim için yararlı olabilir. Carsun Chang bu fikirler ile Konfüçyüsçü bağlamımız arasındaki boşluğu doldurduğundan, demokratik hareket için bir toplanma noktası olacaktır."
 CHI_invite_foreign_experts:0 "Yabancı Uzmanları Davet Et"
 CHI_invite_foreign_experts_desc:0 "Geçen yüzyıl teknik bilgimizin Batılılarınkinin gerisinde kaldığını gösterdi. Bu bizim zararımıza olsa da, şimdi onların bilgilerinden yararlanma ve ekonomimizi her zamankinden daha hızlı büyütme konumundayız."
 CHI_invoke_the_nine_powers:0 "Dokuz Gücü Çağır"
 CHI_invoke_the_nine_powers_desc:0 "Eşitsiz antlaşmalar aleyhimize imzalanmış olsa da, Dokuz Güç hiçbir ulusun Çin'den daha fazlasını almaması gereken bir statüko üzerinde anlaştı. Devam eden Japon saldırganlığıyla birlikte, maddeyi devreye sokmanın zamanı geldi."
 CHI_joining_the_international_community:0 "Uluslararası Toplum"
 CHI_joining_the_international_community_desc:0 "Çok uzun zamandır içimize bakıyoruz ki bu sadece başkalarına bizi sömürme fırsatı verdi. Şimdi dünyaya açılmalı ve özgürlük için çabalayanlara, en zor anımızda bizi destekleyenlere katılmalıyız!"
 CHI_khm_integration_cost:0 "[KHM.GetNameDef] Entegrasyon Maliyetini §G[?khm_integration_cost_reduction|%G0]§! kadar azaltır"
 CHI_know_thy_enemy:0 "Düşmanını Tanı"
 CHI_know_thy_enemy_desc:0 "Düşman hatlarında güç uygulayabileceğimiz ve kırılmaları istismar edebileceğimiz noktaları nasıl bulacağımızı bilmemiz gerekiyor."
 CHI_know_thy_enemy_tt:0 "Saldırıda siper kaybetmeyen Zorla Saldırı'nın yükseltilmiş bir sürümünün kilidini açar."
 CHI_know_thy_self:0 "Kendini Tanı"
 CHI_know_thy_self_desc:0 "Düşmanı anlamak bize zaferler kazandıracaktır, ancak nihai zafer ancak kişinin kendi yeteneklerinin bilgisiyle gelebilir. Titiz bir öz değerlendirme süreçleri oluşturmak zayıf yönlerimizi, ama aynı zamanda güçlü yönlerimizi de ortaya çıkaracaktır."
 CHI_lay_the_foundation_for_a_united_china:0 "Birleşik Bir Çin'in Temelini At"
 CHI_lay_the_foundation_for_a_united_china_desc:0 "Mevcut hükümet sadece kılıcın gücünü bilen bir grup zorbadan ibaret. Sağlıklı bir ulus, güçle yönetimden fazlasını gerektirir. Sivil bir hükümet altındaki güçlü kurumlar, süregelen devrimimizin temelidir."
 CHI_legitimise_du:0 "Du'yu Meşrulaştır"
 CHI_legitimise_du_desc:0 "Bazıları bizi geçimini sağlamak için alışılmışın dışında yollara başvuranlardan uzak durmaya zorlayabilir, ancak belki de bu sadece değerli bir kaynağı çöpe atmak olur. Du Yuesheng'in gölgelerde çalışması gerekmeseydi neler yapabileceğini görmeliyiz."
 CHI_leverage_contacts:0 "Bağlantıları Kullan"
 CHI_leverage_contacts_desc:0 "Yurttaşlarımız dünyaya yayıldı ve bazıları Amerika'ya bile vardı. Amerika Birleşik Devletleri'nde bağlantılarımız sadece yardım eli uzatmamızı bekliyor."
 CHI_liberate_the_peoples_of_asia:0 "Asya Halklarını Özgürleştir"
 CHI_liberate_the_peoples_of_asia_desc:0 "Geçmiş yüzyıllarda olduğu gibi, Asya'nın geri kalanı rehberlik için bize bakıyor ve biz de yanıt vereceğiz. Emperyalistlere karşı ayaklanmalarına ve kendi özgürlüklerini bulmalarına, kardeşlerinin intikamını almalarına yardım edeceğiz."
 CHI_liberate_the_peoples_of_asia_tt:0 "§Y$asia$§! içinde sömürge devletlerini kontrol eden veya kuklaları olan herkese karşı savaş hedefleri kazanacağız"
 CHI_liberate_the_peoples_of_asia_tt_2:0 "§Y$asia$ §! çevresinde kukla hükümetler kurma kararlarının kilidini açar"
 CHI_liberation_in_progress:0 "Şu anda devam eden bir kurtuluş var"
 CHI_local_alloy_commission:0 "Yerel Alaşım Komisyonu"
 CHI_local_alloy_commission_desc:0 "Toprağımız büyük doğal mineral zenginliği kaynağıdır, ancak buna rağmen bundan henüz yararlanmadık. Burada olanaklarımızı araştırmak gelecekte kesinlikle temettü ödeyecektir."
 CHI_long_range:0 "Uzun Menzil"
 CHI_long_range_desc:0 "İyi ağırlıklı bir ok, bir savaşı başlamadan bitirebilir. Daha büyük, daha gürültülü motorlar mürettebatımızı riske atabilir, ancak gücü daha da uzağa yansıtma yeteneği dünya sahnesindeki kozumuzu da artıracaktır."
 CHI_long_range_screens:0 "Uzun Menzilli Eskortlar"
 CHI_long_range_screens_desc:0 "İç çatışmaların ötesine bakma çabalarımızı vurgularken, büyük mesafede ve düşük maliyetle önemli bir güç konuşlandırma yeteneği hayati hale geliyor."
 CHI_look_for_allies:0 "Dahili Müttefikler Ara"
 CHI_look_for_allies_desc:0 "Chiang'ın parti üzerindeki gücünü pekiştirmek için neredeyse on yılı vardı, ancak yine de arkasında durmayı reddeden unsurlar var. Bunları aramalı ve düzgün bir muhalefet çatısı altında birleştirmeliyiz."
 CHI_ma_clique_integration_cost:0 "[XSM.GetNameDef], [GSM.GetNameDef] ve [NXM.GetNameDef] için Entegrasyon Maliyetini §G[?ma_clique_integration_cost_reduction|%G0]§! kadar azaltır"
 CHI_maintain_adequate_currency_reserves:0 "Yeterli Döviz Rezervlerini Koru"
 CHI_maintain_adequate_currency_reserves_desc:0 "Pervasız harcama, defalarca gösterildiği gibi sistemin çökmesi riskini taşır. Kontrollü büyümede başarılı olacaksak kendimizi dizginlememiz ve uygun döviz rezervlerini korumamız gerekecek."
 CHI_maintain_adequate_currency_reserves_tt:0 "Her §Y[?CHI_improving_inefficient_economy_mission_time]§! günde bir, §Y$CHI_inefficient_economy$§! olumsuz etkenler gidene kadar iyileşecektir."
 CHI_make_a_stand_against_the_colonialists:0 "Sömürgecilere Karşı Duruş Sergile"
 CHI_make_a_stand_against_the_colonialists_desc:0 "İmparatorluk yüzyılı bitti ve biz kendi kaderini tayin çağının habercisiyiz. Eski düzene bağlı kalanlara bu basit ifadeyi duyurmalıyız ve bize direnirlerse halkın gazabını tadacaklar."
 CHI_make_a_stand_against_the_colonialists_tt:0 "Sömürgeci güçlerin elindeki §YAsya ve Okyanusya§! bölgelerindeki sömürgeleri özgürleştirmek için §YSömürgecilik Karşıtı§! kararların kilidini açar."
 CHI_mend_the_rift_with_hu:0 "Hu ile Araları Düzelt"
 CHI_mend_the_rift_with_hu_desc:0 "[ROOT.GetLeader] ile Hu Hanmin arasındaki eski rekabet partiyi yeterince zayıflattı. Hanmin'in takipçileri, birleşebilirsek ulusa fayda sağlayacak önemli bir nüfuza sahip olduğu anlamına geliyor."
 CHI_militarize:0 "Askerileştir!"
 CHI_militarize_desc:0 "Nüfusumuz tarihteki yerleri konusunda kayıtsız kaldı ve uyandırılması gerekiyor. Onlara devrimin coşkusunu hissettireceğiz ve onları hem iç hem de dış düşmanları yere sermeye hazırlayacağız."
 CHI_militarize_tt:0 "Mavigömlekli Milisleri, §Y$CHI_infiltrated_state_3$§! olan tüm mevcut ve gelecekteki eyaletlerde toplanacak"
 CHI_military_affairs_commission_sea:0 "Askeri İşler Komisyonu"
 CHI_military_affairs_commission_sea_desc:0 "Verimli bir ordunun temeli uygun bir yüksek komutanlıktır. Askeri İşler Komisyonu ulusun savunması için en yüksek organizasyonumuz olduğundan yetkinliğinden emin olmalıyız."
 CHI_minquan_focus:0 "Minquan İlkesi"
 CHI_minquan_focus_desc:0 "Dr. Sun Yat-sen tarafından başlatılan yolculuk sonunda birleşik bir cumhuriyete varacak. Şüphesiz uzun bir yolculuk olacak, ancak her seferinde bir adım atıyoruz. Birincisi, Minquan ilkesini yasalaştırmak ve oy hakkının tüm Çin vatandaşlarına verilmesini sağlamak olacaktır."
 CHI_minsheng_focus:0 "Minsheng İlkesi"
 CHI_minsheng_focus_desc:0 "Modern bir devlet, ihtiyaç anında vatandaşların onu savunmaya muktedir ve istekli olması için vatandaşlarına bakar. Bu amaçla, Minsheng ilkesini yasalaştırmalı ve refahın ulusun tüm vatandaşlarına sağlanmasını garanti etmeliyiz."
 CHI_minzu_focus:0 "Minzu İlkesi"
 CHI_minzu_focus_desc:0 "Bir kabileye veya dine değil de bir ulusa ait olma fikri, bir grup insanı bir devlete dönüştüren şeydir. Bu nedenle, Minzu ilkesini yasalaştırmalı ve ulusun tüm insanlarının güçlü bir milliyetçilik ve vatanseverlik duygusunun yanı sıra merkezi hükümet altında bir birlik duygusu hissetmesini sağlamalıyız."
 CHI_mobile_bases:0 "Mobil Üsler"
 CHI_mobile_bases_desc:0 "Dünyanın geri kalanının kanıtladığı gibi, hava savaşın geleceğini temsil ediyor. Ancak mesafeden vurma yeteneğimiz coğrafyamızla sınırlıdır. Büyük güçlerin örneğini izleyerek, çabalarımızı mobil saldırı platformlarına odaklamalıyız."
 CHI_monopolise_resource_extraction:0 "Kaynak Çıkarımını Tekelleştir"
 CHI_monopolise_resource_extraction_desc:0 "Ekonomiyi planlamak için merkezi bir organizasyonun gücünü diğer ülkelerde gözlemledik. Özellikle kaynak akışının durmamasını veya özel çıkarlar tarafından sömürülmemesini sağlama eylemi teknokratların veya bizim durumumuzda Milli Kaynaklar Komisyonu'nun elinde olmalıdır."
 CHI_motorise_our_infantry:0 "Piyadelerimizi Motorize Et"
 CHI_motorise_our_infantry_desc:0 "İnsan gücü havuzumuz geniştir ve her zaman gücümüzün kaynağı olmuştur. Modern motorlu taşıma, sıradan askeri güçlendirerek onu savaşa daha hızlı ve sert vurmaya hazır hale getirir. Doğru yerde, elinde tüfekle bir adam her zaman verimli olacaktır."
 CHI_nationalize:0 "Millileştir!"
 CHI_nationalize_desc:0 "Partimiz, ulusumuz ve halkımız için kritik bir zamandayız, bu yüzden özel çıkarlar milli gerekliliğe boyun eğmelidir. Doğrudan rehberliğimiz altında bu fabrikaları en yüksek verimlilikle kullanacağız!"
 CHI_naval_separate_defense_plan:0 "Donanma Ayrı Savunma Planı"
 CHI_naval_separate_defense_plan_desc:0 "Chen Shaokuan, önümüzdeki 30 yıl içinde en az on iki uçak gemisi inşa etmeyi amaçlayan Donanma Ayrı Savunma Planı olarak adlandırdığı şeyi önerdi. Denizlerimizi güvence altına almak istiyorsak, bu fikrini kabul etmeli ve azami süratle bir uçak gemisi filosunun üretimine başlamalıyız!"
 CHI_navy_shortcut:0 "Donanma"
 CHI_navy_spooks:0 "Donanma İstihbarat Servislerini Geliştir"
 CHI_navy_spooks_desc:0 "Çin çevresindeki okyanuslar hareketli ticaret merkezleridir. Tüccarların olduğu yerde söylentiler vardır. Söylentilerin olduğu yerde fırsatlar vardır..."
 CHI_ncns_request_handover_of_coastal_cities:0 "$CHI_request_handover_of_coastal_cities$"
 CHI_ncns_request_handover_of_coastal_cities_desc:0 "$PRC_dare_to_struggle_desc$"
 CHI_negotiate_the_nine_powers_treaty:0 "Dokuz Güç Antlaşmasını Müzakere Et"
 CHI_negotiate_the_nine_powers_treaty_desc:0 "Qing, Batılı güçlere boyun eğmeyi kabul etti ve 19. yüzyılın antlaşmaları hayaletler gibi peşimizi bırakmıyor, etkileri hala Çin üzerinde geziniyor. İmza sahiplerine ulaşacağız ve farklılıklarımızı bu sefer bir hizmetçi olarak değil, bir eşit olarak çözüp çözemeyeceğimizi göreceğiz."
 CHI_neutral_shortcut:0 "Siyaset:\nKuomintang"
 CHI_officialize_the_rocaf:0 "Çin Cumhuriyeti Hava Kuvvetlerini Resmileştir"
 CHI_officialize_the_rocaf_desc:0 "Hava kuvvetleri çok uzun zamandır gayri resmi bir varlık olmuştur. Yaptığımız teknolojik ve taktiksel gelişmelerle birlikte, Havacılık İşleri Komisyonu'nu Hava Kuvvetleri Komutanlığı Karargahı olarak yeniden düzenlemek artık güvenli. ROCAF, ordu ve donanmadan bağımsız, tamamen ayrı bir hizmet dalı olacak."
 CHI_one_nation_undivided:0 "Bölünmez Tek Ulus"
 CHI_one_nation_undivided_bypass_tt:0 "§YHer Çin Savaş Ağası§!: Şunlardan biri doğru olmalıdır: \n  Mevcut değil\n  §Y[ROOT.GetNameWithFlag]§! ile savaşta\n  §Y[ROOT.GetNameWithFlag]§! bağlı devleti\n  §Y[ROOT.GetNameWithFlag]§! ile bir ittifakta\n  §Y[ROOT.GetName]§!: onlara karşı bir §Ysavaş hedefine§! sahip."
 CHI_one_nation_undivided_desc:0 "İlleri tek bir bölünmez otorite altında birleştirerek bölgesel bölünmelerin üstesinden gelecek ve güçlü ve gururlu bir ulusun temelini atacağız. O zaman dış ve iç her türlü tehdide karşı durabileceğiz."
 CHI_one_nation_undivided_tt:0 "[PRC.GetName] ve [HBC.GetName] hariç her savaş ağasını Birleşik Cephe İttifakına davet edecek"
 CHI_open_afamf_plants:0 "AFAMF Tesislerini Aç"
 CHI_open_afamf_plants_desc:0 "Tümgeneral Chu Chia-Jen tarafından tasarlanan Chu XP-0 gibi yeni uçaklar geliştirmek için, hafif avcı uçaklarını ve pike bombardıman uçaklarını destekleyip üretebilecek tesisler açmalıyız. Bunun için ideal yer Kunming olacaktır, ancak göklerde düşmanlarımıza karşı koyabilecek bir şeyler üretebildiğimiz sürece her yer uygundur."
 CHI_open_afamf_plants_tt:0 "Biz veya bir tebaamız §Y[325.GetName]§! bölgesini kontrol ediyorsa, orada ek bir Askeri Fabrika kazanacağız"
 CHI_organise_the_200th_division:0 "200. Tümeni Organize Et"
 CHI_organise_the_200th_division_desc:0 "Zırhlı kuvvetler bu yüzyılın savaşındaki en büyük yeniliktir ve maalesef geride kaldık. Zırhlı bir tümen kurmak ve saldırıyı yönetmesi için uygun bir komutan atamak, zafere giden yolu döşeyecek bir güç çarpanı olacaktır."
 CHI_organise_the_200th_division_tt:0 "[ROOT.capital.GetName] içinde bir seçkin §YZırhlı§! birim kazan"
 CHI_our_people_in_the_legislative:0 "Yasamadaki İnsanlarımız"
 CHI_our_people_in_the_legislative_desc:0 "Mevcut sistem Chiang altında dişsiz hale getirildi. Güçlü bir merkezi gücün yerini almaya çalışan bir diktatör, işte savaşmamız gereken şey bu. Ulusun çekirdeğini güçlendirmek için bazı hükümet unsurlarının özerkliğini yeniden yazmamız gerekecek."
 CHI_outlaw_opposition_parties:0 "Muhalefet Partilerini Yasadışı İlan Et"
 CHI_outlaw_opposition_parties_desc:0 "Kuomintang on yıla yakın bir süredir baskın durumda, ancak muhalefet partilerine izin verildi. Ulusumuzun bir dönüm noktasında olduğundan korkuyoruz ve [JAP.GetNameDef] ve komünistlerle başa çıkana kadar muhalefeti sınırlandırmamız gerekecek."
 CHI_pacific_entente_faction:0 "Pasifik Antantı"
 CHI_petition_territorial_restoration:0 "Toprak Restorasyonu Dilekçesi"
 CHI_petition_territorial_restoration_desc:0 "$PRC_restore_territorial_integrity_desc$"
 CHI_political_advisors_in_every_division:0 "Her Tümende Siyasi Danışmanlar"
 CHI_political_advisors_in_every_division_desc:0 "Ordu devleti savunur, ta ki savunmayana kadar. Devlet çok sık silahlı olanlara yenik düştü, ancak bunun bize olmasına izin vermeyeceğiz. Siyasi subaylar silahlı kuvvetlerimizi doğru eyleme motive etmeye yardımcı olacaktır."
 CHI_politicise_the_process:0 "Süreci Siyasallaştır"
 CHI_politicise_the_process_desc:0 "Bir kamu görevlisi olarak siyasi sorumluluklarını anlamak önemlidir. Herkes bunu anlamıyor ve bu yüzden daha iyi eğitilmeleri gerekiyor. Yaygın bir anlayışa ulaşmak için her kamu görevlisinin eğitimini ve sınavını yeniden formüle edeceğiz."
 CHI_postpone_the_tutelage:0 "Vesayeti Ertele"
 CHI_postpone_the_tutelage_desc:0 "Amaç demokrasi olsa da, şimdi zamanı değil ve mevcut kriz özel önlemler gerektiriyor. Demokrasi çiçek açmadan önce ulusa tehlike boyunca rehberlik etmeliyiz."
 CHI_postpone_the_tutelage_tt:0 "Klişeler fethedildikten sonra belirli §YSavaş Ağası Generallerini§! §YYeniden Eğitme§! kararının kilidini açar"
 CHI_preempt_the_inevitable:0 "Kaçınılmaz Olanın Önüne Geç"
 CHI_preempt_the_inevitable_desc:0 "[JAP.GetNameDef] devletinin bizi zayıf ve alınmaya hazır sanarak üzerimize geldiğini biliyoruz. İlk biz vursaydık şaşkınlıklarını hayal edebilirsiniz."
 CHI_preemptive_strike:0 "Önleyici Saldırı"
 CHI_preemptive_strike_desc:0 "İç düşmanlarımız her gün güçleniyor, otoritemize karşı komplo kuruyorlar. Artık birinin Çin'de iktidarı ele geçirmeye çalışmasını bekleyemeyiz, harekete geçmeliyiz, saldırmalıyız!"
 CHI_preemptive_strike_tt:0 "[ROOT.GetFactionName] ittifakına katılmayan veya bağlı devlet olma taleplerimizi reddeden her [CHI.GetAdjective] Savaş Ağası üzerinde §Y$annex_everything$§! savaş hedefleri alacağız."
 CHI_prepare_for_a_change_in_leadership:0 "Liderlik Değişimine Hazırlan"
 CHI_prepare_for_a_change_in_leadership_dai_li:0 "§R[CHI_chiang_kaishek.GetName], Xi'an olayında [CHI_dai_li.GetName]§! olarak değiştirilecek"
 CHI_prepare_for_a_change_in_leadership_desc:0 "Mevcut hükümetimiz on yıldır iktidarda ve [JAP.GetNameDef] hayaleti hala [CHI.GetAdjective] ulusuna musallat oluyor. İktidar dizginlerini başka birinin tutmasına ihtiyaç var."
 CHI_prepare_for_a_change_in_leadership_tt:0 "§R[CHI_chiang_kaishek.GetName], Xi'an olayında [CHI_wang_jingwei.GetName]§! olarak değiştirilecek"
 CHI_prepare_for_a_change_in_leadership_tt_2:0 "§RLiangguang Olayı sırasında Çan Kay-Şek'i Guangzhou'ya göndermek onun daha erken ölmesine neden olacak ve $CHI_look_for_allies$'nin seçilmesine olanak tanıyacak§!"
 CHI_prepare_the_war_zones:0 "Savaş Bölgelerini Hazırla"
 CHI_prepare_the_war_zones_desc:0 "Hangi bölge üzerinde kimin sorumluluk taşıdığını bilmek için ordularımızı bölgesel hatlar boyunca yeniden düzenlemeliyiz. Bu, söz konusu bölge için uygun operasyonlar planlamamıza ve yarma yeteneğimizi en üst düzeye çıkarmamıza olanak tanıyacaktır."
 CHI_print_money_for_the_army:0 "Ordu İçin Para Bas"
 CHI_print_money_for_the_army_desc:0 "Bir ordu asla bedava değildir ve büyük bir ordu isteniyorsa ödenmesi gereken bir bedel vardır. Ancak ödemenin farklı yolları vardır ve halkımıza özellikle bu amaç için fazladan para basmalarını emredebiliriz."
 CHI_proclaim_a_new_chapter:0 "Yeni Bir Bölüm İlan Et"
 CHI_proclaim_a_new_chapter_desc:0 "Eski rejim her zaman özgürlük ve demokrasi için bir güç olduğunu iddia etti, ancak gerçek şu ki sadece güce susamışlardı. Wang Jingwei'nin gücünün pekişmesiyle, sivil hükümetin iktidar dizginlerini geri aldığını artık ilan edebiliriz."
 CHI_productive:0 "Üretken!"
 CHI_productive_desc:0 "Boş eller hiçbir şey inşa etmez! Tembellik bizi sadece geride tutmakla kalmaz, düşmana da yardım eder. Parti olarak galip geleceksek pasif ve apatik olanlarla ilgilenilmesi gerekir!"
 CHI_projecting_power:0 "Güç Yansıtma"
 CHI_projecting_power_desc:0 "Hava erişimimizi cephe hatlarımızın ötesine taşıyarak, fırsat doğan her yerde vurmaya hazırlanıyoruz. Hava gücünün yansıtılması artık bir hırs değil, stratejik bir gerekliliktir."
 CHI_promote_admiral:0 "Amiralleri Terfi Ettir"
 CHI_promote_admiral_desc:0 "Son deniz inşaat çabalarımız sonunda hasta 19. Yüzyıl savaş gemilerimizi modası geçmiş hale getirecek. Ancak bu, donanmamızın stratejik yönü etrafında optimize edilmiş bir eğitim programı ile hem mürettebat hem de komutanlar için onları eğitim gemilerine dönüştürme fırsatını temsil ediyor."
 CHI_promote_admiral_dingwen_tt:0 "§Y$CHI_jiang_dingwen_admiral$§! kişisini Amiralliğe terfi ettirir"
 CHI_promote_admiral_tt:0 "Eğer §Y$CHI_deny_the_enemy$§! alınmışsa tüm amiraller §Y$green_water_expert$§! özelliğini kazanacak \n\nEğer §Y$CHI_dominate_the_enemy$§! alınmışsa tüm amiraller §Y$blue_water_expert$§! özelliğini kazanacak "
 CHI_promote_the_national_currency:0 "Milli Para Birimini Teşvik Et"
 CHI_promote_the_national_currency_desc:0 "Gümüş standardını yeni bir milli para biriminin tanıtılmasıyla değiştirmemiz, küresel olaylara olan bağımlılığımızı azaltmada başlangıçta iyi sonuçlar gösterdi. Ancak, yeni para biriminin kullanımı en çok büyük şehirlerde yaygındır ve kırsal alanlarda benimsenmesini sağlamak için ortak bir çaba göstermeliyiz."
 CHI_propaganda_decisions_tt:0 "Propaganda kampanyaları yoluyla ittifak nüfuzu kazanma kararlarını açar"
 CHI_prosecute_cronyism:0 "Ahbap Çavuş İlişkilerini Yargıla"
 CHI_prosecute_cronyism_desc:0 "Bireylerin çıkarları çok uzun zamandır devletin ihtiyaçlarının önüne geçti. Adam kayırma, rüşvet ve zimmete para geçirme toplumumuzun dokusunu yırtıyor. Bu şimdi sona eriyor ve yeni bir erdem çağı başlıyor!"
 CHI_protracted_warfare:0 "Uzun Süreli Savaş"
 CHI_protracted_warfare_desc:0 "[JAP.GetNameDef] Rusları yendiğinden beri, halkı hızlı, saldırgan eylemin zafere giden yol olduğuna inanıyor. Bu onların dayanma gücü olmayan bir orduya sahip olmalarına yol açtı, bu yüzden onlara hızlı bir zaferi reddedersek, birlikleri kısa sürede parçalanacaktır."
 CHI_punish_the_signatories:0 "İmza Sahiplerini Cezalandır"
 CHI_punish_the_signatories_desc:0 "Batılıların ulusumuza verdiği zarar hesaplanamaz. Bizi ezilmiş halde bıraktı. Ne yaptıklarını anlamaları sağlanmalı ve tarihi borçlarını ödemeye başlamalılar."
 CHI_put_an_end_to_PRC:0 "[PRC.GetNameDef] Devletine Son Ver"
 CHI_put_an_end_to_PRC_desc:0 "Tüm Çin'i birleştirmemizin önünde gerçekten duran şey, dağlarda tutunan ve [PRC.GetLeader] tarafından yönetilen o sinir bozucu Komünistlerdir. Onlar var olduğu sürece birleşik bir Çin olmayacak. İç düşmanlar bizi zayıflatır, zayıflık yabancı saldırganlığı davet eder ve yabancı saldırganlık egemenliğimizi riske atar. Bu nedenle, [PRC.GetNameDef] devletine son vermek bizim görevimizdir!"
 CHI_rapidity_is_the_essence_of_war:0 "Sürat Savaşın Özüdür"
 CHI_rapidity_is_the_essence_of_war_desc:0 "Hız ve sürpriz en iyi silahlarımızdır ve bu unsurları nasıl kullanacağımızı öğrenmek modern savaşta çok önemli olacaktır. Cesur ve hızlı manevralar düşmanın dengesini bozacak ve böylece daha derine ve daha az direnişle saldırmamıza izin verecektir."
 CHI_reach_out_for_help:0 "Yardım İçin Ulaş"
 CHI_reach_out_for_help_desc:0 "Militarizm hayaleti doğudan Çin'e musallat oluyor ve yardım için Amerikalı bağlantılarımıza ulaşmamız gerekiyor. Japon tehdidine karşı ilk savunma hattı olduğumuzu anlamaları gerekiyor."
 CHI_reach_out_for_help_tt:0 "§Y[USA.GetNameDefCap]§! bize §YÖdünç Verme ve Kiralama§! göndermeye daha istekli olacak"
 CHI_reach_out_to_expats:0 "Gurbetçilere Ulaş"
 CHI_reach_out_to_expats_desc:0 "Halkımız dünyaya dağıldı ve kendilerine yeni hayatlar kurdu. Bazılarına göre bu zayıflığa işaret eder, ama bize göre bu bir güçtür. Bu ihtiyaç anında uzaklaşmış yurttaşlarımızı çağıracağız."
 CHI_reach_out_to_expats_tt:0 "Bağlantılarımızı ve gurbetçi topluluklarımızı kullanarak yabancı uluslardan §YArtan Aylık Ekonomik Kapasite Fazlası Kazanma§! kararlarının kilidini açar"
 CHI_reclaim_the_north:0 "Kuzeyi Geri Al"
 CHI_reclaim_the_north_desc:0 "Zorunluluktan dolayı, geçmişte kuzey topraklarının büyük bir kısmı üzerindeki hak iddiamızdan vazgeçmek zorunda kaldık. Ancak işler değişti ve şimdi çok daha güçlü bir konumdayız - kuzey mülklerimizi bir kez daha geri alacak kadar güçlü!"
 CHI_reclaim_what_was_lost:0 "Kaybedileni Geri Al"
 CHI_reclaim_what_was_lost_desc:0 "Qing, şimdiye kadar gördüğümüz en büyük imparatorluğu miras aldı ve onu yabancı güçlerin yararına harcadı. Bu, bir halk, ulus ve parti olarak bize utanç getirdi. Bu trajediyi düzeltmemiz ve Çin'in onurunu geri getirmemiz gerekiyor."
 CHI_redistribute_land:0 "Toprağı Yeniden Dağıt"
 CHI_redistribute_land_desc:0 "Ülkemizin çiftçileri büyük ölçüde kişisel kazanç için değer çıkaran toprak ağaları altında çalışıyor. Bu kabul edilemez, çünkü ülkemizin verimliliğini düşürüyor ve geride tutuyor."
 CHI_reform_the_blue_shirts:0 "Mavigömleklileri Reforme Et"
 CHI_reform_the_blue_shirts_desc:0 "Halkın Üç İlkesi Uygulama Cemiyeti — Mavigömlekliler Cemiyeti — neredeyse beş yıldır aktif, ancak sınırlı bir etkinliğe sahip. Sıradan insana yayılmadığı için hizip tam potansiyeline ulaşamadı. Örgütü bir halk cephesi olarak reforme ederek, komünistlere kendi oyunlarında meydan okuyacağız."
 CHI_reinforce_connections_with_shanghai_elites:0 "Şanghay Seçkinleri ile Bağlantıları Güçlendir"
 CHI_reinforce_connections_with_shanghai_elites_desc:0 "Şanghay'da gölgelere girip çıkarak büyük servet ve güç biriktirmiş bir grup birey var. Bu bireylere imkan sağlamak davamız için yararlı olabilir."
 CHI_reject_the_nine_powers:0 "Dokuz Gücü Reddet"
 CHI_reject_the_nine_powers_desc:0 "Denizaşırı yabancılar tarafından bize dayatılan antlaşmalar bir zayıflık anında empoze edildi, ancak şimdi onları reddedebiliriz. Her imza sahibi bilsin: Yabancılara hiçbir şey borçlu değiliz!"
 CHI_relocate_factories_from_the_coast:0 "Fabrikaları Kıyıdan Taşı"
 CHI_relocate_factories_from_the_coast_desc:0 "Ciddi bir stratejik bilmecemiz var. Sanayi merkezlerimiz kıyı şeridinde ve düşman eline geçme tehlikesiyle karşı karşıya. Üretim olmadan, direnişin uzun sürmesi beklenemez. Üretimimizi güvende tutulabilecekleri iç kesimlere taşıyacağız."
 CHI_relocate_factories_from_the_coast_tt:0 "§YMIO'ların§! ve §YFabrikaların§! taşınmasına izin verir"
 CHI_relocate_factories_from_the_coast_tt_no_aat:0 "§YFabrikaların§! taşınmasına izin verir"
 CHI_rely_on_locals:0 "Yerlilere Güven"
 CHI_rely_on_locals_desc:0 "Güçlerimiz tarafından kullanılabilecek tam bir organizasyon kurmak karmaşık, zaman alıcı ve pahalıdır. Tarih bize bir alternatif gösteriyor, neden yerel olarak bulunabilecek şeyleri nakledelim. Büyük topraklarımızda yaşayan çiftçilere ve işçilere güvenirsek, sistemimizin bıraktığı farkı telafi edebiliriz."
 CHI_remove_guerilla_decisions_tt:0 "§Y$PRC_guerilla_warfare_sea_cat$§! Kararlarını §RKaldır§!"
 CHI_remove_infiltration_decisions_tt:0 "§Y$PRC_infiltration_sea_cat$§! Kararlarını §RKaldır§!"
 CHI_reorganise_the_central_armys_academy_aviation_corps:0 "Akademi Havacılık Kolordusunu Yeniden Düzenle"
 CHI_reorganise_the_central_armys_academy_aviation_corps_desc:0 "Eğitim teknolojiyle birlikte gelişmelidir. Yarının savaşlarına uygun modern, yetenekli havacılar yetiştirmek için havacılık kolordumuzu elden geçireceğiz."
 CHI_reorganise_the_train:0 "Treni Yeniden Düzenle"
 CHI_reorganise_the_train_desc:0 "İkmal organizasyonumuz asla ihtiyaç duyduğumuz ölçeğe veya karmaşıklığa ulaşmadı. Kapsamlı bir yeniden yapılanma, çatışmaya daha fazla asker sokmamızı sağlayacaktır."
 CHI_republic_of_china_navy:0 "Çin Cumhuriyeti Donanması"
 CHI_republic_of_china_navy_desc:0 "Merkezi Donanma, yetersiz finansman ve belirsiz kıyı kontrolü gemilerimizi kötü durumda bırakarak sıkıntılı bir geçmişe sahip oldu. Ufukta sorun varken, bu zorlukları geride bırakmak hedefimizdir."
 CHI_repurpose_fort_artillery:0 "Tahkimat Topçularını Yeniden Kullan"
 CHI_repurpose_fort_artillery_desc:0 "Savaş artık kilit tahkimatlar tarafından kilitlenemez, son büyük savaşın sonu bunu gösterdi. Yapılar çok fazla değer taşımayabilirken, içlerindeki topçu parçaları hala düşmana ateş edebilir."
 CHI_repurpose_fort_artillery_tt:0 "§RSökecek hiçbir tahkimatı kontrol etmiyorsunuz§!"
 CHI_request_handover_of_coastal_cities:0 "Kıyı Şehirlerinin Devrini Talep Et"
 CHI_request_handover_of_coastal_cities_desc:0 "$PRC_dare_to_struggle_desc$"
 CHI_request_soviet_advisors:0 "Sovyet Danışmanları Talep Et"
 CHI_request_soviet_advisors_desc:0 "Savaş son on yılda radikal bir şekilde değişti ve biz geride kaldık. [SOV.GetNameDefCap] zırhlı çabalarımızı yakalamamız için bize kalifiye uzmanlar göndermeyi teklif etti ve kabul etmeliyiz."
 CHI_request_territory_trigger_tt:0 "Kontrol edilen herhangi bir eyalet:\n      §Y[ROOT.GetNameWithFlag]§! ana vatanıdır\n      Kontrolcü: $is_literally_china_tt_NOT$\n      Şunlardan biri doğru olmalıdır:\n         Kontrolcüye ait değildir\n         Kontrolcü:\n            Mevcut iktidar partisi §Y[ROOT.GetRulingIdeology]§!"
 CHI_reshuffle_the_green_gang:0 "Yeşil Çeteyi Yeniden Düzenle"
 CHI_reshuffle_the_green_gang_desc:0 "Koca Kulaklı Du bize iyi hizmet etti ama aynı zamanda çok etkili oldu. Düşmanlar etrafımızı sararken daha doğrudan eyleme ihtiyacımız var. Belki de Yeşil Çete'yi başka birinin yönetmesinin zamanı gelmiştir?"
 CHI_retake_coastal_cities:0 "Kıyı Şehirlerini Geri Al"
 CHI_retake_coastal_cities_desc:0 "Batılı emperyalistler iradelerini bize çok uzun zamandır dayattılar. Çalınanları nihayet geri almamız için zaman olgunlaştı. [326.GetName], [729.GetName] ve [728.GetName] bir kez daha krallığımızın bir parçası olmalı!"
 CHI_retreat_to_taiwan:0 "Tayvan'a Geri Çekil"
 CHI_retreat_to_taiwan_desc:0 "[PRC.GetNameDef] ile yeniden başlayan çatışmamız mutlaka lehimize gelişmedi ve zemin kaybediyoruz. Giderek daha fazla insan endişelerini dile getiriyor ve gücümüzü yeniden inşa etmek ve hayatta kalmak için Tayvan'a taktiksel bir geri çekilme yapmamızı açıkça savunuyor."
 CHI_revise_the_national_curriculum:0 "Milli Müfredatı Gözden Geçir"
 CHI_revise_the_national_curriculum_desc:0 "Bizimki gibi büyük bir ülkede birçok farklı duruşun olması şaşırtıcı değil. İstenilen bazı davranışları teşvik etmek için eğitim sistemimizi standartlaştırabilir ve organize edebiliriz."
 CHI_revive_the_chinese_action_committee:0 "Çin Eylem Komitesini Canlandır"
 CHI_revive_the_chinese_action_committee_desc:0 "KMT orduya erişimi tekeline alarak gücü küçük bir kliğe çekti. Ancak, bazı askeri deneyime sahip muhalifler, Komünistleri de desteklemeseler bile iktidar grubuyla aynı fikirde değiller."
 CHI_revive_the_chinese_action_committee_tt:0 "§Y$CHI_jiang_guangnai$§!, §Y$CHI_cai_tingkai$§! ve §Y$CHI_chen_mingshu$§!, §YGeneral§! olarak kullanılabilir hale gelir"
 CHI_revive_the_new_culture_movement:0 "Yeni Kültür Hareketini Canlandır"
 CHI_revive_the_new_culture_movement_desc:0 "ÇKP ve KMT içindeki ilk devrimcilerin çoğu, hem Qing Hanedanlığına hem de Yuan Shikai'ye karşı çıkan Yeni Kültür Hareketi'nden ilham almıştır. Sadece Yeni Kültür Hareketi'nin ruhuyla yeni bir Çin geçmişin küllerinden doğacaktır!"
 CHI_revive_the_western_hills_group:0 "Batı Tepeleri Grubunu Canlandır"
 CHI_revive_the_western_hills_group_desc:0 "[ROOT.GetNameDefCap] çok uzun zamandır yabancı güçlerin etkisi altında. Lin Sen ve Dai Jitao tarafından sürdürülen bir çizgi olan geleneğe dönüşe ihtiyaç var. Bu, Dr. Sun'ın fikirlerini çarpıtmadan, amaçlandığı gibi gerçekleştirmemizi sağlayacaktır."
 CHI_river_crossing_studies:0 "Nehir Geçişi Çalışmaları"
 CHI_river_crossing_studies_desc:0 "Çin büyük nehirlerin olduğu bir ülkedir ve içinde faaliyet gösterecek herhangi bir ordu, nehirler arasında nasıl savaşılacağını öğrenmek zorunda kalacaktır. Bundan ders çıkarmak ve bu dersleri uygulamaya koymak için özellikle iyi bir noktadayız. İstilacıları kovmak ve savaşı yurtdışına taşımak için bize fayda sağlayacak dersler."
 CHI_rocaf:0 "Milliyetçi Hava Kuvvetlerini Güçlendir"
 CHI_rocaf_desc:0 "[ROOT.GetName] göklerini güvence altına almak ve gücümüzü sınırlarımızın ötesine yansıtmak için Hava Kuvvetlerini güçlendirmeliyiz. Doktrin ve teknik uzmanlığa yapılan yatırım, herhangi bir düşmana meydan okuyabilecek modern bir hava kolunun temelini oluşturur."
 CHI_rural_reconstruction_movement_sea:0 "Kırsal Yeniden Yapılanma Hareketi"
 CHI_rural_reconstruction_movement_sea_2_tt:0 "§YKırsal Vesayet§! kararları artık hedeflenen eyaletlere §Y$CHI_local_rural_reconstruction_modifier$§! de uygular"
 CHI_rural_reconstruction_movement_sea_desc:0 "Şehirlerimiz modernitenin dinamik merkezleridir, ancak aynı şey kırsal kesim için söylenemez. Köylerimizde ekonomik refahı ve ideolojik desteği genişletmek için uyumlu çabalar göstermeliyiz. Tam nüfuzumuzla ulaşarak, aksi takdirde ihmal edilecek alanları kullanabiliriz."
 CHI_rural_reconstruction_movement_sea_tt:0 "Hem §YKırsal hem de Kentsel Siyasi Vesayet§! kararları için kaldırma süresini §G10§! gün azaltır"
 CHI_salvage_enemy_equipment:0 "Düşman Teçhizatını Kurtar"
 CHI_salvage_enemy_equipment_desc:0 "Milli Devrim Ordusu'nun ihtiyaçları endüstrimiz tarafından karşılanamaz durumda. Birimlerimiz bu tutarsızlığın bir kısmını düşman kampında bulduklarımızı yeniden kullanarak telafi edebilir."
 CHI_salvage_enemy_equipment_random_generals_tt:0 "Rastgele seçilen §YBeş§! ordu lideri §Y$Scavenger$§! kazanacak: \n-$MODIFIER_EQUIPMENT_CAPTURE$: §G+%3§! "
 CHI_scout_for_air_experts:0 "Hava Uzmanları Ara"
 CHI_scout_for_air_experts_desc:0 "Hava kuvvetlerimiz henüz emekleme aşamasında ve birçok zorlukla mücadele ediliyor. Başkalarının uzmanlığından yararlanarak hava kuvvetlerinin çabalarını kolaylaştıracağız."
