 CHI_sea_60_divisions_plan:0 "$CHI_60_divisions_plan$"
 CHI_sea_60_divisions_plan_desc:0 "$CHI_60_divisions_plan_desc$"
 CHI_sea_a_new_expedition:0 "Yeni Bir Sefer"
 CHI_sea_a_new_expedition_desc:0 "Merkezi Hükümet bocalarken Kuzey Seferi'nin mirasını hatırlamalı ve başkentleri ele geçirmeliyiz. Onların yönetimimiz altında olmasıyla Çin üzerindeki meşru otorite olarak tanınmamız an meselesi olacak."
 CHI_sea_annex_tuva:0 "Tuva'yı İlhak Et"
 CHI_sea_annex_tuva_desc:0 "Tuva bir zamanlar devletimizin bir parçasıydı ancak devrimden sonra Ruslar onları bizden çaldı. Onları güneydeki kardeşleriyle yeniden birleştirmeye ve Rusların elinden kurtarmaya çalışmalıyız."
