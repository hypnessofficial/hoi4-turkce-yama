 PRC_sea_protracted_warfare_desc:0 "$PRC_protracted_warfare_desc$"
 PRC_sea_provoke_japan:0 "$PRC_provoke_japan$"
 PRC_sea_provoke_japan_desc:0 "$PRC_provoke_japan_desc$"
 PRC_sea_rally_the_industry:0 "Endüstriyi Topla"
 PRC_sea_rally_the_industry_desc:0 "İşbirlikçi bir işçi sınıfı ve devrimimizi destekleyecek sanayi tabanı olmadan, devrim sadece sönüp gidecektir. Bu nedenle onları kendi tarafımıza çekmemiz zorunludur."
 PRC_sea_reforming_our_ranks:0 "Saflarımızı Yeniden Düzenle"
 PRC_sea_reforming_our_ranks_desc:0 "Devrimimizin başarısını sağlamak için saflarımızı yeniden düzenlemeli ve sırasıyla kırsal sınıfı toplamalıyız. Onların yardımı olmadan işlevsel bir ordumuz olmayacak, ancak onların yanımızda olmasıyla hasımlarımıza karşı bir avantaj elde edebiliriz."
 PRC_sea_revolutionary_military_commission:0 "$PRC_revolutionary_military_commission$"
 PRC_sea_revolutionary_military_commission_desc:0 "$PRC_revolutionary_military_commission_desc$"
 PRC_sea_soviet_advisors:0 "Sovyet Danışmanlar"
 PRC_sea_soviet_advisors_desc:0 "Sovyetlerin Çin'de aktif birkaç ajanı var. Milliyetçi hükümeti yeneceksek onları işe almalı ve uzmanlıklarını kullanmalıyız."
 PRC_sea_strengthen_the_central_secretariat:0 "$PRC_strengthen_the_central_secretariat$"
 PRC_sea_strengthen_the_central_secretariat_desc:0 "$PRC_strengthen_the_central_secretariat_desc$"
 PRC_sea_the_yanan_base_area:0 "[ROOT.Capital.GetName] Üs Bölgesi"
 PRC_sea_the_yanan_base_area_desc:0 "Yeni devrimimizin temeli [ROOT.Capital.GetName] bölgesindedir. Yaklaşan mücadelede galip gelmek istiyorsak, bu bölge genişletilmeli ve geliştirilmelidir."
 PRC_sea_toe_the_soviet_line:0 "Sovyet Çizgisine Uy"
 PRC_sea_toe_the_soviet_line_desc:0 "Çin Devrimi'nin ancak Sovyet yardımıyla başarılı olabileceği açıkça ortaya çıktı. Parti içinde birçok kişi farklı görüşlere sahip olsa da, haklı olup olmadıklarını sadece zaman gösterecek."
 PRC_secure_lend_lease_from_soviet:0 "[SOV.GetNameDef] Devletinden Ödünç Verme ve Kiralama Sağla"
 PRC_secure_lend_lease_from_soviet_desc:0 "[SOV.GetNameDef] ile kara bağlantısı kurmaya yönelik geçmiş çabalar feci şekilde başarısız oldu. Ancak şimdi bunu aştığımıza göre, onlardan ikmal almak çok daha kolay olacak."
 PRC_secure_the_lands:0 "Toprakları Güvenceye Al"
 PRC_secure_the_lands_desc:0 "Hedeflerimizin gerçekleşmesine her zamankinden daha yakınız - şimdi tereddüt etmemeliyiz. Sahte hükümetin kontrolü altındaki nüfusu davamızın adaletine ikna etmek için daha fazla kaynak harcamalıyız."
 PRC_secure_the_peoples_support:0 "Halkın Desteğini Güvenceye Al"
 PRC_secure_the_peoples_support_desc:0 "Çin'in çoğunluğu üzerinde kontrole sahip olmasak da, tekrar bir iç savaş çıkması durumunda halkının davamıza sadakatini sağlamalıyız."
 PRC_secure_the_peoples_support_tt:0 "§Y$PRC_infiltration_sea_cat$§! Kararlarının tüm §Y3 seviyesinin§! kilidini açar."
 PRC_seek_support_from_ussr:0 "[SOU.GetNameDef] Desteği Ara"
 PRC_seek_support_from_ussr_desc:0 "Uzun süredir müttefikimiz olan [SOU.GetNameDef], devrimimize hayati yardım sağladı. Ancak devrimin başarılı olması için bu yardımı daha da artırmalarını istemeliyiz. Sonuçta devrimimizin başarısı, çabalarını diğer sınırlara odaklamalarına olanak tanıyacaktır."
 PRC_sino_allied_pact_of_non_aggression:0 "Çin-Müttefik Saldırmazlık Paktı"
 PRC_sino_allied_pact_of_non_aggression_accept_tt:0 "§Y[ROOT.GetName]§! ile bir §YSaldırmazlık Paktı§! imzalayacaklar"
 PRC_sino_allied_pact_of_non_aggression_desc:0 "Yabancı etkisini Çin'den uzaklaştırırken, daha az yayılmacı büyük güçlerin dahil olmamasını sağlamalıyız."
 PRC_soviet_battle_tactics:0 "Sovyet Muharebe Taktikleri"
 PRC_soviet_battle_tactics_desc:0 "[SOV.GetNameDef] taktiklerini takliterek, kendi sayısal üstünlüğümüzü avantajımıza kullanmayı hedefleyebiliriz. [SOV.GetNameDef] deneyiminden dersler çıkarmakla görevli bir subay ekibimiz olacak."
 PRC_soviet_technological_cooperation:0 "Sovyet Teknolojik İşbirliği"
 PRC_soviet_technological_cooperation_desc:0 "Her iki ulusumuzun davasını ilerletmek için bir araştırma anlaşması için [SOV.GetNameDef] devletine bakacağız."
 PRC_strengthen_the_air_arsenal:0 "Hava Cephaneliğini Güçlendir"
 PRC_strengthen_the_air_arsenal_desc:0 "Hava kuvvetlerimizi geliştirmek için, şimdiye kadarki deneyimlerimize dayanarak teçhizatımızı geliştirmeye yatırım yapmalıyız. Tasarımlarımızı şimdi daha güvenilir hale getirmek için yapılacak bir kerelik yatırım, ileride değiştirmelerden tasarruf etmemizi bile sağlayabilir."
 PRC_strengthen_the_central_party_school:0 "Merkez Parti Okulunu Güçlendir"
 PRC_strengthen_the_central_party_school_desc:0 "Merkez Parti Okulu aracılığıyla yeni parti yetkilileri yetiştirmek, Sovyetler Birliği'nde eğitilen 28 ½ Bolşevik ve destekçilerinin giderek bu okul tarafından eğitilen yetkililer tarafından sayıca geçileceği anlamına gelir."
 PRC_strict_training_regiments:0 "Sıkı Eğitim Rejimi"
 PRC_strict_training_regiments_desc:0 "Kızıl Ordu'nun disiplinini sıkılaştırmalıyız.\n\nGünlük sabah eğitim rutinleri kısa sürede profesyonel bir orduya yol açacak ve hat birimlerine ulaşan acemilerin kalitesini artıracaktır."
 PRC_subjugate_korea:0 "Kore'ye Boyun Eğdir"
 PRC_subjugate_korea_desc:0 "[JAP.GetNameDef] tarafından Kore'nin işgali ve ardından Mançurya'ya genişlemeleri, müttefik bir Kore'nin [ROOT.GetAdjective] güvenliği için çok önemli olduğunu göstermektedir. Eğer bu şu anda bir seçenek değilse, müdahale etmeliyiz."
 PRC_submarines:0 "Kıyı Denizaltıları"
 PRC_submarines_desc:0 "Kıyı sularımızda denizaltıların kullanımı, kıyı altyapımızı korumanın uygun maliyetli ve hayatta kalabilir bir yolu olacaktır. Bu denizaltılar büyük derinlikler için tasarlanmamış olsa da, en azından daha gelişmiş modeller geliştirmeye yönelik bir adım olacaktır."
 PRC_supreme_infiltration:0 "Üstün Sızma"
 PRC_supreme_infiltration_desc:0 "Önceki sızma deneyimimiz sayesinde, artık bu tür operasyonları genişletmek için kullanabileceğimiz ve giderek daha fazla vatandaşımızı kendi tarafımıza çekebileceğimiz dersler aldık."
 PRC_taiwan:0 "Tayvan'ı Güvenceye Al"
 PRC_taiwan_desc:0 "Hava veya deniz desteği gerekliliği benzersiz bir zorluk teşkil etse bile, eski Qing hükümeti tarafından Japonlara Tayvan'ın kaybedilmesi geri alınmalıdır."
 PRC_tech_agreement_with_ussr:0 "Yeni Savunma Teknolojileri Anlaşması"
 PRC_tech_agreement_with_ussr_desc:0 "Devrimimizin ileri durumu, [SOV.GetNameDef] ile ortaklığımıza araştırmalarla katkıda bulunmamızı sağlıyor. Çeşitli alanlarda teknolojilerini yakaladıktan sonra, ekipmanlarının değerlendirmesini, onu geliştirmiş olmanın getirdiği önyargılardan arınmış olarak paylaşabiliriz."
 PRC_the_battle_behind_the_front_lines:0 "Düşman Hatlarının Gerisindeki Savaş"
 PRC_the_battle_behind_the_front_lines_desc:0 "Yabancı saldırganlara hatlarının gerisinde saldırmak için çabalarımızı iki katına çıkarmalıyız. İkmallerini ve cephe hatlarını takviye etme yeteneklerini engelleyerek, düşmanı gerilerini korumak için değerli insan gücü harcamaya zorluyoruz."
 PRC_the_chinese_century:0 "Çin Yüzyılı"
 PRC_the_chinese_century_desc:0 "Dünyayı şekillendirecek kadar siyasi güçle birleşen ekonomik büyüme, bu ulusun özlemini duyduğu şeydi ve şimdi buna kavuştu. Çin'in Yükselişi şimdi başlıyor - bu bizim yüzyılımız."
 PRC_the_eastward_expedition:0 "Doğu Seferi"
 PRC_the_eastward_expedition_desc:0 "Doğumuzda [SHX.GetLeader], [615.GetName] bölgesini yönetiyor, ancak Sarı Nehir boyunca savunmalarını delebiliriz."
 PRC_the_end_of_capitalism:0 "Kapitalizmin Sonu"
 PRC_the_end_of_capitalism_desc:0 "[SOV.GetNameDef] ile yakın işbirliğimiz ittifakımızı kapitalist güçlere meydan okuyabilecek kadar güçlendirdi. Birlikte devrimi yayabilir ve sömürge topraklarını özgürleştirebiliriz."
 PRC_the_fight_of_a_people:0 "Bir Halkın Kavgası"
 PRC_the_fight_of_a_people_desc:0 "Halkımız, kendilerini onlar tarafından işgal edilen topraklarda bulsalar bile düşmanlarımızın ilerlemesine direnmelidir. İşgalciyi etkili bir şekilde baltalamak ve nihayetinde anavatanı kurtarmak için yerel direnişi toplamak üzere küçük birimler göndermeliyiz."
 PRC_the_first_premier:0 "İlk Başbakan"
 PRC_the_first_premier_desc:0 "$PRC_zhou_enlai$, $PRC_proclaimed_communism$ ilk Başbakanı olarak adlandırılacak ve Parti'nin en önde gelen politikacılarından biri olarak konumunu sağlamlaştıracak."
 PRC_the_internal_enemy:0 "İç Düşman"
 PRC_the_internal_enemy_desc:0 "[CHI.GetLeader] ve [CHI.GetRulingParty] hükümetine karşı mücadele on yıldır devam ediyor. 12 Nisan 1927 tasfiyesini hatırlıyoruz ve bu tür bir aşağılamanın bir daha asla tekrarlanmamasını sağlamalıyız."
 PRC_the_long_march_towards_progress:0 "İlerlemeye Doğru Uzun Yürüyüş"
 PRC_the_long_march_towards_progress_desc:0 "İlerlemeye devam etmeliyiz. Teknolojik olarak geride olabiliriz ama öyle kalmayacağız. [ROOT.GetNameDef] içindeki eğitim sektörünü güçlendirmeye kaynak ayrılmalıdır."
 PRC_the_march_to_victory:0 "Zafere Yürüyüş"
 PRC_the_march_to_victory_desc:0 "Zafere Yürüyüş kaçınılmazdır. İsteksiz bir Diarşi olarak başlayan şey, güçlü ve birleşik bir parti yapısının yaratılmasına yol açtı. Şimdi dışarıya, iç düşmanlarımıza bakmalıyız."
 PRC_the_northeast_aviation_university_sea:0 "Kuzeydoğu Havacılık Üniversitesi"
 PRC_the_northeast_aviation_university_sea_desc:0 "Hava kuvvetlerimiz için büyük ölçekli bir eğitim merkezi kurmak ileriye doğru büyük bir adım olacaktır. Subaylarımıza doktrini, teçhizatımızı nasıl kullanacaklarını veya bu becerileri cesur pilotlarımıza nasıl aktaracaklarını öğretmek için artık yurtdışındaki okullara güvenmek zorunda kalmayacağız."
 PRC_the_party_builds_the_nation:0 "Parti Ulusu İnşa Ediyor"
 PRC_the_party_builds_the_nation_desc:0 "Artık Çin'in büyük bir kısmını kontrol ettiğimize göre, nüfusumuzu ve gelişmekte olan endüstrimizi kullanmak için ülke çapında bir kampanya başlatmanın zamanı geldi."
 PRC_the_peoples_republic:0 "Halk Cumhuriyeti"
 PRC_the_peoples_republic_desc:0 "Devrim sağlam bir şekilde kurulduğuna göre, devrimci bir devletten reformlarıyla vatandaşlarına istikrar ve refah sunabilecek bir devlete geçiş yapmaya başlayabiliriz."
 PRC_the_pla_naval_school:0 "HKO Deniz Okulu"
 PRC_the_pla_naval_school_desc:0 "Yeni subayların ve denizcilerin eğitildiği yeni bir eğitim merkezi, navigasyondan uçak tasarımına ve bakımına kadar uzanan kurslarla büyük bir gemide gereken birçok beceriyi öğretmek için merkezi bir yer oluşturabilir."
 PRC_the_response_to_a_threat:0 "Bir Tehdide Yanıt"
 PRC_the_response_to_a_threat_desc:0 "Bizi çevreleyen tüm tehditlere yanıt vermek için yapılması gerekeni yapacağız. Saldırıya hazırlanmalıyız."
 PRC_the_unwilling_diarchy_focus:0 "İsteksiz Diarşi"
 PRC_the_unwilling_diarchy_focus_desc:0 "Çaresiz zamanlar çaresiz önlemler gerektirir - yeni liderliğin Halkın herhangi bir düşmanına karşı hızla hareket etme yetkisine sahip olmasını sağlamak için mevcut Parti Organlarını değiştirmeliyiz. \n\nMao ve Guotao farklılıklarını bir kenara bırakıp birlikte çalışmalıdır."
 PRC_the_unwilling_diarchy_focus_tt:0 "§Yİkinci Birleşik Cepheyi§! oluşturamayacak veya katılamayacaksınız!"
 PRC_the_westward_expedition:0 "Batıya Genişleme"
 PRC_the_westward_expedition_desc:0 "Batıdaki [NXM.GetNameDefCap], genişlememiz için birinci sınıf bir fırsat sunuyor. [1045.GetName] sınırı boyunca bir çatışma organize edersek, bize olan dikkatsizliklerinden yararlanabiliriz."
 PRC_this_might_anger_current_china_leader_tt:0 "Bu eylem §H[WTT_current_china_leader.GetNameDef]§! hükûmetini kızdırabilir."
 PRC_three_rules_of_discipline:0 "Üç Disiplin Kuralını Aşıla"
 PRC_three_rules_of_discipline_desc:0 "Mao'nun askeri stratejisinin bir parçası olarak 20'lerde resmileştirdiği gibi, halktan daha fazla destek kazanmak istiyorsak, birliklerimizin güçlerini mülk çalmak için kullanmamaları çok önemlidir. Ve sınırlı kaynaklarımızdan tam olarak yararlanmak istiyorsak, düşmandan alınan eşyaların dağıtılmak üzere yüksek komutaya verilmesi de kritiktir."
 PRC_to_serve_the_people:0 "Halka Hizmet Etmek İçin"
 PRC_to_serve_the_people_desc:0 "Birliklerimizin halkımızın çıkarına olan şeyler için savaşmayı amaçladığımızı hissetmelerini sağlamalıyız. Askerler yine de ulusa karşı görevlerini yerine getirmelidir ve orduda olmayanlar da öyle."
 PRC_to_steal_an_army:0 "Bir Ordu Çalmak İçin"
 PRC_to_steal_an_army_desc:0 "Sınırlı endüstrimiz ordumuzun ihtiyaçlarına ayak uyduramadığı için, mümkün olduğunda ele geçirilen teçhizatı kullanmak çok önemli hale geldi. Bu lojistik zorluklar yaratabilir, ancak uygun hazırlık ve yedek parça temini gibi önlemlerle bunların üstesinden gelinebilir."
 PRC_to_support_the_army:0 "Orduyu Desteklemek İçin"
 PRC_to_support_the_army_1_tt:0 "§Y$PRC_emergency_supply_protocols$§! tamamlandığında:"
 PRC_to_support_the_army_2_tt:0 "§Y$PRC_emergency_prodction_protocols$§! tamamlandığında:"
 PRC_to_support_the_army_desc:0 "Alınan önlemleri genişletmek ve bu değişiklikleri kalıcı hale getirmek için ne gerekiyorsa yapacağız. Ordu, Devrime liderlik etmek için ihtiyaç duyduğu şeye sahip olmalıdır."
 PRC_to_unify_a_country:0 "Bir Ülkeyi Birleştirmek"
 PRC_to_unify_a_country_desc:0 "Diğer savaş ağalarının topraklarında hem siyasi hem de askeri olarak konumumuz güçlenmişken, bunun hak ettiği kaynakları ve tanınmayı kazanmamızı talep etmeliyiz."
 PRC_to_unify_a_country_tt:0 "§Y[ROOT.GetName]§! tarafından başarıyla §YSızılan§! herhangi bir eyaleti teslim eder"
 PRC_towards_one_china:0 "Tek Çin'e Doğru"
 PRC_towards_one_china_bypass_tt:0 "§YHer Çin Ulusu§!: Şunlardan biri doğru olmalıdır: \n  Mevcut değil\n  §Y[ROOT.GetNameWithFlag]§! ile savaşta\n  §Y[ROOT.GetNameWithFlag]§! bağlı devleti\n  §Y[ROOT.GetNameWithFlag]§! ile bir ittifakta\n  §Y[ROOT.GetName]§!: onlara karşı bir §Ysavaş hedefine§! sahip."
 PRC_towards_one_china_desc:0 "Savaş ağası devletleri Çin'in istikrarını var olmaya devam edemeyecek kadar tehlikeye atıyor ve bu nedenle merkezi liderlik kurulmalı."
 PRC_towards_one_china_tt:0 "Müttefik olmayan her Çin ülkesine karşı §Yİlhak§! savaş hedefi kazanır. Mevcut etki:"
 PRC_two_soviets_together:0 "İki Sovyet, Birlikte"
 PRC_two_soviets_together_desc:0 "İdeolojimizle belirlediğimiz değişen rotaya rağmen, [SOV.GetNameDef] ile hala güçlü ideolojik bağlarımız var ve elbette yıllar boyunca verdikleri maddi ve siyasi desteği unutmadık."
 PRC_unlock_border_defense_raids_tt:0 "§Y$STATE_615$§! ve §Y$STATE_1045$§! bölgelerine karşı §Y$raid_type_PRC_probe_border_defenses_raid$§! Baskınlarının kilidini açar"
 PRC_unlock_complete_infiltration_tt:0 "§Yseviye 3 $PRC_infiltration_sea_cat$§! Kararlarının kilidini açar:"
 PRC_unwilling_diarchy_shortcut:0 "Siyaset: İsteksiz Diarşi"
 PRC_urbanization:0 "Kentleşmeyi Teşvik Et"
 PRC_urbanization_desc:0 "Ağır sanayinin gelişimini teşvik etmek için, daha önce kendi kendine yeten çiftçileri sanayimizde çalışmaya teşvik etmeliyiz, devlet ise diğer çiftçilerin hem şehirlere hem de kırsala dağıtacak kadar üretim yapmasını sağlar."
 PRC_urbanization_two:0 "Kentleşme Çabalarını Genişlet"
 PRC_urbanization_two_desc:0 "Şehirlerimizin genişlemesi, artık evler ve işler yaratmak için daha büyük inşaat projelerini barındırabileceğimiz anlamına geliyor. Daha fazla insanın şehirlere taşınmasına izin vereceğiz ve inşaat devam ederken iş sağlayacağız."
 PRC_urbanization_two_tt:0 "Eğer §YXian§! ve §YShanxi§! kontrol ediliyorsa, §YKentsel Bölgeler§! haline gelecekler ve şunları verecekler: \n §G3§! İnşaat Yuvası \n §G1§! §YSivil Fabrika§! \n Şunları sağlayan §YKentleşme İlerlemesi§! ekle: \nYerel İnşaat Hızı: §G+%10§!"
 PRC_usurp_control_over_yanan:0 "Yan'an Üzerindeki Kontrolü Gasp Et"
 PRC_usurp_control_over_yanan_desc:0 "Güneyimizdeki [1032.GetName], sağlam bir üs sahasını yeniden kurma girişimimizde mantıklı bir sonraki adımı temsil ediyor."
 PRC_usurp_control_over_yanan_tt:0 "[ROOT.GetName], §Y[CHI.GetName]§! ile §Ybir ittifakta§! ise ve başka bir ülke §Y[1032.GetName]§! ve §Y[744.GetName]§! veya §Y[283.GetName]§! bölgelerinden birini kontrol ediyorsa:"
 PRC_winning_border_war_result_tt:0 "§YSınır Savaşı'nı§! §Ykazanarak§!:"
 PRC_with_inspiration_from_nkvd:0 "NKVD'den İlham Alarak"
 PRC_with_inspiration_from_nkvd_desc:0 "Liderlerimizin çoğunun Sovyet yetkililerle bağlantıları aracılığıyla duyduğu Sovyet NKVD, içeriden gelen düşmanlara karşı nasıl korunulacağına dair bir örnek teşkil etmelidir."
 PRC_yanan_rectification_movement:0 "Yan'an Doğrultma Hareketi"
 PRC_yanan_rectification_movement_desc:0 "Rejimimizin başarıları şu ana kadar Mao'ya atfedilebilir ve bu prestiji Maoizmi partimizde sağlamlaştırmak için kullanmalıyız. Parti tüzüğünü Mao'nun fikirlerini içerecek şekilde değiştirmek ve bunların komünizmin Çin'in özel koşullarına uyarlanmış ilk biçimi olduğunu iddia etmek, bu fikirlere karşı çıkmayı daha zor hale getirecektir."
 PRC_yanan_rectification_movement_tt:0 "§Y$PRC_communist_power_struggle$§! içindeki mevcut değere bağlı olarak, §Y$PRC_maoism_dynamic_modifier$§! farklı etkenler alacaktır.\nMevcut Etki:"
 PRC_zhang_guatao_arrived:0 "§Y$PRC_zhang_guotao$§! Shaanxi'ye vardı"
 PRC_zhang_guotao_ascends:0 "$PRC_zhang_guotao$ Yükseliyor"
 PRC_zhang_guotao_ascends_desc:0 "$PRC_zhang_guotao$, [ROOT.GetNameDef] devletinin gerçek lideri olarak tek başına duruyor.\n\n$PRC_mao_zedong$ artık Başkan Guotao ile aynı seviyede olamaz, sadece tek bir lider olabilir."
 Pan_pacific_trade_union_secretariat:0 "Pan Pasifik Sendikalar Sekreterliği"
 SIC_anti_communism:0 "Anti-Komünizm"
 SIC_anti_communism_desc:0 "Yang Sen, daha önce ildeki komünist sızmayı önlemek için aktif olarak savaşmış olan, anti-komünizmin aktif bir savunucusudur. Sıçuan'ın yanlış ellere düşmesini önlemek için bu politikayı sürdürmeliyiz."
 SIC_armor_efforts:0 "Zırhlı Birlik Çabaları"
 SIC_armor_efforts_desc:0 "Sahip olduğumuz zırhlı ve hava kuvvetleri yetenekleri modern bir çatışma için çok küçük. Yabancı tehditlere karşı koymak için teknolojimizi geliştirmeye çalışmalıyız."
 SIC_develop_chongqing:0 "Çongçing'i Geliştir"
 SIC_develop_chongqing_desc:0 "Çongçing Sıçuan'ın kalbidir ve burayı daha da sanayileştirmeye çalışmalıyız. Yabancı veya dahili tehditlere karşı duracaksak, bunu yapacak endüstriyel desteğe de sahip olmalıyız."
 SIC_develop_xikang:0 "Xikang'ı Geliştir"
 SIC_develop_xikang_desc:0 "Xikang seyrek nüfuslu ve dağlıktır, bu da illerin kalkınması söz konusu olduğunda genellikle göz ardı edildiği anlamına gelir. Halkın teveccühünü kazanmak ve dolayısıyla ekonomik tabanımızı da iyileştirmek için bu bölgeye yatırım yapmaya çalışmalıyız."
 SIC_drive_out_the_japanese:0 "Japonları Kov"
 SIC_drive_out_the_japanese_desc:0 "Japonların Çinlileri boyunduruk altına alma girişimi derhal sona ermelidir. Tam askeri zaferleri hala gerçekçi görünmese de, onları durdurmalı ve gidişatı kesin olarak tersine çevirmeliyiz. Onları şanlı ulusumuzdan kovmaya çalışmalıyız!"
 SIC_push_back_the_tibetans:0 "Tibetlileri Geri Püskürt"
 SIC_push_back_the_tibetans_desc:0 "Harekete geçme zamanı nihayet geldi. 1932'de tehdit ettiğimiz gibi Jinsha nehrini kararlı bir şekilde geçerek Chamdo'ya girmeli ve sonunda Xikang'ı yönetimimiz altında birleştirmeliyiz!"
 SIC_sichuan_still_stands:0 "Sıçuan Hâlâ Ayakta"
 SIC_sichuan_still_stands_desc:0 "Merkezi Hükümet, Liu Xiang'ın ölümünden sonra Çongçing'e yürümenin teslim olacağımız anlamına geleceğini ummuş olsa da, durum böyle olmadı. Bunun yerine Çin'de meşru bir güç olduğumuzu ve gerekirse Merkezi Hükümete karşı durabileceğimizi kanıtladık."
 SIC_the_armies_of_yang_sen:0 "Yang Sen'in Orduları"
 SIC_the_armies_of_yang_sen_desc:0 "Yang Sen, 1924'ten 1925'e kadar Sıçuan Valisi olan, ardından İngilizlerle çatışan ve 1926'da Kuomintang'a katılan, halihazırda oldukça kapsamlı bir askeri kariyere sahip bir generaldir. Askeri yeteneklerimizi ilerletmek için onun desteğini kazanmaya çalışmalıyız."
 SIC_the_domain_of_liu_wenhui:0 "Liu Wenhui'nin Hakimiyeti"
 SIC_the_domain_of_liu_wenhui_desc:0 "Liu Xiang'ın amcası ve eski rakibi olan Liu Wenhui, Xikang ilinde kendine ait küçük bir krallık kurdu. Başlangıçta Sıçuan Valisi olan Liu Wenhui, 1935'te görevden alındı ve o zamandan beri Xikang'ı, muhtemelen tüm Xikang'ı kendi yönetimi altında birleştirme hırsıyla, işlevsel olarak bağımsız bir bölge olarak yönetiyor."
 SIC_the_governor_of_sichuan:0 "Sıçuan Valisi"
 SIC_the_governor_of_sichuan_desc:0 "Liu Wenhui'nin yeğeni ve mevcut vali olan Liu Xiang, Sıçuan'ın en zengin ve en önemli kısmını kontrol ediyor. Reformlarına devam ederek teknolojik yeteneklerimizi geliştirirken burayı daha da geliştirmeye çalışmalıyız."
 SIC_the_sichuan_clique:0 "Sıçuan Kliği"
 SIC_the_sichuan_clique_desc:0 "Sıçuan Kliği, bir tür il birliği fikriyle gevşek bir şekilde bir arada tutulan farklı görüşlü savaş ağalarının toprakları olarak ilginç bir konumda bulunuyor. Büyümek ve halihazırda olduğumuzdan daha güçlü olmak için bu savaş ağalarının farklı güçlerini kullanmalıyız."
 SIK_a_new_nationality_policy:0 "Yeni Bir Milliyet Politikası"
 SIK_a_new_nationality_policy_desc:0 "Bir grubun hepsine hükmettiği değil, birçoğunun uyum içinde yaşadığı Sovyet milliyet politikasını benimsemeliyiz. Bunu yaparak Hanlara Uygurca okuma ve yazma öğretilmeli ve tam tersi de yapılmalıdır. Ayrıca resmi hükümet unsurları içinde ateizmi zorunlu kılacağız, ancak daha istikrarlı ve birleşik bir il sağlamak için halka inançlarını uygulama özgürlüğü vereceğiz."
 SIK_a_new_xinjiang:0 "Yeni Bir Sincan"
 SIK_a_new_xinjiang_desc:0 "Endüstrilerimiz modernize edildiğine ve halkımıza okuma yazma öğretildiğine göre, ilimiz geleceğe giden yolda bir sonraki adımı atmaya hazır. Şimdi, Sincan'ın ve halkının modern dünyayla entegrasyonu için büyük bir projeye başlayacağız ve küresel sahnede yerimizi almaya hazırlanacağız!"
 SIK_a_soviet_airforce:0 "Bir Sovyet Hava Kuvvetleri"
 SIK_a_soviet_airforce_desc:0 "[SOV.GetNameDef] ile artan ilişkilerimiz sayesinde onlardan uçak edinebileceğiz. Buna ek olarak, Urumçi'de pilot okulları kurmaya hazırlandılar ve bizi savaşın geleceğine hazırlamaya yardımcı olmak için danışmanlar göndermeye başladılar."
 SIK_a_united_sinkiang_clique:0 "Birleşik Bir Sincan Kliği"
 SIK_a_united_sinkiang_clique_desc:0 "Yeni 36. Tümen kovulduğunda ve Sincan tamamen yönetimimiz altına girdiğinde artık bölgede müthiş bir güç olarak duruyoruz. Şimdi bakışlarımızı doğuya çevirmeli ve yoldaşlarımızın ve müttefiklerimizin Japon işgalcilere karşı toprak bütünlüğünü sağlamalıyız."
 SIK_cooperate_with_the_nkvd:0 "NKVD ile İşbirliği Yap"
 SIK_cooperate_with_the_nkvd_desc:0 "[SOV.GetNameDef] ile ilişkilerimizi güçlendirirken yönetimimizi güvence altına almak ve Urumçi'yi yabancı komploculardan korumak için NKVD ile işbirliği yapmalı ve ülkemizde uygun bir varlık kurmalarına yardımcı olmalıyız."
 SIK_cooperate_with_the_ussr:0 "SSCB ile İşbirliği Yap"
 SIK_cooperate_with_the_ussr_desc:0 "Sovyetler Birliği ile ilişkimiz Çin içinde benzersizdir ve toprak bütünlüğümüzü sağlamak için bunu kullanmalıyız. Onların yardımıyla Kuomintang'ı ilimizden nihayet kovabiliriz."
 SIK_ensure_a_clean_government:0 "Temiz Bir Hükümet Sağla"
 SIK_ensure_a_clean_government_desc:0 "Altı büyük politikadan biri, yolsuzluktan ama aynı zamanda fitneden arınmış bir hükümeti gerektirir. NKVD'nin yardımını kullanarak [ROOT.GetLeader]'ın yönetimini tehdit edebilecek herkesi ortadan kaldırarak hükümetin ne pahasına olursa olsun istikrarlı olduğundan emin olmalıyız!"
 SIK_establish_the_xinjiangneft:0 "Xinjiangneft'i Kur"
 SIK_establish_the_xinjiangneft_desc:0 "[SOV.GetAdjective] Politbürosu, 'Sincan Petrolü' konusunu tartıştı ve hükümetimizin firması altında [SOV.GetAdjective] sınırı yakınında petrolün geliştirilmesinin hazırlanmasını talep eden bir kararı kabul etti. Bu amaçla, bölgedeki doğal kaynakların ortak çıkarılmasına yardımcı olmak için ortak Sincan-Sovyet şirketi 'Xinjiangneft' kurulacak."
 SIK_established_the_xinjiangneft_flag:0 "Xinjiangneft Kuruldu"
 SIK_invest_in_the_dushanzi_oil_fields:0 "Dushanzi Petrol Sahalarına Yatırım Yap"
 SIK_invest_in_the_dushanzi_oil_fields_desc:0 "Yüzyılın başında Dushanzi bölgesinde petrol keşfedildi ve 1909'a gelindiğinde zaten bir miktar çıkarmaya başlamıştık, ancak Sovyetler Birliği'nden gelen son yatırımla daha da genişleme potansiyeli var. Petrol rafinerilerini genişletmek için bu ortak Sovyet-Sincan çabasına daha fazla yatırım yapmaya çalışmalıyız, çünkü bunlar hem bizim hem de Sovyet savaş çabalarında hayati olabilir."
 SIK_king_of_sinkiang:0 "Sincan Kralı"
 SIK_king_of_sinkiang_desc:0 "Sheng Shicai, Sincan Kliği'nin tartışmasız lideridir, hatta bazıları ona Kral diyecek kadar ileri gitmektedir. Ancak il, bazılarının Merkezi Hükümeti takip etmek istediği, diğerlerinin ise Sovyet çizgisini sürdürmek istediği bir kavşakta durmaktadır. Kral ne ilan ederse ilin ve halkının geleceğine karar verecek, ancak ne olacağı henüz belirsiz."
 SIK_march_into_khotan:0 "Hotan'a Yürü"
 SIK_march_into_khotan_desc:0 "O gün geldi! Yakında tüm Sincan bizim yönetimimiz altında olacak ve Ma Hushan'ın birlikleri kovulacak!"
 SIK_march_into_khotan_tt:0 "Zamanı geldiğinde, §Y[SOV.GetNameDef]§! tarafından §YEk İkmaller§! gelecek"
 SIK_military_cooperation:0 "Askeri İşbirliği"
 SIK_military_cooperation_desc:0 "Kuomintang hala Yeni 36. Tümen aracılığıyla Hotan'da çok sayıda asker bulunduruyor. Onların atılmasını sağlamak için Sovyetler Birliği'nden yardım istemeliyiz."
 SIK_office_of_sinkiang_border_commissioner:0 "Sincan Sınır Savunma Ofisi"
 SIK_office_of_sinkiang_border_commissioner_desc:0 "Sincan Sınır Savunma Komiserliği Ofisi, bölgesel garnizonları komuta etmekten sorumlu organdır. Bu özerklik sayesinde, il hükümetini güçlendirebilir ve pratik olarak dilediğimiz zaman Merkezi Hükümetten bağımsız hareket edebiliriz."
 SIK_protector_of_the_kyrgiz:0 "Kırgızların Koruyucusu"
 SIK_protector_of_the_kyrgiz_desc:0 "Sovyet sınırının diğer tarafındaki Kırgız halkı, kendilerini anlayan biri tarafından yönetilmek istiyor. [ROOT.GetLeader] onların köklerini paylaşıyor ve yollarını biliyor. İl ile birleşmek için [SOV.GetLeader]'a dilekçe vermeliyiz."
 SIK_pursue_further_soviet_integration:0 "Daha Fazla Sovyet Entegrasyonu İzle"
 SIK_pursue_further_soviet_integration_desc:0 "Savaş bittiğinde ve toz dindiğinde gözlerimizi diğer tehditlere çevirmeliyiz. Sovyetler Birliği'nin koruyucu kanadı altında Merkezi Hükümet tarafından ilhak edilme tehdidiyle karşı karşıya kalmayacağız, bu yüzden bu açıkça en mantıklı hareket tarzıdır."
 SIK_reaffirm_soviet_connections:0 "Sovyet Bağlantılarını Yeniden Doğrula"
 SIK_reaffirm_soviet_connections_desc:0 "Merkezi Hükümet Çin'i başarısızlığa uğrattı ve bu geçen her gün daha da netleşiyor. Onlarla bağlarımızı tamamen koparmaya çalışmalı ve feodalizme karşı haçlı seferlerinde [SOV.GetNameDef] ile birleşmeliyiz."
 SIK_reestablish_the_guominjun:0 "Guominjun'u Yeniden Kur"
 SIK_reestablish_the_guominjun_desc:0 "Guominjun, 1920'lerde Feng Yuxiang tarafından kurulmuş askeri bir ittifaktı. Milliyetçiliğe, anti-emperyalizme ve Hristiyan sosyalizmine bağlı olan bu yapı, iç savaşta üçüncü bir taraf olmak istiyorsak yeniden canlandırmak için mükemmel bir organizasyon gibi görünüyor. Sheng Shicai'nin geçmişte nihayetinde katıldığı oluşumun GMJ olduğu ve sadakatinin hiçbir zaman KMT'ye ait olmadığı gerçeğinden bahsetmeye bile gerek yok."
 SIK_rejoin_the_central_government:0 "Merkezi Hükümete Yeniden Katıl"
 SIK_rejoin_the_central_government_desc:0 "Sovyetler bir zamanlar düşündüğümüz kadar güvenilir değil. Kazanan ata oynamak, rotamızı KMT'ye yeniden katılmak üzere değiştirmek ve Merkezi Hükümet ile hızla bütünleşmek en iyisi gibi görünüyor."
 SIK_settle_dzungarian_tribes:0 "Çungar Kabilelerini Yerleştir"
 SIK_settle_dzungarian_tribes_desc:0 "İyi hasatlarımızın meyvelerinden faydalanamayan Çungar kabilelerinin şeflerinden ve liderlerinden eyaletimize yerleşme talepleri aldık. İsteklerini yerine getirmeliyiz."
 SIK_six_great_policies:0 "Altı Büyük Politika"
 SIK_six_great_policies_desc:0 "Anti-Emperyalizm, Sovyetler Birliği ile Dostluk, Irksal ve ulusal eşitlik, Temiz hükümet ve Halkın Anti-Emperyalist Birliği aracılığıyla teşvik edilen Barış ve yeniden yapılanma şeklindeki altı büyük politika, Sincan Kliği'ndeki Sheng Shicai yönetiminin temelidir. Bunlar aracılığıyla müreffeh bir il sağlayacak ve feodal yönetime geri dönmekten kaçınacağız."
 SIK_soviet_intervention:0 "Doğrudan Sovyet Müdahalesi"
 SIK_soviet_intervention_desc:0 "Sheng Shicai, farklı bağlılıklar arasında gidip gelmesiyle güvenilmez olduğunu kanıtladı. Bu nedenle, Sincan'ı parti çizgisinden sapmayan bir yönde yönetmesi için onun yerine güvenebileceğimiz birini getirmeliyiz."
 SIK_three_year_plan_for_reconstruction:0 "Yeniden Yapılanma İçin Üç Yıllık Plan"
 SIK_three_year_plan_for_reconstruction_desc:0 "Yönetimimizi güvence altına almak ve daha fazla kargaşadan kaçınmak için Sovyet desteğiyle üç yıllık bir yeniden yapılanma planı başlatmalıyız. Krediler alarak kendimizi geçici olarak SSCB'ye bağlayacağız ancak uzun vadede bu, ekonomik refahımızı ve sonunda bağımsızlığımızı sağlayacaktır."
 SIK_transformation_of_nature:0 "Doğanın Dönüşümü"
 SIK_transformation_of_nature_desc:0 "Asya, kullanılmayı bekleyen doğal kaynaklar bakımından zengindir. Bilim topluluğumuzun daha önce mümkün olduğu düşünülen sınırları zorlamasıyla, en büyük, en istilacı projeler bile uygulanabilir hale geliyor. Çevre, Halkın lehine çalışacak şekilde devasa bir ölçekte şekillendirilmeli ve kalıba dökülmelidir!"
 SIK_utilize_asperovs_contacts:0 "Apresov'un Bağlantılarını Kullan"
 SIK_utilize_asperovs_contacts_desc:0 "Urumçi'deki Sovyetler Birliği Dışişleri Halk Komiserliği İkinci Doğu Dairesi Temsilcisi ve özel yetkilere sahip Sovyet Başkonsolosu Garegin Apresov, [SOV.GetNameDef] içinde birçok önemli bağlantıya sahip. [SOV.GetAdjective] ile işbirliğimizden daha fazlasını elde etmek için onun gücünü ve bağlantılarını kullanmalıyız."
 SND_unlock_loyalty_decision_tt:0 "§YHan Fuju'nun sadakatini kanıtlama veya Japonların tarafına geçme kararlarını açar§!"
 XIC_anti_japanese_national_salvation_agreement:0 "Japon Karşıtı Ulusal Kurtuluş Anlaşması"
 XIC_anti_japanese_national_salvation_agreement_desc:0 "Shaanxi'deki çatışmaları sona erdirmek için resmi bir anlaşmaya varıldığına göre, [CHI.GetLeader] liderini iç savaşı sona erdirmenin ve İkinci Birleşik Cephe'nin oluşturulmasının Kuomintang için buna değeceğine ikna etmek için gereken nüfuz gücünü kazanmaları adına ÇKP'yi güçlendirmenin zamanı geldi. Bu nedenle, güçlerini artırmak için KMT tarafından bize verilen silahları ve fonları Sovyet Üs Bölgesine kaçırmalıyız."
 XIC_discussions_in_luochuan:0 "Luochuan'daki Görüşmeler"
 XIC_discussions_in_luochuan_desc:0 "Komünistler, Luochuan'da $CHI_zhang_xueliang$ ile görüşmesi için temsilcileri olarak Li Kenong'u gönderdiler. Çatışmaları durdurma ve her ikimizin de Çin için daha büyük bir tehdit olarak algıladığı Japonlara odaklanma olasılığını tartışmak istiyorlar. Onlara bu fırsatı vereceğiz ve büyük bir aceleyle belirtilen konuma gideceğiz."
 XIC_form_the_anti_japanese_comrades_association:0 "Japon Karşıtı Yoldaşlar Derneği'ni Kur"
 XIC_form_the_anti_japanese_comrades_association_desc:0 "Gücümüzü artırmak ve orduyu ÇKP ile savaşmayı bırakmaya ikna etmek için, Kuzeydoğu Ordusu'nu birleştirmek ve aktif Japon karşıtı fikirleri olanları bünyesine katmak üzere gizli bir çekirdek örgüt kurmalıyız; Zhang buna Japon Karşıtı Yoldaşlar Derneği adını verdi. Zhang, Japonya'ya karşı savaşmak ve Japon karşıtı kadroları eğitmek için Komünistlerle birleşerek derneğin başkanı olarak görev yapacak."
 XIC_invite_chiang_for_troop_inspections:0 "[CHI.GetLeader] Liderini Birlik Teftişine Davet Et"
 XIC_invite_chiang_for_troop_inspections_desc:0 "Japonya'nın topraklarımız üzerinde açıkça tasarıları varken ülkemiz iç çatışmalarla zayıflamış durumda. Buna rağmen [CHI.GetLeader], ÇKP ile işbirliği yapmayı reddediyor ve umutsuz yalvarışlarımıza rağmen güneye yerleştirilmemek için haydut bastırma harekatımıza devam etmemizi sürekli talep ediyor. Milliyetçileri ve Komünistleri mantıklı olmaya ve Birleşik Cephe kurmaya zorlamalıyız."
 XIC_invite_zuolin_loyalsits:0 "Zuolin Sadıklarını Davet Et"
 XIC_invite_zuolin_loyalsits_desc:0 "[MAN.GetNameDef] ordusunda görev yapan askerlerin ve generallerin çoğu bir zamanlar [ROOT.GetLeader]'ın babası Zhang Zuolin'e sadıktı. Onlara gizlice ulaşmanın ve [ROOT.GetNameDef]'e dönmeleri için davet etmenin zamanı geldi."
 XIC_non_agression_pact_with_the_cpc:0 "ÇKP ile Saldırmazlık"
 XIC_non_agression_pact_with_the_cpc_desc:0 "Japon karşıtı davaya bağlılığımızı kanıtlamak için, kayıtsız [CHI.GetLeader] bu karardan rahatsız olsa bile şimdilik çatışmaları durdurmaya çalışmalıyız. Zamanla, [CHI.GetAdjective] liderliğini [PRC.GetNameDef] ile güçlerini birleştirmeye ikna edebiliriz."
 XIC_northwest_bandit_suppression_headquarters:0 "Haydut Bastırma Karargahı"
 XIC_northwest_bandit_suppression_headquarters_desc:0 "Shaanxi'deki komünistlere yönelik operasyonlarımız durdu ve sadece 1935'in ikinci yarısında bölgede bir piyade tümeni ve bir alay kaybettik. Subaylarımızdan ve askerlerimizden komünistlere karşı sonuçsuz savaşı durdurmamız ve kuzeydoğudaki kayıp illerimizin restorasyonuna odaklanmamız yönündeki artan baskıyla bir seçim yapmamız gerekiyor."
 XIC_reclaim_the_lost_birthright:0 "Kaybedilen Hakkı Geri Al"
 XIC_reclaim_the_lost_birthright_desc:0 "Nihayet [MAN.GetAdjective] ve [JAP.GetAdjective] belasını anavatanımızdan atma ve Mançurya'yı kendimiz için geri alma zamanı geldi! Kuzeye derhal bir işgal başlatmalı ve kuvvetleri neye uğradıklarını anlamadan bölgeyi ele geçirmeliyiz."
 XIC_recruit_mancurian_bandits:0 "Mançuryalı Haydutları İşe Al"
 XIC_recruit_mancurian_bandits_desc:0 "Mançurya'da dolaşan sözde haydutların çoğu gerçekte [JAP.GetNameDef] ve [MAN.GetNameDef]'e karşı aktif çatışmaya giren gerilla savaşçılarıdır. Doğu tehdidine karşı gerçekçi bir şansımız olacaksa onlarla ittifak kurmalı ve deneyimlerinden yararlanmalıyız."
 XIC_recruit_mancurian_bandits_tt:0 "§Y5 piyade§! taburlu 3 birim ve §Y5 süvari§! taburlu 2 birim kazan.\n"
 XIC_reestablish_the_zhili_army:0 "Zhili Ordusunu Yeniden Kur"
 XIC_reestablish_the_zhili_army_desc:0 "Fengtian kliği'nin Zhili Ordusu, Zuolin'in bir zamanlar şu anki Hebei eyaleti ve Beiping olan yere yerleştirdiği orduydu. Kliği sıfırdan yeniden inşa etme yolumuzda iyi bir basamak olarak bu organizasyonu yeniden kurmalıyız."
 XIC_request_relocation_to_northeastern_command:0 "Kuzeydoğu Komutanlığına Yer Değiştirme Talebi"
 XIC_request_relocation_to_northeastern_command_desc:0 "Shaanxi'deki haydutları bastırma görevimiz artık bittiğine göre, [CHI.GetLeader] makamına bir plan sunma zamanı geldi; bu planda $CHI_zhang_xueliang$ kişisinin kuzey kalesinin ve şu anda [HBC.GetLeader] tarafından tutulan [608.GetName] bölgesinin muhafızı rolünü üstlenmesini önereceğiz. Bu sayede, bir zamanların büyük Fengtian Kliği'ni yeniden kurma hedeflerimizi daha da ileriye taşıyabileceğiz."
 XIC_restore_the_glory_of_the_fengtian_army:0 "Fengtian Ordusunun Şanını Geri Getir"
 XIC_restore_the_glory_of_the_fengtian_army_desc:0 "Zhili ordusunun yeniden kurulması tamamlandığında, kuzey Çin'deki baskın güç olarak Fengtian Ordusunu bir zamanlar olduğu güce uygun şekilde yeniden inşa etmemizin zamanı geldi. Yakında şanlı günlerimiz geri gelecek!"
 XIC_restore_the_homeland:0 "Anavatanı Restore Et"
 XIC_restore_the_homeland_desc:0 "Eski başkentimiz Mukden'in geri alınmasıyla, $CHI_zhang_xueliang$ için Mançurya Savaş Lordu ve Çin Askeri Hükümeti Generalissimosu unvanını hakkıyla kuşanma ve Fengtian Kliği'ni bir zamanlar sahip olduğu güce kavuşturma zamanı nihayet geldi. Çok yaşa Fengtian ve çok yaşa genç mareşal!"
 XIC_restore_the_homeland_tt:0 "En geniş sınırlarındaki §YFengtian Kliği§! tarafından tutulan tüm topraklarda §YAsli Eyalet hakları§! kazan"
 XIC_revive_the_beiyang_government:0 "Beiyang Hükümetini Canlandır"
 XIC_revive_the_beiyang_government_desc:0 "Sürgündeki Beiyang Hükümeti'nin meşru varisi olarak, nihayet kendimizi meşru Çin Cumhuriyeti olarak ilan edebiliriz. Geleceğin ne getireceği henüz görülmedi ancak şimdilik tüm Çin'e demokrasiyi getirdik ve umarız bin yıl boyunca böyle kalır."
 XIC_send_a_representative_to_sheng_shicai:0 "Sheng Shicai'ye Temsilci Gönder"
 XIC_send_a_representative_to_sheng_shicai_desc:0 "Li Kenong, her iki tarafın da [SOV.GetAdjective] temsilcileri araması ve Japonya'ya karşı savaşta yardımlarını almaya çalışması koşuluyla bizimle ÇKP arasında işbirliği aramayı kabul etti. [SOV.GetLeader] liderinin desteğini kazanmak için [SIK.GetNameDef] içindeki bağlantılarımızı kullanmalıyız."
 XIC_sixth_encirclement_campaign:0 "6. Kuşatma Harekatı"
 XIC_sixth_encirclement_campaign_desc:0 "ÇKP tehdidi tarafından bize verilen ağır kayıplara rağmen, [CHI.GetLeader] bir kez daha kuşatma harekatlarımıza devam etmemizi emrettiği için başka bir saldırıya hazırlanmalıyız. Ancak bunu yaparak [CHI.GetAdjective] liderliği tatmin olacak ve dikkatimizi kuzeydoğuya odaklamamıza izin verecektir."
 XIC_the_fushi_conference:0 "Fushi Konferansı"
 XIC_the_fushi_conference_desc:0 "İkinci bir toplantı için, [PRC.GetLeader], [CHI.GetLeader] liderini resmi bir Birleşik Cepheye katılmaya ikna etmek için gereken diğer gereklilikleri ve eylemleri tartışmak üzere Li Kenong ve Zhou Enlai'yi elçi olarak Fushi'ye göndermeyi kabul etti. [JAP.GetAdjective] güçlerini yenme ve Fengtian Kliği'nin topraklarını geri alma zamanı giderek yaklaşıyor..."
 XIC_withdraw_forces_from_yanan:0 "Yan'an'dan Kuvvetleri Çek"
 XIC_withdraw_forces_from_yanan_desc:0 "[CHI.GetLeader] liderinin öfkesini çekmek ve KMT parti liderliğinin birliklerimizi araştırmak üzere Xi'an'a seyahat etmesini sağlamak için, kuvvetlerimizi Yan'an'dan çekerek ve komünistlerin şehri ele geçirmesine izin vererek bir olaya neden olmalıyız."
 XSM_a_hui_army:0 "Bir Hui Ordusu"
 XSM_a_hui_army_desc:0 "Ma Bufang'ın komutasındaki ordu, komutanlarına mutlak sadakat yemini etmiş Hui halkından büyük ölçüde oluşmaktadır. Ma Bufang iktidarı askeri yollarla ele geçirmek zorunda kalırsa çok yararlı olacaklardır."
 XSM_a_united_ma_state:0 "Birleşik Ma Devleti"
 XSM_a_united_ma_state_desc:0 "Ailenin tamamı tek bir sancak altında birleştiğinde artık hem yerel hem de uluslararası sahnede hesaba katılması gereken bir gücüz. Ma Kliği bin yıl sürecek!"
 XSM_a_united_ma_state_tt:0 "Bizim kuklamız olan Ma Klikleri §Yİlhak Edilecek§! ve §YAsli Eyalet§! yapılacak ve onların §YGenerallerini§! kazanacağız"
 XSM_demand_submission:0 "Teslimiyet Talep Et"
 XSM_demand_submission_desc:0 "Gerekirse çatışmadan kaçınmaya çalışmalıyız, bu nedenle doğru yol niyetimizi ilan etmek ve biz saldırmadan önce diğerlerine teslim olma şansı vermektir."
 XSM_ma_qis_natural_successor:0 "Ma Qi'nin Doğal Halefi"
 XSM_ma_qis_natural_successor_desc:0 "Eski vali Ma Qi'nin oğlu Ma Bufang parlak bir askeri stratejist ve güce aç olsa da, eyaleti yönetmeye uygun değildir. Bunun yerine, eski valinin kardeşi Ma Lin yönetmek için çok daha nitelikli olmaya devam ediyor. Reformlarını sonuna kadar götürecektir."
 XSM_rebuild_the_ninghai_army:0 "Ninghai Ordusunu Yeniden İnşa Et"
 XSM_rebuild_the_ninghai_army_desc:0 "Güney eyaletlerimize bir kez daha düzen getirmek ve sınırlarımızı güvence altına almak için Ninghai ordusunu yeniden inşa etmeliyiz. Bunu yaparak, Tibetlilere karşı çatışmalarımızda üstünlük sağlayabilmeliyiz."
 XSM_rebuilt_the_ninghai_army_flag:0 "§YNinghai Ordusu§! Yeniden İnşa Edildi"
 XSM_recruit_salar_officers:0 "Salar Subayları Topla"
 XSM_recruit_salar_officers_desc:0 "Qinghai eyaletindeki Türki Salar halkı savaş sanatında umut vadediyor. Umut vadeden yeni liderleri keşfetmek ve onlara uygun askeri eğitim verildiğinden emin olmak için Xunhua ilçesine subaylar gönderilecek."
 XSM_send_ma_lin_on_hajj:0 "Ma Lin'i Hacca Gönder"
 XSM_send_ma_lin_on_hajj_desc:0 "Ma Lin zamanının dolduğunu biliyor, ancak onu herhangi bir sebep olmadan görevden almak yine de halkı kızdıracaktır. Bu nedenle onu Hacca gitme bahanesiyle pozisyonundan vazgeçmeye zorlamalıyız."
 XSM_sideline_family_conflicts:0 "Aile Çatışmalarını Kenara Bırak"
 XSM_sideline_family_conflicts_desc:0 "Ma ailesi geniştir ve geniş toprakları kontrol eder. Teoride bu, bir araya gelmenin bölgede müthiş bir güç yaratacağı anlamına gelebilir, ancak bunun yerine aile çekişme ve çatışmalarla doludur. Bir araya geleceksek önce bu çatışmaların yolumuza çıkmadığından emin olmalıyız."
 XSM_solidifying_control:0 "Kontrolü Sağlamlaştırma"
 XSM_solidifying_control_desc:0 "İç çekişme bittiğine göre, iç veya dış güçlerden kaynaklanan daha fazla istikrarsızlığı önlemek için Qinghai üzerindeki yönetimimizi sağlamlaştırmanın zamanı geldi."
 XSM_strengthening_our_position:0 "Konumumuzu Güçlendirme"
 XSM_strengthening_our_position_desc:0 "Birleşeceksek bir savaş gücüne ihtiyacımız olacak, çünkü silahlı çatışma potansiyeli sıfırdan yüksek ve ordumuz herhangi bir büyük ölçekli operasyon için hala çok küçük."
 XSM_strike_at_the_detractors:0 "Hainleri Vur"
 XSM_strike_at_the_detractors_desc:0 "Ailenin diğer üyelerine güvenilemez ve niyetimizi ilan etmek onlara sadece kendilerini hazırlama şansı verecektir. Önce vurmalı, sonra sormalıyız."
 XSM_sway_the_people:0 "Halkı Etkile"
 XSM_sway_the_people_desc:0 "Ordu sağlam bir şekilde Ma Bufang'ın yanındayken, halk Ma Lin'i çok daha fazla tercih ediyor gibi görünüyor. Onları etkilemeye çalışmak önemli olacak, ancak çok ciddi şeyler olmadıkça şimdilik hala Ma Lin'in kampında oturacaklar."
 XSM_sweep_out_communists:0 "Komünistleri Süpür"
 XSM_sweep_out_communists_desc:0 "Sovyet Cumhuriyeti'nin eline düşmeyeceksek Zhang Guotao ve onun komünist grubunu kovmak en büyük önceliktir. Bu nedenle topraklarımızdan kalan tüm komünistleri süpürmeliyiz."
 XSM_the_civilian_governor_remains:0 "Sivil Vali Kalıyor"
 XSM_the_civilian_governor_remains_desc:0 "Ma Bufang tam kontrol istese de, halktan tam ölçekli bir isyan riski olmadan bunun mümkün olmayacağı giderek daha belirgin hale geliyor. Ancak Ma Lin, her iki rolün de ortak yönetim olarak görüleceği, kendisinin lider olarak daha sembolik bir role istifa edeceği ve Bufang'ın çoğu konuda fiilen kontrol sahibi olacağı bir uzlaşma önerdi."
 XSM_the_military_governor:0 "Askeri Vali"
 XSM_the_military_governor_desc:0 "Ülkemiz sözde Qinghai'nin sivil valisi Ma Lin tarafından yönetilse de, Askeri Vali ve Ma Lin'in yeğeni Ma Bufang bir süredir il üzerinde tam kontrol sağlamak için çabalıyor. Amcasını devirmeyi başarıp başaramayacağı henüz belirsiz, ancak bazı manevralarla bu kesinlikle mümkün."
 YUN_a_land_of_mountains:0 "Dağlar Diyarı"
 YUN_a_land_of_mountains_desc:0 "Yunnan bir dağlar diyarıdır ve halkımız uzun zamandır böyle zorlu bir bölgede yaşamayı ve savaşmayı öğrenmiş ve buna uyum sağlamıştır. Zamanı geldiğinde bize kesinlikle faydalı olacaktır."
 YUN_eduational_reforms:0 "Eğitim Reformlarını Teşvik Et"
 YUN_eduational_reforms_desc:0 "Halkın vesayeti kuzeye ertelendi, ancak Doktor Sun'ın hayalinin bir gün gerçekleşmesini istiyorsak, sadece kendi eyaletimizde bile olsa buna devam etmeliyiz."
 YUN_expand_local_infrastructure:0 "Yerel Altyapıyı Genişlet"
 YUN_expand_local_infrastructure_desc:0 "Eyaletimizin düzgün bir şekilde seyahat edilebilir olması için, bizimki gibi dağlık arazilerde ayakta kalabilecek altyapıya yatırım yapmalıyız. Bu şekilde kasabalarımız arasında daha fazla mal transferi de sağlanabilir."
 YUN_political_reforms:0 "Siyasi Reformlar"
 YUN_political_reforms_desc:0 "Devletimizi daha iyi yönetmek için, siyasi süreçlerimizin darboğazlardan ve yolsuzluklardan mümkün olduğunca arınmış olduğundan ve ekonomimizin bürokratlarımızdan faydalanabileceğinden -tam tersi değil- emin olmalıyız."
 YUN_rally_around_long_yun:0 "Long Yun'un Etrafında Kenetlen"
 YUN_rally_around_long_yun_desc:0 "Kuzey ideolojilerini ne pahasına olursa olsun sürdüren radikal diktatörler tarafından yönetilirken, büyüyen ekonomimiz ile sosyal, eğitim ve siyasi reformlarımız sayesinde bölgemiz istikrarlıdır ve vatandaşlarımız tarafından demokratik bir kale olarak görülmektedir. Bu amaçla, bu mucizenin mimarı olan Long Yun'un arkasında kenetlenmeliyiz!"
 YUN_strengthen_burmic_ties:0 "Birmanya Bağlarını Güçlendir"
 YUN_strengthen_burmic_ties_desc:0 "Yerel halkımız, Lolo-Birmanya dili konuşan nüfusumuz aracılığıyla hem Çin hem de Birmanya ile birçok bağa sahiptir. Büyük bir Tusi'nin oğlu olarak Long Yun, sömürgeciliğin prangalarından kurtulmaları için güneye de demokrasiyi getirmelidir."
 YUN_strive_for_self_sufficiency:0 "Kendi Kendine Yeterlilik İçin Çabala"
 YUN_strive_for_self_sufficiency_desc:0 "Demokrasimizi gerçekten gelişmeye devam ettirebilmek için, kuzeydeki ideologların yardımına çok fazla bel bağlamadığımızdan ve önümüzdeki yıllarda kendi kendimizi idame ettirebileceğimizden emin olmalıyız."
 YUN_the_democratic_fortress:0 "Demokratik Kale"
 YUN_the_democratic_fortress_desc:0 "Tüm reformlarımız tamamlandığında, Çin'in zorlu siyasi manzarasında gerçekten bir demokrasi kalesi olduğumuz söylenebilir. Artık dışa bakmaya ve aydınlanmamızı yeni zihinlere taşıyıp taşıyamayacağımızı görmeye başlayabiliriz."
