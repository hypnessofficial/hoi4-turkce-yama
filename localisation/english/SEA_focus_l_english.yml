 CHI_sea_develop_capital_arsenal:0 "[ROOT.Capital.GetName] Cephaneliğini Genişlet"
 CHI_sea_develop_capital_arsenal_desc:0 "Bir Cephanelik olmadan ordumuz olmaz ve ordumuz olmadan devletimiz olmaz. Hayatta kalmamızı sağlamak için bu nedenle endüstriyel yeteneklerimizi genişletmeliyiz."
 CHI_sea_develop_capital_desc:0 "Sanayi tabanı olmadan konumumuzu asla koruyamayız. Bu nedenle başkentimize yatırım yapmalıyız."
