 MAN_tsr_mangyo:0 "Mangyo"
 MAN_tsr_mangyo_desc:0 "Mançurya Endüstriyel Kalkınma Şirketi veya kısaca Mangyō, Nissan Zaibatsu'nun kurucusu Yoshisuke Aikawa'nın Hükümet ile birlikte Mançurya için ekonomik refahı daha da sağlama çabasıdır. Bu, belirli stratejik endüstrileri geliştirerek ve ardından yavaşça diğer sektörlere yayılarak yapılacaktır."
 MAN_tsr_mangyo_tt:0 "§Y$MAN_showa_steel_works$§! ve §Y$MAN_south_manchuria_railway_company$§!, §YMançurya Endüstriyel Kalkınma Şirketi§! adı altında birleştirilecek"
 MAN_tsr_move_capitals:0 "$MAN_move_capitals$"
 MAN_tsr_move_capitals_desc:0 "Tüm Çin'in kadim başkenti her zaman Pekin olmuştur. Artık geri alındığına göre, İmparatoru zaferle eski evine geri döndürebiliriz."
 MAN_tsr_mukden_arsenal:0 "$MAN_mukden_arsenal$"
