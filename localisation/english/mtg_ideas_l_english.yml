 ENG_joint_air_training_scheme:0 "Müşterek Hava Eğitim Programı"
 ENG_joint_air_training_scheme_desc:0 "İngiliz hükümeti, üyelerinin hava mürettebatı için İngiliz Milletler Topluluğu çapında bir eğitim programı uygulamıştır. Bundan büyük ölçüde faydalanabileceğiz."
