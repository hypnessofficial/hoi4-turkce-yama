 HOL_aloof_neutrality:0 "Mesafeli Tarafsızlık"
 HOL_aloof_neutrality_desc:0 "Katı bir Tarafsızlık politikası, Hollandalıları yaklaşık 150 yıl boyunca komşularından herhangi biriyle yapılan savaşların dışında tuttu ve her şeyden önce onları Büyük Savaş'ın dışında tuttu. Halkın \"koruma tılsımına\" olan inancı bu nedenle neredeyse hararetli ve zayıf Hollanda hükümeti, halkın iradesine karşı çıkamayacak ve uluslararası politikada güçlü bir duruş alamayacak durumda. Bunun yerine Milletler Cemiyeti'ne güvenmeye karar verdi ve aksi takdirde dünya olaylarına karşı mesafeli bir tutum benimsedi."
 HOL_bernhard_air_example:0 "Prens Bernhard Havacılara Örnek"
 HOL_bernhard_intelligence:0 "Prens Bernhard İstihbarat Topladı"
 HOL_bernhard_organized_resistance:0 "Prens Bernhard Direnişi Örgütledi"
 HOL_bernhard_strategy_meddling:0 "Prens Bernhard Stratejiye Karıştı"
 HOL_caved_to_the_british_idea:0 "İngilizlere Boyun Eğildi"
 HOL_caved_to_the_british_idea_desc:0 "Hollandalılar, kesinlikle ekonomik felaket anlamına gelecek olan tam abluka tehdidiyle yüzleşmek yerine, ticaret müzakerelerinde İngiliz taleplerine boyun eğmeyi seçtiler. Ülkenin iç siyasetinde Alman karşıtı ve İngiliz yanlısı duygular giderek daha belirgin hale geliyor ve bu, tarafsızlıktan ilk çekingen adım olarak görülebilir."
 HOL_caved_to_the_germans_idea:0 "Almanlara Boyun Eğildi"
 HOL_caved_to_the_germans_idea_desc:0 "Hollandalılar, işgal tehdidiyle yüzleşmek yerine, ticaret müzakerelerinde Alman taleplerine boyun eğmeyi seçtiler. Bunun sonucunda demokratik özgürlük zarar görmeye başladı ve bu, tarafsızlıktan ilk çekingen adım olarak görülebilir."
 HOL_de_crisisjaren:0 "De Crisisjaren"
 HOL_de_crisisjaren_desc:0 "Küresel ekonominin kendine özgü özellikleri nedeniyle, Büyük Buhran Hollanda'yı diğer yerlere göre çok daha geç vurdu. Hollanda'nın Altın Standardını sürdürme kararı, diğer ülkeler bu standardı hızla terk ederken, Hollanda'daki \"kriz yıllarını\" daha da kötüleştirdi. Guilder'in devalüasyonunu önlemek için, bırakın ulusal savunmanın kötü durumunu iyileştirmeyi, hasta Hollanda ekonomisine yardım edecek hiçbir fon kalmadı.\n\nKriz, bayındırlık işlerine yatırım yapılarak azaltılabilir ve teslim olup krizden etkilenen ana karanın kontrolünü kaybedersek, büyük ölçüde önemsiz hale gelecektir."
 HOL_de_vaarplicht_idea:0 "De Vaarplicht"
 HOL_de_vaarplicht_idea_desc:0 "\"Kraliyet Kararnamesi A5 uyarınca, askere alınmamış veya henüz aktif hizmete çağrılmamış tüm Hollanda vatandaşları ve Hollandalı tebaa, ticari donanma için veya onun yararına hizmet vermekle yükümlüdür.\""
 HOL_domestic_aircraft_production:0 "Yerli Uçak Üretimi"
 HOL_german_defectors_1:0 "Alman Sığınmacılar"
 HOL_german_defectors_1_desc:0 "Sürekli bir Alman sığınmacı akışı, Kayzerlerini yeniden tahta çıkarmak için bizim adımıza savaşmaya hevesli birimler oluşturuyor."
 HOL_german_defectors_2:0 "Kayzer Yanlısı Sığınmacılar"
 HOL_german_defectors_2_desc:0 "Eski Kayzer'e duyulan yanlış yönlendirilmiş sadakat, Kayzer'i tekrar tahta oturtmak için boş bir çabayla Hollandalılar için savaşmak üzere sürekli bir asker sığınmasına neden oldu.\n\nSadece Hollandalıların ve parçası oldukları ittifakın tamamen yenilgisi, bu hareketi tamamen ortadan kaldırabilir."
 HOL_preparing_evacuation_of_gold_reserves:0 "Altın Rezervlerinin Tahliyesine Hazırlanılıyor"
 HOL_prince_bernhard:0 "Prens Bernhard"
 HOL_redirected_investments:0 "Yönlendirilen Yatırımlar"
 HOL_shared_intelligence_eng:0 "Paylaşılan İngiliz İstihbaratı"
 HOL_shared_intelligence_fra:0 "Paylaşılan Fransız İstihbaratı"
 HOL_shared_intelligence_ger:0 "Paylaşılan Alman İstihbaratı"
 HOL_shared_intelligence_hol:0 "Paylaşılan Hollanda İstihbaratı"
 HOL_shell_shocked_spectator:0 "Büyük Savaş'ın Şok Olmuş Seyircisi"
 HOL_shell_shocked_spectator_desc:0 "Tarafsız Hollanda, Batı Cephesi'nden gelen mülteciler için en yakın güvenli bölge olduğundan, Hollandalılar, Büyük Savaş'ın dehşetine çok yakın bir seyirci oldu. Sonuç olarak, güçlü bir pasifist hareket halkın geniş kesimlerine nüfuz edecek şekilde büyüdü ve hükümete askeri harcamalarda herhangi bir artışın uygulanmasında büyük zorluklar yaşattı. Yalnızca donanma, kamuoyunun gözünde hala belirli bir prestije sahiptir. Ülkeyi bu duygudan gerçekten kurtarmak için \n\nA savunma savaşına veya \"pasifizme karşı savaşa\" ihtiyaç duyulacaktır."
 HOL_staff_plan_eng:0 "Birleşik İngiliz Kurmay Planı"
 HOL_staff_plan_fra:0 "Birleşik Fransız Kurmay Planı"
 HOL_staff_plan_ger:0 "Birleşik Alman Kurmay Planı"
 HOL_weak_government:0 "Zayıf Hükümet"
 HOL_weak_government_desc:0 "Son yıllardaki Hollanda hükümeti zayıflıkla damgalanmıştır. Onu bir kez daha devirmek çok zor olmayacaktır."
 HOL_wilhelmina:0 "Wilhelmina"
 HOL_wilhelmina_desc:0 "Yüzyıllardır Orange-Nassau ailesi, Hollanda'nın tarihiyle iç içe geçmiştir. Tıpkı atası Sessiz William'ın Seksen Yıl Savaşı'nda olduğu gibi, şimdiki Kraliçe Wilhelmina da, ülkeleri bir gün işgal edilirse, vatanlarının savunması için toplanan Hollandalılara şüphesiz bir ilham kaynağı olacaktır."
 HOL_zuiderzee_industrial_advancements:0 "Zuiderzee Endüstriyel Gelişmeleri"
 HOL_zuiderzee_infrastructure_advancements:0 "Zuiderzee Altyapı Gelişmeleri"
 MEX_aaron_saenz:0 "Aarón Sáenz Garza"
 MEX_aaron_saenz_desc:0 "Sağcı bir iş adamı ve vali olan Aarón Sáenz, kukla başkanların kabinelerini el Jefe Máximo'nun hedefleriyle aynı çizgide tutma yeteneği nedeniyle 'Calles'in Gölgesi' olarak adlandırılmıştır."
 MEX_abelardo_rodriguez:0 "Abelardo L. Rodríguez"
 MEX_abelardo_rodriguez_desc:0 "Abelardo L. Rodríguez, 1913'te Devrim'e katıldı ve zekası ve çalışkanlığı sayesinde rütbeleri tırmandı. Devrim'e olan sadakati, Álvaro Obregón'un suikastından sonraki iki yıl için 1932'de Meksika Devlet Başkanı yapılmasıyla ödüllendirildi."
 MEX_aerial_artillery:0 "Hava Topçusu"
 MEX_aerial_artillery_desc:0 "Ateş desteği için hafif ve taktik bombardıman uçaklarına odaklanıyoruz."
 MEX_alberto_pani:0 "Alberto J. Pani"
 MEX_alberto_pani_desc:0 "Alberto J. Pani, Meksika finans endüstrisinin mimarı ve Ulusal Banka ile Tarım Kredi Bankası'nın başkanlarından biridir."
 MEX_american_mexican_tanks:0 "Meksika Chrysler'ı"
 MEX_american_mexican_tanks_desc:0 ""
 MEX_astimar_gulf:0 "ASTIMAR Golfo"
 MEX_astimar_gulf_desc:0 "Astilleros de la Secretaría de Marina del Golfo"
 MEX_astimar_pacific:0 "ASTIMAR Pacifico"
 MEX_astimar_pacific_desc:0 "Astilleros de la Secretaría de Marina del Pacifico"
 MEX_banco_de_mexico:0 "Banco de México"
 MEX_banco_de_mexico_desc:0 "İç savaşla parçalanmış bir ekonomiyi yeniden inşa etmek için 1925'te kurulan Ulusal Bankamız, son kredi merciimiz, para birimi ihraççımız ve devletin çıkarına yönelik her türlü girişimin yatırımcısıdır."
 MEX_bartolome_garcia_correa:0 "Bartolomé García Correa"
 MEX_bartolome_garcia_correa_desc:0 "Yucatanlı bir Yerli Maya olan Correa, vali ve senatör olarak görev yapmış, Yerli geleneklerini devletin gücüyle uzlaştıran popülist politikalar uygulamıştır."
 MEX_blue_water_navy:0 "Açık Deniz Donanması"
 MEX_blue_water_navy_desc:0 "Hedefimiz artık dünyanın büyük güçlerinin filolarına karşı koyabilecek bir su üstü donanması."
 MEX_bolivarian_agitation:0 "Bolivarcı Ajitasyon"
 MEX_brown_water_navy:0 "Sahil Donanması"
 MEX_brown_water_navy_desc:0 "Denizaltıları ve su üstü akıncılarını tehdit edebilecek bir sahil savunma gücümüz var ancak kararlı bir düşman su üstü filosu bizi silip süpürür."
 MEX_callistas:0 "Callesçiler"
 MEX_callistas_desc:0 "Calles taraftarları kendilerini zenginleştiriyor ve güçlerini kötüye kullanıyor. Liyakatten ziyade sadakatle atanan bu kişiler, ülkedeki her makamı ve rütbeyi yozlaştıran bir kayırmacılık sistemini devam ettiriyorlar. Onlara dizgin vurulmazsa sıradan Meksikalılar, yöneten hükümetimizle 'robolucionarios', yani soyguncu devrimciler diye alay etmeye devam edecek."
 MEX_capital_reserves:0 "Sermaye Rezervleri"
 MEX_capital_reserves_desc:0 "Genişleyen petrol endüstrimizden akan zenginlik, yüksek kaliteli yabancı askeri teçhizat satın almamızı sağlayacak."
 MEX_caudillo_private_armies:0 "Kaudillo Özel Orduları"
 MEX_caudillo_private_armies_desc:0 "Bir bölgedeki valiler, iş adamları ve garnizon komutanları genellikle aynı kişi olma eğilimindedir - sadık astları nüfuzlu konumlara atayarak güç toplayan bir Devrimci general. Bu kaudillolar, karşı savaşmamız gereken değil, geliştirmemiz gereken bir hayat gerçeğidir."
 MEX_cedillo_tension:0 "Kaudillo Gerilimi Düşük"
 MEX_cedillo_tension_2:0 "Kaudillo Gerilimi Orta"
 MEX_cedillo_tension_2_desc:0 "General Saturnino Cedillo ve ona bağlı kaudillolar nüfuzlarını kıskançlıkla koruyorlar. Hükümetin yoluna çıkarlarsa onlara karşı harekete geçmemiz gerekebilir."
 MEX_cedillo_tension_3:0 "Kaudillo Gerilimi Yüksek"
 MEX_cedillo_tension_3_desc:0 "General Saturnino Cedillo ve ona bağlı kaudillolar hükümetten bağımsız hareket ediyor. Onların, [Root.GetLeader] ve Meksika halkının iç ve dış düşmanlarıyla temas halinde oldukları varsayılmalıdır!"
 MEX_cedillo_tension_4:0 "Kaudillo Gerilimi Çok Yüksek"
 MEX_cedillo_tension_4_desc:0 "General Saturnino Cedillo ve ona bağlı kaudillolar, [Root.GetLeader]'nın meşru hükümetine karşı isyan hazırlığı için açıkça asker topluyorlar. Meksika'nın birliğine yönelik bu tehdidi sona erdirmek için yakında harekete geçmeliyiz!"
 MEX_cedillo_tension_desc:0 "General Saturnino Cedillo ve ona bağlı kaudillolar güçlerinin çoğunu kaybetti ancak şüphesiz onu geri kazanmaya çalışıyorlar."
 MEX_church_power_1:0 "Ateist Devlet"
 MEX_church_power_1_desc:0 "Meksika'daki Katolik Kilisesi mazide kalacak. Rahipler karşı-devrimci ve batıl inançların satıcılarıdır. Meksika'yı bir akılcılık ve bilim kalesi haline getirmek için daha da fazla baskı yapacağız!"
 MEX_church_power_2:0 "Zayıf Kilise"
 MEX_church_power_2_desc:0 "1917 Anayasası, Katolik Kilisesi'nin Meksika'daki etkisine karşı önlemler alınmasını gerektiriyor. Cristero'lar 1920'lerde bu yasaları uygulama girişimleri nedeniyle isyan etmişti ancak halk artık laik bir devlete hazır olabilir."
 MEX_church_power_3:0 "İddialı Kilise"
 MEX_church_power_3_desc:0 "Meksika'daki Katolik Kilisesi'ni yok etme girişimlerine son verdik. Rahiplere biraz özerklik tanıyarak devlet kontrolümüze saygı duymalarını ve bizi istikrarsızlaştırma çabalarından kaçınmalarını sağlayacağız."
 MEX_church_power_4:0 "Güçlü Kilise"
 MEX_church_power_4_desc:0 "Ruhban okullarının ve kiliselerin mülkiyetini iade ederek Gerçek İnanca yönelik baskıyı azalttık ancak daha yapacak çok iş var."
 MEX_church_power_5:0 "Katolik Devleti"
 MEX_church_power_5_desc:0 "O nefret edilen 1917 Anayasası lağvedildi. Gerçek İnancın onuruna yönelik on yıllardır süren suiistimallerden sonra, nihayet Kutsal Kilise'yi Meksika'da nihai ahlaki ve hukuki otorite olarak kuruyoruz!"
 MEX_ejido_worker_militias:0 "Ejido İşçi Militanları"
 MEX_ejido_worker_militias_desc:0 "Komünal ejido sisteminin çalışkan çiftçileri, inşa ettiğimiz yeni Meksika'da çıkarlarını korumak için bir araya geliyor."
 MEX_escuela_de_ingeneria_electrica:0 "Escuela de Ingenería"
 MEX_escuela_de_ingeneria_electrica_desc:0 "Escuela Superior de Ingenería Mecánica y Eléctrica, yani Mekanik ve Elektronik Mühendisliği Üniversitesi, elektromanyetik dalgalar ve televizyon araştırmalarının en ileri noktasında yer alan en iyi eğitim kurumlarımızdan biridir."
 MEX_germano_mexican_tanks:0 "Alman-Meksika Tank Tasarımları"
 MEX_germano_mexican_tanks_desc:0 ""
 MEX_heavy_artillery:0 "Ağır Topçu"
 MEX_heavy_artillery_desc:0 "Ateş desteği için konvansiyonel sahra topçularına odaklanıyoruz."
 MEX_heriberto_corona:0 "Heriberto Jara Corona"
 MEX_heriberto_corona_desc:0 "Heriberto Corona, sadakatini sağlamak için Donanma'ya atanmış bir Devrimci generaldir."
 MEX_hispanic_culture:0 "Hispanik Kültür"
 MEX_hispanic_culture_desc:0 "Latin Amerika ulusları, fetih ve hayatta kalma, isyan ve sert yönetimden doğan güçlü bir kültüre sahiptir. Ortak kültürümüz bir gurur kaynağı ve gelecekteki ilerlememiz için yol gösterici bir ışıktır."
 MEX_idea_vanguard_of_the_4th_international:0 "4. Enternasyonal'in Öncüsü"
 MEX_idea_vanguard_of_the_4th_international_desc:0 "Devrimimiz, dünya işçilerini daha büyük kahramanlıklara iten bir özgürlük rüzgârı haline geldi. 4. Enternasyonal, insanlığı faşist, burjuva ve Bonapartist gericiliğin zincirlerinden kurtaracaktır."
 MEX_international_peacekeepers:0 "Uluslararası Barış Gücü"
 MEX_international_peacekeepers_desc:0 "Dünyanın demokratik güçleri, dünya ülkelerine farklılıklarını uzlaştırma ve anlaşmazlıkları çözme yeri vererek uluslararası güvenliği sağlamak için eşitlerden oluşan bir ittifak, bir Birleşmiş Milletler yaratmayı planlıyor. Latin Amerika uluslarının bağımsızlıklarını korumalarına yardımcı olmak için böyle bir projeye kendimizi adayacağız."
 MEX_international_struggle:0 "Uluslararası Mücadele"
 MEX_international_struggle_desc:0 "İdeolojik ve kurtuluş mücadelelerinde yardıma layık gördüklerimize yardım edeceğiz. Bu ağır bir sorumluluktur ama Meksika halkı bu görev için yeterince güçlüdür."
 MEX_jose_gonzalo_escobar:0 "José Gonzalo Escobar"
 MEX_jose_gonzalo_escobar_desc:0 "General Escobar, Devrim'in kargaşası ve iç çekişmeleri sırasında Pancho Villa'nın isyancılarına karşı savaştı ve hükümetin düşmanlarına karşı süvari hücumlarına liderlik etti. Başkan Calles ile arası açıldı ve 1929'daki kendi isyan girişiminin ardından sürgün edildi, ancak kabinenin yeniden düzenlenmesiyle geri dönebilir."
 MEX_jose_vasconcelos:0 "José Vasconcelos"
 MEX_jose_vasconcelos_desc:0 "Bir kültür yazarı, eski kabine bakanı ve başkan adayı olan Vasconcelos, senkretik bir Meksika ideolojisi oluşturmak için Yerli dini, Katoliklik ve sivil milliyetçilik kavramlarını harmanlıyor. Meksika'nın Feragat Edilmiş Toprakları'nın Amerika'dan geri alınmasını destekliyor."
 MEX_knights_of_columbus:0 "Kolomb Şövalyeleri"
 MEX_knights_of_columbus_desc:0 "Uluslararası bir Katolik kardeşlik örgütü olan Kolomb Şövalyeleri, on yıllardır süren iç çekişmelerden sonra barış ve uzlaşma sağlamamıza yardımcı olacaktır. Matta İncili'nde yazdığı gibi: 'Göze göz, dişe diş dendiğini duydunuz. Ama ben size diyorum ki, kötüye karşı direnmeyin. Sağ yanağınıza bir tokat atana öbürünü de çevirin.'"
 MEX_left_wing_paramilitaries:0 "Solcu Paramiliterler"
 MEX_left_wing_paramilitaries_desc:0 "Tabasco'lu General Garrido'nun Kızıl Gömleklileri gibi gruplar, Devrim'i kişisel çıkarları için sömürerek onu yıkmaya çalışan halk düşmanlarını yok etmemize yardımcı olacak. Katolik Kilisesi'nin gizli destekçilerini, Meksika'yı Karanlık Çağlara geri döndürmek isteyen karşı devrimcileri kökünden söküp atmamıza yardım edecekler."
 MEX_legion_of_christ:0 "Mesih Lejyonu"
 MEX_legion_of_christ_desc:0 "Ateist teröristler yenildi! Onların acımasız baskısı aynı şekilde cezalandırılmalıdır. Çıkış Kitabı'nda yazdığı gibi: göze göz, cana can al. Yüce'nin intikamcı kolu olmak için, Mesih Lejyonu şeytani imansızlığın toprağımızdan kaybolmasını sağlayacaktır."
 MEX_leon_trotsky:0 "Lev Troçki"
 MEX_leon_trotsky_desc:0 "Rus İç Savaşı sırasında neredeyse sıfırdan Kızıl Ordu'yu yaratmaktan sorumlu olan bu Uluslararası Komünist Birlik lideri, ordunun örgütlenmesine yardımcı olacaktır."
 MEX_luis_farell:0 "Luis Farell Cubillas"
 MEX_luis_farell_desc:0 ""
 MEX_luis_montes_de_oca:0 "Luis Montes de Oca"
 MEX_luis_montes_de_oca_desc:0 "Luis Montes de Oca, önde gelen bir Meksikalı bankacı ve Avusturya Ekonomi Okulu'nun bir savunucusudur."
 MEX_manuel_avila:0 "Manuel Ávila Camacho"
 MEX_manuel_avila_desc:0 "Meksika'yı ilerideki sıkıntılara hazırlamak için Milli Savunma Sekreterliği'ne atanmış bir Devrimci general."
 MEX_manuel_perez_trevino:0 "Manuel Pérez Treviño"
 MEX_manuel_perez_trevino_desc:0 "Manuel Pérez Treviño, mühendislik ve topçuluk alanında uzmanlığa sahip bir Devrimci generaldir. Partido Nacional Revolucionario'nun kurucularından biri olarak siyasi açıdan etkilidir."
 MEX_oil_concessions:0 "Petrol İmtiyazları"
 MEX_oil_concessions_desc:0 "Meksika'da petrol çıkarmak için yabancı şirketler, ödemeler karşılığında belirli topraklarda uzun bir süre boyunca serbestçe petrol çıkarabilmelerini sağlayan imtiyaz sözleşmeleri imzaladılar. Ancak şirketlerin ödediği meblağ, çıkarılan petrolün değerinin çok altındaydı ve ABD gibi ülkelere göre çok daha yüksek bir kâr marjı elde etmelerini sağlarken, Meksika'nın petrol rezervlerini dolaylı olarak yabancı kontrolü altına sokuyordu."
 MEX_othon_blanco:0 "Othón P. Blanco Núñez de Cáceres"
 MEX_othon_blanco_desc:0 "Othón Blanco, Devrim'den önce deniz subayı olarak görev yapmış, Donanma Sekreterliği'nin kıdemli bir üyesidir. Uzmanlık alanı, donanmanın lojistik desteğe iyi erişimini sağlamak, hatta yeni yerleşim yerleri inşa etmek kadar ileri gitmektir."
 MEX_pablo_gonzalez:0 "Pablo González Garza"
 MEX_pablo_gonzalez_desc:0 "Pablo González, 'kirli işler' organize etme yeteneği olan bir ordu generalidir. 1919'da popüler isyancı ve kaudillo Emiliano Zapata'yı öldüren pusunun kurulmasına yardım etti."
 MEX_pemex:0 "Pemex"
 MEX_pemex_desc:0 "Petróleos Mexicanos, daha önce Royal Dutch Shell, Standard Oil of California ve diğer yabancı firmalara ait olan yerel varlıkların kamulaştırılmasından oluşmuştur."
 MEX_plutarco_calles:0 "Plutarco E. Calles"
 MEX_plutarco_calles_desc:0 "1924 ve 1928 yılları arasında Başkan olan Calles, güçlü kayırmacılık ağı sayesinde Meksika devleti üzerinde büyük bir güç kullanmaya devam ediyor. Siyasi düşmanları tarafından ömür boyu diktatör Başkan Díaz ile karşılaştırmak için 'Jefe Máximo' (Ulu Lider) olarak etiketlendi. Terim, kendisinin sadece ülkenin yararına tavsiyelerde bulunan emekli bir devlet adamı olduğunda ısrar etmesine rağmen, ana akım kullanıma girmiştir."
 MEX_politicised_army:0 "Siyasallaşmış Ordu"
 MEX_politicised_army_2:0 "Siyasallaşmış Ordu"
 MEX_politicised_army_2_desc:0 "General Garrido'nun Kızıl Gömleklileri ve General Nicolás Rodríguez'in Altın Gömleklileri gibi siyasi milislerin kullanımını yasaklayarak bölgesel güç sahiplerinin daha tuhaf eğilimlerini azaltmayı başardık."
 MEX_politicised_army_desc:0 "Meksika'nın yöneticileri neredeyse otuz yıldır devrimci ordu subayları arasından seçiliyor. İçinden geçtiğimiz çalkantılı zamanlar sert bir liderlik gerektiriyordu. Soru şu: çalkantı geçti mi, yoksa daha da şiddetleniyor mu? Orduyu profesyonelleştirmeli miyiz, yoksa bölgesel güç sahiplerinin -cacique'lerin ve kaudilloların- küçük yurtluklar kurmasına izin mi vermeliyiz? San Luis Potosí'deki General Saturnino Cedillo gibi generaller güçlerini korumak için özel milisler topluyor. Harekete geçmezsek geçmişte memnuniyetsiz subaylar tarafından başlatılan birçok isyanın devam etmesi muhtemel."
 MEX_professional_army:0 "Escuela Superior de Guerra"
 MEX_professional_army_desc:0 "Askeri Okulumuz sayesinde generallerimiz, birliklerimizin maksimum verimlilikle savaşmasını sağlamak için verimli tedarik sistemleri geliştirmeyi öğrendiler."
 MEX_proletarian_class_army:0 "Proleter Sınıf Ordusu"
 MEX_proletarian_class_army_desc:0 "Sadece bir sınıf ordusu olarak silahlanmış ve örgütlenmiş Proletarya, Devrim'in ideallerini savunabilecek ve yayabilecektir."
 MEX_raiding_navy:0 "Akıncı Donanma"
 MEX_raiding_navy_desc:0 "Dünyanın büyük güçlerinin donanmalarını yenmeye çalışmak boşuna olur. Bunun yerine Meksika'yı istiladan korumak için düşman ticaretini ve konvoylarını yok etmeye çalışacağız."
 MEX_revolutionary_army:0 "Devrimci Ordu"
 MEX_revolutionary_army_desc:0 "Meksika Devrimi, ülkemizin bağımsızlığını sağlamak için yanımızda olmalarına ihtiyaç duyduğumuz kahramanlar ve vatanseverler tarafından kazanıldı ve savaşıldı."
 MEX_right_wing_paramilitaries:0 "Sağcı Paramiliterler"
 MEX_right_wing_paramilitaries_desc:0 "General Nicolás Rodríguez Carrasco'nun Altın Gömleklileri gibi gruplar, ülkenin birliğini solcu hainlere ve bozgunculara karşı sağlamamıza yardımcı olacak."
 MEX_royal_dutch_shell:0 "Royal Dutch Shell"
 MEX_royal_dutch_shell_desc:0 "Meksika petrol imtiyazlarının %60'ını elinde bulunduran bir İngiliz ve Hollanda firması."
 MEX_russo_mexican_tanks:0 "Rus-Meksika Tank Tasarımları"
 MEX_russo_mexican_tanks_desc:0 ""
 MEX_saturnino_cedillo:0 "Saturnino Cedillo Martínez"
 MEX_saturnino_cedillo_desc:0 "Zengin bir Kuzeyli vali ve askeri lider olan General Cedillo, gücünü kişisel sadakate dayalı bir kayırmacılık sistemi sayesinde kullanıyor. Kaudilloların azalan etkisi ve ülkenin merkezileşmesi, hükümetten bağımsızlığını tehdit ettiği için onun için büyük bir endişe kaynağıdır."
 MEX_social_catholicism:0 "Sosyal Katoliklik"
 MEX_social_catholicism_desc:0 "Sanayi devrimi, işçileri insanlık dışı durumlara sokmuştur. Sosyalist taleplere karşı koymak için, yönetimin çalışanlarına merhamet gösterme gerekliliği üzerine özel bir vurgu yapıldı. Bu, Hristiyan devrimci olmayan sosyalizminin bir çeşidini doğurdu: sosyal Katoliklik."
 MEX_strike_breaking:0 "Grev Kırıcılık"
 MEX_strike_breaking_desc:0 "Kriz zamanında grev eylemi vatana ihanettir. Stratejik endüstrilerimizdeki iş gücünü kontrol ederek, Anavatan'ın yararına üretimi artırabiliyoruz."
 MEX_synarchist_influence:0 "Sinarşist Nüfuz"
 MEX_synarchist_influence_desc:0 "Meksikalı Sinarşistler propagandalarını bölgemize yaymaya çalışıyorlar. Baskıcı hedeflerini sözde \"İspanyol dayanışması\" arkasına saklamaya çalışıyorlar."
 MEX_tga:0 "Talleres Generales de Arma"
 MEX_tga_desc:0 "Meksika havacılık atölyesi TNCA'nın zırhlı savaş araçlarına adanmış bir kolu."
 MEX_tnca:0 "Talleres Nacionales de Construcciones Aeronáuticas"
 MEX_tnca_desc:0 "Ulusal Havacılık İnşa Atölyesi, Devrim'den önce kurulmuş ve iç savaşların yarattığı aksaklıklardan önce yenilikçi bir tasarımcıydı."
 MEX_triumph_of_synarchism:0 "Sinarşizmin Zaferi"
 MEX_triumph_of_synarchism_desc:0 "Tamamen yenilmiş olan düşmanlarımız, Şeytan'ın yardakçıları gibi gölgelerde saklanıyor. Artık devleti, hem inanç hem de siyasi irade birliğini sağlayacak şekilde yeniden inşa etmekte serbestiz."
 MEX_vicente_lombardo:0 "Vicente Lombardo"
 MEX_vicente_lombardo_desc:0 "Devrim'den sonra işçi hakları için savaşan, işçiliği Cárdenas'ın iktidar partisiyle ittifaka getiren radikal bir sendikacı."
 MEX_womens_suffrage:0 "Kadınların Oy Hakkı"
 MEX_womens_suffrage_desc:0 "Son yıllarda, Meksika'nın seçkinlerinin çoğu, kadınların laik 1917 Anayasası'na karşı Katolik Kilisesi'nin yanında yer alarak Devrim'in ideallerini yıkacağından endişe duyuyordu, ancak kanun önünde eşitlik çok daha önemlidir ve toplumumuzun gelişmesini sağlayacaktır."
 idea_weapons_for_the_resistance:0 "Direnişçilere Silah"
 idea_weapons_for_the_resistance_desc:0 "Müttefiklerimiz, vatanımızda nefret edilen düşmanla savaşan cesur özgürlük savaşçılarına mühimmat gönderiyor."
 mexican_ford:0 "Meksika Ford'u"
 mexican_ford_desc:0 "Ford Motor Company'nin yerel bir franchise'ı."
 mexico_german_submarine_happy_time:0 "Denizaltıların Mutlu Zamanı"
 mexico_german_submarine_happy_time_desc:0 "Denizaltı kaptanlarımız, Amerika kıyılarındaki savunmasız tarafsız gemileri batırarak Mutlu Zamanlarının ('Glückliche Zeit') tadını çıkarıyorlar."
 mexico_hispanic_diplomacy:0 "Hispanik Diplomasi"
 mexico_hispanic_diplomacy_desc:0 "Kıtasal hırslarımızı gerçekleştirmek istiyorsak, Latin Amerika'daki sayısız hükümeti ikna etmeliyiz."
 political_turmoil:0 "Siyasi Kargaşa"
 political_turmoil_desc:0 "Bu ülkenin hükümeti, önceki liderliğin yabancı egemenlerinin gözünden düşmesinin ardından yakın zamanda zorla kuruldu."
 synarchist_youth:0 "Sinarşist Gençlik"
 synarchist_youth_desc:0 "Gençlik, milletimizin geleceğidir. Eğer doğru eğitilirlerse, ideallerimizin -güç, sadakat ve dindarlık- somutlaşmış hali olacaklardır."
