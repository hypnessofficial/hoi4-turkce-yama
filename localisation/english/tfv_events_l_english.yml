l_english:
 AST_CREATE_FACTION:0 "Kendi ittifakımızı kuracağız."
 SAF_colonies_tt:0 "§YKenya§! ve §YZimbabve§!'yi kukla olarak serbest bırak."
 SAF_soviet_research_tt:0 "Güney Afrika ile bir araştırma anlaşması yap."
 mex_nationalists_chosen:0 "Milliyetçilerin yanında yer al."
 mex_republicans_chosen:0 "Cumhuriyetçilerin yanında yer al."
 tfv_australia.1.a:0 "Avustralya, Güneydoğu Asya'da ilk savunma hattını sağlamalıdır."
 tfv_australia.1.b:0 "Singapur Stratejisi her zaman olduğu gibi kalacaktır."
 tfv_australia.1.d:0 "Singapur Stratejisi, Büyük Savaş'ın sonundan beri [JAP.GetNameDef]'e karşı caydırıcılık politikamızın temel taşı olmuştur. Ancak, saldırı durumunda Ana Filo'nun Singapur'a yeniden konuşlandırılması, [From.GetNameDef]'deki müttefiklerimizin desteğine bağlıdır. Uzak Doğu'daki Britanya mülklerine yönelik potansiyel tehdit her geçen gün artarken, [From.GetAdjective] yüksek komutası, Avustralya'nın bölgenin savunmasında çok daha fazla kontrol sahibi olacağı potansiyel yeni bir strateji sundu.\n\nBu sağlam bir plan ve tek soru, onların ihtiyaç duyduğumuz güvenliği sağlayabileceklerine inanıp inanmadığımızdır."
 tfv_australia.1.t:0 "[From.GetAdjective] Singapur Stratejisi Hakkında Teklifi"
 tfv_australia.10.a:0 "[From.GetNameDefCap] bölgedeki [Root.GetAdjective] çıkarlarının uygulayıcısı olacaktır."
 tfv_australia.10.b:0 "[Root.GetAdjective] toprağı [Root.GetAdjective] ellerinde kalacaktır!"
 tfv_australia.10.d:0 "[From.GetNameDefCap], Güneydoğu Asya'daki [Root.GetAdjective] topraklarının korunması sorumluluğunun potansiyel devri için [Root.GetAdjective] diplomatlarıyla müzakerelere başladı.\n\nSöz konusu toprağı savunmanın doğasında olan zorluklar göz önüne alındığında, bir ortaklık o kadar da kötü bir fikir olmayabilir. Bu, öngörülebilir gelecekte söz konusu toprağın sadece ismen [Root.GetAdjective] olacağı anlamına gelir, ancak ismen sahiplik kesinlikle onları tamamen kaybetmekten daha iyidir."
 tfv_australia.10.t:0 "[From.GetNameDefCap] Sömürgelerimiz İçin Koruma Teklif Ediyor"
 tfv_australia.11.a:0 "[Root.GetNameDefCap] yapması gerekeni yapacaktır."
 tfv_australia.11.d:0 "[Root.GetAdjective] birlikleri, [From.GetLeader] anlaşmayı onaylar onaylamaz Güneydoğu Asya'daki tüm [From.GetAdjective] topraklarının korunması sorumluluğunu üstlenmeye hazırdı.\n\nDevir sırasında bazı yerel direnişlerle karşılaşılsa da, yabancı saldırganlık korkusu, çoğunun [Root.GetAdjective] savunmasının gerekliliğini tanımasını sağlıyor."
 tfv_australia.11.t:0 "[From.GetNameDefCap] Himayeleri Devrediyor"
 tfv_australia.12.a:0 "Sadece direnebileceklerini umabiliriz."
 tfv_australia.12.d:0 "Güneydoğu Asya'daki [From.GetAdjective] topraklarını korumak için yeterince yetenekli olduklarına inanarak, [From.GetNameDef] ortak bir savunma stratejisi teklifimizi reddetti.\n\nŞüphesiz sömürge kontrolü endişeleriyle motive olan eylemleri anlaşılabilir. Ancak, eğer topraklarını koruyamazlarsa - korktuğumuz gibi - Avustralya kıtasına bir saldırı için fırlatma platformu olarak kullanıldığını görebiliriz."
 tfv_australia.12.t:0 "[From.GetAdjective] Bölgesel Güvenlik Önlemlerini Engelliyor"
 tfv_australia.2.a:0 "Hayal kırıklığına uğratmayacağız."
 tfv_australia.2.d:0 "[From.GetAdjective], Singapur ve Borneo yakınlarındaki tüm [From.GetAdjective] sömürge mülklerinin kontrolünü [Root.GetNameDef]'e devredecek yasayı geçirdi.\n\nUlusal güvenliğimiz nihayet kendi ellerimizde."
 tfv_australia.2.t:0 "[From.GetNameDefCap] Sömürge Mülklerini Devrediyor"
 tfv_australia.20.a:0 "[From.GetNameDef]'in bir ili olarak yeni statümüzü kabul etmekten başka seçeneğimiz yok."
 tfv_australia.20.b:0 "Eğer adalarımızı istiyorlarsa, gelip onlar için savaşabilirler!"
 tfv_australia.20.d:0 "[From.GetNameDef]'deki milliyetçi coşkunun yükselişini uzun zamandır kaygı verici bir şekilde takip ediyoruz ve sanki sonunda bu milliyetçiliğin kendi sınırlarını aşacağı gün gelmiş gibi görünüyor.\n\"Öncü uluslar\" olarak ortak bir mirasa atıfta bulunarak, birleşik bir Okyanusya devletine dair öneriler havada uçuşuyor. Ancak retorik, [Root.GetAdjective] direnişi karşısında giderek daha agresif hale geldi.\n\nArtık siyasi spekülasyon açık düşmanlığa dönüştü ve [From.GetLeader], tüm [Root.GetAdjective] topraklarının eyalete ilhak edilmesini açıkça talep ediyor. [From.GetNameDef].\nEğer reddedersek güçlü bir istila tamamen mümkün görünüyor."
 tfv_australia.20.t:0 "[From.GetNameDefCap] İlhakımızı Talep Ediyor!"
 tfv_australia.21.a:0 "[Root.GetNameDefCap] ve Yeni Zelanda, daha güçlü bir geleceğe doğru birlikte!"
 tfv_australia.21.d:0 "[From.GetAdjective] ültimatomumuza uydu ve [Root.GetNameDef] eyaleti olarak yeni statüsünü kabul etti. [From.GetAdjective] PM [From.GetLeader], [From.GetAdjective] \"bağımsızlığının\" kaybının yasını tutarken, bu an Okyanusya için yeni bir dönemin başlangıcını işaret ediyor. \n\n[From.GetNameDef], artık bizim gibi, özünde bizim çıkarlarımızı düşünmeyen bir İmparatorluğun kucak köpeği olmayı bıraktı."
 tfv_australia.21.t:0 "[From.GetNameDefCap] İlhakı Kabul Ediyor"
 tfv_australia.22.a:0 "Silah başına, [Root.GetAdjective]lar!"
 tfv_australia.22.d:0 "Pasifik'in jeopolitik ortamındaki istikrarsız konumlarını kabul edemeyen [From.GetAdjective] hükümeti, Yeni Zelanda'yı [Root.GetNameDef]'nin önde gelen eyaletlerinden biri yapma teklifimizi reddetti.\nOnların yalnızca Britanya'nın kucak köpeği olduğunun farkında olmayan [From.GetAdjective] Başbakan [From.GetLeader], Yeni Zelanda'nın ilkelerinden alıntı yaptı. [From.GetAdjective] \"özgürlük ve bağımsızlık.\"\n\n[From.GetNameDef]'ye konumlarını \"jeopolitik açıdan istikrarsız\" olarak tanımlayarak tam olarak ne demek istediğimizi hatırlatmamız gerekiyor gibi görünüyor."
 tfv_australia.22.t:0 "[From.GetNameDefCap] Birlik Teklifimizi Reddediyor"
 tfv_australia.3.a:0 "[From.GetAdjective] desteği olsun ya da olmasın, [Root.GetNameDef] dimdik ayakta duracaktır!"
 tfv_australia.3.d:0 "Singapur Stratejisi'nin uygulanabilirliği konusundaki geçerli endişelerimize rağmen, değiştirme önerilerimiz [From.GetAdjective] parlamentosunda reddedildi. \nBu, [From.GetAdjective] Yüksek Komutası'na hakim olan askeri muhafazakarlığın bir sonucu gibi görünüyor, ancak gerçek şu ki, eğer korkularımız gerçekleşirse, kıyılarımızda düşman kuvvetleriyle yüzleşmek zorunda kalabiliriz."
 tfv_australia.3.t:0 "[From.GetNameDefCap] Stratejik Ayarlamaları Reddediyor"
 tfv_australia.31.a:0 "[Root.GetNameDefCap] geleceğe giden yolda liderlik ediyor!"
 tfv_australia.31.d:0 "İmparatorluktan uzaklaşma yönündeki son politikamızın ardından, kendi alanımızda bizim kadar baskın bir ülkenin bir takipçi yerine bir lider konumunu üstlenmesi mantıklıdır.\nDiğer bölgesel güçleri davamıza toplayacak ve karşılıklı çıkarlarımızın küresel sahnede savunulmasını sağlayacağız.\n\nArtık Avrupa'nın sömürgeci güçlerinin köleliğinde olmadan, yeni, daha adil bir güç dengesi sağlayacağız."
 tfv_australia.31.t:0 "Küresel bir Lider olarak [Root.GetNameDefCap]"
 tfv_australia.32.a:0 "Onları müttefikimiz olarak adlandırmaktan mutluluk duyarız!"
 tfv_australia.32.b:0 "Çıkarlarımızı tek başımıza daha iyi koruyabiliriz."
 tfv_australia.32.d:0 "[From.GetNameDef]'in Commonwealth'dan resmi olarak ayrılmasının ardından, [From.GetAdjective] hükûmeti şimdi yeni müttefikler arıyor. Avrupa görünüşe göre yeni, maliyetli bir çatışmanın eşiğindeyken ve [From.GetNameDef]'in Pasifik'teki herhangi bir potansiyel çatışma için stratejik değeri göz önüne alındığında, bir ortaklık en iyi çıkarımıza olabilir.\n\nBu kesinlikle Güneydoğu Asya, Uzak Doğu ve Pasifik'i nüfuz alanımızın parçaları olarak vurgulayacak ve Avrupa'da ne olursa olsun [Root.GetAdjective] çıkarlarına müdahale edilmemesini sağlayacaktır."
 tfv_australia.32.t:0 "[From.GetNameDefCap] Siyasi İşbirliği Talep Ediyor"
 tfv_australia.33.a:0 "Eski efendiler öldü. Artık hepimiz eşitiz."
 tfv_australia.33.d:0 "Pasifik ötesi ortaklığın bariz faydalarını gören [From.GetNameDef], bölgesel bir ittifak teklifimizi kabul etti."
 tfv_australia.33.t:0 "[From.GetNameDefCap] Pasifik İşbirliğini Kabul Ediyor"
 tfv_australia.34.a:0 "Dünyanın kendi köşemiz için elimizden geleni yapmaya devam edeceğiz."
 tfv_australia.34.b:0 "Başarısız olduk."
 tfv_australia.34.d:0 "İster ortak tarihimizi kabul etmedeki başarısızlık, ister sadece siyasi bir fırsatçılık meselesi olsun, [From.GetNameDef] pasifik ötesi bir ortaklık teklifimizi reddetti.\n\nKatılımları büyük bir kazanç olsa da, kendi gündemimizle kendi hedeflerimize doğru ilerlemeliyiz."
 tfv_australia.34.t:0 "[From.GetNameDefCap] İşbirliği Projesini Reddediyor"
 tfv_australia.41.a:0 "Gerekirse dünyaya karşı, silah omuz omuza!"
 tfv_australia.41.d:0 "Eski [HOL.GetAdjective] sömürgelerinde kargaşa yaygınken, güvenilir komşumuz [INS.GetNameDef]'in zorla kazandığı otoritesini sürdürmek için bir yardım eline ihtiyacı olduğu açıktır. Desteğimize ihtiyaçları olduğu sürece, [Root.GetNameDef], [INS.GetAdjective] hükûmetini desteklemek için oradadır.\n\nBir gün [INS.GetNameDef], Pasifikli kardeşimiz olarak Avrupa sömürgeci güçlerine karşı durabilecek. O zamana kadar, bizimle birlikte güçlü durmalarını sağlayacağız."
 tfv_australia.41.t:0 "[INS.GetAdjective] Özgürlüğü Peşinde"
 tfv_australia.50.a:0 "Her devrimci ulus kollarımızı açarak karşılanır!"
 tfv_australia.50.b:0 "[From.GetAdjective]lerin bizi kesinlikle sürükleyeceği çatışmaları göze alamayız."
 tfv_australia.50.d:0 "Kendini eski Avrupa burjuvazisinden arınmış bir işçi ulusu olarak tanımlayan [From.GetNameDef], giderek [Root.GetAdjective] siyaset alanına kaymıştır. [From.GetAdjective] hükûmeti, [Root.GetFactionName]'e ulusal üyelik için resmen talepte bulundu.\n\nDünya Devrimi görüş alanındayken, [From.GetLeader], [Root.GetNameDef] ve [From.GetNameDef]'i, Okyanusya'da [From.GetNameDef]'in hakimiyetine ve Avrasya'da [Root.GetNameDef]'in hakimiyetine dayanan yeni, Sosyalist bir dünya düzeninde iki kilit kutup olarak bir vizyon sunuyor."
 tfv_australia.50.t:0 "[From.GetNameDefCap] [Root.GetFactionName]'e Üyelik Talep Ediyor"
 tfv_australia.51.a:0 "Dünya Devrimi bekliyor!"
 tfv_australia.51.d:0 "[From.GetNameDefCap], [From.GetFactionName]'e üyelik talebimizi değerlendirdi ve bizi davanın değerli bir müttefiki olarak ilan etti!"
 tfv_australia.51.t:0 "Devrimin Kardeşleri"
 tfv_australia.52.a:0 "Dünyanın her köşesindeki ezilenler için savaşıyoruz!"
 tfv_australia.52.d:0 "Haftalarca süren duraksayan müzakereler ve bürokratik engellerin ardından, [From.GetNameDef]'in [From.GetFactionName]'e katılımımız konusunda bize kesin bir cevap vermekle ilgilenmediği anlaşılmıştır.\nHızlı ve kesin müzakereler umduğumuz için, [Root.GetNameDef] dünya işçilerine gerçek özgürlüğü tek başına getirmeye hazırlanmalıdır."
 tfv_australia.52.t:0 "Tek Başına Gitmek"
 tfv_australia.60.a:0 "Gerçekten başka seçeneğimiz yok. Devrim için, yoldaşlar."
 tfv_australia.60.b:0 "[Root.GetNameDefCap] asla boyun eğmeyecek!"
 tfv_australia.60.d:0 "Tüm işçilerin özgürlük ve kendi kaderini tayin etme haklarını öne süren [From.GetAdjective] hükümeti, [Root.GetAdjective] devletinin bölgemizi kasıp kavuran \"Okyanus Sosyalizmi\" dalgasına boyun eğmesini talep ediyor.\n\n[Root.GetNameDef] halkının gerçek çıkarı ne olursa olsun, [From.GetNameDef] gerçek ve taleplerini ellerindeki tüm imkanlarla yerine getireceklerine dair çok az şüphe var..."
 tfv_australia.60.t:0 "[From.GetNameDefCap] Hakimiyet Dayatıyor"
 tfv_australia.61.a:0 "Aşağıdan kızıl dalga dünyayı yutmak için yükselecek!"
 tfv_australia.61.d:0 "Komünist davanın doğruluğunu ve haklılığını kabul eden [From.GetNameDef], ortak bir Okyanus sancağı altında çabalarımızı birleştirme gerekliliğini kabul etti."
 tfv_australia.61.t:0 "[From.GetNameDefCap] Devrimci Mücadeleye Katılıyor!"
 tfv_australia.62.a:0 "[From.GetNameDef]'e gerçek özgürlüğü getireceğiz!"
 tfv_australia.62.d:0 "[From.GetAdjective] halkını burjuva parmakları altında ezilmiş tutan, [From.GetNameDef] hükûmetinin kontrolündeki şişman kediler, şimdi [Root.GetAdjective] devletiyle kesinlikle hiçbir koşulda işbirliği yapmayacaklarını duyurdular.\nOnlar için ne yazık ki, biz onların işbirliğini değil, daha ziyade onların gösterişli obezitelerinin ağırlığı altında köle olanlarınkini arıyoruz!"
 tfv_australia.62.t:0 "[From.GetNameDefCap] Devrimi Bozmaya Çalışıyor"
 tfv_australia.70.a:0 "Evet, Güneydoğu Asya'nın istikrarı bir önceliktir."
 tfv_australia.70.b:0 "Hayır, kendi sömürge mülklerimizin tek kontrolcüsü biz olacağız!"
 tfv_australia.70.d:0 "[Root.GetNameDef]'in Güneydoğu Asya'daki sömürge mülklerini savunamamasının [From.GetNameDef] ulusal savunması için feci sonuçları olacağını iddia eden [From.GetLeader], [From.GetAdjective] hükûmetine bölgenin savunması için tam, bağımsız sorumluluk verilmesini talep etti.\nBu açık bir talep olmasa da, bölgedeki [From.GetAdjective] stratejik ve askeri nüfuzunun büyümesi argümanı bir miktar mantıklı kılıyor. Karşı denge ise, [From.GetNameDef]'in son zamanlarda benimsediği bizden siyasi uzaklaşmadır.\nBu, bir tebaa ile değil, potansiyel bir ortakla bir anlaşma olurdu ve eğer [From.GetNameDef] öyle seçerse, sömürgeleri fiilen elimizden çıkarırdı."
 tfv_australia.70.t:0 "[From.GetNameDefCap] Himayeleri Kontrol Hakkı Talep Ediyor"
 tfv_australia.71.a:0 "Eski ülkeyi gururlandıracağız."
 tfv_australia.71.d:0 "[Root.GetAdjective] askeri komutanlığının tekliflerini takiben, [From.GetNameDef], Güneydoğu Asya'daki tüm [From.GetAdjective] sömürge varlıklarının \"orta kontrolünü\" bize vermeye karar verdi.\n\nPasifik'in eski güçlerinin hiçbiri daha akıllıca değilken, bölge üzerinde [Root.GetNameDef] hakimiyetini sağlama girişimlerimiz devam ediyor."
 tfv_australia.71.t:0 "Savunma Komisyonu"
 tfv_australia.72.a:0 "[Root.GetNameDefCap], bu aksiliğe rağmen güçlü duruyor."
 tfv_australia.72.d:0 "[Root.GetAdjective] Yüksek Komutanlığı'ndan gelen tekliflere rağmen, [From.GetNameDef], Güneydoğu Asya bölgesindeki sömürgelerinin kontrolü talebimizi reddetti.\n\nAncak hırslarımız dizginlenmedi. Pasifik'te [Root.GetAdjective] önemini güvence altına almanın yollarını aramaya devam edeceğiz."
 tfv_australia.72.t:0 "[From.GetNameDefCap] \"Savunma Projesi\"ni Reddetti"
 tfv_australia.80.a:0 "Birlikte doğu yarımküreye tamamen hükmedeceğiz!"
 tfv_australia.80.b:0 "Hırslarımızda o taşralı çiftçilere yer yok!"
 tfv_australia.80.d:0 "[From.GetNameDefCap], zamanla [Root.GetNameDef]'in imparatorluk emellerine daha sempatik hale geldi. Bölgedeki tek diğer büyük askeri güç olarak, [From.GetAdjective]ler, alçaltılmış hizmetkarlarımız olmaktansa gururlu müttefikimiz olarak durmanın daha iyi olduğuna karar verdiler.\n\nİlgimizi çekmek için, bir Batı Pasifik ittifakı teklifi, [Root.GetAdjective] alanının aynı zamanda şu anda [From.GetNameDef]'in düşmanları tarafından kontrol edilen birkaç bölgeyi de içereceğini açıkça belirtiyor."
 tfv_australia.80.t:0 "Denizin Ötesinden Bir Teklif"
 tfv_australia.81.a:0 "Batı Pasifik'teki [Root.GetAdjective]ler ve [From.GetAdjective]ler bundan faydalanacaktır."
 tfv_australia.81.d:0 "Japonya'ya giden heyetimiz zaferle döndü. [JAP.GetName] ile resmi bir ittifak imzaladık. Belge, her bir ülkemizin çıkar alanlarını açıkça tanımlıyor ve diğerinin müdahale edemeyeceği belirtiliyor."
 tfv_australia.81.t:0 "[From.GetNameDefCap] İttifakı Onaylıyor"
 tfv_australia.82.a:0 "Eğer yanımızda durmazlarsa, önümüzde diz çökmelerini sağlayacağız."
 tfv_australia.82.d:0 "Küresel sahnenin ön saflarına yükselmemize rağmen, [From.GetNameDef], Batı Pasifik bölgesindeki önemimizi tanımayı reddetti. \n[From.GetAdjective]ler bizi sadece açıkça reddetmekle kalmadı, aynı zamanda Nanshin-ron doktrinlerinin onları Endonezya'nın ötesine, Avustralya kıtasının kendisine doğru götürebileceğini kesin bir dille ifade ettiler."
 tfv_australia.82.t:0 "[From.GetAdjective] Hükûmeti Ortaklığa Direniyor!"
 tfv_australia.90.a:0 "Kral'dan morali artırmak için Avustralya'yı ziyaret etmesini iste."
 tfv_australia.90.b:0 "Kral'dan bir askere alma kampanyasını desteklemesini iste."
 tfv_australia.90.c:0 "Kral'dan hükûmeti alenen desteklemesini iste."
 tfv_australia.90.desc:0 "[AST.GetLeader], Kral VI. George ve Kraliçe Elizabeth için yapılan taç giyme törenine katılmak üzere Britanya'ya gitti. Birkaç haftalık öğle yemekleri, akşam yemekleri, bahçe partileri, resepsiyonlar ve daha fazla akşam yemeğinin ardından, nihayet yeni Kral ile özel bir görüşme sağlamayı başardı. Hoşbeş ve havadan sudan sohbetin ardından, konu siyasete dönüyor ve Kral, [AST.GetNameDef]'e yardım etmek için ne yapabileceğini soruyor."
 tfv_australia.90.t:0 "Taç Giyme Töreni Ziyareti"
 tfv_australia.92.a:0 "Kral'dan morali artırmak için Avustralya'yı ziyaret etmesini iste."
 tfv_australia.92.b:0 "Kral'dan bir askere alma kampanyasını desteklemesini iste."
 tfv_australia.92.c:0 "Kral'dan hükûmeti alenen desteklemesini iste."
 tfv_australia.92.desc:0 "[AST.GetLeader], Kral VIII. Edward ile Wallis Simpson arasındaki evlilik törenine katılmak üzere Britanya'ya gitti. Birkaç haftalık öğle yemekleri, akşam yemekleri, bahçe partileri, resepsiyonlar ve daha fazla akşam yemeğinin ardından, nihayet yeni Kral ile özel bir görüşme sağlamayı başardı. \n\nHoşbeş ve havadan sudan sohbetin ardından, konu siyasete dönüyor. Kral, Commonwealth dayanışması ve anavatana sadakat üzerine uzun bir nutuk çekiyor ve kıta siyasetine değinmeye başladığında [AST.GetLeader] biraz rahatsız olmaktan kendini alamıyor. Kral, [AST.GetNameDef]'e yardım etmek ve oradaki halka kendini sevdirmek için ne yapabileceğini soruyor."
 tfv_australia.92.t:0 "Kral VIII. Edward Avustralya'yı Ziyaret Ediyor"
 tfv_australia.95.a:0 "Derinden rahatsız edici."
 tfv_australia.95.desc:0 "Son haftalarda Endonezya genelinde Milliyetçi ajitasyonda belirgin bir artış oldu. Milliyetçi sempatizanların sayısına ilişkin istihbarat tahminleri endişe verici boyutlara ulaştı. Özellikle endişe verici olan, bazı Milliyetçi liderlerin açıkça silahlı bir isyanı tartıştığına dair raporlardır. Daha dün, bir donanma gemisi Cava'nın güneyinde şüpheli bir balıkçı teknesini durdurdu. Gemide resmi işaretleri olmayan silahlar ve mühimmat bulundu. Mürettebatın sorgulanması şimdiye kadar hiçbir sonuç vermedi, ancak görünüşe göre birisi sorun çıkarmaya çalışıyor."
 tfv_australia.95.t:0 "Endonezya'da Milliyetçiler Yükselişte"
 tfv_australia.96.a:0 "Milliyetçi pisliğe diren!"
 tfv_australia.96.b:0 "Ayaklanmaya katıl!"
 tfv_australia.96.desc:0 "Silahlı Milliyetçiler Endonezya genelinde sokaklara dökülüyor. Ayaklanmaya karşı askeri ve polis eylemleri şimdiye kadar başarısız oldu. Bu silahlı isyan, Milliyetçi duyarlılıktaki ani bir yükselişin ardından geldi ve bu şimdi tam bir iç savaşta olduğumuz anlamına geliyor."
 tfv_australia.96.t:0 "İç Savaş!"
 tfv_canada.1.a:0 "Bu sağlam bir strateji. [From.GetNameDef] ile birleşeceğiz!"
 tfv_canada.1.b:0 "Kendi sınırlarımızın ötesindeki meselelere sürüklenme şansını kabul etmeyeceğiz."
 tfv_canada.1.d:0 "Kuzey Amerika kıtasındaki diplomatik çıkarların hizalanması ve Avrupa'nın gün geçtikçe daha fazla çalkantı yaşaması nedeniyle [From.GetNameDef] radikal bir siyasi hamle önerdi.\nKarşılıklı bir savunma paktı yaparak, Amerika kıtasının güvenliğini ve bütünlüğünü garanti altına alabilir, aynı zamanda herhangi bir durumda siyasi ve askeri seçeneklerimizi önemli ölçüde genişletebiliriz. [From.GetLeader], [Root.GetNameDef] ve [From.GetNameDef]'nin refahını sağlamak için bunun \"bariz bir seçim\" olduğunu belirtti ve [Root.GetLeader], aksini iddia etmenin zor olduğu konusunda hemfikir görünüyor."
 tfv_canada.1.t:0 "[From.GetNameDefCap] Kuzey Amerika İttifakı Talep Ediyor"
 tfv_canada.10.a:0 "Tüm gerçek devrimcileri kollarımızı açarak karşılıyoruz!"
 tfv_canada.10.b:0 "Şu anda çok büyük bir risk."
 tfv_canada.10.d:0 "Commonwealth'i terk etmesinin ardından, [From.GetNameDef], [Root.GetFactionName]'deki müttefiklerimizden biri olarak bir pozisyon için müzakere ediyor. Komünist inançları güçlü ve Amerikan kıtasında bir müttefikin dünya devrimi davasına büyük fayda sağlayacağı inkar edilemez...\nVatansever Sosyalizm kavramları, bağımsız doğaları ve [From.GetLeader]'in denediği Sanayileşme Mucizesi gelecekte sorunlara neden olabilse de, bu kaçırılmayacak kadar iyi bir fırsat gibi görünüyor."
 tfv_canada.10.t:0 "[From.GetNameDefCap] [Root.GetFactionName]'e Üyelik Arıyor"
 tfv_canada.11.a:0 "Bu kıtaya bir devrimin gerçekte ne anlama geldiğini göstereceğiz!"
 tfv_canada.11.d:0 "Yüzyıllarca süren sömürgeci şiddetle ayakta duran bir burjuvazinin kalıntılarını attıktan sonra, nihayet dünya sahnesine çıktık. Dünya devrimini yerkürenin her yerine yaymaya çalışırken, [From.GetFactionName]'de [From.GetNameDef]'in yanında duruyoruz!"
 tfv_canada.11.t:0 "Gerçek bir Amerikan Devrimi"
 tfv_canada.12.a:0 "Adalet, anlayış ve Kanada tarzı için!"
 tfv_canada.12.d:0 "\"Küresel istikrar\" üzerinde yaratacağı etkiden korkan [From.GetLeader], [From.GetFactionName]'ye üyelik talebimizi açıkça reddetti.\n[From.GetNameDef]'nin eski dünyanın küçük siyasetinden üstün olmadığını görerek, bizim devrimci çabalarımız onlar için de boşa gitmiş olacaktı. yol.\n\n[Root.GetNameDef] faşizm dünyasında tek başına dursa bile, gerçek sosyalizm dünyamızın tüm topraklarındaki her işçiye ulaştırılana kadar vazgeçmeyeceğiz!"
 tfv_canada.12.t:0 "[From.GetNameDefCap] [From.GetFactionName]'e Üyeliği Reddediyor"
 tfv_canada.2.a:0 "Denizden Denize!"
 tfv_canada.2.d:0 "Bugün, [Root.GetNameDef] ile [From.GetNameDef] arasında paylaşılan dostluğu ve desteği kutlayan yeni bir antlaşmanın imzalanmasını işaret ediyor. İki ülkemiz, kıtamızın savunması da dahil olmak üzere dış politika konularında birbirine yardım etme sözü veriyor.\n\nUluslarımız birlikte çalışırken, dünyanın yabancı saldırganlarının bize karşı hiç şansı yok."
 tfv_canada.2.t:0 "Kuzey Amerika İttifakı Kuruldu"
 tfv_canada.20.a:0 "[From.GetAdjective]ler ve [Root.GetAdjective]lerin birlikte çalışması doğaldır!"
 tfv_canada.20.b:0 "Bizim çıkarlarımız Avrupa'da, [From.GetNameDef] kendi zeminini oluşturmalı."
 tfv_canada.20.d:0 "[From.GetAdjective] siyasette muhafazakar milliyetçiliğin yükselişini takiben, [From.GetNameDef], İngiliz Milletler Topluluğu'nun zayıf \"demokrasilerinin\" aksine, aslında kendi davalarına yardım etme kapasitesine sahip yeni müttefikler arıyor.\n\n[From.GetNameDef] ile ortaklık sadece ideolojik olarak doğal olmakla kalmayacak, aynı zamanda Kuzey Amerika kıtasındaki çıkarlarımızı gözetebilecek güçlü bir devletin varlığı."
 tfv_canada.20.t:0 "[From.GetNameDefCap] İttifak Arıyor"
 tfv_canada.21.a:0 "Küresel bir güç olarak duruyoruz."
 tfv_canada.21.d:0 "[From.GetNameDefCap], güçlü bir Amerikan devletiyle bir ilişkinin açık faydasını görerek ittifak teklifimizi kabul etti.\nBu diplomatik hamle ile Kuzey Amerika'da gücümüzü yansıtma konusunda çok daha yetenekli olacağız ve Berlin-Ottawa Ekseni'nin keskin bir şekilde Londra'dan geçmesi tesadüf değildir."
 tfv_canada.21.t:0 "Bir Güç İttifakı"
 tfv_canada.22.a:0 "Onlara büyüklüğün gerçekte ne anlama geldiğini göstereceğiz."
 tfv_canada.22.d:0 "Kendi küçücük sınırlarının ötesine bile bakamayan [From.GetLeader]'in [From.GetName]'i, ittifak teklifimizi reddetti.\nElbette, [From.GetAdjective] devletinin ve tüm Avrupa'nın kendi halklarının ağırlığı altında muhtemel çöküşüyle, onlarsız daha iyi olabiliriz."
 tfv_canada.22.t:0 "Avrupa'nın Çürümüşlüğü"
 tfv_canada.3.a:0 "Başka seçeneklerimiz var."
 tfv_canada.3.d:0 "Ortak Savunma Kurulu tarafından örneklendiği gibi, iki ülkemiz arasında resmi bir askeri işbirliği ölçüsünün faydasına rağmen, [From.GetAdjective], kalıcı bir ittifak için müzakerelerimizi reddetti.\nPakt, Kuzey Amerika kıtasının bütünlüğünü sağlayacaktı, ama şimdi anavatanı savunmanın başka yollarını bulmamız gerekecek gibi görünüyor."
 tfv_canada.3.t:0 "[From.GetNameDefCap] Kuzey Amerika İttifakını Reddediyor"
 tfv_canada.30.a:0 "Milliyetçileri destekle."
 tfv_canada.30.b:0 "Cumhuriyetçileri destekle."
 tfv_canada.30.c:0 "Yönetimi Milliyetçilere bırak."
 tfv_canada.30.d:0 "Sinarkistler nüfuz olarak büyüdükçe, talepleri de güç olarak büyüyor. Görünüşe göre hükûmetimiz artık onların sağcı politikalarını kontrol altında tutamayabilir, çünkü [Root.GetNameDef] genelinde Sinarkistler ve hükûmet destekçileri arasında çatışmalar bildirildi. Bu, her iki tarafta da ölümcül silahların kullanılmasını içeriyor.\nSinarkist partinin militarizasyonunun ne zaman ve nasıl gerçekleştiği belirsiz olsa da, mevcut hükûmete gerçek ve acil bir tehdit oluşturuyorlar.\n\nİç savaş kapıda."
 tfv_canada.30.t:0 "Bir Sinarkist Devrim"
 tfv_canada.40.a:0 "Çürümüş komşu devletimizin canını sıkacağız!"
 tfv_canada.40.b:0 "Saldırgan olarak görülme riskini alamayız."
 tfv_canada.40.d:0 "Yakın zamanda reforme edilen [Root.GetAdjective] devletinin gücü inkar edilemez olsa da, bölgesel siyasetin gerçekleri de öyle. Eski düşmanımız [USA.GetNameDef], kıtaya hükmediyor ve kendilerini kendi sınırlarının ötesindeki meselelerden uzak tutamadıklarını kanıtladılar.\nBu, [From.GetNameDef] ile işbirliği teklifini daha da değerli kılıyor. Ülkelerimizden herhangi biri tek başına [USA.GetAdjective] müdahalesini önleyecek güce sahip olmayabilir, ancak hem kuzeye hem de güneye karşı [USA.GetLeader], harekete geçmeden önce iki kez düşünmek zorunda kalacaktır.\n\nVe belki de haklı olarak [Root.GetAdjective] toprağının iadesine daha yatkın olacaklardır..."
 tfv_canada.40.t:0 "Bir Hakimiyet Planı"
 tfv_canada.41.a:0 "Beyaz Saray tekrar yanacak!"
 tfv_canada.41.d:0 "[MEX.GetAdjective] hükûmeti, güney komşularımızın agresif politikalarının ülkelerimize oluşturduğu tehdit konusunda tamamen hemfikirdir. Hayatta kalmamızın tek yolu, kıta üzerindeki boğucu kontrollerini kırmaktır. Yeniden silahlanmalarını bitirmeden önce yakında saldırmalıyız. Elbette yeni dostlarımıza belirli toprak tavizleri verilmesi gerekecek, ama birlikte, Amerikan hegemonyasına bir son vereceğiz!"
 tfv_canada.41.t:0 "Meksika Kabul Ediyor"
 tfv_canada.42.a:0 "Aptallar! Korkaklar! HAİNLER!"
 tfv_canada.42.desc:0 "[MEX.GetAdjective] hükûmeti, ortak düşmanımıza karşı birlikte çalışma teklifimizi reddetti. Görünüşe göre, kendilerine saldırmaya hazır çıngıraklı yılanı basitçe görmezden gelebileceklerine, tehdit edici hamleler yapmadıkları sürece onları yalnız bırakacağını umarak inanıyorlar. Görünüşe göre savunmalarımıza yalnız bakmak zorundayız."
 tfv_canada.42.t:0 "Meksika Reddediyor"
 tfv_canada.50.a:0 "Düşmanın bizi yıkmasına izin vermeyeceğiz!"
 tfv_canada.50.d:0 "Bugün fabrikalarımızdan birini bir patlama sarstı ve başlangıçta bir sanayi kazası gibi görünse de, soruşturma, üretim hatları boyunca kasıtlı olarak patlayıcıların yerleştirildiğini ortaya çıkardı.\nCan kaybına yas tutarken, savaş çabasına yönelik bir saldırı göz ardı edilemez.\n\nBu saldırının arkasında kim varsa, tüm [Root.GetNameDef] için bir tehdit oluşturuyor!"
 tfv_canada.50.t:0 "İçimizdeki Düşman"
 tfv_canada.51.a:0 "Çemberleri ne kadar büyükse, onları bulmak o kadar kolay olacaktır."
 tfv_canada.51.d:0 "[Root.GetAdjective] topraklarında bir saldırı daha meydana geldi, bu sefer doğrudan askeri fabrikalarımızdan birini hedef alıyor!\nOnarımlar başlarken üretim durduruldu, ancak failler hala serbest.\n\nEn azından bunun tek bir bireyden ziyade bir grubun işi olduğu anlaşıldı."
 tfv_canada.51.t:0 "Bir Saldırı Daha"
 tfv_canada.52.a:0 "Durdurulmaları gerekiyor!"
 tfv_canada.52.d:0 "Kolluk kuvvetleri, devam eden fabrika sabotajı davasında büyük adımlar atmak için askeri polisle birlikte çalışıyor. Bir başka fabrikanın daha hedeflenmesiyle, sabotajın yabancı casuslar tarafından değil, daha ziyade Quebec'te getirilen zorunlu askerliği protesto eden bir grup tarafından yapıldığı anlaşıldı!\n\nSiyasi endişeleri ne olursa olsun, ülkemiz savaşta ve onlar en yüksek dereceden hainlerdir."
 tfv_canada.52.t:0 "Quebec Çemberi"
 tfv_canada.53.a:0 "[Root.GetNameDef] için bir kayıp değil, bir zafer!"
 tfv_canada.53.d:0 "Quebec Çemberi için bir sonraki sabotaj hedefi olarak kabul edilen fabrikada bir tuzak kurulmuştu. Gecenin bir yarısı, kolluk kuvvetleri sızanları bekledi.\nSabotajcılar geldiğinde, beklenenden çok daha büyük ve çalınmış ordu teçhizatıyla daha ağır silahlı bir grup oldukları ortaya çıktı. Bir çatışma çıktı ve Quebec Çemberi'nin planlarının yapacağı kadar üretim hattına zarar verdi.\nAncak, şiddetli çatışmadan sonra, tek bir sabotajcı bile canlı kalmadı. Quebec Çemberi sona erdi."
 tfv_canada.53.t:0 "Yolun Sonu"
 tfv_canada.60.a:0 "Onlara istediklerini verin, [Root.GetNameDef] şu anda bu konuda kavga edemez."
 tfv_canada.60.b:0 "[ENG.GetAdjective] toprağının bir karışını bile vermeyiz!"
 tfv_canada.60.d:0 "Labrador ve Newfoundland'ın sömürge bölgelerini kendi ülkelerinin bir parçası olarak \"yurtlarına geri getirme\" arzusunu uzun süredir ifade eden [From.GetNameDef], şimdi bunları talep etme adımlarına gitti.\n[From.GetLeader], [From.GetNameDef]'nin burayı [From.GetAdjective] toprak olarak kabul ettiğini ve \"buna ulaşmak için gerekli adımları atacaklarını\" açıkça belirtti."
 tfv_canada.60.t:0 "[From.GetNameDefCap] Labrador ve Newfoundland'ı Talep Ediyor"
 tfv_canada.61.a:0 "Bir kıyı şeridi tek güvenli sınırdır!"
 tfv_canada.61.d:0 "[From.GetNameDef]'in Labrador ve Newfoundland'ı devretmesiyle, [Root.GetNameDef] nihayet bir bütün oldu. Gerçekten Denizden Denize, her gerçek [Root.GetAdjective] şimdi sınırlarımız içinde, ait oldukları yerde.\nBir sonraki adımımız [Root.GetAdjective] devletinin emniyetini ve güvenliğini sağlamak olmalı!"
 tfv_canada.61.t:0 "Bir Kaderin Gerçekleşmesi"
 tfv_canada.62.a:0 "[ROOT.GetNameDefCap] bir olacak!"
 tfv_canada.62.d:0 "Onların çökmekte olan \"emperyal haklarına\" başvurmak ve Labrador ile Newfoundland'in korunması gereken sömürge mülkleri statüsüne çağrıda bulunmak [From.GetNameDef], hakkımız olan topraklardan vazgeçmeyi reddetti! Bu insanlar [Root.GetAdjective]'lerdir ve Newfoundland ve Labrador [Root.GetAdjective] kaynağa sahiptirler, ancak [From.GetAdjective] efendilere cevap vermek zorundadırlar.\nBu kabul edilemez bir durumdur, ancak [From.GetNameDef]'nin diplomatik bir çözüme ikna edilemeyeceği açıktır..."
 tfv_canada.62.t:0 "İmparatorluk Kibri"
 tfv_canada.70.a:0 "Bunda bir sakınca görmüyoruz"
 tfv_canada.70.b:0 "Aman Tanrım, hayır!"
 tfv_canada.70.desc:0 "[FROM.GetLeader], Kanada parlamentosunda yapılan bir oylamanın ardından, önceki Britanya Kuzey Amerika Yasası'nda bir revizyon imzalamamızı ve bunun aracılığıyla [FROM.GetNameDef] ile Newfoundland ve Labrador sömürgesi arasında birlik ilan etmemizi talep etmek için bize başvurdu."
 tfv_canada.70.t:0 "[FROM.GetNameDefCap] Newfoundland ile Birlik İstiyor"
 tfv_canada.71.a:0 "Harikulade!"
 tfv_canada.71.desc:0 "[FROM.GetName]'deki büyük dostlarımız talebimizi kabul etti ve önerilen Newfoundland Yasasını imzaladı, bu süreçte Newfoundland ve Labrador üzerindeki egemenliği etkili bir şekilde bize devretti. Bu Kanada için harika bir gün!"
 tfv_canada.71.t:0 "[FROM.GetNameDefCap] Newfoundland Yasasını İmzalıyor"
 tfv_canada.72.a:0 "Bunun ilişkilerimize zarar verdiğini fark ediyorlar mı?"
 tfv_canada.72.desc:0 "Büyük dostlarımız olduğunu düşündüğümüz [FROM.GetAdjective]ler, Newfoundland ve Labrador ile birleşme teklifimizi reddettiler. İnatçı milletvekilleri ve politikacıları bu konudaki pozisyonlarını bize gösterdiler ve ileriye dönük olarak onlarla nasıl hareket etmemiz gerektiğini biliyoruz."
 tfv_canada.72.t:0 "[FROM.GetNameDefCap] Bildirgeyi İmzalamayı Reddediyor"
 tfv_canada.73.a:0 "En azından tazminat alıyoruz..."
 tfv_canada.73.desc:0 "Newfoundland Yasası'nı imzaladıktan sonra, Newfoundland ve Labrador'un egemenliği müttefikimiz [CAN.GetNameDef]'e devredilecek. Bunun müzakere edilemez olduğunu belirtmelerine rağmen, en azından bölgedeki üslerimizden vazgeçtiğimiz için ekonomik tazminat almamız gerektiğini kabul ediyorlar."
 tfv_canada.73.t:0 "[CAN.GetName]'e Britanya Tarafından Newfoundland ve Labrador Verildi"
 tfv_new_zealand.1.a:0 "Mücadeleye katılan herkes hoş karşılanır."
 tfv_new_zealand.1.b:0 "Onları kabul etmek, bizi sadece uzak bir bölgedeki olası bir çatışmaya açacaktır."
 tfv_new_zealand.1.desc:0 "Devrim [From.GetNameDef]'de başarılı oldu! Ülkede yeni bir komünist hükûmet yönetimi devraldı ve Komintern'e üyelik arıyor."
 tfv_new_zealand.1.t:0 "[From.GetNameDefCap] Komintern'e Üyelik Talep Ediyor"
 tfv_new_zealand.2.a:0 "[Root.GetNameDefCap] ve [From.GetFactionName] omuz omuza yürüyecek!"
 tfv_new_zealand.2.desc:0 "Dikkatli bir değerlendirmeden sonra, Komintern Merkez Komitesi üyelik talebimizi onayladı."
 tfv_new_zealand.2.t:0 "Komintern Üyeliği Onaylandı"
 tfv_new_zealand.3.a:0 "Belki de yanılan onlardır?"
 tfv_new_zealand.3.desc:0 "Heyetimiz, Komintern Başkanı tarafından, bizimki kadar küçük bir ülkenin muhtemelen bir komünist devrim üretebilecek gelişmiş bir sanayi ülkesi olamayacağını açıklayan uzun bir derse katlanmak zorunda kaldı. Görünüşe göre biz başka bir şeyiz. Her halükarda, Komintern'in bir parçası olamayız."
 tfv_new_zealand.3.t:0 "Komintern Üyeliği Reddedildi"
 tfv_new_zealand.4.a:0 "Yerlerini bildikleri sürece."
 tfv_new_zealand.4.b:0 "Savaşla alabileceğin bir şeyi neden diplomasiyle alasın?"
 tfv_new_zealand.4.desc:0 "Yenilmez ordularımızın gücünü gören [NZL.GetName] hükûmeti, çatışmanın bizim tarafımızda olmanın daha iyi olacağına karar verdi. Soru, onlara izin verip vermememiz gerektiğidir."
 tfv_new_zealand.4.t:0 "[From.GetNameDefCap] davamıza katılmak istiyor"
 tfv_new_zealand.5.a:0 "Bu bizi güvende tutacak."
 tfv_new_zealand.5.desc:0 "Japonya ile ittifak talebimiz onaylandı."
 tfv_new_zealand.5.t:0 "Japonya onaylıyor"
 tfv_new_zealand.6.a:0 "Kabalık."
 tfv_new_zealand.6.desc:0 "[JAP.GetAdjective] hükûmeti talebimize resmi bir yanıt verme zahmetine bile girmedi. Söylentilere göre, [JAP.GetAdjective] hükûmet çevrelerinde aslında büyük bir kahkaha kaynağı olarak kabul ediliyor."
 tfv_new_zealand.6.t:0 "Japonya ittifakı reddediyor"
 tfv_new_zealand.7.a:0 "Özlenecek."
 tfv_new_zealand.7.desc:0 "Trajik bir gelişmeyle, Yeni Zelanda'nın çok sevilen Başbakanı Michael Joseph Savage, kanserden vefat etti. Bütün ülke, birçok kişinin Yeni Zelanda'nın refah sistemini kurmasıyla itibar ettiği adamın yasını tutuyor. Tarih, onun cesaretini ve etrafındakilere olan nezaketini hatırlayacaktır."
 tfv_new_zealand.7.t:0 "Michael Joseph Savage Öldü"
 tfv_new_zealand.9.a:0 "Makul bir talep."
 tfv_new_zealand.9.b:0 "Adaların değeri çok fazla."
 tfv_new_zealand.9.desc:0 "[From.GetNameDefCap], [Root.GetNameDef]'e Pasifik mülklerinin kontrolünü talep eden bir diplomatik talepte bulundu. Kendi Maori halkıyla olan yakın ilişkilerini gerekçe gösteren [From.GetNameDef] bakanları, Pasifik halklarıyla onlara bir aidiyet duygusu verecek ve onları [From.GetFactionName] davası için savaşmaya teşvik edecek bir anlayışa ve derin bir kişisel ilişkiye sahip olduklarını iddia ediyorlar. Birçoğu [From.GetLeader]'in [From.GetNameDef]'i birleşik bir Polinezya devletine dönüştürme hırsı olduğuna inanıyor ve bunun [Root.GetNameDef]'e fayda sağlayıp sağlamayacağı henüz belirlenmedi."
 tfv_new_zealand.9.t:0 "[From.GetNameDefCap] [Root.GetAdjective] Polinezyası'nın Kontrolünü Talep Ediyor"
 tfv_new_zealand.91.a:0 "Mükemmel."
 tfv_new_zealand.91.desc:0 "[From.GetNameDefCap] tarafından işgal edilen Polinezya eyaletlerini kontrol etme yönündeki makul talebimiz kabul edildi ve şimdi bir dizi yeni ada toprağının kontrolü bizde."
 tfv_new_zealand.91.t:0 "[From.GetNameDefCap] Kabul Ediyor!"
 tfv_new_zealand.92.a:0 "Lanet olsun!"
 tfv_new_zealand.92.desc:0 "[From.GetNameDefCap]'e giden [Root.GetAdjective] heyeti, [Root.GetNameDefCap]'in [From.GetNameDefCap]'in Polinezya topraklarından hiçbirini almayacağı hayal kırıklığı yaratan haberle geri döndü."
 tfv_new_zealand.92.t:0 "[From.GetNameDefCap] Reddediyor"
 tfv_raj.1.a:0 "Birleşik Krallık'a gitmeliler."
 tfv_raj.1.b:0 "Bunlara anavatan savunması için ihtiyacımız var!"
 tfv_raj.1.desc:0 "İmparatorluğun her yerinde, Kraliyet Hava Kuvvetleri için yeni savaşçılar için para toplamak amacıyla yerel topluluklarda \"Savaşçı Fonları\" kuruldu. Zengin kişiler de orduya uçak satın almak için para yatırdı. Haydarabad Nizam'ı 2 tam filonun satın alınmasını finanse etmeye yetecek kadar para bağışladı. Sorun bunların nereye konuşlandırılması gerektiğidir."
 tfv_raj.1.t:0 "Avcı Fonları"
 tfv_raj.2.a:0 "Çok faydalı olacaklar."
 tfv_raj.2.desc:0 "Hintli bir prens olan Haydarabad Nizam'ı, Kraliyet Hava Kuvvetleri için en modern savaş uçaklarımızdan iki tam filoyu satın almak için parayı cömertçe bağışladı. Hükümet teşekkürlerini ileterek ilk uçağa \"Haydarabad'ın Ruhu\" isminin verileceğini duyurdu."
 tfv_raj.2.t:0 "Hint Prensi avcı uçakları bağışlıyor"
 tfv_raj.201.a:0 "Göklerden vurun, kardeşler!"
 tfv_raj.201.desc:0 "Savaş Esirlerinden toplanan Battaglione Azad Hindoustan askerleri, Hint özgürlüğü peşinde canlarını vermeye yemin ettiler. Sabotaj ve sızma konusunda eğitimli bu seçkin askerler, aynı zamanda düşman hatlarının gerisinde kargaşa yaratmak için paraşütle atılma yeteneğine de sahiptir."
 tfv_raj.201.t:0 "Battaglione Azad Hindoustan"
 tfv_raj.21.a:0 "Bu bir felaket!"
 tfv_raj.21.desc:0 "Bengal daha önce de kıtlıklar yaşadı, ancak bu sefer olaylar işleri normalden çok daha kötü hale getirmek için bir araya geldi. Şaşırtıcı derecede beceriksiz sömürge yönetimi, Bengal'deki pirinç hasadının büyük bir bölümünü silip süpüren bir kasırgaya yeterince tepki veremediğini - ya da belki de isteksiz olduğunu - açıkça gösterdi. Ülkenin savaştan etkilenen bölgelerinden mülteciler akın ederken, gıda talebi her geçen gün artarken arz yetersiz kalıyor. \n\nGıda fiyatları önemli ölçüde arttı ve bu da insanların artık ailelerini beslemeye yetmeyen işlerden uzak durmasına yol açtı. Giderek daha fazla insanın evlerini terk edip onlara yardım etmek için hiçbir şey yapmayan bir hükûmet için savaşmayı reddetmesiyle orduya alım sayıları da önemli ölçüde düştü."
 tfv_raj.21.t:0 "Bengal Kıtlığı"
 tfv_raj.210.a:0 "Rahatsız edici."
 tfv_raj.210.desc:0 "Yerel işçiler öğle yemeği molası vermişken, fabrikalarımızdan birini şiddetli bir patlama sarstı. Binanın kendisine önemli hasar verildi ve birkaç işçi uçan camlardan yaralandı. Neyse ki, makine aletleri çoğunlukla sağlam kalmış gibi görünüyor. Polis ve ordu birimleri, müfettişler patlamanın nedenine dair ipuçları aramak için enkazı incelerken bir çevre oluşturdu.\n\nBunun, özgürlük mücadelelerinde protestolarını şiddete dönüştüren Hindistan'ı Terk Et hareketinden bir direniş hücresinin işi olduğuna dair söylentiler dolaşıyor."
 tfv_raj.210.t:0 "Sabotaj mı?"
 tfv_raj.211.a:0 "Kimse onları durdurmayacak mı?"
 tfv_raj.211.desc:0 "İlk patlamadan sadece haftalar sonra, ikinci bir fabrika aniden yok edildi, yine işçiler ana binayı öğle yemeği için terk ettikten hemen sonra. Bunun, iyi planlanmış bir sabotaj ve terörizm kampanyası yürüten organize bir direniş grubunun işi olduğuna pek şüphe yok. Gün ortasında yapılan küstah saldırılar, saldırganların kendilerinden çok emin göründüğünü gösteriyor."
 tfv_raj.211.t:0 "Sabotaj!"
 tfv_raj.212.a:0 "Bu iş çığırından çıkıyor."
 tfv_raj.212.desc:0 "Üçüncü bir patlama eyaletlerimizden birindeki bir fabrikayı harap etti. Bu sefer, bomba vardiyanın ortasında patladığı için saldırganların zamanlamayı yanlış ayarladığı görülüyor. Düzinelerce işçi öldü ve düzinelercesi hala kayıp. Müfettişler birkaç ipucunu takip ediyor ve bir dizi ev zaten arandı. Sonuçlar derinden rahatsız edici, Hindistan'ı Terk Et propagandasından ham patlayıcılar yapmak için kullanılabilecek aletlere kadar uzanıyor. \n\nAncak, tutuklananların hiçbiri elebaşı gibi görünmüyor ve şimdiye kadar konuşmayı reddettiler."
 tfv_raj.212.t:0 "İçimizdeki Düşman"
 tfv_raj.30.a:0 "Britanya İmparatorluğu'nu tamamen ve kesin olarak sona erdirelim."
 tfv_raj.30.b:0 "Ne kadar da saçma bir düşünce."
 tfv_raj.30.desc:0 "Tüm Hindistan İleri Bloku'nun lideri Subhas Chandra Bose, Hint özgürlüğü mücadelesinde yardımımızı istemek için Moskova'ya geldi. Büyük Oyun günlerine kadar uzanan, Rusya ile Britanya arasındaki Hindistan'daki geleneksel çatışmalara atıfta bulunarak, Hintlilerin Britanya'dan bağımsızlıklarını elde etmelerine yardımcı olmak için doğal bir seçim olduğumuza inanıyor."
 tfv_raj.30.t:0 "Hint Komünistleri destek istiyor"
 tfv_raj.31.a:0 "O zaman bize başka seçenek bırakmıyorlar. Onları bırakmalıyız."
 tfv_raj.31.b:0 "Eğer tekrar Büyük Oyun oynamak istiyorlarsa, o zaman oynayalım."
 tfv_raj.31.desc:0 "[SOV.GetAdjective] büyükelçisi bugün Dışişleri Bakanlığı'nı ziyaret ederek Hint Bağımsızlığı meselesini görüştü. Toplantı sırasında, [SOV.GetNameDef]'in Hindistan üzerindeki devam eden yönetimimizi kesinlikle kabul edilemez bulduğunu çok açık bir şekilde belirtti. Görünüşe göre Bose'un sözleri [SOV.GetLeader]'in kulağına gitmiş ve Rusları onun davasına çekmiş. \n\nŞimdilik, [SOV.GetAdjective]ler kendilerini ülkelerinde Hintli gönüllüleri eğitmekle sınırlıyor gibi görünüyor, ancak alt kıtada ortaya çıkan herhangi bir çatışmaya pekala müdahale edebilirler."
 tfv_raj.31.t:0 "[SOV.GetNameDefCap] Hint Bağımsızlığını Destekliyor"
 tfv_raj.32.a:0 "Mücadele devam ediyor."
 tfv_raj.32.desc_SOV_helps:0 "Moskova'daki müzakerelerimiz çarpıcı bir başarı ile sonuçlandı. Bugün Pravda'nın manşeti şöyle: \"Hindistan halkının özgürlük mücadelesi bizim mücadelemizdir!\" Yoldaş [SOV.GetLeader] bizzat Chandra Bose ile görüştü ve tam destek sözü verdi."
 tfv_raj.32.desc_SOV_helps_ENG_reject:0 "Kolay bir bağımsızlık yolu umutlarımız Britanya sömürge ofisi tarafından acımasızca sona erdirildi. [SOV.GetAdjective] Büyükelçisi onlara kendi kaderimizi belirlememize izin verilmesi talebiyle yaklaştığında, tartışılacak bir şey olmadığı hızla söylendi. [ENG.GetAdjective] hükûmeti, bağımsızlık meselemizin hiçbir yabancı gücün müdahale edemeyeceği bir iç mesele olduğunu iddia ediyor."
 tfv_raj.32.t:0 "[SOV.GetNameDefCap] davamızı üstleniyor"
 tfv_raj.33.a:0 "Belki de Almanlara sormalıyız?"
 tfv_raj.33.desc:0 "Subhas Chandra Bose, [SOV.GetAdjective] hükûmetinin mücadelemize yardım etmesini sağlamaya çalıştı, ancak çabaları başarıyla sonuçlanmadı. [SOV.GetLeader] ile konuşmak için birkaç gün bekledikten sonra, zar zor on dakika süren bir toplantı şansı verildi. \n\n[SOV.GetLeader] halkımızın devrimci mücadelesine büyük hayranlık duyduğunu ifade etse de, ülkemizin tam komünizme giden yolda bir sonraki adıma hazır olduğuna inanmadığını da açıkça belirtti."
 tfv_raj.33.t:0 "[SOV.GetAdjective]ler yardım etmeyi reddediyor"
 tfv_raj.34.a:0 "Zafer!"
 tfv_raj.34.desc:0 "Bugün, Hint tarihinde yeni bir dönemin başlangıcını işaret ediyor. Yüzyıllarca süren yabancı egemenliğinden sonra, nihayet tam bağımsızlığımızı elde ettik. Yerel [ENG.GetAdjective] memurlarına [RAJ.GetAdjective] özyönetimine geçişte yardımcı olmaları emredildi ve önümüzdeki birkaç ay içinde evlerine gönderilecekler. \n\nYeni [SOV.GetAdjective] yoldaşlarımızın yardımıyla, şimdi önümüzdeki göreve odaklanabiliriz - halkımız için bir ulus inşa etmek."
 tfv_raj.34.t:0 "Hindistan'a Özgürlük"
 tfv_raj.40.a:0 "İngilizler bizim sömürgelerimizi aldı. Şimdi biz onlarınkini alıyoruz."
 tfv_raj.40.b:0 "Ne kadar da saçma bir düşünce."
 tfv_raj.40.desc:0 "Tüm Hindistan İleri Bloku'nun lideri Subhas Chandra Bose, Hint özgürlüğü mücadelesinde yardımımızı istemek için Berlin'e geldi. [GER.GetLeader]'e yazdığı bir mektupta, hayranlığını dile getirdi ve bağımsız bir Hindistan'ın [GER.GetNameDef]'i dünyadaki haklı yerine geri getirme çabamızda değerli bir müttefik olacağını öne sürdü."
 tfv_raj.40.t:0 "Hint Milliyetçileri destek istiyor"
 tfv_raj.41.a:0 "O zaman bize başka seçenek bırakmıyorlar. Onları bırakmalıyız."
 tfv_raj.41.b:0 "Hindistan'da daha önce Büyük Oyun oynadık. Bakalım Almanlar ne kadar iyi oynuyor."
 tfv_raj.41.desc:0 "[GER.GetAdjective] büyükelçisi bugün Dışişleri Bakanlığı'nı ziyaret ederek Hint Bağımsızlığı meselesini görüştü. Toplantı sırasında, [GER.GetLeader]'in Hindistan üzerindeki devam eden yönetimimizi kesinlikle kabul edilemez bulduğunu çok açık bir şekilde belirtti. Görünüşe göre Bose, bağımsız bir Hindistan'ın bölgedeki [GER.GetAdjective] çıkarlarını destekleyeceğine söz vermiş. \n\nBüyükelçi, eğer reddedersek hükûmetinin ne yapmaya istekli olduğunu açıkça belirtmeyi reddetti, ancak savaşa bile başvurabileceklerini varsaymalıyız."
 tfv_raj.41.t:0 "[GER.GetNameDefCap] Hint Bağımsızlığını Destekliyor"
 tfv_raj.42.a:0 "Mücadele devam ediyor."
 tfv_raj.42.desc_GER_helps:0 "[GER.GetAdjective] dışişleri bakanıyla görüştükten ve davasını savunduktan sonra, Subhas Chandra Bose, [GER.GetAdjective]leri bizi desteklemeye ikna etmeyi başardı. Bose ayrıca Alman lider [GER.GetLeader] ile de görüştü ve Britanya Savaş Esirlerinden bir Hintli gönüllü birimi kurmak da dahil olmak üzere birkaç saat boyunca ortak çıkar konularını tartıştılar."
 tfv_raj.42.desc_GER_helps_ENG_reject:0 "Kolay bir bağımsızlık yolu umutlarımız Britanya sömürge ofisi tarafından acımasızca sona erdirildi. [GER.GetAdjective] Büyükelçisi onlara kendi kaderimizi belirlememize izin verilmesi talebiyle yaklaştığında, tartışılacak bir şey olmadığı hızla söylendi. [ENG.GetAdjective] hükûmeti, bağımsızlık meselemizin hiçbir yabancı gücün müdahale edemeyeceği bir iç mesele olduğunu iddia ediyor."
 tfv_raj.42.t:0 "[GER.GetNameDefCap] davamızı üstleniyor"
 tfv_raj.43.a:0 "Lanet olsun."
 tfv_raj.43.desc:0 "Subhas Chandra Bose, [GER.GetAdjective] hükûmetinin mücadelemize yardım etmesini sağlamaya çalıştı, ancak çabaları başarıyla sonuçlanmadı. [GER.GetLeader] ile konuşmak için birkaç gün bekledikten sonra, zar zor on dakika süren bir toplantı şansı verildi. \n\n[GER.GetLeader] durumumuza ve fanatik direniş ruhumuza büyük hayranlık duyduğunu ifade etse de, ülkemizin kaynak harcamaya değer olduğuna inanmadığını da açıkça belirtti."
 tfv_raj.43.t:0 "[GER.GetAdjective]ler yardım etmeyi reddediyor"
 tfv_raj.44.a:0 "Zafer!"
 tfv_raj.44.desc:0 "Bugün, Hint tarihinde yeni bir dönemin başlangıcını işaret ediyor. Yüzyıllarca süren yabancı egemenliğinden sonra, nihayet tam bağımsızlığımızı elde ettik. Yerel [ENG.GetAdjective] memurlarına [RAJ.GetAdjective] özyönetimine geçişte yardımcı olmaları emredildi ve önümüzdeki birkaç ay içinde evlerine gönderilecekler. \n\nYeni [GER.GetAdjective] dostlarımızın yardımıyla, şimdi önümüzdeki göreve odaklanabiliriz - halkımız için bir ulus inşa etmek."
 tfv_raj.44.t:0 "Hindistan'a Özgürlük"
 tfv_raj_focus_paratrooper_tt:0 "Battaglione Azad Hindoustan paraşütçüleri İtalya'da konuşlandırılacak."
 tfv_raj_quit_india_unrest_tt:0 "Hareketin destekçilerinin değişiklik talep etmesi bekleniyor."
 tfv_south_africa.1.a:0 "Enerjimizi Avrupa'ya odaklamalıyız."
 tfv_south_africa.1.b:0 "Bu sömürgeleri gayet iyi tutabiliriz."
 tfv_south_africa.1.c:0 "Sömürgeler kendilerini savunmalı."
 tfv_south_africa.1.d:0 "Tüm İmparatorluğun askeri kapsamıyla mücadele ederken, [From.GetNameDef] bize bir idari anlaşma hakkında başvurdu. Güney ve Orta Afrika'daki sömürgelerimiz, savunmalarına yönelik tam hak ve sorumluluklarla onlara devredilmelidir."
 tfv_south_africa.1.t:0 "[From.GetNameDefCap] Afrika Mandası Talep Ediyor"
 tfv_south_africa.10.a:0 "Almanlara yaklaşmalıyız."
 tfv_south_africa.10.b:0 "Hollandalılar bize yardım edecektir."
 tfv_south_africa.10.desc:0 "Ülkemizin geleceği için büyük savaş nihayet geldi. Şimdi bu mücadelede galip gelmemizi sağlamak için alabileceğimiz her türlü desteği güvence altına almalıyız. [From.GetAdjective] kültürünün ve yaşam tarzımızın hayatta kalması tehlikede!"
 tfv_south_africa.10.t:0 "Mücadelemiz için dış yardım"
 tfv_south_africa.100.d:0 "Sömürgeci zalimlerinin elinden kurtarılan [WES.GetName] halkı, kendi kaderlerini tayin etmeye hazır. Geçici bir hükûmet kurdular ve bir anayasa taslağı hazırladılar. Geriye kalan tek şey, yetkiyi askeri valilerimizden yeni [WES.GetAdjective] hükûmetine devretmek."
 tfv_south_africa.100.t:0 "[WES.GetName]'e Özgürlük"
 tfv_south_africa.101.d:0 "Sömürgeci zalimlerinin elinden kurtarılan [ALG.GetName] halkı, kendi kaderlerini tayin etmeye hazır. Geçici bir hükûmet kurdular ve bir anayasa taslağı hazırladılar. Geriye kalan tek şey, yetkiyi askeri valilerimizden yeni [ALG.GetAdjective] hükûmetine devretmek."
 tfv_south_africa.101.t:0 "[ALG.GetName]'e Özgürlük"
 tfv_south_africa.102.d:0 "Sömürgeci zalimlerinin elinden kurtarılan [MOR.GetName] halkı, kendi kaderlerini tayin etmeye hazır. Geçici bir hükûmet kurdular ve bir anayasa taslağı hazırladılar. Geriye kalan tek şey, yetkiyi askeri valilerimizden yeni [MOR.GetAdjective] hükûmetine devretmek."
 tfv_south_africa.102.t:0 "[MOR.GetName]'e Özgürlük"
 tfv_south_africa.103.d:0 "Sömürgeci zalimlerinin elinden kurtarılan [TUN.GetName] halkı, kendi kaderlerini tayin etmeye hazır. Geçici bir hükûmet kurdular ve bir anayasa taslağı hazırladılar. Geriye kalan tek şey, yetkiyi askeri valilerimizden yeni [TUN.GetAdjective] hükûmetine devretmek."
 tfv_south_africa.103.t:0 "[TUN.GetName]'e Özgürlük"
 tfv_south_africa.104.d:0 "Sömürgeci zalimlerinin elinden kurtarılan [LBA.GetName] halkı, kendi kaderlerini tayin etmeye hazır. Geçici bir hükûmet kurdular ve bir anayasa taslağı hazırladılar. Geriye kalan tek şey, yetkiyi askeri valilerimizden yeni [LBA.GetAdjective] hükûmetine devretmek."
 tfv_south_africa.104.t:0 "[LBA.GetName]'e Özgürlük"
 tfv_south_africa.11.a:0 "Onlara avcı uçakları gönder."
 tfv_south_africa.11.b:0 "Onlara tank gönder."
 tfv_south_africa.11.c:0 "Onlara tüfek ve topçu gönder."
 tfv_south_africa.11.desc:0 "[From.GetName]'de şiddetli bir mücadele patlak verdi. Yaşam tarzlarının hayatta kalması için savaşırken, ayırabileceğimiz her türlü destek için umutsuzca bekliyorlar. Bu aynı zamanda yeni silahlarımızdan bazılarını test etme ve Güney Afrika'da değerli bir müttefik edinme fırsatı olacaktır."
 tfv_south_africa.11.e:0 "Kendi başlarına savaşmak zorunda kalacaklar."
 tfv_south_africa.11.t:0 "[SAF.GetNameDefCap] yardım çağrısında bulunuyor!"
 tfv_south_africa.12.a:0 "Onlara avcı uçakları gönder."
 tfv_south_africa.12.b:0 "Onlara tank gönder."
 tfv_south_africa.12.c:0 "Onlara tüfek ve topçu gönder."
 tfv_south_africa.12.desc:0 "Güney Afrika'da Milliyetçiler ve Birlikçiler arasında ağır çatışmalar patlak verdi. Sayıca ve silahça kötü durumda olan Milliyetçiler, atalarının yurdu olan bize destek için başvurdular."
 tfv_south_africa.12.e:0 "Kendi başlarına savaşmak zorunda kalacaklar."
 tfv_south_africa.12.t:0 "[From.GetNameDefCap] yardımımızı istiyor"
 tfv_south_africa.13.a:0 "Hollandalı dostlarımıza ulaşın."
 tfv_south_africa.13.b:0 "Kendi başımıza başaracağız ya da bu girişimde yok olacağız."
 tfv_south_africa.13.desc.a:0 "[GER.GetNameDef]'e giden heyetimiz eli boş döndü. [GER.GetAdjective] hükûmetinden gelen sıcak sözlere rağmen, herhangi bir kesin destek taahhüdü sağlayamadılar. Görünüşe göre artık mücadelemizde Alman hükûmetine güvenemeyiz."
 tfv_south_africa.13.desc.b:0 "Mevcut malzeme eksikliğini gerekçe gösteren [GER.GetAdjective] hükûmeti, bize daha fazla destek göndermenin artık kendi çıkarlarına olmadığına karar verdi. Tüm çabalar bunun yerine kendi ordularını inşa etmeye odaklanmıştır. Bu bizi zor bir durumda bırakıyor."
 tfv_south_africa.13.t:0 "Alman Yanıtı"
 tfv_south_africa.14.a:0 "Alman dostlarımıza ulaşın."
 tfv_south_africa.14.b:0 "Kendi başımıza başaracağız ya da bu girişimde yok olacağız."
 tfv_south_africa.14.desc.a:0 "[HOL.GetNameDef]'e giden heyetimiz sonsuz engeller ve gecikmelerle hayal kırıklığına uğradı. [HOL.GetAdjective] yetkilileri ve sanayi yöneticileriyle yapılan toplantılar son dakikada iptal ediliyor, aramalar geri dönmüyor, telgraflar cevaplanmıyor. Görünüşe göre [HOL.GetAdjective] hükûmeti çabalarımıza yardım etmekle gerçekten ilgilenmiyor."
 tfv_south_africa.14.desc.b:0 "İlk desteğe rağmen, yeni teçhizat için [HOL.GetAdjective] hükûmetiyle yapılan son müzakere turu çöktü. Görünüşe göre [HOL.GetAdjective]ler, elmasları dönüştürülebilir para birimine çevirme sorunlarını gerekçe göstererek artık elmasla ödeme kabul etmeye istekli değiller."
 tfv_south_africa.14.t:0 "[HOL.GetAdjective] Yanıtı"
 tfv_south_africa.15.a:0 "Bunlar çok faydalı olacak."
 tfv_south_africa.15.b:0 "Ordumuzun bel kemiğini oluşturacaklar."
 tfv_south_africa.15.c:0 "Destekleri çok makbule geçti."
 tfv_south_africa.15.desc.a:0 "Almanya'dan bir uçak sevkiyatı geldi. Pilotlarımız onlara ellerini sürmek için çok hevesli ve yeni filoya atanmak için şiddetli bir rekabet başladı."
 tfv_south_africa.15.desc.b:0 "[GER.GetAdjective] dostlarımızla uzun tartışmalardan sonra, bize bir grup hafif tank göndermeyi kabul ettiler. Sayıları az olsa da, dengeyi lehimize kesin olarak değiştirecek şey pekala onlar olabilir."
 tfv_south_africa.15.desc.c:0 "[GER.GetNameDef]'den bir gemi bize ulaştı. Ambarında, bize başka yollarla ulaşan Almanya'dan gelen gönüllüler için tonlarca tüfek ve birkaç ağır top taşıyordu."
 tfv_south_africa.15.t:0 "[From.GetNameDefCap] teçhizat gönderiyor"
 tfv_south_africa.16.a:0 "Bunlar çok faydalı olacak."
 tfv_south_africa.16.b:0 "Ordumuzun bel kemiğini oluşturacaklar."
 tfv_south_africa.16.c:0 "Destekleri çok makbule geçti."
 tfv_south_africa.16.desc.a:0 "[HOL.GetNameDef]'den, [HOL.GetAdjective] havacılık endüstrisindeki birkaç önde gelen ismin cömert bir bağışı sayesinde bir uçak sevkiyatı geldi. Pilotlarımız onlara ellerini sürmek için çok hevesli ve yeni filoya atanmak için şiddetli bir rekabet başladı."
 tfv_south_africa.16.desc.b:0 "[HOL.GetAdjective] dostlarımızla uzun tartışmalardan sonra, bize bir grup deneysel hafif tank göndermeyi kabul ettiler. Sayıları az olsa da, dengeyi lehimize kesin olarak değiştirecek şey pekala onlar olabilir."
 tfv_south_africa.16.desc.c:0 "[HOL.GetNameDef]'den bir gemi bize ulaştı. Ambarında, bize başka yollarla ulaşan [HOL.GetNameDef]'den gelen gönüllüler için tonlarca tüfek ve birkaç ağır top taşıyordu."
 tfv_south_africa.16.t:0 "[From.GetNameDefCap] teçhizat gönderiyor"
 tfv_south_africa.2.a:0 "Hayırsever hükümdarlar olacağız."
 tfv_south_africa.2.d:0 "Anavatana daha yakın artan taahhütlerle, [From.GetNameDef], Afrika sömürgelerinin şimdilik bizim tarafımızdan yönetilmesi gerektiğine karar verdi."
 tfv_south_africa.2.t:0 "[From.GetNameDefCap] Onaylıyor"
 tfv_south_africa.20.a:0 "Emperyalizme karşı mücadelede yeni yoldaşlarımızı hoş karşılıyoruz!"
 tfv_south_africa.20.b:0 "Bu zamanda üyeliklerini kabul etmek, bizi sadece uzak bir bölgedeki olası bir çatışmaya açacaktır."
 tfv_south_africa.20.d:0 "Devrim [From.GetNameDef]'de başarılı oldu! Ülkede yeni bir komünist hükûmet yönetimi devraldı ve Komintern'e üyelik arıyor."
 tfv_south_africa.20.t:0 "[From.GetNameDefCap] Komintern'e Üyelik Talep Ediyor"
 tfv_south_africa.21.a:0 "Omuz omuza, [Root.GetNameDef] ve [From.GetFactionName] geleceğe yürüyecek!"
 tfv_south_africa.21.d:0 "Dikkatli bir değerlendirmeden sonra, Komintern Merkez Komitesi üyelik talebimizi onayladı."
 tfv_south_africa.21.t:0 "Komintern Üyeliği Onaylandı"
 tfv_south_africa.22.a:0 "Belki de yanılan onlardır?"
 tfv_south_africa.22.d:0 "Marx'ın öğretilerine ilişkin özel görüşümüz ile ortodoks yorumlar arasındaki çözülemez farklılıkları gerekçe gösteren Komintern, başvurumuzu reddetti. Bizi sosyal faşist veya daha kötüsü olarak etiketleyecek kadar ileri gitmeseler de, onlardan herhangi bir yardım bekleyemeyeceğimizi açıkça belirtiyorlar."
 tfv_south_africa.22.t:0 "Komintern Üyeliği Reddedildi"
 tfv_south_africa.3.a:0 "Bize güvenmiyorlar mı?"
 tfv_south_africa.3.d:0 "Afrika'daki sömürgelerine yönelik doğrudan bir tehdit eksikliğini gerekçe gösteren [From.GetNameDef], mülklerinin yönetimini bize devretme niyetinde olmadıklarını çok açık bir şekilde belirtti."
 tfv_south_africa.3.t:0 "[From.GetNameDefCap] Reddediyor"
 tfv_south_africa.30.a:0 "Başka seçeneğimiz yok. İlgilenmemiz gereken daha önemli konular var."
 tfv_south_africa.30.b:0 "[Root.GetAdjective] toprağının her metrekaresi kutsaldır. Boyun eğmeyeceğiz!"
 tfv_south_africa.30.d:0 "Avrupa'daki kargaşanın ardından, [From.GetAdjective] hükûmeti Madagaskar'daki egemenlik hakkımızı ve orada yaşayan nüfusu koruma yeteneğimizi açıkça sorguladı. Bu davranış nihayet sadece retoriği aştı ve [From.GetAdjective] yönetimi adanın kontrolünü onlara devretmemizi talep etti."
 tfv_south_africa.30.t:0 "[From.GetNameDefCap] Madagaskar'ı Talep Ediyor"
 tfv_south_africa.31.a:0 "Emperyalist sömürgecilik sistemini yıkmak için bir adım daha!"
 tfv_south_africa.31.d:0 "[From.GetAdjective] hükûmeti, Madagaskar'ı barışçıl bir şekilde işgal etmemize izin vermeye akıllıca karar verdi."
 tfv_south_africa.31.t:0 "[From.GetNameDef] Boyun Eğiyor"
 tfv_south_africa.32.a:0 "O zaman güce başvurmalıyız."
 tfv_south_africa.32.b:0 "O değersiz toprak parçası onlarda kalsın."
 tfv_south_africa.32.d:0 "[From.GetAdjective] yönetimi, Madagaskar'ı bize devretme meselesini tartışmayı bile inatla reddediyor. Temsilcilerine göre, adayı savunmaya fazlasıyla muktedir, istekli ve hazırlar."
 tfv_south_africa.32.t:0 "[From.GetAdjective] Reddediyor"
 tfv_south_africa.4.a:0 "İyi bir uzlaşma - kimse memnun değil."
 tfv_south_africa.4.d:0 "Uzun bir müzakereden sonra, Britanya hükûmeti Afrika sömürgelerinin savunulması konusunda bir uzlaşmaya vardı. Bu yeni şema altında, sömürgeler kendi savunmalarından sorumlu olacak, ancak kendi işlerini yönetmede daha büyük bir özgürlüğe sahip olacaklar."
 tfv_south_africa.4.t:0 "Afrika Uzlaşması"
 tfv_south_africa.40.a:0 "Elimizden gelen yardımı sunmaktan memnuniyet duyarız."
 tfv_south_africa.40.b:0 "Sırlarımızı onlara sunmak ulusal güvenliğimizi tehlikeye atar."
 tfv_south_africa.40.d:0 "[From.GetNameDef]'e yapılan başarılı bir askeri misyonun ardından, hükûmetleri iki ulusumuz arasında resmi bir araştırma anlaşması önerdi."
 tfv_south_africa.40.t:0 "[From.GetNameDef] ile Araştırma Antlaşması"
 tfv_south_africa.41.a:0 "[SOV.GetNameDef]'den öğrenmek, tarihin galiplerinden öğrenmek demektir!"
 tfv_south_africa.41.d:0 "Sovyetler, onların yollarını ve yöntemlerini incelememize izin vermeyi kabul etti. Bir dizi [SOV.GetAdjective] bilim adamı okullarımızda ve üniversitelerimizde ders vermek için geldi."
 tfv_south_africa.41.t:0 "[SOV.GetNameDefCap] Kabul Ediyor"
 tfv_south_africa.42.a:0 "Çok talihsiz."
 tfv_south_africa.42.d:0 "Birkaç tur müzakereden sonra, [SOV.GetNameDef]'den gelen heyet, araştırmalarını gizli tutma yeteneğimiz hakkındaki şüpheleri gerekçe göstererek masadan kalktı. Görünüşe göre müttefiklerimizle teknoloji paylaşmamıza izin verilmeyecek."
 tfv_south_africa.42.t:0 "[SOV.GetNameDefCap] Reddediyor"
 tfv_south_africa.50.a:0 "Belki birkaç askerimiz İspanya'da bir tatille ilgilenebilir?"
 tfv_south_africa.50.b:0 "Eğer insanlar mücadeleye katılmak isterse, onları durdurmayacağız."
 tfv_south_africa.50.c:0 "Neden dünyanın yarısı uzaktaki bir savaşta savaşalım ki?"
 tfv_south_africa.50.d:0 "İspanya'da Milliyetçi hükûmet ile meşru Cumhuriyetçi hükûmet arasında bir mücadele patlak verdi. Halk arasında hükûmetimizin nerede durduğu konusunda önemli bir tartışma var."
 tfv_south_africa.50.t:0 "İspanya'ya Destek"
 tfv_south_africa.51.a:0 "Çok makbule geçti."
 tfv_south_africa.51.d:0 "[SAF.GetAdjective] hükûmeti resmi olarak tarafsız kalsa da, çok sayıda vatandaşının gönüllü olarak davamıza katılmasına izin verdi."
 tfv_south_africa.51.t:0 "Güney Afrika'dan Gönüllüler Geliyor"
 tfv_south_africa.52.a:0 "Bir sonraki savaşta bize yardımcı olacaklar."
 tfv_south_africa.52.d:0 "İspanya'daki çatışmalar sona erince, savaşın hayatta kalan gönüllüleri evlerine döndü. Yanlarında modern savaş hakkında değerli deneyimler getiriyorlar."
 tfv_south_africa.52.t:0 "İspanya İç Savaşı'ndan Gönüllüler Geri Dönüyor"
 tfv_south_africa.60.a:0 "Her yeni ulus dikkatle yönlendirilmeli, yoksa karşı-devrim başarılı olur!"
 tfv_south_africa.60.b:0 "Onları kollarımızı açarak karşılıyoruz!"
 tfv_south_africa.60.c:0 "Durum henüz buna izin vermiyor."
 tfv_south_africa.60.d:0 "Sömürgeci zalimlerinin elinden kurtarılan [ANG.GetName] halkı, kendi kaderlerini tayin etmeye hazır. Geçici bir hükûmet kurdular ve bir anayasa taslağı hazırladılar. Geriye kalan tek şey, yetkiyi askeri valilerimizden yeni [ANG.GetAdjective] hükûmetine devretmek."
