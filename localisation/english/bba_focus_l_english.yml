l_english:
 EHT_in_the_name_of_the_people_tt:0 "[ETH.Capital.GetCapitalVictoryPointName]'da §Yiki§! seçkin komünist §YKızıl Muhafız§! tümeni ve §Yüç§! seçkin anarşist §YKara Aslanlar§! tümeni oluştur. \n\n§R$ETH_seyoum_mengesha$ artık mevcut olmayacak!§!"
 ETH_GuardsNameCommunist:0 "Devrimci Muhafızlar"
 ETH_GuardsNameDefault:0 "Kebur Zabagna"
 ETH_GuardsNameDemocratic:0 "Ulusal Muhafızlar"
 ETH_SWE_join_war_tt:0 "Eğer büyük uluslar §Y[ITA.GetFlag][ITA.GetName]§! ile savaş halindeyse ve §Y[SWE.GetFlag][SWE.GetName]§! karşılıklı ittifak başvurusunu kabul ederse, bir ittifaka katılmaya ve savaşa katılmaya çalışacaklardır.\n §REğer hiçbir ittifak mevcut değilse, [SWE.GetFlag][SWE.GetName] [ITA.GetFlag][ITA.GetName]!§!'e karşı tek başına savaşa girmeyecektir!"
 ETH_SefariNameCommunist:0 "Devrimci Ordu"
 ETH_SefariNameDefault:0 "Mehal Sefari"
 ETH_SefariNameDemocratic:0 "Ulusal Savunma Gücü"
 ETH_a_federal_empire:0 "Federal bir İmparatorluk"
 ETH_a_federal_empire_desc:0 "İmparatorluk yönetim sistemi, parlamenter demokrasinin kaosuyla karşılaştırıldığında çok daha fazla istikrar sunar. Çeşitli bölgelerin lordları Majesteleri [ETH.GetLeader]'a bağlılık yemini etmeye devam ettiği sürece, mülklerini nasıl yönettikleri umurumuzda değil."
 ETH_a_federal_empire_tt:0 "Tüm eyaletlerden §Y$ETH_state_decentralization_dynamic_modifier$§! değiştiricisini kaldırır."
 ETH_a_guiding_hand:0 "Yol Gösterici bir El"
 ETH_a_guiding_hand_desc:0 "Daha yüksek bir otoritesi olmayan gevşek bir komünler koalisyonu çok idealist. Ekonomik politikayı yönlendirmek ve acil durumlara hızla tepki vermek için temsilcilerden ve uzmanlardan oluşan bir kabineye ihtiyacımız var. Kriz anında imparatorluk yönetiminin başarısızlıklarını tekrarlamamıza asla izin veremeyiz."
 ETH_a_last_stand:0 "Son Bir Direniş"
 ETH_a_last_stand_desc:0 "Aksiliklerin bizi durdurmasına izin vermemeliyiz. Son çare olarak $VICTORY_POINTS_13244$'e geri çekilebilir ve orada bir savunma hazırlayabiliriz. İtalyanlar, ordularını [ROOT.GetName]'ın uzak batısına kadar tedarik etmekte zorlanacaklardır."
 ETH_a_libyan_revolt:0 "Bir Libya İsyanı"
 ETH_a_libyan_revolt_desc:0 "[ITA.GetAdjective]'ler, Doğu Afrika'daki son toprak kazanımlarının kontrolünü sürdürmekte zorlanıyorlar. Odakları kaymışken, değerli [LBA.GetAdjective] topraklarında isyan tohumları ekmek için elimizden geleni yapmalıyız."
 ETH_a_port_of_our_own:0 "Kendimize Ait bir Liman"
 ETH_a_port_of_our_own_desc:0 "Yakın zamanda kıyı arazisi edinmemizle, kendi limanımızı kurarak uluslararası pazara erişimimizi önemli ölçüde artırma fırsatımız var. Bu, mal ithalatını ve ihracatını çok daha kolaylaştıracak ve ekonomimize büyük ölçüde yardımcı olacaktır."
 ETH_adapt_and_improve:0 "Uyum Sağla ve Geliştir"
 ETH_adapt_and_improve_desc:0 "Orduyla istişare ederek, sanayi liderleri savaş alanında gerçekten neyin gerekli olduğu konusunda uzmanlık kazanabilir ve bunu mühendislerine geri bildirebilir. Bu, birliklerimize yetersiz teçhizat tedarik edilmesini önleyecek ve iyileştirme için hızlı bir şekilde önerilerde bulunmalarını sağlayacaktır."
 ETH_adapt_and_improve_tt:0 "§Y$ETH_industrialization_dynamic_modifier$§! değiştiricisini şununla değiştir:\n$MODIFIER_LAND_EQUIPMENT_UPGRADE_XP_COST$: §G-%25§!\n$MODIFIER_AIR_EQUIPMENT_UPGRADE_XP_COST$: §G-%25§!"
 ETH_addressing_the_league_of_nations:0 "Milletler Cemiyeti'ne Hitap Etme"
 ETH_addressing_the_league_of_nations_desc:0 "Meclisin [ITA.GetName]'ın fetih savaşı konusunda harekete geçmemesi ve sonuç olarak saldırganlık kurbanları için terk etme politikası, Cemiyetin varlığını tehdit ediyor. Terk etme politikasını seçen üyeler şunu unutmamalıdır ki, bugün biziz, yarın siz olacaksınız..."
 ETH_adopt_the_lira:0 "Lirayı Benimse"
 ETH_adopt_the_lira_desc:0 "[ITA.GetName] ile olan savaşın neden olduğu ekonomik kargaşa ve yeniden yapılanma maliyeti nedeniyle para birimimiz değer kaybetti. Lekelenmiş para birimini istikrara kavuşturmaya çalışmak yerine, bunu lirayı benimseyerek [ITA.GetAdjective]'lerle ekonomik entegrasyonu artırmak için bir fırsat olarak kullanmalıyız."
 ETH_african_central_bank:0 "[ETH_GetCentralBankName]"
 ETH_african_central_bank_2_tt:0 "$MODIFIER_STABILITY_FACTOR$: §G%5§! \n$modifier_production_speed_industrial_complex_factor$: §G%10§! \n$modifier_production_speed_infrastructure_factor$: §G%10§!"
 ETH_african_central_bank_desc:0 "Bir [ETH_GetCentralBankName] yaratılmasıyla, Afrika Birliği Teşkilatı içindeki ekonomileri entegre etme sürecini başlatabiliriz. Bu, kaynaklarımızı ve altyapımızı tüm üye devletlerin iyiliği için daha verimli kullanmamızı sağlayacaktır."
 ETH_african_central_bank_tt:0 "§YAfrika Birliği Teşkilatı§! üyelerini [ETH_GetCentralBankName]'e davet etme kararlarının kilidini açar."
 ETH_african_independence_join_tt:0 "§Y[ROOT.GetNameDef]§!'in Afrika bağımsızlık savaşlarına müdahale etmesine izin verir."
 ETH_african_independence_tt:0 "Afrika ülkelerinde direnişi artırmak ve özerklik kazanımını hızlandırmak için §Ykararların§! kilidini açar."
 ETH_african_union:0 "Afrika Birliği"
 ETH_african_union_desc:0 "Afrika halkının bir Afrika Birliği içinde birleşme zamanı geldi. Afrika’nın ilk süper gücü olmaya çalışırken bir daha asla emperyalistler veya faşistler tarafından tehdit edilmeyeceğiz."
 ETH_african_union_faction:0 "Afrika Birliği"
 ETH_african_union_tt:0 "§YYürütme Konseyi§! üyelerini §YAfrika Birliğine§! entegre etme kararlarının kilidini açar!"
 ETH_african_wildfire:0 "Afrika Orman Yangını"
 ETH_african_wildfire_desc:0 "[ITA.GetAdjective] istilasını başarıyla aştık, ancak tüm Afrika sömürgeciliğin dehşetinden kurtulana kadar dinlenmemeliyiz. Becerilerimizi ve kaynaklarımızı kıta genelinde direniş alevlerini körüklemek ve emperyalistleri geri çekilmeye zorlamak için kullanmalıyız."
 ETH_airbase_name:0 "Debre Zeyit"
 ETH_airbase_name_fallback:0 "[ETH.GetAdjective]"
 ETH_aircraft_tt:0 "§Y$small_plane_airframe_0$ varyantı oluştur: [ITA.GetFlag] CR.32§! \n §Y$medium_plane_airframe_0$ varyantı oluştur: [ITA.GetFlag] Ca.101§!"
 ETH_allow_fundraising_campaigns_tt:0 "İmparatorluk hazinesini artırmak için bağış kampanyaları başlatma §Ykararlarının§! kilidini açar."
 ETH_amedeos_feast_of_maskal:0 "Amedeo'nun Meskel Bayramı"
 ETH_amedeos_feast_of_maskal_desc:0 "[ETH.GetName]'ın devam eden istikrarını sağlamak için, geri kalan Ras’ları Prens Amedeo’nun [ETH.Capital.GetCapitalVictoryPointName]'daki Meskel Bayramı'na toplayacağız. Orada [ITA.GetAdjective] Doğu Afrika Genel Valisi ile görüşecek ve bölgenin geleceğini tartışacağız."
 ETH_amedeos_feast_of_maskal_tt:0 "Eğer §Y$ETH_sway_the_warlords$§! tamamlandıysa: \n§Y$ETH_seyoum_mengesha$§!, §Y$ETH_ayalew_birru$§! ve §Y$ETH_ras_kassa$§! sadık olacak."
 ETH_an_arabic_base:0 "Bir Arap Üssü"
 ETH_an_arabic_base_desc:0 "[JAP.GetName]'ın önümüzdeki yıllarda Asya-Pasifik bölgesini yeniden şekillendirmeyi planladığı giderek daha açık hale geliyor. [JAP.GetAdjective]'lerle giderek daha fazla hizalandığımıza göre, kendimize bir pay çıkarmak mantıklıdır. Başlangıç olarak, Arap yarımadasındaki atalarımızın topraklarının kontrolünü talep etmeliyiz."
 ETH_an_audience_with_countryleadertitle:0 "[GetGermanCountryLeaderTitle] ile bir Görüşme"
 ETH_an_audience_with_countryleadertitle_desc:0 "[GER.GetLeader]'ın sadece [GER.GetNameDef]'i değil, aynı zamanda tüm dünyayı yeniden düzenlemek için hırslı planları var. [GER.GetAdjective] lideriyle bir görüşme sağlayarak, dünya Majesteleri [ETH.GetLeader]'ı [ETH.GetName]'ın tek gerçek hükümdarı olarak görmeye devam edecektir."
 ETH_an_empire_in_the_shade_of_the_sun:0 "Güneşin Gölgesinde bir İmparatorluk"
 ETH_an_empire_in_the_shade_of_the_sun_desc:0 "Majesteleri [ETH.GetLeader], imparatorluğu olmayan bir imparatordur. Bu sadece imparatorumuz için aşağılayıcı değil, aynı zamanda [ETH.GetName]'ın kurtuluşu için düzenlemeler yapma yeteneğimizi de sınırlıyor. Belki [JAP.Capital.GetCapitalVictoryPointName]'daki dostlarımız, anavatanımızın nihai kurtuluşu için bir operasyon üssü olarak kullanabilmemiz için bize bir adanın kontrolünü vermeye istekli olurlar."
 ETH_an_ethiopian_navy_in_exile:0 "Sürgünde bir Etiyopya Donanması"
 ETH_an_ethiopian_navy_in_exile_desc:0 "[JAP.GetAdjective] deniz gücünün gösterilerine tanık olan Majesteleri [ETH.GetLeader], anavatanımızın kurtuluşuna yardımcı olmak ve gelecekteki herhangi bir saldırıdan korumak için bir [ETH.GetAdjective] donanmasının inşası için lütufkâr ev sahiplerimizden yardım istedi."
 ETH_anarchist_bank:0 "Afrika Topluluk Bankası"
 ETH_animal_husbandry:0 "Hayvancılık"
 ETH_animal_husbandry_desc:0 "Atlar ve develer, [ETH.GetNameDef] genelinde malların dağıtımında ve insanların taşınmasında önemli bir rol oynamaktadır. Bu hayvanların arzının ve kalitesinin asla azalmadığından emin olmak için hayvancılığa yatırımı artırmalıyız."
 ETH_anti-italian_propaganda:0 "İtalya Karşıtı Propaganda"
 ETH_anti-italian_propaganda_desc:0 "İmparatorun burada güvenli bir şekilde ikamet etmesine izin veren ev sahiplerimizin misafirperverliğini büyük ölçüde takdir etsek de, halkımızın faşist işgalden kurtuluşunu hızlandırmak için daha fazlasını yapabilirlerdi. Onları [ITA.GetAdjective]'lerin [ETH.GetName] halkına yaşattığı dehşetlerden tam olarak haberdar etmeli ve nihai bir kurtuluş kampanyası için yanımıza çekmeliyiz."
 ETH_anti-tank_guns:0 "Anti-tank Silahları"
 ETH_anti-tank_guns_desc:0 "[SWE.GetName], dünyanın en iyi cephaneliklerinden bazılarına sahiptir. Dış işlerinde teknik olarak tarafsız olsalar da, [SWE.GetAdjective], büyüyen faşist etki alanını kısıtlarsa, anti-tank silahlarından bazılarını vermeye istekli olabilir."
 ETH_anti_imperialist_agitation:0 "Anti-Emperyalist Ajitasyon"
 ETH_anti_imperialist_agitation_desc:0 "Halkın [ROOT.GetLeader]'a olan sadakati sarsılıyor. En önemli görevlerinde, halkı korumada başarısız olarak, sözde liderlerimiz yetersizliklerini tamamen gösterdiler. Cephe hatlarında ve sokaklarda, bir zamanlar hayal bile edilemeyen şey şimdi açıkça tartışılıyor. İmparatorsuz bir ulus."
 ETH_arab_mercs_colab_tt:0 "§G4 Tümen§! §YArap Paralı Asker§! topla!"
 ETH_arabian_independence_tt:0 "Arap yarımadasındaki ülkelerde direnişi artırmak ve özerklik kazanımını hızlandırmak için §Ykararların§! kilidini açar."
 ETH_armor_officers_tt:0 "İki [ROOT.GetAdjective] subaya kadar §Y$armor_officer$§! özelliği alır"
 ETH_arms_production:0 "Silah Üretimi"
 ETH_arms_production_desc:0 "Sanayileşmenin doruk noktası, kendi silah sanayimizin yaratılması olacaktır. Bir daha asla savunma teçhizatımız için diğer uluslara bağımlı olmayacağız."
 ETH_arms_purchases:0 "Silah Alımları"
 ETH_arms_purchases_desc:0 "Milletler Cemiyeti İtalyan İstilası'nı durdurmada başarısız oldu, bunun yerine sadece her iki ülkeye de silah satışına bir ambargo oyladılar. Bunun bize [ITA.GetName]'dan daha fazla zarar verdiğini kesinlikle fark etmeliler. Yasal savunmacı olarak, uluslararası olarak silah satın almamıza izin verilmesi gerektiğini savunmak için bir davamız olmalı."
 ETH_arms_purchases_tt:0 "Uluslararası silah tüccarlarından silah satın alma kararlarının kilidini açar."
 ETH_askari_tt:0 "§G4 Tümen§! §YEritre Askari§! topla!"
 ETH_asmera_naval_college:0 "[GetNavalCollegeName]"
 ETH_asmera_naval_college_desc:0 "Sadece gemi üretmek ve bakımını yapmak bir donanma oluşturmak için yeterli değildir. Bir savaşta deniz varlıklarını nasıl kullanacakları konusunda yüksek düzeyde eğitimli subaylara ve uzmanlara ihtiyacımız var. Bu nedenle, [ETH.GetName]’in ilk deniz akademisini kuracağız."
 ETH_asmera_naval_college_tt:0 "§Y[GetEthiopianNavySpiritName]§! değiştiricisini şununla değiştir:\n$MODIFIER_NAVAL_DOCTRINE_COST_FACTOR$: §G-%30§!"
 ETH_assertiveness:0 "[Get_ETH_assertiveness_name]"
 ETH_assertiveness_autonomy_effect:0 "İddialı Negus"
 ETH_assertiveness_desc:0 "Büyük ulusumuzu yıkımdan korumak için [ITA.GetAdjective]'lerle işbirliği yapmayı kabul ettik, şimdi bizi kimliğimizden ve kültürümüzden soyup bir sömürgeden başka bir şey olmamamızı görmek istiyorlar. Buna izin veremeyiz. Onlara kim olduğumuzu anlamalarını sağlayacak ve sömürgeleştirmelerine her adımda direneceğiz."
 ETH_assertiveness_ethiopia:0 "Shewa Negusu"
 ETH_assertiveness_gojjam:0 "Gojjam Negaşı"
 ETH_assertiveness_jimma:0 "Jimma Garadı"
 ETH_assertiveness_tt:0 "Eğer §Y$ETH_sway_the_warlords$§! tamamlandıysa ve ülke §Y$jimma$§! ise:\n§Y$ETH_balcho_safo$§! ve §Y$ETH_tadesse_birru$§! sadık olacak."
 ETH_available_as_air_chief_tt:0 "Hava Kuvvetleri Komutanı olarak müsait: "
 ETH_befriend_goring:0 "Göring ile Arkadaş Ol"
 ETH_befriend_goring_desc:0 "Alman hükûmeti bir siyasi entrika ve arkadan bıçaklama ağıdır. Herhangi bir anda [GER.GetLeader]'ın kulağına sahip olan kişi, [GER.GetAdjective] politika kararlarını büyük ölçüde etkileme potansiyeline sahiptir. Belki de $GER_hermann_goring$ gibi yönetici elitten bir üyeyle arkadaş olarak kendimize bir miktar nüfuz kazanabiliriz."
 ETH_black_lions_resistance_tt:0 "Kara Aslanlar tarafından Aktif Direniş: §R+%10§!"
 ETH_boarding_the_train:0 "Trene Binmek"
 ETH_boarding_the_train_desc:0 "Savunma hatlarımız çökmeye başlıyor ve eğer köklü bir değişiklik olmazsa, [ETH.GetName] var olmaktan çıkacak. Danışmanlarının birçoğu yok bir tahtın kötü etkilerini savunsa da, Majesteleri [ETH.GetLeader], Milletler Cemiyeti'nde davamız için uluslararası destek toplama hedefiyle Cenevre'ye gitmeye karar verdi."
 ETH_boarding_the_train_tt:0 "§Y$ETH_haile_selassie$§!, Milletler Cemiyeti'ne gitmek için [ROOT.GetName]'ı terk eder. Eğer Etiyopya teslim olursa, $ETH_haile_selassie$ bir §YSürgün Hükûmeti§! kuracaktır."
 ETH_bomb_proofing:0 "Bomba Koruması"
 ETH_bomb_proofing_desc:0 "Savaş zamanında modern bir orduyu desteklemek için yeterli endüstriyel kapasiteyi sürdürmek hayati önem taşır. Bu nedenle, uçaklar düşman uluslarının sanayi merkezlerini hedef aldığı için hava savaşı gelecekteki herhangi bir çatışmada belirleyici bir rol oynayacaktır. Bu nedenle, fabrikalarımızın bu tür saldırılardan sağ çıkabileceğinden emin olmalıyız."
 ETH_bomb_proofing_tt:0 "§Y$ETH_industrialization_dynamic_modifier$§! değiştiricisini şununla değiştir:\n$MODIFIER_INDUSTRY_AIR_DAMAGE_FACTOR$: §G-%10§!\n$MODIFIER_INDUSTRY_REPAIR_FACTOR$: §G+%10§!\n$MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY$: §G+%5§!"
 ETH_boots_on_the_shore:0 "Kıyıda Çizmeler"
 ETH_boots_on_the_shore_desc:0 "Arap yarımadası halklarıyla uzun bir ticaret ve kültürel değişim geçmişimiz var. Maalesef, feodal yönetim sistemlerinde kapana kısılmış durumdalar. Eğer yarımadanın halkını kurtarırsak, Kızıldeniz boyunca hayati ticaret yolunu kontrol edebilir ve nüfuzumuzu Orta Doğu'nun derinliklerine yansıtabiliriz."
 ETH_bring_in_foreign_advisors:0 "Yabancı Danışmanları Getir"
 ETH_bring_in_foreign_advisors_desc:0 "[ETH.GetAdjective] bir hava kuvveti yaratma konusundaki devam eden ilerlememize rağmen, pilotlarımızın tam potansiyelleriyle kullanılmasını sağlamak için hayati ilk elden deneyimden yoksunuz. Bu nedenle, nasıl gelişebileceğimiz konusunda tavsiyelerde bulunmak üzere yurtdışından subaylar getireceğiz."
 ETH_bring_in_foreign_advisors_tt:0 "§Y[GetEthiopianAirforceSpiritName]§! değiştiricisini şununla değiştir:\n $MODIFIER_ENEMY_ARMY_BONUS_AIR_SUPERIORITY_FACTOR$: §G-%5§!\n $MODIFIER_AIR_DOCTRINE_COST_FACTOR$: §G-%5§!\n $MODIFIER_AIR_ACCIDENTS$: §G-%15§! "
 ETH_callout_to_the_world:0 "Dünyaya Bir Çağrı"
 ETH_callout_to_the_world_desc:0 "Faşizme karşı mücadelemiz ülkemize özgü değil, otoriterliğe karşı daha geniş bir küresel savaşın parçasıdır. Dünya çapındaki anti-faşizm güçlerini davamıza toplayacağız, çünkü bugün zulüm gören biziz, yarın dünya olacak."
 ETH_callout_to_the_world_tt:0 "§Y$ENG_sylvia_pankhurst$§! ve §Y$IA_emma_goldman$§! danışman olarak mevcut olur."
 ETH_camouflage:0 "Kamuflaj"
 ETH_camouflage_air_tt:0 "§Y[GetEthiopianAirforceSpiritName]§! değiştiricisini şununla değiştir:\n $MODIFIER_ENEMY_ARMY_BONUS_AIR_SUPERIORITY_FACTOR$: §G-%15§! "
 ETH_camouflage_army_tt:0 "§Y[GetEthiopianArmySpiritName]§! değiştiricisini şununla değiştir:\n $MODIFIER_CAS_DAMAGE_REDUCTION$: §G+%10§! \n $MODIFIERS_ARMY_DEFENCE_FACTOR$: §G+%10§!"
 ETH_camouflage_desc:0 "Uçakların savaş alanına girmesiyle, sürpriz unsuru elde etmek giderek zorlaşıyor. Taktiksel niyetlerimizin görünürlüğünü en aza indirmek için, birliklerimizin kamuflaj ve gizleme eğitimine girmesi gerekiyor."
 ETH_can_start_a_civil_war_tt:0 "[ROOT.GetName], §Y$ETH_declare_for_italy$§! odağını tamamlayarak bir iç savaş başlatabilir."
 ETH_capital_school_of_technology:0 "[ROOT.Capital.GetCapitalVictoryPointName] Teknoloji Okulu"
 ETH_capital_school_of_technology_desc:0 "Eğitim reformlarımız başarılı oluyor ve yatırıma değer. Ulusun mühendislik uzmanlarını tek bir teknoloji okulunda bir araya getirerek ilerlememizi hızlandırmalıyız."
 ETH_central_bank:0 "Afrika Merkez Bankası"
 ETH_change_state_religion:0 "Devlet Dinini Değiştir"
 ETH_chitet_name:0 "Chitet"
 ETH_chitet_name_communist:0 "Halk Milisleri"
 ETH_chitet_name_democratic:0 "Bölgesel Ordu"
 ETH_chitet_sefari_no_recruiting_tt:0 "§YChitet Sefari§! Tümenleri artık toplanamaz."
 ETH_cie:0 "[GetEthiopianRailwayName]"
 ETH_cie_anarcho_communist:0 "[ETH.GetAdjective] Demiryolu Kolektifi"
 ETH_cie_fascist:0 "Ferrovie Imperiali Etiopiche"
 ETH_cie_imperial:0 "Compagnie Impériale des Chemins de Fer Éthiopiens"
 ETH_cie_stalinist:0 "[ETH.GetAdjective] Demiryolu Kurulu"
 ETH_clearing_the_skies:0 "Gökleri Temizlemek"
 ETH_clearing_the_skies_desc:0 "Askerlerimiz, kendilerini koruyacak hiçbir yolu olmadan düşman uçaklarına tamamen maruz kalmış durumda. Daha da kötüsü, düşman konuşlanma yerlerimizi ve hareketlerimizi her zaman biliyor. Zafer umudumuz olacaksa kendi hava kuvvetlerimize ve karşı önlemlerimize ihtiyacımız var. Bu nedenle, [SOV.GetAdjective] hava kuvvetleriyle eğitim görmeleri için gönüllüler göndermeliyiz."
 ETH_clearing_the_skies_tt:0 "\nEğer [SOV.GetFlag]§Y[SOV.GetName]§! kabul ederse, [ETH.GetFlag]§Y[ETH.GetName]§! §G100§! [SOV.GetAdjective] avcı uçağı ve §YErken Avcı§! teknolojisi alacak."
 ETH_closing_the_suez:0 "Süveyş'in Kapatılması"
 ETH_closing_the_suez_desc:0 "Milletler Cemiyeti, [453.Owner.GetNameDef]'i [ITA.GetAdjective] gemiciliği için Süveyş Kanalı'nı kapatmaya zorlamalıdır. Bu, [ITA.GetAdjective] savaş makinesine ciddi şekilde zarar verir ve savaşı eşit şartlarda yapmamıza olanak tanır."
 ETH_communal_agriculture:0 "Toplumsal Tarım"
 ETH_communal_agriculture_consumer_tt:0 "§Y$ETH_industrialization_dynamic_modifier$§! değiştiricisini şununla değiştir:\n$MODIFIER_CONSUMER_GOODS_FACTOR$: §Y-%5§!"
 ETH_communal_agriculture_desc:0 "Tarımı kolektifleştirerek ve yeni tarım yöntemleri getirerek, tarımsal üretimimizi büyük ölçüde artırabilir ve herkesin gıdaya erişimini garanti edebiliriz. Bu aynı zamanda özgürleşmiş köylülerin geçimlik tarım yerine şehirlerde alternatif istihdam bulmalarını sağlayacaktır."
 ETH_communal_agriculture_industry_tt:0 "§Y$ETH_industrialization_dynamic_modifier$§! değiştiricisini şununla değiştir:\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+%10§!"
 ETH_communal_education:0 "Toplumsal Eğitim"
 ETH_communal_education_desc:0 "[ETH.GetNameDef]'deki her topluluğun okullar ve kütüphaneler aracılığıyla eğitime erişimini sağlamak, nüfuslarının yaşam standardını iyileştireceksek esastır."
 ETH_communist_seize_assets_desc:0 "Halk geçim sıkıntısı çekerken, [ETH.GetName]'ın devrim öncesi eliti yabancı para, sanat ve tabii ki toprak şeklinde büyük miktarda varlık edindi. Bu varlıkları halk adına ele geçirmeli ve zenginliği yeniden dağıtmalıyız."
 ETH_communist_seize_assets_title:0 "Özel Mülkiyeti Ortadan Kaldır"
 ETH_communist_tax_exemption_desc:0 "Sovyetler Birliği'nin devrimlerinden sonra yaşadığı ‘beyin göçünü’ önlemek için, uzmanların [ETH.GetNameDef]'de kalmasını teşvik eden bir vergi sistemi oluşturmalıyız. En azından yeni nesil proleter uzmanları yetiştirene kadar..."
 ETH_communist_tax_exemption_title:0 "Uzmanları Destekle"
 ETH_compensation:0 "Tazminat"
 ETH_compensation_desc:0 "Büyük uluslarımız arasındaki başlangıçtaki gerilime rağmen, [ITA.GetName]'a olan sadakatimizi defalarca kanıtladık. Ancak bu, nüfusumuzu yönetimimize sevdirmek için pek bir işe yaramadı. Belki de [ITA.GetAdjective]'ler, rejimimize olan desteği artırabilmemiz için diğer topraklarından bazılarını kontrol etmemiz karşılığında bizi tazmin etmeye istekli olurlar."
 ETH_connecting_the_south:0 "Güneyi Bağlama"
 ETH_connecting_the_south_desc:0 "[ETH.GetName]'ın güney bölgeleri, dağlık arazi nedeniyle başkent bölgesinden izole edilmiştir. Bölgeyi hızla genişleyen ekonomimize tam olarak entegre etmek için, onu demiryolları aracılığıyla sanayi merkezlerine bağlamalıyız."
 ETH_consolidate_east_africa:0 "Doğu Afrika'yı Konsolide Et"
 ETH_consolidate_east_africa_desc:0 "Dünya düzeni, eski imparatorluklar çökmeye başladıkça etrafımızda değişiyor. Bu yeni düzende halkımız için bir yer güvence altına almanın tek yolu fetih ve herhangi bir engeli aşma yeteneğimizi göstermektir. Bu nedenle, Doğu Afrika'yı kontrolümüz altında birleştirecek ve dünyaya [ETH.GetName]'ın gücünü göstereceğiz."
 ETH_consolidate_east_africa_tt:0 "Şunlarda hak iddia et:\n§Y[SUD.GetName]§!\n§Y[SOM.GetName]§!\n§Y[ERI.GetName]§!\n§Y[DJI.GetName]§!\n§Y[KEN.GetName]§!\n§Y[UGA.GetName]§!\nBir kez [ETH.GetFlag][ETH.GetAdjective] kontrolü altına girdiğinde toprağı çekirdek yapma kararları kazan."
 ETH_contact_the_exiles:0 "Sürgünlerle Temas Kur"
 ETH_contact_the_exiles_desc:0 "[ITA.GetName] ile savaş sona ererken, birçoğu yeni rejimin getirebileceklerinden korkarak komşu bölgelere kaçtı. Bağımsızlığımızı yeniden kazanma planlarımızı uygulamaya başlarken, bu daha geniş diasporayı bize katılmaya ikna edebiliriz. Geçmişteki farklılıklarımıza rağmen, şimdi anavatan uğruna işbirliği yapma zamanı."
 ETH_cooperation:0 "[Get_ETH_cooperation_name]"
 ETH_cooperation_desc:0 "Kaderimiz Doğu Afrika'nın hakimiyetinde yatıyor. Ancak, bu hedefe ulaşmaktan hala çok uzağız. Bu nedenle, bölgenin mevcut güç yapılarıyla işbirliği yapmalı ve elde edebileceğimiz her türlü avantajı elde etmeye çalışmalıyız."
 ETH_cooperation_gojjam:0 "Sudanlılarla İşbirliği"
 ETH_cooperation_gugsa:0 "Eritrelilerle İşbirliği"
 ETH_cooperation_gugsa_tt:0 "§Y$ETH_domenico_mondelli$§!, §YHava Kuvvetleri Komutanı§! olarak mevcut olur: \n§Y$air_chief_ground_support_1$§!"
 ETH_cooperation_jimma:0 "Araplarla İşbirliği"
 ETH_cooperation_som_tt:0 "Bir Somalili siyasi danışman kazan:\n§Y$economic_organizer$:§! \n Tüketim Malları Fabrikaları: §G-%5§!\n İstikrar: §G+%5§!"
 ETH_cooperation_sud_tt:0 "Bir Sudanlı siyasi danışman kazan:\n§Y$economic_organizer$:§! \n Tüketim Malları Fabrikaları: §G-%5§!\n İstikrar: §G+%5§!"
 ETH_copy_light_plane_tt:0 "§Y$iw_small_airframe$ varyantı oluştur: [ITA.GetFlag]CR.32§!"
 ETH_copy_medium_plane_tt:0 "§Y$iw_medium_airframe$ varyantı oluştur: [ITA.GetFlag]Ca.101§!"
 ETH_copy_plane_designs:0 "Uçak Tasarımlarını Kopyala"
 ETH_copy_plane_designs_desc:0 "Başkalarının zaten geliştirdiği şeyleri yeniden icat etmenin pek bir anlamı yok. Basitçe diğer ulusların uçak tasarımlarını çoğaltacağız ve onların araştırma yatırımlarından yararlanacağız."
 ETH_counter_the_armored_threat:0 "Zırhlı Tehdide Karşı Koy"
 ETH_counter_the_armored_threat_LaR_tt:0 "\nEğer [SOV.GetFlag]§Y[SOV.GetName]§! kabul ederse, [ETH.GetFlag]§Y[ETH.GetName]§! §YSavaş Arası Zırhlı Araba§! teknolojisi ve §G480§! [SOV.GetAdjective] zırhlı araba alacak."
 ETH_counter_the_armored_threat_NoLaR_tt:0 "\nEğer [SOV.GetFlag]§Y[SOV.GetName]§! kabul ederse, [ETH.GetFlag]§Y[ETH.GetName]§! §YSavaş Arası Tank§! teknolojisi ve §G200§! [SOV.GetAdjective] tankı alacak."
 ETH_counter_the_armored_threat_NoNSB_tt:0 "\nEğer [SOV.GetFlag]§Y[SOV.GetName]§! kabul ederse, [ETH.GetFlag]§Y[ETH.GetName]§! §YBüyük Savaş Tankı§! teknolojisi ve §G200§! [SOV.GetAdjective] tankı alacak."
 ETH_counter_the_armored_threat_desc:0 "Zırhlı savaş, savaş alanında süvarinin rolünü açıkça değiştiriyor. Maalesef, [ITA.GetAdjective] zırhlılarına yeterince karşı koyacak bir yolumuz yok ve sanayimiz henüz bir tane üretecek durumda değil. Belki [SOV.GetName], eski zırhlı araçlarından bazılarını vermeye istekli olur?"
 ETH_debre_zeyit_air_force_training_center:0 "[ETHGetAirBaseName] Hava Kuvvetleri Eğitim Merkezi"
 ETH_debre_zeyit_air_force_training_center_desc:0 "Uçak kullanmak kendi başına zor bir iştir. Onları savaşa uçurmak elbette daha da fazla uzmanlık gerektirir. Pilotlarımızın göreve hazır olmasını sağlamak için, özel bir hava kuvvetleri eğitim merkezi kuracağız ve eğitimlerini standartlaştırmaya başlayacağız."
 ETH_debre_zeyit_air_force_training_center_tt:0 "§Y[GetEthiopianAirforceSpiritName]§! değiştiricisini şununla değiştir:\n$MODIFIER_AIR_DOCTRINE_COST_FACTOR$: §G-%25§! "
 ETH_declare_for_italy:0 "İtalya için İlan Et"
 ETH_declare_for_italy_desc:0 "Birçokları bunu ihanet olarak görecek ve gerçeğe sırtını dönecektir. Ama bu yüzden bu toprakları yönetmeye kaderliyiz. Çünkü ulusumuzun iyiliği için yapılması gerekeni yapma irade gücüne sadece bizim sahip olduğumuzu biliyoruz. [ETH.GetLeader]'ı devirme zamanı geldi."
 ETH_defending_our_homes:0 "Evlerimizi Savunmak"
 ETH_defending_our_homes_desc:0 "[ROOT.Capital.GetCapitalVictoryPointName]'daki imparatorluk kliği sadece kendilerinin güvenliğiyle ilgileniyor. Bu arada, evlerimiz ve ailelerimiz yok edilenler oldu. Bunun daha fazla devam etmesine izin veremeyiz. Anavatanımızın her karışını savunacağız, İmparator için değil, kendimiz için."
 ETH_demand_DJI:0 "[268.GetName]'ı Kurtar"
 ETH_demand_DJI_desc:0 "[AFA.GetName]'ın kurtuluşuyla, şimdi önemli sayıda Afar halkını yönetiyoruz. Ancak Afar, [FRA.GetAdjective]'nin [DJI.GetName]'ı işgali nedeniyle bölünmüş durumda. Afar halkının emperyalist yönetimden kurtuluşunu talep ederek, Afar halkının sadakatini kazanabilir ve bu süreçte stratejik bir liman elde edebiliriz."
 ETH_develop_the_capital_region:0 "[271.GetName]'ı Geliştir"
 ETH_develop_the_capital_region_desc:0 "Halkımızın iyiliği ve [ETH.GetNameDef]'nin korunması için sanayileşme hızını artırmalıyız. Bu nedenle, [ETH.Capital.GetCapitalVictoryPointName]'ı çevreleyen bölgeye yatırım yaparak onu [ETH.GetName]'ın sanayi merkezi haline getireceğiz."
 ETH_develop_the_capital_region_tt:0 "[271.GetName]'ın tamamını kapsayacak şekilde elektrik şebekesini genişletme kararının kilidini açar."
 ETH_develop_the_horn_of_africa:0 "Afrika Boynuzunu Geliştir"
 ETH_develop_the_horn_of_africa_desc:0 "Afrika Boynuzu çok sayıda halk, kaynak ve potansiyel içerir. Eğer bölgenin hükûmetleriyle ekonomik endişe konularında işbirliği yaparsak, bu potansiyelden karşılıklı yarar sağlayacak şekilde yararlanmaya başlayabiliriz."
 ETH_develop_the_horn_of_africa_tt:0 "Afrika Boynuzu'ndaki bağımsız veya [ROOT.getAdjective] bağlı devletlerini iyileştirmek ve muhtemelen entegre etmek için §Ykararların§! kilidini açar."
 ETH_ecole_militaire_haile_selassie_1er:0 "[GetEthiopianMilitaryAcademyName]"
 ETH_ecole_militaire_haile_selassie_1er_desc:0 "Ordumuz, hem teçhizat hem de düşünce açısından bölgedeki diğer güçlere kıyasla çok eski olduğunu kanıtlıyor. Yeni nesil subayları modern savaşları nasıl yapacakları konusunda eğitmek için kendi askeri akademimizi kuracağız."
 ETH_ecole_militaire_haile_selassie_1er_tt:0 "§Y[GetEthiopianArmySpiritName]§! değiştiricisini şununla değiştir:\n$MODIFIER_XP_GAIN_ARMY$: §G+%5§! "
 ETH_elect_of_god:0 "Tanrı'nın Seçilmişi"
 ETH_elect_of_god_desc:0 "İmparatorumuzun eylemlerinde tanrıyı görüyoruz. Savaş alanındaki başarısını ve büyük imparatorluğumuzun yönetimindeki başarısını başka nasıl açıklayabiliriz ki? Halk, İmparator'un emrini yapmanın, her şeye gücü yetenin iradesine uygun hareket etmek olduğunu bilir."
 ETH_empower_the_chambers:0 "Meclisleri Güçlendir"
 ETH_empower_the_chambers_desc:0 "1931 anayasası, İmparator'un rolünü kodlamada yeterince ileri gitmedi. Ne de halkı hükûmetin karar alma sürecine yeterince dahil etmedi. İmparator'un kutsal rolünü korurken, onlara devlet işleri üzerinde daha fazla kontrol vererek Temsilciler Meclisini güçlendirmeliyiz."
 ETH_empower_the_chambers_tt:0 "§Y$ETH_corrupt_bureaucracy_dynamic_modifier$§! değiştiricisini şununla değiştir:\n$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+%5§!"
 ETH_empower_the_ras:0 "Ras'ları Güçlendir"
 ETH_empower_the_ras_desc:0 "İmparatorluğun eğitimsiz köylülerini daha fazla güçlendirmek, uzun vadede sadece imparatorluk sisteminin yok olmasına yol açacaktır. Bunun yerine, İmparator'a devam eden sadakat karşılığında Ras’ları güçlendireceğiz."
 ETH_encourage_local_development:0 "Yerel Kalkınmayı Teşvik Et"
 ETH_encourage_local_development_2_tt:0 "Yerel yetkililer kendi başlarına eyalet iyileştirmeleri yapmaya başlayacak."
 ETH_encourage_local_development_desc:0 "Kimse tüm bir ekonominin ihtiyaçlarını tam olarak tahmin edemez ve aksini iddia etmek tehlikelidir. Bölgelerin uygun gördükleri şekilde gelişmesine izin vereceğiz. Sonuçta, yerel siyasi kuruluşlar ve işletmeler bölgelerinde neyin gerekli olduğunu en iyi bilecektir."
 ETH_encourage_local_development_tt:0 "§Y$ETH_state_development_dynamic_modifier$§! değiştiricisini şununla değiştir:\n$MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+%10§!\n$MODIFIER_LOCAL_BUILDING_SLOTS$: §G+%10§!"
 ETH_establish_a_naval_base:0 "Bir Deniz Üssü Kur"
 ETH_establish_a_naval_base_desc:0 "Yakın zamanda bir liman edinmemizle, kendimizi başka bir savaş alanına açtık. Kendi deniz üssümüzü kurmalı ve yeni kıyı şeritlerimizi savunmak için bir donanma inşa etmeye başlamalıyız."
 ETH_ethiopia_recognized_tt:0 "[ROOT.GetLeader], [ROOT.GetNameDef]'in gerçek lideri olarak tanınır:\n §Y[ROOT.GetName]§! müttefikleri savaşa çağırabilir."
 ETH_ethiopian_industrial_research_institute:0 "[ROOT.GetAdjective] Endüstriyel Araştırma Enstitüsü"
 ETH_ethiopian_industrial_research_institute_desc:0 "Eğer her zaman endüstriyel olarak diğer ulusların bir adım gerisinde kalmaktan kaçınmak istiyorsak, yerli araştırma kurumlarımızı geliştirmeliyiz. Bunu yaparak, fikirleri yurtdışından ithal etmek yerine kendi yeniliklerimizi yapmaya başlayacağız."
 ETH_ethiopian_officers:0 "[ROOT.GetAdjective] Subaylar"
 ETH_ethiopian_officers_desc:0 "[ETH.GetAdjective] hava kuvvetlerinin gelişimi devam ederken, pilotlarımızı etkili bir şekilde koordine edebilecek subaylara sahip olduğumuzdan emin olmalıyız. Yurtdışından geçici danışmanlara güvenmek yerine, kendi uzmanlığımızı sıfırdan geliştireceğiz."
 ETH_ethiopian_officers_tt:0 "§Y[GetEthiopianAirforceSpiritName]§! değiştiricisini şununla değiştir:\n $MODIFIER_AIR_ATTACK$: §G+%15§!"
 ETH_ethiopian_shipbuilding:0 "[ROOT.GetAdjective] Gemi İnşaatı"
 ETH_ethiopian_shipbuilding_desc:0 "Şimdi kendi limanımızı kurduğumuza göre, kendi donanmamızı inşa etmek ve bakımını yapmak için temelleri atmak akıllıca olacaktır. Küresel nakliye yollarına erişimi sürdürmek istiyorsak şüphesiz kendi gemilerimize ihtiyacımız olacak."
 ETH_ethiopias_cause_is_ours:0 "Etiyopya'nın Davası Bizim Davamızdır"
 ETH_ethiopias_cause_is_ours_desc:0 "[SWE.GetAdjective] hükûmeti, Afrika'daki faşist başarının Avrupa'da da yansımaları olacağını fark etmeye başladıkça tarafsızlıktan uzaklaşıyor. Kendi kaderini tayin etme ve uluslararası hukuka saygı hedeflerimiz uyumludur, bu nedenle dış politikada işbirliğimizi derinleştirmeye devam etmemiz mantıklıdır."
 ETH_executive_council:0 "Yürütme Konseyi"
 ETH_executive_council_desc:0 "Halkın iradesine göre hareket edebilecek ve bölgemizdeki istikrar tehditlerine hızla yanıt verebilecek bir yürütme organı oluşturarak Afrika Birliği Teşkilatı'nda daha fazla işbirliği için bastırmalıyız."
 ETH_executive_council_tt:0 "§YAfrika Birliği Teşkilatı§! Üyelerini Yürütme Konseyine davet etme kararlarının kilidini açar."
 ETH_expand_tax_exemptions:0 "[ETH_GetTaxExemptionTitle]"
 ETH_expand_tax_exemptions_desc:0 "[ETH_GetTaxExemptionDesc]"
 ETH_expand_tax_exemptions_tt:0 "§Y$ETH_corrupt_bureaucracy_dynamic_modifier$§! değiştiricisini şununla değiştir:\n$MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY$: §R-%5§!\n$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §R-%5§!"
 ETH_expand_the_bodyguard:0 "Muhafız Birliğini Genişlet"
 ETH_expand_the_bodyguard_desc:0 "[ETH.GetName]'ın güç yapıları parçalanmaya başladıkça kime güvenileceğini belirlemek giderek zorlaşıyor. Bu zor zamanlarda, büyük ulusumuzun gelecekteki lideri, hain unsurlara karşı korumak için sadece kendisine sadık kalıcı bir muhafıza ihtiyaç duyar."
 ETH_expand_the_bodyguard_tt:0 "İç savaş başladığında ekstra birimler ekler"
 ETH_expand_the_coffee_industry:0 "Kahve Sanayisini Genişlet"
 ETH_expand_the_coffee_industry_desc:0 "Dünya genelinde kahveye erişim talep eden insan sıkıntısı yoktur. Lezzetli uyarıcının birincil kaynaklarından biri olarak, kahve endüstrisine yatırım yaparak ve ihracatımızı artırarak bu talepten yararlanmalıyız."
 ETH_expand_the_kebur_zabagna:0 "[ETH_GetGuardsName]'ı Genişlet"
 ETH_expand_the_kebur_zabagna_desc:0 "[ETH_GetGuardsName], silahlı kuvvetlerimiz içinde en iyilerin en iyisi olduklarını kanıtladı. Teçhizat ve insan gücüne erişimlerini artırarak yeteneklerini daha fazla kullanmalıyız."
 ETH_expand_the_kebur_zabagna_tt:0 "Ek bir §YKebur Zabagna§! tümeni toplar. \n§YKebur Zabagna§! şablonuna ek §Y$infantry$§! ve §Y$cavalry$§! taburları ekler.\nİlgili teknolojiler araştırılmışsa §Y$recon$§! ve §Y$artillery$§! ekler."
 ETH_expand_the_levy:0 "[GetChitetName]'ı Genişlet"
 ETH_expand_the_levy_desc:0 "Daha iyi destek ve eğitimle, [GetChitetName] sağlam ve esnek bir askeri güç haline geldi. Üzerine inşa edilecek bu güçlü temelle, herhangi bir yabancı saldırganı caydırmak için [GetChitetName]'ı genişleteceğiz."
 ETH_expand_the_levy_tt:0 "Sahaya sürülebilecek Chitet Sefari Tümenlerinin miktarını §Y48§!'e çıkarır.\nChitet Sefari Tümenlerine §Y3 $irregular_infantry$§! taburu ekler. İlgili teknolojiler araştırılmışsa §Y$engineer$§!, §Y$military_police$§! ve §Y$field_hospital$§! ekler."
 ETH_expand_the_mehal_sefari:0 "[ETH_GetSefariName]'ı Genişlet"
 ETH_expand_the_mehal_sefari_desc:0 "[ETH_GetSefariName] birlikleri, iyi eğitimli profesyonel askerlere olan ihtiyacı göstermiştir. Kriz zamanlarında sadece bir köylü ordusu kurma çağı çoktan geçti. Bu nedenle ordumuzu daimi bir güç olarak yeniden organize edeceğiz."
 ETH_expand_the_mehal_sefari_tt:0 "§Y[GetEthiopianArmySpiritName]§! değiştiricisini şununla değiştir:\n$MODIFIERS_ARMY_DEFENCE_FACTOR$: §G+%25§! \n$MODIFIER_ARMY_ORG_FACTOR$: §G+%5§!"
 ETH_expand_the_officer_corps:0 "Subay Kadrosunu Genişlet"
 ETH_expand_the_officer_corps_desc:0 "Silahlı kuvvetlerde liyakat eksikliği son yıllardaki en önemli zayıflığı olmuştur. En yetenekli kişilerin birliklerimizi yönettiğinden emin olmak için, subay kadrosunu genişletmeli ve rütbelerini kayırmacılıkla kazananların yerinden edilmesine izin vermeliyiz."
 ETH_expanding_the_railway_network:0 "Demiryolu Ağını Genişletme"
 ETH_expanding_the_railway_network_desc:0 "Demiryolları, kaynakları fabrikalara ve oradan da iç veya uluslararası pazarlara taşımak için çok önemlidir. Demiryolu ağını genişleterek, bu kaynakları gerekli hedeflerine ulaştırma yeteneğimizi geliştirebiliriz. Bu aynı zamanda [ETH.GetName] genelindeki insanlar için büyüyen sanayi şehirlerine yerleşmek için daha büyük fırsatlar yaratacaktır."
 ETH_experts:0 "Uzmanlar"
 ETH_exploit_french_weakness:0 "Fransız Zayıflığından Yararlan"
 ETH_exploit_french_weakness_desc:0 "[FRA.GetAdjective]'ler imparatorluklarının külleri üzerinde kavga etmekle meşgulken, Fransız Somaliland toprağını büyük imparatorluğumuza ilhak etme fırsatımız var. [FRA.GetAdjective]'lerin başka bir savaşa pek istekli olmaları pek olası değil, ama her şeye hazır olmalıyız."
 ETH_exploit_french_weakness_tt:0 "§YFransız Somaliland§!'ı işgal etme kararlarının kilidini açar \n§RBu kararları almak Vichy Fransası ile savaş riskini taşır!§!"
 ETH_fait_accompli:0 "Emrivaki"
 ETH_fait_accompli_desc:0 "Birçok kişi [ETH.GetName]'ın sömürgecilik tarihinde bir dipnot olacağını varsayarken, bunun yerine sadece [ITA.GetAdjective] istilasını püskürtmekle kalmayıp, [ITA.GetName]'ı Doğu Afrika'dan tamamen atarak ezici olasılıkları aştı. Geriye kalan tek şey, [ITA.GetAdjective]'lerin yenilgilerini resmi olarak tanımalarıdır."
 ETH_fait_accompli_tt:0 "§Y[ITA.GetNameWithFlag]§!, §Y[ROOT.GetNameDef]§! tarafından kontrol edilen herhangi bir Afrika eyaletini devrederek [ROOT.GetNameWithFlag] ile bir barış imzalayacaktır.\n "
 ETH_falling_back:0 "Geri Çekilme"
 ETH_falling_back_desc:0 "Cephe hatlarımız hızla savunulamaz hale geliyor ve ikmal hatlarımız gergin, [ROOT.Capital.GetCapitalVictoryPointName]'a organize bir geri çekilme akıllıca olabilir ama dikkatli olmalı ve sahadan tamamen kaçmamalıyız."
 ETH_falling_back_tt:0 "İtalyan birimleri, Etiyopya kontrolündeki sınır eyaletlerinde 60 gün boyunca bir hareket ve saldırı cezası alır."
 ETH_federal_factories_tt:0 "Her serbest bırakılan kuklaya §Y1 İnşaat Alanı§! ve §Y1 $industrial_complex$§! ekle."
 ETH_flames_across_the_sea:0 "Denizin Ötesindeki Alevler"
 ETH_flames_across_the_sea_desc:0 "Avrupa hegemonyası altında acı çeken sadece Afrika değil. Kızıldeniz'in ötesindeki komşularımızın, emperyalistlerin taleplerinden çok az gerçek bağımsızlığı var veya hiç yok. Direniş alevlerini Arap yarımadasına yaymalıyız ki halk bir gün kendi kendini tam olarak yönetme şansına sahip olabilsin."
 ETH_formal_request_unlocked_tt:0 "Bir Sürgün Hükûmeti ise savaşa katılmak için Ev Sahibi Ulusa resmi bir talepte bulunma §Ykararının§! kilidini açar"
 ETH_france_divided_tt:0 "Fransa bölündü"
 ETH_freedom_at_gunpoint:0 "Namlu Ucunda Özgürlük"
 ETH_freedom_at_gunpoint_desc:0 "Halkımızı boyunduruk altına alma arayışlarında [ITA.GetAdjective]'leri defalarca püskürtmeyi başardık. Ancak, komşularımız sömürgecilere karşı direnmekte o kadar şanslı değildi. Savaş deneyimimizi ve yeni bulduğumuz ekonomik gücümüzü, sömürgeci güçlerin anladığı tek dili kullanarak Afrika'nın kurtuluşuna yöneltme zamanı geldi. Kaba kuvvet."
 ETH_freedom_at_gunpoint_tt:0 "Afrika uluslarını kurtarmak için §YNamlu Ucunda Özgürlük§! kararlarının kilidini açar."
 ETH_ger_and_ita_have_same_dieology_tt:0 "[GER.GetFlag]§Y[GER.GetName]§!, [ITA.GetFlag]§Y[ITA.GetName]§! ile aynı ideolojiye sahip."
 ETH_german_mediation:0 "[GER.GetAdjective] Arabuluculuğu"
 ETH_german_mediation_desc:0 "[GER.GetAdjective] ve [ITA.GetAdjective] hırsları hizalanmaya başlarken, [ETH.GetName] meselesi iki ulus arasında artan işbirliği için bir engel olmaya devam ediyor. Belki [GER.GetLeader], [ITA.GetLeader]'ı anlamsız işgalini sona erdirmeye ve İmparator'un [ETH.GetName]'daki haklı yerine dönmesine izin vermeye ikna edebilir."
 ETH_haile_selassie_returns_tt:0 "$ETH_haile_selassie$ [ETH.GetName]'a döner:"
 ETH_has_host_nation_tt:0 "Bir Sürgün Hükûmeti için potansiyel bir §YEv Sahibi Ülke§! belirlendi\n"
 ETH_heavy_industry:0 "Ağır Sanayi"
 ETH_heavy_industry_desc:0 "Feodal bir ekonominin pençelerinden kaçacaksak, hızlı sanayileşme sürecine devam etmeliyiz. Ağır sanayinin yaratılması, işçileri şehirlere çekecek ve mevcut köylülüğün yerine model proleterler sınıfı yaratacaktır."
 ETH_horn_of_africa_tt:0 "Afrika Boynuzu'nu kurmak için bir §Ykararın§! kilidini açar."
 ETH_host_nation_fallback_name:0 "Ev Sahibi Ülke"
 ETH_host_nation_name:0 "[?ETH.host_nation.GetNameWithFlag]"
 ETH_humanitarian_aid:0 "İnsani Yardım"
 ETH_humanitarian_aid_desc:0 "Düşman, halkımıza ne kadar acı çektirdiğini umursamıyor. Eğer bu devam ederse, savunulacak bir ülke kalmayacak. Dünya, burada meydana gelen dehşeti görmeli ve bize derhal insani yardım göndermeleri gerekiyor."
 ETH_humanitarian_aid_tt:0 "§Y$ETH_international_red_cross_dynamic_modifier$§! değiştiricisini şununla değiştir:\n$MODIFIER_INDUSTRY_REPAIR_FACTOR$: §G+%10§!"
 ETH_improve_the_administration:0 "Yönetimi İyileştir"
 ETH_improve_the_administration_desc:0 "Eğitim kurumunda hala büyük bir yolsuzluk var. Liyakatle övündüklerini iddia eden kurumlarda bu kabul edilemez. Bu yolsuzluğu okullarımızdan ve üniversitelerimizden acımasızca söküp atmalıyız."
 ETH_improve_the_administration_tt:0 "§Y$ETH_corrupt_bureaucracy_dynamic_modifier$§! değiştiricisini şununla değiştir:\n$MODIFIER_RESEARCH_SPEED_FACTOR$: §G+%5§!\n$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+%5§!\n$MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY_FACTOR$: §G+%5§!"
 ETH_in_the_name_of_the_people:0 "Halk Adına"
 ETH_in_the_name_of_the_people_desc:0 "Halk adına, [ROOT.GetName]'ı yüzyıllardır yöneten hanedan tiranlığını feshedeceğiz. Onun yerine, feodalizmin esaretinden arınmış bir işçi cumhuriyeti yaratacağız. Ve kolektif gücümüzle, Afrika'da faşizmi yeneceğiz."
 ETH_increased_factory_output:0 "Artan Fabrika Çıktısı"
 ETH_increased_factory_output_desc:0 "Dünya giderek daha tehlikeli göründükçe, ordunun yabancı saldırganlara karşı güvenilir bir caydırıcılık olarak kalabilmesi için fabrikaların teçhizat üretimini artırması gerekiyor."
 ETH_increased_factory_output_tt:0 "§Y$ETH_industrialization_dynamic_modifier$§! değiştiricisini şununla değiştir:\n$MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY$: §G+%10§!"
 ETH_infrastructure_projects:0 "Altyapı Projeleri"
 ETH_infrastructure_projects_desc:0 "[ETH.GetName], dünyanın gıpta ettiği birçok doğal kaynağa sahiptir. Ancak, onları fabrikalara veya ülke dışına çıkarmak için yeterli araçlarımız olmadan bu kaynaklardan yararlanamayız. Altyapımızı hızla genişletmeli ve bu ekonomik darboğazı ortadan kaldırmalıyız."
 ETH_infrastructure_projects_tt:0 "§Y$ETH_state_development_dynamic_modifier$§! değiştiricisini şununla değiştir:\n$MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+%10§!"
 ETH_international_brigades:0 "Uluslararası Tugaylar"
 ETH_international_brigades_communist:0 "Uluslararası Tugaylar"
 ETH_international_brigades_communist_desc:0 "Dünya genelinde [ITA.GetAdjective]'lere karşı mücadelemize sempati duyan birçok kişi var. Sempatilerinden yararlanmalı ve onlara yanımızda faşizme karşı silahlanma şansı sunmalıyız."
 ETH_international_brigades_desc:0 "Milletler Cemiyeti'nin sadece mücadelemizde bizi desteklemek için kuvvet gönderme yasağını kaldırma zamanı değil, aynı zamanda üye ulusları işgalcilere karşı durmaya teşvik etme zamanı da geldi!"
 ETH_international_mediation:0 "Uluslararası Arabuluculuk"
 ETH_international_mediation_desc:0 "Milletler Cemiyeti, iki üye devlet arasındaki bir çatışmanın bu kadar uzun sürmesine izin veremez. Harekete geçmeli ve [ITA.GetName]'ı savaş öncesi sınırlarına çekilmeye zorlamalıdır!"
 ETH_international_mediation_tt:0 "[ITA.GetName] ve [ETH.GetName] bir beyaz barış imzalayacak.\n "
 ETH_invest_in_the_east:0 "Doğuya Yatırım Yap"
 ETH_invest_in_the_east_desc:0 "Doğuya yatırım yaparak, bölgenin tarihi ticaret ağından yararlanabilir ve bölgeyi [ETH.GetName] kaynaklarını işlemeye hazır, ihracata hazır bir sanayi merkezine dönüştürebiliriz."
 ETH_invest_in_the_north:0 "Kuzeye Yatırım Yap"
 ETH_invest_in_the_north_desc:0 "Makine üretimi [ETH.GetName]'ın kuzeyinde başlamaktadır. Bu büyüyen sanayiyi genişletmeye yardımcı olmak için artan yatırımla bu gelişmeyi desteklemeliyiz."
 ETH_invest_in_the_west:0 "Batıya Yatırım Yap"
 ETH_invest_in_the_west_desc:0 "[ETH.GetName]'ın çeşitli bölgeleri, çeşitli kaynaklara erişime sahiptir. Batıya yatırım yaparak, hazır giyim üretiminin sanayileşmesini hızla artırabilir ve bu alandaki mevcut uzmanlıktan yararlanabiliriz."
 ETH_invest_tt:0 "Eyalette yatırım §Ykararlarının§! kilidini aç."
 ETH_investors:0 "Sanayiciler"
 ETH_invite_foreign_industrialists:0 "Yabancı [ETH_GetInvestorName] Davet Et"
 ETH_invite_foreign_industrialists_desc:0 "Son yıllarda altyapımızı ve sanayimizi büyük ölçüde geliştirdik, bu da doğal kaynakların kullanımını çok daha verimli hale getirdi. Ancak, [ETH.GetName]'da faaliyet göstermeleri için yabancı uzmanları ve sanayicileri davet ederek sanayimizin gelişimini hızlandırabiliriz."
 ETH_invite_foreign_industrialists_tt:0 "Diğer uluslardan tasarımcılar, hedef ülkenin [ETH.GetFlag][ETH.GetNameDef]'e olan §Ygörüşü§! §G75§!'in üzerindeyse mevcut olacaktır. \n\n§RSeçilen tasarımcılar, kendi ülkeleri [ETH.GetNameDef]!§! ile savaş halindeyse devre dışı bırakılacaktır. \n\nPotansiyel uluslar şunlardır: §Y[ENG.GetFlag][ENG.GetName]§!, §Y[FRA.GetFlag][FRA.GetName]§!, §Y[GER.GetFlag][GER.GetName]§!, §Y[JAP.GetFlag][JAP.GetName]§!, §Y[CZE.GetFlag][CZE.GetName]§!, §Y[SWE.GetFlag][SWE.GetName]§!"
 ETH_invite_foreign_prospectors:0 "Yabancı Maden Arayıcılarını Davet Et"
 ETH_invite_foreign_prospectors_desc:0 "Yurtdışından araştırma gelişmelerini kopyalamak için çabalamak yerine, bol doğal kaynaklarımızdan daha iyi yararlanmamıza yardımcı olmak için yabancı hükûmetlerin ve işletmelerin uzmanlığından yararlanmalıyız."
 ETH_invite_foreign_prospectors_tt:0 "Kuzey [ROOT.GetName]'da §Y$ETH_prospect_for_resources$§! kararlarının kilidini açar. Arama kararları almak için §Y$excavation2$§! ve §Y2§!'den fazla mevcut §Ysivil fabrika§! gerektirir.\n\n"
 ETH_invite_italian_investors:0 "İtalyan Yatırımcıları Davet Et"
 ETH_invite_italian_investors_desc:0 "Yeni hâkim devletlerimizden, yatırımcılarını [ETH.GetName]'ı ziyaret etmeye teşvik ederek yararlanmalıyız. Bir yatırım akını, sadece savaşın neden olduğu hasarı onarmakla kalmayıp, aynı zamanda endüstriyel kapasitemizi büyük ölçüde genişletmede de uzun bir yol kat edecektir."
 ETH_invite_italian_settlers:0 "İtalyan Yerleşimcileri Davet Et"
 ETH_invite_italian_settlers_desc:0 "Büyük ulusumuzun bir başka Avrupa sömürgeleştirme hedefi haline geldiğini görmek birçoğu için yutulması zor bir hap olacaktır. Ancak, son tarih sanayimizin ve altyapımızın zayıflığını göstermiştir ve onları iyileştirmek için radikal önlemlere ihtiyacımız var. Bu nedenle, saf [ITA.GetAdjective]'lerin uzmanlığından ve zenginliğinden yararlanarak onları buraya yerleşmeye davet ederek durumdan yararlanacağız."
 ETH_invite_italian_settlers_tt:0 "§Y2 sahip olunan eyalet§!, [ITA.GetName]'dan bir dizi Yerleşimci kazanacak, onları kırsal veya pastoral eyaletlerden değiştirerek ve §Yyeni inşaat alanları§! vererek."
 ETH_italian_general_staff:0 "İtalyan Genelkurmayı"
 ETH_italian_general_staff_desc:0 "Ordumuzun modernizasyon konusunda hala kat etmesi gereken uzun bir yol var. Silahlı kuvvetler için modern teçhizat üretme veya tedarik etme konusunda büyük adımlar atıyor olsak da, subaylarımızın bunu nasıl kullanacakları konusunda birçok modası geçmiş görüşü var. Belki de modern savaşı nasıl yürüteceğimizi, [ITA.GetAdjective] subaylarını genelkurmayımıza katılmaya davet ederek öğrenebiliriz."
 ETH_italian_general_staff_tt:0 "İtalya ile ilişkiler olumluysa ve kabul ederlerse, §Y$ITA_giuseppe_tellera$§!, §Y$ITA_mario_berti$§! ve §Y$ITA_alessandro_pirzio_biroli$§! Etiyopya'ya transfer edilecek."
 ETH_jah:0 "Jah"
 ETH_jah_desc:0 "Rastafaryan hareketi, dünya çapında beklenmedik bir [ETH.GetName] destekçileri ağı yarattı. Birçoğu İmparatorumuz [ETH.Getleader]'a büyük dini önem atfediyor. Bazıları onun Tanrı'nın veya daha doğrusu Jah'ın bedenlenmiş hali olduğunu iddia edecek kadar ileri gidiyor. Belki de bu Rastafaryan hareketini benimseyerek uluslararası desteğimizi kullanmalıyız."
 ETH_jah_tt:0 "Siyon İmparatorluğunu kurmak için §Ykararın§! kilidini açar"
 ETH_japan_has_island_tt:0 "Japonya en az bir çekirdek olmayan ada eyaletini kontrol ediyor."
 ETH_japan_joins_tt:0 "§Y[JAP.GetNameDefCap]§!, §Y[ROOT.GetName]'ın§! [ITA.GetName]'a karşı savaşına katılacak.\n§Y[ROOT.GetName]§!, §Y[JAP.GetName]§!'ın bir kuklası olacak!"
 ETH_japanese_investments_tt:0 "[ROOT.GetName] kurtarıldıktan sonra [ROOT.GetName]'daki Japon yatırımları için §Ykararların§! kilidini açar"
 ETH_joint_swedish-ethiopian_intelligence_program:0 "Ortak İsveç-Etiyopya İstihbarat programı"
 ETH_joint_swedish-ethiopian_intelligence_program_desc:0 "[ETH.GetName]'a doğrudan yardım, [SWE.GetName]’in tarafsızlığı hakkında soruları gündeme getirirdi. Ancak, makul bir inkârı sürdürmek için gizli destek sunmaya istekli olabilirler. Bölgedeki bağlantılarımızı ve [SWE.GetName]’in kaynaklarını kullanarak, Afrika'daki [ITA.GetAdjective] sömürge yönetimini aşındırabiliriz."
 ETH_keep_the_chitet:0 "[GetChitetName]'ı Koru"
 ETH_keep_the_chitet_desc:0 "[GetChitetName] bize iyi hizmet etti. Nispeten tarımsal bir ulus olarak, her zaman kalıcı, profesyonel bir orduyu sahaya sürmekte zorlanırdık. Bildiğimizle devam etmek en iyisidir."
 ETH_keep_the_chitet_tt:0 "§Y[GetEthiopianArmySpiritName]§! değiştiricisini şununla değiştir:\n $modifier_army_sub_unit_irregular_infantry_max_org_factor$: §G+%5§!\n Chitet Sefari Tümenlerine §Y2 $irregular_infantry$§! taburu ekler."
 ETH_laying_the_tracks:0 "Rayları Döşemek"
 ETH_laying_the_tracks_desc:0 "Nüfusun ve sanayinin çoğu ülkemizin batısında yoğunlaşmıştır. Bu nedenle, bol doğal kaynaklarımızdan daha iyi yararlanmak için, onları fabrikalarımıza taşımak üzere demiryolu ağımızın büyük bir genişlemesine ihtiyacımız var."
 ETH_league_of_nations_volunteer_resolution:0 "Milletler Cemiyeti Uluslararası Tugaylar Kararı"
 ETH_learning_from_the_enemy:0 "Düşmandan Öğrenme"
 ETH_learning_from_the_enemy_air:0 "Düşmandan öğrenme: Uçak"
 ETH_learning_from_the_enemy_armor:0 "Düşmandan öğrenme: Zırhlı Araçlar"
 ETH_learning_from_the_enemy_desc:0 "Sınırlı endüstriyel kapasitemize rağmen, [ITA.GetAdjective]'in teknolojik üstünlüğünden, araçlarını ve teçhizatlarını tersine mühendislikle kendi yaratıcılarına karşı çevirerek yararlanabiliriz."
 ETH_learning_from_the_enemy_tt:0 "§Y$ETH_industrialization_dynamic_modifier$§! değiştiricisini şununla değiştir:\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+%10§!"
 ETH_liberate_aussa:0 "Devrimi Afar'a Götür"
 ETH_liberate_aussa_desc:0 "[AFA.GetNameDefCap], birçok kez düşmanlarımızın yanında yer alan hain bir oligarşi tarafından yönetiliyor. [ETH.GetNameDef] için böyle bir tehdit artık göz ardı edilemez. [AFA.GetAdjective] halkını kurtaracak ve bölgeyi işçi cumhuriyetimize entegre edeceğiz."
 ETH_light_tank_tt:0 "§Y$light_tank_chassis_1$ varyantı oluştur: [ITA.GetFlag] L3/35§!"
 ETH_local_committees:0 "Yerel Komiteler"
 ETH_local_committees_desc:0 "Kaçınılmaz olarak yolsuzluk üreten ve halkın iradesini bastıran anlamsız hiyerarşi katmanlarından arınmış yeni bir hükûmet sistemi yaratma fırsatımız var. Bu fırsatı, her biri anarko-komünizm ilkelerine uyan bir komünler federasyonu oluşturmak için kullanmalıyız."
 ETH_lord_of_lords:0 "Lordlar Lordu"
 ETH_lord_of_lords_desc:0 "İmparatorluğumuz birçok kültürden oluşsa da, hepsi aynı Lordlar Lordu'na boyun eğer. En soylu lordlar bile görevlerinin İmparator'a olduğunu bilir. Majesteleri bu toprakların tartışmasız hükümdarıdır."
 ETH_mass_transit:0 "Kolektif Toplu Taşıma"
 ETH_mass_transit_desc:0 "Ulaşım altyapımızın çoğu güncelliğini yitirmiştir ve daha verimli kullanılabilmesi için yeniden organize edilmesi gerekmektedir. Bu tür reformları uygulamak için en uygun kişiler, altyapıyı işleten işçilerdir."
 ETH_medal_gain_tt:0 "Bir madalya ile ödüllendirildiğinde Tümen Komutanları tarafından kazanılan DP miktarını §G+%75§! artırır!"
 ETH_mercenaries:0 "Paralı Askerler"
 ETH_mercenaries_arabia_tt:0 "§Y[843.GetName]§! ve §Y[835.GetName]§!'den biri dost kontrolündeyse, §Y2 Arap Paralı Asker birimi§! ekler."
 ETH_mercenaries_congo_tt:0 "§Y[838.GetName]§! ve §Y[837.GetName]§!'den biri dost kontrolündeyse, §Y3 Kongo Paralı Asker birimi§! ekler."
 ETH_mercenaries_desc:0 "Çeşitli nedenlerle savaşımıza katılmak isteyen birçok yabancı var. Çoğu değersiz maceraperestler, sadece paramızın peşinde; ama Belçika Kongosu'ndan ve Arabistan'dan bazı Paralı Askerler toplayabiliriz. Bu deneyimli savaşçılardan bazılarını yanımıza almak, dengeyi lehimize çevirmemize kesinlikle yardımcı olabilir."
 ETH_military_advisors:0 "Sovyet Generalleri"
 ETH_military_advisors_desc:0 "Subaylarımızın birçoğu modern savaşın taleplerine uyum sağlamış olsa da, büyük ölçüde ellerinden geldiğince doğaçlama yapmak zorunda oldukları açıktır. [SOV.GetAdjective] ordusundaki yoldaşlarımızdan çok şey öğrenebiliriz."
 ETH_military_advisors_tt:0 "\nEğer [SOV.GetFlag]§Y[SOV.GetName]§! kabul ederse, [ETH.GetFlag]§Y[ETH.GetName]§! bir mareşal (§Y$SOV_semyon_budyonny$§!) ve bir general (§Y$SOV_vasily_kuznetsov$§!) kazanacaktır."
 ETH_military_communism:0 "Askerî Komünizm"
 ETH_military_communism_desc:0 "Cephe hatlarında sahip olduğumuz az başarı, kalıtsal liderliğinden değil, sıradan askerin yaratıcılığı ve cesaretinden kaynaklanmaktadır. Hoşnutsuzluk homurtuları giderek yükseliyor. Emperyalizm miadını doldurdu. Şimdi zenginliğin zorla yeniden dağıtılma zamanı."
 ETH_modernizing_the_industry:0 "Sanayiyi Modernleştirme"
 ETH_modernizing_the_industry_desc:0 "Son yıllarda endüstriyel kapasitemizi artırmada büyük ilerleme kaydettik. Ancak, ekonominin talepleri değiştikçe ve yeni üretim yöntemleri ortaya çıktıkça bu devam eden bir görev olacaktır. Bu nedenle, [ETH.GetName]'ın tamamına elektrik ve diğer endüstriyel gelişmeleri getirmeye ve ekonomik modernizasyonumuza devam etmeye çalışacağız."
 ETH_modernizing_the_industry_tt:0 "Yatırım yapılan bölgelerdeki tüm eyaletler için:\n §G1§! §Yİnşaat Alanı§! ekle.\nYatırım yapılan her bölgedeki bir Eyalet:\n §G1§! §Y$industrial_complex$§! ekle."
 ETH_mounted_levies:0 "Atlı [GetChitetName]"
 ETH_mounted_levies_desc:0 "Doğu'nun çöllerinden Batı'nın dağlarına kadar, anavatanımız çeşitli zorlu arazilerden oluşur ve bu nedenle tekerlekli veya paletli araçlara uygun değildir. Ancak, develer ve atlar binlerce yıldır bu göreve fazlasıyla uygun olduklarını kanıtlamışlardır."
 ETH_mounted_levies_tt:0 "§Y$cavalry$§! ve §Y$camelry$§! tümenlerini toplar."
 ETH_mulugeta_yeggazu_of_illubabor_upgrade_tt:0 "Kazanır: \n§Y$army_chief_morale_3$§!"
 ETH_mutual_defense:0 "Karşılıklı Savunma "
 ETH_mutual_defense_desc:0 "Dünya ulusları, bizi sömürgeleştirme girişiminin maliyetinin çok büyük olduğunu anlayana kadar Afrika halkı asla kalıcı bir barışa sahip olamayacaktır. Bunu başarmak için, Afrika Birliği Teşkilatı’nın üyeleri, herhangi birimize saldırılması durumunda birbirimizi koruma sözü veren bir karşılıklı savunma anlaşması oluşturmalıdır."
 ETH_mutual_defense_tt:0 "§YAfrika Birliği Teşkilatı§! üyelerini bir karşılıklı savunma anlaşmasına davet etme kararlarının kilidini açar."
 ETH_mytishchi-ababa_plant:0 "Mıytişçi-Ababa Fabrikası"
 ETH_mytishchi-ababa_plant_desc:0 "Sovyetler Birliği ile olan yakın bağlarımızı, yerli ve askeri makine imalatında uzmanlık kazanmak için kullanmalıyız. Ortak bir fabrika projesi, bu tür bilgileri edinmek için mükemmel bir mekanizma olacaktır ve Mıytişçi Makine İmalat'tan daha iyi bir ortak kim olabilir ki."
 ETH_naval_college_name_communist:0 "Kızıldeniz Denizcilik Koleji"
 ETH_naval_college_name_fallback:0 "[ETH.GetAdjective] Deniz Akademisi"
 ETH_naval_college_name_historical:0 "Asmera Denizcilik Koleji"
 ETH_naval_college_reduction:0 "Deniz Koleji Araştırması"
 ETH_negusa_nagast:0 "Negusa Nagast"
 ETH_negusa_nagast_desc:0 "[ETH.GetName]'ı [ITA.GetAdjective] nüfuzundan kurtarma ve bağımsızlığımızı ilan etme zamanı geldi. [ETH.GetLeader]'ın liderliği sayesinde yakında bir kez daha kendi kaderimizin efendisi olacağız."
 ETH_negusa_nagast_tt:0 "§Y[ROOT.GetNameWithFlag]§! bağımsızlığını ilan eder"
 ETH_new_weapons_and_tactics:0 "Yeni Silahlar ve Taktikler"
 ETH_new_weapons_and_tactics_bonus:0 "Yeni Silahlar ve Taktikler Araştırması"
 ETH_new_weapons_and_tactics_desc:0 "Diğer orduların teknolojik ilerlemelerine ayak uydurmak, en son tehditlerle başa çıkmak için her zaman donanımlı ve eğitimli olmaları için kendimize sürekli bir yatırım gerektirir."
 ETH_northern_thrust:0 "Kuzey İlerlemesi"
 ETH_northern_thrust_desc:0 "İlk önceliğimiz Eritre'yi ele geçirmek olmalı. Eğer İtalyanları Kuzey'deki limanlarından kesebilirsek, kuvvetlerini tedarik etmekte çok daha zorlanacaklar ve o zaman daha zayıf Güney cephesiyle ilgilenebiliriz."
 ETH_officer_promotion_boost_tt:0 "§Ygeneral§! rütbesine terfi eden gelecekteki tüm §Ysubaylar§!, §G+1 Saldırı§! ve §G+1 Savunma§! alacak!"
 ETH_old_reliable:0 "Eski Güvenilir"
 ETH_old_reliable_desc:0 "Basit, güvenilir ve onarılabilir silahlar, birçok ordunun şimdi sahaya sürdüğü aşırı karmaşık mekanizmalardan cephede daha arzu edilir. Birliklerimiz zaten eski tüfeklerini nasıl kullanacaklarını bilirken neden yeni tüfeklerle eğitmek için zaman ve kaynak israf edelim?"
 ETH_old_reliable_tt:0 "§Y[GetEthiopianArmySpiritName]§! değiştiricisini şununla değiştir:\n $MODIFIER_MAX_DIG_IN$: §G+0.5§!\n $MODIFIER_DIG_IN_SPEED_FACTOR$: §G+%25§!\n $modifier_army_sub_unit_infantry_attack_factor$: §G+%5§!\n $modifier_army_sub_unit_infantry_defence_factor$: §G+%10§!\n $modifier_army_sub_unit_infantry_speed_factor$: §G+%10§!"
 ETH_organization_of_african_unity:0 "Afrika Birliği Teşkilatı"
 ETH_organization_of_african_unity_desc:0 "Şimdiye kadar, Avrupa sömürgeciliğinden kurtuluş, sadece bağımsızlık kazanma meselesi olarak görülüyordu. Ancak, görünüşe göre hepimiz hala Afrika dışındaki birçok liderin gözünde potansiyel fetih hedefleriyiz. Afrika halkı, ancak bir arada durarak ve işbirliği yaparak bir kez daha bağlı devletler olmaktan kurtulmayı umabilir."
 ETH_organization_of_african_unity_tt:0 "Bağımsız Afrika ülkelerini §YAfrika Birliği Teşkilatına§! davet etme kararlarının kilidini açar!"
 ETH_organize_regional_revolts:0 "Bölgesel İsyanları Organize Et"
 ETH_organize_regional_revolts_desc:0 "[ITA.GetAdjective]'ler anavatanımız üzerinde henüz sağlam bir hakimiyet kuramadı. İşgale karşı direniş, teçhizatlarını, insan güçlerini ve en önemlisi bu kanlı sömürge çabasını sürdürme heveslerini istikrarlı bir şekilde tüketiyor. Direnişe yardım etmeye devam etmeli ve [ITA.GetAdjective] işgal kuvvetlerini devirme çabalarını koordine etmeye başlamalıyız."
 ETH_organize_regional_revolts_tt:0 "İşgal altındaki topraklarda isyancı orduları organize etmek için §Ykararların§! kilidini açar."
 ETH_our_enemys_enemy:0 "Düşmanımızın Düşmanı"
 ETH_our_enemys_enemy_desc:0 "[ITA.GetAdjective] yayılmacılığına ideolojik veya stratejik nedenlerle karşı çıkan birçok ulus var. Bölgedeki [ITA.GetAdjective] kuvvetlerini devirebilmemiz için bu uluslardan silah tedariki için ulaşmalıyız."
 ETH_our_enemys_enemy_tt:0 "Bir ulus silah göndermeyi kabul ederse, [ETH.GetFlag][ETH.GetName] onlardan §G1000 piyade teçhizatı§! alacak."
 ETH_our_own_path:0 "Kendi Yolumuz"
 ETH_our_own_path_desc:0 "İşlerimizi kontrol altına alarak bize ihanet ettiklerinde [SOV.GetAdjective]'lere direnecek kadar zayıftık. Şimdi çok daha güçlü bir konumdayız ve nihayet bağımsızlığımızı yeniden kazanmak için bir hamle yapabiliriz. Ancak, [SOV.GetAdjective]'lerden gelebilecek olası misillemelere hazırlıklı olmalıyız."
 ETH_our_own_path_tt:0 "§R[SOV.GetNameDefCap] bu hareket tarzından öfkelenecek ve Etiyopya'yı tekrar [SOV.GetAdjective] kontrolü altına almaya çalışabilir!§!"
 ETH_outsourced_production:0 "Dış Kaynaklı Üretim"
 ETH_outsourced_production_air_tt:0 "Hava Kuvvetleri Tasarımcıları:"
 ETH_outsourced_production_army_tt:0 "\nOrdu Tasarımcıları:"
 ETH_outsourced_production_desc:0 "Sanayimiz, savaş araçlarını üretme konusunda küçük ve deneyimsiz kalmaya devam ediyor. Ancak, şimdi sıkı bir şekilde [ITA.GetAdjective] etki alanındayız, üretim ihtiyaçlarımızı dış kaynak kullanarak ve silah üreticilerinin uzmanlığından yararlanarak durumdan en iyi şekilde yararlanabiliriz."
 ETH_outsourced_production_factories_tt:0 "\n Eğer [ITA.GetFlag]§Y[ITA.GetNameDef]§! kabul ederse, [ETH.GetFlag]§Y[ETH.GetNameDef]§! §Y4 Askerî Fabrika§! kazanır."
 ETH_outsourced_production_tt:0 "[ITA.GetFlag]§Y[ITA.GetAdjective]§! ordu veya hava kuvvetleri tasarımcılarını talep et:"
 ETH_pan-africanism:0 "Pan-Afrikanizm"
 ETH_pan-africanism_desc:0 "Aradığımız eşitlik hedefi, son Afrika tarihinin sayfalarının bu kadar uzun bir şekilde bahsettiği, bir halkın diğeri tarafından sömürülmesinin antitezidir. Hangi kılığa bürünürse bürünsün, bu kötülük var olmadığı yerde kaçınılmalı ve var olduğu yerde ezilmelidir. Eşitlik hayalinin, hala ondan mahrum olan herkes için nihayet gerçekleştirilmesini sağlamak bizim kutsal görevimizdir."
 ETH_pan-africanism_liberate_tt:0 "Afrika'daki tüm sömürgeci güçlere karşı §Yözgürleştirme savaş hedefleri§! kazan:"
 ETH_patriot_resistance_tt:0 "Arbegnoch tarafından Aktif Direniş: §R+%10§!"
 ETH_peace_negotiations:0 "Barış Müzakereleri"
 ETH_peace_negotiations_desc:0 "Halkımız, [ITA.GetAdjective] istilasını durdurmak için büyük fedakarlıklar yaptı. Şimdi onlara karşı yıkılmayacağımızı [ITA.GetAdjective]lara kanıtladığımıza göre, barış yapma fırsatımız var. Ya da en azından bir ateşkes anlaşması."
 ETH_peacekeeping_forces:0 "Barış Gücü Kuvvetleri"
 ETH_peacekeeping_forces_desc:0 "Güvenliğimizin anahtarı, yurtdışındaki herhangi bir krizin kontrolden çıkmadan önce hızla halledilmesini sağlamaktır. Bu nedenle, dünyanın dört bir yanına her an konuşlandırılabilecek bir barış gücü kuvvetini sürdürmek çok önemlidir."
 ETH_peoples_army_focus:0 "Halk Ordusu"
 ETH_peoples_army_focus_desc:0 "Modern savaş yürütme konusundaki ilk zayıflığımıza rağmen, geleneksel olmayan taktikler kullanarak [ITA.GetAdjective] işgalini yavaşlatmayı başardık. Bunu askeri doktrinimizde kutsallaştırabilir ve subaylarımızı asimetrik savaşın nasıl yürütüleceği konusunda eğitebiliriz."
 ETH_preparing_for_the_inevitable:0 "Kaçınılmaz Olana Hazırlanma"
 ETH_preparing_for_the_inevitable_desc:0 "Dünyanın dört bir yanındaki güçler, kendi halklarının da aynısını talep edeceği korkusuyla [ETH.GetNameDef]'deki radikal reformlarımıza tolerans göstermeyecektir. Yaşam tarzımızı ezmek için kaçınılmaz girişimlerine hazırlıklı olmalıyız."
 ETH_promote_the_war_heroes:0 "Savaş Kahramanlarını Terfi Ettir"
 ETH_promote_the_war_heroes_desc:0 "Devam eden özgürlüğümüzü savaş alanında hayatlarını riske atan kahramanlara borçluyuz. Yüksek morali ve silahlı kuvvetlere desteği sürdürmek için, savaş kahramanlarımızı daha prestijli pozisyonlara terfi ettireceğiz."
 ETH_protector_of_the_somalis:0 "Somalililerin Koruyucusu"
 ETH_protector_of_the_somalis_desc:0 "[SOM.GetAdjective]'ler sadece [ITA.GetAdjective]'lerin barbar yönetimine maruz kalmakla kalmıyor, aynı zamanda [ITA.GetLeader]’ın toprak genişlemesi uğruna kendi halklarına karşı savaşmak için askere alınıyorlar. [ITA.GetName] bölgeden kovulduğunda, [SOM.GetAdjective]'leri başka herhangi bir Avrupa gücünün sömürüsünden koruyacağız."
 ETH_purchase_obsolete_ships:0 "Eski Gemiler Satın Al"
 ETH_purchase_obsolete_ships_desc:0 "Denizcilik gelişimimizde ilerleme kaydetmemize rağmen, henüz kıyı şeridimizi yeterince savunabilecek bir filo konuşlandırabilecek kapasitede değiliz. Ancak, filomuzu desteklemek için diğer uluslardan bazı eski gemileri tedarik edebiliriz."
 ETH_purchase_obsolete_ships_tt:0 "Büyük güçlerden daha eski gemiler satın alma kararlarının kilidini aç."
 ETH_raid_italian_depots:0 "İtalyan Depolarını Bas"
 ETH_raid_italian_depots_desc:0 "İtalyan ordusu, ülkemiz genelindeki depolarda büyük miktarda teçhizat topladı. Kaçınılmaz bir çatışmaya hazırlanırken, onları bu teçhizattan mahrum bırakabilir ve depoları basarak kendi kuvvetlerimizi güçlendirebiliriz."
 ETH_raid_italian_depots_tt:0 "Baskınlar önümüzdeki §Yyıl§! boyunca ara sıra gerçekleşecek ve her seferinde [ETH.GetFlag]§Y[ETH.GetName]'ın§! stoklarına [ITA.GetFlag]§Y[ITA.GetAdjective]§! teçhizatı ekleyecek."
 ETH_raise_from_the_ranks:0 "Sıradan Yükselt"
 ETH_raise_from_the_ranks_desc:0 "Artık aristokrasi silahlı kuvvetlerin komutasında olmayacak. Cesur askerlerimizden birçoğu kendilerini yetenekli liderler olarak kanıtladı. Hanedan bağlantıları veya kişisel servet yerine savaş alanında cesareti ve becerileri ödüllendirme zamanı geldi."
 ETH_raise_from_the_ranks_tt:0 "§Ygeneral§! rütbesinde §Yiki§! yeni subay ekle."
 ETH_rally_around_the_emperor:0 "İmparatorun Etrafında Toplan"
 ETH_rally_around_the_emperor_desc:0 "Majesteleri [ETH.GetLeader], çeşitli imparatorluğumuzu bir arada tutan kilit taşıdır. Bu kriz zamanında, küçük şikayetlerimizi bir kenara bırakıp majestelerinin arkasında toplanmalıyız, çünkü [ETH.GetName]'ın ve halkının hayatta kalması tehlikede."
 ETH_rally_around_the_emperor_tt:0 "Bir Etiyopya §YSürgün Hükûmeti§! için olası bir §YEv Sahibi Ülke§! belirleme kararlarının kilidini açar."
 ETH_rapid_industrial_expansion:0 "Hızlı Sanayi Genişlemesi"
 ETH_rapid_industrial_expansion_desc:0 "İç cephedeki insanların kahramanca çabalarına rağmen, yabancı işgalden uzak kalmak istiyorsak daha da büyük bir endüstriyel kapasiteye ihtiyacımız var. Bu nedenle, ekonomik planlarımızın hızını artıracak ve daha da hızlı bir sanayi genişlemesi izleyeceğiz."
 ETH_rapid_industrial_expansion_tt:0 "§Y$ETH_industrialization_dynamic_modifier$§! değiştiricisini şununla değiştir:\n$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+%10§!"
 ETH_ras_imru_haile_selassie_upgrade_tt:0 "Kazanır: \n§Y$army_infantry_2$§!"
 ETH_re-convene_the_parliament:0 "Parlamentoyu Yeniden Topla"
 ETH_re-convene_the_parliament_desc:0 "1931 anayasasını restore etme ve [ETH.GetName]’in kurumlarını modernize etme sürecine devam etme zamanı geldi. İmparatorluk Parlamentosunu yeniden toplayacağız ve İmparatorluğun çeşitli bölgelerini daha iyi yönetmek için milletvekili sayısını artıracağız."
 ETH_reach_out_to_the_italians:0 "İtalyanlara Ulaş"
 ETH_reach_out_to_the_italians_desc:0 "Savaş alanında [ITA.GetAdjective]'leri yenme umudumuzun kalmadığı açıktır. Ancak, [ETH.GetLeader] askerlerimizi sonuçsuz taarruzlarda ölüme göndermeye devam ediyor. Daha güçlü bir lider altında, İtalyanlarla çalışabilecek ve anavatanımıza barış getirebilecek yeni bir liderliğin zamanı geldi."
 ETH_reach_out_to_the_italians_tt:0 "§Y[ITA.GetNameDef]§!'e, toprak karşılığında barış teklif eden bir işbirliği teklifi gönderilecek."
 ETH_reach_out_to_the_world:0 "Dünyaya Ulaş"
 ETH_reach_out_to_the_world_desc:0 "Dünya [ROOT.GetName]'da neler olduğunu bilmeli. İnsanüstü bir şekilde sayıca üstün kuvvetlere karşı dayandık ve bir Avrupa büyük gücünü çıkmaza soktuk. uluslararası toplum, bu yasadışı saldırganlığa karşı yardıma ihtiyacımız olduğunu görmeli!"
 ETH_rebuilding_the_country:0 "Ülkeyi yeniden inşa etme"
 ETH_rebuilding_the_country_desc:0 "Topraklarımız üzerinde tam yetkiye sahip olarak, nihayet evlerimize ve sanayimize [ITA.GetAdjective]'ler tarafından verilen hasarı onarmaya başlayabiliriz."
 ETH_rebuilding_the_country_idea:0 "Ülkeyi yeniden inşa etme"
 ETH_reclaim_the_empire:0 "İmparatorluğu Geri Al"
 ETH_reclaim_the_empire_desc:0 "Büyük liderimiz [ETH.GetLeader]'ın yönetimi altında, [ITA.GetName]'ın büyük ulusumuz üzerindeki aşındırıcı etkisini reddettik ve halkımızın eşsiz gücünü yeniden keşfettik. Şimdi, önümüzdeki büyük görev, haklı topraklarımızın geri alınması ve [ETH.GetAdjective] halkının birleştirilmesinde yatmaktadır."
 ETH_reclaim_the_empire_tt:0 "Bir kez daha [ETH.GetFlag][ETH.GetAdjective] kontrolü altına girdiğinde [ITA.GetFlag][ITA.GetName]'a devredilen topraklarda çekirdekleri geri kazanmak için §Yİmparatorluğu Geri Al§! kararlarının kilidini açar."
 ETH_reclaiming_ethiopia:0 "Etiyopya'yı Geri Alma"
 ETH_reclaiming_ethiopia_desc:0 "Ev sahiplerimizi, [ITA.GetName]’in yasadışı işgaline rağmen, [ETH.GetLeader]'ı [ETH.GetName]'ın devam eden haklı hükümdarı olarak resmi olarak tanımaya yavaş yavaş ikna ediyoruz. Sadece bir itme daha gerekiyor ve nihayet uzun zamandır beklenen kurtuluş kampanyasına başlayabiliriz."
 ETH_reclaiming_ethiopia_event_tt:0 "§Y[GetEthiopianHostName]§!:"
 ETH_reclaiming_ethiopia_exile_tt:0 "Eğer [ROOT.GetName] bir Sürgün Hükûmetine sahipse etkiler:"
 ETH_reclaiming_ethiopia_not_exile_tt:0 "\nSürgünde bir Hükûmet değilse etkiler:"
 ETH_recruit_from_the_african_diaspora:0 "Afrika Diasporasından Askere Al"
 ETH_recruit_from_the_african_diaspora_desc:0 "Bağımsız Afrika'nın son kalıntılarından birinin sönmesini görmek istemeyen dünya çapındaki Afrika diasporasının birçoğu, silahlanıp yanımızda savaşmaya istekli. Birlikte, sadece [ETH.GetName]'ı değil, Afrika özgürlüğü fikrinin kendisini de kurtaracağız."
 ETH_recruit_mercenaries:0 "Paralı Asker Topla"
 ETH_recruit_mercenaries_desc:0 "Şu anda orduda farklı kökenlerden askerler arasında büyük bir gerilim var. Birçoğu eski rejime sadık ve güvenilemez. Bu sadakatsiz unsurları kökünden kazıyana kadar, bize sorgusuz sualsiz sadık kuvvetlere ihtiyacımız var. Sadakati teşvik etmenin en kolay yolu, nakit paradır."
 ETH_red_army_engineers:0 "Kızıl Ordu Mühendisleri"
 ETH_red_army_engineers_desc:0 "Ulusumuzun altyapısının çoğu [ITA.GetAdjective] istilası sırasında ağır hasar gördü. Gerçek bir işçi cumhuriyeti inşa etmek istiyorsak, sadece sahip olduklarımızı onarmakla kalmayıp, hızlı bir sanayileşme programı başlatmalıyız. Süreci başlatmak için Kızıl Ordu'daki yoldaşlarımızın becerilerinden yararlanmalıyız."
 ETH_reform_the_currency:0 "Para Birimini Reforme Et"
 ETH_reform_the_currency_desc:0 "[ETH.GetAdjective] banknotlarının dolaşımı son yıllarda artmış olsa da, birçoğu hala [ETH.GetName]'da ticaret yaparken diğer ulusların para birimlerini kullanmayı tercih ediyor. Hem yurtiçinde hem de yurtdışında daha fazla kabul görmesi için birri reforme etmemiz gerekiyor."
 ETH_refuge_for_the_spanish_exiles:0 "İspanyol Sürgünler için Sığınak"
 ETH_refuge_for_the_spanish_exiles_desc:0 "İspanya'daki ideolojik yoldaşlarımız, dünya çapındaki faşistlerin, Stalinistlerin ve kapitalistlerin birleşik çabalarıyla anarşizm hayallerinin ezildiğini gördü. Yerinden edilmiş dostlarımıza sınırlarımızı açmalı ve onlara daha iyi bir gelecek inşa etme konusunda ikinci bir şans sunmalıyız."
 ETH_regional_supply_depots:0 "Bölgesel İkmal Depoları"
 ETH_regional_supply_depots_desc:0 "Eğer mühimmatları veya yiyecekleri yoksa, birliklerimiz anavatanlarını savunamayacaklar. Sonuçta, bir ordu midesi üzerinde yürür. [ETH.GetName] genelinde bölgesel askeri ikmal depoları kurarak her zaman iyi tedarik edildiklerinden emin olmalıyız."
 ETH_regional_training_centers:0 "Bölgesel Eğitim Merkezleri"
 ETH_regional_training_centers_desc:0 "[GetChitetName] mükemmel olmaktan uzaktır. Birliklerimiz, onlara nasıl savaşacaklarını ve taktiksel düşüneceklerini göstermek için bölgesel eğitim merkezleri kurulmasıyla çok daha etkili olabilir. Bu aynı zamanda daimi bir orduya ihtiyaç duymadan askeri eğitimi standartlaştırmamızı sağlar."
 ETH_regional_training_centers_tt:0 "§Y[GetEthiopianArmySpiritName]§! değiştiricisini şununla değiştir:\n $modifier_army_sub_unit_irregular_infantry_defence_factor$: §G+%5§! \n $modifier_army_sub_unit_irregular_infantry_speed_factor$: §G+%10§! \n $modifier_army_sub_unit_irregular_infantry_max_org_factor$: §G+%15§!"
 ETH_reinforce_dynamic_identity:0 "[Get_ETH_reinforce_dynamic_identity_name]"
 ETH_reinforce_dynamic_identity_desc:0 "Halk, yeni yönetim altında ulusal kimlikleri konusunda kafası karışık kalmaya devam ediyor. Küçük şikayetleri ne olursa olsun, artık onlar [ETH.GetAdjective]'dir. Ve iyi [ETH.GetAdjective]'lerin [ETH.GetLeader]'a ve devlete sadık olduğunu öğrenme zamanı geldi."
 ETH_reinforce_ethiopian_identity:0 "Etiyopya Kimliğini Güçlendir"
 ETH_reinforce_gojjam_identity:0 "Gojjam Kimliğini Güçlendir"
 ETH_reinforce_jimman_identity:0 "Jimman Kimliğini Güçlendir"
 ETH_reinforced_identity:0 "Güçlendirilmiş Kimlik"
 ETH_reintegrate_aussa:0 "Aussa'yı Entegre Et"
 ETH_reintegrate_aussa_desc:0 "Hain Aussa Sultanlığı, [ITA.GetAdjective]’lerin yanında yer alarak bize defalarca ihanet etti. Sultanlığı feshetme ve bölgeyi [ETH.GetName]'a entegre etme zamanı geldi."
 ETH_renewed_offensive:0 "Yenilenen Taarruz"
 ETH_renewed_offensive_desc:0 "İtalyanlar inisiyatifi yeniden kazanmaya çalışıyor olabilirler. Ama bu, kuvvetlerimiz tarafından bir saldırıya karşı hazırlıksız oldukları anlamına gelir. Sadece dayanmak yerine, savaşı onlara götürmeliyiz."
 ETH_renewed_offensive_tt:0 "Piyade Saldırısı §G+%10§!\nDüzensiz Piyade Saldırısı §G+%10§!\nTümen Savunması §R-%5§!"
 ETH_renewed_offensive_tt_1:0 "§Y$ETH_army_1_dynamic_modifier$§! değiştiricisini değiştirir:\n"
 ETH_replace_the_abuna:0 "[Get_ETH_replace_the_abuna_name]"
 ETH_replace_the_abuna_desc:0 "[Get_ETH_replace_the_abuna_desc]"
 ETH_replace_the_abuna_desc_ethiopia:0 "Ortodoks kilisesinin lideri $ETH_abuna_qerellos_iv$, $ETH_haile_selassie$ ile çok yakından ilişkilidir. Onu davamıza daha sadık biriyle değiştirmeliyiz."
 ETH_replace_the_abuna_desc_gojjam:0 "Ortodoks kilisesinin lideri $ETH_abuna_qerellos_iv$, $ETH_haile_selassie$ ile çok yakından ilişkilidir. $ETH_abuna_abraham$, onu değiştirmek için mükemmel bir adaydır, Gojjam'ı hem siyasi hem de dini olarak imparatorluğun merkezi yapar."
 ETH_replace_the_abuna_desc_jimma:0 "Çok uzun zamandır, Ortodoks Tewahedo Kilisesi bu ülkenin siyasetini etkiledi. İmparatorluk ile kilise arasındaki bağları resmi olarak kesme zamanı geldi. Bunun yerine dar denizin karşısındaki kardeşlerimizle daha yakın bağlar kurmalıyız."
 ETH_replace_the_abuna_original:0 "Abuna'yı Değiştir"
 ETH_request_embargo:0 "Ambargo Talep Et"
 ETH_request_embargo_desc:0 "[ITA.GetName] üzerindeki Ambargo, onlara hiç zarar vermeyen sadece sembolik bir ambargodur. Milletler Cemiyeti taleplerimizi dinlemeye hazır. İtalya'yı gerçekten incitecek, petrol ve çelik gibi her ikisi de savaş makineleri için gerekli olan artırılmış bir ambargo uygulaması için konseyi ikna etme çabalarımıza odaklanmalıyız."
 ETH_request_italian_equipment:0 "İtalyan Teçhizatı Talep Et"
 ETH_request_italian_equipment_desc:0 "Ekonomimizi reforme etmede ve ordumuzu güçlendirmede büyük ilerleme kaydederken, bu görevlerde hala biraz destekten faydalanabiliriz. [ITA.GetAdjective]'lerle derinleşen ilişkilerimiz nedeniyle, bize fazla teçhizatlarından bazılarını göndermeye açık olabilirler."
 ETH_request_italian_equipment_tt:0 "Eğer [ITA.GetFlag][ITA.GetName] kabul ederse, [ETH.GetFlag][ETH.GetName] ya §G500 $artillery_equipment$§! ya da §G2500 $infantry_equipment_1$ §! alacak!"
 ETH_request_soviet_hulls:0 "Sovyet Zırhlı Gövdeleri Talep Et"
 ETH_request_soviet_hulls_desc:0 "Gelecekteki çatışmalarda abluka altına alınmaktan kaçınmak istiyorsak, kendi gemilerimizi nasıl üreteceğimizi öğrenmeliyiz. [SOV.GetNameDefCap] yakın zamanda bazı zırhlı projelerini hurdaya çıkardı ve bitmemiş gövdeleri satın almamıza açık olabilir. Böyle bir satın alımdan çok şey öğrenebiliriz."
 ETH_restore_the_country:0 "Ülkeyi Geri Getir"
 ETH_restore_the_country_desc:0 "Nihayet [ETH.GetName]'a barış geri geldiğine göre, ulus genelinde düzeni yeniden kurma sürecine başlama zamanı geldi. Evleri ve altyapıyı eskisinden daha iyi yeniden inşa edeceğiz ve halkımıza [ETH.GetLeader] yönetimi altında parlak bir geleceğin beklediğini göstereceğiz."
 ETH_restore_the_empire_of_axum:0 "Aksum İmparatorluğunu Geri Getir"
 ETH_restore_the_empire_of_axum_desc:0 "Sudan topraklarından Arap yarımadasına kadar, bir zamanlar hepsi atalarımız tarafından kontrol ediliyordu. Egemenliğimiz yüzyıllar boyunca aşındırıldı ve bizi Avrupalıların kaprislerine karşı savunmasız bıraktı. Gidişatı tersine çevirme zamanı geldi. Aksum İmparatorluğunu yeniden kurarak ve atalarımızın topraklarını geri alarak mirasımızı kucaklayacağız."
 ETH_restore_the_empire_of_axum_tt:0 "Yeterli eyaleti kontrol ederken Aksum İmparatorluğunu kurmak için §Ykararın§! kilidini açar."
 ETH_sabotage_italo-german_relations:0 "İtalya-Almanya İlişkilerini Sabote Et"
 ETH_sabotage_italo-german_relations_desc:0 "[GER.GetNameDef] ve [ITA.GetName]'ın birbirini potansiyel müttefik olarak görmesine izin veremeyiz. İkisi arasındaki ilişkileri sabote etmek için elimizden gelen her şeyi yapmalıyız. Aksi takdirde, Majestelerinin [ITA.GetLeader]'ın bir mahkumu olduğunu ve özgür bir [ETH.GetName] hayalinin yok olduğunu görebiliriz."
 ETH_scavenger_random_generals_tt:0 "§YÜç§! rastgele seçilmiş ordu lideri §Y$scavenger$§! kazanacak: \n-$MODIFIER_EQUIPMENT_CAPTURE_FACTOR$: §G+%3§! "
 ETH_scavenging_tactics:0 "Toplayıcılık Taktikleri"
 ETH_scavenging_tactics_desc:0 "Sanayi tabanımızı genişletirken, birliklerimizi savaş alanında neyin yararlı ve kurtarılabilir olduğunu tespit etme konusunda eğitmeliyiz. Bu, kendi teçhizatımızı tutarlı bir şekilde üretip taşıyana kadar onları iyi bir şekilde tedarik etmede uzun bir yol kat edecektir."
 ETH_second_italo_ethiopian_war_flag:0 "İkinci İtalya-Etiyopya Savaşı"
 ETH_secure_arms:0 "Silahları Güvence Altına Al"
 ETH_secure_arms_desc:0 "[ETH.GetName]’in seyrek sanayisi, bir orduyu desteklemekten açıkça acizdir. İmparatorluk hazinesinin zenginliğini silah satın almak ve onları kahraman savaşçılarımıza derhal ulaştırmak için kullanmalıyız."
 ETH_secure_arms_tt:0 "İmparatorluk hazinesindeki fonları kullanarak askeri teçhizat satın alma §Ykararlarının§! kilidini açar"
 ETH_seek_new_trading_partners:0 "Yeni Ticaret Ortakları Ara"
 ETH_seek_new_trading_partners_desc:0 "Dünya genelindeki insanlar ülkemizin sunduğu zenginliklere gıpta ediyor, ancak biz sadece [SOV.GetAdjective]'lerle ticaret yapmakla sıkışıp kaldık. Sadece [SOV.GetName]'ın bir uzantısı olmadığımızı göstermek ve zenginliği [ETH.GetAdjective] halkına geri çekmeye başlamak için diğer uluslara ulaşmalıyız."
 ETH_seize_assets_default_desc:0 "[ETH.GetName]'daki en zengin insanlardan bazıları olarak, soyluların arkaik yasalar ve boşluklar aracılığıyla vergilerini ödemekten kaçınmaları pek ekonomik bir anlam ifade etmiyor. Soyluları düzgün bir şekilde vergilendirmeli ve geliri imparatorluğun daha fazla sanayileşmesi için kullanmalıyız."
 ETH_seize_assets_default_title:0 "Soyluları Vergilendirme"
 ETH_seize_the_means:0 "Üretim Araçlarına El Koy"
 ETH_seize_the_means_desc:0 "[ETH.GetAdjective] işçileri nesillerdir tarlaları sürdü ve şehirlerin sanayisini inşa etti. Onların kanı topraktadır. Bu nedenle, artık zengin bir zümrenin bu varlıklar üzerinde mülkiyet iddia etmesine izin vermeyeceğiz. Onlar halka geri verilecektir."
 ETH_selassie_left_flag:0 "$ETH_haile_selassie$ Etiyopya'yı terk etti"
 ETH_send_home_advisors:0 "Danışmanları Eve Gönder"
 ETH_send_home_advisors_desc:0 "[ITA.GetName] ile savaş sırasında [SOV.GetName]’in desteğinden faydalanmış olsak da, bizi onlara bu kadar bağımlı bir role zorlamalarını asla beklemiyorduk. Kendi sanayi ve askeri kapasitemizi inşa ederken, [SOV.GetAdjective] taleplerine direnme gücümüz giderek artıyor. Bu nedenle, [ETH.Capital.GetCapitalVictoryPointName]'da kimin sorumlu olduğunu açıkça belirtme zamanı geldi."
 ETH_send_home_advisors_tt:0 "Tüm [SOV.GetAdjective] askeri danışmanlarını [SOV.GetNameDef]'e geri gönder."
 ETH_set_up_a_customs_barrier:0 "Bir Gümrük Bariyeri Kur"
 ETH_set_up_a_customs_barrier_desc:0 "Ekonomimizin [ITA.GetName]’inkiyle ne kadar uzun süre iç içe geçmesine izin verirsek, onların yozlaştırıcı etkisinden kurtulmak o kadar zor olacaktır. Ekonomik büyümemizi yavaşlatacak olsa da, uluslarımız arasındaki ticareti zorlaştırmak için bir gümrük bariyeri uygulamalıyız. [ITA.GetAdjective] rejimi buna kızacaktır, ama gerekirse bir ekonomik gerekçe buluruz."
 ETH_seyoum_mengesha_upgrade_tt:0 "Kazanır: \n§Y$army_regrouping_2$§!"
 ETH_shipbuilding_bonus:0 "[ETH.GetAdjective] Gemi İnşaatı"
 ETH_soviet-ethiopian_trade_agreement:0 "Sovyet-Etiyopya Ticaret Anlaşması"
 ETH_soviet-ethiopian_trade_agreement_desc:0 "Dünya genelinde birçok kişi, işçi cumhuriyetimize yönelik ideolojik muhalefet nedeniyle bizimle ticaret yapmaktan çekiniyor. Ancak, [SOV.GetAdjective]'lerle karşılıklı yarar sağlayan bir ticaret anlaşması yaratma fırsatımız var, bu da kaynakları ve malları olağan ticaret engelleri olmadan değiştirmemize olanak tanır."
 ETH_soviet_aid:0 "Sovyet Yardımı"
 ETH_soviet_aid_desc:0 "Feodal bağlılığın zincirlerini başarıyla kırdık. Şimdi faşistleri yenmeli ve işçi cumhuriyetimizi yaratmaya başlamalıyız. Eğer davamıza sempati duyacak biri varsa, bu kesinlikle [SOV.Getname]'ın halkı olacaktır."
 ETH_soviet_aid_tt:0 "§R\n[SOV.GetNameDefCap], yardım karşılığında işlerimizde daha fazla kontrol bekleyecektir! §!"
 ETH_soviet_mediation:0 "Sovyet Arabuluculuğu"
 ETH_soviet_mediation_desc:0 "Halkımızın [ITA.GetAdjective] istilasını durdurmadaki kahramanca çabalarına rağmen, onlara karşı tam bir zafer elde etmekten çok uzağız. Milletler Cemiyeti bize yardım etme konusundaki isteksizliğini gösterdi, bu nedenle tek umudumuz [SOV.GetNameDefCap]."
 ETH_soviet_mediation_tt:0 "§R\n[SOV.GetNameDefCap], [ITA.GetName] ile müzakere karşılığında bizi kontrol altına almaya çalışabilir! §!"
 ETH_soviet_rejection_tt:0 "\n[SOV.GetFlag]§Y[SOV.GetNameDefCap]§!, §Reğer artık komünist değillerse veya bir iç savaş yaşıyorlarsa bu teklifi muhtemelen reddedecektir!§!"
 ETH_soviet_rifles:0 "Sovyet Tüfekleri"
 ETH_soviet_rifles_desc:0 "[ITA.GetName] bize saldırdığında çok hazırlıksızdık. Şimdi sanayimiz modern savaşın lojistik taleplerine ayak uyduramıyor. Tutabilen her insanın elinde tüfeklere ve mühimmata ihtiyacımız var. Belki [SOV.Capital.GetCapitalVictoryPointName]'daki dostlarımız yardımcı olabilir."
 ETH_soviet_rifles_tt:0 "\nEğer [SOV.GetFlag]§Y[SOV.GetName]§! kabul ederse, [ETH.GetFlag]§Y[ETH.GetName]§! §G10,000§! piyade teçhizatı alacak."
 ETH_state_owned_industry:0 "Devlet Teşebbüsü"
 ETH_state_owned_industry_desc:0 "Dünyanın büyük güçlerinden açıkça görebiliriz, serbest piyasaya müdahale etmeye istekli olan hükûmetler, üretimi kontrol ederek ve işsizliği azaltarak muazzam ekonomik kazançlar görüyorlar. Onların yolunu takip edeceğiz ve ekonomimizi devlet teşebbüsleri aracılığıyla hızla genişleteceğiz."
 ETH_state_owned_industry_tt:0 "§Y$ETH_state_development_dynamic_modifier$§! değiştiricisini şununla değiştir:\n$MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+%20§!\n$MODIFIER_LOCAL_BUILDING_SLOTS$: §G+%20§!"
 ETH_steel_lions:0 "Çelik Aslanlar"
 ETH_steel_lions_desc:0 "[GER.GetNameDefCap], savaş yürütmenin yeni yöntemlerine öncülük ediyor. Süvari veya siper savaşı günleri geride kaldı. Gelecek tanka aittir. [GER.GetNameDef]'deki zamanımızı modern savaş silahlarını nasıl kullanacağımızı öğrenmek ve anavatanımızın kurtuluşuna hazırlanmak için kullanmalıyız."
 ETH_strengthen_the_black_lions:0 "Kara Aslanları Güçlendir"
 ETH_strengthen_the_black_lions_desc:0 "Düşmana toprak kaybetmiş olsak da mücadele devam etmeli. Kara Aslanlar, İtalyanlara karşı büyük bir direniş gösteriyor ve bu yüzden onlara elimizden gelen her şekilde destek olmalıyız."
 ETH_sudanese_mercs_tt:0 "§G4 Tümen§! §YSudanlı Paralı Asker§! topla!"
 ETH_support_anti-colonialist_resistance:0 "Anti-Sömürgeci Direnişi Destekle"
 ETH_support_anti-colonialist_resistance_desc:0 "Eğer sömürgeci güçler Doğu Afrika'daki tutunmalarını sürdürürlerse, çatışma tehdidi süresiz olarak üzerimizde asılı kalacaktır. Kitleleri harekete geçirerek ve onlara bağımsızlıklarını yeniden kazanma imkanı vererek onları bölgeden atmalıyız."
 ETH_support_anti-colonialist_resistance_tt:0 "§YDoğu Afrika§!'daki sömürge eyaletlerinde direnişi artırmak için §Ykararların§! kilidini açar."
 ETH_support_from_the_japanese_communists:0 "Japon Anarko-Komünizmi"
 ETH_support_from_the_japanese_communists_desc:0 "[JAP.GetAdjective] ve [ETH.GetAdjective] halkı, Avrupa sömürgeciliğine başarılı bir şekilde direnen birkaç kişiden biri olarak birbirlerine uzun süredir saygı duymaktadır. [ETH.GetNameDef]'de feodal dönemin ötesine geçerken, [JAP.GetNameDef]'de ideallerimizi paylaşan ve model bir anarko-komünist toplum yaratmamıza yardımcı olabilecekler var."
 ETH_support_from_the_japanese_communists_fascist_tt:0 "§R[JAP.GetFlag][JAP.GetName]'ın [ETH.GetFlag][ETH.GetName]'a karşı bir ticaret ambargosu yayınlamasına yol açabilir!§!"
 ETH_support_from_the_japanese_communists_tt:0 "§Y$IA_sakutaro_iwasa$§! ve §Y$IA_sanshiro_ishikawa$§! danışman olarak mevcut olur."
 ETH_support_spain:0 "İspanya'yı Destekle"
 ETH_support_spain_desc:0 "İspanya, yerli faşistlerin elinde acı çekti. Ancak, bizim gibi düşünenler var; faşizmin sert bir direnişle karşılanması ve halkın kendi kendini yönetebilmesi gerektiğine inananlar. [ITA.GetAdjective]'lerle olan savaşımızda öğrendiğimiz dersleri, [SPC.GetAdjective] direnişine yardım etmek için kullanacağız."
 ETH_support_spain_static_modifier:0 "İspanya'yı Destekle"
 ETH_supporting_the_arbegnoch:0 "Arbegnoch'u Destekleme"
 ETH_supporting_the_arbegnoch_desc:0 "[ROOT.GetName] genelinde [ITA.GetAdjective] işgalcilerine karşı silahlanmaya istekli vatanseverler var. Bu cesur erkek ve kadınları, [ITA.GetAdjective] savaş makinesini felce uğratmada desteklemek için elimizden gelen her şeyi yapmalıyız."
 ETH_sway_the_warlords:0 "Savaş Ağalarını Etkile"
 ETH_sway_the_warlords_desc:0 "Daha güçlü Ras'lardan herhangi birini $ETH_haile_selassie$'ye karşı açıkça ilan etmeye ikna edemesek bile, en azından gelecekteki işbirliği için bir tohum ekebiliriz. Ayrıca, İtalyanlara karşı değil de onlarla çalışmanın faydaları konusunda daha küçük savaş ağalarından bazılarını ikna etmeye çalışmalıyız."
 ETH_sway_the_warlords_tt:0 "Ayaklanmanın boyutunu artırır. \nSadık generallerden bazıları savaştan sonra askere alınmak için mevcut olacak."
 ETH_tactical_training:0 "Standartlaştırılmış Taktik Eğitim"
 ETH_tactical_training_desc:0 "Silahlı kuvvetlerimizin aldığı eğitim çok sık tutarsız ve güncelliğini yitirmiştir. Savaş alanında daha etkili olmaları için tüm birliklerimizin aldığı taktik eğitimi standartlaştırmalıyız."
 ETH_tactical_training_tt:0 "§Y[GetEthiopianArmySpiritName]§! değiştiricisini şununla değiştir:\n$MODIFIERS_ARMY_DEFENCE_FACTOR$: §G+%10§! "
 ETH_tax_exemption_default_desc:0 "[ETH.GetName]'ın parçalanmasını önlemek için soyluları memnun tutmalıyız. Bu nedenle, vergi muafiyetlerini genişleterek ve servetlerinin daha fazlasını ellerinde tutmalarına izin vererek devam eden sadakatleri için onları ödüllendireceğiz."
 ETH_tax_exemption_default_title:0 "Vergi Muafiyetlerini Genişlet"
 ETH_taxing_the_nobility:0 "[ETH_GetSeizeAssetsTitle]"
 ETH_taxing_the_nobility_desc:0 "[ETH_GetTaxNobilityDesc]"
 ETH_the_abuna:0 "Abuna"
 ETH_the_abuna_desc:0 "[ITA.GetAdjective] işgalcilerine direnmek sadece İmparator'a sadakat meselesi değil, aynı zamanda bir ahlak meselesidir. $ETH_abuna_qerellos_iv$ ile istişare ederek, halka davamızın haklılığını ve tanrımızın adına görevlerini yapma gerekliliğini gösterebiliriz."
 ETH_the_african_union:0 "Afrika Birliğine Doğru"
 ETH_the_african_union_desc:0 "Sömürgeciliğe son verilmesini talep ediyoruz çünkü bir halkın diğeri tarafından tahakküm altına alınması yanlıştır. Görüşlerimize gereken ağırlığın verilmesi için tüm Afrikalıların ortak sorunlar üzerinde koordineli eylemi zorunludur. Bu nedenle, en derin inançlarımızın bütünlüğü ve mahkumiyetiyle hareket ederek, tüm Afrika kıtasının kurtuluşu için savaşacağız."
 ETH_the_american_radio_address:0 "Amerikan Radyo Konuşması"
 ETH_the_american_radio_address_desc:0 "Milletler Cemiyeti yasaları, saldırganlık eylemleri tekrar tekrar gerçekleştiği için sürekli ihlal ediliyor. Lanetlilerin ruhunun insan ırkı üzerinde egemenlik kazanmaması için, tüm barışsever insanlar, yasallığı ve barışı korumak için sağlam durabilmek üzere işbirliği yapmalıdır."
 ETH_the_capital_victory_parade:0 "[ROOT.Capital.GetCapitalVictoryPointName] Zafer Geçidi"
 ETH_the_capital_victory_parade_desc:0 "Büyük liderimiz bizi kesin bir yıkımdan kurtarmasına rağmen, halkımızın birçoğu [ETH.GetLeader]’in güdülerinden şüpheleniyor ve eski imparatorluk ailesinin günlerini özlüyor. Onlara [ETH.GetLeader]'a ne kadar minnettar olmaları gerektiğini hatırlatmalı ve [ETH.GetName]'ı bekleyen şanlı geleceği göstermeliyiz."
 ETH_the_common_soldier:0 "Sıradan Asker"
 ETH_the_common_soldier_desc:0 "Bir ordu, ödül veya tanınma beklentisi olmadan her gün hayatlarını tehlikeye atan sıradan askerler olmadan bir hiçtir. Bu kahramanlar, kolektif güvenliğimize katkılarından dolayı saygı görmelidir."
 ETH_the_defense_of_addis_ababa:0 "Addis Ababa Savunması"
 ETH_the_defense_of_addis_ababa_desc:0 "Addis Ababa tarihi Başkenttir. Aynı zamanda Etiyopya'nın sanayi merkezidir. Eğer şehir düşerse, davamız kaybedilir. Şehri tutmak için elimizden gelen her şeyi yapmalıyız."
 ETH_the_defense_of_addis_ababa_tt_1:0 "§Y$VICTORY_POINTS_5010$§!:\n"
 ETH_the_defense_of_addis_ababa_tt_2:0 "§Y$VICTORY_POINTS_8036$§!:\n"
 ETH_the_emperor_stays:0 "İmparator Kalıyor"
 ETH_the_emperor_stays_desc:0 "Danışmanların yalvarmalarına rağmen, Majesteleri [ETH.GetLeader], [ETH.GetName]'da kalmaya ve cesur savaşçılarının yanında savaşmaya devam etme kahramanca kararını verdi. Umarım İmparatorluğun en karanlık saatinde bize zafer getirebilir."
 ETH_the_ethiopian_air_force:0 "[ROOT.GetAdjective] Hava Kuvvetleri"
 ETH_the_ethiopian_air_force_desc:0 "İster savaş alanında birlikleri desteklemek olsun, ister düşman altyapısının yok edilmesi olsun, uçak paha biçilmez bir varlık olduğunu kanıtlıyor. Halkımızı korumak ve düşmanlarımızı yok etmek istiyorsak kendi hava kuvvetlerimizi kurmalıyız."
 ETH_the_ethiopian_air_force_tt:0 "§Y$air_force_command_spirit$§!'nin kilidini açar!"
 ETH_the_ferengi:0 "Ferengi"
 ETH_the_ferengi_desc:0 "Milletler Cemiyeti yardım çığlıklarımıza yavaş yanıt verirken, davamız için savaşmaya istekli bireysel yabancı sıkıntısı yoktur. Yeter ki onlara bunun için ödeme yapalım."
 ETH_the_ferengi_tt:0 "İmparatorluk hazinesindeki fonları kullanarak paralı asker toplama §Ykararlarının§! kilidini açar."
 ETH_the_fetno-derash:0 "Fetno-Derash"
 ETH_the_fetno-derash_desc:0 "İstihbarat çalışması, sadece savaş alanında değil, aynı zamanda siyasi liderliğimizin güvenliğini sürdürmede de giderek belirleyici bir faktör haline geliyor. Bu nedenle, güvenliğimizi sürdürmek ve düşmanlarımızı daha iyi anlamak için özel bir istihbarat teşkilatı kuracağız."
 ETH_the_heir_of_solomon:0 "Süleyman'ın Varisi"
 ETH_the_heir_of_solomon_desc:0 "[ENG.GetName], Filistin'de bir gerilim barut fıçısı yarattı ve bu da Milletler Cemiyeti yönetim yetkilerine olan desteğin çökmesine yol açtı. Belki de bölgenin yönetimini başka birine devretmeye açık olurlardı? Ve görev için Süleyman'ın varisi [ETH.GetLeader]'dan daha uygun kim olabilir."
 ETH_the_heroes_of_ethiopia:0 "Etiyopya Kahramanları"
 ETH_the_heroes_of_ethiopia_desc:0 "Askeri liderlerimizin birçoğu kendilerini mükemmel stratejistler olarak kanıtladı. Düşmanın ezici maddi avantajına rağmen, askeri liderlerimiz ilerlemelerini durma noktasına getirdi. Bu kahramanları [ETH.GetNameDef]’in devam eden hayatta kalmasına katkılarından dolayı ödüllendirmeliyiz."
 ETH_the_heroes_of_ethiopia_tt:0 "\n§Y$ETH_army_1_dynamic_modifier$§! değiştiricisini değiştirir:\n$modifier_army_sub_unit_irregular_infantry_attack_factor$: §G+%5§!\n$modifier_army_sub_unit_irregular_infantry_speed_factor$: §G+%5§!"
 ETH_the_hindenburg_wall:0 "Hindenburg Duvarı"
 ETH_the_hindenburg_wall_desc:0 "Türk danışmanımız $ETH_wehib_pasha$, Harar ve Dire Dawa şehirleri etrafında geçen savaştaki Almanlarınkine eşit tahkimatlar inşa etmek istiyor. Bölgeyi elinde tutmak, İtalyanların cephelerini birleştirememesini sağlayacak ve Cibuti'deki liman aracılığıyla denize erişimimizi güvence altına alacaktır."
 ETH_the_hindenburg_wall_tt_1:0 "§Y$VICTORY_POINTS_7980$§!:\n"
 ETH_the_hindenburg_wall_tt_2:0 "§Y$VICTORY_POINTS_13249$§!:\n"
 ETH_the_italian_language:0 "İtalyan Dili"
 ETH_the_italian_language_desc:0 "Dil, [ITA.GetAdjective]'lerle daha derin bir işbirliğinin önündeki en büyük engellerden biri olmaya devam ediyor. Bu nedenle, yönetimimiz genelinde, ordu da dahil olmak üzere, ikinci bir dil olarak [ITA.GetAdjective]'yi benimseyeceğiz. Umarım bu, aramızdaki kültürel alışverişi hızlandırır ve stratejik planlamayı daha verimli hale getirir."
 ETH_the_italo-ethiopian_empire:0 "İtalya-[ETH.GetAdjective] İmparatorluğu"
 ETH_the_italo-ethiopian_empire_desc:0 "Eski imparatorluğun küllerinden yükselirken, yeni bir İtalya-[ETH.GetAdjective] imparatorluğu şekillenmeye başlıyor. Sadece yakın zamanda birbirimize karşı savaşıyor olsak da, hem [ITA.GetName] hem de [ETH.GetName]'ın şimdi birlikte daha güçlü olduğu giderek daha açık hale geliyor. Şimdi görevimiz, ortak imparatorluğumuzun alanını genişletmektir."
 ETH_the_italo-ethiopian_empire_tt:0 "Talep edilen topraklarda ele geçirildikten sonra çekirdek kazanmak için §Yİtalya-[ETH.GetAdjective] İmparatorluğu§! kararlarının kilidini açar.\nTalep edilen eyalette veya bitişik eyaletlerde düşman tümeni yoksa devredilecektir"
 ETH_the_junior_officer_corps:0 "Astsubay Kolordusu"
 ETH_the_junior_officer_corps_desc:0 "Silahlı kuvvetler yüzyıllardır aristokratlar tarafından domine edildi. Onları savaş alanında daha etkili hale getirmek istiyorsak, kayırmacılık yerine liyakati teşvik eden subay okulları ve eğitim programları kurmalıyız. Buna doğru bir atlama taşı, bir astsubay kolordusu kurulması olacaktır."
 ETH_the_king_of_kings:0 "Krallar Kralı"
 ETH_the_king_of_kings_desc:0 "Majesteleri [ETH.GetLeader], bizi [ITA.GetAdjective]'lerin hizmetkarı olma aşağılayıcı kaderinden kurtardı. O, modern dünyada eşi benzeri olmayan bir liderdir ve öyle saygı görmelidir."
 ETH_the_lessons_of_war:0 "Savaşın Dersleri"
 ETH_the_lessons_of_war_desc:0 "Kimse bir savaş alanının baskılarıyla nasıl başa çıkacağını bilemez, bir imparatorluğun veya ulusun nasıl başa çıkacağını ise hiç bilemez. Modern savaşın streslerine hazırlıksız olsak da, ordumuz savaşın zor derslerini öğrendi ve bunun için daha da güçlendi."
 ETH_the_lessons_of_war_tt:0 "§Y[GetEthiopianArmySpiritName]§! değiştiricisini şununla değiştir:\n$MODIFIERS_ARMY_DEFENCE_FACTOR$: §G+%10§! \n$MODIFIER_MAX_DIG_IN$: §G+2§!\n$MODIFIER_DIG_IN_SPEED_FACTOR$: §G+%10§!"
 ETH_the_liberator_of_country_short:0 "[Get_ETH_the_liberator_of_country_short_name]"
 ETH_the_liberator_of_country_short_desc:0 "[ETH.GetLeader] bizi kahramanca bağımsızlığa, [ITA.GetName]'ın yozlaştırıcı etkisinden arınmış bir şekilde götürdü. Geleceğin ne getireceğini bilmiyoruz, ama [ETH.GetName]'ın kurtarıcısı bizi ona yönlendirdiği sürece şanlı olacağını biliyoruz."
 ETH_the_liberator_of_ethiopia:0 "$ETH$'nin Kurtarıcısı"
 ETH_the_liberator_of_gojjam:0 "$gojjam$'ın Kurtarıcısı"
 ETH_the_liberator_of_jimma:0 "$jimma$'nın Kurtarıcısı"
 ETH_the_lion_and_the_sun:0 "Aslan ve Güneş"
 ETH_the_lion_and_the_sun_desc:0 "Majesteleri [ETH.GetLeader] ve Japon İmparatoru [JAP.GetLeader], büyük imparatorluklarımız arasında birçok ortak zemin bulmayı başardılar. [JAP.GetLeader], eninde sonunda anavatanımızı geri aldığımızda hükûmetinin [ETH.GetName]'a yatırım yapacağını önerecek kadar ileri gitti."
 ETH_the_lion_stands_firm:0 "Aslan Sağlam Duruyor"
 ETH_the_lion_stands_firm_desc:0 "Yahuda Kabilesi'nin Fatih Aslanı tarafından, İmparatorluk Majesteleri [ETH.GetLeader]'in yetenekli bir savaşçı olduğu kanıtlanmıştır. Onlara İmparatorlarının gücünü yanlarında savaşırken göstererek ve [ITA.GetAdjective] savaş makinesinin yenilebileceğini göstererek birlikleri toplamalıyız."
 ETH_the_lion_stands_firm_tt:0 "\n§Y$ETH_army_1_dynamic_modifier$§! değiştiricisini değiştirir:\n$modifier_army_sub_unit_irregular_infantry_max_org_factor$: §G+%5§!"
 ETH_the_new_administration:0 "Yeni Yönetim"
 ETH_the_new_administration_desc:0 "Son kargaşanın ortasında, birçoğu ülkemizi savunmak için fazlasıyla çabaladı. Senedu Gebru gibi bazıları, toplumu kökten iyileştirecek becerilere ve bilgiye de sahiptir. Şimdi, onlara bunu yapma fırsatı vereceğiz."
 ETH_the_new_administration_tt:0 "§YSenedu Gebru§! bir siyasi danışman olarak mevcut olur.\n   $rebellious_educator_tt$ \nİki §Yrastgele§! karakter de siyasi danışman olarak mevcut olacak."
 ETH_the_one_true_heir_of_solomon:0 "Süleyman'ın Tek Gerçek Varisi"
 ETH_the_one_true_heir_of_solomon_desc:0 "Majesteleri [ETH.GetLeader], kraliyet soyunu büyük Kral Süleyman'a kadar takip edebilir. Birçok ulus Tanrı'ya sırtını dönmüşken, biz [ETH.GetAdjective]lar inancımızda kararlı kaldık. Bu kaos çağında, Süleyman'ın tek gerçek varisinin kutsal topraklarda, onu insan yapımı ideolojilerin yozlaştırıcı etkisinden korumak için hüküm sürmesi sadece doğrudur."
 ETH_the_one_true_heir_of_solomon_tt:0 "Süleyman İmparatorluğunu kurmak için §Ykararın§! kilidini açar"
 ETH_the_patriots:0 "Vatanseverler"
 ETH_the_patriots_desc:0 "Gojjam vatanseverleri [ETH.GetName]’in bölge için imparatorluk hükûmetinin planlarına bir engel olsa da, şimdi [ITA.GetAdjective]ların bölgeyi hiç yönetmesini engelleyerek bize yardım ediyorlar. Vatanseverlere, ülkede bir tutunma noktası tutmak ve [ITA.GetAdjective]ların çok rahat etmesini engellemek için elimizden geleni yapmalıyız."
 ETH_the_patriots_tt:0 "§Y$ETH_supporting_the_arbegnoch$§! sürekli odağının kilidini açar.\nKuzey ve Orta Etiyopya'daki düşman işgali altındaki eyaletlere §G+10§! direniş hedefi ekler."
 ETH_the_rif:0 "Rif"
 ETH_the_rif_desc:0 "Şimdi İspanya'da iktidar için yarışan faşistlerin birçoğu, bir zamanlar Kuzey Fas'taki Rif Cumhuriyeti'ni ezen askerlerdi. [SPC.GetName] ile olan yakın bağlarımızı, Afrika'daki sömürgelerinin sömürgesizleştirilmesi için bastırmak üzere kullanmalıyız. Eğer gerçekten yoldaşlarımızsalar, kesinlikle kabul edeceklerdir. Ve değilseler, sömürgecilikle nasıl başa çıkılacağını zaten biliyoruz."
 ETH_the_second_italo-ethiopian_war:0 "İkinci İtalya-Etiyopya Savaşı"
 ETH_the_second_italo-ethiopian_war_desc:0 "Noel Taarruzu bize umduğumuz ve ihtiyaç duyduğumuz zaferi getirmedi. [ETH.GetLeader]'ın başkenti terk edip orduların kişisel komutasını alma zamanı geldi. İtalyanlara karşı savaş sona erdirilmelidir!"
 ETH_the_second_italo-ethiopian_war_tt:0 "§Y$ETH_haile_selassie$§! bir Mareşal olarak mevcut olur"
 ETH_the_state_bank_of_ethiopia:0 "[ETH.GetNonIdeologyName] Devlet Bankası"
 ETH_the_state_bank_of_ethiopia_desc:0 "[ETH.GetName] Devlet Bankası'nın kaynaklarını genişleterek, halka yeni bir kredi limiti verebilir ve hasta [ETH.GetAdjective] ekonomisi için bir finansal idrar söktürücü görevi görebiliriz."
 ETH_the_state_bank_of_ethiopia_tt:0 "§Y$ETH_corrupt_bureaucracy_dynamic_modifier$§! değiştiricisini şununla değiştir:\n$MODIFIER_RESEARCH_SPEED_FACTOR$: §G+%5§!\n$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+%5§!"
 ETH_the_state_court:0 "Devlet Mahkemesi"
 ETH_the_state_court_desc:0 "[ETH.GetName]’in hukuk sistemi, yüzyıllar öncesine dayanan arkaik uygulamalara dayanmaktadır. Son reform dalgamızla, şimdi yasaların daha fazlasını anayasaya uygun olarak kodlama ve ulusal öneme sahip davaları dinlemek için modern bir devlet mahkemesi kurma zamanı geldi."
 ETH_the_state_court_tt:0 "§Y$ETH_corrupt_bureaucracy_dynamic_modifier$§! değiştiricisini şununla değiştir:\n$MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY$: §G+%5§!\n$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+%10§!\n$MODIFIER_RESEARCH_SPEED_FACTOR$: §G+%10§!"
 ETH_together_for_victory:0 "Zafer için Birlikte"
 ETH_together_for_victory_desc:0 "Onurumuzu geri kazanma ve İtalyan baskısının zincirlerini kırma zamanı yaklaşıyor. Planlarımızın başarısız olmamasını sağlamak için, kuvvetlerimizi desteklemeli ve Doğu Afrika'nın dört bir yanından destek kazanmalıyız. Zafer ancak birlikte sağlanacaktır."
 ETH_together_for_victory_tt:0 "Bağımsızlık savaşı başladığında isyancı savaşçılar düşman hatlarının gerisinde ayaklanacak"
 ETH_transformation_of_nature:0 "Doğanın Dönüşümü"
 ETH_transformation_of_nature_desc:0 "[ETH.GetNameDefCap], sadece çıkarılmayı bekleyen zengin doğal kaynaklara sahiptir. Nehirlerimiz üzerinde hidroelektrik barajları oluşturarak, ülkedeki her eve elektrik getirebiliriz. Aynı zamanda, artan nüfusu desteklemek için tarımsal kapasitemizi genişletmek üzere su yollarımızı kullanabiliriz."
 ETH_transformation_of_nature_tt:0 "(§Y4 Rastgele Seçilmiş Sahip Olunan Eyalet§!): §G1§! İnşaat Alanı ekle"
 ETH_uk_arabia_tt:0 "Herhangi bir §YArap§! eyaleti §Y[ENG.GetNameWithFlag]§! veya §Y[ENG.GetNameDef]§!'nin bir §Ymüttefiki§! tarafından sahipleniliyor!"
 ETH_underground_wargames:0 "Yeraltı Savaş Oyunları"
 ETH_underground_wargames_desc:0 "Son savaşta [ITA.GetAdjective]'leri püskürtmekte zorlandık, çünkü savaşın son on yıllarda ne kadar değiştiğini anlamıyorduk. Aynı hatayı tekrar yapmamamız için, subaylarımızın savaş oyunları yapmaya başlaması ve [ITA.GetAdjective] kuvvetlerinin devrilmesini planlaması zorunludur. Elbette bunu yaparken şüphe uyandırmaktan kaçınmalıyız..."
 ETH_unification_of_the_habesha:0 "Habeşlerin Birleşmesi"
 ETH_unification_of_the_habesha_desc:0 "[ITA.GetName] ile olan savaş, altyapımıza hayal edilemez zararlar verdi ve halkımız için sıkıntıya neden oldu. Sadece anavatanımızı geri kazanmak artık yeterli değil. Habeş halklarını birleştirmemize olanak tanıyan toprak tavizleri de dahil olmak üzere [ITA.GetAdjective]'lerden tazminat talep ediyoruz."
 ETH_unite_the_afar:0 "Afar'ı Birleştir"
 ETH_unite_the_afar_desc:0 "Avrupa'nın odağı kendi kıtasına kayarken, [DJI.GetName] bölgesini satın alarak ve on yıllarca süren ayrılıktan sonra Afar halkını yeniden birleştirerek Kuzey'deki Afar halkının desteğini kazanmak mümkün olabilir."
 ETH_university_bonus:0 "[ROOT.Capital.GetCapitalVictoryPointName] Üniversitesi Elektronik Araştırması"
 ETH_university_of_capital:0 "[ROOT.Capital.GetCapitalVictoryPointName] Üniversitesi"
 ETH_university_of_capital_desc:0 "Birliklerin vahşiliği bir zamanlar bir savaşın seyrini belirlerdi. Şimdi savaşlar, askerlerin birbirini görmeden bile büyük mesafeler üzerinden yapılabiliyor. Savaşmak için yeni teknolojiler geliştirmek ve bunun için araçlar üretmek üzere öğrenim kurumlarına yatırım yapmalıyız."
 ETH_university_of_capital_tt:0 "§Y$ETH_corrupt_bureaucracy_dynamic_modifier$§! değiştiricisini şununla değiştir:\n$MODIFIER_RESEARCH_SPEED_FACTOR$: §G+%5§! "
 ETH_unlock_academy_tt:0 "§Y$academy_spirit$§!'nin kilidini açar!"
 ETH_unlock_black_lions_tt:0 "§Y$ETH_strengthen_the_black_lions$§! sürekli odağının kilidini açar.\nGüney Etiyopya'daki düşman işgali altındaki eyaletlere §G+10§! direniş hedefi ekler."
 ETH_unlock_false_flag_tt:0 "[ITA.GetFlag] §Y[ITA.GetName]§!'ı suçlamak için bir sahte bayrak operasyonu başlatma kararının kilidini açar!"
 ETH_unlock_spirit_airforce_tt:0 "§Y$air_force_spirit$§!'nin kilidini açar!"
 ETH_victory_in_the_desert:0 "Çölde Zafer"
 ETH_victory_in_the_desert_desc:0 "Ogaden, İtalyan cephesinin en zayıf kısmıdır. Onları orada yenmek için çabalarımızı odaklamalı ve ardından güneydeki limanlarını ele geçirerek devam etmeliyiz. Bu, arkamızı serbest bırakacak ve o zaman Eritre'ye ilerlememize izin verecektir."
 ETH_volunteers:0 "Gönüllüler"
 ETH_volunteers_desc:0 "Dünya genelinde, ezilen halklar [ETH.GetName]'ı ezici emperyalist saldırganlığa karşı mücadelede bir umut sembolü olarak görüyor. Şimdi, sınırlarımızın ötesinden insanlar yanımızda savaşmak için [ETH.GetAdjective] sancakları altında toplanmaya başladı. Görünüşe göre, özgürlük hayalinin [ITA.GetLeader]'ın hevesleri uğruna sönmesini görmek istemeyenler hala var."
 GER_chancellor_title:0 "Şansölye"
 GER_fascism_leader_title:0 "Führer"
 GER_female_kaiser_title:0 "Kayzerin"
 GER_generalfeldmarshall_title:0 "Generalfeldmarshall"
 GER_male_kaiser_title:0 "Kayzer"
 HOA_a_jagged_alliance:0 "Pürüzlü bir İttifak"
 HOA_a_jagged_alliance_desc:0 "Diğer uluslarla her zaman aynı fikirde olmasak da, sık sık aynı tehditlerle karşı karşıya kalırız. Bu ortak sorunlara odaklanmak, uzun süreli ittifakların ve artan ulusal güvenliğin temeli olabilir."
 HOA_a_loyal_subject:0 "Sadık bir Bağlı Devlet"
 HOA_a_loyal_subject_desc:0 "Dünya sahnesindeki durum giderek daha istikrarsız hale geldikçe, belki de daha güçlü bir ulusun koruması altında olmak daha iyidir. En azından şimdilik..."
 HOA_a_steamboat_fleet:0 "Bir Buharlı Gemi Filosu"
 HOA_a_steamboat_fleet_desc:0 "Kıyı şeridimizi ve nakliye yollarımızı savunmak için, herhangi bir yabancı saldırganlığı caydırabilecek bir kıyı gemileri filosu oluşturmalıyız."
 HOA_commandos:0 "Komandolar"
 HOA_commandos_desc:0 "Bazen savaşta, küçük ama iyi eğitimli bir asker grubu, en büyük orduların savaş alanında başarabileceğinden daha büyük zaferleri düşman hatlarının gerisinde başarabilir."
 HOA_construct_great_monuments:0 "Büyük Anıtlar İnşa Et"
 HOA_construct_great_monuments_desc:0 "[ROOT.GetAdjective] halkının gurur duyacağı çok şey var. Daha da büyük zirvelere ulaşma çabasını ilham veren anıtlarla anılması gereken uzun bir tarihimiz var."
 HOA_control_ethiopia_tt:0 "Tüm Etiyopya Topraklarını Kontrol Eder"
 HOA_countryadjective_loyalist_advisors:0 "[ROOT.GetAdjective] Sadık Danışmanlar"
 HOA_countryadjective_loyalist_advisors_desc:0 "Ulusumuzun ve kültürümüzün emperyalistler tarafından yutulmasına izin veremeyiz. [ROOT.GetNameDef]'e sadık olanları yetki pozisyonlarına getirmeli ve özgürlüğümüzü yeniden kazanma sürecini başlatmalıyız."
 HOA_countryleader:0 "[ROOT.GetLeader]"
 HOA_countryleader_desc:0 "[ROOT.GetLeader], bu zor zamanlarda ulusu bir arada tutabilecek tek kişidir, bu nedenle halk [ROOT.GetLeader.GetHerHim]'in arkasında toplanmalıdır."
 HOA_crowning_of_the_negusa_nagast:0 "Negusa Nagast'ın Taç Giymesi"
 HOA_crowning_of_the_negusa_nagast_desc:0 "Bölgedeki egemen güç haline geldikçe, liderimizi yeni Negusa Nagast olarak kutsayarak rolümüzü benimseme zamanı geldi. Herkes [ROOT.GetLeader.GetHerHim]'in arkasında toplanmalı veya gazabımızla yüzleşmeli."
 HOA_develop_capitalstate:0 "[Root.Capital.GetName]'ı Geliştir"
 HOA_develop_capitalstate_desc:0 "Halkımızın iyiliği ve [ROOT.GetNameDef]'nin korunması için sanayileşme hızını artırmalıyız. Bu nedenle, [ROOT.Capital.GetCapitalVictoryPointName]'ı çevreleyen bölgeye yatırım yaparak onu ulusun sanayi merkezi haline getireceğiz."
 HOA_develop_indigenous_models:0 "Yerli Modeller Geliştir"
 HOA_develop_indigenous_models_desc:0 "Piyade teçhizatı için yabancı tasarımlara güvenmek, teknolojik olarak geride kalma riskiyle bizi karşı karşıya bırakır. Bu güvenlik riski ancak hafif silahlar geliştirme alanında yerli uzmanlığı artırarak yeterince ele alınabilir."
 HOA_encourage_local_arms_production:0 "Yerel Silah Üretimini Teşvik Et"
 HOA_encourage_local_arms_production_desc:0 "Eğer birliklerimize ihtiyaç duydukları teçhizatı tedarik edemezsek, ulusun yeterli bir savunmasını yapamazlar. Bu nedenle silah sanayisinin kapasitesini genişletmeliyiz."
 HOA_every_man_a_warrior:0 "Her Adam bir Savaşçı"
 HOA_every_man_a_warrior_desc:0 "Eğer [ROOT.GetNameDef] yabancı saldırganlara başarılı bir şekilde karşı koyacaksa, toplumu ulusal savunma için gerektiğinde herkesin silahlanabileceği bir ölçüde askerileştirmeliyiz."
 HOA_exploit_national_resources:0 "Ulusal Kaynakları Sömür"
 HOA_exploit_national_resources_desc:0 "[ROOT.GetNameDefCap], sadece çıkarılmayı bekleyen bol miktarda doğal kaynağa sahiptir. Küçük bir yatırımla, nihayet onları sömürmeye başlayabiliriz."
 HOA_eyes_on_the_imperialists:0 "Gözler Emperyalistlerin Üzerinde"
 HOA_eyes_on_the_imperialists_desc:0 "Bölgenin emperyal güçleri [ROOT.GetNameDef]’in bağımsızlığını küçümseyerek gözlemliyor. Uyanık olmalı ve onların hırslarının kurbanı olmaktan kaçınmalıyız."
 HOA_foreign_investors:0 "Yabancı Yatırımcılar"
 HOA_foreign_investors_desc:0 "Gelişmek istiyorsak sanayimize ve altyapımıza yatırıma ihtiyacımız var. Neyse ki, kar elde etmek isteyen yabancı sıkıntısı yok."
 HOA_foreign_trained_officials:0 "Yabancı Eğitimli Yetkililer"
 HOA_foreign_trained_officials_desc:0 "Yurtdışındaki insanların uzmanlığından öğrenecek daha çok şeyimiz var. Onları ulus içinde yetki pozisyonlarına vererek daha iyi kullanma zamanı geldi."
 HOA_improved_irrigation_systems:0 "Geliştirilmiş Sulama Sistemleri"
 HOA_improved_irrigation_systems_desc:0 "Sağlam bir gıda üretim kapasitesi olmadan ulusal güvenliğe sahip olamayız. Mahsul verimini artırmak için, ekilebilir arazilerimiz boyunca büyük bir sulama programına yatırım yapacağız."
 HOA_improved_irrigation_systems_tt:0 "§Y$ETH_state_development_dynamic_modifier$§! değiştiricisini şununla değiştir:\n$MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+%15§!\n$MODIFIER_LOCAL_BUILDING_SLOTS$: §G+%15§!"
 HOA_improving_the_educational_system:0 "Eğitim Sistemini İyileştirme"
 HOA_improving_the_educational_system_desc:0 "Çocuklarımız ulusun kaderini ellerinde tutuyor. Bu nedenle, onlara mümkün olan en iyi eğitimi vermek, [ROOT.GetNameDef]'in geleceğini güvence altına almada uzun bir yol kat edecektir."
 HOA_invite_foreign_settlers:0 "Yabancı Yerleşimcileri Davet Et"
 HOA_invite_foreign_settlers_desc:0 "Ulusumuzu modernize etme konusunda hala kat etmemiz gereken uzun bir yol var. Saf sömürgecilerin becerilerini, [ROOT.GetNameDef]'e yerleşmeleri için bir teşvik yaratarak kullanmalıyız."
 HOA_lay_claim_to_the_danakil:0 "Danakil'e Hak İddia Et"
 HOA_lay_claim_to_the_danakil_desc:0 "[ROOT.GetNameDefCap], kuzeydeki Danakil bölgesini güvence altına almadan deniz istilasına karşı her zaman savunmasız kalacaktır."
 HOA_metal_beasts:0 "Metal Canavarlar"
 HOA_metal_beasts_desc:0 "Zırhlı savaşın savaş alanında giderek daha büyük bir rol oynayacağı giderek daha açık hale geliyor. Ordu, bu tür araçları en iyi nasıl kullanacağını ve karşı koyacağını öğrenmelidir."
 HOA_military_cooperation:0 "Askerî İşbirliği"
 HOA_military_cooperation_desc:0 "Silahlı kuvvetlerimizi iyileştirmede büyük adımlar atarken, ortak tatbikatlar ve artan askeri işbirliği yoluyla uluslararası dostlarımızdan öğrenebileceğimiz bazı dersler var."
 HOA_modern_infantry:0 "Modern Piyade"
 HOA_modern_infantry_desc:0 "Ordu reformlarımız, etkinliklerini artırmada uzun bir yol kat etti. Sahadaki tümen sayısını artırarak bu gelişmenin üzerine inşa etmeliyiz."
 HOA_names_finest:0 "[ROOT.GetName]'ın En İyileri"
 HOA_names_finest_desc:0 "Birliklerimiz, ulusumuzun yabancı bir gücün tebaası olmasının önündeki tek engel olduklarını biliyorlar. Bu bilgiyle birlikte, anavatanın savunulmasına ve [ROOT.GetAdjective] özgürlüğünün korunmasına sarsılmaz bir bağlılık gelir."
 HOA_observe_and_learn:0 "Gözlemle ve Öğren"
 HOA_observe_and_learn_desc:0 "Savaş, teknolojik ilerlemenin ve yenilikçi düşüncenin doğası gereği sürekli gelişmektedir. Sağlam bir orduyu sürdürmek için, savaşın derslerini öğrenmeli ve iyileştirmenin yollarını aramaktan asla vazgeçmemeliyiz."
 HOA_pave_the_roads:0 "Yolları Döşe"
 HOA_pave_the_roads_desc:0 "[ROOT.GetNameDef] genelinde insan ve mal taşımak şu anda çok verimsiz. Yollarımıza yatırım yapmak sadece ekonomiye fayda sağlamakla kalmaz, aynı zamanda askeri varlıkların daha kolay hareket etmesine olanak tanıyarak bizi daha güvenli hale getirir."
 HOA_political_stability:0 "Siyasi İstikrar"
 HOA_political_stability_desc:0 "Eğer evde bölünmüşsek, bağımsız bir ulus olarak kalmayı umamayız. Sadece birleşik bir cephe oluşturarak, şu anda dünyayı saran değişim rüzgarları tarafından bir kenara atılmaya direnebiliriz."
 HOA_proclaim_east-african_hegemony:0 "Doğu Afrika Hegemonyasını İlan Et"
 HOA_proclaim_east-african_hegemony_desc:0 "Afrika Boynuzu'ndaki her zaman çalkantılı durum, ancak şanlı imparatorumuz [ROOT.GetName]'ın yönetimi altında istikrara kavuşturulabilir. Bölgeyi birleştirme zamanı geldi."
 HOA_promote_countryadjective_nationalism:0 "[ROOT.GetAdjective] Milliyetçiliğini Teşvik Et"
 HOA_promote_countryadjective_nationalism_desc:0 "[ROOT.GetNameDef] halkı, yabancı güçlerin elindeki baskıyı artık tolere etmeyecektir. Anı yakalamalı ve bağımsızlık planlarımızı hızlandırmalıyız."
 HOA_promote_local_crafts:0 "Yerel El Sanatlarını Teşvik Et"
 HOA_promote_local_crafts_desc:0 "[ROOT.GetNameDefCap], ulusa mal tedarik etmek için küçük ölçekte çalışan bol miktarda yetenekli zanaatkara sahiptir. Onların uzmanlıkları üzerine inşa etmeli ve operasyonlarını ve söz konusu malların üretimini genişletmelerini kolaylaştırmalıyız."
 HOA_push_for_the_highlands:0 "Yayla için Bastır"
 HOA_push_for_the_highlands_desc:0 "Doğu Afrika'nın ekonomik kalbi yaylalarda yatmaktadır. Onu [ROOT.GetNameDef] için güvence altına almak, ekonomik potansiyelimizi genişletmede uzun bir yol kat edecektir."
 HOA_rallying_the_adjective_people:0 "[ROOT.GetAdjective] Halkını Toplama"
 HOA_rallying_the_adjective_people_desc:0 "Dünya çatışmalarla harap oluyor. Mevcut özgürlüklerimiz ile boyun eğme uçurumu arasında duran tek şey, [ROOT.GetAdjective] halkının ayağa kalkıp savaşma isteğidir. Birlikten kuvvet doğar, ayrılırsak düşeriz."
 HOA_reform_the_conscription:0 "Zorunlu Askerliği Reforme Et"
 HOA_reform_the_conscription_desc:0 "Küresel durum giderek daha gergin hale geldikçe, herhangi bir yabancı saldırganlığa hazırlıklı olmak için zorunlu askerlik programını genişletme zamanı geldi."
 HOA_research_exchange_programmes:0 "Araştırma Değişim Programları"
 HOA_research_exchange_programmes_desc:0 "Sanayimizin acilen modernizasyona ihtiyacı var, bir değişim programı kurarak yurtdışından fabrikalarımızda yeni teknolojik ilerlemeleri en iyi nasıl kullanacağımız konusunda bilgi edinebiliriz."
 HOA_secure_the_ogaden:0 "Ogaden'i Güvence Altına Al"
 HOA_secure_the_ogaden_desc:0 "Ogaden'i güvence altına almak, kendimizle olası saldırganlar arasında bir dizi doğal engel koyacak ve aynı zamanda ekonomimizi Hint Okyanusu üzerinden ticarete açacaktır."
 HOA_securing_the_adjective_future:0 "[ROOT.GetAdjective] Geleceğini Güvence Altına Alma"
 HOA_securing_the_adjective_future_desc:0 "[ROOT.GetNameDefCap], dünya sahnesinde çok az dostu olan küçük bir ulustur. Bunu değiştirmek, gelecekteki özgürlüğümüzü ve bağımsızlığımızı güvence altına almada uzun bir yol kat edecektir."
 HOA_state-funded_projects:0 "Devlet Destekli Projeler"
 HOA_state-funded_projects_desc:0 "Ekonomimiz, altyapı ve sanayi eksikliği nedeniyle durgun. Bunu hafifletmek için, [ROOT.GetNameDef] genelinde yeni projelere büyük yatırımlar yapacağız."
 HOA_state_owned_industry_tt:0 "§Y$ETH_state_development_dynamic_modifier$§! değiştiricisini şununla değiştir:\n$MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+%15§!\n$MODIFIER_LOCAL_BUILDING_SLOTS$: §G+%15§!"
 HOA_strengthen_the_irregulars:0 "Düzensizleri Güçlendir"
 HOA_strengthen_the_irregulars_desc:0 "Düzensizler ve askere alınanlar sistemi yüzyıllardır bize iyi hizmet etti. İşe yaradığı kanıtlanmış bir şeyi değiştirmenin pek bir nedeni yok."
 HOA_support_the_agrarians:0 "Tarımcıları Destekle"
 HOA_support_the_agrarians_desc:0 "[ROOT.GetNameDef]'in tarımda çalışan kırsal nüfusu ulusun bel kemiğidir. Bu nedenle, yürüttükleri hayati işte onları daha fazla desteklemeliyiz."
 HOA_support_the_agrarians_tt:0 "§Y$ETH_state_development_dynamic_modifier$§! değiştiricisini şununla değiştir:\n$MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+%10§!\n$MODIFIER_LOCAL_BUILDING_SLOTS$: §G+%10§!"
 HOA_that_which_is_rightfully_ours:0 "Haklı Olarak Bizim Olan"
 HOA_that_which_is_rightfully_ours_desc:0 "[ROOT.GetNameDefCap], olması gerekenin bir gölgesidir. Tarih, atalarımızın mevcut yönetimimizden çok daha geniş topraklar üzerinde hakimiyet kurduğunu, ancak çoğunun nesiller boyunca bizden çalındığını gösteriyor. Haklı olarak bize ait olanı geri alma zamanı geldi."
 HOA_the_adjective_air_fleet:0 "[ROOT.GetAdjective] Hava filosu"
 HOA_the_adjective_air_fleet_desc:0 "Hava savaşı, çatışmaların galibinin belirlendiği ana arena haline hızla geliyor. Bu nedenle, kendi hava kuvvetlerimizi kurmalı ve onu [ROOT.GetNameDef]'in gökyüzünü savunmaya hazırlamalıyız."
 HOA_the_adjective_armed_forces:0 "[ROOT.GetAdjective] Silahlı Kuvvetleri"
 HOA_the_adjective_armed_forces_desc:0 "Büyük güçler arasında gerilimler arttıkça dünya giderek daha istikrarsız hale geliyor. Eğer bağımsızlığımızı koruyacaksak, [ROOT.GetAdjective] ordusu savaşa hazır olmalıdır."
 HOA_the_adjective_industrial_fund:0 "[ROOT.GetAdjective] Sanayi Fonu"
 HOA_the_adjective_industrial_fund_desc:0 "[ROOT.GetNameDefCap] feci şekilde az sanayileşmiştir. Eğer halkın yaşamını iyileştirecek ve onları yabancı saldırganlıktan koruyacak kapasiteye sahip olacaksak, ulusu hızla sanayileştirmeliyiz."
 HOA_the_adjective_regional_development_fund:0 "[ROOT.GetAdjective] Bölgesel Kalkınma Fonu"
 HOA_the_adjective_regional_development_fund_desc:0 "[ROOT.GetNameDef] bölgeleri durgunlaşıyor ve acil yatırıma ihtiyacı var. Bir bölgesel kalkınma fonu oluşturarak, yerel yönetimlerin bölgelerini modernize etmek için gerekli araçlara sahip olmasını sağlayabiliriz."
 HOA_the_adjective_volunteer_force:0 "[ROOT.GetAdjective] Gönüllü Gücü"
 HOA_the_adjective_volunteer_force_desc:0 "Başka bir kıtadaki küçük ölçekli sınır çatışmaları, dünyayı saran büyük çatışmaları ateşleme potansiyeline sahiptir. Başka bir Büyük Savaş'a neden olmadan önce bu kıvılcımları söndürmek için üzerimize düşeni yapmalıyız."
 HOA_the_capital_city_airport:0 "[Root.Capital.GetCapitalVictoryPointName] Havaalanı"
 HOA_the_capital_city_airport_desc:0 "Hava taşımacılığı, dünyanın şehirlerini küresel ekonomiye giderek daha fazla bağlıyor. Bu trendden yararlanmak için kendi havaalanımızı kurmalıyız."
 HOA_the_capital_railroad:0 "[Root.Capital.GetCapitalVictoryPointName] Demiryolu"
 HOA_the_capital_railroad_desc:0 "Demiryolu ağımızı komşularımızla bağlayarak, mallarımızı ve kaynaklarımızı onlara daha iyi ihraç edebiliriz. Bu, umarım bu süreçte ekonomimize bir destek verir."
 HOA_the_capital_school_of_technology:0 "[Root.Capital.GetCapitalVictoryPointName] Teknoloji Okulu"
 HOA_the_capital_school_of_technology_desc:0 "Sadece birkaç yıl önce savaş alanında ve fabrikalarda en son teknoloji olan şey, bugün genellikle tamamen modası geçmiş durumda. Yeni teknolojilerin geliştirilmesine ayak uyduracaksak, gelecek nesli eğitmek için yatırım yapmalıyız."
 HOA_the_first_album:0 "[ROOT.GetNameDefCap]"
 HOA_the_first_album_desc:0 "Dünya, büyük güçler arasında gerilimler arttıkça giderek daha tehlikeli görünüyor, ancak bu aynı zamanda anı yakalamaya istekli ve hazır olan uluslar için bir fırsatlar dünyası da açıyor."
 HOA_the_grand_university_of_capital:0 "[Root.Capital.GetCapitalVictoryPointName] Büyük Üniversitesi"
 HOA_the_grand_university_of_capital_desc:0 "Bilgiyi bir nesilden diğerine aktarmak, herhangi bir ulusun güvenliği ve büyümesi için hayati önem taşır. Bu nedenle, gelecek nesil bilim adamlarını, tarihçileri ve sanatçıları daha iyi eğitmek için [ROOT.Capital.GetCapitalVictoryPointName]'da yeni bir büyük üniversite kuracağız."
 HOA_the_roars_of_thunder:0 "Yıldırımın Kükremeleri"
 HOA_the_roars_of_thunder_desc:0 "Bazen savaş alanında düşmanı yerinden etmenin tek yöntemi ezici ateş gücüdür. Bunu ortaya çıkarmanın en etkili yolu topçudur."
 HOA_the_state_bank_of_name:0 "[ROOT.GetNameDef] Devlet Bankası"
 HOA_the_state_bank_of_name_desc:0 "[ROOT.GetNameDef]'in merkez bankasının kaynaklarını genişleterek, halka yeni bir kredi limiti verebilir ve hasta [ROOT.GetAdjective] ekonomisi için bir finansal idrar söktürücü görevi görebiliriz."
 HOA_the_steam_locomotive:0 "Buharlı Lokomotif"
 HOA_the_steam_locomotive_desc:0 "Arabalar ve kamyonlar kısa mesafeleri veya küçük miktarları taşımak için yararlı olsa da, trenler büyük miktarda mal ve insanı taşımada çok daha verimlidir. Demiryolu ağımıza yatırım yapmak, ulusun ekonomisine büyük bir destek olacaktır."
 HOA_the_steel_lions:0 "Çelik Aslanlar"
 HOA_the_steel_lions_desc:0 "Statik savaş çağı geride kaldı. Kendi özel zırhlı birimlerimizi savaş alanına sürme ve hareketli savaş yöntemlerini öğrenmeye başlama zamanı geldi."
 HOA_use_the_natural_harbors:0 "Doğal Limanları Kullan"
 HOA_use_the_natural_harbors_desc:0 "Yakın zamanda kıyı arazisi edinmemizle, kendi limanımızı kurarak uluslararası pazara erişimimizi önemli ölçüde artırma fırsatımız var. Bu, mal ithalatını ve ihracatını çok daha kolaylaştıracak ve ekonomimize büyük ölçüde yardımcı olacaktır."
 HOA_utilize_our_strengths:0 "Güçlü Yönlerimizi Kullan"
 HOA_utilize_our_strengths_desc:0 "Ordumuz diğer uluslarınki kadar geniş veya resmi olmasa da, savaş alanında sömürülebilecek büyük miktarda alışılmadık uzmanlığa sahiptir."
 HOA_warfare_from_afar:0 "Uzaktan Savaş"
 HOA_warfare_from_afar_desc:0 "Topçu, savaş alanında değerini defalarca kanıtlamıştır. Özel topçu birimlerini piyade tümenlerimize daha yakından entegre ederek ondan daha iyi yararlanmalıyız."
 HOA_warrior_tradition:0 "Savaşçı Geleneği"
 HOA_warrior_tradition_desc:0 "[ROOT.GetNameDefCap], evlerini olası fatihlerden savunan cesur savaşçıların uzun bir geçmişine sahiptir. Şimdi her zamankinden daha fazla, anavatanın savunması için bu geleneğe başvurmalıyız."
 ITA_ENG_must_control_necessary_states_tt:0 "§Y[ENG.GetNameWithFlag]§!, Afrika Boynuzu ve Malta'daki tarihi İngiliz sömürgelerini kontrol etmiyor."
 ITA_FRA_must_control_necessary_states_tt:0 "§Y[FRA.GetNameWithFlag]§!, Cibuti ve Tunus'taki tarihi Fransız sömürgelerini kontrol etmiyor."
 ITA_ITA_auxiliaries_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$ \n$modifier_army_sub_unit_militia_attack_factor$: §G+%3.00§! \n$modifier_army_sub_unit_militia_speed_factor$: §G+%5.00§! \n\n"
 ITA_RDS_exists_tt:0 "Ülke §Y$RDS$§!."
 ITA_a_bandits_war:0 "Bir Haydutun Savaşı"
 ITA_a_bandits_war_desc:0 "Savaş yürütmenin eski yolları İsonzo siperlerinde ölmeliydi. Bazı eski generallerimiz hala modern savaşın, asker kitlelerini kıyma makinesine atarak kazanılabileceğine inanıyor. Artık daha iyisini biliyoruz: modern savaş, hızlı manevralar ve hızla tepki verebilen esnek organizasyonlarla kazanılır. Ordumuzu bu tür bir savaşa hazırlamalıyız."
 ITA_a_bandits_war_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$ \n$MODIFIER_ORG_LOSS_WHEN_MOVING$: §G-%15.0§! \n$MODIFIER_ARMY_SPEED_FACTOR_FOR_CONTROLLER$: §G+%5.00§! \n\n"
 ITA_a_colonial_empire:0 "Bir Sömürge İmparatorluğu"
 ITA_a_colonial_empire_claims_tt:0 "[ROOT.GetFlag][ROOT.GetNameDef] veya [ROOT.GetFlag][ROOT.GetAdjective] kontrolü altında olmayan §Yher [EGY.GetAdjective], [KEN.GetAdjective], [SUD.GetAdjective], [SOM.GetAdjective], [DJI.GetAdjective], [ETH.GetAdjective], [ERI.GetAdjective] veya [UGA.GetAdjective] topraklarında§! hak iddia eder. \nMevcut etkiler:"
 ITA_a_colonial_empire_desc:0 "Düşmanlarımızın ve rakiplerimizin çabalarına rağmen, İtalya güçlü bir sömürge imparatorluğu haline geldi. Sadece topraklarımızdan en iyi şekilde yararlandığımızdan değil, aynı zamanda Afrika'daki İtalyan kontrolünü genişletmeye devam ettiğimizden de emin olmalıyız."
 ITA_a_colonial_empire_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$ \n$MODIFIER_GLOBAL_NON_CORE_MANPOWER$: §G+%15.00§! \n\n"
 ITA_a_greater_purpose:0 "Daha Büyük bir Amaç"
 ITA_a_greater_purpose_desc:0 "Parti içindeki son çekişmeler, faşizm fikrini herhangi bir bireye çok yakından bağlamanın kusurlarını bize gösterdi. Faşizmi, herhangi bir kişinin ölümlü hayatını aşan daha büyük bir kavram olarak - insanların arkasında toplanacağı bir fikir olarak - teşvik etmeye odaklanmalıyız."
 ITA_a_leader_steps_forward:0 "Bir Lider Öne Çıkıyor"
 ITA_a_leader_steps_forward_desc:0 "Yeni İtalyan Cumhuriyeti'nin başında kimin olacağına karar verme zamanı geldi. Neyse ki, son derece nitelikli adaylar arasından seçim yapabiliriz."
 ITA_a_new_era_for_the_red_shirts:0 "Kızıl Gömlekliler için Yeni bir Dönem"
 ITA_a_new_era_for_the_red_shirts_desc:0 "Giuseppe Garibaldi ve Kızıl Gömleklilerinin izinden gidecek, bu milisleri güçlendirecek ve hem İtalyan Ordusu'nun bir parçası olarak hem de yurtdışındaki gönüllü tugaylar olarak görevlerini en iyi şekilde yerine getirmeleri için eğiteceğiz."
 ITA_a_new_era_for_the_red_shirts_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$ \n$modifier_army_sub_unit_militia_max_org_factor$: §G+%5.00§! \n\n"
 ITA_a_time_for_war:0 "Savaş Zamanı"
 ITA_a_time_for_war_desc:0 "Avrupa'da sapkınlık var olduğu sürece barış olamaz. Yeni bir Kutsal Savaş zamanı geldi. Yeni savaş makineleri O'nun adıyla kükreyecek, sapkını haklı bir öfkeyle vurmaya hazır olacak. 105mm'lik bir topun namlusundan her kafire hüküm verilene kadar barış olmasın."
 ITA_a_time_for_war_tt:0 "Avrupa'da çoğunluğu Katolik olmayan §Yher ülkeye§! karşı §Y$puppet_wargoal_focus$§! savaş hedefi kazanır."
 ITA_abolish_the_colonies:0 "Sömürgeleri Kaldır"
 ITA_abolish_the_colonies_decision_effects_tt:0 "\nKarar etkileri [?ITA_abolish_the_colonies_days] gün içinde:\n"
 ITA_abolish_the_colonies_desc:0 "İtalya'nın herhangi bir bölgesi için sömürge statüsünü kaldırmak üzere devrimci bir plan geliştirecek ve sunacağız. Ülkemizin tarihinde ilk kez, etkilenen bölgelerin yerel vatandaşları kaderlerini belirleme fırsatına sahip olacak. Onlara İtalyan devletinin meşru bir vilayeti olmanın faydalarını göstermek bize düşüyor."
 ITA_african_conquests_tt:0 "Gelişen İmparatorluğumuzla, §YAfrika Kıtası§!'ndaki toprakları §Yilhak etmek§! §Ydaha az maliyetli§! olacak."
 ITA_agents_of_the_church:0 "Kilisenin Ajanları"
 ITA_agents_of_the_church_desc:0 "Kilise'nin dünya çapında sayısız temsilcisi vardır, eğer Vatikan'ı yanımıza çekmeyi başarırsak, Kilise'nin elçileri olarak mükemmel bir kılıfa sahip yeni ajanlarımız olabilir, bu da istihbarat ağlarımızı iyileştirir."
 ITA_aid_for_the_spanish_republic:0 "İspanya Cumhuriyetine Yardım"
 ITA_aid_for_the_spanish_republic_desc:0 "İç savaştaki İspanyol yoldaşlarımıza yardım etmeliyiz. Sosyalist cumhuriyetleri, şimdi yıktıkları devlete bağlılık yemini eden kana susamış İspanyol generalleri tarafından kuşatılmış durumda ve Avrupa'nın büyük faşist güçleri tarafından destekleniyorlar."
 ITA_aid_for_the_spanish_republic_tt:0 "[GetSpanishRepublicFlagAndNameDef]'e §Y2500§! §YPiyade Teçhizatı§! gönder. Eskiler önce gider."
 ITA_air_innovations_bba:0 "Hava Yenilikleri"
 ITA_air_innovations_bba_desc:0 "Havadaki savaş, modern savaşın belirleyici alanlarından biri haline geldi. Bu kritik alanda geride kalmamıza izin veremeyiz."
 ITA_albanian_fascist_militia:0 "[GetAppropriateAlbanianFascistMilitiaName]"
 ITA_albanian_fascist_militia_alt:0 "Legaliteti Milisleri"
 ITA_albanian_fascist_militia_default:0 "Arnavut Faşist Milisleri"
 ITA_albanian_fascist_militia_desc:0 "Arnavutluk'ta İtalyan Kara Gömleklilerinin yeni bir kanadını oluşturacağız, sadece ülkedeki İtalyan sömürgecileri değil, aynı zamanda Arnavut gönüllüleri de askere aldığımızdan emin olacağız."
 ITA_albanian_fascist_militia_occupation_law_full_tt:0 "§YArnavutluk§! eyaletlerinde işgal yasasının kilidini açar: \n"
 ITA_albanian_fascist_militia_occupation_law_tt:0 "§YArnavutluk§! eyaletlerinde işgal yasasının kilidini açar: §Y$colonial_police$§!.\n"
 ITA_albanian_fascist_militia_spawn_divs_tt:0 "§Y[THIS.GetName]§!'da §Y3 Camicie Nere§! tümeni oluştur."
 ITA_albanian_occupation:0 "Arnavutluk İşgali"
 ITA_albanian_occupation_desc:0 "Arnavutluk, birliklerimizin işgal etmesi için kolay bir hedef çiziyor. Çok fazla direnişle karşılaşmamız pek olası değil. Dünyaya İtalya'nın gücünü göstermeli ve geçmişin görkemini geri getirmeliyiz!"
 ITA_albanian_oil:0 "Arnavutluk Petrolü"
 ITA_albanian_oil_desc:0 "Arnavutluk'taki eski petrol imtiyazı için kullanılan modası geçmiş teçhizatımızı değiştirme ve şimdi ülke üzerinde tam kontrole sahip olduğumuz için onu güçlü bir petrol çıkarma endüstrisine dönüştürme zamanı geldi."
 ITA_all_eth_initial_states_controlled_tt:0 "Tüm ilk Etiyopya eyaletleri §Y[ROOT.GetFlag][ROOT.GetNameDef]§! veya bir §Y[ROOT.GetAdjective] müttefiki§! tarafından kontrol ediliyor."
 ITA_all_roads_lead_to_rome:0 "Tüm Yollar Roma'ya Çıkar"
 ITA_all_roads_lead_to_rome_desc:0 "Roma lejyonları geçmişte, ordularının faaliyet göstermesi için gereken yolları ve altyapıyı inşa etmedeki hızları ve verimlilikleriyle ünlüydü. Binlerce yıl sonra, savaş yürütürken lojistik ve ikmal hatları daha da önemlidir."
 ITA_all_roads_lead_to_rome_iri_tt:0 "$ITA_modify_ricostruzione_industriale_dynamic_modifier_ns_intro$ \n$modifier_production_speed_infrastructure_factor$: §G+%10.00§! \n\n"
 ITA_all_roads_lead_to_rome_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$ \n$MODIFIER_SUPPLY_NODE_RANGE$: §G+%10§! \n\n"
 ITA_all_roads_lead_to_rome_wargoals_tt:0 "§Y[ROOT.GetNameWithFlag]§!, §YDost olmayan komşu Avrupa ülkelerine§! karşı §Y$annex_everything$§! savaş hedefi kazanır."
 ITA_all_within_the_state:0 "Her Şey Devlet İçinde"
 ITA_all_within_the_state_desc:0 "Eğer bu kanlı savaşta galip geleceksek, herkesin savaş çabasına katkıda bulunması gerekir. Ancak her şey doğrudan düşmanla savaşmakla ilgili değildir, cephe hatlarımızın sağlam bir sanayi ve lojistik tarafından da desteklenmesi gerekir."
 ITA_anglo_italian_agreements:0 "İngiliz-İtalyan Anlaşmaları"
 ITA_anglo_italian_agreements_desc:0 "Doğu Afrika'daki yeni gerçeklikle, diğer sömürgeci güçler bizimle anlaşmak zorunda. Süveyş'ten geçişimize izin vermelerine ihtiyacımız var, ama onların bize çok daha fazla ihtiyacı var. Eğer reddederlerse, destek için başka yerlere bakmak zorunda kalabiliriz."
 ITA_anglo_italian_agreements_suez_tt:0 "Süveyş kanalı [ROOT.GetName] için kilitli değil veya [ITA.GetName] için §Y365§! günden fazla kilitli."
 ITA_anglo_italian_agreements_suez_unlocked_tt:0 "§GSüveyş Kanalı artık [ROOT.GetName] için engellenmeyecek§!."
 ITA_anglo_italian_pact:0 "İngiliz-İtalyan Paktını İmzala"
 ITA_anglo_italian_pact_desc:0 "İngilizlerle keyif aldığımız askeri işbirliği bize iyi hizmet etti ve bir saldırmazlık paktı da öyle olurdu. Böyle bir pakt, Afrika'daki mülklerimizin geniş bir bölümünü güvence altına alacak ve bakışlarımızı başka yerlere çevirmemize olanak tanıyacaktır."
 ITA_anti_partisan_measures:0 "Partizan Karşıtı Önlemler"
 ITA_anti_partisan_measures_desc:0 "Düşman partizanları son zamanlarda olağanüstü derecede aktif, yedeklerimizi taciz ediyor ve ikmal hatlarımızı tehdit ediyor. Partizan karşıtı savaşta uzmanlaşmış yeni birimler konuşlandırmalı ve bu lanetli çeteleri kontrol altında tutmalıyız."
 ITA_anti_partisan_measures_state_modifier_rds_tt:0 "$ITA_modify_partisan_state_modifier_intro$ \n$MODIFIER_REQUIRED_GARRISON_FACTOR$: §R-%10§! \n$MODIFIER_RESISTANCE_GROWTH_ON_OUR_OCCUPIED_STATES$: §R-%5§! \n\n"
 ITA_anti_partisan_measures_state_modifier_rsi_tt:0 "$ITA_modify_partisan_state_modifier_intro$ \n$MODIFIER_REQUIRED_GARRISON_FACTOR$: §G-%10§! \nDireniş Büyüme Hızı $ITA_in_our_controlled_states_cw$: §G-%5§! \n\n"
 ITA_antifascist_civil_war_triggered_flag:0 "İtalyan Anti-Faşist İç Savaşı gerçekleşti."
 ITA_appeal_to_the_bourgeoisie:0 "Burjuvaziye Başvur"
 ITA_appeal_to_the_bourgeoisie_desc:0 "Faşist rejimin düşüşüyle ilgilenen burjuva gruplarına ulaşmalıyız. Onların emrindeki kaynaklar ve devrimcilerimizin cesaretiyle bu kanlı savaşa hızla bir son verebileceğiz!"
 ITA_appease_the_military:0 "Orduyu Yatıştır"
 ITA_appease_the_military_desc:0 "Silahlı kuvvetlerdeki birçok subay yeni hükûmetten veya iç savaştan sonraki statülerinden mutsuzdur, ordudaki hoşnutsuzluğun kökünün kazındığından ve subayların savaştaki rollerinin tanındığını hissettiklerinden emin olmak akıllıca olacaktır."
 ITA_aquila_magna_tt:0 "§Y1 Stratejik Bombardıman Filosu§! [2.GetName]'da aktif olur."
 ITA_army_leaders:0 "Ordu Liderleri"
 ITA_army_leaders_desc:0 "Ordularımız her zaman mevcut en yetenekli subaylar tarafından yönetilmelidir. Avantajı sürdürmek için yeni ve yetkin subayların istikrarlı bir akışını yaratmamız zorunludur."
 ITA_army_leaders_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$ \n$MODIFIER_XP_GAIN_FACTOR$: §G+%10.0§! \n$MODIFIER_ARMY_LEADER_COST_FACTOR$: §G-%15.0§! \n$MODIFIER_UNIT_LEADER_PROMOTE_COST_FACTOR$: §G-%25.0§! \n$MODIFIER_ARMY_SPEED_FACTOR_FOR_CONTROLLER$: §G+%5.00§! \n\n"
 ITA_army_modernization:0 "Ordu Modernizasyonu"
 ITA_army_modernization_desc:0 "Silahlı kuvvetlerimiz, diğer büyük güçlerin orduları ve doktrinleriyle aynı seviyede kalmalarını sağlayacak yeni teçhizat ve eğitim tekniklerinden faydalanabilir."
 ITA_army_primacy_bba:0 "Ordu Önceliği"
 ITA_army_primacy_bba_desc:0 "Son kertede bir savaş, düşman topraklarına asker çıkararak ve düşmanın savaşmak için ihtiyaç duyduğu şeyleri alarak kazanılır. Donanma ve Hava Kuvvetleri şüphesiz yararlı organizasyonlar olsa da, savaşı kazanacak olan Ordudur."
 ITA_ascari:0 "Ascari"
 ITA_ascari_create_units_tt:0 "Kontrol edilen Afrika eyaletlerinde §Y10 adede kadar [ROOT.GetFlag][ROOT.GetAdjective]§! sömürge birimi ve her Afrika bağlı devletinde §Y3 adede kadar [ROOT.GetFlag][ROOT.GetAdjective]§! sömürge birimi oluştur."
 ITA_ascari_desc:0 "Afrika'dan yerel birliklerden oluşan düzenli tümenler, sadece garnizon veya yedek olarak değil, aynı zamanda diğer tümenlerin zorlanacağı zorlu arazilerde askeri operasyonlarda da farklı rollerde son derece verimli olduklarını kanıtladılar."
 ITA_ascari_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$ \n$modifier_army_sub_unit_infantry_defence_factor$: §G+%3.00§! \n\n"
 ITA_austrian_guarantees_tt:0 "Almanya'nın Anschluss'u denemesi durumunda, İtalya müdahale etme seçeneği kazanacak."
 ITA_auxiliaries:0 "Yardımcı Birlikler"
 ITA_auxiliaries_desc:0 "Tıpkı Romalı atalarımızın zamanında olduğu gibi, yardımcı birlikler bugün de düzenli askeri birimleri desteklemek, araziyi keşfetmek ve düşmanı taciz etmek gibi konularda önemli bir rol oynamaya devam ediyor. Ordumuzu güçlendirmek için bu paramiliter milisleri genişletmeliyiz."
 ITA_aviazione_legionaria_tt:0 "§Y2 Avcı Filosu§! ve §Y1 Taktik Bombardıman Filosu§! [2.GetName]'da aktif olur."
 ITA_balkan_ambition:0 "Balkan Hırsı"
 ITA_balkan_ambition_desc:0 "İtalyan sınırlarını doğuya, Slovenya'ya ve daha da önemlisi Dalmaçya kıyısına genişletme zamanı geldi. Dalmaçya'nın Venedik kültürel mirasını vurgulayacak ve dünyanın Venedik hükûmetinin geçmişte sadece Dalmaçyalılar için faydalı olmakla kalmayıp, aynı zamanda onlar tarafından da çok kabul gördüğünü görmesini sağlayacağız."
 ITA_banda_carita:0 "Banda Carità"
 ITA_banda_carita_desc:0 "Savaş her zaman şanlı bir olay değildir. Halk cephedeki çatışmalara odaklansa da, biz İç Cephenin de aynı derecede önemli olduğunu ve arkadaki direnişin kökünü kazımanın da aynı derecede gerekli olduğunu biliyoruz."
 ITA_banda_koch:0 "Banda Koch"
 ITA_banda_koch_desc:0 "Modern savaş genellikle tüm halkların savaşıdır. bu, cephe hattının artık savaşın olduğu tek yer olmadığı anlamına gelir. Ayrıca, muharebe birliklerini kullanarak iletişim hatlarımızı güvence altına almaya hazır olmalıyız."
 ITA_battaglioni_d_assalto:0 "Battaglioni d'Assalto"
 ITA_battaglioni_d_assalto_desc:0 "Kara Gömleklilerimiz, Büyük Savaş'ın saldırı gruplarının gururlu geleneğinde duruyor. Onları Ordumuza entegre ederek, onlara savaşta güçlü bir saldırı gücü vereceğiz."
 ITA_battaglioni_d_assalto_tt:0 "Destek taburu §Y$blackshirt_assault_battalion$§!'un kilidini açar."
 ITA_battaglioni_m:0 "Battaglioni M"
 ITA_battaglioni_m_desc:0 "Düşman saldırısını kontrol altına almak için yeni seçkin birimlere ihtiyacımız var. Savaşta kendilerini ayırt etmiş Kara Gömlek taburlarını dönüştürmeli ve güçlendirmeliyiz ve bu birlikleri cephe hatlarımızın en zayıf noktalarını takviye etmek ve düşmanı geldikleri yere geri püskürtmek için kullanmalıyız."
 ITA_battaglioni_m_re_battaglioni_d_assalto_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$ \n$modifier_army_sub_unit_militia_max_org_factor$: §G+%5.00§! \n$modifier_army_sub_unit_militia_defence_factor$: §G+%5.00§! \n$modifier_army_sub_unit_blackshirt_assault_battalion_defence_factor$: §G+%5.00§! \n$modifier_army_sub_unit_blackshirt_assault_battalion_attack_factor$: §G+%5.00§! \n\n"
 ITA_battaglioni_m_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$ \n$modifier_army_sub_unit_militia_max_org_factor$: §G+%5.00§! \n$modifier_army_sub_unit_militia_defence_factor$: §G+%5.00§! \n§Y$blackshirt_assault_battalion$s§! ayrıca §Y$ITA_battaglioni_d_assalto$§! odağının tamamlanmasıyla geliştirilecektir.\n\n"
 ITA_befriend_greece:0 "Yunanistan ile Arkadaş Ol"
 ITA_befriend_greece_desc:0 "$ITA_greece_friend_desc$"
 ITA_befriend_japan:0 "Japonya ile Arkadaş Ol"
 ITA_befriend_japan_desc:0 "$ITA_japan_friend_desc$"
 ITA_befriend_portugal:0 "Portekiz ile Arkadaş Ol"
 ITA_befriend_portugal_desc:0 "$ITA_portugal_friend_desc$"
 ITA_befriend_turkey:0 "Türkiye ile Arkadaş Ol"
 ITA_befriend_turkey_desc:0 "$ITA_turkey_friend_desc$"
 ITA_believe_obey_fight:0 "İnan, İtaat Et, Savaş"
 ITA_believe_obey_fight_desc:0 "Partimiz basit ilkeler üzerine kuruldu. Birincisi, iktidarı ele geçirmek için bunun mümkün olduğuna inanmak gerekir. İkincisi, iktidarı ele geçirmek için iktidardaki insanlara itaat etmek gerekir. Üçüncüsü, iktidarı ele geçirmek için savaşmak gerekir. Ve iktidarı ele geçirmek, isme layık herhangi bir siyasi hareketin tek gerçek amacıdır."
 ITA_believe_obey_fight_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$ \n$MODIFIER_CONSCRIPTION_TOTAL_FACTOR$: §G+%10§! \n\n"
 ITA_bend_the_bars:0 "Parmaklıkları Eğ"
 ITA_bend_the_bars_desc:0 "İtalya, Büyük Savaş'tan sonra İngilizler tarafından yaratılan bir hapishaneye maruz kalıyor ve İtalya ne kadar kalabalık ve güçlü olursa, hapsinden o kadar çok acı çekecektir. O hapishanenin parmaklıklarını eğme ve İtalyan kontrolünü daha da genişletme zamanı geldi."
 ITA_bersaglieri:0 "Bersaglieri"
 ITA_bersaglieri_desc:0 "Bersaglieri, seçkin hafif piyademiz, savaşta uzun zamandır kendilerini ayırt etmiştir. Savaşın geleceği mekanize olabilirken, bireysel askerin kalitesi hala belirleyici faktör olacaktır."
 ITA_bersaglieri_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$ \n$MODIFIER_SPECIAL_FORCES_ATTACK_FACTOR$: §G+%3.0§! \n$MODIFIER_SPECIAL_FORCES_DEFENCE_FACTOR$: §G+%3.0§! \n$MODIFIER_SPECIAL_FORCES_CAP$: §G+%5.0§! \n\n"
 ITA_blackshirt_loyalty:0 "Kara Gömleklilerin Sadakatini Kazan"
 ITA_blackshirt_loyalty_desc:0 "Kara Gömlekliler, İtalya'daki faşizm içinde uzun zamandır özel bir yere sahiptir ve eğer halkta bir ilham duygusu uyandırmak istiyorsak, örgütün sadakatini kazanmak iyi olacaktır. Şanlı yeni Duce'nin ilahi algısını silahlı kuvvetler boyunca - ve ötesine - yaymada en faydalı olacaklardır."
 ITA_blackshirts_div_cap_12_tt:0 "§YCamicie Nere§! şablon kapasitesini §G+12§! artır."
 ITA_blackshirts_div_cap_8_tt:0 "§YCamicie Nere§! şablon kapasitesini §G+8§! artır."
 ITA_bomber_designs:0 "Bombardıman Uçağı Tasarımları"
 ITA_bomber_designs_desc:0 "Bombardıman uçaklarımız için yeni tasarımlarla hava kuvvetlerimiz, düşman birliklerini ve ikmal hatlarını tehdit ederken karada ve denizde kuvvetlerimizi destekleyebilecektir."
 ITA_boost_the_grand_council_of_fascism:0 "Faşizmin Büyük Konseyini Güçlendir"
 ITA_boost_the_grand_council_of_fascism_desc:0 "Benito Mussolini, İtalya için çok şey yaptı, ama o, son tahlilde, hala sadece bir adam. eğer bir gün ülkeyi yoldan çıkarırsa, Faşizmin Büyük Konseyi onu durdurmak için orada olacaktır."
 ITA_boost_the_grand_council_of_fascism_missiolinis_tt:0 "\nFaşizmin Büyük Konseyi'nin, Mussolini tarafından verilen bir görevi yenisiyle değiştirme olasılığının kilidini açar."
 ITA_bop_will_shift:0 "§YGüç Dengesi§! ülke liderine doğru kayacaktır."
 ITA_brescia_small_arms_industry:0 "Brescia Hafif Silah Sanayisi"
 ITA_brescia_small_arms_industry_desc:0 "İtalyan hafif silahları, yüksek kaliteleriyle tüm dünyada ünlüdür. Ancak, askerlerimizin sahadaki herhangi bir düşmanı yenebilmesini sağlamak istiyorsak, en modern silah türlerinden yeterli bir tedariğe sahip olduğumuzdan da emin olmalıyız."
 ITA_bring_back_exiled_intellectuals:0 "Sürgündeki Aydınları Geri Getir"
 ITA_bring_back_exiled_intellectuals_desc:0 "Faşist rejim, büyük filozoflar, aydınlar ve bilim adamları da dahil olmak üzere sayısız İtalyan vatandaşını sürgüne zorladı. Tüm bu mültecilere eve dönme fırsatı sunma zamanı geldi."
 ITA_bring_back_old_glories:0 "Eski Görkemleri Geri Getir"
 ITA_bring_back_old_glories_desc:0 "Çeşitli limanlarda hurdaya çıkarılmayı bekleyen sayısız eski gemimiz var. Bazı mühendislerimiz ve deniz subaylarımız, birkaç yeniden ayarlama ile bu eski görkemleri tekrar faal hale getirebileceğimizi iddia ediyor."
 ITA_bring_down_fascist_strongholds:0 "Faşist Kalelerini Yık"
 ITA_bring_down_fascist_strongholds_desc:0 "Avrupa'daki kritik durum göz önüne alındığında, saldırgan faşist güçlerin bize karşı bir taarruz başlatmasını bekleyemeyiz. İlk vuran en iyi vurur, bu yüzden faşistlere ilk ve sert bir şekilde vurduğumuzdan emin olacağız."
 ITA_bring_down_fascist_strongholds_tt:0 "§Y[ROOT.GetFlag][ROOT.GetNameDefCap]§!, Avrupa'daki herhangi bir faşist ülkeye karşı savaş hedefi kazanır."
 ITA_by_blood_alone:0 "Sadece Kanla"
 ITA_by_blood_alone_desc:0 "Ordumuzun gücü ve rejimimize sadık İtalyan irredantistlerinin sınırsız fanatizmi sayesinde, İtalya nihayet imzasını tarih yıllıklarına sadece ikincil bir aktör olarak değil, ana kahraman olarak kaydedecektir. \nTarihin çarklarını sadece kan döndürür!"
 ITA_by_blood_alone_ra_tt:0 "$ITA_modify_regia_aeronautica_dynamic_modifier_ns_intro$ \n$MODIFIER_AIR_SUPERIORITY_BONUS_IN_COMBAT$: §G+%5.0§! \n\n"
 ITA_by_blood_alone_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$ \n$MODIFIER_ARMY_MORALE_FACTOR$: §G+%5.0§! \n$MODIFIER_CONSCRIPTION_TOTAL_FACTOR$: §G+%5§! \n$MODIFIERS_ARMY_ATTACK_FACTOR$: §G+%5.0§! \n\n"
 ITA_by_blood_alone_rm_tt:0 "$ITA_modify_regia_marina_dynamic_modifier_ns_intro$ \n$MODIFIER_NAVAL_MORALE_FACTOR$: §G+%5.0§! \n\n"
 ITA_cacciatorpediniere_di_scorta:0 "Cacciatorpediniere di Scorta"
 ITA_cacciatorpediniere_di_scorta_desc:0 "[GetAppropriateRegiaMarinaNsName]’in temel görevlerinden biri, İtalya, Kuzey Afrika ve Akdeniz Adalarımız arasındaki deniz yollarını korumaktır. Denizaltı karşıtı savaşa odaklanmış küçük muhripler inşa ederek ve mürettebatı etkili bir şekilde eğiterek, denizaşırı kuvvetlerimize malzeme akışını sürdürme yeteneğimizi daha iyi koruyacağız."
 ITA_caligulas_pride:0 "Caligula'nın Gururu"
 ITA_caligulas_pride_desc:0 "Şimdiye kadar var olan en büyük savaş gemisini geliştirme zamanı geldi. En iyi deniz mühendislerimiz tasarımı mükemmelleştiriyor ve prototipleri test ediyor ve şimdi Neptunus'un sadece Akdeniz'in değil, ötesinin de kralı olacağından eminler."
 ITA_caligulas_pride_military_industry_dm_tt:0 "$ITA_modify_military_industry_dynamic_modifier_ns_intro$ \n$ITA_caligulas_pride_dynamic_modifier_tt$ \n\n"
 ITA_cannot_release_pap_tt:0 "Bu odağı tamamladıktan sonra artık §Y[PAP.GetNameDef]§!'i serbest bırakamaz."
 ITA_capo_supremo:0 "Capo Supremo"
 ITA_capo_supremo_desc:0 "İtalya'da büyük ulusumuzun hak ettiği şanı ve gücü getirebilecek tek bir kişi var. Yozlaşmış monarşi günleri bitti, enerjik Duce'mizin İtalya'nın yüce lideri olma zamanı geldi."
 ITA_carica_di_isbuscenskij:0 "Carica di Isbuscenskij"
 ITA_carica_di_isbuscenskij_desc:0 "Bazıları atın ve savaş alanındaki binicisinin günlerinin bittiğini söylüyor. Süvarinin rolünün tanklar ve uçaklar tarafından devralındığını. Ama yanılıyorlar - bir atın yakıta ihtiyacı yoktur, bir yer ekibine ihtiyacı yoktur, ara sıra yeni bir nal dışında yedek parça gerektirmez. Bu, süvariye modern savaş alanında bile açık bir avantaj sağlar."
 ITA_carica_di_isbuscenskij_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$ \n$modifier_army_sub_unit_cavalry_attack_factor$: §G+%3.00§! \n$modifier_army_sub_unit_cavalry_speed_factor$: §G+%3.00§! \n$modifier_unit_cavalry_design_cost_factor$: §G-%25.00§! \n$modifier_unit_camelry_design_cost_factor$: §G-%25.00§! \n\n"
 ITA_catholic_action:0 "Katolik Eylem"
 ITA_catholic_action_desc:0 "Katolik gençlik örgütümüz, komünistlerin kökünü kazımada, Katolik sosyal adalet ilkelerini teşvik etmede ve silahlı kuvvetlerimizin saflarını hevesli yeni acemilerle şişirmede çok etkili bir araç olduğunu kanıtlıyor."
 ITA_catholic_action_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$ \n$MODIFIER_ARMY_MORALE_FACTOR$: §G+%5.0§! \n$MODIFIER_CONSCRIPTION_TOTAL_FACTOR$: §G+%10§! \n\n"
 ITA_christian_democracy:0 "Hristiyan Demokrasi"
 ITA_christian_democracy_desc:0 "Hristiyan Demokrat Parti, Alcide de Gasperi tarafından yönetilen ve Hristiyan ideallerini özgürlük fikriyle birleştirerek halk desteğini kazanmayı başaran muhafazakâr bir merkez siyasi örgütüdür. Monarşiye sadık kaldıkları sürece bir hükûmet kurmalarına izin vermeliyiz."
 ITA_citta_dell_aria:0 "Città dell'Aria"
 ITA_citta_dell_aria_desc:0 "Araştırma çabalarımız uzun süredir ülke genelinde birçok farklı alana yayılmış durumda. Bu, işleri oldukça verimsiz hale getirdi. Araştırma çabalarımızı birleştirmeli ve birçok farklı çalışma alanından bilim adamları ve mühendislerin yeni nesil uçaklar inşa etmek için birlikte çalışabileceği bir 'Gökyüzü Şehri' kurmalıyız."
 ITA_citta_dell_aria_tt:0 "Eğer §Y[2.GetName]§!'da başka §YDeneysel Tesis§! yoksa, §Y[2.GetName]§!'da §G1§! §YAerodinamik ve Aviyonik Tesisi§! kazanacağız."
 ITA_claims_on_turkey_bba:0 "Türkiye Üzerinde Hak İddiaları"
 ITA_claims_on_turkey_bba_desc:0 "$ITA_claims_on_turkey_desc$"
 ITA_comandante_diavolo:0 "Comandante Diavolo"
 ITA_comandante_diavolo_create_units_tt:0 "\nSahip olunan ve kontrol edilen sömürgelerde §Y[ROOT.GetFlag][ROOT.GetAdjective]§! düzensiz birimleri oluştur:"
 ITA_comandante_diavolo_desc:0 "Eritre'yi fethederken ve Etiyopya'daki savaşımızda, sık sık yerli atlıların hızı ve azmi tarafından rahatsız edildik. Onlara karşı mücadele ettikten sonra, eğer onları bizim tarafımıza çekebilirsek çok şey kazanabiliriz ve girişimci bir genç subay bizim kendi 'Şeytan Komutanımız' olabilir."
 ITA_comandante_diavolo_eritrea_tt:0 "§Y1 $irregular_infantry$ tümeni§! ve §Y2 $cavalry$ tümeni§! oluştur."
 ITA_comandante_diavolo_ethiopia_tt:0 "§Y1 $irregular_infantry$ tümeni§!, §Y1 $cavalry$ tümeni§! ve §Y1 $camelry$ tümeni§! oluştur."
 ITA_comandante_diavolo_libya_tt:0 "§Y2 $cavalry$ tümeni§! ve §Y1 $camelry$ tümeni§! oluştur."
 ITA_comandante_diavolo_somalia_tt:0 "§Y2 $irregular_infantry$ tümeni§! ve §Y1 $cavalry$ tümeni§! oluştur."
 ITA_combined_land_and_air_warfare:0 "Birleşik Kara ve Hava Savaşı"
 ITA_combined_land_and_air_warfare_desc:0 "Regia Aeronautica'nın Regio Esercito'ya yardım etmesi, İtalyan ordusunun sahip olduğu yetenekleri göstermiştir, ancak hala ilerlemeler için yer var! Bu işbirliğini derinleştirmek, savaş alanında düşmanlarımızı mahveder ve İtalya'ya ebedi zafer getirir!"
 ITA_combined_land_and_air_warfare_ra_tt:0 "$ITA_modify_regia_aeronautica_dynamic_modifier_ns_intro$ \n$MODIFIER_AIR_MISSION_EFFICIENCY$: §G+%5§! \n$MODIFIER_AIR_CAS_PRESENT_FACTOR$: §G+%5.00§! \n\n"
 ITA_combined_land_and_air_warfare_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$ \n$MODIFIER_ARMY_ORG$: §G+%5.0§! \n$MODIFIERS_ARMY_ARMOR_ATTACK_FACTOR$: §G+%5.0§! \n\n"
 ITA_combined_research_effort:0 "Birleşik Araştırma Çabası"
 ITA_combined_research_effort_desc:0 "Silahlı kuvvetlerimizin düşmanlarımızla yüzleşmek için modern teçhizata sahip olmasını istiyorsak teknolojik ilerleme esastır. Özellikle askeri alanda sürekli bilimsel ilerlemeyi sürdürdüğümüzden emin olmak için müttefiklerimizle işbirliği yapmalıyız."
 ITA_common_ground:0 "Ortak Zemin"
 ITA_common_ground_advisors_tt:0 "Diğer anti-faşist gruplardan danışmanların kilidini açar."
 ITA_common_ground_bop_tt:0 "§Y$ITA_power_balance$§!, §YKarşıt İttifak§!'a doğru §Y%15§! kayar."
 ITA_common_ground_desc:0 "Gerçekte aynı hedefleri paylaştığımız diğer siyasi gruplarla olan farklılıkları geride bırakmalıyız. Yeni İtalyan devletini ilerlemeye doğru yönlendirmek için birlikte çalışma zamanı geldi."
 ITA_compagnie_auto_avio_sahariane:0 "Compagnie Auto Avio Sahariane'yi Genişlet"
 ITA_compagnie_auto_avio_sahariane_desc:0 "Libya'daki Otomobil-Hava Sahra Bölükleri, kendi keşif uçaklarıyla birleştirildiğinde oldukça etkili olduklarını kanıtladı. Bu tasarımı genişletmek, kuvvetlerimizi daha da zorlu hale getirmeli ve düşmanlarımıza Tanrı korkusu salmalıdır!"
 ITA_compagnie_auto_avio_sahariane_ra_tt:0 "$ITA_modify_regia_aeronautica_dynamic_modifier_ns_intro$ \n$MODIFIER_AIR_INTERCEPT_EFFICIENCY$: §G+%5§!\n$MODIFIER_GROUND_ATTACK_FACTOR$: §G+%5.0§! \n\n"
 ITA_compagnie_auto_avio_sahariane_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$ \n$MODIFIER_ORG_LOSS_WHEN_MOVING$: §G-%5.0§! \n$MODIFIER_OUT_OF_SUPPLY_FACTOR$: §G-%5.0§! \n\n"
 ITA_condemn_colonialism:0 "Sömürgeciliği Kına"
 ITA_condemn_colonialism_desc:0 "Sömürgeciliği kınama ve sayısız yıldır Afrika halkını ezen Avrupa güçlerine çağrıda bulunma zamanı geldi ve eğer iş zora binerse, Afrika halkının yararına onlara karşı savaşacağız."
 ITA_condemn_colonialism_tt:0 "§YAfrika'da sömürgeleri olan her müttefik olmayan ülke§!, sömürgelerini serbest bırakma veya yerel isyanların sonuçlarına katlanma olayı alacak."
 ITA_consolidate_power:0 "Gücü Pekiştir"
 ITA_consolidate_power_desc:0 "Parti ve genel olarak ülke üzerindeki hakimiyetimiz zayıf kalmaya devam ediyor. Sahip olduğumuz gücü pekiştirmeli ve halka her zamanki gibi güçlü ve güvenilir olduğumuzu göstererek rejimimizi desteklemeliyiz!"
 ITA_conspiracies_in_the_shadows:0 "Gölgelerdeki Komplolar"
 ITA_conspiracies_in_the_shadows_desc:0 "İktidar koridorlarındaki fısıltılar, Mussolini'ye olan memnuniyetsizliklerini giderek daha fazla dile getiriyor. Genellikle ortak çok az yanı olan insanlar arasında komplolar örülüyor ve ittifaklar kuruluyor. Değişim zamanı hızla yaklaşıyor."
 ITA_convene_the_grand_council:0 "Büyük Konseyi Topla"
 ITA_convene_the_grand_council_desc:0 "Mussolini hakkında ne yapacağımızı tartışmak için Faşizmin Büyük Konseyi'ni toplamalıyız. Etiyopya'ya yaptığı son saldırı ve güç veya sorumluluk paylaşma konusundaki isteksizliği, birçok kişinin lider olarak yeteneklerini sorgulamasına neden oldu. Ülkesine iyi hizmet etti ve faşizmin yüzüdür, ancak yeni bir liderliğin zamanı gelmiş olabilir..."
 ITA_cooperate_with_moderates:0 "Ilımlılarla İşbirliği Yap"
 ITA_cooperate_with_moderates_desc:0 "Eski faşist rejimin daha az radikal unsurlarıyla işbirliği yapmamak için bir neden yok. Bu yenilenmiş İtalyan devletini ileriye taşıyabilecek çok yetenekli insanlar var."
 ITA_cooperate_with_the_mafia:0 "Mafya ile İşbirliği Yap"
 ITA_cooperate_with_the_mafia_desc:0 "İç savaş sırasında çoğalan mafya örgütleri, onlara belirli ayrıcalıklar ve tavizler vermeye istekliysek, bölgelerindeki özel ve devlet işletmelerinin performansını iyileştirme fırsatı sunabilir."
 ITA_cooperate_with_the_mafia_dm_tt:0 "\n'§Y$ITA_mafia_on_the_rise$§!' değiştiricisine sahip her kontrol edilen eyalet:"
 ITA_cooperation_programs:0 "İşbirliği Programları"
 ITA_cooperation_programs_deal_sweden_tt:0 "([ROOT.GetFlag]§Y[ROOT.GetName]§!): §Y2 Curtatone Sınıfı Muhrip§! ve §Y2 Maestrale Sınıfı Muhrip§!'i [SWE.GetFlag]§Y[SWE.GetName]§!'e devreder."
 ITA_cooperation_programs_decisions_tt:0 "İtalyan müttefikleri ve donanmalarıyla işbirliği yapmak için §Y$ITA_naval_cooperation_programs_dec_cat$§! Kararlarının kilidini açar."
 ITA_cooperation_programs_desc:0 "Sağlam gemi inşa ve silah sanayimiz, Yunanistan’ın Hydra sınıfı muhripleri gibi diğer uluslar için savaş gemileri inşa etme veya SSCB'ye Proje 7 gemileri için sağlanan gibi tasarıma yardımcı olma konusunda yakın bir geçmişe sahiptir. Benzer fırsatlar aramak, sanayi tabanımızı önümüzdeki denemeler için daha da geliştirmeye yardımcı olabilir."
 ITA_cooperatives_for_intensive_exploitation:0 "Yoğun Sömürü için Kooperatifler"
 ITA_cooperatives_for_intensive_exploitation_desc:0 "Afrika, büyük kaynak yataklarına sahip zengin bir kıtadır, bu yatakları sömürme yollarımızı iyileştirmek için yatırım yapmalı ve onlardan en iyi şekilde yararlanmalıyız."
 ITA_cooperatives_for_intensive_exploitation_tt:0 "§YUyum Artışı§!, §YYerel İkmal§! ve §YYerel Kaynaklar§!, kaynak üreten §YAfrika'daki her sahip olunan ve kontrol edilen eyalette§! artırılacaktır."
 ITA_corpo_di_truppe_volontarie:0 "Corpo di Truppe Volontarie"
 ITA_corpo_di_truppe_volontarie_desc:0 "$ITA_support_nationalist_spain_desc$"
 ITA_corpo_volontari_della_liberta:0 "Corpo Volontari della Libertà"
 ITA_corpo_volontari_della_liberta_desc:0 "Ulusal Kurtuluş Komitesi, daha fazla sayıda partizan ve silahlı kuvveti verimli bir şekilde yönetmek ve koordine etmek için askeri koordinasyon yapımız olan Corpo Volontari della Libertà'yı güçlendirmeye kararlıdır."
 ITA_corpo_volontari_della_liberta_spawn_divs_capital_tt:0 "§Y[THIS.GetName]§!'da §Y2 $infantry$§! tümeni oluştur. \n\n"
 ITA_corpo_volontari_della_liberta_spawn_divs_tt:0 "§Y5 adede kadar tam kontrollü çekirdek eyalette§! §Y2 $militia$§! tümeni oluştur. \n\n"
 ITA_cruiser_submarines:0 "Kruvazör Denizaltıları"
 ITA_cruiser_submarines_desc:0 "Akdeniz'in dışında yatan düşmanların deniz yollarına saldırmak için, okyanuslarda dolaşabilen uzun menzilli denizaltılara ihtiyacımız var. Büyük ölçüde mühendisler Cavallini ve Bernardis'in çalışmalarına dayanan kapsamlı I. Dünya Savaşı sonrası denizaltı programımıza daha fazla destek sağlamak, bu hedefe ulaşmamıza yardımcı olacaktır."
 ITA_crush_opposition:0 "Muhalefeti Ez"
 ITA_crush_opposition_bop_tt:0 "§Y$ITA_grand_council$§!, §YGüç Dengesi§! aracılığıyla §Y[ROOT.GetFlag][ROOT.GetNameDef]§!'de mevcut lideri deviremez veya bir İç Savaş başlatamaz."
 ITA_crush_opposition_desc:0 "Hala politikalarımıza karşı çıkan ve yeni hükûmetimizin çalışmalarını engelleyen eski faşist rejimin birçok destekçisi var. Onlarla başa çıkma zamanı geldi."
 ITA_crush_the_mafia:0 "Mafyayı Ez"
 ITA_crush_the_mafia_desc:0 "Mafya ve sayısız kaçakçı, haraççı ve genel olarak suçlu çeteleri iç savaş sırasında yeniden ortaya çıktı. Onları kökünden kazımak ve ülkeye güvenlik ve istikrarı geri getirmek İtalyan halkına karşı görevimizdir."
 ITA_culto_del_duce:0 "Culto del Duce"
 ITA_culto_del_duce_desc:0 "Benito Mussolini, Afrika Fatihi, Adwa'nın İntikamcısı, şüphesiz Roma İmparatorları'nın günlerinden beri en önemli İtalyan devlet adamıdır. O, erkekliğin mutlak zirvesidir, tamamen korkusuzdur. Her İtalyan'ın, sonsuza dek Mussolini'ye olabildiğince benzer olmaya çabalaması gerektiğini bildiğinden emin olmalıyız."
 ITA_decima_flottiglia_mas:0 "Decima Flottiglia MAS"
 ITA_decima_flottiglia_mas_desc:0 "Genio Navale'den Teseo Tesei ve Elios Toschi, düşman limanlarına sızmak için kullanılabilecek kendinden tahrikli bir torpido tasarladılar - bu ve diğer benzersiz silahların geliştirilmesini finanse ederek ve bunları kullanmak için özel bir operasyon birimi eğiterek, düşmanlarımız üzerinde dramatik, beklenmedik zaferler elde edebiliriz."
 ITA_decima_flottiglia_mas_rm_tt:0 "$ITA_modify_regia_marina_dynamic_modifier_ns_intro$ \n$MODIFIER_SUB_RETREAT_SPEED$: §G+%5§! \n$MODIFIER_CONVOY_RAIDING_EFFICIENCY_FACTOR$: §G+%2.00§! \n$MODIFIER_NAVAL_CRITICAL_SCORE_CHANCE_FACTOR$: §G+%2.00§! \n\n"
 ITA_defeat_in_ethiopia_flag:0 "[ITA.GetNameDefCap], [ETH.GetNameDef]'de yenildi"
 ITA_defend_the_land:0 "Toprağı Savun"
 ITA_defend_the_land_desc:0 "Sovyetler Birliği ve politikaları, proletaryayı ve Marksist ideolojiyi başarısızlığa uğrattı. İtalyan halkı komünizme doğru kendi yolunu tutacak, üstesinden gelmemiz gereken engeller ve tehditlerle dolu bir yol, ama umarım birbirine yardım edecek yoldaşlar ve müttefiklerle de dolu."
 ITA_defend_the_land_faction_tt:0 "'§Y[ROOT.GetName] bizi $ITA_united_socialist_front$'a davet ediyor'§! olayını alır."
 ITA_defend_the_land_invite_tt:0 "§YBir ittifakın parçası olmayan her bağımsız komünist ülke§!, §Y$ITA_united_socialist_front$§!'e davet edilecektir."
 ITA_defense_against_capitalism:0 "Kapitalizme Karşı Savunma"
 ITA_defense_against_capitalism_desc:0 "Faşizm ilk ve en büyük ideolojik düşmanımızdır, ancak tek değildir. Kapitalistler ülkemiz ve proleter devrimimiz için korkunç bir tehdit oluşturuyor. Onlarla yüzleşmeye hazır olmalıyız."
 ITA_defense_against_capitalism_ws_tt:0 "\nDemokratik komşu başına §G%2.00§! Temel Savaş Desteği kazanır (maksimum §Y+%10.00§!).\n\n"
 ITA_defy_the_duce:0 "Duce'ye Meydan Oku"
 ITA_defy_the_duce_desc:0 "Faşist rejime karşı ayaklanma ve İtalyan halkı için temsil ettiği belayı ortadan kaldırma zamanı geldi. \nİtalya'nın işçileri ve köylüleri, silaha sarılın!"
 ITA_demand_balearic_islands_bba:0 "Balear Adalarını Talep Et"
 ITA_demand_balearic_islands_bba_desc:0 "$ITA_demand_balearic_islands_desc$"
 ITA_demand_ticino:0 "Ticino'yu Talep Et"
 ITA_demand_ticino_desc:0 "Dağlık İsviçre devleti birçok farklı etnik kökene ev sahipliği yapıyor, ancak bunların arasında çoğunlukla ülkenin güney kantonlarında, örneğin Ticino'da bulunan İtalyanlar var. Büyük bir İtalyan devleti güvence altına almak için, tüm halkımızın tek bir ülke içinde yaşayabildiğinden emin olmalıyız."
 ITA_democratic_king:0 "Demokratik Kral"
 ITA_democratic_king_desc:0 "İtalyan monarşisinin, Kral'ın ana lider olarak figürünü korurken, daha demokratik bir devlete doğru bir adım atma zamanı geldi."
 ITA_depose_mussolini:0 "Mussolini'yi Devir"
 ITA_depose_mussolini_desc:0 "Mussolini'yi iktidardan indirme zamanı geldi! Sevgili İtalya'mızı birçok gereksiz zorluktan geçiren ve dayanıklılığını kırılma noktasının çok ötesine taşıyan beceriksiz bir lider olduğunu kanıtladı. Gölgesi bir süre daha üzerimizde büyük bir şekilde dursa da, İtalya ve halkı galip gelecektir!"
 ITA_deus_vult:0 "Deus Vult"
 ITA_deus_vult_desc:0 "Katolik Kilisesi yüzyıllardır Avrupa'da bir umut ve istikrar feneri olmuştur ve önümüzdeki karanlık zamanlarla karşı karşıya kalırken bir kez daha bu ışık feneri olmalıyız. \nTanrı bunu istiyor!"
 ITA_devaluate_the_lire:0 "Lirayı Devalüe Et"
 ITA_devaluate_the_lire_desc:0 "Savaş, istediğimizden çok daha maliyetli oldu. Ekonomimiz artçı etkiler altında zorlanıyor. Para birimimizi devalüe etmek, ürünlerimizi uluslararası pazarda daha rekabetçi hale getirecek, ancak ortalama bir İtalyan'ın hayatını biraz daha zorlaştıracak - seve seve yapacakları gerekli bir fedakarlık."
 ITA_develop_eritrea:0 "Eritre'yi Geliştir"
 ITA_develop_eritrea_desc:0 "Eritre, Afrika kıtasındaki en eski sömürgemizdir ve kolayca en değerlilerinden biridir. Mükemmel stratejik konumuyla, kolayca sömürge imparatorluğumuzun bir temel taşı haline getirilebilir."
 ITA_develop_ethiopia:0 "Etiyopya'yı Geliştir"
 ITA_develop_ethiopia_desc:0 "İnatçı Etiyopyalılar uzun süredir bize meydan okudu ve bizi aşağıladı. Şimdi nihayet dize getirildiklerine göre, ülkelerini geliştirebilir ve onlara istilamızın kendi iyilikleri için olduğunu gösterebiliriz."
 ITA_develop_ethiopia_tt:0 "§Y[ROOT.GetFlag][ROOT.GetNameDef]§! veya bir §Y[ROOT.GetAdjective] bağlı devleti§! tarafından kontrol edilen §Y3§! kadar [ETH.GetAdjective] eyaletine §Y1 $infrastructure$§! ve §G1§! İnşaat Alanı ekler."
 ITA_develop_libya:0 "Libya'yı Geliştir"
 ITA_develop_libya_desc:0 "Libya en yakın sömürgemizdir ve en yüksek potansiyele sahip olandır. Bölgeyi sakinleştirmedeki uzun ve zorlu çalışmamızın tüm ödüllerini toplamaya başlamadan önce, altyapısını iyileştirmeliyiz."
 ITA_develop_libya_tt:0 "§Y[ROOT.GetFlag][ROOT.GetNameDef]§! veya bir §Y[ROOT.GetAdjective] bağlı devleti§! tarafından kontrol edilen §Y3§! kadar [LBA.GetAdjective] eyaletine §Y1 $infrastructure$§! ve §G1§! İnşaat Alanı ekler."
 ITA_develop_somaliland:0 "Somaliland'ı Geliştir"
 ITA_develop_somaliland_desc:0 "İlk bakışta, Afrika Boynuzu'ndaki bölge pek fazla ekonomik veya stratejik potansiyele sahip gibi görünmüyor. Ancak birkaç iyi yerleştirilmiş yatırımla, bölgeyi Hint Okyanusu'na daha fazla ilerleme için bir sıçrama tahtasına dönüştürebiliriz."
 ITA_devotion:0 "Adanmışlık"
 ITA_devotion_desc:0 "İtalyan halkı Mussolini'ye büyük bir borçludur. O, sırf irade gücüyle, onları her anlamlı şekilde geliştirdi. Daha cesur, daha zengin, ahlaken daha tam insanlar. İtalyan halkının karşılığında yapabileceği en az şey, teşekkür etmek ve onun emirlerini takip etmektir."
 ITA_dino_grandi_focus:0 "Dino Grandi"
 ITA_dino_grandi_focus_desc:0 "Eğer refaha ereceksek, diplomatik olarak zeki ve eski kurumları yeniden organize etmekten korkmayan birine ihtiyacımız var. Dino Grandi dışişleri bakanı olarak görev yaptı ve diplomatik sınıfları reforme ederek onları soylular dışındaki diğer insanlara da açtı. Gerekli reformları yapmaktan ve İtalya'yı yeni ve parlak bir geleceğe taşımaktan çekinmeyecektir!"
 ITA_disband_the_blackshirts:0 "Kara Gömleklileri Dağıt"
 ITA_disband_the_blackshirts_desc:0 "Kara Gömlekliler, faşizmin hizmetinde çok tehlikeli bir örgüttür, bu yüzden faşist rejimleri gibi onların da ortadan kalkma zamanı geldi. Tüm aktif birimleri derhal dağıtacağız."
 ITA_diving_bombers:0 "Dalgalı Bombardıman Uçakları"
 ITA_diving_bombers_desc:0 "Yakın Hava Desteği konusu askeri çevrelerde önemli ölçüde önem kazanmıştır. Uçaklar uzun süredir bomba atmak için kullanılıyor olsa da, birkaç ülkenin yüksek irtifadan dalarak eşsiz bir hassasiyetle bomba bırakabilen özel uçaklar geliştirmeye başladığı görülüyor. Sanayimiz şüphesiz zamanla böyle bir uçak üretebilir, ancak bu amaç için tasarımları olan başka ülkeler de var."
 ITA_divino_duce:0 "Divino Duce"
 ITA_divino_duce_desc:0 "Açıkça ortaya çıkan şey, tek bir kişinin bir ülke ve halkı üzerindeki etkisidir. Belki bu, kullanabileceğimiz ve uyarlayabileceğimiz bir şeydir. Devlet kanallarımızı kullanarak yeni Duce'mizi İtalya'yı birleştirebilecek güçlü ve yetenekli bir lider olarak tanıtabiliriz. Halka inanacakları olağanüstü birini vereceğiz - inançlarını koyacakları ilahi birini!"
 ITA_divisioni_alpine:0 "Divisioni Alpine"
 ITA_divisioni_alpine_desc:0 "Büyük Savaş anımız sonsuza dek yüksek alplerdeki acımasız çatışmaları içerecektir. Eğer bir daha ülkemizi yabancı bir istilaya karşı savunmak zorunda kalırsak, bu kesinlikle kuzeyden gelecek ve misafirperver olmayan dağlarda daha fazla savaş gerektirecektir. O arazide etkili bir şekilde savaşabilecek askerlere sahip olmalıyız."
 ITA_divisioni_alpine_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$ \n$MODIFIER_SPECIAL_FORCES_CAP$: §G+%2.0§! \n$modifier_army_sub_unit_mountaineers_defence_factor$: §G+%3.00§! \n$modifier_army_sub_unit_mountaineers_max_org_factor$: §G+%5.00§! \n\n"
 ITA_economic_reforms:0 "Ekonomik Reformlar"
 ITA_economic_reforms_desc:0 "Ekonomi büyük ölçüde eski rejim altında durgunlaştı, ancak yenilenmiş bir Partito Nazionale Fascista ile bu devasa görevi üstlenmeye hazırız! Artık ekonomiyi canlandırmak için nitelikli yetkin insanları atamakta özgürüz."
 ITA_economic_reforms_ricostruzione_industriale_tt:0 "$ITA_modify_ricostruzione_industriale_dynamic_modifier_ns_intro$ \n$MODIFIER_CONSUMER_GOODS_FACTOR$: §Y-%2.5§! \n$modifier_production_speed_arms_factory_factor$: §G+%5.00§! \n$modifier_production_speed_industrial_complex_factor$: §G+%5.00§! \n\n"
 ITA_empower_the_carabinieri:0 "Carabinieri'yi Güçlendir"
 ITA_empower_the_carabinieri_desc:0 "Carabinieri, mafyayı kökünden kazımada ve ülkede barış ve güvenliği korumada kilit bir rol oynamaktadır. Bu polis gücünü güçlendirme ve ek görevler yapmalarını sağlama zamanı geldi."
 ITA_empower_the_unions:0 "Sendikaları Güçlendir"
 ITA_empower_the_unions_desc:0 "İtalyan proleter sınıfında büyük bir potansiyel var. İşçi sendikalarının ülkemizin iş gücünü düzenlemek ve optimize etmek için gerekli araçlara ve yetkiye sahip olduğundan emin olmalıyız."
 ITA_empower_the_unions_military_industry_dm_tt:0 "$ITA_modify_military_industry_dynamic_modifier_ns_intro$ \n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+%5.00§! \n$MODIFIER_INDUSTRIAL_CAPACITY_DOCKYARD_FACTOR$: §G+%5.00§! \n$MODIFIER_PRODUCTION_FACTORY_EFFICIENCY_GAIN_FACTOR$: §G+%5.00§! \n\n"
 ITA_end_fiat_ansaldo_duopoly:0 "Fiat-Ansaldo Tekelini Bitir"
 ITA_end_fiat_ansaldo_duopoly_desc:0 "Mekanik ve motorlu mühendislik sektörümüz uzun zamandır iki şirket tarafından domine edildi: Fiat ve Ansaldo. Bu iki şirket kesinlikle dünya standartlarında mühendislik firmaları olsa da, piyasada hiçbir rakip hayatta kalamadığı için büyümeyi bir şekilde engelledi. Uzun vadede sağlıklı bir mühendislik sektörüne sahip olmak istiyorsak bu tekeli kırmalıyız."
 ITA_end_fiat_ansaldo_duopoly_heavy_templates_tt:0 "\n§Y$improved_heavy_tank_chassis$§! teknolojisi araştırıldığında:\n"
 ITA_end_fiat_ansaldo_duopoly_medium_templates_tt:0 "\n§Y$improved_medium_tank_chassis$§! teknolojisi araştırıldığında:\n"
 ITA_end_fiat_ansaldo_duopoly_military_industry_tt:0 "$ITA_modify_military_industry_dynamic_modifier_ns_intro$ \n$armor_research$: §G+%15§! \n$infantry_weapons_research$: §G+%15§! \n$artillery_research$: §G+%15§! \n$air_equipment_research$: §G+%15§! \n$naval_equipment_research$: §G+%15§! \n$MODIFIER_PRODUCTION_LACK_OF_RESOURCE_PENALTY_FACTOR$: §G-%10.00§! \n\n"
 ITA_enlist_the_bashkimi_kombetar:0 "Bashkimi Kombëtar'ı Askere Al"
 ITA_enlist_the_bashkimi_kombetar_desc:0 "Arnavutluk'tan hükûmetimize ve ideolojimize sempati duyan ve Kızıl Gömlekliler birimlerine katılmak isteyen sayısız vatandaş var. Bu acemilerden oluşan yeni birimler organize etmek için gönüllü milislerimizin yeni bir kolunu oluşturmalıyız."
 ITA_enlist_the_bashkimi_kombetar_spawn_divs_tt:0 "§Y[THIS.GetName]§!'da §Y4 Camicie Rosse§! tümeni oluştur."
 ITA_ethiopian_railways:0 "Etiyopya Demiryolları"
 ITA_ethiopian_railways_desc:0 "Az gelişmiş Etiyopya demiryolu ağı, sömürgenin ekonomik gelişimini engelliyor. İtalyan uzmanları göndererek, onu hızla İtalyan standartlarına getirebilir ve İmparatorluğun her yerinde trenlerin her zaman zamanında çalışmasını sağlayabiliriz."
 ITA_ethiopian_war_logistics_bba:0 "Etiyopya Savaş Lojistiği"
 ITA_ethiopian_war_logistics_bba_desc:0 "Etiyopya'daki ilerleme eksikliğinden, modern bir ordunun gerçekten ne kadar çok malzemeye ihtiyacı olduğunu hafife aldığımız açıkça görülüyor. Gerekli malzemelerin cepheye ulaşmasını sağlamak için Doğu Afrika'daki mülklerimizde yolları ve limanları iyileştirmek için özel bir çaba göstermeliyiz."
 ITA_european_democracies:0 "Avrupa Demokrasileri"
 ITA_european_democracies_bonus_per_ally_tt:0 "\n[ROOT.GetName]'ın ittifakındaki her bağımsız demokratik ülke başına §G+%2.00§! İstikrar ve §G+25§! Siyasi Güç kazanır (maksimum §Y+%10.00§! İstikrar ve §Y+125§! Siyasi Güç).\n\n"
 ITA_european_democracies_desc:0 "Demokratik Avrupa ülkeleri arasındaki dayanışma ve işbirliği politikalarımıza devam etmeliyiz. Diplomasi yoluyla, başka herhangi birine karşı koyabilecek güçlü bir ittifak kurabiliriz."
 ITA_european_democracies_tt:0 "§YAvrupa ülkeleri§!, İtalya'dan gelen diplomatik talepleri kabul etmeye daha yatkın olacak."
 ITA_expand_foggia_farm_fields:0 "Foggia Çiftlik Tarlalarını Genişlet"
 ITA_expand_foggia_farm_fields_desc:0 "Foggia bölgesi uzun zamandır tüm İtalya'yı besleyen tahıl ambarı olmuştur. Savaş başladığında, tarlalarda çalışan birçok erkeği orduya almak zorunda kalacağız. Nüfusumuzu beslemeye devam etmek istiyorsak bölgedeki tarımı modernize etmeli ve genişletmeliyiz."
 ITA_expand_intelligence_services:0 "İstihbarat Servislerini Genişlet"
 ITA_expand_intelligence_services_desc:0 "Bu yeni çağda, bilgi güçtür. Yabancı gizli servislerle rekabet edebilmemiz için farklı istihbarat dallarımızı genişletmeliyiz."
 ITA_expand_national_universities:0 "Ulusal Üniversiteleri Genişlet"
 ITA_expand_national_universities_desc:0 "Bizim gibi teknolojik olarak gelişmiş bir ulus için her zaman daha fazla mühendise ihtiyaç vardır. Ülkemizi rekabetçi tutmak için yeterli sayıda yeni uzman yetiştirmede en büyük darboğazın üniversitelerimiz olduğunu tespit ettik."
 ITA_expand_naval_facilities:0 "Deniz Tesislerini Genişlet"
 ITA_expand_naval_facilities_desc:0 "Birinci sınıf bir donanma sadece güçlü bir savaş filosuna değil, aynı zamanda onu destekleyecek limanlara ve tersanelere de ihtiyaç duyar. Deniz altyapımıza yatırım yaparak, savaş çıktığında donanmamızın ihtiyaç duyduğu üslere ve inşaat ile onarım kapasitesine sahip olacaktır."
 ITA_expand_naval_intelligence:0 "Deniz İstihbaratını Genişlet"
 ITA_expand_naval_intelligence_desc:0 "İtalyan sinyal istihbaratı yıllardır küçük bir bütçeyle çalıştı, büyük ölçüde Giorgio Verità Poeta ve Luigi Donini'nin kayda değer yeteneklerine güvendi, ancak bu sadece bir yere kadar gidecektir. Onlara daha fazla personel sağlayarak ve Teğmen Eliso Porto gibi yeni yetenekleri işe alarak, düşmanların kodlarını kırma ve kuvvetlerinin yerini keşfetme şansımız daha yüksek olacaktır."
 ITA_expand_naval_intelligence_rm_tt:0 "$ITA_modify_regia_marina_dynamic_modifier_ns_intro$ \n$MODIFIER_DECRYPTION$: §G+%5.00§! \n$MODIFIER_NAVY_INTEL_FACTOR$: §G+%10.00§! \n\n"
 ITA_expand_rome_flying_school:0 "Roma Uçuş Okulunu Genişlet"
 ITA_expand_rome_flying_school_desc:0 "Modern uçakların artan karmaşıklığıyla birlikte, pilotlar yetersiz eğitilirse kaza riski de artar. Uçuş okullarımızın eğitim kalitesi açısından teknik gelişmelerle ve büyüyen ordumuzun neden olduğu yeni pilot talebiyle aynı hızda ilerlediğinden emin olmalıyız."
 ITA_expand_rome_flying_school_ra_tt:0 "$ITA_modify_regia_aeronautica_dynamic_modifier_ns_intro$ \n$MODIFIER_AIR_ACE_GENERATION_CHANCE$: §G+%5.00§! \n$MODIFIER_AIR_TRAINING_XP_FACTOR$: §G+%5§! \n$MODIFIER_AIR_NIGHT_PENALTY$: §G-%10.00§! \n$MODIFIER_AIR_WEATHER_PENALTY$: §G-%10.00§! \n\n"
 ITA_expand_the_royal_guard:0 "Kraliyet Muhafızlarını Genişlet"
 ITA_expand_the_royal_guard_desc:0 "İtalyan monarşisine sadık ve ihtiyaç duyulması halinde her türlü askeri operasyonda farklı roller üstlenebilecek güvenilir birliklere sahip olmak için Kraliyet Muhafız Kolordusunu güçlendirecek ve genişleteceğiz."
 ITA_expand_the_royal_guard_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$ \n$modifier_army_sub_unit_cavalry_defence_factor$: §G+%5.00§! \n\n"
 ITA_expanded_corporatism:0 "Genişletilmiş Korporatizm"
 ITA_expanded_corporatism_desc:0 "Korporatizm, faşizmin temel bir fikridir ve yeni edindiğimiz tüm topraklarda mümkün olan en geniş ölçüde uygulamamız gereken bir şeydir. Ancak bunu yapmak için yerel elitlere ve yeteneklere güvenmemiz ve faşist hiyerarşide ilerleme kapısını açmamız gerekecektir. Bu, yeni egemenliğimizde sadakat ve verimlilik aşılamanın kolay bir yoludur."
 ITA_expanded_corporatism_military_industry_tt:0 "$ITA_modify_military_industry_dynamic_modifier_ns_intro$ \n$MODIFIER_PRODUCTION_LACK_OF_RESOURCE_PENALTY_FACTOR$: §G-%5.00§! \n\n"
 ITA_expanded_corporatism_ricostruzione_industriale_tt:0 "$ITA_modify_ricostruzione_industriale_dynamic_modifier_ns_intro$ \n$modifier_production_speed_arms_factory_factor$: §G+%5.00§! \n$modifier_production_speed_industrial_complex_factor$: §G+%5.00§! \n\n"
 ITA_extraction_industry:0 "Maden Çıkarma Sanayisi"
 ITA_extraction_industry_desc:0 "Üretim hatlarımızın talebini karşılamak için kaynak çıkarma sanayimizi genişletmeliyiz. Hammadde eksikliğinin askeri üretimimizi tehlikeye atmasına izin veremeyiz."
 ITA_extraction_industry_iri_tt:0 "$ITA_modify_ricostruzione_industriale_dynamic_modifier_ns_intro$ \n$MODIFIER_LOCAL_RESOURCES_FACTOR$: §G+%10.00§! \n\n"
 ITA_extraction_industry_military_industry_tt:0 "$ITA_modify_military_industry_dynamic_modifier_ns_intro$ \n$MODIFIER_PRODUCTION_LACK_OF_RESOURCE_PENALTY_FACTOR$: §G-%15.00§! \n\n"
 ITA_extraction_industry_oil_tt:0 "\nZaten petrol üreten her tam kontrollü eyalete §Y2§!£resources_strip|1 üretimi ekler."
 ITA_fanti_dell_aria:0 "Fanti dell'Aria"
 ITA_fanti_dell_aria_desc:0 "Büyük Savaş sırasındaki İsonzo Cephesi'nin kanlı çıkmazı, bizi iyi hazırlanmış bir düşmana karşı cepheden saldırılara zorladı. Bir atılım gerçekleştirmenin tek yolu, kimsenin olmadığı topraklardan geçip düşman siperini almaktı. Modern uçaklar, bir grup askeri hızla, düşmanın geri bölgelerine kadar taşıyabilir. Paraşütle inerek, düşman cephe hattını istikrarsızlaştırmak için stratejik hedefleri alabilirler."
 ITA_fanti_dell_aria_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$ \n$MODIFIER_SPECIAL_FORCES_CAP$: §G+%2.0§! \n$MODIFIER_SPECIAL_FORCES_OUT_OF_SUPPLY_FACTOR$: §G-%10.00§! \n$modifier_army_sub_unit_paratrooper_max_org_factor$: §G+%5.00§! \n\n"
 ITA_fanti_dell_aria_spawn_divs_libya_tt:0 "§Y[THIS.GetName]§!'da §Y1 Paraşütçü§! tümeni oluştur."
 ITA_fanti_dell_aria_spawn_divs_tt:0 "§Y[THIS.GetName]§!'da §Y3 Paraşütçü§! tümeni oluştur."
 ITA_ferrea_mole_ferreo_cuore:0 "Ferrea Mole Ferreo Cuore"
 ITA_ferrea_mole_ferreo_cuore_desc:0 "Tank kolordumuz şüphesiz büyük askeri cesaret eylemleri için çağrılacaktır. Bunun için, sadece demir gövdelerle dolaşmak yeterli olmayacak, aynı zamanda Demir Kalplere de sahip olmaları gerekecek."
 ITA_ferrea_mole_ferreo_cuore_heavy_tempaltes_tt:0 "\n§Y$advanced_heavy_tank_chassis$§! teknolojisi araştırıldığında:\n"
 ITA_ferrea_mole_ferreo_cuore_medium_tempaltes_tt:0 "\n§Y$advanced_medium_tank_chassis$§! teknolojisi araştırıldığında:\n"
 ITA_ferrea_mole_ferreo_cuore_military_industry_tt:0 "$ITA_modify_military_industry_dynamic_modifier_ns_intro$ \n$ITA_ferrea_mole_ferreo_cuore_dynamic_modifier_tt$ \n\n"
 ITA_fighter_designs:0 "Avcı Uçağı Tasarımları"
 ITA_fighter_designs_desc:0 "Avcı uçakları her hava kuvvetinin bel kemiğidir. Avcı uçaklarımızın göklerde hava üstünlüğü kurma ve bombardıman uçaklarımızı hedeflerine giderken koruma imkanlarına sahip olduğundan emin olmalıyız."
 ITA_fiocchi_munizioni:0 "Fiocchi Munizioni"
 ITA_fiocchi_munizioni_desc:0 "Fiocchi, uzun zamandır silahlı kuvvetlerimize yüksek kaliteli mühimmat tedarik etmiştir. Gelecek savaşlarda istikrarlı bir mühimmat tedariki hayati önem taşır ve bu nedenle Fiocchi fabrikalarının göreve hazır olduğundan emin olmalıyız."
 ITA_flotta_d_evasione:0 "Flotta d'Evasione"
 ITA_flotta_d_evasione_admiral_traits_tt:0 "İki rastgele Amiral, §Y$bold$§! özelliğini kazanacak: \n- $MODIFIER_NAVAL_SPEED$: §G+%10§! \n- $MODIFIER_NAVAL_DAMAGE_FACTOR$: §G+%5.00§! \n\n"
 ITA_flotta_d_evasione_desc:0 "Çok uzun zamandır İtalya, denizcilik hırslarını Akdeniz ve Kızıldeniz ile sınırlamaktan memnundu. Bir ‘Kaçış Filosu’na bağlı kalarak ve Atlantik ve Hint Okyanusları için tasarlanmış gemiler inşa ederek, etkimizi dünya okyanuslarına yayabileceğiz."
 ITA_flotta_d_evasione_dockyards_tt:0 "\n§YKuzey Afrika§!, §Yİberya'nın Batı kıyısı§! ve §YFransa'nın Batı kıyısı§!'ndaki belirli eyaletler, §Y[ROOT.GetFlag][ROOT.GetName]§! veya bir §Y[ROOT.GetAdjective] bağlı devleti§! tarafından tamamen kontrol edildiği sürece §Y1 $dockyard$§! alacaktır."
 ITA_focus_sh_tank_template_tt:0 "\n§Y$super_heavy_tank_chassis$§! teknolojisi araştırıldığında:\n"
 ITA_follow_the_soviet_union:0 "Sovyetler Birliği'ni Takip Et"
 ITA_follow_the_soviet_union_desc:0 "Zaten Sovyetler Birliği tarafından işaretlenmiş komünizme giden açık bir yol var, yeni cumhuriyete koyduğumuz çabaların meyve vermesini ve gerçek bir komünist devlet elde etmesini istiyorsak onu takip etmeliyiz."
 ITA_foreign_affairs:0 "Dış İşleri"
 ITA_foreign_affairs_desc:0 "Her büyük gücün net dış politika hedefleri belirlemesi ve bu hedeflere ulaşacak şekilde diplomasi yürütecek yetenekli insanlara sahip olması gerekir."
 ITA_foreign_affairs_focus_lock_tt:0 "§R§Y$ITA_unite_the_opposition$§! ve §Y$ITA_defy_the_duce$§! odakları bu odak tamamlandıktan sonra kilitlenecektir§!."
 ITA_foreign_affairs_focus_locked_tt:0 "§R§Y$ITA_foreign_affairs$§! odağı bu odak tamamlandıktan sonra kilitlenecektir§!."
 ITA_forza_navale_especiale:0 "Forza Navale Speciale"
 ITA_forza_navale_especiale_desc:0 "Amfibi çıkarma yapma kapasitesi, Akdeniz'deki herhangi bir çatışma için paha biçilmez olacaktır. Amfibi operasyonlar için eğitilmiş ve donatılmış özel bir Deniz Kuvveti kurarak, uzun Akdeniz kıyı şeridinin herhangi bir noktasından denizden güç yansıtabileceğiz."
 ITA_forza_navale_especiale_rm_tt:0 "$ITA_modify_regia_marina_dynamic_modifier_ns_intro$ \n$MODIFIER_NAVAL_INVASION_PREPARATION$: §G-%10.0§! \n$MODIFIER_NAVAL_INVASION_DIVISION_CAP$: §G+2§! \n$MODIFIER_AMPHIBIOUS_INVASION$: §G+%5.0§! \n$MODIFIER_SPECIAL_FORCES_CAP$: §G+%2.0§! \n\n"
 ITA_franco_italian_pact:0 "Fransız-İtalyan Paktını İmzala"
 ITA_franco_italian_pact_desc:0 "Fransa ile olan askeri işbirliğimiz büyük değer taşıdı, bir saldırmazlık paktı da öyle olurdu. Sadece Avrupa'daki Batı kanadımızı değil, aynı zamanda Afrika'daki mülklerimizin büyük bir bölümünü de güvence altına alırdık, bu da bizi başka yerlere odaklanmak için serbest bırakırdı."
 ITA_fronte_militare_clandestino:0 "Fronte Militare Clandestino"
 ITA_fronte_militare_clandestino_desc:0 "Her İtalyan şehrindeki Direniş hücrelerine bağlı ve silahlı kuvvetlerimizle bağlantılı gizli bir askeri örgüt organize edeceğiz, askeri operasyonlarımızı ve cephe gerisindeki partizan eylemlerini koordine etmek için."
 ITA_fronte_militare_clandestino_modifier_tt:0 "§Y$ITA_fronte_militare_clandestino_modifier$ (İtalya)§! (§Y730§! gün) ekle, şunları sağlar: \n $MODIFIER_RESISTANCE_GROWTH_ON_OUR_OCCUPIED_STATES$: §G+%10§! \n $MODIFIER_REQUIRED_GARRISON_FACTOR$: §R+%15§! \n\n"
 ITA_fronte_militare_clandestino_spawn_divs_friendly_rome_tt:0 "§Y[THIS.GetName]§!'da §Y2 $infantry$§! tümeni ve §Y2 $militia$§! tümeni oluştur. \n\n"
 ITA_fronte_militare_clandestino_spawn_divs_hostile_rome_tt:0 "§Y[This.GetName]§!'da §Y1 $infantry$§! tümeni ve §Y1 $militia$§! tümeni oluştur. \n\n"
 ITA_gappisti:0 "Gappisti"
 ITA_gappisti_desc:0 "Gruppi di Azione Patriottica'yı, yani Fransız Direnişi'ne benzer şekilde, çoğunlukla şehirlerde faaliyet gösterecek küçük partizan birimlerini oluşturacağız. Gappisti'lerimiz düşmanı cephe gerisinde sert bir şekilde vuracak, garnizonların moralini bozacak ve yerel halkın desteğini kazanacaktır."
 ITA_gappisti_state_modifier_rds_tt:0 "$ITA_modify_partisan_state_modifier_intro$ \n$MODIFIER_RESISTANCE_TARGET_ON_OUR_OCCUPIED_STATES$: §G+%10§! \n$MODIFIER_RESISTANCE_DAMAGE_TO_GARRISONS_ON_OUR_OCCUPIED_STATES$: §G+%10§! \n\n"
 ITA_gappisti_state_modifier_rsi_tt:0 "$ITA_modify_partisan_state_modifier_intro$ \nDireniş Hedefi $ITA_in_our_controlled_states_cw$: §R+%10§! \nGarnizonlarımıza Hasar $ITA_in_our_controlled_states_cw$: §R+%10§! \n\n"
 ITA_german_military_cooperation:0 "Alman Askerî İşbirliği"
 ITA_german_military_cooperation_desc:0 "$ITA_german_millitary_cooperation_desc$"
 ITA_gloria_al_regno_d_italia:0 "Gloria al Regno d'Italia"
 ITA_gloria_al_regno_d_italia_desc:0 "Monarşinin modası geçmiş bir yönetim sistemi olduğunu iddia edenler, soylu ve sağlam bir el altında mütevazı bir ulusun nasıl dünyanın en büyük güçlerinden biri olabileceğini göremeyen aptallardır. \nYaşasın kral!"
 ITA_grande_rivolta_rurale:0 "Grande Rivolta Rurale"
 ITA_grande_rivolta_rurale_desc:0 "İtalyan köylülüğünün davamıza katılıp faşist zalimlere karşı silahlanma zamanı geldi. Düşmanın kırsal alanlarda artık hiç şansı kalmayacak!"
 ITA_gruppi_di_difesa_della_donna:0 "Gruppi di Difesa della donna"
 ITA_gruppi_di_difesa_della_donna_desc:0 "Farklı siyasi oluşumlardan devrimci kadınlar, savaş durumunda tüm sınıflarda ve sosyal tabakalarda aktif katılım ve güçlerin seferberliği için kadın savunma grupları oluşturmayı teklif ettiler."
 ITA_guarantee_austrian_independence:0 "Avusturya'nın Bağımsızlığını Garanti Et"
 ITA_guarantee_austrian_independence_desc:0 "Avusturya'ya Alman müdahalesine tolerans gösteremeyiz, çünkü bu İtalyan ulusuna ve Avrupa'daki güç dengesine büyük bir tehdit oluşturuyor. Avusturya'nın bağımsızlığını garanti edeceğiz ve Almanya'nın ülkeyi etkilemek için kullanmayı planladığı herhangi bir diplomatik manevraya karşı çıkacağız."
 ITA_guardia_nazionale_repubblicana:0 "Guardia Nazionale Repubblicana"
 ITA_guardia_nazionale_repubblicana_desc:0 "Kraliyet Carabinieri'nin faşist rejimi devirme girişiminde oynadığı rol göz önüne alındığında, bu silahlı gücü derhal değiştireceğiz. Kara Gömleklileri yeniden oluşturmak ve polis ile askeri işlevleri yerine getirmek için bir Cumhuriyet Ulusal Muhafızı kurma planımız zaten var."
 ITA_guardia_nazionale_repubblicana_spawn_divs_tt:0 "§Y[THIS.GetName]§!'da §Y5 Camicie Nere§! tümeni oluştur."
 ITA_has_completed_cooperation_programs_focus_tt:0 "\n§Y$ITA_cooperation_programs$§! odağı tamamlandığında:"
 ITA_has_disbanded_blackshirts_tt:0 "Kara Gömleklileri dağıtmadı"
 ITA_has_disbanded_blackshirts_tt_NOT:0 "NOT: Kara Gömleklileri dağıttı"
 ITA_has_new_duce_flag:0 "§YBüyük Konsey§! tarafından devrildi."
 ITA_heroes_of_the_nation:0 "Ulusun Kahramanları"
 ITA_heroes_of_the_nation_desc:0 "Ulusumuzun büyük kahramanlarının liyakatini tanımalı ve ödüllendirmeliyiz, ancak Duce'nin bilge liderliği olmadan potansiyellerinin tamamen boşa gideceğini de unutmamalıyız."
 ITA_heroes_of_the_nation_general_traits_tt:0 "\nÜç rastgele General, §Y$war_hero$§! özelliğini kazanacak: \n- $MODIFIER_UNIT_LEADER_PROMOTE_COST_FACTOR$: §G-%50.0§! \n- $MODIFIER_REASSIGNMENT_DURATION_FACTOR$: §R+%50.0§! \n\n"
 ITA_heroes_of_the_nation_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$ \n$MODIFIER_COMMAND_POWER_GAIN_MULT$: §G+%15§! \n$MODIFIER_UNIT_LEADER_PROMOTE_COST_FACTOR$: §G-%20.0§! \n\n"
 ITA_iberian_protection:0 "İber Koruması"
 ITA_iberian_protection_desc:0 "İber ulusları yakın geçmişte göreceli bir güvenlik içinde yaşadılar, ancak şu anda kendilerini büyük düşman güçlerine karşı savunamayacakları açıktır. Çok geç olmadan onlara korumamızı teklif etmeliyiz."
 ITA_il_sol_dell_avvenire:0 "Il Sol dell'Avvenire"
 ITA_il_sol_dell_avvenire_desc:0 "Tüm vatandaşların devlet önünde özgür ve eşit olduğu yeni bir İtalyan devleti, İtalyan Ulusal Birliği'ni ilan etme zamanı geldi. \nGeleceğin güneşi İtalya'da doğacak!"
 ITA_il_sol_dell_avvenire_military_industry_dm_tt:0 "$ITA_modify_military_industry_dynamic_modifier_ns_intro$ \n$MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY$: §G+%5.00§! \n$MODIFIER_PRODUCTION_FACTORY_EFFICIENCY_GAIN_FACTOR$: §G+%5.00§! \n\n"
 ITA_il_sol_dell_avvenire_pc_tt:0 "\nBarış Konferanslarında §YKukla Ülke§! ve §YHükûmeti Zorla§! eylemleri için §Yazaltılmış maliyet§!."
 ITA_il_vento_aureo:0 "Il Vento Aureo"
 ITA_il_vento_aureo_desc:0 "Papalık uzun zamandır yabancı güçler tarafından baskı altında tutulmuştur. Ancak, hava kuvvetlerimizi ve avcı uçağı eğitim programlarımızı optimize ederek çok daha ucuz ama daha cesur pilotlara olanak tanıyabilir, Katolik Kilisesi'nin altın egemenliğini göklerden düşmanlarımıza getirebiliriz. Bu bizim en büyük ağıtımız olacak!"
 ITA_improve_overseas_naval_bases:0 "Denizaşırı Deniz Üslerini Geliştir"
 ITA_improve_overseas_naval_bases_desc:0 "Denizaşırı topraklarımızdaki limanları yükseltmek, donanmamızın büyüyen imparatorluğumuzu savunması ve düşmanlarımızın ticaret yollarını tehdit etmesi için güçlü bir temel sağlayacaktır."
 ITA_improve_the_industries:0 "Sanayileri İyileştir"
 ITA_improve_the_industries_desc:0 "Canlanmış bir ekonomiyle, şimdi kaynaklarımızı sanayilerimize yönlendirme ve orada da geniş kapsamlı reformlar yapma imkanına sahibiz. Daha verimli bir sanayi, şüphesiz daha fazla teçhizatın muzaffer kuvvetlerimize daha hızlı ulaşması anlamına gelecektir."
 ITA_improve_the_industries_military_industry_tt:0 "$ITA_modify_military_industry_dynamic_modifier_ns_intro$ \n$MODIFIER_LINE_CHANGE_PRODUCTION_EFFICIENCY_FACTOR$: §G+%5.00§! \n$MODIFIER_PRODUCTION_FACTORY_EFFICIENCY_GAIN_FACTOR$: §G+%5.00§! \n$MODIFIER_PRODUCTION_FACTORY_START_EFFICIENCY_FACTOR$: §G+%5.00§! \n\n"
 ITA_improve_the_industries_ricostruzione_industriale_tt:0 "$ITA_modify_ricostruzione_industriale_dynamic_modifier_ns_intro$ \n$MODIFIER_CONVERSION_COST_CIV_TO_MIL_FACTOR$: §G-%10.00§! \n\n"
 ITA_improved_infrastructure_in_state_flag:0 "Altyapı, ilgili odak tarafından eyalette iyileştirildi."
 ITA_in_our_controlled_states_cw:0 "kontrolümüz altındaki [RDS.GetAdjective] eyaletlerinde"
 ITA_increase_artillery_production:0 "Topçu Üretimini Artır"
 ITA_increase_artillery_production_desc:0 "Büyük Savaş öncelikle bir topçu savaşıydı. Bir sonraki savaşın da öncelikle topçuyla yapılacağını varsaymalıyız. Bu alanda geride kalmamıza izin vermemeliyiz."
 ITA_increase_artillery_production_military_industry_tt:0 "$ITA_modify_military_industry_dynamic_modifier_ns_intro$ \n$ITA_military_industry_dynamic_modifier_arty_tt$\n"
 ITA_increase_production:0 "Üretimi Artır"
 ITA_increase_production_desc:0 "Sanayileşmiş savaş öncelikle tek bir şey gerektirir: kütle. Mermi kütleleri, tüfek kütleleri, uçak kütleleri. En önemli olan, düşmandan daha fazla şeye sahip olmaktır."
 ITA_increase_production_military_industry_tt:0 "$ITA_modify_military_industry_dynamic_modifier_ns_intro$ \n$MODIFIER_LINE_CHANGE_PRODUCTION_EFFICIENCY_FACTOR$: §G+%20.00§! \n$MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY$: §G+%5.00§! \n$MODIFIER_PRODUCTION_FACTORY_START_EFFICIENCY_FACTOR$: §R-%4.00§! \n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+%5.00§! \n\n"
 ITA_increase_resource_amount_in_state_tt:0 "Eyalette zaten üretilen her kaynaktan §Y2§! ekle."
 ITA_incrociatori_leggeri:0 "Incrociatori Leggeri"
 ITA_incrociatori_leggeri_desc:0 "Diğer hafif kruvazörlerle başa çıkabilecek kadar hızlı ve güçlü ve önlerindeki muhripleri süpürebilecek kadar, ama sayılarla inşa edilebilecek kadar ucuz olan hafif kruvazörler, deniz yollarımızı korumada ve savaşı düşman konvoylarına taşımada önemlidir. Condottieri, Montecuccoli ve Garibaldi sınıflarındaki deneyimimiz üzerine inşa ederek, Avrupa ile Afrika arasındaki denizlere hükmedecek bir kruvazör gücü yaratabiliriz."
 ITA_incrociatori_leggeri_rm_tt:0 "$ITA_modify_military_industry_dynamic_modifier_ns_intro$ \n$MODIFIER_SCREENING_EFFICIENCY$: §G+%5.00§! \n$ITA_incrociatori_leggeri_dynamic_modifier_tt$ \n\n"
 ITA_incrociatori_pesanti:0 "Incrociatori Pesanti"
 ITA_incrociatori_pesanti_desc:0 "Şimdilik, İtalya'nın aynı anda ihtiyaç duyduğumuz her yerde olmaları için yeterli zırhlı inşa etme sanayi tabanı yoktur. Zara sınıfımız gibi güçlü, iyi zırhlı kruvazörler inşa ederek, birden fazla operasyon alanında denizlerin kontrolünü tartışacak gemilere sahip olacağız."
 ITA_incrociatori_pesanti_rm_tt:0 "$ITA_modify_military_industry_dynamic_modifier_ns_intro$ \n$MODIFIER_STRIKE_FORCE_MOVING_ORG$: §G-%5.00§! \n$ITA_incrociatori_pesanti_dynamic_modifier_tt$ \n\n"
 ITA_independence_bonus_tt:0 "§Y$independence_wargoal$§! savaşı ilan edildiğinde:"
 ITA_independence_overlord_fallback_accept_tt:0 "[ROOT.GetAdjective] Hâkim Devleti, [ROOT.GetName]'dan kuklayı kaldırır. \n§Y$ITA_granted_us_independence$§! kazanır (eski §Yhâkim devletin§! görüşü §Y50§!)."
 ITA_independence_overlord_fallback_refuse_tt:0 "[ROOT.GetAdjective] Hâkim Devletine karşı §Y$independence_wargoal$§! savaş hedefi kazanır. \n§Y$ITA_refused_to_grant_us_independence$§! kazanır (eski §Yhâkim devletin§! görüşü §Y-50§!)."
 ITA_independence_overlord_fallback_tt:0 "[ROOT.GetAdjective] Hâkim Devleti:\n"
 ITA_independence_rds:0 "İtalyan Bağımsızlığı"
 ITA_independence_rds_desc:0 "Sözde müttefiklerimizin bize tabi kıldığı bu boyunduruğa yeter. İtalyan ulusu bundan sonra kendi kaderini kendi belirleyecek. Eğer bu hedefe ulaşmak için bir kez daha kan dökülmesi gerekiyorsa, gururlu İtalyan halkı buna hazır olacaktır."
 ITA_independence_rsi:0 "$ITA_independence_rds$"
 ITA_independence_rsi_desc:0 "$ITA_independence_rds_desc$"
 ITA_industria_della_gomma_sintetica:0 "Industria della Gomma Sintetica"
 ITA_industria_della_gomma_sintetica_desc:0 "Akdeniz'in kalbindeki coğrafi konumumuz, bizi düşman güçlerin ablukasına karşı benzersiz bir şekilde savunmasız kılıyor. Dünyada hak ettiğimiz yeri alacaksak, sanayilerimizi yabancı ithalat olmadan sürdürebilmeliyiz."
 ITA_industrial_socialization:0 "Endüstriyel Sosyalleşme"
 ITA_industrial_socialization_desc:0 "Büyük fabrikaları büyük işadamlarının ve burjuvazinin elinden kamulaştırma zamanı geldi, böylece tüm İtalyan halkının en büyük yararı için kullanılabilirler."
 ITA_industrial_socialization_factories_tt:0 "İki çekirdek eyalete kadar §Y2 İnşaat Alanı§! ve §Y2 Sivil Fabrika§! ekler. \nİki farklı çekirdek eyalete kadar §Y2 İnşaat Alanı§! ve §Y2 Askerî Fabrika§! ekler."
 ITA_institute_the_five_year_plan:0 "Beş Yıllık Planı Kur"
 ITA_institute_the_five_year_plan_desc:0 "Tıpkı Sovyet yoldaşlarımızın yaptığı gibi, büyük dünya güçleriyle rekabet edebilmek için çoğunlukla tarımsal olan ülkemizi sanayileştirmeliyiz. Sadece iç savaş öncesi sanayi seviyelerine dönmemize değil, aynı zamanda onları çok aşmamıza yardımcı olacak bir beş yıllık plan geliştireceğiz."
 ITA_institute_the_five_year_plan_iri_tt:0 "$ITA_modify_ricostruzione_industriale_dynamic_modifier_ns_intro$ \n$modifier_production_speed_infrastructure_factor$: §G+%10.00§! \n$modifier_production_speed_arms_factory_factor$: §G+%10.00§! \n$modifier_production_speed_industrial_complex_factor$: §G+%10.00§! \n$modifier_production_speed_dockyard_factor$: §G+%10.00§! \n\n"
 ITA_integrate_polizia_dell_africa_italiana:0 "Polizia dell'Africa Italiana'yı Entegre Et"
 ITA_integrate_polizia_dell_africa_italiana_desc:0 "Bu birimler İtalya'ya ve rejimimize sadık kalırken sömürge polisimizi entegre etmeliyiz. Partizanlar şüphesiz yakında bu birlikleri ele geçirmeye çalışacaklardır..."
 ITA_integrate_polizia_dell_africa_italiana_eritrea_tt:0 "§Y1 $infantry$§! tümeni ve §Y1 $cavalry$§! tümeni oluştur."
 ITA_integrate_polizia_dell_africa_italiana_ethiopia_tt:0 "§Y2 $infantry$§! tümeni oluştur."
 ITA_integrate_polizia_dell_africa_italiana_libya_tt:0 "§Y1 $infantry$§! tümeni, §Y1 $cavalry$§! tümeni ve §Y1 $camelry$§! tümeni oluştur."
 ITA_integrate_polizia_dell_africa_italiana_somalia_tt:0 "§Y1 $infantry$§! tümeni oluştur."
 ITA_integrate_polizia_dell_africa_italiana_spawn_units_italy_tt:0 "§Y2 $infantry$§! tümeni, §Y1 $cavalry$§! tümeni ve §Y1 $camelry$§! tümeni oluştur."
 ITA_intensify_torpedo_manufacturing:0 "Torpido İmalatını Yoğunlaştır"
 ITA_intensify_torpedo_manufacturing_desc:0 "İtalyan torpidoları dünyanın en güvenilirleri arasındadır. Fiume torpidonun doğum yeridir ve oradaki fabrika ve Napoli'deki Silurificio Italiano tesisi ile, bu ölümcül deniz silahının kullanımını daha da genişletmek için iyi bir temelimiz var."
 ITA_intensify_torpedo_manufacturing_rm_tt:0 "$ITA_modify_regia_marina_dynamic_modifier_ns_intro$ \n$MODIFIER_NAVAL_STRIKE_ATTACK$: §G+%5§! \n$MODIFIER_NAVY_SUBMARINE_ATTACK_FACTOR$: §G+%5.00§! \n$MODIFIER_CONVOY_RAIDING_EFFICIENCY_FACTOR$: §G+%5.00§! \n\n"
 ITA_investments_in_edison:0 "Edison'a Yatırımlar"
 ITA_investments_in_edison_desc:0 "İtalya, Avrupa'daki ilk enerji santraline sahipti ve her zaman teknolojinin ön saflarında yer aldı. Edison şirketine yatırım yaparak, liderliğimizi sürdürdüğümüzden emin olabiliriz."
 ITA_investments_in_edison_ricostruzione_industriale_tt:0 "$ITA_modify_ricostruzione_industriale_dynamic_modifier_ns_intro$ \n$MODIFIER_CONSUMER_GOODS_FACTOR$: §Y-%5.0§! \n\n"
 ITA_invite_france_to_military_partnership:0 "Fransa'yı Askerî Ortaklığa Davet Et"
 ITA_invite_france_to_military_partnership_desc:0 "Fransa, en yakın komşularımızın en güçlüsüdür ve eski bir müttefiktir. Son savaştaki ihanetlerini unutmayacak olsak da, affedebiliriz. Belki de eski kinleri geride bırakıp askeri gücümüzü yakın bir ortaklık yoluyla güçlendirme zamanı gelmiştir."
 ITA_irregulars:0 "Düzensizler"
 ITA_irregulars_create_units_tt:0 "Kontrol edilen Afrika eyaletlerinde §Y10 adede kadar [ROOT.GetFlag][ROOT.GetAdjective]§! düzensiz birim ve her Afrika bağlı devletinde §Y3 adede kadar [ROOT.GetFlag][ROOT.GetAdjective]§! düzensiz birim oluştur."
 ITA_irregulars_desc:0 "Düzensiz birlikler, Afrika kampanyasında kilit bir rol oynamaktadır. Yerel nüfus arasında asker alımını artırmalı ve bu birliklerin aldığı eğitimi iyileştirmeliyiz."
 ITA_irregulars_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$ \n$modifier_army_sub_unit_irregular_infantry_max_org_factor$: §G+%5.00§! \n\n"
 ITA_is_constitutional_monarchy_tt:0 "Bir §YAnayasal Monarşi§!dir."
 ITA_is_in_liberation_war_tt:0 "Kurtuluş Savaşı'nda Anti-Faşist tarafa katıldı."
 ITA_is_not_constitutional_monarchy_tt:0 "Bir §YAnayasal Monarşi§! değildir."
 ITA_ispettorato_dei_mezzi_antisommergibili:0 "Ispettorato dei Mezzi Antisommergibili"
 ITA_ispettorato_dei_mezzi_antisommergibili_desc:0 "Mariantisom'u bir denizaltı karşıtı savaş komutanlığı olarak kurmak, eskort gemilerimizi daha iyi koordine etmek için örgütsel yetenek sağlayacak ve düşman denizaltılarıyla savaşta bize avantaj sağlamak için teknolojik yeniliği teşvik edecektir."
 ITA_ispettorato_dei_mezzi_antisommergibili_rm_tt:0 "$ITA_modify_regia_marina_dynamic_modifier_ns_intro$ \n$MODIFIER_NAVAL_DETECTION$: §G+%10.00§! \n\n"
 ITA_italia_libera:0 "Italia Libera"
 ITA_italia_libera_desc:0 "İnisiyatif almalı ve dost komşu hükûmetlere, bizi çevreleyen çok sayıda tehdide karşı işbirliği yapmamıza ve kendimizi savunmamıza olanak tanıyan bir ittifak kurmayı teklif etmeliyiz."
 ITA_italia_libera_faction_tt:0 "'§Y[ROOT.GetName] bizi $ITA_free_states_of_europe$'a davet ediyor'§! olayını alır."
 ITA_italia_libera_invite_tt:0 "\nOrta ve Güney Avrupa'da [ROOT.GetName]'a yakın §YBağımsız Demokratik ülkeler§!, §Y$ITA_free_states_of_europe$§!'e davet edilecek."
 ITA_italian_hegemony:0 "İtalyan Hegemonyası"
 ITA_italian_hegemony_desc:0 "Savaş yorgunu bir dünyayla çevrili olarak, onlara faşizmin ve [ROOT.GetNameDefCap]'in nasıl fayda sağladığını göstermek için tüm farklı ulusları ve kültürleri hegemonyamız altında ilham vermeli ve birleştirmeliyiz. Daha parlak bir gelecek için yolu biz göstermeliyiz!"
 ITA_italian_hegemony_subjects_tt:0 "\nHer [ROOT.GetAdjective] bağlı devleti:\n"
 ITA_italian_highways_bba:0 "İtalyan Otoyolları"
 ITA_italian_highways_bba_desc:0 "Antik Romalılar, tüm dünyanın gıpta ettiği yollar inşa ettiler. Şimdi yeni yetme Almanlar, Autobahn'larının bizim inşa edebileceğimiz her şeyden çok daha üstün olduğuna inanıyorlar. Onlara yanıldıklarını kanıtlayacağız."
 ITA_italian_irredentism:0 "İtalyan İrredantizmi"
 ITA_italian_irredentism_desc:0 "İtalyan irredantizmi, Büyük Savaş'tan sonra faşist rejimimiz sayesinde giderek daha saldırgan hale geldi. İtalya'nın doğal sınırlarına ulaşma ve haklı olarak İtalyan halkına ait olan tüm toprakları birleştirme zamanı geldi!"
 ITA_italian_socialism:0 "İtalyan Sosyalizmi"
 ITA_italian_socialism_desc:0 "Sosyalizme giden yol önümüzde açılıyor, sınırlarımız içinde adil bir toplum ve İtalyan Cumhuriyeti'nin dışarıda hak ettiği uluslararası statüyü elde etme kararlılığıyla onu alma zamanı geldi."
 ITA_italian_tankettes:0 "İtalyan Tanketleri"
 ITA_italian_tankettes_desc:0 "Diğer ülkeler, diğer tüm tankları geçersiz kılacak süper tank arayışında giderek daha büyük ve daha ağır tanklar geliştirebilirken, biz en iyi tankın aslında sahada olan bir tank olduğunu biliyoruz. Bir tank, ihtiyaç duyulan her yere zamanında gidecek kadar hızlı olmalı ve gerçekten sadece tüfeklere dayanacak kadar ağır zırha ihtiyacı var. Böyle bir araç ucuz ve hızlı üretilebilir olurdu."
 ITA_italian_tankettes_flamethrower_tt:0 "\n§Y$sp_land_flamethrower_tank$§! Özel Projesi tamamlandığında:\n"
 ITA_italian_tankettes_light_hull_tt:0 "\n§Y$light_tank_chassis_2$§! teknolojisi araştırıldığında:\n"
 ITA_italian_tankettes_military_industry_tt:0 "$ITA_modify_military_industry_dynamic_modifier_ns_intro$ \n$ITA_military_industry_dynamic_modifier_tankettes_tt$\n"
 ITA_italo_balbo_focus:0 "Italo Balbo"
 ITA_italo_balbo_focus_desc:0 "Önümüzdeki çalkantılı zamanlarda bize rehberlik edecek yetenekli bir askeri lidere ihtiyacımız var. Italo Balbo sadece bir askeri lider değil, aynı zamanda birkaç diplomatik görev üstlenmiş ve Libya'daki mülklerimizi oldukça etkili bir şekilde yönetmiş bir havacılık kahramanıdır. Şüphesiz ordumuzun içinde bulunduğu yetersiz durumu iyileştirecek ve İtalya'ya zafer getirecektir!"
 ITA_italy_will_guarantee_tt:0 "[GetItalyGuaranteesMajor]"
 ITA_italy_will_guarantee_tt_fulfilled:0 "§Y[ROOT.GetNameDefCap]§!, §Y[ROOT.GetNameDefCap]§!'i garanti eden herhangi bir §YBüyük ülkeyi§! §Ygaranti§! edecektir. Mevcut Etki:"
 ITA_italy_will_guarantee_tt_standard:0 "§Y[ROOT.GetNameDefCap]§!, §Y[ROOT.GetNameDefCap]§!'i garanti eden herhangi bir §YBüyük ülkeyi§! §Ygaranti§! edecektir."
 ITA_italys_destiny:0 "İtalya'nın Kaderi"
 ITA_italys_destiny_desc:0 "İtalya'nın bu ittifakta oynaması gereken rolü belirleyeceğiz: Akdeniz'deki yüce deniz gücü rolü. Bu hedefe ulaşmadaki bir sonraki kilit adım, Balkanlar'da hakimiyet kurmaktır."
 ITA_joint_military_programs:0 "Ortak Askerî Programlar"
 ITA_joint_military_programs_desc:0 "İtalya ile yeni müttefiklerimiz arasında hem askeri hem de bilimsel alanlarda işbirliğini teşvik etmeliyiz, çünkü her ikisi de yakından ilişkilidir."
 ITA_joint_military_programs_one_ally_tt:0 "Eğer §Y[ROOT.GetNameWithFlag]§! hem §Y[ENG.GetNameWithFlag]§! hem de §Y[FRA.GetNameWithFlag]§! ile ittifakta olursa etkiler ikiye katlanacaktır."
 ITA_joint_military_programs_two_allies_tt:0 "Etkiler, §Y[ROOT.GetNameWithFlag]§! hem §Y[ENG.GetNameWithFlag]§! hem de §Y[FRA.GetNameWithFlag]§! ile ittifakta olduğu için ikiye katlanır."
 ITA_keep_specialization:0 "Uzmanlığı Koru"
 ITA_keep_specialization_desc:0 "Dünyanın geri kalanı beceri, hassasiyet ve kalite değerini unutmuş olabilir, ama biz İtalya'da unutmadık. Zanaatkarlarımız her zaman en küçük detaya dikkat edecek ve çalıştıkları herhangi bir teçhizatın kesinlikle en iyi örneğini yaratacaklardır."
 ITA_keep_specialization_military_industry_tt:0 "$ITA_modify_military_industry_dynamic_modifier_ns_intro$ \n$MODIFIER_LINE_CHANGE_PRODUCTION_EFFICIENCY_FACTOR$: §R-%20.00§! \n$MODIFIER_PRODUCTION_FACTORY_EFFICIENCY_GAIN_FACTOR$: §G+%10.00§! \n$MODIFIER_PRODUCTION_FACTORY_START_EFFICIENCY_FACTOR$: §G+%10.00§! \n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+%5.00§! \n\n"
 ITA_la_battaglia_del_grano:0 "La Battaglia del Grano"
 ITA_la_battaglia_del_grano_desc:0 "Eğer onu beslemek için diğer ülkelere bağımlıysa, bir ülke gerçekten büyük sayılamaz. Ciddiye alınmak istiyorsak, İtalya'nın temel gıda maddelerinde bağımsız olması gerekir. Bu amaçla savaşmalıyız ve başka herhangi bir savaşta savaşabileceğimiz kadar sıkı savaşmalıyız. Ancak Tahıl Savaşı'nda zaferle, savaşta zafer umut edebiliriz."
 ITA_la_battaglia_per_la_terra:0 "Toprak İçin Mücadele"
 ITA_la_battaglia_per_la_terra_desc:0 "Güçlü bir faşist toplumun temeli, toprağın kendisi ve onu işleyen insanlardır. İtalya'da hala bataklıkları kurutarak ve tarım arazilerini sulayarak faydalı topraklar kazanabileceğimiz birçok alan var."
 ITA_la_battaglia_per_le_nascite:0 "Doğumlar İçin Mücadele"
 ITA_la_battaglia_per_le_nascite_desc:0 "Eğer dünyada hak ettiğimiz yeri almak istiyorsak, onu zorla alacak askeri güce sahip olmalıyız. Bunun için askerlere ihtiyacımız var. Bir çiftin bir veya iki çocuğu olması yeterli değil - savaşları kazanmadan önce, Doğum Savaşını kazanmalıyız."
 ITA_late_to_the_atomic_party_flag:0 "§R[ROOT.GetFlag][ROOT.GetName], artık $atomic_research$ teknolojisinde öncü sayılamaz§!"
 ITA_latin_initiatives:0 "Latin Girişimi"
 ITA_legge_bottai:0 "Legge Bottai"
 ITA_legge_bottai_desc:0 "Roma sanatı ve kültürü, Avrupa'daki tüm modern kültürün temeli olmuştur. Bu tarihi hazinelerin modernizm tarafından geçilmesine asla izin veremeyiz. İtalya her zaman geleceğe bakmalı, ama aynı zamanda geçmişini de asla unutmamalıdır."
 ITA_liberate_gramsci:0 "Gramsci'yi Kurtar"
 ITA_liberate_gramsci_desc:0 "Yoldaşımız, Marksist filozof Antonio Gramsci, on yıldan fazla bir süredir faşist hükûmet tarafından hapishanede tutuluyor ve şimdi sağlığı hızla kötüleşiyor. Onu serbest bırakmak ve hayatını kurtarmak için gizli bir operasyon düzenlemeliyiz, çünkü o kesinlikle işçi devrimimizde kilit bir aktör olacaktır."
 ITA_liberate_gramsci_tt:0 "§Y$ITA_antonio_gramsci$§! hapisten salıverilecek ve hastalığı için uygun tedavi görecek. Komünist dalının ilerleyen kısımlarında §Y$communism$ ülke lideri§! olarak mevcut olacak."
 ITA_liberate_the_workers_of_africa:0 "Afrika işçilerini kurtar"
 ITA_liberate_the_workers_of_africa_desc:0 "Afrika halkını, onları ezen çeşitli hükûmetlerden kesin olarak kurtarma zamanı geldi!"
 ITA_liberate_the_workers_of_africa_tt:0 "İtalya veya bir İtalyan bağlı devleti tarafından tamamen kontrol edilen her Afrika eyaleti: \nZaten üretilen her kaynaktan §Y2§! ekle. \nUyum: §G+%10.0§!"
 ITA_liberate_the_workers_of_africa_wargoal_tt:0 "§Y[ROOT.GetFlag][ROOT.GetNameDefCap]§!, Afrika'da eyaletleri kontrol eden farklı bir ideolojiye sahip dost olmayan herhangi bir ülkeye karşı savaş hedefi kazanır."
 ITA_liberation_or_death:0 "Kurtuluş ya da Ölüm!"
 ITA_liberation_or_death_desc:0 "İtalyan halklarının faşist baskıdan Kurtuluşu için çok savaştık. Büyük kayıplar verdik, ama boşuna değildi, şimdi İtalya'da faşizmi kesin olarak ortadan kaldırmak için son bir hamle yapma zamanı!"
 ITA_libyan_infrastructure_bba:0 "Libya Altyapısı"
 ITA_libyan_infrastructure_bba_desc:0 "Libya'nın Kuzey Afrika'daki operasyonlar için bir üs olarak önemi göz önüne alındığında, orada büyük birlik oluşumlarını işletebilmek için altyapısını sürekli iyileştirme çabası içinde olmalıyız, eğer bu gerekli hale gelirse."
 ITA_libyan_railway:0 "Libya Demiryolu"
 ITA_libyan_railway_desc:0 "Libya yol ağına yapılan yatırımlar kesinlikle değerlidir, ancak büyük ölçekli asker, kaynak ve malzeme hareketi için modern bir demiryolu ağı vazgeçilmezdir."
 ITA_libyan_railway_state_modifier_tt:0 "\nKuzey Afrika kıyı eyaletlerine §Y$ITA_libyan_railway_modifier$§! eyalet değiştiricisi ekler. $generic_current_effects$ \n"
 ITA_libyan_refineries:0 "Libya Rafinerileri"
 ITA_libyan_refineries_desc:0 "Libya çölünde büyük petrol yatakları tespit edildikten sonra, bir sonraki adımımız bölgedeki petrol arıtma kapasitesini artırmak olmalıdır."
 ITA_litoranea_balbo:0 "[GetAppropriateLitoraneaBalboName]"
 ITA_litoranea_balbo_alt:0 "Litoranea Libica"
 ITA_litoranea_balbo_default:0 "Litoranea Balbo"
 ITA_litoranea_balbo_desc:0 "Libya'daki yollar berbat. Kıyıya yakın bile olsa, yol ağı modern bir ülkeye yakışmıyor. Bunu iyileştirmek için yapılacak çok iş var, buna kıyı boyunca büyük bir otoyol da dahil."
 ITA_long_range_aircraft:0 "Uzun Menzilli Uçak"
 ITA_long_range_aircraft_desc:0 "Düşman üsleri, sanayileri ve ikmal hatları genellikle cephe hatlarının çok gerisindedir. Bu hayati hedeflere ulaşabilmeleri ve vurabilmeleri için uzun menzilli uçaklarımızı geliştirmeli ve iyileştirmeliyiz."
 ITA_long_range_aircraft_ra_tt:0 "$ITA_modify_regia_aeronautica_dynamic_modifier_ns_intro$ \n$MODIFIER_STRAT_BOMBING_VISIBILITY$: §G-%5§! \n$MODIFIER_AIR_RANGE$: §G+%5§! \n$MODIFIER_STRATEGIC_BOMBER_BOMBING$: §G+%5.0§!\n\n"
 ITA_mafia_abroad:0 "Yurtdışındaki Mafya"
 ITA_mafia_abroad_desc:0 "Anlaşmalar yaptığımız mafya ailelerinin nüfuzu sadece İtalya'da değil, yurtdışında da artıyor. Onlarla ilişkili ajanları, işlerinin çıkarlarımız hizmetinde gelişebileceği büyük kapitalist güçlere göndermeliyiz."
 ITA_mare_nostrum_bba:0 "Mare Nostrum"
 ITA_mare_nostrum_bba_desc:0 "Antik Roma'nın Kartaca'yı ilk kez deniz gücüyle yendiği gibi, İtalya da deniz gücüne yatırım yaparak Akdeniz'in kontrolü için çabalayabilir ve onu bir kez daha 'Mare Nostrum', yani bizim denizimiz yapabilir."
 ITA_masters_of_the_aegean:0 "Ege'nin Efendileri"
 ITA_masters_of_the_aegean_claims_tt:0 "Akdeniz'deki §Yher [GRE.GetAdjective] ve [TUR.GetAdjective] kıyı eyaletinde§!, [ROOT.GetFlag][ROOT.GetNameDef] veya [ROOT.GetFlag][ROOT.GetAdjective] kontrolü altında olmayanlar üzerinde hak iddia eder. \nMevcut etkiler:"
 ITA_masters_of_the_aegean_desc:0 "Eğer Akdeniz'i kontrol etmek istiyorsak, önce İtalya'nın Ege Denizi üzerindeki mutlak üstünlüğünü sağlamalıyız. Bununla, sadece Karadeniz'e ve Balkan kıyılarının çoğuna erişimi kontrol etmekle kalmayacak, aynı zamanda Süveyş Kanalı'nı güvence altına almak için yeni deniz üslerine de sahip olacağız."
 ITA_masters_of_the_mediterranean:0 "Akdeniz'in Efendileri"
 ITA_masters_of_the_mediterranean_claims_tt:0 "Akdeniz'deki §Yher kıyı eyaletinde§!, [ROOT.GetFlag][ROOT.GetNameDef] veya [ROOT.GetFlag][ROOT.GetAdjective] kontrolü altında olmayanlar üzerinde hak iddia eder. \nMevcut etkiler:"
 ITA_masters_of_the_mediterranean_desc:0 "Bir devletin gücü, denizdeki konumuyla orantılıdır. Medeniyetimizin beşiği olan antik denize hükmetmek İtalyan halkının hakkı olduğu için, Akdeniz üzerinde tam kontrol talep etme zamanı geldi."
 ITA_meritocracy:0 "Liyakat"
 ITA_meritocracy_desc:0 "Saflarımızdaki muhalefeti bastırdıktan sonra, şimdi birkaç kurumu Faşist Parti dışındaki üyelere açmakta özgürüz. Bu, yeni ve heyecan verici fikirler ve aynı zamanda yeni fırsatlar getirmelidir."
 ITA_midget_submarines:0 "Cep Denizaltıları"
 ITA_midget_submarines_decision_tt:0 "\n§Y$ITA_cooperation_programs$§! odağı tamamlandığında: \n§Y$ITA_export_midget_submarines$§! Kararının kilidini açar!"
 ITA_midget_submarines_desc:0 "Akdeniz'in berrak suları daha büyük denizaltılar için tehlikelidir. Küçük, kısa menzilli, düşük görünürlüklü tekneler inşa etmek, Akdeniz ortamında hayatta kalma şanslarını artırabilir ve bize Sicilya Kanalı gibi önemli geçiş noktalarında devriye gezmek için gereken gücü verebilir."
 ITA_milan_comms_industry:0 "Milano İletişim Sanayisi"
 ITA_milan_comms_industry_desc:0 "Yeni radyo algılama ve menzil bulma alanı birçok fırsat sunuyor ve şüphesiz askeri teknolojinin önemli bir alanı haline gelecektir. Bu alandaki gelişmelere ayak uydurabildiğimizden emin olmalıyız."
 ITA_military_agreements:0 "Askerî Anlaşmalar"
 ITA_military_agreements_desc:0 "Müttefiklerimizden öğrenecek çok şeyimiz var, askeri ve teknolojik işbirliği için bir program geliştirme teklifiyle onlara yaklaşmalıyız."
 ITA_military_cooperation:0 "Askerî İşbirliği"
 ITA_military_cooperation_desc:0 "Bu dünyada galip gelmek istiyorsak müttefiklerimizle askeri işbirliği anlaşmaları kurmalıyız, çünkü bizi çevreleyen büyük güçler, tam bir kesinlikle, proletaryanın düşmanlarıdır."
 ITA_milizia_coloniale:0 "Milizia Coloniale"
 ITA_milizia_coloniale_desc:0 "Faşist milislerimizi, Kara Gömleklileri, sömürgelerden daha fazla acemi askerle, rejimimize sadık olanlarla takviye etmeli ve genişletmeliyiz. Sadece ülkedeki İtalyan sömürgecileri değil, aynı zamanda yerel nüfusu da askere almak, sayılarımızı önemli ölçüde artırmamızı sağlayacaktır."
 ITA_milizia_marittima_di_artiglieria:0 "Milizia Marittima di Artiglieria"
 ITA_milizia_marittima_di_artiglieria_coastal_forts_tt:0 "Bir §Y$naval_base$§! olan her sahip olunan ile §Y2 $coastal_bunker$§! ekler. \nMevcut etkiler:"
 ITA_milizia_marittima_di_artiglieria_desc:0 "İtalya'nın geniş bir kıyı şeridi ve izole ada limanları vardır, istilaya karşı savunmasızdır. Milizia Costiera'mızı reforme ederek ve kıyı savunmalarımıza yatırım yaparak, herhangi bir işgalcinin ağır bir bedel ödemesini sağlayabiliriz."
 ITA_ministero_della_cultura_popolare:0 "Ministero della Cultura Popolare"
 ITA_ministero_della_cultura_popolare_desc:0 "Halkımızın her zaman doğru bilgilere erişimi olmalıdır. Savaş zamanında, düşman ajanları kolayca yanlış bilgi yayabilir ve biz de halkımıza olayların gerçek versiyonunu vererek buna karşı koymalıyız."
 ITA_ministry_of_italian_africa:0 "İtalyan Afrikası Bakanlığı"
 ITA_ministry_of_italian_africa_desc:0 "Afrika'nın çeşitli kabileleri ve halkları, diğer bağlı halklarla başa çıktığımız gibi ele alınamaz. Bu bölgeleri yönetmek farklı bir yaklaşım gerektirecektir."
 ITA_ministry_of_italian_africa_occupation_law_tt:0 "§YAfrika§! eyaletlerinde işgal yasasının kilidini açar:\n"
 ITA_mobilize_railway_guns_tt:0 "[ROOT.capital.GetName]'da §Y4 $railway_gun_equipment_1$§! birimi oluştur."
 ITA_mobilize_the_railway_guns:0 "Demiryolu Toplarını Seferber Et"
 ITA_mobilize_the_railway_guns_desc:0 "Umutsuz durumlar umutsuz önlemler gerektirir, eski demiryolu toplarımızı tekrar faaliyete geçirme zamanı geldi."
 ITA_mobilize_the_railway_guns_military_industry_dm_tt:0 "$ITA_modify_military_industry_dynamic_modifier_ns_intro$ \n$ITA_mobilize_the_railway_guns_dynamic_modifier_tt$ \n\n"
 ITA_modern_musculus:0 "Modern Musculus"
 ITA_modern_musculus_desc:0 "Tıpkı Romalıların yaptığı gibi, savaş alanına hükmetmemizi sağlayacak güçlü savaş makineleri geliştirmeliyiz. Cephe hatlarını yarmak ve düşmanlarımızın kalbine korku salmak için nihai tankı tasarlayacağız."
 ITA_modern_musculus_military_industry_dm_tt:0 "$ITA_modify_military_industry_dynamic_modifier_ns_intro$ \n$ITA_modern_musculus_dynamic_modifier_tt$ \n\n"
 ITA_modernize_ansaldo_facilities:0 "Ansaldo Tesislerini Modernleştir"
 ITA_modernize_ansaldo_facilities_desc:0 "Büyük Savaş'ı takip eden ekonomik gerileme, Ansaldo'yu fabrikalarını düzgün bir şekilde modernize edemeyecek kadar büyük mali zorluklara soktu. Sadece yükseltilmiş statüleri onları iflastan kurtardı. Eğer Ansaldo'nun mekanik mühendislik sektörümüzün bu kadar önemli bir parçası olarak kalmasını istiyorsak, modern makineler ve teknikler kullandıklarından emin olmalıyız."
 ITA_modernize_ansaldo_facilities_military_industry_tt:0 "$ITA_modify_military_industry_dynamic_modifier_ns_intro$ \n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+%5.00§! \n$MODIFIER_INDUSTRIAL_CAPACITY_DOCKYARD_FACTOR$: §G+%5.00§! \n$MODIFIER_EQUIPMENT_UPGRADE_XP_COST$: §G-%15§! \n\n"
 ITA_modernize_the_mezzogiorno:0 "Mezzogiorno'yu Modernleştir"
 ITA_modernize_the_mezzogiorno_desc:0 "Güney İtalya, birleşik bir ülke olduğumuzdan beri bir sorunlu çocuk olmuştur. Ancak Akdeniz'de egemen güç olma arzumuzla, tüm bu kullanılmamış potansiyel seferber edilmelidir."
 ITA_modify_military_industry_dynamic_modifier_ns_intro:0 "§Y$ITA_military_industry_dynamic_modifier$§! değiştiricisini şununla değiştir"
 ITA_modify_partisan_state_modifier_intro:0 "§Y$ITA_fronte_militare_clandestino_modifier$§! değiştiricisini şununla değiştir"
 ITA_modify_regia_aeronautica_dynamic_modifier_ns_intro:0 "§Y[GetAppropriateRegiaAeronauticaNsName]§! değiştiricisini şununla değiştir"
 ITA_modify_regia_marina_dynamic_modifier_ns_intro:0 "§Y[GetAppropriateRegiaMarinaNsName]§! değiştiricisini şununla değiştir"
 ITA_modify_regio_esercito_dynamic_modifier_ns_intro:0 "§Y[GetAppropriateRegioEsercitoNsName]§! değiştiricisini şununla değiştir"
 ITA_modify_ricostruzione_industriale_dynamic_modifier_ns_intro:0 "§Y$ITA_ricostruzione_industriale_dynamic_modifier$§! değiştiricisini şununla değiştir"
 ITA_monarchia_d_italia:0 "Monarchia d'Italia"
 ITA_monarchia_d_italia_desc:0 "Vittorio Emanuele, İtalyan siyasetinin kapılarını asla faşizme açmamalıydı. Bu hatayı düzeltme ve faşistleri hükûmette arka plana atma zamanı geldi."
 ITA_moschettieri_del_duce:0 "[GetAppropriateMoschetieridelDuceName]"
 ITA_moschettieri_del_duce_alt:0 "Moschettieri della Republica"
 ITA_moschettieri_del_duce_default:0 "Moschettieri del Duce"
 ITA_moschettieri_del_duce_desc:0 "[GetAppropriateMoschetieridelDuceDesc]"
 ITA_moschettieri_del_duce_desc_alt:0 "Moschettieri della Republica, Cumhuriyeti devlet dışından veya içinden gelebilecek herhangi bir tehdide karşı korumaya yemin etmiş seçkin nişancılardan oluşan bir birimdir. Bu örnek askerler aynı zamanda düzenli kuvvetlerimizi daha iyi eğitmek için de kullanılabilir ve sahadaki etkinliklerini artırabilir."
 ITA_moschettieri_del_duce_desc_default:0 "Duce'nin, kendi korunması için, komutası altında seçkin nişancılardan oluşan bir birliği vardır. Duce'nin güvenliği elbette en yüksek önceliktir, ancak bu örnek askerler aynı zamanda düzenli kuvvetlerimizi daha iyi eğitmek için de kullanılabilir ve sahadaki etkinliklerini artırabilir."
 ITA_moschettieri_del_duce_desc_king:0 "Kralın, kendi korunması için, komutası altında seçkin nişancılardan oluşan bir birliği vardır. Kralın güvenliği elbette en yüksek önceliktir, ancak bu örnek askerler aynı zamanda düzenli kuvvetlerimizi daha iyi eğitmek için de kullanılabilir ve sahadaki etkinliklerini artırabilir."
 ITA_moschettieri_del_duce_desc_pope:0 "Kutsal Peder'in, kendi korunması için, komutası altında seçkin nişancılardan oluşan bir birliği vardır. Kutsal Peder'in güvenliği elbette en yüksek önceliktir, ancak bu örnek askerler aynı zamanda düzenli kuvvetlerimizi daha iyi eğitmek için de kullanılabilir ve sahadaki etkinliklerini artırabilir."
 ITA_moschettieri_del_duce_king:0 "Moschettieri del Re"
 ITA_moschettieri_del_duce_pope:0 "Moschettieri del Santo Padre"
 ITA_moschettieri_del_duce_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$ \n$MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$: §G+%5.0§! \n$modifier_army_sub_unit_militia_max_org_factor$: §G+%5.00§! \n\n"
 ITA_multirole_aircraft:0 "Çok Amaçlı Uçak"
 ITA_multirole_aircraft_desc:0 "Savaşta farklı roller üstlenebilen hava şasileri geliştirerek üretim maliyetlerinde ve mürettebat eğitim süresinde önemli bir azalma sağlayabiliriz. Mühendislerimizi bu tür çok yönlü hava şasilerini tasarlamak için hemen işe koyacağız."
 ITA_multirole_aircraft_military_industry_tt:0 "$ITA_modify_military_industry_dynamic_modifier_ns_intro$ \n$MODIFIER_AIR_EQUIPMENT_UPGRADE_XP_COST$: §G-%25§!\n\n"
 ITA_multirole_aircraft_ra_tt:0 "$ITA_modify_regia_aeronautica_dynamic_modifier_ns_intro$ \n$MODIFIER_AIR_MISSION_XP_FACTOR$: §G+%10§!\n\n"
 ITA_mussolini_becomes_field_marshal_tt:0 "$ITA_benito_mussolini$ bir Mareşal olur."
 ITA_naval_air_coordination:0 "Deniz-Hava Koordinasyonu"
 ITA_naval_air_coordination_desc:0 "Şimdiye kadar hava kuvvetleri yüksek komutanlığı kendi doktrinini takip etti ve donanmayla iyi koordine olmadı. Bu, Regia Marina’nın etkili keşif yapma kapasitesini sınırladı. Ortak bir deniz-hava doktrini geliştirerek ve deniz ile hava birimleri arasındaki iletişimi kolaylaştırarak, gemilerimiz düşmanı daha iyi bulup vurabilecektir."
 ITA_naval_air_coordination_oob_tt:0 "Gruppo Autonomo Aerosiluranti'nin §Y2 Deniz Bombardıman Filosu§! [2.GetName]'da aktif olur."
 ITA_naval_air_coordination_rm_tt:0 "$ITA_modify_regia_marina_dynamic_modifier_ns_intro$ \n$MODIFIER_NAVAL_STRIKE_AGILITY$: §G+%5§! \n$MODIFIER_NAVAL_COORDINATION$: §G+%5§! \n$MODIFIER_SPOTTING_CHANCE_FACTOR$: §G+%10§! \n\n"
 ITA_naval_power_projection:0 "Deniz Gücü Yansıtma"
 ITA_naval_power_projection_desc:0 "Atalarımızın mirasını takip ederek, Akdeniz'de diğer tüm donanmalar üzerinde İtalyan üstünlüğünü sürdürebilecek zorlu bir deniz kuvveti geliştirmek için gerekli sanayiye sahip olduğumuzdan emin olmalıyız."
 ITA_navi_da_battaglia:0 "Navi da Battaglia"
 ITA_navi_da_battaglia_desc:0 "Littorio sınıfı zırhlılar, ana geminin hızlı ve güçlü örnekleridir. Bu gemilerden daha fazlasını inşa etmek ve onları daha etkili kullanmak için doktrinimizi geliştirmek, savaş hattımızı önemli ölçüde iyileştirecektir."
 ITA_negotiate_italian_claims:0 "İtalyan İddialarını Müzakere Et"
 ITA_negotiate_italian_claims_desc:0 "Almanya'ya olan muhalefetimiz, bizi İtalyan ve Alman rejimleri arasında bir kopuş arayan eski İtilaf ulusları üzerinde bir güç konumuna getirdi. Bu durumu kendi avantajımıza kullanmalı ve Büyük Savaş'tan sonra bize reddedilen sömürge mülklerini geri almalıyız."
 ITA_negotiations_with_albania:0 "Arnavutluk ile Müzakereler"
 ITA_negotiations_with_albania_desc:0 "Arnavutluk tarihi, son on yıllarda İtalya tarafından güçlü bir şekilde etkilenmiştir. Otoriter faşist rejimi geride bıraktığımıza göre, Arnavut hükûmetine uluslarımız arasındaki bağları güçlendirmeyi ve hatta Arnavut yönetimini bizimkine entegre etme olasılığını, her iki ülkeyi de resmi olarak birleştirmeyi teklif etmeliyiz."
 ITA_new_colonial_policies:0 "Yeni Sömürge Politikaları"
 ITA_new_colonial_policies_desc:0 "Çok uzun zamandır faşist rejim, sömürgelerdeki yerel nüfusa kötü davrandı. Sömürge politikamızı gözden geçirme, bu bölgelere bir miktar özerklik verme ve geçmişte neden olunan adaletsizlikleri düzeltme zamanı geldi."
 ITA_new_colonial_policies_pp_from_released_colonies_tt:0 "\nSerbest bırakılan sömürge başına §G+15§!£GFX_pol_idea Siyasi Güç alacağız (maksimum §Y200§!)."
 ITA_new_colonial_policies_tt:0 "§YAfrika'daki her kontrol edilen sömürge§!, bir §YKukla§! olarak serbest bırakılacak."
 ITA_new_corporations:0 "Yeni Korporasyonlar"
 ITA_new_corporations_desc:0 "Faşist rejimin kullandığı önceki korporasyon kavramını alıp yeni hükûmetimizin ihtiyaçlarına uyarlamalıyız."
 ITA_new_corporations_iri_tt:0 "$ITA_modify_ricostruzione_industriale_dynamic_modifier_ns_intro$ \n$modifier_production_speed_industrial_complex_factor$: §R-%35.00§! \n$MODIFIER_CONVERSION_COST_CIV_TO_MIL_FACTOR$: §G-%15.00§! \n\n"
 ITA_new_forms_of_weaponry:0 "Yeni Silah Biçimleri"
 ITA_new_forms_of_weaponry_desc:0 "Eğer İtalya dünyanın en büyük askeri güçlerinden biri olacaksa, yeni silah biçimlerini araştırmalıyız. Bilim adamlarımız, öncü bir atom enerjisi araştırma programının geliştirilmesinin büyük umut vaat ettiğine inanıyorlar."
 ITA_new_industrialization_program:0 "Yeni Sanayileşme Programı"
 ITA_new_industrialization_program_desc:0 "Dünyanın geri kalanıyla aynı seviyede kalmak, sürekli yenilik ve iyileştirme gerektirir. Eğer defne yapraklarımız üzerinde dinlenirsek rekabetçi kalmayı bekleyemeyiz ve bunun yerine sürekli olarak daha fazlası için çabalamalıyız."
 ITA_new_industrialization_program_factories_required_tt:0 "$TRIGGER_NUM_OF_TOTAL_CONTROLLED_FACTORIES_MORE_THAN$§Y[?ROOT.ITA_new_industrialization_program_factories_required]§! (Mevcut: §[GetColorControlledFactoriesForNewIndustrializationProgram][?ROOT.num_of_controlled_factories]§!)"
 ITA_new_industrialization_program_generic_tt:0 "Eğer '§Y$ITA_strengthen_northern_industry$§!' odağı tamamlandıysa, Kuzey Ulusal Tasarımcıları geliştirilecek. \nEğer '§Y$ITA_modernize_the_mezzogiorno$§!' odağı tamamlandıysa, Güney Ulusal Tasarımcıları geliştirilecek."
 ITA_new_industrialization_program_north_tt:0 "Ulusal Kuzey Tasarımcıları geliştirilecek."
 ITA_new_industrialization_program_south_tt:0 "Ulusal Güney Tasarımcıları geliştirilecek."
 ITA_new_ricostruzione_industriale:0 "Yeni Ricostruzione Industriale"
 ITA_new_ricostruzione_industriale_desc:0 "Instituto per la Ricostruzione Industriale, şimdiye kadar iflas etmiş bankaların ve özel şirketlerin kurtarılması, yeniden yapılandırılması ve finanse edilmesinde önemli bir rol oynamıştır. Bazı yeniden ayarlamalarla, geçmişin faşist izleri olmadan çalışmaya devam etmesini sağlayacağız."
 ITA_new_ricostruzione_industriale_iri_tt:0 "$ITA_modify_ricostruzione_industriale_dynamic_modifier_ns_intro$ \n$MODIFIER_CONSUMER_GOODS_FACTOR$: §Y-%2.0§! \n\n"
 ITA_new_ricostruzione_industriale_military_industry_dm_tt:0 "$ITA_modify_military_industry_dynamic_modifier_ns_intro$ \n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+%5.00§! \n$MODIFIER_INDUSTRIAL_CAPACITY_DOCKYARD_FACTOR$: §G+%5.00§! \n\n"
 ITA_new_roman_citizens:0 "Yeni Roma Vatandaşları"
 ITA_new_roman_citizens_desc:0 "Sömürgelerimizin yerli nüfusuna vatandaşlık vermek, yerel halkın onayını ve işbirliğini kazanmamıza kesinlikle yardımcı olacaktır."
 ITA_novus_ordo:0 "Novus Ordo"
 ITA_novus_ordo_create_units_tt:0 "Sahip olunan ve kontrol edilen Libya eyaletinde §Y[ROOT.GetFlag][ROOT.GetAdjective]§! birimleri oluştur:"
 ITA_novus_ordo_desc:0 "İtalya'nın kaderi Libya'ya sıkı sıkıya bağlıdır ve bu nedenle onu krallığımıza daha da entegre etmemiz gerekiyor. Bu, bizim için savaşmaya istekli herhangi bir Libyalıya ‘özel bir vatandaşlık’ sunarak ve bunu yaparken Akdeniz ve Kuzey Afrika üzerindeki kontrolümüzü güvence altına alarak başarılabilir."
 ITA_novus_ordo_forts_tt:0 "Libya sınırları boyunca tamamen kontrol edilen eyaletlere §Y10 adede kadar Kara Kalesi§! ekle."
 ITA_novus_ordo_irregular_troops_tt:0 "§Y5 $infantry$ tümeni§! oluştur."
 ITA_novus_ordo_irregulars_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$ \n$modifier_army_sub_unit_irregular_infantry_max_org_factor$: §G+%5.0§! \n\n"
 ITA_novus_ordo_military_industry_tt:0 "$ITA_modify_military_industry_dynamic_modifier_ns_intro$ \n$MODIFIER_PRODUCTION_FACTORY_EFFICIENCY_GAIN_FACTOR$: §G+%5.00§! \n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+%2.50§! \n\n"
 ITA_novus_ordo_ricostruzione_industriale_tt:0 "$ITA_modify_ricostruzione_industriale_dynamic_modifier_ns_intro$ \n$MODIFIER_CONSUMER_GOODS_FACTOR$: §Y-%2.5§! \n\n"
 ITA_officers_of_the_service_role:0 "Hizmet Rolü Subayları"
 ITA_officers_of_the_service_role_desc:0 "Sadece ordudan subaylar alıp onlara nasıl uçacaklarını öğretmek artık yeterli değil. Hava kuvvetlerimiz, sadece onu benimsemek yerine hizmet tarafından yetiştirilen ve şekillendirilen yeni bir subay türüne ihtiyaç duyuyor."
 ITA_officers_of_the_service_role_oob_tt:0 "§Y1 Avcı Filosu§! ve §Y1 Taktik Bombardıman Filosu§! [2.GetName]'da aktif olur."
 ITA_officers_of_the_service_role_ra_tt:0 "$ITA_modify_regia_aeronautica_dynamic_modifier_ns_intro$ \n$MODIFIER_AIR_ACCIDENTS$: §G-%10.0§! \n$MODIFIER_AIR_NIGHT_PENALTY$: §G-%5.00§! \n$MODIFIER_AIR_WEATHER_PENALTY$: §G-%5.00§! \n\n"
 ITA_oil_in_tripoli:0 "Trablus'ta Petrol"
 ITA_oil_in_tripoli_desc:0 "Libya'da altın bulduk - yani kara altın! Trablus dışındaki çöllerde devasa petrol rezervleri keşfettik. Böyle bir fırsatın geçip gitmesine izin veremeyiz, bu varlıkları İtalya'nın şanı için sömürmeliyiz!"
 ITA_organize_strikes_in_the_north:0 "Kuzeyde Grevler Düzenle"
 ITA_organize_strikes_in_the_north_desc:0 "Saldırmadan önce, tüm çabalarımızı İtalya'daki sanayi işçilerinin desteğini kazanmaya ve kuzeyin daha sanayileşmiş bölgelerinin faşist rejime karşı yanımızda durduğundan emin olmaya yoğunlaştıracağız."
 ITA_organize_strikes_in_the_north_tt:0 "§Yİç savaş başladığında§!: \n§YKuzey İtalyan eyaletlerinin§! kontrolünü ele alacağız. \n§Y5§! ekstra §Y$militia$ tümeni§! oluşturur. \nFaşist taraf birkaç fabrikada hasar görecek."
 ITA_oto_naval_guns:0 "OTO Deniz Topları"
 ITA_oto_naval_guns_desc:0 "İtalya, ana gemilerinin büyük topları için Ansaldo ve Oderi-Terni-Orlando firmalarına güvenir. Kapasitelerine yönelik hedefli yatırımlar yaparak, zırhlılarımızı dünyanın gıpta ettiği gemiler haline getirebiliriz."
 ITA_oto_naval_guns_rm_tt:0 "$ITA_modify_regia_marina_dynamic_modifier_ns_intro$ \n$MODIFIER_NAVY_CAPITAL_SHIP_ATTACK_FACTOR$: §G+%5.00§! \n\n"
 ITA_papal_faction:0 "Katolik Hakimiyeti"
 ITA_paramilitary_training:0 "Paramiliter Eğitim"
 ITA_paramilitary_training_desc:0 "Gönüllü milis örgütümüzü genişletme ve askeri eğitimlerini iyileştirme zamanı geldi. Seçkin tümenlerimizden seçkin subayları, yeni acemileri eğitmek ve Kara Gömlek birimlerine liderlik etmek için kullanacağız."
 ITA_paramilitary_training_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$ \n$modifier_army_sub_unit_militia_attack_factor$: §G+%5.00§! \n$modifier_army_sub_unit_militia_defence_factor$: §G+%5.00§! \n\n"
 ITA_partisan_republics:0 "Partizan Cumhuriyetleri"
 ITA_partisan_republics_desc:0 "Partizanlar tarafından kurtarılan bölgelerde, direniş savaşçılarını toplamak ve düşmanı cephe gerisinde meşgul tutmak için Partizan Cumhuriyetleri şeklinde geçici devlet oluşumlarının kurulmasını teşvik edeceğiz."
 ITA_partisan_republics_spawn_divs_tt:0 "§Y5 adede kadar tam kontrollü çekirdek eyalette§! §Y1 $militia$§! tümeni oluştur. \n\n"
 ITA_partisan_republics_state_modifier_tt:0 "$ITA_modify_partisan_state_modifier_intro$ \n$MODIFIER_COMPLIANCE_GROWTH_ON_OUR_OCCUPIED_STATES$: §G-%10§! \n\n"
 ITA_peace_preservation:0 "Barışın Korunması"
 ITA_peace_preservation_desc:0 "Bu istikrarsızlık ve uluslararası çatışma zamanlarında, Avrupa'da barışı koruma ve uygulama görevini sadece İtalyan halkı üstlenebilir."
 ITA_peace_preservation_guarantees_tt:0 "§Y[ROOT.GetNameWithFlag]§!'a bağımsız veya müttefik olan her §YDemokratik§! Avrupa ülkesini garanti et:"
 ITA_peace_preservation_ns_tt:0 "\nUlusal Ruh §Y$ITA_peace_keepers_of_europe$§! kazanır, bu da şunları verir (Tüketim Malları Fabrikaları: garanti edilen her ülke için §Y-%2.0§! (maksimum §Y-%10.0§!), Savaş Desteği: garanti edilen her ülke için §G+%1.00§! (maksimum §Y+%10.00§!), Haftalık İnsan gücü: garanti edilen her ülke için §G+100§! (maksimum §Y+1000§!))."
 ITA_peace_with_ethiopia_tt:0 "§Y[ETH.GetNameWithFlag]§! ile Barış Görüşmelerinden Sonra:"
 ITA_pioneer_in_atomic_research_flag:0 "§Y[ROOT.GetFlag][ROOT.GetName]§!, §Y$atomic_research$ teknolojisini araştıran ilk üç ülkeden biridir§!"
 ITA_planned_economy:0 "Planlı Ekonomi"
 ITA_planned_economy_desc:0 "Yeni Konfederasyonumuzun temsilcileri, onlara göre, tüm üye devletlerin ekonomilerini verimli ve sürdürülebilir bir şekilde düzenlemeye ve canlandırmaya olanak tanıyacak bir ekonomik girişim önerdiler."
 ITA_planned_economy_subjects_ns_tt:0 "§YTüm Bağlı devletler§!:"
 ITA_political_commissars:0 "Siyasi Komiserler"
 ITA_political_commissars_desc:0 "Komünizme olan bağlılığı korumak ve birliklerimizde ideolojik coşkuyu ilham vermek için, orduda siyasi eğitimden ve bağlı oldukları birimlerin organizasyonundan sorumlu siyasi komiserler figürünü kuracağız."
 ITA_polizia_dell_africa_italiana:0 "Polizia dell'Africa Italiana"
 ITA_polizia_dell_africa_italiana_desc:0 "Sömürge polisimiz şimdiye kadar yetenekli bir güç olduğunu gösterdi. Birkaç reformla daha, sömürgelerimizden koyduğumuz kadarını almamızı sağlayabilecektir."
 ITA_polizia_dell_africa_italiana_occupation_law_tt:0 "§Y$colonial_police$§! işgal yasasını şununla değiştir: \n $MODIFIER_LOCAL_MANPOWER$: §G+%5§! \n $MODIFIER_RESISTANCE_TARGET$: §G-%10§! \n $MODIFIER_RESISTANCE_DAMAGE_TO_GARRISONS$: §G-%10.00§! \n $MODIFIER_REQUIRED_GARRISON_FACTOR$: §G-%5§! \n $MODIFIER_COMPLIANCE_GAIN_ADD$: §G+%0.005§! \n\n"
 ITA_potential_allies_in_the_balkans:0 "Balkanlar'da Potansiyel Müttefikler"
 ITA_potential_allies_in_the_balkans_desc:0 "Balkanları kontrol etmek için bölgedeki tüm ulusları boyunduruk altına alıp domine etmemize gerek yok. Balkanlar'da faydalı müttefikler sağlamak için diplomasiyi kullanma ve sonra geri kalanını boyunduruk altına alma zamanı geldi."
 ITA_potential_refinery_in_libya_tt:0 "§YSentetik Petrol Deneyleri§! araştırıldığında, §YTrablus§!'ta §G1§! İnşaat Alanı ve §Y1 Sentetik Rafineri§! ekle."
 ITA_power_plants_in_terni:0 "Terni'deki Enerji Santralleri"
 ITA_power_plants_in_terni_desc:0 "Eğer bölgeyi daha büyük bir sanayi merkezi haline getirmek istiyorsak, Terni'deki mevcut enerji santrallerimiz yetersiz ve genişletilmeleri gerekiyor."
 ITA_power_plants_in_terni_ricostruzione_industriale_tt:0 "$ITA_modify_ricostruzione_industriale_dynamic_modifier_ns_intro$ \n$modifier_production_speed_industrial_complex_factor$: §G+%2,50§! \n\n"
 ITA_power_to_the_king:0 "Güç Krala"
 ITA_power_to_the_king_desc:0 "Bu büyük sosyal ve siyasi gerilim zamanında, faşist veya komünist olsun, hiçbir aşırılıkçı rejimin İtalya'da galip gelmemesini sağlamanın tek yolu, gücü Kral'ın elinde yoğunlaştırmaktır, şüphesiz ülkemizi yönlendirecek en uygun kişi odur."
 ITA_prepare_for_the_coming_wars:0 "Yaklaşan Savaşlara Hazırlan"
 ITA_prepare_for_the_coming_wars_desc:0 "Savaş her yanımızda beliriyor ve ordumuzun ihtiyaçlarını karşılamak için sağlam bir askeri sanayiye ihtiyacımız var."
 ITA_preserve_army_traditions:0 "Ordu Geleneklerini Koru"
 ITA_preserve_army_traditions_desc:0 "Bugünlerde savaş yürütmenin yeni yolları hakkında birçok fikir dolaşıyor. Bunlardan bazılarının muhtemelen bir değeri olsa da, herhangi bir başarılı ordunun temeli Sezar'ın günlerinden beri değişmedi: Disiplin, bireysel cesaret ve yetenekli liderlik."
 ITA_preserve_army_traditions_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$ \n$MODIFIER_ARMY_ORG$: §G+%5.0§! \n$MODIFIER_ARMY_MORALE_FACTOR$: §G+%5.0§! \n$modifier_army_sub_unit_infantry_defence_factor$: §G+%5.00§! \n\n"
 ITA_proclaim_the_italian_empire:0 "İtalyan İmparatorluğunu İlan Et"
 ITA_proclaim_the_italian_empire_desc:0 "Afrika'daki son kazanımlarımızla, üzerimize yeni bir gün doğuyor. Gelişen bir imparatorluk ve ordumuza yapılan akıllıca yatırımlarla, artık sadece bir Krallık değiliz; nihayet İtalyan İmparatorluğu'nun şafağını ilan etmekten eminiz! Bu anı uzun zamandır bekliyorduk!"
 ITA_proclaim_the_italian_empire_tt:0 "Afrika'daki §Ydost olmayan komşu uluslara§! karşı §YKukla§! savaş hedefi kazanır:"
 ITA_production_lines:0 "Üretim Hatları"
 ITA_production_lines_desc:0 "Silahlı kuvvetlerimizin en yüksek performansta çalışmaya devam etmesi için gerekli malzemeleri ve teçhizatı almasını sağlamak üzere ana üretim hatlarımızı genişletme ve modernize etme zamanı geldi."
 ITA_production_lines_factories_tt:0 "İki çekirdek eyalete kadar §Y2 İnşaat Alanı§! ve §Y2 Askerî Fabrika§! ekler."
 ITA_production_lines_military_industry_dm_tt:0 "$ITA_modify_military_industry_dynamic_modifier_ns_intro$ \n$MODIFIER_PRODUCTION_FACTORY_START_EFFICIENCY_FACTOR$: §G+%5.00§! \n$MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY$: §G+%10.00§! \n\n"
 ITA_proper_carriers:0 "Tam Teşekküllü Uçak Gemileri"
 ITA_proper_carriers_desc:0 "Luigi Gagnotto gibi yenilikçi tasarımcılar son on yıl boyunca filo tipi uçak gemisi tasarımları ürettiler. Bu uzmanlığı, hızlı yolcu gemisi Roma'nın mevcut gövdesiyle (ancak yeni, daha güçlü motorlarla) birlikte kullanarak, sıfırdan inşa etmekten daha hızlı bir şekilde operasyonel bir uçak gemisi elde edebiliriz."
 ITA_prospect_for_oil:0 "Petrol Ara"
 ITA_prospect_for_oil_desc:0 "Jeologlarımız, Libya çölünün altında önemli petrol rezervlerinin uyuduğuna inanıyor. Haklı olup olmadıklarını görmek için kapsamlı bir araştırma yapmalıyız."
 ITA_pugno_alzato:0 "Pugno Alzato"
 ITA_pugno_alzato_desc:0 "Faşizm belasını ve tüm insanlığa oluşturduğu tehdidi ortadan kaldırma zamanı geldi. Bu önemli mücadelede birlik içinde yumruklarımızı kaldıracağız!"
 ITA_pugno_alzato_wargoals_tt:0 "§Yher faşist komşu veya büyük ülkeye§! karşı §Y$topple_government$§! savaş hedefi kazanır."
 ITA_purge_the_party:0 "Partiyi Tasfiye Et"
 ITA_purge_the_party_desc:0 "Kulağımıza, bazılarının eski rejimin yeniden kurulmasından başka bir şey istemediği fısıltıları geldi. Mussolini devrilip iktidardan uzaklaştırılmış olsa da, gölgesi hükûmetin her yerinde ve halkın zihninde her zaman mevcuttur. Bir güç gösterisi yapmalı ve partiyi bize gerçekten sadık olmayan ancak eski Duce'ye sadık kalan unsurlardan temizlemeliyiz."
 ITA_railway_innovations:0 "Demiryolu Yenilikleri"
 ITA_railway_innovations_desc:0 "Otomobil çağında bile, güçlü bir demiryolu ağı hala güçlü bir ekonominin bel kemiğidir. İtalya'daki demiryollarının daha da genişletilmesi, bizi gelecekteki büyüme için hazırlayacaktır."
 ITA_raise_the_peoples:0 "Halkları Ayaklandır"
 ITA_raise_the_peoples_desc:0 "İdeallerimiz için savaşmaya istekli birçok cesur İtalyan köylüsü var. Onlarla, silahlı kuvvetlerimizin saflarını takviye etmek için daha fazla Kızıl Gömlekli birimi oluşturabiliriz."
 ITA_raise_the_peoples_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$ \n$MODIFIER_CONSCRIPTION_TOTAL_FACTOR$: §G+%5§! \n\n"
 ITA_raise_the_peoples_spawn_divs_tt:0 "§Y[THIS.GetName]§!'da §Y6 Camicie Rosse§! tümeni oluştur."
 ITA_ratify_the_stresa_front:0 "Stresa Cephesini Onayla"
 ITA_ratify_the_stresa_front_desc:0 "Toprak tavizleri artık İtalya'ya verildi, bu yüzden İtalya ve Fransa'yı Stresa Cephesi adlı askeri ittifaka getirecek süreci başlatma zamanı geldi."
 ITA_redirect_alfa_romeo_production:0 "Alfa Romeo Üretimini Yönlendir"
 ITA_redirect_alfa_romeo_production_desc:0 "Onlarca yıldır, İtalyan spor arabaları teknolojinin mutlak zirvesinde yer aldı. Ancak savaş bulutları yaklaşırken, İtalya'daki herkes üzerine düşeni yapmalı. Anlamsız lüksleri sürdürmeyi göze alamayız ve Alfa Romeo fabrikalarının makineleri askeri amaçlar için daha iyi kullanılabilir."
 ITA_redshirts_div_cap_12_tt:0 "§YCamicie Rosse§! şablon kapasitesini §G+12§! artır."
 ITA_redshirts_div_cap_8_tt:0 "§YCamicie Rosse§! şablon kapasitesini §G+8§! artır."
 ITA_reduced_chance_of_air_accidents_tt:0 "\nKarakterleri öldüren tarihi uçak kazaları yaşama şansını azaltır."
 ITA_reestablish_old_alliances:0 "Eski İttifakları Yeniden Kur"
 ITA_reestablish_old_alliances_desc:0 "Büyük Savaş sırasında kurduğumuz ittifakı yeniden kurmaya çalışmalıyız. Ancak Avrupa'nın büyük demokratik güçleriyle birleşerek, bizi bekleyen birçok tehdide karşı galip gelebiliriz."
 ITA_reestablish_old_alliances_tt:0 "§Y[ENG.GetFlag][ENG.GetNameDef]§!'e veya §Y[FRA.GetFlag][FRA.GetNameDef]§!'e ittifaklarına katılma talebi gönderir. \nEğer istenen ülke savaşta ise:"
 ITA_refit_civilian_ships:0 "Sivil Gemileri Yeniden Donat"
 ITA_refit_civilian_ships_desc:0 "Tam teşekküllü filo tipi uçak gemileri çok daha yetenekli olsa da, eğer hızlı bir şekilde uçak gemisi istiyorsak bazı şeylerden ödün vermek gerekir. Rex ve Conte di Savoia gibi mevcut yolcu gemilerini dönüştürerek donanmamız için hızlı bir şekilde hava koruması sağlayabiliriz."
 ITA_refit_civilian_ships_rm_tt:0 "$ITA_modify_military_industry_dynamic_modifier_ns_intro$ \n$ITA_deck_conversions_dynamic_modifier_tt$ \n\n"
 ITA_reggianes_exports:0 "Reggiane'nin İhracatı"
 ITA_reggianes_exports_desc:0 "Reggiane şirketi, hava kuvvetlerini modernize etmek isteyen yabancı orduların dikkatini çeken bir dizi oldukça yetenekli savaş uçağı geliştirdi. Uçaklarını ihraç etmelerine izin verirsek, temel tasarımı farklı özelliklere göre değiştirmekten elde edilecek deneyim şüphesiz kendi geliştirme projelerimiz için oldukça değerli olacaktır."
 ITA_reggianes_exports_ricostruzione_industriale_tt:0 "$ITA_modify_ricostruzione_industriale_dynamic_modifier_ns_intro$ \n$MODIFIER_CONSUMER_GOODS_FACTOR$: §Y-%1.0§! \n\n"
 ITA_regia_aeronautica_name_alt:0 "$ITA_regia_aeronautica_alt_dynamic_modifier$"
 ITA_regia_aeronautica_name_default:0 "$ITA_regia_aeronautica_dynamic_modifier$"
 ITA_regia_marina_name_alt:0 "$ITA_regia_marina_alt_dynamic_modifier$"
 ITA_regia_marina_name_default:0 "$ITA_regia_marina_dynamic_modifier$"
 ITA_regio_esercito_name_alt:0 "$ITA_regio_esercito_alt_dynamic_modifier$"
 ITA_regio_esercito_name_default:0 "$ITA_regio_esercito_dynamic_modifier$"
 ITA_regional_development:0 "Bölgesel Kalkınma"
 ITA_regional_development_buildings_tt:0 "Daha önce geliştirilmiş bölgelerdeki iki eyalete kadar §Yİnşaat Alanı§!, §Y$industrial_complex$§! ve §Y$naval_base$§! ekler. [GetAppropriatePeriodOrColon]\n"
 ITA_regional_development_decision_unlocked_tt:0 "Kararın kilidini açar: §YBölgesel Kalkınma§!."
 ITA_regional_development_desc:0 "İmparatorluğun çeşitli bölgelerine yaptığımız önceki yatırımlar, bu bölgelerde büyük bir ekonomik çıktı artışı için zemini hazırladı. Sadece sözü söylememiz yeterli ve kısa sürede ödülleri toplayabiliriz."
 ITA_regional_development_occupation_law_tt:0 "§Y$colonial_police$§! işgal yasasını şununla değiştir: \n $MODIFIER_LOCAL_RESOURCES$: §G+%15§! \n $MODIFIER_LOCAL_FACTORIES$: §G+%15§! \n $MODIFIER_RESISTANCE_TARGET$: §G-%5§! \n $MODIFIER_RESISTANCE_DAMAGE_TO_GARRISONS$: §G-%5.00§! \n $MODIFIER_REQUIRED_GARRISON_FACTOR$: §G-%5§! \n $MODIFIER_COMPLIANCE_GAIN_ADD$: §G+%0.005§! \n\n"
 ITA_reinforce_aeronautica_ra_tt:0 "$ITA_modify_regia_aeronautica_dynamic_modifier_ns_intro$ \n$MODIFIER_AIR_ACCIDENTS$: §G-%10.0§! \n$MODIFIER_AIR_ATTACK_FACTOR$: §G+%5§! \n $MODIFIER_AIR_AGILITY_FACTOR$: §G+%5§! \n$MODIFIER_AIR_SUPERIORITY_BONUS_IN_COMBAT$: §G+%5.0§! \n\n"
 ITA_reinforce_regia_aeronautica:0 "Regia Aeronautica'yı Güçlendir"
 ITA_reinforce_regia_aeronautica_desc:0 "Regia Aeronautica dünya çapında saygı görüyor ve kıskanılıyor, ancak hala geliştirilecek yer var. Hazırda daha fazla kaynak varken, onu en korkulan hava kuvvetleri yapmak için teçhizata ve eğitime yatırım yapmalıyız!"
 ITA_reinforce_the_gustav_line:0 "Gustav Hattını Güçlendir"
 ITA_reinforce_the_gustav_line_desc:0 "Herhangi bir düşman biriminin ilerlemesini önlemek için savunma hatlarımızı güçlendirmeliyiz. İtalyan Sosyal Cumhuriyeti şimdi tökezlememeli!"
 ITA_remove_balbo_as_advisor_tt:0 "§YItalo Balbo§! artık bir §YDanışman§! veya bir §YMareşal§! olarak mevcut olmayacaktır."
 ITA_remove_grandi_as_advisor_tt:0 "§YDino Grandi§! artık bir §YDanışman§! olarak mevcut olmayacaktır."
 ITA_reorganize_regio_esercito:0 "Regio Esercito'yu Yeniden Düzenle"
 ITA_reorganize_regio_esercito_desc:0 "Yeni liderlikle yeni anlayışlar gelir. Gerçekten bakma zahmetinde bulunan herkes için, muzaffer ordumuzun kesinlikle hala iyileştirilebilecek alanları olduğu açıktır. Son zamanlarda serbest bırakılan kaynaklarla, daha fazla eğitime yatırım yapmalı ve silahlı kuvvetleri yeniden organize etmeliyiz ki hiçbir şey yollarına çıkamasın!"
 ITA_reorganize_regio_esercito_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$ \n$modifier_army_sub_unit_infantry_attack_factor$: §G+%5.0§! \n$MODIFIER_MOTORIZED_ATTACK_FACTOR$: §G+%5.0§! \n$MODIFIER_MECHANIZED_ATTACK_FACTOR$: §G+%5.0§! \n\n"
 ITA_reorganize_the_party:0 "Partiyi Yeniden Düzenle"
 ITA_reorganize_the_party_desc:0 "Partito Nazionale Fascista, entrika ve kendini yüceltme dolu, bayat ve hantal bir kurum haline geldi. Parti etrafında daha sıkı bir kavrayışla, şimdi onu sıfırdan yeniden organize etmeye başlayabilir, daha verimli ve dinamik hale getirebiliriz."
 ITA_request_control_of_french_territories:0 "Fransız Topraklarının Kontrolünü Talep Et"
 ITA_request_control_of_french_territories_desc:0 "$ITA_claims_on_france_desc$"
 ITA_revoke_the_acerbo_law:0 "Acerbo Yasasını Kaldır"
 ITA_revoke_the_acerbo_law_desc:0 "Acerbo Yasası, Mussolini ve faşist partisine İtalya üzerinde o kadar çok aradıkları sağlam kontrolü verdi. Bunun bir daha asla olmasını önlemek için bu yasayı kaldırma zamanı geldi."
 ITA_ricostruzione_industriale_cg_penalty_tt:0 "$ITA_modify_ricostruzione_industriale_dynamic_modifier_ns_intro$ \n$MODIFIER_CONSUMER_GOODS_FACTOR$: §Y+%1.0§! \n\n"
 ITA_roman_faction:0 "Imperium Romanum"
 ITA_russian_government_ideology_alt:0 "Stalinizme Karşı Savaş"
 ITA_russian_government_ideology_alt2:0 "Bizi Bölenlerle Savaş"
 ITA_russian_government_ideology_default:0 "Bize Karşı Çıkanlarla Savaş"
 ITA_russian_government_ideology_desc_alt:0 "Maalesef, kapitalizm ve faşizm yüzleşmemiz gereken tek düşmanlar değil, Stalinist doktrinin takipçileri hükûmetimizi ve ülkemizi çıkarlarına bir tehdit olarak görüyor ve bizi ne pahasına olursa olsun yok etmeye istekliler. Saldırmalarını boş boş bekleyemeyiz, ilk saldıran biz olmalıyız!"
 ITA_russian_government_ideology_desc_alt2:0 "Maalesef, bizi bölmek için çok çalışan bütün ülkeler var. Stalin ve hükûmetine pek sevgi beslemesek de, mevcut durum pek de iyi değil. Bu tür ülkeler bir tehdit oluşturuyor, saldırmalarını boş boş bekleyemeyiz, ilk saldıran biz olmalıyız!"
 ITA_russian_government_ideology_desc_default:0 "Stalinist doktrin olan tehditle başa çıkamadan önce, zaten daha da kötü bir şeyle değiştirilmişti. Bu mevcut liderliğin geçmişte neler yapabildiğini düşünürsek, saldırmalarını boş boş bekleyemeyiz, ilk saldıran biz olmalıyız!"
 ITA_scientific_cooperation:0 "Bilimsel İşbirliği"
 ITA_scientific_cooperation_allies_ns_tt:0 "§Y[ROOT.GetNameDef]§!'e ve §Yher [ROOT.GetAdjective] müttefikine§! Ulusal Ruh §Y$ITA_scientific_cooperation$§! ekle."
 ITA_scientific_cooperation_desc:0 "Diğer dünya güçlerinin teknolojik ilerlemelerine ayak uydurduğumuzdan emin olmak için bir bilimsel işbirliği programı geliştirmeliyiz."
 ITA_scientific_cooperation_research_sharing_group_tt:0 "Her müttefik ülke §Y$ITA_program_for_scientific_cooperation_name$§! teknoloji paylaşım grubuna katılır."
 ITA_sea_wolves_bba:0 "Deniz Kurtları"
 ITA_sea_wolves_bba_desc:0 "$ITA_sea_wolves_desc$"
 ITA_secret_weapons:0 "$secret_weapons$"
 ITA_secret_weapons_desc:0 "$secret_weapons_desc$"
 ITA_secure_the_borders:0 "Sınırları Güvence Altına Al"
 ITA_secure_the_borders_desc:0 "Dünya genelinde artan uluslararası gerilimle birlikte, müttefikimiz olmayan herhangi bir ulus potansiyel olarak düşman kabul edilmelidir. Herhangi bir istilayı önlemek ve durdurmak için sınırlarımızı er ya da geç güçlendirmeli ve garnizon kurmalıyız."
 ITA_secure_the_borders_forts_tt:0 "Dost olmayan bir ülkeye sınırı olan her ile §Y2 $bunker$§! ekler. \nMevcut etkiler:"
 ITA_secure_the_borders_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$ \n$MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$: §G+%5.0§! \n\n"
 ITA_security_militias:0 "Güvenlik Milisleri"
 ITA_security_militias_desc:0 "Cephe birliklerini arka bölge güvenliği için görevlendirmek iyi asker israfıdır. Ordunun arkasını korumak için özel olarak birimler oluşturmalı ve savaşmak için daha fazla askeri serbest bırakmalıyız."
 ITA_seek_british_military_cooperation:0 "İngiliz Askerî İşbirliği Ara"
 ITA_seek_british_military_cooperation_desc:0 "Son savaşta eski müttefiklerimiz tarafından ihanete uğramış olsak da, kinimizin ötesine bakmak ve bir zeytin dalı uzatmak hala mantıklı olabilir. İngilizlerden, özellikle donanmaları ve hava kuvvetleri konusunda öğreneceğimiz çok şey var."
 ITA_seek_papal_support:0 "Papalık Desteği Ara"
 ITA_seek_papal_support_desc:0 "Ülkemizdeki artan sosyal ve siyasi istikrarla başa çıkmak için, tarihsel olarak İtalyan halkı üzerinde çok fazla etkiye sahip olan Kilise'ye yaslanmamız gerekecek. Onayını ve desteğini aramak için Papa'ya yaklaşmalıyız."
 ITA_seize_old_equipment:0 "Eski Teçhizata El Koy"
 ITA_seize_old_equipment_desc:0 "Ülke genelindeki çeşitli cephaneliklerde depolanan büyük miktarda eski askeri teçhizat var. Yaşına rağmen, bu teçhizata el koymak ve kuvvetlerimize dağıtmak, savaşı kazanmada uzun bir yol kat edecektir."
 ITA_self_propelled_guns:0 "Kundağı Motorlu Toplar"
 ITA_self_propelled_guns_desc:0 "Tank savaşı devrim yaratmış olabilir, ancak birçok yönden kundağı motorlu top, savaş alanındaki en değerli araçtır. Nispeten ucuz ve basit araçların sunduğu ateş desteği, tahkimatlarla veya düşman tanklarına karşı savaşırken paha biçilmezdir."
 ITA_self_propelled_guns_military_industry_tt:0 "$ITA_modify_military_industry_dynamic_modifier_ns_intro$ \n$ITA_self_propelled_guns_dynamic_modifier_tt$\n"
 ITA_servizio_informazione_militare:0 "Servizio Informazioni Militare"
 ITA_servizio_informazione_militare_desc:0 "Ordumuzun operasyonlarını planlamak için doğru bilgilere ihtiyacı var. Bunun için, bu bilgiyi toplayan ve analiz eden merkezi bir organizasyona ve gerekirse seçili hedeflere karşı saldırgan eylemlerde bulunan bir organizasyona ihtiyacımız var."
 ITA_setting_course:0 "Rotayı Belirle"
 ITA_setting_course_desc:0 "İtalya krallığı kaderini yerine getirmeye hazır. Gururlu İtalyan halkını büyüklük ve şan bekliyor, nasıl ilerleyeceğimize karar verme zamanı geldi."
 ITA_social_stability:0 "Sosyal İstikrar"
 ITA_social_stability_desc:0 "İç savaşın dehşetini geride bıraktık, toplumumuz şimdi daha adil ve eşitlikçi ve sosyalizme ulaşmak için daha kat etmemiz gereken uzun bir yol olsa da, İtalyan halkının nihayet sosyal barışa ulaştığını gururla söyleyebiliriz."
 ITA_solid_progress:0 "Sağlam İlerleme"
 ITA_solid_progress_completion_tt:0 "Ocak 1936'da $ITA_benito_mussolini$ tarafından verilen hem §Y$ITA_conquer_the_north_mission$§! hem de §Y$ITA_conquer_the_south_mission$§! görevlerinde başarılı olduktan sonra otomatik olarak tamamlanacaktır.\n"
 ITA_solid_progress_desc:0 "Etiyopya'da, hatlarımızı aşırı uzatmadan veya kuvvetlerimizi Etiyopya karşı saldırılarına maruz bırakmadan istikrarlı bir ilerleme kaydediyoruz. Zafer henüz elde edilmemiş olsa da, bu sadece bir zaman meselesi."
 ITA_south_american_alliances:0 "Güney Amerika İttifakları"
 ITA_south_american_alliances_desc:0 "İttifakımızın sınırlarını genişletme zamanı geldi. Latin Amerika uluslarına ulaşacak ve onları etrafımızı saran birçok tehdide karşı güçlü bir ittifak kurmanın önemi konusunda ikna edeceğiz."
 ITA_spanish_italian_alliance:0 "İspanyol-İtalyan İttifakı"
 ITA_spanish_italian_alliance_desc:0 "$ITA_spanish_italian_faction_desc$"
 ITA_special_brigades:0 "Özel Tugaylar"
 ITA_special_brigades_desc:0 "Büyük taarruzlar sırasında muharebede askeri birimlerimizi destekleyebilecek özel saldırı tugayları oluşturacağız. Bu tugaylar, kendi birimleri içinde kendilerini ayırt etmiş milislerden oluşacaktır."
 ITA_special_brigades_tt:0 "Destek taburu §Y$blackshirt_assault_battalion$§!'un kilidini açar."
 ITA_specialization:0 "Uzmanlaşma"
 ITA_specialization_desc:0 "Ne kadar uğraşırsak uğraşalım, ham çıktı açısından daha büyük güçlerle asla boy ölçüşemeyiz. Havada rekabet etmenin tek yolu, herkesten daha iyi uçaklar yapmaktır. Her biri, üçe veya dörde bir sayıca azken bile bir savaşı kazanabilmelidir."
 ITA_specialization_ra_tt:0 "$ITA_modify_military_industry_dynamic_modifier_ns_intro$ \n$MODIFIER_AIR_EQUIPMENT_UPGRADE_XP_COST$: §G-%50§! \n$ITA_specialization_dynamic_modifier_tt$\n"
 ITA_spreading_the_eagles_wings:0 "Kartalın Kanatlarını Yaymak"
 ITA_spreading_the_eagles_wings_desc:0 "Çevremizdeki diğer ideolojiler çöküyor ve başarısız oluyor. Görünüşe göre sadece faşizm bu çalkantılı olayların saldırısına dayanıklılıkla karşı koydu ve hatta gelişti. Bu istikrarı diğer uluslara da getirmek bizim görevimizdir; onlara bu karanlık zamanlarda bir ışık feneri getirmek!"
 ITA_spreading_the_eagles_wings_tt:0 "Avrupa'daki §Ydost olmayan komşu uluslara§! karşı §YKukla§! savaş hedefi kazanır:"
 ITA_standardization:0 "Standardizasyon"
 ITA_standardization_desc:0 "Havadaki savaş, denizdeki ve karadaki savaştan daha çok, sanayiye karşı bir sanayi savaşıdır. Sadece kütle ve kütle belirleyicidir. Daha sonra tasarımları değiştirmenin daha zor hale gelmesi anlamına gelse bile, mümkün olduğunca çok uçak üretebildiğimizden emin olmalıyız."
 ITA_standardization_ra_tt:0 "$ITA_modify_military_industry_dynamic_modifier_ns_intro$ \n$MODIFIER_AIR_EQUIPMENT_UPGRADE_XP_COST$: §R+%25§! \n$ITA_standardization_dynamic_modifier_tt$\n"
 ITA_steel_in_tripoli:0 "Trablus'ta Çelik"
 ITA_steel_in_tripoli_desc:0 "Trablus dışındaki çöllerde gömülü büyük miktarda demir var gibi görünüyor, sadece kazıp işlememizi bekliyor. Yakınına bir çelik tesisi inşa ederek, çeliği şanlı kuvvetlerimizin ilerlemesini daha da ileriye taşımak için kullanabiliriz!"
 ITA_steel_industry_in_terni:0 "Terni'de Çelik Sanayisi"
 ITA_steel_industry_in_terni_desc:0 "Terni çelik fabrikaları uzun zamandır İtalyan çelik üretiminin bel kemiğini oluşturmuştur. Gelecek savaşlarda onlara daha da fazla güvenmemiz gerekecek. Şimdi yapılan birkaç yatırım şüphesiz daha sonra büyük ölçüde karşılığını verecektir."
 ITA_steel_industry_in_terni_ricostruzione_industriale_tt:0 "$ITA_modify_ricostruzione_industriale_dynamic_modifier_ns_intro$ \n$modifier_production_speed_arms_factory_factor$: §G+%2.50§! \n\n"
 ITA_stockpile_fuel:0 "Yakıt Stokla"
 ITA_stockpile_fuel_desc:0 "Petrol, gemilerimizin damarlarında dolaşan kandır, onsuz filo etkisiz hale gelir. İtalya'nın önemli yerli petrol kaynaklarından yoksun olmasıyla, gelecekteki çatışmalar bizi ithalattan kesse bile kuvvetlerimizi sürdürmek için petrol depolama tankları inşa etmek ve doldurmak hayati önem taşır."
 ITA_stop_the_squandering:0 "İsrafı Durdur"
 ITA_stop_the_squandering_desc:0 "Mussolini çok uzun zamandır İtalya'nın karşılayamayacağı parayı ve kaynakları harcıyor - bu pervasız israflara bir son verme zamanı geldi! Harcamalarımızı dizginlemeli ve sermayemizi diğer alanları iyileştirmeye odaklamalıyız."
 ITA_stop_the_squandering_military_industry_tt:0 "$ITA_modify_military_industry_dynamic_modifier_ns_intro$ \n$MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY$: §G+%5.00§! \n\n"
 ITA_stop_the_squandering_ricostruzione_industriale_tt:0 "$ITA_modify_ricostruzione_industriale_dynamic_modifier_ns_intro$ \n$modifier_production_speed_arms_factory_factor$: §G+%5.00§! \n\n"
 ITA_strengthen_ascari_corps:0 "Askari Kolordusunu Güçlendir"
 ITA_strengthen_ascari_corps_create_units_tt:0 "Sahip olunan ve kontrol edilen sömürgelerde §Y[ROOT.GetFlag][ROOT.GetAdjective]§! birimleri oluştur:"
 ITA_strengthen_ascari_corps_desc:0 "İmparatorluğun Avrupa kısımlarından gelen birliklerimiz genellikle Afrika'nın sert ikliminde zorlanıyor. Yerliler, açıkçası, aynı sorunlardan muzdarip değil. Sıcak iklimlerde savaşırken birliklerimizi desteklemek için onlardan bazılarını işe almalıyız."
 ITA_strengthen_ascari_corps_eritrea_tt:0 "§Y1 $infantry$ tümeni§!, §Y1 $cavalry$ tümeni§! ve §Y1 $camelry$ tümeni§! oluştur."
 ITA_strengthen_ascari_corps_ethiopia_tt:0 "§Y2 $infantry$ tümeni§! oluştur."
 ITA_strengthen_ascari_corps_ibrahim_farag_mohammed_tt:0 "\nHem §Y$ITA_strengthen_ascari_corps$§! hem de §Y$ITA_forza_navale_especiale$§! odakları tamamlandığında:"
 ITA_strengthen_ascari_corps_libya_tt:0 "§Y1 $infantry$ tümeni§!, §Y1 $cavalry$ tümeni§! ve §Y2 $camelry$ tümeni§! oluştur."
 ITA_strengthen_ascari_corps_somalia_tt:0 "§Y2 $infantry$ tümeni§! oluştur."
 ITA_strengthen_northern_industry:0 "Kuzey Sanayisini Güçlendir"
 ITA_strengthen_northern_industry_desc:0 "Kuzey İtalya uzun zamandır ülkemizin sanayi merkezi olmuştur. Tüm bölge, sadece küçük bir zaman ve kaynak yatırımıyla daha da büyümek için mükemmel bir konumdadır."
 ITA_strengthen_the_blackshirts:0 "Kara Gömleklileri Güçlendir"
 ITA_strengthen_the_blackshirts_desc:0 "Kraliyet Ordusu, eski rejimlerin yollarına çok fazla bağlıdır ve defalarca rahatsız edici bir faşist coşku eksikliği göstermiştir. Kendi, sadık Kara Gömleklilerimizden oluşan tüm tümenlere sahip olmamız gerektiği açıktır."
 ITA_strengthen_the_blackshirts_spawn_divs_tt:0 "§Y[THIS.GetName]§!'da §Y3 Camicie Nere§! tümeni oluştur."
 ITA_strengthen_the_blackshirts_template_tt:0 "Camicie Nere Tümen şablonuna §Y1 $artillery$ taburu§! ekler. \n$ITA_blackshirts_div_cap_12_tt$"
 ITA_strengthen_the_papacy:0 "Papalığı Güçlendir"
 ITA_strengthen_the_papacy_desc:0 "Papa'nın İtalyan toplumundaki etkisinin gerçekten güçlü olduğu açıktır. Ulusal istikrarı sürdürmenin tek yolu, Kilise'yi İtalya Krallığı içinde güçlendirmektir."
 ITA_strengthen_the_regime:0 "Rejimi Güçlendir"
 ITA_strengthen_the_regime_desc:0 "Ekonomik bağımsızlık savaşları, faşizmin, ondan önceki liberal rejimler gibi zayıf ve yumuşak bir ideoloji olmadığını göstermiştir. Halkın bunu asla unutmadığından emin olmalıyız."
 ITA_struggle_in_ethiopia:0 "Etiyopya'da Mücadele"
 ITA_struggle_in_ethiopia_desc:0 "Etiyopya'daki ilerlememiz programın çok gerisinde, ancak böyle küçük bir aksiliğin moralimizi bozmasına izin veremeyiz. İtalyan silahları ve faşist sistem galip gelecektir - ne pahasına olursa olsun."
 ITA_subdue_the_sentinels:0 "Nöbetçileri Dize Getir"
 ITA_subdue_the_sentinels_desc:0 "İtalyan halkının hak ettiği özgürlük ve şana doğru bir sonraki adım, bizi Akdeniz'de esir tutan nöbetçileri, yani Cebelitarık ve Süveyş'i dize getirmektir."
 ITA_superaereo:0 "Superaereo"
 ITA_superaereo_desc:0 "Küçük uçak gruplarının oraya buraya uçtuğu günler çok geride kaldı. Modern bir hava harekatı, birçok yönden herhangi bir kara tabanlı girişimin karmaşıklığına benzer. Bu nedenle, çeşitli filolarımızı koordine etmek için özel bir planlama personeline ihtiyacımız var ki görevlerini başarmak için birlikte hareket edebilsinler."
 ITA_superaereo_ra_tt:0 "$ITA_modify_regia_aeronautica_dynamic_modifier_ns_intro$ \n$MODIFIER_AIR_MISSION_EFFICIENCY$: §G+%5§! \n$MODIFIER_AIR_MISSION_XP_FACTOR$: §G+%5§! \n$MODIFIER_AIR_DOCTRINE_COST_FACTOR$: §G-%10.00§! \n\n"
 ITA_superesercito:0 "Superesercito"
 ITA_superesercito_desc:0 "Büyük bir orduyu koordine etmek kolay bir iş değildir. Sahadaki kuvvetleri yönlendirebilecek ve destekleyebilecek bir üst komuta yapısı oluşturmalıyız."
 ITA_superesercito_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$ \n$MODIFIER_ARMY_ORG$: §G+%5.0§! \n$MODIFIER_ORG_LOSS_WHEN_MOVING$: §G-%5.0§! \n$MODIFIER_LAND_DOCTRINE_COST_FACTOR$: §G-%10.00§! \n\n"
 ITA_supermarina:0 "Supermarina"
 ITA_supermarina_desc:0 "Regia Marina’nın Başkomutanı için, Akdeniz ve ötesindeki deniz oluşumlarımızın operasyonlarını koordine etmek üzere modern bir operasyon merkezi kurulmalıdır."
 ITA_supermarina_rm_tt:0 "$ITA_modify_regia_marina_dynamic_modifier_ns_intro$ \n$MODIFIER_NAVAL_MORALE$: §G+%10.0§! \n$MODIFIER_STRIKE_FORCE_MOVING_ORG$: §G-%5.00§! \n$MODIFIER_NAVAL_DOCTRINE_COST_FACTOR$: §G-%10.00§! \n\n"
 ITA_support_albanian_irredentism:0 "Arnavut İrredantizmini Destekle"
 ITA_support_albanian_irredentism_desc:0 "Arnavutluk üzerindeki İtalyan yönetimini meşrulaştırmaya çalışmalıyız. Kosova ve Epir bölgelerinde ve hatta daha ilerisinde Arnavut irredantizmini desteklemek, bize yerel halktan önemli bir kamuoyu desteği kazandıracak ve etki alanımızı daha da genişletme fırsatı sunacaktır."
 ITA_support_albanian_irredentism_subject_effects_tt:0 "\nAşağıdaki etkiler, eğer §Y[ALB.GetFlag][ALB.GetNameDefCap]§!, §Y[ROOT.GetFlag][ROOT.GetName]§!'nin bir §Ybağlı devleti§! ise uygulanacaktır:"
 ITA_supremacy_in_the_skies:0 "Göklerde Üstünlük"
 ITA_supremacy_in_the_skies_desc:0 "Modern bir ordu, güçlü bir hava kuvvetlerinin desteği olmadan başarılı bir şekilde faaliyet gösteremez. Ülkemizin göklere hükmedecek son teknoloji uçaklara ve teknolojiye sahip olması son derece önemlidir."
 ITA_supremacy_in_the_skies_ra_tt:0 "$ITA_modify_regia_aeronautica_dynamic_modifier_ns_intro$ \n$MODIFIER_AIR_SUPERIORITY_EFFICIENCY$: §G+%5§! \n$MODIFIER_AIR_INTERCEPT_EFFICIENCY$: §G+%5§! \n$MODIFIER_AIR_SUPERIORITY_BONUS_IN_COMBAT$: §G+%5.0§!\n\n"
 ITA_the_abyssinian_fiasco:0 "Habeşistan Fiyaskosu"
 ITA_the_abyssinian_fiasco_completion_tt:0 "Ocak 1936'da $ITA_benito_mussolini$ tarafından verilen §Y$ITA_conquer_the_north_mission$§! ve §Y$ITA_conquer_the_south_mission$§! görevleri başarısız olduktan sonra otomatik olarak tamamlanabilir.\n"
 ITA_the_abyssinian_fiasco_desc:0 "Etiyopya'yı istilamız bir felakete dönüştü. Bir kez daha, bir İtalyan ordusunun bir Etiyopya ordusunu yenememesinin utanç verici bir gösterisiyle karşı karşıyayız. Adwa'daki atalarımız gibi, biz de yenildik. Bu büyüklükteki bir yenilginin İtalya'daki faşist sistemin geleceği için ne anlama geldiğini sadece tahmin edebiliriz."
 ITA_the_carabinieri:0 "Carabinieri"
 ITA_the_carabinieri_desc:0 "Carabinieri'nin faşist rejimin düşüşünde oynadığı rol nedeniyle, şimdi faşistler tarafından saldırıya uğruyorlar, bu da birçoğunun İtalyan direniş hareketine katılmasına neden oluyor. Bu birimleri İtalyan Kurtuluş Kolordusuna bağlamalıyız."
 ITA_the_carabinieri_spawn_divs_tt:0 "§Y[THIS.GetName]§!'da §Y5 $infantry$§! tümeni oluştur. \n\n"
 ITA_the_catholic_dominion:0 "Katolik Hakimiyeti"
 ITA_the_catholic_dominion_desc:0 "Papalığın bir kez daha hesaba katılması gereken büyük bir güç olarak yükselmesiyle, tüm sadık Hristiyanlara ulaşma ve tıpkı çobanın sürüsünü yönlendirip onları kötülükten koruduğu gibi, halkı yönlendiren el olarak hareket etme zamanımız geldi. Bu, Tanrı'nın emridir!"
 ITA_the_eastern_threat:0 "Doğu Tehdidi"
 ITA_the_eastern_threat_claims_tt:0 "§YKaradeniz'de [SOV.GetFlag][SOV.GetNameDef] tarafından sahip olunan her eyalet§! üzerinde hak iddia eder. \nMevcut etkiler:"
 ITA_the_eastern_threat_desc:0 "Yükselen Sovyetler Birliği'nin sadece kendi çıkarlarımıza değil, aynı zamanda tüm Batı güçlerinin çıkarlarına da bir tehdit oluşturduğu bir sır değil. Onlara erişebilecekleri en zengin bölgelerden birini, yani Karadeniz'i reddederek bu ülkenin genişleme yeteneğini felç edeceğiz."
 ITA_the_enemies_of_capitalism:0 "Kapitalizmin Düşmanları"
 ITA_the_enemies_of_capitalism_desc:0 "Sovyet komünizmi, tüm Avrupa'ya ve dolayısıyla İtalyan devletine büyük bir tehdit oluşturuyor. Onlarla ilgilenme zamanı geldi."
 ITA_the_ethiopian_question:0 "Etiyopya Sorunu"
 ITA_the_ethiopian_question_desc:0 "Etiyopya'daki savaş acımasız ve adaletsiz bir mesele olmuştur. Ülkedeki faşistlerin neden olduğu vahşetlerin telafisini yapmalı ve uzlaşma aramak için yerel makamlara ulaşmalıyız."
 ITA_the_fate_of_mussolini:0 "Mussolini'nin Kaderi"
 ITA_the_fate_of_mussolini_desc:0 "Mussolini ev hapsinde kalmaya devam ederken, üzerimizdeki her zaman var olan varlığıyla gerçekten ilerleyemeyiz. Parti içindeki gerçek güç olarak konumumuzu güvence altına aldık ve bu yüzden eski Duce'nin kaderine karar verme zamanı geldi!"
 ITA_the_fight_against_stalinism:0 "[GetAppropriateRussianGovernmentIdeology]"
 ITA_the_fight_against_stalinism_desc:0 "[GetAppropriateRussianGovernmentIdeologyDesc]"
 ITA_the_fight_overseas:0 "Denizaşırı Savaş"
 ITA_the_fight_overseas_bunkers_tt:0 "Tamamen kontrol edilen bir Afrika eyaletinde bir $naval_base$ veya $supply_node$ olan her ile §Y2 Kara Kalesi§! ve §Y2 Kıyı Kalesi§! ekle."
 ITA_the_fight_overseas_desc:0 "Afrika kıtasındaki büyük askeri kampanyaları desteklemek için savunmayı güçlendirme ve lojistik hazırlama zamanı geldi. Birliklerimizin ve donanmalarımızın karşılaşacakları birçok zorlu koşulda en iyi şekilde performans göstermeleri için özel eğitim teknikleri geliştireceğiz."
 ITA_the_fight_overseas_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$ \n$MODIFIER_HEAT_ATTRITION_FACTOR$: §G-%10.00§! \n$MODIFIER_SUPPLY_CONSUMPTION_FACTOR$: §G-%5.0§! \n$MODIFIER_ACCLIMATIZATION_HOT_CLIMATE_GAIN_FACTOR$: §G+%15.0§! \n\n"
 ITA_the_fight_overseas_rm_tt:0 "$ITA_modify_regia_marina_dynamic_modifier_ns_intro$ \n$MODIFIER_NAVAL_INVASION_CAPACITY$: §G+10§! \n$MODIFIER_NAVAL_INVASION_PREPARATION_SPEED$: §G+%15.0§! \n\n"
 ITA_the_fourth_shore:0 "Dördüncü Kıyı"
 ITA_the_fourth_shore_desc:0 "Libya sık sık İtalya’nın Dördüncü Kıyısı olarak anılır ve ulusumuzun geleceğinin ayrılmaz bir parçasıdır. En yakın sömürgedir ve Afrika kıtasının geri kalanına bir bağlantı görevi gördüğü için en değerlilerinden biridir. Buraya kaynak yatırımı yaparak, denizaşırı mülklerimizi güvence altına alıyor ve gelecekte bolca kazanç elde etmeyi umuyoruz."
 ITA_the_garibaldi_legion:0 "Garibaldi Lejyonu"
 ITA_the_garibaldi_legion_desc:0 "İspanya iç savaşında Uluslararası Tugayların bir parçası olarak İspanya Cumhuriyeti'ndeki yoldaşlarımızın yanında savaşmak için gönüllü birlikler organize edeceğiz."
 ITA_the_holy_lands:0 "Kutsal Topraklar"
 ITA_the_holy_lands_desc:0 "Filistin kadar önemli bir bölge, Hristiyan inancı için meşru olarak Tanrı'nın Krallığına aittir. Kutsal Toprakların bize gecikmeden iade edilmesini sağlamalıyız."
 ITA_the_italian_confederation:0 "İtalyan Konfederasyonu"
 ITA_the_italian_confederation_desc:0 "Sömürge politikamızı gözden geçirdikten sonra, atmamız gereken bir sonraki adım, bu sömürgesizleştirme sürecinden kaynaklanan tüm devletleri içeren bir konfederasyon kurmaktır, bu da uluslarımızın işbirliği yapabileceği ve karşılıklı olarak fayda sağlayabileceği bir çerçeve olarak hizmet edecektir."
 ITA_the_italian_confederation_effects_tt:0 "Başkentlerine §G1§! İnşaat Alanı ve §Y1 Sivil Fabrika§! ekle. \nÜlke §Y[ROOT.GetFlag][ROOT.GetAdjective] İttifakına§! katılır."
 ITA_the_italian_legions:0 "İtalyan Lejyonları"
 ITA_the_italian_legions_desc:0 "Silahlı kuvvetlerimiz yakın geçmişte göreve yükselmemiş olabilir, ancak şimdi İtalyan halkı Roma mirasımızdan her zamankinden daha gururlu olduğuna göre, lejyonlarımızın binlerce yıl önce olduğu kadar bugün de korkutucu olmasını sağlamak için silahlı kuvvetlerimize yeni doktrinler dayatmalıyız."
 ITA_the_italian_legions_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$ \n$MODIFIER_ARMY_SPEED_FACTOR_FOR_CONTROLLER$: §G+%5.00§! \n$MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$: §G+%5.0§! \n$MODIFIER_MAX_COMMAND_POWER_MULT$: §G+%15§! \n\n"
 ITA_the_italian_liberation_war:0 "İtalyan Kurtuluş Savaşı"
 ITA_the_italian_liberation_war_desc:0 "Faşistlere karşı ayaklanma ve onların hasta rejimini devirme zamanı geldi! İtalya'nın dört bir yanından gelen anti-faşist partizanlar, bu Ulusal Kurtuluş Savaşı'nda savaşmaya ve canlarını vermeye hazır!"
 ITA_the_italian_republic:0 "İtalyan Cumhuriyeti"
 ITA_the_italian_republic_desc:0 "Monarşi, devrimimizi engellemekten başka bir işe yaramayan eski ve çürümüş bir sistemdir. Kraliyet ailesinden kurtulma ve takipçileriyle ilgilenme zamanı geldi."
 ITA_the_italian_social_republic:0 "İtalyan Sosyal Cumhuriyeti"
 ITA_the_italian_social_republic_desc:0 "İtalya'daki kraliyetçiler ve diğer anti-faşist unsurlar, rejimimize karşı haince ayaklandılar. Partimizi anti-monarşist bir Cumhuriyetçi Faşist Parti olarak yeniden şekillendirdik ve İtalyan faşist devletinin yeni bir enkarnasyonu olan İtalyan Sosyal Cumhuriyeti'ni yarattık. Düşman saldırısına direnecek ve toprağımızı yeniden birleştireceğiz!"
 ITA_the_king_of_the_skies:0 "Göklerin Kralı"
 ITA_the_king_of_the_skies_desc:0 "Romalı atalarımızın aksine, silahlı kuvvetlerimizin karada ve denizde en iyi şekilde faaliyet gösterebilmesi için göklere hükmetmesi gerekiyor. İtalyan uçakları zaten çok yönlülükleri ve kaliteleriyle ünlüdür, ancak havacılık mühendislerimizin bir adım öne çıkıp gerçek bir uçan kale geliştirmelerinin zamanı geldi."
 ITA_the_king_of_the_skies_military_industry_dm_tt:0 "$ITA_modify_military_industry_dynamic_modifier_ns_intro$ \n$ITA_the_king_of_the_skies_dynamic_modifier_tt$ \n\n"
 ITA_the_kings_finest:0 "Kralın En İyileri"
 ITA_the_kings_finest_desc:0 "İtalyan tacına sadık asker ve subaylardan oluşan özel tümenler kuracağız ve onları Kurtuluş Ordumuzun seçkinleri olmak üzere eğiteceğiz."
 ITA_the_kings_finest_spawn_divs_tt:0 "[THIS.GetName]'da §Y3 $infantry$§! tümeni ve §Y1 Divisione Celere§! oluştur. \n\n"
 ITA_the_man_of_providence:0 "İlahi Takdirin Adamı"
 ITA_the_man_of_providence_desc:0 "Mussolini sadece doğru zamanda doğru yerde değildi. Her adım, sanki ilahi bir irade tarafından, Mussolini'nin İtalya'nın dizginlerini ele geçirdiği zamanı sağlamak için yönlendirildi."
 ITA_the_new_emperor_of_ethiopia:0 "Etiyopya'nın Yeni İmparatoru"
 ITA_the_new_emperor_of_ethiopia_desc:0 "Etiyopya halkı yüzyıllardır bir imparator altında yaşadı. Eğer onlara eskisi yerine yeni bir İmparator sunabilirsek, Kralımızı yeni İmparator olarak taçlandırarak görevimizi şüphesiz çok daha basitleştiririz."
 ITA_the_new_emperor_of_ethiopia_has_idea_vittorio_emanuele_tt:0 "§Y$vittorio_emanuele$§! ulusal ruhuna sahip!"
 ITA_the_new_emperor_of_ethiopia_king_trait_tt:0 "$neutrality$ lideri $vittorio_emanuele$:"
 ITA_the_papacy_reborn:0 "Papalığın Yeniden Doğuşu"
 ITA_the_papacy_reborn_desc:0 "Kutsal Peder kralı devirip İtalya'nın tam kontrolünü ele aldığına göre, İtalyan halkının Kilise'nin vizyonu ve hedefleri doğrultusunda hizalanma zamanı geldi."
 ITA_the_path_to_progress:0 "İlerleme Yolu"
 ITA_the_path_to_progress_aid_effects_tt:0 "Bizi destekleyen her ülke için §Yteçhizat§! ve geçici bir §Ytüketim malları§! bonusu alacağız."
 ITA_the_path_to_progress_desc:0 "Bizimle işbirliği yapmaya ve maruz kaldığımız yıkıcı iç savaştan kurtulmamıza yardımcı olmaya istekli olabilecek dünya çapındaki komünist ve sosyalist hükûmetlere ulaşacağız."
 ITA_the_path_to_progress_event_tt:0 "Bizimle barış içinde olan her §YKomünist§! veya §YDemokratik-Sosyalist§! ülke, yeni hükûmetimizi ekonomik olarak ve teçhizat açısından desteklemek için bir olay alacak."
 ITA_the_popular_front:0 "Halk Cephesi"
 ITA_the_popular_front_desc:0 "İç savaş, komünistlerin sadece İtalyan halkını faşizme karşı zafere götürmekle kalmayıp, aynı zamanda ülkemizin o kadar umutsuzca ihtiyaç duyduğu sosyal ve endüstriyel ilerlemeye de götürebilecek kapasitede olduğunu göstermiştir."
 ITA_the_republics_leadership:0 "Cumhuriyetin Liderliği"
 ITA_the_republics_leadership_desc:0 "Genç İtalyan Cumhuriyeti'ni halkımızın hak ettiği sosyalist topluma yönlendirecek doğru partiyi ve siyasi lideri seçmeliyiz. Hem Ferrucio Parri hem de Ivanoe Bonomi, bu görevi yerine getirmek için son derece nitelikli değerli adaylar gibi görünüyor."
 ITA_the_social_republic_prevails:0 "Sosyal Cumhuriyet Galip Geliyor!"
 ITA_the_social_republic_prevails_desc:0 "Bir avuç manipülatif hain tarafından başlatılan bu acı savaşta çok kan döktük, ama şimdi buna bir son verme zamanı. İtalyan devleti yeniden doğacak, her zamankinden daha güçlü!"
 ITA_the_social_republic_prevails_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$ \n$MODIFIER_CONSCRIPTION_TOTAL_FACTOR$: §G+%10§! \n$MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$: §G+%5.0§! \n\n"
 ITA_the_southern_farmlands:0 "Güney Tarım Arazileri"
 ITA_the_southern_farmlands_desc:0 "Faşist rejimin boşa harcanan çabalarına rağmen, İtalya pratik olarak kırsal bir ülkedir. Devrimimizi başarıyla gerçekleştirmek için köylülüğe güvenmeliyiz ve köylülerin en güçlü olduğu yer kesinlikle İtalya'nın güneyidir."
 ITA_the_southern_farmlands_tt:0 "§Yİç savaş başladığında§!: \n§YGüney İtalyan eyaletlerinin§! kontrolünü ele alacağız. \n§Y5§! ekstra §Y$militia$ tümeni§! oluşturur. \nFaşist taraf altyapı ve ikmal merkezlerinde hasar görecek. Faşist tümenler yıpranmadan hasar alacak."
 ITA_thermojet_research:0 "Termojet Araştırması"
 ITA_thermojet_research_desc:0 "Mühendislerimiz, gelecekte uçakların artık pervanelerle sürülmeyeceğine veya pistonlu motorlarla çalışmayacağına inanıyor. Bunun yerine, yeni bir teknoloji uçakları çok daha hızlı yapacak ve radikal olarak farklı uçak tasarımlarını mümkün kılacaktır. İtalya bu gelişmenin ön saflarında olmalıdır."
 ITA_to_live_as_a_lion:0 "Bir Aslan Olarak Yaşamak"
 ITA_to_live_as_a_lion_desc:0 "İtalyan halkı koyun olmak için yaratılmadı. Sessizce oturup tarihin ikinci sırasında yer almak için değiller. Kendi kaderlerini ele geçirmek için yaratıldılar! Benito Mussolini, onlara bunu yaptıracak ve yüz yıl koyun olarak yaşamaktansa bir gün aslan olarak yaşamanın daha iyi olduğunu hatırlatacak olan adamdır."
 ITA_to_live_as_a_lion_missiolinis_tt:0 "\nMussolini tarafından verilen görevlerin tamamlanması için daha kısa bir süresi olacak, ancak daha yüksek ödüller verecektir."
 ITA_topple_amhara_rulers:0 "Amhara Hükümdarlarını Devir"
 ITA_topple_amhara_rulers_desc:0 "Etiyopya, çoğunun inandığından çok daha çeşitli ve parçalanmış bir ülkedir. Eski Etiyopya rejiminin güçlü destekçisi olmayan birçok grup var. Onlara bazı küçük tavizler vermek, onları kolayca bizim tarafımıza çeker ve bölgeyi sakinleştirmeyi çok daha kolay hale getirir."
 ITA_topple_amhara_rulers_event_chain_tt:0 "\nİstersek, bazı Etiyopya eyaletlerinde uyumu artırmamıza veya bir İtalyan bağlı devleti kurmamıza olanak tanıyan §YYerel Hükümdarlar İtalyan Yetkililere Yaklaşıyor§! olay zincirini başlatır."
 ITA_towards_a_greater_italy:0 "Daha Büyük bir İtalya'ya Doğru"
 ITA_towards_a_greater_italy_desc:0 "İtalyan irredantizmi, İtalyan halkının Büyük Savaş'tan sonra İtilaf Devletleri tarafından maruz bırakıldığı ihanetin doğal bir sonucudur. Haklı olarak, İtalya Akdeniz üzerinde tam bir egemenliğe sahip olmalıdır ve bunun için sınırlarımızı genişletmeliyiz."
 ITA_treaty_with_germany:0 "Almanya ile Antlaşma"
 ITA_treaty_with_germany_desc:0 "$ITA_german_rd_treaty_desc$"
 ITA_triumph_in_africa_bba:0 "Afrika'da Zafer"
 ITA_triumph_in_africa_bba_desc:0 "Adwa'nın utancı silindi. Etiyopyalıların elinde uğradığımız aşağılanmadan yaklaşık 40 yıl sonra, nihayet intikamımızı aldık. Kuvvetlerimiz yeteneklerini şüpheye yer bırakmayacak şekilde kanıtladı ve tüm dünya şimdi gücümüzü kabul etmeli!"
 ITA_undermine_the_duce:0 "Duce'yi Zayıflat"
 ITA_undermine_the_duce_desc:0 "Mussolini'nin Etiyopya'yı fethetme çılgın arzusu bizi bir kez daha yenilginin eşiğine getirdi. Zafer kesinlikle hala mümkün olsa da, bunun Mussolini'nin zaferi olmayacağı açık olmalıdır."
 ITA_union_in_the_party:0 "Partide Birlik"
 ITA_union_in_the_party_desc:0 "Parti içindeki birlik, ülkemizin komünizme doğru gelişmesi için en önemli faktördür. Tüm üyelerin aynı vizyonu paylaştığından, aynı hedeflere sahip olduğundan ve bunları başarmak için parti tarafından belirlenen süreçleri takip ettiğinden emin olmalıyız."
 ITA_unite_the_opposition:0 "Muhalefeti Birleştir"
 ITA_unite_the_opposition_cw_benefits_tt:0 "\nBir dizi ordu subayına yaklaşacak ve iç savaş başladığında bazı birimlerle birlikte bizim tarafımıza katılmaya ikna etmeye çalışacağız."
 ITA_unite_the_opposition_desc:0 "Faşizmin kökleri İtalya'da güçlüdür ve onu ortadan kaldırmak büyük bir çaba gerektirecektir. Faşist rejime karşı çıkan farklı gruplar arasında ortak hedefler bulmalıyız, çünkü ancak birleşirsek iğrenç Duce'yi devirebiliriz."
 ITA_united_anarchist_confederations:0 "Birleşik Anarşist Konfederasyonları"
 ITA_united_anarchist_confederations_desc:0 "Faşizme ve kapitalizme karşı mücadelemizde İspanyol anarşistlerinin ve dünya çapındaki diğer anarşistlerin işbirliğini aramalıyız. Dünya çapından aktivistleri, aydınları ve özgürlük savaşçılarını barındırmak için bir Büyük İşbirliği Komisyonu kuracağız."
 ITA_united_anarchist_confederations_tt:0 "\nEğer [SPC.GetNameDef] varsa etkiler geliştirilecek ve onlara karşılıklı garantiler kurulmasını teklif ederek ulaşacağız."
 ITA_unlocks_decision_cede_aquila_class_destroyers_to_spain_tt:0 "Kararın kilidini açar: §YAquila Sınıfı Muhripleri Devret§!\n\n"
 ITA_utilize_the_blackshirts:0 "Kara Gömleklileri Kullan"
 ITA_utilize_the_blackshirts_desc:0 "Kara Gömlekliler tarihsel olarak faşist rejime ve Duce'ye sadık olsalar da, eğer onlara örgütlerinin bu yeni rejimde gelişme alanı olduğunu gösterirsek, belki de onları kendi çıkarlarımız için kullanabiliriz. Sonuçta, iki rejim arasında gerçekten o kadar büyük bir fark var mı?"
 ITA_vallo_alpino_del_littorio:0 "Vallo Alpino del Littorio"
 ITA_vallo_alpino_del_littorio_desc:0 "Kara sınırlarımız neredeyse tamamen Alplerle kaplıdır. Bu dağlar kendi başlarına zorlu bir engel olsa da, geçen savaşta tamamen geçilmez olmadıklarını öğrendik. Bir dizi tahkimat inşa etmek, herhangi bir düşman kara istilasına karşı hattı tutmamıza yardımcı olacaktır."
 ITA_vallo_alpino_del_littorio_tt:0 "\nAlpler'deki savunma hatlarını genişletmek için §Y$ITA_vallo_alpino_del_littorio_dec_cat$§! kararlarının kilidini açar.\n\n"
 ITA_via_della_vittoria:0 "Via della Vittoria"
 ITA_via_della_vittoria_desc:0 "Kötü altyapı, Kuzey Afrika'daki operasyonlarımızı engellemeye devam ediyor. Tek bir 'Zafer Yolu' etrafında daha büyük bir çaba, durumu önemli ölçüde iyileştirebilir ve Mısır sınırı çevresinde daha özgürce hareket etmemizi sağlayabilir."
 ITA_via_della_vittoria_extra_states_tt:0 "\nAkdeniz'deki her Kuzey Afrika eyaletine, §Y[ROOT.GetFlag][ROOT.GetNameDef]§! veya bir §Y[ITA.GetFlag][ITA.GetAdjective] bağlı devleti§! tarafından kontrol edilenlere §Y1 $infrastructure$§! ekler.\nMevcut etkiler:"
 ITA_war_with_france:0 "[FRA.GetName] ile Savaş"
 ITA_war_with_france_claims_tt:0 "§Y$STRATEGICREGION_182$§!, §Y$STRATEGICREGION_126$§!, §Y$STRATEGICREGION_128$§!, §Y$STRATEGICREGION_28$§!, §Y$STRATEGICREGION_17$§! ve §Y$STRATEGICREGION_216$§!'daki §Yher [FRA.GetAdjective] sömürgesinde§! veya Akdeniz adasında, [ROOT.GetFlag][ROOT.GetNameDef] tarafından zaten talep edilmemiş olanlarda hak iddia eder. \nMevcut etkiler:"
 ITA_war_with_france_desc:0 "$ITA_go_after_france_desc$"
 ITA_war_with_greece:0 "Yunanistan ile Savaş"
 ITA_war_with_greece_desc:0 "Eğer Yunanistan'ı dahil etmezsek nasıl güçlü bir İmparatorluk oluyoruz? Kolay bir hedef olmalı..."
 ITA_war_with_the_uk:0 "İngiltere ile Savaş"
 ITA_war_with_the_uk_claims_tt:0 "§Y$STRATEGICREGION_182$§!, §Y$STRATEGICREGION_126$§!, §Y$STRATEGICREGION_128$§!, §Y$STRATEGICREGION_28$§!, §Y$STRATEGICREGION_17$§! ve §Y$STRATEGICREGION_216$§!'daki §Yher [ENG.GetAdjective] sömürgesinde§! veya Akdeniz adasında, [ROOT.GetFlag][ROOT.GetNameDef] tarafından zaten talep edilmemiş olanlarda hak iddia eder. \nMevcut etkiler:"
 ITA_war_with_the_uk_desc:0 "$ITA_anti_uk_war_goals_desc$"
 SWI_a_swiss_navy:0 "Bir İsviçre Donanması"
 SWI_a_swiss_navy_desc:0 "[ROOT.GetAdjective] tarihinde ilk kez, kendimizi bir kıyı şeridiyle buluyoruz. Bu, onu denizlerde savaşmak için kullanabileceğimiz anlamına gelir, ama aynı zamanda şimdi savunulacak yeni bir cephemiz olduğu anlamına da gelir, [ROOT.GetName] için bir donanma inşa etme çabalarımızı hızlandırmalıyız."
 SWI_abandon_neutrality:0 "Tarafsızlığı Terk Et"
 SWI_abandon_neutrality_desc:0 "Avrupa'nın her yerinde taraflar seçiliyor, hazırlıksız yakalanamayız. Tek bariz çözüm, tarihi tarafsız duruşumuzu terk etmek ve [SWI_get_fascist_neighbor]'ın korumasını aramak ya da bir kaya ile sert bir yer arasında sıkışıp kalma riskini almak."
 SWI_adopt_romansh:0 "Romanş Dilini Benimse"
 SWI_adopt_romansh_desc:0 "[ROOT.GetName], açgözlü komşularımız tarafından talep edilmesi amaçlanan [GER.GetAdjective], [FRA.GetAdjective] ve [ITA.GetAdjective] bölgelerinden oluşan bir ülke değildir. [ROOT.GetName], tek, bölünmez çok kültürlü bir ulustur. Sadece [ROOT.GetAdjective] Alplerimizin dağlarında konuşulan bir dil olan Romanş'ı benimsemek, onlara kültürümüzün ve değerlerimizin, dilden bağımsız olarak kendilerininkinden farklı olduğunu gösterecektir."
 SWI_air_production:0 "Hava Üretimi"
 SWI_air_production_desc:0 "Uçmak için uçak tasarımlarına sahip olmak bulmacanın sadece ilk parçasıdır, bir sonraki ise karada ve gökyüzünde düşmanlarımızla savaşmak için pilotlarımızı her zaman havada tutabileceğimiz kadar üretmektir."
 SWI_air_research:0 "Hava Araştırması"
 SWI_air_research_desc:0 "Eğer düşmanın ilerlemelerine ayak uydurmak ve sonunda göklere hükmetmek istiyorsak, yeni hava teknolojilerinin araştırma ve geliştirmesini hızlandırmaya hazırız."
 SWI_airspace_surveillance:0 "Hava Sahası Gözetimi"
 SWI_airspace_surveillance_desc:0 "Eğer [ROOT.GetName]'ı ve dağlarını savunmayı umuyorsak, düşmanı aramak için gözlerimizi gökyüzünde tutmalıyız. Yeni araçlar, düşmanı bulmamızı ve onları avcılarımızın ve uçaksavar silahlarımızın nişangahına koymamızı sağlayacaktır."
 SWI_aktion_nationaler_widerstand:0 "Aktion Nationaler Widerstand"
 SWI_aktion_nationaler_widerstand_desc:0 "[ROOT.GetAdjective] toplumunun her kesiminde, nüfusu etkilemek için gizlice işbirliği yapmaya istekli küçük bir sivil grup var. Amaçları, yenilgicilikle savaşmak, birliği ilham etmek ve istila durumunda [ROOT.GetName]'da direniş için zemin hazırlamaktır."
 SWI_all_adults_training:0 "Tüm Yetişkinlerin Eğitimi"
 SWI_all_adults_training_desc:0 "Dünyanın mevcut durumuyla şansa yer yok. Her yetenekli yetişkin, herhangi bir istilacı güce karşı silahlanmaya hazır olmalıdır, İsviçre hepimize aittir, bu yüzden hepimiz tarafından savunulmalıdır."
 SWI_allied_gold:0 "Müttefik Altını"
 SWI_allied_gold_desc:0 "Mevcut meseleleri saran girdap ve yaptırımlar, altın ticaretini daha sınırlı ve zor hale getirdi, ancak tarafsız duruşumuzla diğer demokratik uluslarla altın ticaretini artırma olasılığını açabilir, faşizmi kontrol altında tutmak için demokratik ekonomileri destekleyebiliriz."
 SWI_alpine_aspirations:0 "Alp Hırsları"
 SWI_alpine_aspirations_desc:0 "[ROOT.GetNonIdeologyName]'ın merkezi hükûmeti genişledi ve Helvetia Cumhuriyeti'ne olgunlaştı, şimdi daha büyük bir alanı yönetmek için kaynaklara sahibiz. Alpleri tek bir bayrak altında birleştirmeye daha yakın olmak için [FRA.GetNameDef]'den kontrol bölgemizi genişletmesini talep etmeliyiz."
 SWI_alpine_redoubt:0 "Alp Sığınağı"
 SWI_alpine_redoubt_desc:0 "Geri çekilebileceğimiz müstahkem bir zeminimiz olduğu sürece, istilacılara karşı durdurulamaz bir güç olabiliriz. Alpleri daha da aşılmaz hale getirmeli ve etkimizi oradan dışarıya doğru büyütmeliyiz, ancak o zaman kendimizle düşman arasına, nerede olursa olsun, bir mesafe koyabiliriz."
 SWI_alpine_specialization:0 "Alp Uzmanlığı"
 SWI_alpine_specialization_desc:0 "Diğer tüm uluslardan daha fazla, dağ geleneklerimizi benimseyebilir ve dağlar üzerinde başka hiçbirinin yapamayacağı şekilde savunma ve saldırı yapabilen durdurulamaz bir güç eğitebiliriz. Onlar düşmanı silip süpürecek çığ olacaklar."
 SWI_american_industrial_investments:0 "Amerikan Sanayi Yatırımları"
 SWI_american_industrial_investments_desc:0 "Büyük Savaş, [USA.GetAdjective] endüstriyel gücünün herhangi bir gidişatı lehlerine çevirebileceğini açıkça ortaya koydu. Eğer onlara yaklaşıp onlardan sanayi yatırımları sağlamayı başarırsak, kendi konumumuzu güçlendirebilir ve bağımsızlığımızı savunmanın onların çıkarına olduğundan emin olabiliriz."
 SWI_american_planes_desc_other:0 "Birkaç uçak için demokratik değerlerimizden taviz veremeyeceğimiz için, teçhizatı başka bir demokrasiden tedarik etmemiz önemlidir ve [?SWI.SWI_best_dem_ally.GetNameDef] en iyi seçim gibi görünüyor."
 SWI_american_planes_desc_usa:0 "Eğer başka bir ulustan uçak alacaksak, [USA.GetNameDef], Demokrasi geleneği, göreceli tarafsızlığı ve olağanüstü havacılık mühendisliği ile ideal bir adaydır."
 SWI_anti_tank_divisions:0 "Anti-tank Tümenleri"
 SWI_anti_tank_divisions_desc:0 "Tank, modern savaşın mızrak ucudur, arazimiz zaten bize onlara karşı bir avantaj sağlıyor, ancak kuvvetlerimizi anti-tank teçhizatıyla donatırsak ucu kesebilir ve mızrağı köreltebiliriz."
 SWI_armed_neutrality:0 "Silahlı Tarafsızlık"
 SWI_armed_neutrality_desc:0 "Uzun süredir devam eden tarafsızlığımız [ROOT.GetAdjective] kimliğinin ayrılmaz bir parçasıdır. Ancak tarafsızlık tek başına egemenliğimizi garanti edemez. Sonuçta, Büyük Savaş'ta [BEL.GetNonIdeologyName]'a ne kadar yardımcı oldu? En iyi caydırıcı, herhangi bir işgalciye karşı silahlanmaya ve savaşmaya hazır bütün bir ulustur."
 SWI_arsenal_of_the_alps:0 "Alplerin Cephaneliği"
 SWI_arsenal_of_the_alps_desc:0 "Sarp zirveleri, onları ne kadar ağır bir şekilde güçlendirdiğimiz ve arazi bilgimiz, Alpleri askeri kapasitemizi önemli ölçüde artırmak ve geri çekilmemiz gerekirse onu korumak için mükemmel bir yer yapar."
 SWI_artillery:0 "İsviçre Topçusu"
 SWI_artillery_desc:0 "Kuvvetlerimiz ilerlerken düşmanlarımızın üzerine mermiler yağsın. Topçu, [ROOT.GetNonIdeologyName]'ın dağlardan savunma yapmasına ve muhalefeti bir kurşun yağmuru altında ezerek en etkili şekilde ileri atılmasına olanak tanıyacaktır."
 SWI_ask_for_vorarlberg:0 "[848.GetName]'ı İste"
 SWI_ask_for_vorarlberg_desc:0 "Bir süredir [?SWI_fascist_overlord.GetName]'ın kanatları altında olduğumuza ve sadakatimizi kanıtladığımıza göre, artık bize haklı olarak ait olanla güvenmelerinin zamanı geldi. [848.GetName], [ROOT.GetNonIdeologyName] demokratik bir konfederasyonken bize katılmak için oy verdi, bu yüzden mevcut formumuza katılmak isteyeceklerinden şüphe yok."
 SWI_attack_from_the_mountains:0 "Dağlardan Saldırı"
 SWI_attack_from_the_mountains_desc:0 "Alpler ve Jura'daki müstahkem mevzilerimize yerleştikten sonra, vadideki düşman birliklerine büyük zarar verebiliriz. Topraklarımızda geçirdikleri her dakikanın daha büyük bir personel ve malzeme kaybı anlamına geldiğini bilmelerini sağlamalıyız."
 SWI_axis_gold:0 "Mihver Altını"
 SWI_axis_gold_desc:0 "Tarafsız bir ülke olmak, pazarlarımızın her ülkeye açık kaldığı anlamına gelir, ki bu da kullanabileceğimiz bir avantajdır. Altın pazarımızı [SWI_biggest_fascist.GetNameDef]'e açarak, onları yatıştırmak ve her iki ekonomimizi de iyileştirmek için ekonomilerimizi birbirine bağlayabiliriz."
 SWI_ban_democratic_party:0 "Demokratik Partileri Yasakla"
 SWI_ban_democratic_party_desc:0 "Demokratik partilerimiz [SWI_get_fascist_neighbor]'a yönelik yaklaşımımızı riske atıyor, eğer onların tarafına daha fazla geçmek istiyorsak, bu, birkaç yıl önce düşünülemez olanı yapmamız ve demokratik siyasi partilerimizden kurtulmamız gerektiği anlamına gelir. Eğer yapmamız gereken fedakarlık buysa, öyle olsun."
 SWI_ban_foreign_nazi_propaganda:0 "Yabancı Nazi Propagandasını Yasakla"
 SWI_ban_foreign_nazi_propaganda_desc:0 "Yabancı propaganda için bu aracın ayakta kalmasına izin veremeyiz. Nazizm, [ROOT.GetAdjective] Federasyonunu tanımlayan her bir değere aykırıdır. Bu nedenle, bizim gibi Demokrasi ve Hoşgörü üzerine kurulu bir ülkede tolerans gösterilemez, yoksa bizi içeriden yok etmek için kullanılma riskini alırız."
 SWI_ban_national_movement_for_switzerland:0 "İsviçre için Ulusal Hareketi Yasakla"
 SWI_ban_national_movement_for_switzerland_desc:0 "Faşistler, tıpkı hamamböcekleri gibi, toplumun kuytu köşelerinde saklanma, onlara karşı çıkmak için çok geç olana kadar ihmalimizden beslenerek güç kazanma eğilimindedir. Artık yeter! Yeni görünümleri ve adları bizi kandıramayacak, Demokrasimizi koruyacaksak kararlı bir şekilde saldırmalıyız."
 SWI_ban_the_communist_party:0 "İsviçre Komünist Partisini Yasakla"
 SWI_ban_the_communist_party_desc:0 "Komünist partiler [SWI.GetNameDef] için büyük bir tehlike oluşturuyor. Aramızdaki mesafeye rağmen, [SOU.GetNameDef]'in devrimci etkisi havada hissedilebiliyor. Bu kadar tehlikeli zamanlarda ülkemizi istikrarsızlaştırma riskini alamayız, bu yüzden hızla hareket etmeli ve hükûmetimizi devirmeye ve baltalamaya çalışan herhangi bir partiyi yasaklamalıyız."
 SWI_become_german_puppet:0 "[SWI_get_fascist_neighbor_adjective] Kuklası Ol"
 SWI_become_german_puppet_desc:0 "Henne kariyerini bu ana adadı. [ROOT.GetNonIdeologyName]'ın kendi Anschluss'u, bir nevi. Uzun süredir devam eden egemenliğimizi kaybediyor olsak da, onların artıklarından biraz alabiliriz. Sadece bunun bizim yıkımımız anlamına gelmediğini umabiliriz."
 SWI_bring_democracy_to_germany:0 "Almanya'ya Demokrasi Getir"
 SWI_bring_democracy_to_germany_desc:0 "Üçüncü Reich, demokrasiden alabileceğiniz kadar uzaktır, ondan önceki Weimar Cumhuriyeti sadece Büyük Savaş'ın galip güçlerinin rehinesiydi ve eski [GER.GetNonIdeologyName]'ın savaş çığırtkanı rejimi sadece Kayzerlerin açgözlü hırsları için bir araçtı. Kuzeydeki komşularımızın Demokrasinin ne anlama geldiğini öğrenme zamanı geldi."
 SWI_buero_ha:0 "Buero Ha"
 SWI_buero_ha_desc:0 "Komşularımızın onlar hakkında istihbarat toplamaya çalıştığımızı bilmelerine izin veremeyiz, bu yüzden gizli operasyonlarımızı üstlenmek için yarı bağımsız istihbarat teşkilatlarına güvenmeliyiz. İşte burada fotoğrafçılık iş adamı turned spymaster Hans Hausamann devreye giriyor, küçük ve çevik istihbarat ofisiyle, ellerimizi kirletmeden yapılması gereken işi yapabilir."
 SWI_build_naval_bases:0 "Deniz Üsleri İnşa Et"
 SWI_build_naval_bases_desc:0 "Fethettiğimiz üsler yeterli değil ve gereksinimlerimize yetişmek için yeterince hızlı yenilerini inşa edemiyoruz. Denizcilik hedeflerimize ulaşmak için yeni bir çaba gösterilmelidir."
 SWI_build_naval_bases_tt:0 "Mevcut her §YDeniz üssüne§! §Y2 Deniz üssü§! ekler. (Maks. 15)"
 SWI_build_up_military_readiness:0 "Askeri Hazırlığı Artır"
 SWI_build_up_military_readiness_desc:0 "İsviçre nüfusunu hazırlama görevi hiç bitmez. İstila tehdidi ortadan kalkana kadar dinlenemeyiz ve belki de asla kalkmaz. Ulusumuzu gecikmeden savunma hazırlıklarına yönlendirmeliyiz."
 SWI_buy_foreign_surplus_ships:0 "Yabancı Fazlası Gemiler Satın Al"
 SWI_buy_foreign_surplus_ships_desc:0 "Bir ülkenin fazlası, diğerinin donanmasıdır. Dünyanın büyük deniz güçlerinin birçoğu şimdi yepyeni gemilerle dolu filolara sahip, bu da eski gemilerin neredeyse modası geçmiş olduğu ve yine de bakımlarının maliyetli olduğu anlamına gelir. Eğer hızlı bir şekilde deniz gücü oluşturmak istiyorsak, onlardan istenmeyen gemileri satın almaktan daha iyi bir yol yoktur."
 SWI_case_north:0 "Durum Kuzey"
 SWI_case_north_desc:0 "[?SWI.SWI_biggest_fascist.GetNameDef]'e karşı savaşı göz ardı edemeyiz, buna hazır olmalıyız. Planlar hazırlanmalı, malzemeler tahsis edilmeli, siperler kazılmalı ve askerler silahlandırılmalıdır."
 SWI_case_west:0 "Durum Batı"
 SWI_case_west_desc:0 "Her türlü olası senaryoya hazırlıklı olmalıyız. [FRA.GetName], [GER.GetNameDef] kadar bir tehdittir ve buna göre muamele görmelidir. Ordumuzu ve ülkemizi [FRA.GetAdjective] ile savaşa hazırlamalıyız, yoksa [ROOT.GetNonIdeologyName]'ın ölümünü riske atarız."
 SWI_centralize_switzerland:0 "İsviçre'yi Merkezileştir"
 SWI_centralize_switzerland_desc:0 "Yöneldiğimiz [ROOT.GetNonIdeologyName], neredeyse bir asırdır sahip olduğumuz eski İsviçre Konfederasyonundan çok farklı. Artık bir konfederasyon olmayacağız, gücü tepeden kaynaklanan ve kitlelere sızan merkezi bir ülke olacağız."
 SWI_citizen_supply_mandate:0 "Vatandaş İkmal Yetkisi"
 SWI_citizen_supply_mandate_desc:0 "Bir istilanın nasıl sonuçlanacağını bilmiyoruz ve merkezi bir ikmal ağına güvenebilsek bile, bu bizim komuta yapımızla uyumlu değil. Bu yüzden her [ROOT.GetAdjective] hanesi, hem kendileri hem de yerel milisleri için en az 2 aylık malzeme depolamalıdır."
 SWI_closer_democratic_ties:0 "Daha Yakın Demokratik Bağlar"
 SWI_closer_democratic_ties_desc:0 "Otokrasi Avrupa üzerine gölgesini düşürürken, kendimizi savunamayabiliriz, ancak diğer demokratik uluslarla işbirliği yaparak ilerlemesini durdurabiliriz. İlk adım, onlarla daha yakın bağlar aramak ve onlara davaya katkıda bulunabileceğimizi kanıtlamak olacaktır."
 SWI_closer_ties_with_germany:0 "[SWI_get_fascist_neighbor_cap] ile Daha Yakın Bağlar"
 SWI_closer_ties_with_germany_desc:0 "Kuzeyde güçlü ve tehlikeli bir komşumuz var. Eğer hayatta kalmak istiyorsak, onlarla iyi geçinmek iyi bir fikir olabilir, bu yüzden tarafsız duruşumuzu korurken daha iyi ilişkiler arayışıyla onlara yaklaşmak hayati önem taşıyacaktır."
 SWI_complete_siegfried_line:0 "Siegfried Hattını Tamamla"
 SWI_complete_siegfried_line_desc:0 "[GER.GetNameDefCap], [FRA.GetName]'a karşı savunmak için etkileyici bir engel inşa etti ve bizim de onlara karşı savunmaya ihtiyacımız olduğuna inanmak için nedenimiz var, özellikle [GER.GetNonIdeologyName] ile daha yakından hizalandıkça, bu yüzden koordine olmalı ve tamamlayıcı savunmalar inşa etmeliyiz."
 SWI_connect_to_the_maginot_line:0 "Maginot Hattına Bağlan"
 SWI_connect_to_the_maginot_line_desc:0 "Savaş rüzgarları [FRA.GetName] yönünde esiyor ve düşmanlarının sözde Masginot Hattı'na saldırmak zorunda kalma ihtimali yüksek, bu da bizi [?SWI.SWI_biggest_fascist.GetNonIdeologyName]'ın bizi istila ederek onu atlatmaya meyilli olabileceği tehlikeli bir duruma sokuyor. Bu yüzden [FRA.GetName] ile koordine olmalı ve birleşik bir cephe oluşturmalıyız."
 SWI_crack_down_on_dissent:0 "Muhalefete Baskı Uygula"
 SWI_crack_down_on_dissent_desc:0 "[ROOT.GetNonIdeologyName], toplumumuzdaki tek bir çatlağın [ROOT.GetAdjective] hükûmetinin çökmesine yol açabileceği zamanlarda bölünemez."
 SWI_create_anti_tank_template_TT:0 "§Yİsviçre Milisleri anti-Tank§! için bir şablon oluşturulacak"
 SWI_defend_against_paratroopers:0 "Paraşütçülere Karşı Savunma"
 SWI_defend_against_paratroopers_desc:0 "Paraşütçülerin herhangi bir tahkimatı nasıl atlayabildiğini ve herhangi bir hazırlığı boşa çıkarabildiğini gördük. Savunmalarımızda hasara yol açmadan önce onlarla başa çıkmaya hazır olmamız hayati önem taşıyor."
 SWI_defend_the_skies:0 "Gökleri Savun"
 SWI_defend_the_skies_desc:0 "Modern savaş, büyük ölçüde hava üstünlüğüne ve desteğine dayanır. [ROOT.GetName] bu yeni gerçeğe hazır değil, bu yüzden her kantonu gökyüzünü düşman uçaklarına karşı savunmaya hazırlamalıyız."
 SWI_demand_french_alps:0 "Fransız Alplerini Talep Et"
 SWI_demand_french_alps_desc:0 "[FRA.GetNameDef]'in iç ve dış baskılar altında çökmesi an meselesidir. Alplerin savunmasında proaktif bir duruş sergilemeliyiz, aksi takdirde tehlikeli bir düşman, toprağımıza bir istila için hazırlık alanı olarak hizmet edebilecek savunulabilir pozisyonların kontrolünü ele alabilir."
 SWI_demand_italian_alps:0 "İtalyan Alplerini Talep Et"
 SWI_demand_italian_alps_desc:0 "Onlarca yıldır, [ITA.GetName] utanmazca [ITA.GetAdjective] konuşan kantonlarımızı talep etti. Eğer onlar bunu yapabiliyorsa, biz de kesinlikle onların Alplerinin demokratik rejimimize katılmasını talep edebiliriz, sonuçta, onlar Ticino'nun [ITA.GetNameDef]'e ait olduğu kadar [ROOT.GetNameDef]'e aittir."
 SWI_dissolve_the_federal_council:0 "Federal Konseyi Feshet"
 SWI_emergency_industry:0 "Acil Durum Sanayisi"
 SWI_emergency_industry_desc:0 "Düşman eyaletlerimizi istila ettiğinde kendi sanayi kapasitemizi yok etmeye mahkum olduğumuza göre, geriye kalanlarla yeniden inşa etmek ve istilacıları püskürtmek için kullanabileceğimiz bir geri dönüş planımız olduğundan emin olmalıyız. Gizli tüneller ve fabrikalar dağlarımızın ve vadilerimizin kalplerini dolduracak, bazıları sınırlarımızın dışında bile olabilir."
 SWI_empower_the_council:0 "Konseyi Güçlendir"
 SWI_empower_the_council_desc:0 "Tehlike her yanımızda pusuda bekliyor ve bize saldırdığında, birbirimizle çekişmeye başlarsak güçsüz kalırız, düşmanlarımız [ROOT.GetName]'ı haritadan siler. Bu kararsız zamanlarda gidilecek tek yol kesinlikle güçlü bir merkezi hükûmettir."
 SWI_enhanced_training:0 "Geliştirilmiş Eğitim"
 SWI_enhanced_training_desc:0 "[ROOT.GetName]'ın son çatışma riskiyle karşılaştığı zamandan bu yana savaş çok değişti. Her yetenekli vatandaşın aldığı temel eğitimi güncellememiz ve iyileştirmemiz gerekiyor. Onlar ülkemizin savunmasındaki en iyi varlığımızdır."
 SWI_exiled_government:0 "Sürgün Hükûmeti"
 SWI_exiled_government_desc:0 "Tüm çabalarımıza rağmen, görünüşe göre anavatanımızı savunmada başarısız olduk, bu yüzden onu uzaktan geri almak için savaşmaktan başka seçeneğimiz kalmadı. [ROOT.GetAdjective] demokratik değerleri, ülkemizin bu kadar uzun süre gelişmesine olanak tanıyan şeydi ve onu geri almak için yol gösterici ışıklarımız olacak, sonuçta, [ROOT.GetName] toprağı veya sakinlerinin konuştuğu dil ile değil, karşılıklı saygı ve desteğimizle tanımlanır."
 SWI_expand_federal_police_intelligence:0 "Federal Polis İstihbaratını Genişlet"
 SWI_expand_federal_police_intelligence_desc:0 "Düşman gölgede gizlenir ve kendi nüfusumuzun şekli de dahil olmak üzere her şekli alabilir. Bu yüzden Federal Polis İstihbarat Dairesi, nerede olursa olsun muhalefeti ezmek için araçlara sahip olmalıdır."
 SWI_expand_special_forces:0 "Özel Kuvvetleri Genişlet"
 SWI_expand_special_forces_desc:0 "Daimi ordumuz iyi hazırlanmış, diğer uluslara kıyasla son derece küçük ve [ROOT.GetName]'ın savunmasını lehimize çevirmek için yeterli olmayabilirler. [ROOT.GetAdjective]'i zafere götürmek için onlardan daha fazlasına ihtiyacımız olacak!"
 SWI_expand_spy_networks:0 "Casus Ağlarını Genişlet"
 SWI_expand_spy_networks_desc:0 "Düşman dışarıda, tehlike gelmeden önce sınırlarımızı ve iç cepheyi savunmak için ulaşmalıyız. Casusluk ağlarımız, dışarıdan hala tarafsız ve zararsız görünen bir savunmanın temeli olabilir."
 SWI_expand_the_confederation:0 "Konfederasyonu Genişlet"
 SWI_expand_the_confederation_desc:0 "Hiçbir ulus totalitarizmin hızlı ilerlemesinden güvende değildir, etrafımızdaki ulusların birçok bölgesi, tarafsızlık geleneğimizin sunduğu korumadan ve eğer savaş çıkarsa, hayranlık uyandıran savunma yeteneklerimizden faydalanabilir."
 SWI_expand_weapons_industry:0 "Silah Sanayisini Genişlet"
 SWI_expand_weapons_industry_desc:0 "Kısıtlı askeri sanayi kapasitemiz topyekûn bir savaşta yeterli olmayacaktır. Modern çatışma, mermisi en son biten tarafından kazanılır, bu yüzden savaş için daha hızlı ve daha uzun süre teçhizat yapabildiğimizden emin olmalıyız."
 SWI_expanded_military_support:0 "Genişletilmiş Askerî Destek"
 SWI_expanded_military_support_desc:0 "Milis gücümüz sadece askerlerden oluşmuyor, iyi yağlanmış bir makine gibi işlev görmeleri için birçok başka role ihtiyaç var. [ROOT.GetName]'ı savunmada başarılı olmak istiyorsak, milislerimiz için destek bölükleri toplamalı, eğitmeli ve tedarik etmeliyiz."
 SWI_expedite_mobilization:0 "Seferberliği Hızlandır"
 SWI_expedite_mobilization_desc:0 "Küçük daimi ordumuzun rolü, [ROOT.GetName] halkı silahlanıp savunma kuvvetlerimizin büyük kısmını oluşturan Vatandaş Milislerini oluştururken düşmanı tutmaktır. Bu yüzden, daimi ordumuzun istila edilme riskini azaltmak için mümkün olan en kısa sürede hazır olmalarını sağlamalıyız."
 SWI_export_saboteurs:0 "Sabotajcıları İhraç Et"
 SWI_export_saboteurs_desc:0 "Eğer düşmanlarımızı içeriden yok edebilirsek savaşa katılmamıza gerek yok. İstihbarat teşkilatımız, operasyonlarımızı zalimler tarafından işgal edilen topraklarda direnişi kışkırtma ve güçlendirme konusunda uzmanlaşmak için geliştirebilir, yavaş yavaş güçlerini aşındırarak."
 SWI_extended_supply_lines:0 "Uzatılmış İkmal Hatları"
 SWI_extended_supply_lines_desc:0 "Hızlı taarruzlar ve uzun operasyonlar dünyasında, ikmal lojistiği her zamankinden daha hayati önem taşıyor ve çabalarımızda kantonlarımızdan uzaklaştıkça, yeni ve daha iyi ikmal hatlarına olan ihtiyaç ortaya çıkıyor. İkmal hatlarımızı daha da uzatabilmek ve yenilerini daha hızlı inşa edebilmek için lojistiğimizi nasıl geliştireceğimizi öğrenmeliyiz."
 SWI_federal_police:0 "Federal Polis İstihbarat Departmanı"
 SWI_federal_police_desc:0 "[ROOT.GetName]'ı dış düşmanlardan koruyup sonra iç düşmanlarına yenik düşmesine izin vermek aptallık olurdu. Sınırlarımız içindeki olası tehditleri kökünden kazımak ve toprağımızdaki yabancı unsurlara karşı savunmak için Federal Polisi güçlendirmeliyiz."
 SWI_fight_until_death:0 "Ölüme Kadar Savaş"
 SWI_fight_until_death_desc:0 "Şans bizden yana değil, [ROOT.GetNAme] sayıca az, silahça zayıf ve gelecek olana hazırlıksız. Bu yüzden her [ROOT.GetAdjective] vatandaşı, Kantonları ve Konfederasyonları için canını vermeye hazır olmalıdır."
 SWI_fighting_for_the_hills:0 "Tepeler için Savaşmak"
 SWI_fighting_for_the_hills_desc:0 "Günün sonunda, piyade silahlı kuvvetlerimizin en çok yönlü unsurudur. Ve [ROOT.GetNonIdeologyName] piyadesiyle her zaman gurur duymuş olsa da, neredeyse bir asırdır savaşmadık, bu yüzden piyade teknolojimizi ve doktrinlerimizi yeniden gözden geçirmek son derece önemlidir."
 SWI_floating_fortresses:0 "Yüzen Kaleler"
 SWI_floating_fortresses_desc:0 "Dağlarımızı ve vadilerimizi savunmak için kaleler yapmayı biliyoruz, şimdi bir kıyımız olduğuna göre, bunu denizlere genişletmemiz son derece önemlidir. Gemilerimiz yok edilemez olacaktır."
 SWI_flood_the_valleys:0 "Vadileri Sular Altında Bırak"
 SWI_flood_the_valleys_desc:0 "Konstanz Gölü çevresindeki bölgeden büyük bir istila gücünün gelmesini bekliyoruz, burası tarım arazilerini sular altında bırakmak ve davetsiz misafirleri batağa saplamak için kanallar ve setler kurmak için mükemmel bir yer. Bu hain bataklığı geçmeye çalışırken, onlara sahip olduğumuz her şeyle bombardıman etme fırsatını kullanabiliriz. Bizi istila etmeye çalıştıklarına pişman olacaklar."
 SWI_fly_over_the_mountains:0 "Dağların Üzerinden Uç"
 SWI_fly_over_the_mountains_desc:0 "Dağlarımız her zaman gökyüzüne kadar yükseldi, ama bugünün dünyasında onları nasıl aşacağımızı öğrenmeliyiz. Savaşı gökyüzünde düşmana taşımak, şimdi değilse de sonra bir öncelik olmalıdır."
 SWI_fortify_austrian_border:0 "Avusturya Sınırını Güçlendir"
 SWI_fortify_austrian_border_desc:0 "Artık Avusturya potansiyel bir düşmanın elinde olduğuna göre, savaş durumunda düşmanın yararlanabileceği açık bir kanat riskini göze alamayız. [GER.GetNonIdeologyName] ile olan sınırda olduğu gibi, bu cepheyi de güçlendirmeliyiz."
 SWI_fortify_border_with_france:0 "Fransa ile Sınırı Güçlendir"
 SWI_fortify_border_with_france_desc:0 "Demokratik değerlere olan bağlılıklarına ve uzun süredir devam eden dostane ilişkilere rağmen, [FRA.GetName]'ın [GER.GetNonIdeologyName] veya [ITA.GetNonIdeologyName]'a gizli bir saldırı başlatmak için [ROOT.GetAdjective] topraklarına tecavüz etme olasılığını göz ardı edemeyiz."
 SWI_fortify_border_with_germany:0 "Almanya ile Sınırı Güçlendir"
 SWI_fortify_border_with_germany_desc:0 "[GER.GetNameDefCap], [ROOT.GetAdjective] konfederasyonunun hayatta kalması için varoluşsal bir tehdit oluşturuyor. Eğer [GER.GetName] ile [FRA.GetName] arasında savaş çıkarsa, [GER.GetAdjective]'ler [FRA.Getname] ile olan ağır tahkimatlı sınır yerine veya [HOL.GetName] ve [BEL.Getname] üzerinden [ROOT.GetName]'dan geçebilirler. [GER.GetNameDef]'i caydırmak için ülkelerimiz arasında tahkimatlar inşa edebiliriz."
 SWI_fortify_border_with_italy:0 "İtalya ile Sınırı Güçlendir"
 SWI_fortify_border_with_italy_desc:0 "[ITA.GetAdjective] yayılmacı emelleri her an [ROOT.GetName]'a sıçrayabilir. Sonuçta, nüfusumuzun önemli bir kısmı İtalyanca konuşuyor ve [ITA.GetLeader]'dan bir konuşma yapmasıyla [ROOT.GetName] hedeflerine girecektir. Onlara kolay bir hedef olmadığımızı göstermeliyiz."
 SWI_fortify_sargans_gotthard_and_st_maurice:0 "Sargans, Gotthard ve St Maurice'i Güçlendir"
 SWI_fortify_sargans_gotthard_and_st_maurice_desc:0 "Alplerimiz [ROOT.GetName]'ın gururudur ve bu belirsiz zamanlarda Konfederasyonumuzun güvenliğini garanti etmeye yardımcı olmak için onları güçlendirebiliriz."
 SWI_fortify_the_jura:0 "Jura'yı Güçlendir"
 SWI_fortify_the_jura_desc:0 "Alpleri güçlendirmek için birçok hazırlık yapıldı, ancak aynı zamanda Jura Dağları'nı da güçlendirebiliriz ki bu dağlar, o kadar sarp veya savunulabilir olmasa da, Plato düşmanın eline geçtiğinde saldırmak için ikinci bir cephe olarak avantajlı olabilir."
 SWI_fortify_ticino:0 "Fortezza Ticino"
 SWI_fortify_ticino_desc:0 "Üç tarihsel olarak savaşçı ulus arasında tarafsız bir ülke olarak, ölüm her taraftan gelebilir, gardımızı düşüremeyiz, [ITA.GetName] bize [GER.GetNameDef] veya [FRA.GetName] kadar saldırmaya olasıdır ve saldırdıklarında, bu [846.GetName] üzerinden olacaktır. Bu yüzden onu [SWI.GetNameDef] uğruna aşılmaz bir kale haline getirmeliyiz."
 SWI_freeze_german_assets:0 "Alman Varlıklarını Dondur"
 SWI_freeze_german_assets_desc:0 "Yıllardır [?SWI.SWI_biggest_fascist.GetNameDef], tarafsızlığımızı ve bankacılık sistemimizdeki boşlukları, haksız kazançlarını korumak ve ekonomilerini ayakta tutmak için kullandı. Ahlaki görev, kesinlikle yansımaları olacağından emin olsak bile, mutlak tarafsızlığın önüne geçmelidir."
 SWI_frontier_defense_plan:0 "Sınır Savunma Planı"
 SWI_frontier_defense_plan_desc:0 "Eğer onları sınırlarımıza sokarsak [ROOT.GetNameDef] ölmüş demektir. Bir karış toprak bile veremeyiz, sınırlarımız kutsaldır. Bu yüzden sınırlarımızı güçlendirmeli ve onları savunmaya hazır olmalıyız."
 SWI_fund_resistance_groups:0 "Direniş Gruplarını Finanse Et"
 SWI_fund_resistance_groups_desc:0 "Avrupa ulusları birbirleriyle savaştı ve yüzyıllardır her diğer kıtadaki insanları boyunduruk altına aldı. Kıt'amızın amansız savaşlarının kurbanlarına, zincirlerini kırmaları ve kendi geleceklerini belirlemeleri için araçlar vererek yardım etmek [ROOT.GetAdjective] halkının görevidir."
 SWI_generic_fascist_neighbor:0 "faşist komşumuz"
 SWI_generic_fascist_neighbor_cap:0 "Faşist komşumuz"
 SWI_german_industrial_investments:0 "[SWI_get_fascist_neighbor_adjective] Sanayi Yatırımları"
 SWI_german_industrial_investments_desc:0 "[?SWI.SWI_biggest_fascist.GetNonIdeologyName]'ın endüstriyel gücü inkâr edilemez. Eğer yaklaşan bir savaştan sağ çıkmak istiyorsak, rekabet etmek ve koz olarak kullanmak için kendi sanayi tabanımıza ihtiyacımız olacak. [?SWI.SWI_biggest_fascist.GetNameDefCap]'in bize yatırım yapması, aynı zamanda [ROOT.GetNonIdeologyName]'ı sağlam tutmak için bir nedenleri olacağı anlamına da gelir."
 SWI_german_military_collaboration:0 "[SWI_get_fascist_neighbor_adjective] Askerî İşbirliği"
 SWI_german_military_collaboration_desc:0 "Modern dünyada ordumuzun gelişmesi için gerekli savaş deneyiminden yoksunuz. İşte burada [?SWI.SWI_biggest_fascist.GetName] devreye giriyor, onların silahlı kuvvetleri hesaba katılması gereken bir güçtür ve onlarla işbirliği yapmak, kendimizi savunmamıza ve hatta belki de diğer uluslara önleyici olarak saldırmamıza olanak tanıyacaktır."
 SWI_gotthard_union:0 "Gotthardbund"
 SWI_gotthard_union_desc:0 "Çekişme ve hizipçilik zamanı bitti. [ROOT.GetNonIdeologyName]'ın, kapsamlı önlemler almak için kesin yetkiye sahip tek bir demokrasi altında birleşme zamanı geldi. Tümü, [ROOT.GetAdjective] geleneklerimizin ve değerlerimizin hayatta kalması adına. Direneceğiz ve galip geleceğiz!"
 SWI_gotthardbund_party_name:0 "Gotthardbund"
 SWI_gotthardbund_party_name_long:0 "Gotthardbund"
 SWI_guisans_coup:0 "Guisan'ın Darbesi"
 SWI_guisans_coup_desc:0 "[?SWI.SWI_confederation_president.GetName], büyük ve barışçıl ülkemizi savaşa ve sefalete sürükledi. Bu, bildiğimiz ve sevdiğimiz [ROOT.GetNonIdeologyName] değil, kendini koruma adına yozlaştırıldı. Bu savaşı kesin olarak sona erdirebilecek ve umarım bu bir zamanlar tarafsız olan ulusu köklerine geri döndürebilecek kadar popüler ve yetenekli tek bir adam var; Henri Guisan."
 SWI_has_fascist_neighbor_trigger_TT:0 "Uygun bir faşist Komşusu var"
 SWI_heer_und_haus:0 "Heer und Haus"
 SWI_heer_und_haus_desc:0 "İsviçre halkı ve dolayısıyla ordusu, anavatanlarının savunması için direnmek ve savaşmak üzere içeriden teşvik edilmelidir. Nelerin tehlikede olduğunu hatırlatmak için, Pro Helvetia, Aktion Nationaler Widerstand grubunun yardımıyla, onların [ROOT.GetAdjective] gibi düşünmeleri ve hareket etmeleri için anahtardır."
 SWI_increase_defense_budget:0 "Savunma Bütçesini Artır"
 SWI_increase_defense_budget_desc:0 "Büyük Savaş'ta tarafsızlığımızı ve egemenliğimizi korumayı başarsak da, defne yapraklarımız üzerinde dinlenemeyiz; bizi çevreleyen büyük güçlerden birinin, aralarında inşa edilen tahkimatları atlatmak için ülkemizi istila etme olasılığı gerçektir ve mevcut bütçemiz bunu önlemek için yeterli olmayacaktır."
 SWI_industrial_production:0 "Endüstriyel Üretim"
 SWI_industrial_production_desc:0 "İç cepheyi görmezden gelemeyiz. [ROOT.GetNonIdeologyName] kantonlarındaki her yetenekli kişi, savaş makinemiz için kendilerini feda etmeye istekli olmalıdır."
 SWI_infiltrate_federal_police:0 "Federal Polise Sız"
 SWI_infiltrate_federal_police_desc:0 "Yabancı propaganda ve demokratik olmayan güçleri kökünden kazıma yetkileriyle, Federal Polis, kendi ittifakımızın hedef alınmasını önlemek için sızmak için ideal bir yerdir. Sonunda bu, ulusal güvenlik kisvesi altında düşmanlarımızı ortadan kaldırmamıza da olanak tanıyacaktır."
 SWI_integrate_refugees_into_the_army:0 "Mültecileri Orduya Entegre Et"
 SWI_integrate_refugees_into_the_army_desc:0 "Faşizm ve Savaş okyanusunun ortasında bir barış ve demokrasi vahası olarak, birçoğu güvenli bir sığınak arayışıyla [ROOT.GetName]'a akın ediyor. Bazıları onları anavatanlarından kaçmaya zorlayanları yenme çabalarına katılmayı umuyor ve birçoğu bile profesyonel askerdir. Onların İsviçre ve daha iyi bir gelecek için savaşa katılmasına izin verebiliriz."
 SWI_join_france:0 "Fransa'ya Katıl"
 SWI_join_france_desc:0 "Her zaman dostane bir ilişki olmasa da, [ROOT.GetName] ve [FRA.GetName] aynı demokratik değerleri ve hatta bir dili paylaşıyor, bu yüzden yaklaşan çatışmada bir taraf seçmek zorunda kalsaydık, onların koruması şüphesiz alternatiften daha arzu edilir olurdu."
 SWI_join_the_allies:0 "İttifaka Katıl"
 SWI_join_the_allies_desc:0 "Tarafsızlığımızı sürdürmenin gerektirdiği maddi fedakarlıklar ve ahlaki tavizler dayanılmaz hale geliyor. Özellikle Avrupa'nın mevcut siyasi durumuyla birlikte artık tarafsızlığa yer yok. Başarısızlıklarına rağmen, müttefikler toprağımızı ve konfederasyonumuzu korumak istiyorsak en iyi seçeneğimizdir. Bu gerçekten eşi benzeri olmayan bir zaman."
 SWI_join_the_axis:0 "Mihver'e Katıl"
 SWI_join_the_axis_desc:0 "İşte bu. Bu, yaklaşan fırtınada [ROOT.GetNonIdeologyName]'ın hayatta kalması için yaptığımız kumar; [?SWI.SWI_biggest_fascist.GetName]'ın ittifakının sancağı altında fırtınaya katılacağız. Umarım doğru kararı vermişizdir."
 SWI_jump_into_action:0 "Harekete Geç"
 SWI_jump_into_action_desc:0 "Sadece 10 yıl önce bu imkansızın ötesindeydi, ancak [ROOT.GetNameDef] aktif ve açık bir şekilde savaş çabasına katılmak için tüm hazırlıkları yaptı. Altyapımızı, sanayimizi ve bilimsel kurumlarımızı daha önce hiç görmediğimiz türden topyekûn bir çatışma için hazırladık. [ROOT.GetAdjective] savaş motoru uğulduyor, harekete geçmeye hazır."
 SWI_lay_the_groundwork:0 "Zemini Hazırla"
 SWI_lay_the_groundwork_desc:0 "Topyekûn bir savaşa hazır olmak için önce iyi bir temele ihtiyacımız var. [ROOT.GetName]'ın altyapısı ve ulaşım ağları iyileştirilmeli ve modernize edilmelidir. Ancak o zaman vatandaşlarımız cepheye verimli bir şekilde seferber edilebilir."
 SWI_liberate_italy:0 "İtalya'yı Kurtar"
 SWI_liberate_italy_desc:0 "Yüzyıllar boyunca [ROOT.GetNonIdeologyName], güneyindeki küçük şehir devletlerinin ve küçük krallıkların birbirleriyle savaştığını ve sonunda zayıf bir monarşiye dahil olduğunu gördü. [ITA.GetNonIdeologyName]'ın otokrasi ve faşizm zincirlerinden ablası tarafından kurtarılması sadece doğrudur."
 SWI_license_axis_plane_designs:0 "Mihver Uçak Tasarımlarını Lisansla"
 SWI_license_axis_plane_designs_desc:0 "Göklerde yolumuzu üretmenin en hızlı yolu, faşist uluslardan uçak tasarımları tedarik etmektir. Sadece onlar, bir savaşı gerçekten neyin kazandığını önceliklendirmek için gerekli olan son muharebe deneyimine sahipti ve bu bizi onlara daha da yakınlaştıracak, muhtemelen onları istila etmekten caydıracaktır."
 SWI_limited_censorship_of_the_press:0 "Basına Sınırlı Sansür"
 SWI_limited_censorship_of_the_press_desc:0 "[ROOT.GetName]'ı görmek isteyen güçler, bizi işgal etmek için her şeyi bahane olarak kullanacaktır. Basın özgürlüğü, sağlıklı bir demokrasi için hayati olmasına rağmen, komşularımızın hırslarına cephane vermediğimizden emin olmak için şimdilik geri planda kalmalıdır."
 SWI_luftschutz:0 "Luftschutz"
 SWI_luftschutz_desc:0 "Savaş değişti, hava yeni savaş alanıdır ve onun Aşil topuğumuz olmasına izin veremeyiz. Yerel hava savunma kuvvetleri kurulmalı, siviller tarafından yönetilmeli ve havadan gelen tehditleri tespit edip başa çıkmak için araçlarla donatılmalıdır. Eğer dağların üzerinden geçebiliyorlarsa, dağı savunmanın bir anlamı yoktur!"
 SWI_martial_law:0 "Sıkıyönetim"
 SWI_martial_law_desc:0 "Bazı durumlar neşter gerektirir, ancak şimdiki zamanlarımız bunlardan değil, [ROOT.GetNameDef]'in düşmanlarımızı ve nüfusumuzu kontrol altında tutabileceğine güvendiği bir çekice ihtiyacı var."
 SWI_mechanized_support:0 "Mekanize Destek"
 SWI_mechanized_support_desc:0 "Askerlerimizin savaş alanına her zamankinden daha hızlı ulaşması gerekiyor ve bu yüzden ihtiyaç duydukları destek de öyle, aksi takdirde tüm bu hız boşa gider."
 SWI_military_exercises_with_germany:0 "[SWI_get_fascist_neighbor] ile Askerî Tatbikatlar"
 SWI_military_exercises_with_germany_desc:0 "Geleneksel demokratik değerlerimize karşı düşmanca tutumlarına rağmen, [SWI_get_fascist_neighbor] kendimizi savunma zamanı geldiğinde değerli bir müttefik olabilir ve daha da iyisi, onlardan gelecek bir istila olasılığını azaltır."
 SWI_military_police:0 "Askerî Polis"
 SWI_military_police_desc:0 "Uzun süredir devam eden federal kurumlarımız, bu belirsiz zamanlarda ihtiyaç duyduğumuz düzeni sürdürmek için yeterli olmayacaktır. Birliğimizi korumak istiyorsak askeri polise ihtiyaç duyulacaktır."
 SWI_militias_turned_into_regulars:0 "Vatandaş Milisleri profesyonelleştirildi"
 SWI_modernize_airforce:0 "Hava Kuvvetlerini Modernize Et"
 SWI_modernize_airforce_desc:0 "Artık modern savaşın sadece savaş alanında olanlarla değil, aynı zamanda onun üzerinde, savunmayı ve hükmetmeyi umduğumuz açık gökyüzünde de tanımlandığı açıktır."
 SWI_mountaneer_paratroopers:0 "Dağcı Paraşütçüler"
 SWI_mountaneer_paratroopers_desc:0 "[ROOT.GetNonIdeologyName], heybetli zirveleriyle dünya çapında tanınır ve nüfusumuzun birçoğu dağları evi olarak adlandırır. Bu avantajı, üstün bir paraşütçü stoku, yabancı göklerden inip [ROOT.GetNameDef]'in şanı için yabancı dağları talep edebilecek bir güç eğitmek için kullanabiliriz."
 SWI_multipurpose_tanks:0 "Çok Amaçlı Tanklar"
 SWI_multipurpose_tanks_desc:0 "Piyadelerimize verdiğimiz çok yönlü çok amaçlı bıçaklar gibi, savaş çabalarımız için gereken her türlü boşluğu doldurabilecek ve her türlü görevi tamamlayabilecek makinelere ihtiyacımız var. Tank savaşı açısından yetişmemiz gereken çok şey var, bu yüzden kapsamlı bir güce sahip olmak için çok çeşitli gelişmelere sahip olmalıyız."
 SWI_national_defense_fund:0 "Ulusal Savunma Fonu"
 SWI_national_defense_fund_desc:0 "Bir ülkenin savunması ter ve emekten daha fazlasını gerektirir, en kötüsüne hazırlanmak için teçhizat ithal etmek ve gerekli hammaddeler için de fonlara ihtiyacımız var. [ROOT.GetAdjective] vatandaşlarının gönüllü olarak katkıda bulunabileceği bir fon kurmak ve tanıtmak, herhangi bir askeri bütçe artışını dengelememize olanak tanıyacak ve [ROOT.GetAdjective] katılımcı tutumlarını sergileyecektir."
 SWI_national_redoubt:0 "Réduit National"
 SWI_national_redoubt_desc:0 "Henri Guisan, [SWI.GetName]'ı savunmanın farklı bir yolunu öneriyor. Ülkemizin sınırlarını ne pahasına olursa olsun savunmaya çalışmak yerine, İsviçre Platosu'nu stratejik olarak devredebilir ve Alplere çekilebiliriz, burada düşmanın bizi işgal etmesini maliyetli hale getirebiliriz."
 SWI_naval_industry:0 "Denizcilik Sanayisi"
 SWI_naval_industry_desc:0 "Yeni edindiğimiz kıyı şeridinde bir denizcilik sanayisinin kalıntıları olsa bile, onu kapsamlı bir şekilde genişletmek ve gerçekten güçlü bir İsviçre donanmasına layık bir üretim ve bakım çerçevesine dönüştürmek için acele etmeliyiz."
 SWI_naval_industry_tt:0 "Her kıyı eyaletine §G1§! İnşaat Alanı ve §Y1 Deniz Tersanesi§! ekler. (Maks. 10)"
 SWI_neutral_entente:0 "Tarafsız Antant"
 SWI_neutral_entente_desc:0 "Dünyadaki tek tarafsız ulus biz değiliz ve savaş riski ve savaşan güçlerin çatışmalarının dışında kalma arzumuza tecavüz etmesiyle, onları daha da caydırmalıyız. Tüm diğer tarafsız ulusların karşılıklı yardımını aramalıyız ki bir tarafsıza savaş, tüm tarafsızlara savaş anlamına gelsin."
 SWI_neutral_entente_faction:0 "Tarafsız Antant"
 SWI_neutrality_decisions_disabled_TT:0 "§Y$SWI_absolute_neutrality_decisions_category$§! kararları devre dışı bırakılacaktır."
 SWI_oasis_of_democracy:0 "Demokrasi Vahası"
 SWI_oasis_of_democracy_desc:0 "Demokrasi düşmanları [ROOT.GetName]'ı çevreliyor, bu yüzden bu çalkantılı zamanlarda değerlerimize olan bağlılığımızda sağlam durmalıyız. [ROOT.GetName] ve demokrasisi ayrılmaz bir bütündür, bu yüzden onu savunmak için demokrasimiz yok olursa bir ülke olarak hayatta kalmanın bir anlamı yoktur."
 SWI_oasis_of_democracy_tt:0 "§Y$SWI_axis_gold$§! odağı tamamlandığında ve en az §Y1§! faşist ülke §Y$SWI_gold_trade$§! ruhuna sahip olduğunda:"
 SWI_old_switzerland_TT:0 "\n§YSavaş bittiğinde:§!\n"
 SWI_ortswehren:0 "Ortswehren"
 SWI_ortswehren_desc:0 "Topyekûn savaş, her [ROOT.GetAdjective] vatandaşının kantonunu savunmaya hazır olması gerektiği anlamına gelir, ancak herkes milislerimize katılamaz. Milislerin [SWI.GetName]'ı savunma çabalarında onlara destek olabilecek bir omurga olarak hizmet edecek yerel muhafızlar kurabiliriz."
 SWI_panoramaheim_branch:0 "Panoramaheim"
 SWI_panoramaheim_branch_desc:0 "Stuttgart'ta bir ev var, ona 'Panorama Evi' diyorlar ve [ROOT.GetAdjective] hükûmetini istikrarsızlaştırma ve faşist liderliğindeki bir rejime kapı açma hedefiyle birçok beşinci kol operatifinin kaynağı olmuştur."
 SWI_patriotic_shooting_clubs:0 "Vatansever Atıcılık Kulüpleri"
 SWI_patriotic_shooting_clubs_desc:0 "[ROOT.GetName], uzun bir keskin nişancılık kulüpleri ve yarışmaları geleneğine sahiptir. Bazı rekreasyonel keskin nişancılarımız, diğer ulusların profesyonel keskin nişancılarından daha yeteneklidir. Bu kulüpleri kaldıraç olarak kullanabilir ve savunma yeteneklerimizi geliştirmek için milislerimize entegre edebiliriz."
 SWI_plains_warfare:0 "Ova Savaşı"
 SWI_plains_warfare_desc:0 "[ROOT.GetName], vadilerde, dağlarda, tepelerde ve ormanlarda eğitim için bolca fırsat buldu, ancak yabancı topraklarda savaşacaksak modern savaş doktrinlerine uyum sağlamalıyız. Hızlı hareket eden mekanize piyadenin savunmaları nasıl şok edebileceğini ve hızlı zafer sağlayabileceğini gördük, bu yüzden bundan ders alabilir ve [ROOT.GetAdjective] ordusunu 20. Yüzyıla taşıyabiliriz."
 SWI_pre_empt_anschluss:0 "Anschluss'u Önle"
 SWI_pre_empt_anschluss_desc:0 "[GER.GetNameDef]'in [GER.GetAdjective] birliği adına [AUS.GetName]'ı ilhak etmeye çalıştığına dair söylentiler var. Bu, [ROOT.GetNAmeDef]'in izin veremeyeceği bir şeydir, çünkü bu [GER.GetNameDef]'i Almanca konuşan kantonlarımız hakkında aynı iddialarda bulunmaya teşvik edecektir. Acele etmeli ve tüm [AUS.GetName]'ın savunması için sahneyi hazırlamalıyız."
 SWI_pre_empt_anschluss_tt:0 "§YEğer [AUS.GetNameDef] kabul ederse, çekirdek eyaletlerinde çekirdekler kazanacağız§! \n\nSilahlı kuvvetlerimizin §Yboyutuna§!, bize olan §Ygörüşlerine§! ve eğer §Y[GER.GetNameDef] [AUS.GetName]'ı ilhak etmeye hazırlanıyorsa§! kabul etme olasılıkları daha yüksek olacaktır."
 SWI_prepare_infrastructure_and_industry:0 "Altyapı ve Sanayiyi Hazırla"
 SWI_prepare_infrastructure_and_industry_desc:0 "Bir ülkeyi savunmak sadece kale inşa etmekle ilgili değildir, aynı zamanda birlikleri ve sivil malları daha verimli bir şekilde taşımak için Alpler'deki altyapımızı Güçlendirmeli ve Platosu'nda daha büyük bir sanayi üssü ile geliştirmeliyiz."
 SWI_president_for_life:0 "Ömür Boyu Başkan"
 SWI_president_for_life_desc:0 "Federal Konsey, Avrupa ülkeleri arasında benzersizdir, barış zamanlarında [ROOT.GetNonIdeologyName]'a iyi hizmet etti, ancak şimdi [?SWI.SWI_confederation_president.GetName]'ın konseyi ve bir bütün olarak ülkeyi yönettiği açık olduğuna göre, [?SWI.SWI_confederation_president.GetHerHis] yönetiminin [ROOT.GetNameDef]'de bir istikrar direği olarak süresiz devam etmesi için iyi bir argüman var."
 SWI_press_for_vorarlberg:0 "Vorarlberg için Baskı Yap"
 SWI_press_for_vorarlberg_desc:0 "[AUS.GetAdjective] hükûmeti darmadağınıkken, 1919 referandumlarında ifade edilen [848.GetName]'ın demokratik iradesini yerine getirmeli ve onları Demokrasimize entegre etmeliyiz. Onları faşizme ve otokrasiye karşı korumak [ROOT.GetNameDef]'in görevidir."
 SWI_pro_helvetia:0 "Pro Helvetia"
 SWI_pro_helvetia_desc:0 "[ROOT.GetName]'ın Manevi Savunması, [ROOT.GetAdjective] kültürünün tekil, bölünmez ve komşularımızdan farklı kalmasını gerektirir. Bu yeni örgüt, Pro Helvetia, Demokrasimize derinden bağlı olan ortak İsviçre değerlerimizi koruyacak ve teşvik edecek ve ezici güce karşı hayatta kalmamızı sağlayacaktır."
 SWI_professionalize_militias:0 "Milisleri Profesyonelleştir"
 SWI_professionalize_militias_TT:0 "Tüm §Yİsviçre Vatandaş Milisleri§! tümenleri §YDüzenli Piyade§! tümenleri olacak ve §Y$SWI_military_readiness_decisions_category$§! kararları devre dışı bırakılacaktır."
 SWI_professionalize_militias_desc:0 "Gidişata bakılırsa, yedeklerden oluşan sıradan bir milis yeterli olmayacaktır. Yaklaşan çatışma için her yetenekli kişiyi eğitmeli ve onları korkulacak profesyonel bir ordu haline getirmeliyiz."
 SWI_prolonged_service:0 "Uzatılmış Hizmet"
 SWI_prolonged_service_desc:0 "Mevcut zorunlu hizmet süremiz uzun vadeli bir savaşla başa çıkmak için yetersizdir, bazı özgürlüklerden feragat etmek anlamına gelse bile, vatandaşlarımızı daha uzun süre silah altında tutmak için Federal Hükûmete araçlar vermeliyiz."
 SWI_promote_guisan:0 "Henri Guisan'ı Terfi Ettir"
 SWI_promote_guisan_desc:0 "Siyasi sistemimiz, Konfederasyonumuzun risk altında olduğu aşırı ihtiyaç zamanlarında sadece tek bir General ve Başkomutan'a izin verir. Bu kesinlikle o durumlardan biridir ve iş için adam bellidir: Henri Guisan sadece iş için en nitelikli kişi olmakla kalmaz, aynı zamanda [ROOT.GetNameDef] genelinde yaygın bir popülariteye sahiptir."
 SWI_promote_henne:0 "Henne'yi Terfi Ettir"
 SWI_promote_henne_desc:0 "Faşizmin ve [SWI_get_fascist_neighbor] ile işbirliğinin güçlü bir savunucusu olarak Rolf Henne, Ulusal Cephe'yi ve [ROOT.GetName]'ı bir [SWI_get_fascist_neighbor_adjective] uydu devletine götürmek için birinci sınıf bir adaydır, bu da kesinlikle faydalar getirecektir, en azından güvenliğimiz ve hayatta kalmamız. Bu elbette Robert Tobler'ın partiden ihraç edilmesi anlamına gelecektir, çünkü o gerekeni yapmaya istekli değildir."
 SWI_promote_tobler:0 "Tobler'ı Terfi Ettir"
 SWI_promote_tobler_desc:0 "[ROOT.GetAdjective] Parlamentosu'na seçilen bir faşist partinin tek üyesi ve Ulusal Cephe'nin lideri olarak Robert Tobler, [ROOT.GetNonIdeologyName]'ı demokratik çoğulcu bir ulustan demir bir yumrukla yönetilen bir [SWI_get_fascist_neighbor_adjective] Müttefikine yavaş ama istikrarlı bir geçişe götürmek için bariz bir adaydır. Bu elbette Rolf Henne'nin partiden ihraç edilmesi anlamına gelecektir, sadece bir Führer olabilir."
 SWI_propagandize_swiss_military_tradition:0 "İsviçre Askerî Geleneğinin Propagandasını Yap"
 SWI_propagandize_swiss_military_tradition_desc:0 "Bu, demokratik geçmişimizi anma zamanı değil. Bunun yerine, savaşçı geleneğimize odaklanmalıyız; [ROOT.GetAdjective] piyadeleri ve arbaletçileri disiplinleri ve etkinlikleriyle ünlüydü, gıpta edilen paralı askerler olarak dünya çapında işe alındılar, eğer yaklaşan savaştan sağ çıkmak istiyorsak, halkımıza askeri tarihlerini hatırlatmalıyız."
 SWI_protect_liechtenstein:0 "Lihtenştayn'ı Koru"
 SWI_protect_liechtenstein_desc:0 "Üç kantonumuzun arasına sıkışmış olan küçük Lihtenştayn prensliği, halkını korumak için korunmalıdır. Sonuçta, bizimki de dahil olmak üzere herhangi bir yabancı orduya karşı hiç şansları olmazdı. Topraklarını işgal ederek yardımımızı sunabiliriz, yeminimize katılabilir ve en yeni kantonumuz olabilirler."
 SWI_purchase_american_planes:0 "[SWI_purchase_democratic_planes_title]"
 SWI_purchase_american_planes_desc:0 "Hava kuvvetlerimiz kendimizi etkili bir şekilde savunmak için gerekli sayılara ve teknolojiye sahip değil, bu yüzden teçhizatımızı tedarik etmek için başka bir yere bakmalıyız. [SWI_purchase_american_planes_second_paragraph]"
 SWI_purchase_american_planes_other:0 "Demokratik Ulustan Uçak Satın Al"
 SWI_purchase_american_planes_usa:0 "Amerikan Uçakları Satın Al"
 SWI_purchase_german_planes:0 "[SWI_purchase_fascist_planes_name]"
 SWI_purchase_german_planes_alt:0 "Faşist Komşudan Uçak Satın Al"
 SWI_purchase_german_planes_default:0 "Alman Uçakları Satın Al"
 SWI_purchase_german_planes_desc:0 "Modası geçmiş bir hava kuvvetiyle ve herhangi bir önemli miktarda uçak üretme sanayisine ve teknolojisine sahip olmadan, onları komşularımızdan satın almaya mecburuz. [GER.GetName]'dan ihtiyacımız olan uçakları satın almak, sadece ihtiyacımız olan teçhizatı sağlamakla kalmayacak, aynı zamanda onlarla iyi geçinmemize de yardımcı olacaktır."
 SWI_reaffirm_spiritual_defense:0 "Manevi Savunmayı Yeniden Teyit Et"
 SWI_reaffirm_spiritual_defense_desc:0 "Konfederasyonumuz, 1932'den beri çevresindeki artan otoriterlik tehdidine yanıt olarak İsviçre ulusal değerlerinin savunulmasına kendini adamıştır. Şimdi her zamankinden daha fazla, bu tehdit büyük bir şekilde beliriyor, bu yüzden yaşam tarzımızı fiziksel ve manevi olarak savunma sözümüzü yenilemeliyiz."
 SWI_reduce_military_training_age:0 "İşe Alım Yaşını Düşür"
 SWI_reduce_military_training_age_desc:0 "Genellikle, [ROOT.GetAdjective] 20 yaşında savaş eğitimi almaya başlar, ancak hayatta kalmak için ihtiyacımız olan sayıları silah altında tutmak için, vatandaşlarımızın eğitimlerine bir yıl önce başlaması gerekecek. Umalım ki bu yeterli olur."
 SWI_reduce_militia_activation_time_TT:0 "§YVatandaş Milislerimizi§! tam olarak seferber etme süresi §G$RIGHT|0$§! gün azaltılacaktır"
 SWI_request_austrian_occupation:0 "[AUS.GetAdjective] İşgalini Talep Et"
 SWI_request_austrian_occupation_desc:0 "[ROOT.GetNonIdeologyName]'ın [848.GetName]'ı ilhak etmesi kesinlikle bizim son formumuz değil. [?SWI_fascist_overlord.GetName]'a daha büyük bir toprağın yönetimini üstlenebileceğimizi, yüklerini hafifletebileceğimizi ve [ROOT.GetFactionName]'ı daha verimli bir savaş makinesi haline getirebileceğimizi kanıtlayabiliriz."
 SWI_request_french_alps_occupation:0 "[FRA.GetAdjective] İşgalini Talep Et"
 SWI_request_french_alps_occupation_desc:0 "[FRA.GetNonIdeologyName] nesillerdir toprağımıza göz dikti, şimdi onların topraklarının kontrolünü ele alıp her ikisinin de geleceği için yönetebileceğimiz bir konumda olmamız çok uygun."
 SWI_request_italian_alps_occupation:0 "[ITA.GetAdjective] İşgalini Talep Et"
 SWI_request_italian_alps_occupation_desc:0 "Ülkemizin bir kısmı [ITA.GetAdjective] konuşan vatandaşlardan oluştuğu için, [ITA.GetName]'ı yönetmeye ve halkını ve kaynaklarını bu savaşı tamamlama çabalarımızı sürdürmek için kullanmaya sorunsuz bir şekilde geçiş yapabiliriz."
 SWI_return_to_the_old_switzerland:0 "Eski İsviçre'ye Dönüş"
 SWI_return_to_the_old_switzerland_desc:0 "Artık savaş sona ererken, nihayet [ROOT.GetNonIdeologyName]'ı eski haline; karşılıklı saygı ve kendi kaderini tayin etme ilkeleri üzerine kurulu demokratik ve tarafsız bir ulusa geri döndürmek için adımlar atabiliriz. Savaş bittiğinde, nihayet etrafımızda demokrasiyi ve tarafsızlığı uygulayabileceğiz."
 SWI_rig_infrastructure_to_blow:0 "Altyapıyı Patlatmaya Hazırla"
 SWI_rig_infrastructure_to_blow_TT:0 "Çekirdek eyaletlerimizden biri düşman tarafından ele geçirildiğinde, tüm §YAltyapı§!, §YDemiryolları§!, §Yİkmal Merkezleri§! ve §YSığınaklar§! tamamen hasar görecektir. §YAskerî§! ve §YSivil Fabrikalar§! kısmen hasar görecektir."
 SWI_rig_infrastructure_to_blow_desc:0 "Eğer istilacıları sınırlarımıza sokacaksak, onlara her şeyi gümüş bir tepside sunamayız. Altyapımızı düşman tarafından kullanılamaz hale getirmek için hazırlamamız, ilerlemelerini yavaşlatmamız ve onu değiştirmek için değerli kaynaklar harcamalarını zorlamamız son derece önemlidir."
 SWI_rolling_fortresses:0 "Yuvarlanan Kaleler"
 SWI_rolling_fortresses_desc:0 "Tanklarımız mevcut savunma doktrinlerimizin bir parçası olabilir, bu yüzden dağlarımızı savunan kalelerin gelişmiş bir pozisyonudurlar. Eğer düşman müstahkem cephe hatlarımızdan geçemezse, kantonlarımıza asla ulaşamazlar."
 SWI_secret_pact_with_allies_TT:0 "Eğer kendimizi bir savaşın içinde bulursak, derhal onların ittifakına katılacağız."
 SWI_secret_pact_with_the_allies:0 "Müttefiklerle Gizli Pakt"
 SWI_secret_pact_with_the_allies_desc:0 "[ROOT.GetName] topyekûn bir savaşa veya hatta açıkça bir ittifaka katılmaya hazır değil, ama dostlarımız olmadan güvende olmayacağımızdan emin olabiliriz. Sürpriz bir istila durumunda demokrasimizi savunmak için, [?SWI.SWI_best_dem_ally.GetNameDef] ile gizlice görüşebilir ve bir anlaşma yapabiliriz. Onlara savaşa katılmaya hazırlanmaları için gizlice destek sözü vereceğiz, karşılığında, saldırıya uğrarsak bizi koruyacaklar."
 SWI_seek_allied_trade:0 "Müttefik Ticareti Ara"
 SWI_seek_allied_trade_desc:0 "Etrafımızdaki düşmanlarla, hayatta kalmak için Müttefiklerle hayati ticareti güvence altına almalıyız. Eğer şanslıysak, diğer komşularımızın öfkesini, onların rakipleriyle daha yakın ticaret arayışına girdiğimiz için üzerimize çekmekten kaçınabiliriz."
 SWI_seek_trade_agreement_with_germany:0 "Almanya ile Ticaret Anlaşması Ara"
 SWI_seek_trade_agreement_with_germany_desc:0 "Faşizm korkunç yükselişine devam ediyor ve yutulması zor bir hap olsa da, bazı ekonomik işbirliklerine izin vermek, nişangahlarını bizden uzak tutmak için ihtiyacımız olan şey olabilir."
 SWI_share_spy_networks:0 "Casus Ağlarını Paylaş"
 SWI_share_spy_networks_desc:0 "[?SWI.SWI_best_dem_ally.GetNameDefCap]'in hedefi bizimkiyle aynı, Faşizmi kontrol altında tutmak ve bunu başarmak için [?SWI.SWI_biggest_fascist.GetNameDef]'i düşman edinmemize gerek yok. [ROOT.GEtName], [GER.GetAdjective], [ITA.GetAdjective] ve [FRA.GetAdjective] toplumlarına sızabilecek deneyimli operatiflere erişime sahiptir; Bu avantajı [?SWI.SWI_best_dem_ally.GetNonIdeologyName]'a ödünç verebiliriz."
 SWI_size_and_opinion_chance_tooltip:0 "\nSilahlı kuvvetlerimizin §Yboyutuna§! ve bize olan §Ygörüşlerine§! göre kabul etme olasılıkları daha yüksek olacaktır."
 SWI_spab_counter_intelligence_agency:0 "SpAb"
 SWI_spab_counter_intelligence_agency_desc:0 "[GER.GetNameDef]'in Stuttgart'ta Panoramaheim olarak adlandırılan beşinci kol sabotajcılarını eğitmek için bir eğitim merkezi kurduğunu biliyoruz. Bu yüzden Federal Polisi, bu tehditlerle başa çıkmak ve yabancı casusluk ile sabotaja karşı savaşmak için bir Spionage Abwehr tümeniyle güçlendirmeliyiz."
 SWI_spirit_of_resistance:0 "Direniş Ruhu"
 SWI_spirit_of_resistance_desc:0 "[ROOT.GetName] halkının kalpleri ve zihinleri, hayatta kalma savaşımızdaki en önemli cephedir. Her [ROOT.GetAdjective] vatandaşımızın, her şey kaybolmuş gibi göründüğünde bile sonuna kadar savaşmaya hazır olduğundan emin olmalıyız."
 SWI_spirit_of_saint_bernard:0 "Aziz Bernard Ruhu"
 SWI_spirit_of_saint_bernard_desc:0 "Ezelden beri tıbbi geleneğimizle ve ihtiyaç sahibi insanlara yardım etme isteğimizle gurur duyduk. Büyük Aziz Bernard Darülacezesi ve Kızılhaç örgütü bunun kanıtıdır. Şimdi bu ruh, savunma çabalarımızı desteklemek için silahlandırılabilir ve milislere yönlendirilebilir."
 SWI_submarine_raiders:0 "Denizaltı Akıncıları"
 SWI_submarine_raiders_desc:0 "Eski deniz güçleri devasa çelik yığınlarına sahip olsunlar. Onlar denizlerde kaba kuvvetle savaşırken, biz yüzeyin altında denizaltılarımızla kurnazca savaşacak, eski ve köhne deniz güçlerini yavaş yavaş aşındıracağız."
 SWI_support_active_militias_continuous_focus:0 "Aktif Milisleri Destekle"
 SWI_support_active_militias_continuous_focus_desc:0 "Vatandaşlarımız silahlı ve yerel milislerine konuşlandırılmış durumda, konfederasyonun düşmanlarını uzak tutabilmemiz için onlara ellerinden geldiğince destek olmak herkesin görevidir"
 SWI_support_allied_espionage:0 "Müttefik Casusluğunu Destekle"
 SWI_support_allied_espionage_desc:0 "Tarafsız bir dış politika sürdürmemiz, Avrupa'da faşizmi bastırma çabalarında diğer demokratik ulusları gizlice desteklememizi engellemez. Aslında, tarafsızlığımız ve [?SWI.SWI_biggest_fascist.GetNameDef]'e yakınlığımız, bizi Faşizme karşı uluslararası mücadelede hayati kılıyor."
 SWI_swiss_airplane_designs:0 "İsviçre Uçak Tasarımı"
 SWI_swiss_airplane_designs_desc:0 "Göklerde ustalaşmamızı sağlayan makine için komşularımıza güvenemeyiz, çünkü onların yenilgisinin araçlarını bize uysalca sağlayacaklarına güvenemeyiz."
 SWI_swiss_armored_divisions:0 "İsviçre Zırhlı Tümenleri"
 SWI_swiss_armored_divisions_desc:0 "Tarihsel olarak olağanüstü bir piyadeye sahip olmakla övündük, ancak düşmanlarımızın zırhlı devleriyle savaşırken bu yeterli değil. Kendi mekanize canavarlarımızı yapmalıyız."
 SWI_swiss_guiding_principles:0 "İsviçre Yol Gösterici İlkeleri"
 SWI_swiss_guiding_principles_desc:0 "[ROOT.GetNameDefCap], kıtanın en eski Demokrasisi olarak duruyor, ancak Avrupa'daki baş döndürücü değişim hızı bunu riske atıyor. Eidgenossenschaft ve 1848 Anayasası tarafından belirlenen rotayı mı sürdürmeliyiz, yoksa bize yeni bir yol mu açılacak?"
 SWI_swiss_heavy_planes:0 "İsviçre Ağır Uçakları"
 SWI_swiss_heavy_planes_desc:0 "[ROOT.GetNonIdeologyName]'daki üslerimizden, böyle bir yolculuk için gerekli ağır uçaklara sahipsek, uzak topraklara operasyonlar başlatabiliriz, ancak önce onları tasarlamalıyız."
 SWI_swiss_ship_designs:0 "İsviçre Gemi Tasarımları"
 SWI_swiss_ship_designs_desc:0 "Denize elverişli savaş gemilerinin tasarımı ve imalatında pek deneyimimiz olmayabilir, ancak ne kadar erken başlarsak, [ENG.GetNameDef] ve [ITA.GetName] gibi eski ve büyük deniz güçleri arasında o kadar erken kendi başımıza durabiliriz."
 SWI_switzerland_on_the_offense:0 "İsviçre Saldırıda"
 SWI_switzerland_on_the_offense_desc:0 "Dağlarımızda saldırıya uğramayı bekleyerek dinlenemeyiz. İnisiyatifi ele almalı ve bize saldırmadan önce savaşı düşmanlarımıza götürmeliyiz. Ancak o zaman [ROOT.GetNameDef]'in hayatta kalmasının garanti olduğundan emin olabiliriz. Sonuçta, en iyi savunma güçlü bir saldırıdır."
 SWI_take_a_stance:0 "Bir Tavır Al"
 SWI_take_a_stance_desc:0 "Faşist [?SWI_biggest_fascist.GetNonIdeologyName], en iğrenç ve sefil siyasi sisteme sahiptir. [?SWI_biggest_fascist.GetNameDefCap], yeni [SWI.GetName]'ın ölümcül düşmanıdır; bu yüzden duruşumuzu sergilemeli ve demokrasimizi her ne pahasına olursa olsun savunmalıyız."
 SWI_take_over_france:0 "Fransa'yı Koru"
 SWI_take_over_france_desc:0 "[FRA.GetNonIdeologyName] her zaman kararsız bir ulus olmuştur, sık sık yaşanan kargaşalarda bir yazı-tura atışı, günün devriminin sonucunun zayıf bir demokrasi mi yoksa militarist bir rejim mi olacağına karar verir. [ROOT.GetAdjective] koruması altında [FRA.GetAdjective] halkı, demokratik istikrarımız tarafından yönetilerek gelişebilir."
 SWI_tank_development:0 "Tank Geliştirme"
 SWI_tank_development_desc:0 "Yeni ve geliştirilmiş tankların geliştirilmesinde gardımızı düşüremeyiz, yoksa çeliği işe yaramaz ve modası geçmiş metal kaplumbağalara harcama riskini alırız."
 SWI_the_alpine_confederation:0 "Alp Konfederasyonu"
 SWI_the_alpine_confederation_chance_TT:0 "\nSilahlı kuvvetlerimizin §Yboyutuna§! ve bize olan §Ygörüşlerine§! göre bize bağımsızlık verme olasılıkları daha yüksek olacaktır ve bu aynı zamanda bize ek Alp toprakları verme şanslarını da artıracaktır."
 SWI_the_alpine_confederation_desc:0 "Büyük ülkemiz tarihi sınırlarının ötesine genişledi ve kanatlarımız altındaki yeni kantonlar Schwyz ile aynı statüyü alırken, Alplerin koruyucuları olarak yeni durumumuzu kabul etmeliyiz. Yeni bir demokratik güç doğuyor: Alp Konfederasyonu!"
 SWI_the_alpine_protectorate:0 "Alp Himayesi"
 SWI_the_alpine_protectorate_desc:0 "Daha önce hiç Alpler tek bir rejim altında birleşmemişti, bugüne kadar. Birleşik güçle, kendimizi herhangi bir tehdide karşı savunabilir ve bu savunmayı Alplerin ötesine, zirvelerimiz komutamızın asla sarsılmayacağı aşılmaz bir kale olarak uzatabiliriz."
 SWI_the_alpine_supremacy:0 "Alp Üstünlüğü"
 SWI_the_alpine_supremacy_desc:0 "Diplomasinin eterinde var olan uysal ve yönsüz ulus [SWI.GetNonIdeologyName] artık yok. Artık Alpler, halkı ve ötesi üzerindeki hakimiyetimizi temsil etmek için Alp Üstünlüğü olarak bilineceğiz."
 SWI_the_army_position:0 "Ordu Mevzisi"
 SWI_the_army_position_desc:0 "Vatandaş Milislerimizi ve daimi ordumuzu [ROOT.GetName] sınırlarına yerleştireceğiz, bu yüzden davetsiz misafirleri uzak tutma yeteneklerini artırmak için tahkimatlara ihtiyaçları olacak."
 SWI_the_national_front:0 "Ulusal Cephe"
 SWI_the_national_front_desc:0 "[ROOT.GetNonIdeologyName]'daki önde gelen faşist parti Ulusal Cephe'dir, eğer bu demokratik eğilimli ulusta iktidara gelecek biri varsa o da onlardır. Bazı üst düzey üyelerin zaten [GER.GetNameDef] ile yakın bağları var, bu da savaş başlarsa veya başladığında onlardan bir tür koruma ile sonuçlanabilir."
 SWI_the_new_eidgenossenschaft:0 "Yeni Eidgenossenschaft"
 SWI_the_new_eidgenossenschaft_desc:0 "13. Yüzyılda üç kurucu kantonun liderleri, Eidgenossenschaft dediğimiz ebedi bir ittifak yemini ettiler. Şimdi onu yenileme zamanı geldi, böylece onu genişletebilir ve daha fazla kanton demokratik konfederasyonumuzu deneyimleyebilir."
 SWI_the_petition_of_the_200:0 "200'ler Dilekçesi"
 SWI_the_petition_of_the_200_desc:0 "[ROOT.GetAdjective] faşizmini ve otoriterliğini temsil eden geniş bir parti yelpazesinden 200 üye, kendini koruma çıkarı doğrultusunda [GER.GetNameDef]'i kabul etmeye ve işbirliği yapmaya başlamamızı talep eden bu dilekçeyi Meclise sundu"
 SWI_the_second_helvetic_republic:0 "İkinci Helvetia Cumhuriyeti"
 SWI_the_second_helvetic_republic_desc:0 "1798'de kötü şöhretli diktatör Napolyon Bonapart [ROOT.GetName]'ı fethetti ve halkımızı boyunduruk altına almak için bir araç olarak Helvetia Cumhuriyeti'ni kurdu. Neyse ki bizim için o günler geride kaldı ve ikinci kez, uzun süredir komşumuz olanla daha adil bir birlik bekleyebileceğimizden emin olabiliriz."
 SWI_thunder_in_the_valleys:0 "Vadilerde Gök Gürültüsü"
 SWI_thunder_in_the_valleys_desc:0 "Alışkın olduğumuz dağlarda zırhlı savaşın yeri yoktur, ancak saldırıya geçmek ve düşmanlarımıza bize ulaşmadan saldırmak istiyorsak, hızla yetişmeli ve kendi araçlarımızı geliştirmeliyiz."
 SWI_tighten_press_censorship:0 "Basın Sansürünü Sıkılaştır"
 SWI_tighten_press_censorship_desc:0 "Hata için yer yok, tek bir kelime konfederasyonun hayatta kalması ile yok oluşa sürüklenmesi arasındaki fark olabilir. Özgür bir basının geleceğimizi tehlikeye atmasına izin veremeyiz, tam olarak [?SWI.SWI_biggest_fascist.GetNameDef]'in talep ettiği şekilde sıkı bir şekilde kontrol edilmelidirler."
 SWI_total_defense:0 "Topyekûn Savunma"
 SWI_total_defense_desc:0 "Topyekûn savaş, topyekûn savunma gerektirir, eğer her milis hazırlanır ve istilacılara karşı ellerinden gelen her şeyi verirse hayatta kalma şansımız olabilir."
 SWI_train_navy_staff:0 "Donanma Personeli Eğit"
 SWI_train_navy_staff_desc:0 "Bir deniz altyapısı sadece çelik ve betondan yapılmaz, aynı zamanda denizlerde ve okyanuslarda zafer kazandıracak cesarete ve eğitime sahip kadın ve erkeklere de ihtiyaç duyar."
 SWI_train_swiss_women:0 "İsviçreli Kadınları Eğit"
 SWI_train_swiss_women_desc:0 "Eğer ülkemizi dişimizle tırnağımızla savunmak istiyorsak, nüfusumuzun yarısını çabalarımızdan dışlamak saçma olurdu. [ROOT.GetAdjective] kadınları, hayatta kalma mücadelemize katılmak için eğitilmelidir."
 SWI_veteran_sharpshooter_divisions:0 "Gazi Keskin Nişancı Tümenleri"
 SWI_veteran_sharpshooter_divisions_desc:0 "Binlerce gazi keskin nişancı, ordulara yardımcı olarak katılma ve ülkelerinin ve demokrasilerinin savunması için üzerlerine düşeni yapma izni istedi. Deneyimleri ve coşkuları milislerimiz için bir nimet olacaktır."
 SWI_viable_fascist_in_europe:0 "Avrupa'da geçerli §YFaşist Ulus§! var"
 SWI_volunteer_force:0 "Gönüllü Kuvvet"
 SWI_volunteer_force_desc:0 "Henüz savaşta değiliz, ama [ROOT.GetAdjective] halkı demokrasi için savaşmaya hazır. Tarafsızlığı ihlal etmiş gibi görülemeyiz, ama bir demokrasi olarak, halkımızın nereye gittiğini ve nerede savaştığını kontrol edemeyiz, bu yüzden [ROOT.GetName]'ın geri kalanının açıkça çabalara katılmasına hazırlık olarak tiranlığa karşı silahlanmayı sessizce teşvik edebiliriz."
 SWI_weapons_of_democracy:0 "Demokrasinin Silahları"
 SWI_weapons_of_democracy_desc:0 "Düşman düşünülemez olanı yapmadan önce, onları durdurmak için gerekli olanı yapmaya hazır olmalıyız, bu, düşmanlarımızın üzerine cehennem yağdırabilecek ayrım gözetmeyen kitle imha silahları kullanmak anlamına gelse bile. Şüphesiz bu onları daha fazla vahşetten caydıracaktır."
 SWI_withdraw_from_the_league_of_nations:0 "Milletler Cemiyeti'nden Çekil"
 SWI_withdraw_from_the_league_of_nations_desc:0 "Milletler Cemiyeti üyeliğimiz, [ROOT.GetName]'da sahip olmayı arzuladığımız Tarafsızlık ile bağdaşmıyor, bu yüzden bu ölen organizasyonu terk etmemiz hayati önem taşıyor. Bu aynı zamanda komşularımıza gerçek tarafsızlığa olan bağlılığımızı da gösterecek, umarım onları [ROOT.GetName]'ın bir hedef olmadığına ikna eder."
 abuna_abraham_gojjam_tt:0 "§Y$ETH_abuna_abraham$§!:"
 add_faction_goal_secure_north_africa_tt:0 "[ROOT.GetName] bir ittifaktaysa §Y$secure_north_africa_goal_name$§! hedefini ekler."
 banda_carita_tt:0 "Almanya'nın §Y$GER_assassinate_mussolini$§! odağını tamamlamasını engeller!"
 ecole_militaire_haile_selassie_1er:0 "Ecole Militaire Haile Selassie 1er"
 every_league_of_nations_member_tt:0 "Her Milletler Cemiyeti Üyesi Ülke:"
