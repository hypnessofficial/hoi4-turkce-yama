 POL_april_constitution_5_desc:0 "Bu mevzuat, Polonya devletinin devam eden barışını ve istikrarını sağlamak için 1935'te Sejm tarafından kabul edildi. Anayasa, Başkana neredeyse mutlak yetkiler vererek, ona Sejm ve Senato üzerinde üstünlük tanır."
 POL_april_constitution_dem:0 "Değiştirilmiş Nisan Anayasası"
 POL_april_constitution_dem_desc:0 "Bu mevzuat, Polonya devletinin devam eden barışını ve istikrarını sağlamak için 1935'te Sejm tarafından kabul edildi. Anayasa, her Polonya yöresine bir dizi kutsal hak ve ayrıcalık içerecek şekilde değiştirildi, yerel özerklik ve demokratik haklar tanındı, ancak Başkan hala ulusal düzeyde devlet üzerinde mutlak güce sahip."
 POL_april_constitution_dem_left:0 "Değiştirilmiş Nisan Anayasası"
 POL_april_constitution_dem_left_desc:0 "Bu mevzuat, Polonya devletinin devam eden barışını ve istikrarını sağlamak için 1935'te Sejm tarafından kabul edildi. Anayasa, her Polonya yöresine bir dizi kutsal hak ve ayrıcalık içerecek şekilde değiştirildi, yerel özerklik ve demokratik haklar tanındı, ancak Başkan hala ulusal düzeyde devlet üzerinde mutlak güce sahip."
