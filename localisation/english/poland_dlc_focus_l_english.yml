l_english:
 POL_a_cruiser_navy:0 "Bir Kruvazör Donanması"
 POL_a_cruiser_navy_desc:0 "Denizdeki varlığımıza dair planlarımızı gerçeğe dönüştürmek için giderek daha büyük gemilere ihtiyaç duyulacaktır."
 POL_abolish_segregated_seating:0 "Ayrılmış Oturma Düzenini Kaldır"
 POL_abolish_segregated_seating_desc:0 "Polonya, farklı etnik kökenlere, kültürlere ve inançlara sahip insanlardan oluşan bir manzaradır, ancak eğitimimizde onları ayrı tutuyoruz. Eğer gerçekten hepsi Polonyalıysa, o zaman birlikte olmalı ve fikirlerini özgürce paylaşmalıdırlar. Ayrılmış oturma düzeni, eğitimimiz üzerinde bir kısıtlamadan başka bir şey değildir ve kaldırılmalıdır."
 POL_aces_in_exile:0 "Sürgündeki Aslar"
 POL_aces_in_exile_desc:0 "Düşman anavatanımızı almış olabilir, ama en iyi pilotlarımız hala havayı dolduruyor ve adamlarımıza ilerlemeye devam etmeleri için ilham veriyor!"
 POL_adaptive_designs:0 "Uyarlanabilir Tasarımlar"
 POL_adaptive_designs_desc:0 "Yabancı tasarımcılar için lisansımızı sürdürmek devlete büyük bir masraf getiriyor, ama belki de askeri tasarımlarımızı özel sektörde kullanışlı olacak şekilde yeniden amaçlandırmanın yolları vardır. Malzemelerimizin bir kısmını zenginlere dağıtarak, bu yabancı tasarım şirketlerini istihdam etme masrafını hafifletebiliriz."
 POL_additional_research_slot1:0 "Polonya Matematik Okulu"
 POL_additional_research_slot1_desc:0 "Matematik, teknoloji sektöründeki hemen hemen her şeyin merkezindedir. Polonya'nın her yerinde; Lwów'dan Varşova'ya kadar, matematik okulları gelişiyor. Polonyalı düşünürlerin bu altın çağından yararlanmalı ve bu adamlara Polonya'yı hak ettiği teknolojik güç merkezi yapmak için ihtiyaç duydukları her şeyi vermeliyiz!"
 POL_additional_research_slot2:0 "Varşova Üniversitesi'ni Genişlet"
 POL_additional_research_slot2_desc:0 "Varşova üniversitesi, Polonya'nın en büyük beyinlerinin çoğunun ders vermek, öğrenmek ve Polonya'nın teknolojik yeteneklerini genişletmek için geldiği yerdir. Üniversitenin genişlemesine yatırım yaparak, Polonya devletini güçlendirecek daha fazla beyin ve düşünür için koltuklarımız olacak!"
 POL_agrarian_reform:0 "Tarım Reformu"
 POL_agrarian_reform_desc:0 "Ufukta bir köylü grevi var. Ülkenin her yerinde gıda fiyatları fırlıyor ve hem kopuk sanayimiz hem de hükûmetin Polonya'nın en yoksullarına yardım etmedeki eylemsizliği köylülükte büyük bir huzursuzluğa neden oluyor. Ancak yeterli yatırım ve reformla, köylülerin taleplerini karşılamaktan daha fazlasını yapabilecek hale gelmeliyiz."
 POL_air_base_expansion:0 "Hava Üssü Genişletmesi"
 POL_air_base_expansion_desc:0 "Hava üsleri, hava desteği için ne kadar önemliyse, hava desteği de modern savaş için o kadar önemlidir."
 POL_air_innovations:0 "Hava Yenilikleri"
 POL_air_innovations_desc:0 "Hava stratejisi ve taktikleri alanında hala yapılması gereken çok şey var."
 POL_air_modernisations_programme:0 "Hava Modernizasyon Programı"
 POL_air_modernisations_programme_desc:0 "Havacılık teorisi de teknoloji kadar önemlidir. Pilotlarımız için yeni stratejiler hala keşfedilmeyi bekliyor."
 POL_align_with_the_west:0 "Batı ile Hizalan"
 POL_align_with_the_west_desc:0 "İngilizler, Fransızlar ve diğer batılı güçler uzun zamandır Polonya egemenliğinin sadık savunucuları olmuştur, bu yüzden ulusumuzu onlarla hizalı tutmamız iyi olur."
 POL_annex_czech:0 "Çekoslovakya'yı İlhak Et"
 POL_annex_czech_desc:0 "Çekoslovak devleti kendini savunamadığını, Batı koruması altında çöküp sinerek kanıtladı. Çekleri ve Slovakları Polonya ordusunun koruması altına alma zamanı geldi."
 POL_annexation_refused:0 "İlhak Reddedildi"
 POL_anti_blitz_vehicles:0 "Anti-Blitz Araçları"
 POL_anti_blitz_vehicles_desc:0 "Düşmanlarımız bizi ezici zırhlı tümen dalgalarıyla istila etmeye çalışacaktır. Düşman tanklarıyla eşleşmemiz pek olası değil, ancak düşmana büyük bir bedel ödetecek şekilde özellikle araçları kırmak için tasarlanmış silahlara yatırım yapabiliriz."
 POL_anti_german_offensive:0 "Anti-Alman Planları"
 POL_anti_german_offensive_desc:0 "Almanları bu eyaletin şehir sokaklarında tuzağa düşürmek için planlar yapıldı."
 POL_anti_soviet_offensive:0 "Anti-Rus Planları"
 POL_anti_soviet_offensive_desc:0 "Polonya orduları, bu eyaletteki [SOV.GetAdjective] taarruzuna karşı koymak için son derece özel planlar aldı."
 POL_anti_tank_guns:0 "Anti-Tank Silahları"
 POL_anti_tank_guns_desc:0 "Herhangi bir düşman kesinlikle bize karşı tanklar konuşlandıracaktır. Onlara sıcak bir karşılama yapmaya hazırlıklı olmalıyız."
 POL_appoint_new_officers:0 "Yeni Subaylar Ata"
 POL_appoint_new_officers_desc:0 "Şimdi askeri personelimiz sadakatsiz generallerden temizlendiğine göre, Polonya egemenliğine derinden önem veren ve Kale'ye, Sol'a veya Sağ'a sadakati olmayan adamlara güç verme fırsatımız var."
 POL_april_constitution_1:0 "Nisan Anayasası"
 POL_april_constitution_1_desc:0 "Bu mevzuat, Polonya devletinin devam eden barışını ve istikrarını sağlamak için 1935'te Sejm tarafından kabul edildi. Anayasa, Başkana neredeyse mutlak yetkiler vererek, ona Sejm ve Senato üzerinde üstünlük tanır."
 POL_april_constitution_2:0 "Nisan Anayasası"
 POL_april_constitution_2_desc:0 "Bu mevzuat, Polonya devletinin devam eden barışını ve istikrarını sağlamak için 1935'te Sejm tarafından kabul edildi. Anayasa, Başkana neredeyse mutlak yetkiler vererek, ona Sejm ve Senato üzerinde üstünlük tanır."
