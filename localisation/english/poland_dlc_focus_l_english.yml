 POL_april_constitution_fas_right_desc:0 "Bu mevzuat, Polonya devletinin devam eden barışını ve istikrarını sağlamak için 1935'te Sejm tarafından kabul edildi. Anayasa, orduyu hem iç hem de dış tüm işlerin egemeni olarak yerleştirecek şekilde değiştirildi. Ayrıca, ultra-milliyetçi falanjist ilkeler yüksek rütbeli askerler tarafından benimsendi, bu da ordu ile falanjistler arasındaki farkı sadece teknik bir ayrıntı haline getirdi."
