 the_king_of_the_castle:0 "Kalenin Kralı"
 uncontrolled_exports:0 "Ambargolu Ekonomi"
 uncontrolled_exports_desc:0 "Yabancı bir ulusun ihracat ve ithalatımız üzerinde neredeyse tam kontrolü var, bu da ekonomimizi esasen bir ambargo durumuna getiriyor; dünyanın geri kalanıyla özgürce ticaret yapamaz hale geliyor."
