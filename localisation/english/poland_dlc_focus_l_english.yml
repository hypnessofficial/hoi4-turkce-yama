 POL_april_constitution_dem_right_desc:0 "Bu mevzuat, Polonya devletinin devam eden barışını ve istikrarını sağlamak için 1935'te Sejm tarafından kabul edildi. Anayasa, her Polonya yöresine bir dizi kutsal hak ve ayrıcalık içerecek şekilde değiştirildi, yerel özerklik ve demokratik haklar tanındı, ancak Başkan hala ulusal düzeyde devlet üzerinde mutlak güce sahip."
 POL_april_constitution_fas:0 "Değiştirilmiş Nisan Anayasası"
 POL_april_constitution_fas_desc:0 "Bu mevzuat, Polonya devletinin devam eden barışını ve istikrarını sağlamak için 1935'te Sejm tarafından kabul edildi. Anayasa, orduyu hem iç hem de dış tüm işlerin egemeni olarak yerleştirecek şekilde değiştirildi. Ayrıca, ultra-milliyetçi falanjist ilkeler yüksek rütbeli askerler tarafından benimsendi, bu da ordu ile falanjistler arasındaki farkı sadece teknik bir ayrıntı haline getirdi."
 POL_april_constitution_fas_left:0 "Değiştirilmiş Nisan Anayasası"
 POL_april_constitution_fas_left_desc:0 "Bu mevzuat, Polonya devletinin devam eden barışını ve istikrarını sağlamak için 1935'te Sejm tarafından kabul edildi. Anayasa, orduyu hem iç hem de dış tüm işlerin egemeni olarak yerleştirecek şekilde değiştirildi. Ayrıca, ultra-milliyetçi falanjist ilkeler yüksek rütbeli askerler tarafından benimsendi, bu da ordu ile falanjistler arasındaki farkı sadece teknik bir ayrıntı haline getirdi."
