 POL_april_constitution_right:0 "Nisan Anayasası"
 POL_april_constitution_right_desc:0 "Bu mevzuat, Polonya devletinin devam eden barışını ve istikrarını sağlamak için 1935'te Sejm tarafından kabul edildi. Anayasa, Başkana neredeyse mutlak yetkiler vererek, ona Sejm ve Senato üzerinde üstünlük tanır."
 POL_army_modernisation:0 "Ordu Modernizasyonu"
 POL_army_modernisation_desc:0 "Modern insanlar için modern silahlar!"
 POL_artillery_modernisation:0 "Topçu Modernizasyonu"
 POL_artillery_modernisation_desc:0 "Askerlerimizin etkili bir şekilde konuşlandırılması için ihtiyaç duydukları desteği iyileştirmeyi ve modernize etmeyi ihmal etmemeliyiz."
 POL_atomic_physics_institute:0 "Atom Fiziği Enstitüsü"
 POL_atomic_physics_institute_desc:0 "Fisyonun ilkel ateşini dizginlemenin bir yolunu ilk keşfeden olma şansını kaybetmemeliyiz."
 POL_attract_foreign_motors:0 "Yabancı Motor Şirketlerini Çek"
 POL_attract_foreign_motors_desc:0 "Bazıları, Polonya motorlu teçhizatının geleceğinin orijinal Polonya LRL tasarımlarında yattığında ısrar etse de, tekerleği yeniden hizalayabilecekken neden yeniden icat edelim sorusu kalır? Yabancı motor şirketleri, malzemeleri daha ucuz, daha hızlı ve daha sert yapma sanatında ustalaştılar, bu yüzden bizim için teçhizat tasarlamaları için onları davet etmek akıllıca görünüyor!"
 POL_attract_poles_to_gdynia:0 "Polonyalıları Gdynia'ya Çek"
 POL_attract_poles_to_gdynia_desc:0 "Büyük bir limanın işletilmesi için büyük adamlara ihtiyaç vardır ve istihdam bekleyen sayısız Polonyalı var. Gdynia'ya göçü teşvik ederek, limanın geliştirme projemize devam edebiliriz."
 POL_austro_hungarian_alliance:0 "Avusturya-Macaristan İttifakı"
 POL_austro_hungarian_alliance_desc:0 "Avusturya-Macarlar bir zamanlar Polonya halkını imparatorluklarında hapsetmiş olsalar da, şimdi bizim gibi Almanların hedefindeler. İşbirliği onlar için kaçınılmaz görünüyor, ama belki onlara başka bir seçenek sunarsak, krallıklarının anahtarlarını [GER.GetLeader]'e teslim etme dürtüsünden kaçınırlar."
 POL_authoritarianism:0 "Otoriterlik"
 POL_authoritarianism_desc:0 "Demokrasi, zorlu sorunlara zayıf bir çözümdür. Eğer güç zorla kullanılacaksa, fikir birliği prangalarından kurtarılmalıdır."
 POL_authoritarianism_focus:0 "Otoriterlik"
 POL_baltic_alliance_focus:0 "Baltık İttifakı"
 POL_baltic_alliance_focus_desc:0 "Baltıklar, Polonya'nın düşüşünden sonra şüphesiz bir sonraki kurban olacaklar, bu yüzden üç ulusun Polonya devletine olan küçümsemelerini bir kenara bırakıp ortak sınırlarımızın her iki tarafındaki karşılıklı düşmanlarımıza karşı bizimle birlikte durmaları akıllıca olacaktır."
 POL_baltic_navy:0 "Baltık'ın Koruyucusu"
 POL_baltic_navy_desc:0 "Ablukalarımızdan kimse geçemeyecek, Polonya veya müttefiklerinin kıyılarına kimse çıkamayacak. Baltık denizi Polonya'ya aittir ve başkasına değil."
 POL_baltic_security:0 "Baltık Güvenliği"
 POL_baltic_security_desc:0 "Destek için Batı'ya güvenirken, Almanlara yapılan sürekli tavizler, bir işgal durumunda Müttefiklerin bizi savunacağından şüphe duymamıza neden oluyor. Belki de Doğu Avrupa'daki dostlarımızı kendimiz koruyarak bir miktar barışı koruyabiliriz."
 POL_baltic_ultimatums:0 "Baltık Devletlerine Ültimatom"
 POL_baltic_ultimatums_desc:0 "Litvanya halledildikten sonra, geriye kalan tek şey en kuzeydeki eski Commonwealth üyelerini büyüyen İmparatorluğumuza getirmektir. Bu kadar küçük uluslar ve bu kadar zayıf ordularla, Baltıkların ültimatomumuzu reddedebileceğinden şüpheliyiz."
 POL_ban_the_nazi_party:0 "Nazi Partisini Yasakla"
 POL_ban_the_nazi_party_desc:0 "Gdańsk halkı arasında yeterli desteği topladık ki, şehri Nazilerden resmi olarak temizleyebilir ve şehri Polonya devleti için geri alabiliriz!"
 POL_belorussian_army:0 "Belarus Ordusu"
 POL_belorussian_army_desc:0 "Belarus içinde [SOV.GetNameDef]'e karşı savaşmaya istekli çok sayıda bağımsız askeri grup var, tek yapmamız gereken onlara resmi tanınırlık vermek ve askeri liderlik sunmaktır."
 POL_camp_of_national_unity:0 "Diktatörlüğü Koru"
 POL_camp_of_national_unity_desc:0 "Sanation Solu ve Sağı artık hükûmete gerçek bir tehdit oluşturacak güce sahip değil ve geriye kalan tek şey onları resmi olarak feshetmek ve Ignacy Mościcki'nin liderliğini sürdürmek ve Polonya'yı yeni, daha parlak bir geleceğe yönlendirmektir."
 POL_central_defence_of_poland:0 "Polonya'nın Merkezi Savunması"
 POL_central_defence_of_poland_desc:0 "Polonya, sınırındaki sayısız tehdide karşı savunmak için ihtiyaç duyduğu teçhizattan yoksundur. Ulusal Savunma Bakanlığı'nı genişleterek, Polonya'yı bir işgal altında vahşileştirmek isteyen herhangi bir orduyla savaşmak için daha donanımlı olacağız."
 POL_central_defence_of_poland_idea:0 "Polonya'nın Merkezi Savunması"
 POL_central_defence_of_poland_idea_desc:0 "Bu ülke, uluslarının hızlı bir şekilde askerileştirilmesi için tahkimat ve piyade teçhizatı inşasına odaklanıyor."
 POL_central_region_strategy:0 "Merkezi Bölge Stratejisi"
 POL_central_region_strategy_desc:0 "Fabrikaları sınırlardan uzak bir şekilde merkezileştirerek, üretimimizi artırırken aynı zamanda onları olası fatihlerin elinden koruyacağız."
 POL_clamp_down_on_danzig:0 "Danzig'e Baskı Uygula"
 POL_clamp_down_on_danzig_desc:0 "Resmi olarak, Danzig Polonya koruması altında özgür bir şehirdir, ancak son zamanlarda şehir Nazi kontrolüne girdi ve adı dışında her şeyiyle Adolf Hitler'in bir kuklasıdır. Kuzey sınırımızdaki bu leke, Polonya ticaretine bir engel olmaktan başka bir şey değildir ve şehir üzerindeki kontrolümüzü yeniden sağlamalıyız, yoksa Almanlara karşı dağılma riskiyle karşı karşıya kalırız."
 POL_coastal_defense:0 "Mütevazı Modernizasyonlar"
 POL_coastal_defense_desc:0 "Küçük bir ekonomiye ve küçük bir kıyı şeridine sahibiz, bu yüzden donanmamızın modernizasyonu mütevazı olmalı. Muhripler, birinin kıyı şeridini savunmanın ucuz ve verimli bir yoludur ve onlara bağlı kalmalıyız."
 POL_codify_national_unity:0 "Ulusal Birlik Kampını Kodla"
 POL_codify_national_unity_desc:0 "Ulusal Birlik Kampı, Sanation Sağı ile Kale'nin ortak çıkarlarını temsil eder ve şu ana kadar grubun politikaları ve hedefleri belirsizdir. Ancak, milliyetçilik, yasa ve düzen ve anti-komünizm değerlerimizi cumhuriyetimizin temeline kilitlemek için Nisan Anayasasını değiştirebiliriz."
 POL_coerce_czechoslovakia:0 "Çekoslovakya'yı Savun"
 POL_coerce_czechoslovakia_desc:0 "Çekler ve Slovaklar Polonya'nın kardeşleri gibidir ve onları korumak sadece bizim en iyi çıkarımıza değil, aynı zamanda ahlaki bir zorunluluğumuzdur."
 POL_commerce_attack:0 "Ticaret Saldırısı Taktikleri"
 POL_commerce_attack_desc:0 "Hiçbir donanma denizaltısız tamamlanmış sayılmaz. Bizimkiler, filonun geri kalanı gibi, optimum ölümcüllük için organize edilmelidir."
 POL_common_organization_of_society:0 "Toplumun Ortak Organizasyonu"
 POL_common_organization_of_society_desc:0 "Sławek'in uzun zamandır hırsı BBWR'yi “Toplumun Ortak Organizasyonu” olarak adlandırdığı bir güç yapısıyla değiştirmekti. Bu yapı, Polonya'nın eyaletlerine ve kasabalarına benzersiz bir şekilde büyük yerel özerklik tanıyacak, aynı zamanda hükûmeti savaş zamanlarında yerel yönetime müdahale etmeye hazır güçlü bir otoriter rejimde merkezileştirecektir. Sol iktidardayken, Sławek nihayet hırsını gerçekleştirebilir."
 POL_common_organization_of_society_idea:0 "Toplumun Ortak Organizasyonu"
 POL_common_organization_of_society_idea_desc:0 "Walery Sławek'in uzun süredir hırsı olan Polonya, toplumsal yapısını yerel topluluklara daha büyük özerklik tanıyacak şekilde yeniden düzenledi, Başkan ise ulusal düzeyde mutlak kontrolü elinde tutuyor."
 POL_complete_april_constitution:0 "Nisan Anayasasını Tamamla"
 POL_complete_april_constitution_desc:0 "Nisan Anayasası, Polonya'yı Başkan altında daha merkezi bir otoriter rejime dönüştürmek için tasarlanmış bir dizi reformdur. Sanation hükûmeti bu mevzuatla meşrulaştırılmıştır, ancak hala eski sistemi özleyenler var. Nisan Anayasası tamamlanmalı ve [GetAppropriateLeaderNameInBookmark]'in yetkilerini daha da artırmak ve Polonya devletini merkezileştirmek için değiştirilmelidir!"
 POL_complete_plan_east:0 "Plan Doğu'yu Tamamla"
 POL_complete_plan_east_desc:0 "Polonya askeri yüksek komutanlığı, [SOV.GetAdjective] ile kaçınılmaz çatışma için yeterli planların çizildiğinden memnun ve Plan Doğu'nun zamanı sona erdi."
 POL_complete_plan_west:0 "Plan Batı'yı Tamamla"
 POL_complete_plan_west_desc:0 "Polonya askeri yüksek komutanlığı, Almanlarla kaçınılmaz çatışma için yeterli planların çizildiğinden memnun ve Plan Batı'nın zamanı sona erdi."
 POL_complete_the_plan:0 "Planı Tamamla"
 POL_complete_the_plan_desc:0 "Dört Yıllık Plan üzerine düşünme ve Polonya sanayileşmesinin sonraki dört yılı için planlar hazırlama zamanı geldi! Polonya'ya ve sanayisine ne kadar çok yatırım yaparsak, Polonya'nın endüstriyel geleceğinde gizlenenlere o kadar iyi hazırlanmış olacağız."
 POL_consolidate_sanation_government:0 "Sanation Hükûmetini Sağlamlaştır"
 POL_consolidate_sanation_government_desc:0 "Józef Piłsudski'nin ölümünden bu yana, Sanation hükûmeti parçalanmış ve düzensizdir. Hükûmet üç kola ayrılmıştır: Kale, Sanation Solu ve Sanation Sağı. Kale'nin diktatörlüğün kontrolünü sürdürüp sürdüremeyeceği belirsizdir, ancak hükûmetin yaklaşan savaş fırtınasına dayanma umudu varsa bu kararsızlık durumundan yakında çıkması gerekir."
 POL_control_the_bosporus:0 "Boğazları Kontrol Et"
 POL_control_the_bosporus_desc:0 "Eğer orduları ve donanmaları Boğaz'dan geçirme gücümüz yoksa Romen ittifakı tamamen anlamsızdır. Türkiye ulusumuz için hayati bir stratejik ilgi alanıdır ve işbirliğine ikna edilmelidirler."
 POL_cruiser_tank_experiments:0 "Kruvazör Tankı Deneyleri"
 POL_cruiser_tank_experiments_desc:0 "Tank tasarımının temelleri oturduğuna göre, şimdi mekanize tasarımın karmaşık alanında kendi yolumuzu çizmeye hazırız."
 POL_defensive_focus:0 "Savunma Odağı"
 POL_defensive_focus_desc:0 "Bir sonraki savaşı biz başlatmayacağız, ama bitireceğimizden emin olacağız."
 POL_department_for_home_defence:0 "Anavatan Savunma Departmanı"
 POL_department_for_home_defence_desc:0 "Polonya uzun zamandır sınırlarımızın her iki tarafındaki düşmanlara karşı savunmak için ihtiyaç duyduğu anavatan savunmasından yoksundu. Anavatan Savunma Departmanı'nı kurarak, devletimizi savunmak için gerekli savaş yöntemlerinde ustalaşacağız."
 POL_develop_gdansk_ship_building:0 "Gdańsk Gemi İnşaatını Geliştir"
 POL_develop_gdansk_ship_building_desc:0 "Şimdi Gdańsk yeniden kontrolümüz altında olduğuna göre, ona Polonya'nın ihtiyaç duyduğu muazzam baltık donanmasını inşa etmeye başlamak için umutsuzca ihtiyaç duyduğu donanma yatırımlarını yapabiliriz!"
 POL_develop_polish_ship_building:0 "Polonya Gemi İnşaatını Geliştir"
 POL_develop_polish_ship_building_desc:0 "Danzig, Nazi partisinin iğrenç rejimine umutsuzca kaybedildi ve Polonya ticareti, Nazilerin ekonomimiz üzerinde uyguladığı etkili ambargoyu atlatmanın bir yolunu bulmalı. Gdańsk'ı asla geri alamayabiliriz, ama belki Gdynia'yı Gdańsk ile görkem açısından rekabet edebilecek büyük bir liman haline getirebiliriz."
 POL_develop_upper_silesia:0 "Yukarı Silezya'yı Geliştir"
 POL_develop_upper_silesia_desc:0 "Silezya'nın sadece küçük bir bölgesini kontrol ediyoruz, ancak sahip olduğumuz bu bölge büyük bir endüstriyel öneme sahip. Silezya, ulusumuzun en yoğun sanayileşmiş bölgelerinden biridir ve küçük bir yatırımla, tüm ulusumuzun daha fazla sanayileşmesini desteklemeye devam edebilir."
 POL_dissolve_the_bbwr:0 "Kaledeki Yeni Kral"
 POL_dissolve_the_bbwr_desc:0 "Sol, Diktatörlük içinde o kadar etkili ve güçlü hale geldi ki, Mościcki'nin Başkan unvanı en iyi ihtimalle tamamen sembolik görünüyor. Geriye kalan tek şey bunu resmi hale getirmek ve Kale'nin tüm izlerini hükûmetten dağıtmak, Sławek'i devletteki gücün yüce zirvesine çıkarmaktır."
 POL_dissolve_the_sejm:0 "Sejm'i Feshet"
 POL_dissolve_the_sejm_desc:0 "Sejm, Sanation hükûmeti altında Polonya'nın bir zamanlar benimsediği demokrasinin sadece bir simgesi olarak var olmaya devam etti. Ancak şimdi Sejm'i tüm yetkilerinden arındırma ve tüm gücü Senato'ya ve Kale'nin Senatörlerine verme zamanı geldi."
 POL_draft_a_new_constitution:0 "Yeni bir Anayasa Taslağı Hazırla"
 POL_draft_a_new_constitution_desc:0 "Sławek'in uzun zamandır hırsı Polonya anayasasını değiştirmekti ve bunu yapma hakkı verilirse bize Polonya devleti üzerinde daha doğrudan kontrol sağlayabilir ve Nisan Anayasasını daha da iyileştirebilir."
 POL_draw_closer_to_britain:0 "Britanya'ya Yaklaş"
 POL_draw_closer_to_britain_desc:0 "İngilizler, saldırganlara karşı bağımsızlığımızı korumayı taahhüt ettiler. Gerekli takdir jestlerini yapmalıyız."
 POL_eastern_conscription_idea:0 "Doğu Askerliği"
 POL_eastern_conscription_idea_desc:0 "Doğu Polonya'da yaşayanlar, bir savaş durumunda [SOV.GetNameDef] ile savaşmak için hızla eğitiliyor."
 POL_eastern_conscripts:0 "Doğu Askerleri"
 POL_eastern_conscripts_desc:0 "Doğu Polonya'daki birçok kişi kendilerini Polonyalıdan çok Ukraynalı veya Belaruslu olarak tanımlıyor, ama yine de savaşmaya ikna edilmeliler! Polonya için savaşacak pek az kişi bulabilsek de, aralarında [SOV.GetAdjective]lere karşı hevesle bir tüfek alacak sayısız kişi var!"
 POL_edward_rydz_smigly_chairman:0 "Askeri Başkan"
 POL_eliminate_socialist_parties:0 "Sosyalist Partileri Tasfiye Et"
 POL_eliminate_socialist_parties_desc:0 "Sosyalizm, hızla dünyayı saran bir ideolojidir, ancak Kale hükûmetinin idealleriyle temelde uyumsuzdur. Sol, bize hem tarımcı hem de sosyal-demokrat partiler şeklinde ve hain komünist partiler şeklinde karşı çıkıyor. Her türlü sosyalizm kabul edilmemeli ve Polonya devletinin devam eden istikrarı ve güvenliği adına tüm sosyal partiler yasaklanmalıdır."
 POL_exile_industries:0 "Sürgün Sanayileri"
 POL_exile_industries_desc:0 "Ev uzak bir anı haline gelirken, sürgün üretim üssümüze daha fazla geliştirme yaparak geri dönüşümüze hazırlanmak için çalışmalıyız."
 POL_expand_central_industrial_region:0 "Galiçya Sanayisini Modernize Et"
 POL_expand_central_industrial_region_desc:0 "Galiçya, tıpkı Kraków gibi, bir zamanlar Avusturyalılar tarafından tutulmuş ve ihmal edilmişti, ancak şimdi yeniden Polonya'nın elinde olduğuna göre, ona umutsuzca ihtiyaç duyduğu modernizasyon yatırımlarını yapabiliriz."
 POL_expand_gdynia_seaport:0 "Gdynia Limanını Genişlet"
 POL_expand_gdynia_seaport_desc:0 "Şimdi Gdynia, Danzig ile rekabet edebilecek büyük bir ticaret şehrine dönüştürüldüğüne göre, geriye kalan tek şey şehri resmi olarak ticarete açmak ve ekonomimiz bir kez daha bizim ve sadece bizim kontrolümüzde olacak!"
 POL_expand_intelligence_idea:0 "Polonya İstihbaratının Genişletilmesi"
 POL_expand_intelligence_idea_desc:0 "Anavatan kaybedildiğinde, Polonya ancak direniş hareketlerini destekleyerek ve düşmanlarını gizli operatiflerle doldurarak bağımsızlığını yeniden kazanmayı umabilir."
 POL_expand_katowice_mines:0 "Katowice Kaynaklarını Genişlet"
 POL_expand_katowice_mines_desc:0 "Nispeten küçük boyutuna rağmen, Yukarı Silezya bir çelik ve alüminyum hazinesidir. İdeal olan tüm Silezya'yı kontrol etmek olsa da, şimdilik Yukarı Silezya sanayilerini sonuna kadar sömürmeliyiz."
 POL_expand_northern_rail:0 "Kuzey Demiryolunu Genişlet"
 POL_expand_northern_rail_desc:0 "Tüm Polonya malları Kuzey'den girip çıkmalı, ancak oradaki altyapı olabileceğinden çok uzak. Kuzey'e uygun demiryolu altyapısı verilmelidir."
 POL_expand_polish_intelligence:0 "Polonya İstihbaratını Genişlet"
 POL_expand_polish_intelligence_desc:0 "Ordularımız paramparça olmuş, yenilmiş ve yeraltına çekilmek zorunda kalmışken, Polonya mücadeleyi gölgelerden sürdürmek zorunda. Eve dönme umudunun en ufak bir kırıntısı bile olacaksa, Polonya istihbaratının hızla genişlemesine öncelik vermeliyiz."
 POL_expand_polish_intelligence_no_mtg:0 "$POL_expand_polish_intelligence$"
 POL_expand_polish_intelligence_no_mtg_desc:0 "$POL_expand_polish_intelligence_desc$"
 POL_expand_poznan_forts:0 "Poznań Kalelerini Genişlet"
 POL_expand_poznan_forts_desc:0 "Poznań zaten çok sayıda sığınak ve kilit savunma yapısına ev sahipliği yapıyor, ancak iyileştirme için çok yer var. Poznań, düşmana karşı ilk savunma hattıdır ve bedeli ne olursa olsun savunulmalıdır."
 POL_expansion_of_new_towns:0 "Yeni Polonya Sanayisi"
 POL_expansion_of_new_towns_desc:0 "Batı şimdi Almanlardan geri alındığına göre, Gdynia gibi hızla Varşova ile görkem açısından rekabet etmeye başlayan şehirlerdeki gelişen endüstrileri geliştirmeliyiz."
 POL_fighter_modernisation:0 "Avcı Modernizasyonu"
 POL_fighter_modernisation_desc:0 "Herhangi bir hava kuvvetinin temel direği olan avcı uçaklarımız demode hale getirilmemelidir. Hava kuvvetlerimizin geri kalanı geliştikçe, onlar da gelişmelidir."
 POL_fill_the_railways_gaps:0 "Demiryolu Boşluklarını Doldur"
 POL_fill_the_railways_gaps_desc:0 "Polonya bir zamanlar üç güç arasında bölünmüştü ve bu nedenle demiryolu ağlarımız uzak ve bağlantısızdır. Polonya'yı ihtiyaç duyduğumuz merkezi sanayi haline getireceksek, bu üç ayrı demiryolu hattını birleştirmeliyiz!"
 POL_finno_polish_pact:0 "Fin-Polonya Paktı"
 POL_finno_polish_pact_desc:0 "Finler de bizimle benzer bir durumda; uluslarının bir kez daha bir imparatorluğa boyun eğdiğini görmekten başka bir şey istemeyen [SOV.GetAdjective]lerle sınırda sıkışıp kalmışlar. Bu, Finlandiya'yı İskandinav ülkelerine ilk Międzymorze genişlemesi için ideal bir aday yapıyor."
 POL_foreign_air_support:0 "Yabancı Hava Desteği"
 POL_foreign_air_support_desc:0 "Müttefiklerimizin yardımıyla, henüz güçlü bir Polonya hava kuvveti kurabiliriz. Fabrikalar ve teçhizat satın almak, sürgündeki Polonya hava kuvvetlerinin sadece başlangıcıdır!"
 POL_foreign_army_support:0 "Yabancı Ordu Desteği"
 POL_foreign_army_support_desc:0 "Polonya'dan her gün saflarımıza hizmet etmek için gelen mültecilerle, onlara sadece bir tüfek vermemiz yeterli ve onlar ev vaadi için herhangi bir dağa hücum etmeye hazır olacaklar. Tek yapmamız gereken, müttefiklerimizin sanayisinin daha fazla kontrolünü talep etmek."
 POL_foreign_naval_support:0 "Yabancı Donanma Desteği"
 POL_foreign_naval_support_desc:0 "Donanmamızdan geriye kalan az şey üzücü bir durumda. Onu eski ihtişamına asla geri getiremesek de, sponsorlarımızdan gelen destek Polonyalı denizcilere denizde dostlarımıza yardım etme imkanı verebilir."
 POL_fortification_of_belarus:0 "Kuzeyin Tahkimatı"
 POL_fortification_of_belarus_desc:0 "Doğu Polonya'nın kuzey tarafı, aralarında neredeyse hiç medeniyet izi olmayan bir dizi sık ormandan başka bir şey değildir. Bir işgal durumunda bu böyle devam edemez; bu ormanlar Bolşevizme karşı bir kalkana dönüştürülmelidir!"
 POL_fortification_of_ukraine:0 "Ukrayna'nın Tahkimatı"
 POL_fortification_of_ukraine_desc:0 "Doğu az gelişmiş ve tarımsaldır ve Polonya Ukraynası, Polonya'nın güneyinde bir işgale hazır yumuşak bir nokta olarak kalır. Eğer ulusumuzu güvende tutacaksak, sınır boyunca bazı temel tahkimatlar inşa edilmelidir!"
 POL_four_year_plan_complete_1:0 "Dört Yıllık Plan"
 POL_four_year_plan_complete_2:0 "Dört Yıllık Plan"
 POL_four_year_plan_complete_3:0 "Dört Yıllık Plan"
 POL_four_year_plan_complete_4:0 "Dört Yıllık Plan"
 POL_four_year_plan_idea:0 "Dört Yıllık Plan"
 POL_four_year_plan_idea_desc:0 "Bu ülke, ülke genelinde kitlesel sanayileşme çabaları gösterdi."
 POL_go_left:0 "Sola Yönel"
 POL_go_left_desc:0 "Ancak halkımızı birleştirerek bizi tüketmekle tehdit eden düşmanlara karşı galip gelebiliriz."
 POL_go_right:0 "Sağa Yönel"
 POL_go_right_desc:0 "Güç, peşinde koşulmaya değer tek niteliktir. Komşularımız bu gerçeği benimsedi ve biz de öyle yapmalıyız."
 POL_great_peasants_strike:0 "Köylü Grevi"
 POL_great_peasants_strike_desc:0 "Hükûmetin eylemsizliği kırsalda kitlesel protestolara yol açtı! Polis eylemi zaten protestocuları daha da kışkırtmak ve marjinalleştirmekten başka bir işe yaramıyor ve eğer hızlı bir şekilde harekete geçilmezse, bu kitlesel protestolar tam ölçekli bir iç savaşa dönüşebilir."
 POL_heavy_fighter_concept:0 "Ağır Avcı Konsepti"
 POL_heavy_fighter_concept_desc:0 "Eğer taarruza geçmek zorunda kalırsak, düşman sınırları içinde uzun süre faaliyet gösterebilecek yeni bir tür avcı uçağına ihtiyacımız var."
 POL_hel_fortified_area:0 "Hel Müstahkem Alanı"
 POL_hel_fortified_area_desc:0 "Kilit alanları tahkim ederek, savaş tekrar kıyılarımıza ve sınırlarımıza gelirse kendimizi daha az savunmasız hale getiririz."
 POL_ideological_fanaticism:0 "Milliyetçi Eğitim"
 POL_ideological_fanaticism_desc:0 "Ülke genelindeki üniversitelerde sayısız genç beyin okuyor ve inşa ettiğimiz Polonya'nın ideallerini onların zihinlerine yerleştirmek için altın bir fırsatı kaçırıyoruz. Gençler vatansever, savaşçı ve Polonya ideallerinin siperleri olmaya teşvik edilmelidir!"
 POL_import_submarine_technology:0 "ORP Orzeł"
 POL_import_submarine_technology_desc:0 "Modern deniz savaşı hem dalgaların üstünde hem de altında kazanılır ve eğer Almanya'nın U-botlarıyla rekabet etmek istiyorsak, orijinal Polonya denizaltıları tasarlamalı ve dağıtmalıyız."
 POL_integrate_gdansk_industries:0 "Gdańsk Sanayilerini Entegre Et"
 POL_integrate_gdansk_industries_desc:0 "Onlarca yıldır Gdańsk ulusun geri kalanından ayrılmıştı, ama artık değil! Gdańsk'ı yönetimimize entegre ederek, ihracat ve ithalatımızın kontrolünü geri alabileceğiz!"
 POL_internationalism:0 "Enternasyonalizm"
 POL_internationalism_desc:0 "Düşmanlarımızın düşmanları bizim dostumuz olabilir."
 POL_internationalism_focus:0 "Enternasyonalizm"
 POL_intervention_focus:0 "Müdahale Odağı"
 POL_intervention_focus_desc:0 "Eğer özgürlüğe değer veriyorsak, onu sadece bizim için değil, her yerdeki uluslar için de korumalıyız. Eğer bu savaş anlamına geliyorsa, öyle olsun!"
 POL_invest_anti_air:0 "Uçaksavara Yatırım Yap"
 POL_invest_anti_air_desc:0 "Havada Almanları üretimde geçmemiz pek olası değil, ancak bunun yerine karada uçaksavar silahları inşa etmeye yoğun bir şekilde yatırım yaparsak onlardan sayıca üstün olmamıza gerek kalmaz. Her eyalette Bofors ile, Alman pilotlar silahlarımızla karşılaşmadan çok uzağa gidemeyecekler."
 POL_invest_in_eastern_poland:0 "Doğu Polonya'ya Yatırım Yap"
 POL_invest_in_eastern_poland_desc:0 "Doğu, hem Ruslar hem de Polonya devleti tarafından tamamen ihmal edilmiş, çorak ve ıssız bir yerdir. Fabrikalar için çok sayıda ideal yer ve eğer böyle şeylere yatırım yapmayı seçersek, onları işletecek bol miktarda adam var."
 POL_invest_in_the_old_polish_region:0 "Eski Polonya Bölgesine Yatırım Yap"
 POL_invest_in_the_old_polish_region_desc:0 "Kielce, Skarżysko, Radom, Starachowice ve Ostrowiec'teki eski fabrikaları modernize ederken, sanayimizi güçlendirmek için yenilerini de inşa edeceğiz."
 POL_invite_denmark:0 "Danimarka'yı Davet Et"
 POL_invite_denmark_desc:0 "Küçük bir güç olmalarına rağmen, Danimarkalılar Baltık'ta kilit bir stratejik bölge olan Danimarka boğazlarını kontrol ediyor. Danimarkalıları ittifakımıza hizalayarak, Baltık'a giriş ve çıkış erişimini güvence altına alacağız. Sadece Danimarkalıların hayatta kalacağına güvenilmelidir."
 POL_invite_greece:0 "Yunanistan'ı Davet Et"
 POL_invite_greece_desc:0 "Yunanistan ile Türkiye arasındaki gerilim güçlü kalmaya devam ediyor ve ufukta potansiyel bir İtalyan işgaliyle, Yunanlılar şüphesiz korumamızdan faydalanabilir."
 POL_invite_norway:0 "Norveç'i Davet Et"
 POL_invite_norway_desc:0 "Almanların Norveç için hırsları ve tasarımları olduğu bir sır değil ve ulusları içinde bu yabancı işgalcilerle işbirliği yapmaya hazır adamlar zaten var. Intermarium'a bir davet uzatarak, Norveçlilere Alman saldırganlığına boyun eğmeden direnme eşsiz fırsatını sunuyoruz."
 POL_invite_sweden:0 "İsveç'i Davet Et"
 POL_invite_sweden_desc:0 "İsveçliler, bu artan çatışma zamanlarında ilginç bir tarafsızlık kavramına sahipler. Belki de dışişleri bakanlarını, Intermarium'un dünyadaki tüm ittifakların en tarafsızı olduğuna ve bu karşılıklı savunma teklifinin dünya güçlerinden doğrudan müdahaleyi caydırmak için en iyi şansları olduğuna ikna edebiliriz."
 POL_invite_to_faction_tooltip:0 "[Root.GetFlag]§Y[Root.GetName]§!'in ittifakına davet edilir.\n"
 POL_italian_alliance:0 "İtalyan İttifakı"
 POL_italian_alliance_desc:0 "İtalyan hükûmeti, Międzymorze'nin temsil ettiği kendi kaderini tayin etme ideallerinin bir düşmanı olduğunu sır olarak saklamadı, ancak hem Polonya hem de İtalyan iç hükûmetlerinde uygun değişikliklerle, onları Avrupa'nın geleceği için vizyonumuzla hizalayabiliriz."
 POL_join_allies:0 "Müttefiklere Katıl"
 POL_join_allies_desc:0 "[Root.GetNameDef]'in geleceği Batı'daki eski müttefiklerimizin elindedir. Zaten Müttefiklerle bağlantılı olsak da, onlara resmi olarak katılmak Batı'ya olan bağlılığımızı ve umarım Batı'nın da Polonya'ya olan bağlılığını teyit edecektir."
 POL_legion_of_merit:0 "Liyakat Lejyonu"
 POL_legion_of_merit_desc:0 "Walery Sławek'in bir konsepti olan Liyakat Lejyonu, devlete olağanüstü fayda sağladığını kanıtlamış olan cumhuriyetin herhangi bir vatandaşına ayrıcalıklı bir konum kazandıracaktır. Ödül, bireye senatoda bir pozisyon garanti edecek ve Lejyona davet edilen herhangi bir bireyin rejimden hoşnutsuz olma nedeni kesinlikle pek kalmayacaktır."
 POL_liberalism_focus:0 "Liberalizm"
 POL_liberalism_focus_desc:0 "Despotların ve diktatörlerin seviyesine inmeyeceğiz. Bir devletin halkına hizmet ettiğini ve tersinin olmadığını asla unutmayın."
 POL_light_bomber_focus:0 "Hafif Bombardıman Uçağı Odağı"
 POL_light_bomber_focus_desc:0 "Yakın hava desteği için pike bombardıman uçakları kullanmanın değeri küçümsenmemelidir."
 POL_lithuanian_alliance:0 "Litvanya İttifakı"
 POL_lithuanian_alliance_desc:0 "Kuzeydeki eski düşmanlarımızla barış yaptık, ama şimdi birlikte dost olarak ilerlemeyi öğrenmeliyiz. Düşmanlarımız ve müttefiklerimiz ortaktır, bu yüzden Litvanyalıların da bizimle aynı güçlerle hizalanması doğaldır."
 POL_lithuanian_annexation:0 "Litvanya'nın İlhakını Talep Et"
 POL_lithuanian_annexation_desc:0 "Almanya'nın Avusturya'yı Anschluss'u ile, eski birliklerin sadece biraz saldırganlıkla istenirse restore edilebileceği açıkça ortaya çıktı. Belki de Litvanyalılara daha büyük ve daha güçlü bir devlette çok daha güvende olacaklarını önerebiliriz… Örneğin Polonya'da."
 POL_lithuanian_ultimatum:0 "Litvanya Ültimatomu"
 POL_lithuanian_ultimatum_desc:0 "Yıllardır, Vilnius'un ilhakından bu yana kimse saldırgan bir eylemde bulunmasa da, Litvanyalılarla resmen bir savaş halindeyiz. Almanya'nın kıta genelinde sadece savaş tehdidiyle istediğini alarak fırtına gibi esmesiyle, belki de Litvanya için aynısını yapabiliriz; her iki ulusumuzun selameti için bu düşmanlıklara bir son verilmesini talep ederek."
 POL_local_eastern_plans:0 "Yerel Doğu Planları"
 POL_local_eastern_plans_desc:0 "Genellikle kendi askeri personelimize kendi aralarında planlar hazırlamaları için güvenilebilir, ancak böyle bir savaşta, küçük ölçekte doğrudan müdahale gereklidir. Her karış toprak önemlidir ve eğer [SOV.GetAdjective] emperyalizmini durduracaksak, en küçük çatışmalara bile uzmanlığımızı uygulamalıyız!"
 POL_local_western_plans:0 "Yerel Batı Planları"
 POL_local_western_plans_desc:0 "Polonya-Alman sınırı boyunca kilit stratejik bölgeler var. Tamamen yerel düzeyde kapsamlı planlar hazırlamak ve bunları doğru zamanda uygulamak, Polonya devletinin devam eden hayatta kalması için daha büyük savaş planlarımız kadar gereklidir."
 POL_looming_peasants_strike:0 "Yaklaşan Köylü Grevi"
 POL_looming_peasants_strike_desc:0 "Doğu Polonya'nın büyük yoksulluk koşullarına karşı tamamen eylemsiz kalınmasından öfkelenen, Polonya için ufukta bir Köylü Grevi var. Eğer yıl sonuna kadar ele alınmazsa, Polonya ülke genelinde bilinmeyen düzeylerde sivil huzursuzluk riskiyle karşı karşıya."
 POL_medium_bomber_focus:0 "Orta Bombardıman Uçağı Odağı"
 POL_medium_bomber_focus_desc:0 "Destek rollerinde kullanılmak üzere genişletilmiş menzil için uyarlanmış hassas bombalama felsefesinin bir uzantısı."
 POL_militarism_focus:0 "Polonya Militarizmi"
 POL_military_youth:0 "Askeri Gençlik"
 POL_military_youth_desc:0 "Gençlerimizi disiplin ve ulusal ideolojiyi teşvik eden örgütlere kaydettirmek, gelecekteki sadık bir acemi nesli yetiştirecektir."
 POL_modernising_the_cavalry:0 "Süvariyi Modernize Etme"
 POL_modernising_the_cavalry_desc:0 "Süvarinin hala oynayacağı bir rol olsa da, modern savaş alanında rekabet edebilmesi için yeni metal binekler gerekiyor."
 POL_modernize_congressional_factories:0 "Kongre Fabrikalarını Modernize Et"
 POL_modernize_congressional_factories_desc:0 "Kongre Polonyası, ulusumuzun en büyük ve en birleşik bölgesiydi ve tüm Polonya'da en büyük büyüme potansiyeline sahip. Varşova gibi büyük şehirleri modernize ederek, Kongre Polonyası'nı ulusumuzun sanayi kalbi haline getireceğiz."
 POL_modus_vivendi:0 "Modus Vivendi"
 POL_modus_vivendi_desc:0 "Sanation Solu, devletimiz içindeki muhalefetle uzlaşma arar; onlara hükûmet içinde güç koltukları verir. Muhalefet üyelerine uygun temsil verildiğinde, artık Diktatörlüğe karşı çıkmaya çalışmayabilirler."
 POL_national_defence_fund:0 "Ulusal Savunma Fonu"
 POL_national_defence_fund_desc:0 "Vatandaşlar ve devlet, gelecek yılların tehlikelerine hazırlanmak için büyüyen sanayimizin finansmanına katkıda bulunmalıdır."
 POL_national_defence_fund_idea:0 "Ulusal Savunma Fonu"
 POL_national_defence_fund_idea_desc:0 "Polonya, ulusunun ulusal savunmasına önemli yatırımlar yaptı ve sivil sektörden varlıkları askeri için yararlı yapıların inşasında kullanmak üzere tahsis etti."
 POL_naval_bomber_experiments:0 "Donanma Bombardıman Uçağı Deneyleri"
 POL_naval_bomber_experiments_desc:0 "Hava üstünlüğü denizde de karadaki kadar önemlidir. Donanma savaşı amacıyla geliştirilen özel uçaklar, bu amaca ulaşmanın bir yoludur."
 POL_new_military_academy:0 "Yeni Askeri Akademi"
 POL_new_military_academy_desc:0 "Yüksek komutamız çorak ve boş yatıyor, ancak bu gelecek için tohumları ekmek için altın bir fırsat bırakıyor; gelecekteki generallerin ulusumuza sadık ve savaş sanatında yüksek eğitimli olmasını sağlamak. Ülke genelinde askeri akademileri finanse ederek, herhangi bir yeni Polonyalı subayın seleflerinden daha yüksek kalibreli olmasını sağlayacağız."
 POL_new_military_academy_idea:0 "Yeni Askeri Akademi"
 POL_ozon:0 "OZN'nin Zaferi"
 POL_ozon_desc:0 "Anlaşma, Mościcki'nin savaş zamanlarında koltuğunu teslim etmesi olsa da, sınırımızdaki tehditlerin karşı durabileceğimizden daha fazla olduğu ve savaşın ufukta olduğu açıktır. Śmigły'nin ulusun tam kontrolünü elinde tutmasıyla, askeri ve sivil hükûmetlerimiz bir olacak ve Polonya egemenliğini tehdit eden her kim olursa olsun savaşmaya hazır olacağız."
 POL_pan_slavic_revanchism:0 "Pan-Slav Revanchizmi"
 POL_pan_slavic_revanchism_desc:0 "Pan-Slav hareketi şimdiye kadar Rusların tüm Slavlar üzerinde hegemonya iddia etmeleri için kullanışlı bir araçtan biraz daha fazlasıydı, ancak aynı zamanda Yugoslavya ve Çekoslovakya gibi dağınık Slav halklarını birleşik devletlerde birleştirmede de yararlı oldu. O zaman Polonya neden bir istisna olsun ki? Polonya da bu Pan-Slavizm dalgasından yararlanmamalı mı?"
 POL_paramilitarism:0 "Paramilitarizm"
 POL_paramilitarism_desc:0 "Askeri ilkelerin askeri alan dışında uygulamaları vardır. Toplumun her kesimi bu disiplinlerde eğitildiğinde, her vatandaş bir an önce silahlanabilecektir."
 POL_plan_east:0 "Plan Doğu"
 POL_plan_east_desc:0 "Yüzyıllardır Ruslarla askeri çatışma içinde girip çıktık ve [SOV.GetLeader]'in, [SOV.GetLeader.GetHerHis] selefleri gibi Polonya'yı işgal etmeye çalışacağını güvenle varsayabiliriz. Bu sefer başarılı olmamalılar, Polonya'nın [SOV.GetNameDef] üzerinde kesin bir zaferini sağlamak için planlar çizilmelidir!"
 POL_plan_west:0 "Plan Batı"
 POL_plan_west_desc:0 "Mihver ensemizde soluyor. Hükûmet içindeki bazıları [GER.GetLeader] ile ilişkimizin samimi olduğuna inansa da, Almanlara güvenilemeyeceğini biliyoruz ve Polonya'nın geleceğini güvence altına almak için batıda kapsamlı planlar gereklidir."
 POL_poland_first:0 "Önce Polonya"
 POL_poland_first_desc:0 "Ulusun iyiliği sözde \"gerçekler\"den önce gelmelidir. Kendi kaderimizi şekillendirdiğimiz gibi, kendi gerçeklerimizi de oluşturmalıyız."
 POL_polish_militarism:0 "Polonya Militarizmi"
 POL_polish_militarism_desc:0 "Önceki savaşlar bizi eğmiş olabilir, ama yenilmedik. Askerlerimizin cesareti ve subaylarımızın kurnazlığıyla yeniden yükseleceğiz."
 POL_polish_revanchism:0 "Polonya Revanchizmi"
 POL_polish_revanchism_desc:0 "Pek az ulus bu kadar kısa sürede bu kadar çok şey kaybetti. Eğer adalet varsa, bir şekilde onu geri alacağız."
 POL_polish_revanchism_focus:0 "Polonya Revanchizmi"
 POL_political_commissars:0 "Siyasi Komiserler"
 POL_political_commissars_desc:0 "Ordunun kontrolünü sürdürmek için, ordunun parti politikalarına uymasını sağlamak üzere siyasi subaylar atanacaktır."
 POL_pomscimy_wawer:0 "Pomścimy Wawer"
 POL_pomscimy_wawer_desc:0 "Varşova sokaklarından bize, direnişin düşmana karşı cesur bir hamle hazırladığı fısıltıları geliyor. Şehrin her yerinde, duvarlar düşmana intikamımızı alacağımızı vaat eden ürkütücü sözlerle süslenmiş. Zor olacak, ama bu ayaklanma henüz nihayet eve dönüp düşmana karşı saldırıya geçmek için ihtiyacımız olan itme olabilir, tek gereken Polonya yüksek komutanlığından biraz organizasyon ve henüz başarılı olabilirler…"
 POL_prepare_for_the_inevitable:0 "Kaçınılmaz Olana Hazırlan"
 POL_prepare_for_the_inevitable_desc:0 "Dayanabildiğimiz kadar dayandık, ama kaybettiklerimizle, yenilgiyi kabul etme zamanı geldi. Polonya gitti, ama Polonya ruhu yaşıyor ve sürgünde bile avlanmaya devam ediyor. Müttefiklerimizden yeterli destekle, bir sürgünler ordusu kurabilir, evde hala direnen yoldaşlarımızı destekleyebilir ve düşman saflarını Polonya'ya sadık erkekler ve kadınlarla doldurabiliriz."
 POL_prepare_for_the_next_war:0 "Bir Sonraki Savaşa Hazırlan"
 POL_prepare_for_the_next_war_desc:0 "Büyük Savaş, türünün sadece ilki olabilir. Kesinlikle sürekli değişen bir savaş alanına hazırlanmalıyız."
 POL_promote_chemical_industry:0 "Kimya Sanayisini Destekle"
 POL_promote_chemical_industry_desc:0 "Sanation hükûmetinin günlerinden önce, Ignacy Mościcki bir entelektüel ve bir kimyagerdi. Şimdi, Polonya devletinin başında olan Mościcki, kimya sanayisini ve onun çalışmasını destekleyebilecek bir konumda duruyor."
 POL_protect_czechozlovakia:0 "Çekoslovakya'yı Koru"
 POL_protect_czechozlovakia_desc:0 "[GER.GetLeader]'in, Çekoslovakya'nın kaderi için [GER.GetLeader.GetHerHis] kendi planı olduğu açıkça ortaya çıktı; bu plan Çekoslovakyalıları bağımsızlıklarından mahrum bırakacak. Bu emperyalizm dalgası durdurulmalıdır."
 POL_protect_yugoslavia:0 "Yugoslavya'yı Koru"
 POL_protect_yugoslavia_desc:0 "Yugoslavya üzücü bir durumda ve neredeyse tüm komşuları tarafından işgal için birinci hedef. Onları hem sınırları içindeki hem de dışındaki tehditlerden korunmak için Międzymorze'ye davet etmeliyiz."
 POL_purge_the_sanation:0 "Sanation'ı Tasfiye Et"
 POL_purge_the_sanation_desc:0 "Sanation generalleri dönek ve sadakatsizdir ve Polonya'dan çok kendilerine bağlılıkları olduğunu kanıtladılar! Yüksek komutamızı Sanation darbesine karışan tüm generallerden temizlemeliyiz!"
 POL_push_home_idea:0 "Eve Uzun Yürüyüş"
 POL_push_home_idea_desc:0 "Anavatanı sızmak ve yeniden ele geçirmek için hazırlıklar yapıldı, geriye kalan tek şey müttefiklerimiz gelene ve Polonya bizim olana kadar onu sıkı bir şekilde Polonya kontrolü altında tutmaktır."
 POL_resistance_industries:0 "Direniş Sanayileri"
 POL_resistance_industries_desc:0 "Anavatan kaybedilmiş olsa da, Polonya istihbaratını genişletmek ve düşmandan geri aldığımız her karış toprağı geliştirmek için hala güçlü bir sanayi tabanına ihtiyacımız var."
 POL_restore_the_sejm:0 "Sejm'i Restore Et"
 POL_restore_the_sejm_desc:0 "Nisan Anayasasını uygulamak, hızla düzeltilmesi gereken bariz bir hataydı. Güç Sejm'e iade edilmeli ve oradan ulusumuzun geleceğine demokratik yollarla karar vermeliyiz."
 POL_right_paramilitarism_idea:0 "Związek Młodej Polski"
 POL_right_paramilitarism_idea_desc:0 "Polonya Askeri Gençliği, Edward Rydz-Śmigły tarafından kurulan ve etkili Falanjist Jerzy Rutkowski tarafından işletilen bir örgüttür. Örgüt resmi olarak bir askeri gençlik kurmak için var olsa da, program etkili bir şekilde genç erkeklerin yoğrulabilir zihinlerine faşist idealler aşılamaktadır."
 POL_rocket_development:0 "Roket Geliştirme"
 POL_rocket_development_desc:0 "Hız, diğer tüm hava niteliklerinin dayandığı özelliktir. Roket ve jet motorları teorik olarak önceki tüm sınırları geçmemize izin verebilir."
 POL_romanian_alliance:0 "Romen İttifakı"
 POL_romanian_alliance_desc:0 "Romenlerle uzun süredir devam eden bir ittifakımız var, denizler arasında bir ittifak ve tarihsel olarak bu çok az anlam ifade etse de, Romenlere ittifakımıza katılmaları için resmi bir davet uzatma ve Intermarium hırsını gerçekleştirme zamanı geldi."
 POL_romanian_bridgehead_strategy:0 "Romen Köprübaşı Stratejisi"
 POL_romanian_bridgehead_strategy_desc:0 "Eğer savaş aleyhimize dönerse, dostlarımız ve müttefiklerimizle uyum içinde etkili bir şekilde yeniden toplanma ve misilleme yapmak için planlarımız olmalıdır."
 POL_ruthenian_army:0 "Ruten Ordusu"
 POL_ruthenian_army_desc:0 "Polonyalılar ve Ukraynalılar arasında, Doğu'da anti-[SOV.GetAdjective] duyarlılığı elle tutulur düzeydedir. Finansman ve askeri liderlikle, bu paramiliterler ordularımıza büyük katkılar sağlayacaktır."
 POL_sabotage_polish_industry:0 "Polonya Sanayisini Sabote Et"
 POL_sabotage_polish_industry_desc:0 "Düşmanlarımız bizimkinden çok daha güçlü ve daha fazla sayıda orduya sahip. Zemin kaybetmeyeceğimiz fikrini eğlendirmek güzel olsa da, gerçek şu ki sonsuza kadar dayanamayız. Ancak fabrikalarımızı ve demiryollarımızı patlayıcılarla donatarak, bir işgal durumunda onları düşmanlarımız için kullanılamaz hale getirebiliriz."
 POL_san_left_desc:0 "Reform destekçileri olan Sanation Solu, Walery Sławek'in önceki diktatör Józef Piłsudski'nin gerçek halefi olduğuna inanıyor."
 POL_san_right_desc:0 "Hükûmetin sağ kanadı, büyük ölçüde Edward Rydz-Śmigły'nin arkasında birleşmiş güçlü askeri personelden oluşur."
 POL_sanation_left_opposition_1:0 "Düşük Sanation Solu Muhalefeti"
 POL_sanation_left_opposition_1_desc:0 "[Root.GetLeftDesc] Şu anda, Sanation Solu Diktatörlüğe çok marjinal bir tehdittir ve rejimin istikrarını tehdit edecek bir konumda değildir."
 POL_sanation_left_opposition_2:0 "Orta Sanation Solu Muhalefeti"
 POL_sanation_left_opposition_2_desc:0 "[Root.GetLeftDesc] Şu anda, Sanation Solu Diktatörlükte güç kazanıyor ve sivil sektördeki günlük siyasi operasyonlarımızı bozma yeteneğine sahip."
 POL_sanation_left_opposition_3:0 "Yüksek Sanation Solu Muhalefeti"
 POL_sanation_left_opposition_3_desc:0 "[Root.GetLeftDesc] Şu anda, Sanation Solu çok güçlü ve isterlerse sivil sektörümüzü tamamen durma noktasına getirme gücüne sahip."
 POL_sanation_left_opposition_4:0 "Çok Yüksek Sanation Solu Muhalefeti"
 POL_sanation_left_opposition_4_desc:0 "[Root.GetLeftDesc] Şu anda, Sanation Solu hükûmete darbe girişiminin eşiğinde. Sürekli marjinalleşmekten bıkan, Sławek'in ne yapacağını kimse bilemez."
 POL_sanation_right_opposition_1:0 "Düşük Sanation Sağı Muhalefeti"
 POL_sanation_right_opposition_1_desc:0 "[Root.GetRightDesc] Şu anda, Sanation Sağı hükûmetten memnun ve rejime çok az tehdit oluşturuyor."
 POL_sanation_right_opposition_2:0 "Orta Sanation Sağı Muhalefeti"
 POL_sanation_right_opposition_2_desc:0 "[Root.GetRightDesc] Şu anda, Sanation Sağı biraz huzursuzlanıyor ve Mościcki'nin emirlerini gerçek komutlardan çok tavsiye olarak alıyor."
 POL_sanation_right_opposition_3:0 "Yüksek Sanation Sağı Muhalefeti"
 POL_sanation_right_opposition_3_desc:0 "[Root.GetRightDesc] Şu anda, Sanation Sağı Diktatörlüğün ordunun otoritesini baltalamaya çalıştığına inanıyor ve Polonya ordusunu bozmak için askeri yüksek komutadaki pozisyonlarını kullanıyor."
 POL_sanation_right_opposition_4:0 "Çok Yüksek Sanation Sağı Muhalefeti"
 POL_sanation_right_opposition_4_desc:0 "[Root.GetRightDesc] Şu anda, Sanation Sağı Polonya hükûmetine bir darbe hazırlıyor. Ordu üzerindeki güçleri onları diktatörlükteki gerçek güç yapıyor ve eğer yakında tavizler verilmezse, Sağ Polonya'yı parçalayabilir."
 POL_sanationist_army:0 "Sanasyonist Bir Ordu"
 POL_sanationist_army_desc:0 "Kontrolümüz altında sadık bir Sanation üst komutasıyla, eski muhafızların deneyimini birlikler arasında kullanma zamanı geldi."
 POL_sea_to_sea:0 "Denizden Denize"
 POL_sea_to_sea_desc:0 "Commonwealth, sadece Polonya ve Litvanya'nın birliğinden çok daha fazlasıdır; denizden denize parlayan görkemli bir imparatorluktur; Polonya'dan Kırım'a."
 POL_second_man_of_the_state:0 "Devletin İkinci Adamı"
 POL_second_man_of_the_state_desc:0 "Sanation Solu yeterince kenara itildi ve şimdi, Śmigły ve Mościcki, Sol'u hükûmetteki tüm nüfuzdan tamamen uzaklaştırabilir. Śmigły “ikinci adam” yapılacak, bu da savaş zamanlarında Mościcki'nin Başkanlık koltuğunu Sanation Sağına ve orduya teslim etmesi gerektiği anlamına geliyor."
 POL_seek_accommodation_with_USSR:0 "SSCB ile Uzlaşma Ara"
 POL_seek_accommodation_with_USSR_desc:0 "SSCB de bizim kadar az savaş istiyor. Belki de tarihimizi kan dökmeden uzlaştırmanın bir yolu vardır."
 POL_seek_accommodation_with_germany:0 "Almanya ile Uzlaşma Ara"
 POL_seek_accommodation_with_germany_desc:0 "Neden savaşalım ki, farklı olduğumuzdan çok daha fazla benziyoruz?"
 POL_segregated_seating_abolished:0 "Ayrılmış Oturma Düzeni Kaldırıldı"
 POL_segregated_seating_abolished_desc:0 "Onlarca yıldır, Polonya'nın eğitiminde farklı etnik kökenlere sahip olanlar için ayrılmış bir oturma düzeni sistemi vardı. Şimdi bu uygulama kaldırıldığına göre, devlet gerçekten çok kültürlü bir eşitler toplumu yaratma yolunda ilerliyor."
 POL_silesia_fortified_area:0 "Silezya Müstahkem Alanı"
 POL_silesia_fortified_area_desc:0 "Güneyde inşa edilen daha fazla kale, ek savunmalar sağlayacaktır."
 POL_slavic_revanchism:0 "Polonya Revanchizmi"
 POL_standardisation_of_equipment:0 "Teçhizatın Standardizasyonu"
 POL_standardisation_of_equipment_desc:0 "Askerlerimizin teçhizatını standardize ederek modern bir ikmal mekanizmasının temelini atıyoruz."
 POL_start_central_industrial_region:0 "Kraków Sanayisini Genişlet"
 POL_start_central_industrial_region_desc:0 "Polonya'nın eski başkenti Kraków, Avusturya İmparatorluğu'nun pençelerinden kurtarıldı, ancak şehir hala geçmişinin prangalarına bağlı; batıyla rekabet etmek için ihtiyaç duyduğu modern sanayilerden yoksun. Yatırımla, Kraków'u ölümden geri döndüreceğiz."
 POL_strengthen_the_polish_state:0 "Polonya Devletini Güçlendir"
 POL_strengthen_the_polish_state_desc:0 "Bölünmüş durmayı göze alamayız. Değişiklik yapma gücümüz, hem senatoda hem de sejm'de birliğimizle orantılıdır."
 POL_strike_force:0 "Ejderha Tutkusu"
 POL_strike_force_desc:0 "Polonya donanması şimdiye kadar modernleşme çabalarında mütevazı ve çekingendi, ama artık değil. Büyük bir Polonyalı ejderha dalgalara binecek ve ufukta bir canavar gibi yükselirken hem Almanlar hem de Ruslar onun kükremesinden titreyecek!"
 POL_study_foreign_built_ships:0 "Britanya Gemi Tasarımlarını İncele"
 POL_study_foreign_built_ships_desc:0 "Britanya donanması on yıllardır Polonya'nın müttefikiydi, ancak son zamanlarda Britanya'nın yatıştırma politikası Polonya'yı güvenecek dostu olmayan istikrarsız bir konuma sokuyor. Belki de İngilizlerin tasarımlarını inceleyerek, eşit verimlilikte ve görkemde gemiler üretmeye başlayabiliriz."
 POL_study_foreign_tanks:0 "Yabancı Tankları İncele"
 POL_study_foreign_tanks_desc:0 "Bu \"tanklar\" günümüzün silahlı çatışmalarının merkezi bir parçası olacak ve biz de ne pahasına olursa olsun komşularımıza ayak uyduracağımızdan emin olmalıyız."
 POL_sudeten_mountaineers:0 "Sudet Dağcıları"
 POL_sudeten_mountaineers_desc:0 "Sudetenland güvensiz bir sınırdır, ancak aynı zamanda benzersiz bir savunma pozisyonu sunar. Dağ savaşında ustalaşmış adamları eğiterek, Zaolzie'nin yüce zirvelerinde Almanları alt edebileceğiz!"
 POL_supply_the_rail_nexus:0 "Demiryolu Merkezini İkmal Et"
 POL_supply_the_rail_nexus_desc:0 "Doğu Polonya'daki demiryolları üzücü bir durumda, Polonya'nın merkezi bölgesiyle neredeyse hiç karşılaştırılamaz. [SOV.GetNameDef] ile bir savaş, ikmal kontrolü ile kazanılır veya kaybedilir ve kendi adamlarımıza iyi bir ikmal zinciri, başlamak için harika bir yer olacaktır."
 POL_support_right_paramilitaries:0 "Sağcı Paramilitarizmi Destekle"
 POL_support_right_paramilitaries_desc:0 "Polonya'nın siyasi manzarasının Falanjistleri genellikle fanatik, faşist ve hatta Nazilerle karşılaştırılabilir olarak tanımlanmıştır, ancak retorikleri Polonyalı vatanseverlere çekici gelmektedir ve Jerzy Rutkowski, Polonya bağımsızlığı için savaşmaya ve ölmeye hazır genç gönüllülerden oluşan bir paramiliter kurmayı önermektedir."
 POL_the_baltic_alliance:0 "Baltık Devletleri ile İttifak"
 POL_the_baltic_alliance_desc:0 "İnsanın asla yeterince dostu olamaz."
 POL_the_between_the_seas_concept:0 "Denizler Arası Konsepti"
 POL_the_between_the_seas_concept_desc:0 "Józef Piłsudski'nin, denizler arasında uzanan bir uluslar ittifakı hırsı vardı; Polonyalılar, Romenler, eski Commonwealth üyeleri ve hatta İtalyanlar, egemenliklerinden bir santim bile ödün vermeden karşılıklı devam eden hayatta kalmalarını sağlamak için birlikte çalışıyorlardı. Şimdi, Piłsudski'nin cesur vizyonunu gerçekleştirme konumundayız. Romanya'ya ulaşarak, Intermarium'u bir gerçeklik haline getirmenin ilk adımını atacağız!"
 POL_the_bombe:0 "Bombe"
 POL_the_bombe_desc:0 "\"Kriptolojik Bombe\", Siklometrenin geliştirilmiş halidir ve Alman Enigma şifresinin giderek daha gelişmiş versiyonlarını deşifre etmemizi sağlar."
 POL_the_bombe_no_mtg:0 "$POL_the_bombe$"
 POL_the_bombe_no_mtg_desc:0 "$POL_the_bombe_desc$"
 POL_the_castle:0 "Kale"
 POL_the_castle_desc:0 "Kale, Ignacy Mościcki liderliğinde Varşova Kalesi'nden yöneten valileri temsil eder. Statükonun sadık destekçileri olan, Kale'deki hükûmete destek vermek ulusu istikrarlı tutacak ve Sanation sol ve sağının bir darbe başlatmak için gerekli zemini bulmasını önleyecektir."
 POL_the_cyclometer:0 "Cyclometer"
 POL_the_cyclometer_desc:0 "Bu buluşla, Almanların şifreleri açık metin kadar net hale gelecektir. Bizden hiçbir sır saklanamayacak."
 POL_the_cyclometer_no_mtg:0 "$POL_the_cyclometer$"
 POL_the_cyclometer_no_mtg_desc:0 "$POL_the_cyclometer_desc$"
 POL_the_defence_of_poland:0 "Polonya'nın Savunması"
 POL_the_defence_of_poland_desc:0 "Anavatanımızın savunmasının başarılı olması için daha da cesur stratejiler geliştirilmelidir."
 POL_the_four_year_plan:0 "Dört Yıllık Plan"
 POL_the_four_year_plan_desc:0 "Sadece mevcut sanayimizi değil, aynı zamanda geleceği de barındırmak için altyapımızın genişlemesini planlamalıyız."
 POL_the_left_chairman:0 "Solcu Başkan"
 POL_the_left_chairman_desc:0 "Sanation Solu ve Sağı temelde ideolojik olarak uyumsuzdur. Sağ tarafından önerilen reformlardan faydalanabilsek de, Polonya'nın en iyi çıkarlarını kalbinde taşıyan Sol'dur ve belki de onlara daha büyük yetkiler vererek, Sağı tamamen kenara itebiliriz…"
 POL_the_long_push_home:0 "Eve Uzun Yürüyüş"
 POL_the_long_push_home_desc:0 "Ayaklanma başarılı oldu! Geriye kalan tek şey, yardım gelene kadar yeterince uzun süre dayanmak. Düşman işgalinin mutlak dehşetine ve vahşetine tanık olmuş bir halkla, Polonya ordusu kırk katı adamın gücüyle tekrar savaşacak! Bu sefer: düşmeyeceğiz!"
 POL_the_long_push_home_no_mtg:0 "$POL_the_long_push_home$"
 POL_the_long_push_home_no_mtg_desc:0 "$POL_the_long_push_home_desc$"
 POL_the_mediterranean:0 "Akdeniz"
 POL_the_mediterranean_desc:0 "Polonya ile Akdeniz arasında, arkalarında kurtlar olan bir kuzu sürüsü var. Yugoslavya, Avusturya, hatta Yunanistan ve Türkiye, Batı'daki yırtıcı güçlere avdır. Balkanlar ve ötesindeki tüm güçleri, egemenliklerini ve halklarının güvenliğini koruma arzumuzu bildirmeliyiz, ancak o zaman onlara resmi koruma teklifleri uzatabilir ve Intermarium'u genişletebiliriz."
 POL_the_north_sea:0 "Kuzey Denizi"
 POL_the_north_sea_desc:0 "Kuzeydeki tarafsız güçleri ittifakımıza katılmaya ikna etmeye başlamadan önce, küresel diplomatik sahnede zemin hazırlamalıyız. Kuzey güçlerini işbirliğine olan hevesimizden haberdar etmeli ve Józef Beck ile onun gümüş dilini İskandinav ülkelerine göndererek onlara Międzymorze ile hizalanmanın birçok faydası olduğuna ikna etmeliyiz."
 POL_the_old_borders:0 "Eski Sınırlar"
 POL_the_old_borders_desc:0 "Geçmiş yüzyıllarda, Slavlar şimdi Cermen olarak kabul edilen bölgeleri işgal ediyordu; Pomeranya, Silezya ve Prusya. Alman emperyalizmi, Polonya devleti ve bitişik Slav halkları için yüzyıllardır bir veba olmuştur ve tarihin hatalarını düzeltip haklı olarak bizim olanı geri alma zamanı geldi."
 POL_the_prusya_army:0 "Prusya Muhafızları"
 POL_the_prusya_army_desc:0 "Prusya ile olan sınırımız acınacak derecede savunmasız. Prusya tahkimatlarına yaptığımız tüm yatırımlar, kaleleri dolduracak askerler olmadan hiçbir anlam ifade etmeyecektir."
 POL_the_prusya_line:0 "Prusya Hattı"
 POL_the_prusya_line_desc:0 "Doğu Prusya, Almanlar için kilit bir işgal noktası ve mevcut savunmalarımızda büyük bir boşluktur. Prusya sınırı boyunca kale hattımızı genişleterek, ordularımız ulusumuzu kuzeyimizdeki tehdide karşı daha yetenekli bir şekilde savunacaktır."
 POL_the_sanation_left:0 "Sanation Solu"
 POL_the_sanation_left_desc:0 "Walery Sławek'e sadık olan Sanation Solu, Sławek'in Piłsudski'nin gerçek halefi olduğuna inananları temsil eder ve Sağ ve Kale'nin yapacağı gibi onları hükûmetten tamamen dışlamak yerine muhalefetle uzlaşma arar. Onlarla işbirliği muhtemelen Sanation Sağını üzecek olsa da, solcular yetkin bir bakanlar kurulu oluşturmak için ihtiyaç duyduğumuz iç gücü elinde tutar."
 POL_the_sanation_right:0 "Sanation Sağı"
 POL_the_sanation_right_desc:0 "Edward Rydz-Śmigły'nin takipçileri olan Sanation Sağı, öncelikle generallerden ve yüksek rütbeli askeri personelden oluşur. Sanation hükûmetinin askeri güç merkezi olan Sağ, hükûmetin kontrolünü ele geçirmek için en iyi konumdadır, ancak onlara yetkiler ve tavizler vermek, devam eden sadakatlerini ve potansiyel olarak Kale'ye dahil olmalarını sağlayabilir."
 POL_the_twin_threats:0 "Donanma Modernizasyonuna Devam Et"
 POL_the_twin_threats_desc:0 "Şimdi kıyı şeridimizin kontrolünü geri aldığımıza göre, donanmamızın modernizasyonuna devam edebiliriz. Zafer, sanayimizi herhangi bir şeye adamadan önce deniz savaşı yöntemlerini incelemekten gelecektir."
 POL_treaty_with_lithuania:0 "Litvanya ile Antlaşma"
 POL_treaty_with_lithuania_desc:0 "Eski kinler geçmişte kalmalı. Önümüzdeki karanlık zamanlarda her dosta ihtiyaç var."
 POL_volunteer_corps:0 "Gönüllü Kolordusu"
 POL_volunteer_corps_desc:0 "Özgürlük, isteksizler tarafından uygulanamaz, yoksa bir maskaralık olur. Ancak, özgürlük için isteyerek silahlananlara bunu yapma imkanı verilmelidir."
 POL_walery_slawek_chairman:0 "Solcu Başkan"
 POL_warsaw_main_railway_station:0 "Varşova Ana Tren İstasyonu"
 POL_warsaw_main_railway_station_desc:0 "Varşova, bir ulaşım ve kargo merkezidir. Darboğazları önlemek için, demiryolunun yönetimine ekstra çaba gösterilmelidir."
 POL_woo_the_sanation_generals:0 "Sanation Generallerinin Gönlünü Kazan"
 POL_woo_the_sanation_generals_desc:0 "Sanationist askeri personel, rejime karşı hoşnutsuz ve sadakatsizdir. Bazıları, Sanation'ın kendi kibri nedeniyle askeri personelin tasfiyesinin gerekli olduğunu söyleyebilir, ancak biz bu adamların değiştirilemeyecek kadar değerli olduğunu biliyoruz."
