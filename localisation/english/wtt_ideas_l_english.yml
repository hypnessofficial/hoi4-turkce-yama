 MAN_low_legitimacy_5_desc:0 "İmparator Puyi, Çin'i üç yüz yıl yöneten Qing imparatorlarının meşru soyundan gelmektedir. 1911'de onu deviren Xinhai Devrimi, geç Qing hükûmetinin hem Çin topraklarını çalan yabancılara hem de kendilerini savaş lordu olarak ilan eden bölgesel valilere karşı güçsüz olması nedeniyle çok popülerdi. İmparator Puyi'nin Japonya tarafından Mançukuo İmparatoru olarak atanması, henüz Mançurya halkı tarafından, bırakın Çin'in geri kalanını, kabul edilmemiştir.\n\nUlusunu onun altında toplamak için İmparator'un Japonya'dan bağımsızlığını tesis etmemiz gerekecek."
