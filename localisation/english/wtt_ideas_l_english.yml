 JAP_interservice_rivalry_navy_strengthened:0 "Kuvvetler Arası Rekabet - Donanma Güçlendi"
 JAP_militarism:0 "Militarizm"
 JAP_militarism_desc:0 "Militarizm, ulusun siyasi ve sosyal yaşamına hakimdir ve ordunun gücünün bir ulusun gücüne eşit olduğu inancı yaygındır. Meiji Restorasyonu sırasında zorunlu askerliğin getirilmesiyle başlayan bu durum, artık ulusal inançlarımızın temel bir ilkesi haline gelmiştir."
 JAP_military_purges:0 "Askeri Tasfiyeler"
 JAP_separate_air_services:0 "Ayrı Hava Servisleri"
 JAP_superior_will:0 "Üstün İrade"
 JAP_the_london_naval_treaty:0 "Londra Deniz Antlaşması"
 JAP_unsanctioned_war:0 "Onaylanmamış Savaş"
 JAP_unsanctioned_war_desc:0 "Çin'deki mevcut savaş aceleyle ve İmparator'un onayı olmadan başlatıldı."
 JAP_zaibatsus:0 "Zaibatsu"
 JAP_zaibatsus_challenged:0 "Meydan Okunan Zaibatsu"
 JAP_zaibatsus_empowered:0 "Güçlendirilmiş Zaibatsu"
 MAN_aisin_gioro_puyi_xuantong_name:0 "Xuantong"
 MAN_arms_seized_1:0 "Mançurya'da Mühimmat Kıtlığı"
 MAN_arms_seized_1_desc:0 "Qing, sürpriz bir saldırı düzenledi ve topraklarındaki bir dizi silah deposunu ve mühimmat yığınını ele geçirdi. Topraklarındaki tedarik zincirlerimizi yeniden düzenlemek biraz zaman alacak."
 MAN_banditry:0 "Haydutluk"
 MAN_banditry_desc:0 "Partizanlar, kaçaklar ve cumhuriyetçi teröristlerle düşük yoğunluklu bir savaş içindeyiz. Bu haydutları avlamak için kırsal bölgeyi sakinleştirmeye odaklanmalıyız."
 MAN_exiled_imperial_family:0 "Sürgündeki İmparatorluk Ailesi"
 MAN_five_year_plan:0 "Beş Yıllık Plan"
 MAN_kwantung_veto:0 "Kwantung Vetosu"
 MAN_kwantung_veto_desc:0 "1905'te Japonların Dalian'ı Rusya'dan ele geçirmesinden sonra, oraya yerleştirilen Kwantung (Japonca'da Kantō) garnizonu siyasallaştı ve yayılmacı generaller Japonya için daha fazla Çin toprağı ele geçirme girişiminde bulundular. Bu, 1932'deki Mukden Olayı ile doruğa ulaştı ve Mançukuo İmparatorluğu kuzeydoğudaki küçük savaş lordlarından oyuldu. Kwantung Ordusu bölgeye hakim olmaya devam ediyor ve generallerinin çıkarlarını Mançukuo'nun ihtiyaçlarının üzerinde tutuyor.\n\nBunu ancak Japon ordusunun bizi eşit olarak tanımasını sağlayarak veya onları zorla dışarı atarak çözeceğiz."
 MAN_low_legitimacy:0 "Düşük Meşruiyet"
 MAN_low_legitimacy_1_desc:0 "İmparator Puyi, Çin'i üç yüz yıl yöneten Qing imparatorlarının meşru soyundan gelmektedir. 1911'de onu deviren Xinhai Devrimi, geç Qing hükûmetinin hem Çin topraklarını çalan yabancılara hem de kendilerini savaş lordu olarak ilan eden bölgesel valilere karşı güçsüz olması nedeniyle çok popülerdi. İmparator Puyi'nin Japonya tarafından Mançukuo İmparatoru olarak atanması, henüz Mançurya halkı tarafından, bırakın Çin'in geri kalanını, kabul edilmemiştir.\n\nUlusunu onun altında toplamak için İmparator'un Japonya'dan bağımsızlığını tesis etmemiz gerekecek."
 MAN_low_legitimacy_2_desc:0 "İmparator Puyi, Çin'i üç yüz yıl yöneten Qing imparatorlarının meşru soyundan gelmektedir. 1911'de onu deviren Xinhai Devrimi, geç Qing hükûmetinin hem Çin topraklarını çalan yabancılara hem de kendilerini savaş lordu olarak ilan eden bölgesel valilere karşı güçsüz olması nedeniyle çok popülerdi. İmparator Puyi'nin Japonya tarafından Mançukuo İmparatoru olarak atanması, henüz Mançurya halkı tarafından, bırakın Çin'in geri kalanını, kabul edilmemiştir.\n\nUlusunu onun altında toplamak için İmparator'un Japonya'dan bağımsızlığını tesis etmemiz gerekecek."
