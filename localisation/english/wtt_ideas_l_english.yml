 MAN_mamc_light:0 "Mançurya Uçak İmalat Şirketi - Avcı Tümeni"
 MAN_mamc_medium:0 "Mançurya Uçak İmalat Şirketi - Bombardıman Tümeni"
 MAN_militarism:0 "Militarizm"
 MAN_the_kangde_emperor:0 "İmparator Kangde"
 MAN_the_kangde_emperor_desc:0 "1934'te Puyi, unvanını Baş Yöneticiden İmparatora değiştirerek Mançukuo İmparatoru olarak taç giydi ve böylece yeni bir Dönem adı kabul edildi. Daha önce Datong adı altında hüküm süren Puyi, şimdi Mançurya'yı İmparator Kangde olarak yönetiyor."
 MAN_underground_gun_shops:0 "Yeraltı Atölyeleri"
 MAN_underground_gun_shops_desc:0 "Daha fazla teçhizat üretmek için arka bahçelerde ve bodrumlarda bir dizi derme çatma atölye oluşturduk. Kalite belki o kadar iyi değil, ama bunu sayılarla telafi ediyorlar."
 MAN_xian_yuan:0 "Xian Yuan"
 PRC_deng_xiaoping:0 "Deng Xiaoping"
 PRC_government_corruption:0 "Hükûmet Yolsuzluğu"
 PRC_government_corruption_desc:0 "Hükûmetimiz yozlaşmış bireylerle dolu ve devlete ait paranın yerel yetkililerin ceplerine girmesi alışılmadık bir durum değil."
 PRC_kang_sheng:0 "Kang Sheng"
 PRC_low_popular_support:0 "Düşük Halk Desteği"
 PRC_low_popular_support_desc:0 "Köylüler iç savaşta çok acı çekti. Çin'in meşru hükûmeti olarak kabul edilmek istiyorsak, onların desteğini kazanmalıyız."
 PRC_nie_rongzhen:0 "Nie Rongzhen"
 PRC_otto_braun:0 "Otto Braun"
 PRC_power_struggles:0 "Güç Mücadeleleri"
 PRC_power_struggles_desc:0 "Parti, izlenecek en iyi yol konusunda kendi içinde bölünmüş durumda. Çeşitli hizipler arasında mücadeleler patlak verdi ve biri üstün gelene kadar devam edecek."
 PRC_red_army_weakened:0 "Zayıflamış Kızıl Ordu"
 PRC_red_army_weakened_desc:0 "Uzun Yürüyüş'ten yorgun düşen Kızıl Ordumuz henüz savaşa hazır değil. Yeni birimler oluşturmalı ve yeni bir Kurtuluş Ordusu kurmalıyız."
 PRC_soviet_tribute:0 "Sovyet Haracı"
 PRC_su_yu:0 "Su Yu"
 PRC_the_long_march:0 "Uzun Yürüyüş'ün Ardından"
 PRC_the_long_march_2:0 "Uzun Yürüyüş'ten Toparlanma"
 PRC_the_long_march_desc:0 "Şanşi'ye yapılan uzun geri çekilme kuvvetlerimizi tüketti ve Yan'an Üs Bölgesi henüz büyük bir ayaklanmayı desteklemeye hazır değil. Toparlanmak zaman veya dış yardım gerektirecek."
