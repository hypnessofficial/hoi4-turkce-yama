l_english:
 CHI_alexander_von_falkenhausen:0 "Alexander von Falkenhausen"
 CHI_army_corruption:0 "Ordu Yolsuzluğu"
 CHI_army_corruption_desc:0 "Silahlı kuvvetlerimiz yolsuzluk ve adam kayırmacılıkla dolu. Onları güçlü bir savaş gücüne dönüştürmek istiyorsak, uzun ve masraflı bir ordu reformu programına girişmek zorunda kalacağız."
 CHI_camco_1:0 "CAMCO"
 CHI_camco_2:0 "CAMCO - Avcı Tümeni"
 CHI_camco_3:0 "CAMCO - Bombardıman Tümeni"
 CHI_chen_guofu:0 "Chen Guofu"
 CHI_chiang_ching_kuo:0 "Chiang Ching-Kuo"
 CHI_chinese_support:0 "Çin Desteği"
 CHI_chinese_unity_1:0 "Çin Birliği"
 CHI_chinese_unity_1_desc:0 "Savaş Lordları bize desteklerini ilan ettiler, bu da hükûmetimizin herhangi bir yabancı işgalciye karşı direnmeye odaklanmasını sağlıyor."
 CHI_dai_li:0 "Dai Li"
 CHI_h_h_kung:0 "H. H. Kung"
 CHI_hyper_inflation_1:0 "Düşük Enflasyon"
 CHI_hyper_inflation_1_desc:0 "Ekonomistlerimiz enflasyonda hafif bir artış fark ettiler. Buna göz kulak olmalıyız."
 CHI_hyper_inflation_2:0 "Orta Düzey Enflasyon"
 CHI_hyper_inflation_2_desc:0 "Enflasyon ekonomiyi önemli ölçüde etkilemeye başladı. İşler kontrolden çıkmadan önce karşı önlemleri düşünmeliyiz."
 CHI_hyper_inflation_3:0 "Ağır Enflasyon"
 CHI_hyper_inflation_3_desc:0 "Hükûmet tarafından basılan paranın değeri giderek azalıyor, alım gücü düşüyor ve bazı mallar sadece doğru bağlantıları olan insanlar için mevcut."
 CHI_hyper_inflation_4:0 "Hiperenflasyon"
 CHI_hyper_inflation_4_desc:0 "Paramızın değeri buharlaşıyor. Fiyatlar günden güne dramatik bir şekilde artıyor. Tam bir çöküş yaşamadan önce çok acil karşı önlemler almalıyız."
 CHI_hyper_inflation_5:0 "Ekonomik Çöküş"
 CHI_hyper_inflation_5_desc:0 "Para sistemimiz tamamen çöktü. Ülkenin büyük bir bölümünde ticaret, takas sistemine geri döndü. Yoksulluk yaygın. Çalışanlarımız onlara ödediğimiz kağıt parayı evlerini ısıtmak için kullanıyor. Durumu çözmek için agresif bir mali ve ekonomik reform programı gerekiyor."
 CHI_hyper_inflation_none:0 "İstikrarlı Ekonomi"
 CHI_hyper_inflation_none_desc:0 "Ekonomi herhangi bir sorun belirtisi göstermiyor."
 CHI_incompetent_officers:0 "Yetersiz Subaylar"
 CHI_incompetent_officers_desc:0 "Subaylarımız henüz modern bir savaşı yönetme görevine hazır değil. Diğer uluslardaki mevkidaşlarına gerçekten eşit olmadan önce zor dersler öğrenmeleri gerekecek. Onları eğitmek, daha büyük bir ordu reformu programının bir parçası olacak."
 CHI_ineffective_bureaucracy:0 "Etkisiz Bürokrasi"
 CHI_ineffective_bureaucracy_desc:0 "İç savaşın kaosu, etkili bir devlet aygıtının oluşturulmasını sekteye uğrattı. Mevcut askere alınabilirlerin üçte birinden fazlası, sadece kimse onların varlığından haberdar olmadığı için askere alınmıyor. Sınav sürecini reforme etmek, yetkin insanları işe almamızı sağlayacaktır."
 CHI_ineffective_bureaucracy_warlord:0 "Etkisiz Bürokrasi"
 CHI_ineffective_bureaucracy_warlord_desc:0 "İç savaşın kaosu, etkili bir devlet aygıtının oluşturulmasını sekteye uğrattı. Bürokrasimizi reforme edene, yetkin insanları işe alana ve valiliği etkili bir şekilde bölene kadar bölge düzgün bir şekilde yönetilemez."
 CHI_lin_sen:0 "Lin Sen"
 CHI_nine_power_treaty:0 "Dokuz Güç Antlaşması"
 CHI_nine_power_treaty_desc:0 "Halen Çin'e yönelik \"Açık Kapı Politikası\"nı resmileştiren Eşitsiz Anlaşmaların etkisi altında çalışıyoruz. Yabancıların hâlâ sınır dışı hakları var ve ekonomimiz üzerinde tam kontrole sahip değiliz."
 CHI_soong_mei_ling:0 "Soong Mei-Ling"
 CHI_t_v_soong:0 "T.V. Soong"
 CHI_warlord_integration:0 "Savaş Lordu Entegrasyonu"
 CHI_warlord_state_idea:0 "Savaş Lordu Devleti"
 CHI_warlord_state_idea_desc:0 "Devletimiz, kelimenin tanımından çok uzak. Burası, hiçbir devlete sadakat yemini etmeyen bağımsız bir ordunun koruması altında günlük yaşamlarını sürdüren bir bölge ve halk. Bu, hükûmet olarak yapabileceğimiz çok az şey olmasına yol açıyor, ama aynı zamanda iyi yanları da var."
 CHI_warlord_state_idea_tt:0 "Bu ruh, §YGüç Mücadelesi§!, §YYan'an Olayı§! ve §YRakip Hükûmet İlan Et§! odaklarından birinin tamamlanması üzerine kaldırılır."
 JAP_hirohito:0 "Hirohito"
 JAP_interservice_rivalry_army_dominant:0 "Kuvvetler Arası Rekabet - Ordu Hakimiyeti"
 JAP_interservice_rivalry_army_strengthened:0 "Kuvvetler Arası Rekabet - Ordu Güçlendi"
 JAP_interservice_rivalry_balanced:0 "Kuvvetler Arası Rekabet - Dengeli"
