 wtt_border_conflict_canceled_attacker.1.a:0 "Geri döneceğiz."
 wtt_border_conflict_canceled_attacker.1.desc:0 "[our_state.GetName]-[their_state.GetName] Sahasındaki çatışmalar, her iki tarafın da diğerini yerinden edememesi nedeniyle durma noktasına geldi. Her iki taraf da çok az toprak kazandı. Gözcüler, karşı taraftaki [their_country.GetAdjective] askerlerinin savunma arazisinde siper kazdığını bildiriyor. Görünen o ki, sahip oldukları toprakları ellerinde tutmayı planlıyorlar, ancak muhtemelen hatlarımıza karşı ilerlemeyecekler."
 wtt_border_conflict_canceled_attacker.1.t:0 "[their_state.GetName]'de Tıkanma"
 wtt_border_conflict_canceled_defender.1.a:0 "Geri döneceğiz."
 wtt_border_conflict_canceled_defender.1.desc:0 "[our_state.GetName]-[their_state.GetName] Sahasındaki çatışmalar, her iki tarafın da diğerini yerinden edememesi nedeniyle durma noktasına geldi. Her iki taraf da çok az toprak kazandı. Gözcüler, karşı taraftaki [their_country.GetAdjective] askerlerinin savunma arazisinde siper kazdığını bildiriyor. Görünen o ki, sahip oldukları toprakları ellerinde tutmayı planlıyorlar, ancak muhtemelen hatlarımıza karşı ilerlemeyecekler."
 wtt_border_conflict_canceled_defender.1.t:0 "[their_state.GetName]'de Tıkanma"
 wtt_border_conflict_escalate_to_war.1.a:0 "Onlarla karşılaşmaya hazır olmalıyız!"
 wtt_border_conflict_escalate_to_war.1.desc:0 "Keşif raporları, [From.GetAdjective] güçlerinin [our_state.GetName]'in daha derinlerine ilerlemek için büyük bir operasyon amacıyla [their_state.GetName] içinde toplandığını gösteriyor. [From.GetLeader]'in bu maceraya harcamaya istekli olduğu kaynak miktarı göz önüne alındığında, bunun artık sadece bir sınır çizgisinin tam konumu üzerindeki bir anlaşmazlık olmadığı açıktır.\n\nUfukta tam ölçekli bir savaş var."
 wtt_border_conflict_escalate_to_war.1.t:0 "[From.GetNameDefCap] Savaşa Seferber Oluyor"
 wtt_border_conflict_lost_attacker.1.a:0 "En kısa sürede karşı saldırıya geçmeliyiz!"
 wtt_border_conflict_lost_attacker.1.desc:0 "[their_country.GetLeader]'in komutasındaki güçler, [our_state.GetName] ve [their_state.GetName] arasındaki tartışmalı bölgeden bizi çıkarmayı başardı. Güçlerimiz düzenli bir şekilde geri çekildi ve gelecekte savaşı yenilemek istersek yeniden örgütleniyor."
 wtt_border_conflict_lost_attacker.1.t:0 "[our_state.GetName]'de Yenilgi"
 wtt_border_conflict_lost_defender.1.a:0 "En kısa sürede karşı saldırıya geçmeliyiz!"
 wtt_border_conflict_lost_defender.1.desc:0 "[their_country.GetLeader]'in komutasındaki güçler, [our_state.GetName] ve [their_state.GetName] arasındaki tartışmalı bölgeden bizi çıkarmayı başardı. Güçlerimiz düzenli bir şekilde geri çekildi ve gelecekte savaşı yenilemek istersek yeniden örgütleniyor."
 wtt_border_conflict_lost_defender.1.t:0 "[our_state.GetName]'de Yenilgi"
 wtt_border_conflict_won_attacker.1.a:0 "Onlara gücümüzü gösterdik!"
 wtt_border_conflict_won_attacker.1.desc:0 "[our_state.GetName] ve [their_state.GetName] arasındaki sınır topraklarındaki çatışmada güçlerimiz, [their_country.GetLeader]'in güçlerine karşı açık bir zafer kazandı. [their_country.GetAdjective] güçleri yeniden toplanmak için geri çekildi ve güçlerimiz tartışmalı bölgenin kontrolünü ele geçirdi."
 wtt_border_conflict_won_attacker.1.t:0 "[their_state.GetName]'de Zafer"
 wtt_border_conflict_won_defender.1.a:0 "Onlara gücümüzü gösterdik!"
 wtt_border_conflict_won_defender.1.desc:0 "[our_state.GetName] ve [their_state.GetName] arasındaki sınır topraklarındaki çatışmada güçlerimiz, [their_country.GetLeader]'in güçlerine karşı açık bir zafer kazandı. [their_country.GetAdjective] güçleri yeniden toplanmak için geri çekildi ve güçlerimiz tartışmalı bölgenin kontrolünü ele geçirdi."
 wtt_border_conflict_won_defender.1.t:0 "[their_state.GetName]'de Zafer"
 wtt_border_incident_defender_warning.1.a:0 "Mevcut tüm kuvvetleri seferber edin!"
 wtt_border_incident_defender_warning.1.desc:0 "Dün erken saatlerde, [their_country.GetAdjective] askerlerinin [attacker_state.GetName] sınırından [defender_state.GetName]'e geçtiği görüldü. Gece boyunca, daha fazla [their_country.GetAdjective] gücü bölgeye akın etti ve topraklarımızın içinde savunma pozisyonları kurdu. \n\nBu durum, [their_country.GetLeader]'in komutasındaki güçler tarafından ortak sınırımız boyunca gerçekleştirilen bir dizi küçük çatışma ve sınır ihlalini takip ediyor.\n\nAncak bu sefer, [their_country.GetAdjective] güçlerinin burada kalıcı olduğu açık. İlerlemelerini kontrol altına almak için en kısa sürede bölgeye kuvvet göndermeliyiz."
 wtt_border_incident_defender_warning.1.t:0 "[From.GetNameDefCap] sınırımızı tehdit ediyor"
