 CZE_sudeten_german_quandary:0 "Südet İkilemi"
 CZE_sudeten_german_quandary_desc:0 "Südet bölgesinde yaşayan insanların çoğunluğu mevcut hükümet altında sadece daha fazla özerklik istese de, bir Alman devletinin bölgenin herhangi bir kısmını ilhak etmeye çalışması durumunda birçok Südetli siyasi parti ve destekçileri hızla bir beşinci kola dönüşebilir."
 CZE_sudeten_german_quandary_modifier_tt:0 "§YPasif Etki§!:\nEğer §Y[AUS.GetFlag][AUS.GetNonIdeologyName]§!, §Y[GER.GetFlag][GER.GetNonIdeologyName]§! veya bize sınırı olan herhangi bir [BAY.GetFlag]§YAlman Ülkesi§!, biz §Y[69.GetName]§!, §Y[972.GetName]§! veya §Y[74.GetName]§! bölgelerini kontrol ederken üzerimizde bir §RHarp Hedefi§! haklı çıkarırsa veya kazanırsa:\n - (§YTüm Kontrol Edilen Südet Eyaletleri§!):\n   §Y$CZE_sudetenland_paramilitaries_modifier$§! ekle, şunları sağlar:\n       $MODIFIER_LOCAL_INTEL_TO_ENEMIES$: §R+%10§!\n       $MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$: §R-%10.0§!\n       $modifier_state_repair_speed_bunker_factor$: §R-%10.00§!\n\n - Bu §YEtki§! sadece bir kez gerçekleşebilir"
 CZE_sudetenland_german_state_modifier:0 "Südet Ayrılıkçılığı"
 CZE_sudetenland_german_state_modifier_desc:0 "Son dönemdeki ekonomik zorluklar Südet bölgesindeki sanayiyi vurdu. Bu durum, bölgede yaşayan halkın son talihsizliklerinden dolayı [ROOT.getname] hükümetini suçlamasına neden oldu."
 CZE_sudetenland_paramilitaries_modifier:0 "Südet Paramiliter Faaliyetleri"
 CZE_sudetenland_paramilitaries_modifier_desc:0 "Südetli partizanlar ve paramiliterler şu anda bu bölgedeki kuvvetlerimizi baltalıyor. Aktif olarak birliklerimize saldırıyor ve düşmanlarımızla işbirliği yapıyorlar."
 CZE_taticek_of_czechoslovakia:0 "Tatíček Masaryk"
 CZE_taticek_of_czechoslovakia_desc:0 "Sık sık 'Tatíček Masaryk' (Milletin babası) olarak anılan Tomáš Masaryk, kuruluşundan bu yana Çekoslovak milletinin temel taşı olmuştur. Koalisyon kurmanın imkansız, siyasi tıkanıklıkların çok büyük olduğu düşünüldüğü zamanlarda Masaryk, Çekoslovakya'yı güçlendirmek ve büyütmek için defalarca siyasi mucizeler yaratmayı başardı. Emekliliğinde bile, siyasi liderliğe yönelik görüşleri ve önerileri tavsiyeden ziyade emir olarak kabul edilir."
