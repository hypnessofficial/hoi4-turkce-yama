l_english:
 ARG_news_events.1.a:0 "Bunların hepsi kesinlikle sadece retorik, değil mi?"
 ARG_news_events.1.d:0 "[ARG.GetAdjective] hükümeti son zamanlarda dış politika konularında giderek daha kavgacı ve iddialı bir tavır alıyor. Rezalet on yılı böyle hızlı bir rejim değişikliğiyle sona erdiğine göre, [ARG.GetNonIdeologyName]'in yayılma olasılığına hazırlandığı görülüyor. Bu sabah, [ARG.GetAdjective] lideri [ARG.GetLeader], ulusa seslendi ve nüfusa, Güney Amerika'yı tek bir güçlü ve istikrarlı bayrak altında birleştirme hedefleriyle, üzerlerinde bir büyüklük çağının olduğunu temin etti."
 ARG_news_events.1.t:0 "[ARG.GetNonIdeologyName] Agresif Dış Politika İzliyor"
 ARG_news_events.2.a:0 "Umarım [ENG.GetAdjective]ler de kaçmıştır."
 ARG_news_events.2.b:0 "[GER.GetAdjective]lerin burada olmaya hakları yok."
 ARG_news_events.2.c:0 "Endişe Verici Haberler."
 ARG_news_events.2.d:0 "Bu sabah Kriegsmarine Ağır Kruvazörü 'Amiral Graf Spee', Güney Atlantik okyanusunda River Plate açıklarında bir Kraliyet Donanması filosuyla çatıştı. Ardından gelen savaşta, [ENG.GetAdjective] gemilerinin bir kısmı ciddi şekilde hasar gördü ve Falkland adalarına doğru çekilmek zorunda kaldı. 'Graf Spee' ise yakıt sistemine kritik bir darbe alması dışında minimum hasar aldı. [GER.GetAdjective] gemisi acil onarımlar için [URG.GetNameDef]'in Montevideo limanına sığındı. Birçok kaynak bunun bu çatışmanın ilk deniz savaşı olduğunu iddia ediyor ve görünüşe göre savaş nihayet Güney Amerika kıtasına ulaştı."
 ARG_news_events.2.t:0 "River Plate Muharebesi"
 ARG_news_events.3.a:0 "Bunun böyle olması bir trajedi."
 ARG_news_events.3.d:0 "[ARG.GetNonIdeologyName]'deki devam eden kargaşa son günlerde kontrolden çıktı ve bir iç savaşa yol açtı. Bir zamanlar sürgünde olan Rodolfo Ghioldi liderliğinde ve [ARG.GetAdjective] kongresinin birçok sol eğilimli üyesi tarafından desteklenen komünistler, şimdi kontrolü ele geçirmek ve ulus genelinde radikal bir değişiklik yapmak amacıyla hükümetten ayrıldılar. Bölgedeki birçok kişi, komünist bir [ARG.GetNonIdeologyName]'in Güney Amerika kıtası boyunca bir domino etkisini tetikleyeceğinden endişe ediyor."
 ARG_news_events.3.t:0 "[ARG.GetAdjective] Komünist Devrimi"
 ARG_political_events.1.a:0 "Yapabileceğimiz hiçbir şey yok."
 ARG_political_events.1.b:0 "Bunun yanlarına kalmasına izin veremeyiz!"
 ARG_political_events.1.desc:0 "Bu sabah, şafak sökerken, 8.000 asker Buenos Aires'teki Campo de Mayo askeri üssünden 'La Casa Rosada' başkanlık ofisine doğru yürüdü. Arturo Rawson ve Pedro Pablo Ramírez liderliğindeki iki general, [FROM.GetLeader]'in istifa etmesini ve [FROM.GetName]'in yönetimini orduya devretmesini talep ediyor. Ya ültimatomlarına boyun eğebiliriz ya da onlarla savaşmaya hazırlanabiliriz."
 ARG_political_events.1.t:0 "Ordu Bize Karşı Döndü!"
 ARG_political_events.10.a:0 "Ucu ucuna kurtulduk..."
 ARG_political_events.10.desc:0 "Bu sabah, Başkan [ARG.GetLeader] danışmanlarını topladı ve Intervenciones Federales yasasını sonuçlandırdı. Bunu yaparak, hükümet nihayet isyanı kışkırtan ordu mensuplarına baskı yaptı. Askeri sadakatimizi yeniden inşa etmek biraz zaman alabilir, ancak iç savaş gibi ülke çapında bir felaketten kaçınmaya değerdi."
 ARG_political_events.10.t:0 "Askeri Hoşnutsuzluğa Baskı"
 ARG_political_events.100.a:0 "Birlikte duralım!"
 ARG_political_events.100.b:0 "Tek başımıza gitmeliyiz."
 ARG_political_events.100.desc:0 "[ARG.GetNameDefCap], ittifaklarına katılmamız için bizi davet ederek bize ulaştı. Güney Amerika kıtasında demokrasiyi korumak için el ele verelim mi?"
 ARG_political_events.100.t:0 "[ARG.GetNameDefCap] bizi İttifaklarına davet ediyor"
 ARG_political_events.101.a:0 "Birlikte çizgiyi tutacak ve halkımızı koruyacağız!"
 ARG_political_events.101.desc:0 "[FROM.GetNameDefCap], ittifakımıza katılma teklifimizi lütfederek kabul etti ve şimdi Güney Amerika'da bir barış ve demokrasi kalesi olarak birlikte duruyoruz."
 ARG_political_events.101.t:0 "[FROM.GetNameDefCap] teklifimizi kabul ediyor"
 ARG_political_events.102.a:0 "Belki başka zaman..."
 ARG_political_events.102.desc:0 "[FROM.GetNameDefCap], ittifakımıza katılma teklifimizi reddetti. Birlikte daha güçlü olduğumuzu fark etmiyorlar mı? Umalım ki bizi reddettikleri gün pişman olmazlar."
 ARG_political_events.102.t:0 "[FROM.GetNameDefCap] teklifimizi reddediyor"
 ARG_political_events.11.a:0 "[ARG.GetName]'i bu isyancılardan korumaya hazırlanın!"
 ARG_political_events.11.desc:0 "En yüksek askeri subaylarımızın hükümetten ayrıldığı ve [ARG.GetAdjective] siyasetinin kontrolünü ele geçirmek amacıyla destekçilerini topladığına dair haber aldık. Buenos Aires'e ulaşmalarına izin veremeyiz. [ARG.GetAdjective] İç Savaşı'na hazırlanma zamanı geldi."
 ARG_political_events.11.t:0 "Askeri İsyan Yakın"
 ARG_political_events.110.a:0 "Bunu tırmandırmalıyız!"
 ARG_political_events.110.b:0 "Harekete geçmek çok riskli..."
 ARG_political_events.110.desc:0 "Görünüşe göre korkularımız gerçeğe dönüştü, çünkü [FROM.GetNameDef], [URG.GetNameDef]'e karşı agresif bir tavır aldı. Yakın komşumuz oldukları için, onları yabancı saldırganlığına kaybetme riskini göze alamayız. Eğer dikkatli olmazsak, [FROM.GetNameDef] bunun yerine bizim kapımızı çalacaktır."
 ARG_political_events.110.t:0 "[FROM.GetNameDefCap] [URG.GetNameDef]'e Karşı Agresif Hamleler Yapıyor"
 ARG_political_events.111.a:0 "Gelsinler bakalım!"
 ARG_political_events.111.b:0 "Çekilmekten başka çaremiz yok."
 ARG_political_events.111.desc:0 "[URG.GetNameDef]'deki operasyonumuza yanıt olarak, [FROM.GetNameDef] derhal birliklerimizi çekmemizi ve düşmanlıklara son vermemizi talep etti. Eğer reddedersek, bunun [FROM.GetNameDef] ile topyekun bir savaşa tırmanma riski var."
 ARG_political_events.111.t:0 "[FROM.GetNameDefCap] [URG.GetNameDef]'den Çekilmemizi Talep Ediyor"
 ARG_political_events.12.a:0 "Yeni müttefiklerimizi hoş karşılayacağız."
 ARG_political_events.12.b:0 "Teklifleri bizim için hiçbir şey ifade etmiyor."
 ARG_political_events.12.desc:0 "Bugün bir [ARG.GetAdjective] diplomattan, hükümetlerinin Mihver'e katılmak için bir başvuru göndermek istediğine dair haber aldık. Eğer kabul edersek, bu Güney Amerika kıtasında bir dayanak noktası olacaktır. Nasıl yanıt vermeliyiz?"
 ARG_political_events.12.t:0 "[ARG.GetNameDefCap] Mihver'e Katılmak İstiyor"
 ARG_political_events.120.a:0 "Evet! ne yanlış gidebilir ki?"
 ARG_political_events.120.b:0 "Kesinlikle hayır."
 ARG_political_events.120.desc:0 "Bu sabah, şüpheli bir İspanyolca konuşan garip bir Alman adam, La Casa Rosada'ya girerek [ARG.GetNameDef]'in geleceği için harika planları olduğunu haykırdı. İşi için niteliklere sahip ve çok ikna edici görünüyor. Hükümeti ona devredelim mi?"
 ARG_political_events.120.t:0 "Garip bir Ziyaretçi"
 ARG_political_events.13.a:0 "Excelente!"
 ARG_political_events.13.desc:0 "[GER.GetAdjective] büyükelçiliğinden geri bildirim aldık ve bizi Mihver'e kabul ettiklerini duyurmaktan memnuniyet duyarız. Bu, güçlü bir ittifakın başlangıcıdır."
 ARG_political_events.13.t:0 "[GER.GetNameDefCap] Başvurumuzu Kabul Etti!"
 ARG_political_events.14.a:0 "Lamentable..."
 ARG_political_events.14.desc:0 "Sağlam girişimimize rağmen, [GER.GetAdjective] hükümeti Mihver'e katılma başvurumuzu reddetti. Görünüşe göre dünyayla tek başımıza yüzleşmek zorundayız."
 ARG_political_events.14.t:0 "[GER.GetNameDefCap] Başvurumuzu Reddetti!"
 ARG_political_events.15.a:0 "Onları durduramayız"
 ARG_political_events.15.b:0 "Egemenliğimizi imzayla teslim etmeyeceğiz."
 ARG_political_events.15.desc:0 "[ROOT.Capital.GetCapitalVictoryPointName]'daki [ARG.GetAdjective] büyükelçisine göre, mevcut hükümetimiz tahttan çekilecek ve yerine bir [ARG.GetAdjective] kuklası geçecek. Reddetmemizin savaş ilanıyla sonuçlanma olasılığı yüksek. Akıllıca seçmeliyiz."
 ARG_political_events.15.t:0 "[ARG.GetNameDefCap] Ültimatom Veriyor"
 ARG_political_events.16.a:0 "Excelente!"
 ARG_political_events.16.desc:0 "[PAR.GetAdjective] hükümeti, ültimatomumuzda belirttiğimiz şartları kabul etmeye karar verdi. Topraklarını derhal kukla yapacağız ve mümkün olan en kısa sürede [ARG.GetAdjective] yönetimini kuracağız."
 ARG_political_events.16.t:0 "[PAR.GetNameDefCap] Ültimatom Şartlarını Kabul Ediyor"
 ARG_political_events.17.a:0 "Geri çekil, buna değmez..."
 ARG_political_events.17.b:0 "Bizi reddettikleri için pişman olacaklar!"
 ARG_political_events.17.desc:0 "[PAR.GetAdjective] hükümeti, onlara sunduğumuz şartları reddetmeye karar verdi. Bu kabul edilemez. Ya geri çekilip bırakabiliriz ya da birliklerimizi savaşa hazırlayabiliriz."
 ARG_political_events.17.t:0 "[PAR.GetNameDefCap] Ültimatom Şartlarını Reddediyor"
 ARG_political_events.18.a:0 "İçim rahatladı..."
 ARG_political_events.18.desc:0 "Yerimizi koruduktan sonra, [ARG.GetAdjective] hükümeti bu eylem tarzını sürdürmenin değmeyeceğine karar vermiş gibi görünüyor. Artık tehdidin şimdilik bastırıldığını bilerek rahat uyuyabiliriz."
 ARG_political_events.18.t:0 "[ARG.GetNameDefCap] Geri Çekiliyor"
 ARG_political_events.19.a:0 "Onları durduramayız"
 ARG_political_events.19.b:0 "Egemenliğimizi imzayla teslim etmeyeceğiz."
 ARG_political_events.19.desc:0 "[ROOT.Capital.GetCapitalVictoryPointName]'daki [ARG.GetAdjective] büyükelçisine göre, mevcut hükümetimiz tahttan çekilecek ve yerine bir [ARG.GetAdjective] kuklası geçecek. Reddetmemizin savaş ilanıyla sonuçlanma olasılığı yüksek. Akıllıca seçmeliyiz."
 ARG_political_events.19.t:0 "[ARG.GetNameDefCap] Ültimatom Veriyor"
 ARG_political_events.2.a:0 "Çok az seçeneğimiz kaldı."
 ARG_political_events.2.b:0 "Henüz bağları koparmak istemiyoruz."
 ARG_political_events.2.desc:0 "Bu çatışmanın dışında kalma kararlılığımıza rağmen, [USA.GetAdjective] diplomatları [GER.GetAdjective] dostlarımızla bağlarımızı koparmamız için bize baskı yapmaya devam ediyor. Bu sabah, Amerikan kıtasında barışı korumak için [GER.GetName]'e karşı bir ambargo durumu uygulamamız kesin bir dille istendi. Bu bizi zor bir duruma soktu ve bu savaşın dışında kalmak her geçen gün daha da zorlaşıyor."
 ARG_political_events.2.t:0 "[USA.GetName], [GER.GetAdjective] ambargosu talep ediyor!"
 ARG_political_events.20.a:0 "Excelente!"
 ARG_political_events.20.desc:0 "[URG.GetAdjective] hükümeti, ültimatomumuzda belirttiğimiz şartları kabul etmeye karar verdi. Artık [GER.GetAdjective] müttefiklerimizin yıllar önce hazırladığı sömürge planını resmi olarak uygulayabiliriz. Bu gelişmeden kesinlikle memnun olacaklardır."
 ARG_political_events.20.t:0 "[URG.GetNameDefCap] Ültimatom Şartlarını Kabul Ediyor"
 ARG_political_events.21.a:0 "Geri çekil, buna değmez..."
 ARG_political_events.21.b:0 "Bizi reddettikleri için pişman olacaklar!"
 ARG_political_events.21.desc:0 "[URG.GetAdjective] hükümeti, onlara sunduğumuz şartları reddetmeye karar verdi. Eğer bu eylem tarzını değersiz bulursak, o zaman sadece geri çekilebiliriz. Aksi takdirde, birliklerimizi bir işgale hazırlayalım."
 ARG_political_events.21.t:0 "[URG.GetNameDefCap] Ültimatom Şartlarını Reddediyor"
 ARG_political_events.22.a:0 "Değerli müttefikler olduklarını kanıtlıyorlar."
 ARG_political_events.22.desc:0 "[GER.capital.GetCapitalVictoryPointName]'daki [ARG.GetAdjective] büyükelçisi bu sabah, [ARG.GetNameDef]'in, ülke için önceki sömürge planlarımız adına [URG.GetNameDef] ulusunu kukla yaptığı haberiyle bize yaklaştı. Bu harika bir haber, çünkü kıtada daha büyük bir [GER.GetAdjective] nüfuzuna olanak tanıyacak."
 ARG_political_events.22.t:0 "[ARG.GetNameDefCap] Sömürge Planını Uyguladı"
 ARG_political_events.23.a:0 "İçim rahatladı..."
 ARG_political_events.23.desc:0 "Yerimizi koruduktan sonra, [ARG.GetAdjective] hükümeti bu eylem tarzını sürdürmenin değmeyeceğine karar vermiş gibi görünüyor. Artık tehdidin şimdilik bastırıldığını bilerek rahat uyuyabiliriz."
 ARG_political_events.23.t:0 "[ARG.GetNameDefCap] Geri Çekiliyor"
 ARG_political_events.24.a:0 "Onlara katılmak faydalı olur."
 ARG_political_events.24.b:0 "[ARG.GetNameDef] ile asla aynı tarafta olmayacağız!"
 ARG_political_events.24.desc:0 "[ARG.GetNameDef]'den, onlarla bir ittifaka katılmamızı davet etmek istediklerine dair haber aldık. Kabul edersek Tierra Del Fuego ve Santa Cruz'u bize devretmeyi teklif ettiler. Bu çok cazip bir teklif..."
 ARG_political_events.24.t:0 "[ARG.GetNameDefCap] Bir İttifak Arıyor"
 ARG_political_events.25.a:0 "[ARG.GetNameDef] ve [CHL.GetNameDef] birlikte duruyor!"
 ARG_political_events.25.desc:0 "Harika haber! [CHL.GetAdjective] hükümeti bir ittifakta bize katılmaya karar verdi. Birlikte kuzeydeki tehditlere karşı kardeşler olarak durabileceğiz. Bu önemli bir gün ve birleşik bir Güney Amerika için doğru yönde atılmış bir adım."
 ARG_political_events.25.t:0 "[CHL.GetNameDefCap] İttifakımıza Katılmayı Kabul Ediyor"
 ARG_political_events.26.a:0 "Ne kadar hayal kırıklığı..."
 ARG_political_events.26.desc:0 "[CHL.GetAdjective] hükümeti kıta genelindeki fetih hedeflerimizde bize katılmayı inatla reddetti. Bu girişimde ellerini zorlayamasak da, haklı savaşımızı onların kapısına kadar götürebiliriz. Her iki durumda da, bu iki ulusumuz arasındaki ilişkiler için üzücü bir gün."
 ARG_political_events.26.t:0 "[CHL.GetNameDefCap] İttifakımıza Katılmayı Reddediyor"
 ARG_political_events.27.a:0 "Onları durduramayız"
 ARG_political_events.27.b:0 "Egemenliğimizi imzayla teslim etmeyeceğiz."
 ARG_political_events.27.desc:0 "[ROOT.Capital.GetCapitalVictoryPointName]'daki [ARG.GetAdjective] büyükelçisine göre, mevcut hükümetimiz tahttan çekilecek ve yerine bir [ARG.GetAdjective] kuklası geçecek. Reddetmemizin savaş ilanıyla sonuçlanma olasılığı yüksek. Akıllıca seçmeliyiz."
 ARG_political_events.27.t:0 "[ARG.GetNameDefCap] Ültimatom Veriyor"
 ARG_political_events.28.a:0 "Excelente!"
 ARG_political_events.28.desc:0 "[CHL.GetAdjective] hükümeti, ültimatomumuzda belirttiğimiz şartları kabul etmeye karar verdi. Topraklarını derhal kukla yapacağız ve mümkün olan en kısa sürede [ARG.GetAdjective] yönetimini kuracağız."
 ARG_political_events.28.t:0 "[CHL.GetNameDefCap] Ültimatom Şartlarını Kabul Ediyor"
 ARG_political_events.29.a:0 "Geri çekil, buna değmez..."
 ARG_political_events.29.b:0 "Bizi reddettikleri için pişman olacaklar!"
 ARG_political_events.29.desc:0 "[CHL.GetAdjective] hükümeti, onlara sunduğumuz şartları reddetmeye karar verdi. Uluslarının büyüklüğü ve gücü göz önüne alındığında, geri çekilmeyi seçebiliriz. Aksi takdirde birliklerimizi toplayıp bir işgal hazırlıklarına başlayabiliriz."
 ARG_political_events.29.t:0 "[CHL.GetNameDefCap] Ültimatom Şartlarını Reddediyor"
 ARG_political_events.3.a:0 "Sadece bir zaman meselesiydi."
 ARG_political_events.3.desc:0 "[ARG.GetName]'den Başkan [ARG.GetLeader] bugün, düşmanlarımıza karşı savaşımızda Müttefiklere katılmak için bir başvuruyla bize yaklaştı. Görünüşe göre bu tür bir zorluk karşısında Amerikan birliği taleplerimiz nihayet dinlendi."
 ARG_political_events.3.t:0 "[ARG.GetName] Müttefiklere Katılmayı Teklif Ediyor"
 ARG_political_events.30.a:0 "İçim rahatladı..."
 ARG_political_events.30.desc:0 "Yerimizi koruduktan sonra, [ARG.GetAdjective] hükümeti bu eylem tarzını sürdürmenin değmeyeceğine karar vermiş gibi görünüyor. Artık tehdidin şimdilik bastırıldığını bilerek rahat uyuyabiliriz."
 ARG_political_events.30.t:0 "[ARG.GetNameDefCap] Geri Çekiliyor"
 ARG_political_events.31.a:0 "Hellmuth'u serbest bırakın. Becerilerini kullanabiliriz."
 ARG_political_events.31.b:0 "Onu hapiste tutun. Tavrımızı koruyalım."
 ARG_political_events.31.desc:0 "Önceki hükümetimiz altında, [GER.GetAdjective] kökenli bir [ARG.GetAdjective] adam, [GER.GetNameDef]'e gizli bir görevle gönderildikten sonra bir gemide tutuklandı. Serbest bırakılması için pazarlık yapabilir ve yeni kurulan istihbarat teşkilatımızın saflarına katılmasına izin verebiliriz ya da onu hapiste bırakıp casuslara muamelemiz konusunda tavrımızı koruyabiliriz."
 ARG_political_events.31.t:0 "Osmar Hellmuth Sorusu"
 ARG_political_events.32.a:0 "Şartlarını kabul et. Başa çıkmamız gereken daha büyük tehditler var."
 ARG_political_events.32.b:0 "Adaları asla teslim etmeyeceğiz!"
 ARG_political_events.32.desc:0 "Bu sabah [ENG.Capital.GetCapitalVictoryPointName]'daki [ARG.GetAdjective] büyükelçisinden, [ARG.GetAdjective] hükümetinin Falkland ve Güney Georgia adalarını resmen işgal ettiğine dair haber aldık. Bu nedenle, bölgeyi onlara devretmemizi ve bu savaşa bir son vermemizi talep ediyorlar."
 ARG_political_events.32.t:0 "[ARG.GetNameDefCap] Adaların Teslimini İstiyor"
 ARG_political_events.33.a:0 "Zafer Bizimdir!"
 ARG_political_events.33.desc:0 "Bugün Falkland ve Güney Georgia adaları nihayet [ARG.GetAdjective]lerin eline geçti. [ENG.GetNameDefCap], barış karşılığında her ikisini de imzalayarak devretti. Bunu sağlayabiliriz, özellikle de bu haklı [ARG.GetAdjective] toprağı nihayet bize ait olduğuna göre."
 ARG_political_events.33.t:0 "[ENG.GetNameDefCap] Adaları Devretmeyi Kabul Ediyor"
 ARG_political_events.34.a:0 "Savaş devam ediyor"
 ARG_political_events.34.desc:0 "[ENG.GetAdjective]ler, Falkland ve Güney Georgia adalarını bize teslim etmeyi inatla reddettiler. Görünüşe göre kayıplarına rağmen, kan dökmeye devam etmeye hevesliler. Bu onların ayrıcalığıdır. Gerekirse onları [ENG.Capital.GetCapitalVictoryPointName]'e kadar geri püskürteceğiz."
 ARG_political_events.34.t:0 "[ENG.GetNameDefCap] Teslim Olmayı Reddediyor"
 ARG_political_events.35.a:0 "İstediğimizi aldık. Antlaşmayı imzala."
 ARG_political_events.35.b:0 "Bu savaşı [ENG.Capital.GetCapitalVictoryPointName]'e taşıyacağız!"
 ARG_political_events.35.desc:0 "Bir [ENG.GetAdjective] büyükelçisi bugün, bu savaşın sona ermesini garanti edebilirsek, Güney Atlantik adalarını bize devretme teklifiyle bize yaklaştı. Hedefimiz Falkland ve Güney Georgia adalarını almak olduğu için, bu bizim lehimize olur."
 ARG_political_events.35.t:0 "[ENG.GetNameDefCap] Adaları Devretmeyi Teklif Ediyor"
 ARG_political_events.36.a:0 "İçim rahatladı..."
 ARG_political_events.36.desc:0 "Neyse ki, [ARG.GetAdjective] hükümeti, belirlediğimiz şartlar altında savaşı durdurmayı kabul etti. Falkland ve Güney Georgia adalarından vazgeçmek üzücü olacak, ancak gücümüzü başka bir yere odaklamalıyız."
 ARG_political_events.36.t:0 "[ARG.GetNameDefCap] Barışı Kabul Ediyor"
 ARG_political_events.37.a:0 "Buna nasıl cüret ederler!"
 ARG_political_events.37.desc:0 "Korkunç haber. [ARG.GetAdjective] hükümeti, barış karşılığında adaları devretme teklifimizi reddetti. Daha fazla çatışmaya hazırlanmalı ve şimdi kaynaklarımızı başka bir cephede savunmak için harcamalıyız."
 ARG_political_events.37.t:0 "[ARG.GetNameDefCap] Düşmanlıklara Son Vermeyi Reddediyor"
 ARG_political_events.38.a:0 "Kesinlikle hayır."
 ARG_political_events.38.a.tt:0 "Bu, §Y[ARG.GetName]§! ile ilişkilerimizi zedeleyebilir..."
 ARG_political_events.38.b:0 "Kazandıklarımız için ödenecek küçük bir bedel"
 ARG_political_events.38.b.tt:0 "§YEkvator Ginesi§!'ni §Y[ARG.GetName]§!'e devreder!"
 ARG_political_events.38.desc:0 "[ARG.GetNameDefCap] liderliği bize ulaştı ve cumhuriyetçilere karşı son savaşımızdaki destekleri karşılığında Ekvator Ginesi'ndeki toprağımızın kontrolünü devretmemizi talep etti. Seçeneklerimizi dikkatlice düşünmek isteyebiliriz. "
 ARG_political_events.38.t:0 "[ARG.GetNameDef] Tazminat olarak Ekvator Ginesi'ni Talep Ediyor"
 ARG_political_events.39.a:0 "Ne kadar talihsiz..."
 ARG_political_events.39.desc:0 "Taleplerimiz [SPA.GetNameDef]'den kibirli bir retle karşılandı. [SPA.GetAdjective] liderliği, taleplerimizin çok yüksek olduğunu ve savaş sırasındaki çabalarımızla kıyaslanamayacağını iddia ediyor. "
 ARG_political_events.39.t:0 "[SPA.GetNameDefCap] Taleplerimizi Reddediyor"
 ARG_political_events.4.a:0 "Bu talihsiz bir durum."
 ARG_political_events.4.desc:0 "Bu sabah [USA.GetName]'den resmi bir ambargo bildirimi aldık. Küresel çatışmada tarafsız kalma kararımızın, Monroe Doktrini'nin temsil ettiği her şeyin antitezi olduğu belirtildi. Bu nedenle, bu yaptırım bir sonraki duyuruya kadar üzerimize konulmuştur. Görünüşe göre tarafsızlığa olan bağlılığımız kuzeydeki komşularımızı kızdırdı."
 ARG_political_events.4.t:0 "[USA.GetName] bize ambargo uyguluyor"
 ARG_political_events.40.a:0 "Afrika'daki dayanak noktamız halledildi!"
 ARG_political_events.40.desc:0 "Bize şanlı haberler ulaştı, [SPA.GetNameDef] taleplerimizi kabul etti ve son iç savaşlarındaki yardımlarımız karşılığında Ekvator Ginesi'nin mülkiyeti bize verildi. "
 ARG_political_events.40.t:0 "[SPA.GetNameDefCap] Taleplerimizi Kabul Ediyor"
 ARG_political_events.41.a:0 "Bu, Devrim yolumuza yardımcı olacak!"
 ARG_political_events.41.desc:0 "1931'de Rodolfo Ghioldi, sosyalist eğilimleri nedeniyle hayatı tehdit edildikten sonra [ARG.GetNameDef]'den kaçtı. Bu arada, Getúlio Vargas'ı hükümetteki konumundan indirmek için [BRA.GetNameDef]'de bir komünist ayaklanmayı desteklemek için çalıştı. Şimdi [ARG.GetNameDef]'deki siyasi manzara daha sola kaydığına göre, Ghioldi PCA'nın liderliğini devralmak için anavatanına dönmekten rahat olduğunu bildirdi."
 ARG_political_events.41.t:0 "Rodolfo Ghioldi [ARG.GetNameDef]'e Geri Dönüyor"
 ARG_political_events.42.a:0 "Yoldaş sosyalistlerimize yardım gönderelim."
 ARG_political_events.42.b:0 "Şu anda kimseyi ayıramayız..."
 ARG_political_events.42.desc:0 "[ARG.GetNameDef]'deki yoldaşlarımızdan, büyüyen devrimci hareketlerini desteklememizi umarak bize ulaştıklarına dair haber aldık. Bir iç savaş durumunda, kavgacı hükümetlerini devirmelerine yardımcı olmak için gönüllüler göndermemizi istiyorlar."
 ARG_political_events.42.t:0 "[ARG.GetNameDefCap] Ulaşıyor"
 ARG_political_events.43.a:0 "Harika!"
 ARG_political_events.43.desc:0 "Harika haber yoldaş! [SOV.GetNameDefCap], şanlı devrimimizi ilan ederken bir iç savaş çıkması durumunda gönüllü kuvvetler göndermeyi kabul etti! Bu, böyle bir olay ortaya çıkarsa bize biraz huzur vermeli."
 ARG_political_events.43.t:0 "[SOV.GetNameDefCap] Yardım Göndermeyi Kabul Ediyor"
 ARG_political_events.44.a:0 "Tek başımıza duruyoruz..."
 ARG_political_events.44.desc:0 "Talihsiz haber yoldaş. [SOV.GetNameDefCap], ülkemizde bir iç savaş çıkması durumunda gönüllü kuvvetler göndermeyi reddetti. Görünüşe göre, şanlı devrimimiz şiddete dönerse, burjuva zalimlerimize karşı tek başımıza durmak zorunda kalacağız..."
 ARG_political_events.44.t:0 "[SOV.GetNameDefCap] Yardım Göndermeyi Reddediyor"
 ARG_political_events.5.a:0 "Adalar onların."
 ARG_political_events.5.b:0 "Onları bedavaya bırakamayız..."
 ARG_political_events.5.c:0 "Kesinlikle hayır."
 ARG_political_events.5.desc:0 "Uzun yıllardır, Falkland ve Güney Georgia adaları [ENG.GetAdjective] egemen toprakları olmuştur. Ancak, görünüşe göre [ARG.GetAdjective] hükümeti, bu zorlu zamanlarda Güney Atlantik'i daha iyi güvence altına almalarını sağlamak için adaların kendi bakımları altına alınmasını resmen talep etti."
 ARG_political_events.5.t:0 "[ARG.GetName] Güney Atlantik Adaları'nın mülkiyetini talep ediyor"
 ARG_political_events.50.a:0 "Bir dahaki sefere daha iyi olacak..."
 ARG_political_events.50.desc:0 "Ne yazık ki, [FROM.FROM.GetName]'de bir işçi grevi başlatma girişimimiz tam olarak planlandığı gibi gitmedi. Konuşmacılarımız işe giderken birkaç kişinin dikkatini çekmeyi başardılar. Davamıza birkaç kişiyi çekmeyi başarmış olsak da, halkı baskıcı üst sınıflara karşı dönmeye ikna etmek için hala çok çalışmalıyız."
 ARG_political_events.50.t:0 "[FROM.FROM.GetName]'de Küçük İşçi Grevi"
 ARG_political_events.51.a:0 "Kitlelerle aramız ısınıyor."
 ARG_political_events.51.desc:0 "Yöneticiler ve faşist kışkırtıcılarla çatışmalara rağmen, [FROM.FROM.GetName]'deki işçi grevi önemli bir destekçi kalabalığını çekmeyi başardı. PCA liderliği, sınıf ayrımından arınmış bir ulusun geleceği hakkında birden fazla konuşma yaptı ve bunlar kalabalıktan tezahüratlar ve sloganlarla karşılandı. Yerel parti şubesi, mitingden bu yana üyeliğin arttığını zaten duyurdu."
 ARG_political_events.51.t:0 "[FROM.FROM.GetName]'de İşçi Grevi"
 ARG_political_events.52.a:0 "Yakında hedeflerimiz gerçekleşecek!"
 ARG_political_events.52.desc:0 "Öfkeli bir hoşnutsuz işçi kalabalığından gelen sloganlar ve bağırışlar, PCA için büyük bir destek dalgası yarattı. Fabrika katları boşaldı, ofisler terk edildi ve kırsal çiftçiler hakları için ayağa kalkmak ve yönetici sınıfa karşı öfkelerini göstermek için bir araya geldiler. Devrime destek her geçen gün artarken nüfuzumuzun haberi yayılıyor..."
 ARG_political_events.52.t:0 "[FROM.FROM.GetName]'de Büyük İşçi Grevi"
 ARG_political_events.6.a:0 "Mükemmel!"
 ARG_political_events.6.desc:0 "Falkland ve Güney Georgia adalarının kontrolünü ele geçirme önerimiz [FROM.GetAdjective] hükümeti tarafından kabul edildi. Artık adalar Arjantin'in hakkı olduğuna göre, bu çatışma sırasında sularımızı korumak için çalışmalara başlayabiliriz."
 ARG_political_events.6.t:0 "[FROM.GetName] teklifimizi kabul ediyor!"
 ARG_political_events.60.a:0 "Birlikte duralım!"
 ARG_political_events.60.b:0 "Tek başımıza gitmeliyiz."
 ARG_political_events.60.desc:0 "[ARG.GetNameDefCap], komünist birliklerine katılmamız için bizi davet ederek bize ulaştı. Devrimci kardeşlerimizle el ele verelim mi?"
 ARG_political_events.60.t:0 "[ARG.GetNameDefCap] bizi İttifaklarına davet ediyor"
 ARG_political_events.61.a:0 "Birlikte Devrimin ideallerini savunacağız."
 ARG_political_events.61.desc:0 "[FROM.GetNameDefCap], birliğimize katılma teklifimizi lütfederek kabul etti ve şimdi tarihin yıllıklarında birlikte duruyoruz."
 ARG_political_events.61.t:0 "[FROM.GetNameDefCap] teklifimizi kabul ediyor"
 ARG_political_events.62.a:0 "Zamanımızı bekleyelim..."
 ARG_political_events.62.desc:0 "[FROM.GetNameDefCap], sosyalist cumhuriyetler birliği olarak bir araya gelme teklifimizi reddetti. Bu kıtada gücü kimin elinde tuttuğunu fark etmiyorlar mı? Belki zamanla onlara gösteririz."
 ARG_political_events.62.t:0 "[FROM.GetNameDefCap] teklifimizi reddediyor"
 ARG_political_events.7.a:0 "Harika değil, ama kabul edeceğiz."
 ARG_political_events.7.desc:0 "[FROM.GetAdjective]'yi adaların [ARG.GetName]'ye ait olması gerektiğine ikna etme çabalarımıza rağmen, hükümetleri ödeme karşılığında araziyi devretmeyi teklif etti. Bu ekonomimize küçük bir darbe olur ama bu bölgeye sahip olmak uzun vadede bize daha çok fayda sağlayacaktır."
 ARG_political_events.7.t:0 "[FROM.GetName] adalar için ödeme yapmamızı talep ediyor."
 ARG_political_events.70.a:0 "Fanny Edelman iktidarda kalmalı."
 ARG_political_events.70.b:0 "Antonio Soto çok daha iyi bir seçim."
 ARG_political_events.70.desc:0 "Nihayet, yeni komünist hükümetimiz, ilk Buenos Aires Konferansı'nı açabileceğimiz bir istikrar düzeyine ulaştı. Burada PCA'nın geleceğine ve önümüzdeki yıllarda ülkeyi kimin yönetebileceğine karar verebiliriz. Bu yıl, [ARG.GetNameDef]'in geleceği için farklı fikirlere sahip iki güçlü adayımız var. Mevcut liderimiz Fanny Edelman, statükoyu sürdürecek, istikrar sunacak ve [ARG.GetNameDef]'i dünya sahnesinde odaklayacak. Öte yandan Antonio Soto, [ARG.GetNameDef]'i Anarko-Sendikalizm yolunda ilerletmemiz gerektiğine inanan eski bir Patagonya isyancısıdır. [ARG.GetNameDef]'in başbakanı olarak görevi kim üstlenmeli?"
 ARG_political_events.70.t:0 "Buenos Aires Konferansı Başlıyor"
 ARG_political_events.71.a:0 "Tekrar hoş geldin Başbakan Edelman!"
 ARG_political_events.71.desc:0 "Ezici bir kararla, Fanny Edelman hükümetteki konumunu korumayı başardı. Görünüşe göre [ARG.GetNameDef] için istenen yol, istikrar ve büyümeye dayalı bir yoldur. Rakip aday Antonio Soto, Patagonya'ya döndü ve şimdilik Edelman'ın planlarına uymayı kabul etti."
 ARG_political_events.71.t:0 "Fanny Edelman Başbakan Olarak Kaldı"
 ARG_political_events.72.a:0 "Huzursuz ama yeni bir gelecek."
 ARG_political_events.72.desc:0 "Beklentilerin aksine, Antonio Soto konferansı kazanmayı başardı ve [ARG.GetNameDef]'de yeni lider olarak kuruldu, bu zamanla feshedilmesini hevesle beklediği bir unvandı. Soto, ülkeyi Anarko-Sendikalizm yolunu izleyerek ve sonunda ülke içinde her türlü hiyerarşiyi kaldırarak yeni bir yola sokmak istiyor."
 ARG_political_events.72.t:0 "Antonio Soto Arjantin Anarko-Sendikalizmini Kuruyor"
 ARG_political_events.73.a:0 "Hedeflerini alkışlıyoruz, elbette hem paktı hem de garantiyi alacaklar!"
 ARG_political_events.73.b:0 "Onlara bir saldırmazlık paktı teklif edebiliriz, ama daha fazlasını değil."
 ARG_political_events.73.c:0 "Bu biraz ileri gitmek oluyor."
 ARG_political_events.73.desc:0 "[ARG.GetAdjective] diplomatları, onlarla son ticaret anlaşmalarımızı takiben ve ideolojilerinin giderek bizimkine benzer hale gelmesiyle daha yakın bir işbirliği talep etmek için bize ulaştılar. Mevcut talep, ülkelerimiz arasında bir saldırmazlık paktı imzalanması ve bağımsızlıkları için bir garantidir."
 ARG_political_events.73.t:0 "[FROM.GetNameDefCap] Daha Yakın İşbirliği Arıyor"
 ARG_political_events.74.a:0 "Harika!"
 ARG_political_events.74.desc:0 "\n[FROM.GetNameDef]'den yeni bir yanıt aldık. Ülkemizi toparlama ve demokrasiye dönme konusundaki son çabalarımızı alkışlayarak taleplerimizi kabul etmeyi seçtiler. Bununla ülke güçlendi ve bize savaş ilan edilme olasılığı önemli ölçüde azalmalı."
 ARG_political_events.74.t:0 "[FROM.GetNameDefCap] Hem Bağımsızlığımızı Garanti Etmeyi Hem de Saldırmazlık Paktını Kabul Ediyor"
 ARG_political_events.74.tt:0 "[FROM.GetFlag]§Y[FROM.GetNameDefCap]§! şimdi bağımsızlığımızı garanti ediyor! \n[FROM.GetFlag]§Y[FROM.GetNameDefCap]§! ile bir §YSaldırmazlık Paktı§! imzaladık!!"
 ARG_political_events.75.a:0 "Hiç yoktan iyidir..."
 ARG_political_events.75.desc:0 "[FROM.GetNameDef]'den yeni bir yanıt aldık. Ülkemizi toparlama ve demokrasiye dönme konusundaki son çabalarımızı alkışlayarak taleplerimizi kabul etmeyi seçtiler, ancak sadece kısmen. Bir saldırmazlık paktı imzalandı ancak ne yazık ki şimdilik bağımsızlığımızı garanti etmeyecekler."
 ARG_political_events.75.t:0 "[FROM.GetNameDefCap] Saldırmazlık Paktını Kabul Ediyor"
 ARG_political_events.75.tt:0 "[FROM.GetFlag]§Y[FROM.GetNameDefCap]§! ile bir §YSaldırmazlık Paktı§! imzaladık!!"
 ARG_political_events.76.a:0 "Ne kadar talihsiz."
 ARG_political_events.76.desc:0 "[FROM.GetNameDef]'den yeni bir yanıt aldık. Demokrasimizi yeniden kurma çabalarımızı alkışlıyorlar ancak bağımsızlığımızı garanti etmelerinin veya bizimle bir saldırmazlık paktı yapmalarının kendileri için faydalı olacağını düşünmüyorlar."
 ARG_political_events.76.t:0 "[FROM.GetNameDefCap] Daha Yakın İşbirliği Talebimizi Reddediyor"
 ARG_political_events.8.a:0 "Hayal kırıklığı."
 ARG_political_events.8.desc:0 "Ne yazık ki önerimiz dikkate alınmadı. [FROM.GetAdjective] hükümeti adaların kendi korumaları altında kalmasının en iyisi olduğuna karar verdi. Bu hayal kırıklığı yaratsa da en azından müttefiklerimizin yakında olduğunu biliyoruz."
 ARG_political_events.8.t:0 "[FROM.GetName] adalardan vazgeçmeyi reddediyor."
 ARG_political_events.80.a:0 "Elektronik eğitimini finanse et."
 ARG_political_events.80.b:0 "Endüstriyel eğitimi finanse et."
 ARG_political_events.80.c:0 "Sentetik araştırmayı finanse et."
 ARG_political_events.80.desc:0 "Yeni seçilen hükümetin en önemli politikalarından biri, [ARG.GetNameDef] içindeki eğitimin geleceğidir. Akademiye olan fonlarımızın son zamanlarda biraz eksik olduğu bir sır değil ve bu yüzden hibeleri nereye yönlendirmek istediğimize ve nihayetinde okul sistemimizin neyi geliştirmeye odaklanacağına karar vermek bize düşüyor."
 ARG_political_events.80.t:0 "Güçlendirilmiş Eğitim Hibeleri"
 ARG_political_events.81.a:0 "İyi harcanmış para."
 ARG_political_events.81.desc:0 "En yeni eğitim hibemizi açtığımızda, ülke genelindeki akademisyenlerden büyük övgü aldık. İnsanları elektronik teknolojisinin harikaları konusunda eğitmeye odaklanmayı seçtiğimiz için, araştırma departmanlarımızda ilerlemede istikrarlı bir patlama bekleyebiliriz."
 ARG_political_events.81.t:0 "Elektronik Eğitimi Hibesi"
 ARG_political_events.82.a:0 "İyi harcanmış para."
 ARG_political_events.82.desc:0 "En yeni eğitim hibemizi açtığımızda, ülke genelindeki akademisyenlerden büyük övgü aldık. İnsanları yeni endüstriyel gelişmelerin verimliliği konusunda eğitmeye odaklanmayı seçtiğimiz için, araştırma departmanlarımızda ilerlemede istikrarlı bir patlama bekleyebiliriz."
 ARG_political_events.82.t:0 "Endüstriyel Eğitim Hibesi"
 ARG_political_events.83.a:0 "İyi harcanmış para."
 ARG_political_events.83.desc:0 "En yeni eğitim hibemizi açtığımızda, ülke genelindeki akademisyenlerden büyük övgü aldık. İnsanları modern sentetik arıtma konusunda eğitmeye odaklanmayı seçtiğimiz için, araştırma departmanlarımızda ilerlemede istikrarlı bir patlama bekleyebiliriz."
 ARG_political_events.83.t:0 "Sentetik Araştırma Hibesi"
 ARG_political_events.9.a:0 "Kalan birliklerimizi toplayın!"
 ARG_political_events.9.desc:0 "Ramón Castillo'nun hükümet içindeki gücünü pekiştirmesinin bir sonucu olarak, ülkenin askeri liderleri arasındaki sürekli büyüyen hoşnutsuzluk ateşine yakıt eklendi. Yeter artık dediler ve ellerinden geldiğince çok güç topladıktan sonra, Buenos Aires'e yürümek için bir isyan gücü başlattılar! Görünüşe göre [ARG.GetAdjective] İç Savaşı başladı."
 ARG_political_events.9.t:0 "İç Savaş Kapımızda"
 ARG_political_events.90.a:0 "Kuvvetlerimiz her zamankinden daha güçlü."
 ARG_political_events.90.desc:0 "Bizimle ilişkilerini güçlendirmek amacıyla, [ARG.GetNameDef]'den [ARG.GetLeader], donanmamızı ve hava kuvvetlerimizi eğitmek için ortak askeri tatbikatlar düzenlemeyi teklif etti. Bu sıcak jest, bu kararan günlerde çok hoş karşılandı."
 ARG_political_events.90.t:0 "[ARG.GetNameDef] ile Ortak Askeri Tatbikatlar"
 BRA_end_of_cangaco_tt:0 "§Y$BRA_cangaceiro_mission$§! kalıcı olarak devre dışı bırakılacak ve Cangaço'nun daha fazla eyalete yayılması önlenecektir."
 BRA_jaguar_diplomacy_in_progress:0 "Jaguar Diplomasisi kararı devam ediyor"
 BRA_rejected_monarchism:0 "§R Monarşist hareketi yasakladı.§!"
 BRA_war_embargo_with_usa_tt:0 "§RBu, [USA.GetNameDef]'in savaş ilan etmesine veya bize ambargo uygulamasına yol açabilir!§!"
 CHL_approached_by_mysterious_frenchman:0 "Şili iç savaşı sırasında Jacques Antoine Bernard tarafından yaklaşıldı."
 CHL_can_becocme_communist_tt:0 "§YBaşkanlık Yetkilerini Artır§! odağıyla komünist §Golabilirsiniz§!"
 CHL_fascist_and_communist_joint_civil_war_started:0 "Bir Anti-Ibáñist İç Savaşı zaten başladı"
 CHL_mapuche_commuist_cultural_cross_pollination:0 "Mapuçeler Komünistlerle işbirliği yapmaya istekli"
 CHL_news_events.1.a:0 "Kesinlikle ilginç bir gelişme"
 CHL_news_events.1.b:0 "Şanımızı geri alacağız!"
 CHL_news_events.1.d:0 "[CHL.GetLeader] liderliğindeki Movimiento Nacional-Socialista'nın başarılı bir darbe gerçekleştirdiği ve [CHL.GetNameDef]'i kendileri tarafından yönetilen tek partili bir devlet olarak kurduğu yönünde raporlar geldi. Küresel faşist hareketle bağları var, ancak dünya güçlerinden herhangi birine katılıp katılmayacakları veya kendi kıtalarında kalıp kalmayacakları hala belirsiz."
 CHL_news_events.1.t:0 "[CHL.GetNameDef]'de Faşist Darbe"
 CHL_news_events.2.a:0 "Kesinlikle zorlama..."
 CHL_news_events.2.b:0 "Kimse bize karşı duramaz!"
 CHL_news_events.2.d:0 "[CHL.GetLeader], eski Şili Krallığı'nın restorasyonunu duyurdu; bu, Şilililerin eski İspanyol Peru Valiliği'nden bu yana Arjantin'in büyük bir bölümünü talep ettiği irredentist bir fikirdir ve [CHL.GetNameDef] talep edilen toprakların entegrasyonuna başlamıştır. Ancak emelleri burada bitmiyor, çünkü Rio de la Plata bölgesinden daha fazlasını talep ediyorlar."
 CHL_news_events.2.t:0 "Şili Eski Krallığın Geri Getirildiğini İlan Ediyor"
 CHL_news_events.3.a:0 "Kim olduklarını sanıyorlar?"
 CHL_news_events.3.b:0 "Biz yeni bir dünya gücüyüz!"
 CHL_news_events.3.d:0 "Bugünden itibaren, [CHL.GetLeader] [CHL.GetNameDef]'in oluşumunu duyurdu ve yeni bir dünya gücü olduğunu iddia ediyor. Hedeflerinin tüm Hispanik ve Latin Amerika halkını yabancı baskısından kurtarmak olduğunu ve görevlerinin henüz sona ermediğini belirttiler."
 CHL_news_events.3.t:0 "[CHL.GetNameDefCap]'in Oluşumu"
 CHL_news_events.4.a:0 "Endişe verici..."
 CHL_news_events.4.b:0 "İhtiyacı olanlara özgürlük ve refah getireceğiz!"
 CHL_news_events.4.d:0 "[CHL.GetNameDef]'den [CHL.GetLeader], devletin Anti-Emperyalist bir Haçlı Seferine gideceğini, bu seferde Amerika halkını Avrupa baskısından kurtaracaklarını duyurdu. Birçok kişi, sömürgecilik çağının gerçekten sona erip ermediğini veya bunun dünya güçleri için yolda sadece bir başka engel olup olmadığını merak ediyor."
 CHL_news_events.4.t:0 "Mapuçeler Emperyalizme Karşı Haçlı Seferi İlan Ediyor"
 CHL_news_events.5.a:0 "Ne?"
 CHL_news_events.5.b:0 "Geri döndük ve her zamankinden daha güçlüyüz!"
 CHL_news_events.5.desc:0 "1860'larda sadece kısa bir iki yıl var olmasına rağmen, eski tahtın talibi Jacques Antoine Bernard, kaosun ortasında Şili'ye döndü ve uzun zamandır kayıp olan krallığını geri aldı. Bunun nasıl sonuçlanacağını sadece zaman gösterecek..."
 CHL_news_events.5.t:0 "Yeni Araucanía ve Patagonya Krallığı"
 CHL_news_events.6.a:0 "Bir kıvılcım çakıldı"
 CHL_news_events.6.b:0 "Gerçek bir facia"
 CHL_news_events.6.desc:0 "Tarafsız Şili konvoyu SS Tolten, Baltimore'dan New York Şehri'ne refakatsiz seyahat ederken, New Jersey, Barnegat açıklarında Alman denizaltısından gelen bir torpido ile köprünün yanından vuruldu. Gemi altı dakikada battı ve ancak battıktan sonra U-bot mürettebatı geminin Şilili olduğunu doğruladı. Bu, Almanlar için diplomatik bir felaket olabilir."
 CHL_news_events.6.t:0 "SS Tolten'in Batırılması"
 CHL_news_events.7.a:0 "İlginç bir Karar"
 CHL_news_events.7.b:0 "Rapa Nui'nin korunması gerekiyor"
 CHL_news_events.7.desc:0 "[CHL.GetNameDef]'den [CHL.GetLeader], ülkenin, [CHL.GetAdjective] ve [RAP.GetAdjective] egemenliğinin proaktif bir savunma politikasını uygulayacağını, Pasifik Sahası'nda potansiyel tehdit olarak gördüğü uluslara resmen savaş ilan ederek, savaşı kendi topraklarında değil, potansiyel saldırganlarına götürmeyi tercih ettiğini duyurdu."
 CHL_news_events.7.t:0 "[CHL.GetNameDefCap] Proaktif Savunmayı Uyguluyor"
 CHL_political_events.1.a:0 "Bunda kesinlikle bir sakınca görmüyoruz"
 CHL_political_events.1.b:0 "Deli mi bunlar!?"
 CHL_political_events.1.desc:0 "[CHL.GetNameDef]'den [CHL.GetLeader], sularımızı ve topraklarımızı korumak amacıyla, aynı zamanda birbirimizin yakın müttefikliğinden kopmadan ve ülkelerimiz arasındaki karşılıklı ilişkileri bozmadan, Müttefiklere karşılıklı bir başvuru önerdi. Taleplerini kabul etmek akıllıca olabilir."
 CHL_political_events.1.t:0 "[CHL.GetNameDefCap] Karşılıklı bir İttifak Öneriyor"
 CHL_political_events.10.a:0 "Eğer istedikleri tazminatsa, alabilirler"
 CHL_political_events.10.b:0 "Onlar gibi zayıflara boyun eğmeyiz"
 CHL_political_events.10.desc:0 "[CHL.GetAdjective] lideri [CHL.GetLeader], geçen hafta Şili kargo gemisi SS Tolten'in batırılması için bir özür ve tazminat talep ederek bize resmi olarak ulaştı. Uluslararası standartlara uymamızın bizim sorumluluğumuz olduğunu ve denizaltı savaşı konusundaki uygunsuz eylemlerimizi yansıtmamız gerektiğini belirtiyor."
 CHL_political_events.10.t:0 "[CHL.GetName] SS Tolten için Tazminat Talep Ediyor"
 CHL_political_events.11.a:0 "Belki de sonuçta mantıklıdırlar"
 CHL_political_events.11.desc:0 "[GER.GetLeader], ne kadar olası görünmese de, resmi bir özür diledi ve ayrıca gemi ve Tolten olayında Şili için kaybedilen canlar karşılığında ekonomik tazminat sağlamayı kabul etti."
 CHL_political_events.11.t:0 "[GER.GetName] Bize Tazminat Veriyor"
 CHL_political_events.12.a:0 "Eh, ne yapalım"
 CHL_political_events.12.desc:0 "[GER.GetLeader] her zamanki tiradlarından birine başladı, Şili hükümetinin zayıf fikirli ve kırılgan olduğunu ve doğuştan değeri çok az olan veya hiç olmayan bir ülkeye tazminat sağlamaya gerek olmadığını iddia etti. Şu anda bu iddiaları çürütme gücümüz pek yok ve bunu tırmandırmak çocukça olurdu..."
 CHL_political_events.12.t:0 "[GER.GetName] Bize Tazminat Vermeyi Reddediyor"
 CHL_political_events.13.a:0 "Bir daha bizi rahatsız etmemeliler"
 CHL_political_events.13.desc:0 "Şili Ulusal Sosyalist Hareketi bir darbe girişiminde bulundu, ancak boşuna. Carabineros'umuz, işgal edilen Şili Üniversitesi önündeki bir çatışma ve kuşatmadan kaynaklanan sınırlı kayıplarla isyanlarını bastırdı. Óscar Novoa Fuentes ve Humberto Arriagada Valdivieso, savaş sırasında kuvvetlerimize komuta etti ve yeterince ödüllendirilecekler."
 CHL_political_events.13.t:0 "Seguro Obrero Katliamı"
 CHL_political_events.14.a:0 "En yakın arkadaşlarınla bile savaşmaya hazırlan!"
 CHL_political_events.14.desc:0 "Şili Ulusal Sosyalist Hareketi bir darbe girişiminde bulundu, ancak boşuna. Başkentten kovulduklarında, rejimimize savaş ilan etmek için geniş çaplı popülerliklerini kullandılar ve bu nedenle, bazılarının korktuğu ölçekte olmasa da, bir iç savaşla karşı karşıyayız."
 CHL_political_events.14.t:0 "Nacista Ayaklanması"
 CHL_political_events.15.a:0 "Ucu ucuna kurtulduk..."
 CHL_political_events.15.desc:0 "Şili Ulusal Sosyalist Hareketi bir darbe girişiminde bulundu, ancak boşuna. Carabineros'umuz isyanlarını bastırdı, ancak Nacistaların işgalinden sonra Şili Üniversitesi arazisi için büyük ölçekli bir savaşa dönüşen olay sırasında ağır kayıplar verdi. Şimdilik geri çekildiler, ancak daha sonra tekrar böyle bir şey deneyeceklerinden emin değiliz."
 CHL_political_events.15.t:0 "Seguro Obrero Savaşı"
 CHL_political_events.16.a:0 "Juan Antonio Ríos"
 CHL_political_events.16.b:0 "Eduardo Cruz-Coke"
 CHL_political_events.16.c:0 "Carlos Ibáñez del Campo"
 CHL_political_events.16.d:0 "Başkanlık seçimi bir kez daha geldi ve [ROOT.GetLeader]'in dönemi sona erdi. Krizlerin çoğu şimdi halledildi, ancak dünya genelinde savaş varken, istikrar henüz bulunamadı. Bu görev için Alessandri'nin yerini kim almalı ve ülkeyi büyük bir geleceğe kim götürmeli?"
 CHL_political_events.16.e:0 "Elías Lafertte Gaviño"
 CHL_political_events.16.t:0 "1942 Başkanlık Seçimi"
 CHL_political_events.17.a:0 "Gabriel González Videla"
 CHL_political_events.17.b:0 "Eduardo Cruz-Coke"
 CHL_political_events.17.c:0 "Fernando Alessandri"
 CHL_political_events.17.desc:0 "Başkanlık seçimi bir kez daha geldi ve [ROOT.GetLeader]'in dönemi sona erdi. Küresel çatışma sona yaklaşıyor, ama henüz bitmedi. Şu anda herkesin aklındaki soru şu: Bu bir sonraki görev için Alessandri'nin yerini kim almalı ve ülkeyi bu ürpertici zamanlarda kim yönetmeli?"
 CHL_political_events.17.e:0 "Marmaduke Grove Vallejo"
 CHL_political_events.17.t:0 "1946 Başkanlık Seçimi"
 CHL_political_events.18.a:0 "Carlos Fuentes Rabe"
 CHL_political_events.18.b:0 "Escudero Oscar Otárola"
 CHL_political_events.18.c:0 "Guilliermo Barrios Tirado"
 CHL_political_events.18.d:0 "Alfredo Portales Mourgues"
 CHL_political_events.18.desc:0 "Ordumuzda liderlik görevini ve sorumluluğunu üstlenmeye istekli birçok adam var ve ayrıca ülkemiz için son nefeslerine kadar savaşmaya hazır ve istekli birçok kişi var. Yeni bir başkanımız olduğu için, şimdi neredeyse beş yıldır bu pozisyonda olan Óscar Novoa Fuentes'in yerine bir halef seçmemiz gerekiyor. Ordularımızı bir numaralı komutan olarak kim yönetecek?"
 CHL_political_events.18.t:0 "Ordu için Yeni bir Başkomutan Seçimi"
 CHL_political_events.19.a:0 "Elías Lafertte Gaviño yeni Cumhuriyeti yönetecek"
 CHL_political_events.19.b:0 "Pedro Aguirre Cerda Halkın Favorisi"
 CHL_political_events.19.desc:0 "Ülke çapındaki eleştirilerden sonra, Arturo Alessandri istifa etti ve erken bir seçim çağrısında bulundu ve bu sefer rüzgarların sol kanadın lehine estiği görülüyor, çünkü halk sandıkların etrafında toplanıyor. Kim yönetecek ve bu olay yeni cumhuriyeti nasıl şekillendirecek?"
 CHL_political_events.19.t:0 "Değişim Rüzgarları"
 CHL_political_events.2.a:0 "Burada hoş karşılanırlar"
 CHL_political_events.2.b:0 "Hayır diyoruz!"
 CHL_political_events.2.desc:0 "Güney Amerika ülkeleri Şili ve Arjantin, fraksiyonumuza katılmak için ortak bir başvuruyla bize yaklaştılar. Kendi çıkarlarını korurken bize yardımcı olmak istediklerini belirtiyorlar. Biz ne diyoruz?"
 CHL_political_events.2.t:0 "Ortak bir Arjantin-Şili Başvurusu"
 CHL_political_events.20.a:0 "Elias Lafertte Gavino"
 CHL_political_events.20.b:0 "Marmaduke Grove Vallejo"
 CHL_political_events.20.c:0 "Carlos Contreras Labarca"
 CHL_political_events.20.d:0 "Manuel Hidalgo Plaza"
 CHL_political_events.20.desc:0 "Komünist parti bugün, mevcut geniş koalisyonun tüm noktalarda tam olarak anlaşamaması ve harekete geçip rehberlik sağlayacak birine ihtiyaç duyması nedeniyle, ülkenin önümüzdeki yıllarda izlemesi gereken yolu belirlemek ve ülkeyi ilerlemeye götürecek kişiyi seçmek amacıyla toplandı. Şu anda Marksist Elias Lafertte Gavino, Sosyalist Marmaduke Grove Vallejo, Stalinist Carlos Contreras Labarca ve Troçkist Manuel Hidalgo Plaza arasında bir seçim var."
 CHL_political_events.20.t:0 "Santiago Konferansı"
 CHL_political_events.21.a:0 "Tacna üzerindeki taleplerimizi ileri sürmeliyiz"
 CHL_political_events.21.b:0 "Onları kışkırtmaya değmez"
 CHL_political_events.21.desc:0 "[PRU.GetNameDef]'e ait birlikler dünden beri kendilerine ait olmayan bir eyalet olan Napo-Pastaza bölgesine girmeye başladı. Pasifik savaşından sonra, yakın zamanda bir anlaşmanın parçası olarak Tacna'dan vazgeçip onu Peru'ya geri vermek zorunda kaldık, ancak onlar uluslararası sınırlara saygı duymadıkları için bizim de duymamız gerekmiyor."
 CHL_political_events.21.t:0 "[PRU.GetName] Pastaza'ya Giriyor"
 CHL_political_events.22.a:0 "Yeni yoldaşlarımızı hoş karşılayacağız"
 CHL_political_events.22.b:0 "Neden Güney Amerika'yı umursayalım ki?"
 CHL_political_events.22.desc:0 "[CHL.GetLeader], [CHL.GetNameDef]'in ittifakımıza katılmasına izin vermemizi umarak bize ulaştı, böylece dünya devrimi adına silah arkadaşları olarak birlikte mücadele edebiliriz. Buna ne diyoruz?"
 CHL_political_events.22.t:0 "[CHL.GetNameDefCap] ittifakımıza katılmak istiyor"
 CHL_political_events.23.a:0 "Birlikte daha güçlü olacağız"
 CHL_political_events.23.desc:0 "[SOV.GetLeader] bugün politbüroya, birliğin [CHL.GetNameDef]'de yeni bir müttefiki olduğunu, Güney Amerika'ya bir bağlantısı ve gerekirse Amerikalılara karşı bir hazırlık üssü olduğunu duyurdu. Böylece, onların ittifakının bir parçasıyız ve kesinlikle birlikte gelişeceğiz."
 CHL_political_events.23.t:0 "Sovyetler Katılmamıza İzin Verdi"
 CHL_political_events.24.a:0 "Aldatıldık, sırtımızdan bıçaklandık ve muhtemelen kandırıldık..."
 CHL_political_events.24.desc:0 "[SOV.GetLeader] bugün politbüroya, ittifaklarına katılma talebimizi, küresel güvenliği tehdit edeceği ve düşmanlarıyla aralarındaki dengeyi olumsuz bir şekilde bozacağı gerekçesiyle geri çevirdiğini duyurdu."
 CHL_political_events.24.t:0 "Sovyetler Başvurumuzu Reddetti"
 CHL_political_events.25.a:0 "Onlara katılmalıyız!"
 CHL_political_events.25.b:0 "Daha yakın işbirliği yapılmalı"
 CHL_political_events.25.c:0 "Onlara ihtiyacımız yok"
 CHL_political_events.25.desc:0 "[CHL.GetLeader], Hispanik İşçi Cumhuriyeti'ni kurmak için onlara katılmamızı ve bir olmamızı talep ederek bize yaklaştı. Yabancı emperyalist güçlere karşı durmak istiyorsak katılmamız gerektiğini belirtti."
 CHL_political_events.25.t:0 "[CHL.GetName] onlarla bir olmamızı öneriyor"
 CHL_political_events.26.a:0 "Mükemmel"
 CHL_political_events.26.desc:0 "[FROM.GetNameDef]'den [FROM.GetLeader], ilhak teklifimizi kabul etmeye karar verdi ve ulusları daha sonra bizimkinin ayrılmaz bir parçası olacak. Çok yaşa devrim!"
 CHL_political_events.26.t:0 "[FROM.GetName] İlhakı Kabul Ediyor"
 CHL_political_events.27.a:0 "Yeterince iyi"
 CHL_political_events.27.desc:0 "[FROM.GetNameDef]'den [FROM.GetLeader], hakimiyet teklifimizi kabul etmeye karar verdi ve ulusları daha sonra bizim ayrılmaz bir ortağımız olacak. Çok yaşa devrim!"
 CHL_political_events.27.t:0 "[FROM.GetName] Hakimiyeti Kabul Ediyor"
 CHL_political_events.28.a:0 "Onları yok edeceğiz!"
 CHL_political_events.28.b:0 "Onlarla daha sonra ilgileneceğiz"
 CHL_political_events.28.desc:0 "[FROM.GetNameDef]'den [FROM.GetLeader], ilhak teklifimizi reddetmeye karar verdi. Onlarla nasıl başa çıkmalıyız?"
 CHL_political_events.28.t:0 "[FROM.GetName] Bize Karşı Çıkmayı Seçiyor"
 CHL_political_events.29.a:0 "Onlara yardım etmeliyiz"
 CHL_political_events.29.b:0 "Bizim yardımımıza ihtiyaçları yok"
 CHL_political_events.29.desc:0 "Şili partisi Movimiento Nacional-Socialista'ya ait faşistler, mevcut Şili hükümetine karşı bir darbe yapma planlarından bahsederek bize yaklaştılar. Bu girişimde bizden adam, teçhizat ve siyasi yardım şeklinde destek istiyorlar. Onlara yardım etmeli miyiz?"
 CHL_political_events.29.t:0 "Şilili Faşistler Desteğimizi İstiyor"
 CHL_political_events.3.a:0 "O zaman şüphesiz düşmanımızdırlar"
 CHL_political_events.3.desc:0 "Aşağılık [ARG.GetLeader], müttefiklere ortak bir başvuru için adil ve makul talebimizi reddetti ve neyi kaybettiğini anlamasının zamanı geldi. Zaten kendi başımıza daha güçlüyüz ve onlara hiçbir zaman ihtiyacımız olmadı..."
 CHL_political_events.3.t:0 "[ARG.GetName] talebimizi reddediyor"
 CHL_political_events.30.a:0 "Mükemmel"
 CHL_political_events.30.desc:0 "[FROM.GetNameDef]'den [FROM.GetLeader], mevcut hükümeti devirme ve Amerikalılara karşı durabilecek bir diktatörlük kurma çabalarımızda bize yardım etme sözü verdi."
 CHL_political_events.30.t:0 "[FROM.GetName] Bize Yardım Edecek"
 CHL_political_events.31.a:0 "İhanete uğradık"
 CHL_political_events.31.desc:0 "[FROM.GetNameDef]'den [FROM.GetLeader], mevcut hükümeti devirme ve Amerikalılara karşı durabilecek bir diktatörlük kurma çabalarımızda bize yardım etmeyi reddetmeyi seçti."
 CHL_political_events.31.t:0 "[FROM.GetName] Bize Yardım Etmemeyi Seçiyor"
 CHL_political_events.32.a:0 "İzin vereceğiz"
 CHL_political_events.32.b:0 "Onlar olmadan daha güçlüyüz"
 CHL_political_events.32.desc:0 "[CHL.GetNameDef]'den [CHL.GetLeader], ittifakımıza katılmak için bize geldi. Birlikte çok daha güçlü olacağımızı ve onların yardımıyla Amerikan hegemonyasını devirebileceğimizi iddia ediyor."
 CHL_political_events.32.t:0 "[CHL.GetName] Mihver'e katılmak istiyor"
 CHL_political_events.33.a:0 "Gerçekten de şanlı bir gün!"
 CHL_political_events.33.desc:0 "[GER.GetNameDef]'den [GER.GetLeader], bu günden itibaren [CHL.GetNameDef]'in, Amerika üzerinde tam kontrol elde etme girişiminde yardımcı olabilecek önemli bir müttefiki olacağını duyurdu. Bugünün, Amerika'nın demokrasileri için sonun başlangıcını işaretleyen gün olduğunu ve bugünün şanlı bir gün olduğunu belirtti."
 CHL_political_events.33.t:0 "[GER.GetLeader] Talebimizi Kabul Ediyor"
 CHL_political_events.34.a:0 "Buna pişman olacaklar..."
 CHL_political_events.34.desc:0 "[GER.GetNameDef]'den [GER.GetLeader], bu dünyanın geleceği için sahip oldukları planın bir parçası olmadığımız için ittifaklarına kabul edilmeyeceğimizi duyurdu. Dünyada ne planlıyorlar acaba?"
 CHL_political_events.34.t:0 "[GER.GetLeader] Talebimizi Reddediyor"
 CHL_political_events.35.a:0 "Birlikte, günü kazanacağız"
 CHL_political_events.35.b:0 "Gelecek sadece bizim"
 CHL_political_events.35.desc:0 "[CHL.GetNameDef]'den [CHL.GetLeader], yeni ittifakları olan Hispanik İttifakına katılmamız için bizi davet etti. Ne diyoruz?"
 CHL_political_events.35.t:0 "[CHL.GetNameDefCap] bizi Hispanik İttifakına davet ediyor"
 CHL_political_events.36.a:0 "Gelecek parlak görünüyor"
 CHL_political_events.36.desc:0 "[FROM.GetNameDef]'den [FROM.GetLeader], bize katılma teklifimizi lütfederek kabul etti ve şimdi tarihin yıllıklarında birlikte duruyoruz."
 CHL_political_events.36.t:0 "[FROM.GetNameDefCap] Hispanik İttifakına katılıyor"
 CHL_political_events.37.a:0 "Bizden korkmuyorlar mı?"
 CHL_political_events.37.desc:0 "[FROM.GetNameDef]'den [FROM.GetLeader], ittifakımız olan Hispanik İttifakına katılma teklifimizi aptalca bir şekilde reddetti. Tanrı zamanı gelince onları yargılayacaktır."
 CHL_political_events.37.t:0 "[FROM.GetNameDef] Hispanik İttifakına katılmayı reddediyor"
 CHL_political_events.38.a:0 "Birlikte, ABD'yi devirebiliriz!"
 CHL_political_events.38.b:0 "Bu çok riskli..."
 CHL_political_events.38.desc:0 "[CHL.GetLeader], Hispanik işlerine Amerikan müdahalesini engellemek için [GET.GetNameDef] ittifakının bir parçası olarak onlara katılmamızı davet etti. Daha zayıf ve daha bölünmüş olmamıza rağmen, birlikte çalıştığımız sürece Amerika Birleşik Devletleri'ni yenebileceğimizi iddia ediyorlar."
 CHL_political_events.38.t:0 "[CHL.GetName] Bizi [GER.GetAdjective] İttifakına Davet Ediyor"
 CHL_political_events.39.a:0 "Kıtamızı savunacağız!"
 CHL_political_events.39.desc:0 "[FROM.GetNameDef]'den [FROM.GetLeader] makul bir adam ve bizimle işbirliği yapmanın en akıllıca olduğu sonucuna vardı. Öne sürdüğümüz tüm belgeleri imzaladı ve şimdi yarımküremizin savunmasında yardım edecek."
 CHL_political_events.39.t:0 "[FROM.GetName] İttifakımıza Katılıyor!"
 CHL_political_events.4.a:0 "Onlarla savaşmanın bir anlamı yok"
 CHL_political_events.4.b:0 "Cesaretin varsa gel al!"
 CHL_political_events.4.desc:0 "[CHL.GetAdjective] devletine ait birlikler, [953.GetName]'deki daha önce kurulmuş sınırları geçmeye başladı ve hava kuvvetleri ile donanmaları zaten seferber edildi. Tartışmalı adanın kontrolünü ele geçirme konusunda ciddi görünüyorlar ve bu noktada arabuluculuk yoluyla bunu durdurup durduramayacağımız belli değil. Hareket tarzımız ne olmalı?"
 CHL_political_events.4.t:0 "[CHL.GetName] [953.GetName]'i İşgal Etmek İçin Harekete Geçiyor"
 CHL_political_events.40.a:0 "Ne yapalım..."
 CHL_political_events.40.desc:0 "[FROM.GetNameDef]'den [FROM.GetLeader] aptal bir adam ve Amerikan Emperyalizminden acı çekmektense onlara karşı savaş riskine girmemeyi tercih etti. Ancak görünen duruşları hakkında pek bir şey yapılamaz, bu yüzden soruyu orada bırakmamız gerekecek."
 CHL_political_events.40.t:0 "[FROM.GetName] İttifakımıza Katılmamayı Seçiyor"
 CHL_political_events.41.a:0 "Başka seçeneğimiz yok"
 CHL_political_events.41.b:0 "Faşistlere direnmek zorundayız!"
 CHL_political_events.41.desc:0 "[CHL.GetLeader] ve [GER.GetLeader], Uruguay'ın onlara boyun eğmesi yönünde ortak bir talepte bulundular. Görünüşe göre bizden bir [GER.GetAdjective] himayesi olmamızı talep ediyorlar. Baskılarına boyun eğiyor muyuz?"
 CHL_political_events.41.t:0 "[CHL.GetName], [GER.GetNameDef]'e boyun eğmemizi talep ediyor"
 CHL_political_events.42.a:0 "Mükemmel"
 CHL_political_events.42.desc:0 "[URG.GetLeader] bugün [URG.GetNameDef] başkanı olarak istifasını resmen açıkladı ve iktidarı [GER.GetAdjective] destekli Arnulf Fuhrmann'a devrediyor."
 CHL_political_events.42.t:0 "[URG.GetName], [GER.GetNameDef]'e Boyun Eğiyor"
 CHL_political_events.43.a:0 "Das ist gut"
 CHL_political_events.43.desc:0 "[CHL.GetAdjective] hükümetinin uyguladığı baskı sayesinde, [URG.GetNameDef] ulusu, önceki yıllarda yazılan gizli sömürge planları uyarınca bize boyun eğmek zorunda kaldı. Bu, Amerika'daki nüfuzumuzu genişletmemize ve ABD'nin Güney Amerika'dan elini çekmesine yardımcı olacaktır."
 CHL_political_events.43.t:0 "[URG.GetName] Bize Boyun Eğiyor"
 CHL_political_events.44.a:0 "Buna nasıl cüret edersin!"
 CHL_political_events.44.desc:0 "Aptal [URG.GetLeader], [CHL.GetAdjective] ve [GER.GetAdjective] düşünürleri ve politikacıları tarafından tasavvur edilen yeni dünya düzenine karşı durmaya karar verdi. Gelgiti göremiyor ve dalgaların kıyıya çarpmasını göremeyecek."
 CHL_political_events.44.t:0 "[URG.GetName] Boyun Eğmeyi Reddediyor"
 CHL_political_events.45.a:0 "Memnuniyetle"
 CHL_political_events.45.b:0 "Başka planlarımız var"
 CHL_political_events.45.desc:0 "Güney Amerika'daki Hispanik ve Latin kardeşlerimiz, [CHL.GetAdjective]ler, [GER.GetNameDef] ile bir ittifaka katılmamızı talep ettiler, böylece kendi çıkarlarımızı mümkün olan en iyi şekilde korurken yeni bir dünya düzeni getirebiliriz. Ne diyoruz?"
 CHL_political_events.45.t:0 "[CHL.GetNameDef]'deki Kardeşlerimiz Bizi Mihver'e Davet Ediyor"
 CHL_political_events.46.a:0 "Harika"
 CHL_political_events.46.desc:0 "[FROM.GetNameDef]'den [FROM.GetLeader], teklifimizi kabul etmeye karar verdi ve [GER.GetNameDef] ile bir ittifakta bize katılıyor. Uzun zamandır kayıp olan kardeşler şimdi yeniden bir araya geldi, ama bu sefer daha eşit ve adil şartlarda!"
 CHL_political_events.46.t:0 "[FROM.GetName] Mihver'e katılıyor"
 CHL_political_events.47.a:0 "İmzalandı ve Mühürlendi"
 CHL_political_events.47.b:0 "Şu anda değil."
 CHL_political_events.47.desc:0 "[CHL.GetName], [FROM.GetName] ile bir anlaşmaya aracılık etti. [FROM.GetName]'i, geleceğin Mihver ile yattığına ikna ettiler. Sadece kabullerini mürekkeple imzalamamız gerekiyor."
 CHL_political_events.47.t:0 "[CHL.GetName], [FROM.GetName]'i Mihver'e davet etmek istiyor"
 CHL_political_events.48.a:0 "O zaman bunu tek başımıza yapmak zorunda kalacağız"
 CHL_political_events.48.desc:0 "Ne yazık ki, onlara duygusal çağrımıza rağmen, [FROM.GetLeader] ve halkı onlarsız daha iyi olduklarına karar verdiler ve bu karara neden geldiklerine dair ayrıntıya girmediler. Şimdilik [FROM,GetNameDef] ile yeniden bir araya gelmeyeceğiz."
 CHL_political_events.48.t:0 "[FROM.GetName] Mihver'e katılmıyor"
 CHL_political_events.49.a:0 "Birlikte, günü fethedeceğiz"
 CHL_political_events.49.b:0 "Gelecek sadece bizim"
 CHL_political_events.49.desc:0 "[CHL.GetNameDef]'den [CHL.GetLeader], yeni ittifakları olan Hispanik İttifakına katılmamız için bizi davet etti. Ne diyoruz?"
 CHL_political_events.49.t:0 "[CHL.GetNameDefCap] bizi Hispanik İttifakına davet ediyor"
 CHL_political_events.5.a:0 "Bugün Şili halkı için bir zafer günüdür!"
 CHL_political_events.5.desc:0 "[ARG.GetName], askeri gücümüz karşısında [953.GetName]'i elinde tutmanın acıya değmeyeceğine karar verdi ve birliklerini vilayetten çekerken görüldü. Bu, tartışmalı bölgeyi ilk kez bizim elimize bırakıyor ve entegrasyon kampanyaları derhal başlatılabilir."
 CHL_political_events.5.t:0 "[ARG.GetName] [953.GetName]'den Çekiliyor"
 CHL_political_events.50.a:0 "Harika"
 CHL_political_events.50.desc:0 "[FROM.GetNameDef]'den [FROM.GetLeader], bize katılma teklifimizi lütfederek kabul etti ve şimdi tarihin yıllıklarında birlikte duruyoruz."
 CHL_political_events.50.t:0 "[FROM.GetNameDefCap] Hispanik İttifakına katılıyor"
 CHL_political_events.51.a:0 "Bizden korkmuyorlar mı?"
 CHL_political_events.51.desc:0 "[FROM.GetNameDef]'den [FROM.GetLeader], ittifakımız olan Hispanik İttifakına katılma teklifimizi aptalca bir şekilde reddetti. Tanrı zamanı gelince onları yargılayacaktır."
 CHL_political_events.51.t:0 "[FROM.GetNameDefCap] Hispanik İttifakına katılmayı reddediyor"
 CHL_political_events.52.a:0 "Tekrar savaş riskine girmek istemiyoruz"
 CHL_political_events.52.b:0 "Bu, Arica'yı geri almak için şansımız!"
 CHL_political_events.52.desc:0 "Sınırımızdaki son büyük ölçekli seferberlik ve [CHL.GetAdjective] halkının hafta süren protestolarının ardından, [CHL.GetLeader], [CHL.GetNameDef]'in, şimdi haksız ve geçersiz olduğunu iddia ettikleri Lima antlaşmasında imzaladıkları [947.GetName] topraklarının kontrolünü geri almasının tam zamanı olduğunu duyurdu."
 CHL_political_events.52.t:0 "[CHL.GetName] [947.GetName]'i teslim etmemizi talep ediyor"
 CHL_political_events.53.a:0 "Büyüyoruz"
 CHL_political_events.53.desc:0 "[FROM.GetNameDef]'deki mevcut hükümet zayıf ve bunu hepimiz biliyoruz. Bize karşı savaşamayacakları açıktı ve bunu kendileri de anladılar. Böylece, bugünden itibaren, [947.GetName] departmanını resmi olarak bize devreden yeni bir anlaşma imzaladılar!"
 CHL_political_events.53.t:0 "[FROM.GetName] Taleplerimizi Kabul Ediyor"
 CHL_political_events.54.a:0 "Küstahlıklarının bedelini ödeteceğiz!"
 CHL_political_events.54.desc:0 "[FROM.GetAdjective] hükümeti inatla sahte Lima antlaşmasına sarılıyor ve [947.GetName]'i bize teslim etmeyi reddediyor. Bir güç gösterisine başvurmalı ve bölgeyi onlardan, ne pahasına olursa olsun almalıyız..."
 CHL_political_events.54.t:0 "[FROM.GetName] Taleplerimizi Reddediyor"
 CHL_political_events.55.a:0 "Onlarla savaş riskine girmek istemiyoruz"
 CHL_political_events.55.b:0 "Kaç kere tekrar etmeliyiz?"
 CHL_political_events.55.desc:0 "Sınırımızdaki son büyük ölçekli seferberlik ve [CHL.GetAdjective] halkının hafta süren protestolarının ardından, [CHL.GetLeader], [CHL.GetNameDef]'in [953.GetName]'i kendileri için işgal etmesinin tam zamanı olduğunu duyurdu. Onlara karşı çıkmaya çalışmalı mıyız?"
 CHL_political_events.55.t:0 "[CHL.GetName] [953.GetName]'i teslim etmemizi talep ediyor"
 CHL_political_events.56.a:0 "Bugün Seksen Bin yeni Şilili'yi karşılıyoruz"
 CHL_political_events.56.desc:0 "[ARG.GetNameDef]'deki hükümet makul olmaya karar verdi ve onu bize iyi bir şekilde teslim etti. Şimdi bastırmaya devam etme ve mükemmel [CHL.GetAdjective] devletini yaratana kadar taleplerimizi ileri sürme zamanı."
 CHL_political_events.56.t:0 "[FROM.GetName] Taleplerimize Boyun Eğiyor"
 CHL_political_events.57.a:0 "O zaman zorla almalıyız"
 CHL_political_events.57.desc:0 "[ARG.GetNameDef]'den [ARG.GetLeader], bir şekilde bize karşı durmanın akıllıca olacağına karar verdi ve bu yüzden ona yanlış insanlarla uğraştığını göstermeliyiz. İleri, Şili'nin erkekleri ve kadınları!"
 CHL_political_events.57.t:0 "[FROM.GetName] Taleplerimizi Reddediyor"
 CHL_political_events.58.a:0 "Geri çekil, bir savaşa değmez"
 CHL_political_events.58.b:0 "Yerlerinizi koruyun adamlarım!"
 CHL_political_events.58.desc:0 "Birliklerimiz, Santa Cruz'daki Lago del Desierto civarında [CHL.GetAdjective] birlikleriyle çatışmalar bildirdi. [CHL.GetAdjective] birliklerinin giderek daha doğuya doğru hareket ettiğini, görünüşe göre tüm vilayeti işgal etme girişiminde bulunduklarını belirtiyorlar."
 CHL_political_events.58.t:0 "Birliklerimiz Laguna del Desierto civarında çatışıyor"
 CHL_political_events.59.a:0 "Nihai hedefimize bir adım daha yakınız"
 CHL_political_events.59.desc:0 "Korkak [ARG.GetAdjective] birlikleri, sınır muhafızlarımızın provokasyonlarından sonra geri çekildi ve askerlerimiz neredeyse terk edilmiş Santa Cruz vilayetine girmeye başladı. Her cephede zaferler yaşıyoruz ve yakın gelecekte her şeyin çökmemesi için dua etmeliyiz."
 CHL_political_events.59.t:0 "[FROM.GetName] [954.GetName]'den çekiliyor"
 CHL_political_events.6.a:0 "Artık makul bir şekilde geri adım atamayız"
 CHL_political_events.6.desc:0 "[ARG.GetName], tartışmalı adaya sahip olma konumlarında meydan okumaya devam ediyor ve eğer istersek onu zorla almamız gerektiğini iddia etti. Halkımız bu dava etrafında toplandı ve politikacılar Arjantin devletinin dağılması için konuşmaya başladı."
 CHL_political_events.6.t:0 "[ARG.GetName] [953.GetName]'den Çekilmeyi Reddediyor"
 CHL_political_events.60.a:0 "Bölgeyi işgal etmek için harekete geç"
 CHL_political_events.60.b:0 "Onu daha sonra alacağız"
 CHL_political_events.60.desc:0 "Cesur ama aptal [ARG.GetAdjective] birlikleri, Laguna del Desierto civarında yerlerini korumaya karar verdiler. Birliklerimiz hala onlara ateş ediyor, ancak bir sonraki adımda ne yapacaklarına dair emir bekliyorlar."
 CHL_political_events.60.t:0 "[FROM.GetName] yerini koruyor"
 CHL_political_events.61.a:0 "Yapılacak en mantıklı şey bu"
 CHL_political_events.61.b:0 "Neden bunu yapalım ki tam olarak?"
 CHL_political_events.61.desc:0 "[CHL.GetNameDef]'den [CHL.GetLeader], [CHL.GetAdjective] halkının güvenliğini çok uzun süredir tehdit ettiğimizi ve artık böyle bir şeyin sona erme zamanının geldiğini ilan etti ve Patagonya bölgesini askerden arındırmamızın gerekli olduğunu iddia etti. Buna nasıl yanıt vermeliyiz?"
 CHL_political_events.61.t:0 "[CHL.GetName] Patagonya'nın askerden arındırılmasını talep ediyor"
 CHL_political_events.62.a:0 "Geldiklerini görmeyecekler"
 CHL_political_events.62.desc:0 "[FROM.GetAdjective] hükümeti taleplerimize boyun eğdi ve halkımıza daha fazla zarar vermeme sözüyle Patagonya'yı askerden arındırdı. Bu talepleri neden öne sürdüğümüzü henüz fark etmediler."
 CHL_political_events.62.t:0 "[FROM.GetName] Patagonya'yı askerden arındırıyor"
 CHL_political_events.63.a:0 "İlerlememizi engellemeyecek"
 CHL_political_events.63.desc:0 "[FROM.GetLeader], açık provokasyonlarımızı kınadı ve bu eylemlerle niyetimizin, gardları düştüğünde onları hızlı ve kolay bir şekilde yıldırım saldırısıyla vurmak olduğunun kolayca görüldüğünü belirtti. Ancak kazanmak için bunun böyle olmasına ihtiyacımız yok."
 CHL_political_events.63.t:0 "[FROM.GetName] Patagonya'yı askerden arındırmıyor"
 CHL_political_events.64.a:0 "Ne yazık ki daha acil endişelerimiz var. Bir ambargo yeterli olacaktır."
 CHL_political_events.64.b:0 "Egemenliğimiz tehdit edildi. Bu askeri bir yanıt gerektirir."
 CHL_political_events.64.desc:0 "[FROM.GetNameDef]'in diktatörü [From.GetLeader], yakınlardaki hazırlık alanlarından Panamá Kanalı gücümüze büyük bir saldırı başlatma cüretini gösterdi. Operasyonları başarılı oldu ve birliklerimiz karışıklık içinde geri çekiliyor. [FROM.GetAdjective]ler diğer topraklarımıza geçmiyor, bu yüzden bu genel bir işgalin başlangıcı değildi, ancak saldırı dünya çapında güç yansıtma yeteneğimizi zayıflattı ve bizi uluslararası sahnede küçük düşürdü."
 CHL_political_events.64.t:0 "Panamá Kanalı'nın [From.GetAdjective] tarafından Ele Geçirilmesi"
 CHL_political_events.65.a:0 "Ne yazık ki daha acil endişelerimiz var. Bir ambargo yeterli olacaktır."
 CHL_political_events.65.b:0 "Egemenliğimiz tehdit edildi. Bu askeri bir yanıt gerektirir."
 CHL_political_events.65.desc:0 "[FROM.GetNameDef]'in diktatörü [From.GetLeader], yakınlardaki hazırlık alanlarından [311.GetName] gücümüze büyük bir saldırı başlatma cüretini gösterdi. Operasyonları başarılı oldu ve birliklerimiz karışıklık içinde geri çekiliyor. [FROM.GetAdjective]ler diğer topraklarımıza geçmiyor, bu yüzden bu genel bir işgalin başlangıcı değildi, ancak saldırı dünya çapında güç yansıtma yeteneğimizi zayıflattı ve bizi uluslararası sahnede küçük düşürdü."
 CHL_political_events.65.t:0 "[311.GetName]'in [From.GetAdjective] tarafından Ele Geçirilmesi"
 CHL_political_events.66.a:0 "Uğruna savaşmaya değmez"
 CHL_political_events.66.b:0 "Ancak cesedimi çiğneyerek!"
 CHL_political_events.66.desc:0 "[CHL.GetLeader] bugün, Guyana topraklarının yasa dışı ve haksız işgali olduğunu iddia ettiği şeyi kınayan büyük bir konuşma yaptı. Bölgeyi bu an onlara teslim etmemizi talep ediyor, böylece halkı emperyalist baskıdan kurtarabilir."
 CHL_political_events.66.t:0 "[CHL.GetName] Guyana topraklarımızın kontrolünü talep ediyor"
 CHL_political_events.67.a:0 "Artık baskıdan kurtuldular"
 CHL_political_events.67.desc:0 "[FROM.GetNameDef]'den [FROM.GetLeader], bölgesel muhafızlarının Guyanalardan çekilme sürecinde olduğunu ve gözlerinde savaşmaya değmediği için bölgeyi bize devreden bir tören olacağını belirterek bize ulaştı."
 CHL_political_events.67.t:0 "[FROM.GetName] Taleplerimizi Kabul Ediyor"
 CHL_political_events.68.a:0 "Her zaman daha doğrudan bir yaklaşım vardır"
 CHL_political_events.68.desc:0 "[FROM.GetLeader], Guyana bölgesinin kendilerine ve müttefiklerine ait olduğu ve başka hiçbir güce ait olmadığı konusundaki duruşunda kararlı kalıyor. Görünüşe göre müzakere ve perde arkası taktikler artık işe yaramayacak..."
 CHL_political_events.68.t:0 "[FROM.GetName] Taleplerimizi Reddediyor"
 CHL_political_events.69.a:0 "Ah, bu sefalet"
 CHL_political_events.69.b:0 "Bunu tanımıyoruz!"
 CHL_political_events.69.desc:0 "[CHL.GetNamDef] tarafından tamamen ele geçirildikten sonra, Guyana toprağımızın yerel halkı galip tarafla aynı hizaya geldi ve artık taleplerimizi meşrulaştırmak için yapabileceğimiz pek bir şey kalmadı."
 CHL_political_events.69.t:0 "[CHL.GetName] Guyanalar üzerindeki kontrolü uyguluyor"
 CHL_political_events.7.a:0 "Bu iyiye işaret değil"
 CHL_political_events.7.d:0 "Orduda, halkın başkan seçimini açıkça eleştirerek ve sosyalizmin doğası gereği kötü olduğunu açıkça belirterek, her zaman apolitik kalma itibarını lekelemek isteyenlerin olduğu dikkatimize geldi. Bu insanlar açıkça sanrı görüyorlar, ancak başka bir darbenin kötü bir kabustan başka bir şey olmamasını istiyorsak, uyanık kalmalıyız."
 CHL_political_events.7.t:0 "Ordudaki Anti-Sosyalist Homurdanmalar"
 CHL_political_events.70.a:0 "Jorge González von Marées"
 CHL_political_events.70.b:0 "Carlos Keller Rueff"
 CHL_political_events.70.c:0 "Juan Gómez Millas"
 CHL_political_events.70.desc:0 "Şili'de tek bir bayrak altında birleşerek iktidara geldikten sonra, birçok farklı faşist şimdi yine hükümetin uygun denetimi veya kontrolü olmaksızın kendi fikirlerini ve ideallerini uygulamaya başladı. Ulusun bir seçim yapma ve kimin liderlik edeceğine karar verme zamanı geldi, çünkü sadece bir güçlü adam sayesinde aygıt hayatta kalacaktır! Rolü kim üstlenecek?"
 CHL_political_events.70.t:0 "Partiyi Vuran Liderlik Anlaşmazlıkları"
 CHL_political_events.71.a:0 "Saati geri alma zamanı geldi"
 CHL_political_events.71.desc:0 "Muhafazakarların ve faşistlerin daha geniş bir koalisyonuna sempati duyan birlikler, Atruro Alessandri ve kabinesinin bulunduğu Palacio de La Moneda'yı kuşattı. Başkana, ülkeyi eski değerlerine döndürme ve Alessandri'nin çözmediği sorunları çözme sözü veren eski başkan ve general Carlos Ibáñez del Campo lehine istifa etmesini emrettiler. Ordunun onun yanında olduğu göz önüne alındığında, bu konuda yapılabilecek pek bir şey yok."
 CHL_political_events.71.t:0 "General Carlos Ibáñez del Campo'nun Darbesi"
 CHL_political_events.72.a:0 "Anti-emperyalist dava için savaşmaya istekli daha çok kişi var"
 CHL_political_events.72.b:0 "İdeallerimizden taviz vermeyeceğiz!"
 CHL_political_events.72.desc:0 "Yeni Araucanía Kongresi'nde yapılan ilk oturumda bir anlaşmazlık ortaya çıktı. Herkes Anti-Emperyalizmin herhangi bir Mapuçe devletinin temel bir ilkesi olması gerektiği konusunda hemfikir olsa da, komünistler ve sosyalistler gibi bu idealleri paylaşan diğerlerinin bir Mapuçe hükümetinin bir parçası olarak güvenilip güvenilemeyeceği konusunda anlaşmazlıklar var. Bazıları onların faydalı bir müttefik olabileceğini iddia ederken, bazıları ilk fırsatta sırtımızdan bıçaklayacaklarını iddia ediyor. Kim haklı?"
 CHL_political_events.72.t:0 "Araucanía Kongresi'nin İlk Oturumu"
 CHL_political_events.73.a:0 "Manuel Manquilef olmalı"
 CHL_political_events.73.b:0 "Esteban Romero Sandoval halkın oyunu aldı"
 CHL_political_events.73.c:0 "Venancio Coñuepán Huenchual bizi yönetebilir"
 CHL_political_events.73.desc:0 "Çeşitli Mapuçe örgütleri ve gruplarının, onları İspanyol düşmanlarına karşı zafere götürecek, İnka'ya karşı savaşların ruhunu yaşatacak ve Caupolicán'ın mirasını taşıyacak bir kişi altında birleşmeye karar verme zamanı nihayet geldi. Bu yüzden, halkını birleştirecek ve özgürlüğe götürecek yeni bir Toqui, bir savaş zamanı şefi seçmek için bir araya geldiler."
 CHL_political_events.73.t:0 "Bir Balta Taşıyıcısı Seçimi"
 CHL_political_events.74.a:0 "Yaşasın Seçilmiş Hükümdar Antoine III!"
 CHL_political_events.74.desc:0 "Ulus paramparça eden savaşın ortasında Santiago'daki Başkanlık Sarayı'nın önünde insanlar toplanırken, Başkan Carlos Ibáñez del Campo, kendisinin ve parlamentonun Jacques Antoine Bernard'ı yeni kral olarak seçtiğini ve 1862'de kaybedilen soyunun uzun zamandır kayıp olan unvanını geri aldığını duyurdu. Ibáñez, Antoine III'ün şimdi ulusun bulabileceği tek kurtuluş olduğunu ve savaş yorgunu toplumumuzu tekrar bir araya getirecek kişi olduğunu belirtti."
 CHL_political_events.74.t:0 "Antoine III'ün Taç Giymesi"
 CHL_political_events.75.a:0 "Bu beklediğimiz gündü!"
 CHL_political_events.75.b:0 "Gelecekte savaş riskine girmek istemiyoruz..."
 CHL_political_events.75.desc:0 "[CHL.GetNameDef]'den [CHL.GetLeader] bir teklifle bize yaklaştı. [CHL.GetName]'deki ekonomik krizin bitmeye yakın olmadığını görerek, acilen fona ihtiyacı var ve Pasifik Savaşı'ndan sonra imzalanan barış antlaşmasında bizden aldıkları Arica eyaletini onlardan geri satın almamızı talep etti. Teklifini kabul ediyor muyuz?"
 CHL_political_events.75.t:0 "[CHL.GetNameDefCap] Arica'yı bize geri satmak istiyor"
 CHL_political_events.76.a:0 "Yapılması gereken bir fedakarlıktı"
 CHL_political_events.76.desc:0 "[PRU.GetLeader], [PRU.GetName] ulusunun Arica'yı onlara satma teklifimizi memnuniyetle kabul ettiğini belirtti ve karşılığında talep ettiğimiz fonlarla bir elçi gönderdi."
 CHL_political_events.76.t:0 "[PRU.GetName] Arica'yı bizden satın almayı seçiyor"
 CHL_political_events.77.a:0 "Ne kadar nankör!"
 CHL_political_events.77.desc:0 "[PRU.GetLeader], [PRU.GetName] ulusunun Arica'yı onlara satma teklifimizi asla kabul etmeyeceğini, çünkü Pasifik Savaşı'ndan sonra bölgeyi ele geçirmemizin haksız ve yasadışı olduğunu iddia ederek ödeme yapılmadan onlara geri dönmeyi hak ettiğini belirtti."
 CHL_political_events.77.t:0 "[PRU.GetName] Arica'yı bizden satın almamayı seçiyor"
 CHL_political_events.78.a:0 "Pekala o zaman. Onlara yardım edeceğiz."
 CHL_political_events.78.b:0 "Peki onlara neden yardım edelim ki?"
 CHL_political_events.78.c:0 "Onlara yardım edeceğiz, ama sadece bir bedel karşılığında..."
 CHL_political_events.78.desc:0 "[FROM.GetNameDef]'in Seçilmiş Kralı [FROM.GetLeader], kendisini devirmek isteyen Şilili faşistler ve komünistlere karşı savaşında yardımımızı talep etti. Kendisine yardım edebilecek silah ve gönüllüler istiyor. Silahlanma çağrısını kabul ediyor muyuz?"
 CHL_political_events.78.t:0 "[FROM.GetNameDefCap] Yardımımızı Talep Ediyor"
 CHL_political_events.79.a:0 "Pekala o zaman"
 CHL_political_events.79.desc:0 "[FROM.GetNameDef]'den [FROM.GetLeader], silahlanma çağrımıza kulak verdi ve bize haklı çıkarabilecekleri kadar çok silah ve gönüllü gönderme sözü verdi."
 CHL_political_events.79.t:0 "[FROM.GetName] Bize Yardım Etmeyi Seçiyor"
 CHL_political_events.8.a:0 "En azından düzen yeniden sağlandı"
 CHL_political_events.8.d:0 "Bugün erken saatlerde, General Ariosto Herrera liderliğindeki Tacna topçu alayının kısa bir isyanı gerçekleşti. Herrera'nın eski başkan Carlos Ibáñez del Campo'nun bir destekçisi olduğu biliniyor ve İtalya'ya askeri ataşe olarak geçirdiği zamandan büyük ölçüde etkilenmiş görünüyor. 21 Mayıs 1939'da, General Herrera bir tören için Başkanlık Sarayı'na gelirken, balkonlardan birinde asılı kırmızı bir bayrak gördü ve ani bir dürtüyle onu kapıp yırttı ve ona karşı ilk kez gerçek bir şüphe uyandı. Ancak tüm bunlara rağmen, büyük ölçekli bir desteği yoktu ve her şey tekrar yolunda."
 CHL_political_events.8.t:0 "Ariostazo"
 CHL_political_events.80.a:0 "Eh, ne yapalım..."
 CHL_political_events.80.desc:0 "[FROM.GetNameDef]'den [FROM.GetLeader], silahlanma çağrımıza kulak asmadı ve bize en kötü şansı diledi. Ne kadar iğrenç!"
 CHL_political_events.80.t:0 "[FROM.GetName] Bize Yardım Etmemeyi Seçiyor"
 CHL_political_events.81.a:0 "Bunu kabul etmek zorunda kalacağız"
 CHL_political_events.81.b:0 "Onlara ihtiyacımız yok!"
 CHL_political_events.81.desc:0 "[FROM.GetNameDef]'den [FROM.GetLeader], silahlanma çağrımıza kulak verdi ve bize haklı çıkarabilecekleri kadar çok silah ve gönüllü gönderme sözü verdi. Ancak yardımlarının ucuz olmadığını ve eğer istersek karşılığında onlara ödeme yapmamız gerektiğini belirttiler."
 CHL_political_events.81.t:0 "[FROM.GetName] Bize Bir Bedel Karşılığında Yardım Edeceklerini Söylüyor"
 CHL_political_events.82.a:0 "Santiago başkentimiz olmaya devam edecek"
 CHL_political_events.82.b:0 "Perquenco eski başkentti"
 CHL_political_events.82.c:0 "Dünyanın en güneydeki Başkentine ihtiyacımız var!"
 CHL_political_events.82.d:0 "Rawson iyi bir Doğu Adayı"
 CHL_political_events.82.desc:0 "Yeni Araucanía ve Patagonya Krallığımızın kurulmasıyla, statümüzle ilgili sorular ortaya çıktı. Şu anda Santiago hala başkentimiz, bu da bizim köhne eski Şili devletinden pek farklı olmadığımız anlamına geliyor. Ancak, Krallığın yeni başkenti olmak için iyi aday olan başka potansiyel şehirler de var. Yüce kralımız Antoine III'ün iradesi nedir?"
 CHL_political_events.82.t:0 "Krallığın Başkenti"
 CHL_political_events.83.a:0 "Ulusal Muhafızları Derhal Seferber Edin!"
 CHL_political_events.83.b:0 "Mümkün Olduğunca Çok Toprak Güvence Altına Alın!"
 CHL_political_events.83.d:0 "Birkaç günlük protesto ve grevden sonra, sosyalistler, komünistler ve faşistler nihayet fırsat penceresinin önlerinde belirdiğini görerek hükümetimize karşı saldırmaya karar verdiler. Carlos Ibáñez del Campo'nun iktidarı mümkün olan en kısa sürede Jorge González von Marées'e devretmesini talep ettiler, ancak biz savaşmadan pes etmeyeceğiz. Ülke genelinde çatışmalar bildirildi ve elimizde bir iç savaş olması muhtemel..."
 CHL_political_events.83.t:0 "Anti-Ibáñist Koalisyon Darbe Girişimi"
 CHL_political_events.84.a:0 "Bu noktada, lanet olası tek umudumuz olabilir..."
 CHL_political_events.84.desc:0 "Bugün erken saatlerde, iç savaşımızın haberi dünyaya ulaşmaya başladığında, Başkan Carlos Ibáñez del Campo'ya Fransa'dan bir mesaj ulaştı. Şili'de eski bir hanedanın soyundan geldiğini iddia eden, Araucanía ve Patagonya Kralı Orélie-Antoine I'den gelen gizemli bir adam, Fransız tüccarlar ve lejyonerlerden bize yardım etme onayı aldığını, ancak bunun bir bedeli olacağını iddia etti. Durum vahim görünüyor ve yakında köklü önlemler gerekebilir."
 CHL_political_events.84.t:0 "Gizemli Bir Yabancı Hükümete Yaklaşıyor"
 CHL_political_events.85.a:0 "Şu anda onlarla başa çıkacak gücümüz yok"
 CHL_political_events.85.b:0 "Bu savaş demektir!"
 CHL_political_events.85.c:0 "Polinezya'nın yükselme zamanı geldi!"
 CHL_political_events.85.desc:0 "Paskalya Adası, yerel halk tarafından Rapa Nui olarak anılan, 1910'da Rapa Nui Krallığı'nın ilhakından bu yana doğrudan kontrolümüz altındaydı ve devlet o zamana kadar 10 yılından beri varlığını sürdürüyordu. Şimdi bir kez daha, yerli bir 'Ariki, Valentino Riroroko Tuki ve ona bakan naiplik konseyi altında toplandılar. Polinezya devleti bizimle tüm bağlantıları kesmek istiyor ve bu nedenle bağımsızlığını ilan etti. Bunu kabul ediyor muyuz?"
 CHL_political_events.85.t:0 "[RAP.GetNameDefCap] Bağımsızlığını İlan Ediyor"
 CHL_political_events.86.a:0 "Birlikte daha güçlüyüz"
 CHL_political_events.86.b:0 "Onlara ihtiyacımız yok"
 CHL_political_events.86.desc:0 "[FROM.GetNameDef]'in egemen kralı ve Fransız devletinin vatandaşı olan [FROM.GetLeader], Fransız hegemonyasını dünya geneline yaymak için birlikte birleşip birbirimize yardım etmemizi talep etti. Ne diyoruz?"
 CHL_political_events.86.t:0 "[FROM.GetName] Bir İttifak Talep Ediyor"
 CHL_political_events.87.a:0 "İki, birden fazladır"
 CHL_political_events.87.desc:0 "[FROM.GetNameDef]'in büyük [FROM.GetLeader]'i, resmi olarak bir ittifaka katılma talebimizi kabul etti ve bunun için ona teşekkür ediyoruz. Birlikte daha güçlüyüz!"
 CHL_political_events.87.t:0 "[FROM.GetName] Talebimizi Kabul Ediyor"
 CHL_political_events.88.a:0 "İhanete uğradık..."
 CHL_political_events.88.desc:0 "[FROM.GetNameDef]'in hain [FROM.GetLeader]'i, ortak çıkarlarımıza ve mirasımıza rağmen resmi olarak bir ittifaka katılma talebimizi reddetti."
 CHL_political_events.88.t:0 "[FROM.GetName] Talebimizi Reddediyor"
 CHL_political_events.89.a:0 "Onların olsun"
 CHL_political_events.89.b:0 "Kim olduklarını sanıyorlar?"
 CHL_political_events.89.desc:0 "Müttefikimiz [FROM.GetNameDef]'den [FROM.GetLeader], basit bir taleple bize yaklaştı. [270.GetName]'in kontrolünü, kendi ana vatanlarına daha yakın olduğu ve korumaları daha kolay olduğu için onlara devretmemizi istedi, böylece bir düşmanın onlara karşı kullanabileceği stratejik bir boşluk haline gelmez."
 CHL_political_events.89.t:0 "[FROM.GetNameDefCap] [270.GetName]'i korumayı teklif ediyor"
 CHL_political_events.9.a:0 "Eylemlerini Kına"
 CHL_political_events.9.b:0 "Tazminat Talep Et"
 CHL_political_events.9.c:0 "Bu savaş demektir!"
 CHL_political_events.9.d:0 "SS Tolten, dün bir Alman denizaltısından gelen bir torpido tarafından vurulduğunda, New Jersey, Barnegat açıklarında seyrediyordu. Kargo gemisi Danimarka'dan satın alınmıştı, ancak 27 mürettebat üyesinin tamamı Şililiydi ve sadece biri hayatta kaldı. Dışişleri bakanımız, Alman mevkidaşıyla konuşmak istemediğini belirtti ve Santiago'daki insanlar sokaklarda Alman karşıtı protestolar düzenliyor. Bu duruma nasıl yanıt vermeliyiz?"
 CHL_political_events.9.t:0 "SS Tolten'in Batırılması"
 CHL_political_events.90.a:0 "Pitcairn'in korunmasını üstlenme zamanı!"
 CHL_political_events.90.desc:0 "Müttefikimiz [FROM.GetNameDef]'den [FROM.GetLeader], talebimiz üzerine [270.GetName]'i bize devretti. Şimdi nihayet, halkımız yabancı tehdidinden güvende hissedebilir ve enerjilerini iç sorunlara ayırabilir."
 CHL_political_events.90.t:0 "[FROM.GetName] [270.GetName]'i bize devrediyor"
 CHL_political_events.91.a:0 "Eh, elimizdekilerle idare etmek zorunda kalacağız..."
 CHL_political_events.91.b:0 "Meseleleri kendi ellerimize almalıyız!"
 CHL_political_events.91.desc:0 "Müttefikimiz [FROM.GetNameDef]'den [FROM.GetLeader], [270.GetName]'i bize devretmedi. Bunun çok tehlikeli olduğunu ve sadece onların imparatorluğundan sömürdüğümüzü iddia ediyorlar."
 CHL_political_events.91.t:0 "[FROM.GetName] [270.GetName]'i bize devretmeyi reddediyor"
 CHL_political_events.92.a:0 "Unvanı en iyimize vereceğiz!"
 CHL_political_events.92.b:0 "Parlak bir genç subay iş görür"
 CHL_political_events.92.c:0 "Unvanı bir Mapuçe'ye ver"
 CHL_political_events.92.desc:0 "Yeni uydu krallığımız olan İnka İmparatorluğu'nun kurulmasıyla, onları Napolyon doktrini ruhuyla Sapa Inca olarak yönetecek bir general seçmemiz gerekiyor. Bu prestijli unvanla kim ödüllendirilecek?"
 CHL_political_events.92.t:0 "Yeni bir Sapa Inca"
 CHL_political_events.93.a:0 "Bartolomé Blanche nasıl liderlik edeceğini bilir!"
 CHL_political_events.93.b:0 "Gregorio Rodríguez Tascón bu unvanı hak ediyor!"
 CHL_political_events.93.c:0 "Quintín Lame devleti yönetmeli!"
 CHL_political_events.93.desc:0 "Artık efsanevi El Dorado Krallığı'nı andıran bir devlet kurduğumuza göre, şanlı kral unvanını gururlu ve dindar generallerimizden birine vermeliyiz. Rolü kim hak ediyor?"
 CHL_political_events.93.t:0 "El Dorado Kralı"
 CHL_political_events.94.a:0 "Oscar Escudero Otárola bu unvanı alabilir"
 CHL_political_events.94.b:0 "Pedro Dartnell bize uzun süredir iyi hizmet etti"
 CHL_political_events.94.c:0 "Bir kez daha Karayipler yerli halk tarafından yönetilecek!"
 CHL_political_events.94.desc:0 "Artık Hispanyola adasını yönetimimiz altında birleştirdiğimize göre, ada kralı unvanını dindar generallerimizden birine verme zamanı geldi. Bu prestijli unvanı kim kazanacak?"
 CHL_political_events.94.t:0 "Hispanyola için bir Hükümdar"
 CHL_political_events.95.a:0 "Bununla başa çıkabiliriz"
 CHL_political_events.95.desc:0 "Carabineros de Chile Genel Direktörü'nden gelen yeni raporlar, genel nüfustaki artan faşist yanlısı duyarlılığa karşı harekete geçilmesi gerektiğini ve Jorge González von Marées'in partisi olan Movimiento Nacional-Socialista'nın son zamanlardaki faaliyetlerinin daha fazla araştırılması gerektiğini öne sürüyor. Hükümetimizi devirmeyi planlıyor olabileceklerine inanılıyor ve bu nedenle uyanık kalmalıyız."
 CHL_political_events.95.t:0 "Movimiento Nacional-Socialista Faaliyetlerini Artırıyor"
 CHL_political_events.96.a:0 "Bugün zafer bizimdir!"
 CHL_political_events.96.desc:0 "Sadık askerlerimiz planlarımızı cezasız bir şekilde uyguladılar ve Atruro Alessandri ve kabinesinin bulunduğu Palacio de La Moneda'yı işgal ettiler. Başkana, Jorge González von Marées lehine istifa etmesini emrettiler. Artık liberal hükümetin bizi durdurmak için yapabileceği pek bir şey yok!."
 CHL_political_events.96.t:0 "Palacio de La Moneda Darbesi"
 CHL_political_events.97.a:0 "Kargaşa ve lütuflar."
 CHL_political_events.97.desc:0 "Kralımızın taç giymesiyle ülkede bazı insanlar memnuniyetsiz görünüyor ve bir halk direnişi oluştu. Aynı zamanda Gazi Lejyonerler, yeni kurulan hükümetimize yardım teklif etmek için ülkemize akın ediyor."
 CHL_political_events.97.t:0 "Halk Direnişi Oluşuyor ve Gazi Lejyonerler Geliyor"
 CHL_political_events.98.a:0 "Hayal kırıklığı"
 CHL_political_events.98.desc:0 "[GER.GetName], Mihver'in, en azından şimdilik, başka bir üyenin dahil edilmesini eğlendirebileceği fikrini reddetti. Küçük bir diplomatik geri tepme, ama başa çıkamayacağımız bir şey değil."
 CHL_political_events.98.t:0 "[GER.GetName] Mihver'e yükselmeyi reddediyor"
 CHL_political_events.99.a:0 "Geleceğe doğru!"
 CHL_political_events.99.desc:0 "[GER.GetName] teklifi kabul etti.. Bu, güçlülerin yönettiği yeni bir çağ ve hükümetimiz için diplomatik bir zaferdir."
 CHL_political_events.99.t:0 "[GER.GetName] Mihver'e yükselmeyi kabul ediyor"
 CHL_secures_araucania_for_the_cw_tt:0 "§YAraucanía§! kuvvetlerimiz tarafından güvence altına alınacak"
 CHL_sunk_the_tolten:0 "SS Tolten'i Batırdı"
 CHL_unlocks_various_communist_advisors:0 "§YÇeşitli komünist danışmanlar Mapuçelerle işbirliği yapmaya başlayacak ve işe alınabilir hale gelecektir.§!"
 CHL_we_will_aid_for_a_price:0 "Eğer kabul ederlerse, yardımımız karşılığında ekonomik tazminat kazanacağız, ancak teklifimizi pekala reddedebilirler"
 CHL_we_will_be_annexed_tt:0 "§Y[CHL.GetNameDef]§! tarafından §Rİlhak Edileceğiz§!"
 CHL_we_will_be_puppeted_tt:0 "§Y[CHL.GetNameDef]§!'in bir §RKuklası§! olacağız!"
 CHL_wont_becocme_communist_tt:0 "§YBaşkanlık Yetkilerini Artır§! odağıyla komünist §Rolamayacaksınız§!"
 JUNO_brazil_events.10.a:0 "Utanç verici derecede küçük bir olay."
 JUNO_brazil_events.10.desc:0 "[FROM.FROM.GetName]'deki son mitinge yapılan büyük planlamaya rağmen, etkinlik oldukça sönüktü. Beklenen destekçi kalabalığı oluşmadı, gelenler ise parti platformu hakkında çok az veya hiç bilgisi olmayan karmakarışık bir insan topluluğuydu. Birçok izleyici, sokaklarında yürüyen üniformalı üyelerimizin varlığından sadece şaşkın görünüyordu. "
 JUNO_brazil_events.10.t:0 "[FROM.FROM.GetName]'de Küçük İntegralist Mitingi"
 JUNO_brazil_events.11.a:0 "Kitlelerle aramız ısınıyor."
 JUNO_brazil_events.11.desc:0 "Yerel sosyalist ve liberal kışkırtıcılarla çatışmalara rağmen, [FROM.FROM.GetName]'deki bir İntegralist mitingi önemli bir destekçi kalabalığını çekmeyi başardı. Parti liderliği, kalabalıktan tezahüratlar ve sloganlarla karşılanan ulusun geleceği hakkında birden fazla konuşma yaptı. Yerel parti şubesi, mitingden bu yana üyeliğin arttığını zaten duyurdu."
 JUNO_brazil_events.11.t:0 "[FROM.FROM.GetName]'de İntegralist Mitingi"
 JUNO_brazil_events.12.a:0 "Halk tarafından iktidara getirileceğiz."
 JUNO_brazil_events.12.desc:0 "İnsanların, [FROM.FROM.GetName]'deki son İntegralist mitingine tanıklık etmek için ülke genelinden günlerce seyahat ettiği bildiriliyor. Hafifçe şaşkın parti liderliği geldiğinde yüzlerce üniformalı üye kalabalığı düzenli tutmaya çalıştı ve konuşmaları seyircilerin hayranlığı yüzünden zar zor duyuluyordu. Görünüşe göre hoşnutsuz kitleler nihayet siyasi statükodan bıktı."
 JUNO_brazil_events.12.t:0 "[FROM.FROM.GetName]'de Büyük İntegralist Mitingi"
 JUNO_brazil_events.120.a:0 "Bilgi sınır tanımaz."
 JUNO_brazil_events.120.b:0 "Onlara alternatif olarak ekonomik yardım teklif edeceğiz."
 JUNO_brazil_events.120.desc:0 "[FROM.GetNameDefCap], birbirimizin bilimsel uzmanlığından öğrenmek için bir ortaklık önerdi. Bilim insanlarımız büyük ölçüde bilgiye erişimin artırılmasından yana olsa da, ordu sonunda ulusal güvenliğimize zarar verebilecek bilgileri verme konusunda temkinli."
 JUNO_brazil_events.120.t:0 "[FROM.GetNameDefCap] Teknoloji Paylaşımı Öneriyor"
 JUNO_brazil_events.121.a:0 "Karşılıklı yarar sağlayan bir düzenleme!"
 JUNO_brazil_events.121.desc:0 "[FROM.GetNameDefCap], önerdiğimiz teknoloji değişim programına katılmayı kabul etti. Kendi bilim topluluğumuzun üyeleri haberden dolayı çok heyecanlı ve şimdiden [FROM.GetNameDef]'deki üniversitelere ve fabrikalara geziler planlıyorlar. "
 JUNO_brazil_events.121.t:0 "[FROM.GetNameDefCap] Teknoloji Değişimini Destekliyor"
 JUNO_brazil_events.122.a:0 "Hiç yoktan iyidir."
 JUNO_brazil_events.122.desc:0 "[FROM.GetNameDefCap], askeri sırlarının jeo-politik düşmanlarının eline geçebileceği gerekçesiyle önerdiğimiz teknoloji değişim programını reddetti. Ancak, hazinemiz [FROM.GetNameDef]'in ekonomimize daha fazla yatırım yapmayı kabul ettiğini duymaktan çok memnun."
 JUNO_brazil_events.122.t:0 "[FROM.GetNameDefCap] Teknoloji Değişimini Reddediyor"
 JUNO_brazil_events.13.a:0 "Endişe verici bir gelişme."
 JUNO_brazil_events.13.desc:0 "İstihbarat servislerimiz, Brezilya'daki birkaç operatif ve muhbirlerinin son zamanlarda iletişimi kestiğini bize bildirdi. Görünüşe göre, ülkedeki operasyonlarımızı bozacak bir şey oldu, muhtemelen düşmanlarımızla birlikte bir karşı istihbarat girişimi. Nedeni ne olursa olsun, bu [BRA.GetAdjective] politikasında bizim aleyhimize bir değişimin göstergesidir ve gelecekte onlardan benzer hamleler beklemeliyiz."
 JUNO_brazil_events.13.t:0 "Brezilya'da Bolivar Operasyonu Bozuldu"
 JUNO_brazil_events.130.a:0 "Elbette yardımlarına koşacağız!"
 JUNO_brazil_events.130.b:0 "Bu örgüt bize ne fayda sağladı ki?"
 JUNO_brazil_events.130.desc:0 "Amerikan Devletleri Örgütü'nün bir diğer üyesi olan [FROM.GetNameDefCap], saldırıya uğradı ve bu nedenle örgütün yakın zamanda kabul edilen savunma maddesini yürürlüğe soktu. Madde uyarınca, tüm üye devletlerin saldırıya uğrayan bir üye devlete yardım etmesi beklenir. Yükümlülüğümüzü yerine getirmezsek, üyeliğimizi kaybetmemiz muhtemeldir."
 JUNO_brazil_events.130.t:0 "Amerikan Devletleri Örgütü Antlaşması Yürürlüğe Girdi"
 JUNO_brazil_events.131.a:0 "Sonsuza dek minnettarız."
 JUNO_brazil_events.131.desc:0 "[FROM.GetNameDefCap], bu benzeri görülmemiş durumda yardımımıza gelerek Amerikan Devletleri Örgütü'ne olan taahhüdünü yerine getirdi. Umarım diğer tüm üyeler onların örneğinden ders alır."
 JUNO_brazil_events.131.t:0 "[FROM.GetNameDefCap] Yardımımıza Geliyor"
 JUNO_brazil_events.132.a:0 "Umarım böyle bir korkaklık yayılmaz."
 JUNO_brazil_events.132.desc:0 "[FROM.GetNameDefCap], yardımımıza gelmeyi reddederek Amerikan Devletleri Örgütü'ne olan taahhüdünü yerine getiremedi. Bu nedenle, örgütten atıldılar. "
 JUNO_brazil_events.132.t:0 "[FROM.GetNameDefCap] Yükümlülüğünü Yerine Getirmedi"
 JUNO_brazil_events.133.a:0 "Zaten kendi başımıza daha iyiyiz."
 JUNO_brazil_events.133.desc:0 "Beklendiği gibi, Amerikan Devletleri Örgütü içindeki başka bir üye devlete yönelik son saldırımızın ardından örgütten ihraç edildik. Kalan üye devletlerin duruma nasıl yanıt vereceği ise henüz belli değil."
 JUNO_brazil_events.133.t:0 "Amerikan Devletleri Örgütü'nden İhraç Edildi"
 JUNO_brazil_events.134.a:0 "Yoldaşlarımız için küçük bir kayba katlanabiliriz"
 JUNO_brazil_events.134.b:0 "Bu bize adil veya faydalı bir anlaşma gibi görünmüyor"
 JUNO_brazil_events.134.desc:0 "[BRA.GetNameDef]'deki yoldaşlarımızdan lisanslı üretim için bir talep aldık. Bizden lisanslı üretim konusunda uzun vadeli bir anlaşma yapmak istiyorlar, ancak bunun karşılığında bir indirim istiyorlar. Her lisanslı tasarım için normalden daha az kazanacağız, ancak [BRA.GetAdjective] liderliğinden biraz güven ve iyi niyet kazanacağız."
 JUNO_brazil_events.134.t:0 "[BRA.GetNameDefCap] Lisanslı Üretim Anlaşması Arıyor"
 JUNO_brazil_events.134.tt:0 "\n Bu seçeneği seçmek, [BRA.GetFlag]§Y[BRA.GetNameDef]§!'de lisanslı üretimden kazandığımız fabrika miktarını §R-%30§! oranında azaltacaktır."
 JUNO_brazil_events.135.a:0 "Harika haber!"
 JUNO_brazil_events.135.desc:0 "Yakın zamanda [SOV.GetNameDef]'in önerdiğimiz anlaşmayı kabul ettiği haberini aldık. Bundan sonra, ekipmanlarının lisanslı üretimini daha düşük bir maliyetle yapabileceğiz!"
 JUNO_brazil_events.135.t:0 "[SOV.GetNameDefCap] Anlaşmayı Kabul Ediyor"
 JUNO_brazil_events.135.tt:0 "§YGörüşte Artış§! kazandık ([SOV.GetFlag]§Y[SOV.GetName]§!'in görüşü §G+25§!.)"
 JUNO_brazil_events.136.a:0 "Sormaya değerdi..."
 JUNO_brazil_events.136.desc:0 "[SOV.GetNameDefCap], teklifimize bir ret ile hızla yanıt verdi. Diğer herhangi bir ülke gibi lisanslı üretim talep etmeliyiz ve fiyat herkes için aynı olacak, indirim yok."
 JUNO_brazil_events.136.t:0 "[SOV.GetNameDefCap] Önerdiğimiz Anlaşmayı Reddediyor"
 JUNO_brazil_events.136.tt:0 "§YGörüşte Düşüş§! kazandık ([SOV.GetFlag]§Y[SOV.GetName]§!'in görüşü §R-50§!.)"
 JUNO_brazil_events.137.a:0 "Zaten o sömürgelerle pek işimiz yok."
 JUNO_brazil_events.137.b:0 "Onların haklı sahipleri biz olurduk."
 JUNO_brazil_events.137.b.tt:0 "§RBu onlara bize karşı bir savaş hedefi verecektir!§!"
 JUNO_brazil_events.137.desc:0 "[BRA.GetNameDef]'den oldukça sert bir dille yazılmış bir iletişim aldık. [BRA_country_to_be_liberated.GetNameDef]'i serbest bırakmamızı ve toprakları haklı sahiplerine iade etmemizi talep ediyorlar."
 JUNO_brazil_events.137.t:0 "[BRA.GetNameDefCap] Güney Amerika Sömürgelerini Serbest Bırakmamızı Talep Ediyor"
 JUNO_brazil_events.138.a:0 "Son derece tatmin edici bir sonuç."
 JUNO_brazil_events.138.desc:0 "[FROM.GetNameDef]'in [BRA_country_to_be_liberated.GetNameDef]'lerini serbest bırakma taleplerimize yanıtı yeni ulaştı. Belki biraz şaşırtıcı, onları bırakmanın ve bağımsız bir ulus olarak serbest bırakmanın en iyi yol olduğu konusunda anlaştılar."
 JUNO_brazil_events.138.t:0 "[FROM.GetNameDefCap], [BRA_country_to_be_liberated.GetNameDef]'i Serbest Bırakmayı Kabul Ediyor"
 JUNO_brazil_events.139.a:0 "Onları ne pahasına olursa olsun kurtarmalıyız."
 JUNO_brazil_events.139.desc:0 "[FROM.GetNameDef]'in [BRA_country_to_be_liberated.GetNameDef]'lerini serbest bırakma taleplerimize yanıtı yeni ulaştı. Dışişlerinin bizim işimiz olmadığını belirterek, onlara haklı bağımsızlıklarını verme fikrini reddediyorlar."
 JUNO_brazil_events.139.t:0 "[FROM.GetNameDefCap] Sömürgeleri Serbest Bırakmayı Reddediyor"
 JUNO_brazil_events.14.a:0 "Hoş bir gelişme"
 JUNO_brazil_events.14.b:0 "Bu açıkça bizi zayıflatmak için bir hile."
 JUNO_brazil_events.14.desc:0 "[FROM.GetAdjective] Başkanı, [FROM.GetLeader], hükümetlerinin 'iyi komşu' politikası olarak adlandırılan bir girişimle Güney Amerika uluslarıyla daha fazla işbirliği arayacağını duyurdu. Bu işbirliğinin ne şekilde olacağı henüz belli değil, ancak bu kıtanın İspanyolca ve Portekizce konuşan ulusları arasındaki daha önceki düşmanca ilişkilerden belirgin bir sapmadır."
 JUNO_brazil_events.14.t:0 "[FROM.GetAdjective] İyi Komşuluk Politikası"
 JUNO_brazil_events.140.a:0 "Jesti hoş karşıla ve bağları güçlendir."
 JUNO_brazil_events.140.b:0 "Teklifi kibarca reddet."
 JUNO_brazil_events.140.desc:0 "İyi niyet göstergesi olarak, bir [FROM.GetAdjective] diplomatik heyeti, uluslarının kültürünün ve gücünün bir amblemi olan eşsiz bir hediye - bir jaguar - ile geldi. Bu olağanüstü hediyeye, dış politika konusunda gelişmiş ticaret ve işbirliği için bir teklif eşlik ediyor. [FROM.GetAdjective] elçileri, uluslarımız arasında daha güçlü bir bağ kurma arzularını ifade ediyorlar. \n\nJaguar halkın hayal gücünü büyülemiş ve iyi niyet kazanmış olsa da, bu girişimin daha geniş sonuçları dikkatli bir şekilde düşünülmeyi gerektirir."
 JUNO_brazil_events.140.t:0 "Jaguar Diplomasisi"
 JUNO_brazil_events.141.a:0 "Mükemmel haber!"
 JUNO_brazil_events.141.desc:0 "Diplomatik misyonumuz harika haberlerle döndü. [FROM.GetNameDefCap], jaguar hediyemizi lütfederek kabul etti. Uluslararası ilgi gören büyük bir törenle, jestimizi memnuniyetle karşıladılar ve dış politika konularında gelişmiş ticaret ve işbirliği tekliflerimizi kabul ettiler."
 JUNO_brazil_events.141.t:0 "Başarılı Diplomatik Misyon"
 JUNO_brazil_events.142.a:0 "Dikkatli davranmalıyız."
 JUNO_brazil_events.142.desc:0 "Diplomatik delegasyonumuzdan gelen son rapor talihsiz haberler getiriyor. Dostluk ve iyi niyet arzumuzun bir sembolü olan jaguar teklifimiz, [FROM.GetNameDef] tarafından beklenmedik bir şekilde reddedildi. Bu değerli hediyenin reddedilmesinin yanı sıra, dış politika konularında gelişmiş ticaret ve işbirliği tekliflerimiz de geri çevrildi."
 JUNO_brazil_events.142.t:0 "Diplomatik Utanç"
 JUNO_brazil_events.143.a:0 "İşler çığırından çıkmadan bu işe bakmalıyız."
 JUNO_brazil_events.143.desc:0 "Şehirlerimizdeki işçi sınıfını temsil ettiğini iddia eden radikal hareketlerin faaliyetlerinde bir artış oldu. Güvenlik servislerimiz bu hareketlerin [BRA.GetNonIdeologyName]'in komünist rejimi tarafından desteklendiğine inanıyor. Bu nedenle, eğer söz verirsek radikallere karşı sert önlemler almak için planlar hazırlıyorlar."
 JUNO_brazil_events.143.t:0 "Radikal Solcu Hareketler Zemin Kazanıyor"
 JUNO_brazil_events.144.a:0 "Talihsizlik."
 JUNO_brazil_events.144.desc:0 "[FROM.GetNameDef]'deki komünist partiye desteği artırma operasyonlarımız, yerel polis ve güvenlik servislerinden sert bir direnişle karşılaştı. Bu cephede daha fazla ilerleme kaydetmek istiyorsak yeni sızma taktikleri denememiz gerekecek."
 JUNO_brazil_events.144.t:0 "[FROM.GetNameDef]'deki Operasyonlar Bozuldu"
 JUNO_brazil_events.15.a:0 "Bu karşılıklı yarar sağlayan anlaşmayı memnuniyetle karşılıyoruz."
 JUNO_brazil_events.15.b:0 "Garantileri değersiz."
 JUNO_brazil_events.15.desc:0 "Son aylarda, [BRA.GetAdjective] hükümeti, savaş çabamızı desteklemede daha aktif bir rol almaları konusunda kendi hükümetimizin üyeleriyle bir dizi ortak görüşmeye katıldı. Henüz askeri güç taahhüt edemeseler de, yakın gelecekte bunu yapma taahhütleri karşılığında ekonomik destek talep ettiler. "
 JUNO_brazil_events.15.t:0 "[ROOT.Capital.GetCapitalVictoryPointName] Anlaşmaları"
 JUNO_brazil_events.150.a:0 "Onlar sadece bir baş belası."
 JUNO_brazil_events.150.b:0 "Böyle bir haydutluğa artık müsamaha gösterilemez!"
 JUNO_brazil_events.150.c:0 "Derhal izleri sürülmeli ve tutuklanmalılar!"
 JUNO_brazil_events.150.desc.a:0 "Cangaço olarak bilinen Kuzeydoğu Brezilya'nın haydutları, bölgedeki bir yerleşime baskın düzenledi. Kolluk kuvvetleri, yerel halkın grup üyelerini koruması nedeniyle soruşturmalarında ilerleme kaydetmekte zorlanıyor. Görünüşe göre failleri avlamak, bölgede çok daha güçlü bir güvenlik varlığı gerektirecek."
 JUNO_brazil_events.150.desc.b:0 "Cangaço olarak bilinen Kuzeydoğu Brezilya'nın haydutları, operasyonlarını bölgenin daha fazla alanına genişletiyor. Yerel kolluk kuvvetleri ve toprak sahipleri bölgedeki bu tür faaliyetlerden öfkelenirken, daha fakir yerel halkın çoğu en iyi ihtimalle ilgisiz veya en kötü ihtimalle haberlerden dolayı coşkulu kalıyor. Görünüşe göre failleri avlamak, bölgede çok daha güçlü bir güvenlik varlığı gerektirecek."
 JUNO_brazil_events.150.t:0 "Cangaço Operasyon Düzenliyor"
 JUNO_brazil_events.151.a:0 "Mükemmel!"
 JUNO_brazil_events.151.desc:0 "Kuzeydoğu Brezilya'daki son operasyonlarımız, Cangaço'nun operasyonlarını bozma konusunda başarılı oldu. Faaliyet alanları şimdilik önemli ölçüde azaldı, ancak gelecekte bir canlanmayı önlemek istiyorsak kolluk kuvvetlerine sürekli yatırım yapılması gerekecek."
 JUNO_brazil_events.151.t:0 "Cangaço'ya Karşı Başarılı Operasyon"
 JUNO_brazil_events.152.a:0 "Zamanı gelmişti."
 JUNO_brazil_events.152.desc:0 "Kuzeydoğu Brezilya'daki en son kolluk kuvvetleri operasyonumuz sırasında, Cangaço'nun en ünlüsü olan Lampião, polisle girdiği bir çatışmada öldürüldü. Lampião'nun haydut grubunun bir üyesi ona ihanet etti, bu da polisin grubu sığınaklarında pusuya düşürmesine olanak tanıdı. Birçok küçük haydut grubu kırsalda dolaşmaya devam etse de, bu Cangaço tarafından büyük ölçekli operasyonların sonunu işaret ediyor gibi görünüyor."
 JUNO_brazil_events.152.t:0 "Lampião Çatışmada Öldürüldü"
 JUNO_brazil_events.153.a:0 "Onlarla zamanı gelince ilgileneceğiz."
 JUNO_brazil_events.153.desc:0 "Kuzeydoğu Brezilya, uzun yıllardır Cangaço olarak bilinen haydutlar tarafından rahatsız edilmektedir. Başkentteki istikrarsızlık ve politikacıların iktidarda kalma konusunda daha endişeli olmaları nedeniyle Cangaço kol geziyor. Sadece kolluk kuvvetlerinin ortak bir çabasıyla bölgedeki nüfuzlarını azaltmayı umabiliriz."
 JUNO_brazil_events.153.t:0 "Cangaço Tehdidi"
 JUNO_brazil_events.16.a:0 "Birlikte, yarımküremize barışı geri getireceğiz."
 JUNO_brazil_events.16.desc:0 "[USA.GetName] hükümetiyle yaptığımız görüşmeler başarılı oldu. [BRA.GetNameDef]'in, [USA.GetName]'den ekonomik yardım alması, karşılığında onlara kaynak sağlaması ve ordumuz yetenekli olduğunda savaşa katılma taahhüdü konusunda bir anlaşmaya vardık."
 JUNO_brazil_events.16.t:0 "[FROM.Capital.GetCapitalVictoryPointName] Anlaşmaları"
 JUNO_brazil_events.160.a:0 "Serbest piyasanın önünde durmak bize mi düşmüş?"
 JUNO_brazil_events.160.b:0 "Bu, fikri mülkiyetimizi çalmak için bir hiledir."
 JUNO_brazil_events.160.desc:0 "[FROM.GetAdjective] diplomatları, yabancı şirketleri kendi uluslarında iştirakler kurmaya teşvik etme planları hakkında bize başvurdular. Şirketlerimizin bunu yapmasını engelleyip engellemeyeceğimizi bilmek istiyorlar. Şirketlerimizin bu gelişmekte olan pazara girmesine izin verirsek, ekonomik olarak kendimiz de kazanabiliriz."
 JUNO_brazil_events.160.t:0 "[FROM.GetNameDefCap]'e Davet Edilen Şirketler"
 JUNO_brazil_events.161.a:0 "Tank üretimini teşvik et."
 JUNO_brazil_events.161.b:0 "Uçak üretimini teşvik et."
 JUNO_brazil_events.161.c:0 "Gemi inşaatını teşvik et."
 JUNO_brazil_events.161.d:0 "Zırhlı araba üretimini teşvik et."
 JUNO_brazil_events.161.desc:0 "[FROM.GetNameDefCap] hükümeti, eğer isterlerse şirketlerinin [ROOT.GetNonIdeologyName]'de iştirakler kurmasına izin verdi. Geriye sadece ne tür bir sanayiyi teşvik etmek istediğimizi belirlemek kalıyor."
 JUNO_brazil_events.161.t:0 "[FROM.GetNameDefCap] Üretim İşbirliğini Kabul Ediyor"
 JUNO_brazil_events.162.a:0 "Kurumsal ortaklıklar için başka yerlere bakacağız."
 JUNO_brazil_events.162.desc:0 "[FROM.GetAdjective] diplomatları, hükümetlerinin öngörülebilir gelecekte şirketlerinin [ROOT.GetNonIdeologyName]'de iştirakler kurmasına izin vermeyeceğini bize bildirdi. Fikri mülkiyet hakları ve askeri sırların düşman uluslara ifşa olma potansiyeli ile ilgili endişeleri gerekçe gösteriyorlar."
 JUNO_brazil_events.162.t:0 "[FROM.GetNameDefCap] Üretim İşbirliğini Reddediyor"
 JUNO_brazil_events.163.a:0 "Partido Trabalhista'nın yasasını yürürlüğe koy."
 JUNO_brazil_events.163.b:0 "Partido Republicano'nun yasasını yürürlüğe koy."
 JUNO_brazil_events.163.desc:0 "İşçi ve işverenler arasındaki anlaşmazlıklar son yıllarda neredeyse ulusu paramparça etti. Nihayet konuyu dinlendirmek için yasa çıkarma zamanı geldi. Ulusal kongrenin bir tarafında, Partido Trabalhista, sendika faaliyetlerini yasallaştıracak, garantili işçi hakları ve yıllık belirli sayıda tatil günü hakkı tesis edecek işçi yanlısı yasaları savunuyor. Diğer tarafta, Partido Republicano daha az radikal reformları savunuyor ve bunun yerine sorunu eyaletlerin kendi kararlarına bırakıyor. Mevcut küresel güvenlik durumunun, radikal sola boyun eğmek yerine ulusal savunma harcamalarını önceliklendirmemiz gerektiği anlamına geldiğini savunuyorlar."
 JUNO_brazil_events.163.t:0 "İşçi Anlaşmazlıklarını Ele Alma"
 JUNO_brazil_events.17.a:0 "Şimdi dikkatli olmalıyız."
 JUNO_brazil_events.17.desc:0 "[USA.GetName], ekonomik yardım karşılığında bizi askeri olarak desteklemeye taahhüt edecek bir anlaşmayı reddetmeye karar verdi. Belki de zamanlama Başkan için sadece uygun değildi ya da bu Brezilya'ya yönelik dış politikada bir değişimi işaret edebilir. Her iki durumda da, bu [BRA.GetLeader]'in güvenilirliğine bir darbedir."
 JUNO_brazil_events.17.t:0 "[FROM.Capital.GetCapitalVictoryPointName] Anlaşmaları Reddedildi"
 JUNO_brazil_events.170.a:0 "Farklılıklarımızı bir kenara bırakma zamanı geldi."
 JUNO_brazil_events.170.b:0 "Böyle bir düzenlemeyi asla kabul edemeyiz!"
 JUNO_brazil_events.170.desc:0 "[FROM.GetNameDefCap], ulusumuzun kendi federasyonlarına birleşmesini önerdi. Son zamanlarda [FROM.GetNameDef] ile yakın çalışmış olsak da, eski neslin birçoğu ekonomik ve siyasi istikrar karşılığında tarihi şikayetlerini bir kenara bırakmaya isteksiz. Kararımız ne olursa olsun, muhtemelen yıllarca sürecek sonuçları olacaktır."
 JUNO_brazil_events.170.t:0 "[FROM.GetNameDefCap] Birleşme Teklif Ediyor"
 JUNO_brazil_events.171.a:0 "Bu tarihi bir an!"
 JUNO_brazil_events.171.desc:0 "[FROM.GetNameDefCap], siyasi sistemimizdeki konumları ve halklarının temel çıkarlarının korunması üzerine uzun tartışmalardan sonra birleşme teklifimizi kabul etti."
 JUNO_brazil_events.171.t:0 "[FROM.GetNameDefCap] Birleşmeyi Kabul Ediyor"
 JUNO_brazil_events.172.a:0 "Dar görüşlü aptallar."
 JUNO_brazil_events.172.desc:0 "[FROM.GetNameDefCap], politikanın halk arasında popüler olmaması nedeniyle birleşme teklifimizi reddetti. Bu düzenlemenin karşılıklı olarak faydalı olacağına dair açıklamalarımıza rağmen, görünüşe göre birleşme zamanı henüz gelmedi."
 JUNO_brazil_events.172.t:0 "[FROM.GetNameDefCap] Birleşmeyi Reddediyor"
 JUNO_brazil_events.18.a:0 "Taahhütlerimize uyacağız."
 JUNO_brazil_events.18.b:0 "[BRA.GetAdjective] kanını [FROM.GetNameDef] için dökmeyeceğiz."
 JUNO_brazil_events.18.desc:0 "[FROM.GetNameDefCap], devam eden savaşlarında onlara askeri olarak katılma anlaşmalarımıza uymamızı talep ediyor. Ekonomimize yaptıkları yatırımların ödüllerini topladık, ancak anlaşmanın kendi tarafımızı yerine getirmek için şimdiye kadar çok az şey yaptık. Şimdi bunu yapmazsak, ciddi sonuçları olabilir."
 JUNO_brazil_events.18.t:0 "[FROM.GetNameDefCap] Askeri Taahhüt Talep Ediyor"
 JUNO_brazil_events.180.a:0 "Onun uzmanlığından faydalanabiliriz."
 JUNO_brazil_events.180.b:0 "Karar alma sürecimize dahil etmek için çok riskli."
 JUNO_brazil_events.180.desc:0 "Amerika Birleşik Devletleri'ndeki son kargaşa ve hükümetlerinin Marksistler tarafından devrilmesi nedeniyle, bir dizi [USA.GetAdjective], yeni bir hayat arayışıyla [ROOT.GetNonIdeologyName]'e geldi. Belki de şimdiye kadarki en ünlü gelişimiz, tanınmış sanayici $BRA_henry_ford$'dur. Anavatanı gibi komünist nüfuzunun kurbanı olmamızı önlemeye yardımcı olmak için hükümette bir koltuk karşılığında Fordlandia'daki operasyonlarını genişletmeyi teklif etti."
 JUNO_brazil_events.180.t:0 "$BRA_henry_ford$, [ROOT.GetNonIdeologyName]'e varıyor"
 JUNO_brazil_events.19.a:0 "Belki de [FROM.Capital.GetCapitalVictoryPointName]'de daha dostane bir liderlik kurma zamanı gelmiştir."
 JUNO_brazil_events.19.b:0 "Sözlerini tutmamaları cezalandırılmalı."
 JUNO_brazil_events.19.c:0 "Artık bizim için bir endişe kaynağı değiller."
 JUNO_brazil_events.19.desc:0 "[FROM.GetAdjective] diplomatları, yıllarca verdiğimiz ekonomik yardıma rağmen henüz savaşa askeri olarak katılmaya hazır olmadıklarını bize bildirdi. Sadece taahhütlerini geri çekmeye mi çalıştıkları yoksa henüz onurlandırmamalarının gerçek nedenleri mi olduğu tam olarak belli değil. Nasıl yanıt vereceğimize dikkatlice karar vermeliyiz."
 JUNO_brazil_events.19.t:0 "[FROM.GetNameDefCap] Savaşa Katılamıyor"
 JUNO_brazil_events.190.a:0 "İmparatorluk mirasımızı kucaklayacağız!"
 JUNO_brazil_events.190.b:0 "Bu hareketi derhal ezmeliyiz."
 JUNO_brazil_events.190.desc:0 "[FROM.GetAdjective] operatiflerinin [ROOT.GetNonIdeologyName]'de monarşist duyguları teşvik etmeye çalıştığına dair bir dizi rapor alıyoruz. Ulus için uzun vadeli planlarımızın ne olacağına bağlı olarak, ya bu hareketi benimsemeli ya da kontrolden çıkmadan önce onu bastırmalıyız."
 JUNO_brazil_events.190.t:0 "[FROM.GetNameDefCap], [ROOT.GetNonIdeologyName]'de Monarşizmi Teşvik Ediyor"
 JUNO_brazil_events.191.a:0 "Gelecekte alternatif yöntemler kullanmalıyız."
 JUNO_brazil_events.191.desc:0 "[FROM.GetNameDefCap][BRA.GetFlag], monarşist duyguların her türlü tanıtımına karşı sert bir baskı uyguladı. Şaşırtıcı olmayan bir şekilde, bu ulustaki operatiflerimizin etkisi üzerinde soğutucu bir etki yarattı."
 JUNO_brazil_events.191.t:0 "[FROM.GetNameDefCap] Monarşist Hareketi Yasaklıyor"
 JUNO_brazil_events.20.a:0 "Diplomatik manevralarımız işe yaradı."
 JUNO_brazil_events.20.desc:0 "Kuzey Doğu Brezilya'daki [BRA.GetAdjective] ve [USA.GetAdjective] başkanları arasındaki son toplantılar sırasında, birincisi [USA.Capital.GetCapitalVictoryPointName] anlaşmalarında belirtilen taahhütleri yerine getirmeyi kabul etti. Bu, şimdi dünya genelindeki tiranlığa karşı devam eden savaşımıza askeri güçlerini taahhüt edecekleri anlamına geliyor."
 JUNO_brazil_events.20.t:0 "Potenji Nehri Konferansı"
 JUNO_brazil_events.200.a:0 "$BRA_anisio_teixeira$"
 JUNO_brazil_events.200.b:0 "$BRA_armando_de_sales_oliveira$"
 JUNO_brazil_events.200.c:0 "$BRA_minervino_de_oliveira$"
 JUNO_brazil_events.200.d:0 "$BRA_lindolfo_collor$"
 JUNO_brazil_events.200.desc:0 "Seçim Sezonu bir kez daha geldi ve [ROOT.GetAdjective] halkı bir sonraki Başkanın kim olacağını nefesini tutarak bekliyor."
 JUNO_brazil_events.200.e:0 "$BRA_eurico_gaspar_dutra$"
 JUNO_brazil_events.200.t:0 "Seçim Sezonu"
 JUNO_brazil_events.30.a:0 "Bu teklifi kabul ediyoruz."
 JUNO_brazil_events.30.b:0 "Böyle bir ölü ağırlığa ihtiyacımız yok."
 JUNO_brazil_events.30.desc:0 "[FROM.GetNameDef]'den diplomatlar, askeri ve ekonomik işbirliği teklifiyle bize yaklaştılar. Dünya meselelerinin durumundan derin endişe duyduklarını ve kalıcı barışa giden tek yolun kendileriyle aynı hizaya gelip ortak jeo-politik düşmanlarımıza son vermek olduğuna inandıklarını belirtiyorlar."
 JUNO_brazil_events.30.t:0 "[FROM.GetNameDefCap] İşbirliği Öneriyor"
 JUNO_brazil_events.31.a:0 "Birlikte Güney Amerika'ya hükmedeceğiz."
 JUNO_brazil_events.31.desc:0 "İstihbarat servislerimiz, [BRA.GetAdjective] mevkidaşlarıyla yakın bir çalışma ilişkisi kurduklarını bildiriyor. Bu, Bolivar Operasyonu olarak bilinen Güney Amerika istihbarat toplama faaliyetlerimizin genişlemesine yol açtı. Görünüşe göre [BRA.GetName] ile ilk işbirliğimiz meyvelerini vermeye başlıyor."
 JUNO_brazil_events.31.t:0 "[BRA.GetNameDefCap] İstihbarat Operasyonlarına Yardım Ediyor"
 JUNO_brazil_events.32.a:0 "Guyanalar uğruna savaşmaya değmez."
 JUNO_brazil_events.32.b:0 "[BRA.GetNameDef] tarafından şantaja uğramayacağız"
 JUNO_brazil_events.32.desc:0 "Yönetimdeki [BRA.GetNameDef] akbabaları, mevcut küresel çatışmayı Guyanalardaki toprakları bize devretmek için şantaj yapma fırsatı olarak kullanmaya çalışıyorlar. Toprağı devretmemizi ya da zorla alma riskini göze almamızı talep ettiler. Savaşa girersek toprağı tutmak zor olabilir, ancak bu dünya çapındaki diğer tartışmalı bölgeler için tehlikeli bir emsal teşkil eder."
 JUNO_brazil_events.32.t:0 "[BRA.GetNameDefCap] Guyanalarda Toprak Talep Ediyor"
 JUNO_brazil_events.33.a:0 "Bize boyun eğmekten başka pek seçenekleri yoktu."
 JUNO_brazil_events.33.desc:0 "[FROM.GetName] hükümeti, son taleplerimizin ardından Guyanalardaki topraklarının mülkiyetini bize devretmeyi gönülsüzce kabul etti. Görünüşe göre yeni diplomatik tehlike oyunumuz başarılı oldu."
 JUNO_brazil_events.33.t:0 "[FROM.GetName] Toprak Devretmeyi Kabul Ediyor"
 JUNO_brazil_events.34.a:0 "Blöfümüzü gördüler, geri çekilmeliyiz."
 JUNO_brazil_events.34.b:0 "Bu karardan pişman olacaklar."
 JUNO_brazil_events.34.desc:0 "[FROM.GetName] hükümeti, son taleplerimizin ardından Guyanalardaki topraklarının mülkiyetini bize devretmeyi reddetti. Şimdi ya tehdidimizi gerçekleştirip toprağı zorla almalı ya da geri adım atmanın diplomatik darbesini almalıyız."
 JUNO_brazil_events.34.t:0 "[FROM.GetName] Toprak Devretmeyi Reddediyor"
 JUNO_brazil_events.35.a:0 "Yine de onlara göz kulak olmalıyız."
 JUNO_brazil_events.35.desc:0 "Guyanalardaki toprağımız üzerindeki kavgacı söylemlerine rağmen, [BRA.GetAdjective]'in bizimle gerçekten savaşa girme isteği gerçekleşmemiş gibi görünüyor. [BRA.GetNameDef]'den diplomatlar, toprağı elde etmek için alternatif yollar izleyeceklerini, ancak bunu barışçıl bir şekilde yapacaklarını bize bildirdi. En azından şimdilik."
 JUNO_brazil_events.35.t:0 "[FROM.GetName] Geri Çekiliyor"
 JUNO_brazil_events.36.a:0 "Daha fazla gereksiz kan dökülmesi..."
 JUNO_brazil_events.36.desc:0 "Toprağı [FROM.GetNameDef]'e devretmeyi reddetmemizin ardından daha da fazla çatışmanın eşiğinde gibiyiz. Blöf yaptıklarını ummuş olsak da, bölgeden gelen istihbarat, [BRA.GetAdjective] ordusunun toprağı zorla almak için hazırlık yaptığını gösteriyor."
 JUNO_brazil_events.36.t:0 "[FROM.GetName] Savaşa Hazırlanıyor"
 JUNO_brazil_events.37.a:0 "Bu bir hile olmalı."
 JUNO_brazil_events.37.b:0 "En iyi savunma saldırıdır."
 JUNO_brazil_events.37.desc:0 "Güney Brezilya'da askeri faaliyetlerde bir artış olduğuna dair raporlar geliyor. Son zamanlarda uluslarımız arasındaki ilişkiler en iyi ihtimalle soğuktu ve iddialı söylemleri, birçok kişinin bir işgalin eşiğinde olup olmadığımızı speküle etmesine neden oluyor. Ordudaki birçok kişi en kötüsü olması durumunda savunma hazırlamak için çabalıyor. Ancak [BRA.GetAdjective]ler tam olarak hazırlanmadan önce önleyici bir saldırı için bastıranlar da var."
 JUNO_brazil_events.37.t:0 "[BRA.GetNameDef]'de Şüpheli Faaliyet"
 JUNO_brazil_events.38.a:0 "Çok kolay oldu."
 JUNO_brazil_events.38.desc:0 "[ARG.GetNameDefCap], sınırdaki son provokasyonlarımızın ardından bize karşı bir saldırı için kendi kuvvetlerini hazırlıyor gibi görünüyor. Tuzağımıza düştüklerini bilmiyorlar, yakında onları ezme fırsatımız olacak ve savaşın uluslararası kınamasını çekmek zorunda kalacaklar."
 JUNO_brazil_events.38.t:0 "[ARG.GetNameDefCap] Yemi Yutuyor"
 JUNO_brazil_events.39.a:0 "Geri çekilme zamanı."
 JUNO_brazil_events.39.b:0 "Sadece daha fazla zamana ihtiyacımız var."
 JUNO_brazil_events.39.desc:0 "Şimdiye kadar, [ARG.GetAdjective]lerin sınırlarımızın ötesine saldırmaya hazırlandığına dair hiçbir işaret yok. En iyi ihtimalle, kendi savunmalarını oluşturuyor gibi görünüyorlar, bu da bizim tarafımızdan herhangi bir eylemi daha zorlaştırıyor. Ancak bir noktada, ya önce biz vurmalıyız ya da geri çekilmeliyiz."
 JUNO_brazil_events.39.t:0 "[ARG.GetNameDefCap] Yemimizi Reddediyor"
 JUNO_brazil_events.40.a:0 "Teslim olmaktan başka seçeneğimiz yok."
 JUNO_brazil_events.40.b:0 "Toprağımızın her karışını onlara pahalıya ödeteceğiz."
 JUNO_brazil_events.40.desc:0 "[ROOT.Capital.GetCapitalVictoryPointName]'daki [BRA.GetAdjective] büyükelçisi, hükümetlerinden bir bildiri yayınladı. İçinde, sınırlarımızı derhal [BRA.GetNameDef]'e açmamız ve silahlarımızı bırakmamız söyleniyor. Bildiri, ulusumuzun derhal geçerli olmak üzere [BRA.GetNameDef]'e bir eyalet olarak dahil edileceğini ayrıntılı olarak açıklamaya devam ediyor. Uymamamız durumunda, planlarını zorla uygulayacaklarını belirtiyorlar."
 JUNO_brazil_events.40.t:0 "[BRA.GetNameDefCap] Ültimatom Veriyor"
 JUNO_brazil_events.41.a:0 "Kabul etmekten başka gerçek bir seçenekleri yoktu."
 JUNO_brazil_events.41.desc:0 "[FROM.GetNameDefCap]’in hükümeti eyalet olma teklifimizi kabul etti, bu da küçük ulusu güvence altına almak için askeri harekatın artık gerekli olmayacağı anlamına geliyor. "
 JUNO_brazil_events.41.t:0 "[FROM.GetNameDefCap] İlhakı Kabul Ediyor"
 JUNO_brazil_events.42.a:0 "Bu bir savaşa değmez."
 JUNO_brazil_events.42.b:0 "Gazabımızı hissedecekler. "
 JUNO_brazil_events.42.desc:0 "[FROM.GetNameDefCap]’in hükümeti, [ROOT.GetNameDef]'de eyalet olma teklifimizi aptalca reddetti. Görünüşe göre ya savaş tehdidimizi yerine getirmeli ya da geri çekilip şimdilik kendilerini yönetmelerine izin vermeliyiz."
 JUNO_brazil_events.42.t:0 "[FROM.GetNameDefCap] İlhakı Reddediyor"
 JUNO_brazil_events.43.a:0 "Yine de onlara göz kulak olmalıyız."
 JUNO_brazil_events.43.desc:0 "Bizi uluslarına dahil etme konusundaki kavgacı söylemlerine ve arzularına rağmen, [BRA.GetAdjective]'in bizimle gerçekten savaşa girme isteği gerçekleşmemiş gibi görünüyor. [BRA.GetNameDef]'den diplomatlar, toprağımızı elde etmek için alternatif yollar izleyeceklerini, ancak bunu barışçıl bir şekilde yapacaklarını bize bildirdi. En azından şimdilik."
 JUNO_brazil_events.43.t:0 "[FROM.GetName] Geri Adım Atıyor"
 JUNO_brazil_events.44.a:0 "Tarihin bir kez daha tekerrür etmesini sağlayacağız."
 JUNO_brazil_events.44.desc:0 "Toprağı [FROM.GetNameDef]'e devretmeyi reddetmemizin ardından daha da fazla çatışmanın eşiğinde gibiyiz. Blöf yaptıklarını ummuş olsak da, bölgeden gelen istihbarat, [BRA.GetAdjective] ordusunun toprağı zorla almak için hazırlık yaptığını gösteriyor."
 JUNO_brazil_events.44.t:0 "[FROM.GetName] Savaşa Hazırlanıyor"
 JUNO_brazil_events.45.a:0 "Onları durduramayız"
 JUNO_brazil_events.45.b:0 "Egemenliğimizi imzayla teslim etmeyeceğiz."
 JUNO_brazil_events.45.desc:0 "[ROOT.Capital.GetCapitalVictoryPointName]'daki [BRA.GetAdjective] büyükelçisi, hükümetlerinden bir bildiri yayınladı. Görünüşe göre hükümetleri buradaki istikrarsızlıktan endişe duyuyor ve ulusumuzu ordularıyla istikrara kavuşturmak istiyor. Gerçekte, bu yardım kisvesi altında rejim değişikliği anlamına gelecektir."
 JUNO_brazil_events.45.t:0 "[BRA.GetNameDefCap] Ültimatom Veriyor"
 JUNO_brazil_events.46.a:0 "Değerli bir tampon devlet olacaklar."
 JUNO_brazil_events.46.desc:0 "[FROM.GetNameDefCap], çatışma riskine girmek yerine silahlı kuvvetlerimize boyun eğmeyi akıllıca seçti. Şimdi ülkede bizimkine daha uygun yeni bir rejim kurma sürecindeyiz."
 JUNO_brazil_events.46.t:0 "[FROM.GetName] Teklifi Kabul Ediyor"
 JUNO_brazil_events.47.a:0 "Bir savaş kontrolden çıkabilir."
 JUNO_brazil_events.47.b:0 "Kararlarından pişman olacaklar."
 JUNO_brazil_events.47.desc:0 "[FROM.GetNameDefCap]’in hükümeti, uluslarını istikrara kavuşturma teklifimizi reddetti. Görünüşe göre, orada rejim değişikliği yapmak istiyorsak, bunu askeri güçle yapmak zorunda kalacağız."
 JUNO_brazil_events.47.t:0 "[FROM.GetNameDefCap] Öneriyi Reddediyor"
 JUNO_brazil_events.48.a:0 "Yine de bölgeyi istikrarsızlaştırmayı başardılar."
 JUNO_brazil_events.48.desc:0 "[FROM.GetAdjective] ordusu, 'istikrar' teklifimizi reddetmemize rağmen geri çekiliyor gibi görünüyor. Görünüşe göre blöflerini gördük ve çatışmaya pek iştahları yoktu."
 JUNO_brazil_events.48.t:0 "[FROM.GetNameDefCap] Geri Çekiliyor"
 JUNO_brazil_events.49.a:0 "Yerimizi korumalıyız."
 JUNO_brazil_events.49.desc:0 "[FROM.GetNameDef]'in ulusumuzu 'istikrara kavuşturma' teklifini reddetmemizin ardından, silahlı kuvvetleri savaşa hazırlanıyor gibi görünüyor. Ne zaman saldıracaklarını bilmiyoruz, ama hedeflerinin biz olacağını varsaymak güvenli. Elçiliklerinden diplomatlar da tahliye edilmiş gibi görünüyor, bu da savaşın kaçınılmaz olabileceği korkularını artırıyor."
 JUNO_brazil_events.49.t:0 "[FROM.GetNameDef] ile Gerilim Artıyor"
 JUNO_brazil_events.50.a:0 "Kazanacak çok şeyimiz, kaybedecek az şeyimiz var."
 JUNO_brazil_events.50.b:0 "Egemenlik, servetten daha önemlidir."
 JUNO_brazil_events.50.desc:0 "[FROM.GetNameDef]'den diplomatlar, üye devletlerin ekonomik ve dış politika kararlarını birlikte koordine ettiği uluslarüstü bir örgüte üyelik teklifiyle bize yaklaştılar. Politikaları uyumlaştırmanın ekonomimize açık faydaları olsa ve güvenlik durumumuz iyileşebilse de, bazıları tarafından egemenlik kaybının faydalara değmediği savunuluyor."
 JUNO_brazil_events.50.t:0 "[FROM.GetNameDefCap] Mercosul Üyeliği Teklif Ediyor"
 JUNO_brazil_events.51.a:0 "Birlikte daha güçlüyüz."
 JUNO_brazil_events.51.desc:0 "Çok sayıda müzakere ve istişareden sonra, [FROM.GetNameDef] hükümeti nihayet Mercosul'a katılmayı kabul etti. Bundan sonra, bölge genelinde barış ve refahı sağlamak için ekonomik ve dış politika konularında işbirliği yapacağız."
 JUNO_brazil_events.51.t:0 "[FROM.GetNameDefCap] Mercosul Üyeliğini Kabul Ediyor"
 JUNO_brazil_events.52.a:0 "Tamamen saçmalık."
 JUNO_brazil_events.52.desc:0 "Çok sayıda müzakere ve istişareye rağmen, [FROM.GetNameDef] hükümeti Mercosul üyeliğini reddetti. Barış ve refah vaatlerine rağmen, örgütün uygulanabilirliğinden ikna olmamış görünüyorlar, hatta bunun bizim tarafımızdan arka kapıdan kontrol edilme yolu olduğunu iddia edecek kadar ileri gittiler. "
 JUNO_brazil_events.52.t:0 "[FROM.GetNameDefCap] Mercosul Üyeliğini Reddediyor"
 JUNO_brazil_events.53.a:0 "Ne kadar dar görüşlüler."
 JUNO_brazil_events.53.desc:0 "[FROM.GetNameDef]'den büyükelçiler, hükümetlerinin şu anda bizimle askeri işbirliğinin uluslarının çıkarlarına en iyi şekilde hizmet etmeyeceğine inandıklarını bize bildirdi. Bölgemiz için kendi tasarımları mı olduğu yoksa sadece bizim onlar için bir yük olarak mı görüldüğümüz belli değil."
 JUNO_brazil_events.53.t:0 "[FROM.GetName] Teklifi Reddediyor"
 JUNO_brazil_events.60.a:0 "Birlikte daha güçlüyüz!"
 JUNO_brazil_events.60.b:0 "Aslında bir topluluk olmasını tercih ederdik."
 JUNO_brazil_events.60.c:0 "Onlara katılma arzumuz yok."
 JUNO_brazil_events.60.desc:0 "[BRA.GetNameDefCap], hükümetimize yaklaşarak iki ülkemizin bir kez daha birleşmesini önerdi. Kültürlerimizdeki benzerlikleri ve Braganza Dükü Dom Duarte Nuno ile Orléans-Braganza Prensesi Maria Francisca arasındaki son evliliği bu teklifin nedenleri olarak gösteriyorlar ve [BRA.GetLeader] yönetimi altında birlikte daha güçlü olacağımızı temin ediyorlar."
 JUNO_brazil_events.60.t:0 "[BRA.GetNameDefCap] Birleşme Teklif Ediyor"
 JUNO_brazil_events.61.a:0 "Harika"
 JUNO_brazil_events.61.desc:0 "[POR.GetNameDef] ile önerdiğimiz birleşme coşkulu bir onayla karşılandı. Bu, ülkemiz için büyük yeni bir dönemin başlangıcını işaret ediyor!"
 JUNO_brazil_events.61.t:0 "[POR.GetNameDefCap] Birleşmeyi Kabul Ediyor"
 JUNO_brazil_events.62.a:0 "Kesinlikle, bu bize de aynı şekilde fayda sağlayabilir!"
 JUNO_brazil_events.62.b:0 "Eski sömürgecimizle bir topluluk mu? Kesinlikle hayır."
 JUNO_brazil_events.62.desc:0 "[POR.GetNameDef]'e son teklifimiz şaşırtıcı bir yanıt aldı. [POR.GetNameDefCap] birleşme fikrini reddediyor, ancak bunun yerine iki ulusumuz için bir topluluk öneriyor. Bu bize birleşmenin bazı faydalarını, daha az dezavantajını verecek ve her iki ulusumuzun da kendi benzersiz kimliğini korumasına olanak tanıyacaktır."
 JUNO_brazil_events.62.t:0 "[POR.GetNameDefCap] Topluluk Teklif Ediyor"
 JUNO_brazil_events.63.a:0 "Bundan ne kadar çok şey kazanılabileceğini görmüyorlar mı?"
 JUNO_brazil_events.63.desc:0 "[POR.GetNameDef]'e önerdiğimiz birleşme ilgisiz bir retle karşılandı. Onlara bu anlaşmanın faydalarını gösterme çabalarımıza rağmen, [POR.GetAdjective]ler ülkelerimizi bir kez daha birleştirmekle ilgilenmiyorlar. "
 JUNO_brazil_events.63.t:0 "[POR.GetNameDefCap] Birleşmeyi Reddediyor"
 JUNO_brazil_events.64.a:0 "Mükemmel!"
 JUNO_brazil_events.64.desc:0 "[BRA.GetNameDef]'e doğrudan katılmak yerine bir topluluk kurma karşı teklifimiz [BRA.GetAdjective] liderliği tarafından iyi karşılandı. Birleşme fikrinden vazgeçtiler ve bir topluluğun ikimiz için de harika olacağını kabul ettiler."
 JUNO_brazil_events.64.t:0 "[BRA.GetNameDefCap] Topluluk Kurmayı Kabul Ediyor"
 JUNO_brazil_events.65.a:0 "Onların kaybı."
 JUNO_brazil_events.65.desc:0 "[BRA.GetNameDef]'e doğrudan katılmak yerine bir topluluk kurma karşı teklifimiz [BRA.GetAdjective] liderliği tarafından kötü karşılandı. Bir kez daha bir sömürge olarak kontrolleri altına düşeceğimiz endişelerini gerekçe göstererek bir topluluk fikrini reddettiler."
 JUNO_brazil_events.65.t:0 "[BRA.GetNameDefCap] Topluluk Teklifini Reddediyor"
 JUNO_brazil_events.70.a:0 "Bu topraklar bir savaşa değmez."
 JUNO_brazil_events.70.b:0 "Küstahça bir talep!"
 JUNO_brazil_events.70.desc:0 "[FROM.GetAdjective] diplomatları bizimkilere bir ültimatom verdi. Dünya meselelerinin hassas durumu göz önüne alındığında, denizaşırı topraklarımızı koruyabileceğimize inanmadıklarını belirtiyorlar. Ancak tarihi bağlantılar nedeniyle bunu yapmaya uygun olduklarına inanıyorlar. Bu nedenle, topraklarının kontrolünü derhal devretmemizi talep ediyorlar."
 JUNO_brazil_events.70.t:0 "[FROM.GetNameDefCap] Denizaşırı Toprakları Talep Ediyor"
 JUNO_brazil_events.71.a:0 "Mükemmel!"
 JUNO_brazil_events.71.desc:0 "[FROM.GetNameDef] hükümeti, denizaşırı topraklarının kontrolünü bize devretmeyi akıllıca seçti. Bu, sanayimizin dünya genelindeki kaynaklara gümrüksüz erişimini sağlamalı ve büyük güçlerin bizi uluslararası meselelerde daha ciddiye almasını sağlamalıdır."
 JUNO_brazil_events.71.t:0 "[FROM.GetNameDefCap] Kolonileri Devretmeyi Kabul Ediyor"
 JUNO_brazil_events.72.a:0 "Bu okyanus ötesi bir savaşa değmez."
 JUNO_brazil_events.72.b:0 "O zaman toprağı zorla alacağız."
 JUNO_brazil_events.72.desc:0 "[FROM.GetNameDef] hükümeti, denizaşırı topraklarının kontrolünü bize devretmeyi aptalca reddetti. Bu aşağılanma diplomatik çevrelerde fark edilmedi değil. Dünyanın gözü üzerimizdeyken, nasıl yanıt vereceğimize karar vermeliyiz."
 JUNO_brazil_events.72.t:0 "[FROM.GetNameDefCap] Kolonileri Devretmeyi Reddediyor"
 JUNO_brazil_events.73.a:0 "Direnecek gücümüz yok."
 JUNO_brazil_events.73.b:0 "Bağımsızlığımızı asla teslim etmeyeceğiz!"
 JUNO_brazil_events.73.desc:0 "Küresel gerilimlerin ortasında, Atlantik'in ötesinden şaşırtıcı bir mesaj geldi. Bir zamanlar kolonimiz olan ve şimdi kendi başına yükselen bir güç olan [FROM.GetNonIdeologyName], cüretkar bir ültimatom yayınladı. [FROM.GetName]'in boyun eğmesini ve [FROM.GetAdjective] İmparatorluğu'na entegrasyonunu talep ediyorlar. Halkımız şok içinde, birçoğu [FROM.GetAdjective]'lerin cüretkarlığına öfkeli. Ancak diğerleri, [FROM.GetNonIdeologyName]’in artan gücünden ve kendi zayıflıklarımızdan korkarak, boyun eğmeyi düşünüyor. Nasıl yanıt vermeliyiz?"
 JUNO_brazil_events.73.t:0 "[FROM.GetAdjective] Ültimatomu"
 JUNO_brazil_events.74.a:0 "Sonunda yeniden bir araya geldik!"
 JUNO_brazil_events.74.desc:0 "Beklendiği gibi, [FROM.GetNonIdeologyName], boyun eğme talebimize razı oldu. Haber yayıldıkça, eski [FROM.GetNonIdeologyName] ulusu genelinde kasvetli bir hava yayıldı, birçok kişi yeni gerçeklikle boğuşuyor. Bu arada, vatansever bir coşku [ROOT.GetNonIdeologyName] halkını sardı."
 JUNO_brazil_events.74.t:0 "[FROM.GetNameDefCap] Boyun Eğmeyi Kabul Ediyor"
 JUNO_brazil_events.75.a:0 "Yapabileceğimiz pek bir şey yok."
 JUNO_brazil_events.75.b:0 "Bu karardan pişman olacaklar."
 JUNO_brazil_events.75.desc:0 "Meydan okuyan bir duruşla, [FROM.GetNonIdeologyName]'in hükümeti ültimatomumuzu şiddetle reddetti ve ulusun uzun süredir devam eden tarihini ve gururunu öne sürdü. Vatansever bir coşku şehirlerini sardı ve ordu, Atlantik ötesi potansiyel çatışmaya hazırlanarak seferber olmaya başladı."
 JUNO_brazil_events.75.t:0 "[FROM.GetNameDefCap] Boyun Eğme Talebini Reddediyor"
 JUNO_brazil_events.80.a:0 "Tekliflerini kabul ediyoruz."
 JUNO_brazil_events.80.b:0 "Kendimizi buna bağlamayacağız."
 JUNO_brazil_events.80.desc:0 "[FROM.GetNameDefCap], karşılıklı koruma garantileri teklifiyle bize yaklaştı. Güney Amerika'da barışın kırılgan hale geldiğini ve onu korumanın tek yolunun uluslarımız arasındaki bağları güçlendirmek olduğunu savunuyorlar. Bu teklifi kabul edersek, saldırıya uğramaları durumunda yardımlarına gelmemizi bekleyecekler."
 JUNO_brazil_events.80.t:0 "[FROM.GetNameDefCap] Karşılıklı Garantiler Teklif Ediyor"
 JUNO_brazil_events.81.a:0 "Mükemmel!"
 JUNO_brazil_events.81.desc:0 "[FROM.GetNameDefCap], karşılıklı koruma garantileri teklifimizi kabul etti. Umarım bu, kıtada uzun vadeli barışa yönelik ilk adımdır."
 JUNO_brazil_events.81.t:0 "[FROM.GetNameDefCap] Anlaşmayı Kabul Ediyor"
 JUNO_brazil_events.82.a:0 "Ne kadar uğursuz..."
 JUNO_brazil_events.82.desc:0 "[FROM.GetNameDefCap], cömert karşılıklı koruma garantileri teklifimizi reddetti. Bunun ulusumuzun uzun vadeli güvenliği için ne anlama geldiği henüz belli değil."
 JUNO_brazil_events.82.t:0 "[FROM.GetNameDefCap] Anlaşmayı Reddediyor"
 JUNO_brazil_events.83.a:0 "Harika bir fikir, onlara katılacağız!"
 JUNO_brazil_events.83.b:0 "Buna gerek görmüyoruz."
 JUNO_brazil_events.83.desc:0 "[FROM.GetAdjective] hükümeti, Amerikan Devletleri Örgütü'ne katılma davetiyle bize ulaştı. Arzuları, Amerikan kıtasındaki tüm ülkelerin bu örgütte birleşmesidir. Söz konusu örgüt, ortak çıkarlarımıza hizmet etmenin yanı sıra tüm üyeleri arasında iyi ilişkiler sağlamayı amaçlamaktadır."
 JUNO_brazil_events.83.t:0 "[FROM.GetNameDefCap] bizi Amerikan Devletleri Örgütü'ne davet ediyor"
 JUNO_brazil_events.84.a:0 "Gerçekten de yazık."
 JUNO_brazil_events.84.desc:0 "[FROM.GetNameDefCap]'in davetimize yanıtı yeni ulaştı. Ne yazık ki, onları yeniden düşünmeye ikna etme çabalarımıza rağmen Amerikan Devletleri Örgütü'ne katılmamayı seçtiler."
 JUNO_brazil_events.84.t:0 "[FROM.GetNameDefCap] Davetimizi Reddediyor"
 JUNO_brazil_events.85.a:0 "Sağlam bir karar!"
 JUNO_brazil_events.85.desc:0 "[FROM.GetNameDefCap]'in davetimize yanıtı yeni ulaştı. Umduğumuz gibi, [FROM.GetAdjective] liderliği Amerikan Devletleri Örgütü'ne katılmanın değerini gördü. Bundan sonra birlikte çalışacağız!"
 JUNO_brazil_events.85.t:0 "[FROM.GetNameDefCap] Davetimizi Kabul Ediyor"
 JUNO_brazil_events.86.a:0 "Yoldaşlarımıza bir kez daha yardım etmeliyiz!"
 JUNO_brazil_events.86.b:0 "Brezilya'da bir başarısız ayaklanma yeter."
 JUNO_brazil_events.86.desc:0 "[BRA.GetNameDef]'deki [BRA.GetCommunistParty] liderleri bir kez daha yardım istemek için bize ulaştılar. Şu anda silahlı bir çatışmada olmasalar da, 1935'te iktidarı ele geçirme başarısızlığı hala herkesin aklında yanıyor. Fiyaskonun tekrarlanmamasını sağlamak için yanlarında daha aktif olmamızı istiyorlar."
 JUNO_brazil_events.86.t:0 "[BRA.GetNameDef]'deki Komünistler Yardımımızı Talep Ediyor"
 JUNO_brazil_events.87.a:0 "[SOV.GetAdjective] yoldaşlarımıza güvenebileceğimizi biliyorduk!"
 JUNO_brazil_events.87.desc:0 "Umduğumuz gibi, [SOV.GetAdjective] liderliği bu zor zamanlarda bize destek teklif etti. Elbette tüm sorunlarımızı tamamen çözmelerine güvenemeyiz, ancak bir kez daha desteklerini almak kesinlikle çok hoş bir yardım."
 JUNO_brazil_events.87.t:0 "[SOV.GetNameDefCap] Bizi Desteklemeyi Kabul Ediyor!"
 JUNO_brazil_events.87.tt:0 "Bir iç savaş çıkması durumunda, [SOV.GetFlag]§Y[SOV.GetNameDef]§! bize gönüllüler gönderme ve kiralama ekipmanı verme olasılığı daha yüksektir."
 JUNO_brazil_events.88.a:0 "Onlara göstereceğiz!"
 JUNO_brazil_events.88.desc:0 "[SOV.GetNameDef]'nin ideolojik bağımıza rağmen bize destek vermeyi reddetmesi bizi şaşırttı. Onlara göre 1935'teki \"fiyasko\" bizi tekrar destekleme konusunda temkinli davranmalarına neden oldu."
 JUNO_brazil_events.88.t:0 "[SOV.GetNameDefCap] Yardım Çağrımızı Reddediyor"
 JUNO_brazil_events.88.tt:0 "§YGörüşte Düşüş§! kazandık ([SOV.GetFlag]§Y[SOV.GetName]§!'in görüşü §R-25§!.)"
 JUNO_brazil_events_153_tt:0 "§Y$BRA_cangaceiro_decision_cat$§! kararları ve §Y$BRA_cangaceiro_mission$§!, Cangaço tüm etkilenen eyaletlerden kaldırılana kadar aktif kalacaktır. \n\n§Y$BRA_deal_with_the_cangaceiro$§! Milli Hedefi, Cangaço'yu kaldırmak için kararların kilidini açacaktır."
 JUNO_brazil_events_160_tt:0 "§Y[FROM.GetNameDefCap]§! aşağıdakilerden birinin kilidini açacaktır:"
 JUNO_brazil_news.1.a:0 "Bunların hepsi kesinlikle sadece retorik, değil mi?"
 JUNO_brazil_news.1.d:0 "[BRA.GetAdjective] hükümeti son zamanlarda dış politika konularında giderek daha kavgacı ve iddialı bir tavır alıyor. Onlarca yıllık kargaşadan sonra, son rejim şimdi komşularının zararına [BRA.GetName]'e fayda sağlayan fırsatlar için sınırlarının ötesine bakacak kadar güvende hissediyor gibi görünüyor. Bunun Brezilya hükümetiyle ilişkimiz için ne anlama geldiği henüz belli değil."
 JUNO_brazil_news.1.t:0 "[BRA.GetNonIdeologyName] Agresif Dış Politika İzliyor"
 JUNO_brazil_news.2.a:0 "Çok yaşa kral."
 JUNO_brazil_news.2.d:0 "Azalan destek ve imparatorluk restorasyon hareketinin son zamanlardaki popülerlik artışının ardından, [BRA.GetAdjective] Ulusal Kongresi halkla uzlaşmayı kabul etti. Anayasal bir hükümdar taçlandırılacak, ancak Ulusal Kongre ülke üzerindeki siyasi gücünü hala elinde tutacak. Durumu istikrara kavuşturmak amacıyla nominal görevler yeni taç giyen krala devredilecektir. "
 JUNO_brazil_news.2.t:0 "[BRA.GetNameDefCap] Yeni Hükümdarını Taçlandırdı"
 JUNO_brazil_news.3.a:0 " Aferin onlara! "
 JUNO_brazil_news.3.d:0 "[BRA.GetNameDef] ve [POR.GetNameDef]'de artan monarşist duyguların ardından, iki ülke bir kez daha tek bir hükümdar ve bayrak altında birleşmeye karar verdi. Birbirlerinin bilgi ve kaynaklarını kullanma isteklerini gerekçe göstererek, iki ulus şimdi tek olarak birlikte büyümeye kararlı."
 JUNO_brazil_news.3.t:0 "[BRA.GetNonIdeologyName] ve [POR.GetNonIdeologyName] Birleşmeyi Duyurdu"
 JUNO_brazil_news.4.a:0 "Oldukça beklenmedik bir gelişme."
 JUNO_brazil_news.4.d:0 "[BRA.GetNameDefCap] ve [POR.GetNameDefCap] arasındaki daha derin ilişkiler ve işbirliklerinin ardından, iki ülke şimdi işbirliklerini daha da artırmak için ortak bir topluluk kurmaya karar verdi."
 JUNO_brazil_news.4.t:0 "[BRA.GetNonIdeologyName] ve [POR.GetNonIdeologyName] Topluluk Kurdu"
 JUNO_brazil_news.5.a:0 "Bunun böyle olması bir trajedi."
 JUNO_brazil_news.5.d:0 "[BRA.GetNonIdeologyName]'deki devam eden kargaşa son günlerde kontrolden çıktı ve kanlı bir iç savaşa yol açtı. Hükümet 1935'te komünist hareketin rejimi devirme planını engellemişti, ancak daha büyük kızıl gelgiti durduramadılar. Ordunun büyük bir kısmı merkezi hükümete sadık kalırken, birçok alt rütbeli subay komünistlerin yanında yer alıyor. Bölgedeki birçok kişi, komünist bir [BRA.GetNonIdeologyName]'in Güney Amerika kıtası boyunca bir domino etkisini tetikleyeceğinden endişe ediyor."
 JUNO_brazil_news.5.t:0 "[BRA.GetAdjective] Komünist Devrimi"
 JUNO_brazil_news.6.a:0 "Ama yeni hükümet kalıcı olacak mı?"
 JUNO_brazil_news.6.d:0 "[BRA.GetNonIdeologyName]'deki devam eden kargaşa son günlerde kontrolden çıktı ve komünist bir darbeye yol açtı. Hükümet 1935'te komünist hareketin rejimi devirme planını engellemişti, ancak daha büyük kızıl gelgiti durduramadılar. Ordunun büyük bir kısmı merkezi hükümete sadık kalırken, birçok alt rütbeli subay komünistlerin yanında yer alıyor. Bölgedeki birçok kişi, komünist bir [BRA.GetNonIdeologyName]'in Güney Amerika kıtası boyunca bir domino etkisini tetikleyeceğinden endişe ediyor."
 JUNO_brazil_news.6.t:0 "[ROOT.GetNonIdeologyName]'de Komünist Darbe"
 JUNO_brazil_news.7.a:0 "Çok yaşa Orléans-Braganza'dan Pedro Gastão!"
 JUNO_brazil_news.7.desc:0 "Yaşlı imparatorumuz, Grão Pará Prensi ve Brezilya İmparatoru Orléans-Braganza'dan Dom Pedro de Alcântara vefat etti. Kısa süren hükümdarlığı boyunca halkımız için bir barış ve istikrar sembolü olarak hizmet etmiş ve bu çalkantılı zamanlarda [FROM.GetAdjective]ler için bir toplanma noktası olmuştur. Yas tutan halk, ölen imparatora olan minnet ve desteklerini göstermek için sokaklara döküldü. \n\n Ulus, eski imparatorun varisi ve halefi Prens Pedro Gastão'nun [FROM.GetAdjective] halkı için benzer şekilde sarsılmaz bir dayanak olacağını umuyor. Prens yakında İmparator Dom Pedro IV olarak taç giyecek - çok yaşasın!"
 JUNO_brazil_news.7.t:0 "Pedro de Alcântara'nın Ölümü"
 JUNO_guay_events.1.a:0 "Harika"
 JUNO_guay_events.1.desc:0 "Askeri subaylar, iktidardaki hükümete desteklerini dile getirdi. Yatıştırma stratejisi işe yaradı ve orduya aktarılan fonların bazı ek faydaları olmuş gibi görünüyor."
 JUNO_guay_events.1.t:0 "Subaylar hükümeti destekliyor"
 JUNO_guay_events.10.a:0 "Ölümüne o zaman."
 JUNO_guay_events.10.desc:0 "[FROM.GetNameDefCap] bize barış olmayacağını bildirdi. [FROM.Getname]'in ülkemizi tamamen ilhak etme niyetinde olduğu açık. Bu, son adam kalana kadar topyekun bir savaş."
 JUNO_guay_events.10.t:0 "[FROM.GetNameDef] Saldırıya Devam Etmeye Karar Verdi"
 JUNO_guay_events.2.a:0 "İyi bir yatırım"
 JUNO_guay_events.2.b:0 "İlgilenmiyorum"
 JUNO_guay_events.2.desc:0 "[FROM.GetName] sanayileşmek istiyor. Çok sayıda nehri olan bir ülke olduğu için bir baraj, elektrifikasyon için bariz bir adaydır. Yatırım yapmaya karar verirsek, 2 yıl içinde geri ödeme bekleyebiliriz."
 JUNO_guay_events.2.t:0 "[FROM.GetNameDefCap] bir baraj inşaatına yatırım yapmamızı istiyor."
 JUNO_guay_events.2.tt:0 "[FROM.GetName], birbirimizle savaşa girmediğimiz sürece 2 yıl içinde bize geri ödeme yapmak zorunda kalacak."
 JUNO_guay_events.3.a:0 "Harika!"
 JUNO_guay_events.3.desc:0 "[FROM.GetName] ülkemize yatırım yapmayı kabul etti. Bu kesinlikle bizi birbirimize daha da yakınlaştıracaktır!"
 JUNO_guay_events.3.t:0 "[FROM.GetName] Kabul Ediyor!"
 JUNO_guay_events.4.a:0 "Kesinlikle bir aksilik."
 JUNO_guay_events.4.desc:0 "[FROM.GetName] ülkemize yatırım yapma fikrini reddetti. Bu diplomatik bir başarısızlıktan başka bir şey olarak görülemez."
 JUNO_guay_events.4.t:0 "[FROM.GetName] Reddediyor!"
 JUNO_guay_events.5.a:0 "Her şeyin bir bedeli vardır."
 JUNO_guay_events.5.desc:0 "[?var:old_world_power.GetName]'e olan borçlarımızı geri ödeme zamanı geldi. Bu bir süre ekonomimizi zedeleyecek olsa da, her iyi ekonomistin söyleyeceği gibi, eğer yatırım yapılırsa borç her zaman kötü değildir, ki biz de bunu yaptık."
 JUNO_guay_events.5.t:0 "Baraj Yatırımı için Geri Ödeme"
 JUNO_guay_events.6.a:0 "Bu sonuçsuz savaşı sürdüremeyiz."
 JUNO_guay_events.6.b:0 "Topraklar haklı olarak bizimdir"
 JUNO_guay_events.6.desc:0 "[FROM.GetAdjective] ordusu, daha küçük boyutuna rağmen, kendi kuvvetlerimize göre önemli toprak ve askeri kazanımlar elde etti. Tartışmalı bölge şimdi tamamen [FROM.GetName]'in elinde, bu da bölge üzerindeki meşruiyetimizi büyük ölçüde düşürüyor. Bu savaşı sürdürmek, ki bu kesinlikle birliklerimizi demoralize edecektir, ya da kaybettiğimiz toprağı devretmek arasında seçim yapmalıyız."
 JUNO_guay_events.6.t:0 "[FROM.GetAdjective] Askeri İlerlemesi"
 JUNO_guay_events.7.a:0 "Hakimiyete bir adım daha yakın."
 JUNO_guay_events.7.b:0 "Aslında bu oldukça iyi gidiyor, devam edelim"
 JUNO_guay_events.7.desc:0 "Muzaffer birliklerimiz düşmanlarımızı haklı topraklarımızdan attı. [FROM.GetName], kaybedilmiş bir savaşta savaşmak yerine pes etmeye ve toprakları bize vermeye karar verdi. Bizim için prestijli bir zafer, bilmedikleri şey ise bunun sadece başlangıç olduğudur."
 JUNO_guay_events.7.t:0 "[FROM.GetName] Pes Ediyor"
 JUNO_guay_events.8.a:0 "Bu maskaralığa bir son verelim"
 JUNO_guay_events.8.desc:0 "[FROM.GetName], çekirdek toprakları üzerindeki hakimiyetlerinden vazgeçmelerini düşünmenin bile hakaret olduğunu bize bildirdi. Hükümetimiz devrilene ve ordumuz dağıtılana kadar savaşmaya devam edeceklerini bize bildiriyorlar."
 JUNO_guay_events.8.t:0 "[FROM.GetName] Boyun Eğmeyi Reddediyor"
 JUNO_guay_events.9.a:0 "Büyük bir lütuf."
 JUNO_guay_events.9.desc:0 "[FROM.GetName], altyapılarına yaptığımız yatırımdan kaynaklanan borcunu geri ödedi. Bu anlaşmaya uymak ülkelerimizi birbirine daha da yakınlaştırdı."
 JUNO_guay_events.9.t:0 "[FROM.GetName] Baraj Yatırımını Geri Ödüyor"
 TOA_ven_blockade.1.a:0 "[FROM.GetName]'e karşı duramayız"
 TOA_ven_blockade.1.b:0 "Bu bir savaş ilanıdır!"
 TOA_ven_blockade.1.desc:0 "[FROM.GetName], rakiplerine giden petrol sevkiyatlarını ablukaya almak amacıyla kıyılarımızın hemen dışına savaş gemileri yerleştirdi. [FROM.GetAdjective] hükümeti, doğrudan çatışma aramadıklarını, bunun yerine düşmanlarına baskı yapmak için bir önlem olduğunu ilan ediyor. Bu kesinlikle bir tırmanış ve henüz kimse zarar görmemiş olsa da, bölgedeki savaş gemilerinin varlığı Karakas'taki atmosferi gerdi."
 TOA_ven_blockade.1.t:0 "[FROM.GetName] petrol sevkiyatını ablukaya alıyor"
 TOA_ven_blockade.2.a:0 "Tarafsızlığın açık bir ihlali!"
 TOA_ven_blockade.2.desc:0 "[FROM.GetName], [VEN.GetNameDef]'yi tamamen ablukaya almak için cesur ve çirkin bir adım attı. Başkent Savaş Gemileri Caracas'ın dışında görüldü ve [VEN.GetAdjective] hükümete, ülkelerimiz arasındaki petrol ticaretini durdurmak için tam bir abluka uygulandığı konusunda bilgi verildiği iddia ediliyor."
 TOA_ven_blockade.2.t:0 "$TOA_ven_blockade.1.t$"
 brazil_promoting_communism_tt:0 "Politikamız üzerindeki [FROM.GetAdjective] nüfuzuyla mücadele etmek için §YKomünizme Baskı Yap§! kararının kilidini aç."
 german_busch_and_gualberto_imprisoned:0 "Generaller §YGermán Busch§! ve §YGualberto Villarroel López§! hapsedildi"
 higinio_and_estigarrabia_wont_cooperate:0 "Generaller §YJosé Félix Estigarribia§! ve §YHiginio Morínigo§! yeni hükümetimizle §Rİşbirliği Yapmayacak§!"
 nacista_coup_attempt_happened:0 "Nacista Darbe Girişimi Zaten Gerçekleşti"
 paraguay.1.a:0 "Harika bir fikir"
 paraguay.1.b:0 "Bu bütçede yok"
 paraguay.1.desc:0 "Humaitá'yı yeniden inşa etmek bize savunma harcamalarını artırma ve çevredeki alanlara ek tahkimat ekleme fırsatı verdi, buna Başkentin nehir girişini daha da savunmak için daha küçük bir kale de dahil."
 paraguay.1.t:0 "Artan Kale Harcamaları için Fırsat"
 paraguay.1.tt:0 "§Y$PAR_rebuild_humaita$§! tamamlandığında ek olarak ekle: "
 rafael_franco_is_exiled:0 "General §YRafael Franco§! sürgün edilir"
 south_american_events.1.a:0 "Alfredo Baldomir, Terra'nın yerini alacak"
 south_american_events.1.b:0 "Bir şekilde, Ulusal Parti üstünlüğü ele geçirdi"
 south_american_events.1.c:0 "Halk kararını verdi!"
 south_american_events.1.d:0 "Aklımızda başka bir şey var..."
 south_american_events.1.desc:0 "Ülkenin siyaseti üzerinde sıkı bir kontrole sahip bir diktatör olmasına rağmen, Gabriel Terra bir kez daha seçim düzenleyeceğini açıkladı. Ancak birçok kişi sonucu zaten biliyor, çünkü Colorado partisi iktidarı bırakmayacak ve Terra'nın kayınbiraderi Alfredo Baldomir, parti içindeki tek gerçek halefidir. Yine de, halk Uruguay için yeni bir gelecek için oy kullanmaya gidiyor."
 south_american_events.1.t:0 "Terra ulusal seçimler düzenliyor"
 south_american_events.10.a:0 "[FROM.GetAdjective]ler tarafından alt edilmeyeceğiz!"
 south_american_events.10.d:0 "[FROM.GetAdjective] hükümetinin filolarını daha fazla ana muharebe gemisiyle genişletme niyetini açıklamasıyla, kıtadaki kırılgan güç dengesi sarsılmış görünüyor. Şimdi saldırgan komşumuzun yeniden ortaya çıkan tehdidine nasıl yanıt vereceğimize karar vermeliyiz."
 south_american_events.10.t:0 "[FROM.GetName] Deniz Genişlemesini Duyurdu"
 south_american_events.11.a:0 "Ayala istifa etmeli, bunun büyümesine izin veremeyiz..."
 south_american_events.11.b:0 "Cumhuriyetimizi tehdit ettikleri için onlara bedelini ödetin!"
 south_american_events.11.d:0 "Başkan Eusebio Ayala, sağ kolu José Félix Estigarribia ile birlikte ülkemizi Bolivya'ya karşı savaştan zafere taşısa da, savaşın en başta meydana gelmesinden kendisi ve hükümeti büyük ölçüde sorumludur ve ülke genelinde kendisine karşı büyük bir hoşnutsuzluk vardır. Şimdi, birçok subay kendini uyuşuk ve zayıf liberal hükümete düşman ilan etti ve yarbaylar Federico Wenman Smith ve Camildo Recalde Asunción'u işgal ettiler ve Eusebio Ayala'nın derhal istifasını talep ediyorlar!"
 south_american_events.11.t:0 "Askeri Darbe Girişimi"
 south_american_events.12.a:0 "Tejada Sorzano istifasını halka duyurmalı"
 south_american_events.12.b:0 "İsyanlarını hemen şimdi bastırın!"
 south_american_events.12.d:0 "Ülkede şimdiye kadar bilinen en büyük grev hareketinin ardından, genç yarbay Germán Busch yönetimindeki ordu, Tejada hükümetini devirmek için harekete geçti. Onlar, Tejada'nın aksine, Bolivya halkının ve Birleşik Sosyalist Parti ile Sendikaların sosyalist ideallerinin yanında olduklarını iddia ediyorlar. Onları durdurmak için yapılabilecek bir şey var mı, yoksa Chaco savaşı felaketi göz önüne alındığında zaten çok mu geç?"
 south_american_events.12.t:0 "Germán Busch Hükümeti Devirmek İçin Harekete Geçiyor"
 south_american_events.13.a:0 "İnsanlara yardım etmeliyiz!"
 south_american_events.13.b:0 "Daha büyük sorunlarımız var"
 south_american_events.13.d:0 "Dün 23:32'de, yeryüzü Chillán'ın altında şiddetle sallanmaya başladı ve şehrin yarısından fazlasını yok etti. 23:35'te Concepción şiddetle vuruldu. Neredeyse tüm binalar tamamen yıkıldı. Depremin yüzey dalgası büyüklüğünün 8.3 ve maksimum Mercalli yoğunluğunun X olduğu tahmin ediliyor, yaklaşık 28000 kişilik bir ölü sayısı bırakarak, çok daha fazlası yerinden edilmiş veya yaralanmış. Bugün, Şili halkı için kasvetli bir gün."
 south_american_events.13.t:0 "Büyük Chillán Depremi"
 south_american_events.14.a:0 "Pedro Aguirre Cerda"
 south_american_events.14.b:0 "Gustavo Ross"
 south_american_events.14.c:0 "Carlos Ibáñez del Campo"
 south_american_events.14.d:0 "Başkanlık seçimi nihayet geldi ve başkan Arturo Alessandri'nin son dönemi sona erdi. Ülke hala artan hoşnutsuzluk ve radikalizm yaşıyor, hem sağa hem de sola doğru ve kimse ülkeyi ekonomik felaketten düzgün bir şekilde kurtarmanın kesin cevabını gerçekten bilmiyor. Alessandri'nin yerini kim almalı ve ülkeyi geleceğe kim götürmeli?"
 south_american_events.14.e:0 "Elías Lafertte Gaviño"
 south_american_events.14.t:0 "1938 Başkanlık Seçimi"
 south_american_events.15.a:0 "Onları durdurmaya çalışmanın bir faydası yok..."
 south_american_events.15.b:0 "Onları yok edin!"
 south_american_events.15.desc:0 "Rafael Franco'nun başkanlık yetkilerini artıran ve uluslararası olarak tanınan Bolivya'nın Chaco Boreal bölgelerine ilerlemiş mevzileri terk eden birkaç icra emrini imzalamasının ardından, ordunun bir kısmı hükümete isyan etti ve onu devirmeye çalışıyor. Yaptıkları şey adil mi?"
 south_american_events.15.t:0 "Ordu İsyan Ediyor"
 south_american_events.16.a:0 "Bırakın halk istediğini yapsın"
 south_american_events.16.b:0 "Bu aptallığı bastırmalıyız"
 south_american_events.16.c:0 "Bir bildikleri var"
 south_american_events.16.desc:0 "1800'lerin sonlarındaki Pasifik Savaşı'nda Litoral Departmanı'nı Şili'ye kaybetmemizden bu yana bir gelenek olarak, yıllık Día del Mar Kutlamaları bugün, bir zamanlar Şili'ye karşı savaşan Bolivyalı kahramanları anmak için yapılıyor. Birçok kişi bunu, savaştan sonra karayla çevrili kaldığımızda kaybettiğimiz Pasifik Okyanusu'na erişim taleplerimizi yinelemek için bir fırsat olarak görüyor. Halkın protesto etmesine izin vermeli miyiz?"
 south_american_events.16.t:0 "Día del Mar Kutlamaları"
 south_american_events.17.a:0 "Ülkemizin barışa ihtiyacı var!"
 south_american_events.17.b:0 "Pastaza için savaşacağız!"
 south_american_events.17.desc:0 "[PRU.GetAdjective] diplomatlarından beklenmedik bir bildiri geldi. Bildiride koşullu bir barış teklifi vardı, onlara Pastaza'yı veririz ve onlar da kuvvetlerini ülkemizin geri kalanından çekerler. Bunu dikkatlice düşünmemiz gerekecek, toprağımız için savaşı sürdürmek ya da barışa sahip olmak, ama toprağımızın bir kısmını devretmek."
 south_american_events.17.t:0 "[PRU.GetNameDefCap], Pastaza Karşılığında Beyaz Barış Teklif Ediyor"
 south_american_events.18.a:0 "Nihayet!"
 south_american_events.18.desc:0 "Memnuniyetimize göre [ECU.GetNameDef], beyaz bir barış için Pastaza'yı devretmeye karar verdi. Eyaleti bir nevi barışçıl bir şekilde ilhak ettik ve entegrasyon çabaları başladı. Bu, Pastaza eyaleti için yeni bir başlangıcı işaret ediyor!"
 south_american_events.18.t:0 "[ECU.GetNameDefCap], Barış için Pastaza'yı devrediyor"
 south_american_events.19.a:0 "Ne kadar talihsiz..."
 south_american_events.19.desc:0 "[ECU.GetNameDefCap], barış tekliflerimize olumsuz yanıt verdi. Toprak bütünlüklerinin sorgulanamayacağını iddia ederek, savaştaki mevcut durumlarına rağmen geri savaşmaya devam etmeyi seçtiler. Bize onlarla savaşmaya devam etmekten başka seçenek bırakmıyorlar."
 south_american_events.19.t:0 "[ECU.GetNameDefCap] Toprak Devretmeyi Reddediyor"
 south_american_events.2.a:0 "Açıkçası Topçunun modernizasyona ihtiyacı var"
 south_american_events.2.b:0 "Gökyüzündeki düşmanlara karşı kendimizi savunabilmeliyiz!"
 south_american_events.2.c:0 "Tankları oldukları yerde durdurabilmeliyiz"
 south_american_events.2.desc:0 "Ağır silah üretimini modernize etme konusundaki son çabalarımızdan yola çıkarak, uzmanlarımız bir sonuca vardılar. Üretim hatlarımızın son derece verimsiz hale gelmesini ve ulusumuzun güvenliğine bir zarar vermesini istemiyorsak, Ağır Silahlar Departmanını uzmanlaştırmalıyız. Ne seçmeliyiz?"
 south_american_events.2.t:0 "Ulusal Ağır Silahlar Departmanını Uzmanlaştırma"
 south_american_events.20.a:0 "Adil bir anlaşma, derslerini almışlar."
 south_american_events.20.b:0 "Daha fazlasını alabilecekken neden daha azıyla yetinelim?"
 south_american_events.20.desc:0 "[PRU.GetAdjective] diplomatlarından beklenmedik bir bildiri geldi. Bildiride koşullu bir barış teklifi vardı, bize Loreto'yu verirler ve biz de kuvvetlerimizi ülkelerinin geri kalanından çekeriz. Bunu dikkatlice düşünmemiz gerekecek, şu anda sahip olduklarımızla yetinebiliriz ya da daha fazla toprak kazanma umuduyla savaşı sürdürebiliriz."
 south_american_events.20.t:0 "[PRU.GetNameDefCap], Barış Karşılığında Loreto'yu teklif ediyor"
 south_american_events.21.a:0 "Daha az kötü olanı seçtik"
 south_american_events.21.desc:0 "[ECU.GetNameDefCap], önerdiğimiz beyaz barışa olumlu yanıt verdi. Ne yazık ki bu yüksek bir bedelle geldi, çünkü Loreto'yu [ECU.GetAdjective] liderliğine devrettik."
 south_american_events.21.t:0 "[ECU.GetNameDefCap], Barış Teklifimizi Kabul Ediyor"
 south_american_events.22.a:0 "Bu ideal değil..."
 south_american_events.22.desc:0 "[ECU.GetNameDefCap], beyaz bir barış tekliflerimize olumsuz yanıt verdi. Mevcut durumda [ECU.GetAdjective]ler savaşmayı bırakmak için bir neden görmüyor. Bize onlarla savaşmaya devam etmekten başka seçenek bırakmıyorlar."
 south_american_events.22.t:0 "[ECU.GetNameDefCap], Barış Teklifimizi Reddediyor"
 south_american_events.30.a:0 "Onları ekonomik ve diplomatik olarak izole edin."
 south_american_events.30.b:0 "Diplomatik bağları koparın."
 south_american_events.30.c:0 "Daha acil endişelerimiz var."
 south_american_events.30.desc:0 "[FROM.GetAdjective] hükümetinin komünist güçler tarafından yakın zamanda devrilmesiyle, ulusumuzda sert bir yanıt için baskı artıyor. Medya, kızıl tehdit ve [FROM.GetNonIdeologyName]'in çıkarlarımıza oluşturduğu tehdit hakkında abartılı raporlarla dolu. Bu arada, iş sahipleri ülkedeki kayıp yatırımları için tazminat talep ediyor. \n\nHalkı sakinleştirmek ve [FROM.GetNonIdeologyName]'e bu yarımkürede komünizme müsamaha göstermeyeceğimize dair net bir mesaj göndermek için hızla hareket etmeliyiz."
 south_american_events.30.t:0 "[FROM.GetNonIdeologyName]'i İzole Etme Baskısı"
 south_american_events.31.a:0 "Kibirli emperyalistler!"
 south_american_events.31.desc.a:0 "[FROM.GetAdjective] diplomatları, hükümetlerinden sert bir bildiri yayınladıktan sonra bugün [ROOT.Capital.GetCapitalVictoryPointName]'daki elçiliklerini terk ettiler. Diğer uluslarla çatışmaya girersek artık yardımımıza gelmeyeceklerini ve bizi ulusun meşru hükümeti olarak kabul etmediklerini belirtiyorlar.\n\nAyrıca, ekonomimizi zayıflatmak amacıyla bize karşı bir ambargo uyguladılar. [FROM.GetNameDef]'in rejimimize düşman olacağı aşikar olsa da, eylemlerinin hızı ve gücü birçok kişiyi şok etti."
 south_american_events.31.desc.b:0 "[FROM.GetAdjective] diplomatları, hükümetlerinden sert bir bildiri yayınladıktan sonra bugün [ROOT.Capital.GetCapitalVictoryPointName]'daki elçiliklerini terk ettiler. Diğer uluslarla çatışmaya girersek artık yardımımıza gelmeyeceklerini ve bizi ulusun meşru hükümeti olarak kabul etmediklerini belirtiyorlar. \n\n[FROM.GetNameDef]'in rejimimize düşman olacağı aşikar olsa da, eylemlerinin hızı ve gücü birçok kişiyi şok etti."
 south_american_events.31.t:0 "[FROM.GetNameDefCap], [ROOT.GetNonIdeologyName]'i İzole Etmeye Çalışıyor"
 south_american_events.32.a:0 "İyi donanımlı gönüllülerin [FROM.GetNonIdeologyName]'e gitmesine göz yumacağız."
 south_american_events.32.b:0 "Müdahale edemeyiz."
 south_american_events.32.desc:0 "[FROM.GetNonIdeologyName] son zamanlarda iç savaşa sürüklendiği için, birçok sanayicimiz ve bireysel vatandaşımız, komünist tehdidi kontrol altına almaya çalışan zor durumdaki [FROM.GetAdjective] hükümetine yardım topluyor.\n\nOrdudaki daha ateşli anti-komünistlerden bazıları şimdi bunu, hükümet için makul bir inkar edilebilirlik sağlarken, çatışmaya yardım etmek için askeri gönüllüleri donatıp göndermek için bir fırsat olarak kullanmamızı öneriyor."
 south_american_events.32.t:0 "[FROM.GetNonIdeologyName]'deki Anti-Komünistleri Destekle"
 south_american_events.50.a:0 "[FROM.FROM.GetNonIdeologyName]'e karşı düşmanlıklara son verilmesini talep et"
 south_american_events.50.b:0 "Askerlerimiz neden [FROM.FROM.GetNonIdeologyName] için ölsün ki?"
 south_american_events.50.desc:0 "Monroe doktrinine olan bağlılığımız, [FROM.FROM.GetNameDef]'e karşı son savaş ilanıyla sorgulanıyor. Kendi vatandaşlarımızın birçoğu [FROM.FROM.GetNonIdeologyName]'in savunmasında savaşmak için gönderilme ihtimalinden hevesli olmasa da, dış politika uzmanlarımız onların savunmasında harekete geçmemenin, yabancı güçlerin yarımküremize müdahale etmesinin bir domino etkisine yol açabileceğinden endişe duyuyor."
 south_american_events.50.t:0 "[FROM.FROM.GetNameDefCap] Saldırı Altında"
 south_american_events.51.a:0 "[USA.GetNameDef] ile bir çatışmaya ilgimiz yok"
 south_american_events.51.b:0 "Bu onları ilgilendirmez, blöflerini gör."
 south_american_events.51.desc:0 "Diplomatlarımız [USA.GetNameDef]'in Amerika'daki faaliyetlerimize göz yumacağını ummuştu, ama görünüşe göre böyle bir şansımız olmadı. Şimdi [USA.Capital.GetCapitalVictoryPointName]'den, yarımküredeki tüm düşmanca faaliyetleri durdurmamızı talep eden acil bir bildiri aldık, aksi takdirde bunu [USA.GetNameDef]'e karşı bir savaş eylemi olarak kabul edecekler. Bu çatışmanın daha da tırmanmasını önlemek istiyorsak dikkatli olmalıyız."
 south_american_events.51.t:0 "[USA.GetNameDefCap] Monroe Doktrinini Uyguluyor"
 south_american_events.52.a:0 "Dünya arka bahçemizi işgal etmeden önce iki kez düşünecek."
 south_american_events.52.b:0 "Sam Amca'ya teşekkürlerimizle."
 south_american_events.52.desc:0 "[FROM.GetAdjective] diplomatları, Batı yarımküresindeki düşmanlıklara son vermeye ve şimdilik sorunlarını çözmek için diplomatik yollara geri dönmeye hazır olduklarını bize bildirdi. Bu aracılıkla sağlanan barışın sürüp sürmeyeceği henüz belli değil."
 south_american_events.52.t:0 "[FROM.GetNameDefCap] Düşmanlıklara Son Vermeyi Kabul Ediyor"
 south_american_events.53.a:0 "O zaman savaş demektir..."
 south_american_events.53.desc:0 "[FROM.GetAdjective] diplomatları, [USA.GetNameDef]'in hükümetlerinin sözde meşru şikayetlerine müdahale etme hakkı olmadığını bize bildirdi. Bu nedenle, gerekli gördükleri sürece Batı yarımküresinde kendi çıkarları doğrultusunda hareket etmeye devam edeceklerini belirttiler."
 south_american_events.53.t:0 "[FROM.GetNameDefCap] Düşmanlıklara Son Vermeyi Reddediyor"
 south_american_events.54.a:0 "Mükemmel!"
 south_american_events.54.desc:0 "[FROM.Capital.GetCapitalVictoryPointName]'den, bize karşı yürütülen saldırı eylemine izin vermeyeceklerini ve düşmanlıkları sona erdirmek için düşmanlarımızla görüşmelerde bulunduklarını belirten acil bir bildiri aldık. Bunu başaramazlarsa, savunmamıza geleceklerine yemin ettiler."
 south_american_events.54.t:0 "[FROM.GetNameDefCap] Monroe Doktrinini Uyguluyor"
 south_american_events.55.a:0 "O zaman kendi başımızayız..."
 south_american_events.55.desc:0 "[FROM.GetNameDefCap]'in [ROOT.Capital.GetCapitalVictoryPointName]'daki büyükelçiliği, bölgedeki son düşmanlıklar nedeniyle bugün erken saatlerde boşaltıldı. Büyükelçilikten diplomatlar, hükümetlerinin başka bir yabancı savaşa bulaşma arzusu olmadığını bize bildirdi."
 south_american_events.55.t:0 "[FROM.GetNameDefCap] Çatışmayı Görmezden Geliyor"
 south_american_events.60.a:0 "Devam etmelerine izin ver."
 south_american_events.60.b:0 "Bu sosyalist kışkırtıcılara baskı yap!"
 south_american_events.60.desc:0 "[MEX.GetNameDef]'den komünistlerin sınırlarımız içinde gösterileri kışkırttığı görüldü. Buna nasıl yanıt vermeliyiz?"
 south_american_events.60.t:0 "[MEX.GetNameDefCap] Komünist Duyarlılığı Kışkırtıyor"
 south_american_events.61.a:0 "Limanımızdan ayrılmasını talep et"
 south_american_events.61.b:0 "Limanda kalıp onarım yapmasına izin ver"
 south_american_events.61.desc:0 "Kriegsmarine ve Kraliyet donanması, Montevideo'nun hemen dışında şiddetli bir savaşta birbirleriyle çatıştı. [GER.GetAdjective] gemisi, ciddi şekilde hasar görmüş, saat 00.10 civarında limanlarımıza demir attı ve onarım talep ederken, İngiliz diplomatlar gemiyi denize zorlamamız için bize baskı yaptı, burada kaçınılmaz olarak Kraliyet Donanması tarafından yok edilecektir."
 south_american_events.61.t:0 "River Plate Muharebesi"
 south_american_events.62.a:0 "İlginç"
 south_american_events.62.desc:0 "Saat 06:18 civarında Kriegsmarine ve Kraliyet Donanması gemileri Montevideo'nun hemen dışında birbirleriyle çatıştı. Raporlara göre, Alman gemileri ağır hasar gördü ve Uruguay başkentinin limanına sığındı. İngiliz diplomatlar, Lahey sözleşmesine uygun olarak gemiyi limandan çıkmaya zorlaması için Uruguay hükümetine baskı yapıyor, burada bekleyen Kraliyet Donanması kuvvetleri tarafından kesinlikle yok edilebilir."
 south_american_events.62.t:0 "River Plate Muharebesi"
 south_american_events.63.a:0 "Devam etmelerine izin ver."
 south_american_events.63.b:0 "Bu faşist kışkırtıcılara baskı yap!"
 south_american_events.63.desc:0 "[MEX.GetNameDef]'den faşistlerin sınırlarımız içinde gösterileri kışkırttığı görüldü. Buna nasıl yanıt vermeliyiz?"
 south_american_events.63.t:0 "[MEX.GetNameDefCap] Faşist Duyarlılığı Kışkırtıyor"
 south_american_events_32_tt:0 "§Y$undisturbed_isolation$§! §Rpolitikası ve dünya gerilimi eşiği nedeniyle§! §Rgönüllü göndermekte zorlanacağız!§!"
 south_american_events_50_war_tt:0 "§RReddederlerse [FROM.GetName] ile savaşa yol açacaktır!§!"
 south_american_news.1.a:0 "Güney Amerika'ya ne olacak?"
 south_american_news.1.b:0 "Bu, Peru devleti için yeni bir dönemin başlangıcı olacak!"
 south_american_news.1.c:0 "¡No pasarán!"
 south_american_news.1.d:0 "Gran Colombia'nın dağılmasından bu yana Peru ve Ekvador sınırındaki Napo Pastaza ve Santiago Zamora bölgelerinde meydana gelen anlaşmazlıklardan kaynaklanan çatışmalar, şimdi iki ülkenin kuvvetleri arasında yaşanmaya başladı. Kolombiya ile sınırlardaki son anlaşma nedeniyle, Perulu askerler daha zayıf Ekvador Devleti'ne karşı taleplerini ileri sürme konusunda kendilerine güvendiler ve çatışmalar şimdi açık bir çatışmaya dönüştü. Bu, diğer ülkelerin müdahale etmeye çalışabileceği için bölgenin istikrarını test edecektir."
 south_american_news.1.t:0 "Güney Amerika'da Savaş"
 south_american_news.10.a:0 "Bu bölgeyi istikrarsızlaştırabilir."
 south_american_news.10.b:0 "Bu, bölgedeki nüfuzumuzu genişletmek için bir fırsat olabilir."
 south_american_news.10.d:0 "[BRA.GetAdjective], [CHL.GetAdjective] veya [ARG.GetAdjective] donanmalarının genişlemesini engelleyen resmi antlaşmalar olmasa da, Büyük Savaş'tan bu yana herhangi bir büyük genişlemeyi önleyen gayriresmi bir düzenleme olmuştur. Ancak, [FROM.GetAdjective] hükümetinin deniz yeteneklerini daha fazla ana muharebe gemisiyle genişletme niyetini açıklamasıyla, Güney Amerika'da yeni bir silahlanma yarışı kaçınılmaz görünüyor. \n\nBunun daha geniş jeopolitik durum için ne anlama geldiği henüz belli değil, ancak büyük güçlerin liderlerinin de durumu dikkatle izleyeceği varsayılabilir."
 south_american_news.10.t:0 "[FROM.GetName] Deniz Silahlanma Yarışını Tetikliyor"
 south_american_news.11.a:0 "Askeri bir diktatörlük ne şekilde sosyalist oluyor?"
 south_american_news.11.b:0 "Günü değerlendireceğiz!"
 south_american_news.11.d:0 "Bolivya'da şimdiye kadar bilinen en büyük grev hareketinin ardından, genç yarbay Germán Busch yönetimindeki ordu, José Luis Tejada Sorzano'nun Gerçek Cumhuriyetçi hükümetini devirmek için harekete geçti. Onlar, Tejada'nın aksine, Bolivya halkının ve onun sosyalist ideallerinin yanında olduklarını iddia ettiler ve şimdi Tejada'nın istifasıyla, Bolivya'nın tam kontrolünü ele geçirdiler."
 south_american_news.11.t:0 "1936 Bolivya Sosyalist Devrimi"
 south_american_news.12.a:0 "Ben o hamleyi yapmazdım"
 south_american_news.12.b:0 "Onların alçak Darbesine son verdik!"
 south_american_news.12.d:0 "Bolivya'da şimdiye kadar bilinen en büyük grev hareketinin ardından, genç yarbay Germán Busch yönetimindeki ordu, José Luis Tejada Sorzano'nun Gerçek Cumhuriyetçi hükümetini devirmek için harekete geçti. Onlar, Tejada'nın aksine, Bolivya halkının ve onun sosyalist ideallerinin yanında olduklarını iddia ettiler, ancak La Paz'ı ele geçiremedikleri için, polis ve kalan ordu mensupları gruplarını avlayıp liderlerini hapsetti."
 south_american_news.12.t:0 "Bolivyalı Generaller Darbelerini Beceremedi"
 south_american_news.13.a:0 "Korkunç"
 south_american_news.13.d:0 "8.3 büyüklüğünde, maksimum Mercalli yoğunluğu X olan bir deprem, Şili'nin Chillán ve Concepción şehirlerini tamamen harabeye çevirdi ve 28000'den fazla can kaybına neden oldu. Yeniden yapılanma ve yardım çabaları yolda, ancak birçok kişi zaten yerinden edildi ve bölgedeki ülkeler devam eden sorunu en iyi nasıl çözeceklerinden emin değiller."
 south_american_news.13.t:0 "Chillán Depreminin Ardından"
 south_american_news.14.a:0 "Bir başka faşist piyon"
 south_american_news.14.b:0 "Geleceğimiz Almanlarla"
 south_american_news.14.desc:0 "Ulusun liderliğinden artan memnuniyetsizliğin ardından, ordu harekete geçti ve general Higinio Morínigo'yu Paraguay'ın yeni başkanı olarak atadı. Faşist davaya sempati duyuyor ve karşılıklı koruma ve yardım için Arjantin'e yaklaşması muhtemel, bu da muhtemelen Brezilya'nın Paraguay veya Arjantin saldırganlığı durumunda kendilerini güvence altına almak için kendi ittifaklarını güçlendirmeye çalışmasına yol açacaktır."
 south_american_news.14.t:0 "Higinio Morínigo Paraguay'da İktidarı Ele Geçirdi"
 south_american_news.2.a:0 "Aferin onlara"
 south_american_news.2.b:0 "Özlenecek"
 south_american_news.2.d:0 "Uruguay Devlet Başkanı Gabriel Terra, geçen hafta seçim düzenleyeceğini ve iktidardan çekileceğini açıkladı; bu, 1933'te bir darbe ile uzattığı bir kuraldı. İktidar, Terra'nın kayınbiraderi, müttefik yanlısı politikacı Alfredo Baldomir Ferrari'ye devredilecektir."
 south_american_news.2.t:0 "Uruguay'da Yeni bir Başkan"
 south_american_news.20.a:0 "Mahkum bir Fikir"
 south_american_news.20.b:0 "Antiller Antillilerindir!"
 south_american_news.20.d:0 "Antil Konfederasyonu, Karayipler'in yerlilerinin Antil uluslarının egemenliğini ve refahını korumayı amaçlayan bölgesel bir varlıkta birleşme ihtiyacı hakkındaki Ramón Emeterio Betances'in şiddetli fikriydi. Destek, 1850'lerden İspanyol-Amerikan Savaşı'na kadar en güçlüydü ve o zamandan beri çoğunlukla kaybolmuştu. Ancak bölgenin [FROM.GetLeader] tarafından birleştirilmesinden sonra, fikir bir kez daha canlı ve şimdi, Antil Konfederasyonu'nun ilan edilmesiyle, Antillerin gerçekten de Antilliler için olduğu her zamankinden daha açık!"
 south_american_news.20.t:0 "Antiller Birleşti"
 south_american_news.3.a:0 "İlginç"
 south_american_news.3.b:0 "Kesinlikle bir sürpriz, ama hoş bir sürpriz"
 south_american_news.3.d:0 "Uruguay Devlet Başkanı Gabriel Terra, geçen hafta seçim düzenleyeceğini ve iktidardan çekileceğini açıkladı; bu, 1933'te bir darbe ile uzattığı bir kuraldı. İktidar, Uruguay Ulusal Partisi lideri Luis Alberto de Herrera'ya devredilecektir."
 south_american_news.3.t:0 "Uruguay'da Yeni bir Başkan"
 south_american_news.4.a:0 "İnsanlar işte buna kadirmiş"
 south_american_news.4.b:0 "Çok yaşa halk cumhuriyeti!"
 south_american_news.4.d:0 "Uruguay Devlet Başkanı Gabriel Terra, geçen hafta seçim düzenleyeceğini ve iktidardan çekileceğini açıkladı; bu, 1933'te bir darbe ile uzattığı bir kuraldı. Ancak beklemediği şey, komünist partiye olan büyük destekti, bu da atadığı halefi Alfredo Baldomir Ferrari'nin yeni kurulan hükümetine karşı bir darbeye yol açtı."
 south_american_news.4.t:0 "Uruguay'da Halk Devrimi"
 south_american_news.5.a:0 "Bu kesinlikle bölgedeki güç dengesini değiştirecek"
 south_american_news.5.b:0 "Bir kez daha birleştik!"
 south_american_news.5.d:0 "Konfederasyon savaşından bu yana, birleşik Peru-Bolivya devletinin çöktüğü ve bir daha asla var olmayacağı düşünülen zamandan beri ilk kez, geri döndü. Bazıları bunun sadece gerçek hükümdarın emperyalist hırsını gizlemek için bir cephe olduğunu iddia ediyor, ancak birçok kişi konfederasyonun halkı daha önce hiç olmadığı bir şekilde birleştirebileceğini umuyor. Kesin olan şey ise, birliğin kalıcı olduğudur."
 south_american_news.5.t:0 "Peru-Bolivya Konfederasyonu Yeniden Canlandı"
 south_american_news.50.a:0 "Bolşevik hainler hak ettiklerini buldular."
 south_american_news.50.b:0 "Endişe verici bir durum."
 south_american_news.50.c:0 "Yoldaşlarımızın intikamı alınacak!"
 south_american_news.50.d:0 "Bu sabah, [FROM.GetName] başkanı [FROM.GetLeader], komünist partinin darbe riski nedeniyle ulusun bir kez daha olağanüstü hale girdiğini radyodan duyurdu. Başkana göre, komünistlerin hükümeti devirme planlarının son aşamalarında olduğunu gösteren belgeler bulundu. Bu belgelerin geçerliliği birçok kişi tarafından sorgulanıyor ancak muhalefet partilerinin üyeleri şimdi tutuklanma korkusuyla yeraltına çekiliyor. Başkan, kendisine daha fazla yetki veren yeni bir anayasa ile yeni bir devlet kuracağını duyurdu. Bunun [FROM.GetName]'deki demokrasinin geleceği için ne anlama geldiği henüz belli değil."
 south_american_news.50.t:0 "Brezilya Olağanüstü Hal İlan Etti"
 south_american_news.51.a:0 "Bolşevik hainler hak ettiklerini buldular."
 south_american_news.51.b:0 "Endişe verici bir durum."
 south_american_news.51.c:0 "Yoldaşlarımızın intikamı alınacak!"
 south_american_news.51.d:0 "Bu sabah, [FROM.GetName] başkanı [FROM.GetLeader], komünist partinin darbe riski nedeniyle ulusun bir kez daha olağanüstü hale girdiğini radyodan duyurdu. Başkana göre, komünistlerin hükümeti devirme planlarının son aşamalarında olduğunu gösteren belgeler bulundu. Sağcı İntegralist partinin desteğiyle, [BRA.GetLeader] muhalefet partilerini yeraltına çekilmeye zorladı. Başkan, ulusu Bolşevizm'den kahramanca kurtaran İntegralist parti ile birlikte yeni bir anayasa ile yeni bir devlet kuracağını duyurdu. İntegralistlerin geçmişteki söylem ve eylemleri göz önüne alındığında, Brezilya'daki liberal demokrasinin adı dışında her şeyinin sona erdiği görülüyor."
 south_american_news.51.t:0 "Brezilya Demokrasiyi Askıya Aldı"
 south_american_news.52.a:0 "Hepimiz için kasvetli bir an."
 south_american_news.52.b:0 "Böyle çürümüş bir gösteri özlenmeyecek."
 south_american_news.52.desc:0 "Dünyanın bir kez daha küresel bir çatışmaya sürüklenmesiyle, Rio de Janeiro şehri ünlü yıllık karnaval kutlamalarını askıya almaya karar verdi. Barış uzak bir anı haline gelirken, şenliklerin ne zaman geri döneceği belli değil. Ancak, birçok kişi savaşın [BRA.GetNonIdeologyName]'in kendisine de ulaşıp ulaşmayacağı konusunda daha fazla endişeli."
 south_american_news.52.t:0 "Karnaval İptal Edildi"
 south_american_news.6.a:0 "Onlara yardım etmeyecek"
 south_american_news.6.b:0 "Yaşasın Hispanyola!"
 south_american_news.6.d:0 "Uzun ve nispeten benzer geçmişine rağmen, batı ve doğu Hispanyola uzun zamandır birleşmiş değil. Ancak şimdi, Haiti ve Dominik Cumhuriyeti devletleri adaları için refah ortak hedeflerinde birleştiler ve Hispanyola devletini kurdular."
 south_american_news.6.t:0 "Hispanyola Birleşti"
 south_american_news.60.a:0 "Brezilya hiç barış bulacak mı?"
 south_american_news.60.desc:0 "Başkan $BRA_getulio_vargas$'ın ordunun ve İntegralist hareketin çeşitli fraksiyonlarını tavlama girişimlerine rağmen, birincisi zor durumdaki başkanın değişim hızından sabırsızlandı ve meseleleri kendi ellerine aldı. Hızlı bir askeri operasyonla, birlikler $BRA_getulio_vargas$'ın yakalandığı Rio de Janeiro'daki Catete Sarayı'na baskın yapmadan önce ülke genelinde büyük altyapı ve iletişim güvence altına alındı.\n\nAskeri yönetim altında ulusun günlük siyasetinde neyin değişeceği henüz belli olmasa da, yeni hükümetin halk arasında komünist muhalefet söylentilerine karşı sert bir tavır alacağı kesindir."
 south_american_news.60.t:0 "[BRA.GetAdjective] Ordusu Darbe Başlattı"
 south_american_news.7.a:0 "İlginç zamanlar"
 south_american_news.7.b:0 "Sonunda, Emperyalizmin prangalarından kurtulduk!"
 south_american_news.7.d:0 "Guyana bölgesi uzun zamandır işgalci sömürgeci güçler arasında bölünmüş, Cayenne, Guyana, Amapá, Surinam ve Guayana alt bölgelerini işgal etmiştir. Ancak bölge halkı şimdi emperyalizme karşı ortak mücadelelerinde birleşti ve birleşmelerine ve bağımsızlıklarına karşı çıkan herkesi yok edeceklerini ilan ettiler."
 south_american_news.7.t:0 "Guyanalar Birleşti!"
 south_american_news.8.a:0 "Savaştan bıkmadılar mı?"
 south_american_news.8.b:0 "Artık daha iyi bir gelecek için çabalamakta özgürüz!"
 south_american_news.8.d:0 "Paraguay başkanı Eusebio Ayala, Paraguay'ın başkenti Asunción'u işgal eden askeri subayların öne sürdüğü talepler uyarınca resmen istifa etti ve iktidar, general Rafael Franco liderliğindeki devrimci Febreristalara devredildi. Bolivya ile yıllarca süren savaştan sonra, Paraguay halkı zayıf hükümetlerinden bıkmış gibi görünüyor, çünkü birçoğu yeni liderliklerini kutlamak için sokaklara döküldü."
 south_american_news.8.t:0 "Şubat Devrimi"
 south_american_news.9.a:0 "Halkının bu konuda ne hissettiğini merak ediyorum?"
 south_american_news.9.b:0 "Umarım bu isyancılardan son gördüğümüz bu olur..."
 south_american_news.9.d:0 "Paraguay başkanı Eusebio Ayala, kendisi ve sağ kolu José Félix Estigarribia liderliğindeki cumhuriyet muhafızlarının, devrimci febreristaları ve liderleri general Rafael Franco'yu destekleyen askeri subayların bir isyanını ve darbe girişimini başarıyla bastırdığını duyurdu. Ancak ülke şimdi, Chaco savaşının sona erdiği birkaç ay öncesinden bile daha kötü bir durumda ve ülkenin tekrar bütünleşmesinden çok uzak olduğu görülüyor."
 south_american_news.9.t:0 "Paraguay Subaylarının İsyanı Bastırıldı"
 united_french_monarhcist_faction:0 "Frankofon Hegemonyası"
