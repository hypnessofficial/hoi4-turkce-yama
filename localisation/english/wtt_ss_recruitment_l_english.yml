 SS_recruitment:0 "Yabancı Gönüllüler"
 SS_recruitment_DEN_tt:0 "Danimarka'da ikinci bir asker toplama kampanyası, gönüllüleri tam bir tümen halinde oluşturmamızı sağlayacaktır."
 SS_recruitment_NOR_tt:0 "Norveç'te ikinci bir asker toplama kampanyası, gönüllüleri tam bir tümen halinde oluşturmamızı sağlayacaktır."
 SS_recruitment_belgium:0 "Belçika'da SS alımına izin ver"
 SS_recruitment_britain:0 "İngiltere'de SS alımına izin ver"
 SS_recruitment_denmark:0 "Danimarka'da SS alımına izin ver"
 SS_recruitment_desc:0 "Himmler komutasındaki SS, küresel bolşevizme karşı mücadele için yabancı gönüllülerin askere alınmasından kendilerinin sorumlu olması gerektiğine inanıyor. Wehrmacht ise buna şiddetle karşı çıkıyor ve paralel bir komuta yapısına tolerans göstermeyecektir. İkisinden birini çok fazla zorlamak ciddi sonuçlar doğurabilir.\n\nOKW'deki mevcut §YRuh Hali§!: [Root.GetWehrmachtAngerLevel] ([?GER.wehrmacht_anger|-0])\n\nSS Liderliğindeki mevcut §YRuh Hali§!: [Root.GetSSAngerLevel] ([?GER.SS_anger|-0])"
