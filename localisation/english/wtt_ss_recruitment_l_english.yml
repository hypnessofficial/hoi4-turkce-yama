 SS_recruitment_latvia:0 "Letonya'da SS alımına izin ver"
 SS_recruitment_lithuania:0 "Litvanya'da SS alımına izin ver"
 SS_recruitment_netherlands:0 "Hollanda'da SS alımına izin ver"
 SS_recruitment_norway:0 "Norveç'te SS alımına izin ver"
 SS_recruitment_scotland:0 "İskoçya'da SS alımına izin ver"
 SS_recruitment_sweden:0 "İsveç'te SS alımına izin ver"
 SS_worried:0 "Endişeli"
 ss_recruitment_alternate.1.desc:0 "Bu devasa ulusal beka mücadelesinde, her varlığı ve her avantajı kullanmalıyız. SS, İngiltere'de küresel bolşevizm tehdidine karşı memnuniyetle silahlanıp yanımızda savaşacak birçok kişinin olduğuna inanıyor.\n\nWehrmacht prensipte uygun gönüllülerin bir miktar askere alınmasının faydalı olabileceğini kabul etse de, OKW'deki Generaller herhangi bir yabancı gönüllünün askeri -SS değil- komutası altında olması gerektiğine çok güçlü bir şekilde inanıyor."
 ss_recruitment_alternate.1.t:0 "İngiltere'de Asker Toplama Kampanyası"
 ss_recruitment_alternate.2.desc:0 "Bu devasa ulusal beka mücadelesinde, her varlığı ve her avantajı kullanmalıyız. SS, İskoçya'da küresel bolşevizm tehdidine karşı memnuniyetle silahlanıp yanımızda savaşacak birçok kişinin olduğuna inanıyor.\n\nWehrmacht prensipte uygun gönüllülerin bir miktar askere alınmasının faydalı olabileceğini kabul etse de, OKW'deki Generaller herhangi bir yabancı gönüllünün askeri -SS değil- komutası altında olması gerektiğine çok güçlü bir şekilde inanıyor."
 ss_recruitment_alternate.2.t:0 "İskoçya'da Asker Toplama Kampanyası"
 ss_recruitment_alternate.3.desc:0 "Bu devasa ulusal beka mücadelesinde, her varlığı ve her avantajı kullanmalıyız. SS, İsveç'te küresel bolşevizm tehdidine karşı memnuniyetle silahlanıp yanımızda savaşacak birçok kişinin olduğuna inanıyor.\n\nWehrmacht prensipte uygun gönüllülerin bir miktar askere alınmasının faydalı olabileceğini kabul etse de, OKW'deki Generaller herhangi bir yabancı gönüllünün askeri -SS değil- komutası altında olması gerektiğine çok güçlü bir şekilde inanıyor."
 ss_recruitment_alternate.3.t:0 "İsveç'te Asker Toplama Kampanyası"
 ss_recruitment_event.1.a:0 "Ilımlı bir asker toplama kampanyasında uzlaşın."
 ss_recruitment_event.1.b:0 "SS için devasa bir asker toplama kampanyası finanse edin."
 ss_recruitment_event.1.c:0 "OKW'nin az sayıda uzman ve destek personeli toplamasına izin verin."
 ss_recruitment_event.1.desc:0 "Bu devasa ulusal beka mücadelesinde, her varlığı ve her avantajı kullanmalıyız. SS, Danimarka'da küresel bolşevizm tehdidine karşı memnuniyetle silahlanıp yanımızda savaşacak birçok kişinin olduğuna inanıyor.\n\nWehrmacht prensipte uygun gönüllülerin bir miktar askere alınmasının faydalı olabileceğini kabul etse de, OKW'deki Generaller herhangi bir yabancı gönüllünün askeri -SS değil- komutası altında olması gerektiğine çok güçlü bir şekilde inanıyor."
 ss_recruitment_event.1.t:0 "Danimarka'da Asker Toplama Kampanyası"
 ss_recruitment_event.10.a:0 "Siyasi meselelere bu müdahale Alman subaylarına yakışmıyor."
 ss_recruitment_event.10.b:0 "Onlara OKW'nin tüm SS kuvvetlerinin nihai komutasına sahip olduğunu temin edin."
 ss_recruitment_event.10.desc:0 "Bugün [GER.GetLeader] ile yapılan bir toplantıda, Oberkommando der Wehrmacht'taki bir dizi yüksek rütbeli Wehrmacht subayı, SS adına \"siyasi iltimas\" olarak adlandırdıkları durum hakkındaki endişelerini dile getirdi. Özellikle Waffen-SS'de paralel bir silahlı kuvvetin gelişmesini derin endişeyle izliyorlar. \n\nCömertçe donatılmış SS Tümenlerinin iddiaları devam ediyor, yalnızca normal ordudan son derece ihtiyaç duyulan kaynakları alıyor. \n\nSon olarak, bağımsız askere alma ayrı komuta yapılarına yol açabilir, bu da nihai zafere ulaşmak için tüm gücün bir araya getirilmesi gerektiğinde çabaların ayrılmasına yol açabilir."
 ss_recruitment_event.10.t:0 "Generaller protesto ediyor"
 ss_recruitment_event.11.a:0 "İyi, zayıflığıyla başkalarını etkilemeden gitti."
 ss_recruitment_event.11.b:0 "Görevinin her şeyden üstün olduğuna onu ikna etmeye çalışın."
 ss_recruitment_event.11.desc:0 "Sağlık durumunu gerekçe gösteren [GER_SS_general_resigns.GetName], görevinden derhal istifa etti. Ancak, [GER_SS_general_resigns.GetName]'in hükûmetin Waffen-SS ile ilgili politikasına, özellikle de yabancı gönüllülerin SS Tümenlerinde hizmet etmesine izin verme kararına karşı açık sözlü bir eleştirmen olduğu bilinen bir sır. Bildirildiğine göre, [GER_SS_general_resigns.GetName] Führer'e şahsen veda etmekte ısrar etti, bu da ikisi arasında savaş çabasındaki kaynakların tahsisi hakkında hararetli bir tartışmaya yol açtı. \n\nWehrmacht'taki birkaç diğer subay da benzer endişelerini dile getirdi ve bazıları onu takip etmeyi düşünebileceklerini belirtti."
 ss_recruitment_event.11.t:0 "General protesto amacıyla istifa ediyor"
 ss_recruitment_event.12.a:0 "Sadece homurdanan birkaç yaşlı asker."
 ss_recruitment_event.12.b:0 "OKW'ye ulusal beka mücadelesinde sadakatin önemi hakkında bir ders verin."
 ss_recruitment_event.12.desc:0 "Gestapo yeni ve oldukça rahatsız edici bir rapor yayınladı. Görünen o ki, bir grup yüksek rütbeli Wehrmacht subayı, Doğu Prusya'nın bir yerindeki uzak bir malikanede düzenli toplantılar yapmaya başladı. \n\nSıradan bir Briç oyunu seansı görünümüne bürünen bu toplantılar en az birkaç aydır devam ediyor ve görünüşe göre çok seçilmiş bir subay çevresi var. Güvenlik Hizmetleri şu ana kadar içeriye bir adam sokmayı başaramadı, ancak bu \"Prusya Çemberi\" ile bağlantılı olduğu doğrulanan tüm memurlar, nasyonal-sosyalist hükümete ve özellikle de onun Waffen-SS'yi genişletme kararına karşı duydukları küçümsemeleri açıkça dile getirdiler.\n\nŞu anda bu komplonun nihai hedefinin ne olduğuna veya gerçekten de bir amacı olup olmadığına dair çok az gösterge var."
 ss_recruitment_event.12.t:0 "Bir Wehrmacht Komplosu Söylentileri"
 ss_recruitment_event.13.a:0 "Sadece umut edebiliriz."
 ss_recruitment_event.13.desc:0 "Führer Karargahı'ndan gelen doğrulanmamış raporlar, [GER.GetLeader]'in katıldığı bir durum toplantısı sırasında birinin bir patlayıcı cihazı patlattığını gösteriyor. Bilgiler hala yetersiz ve hem Wehrmacht hem de SS'te büyük bir kafa karışıklığı var, her iki taraftaki subaylar diğerini darbe girişiminde bulunmakla suçluyor.\n\nDaha fazla bilgi için beklemek zorunda kalacağız."
 ss_recruitment_event.13.t:0 "[GER.GetLeader]'e Suikast Girişimi"
 ss_recruitment_event.14.a:0 "Verräter! Versager!"
 ss_recruitment_event.14.desc:0 "Wehrmacht unsurları, Almanya'daki büyük sivil huzursuzluk için acil durum planı olan Valkyrie Harekâtı'nı yürüttü. Ordu birlikleri bir dizi hükûmet bakanlığını kuşattı ve partinin üst düzey yetkililerini tutuklamaya çalıştı. Berlin genelinde SS muhafız detayları ile Ordu müfrezeleri arasında küçük ölçekli çatışmalar ve silahlı çatışmalar bildirildi. Görünüşe göre Wehrmacht, tüm SS birimlerinin derhal teslim olmasını ve silahlarını teslim etmesini talep etti, ancak SS liderliği bunu kesin olarak reddetti.\n\nHer iki hizip de şu anda Berlin'in kontrolü için mücadele ediyor. Wehrmacht'ın bazı kısımları [GER.GetLeader]'e sadakatlerini ilan etti ve isyancılara karşı silaha sarıldı. \n\nBu savaşın yangını sadece yayılacak."
 ss_recruitment_event.14.t:0 "Walküre Operasyonu"
 ss_recruitment_event.15.a:0 "Hainler haince bir ölümle ölür."
 ss_recruitment_event.15.b:0 "Hizmet yoluyla kendilerini affettirsinler."
 ss_recruitment_event.15.desc:0 "Kader -ya da takdiri ilahi- [GER.GetLeader]'e yardım ediyor gibi görünüyor, çünkü karargahındaki bomba patlaması onu sadece hafifçe yaraladı. Yanındaki birkaç kişi o kadar şanslı değildi.\n\nBirkaç küçük yanık ve yüzeysel kesik için tıbbi tedavi aldıktan sonra, [GER.GetLeader] derhal parti, SS ve Gestapo temsilcileriyle bir araya gelerek sonraki adımları tartıştı."
 ss_recruitment_event.15.t:0 "[GER.GetLeader] suikast girişiminden sağ kurtuldu"
 ss_recruitment_event.2.desc:0 "Bu devasa ulusal beka mücadelesinde, her varlığı ve her avantajı kullanmalıyız. SS, Norveç'te küresel bolşevizm tehdidine karşı memnuniyetle silahlanıp yanımızda savaşacak birçok kişinin olduğuna inanıyor.\n\nWehrmacht prensipte uygun gönüllülerin bir miktar askere alınmasının faydalı olabileceğini kabul etse de, OKW'deki Generaller herhangi bir yabancı gönüllünün askeri -SS değil- komutası altında olması gerektiğine çok güçlü bir şekilde inanıyor."
 ss_recruitment_event.2.t:0 "Norveç'te Asker Toplama Kampanyası"
 ss_recruitment_event.20.a:0 "Haddini aşıyor."
 ss_recruitment_event.20.b:0 "Daha küçük bir kuvvet, sadece halkımızın en iyilerinin bu onur pelerinini giymesini sağlar."
 ss_recruitment_event.20.desc:0 "Heinrich Himmler ile [GER.GetLeader] arasında özel bir toplantıda, Reichsführer SS'in, örgütünün partiyi ve devleti savunmak için gereken işi yapmak için ihtiyaç duyduğu desteği almadığından yüksek sesle ve tekrar tekrar şikayet ettiği bildirildi. Ayrıca [GER.GetLeader]'i Wehrmacht'ın sadık kalacağına güvenmemesi konusunda uyardı. \n\nYeni Almanya'yı ancak SS'in getirebileceğine güvenilebilirdi."
 ss_recruitment_event.20.t:0 "Himmler Protesto Ediyor"
 ss_recruitment_event.21.a:0 "Ne saçmalık!"
 ss_recruitment_event.21.b:0 "Himmler'e kime sadık olması gerektiğini hatırlatın."
 ss_recruitment_event.21.desc:0 "Himmler'in SS'nin üst düzey komutanlarını acil istişareler için Wewelsburg kalesine çağırdığına dair raporlar geldi. Bu istişarelerin kesin içeriği bilinmiyor, ancak bunların Himmler'in parti liderliğine karşı devam eden hayal kırıklıklarıyla bağlantılı olduğu anlaşılıyor. [GER.GetLeader], konu askeri konularda hala Wehrmacht'ın tavsiyelerine uyuyor gibi görünüyor ve Himmler'in karşı ağırlık olarak bağımsız bir silahlı kuvvet yaratma ve genişletme girişimlerini engelliyor.\n\nSöylentilere göre Himmler bunun yerine dikkatini \"yeni bir Almanya için yeni bir Töton Şövalyeleri Tarikatı\" yaratmaya yöneltmiş. Bu \"Şövalyeler\", bizzat Himmler'e fanatik bir sadakat ve sorgusuz sualsiz itaat yemini ederler ve her birine, muhtemelen Yeni Almanya'nın düşmanlarını öldürmek için, eski Germen ritüellerinde kutsanmış çelikten Himmler'in tasarımına göre yapılmış bir kılıç hediye edilmiştir."
 ss_recruitment_event.21.t:0 "Wewelsburg Şövalyeleri"
 ss_recruitment_event.22.a:0 "Elbette bu sadece bir muhasebe hatasıydı."
 ss_recruitment_event.22.b:0 "Himmler'i tam bir soruşturma yapmaya ve bulguları şahsen rapor etmeye zorlayın."
 ss_recruitment_event.22.desc:0 "Hükûmet, birkaç fabrika müdüründen bir dizi şikayet aldı. Bir 'SS İnşaat ve Tedarik Ofisi'nden malzeme siparişleri aldılar. Teslimattan sonra, onlara ödeme yapması gereken bir 'SS Mali İşler Ofisi'ne gönderildiler, ancak bunun yerine onları daha sonra kendilerine doğrudan ödeme yapması gereken orijinal ofisin olduğunu söyleyen bir 'SS Ekonomik İşbirliği Ofisi'ne yönlendirdiler.\n\nBelki de daha rahatsız edici olan sipariş edilen malzemeler - hassas makineler, gübre yapmak için kullanılan büyük miktarlarda kimyasallar ve ayrıca çelik ve sac metal miktarları.\n\nHimmler bu olayları hükûmet yetkilileriyle tartışmayı reddetti, ancak Ekonomi Bakanlığı'ndaki üst düzey bir SS irtibat subayına, '[GER.GetLeader] bana silah vermezse, o zaman kendi silahımı yapmak zorunda kalırım. Bunun için neye ihtiyacım olduğunu nereden veya nasıl bulduğum umurumda değil.' dediği duyuldu."
 ss_recruitment_event.22.t:0 "SS savaş ekonomisine müdahale ediyor"
 ss_recruitment_event.23.a:0 "SS'e meydan okuyamayız."
 ss_recruitment_event.23.b:0 "Bu sefer çok ileri gitti."
 ss_recruitment_event.23.c:0 "Belki bir tür uzlaşma bulunabilir?"
 ss_recruitment_event.23.desc:0 "SS içindeki yüksek rütbeli isimsiz bir kaynak, hükûmete bir iç not sızdırdı. İçeriği patlayıcıdan başka bir şey değil. Onlarca sayfa boyunca, SS'in '[GER.GetLeader]'in nasyonal-sosyalist davaya ihanet etmesi durumunda' hükûmetin kontrolünü ele geçirmek için azalmış ama hala önemli olan güçlerini nasıl kullanabileceğini detaylandırıyor. Böyle bir ihanetin kanıtı, kağıt devam ederken, Ordu gibi mevcut modası geçmiş örgütleri doğru nasyonal-sosyalist karakterde inşa edilmiş yeni oluşumlarla değiştirme taahhüdünün olmaması olacaktır.\n\nNot, Heinrich Himmler'in imzasını taşıyor."
 ss_recruitment_event.23.t:0 "Himmler Komplosu"
 ss_recruitment_event.24.a:0 "Almanya'nın kaderi pamuk ipliğine bağlı."
 ss_recruitment_event.24.desc:0 "Führer Karargahı'ndan, [GER.GetLeader] ile Heinrich Himmler arasında özel bir toplantı sırasında bir tür kargaşa çıktığını iddia eden raporlar geldi. Ayrıntılar yetersiz, ancak askeri istihbarat servisi Abwehr, Almanya genelindeki bir dizi SS birimine 'Fall Schwarz' adı verilen bir şeye hazırlanmaları için emir taşıyan gizli bir kuryeyi ele geçirdiğini iddia ediyor, iddiaya göre bu, askeri bir darbe girişimi durumunda kilit iletişim ve altyapı noktalarının kontrolünü ele geçirme operasyonu."
 ss_recruitment_event.25.a:0 "Yıllar önce hepsini vurmalıydı, tıpkı Stalin'in yaptığı gibi!"
 ss_recruitment_event.25.b:0 "Ve hala, dokunulmazlar."
 ss_recruitment_event.25.desc:0 "Bir kez daha, kader [GER.GetLeader]'in üzerinde elini tuttu ve onu zarardan korudu. Führer'in kendisinin anlattığına göre, Himmler özel bir toplantı sırasında ona silahını çekti, hakaretler ve müstehcenlikler haykırdı. Açıkça iktidar hırsına kapılan Reichsführer SS, [GER.GetLeader]'i öldürmeye çalıştı, ancak silah tutukluk yaptı ve ateş etmedi. Karışıklık anında, Führer Himmler'i alt etmeyi ve yardım çağırmayı başardı. Bildirildiğine göre, Himmler'i zaptetmek için muhafızlarından dört üye gerekti.\n\nReich'in başka yerlerinde, SS ve düzenli Ordu birimleri arasında bir dizi gergin çatışma yaşandı, birincisi kilit iletişim noktalarını ele geçirmeye çalıştı ancak sonunda [GER.GetLeader]'in hayatta kaldığını duyduktan sonra geri çekildi.\n\nWehrmacht birimleri ana SS ofislerini ve binalarını kuşattı ve Berlin'den emir bekliyor."
 ss_recruitment_event.26.a:0 "Hükûmet Himmler'i destekleyecek."
 ss_recruitment_event.26.b:0 "Hükûmet Göring'i destekleyecek."
 ss_recruitment_event.26.c:0 "Wehrmacht'tan düzeni yeniden sağlamasını isteyin."
 ss_recruitment_event.26.desc:0 "Führer Karargahı'ndaki duman dağıldığında, Heinrich Himmler kaotik çatışmadan tek sağ kalan olarak çıktı. Tanıklığına göre, açıkça deliliğe kapılmış olan Führer, onu tam bir başarısızlık örneği bir adam ve asker, şafakta vurulacak bir hain ve casus ilan etmişti. Kişisel onuru ile ulusun hayatta kalması arasında bir seçim yapması gerektiğini anlayan Himmler, derhal harekete geçmeye ve onu vurmaya karar verdi. Sonrasında, Führer'in muhafızlarının üyeleri Himmler'i bir suikastçı olarak öldürmeye çalıştı. Sadece Himmler'in kendi korumalarının zamanında gelmesi Reichsführer SS'i kurtardı.\n\n Almanya genelinde, Führer'in ölüm haberi, uzun süredir hazırlanmış planları harekete geçirmek için bir sinyal olarak hizmet etmiş gibi görünüyor. Hem SS hem de düzenli Ordu birimleri köprüleri, telefon santrallerini ve kavşakları güvence altına almak için yarıştı, Luftwaffe paraşütçüleri Reich genelindeki havaalanlarını ele geçirmek için hızla seferber oldu.\n\nAlmanya bir iç savaşın eşiğinde duruyor ve her üç hizip de ülkeyi fiilen yönetmek için sivil hükûmete güvenecek."
 ss_recruitment_event.26.t:0 "Himmler Darbesi"
 ss_recruitment_event.3.desc:0 "Bu devasa ulusal beka mücadelesinde, her varlığı ve her avantajı kullanmalıyız. SS, Hollanda'da küresel bolşevizm tehdidine karşı memnuniyetle silahlanıp yanımızda savaşacak birçok kişinin olduğuna inanıyor.\n\nWehrmacht prensipte uygun gönüllülerin bir miktar askere alınmasının faydalı olabileceğini kabul etse de, OKW'deki Generaller herhangi bir yabancı gönüllünün askeri -SS değil- komutası altında olması gerektiğine çok güçlü bir şekilde inanıyor."
