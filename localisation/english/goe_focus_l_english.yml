l_english:
 6_month_timer_mughal_tt:0 "Devolve yönetiminin ateşkes teklif etmesinden önce bu savaşı kazanmak için §Y255§! günümüz olacak."
 AFG_75_year_oil_concessions:0 "75 Yıllık Petrol İmtiyazları Teklif Et"
 AFG_75_year_oil_concessions_desc:0 "Son yıllarda jeologlar topraklarımızda önemli petrol rezervleri keşfettiler. Ancak, bunları kendimiz çıkarmak için sanayi kapasitemiz yok. Belki de büyük güçlerden biriyle karşılıklı yarar sağlayan bir anlaşma yaparsak, petrolü birlikte çıkarabiliriz."
 AFG_75_year_oil_concessions_tt:0 "§YTopraklarımızdan petrol kaynaklarını çıkarmak için bir yabancı güçle işbirliği yapma kararlarının kilidini açar.§!"
 AFG_a_turanian_empire:0 "Bir Turan İmparatorluğu"
 AFG_a_turanian_empire_desc:0 "Orta Asya'nın yeni Türk bayrağı altında birleşmesiyle, bir zamanlar ulaşılmaz görünen Turancı emeller artık pekala ulaşılabilir olabilir. Nihayet Türk halkını tek bayrak altında birleştirmenin zamanı geldi!"
 AFG_accelerate_integration:0 "Konfederasyonu Güçlendir"
 AFG_accelerate_integration_desc:0 "[ROOT.GetNonIdeologyName] ve [PAK.GetNonIdeologyName] arasında yeni kurduğumuz konfederasyon büyük bir başarı oldu. Ancak, dünyanın bize ne atacağına hazırlıklı olmak için entegrasyon sürecini daha da hızlandırmalıyız."
 AFG_adopt_nufus:0 "Nufus Sistemini Benimse"
 AFG_adopt_nufus_desc:0 "Yüzyıllık düzensiz kuvvetler sistemi, artık profesyonel ordular karşısında işe yaramaz hale geldi. Bu sistemi, resmi zorunlu askerlik ve eğitimle değiştirmeliyiz."
 AFG_adopt_nufus_tt:0 "§R$AFG_quami_category$ kararlarını kaldırır ve düzensiz tümen işe almayı engeller!§!"
 AFG_afghan_pakistan_cold_War:0 "Afgan-Pakistan Soğuk Savaşı"
 AFG_afghan_pakistan_cold_War_desc:0 "Sınırın ötesindeki akrabalarımızla ters düşmek bizi üzse de, şimdi bize yönelttikleri tehdidi kabul etmeliyiz. Bu nedenle, gerekli her türlü yöntemle onları kontrol altında tutmak için hazırlıklar yapmalıyız."
 AFG_against_kabul:0 "Kabil'e Karşı"
 AFG_against_kabul_desc:0 "Kral Zahir ve amcaları tahtın gaspçılarıdır. Bu gayrimeşru rejim her ne pahasına olursa olsun devrilmelidir."
 AFG_agreement_with_germany:0 "[GER.GetNameDef] ile Anlaşma"
 AFG_agreement_with_germany_desc:0 "Bu çalkantılı zamanlarda, kendimizi İslam dünyasının baskın gücü olarak güvence altına almak için güçlü ve güvenilir müttefikler aramalıyız. Bu nedenle, karşılıklı bir savunma paktı konusunda [GER.GetNameDef]'a ulaşacağız."
 AFG_agreement_with_germany_tt:0 "\n\n§Y[GER.GetNameDefCap] bize karşı 50'den fazla fikre sahipse teklifimizi kabul etmeye daha yatkın olacaktır.§!"
 AFG_align_with_the_allies:0 "Müttefiklerle Hizalan"
 AFG_align_with_the_allies_desc:0 "İngilizlerle birçok şikayetimiz olsa da, şimdilik bunları bir kenara bırakıp Müttefiklerle daha fazla işbirliği yapmalıyız. İngilizlerin dediği gibi, tanıdığın şeytanla uğraşmak daha iyidir."
 AFG_alliance_with_turkik_peoples:0 "Türk Halklarıyla İttifak"
 AFG_alliance_with_turkik_peoples_desc:0 "Kuzeydeki stratejik hedeflerimizin bir parçası olarak, bölgedeki mevcut güç yapılarını zayıflatmak için Türk halkları arasında huzursuzluk çıkarmak esastır. Mevcut şikayetlerden yararlanarak ve muhalefeti teşvik ederek, yerel hükümetleri istikrarsızlaştırabilir ve genişlememiz için daha elverişli bir ortam yaratabiliriz."
 AFG_alliance_with_turkik_peoples_tt:0 "[SOU.GetAdjective] Orta Asya eyaletlerinde direniş hücreleri yaymak için §Y[AFG_get_turkik_people_name_key]§! kararlarını aç. Müdahale ettiğimiz eyaletler, [SOU.GetNameDef] ile savaş çıktığında bize katılacak."
 AFG_ally_basmachi_remnants:0 "Basmaçi Artıklarıyla İttifak Kur"
 AFG_ally_basmachi_remnants_desc:0 "1934'e kadar Basmaçiler, Orta Asya'yı [SOV.GetAdjective] güçlerinin tiranik yönetiminden kurtarmak için mücadele etti. Hareketleri ezilmiş olsa da, bazı liderleri kaçmayı başardı. Bu özgürlük savaşçılarıyla iletişim kurmalı ve onları sarayımıza davet etmeliyiz. Daha önce Habibullah Kalakani'yi desteklemiş olsalar da, iktidarımız sağlamlaştığında onları ikna etmek kolay olacaktır."
 AFG_ally_the_brahui_khanate:0 "Brahui Hanlığı ile Müttefik Ol"
 AFG_ally_the_brahui_khanate_desc:0 "Kalat Hanlığı, Durrani İmparatorluğu'nun son yıllarında önemli bir müttefikimizdi ve Marata Konfederasyonu'na karşı zaferlerimizde büyük yardım etti. Onlarla bir kez daha temas kurmalı ve Marataların haleflerini devirmeliyiz!"
 AFG_ally_the_sikhs:0 "Sihlerle Müttefik Ol"
 AFG_ally_the_sikhs_desc:0 "Sihler, Hint alt kıtasında önemli bir dini azınlıktır ve sert savaşçılardır. Bölgeyi kendimiz için fethetmek üzere onların yardımını kullanmalıyız."
 AFG_ally_the_young_afghans:0 "Genç Afganlar İle Müttefik Ol"
 AFG_ally_the_young_afghans_desc:0 "Entelektüel Mahmud Tarzi'nin öncülük ettiği Genç Afganlar, eski Amanullah Han'a nüfuz etti ve anayasal monarşiyi savunan reformist bir hareketi yönlendirdi. Demokratik eğilimli bazı Amanullah sadıklarıyla temasları yeniden kurmalı ve yeni demokratik hükümetimiz için desteklerini sağlamalıyız."
 AFG_alternative_partnerships:0 "Alternatif Ortaklıklar Ara"
 AFG_alternative_partnerships_desc:0 "On yıllardır [ENG.GetAdjective] ve [SOU.GetAdjective]ları birbirine düşürerek bağımsızlığımızı korumayı başardık. Ancak şimdi Büyük Oyun'a yeni bir oyuncu katıldı ve stratejilerimizi buna göre ayarlayacağız."
 AFG_anti_soviet_cooperation:0 "Anti-Sovyet İşbirliği"
 AFG_anti_soviet_cooperation_desc:0 "[SOU.GetAdjective] etkisini kısıtlamak isteyen birçok ulus var. Bunu, gelecekteki herhangi bir [SOU.GetAdjective] yayılmacılığına hazırlıklı olmak için askeri uzmanlık kazanma fırsatı olarak kullanmalıyız."
 AFG_appraoch_anti_communist_theologians:0 "Sovyet Karşıtı Teologlara Yaklaş"
 AFG_appraoch_anti_communist_theologians_desc:0 "Komünizmin sivil toplumumuz üzerinde bir bela olduğu konusunda hemfikir olan birçok Müslüman alim ve teolog var. Maalesef, [SOV.GetNameDef] şu anda Orta Asya'daki kardeşlerimize böylesine alçak bir ideolojiyi dayatıyor ve bu aptallığa bir son vermek için elimizden gelen her şeyi yapmak zorunda kalacağız."
 AFG_approach_foreign_inteligence_services:0 "Yabancı İstihbarat Teşkilatlarıyla Temasa Geç"
 AFG_approach_foreign_inteligence_services_desc:0 "Büyük güçlerin kesişim noktasında oturuyoruz ve uzun zamandır onların büyük oyunlarının insafına kalmış durumdayız. Eğer kendi istihbarat teşkilatımızı kurarsak, bu benzersiz konumumuzdan faydalanarak komşularımızı birbirlerine karşı kullanabiliriz."
 AFG_asymmetric_warfare:0 "Asimetrik Savaş"
 AFG_asymmetric_warfare_desc:0 "Komşularımız endüstrileşme ve daha büyük ordular peşinde mirarlarını feda ederken, biz onları geleneksel olmayan taktikler ve coğrafyamızı avantaja çevirerek yenebiliriz. Askerlerimizin kararlılığıyla birleşen bu strateji, her türlü işgalciyi püskürtecektir."
 AFG_axis_airforce:0 "Mihver Hava Kuvvetleri"
 AFG_axis_airforce_desc:0 "[GER.GetAdjective] hava kuvvetleriyle yakın çalıştıktan sonra, kendi görüntülerinde işlevsel bir kuvvet oluşturabileceğimize inanıyoruz. Tek ihtiyacımız olan, bunu yapmak için gerekli ekipman."
 AFG_axis_equipment:0 "Mihver Ekipmanı"
 AFG_axis_equipment_desc:0 "Askeri teçhizatımız birçok ülkeden uyumsuz varyantlardan oluşan bir karmaşa. Ancak [GER.GetAdjective]lardan biraz yardım alarak, tüm ekipmanlarımızı standartlaştırıp aynı zamanda modernize edebiliriz."
 AFG_biding_our_time:0 "Zaman Kazanıyoruz"
 AFG_biding_our_time_desc:0 "Kral Zahir Şah ulusun figür başı olarak hareket ederken, hükümet muhafazakar çoğunluğu yanında tuttuğu sürece radikal ayaklanmalardan korkmadan işlerini yürütebilir. Ancak, geleneksel faaliyetleri ihlal etmeyen şekillerde ulusu modernleştirmek için küçük fırsatlar hala olabilir."
 AFG_bill_of_rights:0 "Haklar Bildirgesi"
 AFG_bill_of_rights_desc:0 "Halkımız, yasalar karşısındaki haklarının kodlanmış bir belgesini hak ediyor."
 AFG_can_core_once_controlled_tt:0 "Ele geçirildikten sonra talep edilen eyaletleri merkez eyalet yapma kararlarının kilidini açar"
 AFG_central_asian_unification:0 "Orta Asya Birleşmesi"
 AFG_central_asian_unification_desc:0 "Orta Asya, dikkatli yönetimimiz sayesinde ekonomik bir arka bahçeden hızla büyüyen bir sanayi merkezine dönüştü. Birlikte, tüm halklarımız için yeni bir sosyalist gelecek kuracağız."
 AFG_central_asian_unification_tt:0 "Bize devredilen eski [SOU.GetAdjective] eyaletlerinde çekirdek iddialar kazanmak için §Y$AFG_develop_central_asia_category$§! kararlarını aç."
 AFG_chaki_dam:0 "Çak Barajı"
 AFG_chaki_dam_desc:0 "Elektrik talebi arttıkça, istikrarlı bir arzın üretildiğinden emin olmalıyız. Yabancı uzmanların yardımıyla, Çak nehri üzerinde bir hidroelektrik barajı inşa edebilir ve çevre bölgeye, Kabil dahil, yıllarca elektrik sağlayabiliriz."
 AFG_chromite_mines:0 "Kromit Madenleri Kur"
 AFG_chromite_mines_desc:0 "Krom, sanayileşmiş dünyada giderek daha çok aranan bir kaynak haline geliyor. Kendi kromit kaynaklarımızı ihracat için kazmaya başlamalı ve ardından üretilen zenginliği kendi sanayileşme programımızı sürdürmek için kullanmalıyız."
 AFG_clear_malarial_swamps:0 "Sıtmalı Bataklıkları Temizle"
 AFG_clear_malarial_swamps_desc:0 "Sıtma, ülkenin birçok bölgesinde hala bir beladır. Sıtma taşıyan parazitlerin ürediği alanları temizleyerek, kırsal nüfusu tarihi bir dertten kurtarabilir ve gelişme için yeni arazi kazanabiliriz."
 AFG_communist_industrialization:0 "Komünist Sanayileşme"
 AFG_communist_industrialization_desc:0 "Emperyalist rejimin eski yönetim mekanizmalarını sökerken, ekonomimizi 20. yüzyıla taşımak için hızlı kolektivizasyon ve sanayileşme sürecine başlayabiliriz."
 AFG_communist_propaganda:0 "Propaganda Bakanlığı"
 AFG_communist_propaganda_desc:0 "Tüm kitle iletişim araçları, devletin otoritesi altına alınmalı ve halkı görkemli işçi cumhuriyetimize yükseltmek için kullanılmalıdır."
 AFG_concessions_to_pashtuns:0 "Peştunlara Tavizler"
 AFG_concessions_to_pashtuns_desc:0 "Peştunlar nüfusun çoğunluğunu oluşturuyor ve ailelerinin çoğu yüzyıllardır Peştunwali'nin eski geleneklerine bağlı kaldı. Şimdi birçoğu, yaşam tarzlarının aşındığından endişe duyuyor. Hükümete daha fazla Peştun milliyetçisi ve Peştunwali uygulayıcısı getirirsek bu durum muhtemelen hafifler."
 AFG_connect_the_cities:0 "[ROOT.GetNonIdeologyName] Çevre Yolu"
 AFG_connect_the_cities_desc:0 "Demiryolu uzun vadeli kalkınmamız için büyük önem taşısa da, büyük şehirler arasında modern bir otoyol sisteminin faydaları göz ardı edilemez. Şehirleri birbirine bağlayan bir çevre yolu oluşturarak, uzun zamandır ekonomimizi rahatsız eden ekonomik bölgeselciliği nihayet aşabiliriz."
 AFG_constructing_a_national_identity_tt:0 "§Y$AFG_constructing_a_national_identity_idea$§! ulusal ruhu kaldırıldığında:\n"
 AFG_contact_amanullah_loyalists:0 "Amanullah Yanlılarıyla Temas Kur"
 AFG_contact_amanullah_loyalists_desc:0 "Eski Kral $AFG_amunullah_khan$, haksız yere devrildiğinde tahtı resmen bir halefine devretmedi. Bu nedenle, [AFG.GetNonIdeologyName]'da Kral'a sadık kalanları toplayıp onun kaçınılmaz dönüşüne hazırlanmalıyız."
 AFG_contact_rural_loyalists:0 "Kırsal Meliklerle Temas Kur"
 AFG_contact_rural_loyalists_desc:0 "[AFG.GetAdjective] elitini rüşvetle veya siyasi vaatlerle etkilemek kolaydır. Ancak sıradan bir [AFG.GetAdjective], geleneksel değerlerine ve şikayetlerine hitap edilirse davamıza katılabilir."
 AFG_contact_rural_loyalists_tt:0 "§Yİç savaş başladığında daha fazla Peştun milis tümeni tarafımıza katılacak.§!"
 AFG_crackdown_on_nomadic_practices:0 "Göçebe Uygulamalara Baskı"
 AFG_crackdown_on_nomadic_practices_desc:0 "TODO"
 AFG_cross_border_ties:0 "Sınır Ötesi Bağlar"
 AFG_cross_border_ties_desc:0 "Coğrafyamızın doğası gereği sınırlar her zaman geçirgendir; aileler sınırları aşar ve iki tarafta da yerleşir. Bu durum, komşu ülkelerde güçlü kişisel bağlar oluşturmuştur ve bir kriz anında bu bağlar kullanılabilir."
 AFG_cross_border_ties_tt:0 "Talep edilen toprakları ilhak etmek için §Y$AFG_cross_border_ties_category$§! kararlarını aç."
 AFG_crown_the_bukharan_emir:0 "Buhara Emiri'ni Taçlandır"
 AFG_crown_the_bukharan_emir_desc:0 "Topraklar güvence altına alındığında, Emir unvanını almak için yeni bir hükümdar yükselmelidir. Buharalı Seyyid Mir Muhammed Alim Han birkaç yıldır Kabil'de bulunuyor ve büyük Durrani İmparatorluğu'nun ihtişamını geri getirmek istiyorsak mükemmel bir adaydır."
 AFG_crown_the_golden_emir:0 "Altın Emir'i Taçlandır"
 AFG_crown_the_golden_emir_desc:0 "Topraklar güvence altına alındığında, Emir unvanını almak için yeni bir hükümdar yükselmelidir. Kendini savaş alanında kanıtlamış olan Mirzali Han Vezir'in en popüler aday olması şaşırtıcı olmamalı. Peştunistan'ı yeniden birleştirmemize ve İslam Dünyasını birleştirmemize yardımcı olacaktır."
 AFG_custail_pashtunwali_primacy:0 "Peştunwali'nin Önceliğini Kısıtla"
 AFG_custail_pashtunwali_primacy_desc:0 "Peştunların geleneksel ahlak kodu olan Peştunwali, Kral'ın yeni devletinde yeri olmayan bir şeydir. Peştunların gücünü pekiştiren ancak bu modası geçmiş kuralları modernize eden yeni yasalar çıkarılacaktır."
 AFG_darulaman:0 "Darulaman"
 AFG_darulaman_university:0 "Darulaman Üniversitesi"
 AFG_darulaman_university_desc:0 "Darulaman'ın modern şehri, devlet tesislerinin buraya taşınmasıyla hızla genişliyor. Ancak Kral, dünya standartlarında tesislere sahip yeni bir üniversite kurarak Darulaman'ı büyük bir öğrenim şehri haline getirmek istiyor."
 AFG_defending_democracy:0 "Ulusu Savunmak"
 AFG_defending_democracy_desc:0 "Hükümeti iç tehditlerden korusak da, sınırlarımızın ötesinde her zaman tehditler olacaktır. Savaş bize ulaşırsa, silahlı kuvvetlerimizi destekleyecek bir ekonomiye sahip olmak için elimizden geleni yapmalıyız."
 AFG_demand_pashtunistan_referendum:0 "Peştunistan Referandumu Talep Et"
 AFG_demand_pashtunistan_referendum_desc:0 "Peştunlar ulusumuzun çoğunluğunu oluşturuyor, ancak birçoğu sınırlarımızın ötesinde komşu devletlerde yaşıyor. Peştunlar için bu devletlerde bağımsızlık için baskı yapmalı ve onları etki alanımıza almalıyız."
 AFG_development_in_taj:0 "Tacikistan'ı Geliştir"
 AFG_development_in_taj_desc:0 "Tacikistan, olabileceğinin bir gölgesi. Ekonomimize entegre edildiğinde, modernizasyon çabalarımız için değerli bir alüminyum ve diğer kritik kaynaklar kaynağı olabilir."
 AFG_development_in_tms:0 "Türkmenistan'ı Geliştir"
 AFG_development_in_tms_desc:0 "Petrol, modern bir ekonomi veya ordu için kritik bir kaynak haline geliyor. Neyse ki, petrol mühendisleri Türkmenistan'ın bol miktarda bu değerli sıvıya sahip olduğunu tespit etti."
 AFG_development_in_uzb:0 "Özbekistan'ı Geliştir"
 AFG_development_in_uzb_desc:0 "Özbekistan, işgal eden çeşitli rejimler tarafından uzun süredir ihmal edildi. Kontrolümüzü sağlamlaştırmak istiyorsak, bu adaletsizliği düzeltmeli ve bölgenin kalkınmasını artırırken ekonomimize entegre etmeliyiz."
 AFG_eastern_state_breakaway_tt:0 "§Y [1006.GetName] \n [1008.GetName] §!"
 AFG_education_for_women_and_girls:0 "Kadınlar ve Kızlar İçin Eğitim"
 AFG_education_for_women_and_girls_desc:0 "Kral ve eşi, kadınların ve kızların ev içi hizmete mahkum edilmek yerine eğitim almasının önemini anlamıştı. Kral devrildikten sonra eğitim reformları iptal edildi. Şimdi bu adaletsizliği düzelteceğiz."
 AFG_electrification:0 "Elektrifikasyon Girişimleri"
 AFG_electrification_desc:0 "Sanayi, iletişim ve savaştaki yenilikler giderek elektriğe daha fazla bağımlı hale geliyor. Bu nedenle, [ROOT.GetNonIdeologyName] genelinde elektrikleştirmeyi genişleterek yeni gelişmelerden yararlanabilme yeteneğimizi sağlamalıyız."
 AFG_electrification_tt:0 "\n§YElektrikleştirme, zaman ilerledikçe Kabil'den dışarıya doğru yayılacak ve her iki ayda bir yeni bir çekirdek eyalet bu değiştiriciyi kazanacaktır.§!"
 AFG_emerging_economy:0 "Yükselen Ekonomi"
 AFG_encourage_jezail_production:0 "Yerel Cezayil Üretimini Teşvik Et"
 AFG_encourage_jezail_production_desc:0 "Cezayiller, ucuz üretimleri nedeniyle uzun zamandır Peştun kabilelerinin tercih edilen favori silahı olmuştur ve Anglo-Afgan savaşları sırasında bize çok faydası dokunmuştur. Daha büyük bir milis gücü toplayabilmek için kabileleri bu geleneği sürdürmeye teşvik etmeliyiz."
 AFG_enforce_the_pashtunwali:0 "Peştunvali'yi Uygula"
 AFG_enforce_the_pashtunwali_desc:0 "Peştunvali'nin metinleri eski olabilir, ancak iç siyasette Peştun hakimiyetini sağlamak için hala korunmaları gereklidir. Yasaların en eski kısımları ayarlanabilir, ancak gelecek nesiller boyunca yürürlükte kalacaktır."
 AFG_enforce_western_attire:0 "Batılı Kıyafetleri Zorunlu Kıl"
 AFG_enforce_western_attire_desc:0 "Kral ve yakın çevresi, halkın çoğunun giydiği geleneksel kıyafetlerden etkilenmiyor. Bunu, çağdışı bir toplumun işareti olarak görüyorlar ve bu nedenle, Batılı kıyafetlerin benimsenmesini sağlamak için yeni yasalar çıkaracaklar."
 AFG_establish_camelry_regiments:0 "Deveci Alayları Kur"
 AFG_establish_camelry_regiments_desc:0 "Develer dayanıklı bir hayvandır ve ordumuzun çöllerde ve dağlarda bile performans gösterebilmesini sağlamak için uyum sağlamalıyız. Deveci birliklerinin yardımıyla, arazi ne olursa olsun ve düşmanlarımızın olamayacağı bölgelerde savaşabileceğiz."
 AFG_establish_darulaman:0 "Darulaman'ı Kur"
 AFG_establish_darulaman_desc:0 "Darulaman, Kabil'in yerine [AFG.GetNonIdeologyName]'ın yeni başkenti olacak planlı bir şehirdi. Kral devrildiğinde şehir inşası durduruldu. Şimdi bu projeyi tamamlayıp modernliğin bir sembolü haline getirebiliriz."
 AFG_establish_naval_bases:0 "Yeni Deniz Üsleri Kur"
 AFG_establish_naval_bases_desc:0 "Yeni kurtarılan kıyılarımızda ilk deniz üssümüzü kurarak, kendi donanmamızı geliştirme görevine başlayabiliriz."
 AFG_establish_naval_bases_tt:0 "Rastgele bir kıyı eyaletine §G1§! §YDeniz Üssü§! ekle"
 AFG_establish_radio_networks:0 "Radyo Kabil'i Modernize Et"
 AFG_establish_radio_networks_desc:0 "Radyo Kabil, 1920'lerde artık modası geçmiş ekipmanlarla kuruldu. Hükümetin mümkün olduğunca fazla nüfusla doğrudan bir iletişim hattı sağlamasını garanti altına almak için yayın ekipmanlarını yükseltmeye yatırım yapmalıyız."
 AFG_expand_academy:0 "Askeri Akademiyi Genişlet"
 AFG_expand_academy_desc:0 "Profesyonel ordu genişledikçe, iyi eğitimli subay ihtiyacı da artıyor. Bir ulusal harp akademisi, sınırlarımızı korumak için gereken liderliği sağlayacaktır."
 AFG_expand_academy_tt:0 "Rastgele §Yiki§! §YGeneral§! işe al."
 AFG_expand_border_guards:0 "Sınır Muhafızlarını Genişlet"
 AFG_expand_border_guards_desc:0 "Sınır polislerini temel savaş eğitimiyle yetiştirmeliyiz ki, kriz zamanlarında daha büyük sorumluluklar üstlenebilsinler ve geleneksel silahlı kuvvetler üzerindeki yükü azaltsınlar. Kraliyet muhafızları ise silahlı kuvvetlerimizin elit birliğini temsil eder ve buna uygun eğitim ile uzmanlığa sahiptir. Ancak, komşularımız çatışmalara sürüklenirken sayılarının yetersizliğiyle ilgili endişeler dile getirilmiştir."
 AFG_expand_equipment_purchases:0 "Ekipman Alımlarını Genişlet"
 AFG_expand_equipment_purchases_desc:0 "Ordumuz giderek basit tüfeklerin ötesinde ekipmanlara bağımlı hale geliyor. Güvenilir bir güç olarak kalmak için destek ekipmanlarını en kısa sürede temin etmeliyiz."
 AFG_expand_kabul_university:0 "Kabil Üniversitesi'ni Genişlet"
 AFG_expand_kabul_university_desc:0 "Profesyonel mühendis, doktor ve öğretmen ihtiyacı artık öğrencileri uzmanlık eğitimi için yurtdışına göndererek karşılanamaz. Bunun yerine, kendi kurumlarımıza yatırım yapmalı ve evde yetiştirilmiş profesyonellerden oluşan yeni bir nesil yetiştirmeliyiz."
 AFG_expand_kabul_university_tt:0 "§RYükseköğrenimin genişletilmesi, ekonomi onlara iş sunacak kadar büyüyene kadar mezunların radikalleşmesine yol açacaktır!§!"
 AFG_expand_karakul_lambskin_industry:0 "Karakul Kuzu Derisi Endüstrisini Genişlet"
 AFG_expand_karakul_lambskin_industry_desc:0 "Karakul kuzu derisi ürünleri, şu anda [ROOT.GetNonIdeologyName]'dan büyük miktarlarda ihraç edilen birkaç maldan biridir. Bu tür ürünlerin işlenmesi ve ihracı için fabrikalar kurarak filizlenen sanayi temelimizi genişletmek için bu fırsatı kullanabiliriz."
 AFG_expand_quami_template:0 "Quami'yi Reforme Et"
 AFG_expand_quami_template_2_tt:0 "Eğer §Y$tech_engineers$ , $tech_military_police$ veya $tech_field_hospital$§! araştırmışsak, şablona eklenecekler."
 AFG_expand_quami_template_desc:0 "Quami sistemi elbette yıllar boyunca bize iyi hizmet etti, ancak iyileştirme için yer var. Birimler yetiştirilirken yeniden yapılandırılırsa, [AFG.GetNonIdeologyName]'ı daha iyi savunabilirler."
 AFG_expand_quami_template_tt:0 "§YPashtun Levy§! şablonuna §Y3§! düzensiz tabur ekle."
 AFG_expand_royal_guard:0 "Kraliyet Muhafızlarını Genişlet"
 AFG_expand_royal_guard_desc:0 "Kraliyet muhafızları, ordumuzun seçkin birimidir. Ancak, komşularımızın çatışmaya girmesiyle sayılarının azlığı endişe yaratıyor."
 AFG_expand_standing_army:0 "Daimi Orduyu Genişlet"
 AFG_expand_standing_army_desc:0 "Düşmanlarımızı yenmek ve bağımsızlığımızı güvence altına almak için ordumuz sadece etkili olmamalı, aynı zamanda büyük de olmalıdır. Bu nedenle zorunlu askerliği genişletmeli ve saflarımıza daha fazla adam katmalıyız."
 AFG_expand_state_education:0 "Devlet Eğitimini Genişlet"
 AFG_expand_state_education_desc:0 "TODO"
 AFG_expand_state_run_factories:0 "Devlet Fabrikalarını Genişlet"
 AFG_expand_state_run_factories_desc:0 "Önceki rejimin yıllarca ihmal etmesinin ardından, hem tüketim hem de askeri mal üreten yeni devlet fabrikaları kurarak ülkenin ekonomik modernizasyonunu başlatma zamanı geldi."
 AFG_expand_telegraph_network:0 "Telgraf Ağını Genişlet"
 AFG_expand_telegraph_network_desc:0 "[ROOT.GetNonIdeologyName], birçok ekonomik ölçütte komşularının gerisinde kaldı. Ekonomimizi modernleştirmek için ilk adım, şehirlerimiz ve komşularımız arasındaki iletişimi geliştirmek için telgraf ağını genişletmektir."
 AFG_expand_the_kings_powerbase:0 "Kralın Güç Tabanını Genişlet"
 AFG_expand_the_kings_powerbase_desc:0 "Genç Kral Zahir Şah, halk için sadece bir figürdür. Bu arada Kral'ın amcaları en güçlü hükümet pozisyonlarını elinde tutuyor. Ancak Kral, onların çağdışı düşüncelerinden giderek daha fazla rahatsız oluyor ve daha ilerici bir rejim için destek oluşturmak istiyor."
 AFG_expand_the_madrasas:0 "Medreseleri Genişlet"
 AFG_expand_the_madrasas_desc:0 "Halkımızı daha iyi kontrol etmek ve onlara nasıl yaşamaları gerektiğini öğretmek için ülkemizde bulunan Müslüman eğitim kurumlarına fonları artırmalıyız."
 AFG_expel_allied_nationals:0 "Müttefik Vatandaşlarını Sınır Dışı Et"
 AFG_expel_allied_nationals_desc:0 "Mihver güçleri, rejimimizin Müttefikler tarafından devrilme riski altında olduğuna dair şüpheli kanıtlar sundu. Bunu önlemenin tek yolunun, ülkedeki tüm Müttefik vatandaşlarını sınır dışı ederek casusları temizlemek olduğunu savunuyorlar."
 AFG_expel_axis_nationals:0 "Mihver Vatandaşlarını Sınır Dışı Et"
 AFG_expel_axis_nationals_desc:0 "Müttefikler, [ROOT.GetNonIdeologyName]'da savaşan ulusların vatandaşlarının faaliyetlerine özgürce devam etmesine izin verdiğimiz için düşmanlarına yaranmaya çalıştığımızı iddia ediyor. Çıkarlarımıza zararlı bir şey yaptıklarına dair çok az kanıt olsa da, mevcut küresel çatışma süresince bu insanların ayrılmasını talep ederek Müttefikleri yatıştırmalıyız."
 AFG_exploit_turko_persian_heritage:0 "Türk-Fars Mirasını Kullan"
 AFG_exploit_turko_persian_heritage_desc:0 "Ulusumuz yüzyıllar boyunca hem [PER.GetAdjective] hem de [TUR.GetAdjective] kültüründen büyük ölçüde etkilendi. Bunu siyasetimizin ön planına çıkarıp komşularımızla birlik duygusu oluşturmak için yeni bir Türk-Fars kimliği oluşturmalıyız."
 AFG_exploit_turko_persian_heritage_tt:0 "Ülkeleri fraksiyonumuza davet etmek veya onlara savaş hedefleri kazanmak için §Y$AFG_turko_persian_heritage_category$§! kararlarını aç."
 AFG_extend_a_hand_to_tokyo:0 "Tokyo'ya El Uzat"
 AFG_extend_a_hand_to_tokyo_desc:0 "[JAP.GetAdjective] kuvvetlerinin yardımı sayesinde Afganistan için savaşı kazanmayı başardık. Şimdi [JAP.GetNameDef] Asya'yı birleştirmek ve özgürleştirmek istediğine göre, onlara bir kez daha yaklaşmamız akıllıca olacaktır."
 AFG_extend_a_hand_to_tokyo_tt:0 "§Y[JAP.GetNameDef]'in§! ittifakına katılmaya çalışacağız"
 AFG_eyes_on_the_north:0 "Gözler Kuzeyde"
 AFG_eyes_on_the_north_desc:0 "Kuzeyimizdeki bölgeler, rakiplerimiz tarafından henüz tam olarak sömürülmemiş kaynaklar açısından zengin. Bu bölgelere olası bir genişleme için gerekli hazırlıklara başlamamız şart. Askeri varlığımızı güçlendirmek ve tedarik hatlarını güvence altına almak, bu süreçte kritik adımlar olacaktır."
 AFG_fascist_cw_is_over:0 "Amanullah isyanı sona erdi. (Faşistler hükümeti devirdi ve iç savaşı kazandı.)"
 AFG_follower_of_islam:0 "İslam'ın Takipçisi"
 AFG_follower_of_islam_desc:0 "İslam, bir milenyumdan fazla bir süredir inancımızın özünde yer aldı ve liderimizin onun rehber ilkelerine uymasını ve böylece ulusumuzu yeni bir altın çağa yönlendirmesini sağlamalıyız."
 AFG_foreign_influence_tt:0 "§Y365§! gün boyunca (Günlük [PREV.GetIdeologyNameWithCaps] Desteği: §G+0.02§!) sağlayan §Y[PREV.GetIdeologyNameWithCaps] Nüfuzu Yükselişte§! ekle"
 AFG_foreign_military_advisors:0 "Yabancı Askeri Danışmanlar Davet Et"
 AFG_foreign_military_advisors_desc:0 "Ordumuzu modern standartlara uygun hale getirmek için en hızlı yol, batılı uluslardan danışmanlar davet etmek olacaktır. Onlar, yeni nesil [ROOT.GetAdjective] erkeklerini sürekli gelişen savaş alanında savaşmaya uygun hale getirmeye yardımcı olacaklardır."
 AFG_forge_a_national_identity:0 "Bir Ulusal Kimlik Oluştur"
 AFG_forge_a_national_identity_desc:0 "Halkımız kendilerini Afgan olarak değil, daha ziyade kendi kabilelerinin ve milliyetlerinin bir parçası olarak görüyorlar. Peştuca ve Darice'yi ulusal diller olarak tanıtmak için çabalamalıyız ve bir gün belki de halkı birleşik bir Afgan ulusal kimliği altında birleştirebiliriz."
 AFG_form_the_khuddamul_furqan:0 "Huddam-ül Furkan'ı Kur"
 AFG_form_the_khuddamul_furqan_desc:0 "Yeni hükümetimizin meşruiyetini güçlendirmek için, Altın Emir'in yönetiminde düzgün bir siyasi parti kurmalıyız. Tek kabul edilebilir bağlılık Huddam-ül Furkan'adır ve halka kurtuluşu getirecek olan da yalnızca bu partidir."
 AFG_form_the_turkestan_legion:0 "Türkistan Lejyonu'nu Kur"
 AFG_form_the_turkestan_legion_desc:0 "Küresel sahnede bile komünizme karşı savaşmak isteyen birçok kişi var. İslam'a karşı olan güçlere karşı sonuna kadar savaşacak Türkçü anti-komünist gönüllü kuvvetleri organize etmeliyiz."
 AFG_form_the_turkestan_legion_tt:0 "Türk dünyasından tümenler toplamak için §Y$AFG_turkestan_legion_cat$§! kararlarının kilidini açar."
 AFG_fortify_pakistan:0 "Sınırı Tahkim Et"
 AFG_fortify_pakistan_desc:0 "Yeni genişleyen sınırlarımızı güvence altına almak şart. Bir dizi tahkimat ve savunma pozisyonu kurmak, topraklarımızın istikrarını ve güvenliğini sağlayacaktır. Ayrıca, bölgede çatışma çıkarsa askeri gücümüzü yansıtmak için sağlam bir konum sağlayacaktır."
 AFG_fortify_pakistan_tt:0 "Önceki odakta edindiğimiz [RAJ.GetNameDef] ile sınır eyaletleri §G2§! §YKara Kalesi§! kazanacak."
 AFG_from_the_ashes:0 "Küllerinden Doğmak"
 AFG_from_the_ashes_desc:0 "Osmanlı İmparatorluğu'nun dağılmasından bu yana İslam dünyasında bir güç boşluğu var. Şimdi, büyük güçler bir kez daha küresel çatışmayla dikkati dağılmışken, kendimizi İslam dünyasının önde gelen gücü olarak ortaya koyma fırsatımız var."
 AFG_fruit_packing:0 "Meyve İşleme"
 AFG_fruit_packing_desc:0 "[ROOT.GetNonIdeologyName] halkı yetenekli çiftçilerdir, ürettikleri fazlalıktan yararlanarak ihracat için paketlemeliyiz. Bunu yapmak için daha fazla endüstriyel işleme tesisi kurmalıyız."
 AFG_future_of_balochistan:0 "Belucistan'ın Geleceği"
 AFG_future_of_balochistan_desc:0 "Müttefiklerle işbirliği yapsak da, bölgenin uzun vadeli politikalarını düşünmeliyiz. Bu nedenle, daha büyük bir devlet tarafından yutulmadan önce etki edebileceğimiz bağımsız bir Belucistan için baskı yapmalıyız."
 AFG_gain_religious_support_for_reforms:0 "Allah'a Güvenen"
 AFG_gain_religious_support_for_reforms_desc:0 "Halk arasında, genç Kral Zahir Şah'ın yeni bulduğu yetkiyi yaşam tarzlarını bozacak radikal reformlar uygulamak için kullanacağına dair artan bir endişe var. Bu korkuları yatıştırmak için Mullahların desteğini almalı ve Kral'ın İslam'a bağlılığını göstermeliyiz."
 AFG_gant_refuge_to_jadidists:0 "Cadidistlere Sığınma Hakkı Tanı"
 AFG_gant_refuge_to_jadidists_desc:0 "[SOV.GetNameDef]'deki İslami modernistler ve reformcular olan Cadid hareketi üyeleri, hükümet tarafından aktif olarak baskı görüyor ve Genç Buharalılar ile Genç Hivelilerin eski üyeleri [SOV.GetLeader]'ın tasfiyelerinin hedefinde. Onlara ulusumuzda sığınma hakkı tanımalı ve demokratik ideallerini bize getirmelerine izin vermeliyiz."
 AFG_graveyard_of_empires:0 "İmparatorlukların Mezarlığı"
 AFG_graveyard_of_empires_desc:0 "İmparatorluklar gelir geçer, ancak halkımız bu bölgenin tartışmasız efendisi olarak kalır. Halkımız birleşik ve mirasına bağlı kaldığı sürece, herhangi bir saldırgan [ROOT.GetNonIdeologyName]'ı gerçekten kendi mezarlığı olarak bulacaktır."
 AFG_heirs_of_the_chagatai:0 "Borjigin'in mirasçıları"
 AFG_heirs_of_the_chagatai_desc:0 "[ROOT.GetLeader], bir zamanlar Urud-Manghud federasyonunun bir Moğol kabilesi ve büyük Borjigin klanının bir alt klanı olan Manghud hanedanının şu anki başkanıdır. Saray dilimizin, [ROOT.GetLeader] hüküm süren eski diyarın hanedan dili olan Çağatay Türkçesi olmasıyla birlikte, kökleri takip etmenin ve Moğol İmparatorluğu'nda reform yapmanın zamanı geldi."
 AFG_hold_a_loya_jirga:0 "Bir Loya Jirga Topla"
 AFG_hold_a_loya_jirga_desc:0 "Kral Zahir'i, ülkenin kabile ve dini liderleriyle bir toplantı düzenlemeye ikna etmeliyiz. Bu toplantıda onun meşruiyetini sorgulayabilir ve büyüyen isyanımız için daha fazla sempati toplayabiliriz."
 AFG_hold_a_loya_jirga_tt:0 "§Y[ROOT.GetAdjective] İç Savaşı§! başladığında, karşı taraf §G180§! gün boyunca aşağıdakileri kazanacak:"
 AFG_hold_elections:0 "Seçimleri Düzenle"
 AFG_hold_elections_desc:0 "Ülkedeki durum sakinleştiğine göre, nihayet [AFG.GetNonIdeologyName]’ın ilk özgür seçimlerini düzenleme fırsatına sahibiz."
 AFG_hold_elections_tt:0 "§YAşağıdaki seçim etkinliği, yeni bir ülke lideri seçmemize izin verecek.§!"
 AFG_hone_the_shamshir:0 "Şemşiri Bile"
 AFG_hone_the_shamshir_desc:0 "Güç ve meydan okumanın bir sembolü olan Şemşir, gelecek savaşlar için bilenmelidir. Kuvvetlerimizi modernize ederek ve stratejilerimizi geliştirerek, [ROOT.GetNameDef]'in an geldiğinde kararlı bir şekilde saldırmaya hazır olmasını sağlıyoruz."
 AFG_hot_war_with_pakistan:0 "Pakistan'ı Yok Et"
 AFG_hot_war_with_pakistan_desc:0 "[PAK.GetNonIdeologyName]'daki aptallar, halkımızı bölüp hepimizin kavga etmesini isterken [SOU.GetNameDef] ve [RAJ.GetNameDef]'in gerçek tehditleri güçlenmeye devam ediyor. Tüm halkımızı başka bir gücün boyunduruğu altına sokmadan önce bu ayaklanmacı rejimi yok etmeliyiz."
 AFG_ideology_on_the_rise_flipped_tt:0 "§R\n\nDiğer ülkeler üzerimizde çok fazla nüfuz kazanırsa, [THIS.GetNameDefCap] [ROOT.GetNameDef]’i işgal etmek isteyebilir! (Eğer tarafsızlık ya da [THIS.GetIdeologyNameWithCaps] dışındaki herhangi bir ideoloji %40’tan fazla olursa, [THIS.GetNameDef] bize saldırabilir!)§!"
 AFG_ideology_on_the_rise_tt:0 "§R\n\n[THIS.GetNameDef] ile aynı ideolojiyi paylaşmayan büyük güçler, üzerimizdeki nüfuzları çok artarsa [ROOT.GetNameDef]’i işgal etmek isteyebilir! (Eğer [THIS.GetIdeologyNameWithCaps] %40’tan fazla olursa, diğer güçler bize saldırabilir!)§!"
 AFG_implement_currency_controls:0 "Da Afghanistan Bank"
 AFG_implement_currency_controls_desc:0 "Ekonomimiz, ulusun ekonomik kalkınmasını destekleyecek güçlü bir finans sektöründen yoksun. Bu nedenle, gelişmekte olan endüstrilerimize ve işletmelerimize hizmet sunabilecek ortak mülkiyetli bir banka kurmak için özel sektörle çalışmalıyız."
 AFG_increase_agricultural_exports:0 "Tarımsal İhracatı Artır"
 AFG_increase_agricultural_exports_desc:0 ""
 AFG_increase_air_purchases:0 "Hava Alımlarını Artır"
 AFG_increase_air_purchases_desc:0 "Hava kuvvetlerimiz, yabancı uçakları engelleme kapasitesine hızla ulaşıyor. Ancak, havadan güç projeksiyonu yapamıyoruz. Kendi bombardıman filolarımıza yatırım yapmalıyız."
 AFG_increase_land_and_animal_taxes:0 "Arazi ve Hayvan Vergilerini Artır"
 AFG_increase_land_and_animal_taxes_desc:0 "Kırsal nüfus, ulusun ekonomik canlılığına çok az katkı sağlıyor ve geçimlik tarım yaparak çoğu vergiden kaçıyor. Daha modern tarım uygulamalarını teşvik etmek için, masaya yemek koymak isterlerse daha fazla kâr aramalarını sağlayacak yeni vergi politikaları uygulayacağız."
 AFG_infrastructure_construction:0 "Altyapı Yatırımı"
 AFG_infrastructure_construction_desc:0 "Ülke genelindeki altyapı eksikliğimiz ekonomik kalkınmayı engelliyor ve insanları atalarının yüzyıllardır yaptığı gibi yaşamaya razı ediyor. Böyle bir bakış açısı ulusun uzun vadeli çıkarlarına uygun değildir ve altyapı projelerine yatırım yaparak düzeltilmelidir."
 AFG_instate_a_compulsory_jizya:0 "Zorunlu Cizye Getir"
 AFG_instate_a_compulsory_jizya_desc:0 "Gayrimüslimlerin hakları eski yönetim altında oldukça kuralcıydı. Bu meseleleri modern bir dünya için ayarlamanın ve tüm tebaamıza aydınlanmış bir diyar olduğumuzu kanıtlamanın zamanı geldi."
 AFG_integrate_tajik_and_uzbek_republics:0 "Orta Asya'nın Savunucusu"
 AFG_integrate_tajik_and_uzbek_republics_desc:0 "[SOU.GetNameDef] için paha biçilmez bir varlık olduğumuzu kanıtladık. Bu nedenle, çabalarımız için toprak tavizleri talep etmek adil olacaktır. Bu aynı zamanda kuzeydeki Peştun olmayan azınlıkları yatıştırmaya da yardımcı olacaktır."
 AFG_integrate_tajik_and_uzbek_republics_tt:0 "Eğer §Y[SOU.GetName]§! teklifi kabul ederse:"
 AFG_integrate_the_basmachi_movement:0 "Basmacı Hareketi'ni Entegre Et"
 AFG_integrate_the_basmachi_movement_desc:0 "1934'e kadar Basmacılar, Orta Asya'yı zalim yönetimlerinden kurtarmak için [SOV.GetAdjective] kuvvetlerine karşı mücadele etti. Hareketleri o zamandan beri büyük ölçüde ezilmiş olsa da, liderlerinden bazıları kaçmayı başardı. Bu özgürlük savaşçılarıyla temas kurmaya çalışmalı ve onları sarayımıza davet etmeliyiz."
 AFG_international_brigades:0 "Uluslararası Tugaylar"
 AFG_international_brigades_desc:0 "Askerlerimizin cesur fedakarlıklarına rağmen, savaş lehimize gitmiyor gibi görünüyor. Ancak, baskıya karşı savaşmak için can atan uluslararası gönüllülere açılarak durumu lehimize çevirebiliriz."
 AFG_into_the_plains_of_india:0 "[RAJ.GetNameDef] Ovalarına Doğru"
 AFG_into_the_plains_of_india_desc:0 "Halkımızın Hint alt kıtasının efendileri olarak kendini ortaya koyma zamanı geldi. Atalarımızın bir zamanlar yaptığı gibi dağlardan aşağı inecek ve zayıf olduklarında saldıracağız, ancak bu sefer orada kalacağız."
 AFG_introduce_national_service:0 "Ulusal Hizmeti Tanıt"
 AFG_introduce_national_service_desc:0 "Çevremizdeki uluslar çatışmaya sürükleniyor ve bizim de bu girdaptan kaçınacağımızın garantisi yok. Böyle bir ihtimal için hazırlıklı olmak adına, silahlı kuvvetleri güçlendirmek için bir tür ulusal hizmet uygulamalıyız."
 AFG_invite_foreign_corporations:0 "Yabancı Şirketleri Davet Et"
 AFG_invite_foreign_corporations_desc:0 "Endüstride diğer ulusların gerisinde kalmaya devam ediyoruz ve bunun sonucunda yerli silah üretimimiz çok az. Bunu tersine çevirmek ve endüstrimizi modernize etmek için dünyanın dört bir yanından şirketleri burada faaliyet göstermeye davet edeceğiz."
 AFG_invite_the_mughal_prince:0 "Babür Şehzadesi'ni Davet Et"
 AFG_invite_the_mughal_prince_desc:0 "Topraklar güvence altına alındığında, Timur'un mirasını devralmak için yeni bir hükümdar yükselmelidir. İster kan bağıyla, ister liyakatle, isterse de salt irade gücüyle olsun, yapacağımız seçim krallığımızın geleceğini şekillendirecektir. Bu nedenle, şu anda Hindistan'da ikamet eden Babür Şehzadesi'ni tahtımıza geçmesi için davet etmeliyiz."
 AFG_invite_waziristan_rebels:0 "Veziristan İsyancılarını Davet Et"
 AFG_invite_waziristan_rebels_desc:0 "İpi Fakiri ve onun Leşker milisleri, şu anda kuzeybatı vilayetlerindeki [RAJ.GetAdjective] yetkililerine karşı aktif bir çatışma içindeler. Sınırlarımızı geçmelerine yardım etmeli ve doğu bölgelerimizde onlar için bir güç tabanı oluşturmaya başlamalıyız, böylece bir gün Veziristan'a eskisinden çok daha güçlü bir şekilde dönebilirler."
 AFG_invite_waziristan_rebels_tt:0 "§Y[ROOT.GetAdjective] İç Savaşı§! başladığında, ek olarak §G+10000§! İnsan Gücü kazanacağız."
 AFG_iron_mines:0 "Bakır ve Kalay Madenlerini Genişlet"
 AFG_iron_mines_desc:0 "Kalay, bakır ve demir birçok modern ihtiyacın üretimi için gereklidir. Sanayileşmiş bir ulus olarak gelişeceksek, bu tür kaynaklara kendi erişimimizi geliştirmeli ve güvence altına almalıyız. Neyse ki, sömürülmeyi bekleyen birçok kullanılmamış kaynağımız var."
 AFG_islamic_republic_idea:0 "İslami Demokrasi"
 AFG_join_axis:0 "Mihver'e Katıl"
 AFG_join_axis_desc:0 "Şimdiye kadar büyük çatışmalara karışmaktan kaçınsak da, Mihver davasına tamamen bağlanırsak yararlanabileceğimiz birçok fırsat var. Bu nedenle, ittifaka tam üyelik için başvuruda bulunacağız."
 AFG_kabul_conference:0 "Kabil Konferansı"
 AFG_kabul_conference_desc:0 "[ENG.GetAdjective] ve [SOU.GetAdjective]lar arasında on yıllarca sıkışıp kaldıktan sonra, şimdi yeni dünya düzeninin yöneticileriyle birlikte durma ve hak ettiğimizi talep etme fırsatına sahibiz."
 AFG_kabul_conference_tt:0 "Barış konferanslarında hedeflenen eyaletlerin maliyetini düşürmek için §Y$AFG_kabul_conference_category$§! kararlarını aç: §YHindistan, Orta Asya, İran ve Orta Doğu§!."
 AFG_kajaki_dam:0 "Helmand Vadisi Otoritesi Kur"
 AFG_kajaki_dam_desc:0 "[USA.GetNameDef]'daki Tennessee Vadisi Otoritesi'nden ilham almalı ve Helmand nehri vadisi için benzer bir kurum oluşturmalıyız. Kuruluş, ulusal ekonomiye fayda sağlamak için bölgenin ekonomik kalkınmasıyla görevlendirilecektir. Ancak, nehrin akışını değiştirmeye başlarsak batı komşularımızı kışkırtmaktan çekinmeliyiz."
 AFG_kajaki_dam_tt:0 "\n§RTakip eden olay zinciriyle [414.OWNER.GetNameDef] ile bir anlaşma müzakere edemezsek savaşa yol açabilir!§!"
 AFG_khorasan_buffer_state:0 "Horasan Arabulucu Devleti Kur"
 AFG_khorasan_buffer_state_desc:0 "[PER.GetNonIdeologyName]'ın savaş çabamıza yönelik mevcut tehdidi ortadan kalktığına göre, geleceğe bakmaya başlamalıyız. Uluslarımız arasındaki tarihsel gerilimler ve Operasyon Countenance'a katılımımız nedeniyle, gelecekte intikamcı bir [PER.GetAdjective] hükümetiyle aramızda bir tampon oluşturmak için harekete geçmeliyiz."
 AFG_khorasan_buffer_state_tt:0 "§YEğer aşağıdaki eyaletleri kontrol ediyorsak, bir Horasan kukla hükümeti kuracağız: \n [1004.GetName]\n [416.GetName]\n [1003.GetName]§!"
 AFG_khyber_pass_riflining:0 "Khyber Geçidi Tüfekçiliği"
 AFG_khyber_pass_riflining_desc:0 "Khyber Geçidi boyunca yer alan küçük ölçekli endüstriler, onlarca yıldır yabancı silahların kopyalarını üretmektedir. Bu silahlar kalite açısından yetersiz olsa da, sayıca fazlalıklarıyla bunu telafi etmektedir. Belki de artık bu bölgeye yatırım yapmanın ve silahlı kuvvetlerimiz için yerli bir silah üreticisi geliştirmenin zamanı gelmiştir."
 AFG_linchpin_of_global_defense:0 "Küresel Savunmanın Kilit Taşı"
 AFG_linchpin_of_global_defense_desc:0 "Müttefikler, ittifakımızı ortak düşmanlarımızla jeopolitik pozlamada bir varlık olarak görüyor. Bunu, hepimiz için karşılıklı fayda sağlayacak askeri altyapı yatırımlarıyla değerlendirmeliyiz."
 AFG_look_to_other_partners:0 "Diğer Ortaklara Bak"
 AFG_look_to_other_partners_desc:0 "Sovyetler Birliği ile olan ticaret anlaşmalarımız, onların iç politikamızı ve dış politikamızı etkilediği şüphelerini artırdı. Bu suçlamalar elbette asılsızdır, ancak belki de ticaret ortakları için başka yerlere bakmak bizim çıkarımıza olacaktır."
 AFG_look_to_other_partners_tt:0 "Büyük uluslar, [ROOT.GetNameDef]'a yatırım yapma fırsatı bulacak ve bize §Rpolitikamızı bir yıl boyunca etkileme§! karşılığında §Gkabul eden her ülke için bir off-map sivil fabrika§! verecek."
 AFG_maintain_neutrality:0 "Tarafsızlığı Koru"
 AFG_maintain_neutrality_desc:0 "Ülke içinde nispeten istikrarlı olsak da, küresel durum giderek tehlikeli hale geliyor. İstemeyerek herhangi bir çatışmaya sürüklenmeden önce, tarafsız bir ulus olduğumuzu herkese açıkça belirtmeliyiz."
 AFG_maintain_quami:0 "Quami Sistemini Sürdür"
 AFG_maintain_quami_desc:0 "Quami askere alma sistemi, yüzyıllardır savunmamızın temel taşı olmuştur. Neden sadece başkentteki kentsel elitlere fayda sağlayacak, geleneğe kök salmış bir sistemi atalım? Bu son reform hevesine direnmek, tek mantıklı seçimdir."
 AFG_maintain_quami_tt:0 "§Y$AFG_quami_category$ kararlarını ve daha fazla düzensiz tümen işe alma yeteneğini koru.§!"
 AFG_militia_cavalry:0 "Katgani Süvarileri"
 AFG_militia_cavalry_desc:0 "[ROOT.GetNameDefCap], ülkenin engebeli arazisi için özel olarak yetiştirilmiş bir dizi at cinsine ev sahipliği yapmaktadır. Bunlar, bozulmaya meyilli ve kapsamlı destek gerektiren pahalı yabancı teçhizata yatırım yapmak yerine süvari tugaylarında kullanılabilir."
 AFG_ministry_of_supply:0 "Tedarik Bakanlığı"
 AFG_ministry_of_supply_desc:0 "Ordu için tedarik hatları neredeyse yok. Durumu iyileştirmek için, silahlı kuvvetler ve kritik altyapı için tüm tedarikleri yönetecek yeni bir bakanlık kurmalıyız."
 AFG_modern_economy:0 "Modern Bir Ekonomi"
 AFG_modern_economy_desc:0 "Nihayet halkımızı yüzyıllardır geride tutan çağdışı ekonomik uygulamaların zincirlerini kırdık. Artık dünyanın diğer sanayileşmiş uluslarının yanında gerçekten yerimizi alabiliriz."
 AFG_modifiy_1923_constitution_modifier_tt:0 "§Y$AFG_1923_constitution_modifier$§! değerini değiştir:\n"
 AFG_modifiy_amanullah_insurrection_modifier_tt:0 "§Y$AFG_amanullah_insurection_modifier$§! değerini değiştir:\n"
 AFG_modifiy_look_to_the_past_modifier_tt:0 "§Y$AFG_look_to_the_past_modifier$§!'i şu şekilde değiştir:\n"
 AFG_mohammed_daoud_khan_available_as_general_tt:0 "§YMuhammed Davud Han§! seviye §Y2§! bir General olarak kullanılabilir hale gelir"
 AFG_mountain_training:0 "Dağ Eğitimi"
 AFG_mountain_training_2:0 "Dağlara Hükmet"
 AFG_mountain_training_2_desc:0 "Dağ eğitimi girişimimizin başarısının ardından, bu tür araziler için uzman savaş birimleri oluşturmaya devam etmemiz gerektiği ortaya çıktı."
 AFG_mountain_training_desc:0 "Yeni teknolojiler ve taktikler gelip geçer, ancak dağlar ve vadiler değişmez. Komşularımızla teknolojik yarışa girmek yerine, çevremizdeki araziyi taktik avantaja dönüştürmeye odaklanmalıyız."
 AFG_naval_academy:0 "Bir Deniz Harp Okulu Kur"
 AFG_naval_academy_desc:0 "Tarihsel olarak kıyısız olmamız, denizcilik deneyimi olan subay eksikliğine yol açtı. Bir deniz harp okulu kurup yurtdışından subaylar getirerek ilk nesil [AFG.GetAdjective] denizcilerini yetiştirmeliyiz."
 AFG_naval_academy_tt:0 "Rastgele §Yİki§! §YAmiral§! işe al"
 AFG_new_army:0 "Daimi Ordu"
 AFG_new_army_desc:0 "Kırsal kesimden gelen reform direncine rağmen, ileriye gitmeli ve yeni askerler için büyük çaplı bir eğitim programı başlatmalıyız."
 AFG_nufus_intro_tt:0 "§Y$AFG_nufus_modifier$§! değerini değiştir:"
 AFG_occupy_peshawar_tt:0 "§RBu, [442.GetName]'in sahibiyle savaşa yol açabilir!§!"
 AFG_occupy_waziristan_tt:0 "§RBu, [987.GetName]'in sahibiyle savaşa yol açabilir!§!"
 AFG_officer_training:0 "Subay Eğitimi"
 AFG_officer_training_desc:0 "[GER.GetAdjective] ordusu, [ENG.GetAdjective] veya [SOU.GetAdjective] ordularından çok daha üstün olduğunu kanıtladı. Bir sonraki nesil [ROOT.GetAdjective] askerlerini eğitmek için subaylarının desteğini istemeliyiz."
 AFG_officialize_the_turkish_afghan_defense_treaty:0 "[TUR.GetAdjective]-[ROOT.GetAdjective] Savunma Antlaşması"
 AFG_officialize_the_turkish_afghan_defense_treaty_desc:0 "1933'ten beri Türk askeri personeli, yeni nesil Afgan askerlerinin eğitilmesine yardım etti. Bu bağlantıları kullanmanın, yabancı saldırganlığa karşı birbirimizi korumakla yükümlü olacağımız bir savunma antlaşması talep etmenin zamanı geldi."
 AFG_parliamentary_democracy:0 "Parlamenter Demokrasi"
 AFG_parliamentary_democracy_desc:0 "Kral Zahir Şah'ın siyasi inançları, amcalarının gölgesinde geçen yıllardan sonra ortaya çıkmaya başlıyor. Kral'ın, halk arasında yeterli destek olursa parlamenter demokrasiye geçişi destekleyeceği açık. Ancak bu kadar radikal bir değişiklik, başkentin dışındaki daha geleneksel insanlarla ülkeyi iç savaşa sürükleyebilir."
 AFG_parliamentary_democracy_tt:0 "§YDemokratik destek %50'den fazlaysa, iç savaş tetiklemekten kaçınacağız.§!"
 AFG_pashtun_empire:0 "Peştunistan Yükselişi"
 AFG_pashtun_empire_desc:0 "Bugün, ulusumuzun tarihinde tarihi bir an olacak. [ROOT.GetLeader]'ın liderliğinde, Peştun Yükselişi'nin kuruluşunu ve Peştun halkı için yeni bir çağın başlangıcını gururla ilan edeceğiz. Modernize ordumuz, stratejik ittifaklarımız ve iddialı politikalarımızla kendimizi bölgenin baskın gücü olarak sağlamlaştırdık."
 AFG_permit_axis_airbases:0 "Mihver Hava Üslerine İzin Ver"
 AFG_permit_axis_airbases_desc:0 "[GER.Capital.GetCapitalVictoryPointName]'daki dostlarımız, hava kuvvetlerini evlerinden bu kadar uzakta konuşlandırmakta zorlanıyor. Bu sorunu onlar için hafifletebilir ve aynı zamanda kendimiz için yararlı altyapı ve uzmanlık kazanabiliriz."
 AFG_placeholder_1:0 "Alman Yatırımını Güvence Altına Al"
 AFG_placeholder_1_desc:0 "[ENG.GetAdjective] veya [SOU.GetAdjective]lara karşı yüzyıllardır süren düşmanlık ve çatışmalardan sonra sevgi beslemiyoruz. Ancak yükselen [GER.GetName], bize daha benzer düşünceli bir uluslararası ortak kazanma fırsatı sunuyor."
 AFG_political_events_53_tt:0 "§Y[GER.GetNonIdeologyName], iç savaş başladığında bize silah yardımı yapacak ve gönüllü gönderecek.§!"
 AFG_prepare_for_operation_countenance:0 "Operasyon Countenance'a Hazırlan"
 AFG_prepare_for_operation_countenance_desc:0 "Müttefikler, komşumuz [PER.GetName]'daki petrolü düşmanlarımızdan önce ele geçirmek için bir müdahale hazırlığı yapıyor. Yaklaşan operasyona destek olmak için lojistik düzenlemeler yapmalıyız."
 AFG_prepare_the_war_industries:0 "Savaş Sanayilerini Hazırla"
 AFG_prepare_the_war_industries_desc:0 "Mevcut sanayimiz savaş üretimi kapasitesinden yoksundur. Komşu ülkeler tarafından ezilmemek için, fabrikalarımızı yönetici elitin taleplerini karşılamak yerine ordumuzu desteklemek üzere yeniden yönlendirmeliyiz. Bu geçiş, hayatta kalmamız için çok önemlidir."
 AFG_privatize_factories:0 "Fabrikaları Özelleştir"
 AFG_privatize_factories_desc:0 "TODO"
 AFG_proclaim_a_new_caliphate:0 "Yeni bir Hilafet İlan Et"
 AFG_proclaim_a_new_caliphate_2_tt:0 "Kontrol ettiğimiz hak iddia edilen eyaletleri §YEntegre Etme§! kararlarını açar"
 AFG_proclaim_a_new_caliphate_desc:0 "Osmanlı İmparatorluğu'nun dağılmasının ardından yeni bir hilafet ilan edilmedi. Kaybolmuş ve yoldan çıkmışlara liderlik etmek için bu yeni görevi üstlenmeli ve geçmişin Raşidunlarının mirasına layık olmalıyız."
 AFG_proclaim_a_new_caliphate_tt:0 "Bu odağın hak iddiası verdiği eyaletleri işgal eden her ülkeye karşı §YHak iddia edilen eyaleti al§! savaş hedefi kazandırır"
 AFG_proclaim_the_second_afghan_empire:0 "İkinci Afgan İmparatorluğu'nu İlan Et"
 AFG_proclaim_the_second_afghan_empire_desc:0 "1747'de Ahmed Şah Dürrânî, Afgan kabilelerini birleştirdi ve onları bir imparatorluk olarak organize etti. Zirvesindeyken, Orta Asya, Doğu Hindistan ve İran'ın büyük bir bölümünü yönetiyordu. 18. yüzyılın ikinci yarısının en önemli İslam imparatorluğu olarak Osmanlı İmparatorluğu'nun yanında yer aldı ve bu mirası geri almalıyız!"
 AFG_promote_muslim_work_ethic:0 "Müslüman Çalışma Ahlakını Teşvik Et"
 AFG_promote_muslim_work_ethic_desc:0 "Batılılar, İslam dünyasının sıkı çalışmasını görmezden gelerek uzun süredir 'protestan çalışma ahlakı' ile övündüler. Onlara adanmışlığımız ve uzmanlığımızla her açıdan eşit olduğumuzu hatırlatmanın zamanı geldi."
 AFG_promote_the_counter_elite:0 "Karşıt Eliti Destekle"
 AFG_promote_the_counter_elite_desc:0 "Siyasi elitler arasında ulusu modernize etmek için radikal fikirleri olan birçok kişi var, ancak muhafazakar siyasi iklim nedeniyle bu fikirleri keşfedemediler. Eski hükümet dağıldığına göre, belki de bu radikalleri destekleme zamanı gelmiştir."
 AFG_promote_the_counter_elite_tt:0 "İşe alınabilecek danışmanlar:"
 AFG_propose_confederation_with_pakistan:0 "Pakistan ile Konfederasyon Öner"
 AFG_propose_confederation_with_pakistan_desc:0 "[PAK.GetNonIdeologyName] halkı, [ENG.GetAdjective] yönetimi altında çok uzun süre acı çekti ve haklı olarak bağımsızlık için mücadele etti. Ancak halklarımız o kadar çok tarih ve kültür paylaşıyor ki, kendimizi birbirimize düşman bulmadan önce iki ulusun birleşmesi mantıklı olacaktır."
 AFG_protector_of_baghdad:0 "Bağdat'ın Koruyucusu"
 AFG_protector_of_baghdad_desc:0 "TODO"
 AFG_protector_of_the_tajiks:0 "Taciklerin Koruyucusu"
 AFG_protector_of_the_tajiks_desc:0 "Çoğunluktaki Peştunlar ile kuzeydeki önemli Tacik nüfusu arasında sık sık gerginlikler çıktı. Ancak, [742.OWNER.GetLeader]'ın despotik yönetimi altındaki sınırlarımızın ötesindeki Tacikleri kurtararak onların desteğini kazanma fırsatımız var."
 AFG_protector_of_the_tajiks_tt:0 "[742.GetName] [ROOT.GetName] tarafından işgal edildiğinde [742.OWNER.GetNameDef] ile barış önerme kararlarını aç."
 AFG_prussians_of_the_orient:0 "Doğu'nun Prusyalıları"
 AFG_prussians_of_the_orient_desc:0 "Yabancı subaylar tarafından verilen eğitimimiz ve büyük miktarlardaki fazla [GER.GetAdjective] teçhizatı nedeniyle, [GER.GetNameDef]'deki yetkililer bize Doğu'nun Prusyalıları olarak hitap etmeye başladı. Bu unvana layık olduğumuzdan emin olmalı ve bize karşı gelmeye cüret eden herkese karşı dimdik durmalıyız."
 AFG_purchase_aircraft:0 "Yabancı Uçak Satın Al"
 AFG_purchase_aircraft_desc:0 "Hava saldırılarına karşı savunmasızız. Kendi hava kuvvetlerimizi kurarak düşman uçaklarına karşı koymalıyız."
 AFG_purchase_capital_ships:0 "Büyük Gemiler Satın Al"
 AFG_purchase_capital_ships_desc:0 "Donanmamız küçük gemilerle şekillenmeye başladı, ancak büyük gemilerin ateş gücünden yoksunuz. Satın alınabilecek herhangi bir büyük gemi arayışına girmeliyiz."
 AFG_purchase_destroyers:0 "Muhrip Satın Al"
 AFG_purchase_destroyers_desc:0 "Modern savaş gemileri tasarlama altyapısını oluşturmak onlarca yıl alır. Daha pratik bir çözüm, diğer ülkelerden hizmet dışı gemiler satın alıp onları uyarlamaktır."
 AFG_purchase_tanks:0 "Yabancı Tank Satın Al"
 AFG_purchase_tanks_desc:0 "Ordumuzun ne düşman hatlarını yaracak gücü ne de hızlı ilerleyecek kabiliyeti var. Bu sorunları hafifletmek için zırhlı birlikler satın almalıyız."
 AFG_pursue_our_own_agenda:0 "Kendi Gündemimizi İzle"
 AFG_pursue_our_own_agenda_desc:0 "Büyük güçler birbirleriyle çarpışırken uluslararası düzen yeniden yazılıyor. Kendimizi herhangi bir gruba bağlamak yerine, kaostan yararlanmalı ve kendi dış politikamızı izlemeliyiz."
 AFG_qargha_dam:0 "Kargha Barajı'nı İnşa Et"
 AFG_qargha_dam_desc:0 "Ülkenin daha kurak bölgelerinde yeterli sulama eksikliği var ve bu da hasatları riske atıyor ve kıtlıklara neden olma potansiyeli taşıyor. Ancak, sulama için mevcut suyu artırmak amacıyla barajlar inşa edebiliriz ve bu hatta tarımsal fazlalıklara yol açabilir."
 AFG_quami_intro_tt:0 "§Y$AFG_quami_modifier$§! değerini değiştir:"
 AFG_rail_construction:0 "Afgan Demiryolu Şirketi Kur"
 AFG_rail_construction_desc:0 "Büyük miktarda kaynak veya insan taşımak için demiryolu kadar verimli bir şey yoktur. Bu nedenle, kendi demiryolu ağımızı geliştirmek ve işletmek için bir demiryolu şirketi kurmalıyız."
 AFG_raise_lashkar_regiments:0 "Leşker Alayları Topla"
 AFG_raise_lashkar_regiments_desc:0 "Fakir'in Britanya Rajı'nın Peştun bölgelerindeki direnişçi yoldaşları kendilerini Leşker olarak adlandırdılar. Şimdi o [ROOT.GetNameDef]'i yönettiğine göre, devlet hizmeti altında benzer alayları resmi olarak kurmanın tam zamanı olabilir."
 AFG_raj_attack_bonus:0 "Hindistan'a Doğru"
 AFG_rapprochement_with_non_pashtuns:0 "Peştun Olmayanlarla Yakınlaşma"
 AFG_rapprochement_with_non_pashtuns_desc:0 "Çok uzun süredir ulusumuzdaki Peştun olmayanlar siyasetin kenarına itildi. Bu sadece merkezi hükümete karşı kızgınlığa yol açmakla kalmadı, 1929'da tamamen devrilmesine neden oldu. Bu nedenle, yeni demokratik sistem altında tüm halkımızın temsil edildiğini ve duyulduğunu hissetmesini sağlamalıyız."
 AFG_rebuild_the_silk_road:0 "İpek Yolu'nu Yeniden İnşa Et"
 AFG_rebuild_the_silk_road_desc:0 "İpek Yolu bir zamanlar İmparatorluğa zenginlik ve kültür getirdi. Bu tarihi ticaret ağını restore ederek, küresel ticaretin merkezindeki yerimizi geri alır, imparatorluğu zenginleştirir ve geniş topraklarında refahı teşvik ederiz."
 AFG_reclaim_moghulistan:0 "Muğulistan'ı Geri Al"
 AFG_reclaim_moghulistan_desc:0 "Çağatay Hanlıklarından biri olan Muğulistan, Büyük Moğol İmparatorluğu'nun haleflerinden biriydi. Bir zamanlar sahip oldukları aynı şana hak iddia etmeye çalışan yeni bir devlet olarak, bu toprakları kendimiz için almak akıllıca olabilir."
 AFG_reclaim_the_emperors_lost_domain:0 "İmparatorların Kayıp Mülkünü Geri Al"
 AFG_reclaim_the_emperors_lost_domain_desc:0 "Nihayet zaman geldi. Mevcut dünya durumu göz önüne alındığında, [SOV.GetNameDef]'e saldırmak için daha iyi bir zaman olamaz. Tüm Orta Asya'yı kesin olarak kurtaracağız!"
 AFG_reclaim_transoxiana:0 "Maveraünnehir'i Geri Al"
 AFG_reclaim_transoxiana_desc:0 "Eski Maveraünnehir toprakları bir zamanlar mirasçısı olduğumuz Timurlu İmparatorluğu'na aitti. Mirasımız zayıflık ve kararsızlıkla lekelenmesin diye bu toprakları geri almalıyız!"
 AFG_recruit_experts_and_officers:0 "Uzmanlar ve Subaylar İşe Al"
 AFG_recruit_experts_and_officers_desc:0 "Bir zamanlar [PER.GetAdjective] veya [TUR.GetAdjective] devletlerine hizmet eden bilim adamları, mühendisler ve askeri subaylar, şimdi ulusumuzun üstünlüğünü görmeye başlıyor. Bu nedenle, kendimizi bölgesel bir büyük güç olarak ortaya koyarken bize hizmet etmelerini sağlayabiliriz."
 AFG_recruit_foreign_experts:0 "Yabancı Uzmanlar İşe Al"
 AFG_recruit_foreign_experts_desc:0 "Ülkemizde gerekli uzmanlığa sahip olmayabiliriz, bu yüzden şimdi bize yardımcı olabilecek ve bu becerileri gelecekte bize öğretebilecek kişileri bulmak için sınırlarımızın dışına bakmalıyız."
 AFG_red_threat:0 "Kızıl Tehdit"
 AFG_red_threat_desc:0 "Orta Asya'daki gizli müttefiklerimizle birlikte, [SOU.GetAdjective] etkisini zayıflatıp kendi etkimizi genişletmek için eşsiz bir fırsatla karşı karşıyayız. İstilamızı bölgedeki direniş hücreleriyle koordine ederek, düşman ne olduğunu anlamadan onları devireceğiz."
 AFG_reforging_the_yuan_dynastry:0 "Yuan Hanedanlığını Yeniden Güçlendirin"
 AFG_reforging_the_yuan_dynastry_desc:0 "[ROOT.GetLeader]'nin Moğol topraklarının yeniden yönetimini sağlaması ve Manghud hanedanını atalarının anavatanıyla yeniden birleştirmesiyle, güneydeki topraklar artık fetih için olgunlaşmış durumdaydı. Bir zamanlar Borjiginler tarafından kurulan Yuan Hanedanlığı'nı yeniden kurarak onların unvanlarını en ufak bir meşruiyet kazanmak için bile kullanabiliriz."
 AFG_reform_1:0 "Eğitim Reformu"
 AFG_reform_1_desc:0 "Parlamenter demokrasiye geçiş sorunsuz olmadı ve bir sonraki nesilde demokratik değerleri aşılamak için daha fazlasını yapmalıyız. Bu nedenle, eğitim sistemini reform etmeli ve ülkenin her yerindeki tüm çocuklar için daha erişilebilir hale getirmeliyiz."
 AFG_reform_2:0 "Chak Barajı'nı İnşa Et"
 AFG_reform_2_desc:0 "Yabancı ortaklarımızın yardımıyla, başkente ve çevresindeki bölgelere elektrik sağlamak için Chak nehri üzerinde büyük bir hidroelektrik baraj inşa etmek için teknolojik ve finansal imkanlara sahibiz. Ancak bu, destekçilerimizin düşmanlarını rahatsız edecektir."
 AFG_reform_3:0 "Anti-Demokratik Etkiyi Kısıtla"
 AFG_reform_3_desc:0 "Yeni hükümet ile muhalefet arasındaki uçurumu kapatma çabalarımıza rağmen, birçoğu tepkisel, anti-demokratik inançlara eğilimli ve fırsat verilirse bize karşı harekete geçebilirler. Bu nedenle, bu tür faaliyetleri kısıtlamak için daha fazlasını yapmalıyız."
 AFG_reform_4:0 "Ekonomik Modernizasyon"
 AFG_reform_4_desc:0 "[ROOT.GetNonIdeologyName]'a istikrar geri döndükçe, yatırım ve iş ilgisi de onu takip etti. Ekonomiyi canlandırmak için tarım ve sınırlı endüstrilerimizin modernizasyonuna yatırım yapacağız."
 AFG_rehabilitate_the_saqqawists:0 "Sakkavist'leri Rehabilite Et"
 AFG_rehabilitate_the_saqqawists_desc:0 "Sakkavistler, 1929'da Amanullah Han'ın yozlaşmış yönetimini devirmeyi başardılar, ancak birkaç yıl sonra şans onlardan yüz çevirdi ve neredeyse tamamen yok edildiler. Belki de geleneksel değerlerimizi korumak için cesurca savaşan bu kahramanları onurlandırmanın zamanı gelmiştir."
 AFG_reinforce_the_royal_guard:0 "Kral'ın Gölgeleri"
 AFG_reinforce_the_royal_guard_desc:0 "Meşruiyetine rağmen, Kral'ın dönüşünden ve radikal reformlarından rahatsız olan birçok kişi var. Bu hainlerin Kral'ın çalışmalarını baltalamalarına izin verilemez ve gölgelerde çalışan yeni bir güvenlik servisi tarafından bastırılmaları gerekir."
 AFG_reinforce_the_royal_guard_tt:0 "Muhalefeti bastırmak ve istikrarı artırmak için §Y$AFG_shadows_of_the_emir_category$§! kararlarını aç."
 AFG_reintroduce_heavy_cavalry:0 "Ağır Süvariyi Yeniden Getir"
 AFG_reintroduce_heavy_cavalry_desc:0 "Atalarımız defalarca atlarını alıp Hindistan ve Orta Asya ovalarına akın ettiler, hükümdarları zayıfken toprakları ve kaynakları ele geçirdiler. Komşularımız çatışmalara bulaşırken, belki de ufukta böyle bir an daha belirebilir."
 AFG_reintroduce_war_elephants:0 "Savaş Fillerini Yeniden Getir"
 AFG_reintroduce_war_elephants_desc:0 "Dünya, daha da karmaşık motorlu canavarlıklar yapmanın yollarını bulmak için çabalarken, biz savaş filleri kullanımını canlandırarak savaşmak ve düşmanlarımızın kalbine korku salmak için denenmiş ve kanıtlanmış yöntemleri kullanacağız."
 AFG_remember_the_khost_rebellion:0 "Khost İsyanını Hatırla"
 AFG_remember_the_khost_rebellion_desc:0 "1924'te aramızdaki salihler, ülkeyi gururlu kimliğini kaybetme eşiğinden döndürmek için Kral Amanullah'a ve onun batılı yandaşlarına karşı ayaklandı. Yenilmiş olabilir, ama ruhu yaşamaya devam ediyor ve şimdi Kabil'in üstesinden nasıl gelineceğini biliyoruz. Geleneğe geri dönme zamanı!"
 AFG_renew_soviet_trade_agreement:0 "Sovyet Ticaret Anlaşmasını Yenile"
 AFG_renew_soviet_trade_agreement_desc:0 "Yıllar boyunca ideolojilerimiz farklılaşsa da, [SOU.GetName] ulusumuz için iyi bir ekonomik ortak oldu. Bazıları iç işlerimizde [SOU.Adjective] etkisi riskinden korkarken, uluslarımız arasındaki ticaret anlaşmasını yenilememizde bir sorun görmüyoruz."
 AFG_renounce_the_durand_line:0 "Durand Hattından Vazgeç"
 AFG_renounce_the_durand_line_desc:0 "Yabancı baskıcılar tarafından dayatılan Durand Hattı, Peştun kardeşlerimizi çok uzun süredir bölüyor. Diplomatlarımızın kurnazlığıyla veya silahlı kuvvetlerimizin gücüyle, bu adaletsizliğe bir son vereceğiz."
 AFG_renounce_the_durand_line_tt:0 "\n\n§YTalep edilen eyaletlerin sahibi, zaten savaştayken veya devam eden bir iç savaşla zayıflamışsa önerimizi kabul etmeye daha yatkın olacaktır.§!"
 AFG_reorganize_the_royal_guard:0 "Kraliyet Muhafızlarını Yeniden Düzenle"
 AFG_reorganize_the_royal_guard_desc:0 "Kraliyet Muhafızları, kendilerine verilen onura layık olamıyorlar. Onları bir dizi reform ve saflarının genişletilmesiyle yeniden canlandıracağız. [ROOT.GetNameDef]'in gücünü ve kararlılığını somutlaştırmalıdırlar."
 AFG_repaying_our_friends:0 "Dostlarımıza Borcunu Öde"
 AFG_repaying_our_friends_desc:0 "TODO"
 AFG_repeal_the_durand_line:0 "Durand Hattını İptal Et"
 AFG_repeal_the_durand_line_desc:0 "Yabancı baskıcılar tarafından dayatılan Durand Hattı, Peştun kardeşlerimizi çok uzun süredir bölüyor. Diplomatlarımızın kurnazlığıyla veya silahlı kuvvetlerimizin gücüyle, bu adaletsizliğe bir son vereceğiz."
 AFG_republic_of_afghanistan:0 "Cumhuriyet İlan Et"
 AFG_republic_of_afghanistan_desc:0 "Anayasal monarşi şeklinde demokrasiyi benimsemek büyük bir adımdı. Ancak, monarşinin son kalıntılarını kaldırıp bir Cumhuriyet ilan ederek demokratik bir devlet başkanı seçmedikçe demokratik özgürlüklerimizin asla tam olarak güvence altına alınamayacağına dair endişeler var."
 AFG_republic_of_afghanistan_tt:0 "§YUlusumuz için yeni bir kimlik seçebileceğiz; bu, çekirdek eyaletlerimizi değiştirebilir veya yeni fikirler ekleyebilir.§!"
 AFG_request_german_support:0 "Alman Desteği İste"
 AFG_request_german_support_desc:0 "$AFG_amunullah_khan$, uzun süredir [GER.GetNonIdeologyName]'ı takdir ediyor ve hükümetinde yüksek rütbeli destekçileri var. Belki de bölgede dost bir rejim karşılığında Kral'ın dönüşünü desteklerler."
 AFG_request_german_support_tt:0 "Eğer §Y[GER.GetNonIdeologyName]§! teklifimizi kabul ederse, iç savaş başladığında bize yardım etmek için silah tedarik edecek ve gönüllüler gönderecek. §Y[GER_oskar_von_nidermayer.GetName]§! bir general olarak bize katılacak."
 AFG_request_japanese_support:0 "Japon Desteği İste"
 AFG_request_japanese_support_desc:0 "[JAP.GetAdjective]ler Asya kıtasına hükmetmek istiyor ve kapsamlı hedeflerini destekleyen müttefikler arıyor olabilirler. Rakibimiz Kral Zahir'in bu fikre karşı olduğunu onlara ikna etmek ve yaklaşan isyanımız için desteklerini istemek akıllıca olabilir."
 AFG_request_japanese_support_tt:0 "Eğer §Y[JAP.GetNonIdeologyName]§! teklifimizi kabul ederse, iç savaş başladığında bize yardım etmek için silah tedarik edecek ve gönüllüler gönderecek."
 AFG_request_soviet_support:0 "Sovyet Yardımı İste"
 AFG_request_soviet_support_desc:0 "Devrimimiz, ulusun önemli nüfus merkezlerini ele geçirebilecek ekonomik kaynaklar ve insan gücü eksikliği nedeniyle başarısızlık tehlikesiyle karşı karşıya. Başarılı olmak istiyorsak, en kısa sürede [SOU.GetNameDef]'den yardıma ihtiyacımız olacak."
 AFG_request_soviet_support_tt:0 "§Y[SOV.GetNameDef]§! teklifimizi kabul ederse bize silah sağlayacaklar ve savaş sırasında bize gönüllü gönderme olasılıkları daha yüksek."
 AFG_research_bonus_1:0 "Yerli Deniz Endüstrisi Geliştir"
 AFG_research_bonus_1_desc:0 "Büyük güçler bize sadece bölgedeki çıkarlarına tehdit oluşturmayan, modası geçmiş teknolojileri satıyor. Modern bir donanma için kendi tasarımlarımızı geliştirmeliyiz."
 AFG_research_bonus_2:0 "Denizcilik Gelişimlerine Yatırım Yap"
 AFG_research_bonus_2_desc:0 "Küçük gemilerdeki uzmanlığımız meyvesini verdi; mühendislerimiz şimdi daha büyük tasarımlara odaklanıyor."
 AFG_restore_herat:0 "Herat'ı Restore Et"
 AFG_restore_herat_desc:0 "Kabil'deki eski güç merkezine meydan okuyarak, başkentin Durrani İmparatorluğu'nun ana ikametgahı olan Herat'a taşınma zamanı geldi. Bunu yaparak, bu bir zamanların büyük imparatorluğunun halefleri olduğumuz yönündeki iddiamızı güçlendirebileceğiz."
 AFG_restore_the_timurid_empire:0 "Timurlu İmparatorluğu'nu Geri Getir"
 AFG_restore_the_timurid_empire_desc:0 "Timur'un sancakları bir kez daha dalgalanıyor ve bir zamanlar sultanların ve kralların kalbine korku salan imparatorluk, tarihin küllerinden yeniden doğdu. Hükümdarlığımız, bir zamanlar onun fetihleriyle şekillenen topraklara yayılıyor, Doğu ve Batı'yı tek bir egemenlik altında birleştiriyor. Dünya dikkat kesilsin—Timurlular geri döndü ve bu sefer geçmişe karışmayacağız."
 AFG_retire_the_uncles:0 "Amcaları Emekli Et"
 AFG_retire_the_uncles_desc:0 "[ROOT.Capital.GetCapitalVictoryPointName]'daki siyasi durum, eski muhafızların aleyhine dönmeye başlıyor. Şimdi Kral'ın mevcut kabineyi feshedip kendi hedefleriyle daha uyumlu bir kabine kurma zamanı."
 AFG_return_of_the_emir:0 "Kral'ın Dönüşü"
 AFG_return_of_the_emir_desc:0 "Planlar yapıldı, temaslar kuruldu ve silahlar dağıtıldı. Geriye kalan tek şey, Kral'ın Afganistan'a dönüp Zahir Şah'ın gayrimeşru rejimini devirmek için isyanı başlatmasıdır."
 AFG_return_to_delhi:0 "Delhi'ye Geri Dön"
 AFG_return_to_delhi_desc:0 "Delhi bir zamanlar Sultan'ın merkeziydi ve görkemli Tavus Kuşu Tahtımızın bulunduğu Kızıl Kale'ye ev sahipliği yapmaktadır. Şimdi şehre yürüyecek ve uzun zamandır kayıp olan başkentimizi geri alacağız ve böylece eski Babür İmparatorlarına layık olacağız."
 AFG_revive_the_1923_constitution:0 "1923 Anayasasını Canlandır"
 AFG_revive_the_1923_constitution_desc:0 "Kral, 1923'te ülkenin 20. yüzyıla çekilmesi gerektiğini anlayan bir vizyonerdi. Ancak reformları Zahir Şah tarafından yok edildi. Kral'ın iktidara dönüşüyle, kaldığı yerden devam edip 1923 anayasasını restore edebiliriz."
 AFG_revive_the_workshop_of_the_world:0 "Dünyanın Atölyesini Canlandırmak"
 AFG_revive_the_workshop_of_the_world_desc:0 "Fabrikalarımızı modernize ederek ve ticaret yollarımızı canlandırarak atalarımızı örnek alacağız. Bu dönüşüm, ekonomimizi dünyanın büyük uluslarıyla rekabet edebilecek bir güç merkezi olarak kuracaktır."
 AFG_salang_pass:0 "Salang Geçidi Tüneli"
 AFG_salang_pass_desc:0 "[ROOT.GetNonIdeologyName]'ın dağlık arazisi, ülke genelinde uygun ulaşım yolları geliştirmeyi zorlaştırıyor. Ancak, [SOU.GetAdjective] mühendisleri Salang'daki dağların içinden bir tünel inşa edebileceklerine inanıyorlar. Hükümetleri, bazı stratejik tavizler karşılığında inşaatı üstlenmeyi teklif etti."
 AFG_savior_of_the_holy_lands:0 "Kutsal Toprakların Kurtarıcısı"
 AFG_savior_of_the_holy_lands_desc:0 "Kutsal toprakları yabancı baskıcıların boyunduruğundan kurtarmak için kutsal bir görevi yerine getirme zamanı geldi. Cesur askerlerimiz, atalarımızın gücüyle yürüyecek ve inancımızın doğduğu yeri geri alma amacından ilham alacak. Bu ilahi çaba, sadece İslam dünyasını liderliğimiz altında birleştirmekle kalmayacak, aynı zamanda büyük ulusumuza onur ve şan getirecek."
 AFG_scavenging:0 "Yağmalama Taktikleri"
 AFG_scavenging_desc:0 "Üretemediğimiz ekipmanlar, genellikle yabancı işgalcilerin elinde ortaya çıkıyor. Bu nedenle, birliklerimizi değerli askeri malzemeleri tanıma ve ele geçirme konusunda eğitmeliyiz."
 AFG_secure_army_support:0 "Ordu Desteğini Sağla"
 AFG_secure_army_support_desc:0 "Orduda hala $AFG_amunullah_khan$ tarafından atanmış veya onun altında görev yapmış subaylar var. Doğru teşviklerle, Kral'ın dönüşünü desteklemeleri sağlanabilir."
 AFG_secure_army_support_tt:0 "§Yİç savaş başladığında daha fazla ordu tümeni tarafımıza katılacak.§!"
 AFG_secure_baghdad:0 "Bağdat'ı Güvence Altına Al"
 AFG_secure_baghdad_desc:0 "Bölgedeki etkimiz genişledikçe, [IRQ.GetNameDef]'ın çabalarımızı baltalama potansiyeli olduğu ortaya çıkıyor. Bu nedenle, dış politikalarının bizimle uyumlu hale gelmesini talep etmeliyiz, aksi takdirde silahlı kuvvetlerimizin öfkesiyle karşılaşacaklar."
 AFG_secure_dynasty:0 "Hanedanı Güvence Altına Al"
 AFG_secure_dynasty_desc:0 "Ekonomi istikrarlı ve halk yatıştırılmışken, hükümetin daha az sadık unsurlarını devirip onları Kral'a -veya daha önemlisi amcalarına- sadık diğer aile üyeleriyle değiştirerek Barakzai hanedanını güvence altına alabiliriz."
 AFG_secure_iran:0 "İran'ı Güvence Altına Al"
 AFG_secure_iran_desc:0 "[PER.GetAdjective] petrol sahalarını güvence altına alma zamanı geldi. Müttefiklerimizle birlikte, [PER.Capital.GetCapitalVictoryPointName]'da rejim değişikliği gerektirse bile gerekeni yapacağız."
 AFG_seek_american_aid:0 "Amerikan Yardımı Ara"
 AFG_seek_american_aid_desc:0 "$PAR_accept_american_loans_desc$"
 AFG_seek_british_investment:0 "İngiliz Yatırımları Ara"
 AFG_seek_british_investment_desc:0 "On yıllardır [ENG.GetAdjective]ların, [SOV.GetNameDef]'in ulusumuzdan geçip değerli Hint topraklarını ilhak edeceği korkularını körükledik. Bu, bizi kendi taraflarında tutmak için ödenekler ve yatırımlara yol açtı. Dünya durumu daha hassas hale geldikçe, bu oyunu sürdürmek daha da karlı olabilir."
 AFG_shipyards:0 "[ROOT.GetAdjective] Denizcilik Tesisleri Kur"
 AFG_shipyards_desc:0 "Kendi tasarım gemilerimiz için hazır olmasak bile, gelecekteki gemilerin bakım ve yenileme tesislerine ihtiyacı olacak. Şimdi bir tersane kurarak, onlarca yıl hizmet verecek gemilerin altyapısını sağlayabiliriz."
 AFG_shipyards_tt:0 "Bir sahil eyaletine §G1§! bina yuvası ve §G1§! §YDeniz Tersanesi§! ekle."
 AFG_shipyards_tt_2:0 "§YAskeri Endüstriyel Organizasyonu aç:§!"
 AFG_sinkiang_intervention:0 "Sinkiang Müdahalesi"
 AFG_sinkiang_intervention_desc:0 "[SIK.GetNonIdeologyName] uzun süredir İslam dünyasının bir parçasıydı. Ancak eski Rus İmparatorluğu ve Çin'deki komünizmin yükselişi, şimdi sınırın ötesindeki Müslüman kardeşlerimizi tehdit ediyor. Onlara yönelik tehdidi bir kez ve sonsuza kadar bitirmenin zamanı geldi."
 AFG_socialist_coup:0 "Sosyalist Darbe"
 AFG_socialist_coup_desc:0 "Muhafazakar kısıtlamaların siyasi düşünce üzerindeki erozyonuyla, Pandora'nın kutusu açıldı ve anti-monarşist bir dalga ulusu süpürüyor. Şimdi bu çağdışı Krallığı süpürüp modern bir sosyalist devlet kurma zamanı."
 AFG_socialist_coup_tt:0 "§YEğer komünist destek %60'tan fazlaysa, bir iç savaşı tetiklemekten kaçınacağız.§!"
 AFG_sov_attack_bonus:0 "Kızıl Tehlike"
 AFG_sov_iran_war:0 "[PER.GetNonIdeologyName] Şahını Devir"
 AFG_sov_iran_war_desc:0 "[SOU.GetNameDef]'deki yoldaşlarımız her taraftan kuşatıldı ve düşmanlarımıza karşı koyabilecek ılık bir su filosu sürdürmekten alıkonuldu. Düşmanlarımıza verilen üstü kapalı destek nedeniyle, [PER.GetName]'ın işgali bize yeni bir deniz üssü sağlayacak ve potansiyel bir düşmandan kurtulacağız."
 AFG_soviet_research_cooperation:0 "Sovyet Araştırma İşbirliği"
 AFG_soviet_research_cooperation_desc:0 "Eski rejimi devirdikten sonra bir zamanların düşmanı [SOU.GetNameDef] en yakın dostumuz haline geldi. Bu nedenle, [ROOT.GetNonIdeologyName]'ın dönüşümüne yardımcı olacak teknolojik bilgiler edinme fırsatımız var."
 AFG_soviet_research_technology_exchange_tt:0 "§Y[SOU.GetNameDefCap] bize yüksek bir fikre sahipse teklifimizi kabul etmeye daha yatkın olacaktır.§! \nEğer [SOU.GetFlag]§Y[SOU.GetNameDef]§! teklifi kabul ederse, onlarla bir teknoloji paylaşım grubuna katılacağız."
 AFG_spinzar_cotton_factory:0 "Spinzar Pamuk Fabrikalarına Yatırım Yap"
 AFG_spinzar_cotton_factory_desc:0 "Kunduz'daki Spinzar Pamuk Fabrikası şu anda en kârlı fabrikalarımızdan biridir ve sahipleri işlerini genişletmek istiyor. Ancak hükümet desteği olmadan, mevcut boyutunun ötesinde pek büyüyemeyecektir. Yeni iştirakler kurmaya ve pamuk sanayimizin geleceğine yatırım yapmaya gayret etmeliyiz."
 AFG_standardize_equipment:0 "Ekipman Standardizasyonu"
 AFG_standardize_equipment_desc:0 ""
 AFG_state_atheism:0 "Devlet Ateizmi"
 AFG_state_atheism_desc:0 "Ekonomi ve toplumu modernize etmek istiyorsak, Peştunwali, İslam ve diğer tüm geleneksel halk afyonları bir kenara atılmalıdır. Bu çağdışı uygulamaları kısıtlamalı ve halka laik bir şekilde eğitim vermeliyiz."
 AFG_state_industries:0 "Askeri Endüstriler Kur"
 AFG_state_industries_desc:0 "Üniversite mezunları, becerilerini kullanacak iş bulamadıkları için radikalleşiyor. Bunu önlemek için devlet kontrollü endüstriler kurup hem istihdam sağlamalı hem de ordumuzu yerli üretimle donatmalıyız."
 AFG_state_industries_tt:0 "§YAskeri Endüstriyel Organizasyonlar§! kurma kararlarını aç ve mezunların radikalleşme süresini uzat."
 AFG_stir_unrest_in_the_east:0 "Doğuda Huzursuzluk Çıkar"
 AFG_stir_unrest_in_the_east_desc:0 "Veziristan ve Peşaver, hem [RAJ.GetAdjective] karşıtı hem de [AFG.GetAdjective] karşıtı faaliyetlerin yuvası olmaya devam ediyor. Onların örneğini takip etmeli ve Kral'ın kuvvetlerini başka yerlerde meşgul etmek için Hayber Geçidi'nde bir isyan çıkarmalıyız."
 AFG_sugar_processing:0 "Bağlan Şeker Fabrikası"
 AFG_sugar_processing_desc:0 "Halkımız arasında şeker talebi istikrarlı bir şekilde artıyor. Tarım ürünlerini bu değerli maddeye dönüştürmek için bir şeker fabrikası kurarak bu talebi karşılamalıyız. Sadece talep karşılanmayacak, aynı zamanda daha fazla endüstriyel istihdam yaratılacaktır."
 AFG_support_king_zahir:0 "Kral Zahir'i Destekle"
 AFG_support_king_zahir_desc:0 "On yıllarca süren siyasi istikrarsızlıktan sonra, Kral Zahir Şah'ın saltanatı, yıpranmış ulusumuz için bir barış ve ekonomik istikrar çağının başlangıcı olacak."
 AFG_support_king_zahir_tt:0 "§YKral Zahir Şah§! kazanır:\n Siyasi Güç Kazancı §G+5%§! \n Tarafsızlar İçin Günlük Destek §G+0.02§!"
 AFG_support_nort_west_frontier_rebels:0 "Kuzey-Batı Sınırı İsyancılarını Destekle"
 AFG_support_nort_west_frontier_rebels_desc:0 "[RAJ.GetAdjective] Kuzey-Batı Sınırındaki Peştun isyancılar, Fakir'in [ROOT.GetNameDef]'e gitmesine rağmen zalimlerine karşı cesurca savaşmaya devam ediyor. Bu bölge üzerinde hak iddia edenlerle savaşa yol açsa bile devreye girip onları korumalıyız."
 AFG_support_soviets_in_asia:0 "Asya'daki Sovyetleri Destekle"
 AFG_support_soviets_in_asia_desc:0 "[SOU.GetNameDef] içindeki Orta Asya cumhuriyetleri, [SOU.Capital.GetCaptialVictoryPointName]'den uzaklıkları nedeniyle karşı-devrimci faaliyetlerin merkezi. Gericilerin ulusumuza sıçramasını önlemek için, [SOU.GetAdjective]ların bölgede düzeni sağlamasına destek olmalıyız."
 AFG_support_warzistan_independence:0 "Veziristan Bağımsızlığını Destekle"
 AFG_support_warzistan_independence_desc:0 "Hindistan'daki [ENG.GetAdjective]larla olan sınırlarımız, uluslarımız arasında sürekli bir gerilim kaynağı. Onları bölgeden çıkarma gücümüz olmasa da, Veziristan'daki bağımsızlık hareketi gibi hareketleri destekleyerek yönetimlerini baltalayabiliriz."
 AFG_the_amu_darya_plan:0 "Amu Derya Planı"
 AFG_the_amu_darya_plan_desc:0 "İmparator, [SOV.GetAdjective] yönetiminden kaçmak isteyen eski anavatanındakilerle planlar hazırladı ve temas kurdu. İlk olarak, kurtuluş seferimiz dikkatlice planlanmalı ve ancak ondan sonra [SOV.GetNameDef]'e saldırabiliriz."
 AFG_the_conquerors_of_persia:0 "İran Fatihleri"
 AFG_the_conquerors_of_persia_desc:0 "Muazzam zenginlik ve tarihin bir ülkesi olan [PER.GetNameDefCap], bir zamanlar imparatorluğa rakip olarak duruyordu. Onu yönetimimiz altına alarak, hakimiyetimizi yeniden teyit eder, hayati batı topraklarını güvence altına alır ve imparatorluğun imparatorluk ihtişamının gerçek mirasçısı olarak yerini sağlamlaştırırız."
 AFG_the_crown_and_the_world:0 "Taç ve Dünya"
 AFG_the_crown_and_the_world_desc:0 "İmparatorluğun kaderi, rakipsiz küresel süper güç olarak yükselmektir. Nüfuzumuzu genişleterek, gücümüzü artırarak ve hakimiyetimizi ortaya koyarak, modern dünyanın nihai hükümdarı olarak yerimizi güvence altına alacağız."
 AFG_the_echoes_of_panipat:0 "Panipat'ın Yankıları"
 AFG_the_echoes_of_panipat_desc:0 "Üçüncü Panipat Muharebesi, Hint alt kıtasındaki herkesin anılarında hala yankılanıyor. Orada, Marata kuvvetlerini darmadağın ettik ve kuzeybatı Hindistan üzerindeki hakimiyetimizi kurduk. Bunu tekrar yapmanın ve Marata Konfederasyonu'nun küstah varislerini devirmenin zamanı geldi!"
 AFG_the_faqirs_revolt:0 "Fakir'in İsyanı"
 AFG_the_faqirs_revolt_desc:0 "Nihayet zamanı geldi. Fakir'in birlikleri, Kabil'deki yozlaşmış yetkililere karşı çıkmak ve ulusumuzun bir zamanlar dayandığı İslami gelenekleri geri getirmek için doğuda ayaklanmaya hazır bekliyor. İnşallah, Afganistan'ı kurtaracağız!"
 AFG_timurid_bureaucracy:0 "Timurlu Bürokrasisi"
 AFG_timurid_bureaucracy_desc:0 "Timur'un mirasına kök salmış Timurlu Bürokrasisi, verimli bir yönetim ve merkezi kontrol modeli sunar. Bu sistemi yeniden canlandırmak, Emirliklerin idaresini güçlendirecek ve geniş topraklarında istikrar ve refah sağlayacaktır."
 AFG_topple_iran:0 "İran Şahını Devir"
 AFG_topple_iran_desc:0 "[ROOT.GetLeader]'ın vizyoner liderliği altında, uzun süredir [PER.GetLeader]'ın despotik yönetimi altında acı çeken [PER.GetAdjective] kardeşlerimize özgürlük ve adalet getirmeye hazırız. Sadece sınırlarımızı güvence altına almakla kalmayacak, aynı zamanda bölgedeki etkimizi genişleteceğiz."
 AFG_towards_an_amanullah_caliphate:0 "Bir Amanullah Hilafetine Doğru"
 AFG_towards_an_amanullah_caliphate_desc:0 "$AFG_amunullah_khan$ bir zamanlar Osmanlı İmparatorluğu'nun dağılmasının ardından Halife unvanını almayı düşündü, ancak daha modern bir rejim lehine vazgeçti. Bu sefer aynı hatayı yapmayacak ve İslam dünyasının lideri olarak yerini sağlamlaştıracak."
 AFG_truck_factory:0 "Cenagalak Kamyon Fabrikası"
 AFG_truck_factory_desc:0 "[SOU.GetAdjective] hamilerimizle ortaklık içinde, araç üretimi için ilk büyük ölçekli fabrikamızı geliştirme fırsatına sahibiz. Orada geliştirilen kamyonlar, sanayi ve ordudaki bu tür araçlara yönelik yerel talebi karşılayabilir."
 AFG_turanist_abitions:0 "Pan-Türk Hırsları"
 AFG_turanist_abitions_desc:0 "[ROOT.GetLeader] anavatanına dönme ve Özbek üzerindeki yönetimi yeniden kurma çabasıyla, sarayındaki pek çok irredantist, Orta Asya'daki egemenliğini meşrulaştırmanın yollarını arıyor. Rusya devini devirmek için bölgedeki Türk halklarının birleşerek Orta Asya Türk İmparatorluğu'nun kurulmasına karar verdi."
 AFG_turko_persian_empire:0 "Türk-Fars İmparatorluğu"
 AFG_turko_persian_empire_desc:0 "[TUR.GetAdjective] ve [PER.GetAdjective] topraklarının çoğu artık sıkı bir şekilde kontrolümüz altında olduğuna göre, büyük toplumumuzun güvenliği için egemenliğimizi yeni bir Türk-Fars İmparatorluğu olarak yeniden düzenleme zamanı geldi."
 AFG_ulugh_beg_academy:0 "Uluğ Bey Akademisi"
 AFG_ulugh_beg_academy_desc:0 "Uluğ Bey bir zamanlar kudretli Timurlu imparatorluğunu Sultan olarak yönetti, ama aynı zamanda astronomi ve matematik bilgimizi genişletmek için de zaman buldu. Onun adıyla yeni bir üniversite kurarak mirasını onurlandırmalıyız."
 AFG_unify_the_islamic_world:0 "İslam Dünyasını Birleştir"
 AFG_unify_the_islamic_world_desc:0 "Müslüman devletler çok uzun zamandır önemsiz meseleler yüzünden çekişip durdu ve işbirliği sorumluluklarından kaçtı. Nihayet dünya Müslüman devletlerine büyük bir ittifakta bir araya gelmeleri için bir davet uzatma zamanı geldi."
 AFG_unify_the_islamic_world_tt:0 "§Y[ROOT.GetNameDefCap] bizi ittifakına davet ediyor§! olayını alır"
 AFG_unite_pashtunistan:0 "Peştunistan'ı Birleştir"
 AFG_unite_pashtunistan_desc:0 "Fakir'in seferinin nihai hedefi her zaman Britanya Raci topraklarında bir Peştun devletinin bağımsızlığıydı. Ancak şimdi, söz konusu sınırların dışında bir Peştun devleti kurma ve kalan bölgeleri fethetme şansıyla karşı karşıya. Çok yaşa Peştunistan, çok yaşa Emir!"
 AFG_united_islamic_world_faction:0 "İttihad-ı İslam"
 AFG_utilize_cameleers:0 "Devecilerden Faydalan"
 AFG_utilize_cameleers_desc:0 "Devecilerimiz, Büyük Avustralya çölünün tehlikeli bölgelerinde seyahat ve ikmal için Britanya İmparatorluğu tarafından istihdam edilerek uzak diyarlara ihraç edildi. Bu yetenekli işçileri kendi topraklarımızdaki birliklerimize yardım etmek için kullanmalıyız."
 AFG_visit_foreign_capitals:0 "Yabancı Başkentleri Ziyaret Et"
 AFG_visit_foreign_capitals_desc:0 "Rejimimizin dünyadaki büyük güçlerle güçlü bağlantıları yok. Jeopolitik durum daha az istikrarlı hale geldikçe, fırsatlar ortaya çıkarsa bu güçlerle daha iyi ilişkiler kurmak en iyisi olabilir."
 AFG_work_with_ger_intel_bonus:0 "Partizan Bastırma Teknikleri"
 AFG_work_with_gestapo:0 "[GER.GetAdjective] İstihbaratıyla Çalış"
 AFG_work_with_gestapo_desc:0 "Yeni edindiğimiz topraklarda muhalefet ve huzursuzluk, otoritemize karşı önemli zorluklar oluşturmaya devam ediyor. Bunu ele almak için [GER.GetAdjective] istihbarat servisleriyle bir işbirliği kurduk. İsyan bastırma ve istihbarat operasyonları konusundaki uzmanlıkları, isyancı grupları tespit etmede ve etkisiz hale getirmede paha biçilmez olacaktır."
 AT_PEACE_WITH_SYRIA_OWNER_TT_NOT:0 "Suriye ile savaş halinde değil"
 GRE_byz_unified_flag:0 "Bizans"
 IRQ_a_new_caliph:0 "Yeni Halife"
 IRQ_a_new_caliph_desc:0 "Yıllarca süren mücadeleden sonra kendimizi İslam dünyasının önde gelen gücü olarak kabul ettirdik. Bu nedenle, Hüseyin bin Ali'nin mirasını sürdürme ve Haşimi hanedanı liderliğinde bir hilafeti yeniden kurma zamanı geldi."
 IRQ_a_new_islamic_golden_age:0 "Yeni İslami Altın Çağ"
 IRQ_a_new_islamic_golden_age_desc:0 "TODO"
 IRQ_abd_al_illah_fm_tt:0 "§YAbd Al-Ilah§! 3. seviye §YSaha Mareşali§! olarak kullanılabilir hale gelir!"
 IRQ_air_research_bonus:0 "Aerodinamik ve Aviyonik Araştırması"
 IRQ_air_research_bonus_desc:0 "Aviyonik alanı, dünya çapında çatışmalar ortaya çıktıkça hızla ilerliyor. Bölgede bir güç olma umudumuz varsa, mühendislerimizin hava kuvvetleri için son teknoloji geliştirebileceği bir tesis kurmalıyız."
 IRQ_al_muthanna_club:0 "El-Müsanna Kulüpleri"
 IRQ_al_muthanna_club_desc:0 "Bölgede pan-Arap rejimi kurma amacıyla ortaya çıkan kulüp ve grupların sayısında eksiklik yok. Bu organizasyonlara fon sağlayarak büyümelerini ve nüfusu bu amaca yönlendirmelerini sağlayacağız."
 IRQ_align_afghanistan_fasc:0 "Afganistan'ı Davet Et"
 IRQ_align_afghanistan_fasc_desc:0 "[AFG.GetNameDef] uzun süredir [SOU.GetAdjective]ler ve [ENG.GetAdjective]ler arasında bir tampon devlet olarak sıkışıp kaldı. Belki birlikte çalışarak onları bölgede daha uygun bir konuma yükseltebiliriz."
 IRQ_align_afghanistan_fasc_tt:0 "§Y[AFG.GetNameWithFlag]§! hizbimize davet edilecek"
 IRQ_allied_training:0 "Müttefik Eğitimi"
 IRQ_allied_training_desc:0 "Müttefiklerimiz, son yıllarda düşmanlarımızla çatışmada kazandıkları uzmanlıkların bir kısmını bize aktarmaya hazır. Birliklerimizi cephe görevine mümkün olduğunca hazırlamak için bu yardımı kabul edeceğiz."
 IRQ_anglo_iraqi_oil_expansion:0 "Anglo-Irak Petrol Genişlemesi"
 IRQ_anglo_iraqi_oil_expansion_desc:0 "Anglo-Irak Petrol Şirketi ile mevcut düzenlememiz halkımızı üzebilir, ancak onlar kısa görüşlüdür ve bunun ekonomimize sağladığı faydaları ve [ENG.GetAdjective]lerden aldığımız korumayı kavrayamazlar."
 IRQ_anti_western_alliance:0 "Batı Karşıtı İttifak"
 IRQ_anti_western_alliance_desc:0 "Bölgenin baskın güçleri askeri güçlerini birleştirir ve birbirlerini savunmaya söz verirlerse, sıklıkla işlerimize müdahale eden batılı güçlere karşı gerçekten durma şansımız olur."
 IRQ_anti_western_alliance_per_tt:0 "§Y[PER.GetNameWithFlag]§! hizbimize davet edilecek"
 IRQ_anti_western_alliance_tur_tt:0 "§Y[TUR.GetNameWithFlag]§! hizbimize davet edilecek"
 IRQ_approach_tribes_for_support:0 "Aşiretlerden Destek İste"
 IRQ_approach_tribes_for_support_desc:0 "Geleneksel aşiret yaşam tarzına bağlı birçok kırsal topluluk var ve devletimizin kuruluşundan bu yana bize büyük ölçüde düşman oldular. Belki de onları kazanmak için doğru teşvikleri henüz bulamadık."
 IRQ_arab_dominance:0 "Arap Hakimiyeti"
 IRQ_arab_dominance_desc:0 "[IRQ.GetNonIdeologyName] çeşitlilik gösteren bir ulustur, ancak sadece Arap çoğunluğun siyasi hakimiyetini pekiştirerek istikrarlı bir hükümet sürdürmeyi umabiliriz."
 IRQ_arab_free_legion:0 "Özgür Arap Lejyonu"
 IRQ_arab_free_legion_desc:0 "Dünyanın dört bir yanından Araplar, on yıllardır bizi geride tutan eski güçlere karşı savaşmak için gönüllü oldular. Belki de bunun üzerine inşa ederek sınırlarımızın ötesinden birlikler toplayabilir ve ortak düşmanlarımıza karşı ordumuzla birlikte savaşabiliriz."
 IRQ_arab_free_legion_tt:0 "Arap dünyasından bölümler toplamak için §Y$IRQ_arab_free_legion_cat$§! kararlarının kilidini aç."
 IRQ_arab_league:0 "Arap Ligi'ni Kur"
 IRQ_arab_league_desc:0 "Dış müdahalelerden Arap çıkarlarını korumak ve sınırlarımızın ötesindekileri işgalden kurtarmak amacıyla benzer düşünen Arap uluslarından oluşan bir ittifak kurmalıyız."
 IRQ_arab_league_economic_cooperation:0 "Arap Ligi Ekonomik Konseyi"
 IRQ_arab_league_economic_cooperation_desc:0 "Arap ulusları arasındaki kardeşliği güçlendirmek için ekonomik sektörde daha yakın çalışmaya çabalamalıyız."
 IRQ_arab_league_economic_cooperation_tt:0 "Bize §G85§! §Ydesteğinden§! yüksek olan her §YArap Devleti§! için bir off-map §YSivil Fabrika§! alacağız. Bu §Y[KUW.GetNameWithFlag]§!, §Y[JOR.GetNameWithFlag]§!, §Y[SYR.GetNameWithFlag]§!, §Y[PAL.GetNameWithFlag]§!, §Y[BHR.GetNameWithFlag]§!, §Y[SAU.GetNameWithFlag]§!, §Y[QAT.GetNameWithFlag]§!, §Y[UAE.GetNameWithFlag]§!, §Y[OMA.GetNameWithFlag]§!, §Y[IMO.GetNameWithFlag]§!, §Y[YEM.GetNameWithFlag]§!, §Y[FSA.GetNameWithFlag]§!, §Y[EGY.GetNameWithFlag]§!, §Y[SUD.GetNameWithFlag]§!, §Y[LBA.GetNameWithFlag]§!, §Y[ALG.GetNameWithFlag]§!, §Y[TUN.GetNameWithFlag]§!, §Y[MOR.GetNameWithFlag]§!, §Y[RIF.GetNameWithFlag]§!, §Y[WES.GetNameWithFlag]§!, §Y[MRT.GetNameWithFlag]§! ve §Y[LEB.GetNameWithFlag]§! için geçerlidir."
 IRQ_arab_republic_core_tt:0 "Sahip olduğumuz Arap devletlerinde çekirdek iddialar elde etmek için §Y$united_arab_republic_cat$§! kararlarının kilidini aç."
 IRQ_army_research_bonus:0 "Askeri Doktrinleri Modernleştir"
 IRQ_army_research_bonus_desc:0 "Birçok askeri subayımız ya eski Osmanlı İmparatorluğu'nun askerleri ya da [ENG.GetAdjective] kuvvetleri tarafından temel eğitim almış kişiler. Her iki durumda da, taktikleri eskidi ve derhal güncellenmeleri gerekiyor."
 IRQ_assasination_of_sidqi:0 "Bakr Sidqi Suikastı"
 IRQ_assasination_of_sidqi_desc:0 "[IRQ_assassination_of_sidqi_desc_key]"
 IRQ_assassination_of_sidqi_desc_leader:0 "Bakr Sidqi, önceki hükümetin devrilmesinden bu yana ulusu birleştirmeyi başaramadı. Siyasi elit arasında hoşnutsuzluk artıyor ve geniş Irak nüfusu, bir Kürdün ulusal meseleler üzerinde bu kadar etkisi olmasına güvenmiyor. Fırsat doğarsa, birinin hayatını sonlandırmaya çalışması neredeyse kaçınılmaz..."
 IRQ_assassination_of_sidqi_desc_not_leader:0 "Bakr Sidqi, hükümetimize karşı bir darbe planlıyor ve birçok subayımız, böyle bir durumda sadakatlerini sağlamak için hamleler yaptığını bildirdi. İktidarımızı korumak için onu ortadan kaldırmalıyız."
 IRQ_attempted_assasination_of_sidqi:0 "Sidqi'ye Suikast Girişimi"
 IRQ_attempted_assasination_of_sidqi_desc:0 "Nüfus ve siyasi elit arasındaki büyük hoşnutsuzluğa rağmen, Bakr Sidqi'ye yönelik son suikast girişimleri şimdiye kadar başarısız oldu. Ancak, yeni rejimi muhaliflerden korumak için güvenlik ve istihbaratı artırmamız gerekiyor gibi görünüyor."
 IRQ_axis_training:0 "Brandenburger Eğitim Misyonu"
 IRQ_axis_training_desc:0 "$IRQ_allied_training_desc$"
 IRQ_baghdad_colleges_of_engineering_and_education:0 "Bağdat Kolejlerini Genişlet"
 IRQ_baghdad_colleges_of_engineering_and_education_desc:0 "Bağdat yüzyıllardır bir öğrenim merkeziydi, ancak son yıllarda Batı üniversiteleri lehine ihmal edildi. Şehrimizi yeniden akademinin kalbi haline getirmek için eğitim kurumlarımıza yatırım yapmanın zamanı geldi."
 IRQ_bakr_sidqi_coup:0 "Bakr Sidqi'nin Darbesi"
 IRQ_bakr_sidqi_coup_desc:0 "Mevcut rejim zayıf ve yanlış yönlendirilmiş. Bakr Sidqi'nin liderliğinde bu rejimi devirerek [ROOT.GetNonIdeologyName] halkı için bağımsız bir gelecek sağlayacağız."
 IRQ_bakr_sidqi_tt:0 "§Y$IRQ_bakr_sidqi$ kaldırılamaz bir danışman olarak işe alınır.§!"
 IRQ_basra_military_port_focus:0 "Basra Askeri Limanının Devri"
 IRQ_basra_military_port_focus_desc:0 "Denizlere ve Basra Körfezi'ne olan yenilenmiş ilgimizle birlikte, Basra Askeri Limanı'nın yönetimimize devredilmesini ve milletimizi işgal eden emperyalist güçlerin bir parçası olarak kalmamasını sağlamalıyız."
 IRQ_bomber_training:0 "Bombardıman Eğitimi"
 IRQ_bomber_training_desc:0 "Hava kuvvetlerimiz, bombalama görevlerinde kullanılabilecek büyük uçaklarla deneyimsiz. Bu beceri eksikliği en kısa sürede kapatılmalıdır."
 IRQ_carve_up_syria:0 "Suriye'yi Paylaş"
 IRQ_carve_up_syria_desc:0 "Suriye haklı olarak krallığımıza dahil edilmeliydi ancak Fransızlar tarafından bizden çalındı. Dahası, [TUR.GetNonIdeologyName]'daki dostlarımız da bölgenin bazı kısımları üzerinde hak iddia ediyor. Belki de dünyanın dikkati dağılmışken ortak bir toprak talebinde bulunma zamanı gelmiştir."
 IRQ_cavalry_integration:0 "Süvari Entegrasyonu"
 IRQ_cavalry_integration_desc:0 "Motorizasyon gelecekte standart hale gelebilir, ancak ordumuzun şu an için sadece süvari şeklinde sağlayabileceğimiz desteğe ihtiyacı var."
 IRQ_commander_of_the_faithful:0 "Müminlerin Komutanı"
 IRQ_commander_of_the_faithful_desc:0 "Arap halklarını yönetimimiz altında birleştirme görevini üstlendiğimize göre, onları davamıza en iyi şekilde katmak akıllıca olacaktır. Abd Al-Ilah, bir zamanlar Hüseyin bin Ali al-Haşimi'nin taşıdığı 'Emir el-Müminin' unvanını alabilecek konumdadır."
 IRQ_construct_the_dukan_dam:0 "Dukan Barajı'nı İnşa Et"
 IRQ_construct_the_dukan_dam_desc:0 "Ülkemizin büyük nehirleri sadece sulama için değil, aynı zamanda elektrik üretimi için de kullanılmalıdır. Zab Nehri üzerinde hidroelektrik bir baraj kurarak yapay bir göl oluşturacağız."
 IRQ_construct_the_kut_barrage:0 "Kut Barajı'nı İnşa Et"
 IRQ_construct_the_kut_barrage_desc:0 "Dicle Nehri boyunca yeterli sulama suyu sağlamak istiyorsak, Kut Barajı'nın inşasındaki son aksaklıkları en kısa sürede aşmalıyız."
 IRQ_create_repair_yards:0 "Umm Qasr Derin Deniz Limanı'nı Kur"
 IRQ_create_repair_yards_desc:0 "Derin bir deniz limanı geliştirmek, mal ihracatı yeteneğimizi artırmanın yanı sıra askeri gemilerin demirlemesi ve ikmal yapması için tesisler sağlayabilir."
 IRQ_curtail_arabism:0 "Pan-Arapçılığı Kısıtla"
 IRQ_curtail_arabism_desc:0 "Halkımız arasındaki bu büyüyen pan-Arapçılık takıntısı, ulusumuzu oluşturan Arap olmayan toplulukları yabancılaştırıyor ve bizi büyük güçlerle çatışma rotasına sokuyor. Bu ideoloji bizi yok etmeden önce onu kısıtlamalıyız."
 IRQ_decouple_from_the_pound:0 "Sterlin'den Ayrıl"
 IRQ_decouple_from_the_pound_desc:0 "Para birimimiz hala İngiliz Sterlini'ne bağlı ve bu da ihtiyaçlarımıza uygun ekonomik politikalar uygulama kapasitemizi sınırlıyor. Bu bağı koparmalı ve dinarı kontrol etmek için kendi para kurulumuzu oluşturmalıyız."
 IRQ_demand_greater_stake_in_the_company:0 "Şirkette Daha Büyük Pay Talep Et"
 IRQ_demand_greater_stake_in_the_company_desc:0 "Petrol tesislerinin [ENG.GetAdjective]ler için mümkün olduğunca güvenilir şekilde çalışmasını sağlamak için çok şey yaptık. Bu nedenle, petrol arzının ürettiği zenginliğin daha büyük bir kısmını paylaşmaları adil olacaktır."
 IRQ_demand_palestine:0 "Filistin'i Talep Et"
 IRQ_demand_palestine_desc:0 "İngilizler, manda toprakları içindeki Filistin halkını koruma konusunda güvenilmez olduklarını kanıtladı. Dünyanın gözleri üzerlerindeyken, mandanın kontrolünü bize devretmelerini talep ederek onları zorlayabiliriz."
 IRQ_demand_syria_hashemite:0 "Suriye Birleşmesini Öner"
 IRQ_demand_syria_hashemite_desc:0 "Suriye, 1920'de kısa bir süreliğine I. Faysal'ın yönetimi altındaydı, ancak Fransızların ihanetiyle elimizden alındı. Artık güçlü bir pozisyonda müzakere edebilir ve haklı topraklarımızın iadesini talep edebiliriz."
 IRQ_develop_the_kuwaiti_port:0 "Kuveyt Limanı'nı Geliştir"
 IRQ_develop_the_kuwaiti_port_desc:0 "Kuveyt haklı kontrolümüz altına alındığında, kıyı şeridimiz önemli ölçüde arttı. Bu, Basra Körfezi'nde daha büyük bir varlığı desteklemek için deniz tesislerimizi daha da genişletme fırsatı sundu."
 IRQ_develop_the_kuwaiti_port_tt:0 "Her eyalete §G1§Y Deniz Üssü §!§! ekler."
 IRQ_discuss_a_new_treaty:0 "Yeni Bir Antlaşma Görüş"
 IRQ_discuss_a_new_treaty_desc:0 "Anglo-Irak antlaşması, genç ve zayıf bir ulusken müzakere edildi. Şimdi, İslam dünyasının önde gelen gücüyüz ve böyle bir antlaşma liderimize hakarettir. Bu nedenle [ENG.GetAdjective] ile yeni bir antlaşma müzakere etme zamanı gelmiştir."
 IRQ_effectivize_the_production_line:0 "Üretim Hatlarını Optimize Et"
 IRQ_effectivize_the_production_line_desc:0 "Gelecekte bağımsızlığımızı güvence altına almak için tek seferlik çabalar yeterli olmayacaktır. Bu nedenle, zamanla sürekli iyileşme sağlamak için önlemler almalıyız."
 IRQ_eliminate_the_golden_square:0 "Altın Kare'yi Ortadan Kaldır"
 IRQ_eliminate_the_golden_square_desc:0 "Altın Kare ve takipçileri, Arap dünyasını birleştirme arzuları nedeniyle bölgesel çatışma ve iç bölünme riskine sokuyorlar. Ulusumuzu yok etmeden önce onları ortadan kaldırmalıyız."
 IRQ_embargo_the_axis_powers:0 "Mihver'e Ambargo Uygula"
 IRQ_embargo_the_axis_powers_desc:0 "Mihver devletleri dünya barışı için bir tehdittir ve savaş yürütmek için gerekli tüm kaynaklardan mahrum bırakılmalıdır."
 IRQ_encourage_federalism:0 "Federalizmi Teşvik Et"
 IRQ_encourage_federalism_desc:0 "Kürtleri ve Asurluları bir miktar özerklikle baş başa bırakmaya ve ülkemiz genelinde yerel dilleri ve uygulamaları yasallaştırmaya çalışmalıyız, böylece tüm Irak vatandaşlarını tek bir bayrak altında birleştirebiliriz."
 IRQ_ensure_sunni_dominance:0 "Sünni Hakimiyetini Sağla"
 IRQ_ensure_sunni_dominance_desc:0 "Bir azınlık olmasına rağmen Sünni seçkinler, Haşimi Hanedanı ve Arap milliyetçileri tarafından desteklenerek uzun süredir milletimizi yönetiyor. Eğer bu partilerin iktidarda kalmasını istiyorsak, siyasetimiz üzerindeki Sünni hakimiyetinin devam etmesini sağlamalıyız."
 IRQ_establish_iraqi_coastal_defense_force:0 "[IRQ_establish_iraqi_coastal_defense_force_key]"
 IRQ_establish_iraqi_coastal_defense_force_IRQ:0 "Irak Sahil Savunma Kuvveti Kur"
 IRQ_establish_iraqi_coastal_defense_force_KUR:0 "Kürt Sahil Savunma Kuvveti Kur"
 IRQ_establish_iraqi_coastal_defense_force_desc:0 "Kıyı şeridimiz kısa olabilir, ancak dünyanın en kritik petrol ihracat rotalarından birinin üzerinde yer alıyor. Bu nedenle, bölgedeki çıkarlarımızı korumak için bir deniz kuvveti kurmalıyız."
 IRQ_expand_camel_corps:0 "[ROOT.GetAdjective] Polisini Entegre Et"
 IRQ_expand_camel_corps_desc:0 "[ENG.GetAdjective], son Büyük Savaş sırasında Kuzey ve Doğu Afrika genelinde onlardan oluşan bir kolordu kullanarak develi birliklerin çok yönlülüğünü gösterdi. Polisimizin devriyeleri için bu hayvanları kullanmaya zaten alışkın olmasıyla, onları orduya daha yakından entegre edebilir ve onlardan daha fazlasını öğrenebiliriz."
 IRQ_expand_habbaniya_airbase:0 "Habbaniya Hava Üssü'nü Genişlet"
 IRQ_expand_habbaniya_airbase_desc:0 "Habbaniya hava üssü, [ENG.GetAdjective]lerin kurmasından bu yana Irak'taki hava operasyonlarının merkezi haline geldi. Büyüyen hava kuvvetlerimizi daha iyi barındırmak için buradaki tesisleri genişletmeliyiz."
 IRQ_expand_membership:0 "Federasyon Üyeliğini Genişlet"
 IRQ_expand_membership_desc:0 "Bazıları federasyonumuz fikriyle alay ederken, diğerleri başarılarımıza hayranlıkla baktı. Belki de üyeliği, birlikte daha güçlü olduğumuzu fark edecek kadar akıllı olanlara genişletme zamanı gelmiştir."
 IRQ_expand_membership_tt:0 "Üyeleri kuklanız haline getirmek için davet etmek üzere §Y$hashemite_federation_cat$§! kararlarının kilidini aç."
 IRQ_expand_oil_production:0 "Petrol Üretimini Genişlet"
 IRQ_expand_oil_production_desc:0 "Jeologlar, ülkemiz genelinde keşfedilmemiş büyük petrol rezervleri olduğuna inanıyor. Bu kaynaklar halkımız için büyük miktarda servet üretebilir ve en kısa sürede kullanılmalıdır."
 IRQ_expand_the_cotton_industries:0 "Pamuk Sanayilerini Genişlet"
 IRQ_expand_the_cotton_industries_desc:0 "Ekonomimizin önemli bir parçası olarak, taleplerimiz artmaya devam ettikçe pamuk sektörümüze daha fazla odaklanmalıyız."
 IRQ_export_infrastructure:0 "İhracat Altyapısı"
 IRQ_export_infrastructure_desc:0 "Petrol, küresel ekonomi için hayati öneme sahiptir. İhracat altyapımıza yatırım yaparak [ROOT.GetNameDef]'ı haritaya koyabilir ve aynı zamanda finansal olarak fayda sağlayabiliriz."
 IRQ_extensive_irrigation_projects:0 "Kapsamlı Sulama Projeleri"
 IRQ_extensive_irrigation_projects_413_tt:0 "Eğer §Y[413.GetName]§!'ı kontrol ediyorsak, bu eyalette §G2§! ek inşaat yuvası kazanacağız"
 IRQ_extensive_irrigation_projects_680_tt:0 "Eğer §Y[680.GetName]§!'ı kontrol ediyorsak, bu eyalette §G1§! ek inşaat yuvası kazanacağız"
 IRQ_extensive_irrigation_projects_desc:0 "Topraklarımızın büyük kısmı kurak ve tarıma elverişsiz. Ancak büyük çaplı sulama projeleriyle bu alanları verimli tarlalara dönüştürebiliriz."
 IRQ_fighter_training:0 "Avcı Uçağı Eğitimi"
 IRQ_fighter_training_desc:0 "Tüm askeri ve ekonomik planlamamız, pilotlarımızın uçaklarını düşman bombardıman uçaklarından gökyüzümüzü korumak için yeterince kullanamazsa boşa gidecek. Bu nedenle, bu alanda eğitim şart."
 IRQ_finish_the_berlin_baghdad_railway:0 "Berlin-Bağdat Demiryolu'nu Tamamla"
 IRQ_finish_the_berlin_baghdad_railway_desc:0 "Eski Alman İmparatorluğu'nun Basra Körfezi'nde deniz varlığını desteklemek için Berlin'den Bağdat'a bir demiryolu kurma hayali vardı. Bu 'Taurus Ekspresi' hiç tamamlanamadı, ancak hattı kendimiz tamamlayarak ekonomik faydalarını elde edebiliriz."
 IRQ_fligerfuhrer_irak:0 "Irak Hava Kuvvetleri Komutanı"
 IRQ_fligerfuhrer_irak_desc:0 "Ordumuz [ENG.GetAdjective] karşısında umutsuzca yetersiz kalıyor, ancak müttefiklerimizden alacağımız uçak ve pilotlarla dengeleri lehimize çevirebiliriz."
 IRQ_forceful_industrialization:0 "Zorlu Sanayileşme"
 IRQ_forceful_industrialization_desc:0 "[ROOT.GetNameDef]'daki sanayileşme hızı, rakiplerimizin gerisinde kalmamak için çok yavaş. Halkı kızdırsa bile büyük çaplı bir sanayileşme programı düzenlemeliyiz."
 IRQ_form_opec:0 "OPEC'i Kur"
 IRQ_form_opec_desc:0 "Büyük güçler, fabrikalarına ve araçlarına akan petrole tamamen bağımlıdır. Dünyadaki petrol üreticisi ülkeler, petrol üretimi ve güvenliği konusunda birbirleriyle işbirliği yaparsa, nihayet büyük güçleri bize yaptıkları her şeyden sorumlu tutabiliriz."
 IRQ_form_the_independent_mechanized_brigade:0 "Bağımsız Mekanize Tugay Kur"
 IRQ_form_the_independent_mechanized_brigade_desc:0 "Uygun ekipmanın satın alınması ve yoğun eğitimle silahlı kuvvetlerimiz ilk mekanize birimlerini konuşlandırmaya hazır olduklarına inanıyor."
 IRQ_form_the_independent_mechanized_brigade_tt:0 "Al-Mechanikiyah §YMekanize§! tümen şablonu oluştur ve §Y1§! birim konuşlandır."
 IRQ_found_company_for_cement:0 "Genel Çimento Şirketini Kur"
 IRQ_found_company_for_cement_desc:0 "Milletimiz genelinde başlayacağımız inşaat projelerini geliştirmek için, modern tesisler için giderek daha önemli hale gelen çimento üretimi ve dağıtımı amacıyla eyalete ait bir girişim kurmalıyız."
 IRQ_found_southern_steel_plants:0 "Güney Çelik Fabrikaları Kur"
 IRQ_found_southern_steel_plants_desc:0 "Çelik, ekonomik kalkınma ve askeri ekipman üretimi için kritik öneme sahiptir. Şu ana kadar ihtiyaçlarımızı karşılayabilecek yerli üreticiler çıkmadı, bu yüzden ithalata bağımlıyız. Dünya daha düşmanca bir hal alırken bu durum sürdürülemez."
 IRQ_found_the_iraqi_state_railways:0 "[IRQ_found_the_iraqi_state_railways_key]"
 IRQ_found_the_iraqi_state_railways_IRQ:0 "Irak Devlet Demiryolları'nı Kur"
 IRQ_found_the_iraqi_state_railways_KUR:0 "Kürt Devlet Demiryolları'nı Kur"
 IRQ_found_the_iraqi_state_railways_desc:0 "[ENG.GetAdjective]ler sözde bağımsızlığımıza rağmen Mezopotamya Demiryolları şeklinde demiryolu altyapımızın kontrolünü elinde tutuyor. İşletmeyi satın alıp Irak Devlet Demiryolları olarak yeniden adlandırmayı teklif etmeliyiz."
 IRQ_found_the_state_company_for_iron_and_steel:0 "Demir ve Çelik Devlet Şirketi"
 IRQ_found_the_state_company_for_iron_and_steel_desc:0 "Çelik endüstrisine yapılan son yatırımlar ekonomimize fayda sağladı ve ithalat bağımlılığını azalttı. Ancak bu hayati hammaddelerin arzını kontrol etmek için kendi devlet kontrollü endüstrilerimizi kurarak daha da ileri gidebiliriz."
 IRQ_further_ussr_support:0 "Daha Fazla [SOV.GetAdjective] Desteği"
 IRQ_further_ussr_support_desc:0 "Özgürlüğe giden yolculuğumuzun başlarında başarı için [SOV.GetAdjective] yardımına güvendik. Başkalarına güvenmek başlangıçta hedeflediğimiz bir şey değildi, ancak bizi eşit ve yoldaş olarak görmeye ikna edebilirlerse, bu ilişki hala verimli olabilir."
 IRQ_greater_iraq:0 "Büyük Irak"
 IRQ_greater_iraq_desc:0 "Arap nüfusunun daha büyük bir kısmı artık yönetimimiz altında güvende olduğuna göre, [IRQ.GetNonIdeologyName]'ın daha geniş bir tanımını ilan ederek bu anı kutlamak uygun olacaktır."
 IRQ_greater_iraq_tt:0 "Sahip olduğumuz Orta Doğu eyaletlerinde çekirdek iddialar elde etmek için §Y$greater_iraq_decision_cat$§! kararlarının kilidini aç."
 IRQ_has_become_kurdistan_flag:0 "K*rdistan Oldu"
 IRQ_hashemite_arab_federation:0 "Haşimi Arap Federasyonu"
 IRQ_hashemite_arab_federation_desc:0 "Bölgede hakimiyet kuran Haşimi hanedanı üyelerimizle birlikte, krallıklarımızı daha büyük bir Haşimi Arap Federasyonu altında birleştirme fırsatına sahibiz."
 IRQ_heavy_industry_investments:0 "Ağır Sanayi Yatırımları"
 IRQ_heavy_industry_investments_desc:0 "Sanayi için hammadde tedarikinde ilerleme kaydediyoruz, ancak büyük güçlere yetişmek için daha fazla devlet kontrolündeki ağır sanayi kurmamız veya mevcutları sübvanse etmemiz gerektiği ortaya çıkıyor."
 IRQ_increase_anglo_iraqi_economic_ties:0 "Anglo-Irak Ekonomik İlişkilerini Geliştir"
 IRQ_increase_anglo_iraqi_economic_ties_desc:0 "[ENG.GetAdjective] ile geliştirdiğimiz yakın ekonomik bağlardan faydalanmamak aptallık olur."
 IRQ_increase_italian_business_relations:0 "[ITA.GetNonIdeologyName]'dan İthalat"
 IRQ_increase_italian_business_relations_desc:0 "Ekonomik ihtiyaçlarımız için [ENG.GetAdjective]'e tamamen bağımlı kalmamıza izin veremeyiz. Neyse ki [ITA.GetAdjective]lar bu çabamızda bize yardım etmekten çok mutlular."
 IRQ_increase_prime_ministers_powers:0 "Başbakanın Yetkilerini Güçlendir"
 IRQ_increase_prime_ministers_powers_desc:0 "Irak halkının Haşimi hanedanı altında mutlak bir yönetim istemediği kanıtlandı. Bu nedenle, anayasal yönetimi kesin olarak sağlama ve Irak'ı daha batılı bir yola sokma fırsatı doğdu."
 IRQ_independent_flight_schools:0 "Bağımsız Uçuş Okulları"
 IRQ_independent_flight_schools_desc:0 "Pilotlarımızın çoğu [ENG.GetAdjective]ler tarafından yurtdışında eğitildi, ancak artık pilotlarımızı yurtiçinde eğitmeye başlayabilecek kritik bir kütleye sahibiz."
 IRQ_infantry_focus:0 "Piyadeyi Güçlendir"
 IRQ_infantry_focus_desc:0 "Büyük güçler mekanize canavarlarıyla oynayabilir, gerçek şu ki her savaş nihayetinde piyade tarafından yapılacaktır. Bu nedenle, ordu eğitimlerini iyileştirmek için önemli bir bütçe artışı alacaktır."
 IRQ_invest_in_ordnance_mountain_howitzers:0 "Dağ Obüslerine Yatırım Yap"
 IRQ_invest_in_ordnance_mountain_howitzers_desc:0 "Ülkemiz kuzey ve doğuda dağlarla çevrili, ancak silahlı kuvvetlerimiz bu tür bölgelerde savaşmak için yeterli ateş gücünden yoksun. Komşularımızla böyle bir çatışma çıkarsa, onları desteklemek için özel dağ topçusuna yatırım yapmalıyız."
 IRQ_invite_foreign_advisors:0 "Yabancı Danışmanları Davet Et"
 IRQ_invite_foreign_advisors_desc:0 "Bölgedeki herhangi bir deniz gücüyle başa çıkacak uzmanlıktan yoksunuz. Ancak, deniz subaylarımızı eğitmek üzere yabancı uzmanları getirerek kuvvetlerimizin becerilerini artırabiliriz."
 IRQ_invite_foreign_arms_corporations:0 "Yabancı Şirketleri Davet Et"
 IRQ_invite_foreign_arms_corporations_desc:0 "Yerel bir silah endüstrisine duyulan ihtiyaç kritik olsa da, kendi ekipmanımızı geliştirme ve üretme konusunda uzmanlıktan yoksunuz. Bu nedenle, hem bize hem de onlara karşılıklı fayda sağlayacak fabrikalar kurmak için yabancı şirketlerle ortaklık yapmalıyız."
 IRQ_invite_oil_mission:0 "Petrol Misyonunu Davet Et"
 IRQ_invite_oil_mission_ctt:0 "§Y[GER.GetNameDef]§!'a §Y[676.GetName]§!'daki §YPetrol§! haklarını şunlar karşılığında teklif edeceğiz:"
 IRQ_invite_oil_mission_desc:0 "Kozumuz siyah altında yatıyor - ve yeni dostlarımızın alabildikleri kadar çok ihtiyacı var. Şimdi yapılacak küçük bir taviz, savaş lehimize gelişirse gelecekte çok daha büyük bir kazanca dönüşebilir."
 IRQ_iran_ultimatum:0 "Basının Arabistan Hakkındaki İddiaları"
 IRQ_iran_ultimatum_desc:0 "Önemli bir Arap nüfusu [PER.GetName]'in batı bölgelerinde yaşıyor. Belki de onları [PER.GetAdjective] yönetiminden korumak için ulusumuzla birleştirmeyi talep etme zamanı gelmiştir."
 IRQ_iran_ultimatum_tt:0 "§Y[PER.GetNameDef] toprak vermeyi reddederse, onlara savaş ilan etme seçeneğimiz olacak.§!"
 IRQ_iran_ultimatum_tt2:0 ""
 IRQ_iraqi_al_futuwwa:0 "Irak Al-Futuwwa'yı Kur"
 IRQ_iraqi_al_futuwwa_desc:0 "Ulusumuzun güçlü büyümesi için, halkımızı daha görkemli bir gelecek için savaşmaya eğiten gençlik örgütleri kurmalıyız!"
 IRQ_is_kurdistan:0 "§YK*rdistan olarak oynanıyor§!"
 IRQ_join_axis:0 "$TUR_join_the_axis$"
 IRQ_join_axis_desc:0 "$TUR_join_the_axis_desc$"
 IRQ_kurdish_attack_iran:0 "İran'daki Kürtleri Özgürleştir"
 IRQ_kurdish_attack_iran_desc:0 "[PER.GetAdjective] rejimi halkımız için bir tehdittir. Sadece sınırları içindeki Kürtlerin güç kullanılarak özgürleştirilmesi ve [PER.GetAdjective] ordusunun bizim ellerimizle yenilgiye uğratılmasıyla halkımız için bir gelecek güvence altına alabiliriz."
 IRQ_kurdish_attack_turkey:0 "Türkiye'deki Kürtleri Özgürleştir"
 IRQ_kurdish_attack_turkey_desc:0 "[TUR.GetAdjective]ler, sınırları içindeki Kürt halkına aktif olarak karşı çıkıyor ve onları miraslarından mahrum bırakıyor. Bu artık tolere edilemez, halkımızı güç kullanarak özgürleştirmek anlamına gelse bile."
 IRQ_kurdish_democratic:0 "K*rdistan Demokratik Partisi"
 IRQ_kurdish_democratic_desc:0 "Kürt hakları, [IRQ.GetNameDef]'in Arap çoğunluğu tarafından her gün çiğneniyor. Artık halkımız için özgür ve bağımsız bir ulus güvence altına almayı hedefleyen kendi siyasi hareketimizi kurma zamanıdır."
 IRQ_kurdish_form_the_peshmerga:0 "Peşmerge'yi Kur"
 IRQ_kurdish_form_the_peshmerga_desc:0 "İsyanımız Irak ordusunu ezmede başarılı olsa da, gelecekte bu kadar şanslı olmayabilir. Bu nedenle, potansiyel bir çatışmanın bile yaşanmasını engellemek için gerçek askeri eğitim ve modern ekipmana sahip bir ulusal ordu kuracağız."
 IRQ_kurdish_industry:0 "Endüstriyel Tabanı Genişlet"
 IRQ_kurdish_industry_desc:0 "Daha güçlü komşularımız tarafından yutulmamak için kendi endüstriyel tabanımızı geliştirmeliyiz."
 IRQ_kurdish_language:0 "Kürt Dili Okulları"
 IRQ_kurdish_language_desc:0 "Yeni kazandığımız bağımsızlığımızla birlikte, nihayet Kürt kültürü ve dili etrafında merkezlenen bir eğitim sistemi oluşturmaya başlayabiliriz."
 IRQ_kurdish_oil:0 "Kürt Petrolü"
 IRQ_kurdish_oil_desc:0 "Son yıllarda topraklarımız genelinde petrol yatakları keşfedildi, ancak ürettikleri zenginlik bölgeden uzaklaştırıldı. Artık nihayet kendi petrol endüstrimizi kurabilir ve zenginliği kendi halkımız için kullanabiliriz."
 IRQ_kurdish_outreach:0 "Kürtlerle Diyalog"
 IRQ_kurdish_outreach_desc:0 "Kuzey Irak'taki Kürtler, bize karşı birleşirlerse bölgedeki otoritemizi büyük ölçüde baltalama potansiyeline sahiptir. Bu nedenle, onlara bir miktar özerklik teklif etsek bile, onları daha geniş Irak ulusuna entegre etmek için çaba göstermeliyiz."
 IRQ_kurdish_reject_ankara_treaty:0 "Ankara Antlaşmasını Reddet"
 IRQ_kurdish_reject_ankara_treaty_desc:0 "Ankara Antlaşması, Kürt halkı için bir ulus kurma girişimlerini yok etti. Dünyaya bu antlaşmayla belirlenen sınırları reddettiğimizi ve Kürt halkı birleşene kadar durmayacağımızı açıkça belirtmeliyiz."
 IRQ_kurdish_revolt:0 "İsyan Başlat"
 IRQ_kurdish_revolt_desc:0 "[IRQ.GetNonIdeologyName]'dan bağımsızlığımızı ilan etme ve Kürt halkı için gerçekten özgür bir ulus yaratma zamanı geldi."
 IRQ_kurdish_revolt_tt:0 "§YIrak Devleti§!'nden bağımsızlık ilan edeceğiz, bu da onlara karşı bir §RBağımsızlık Savaşı§! başlatmamıza yol açacak."
 IRQ_kurdish_socialist:0 "Sovyet Yardımı Ara"
 IRQ_kurdish_socialist_desc:0 "[SOU.GetNameDefCap], Orta Doğu'nun batılı egemenliğini baltalamanın bir yolunu arzuluyor. Belki de [IRQ.GetAdjective] hükümetine ve dolayısıyla [ENG.GetAdjective]'e karşı mücadelemize yardım etmeye istekli olabilirler."
 IRQ_kurdish_support_resistance:0 "Yurtdışındaki Direnişi Destekle"
 IRQ_kurdish_support_resistance_desc:0 "Sınırlarımız içindeki halk gerçek özgürlüğün tadını çıkarırken, hala yabancı güçlerin yönetimi altında sıkışıp kalmış çok fazla kardeşimiz var. Özgür kalmak için giriştikleri çabaları desteklemeliyiz."
 IRQ_kurdish_united:0 "Birleşik K*rdistan"
 IRQ_kurdish_united_desc:0 "Büyük zorluklar ve mücadeleler sonucunda, nihayet Kürt halkını yönetimimiz altında birleştirdik. Artık ne gelirse gelsin, birleşik bir halk olarak ayakta duruyoruz."
 IRQ_kurdish_women_in_military:0 "Orduda Kadınlar"
 IRQ_kurdish_women_in_military_desc:0 "Kadınların çatışmadan uzak tutulması gerektiği yönündeki çağdışı görüş, komşularımıza karşı koyabilecek sağlam bir ordu geliştirmek istiyorsak ortadan kaldırılmalıdır."
 IRQ_liberate_levant:0 "Levant'ı Özgürleştir"
 IRQ_liberate_levant_desc:0 "Levant, Büyük Savaş'ın galipleri tarafından paylaşıldı ve bölge halkları için kan dökülmesinden ve sefaletten başka bir şey getirmedi. Akrabalarımız böyle bir kader çekerken artık kenarda bekleyemeyiz."
 IRQ_liberate_north_africa:0 "Kuzey Afrika'yı Özgürleştir"
 IRQ_liberate_north_africa_desc:0 "Kuzey Afrika, Avrupalı emperyalistlerin çizmesi altında çok uzun süredir eziliyor. Onları özgürleştirme ve tekrar birliğimize katma zamanı geldi."
 IRQ_local_arms_industry:0 "Yerel Silah Endüstrisi"
 IRQ_local_arms_industry_desc:0 "Savaş çıkarsa, yurtdışından askeri ekipman sevkiyatına güvenemeyiz. Bu nedenle, kriz zamanlarında kuvvetlerimizi desteklemek için hızla kendi yerel silah endüstrimizi kurmalıyız."
 IRQ_modernization:0 "Modernleşme İçin Çabala"
 IRQ_modernization_desc:0 "Eski moda ekipmanlarla sokaklarda geçit töreni yapmak belki kendi halkımızı kontrol altında tutmaya yeter, ancak yabancı bir gücün saldırganlığını caydırmak için pek bir şey yapmaz. Ekipmanlarımızı modernleştirmeli ve silahlı kuvvetlerimizi ciddi bir caydırıcı olarak konumlandırmalıyız."
 IRQ_nationalize_the_anglo_iraqi_oil_company:0 "Anglo-Irak Petrol Şirketi'ni Millileştir"
 IRQ_nationalize_the_anglo_iraqi_oil_company_desc:0 "Anglo-Irak Petrol Şirketi, zenginliğimizi [ENG.GetAdjective] Donanması'nın savaş gemilerine aktararak ekonomik ve dış işlerimize hâkim olmaya devam ediyor. Bu komediyi sonlandırma ve şirketi kendi halkımızın yararına millileştirme zamanı geldi."
 IRQ_naval_air_support:0 "Deniz Hava Desteği"
 IRQ_naval_air_support_desc:0 "Büyük güçlerle başa çıkabilecek bir donanma geliştirebileceğimize inanmak ahmaklık olur. Ancak deniz hedeflerini vurabilen uçakların geliştirilmesi, tek bir geminin maliyetinin çok altında oyun alanını eşitleyebilir."
 IRQ_navy_research_bonus:0 "Deniz Kuvvetleri Teknolojik Gelişmeleri"
 IRQ_navy_research_bonus_desc:0 "Şu ana kadar, satın almadan önce modası geçmiş olan yurtdışından elden düşme gemilere bağımlı kaldık. Geride kalmaktan kaçınmak için kendi deniz teknolojimizi araştırıp geliştirmeli ve filosumuzu yenilemeliyiz."
 IRQ_party_of_national_brotherhood:0 "Ulusal Kardeşlik Partisi"
 IRQ_party_of_national_brotherhood_desc:0 "Hükümet çok uzun süredir [ENG.GetAdjective] kaprislerine boyun eğdi. Sadece Ulusal Kardeşlik Partisi, [IRQ.GetNonIdeologyName]'ı büyüklüğe taşıma potansiyeline sahiptir."
 IRQ_proclaim_united_arab_republic:0 "Birleşik Arap Cumhuriyeti'ni İlan Et"
 IRQ_proclaim_united_arab_republic_desc:0 "Pan-Arap ulus hayallerimiz gerçekleşmeye başlıyor. Fırsatı değerlendirmeli ve bir Birleşik Arap Cumhuriyeti'nin kuruluşunu ilan ederek halkı davamıza çağırmalıyız."
 IRQ_project_babylon_focus:0 "Babil Projesi"
 IRQ_project_babylon_focus_desc:0 "Gelecekteki savaşları kazanmak için, sayıca ne kadar az olursak olalım düşmanlarımıza hükmedecek ağır silahlara ihtiyacımız var. Bu nedenle, deneysel silahları araştırıp geliştirmeye adanmış tesisler açmalıyız."
 IRQ_promote_kurdish_culture:0 "Kürt Kimliğini Destekle"
 IRQ_promote_kurdish_culture_desc:0 "Kürt halkı birden fazla ulusa dağılmış durumda, ancak kültürümüz nerede yaşarsak yaşayalım bizi bir arada tutuyor. Yönetenler tarafından parçalanmadan önce bu mirası desteklemeli ve korumalıyız."
 IRQ_protector_of_the_gulf:0 "Körfez'in Koruyucusu"
 IRQ_protector_of_the_gulf_desc:0 "Batılı güçlere güvenilir bir müttefik olduğumuzu kanıtladık. Belki de bundan böyle Basra Körfezi'nin güvenliğini sağlamamız karşılığında bölgeden çekilmeye razı olabilirler."
 IRQ_purchase_alternative_aricraft:0 "Alternatif Uçaklar Satın Al"
 IRQ_purchase_alternative_aricraft_desc:0 "Tek bir tedarikçiye aşırı bağımlılıktan kaçınmak için, [ENG.GetAdjective]lerin ötesine bakmalı ve gelişmekte olan silahlı kuvvetlerimiz için uçak tedarik etmeliyiz. Birçok subayımız [ITA.GetAdjective]lerle bir anlaşma yapılmasını savunuyor."
 IRQ_purchase_armored_equipment:0 "Zırhlı Ekipman Satın Al"
 IRQ_purchase_armored_equipment_desc:0 "Kuvvetlerimiz, geleneksel piyade güçlerine aşırı güvenmemiz nedeniyle düşmanlarımızın yumruğundan yoksun. Tank açıkça kara savaşının geleceğidir ve bize fazla modellerini satmaya istekli birini bulmalıyız."
 IRQ_purchase_british_aircraft:0 "İngiliz Uçakları Satın Al"
 IRQ_purchase_british_aircraft_AAT_tt:0 "§Y$IRQ_anglo_iraqi_treaty$ aktifken daha büyük bir ekipman sübvansiyonu alırız.§!"
 IRQ_purchase_british_aircraft_desc:0 "[ENG.GetAdjective] RAF ile olan bağlarımız nedeniyle, onlardan daha fazla uçak satın almak en mantıklısı gibi görünüyor."
 IRQ_purchase_british_aircraft_treaty_tt:0 "§Y$IRQ_anglo_iraqi_treaty$ aktifken daha fazla ekipman alırız.§!"
 IRQ_purchase_foreign_equipment:0 "Yabancı Makine Ekipmanları Satın Al"
 IRQ_purchase_foreign_equipment_desc:0 "Verimli topraklarımız ve sulama için bolca alanımız olsa da, sanayi güçlerinin mekanize araçlarından yoksunuz. Bu tür makineleri ithal edecek yatırım yaparsak, mahsul üretimimizi ve endüstriyel çıktımızı büyük ölçüde artırabiliriz."
 IRQ_purchase_mechanized_equipment:0 "Mekanize Ekipman Satın Al"
 IRQ_purchase_mechanized_equipment_desc:0 "Piyadenin yavaş ilerleyişi, yurtdışında mekanize piyadenin ortaya çıkmasıyla kuvvetlerimizin bariz bir zayıflığı haline geldi. Çok geç olmadan kendi kuvvetlerimizin mekanizasyonuna yatırım yapma zamanı geldi."
 IRQ_purchase_small_ships:0 "Küçük Gemiler Satın Al"
 IRQ_purchase_small_ships_desc:0 "$SMB_purchase_destroyers_and_subs_desc$"
 IRQ_put_down_tribal_revolts:0 "Aşiret İsyanlarını Bastır"
 IRQ_put_down_tribal_revolts_desc:0 "TODO"
 IRQ_raf_levies_focus:0 "RAF Lejyonları"
 IRQ_raf_levies_focus_desc:0 "[ENG.GetAdjective], hava üslerini korumak için topraklarımızda bir dizi lejyoner birlik bulunduruyor. Belki de bu birliklerle işbirliğini artırarak savunma yeteneklerimizi geliştirebiliriz."
 IRQ_rally_behind_the_hashemite_dynasty:0 "Haşimi Hanedanı'nın Yanında Yer Al"
 IRQ_rally_behind_the_hashemite_dynasty_desc:0 "Haşimi ailesi, Irak ulusal kimliğini inşa etmeye devam ettiğimiz odak noktası olmalıdır. Yıllar süren iktidardan sonra, onu gerçekten güvence altına almak üzereyiz."
 IRQ_rally_the_arab_world:0 "Arap Dünyasını Toparla"
 IRQ_rally_the_arab_world_desc:0 "Arap dünyası, batılı güçlerin prangalarından kurtulmayı arzuluyor. Birlikte Arap halklarını birleştirecek ve kendi kaderimizin efendileri olarak kendimizi yeniden kuracağız."
 IRQ_reach_out_to_jordan:0 "Ürdün'e Uzan"
 IRQ_reach_out_to_jordan_desc:0 "Akrabalarımız [ENG.GetAdjective] koruması altında Ürdün'ü yönetmeye devam ediyor. Ancak, onları ve [ENG.GetAdjective]leri, savunmalarını devralmamız karşılığında daha büyük siyasi ve ekonomik bütünleşme geliştirmeye ikna edebiliriz."
 IRQ_reapproachment_with_the_tribes:0 "Aşiretlerle Yeniden Yakınlaşma"
 IRQ_reapproachment_with_the_tribes_desc:0 "Hala hükümetimize tam olarak güvenmeyen birçok aşiret lideri var. Onları yatıştırmalı ve yerel bölgelerine yatırım yapmalıyız, böylece sadakatleri sadece bize ait olur."
 IRQ_reapproachment_with_the_tribes_tt:0 "§YAhmed Barzani§! ve §YMustafa Barzani§! 3. seviye §YGeneraller§! olarak kullanılabilir hale gelir!"
 IRQ_refuge_for_the_grand_mufti:0 "Büyük Müftü'ye Sığınma Hakkı Tanı"
 IRQ_refuge_for_the_grand_mufti_desc:0 "Filistin'deki son çalkantıların ardından, tartışmalı Kudüs Büyük Müftüsü Emin el-Hüseyni İngilizler tarafından sürgün edildi. Kendi sınırlarımız içindeki İngiliz karşıtı duyguları yatıştırmak için belki ona geçici olarak sığınma hakkı verebiliriz."
 IRQ_regime_change_in_arabia:0 "Arabistan'da Rejim Değişikliği"
 IRQ_regime_change_in_arabia_desc:0 "Suud hanedanı, büyük güçlere karşı potansiyel bir müttefik olarak güvenilmez. Bu nedenle, bir tehdit haline gelmeden önce ortadan kaldırılmalıdır."
 IRQ_regional_economic_integration:0 "Bölgesel Ekonomik Entegrasyon"
 IRQ_regional_economic_integration_desc:0 "Bölgenin altyapısına büyük bir yatırım yapmalıyız ki hepimiz uzun vadeli ekonomik büyümeden faydalanabilelim."
 IRQ_regional_military_integration:0 "Bölgesel Askeri Entegrasyon"
 IRQ_regional_military_integration_desc:0 "Büyük güçlerin askeri üretim kapasitelerinden yoksunuz, ancak bölgesel bir yatırımla yetişmeye başlayabiliriz."
 IRQ_regional_military_integration_tt:0 "Bu odağı Ürdün denetimimiz altındayken veya Ürdün'ü kontrol ederken tamamlamak, Ürdün'de iki ek askeri fabrika ekleyecektir."
 IRQ_religious_resistance:0 "Dini Direniş"
 IRQ_religious_resistance_desc:0 "Büyük Müftü'nün korumamız altında olmasıyla, bize dayatılan baskıcı Batı rejimlerine karşı Arap dünyasında direnişi kışkırtmak için onunla çalışabiliriz."
 IRQ_renegotiate_treaty:0 "Anglo-Irak Antlaşmasını Yeniden Müzakere Et"
 IRQ_renegotiate_treaty_desc:0 "Bölgedeki [ENG.GetAdjective] çıkarları için bir tehdit olmadığımızı ve ihtiyaç duyulduğunda onların potansiyel müttefiki olabileceğimizi kanıtladık. Bu nedenle, Anglo-Irak antlaşmasını nihayet eşit şartlarda yeniden müzakere etmeliyiz."
 IRQ_request_syria_from_vichy:0 "Suriye'yi Talep Et"
 IRQ_request_syria_from_vichy_desc:0 "Fransızlar hiç bu kadar bölünmemiş ve zayıf olmamıştı. Suriye topraklarının kontrolümüze geçmesini talep etmek için mükemmel bir fırsat bu."
 IRQ_restoration_of_hejaz:0 "Hicaz'ın Restorasyonu"
 IRQ_restoration_of_hejaz_desc:0 "[SAU.GetAdjective]ler, çok değil, Hicaz Krallığı'nı yok ettiler. Ve onunla birlikte Haşimi hanedanının etkisini kısıtladılar. Onlara aynı şekilde karşılık verme zamanı geldi."
 IRQ_restore_al_andalus:0 "Endülüs'ü Yeniden Kur"
 IRQ_restore_al_andalus_desc:0 "İspanyollar kendilerini İberya'nın efendileri sanıyor olabilirler, ancak ulusları kurulmadan çok önce burası Endülüs'tü. Onu İslam dünyasına geri döndürmek, Avrupalıların asla unutamayacağı bir yenilgi olacak."
 IRQ_restore_regent:0 "Naibi Restore Et"
 IRQ_restore_regent_desc:0 "Rashid Ali al-Gaylani ve Altın Kare'nin aptalca fırsatçılığı, ulusumuz için yıkımdan başka bir şey getirmedi. Onları ortadan kaldırarak ve eski hükümeti iktidara getirerek zehirli etkilerinden bir an önce kurtulmalıyız."
 IRQ_revoke_anglo_iraq_treaty:0 "Anglo-Irak Antlaşmasını Feshet"
 IRQ_revoke_anglo_iraq_treaty_desc:0 "Tek taraflı Anglo-Irak antlaşması, ulusumuzun gelişimini yeterince engelledi. Ancak şimdi, [ENG.GetAdjective]'e direnecek irade gücüne sahibiz ve sonunda antlaşmayı feshedeceğiz. Sonuçları ne olursa olsun."
 IRQ_revoke_anglo_iraq_treaty_tt:0 "§R[ENG.GetNameDefCap] antlaşmayı feshettiğimiz için bize savaş ilan edebilir!§!"
 IRQ_royal_iraqi_army:0 "[IRQ_royal_iraqi_army_key]"
 IRQ_royal_iraqi_army_IRQ:0 "Kraliyet Irak Ordusu"
 IRQ_royal_iraqi_army_KUR:0 "Kürt Ordusu"
 IRQ_royal_iraqi_army_desc:0 "Komşularımızdan veya daha uzaklardan gelen savaş tehdidi giderek daha olası hale geliyor. Ayrıca, ulusumuzu parçalamaya hazır birçok yerel grup var. Hepsinin kontrol altında tutabileceği tek şey silahlı kuvvetlerimizin gücüdür."
 IRQ_rural_electrification:0 "Kırsal Elektrifikasyon"
 IRQ_rural_electrification_desc:0 "Kentlerde elektrikleşme istikrarlı şekilde ilerlerken, kırsal nüfus bu gelişmelerden mahrum. Bu nedenle ülke genelinde elektrik altyapısını eşit şekilde yaymak için ulusal bir elektrik kurulu oluşturmalıyız."
 IRQ_scavenging:0 "Ganimet Toplama Taktiklerini Kullan"
 IRQ_scavenging_desc:0 "Kendimiz üretemediğimiz ekipmanlar genellikle yabancı saldırganların elinde ortaya çıkıyor. Bu nedenle, kuvvetlerimizi değerli askeri ekipmanı tanıyıp ele geçirmek üzere eğitmeliyiz."
 IRQ_seek_axis_investment:0 "Mihver Yatırımı Ara"
 IRQ_seek_axis_investment_desc:0 "Ekonomimiz durgun ve yabancı saldırganlığa karşı direnç oluşturmak için çeşitlendirilmeye ihtiyaç duyuyor. Belki deniz aşırı dostlarımız, ilişkimizi derinleştirmek için buraya yatırım yapmaya istekli olabilirler."
 IRQ_special_forces:0 "Özel Kuvvetler"
 IRQ_special_forces_desc:0 "Bazı savaş durumlarında, düşman hatlarının arkasına sızan bir avuç uzman asker, açık arazide tüm bir ordunun başarısız olacağı yıkıcı bir darbe vurabilir. Potansiyel bir çatışmanın başlamasını bile engellemek için böyle kuvvetlere ihtiyacımız var."
 IRQ_special_projects:0 "Tuwaytha Nükleer Araştırma Merkezi"
 IRQ_special_projects_desc:0 "Yurtdışından gelen atom sırları hakkındaki söylentiler, yeteneklerini göstermek isteyen bilim insanlarımıza ve mühendislerimize ulaştı. Uzmanlıkları ve yeterli fonla, hayal edilemez güçte silahlar geliştirebiliriz."
 IRQ_status_of_lebanon:0 "Lübnan'ın Statüsü"
 IRQ_status_of_lebanon_desc:0 "Suriye kesin olarak kontrolümüz altına alındığında, dikkatler Lübnan'ın geleceğine çevrildi. Belki bir kez daha şansımızı deneyebilir ve onun da kontrolümüze devredilmesini talep edebiliriz."
 IRQ_strengthen_mesopotamian_farming:0 "Mezopotamya Tarımını Güçlendir"
 IRQ_strengthen_mesopotamian_farming_desc:0 "[ROOT.GetNonIdeologyName] de pek çok öncülü gibi Dicle ve Fırat'ın iki büyük nehrine dayanıyor. Bu nehirler arasındaki toprak tarım için idealdir, ancak mahsul verimini artırmak için modern teknikler kullanabiliriz."
 IRQ_strengthen_relations_with_iran:0 "İran ile İlişkileri Güçlendir"
 IRQ_strengthen_relations_with_iran_desc:0 "[IRQ.GetAdjective] ve [PER.GetAdjective] halkları her zaman anlaşamasa da, uluslarımızın modernizasyonu ve bölgenin batılı egemenliğine direnme konusunda ortak bir gündemimiz var. Şimdi birbirimizle yapıcı bir ilişki kurma zamanıdır, böylece hedeflerimize birlikte ulaşabiliriz."
 IRQ_strengthen_relations_with_turkey:0 "Türkiye ile İlişkileri Güçlendir"
 IRQ_strengthen_relations_with_turkey_desc:0 "[TUR.GetAdjective]ler, sonunda imparatorluklarına mal olsa bile, batılı güçlere karşı durmada ön saflarda yer aldılar. Bu nedenle, doğal müttefikleriz ve onlarla daha iyi ilişkiler kurmak için daha fazlasını yapmalıyız."
 IRQ_strengthen_the_golden_square:0 "Altın Kare'yi Güçlendir"
 IRQ_strengthen_the_golden_square_desc:0 "Dört üst düzey askeri subaydan oluşan Altın Kare, pan-Arapçılık ve [ENG.GetAdjective] karşıtı duyguların odak noktası haline geldi. Belki de onları tamamen hükümete dahil etme ve ulusu güçlendirmek için gerekli reformları başlatma zamanı gelmiştir."
 IRQ_strengthen_the_iraqi_dinar:0 "[IRQ_strengthen_the_iraqi_dinar_key]"
 IRQ_strengthen_the_iraqi_dinar_IRQ:0 "Irak Dinarı'nı Güçlendir"
 IRQ_strengthen_the_iraqi_dinar_KUR:0 "Kürt Dinarı'nı Güçlendir"
 IRQ_strengthen_the_iraqi_dinar_desc:0 "Artık para birimimizin kontrolünü [ENG.GetAdjective]lerden aldığımıza göre, nihayet kendi ekonomimizi destekleyecek şekilde para politikamızı belirleyebiliriz."
 IRQ_support_from_skies_above:0 "Yukarıdaki Gökyüzünden Destek"
 IRQ_support_from_skies_above_desc:0 "Çevremizdeki ortam göz önüne alındığında, sadece piyade ve karadan hareket eden birliklere güvenmek akıllıca olmaz. Bir hava kuvveti kurma çabası muhtemelen büyük bir maliyetle gelecek olsa da, atmamız gereken bir adımdır."
 IRQ_support_from_skies_above_tt:0 "§Y[SOV.GetNameWithFlag]§! ile aynı hizipte olmak ve onların §YYakın Hava Desteği§! uçaklarına sahip olması, §Y[ROOT.GetNameWithFlag]§!'e §Y50 Yakın Hava Desteği§! uçağı sağlayacaktır."
 IRQ_support_from_the_mountains:0 "Dağ Uzmanlığı"
 IRQ_support_from_the_mountains_desc:0 "Etrafımızda birkaç sert dağ sırası varken, bu bölgelerde savaşmak için özel olarak tasarlanmış eğitim ve ekipman büyük fayda sağlayacaktır. İlk maliyet caydırıcı olmayabilir."
 IRQ_support_the_allied_war_effort:0 "Müttefik Savaş Çabasını Destekle"
 IRQ_support_the_allied_war_effort_desc:0 "Halkımız bunu kabul etmeye istekli olsun ya da olmasın, geleceğimiz dünyadaki Müttefik uluslarla birlikte. Onların davasına bağlılığımızı göstermeli ve yeni dünya düzeninde kendimize bir pozisyon yaratmalıyız."
 IRQ_suppress_tribal_revolts:0 "Kabile İsyanlarını Bastır"
 IRQ_suppress_tribal_revolts_desc:0 "Milletimize birlik getirmek ve komşularımızla karşı karşıya geldiğimizde içeriden parçalanmamamızı sağlamak için, milletimizin ruhundaki çatlakların onarılabilmesi adına kabile isyanlarını bastırmalı ve işbirliği yapmaya istekli olanlar için yoksulluğun azaltılmasını sağlamalıyız."
 IRQ_take_advantage_of_british_weakness:0 "Durumdan Yararlan"
 IRQ_take_advantage_of_british_weakness_desc:0 "[ENG.GetAdjective]'ı bölgemizden çıkarmak istiyorsak, dünya çapındaki çatışmalarla dikkatlerinin dağıldığı şu an gibi iyi bir fırsat asla bulamayabiliriz. Onları asla toparlayamayacakları bir darbe indirelim."
 IRQ_training:0 "Al-Wash Hafif Silahlar Okulu"
 IRQ_training_desc:0 "[IRQ.GetNonIdeologyName]'daki asker eğitimi eski moda ve diğer ülkelerinkini yansıtan reformlarla iyileştirilebilir. Bu nedenle askerlerimizi Al-Wash Hafif Silahlar Okulu'nda hafif silahlar ve piyade taktikleri konusunda eğitmeliyiz."
 IRQ_unite_maghreb:0 "Mağrip'i Birleştir"
 IRQ_unite_maghreb_desc:0 "Mağrip, çok uzun süredir batılı yönetim altında acı çeken İslam dünyasının ayrılmaz bir parçasıdır. Yeni bulduğumuz gücümüzle onu yönetimimiz altında birleştirecek ve emperyalistleri bir kez ve sonsuza kadar kovacağız."
 IRQ_unite_maghreb_tt:0 "Bu odağın size çekirdek iddia verdiği her eyaleti işgal eden ülkelere karşı §YÇekirdek eyaleti geri al§! savaş hedefi kazanırsınız"
 IRQ_unite_mashriq:0 "Maşrık'ı Birleştir"
 IRQ_unite_mashriq_desc:0 "Maşrık, İslam dünyasının kalp atışıdır. Hepsi Halife'nin kontrolüne geçene kadar dinlenemeyiz."
 MUGHAL_divisions_spawned:0 "§Y4§! tam teçhizatlı sadık tümen, ayaklanma başlattığımızda bize katılacak."
 PER_a_modern_iran:0 "Modern Bir İran"
 PER_a_modern_iran_desc:0 "Tüm bu modernleşme çabalarından sonra, nihayet diğer milletler arasında gururlu ve güçlü durduğumuz söylenebilir."
 PER_abolish_feudalism:0 "Feodalizmi Kaldır"
 PER_abolish_feudalism_desc:0 "Uzun yıllardır [ROOT.GetNonIdeologyName] feodal bir sistem altında işliyor, kırsal bölgelerdeki birçok köylünün çalıştığı topraklara toprak sahipleri sahip. Bu çağdışı bir sistem ve hükümet olarak bu toprakları sahiplerinden satın alıp çok daha ucuza köylülere geri satma görevimiz var. Bu, nüfusumuzun önemli bir kısmına özgürlük getirecek."
 PER_absolute_monarchy:0 "Mutlak Monarşi"
 PER_absolute_monarchy_desc:0 "Rıza Şah Pehlevi'nin iktidarını kökünden sökmeye çalışan muhalifleri bastırmasının ardından, şimdi mutlak monarşi ilan etmiş, taç için daha fazla güç alarak ve hiç kimsenin soyunu tehdit edememesini sağlamıştır. Bu süreç, dış işlerde daha militarist bir yaklaşım benimsemeyi ve [PER.GetNameDef]'ın daimi ordusunu genişletmeyi içerir."
 PER_absorb_byzantines:0 "Bizans İmparatorluğu'nu Em"
 PER_absorb_byzantines_desc:0 "Yüzyıllardır süren [GRE.GetAdjective]lara karşı olan kinimizi sonunda [GRE.GetNameDef]’i yenerek sona erdirdik. Bu topraklar artık imparatorluğumuzun resmi bir parçası olarak katılabilir."
 PER_absorb_byzantines_tt:0 "Fethedilen toprakları ulusumuza entegre etmemizi sağlayan §YBizans'ı Em§! kararlarının kilidini açar."
 PER_acceptance_ger_tt:0 "§Y[GER.GetNameDefCap]§! bize §Gyüksek fikre§! sahipse teklifimizi kabul etmeye daha yatkın olacaktır!"
 PER_acceptance_tt:0 "§Y[SOU.GetNameDefCap]§! bize §Gyüksek fikre§! sahipse teklifimizi kabul etmeye daha yatkın olacaktır!"
 PER_add_organizer_trait_tt:0 "§Yİki§! rastgele seçilmiş ordu lideri Organizatör özelliği kazanacak."
 PER_add_panzer_leader_trait_tt:0 "§Yİki§! rastgele seçilmiş ordu lideri Panzer Lideri özelliği kazanacak."
 PER_address_the_issue_tt:0 "Devrimcileri bastırmak için §R90 gün§! süre veren §Yİslam Devrimi Kararları§!'nın kilidini açar."
 PER_addressing_the_issue_flag:0 "Sorunu Ele Alıyor"
 PER_adult_literacy:0 "Yetişkin Okuryazarlık Kampanyası"
 PER_adult_literacy_desc:0 "Okuma yazma bilmemek nüfusumuzu etkileyen büyük bir sorun. Kendi dillerinde yazıp okuyabilme becerisi halkımızı güçlendirecek ve özgürleştirecek. Bakanlar Kurulu ve Eğitim Bakanlığı bir eğitim kılavuzu yayınlamak ve yetişkin nüfusumuza eğitim verecek bir okul kurmak için bir araya geldi."
 PER_air_shortcut:0 "Hava Kuvvetleri"
 PER_air_superiority:0 "Hava Hakimiyeti"
 PER_air_superiority_desc:0 "Hava kuvvetlerimizin en önemli kullanımı, gökyüzünün kontrolünü ele geçirmek için kullanmaktır. Eğer hava hakimiyetine sahipsek, o zaman kesintiye uğrama korkusu olmadan daha tehlikeli operasyonlar gerçekleştirebiliriz."
 PER_align_with_axis:0 "[PER.GetNameDef]'ı Mihver'e Hizala"
 PER_align_with_axis_desc:0 "Avrupa'da savaş devam ederken, [GER.GetAdjective] dostlarımız savaş çabalarına yardımcı olacak müttefiklere ihtiyaç duyuyor. Artık kendi şapkamızı yüzüğe atmanın ve Mihver'in yanında savaşa katılmanın zamanı geldi."
 PER_ally_bazaari:0 "Bazari ile İttifak Kur"
 PER_ally_bazaari_desc:0 "Çarşılar ve onları işleten tüccarlar yüzyıllardır topluluklarımızın temel taşları olmuştur. Şimdi, sanayi güçlerinin çok uluslu şirketlerinden gelen artan baskıyla karşı karşıyalar. Eğer tüccarları koruyacak politikalar uygularsak, büyük olasılıkla muhafazakar davamıza destek vereceklerdir."
 PER_ally_the_bazaari:0 "Elitleri Yönlendir"
 PER_ally_the_bazaari_desc:0 "[PER.GetAdjective] elitler arasında ulusun gidişatı konusunda giderek artan bir huzursuzluk var. Birçoğu işletmelerinin veya varlıklarının geleceği konusunda endişeli ve politik sarsıntılardan korunma garantisi karşılığında davamıza destek vermeye hazır olabilirler."
 PER_anti_air_development:0 "Hava Saldırısı Savunma Gelişimini Fonla"
 PER_anti_air_development_desc:0 "Şehirlerimizdeki fabrikalar, ekonomik ve endüstriyel ilerlemelerimizi bozmak isteyen düşman bombardıman uçaklarının hedefi haline geldi. Hava saldırısı önlemlerimizi geliştirmek için kaynakları yönlendirmeliyiz."
 PER_anti_air_research:0 "Uçaksavar Araştırma Girişimi"
 PER_anti_air_research_boost:0 "Uçaksavar Araştırması"
 PER_anti_air_research_desc:0 "Mevcut uçaksavar silahlarımız eskimeye başlıyor. Ulusumuzu gökyüzündeki tehlikelerden korumaya yardımcı olacak yeni teknoloji araştırmak için daha fazla çaba göstermeliyiz."
 PER_anti_soviet_resistance_network:0 "Anti-[SOU.GetAdjective] Direniş Ağı"
 PER_anti_soviet_resistance_network_desc:0 "İstedikleri gibi süsleyebilirler, ancak gerçek şu ki [SOU.GetNameDef] sadece bir başka Rus İmparatorluğu'dur ve birçok İrani halk onların despotik boyunduruğu altında kalmaya devam ediyor. Otoritelerini baltalamak ve halkımızın kurtuluşunu teşvik etmek için daha fazlasını yapmalıyız."
 PER_appease_the_seperatists:0 "Ayrılıkçıları Yatıştır"
 PER_appease_the_seperatists_desc:0 "Azerbaycan ve Kürt nüfusuna kendi işlerinde daha fazla özerklik vererek onlara karşı olan yükümlülüklerimizi yerine getirme zamanı geldi. Ancak, kolektif güvenliğimiz çıkarına onları etki alanımızda tutmak için çaba göstermeliyiz."
 PER_appease_the_seperatists_tt:0 "§GBize karşı bir bağımsızlık savaşı çıkma riski artık olmayacak.§!"
 PER_army_shortcut:0 "Ordu"
 PER_artillery_bonus:0 "Yerli Topçu Üretimi"
 PER_assassinate_reza_shah:0 "Rıza Şah'ın Suikastı"
 PER_assassinate_reza_shah_desc:0 "Rıza Şah Pehlevi [PER.GetNameDef]'a büyük değişiklikler getirmiş olabilir, ancak bunların hepsi halk tarafından popüler değildir. Yıllardır suikast planlarına dair söylentiler vardır, ancak kimse aslında ateş etmeyecek... değil mi?"
 PER_assessing_the_opposition:0 "Muhalefeti Değerlendir"
 PER_assessing_the_opposition_desc:0 "İran'ın ötesinde sınırlarımızı genişletmeyi düşünmeden önce, önce içeriye bakmalıyız. Birkaç muhalefet partisi zaman geçtikçe hükümetimizden giderek daha fazla memnuniyetsiz görünüyor. Eğer bir imparatorluk yeniden inşa etmek için halkın desteğini toplayacaksak, o zaman her türlü yolla hükümette tam destek aldığımızdan emin olmalıyız."
 PER_assessing_the_opposition_tt:0 "§YA Legacy of Greatness§! misyonundaki §YCivil Unrest§! bölümünde §YGovernment Clampdown§! kararlarını açar ve tehdidi yönetmemize ve bir iç savaşı önlememize olanak tanır."
 PER_azadi:0 "Azadi (Özgürlük)"
 PER_azadi_autonomy_effect:0 "Azadi Ruhu"
 PER_azadi_desc:0 "Azadi, Farsça'da 'Özgürlük' demektir ve işgalcilere karşı durmaya hazırlanırken etrafında toplanacağımız ifade olacaktır. [ROOT.OVERLORD.GetNameDefCap] uyumlu olmamızı bekliyor, ancak her zaman egemenliğimizi koruma niyetindeydik. Savaşı kaybetmiş olabiliriz, ama yine de bir savaş vereceğiz."
 PER_bakhtiari_boost:0 "Bahtiyari Eğitimi"
 PER_battlefield_support:0 "Muharebe Desteği"
 PER_battlefield_support_desc:0 "Birliklerimizin cephe hattına doğru yürürken güvenliğini sağlamak için, düşman uçaklarının ordumuza ateş yağdırmasını önlemek amacıyla yer desteği uçaklarımızı kullanmak çok önemlidir."
 PER_bolster_civilian_industry:0 "Sivil Sanayimizi Güçlendir"
 PER_bolster_civilian_industry_desc:0 "Yaklaşan fırtınayı atlatacaksak, sivil sanayimizi güçlendirmeye özen göstermeliyiz. Buna ne kadar çok kaynak yatırırsak, ekonomimizin gelecek savaşta hayatta kalma olasılığı o kadar artar."
 PER_bolster_infantry:0 "Piyadeyi Güçlendir"
 PER_bolster_infantry_desc:0 "Sıradan piyade askeri, nesiller boyunca herhangi bir silahlı kuvvetin temel taşı olarak kabul edilmiştir ve bu, orduda ihmal etmememiz gereken bir pozisyondur. Piyademizi güçlendirelim ve ordularımızın gururla ve iyi bir şekilde yürümesini sağlayalım."
 PER_bolster_the_caspian:0 "Hazar'ı Güçlendir"
 PER_bolster_the_caspian_desc:0 "Hazar Denizi sadece iç deniz olabilir, ancak [SOV.GetNameDef]'in işgal etmeyi seçmesi durumunda topraklarımıza girmenin bir başka yolunu sağlayabilir. Bazıları bu denizi savunmanın anlamsız olduğunu söyleyebilir, ancak kuzeydeki komşularımıza karşı asla çok güvende olamayız."
 PER_brown_shirts:0 "Şok Birlikleri Yürüyüşleri"
 PER_brown_shirts_desc:0 "Parti üyelerimizin birçoğu son zamanlarda Avrupa'daki faşist hareketlerin kahverengi gömleklilerinin üniformalarını benimsedi. Belki de bu adanmış üyeleri, hareket için destek toplamak amacıyla kitlesel yürüyüşler düzenlemeye yönlendirmeliyiz."
 PER_brown_shirts_tt:0 "§YŞah'a karşı bir iç savaşa girdiğimizde veya faşist olduğumuzda [?ROOT.PER_fascist_militia_count] milis tümeni kazanacağız.§!"
 PER_buffer_state_tt:0 "Eğer §Ybarış§! kabul edilirse, [AZR.GetFlag]§Y[AZR.GetNameDef]§!, [GEO.GetFlag]§Y[GEO.GetNameDef]§!, [ARM.GetFlag]§Y[ARM.GetNameDef]§! ve [TMS.GetFlag]§Y[TMS.GetNameDef]§!, [PER.GetFlag]§Y[PER.GetNameDef]§!'ın kuklaları olarak serbest bırakılacak."
 PER_capital_protect:0 "[PER.Capital.GetCapitalVictoryPointName]'ı Koru"
 PER_capital_protect_desc:0 "[PER.Capital.GetCapitalVictoryPointName]'ın konumu göz önüne alındığında, sağlam bir savunma yapmak için mükemmel bir yerdir. Burada sığınaklar ve direniş noktaları kurarak, [PER.GetNameDef]'ın son umut kalesi olarak ayakta durabiliriz."
 PER_challenge_the_royal_navy:0 "İngiliz Donanmasına Meydan Oku"
 PER_challenge_the_royal_navy_desc:0 "Artık büyük düşmanımızla başa çıkacak teknolojiye ve teorik bilgiye sahibiz. Ancak bunu başarmak için somut deneyimden yoksunuz. Belki Körfez'de küçük çaplı provokasyonlarla bu bilgiyi toplayabiliriz?"
 PER_choose_a_shahbanu:0 "Bir Şahbanu Seç"
 PER_choose_a_shahbanu_desc:0 "Pehlevi Hanedanı'nın kraliyet soyunun devam etmesi gerekir, ancak Muhammed Rıza Pehlevi'nin gençliği göz önüne alındığında, bir eş bulma fırsatı olmamıştır. Artık seçeneklerini düşünmesi ve ülkemizin Şahbanu'su olarak hizmet edecek bir kadın seçmesinin zamanı geldi."
 PER_civil_unrest_tt:0 "§RBu odağı seçmek $PER_civil_unrest_category$ zamanlı görevini başlatacak§!"
 PER_civil_war_happened:0 "İç Savaş Çıktı"
 PER_clamp_azerbaijani_dissidence:0 "Azeri Muhalefetini Bastır"
 PER_clamp_azerbaijani_dissidence_desc:0 "Ülkemizin kuzeyinde, [PER.GetNameDef]'ı evleri olarak adlandıran önemli bir Azeri nüfusu vardır. Ancak, yönetimimizden memnun olmayan önemli sayıda insan vardır. Bu isyancı hücrelere bir son vermenin ve bölgeye istikrar ve refahın geri dönebilmesini sağlamanın zamanı geldi."
 PER_clamp_kurdish_dissidence:0 "Kürt Muhalefetini Bastır"
 PER_clamp_kurdish_dissidence_desc:0 "[PER.GetNameDefCap], bir zamanlar Kürt halkına ait olan bazı toprakları kapsamaktadır. Bu nedenle, yönetimimizden memnun olmayan önemli bir diaspora vardır. Bu isyancı hücrelere bir son vermenin ve bölgeye istikrar ve refahın geri dönebilmesini sağlamanın zamanı geldi."
 PER_clash_of_titans:0 "Titanların Çarpışması"
 PER_clash_of_titans_desc:0 "[GRE.GetNameDef]'ın yeniden doğuşu şeklinde öngörülmeyen bir problem ortaya çıktı. Sınırlarımızda böyle bir imparatorluğun güç toplamasına izin veremeyiz. Hemen savaş ilan etmeli ve bu toprakları Şah'ın zaferi için güvence altına almalıyız!"
 PER_clergy_happy_tt:0 "§GBu odağı seçmek din adamlarını yatıştıracak. Artık size karşı isyan etmeyi düşünmeyecekler.§!"
 PER_clergy_revolt_tt:0 "§RBu odağı seçmek hoşnutsuz bir devrime yol açacak ve sizi iç savaşa sürükleyecek!§!"
 PER_clergy_upset_tt:0 "§RBu odağı seçmek din adamlarını kızdıracak. İstikrar çok düşerse devrimci bir iç savaş riski doğar!§!"
 PER_coastal_defense_initiative:0 "Kıyı Savunma Girişimi"
 PER_coastal_defense_initiative_desc:0 "Dünyanın okyanuslarına erişimimiz zayıf olsa da, deniz yoluyla işgal hala gerçek bir olasılıktır. [PER.GetNonIdeologyName]'in kıyı şeritlerinin korunmasını sağlamak için, Basra Körfezi ve Hazar Denizi kıyıları boyunca savunmaları geliştirmek için bir girişim başlatmalıyız."
 PER_comintern_research_collaboration:0 "Komintern Araştırma İşbirliği"
 PER_comintern_research_collaboration_desc:0 "[SOU.GetNameDefCap] bilim ve araştırma konusunda dünyanın önde gelenlerindendir. Onlarla ittifakımız sayesinde, bilim adamlarımızı en iyi [SOU.GetAdjective] bilim adamlarından öğrenmeye gönderme ve [SOU.GetAdjective] bilgi ve becerilerini yanlarında getirme fırsatı buluyoruz."
 PER_communist_afghanistan_intervention:0 "Büyük Oyun'u Böl"
 PER_communist_afghanistan_intervention_desc:0 "[ENG.GetAdjective] ve [SOU.GetAdjective], neredeyse bir asırdır [AFG.GetNonIdeologyName]'ın statüsü üzerinde çekişiyor. Oraya komünist bir rejim getirerek dengeleri lehimize bozacağız."
 PER_communist_air_defense:0 "Hava Savunma Girişimi"
 PER_communist_air_defense_desc:0 "İnşa ettiğimiz her şeyin emperyalist güçler tarafından havadan yok edilmesine izin veremeyiz. Bu nedenle, ülke genelinde bir dizi uçaksavar savunma sistemi kuracağız."
 PER_communist_basic_plane_design:0 "Hava Kuvvetleri İşbirliği"
 PER_communist_basic_plane_design_desc:0 "Hava kuvvetlerimizdeki reformlar iyi bir başlangıç yaptı, şimdi gemilere karşı koymak için gerekli teknoloji ve becerileri geliştirmeye odaklanmalıyız. Belki de bu süreci yurtdışındaki yoldaşlarımızın yardımıyla hızlandırabiliriz."
 PER_communist_destabilize_iraq:0 "Kuzey Irak'ı İstikrarsızlaştır"
 PER_communist_destabilize_iraq_desc:0 "[ENG.GetAdjective], [IRQ.GetNonIdeologyName]'dan akan petrole bağımlıdır, ülkenin kuzeyinde bir Kürt isyanı teşvik edip onları kendimize bağlayarak bu erişimi baltalayabiliriz."
 PER_communist_destabilize_iraq_tt:0 "Kürt ayaklanmasını teşvik etmek için §Y$PER_gulf_decisions_cat$§! kararları açılacak."
 PER_communist_education_reform:0 "Eğitim Sistemini Genişlet"
 PER_communist_education_reform_desc:0 "Eğitim sistemimiz çağdışı kalmış ve devletin ihtiyaçlarını karşılamıyor. Daha fazla çocuğu sınıflara sokmalı ve iş gücünde kullanabilecekleri pratik becerilerle okuldan ayrılmalarını sağlamalıyız."
 PER_communist_gulf_hegemony:0 "Basra Körfezi Hegemonyası"
 PER_communist_gulf_hegemony_desc:0 "İmkansız gibi görüneni başardık, emperyalist güçleri Basra Körfezi'nden çıkardık. Artık bölgenin fiili büyük gücüyüz ve dış müdahale olmadan etkimizi hissettirmeye başlayabiliriz."
 PER_communist_industrialization:0 "Ekonomik Planlama Komitesi"
 PER_communist_industrialization_desc:0 "Önceki ekonomik departmanların önyargıları ve ataletine kapılmadan, ekonominin genişlemesini ve modernleşmesini denetlemek için yeni bir birim kuracağız."
 PER_communist_kurdish_uprising:0 "Kürt Ayaklanmasına Hazırlan"
 PER_communist_kurdish_uprising_desc:0 "TODO"
 PER_communist_liberate_pashtuns:0 "Peştun Milliyetçiliğini Destekle"
 PER_communist_liberate_pashtuns_desc:0 "[AFG.GetNonIdeologyName] artık etki alanımızda güvence altına alındığına göre, Afgan-İran sınırı boyunca [ENG.GetAdjective] bölgelerini istikrarsızlaştırmak için Peştun milliyetçiliğini teşvik edebiliriz."
 PER_communist_liberate_pashtuns_tt:0 "Afgan-İran sınırı boyunca sömürgeci güçlere karşı direnişi teşvik etmek için daha fazla §Y$PER_gulf_decisions_cat$§! kararı açılacak."
 PER_communist_naval_bomber_design:0 "[SOU.GetAdjective]-[ROOT.GetAdjective] Bomber Tasarımı"
 PER_communist_naval_bomber_design_desc:0 "[SOU.GetAdjective] dostlarımızın yardımıyla, onayımız olmadan Basra Körfezi'ne girmeye cesaret edecek herhangi bir donanmayı yerle bir edecek bir deniz bombardıman uçağı filosu konuşlandırmaya neredeyse hazırız."
 PER_communist_naval_designs:0 "Deniz Kuvvetleri İşbirliği"
 PER_communist_naval_designs_desc:0 "Deniz reformlarımızda ilerleme kaydediyoruz, ancak çabalarımızı ikiye katlamalı ve denizaltı teknolojileri geliştirmeye başlamalıyız. Belki bu konuda başka yerlerdeki yoldaşlarımız bize yardımcı olabilir."
 PER_communist_propaganda:0 "Ulusal İran Radyosu"
 PER_communist_propaganda_desc:0 "Radyo istasyonlarını tek bir kamu yayıncısı altında millileştirmek, kamuoyunun devletin görüşleriyle tam olarak örtüşmediği konularda hızla manipüle edilmesini sağlayacak bir araç oluşturmamıza izin verecektir."
 PER_communist_propaganda_tt:0 "İstikrarı, savaş desteğini ve parti popülaritesini artırmak için §Y$PER_national_iranian_radio$§! kararları açılacak."
 PER_communist_shore_defense:0 "Kıyı Savunma Girişimi"
 PER_communist_shore_defense_desc:0 "Kıyılarımız boyunca sağlam bir deniz savunma ağı oluşturmak, olası saldırganları kıyılarımıza çıkarma yapmaktan caydırmada uzun bir yol kat edecektir."
 PER_communist_submarine_design:0 "[SOU.GetAdjective]-[ROOT.GetAdjective] Denizaltı Geliştirme"
 PER_communist_submarine_design_desc:0 "[SOU.GetAdjective] yoldaşlarımızla işbirliği içinde, Basra Körfezi'nde hakimiyet kurmamızı sağlayacak son teknoloji bir denizaltı geliştirmek üzereyiz."
 PER_consolidate_british_territory:0 "[ENG.GetAdjective] Topraklarını Birleştir"
 PER_consolidate_british_territory_desc:0 "Çok uzun zamandır, [ENG.GetNameDef] Orta Doğu'da varlık göstermektedir; gerçekten ait olmadıkları bir yerde. Artık bağımsızlık için savaştığımıza göre, aynısını bu bölgedeki diğer uluslar için yapalım ve onların [ENG.GetNameDef] tarafından yönetilmek yerine bizim tarafımızdan korunacağını garanti edelim."
 PER_constitutional_monarchy:0 "Şah Üzerindeki Anayasal Sınırlamaları Yeniden Getir"
 PER_constitutional_monarchy_desc:0 "Şah çok uzun süredir ulusun siyasetine hakim oldu, ancak yokluğu kutsal rolüne hala inanan birçok kişiyi rahatsız edecektir. Bu nedenle, Şah'ın siyasi meseleleri etkileme yeteneğini sınırlayacağız ve rolü törensel bir konuma indirgeyeceğiz."
 PER_construct_air_bases:0 "Hava Üsleri İnşa Et"
 PER_construct_air_bases_desc:0 "Uçaklarımız görevlerini verimli bir şekilde yerine getirecekse, konuşlandırılacak bir yere ihtiyaçları vardır. Bu nedenle, [PER.GetNonIdeologyName] çevresinde yeni hava üsleri geliştirmek ve hava kuvvetlerimizin kapasitesini genişletmek için zaman harcamak çok önemlidir."
 PER_construct_air_defenses:0 "Hava Savunmaları Kur"
 PER_construct_air_defenses_desc:0 "İlerleyen birliklerimizi düşman uçaklarından korumak için sınırlar boyunca daha fazla uçaksavar topu yerleştirmeliyiz."
 PER_construct_naval_bases:0 "Yeni Deniz Üsleri İnşa Et"
 PER_construct_naval_bases_desc:0 "Mevcut deniz kapasitemiz istediğimizden daha düşük. Bunu artırmak için, savaş gemilerinin konuşlandırılmasını sağlayabilecek daha fazla tersane inşa etmeliyiz."
 PER_continue_westernization:0 "Batılılaşmayı Sürdür"
 PER_continue_westernization_desc:0 "Batılılaşma, liderliğimizin zihninin bir köşesinde her zaman bir hedef olmuştur. Birçok kişi, Batı'daki bazı büyük oyuncuların izinden gitmeye, onların ideolojilerini ve uygulamalarını benimsemeye heveslidir. Gelecekte onlara katılmayı hedefliyorsak, şimdi bu entegrasyon için hazırlanmalıyız."
 PER_crush_saudi_arabia:0 "Savaş Ekonomisini Entegre Et"
 PER_crush_saudi_arabia_desc:0 "Son fetihlerimiz bize evimize gönderip orada kullanabileceğimiz büyük miktarda endüstriyel ekipman ve personel kazandırdı. Ancak bu görevi yerine getirmek için çok sayıda trene ihtiyaç duyulacak."
 PER_currently_doing_war_plan:0 "Şu anda bir §YSavaş Planı§! üzerinde çalışıyor."
 PER_curtail_pan_arabism:0 "Pan-Arabizmi Sınırla"
 PER_curtail_pan_arabism_desc:0 "Orta Doğu ve Kuzey Afrika'daki Arap halkları giderek daha fazla Pan-Arap dayanışması benimsiyor. Kapımızın önünde birleşik bir güç haline gelmelerine asla izin veremeyiz ve bunu önlemek için önceden harekete geçmeliyiz."
 PER_cyrus_initiative:0 "Cyrus Girişimi"
 PER_cyrus_initiative_desc:0 "Cyrus Girişimi, düşmanlarımızı tamamen yok etmek için savaş alanında kullanabileceğimiz etkileyici, yıkıcı silahlar geliştirmek için en yeni çok gizli projemizdir. Bilim adamlarımız, başka hiçbir ulusun düşünmediği, yani savaş zamanlarında rakiplerimizi şaşırtmak için iyi bir konumda olduğumuz anlamına gelen bazı ilginç tasarımlar hazırladılar."
 PER_czech_tanks:0 "Çek Tank Lisanslarını Satın Al"
 PER_czech_tanks_desc:0 "Kendi mekanize kuvvetlerimizi tasarlamayı ve üretmeyi düşünmeden önce, tank üretimleriyle tanınan uluslara bakmalıyız. [CZE.GetNameDef]'ye ulaşarak, ünlü Skoda Fabrikalarından tank üretmek için bir lisans temin edebiliriz."
 PER_deal_with_eitc:0 "EITC ile Anlaşma Yap"
 PER_deal_with_eitc_desc:0 "Doğudaki komşularımız meşgul görünüyor. [RAJ.GetNonIdeologyName], Doğu Hindistan Ticaret Şirketi'ni yeniden kurdu ve ülke çapında bir mega şirket haline geldi. Kendi petrol tekelimiz konusunda onları yanımıza çekmek ve OPEC'in geri kalanıyla bir anlaşma yapmak akıllıca olacaktır."
 PER_declare_loyalty_to_britain:0 "[ROOT.OVERLORD.GetNameDef]'a Sadakat Bildir"
 PER_declare_loyalty_to_britain_desc:0 "[ROOT.OVERLORD.GetNameDef]'ın yeni bir tebaası olarak, dikkatli adım atmak ve efendimizin kaprislerini takip etmek akıllıca olacaktır. Belki de bu, nihayet modernizasyon girişimimizi tamamlama fırsatımız olabilir. Yol çarpıcı biçimde farklı bir yöne sapmış olabilir, ama sonuç aynıdır."
 PER_declared_loyalty:0 "Hükümdara Sadakat Bildirisi"
 PER_demand_afghan_territory:0 "Afgan Topraklarını Talep Et"
 PER_demand_afghan_territory_desc:0 "[AFG.GetNameDefCap], dolambaçlı dağlar ve nehirler ülkesidir ve bu nedenle, gelecekte fethedilmesi karmaşık olacaktır. Eğer ülkede bir dayanak noktası elde edebilirsek, Kabil'e doğru daha fazla ilerlemek için mükemmel bir hazırlık noktası olacaktır."
 PER_demand_iraqi_territory:0 "Irak Topraklarını Talep Et"
 PER_demand_iraqi_territory_desc:0 "[IRQ.GetNameDef]'ın kuzey toprakları, bu bölgenin insanlarına [PER.GetNameDef]'ın tek güç merkezi olarak durmaya niyetli olduğunu göstermek için mükemmel bir dayanak noktası olacaktır. Bu, büyük fetih kampanyamızın başlangıç noktalarından biri olacaktır."
 PER_demand_war_reparations:0 "Savaş Tazminatı Talep Et"
 PER_demand_war_reparations_desc:0 "İşgalcilerin tüm çabalarına rağmen, hedeflerini tamamlayamadılar ve bunun yerine biz savaşı kazanmaya başlıyoruz. Hemen taleplerimizi onlara dayatmalı ve yaptıkları hasarın bedelini ödetmeliyiz."
 PER_demand_west_asia:0 "Fransız Batı Asya'sını Güvence Altına Al"
 PER_demand_west_asia_desc:0 "[FRA.GetAdjective]lar bu toprakların yasa dışı işgalcileridir ve kendi emperyal gündemimizi güvence altına almak için onları dışarı atılmalıdır. [SYR.GetNameDef] ve [LEB.GetNameDef]'ın toprakları alınmalıdır, eğer Kuzey Afrika'da [ENG.GetAdjective]larla yüzleşmeye devam edeceksek..."
 PER_democratic_shortcut:0 "Siyaset:\nMilli Cephe"
 PER_desert_training:0 "Özelleştirilmiş Çöl Eğitimi"
 PER_desert_training_desc:0 "[PER.GetNonIdeologyName]'in güzel ülkesi çeşitli ve çeşitli bir ekosisteme sahiptir, ancak topraklarımızın önemli bir kısmı çöl ovalarından oluşmaktadır. Böylesine zorlu bir arazi, ordumuzun nasıl çalıştığına dair belirli bir düşünceyi beraberinde getirir ve bu nedenle, çöl manzaralarında hayatta kalmayı ve geçmeyi öğrenmek için eğitimimizi özelleştirmeye çalışmalıyız."
 PER_develop_cities:0 "Büyük Yerleşimleri Geliştir"
 PER_develop_cities_desc:0 "Şu anda Tahran başkenti, [ROOT.GetNonIdeologyName]'daki en gelişmiş şehir. Ülkemizde modernizasyonu gerçekten benimsemek istiyorsak, çabalarımızı büyük şehirlerimizin altyapısını genişletmeye odaklamalıyız."
 PER_develop_oil_fields:0 "Petrol Sahalarını Geliştir"
 PER_develop_oil_fields_desc:0 "Zaten geniş olan petrol çıkarma kompleksimize ek olarak, kazılmaya hazır yeni petrol kaynakları keşfettik. Sanayi bakanlarımız, yeni petrol kuleleri kurmanın bu en değerli kaynak üzerinde bir tekel kurma potansiyeli taşıdığına inanıyor."
 PER_develop_qorkhaneh:0 "Korkhane'yi Geliştir"
 PER_develop_qorkhaneh_desc:0 "Tahran’daki silah ve mühimmat üretimimizin başlıca kaynağı olan Qorkhaneh, uzun süredir bu alandaki görevini sürdürüyor. Ekipman üretimimizin olası bir çatışmaya karşı her zaman hazır kalmasını sağlamak için Qorkhaneh cephaneliğine kaynak yatırmak zamanımıza değer olacaktır."
 PER_dig_and_defend:0 "Kaz ve Savun"
 PER_dig_and_defend_desc:0 "Düşman güçleri büyük ulusumuzun sınırlarına her yönden akın ederken, [PER.GetNameDef]'ı kurtaracaksak hızlı hareket etmeliyiz. Saldırıya geçmek yerine, savunma yapmak ve işgalciler için sorun yaratmak için toprağımıza sıkı sıkı tutunmamız zorunludur. Aksi takdirde büyük kayıplar riskiyle karşı karşıya kalırız."
 PER_donate_oil_fields:0 "Petrol Sahalarını [GER.GetNameDef]'a Bağışla"
 PER_donate_oil_fields_desc:0 "[ENG.GetNameDef] gibi uluslara uzun süredir petrol sağladıktan sonra, artık bazı çıkarma tesislerimizi savaş çabalarına yardımcı olmak için [GER.GetNameDef]'a bağışlamak daha faydalı olacaktır. Umarız bu uzun vadede ikimiz için de faydalı olur."
 PER_eastern_expansion:0 "Doğuya Genişleme"
 PER_eastern_expansion_desc:0 "Dünya son birkaç yılda büyük bir değişim geçirdi ve doğumuzdaki rejimler kırılgan ve çökmeye meyilli durumda. Onları etki alanımıza entegre etmek için bir daha böyle bir fırsat elde edemeyebiliriz."
 PER_educational_reforms:0 "Eğitim Reformları"
 PER_educational_reforms_desc:0 "Yeni okuryazarlık kampanyaları kurduk. Yeni üniversiteler inşa ettik. Nihayet vatandaşlarımızın sosyal ilerlemesine katkıda bulunacak ve önceden eşitsiz eğitim fırsatlarını ele alacak yeni eğitim reformlarını uygulama zamanı geldi."
 PER_elevate_the_iran_party:0 "İran Partisi'ni Yükselt"
 PER_elevate_the_iran_party_desc:0 "Tudeh partisi ulusumuzu [SOU.GetNameDef]'a bağlayacak, emirlerini [SOU.Capital.GetCapitalVictoryPointName]'den alacak. Eğer İran'a özgü bir sosyalizm yolu oluşturma umudumuz varsa, tüm ilericiler İran Partisi ile birlikte durmalıdır."
 PER_embrace_industrial_powers:0 "Endüstriyel Güçleri Benimse"
 PER_embrace_industrial_powers_bonus:0 "Endüstriyel Güçlerle İşbirliği"
 PER_embrace_industrial_powers_desc:0 "Kendimizi dünyanın geri kalanından soyutlamak ve izole etmek yerine, [PER.GetNameDef]'ın geleceğinin gelişimine yardımcı olmak için endüstriyel güçlerle olan bağlantılarımızdan yararlanmak çok daha iyi olacaktır."
 PER_embrace_national_front:0 "Cumhuriyete Doğru"
 PER_embrace_national_front_desc:0 "Siyasi güç ve karar alma süreçleri artık seçilmemiş ve hesap vermeyen Şah'ın veya bir halefinin elinde toplanamaz. Tüm bu kurumu ortadan kaldırmalı ve bir [ROOT.GetAdjective] Cumhuriyeti oluşturmaya yönelmeliyiz."
 PER_embrace_opulence:0 "Gösteriş Kültürünü Benimse"
 PER_embrace_opulence_desc:0 "Kralların Kralı kadar önemli biri için, dünyaya [PER.GetAdjective] olarak ne kadar görkemli olabileceğimizi göstermek çok önemlidir. İhtişamımızı ona bakmak isteyen herkese sergileyelim."
 PER_emperor_for_people:0 "Halk İçin Bir İmparator"
 PER_emperor_for_people_desc:0 "Muhammed Rıza Şah, saltanatının kral ile halkı arasında yeniden bağ kurmanın örneği olmasını istiyor. Kraliyet ailesi için serveti bencilce biriktirmek yerine, bunun yerine [PER.GetNameDef]'ın sıradan vatandaşlarının hayatlarını iyileştirmek için kullanmayı tercih ediyor."
 PER_entice_foreign_investment:0 "Yabancı Yatırımı Cezbet"
 PER_entice_foreign_investment_desc:0 "Ekonomimiz, bol miktarda doğal kaynak ve iş arayan büyüyen bir kentsel nüfus sayesinde büyük bir büyüme potansiyeline sahip. Ancak, bu büyümeyi başlatmak için yurtdışından daha fazla yatırıma ihtiyacımız var."
 PER_establish_air_academy:0 "Hava Akademisini Kur"
 PER_establish_air_academy_desc:0 "Hava kuvvetlerinin bir üyesi olma sürecinin bir parçası olarak temel pilot eğitimi oluşturduk, ancak gökyüzünü gerçekten kontrol altına almak istiyorsak daha özelleştirilmiş bir eğitime ihtiyacımız var. Tahran'da resmi bir hava akademisi oluşturmak bu süreci hızlandıracak ve pilotlarımızın iyi eğitilmesini sağlayacaktır."
 PER_establish_airforce:0 "Hava Kuvvetlerini Kur"
 PER_establish_airforce_desc:0 "İmparatorluk [PER.Adjective] Hava Kuvvetleri, resmi olarak 1920'de Rıza Şah Pehlevi tarafından kuruldu. Ancak, şimdi savaş tehdidi dünyanın üzerinde dolaşırken, ulusumuzun on yıllar boyunca [PER.GetNameDef]'ın güvenliğini sağlamak için bile olsa gökyüzündeki savaşlara katılma yeteneğini sağlamlaştırmalıyız."
 PER_establish_immortal_legion_tt:0 "§YÖlümsüz Lejyon§! tümen şablonunun kilidini açar ve §Y[ROOT.capital.GetCapitalVictoryPointName]§!'da §Yüç§! birim işe alır."
 PER_establish_motor_arms:0 "Motorlu Silah Endüstrisi Kur"
 PER_establish_motor_arms_desc:0 "Piyademizi desteklemek için, savaş alanında hareket kabiliyetlerinin güncel ve mümkün olduğunca sorunsuz olmasını sağlamak amacıyla çeşitli araçlar üretmeyi düşünmeliyiz. Bu tür ekipmanlar için bir endüstri kurarak, silahlı kuvvetlerimizin gelecekteki modernizasyonuna hazırlanıyoruz."
 PER_establish_northern_buffer_states:0 "Kuzey Tampon Devletler Kur"
 PER_establish_northern_buffer_states_desc:0 "Kuzeydeki düşmanlarımızın doğrudan [PER.GetNameDef]'a saldırma fırsatına artık sahip olmamasını sağlamak için, bu topraklardaki işgal altındaki ulusları kurtarmalı ve egemenliklerini yeniden tesis etmeliyiz. Umarız bu, gelecekte sürpriz işgallerini önleyecektir."
 PER_establish_nuclear_program:0 "[PER.GetAdjective] Nükleer Programını Kur"
 PER_establish_nuclear_program_desc:0 "Atomun sırları [GER.GetNameDef] ve [USA.GetNameDef] tarafından epeydir kurcalanıyor. [USA.GetAdjective] dostlarımızdan notlar ve araştırma belgeleri aldıktan sonra, kendi nükleer programımızı kurmamıza resmen yardım ettiler."
 PER_establish_opec:0 "OPEC'i Kur"
 PER_establish_opec_desc:0 "Petrol endüstrimiz tamamen kurulduğuna göre, bu stratejik kaynağı tekel altına almak için diğer petrol zengini ülkelere bakma zamanı geldi. [IRQ.GetNameDef], [SAU.GetNameDef] ve [VEN.GetNameDef] ile temasa geçtikten sonra, Petrol İhraç Eden Ülkeler Örgütü'nü (OPEC) kurmaya oybirliğiyle karar verdik."
 PER_establish_special_unit:0 "Ölümsüz Lejyonu Kur"
 PER_establish_special_unit_desc:0 "Ölümsüzler, eski Pers İmparatorlukları tarafından sahaya sürülen en ikonik birliklerden bazılarıydı. Yeni bir imparatorluk büyüklüğü çağını başlatırken, Ölümsüzleri seçkin şok birlikleri lejyonu olarak yeniden kurmanın zamanı geldi."
 PER_establish_tehran_armor:0 "Tahran Zırhlılarını Kur"
 PER_establish_tehran_armor_desc:0 "Kendi tank üretim şirketimizi kurma zamanı geldi. Tahran Zırhlıları adı verilen bu şirketin, kurulmasına yardımcı olmak için hükümet tarafından sübvanse edileceği duyuruldu."
 PER_establish_the_navy:0 "Donanmayı Kur"
 PER_establish_the_navy_desc:0 "Hava kuvvetleri gibi, İmparatorluk [PER_GetAdjective] Donanması da Rıza Şah Pehlevi tarafından eski Kaçar hanedanına karşı yaptığı darbe sonrasında kuruldu. O zamandan beri, zaten oluşturulmuş olanı güçlendirme ve kuzey ve güney sınırlarımızda bulunan denizler üzerinde daha iyi kontrol sağlama ihtiyacını keşfettik."
 PER_established_cell_here:0 "Muhalefet Hücresi Kuruldu"
 PER_every_man_serves:0 "Hizmet Edebilen Her Adam"
 PER_every_man_serves_desc:0 "Nicelik kaliteden daha önemli olacak ordumuzun geleceği olacaktır. Çok geniş bir nüfusumuz var ve böyle zamanlarda, silah tutabilen her adam [PER.GetNameDef]'ı yabancı işgalcilerden korumak için vatandaşlık görevini yerine getirmelidir. Özelleştirilmiş eğitimi kaybedeceğiz, ancak umarız sayılarımız düşmanı boğabilir."
 PER_exclude_religion:0 "Dini Dışla"
 PER_exclude_religion_desc:0 "İslam ve din genel olarak, ulusumuzun hem siyasi hem de ekonomik olarak modernleşmesinin önünde bir engel haline gelmiştir. Yeni [ROOT.GetNonIdeologyName]'da böyle engellerin aşılacağını açıkça belirtmeliyiz."
 PER_expand_dockyards:0 "Tersane Tesislerini Genişlet"
 PER_expand_dockyards_desc:0 "Donanmamız büyüdükçe, buna uyum sağlamak için deniz altyapımızı genişletmemiz gerekiyor. Bunu yapmak, sadece kıyı şeritlerimiz üzerindeki kontrolün sıkı bir şekilde bizde kalmasını sağlayacaktır."
 PER_expand_immortal_legion_tt:0 "§Y[ROOT.capital.GetCapitalVictoryPointName]§!'da §YÖlümsüz Lejyon§!'dan §Yüç§! birim işe alır."
 PER_expand_imperial_guard:0 "Muhafız Alayını Genişlet"
 PER_expand_imperial_guard_desc:0 "[PER.GetNameDef]'ı yöneten en yeni büyük aile olarak Şah'ın hanedanı, sadece en iyilerden oluşan bir kraliyet muhafız birliği istemektedir. Eğer uygun şekilde donatılır ve eğitilirlerse, bu birlikler aynı zamanda cephe hattımıza da katılabilirler."
 PER_expand_imperial_guard_tt:0 "§Yİran İmparatorluk Muhafızları§! tümen şablonunun kilidini açar ve §Y[ROOT.capital.GetCapitalVictoryPointName]§!'da §Yiki§! birim işe alır."
 PER_expand_military_facilities:0 "Askeri Tesisleri Genişlet"
 PER_expand_military_facilities_desc:0 "Şu anki durumda, silah üretme kapasitemiz ciddi şekilde yetersizdir. Yeni yapılandırılmış ordumuzun savaşa hazır ve donanımlı olmasını sağlamak için askeri tesislerimizi mümkün olan en kısa sürede genişletmeliyiz."
 PER_expand_oil_production:0 "Petrol Üretimini Genişlet"
 PER_expand_oil_production_desc:0 "[PER.GetNonIdeologyName] petrol açısından zengindir ve bu kaynağı kendi çıkarımız için kullanmamak aptallık olur. Petrol üretimimizi genişleterek, ileride Batı ile müzakere ederken avantajlı bir pozisyonda olalım."
 PER_expand_tabriz_masshad:0 "Tebriz-Meşhed Bağlantısı"
 PER_expand_tabriz_masshad_desc:0 "Trans-İran Demiryolu'nu genişletmeye devam etmeliyiz. Tebriz ve Meşhed şehirleri arasında bir demiryolu bağlantısı kurmaya odaklanalım."
 PER_expand_tehran_abbas:0 "Tahran-Bandar Abbas Bağlantısı"
 PER_expand_tehran_abbas_desc:0 "Trans-İran Demiryolu'nu genişletmeye devam etmeliyiz. Tahran ve Bandar Abbas şehirleri arasında bir demiryolu bağlantısı kurmaya odaklanalım."
 PER_expand_tehran_armor:0 "Tahran Zırhlıları Tesislerini Genişlet"
 PER_expand_tehran_armor_desc:0 "Tahran Zırhlıları savaş çabalarımız için yeni tank tasarımları üretirken, üretim tesislerini hızla genişleterek bu süreci hızlandırmak akıllıca bir karar olacaktır. Zırhlı ekipmanlarımızın üretimine ayrılan daha fazla fabrika katı ile tankları sahaya daha hızlı sürebiliriz."
 PER_expand_tehran_emam:0 "Tahran-Bandar Şahpur Hattı"
 PER_expand_tehran_emam_desc:0 "Trans-İran Demiryolu'nu genişletmeye devam etmeliyiz. Tahran ve Bandar Şahpur şehirleri arasında bir demiryolu hattı genişletmeye odaklanalım."
 PER_expand_unique_unit:0 "Ölümsüz Lejyonu Genişlet"
 PER_expand_unique_unit_desc:0 "İmparatorluk mirasımızın bir parçası olarak Ölümsüz Lejyonu'nu kurduktan sonra, şimdi bu prestijli lejyonu genişletmek için kaynakları yönlendirebilir ve [PER.GetAdjective] İmparatorluğu'nun ağırlığını taşımak için omuz omuza durmak üzere çok daha fazla erkeğe izin verebiliriz!"
 PER_expert_raiders:0 "Uzman Akıncılar"
 PER_expert_raiders_desc:0 "Kendi deniz ticaretimizin korunmasını sağlamak önemli olsa da, savaş zamanlarında, aktif olarak düşmanın tedarik hatlarını arayıp bozarak ekonomilerinin işlevselliğini yok etmek çok önemlidir. Deniz varlıklarımızı düşman konvoylarına baskın düzenlemeye odaklamalıyız."
 PER_fascism_sway_the_rich_idea_tt:0 "Bir iç savaş başladığında veya faşist hareket iktidara geldiğinde, şu fikri kazanacağız:"
 PER_fascist_attack_afghanistan:0 "Afganistan'la Yüzleş"
 PER_fascist_attack_afghanistan_desc:0 "Önemli bir İrani nüfus, sınırlarımızın ötesinde [AFG.Capital.GetCapitalVictoryPointName]'daki Peştunların baskısı altında yaşıyor. Toprak bütünlüğümüze yönelik böyle bir hakarete daha fazla müsamaha gösterilmeyecek."
 PER_fascist_attack_turkey:0 "[TUR.GetAdjective] Tehdidini Sınırla"
 PER_fascist_attack_turkey_desc:0 "[TUR.GetAdjective] ve onların Osmanlı öncülleri uzun süredir sınırlarımızı kemirip kültürümüzü bozuyor, tüm bunları yaparken de halkımıza ait toprakları işgal ediyorlar. Bu tarihsel adaletsizliği düzeltmeliyiz."
 PER_fascist_reach_out_to_germany:0 "Batı'ya Bak"
 PER_fascist_reach_out_to_germany_desc:0 "Bir tür küresel çatışmaya sürüklenme ihtimalimiz giderek artarken, belki de kendimizi [GER.GetNameDef] gibi benzer düşünen rejimlerle aynı hizaya getirmeliyiz."
 PER_fascist_reach_out_to_japan:0 "Doğu'ya Bak"
 PER_fascist_reach_out_to_japan_desc:0 "[JAP.GetAdjective], uluslarını modernleştirirken kültürlerini batılılaşmanın yozlaştırıcı güçlerinden koruma mücadelesini biliyor. Küresel güç üzerindeki Batı egemenliğini kırmak için kendimizi onlarla aynı hizaya getirmeliyiz."
 PER_fascist_secularism:0 "Sekülerliği Zorla Uygula"
 PER_fascist_secularism_desc:0 "Pers İmparatorluğu'nun zorla İslam'a geçirilmesi bir zamanlar büyük olan kültürümüzü yok etti. Köklerimize dönmeli ve bu yabancı dini kamu yaşamının tüm yönlerinden reddederek katı bir sekülerlik kodu uygulamalıyız."
 PER_feat_of_engineering:0 "Bir Mühendislik Harikası"
 PER_feat_of_engineering_bonus:0 "Trans-İran Demiryolu Tamamlandı"
 PER_feat_of_engineering_desc:0 "Trans-İran Demiryolu'nu tamamlayarak özel bir şey başardık. Sadece muazzam ölçeği nedeniyle değil, aynı zamanda [ROOT.GetNonIdeologyName]'ın dik güzergahlarını ve dağlık arazisini aşmak için gereken mühendislik harikaları sayesinde. Hükümetimiz ve müteahhit mühendislerimiz tarafından gerçekleştirilen bu mühendislik harikasıyla gurur duymalıyız."
 PER_fight_for_iran:0 "[PER.GetNonIdeologyName] İçin Savaş"
 PER_fight_for_iran_desc:0 "En kötü korkularımız gerçek oldu, düşman güçleri savunmalarımızı yarıp [PER.GetNameDef]'a tam ölçekli bir işgal başlattı. Bu zamanlar zor olsa da, halkımızı bir araya getirmeli ve büyük ulusumuzu egemenliğimizi tehdit eden yabancı güçlere karşı savunmak için birliklerimizi hazırlamalıyız."
 PER_fight_for_iran_shortcut:0 "İran İçin Mücadele"
 PER_finding_a_shah:0 "Bir Şah Bulmak"
 PER_finding_a_shah_desc:0 "Pahlavi hanedanının yenilgisiyle birlikte, Güneş Tahtı'na güvenilir danışmanlarının bilge tavsiyelerini dinleyecek daha uygun bir Şah yerleştirme fırsatımız var."
 PER_finding_a_shah_tt:0 "[ROOT.GetNameDef]'ın yeni Şah'ını seçebileceğimiz bir etkinlik alacağız."
 PER_first_iranian_empire:0 "Birinci İran İmparatorluğu"
 PER_first_iranian_empire_desc:0 "Rıza Şah Pehlevi, ulusunun [PER.GetNameDef] olarak adlandırılmasını tercih etmiş ve 1935'te bunu ülkenin resmi adı olarak yeniden tesis etmiştir. Bu nedenle, yeni emperyal hedeflerinin temeli, eskilerini doğrudan taklit etmek yerine, yepyeni bir İran İmparatorluğu'nun yaratılması olacaktır."
 PER_first_warning_flag:0 "İslam Devrimi İlk Uyarısı"
 PER_follow_the_tudeh:0 "Tudeh Partisi Etrafında Toplan"
 PER_follow_the_tudeh_desc:0 "Tudeh Partisi, mevcut rejimin demokratik görüntüsünden ziyade, halkın radikal değişim arzusunu yansıtan tek partidir. Bu nedenle, radikal hareketin kalbi olarak onların etrafında toplanmalıyız."
 PER_food_for_all:0 "Her [PER.GetAdjective] İçin Gıda"
 PER_food_for_all_desc:0 "Ne yazık ki kıtlık bize yabancı değil. Modernizasyon çabalarımızla ekonomiyi iyileştirme çalışmalarımız sayesinde, gıda dağıtımımızı iyileştirme ve her [PER.GetAdjective]'ın temel insani ihtiyaçlarından birine erişebilmesini sağlama fırsatımız var."
 PER_foothold_in_indus:0 "Indus'ta Bir Dayanak Noktası"
 PER_foothold_in_indus_desc:0 "[RAJ.GetNameDefCap], [ENG.GetNameDef]'ın sömürge gücünün parlayan örneğidir. Ancak, [ENG.GetAdjective]lar buraya ait değildir ve buranın Büyük Darius'un sözüyle [PER.GetNameDef]'ın doğuştan hakkı olduğunu öğrenmeleri onlara iyi gelecektir. Görüşmelere başlayın ve Hindistan'daki dayanak noktamızı güvence altına alın."
 PER_foothold_in_indus_tt:0 "§Y[PER.GetNameDefCap]§! ve §Y[RAJ.GetNameDefCap]§!'ın §YBelucistan§! üzerinde kontrol için müzakere edeceği bir §Yetkinlik zinciri§! başlatacak."
 PER_force_abdication:0 "Tahttan İndirmeyi Zorla"
 PER_force_abdication_desc:0 "Şah ve yandaşları, halk arasındaki kitlesel hoşnutsuzluk karşısında şaşkına dönmüş durumda. Şimdi avantajımızı kullanıp onu tahttan indirerek bu feodal saçmalığı bir kez ve sonsuza kadar sona erdirmeliyiz."
 PER_force_abdication_tt:0 "\n§RTarafsız parti %50'den fazla desteğe sahipse, Şah bize karşı bir iç savaş başlatacak!§!"
 PER_force_them_back:0 "Onları Geri Püskürt"
 PER_force_them_back_desc:0 "Savaş başladığında ya savunmaya geçeceğimizi ya da düşmanlarımızı geri püskürteceğimizi hep biliyorduk. Eğer saldırgan bir yol izlersek, çatışma bittiğinde taleplerde bulunmak için iyi bir konumda olacağız. Riskli olabilir, ancak birliklerimiz böyle bir operasyonu yönetmeye hazırdır."
 PER_force_white_peace:0 "Beyaz Barışı Dayat"
 PER_force_white_peace_desc:0 "Düşmanın işgali planlandığı gibi gitmedi. Şiddetli direnişimiz ve onlara karşı durma arzumuz nedeniyle, [PER.GetNonIdeologyName]'da fazla toprak kazanamadılar. Yaşadıkları zorluklar göz önüne alındığında, bu küstah işgalcilere beyaz bir barış dayatmak için iyi bir konumdayız."
 PER_forced_secularization:0 "Zorunlu Laikleştirme"
 PER_forced_secularization_desc:0 "Rıza Şah Pehlevi'nin başlangıçta iktidara gelmesinden bu yana, [PER.GetNameDef]'ta din adamlarına karşı sürekli bir geri itme olmuştur. İslam devlet dinimiz olmaya devam etmektedir, ancak batı dünyasına onların arasında durabileceğimizi kanıtlama çabasıyla, devlet ve dini ayırma ve modernizasyon yolunu izleme zamanı geldi."
 PER_foreign_retraining:0 "Yabancı Yeniden Eğitim İnisiyatifi"
 PER_foreign_retraining_desc:0 "Mevcut ordumuz kötü eğitimli ve dağınık durumda. Gücümüzün kalitesini artırmak için, yabancıların [PER.GetNonIdeologyName]'e gelerek birliklerimizi eğitmesine yatırım yapmak akıllıca olacaktır. Bu, onları kısa sürede savaşa hazır hale getirecektir."
 PER_foreign_schools:0 "Yabancı Okulların Kontrolünü Al"
 PER_foreign_schools_bonus:0 "Millileştirilmiş Yabancı Okullar"
 PER_foreign_schools_desc:0 "[PER.GetAdjective] topraklarında dağılmış çok sayıda yabancı okul var. Bu kurumlar, liderliğimizin egemenliği yabancı güçlere devrettiğinin bir örneği olarak görülebilir. Ülkemizin kalkınması için bunlara el koymalı ve millileştirmeliyiz."
 PER_form_arya_party:0 "Arya Partisi'ni Kur"
 PER_form_arya_party_desc:0 "Hasan Arfa, sadık bir askeri subay ve Şah'ı Tanrı'nın bir yansıması olarak gören kararlı bir savunucu olmuştur. Ancak, Şah'ın en çılgın hayallerinin bile ötesinde bir ulusal reform gerçekleştirmek için yükselen milliyetçi duygulardan yararlanabilir."
 PER_form_oil_company:0 "Kendi Petrol Şirketimizi Kur"
 PER_form_oil_company_desc:0 "Çok uzun süredir petrol sahalarımız dış sömürgeci güçler tarafından işletiliyor ve kontrol ediliyor. Yeni stoklarımız ve yabancı etkisinden uzak bir gelecekle, artık Ulusal [PER.GetAdjective] Petrol Şirketi'ni kurma zamanı geldi."
 PER_form_savak:0 "SAVAK'ı Kur"
 PER_form_savak_desc:0 "Casusluk, savaş çabaları için çok önemli bir unsur olduğunu kanıtlıyor. Düşmanımızın istihbarat çabalarına ayak uydurmak için, tüm casuslarımızı ve casusluk operasyonlarımızı yönetmek üzere kendi örgütümüzü kurmalıyız. Dahili olarak bile, bu hükümetimizi güçlendirmeye ve onu devirmeye çalışanları gözetlemeye yardımcı olmalıdır."
 PER_form_savama:0 "Gizli Polis Teşkilatı Kur"
 PER_form_savama_desc:0 "Kültürümüzü terk eden veya yabancı güçlerin ajanı olarak çalışan o hainler en kısa sürede kökünden kazınmalıdır. Bu amaçla, bunu yapacak yeni bir özel polis gücü kuracağız."
 PER_form_sumka:0 "SUMKA'yı Kur"
 PER_form_sumka_desc:0 "Davud Munşizade son zamanlarda [GER.GetNameDef]'da bulundu ve oradaki Nasyonal Sosyalist hareketiyle tanıştı. Şimdi görünen o ki, yeni bir İran düzeni getirmek için mevcut milliyetçi dalgadan yararlanmak üzere İran'a dönmeye hazırlanıyor."
 PER_found_iranian_shipyards:0 "İran Tersanelerini Kur"
 PER_found_iranian_shipyards_desc:0 "Diğer uluslardan gemi satın almak şimdilik yeterli olsa da, bölgedeki deniz silahlanma yarışına ayak uydurmak istiyorsak, kendi varlıklarımızı inşa etmeye yatırım yapmalıyız. Bunu, öncelikle savaş çabalarımız için gemi inşa etmeye odaklanan bir şirket kurarak başarabiliriz - İran Tersaneleri."
 PER_free_elections:0 "Serbest Seçimler"
 PER_free_elections_desc:0 "Yeni ve yeniden yapılandırılmış hükümetimiz şekillenirken, [PER.GetNameDef]'ı demokrasinin altın çağına götürecek Başbakan'ı seçme zamanı geldi!"
 PER_free_elections_tt:0 "§YHangi adayın§! §Ydemokratik bir [PER.GetNonIdeologyName]'ı yönetmeye en uygun olduğunu seçmenize izin verecektir.§!"
 PER_fund_imperial_excellency:0 "İmparatorluk Mükemmeliyetini Fonla"
 PER_fund_imperial_excellency_desc:0 "İmparatorluk, servetimizi daha küçük komşularımıza gösterme yolunu benimsemiştir. Şimdi birazını sarayı iyileştirmek için harcamanın zamanı geldi. Daha fazla muhafız işe almak işi halledecek gibi görünüyor!"
 PER_fund_state_intelligence:0 "Devlet İstihbaratını Fonla"
 PER_fund_state_intelligence_desc:0 "Devlet istihbarat programımıza daha fazla para aktararak, ülkemiz içindeki potansiyel isyanları ve ayaklanmaları daha yakından izleyebilmeliyiz. Bunları daha başlamadan engelleyerek, ulusumuzun güvenliğini ve emniyetini sağlamaya devam ediyoruz."
 PER_future_of_war:0 "Savaşın Geleceği"
 PER_future_of_war_desc:0 "Sadece birkaç on yıl önce savaşlar hala insan ve atlarla, yetersiz topçular ve eski moda taktiklerle yapılıyordu. Bu modern zamanlarda, tank çağı üzerimizdedir. Bizi tehdit eden güçlere karşı durabilmek için askeri teknolojideki gelişmelerle ayak uydurmaya devam etmeliyiz."
 PER_german_non_aggression:0 "[GER.GetNonIdeologyName] ile Saldırmazlık Paktı Görüş"
 PER_german_non_aggression_desc:0 "Avrupa'da işler ısınmaya başlarken, bir taraf seçmemiz için baskı olabilir. Ancak, savaş çıkarsa [PER.GetNameDef]'ın tarafsız kalması önemlidir. Kitlesel sanayileşmeleri göz önüne alındığında, güvenliğimizi sağlamak için [GER.GetNameDef]'a bir saldırmazlık paktı önermeliyiz."
 PER_german_tanks:0 "Alman Tank Lisanslarını Satın Al"
 PER_german_tanks_desc:0 "Kendi mekanize birliklerimizi tasarlamayı ve üretmeyi düşünmeden önce, tank üretimiyle tanınan ülkelere yönelmeliyiz. [GER.GetNameDef] ile temasa geçerek, düşman hatlarını tereyağından keskin bir bıçak gibi yaracak güçlü tanklar üretebiliriz."
 PER_glory_of_cyrus:0 "Büyük Kiros'un Zaferi"
 PER_glory_of_cyrus_desc:0 "Savaş hedeflerimiz tamamlandı ve topraklar [PER.GetAdjective] egemenliği altında güvence altına alındı, silahlı kuvvetlerimizin çalışkanlığı ve cesareti sayesinde [PER.GetNameDef]'a refahın yeni bir çağını getirdik. Sonunda, [PER.GetNameDef] bir kez daha medeniyetimizin kurucusu Büyük Kiros'un ihtişamına layık olabilir. Kiros'a zafer! Şah'a zafer!"
 PER_half_stability_tt:0 "§Rİstikrarımız %50'nin altına düştü! %20'nin altına inerse devrim riski doğar!§!"
 PER_his_fathers_footsteps:0 "Babasının Ayak İzlerinde"
 PER_his_fathers_footsteps_desc:0 "Rıza Şah Pehlevi'nin trajik ölümünün ardından, oğlu Muhammed Rıza Pehlevi, [PER.GetNameDef]'ın lideri olarak görevi devraldı. Genç bir kral olmasına ve yönetmek arzusu olmamasına rağmen, babasının yolunu takip etmek ve [PER.GetNameDef]'a zafer getirmek için ayağa kalkmalıdır."
 PER_hormuz_crisis:0 "Hürmüz Krizi"
 PER_hormuz_crisis_desc:0 "Emperyalistler geri adım atıyor, şimdi onları bölgeden çıkarmak için her cepheden saldırı tehdidiyle baskı yapma zamanıdır. Süreci, Hürmüz Boğazı'nı emperyalist deniz trafiğine kapatarak başlatacağız."
 PER_hormuz_crisis_tt:0 "§YArabistan veya Basra Körfezi'ndeki tüm sömürgeci güçler, bölgedeki topraklardan çekilmelerini isteyen bir etkinlik alacak. Reddederlerse, onlara savaş ilan etme fırsatımız olacak.§!"
 PER_imperial_excellency_tt:0 "§Yİmparatorluk Muhafızlarını Genişlet§! Milli Hedefi tamamlandığında, §Y[ROOT.capital.GetCapitalVictoryPointName]§!'da §Yİran İmparatorluk Muhafızları§!'ndan §Yiki§! birim işe alınacak."
 PER_imperial_expansionism:0 "İmparatorluk Yayılmacılığı"
 PER_imperial_expansionism_desc:0 "Yeni imparatorluğumuzu mevcut sınırlarımızın ötesine genişletmeye başlamanın zamanı geldi. Savaş makinemizi hazırlamalı, nüfusumuzu görevlerini yapmaya çağırmalı ve [PER.GetAdjective] İmparatorluğu'nun hak ettiğimizi iddia etmeye hazır olduğunu dünyaya göstermeliyiz."
 PER_imperial_funded_universities:0 "İmparatorluk Fonlu Üniversiteler"
 PER_imperial_funded_universities_desc:0 "[PER.GetNameDef]'ın bu dünyanın büyük devleri arasında durabileceğini kanıtlama çabasıyla, Şah ülkenin üniversitelerini finanse etmek için büyük bir bağış bağışlamıştır. Bu cömert hediye ile, halkımız daha kaliteli yüksek öğrenime daha fazla erişebilecektir."
 PER_import_rocketry:0 "Roketçilik Tasarımlarını İthal Et"
 PER_import_rocketry_desc:0 "Savaş inanılmaz bir hızla gelişiyor. Diğer uluslar savaş alanında kullanılmak üzere roket teknolojisi geliştirmeye başlarken, kendi harika silahlarımızı üretmek için gerekli tasarımları ithal ederek bu gelişmelere ayak uydurmaya çalışmalıyız."
 PER_increase_education_funding:0 "Eğitim Fonlarını Artır"
 PER_increase_education_funding_bonus:0 "Eğitim Fonlarını Artırma"
 PER_increase_education_funding_desc:0 "Rıza Şah'ın modernizasyon girişiminin bir parçası olarak, ülke içinde eğitimin kalitesini artırmaya vurgu yapılmıştır. Geleneksel geçmişimizden uzaklaşarak, hem erkekler hem de kadınlar için ücretsiz, zorunlu eğitim kurmayı ve özel dini eğitim kurumlarını kapatmayı hedefliyoruz."
 PER_increase_faculty_staffing_budget:0 "Kadro Bütçesini Artır"
 PER_increase_faculty_staffing_budget_desc:0 "Teknolojik üstünlüğümüzü koruyup geride kalmamak için ülkemizin en zeki insanlarını cezbetmeyi garanti altına almalıyız. Maliyeti yüksek olabilir, ancak teknolojik durgunluğun bedeli çok daha ağır olacaktır."
 PER_increase_faculty_staffing_budget_tt:0 "§Y$PER_technological_modifier$§! değerini şu kadar değiştir:\n"
 PER_increase_heavy_arms:0 "Ağır Silah Tesislerini Artır"
 PER_increase_heavy_arms_desc:0 "Silahlı kuvvetlerimiz büyüdükçe, bazı ağır makinelerimizi üretmek için geniş tesislere olan ihtiyacımız da artmaktadır. Bu aynı zamanda kendi topçu tasarımlarımızı yapmamızın önünü açacak, yani birliklerimizi desteklemek için artık yabancı güçlere güvenmek zorunda kalmayacağız. Bu aynı zamanda savaş planlarımızı topçu odaklı bir cepheye göre ayarlamamıza da izin verecektir."
 PER_increase_military_funding:0 "Askeri Fonları Artır"
 PER_increase_military_funding_desc:0 "Liderimiz Rıza Şah Pehlevi, prestijli Pers Kazakları'nın mezunudur. Hükümetteki hiç kimse [PER.GetNameDef]'ın askeri yeteneklerini artırmaya hevesli olduğuna şaşırmamalı. Bu, birliklerimizin kalitesini artırmak ve askeri mühimmat üretimini artırmak için mevcut olanı finanse etmekle başlar."
 PER_increase_oil_sales:0 "Petrol Satışlarını Artır"
 PER_increase_oil_sales_desc:0 "Petrol rezervlerimiz konusunda zaten [ENG.GetNameDef] ile ortaklık içindeyiz. Yeni çıkarılan kaynaklarımızı kullanarak onlara yaptığımız satışları artırmak mantıklı olacaktır. Sonuçta bu karşılıklı fayda sağlayan bir anlaşma."
 PER_industrial_aid:0 "Sanayi Yardımı"
 PER_industrial_aid_desc:0 "[SOU.GetNameDef]'daki yoldaşlarımız, öncelikle tarımsal bir ekonominin dikkatli planlama ile hızla sanayileştirilebileceğini gösterdi. Onlara ulaşmalı ve bu konudaki uzmanlıklarını paylaşmaya istekli olup olmadıklarını görmeliyiz."
 PER_industry_shortcut:0 "Ekonomi"
 PER_infantry_equipment_bonus:0 "Piyade Silahlarını Güçlendirme"
 PER_international_solidarity:0 "Uluslararası Dayanışma"
 PER_international_solidarity_desc:0 "Sınırlarımız içindeki emperyalist prangalardan kurtulmuş olsak da, emperyal güçler bölgemizden çıkarılmadıkça gerçekten özgür olamayız. Ancak henüz tam bir çatışmaya hazır değiliz. Bu nedenle, onların bölgedeki varlıklarını baltalamaya başlayacağız."
 PER_intervene_in_central_asia:0 "Büyük İran Diasporasını Koru"
 PER_intervene_in_central_asia_desc:0 "[SOU.GetAdjective] kontrolünü Orta Asya üzerinde zayıflattık. Dahası, onlar dünya çapındaki çatışmalarla meşgul. Bu nedenle, onları bölgeden bir daha geri gelmemek üzere çıkarmak için bu anı kullanmalıyız."
 PER_intervention_in_iraq:0 "[IRQ.GetNonIdeologyName]'a Müdahale"
 PER_intervention_in_iraq_desc:0 "[IRQ.GetNonIdeologyName], Batılı emperyalistlerin harita üzerinde çizdiği sınırlardan ibaret yapay bir devlettir. Böyle bir ulusun varlığını sürdürmesi mümkün değildir ve toprakları hak sahiplerine, yani bize iade edilmelidir."
 PER_invading_country_flag:0 "[PER.GetNameDef]'a Karşı İşgale Öncülük Ediyor"
 PER_invasion_of_india:0 "Hint Alt Kıtası'nı İşgal Et"
 PER_invasion_of_india_desc:0 "[RAJ.GetNameDef]'ı işgal etme planlarımız şimdiye kadarki en büyük hedeflerimizden biri olma potansiyeline sahip, ancak birliklerimiz arasında bunun tehlikeli bir operasyon olacağına dair hiçbir şüphe yok. Hindistan'ı tehdit ederek, [ENG.GetAdjective]ların gazabını üzerimize çekeceğiz. Eğer bu bir sorun değilse, o zaman Hindistan'ı işgal etme işlemine devam edelim."
 PER_invest_in_univerity_facilities:0 "Üniversite Tesislerine Yatırım Yap"
 PER_invest_in_univerity_facilities_desc:0 "Eğer teknolojik olarak rekabet etmeyi umuyorsak, öğrenciler, profesörler ve bilim insanları için mevcut tesislere gereken önemi vermeliyiz. En parlak zihinlerimizin, uygun ekipman eksikliği gibi önemsiz engellerle kısıtlanmasına izin veremeyiz."
 PER_invite_british_investors:0 "[ROOT.OVERLORD.GetAdjective] Yatırımcıları Davet Et"
 PER_invite_british_investors_desc:0 "Ekonomimizi iyileştirmek ve işgal sonrasında yeniden inşa etmek için, [ROOT.OVERLORD.GetNameDef]'ı sanayimizi yeniden rayına oturtmaya yardımcı olacak yatırımcılarla bize destek sağlaması için lobi yapmayı deneyebiliriz."
 PER_invite_oil_nations:0 "Petrol Üreten Ülkeleri Davet Et"
 PER_invite_oil_nations_desc:0 "OPEC şimdiye kadar küresel petrol pazarında kâr elde etmede başarılı oldu, ancak örgütümüzün büyüme potansiyeli var. Dünya genelindeki diğer petrol üreten ülkelerle temasa geçelim ve onlardan OPEC'le el ele vermelerini isteyelim."
 PER_iran_first:0 "[ROOT.GetNonIdeologyName] Önce Gelir"
 PER_iran_first_desc:0 "İran halkından başka hiç kimse değerlerimizi ve kültürümüzü yeterince koruyamaz. Bu nedenle, kendi hedeflerimizin peşinden gidecek ve dünyayı irademize boyun eğdireceğiz."
 PER_iran_for_iranians:0 "[PER.GetNonIdeologyName] [PER.GetAdjective]lar İçindir"
 PER_iran_for_iranians_desc:0 "Emperyalist efendilere teslim olmak ve egemenliğimizi yok etmek isteyenlere topraklarımızı bırakmak gerçekten utanç vericiydi. Ancak doğru olan bir şey varsa, o da özerklik arzumuzun asla ölmeyeceğidir. Artık ayaklanma ve bağımsızlık ilan etme zamanıdır!"
 PER_iranian_culture:0 "Aşırı Milliyetçileri Birleştir"
 PER_iranian_culture_desc:0 "Politikacıların ve Şah'ın tüm söylemlerine rağmen, hiçbiri kültürel mirasımızı ve toprak bütünlüğümüzü korumak için gerekeni yapmaya istekli değil. Dağınık yazarları ve milliyetçileri, ulusu eski ihtişamına kavuşturacak yeni bir siyasi hareket altında birleştireceğiz."
 PER_iranian_industrialization:0 "Sanayileşme"
 PER_iranian_industrialization_desc:0 "Ekonomimizi modernleştirmek için yabancı güçlere bağımlı olmayacağız. Bunun yerine, halkımızın keşfedilmemiş potansiyelini kullanarak modernleşmeye giden kendi yolumu bulacağız."
 PER_iranian_nuclear_program:0 "[ROOT.GetAdjective] Nükleer Program"
 PER_iranian_nuclear_program_desc:0 "Kendi atom silahı programımıza başlamak, [ROOT.GetNameDef]'ı zayıf ve önemsiz bir ulustan, olması gereken güçlü bir dünya devletine dönüştürmek için çok önemli bir adımdır."
 PER_iranian_revolutionary_vanguard:0 "İran Devrimci Öncüsü"
 PER_iranian_revolutionary_vanguard_desc:0 "Bizden çok daha güçlü süper güçlere karşı ayakta durabilmek için ordumuzu genişletmeli ve nüfusu seferber etmeliyiz. Bu bizi bu tehditlerle eşit seviyeye getirmeyecek olsa da, onların yolunda sadece bir engel olmaktan daha fazlası yapacaktır."
 PER_iranian_socialism:0 "İran Sosyalizmi"
 PER_iranian_socialism_desc:0 "Devletin uzun vadeli güvenliğini sağlamak için, bölgedeki benzer düşünceli hükümetlerle yeni ittifaklar kurmalıyız."
 PER_iranian_socialist_revolution:0 "İran Sosyalist Devrimi"
 PER_iranian_socialist_revolution_desc:0 "İran işçi sınıfının zayıf Şah rejimini ve onun burjuva zorbalarını ezmek için ayaklanma anı geldi. Yerine, halkın kendisi tarafından yönetilen yeni bir işçi ve köylü devleti yükselecek."
 PER_iranian_socialist_revolution_tt:0 "\n§RKomünist parti %50'den az desteğe sahipse, Şah bize karşı bir iç savaş başlatacak!§!"
 PER_islamic_restoration:0 "Garbzedegi'ye Direniş"
 PER_islamic_restoration_desc:0 "Son zamanlardaki batılılaşma tutkusu, İslami kültürümüzün ve İran toplumunun temellerini aşındırıyor. Hükümet, batının ahlaksızlıklarına ve inançsız ideolojilerine erişimi kısıtlamak için daha fazlasını yapmalıdır."
 PER_islamic_revolution:0 "İslam Devrimi"
 PER_islamic_revolution_desc:0 "Şah'ın günleri sayılı. Camiler değişim çağrılarıyla yankılanıyor ve sokaklar artık onun emrinde değil. Eski düzen yıkılacak."
 PER_islamic_revolution_tt:0 "[PER.GetNameDef] ile İslam Devrimcileri arasında §Rİç Savaş§! başlatır!"
 PER_islamic_solidarity:0 "İslami Kardeşlik"
 PER_islamic_solidarity_desc:0 "Şii İslam dışındaki mezheplerle her zaman aynı fikirde olmasak da, ulusal işlerimize müdahale etmeye devam eden Batı Avrupa'nın emperyalist güçlerinde ortak bir düşmana sahip olduğumuzu inkar edemeyiz. Ama birlikte, onları topraklarımızdan bir kez ve sonsuza kadar çıkaracağız."
 PER_land_reform:0 "Toprak Reformu"
 PER_land_reform_desc:0 "Devrim başarılı olduğuna göre, ekonomiyi feodalizmin zincirlerinden kurtaracak kapsamlı toprak reformları uygulayacağız."
 PER_last_thousand_years:0 "Bin Yıl Sürecek Bir İmparatorluk"
 PER_last_thousand_years_desc:0 "Ulusumuzu iyileştirmek ve geliştirmek için yaptığımız tüm sıkı çalışma ve adanmışlık sayesinde, nihayet [PER.GetNameDef]'ın zamanın testine dayanacağı ve dünyanın sahnesinde modern ve güçlü bir ülke olarak duracağı bir noktaya ulaştık. Nihayet Ahameniş atalarımızın ihtişamını geride bıraktık!"
 PER_legacy_of_gilani:0 "Ozra Gilani'nin Mirası"
 PER_legacy_of_gilani_desc:0 "Ozra Gilani, İmparatorluk [PER.GetAdjective] Hava Kuvvetleri'ne katılan ilk kadındı ve böylece silahlı kuvvetlerimizde daha kapsayıcı olduğumuz bir gelecek için bir emsal oluşturdu. Kadınların askeriyemizle ilgili rollerini tanımlamak ve onların da pilot olarak uçmalarına izin vermek için çalışmalıyız. Onlar da ülkelerine iyi hizmet etme hakkına sahip olmalıdır."
 PER_legacy_of_greatness:0 "Büyüklük Mirası"
 PER_legacy_of_greatness_desc:0 "Destekçilerine hiçbir şekilde sürpriz olmayan bir şekilde, Pehlevi hanedanı nesiller boyu sürecek olanlardan biri olmaya mahkumdur. Çalkantılı zamanlar önümüzde olsa da, Şah ve oğlunun [PER.GetNameDef]'ı refahın altın çağına götürmek için hazırlandığı açıktır."
 PER_legacy_of_greatness_tt:0 "§Y$PER_legacy_of_greatness_modifier$§! değerini değiştir:"
 PER_limit_foreign_influence:0 "Yabancı Etkiyi Sınırla"
 PER_limit_foreign_influence_desc:0 "Çok uzun zamandır, [PER.GetNameDef] yabancı güçlerin insafına kalmıştır. Kaynaklarımıza el koyuyorlar ve doğal zenginliklerimizi paylaşmamızı talep ediyorlar. Artık [PER.GetNameDef]'ın kendi ayakları üzerinde durmasının ve bu yabancıların ulusumuz üzerindeki etkisini sınırlamanın zamanı geldi."
 PER_lobby_military_dissidents:0 "Tudeh Askeri Ağı"
 PER_lobby_military_dissidents_desc:0 "Tudeh Partisi'nin askeriye içinde yetkili pozisyonlarda birçok üyesi bulunmaktadır. Belki onları davamıza kazanabilir ve zamanı geldiğinde Şah'ı baltalamak için kullanabiliriz."
 PER_luftwaffe_planes:0 "Luftwaffe Uçaklarını Satın Al"
 PER_luftwaffe_planes_desc:0 "Olağanüstü uçaklar söz konusu olduğunda, [GER.GetNameDef]'ın Luftwaffe'si en iyilerinden biridir. [GET.GetNameDef] ile zaten yakın bağlarımız olduğu için, onlara ulaşmak ve artık ihtiyaç duymadıkları fazla uçakları satın almak mantıklıdır."
 PER_march_on_saadabad:0 "Saadabad'a Yürüyüş"
 PER_march_on_saadabad_desc:0 "Rejim şikayetlerimizi ele almayı başaramadı, bu nedenle Sa'dabad kompleksine yürüyüp Şah'a bir ültimatom vereceğiz. Ya rotayı değiştirip egemen olarak kalacak ya da hareketimizin öfkesiyle yüzleşecek."
 PER_march_to_nile:0 "Nil'e Uzun Yürüyüş"
 PER_march_to_nile_desc:0 "Kuzey Afrika'daki eski Pers topraklarını geri almak için, nihayetinde Mısır'ı işgal etmeden önce [ENG.GetAdjective] Kuzey Afrika'sından geçmeliyiz. Bu şüphesiz bizi [ENG.GetNameDef] ile savaşa sokacaktır, ancak kendimizi bölgedeki baskın emperyal güç olarak kabul ettirmek istiyorsak, bu bir riski almamız gerekir."
 PER_memphis_initiative_tt:0 "Fethedilen toprakları ulusumuza entegre etmemizi sağlayan §YMemphis Girişimi§! kararlarının kilidini açar."
 PER_merchant_navy:0 "Ticaret Donanması"
 PER_merchant_navy_desc:0 "Deniz yoluyla kaynakların taşınması, [PER.GetNameDef]'ın hayatta kalması için çok önemlidir. Bu nedenle, askeriyemizi destekleyebilecek profesyonel bir ticaret donanması kurmak son derece önemlidir."
 PER_metropolitan_iran:0 "Metropoliten [ROOT.GetNonIdeologyName]"
 PER_metropolitan_iran_desc:0 "Sonunda, büyük kalkınma çabalarından sonra [ROOT.GetNonIdeologyName]'ın metropoliten bir ulus olarak kabul edilebileceği bir noktaya ulaştık. Şehirlerimiz endüstri ve hayatla dolup taşıyor, bizi gelecekte başarıya hazırlıyor."
 PER_middle_east_protectorate:0 "Orta Doğu Üzerinde Himaye Kur"
 PER_middle_east_protectorate_desc:0 "Savaş sona erdiğinde, [PER.GetNameDef] çevresindeki topraklarda yer alan bazı ulusları güvence altına almayı başardık. Artık onların Hakim Devleti olarak görevimiz, bu halkları başka herhangi bir eski işgalci güce karşı korumaktır. Birileri bu toprakları elimizden almak isterse, denemelerini memnuniyetle karşılarız."
 PER_middle_east_protectorate_faction:0 "Ortadoğu Himayesi"
 PER_military_excellency:0 "[PER.GetAdjective] Askeri Mükemmeliyeti"
 PER_military_excellency_desc:0 "Kazanan bir ordu söz konusu olduğunda, en iyi eğitilmiş olan güç üstün gelecektir. Katı ve disiplinli bir eğitim, mükemmel ekipman ve durdurulamaz taktiklerle, [PER.GetAdjective] ordusunun hesaba katılması gereken bir güç olduğunu dünyaya kanıtlayalım."
 PER_military_high_schools:0 "Askeri Liseler Kur"
 PER_military_high_schools_desc:0 "İyi eğitimli bir daimi ordu gençliğimizle başlar. Gençlerimizi askeri mükemmellik konusunda eğiterek, gelecekte başarı için kendimizi hazırlayacağız. Birkaç yıl alacak ama sonunda bölgenin en büyük ordusuna sahip olacağız."
 PER_modern_cataphract:0 "Modern Katafrakt"
 PER_modern_cataphract_desc:0 "Katafrakt, eski zamanlarda topraklarımızda ortaya çıkan zırhlı ağır süvari biçimiydi. Hem Ahameniş hem de Sasani imparatorlukları bu güçlü atları savaş alanında kullandı. Onlardan ilham alarak, süvari savaş tarihimizi yüceltecek motorize bir dev yaratabilmeliyiz."
 PER_modernize_iran_economy:0 "[PER.GetNameDef] Ekonomisini Modernize Et"
 PER_modernize_iran_economy_desc:0 "Daha endüstriyel dostlarımızın yardımıyla, mevcut ekonomimizi modernize edebildik. Fabrika katları dönerken ve halkımız sıkı çalışırken, yakında dünyanın geri kalan büyük uluslarıyla birlikte bir endüstriyel güç merkezi olarak duracağız."
 PER_modernizing_iran:0 "[ROOT.GetNonIdeologyName]'ı Modernleştirme"
 PER_modernizing_iran_desc:0 "Çok uzun süredir [ROOT.GetNonIdeologyName] düzensizlik ve önemsiz çekişmelerle engelleniyor. Zamanın testine dayanacak bir ulus inşa etmek istiyorsak kendi kendimize yetmeyi öğrenmeliyiz. Birlik temelinde bir gelecek inşa edelim ve modern çağı benimseyelim."
 PER_modify_opposition_tt:0 "§Y$PER_opposition_modifier$§! değerini şu kadar değiştir:"
 PER_motorize_infantry:0 "Piyadeyi Motorize Et"
 PER_motorize_infantry_desc:0 "Zamanın önünde olmalıyız ve bunu yapmak için, düzenli birliklerimizi mekanize etmek, böylece tanklarımızın yanında savaş alanına hücum edebilmeleri, korunmalı ve yıkım yapmaya hazır olmaları çok önemlidir."
 PER_motorized_infantry_bonus:0 "Zırhlı Modernizasyon Girişimi"
 PER_national_bank:0 "[ROOT.GetNonIdeologyName] Ulusal Bankası'nı Güçlendir"
 PER_national_bank_desc:0 "Ekonomik olarak, batılı rakiplerimize kıyasla öne çıkamadık. En hafif tabirle talihsiz bir durum, ama bunu değiştirebiliriz. İlk olarak, [ROOT.GetNonIdeologyName] Ulusal Bankası'nı güçlendirmeli ve özellikle kırsal nüfusumuz için daha erişilebilir hale getirmeliyiz."
 PER_national_museum:0 "Ulusal Müze'yi Aç"
 PER_national_museum_desc:0 "Tarihimizi belgelemek önemli, özellikle de [ROOT.GetNonIdeologyName]'ın yüzyıllar boyunca dokuduğu zengin dokuyu göz önüne alındığında. Tahran'da bir müze açma planları yıllardır var - artık bunları uygulamanın zamanı geldi."
 PER_nationalize_oil_fields:0 "Petrol Sahalarını Millileştir"
 PER_nationalize_oil_fields_desc:0 "Petrolümüzü açgözlü uluslarla yapılan adaletsiz anlaşmalarla ticaret ederek yıllar harcadık. Artık [PER.GetNameDef]'ın petrol üretimini millileştirme zamanı geldi, böylece kendi doğal kaynaklarımız üzerinde nihayet tam kontrole sahip olacağız."
 PER_naval_academy_random_admirals_tt:0 "En fazla §Yüç§! rastgele seçilmiş deniz lideri §G+1§! koordinasyon becerisi kazanacak"
 PER_navy_shortcut:0 "Donanma"
 PER_negotiate_tt:0 "Düşmanlarımızla §Ybarış§! görüşmeleri yapmayı deneyecek, sonuçta [ENG.GetFlag]§Y[ENG.GetNameDef]§!'in §Rkuklası§! haline gelebilir ve [SOU.GetFlag]§Y[SOU.GetNameDef]§!'e toprak kaybedebiliriz!"
 PER_negotiate_with_america:0 "Amerika ile Müzakere Et"
 PER_negotiate_with_america_desc:0 "[USA.GetNameDefCap], atom teknolojisinin geliştirilmesi açısından dünya lideri olduğunu göstermiştir; dünya sahnesinde ilgili kalmak için verdiğimiz mücadelede eğrinin önünde kalmak için çok önemli olabilecek yenilikler. Kendi nükleer programımızı geliştirmemize yardımcı olmalarını istemek için diplomatik bir heyet göndermeliyiz."
 PER_neutral_shortcut:0 "Siyaset:\nPehlevi Hanedanı"
 PER_new_shah_tt:0 "§Y$PER_mohammed_reza_pahlavi$§!, §Y$PER_neutrality_party$§!'nin lideri olur."
 PER_non_lethal_takeover:0 "Barışçıl Darbe"
 PER_nuclear_program:0 "[PER.GetAdjective] Nükleer Programı"
 PER_officers_to_italy:0 "Subayları İtalya'da Eğitmek İçin Gönder"
 PER_officers_to_italy_desc:0 "[ITA.GetNameDefCap], şu anda tersanelerimizde bulunan gemilerden bazılarını ilk elde ettiğimiz yerdir ve bu nedenle, denizcilik gelişimi söz konusu olduğunda doğal olarak bir bağlantımız vardır. [ITA.GetAdjective] hükümetine ulaşmalı ve subaylarımızı denizcilik eğitimi için oraya gönderme talebinde bulunmalıyız."
 PER_oil_and_rubber_industry:0 "Sanayiyi Çeşitlendir"
 PER_oil_and_rubber_industry_desc:0 "Ülkemizde büyük miktarda keşfedilmemiş petrol rezervi bulunsa da, ekonomimizin tamamen onu başka yerlere ihraç etmeye bağımlı hale gelmesine izin vermemeliyiz. Bu nedenle, yerel tüketime uygun ürünler yapmak için sanayimizi çeşitlendirmeliyiz."
 PER_oil_baron:0 "Kendini Bir Petrol Baronu İlan Et"
 PER_oil_baron_desc:0 "Petrolümüzü dünyada süren savaşı finanse etmek için kullanmak yerine, kendi kullanımımız için saklamak daha iyi olur. Eğer petrolü [ROOT.GetNonIdeologyName]'da stoklarsak, ona ihtiyacı olanlara şişirilmiş fiyatlarla satabiliriz."
 PER_one_for_all_all_for_one:0 "Hepimiz Birimiz, Birimiz Hepimiz İçin"
 PER_one_for_all_all_for_one_desc:0 "Her [PER.GetAdjective] silah kullanma konusunda tam eğitimli olmalı ve zamanı geldiğinde halkını savunmaya hazır olmalıdır. Bu görevden muaf kimse yoktur, Büyük Oyun'da hayatta kalma ve İran kimliğimizi koruma şansımız, [ENG.GetNameDefCap] ve [SOU.GetNameDef]'ın yetişemeyeceği oranda seferberliğe başlamaktır."
 PER_opec:0 "OPEC"
 PER_open_abadan:0 "Abadan Teknik Okulu'nu Aç"
 PER_open_abadan_desc:0 "Teknik eğitim, dünyanın endüstri devleri arasında yer almamıza yardımcı olacaktır ve bu yeni teknik okulu açarak, bu alanlarda çalışmak isteyenlere eğitim fırsatları sağlayabiliriz. Bu, kalkınmamızı ve modernizasyon sürecimizi hızlandırmamıza yardımcı olmalıdır."
 PER_operation_countenance_flag:0 "Operasyon Countenance"
 PER_operation_countenance_happened:0 "Operasyon Countenance Gerçekleşti"
 PER_our_own_artillery:0 "Kendi Topçumuzu İnşa Et"
 PER_our_own_artillery_desc:0 "Artık destek topçumuzun kendi türlerini etkili bir şekilde tasarlamak ve inşa etmek için gereken tesislere sahibiz. Artık kuvvetlerimizi güçlendirmek için ticarete güvenmek zorunda değiliz. Yeni toplarımız düşmanlarımızın üzerine ateş yağdıracak ve herhangi bir çatışmada hattı tutabileceğimizi garanti edecektir."
 PER_our_place_in_empire:0 "[ROOT.OVERLORD.GetNameDef] ile Yerimiz"
 PER_our_place_in_empire_desc:0 "[ROOT.OVERLORD.GetAdjective] hükümetiyle yapılan görüşmelerin ardından, en iyi hareket tarzının [PER.GetLeader]'ı mevcut pozisyonunun yanı sıra [PER.GetNonIdeologyName]'ın yeni Genel Valisi olarak atamak olacağına karar verdik. Bu, [ROOT.OVERLORD.GetNameDef]'ın bir parçası olarak görevlerimizi yerine getirirken çok daha fazla hareket alanı tanıyacaktır."
 PER_own_plane_designs:0 "Kendi Tasarımlarımızı Geliştir"
 PER_own_plane_designs_desc:0 "Yabancı uçak satın alımına kaynak ayırdıktan sonra, belki de mühendislerimizi hava kuvvetlerinde kullanılmak üzere kendi uçak tasarımlarımızı yapmaya atamanın zamanı gelmiştir."
 PER_pahlavis_deposed_flag:0 "Pahlavi Hanedanı Devrildi"
 PER_pahlavis_exiled_flag:0 "Pahlavi Hanedanı Sürgün Edildi"
 PER_pan_iranianism:0 "Pan-İranizm"
 PER_pan_iranianism_desc:0 "Sınırlarımızın ötesinde dağınık halde İrani halkların yerleşimleri bulunuyor ve bu durumun devam etmesine izin verilemez. Daha büyük bir İran kimliğini teşvik etme ve halkımızın birleşmesini sağlama zamanı geldi."
 PER_path_through_iraq:0 "Irak'tan Bir Yol Aç"
 PER_path_through_iraq_desc:0 "[IRQ.GetNameDefCap] Kuzey Afrika'yı fethetmek için geçit kapımızdır ve bu nedenle, ilk düşecek olan o olmalıdır. Bağdat sınırlarımıza bu kadar yakınken, ülkeye doğru ilerlemek ve toprakları üzerinde hak iddia etmekte sorun yaşamamalıyız."
 PER_perfect_iranian_airforce:0 "[PER.GetAdjective] Hava Kuvvetlerini Mükemmelleştir"
 PER_perfect_iranian_airforce_desc:0 "Hava yeteneklerimizi geliştirmek için harcadığımız tüm kaynaklar ve zamanla, artık en üste ulaşmanın ve kendimizi dünyanın en verimli hava kuvvetlerinden birine sahip olarak ilan etmenin zamanı geldi. Hiçbir şey pilotlarımızın beceri ve yeteneğini ya da uçaklarımızın mükemmelliğini geçemez."
 PER_persian_german_trade:0 "Pers-Alman Ticaret Odası"
 PER_persian_german_trade_desc:0 "[GER.GetNameDefCap], Büyük Savaş'taki yenilgisinin ardından hızla yeniden sanayileşmeyi başardı. [PER.GetNameDef]'ı modernleştirmeye çalışırken bu harika bir örnek teşkil edecektir. Yeni liderlerinin bize saygı duyduğu da görülüyor, bu da olumlu ilişkiler kurmamızı kolaylaştıracaktır."
 PER_persian_gulf_fleet:0 "Basra Körfezi Filosu"
 PER_persian_gulf_fleet_desc:0 "Basra Körfezi, deniz yoluyla dünyanın geri kalanına olan tek ve biricik erişim noktamızdır ve bu nedenle her ne pahasına olursa olsun korumaya değerdir. Eğitimimizi körfezdeki faaliyetlerimize özel olarak odaklarsak, güneyden gelen herhangi bir işgalcinin deniz yoluyla karaya çıkmasının zor olacağını garanti edebiliriz."
 PER_pilot_training:0 "Pilot Eğitim Programı"
 PER_pilot_training_desc:0 "Pilotların savaş uçağı kullanabilmek için sadece ham yeteneğe ihtiyacı yoktur. [PER.GetNameDef] için hayatlarını riske atmaya istekli olanlar için kapsamlı bir eğitim programı, gökyüzündeki güvenlikleri ve etkinlikleri için çok önemli olacaktır."
 PER_plant_resistance_cells:0 "Direnç Hücreleri Yerleştir"
 PER_plant_resistance_cells_desc:0 "Önleyici saldırımıza hazırlanmak için, komşu bölgelerde siyasi huzursuzluk yaratmak akıllıca olacaktır. [IRQ.GetNameDef] mükemmel bir seçim gibi görünüyor, aynı şekilde [AZR.GetNameDef], [GEO.GetNameDef], [ARM.GetNameDef] ve [TMS.GetNameDef]'ın işgal altındaki bölgeleri de."
 PER_post_war_spoils:0 "Savaş Sonrası Ganimetler"
 PER_post_war_spoils_desc:0 "Artık savaş sona erdiğine göre, [IRQ.GetNonIdeologyName] ve [AFG.GetNonIdeologyName] üzerindeki koruyucu işgalimizle ne yapacağımızı belirlemeliyiz. Müttefiklerimize yaptığımız başvuruların ardından, en iyi eylemin bu toprakları [PER.GetNameDef] yönetimine entegre etmek olduğuna karar verdik. Böylece, daha güçlü ve istikrarlı bir Orta Doğu sağlayabiliriz."
 PER_preemptive_invasion_of_iran_tt:0 "[PER.GetNameDef] teslim olduğunda, ülkeyi kukla yapacağız, sınırımızdaki birkaç eyaleti entegre edecek ve petrol açısından zengin [PER.GetAdjective] eyaletlerinde kaynak hakları elde edeceğiz. Ortak bir operasyon yürütmek için [SOU.GetAdjective] müdahalesi talep edebileceğiz."
 PER_preemptive_strike:0 "Önleyici Saldırı"
 PER_preemptive_strike_desc:0 "Hiç kimse egemenliğimizi tehdit etmeyecek. Bize açgözlü gözlerle bakanlara, [PER.GetNameDef]'ın askeri güçlerinin tam gücünü göstererek müdahale etmemeyi öğreteceğiz. İlk vuran biz olursak, hızlı ve ağır bir saldırıya karşı savunmaya hazır olmayacaklar."
 PER_preparatory_mobilization:0 "Hazırlık Seferberliği"
 PER_preparatory_mobilization_desc:0 "Hazırlanmayı başaramazsak, başarısızlığa hazırlanıyoruz demektir. Yabancı güçlerin [PER.GetNonIdeologyName]'a açgözlü gözlerle baktığı bir sır değil ve eğer almaya çalışırlarsa, biz de savaşarak düşeceğiz. Ordumuzu seferber etmek için hazırlıklar yaparak, düşmanlarımızın bize ne atabileceğine hazırlıklı olacağız."
 PER_prepare_for_worst:0 "En Kötüsüne Hazırlan"
 PER_prepare_for_worst_desc:0 "[PER.GetNameDef]'a bir işgal potansiyeli olduğunu öğrendiğimize göre, en kötüsü olursa hazırlıklara başlamamız ihtiyatlı olacaktır. Bunun geleceğini hissetmemize rağmen, teslim olup zayıf noktalarımızı göstermemize izin veremeyiz. Bunun yerine, önleyici saldırımız zamanı geldiğinde çabalarımıza yardımcı olacak güçlerimizi artırmalıyız."
 PER_price_stabilization:0 "Fiyat İstikrarı"
 PER_price_stabilization_desc:0 "Bankalar güçlendirildiğine göre, şimdi makul olmayan kazanç peşinde koşmaya karşı bir kampanya başlatmalıyız. Uymayan fabrika sahiplerini ve büyük zincir işletmelerini cezalandırabilir ve [ROOT.GetNonIdeologyName] genelinde mal fiyatlarını sabitleyebiliriz."
 PER_proclaim_greater_iran:0 "Büyük İran'ı İlan Et"
 PER_proclaim_greater_iran_desc:0 "Sınırlarımız tüm cephelerde hak ettikleri konuma getirildi ve halkımızı yabancı egemenliğinin zulmünden kurtardık. Artık zamanın testine dayanacak bir Büyük İran'ın doğuşunu nihayet ilan edebiliriz."
 PER_profit_from_war:0 "Savaştan Kar Et"
 PER_profit_from_war_desc:0 "Savaş para demektir ve şu anda dünyayı kasıp kavuran çatışmadan elde edilecek çok şey var. Teknoloji ilerledikçe, savaş makinesini beslemek için savaşan ulusların daha fazla petrole ihtiyacı var. Bu bizim için harika bir fırsat ve bundan yararlanmazsak aptal oluruz."
 PER_profit_from_war_tt:0 "Kararın kilidini açar: §Y$PER_profit_from_war_category$§! Bu, [PER.GetNonIdeologyName]'ın başka bir ülkeye kaynak hakları verirken offshore fabrikası kazanmasını sağlar."
 PER_promise_clergy_power:0 "Din Adamlarına Güç Sözü Ver"
 PER_promise_clergy_power_desc:0 "İslam, halkımızın birçoğu için toplumun temel taşıdır. Bu nedenle, inanç uygulayıcılarını aşağılamaya başlarsak halkın desteğini sürdürmeyi umut edemeyiz ve onları davamıza çekmek için daha fazlasını yapmalıyız."
 PER_promote_resistance_levant:0 "Anti-Emperyalist Direnişi Teşvik Et"
 PER_promote_resistance_levant_desc:0 "Emperyalistlerle başa çıkma çabalarımız genellikle ezici ateş güçleri nedeniyle sert direnişle karşılaşıyor. Ancak, düşman hatlarının arkasında silaha sarılacak insan eksik olmayacaktır."
 PER_propagate_political_literature:0 "Yerel Muhalefet Grupları Kur"
 PER_propagate_political_literature_desc:0 "Emperyal devletin kurumları bireye aşılmaz görünebilir, ancak gerçekte kaynakları ulus genelinde çok ince yayılmış durumda ve merkezi olmayan bir direniş hareketiyle başa çıkamaz. Değişimi etkilemek için bu zayıflıktan yararlanacağız."
 PER_propagate_political_literature_tt:0 "Potansiyel bir §Riç savaşta§! Şah'a katılmayacak eyaletlerde muhalefet grupları kurmak için §Y$PER_mass_protests$§! kararları açılacak."
 PER_purchase_foreign_ships:0 "Yabancı Gemiler Satın Al"
 PER_purchase_foreign_ships_desc:0 "Donanmamız birkaç yıl önce [ITA.GetNameDef]'den yeni, silahlı gemiler satın alınarak oluşturuldu. Diğer yabancı güçlere ulaşarak ve daha fazla gemi satın alarak deniz yeteneklerimizi artırabiliriz. Bu sadece uluslar arasındaki ilişkileri artıracaktır."
 PER_push_negotiations:0 "Müzakereleri Zorla"
 PER_push_negotiations_desc:0 "Göründüğü kadarıyla, işgali elimizden geldiğince uzun süre püskürtmeyi başardık. Ancak, çatışmayı doğrudan sona erdirmek için herhangi bir konumda değiliz. Bununla birlikte, egemenliğimizi korumak için bazı doğal kaynaklarımızı teklif etme kozuna sahibiz."
 PER_push_negotiations_tt:0 "Düşmanlarımıza, §Ybeyaz barış§! karşılığında çatışmanın başlatıcısına §Ykaynak hakları§! teklif eden bir §Yetkinlik§! gönderecek. Reddederlerse savaşta kalmaya devam edeceğiz."
 PER_push_to_deserts:0 "Kuzey Taarruzu"
 PER_push_to_deserts_desc:0 "Düşman güçleri öncelikle [PER.GetNameDef]'ın kuzey sınırlarından saldırıyor. Birliklerimizi bu bölgelere odaklamalı ve işgalcilerin daha fazla toprak kazanmasını engellemeliyiz. Ardından, savaşı onlara götürüp sınıra kadar geri püskürtmeliyiz."
 PER_push_to_mountains:0 "Güney Cephesi"
 PER_push_to_mountains_desc:0 "Görünüşe göre işgal [PER.GetNonIdeologyName]'ın güneyinde toprak kazandı. Onları püskürtmek istiyorsak, çabalarımızı düşmanları Basra Körfezi'ne kadar geri püskürtmeye odaklamalıyız. Zaman çok önemli, güçlerinin daha fazla toprak kazanmasına izin veremeyiz."
 PER_question_of_resources:0 "Kaynak Sorunu"
 PER_question_of_resources_desc:0 "Eski ortaklarımızdan gelebilecek bir işgalin çok muhtemel olduğunu, bunun [PER.GetNameDef]'ın kaynaklar açısından ne kadar zengin olduğundan kaynaklandığını anladık. Petrol sahalarımız paha biçilmezdir ve bu nedenle, birinin gelip bunu alması yüksek bir olasılıktır. Bunu yapmalarına izin verilemez, bu yüzden onlar bize saldırmadan önce bu potansiyel tehditleri bertaraf etmek için çalışalım..."
 PER_raf_planes:0 "RAF Uçaklarını Satın Al"
 PER_raf_planes_desc:0 "[ENG.GetNameDefCap], Kraliyet Hava Kuvvetleri'ne sahiptir ve yetenekleri ile becerileri çoğu ulus tarafından iyi bilinmektedir. Ancak, savaşları kazanmalarına yardımcı olan sadece pilotlarının becerisi değil, aynı zamanda uçaklarının kalitesidir. Onlara ulaşalım ve uçakları için bir sipariş verelim."
 PER_raiding_fleet_boost:0 "Uzman Akıncılar"
 PER_rally_ancient_history:0 "Antik Tarihin Etrafında Toplan"
 PER_rally_ancient_history_desc:0 "Pehlevi hanedanının genç saltanatının [PER.GetNameDef]'daki birçok kişiyi geleceğin ne getireceği konusunda gergin bıraktığı bir sır değildir. Milliyetçi gururu yaymak ve Şah'a olan güveni artırmak için en büyük şansımız, halkımıza ve dünyaya antik Pers tarihinin ne kadar inanılmaz olduğunu hatırlatmaktır. Ahameniş İmparatorluğu'nu kutlamanın zamanı geldi."
 PER_rally_bakhtiari_and_qashqai:0 "Bahtiyari ve Kaşkayları Bir Araya Getir"
 PER_rally_bakhtiari_and_qashqai_desc:0 "Rejim değişikliğinden memnun olmayan Bahtiyari ve Kaşkay kabile halkları yeni yasa devletine karşı direnişe başladı. Bunu kullanabiliriz ve eğer onları davamız etrafında toplarsak, bağımsızlık mücadelemiz kanlı bir hal alırsa bize yardımcı olacak daha fazla insana sahip olacağız."
 PER_rally_behind_mosaddegh:0 "Musaddık'ın Yanında Yer Al"
 PER_rally_behind_mosaddegh_desc:0 "Pahlavi rejiminin başından beri, Muhammed Musaddık Şah'ın yönetiminin birçok yönüne karşı çıkmıştır. Eğer gerçekten Pahlavi Hanedanı'na karşı durup yeni ve daha demokratik bir [PER.GetNonIdeologyName] yaratacaksak, belki de hareketimizi onun etrafında toplamalıyız."
 PER_rally_the_reformers:0 "Ulusal Cephe Kur"
 PER_rally_the_reformers_desc:0 "Şah'ın veya monarşi kurumunun ani bir şekilde sona ermesini görmek isteyen ülke genelinde birçok fraksiyon bulunmaktadır. Dünya istikrarsızlaşmaya başlarken, bu tür fraksiyonların harekete geçmesi için yeni fırsatlar ortaya çıkabilir."
 PER_rally_the_reformers_tt:0 "Muhalefet hareketimiz için bir operasyon üssü kurmak üzere §Y$PER_mass_protests$§! kararları açılacak."
 PER_rapid_appeasement_tt:0 "Kaynaklarımızı feda ederek devrimi şimdilik önlemeyi başardık."
 PER_rapid_industrialization:0 "Hızlı Sanayileşme"
 PER_rapid_industrialization_desc:0 "Modernizasyon, sanayileşmeye eşittir. Dünyadaki diğer büyük uluslarla aynı seviyeye ulaşmak istiyorsak fabrika üretimimizi hızla genişletmemiz gerektiği gerçeğinden kaçış yok."
 PER_reach_to_seperatists:0 "Ayrılıkçılara Uzan"
 PER_reach_to_seperatists_desc:0 "İşçi sınıfı, sosyo-ekonomik koşullarını tam olarak kabullenemedi ve bu nedenle Şah'ın kökleşmiş gücünü alt etmek için gereken güce sahip değil. Ancak, kuzeyde ve doğuda Azerbaycan veya Kürt duygularıyla hareketlenen birçok kişi davamıza kazanılabilir."
 PER_reach_to_seperatists_tt:0 "§YK*rdistan§! veya §YAzerbaycan§!'ın çekirdek eyaletleri olan tüm sahip olunan eyaletler bize katılacak ve gelecek iç savaşta birlik sağlayacaktır.\n\n§RBununla birlikte, bu odağı tamamladıktan sonraki iki yıl içinde bağımsızlık kazanmayı bekleyeceklerdir!§!"
 PER_rebuild_persepolis:0 "Persepolis'i Yeniden İnşa Et"
 PER_rebuild_persepolis_desc:0 "Persepolis, Ahameniş İmparatorluğu'nun törensel başkentiydi ve kalıntıları Marvdasht ovalarında bulunmaktadır. Kendi başına bir kültürel miras alanı olarak, kaynaklarımızı bu antik şehri yeniden inşa etmeye ve yenilemeye harcamak, onu on yıllar boyunca İmparatorluğumuzun bir simgesi olarak ayakta tutacak güçlü bir hareket olacaktır."
 PER_rebuilding_iran:0 "[PER.GetNonIdeologyName]'ı Yeniden İnşa Et"
 PER_rebuilding_iran_desc:0 "İşgal, sanayimizin ve altyapımızın büyük bir kısmını harap etti. Bu zamanı, ülkemizi eski ihtişamına kavuşturmak, parçaları toplamak ve yaralarımızı yalamak için odaklanmalıyız."
 PER_reclaim_turkish_peninsula:0 "Türk Yarımadasını Geri Al"
 PER_reclaim_turkish_peninsula_desc:0 "[TUR.GetNameDefCap], batıya doğru genişlememizin önünde duran bir engeldir. Anadolu bir zamanlar Pers toprağıydı ve onu geri alma zamanı geldi. Birliklerimizi konumlandıralım ve bir işgal için hazırlanalım!"
 PER_recruit_bakhtiari:0 "Bahtiyari Dağ Uzmanlarını İşe Al"
 PER_recruit_bakhtiari_desc:0 "Bahtiyariler, [PER.GetNonIdeologyName]'in doğusundan bir Lur kabilesidir. Ülkenin batısındaki birçok kişi onların etkileri konusunda endişeli olsa da, askeri kuvvetlerimizde onların göçebe yaşam tarzından yararlanılabilir. Kabilelerinin üyelerini işe alarak, dağ birliklerimize düşmanlarımıza karşı önemli bir avantaj sağlayabiliriz."
 PER_recruit_rebels_tt:0 "§YBahtiyari İsyancılar§! ve §YKaşkay İsyancılar§! tümen şablonlarının kilidini açar ve §Y[ROOT.capital.GetCapitalVictoryPointName]§!'da her birinden §Yiki§! birim işe alır."
 PER_reinforce_iranian_identity:0 "[PER.GetAdjective] Kimliğini Güçlendir"
 PER_reinforce_iranian_identity_desc:0 "Düşmanlarımıza boyun eğmek zorunda kalmamıza rağmen, hepimiz hala [PER.GetAdjective]'ız ve kimse bunu bizden alamayacak. Bu kimliği halka güçlendirmeli ve özgürlük arzumuzun hala kalplerimizde parlak bir şekilde yandığını onlara göstermeliyiz."
 PER_reinforced_identity:0 "Güçlendirilmiş Kimlik"
 PER_reinstate_qajars:0 "Kaçar Hanedanını Yeniden Tahta Çıkar"
 PER_reinstate_qajars_desc:0 "Kaçar Hanedanı, Pehlevî hanedanının iktidarından önce [PER.GetNameDef]'i yöneten son aileydi. 1925 yılında doğrudan Rıza Şah Pehlevî tarafından tahttan indirilen hanedanın muhtemel vârisi Muhammed Hasan Mirza, o zamandan beri [ENG.GetNameDef]'de sürgünde yaşamaktadır. Pehlevîler, [PER.GetNameDef]’de [ENG.GetAdjective] çıkarlarını koruyamamışken, belki de Kaçarları yeniden tahta çıkarmanın ve yeni efendilerimizi memnun etmenin zamanı gelmiştir."
 PER_reinstate_qajars_tt:0 "Qajar hanedanını [PER.GetNameDef] tahtına geri getirmemizi sağlayacak bir §Yetkinlik zinciri§! başlatacak."
 PER_reintegrate_anatolia:0 "Anadolu Topraklarını Yeniden Entegre Et"
 PER_reintegrate_anatolia_desc:0 "[TUR.GetNameDef]'ın eski sınırları içinde toprak fethettikten sonra, şimdi bu bölgeyi [PER.GetNameDef]'ın resmi, de jure toprağı olarak entegre etme pozisyonundayız."
 PER_reintegrate_anatolia_tt:0 "Fethedilen toprakları ulusumuza entegre etmemizi sağlayan §YAnadolu'yu Yeniden Entegre Et§! kararlarının kilidini açar."
 PER_reject_foreign_dominance:0 "Yabancı Egemenliğini Reddet"
 PER_reject_foreign_dominance_desc:0 "[SOU.GetNameDefCap] ve [ENG.GetNameDef] tam da kapımızın eşiğinde duruyor. Hemen harekete geçmezsek bir uydu devlet haline gelebiliriz. Artık kafamızı kumdan çıkarıp Büyük Oyun'un hamlelerine direnme zamanıdır."
 PER_reparations_tt:0 "Düşmanlarımıza §Ybarış§! ve §Ysavaş tazminatları§! talep eden bir §Yetkinlik§! gönderecek. Tazminatlar §Yfabrikalar§! ve saldırgana §Ydezavantaj§! şeklinde olacak. Eğer düşman ülke §Ydoğrudan komşu§! ise, bunun yerine sınır topraklarını §Ybize§! bırakacak."
 PER_republic_of_mahabad_tt:0 "[KUR.GetNameDef]'ı §YMahabad Cumhuriyeti§! olarak serbest bırakacak."
 PER_request_british_equipment:0 "[ROOT.OVERLORD.GetAdjective] Ekipman Talep Et"
 PER_request_british_equipment_desc:0 "Silahlı kuvvetlerimiz işgal sırasında ağır darbe aldı ve bu nedenle birliklerimizi yeniden tedarik etmek için çaresiziz. [ROOT.OVERLORD.GetNameDef]'ın yeni bir tebaası olarak, birliklerimizi önceki standartlarına geri getirmek için malzeme ve ekipman talep etmek için iyi bir konumdayız."
 PER_request_membership_allies:0 "Müttefiklerden Üyelik Talep Et"
 PER_request_membership_allies_desc:0 "Dünya çapında yükselen gerilimlerle birlikte, artık bir taraf seçme zamanı geldi. Batılı dostlarımızla yakınlaştığımız için, kendimizi onlarla aynı hizaya getirmek en mantıklı seçenek. Birlikte, faşizm tehdidini dünya çapında yok edebiliriz."
 PER_resistance_decisions_tt:0 "İşgal hazırlığı olarak komşu ülkelerde istikrarsızlık yaratmamızı sağlayan §YDirenç Hücreleri Dik§! kararlarının kilidini açar."
 PER_restructure_army:0 "Ordunun Yeniden Yapılandırılması"
 PER_restructure_army_desc:0 "Ordumuz, Kaçar hanedanı komutasında Rusya ile yıllarca süren savaşlar nedeniyle zayıflamıştır. Dünyanın bu günlerdeki durumu göz önüne alındığında, askeri güçlerimizi eski ihtişamlarına kavuşturmamız akıllıca olacaktır."
 PER_retake_north_iran:0 "Kuzey [PER.GetNonIdeologyName]'ı Geri Al"
 PER_retake_north_iran_desc:0 "İlk teslimiyet ve teslim çağrımız sırasında, kuzey topraklarımızı [SOU.GetNameDef]'a bırakmaktan başka seçeneğimiz yoktu. Artık daha fazla güç elde ettiğimize göre, bu işgalcilere karşı saldırıp hak ettiğimiz toprakları geri alma zamanı geldi."
 PER_reverse_engineer_tanks:0 "Yabancı Tankları Tersine Mühendislikle Çöz"
 PER_reverse_engineer_tanks_desc:0 "Yabancı güçlerden elde ettiğimiz tankları daha yakından inceleyerek nasıl çalıştıklarını ve gelecekte kullanılmak üzere kendi tasarımlarımızı nasıl üretebileceğimizi öğrenebiliriz. Bu, [PER.GetNonIdeologyName]'in kendi tank tasarımlarını geliştirme yolundaki ilk adımdır."
 PER_revive_old_ways:0 "Eski Yolları Canlandır"
 PER_revive_old_ways_desc:0 "Eğer dünya sahnesinde öne çıkmak istiyorsak, eski Pers İmparatorluklarının ideallerini sürdürmeye devam etmeliyiz. Bu nedenle, Zerdüştlüğü [PER.GetNameDef] için bir devlet dini olarak yeniden tanıtmak için çaba göstermeliyiz. Ülkenin doğusunda dolaşan daha küçük kabilelerden bazıları hala bu dini uyguluyor, bu yüzden bu antik teolojiyi canlandırmak imkansız değildir."
 PER_revolution_in_the_gulf:0 "Körfez'de Devrim"
 PER_revolution_in_the_gulf_desc:0 "Bölgedeki güç dengesi lehimize dönüyor. Avantajımızı kullanıp bölge genelinde anti-sömürgeci hareketleri teşvik etmeye başlamalıyız."
 PER_revolution_in_the_gulf_tt:0 "İşgal altındaki Basra Körfezi Devletleri'nde direnişi teşvik etmek için daha fazla §Y$PER_gulf_decisions_cat$§! kararı açılacak."
 PER_roll_back_reforms:0 "Ulusu Yeniden İnşa Et"
 PER_roll_back_reforms_desc:0 "Şah ulusu modernleştirmede bazı ilerlemeler kaydetmiş olsa da, reformlar yeterince derin değildi. Bizi eski ihtişamına kavuşturacak çok daha derin ve radikal bir gündem izleyeceğiz."
 PER_root_out_conspiracies:0 "Komploları Kökünden Kazı"
 PER_root_out_conspiracies_desc:0 "Yıllar boyunca, Rıza Şah Pehlevi'ye yönelik potansiyel suikast planları hakkında birçok söylenti olmuştur. Bu riski çok büyük olarak değerlendirdik ve bu nedenle, Şah'ın güvenliğini sağlamak için bu komploları kökünden kazımak son derece önemlidir."
 PER_royal_college_funding:0 "Tahran Üniversitesi'ni Kur"
 PER_royal_college_funding_desc:0 "Entelektüel gelişimimizi üst seviyede tutmak bizim için hayati önem taşır. Şah'ın hazinesinden aldığımız fonların bir kısmını eğitim kurumlarımıza aktararak, teknolojik ilerlemenin hızla değişen yüzüne ayak uydurabilecek bir konumda olacağız."
 PER_royal_visit_germany:0 "Almanya'ya Kraliyet Ziyareti"
 PER_royal_visit_germany_desc:0 "Rıza Şah'ın saltanatı boyunca, [GER.GetNameDef] lideriyle iyi ilişkiler sürdürdük. Bu, bizi ülkelerinde bir kraliyet ziyaretinde ağırlama arzularında yansıdı. Bunu kabul edersek, [GER.GetNameDef] ile ilişkilerimizi geliştirmeye devam edeceğimiz kesindir, ancak bunun bir yardım mı yoksa engel mi olacağı henüz belli değildir!"
 PER_saadabad_treaty:0 "Saadabad Paktı"
 PER_saadabad_treaty_desc:0 "Komşularımızla dost kalmakla kaybedecek hiçbir şeyimiz, kazanacak her şeyimiz var. Dostluğumuzu resmileştiren bir anlaşma fikri zaman zaman gündeme geldi ve artık inisiyatifi ele alıp bu dostluğun bir anlaşmaya dökülmesini sağlamanın zamanı geldi."
 PER_sea_specialization:0 "Filoda Uzmanlaşma"
 PER_second_warning_flag:0 "İslam Devrimi İkinci Uyarısı"
 PER_secularize_the_state:0 "Eyaleti Laikleştir"
 PER_secularize_the_state_desc:0 "Batılılaşma hamlemize başladığımızdan beri, [PER.GetNameDef] içinde din adamlarına karşı sürekli bir tepki var. İslam eyalet dinimiz olmaya devam ediyor, ancak batı dünyasına onların arasında durabileceğimizi kanıtlamak amacıyla, dini eyaletten ayırmanın ve bir modernleşme yolu izlemenin zamanı geldi."
 PER_secure_afghanistan:0 "Afganistan'ı Güvence Altına Al"
 PER_secure_afghanistan_desc:0 "[AFG.GetNameDefCap], [PER.GetNameDef]'ın doğuya açılan kapılarından biridir. Bu koridoru müttefiklerimiz için güvence altına almak son derece önemlidir. Ayrıca, [AFG.GetNameDef]'ın gözetimimiz altında korunmasını sağlayacaktır. Bu, elbette [AFG.GetAdjective] halkının iyiliği içindir."
 PER_secure_coastline:0 "Kıyı Şeridini Güvence Altına Al"
 PER_secure_coastline_desc:0 "İşgal Basra Körfezi'nden gelecek gibi görünüyor, öyleyse onlara doğrudan karşılık verelim ve düşmanın [PER.GetNonIdeologyName]'da herhangi bir ilerleme kaydetmesini engelleyelim. Bir çıkarma noktası hazırlamalarını engelleyebilirsek, onları izlerinde durdurmak için iyi bir konumda olacağız."
 PER_secure_iraq:0 "Irak'ı Güvence Altına Al"
 PER_secure_iraq_desc:0 "Müttefiklerimize karşı sorumluluklarımızın bir parçası olarak, [IRQ.GetNameDef]'ı her türlü yöntemle güvence altına almalıyız. Bu radikal önlem, [IRQ.GetAdjective] halkını dış tehditlerden korumayı ve bölgede birlik sağlamayı amaçlamaktadır."
 PER_shahanshah:0 "Şehinşah"
 PER_shahanshah_desc:0 "Şehinşah veya Kralların Kralı, [PER.GetNameDef]'ın bir hükümdarına verilen en yüksek unvandır. Mevcut hükümdarımız için kesinlikle uygun bir unvandır ve bir kez daha kullanıma sunulması bir onurdur."
 PER_shahbanu_tt:0 "Etkinlik alır: §YBir Şahbanu Seçmek§! Bu, bir kraliçe seçmenize ve onu §YSiyasi Danışman§! olarak kullanmanıza izin verecek."
 PER_shiraz_university:0 "Şiraz Üniversitesi'ne Fon Sağla"
 PER_shiraz_university_bonus:0 "Şiraz Üniversitesi’ne Fon Sağlandı"
 PER_shiraz_university_desc:0 "Yeni üniversitelere fon sağlarken, mezunlarının modern bir [ROOT.GetNonIdeologyName]'ın temellerini atmasını umduğumuz teknik okullar kurmaya odaklanmalıyız!"
 PER_soviet_alignment:0 "Sovyetler ile İttifak Kur"
 PER_soviet_alignment_desc:0 "Dünya hızla değişiyor ve düşmanlarımızı caydırmak için güçlü müttefiklere ihtiyacımız var. Tudeh Partisi, [SOU.GetNameDef] ile bağları olan tek sosyalist partidir ve bu nedenle onlarla güçlü bir ilişki kurabilir."
 PER_soviet_alignment_tt:0 "Eğer §Y[SOV.GetNameWithFlag]§! komünist ise bizim hizbimize davet edilecek."
 PER_soviet_iranian_oil_collaboration:0 "Sovyet-İran Petrol İşbirliği"
 PER_soviet_iranian_oil_collaboration_desc:0 "[ROOT.GetNameDefCap] ve sınırın öteki tarafındaki [SOU.GetNameDef]'daki dostlarımızın emrinde geniş petrol rezervleri bulunuyor. Petrol üretimimizi koordine edip genişleterek dünyanın en önemli kaynağı üzerindeki kontrolümüzü sağlamlaştırabiliriz."
 PER_special_forces_program:0 "Özel Kuvvetler Programı"
 PER_special_forces_program_desc:0 "Düzenli ön hat kuvvetlerimizin gidemeyeceği bazı yerler var ve bunu düzeltmek için bir özel kuvvetler programının oluşturulması son derece önemlidir. Yakında, kendilerine verdiğimiz herhangi bir zorlu görevi yerine getirebilecek özel birliklere sahip olacağız."
 PER_special_units:0 "İran Özel Operasyonları"
 PER_special_units_boost:0 "Özel Kuvvetler Programı"
 PER_special_units_desc:0 "Askeri yeteneklerimiz büyüdükçe, düzenli birliklerimizin yanı sıra özel birliklerimizi de düşünmemiz önemlidir. Bununla birlikte, istihbarat operasyonları, özel kuvvetler ve hatta deneysel silahlar dahil olmak üzere birçok yeni fırsat ortaya çıkacaktır."
 PER_spoils_of_war:0 "Savaşın Ganimetleri"
 PER_spoils_of_war_desc:0 "Bu savaştaki çabamız, çevredeki bölgede [PER.GetNameDef]'ın toprak güvence altına alması fikrine açık olan müttefiklerimiz tarafından fark edilmedi. Savaşın ganimetlerinden yararlanmak için harika bir fırsat."
 PER_stage_mass_protests:0 "Protestolar Düzenle"
 PER_stage_mass_protests_desc:0 "Halk Şah'ın mazeretlerinden ve seçkinlerin kökleşmiş gücünden bıktı. Artık hemen değişim talep etmek için sokaklara çıkma zamanıdır."
 PER_stage_mass_protests_tt:0 "Şah'a olan desteği düşürmek için §Y$PER_mass_protests$§! kararlarını açar."
 PER_stand_our_ground:0 "Mevzilerimizi Koru"
 PER_stand_our_ground_desc:0 "Komşularımızın ve ötesinin yaklaşan tehditleri sarsılmaz bir baskı uygulamaya devam ederken, hükümetimizde korku ve endişe kol geziyor. Ne olursa olsun mevzilerimizi korumalıyız. [PER.GetNameDef]'ın önümüzdeki on yılı atlatmasını sağlayacak önlemleri alma zamanı geldi."
 PER_stand_with_germany:0 "[GER.GetNameDef] ile Birlikte Dur"
 PER_stand_with_germany_desc:0 "Uzun yıllardır, [GER.GetNameDef] en büyük ticaret ortaklarımızdan biri olmuştur. Kendi fetih hedeflerine devam ederken, kendi beklentilerimizi korumak adına onlarla bir anlaşma yapmak ve saldırmazlık paktı kurmak akıllıca olacaktır."
 PER_stand_with_giants:0 "Devlerle Omuz Omuza"
 PER_stand_with_giants_desc:0 "Dünya bir bıçak sırtında dengeleniyor ve Avrupa'da güçlü uluslar arasında bir çatışma mayalanıyor. Bu barut fıçığının fitili yavaşça yanarken, [PER.GetNameDef]'ı bu dünyanın devleri arasında yer alabileceği ve modern, ilerici bir toplum olarak zamanın testine dayanabileceği bir seviyeye yükseltmek için hazırlanmalıyız."
 PER_stand_with_giants_tt:0 "§Y$PER_stand_with_giants_modifier$§! değerini değiştir:"
 PER_state_atheism:0 "Tam Laikleştirme"
 PER_state_atheism_desc:0 "Modern bir [PER.GetNameDef]'ta, dinin eskiden olduğu kadar büyük bir role ihtiyacı yoktur. Onu günlük yaşamlarımıza dahil etmek yerine, modernizasyon girişimlerimize odaklanmamızı sağlamak için halkımız arasında bir tür ateizmi teşvik etmeliyiz. Bu, mevcut din adamlarımızı üzecektir, ancak."
 PER_strategic_bombing:0 "Stratejik Bombardıman"
 PER_strategic_bombing_desc:0 "Savaşlar sadece gökyüzünde kazanılmaz, aynı zamanda rakibin ekonomik ve endüstriyel yeteneklerini ezerek de kazanılır. Stratejik bombardımana odaklanalım ve onların tesislerini bize karşı kullanabilmelerinden önce yok edelim."
 PER_strengthen_iranian_parliament:0 "İran Parlamentosunu Güçlendir"
 PER_strengthen_iranian_parliament_desc:0 "Şah'ın güçleri artık kontrol altına alındığına göre, gücü seçilmiş parlamentoya geri getirerek demokratik sürecimizi iyileştirebiliriz."
 PER_strengthen_iranian_parliament_tt:0 "\n\n§REğer demokratik parti %30'dan az desteğe sahipse, Şah bize karşı bir iç savaş başlatacaktır!§! \n\n§REğer bir iç savaş çıkarsa, tam bir İslam Devrimi izleyemeyeceksiniz.§!"
 PER_strengthen_the_tudeh:0 "Tudeh Partisi'ni Güçlendir"
 PER_strengthen_the_tudeh_desc:0 "Tudeh Partisi, [ROOT.GetAdjective] işçi sınıfının öncüsü haline gelerek onları Şah'a karşı zafer kazandırdı. Artık sosyalizmi uygulama ve halkı emperyalizm ile kapitalizm zincirlerinden kurtarma yetkisi verilmelidir."
 PER_strike_first_tt:0 "Bu dalda ilerlemek, §YSa'dabad Paktı§!'nın başka odaklarını seçmenizi §Rengelleyecektir§!"
 PER_subserviant_to_noone:0 "Hiç Kimseye Boyun Eğmeyiz"
 PER_subserviant_to_noone_desc:0 "[ENG.GetNameDef] ve Anglo-İran Petrol Şirketi ile olan bağlantımızı geçmişte faydalı görmüş olsak da, artık kaynaklarımızın yabancı güçler tarafından gasp edilmesine izin vermeye ihtiyacımız yok. Bu şirketi dağıtmalı ve bunun yerine kendi gelişimimize kendimiz odaklanmalıyız."
 PER_superior_firepower:0 "Genişletilmiş Ağır Silah Tesisleri"
 PER_support_technology_bonus:0 "Piyade Destek Güçlendirme"
 PER_swear_fealty:0 "İşgalcilere Sadakat Yemini Et"
 PER_swear_fealty_desc:0 "[PER.GetNameDef]'ı korumak için tüm çabalarımıza rağmen, düşmanı durdurmayı başaramadık. Birlikleri başkentimize yaklaşırken, hemen ulaşmak ve bu savaşı derhal sona erdirmek, kendimizi bir kukla devlet olarak teklif etmek akıllıca olacaktır. En azından bu şekilde ülkemize daha fazla yıkım gelmesini önleyebiliriz."
 PER_swear_fealty_tt:0 "Düşmanlarımıza teslim olup onların §Ykuklası§! olarak katılmayı talep eden bir §Yetkinlik§! gönderecek. Bu, nasıl ilerlemek istediğimize karar vermemizi sağlayan bir §Ykukla dalı§! açacak."
 PER_swedish_artillery:0 "[SWE.GetNameDef]'den Topçu Lisansı Al"
 PER_swedish_artillery_desc:0 "[SWE.GetAdjective]lar ordumuzda bulunmasından faydalanacağımız güçlü toplar geliştirdiler. Bu İskandinav ülkesine ulaşmalı ve kendi üretimimize başlayabilmek için bir lisans anlaşması müzakere etmeye çalışmalıyız."
 PER_take_regional_tour:0 "Bölgesel Bir Turneye Çık"
 PER_take_regional_tour_desc:0 "Yeni İmparatorluğumuzun oluşumunun ardından, Rıza Şah Pehlevi bölgede bir turneye çıkmak, hem [IRQ.GetNameDef] hem de [AFG.GetNameDef]'ı ziyaret ederek bu iki ulusun liderleriyle ilişkisini geliştirmek istiyor."
 PER_tank_specialization_bonus:0 "[PER.GetAdjective] Tank Uzmanlığı"
 PER_tech_share_bonus:0 "Teknolojik İşbirliği"
 PER_tehran_moscow_pact:0 "Tahran-Moskova Paktı"
 PER_tehran_moscow_pact_desc:0 "[SOV.GetNameDef]'in kuzeyimizde dev bir ayı gibi üzerimize çöktüğü bir sır değildir. Eğer yayılmacı ideallerimizi gerçekleştireceksek, bu sorunu derhal ele almalıyız. Diplomatik bir heyeti en kısa zamanda Moskova'ya gönderebiliriz, umarız [SOV.GetAdjective]lar saldırmazlık paktına sıcak bakarlar."
 PER_tehran_power_grid_bonus:0 "Tahran Elektrik Şebekesi Genişletildi"
 PER_tehran_power_plant:0 "Tahran'da Elektrik Santrali Açılıyor"
 PER_tehran_power_plant_desc:0 "Ülke çapındaki şehirlerimiz büyüdükçe, onlara yeterli elektrik sağlandığından emin olmalıyız. Başkent Tahran'da yeni bir enerji santrali açalım ve bunu en önemli şehrimizin genişlemesinde önemli bir adım olarak sağlamlaştıralım."
 PER_territory_demands_tt:0 "Bu, ilgili ülkeye sınır topraklarını §Ybize devretmelerini§! talep eden bir mesaj gönderecek. Askeri gücümüz daha §Ygüçlü§! ise bunu yapmaya daha yatkın olacaklar."
 PER_the_memphis_initiative:0 "Memphis Girişimi"
 PER_the_memphis_initiative_desc:0 "Toprakları İmparatorluğumuza entegre etmek, fethettiğimiz bölgelerin kontrolünü sürdürmek için çok önemlidir. Özellikle Mısır, dikkatli olmazsak hizaya getirilmesi zor olacaktır ve bu nedenle özellikle onlara dikkat etmeliyiz."
 PER_the_new_economy:0 "Yeni Ekonomi"
 PER_the_new_economy_desc:0 "Piyasanın kaprisleri yerine halkın ihtiyaçlarına dayanan yeni bir ekonomi, reformlarımızın ardından nihayet ortaya çıkmaya başlıyor. Henüz yapılacak çok iş olsa da, [ROOT.GetNameDef]'da sosyalizmi inşa ettiğimizi söyleyebiliriz."
 PER_the_pahlavi_imperium:0 "Pehlevi İmparatorluğu"
 PER_the_pahlavi_imperium_desc:0 "1925'te Kaçar hanedanını devirdiğinden beri, Rıza Şah Pehlevi [PER.GetNameDef] için yol gösterici bir güç olmuştur. Ülkemiz bir başka büyük dünya çatışmasının eşiğinde dururken, büyük Şah, görkemli [PER.GetAdjective] topraklarını tehdit edebilecek herhangi bir fırtınayla başa çıkmaya hazır olmalıdır."
 PER_the_peoples_airforce:0 "Halkın Devrimci Hava Kuvvetleri"
 PER_the_peoples_airforce_desc:0 "Eğer kendimizi bir bölgesel güç olarak kabul ettirmek istiyorsak, Basra Körfezi üzerinde kontrol sağlamalıyız. Bunu yapmak için, emperyalist güçlerin deniz hakimiyetiyle başa çıkacak bir halk hava kuvveti inşa etmeye başlayacağız."
 PER_the_peoples_navy:0 "Halkın Devrimci Donanması"
 PER_the_peoples_navy_desc:0 "Emperyalist güçlerin yüzey filolarıyla yüzeyde başa çıkmayı umut edemesek de, bunu özel olarak tasarlanmış bir denizaltı sınıfı geliştirerek yapabiliriz."
 PER_the_unification_initiative:0 "Birleştirme Girişimi"
 PER_the_unification_initiative_desc:0 "[PER.GetNameDefCap] birkaç yıldır mücadele ediyor, özellikle de halkı tek bir bayrak altında birleştirme konusunda. Batıda Kürt ve Azeri muhalefeti sorunlara neden olurken ve din adamları dini reformlara karşı çıkarken, [PER.GetNameDef]'ı bir kez ve herkes için birleştirmek istiyorsak önümüzde çok iş var."
 PER_there_can_be_only_one:0 "Tek Olan Vardır"
 PER_there_can_be_only_one_desc:0 "[GER.GetNameDef] ile birçok ortak değeri paylaşmamıza rağmen, kendilerini dünyadaki tüm uluslardan üstün gördükleri giderek daha net hale geliyor. Bu, halkımıza ve mirasımıza yönelik bir hakarettir ve bu yanlış anlayışlarını güç kullanarak düzeltmeliyiz."
 PER_third_persian_empire:0 "Üçüncü Pers İmparatorluğu"
 PER_third_persian_empire_desc:0 "Halkımızın geleceğini güvence altına almak için, Muhammed Rıza Pehlevi, antik seleflerimiz olan Ahamenişlerin tarihine saygı duymayı ve onları örnek almayı amaçlayan Üçüncü Pers İmparatorluğu'nun kuruluşunu duyurdu. Bu [PER.GetNameDef] için yeni bir çağdır ve bizi büyüklüğe götürecek bir çağ olmalıdır."
 PER_train_tank_commanders:0 "Tank Komutanları Eğit"
 PER_train_tank_commanders_desc:0 "Tank tümenlerimizden en iyi şekilde yararlanabilmek için, yetkin komutanlar tarafından yönetilmeleri gerekir. Bunu yapmak için, askeri liderlerimizi tank savaşını geniş taktik yelpazelerine etkili bir şekilde dahil etmeyi öğrenmeleri için yeniden eğitime göndermeye hazırlanmalıyız."
 PER_trains_from_britain:0 "[ENG.GetNonIdeologyName]'dan Tren Talebi"
 PER_trains_from_britain_desc:0 "Trans-İran Demiryolu'nu açmak üzereyken, projeyi mümkün olduğunca çabuk başlatıp çalıştırmak için trenlere ihtiyacımız var. [ENG.GetAdjective]lar ham kaynaklarımızda hisse ve stoklara sahip olduğundan, yeni demiryolumuzu açmak için buharlı motorlar teklif etmeleri her iki ulus için de faydalı olacaktır."
 PER_trains_from_germany:0 "[GER.GetNonIdeologyName]'dan Tren Talebi"
 PER_trains_from_germany_desc:0 "Trans-İran Demiryolu'nu açmak üzereyken, projeyi mümkün olduğunca çabuk başlatıp çalıştırmak için trenlere ihtiyacımız var. [GER.GetNonIdeologyName]'da dostlarımız var, eğer istersek büyük açılışımız için buharlı lokomotif fazlasını sağlamaktan mutluluk duyacaklardır."
 PER_trans_iranian_railway:0 "Trans-İran Demiryolu"
 PER_trans_iranian_railway_desc:0 "1927'de Trans-İran Demiryolu olarak bilinen ülke çapında bir demiryolu bağlantısı üzerinde çalışmaya başladık. Artık [ROOT.GetNonIdeologyName]'ın modernizasyonuna doğru hızla ilerlerken, bu anıtsal projeyi tamamlamak için parayı yönlendirmemiz şart."
 PER_transfer_officers_to_intelligence:0 "Subayları İstihbarata Aktar"
 PER_transfer_officers_to_intelligence_desc:0 "İstihbarat ajansımızın operasyonlarını güçlendirmek için, askeri subaylarımızdan bazılarını istihbarat bölümüne aktarmalıyız."
 PER_treaty_of_tehran_tt:0 "[ENG.GetFlag]§Y[ENG.GetNameDef]§! ve [SOV.GetFlag]§Y[SOV.GetNameDef]§!'a birliklerini çekmeleri ve savaşı sonlandırmaları için bir etkinlik gönderecek."
 PER_trial_fifty_three:0 "Elli Üç'ler Davası"
 PER_trial_fifty_three_desc:0 "Komünist siyasi örgütler, Pehlevi yönetimini [PER.GetNameDef]'da güvence altına alma sürecimizde sorun çıkarmaya devam ediyor. Bu monarşi karşıtı duyguların mayalanmasına ve kitlesel gösterilere yol açmasına izin veremeyiz. Bunun yerine, bu muhalefeti yargı önüne çıkarmalı ve bir heyetin kaderlerine karar vermesine izin vermeliyiz."
 PER_trial_fifty_three_tt:0 "Bu odağı seçmek, herhangi bir §YKomünist§! danışmanın hükümetten yasaklanmasına neden olacak."
 PER_united_progressive_parties:0 "Birleşik İlerici Partiler"
 PER_united_progressive_parties_desc:0 "Şah'ın tahttan çekilmesiyle birlikte, [ROOT.GetNonIdeologyName] için daha ilerici bir gelecek inşa etme fırsatımız var. Ancak bunu yapabilmek için, tüm ilerici partilerin desteğini alarak gündemimizi zorlayabilecek büyük bir koalisyon oluşturmalıyız."
 PER_university_of_isfahan:0 "İsfahan Üniversitesi'ne Fon Sağla"
 PER_university_of_isfahan_bonus:0 "İsfahan Üniversitesi’ne Fon Sağlandı"
 PER_university_of_isfahan_desc:0 "Yeni nesil tıp profesyonelleri yetiştirecek yeni eğitim kurumlarına büyük ihtiyacımız var. İsfahan Üniversitesi, [ROOT.GetNonIdeologyName]'daki en gelişmiş tıp fakültesi olmaya hazır!"
 PER_uphold_civil_rights:0 "Sivil Hakları Koru"
 PER_uphold_civil_rights_desc:0 "[PER.GetNameDef] vatandaşlarının sivil haklarına saygı duymak, Muhammed Rıza Şah'ın şimdiye kadarki yönetiminin önemli bir parçası olmuştur. Toplumumuzun bu temel yönünü koruyarak, halkımızın daha önce yapabileceklerinden daha büyük şeyler başarmasını teşvik ediyoruz."
 PER_upscale_military_production:0 "Askeri Üretimi Artır"
 PER_upscale_military_production_desc:0 "Ulusumuzu tehdit edenlere karşı duracaksak, askeri endüstriyel üretimimizi ikiye katlamaya hazır olmalıyız. Yeni fabrikalar kurarak, birliklerimizi yeni ve güncel ekipmanlarla güçlendirmeye devam etmek için en iyi konumda olacağız."
 PER_usurp_afghanistan:0 "[AFG.GetNameDef]'ı Ele Geçir"
 PER_usurp_afghanistan_desc:0 "Nihayet Kabil'i [PER.GetAdjective] kontrolü altına alma zamanı geldi. Kuvvetlerimizi [AFG.GetNonIdeologyName]'ın dağlarına doğru ilerletin ve bayrağımız Tacbeg Sarayı'nın saçaklarından dalgalanana kadar geri dönmeyin."
 PER_vanguard_template_tt:0 "§YTopçu Tümeni Şablonu§! oluşturur."
 PER_venerate_islam:0 "İslam'ı Yücelt"
 PER_venerate_islam_desc:0 "İslam, Eski İmparatorluk, Müslümanların Pers'i fethi sırasında neredeyse yıkıldığından beri toplumumuzun temel bir parçası olmuştur. O zamandan beri, vatandaşlarımızın çoğunun günlük yaşamlarında önemli bir rol oynamıştır. Din adamlarına karşı mücadele etmek yerine, belki de dinimizi yüceltme ve İslam'a ne kadar adanmış olduğumuzu dünyaya gösterme zamanı gelmiştir."
 PER_war_elephant:0 "Savaş Fili"
 PER_war_elephant_desc:0 "Eski Pers İmparatorluğu'nda çok yaygın olarak kullanılmasa da, eski fetihlerimizde küçük bir savaş fili grubu kullanmamızla ünlüydük. Bilim adamlarımız, binlerce yıl önce yaptıkları gibi düşmanlarımıza korku salacak olan bir Hint Fili şeklinde çok ağır bir tank fikriyle geldiler."
 PER_war_plan_cambyses:0 "Cambyses Savaş Planı"
 PER_war_plan_cambyses_desc:0 "Büyük Kiros'un doğrudan halefi olarak, Cambyses II Ahameniş İmparatorluğu'nun ikinci Krallar Kralıydı. Saltanatı Kuzey Afrika ve Mısır'daki fetihlerle damgalandığı için, bölgedeki seferlerimiz onun ihtişamını onurlandırmak için onun adını taşıyacaktır."
 PER_war_plan_darius:0 "Darius Savaş Planı"
 PER_war_plan_darius_desc:0 "Büyük Darius, antik tarihimizde Pers'e kralların kralı olarak hizmet eden bir Ahameniş hükümdarıydı. Pers'e, Indus Vadisi'ne kadar uzanan topraklarda hükmetmişti. Bu nedenle, şimdi Hint alt kıtasına doğru ilerleme ve [ENG.GetAdjective]ları bu topraklardan atma planlarımızın adı olarak hizmet edecektir."
 PER_war_plan_xerxes:0 "Xerxes Savaş Planı"
 PER_war_plan_xerxes_desc:0 "Xerxes, hem Darius hem de Büyük Kiros ile akraba olan Ahameniş İmparatorluğu'nun dördüncü Krallar Kralıydı. Xerxes en çok MÖ 480'de Yunanistan'ı işgaliyle tanındığı için, [PER.GetNameDef]'ın batısındaki toprakları işgal etme planlarımızı onun şerefine adlandırmaya karar verdik. Sonunda Helenlerin elindeki yenilgimizi telafi edeceğiz."
 PER_we_survived:0 "Hayatta Kaldık"
 PER_we_survived_desc:0 "Her şeye rağmen hayatta kalmayı başardık! Şimdi halkımız için istikrar sağlama zamanı geldi."
 PER_we_will_survive:0 "Hayatta Kalacağız"
 PER_we_will_survive_desc:0 "Nihayet savaş kapımıza kadar geldi. Şüphesiz, bu işgalcilere karşı elimizden gelenin en iyisini yapacağız ve [PER.GetNameDef]'ın büyük ulusunun tüm zorluklara rağmen hayatta kalacağını dünyaya göstereceğiz. Binlerce yıl dayandık, binlerce yıl daha dayanacağız."
 PER_wether_the_storm:0 "Yaklaşan Fırtınayı Atlatmak"
 PER_wether_the_storm_desc:0 "Kendimizi diplomatik olarak koruma girişimlerimiz ters teptiği görülüyor, eski dostlarımız topraklarımıza gözlerini çevirerek bize karşı dönmemizi engellemeyi umuyorlar. Böyle bir niyetimiz olmasa da, ne gelirse gelsin hazırlanmalıyız."
 PER_white_peace_tt:0 "Düşmanlarımıza §Ybeyaz barış§! talep eden bir §Yetkinlik§! gönderecek, böylece §Yönceden sahip olduğumuz toprakları koruyabileceğiz§!."
 PER_white_revolution:0 "Beyaz Devrimi Başlat"
 PER_white_revolution_desc:0 "[ROOT.GetNonIdeologyName]'ın modernizasyonu kolay bir iş değil. Aksine, bu büyük hedefi gerçekleştirmek için önemli miktarda agresif reform gerekecek. Buna Beyaz Devrim veya Şah ve Halk Devrimi diyeceğiz ve [PER.GetNameDef]'ı batıdaki büyük ulusların seviyesine çıkaracak."
 PER_women_vote:0 "Kadınlara Oy Hakkı Tanı"
 PER_women_vote_desc:0 "Şu anda sadece erkekler hükümet meselelerinde oy kullanabiliyor. Nüfusumuzun yaklaşık yarısını oluşturdukları için, ulusumuzun kadınlarının da seslerini duyurabilmelerini sağlamalıyız. Ancak ihtiyatlı olmalıyız, çünkü bu din adamlarının geleneğe sırt çevirdiğimizi düşünmesine neden olabilir."
 PER_workers_army:0 "Halkın Ordusu"
 PER_workers_army_desc:0 "Ordu, fırsat kollayan karşı-devrimci fanatiklerle dolu. Ulusa eski moda görüşlerini dayatmak için fırsat bekliyorlar. Bunun olmasını engellemek için orduyu reforme etmeliyiz, işe gericileri tasfiye ederek başlamalıyız."
 RAJ_GOE_enforced_peace_decision:0 "Yaklaşan Ateşkes"
 RAJ_GOE_enforced_peace_decision_desc_2_1_tt:0 "§YEğer [443.GetName], [989.GetName], [433.GetName], [428.GetName] ve [437.GetName]'i kontrol ediyorsak, savaş sona erdiğinde daha fazla toprak tavizi elde edeceğiz§!"
 RAJ_GOE_enforced_peace_decision_desc_2_2_tt:0 "§YEğer [429.GetName], [427.GetName], [424.GetName], [425.GetName], [423.GetName], [982.GetName] ve [983.GetName]'i kontrol ediyorsak, savaş sona erdiğinde daha fazla toprak tavizi elde edeceğiz§!"
 RAJ_GOE_enforced_peace_decision_desc_2_3_tt:0 "§YEğer [436.GetName], [984.GetName], [426.GetName], [438.GetName] ve [435.GetName]'i kontrol ediyorsak, savaş sona erdiğinde daha fazla toprak tavizi elde edeceğiz§!"
 RAJ_GOE_enforced_peace_decision_desc_2_4_tt:0 "§YEğer [431.GetName], [985.GetName], [430.GetName], [432.GetName], [990.GetName] ve [434.GetName]'i kontrol ediyorsak, savaş sona erdiğinde daha fazla toprak tavizi elde edeceğiz§!"
 RAJ_GOE_enforced_peace_decision_desc_2_tt:0 "§YAteşkes yürürlüğe girdiğinde aşağıdaki bölgelerden herhangi birinin kontrolünü elinde tutacağız§!: §YBatı Hindistan§!, §YGüney Hindistan§!, §YOrta Hindistan§!, §YDoğu Hindistan§! ve §YKuzey Hindistan§!, eğer ateşkes yürürlüğe girdiğinde ilgili bölgedeki tüm eyaletleri kontrol ediyorsak."
 RAJ_GOE_enforced_peace_decision_desc_eng_tt:0 "Eğer [RAJ.GetName] yeterince uzun süre dayanırsa, [UK_INDIA.GetAdjective] hükümeti onlara toprak tavizleriyle ateşkes teklif edecek."
 RAJ_GOE_enforced_peace_decision_desc_tt:0 "Yeterince uzun süre dayanabilirsek, [UK_INDIA.GetAdjective] hükümeti bize ateşkes teklif edecek."
 RAJ_GOE_enforced_peace_decision_eng:0 "$RAJ_GOE_enforced_peace_decision$"
 RAJ_GOE_mughal_independence_category:0 "Mughal Bağımsızlığı"
 RAJ_GOE_secure_central_india:0 "[GetMughalCivilWarStatus] Orta Hindistan"
 RAJ_GOE_secure_eastern_india:0 "[GetMughalCivilWarStatus] Doğu Hindistan"
 RAJ_GOE_secure_northern_central_india:0 "[GetMughalCivilWarStatus] Kuzey-Orta Hindistan"
 RAJ_GOE_secure_northern_india:0 "[GetMughalCivilWarStatus] Kuzey Hindistan"
 RAJ_GOE_secure_southern_india:0 "[GetMughalCivilWarStatus] Güney Hindistan"
 RAJ_GOE_secure_western_central_india:0 "[GetMughalCivilWarStatus] Batı-Orta Hindistan"
 RAJ_GOE_secure_western_india:0 "[GetMughalCivilWarStatus] Batı Hindistan"
 RAJ_a_congress_resurgent:0 "Yeniden Yükselen Kongre"
 RAJ_a_congress_resurgent_desc:0 "Ulusal kongre popülarite ve güç kazandı. Artık reddedilemeyecek bir siyasi güç haline geldi."
 RAJ_a_peacock_prince:0 "Tavuskuşu Prensi"
 RAJ_a_peacock_prince_desc:0 "Mughal mirası, tahtını geri alacak değerli bir lider talep ediyor. Prens devletleri arasında, bir Tavuskuşu Prensi yükselecek—soyu, hırsı ve vizyonuyla imparatorluğun ihtişamını yeniden tesis edebilecek ve altkıtayı bir kez daha birleştirebilecek biri."
 RAJ_a_permanent_muslim_governmental_seat:0 "Kalıcı Bir Müslüman Hükümet Koltuğu"
 RAJ_a_permanent_muslim_governmental_seat_desc:0 "Müslümanlar ülkemizde büyük bir azınlıktır ve birleşik bir Hindistan hakkında duydukları endişeyi gidermek için onlara kalıcı bir hükümet koltuğu vereceğiz."
 RAJ_a_private_military:0 "Özel Ordu"
 RAJ_a_private_military_desc:0 "Yerel polisimizi özel bir orduya dönüştürmek kolay olacaktır. Teknik olarak herhangi bir ordunun parçası olmayacaklar, ancak doğrudan şirketten maaş alacaklar, hükümetin şartlarına uygun olarak."
 RAJ_a_private_military_tt_1:0 "Tam insan gücü ve teçhizatla Düzensiz Tümenler oluşturur.\n\nGönüllü olarak tümen göndermek, daha önce gönüllü göndermediğimiz ülkelere gönderilirse §G1§! offsite §YSivil Fabrika§! verecek §Y365§! gün(günler) boyunca.\nAynı ülkeye §Y540§! gün(günler) sonra yeni gönüllüler göndermek fabrikayı tekrar kazandıracak.\n\nBu fabrikalar §YVergilere§! sayılmaz!"
 RAJ_a_secular_state:0 "Lâik Bir Devlet"
 RAJ_a_secular_state_desc:0 "Hindistan dindar bir ülkedir, ancak devletin kendisinin azınlıklara karşı potansiyel önyargı şüphelerini gidermek için laik olması önemlidir."
 RAJ_a_tiger_uncained:0 "Zincirlerinden Kurtulmuş Bir Kaplan"
 RAJ_a_tiger_uncained_desc:0 "Çok uzun süredir farklı imparatorluklar tarafından boyunduruk altına alındık, emperyal yönetimin zincirlerine vurulduk. Bir daha asla, tıpkı esirlerinden nihayet özgür olan bir kaplan gibi bir daha asla gönüllü olarak boyun eğmeyeceğiz."
 RAJ_a_tiger_unchained:0 "Zincirlerinden Kurtulmuş Bir Kaplan"
 RAJ_a_tiger_unchained_desc:0 "En zorlu dağ arazilerinde ustalaşabilen elit birlikler oluşturacağız. Bu zirve kaplanları, düşmanlarımıza korku salacak ve dağlardaki hakimiyetimizi pekiştirecek."
 RAJ_abolish_agrarian_society_criteria:0 "Sanayileşmeyi Hızlandır"
 RAJ_abolish_agrarian_society_criteria_desc:0 "Modern bir çağda, ekonomik kalkınmada diğer uluslara yetişmek zorundayız. Tarıma dayanmak için çok uzun süre bekledik. [RAJ.GetNameDef]'i yeni bir ilerleme çağına taşımak için hızlı sanayileşmenin yolunu açma zamanı geldi."
 RAJ_abolish_agrarian_society_criteria_tt:0 "§Y$idea_RAJ_agrarian_society$§! etkilerini azaltma süresini kalıcı olarak §Y3§! ay kısaltır"
 RAJ_accept_russian_muhajir_money:0 "Rus Muhacir Parasını Kabul Et"
 RAJ_accept_russian_muhajir_money_desc:0 "Yabancı altın elimize akıyor, devrim ateşlerini körüklüyor."
 RAJ_acquire_new_resources:0 "Yeni Kaynaklar Edin"
 RAJ_acquire_new_resources_desc:0 "Sanayimiz, mal talebini karşılamak için giderek artan kaynak arzına ihtiyaç duyuyor. Bu nedenle, işsiz kitleleri topraklarımız boyunca yeni kaynak işleme tesislerinde çalıştıracağız."
 RAJ_across_the_himalayas:0 "Himalayalar'ın Ötesine"
 RAJ_across_the_himalayas_desc:0 "Himalayalar'ın ötesindeki topraklar, anlatılmamış zenginlikler ve stratejik önem taşır. Mughal İmparatorluğu’nun etkisini bu zorlu zirvelerin ötesine genişleterek, egemenliğimizi pekiştirir ve diyarın ihtişamı için yeni sınırlar güvence altına alırız."
 RAJ_agrarian_socialism:0 "Tarımsal Sosyalizm"
 RAJ_agrarian_socialism_desc:0 "Devrim tarlalarda başlar.\nToprak, onu işleyenlere geri dönsün ve köyler eşitlik ve adalet adına kendilerini yönetsin."
 RAJ_agricultural_cooperatives:0 "Tarımsal Kooperatifler"
 RAJ_agricultural_cooperatives_desc:0 "Birkaç çiftçiye ait tarımsal kooperatifler sürdürülebilirlik, kendi kendine yeterlilik ve güçlendirme için anahtardır."
 RAJ_agricultural_cooperatives_tt:0 "En az 4 §YSivil Fabrika§! olan her sahip olunan eyalette §G1§! §YAltyapı§! kazanın.\nBu odakla kazanılan her 2 §YAltyapı§! için §G1§! §YSivil Fabrika§! kazanın."
 RAJ_airforce_shortcut:0 "Hint Hava Kuvvetleri"
 RAJ_akhand_bharat:0 "Akhand Bharat"
 RAJ_akhand_bharat_desc:0 "Akhand Bharat bir ve bölünmez kalmalıdır. Bölünmemiş sadakat ve bağlılıkla Hindistan ulusuna ve devletine bağlı olanlar, kast, inanç veya din gözetmeksizin mükemmel eşitlikle muamele görecek ve ortak yükümlülükleri eşit şekilde paylaşacaktır."
 RAJ_akhand_bharat_tt:0 "[AFG.GetName], [MLD.GetName], [NEP.GetName], [PAK.GetName], [BAN.GetName], [BHU.GetName], [SRL.GetName] eyaletlerini çekirdek yapma ve Akhand Bharat'ı oluşturma kararının kilidi açılır. Aynı anda bir ülkeyi hedefleyerek tüm mevcut çekirdekleri işgal etmemiz gerekecek ve daha fazla çekirdek talep edebileceğiz."
 RAJ_all_india_kisan_sabha:0 "Tüm Hindistan Köylü Meclisi"
 RAJ_all_india_kisan_sabha_desc:0 "Kırsal Hindistan'ın köylüleri ve çiftçileri yeterince sömürüldü. Örgütlenip şikayetlerini topluca dile getirmelerinin zamanı geldi."
 RAJ_all_india_students_federation:0 "Tüm Hindistan Öğrenci Federasyonu"
 RAJ_all_india_students_federation_desc:0 "Öğrencileri [ENG.GetAdjective] üstünlüğüne karşı harekete geçirmek, en parlak genç zihinlerimizin yerleşik düzene karşı çalışmasını sağlayacaktır."
 RAJ_ammunition_factories_shortcut:0 "Mühimmat Fabrikaları"
 RAJ_ammunition_factory_khadki:0 "Khadki Mühimmat Fabrikası"
 RAJ_ammunition_factory_khadki_desc:0 "Modern bir savaş gücüne silah sağlama yeteneğine sahip olmak için ülkenin mühimmat fabrikalarını büyük ölçüde genişletmeliyiz."
 RAJ_an_economy_unbound:0 "Sınırsız Bir Ekonomi"
 RAJ_an_economy_unbound_desc:0 "Artık efendilerimiz tarafından engellenmediğimiz için ekonomimiz nihayet önceki yükümlülüklerinden kurtulup gelişebilir."
 RAJ_annex_goa:0 "Goa'yı İlhak Et"
 RAJ_annex_goa_desc:0 "Goa bir zamanlar Hindistan'a aitti, emperyalist güçlere kaybedildi ve [POR.GetName]'ın onu savunacak durumda olmadığı açık. Bu tarihi yanlışı düzeltmeliyiz."
 RAJ_appoint_a_c_suite:0 "C Düzeyi Yönetici Atama"
 RAJ_appoint_a_c_suite_desc:0 "Güçlü kurumsal liderlik başarımız için esastır. Yetenekli bir yönetici ekibi oluşturarak etkili yönetim, stratejik vizyon ve tutarlı büyüme sağlayacağız."
 RAJ_appoint_german_friendly_government:0 "Alman Yanlısı Hükümet Atama"
 RAJ_appoint_german_friendly_government_desc:0 "Hükümetimizi [GER.GetNameDef] ile uyumlu hale getirmek, Avrupa'nın yükselen gücüyle bağlarımızı güçlendirecek. Bu yönetim, sanayileşmeye, askeri modernizasyona ve Bolşevizme karşı sert bir muhalefete öncelik verecek."
 RAJ_appoint_soviet_friendly_government:0 "Sovyet Yanlısı Hükümet Atama"
 RAJ_appoint_soviet_friendly_government_desc:0 "Moskova'dan sürekli destek sağlamak için, Sovyet ideolojisiyle tamamen uyumlu bir hükümet kuracağız. Sadakatleri, ekonomik yardımı, askeri işbirliğini ve yeni devletimizde ideolojik tutarlılığı garanti edecek."
 RAJ_arm_the_peasantry:0 "Köylülüğü Silahlandır"
 RAJ_arm_the_peasantry_desc:0 "Devrim her tarlaya ulaşmalıdır.\nSadık kırsal milislere silah dağıtacağız, böylece hiçbir köy tepkiye karşı savunmasız kalmayacak."
 RAJ_armoured_corps_center_and_school:0 "Zırhlı Birlikler Merkezi"
 RAJ_armoured_corps_center_and_school_desc:0 "Savaşın geleceği mekanize güçte yatıyor. Bir zırhlı birlikler merkezi kurarak kuvvetlerimizi zırhlı taktikler konusunda eğitebilir, tankları modern askeri stratejimizin öncüsü haline getirebiliriz."
 RAJ_army_shortcut:0 "Subaylar"
 RAJ_arrest_congress_leaders:0 "Kongre Liderlerini Tutukla"
 RAJ_arrest_congress_leaders_desc:0 "Kongre liderleri şirket yönetiminin yeni gerçekliğine uymayacak. Hala direniyorlar ve en ufak fırsatta kargaşa çıkarıyorlar. Yayılmadan önce bu kışkırtıcıları bastırmalıyız."
 RAJ_assam_oil_dlc:0 "Assam Petrolü"
 RAJ_assam_oil_dlc_desc:0 "Assam eyaletinde büyük petrol yatakları keşfettik. Bir devlet petrol şirketi kurarak ve Assam'da petrol kuleleri inşa ederek ekonomimizi önemli ölçüde iyileştirebiliriz."
 RAJ_assume_eastern_naval_responsibilities:0 "Doğu Deniz Sorumluluklarını Üstlen"
 RAJ_assume_eastern_naval_responsibilities_desc:0 "[JAP.GetNameDef]'ın doğuda sorun çıkardığı konusunda kimsenin aklında şüphe yok. Planları ortaya çıktıkça, donanmamızı [RAJ.GetAdjective] sularını savunmaya hazırlamamız zorunlu hale geliyor. Taç'a başvurmalı ve çabalarımızda bize yardımcı olmaları için [ENG.GetAdjective] donanma gemileri göndermelerini talep etmeliyiz."
 RAJ_attract_scientists:0 "Bilim İnsanlarını Çek"
 RAJ_attract_scientists_desc:0 "Büyük zenginliğimizle dünyanın her yerinden en iyi bilim insanlarını çekebiliriz."
 RAJ_authoritarianship:0 "Otoriter Yönetim"
 RAJ_authoritarianship_desc:0 "Güçlü merkezi otorite, yeni devletimiz için barış, adalet ve istikrarı sağlayacaktır."
 RAJ_automating_the_army:0 "Orduyu Otomatize Etmek"
 RAJ_automating_the_army_desc:0 "Mekanizasyon ve gelişmiş zırhlı tümenlere öncelik vereceğiz, böylece tamamen modernize edilmiş bir ordu için yol açacağız."
 RAJ_azad_hind_bank:0 "Azad Hind Bankası"
 RAJ_azad_hind_bank_desc:0 "$RAJ_azad_hind_dlc_bank_desc$"
 RAJ_azad_hind_dlc:0 "Azad Hind"
 RAJ_azad_hind_dlc_bank:0 "Azad Hind Bankası"
 RAJ_azad_hind_dlc_bank_desc:0 "Bir devrim kaynak gerektirir. Azad Hind Bankası'nı kurarak, bağımsızlık mücadelesini desteklemeye adanmış bir finansal kurum oluşturuyoruz. Fonları harekete geçirecek, vatanseverleri güçlendirecek ve özgür bir Hindistan'ın ekonomik temelini atacak."
 RAJ_azad_hind_dlc_desc:0 "Azad Hind, kurtuluş mücadelemizin doruk noktasını temsil eder—İngiliz yönetimini sona erdirmeye adanmış bir sürgün hükümeti. Güçlü ve kararlı bir şekilde Hindistan'ı özgürlüğe taşımaya hazırdır."
 RAJ_azad_hind_dlc_radio:0 "Azad Hind Radyosu"
 RAJ_azad_hind_dlc_radio_desc:0 "Kurtuluş mesajını yaymak için Azad Hind Radyosu'nu kurmalıyız. Bu devrimci yayın, özgürlük çağrımızı sınırlar ötesine taşıyarak vatanseverleri birleştirecek ve sömürge baskısına karşı mücadeleyi ateşleyecek. Mücadelenin bir sesi olmalı, bu da bizim sesimiz olacak."
 RAJ_azad_hind_dlc_tt:0 "Şunları kazanacağız: "
 RAJ_azad_hind_dlc_tt_2:0 "§RCivil War§! başlangıcında §Y120§! gün(günler) boyunca"
 RAJ_azad_hind_radio:0 "Azad Hind Radyosu"
 RAJ_azad_hind_radio_desc:0 "$RAJ_azad_hind_dlc_radio_desc$"
 RAJ_ban_untouchability_once_and_for_all:0 "Dokunulmazlığı Tamamen Yasakla"
 RAJ_ban_untouchability_once_and_for_all_desc:0 "Dokunulmazlık, toplumumuzun bir lekesidir, bize en çok ihtiyaç duyduğumuzda bizi böler. Bu uygulamayı kaldırarak her Hintlinin itibarını onaylıyor ve adil ve kapsayıcı bir ulus inşa etmek için kesin bir adım atıyoruz."
 RAJ_bathe_in_hellfire:0 "Cehennem Ateşinde Yıkan"
 RAJ_bathe_in_hellfire_desc:0 "Düşmanlarımızın sadece iki seçeneği olacak, ya sıraya girecekler ya da ateş çukuruyla yüzleşecekler."
 RAJ_bathe_in_hellfire_desc_tt:0 "§YNükleer Silahlar§! artık hedef eyaletlerin §YAskeri Fabrikalarının§! §Y50%§!'sini kalıcı olarak yok edecek.\n§YTermonükleer Nükleer Silahlar§! artık hedef eyaletlerin §YAskeri Fabrikalarının§! §Y100%§!'sini kalıcı olarak yok edecek."
 RAJ_bhoodan_movement:0 "Bhoodan Hareketi"
 RAJ_bhoodan_movement_desc:0 "Gönüllü toprak dağıtımı yoluyla topraksızları güçlendirecek ve kırsalda adaleti tesis edeceğiz. Toprağı onu işleyenlere geri vererek sadece emeklerini değil, kalıcı sadakatlerini kazanırız."
 RAJ_bhutanese_protectorate:0 "Butan Himayesi"
 RAJ_bhutanese_protectorate_desc:0 "[BHU.GetAdjective] halkının izolasyonuna saygı duymalıyız, ancak aynı zamanda küçük ülkelerin emperyal emelleri olanlar tarafından yutulacağı gerçeğini de inkar edemeyiz. Onlara Hint kanadı altında koruma teklif edeceğiz."
 RAJ_bhutanese_protectorate_tt:0 "§Y[BHU.GetName]§!, §Y[RAJ.GetNameDefCap].§!'ın bir dominyonu olacak.\n\nKabul etme olasılıkları şu durumlarda daha yüksek:\n\t-Bizden yüksek bir fikirleri varsa\n\t-Ordumuz onlardan önemli ölçüde güçlüyse"
 RAJ_black_swan_sloops:0 "Kara Kuğu Sloopları"
 RAJ_black_swan_sloops_desc:0 "Uygun maliyetli Kara Kuğu sınıfı gövdeleri satın alıp yenileyerek, sahil savunması ve konvoy koruması için ideal olan hafif devriye gemileri filosunu hızla genişletebiliriz."
 RAJ_bombay_baroda_and_central_india_railway:0 "Bombay Baroda ve Orta Hindistan Demiryolu"
 RAJ_bombay_baroda_and_central_india_railway_desc:0 "Bombay, Baroda ve Orta Hindistan Demiryolu'nu genişletmek, kilit bölgeleri birbirine bağlayarak ekonomik büyümeyi sağlayacak ve toplulukları bir araya getirecektir. Bu hayati hatlar, ticaret ağlarını güçlendirecek ve Hindistan'ın altyapısını gelecek zorluklara hazırlayacaktır."
 RAJ_bombay_trade_port:0 "Bombay Ticaret Limanı"
 RAJ_bombay_trade_port_desc:0 "Bombay, büyük miktarda malın ithalatını ve ihracatını kolaylaştıran dünya standartlarında bir ticaret limanı olma potansiyeline sahip. Tek gereken liman tesislerini genişletmek için yatırım."
 RAJ_boycott_british_made_goods:0 "İngiliz Malı Ürünleri Boykot Et"
 RAJ_boycott_british_made_goods_desc:0 "Çok uzun süredir [ENG.GetAdjective], [GetRajName]'dan ham kaynakları çıkarıp işlenmiş malzemeleri bize yüksek fiyatlarla satıyor. [RAJ.GetRajAdjective]lar [RAJ.GetRajAdjective]lar için üretim yapmalı, kendi işgalcilerimiz tarafından kandırılmamalı."
 RAJ_break_the_zamindars:0 "Zamindarları Kır"
 RAJ_break_the_zamindars_desc:0 "Toprak ağaları eski rejimin iskeletidir.\nMülklerini parçalayacağız, topraklarını ele geçireceğiz ve güçlerini rüzgara savuracağız."
 RAJ_british_air_experts:0 "İngiliz Hava Uzmanları"
 RAJ_british_air_experts_desc:0 "Deneyimli İngiliz havacıların ve mühendislerin uzmanlığından yararlanmak, hava kuvvetlerimizin gelişimini hızlandırabilir. Modern hava savaşındaki deneyimleri, gökyüzünde güçlü bir varlık oluştururken paha biçilmez bilgiler sağlayacaktır."
 RAJ_burn_down_the_cellular_jail:0 "Hücresel Hapishaneyi Yak"
 RAJ_burn_down_the_cellular_jail_desc:0 "Hücresel Hapishane, Hindistan'ın bağımsızlığı için savaşan herkes için bir hakarettir, yok edilmelidir."
 RAJ_cabinet_mission_plan:0 "Bakanlar Kurulu Misyon Planı"
 RAJ_cabinet_mission_plan_desc:0 "Hem Müslümanlar hem de Hindularla birleşik bir cephe oluşturarak [ENG.GetAdjective] hükümetinden gelen delegasyonla yüzleşmeye hazırız."
 RAJ_campaign_against_agrarian_societys:0 "Sanayileşme Planları"
 RAJ_campaign_against_agrarian_societys_desc:0 "Hindistan geçen yüzyılda kalamaz. Halkımızı yükseltmek için yoğun bir çaba göstermeliyiz."
 RAJ_capital_ship_effort_dlc:0 "$RAJ_capital_ship_effort$"
 RAJ_central_comittee_authority:0 "Merkez Komite Otoritesi"
 RAJ_central_comittee_authority_desc:0 "Disiplin güçtür.\nMerkez Komitesi, devrimin kaosa sapmamasını sağlamak için yönetimin tüm yönlerini denetleyecektir."
 RAJ_chariot_of_victory:0 "Zafer Arabası"
 RAJ_chariot_of_victory_desc:0 "Savaş alanı hız ve güç talep eder. Zırhlı araçlara ve mekanize kuvvetlere yatırım yaparak hızlı ve kesin zaferler kazanabilen modern bir ordu oluşturur, Hindistan'ın her çatışmada üstünlüğünü sağlarız."
 RAJ_chindits_:0 "Chinditler"
 RAJ_chindits__desc:0 "Chinditler, uzun menzilli orman operasyonları için eğitilmiş seçkin, alışılmadık savaşçılardır. Saflarını genişleterek ve taktiklerini mükemmelleştirerek düşmanlarını alt edebilen ve hatlarının gerisinde operasyonlarını bozabilen bir güç elde ederiz."
 RAJ_chindits_dlc:0 "$RAJ_chindits$"
 RAJ_chindits_dlc_desc:0 "$RAJ_chindits_desc$"
 RAJ_circuvment_demobilization_restrictions:0 "Kısıtlamaları Atlat"
 RAJ_circuvment_demobilization_restrictions_desc:0 "Hükümet hala kaç erkeği seferber edebileceğimiz konusunda katı bir sınır koyuyor. Taç, kontrolü altında olmayan bir ordunun korkusundan ölüyor olmalı. Önemli değil, bu kısıtlamaları ya rüşvetle ya da belirli dini çalışanları silahlı kuvvetlerin parçası olarak saymayarak atlatmanın yolları var."
 RAJ_coal_fire_and_steel:0 "Kömür, Ateş ve Çelik"
 RAJ_coal_fire_and_steel_desc:0 "Kömür motorları besler, ateş iradeyi sertleştirir, çelik geleceği inşa eder. Ağır sanayiye yatırım yaparak, egemenliğini savunabilen ve refahını artırabilen kendine yeten bir Hindistan'ın temellerini atıyoruz."
 RAJ_coastal_protection:0 "Sahil Koruma"
 RAJ_coastal_protection_desc:0 "Geniş sahil şeridimizin yabancı tehditlere karşı bir şekilde korunmaya ihtiyacı var."
 RAJ_colonial_cadet_exchange:0 "Sömürge Asteğmen Değişimi"
 RAJ_colonial_cadet_exchange_desc:0 "En parlak asteğmenlerimizi İngiliz subaylarıyla birlikte eğitim görmeleri için göndereceğiz, böylece ordumuz en ileri tekniklerle donatılacak."
 RAJ_colonial_cadet_exchange_tt:0 "Kaldırıldığında:"
 RAJ_company_bonuses:0 "Şirket Bonoları"
 RAJ_company_bonuses_desc:0 "Performansı potansiyel bonolara bağlayarak şirket genelinde verimliliği artıracağız."
 RAJ_comrades_of_the_city:0 "Şehrin Yoldaşları"
 RAJ_comrades_of_the_city_desc:0 "Şehirlerin işçileri öncüdür.\nEğitim, araçlar ve birlikle, Cumhuriyeti moderniteye taşıyacaklar."
 RAJ_concessions_to_the_industrialists:0 "Sanayicilere Tavizler"
 RAJ_concessions_to_the_industrialists_chances_tt:0 "§Y$RAJ_investments_from_local_leaders$§! öncelikle §YSivil Sanayi§! ve daha az derecede §YAskeri Sanayi§! üzerine odaklanacak."
 RAJ_concessions_to_the_industrialists_desc:0 "İmparatorluk hazinesini tüketmeden kalkınmayı teşvik etmek için bölgesel büyümeye yatırım yapmaya istekli sanayicilere uygun şartlar sunacağız. Mütevazı tavizler karşılığında, yerel liderler refah yoluyla sadakat sağlayacak."
 RAJ_confer_with_the_congress:0 "Kongre ile Görüş"
 RAJ_confer_with_the_congress_desc:0 "Yönetimdeki birçok kişi sessizliği tercih etse de, bağımsızlık hareketini tamamen görmezden gelmek daha büyük huzursuzluk riski taşır. Seçilmiş talepleri kabul ederek öfkeyi yatıştırabilir ve iç istikrarı güçlendirebiliriz."
 RAJ_conquer_afghanistan:0 "Afganistan'ı Fethet"
 RAJ_conquer_afghanistan_desc:0 "Afganistan, imparatorluğun atalarının kalbidir ve geri alınmalıdır. Bu tarihi bölge üzerinde kontrolü yeniden sağlayarak, Mughal mirasını onurlandırır ve imparatorluğun yeniden yükselişi için hayati bir dayanak noktası elde ederiz."
 RAJ_conquerors_of_iraq:0 "Mezopotamya'ya Yürüyüş"
 RAJ_conquerors_of_iraq_desc:0 "Irak, bir zamanlar Timur İmparatorluğu içinde ticaretin ve gücün hayati bir kavşak noktasıydı ve zenginlikleri geçmiş ihtişamımızı besledi. Şimdi, mirasına layık olmayan daha zayıf yöneticilerin elinde. Mezopotamya'yı yeniden egemenliğimiz altına alarak, stratejik bir merkezi güvence altına alacak, Doğu ve Batı arasındaki geçidi kontrol edecek ve dünyaya Timurluların sormadığını—aldığını hatırlatacağız."
 RAJ_conquerors_of_persia:0 "Pers Fatihleri"
 RAJ_conquerors_of_persia_desc:0 "[PER.GetNameDef], muazzam zenginlik ve tarihe sahip bir toprak, bir zamanlar imparatorluğumuzun rakibiydi. Onu Mughal yönetimi altına alarak, hakimiyetimizi teyit eder, hayati batı topraklarını güvence altına alır ve imparatorluğumuzu gerçek imparatorluk ihtişamının varisi olarak sağlamlaştırırız."
 RAJ_conquerors_of_turkey:0 "İkinci Ankara Muharebesi"
 RAJ_conquerors_of_turkey_desc:0 "Anadolu bir zamanlar imparatorluklar için bir savaş alanıydı ve tarih Timur'un Osmanlılar karşısındaki zaferini hatırlıyor. Ancak, o yıkılmış sultanlığın halefi hala ayakta ve topraklarımız altında olması gereken topraklara tutunuyor. Bir kez daha batıya yürüyerek savunmalarını parçalayacak ve geçmiş fetihlerimizi geri alacağız."
 RAJ_constitution_for_the_masses:0 "Kitleler için Anayasa"
 RAJ_constitution_for_the_masses_desc:0 "Halk Cumhuriyeti eski imparatorluk yasalarına dayanamaz.\nYeni bir anayasa, işçilerin, çiftçilerin ve topraksızların iradesini yansıtmalıdır — monarkların veya sömürge valilerinin kaprislerini değil."
 RAJ_consult_with_congress_leaders:0 "Kongre Liderleriyle Görüş"
 RAJ_consult_with_congress_leaders_desc:0 "[ENG.GetNameDef] ile savaşa zorla girmek yerine, bunu yapmak için resmi yolları kullanmalıyız. Kongre Liderleriyle görüşelim ve onlara [RAJ.GetNameDef]'ın savaşa girmesine izin verecekleri umuduyla başvuralım."
 RAJ_contamination_cleanup_crew:0 "Kirlilik Temizleme Ekibi"
 RAJ_contamination_cleanup_crew_desc:0 "Askerlerimiz nükleer serpinti altında bile savaşmaya hazır olmalıdır."
 RAJ_continue_the_five_year_plan:0 "Beş Yıllık Plan'a Devam Et"
 RAJ_continue_the_five_year_plan_desc:0 "Beş Yıllık Plan'ın ilk yılı bitti, şimdi geriye bakıp ne kadar ilerleme kaydettiğimizi görmeli ve öğrendiklerimizi önümüzdeki dört yıla uygulamalıyız."
 RAJ_continue_the_five_year_plan_tt:0 "§YBeş yıllık plan§!'taki tüm değiştiricileri §G+30%§! ile çarpacak!"
 RAJ_cordite_factory_aruvankadu_tamil_nadu:0 "Aruvankadu Kordit Fabrikası"
 RAJ_cordite_factory_aruvankadu_tamil_nadu_desc:0 "Topçu için iyi iticilere sahip olmak, ağır toplarımıza düşmanlarımıza karşı avantaj sağlayacaktır."
 RAJ_corporate_domination:0 "Şirket Hakimiyeti"
 RAJ_corporate_domination_desc:0 "Alt kıta üzerindeki kontrolümüzü pekiştirirken özel ve kamu sektöründe giderek daha fazla hakimiyet sağlıyoruz. Doğrudan veya dolaylı olarak tam kontrol hedefimizle tüm işletmelerde verimliliği artırabiliyoruz."
 RAJ_corporate_expansion:0 "Şirket Genişlemesi"
 RAJ_corporate_expansion_desc:0 "Temel portföyümüzdeki ekonomik büyüme nüfus patlamasına yol açtı. Uzun vadeli büyümeyi sağlamak için, gelecekteki çalışanlarımızı barındırmak üzere altyapımızı genişleteceğiz."
 RAJ_cottage_industries:0 "Ev Sanayileri"
 RAJ_cottage_industries_desc:0 "İnsanların evlerinde yapılan iş ve üretim, ağır imalat için uygulanabilir alternatiflerdir ve insanlara bir bağımsızlık duygusu verir."
 RAJ_court_the_princes:0 "Prenslerin İlgisini Çek"
 RAJ_court_the_princes_desc:0 "Prens devletleri uzun süredir altkıtada sadakatin ve düzenin temel taşları olmuştur. Ayrıcalıklarını teyit ederek ve onları yönetimde daha doğrudan rol almaya dahil ederek, yükselen popülist ajitasyona karşı imparatorluk temelini güçlendiririz."
 RAJ_creative_accounting:0 "Yaratıcı Muhasebe"
 RAJ_creative_accounting_desc:0 "Bazı yaratıcı muhasebe hileleri kullanarak kârımızın bir kısmını uçurabiliriz, ya da en azından vergi makamlarının buna inanmasını sağlayabiliriz."
 RAJ_cripps_mission_dlc:0 "$RAJ_cripps_mission$"
 RAJ_cripps_mission_dlc_desc:0 "$RAJ_cripps_mission_desc$"
 RAJ_crown_commodities:0 "Taç Emtiaları"
 RAJ_crown_commodities_cg_to_the_empire_tt:0 "(§Y[ENG.GetFlag][ENG.GetName]§! ve onların §Yuyruklarında§!):"
 RAJ_crown_commodities_desc:0 "İhracata yönelik nakit mahsullerin yetiştirilmesine öncelik vererek, istikrarlı bir gelir akışı sağlayabilir ve sömürge ticaretindeki ekonomik önemimizi güçlendirebiliriz. Çay, pamuk, jüt ve diğer kolonyal ticaret ürünleri, kırsalda refahın bel kemiği olacaktır."
 RAJ_cruiser_effort_dlc:0 "$RAJ_cruiser_effort$"
 RAJ_crush_the_anathema:0 "Laneti Yok Et"
 RAJ_crush_the_anathema_desc:0 "Komünizm iyi işin lanetidir. Dünya parayla döner ve komünistler tarafından yönetilen bir dünya durgunluğa yol açardı. Çürümeyi yakıp yok etmeliyiz."
 RAJ_cult_of_personality:0 "$GUAY_cult_of_personality$"
 RAJ_cult_of_personality_desc:0 "$GUAY_cult_of_personality_desc$"
 RAJ_cultural_reawekening:0 "Kültürel Yeniden Uyanış"
 RAJ_cultural_reawekening_desc:0 "Sanat, dil ve geleneklerle dolu yeni bir şafak yaklaşıyor. Ulusu, medeniyetimizin zamansız ruhu altında birleştiriyoruz."
 RAJ_curtail_the_zamindars:0 "Zamindarları Kısıtla"
 RAJ_curtail_the_zamindars_desc:0 "Kırsal toprak sahiplerinin kökleşmiş etkisi, yönetimi modernize etme ve [ROOT.GetNameDef]'ın tam potansiyelini ortaya çıkarma çabalarını uzun süredir engelliyor. İdari gücü ve kaynakları liyakat temelli memurlara ve daha hesap verebilir kurumlara kaydırarak, onların etkisini zayıflatırken daha duyarlı bir devletin temellerini güçlendirebiliriz."
 RAJ_deathblow_to_imperial_remnants:0 "İmparatorluk Kalıntılarına Ölüm Darbesi"
 RAJ_deathblow_to_imperial_remnants_desc:0 "[PAK.GetName], İngilizlerin vekili olarak hareket etti ve İngilizler komünizmin yükselen dalgasını dengelemek için umutsuz bir hareketle onlara büyük miktarda kaynak aktardı. Bu mücadeleye son vereceğiz."
 RAJ_deathknell_to_the_raj:0 "Raj'ın Ecel Çanı"
 RAJ_deathknell_to_the_raj_desc:0 "Raj'ın kalıntılarını topraklarının kontrolünü giderek daha fazla ele alarak kemirdik. Şimdi bu komediyi sonlandırma ve altkıtanın tam kontrolünü talep etme zamanı."
 RAJ_deathknell_to_the_raj_trigger:0 "§YBritish§! yönetimindeki §YThe Raj§! var"
 RAJ_deathknell_to_the_raj_trigger_tt:0 "Raj'ın kalıntılarını ilhak eder"
 RAJ_debt_manipulation:0 "Borç Manipülasyonu"
 RAJ_debt_manipulation_desc:0 "Mevcut borcu sahte kayıplar için kullanabiliriz, bu da daha az vergi öderiz ve fazla kârları stoklayabiliriz."
 RAJ_debt_relief:0 "Borç Hafifletme"
 RAJ_debt_relief_desc:0 "Uzun süredir zengin [ENG.GetAdjective] ve [GetRajAdjective]lar, sıradan insanları borç tuzaklarına çekiyor, bu artık yaygın hale geldi. Bu insanlara rahatlama sağlamak için yerel hükümetlere lobi yapacağız, yanlış bir sistemde sıkışıp kalmanın yükünü hafifleteceğiz."
 RAJ_decentralize_the_party:0 "Partiyi Desantralize Et"
 RAJ_decentralize_the_party_desc:0 "Otorite Indraprastha'daki ofislerden akmamalıdır.\nHalk, devrimi yerel konseyler ve kırsal sovyetler aracılığıyla yönlendirsin."
 RAJ_defend_burma:0 "Birmanya'yı Savun"
 RAJ_defend_burma_desc:0 "[BRM.GetName], [JAP.GetName] saldırganlığına karşı bir savunma görevi görüyor. Konumlarını güçlendirmek bizim için yalnızca faydalıdır."
 RAJ_defend_states:0 "Savun"
 RAJ_defenders_of_the_revolution:0 "Devrimin Savunucuları"
 RAJ_defenders_of_the_revolution_desc:0 "Onlar asker değil. Bir fikrin koruyucularıdır.\nEn disiplinli ve sadık savaşçılarımızı seçkin bir birliğe yükselteceğiz, hem toprağın hem de ideolojinin savunucuları."
 RAJ_defenders_of_the_revolution_idea_tt:0 "Teknoloji ekler: §YDevrimci Kitlesel Saldırı§!."
 RAJ_defense_of_burma:0 "Burma'nın Savunması"
 RAJ_defense_of_burma_desc:0 "[BRM.GetNonIdeologyName] doğrudan Bengal'in doğusunda yer alır ve ormanları, [RAJ.GetNonIdeologyName]'ın sınırlarını doğudaki tehditten korumak için son doğal bariyer görevi görür. Bölgede savunma gücü oluşturmak, [BRM.GetAdjective] ile omuz omuza durmak ve Hint altkıtasını [ENG.GetAdjective] ellerinde sıkıca tutmak çok önemlidir."
 RAJ_defense_of_india_act:0 "Hindistan Savunma Yasası"
 RAJ_defense_of_india_act_desc:0 "[GetRajName]'ın güvenliği dış saldırıyla tehdit altındadır. [ROOT.GetLeader] kamu güvenliğini ve çıkarını sağlamak için özel önlemler alınmasını ve [GetRajAdjective] devletinin savunmasını sağlamak için bir bildiri yayınladı."
 RAJ_defense_of_malaya:0 "Malaya'nın Savunması"
 RAJ_defense_of_malaya_desc:0 "[MAL.GetNameDef], Hint Okyanusu ile Pasifik arasındaki konumu nedeniyle istila riski altında olabilir. Bir diğer taç mücevheri olarak, bölgeyi savunmak ve tahkim etmek için üzerimize düşeni yapmalıyız. Güneydoğu Asya'nın kontrolünü elimizde tutmalıyız."
 RAJ_deforestation:0 "Ateşe Yakıt"
 RAJ_deforestation_desc:0 "Ateş endüstriyi besler. Ateşin odun ve kömüre ihtiyacı vardır ve bizde bol miktarda var, o halde neden kullanmayalım?"
 RAJ_demand_return_of_imperialist_colonies:0 "Emperyalist Sömürgelerin İadesini Talep Et"
 RAJ_demand_return_of_imperialist_colonies_desc:0 "Artık alt kıtadaki tüm emperyalist sömürgelerin iadesini talep etme zamanıdır, tüm Hint topraklarını bir bayrak altında birleştirerek sömürge dönemine son vermeliyiz."
 RAJ_demobilize:0 "Terhis Et"
 RAJ_demobilize_desc:0 "Hükümetin temel şartlarından biri, ordunun terhis edilmesi ve sadece iskelet bir barış gücünün tutulmasıdır. Ordumuzun kendilerininkini geçmesinden mi endişe ediyorlar?"
 RAJ_desert_training:0 "Çöl Eğitimi"
 RAJ_desert_training_desc:0 "Savaş güçlerimizin becerisini ve etkinliğini artırma çabalarımızın bir parçası olarak, Thar çölü ve çevresinde bir eğitim rejimi oluşturabiliriz. Bu, birliklerimizin kurak ortamlara alışmasına yardımcı olmalıdır."
 RAJ_destroyer_of_worlds:0 "Dünyaların Yokedicisi"
 RAJ_destroyer_of_worlds_desc:0 "Zamanla düşmanlarımızı yok edecek kadar güçlü bir dünyalar yokedicisi olacağız."
 RAJ_dominate_the_bay_of_bengal:0 "Bengal Körfezi'ne Hakim Ol"
 RAJ_dominate_the_bay_of_bengal_desc:0 "Bengal Körfezi'nde deniz hakimiyetini sağlamak, deniz stratejimiz için hayati öneme sahiptir. Bu sularda varlığımızı genişleterek ve güç projekte ederek ticaret yollarını güvence altına alır ve bölgesel hakimiyetimizi ortaya koyarız."
 RAJ_douglas_dakota:0 "Douglas Dakota"
 RAJ_douglas_dakota_desc:0 "Birliklerin ve malzemelerin hızlı nakliyesini sağlamak için acil bir ihtiyacımız var. Dakota, bu görev için oldukça yetenekli bir uçaktır."
 RAJ_east_india_railways_dlc:0 "Doğu Hindistan Demiryolları"
 RAJ_east_india_railways_dlc_desc:0 "Doğu Hindistan Demiryolları'nı genişleterek ve modernize ederek ticareti güçlendirebilir, bağlantıyı iyileştirebilir ve daha müreffeh ve bütünleşik bir ulusun temellerini atabiliriz."
 RAJ_eastern_pakistan:0 "Doğu Pakistan"
 RAJ_eastern_pakistan_desc:0 "Bangladeş, Doğu Pakistan olacak ve tüm Müslümanlar tek bir bayrak altında yönetilecek."
 RAJ_eastern_pakistan_tt:0 "§Y[BAN.GetName]§! bölünme sırasında §Y[PAK.GetName]§!'e ait olacak"
 RAJ_eastern_shipyard_construction:0 "Doğu Tersane İnşası"
 RAJ_eastern_shipyard_construction_desc:0 "Modern bir deniz kuvvetinin büyümesini desteklemek için doğu sahilinde gemi inşa kapasitemizi genişleteceğiz. Bu yeni tersaneler, denizcilik emellerimizin bel kemiği olacak."
 RAJ_education_efforts:0 "Eğitim Çabaları"
 RAJ_education_efforts_2:0 "$RAJ_education_efforts$"
 RAJ_education_efforts_2_desc:0 "$RAJ_education_efforts_desc$"
 RAJ_education_efforts_desc:0 "[ROOT.GetName]'da okuryazarlık oranı hala yetersiz. Büyük güçlere yetişmek için eğitim harcamalarını büyük ölçüde artırmalıyız."
 RAJ_education_for_the_masses:0 "Kitleler için Eğitim"
 RAJ_education_for_the_masses_desc:0 "Bilgi olmadan, devrim zulme dönüşür.\nOkuryazarlık, politik eğitim ve bilimsel öğretim her köye ve fabrikaya getirilecek."
 RAJ_eic_shortcut:0 "Doğu Hindistan Şirketi"
 RAJ_elephants_for_the_modern_age:0 "Modern Çağ için Filler"
 RAJ_elephants_for_the_modern_age_desc:0 "Mughal İmparatorluğu'nun güçlü savaş filleri bir zamanlar savaş alanına hükmediyordu. Şimdi, onların mirasını zırhlı araçlara ve mekanize kuvvetlere yatırım yaparak modern çağa uyarlıyoruz, imparatorluğumuzu zafere taşıyacak durdurulamaz savaş makineleri yaratıyoruz."
 RAJ_empower_provincial_authorities:0 "Eyalet Yetkililerini Güçlendir"
 RAJ_empower_provincial_authorities_chances_tt:0 "§Y$RAJ_investments_from_local_leaders$§!, odağı §YSivil Sanayi§!, §YAskeri Sanayi§! ve §YSavunma Altyapısı§! arasında eşit olarak bölecek."
 RAJ_empower_provincial_authorities_desc:0 "Özel çıkarları desteklemek yerine, yerel yetkililerin kalkınmayı doğrudan denetlemek için idari güçlerini güçlendireceğiz. Yatırım kararlarını eyalet yönetimlerine emanet ederek, sorumlulukla ödüllendirilen sadakati sağlarız."
 RAJ_engineering_revolution:0 "Mühendislik Devrimi"
 RAJ_engineering_revolution_desc:0 "Hindistan'ın ilerlemesi bir mühendislik devrimi gerektirir. Altyapıya, endüstriyel kalkınmaya ve son teknolojiye yatırım yaparak ulusu hem barışta hem de savaşta lider olabilecek bir güce dönüştürebiliriz."
 RAJ_enrollment_of_dali_children:0 "Dalit Çocuklarının Kaydı"
 RAJ_enrollment_of_dali_children_desc:0 "Dalitler, \"dokunulmazlar\", kast sisteminin en alt tabakası sürekli yoksulluk içinde yaşıyor. Ulusumuzun bir lekesi olan kast sistemini yıkmak ancak çocuklarını okula kaydederek başlayabilir."
 RAJ_establish_the_alupuram_works:0 "Alupuram Fabrikasını Kurmak"
 RAJ_establish_the_alupuram_works_desc:0 "Kanadalı Alcan'ın bir yan kuruluşu olarak kurulan Indian Aluminium Company, ilk alüminyum izabe tesisini kurmayı hedefliyor. Bu Alupuram Fabrikaları, kendi adlarıyla Ernakulam bölgesinde yer alacak. Bunun gerçekleştiğini görmeliyiz, böylece endüstrilerimiz yeterince güçlendirilebilir."
 RAJ_establish_the_reserve_bank_of_india:0 "Hindistan Merkez Bankası'nı Kur"
 RAJ_establish_the_reserve_bank_of_india_desc:0 "Ekonomimizi şok dalgalarından yeterince korumak için, para birimimizi kontrol yetkisine sahip bir merkez bankası kuracağız."
 RAJ_every_man_a_gun:0 "Her Adama Bir Silah"
 RAJ_every_man_a_gun_desc:0 "Halk Cumhuriyeti'nde tüm vatandaşlar askerdir.\nEğitimi standartlaştıracağız ve nüfusu topluca silahlandıracağız, böylece ulusun kendisi bir kale haline gelecek."
 RAJ_every_man_a_leader:0 "Her Adam Bir Lider"
 RAJ_every_man_a_leader_desc:0 "Gerçek devrimci güç emirlerden değil, inisiyatiften gelir.\nYerel komutanları ve milis liderlerini izin beklemeden kararlı hareket etmeleri için eğiteceğiz."
 RAJ_exile_princes:0 "Prensleri Sürgün Et"
 RAJ_exile_princes_desc:0 "Prens yönetimi çağı sona erdi. Gerçek ulusal birliği sağlamak için bu feodal güç kalıntılarını, saraylarından ve bir zamanlar yönettikleri halktan uzaklaştıracağız."
 RAJ_exiled_princes_flag:0 "Prensleri Sürgün Etti"
 RAJ_expand_healthcare_facilities:0 "Sağlık Tesislerini Genişlet"
 RAJ_expand_healthcare_facilities_desc:0 "[GetRajName]'da sağlık hizmetleri feci şekilde yetersiz. Dizanteri, kolera ve sıtma kırsalı kasıp kavuruyor, büyümeyi engelliyor. Yerel tesisleri genişleterek bunun önüne geçeceğiz."
 RAJ_expand_industry_in_hyderabad:0 "Hyderabad'da Sanayiyi Genişlet"
 RAJ_expand_industry_in_hyderabad_desc:0 "Hyderabad'daki fabrikaları genişletmek, fazla yatırım yapmadan sanayi kapasitemizi büyük ölçüde artıracaktır."
 RAJ_expand_mazagon_dock_dlc:0 "$RAJ_expand_mazagon_dock$"
 RAJ_expand_mazagon_dock_dlc_desc:0 "$RAJ_expand_mazagon_dock_desc$"
 RAJ_expand_tax_loopholes:0 "Vergi Boşluklarını Genişlet"
 RAJ_expand_tax_loopholes_desc:0 "Vergi kodundaki boşluklardan yararlanarak yükümlülüklerimizi yasal olarak en aza indirebilir ve bu tasarrufları daha fazla genişlemeye yatırabiliriz. Verimlilik, sonuçta bilançoyla başlar."
 RAJ_expand_the_zamindari_system:0 "Zamindari Sistemini Genişlet"
 RAJ_expand_the_zamindari_system_desc:0 "Zamindari sistemi uzun süredir kırsal yönetim ve gelir toplama için güvenilir bir çerçeve sağlıyor. Kapsamını genişleterek ve sadık toprak sahiplerinin ayrıcalıklarını teyit ederek, merkezi devleti aşırı zorlamadan yerel düzeni ve idari verimliliği sağlayabiliriz."
 RAJ_exploit_the_frontier:0 "Sınırı Sömür"
 RAJ_exploit_the_frontier_decisions_tt:0 "ülkemizde kaynak üretiminin geliştirilmesine ve Burma'da kaynak hakları talep edilmesine izin verir."
 RAJ_exploit_the_frontier_desc:0 "Uzak ve yeterince kullanılmayan bölgelerde büyük kaynak yatakları bulunuyor. [BRM.GetNonIdeologyName] gibi bölgelerde operasyonları genişleterek ve daha fazla kontrol sağlayarak tungsten gibi kritik malzemeleri güvence altına alabilir ve büyüyen savaş makinemizi besleyebiliriz."
 RAJ_extend_indian_security_zone:0 "[GetRajName] Güvenlik Bölgesini Genişlet"
 RAJ_extend_indian_security_zone_desc:0 "Güvenlik bölgemizi genişletmek, Hindistan’ın sınırlarını koruyacak ve bölgede güç projeksiyonu sağlayacaktır. Etkimizi genişleterek, güvenli ve egemen bir ulus için gerekli istikrarı ve korumayı sağlarız."
 RAJ_extended_franchise:0 "Genişletilmiş Haklar"
 RAJ_extended_franchise_desc:0 "Sıradan [GetRajAdjective] halkının haklarını genişletmek, [ENG.GetAdjective] kontrolünü azaltmak için önemli bir girişimdir"
 RAJ_famine_impact_reduction:0 "§YBu, Kıtlık olduğunda etkisini azaltacaktır§!"
 RAJ_favor_the_muslim_league:0 "Müslüman Birliği'ni Kayır"
 RAJ_favor_the_muslim_league_desc:0 "Müslüman Birliği'ne daha fazla tanınma ve siyasi destek sağlayarak, baskın milliyetçi harekete karşı sadık bir denge unsuru yetiştirebiliriz. Onları güçlendirmek, Hindistan adına konuşmak isteyenler arasında yararlı bir bölünme yaratır. Birlikte güç, bölünmeyle yönetilebilir politika vardır."
 RAJ_fight_malnutrition:0 "Yetersiz Beslenmeyle Mücadele Et"
 RAJ_fight_malnutrition_desc:0 "Halk arasında yetersiz beslenmeyle mücadele etmek için kapsamlı planlar uygulamalıyız."
 RAJ_five_year_plan:0 "Beş Yıllık Plan"
 RAJ_five_year_plan_desc:0 "Her komünist devletin bir beş yıllık plana ihtiyacı vardır! [RAJ.GetNameDefCap]'ın sanayisinin gelişebilmesi için kendi planımızı oluşturmaya başlamalıyız!"
 RAJ_five_year_plan_flag:0 "§YBeş Yıllık Plan§! odağını tamamladı"
 RAJ_five_year_plan_modify_tt:0 "§YBeş Yıllık Plan§!'ı şu şekilde değiştirir:"
 RAJ_five_year_plan_tt:0 "§YTarımsal Sosyalizm§! veya §YKentsel Endüstriyalizm§! tamamlanması Beş Yıllık Plan'ı değiştirecek"
 RAJ_five_year_plan_when_removed_tt:0 "Geçerli günler: [?RAJ_five_year_plan_flag:days|Y0]"
 RAJ_focus_on_military_industry:0 "Askeri Sanayiye Odaklan"
 RAJ_focus_on_military_industry_desc:0 "Ülkemizin güvenliğini her şeyden önce tutmalıyız, hayatta kalmamızı sağlamak için ordumuzu genişletmeye öncelik vermeliyiz."
 RAJ_focus_on_the_countryside:0 "Kırsala Odaklan"
 RAJ_focus_on_the_countryside_desc:0 "Gücümüz toprağı evleri olarak gören milyonlarda yatıyor.\nOnlara yatırım yapalım, onları silahlandıralım ve örgütleyelim — devrim köylere aittir."
 RAJ_for_the_people_by_the_people:0 "Halk İçin, Halk Tarafından"
 RAJ_for_the_people_by_the_people_desc:0 "Odağımız, halkın iradesine gerçekten dayanan bir ordu inşa etmek için piyade, topçu ve destek tümenlerini güçlendirmek olacak."
 RAJ_force_china_to_accept_opium_trade:0 "Üçüncü Afyon Savaşı"
 RAJ_force_china_to_accept_opium_trade_desc:0 "[CHI.GetName] afyon ticaretini kontrol etmeye çalıştı, bu da büyüme hedeflerimizle doğrudan çatışıyor. Hatalarını görmelerini sağlamalıyız."
 RAJ_force_china_to_accept_opium_trade_tt:0 "Dünya çapında bir afyon piyasası ortaya çıkacak. Bazı generaller bunu biraz fazla sevebilir..."
 RAJ_forging_the_mughal_arsenal:0 "Mughal Cephaneliğini Yeniden Dövmek"
 RAJ_forging_the_mughal_arsenal_desc:0 "Geçmişin savaşları sopalarla ve taşlarla kazanıldı, o günler geride kaldı. Eğer imparatorluğumuz modern dünyanın büyük güçlerine karşı ayakta kalacaksa, geniş bir askeri makineyi destekleyebilecek bir sanayi temeli inşa etmeliyiz. Montaj hatları Sanayi'nin sesiyle uğuldayacak ve yakında ordularımız kendi ellerimizle dövülmüş silahlarla yürüyecek."
 RAJ_form_a_federal_court:0 "Federal Mahkeme Kur"
 RAJ_form_a_federal_court_desc:0 "Herhangi bir demokrasi biçimi, işlev görmek ve hukukun üstünlüğünü sağlamak için bir federal mahkeme gerektirir. Akranlarımız tarafından yargılandığımızdan emin olmalıyız, [ENG.GetAdjective] avukatları tarafından değil."
 RAJ_form_a_police_force:0 "Bir Güvenlik Gücü Kur"
 RAJ_form_a_police_force_desc:0 "Resmi bir orduyu sürdürmemizi engelleyen kısıtlamalar varken, polislik kisvesi altında bir güvenlik gücü kurup donatma yetkisine sahibiz. Çıkarlarımızı korumak için gerekli bir adımdır."
 RAJ_form_ties_with_leftist_parties:0 "Solcu Partilerle Bağ Kur"
 RAJ_form_ties_with_leftist_parties_desc:0 "Ülkedeki sosyalistlerden ve komünistlerden destek toplamamız gerekiyor."
 RAJ_forming_an_indian_doctrine:0 "Hint Doktrini Oluşturmak"
 RAJ_forming_an_indian_doctrine_desc:0 "Kendi yolumu çizme zamanı geldi. Hint doktrini, benzersiz güçlerimizi ve hedeflerimizi yansıtacak şekilde geliştirilecek."
 RAJ_fortify_aden:0 "Aden'i Tahkim Et"
 RAJ_fortify_aden_desc:0 "Aden artık önemli bir liman olduğu için potansiyel saldırılara karşı güçlendirilmesi gerekiyor."
 RAJ_fortify_el_alamein:0 "El-Alamein'i Tahkim Et"
 RAJ_fortify_el_alamein_desc:0 "El-Alamein, Mısır'ı elde tutmak ve güvence altına almak açısından stratejik bir öneme sahiptir. Taç, bu bölgeyi tahkim ederek düşmanlarımızın [ENG.GetAdjective] Kuzey Afrika'da bir dayanak noktası elde etmesini önleme çabalarımızı büyük ölçüde takdir edecektir."
 RAJ_forward_bloc:0 "İleri Blok"
 RAJ_forward_bloc_desc:0 "İleri Blok, Hindistan'ın geleceği için uzlaşmayı reddeden ve devrimci eylemi benimseyen cesur bir vizyonu temsil eder. Tüm anti-emperyalist güçleri birleştirerek tam bağımsızlık mücadelesini hızlandırabilir ve daha güçlü, daha radikal bir Hindistan'ın temelini atabiliriz."
 RAJ_found_scindia_shipyard_dlc:0 "$RAJ_found_scindia_shipyard$"
 RAJ_found_scindia_shipyard_dlc_desc:0 "$RAJ_found_scindia_shipyard_desc$"
 RAJ_founding_of_the_peoples_republic:0 "Halk Cumhuriyeti'nin Kuruluşu"
 RAJ_founding_of_the_peoples_republic_desc:0 "Eski düzeni devirdik.\nŞimdi halk tarafından, halk için inşa edilen ve devrimle ayakta duran yeni bir düzen kurma görevi başlıyor."
 RAJ_free_abyssinia:0 "Habeşistan'ı Özgürleştir"
 RAJ_free_abyssinia_desc:0 "Habeşistan bölgesinin düşman ellerinde kalmasına çok uzun süre izin verdik. Aden üzerinden Afrika Boynuzu'na güçlü bir deniz çıkarması düzenleyerek ve halkını işgalcilerden kurtararak taç karşısındaki değerimizi göstereceğiz."
 RAJ_freedom_of_the_press:0 "Basın Özgürlüğü"
 RAJ_freedom_of_the_press_desc:0 "Basın özgürlüğü, herhangi bir gelişmekte olan demokrasi için bir gerekliliktir, onsuz otoriterlik hemen köşede bekler."
 RAJ_frontier_corps:0 "Sınır Kolordusu"
 RAJ_frontier_corps_desc:0 "Ülkemiz birkaç biyomdan oluşuyor, bunlar arasında doğunun engebeli sınır arazileri var. Oradaki milislerle iletişime geçerek sert çevresel savaş konusundaki uzmanlıklarını dahil etmek bizim için bir nimet olacaktır."
 RAJ_funnel_british_investments_into_princely_states:0 "Yatırımları Prenslik Devletlerine Yönlendir"
 RAJ_funnel_british_investments_into_princely_states_desc:0 "Taç, şirkete yapılan her yatırımın Hindistan içinde harcanmasını emretti, ancak taç şirket içinde olması gerektiğini belirtmedi."
 RAJ_funnel_british_investments_into_princely_states_tt:0 "Hint alt kıtasındaki her konu §G1§! §YSivil Fabrika§! ve §G3§! İnşaat Yuvası alacak.\nHenüz serbest bırakılmamış konular serbest bırakıldığında bonusu alacak."
 RAJ_give_me_blood_and_i_will_grant_you_freedom:0 "Bana Kan Verin, Size Özgürlük Vereceğim"
 RAJ_give_me_blood_and_i_will_grant_you_freedom_desc:0 "Bağımsızlık yolunun bedeli mücadele ve fedakarlıktır. Cesurları davamız için savaşmaya çağırarak, sömürge yönetiminin zincirlerini kıracak kadar güçlü bir hareketi ateşleyebiliriz. Zafer, bedelini ödemeye hazır olanların olacaktır. -Bu Türkçe Yama T1atar0 Tarafından Yapılmıştır-"
 RAJ_give_me_blood_and_i_will_grant_you_freedom_tt:0 "Demokratik destekçiler ve bizim aramızda bağımsızlık için bir iç savaş başlatacak\n§Y65%§! veya §Y85% direniş§! seviyesinin üzerindeki her eyalet iç savaş sırasında bizim tarafımızda yer alacak ve en yüksek direnişe bağlı olarak sırasıyla 1 veya 2 tümen bağışlayacak.\nDiğer tüm eyaletler Demokratik tarafı destekleyecek."
 RAJ_give_sikkim_administrative_rights_for_bhutan:0 "Butan İçin Sikkim'e İdari Haklar Ver"
 RAJ_go_into_hiding:0 "Saklan"
 RAJ_go_into_hiding_desc:0 "Subhas Chandra Bose, bağımsızlık mücadelesini sürdürmek için İngiliz gözetiminden kaçmalıdır. Saklanarak hareketin liderliğinin sağlam kalmasını sağlar ve zamanı geldiğinde saldırmaya hazır olur."
 RAJ_go_into_hiding_tt:0 "Bose esaretten kaçacak ve yolculuğuna başlayacak, iç savaş başladığında geri dönecek"
 RAJ_great_depression_price_controls:0 "Büyük Buhran Fiyat Kontrolleri"
 RAJ_great_depression_price_controls_desc:0 "Büyük Buhran, Hint altkıtasını sert bir şekilde vurdu. Rupiyi Sterlin'e bağlayarak ve çeşitli fiyat kontrolleri uygulayarak durumu stabilize etmeyi umuyoruz."
 RAJ_great_indian_peninsula_railway_dlc:0 "Büyük Hint Yarımadası Demiryolu"
 RAJ_great_indian_peninsula_railway_dlc_desc:0 "Büyük Hint Yarımadası Demiryolu, Orta ve Güney Hindistan'ın ekonomik potansiyelini açığa çıkarmanın anahtarıdır. Bu ağı genişleterek ticareti destekler, endüstrileri güçlendirir ve alt kıta genelinde kesintisiz bağlantı sağlarız."
 RAJ_ground_pounder:0 "Yer Döven"
 RAJ_ground_pounder_desc:0 "Hindistan'ın engebeli arazisi, tankların hızlı hareket etmesini zorlaştırır. Yakın hava desteği, ağır yer desteği eksikliğini telafi etmek için hayati öneme sahip olacaktır."
 RAJ_guarantee_nepalese_independence:0 "Nepal Bağımsızlığını Garanti Et"
 RAJ_guarantee_nepalese_independence_desc:0 "Nepal’in egemenliği, emperyal tahakküme karşı direnişin bir sembolüdür. Bağımsızlığını garanti ederek, Himalayalar’ı korur ve bölgedeki yabancı etkisine karşı mücadelede güçlü bir müttefik sağlarız."
 RAJ_guided_democracy:0 "Yönlendirilmiş Demokrasi"
 RAJ_guided_democracy_desc:0 "Dikkatlice yönetilen bir demokratik süreç, seçim illüzyonu sunarken sonuçların sıkı bir şekilde kontrolümüz altında kalmasını sağlayacaktır. İstikrar rehberlik gerektirir ve biz bunu sunmaya hazırız."
 RAJ_gun_and_shell_factory_cossipore:0 "Silah ve Mermi Fabrikası"
 RAJ_gun_and_shell_factory_cossipore_desc:0 "Cassiopore fabrikası, Piyade Teçhizatı yeteneklerimizi artırmanın yanı sıra birliklere mühimmat sağlayacaktır."
 RAJ_gurkhas:0 "Gurkhalar"
 RAJ_gurkhas_desc:0 "Cesaretleri ve azimleriyle tanınan Gurkhalar, savaşta eşsiz bir seçkin güçtür. Rollerini genişleterek ve davamıza bağlılıklarını sağlayarak savaş alanında kritik bir avantaj elde ederiz."
 RAJ_halls_of_knowledge:0 "Bilgi Salonları"
 RAJ_halls_of_knowledge_2:0 "İmparatorluk Akademileri"
 RAJ_halls_of_knowledge_2_desc:0 "Bilgi, kalıcı gücün anahtarıdır. Mughal İmparatorluğu genelinde İmparatorluk Akademileri kurarak, yeniliği yönlendirecek, yönetimi güçlendirecek ve imparatorluğun bilgelik ve ilerleme mirasını garanti altına alacak bilim adamları, bilim insanları ve yöneticiler yetiştiririz."
 RAJ_halls_of_knowledge_3:0 "Sonsuz Bilginin Kuyusu"
 RAJ_halls_of_knowledge_3_desc:0 "Bilgi, insanın adım atmaya cesaret edemeyeceği bir kaos kuyusuna yol açabilir, ancak oraya adım atmak zorundayız."
 RAJ_halls_of_knowledge_desc:0 "Güçlü bir ulus, bilgi temeli üzerine inşa edilir. Araştırma ve eğitime yatırım yaparak, yeniliği teşvik eder, halkımızı güçlendirir ve [ROOT.GetNameDef]’ın bilim, sanayi ve ilerlemede bir lider olarak yerini garanti altına alırız."
 RAJ_halls_of_knowlege_3:0 "İmparatorluğun Kütüphaneleri"
 RAJ_halls_of_knowlege_3_desc:0 "Öğrenilmiş bir toplum, gelişen bir imparatorluğun temelidir. Mughal diyarında görkemli kütüphaneler inşa ederek, kadim bilgeliği korur, yeniliği teşvik eder ve imparatorluğu benzersiz bir yüceliğe taşıyacak gelecek nesillere ilham veririz."
 RAJ_hand_over_aden_to_the_crown:0 "Aden'i Tahta Devret"
 RAJ_hand_over_aden_to_the_crown_desc:0 "Planlandığı gibi [ROOT.GetNameDef], Aden'in yönetimini İngiliz tahtına devrederek idari yükten kurtulacak."
 RAJ_handloom_weaving:0 "El Dokuma Tezgahları"
 RAJ_handloom_weaving_desc:0 "El dokuma tezgahları, alt kıtada gelenek ve bağımsızlığın bir sembolü haline geldi, aynı zamanda yerel üreticilere çalışma fırsatları sağladı."
 RAJ_haripura_session_of_the_indian_national_congress:0 "İkinci Haripura Oturumu"
 RAJ_haripura_session_of_the_indian_national_congress_desc:0 "Kapitalizm küresel gerilimleri körüklerken, Swaraj'ı işçiler ve köylüler için bir mücadele olarak yeniden şekillendirme zamanı geldi. İkinci Haripura Oturumu bizi emperyalist ittifakları reddeden ve sınıfsız, kendine yeten bir Hindistan mücadelesini benimseyen devrimci bir vizyon altında birleştirecek."
 RAJ_headhunt_army_personell:0 "Ordu Personelini Avla"
 RAJ_headhunt_army_personell_desc:0 "Eski ordudan iş arayan birçok yükselen yıldız var, onlara hükümetin teklif edebileceğinden daha iyi bir teklif sunabiliriz."
 RAJ_heavy_industries:0 "Ağır Sanayi"
 RAJ_heavy_industries_desc:0 "Hızlı sanayileşme, [RAJ.GetName]'ın geleceğini güvence altına almak için hayati öneme sahiptir. Sağlam bir ağır sanayi sektörü geliştirerek, modern dünyada askeri gücün ve ekonomik bağımsızlığın temelini atıyoruz."
 RAJ_hedgemony_of_the_subcontinent:0 "Altkıtanın Hegemonyası"
 RAJ_hedgemony_of_the_subcontinent_desc:0 "Altkıtada sanayi hakimiyetine ulaştık, bu unvanı talep edebilecek diğerlerini geride bıraktık. Ele geçirilemez hale geldik, diğer ayrılıkçıları tozun içinde bıraktık."
 RAJ_hedgemony_of_the_subcontinent_tt:0 "Tüm başlangıç eyaletleri [ROOT.GetName]'e ait"
 RAJ_hedgemony_pakistan_assessed_tt:0 "§Y[PAK.GetName]§! ile karşılaştırmamız yapıldı (haftalık güncellenir)"
 RAJ_help_from_the_nagas:0 "Nagalardan Yardım"
 RAJ_help_from_the_nagas_desc:0 "Arazinin derin bilgisine ve eşsiz gerilla becerilerine sahip Nagalar, paha biçilmez müttefiklerdir. Desteklerini alarak kuzeydoğudaki konumumuzu güçlendirir, engebeli tepeleri direniş ve güç kalesine dönüştürürüz."
 RAJ_hide_communist_infiltration:0 "$RAJ_royal_indian_navy_mutiny_tt2$"
 RAJ_high_altitude_training:0 "Yüksek Rakım Eğitimi"
 RAJ_high_altitude_training_desc:0 "Himalayalar'ın sarp zirveleri güç ve dayanıklılık gerektirir. Özel yüksek rakım eğitim programları oluşturarak, kuvvetlerimizi aşırı ortamlarda hakimiyet kurmaya hazırlar, sınırlarımızı güvence altına alır ve stratejik dağ bölgelerinde kontrol sağlarız."
 RAJ_high_altitude_training_tt:0 "Bir dağcı şablonu kazanılacak"
 RAJ_hill_training:0 "Tepe Eğitimi"
 RAJ_hill_training_desc:0 "Askerlerimize sunduğumuz eğitimi çeşitlendirme girişimimizin bir parçası olarak, onların ormanlar, çöller ve şehirlerin yanı sıra dağlık arazide de savaşmaya hazır olduklarından emin olmalıyız."
 RAJ_hindi_as_a_national_language:0 "Ulusal Dil Olarak Hintçe"
 RAJ_hindi_as_a_national_language_desc:0 "Hintçeyi ulusal dil olarak benimsemek, Hindistan'ı ortak bir kültürel kimlik altında birleştirecektir. Kullanımını teşvik ederek iletişimi güçlendirir, ulusal gururu besler ve uyumlu, bağımsız bir devletin temellerini atarız."
 RAJ_hindu_mahasabha:0 "İlerici Hindu Devletleri"
 RAJ_hindu_mahasabha_desc:0 "Tüm Hindistan Hindu Büyük Meclisi, prenslik devletlerinin bağımsızlığını destekler ve onları 'Hindu gücünün temeli' olarak selamlar. Bu devletlere bağımsızlık vererek onlardan daha fazla fon elde edebilir ve ülkenin geri kalanını konsolide edebiliriz."
 RAJ_hindu_mahasabha_tt:0 "Bir Prenslik Devletini Kukla olarak serbest bırakmak, devlet kuklanız olduğu sürece bu ruhun bonusunu §G+4%§! artıracak, maksimum §Y32%§! olana kadar."
 RAJ_hindutva:0 "Hindutva"
 RAJ_hindutva_desc:0 "Hindutva ideolojisi, kültürel ve dini mirasa dayanan birleşik bir Hindistan vizyonunu öngörür. Bu ideolojiyi teşvik ederek, birliği güçlendiren ve Hindistan'ın küresel sahnede kendini ortaya koymasını sağlayan bir ulusal kimlik oluşturmayı hedefliyoruz."
 RAJ_his_majestys_loyal_government:0 "Majestelerinin Sadık Hükümeti"
 RAJ_his_majestys_loyal_government_break_free_tt:0 "Tamamen özgür olmak için üç zirve odağı da tamamlamamız gerekiyor: §Y$RAJ_the_dominion_of_india$§!, §Y$RAJ_keep_calm_and_carry_on$§! ve §Y$RAJ_holding_the_gates_of_india$§!."
 RAJ_his_majestys_loyal_government_desc:0 "Sokaklarda bağımsızlık çağrıları yükselse de, [ROOT.GetName]'ın yönetim mekanizması kararlılıkla ilerliyor. Majestelerinin atadığı Genel Vali tarafından yönetilen ve Hint Sivil Hizmeti tarafından desteklenen bizler, Taç'ın çıkarlarını disiplin ve kararlılıkla sürdüreceğiz."
 RAJ_holding_the_gates_of_india:0 "Hindistan'ın Kapılarını Tutmak"
 RAJ_holding_the_gates_of_india_desc:0 "Ne olursa olsun, [RAJ.GetNonIdeologyName]'ı doğudaki azgın istilacılardan korumalıyız. Coşku ve öfkeyle üzerimize gelebilirler, ama onların amansız fetihlerini [RAJ.GetNonIdeologyName]'ın Kapılarında durduracağız. Geçmelerine izin vermeyeceğiz."
 RAJ_hostile_takeover:0 "Düşmanca Devralma"
 RAJ_hostile_takeover_desc:0 "Her şey satın alınabilir, her şey. Sadece bir fiyat meselesi ve bir kişinin ne kadar eğileceği meselesidir."
 RAJ_hostile_takeover_tt:0 "§YSivil Fabrikalar§! karşılığında eyalet satın alma kararlarının kilidi açılır. Başlangıçta sahip olduğumuz eyaletler satın alırken indirim alır."
 RAJ_i_am_death:0 "Ben Ölümüm"
 RAJ_i_am_death_desc:0 "Liderimiz, suikast girişiminin ardından derin bir trans haline girdi. İnsanlığın zulmünün önlenemeyeceğini düşünerek bir aydınlanma yaşadı, o halde tüm insanlık onun sağlam demokratik kontrolü altında olmalıdır."
 RAJ_ignite_the_sino_indian_war:0 "Çin-Hindistan Savaşını Ateşle"
 RAJ_ignite_the_sino_indian_war_desc:0 "Çin ile sınır anlaşmazlıkları konusundaki gerilim artık göz ardı edilemez. Kesin eylemlerle Himalayalar'daki hakimiyetimizi pekiştirerek haklı topraklarımızı güvence altına alırız. Şimdi atılacak cesur bir darbe, Asya'nın güç dengesini lehimize değiştirebilir."
 RAJ_imperial_industry_initiative:0 "İmparatorluk Sanayi Girişimi"
 RAJ_imperial_industry_initiative_desc:0 "[ROOT.GetNameDef]’ın İmparatorluk’un bir dayanağı olarak konumunu güvence altına almak için kentsel sanayide kapsamlı bir genişlemeye bağlı kalmalıyız. İmparatorluk Sanayi Girişimi, kaynakları ağır imalat ve vasıflı işgücüne kanalize edecek, böylece şehirlerimizi altkıtada direnç ve yenilenmenin motorları haline getirecektir."
 RAJ_imperial_rail_renewal_act:0 "İmparatorluk Demiryolu Yenileme Yasası"
 RAJ_imperial_rail_renewal_act_desc:0 "Altkıta genelinde mal, asker ve ikmal hareketini hızlandırmak için [ROOT.GetNameDef]'ın demiryolu altyapısını kapsamlı bir şekilde elden geçireceğiz. İmparatorluk Demiryolu Yenileme Yasası, eskiyen hatları modernize edecek, lojistik kapasiteyi genişletecek ve geniş topraklarımızı çelik ve buharla birbirine bağlayacak."
 RAJ_imperial_rail_renewal_act_tt:0 "Sanayi dalında tamamlanan her Demiryolu Odağı için §G1§! §Y$industrial_complex$§! ekle."
 RAJ_import_substitution_industrialisation:0 "İthal İkameci Sanayileşme"
 RAJ_import_substitution_industrialisation_desc:0 "Mümkün olduğunda, ithal malları üretim maliyetlerini dengeleyerek yerli mallarla değiştirmeliyiz."
 RAJ_inclusive_nationalism:0 "Kapsayıcı Milliyetçilik"
 RAJ_inclusive_nationalism_desc:0 "Milliyetçilik ve ülkenizle gurur duymak mutlaka kötü bir şey değildir, bunu herkes için kapsayıcı olacak şekilde besleyebilirsek. Hepimiz ulusumuza aynı sevgiyi paylaşırsak bağlar kopmaz."
 RAJ_incorporation_of_the_east_india_company:0 "Doğu Hindistan Şirketi'nin Birleştirilmesi"
 RAJ_incorporation_of_the_east_india_company_desc:0 "Büyük buhranın şoku ve bağımsızlık çağrılarının giderek artmasıyla, [ENG.GetAdjective] taçının Hindistan'ı yönetme yükünü artık taşıyamayacağı açık. Geçici bir istikrarsızlığa yol açabilir, ancak statüko sürdürülebilir değil."
 RAJ_incorporation_of_the_east_india_company_tt:0 "§YHindistan§!, §YDoğu Hindistan Şirketi§! ve §YHindistan§! kalıntıları arasında bölünecek."
 RAJ_increase_funding_for_the_GRSE:0 "GRSE için Fonları Artır"
 RAJ_increase_funding_for_the_GRSE_desc:0 "Yeni tersaneler inşa etmeye olanak sağlamak için GRSE'ye devlet fonlarını artıracağız."
 RAJ_india_indivisible:0 "Hindistan Bölünmez"
 RAJ_india_indivisible_desc:0 "Topraklarımız hala huzursuzluk ve çatışmayla dolu. [ROOT.GetName]'ı bütün yapmak için birlikte çalışmalıyız."
 RAJ_india_indivisible_tt:0 "§YHint§!, §YPakistan§! ve §YBangladeş§! eyaletlerini çekirdek yapma kararının kilidi açılır"
 RAJ_india_united:0 "Hindistan Birleşik"
 RAJ_india_united_desc:0 "Bizler Müslümanlar, Hindular, Hristiyanlar, Yahudiler; hepimiz Hindistanız."
 RAJ_india_united_tt:0 "§YHindistan bölünme sırasında birleşik kalacak ve bölünmeyecek§!"
 RAJ_indian_air_force:0 "[ROOT.GetAdjective] Hava Kuvvetleri"
 RAJ_indian_air_force_desc:0 "Gökyüzü, modern savaşın yeni sınırıdır. Güçlü ve bağımsız bir Hint Hava Kuvvetleri kurarak egemenliğimizi güvence altına alır, havada hakimiyet sağlar ve geleceğin çatışmalarına hazırlanırız."
 RAJ_indian_army_corps_of_engineers:0 "[ROOT.GetAdjective] Ordu İstihkam Sınıfı"
 RAJ_indian_army_corps_of_engineers_desc:0 "Tahkimatlardan köprülere kadar, [ROOT.GetAdjective] Ordu İstihkam Sınıfı operasyonel başarı için hayati öneme sahiptir. Bu kritik dalı genişleterek ve donatarak kuvvetlerimizin her engelin üstesinden gelmesini sağlar, her cephede zaferin yolunu açarız."
 RAJ_indian_cruiser_development:0 "[ROOT.GetAdjective] Kruvazör Geliştirme"
 RAJ_indian_cruiser_development_desc:0 "Kendi donanma rotamızı çizme zamanı geldi. Yerli tasarımlı kruvazörler geliştirerek sanayi bağımsızlığımızı ortaya koyuyor ve modern bir Hint filosunun temelini atıyoruz."
 RAJ_indian_gentleman_officers:0 "Hint Centilmen Subaylar"
 RAJ_indian_gentleman_officers_desc:0 "Büyük İmparatorluk Mücevherimizin geleceğini ve güvenliğini sağlamak için yeni [RAJ.GetAdjective] ordumuzu yönetecek sadık adamlar bulmamız şart. Bu adamlar, İmparatorluk yetkilileriyle yakın işbirliği sayesinde [RAJ.GetNameDef]'a en güvenilir komutanlarımız olarak hizmet edecek kadar iyi hizmet ettiler."
 RAJ_indian_independence_act:0 "Hindistan Bağımsızlık Yasası"
 RAJ_indian_independence_act_desc:0 "Tarihte nadir görülen bir an gelir, eskiden yeniye geçtiğimiz, bir çağın bittiği ve uzun süredir bastırılan bir ulusun ruhunun ifade bulduğu bir an."
 RAJ_indian_legion:0 "Hint Lejyonu"
 RAJ_indian_legion_desc:0 "[GER.GetName] kontrolündeki yabancı Hint muhaliflerden oluşan Hint Lejyonu çöl savaşında kapsamlı eğitim aldı. Uzmanlıklarını kendi kuvvetlerimizi geliştirmek için kullanabiliriz."
 RAJ_indian_marine_corps:0 "[ROOT.GetAdjective] Deniz Piyadeleri"
 RAJ_indian_marine_corps_desc:0 "Amfibi operasyonlar ve özel taarruzlar konusunda eğitimli bir özel Deniz Piyadeleri birliği kuracağız."
 RAJ_indian_national_highways:0 "Hint Ulusal Karayolları"
 RAJ_indian_national_highways_desc:0 "[RAJ.GetNameDefCap]'ın Sanayisini geliştirmek için temelden, tedarik hatlarımızla başlamalıyız."
 RAJ_indian_prosperity_sphere:0 "Hint Refah Alanı"
 RAJ_indian_socialism:0 "Hint Sosyalizmi"
 RAJ_indian_socialism_desc:0 "Bir sosyalist büyük güçten ilham almak yerine, [RAJ.GetNameDefCap]'ın ihtiyaçlarına uygun kendi sosyalist doktrinimizi yaratacağız."
 RAJ_indian_states_force:0 "Hint Devletleri Gücü"
 RAJ_indian_states_force_desc:0 "Prenslik devletlerinin [GetRajName]'ı savunmak için çağrılabilecek kendi güçleri var."
 RAJ_indian_territorial_force:0 "[ROOT.GetAdjective] Bölgesel Kuvvet"
 RAJ_indian_territorial_force_desc:0 "[ROOT.GetAdjective] Bölgesel Kuvveti, vatanı savunmaya hazır eğitimli vatandaşlardan oluşan hayati bir ihtiyat sağlayacaktır."
 RAJ_indianize_the_army:0 "Ordunun Hintlileştirilmesi"
 RAJ_indianize_the_army_desc:0 "Silahlı kuvvetlerde sömürge etkisini Hint liderliğiyle değiştirme zamanı geldi. Hint subayları terfi ettirerek ve orduyu yeniden yapılandırarak ulusu gerçekten temsil eden ve hizmet eden bir ordu inşa ediyoruz."
 RAJ_indo_centric_curriculum:0 "Hint Merkezli Müfredat"
 RAJ_indo_centric_curriculum_desc:0 "[GetRajName]'da eğitim [ENG.GetAdjective] dünya görüşüne odaklanmış, [GetRajAdjective] kimliğini baltalamış ve tarihimizi itaatkarlıkla sınırlandırmıştır. Eğitim sistemimizi [GetRajAdjective] kimliği üzerine kurmalı ve çocuklara kendi tarihimizi öğretmeliyiz."
 RAJ_industrialists_joined_eic_tt:0 "§Y$RAJ_lobby_parliment$§! odağı tamamlandı"
 RAJ_industrialize_the_ganges:0 "Ganj'ı Endüstrileştir"
 RAJ_industrialize_the_ganges_desc:0 "Ganj yüzyıllardır bizi besledi.\nŞimdi makinelerimize güç verecek, fırınlarımızı besleyecek ve ordularımızı silahlandıracak."
 RAJ_infiltrate_aden:0 "Aden'e Sız"
 RAJ_infiltrate_aden_desc:0 "Aden, İngiliz gücünün stratejik bir kalesidir ve bölgedeki kontrolünü bozmanın anahtarını elinde tutar. Yerel direnişi örgütleyerek ve sızarak, bağımsızlık mücadelemiz başladığında İngiliz hakimiyetini zayıflatacak ve kaos yaratacak isyanları ateşleyebiliriz."
 RAJ_infiltrate_aden_tt:0 "Bağımsızlık savaşı başladığında §Y[659.GetName]§!, §Y[906.GetName]§!, §Y[658.GetName]§!, §Y[765.GetName]§!, §Y[422.GetName]§! ve §Y[656.GetName]§!'de milisler çıkararak [ENG.GetName] mülklerine saldıracak."
 RAJ_institute_of_fundamental_research_GOE:0 "Temel Araştırma Enstitüsü"
 RAJ_institute_of_fundamental_research_GOE_desc:0 "Önde gelen sanayiciler ve bilim insanlarının desteğiyle, ileri teorik çalışmalar yapmak için Temel Araştırma Enstitüsü'nü kuracağız. Enstitü, atom enerjisi çalışmaları da dahil olmak üzere en son deneylerin merkezi olacak."
 RAJ_institutional_money_laundering:0 "Kurumsal Para Aklama"
 RAJ_institutional_money_laundering_desc:0 "Yatırımcıların paranın gerçekte nereye gittiğini bilmelerine gerek yok, değil mi? Amacımız, hayati görevimiz tüm maliyetlerde kârı maksimize etmek değil mi? Biraz dolandırıcılık içeriyorsa ne olacak? Hiçbir şeyin farkına varmayacaklar."
 RAJ_institutional_money_laundering_tt:0 ""
 RAJ_integrate_the_princes:0 "Prensleri Entegre Et"
 RAJ_integrate_the_princes2:0 "Prens Boyunduruğu"
 RAJ_integrate_the_princes2_desc:0 "Prens devletlerinin yarı özerklik sistemi sürdürmek istediğimiz bir şey değil. Prens devletleri bir kez ve tamamen Hindistan'a dahil edilecek."
 RAJ_integrate_the_princes_desc:0 "Artık prensleri sürgün ettik ve onları yavaş yavaş Hindistan'a entegre ettik, şimdi Prens devletlerini bir kez ve tamamen entegre etme zamanı."
 RAJ_invite_soviet_industrial_experts:0 "Sovyet Endüstri Uzmanlarını Davet Et"
 RAJ_invite_soviet_industrial_experts_desc:0 "Sovyetlerin sıfırdan bir endüstriyel temel inşa etme deneyimi var.\nOnların modelinden öğrenelim ve kendi dönüşümümüzü hızlandıralım."
 RAJ_iron_will_indoctrination:0 "Demir İrade İndoktrinasyonu"
 RAJ_iron_will_indoctrination_desc:0 "Güç sadece vücutta değildir — inançtadır.\nHer askere mutlak disiplin, ideolojik netlik ve kırılmaz bir savaşma iradesi aşılayacağız."
 RAJ_jaguar:0 "Jaguar"
 RAJ_jaguar_desc:0 "Jaguar, demokratik adaleti yukarıdan dağıtmak için birinci sınıf bir adaydır."
 RAJ_join_the_co_prospherity_sphere:0 "Refah Alanı'na Katıl"
 RAJ_join_the_co_prospherity_sphere_desc:0 "Japonya, Batılı emperyalistlere karşı durmaya istekli tek yerel güç. Daha büyük bir hedef için onlara katılmamız gerekiyor."
 RAJ_join_the_co_prospherity_sphere_tt:0 "(§Y[JAP.GetName]§!) '§Y[RAJ.GetNameDefCap] Refah Alanı'na katılmak istiyor§!' etkinliğini alır."
 RAJ_join_the_shadow_scheme:0 "Gölge Planı'na Katıl"
 RAJ_join_the_shadow_scheme_desc:0 "Gizli operasyonlara katılarak istihbarat yeteneklerimizi genişletebilir ve stratejik konumumuzu güçlendirebiliriz."
 RAJ_jugantar:0 "Jugantar"
 RAJ_jugantar_desc:0 "Jugantar'ın ruhu uyanıyor, direnişi topraklara yayıyor. Bunu Bengal'i bir kez daha ele geçirmek için kullanabiliriz."
 RAJ_jugantar_tt:0 "[PAK.GetName]'a savaş ilan ettiğimizde Bangladeş çevresinde tümenler kazanacağız"
 RAJ_jungle_training_GOE:0 "Orman Eğitimi"
 RAJ_jungle_training_GOE_desc:0 "Bizimki kadar geniş topraklarda, avantajımıza kullanabileceğimiz büyük bir biyom çeşitliliğine sahip olmak şanslıyız. [RAJ.GetNonIdeologyName], [BRM.GetNonIdeologyName] ve Çinhindi ormanlarla kaplıdır ve askerlerimizi bu tehlikeli arazide etkili kılmak için özel eğitim önerilir."
 RAJ_just_good_business:0 "Sadece İyi İş"
 RAJ_just_good_business_desc:0 "Doğulu meslektaşlarımıza karşı bir şeyimiz yok gerçekten, sadece ihtiyacımız olan kaynaklara sahipler, bu sadece iyi iş."
 RAJ_keep_british_generals:0 "İngiliz Generalleri Tut"
 RAJ_keep_british_generals_desc:0 "Bu belirsiz zamanlarda deneyimli liderlik kritik öneme sahiptir. İngiliz generalleri tutarak ordunun uzmanlıklarından ve disiplininden faydalanmasını sağlar, bağımsızlık yolunda istikrar ve etkinliği koruruz."
 RAJ_keep_british_generals_tt:0 "[ENG.GetName] ile savaşa girsem bile tüm İngiliz generallerini tutacağız"
 RAJ_keep_calm_and_carry_on:0 "Sakin Ol ve Devam Et"
 RAJ_keep_calm_and_carry_on_desc:0 "Bu en zorlu saatte, tökezlemeyeceğiz. [ROOT.GetNameDefCap], yorulmak bilmeyen bir kararlılıkla savaş araçlarını döverek bir güç kalesi olarak yükselecek. Fırınlar yansın ve dövme tezgahları şarkı söylesin, çünkü zafer rahatlıktan değil, cesaret, ter ve çelikten doğar."
 RAJ_khadi_movement:0 "Khadi Hareketi"
 RAJ_khadi_movement_desc:0 "Swadeshi'nin bir parçası olarak bağımsızlığın sembolü Khadi haline geldi. El dokuması kumaş hem direnişin sembolik bir jestini verir, hem de ondan dokunan kıyafetler ezilen ve fakirler için birçok ekonomik fırsat sunar."
 RAJ_kingmaker:0 "Kral Yapıcı"
 RAJ_kingmaker_desc:0 "Gönüllüleri yabancı çatışmalara göndererek etkimizi genişletir ve değerli muharebe deneyimi kazanırız. Bu çabalar müttefiklerimizi desteklemekle kalmaz, aynı zamanda küresel mücadelelerin sonucunu şekillendirmede belirleyici bir güç olmamızı sağlar."
 RAJ_lahore_resolution:0 "Lahore Kararı"
 RAJ_lahore_resolution_desc:0 "Ülkedeki Müslüman azınlık, kendilerine ait bir vatan için çağrıda bulunan Lahore kararını benimsedi; Pakistan."
 RAJ_land_grab:0 "Arazi Edinme"
 RAJ_land_grab_desc:0 "Hızlı sanayileşmenin taleplerini karşılamak için alt kıta genelinde arazi edinmeli ve yeniden amaçlandırmalıyız. Genişleme, ilerleme öncelikli olduğunda tereddüt için çok az yer bırakır."
 RAJ_land_of_the_tillers:0 "Toprak İşleyenlerin Ülkesi"
 RAJ_land_of_the_tillers_desc:0 "Toprak ağaları gitti, ama mücadele devam ediyor.\nToprağı yeniden dağıtacağız ve feodalizmin son zincirlerini kıracağız — parça parça, köy köy."
 RAJ_land_reforms:0 "Arazi Reformları"
 RAJ_land_reforms_desc:0 "Daha fazla insana sahip oldukları araziyi kullanma yetkisi vermek onları sefaletten kurtaracaktır."
 RAJ_league_against_gandhism:0 "Gandhiciliğe Karşı Lig"
 RAJ_league_against_gandhism_desc:0 "Mahatma'nın şiddetsizlik politikası takdire şayandır. Ne yazık ki [ENG.GetAdjective] defalarca protestolara kurşunla karşılık vereceklerini kanıtladı. Bu nedenle yeni bir taktik gerekiyor, eğer gerekiyorsa kanla beslenen bir taktik."
 RAJ_league_against_gandhism_tt:0 "Bölünme huzursuzluğu olayları artık gerçekleştiğinde §G5%§! Savaş Desteği sağlayacak, maksimum §Y+50%§! olana kadar."
 RAJ_league_against_gandhism_tt_event:0 "§Y$RAJ_league_against_gandhism$§! tarafını seçtiğiniz için ekstra §G+5%§! Savaş Desteği eklenecek."
 RAJ_learn_from_the_crown:0 "Taç'tan Öğren"
 RAJ_learn_from_the_crown_desc:0 "Taç'ın geniş askeri deneyiminden öğrenmeli, kanıtlanmış doktrinlerini benimseyerek gelecek zorluklara hazırlanmalıyız."
 RAJ_learn_from_the_secret_intelligence_service:0 "Gizli İstihbarat Servisi'nden Öğren"
 RAJ_learn_from_the_secret_intelligence_service_desc:0 "İngiliz Gizli İstihbarat Servisi ile çalışarak çıkarlarımızı korumak için güçlü bir istihbarat ağı inşa edebiliriz."
 RAJ_legacy_of_military_service:0 "Askeri Hizmet Mirası"
 RAJ_legacy_of_military_service_desc:0 "[GetRajName] çevresinde babaları askerlik yapmış birçok köy var, bu yüzden oğulları da yapmaya zorlanıyor. Sonuçta bu bir gelenek ve bunu normalden daha fazla asker toplamak için kullanabiliriz."
 RAJ_legacy_of_timur:0 "Timur'un Mirası"
 RAJ_legacy_of_timur_desc:0 "Timur'un imparatorluğu asla tarihe karışmak için yaratılmadı. Atalarımızın topraklarını geri alarak ve onları tek bir yönetim altında birleştirerek, Timur mirasını canlandıracak ve güç ve hırs dolu yeni bir çağ başlatacağız. Dünya bir kez daha Timur'un oğulları önünde titreyecek."
 RAJ_legalize_the_opium_trade:0 "Afyon Ticaretini Yasal Hale Getir"
 RAJ_legalize_the_opium_trade_desc:0 "Tartışmalı olsa da, afyonun yasallaştırılması muazzam ekonomik kazanç vaat ediyor. Ticaretini düzenleyerek bir kötü alışkanlığı kazançlı bir finansal stratejinin temel taşına dönüştürebiliriz."
 RAJ_linlithgows_declaration_of_war:0 "Linlithgow'un Savaş İlanı"
 RAJ_linlithgows_declaration_of_war_current_effects_tt:0 "§Y[ROOT.GetNameWithFlag]§!, efendilerinin mevcut her düşmanına savaş ilan ediyor"
 RAJ_linlithgows_declaration_of_war_desc:0 "[ENG.GetAdjective] İmparatorluğu'nun bir parçası olarak, silah taşımak ve savaşlarına katılmak bizim sorumluluğumuzdur. Kongre Liderlerinden izin istemekle zaman kaybetmeye gerek yok. Boğayı boynuzlarından tutmak gerekir. Bildirileri hazırlayın ve [ENG.GetNameDef]'ın düşmanlarıyla savaşa hazırlanın."
 RAJ_linlithgows_declaration_of_war_tt:0 "§Y[ROOT.GetNameWithFlag]§!, efendilerinin (§Y[ENG.GetNameWithFlag]§!) her düşmanına savaş ilan edecek."
 RAJ_lions_of_the_great_war_:0 "Büyük Savaşın Aslanları"
 RAJ_lions_of_the_great_war__desc:0 "Hint askerlerinin Büyük Savaş'taki fedakarlıkları, cesaretlerinin bir kanıtıdır. Miraslarını anarak cesaretlerini onurlandırır ve yeni bir nesli Hindistan'ın kaderini korumak için bu ruhu sürdürmeye teşvik ederiz."
 RAJ_lions_of_the_great_war_dlc:0 "$RAJ_lions_of_the_great_war$"
 RAJ_lions_of_the_great_war_dlc_desc:0 "$RAJ_lions_of_the_great_war_desc$"
 RAJ_litteracy_effort:0 "Okuryazarlık Çabası"
 RAJ_litteracy_effort_desc:0 "Eğitimsiz bir nüfus, açık ve korunmasız bir zihin gibidir. Okuma yazma bilmek her insanın ihtiyaç duyduğu temel bir beceridir, sonuçta bilgili bir sürüden kim çıkar kaybeder ki çoban değilse?"
 RAJ_lobby_for_increased_policing_responsibilities:0 "Artırılmış Polislik Sorumlulukları İçin Lobi Yap"
 RAJ_lobby_for_increased_policing_responsibilities_desc:0 "Dünya artık eskisi gibi sessiz bir yer değil. İçeriden ve dışarıdan yükselen gerilimler, şirket mülkünü korumak için ek yetki veriyor. Artan PMC harcamaları için lobi yapacağız, elbette hükümet mantıklı davranacaktır, ve eğer yapmazsa, her adamın bir fiyatı vardır."
 RAJ_lobby_parliment:0 "Parlamentoyu Lobi Yapmak"
 RAJ_lobby_parliment_desc:0 "Özel yatırımcıların desteğiyle, özelleştirmeyi bir başka küresel ekonomik çöküşe karşı tek uygulanabilir koruyucu olarak sunmak için Parlamentoyu lobi yapacağız. Raj'ın bir kısmını satmak sadece bir strateji değil, imparatorluk için istikrardır."
 RAJ_lobby_parliment_tt:0 "Doğu Hindistan Şirketi'ni oluşturmaya başlayacağız"
 RAJ_local_recruitment_offices:0 "Yerel İşe Alım Ofisleri"
 RAJ_local_recruitment_offices_desc:0 "Büyük bir nüfusumuz var, birçoğu ekonomik durumlarını iyileştirmek için genel bir taslak çağrısı yapmak yerine orduya gönüllü olarak katılacaktır. İşe alım ofisleri kurmak bize bol miktarda gönüllü sağlayacaktır."
 RAJ_local_recruitment_offices_tt:0 "Her [?RAJ_recruitment_offices_timeout_max]'ıncı ay §Y$idea_RAJ_agrarian_society$§! cezasını şu şekilde azaltacak:\n\t Asker Alınabilecek Nüfus Faktörü: §G+[?RAJ_agrarian_society_conscription_factor_penalty_reduction_display]%§!\n Seferberlik Hızı: §G[?RAJ_agrarian_society_mobilization_speed_penalty_reduction_display]%§!\n Seferberlik Yasası Maliyet Faktörü: §G[?RAJ_agrarian_society_mobilization_laws_cost_factor_penalty_reduction_display]%§!"
 RAJ_local_resistance_to_land_taxes:0 "Arazi Vergilerine Yerel Direniş"
 RAJ_local_resistance_to_land_taxes_desc:0 "Delhi'deki hükümet büyük ölçüde yerel vergilerle finanse ediliyor. Bu vergileri ödemeye direnmeyi teşvik edersek hükümeti boğabilir ve aynı zamanda servetin daha büyük bir kısmını halka aktarabiliriz."
 RAJ_long_range_escorts:0 "Uzun Menzilli Eskortlar"
 RAJ_long_range_escorts_desc:0 "Hayati tedarik hatlarını ve görevleri korumak için geniş mesafelerde bombardıman ve nakliye uçaklarına eşlik edebilecek uçaklara ihtiyacımız var. Uzun menzilli eskortlara yatırım yaparak hava üstünlüğümüzü ve sınırlarımızın ötesindeki operasyonların güvenliğini sağlarız."
 RAJ_look_to_the_future:0 "Geleceğe Bakmak"
 RAJ_look_to_the_future_desc:0 "Bu fiyat kaosunu kontrol etmek için geçmişe değil, geleceğe bakmamız gerekiyor. Büyük bir dizi istikrar önlemi uygulanmalı, dün uygulanmalıydı."
 RAJ_look_to_the_past:0 "Geçmişe Bakmak"
 RAJ_look_to_the_past_desc:0 "Fiyat kontrolleri, Büyük Buhran'ın bir faktörünü başarıyla hafifletti, ancak sonuç olarak kontroller şu anda enflasyonun kontrolden çıkmasıyla ekonomiye zarar veriyor. Çaresizlik, hoşnutsuzluğa yol açıyor ve daha fazla yerel lider, geçmişin büyüklüğüne dair hikayelerle halkı kışkırtarak siyasi güç kazanıyor.\nBir zamanlar olan şey yeniden yükselebilir mi?"
 RAJ_lowest_bigger_construction:0 "Düşük Maliyetli İnşaat"
 RAJ_lowest_bigger_construction_desc:0 "İnşaat maliyetlerini düşük tutmak için her zaman en düşük teklifi vereni seçmeliyiz."
 RAJ_loyalist_branch_capstone_focuses_become_free_tt:0 "Üç zirve odağın da tamamlanması (§Y$RAJ_the_dominion_of_india$§!, §Y$RAJ_keep_calm_and_carry_on$§! ve §Y$RAJ_holding_the_gates_of_india$§!) §YÖzgür§! özerklik seviyesine geçiş kısıtlamasını §Gkaldıracaktır§!."
 RAJ_madras_ship_repair_factories:0 "Madras Gemi Tamir Fabrikaları"
 RAJ_madras_ship_repair_factories_desc:0 "Madras, büyüyen filosumuzu sürdürmek ve yenilemek için özel tamir tesisleriyle bir kilit deniz destek merkezi haline getirilecek, böylece doğu sahilinde operasyonel hazırlık sağlanacak."
 RAJ_mahatma:0 "Mahatma"
 RAJ_mahatma_desc:0 "Mahatma Gandhi şüphesiz bağımsızlık hareketinin yüzüdür. Onun ve Jawaharlal Nehru ile birlikte bizi Britanya'ya bağlayan boyunduruğu kıracağız."
 RAJ_majestys_government_shortcut:0 "Sadık Bir Hükümet"
 RAJ_manipulate_army_statistics:0 "Ordu İstatistiklerini Manipüle Et"
 RAJ_manipulate_army_statistics_desc:0 "Taç, PMC'mizin çok büyüyüp etkili hale gelmesinden ve mevcut orduya meydan okumasından endişe ediyor. Peki, hükümet denetçilerini sayılarla ve yanlış yönlendirmelerle boğmanın yolları var."
 RAJ_manipulate_army_statistics_tt:0 "Tam insan gücü ve teçhizatla Düzensiz Tümenler oluşturur."
 RAJ_mass_assault:0 "Kitlesel Saldırı"
 RAJ_mass_production:0 "Seri Üretim"
 RAJ_mass_production_desc:0 "Ekipmanı en düşük maliyeti sunan özel girişimlerden temin edeceğiz. Ekipman maliyetlerini düşürmek büyümenin anahtarıdır."
 RAJ_mechanization_of_the_cavalry:0 "Süvarinin Mekanizasyonu"
 RAJ_mechanization_of_the_cavalry_desc:0 "Atlı savaş çağı sona erdi. Süvariyi mekanize ederek onu hız ve ateş gücünü birleştiren modern bir zırhlı güce dönüştürür, savaş alanında hakimiyet kurar ve Hindistan'ı savaşın geleceğine taşırız."
 RAJ_military_engineer_services:0 "Askeri İstihkam Hizmetleri"
 RAJ_military_engineer_services_desc:0 "Askeri İstihkam Hizmetleri, tahkimatlardan tedarik hatlarına kadar askeri altyapının belkemiğidir. Bu kritik dalı güçlendirerek kuvvetlerimize her çatışmada galip gelmeleri için gereken yolları, üsleri ve savunmaları sağlarız."
 RAJ_military_pensions:0 "Askeri Emeklilikler"
 RAJ_military_pensions_desc:0 "Askeri paketin bir parçası olarak askeri emeklilikler sağlamak, personeli daha uzun süre tutarak askeri kompleksi bir bütün olarak güçlendirecektir."
 RAJ_mineral_exploitation_institute:0 "Mineral Sömürü Enstitüsü"
 RAJ_mineral_exploitation_institute_desc:0 "Son madencilik gelişmeleri beklediğimiz verimi sağlamadı. Doğal kaynaklarımızdan potansiyel geliri daha doğru tahmin etmek için daha iyi jeolojik araştırmalara yatırım yapmamız gerekiyor."
 RAJ_mixed_economy:0 "Karma Ekonomi"
 RAJ_mixed_economy_desc:0 "Çok sayıda doğal kaynağımız var, mineral çıkarımına çeşitlenerek kendi kendine yeterliliğimizi güçlendireceğiz."
 RAJ_mixed_economy_tt:0 "İçinde 6'dan fazla kaynak bulunan her başlangıç eyaletinde, araştırılan her §YKazı Teknolojisi§! için §G+3§! kaynak kazan."
 RAJ_mobilization_of_the_indian_army:0 "Hint Ordusunun Seferberliği"
 RAJ_mobilization_of_the_indian_army_desc:0 "Sayımız çok ve ruhlarımız görkemli imparatorluğumuzun savunmasında cesaretleniyor. Kuvvetlerimizi altkıtanın her köşesinden çekmek zaman alabilir, ancak [RAJ.GetAdjective] ordusunun seferberliğine başlamak çok önemlidir. [RAJ.GetNameDef] ve [ENG.GetNameDef] için ayağa kalkıp savaşma zamanı geldi."
 RAJ_model_after_germany:0 "Almanya'yı Model Al"
 RAJ_model_after_germany_desc:0 "Almanya'nın disiplinli ve verimli askeri doktrinlerini örnek alarak kuvvetlerimizi modern bir savaş makinesine dönüştürebiliriz."
 RAJ_model_after_soviet:0 "Sovyetler Birliği'ni Model Al"
 RAJ_model_after_soviet_desc:0 "Sovyetler Birliği'nin kitlesel seferberlik ve devrimci taktikler vurgusu, kendi askeri evrimimiz için bir plan sunuyor."
 RAJ_model_after_usa:0 "ABD'yi Model Al"
 RAJ_model_after_usa_desc:0 "Amerikan askeri stratejilerini inceleyerek ordumuzu esneklik ve teknolojik yenilik odaklı olarak modernize edebiliriz."
 RAJ_modernizing_navy_dlc:0 "Donanmayı Modernize Etmek"
 RAJ_modernizing_navy_dlc_desc:0 "Asya denizlerinde etki projekte edebilmek için bir bölgesel güç olarak kendimizi kanıtlamak üzere donanmamızı modernize etmeliyiz. Gelişmiş gemi tasarımı, iyileştirilmiş altyapı ve stratejik doktrine yatırım yaparak bunu başaracağız."
 RAJ_modify_a_loyal_government_tt:0 "§Y$RAJ_a_loyal_government$§! şu şekilde değiştirilecek:"
 RAJ_modify_indian_railways_tt:0 "$idea_RAJ_indian_railways$ şu şekilde değiştirilir: "
 RAJ_modify_south_east_asia_command_dm_tt:0 "§Y$RAJ_south_east_asia_command_dm$§! şu şekilde değiştirilecek:"
 RAJ_mountain_guns:0 "Dağ Topları"
 RAJ_mountain_guns_desc:0 "Yüksek rakımlı savaş, uyum gerektirir. Engebeli arazi için tasarlanan dağ topları, en zorlu muharebelerde bile hakimiyet sağlamak için askerlere kritik ateş desteği sağlar."
 RAJ_mountain_tanks:0 "Dağ Tankları"
 RAJ_mountain_tanks_desc:0 "Geleneksel tanklar engebeli arazide zorlanır, ancak özelleştirilmiş dağ tankları yüksek rakımlı muharebede bize avantaj sağlar. Bu çevik makineler, stratejik noktaları ele geçirerek düşmanlarımızı alt edecek."
 RAJ_mughal_court:0 "Babür Sarayı"
 RAJ_mughal_court_desc:0 "Mughal Sarayı, diyarın en parlak zihinlerini ve en etkili liderlerini bir araya getirir. Bu danışmanları güçlendirerek, her kararın yönetimimizin ihtişamını ve hırsını yansıtmasını sağlarız."
 RAJ_mughal_court_princely_states_tt:0 "Tüm prensler, prens devletlerinden ayrılacak ve Mughal İmparatorluğu'na danışman veya general olarak katılacak."
 RAJ_mughal_court_tt:0 "Tüm Prens Devletleri şu Ulusal Ruhu alacak:"
 RAJ_mughal_shortcut:0 "Siyaset:\nBabürler"
 RAJ_national_planning_committee:0 "Ulusal Planlama Komitesi"
 RAJ_national_planning_committee_desc:0 "Ekonomik kendi kendine yeterlilik, gerçek bağımsızlığın temelidir. Ulusal Planlama Komitesi'ni kurarak sanayileşme, kırsal kalkınma ve adil büyüme için bir yol haritası çizebiliriz. Birleşik bir plan, Hindistan'ı modern, kendine yeten bir ulusa dönüştürecek."
 RAJ_nationalize_british_owned_factories:0 "İngilizlere Ait Fabrikaları Millileştir"
 RAJ_nationalize_british_owned_factories_desc:0 "[RAJ.GetAdjective] emeği üzerine inşa edilen fabrikalar artık yabancı çıkarlara hizmet etmeyecek. [ENG.GetAdjective] sahipliğindeki sanayiyi millileştirerek, kontrolü halka iade ediyor ve haksız yere alınanı geri alıyoruz."
 RAJ_nationalize_gun_carriage_agency:0 "Silah Taşıma Ajansı'nı Millileştir"
 RAJ_nationalize_gun_carriage_agency_desc:0 "Silah Taşıma Ajansı, silah kaynaklarımızdan biridir, bu tür bir güç özel bir şirketin elinde bırakılamaz, millileştirilmelidir."
 RAJ_nationalize_tata_group:0 "Tata Grubu'nu Millileştir"
 RAJ_nationalize_tata_group_desc:0 "Ekonomimiz için Tata Grubu'na bağımlı olmayı bırakmalıyız. Şirketi devralıp millileştirmenin zamanı geldi."
 RAJ_navy_shortcut:0 "Hint Donanması"
 RAJ_netaji:0 "Netaji"
 RAJ_netaji_desc:0 "Netaji Subhas Chandra Bose, emperyal yönetime karşı amansız direnişin ruhunu somutlaştırır. Vizyonu ve liderliği, milyonları egemen bir Hindistan için mücadeleye katılmaya teşvik eder. Onun rehberliğinde bağımsızlık hayali gerçeğe daha da yaklaşır."
 RAJ_new_economic_policy:0 "Yeni Ekonomi Politikası"
 RAJ_new_economic_policy_desc:0 "Düşük vergili ve iş dostu politikaları olan bir model benimseyerek sermaye yatırımını ve işletmelerin büyümesini teşvik edeceğiz."
 RAJ_night_shifts:0 "Gece Vardiyaları"
 RAJ_night_shifts_desc:0 "Gece vardiyalarını tanıtmak operasyonel kapasiteyi artıracak ve üretimi hızlandıracaktır. Ek maliyet, 24 saat verimlilik için ödenmesi gereken küçük bir bedeldir."
 RAJ_north_western_state_railway:0 "Kuzeybatı Eyalet Demiryolu"
 RAJ_north_western_state_railway_desc:0 "Kuzeybatı Eyalet Demiryolu, Hindistan'ın kalbini stratejik sınırlarına bağlamak için hayati öneme sahiptir. Bu ağı genişletip modernize ederek bölgesel ticareti güçlendirir, hareketliliği artırır ve kritik sınırlardaki varlığımızı pekiştiririz."
 RAJ_nothing_personal:0 "Kişisel Değil"
 RAJ_nothing_personal_desc:0 "Taç, arkaik önlemler dayatarak büyümemizi uzun süredir engelliyor. Kişisel değil, ancak hükümet yetersiz büyümenin nedeni olamaz."
 RAJ_nothing_personal_tt:0 "§Y[ENG.GetNameDef]§! ve §YCommonwealth ülkeleri§! için bir savaş nedeni oluşturur!"
 RAJ_obtain_british_naval_contracts:0 "İngiliz Donanma Sözleşmeleri Elde Et"
 RAJ_obtain_british_naval_contracts_desc:0 "Kendi filosumuzu güçlendirmek ve stratejik bağları güçlendirmek için [ENG.GetNameDefCap]'a donanma inşa sözleşmeleri için başvuracağız."
 RAJ_obtain_modern_ship_contracts:0 "Modern Gemi Sözleşmeleri Elde Et"
 RAJ_obtain_modern_ship_contracts_desc:0 "Donanma modernizasyonumuzu hızlandırmak için [ENG.GetNameDefCap] ile en modern kruvazörlerin alımı için müzakerelere gireceğiz, böylece filomuzun gelişen deniz ortamında rekabetçi kalmasını sağlayacağız."
 RAJ_open_up_new_markets:0 "Yeni Pazarlar Aç"
 RAJ_open_up_new_markets_desc:0 "Piyasamızı genişletmek için radikal önlemler almazsak önümüzdeki yıllarda mevcut pazarımızı doyurma riskiyle karşı karşıyayız. Bu nedenle, komşu topraklarda bazı düşmanca devralmalara girişeceğiz."
 RAJ_orchestrate_train_robberies:0 "Halkın Demiryolu"
 RAJ_orchestrate_train_robberies_desc:0 "Demiryolu inşaatı, işçi liderliğindeki yönetim ve daha fazla denetim nedeniyle yavaşladı, ancak inşa edilen her hat planlı ekonomiye daha iyi entegre edildi ve daha yüksek lojistik çıktı ve verimlilik sağladı."
 RAJ_orchestrate_train_robberies_tt:0 "Demiryolu odakları artık §YHint Demiryolu§! Ruhunu şu şekilde değiştirecek:\nFabrika Çıktısı: §G+[?RAJ_railway_default_increase_tt]%§!\nDemiryolu İnşa Hızı: §R[?RAJ_railway_default_decrease_tt]%§!\nTedarik Merkezi İnşa Hızı: §R[?RAJ_railway_default_decrease_tt]%§!\nAltyapı İnşa Hızı: §R[?RAJ_railway_default_decrease_tt]%§!\nher tamamlanan demiryolu odağı için\n\nBu durumu yansıtmak için mevcut tamamlanmış tüm demiryolu odakları otomatik olarak değiştirilecek."
 RAJ_ordnance_factory_kanpur_uttar_pradesh:0 "Kanpur Mühimmat Fabrikası"
 RAJ_ordnance_factory_kanpur_uttar_pradesh_desc:0 "Kanpur'daki Mühimmat Fabrikası, Hindistan'ın savunma üretiminin temel taşıdır. Kapasitesini genişleterek ve tesislerini modernize ederek silah ve teçhizatın sürekli arzını sağlar, kuvvetlerimizin ulusu savunmasını ve güvence altına almasını sağlarız."
 RAJ_ordnance_factory_khamaria_jabalpur:0 "Khamaria Jabalpur Mühimmat Fabrikası"
 RAJ_ordnance_factory_khamaria_jabalpur_desc:0 "Jabalpur'da bulunan Khamaria Mühimmat Fabrikası, mühimmat ve silah üretiminde kilit bir üreticidir. Kapasitesini genişleterek askeriyemizin ateş gücünü artırır, kuvvetlerimizin her türlü zorluğa hazır olmasını sağlarız."
 RAJ_ordnance_factory_medak:0 "Medak Mühimmat Fabrikası"
 RAJ_ordnance_factory_medak_desc:0 "Zırhlı araç üretiminde uzmanlaşan Medak Mühimmat Fabrikası, ordumuzun modernizasyonu için kritik öneme sahiptir. Operasyonlarını genişleterek kuvvetlerimizin savaş alanında hakimiyet kurması için gereken son teknoloji makinelerle donatılmasını sağlarız."
 RAJ_overlords_railway_investment:0 "[ROOT.OVERLORD.GetAdjective] Demiryolu Yatırımı"
 RAJ_overlords_railway_investment_desc:0 "Modern bir demiryolu sistemi için temel atıldığına göre, ağı daha da genişletmek ve iyileştirmek için [ROOT.OVERLORD.GetAdjective] sanayi ve finans çevrelerinden yatırım davet edeceğiz. Sermayeleri, büyüyen altyapımızla birleşerek İmparatorluğa yakışır bir demiryolu sistemi yaratacak."
 RAJ_partition_preparation:0 "Bölünme Hazırlığı"
 RAJ_partition_preparation_desc:0 "Bölünmeye hazırlanmalıyız, yoksa milyonların hareketiyle ortaya çıkacak kaosa maruz kalırız."
 RAJ_partition_preparation_tt:0 "§YBölünme gerçekleştiğinde etkisini azaltacak§! Hazırlık ile şunları alacağız: \n"
 RAJ_partition_preparation_tt_2:0 "Ve hazırlıksız şunları alacağız: \n"
 RAJ_peacock_throne_for_the_modern_age:0 "Modern Çağ için Tavuskuşu Tahtı"
 RAJ_peacock_throne_for_the_modern_age_desc:0 "Tavuskuşu Tahtı, atalarımızın gücünün ve ihtişamının nihai sembolüydü. Tarihi güç merkezimizde yeni bir taht inşa ederek, hakimiyetimizi ortaya koyar, sadakati aşılar ve altkıtanın verimli deltaları için vizyonumuzu netleştiririz."
 RAJ_phantom_armies:0 "Hayalet Ordular"
 RAJ_phantom_armies_desc:0 "Bilançoda istihdam ettiğimiz askeri personel miktarını şişirerek vergi dairesini kandırabiliriz."
 RAJ_planned_but_decentralized:0 "Planlı ama Desantralize"
 RAJ_planned_but_decentralized_desc:0 "Ekonomik planlamayı koruyacağız, ancak yerel kolektiflere özerklik tanıyacağız.\nBürokrasiyle değil, ideolojiyle verimlilik."
 RAJ_planned_economy:0 "Planlı Ekonomi"
 RAJ_planned_economy2:0 "Planlı Ekonomiyi Konsolide Et"
 RAJ_planned_economy2_desc:0 "Pazarın devrimde yeri yoktur.\nHer kaynak, her işçi ve her fabrika beş yıllık plana hizmet etmelidir."
 RAJ_planned_economy_desc:0 "Güçlü bir ulus, amaç ve vizyonla yönlendirilen güçlü bir ekonomi gerektirir. Planlı bir ekonomi benimseyerek kaynakları verimli şekilde tahsis edebilir, sanayileşmeye öncelik verebilir ve tüm vatandaşlar için adil kalkınma sağlayabiliriz."
 RAJ_pledge_for_the_allies:0 "Müttefikler İçin Taahhüt"
 RAJ_pledge_for_the_allies_desc:0 "Faşizm ve komünizm dünyada yükselirken Hindistan yalnız kalamaz. [ENG.GetName] belki Hindistan'ın dostu değildi, ancak diğerlerinin düşmanımız olduğu açık."
 RAJ_power_sharing_agreement:0 "Güç Paylaşım Anlaşması"
 RAJ_power_sharing_agreement_desc:0 "Müslüman Birliği bize şüpheyle bakıyor, Hindu egemenliğindeki bir Hindistan'da Müslümanlara ne olacağından korkuyor. Onlarla gücü eşit şekilde paylaşmak için bir anlaşmaya gireceğiz."
 RAJ_preamble_to_the_constitution_of_india:0 "[GetRajName] Anayasası'nın Önsözü"
 RAJ_preamble_to_the_constitution_of_india_desc:0 "Biz, [GetRajName] halkı, [GetRajName]'ı egemen sosyalist laik demokratik bir cumhuriyet olarak kurmaya ve tüm vatandaşlarına: adalet, özgürlük, eşitlik sağlamaya ve aralarında kardeşliği teşvik etmeye kararlıyız."
 RAJ_preemptive_invasion_of_iran:0 "İran'a Önleyici İstila"
 RAJ_preemptive_invasion_of_iran_desc:0 "[PER.GetNameDef] batıda bize komşudur ve hızlı bir şekilde ele alınmazsa, düşmanlarımıza Pers Koridoru üzerinden [RAJ.GetNameDef]'a doğrudan bir yol sağlayabilirler. Böyle bir istila kesinlikle barış isteyenlerin öfkesini çekebilir, ancak başarılı olursak, [PER.GetNameDef]'ın zengin petrol sahaları bizim olacaktır."
 RAJ_princely_autonomy:0 "Prenslik Özerkliği"
 RAJ_princely_autonomy_desc:0 "Alt kıta yavaş yavaş istikrarsızlaşıyor. Yerel Prensleri kontrol kurmak için kullanacağız. Yerel gücün bir görüntüsünü alırlar ve biz de ödüllerini toplarız; bize ödeme yaptıkları sürece."
 RAJ_princely_autonomy_tt:0 "Bir Prenslik Devletini kukla olarak serbest bırakırken ekler: "
 RAJ_princely_state_donations_GOE:0 "Prens Devleti Bağışları"
 RAJ_princely_state_donations_GOE_desc:0 "$RAJ_princely_state_donations_desc$"
 RAJ_princely_states_policy:0 "Prenslik Devletleri Politikası"
 RAJ_princely_states_policy_desc:0 "Prenslik Devletleri her şekil ve boyutta gelir, etkili Haydarabad'dan Kuzey Sınırlarındaki küçük prensliklere kadar. Onlarla nasıl başa çıkacağımıza dair bir politika belirlemeliyiz."
 RAJ_princley_state_breakaway_tt:0 "§Y [442.GetName] \n [987.GetName] \n [988.GetName] \n [444.GetName] \n [445.GetName] \n [1012.GetName] \n§!"
 RAJ_prioritize_army_cargo:0 "Ordu Yüküne Öncelik Ver"
 RAJ_prioritize_army_cargo_desc:0 "Demiryolu ağı, askeri lojistiğin belkemiğidir. Ordu yüküne öncelik vererek askerlerimize silahların, kaynakların ve takviyelerin zamanında ulaşmasını sağlar, zaferi hızlı ve kesin bir şekilde elde ederiz."
 RAJ_prioritize_civilian_cargo:0 "Sivil Yüküne Öncelik Ver"
 RAJ_prioritize_civilian_cargo_desc:0 "Güçlü bir iç cephe, zafer için esastır. Sivil yüküne öncelik vererek halkımızı ve endüstrimizi desteklemek için gıda, mal ve malzemelerin zamanında teslimini sağlar, ulusu kriz zamanlarında dirençli tutarız."
 RAJ_privatized_healthcare:0 "Özelleştirilmiş Sağlık Hizmeti"
 RAJ_privatized_healthcare_desc:0 "Komünist sağlık hizmeti planlarına yönelik çağrılar topraklarımızda durdurulmalıdır. Sağlık hizmeti, piyasanın görünmez eli tarafından bunu hak edenlere sağlanacaktır."
 RAJ_privatized_tutelage:0 "Özelleştirilmiş Vesayet"
 RAJ_privatized_tutelage_desc:0 "Eğitim, sadece layık olanlara, tamamen özelleştirilmiş bir okul ve kolej sistemiyle, ayak takımından arındırılarak sağlanacak."
 RAJ_procure_the_armor:0 "Varuna'nın Zırhı"
 RAJ_procure_the_armor_desc:0 "Varuna'nın ağır zırha ihtiyacı var, çok ağır zırha. Maliyeti düşük tutmak için daha az pahalı bir projede prototipini yapmak bir zorunluluktur."
 RAJ_procure_the_guns:0 "Varuna'nın Silahı"
 RAJ_procure_the_guns_desc:0 "Yollarımızı korumak için yeterince büyük bir caydırıcıya ihtiyacımız var ve yeterince büyük bir caydırıcı çok büyük bir silah gerektirir, çok büyük bir silah."
 RAJ_procure_the_task_force:0 "Varuna'nın Görev Gücü"
 RAJ_procure_the_task_force_desc:0 "En büyük gemilerin bile düşman gemilerinden yeterince korunması için eskortlara ihtiyacı vardır. Sağlam bir deniz görev gücü oluşturarak ana gemilerimizin birincil görevlerini yerine getirmesini sağlayabiliriz."
 RAJ_productivity_mandate:0 "Verimlilik Zorunluluğu"
 RAJ_productivity_mandate_desc:0 "Yatırımcılara verdiğimiz taahhütlerle bağlı olarak tüm sektörlerde çıktıyı maksimize etmek zorundayız. Verimlilik artık bir hedef değil; bir zorunluluktur ve her ne pahasına olursa olsun sağlanmalıdır."
 RAJ_promote_violence_against_the_british:0 "İngilizlere Karşı Şiddeti Teşvik Et"
 RAJ_promote_violence_against_the_british_desc:0 "Barışçıl protesto zamanı geçti. Emperyal baskının zincirlerini kırmak için doğrudan eylemi benimsemeliyiz. Koordineli direniş, İngiliz kontrolünü zayıflatacak ve kitleleri zulme karşı ayaklanmaya teşvik edecek."
 RAJ_protest_against_the_howell_monument:0 "Holwell Anıtına Karşı Protesto Düzenle"
 RAJ_protest_against_the_howell_monument_desc:0 "Holwell Anıtı, sömürge hakimiyetinin ve adaletsizliğin yüceltilmesi anlamına geliyor. Bu sembole karşı protestolar düzenleyerek ulusu emperyal propagandayı reddetmeye ve özgürlük mücadelemizi aşağılayan kalıntıların kaldırılmasını talep etmeye çağırıyoruz."
 RAJ_provincial_autonomy:0 "Bağımsızlık Yolunda"
 RAJ_provincial_autonomy_desc:0 "İngilizlerden ek eyalet özerkliği almak, nihai hedef olan bağımsızlığa doğru atılacak ilk kritik adım olacaktır."
 RAJ_provincial_autonomy_occupation_law_tt:0 "Prenslik Devletleri için §Y$independent_rule$§! ve §Y$princely_subjugation$§! işgal yasalarının kilidi açılır"
 RAJ_provincial_autonomy_tt:0 "\n§Yİki Ulus Teorisi§! yoluyla tamamen özgürleşmek için ya §YBirleşik Bengal§! ya da §YDoğu Pakistan§! odaklarını tamamlamamız gerekiyor.\n\n§YBirleşik Hindistan§! yoluyla tamamen özgürleşmek için §YLaik Bir Devlet§! odağını tamamlamamız gerekiyor.\n\n§Y§!§YGandhiciliğe Karşı Birlik§! yoluyla tamamen özgürleşmek için ise ya §YGölgedeki Kızıllar§! ya da §YBana Kan Verin, Ben de Size Özgürlük Vereyim§! odaklarından birini tamamlamamız gerekiyor."
 RAJ_punjab_autonomy:0 "Pencap Özerkliği"
 RAJ_punjab_autonomy_desc:0 "Pencap, Sihler için derin bir öneme sahiptir ve onlara yerel özerklik vererek güvenlerini kazanabiliriz."
 RAJ_purchase_british_supply_equipment:0 "İngiliz Tedarik Ekipmanı Satın Al"
 RAJ_purchase_british_supply_equipment_desc:0 "Kuvvetlerimizi güçlendirmek ve savaş alanı lojistiğini iyileştirmek için gelişmiş İngiliz tedarik ekipmanı edinmeliyiz."
 RAJ_purchase_cruisers_and_dreadnoughts:0 "Kruvazör ve Dretnot Satın Al"
 RAJ_purchase_cruisers_and_dreadnoughts_desc:0 "$SMB_purchase_cruisers_and_dreadnoughts_desc$"
 RAJ_purchase_decomissioned_british_ships:0 "Hizmet Dışı İngiliz Gemileri Satın Al"
 RAJ_purchase_decomissioned_british_ships_desc:0 "Filosumuzu hızla genişletmek için [ENG.GetNameDefCap]'a hizmet dışı kalmış donanma gemilerini satın almak için başvuracağız. Eskimiş olsalar da, bu gemiler minimal maliyetle yenilenerek filomuza katılabilir."
 RAJ_purchase_destroyers_and_subs:0 "Muhrip ve Denizaltı Satın Al"
 RAJ_purchase_destroyers_and_subs_desc:0 "$SMB_purchase_destroyers_and_subs_desc$"
 RAJ_purge_the_reactionaries:0 "Gericileri Tasfiye Et"
 RAJ_purge_the_reactionaries_desc:0 "Eski dünyayla hiçbir uzlaşma olamaz.\nDevrimin düşmanları, sabotajcılar ve karşı-devrimci unsurlar kökünden sökülecek."
 RAJ_purna_swaraj:0 "Kendi Kendini Yönetme - Purna Swaraj"
 RAJ_purna_swaraj_desc:0 "[ENG.GetAdjective] hükümeti Hindistan'da [RAJ.GetAdjective] halkını özgürlüklerinden mahrum etmekle kalmadı, aynı zamanda kitlelerin sömürüsüne dayandı ve Hindistan'ı ekonomik, siyasi, kültürel ve manevi olarak mahvetti. Bu nedenle Hindistan [ENG.GetAdjective] bağını koparmalı ve Purna Swaraj yani tam bağımsızlık elde etmelidir."
 RAJ_quality_training:0 "Kaliteli Eğitim"
 RAJ_quality_training_desc:0 "Miktar tek başına savaşları kazandırmaz.\nEğitim programlarımızı standartlaştıracağız, subay eğitimini iyileştireceğiz ve silahlı kuvvetlerimizin profesyonelliğini artıracağız."
 RAJ_quinine:0 "Kinin"
 RAJ_quinine_desc:0 "Birliklerimize Kinin ve benzeri ilaçlar sağlamak, askerlerimizin tropik ortamlarda sıtmadan muzdarip olmadan savaşmasını sağlayacaktır."
 RAJ_quinine_tt:0 "§YEkstra Tedarikler§! yeteneğinin geliştirilmiş bir versiyonunun kilidi açılır.\n\nKomuta Gücü Maliyeti: §Y0.15§! (her tabur için)\nSüre: §Y10 gün§!\nBekleme Süresi: §Y21 gün§!\n\n§YEtkinleştirildiğinde:§!\nTümen Zayiatı: §G12.0%§!\nSıcak Zayiatı: §G35.00%§!\nTedarik Ertelemesi: §G+240.0 Saat§!\nHastalık Kapma Şansı: §G-100.00%§!\nOrdulara §Y240§! Saat yetecek tedarik sağlar"
 RAJ_railways_shortcut:0 "Demiryolları"
 RAJ_raise_import_duties:0 "İthalat Vergilerini Artır"
 RAJ_raise_import_duties_desc:0 "Ekonomik bağımlılığı azaltmak ve yerel büyümeyi teşvik etmek için yabancı mallara daha yüksek ithalat vergileri uygulayacağız. Bu politika yerel sanayileri koruyacak, sermayeyi sınırlarımız içinde tutacak ve [ROOT.GetNameDef]'ın kendi ayakları üzerinde durmasını sağlayacaktır."
 RAJ_rally_the_indian_left:0 "Hindistan Solunu Birleştir"
 RAJ_rally_the_indian_left_desc:0 "Bölünmüş sol, işçi hakları ve gerçek bağımsızlık mücadelesine öncülük etmek için bir araya gelmelidir. Sosyalist ve komünist güçleri tek bir bayrak altında toplayarak emperyalizme ve kapitalizme meydan okuyacak güçlü bir cephe oluşturabiliriz."
 RAJ_rani_of_jhansi_regiment:0 "Jhansi Alayı"
 RAJ_rani_of_jhansi_regiment_desc:0 "Jhansi Rani'nin cesaretinden ilham alarak, baskıya karşı durmak için tamamı kadınlardan oluşan bir alay kuracağız. Bu cesur savaşçıları güçlendirerek sömürge yönetimine ağır bir darbe vuracak ve kadınların bağımsızlık mücadelesindeki rolünü yeniden tanımlayacağız."
 RAJ_rashtriya_swayamsevak_sangh:0 "Rashtriya Swayamsevak Sangh"
 RAJ_rashtriya_swayamsevak_sangh_desc:0 "Gençliği, ulusumuzu savunmaya ve Hindutva değerlerini her ne pahasına olursa olsun korumaya hazır disiplinli bir güç halinde örgütleyeceğiz."
 RAJ_re_establish_the_khyber_rifles:0 "Hayber Tüfeklerini Yeniden Kur"
 RAJ_re_establish_the_khyber_rifles_desc:0 "Sarp arazimizi savunmak için Hayber Tüfekleri milislerini yeniden kuracağız ve belki onlardan bir şeyler de öğrenebiliriz."
 RAJ_rebuilding_the_empires_roads:0 "İmparatorluğun Yollarını Yeniden İnşa Etmek"
 RAJ_rebuilding_the_empires_roads_desc:0 "Bir imparatorluk, ordularını, mallarını ve insanlarını taşıyacak araçlara sahip olmadan işlev gösteremez. İngilizlerin geride bıraktığı çürümüş yollar ve demiryolları genişletilmeli ve modernize edilmelidir."
 RAJ_recruitment_shortcut:0 "Askere Alma"
 RAJ_red_in_the_shadows:0 "Gölgelerdeki Kızıllar"
 RAJ_red_in_the_shadows_desc:0 "İmparatorluğun çöküşünün kaosu arasında, devrimci güçler güç topluyor ve eski düzeni baltalamak için gizlice çalışıyor. Kızıl bayrağın yükselişi, Hindistan ve dünyanın geleceğini yeniden şekillendirebilecek bir hesaplaşmanın habercisidir."
 RAJ_red_in_the_shadows_tt:0 "İngiliz hükümetine sızmak ve bağımsızlık hareketini komünizm yanlısı bir çizgiye çekmek için kararların kilidi açılacak, §Y$RAJ_royal_indian_navy$§! tamamlama gereksinimleri azaltılacak."
 RAJ_red_punjab_operation:0 "Kızıl Pencap Operasyonu"
 RAJ_red_punjab_operation_desc:0 "Başkentimiz yabancı saldırganlığa karşı savunmasız. Güvenlik bölgesini artırmalıyız"
 RAJ_reform_the_agricultural_sector:0 "Tarım Sektörünü Reform Et"
 RAJ_reform_the_agricultural_sector_desc:0 "On yıllardır süren verimsiz arazi kullanımı ve modası geçmiş uygulamalar, [ROOT.GetNameDef]'ın tarım sektörünü kesintilere karşı savunmasız bıraktı. Hedefli reformlar, altyapı yatırımları ve modern tekniklerle verimi artırabilir ve daha dirençli bir gıda arzı oluşturabiliriz."
 RAJ_reform_the_agricultural_system:0 "Tarım Sistemini Reform Et"
 RAJ_reform_the_agricultural_system_desc:0 "Çok uzun zamandır, Hindistan'ın gıda sistemi ihmal, yönetim bozukluğu ve sömürüyle boğuşuyor. Mughal İmparatorluğu restore edildiğinde, hiçbir tebanın aç kalmamasını sağlamalıyız. Sulamaya yatırım yaparak, tarımı modernize ederek ve yırtıcı toprak sahiplerinin etkisini kırarak, Hindistan'ı kıtlığın geçmişte kaldığı bir bolluk diyarına dönüştüreceğiz."
 RAJ_regimental_loyalty:0 "Alay Sadakati"
 RAJ_regimental_loyalty_desc:0 "Alay sadakati bağları, birliklerimiz arasında birlik ve disiplin yaratır. Bu geleneklere duyulan gururu besleyerek, onur, güven ve zafere sarsılmaz bağlılıkla kenetlenmiş bir kuvvet oluştururuz."
 RAJ_relax_agrarian_society_criteria:0 "Toplumu Sanayileştir"
 RAJ_relax_agrarian_society_criteria_desc:0 "Modern bir sanayi gücüne geçiş yapmak için ekonomimizi geleneksel tarımdan uzaklaştırmalıyız. Kırsal nüfusu endüstriyel işgücüne katılmaya teşvik ederek sürdürülebilir büyüme ve teknolojik ilerlemenin temellerini atarız."
 RAJ_relax_agrarian_society_criteria_tt:0 "§Y$idea_RAJ_agrarian_society$§! fikrini değiştirecek\n§YEtkili Değişiklik:§!"
 RAJ_release_subjects_hint_tt:0 "§YBizim tarafımızdan serbest bırakılan uydu devletler, diğer odaklar yerine sanayi odaklarını önceliklendirme eğiliminde olacaklardır.§!"
 RAJ_renegotiate_adens_control:0 "Aden'in Kontrolünü Yeniden Müzakere Et"
 RAJ_renegotiate_adens_control_desc:0 "Aden'i [ENG.GetName]'a devretme planı varken, Kızıldeniz'de bir ticaret limanına sahip olmanın önemli faydaları var. Bu politikayı yeniden müzakere etmeli ve kontrolümüz altında tutmalıyız."
 RAJ_renegotiate_adens_control_tt:0 "[992.GetName] üzerindeki kontrolümüzü [ENG.GetName]'a devretmek yerine koruyacağız"
 RAJ_reorganize_the_five_year_plan_towards_heavy_industry:0 "Beş Yıllık Planı Yeniden Düzenle"
 RAJ_reorganize_the_five_year_plan_towards_heavy_industry_desc:0 "Mevcut sanayileşme hızı yetersiz.\nDevrimimizi savunacaksak, ağır sanayi ve çelik üretimine öncelik vermeliyiz."
 RAJ_request_transfer_of_british_commanders:0 "İngiliz Komutanların Transferini Talep Et"
 RAJ_request_transfer_of_british_commanders_desc:0 "Yeni deniz piyadelerimizin eğitimine yardımcı olması için [ENG.GetNameDefCap]'dan bir Donanma Komutanının transferini talep edeceğiz."
 RAJ_restore_the_timurid_empire:0 "Timur İmparatorluğu'nu Restore Et"
 RAJ_restore_the_timurid_empire_desc:0 "Timur'un sancakları bir kez daha dalgalanıyor ve bir zamanlar sultanların ve kralların kalplerine korku salan imparatorluk, tarihin küllerinden yükseldi. Yönetimimiz, fetihleriyle şekillenen toprakları birleştirerek Doğu ve Batı'yı tek bir egemenlik altında birleştiriyor. Dünya dikkat kesilsin—Timurlular geri döndü ve bu sefer geçmişe karışmayacağız."
 RAJ_restrictive_administration_budget:0 "Kısıtlayıcı Yönetim Bütçesi"
 RAJ_restrictive_administration_budget_desc:0 "Mali disiplini korumak için tüm temel olmayan harcamalar ortadan kaldırılmalıdır. Verimlilik, kaynakları ölçülebilir getiri sağlayan yerlere odaklamamızı gerektirir."
 RAJ_revisiting_inquities:0 "Göze Göz"
 RAJ_revisiting_inquities_desc:0 "İmparatorluğumuzun tarihi düşüşü, yabancı ticaret şirketlerinin müdahalesiyle hızlandırıldı. Aramızda, yeni gücümüzle eski düşmanlarımızı bir zamanlar bize reva gördükleri aynı haksızlıklara maruz bırakmanın hakkımız olduğuna inananlar var."
 RAJ_reviving_the_workshop_of_the_world:0 "Dünyanın Atölyesini Canlandırmak"
 RAJ_reviving_the_workshop_of_the_world_desc:0 "İngiliz yönetiminden önce Hindistan, sanayi, tekstil ve ticaretin küresel bir merkeziydi. Şimdi imparatorluk yeniden doğduğuna göre, bu mirası geri alma zamanı geldi. Fabrikalarımızı modernize ederek ve ticaret yollarımızı canlandırarak, ekonomimizi dünyanın büyük uluslarıyla rekabet edebilecek bir güç merkezine dönüştüreceğiz."
 RAJ_revolt_of_the_princes:0 "Prenslerin İsyanı"
 RAJ_revolt_of_the_princes_desc:0 "Prens devletleri, uzun süredir İngiliz yönetimi altında ezildi ve şimdi miraslarını geri almak için isyan edecekler."
 RAJ_revolt_of_the_princes_tt:0 "Britanya Rajı'na savaş ilan ettiğimizde, prens devletleri ayaklanacak ve bir uydu devlet olarak bize katılacak."
 RAJ_rifle_factory_ishapore_west_bengal:0 "Ishapore Tüfek Fabrikası"
 RAJ_rifle_factory_ishapore_west_bengal_desc:0 "Ishapore Tüfek Fabrikası, Khadki fabrikasıyla birlikte çalışarak orduya küçük silahlar sağlayacaktır."
 RAJ_road_to_independence_shortcut:0 "Bağımsızlığa Giden Yol"
 RAJ_rolling_nuke_barrages:0 "Yuvarlanan Nükleer Barajlar"
 RAJ_rolling_nuke_barrages_desc:0 "Yuvarlanan barajlar Büyük Savaş sırasında yaygındı. Yeni teknolojiler daha da yıkıcı barajlar sağlıyor."
 RAJ_royal_indian_air_force_dlc:0 "Kraliyet [ROOT.GetAdjective] Hava Kuvvetleri"
 RAJ_royal_indian_air_force_dlc_desc:0 "Kraliyet Hint Hava Kuvvetleri, Hindistan'ın hava gücünün zirvesini temsil eder. Modern uçaklar ve eğitimle yeteneklerini genişleterek gökyüzünde hakimiyet sağlar, ulusumuzu savunmaya ve bölgede güç projeksiyonu yapmaya hazır oluruz."
 RAJ_royal_indian_artillery_:0 "Kraliyet Hindistan Topçusu"
 RAJ_royal_indian_artillery__desc:0 "Bu güçlü kuvveti güçlendirerek düşman hatlarını parçalayacak ve savaş alanında zafer kazanacak yıkıcı ateş gücüne sahip olacağız."
 RAJ_royal_indian_artillery_dlc:0 "$RAJ_royal_indian_artillery$"
 RAJ_royal_indian_artillery_dlc_desc:0 "$RAJ_royal_indian_artillery_desc$"
 RAJ_royal_indian_navy_dlc:0 "$RAJ_royal_indian_navy$"
 RAJ_royal_indian_navy_dlc_desc:0 "$RAJ_royal_indian_navy_desc$"
 RAJ_royal_indian_navy_mutiny:0 "Kraliyet Hint Donanması İsyanı"
 RAJ_royal_indian_navy_mutiny_desc:0 "Hint denizciler arasında hoşnutsuzluk büyüyor ve davamıza destek gösteriyorlar. Bunu güç elde etmek ve İngiliz takviyelerini durdurmak için kullanabiliriz. Teslim olmaktan başka seçenekleri kalmayacak."
 RAJ_royal_indian_navy_mutiny_tt:0 "§RKomünist Sızma Kararları bu odağı tamamladığımızda kaldırılacak§!"
 RAJ_royal_indian_navy_mutiny_tt2:0 "§RYükümlülüklerimizi yerine getirdiğimizde Komünist Sızma Kararları kaldırılacak§!"
 RAJ_rural_development_plan:0 "Kırsal Kalkınma Planı"
 RAJ_rural_development_plan_desc:0 "Tarım reformları devam ederken, şimdi sanayiyi kırsala getirmeliyiz. Makinelleşme, kırsal altyapı projeleri ve küçük ölçekli imalat, köyleri üretimin merkezlerine dönüştürecek."
 RAJ_rural_mechanization_program:0 "Kırsal Mekanizasyon Programı"
 RAJ_rural_mechanization_program_desc:0 "Tarımsal üretimi artırmak ve modası geçmiş emek yöntemlerine bağımlılığı azaltmak için kırsal bölgelerde mekanize tarımı yapılandırılmış bir programla uygulayacağız. Traktörler, harman makineleri ve sulama sistemleri kırsal verimliliği dönüştürecek ve modern, kendi kendine yeten bir ekonomi için temel oluşturacak."
 RAJ_sanatani:0 "Sanatani"
 RAJ_sanatani_desc:0 "Sanatan Dharma ilkeleri, Hindistan'ın birliği ve yeniden doğuşu için zamansız bir temel sunar. Bu değerleri benimseyerek, geleneğin rehberliğinde uyumlu ve dirençli bir ulus ilham edebiliriz."
 RAJ_secret_weapons:0 "Bilimsel Yeteneğimizi Geri Kazan"
 RAJ_secret_weapons_desc:0 "Düşmanlarımızı yok etmek için kullanmak üzere roket geliştirmede bir kez daha dünya lideri olacağız."
 RAJ_secular_rule:0 "Seküler Yönetim"
 RAJ_secular_rule_alt:0 "Timur Mirası"
 RAJ_secular_rule_alt_desc:0 "Atalarımızın topraklarını geri almak ve hanedanımızı doğuran dağların kalbinde yeni bir çağ başlatmak zamanı geldi. İmparatorluğumuzu Afganistan'ın sarp kalbine yerleştirerek egemenliğimizi güvence altına alıyoruz."
 RAJ_secular_rule_desc:0 "Mughal İmparatorluğu çeşitlilikle gelişir ve seküler bir yönetim, tüm tebalara inançları ne olursa olsun adil bir yönetim sağlar. Liyakati ve eşitliği önceliklendirerek, imparatorluğun birliğini güçlendirir ve geniş ve çeşitli topraklarında sadakati garanti altına alırız."
 RAJ_secure_rajahsthan:0 "Racastan'ı Güvence Altına Al"
 RAJ_secure_rajahsthan_desc:0 "Racastan çölleri bir karşı-devrim üssü haline gelmemeli.\nDevleti birliğimize katacağız."
 RAJ_secure_states:0 "Güvence Altına Al"
 RAJ_secure_weapons:0 "Silahları Güvence Altına Al"
 RAJ_secure_weapons_desc:0 "Askeri teçhizatımız, birçok ülkeden gelen uyumsuz varyantlardan oluşan bir karmaşa. Ancak, yabancı ülkelerden biraz yardım alarak özgürlüğümüzü kazanmak için hazırlık yapabiliriz."
 RAJ_secure_weapons_tt:0 "Silahlar, §Y$RAJ_the_mughal_uprising$§! tamamlandığında stoklara eklenecek."
 RAJ_seek_domestic_allies:0 "Yerel Müttefikler Ara"
 RAJ_seek_domestic_allies_desc:0 "İleri Blok, vizyonunu tek başına gerçekleştiremez. Siyasi yelpazeden müttefikler bularak devrimci düşünürleri bir araya getirebilir, daha geniş destek sağlayabilir ve Hindistan'ı gerçek bağımsızlığa taşıyacak liderliği oluşturabiliriz."
 RAJ_seek_financial_aid_from_the_ussr:0 "[SOU.GetNameDef]'den Mali Yardım İste"
 RAJ_seek_financial_aid_from_the_ussr_desc:0 "Devrimci hedeflerimizi ilerletmek ve ulusal kalkınmayı hızlandırmak için [SOU.GetNameDefCap]'a mali yardım için başvuracağız. Onların desteği, dayanışma ve güce dayalı yeni bir düzen inşa etmemize yardımcı olabilir."
 RAJ_seek_international_recognition:0 "Uluslararası Tanınma Ara"
 RAJ_seek_international_recognition_desc:0 "Mücadelemizi meşrulaştırmak için davamıza uluslararası destek sağlamalıyız. Küresel destek toplayarak [ENG.GetAdjective]'ı izole edebilir ve egemenlik iddiamızı dünya nezdinde güçlendirebiliriz."
 RAJ_seek_intial_funding:0 "Başlangıç Fonu Ara"
 RAJ_seek_intial_funding_desc:0 "Büyük emellerimizin temelini atmak için [ENG.GetAdjective] yatırımcılardan sermaye sağlamalıyız. Başlangıç fonları, ekonomik motorumuzu ateşleyecek kıvılcım olacak."
 RAJ_seek_intial_funding_tt:0 "§G3§! Bina Yuvası Ekle\n§Y$RAJ_incorporation_of_the_east_india_company$§! tamamlandığında başkentimize §G3§! §YSivil Fabrika§! ekle"
 RAJ_seek_intial_funding_unlock_tt:0 "§Y$RAJ_seek_intial_funding$§! odağını açar\n\n"
 RAJ_seek_japanese_support:0 "Japon Desteği Ara"
 RAJ_seek_japanese_support_desc:0 "Düşmanımızın düşmanı en güçlü müttefikimiz olabilir. Japon desteği ararsak, İngiliz yönetimine meydan okumak için kaynaklara, eğitime ve iş gücüne erişebiliriz. Yol risklerle dolu olsa da, böyle bir ittifak mücadelede dengeleri lehimize çevirebilir."
 RAJ_seek_japanese_support_tt:0 "Bağımsızlık savaşı başladığında [JAP.GetNameDef] bize şunları sağlayacak:\n§Y120§! B4Y Deniz Bombardıman Uçağı\n§Y135§! [JAP.GetAdjective]Ki-10 Savaşlar Arası Avcı Uçağı\nİlgili tasarımlar ve\n"
 RAJ_seven_shackles:0 "Yedi Zincir"
 RAJ_seven_shackles_2:0 "Yedi Zincirin Dördüncü ile Altıncısı"
 RAJ_seven_shackles_desc:0 "Vyavasaybandi, Hinduları özgürce meslek seçmekten alıkoyar ve onları sömürücü sistemlere bağlar. Bu zinciri kırarak işçileri özgürleştirir ve gerçekten bağımsız ve adil bir ekonomiye katkıda bulunmalarını sağlarız."
 RAJ_shaheed_and_swaraj:0 "Şehit ve Swaraj"
 RAJ_shaheed_and_swaraj_desc:0 "Şehitlerimizin fedakarlıkları, Swaraj uğruna amansız bir mücadeleyi ateşler. Kanları devrimimizi besler, bize bağımsızlığın verilmediğini—alındığını hatırlatır. Anıları, özgür ve egemen bir Hindistan elde etme kararlılığımızı güçlendirsin."
 RAJ_shareholder_democracy:0 "Hissedar Demokrasisi"
 RAJ_shareholder_democracy_desc:0 "Ülkedeki yasama gücü şirkette olmasına rağmen sadece ismen. Yargıçlar ve yasama organları hepimizin maaşlı elemanları, bu da lehimize yasaları kolayca geçirmemizi ve muhalefeti bölmemizi sağlıyor."
 RAJ_sharpen_the_tulwar:0 "Tulwar'ı Bile"
 RAJ_sharpen_the_tulwar_desc:0 "Tulwar, gücün ve meydan okumanın bir sembolüdür ve gelecek savaşlar için bilenmelidir. Kuvvetlerimizi modernize ederek ve stratejilerimizi geliştirerek, [ROOT.GetNameDef]'ın zaman geldiğinde kesin bir şekilde saldırmaya hazır olduğundan emin oluruz."
 RAJ_sideline_the_conflict:0 "Çatışmayı Kenara İt"
 RAJ_sideline_the_conflict_desc:0 "[ROOT.GetName]'ın başkalarının yanlış yargıları ve bölgesel saldırganlığı yüzünden neden acı çekmesi gerektiği belli değil. Dışa değil, içe odaklanmalıyız."
 RAJ_siege_batteries:0 "Kuşatma Bataryaları"
 RAJ_siege_batteries_desc:0 "Tahkimatlar yolumuza çıktığında, kuşatma bataryaları onları enkaza çevirecek. Bu ağır topçu birlikleri, eşi görülmemiş yıkıcı güç sunarak hiçbir kale veya müstahkem mevkinin ilerlememize direnememesini sağlar."
 RAJ_sikh_religious_guarantees:0 "Sih Dini Garantileri"
 RAJ_sikh_religious_guarantees_desc:0 "Sihler önemli bir dini azınlık ve sert savaşçılardır. Dini haklarını garanti ederek onları yatıştırmalıyız."
 RAJ_skibedi_san_ma:0 "Savaş Ağalarını Kırmak"
 RAJ_skibedi_san_ma_desc:0 "Xibei San Ma'nın savaş ağaları, Mughal İmparatorluğu'nun Orta Asya'daki hakimiyetinin önünde bir engel teşkil ediyor. Kesin bir sefer başlatarak, güçlerini parçalayabilir, stratejik ticaret yollarını güvence altına alabilir ve imparatorluğun bölgedeki etkisini genişletebiliriz."
 RAJ_smiling_buddah:0 "Gülen Buda"
 RAJ_smiling_buddah_desc:0 "Gülen Buda Projesi, Hindistan'ın nükleer yetenekler dünyasına girişini simgeler. Bu teknolojiye hakim olarak küresel sahnede bağımsızlığımızı ortaya koyar ve egemenliğimizi korumak için güçlü bir caydırıcı elde ederiz."
 RAJ_socialist_self_reliance:0 "Sosyalist Kendine Yeterlilik"
 RAJ_socialist_self_reliance_desc:0 "Kapitalist ithalata veya emperyalist danışmanlara bağımlı olmayacağız.\nHindistan kendini besleyecek, kendini silahlandıracak ve gerekirse tek başına duracaktır."
 RAJ_south_east_asia_command:0 "Güneydoğu Asya Komutanlığı"
 RAJ_south_east_asia_command_desc:0 "Gerilimler arttıkça, Güneydoğu Asya için merkezi bir komuta merkezi talebi de artıyor. Böyle bir hareketin öncüleri olabilir, kıtadaki askeri harekatlarımızı planlamak için kullanabileceğimiz bir operasyon üssü inşa edebiliriz."
 RAJ_south_east_asia_command_rename_dm_tt:0 "§Y$RAJ_indian_gentlemen_officers_goe$§! Ulusal Ruhu, §Y$RAJ_south_east_asia_command_dm$§! olarak yeniden adlandırılacak."
 RAJ_south_indian_railway_company:0 "Güney Hindistan Demiryolu Şirketi"
 RAJ_south_indian_railway_company_desc:0 "Güney Hindistan Demiryolu Şirketi, canlı güneyi Hindistan'ın geri kalanına bağlar. Bu ağı güçlendirip genişleterek bölgesel büyümeyi sağlayabilir, birliği teşvik edebilir ve güneyin Hindistan'ın ekonomik bağımsızlık yürüyüşündeki rolünü pekiştirebiliriz."
 RAJ_soviet_indian_industrial_cooperation:0 "Sovyet-Hint Sanayi İşbirliği"
 RAJ_soviet_indian_industrial_cooperation_desc:0 "Ekonomik dönüşümümüzü hızlandırmak için [SOU.GetNameDefCap] ile bir sanayi ortaklığı kuracağız. Onların teknik uzmanlığı ve merkezi planlama deneyimi, ihtiyaçlarımıza uygun bir sosyalist ekonomi inşa etmemizde belirleyici olacak."
 RAJ_soviet_influence:0 "Sovyet Etkisi"
 RAJ_soviet_influence_desc:0 "Sovyetler Birliği, devrimci dönüşümün bir modeli olarak duruyor. Onların ideolojik rehberliğini ve kurumsal çerçevelerini benimseyerek [RAJ.GetName] için benzer bir yol çizebiliriz."
 RAJ_special_economic_zones:0 "Özel Ekonomik Bölgeler"
 RAJ_special_economic_zones_desc:0 "Şirketlerin yatırım yapmasını kolaylaştırmak ve söz konusu şirketlerin vergi yükünü hafifletmek için ülkemizde özel ekonomik bölgeler kuracağız."
 RAJ_special_operations_executive:0 "Özel Operasyonlar İdaresi"
 RAJ_special_operations_executive_desc:0 "Özel Operasyonlar İdaresi, sabotajdan istihbarat toplamaya kadar alışılmadık savaşta uzmanlaşmıştır. Hindistan'daki rolünü genişleterek düşman planlarını bozma ve gizli operasyonları stratejik avantajlara dönüştürme araçlarıyla donanırız."
 RAJ_specialized_dietary_requirement:0 "Özel Beslenme Gereksinimleri"
 RAJ_specialized_dietary_requirement_desc:0 "Moral ve uyumu korumak için birliklerimizin dini ve kültürel inançlarına uygun yemekler sağlamalıyız. Böylece her asker saygı gördüğünü hisseder ve savaşmaya hazır olur."
 RAJ_spitfire:0 "Spitfire"
 RAJ_spitfire_desc:0 "Hızları ve çeviklikleriyle ünlü Spitfire'lar, modern hava kuvvetlerimizin çekirdeğini oluşturacak, gökyüzünde hakimiyeti sağlayacak ve her türlü hava tehdidine güçlü bir yanıt verecektir."
 RAJ_standardized_rations:0 "Standartlaştırılmış Tayınlar"
 RAJ_standardized_rations_desc:0 "Verimlilik ve tutarlılık, güçlü bir ordunun anahtarıdır. Standartlaştırılmış tayınlar uygulayarak lojistiği basitleştirir, maliyetleri düşürür ve her askerin aynı şekilde beslenmesini sağlar, birlikler arasında birlik ve disiplin sağlarız."
 RAJ_stir_unrest_in_the_north:0 "Kuzeyde Huzursuzluğu Körükle"
 RAJ_stir_unrest_in_the_north_desc:0 "Raj'ın kuzey bölgelerindeki halk, fiyat kontrollerinden orantısız bir şekilde etkilendi. Onlar kuru ot gibiler, tek ihtiyacımız olan şey ateşi yakacak bir kıvılcım."
 RAJ_stir_unrest_in_the_north_focus_tt:0 "Ayrıldığımızda aşağıdaki eyaletler üzerinde kontrolü elinde tutacağız:"
 RAJ_stop_unrest_events_tt:0 "§GArtık Huzursuzluk olayları olmayacak.§!"
 RAJ_stopping_the_japanese_threat_into_central_asia:0 "Orta Asya'da Japon Tehdidini Durdur"
 RAJ_stopping_the_japanese_threat_into_central_asia_desc:0 "Japonya'nın emelleri Çin sınırlarında bitmiyor. Şimdi gözleri Orta Asya'ya çevrildi, daha fazla emperyal genişleme için potansiyel bir sıçrama tahtası.\nHemen harekete geçmeliyiz. Doğu sınırımızı güçlendirerek fetih dalgasını bozkırlara ve ötesine ulaşmadan durduracağız."
 RAJ_strengthen_ties_with_british_investors_GOE:0 "İngiliz Yatırımcılarla Bağları Güçlendir"
 RAJ_strengthen_ties_with_british_investors_GOE_desc:0 "$RAJ_strengthen_ties_with_british_investors_desc$"
 RAJ_strike_against_china:0 "[CHI.GetName]'a Saldırı"
 RAJ_strike_against_china_desc:0 "Eğer [CHI.GetName] bölgesel bir güç haline gelirse bize saldıracaktır, belki bugün değil ama kesinlikle yarın. İlk vuran biz olmalıyız."
 RAJ_strike_burma:0 "[BRM.GetNameDef]'a Saldırı"
 RAJ_strike_burma_desc:0 "[BRM.GetName]'ın varlığı, doğu sınırımızda stratejik bir tehdit oluşturuyor. Onu kontrolümüz altına alarak sınırı güvenceye alabilir ve yabancı güçler için potansiyel bir dayanak noktasını ortadan kaldırabiliriz."
 RAJ_strike_eastern_pakistan:0 "Doğu Pakistan'a Saldır"
 RAJ_strike_eastern_pakistan_desc:0 "[PAK.GetName]'ın doğu kanadı izole ve istikrarsız.\nŞimdi, sağlam bir dayanak elde edemeden önce saldırma zamanıdır."
 RAJ_submarine_effort_dlc:0 "$RAJ_submarine_effort$"
 RAJ_supply_center_fortifications:0 "Tedarik Merkezi Tahkimatları"
 RAJ_supply_center_fortifications_desc:0 "Tedarik merkezlerimizi güvence altına almak, savaş çabalarını sürdürmek için kritik öneme sahiptir. Bu merkezleri tahkim ederek kaynak akışını kesintisiz sağlar ve askeri operasyonların belkemiğini düşman saldırılarından koruruz."
 RAJ_supply_center_fortifications_tt:0 "Sahip olduğumuz her §YTedarik Merkezi§! için §G3§! §Y$bunker$§! ekler."
 RAJ_support_naval_invasions:0 "Deniz Çıkarmalarını Destekle"
 RAJ_support_naval_invasions_desc:0 "Bu savaş sadece karada ve havada değil, aynı zamanda denizde de savaşılacak. Kara kuvvetlerimizi seferber etmek ne kadar önemliyse, donanmamızı da müttefiklerimizin deniz çıkarma planlarını desteklemeye hazırlamalıyız."
 RAJ_suppress_paramilitary_organizations:0 "Paramiliter Örgütleri Bastır"
 RAJ_suppress_paramilitary_organizations_desc:0 "[GetRajName]'da hala dağınık paramiliter gruplar var. Onları hızlıca kökünden sökmeliyiz, çünkü yabani otlar toprağa sağlamca yerleştiğinde köklerini çıkarmak zordur."
 RAJ_swadeshi_movement:0 "Swadeshi Hareketi"
 RAJ_swadeshi_movement_desc:0 "Swadeshi veya [ENG.GetAdjective]'den kendi kendine yeterlilik, bağımsızlık hareketini harekete geçirecek ve Hindistan'ın zenginliğini Hindistan'da tutacaktır."
 RAJ_take_in_british_naval_experts:0 "[ENG.GetAdjective] Deniz Uzmanlarını Al"
 RAJ_take_in_british_naval_experts_desc:0 "Evde, İngiltere'de dünyanın en iyi deniz uzmanlarından bazılarına sahibiz, bazılarını buraya getirmek yeterince kolay olacaktır."
 RAJ_take_over_administrative_rights:0 "İdari Hakları Devral"
 RAJ_take_over_administrative_rights_desc:0 "[ENG.GetAdjective] hükümeti bölgeden zarif bir şekilde çekilmek için idari görevleri şirket memurlarımıza devretmeye başladı."
 RAJ_tata_steel_dlc:0 "Tata Çelik"
 RAJ_tata_steel_dlc_desc:0 "$RAJ_tata_steel_desc$"
 RAJ_tea_exports:0 "Çay İhracatı"
 RAJ_tea_exports_desc:0 "Çay, dünya çapında büyük bir ihracat ürünü haline geldi ve birçok Hintlinin hayatının temel taşı oldu."
 RAJ_tea_exports_tt:0 "§Y5 kez genişletilebilir§!"
 RAJ_tea_exports_tt_2:0 "\nBağımsızlık kazanıldığında §Y$idea_RAJ_tea_exports$§! kaldırılacak ve"
 RAJ_temple_entry_movements:0 "Tapınak Giriş Hareketleri"
 RAJ_temple_entry_movements_desc:0 "Dokunulmazlık bu ülkenin bir lekesidir ve sadece bizi bölmeye çalışır. Buna karşı mücadele etmek için her kasttan insanın ibadet yerlerine girmesine izin vereceğiz."
 RAJ_tenancy_reforms:0 "Kiracılık Reformları"
 RAJ_tenancy_reforms_desc:0 "Zengin kara şapkalılar konut piyasasını ele geçiriyor, fiyatları artırıyor ve yaşam standartlarını düşürürken sıradan insanları kandırıyor. Kongre, kiracılık reformları için güçlü bir şekilde lobi yapacak, bir ev sahibinin konut için ne kadar ücret alabileceğine sınır koyacak."
 RAJ_territorial_development_scheme:0 "Bölgesel Kalkınma Planı"
 RAJ_territorial_development_scheme_desc:0 "[ROOT.GetNameDef]'ın ekonomik potansiyelini tam olarak kullanmak için arazi tahsisini ve kullanımını yeniden değerlendirmeliyiz. Bölgesel Kalkınma Planı, az gelişmiş bölgeleri belirleyecek, büyümenin önündeki engelleri kaldıracak ve yeni bölgeleri sanayi genişlemesi için hazırlayacak."
 RAJ_the_aden_protectorate:0 "Aden Protektorası"
 RAJ_the_aden_protectorate_desc:0 "Arap Yarımadası'ndaki Aden Eyaleti yetki alanımıza giriyor. Bu nedenle, [ENG.GetNameDef]'a [RAJ.GetNameDef]'ın [ENG.GetAdjective] İmparatorluğu'nun Orta Doğu sularındaki çıkarlarını savunabileceğini kanıtlamak için çabalarımızda onun korunmasını sağlamak çok önemlidir."
 RAJ_the_burma_rifles:0 "Birmanya Tüfekleri"
 RAJ_the_burma_rifles_desc:0 "Birmanya Tüfekleri, doğu sınırının zorlu arazisinde güvenliği sağlamak için hayati bir güçtür. Bu alayı güçlendirerek ve modernize ederek istikrarı sağlar, kilit bölgeleri savunur ve bu stratejik bölgedeki gelecek zorluklara hazırlanırız."
 RAJ_the_burma_road:0 "Birmanya Yolu"
 RAJ_the_burma_road_desc:0 "Birmanya Yolu, Hindistan'ı Güneydoğu Asya'ya ve ötesine bağlayan hayati bir tedarik yoludur. Bu güzergahı güvence altına alıp genişleterek kaynak ve takviye akışını sağlar, bölgedeki konumumuzu güçlendirir ve müttefiklerimizi destekleriz."
 RAJ_the_calcutta_line:0 "Kalküta Hattı"
 RAJ_the_calcutta_line_desc:0 "Bölgesel gerilimler tırmanırken doğu sınırını güvence altına almak zorunludur. Kalküta Hattı'nı güçlendirmek, hayati altyapıyı koruyacak ve kalbimizi dış tehditlerden koruyacak bir savunma kalesi oluşturacak."
 RAJ_the_calcutta_line_tt:0 "Eyaletteki §Yher§! ileti için §G2§! §YKara Kalesi§! ekler."
 RAJ_the_crown_and_the_world:0 "Taç ve Dünya"
 RAJ_the_crown_and_the_world_desc:0 "Mughal İmparatorluğu'nun kaderi, rakipsiz bir küresel süper güç olarak yükselmektir. Etkimizi genişleterek, gücümüzü artırarak ve hakimiyetimizi ortaya koyarak, modern dünyanın nihai hükümdarı olarak yerimizi güvence altına alacağız."
 RAJ_the_defense_of_hong_kong:0 "Hong Kong'un Savunması"
 RAJ_the_defense_of_hong_kong_desc:0 "[CHI.GetNonIdeologyName]'daki baskı arttıkça, [ENG.GetAdjective] taçı Hong Kong'daki varlıklarının akıbeti konusunda endişeleniyor. Şehri bir istiladan korumak için yardım etmek için mükemmel bir konumdayız ve başarılı olursak, bu bize [ENG.GetAdjective] hükümetinden lehte ve onay kazandıracaktır."
 RAJ_the_dominion_of_india:0 "Hindistan Dominyonu"
 RAJ_the_dominion_of_india_desc:0 "Altkıtada düzen kesin olarak yeniden tesis edildiğine göre, şimdi imparatorluk kardeşlerimiz arasında sadık ve özyönetimli bir dominyon olarak yerimizi alma zamanıdır. \nÇok yaşa Kral!"
 RAJ_the_dominion_of_india_every_owned_state_compliance_tt:0 "§Y%100§! altında Uyum'a sahip her sahip olunan eyalet"
 RAJ_the_empires_workshop:0 "İmparatorluğun Atölyesi"
 RAJ_the_empires_workshop_civs_to_the_empire_subjects_tt:0 "(§Y[ENG.GetFlag][ENG.GetName]§! rastgele bir çekirdek eyalette): \n §G2§! Bina Yuvası ekle. \n §G2§! §Y$industrial_complex$§! ekle \n\n(§YHer [ENG.GetFlag][ENG.GetAdjective] uyruk§! rastgele bir çekirdek eyalette): \n §G1§! Bina Yuvası ekle. \n §G1§! §Y$industrial_complex$§! ekle"
 RAJ_the_empires_workshop_desc:0 "İmparatorluğun artan küresel talepler karşısında gücünü sağlamak için [ROOT.GetNameDef] ile [ROOT.OVERLORD.GetNameDef] arasındaki ekonomik bağları derinleştireceğiz. Her iki bölgede de koordineli yatırım ve fabrika genişlemesi, ortak sanayi temelimizi tek bir birleşik üretim motoruna dönüştürecek."
 RAJ_the_enemy_of_my_enemy:0 "Düşmanımın Düşmanı"
 RAJ_the_enemy_of_my_enemy_desc:0 "Bağımsızlık mücadelesinde ittifaklar zorunlulukla kurulur. İngilizlere karşı olanlarla işbirliği yaparak topraklarımızdaki hakimiyetlerini zayıflatabiliriz. Özgürlük beklenmedik ortaklıklar gerektirebilir, ancak önemli olan tek şey zaferdir."
 RAJ_the_enemy_of_my_enemy_tt:0 "§Y[JAP.GetAdjective]§! hükümeti iç savaşta karşı tarafa savaş ilan edecek ve bize yardım edecek."
 RAJ_the_enemy_of_my_enemy_tt_2:0 "§Y[JAP.GetAdjective]§! ayrıca §Y[733.GetName]§!'i işgal etmeye çalışacak ve bize teslim edecek."
 RAJ_the_government_of_india_act:0 "Hindistan Hükümeti Yasası"
 RAJ_the_government_of_india_act_desc:0 "Hindistan Hükümeti Yasası, eyaletlerimizde daha fazla özyönetimin kapısını açtı. Yetkiyi yerel bakanlıklara devrederek ılımlı sesleri yatıştırabilir ve idari verimliliği artırabiliriz, tabii ki İmparatorluğun eliyle sıkıca dizginleri tutarak."
 RAJ_the_government_of_india_act_pp_bonus_tt:0 "§Y$RAJ_a_loyal_government$§! şu şekilde değiştirilecek: Başlangıç eyaletlerinden §Y%74§! üzeri Uyum'a sahip olanlar için [?RAJ_the_government_of_india_act_pp_bonus_based_on_compliance|+=%%0] $MODIFIER_POLITICAL_POWER_FACTOR$"
 RAJ_the_great_recovery:0 "Büyük Toparlanma"
 RAJ_the_great_recovery_desc:0 "Büyük Buhran'ın izleri ekonomimizde kaldı, ilerlemeyi yavaşlattı ve güveni zayıflattı. Ancak şimdi, yenilenen istikrar ve vizyonla, durgunluk yüklerini atacağız. Bu sadece normalliğe dönüş değil, [ROOT.GetNameDef] için yeni bir bölümün başlangıcı olacak."
 RAJ_the_hindu_martial_tradition:0 "Hindu Savaş Geleneği"
 RAJ_the_hindu_martial_tradition_desc:0 "Shivaji'nin savaşçılarından dharma savunucularına kadar, kadim savaş ruhumuzu canlandıracağız ve halkımızı gelecek savaşlara hazırlayacağız."
 RAJ_the_indian_national_army:0 "Hindistan Ulusal Ordusu"
 RAJ_the_indian_national_army_desc:0 "Hindistan Ulusal Ordusu, bağımsızlık mücadelesini somutlaştırır, vatanseverleri tek bir bayrak altında toplayarak sömürge yönetimine karşı silahlanır. Kararlılığı ve fedakarlığıyla INA, Hindistan'ı özgürlük ve egemenliğe taşımaya hazırdır."
 RAJ_the_indian_parliament:0 "Hint Parlamentosu"
 RAJ_the_indian_parliament_desc:0 "Özyönetim talepleri arttıkça, Genel Vali'den sivil otoriteyi devralacak bir Hint Parlamentosu kuracağız. Bu geçiş, elbette İmparatorluk çerçevesi içinde, yerel liderliğe gerçek özerklik sağlayacaktır."
 RAJ_the_integrity_of_india_act:0 "Hindistan'ın Bütünlüğü Yasası"
 RAJ_the_integrity_of_india_act_desc:0 "Artarak büyüyen ihanet tehdidine karşı koymak ve imparatorluk otoritesini korumak için Hindistan'ın Bütünlüğü Yasası'nı çıkaracağız. Bu mevzuat, ajitatörleri gözaltına alma, siyasi muhalefeti kısıtlama ve altkıta genelinde sadık yönetimi sağlama yetkisi verecektir. Sonuçta, birlik bazen zorla sağlanmalıdır."
 RAJ_the_jewel_becomes_the_crown:0 "Mücevher Taç Oluyor"
 RAJ_the_jewel_becomes_the_crown_desc:0 "Anavatanın düşüşüyle, şimdi imparatorluk ailesi içinde liderlik yükünü üstlenmek bize düşüyor. Yeni bir azimle, [ROOT.GetNameDef]'ın geniş kaynaklarını imparatorluğun kalbini kurtarmak ve onun güzel ve sevimli topraklarını lekeleyenleri yok etmek için kullanacağız."
 RAJ_the_ledo_road:0 "Ledo Yolu"
 RAJ_the_ledo_road_desc:0 "Engebeli araziden geçen Ledo Yolu, Hindistan'ı Çin'deki Müttefik kuvvetlere bağlayan kritik bir tedarik yoludur. Bu hayat hattını tamamlayıp güvence altına alarak birliklerin, kaynakların ve teçhizatın akışını sağlar, Güneydoğu Asya'da dengeleri lehimize çeviririz."
 RAJ_the_legacy_of_babur:0 "Babür'ün Mirası"
 RAJ_the_legacy_of_babur_desc:0 "Mughal İmparatorluğu bir zamanlar altkıtanın büyük bir kısmını bir araya getirdi. Şimdi, Babür'ün mirasını kullanarak imparatorluk ihtişamını ve birliğini yeniden tesis etmeyi hayal edenler var."
 RAJ_the_legacy_of_babur_tt:0 "Huzursuzluğun körüklendiği her eyalet şunları alacak: "
 RAJ_the_mughal_uprising:0 "Mughal Ayaklanması"
 RAJ_the_mughal_uprising_desc:0 "Kuzeydeki uzak bölge, İngilizlerden ayrılmak için mükemmel bir coğrafi konum sunuyor.\nYerel liderler, halkın kalbinde Mughalların bu toprakları özgürce yönettiği, kendi kaderlerini tayin ettikleri görkemli geçmişe dair hikayelerle alevleri körükledi.\nİnşallah, biz de yapacağız."
 RAJ_the_mughal_uprising_tt:0 "§YBritanya Rajı§!'ndan ayrılacağız ve §Rbağımsızlık savaşı ilan edeceğiz§!."
 RAJ_the_mughal_uprising_tt2:0 "İç savaşın sonunda kontrolümüzde olan tüm eyaletlere sahip olacağız"
 RAJ_the_need_for_a_mercantile_navy:0 "Ticari Donanma İhtiyacı"
 RAJ_the_need_for_a_mercantile_navy_desc:0 "Deniz ticareti, dünya çapında ticaret yapmanın en önemli yoludur. Bu malları teslim edebilecek ve aynı zamanda onları savunabilecek bir donanmaya ihtiyacımız var."
 RAJ_the_ordnance_factories_board:0 "Mühimmat Fabrikaları Kurulu"
 RAJ_the_ordnance_factories_board_desc:0 "Hindistan'ın geniş mühimmat fabrikaları ağını birleşik bir kurul altında koordine ederek üretimi kolaylaştırır, verimliliği artırır ve silah ve mühimmatın tutarlı arzını sağlarız. Bu temel, askeriyemizi güçlendirecek ve savunma üretiminde kendi kendine yeterliliği sağlayacaktır."
 RAJ_the_pakistan_movement:0 "Pakistan Hareketi"
 RAJ_the_pakistan_movement_desc:0 "Bir Müslüman vatanı, Pakistan için çağrılar giderek artıyor. Hindular ve Müslümanlar arasındaki çatışmalar böyle devam ederse birleşik bir Hindistan'ı sürdürmek mümkün olmayabilir."
 RAJ_the_pakistan_movement_tt_1:0 "Şu durumlara kadar yenilenecek:\n§Y-[PAK.GetName]§! özgür\n§Y-[PAK.GetName]§! teslim oldu\n-§Y5§! kez tekrarlandı.\n\nRuhun §Y90 gün§! yaşam döngüsünün sonunda şunları kazanacağız: "
 RAJ_the_pakistan_movement_tt_2:0 "§Y90§! gün(günler) boyunca"
 RAJ_the_peoples_liberation_army:0 "Halkın Kurtuluş Ordusu'nu Kur"
 RAJ_the_peoples_liberation_army_desc:0 "Disiplinli ve ideolojik olarak bağlı bir güç olan Halkın Kurtuluş Ordusu, ulusal kurtuluş için öncülük edecek. İşçi sınıfı ve köylülükten oluşan bu ordu, devrimi savunmaya ve yeni bir düzen kurmaya hazır."
 RAJ_the_punjab_accord:0 "Pencap Anlaşması"
 RAJ_the_punjab_accord_desc:0 "Sih toplumunun benzersiz konumunu tanıyarak ve Pencap'ta sınırlı özerklik vererek, sadakat ve hizmetin köklü bağını güçlendireceğiz. Karşılığında, sürekli destekleri [ROOT.GetNameDef]'ın kritik öneme sahip bir bölgedeki otoritesini güçlendirecek ve gelenekle istikrarın el ele yürümesini sağlayacaktır."
 RAJ_the_red_curtain_falls_over_asia:0 "Kızıl Perde Asya'ya İniyor"
 RAJ_the_red_curtain_falls_over_asia_desc:0 "Anavatanımızı güvence altına aldık.\nŞimdi devrim ateşini komşularımıza sözle, broşürle veya silahla taşıma zamanıdır."
 RAJ_the_red_curtain_falls_over_asia_desc_tt:0 "Asya'da komünist bir devrim yaymak için kararların kilidini açar"
 RAJ_the_return_of_the_east_india_company:0 "Doğu Hindistan Şirketi'nin Dönüşü"
 RAJ_the_return_of_the_east_india_company_desc:0 "Onlarca yıllık yokluğun ardından, Doğu Hindistan Şirketi Hindistan alt kıtasını acımasız bir verimlilikle sömürmek için yeniden kurulacak."
 RAJ_the_return_of_the_east_india_company_tt:0 "Doğu Hindistan Yatırım Planları ve Vergileri artık aktif.\nYatırımcılara kar payı dağıtmak için §Ykararların§! kilidi açıldı"
 RAJ_the_revolutionary_army_marches:0 "Devrimci Ordu Yürüyor"
 RAJ_the_revolutionary_army_marches_desc:0 "Amacımızla ordumuz yürüyor, devrim için, Hindistan için ve sıradan insan için."
 RAJ_the_riches_of_the_raj:0 "Raj'ın Zenginlikleri"
 RAJ_the_riches_of_the_raj_desc:0 "[ROOT.GetNameDef]'ın geniş ovaları ve engebeli tepelerinin altında, savaştaki bir imparatorluğu güçlendirmek için gereken kaynaklar yatıyor. Çelik, petrol ve diğer hayati malzemeler çıkarılacak, rafine edilecek ve ülkenin savunmasında kullanılacak."
 RAJ_the_riches_of_the_raj_targets_oil_tt:0 "§Y$state_resource_oil$§!£resources_strip|1 olan her başlangıç eyaletine: \n §Y+4§!£resources_strip|1 üretimi ekler. \n §G1§! §Y$infrastructure$§! ekler."
 RAJ_the_riches_of_the_raj_targets_tt:0 "En az §Y20§! birim §Y$state_resource_aluminium$§!£resources_strip|2 , §Y$state_resource_rubber$§!£resources_strip|3 , §Y$state_resource_chromium$§!£resources_strip|6 , §Y$state_resource_tungsten$§!£resources_strip|4, §Y$state_resource_coal$§!£resources_strip|0 veya §Y$temporary_state_resource_steel$§!£resources_strip|5 içeren her başlangıç eyaletine: \n Kaynağın üretimine ek §Y+4§! birim ekle. \n §G1§! §Y$infrastructure$§! ekle."
 RAJ_the_second_duar_war:0 "İkinci Duar Savaşı"
 RAJ_the_second_duar_war_desc:0 "[BHU.GetAdjective] halkının dünyanın içinde bulunduğu durumda bağımsız bir devlet olmasına artık izin verilemez. Onları Hindistan'a dahil etmeliyiz."
 RAJ_the_second_gorkha_war:0 "İkinci Gorkha Savaşı"
 RAJ_the_second_gorkha_war_desc:0 "Nepal'in bağımsızlığı geçmişin bir kalıntısıdır ve birleşik olması gereken alt kıtayı bölmektedir. Kesin bir sefer, Gorkhaları bir araya getirerek Himalayalar'ı güvence altına alacak."
 RAJ_the_silk_road:0 "İpek Yolu'nu Genişlet"
 RAJ_the_silk_road_desc:0 "İpek Yolu bir zamanlar imparatorluğa zenginlik ve kültür getirdi. Bu tarihi ticaret ağını restore ederek, küresel ticaretin merkezindeki yerimizi geri alır, imparatorluğu zenginleştirir ve geniş topraklarında refahı teşvik ederiz."
 RAJ_the_sun_sets:0 "Güneş Batıyor"
 RAJ_the_sun_sets_desc:0 "İmparatorluk çağı sona eriyor. [ENG.GetAdjective] hakimiyeti zayıflarken, onların çöküşünü hızlandıracağız. Güneş nihayet imparatorluklarının üzerine batacak ve biz onun gölgesinden yükseleceğiz."
 RAJ_the_sword_and_the_saffron:0 "Kılıç ve Safran"
 RAJ_the_sword_and_the_saffron_desc:0 "Kaderimiz güç ve inançla şekillenir. Kılıç topraklarımızı savunacak ve safran bayrağı halkımızı tek bir amaç altında birleştirecek."
 RAJ_the_true_mongols:0 "Gerçek Moğollar"
 RAJ_the_true_mongols_desc:0 "[Root.GetNameDef], Moğol mirasının meşru varisidir, bozkırların gücünü altkıtanın kültürüyle harmanlar. Köklerimize sarılarak, atalarımızın bir zamanlar yaptığı gibi fethetme ve birleştirme ruhunu yansıtıyoruz."
 RAJ_the_varuna_class:0 "Varuna Sınıfı"
 RAJ_the_varuna_class_desc:0 "En yeni savaş gemimiz mühendislik harikası oldu. Bu nedenle, bu gemiye bir tanrının adını vermekten daha uygun bir şey olamaz."
 RAJ_theocratic_rule:0 "Dhimmi'yi Yeniden Kodla"
 RAJ_theocratic_rule_alt:0 "Moğol Mirası"
 RAJ_theocratic_rule_alt_desc:0 "Biz fatihlerin varisleriyiz, bir zamanlar dünyayı sarsmış bir imparatorluğun mirasçılarıyız. Moğol mirasını onurlandırmak için güçle birliği sağlamalı, Hint altkıtasını inanç veya kökene göre değil, tahta bağlılıkla birleştirmeliyiz. İmparatorluğun gücü karşısında herkes diz çökecek."
 RAJ_theocratic_rule_desc:0 "Mughal yönetimi altında Müslüman olmayanların hakları oldukça kısıtlayıcıydı. Şimdi bu meseleleri modern bir dünya için ayarlamanın ve tüm Hindistan'a aydınlanmış bir diyar olduğumuzu kanıtlamanın zamanı geldi."
 RAJ_threaten_princes:0 "Prensleri Tehdit Et"
 RAJ_threaten_princes_desc:0 "Prensler taleplerimize boyun eğecek ya da itaatsizliklerinin sonuçlarıyla yüzleşecekler."
 RAJ_through_the_wakhan_corridor:0 "Wakhan Koridoru'ndan Geçiş"
 RAJ_through_the_wakhan_corridor_desc:0 "$RAJ_skibedi_san_ma_desc$"
 RAJ_thunder_elephants:0 "Yıldırım Filler"
 RAJ_thunder_elephants_desc:0 "Mughal gücünün sembolü olan görkemli filler, güç ve geleneğin somutlaşmış hali olarak savaş alanına geri dönüyor. Saf güçleri ve varlıkları, ordularımıza ilham verecek ve düşmanlarımızın kalplerine korku salacak, böylece imparatorluk zaferlerinin yolunu açacak."
 RAJ_timurid_bureaucracy:0 "Timur Bürokrasisi"
 RAJ_timurid_bureaucracy_desc:0 "Timur'un mirasına kök salmış Timurlu Bürokrasisi, verimli bir yönetim ve merkezi kontrol modeli sunar. Bu sistemi yeniden canlandırmak, İmparatorluğun idaresini güçlendirecek ve geniş topraklarında istikrar ve refah sağlayacaktır."
 RAJ_to_shake_the_world:0 "Dünyayı Sarsmak"
 RAJ_to_shake_the_world_desc:0 "Hindistan'ın endüstriyel potansiyeli muazzamdır ve şimdi onu serbest bırakma zamanıdır. Fabrikaları genişleterek, altyapıyı modernize ederek ve kaynaklarımızı harekete geçirerek Hindistan'ı dünyanın kaderini şekillendirebilen bir endüstri devine dönüştürebiliriz."
 RAJ_trade_federation_of_india:0 "Yeniden Markalaşma"
 RAJ_trade_federation_of_india_desc:0 "Son yıllarda tarihi büyüme kaydettik ve çoğu şirketin ancak hayal edebileceği bir siyasi güce ulaştık. Ancak, kontrolümüz altındaki bazı eyaletler hala şirket yönetimini kabul etmiyor, belki de büyük bir maddi tazminat akışı onları ikna edebilir?"
 RAJ_trade_federation_of_india_tt:0 "Yüksek uyumlu sahipli eyaletleri çekirdek haline getirmek için §YTüketim Malları Fabrikaları faktörü§! ve §YSiyasi Güç§! kullanarak kararların kilidi açılır."
 RAJ_trade_port:0 "Ticaret Limanı"
 RAJ_trade_port_desc:0 "Aden şu anda çok küçük bir liman, ancak yatırımlarla gelişen bir limana dönüşebilir."
 RAJ_trade_protection:0 "Ticaret Koruması"
 RAJ_trade_protection_desc:0 "Ekonomimizin refahını sağlamak için hayati ticaret yollarını ve endüstrileri yabancı sömürüsünden korumalıyız. Ticaret korumasını güçlendirerek Hindistan'ın kaynaklarını güvence altına alır, iç büyümeyi teşvik eder ve pazarlarımızı dış tehditlerden koruruz."
 RAJ_trade_route_protection:0 "Ticaret Yolu Koruması"
 RAJ_trade_route_protection_desc:0 "Doğuda ve batıda düşman güçler şekilleniyor. Sularımızda ileri geri seyahat eden malları ele geçirmeyi düşünen herkese karşı bir caydırıcı olarak konumlanmalıyız."
 RAJ_trainer_planes:0 "Eğitim Uçakları"
 RAJ_trainer_planes_desc:0 "Becerikli pilotlar, güçlü bir hava kuvvetinin belkemiğidir. Eğitim uçaklarına yatırım yaparak havacılarımızın en iyi hazırlığı almasını sağlar, Hindistan'ın gökyüzünü savunmaya hazır seçkin bir havacı kadrosu oluştururuz."
 RAJ_tryst_with_destiny:0 "Kaderle Randevu"
 RAJ_tryst_with_destiny_desc:0 "Uzun yıllar önce kaderle bir randevu yaptık ve şimdi sözümüzü tutma zamanı geldi, tamamen veya tam ölçüde değil, ama oldukça önemli ölçüde. Gece yarısı saatlerinde, dünya uyurken, Hindistan yaşama ve özgürlüğe uyanacak."
 RAJ_two_nation_theory_:0 "İki Ulus Teorisi"
 RAJ_two_nation_theory__desc:0 "İki Ulus Teorisi, Hindular ve Müslümanların ayrı uluslar olduğunu ve her birinin kendi devletini hak ettiğini savunur. Bu ideolojiyi benimseyerek, kendi kaderini tayin için ayrı yollara ihtiyaç olduğunu kabul eder, alt kıtanın geleceğini bölünme ve özerklikle şekillendiririz."
 RAJ_two_nation_theory_dlc:0 "$RAJ_two_nation_theory$"
 RAJ_two_nation_theory_dlc_desc:0 "$RAJ_two_nation_theory__desc$"
 RAJ_union_busting:0 "Sendika Bastırma"
 RAJ_union_busting_desc:0 "Sendikalar yenilik ve liyakate dayalı ilerleme için bir engeldir, işçilere hiçbir fayda sağlamaz ve şirketleri bürokrasiyle boğar. Bu komünist gündemi yayılmadan önce yok edin."
 RAJ_unite_the_subcontinent:0 "Altkıtayı Birleştir"
 RAJ_unite_the_subcontinent_desc:0 "Altkıtanın parçalanmış devletleri, eski ihtişamının bir gölgesidir. Bu toprakları Mughal sancağı altında yeniden birleştirerek, dağlardan denizlere kadar hükmetmek için kaderlenmiş bir imparatorluğun uyumunu, gücünü ve ihtişamını geri getiririz."
 RAJ_united_bengal:0 "Birleşik Bengal"
 RAJ_united_bengal_desc:0 "Pakistan'ı iki ülkeye, Bengal ve Pakistan'a ayırmak mantıklıdır. Pakistan'daki bir hükümet, uzak mesafedeki bir Bangladeş yerleşimini düzgün şekilde yönetemez."
 RAJ_united_bengal_tt:0 "§Y[BAN.GetName]§! bölünme sırasında özgür olacak"
 RAJ_uplifting_the_people_of_india:0 "Hindistan Halkını Yüceltmek"
 RAJ_uplifting_the_people_of_india_desc:0 "Hindistan halkı, bağımsızlığa doğru yürüyüşlerinde kararlı olmalıdır. Bunun için önce temel ihtiyaçlarının karşılanması gerekiyor; bu nedenle bunu sağlamak için politikalar uygulayacağız."
 RAJ_uranium_tipped_bullets:0 "Uranyum Uçlu Mermiler"
 RAJ_uranium_tipped_bullets_desc:0 "Fazla uranyumumuzla ne yapacağız, mermilerimizin ucuna takmaktan başka?"
 RAJ_uranium_tipped_bullets_tt:0 "§Y$category_all_infantry$§!:\n Sert Saldırı: §G+25%§!\n Delme: §G+100%§!\n§Y$category_cavalry$§!:\n Sert Saldırı: §G+10%§!\n Delme: §G+40%§!\n§Y$category_artillery$§!:\n Delme: §G+100%§!\n§Y$category_tank_destroyers$§!\n Sert Saldırı: §G+15%§!\n Delme: §G+20%§!\n§Y$anti_tank$§!:\n Sert Saldırı: §G+10%§!\n Delme: §G+20%§!\n§Y$mot_anti_tank_brigade$§!:\n Sert Saldırı: §G+10%§!\n Delme: §G+20%§!\n§Y$anti_air$§!:\n Uçaksavar Saldırısı: §G+10%§!\n§Y$mot_anti_air_brigade$§!:\n Uçaksavar Saldırısı: §G+10%§!"
 RAJ_urban_industrialism:0 "Kentsel Endüstriyalizm"
 RAJ_urban_industrialism_desc:0 "Gelecek otlaklarda değil, fabrikalarda yatıyor.\nSadece hızlı endüstriyel kalkınma yoluyla devrimi güvence altına alabilir ve önümüzdeki savaşlara hazırlanabiliriz."
 RAJ_urban_industrialism_tt:0 "Bu, Beş Yıllık Planı Endüstriyel Genişlemeye daha fazla yönlendirecek ve §G+%10§! İnşa Hızı sağlayacak"
 RAJ_urban_industrialism_tt2:0 "Bu, Beş Yıllık Planı Tarımsal Sosyalizme daha fazla yönlendirecek ve şunları sağlayacak:"
 RAJ_urban_training:0 "Kentsel Eğitim"
 RAJ_urban_training_desc:0 "Umarız buna gerek kalmaz, ama büyük şehirlerimizin sokaklarında düşmanı durdurmak zorunda kalabiliriz. Böyle bir senaryoyu özel kentsel eğitimle yönetmeye hazır olmalıyız."
 RAJ_vertical_integration:0 "Dikey Entegrasyon"
 RAJ_vertical_integration_desc:0 "Son vergi kaçırma planları denizaşırı hükümetler tarafından büyük ölçüde fark edilmedi. Belki de vergilerimizi daha da azaltmak için daha fazla boşluktan yararlanabiliriz."
 RAJ_viceroys_body_guard:0 "Genel Vali Muhafızları"
 RAJ_viceroys_body_guard_desc:0 "Genel Vali Muhafızları, geleneği, disiplini ve prestiji temsil eder. Bu köklü süvari birliğini koruyarak ve modernize ederek otoritenin bir sembolünü yaşatır ve değişen bir çağın zorluklarına uyum sağlarız."
 RAJ_vultee_vengeance:0 "Vultee Vengeance"
 RAJ_vultee_vengeance_desc:0 "Amerikan Vultee Vengeance uçaklarını elde ederek hava kuvvetlerimizi çok uygun bir maliyetle büyük ölçüde genişletebiliriz."
 RAJ_war_taxes:0 "Savaş Vergileri"
 RAJ_war_taxes_desc:0 "Savaşın maliyeti ortak fedakarlık gerektirir. Savaş vergileri koyarak askeri seferlerimizi finanse edebilir ve zafer için gerekli kaynakları sağlayabiliriz. Özgür bir Hindistan her kuruşa değer."
 RAJ_war_taxes_tt:0 "Savaştaki her ülke için savaş vergileri toplama kararının kilidi açılır."
 RAJ_water_privatization:0 "Su Özelleştirmesi"
 RAJ_water_privatization_desc:0 "Yerel su tedarikçileriyle kamu-özel ortaklıklarına girerek verimliliği ve hizmet kalitesini artıracağız."
 RAJ_womens_auxiliary_air_force:0 "Kadın Yardımcı Hava Kuvvetleri"
 RAJ_womens_auxiliary_air_force_desc:0 "Kadın Yardımcı Hava Kuvvetleri, kadınları lojistikten iletişime kadar hava operasyonlarını desteklemeye teşvik eder. Yeteneklerini entegre ederek hava kuvvetlerimizi güçlendirir ve her Hintlinin ulusun gökyüzünü korumaya katkıda bulunabileceğini kanıtlarız."
 RAJ_womens_auxiliary_corps:0 "Kadın Yardımcı Kolordusu"
 RAJ_womens_auxiliary_corps_desc:0 "Kadın Yardımcı Kolordusu'nu kurarak kadınları lojistik, iletişim ve operasyonlarda kritik destek rollerinde görevlendiriyoruz. Katkıları silahlı kuvvetlerimizi güçlendirecek ve her Hintlinin geleceğimizi güvence altına almada rol oynayabileceğini kanıtlayacak."
 RAJ_womens_royal_indian_naval_service:0 "Kadınlar Kraliyet [ROOT.GetAdjective] Deniz Hizmeti"
 RAJ_womens_royal_indian_naval_service_desc:0 "Kadınların Donanmada bir rol üstlenmesine izin veren Kadınlar Kraliyet [ROOT.GetAdjective] Deniz Hizmeti'ni kuracağız."
 RAJ_work_with_local_leaders:0 "Yerel Liderlerle Çalış"
 RAJ_work_with_local_leaders_desc:0 "Etkili eyalet figürleriyle işbirliği yaparak kaynaklarımızı aşırı zorlamadan erişimimizi genişletebiliriz. Bu liderler bölgelerinin ihtiyaçlarını anlar ve hem halklarına hem de Taç'ın çıkarlarına hizmet eden iyileştirmeler uygulayabilir."
 SSB_accept_tt:0 "Sadabat Paktı'nı kabul eden her ulusla bir saldırmazlık paktına gireceğiz. Ortak hedeflere ulaşmaya yardımcı olmak için diğer üyelerle ortak bir odak ağacına erişim sağlayacağız."
 SSB_baghlan_sugar_factory_branches:0 "Bağlan Şirketi için Yeni Şubeler"
 SSB_baghlan_sugar_factory_branches_desc:0 "Bağlan Şirketi şu anda sadece [AFG.GetNonIdeologyName]'da fabrikalar inşa ediyor. Yeni fabrikaların sadece [AFG.GetNonIdeologyName]'da değil, Sadabat ülkelerinin herhangi birinde inşa edilmesine izin verebiliriz, böylece karşılıklı ekonomik büyümeyi sağlayabiliriz."
 SSB_basic_available_trigger_tt:0 "Herhangi bir Sadabat Paktı Üyesiyle savaş halinde değil"
 SSB_berlin_baghdad_railway_into_iran_afghanistan:0 "Berlin-Bağdat Demiryolu Üzerinden Ortak Ticaret"
 SSB_berlin_baghdad_railway_into_iran_afghanistan_desc:0 "Berlin-Bağdat Demiryolu, [IRQ.GetAdjective] ticaretinin ve ekonomisinin temel taşıdır. Bu demiryolunu Ankara-Kabil demiryoluyla bağlama ve diğer imzacı ulusların onun üzerinden ticaret yapmasına izin verme fırsatımız var."
 SSB_chromium_2_tt:0 "Diğer pakt üyelerinden kaynak ithal eder ve şunları ekler:\n§Y4§! £GFX_resources_strip|1, §Y5§!£GFX_resources_strip|4, §Y6§!£GFX_resources_strip|2, §Y6§!£GFX_resources_strip|5 doğrudan §Ybaşkente§!."
 SSB_chromium_tt:0 "[TUR.GetName]'dan kaynak ithal eder, §Ybaşkente§! §Y10§! £GFX_resources_strip|6 ekler."
 SSB_combined_arms:0 "Birleşik Kuvvetler"
 SSB_combined_arms_desc:0 "Resmileşmiş bir ittifakla birlikte, ordularımızı birleştirmedeki son adımı atma ve birbirimizi savunabileceğimizden emin olma zamanı geldi."
 SSB_coordinate_military_production:0 "Etkimizi Genişlet"
 SSB_coordinate_military_production_desc:0 "İmparatorluk ve hakimiyetin büyük günleri geride kaldı, dünyanın geri kalanına kıyasla zayıf hale geldik. Ama artık yalnız değiliz, şimdi Sadabat Paktı ile birleşmiş olarak duruyoruz. Birlikte yeniden yükselebilir ve bu bölgenin yöneticileri olarak yerimizi alabiliriz."
 SSB_economic_cooperation:0 "Ekonomik İşbirliği"
 SSB_economic_cooperation_desc:0 "Her yönden gelen askeri devlerin tehdidi altında, Sadabat paktı arasındaki ekonomik işbirliği ihtiyacı giderek daha net hale geliyor. Birbirimize pazarımızı açmalı ve gümrük vergilerimizi düşürmeliyiz, böylece dünya güçlerine bağımlılığımızı azaltabiliriz."
 SSB_expand_afghanistans_military_infrastructure:0 "[AFG.GetAdjective] Çöl Eğitimi"
 SSB_expand_afghanistans_military_infrastructure_desc:0 "[AFG.GetNonIdeologyName] ordusunun çöl savaşı ve engebeli arazide nasıl hareket edileceği konusunda bolca deneyimi vardır. Tüm üye devletler bu bilgiden büyük ölçüde faydalanabilir."
 SSB_expand_iranian_oil_fields:0 "[PER.GetAdjective] Petrol İhracatı"
 SSB_expand_iranian_oil_fields_desc:0 "Dünya güçlerine bağımlılığımız çok güçlü hale geldi ve göze alamayacağımız bir risk oluşturuyor. Petrol konusunda kendi kendine yeterli olacağımızdan emin olmak için petrol kuyusu altyapımızı genişletmeliyiz."
 SSB_expand_irans_military_infrastructure:0 "[PER.GetAdjective] Askeri Altyapısını Genişlet"
 SSB_expand_irans_military_infrastructure_desc:0 "Birlik genelinde askeri endüstriyel kapasitemizi genişletmemiz gerekiyor ve herkes üzerine düşeni yapmalı. İran'da yeni bir ekipman fabrikası inşa edilecek."
 SSB_expand_iraqs_military_infrastructure:0 "[IRQ.GetAdjective] Kaynak İşleme"
 SSB_expand_iraqs_military_infrastructure_desc:0 "Daha güçlü uluslara bağımlı olmayı bırakmak için, mümkün olduğunda ticaretin sınırlarımız içinde gerçekleşmesini sağlamak amacıyla kendi kaynak üretimimizi genişletmeliyiz, böylece kendi kendine yeterliliğimizi artırabiliriz."
 SSB_expand_road_and_rail_connections:0 "Kara ve Demiryolu Bağlantılarını Genişlet"
 SSB_expand_road_and_rail_connections_desc:0 "Sadabat paktı giderek güçlendikçe, İstanbul'dan Kabil'e bir demiryolu inşa etmemiz kaçınılmazdır, böylece altyapımızı birbirine bağlarız."
 SSB_expand_turkeys_military_infrastructure:0 "[TUR.GetAdjective] Dağcı Kolordusu"
 SSB_expand_turkeys_military_infrastructure_desc:0 "[TUR.GetNameDefCap] dağlarla doludur ve sonuç olarak [TUR.GetAdjective] ordusu dağcı savaşında oldukça deneyimlidir. Bu bilgi ve teknolojiyi paktla paylaşmak herkes için faydalı olacaktır."
 SSB_expand_turkish_chromium_deposits:0 "[TUR.GetAdjective] Krom İhracatı"
 SSB_expand_turkish_chromium_deposits_desc:0 "Dünya güçlerine bağımlılığımız çok güçlü hale geldi ve göze alamayacağımız bir risk oluşturuyor. Krom konusunda kendi kendine yeterli olacağımızdan emin olmak için krom yataklarımızı genişletmeliyiz."
 SSB_faction_invite_tt:0 "§YTarafsız§! ideolojisine sahip Sadabat imzacı ülkelerini yeni ittifakımıza davet edeceğiz."
 SSB_flags_tt:0 "[PER.GetFlag][TUR.GetFlag][IRQ.GetFlag][AFG.GetFlag]"
 SSB_form_the_saadabad_alliance:0 "Tam bir ittifak önerisi"
 SSB_form_the_saadabad_alliance_desc:0 "Sadabat Paktı basit bir saldırmazlık paktı olarak başladı. Ortak askeri ve ekonomik gelişmeyle çok daha fazlası haline geldi ve kaynaklarımız birleştirildi, artık resmi bir Sadabat İttifakı kurmanın zamanı geldi."
 SSB_integration_of_our_infrastructure:0 "Altyapımızın Entegrasyonu"
 SSB_integration_of_our_infrastructure_desc:0 "Dünya çapında yükselen gerilimler ve her yönden süper güçlerle çevrili olmamızla birlikte, basit bir ekonomik ve askeri pakt artık yeterli değil. Altyapımızın tam entegrasyonunu tamamlamalı ve uluslarımız arasındaki tüm gümrük vergilerini kaldırmalı ve kaynaklarımızı birleştirmeliyiz."
 SSB_is_in_faction_tt:0 "Sadabat İttifakı'nın bir üyesi"
 SSB_is_leader_tt:0 "Sadabat Paktı'nın Lideri"
 SSB_joint_military_exercises:0 "Ortak Askeri Tatbikatlar"
 SSB_joint_military_exercises_desc:0 "Askeri eğitim sürecimizi birleştirmeye başlayacağız ve ordularımız arasındaki engeli düşürmek için birlikte çalışacağız, böylece yarı birleşik bir Sadabat Ordusu oluşturacağız."
 SSB_military_cooperation:0 "Askeri İşbirliği"
 SSB_military_cooperation_desc:0 "Büyük oyunun bir büyük güç tarafından boyunduruk altına alınmamızla sonuçlanma tehdidiyle karşı karşıyayken, Sadabat Paktı içindeki askeri işbirliği hiç bu kadar hayati olmamıştı. Savunmalarımızı birleştiremezsek, teker teker alt edilme riskiyle karşı karşıyayız."
 SSB_oil_2_tt:0 "Diğer pakt üyelerinden kaynak ithal eder ve şunları ekler:\n§Y4§! £GFX_resources_strip|4, §Y5§!£GFX_resources_strip|2, §Y6§!£GFX_resources_strip|4, §Y6§!£GFX_resources_strip|6 doğrudan §Ybaşkente§!."
 SSB_oil_tt:0 "[PER.GetName]'dan kaynak ithal eder, §Ybaşkente§! §Y10§! £GFX_resources_strip|1 ekler."
 SSB_resource_tt:0 "$SSB_flags_tt$$trade_cost_for_target_factor_tt$"
 SSB_saadabad_research_cooperation:0 "Sadabat Araştırma İşbirliği"
 SSB_saadabad_research_cooperation_desc:0 "Resmileşmiş bir ittifakla birlikte, mantıklı bir sonraki adım araştırma ve bilimsel yeteneklerimizi bir araya getirmek ve birleşik bir Bilim Komitesi oluşturmaktır."
 SSB_savak_protect_us:0 "SAVAK Hepimizi Korusun"
 SSB_savak_protect_us_desc:0 "SAVAK, karşı istihbarat yoluyla büyük ulusumuzu korumada harika bir iş çıkarıyor, karşı-istihbarat bilgimizi paylaşarak müttefiklerimize neredeyse hiçbir maliyet olmadan koruma sunma fırsatımız var."
 SSB_spirit_tooltip:0 "§YSadabat Paktı§!'nı değiştirir:"
 SSB_the_saadabad_pact:0 "Sadabat Paktı"
 SSB_the_saadabad_pact_desc:0 "Komşularımızla dost kalmak için kaybedecek hiçbir şeyimiz yok, kazanacak her şeyimiz var. Dostluğumuzu bir antlaşmayla resmileştirme fikri zaman zaman gündeme geldi ve bu dostluğun bir antlaşmayla kodlanmasını sağlamak için inisiyatif almanın tam zamanı."
