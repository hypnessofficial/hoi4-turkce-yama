l_english:
 CZE_a_modern_navy:0 "Modern Donanma"
 CZE_a_modern_navy_desc:0 "Artık denizcilik teknolojilerimizde ilerleme kaydettiğimize göre, sonunda modern ve yetenekli bir donanmaya sahip olduğumuzu söyleyebiliriz."
 CZE_a_strong_poland:0 "Güçlü Bir [POL.GetNonIdeologyName]"
 CZE_a_strong_poland_desc:0 "Doğu Avrupa'nın en güçlü ordularından birine sahip olan [POL.GetNameDef], değerli bir müttefik olma potansiyeline sahiptir."
 CZE_across_the_atlantic:0 "Atlantik'in Ötesinde"
 CZE_across_the_atlantic_desc:0 "Bir donanmanın etkili olabilmesi için okyanusun ötesine ulaşması gerekir. Donanmamızı uzun mesafelerde hareket edebilecek bir hale getirmeliyiz."
 CZE_administrative_chaos_tt:0 "§Y$CZE_enter_exile$§! tamamlandığında §YReichskommissariat için§! etkisi:"
 CZE_aggressive_foreign_policy:0 "Saldırgan Dış Politika"
 CZE_aggressive_foreign_policy_desc:0 "Kırılgan paktlara güvenme zamanı bitti; ciddi fedakarlıklar pahasına olsa bile güvenliğimizi korumak için kararlı bir şekilde hareket etmeliyiz."
 CZE_agrarian_reform:0 "Toprak Ofisini Yeniden Kur"
 CZE_agrarian_reform_desc:0 "Yakın zamanda dağıtılan toprak ofisi, esas olarak tarım arazilerinin yeniden dağıtılmasından sorumluydu; daha radikal önlemler için bu kurumu yeniden yapılandırmanın vaktidir."
 CZE_air_force_officer_recruitment:0 "Hava Kuvvetleri Subay Alımı"
 CZE_air_force_officer_recruitment_desc:0 "Ülke genelindeki havacılık kulüpleri, Hava Kuvvetleri Yedek Subay Okulu ile işbirliği içinde, uçuş kursları ve canlı atış egzersizleri sunarak kritik yedek subay ihtiyacını karşılamaktadır."
 CZE_air_intelligence:0 "Hava İstihbarat Kanadı"
 CZE_air_intelligence_desc:0 "Bir düşman hava kuvvetindeki uçak sayısını bilmek, hava savaşını kazanmanın kritik bir bileşenidir. Düşmanın hava kuvvetleri hakkında doğru bilgi, bölgede onlarla angajmana girerken kilit öneme sahiptir."
 CZE_air_training_abroad:0 "Yurt Dışında Hava Eğitimi"
 CZE_air_training_abroad_desc:0 "Bize dost olan ulusların hava birimlerine kursiyerler göndererek, farklı perspektiflerden değerli bilgiler ve geri dönüp hizmet ettiklerinde ilk elden deneyim kazanırız."
 CZE_airlift_soviet_support:0 "Sovyet Desteğini Havadan Taşı"
 CZE_airlift_soviet_support_desc:0 "[SOV.GetAdjective] müttefikimizle sınırımızın olmaması, [SOV.GetAdjective] birliklerini havadan taşıma gibi özgün bir fikre yol açtı. Bu kapsamda bir nakliye operasyonu daha önce hiç yapılmadı ancak bu, [SOV.GetAdjective] birliklerinin en azından karadan komşularımızın topraklarına girmek zorunda kalmayacağı anlamına gelir."
 CZE_align_catholic_parties:0 "ČSL'yi Hizala"
 CZE_align_catholic_parties_desc:0 "ČSL ve diğer katolik partiler, Avusturya-Macaristan imparatorluğundaki monarşist sistemin geleneksel destek tabanıydı; onları bu konuma geri çekmeye çalışmamızın zamanı geldi."
 CZE_align_nationalist_parties:0 "Çek Milliyetçi Partileri Hizala"
 CZE_align_nationalist_parties_desc:0 "Her ne kadar tüm [ROOT.GetAdjective]lara hitap etmeye çalışsak da, geleneksel Çek milliyetçi partilerinin siyasi sahnedeki en etkili partiler olduğu ve en kolay onlarla destek toplayabileceğimiz inkar edilemez."
 CZE_align_slovak_catholics:0 "Slovak Katolikleri Hizala"
 CZE_align_slovak_catholics_desc:0 "Katolik ve milliyetçi partilerin şu anda Slovakya'da çok fazla desteği var. Ciddi tavizler vermeden milliyetçilere hitap etmek zor olsa da, Katolik unsurları davamızın etrafında toplayabiliriz."
 CZE_align_with_germany:0 "[GER.GetNonIdeologyName] ile Hizalan"
 CZE_align_with_germany_desc:0 "[GER.GetNameDef]'teki yeni hükümet mutlaka daha az yayılmacı olmayabilir ancak kiminle ittifak kuracakları ve kimi kınayacakları konusunda daha pragmatik davranmaya istekli olabilirler. Biz de ilk grupta yer almak için çaba sarf etmeliyiz."
 CZE_allies_more_likely_to_defend_us_2_tt:0 "§YMüttefikler, Südet bölgesi konusundaki Alman yayılmacılığına karşı bizi desteklemeye önemli ölçüde daha yatkın olacaklar.§!"
 CZE_allies_more_likely_to_defend_us_3_tt:0 "§YMüttefikler, Südet bölgesi konusundaki Alman yayılmacılığına karşı bizi desteklemeye çok az daha yatkın olacaklar.§!"
 CZE_allies_more_likely_to_defend_us_tt:0 "§YMüttefikler, Südet bölgesi konusundaki Alman yayılmacılığına karşı bizi desteklemeye daha yatkın olacaklar.§!"
 CZE_ally_austria:0 "[AUS.GetName] ile İttifak Kur"
 CZE_ally_austria_desc:0 "Hükümeti sadece birkaç yıl önce Nazi haydutları tarafından neredeyse devrilen [AUS.GetNameDef], [ROOT.GetNameDef] ile işbirliği yapmanın potansiyel faydalarını anlamaya başlamalıdır."
 CZE_ally_hungary:0 "[HUN.GetName] ile İttifak Kur"
 CZE_ally_hungary_desc:0 "[CZE.GetNonIdeologyName]'ın doğuşundan bu yana [HUN.GetNonIdeologyName] ile ilişkilerimizi bozan çatışmalara rağmen, son zamanlarda değerli bir müttefik olma potansiyeli gösterdiler."
 CZE_ally_poland:0 "[POL.GetName] ile İttifak Kur"
 CZE_ally_poland_desc:0 "Hala hafızalarda olan Polonya-Sovyet Savaşı ve batılarındaki yükselen tehditle [POL.GetNameDef], kendisini bizimle benzer bir güvenlik arayışı içinde buluyor. [POL.GetAdjective] halkını tarafsızlığın onları kurtarmayacağına ve kaderlerini bizimle birleştirmeleri gerektiğine ikna etmeliyiz."
 CZE_ally_romania:0 "[ROM.GetName] ile İttifak Kur"
 CZE_ally_romania_desc:0 "[ROM.GetNameDefCap], gıda ve değerli petrol üreterek bölgedeki nadir kendine yeten uluslardan biridir. Onlarla aynı safta yer almak sadece birbirimizin kaynaklarına daha kolay erişmemizi sağlamakla kalmayacak, aynı zamanda düşmanlarımızın bize karşı savaş yürütmek için ihtiyaç duydukları hammaddelerden mahrum kalmasını sağlayacaktır."
 CZE_ally_russia:0 "[SOV.GetNonIdeologyName] ile İttifak Kur"
 CZE_ally_russia_desc:0 "Artık [SOV.GetNameDef] hükümeti bizimkiyle daha yakın bir çizgide olduğu için, önceki hükümetleriyle imzalanan belirsiz anlaşmayı genişletmeye çalışabiliriz."
 CZE_ally_with_moderate_socialists:0 "Ilımlı Sosyalistlerle İşbirliği Yap"
 CZE_ally_with_moderate_socialists_desc:0 "Her ülke komünizmi seçim yoluyla kucaklamaya veya [SOV.GetLeader]'a hayranlık beslemeye hazır değildir, bu nedenle daha ılımlı hareketlerle işbirliği yapmaktan kaçınmamalıyız."
 CZE_ally_yugoslavia:0 "[YUG.GetName] ile İttifak Kur"
 CZE_ally_yugoslavia_desc:0 "[YUG.GetNameDefCap] son zamanlarda ekonomisiyle mücadele etmiş olabilir ancak stratejik kaynakları ve konumu göz ardı edilemez."
 CZE_an_industrial_legacy:0 "Endüstriyel Bir Miras"
 CZE_an_industrial_legacy_desc:0 "Ülkemizin sanayisini daha önce imkansız olduğu düşünülen seviyelere çıkararak, nihayet endüstriyel mirasımızı kucaklayabilir ve talep edebiliriz. Biz rakipsiz bir sanayi güç merkeziyiz."
 CZE_anti_democratic_propaganda:0 "Antidemokratik Propaganda"
 CZE_anti_democratic_propaganda_desc:0 "Partimize destek oluşturmak için, Cumhuriyet'in önceki hükümetlerinin başarısızlıklarını vurgulamalı ve durumu nasıl daha iyi idare edebileceğimizi göstermeliyiz."
 CZE_anti_rearmament_propaganda:0 "Silahlanma Karşıtı Propaganda"
 CZE_anti_rearmament_propaganda_desc:0 "Başlıca rakibimiz olan [GER.GetNonIdeologyName]'nin faşist hükümetinin düşüşü, askeri yığınaklara karşı duruşumuzda başından beri haklı olduğumuzu iddia edebileceğimiz anlamına geliyor."
 CZE_anti_tank_development:0 "Antitank Topu Geliştirme"
 CZE_anti_tank_development_desc:0 "Giderek daha fazla ordunun daha büyük zırhlı kuvvetler konuşlandırmasıyla birlikte, antitank toplarımızdaki iyileştirmeler bir zorunluluktur. Tanklarla sahra toplarıyla başa çıkabilmek, düşmanı geri tutmakla onların içeri sızması arasındaki farktır."
 CZE_anti_tank_development_tech_tt:0 "§YAntitank İyileştirmelerini§! etkinleştirir\n§YTopçu§! Zırh Delme: §G+%5§!\n§YDestek Topçusu§! Zırh Delme: §G+%5§!\n§YAntitank§! Zırh Delme: §G+%5§!\n§YDestek Antitank§! Zırh Delme: §G+%5§!"
 CZE_apart_but_togather:0 "Ayrı Ama Beraber"
 CZE_apart_but_togather_desc:0 "Bölgelerimiz artık her zamankinden daha fazla özerkliğe sahip ancak biz de her zamankinden daha güçlüyüz. Her şeyi göğüslemeye hazırız."
 CZE_appeal_to_the_castle:0 "Şatoya Çağrı Yap"
 CZE_appeal_to_the_castle_desc:0 "Çekoslovakya'daki 'Şato', başkanlarını destekleyen geniş etkili kuruluşlar ve insanlar ağına atıfta bulunur. Bu güç de karşılığında başkanların sınırlı anayasal görevlerinin ötesinde daha fazla nüfuz sahibi olmalarına olanak tanır. Bu grubun desteğini istemek liderlik arayışımıza inanılmaz bir destek sağlayacaktır."
 CZE_assist_austria:0 "[AUS.GetName]'ı Koru"
 CZE_assist_austria_desc:0 "[AUS.GetNameDef]'i her türlü çatışmanın dışında tutmak milli güvenliğimiz için esastır. [AUS.GetAdjective] sınırı, savunmamızdaki en hassas noktalardan biridir. Ekonomileri de düşmanlarımız için değerli bir varlık olurdu; buna izin veremeyiz."
 CZE_austro_hungary_puppets:0 "Milli hedef gereksinimi tarafından hedef alınan her §Ytabi birim§!"
 CZE_bailout_moser:0 "Moser'i Kurtar"
 CZE_bailout_moser_desc:0 "Moser, büyük buhranın ardından zor zamanlar geçirdi. Sanayilerinin kurtarılması, fabrikaların yeniden açılması ve işten çıkarılan insanların işlerine geri dönmesi gerekiyor."
 CZE_balance_industrial_invevestments:0 "Sanayi Yatırım Çabalarını Dengele"
 CZE_balance_industrial_invevestments_desc:0 "[9.getname] ve [75.getname] dışındaki bölgeleri az gelişmiş bırakmak, ülkemizin on yılın başında bölünmeye başlamasının nedenlerinden biridir. Ülkemizin dış kısımlarındaki bölgeleri büyütmek, iki bölge arasındaki sanayi gelişmişlik farkını kapatmaya yardımcı olacaktır."
 CZE_balkan_union:0 "Birliği Genişlet"
 CZE_balkan_union_desc:0 "Bölgedeki daha fazla ulus artık komünizmi benimsemiş olsa da, güçlü bir işbirliği olmadan kendimizi büyük güçlere karşı koruyamayız; bir birlik bunu başarmanın en etkili yolu olacaktır."
 CZE_bastion_of_liberty:0 "Özgürlük Kalesi"
 CZE_bastion_of_liberty_desc:0 "Bu on yıl boyunca Ren'in doğusunda, Avrupa'daki birkaç gerçek çoğulcu ülkeden biri olduk. İnsanların bunu unutmadığından emin olalım."
 CZE_bend_the_bars:0 "$ITA_bend_the_bars$"
 CZE_bend_the_bars_desc:0 "$GER_european_confederation_desc$"
 CZE_bolster_domestic_construction:0 "Yerli İnşaatı Güçlendir"
 CZE_bolster_domestic_construction_desc:0 "Yerli inşaat sektörümüz, Büyük Savaş'ın sona ermesinden sonra bağımsız olduğumuzdan beri istikrarlı bir şekilde büyüyor. Bazı orta ölçekli inşaat müteahhitlerine ek yatırımlar sağlamak bu büyümeyi daha da güçlendirecektir."
 CZE_bop_to_fascism_support_tt:0 "§Y$CZE_bop_army_readiness$§! değerinin üçte birini faşizm desteğine ekler:"
 CZE_bribery_investigations:0 "Rüşvet Soruşturmaları"
 CZE_bribery_investigations_desc:0 "Askerlerin yemekleri ve muameleleri ile ilgili isimsiz bir mektup aldık. Bazı kanıtlar, belirli levazım subaylarının uygunsuz davranışlarına işaret ediyor. Bu durum ordumuza daha büyük zarar vermeden buna bir son vermeliyiz."
 CZE_bribery_investigations_remove_effect_tt:0 "Bu milli ruh, '§Y$CZE_bribery_investigations$§!' milli hedefi tamamlandığında kaldırılacaktır."
 CZE_bring_kramer_and_lobel_under_state_control:0 "Kramer & Löbl'ü Devlet Kontrolüne Al"
 CZE_bring_kramer_and_lobel_under_state_control_desc:0 "Kramer & Löbl'ü millileştirerek, temel elektrik malzemeleri ve radyo aksesuarlarının sürekli araştırılmasını ve zamanında teslim edilmesini sağlayabiliriz."
 CZE_build_1_dockyards_when_we_have_coast_tt:0 "Bir kıyı §Yeyaleti§! kontrol edildiğinde rastgele birinde anında §G1§! §YDeniz Tersanesi§! inşa edecektir."
 CZE_build_2_dockyards_when_we_have_coast_tt:0 "Bir kıyı §Yeyaleti§! kontrol edildiğinde rastgele birinde anında §G2§! §YDeniz Tersanesi§! inşa edecektir."
 CZE_build_3_dockyards_when_we_have_coast_tt:0 "Bir kıyı §Yeyaleti§! kontrol edildiğinde rastgele birinde anında §G3§! §YDeniz Tersanesi§! inşa edecektir."
 CZE_build_additional_rail_stations:0 "Ek Tren İstasyonları İnşa Et"
 CZE_build_additional_rail_stations_desc:0 "Yeni geliştirilen demiryolu altyapımızla birlikte, mevcut bazı tren istasyonlarımız kapasite artışını karşılayamıyor. Bunları iyileştirmek, insanları ve malları daha büyük hacimlerde olmaları gereken yerlere ulaştırma yeteneğimize büyük ölçüde yardımcı olacaktır."
 CZE_build_additional_rail_stations_focus_cost_tt:0 "§Y$CZE_devaluate_the_koruna$§! almak, bu milli hedefin süresini §G35§! güne indirecektir."
 CZE_build_off_old_ganz_danubius_designs:0 "Eski Ganz Danubius Tasarımları Üzerinden İnşa Et"
 CZE_build_off_old_ganz_danubius_designs_desc:0 "Ganz Danubius'un tasarımlarını yeniden ortaya çıkarmak, yeni kruvazör sınıfı gemiler inşa etmede faydalı olabilir. Bu tasarımlar hakkında bilgi sahibi insanlar hala sınırlarımız içinde yaşıyor."
 CZE_build_the_slapy_reservoir:0 "Slapy Barajı'nı İnşa Et"
 CZE_build_the_slapy_reservoir_desc:0 "Slapy yakınlarında bir baraj inşa etmek, bölgede daha fazla güç üretimine ve ekonomik fırsatlara yol açacaktır. Güç üretimindeki artış, bölgedeki sanayimizin büyümesine büyük ölçüde yardımcı olacaktır."
 CZE_cancel_anti_hungary_focus:0 "[GER.GetAdjective] müdahalesinden sonra geri adım atıldı"
 CZE_car_and_oil_rationing:0 "Araç ve Petrol Karneye Bağlama"
 CZE_car_and_oil_rationing_desc:0 "Özel motorlu taşıtların karneye bağlanması ve gerektiğinde onlara el konulması, otomotiv üretimini ve petrol kaynaklarını askeri ihtiyaçlara odaklamamızı sağlayacaktır."
 CZE_catholic_focus:0 "Katolik Odağı"
 CZE_catholic_focus_desc:0 "Hussitlerin [ROOT.GetAdjective] tarihinin ünlü bir parçası olmasına rağmen, birçoğu hala toplumdaki rollerini artırarak hitap etmemiz gereken Katolik inançlarına sahip."
 CZE_central_european_faction:0 "Orta Avrupa'nın Metbuu"
 CZE_central_european_faction_desc:0 "Diplomasiye çok fazla güvenmek yerine kendimizi güçlendirmeye odaklanmamıza rağmen, nüfuzumuzu aşırı genişletmememiz kritik önem taşıyor. Dışarıya bakmanın vakti gelmiş olabilir."
 CZE_change_the_narrative:0 "Anlatıyı Değiştir"
 CZE_change_the_narrative_desc:0 "Kilise şimdiye kadar devrimimizi desteklememiş olsa da, değerlerini bizimkilerle uyumlu hale getirmek yeni rejime destek oluşturmada önemli bir rol oynayabilir."
 CZE_claim_lands_of_the_bohemian_crown:0 "Bohemya Tacı Topraklarını Talep Et"
 CZE_claim_lands_of_the_bohemian_crown_desc:0 "Ulusumuz geçtiğimiz yüzyıllarda çeşitli imparatorlukların kıyısında yer aldığı için sınırlarımız sakinlerin iradesinden ziyade çatışmalara göre değişti; şimdi bu değişimleri düzeltme vaktidir."
 CZE_claim_ukraine:0 "Dostane Ukrayna Hükümeti Kur"
 CZE_claim_ukraine_desc:0 "Ukrayna, [SOV.GetNameDef]'in önemli bir parçasıdır; onu ele geçirerek güçlü bir tampon devlet oluşturabiliriz."
 CZE_closer_ties_with_the_moderate_germany_parties:0 "Ilımlı Südet Partilerini Topla"
 CZE_closer_ties_with_the_moderate_germany_parties_desc:0 "Bazı Südet partileri koalisyonumuzla çalışmaya ve hükümetle yol kat etmeye istekli. Bu bağları derinleştirelim."
 CZE_coalition_building:0 "Koalisyon Kurma"
 CZE_coalition_building_desc:0 "Seçimlerin ardından ortaya çıkan koalisyon, etkili bir şekilde işleyebilmesi için üyeleri arasında daha büyük bir birlik kurmalıdır. Jan Malypetr'in yakın zamanda başbakanlıktan emekli olması, Geniş Koalisyon üzerinde desteğini pekiştirmesi için daha fazla baskı oluşturdu."
 CZE_complete_capitulation:0 "Tam Teslimiyet"
 CZE_complete_capitulation_desc:0 "Teslim olmaktan başka ne seçeneğimiz var? Ufukta yaklaşan fırtınaya karşı koyamayız. Belki henüz elimizde koz varken [GER.getnamedef] ile bir anlaşma yaparsak, onların boyunduruğu altında bize biraz bağımsızlık bırakırlar."
 CZE_complete_reconciliation:0 "Tam Uzlaşma"
 CZE_complete_reconciliation_cooldown_flag:0 "Şu milli hedefi tamamladı: §Y$CZE_closer_ties_with_the_moderate_germany_parties$§!"
 CZE_complete_reconciliation_cooldown_flag_tt:0 "Mevcut gün sayısı: [?CZE_complete_reconciliation_cooldown_flag:days|Y0]"
 CZE_complete_reconciliation_desc:0 "Güven köprüleri kurmak için üzerimize düşeni yaptık. Vatandaşlarımızla uzlaşma zamanı geldi."
 CZE_complete_the_power_grid:0 "Elektrik Şebekesini Tamamla"
 CZE_complete_the_power_grid_desc:0 "Kırsal bölgelerimizdeki elektrik şebekesinin daha fazla çalışmaya ihtiyacı var. Ülkenin geri kalanının gerisinde kaldı ve daha fazla ekonomik ilerleme kaydedilmesine engel teşkil ediyor"
 CZE_comprise_with_the_carpathians:0 "Karpatlar ile Uzlaşma"
 CZE_comprise_with_the_carpathians_desc:0 "Rutenya bölgesi, [SLO.getnamedef]'e verdiğimiz federalleşme anlaşmasına benzer bir anlaşma için çabalıyor. Bunu yapmak bölgedeki ve [9.getname]'deki konumumuzu büyük ölçüde zayıflatacaktır. Onlarla bir anlaşma yapmak, taleplerine tamamen boyun eğmekten daha iyi olabilir."
 CZE_compromise_with_the_veteran_agrarian:0 "Gazi Tarımcılar ile Uzlaşma"
 CZE_compromise_with_the_veteran_agrarian_desc:0 "Tarımcı eski tüfekler, büyüyen şehirli seçmenle bağ kurma yolunda bir engel teşkil ediyor. Hedeflerimize ulaşmak için onlarla uzlaşmamız gerekiyor."
 CZE_concealment_efforts:0 "Gizleme Çabaları"
 CZE_concealment_efforts_desc:0 "Yer saldırı ve keşif uçaklarının yaygın kullanımı, artık kamuflaj ağlarını ve diğer gizleme taktiklerini bir zorunluluk haline getirdi. Birliklerimizin sahada iyi kamufle edildiğinden emin olmak için çabalarımızı güçlendirmemiz gerekiyor."
 CZE_concealment_efforts_tech_tt:0 "§Yİyileştirilmiş Kamuflaj Ağlarını§! etkinleştirir \n§YYaya Piyade (Orman)§!\n Savunma: §G+%10§!"
 CZE_confiscate_church_lands:0 "Kilise Topraklarına El Koy"
 CZE_confiscate_church_lands_desc:0 "Kilise, amaçları için gerekenden çok daha fazla toprak ve serveti kontrol ediyor. Tıpkı çiftçiler için yaptığımız gibi bu toprakların bir kısmını yeniden tahsis etmeliyiz."
 CZE_consolidate_mining_operations:0 "Madencilik Faaliyetlerini Birleştir"
 CZE_consolidate_mining_operations_desc:0 "Madencilik faaliyetlerimiz, bu şirketlerin yönetimleri daha verimli olacak şekilde birleştirilirse daha iyi optimize edilebilir. Bu, araştırmalarının ve mevcut madenleri genişletme çabalarının daha verimli olmasını sağlayacaktır."
 CZE_contact_henlein:0 "Henlein ile İletişime Geç"
 CZE_contact_henlein_cooldown_flag:0 "Şu milli hedefi tamamladı: §Y$CZE_no_compromise_with_the_sdp$§!"
 CZE_contact_henlein_cooldown_flag_tt:0 "Mevcut gün sayısı: [?CZE_contact_henlein_cooldown_flag:days|Y0]"
 CZE_contact_henlein_desc:0 "$CZE_konrad_henlein$ yıllardır hükümetimizin başına bela oldu. Ancak son uluslararası olayların ışığında, onunla bir diyalog başlatmanın vakti gelmiş olabilir."
 CZE_contact_henlein_focus_order_warning_tt:0 "Eğer bu §YMilli Hedef§!'i tamamladıktan sonra §Y$CZE_no_compromise_with_the_sdp$§! milli hedefini tamamlarsak, §Y$CZE_konrad_henlein$§! emekli edilecektir."
 CZE_contact_henlein_focus_warning_tt:0 "Eğer §Y$CZE_no_compromise_with_the_sdp$§! milli hedefini tamamlarsak, bu §YMilli Hedef§!'i seçebilmek için §Y350§! gün beklememiz gerekecek."
 CZE_contact_the_czech_and_slovak_legion:0 "Çek ve Slovak Lejyonu ile İletişime Geç"
 CZE_contact_the_czech_and_slovak_legion_desc:0 "Cesur [ROOT.GetAdjective]lar özgür bir [CZE.GetName] için mücadeleyi sürdürmek üzere [POL.GetNameDef] ve [FRA.GetNameDef]'e kaçtılar, bu güçlerle iletişime geçmeli ve onları koordine etmeliyiz."
 CZE_continue_armed_force_reform:0 "Silahlı Kuvvetler Reformuna Devam Et"
 CZE_continue_armed_force_reform_desc:0 "Silahlı kuvvetlerimizi planlanan programa göre modernize etmeye devam ederek ve askeri bölgeleri eyalet karargahlarımıza göre yeniden düzenleyerek, olası herhangi bir çatışmada daha iyi koordinasyon sağlayacağız."
 CZE_continue_avia_expansion:0 "Avia Genişlemesine Devam Et"
 CZE_continue_avia_expansion_desc:0 "Avia'ya yatırım yapmak, üretim kapasitelerini daha da güçlendirmek için gereken ek donanımı sağlar; bu, yüksek talep gören uçak gövdelerinin üretiminde daha yüksek verimlilik elde edilmesine yardımcı olabilir."
 CZE_continue_industrial_relocation_schemes:0 "Cephanelik Yer Değiştirme Planlarına Devam Et"
 CZE_continue_industrial_relocation_schemes_2_tt:0 "§RFabrikaların yeniden inşa edilmesi gerekecek.§!"
 CZE_continue_industrial_relocation_schemes_desc:0 "Milli güvenliğimiz uğruna, daha savunmasız fabrikalarımızı hava ve kara saldırılarından daha iyi korunacakları bölgelere taşımaya devam etmeliyiz. Böylesine kritik bir endüstrinin tehlikeye atılması riskini göze alamayız."
 CZE_continue_industrial_relocation_schemes_tt:0 "§Y1 Askeri Fabrika§! kaldırır."
 CZE_continue_the_central_bohemia_plan:0 "Orta Bohemya Planı"
 CZE_continue_the_central_bohemia_plan_desc:0 "Ülkemizin merkezindeki sanayi bölgelerini genişletme planımıza devam etmek, ölçek ekonomilerinden yararlanmamızı sağlayacaktır. Sanayimizi sınırlarımızdan uzak bir yerde genişletmek milli güvenlik açısından da akıllıca olacaktır."
 CZE_continue_with_snejdareks_plan_default:0 "Šnejdárek'in Planıyla Devam Et"
 CZE_continue_with_snejdareks_plan_dynamic:0 "[CZE_continue_with_snejdareks_plan]"
 CZE_continue_with_snejdareks_plan_dynamic_desc:0 "Etkili bir savunma ağının yürütülmesi, düşman birliklerinin beklenmedik sızmalarını önler. Koruma sağlar ve stratejik savunmadan saldırıya geçmek için güçlü bir temel oluşturur."
 CZE_continue_with_snejdareks_plan_no_snejdareks:0 "Statik Savunma Planıyla Devam Et"
 CZE_control_the_associations:0 "Dernekleri Kontrol Et"
 CZE_control_the_associations_desc:0 "[CZE.GetNonIdeologyName]'ın, aynı işi paylaşan insanlardan serbest zaman ilgi alanlarına veya spor derneklerine kadar pek çok kuruluşu var; bunları kontrol edin, toplumun büyük bir kısmını kontrol edersiniz."
 CZE_cooperate_with_the_allies:0 "Müttefiklerle İşbirliği Yap"
 CZE_cooperate_with_the_allies_desc:0 "Bölgede daha fazla istikrar sağlandığında, geleneksel müttefiklerimizle bağlarımızı yeniden kurmak için çaba sarf etmeliyiz."
 CZE_cooperate_with_the_sdp:0 "SdP ile İşbirliği Yap"
 CZE_cooperate_with_the_sdp_desc:0 "İstikrarsızlaştırıcı bir güç olsa da, SdP iktidar koalisyonuna dahil edilmek gibi uygun şekilde teşvik edilirse hizaya gelebilir."
 CZE_cooperate_with_tito:0 "Tito ile İşbirliği Yap"
 CZE_cooperate_with_tito_desc:0 "[YUG.GetNameDefCap] de tıpkı bizim gibi komünizmin pragmatik bir versiyonunu deniyor. Benzer şekilde çeşitli ve farklı halkları kızıl sancak altında birleştirmeye çalışıyorlar. Bu zorluklarla yüzleşirken askeri ve siyasi işlerde işbirliği yapmalıyız."
 CZE_cooperation_with_the_ussr:0 "[SOV.GetLeader] ile İşbirliği"
 CZE_cooperation_with_the_ussr_desc:0 "Parti liderliğindeki en ateşli [SOV.GetNameDef] destekçileri bile ülkeyi ziyaret ettikten sonra kolektifleştirmenin kusurlarının farkındalar. Öyle olsa bile, kolektifleştirmede onlarla işbirliği yapmak neyin yanlış neyin doğru gittiğini dikkatlice analiz edebileceğimiz ve [ROOT.GetNameDef] için en iyi nasıl uygulanacağını göreceğimiz anlamına gelir."
 CZE_country_leader_has_ideology_stalinism_tt:0 "Ülke lideri §Y$stalinism$§! ideolojisine sahip"
 CZE_create_a_secret_police_branch:0 "Gizli Polis Teşkilatı Kur"
 CZE_create_a_secret_police_branch_desc:0 "İstikrarı sağlamak için hem dış hem de iç düşmanlara karşı savunma yapmalıyız. Nüfusun yeni sisteme alışması zaman alacaktır, özellikle de sistem hala mükemmelleştirilme aşamasındayken."
 CZE_customs_union:0 "Gümrük Birliği"
 CZE_cut_carpathia_loose:0 "Karpatya'yı Kendi Haline Bırak"
 CZE_cut_carpathia_loose_desc:0 "Slovakya'nın artık federal bir devlet olmasıyla birlikte, Rutenya bölgesi de benzer bir anlaşma yapmayı umuyor. Bu mantıksız görünse de, Slovakya doğrudan kontrolümüz altında olmadan onları dizginlemeye çalışmak zor olurdu. Belki de sadece taleplerine boyun eğmeliyiz."
 CZE_czechoslovak_union:0 "Çekoslovak Birliği"
 CZE_czechoslovak_union_desc:0 "[CZE.GetNameDef]'te yerel özerklik artırılmalıdır, bu komünist sistemin yerel koşullara göre ayarlanmasına olanak tanıyacaktır."
 CZE_decision_unlock:0 "Kararı Açar: "
 CZE_decrease_autonomy_tier:0 "Her §Y$autonomy_dominion$§! veya §Y$autonomy_puppet$§! tabi birim bir özerklik seviyesi kaybedecek."
 CZE_deepen_ties_with_puppet_kingdoms:0 "Kukla Krallıklarla Bağları Derinleştir"
 CZE_deepen_ties_with_puppet_kingdoms_desc:0 "Artık net bir nüfuz alanına sahip olsak da, bu müttefik uluslardan en iyi şekilde yararlanmak için etkimizi daha da güçlendirmemiz gerekecek."
 CZE_deepend_ties_with_the_trademans:0 "Esnaflarla Bağları Derinleştir"
 CZE_deepend_ties_with_the_trademans_desc:0 "Esnaf Partisi, orta sınıf şehirli seçmenler arasında popülerdir. Onları güçlendirir ve onlarla birlikte çalışırsak, kırsal seçmen tabanımızı yabancılaştırmadan şehirli seçmenlerle bağ kurabiliriz."
 CZE_demand_corridor_to_ussr:0 "[SOV.GetAdjective]lara Bir Koridor Talep Et"
 CZE_demand_corridor_to_ussr_desc:0 "Eğer [POL.GetNameDef] bizimle işbirliği yapmazsa, [SOV.GetName] müttefiklerimize erişimi sağlamak için daha ciddi önlemler almalıyız."
 CZE_demand_guarantees:0 "Daha Güçlü Garantiler Talep Et"
 CZE_demand_guarantees_desc:0 "Mevcut anlaşmalarımıza ve ittifaklarımıza rağmen, ortaklarımızın sırf işlerine öyle geldiği için çaresizlik anımızda bizi terk etmeyeceklerinden emin olmamız gerekiyor. Bir garantiden daha güçlü bir şeye ihtiyacımız var."
 CZE_demand_katowice:0 "[762.GetName] Talebi"
 CZE_demand_katowice_desc:0 "[762.GetName] üzerinde kontrol sağlamak sadece eski sınırlarımızın restorasyonu anlamına gelmez, aynı zamanda [POL.GetAdjective] tarafının [72.GetName] üzerindeki taleplerini de zayıflatır."
 CZE_demand_overlordship_of_yugoslav_league:0 "[YUG.GetAdjective] Liginin Hakimliğini Talep Edin"
 CZE_demand_overlordship_of_yugoslav_league_desc:0 "Çok etnikli bir ulusta bazen yerel özerkliğin gerekli olduğunu [YUG.GetName] kadar biz de bilsek de, ittifakları artık kendini savunamayacak kadar zayıf. [YUG.GetNameDef]'e bunu tanımaları ve müdahale etmemize izin vermeleri için çağrıda bulunmalıyız."
 CZE_demand_regime_change_tt:0 "$CZE_decision_unlock$§YÜlkede Rejim Değişikliği Talep Et§!"
 CZE_demand_slovenia:0 "Slovenya'yı Talep Et"
 CZE_demand_slovenia_desc:0 "Slovenya geçmişte Avusturya İmparatorluğu'nun önemli bir parçasıydı ve artık bu imparatorluğun merkezinin kontrolünü ele geçirdiğimize göre, topraklarını bir kez daha geri almayı hedeflemeliyiz."
 CZE_demand_the_czech_corridor:0 "Çek Koridorunu Talep Et"
 CZE_demand_the_czech_corridor_desc:0 "Küçük Antant'ı düzgün bir İttifak haline getirirken, bir çatışma durumunda müttefiklerimize birlik kaydırmanın veya onlarınkini kabul etmenin çok zor olabileceği giderek daha açık hale geliyor. Büyük Savaş'tan sonra bir zamanlar teklif edildiği gibi, ulusumuzu ve [YUG.GetNameDef]'i birbirine bağlayan bir toprak şeridine sahip olmak güvenliğimizi artırabilir ve ticaretimizi koruma altına alabilir."
 CZE_demand_the_istrian_peninsula:0 "İstirya Yarımadası'nı Talep Et"
 CZE_demand_the_istrian_peninsula_desc:0 "[ROOT.GetNameDefCap]'in denize kıyısı olmaması ticaretimiz ve nüfuzumuz için çok uzun zamandır bir engel teşkil ediyor. Ekonomimizin komşu ülkelerin insafına kalmasını artık kabul edemeyiz ve Adriyatik'e erişim talep etmeliyiz."
 CZE_demanded_overlordship_HUN:0 "Macaristan Boyunduruk Altına Alındı"
 CZE_demanded_overlordship_ROM:0 "Romanya Boyunduruk Altına Alındı"
 CZE_democracies_willing_to_join_faction_tt:0 "§YDemokratik uluslar komünist fraksiyonumuza katılmaya daha istekli olacak§!."
 CZE_denounce_stalinism:0 "Stalinizmi Kına"
 CZE_denounce_stalinism_desc:0 "Komünizmin itibarı Stalin'in adaletsizlikleri yüzünden sonsuza dek lekelenmiştir; onunki gibi rejimler altındaki insanları özgürleştirmek için askeri önlemler almanın vakti geldi."
 CZE_department_two_expansion:0 "İkinci Departman"
 CZE_department_two_expansion_desc:0 "İstihbarat kanadımız olan 2. Departman'ın, bizi düşman casuslarından daha iyi korumak için daha fazla kaynağa ihtiyacı var. Bu aynı zamanda ajans içindeki belirli kanatların genişlemesine de yol açabilir."
 CZE_destabilize_potential_adversaries:0 "Potansiyel Rakipleri İstikrarsızlaştır"
 CZE_destabilize_potential_adversaries_desc:0 "Birlikte çalıştığımız sürgündeki komünistler, kendi ülkeleri hakkında casuslarımızın bile eşleşmekte zorlanabileceği bir anlayışa sahipler; vatanlarını kurtarmak için bir strateji belirlerken bu bilgiden tam olarak yararlanmalıyız."
 CZE_destroy_the_fascist_threats:0 "Faşist Tehditleri Yok Et"
 CZE_destroy_the_fascist_threats_desc:0 "[CZE_get_fascist_threats_desc]"
 CZE_destroy_the_fascist_threats_desc_backup:0 "Güvenliğimiz için, komşu ülkelerimizin er ya da geç bize yönelebilecek yayılmacı bir söylem izlememesi son derece önemlidir."
 CZE_destroy_the_fascist_threats_desc_enemy_ger:0 "Avrupa'da barışa yönelik en büyük tehdidin kim olduğunu hepimiz biliyoruz. [GER.getnamedefCAP] bir an önce durdurulmalı. Eğer başka kimse buna istekli değilse, bu işi biz yapabiliriz."
 CZE_devaluate_the_koruna:0 "Koruna'yı Devalüe Et"
 CZE_devaluate_the_koruna_desc:0 "Ekonomisinin büyük bir kısmında ihracata güvenen bir ülke olarak güçlü bir para birimine sahip olmak tehlikeli bir ekonomik pozisyondur. Para birimimizi zayıflatmak kısa vadeli acıya yol açabilir ancak uzun vadede bunu yapmış olmamız bizim için daha iyi olacaktır."
 CZE_develop_horska_artillery:0 "Horské Dělostřelectvo'yu Geliştir"
 CZE_develop_horska_artillery_desc:0 "Mevcut topçularımızı hafif ve parçalarına ayrılabilir olacak şekilde modifiye ederek, birliklerimizin dağlık ve tepelik arazilerde yeterli ateş gücüne sahip olmasını sağlayacağız."
 CZE_develop_horska_artillery_tech_tt:0 "§YHorská Topçusunu§! etkinleştirir\n§YTopçu (Dağ)§!\n  Saldırı: §G+%10§!\n  Hareket: §G+%10§!\n§YTopçu (Tepe)§!\n  Saldırı: §G+%10§!\n  Hareket: §G+%10§!"
 CZE_develop_sudetenland_resources:0 "Südetler Kaynaklarını Geliştir"
 CZE_develop_sudetenland_resources_desc:0 "Südetler, şu anda yararlanmadığımız pek çok kaynak yatağına sahip. Bölgede daha fazla maden inşasına yatırım yapmamak bir hata olur."
 CZE_diplomacy_path_shortcut:0 "Diplomasi"
 CZE_dismantle_poland:0 "[POL.GetNonIdeologyName] Yapısını Dağıt"
 CZE_dismantle_poland_desc:0 "Kendini savunma konusundaki yetersizliği artık iyice belirginleşen [POL.GetNameDef]'in düşmanlarımıza karşı güvenilir bir tampon devlet oluşturamayacağı açıktır. Bunun yerine kendi devletimizi güçlendirmek için harekete geçmeliyiz."
 CZE_diversify_airframe_production:0 "Gövde Üretimini Çeşitlendir"
 CZE_diversify_airframe_production_desc:0 "Havada işleri halletmek için sadece avcı uçaklarımıza güvenemeyiz. Diğer görev türlerini yerine getirmek için başka uçaklara ve daha büyük gövdelere ihtiyaç vardır."
 CZE_diversify_bata:0 "Bat'a'yı Çeşitlendir"
 CZE_diversify_bata_desc:0 "Bat'a, kaynak tedarik zincirimizde faydamıza kullanabileceğimiz büyük bir tüketici şirketidir. Elde edilmesi zor olan kritik malzemeleri sağlayarak bize yardımcı olabilirler."
 CZE_diversify_our_specialists:0 "Uzmanlarımızı Çeşitlendir"
 CZE_diversify_our_specialists_desc:0 "Uzmanlarımızı Horská birlikleri alanının ötesinde çeşitlendirmemiz gerekiyor. Savaş sadece dağlarda ve tepe başlarında verilmez."
 CZE_diversify_refinery_processes:0 "Rafineri İşlemlerini Çeşitlendir"
 CZE_diversify_refinery_processes_desc:0 "Kuyularımız çok çeşitli petrol yan ürünleri üretebilir. Tek sorun, bunu gerçekleştirmek için teknik bilgiye sahip olmamamızdır. Bunu nasıl yapacağımızı bulmak için araştırma zamanı yatırımı yaparsak, bu hayali gerçeğe dönüştürebiliriz."
 CZE_divide_germany:0 "Almanya'yı Böl"
 CZE_divide_germany_desc:0 "[GER.GetNameDef]'ten gelen tehdide tek başına karşı koymak zordur; bu nedenle [GER.GetAdjective] genişlemesinden benzer şekilde endişe duyan ve önleyici hareket etme iradesine sahip müttefikler aramalıyız."
 CZE_double_down_on_heavy_industry:0 "Ağır Sanayiye İki Kat Ağırlık Ver"
 CZE_double_down_on_heavy_industry_desc:0 "Müttefiklerimizle yaptığımız yeni anlaşmalar, silah endüstrimiz gibi en rekabetçi olduğumuz endüstrilere odaklanmamızı sağlayacak. Herhangi bir fazlalık daha sonra satılabilir."
 CZE_economic_path_shortcut:0 "Ekonomi"
 CZE_elevate_slovak_officers:0 "Slovak Subayları Yükselt"
 CZE_elevate_slovak_officers_desc:0 "Saflarda daha iyi temsil edilmelerini sağlamak için Slovakları yükseltmeye odaklanacağız. Slovak bölgelerinden gelen adaylar için bazı gereksinimleri düşürerek, gelecekte ordu içinde daha iyi bir uyum bekliyoruz."
 CZE_elevate_the_vsv:0 "Harp Akademisi'ni Yükselt"
 CZE_elevate_the_vsv_desc:0 "Ordunun beyni olmak muazzam bir ulusal ve devlet sorumluluğudur. Bu nedenle, Genelkurmay hizmeti, profesyonel eğitimin yanı sıra güvenilirlik, öz kontrol, nezaket ve karakter açısından en iyi niteliklere sahip subaylar gerektirir."
 CZE_eliminate_austrian_defeatists:0 "[AUS.GetAdjective] Bozguncuları Mağlup Et"
 CZE_eliminate_austrian_defeatists_desc:0 "[AUS.GetNameDefCap] devletini savunma iradesinden vazgeçti, kuşatılmış bir halde kalmadan önce hemen müdahale etmeliyiz."
 CZE_embrace_corporatism:0 "Korporatizmi Benimse"
 CZE_embrace_corporatism_desc:0 "Bazı şartlarını kabul edersek sanayicilerle yeniden silahlanmamızı başlatmaya yardımcı olmaları için pazarlık yapabiliriz. Onlara fayda sağlayacak bazı politika değişiklikleri fazlasıyla makul ve çıkarlarımızadır."
 CZE_emergency_measures:0 "Acil Durum Önlemleri"
 CZE_emergency_measures_desc:0 "Ulusumuzun karşı karşıya olduğu pek çok krizle başa çıkmak için acil durum önlemlerini devreye sokarak ve aynı zamanda bu önlemlerin bazılarını hükümetimize ideolojik olarak güvenilmez olabilecek kişileri daha yakından takip etmek için kullanarak; ulusumuzun karşılaştığı zorluklarla yüzleşmek için daha iyi bir donanıma sahip olacağız."
 CZE_enlarge_smaller_wells:0 "Küçük Kuyuları Genişlet"
 CZE_enlarge_smaller_wells_desc:0 "Boyutlarına rağmen, küçük kuyularımız şu anda ürettikleri az miktardaki petrolden çok daha fazlasını üretebilir. Tek yapmamız gereken bunu gerçekleştirmek için zaman ayırmak."
 CZE_enter_exile:0 "Sürgüne Git"
 CZE_enter_exile_desc:0 "Potansiyel müttefiklerin artık nihayet [GER.GetAdjective] timsahıyla savaşmasıyla, hükümetimiz egemenliğimizin geri dönüşü için hazırlanabilir ve savaşabilir."
 CZE_establish_a_armament_factory_in_uhersky_brod:0 "Uherský Brod Silah Fabrikasını Kur"
 CZE_establish_a_armament_factory_in_uhersky_brod_desc:0 "Uherský Brod Fabrikası, piyadeler ve uçaklar için otomatik silahlar yapma ve tasarlama konusunda uzmanlaşmış bir silah fabrikasıdır. Onu dünyadaki türünün en gelişmiş fabrikası yapmayı planlıyoruz."
 CZE_establish_air_defense_zones:0 "Hava Savunma Bölgeleri Kur"
 CZE_establish_air_defense_zones_desc:0 "Yeni uçaksavar bataryalarımızı kilit noktalara ve fabrikalara yerleştirebilir ve uçaksavar isabet oranımızı optimize etmek için bölgesel düzeyde iletişim düğümleri aracılığıyla Hava Savunma Bölgeleri kurabiliriz."
 CZE_establish_air_defense_zones_enable_tt:0 "§YHava Savunma Bölgelerini§! etkinleştirir"
 CZE_establish_air_defense_zones_tt:0 "Statik Uçaksavar isabet şansı faktörü: §G+%10§!"
 CZE_establish_the_fall_backlines:0 "Geri Çekilme Hatları Kur"
 CZE_establish_the_fall_backlines_desc:0 "Savunmamızın bazı yerlerde kırılacağı gerçeği konusunda gerçekçi olmalıyız. Eğer bu gerçekleşirse, hazır geri çekilme hatlarına sahip olmak zafer ile yenilgi arasındaki fark olacaktır."
 CZE_establish_the_fall_backlines_masterful_delay_tactic_tt:0 "\nTaktiği Etkinleştirir: §Y$tactic_masterful_delay$§!"
 CZE_establish_the_state_defense_guard:0 "Eyalet Savunma Muhafızlarını Kur"
 CZE_exchange_military_expertise:0 "Askeri Uzmanlık Değişimi"
 CZE_exchange_military_expertise_desc:0 "[SOV.GetNameDefCap], tıpkı önemli bir orduya sahip çoğu güç gibi, ordu taktikleri konusunda deneyler yaptı. Onlardan görüşlerini paylaşmalarını istemeliyiz, biz de karşılığında kendimizinkileri paylaşabiliriz."
 CZE_exchange_technology:0 "Araştırma Konusunda İşbirliği Yap"
 CZE_exchange_technology_desc:0 "Bol doğal kaynaklara rağmen Balkanlar, büyük güçlerin kârlı sömürgelerinden veya gelişmiş sanayisinden yoksundur. Bu nedenle, kendi uzmanlık alanlarımıza odaklanmamızı sağlamak için araştırma konusunda işbirliği yapmamız kilit önemdedir."
 CZE_expand_airfield_capacity:0 "Havalimanı Kapasitesini Artır"
 CZE_expand_airfield_capacity_desc:0 "3. Havacılık Departmanı, uçaklarımızı düzgün bir şekilde işletmek, depolamak ve onarmak için yeni havaalanları ve hangarların yanı sıra yeni kurulan filolarımız ve yer mürettebatımız için yatakhaneler planladı."
 CZE_expand_central_bohemian_mines:0 "Orta Bohemya Madenlerini Genişlet"
 CZE_expand_central_bohemian_mines_desc:0 "Ülkemizin merkezindeki madenler enerji güvenliğimiz için en önemli olanlardır. Bunları en kısa sürede genişletmeliyiz."
 CZE_expand_existing_armory_plants:0 "Mevcut Silah Fabrikalarını Genişlet"
 CZE_expand_existing_armory_plants_desc:0 "Mevcut bazı cephanelik konumlarını taşımak, uzun vadeli kazancı az olan maliyetli bir yatırım olacaktır. Mevcut konumlarımızı genişletmek, bu mevcut yerlerde üretimi ve araştırma-geliştirmeyi artırma fırsatları ve faydaları sağlayacaktır. Olası düşmanlar tarafından saldırıya uğraması daha kolay yerlerde olma riskine rağmen."
 CZE_expand_praga:0 "Praga Sözleşmeleri"
 CZE_expand_praga_desc:0 "Praga, yıllardır askeri endüstrimiz için çeşitli bileşenlerin kaynağı olmuştur. Daha fazla büyümelerine yardımcı olmak için onları ek sözleşmelerle ödüllendirmek mantıklıdır."
 CZE_expand_prf_science_facilities:0 "PrF'nin Bilim Tesislerini Genişlet"
 CZE_expand_prf_science_facilities_desc:0 "PrF'nin bilim tesisleri, şu an yaptıklarından daha büyük bir şey yapma fırsatı bekleyen parlak zekalardan oluşan bir orduyla dolu. Departmanı genişletmek ve onların hükümetle çalışmasını sağlamak, araştırmalarımızı iyileştirmek için iyi bir başlangıçtır."
 CZE_expand_skoda_offices:0 "Škoda Ofislerini Genişlet"
 CZE_expand_skoda_offices_desc:0 "Uluslararası ofislerimiz, silah satışlarımızı yönlendiren şeydir. Onları yeni lokasyonlara genişletmek mantıklı bir karardır."
 CZE_expand_the_aero_clubs:0 "Havacılık Kulüplerini Genişlet"
 CZE_expand_the_aero_clubs_desc:0 "Havacılık kulüpleri, ülkemiz için sürekli yetenekli pilot akışı sağlamada yararlılıklarını kanıtladılar; onları daha da genişletmeliyiz."
 CZE_expand_the_communist_press:0 "Komünist Basını Genişlet"
 CZE_expand_the_communist_press_desc:0 "Gazetemiz 'Kızıl Kanun', şu anda hiç gazete okumayanları bilgilendirmeye hizmet edebilir; tek gereken fon miktarını artırmaktır."
 CZE_expand_the_horska_divisions:0 "Horská Tümenlerini Genişlet"
 CZE_expand_the_horska_divisions_desc:0 "Ülkemiz çoğunlukla alçak tepelerden ve platolardan oluştuğu için, dağ harbi için özel olarak eğitilmiş askerlerimiz bu zorlu arazilerde hayati öneme sahip olacaktır."
 CZE_expand_the_land_department_of_vtu:0 "VTÚ Kara Departmanını Genişlet"
 CZE_expand_the_land_department_of_vtu_desc:0 "Askeri Teknik Enstitü'nün (VTÚ) kara departmanını genişleterek, gelecekteki teçhizatlarımız için araştırma çabalarını desteklemek üzere ek donanım ve deneme sahaları kazanacaklar."
 CZE_expand_the_river_monitor_fleet:0 "Nehir Monitör Filosunu Genişlet"
 CZE_expand_the_river_monitor_fleet_desc:0 "Nehir monitör filomuz Avrupa'nın en büyüklerinden biridir ve ordumuza iç bölgelerin savunmasında yardımcı olur. Onu genişletmek, bu görevi yapma yeteneklerini büyük ölçüde artıracaktır."
 CZE_expand_the_rome_protocols:0 "Roma Protokollerini Genişlet"
 CZE_expand_the_rome_protocols_desc:0 "Yeni hükümetimiz [GER.capital.GetCapitalVictoryPointName]'dan ziyade [ITA.capital.GetCapitalVictoryPointName]'daki hükümetle daha çok uyumlu. İkisi arasında Avusturya konusundaki anlaşmazlıklar varken, Roma Protokollerine katılmak [ITA.GetNameDef]'e [GER.GetNameDef]'e yönelmek yerine mevcut rotasında kalması için ihtiyaç duyduğu güveni verebilir."
 CZE_expand_trinec_ironworks:0 "Trinec Demirhaneleri"
 CZE_expand_trinec_ironworks_desc:0 "Trinec Çelik İşletmeleri kurulduğundan beri [72.getname]'de sanayinin devi olmuştur. Daha fazla yatırım bize kaynak üretiminde muazzam getiriler sağlayacaktır."
 CZE_expand_vitkovice_ironworks:0 "Vítkovické Demirhanelerini Genişlet"
 CZE_expand_vitkovice_ironworks_desc:0 "Vítkovické Demirhaneleri, [74.getname] içinde önemli bir demir tedarikçisidir. Genişletilmesi tesisin çıktısını büyük ölçüde artıracaktır."
 CZE_facilitate_a_strong_hungary:0 "Güçlü Bir Macaristan'a Olanak Sağla"
 CZE_facilitate_a_strong_hungary_desc:0 "Bağımsızlığından bu yana [HUN.GetNameDef] bizimle sarsıntılı ilişkilere sahip oldu. Ancak çatışmalar mayalanırken, onları davamıza dahil edebiliriz."
 CZE_facility_in_state_tt:0 "Eğer $STATE|Y$ bölgesinde başka bir §YDeneysel Tesis§! yoksa, $STATE|Y$ içerisinde §G1§! $FACILITY_TYPE|Y$ kazanacağız."
 CZE_feeding_the_alligator:0 "Timsahı Beslemek"
 CZE_feeding_the_alligator_desc:0 "[GER.getname]'nin Südet bölgesi üzerindeki planları ulusumuzun varlığına yönelik bir tehdittir. Belki de istediklerini onlara verirsek bizi rahat bırakırlar."
 CZE_fight_over_silesia:0 "Silezya İçin Savaş"
 CZE_fight_over_silesia_desc:0 "Silezya haklı olarak [ROOT.GetAdjective] toprağı olabilir ancak [66.owner.GetNameDef] ile topyekun bir savaş istenmeyen bir durumdur. Bu nedenle gücümüzü büyük çaplı bir savaştan ziyade geniş ölçekli sınır çatışmalarıyla göstermeliyiz. Eğer [66.owner.GetNameDef] Silezya savunması için savaşmaya isteksizse, onları bölgeden mahrum bırakabiliriz."
 CZE_finish_double_tracking_efforts:0 "Çift Hat Çalışmaları"
 CZE_finish_double_tracking_efforts_desc:0 "Bazı önemli ikincil demiryolu hatlarımızı çift hatta çıkarma çalışmalarını bitirmek, bu hatlarda daha fazla trafik kapasitesine sahip olmamızı sağlayacaktır. Bu da ikincil şehirlerimizden bazıları arasında daha iyi bağlantı sağlayacaktır."
 CZE_for_the_homeland:0 "Anavatan İçin"
 CZE_for_the_homeland_desc:0 "Askeriyemiz önümüzdeki zorluğa tam olarak hazır olduğundan, anavatanı savunmaya hazır olduğumuzu artık kesinlikle söyleyebiliriz. Önümüzdeki her türlü göreve hazırız."
 CZE_force_the_industrialists_hand:0 "Sanayicilerin Elini Zorla"
 CZE_force_the_industrialists_hand_desc:0 "Sanayiciler ve holdingler, etkili bir şekilde yeniden silahlanma yeteneğimizi çok uzun süre engellediler. Ulusun iyiliği adına, onlar adına seçme vaktimiz geldi."
 CZE_forced_administration_of_companies:0 "Şirketlerin Zorunlu Yönetimi"
 CZE_forced_administration_of_companies_desc:0 "Büyük denetime rağmen, bazı şirketler hala kontrolümüz dışında faaliyet gösteriyor. Onları gözetimimiz altına almaya zorlamanın vakti geldi."
 CZE_forgive_trading_debts:0 "Ticari Borçları Affet"
 CZE_forgive_trading_debts_desc:0 "Ekonomik istikrarsızlık ve Büyük Buhran, bazı potansiyel müttefiklerimizi bize olan ve ödemekte zorlandıkları borçlarla karşı karşıya bıraktı, bu da ilişkileri geriyor. Hükümet bu borçları silebilir ve bu hamleden etkilenen yerli şirketlerimizi tazmin edebilir."
 CZE_form_a_federation:0 "Federasyon Kurmak"
 CZE_form_a_federation_desc:0 "Bir Orta Avrupa federasyonu hayali artık ulaşılamaz değil. Sonunda bunu başaracağız ve demokrasinin devi olacağız. Birlikte, büyük güçlere kendi başımıza direnme gücüne sahip olacağız!"
 CZE_form_the_government_army:0 "Hükümet Ordusunu Kur"
 CZE_form_the_government_army_desc:0 "Ülkemizin başarılı olmasını istiyorsak, selefinin başarısızlıklarından ders alan yeni bir ordu kurmalıyız. Ayrıca liderliğinin hükümetle siyasi olarak daha uyumlu olmasını sağlamalıyız."
 CZE_form_the_state_defense_guard:0 "Devlet Savunma Muhafızlarını Kur"
 CZE_form_the_state_defense_guard_desc:0 "SOS'i kurarak, uzun sınırlarımızı koruma konusunda uzmanlaşmış bir organizasyon sağlıyoruz. Muhafız üyeleri askeri olarak organize edildikleri ve eğitildikleri için, her türlü sınır ihlaline karşı ilk savunma hattı olarak hizmet edeceklerdir."
 CZE_form_workers_brigades:0 "İşçi Milislerini Kur"
 CZE_form_workers_brigades_desc:0 "Özgürleştirdiğimiz işçiler mücadeleye katılmaya hazır olmalıdır. Eğitimli asker olmayabilirler ancak işlerine göre uzman olarak katkıda bulunabilirler."
 CZE_fort_path_shortcut:0 "Tahkimat Çalışmaları"
 CZE_free_tuka:0 "$CZE_vojtech_tuka$'yı Serbest Bırak"
 CZE_free_tuka_desc:0 "$CZE_vojtech_tuka$'nın hapis cezası bitti ve cezasını uzatmak için bir bahane bulmak yerine, onu zamanında serbest bırakıp hükümetimizde işe koşabiliriz. Bize karşı çalışmasındansa altımızda çalışması daha iyidir."
 CZE_full_faith_in_hacha:0 "Hácha'ya Tam Güven"
 CZE_full_faith_in_hacha_desc:0 "$CZE_emil_hacha$, halkımız nezdinde $CZE_emanuel_moravec$'den çok daha popüler ve saygındır. Yaptığı iş şüpheli olabilir ancak daha popüler bir figürün yerini dolduramazsınız."
 CZE_fund_vladimir_mandl_research:0 "Vladimir Mandl'ın Araştırmasını Fonla"
 CZE_fund_vladimir_mandl_research_desc:0 "$CZE_vladimir_mandl$ adında bir avukat roket teknolojisi fikrine hayran kalmış durumda. Onunla çalışır ve araştırmasını pratik teknolojiye dönüştürmesi için ihtiyaç duyduğu kaynakları sağlarsak, bu ortaklıktan büyük fayda sağlayabiliriz."
 CZE_german_nonagressionpact:0 "Haushofer-Krofta Paktı"
 CZE_german_nonagressionpact_desc:0 "[GER.GetNameDef] ile bir saldırmazlık paktı için müzakereler bir süredir devam ediyordu. Ancak [SOV.GetNameDef] içerisindeki istikrarsızlık belirtileri ve yeni yayılmacı planlardan sonra bunlar durdu. [GER.GetNameDef] şu anda diğer düşmanlarla meşgulken, bu görüşmeleri yeniden başlatmayı denemeliyiz."
 CZE_giant_of_central_europe_industry:0 "Sanayi Devi"
 CZE_giant_of_central_europe_industry_desc:0 "Daha önce imkansız olduğu düşünülen zirveler. Artık Avrupa'da bir sanayi devi olduk!"
 CZE_go_with_vojcechovskys_plan_default:0 "Luža'nın Planıyla Devam Et"
 CZE_go_with_vojcechovskys_plan_dynamic:0 "[CZE_go_with_vojcechovskys_plan]"
 CZE_go_with_vojcechovskys_plan_dynamic_desc:0 "Statik savunmaların dezavantajı manevra yapılamamasıdır. Bir kez delindiklerinde, artık saldırı amaçlı değil, sadece başlangıç konumu için kalıntılar olarak kullanılabilirler."
 CZE_go_with_vojcechovskys_plan_no_luza:0 "Aktif Savunma Doktrini"
 CZE_gottwald_faction:0 "Gottwald Fraksiyonu"
 CZE_gottwald_faction_desc:0 "Moskova'ya sonuna kadar sadık olan Klement Gottwald'ın Stalinist fraksiyonu, SSCB'nin imajında bir Çekoslovak devleti öngörüyor."
 CZE_grow_ckd_secondary_facilities:0 "CKD'nin İkincil Tesisleri"
 CZE_grow_ckd_secondary_facilities_desc:0 "CKD, elektrik jeneratörleri gibi bazı önemli sanayi ürünlerini üreten birçok küçük ikincil tesise sahiptir. Bu tesislerin genişletilmesi ağır sanayimizin büyümesine yardımcı olacaktır."
 CZE_grow_tatras_capabilities:0 "Tatra'nın Kabiliyetlerini Artır"
 CZE_grow_tatras_capabilities_desc:0 "Tatra'nın şu anki küçük tank departmanı bazı yeni üretim tasarımlarına sahip. Onlara ek kaynaklar sağlamak, zırh tasarımında ilerlemeler kaydetmeye devam etmelerine olanak tanıyacaktır."
 CZE_grow_the_anglo_czechoslovak_prague_credit_bank:0 "Anglo-Çekoslovak Bankası"
 CZE_grow_the_anglo_czechoslovak_prague_credit_bank_desc:0 "Anglo-Çek Kredi Bankası sanayimizin temel itici güçlerinden biri olmuştur. Onların fonları olmasaydı, şu anki büyük ihracat işimizi sürdüremezdik. New York'ta yeni şubeler açmak ve [ENG.GetNameDef] ile bağları derinleştirmek bankanın daha da büyümesini sağlayacaktır. Bu aynı zamanda [ENG.getname]'ye hayatta kalmamızda bir pay verecektir."
 CZE_guardian_of_central_europe:0 "Orta Avrupa'nın Koruyucusu"
 CZE_guardian_of_central_europe_desc:0 "Artık Orta Avrupa'da Demokrasinin denetçisi konumundayız. Kendi başının çaresine bakamayan uluslar için bir koruyucu olabilir ve demokrasinin dimdik ayakta durmasını sağlayabiliriz."
 CZE_hussite_legacy:0 "Hussite Mirası"
 CZE_hussite_legacy_desc:0 "Hussitler sadece Hristiyanlığın daha Protestan bir tarzını teşvik etmekle kalmadılar, aynı zamanda onlara karşı savaşan tiranların aksine, konuya dair diğer görüşlere karşı gösterdikleri hoşgörüyle de öne çıktılar."
 CZE_if_FRA_ally_tt:0 "§YFransa monarşist ise§! ve henüz başka kimseyle müttefik değilse etkileri:"
 CZE_if_POL_ally_tt:0 "§YGüçlü Bir Polonya§! tamamlanmışsa ve [POL.GetNonIdeologyName] tarafından garanti verilmesiyle sonuçlanmışsa etkileri:"
 CZE_if_cooperate_with_moderate_socialists_completed_tt:0 "§YIlımlı Sosyalistlerle İşbirliği Yap§! tamamlanmışsa etkileri:"
 CZE_improve_balkan_trade_relations:0 "Balkan Ticari İlişkilerini Geliştir"
 CZE_improve_balkan_trade_relations_desc:0 "Potansiyel Balkan müttefiklerini kazanmadaki en büyük varlığımız ekonomimizdir; potansiyel müttefiklerimizin ekonomik durumunu iyileştirmek için kaynak harcama isteğimizi göstermeliyiz."
 CZE_improve_the_current_officer_pool:0 "Mevcut Subay Kadrosunu Geliştir"
 CZE_improve_the_current_officer_pool_desc:0 "Üst komutanlıklar ile yerel birimler arasında denetim ve koordinasyon rollerini yerine getirmede elzem olduklarından, ordumuzun bel kemiği olma kapasitesini göstermiş personeli terfi ettireceğiz."
 CZE_increase_bauxite_imports:0 "Boksit İthalatını Artır"
 CZE_increase_bauxite_imports_desc:0 "Ülkemiz alüminyum açısından zengin olmayabilir ancak belirli rafineri süreçlerini kullanarak ve boksit ithalatımızı artırarak burada yerli olarak küçük bir miktar kaynak üretebiliriz. Bu, kaynak kıtlığının giderilmesine yardımcı olacaktır."
 CZE_increase_food_and_resource_imports:0 "Gıda ve Kaynak İthalatını Artır"
 CZE_increase_food_and_resource_imports_desc:0 "Yeni müttefiklerimizin güçlü bir tarım endüstrisine sahip olmasıyla, artık kendi endüstrimizi sübvanse etmek daha az gerekli. Kaynakları ucuza ithal etmek hem bize para kazandıracak hem de müttefiklerimizin ekonomisine destek verecektir."
 CZE_increase_funding_from_moscow:0 "[SOV.capital.GetCapitalVictoryPointName]'den Fonu Artır"
 CZE_increase_funding_from_moscow_desc:0 "[ROOT.GetCommunistParty] o kadar yetersiz fona sahip ki şu anda binasının masraflarını temsilcilerinin maaşlarıyla ödüyor. Büyümek için gazetemizi yaymak ve daha fazla üye çekmek adına [SOV.GetNameDef]'den fon artışı talep etmeliyiz."
 CZE_increase_military_aeronautical_institute_funding:0 "Askeri Havacılık Finansmanını Artır"
 CZE_increase_military_aeronautical_institute_funding_desc:0 "Havacılık Araştırma ve Test Kurumu (VZLÚ) için ek tesisler inşa ederek aerodinamik konusunda daha iyi içgörüler sağlanır, bu da uçak tasarımımızı daha da ilerletir ve geliştirir."
 CZE_infiltrate_collaborationist_organizations:0 "İşbirlikçilere Sız"
 CZE_infiltrate_collaborationist_organizations_desc:0 "Sürgündeki hükümete sadık [ROOT.GetAdjective]ların işbirlikçi örgütlerin başına getirilmesi kulağa tuhaf gelebilir ancak bu, onların faaliyetlerini baltalamak ve onlardan haberdar olmak için mükemmel bir yoldur."
 CZE_integrate_fortification_engineers:0 "Tahkimat Mühendislerini Entegre Et"
 CZE_integrate_fortification_engineers_desc:0 "Ordu tahkimat mühendislerimiz statik tahkimatlar inşa etmekle vakit geçirmediklerinde, savunmamızı geliştirmek için onları hızlıca cephe görevlerine kaydırabiliriz. Bu, cephe kuvvetlerinin birliklerimiz için daha iyi geçici savunma yapıları kurmasına yardımcı olacaktır."
 CZE_integrate_fortification_engineers_tech_tt:0 "§YEntegre Tahkimat Mühendislerini§! etkinleştirir\n§Yİstihkam Bölüğü§!:\nHendek Kazma §G+%10.00§!.\n§Y(Tahkimat)§!\n Savunma §G+%10.0§!"
 CZE_integrate_hungary:0 "Eski Avusturya Topraklarını Entegre Et"
 CZE_integrate_hungary_desc:0 "Artık önemli bir nüfuz alanı kurduğumuza göre, yeni büyütülen [HUN.GetName] ve diğer toprakların entegrasyonu, Avusturya-Macaristan sınırlarının [ROOT.GetAdjective] liderliği altında yeniden kurulmasını sağlayabilir."
 CZE_integrate_lost_territories:0 "Kaybedilen Toprakları Entegre Et"
 CZE_integrate_lost_territories_desc:0 "Bohemya Krallığı'nın tarihi toprakları Baltık Denizi'nden Adriyatik'e kadar uzanır; yeni mülklerimizi entegre ederken bu tarihe hitap etmenin vaktidir."
 CZE_integrate_nation_tt:0 "$CZE_decision_unlock$§YÜlkeyi Entegre Et§!"
 CZE_integrate_sudeten_germans:0 "Sudetenland'ı Entegre Et"
 CZE_integrate_sudeten_germans_desc:0 "Sudetenland nüfusu arasındaki bölünme hiç kimseye yardımcı olmuyor. Onların endişelerini ele almayı ve üzerlerinde çalışmayı hedeflemeliyiz. Kötü muamele iddialarına inanmak zor olacağından, bu tek başına her türlü bağımsızlık figürünü etkisiz bırakabilir."
 CZE_integrate_western_ukrainians:0 "Batı Ukraynalıları Entegre Et"
 CZE_integrate_western_ukrainians_desc:0 "[CZE.GetNameDef] Ukraynalılarına büyük ölçüde yardım ve özerklik teklif edildi; şimdi yeni kazanılan toprakları Ukrayna eyaletimize entegre etmeye çalışabiliriz."
 CZE_integrated_paramilitaries:0 "Yarı Askeri Grupları Entegre Et"
 CZE_integrated_paramilitaries_desc:0 "Ordu bu fikirden pek memnun olmayabilir ancak yarı askeri grupları ordumuza entegre etmek, onlara en çok ihtiyaç duyduğumuz anda bize artan bir yedek havuzu sağlayacaktır."
 CZE_intervene_in_the_ussr:0 "[SOV.GetAdjective] İç Savaşı'na Müdahale Et"
 CZE_intervene_in_the_ussr_desc:0 "[SOV.GetNameDef]'te bir kez daha huzursuzluk var ve bir zamanlar desteklediğimiz eski kraliyet ailesi geri dönmeyecek olsa da, daha dostane bir hükümet olasılığı göz ardı edilemez."
 CZE_invest_in_the_smaller_air_plants:0 "Küçük Hava Fabrikalarına Yatırım Yap"
 CZE_invest_in_the_smaller_air_plants_desc:0 "Yeni ve daha küçük uçak üreticilerine yatırım yapmak, yerleşik rakiplerimize gerekli rekabeti getirir; geniş üretim gereksinimlerimizi karşılamada yardımcı olabilirler."
 CZE_invest_in_vhht:0 "VHHT'ye Yatırım Yap"
 CZE_invest_in_vhht_desc:0 "VHHT, ülkemizdeki birçok farklı metal işleme tesisini bünyesinde barındıran bir şirkettir. Bunlara yatırım yapmak ve bunları genişletmek, ileride metal üretimimizin pek çok farklı alanını geliştirmemize yardımcı olacaktır."
 CZE_jachymov_uranium_mine:0 "Jáchymov Uranyum Madeni"
 CZE_jachymov_uranium_mine_desc:0 "Jáchymov'daki madenler uzun süredir uranyum ve diğer cevherler için bir kaynak teşkil ediyordu ancak fizikteki son gelişmelere kadar uranyumun pek bir kullanımı yoktu."
 CZE_joins_government_in_exile_tt:0 "§YSürgündeki Hükümet'e§! katılır"
 CZE_joint_equipment_designs:0 "Ortak Teçhizat Tasarımları"
 CZE_joint_equipment_designs_desc:0 "Hem [ROOT.GetNameDef] hem de [GER.GetNameDef] tank ve uçak tasarımında en ön saflarda yer alıyor ve her birimizin kendine has uzmanlıkları var; en iyi yaptığımız işe odaklanmaya devam edebilmek için bilgi paylaşımında bulunmalıyız."
 CZE_joint_stock_schemes:0 "Anonim Ortaklık Şemaları"
 CZE_joint_stock_schemes_desc:0 "Anonim ortaklık şemaları, geleneksel fon kaynaklarının eksik olduğu durumlarda ekonomik büyüme kaynağı olarak hizmet etmiştir. Bu taktiklerden yararlanmaya devam etmek ekonomimizde daha fazla büyümeye yol açacaktır."
 CZE_jozef_tiso_tt:0 "Danışman olarak §Y$CZE_jozef_tiso$§! atanır"
 CZE_keep_focus_on_weapon_exports:0 "Silah İhracatına Odaklanmaya Devam Et"
 CZE_keep_focus_on_weapon_exports_desc:0 "Büyük silah ihracat endüstrilerimiz bizi ekonomik depresyondan çıkaran şeydi. Bu gidişatı tersine çevirmek siyasi ve ekonomik açıdan tehlikeli olurdu. Şu anda en iyi hareket tarzı mevcut rotada kalmaktır. Zaten bize yönelik her türlü tehdit abartılıyor."
 CZE_kickstart_rapid_rearmanent:0 "Hızlı Yeniden Silahlanmayı Başlat"
 CZE_kickstart_rapid_rearmanent_desc:0 "Pek çok politikacı ve iş insanı bunu berbat bir karar olarak görebilir ancak yeniden silahlanmaya şimdi başlamamız gerekiyor. Etrafımızdaki ülkeler silahsızlanmıyor, aksine tam tersini yapıyorlar ve bu açık bir sır. Hala vaktimiz varken ordumuzu hazırlamalıyız."
 CZE_king_of_the_castle:0 "Kalenin Kralı"
 CZE_king_of_the_castle_desc:0 "Hükümetimizde iplerin kimin elinde olduğunu hepimiz biliyoruz. Büyük bir belirsizlik döneminde, numara yapmayı bırakıp $CZE_edvard_benesh$'in daha doğrudan liderlik etmesine izin vermenin vakti geldi. Ülkemizin güvenliği buna bağlı."
 CZE_kohler_faction:0 "Köhler Fraksiyonu"
 CZE_kohler_faction_desc:0 "Bruno Köhler fraksiyonu, başarılı bir komünist Çekoslovak devleti kurmak için burjuvazinin şiddet yoluyla devrilmesinin gerekli olduğuna inanıyor."
 CZE_legacy_of_the_kriegsmarine:0 "Kriegsmarine'in Mirası"
 CZE_legacy_of_the_kriegsmarine_desc:0 "Kısa bir süre önce büyük zırhlıların inşasına yardımcı olmuş biri olarak, bunu yapma yeteneği pekala mümkündür. Avusturya-Macaristan Kriegsmarine'inin inşasına yardımcı olan aynı fabrikaların mirasındadır."
 CZE_lessons_of_war:0 "Harp Dersleri"
 CZE_lessons_of_war_desc:0 "Artık bir emsal ile muharebe deneyimi kazanmış olarak, bu dersleri alabilir ve yüksek komutamızı geliştirmek için kullanabiliriz. Orduyla girilen gerçek angajmanlardan öğrenilen derslerin yerini hiçbir şey tutamaz."
 CZE_lessons_of_war_i_had_war_with_major_flag:0 "Büyük bir ülke ile savaştaydı"
 CZE_leverage_gunboat_experience:0 "Gançot Deneyiminden Yararlan"
 CZE_leverage_gunboat_experience_desc:0 "Gançot tasarımı konusundaki deneyimimiz muhriplerin yapımı için kullanılabilir. Mevcut uzmanlık tabanımız tasarım sürecini hızlandırmaya yardımcı olacaktır."
 CZE_leverage_sokol:0 "Sokol Hareketi"
 CZE_leverage_sokol_desc:0 "Sokol hareketi on yıllardır ülkemizdeki önemli bir organizasyon olmuştur. Kriz zamanlarında, ordumuz için yarı askeri eğitim ve acemi erler sağlamaya yardımcı olmaları için onlardan yararlanmalıyız."
 CZE_limited_cooperation:0 "[SOV.GetLeader] ile Sınırlı İşbirliği"
 CZE_limited_cooperation_desc:0 "İdeolojik olarak farklı olsak da, [SOV.GetNameDef] bile bir ortak olarak değerimizi anlayabilir ve gazetelerinde bizi kınasalar dahi bazı pragmatik anlaşmalarda yer alabilir."
 CZE_logistics_beyond_the_sudetes:0 "Südetler'in Ötesinde Lojistik"
 CZE_logistics_beyond_the_sudetes_desc:0 "Südet Dağları dışında muharebe operasyonları yürütmeyi umuyorsak, uzun mesafeli lojistiğin nasıl işlediğini öğrenmemiz gerekir. Sadece kendi bölgemizde faaliyet göstermekten çok farklıdır."
 CZE_logistics_beyond_the_sudetes_tt:0 "§Yİyileştirilmiş İkmal Depolarını§! etkinleştirir\n§YLojistik Bölüğü§!: İkmal Kullanımı: §G-%10§!"
 CZE_master_of_armaments:0 "Mühimmat Üstadı"
 CZE_master_of_armaments_desc:0 "Škoda Fabrikaları, Avusturya-Macaristan İmparatorluğu günlerinden beri sınırlarımız içindeki en büyük silah üreticisi olmuştur. Onların uzmanlığı ve deneyimi, ülkemizdeki endüstriyel holdingler arasında eşsizdir. Onları Mühimmat Üstadı unvanına yükseltmenin vakti geldi."
 CZE_mend_balkan_relations:0 "Balkan İlişkilerini Düzelt"
 CZE_merge_skodas_consumer_good_plants:0 "Škoda'nın Tüketim Malı Fabrikalarını Birleştir"
 CZE_merge_skodas_consumer_good_plants_desc:0 "Škoda'nın portföyünde merkezi olmayan çok sayıda küçük tüketim malı fabrikası var. Bu fabrikaların pek çok alanında üretimlerini optimize etmeye yardımcı olacaktır. Ayrıca genel olarak Škoda için bazı olumlu etkileri olabilir."
 CZE_merge_the_financial_and_state_guard:0 "Maliye ve Devlet Muhafızlarını Birleştir"
 CZE_merge_the_financial_and_state_guard_desc:0 "Devlet Savunma Muhafızlarının kurulmasıyla birlikte, mali muhafızlara artık ihtiyaç kalmadı. Onları Devlet Savunma Muhafızlarına dahil etmek, SOS'in gücünü hızlı bir şekilde artırmaya yardımcı olacaktır."
 CZE_merge_the_financial_and_state_guard_tt:0 "§YEntegre Mali Muhafızları§! etkinleştirir \n§YAskeri İnzibat§!: Can: §G+5§!."
 CZE_merge_the_oil_companies:0 "Petrol Şirketlerini Birleştir"
 CZE_merge_the_oil_companies_desc:0 "Petrol şirketlerimiz kendilerine pek öyle diyemezler. Hepsi birkaç kuyu etrafında kurulmuş küçük şirketlerdir. Bunları birleştirerek ve petrol endüstrisini devlet kontrolü altına alarak daha azıyla daha fazlasını başarabiliriz."
 CZE_merge_the_paramilitaries:0 "Yarı Askeri Grupları Birleştir"
 CZE_merge_the_paramilitaries_desc:0 "Yarı askeri gruplarımız birçok farklı gruba dağılmış ve bölünmüş durumda. Onlardan askeri olarak yararlanmayı umuyorsak, onları birleşmeye zorlamamız gerekecek."
 CZE_militarize_the_associations:0 "Dernekleri Militarize Et"
 CZE_militarize_the_associations_desc:0 "[CZE.GetNameDef]'in pek çok derneği, halk seferber edilmeden önce bile bir asker için gerekli becerileri öğreterek ulusun savunmasına katkıda bulunabilir."
 CZE_military_intelligence:0 "Askeri İstihbarat Kanadı"
 CZE_military_intelligence_desc:0 "Askeri istihbarat, bir istihbarat teşkilatının en önemli yönlerinden biridir. Bu alana daha fazla kaynak ayırmak önemli faydalar sağlayacaktır."
 CZE_military_path_shortcut:0 "Silahlı Kuvvetler"
 CZE_mobilize_the_reserves:0 "Yedekleri Seferber Et"
 CZE_mobilize_the_reserves_desc:0 "Sınırımızdaki gerginlik kötüleşiyor. Seferberlik kartlarımıza uygun olarak yedekleri ve önceden seçilmiş askeri uzmanları çağırmalıyız."
 CZE_modernize_trieste_designs:0 "Trieste Tasarımlarını Modernize Et"
 CZE_modernize_trieste_designs_desc:0 "Avusturya-Macaristan Donanması'ndan kalma küçük boyutlu zırhlı tasarımlarını kullanarak, bu gemi sınıfının nasıl inşa edileceği konusunda daha iyi bir görüşe sahip olacağız."
 CZE_moravecs_bohemia:0 "Moravec'in Bohemyası"
 CZE_moravecs_bohemia_desc:0 "$CZE_emil_hacha$'nın yeni hükümetimizi baltalamaya çalıştığına dair söylentiler dolaşıyor. Eğer mevcut koşullar altında başarılı olmayı ve büyümeyi umuyorsak, metbularımızın ideolojisiyle daha uyumlu bir liderliğe ihtiyacımız var."
 CZE_mutual_protection_agreement_with_switzerland:0 "[SWI.GetNonIdeologyName] ile Karşılıklı Koruma Anlaşması"
 CZE_mutual_protection_agreement_with_switzerland_desc:0 "Hem biz hem de [SWI.GetNameDef], topraklarımızın işgalinin karşılanamaz kayıplar olmadan imkansız olduğu bir durum için çalışıyoruz; işbirliği yaparak sadece savunma değil, aynı zamanda kararlı bir şekilde karşı taarruz yapacak sayılara sahip bir ordu kurabiliriz."
 CZE_national_defense_act:0 "Milli Savunma Kanunu"
 CZE_national_defense_act_desc:0 "Bu savunma kanunu, Yüksek Milli Savunma Konseyi'nin (NROS) denetimi altında, milletimizin egemenliğine, bütünlüğüne, birliğine ve güvenliğine yönelik her türlü tehdidi veya saldırıyı karşılamayı amaçlayan askeri veya diğer tüm önlemleri kapsar."
 CZE_nationalize_key_industries:0 "Bankaları ve Madenleri Millileştir"
 CZE_nationalize_key_industries_desc:0 "Madenler, endüstrimizin savaş teçhizatlarına dönüştürdüğü ham maddeyi sağlar. Kriz zamanında bu malzeme tedarikini sağlamak, finansçıların ve sanayicilerin ellerinden ziyade hükümetin ellerine bırakılsa daha iyidir."
 CZE_naval_aviation:0 "Deniz Havacılığı"
 CZE_naval_aviation_desc:0 "Uçak gemileri ve uçakları deniz savaşının geleceği gibi görünüyor. Deniz muharebesinin bu yeni alanlarına zaman ayırmalıyız."
 CZE_negotiate_sphere_of_influence:0 "Etki Alanını Müzakere Et"
 CZE_negotiate_sphere_of_influence_desc:0 "[ROOT.GetNameDef]'in askeri kaynaklarının [GER.GetAdjective] ittifakı için büyük değer taşıdığı yadsınamaz. Karşılığında bazı toprak kazanımları talep etmemiz hakkaniyetli olur."
 CZE_negotiations_with_the_autonomous_bloc:0 "Özerk Blok ile Müzakereler"
 CZE_negotiations_with_the_autonomous_bloc_desc:0 "Millet Meclisi'ndeki Beneş'in uşak sürüsüne yetki kaptırmayan bir koalisyon kurmak istiyorsak, Özerk Blok ile çalışmak zorundayız. Ancak onların tam desteğini almak ağır bir bedelle gelecektir."
 CZE_neutralize_the_hungarian_threat:0 "[HUN.GetAdjective] Tehdidini Etkisiz Hale Getir"
 CZE_neutralize_the_hungarian_threat_desc:0 "[HUN.GetNameDefCap], güneydeki potansiyel müttefiklerle olan ticaretimizin önünde bir engeldir ve eğer düşmanlarımızla aynı hizaya gelirse, Trianon Antlaşması'nın etkisine rağmen ordumuzun potansiyel olarak hayati bir kısmını meşgul edebilir."
 CZE_no_compromise_with_the_sdp:0 "SdP'yi Dışarıda Tutmaya Devam Et"
 CZE_no_compromise_with_the_sdp_cooldown_flag:0 "Şu milli hedefi tamamladı: §Y$CZE_contact_henlein$§!"
 CZE_no_compromise_with_the_sdp_cooldown_flag_tt:0 "Mevcut gün sayısı: [?CZE_no_compromise_with_the_sdp_cooldown_flag:days|Y0]"
 CZE_no_compromise_with_the_sdp_desc:0 "SdP'nin koalisyonumuza sunacağı hiçbir şey yok. Sadece siyasi gerilim yaratmaya ve hükümetimizin eylemlerini lekelemeye çalışıyorlar. İyi yönetim adına, herhangi bir koalisyonun dışında tutulmaya devam etmeliler."
 CZE_no_compromise_with_the_sdp_focus_warning_tt:0 "Eğer §Y$CZE_contact_henlein$§! milli hedefini tamamlarsak, bu §YMilli Hedef§!'i seçebilmek için §Y350§! gün beklememiz gerekecek."
 CZE_only_the_best_is_good_enough:0 "Sadece En İyisi Yeterince İyidir"
 CZE_only_the_best_is_good_enough_desc:0 "Škoda Fabrikaları her zaman sıkı bir çalışma etiği ve yenilikçi bir ruhla hareket etmiştir. Kurucularımız her zaman şu slogana bağlı kaldılar: 'Müşterilerimiz için sadece en iyisi yeterince iyidir!' Bu slogan son zamanlarda her zamankinden daha doğru bir anlam kazanıyor."
 CZE_opl_exercises:0 "OPL Egzersizleri"
 CZE_opl_exercises_desc:0 "Uçaksavar savunma (OPL) eğitimleri düzenleyerek, ordumuz gelişmiş koordinasyon ve koruma ile manevra pratiği yapabilir, böylece genel birlik hareketlerini ve güvenliğini artırabilir."
 CZE_outreach_to_the_western_powers:0 "Batılı Güçlere Daha Fazla Yakınlaşma"
 CZE_outreach_to_the_western_powers_desc:0 "Batılı demokrasiler arkamızda olduklarını söylüyorlar ancak en çok ihtiyaç duyulduğu anda sözlerinin eyleme dönüşeceğinden emin olmak için onlarla daha fazla yol kat etmemiz gerekiyor."
 CZE_peace_on_our_time:0 "Dönemimiz İçin Barış"
 CZE_peace_on_our_time_desc:0 "Avrupa uluslararası ilişkilerinde çok uzun süredir bir kenara itildik. Artık durum böyle olmayacak! Kendi ayaklarımızın üzerinde durabilir ve şartlarımızı kendimiz belirleyebiliriz. İster savaş olsun, ister barış."
 CZE_petition_the_nobles:0 "Soylulara Dilekçe Ver"
 CZE_petition_the_nobles_desc:0 "[ROOT.GetNameDef]'in soylu sınıfının artık tanınan unvanları olmayabilir ancak hala [ROOT.GetAdjective] toplumunun etkili bir parçasıdırlar; onların desteği bize daha fazla destek toplamak için gereken hem meşruiyeti hem de kaynakları verecektir."
 CZE_placate_benes_faction:0 "Beneš Fraksiyonuna Boyun Eğ"
 CZE_placate_benes_faction_desc:0 "$CZE_milan_hodza$, Dışişleri Bakanı olarak geçirdiği dönemin berbat geçtiği gerçeğiyle yüzleşmeli. $CZE_edvard_benesh$, Dışişleri görevinden vazgeçtiği sürece Tarımcılar içindeki destekçileriyle birlikte gelmeye ve $CZE_milan_hodza$'nın Başbakanlık konumunu güçlendirmeye hazır."
 CZE_poland_alliance_monarchist:0 "[POL.GetNonIdeologyName] ile Anlaşma"
 CZE_poland_alliance_monarchist_desc:0 "$CZE_ally_poland_desc$"
 CZE_political_path_shortcut:0 "Siyaset"
 CZE_power_to_the_military:0 "Gücü Orduya Ver"
 CZE_power_to_the_military_desc:0 "Ulusun savunmasında hiçbir kaynağın esirgenemeyeceği açıktır. Bu durum, iktidardakilerin ordunun ihtiyaçlarını anlamasını kritik hale getiriyor ve bunu sağlamanın askeri bir hükümetten daha iyi bir yolu yok."
 CZE_powerhouse_of_europe:0 "Avrupa'nın Güç Merkezi"
 CZE_powerhouse_of_europe_desc:0 "Sanayimiz şu anda dünyanın kıskandığı bir noktada. Artık enerji sektörümüzün onu düzgün bir şekilde besleyebildiğinden emin olmalıyız."
 CZE_prague_protocols:0 "Prag Protokolleri"
 CZE_prepare_for_exile:0 "Sürgün İçin Hazırlan"
 CZE_prepare_for_exile_desc:0 "Devlet, siyasi liderlerimizin yurt dışına kaçma ve sürgünde bir hükümet kurma çabalarına gizlice yardım etmelidir."
 CZE_pressure_romania:0 "Romanya'ya Baskı Yap"
 CZE_pressure_romania_desc:0 "[ROM.GetNameDefCap], düşmanlarımızla hizalanırsa ciddi bir tehdit oluşturabilir, muhtemelen [SOV.GetNameDef] ile olan bağlantımızı bozabilir veya düşmanlarımıza değerli petrol sağlayabilir. [SOV.GetAdjective] desteğiyle, onları savaşsız safımıza çekmek için yeterli bir tehdit oluşturuyoruz."
 CZE_pro_rearmament_propaganda:0 "Yeniden Silahlanma Yanlısı Propaganda"
 CZE_pro_rearmament_propaganda_desc:0 "Daha merkezi bir hükümete desteği artırmak için, etrafımızdaki dünyada şu anki kırılgan durumu vurgulamalıyız. Bu aynı zamanda halkı gerektiğinde orduyu güçlendirme planlarını desteklemeye motive etmeye yardımcı olacaktır."
 CZE_proclaim_the_restoration_of_bohemia:0 "Bohemya Krallığı'nın Restorasyonunu İlan Et"
 CZE_proclaim_the_restoration_of_bohemia_desc:0 "Eski sınırlarımız restore edildiğinde, mirasımızı yeniden talep edebilir ve yeni topraklarımızı entegre etmeye odaklanabiliriz."
 CZE_profit_off_the_spanish_civil_war:0 "İspanya İç Savaşı'ndan Kar Et"
 CZE_profit_off_the_spanish_civil_war_desc:0 "İspanya İç Savaşı büyük güçler için bir vekalet savaşına dönüşüyor. Cesur birliklerimizin hayatını böylesine bir çatışmaya karışarak riske atmamalıyız. Bunun yerine, silah satarak (potansiyel olarak her iki tarafa da) sanayimizin gelişimini finanse etmek için mükemmel bir fırsat."
 CZE_projekt_l_52:0 "L 52 Projesi"
 CZE_projekt_l_52_desc:0 "Jet motoru teknolojisi askeri uçakların geleceğidir. Teknoloji şu anda hala biraz ham, ancak özel bir proje geliştirmek ve bunun için amaca yönelik bir gövde tasarlamak için zaman ayırırsak, eğrinin önünde kalabiliriz."
 CZE_promote_moravec_writings:0 "Moravec'in Yazılarını Teşvik Et"
 CZE_promote_moravec_writings_desc:0 "Moravec'in 'Askerler ve Zaman' ile 'Devlet Savunması' adlı eserleri çok çelişkili tepkilere yol açsa da, son yayınlanan 'Devletimizin Orta Avrupa'daki Askeri Önemi' tüm Avrupa basını tartışıldı. Onu, savunma politikası ve askeri tarih meselelerinde tartışmasız bir uzman olarak çalışmalarına devam etmesi için teşvik etmeliyiz."
 CZE_promote_urbanization:0 "$ARG_promote_urbanization$"
 CZE_promote_urbanization_desc:0 "Artık verimli komün çiftlikleri kurduğumuza göre, kırsal nüfusun bir kısmını şehirlere çekmek ve oradaki üretkenliği artırmak için programlar başlatabiliriz."
 CZE_propose_unification_tt:0 "$CZE_decision_unlock$§YÜlkeyi Çekoslovakya Birliği'ne Davet Et§!"
 CZE_protect_neutrality:0 "Tarafsızlığı Koru"
 CZE_protect_neutrality_desc:0 "Büyük Savaş, düşmanın hedefindeyken tarafsız kalmaya çalışmanın boşuna olduğunu açıkça ortaya koydu. Bu ulusları korumak, düşmanlarımızı genişlerken bölüp yönetmelerine izin vermek yerine iki cepheli bir savaşa zorlamak anlamına gelir."
 CZE_purge_two_random_commanders_tt:0 "İki rastgele komutan tasfiye edilecek."
 CZE_raider_lineage:0 "Akıncı Soyu"
 CZE_raider_lineage_desc:0 "Avusturya-Macaristan Donanması'nda görev yapmış eski subaylardan gelen bir akıncı soyumuz var. Bu deneyimden yararlanmalıyız."
 CZE_raise_more_industrial_funds:0 "Daha Fazla Sanayi Fonu Topla"
 CZE_raise_more_industrial_funds_desc:0 "Avusturya-Macaristan döneminden günümüze sanayi, ulusumuzun kalbi olmuştur. Gerekli bütçe ve fon sağlanarak, bu sorunlu Avrupa'da gelişmeye devam edecektir."
 CZE_rally_against_germany:0 "[GER.GetNonIdeologyName]'a Karşı Toplan"
 CZE_rally_against_germany_desc:0 "Çekoslovakyalılar bağımsızlıkları için yiğitçe savaştılar ve şimdi bu bağımsızlığı korumak için tüm halka çağrıda bulunmalıyız."
 CZE_rapid_response_divisions:0 "Hızlı Tümen"
 CZE_rapid_response_divisions_desc:0 "Yabancı ordular, düşmandan daha hızlı yeniden mevzilenme yeteneğine sahip mobil bir birimin etkisini göstererek potansiyelini vurguladı. Değerlendirme için benzer birimler kurabiliriz."
 CZE_reach_out_for_military_assistance:0 "Askeri Yardım İçin Ulaş"
 CZE_realign_the_church:0 "Devlet Ateizmi"
 CZE_realign_the_church_desc:0 "Din, çok uzun süredir [CZE.GetAdjective] halklarını bölen bir unsur olmuştur. Daha birleşik bir toplum yaratmak için eğitim ve haber gibi devlet meseleleri üzerindeki etkisini azaltmalıyız."
 CZE_realize_motorway_proposals:0 "Otoyol Önerilerini Gerçekleştir"
 CZE_realize_motorway_proposals_desc:0 "Hükümetimize, sınırlarımız içindeki karayolu bağlantısını büyük ölçüde iyileştirecek bazı otoyol önerileri sunuldu. Bu öneriler doğrultusunda hareket etmeli ve bunları gerçeğe dönüştürmeliyiz."
 CZE_realize_the_polish_czechoslovak_confederation:0 "Bir Konfederasyon Gerçekleştir"
 CZE_realize_the_polish_czechoslovak_confederation_desc:0 "Yiğitçe mücadelelerine rağmen [POL.GetNameDef] mağlup oldu. Hükümetleri şu an sürgündeyken, bizimle bir birlik kurma fikirleri ortaya çıktı. Hükümetleri bizimkiyle birleştiğinde, [POL.GetAdjective] halkını bu yeni devlete toplayabilir ve ortak vatanımızı kurtarmak için koordineli bir çaba sarf edebiliriz."
 CZE_rearmed_and_retooled:0 "Yeniden Silahlanmış, Yeniden Donatılmış"
 CZE_rearmed_and_retooled_desc:0 "Mevcut ağır tank şasimiz modernizasyon kapasitesi gösteriyor. Zırhlı kolordumuzun gelecekteki genişlemesini karşılamak için bu yönü keşfetmeye devam etmeliyiz."
 CZE_reassure_the_army:0 "Orduya Güven Ver"
 CZE_reassure_the_army_desc:0 "Ordu, son kararlarımız ve hükümet politikalarımız konusunda geriliyor. Hükümet ne derse desin ya da ne yaparsa yapsın, onların yanında olduğumuza dair onlara güven vermenin vakti geldi."
 CZE_recon_in_force:0 "Zorlu Keşif"
 CZE_recon_in_force_desc:0 "Keşif birimlerimizin düşman savunmasını yoklarken onlarla temas kurması, istihbarat toplamak için paha biçilemez bir yoldur."
 CZE_recon_in_force_tech_tt:0 "§YZorlu Keşif§! özelliğini etkinleştirir \n§YKeşif§!: Can: §G+5§!\nKeşif: §G+%10.0§!."
 CZE_recruit_communist_exiles:0 "Komünist Sürgünleri Safına Kat"
 CZE_recruit_communist_exiles_desc:0 "[ROOT.capital.GetCapitalVictoryPointName] uzun zamandır sürgündeki devrimciler için güvenli bir sığınak oldu, yeni hükümetimiz bu yabancı radikallerden faydalanabilir."
 CZE_recruit_communist_generic_general_tt:0 "Komünist bir general kazanır."
 CZE_recruit_ideologically_aligned_generals:0 "İdeolojik Olarak Güvenilir Generaller Safına Kat"
 CZE_recruit_ideologically_aligned_generals_desc:0 "Eğitim programlarımızı, orduyu yeni değerlerimizi anlayan yeni adaylarla zenginleştirecek şekilde ayarlama zamanı geldi."
 CZE_redirect_the_fortification_councils_funds:0 "Tahkimat Konseyi Fonlarını Yeniden Yönlendir"
 CZE_redirect_the_fortification_councils_funds_desc:0 "Bu tahkimat programları ekonomimiz üzerinde büyük bir yük. Bu fonlar farklı programları finanse etmek için daha iyi kullanılabilir. Zaten ordunun daha fazla savunmaya ihtiyacı yok, ellerinde bolca var."
 CZE_redouble_tank_development_efforts:0 "Tank Geliştirme Çabalarını İkiye Katla"
 CZE_redouble_tank_development_efforts_desc:0 "Mevcut hafif tank tasarımımız, Avrupa'daki diğer zırh kullanıcılarınınkilerle karşılaştırıldığında geliştirilebilir durumda. Onlarla aynı seviyede olduğumuzdan emin olmak için çabalarımızı ikiye katlamalıyız."
 CZE_reduce_divided_nation_cost_tt:0 "Çoğu §YParçalanmış Bir Ulus§! kararının maliyetini ve süresini azaltır."
 CZE_reform_the_naval_detachment:0 "Deniz Birliğini Yeniden Kur"
 CZE_reform_the_naval_detachment_desc:0 "Deniz Birliği, orduya dahil edilmesinin daha uygun olduğu düşünüldüğü için yakın zamanda dağıtılmıştı. Ancak son olaylar, onun yeniden kurulmasını bir zorunluluk haline getirdi."
 CZE_refused_exile:0 "[ROOT.GetName] için ev sahipliğini reddetti"
 CZE_rehabilitate_the_army:0 "Orduyu Rehabilite Et"
 CZE_rehabilitate_the_army_desc:0 "[CZE.GetAdjective] ordusunun çoğu generali, en belirgin şekilde iç savaşlarında Sovyetlere karşı savaşan Çekoslovak Lejyonu'nun gazileridir. Yeni [CZE.GetAdjective] hükümetine sadakatlerini sağlamak gerekecektir."
 CZE_reintegrate_cross_border_rail_connections:0 "Sınır Ötesi Demiryolu Bağlantılarını İyileştir"
 CZE_reintegrate_cross_border_rail_connections_desc:0 "Komşularımızla olan demiryolu bağlantılarını iyileştirmek, onların sempatisini kazanmak için iyi bir yoldur. Özellikle de aramızdaki ekonomik bağları büyütmeye çalışıyorsak."
 CZE_reintegrate_cross_border_rail_connections_flag:0 "Sınır Ötesi Demiryolu Bağlantıları İyileştirildi"
 CZE_reorient_the_broad_coalition:0 "Geniş Koalisyonu Yeniden Yönlendir"
 CZE_reorient_the_broad_coalition_desc:0 "Geniş koalisyon uzun yıllardır hükümetimizdeki lider blok olmuştur. Kapsadığı çeşitli siyasi partiler, koalisyonun yönetilmesini giderek zorlaştırdı. Bakanlık politikalarının yeniden yönlendirilmesinin zamanı çoktan geldi."
 CZE_restart_naval_gun_production:0 "Deniz Topu Üretimini Yeniden Başlat"
 CZE_restart_naval_gun_production_desc:0 "Škoda Works, Avusturya-Macaristan İmparatorluğu içindeki en büyük deniz topu tasarımcısı ve üreticisiydi. Üretimin yeniden başlatılması, yerli deniz üretimini canlandırmak için fırsatlar yaratacaktır."
 CZE_restart_naval_gun_production_tt:0 "§YŠkoda Önceliği§! Denizcilik Odağı §YAktif§! olur"
 CZE_restore_noble_titles:0 "Soyluluk Unvanlarını İade Et"
 CZE_restore_noble_titles_desc:0 "Cumhuriyet kurulduğunda daha önce dağıtılmış olan soyluların unvanlarını, işbirliklerini ödüllendirmek amacıyla iade etme zamanı geldi. Bu aynı zamanda [ROOT.GetAdjective] devleti için defalarca savaşan gazi subaylar gibi kahramanlara onursal unvanlar vermemizi sağlayacaktır."
 CZE_restore_the_austro_hungarian_customs_union:0 "İmparatorluğun Gümrük Birliği'ni Geri Getir"
 CZE_restore_the_austro_hungarian_customs_union_desc:0 "Avusturya-Macaristan imparatorluğunun inkar edilemez avantajlarından biri, endüstrimiz için sınırlı ticari engellerdi; bu birliği geri getirmek, eski kurucu ülkeleri nüfuz alanımıza sokmak için ilk adım olacaktır."
 CZE_restore_the_monarchy:0 "Monarşiyi Geri Getir"
 CZE_restore_the_monarchy_desc:0 "Yeni bir sisteme verilen destek sağlandığında, rafine edilmiş fikri halka sunma zamanımız geldi. Seçilmiş hükümdar olarak $CZE_karel_schwarzenberg$ ile hem monarşinin eski destekçilerine hem de yeni destekçilerine hitap ediyoruz çünkü o, daha önce bize dayatılan bir [AUS.GetAdjective] hükümdar değil, bir [ROOT.GetAdjective] hükümdardır."
 CZE_return_to_democracy:0 "Demokrasiye Dönüş"
 CZE_return_to_democracy_desc:0 "Yuvamız güvence altına alındığında, halk askeri bir diktatörlüğün artık verimli olmadığının giderek daha fazla farkına varıyor. Bu nedenle seçim yapma ve gücü demokratik sivil liderliğindeki bir yönetime geri verme zamanı geldi."
 CZE_revert_1926_anti_military_laws:0 "1927 Ordu Karşıtı Yasaları Geri Al"
 CZE_revert_1926_anti_military_laws_desc:0 "$CZE_radola_gajda$'nın darbe girişiminden sonra, ordu ve jandarma oy kullanma haklarının yanı sıra diğer bazı ayrıcalıklarını da kaybetti. Ordunun bu zorlu zamanlardaki kritik konumu göz önüne alındığında, bu kısıtlamaları kaldırmamız ve ordu ile siyaset arasındaki bölünmeyi geri almamız hakkaniyetli olacaktır."
 CZE_revisit_custom_union_talks:0 "Gümrük Birliği Görüşmelerini Yeniden Ele Al"
 CZE_revisit_custom_union_talks_2_tt:0 "Federasyonumuza katılma taleplerimizi kabul etmeye çok daha meyilli olacaklar."
 CZE_revisit_custom_union_talks_desc:0 "Gümrük birliği görüşmeleri bazı komşularımızla diğerlerine kıyasla çok kötü geçmiş olabilir. Bunları yeniden ele almanın ve ülkelerimiz arasında bir gümrük birliği için yeni bir hamle yapmanın vakti geldi."
 CZE_revisit_custom_union_talks_tt:0 "Onları katılmaya hala başka §Ryollarla§! ikna edebileceğiz."
 CZE_revive_kraljevica_designs:0 "Kraljevica Tasarımlarını Canlandır"
 CZE_revive_kraljevica_designs_desc:0 "Gançot bilgimizi kullanarak ve eski Kraljevica tasarımlarını inceleyerek, milletimiz için bu muhrip sınıfını yeniden canlandırabiliriz."
 CZE_revive_the_czechoslovak_legion_communist:0 "Gönüllü Organizasyonu Kur"
 CZE_revive_the_czechoslovak_legion_default:0 "Çekoslovak Lejyonunu Canlandır"
 CZE_revive_the_czechoslovak_legion_dynamic:0 "[CZE_revive_the_czechoslovak_legion]"
 CZE_revive_the_czechoslovak_legion_dynamic_desc:0 "Dünyada bir kez daha huzursuzluk mayalanıyor ve [ROOT.GetNameDef]'in cesur askerleri vatanı savunmaya hazır. Ancak geçmişin kanıtladığı gibi, vatanı savunmak bazen yurtdışında savaşan birliklerimizin vatanlarını tam da savunmak için evlerini terk etmeye istekli olanları bir kez daha bulmasını gerektirir."
 CZE_revive_the_czechoslovak_legion_nsb_tt:0 "§Y$CZE_legacy_of_the_czechoslovak_legion_army_spirit$§!, bir §YOrdu Ruhu§!'ndan bir §YMilli Ruh§!'a dönüştürülecek."
 CZE_revive_the_december_bloc:0 "Aralık Bloğunu Yeniden Canlandır"
 CZE_revive_the_december_bloc_desc:0 "Edvard Benes'in başkan olmasına karşı çıkan faşist, azınlık ve sağcı partilerden oluşan Aralık bloğu, mevcut hükümete bir alternatif sunmak üzere yeniden kurulmalıdır."
 CZE_revolutionary_brigades:0 "Devrimci Tugayları Kur"
 CZE_revolutionary_brigades_desc:0 "Şimdi [ROOT.GetNameDef] için savaşma deneyimine sahip olan devrimcilerimiz düzenli orduya daha fazla entegre edilmelidir."
 CZE_second_to_none:0 "Rakipsiz"
 CZE_second_to_none_desc:0 "Uçak endüstrimizin uçak tasarımları her geçen gün gelişiyor. Daha fazla araştırma ile tasarımlarımız dünyada rakipsiz olacak!"
 CZE_seek_french_leadership:0 "[FRA.GetAdjective] Liderliği Ara"
 CZE_seek_french_leadership_desc:0 "Bu ittifakı kurma girişimimize rağmen, [FRA.GetNonIdeologyName] ordusunun her türlü ittifak için harika bir katkı olacağı açık. Liderliği devretmek anlamına gelse bile."
 CZE_semi_constitutional_monarchy:0 "Yarı Anayasal Bir Sistem"
 CZE_semi_constitutional_monarchy_desc:0 "Bir hükümdar seçildiğine göre, anayasayı ayarlama zamanı geldi; bazıları bu sıkıntılı zamanlarda iç çatışmalardan kaçınmak için gücü merkezileştirmeyi savunurken, hükümdarın her şeyi kendi başına yapamayacağı açıktır. Bu nedenle, bir yandan ülkeyi yönetmeye yardımcı olmak için mevcut sistemi kısmen korumak, diğer yandan da ülkeye rehberlik edecek hükümdara sahip olmak en iyisi olabilir."
 CZE_set_up_polish_puppet_state:0 "Güney [POL.GetAdjective] Kukla Devleti Kur"
 CZE_set_up_polish_puppet_state_desc:0 "[GER.GetNameDef] Polonya'da bir kukla devlet kurmakla ilgilendiğine göre, bizim de aynısını yapmaya bakmamız barizdir."
 CZE_shrink_educational_disparities:0 "Eğitim Eşitsizliklerini Azalt"
 CZE_shrink_educational_disparities_desc:0 "Kırsal bölgelerimiz, kentsel muadillerine sunulan uygun eğitimden yoksun kalmıştır. Bu eşitsizliklerle bu bölgelere yönelik büyük eğitim programlarıyla mücadele etmemiz gerekiyor."
 CZE_skoda_fast_optimization_tt:0 " §YŠkoda Milli Hedefi§! £GFX_prod_eff_cap Optimizasyon Kademesinin zamanla Maksimum Kademe'ye doğru artış hızı: §G+%100.0§!"
 CZE_skoda_increase_cooperation:0 "Škoda İçindeki İşbirliğini Artır"
 CZE_skoda_increase_cooperation_desc:0 "Kendimizi geliştirmek için tesisler arası işbirliğini artırarak performansımızı yükseltebiliriz. Bu aynı zamanda tesislerimiz arasında uzmanlık paylaşımına da yol açabilir."
 CZE_skoda_internal_competition:0 "Dahili Rekabeti Teşvik Et"
 CZE_skoda_internal_competition_desc:0 "Škoda gibi büyük bir şirkette herkesin en yüksek çalışma kabiliyetinde kalmasını sağlamak zordur. Dahili rekabeti teşvik etmek, tesislerimizdeki çalışan performansını artırmada uzun bir yol kat edecektir."
 CZE_skoda_max_optimization_tt:0 "Maksimum §YŠkoda Milli Hedefi§! optimizasyon seviyesi 7'ye çıkarılacak."
 CZE_skoda_naval_yards:0 "Škoda Tersaneleri"
 CZE_skoda_naval_yards_desc:0 "Artık denize yeniden erişimimiz olduğuna göre, sınırlarımız içinde hala mevcut olan uzmanlığı kullanarak Avusturya-Macaristan İmparatorluğu'nun eski deniz sanayilerini yeniden başlatabiliriz. Yerli tersaneleri faaliyete geçirmek en önemli öncelik olmalıdır."
 CZE_skoda_office_unlock_tt:0 "Kararı Açar: §YSilah Satış Ofisi İnşa Et§!"
 CZE_skoda_priority_focus_info_tt:0 "Bazı §YMilli Hedefler§! tamamlanabilmesi için belirli bir £GFX_CZE_skoda_text_icon §YŠkoda Önceliği§! odağında olmamızı gerektirecektir. Bu hedefler, gereken £GFX_CZE_skoda_text_icon §YŠkoda Önceliği§! ile ilgili küçük bir simgeyle belirtilmiştir."
 CZE_skoda_priority_shortcut_finder:0 "Škoda Önceliği"
 CZE_skoda_priority_shortcut_finder_desc:0 "Bu Škoda'nın Mevcut Önceliğidir"
 CZE_skoda_priority_shortcut_name:0 "Škoda Önceliği"
 CZE_skoda_sell_weapons_to_SPR_tt:0 "Kararların Kilidini Açar: §Yİspanyol Fraksiyonuna Gizlice Silah Sat§!"
 CZE_slovakia_autonomy_agreement:0 "Slovakya Özerklik Anlaşması"
 CZE_slovakia_autonomy_agreement_2_tt:0 "Bu milli hedef seçildiğinde $CZE_the_autonomous_bloc_demands$ §Y35 gün§! geciktirilecek."
 CZE_slovakia_autonomy_agreement_desc:0 "Özerk bloğun koalisyonumuzla çalışmasının bedeli, hükümetle yapılacak bir özerklik anlaşmasıdır. Bu ödenmesi gereken ağır bir bedeldir ancak pazarlığın üzerimize düşen kısmını yerine getirmemenin sonuçları daha kötü olabilir."
 CZE_slovakia_autonomy_agreement_tt:0 "§Y[RUT.getname]§!, §Y[SLO.getname]§!'ye verdiğimiz anlaşmanın aynısını isteyecek!"
 CZE_soviet_alliance:0 "1935 İttifak Antlaşması'nı Genişlet"
 CZE_soviet_alliance_desc:0 "[SOV.GetNameDef] ile yapılan mevcut ittifak antlaşması, saldırıya uğramamız durumunda müdahalelerinden emin olmak için çok muğlak. Bu nedenle güvenliğimizi garanti altına almak istiyorsak yeni bir anlaşma için onlara yaklaşmalıyız."
 CZE_spread_the_revolution:0 "Devrimi Yay"
 CZE_spread_the_revolution_desc:0 "[ROOT.GetNameDef] içerisinde başarılı olan devrimle birlikte, artık yurt dışındaki proletaryayı özgürlükleri için savaşmaya teşvik etmeliyiz; bu, destekleyebileceğimiz bir mücadeledir."
 CZE_stabilize_the_protectorate:0 "Protektora'yı İstikrara Kavuştur"
 CZE_stabilize_the_protectorate_desc:0 "Protektora hiç de istikrarlı değil. Halkımızı, meşru hükümet olduğumuza ve ihtiyaçlarını karşılayacağımıza ikna etmek için çaba göstermeliyiz."
 CZE_stabilize_the_protectorate_unretire_henlein_tt:0 "§Y[ROOT.getname]§! içerisinden §Y$CZE_konrad_henlein$§! emekliliğini sonlandırır."
 CZE_standing_against_the_storm:0 "Fırtınaya Karşı Durmak"
 CZE_standing_against_the_storm_desc:0 "Hazırlık eksikliğimize ve noksanlıklarımıza rağmen, her türlü zorluğu göğüsleyecek ve yaklaşan fırtınaya karşı duracağız."
 CZE_state_sponsored_recruitment_for_spain:0 "İspanya İçin Devlet Destekli Askere Alma"
 CZE_state_sponsored_recruitment_for_spain_desc:0 "Yabancı müdahalesinin kritik bir rol oynayabileceği yeni bir çatışmada, [ROOT.GetNameDef]'in deneyimli gönüllü savaşçılarını politikalarımızla en çok uyuşan tarafı desteklemeye teşvik etmeliyiz. Bu süreçte son on yıldaki harp gelişmelerine dair bazı dersler bile çıkarabiliriz."
 CZE_strengthen_the_little_entente:0 "Küçük Antant'ı Resmileştir"
 CZE_strengthen_the_little_entente_desc:0 "Esas olarak [HUN.GetNonIdeologyName]'ı kontrol altında tutmayı amaçlayan Küçük Antant, hatırı sayılır bir orduya sahip ciddi bir ittifak olma potansiyeline sahip."
 CZE_strike_at_the_heart_of_bolshevism:0 "[THIS.GetAntiSovietFocusName]"
 CZE_strike_at_the_heart_of_bolshevism_1:0 "Bolşevizmin Kalbine Darbe İndir"
 CZE_strike_at_the_heart_of_bolshevism_2:0 "Doğu Kanadını Güvenceye Al"
 CZE_strike_at_the_heart_of_bolshevism_desc:0 "[SOV.GetNameDef]'in genişlemesi Avrupa ve ulusumuz için varoluşsal bir tehdittir. Onlara karşı bir kale olmalıyız."
 CZE_strike_the_eastern_threat:0 "Doğu Tehdidine Vur"
 CZE_strike_the_eastern_threat_desc:0 "Hükümetimizi eleştirerek emperyal emellerini meşrulaştıran ikiyüzlü [SOV.GetName], [CZE.GetName] için ortadan kaldırılması gereken varoluşsal bir tehdit oluşturuyor."
 CZE_subjegate_romania:0 "[HUN.GetAdjective] Talepleriyle Romanya'ya Baskı Yap"
 CZE_subjegate_romania_desc:0 "[HUN.GetAdjective] kuklamızın talepleri [ROM.GetNameDef]'e karşı kullanışlı bir araçtır. [HUN.GetNameDef]'in [ROM.GetAdjective] toprakları üzerindeki iddialarını bastırmasına izin vermek ve onlara yardım etmekle tehdit ederek [ROM.GetNameDef]'in safımıza geçmesini talep edebiliriz."
 CZE_subjegate_serbia:0 "[YUG.GetName]'ı Boyunduruk Altına Al"
 CZE_subjegate_serbia_desc:0 "Zayıflamış olan [YUG.GetName], artık güney kanadımızı savunmak için etkili bir tampon devlet görevi görmüyor. Slovenya'yı entegre ettikten sonra artık daha da genişlemeyi hedeflemeliyiz."
 CZE_supply_fighters_for_allies:0 "Müttefiklere Avcı Uçağı Sağla"
 CZE_supply_fighters_for_allies_desc:0 "[FRA.GetAdjective] ve [ENG.GetAdjective] hükümetleri, bir çatışma başlarsa [GER.GetAdjective] uçaklarının savunmalarını hızla aşarak şehirlerini hedef alacağından çok korkuyorlar. Bu nedenle hava kuvvetlerini güçlendirmek, [GER.GetAdjective] yayılmasını ağır can kaybı vermeden durdurma yetenekleri konusunda onlara biraz daha güven verebilir."
 CZE_support_spain_reward_tt:0 "§YBir İspanyol fraksiyonu bizden gönüllülere sahipken kazandığında veya kaybettiğinde oluşacak etkiler:§!"
 CZE_the_air_is_our_sea:0 "Hava Bizim Denizimizdir"
 CZE_the_air_is_our_sea_desc:0 "Sistematik pilot eğitiminin altında, pilotlarımızı cesurca ve güvenle uçmaları için güçlendirin, 'Ne okyanus limanlarımız ne de okyanus giden gemilerimiz var. Hava bizim denizimizdir.'"
 CZE_the_legacy_of_ottokar:0 "Ottokar'ın Mirası"
 CZE_the_legacy_of_ottokar_desc:0 "Efsanevi kral II. Ottokar, Avusturya soylularının onayıyla Bohemya krallığını Avusturya'ya ve Adriyatik'e kadar genişletti. Soylu olsun olmasın tüm Avusturyalılara bir kez daha hitap etmeliyiz."
 CZE_the_lions_roar:0 "Aslanın Kükreyişi"
 CZE_the_lions_roar_desc:0 "Çekoslovakyalı Aslan sembolü, ordumuzun en iyi niteliklerini temsil eder. En yüksek derecede cesaret, güç ve kahramanlık. Silahlı kuvvetlerimizin eşsiz ruhunu herkes bilecek."
 CZE_the_rut_demands_add_35_CZE_comprise_with_the_carpathians_tt:0 "Bu milli hedef seçildiğinde $CZE_the_rut_demands$ §Y35 gün§! geciktirilecek."
 CZE_the_second_fortification_program:0 "İkinci Tahkimat Programını Başlat"
 CZE_the_second_fortification_program_desc:0 "İlk tahkimat programı, derhal üzerine inşa etmemiz gereken savunmalar için bir temel attı. Ulusumuzun geleceği adına, en kısa sürede ikinci tahkimat programını başlatmalı ve tahkimat hatlarımızı büyütüp geliştirmeliyiz."
 CZE_the_slovak_arrow:0 "Slovak Oku"
 CZE_the_slovak_arrow_desc:0 "İki büyük şehrimiz arasında hızlı bir raylı otobüs geliştirmek büyük bir milli gurur kaynağı olacaktır. Ayrıca demiryolu altyapısını iyileştirmek için bize iyi bir bahane verecektir."
 CZE_the_tvp_project:0 "TVP Projesi"
 CZE_the_tvp_project_desc:0 "Ordumuz, yerli bir tank tasarımı geliştirmek için bir Genel Amaçlı Tank (TVP) programı önerdi. Tank üretiminde geniş deneyime sahip olan bazı üreticilerimiz projemize ilgi gösterdi."
 CZE_three_kings:0 "Üç Kral"
 CZE_three_kings_desc:0 "Direniş gruplarımıza resmi bir sıfatla yardım etmek, onların orduya zarar verme yeteneklerini büyük ölçüde artıracaktır. Sahadaki ordumuza da yardımcı olabilir."
 CZE_topple_the_king:0 "Kralı Devir"
 CZE_topple_the_king_desc:0 "$CZE_edvard_benesh$'in hükümetimiz üzerindeki nüfuzu boğucu seviyede. Parlamento içindeki sadık lejyonu sayesinde gücü, cumhurbaşkanı olarak rolünden daha büyük. Koşullar uygun olduğuna göre, Horní Komora'daki etkisini alt edebiliriz."
 CZE_trust_in_old_guard:0 "Eski Muhafızlara Güven"
 CZE_trust_in_old_guard_desc:0 "Büyük Harp'ten kalma hava becerileri ve deneyimi, sarsılmaz bir güven duyduğumuz gaziler tarafından yeni nesle aktarılacaktır."
 CZE_truth_prevails:0 "Hakikat Galip Gelir"
 CZE_truth_prevails_desc:0 "Büyük engeller ve imkansız görevlerle karşı karşıya kalsa bile, ülkemiz milli sloganımız olan 'Hakikat Galip Gelir' sözünün her şey bittiğinde doğru çıkacağını biliyor. Hakikati arayın, hakikati söyleyin; o galip gelecektir."
 CZE_unify_the_fascist_parties:0 "Faşist Partileri Birleştir"
 CZE_unify_the_fascist_parties_desc:0 "Faşist partilerin manzarası parçalanmış durumda ve birçoğu o kadar aşırı ki asla önemli bir destek almayı umamazlar. Ulusun savunması adına, bu partilerin birleşmesi ve Çekoslovakya için toplumun sadece uç kesimlerine hitap etmeyen bir vizyon yaratması gereklidir."
 CZE_unlock_civil_war_army_generals_tt:0 "İç Savaşta Kaybedilen Komutanları Geri Kazan"
 CZE_unlocks_sokolov_raid_pfot_tt:0 "§YFalknov§! üzerine §YParaşütçü Baskını§! özelliğini açar"
 CZE_unlocks_volunteer_transport_raid_tt:0 "§YAkın§! açar:\n§Y[73.GetName]§! üzerinde Sovyet Gönüllüleri İçin Hava Köprüsü"
 CZE_urbanist_policies:0 "Şehirci Politikalar"
 CZE_usurp_the_mantle:0 "Unvanı Gasp Et"
 CZE_usurp_the_mantle_desc:0 "Krallığımız Baltık Denizi'nden Adriyatik'e kadar uzandığı ve tarihi bölgesel güç Avusturya'nın topraklarına hükmettiği için, artık Kutsal Roma İmparatorluğu'nun meşru halefi olduğumuzu ilan edebiliriz."
 CZE_vonapo_20:0 "VONAPO 20"
 CZE_vonapo_20_desc:0 "[GER.GetNameDef]'den yükselen tehdidi gören tek biz değiliz, bu nedenle [GER.GetAdjective] emellerini daha iyi boşa çıkarabilmek için istihbarat toplamada [SOV.GetNameDef] ile işbirliği yapma planı oluşturuldu."
 CZE_wielding_the_hammer:0 "Balyozu Sallamak"
 CZE_wielding_the_hammer_desc:0 "Ulusal Meclis'teki ezici çoğunluğumuzu, yasa çıkarma sürecini şu ankinden çok daha hızlı hale getirmek için kullanabiliriz. Yasama düzenimizi bir yoluna koymak en yüksek önceliğe sahip."
 CZE_within_the_eagles_nest:0 "Kartal Yuvası'nın İçinde"
 CZE_within_the_eagles_nest_desc:0 "Kapımızın hemen dışında bir muhbir ve sabotajcı ordusuna sahip olmak ordumuz için büyük bir avantaj olurdu. 2. Departman'ın yardımıyla bu bölgelerdeki casus ağlarımız kapsamlı hale gelebilir."
 CZE_wolfs_of_bohemia:0 "Bohemya Kurtları"
 CZE_wolfs_of_bohemia_desc:0 "Sınırlarımız içinde hala mevcut olan denizaltı deneyimi göz önüne alındığında, kendi kurt sürülerimizi oluşturmak çok zor olmayacaktır."
 CZE_work_with_germany:0 "[GER.GetNameDef] ile Çalış"
 CZE_work_with_germany_desc:0 "Sudeten sorunu çözüldüğüne göre, belki [GER.GetNameDef] artık [ROOT.GetNameDef]'in bir müttefik olarak ne kadar değerli olacağını fark edebilir."
 CZE_zapotocky_faction:0 "Zápotocký Fraksiyonu"
 CZE_zapotocky_faction_desc:0 "Komünist partinin kurucuları Bohumir Šmeral ve Antonin Zápotocký, Klement Gottwald'ın partiye dayattığından daha ılımlı bir politika hayal etmişlerdi; tüm [CZE.GetAdjective] halklarına gerçekten hitap etmek için bu köklere dönmeliyiz."
 CZE_zdenek_fierlinger_tt:0 "Danışman §Y$CZE_zdenek_fierlinger$§! atanır"
 GER_integrate_czech_manufacturers:0 "Çek Üreticileri Entegre Et"
 GER_integrate_czech_manufacturers_desc:0 "Bohemya'da bulunan sanayi, ekonomimiz için bir imalat uzmanlığı ve sanayi kaynakları altın madenidir. Bohemya üreticilerinin ekleyeceği ek sanayi gücü, silahlanma sanayimiz için büyük bir destek olacaktır. Onları üretim hatlarımıza entegre etmek son derece mantıklıdır."
 GER_integrate_czech_manufacturers_no_aat_tt:0 "§YTasarım Şirketleri§! olarak §Gkullanılabilir§!:\n§Y$CZE_skoda_works_german_organization$§!, §Y$CZE_bohmische_mahrische_maschinenfabrik_ag_german_organization$§!, §Y$CZE_zlin_aircraft_organization$§! ve §Y$CZE_ceska_zbrojovka_uhersky_brod_organization$§!"
