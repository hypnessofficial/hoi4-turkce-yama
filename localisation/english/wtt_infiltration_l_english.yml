 PRC_infiltrate_nationalist_areas_desc:0 "Henüz Milliyetçilerle açık bir muharebede boy ölçüşemeyiz. Gücümüzü korumalı ve düşmanı zayıflatmak için yeni Üs Bölgeleri inşa etmeliyiz. Doğru zaman geldiğinde direnişi başlatacağız.\n\nKomünist hücrelerimiz, §HSızma§! seviyesine bağlı olarak eyaletin kontrolünü ele geçirmek amacıyla §HAltyapıya§! ve §HAskeri Fabrikalara§! sabotaj düzenleyecek veya §HMilis Tümeni§! kuracaktır."
