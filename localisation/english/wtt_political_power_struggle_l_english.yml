 wtt_political_organisation.1.a:0 "İnsanlar kazananı gördüklerinde tanırlar."
 wtt_political_organisation.1.desc:0 "[state.GetName]'daki yerel parti görevlileri, bölgedeki vatandaşların çoğunluğunun hala bizi desteklediğini bildiriyor. Kapsamlı çalışmalar bölgedeki desteğin artmasına bile yol açtı."
 wtt_political_organisation.1.t:0 "[state.GetName]'dan Rapor"
 wtt_political_organisation.10.a:0 "Kabul edilemez."
 wtt_political_organisation.10.desc_had_majority:0 "[state.GetName]'daki bir dizi terörist saldırının ardından, yerel halk onları koruma yeteneğimize olan inancını kaybetmiş görünüyor. Saldırılar yalnızca bizim parti ofislerimizi hedef aldığı için, [majority_country.GetLeader]'in bu işte bir parmağı olduğu açık."
 wtt_political_organisation.10.desc_not_majority:0 "[state.GetName]'deki [old_majority_country.GetLeader] desteği, parti ofislerine yapılan bir dizi yangın bombasının ardından önemli ölçüde düştü. Bu saldırılar muhtemelen [state.GetName]'de \"düzeni yeniden sağlama\" sözü veren [majority_country.GetLeader] tarafından emredildi. Görünen o ki nüfusun çoğunluğu artık ona destek veriyor."
 wtt_political_organisation.10.t:0 "[From.GetNameDefCap], [state.GetName]'da Çoğunluğu Elde Ediyor"
 wtt_political_organisation.11.a:0 "Mesajı zorla anlatmamız gerekebilir."
 wtt_political_organisation.11.desc:0 "[majority_country.GetLeader]'e olan desteği bastırma kampanyamız tam bir başarıdan çok uzak kalmış görünüyor. En iyi çabalarımıza rağmen, [state.GetName]'daki vatandaşların çoğunluğu hala [majority_country.GetLeader]'i destekliyor."
 wtt_political_organisation.11.t:0 "[state.GetName]'dan Rapor"
 wtt_political_organisation.12.a:0 "Galip geleceğiz."
 wtt_political_organisation.12.desc_has_majority:0 "[state.GetName]'daki [From.GetLeader]'in ajanları bir sindirme ve siyasi terör kampanyası başlattı. Bizi destekleyen vatandaşların alenen taciz edildiği ve hain olarak damgalandığına dair raporlar geldi. Parti yetkilileri dövüldü ve bazı ofislerimiz yakıldı. Bütün bunlara rağmen, yerel halkın çoğunluğu hala teröre boyun eğmeyi reddediyor ve bizi desteklemeye devam ediyor."
 wtt_political_organisation.12.desc_not_majority:0 "[state.GetName], benzeri görülmemiş bir siyasi şiddet dalgası yaşıyor. [From.GetLeader] ve [majority_country.GetLeader] destekçileri arasındaki sokak savaşları günlük bir olay. Şimdilik, [majority_country.GetLeader]'in hala nüfusun çoğunluğunu arkasında tuttuğu anlaşılıyor."
 wtt_political_organisation.12.t:0 "[state.GetName]'da Baskı"
 wtt_political_organisation.2.a:0 "Mücadele devam ediyor."
 wtt_political_organisation.2.desc:0 "[state.GetName]'daki kaynaklar, [majority_country.GetNameDef]'in bölge genelinde desteği artırmak için ortak bir çaba gösterdiğini bildiriyor. Nüfusun açık bir çoğunluğu hala onları destekliyor."
 wtt_political_organisation.2.t:0 "[state.GetName]'dan Rapor"
 wtt_political_organisation.3.a:0 "Üstün bir teoriyi takip ediyorlar."
 wtt_political_organisation.3.desc:0 "Bir süre önce \"[Root.GetLeader] Düşünce Çalışmaları Topluluğu\"nun kurulduğu [state.GetName]'den cesaret verici haberler geldi. Bu grup artık halktan büyük miktarda destek alıyor. [old_majority_country.GetLeader]'ye yönelik önceki desteklerine ilişkin herhangi bir ifade ortadan kalktı."
 wtt_political_organisation.3.t:0 "[state.GetName] Bizi Destekliyor"
 wtt_political_organisation.4.a:0 "Kabul edilemez."
 wtt_political_organisation.4.desc_had_majority:0 "Ellerindeki her türlü imkanı kullanan [majority_country.GetNameDef] ajanları, [state.GetName] nüfusunu kendi taraflarına çekmeyi başarmış görünüyor. Güvenlerini kazanmak için çabalarımızı iki katına çıkarmalıyız."
 wtt_political_organisation.4.desc_not_majority:0 "[state.GetName]'daki [old_majority_country.GetNameDef]'e olan destek önemli ölçüde düştü. Daha yakın zamanda, [majority_country.GetNameDef] lehine büyük gösteriler eyaletin büyük şehirlerinde yürüdü ve [majority_country.GetLeader]'in büyük resimleri her köyde bulunabilir."
 wtt_political_organisation.4.t:0 "[From.GetNameDefCap], [state.GetName]'da Çoğunluğu Elde Ediyor"
 wtt_political_organisation.5.a:0 "Tekrar denemeliyiz."
 wtt_political_organisation.5.desc:0 "[state.GetName] sakinlerini ikna etmeye yönelik büyük bir çabaya rağmen, çok azı açıkça taraf değiştirmeye istekli görünüyor. Söylentiye göre [majority_country.GetLeader]'in kendisi [state.GetName]'ın ne pahasına olursa olsun tutulması gerektiğini ilan etti. Birçok vatandaş, [Root.GetLeader]'e olan desteklerini açıkça gösterirlerse misillemelerden korkuyor, ancak yerel temsilcilerimiz gelecekte yenilenen bir çabanın daha fazla insanı ikna edebileceğini umuyor."
 wtt_political_organisation.5.t:0 "[state.GetName]'dan Rapor"
 wtt_political_organisation.6.a:0 "Durumu göz önünde bulundurmamız gerekecek."
 wtt_political_organisation.6.desc_has_majority:0 "[state.GetName]'dan rahatsız edici haberler geldi. [From.GetLeader]'in bir dizi konuşması büyük kalabalıklar çekti ve yerel parti görevlilerimiz kendilerini [state.GetName]'ın karşı karşıya olduğu sorulara cevap talep eden öfkeli vatandaşlarla çevrili buldular. Şimdilik, eyaletteki konumumuz hala güvende, ancak bu hızla değişebilir."
 wtt_political_organisation.6.desc_not_majority:0 "[state.GetName]'daki gazeteler, [From.GetLeader]'in son bir dizi konuşmasında rekor kalabalıklar olduğunu bildiriyor. Görünüşe göre nüfusun artan bir kısmı şimdi [From.GetNameDef]'i destekliyor. Ancak şimdilik, çoğunluk hala [majority_country.GetLeader]'i destekliyor."
 wtt_political_organisation.6.t:0 "[state.GetName]'da [From.GetNameDef]'e Destek Artıyor"
 wtt_political_organisation.7.a:0 "Bu onlara bulaşmamaları gerektiğini öğretmeli."
 wtt_political_organisation.7.desc:0 "[state.GetName]'daki bir gösteri, protestocuların maskeli bir grup haydut tarafından saldırıya uğramasıyla şiddete dönüştü. Bu şiddet patlaması istenen etkiyi yaratmış gibi görünüyor, çünkü muhalefete olan siyasi destek neredeyse tamamen ortadan kalktı. \n\nBizi bu olayla doğrudan ilişkilendiren bir şey olmasa da, mesajın yüksek sesle ve net bir şekilde iletilmiş olması gerekir."
 wtt_political_organisation.7.t:0 "[state.GetName]'dan Rapor"
 wtt_political_organisation.8.a:0 "Rezalet."
 wtt_political_organisation.8.desc:0 "[state.GetName]'daki hükûmetimizi destekleyen bir gösteri, [majority_country.GetLeader]'in hizmetindeki silahlı haydutlar tarafından saldırıya uğradı. Çatışmada bir dizi destekçimiz öldürüldü ve hükûmetimize olan destek tehlikeli bir şekilde düştü."
 wtt_political_organisation.8.t:0 "[state.GetName]'dan Rapor"
 wtt_political_organisation.9.a:0 "Aşkta ve savaşta her şey mübahtır ve siyaset ikisinden de birazdır."
 wtt_political_organisation.9.desc:0 "[state.GetName]'daki ajanlarımız, [old_majority_country.GetLeader]'in yerel parti merkezlerine bir dizi saldırı düzenleyerek partisinin siyasi organizasyonuna ciddi şekilde zarar verdi. Bu, nüfus tarafından fark edilmedi değil. [old_majority_country.GetLeader]'in destekçileri artık belirgin bir azınlık."
 wtt_political_organisation.9.t:0 "[state.GetName] Bizi Destekliyor"
 wtt_political_warlord_support.1.a:0 "Onları destekleyeceğiz."
 wtt_political_warlord_support.1.b:0 "Daha iyi bir anlaşma beklemeliyiz."
 wtt_political_warlord_support.1.desc:0 "[asking_for_support.GetLeader]'den bir temsilci, bir siyasi ittifak için nabız yoklamak üzere geldi. [asking_for_support.GetLeader], mevcut siyasi mücadelede galip gelirse iç işlerimize karışmayacağına söz veriyor. Bu çatışmada taraf tutmak uzun vadeli sonuçlar doğurabilir, çünkü ilgili diğer taraflar bunu şüphesiz bir ihanet olarak kabul edecektir."
 wtt_political_warlord_support.1.t:0 "[From.GetNameDefCap] Desteğimizi İstiyor"
 wtt_political_warlord_support.10.a:0 "Halk desteği gösterisi iste."
 wtt_political_warlord_support.10.b:0 "Tüfek teslimatı iste."
 wtt_political_warlord_support.10.c:0 "Ordumuzu reforme etmede yardım iste."
 wtt_political_warlord_support.10.d:0 "O kadar kolay satın alınmayacağız!"
 wtt_political_warlord_support.10.desc:0 "Şimdiye kadar mevcut siyasi mücadeleden uzak durmayı seçtik. Görünüşe göre bu [From.GetLeader]'in gözünden kaçmamış. Tarafına desteğimizi ilan etmemiz için ne gerekeceğini soran bir not gönderdi.\n\nSeçeneklerimizi dikkatlice tartmalı ve bağımsızlığımızı çok ucuza satmadığımızdan emin olmalıyız."
 wtt_political_warlord_support.11.a:0 "Eğer gereken buysa..."
 wtt_political_warlord_support.11.b:0 "Kabul edilemez."
 wtt_political_warlord_support.11.desc:0 "[From.GetLeader] ile müzakereler sona erdi. [From.GetNameDef] lideri, eyaletindeki nüfusun Çin etrafındaki olayları büyük bir ilgiyle takip ettiğini ve [From.GetLeader]'in ne zaman kontrol mücadelesine katılacağı veya masadaki yerinden vazgeçeceği konusunda spekülasyonların yaygın olduğunu belirtti. \n\nBizim tarafımızdan [From.GetLeader]'e yönelik bir dostluk ve hayranlık kamuoyu açıklaması, [From.GetNameDef] halkına liderlerinin Çin siyasetinde önemli bir güç olarak kabul edildiği ve yaygın olarak saygı duyulduğu konusunda güvence vermede büyük bir yol kat edecektir."
 wtt_political_warlord_support.11.t:0 "[From.GetLeader] halk desteği gösterisi talep ediyor."
 wtt_political_warlord_support.12.a:0 "Umarım bundan pişman olmayız..."
 wtt_political_warlord_support.12.desc:0 "[From.GetLeader] ile müzakereler sona erdi. [From.GetNameDef] lideri, eyaletindeki nüfusun askerlerinin zayıf teçhizatından çok endişeli olduğunu belirtti. Birçok birimin her adama bir tüfeği bile yok ve bir dizi asker eski namludan dolma tüfekler ve kılıçlar da dahil olmak üzere modası geçmiş silahları kullanmak zorunda. \n\nDevam eden çatışmada taraf seçmek ileride askeri bir çatışmaya yol açabileceğinden, [From.GetLeader], desteğini kamuoyuna açıklamadan önce kuvvetlerini silahlarla yeniden donatmamız konusunda bizden kesin bir taahhüt istedi."
 wtt_political_warlord_support.12.t:0 "[From.GetLeader] silah talep ediyor."
 wtt_political_warlord_support.13.a:0 "Küçük bir fedakarlık."
 wtt_political_warlord_support.13.desc:0 "[From.GetLeader] ile müzakereler sona erdi. Cevabında, [From.GetLeader] askeri kuvvetlerinin deneyimli subaylardan umutsuzca yoksun olduğunu ve acil reforma ihtiyacı olduğunu belirtti. [From.GetNameDef] halkı, ordusu bu kadar perişan haldeyken mevcut mücadelede böylesine cesur bir duruş sergilemesini asla hoş görmezdi. \n\nEğer ordusunu reforme etmede [From.GetLeader]'e yardım edersek, bizi alenen desteklemekten mutluluk duyacaktır."
 wtt_political_warlord_support.13.t:0 "[From.GetLeader] askeri yardım istiyor."
 wtt_political_warlord_support.2.a:0 "İyi Adam."
 wtt_political_warlord_support.2.desc:0 "[Root.GetLeader]'e kişisel bir mektupla, [warlord_asked_for_support.GetLeader] yönetimimize cömert desteği için bize teşekkür ediyor. Mektup, uzun kişisel müzakerelerden sonra, [warlord_asked_for_support.GetLeader]'in Çin'in bir bütün olarak çıkarlarının en iyi şekilde [Root.GetLeader]'in siyasi geleceğini şekillendirmede daha büyük bir rol oynamasıyla hizmet edileceği sonucuna vardığını söyleyerek devam ediyor.\n\nBundan sonra, mektup sona ererken, [warlord_asked_for_support] mevcut siyasi mücadeledeki çabalarımızı destekleyecektir."
 wtt_political_warlord_support.2.t:0 "[warlord_asked_for_support.GetLeader] Bizi Destekliyor"
 wtt_political_warlord_support.21.a:0 "Ne kadar da nazik."
 wtt_political_warlord_support.21.desc:0 "Bu hafta başında ulusal ve uluslararası basına konuşan [From.GetLeader], kendisini \"[From.From.GetLeader] düşüncesinin ilk öğrencisi\" olarak nitelendirdi ve Çin'in iç çekişme ve çatışma kaosundan yükselmesine izin verecek olanın [From.From.GetLeader] gibi adamlar olduğunu söyledi.\n\n[From.From.GetLeader]'yi düşünüp düşünmediği sorulduğunda [From.GetLeader], hükümetindeki bir pozisyon için [From.From.GetLeader]'nin deneyimine ve bilgeliğine sahip birinin yanında olmasından mutlu olacağını söyledi."
 wtt_political_warlord_support.21.t:0 "[From.GetLeader] desteğini sunuyor."
 wtt_political_warlord_support.22.a:0 "Bunlar çok faydalı olacak."
 wtt_political_warlord_support.22.desc:0 "Tüfeklerin ve diğer piyade teçhizatının ilk sevkiyatı [From.GetNameDef]'den geldi. Bu silahlar en son teknoloji olmasa da, iyi çalışır durumda görünüyorlar ve mümkün olan en kısa sürede birliklere verilebilirler.\n\nSevkiyatla birlikte, [From.GetLeader]'den anlaşmanın kendi payımıza düşen kısmını yerine getirmemizi hatırlatan bir not aldık."
 wtt_political_warlord_support.22.t:0 "[From.GetLeader] teçhizat gönderiyor."
 wtt_political_warlord_support.23.a:0 "Çok hoş karşılandılar."
 wtt_political_warlord_support.23.desc:0 "Ordumuzu reforme etmede bize yardımcı olmak misyonuyla [From.GetLeader] tarafından gönderilen bir grup subay geldi. Grup, deneyimli piyade komutanlarından topçulara ve kurmay subaylara kadar çok çeşitli uzmanları kapsıyor. \n\nBirliğin lideri, [From.GetLeader]'den anlaşmanın kendi payımıza düşen kısmını yerine getirmemizi hatırlatan bir not verdi."
 wtt_political_warlord_support.3.a:0 "Tarafsız kaldığı sürece..."
 wtt_political_warlord_support.3.desc:0 "[warlord_asked_for_support.GetLeader]'in desteğini sağlama misyonumuz başarıyla karşılanmadı. [warlord_asked_for_support.GetLeader], mevcut siyasi mücadeleyi Çin'in karşı karşıya olduğu gerçek tehditlerden dikkatimizi dağıtan önemsiz bir yan gösteri olarak görüyor."
 wtt_political_warlord_support.3.t:0 "[warlord_asked_for_support.GetNameDefCap] Reddediyor"
 wtt_take_national_leadership.1.a:0 "Halk iradesini belli etti."
 wtt_take_national_leadership.1.b:0 "Bu bir demokrasi değil!"
 wtt_take_national_leadership.1.desc:0 "Çin'in her yerinde, [old_leader.GetLeader] liderinin Çin liderliğinden istifa etmesini ve kontrolü [new_leader.GetLeader] liderine devretmesini talep eden büyük gösteriler düzenlendi. Hükümetimiz içinde bile, [new_leader.GetLeader] liderinin Çin'i birleştirme ve geleceğe taşıma şansının daha yüksek olduğuna inanan birçok kişi var. \n\n[new_leader.GetLeader] için siyasi destek, iktidar devrini reddetmenin çatışmalara geri dönme riski taşıyacağı noktaya kadar büyüdü."
 wtt_take_national_leadership.1.t:0 "[From.GetLeader] Ulusal Liderliği Almaya Hazır"
 wtt_take_national_leadership.2.a:0 "[new_leader.GetLeader] için üç kez yaşa!"
 wtt_take_national_leadership.2.desc:0 "Resmi bir törenle [old_leader.GetLeader], Cumhuriyetin başbakanlığını [new_leader.GetLeader]'ye devretti. Toplanan destekçileri önünde bir konuşma yapan [new_leader.GetLeader] şunları söyledi: \n\n\"[old_leader.GetLeader] Düşünce gelenekleri Çin'i bugünkü haline getirdi. [old_leader.GetLeader]'nin ülkemizi daha güçlü kılmak için çok çalıştığına şüphe yok. O gerçek bir vatansever ve büyük bir lider olarak hatırlanacak. Ama aynı zamanda yeni şeyler de vermeliyiz. fikirlerin kendilerini gerçek dünyada kanıtlama şansı. Birlikte yeni, daha iyi, güçlü ve birleşmiş bir Çin yaratacağız!\"\n\n[old_leader.GetLeader] yorum yapmadı."
 wtt_take_national_leadership.2.t:0 "[old_leader.GetLeader] Boyun Eğiyor"
 wtt_take_national_leadership.3.a:0 "O zaman zorla alacağız!"
 wtt_take_national_leadership.3.desc:0 "[new_leader.GetLeader]'e olan ezici halk desteğine rağmen, [From.GetLeader] Cumhuriyet başbakanı olarak görevinden vazgeçmeyi reddetti. Asla şantaja boyun eğmeyeceğini veya ülkeyi hainlere ve haydutlara teslim etmeyeceğini belirten [From.GetLeader], görevinden ayrılmayacağını açıkça belirtti."
 wtt_take_national_leadership.3.t:0 "[From.GetLeader] Reddediyor"
