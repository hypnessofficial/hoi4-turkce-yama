 SPA_primo_de_rivera_speech:0 "Primo de Rivera'nın Konuşması"
 SPA_primo_de_rivera_speech_desc:0 "José Antonio Primo de Rivera, Falange Española'nın kurucularından biridir. Demokrasiyi eleştiren bir konuşmacı olarak, halk desteğimizi artırmak ve ülkeyi daha da istikrarsızlaştırmak için daha fazla konuşma yapmaya teşvik edilmelidir."
