 SPA_suppress_the_strikes_desc:0 "Grevler ülkemize büyük bir huzursuzluk ve ekonomik zarar veriyor. Onları dağıtmak ve insanların işlerine geri dönmesini sağlamak için milislerimizi göndereceğiz."
