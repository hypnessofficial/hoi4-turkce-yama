 SPA_secure_the_northern_garrisons_mission_tt:0 "Milliyetçiler, §Y[171.GetName]§!, §Y[174.GetName]§!, §Y[788.GetName]§!, §Y[791.GetName]§!, §Y[176.GetName]§!, §Y[166.GetName]§! ve §Y[172.GetName]§!'deki §YGarnizon Kontrolünü§! §RTam§!'a yükseltir.\n\nMilliyetçiler, bu illerdeki §YGarnizon Kontrolleri§! en az §YZayıf§! olduğu sürece iç savaşa bu illerin kontrolünde başlayacaktır.\n"
