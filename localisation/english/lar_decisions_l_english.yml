 POR_iberian_summit:0 "İberya Zirvesi"
 POR_iberian_summit_desc:0 "Eğer zorluklara karşı galip gelmek istiyorsak İberya uluslarının birlikte çalışması gerekiyor. Bu belirsiz zamanlarda çatışmanın hangi tarafını desteklememiz gerektiğini tartışmak için [GetIberianSummitReceiverName]'i teşvik etmeliyiz."
 POR_iberian_summit_in_progress_flag:0 "İberya Zirvesi devam ediyor"
 POR_iberian_summit_pro_allies:0 "[ENG.GetFactionName]'e Katılma Teklifi"
 POR_iberian_summit_pro_allies_desc:0 "[ENG.GetAdjective] ile aynı safta yer almalı ve özgürlüğümüzü tehdit eden ve bizi domine etmeye çalışan herkese karşı durmalıyız. \n[GetIberianSummitReceiverName]'e bir mektup göndererek, [ENG.GetNameDef]'den bizi [ENG.GetFactionName]'e kabul etmesini isteyen ortak bir teklifi tartışmalarını isteyeceğiz."
 POR_iberian_summit_pro_axis:0 "[GER.GetFactionName]'e Katılma Teklifi"
 POR_iberian_summit_pro_axis_desc:0 "[GER.GetFactionName], Avrupa'da baskın güç haline gelecektir. Topraklarımızın ve kaynaklarımızın doğrudan kontrolünü ele geçirmeye karar vermeden önce onlarla aynı safta yer almalıyız. \n[GetIberianSummitReceiverName]'e bir mektup göndererek, [GER.GetNameDef]'den bizi [GER.GetFactionName]'e kabul etmesini isteyen ortak bir teklifi tartışmalarını isteyeceğiz."
 POR_iberian_summit_proposal_delayed:0 "[?global.POR_iberian_summit_target.GetFactionName]'e Katılmak İçin Bir Teklif Üzerinde Çalışılıyor"
 POR_iberian_summit_proposal_delayed_desc:0 "İberyalı diplomatlar şu anda [?global.POR_iberian_summit_target.GetAdjective] bakanlarına yaklaşıyor ve [?global.POR_iberian_summit_target.GetFactionName]'e kabulümüzün yolunu açacak cazip bir anlaşma hazırlıyorlar."
