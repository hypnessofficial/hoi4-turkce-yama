 form_andalusia_desc:0 "Kurtuba, Gırnata Emirliği ve Güney İberya'nın çoğunluğu bizim kontrolümüz altındayken, eski Endülüs Sultanlığı'nı restore etme ve tüm eski topraklarını devletimizin meşru parçaları olarak ilan etme eşsiz fırsatına sahibiz."
