 POR_portugal_cancel_blockade_evasion_for_country_desc:0 "[From.GetAdjective] hükûmeti için Britanya ablukasından kaçmak üzere konvoylarımızın bir kısmını kullandığımız anlaşma artık bizim için faydalı değil, bu nedenle derhal iptal edeceğiz."
