 SPA_political_assassination:0 "Siyasi Suikast"
 SPA_political_assassination_desc:0 "Siyasi hasımlarımız başımıza bela oluyor ve aksi takdirde bizim tarafımıza çekilebilecek insanları etkiliyorlar. Kilit rakiplerimizden birini taktiksel olarak ortadan kaldırarak üzerimizdeki baskıyı azaltabilir ve mesajımızın yerine ulaşması için daha fazla şans verebiliriz."
