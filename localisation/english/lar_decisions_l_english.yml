 SPR_expand_resource_extraction:0 "Kaynak Çıkarımını Genişlet"
 SPR_government_crackdown_mission:0 "Yaklaşan Hükûmet Baskısı"
 SPR_government_crackdown_mission_desc:0 "İç savaşın başlangıcından beri hareketimize yönelik Stalinist ve Cumhuriyetçi baskı giderek arttı. Başlangıçtaki faşist darbeyi durdurmak için kan döktük, ancak devam eden özerkliğimiz hükûmetin gözüne batan bir diken ve yardımlarımızdan yararlanmaya devam etmektense bizden kurtulmayı tercih ettikleri açık. Bize başka seçenek bırakmazlarsa, özgürlüğümüzü güçle savunmaya hazır olmalıyız."
 SPR_ignite_uprising:0 "Anarşist Ayaklanmasını Ateşle"
 SPR_ignite_uprising_timer_mission:0 "Yaklaşan Anarşist Ayaklanması"
 SPR_ignite_uprising_timer_mission_tt:0 "§RAnarşist tümenleri birden fazla kontrol altındaki eyalette ayaklanacak.§!\n"
 SPR_imprison_primo_de_rivera:0 "Primo de Rivera'yı Hapset"
 SPR_imprison_primo_de_rivera_desc:0 "José Antonio Primo de Rivera, durmak bilmeyen kışkırtıcı konuşmalarıyla ülkeyi yeterince rahatsız etti. Onu tutuklayacak ve gözümüzün önünde tutabileceğimiz bir yere koyacağız. Falanj'ın sesi susturulmalı."
 SPR_imprison_primo_de_rivera_tt:0 "Primo de Rivera'nın daha fazla kışkırtıcı konuşma yapmasını engeller.\n"
 SPR_inevitable_civil_war_in_progress_flag:0 "Şu anda bir Kaçınılmaz İç Savaş kararı devam ediyor"
 SPR_integrate_commune:0 "[From.GetName] Komününü Entegre Et"
 SPR_military_plot_republicans:0 "Askerî Komplo"
 SPR_military_plot_republicans_desc:0 "Hükûmeti devirmeye yönelik uğursuz bir komploya dair söylentiler kulağımıza geldi ve bu tür darbe girişimleriyle ilgili son deneyimlerimize rağmen bir başkasıyla başa çıkmaya hiç hazır değiliz. Planlarını mümkün olan her yerde engellemeli ve kendimize hazırlanmak için zaman tanımak amacıyla onları geciktirmeliyiz."
 SPR_opposition_civil_war_preparations:0 "Muhalefetin İç Savaş Hazırlıkları"
 SPR_opposition_civil_war_preparations_desc:0 "Biz onların her hamlesini boşa çıkarmak için çalışırken, düşmanlarımız da boş durmuyor. Yaklaşan çatışma için hazırlıklarımızı yaparken onların eylemlerini akılda tutmakta fayda var."
 SPR_political_arrest:0 "Siyasi Tutuklama"
 SPR_political_arrest_desc:0 "Siyasi düşmanlarımız mesajlarını duyurmak için cinayete başvurdular. Buna müsamaha gösteremeyiz - failler adalete teslim edilmelidir!"
 SPR_political_assassination_mission:0 "Siyasi Suikast"
 SPR_political_assassination_mission_desc:0 "Siyasi düşmanlarımızın kan donduran söylemleri, davamızın önde gelen bir destekçisinin ortadan kaldırılması çağrısında bulundu... Birisinin bu sözler üzerine harekete geçmeye karar vermesine şaşırmamalıyız."
 SPR_preparing_offensive:0 "Taarruz Hazırlanıyor"
 SPR_preparing_offensive_in_progress_flag:0 "Zaten Bir Taarruz Hazırlanıyor"
 SPR_primo_de_rivera_first_speech:0 "Primo de Rivera ilk konuşmasını yaptı"
 SPR_primo_de_rivera_speech_mission:0 "Primo de Rivera'nın Konuşması"
 SPR_primo_de_rivera_speech_mission_desc:0 "Falange Española'nın kurucularından José Antonio Primo de Rivera, insanları Milliyetçilerin sancağı altına çeken ve sivil huzursuzluğu kışkırtan kışkırtıcı bir konuşma yapmayı planlıyor."
