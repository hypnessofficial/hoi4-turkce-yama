 SPA_sway_leader_loyalty_desc:0 "Doğru ikna yöntemleriyle İspanyol ordusundaki önde gelen subaylar arasındaki desteğimizi pekâlâ genişletebiliriz. Zamanı geldiğinde onların desteğine sahip olmak paha biçilmez olabilir."
