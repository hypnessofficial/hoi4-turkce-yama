 adu_mediterrenean_emirates:0 "Sicilya Emirliği'ni Yeniden Kur"
 adu_mediterrenean_emirates_desc:0 "Mağribi nüfuzunun Akdeniz üzerindeki zirvesinde, adalar birçok İslami Emirliğe ev sahipliği yapıyordu. Sicilya, Girit ve Kıbrıs artık Endülüs'ün elindeyken, bu toprakları bir kez daha haklı Mağribi hükümdarlarına geri verebiliriz."
 adu_northern_expansion:0 "Kuzey Genişlemesi"
 adu_northern_expansion_desc:0 "Halifelik genişti ve yönetimini Orta Doğu ve İberya'nın çok ötesine yaydı. Uzun zaman önce, Gürcistan, Azerbaycan ve Maveraünnehir Halifeliği evleri olarak adlandırıyordu ve kaybedilenleri restore etme zamanı geldi."
 adu_recreate_rashid_expansion:0 "Raşidi Genişlemesi"
 adu_recreate_rashid_expansion_desc:0 "Arabistan'ın Emevi yönetiminden önce, Raşidiler Arap dünyasında hüküm sürüyordu ve onların yönetimi altında Halifelik İran ve Hindistan'a yayıldı. Bu eski fethi yeniden yaratarak, İran'ı ve efsanevi Hindistan topraklarını devletimizle yeniden birleştirebiliriz."
 adu_restore_sultanate_of_africa:0 "Afrika Sultanlığı'nı Yeniden Kur"
 adu_restore_sultanate_of_africa_desc:0 "Uzun zaman önce, Kuzey Afrika Mağribileri tek bir sultanlıkta birleşmişti; Emevi Halifeliği'nin önemli bir kolu olan Afrika Sultanlığı. Endülüs'ün restore edilmesi ve tüm Mağribi halklarının artık devletimiz içinde bir arada yaşamasıyla, Mağribi kimliğini birleştirebiliyoruz."
 adu_restore_umayyad_caliphate:0 "Emevi Halifeliğini Yeniden Yarat"
 adu_restore_umayyad_caliphate_desc:0 "Sonunda, kutsal şehirler Bağdat, Mekke ve Kudüs tek bir devlette birleşti. Arabistan'ın kalbi şimdi bizim elimizdeyken, kendimizi Mağribilerin birliğinden daha fazlası, restore edilmiş Halifelik; tüm İslami halklar ve kültürler için vatan olarak ilan edebiliriz."
