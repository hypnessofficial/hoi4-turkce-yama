 POR_mozambique_overseas_territory:0 "Mozambik'i Entegre Et"
 POR_naval_blockade:0 "Deniz Ablukası"
 POR_naval_blockade_desc:0 "Portekiz hükûmeti, Britanya deniz ablukasından kaçmayı ve birliklerimiz için malzeme taşımayı teklif etti. Savaş çabamıza bu yardım, çatışmada kilit rol oynayabilir."
