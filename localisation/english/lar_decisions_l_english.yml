 SPR_NATIONALISTS_INSTRUCTIONS:0 "Çok fazla oyalanmamamız zorunludur, aksi takdirde Cumhuriyetçilere savunmalarını hazırlamaları için zaman tanımış oluruz."
 SPR_REPUBLICANS_INSTRUCTIONS:0 "Milliyetçi ayaklanmasına hazırlanmak için zaman kazanmak amacıyla iç savaşı olabildiğince geciktirmeliyiz."
 SPR_anarchist_uprising_mission:0 "Yaklaşan Anarşist Ayaklanması"
 SPR_anarchist_uprising_mission_desc:0 "Anarşist 'müttefiklerimiz' yersiz bağımsızlık ve özerklik beklentileriyle hareket etmeye devam ediyorlar. Anarşistlerin elindeki bölgeleri savaş için ne kadar organize etmeye çalışırsak, onlar da halklarını o kadar meşru İspanyol hükûmetine karşı kışkırtıyorlar. Eğer bu durum daha da tırmanırsa, tam teşekküllü bir Anarşist ayaklanmasıyla başa çıkmaya hazır olmalıyız."
 SPR_civil_war_offensives:0 "İç Savaş Taarruzları"
 SPR_civil_war_offensives_desc:0 "Cephe birliklerimizi ikmal etme kabiliyetimizdeki sorunlar, düşman kalelerine karşı etkili ilerlemeler yapmamızı zorlaştırıyor. İleriyi planlamalı ve herhangi bir büyük taarruza hazırlanmadan çok önce cephe teçhizat depolarını yeterince genişletmeliyiz."
 SPR_civil_war_offensives_map_category_name:0 "Taarruzlarınızı hazırlamak için bir yer seçin."
 SPR_concessions_to_the_anarchists:0 "Anarşistlere Tavizler"
 SPR_concessions_to_the_left:0 "Sol Kanada Tavizler"
 SPR_concessions_to_the_left_desc:0 "Grevcilerin endişeleri için geçerli nedenleri var. Bunları ele alacağımıza söz vereceğiz ve bu arada yasa dışı arazi işgali, küçük sosyal suçlar ve hırsızlık gibi konularda kovuşturma yapmama şeklinde tavizler vereceğiz. Bu, sosyal huzursuzluğu bir miktar azaltmaya hizmet etmelidir."
 SPR_disband_the_army_mission_tt:0 "§Gİç savaşın başlangıcında Cumhuriyetçi ittifaka katılacak ordunun oranını §Y%50§!'den §Y%80§!'e düşürür ve Afrika Ordusu tümenlerimizin sayısını §Y5§!'ten §Y3§!'e indirir.§!\nBu §Y%80§!'lik kısım §Rterhis edilir§!.\n\n§RBu, iç savaşın derhal başlamasına neden olacaktır!§!\n"
