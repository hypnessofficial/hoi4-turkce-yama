 SPR_reassign_disloyal_leader_desc:0 "Askerî liderlerimizden bazılarının sadakatlerinin sorgulandığına dair söylentiler kulağımıza geldi. Komplo kurmaya devam etmelerini engellemek için onları uzak görevlere yeniden atamamız iyi olacaktır."
