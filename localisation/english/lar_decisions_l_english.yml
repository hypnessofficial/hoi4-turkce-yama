 SPR_suppress_the_strikes_mission:0 "Grevleri Bastır"
 SPR_suppress_the_strikes_mission_desc:0 "Sağcı milisler ve grev kırıcılar, hoşnutsuz işçilerimize baskı uygulayarak onları işlerine geri dönmeye zorluyor ve hükûmetin vatandaşlarını koruma kabiliyetine olan sosyal huzursuzluğu ve hayal kırıklığını artırıyor."
 SPR_sway_leader_loyalty_mission:0 "Lider Sadakatini Etkile"
 SPR_sway_leader_loyalty_mission_desc:0 "Milliyetçi komplocular askerî liderliğimiz arasındaki desteklerini genişletmeye çalışıyorlar ve çeşitli kişilere cazip tekliflerle yaklaşıldığına dair duyumlar aldık... Sadece hiçbirini kendi taraflarına çekmeyi başaramamaları için dua edebiliriz."
 SPR_the_inevitable_civil_war:0 "Kaçınılmaz İç Savaş"
 SPR_the_inevitable_civil_war_desc:0 "Seçimlerin ardından bir iç savaş neredeyse kesinleşti. [Root.GetSCWsideloc] İnisiyatifi ele almalı ve ülkenin garnizonları üzerindeki kontrolü sağlamalıyız."
 SPR_the_inevitable_civil_war_map_category_name:0 "Garnizon nüfuzunuzu yönetmek için bir yer seçin."
