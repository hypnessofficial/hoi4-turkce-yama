 POR_evade_blockade_with_portuguese_convoys_desc:0 "Kendi gemilerimizin ulaşamadığı yerlere mal taşımak için Portekiz konvoylarını kullanma teklifini kabul edeceğiz. Birliklerimizin morali, temel ikmal sorunlarının nihayet çözüldüğünü gördüklerinde artacaktır."
