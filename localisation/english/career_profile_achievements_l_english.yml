 CAREER_PROFILE_BACKUP_QUOTE_01:0 "\"Ben Tanrı'nın Dövüşüyüm. Büyük günahlar işlememiş olsaydın, Tanrı sana benim gibi bir ceza göndermezdi.\"\n\n- Cengiz Han"
 CAREER_PROFILE_BACKUP_QUOTE_02:0 "“Üç tür insan vardır: Hareketsiz olanlar, hareket edebilenler ve onları hareket ettirenler.”\n\n- Benjamin Franklin'e atfedilmiştir"
 CAREER_PROFILE_BACKUP_QUOTE_03:0 "“...fırtınayı dindiren ve gök gürültüsünü yöneten adamlar.”\n\n- Teddy Roosevelt"
 CAREER_PROFILE_BACKUP_QUOTE_04:0 "\"Diğer adama, o bakmıyorken, onu en çok incitecek yerden, mümkün olduğu kadar çabuk ve olabildiğince sert bir şekilde vurun.\"\n\n- Sir William Slim"
 CAREER_PROFILE_BACKUP_QUOTE_05:0 "\"Eve gittiğinizde onlara bizden bahsedin ve onların yarınları için bugünümüzü verdiğimizi söyleyin.\"\n\n- John Maxwell Edmonds"
 CAREER_PROFILE_BACKUP_QUOTE_06:0 "\"Uğrunda savaşmaya değer her şey, uğruna kirli bir şekilde savaşmaya da değer.\"\n\n- Bilinmiyor"
 CAREER_PROFILE_BACKUP_QUOTE_07:0 "“En kısa zamanda elimden geldiğince çok şeyle geri döneceğim. Bu arada, beklemek zorundasın!”\n\n- Douglas MacArthur'a atfedilmiştir"
 CAREER_PROFILE_BACKUP_QUOTE_08:0 "“Bir yerlerden düşman topçusu uyandı ve mermiler geldi - geldiklerinde onları sayabiliyordunuz. Ve sonra onları sayamıyordunuz; düzenli bir sırayla düşmüyorlardı, bir-iki-üç, ama nerede olduğumuzun bilincinde olarak - sola, sağa, öne, arkaya, devasa adamlar tarafından kaldırılan devasa çöp kutuları gibi çarpıyorlardı. Kırılan toprak üzerimize düştü, çatlayan kayalar yamaçların kırılmamış taşlarına sıçradı. Büyüyen gecenin gürültüsü kulaklarımızdaydı.”\n\n- Alvah Bessie, Savaştaki Adamlar: İspanya'da Bir Amerikan Hikayesi (1939)"
 CAREER_PROFILE_BACKUP_QUOTE_09:0 "\"Ey, kör edici bir şimşek bir milyon güneşin tohumunu saçtığında nereye gideceksin? Peki kül yağmurunda ne yapacaksın? Peki ama kör edici şimşek vücudunun sımsıkı örülmüş ağını bozup güzel kemiklerini gün yüzüne çıkardığında nasıl olacak? Kül yağmurunda ne giyeceksin?\"\n\n- \"Terminal Konuşması\"ndan alıntı, Charles Martin"
 CAREER_PROFILE_BACKUP_QUOTE_10:0 "“İskender, Hannibal, Sezar, Gustavus, Turenne, Eugene ve Frederic'in seferlerini tekrar tekrar okuyun. Büyük bir general olmanın ve savaş sanatının sırlarına hakim olmanın tek yolu budur.”\n\n- Napolyon Bonapart"
 CAREER_PROFILE_BACKUP_QUOTE_11:0 "“Ben siyaset ve savaş üzerine çalışmalıyım ki oğullarım matematik ve felsefe üzerine çalışma özgürlüğüne sahip olabilsinler... çocuklarına resim, şiir ve müzik üzerine çalışma hakkı vermek için.”\n\n- John Adams"
 CAREER_PROFILE_BACKUP_QUOTE_12:0 "“Koca bir deniz dolusu su, içine girmediği sürece bir gemiyi batıramaz.”\n\n- Bilinmiyor"
 CAREER_PROFILE_BACKUP_QUOTE_13:0 "“Çaldığın gibi yelken aç.”\n\n- Bilinmiyor"
 CAREER_PROFILE_BACKUP_QUOTE_14:0 "“Onlar çok kalabalık ve biz çok azız, hepsini nasıl gömeceğiz?”\n\n- Fin kış savaşı deyimi"
 CAREER_PROFILE_BACKUP_QUOTE_15:0 "“Kızıl Ordu'da korkak olmak için cesur bir adam olmak gerekir.”\n\n- Joseph Stalin"
 CAREER_PROFILE_BACKUP_QUOTE_16:0 "\"Adın bilinmiyor. Senedin ölümsüz.\"\n\n- Meçhul Askerin Mezarı"
 CAREER_PROFILE_BACKUP_QUOTE_17:0 "“İmparator için ölmek, sonsuza dek yaşamaktır.”\n\n- Bilinmiyor"
 CAREER_PROFILE_BACKUP_QUOTE_18:0 "“Sun Tzǔ dedi ki: Pratik savaş sanatında en iyi şey, düşmanın ülkesini bütün ve sağlam olarak ele geçirmektir; onu parçalamak ve yok etmek o kadar iyi değildir.”\n\n- Sun Tzu, Savaş Sanatı"
 CAREER_PROFILE_BACKUP_QUOTE_19:0 "“Tüm insanlar kardeştir, tıpkı dünyadaki denizler gibi; Öyleyse neden rüzgarlar ve dalgalar her yerde bu kadar şiddetli çarpışıyor?”\n\n- Hirohito"
 CAREER_PROFILE_BACKUP_QUOTE_20:0 "“Facta non-Verba.”\n\n- Latince “Sözler değil, eylemler”."
 CAREER_PROFILE_BACKUP_QUOTE_21:0 "“Savaş, yaşamın hiç kimsenin duymadığı bir sayıyla çarpılmasıdır.”\n\n- Sebastian Junger, Savaş"
 CAREER_PROFILE_BACKUP_QUOTE_22:0 "“Davanın haklı, savaşın da kazanılabilir olması gerekmez; ama tarih boyunca defalarca insanlar tek başlarına kaçıp hayatta kalmaktansa arkadaşlarıyla birlikte savaşta ölmeyi tercih etmişlerdir.”\n\n- Sebastian Junger, Savaş"
 CAREER_PROFILE_BACKUP_QUOTE_23:0 "“Korkuyla ilgili sorun, onun tek bir şey olmamasıdır. Korkunun bir taksonomisi vardır -endişe, dehşet, panik, önsezi- ve bir form için hazırlıklı olabilir ve başka bir form karşısında tamamen dağılabilirsiniz.”\n\n- Sebastian Junger, Savaş"
 CAREER_PROFILE_BACKUP_QUOTE_24:0 "“Siviller savaşla ilgili en travmatik şeylerden birinin savaştan vazgeçmek zorunda kalmak olduğunu kabul etmekte tereddüt ediyor. Savaş o kadar bariz bir şekilde kötü ve yanlış bir şey ki, onun iyi bir yanı olabileceği fikri neredeyse küfür gibi geliyor.”\n\n- Sebastian Junger, Savaş"
 CAREER_PROFILE_BACKUP_QUOTE_25:0 "“Savaş, sisteminize o kadar çok adrenalin pompalıyordu ki korku nadiren bir sorun oluyordu; gerçek cesaretin çok daha büyük bir göstergesi, büyük operasyonlardan önce, hayatınızı kaybetmenin sonuçlarının gerçekten batma şansı bulduğu zaman nasıl hissettiğinizdi. Benim kişisel zayıflığım korkudan çok korkunun beklentisiydi.”\n\n- Sebastian Junger, Savaş"
 CAREER_PROFILE_BACKUP_QUOTE_26:0 "“Maginot Hattı güvence altına alındı, ateşkes kabul edildi ve Polonya'yı işgal etmeyeceğine dair ondan söz aldım.”\n\n- Ferdinand Foch"
 CAREER_PROFILE_BACKUP_QUOTE_27:0 "“Askeri zihne yeni bir fikir sokmaktan daha zor olan tek şey, eski bir fikri çıkarmaktır.”\n\n- Yüzbaşı Sir Basil Liddell Hart, Savaş Üzerine Düşünceler, 1944."
 CAREER_PROFILE_BACKUP_QUOTE_28:0 "“Savaş pek çok şeydir ve heyecan bunlardan biri değilmiş gibi davranmak faydasızdır.”\n\n- Sebastian Junger, Savaş"
 CAREER_PROFILE_BACKUP_QUOTE_29:0 "“Filozoflar ve Bilim Adamları uyum sağlamanın varoluşun sırrı olduğunu göstermişlerdir. Ancak tarih, ihtiyaca göre zaman içinde değişme konusundaki başarısızlıkların bir kataloğudur. Rolleri gereği kurumların en uyumlusu olması gereken ordular, savundukları davalar pahasına en katı olanları olmuştur.”\n\n- Yüzbaşı Sir Basil Liddell Hart, Savaş Üzerine Düşünceler, 1944."
 CAREER_PROFILE_BACKUP_QUOTE_30:0 "“Değişim modern dünyayı simgeliyor. Ya siz değişimle başa çıkarsınız ya da o sizinle başa çıkar.”\n\n- General Gordon R. Sullivan."
