l_english:
 AFG_industrial_events.10.a:0 "Bu bizim stratejik çıkarımızadır."
 AFG_industrial_events.10.b:0 "[FROM.GetAdjective] iç işlerine karışmaya ihtiyacımız yok."
 AFG_industrial_events.10.desc:0 "[FROM.GetNameDef] hükümeti, yeni bulunan petrol sahalarının geliştirilmesinde onlara yardımcı olmamız karşılığında, üretilen petrole uzun vadeli imtiyazlar alacağımız ortak bir girişim önerdi. Öneri samimi görünse de, [FROM.GetAdjective] hükümetinin tutumunun değişmesi durumunda petrole erişimimizi sürdüreceğimizin garantisi yok."
 AFG_industrial_events.10.t:0 "[FROM.GetNameDefCap] Petrol İmtiyazları Teklifi"
 AFG_industrial_events.11.a:0 "Bu sanayileşme yolunda büyük bir adım olacak."
 AFG_industrial_events.11.desc:0 "[FROM.GetAdjective] hükümeti, petrol kaynaklarımızın geliştirilmesine yatırım yapmayı ve üretim başladıktan sonra uzun vadeli bir pay almayı kabul etti."
 AFG_industrial_events.11.t:0 "[FROM.GetNameDefCap] Petrol Anlaşmasını Kabul Ediyor"
 AFG_industrial_events.12.a:0 "Proje için başka bir ortak bulacağız."
 AFG_industrial_events.12.desc:0 "Dar görüşlü [FROM.GetAdjective] hükümeti, petrol kaynaklarımızın ortak geliştirilmesi teklifimizi reddetti."
 AFG_industrial_events.12.t:0 "[FROM.GetNameDefCap] Petrol Anlaşmasını Reddediyor"
 AFG_industrial_events.13.a:0 "Bir risk aldık ve kaybettik."
 AFG_industrial_events.13.b:0 "O kaynaklar zorla geri alınacak."
 AFG_industrial_events.13.desc:0 "[FROM.GetAdjective] hükümeti, petrol endüstrisini millileştirdi ve bizim büyük yatırımlarımıza rağmen, millileştirme, üzerinde anlaştığımız uzun vadeli petrol imtiyazlarının derhal sona ermesine yol açtı. Bölge şimdi bizim cevabımızı bekliyor."
 AFG_industrial_events.13.t:0 "[FROM.GetNameDefCap] Petrol Endüstrisini Millileştiriyor"
 AFG_industrial_events.14.a:0 "Baskıya boyun eğmeyiz."
 AFG_industrial_events.14.desc:0 "Kibirli [FROM.GetAdjective] rejimi, kendi halkımızın yararına doğal kaynaklarımızı kullanmamızdan dolayı hükümetimizi devirmeye kararlı olduklarını açıkladı. Tehditlerini nasıl gerçekleştirecekleri henüz belli değil, fakat topraklarımıza askeri bir saldırıya karşı hazırlık yapmalıyız."
 AFG_industrial_events.14.t:0 "[FROM.GetName] [ROOT.GetName]'a Savaş İlan Etti"
 AFG_industrial_events.15.a:0 "Konu kapanmıştır."
 AFG_industrial_events.15.desc:0 "[FROM.GetNameDef] hükümeti, petrol endüstrisinin millileştirilmesiyle ilgili sert açıklamalarda bulundu. Ancak, konuyu daha fazla ileriye taşımak istediklerine dair bir işaret yok."
 AFG_industrial_events.15.t:0 "[FROM.GetNameDefCap] Millileştirmeye Pek Direnmedi"
 AFG_industrial_events.16.a:0 "Beklenen buydu."
 AFG_industrial_events.16.desc:0 "Son zamanlarda iki ülke arasındaki düşmanlıklar nedeniyle, [FROM.GetNameDef] hükümeti ülkemizdeki petrol imtiyazlarımızı askıya aldı. Düşmanlıklar sona erse bile, muhtemelen kendi kaynaklarını kontrol etmek isteyeceklerdir."
 AFG_industrial_events.16.t:0 "[FROM.GetAdjective] Petrol İmtiyazı Askıya Alındı"
 AFG_industrial_events.20.a:0 "Bölgedeki etkimizin güçlenmesi önemli."
 AFG_industrial_events.20.b:0 "[FROM.GetNonIdeologyName] uzun vadeli planlarımızda yer almıyor."
 AFG_industrial_events.20.desc:0 "[FROM.GetAdjective] hükümeti ülkede yabancı yatırımı artırmak için bir politika izliyor ve ilgimiz olup olmadığını sordu. Ekonomik olarak bu anlaşmadan çok büyük bir çıkarımız olmasa da, [FROM.GetAdjective] hükümetini kendi düşünce tarzımıza etkilemek için mükemmel bir fırsat olabilir."
 AFG_industrial_events.20.t:0 "[FROM.GetName] Yatırım Fırsatı"
 AFG_industrial_events.21.a:0 "Harika haber!"
 AFG_industrial_events.21.desc:0 "[FROM.GetNameDef]'deki dostlarımız, ülkemizin sanayileşmesine önemli miktarda para yatırma niyetlerini açıkladı. Bu bizim için ekonomik olarak çok faydalı olsa da, [FROM.GetAdjective]’lerin politikamızı fazla etkilememesi için tetikte olmalıyız."
 AFG_industrial_events.21.t:0 "[FROM.GetAdjective] Hükümeti Yatırımı Duyurdu"
 AFG_industrial_events.22.a:0 "$bftb_greece.194.a$"
 AFG_industrial_events.22.desc:0 "$bftb_greece.194.desc$"
 AFG_industrial_events.22.t:0 "$bftb_greece.194.t$"
 AFG_industrial_events.30.a:0 "Nehir üzerindeki gelişmeler konusunda [AFG.GetNonIdeologyName] ile müzakere talep edeceğiz."
 AFG_industrial_events.30.b:0 "Şu anda diplomatik bir krizi göze alamayız."
 AFG_industrial_events.30.desc:0 "Son yıllarda, [FROM.GetAdjective] hükümeti nehirlerinde birçok baraj ve sulama projesi başlattı. Bu projeler, doğudaki illerimize akan Helmand Nehri'nin akışında bazı değişikliklere yol açtı. Sınırdan akan su miktarı her yıl gözle görülür şekilde azalıyor ve halkımız bu devam ederse nehirden artık yararlanamayacakları endişesini taşıyor. Bunu kendi içimizde mi çözmeliyiz, yoksa [FROM.GetAdjective]lerle bu konuyu gündeme mi getirmeliyiz?"
 AFG_industrial_events.30.t:0 "[FROM.GetNameDefCap] Helmand Nehri'nin Akışını Değiştiriyor"
 AFG_industrial_events.31.a:0 "Belki de bir su antlaşması yapabiliriz?"
 AFG_industrial_events.31.b:0 "Su bizimdir, onunla istediğimizi yapabiliriz."
 AFG_industrial_events.31.desc:0 "[FROM.GetNameDefCap] hükümeti, Helmand Nehri'nde yaptığımız son değişiklikler hakkında müzakereler talep etti. Barajlarımızın ve sulama sistemlerimizin sınırdan akan suyun tehlikeli seviyelere düşmesine yol açtığını iddia ediyorlar. Kabinemizde bazıları, sınır ötesine suyun akışını düzenleyecek bir antlaşma yapılmasını önerdi. Bu, nehir üzerindeki mevcut avantajlarımızın azalması anlamına gelse de, sınır ötesindeki [FROM.GetAdjective] halkının yaşadığı olumsuz etkiyi de azaltacaktır."
 AFG_industrial_events.31.t:0 "[FROM.GetAdjective] Hükümeti Nehir Müzakereleri Talep Ediyor"
 AFG_industrial_events.32.a:0 "Makul görünüyor."
 AFG_industrial_events.32.b:0 "Yalnızca yapılan tüm değişikliklerin tamamen geri alınması bizi memnun eder."
 AFG_industrial_events.32.desc:0 "[FROM.GetNameDefCap] hükümeti, ülkelerimiz arasında bir su antlaşması yapılmasını önerdi. Bu antlaşma, sulama projeleri için kullanabilecekleri su miktarını düzenleyecek ve sınırdan bize minimum bir su akışını garanti edecek. Teklifler makul görünse de, bu geçmişte elde ettiğimiz su miktarına göre bazı kayıpları kabul etmemiz anlamına gelecektir."
 AFG_industrial_events.32.t:0 "[FROM.GetAdjective] Hükümeti Su Antlaşması Teklif Ediyor"
 AFG_industrial_events.33.a:0 "Askeri tırmandırmayı göze alacak kaynağımız yok."
 AFG_industrial_events.33.b:0 "O zaman durumu güç kullanarak düzelteceğiz."
 AFG_industrial_events.33.desc:0 "[FROM.GetNameDefCap] hükümeti, Helmand Nehri'ndeki gelişmeler hakkında daha fazla müzakereyi reddetti ve kendi topraklarından geçen suyun kendilerine ait olduğunu öne sürdü. Şu anda geri adım atmak, gelecekte suyun tamamen kesilmesini cesaretlendirebilir. Ancak, daha fazla tırmandırmak için askeri müdahale gerekebilir."
 AFG_industrial_events.33.t:0 "[FROM.GetNameDefCap] Daha Fazla Müzakereyi Reddediyor"
 AFG_industrial_events.34.a:0 "Bir kriz önlendi."
 AFG_industrial_events.34.desc:0 "[FROM.GetAdjective] hükümeti, minimum su akışını sınırdan onlara garanti etmemiz şartıyla bir su antlaşmasını kabul etti. Bu, barajlarımızı artık tam kapasite kullanmamızı engelleyecek olsa da, en azından yakın gelecekte Helmand Nehri üzerinde bir çatışma riskini ortadan kaldıracaktır."
 AFG_industrial_events.34.t:0 "[FROM.GetNameDefCap] Su Antlaşmasını Kabul Ediyor"
 AFG_industrial_events.35.a:0 "Bu durumun daha fazla büyümesine izin veremeyiz."
 AFG_industrial_events.35.b:0 "Mantıklı olamıyorlarsa, müzakereleri sürdürmenin anlamı yok."
 AFG_industrial_events.35.desc:0 "[FROM.GetNameDefCap], herhangi bir antlaşmayı kabul etmeyi reddetti ve bunun yerine nehrin akışını azaltan tüm projelerin tamamen geri alınmasını talep ediyor. Reddedersek güç kullanmaya hazır oldukları anlaşılıyor."
 AFG_industrial_events.35.t:0 "[FROM.GetNameDefCap] Su Antlaşmasını Reddediyor"
 AFG_industrial_events.36.a:0 "Zamanı gelmişti."
 AFG_industrial_events.36.desc:0 "[FROM.GetAdjective] hükümeti, Helmand Nehri'nde yaptığı birçok değişikliği geri almayı kabul etti. Bu, şüphesiz bize karşı büyük bir hoşnutsuzluğa neden oldu, ancak en azından şimdilik silahlı bir çatışmayı önledik."
 AFG_industrial_events.36.t:0 "[FROM.GetAdjective] Helmand’daki Değişiklikleri Geri Almayı Kabul Etti"
 AFG_industrial_events.37.a:0 "Ne saçma bir tırmanış."
 AFG_industrial_events.37.desc:0 "Sınırımız boyunca [FROM.GetAdjective] silahlı kuvvetlerinin Helmand Nehri Vadisi'ni işgal etmek için seferber olduğu bildiriliyor. Görüşmelerin çökmesinin ardından başka seçeneğimiz kalmadı, biz de kendi kuvvetlerimizi seferber edeceğiz."
 AFG_industrial_events.37.t:0 "[FROM.GetAdjective] Kuvvetleri İşgal Hazırlığında"
 AFG_industrial_events.38.a:0 "Değişiklikler şimdilik güvende görünüyor."
 AFG_industrial_events.38.desc:0 "Haftalarca süren yoğun müzakerelere rağmen, [FROM.GetAdjective]lerin şimdilik baraj ve sulama projelerimize müdahale etmekten vazgeçtiği görülüyor. İleride tekrar gündeme getirip getirmeyeceklerini zaman gösterecek."
 AFG_industrial_events.38.t:0 "[FROM.GetAdjective] Hükümeti Helmand’daki Değişiklikler Konusunda Sessiz"
 AFG_industrial_events.40.a:0 "Endişe verici bir gelişme."
 AFG_industrial_events.40.desc:0 "Yükseköğretimi genişletme çabalarımız, yeni mezunlar arasında bir tepkiye neden oldu. Mezunlar, becerilerini kullanabilecekleri işler bulamayınca hayal kırıklığına uğradı ve hayal kırıklıklarını radikal politikalara yöneltiyorlar."
 AFG_industrial_events.40.t:0 "Daha Fazla Üniversite Mezunu Radikalleşiyor"
 AFG_industrial_events.50.a:0 "Yakında özgür olacaklar!"
 AFG_industrial_events.50.desc:0 "Peştun nüfusumuzun sınır ötesi bağlantılarını kullanarak, sınırın diğer tarafındaki akrabalarını hükümet karşıtı protestolara ve yönetimimiz altında birleşme taleplerine sürüklemeyi başardık."
 AFG_industrial_events.50.t:0 "Peştun Direnişi Kök Salıyor"
 AFG_industrial_events.51.a:0 "Kaygı verici bir durum."
 AFG_industrial_events.51.desc:0 "[FROM.GetNonIdeologyName]’dan gelen kışkırtıcılar, Peştun nüfus arasında huzursuzluk çıkarmak için sınırı geçiyor gibi görünüyor. Peştunların [FROM.GetAdjective] yönetimi altında birleşmesi konuşuluyor."
 AFG_industrial_events.51.t:0 "[AFG.GetAdjective] Sınırında Peştun Direnişi"
 AFG_industrial_events.52.a:0 "Bu toprak artık yükten başka bir şey değil."
 AFG_industrial_events.52.b:0 "Burası, onların iddialarına bakılmaksızın, egemen toprağımızdır."
 AFG_industrial_events.52.desc:0 "Çoğunluğu Peştun olan bazı topraklarımızda süregelen gerilimler nedeniyle, [FROM.GetAdjective] hükümeti, sorunlu bölgelerin kontrolünü üstlenmeyi teklif edecek kadar ileri gitti. Son huzursuzluğun arkasında da onların olduğu şüphesi yaygın."
 AFG_industrial_events.52.t:0 "[FROM.GetAdjective] Hükümeti Toprak Transferi Teklif Ediyor"
 AFG_industrial_events.53.a:0 "Harika"
 AFG_industrial_events.53.desc:0 "Başka sorunlarla meşgul olan [FROM.GetNameDef] hükümeti, Peştun huzursuzluğunun kontrolden çıktığı bazı toprakları transfer etmeyi kabul etti. Ancak, [FROM.GetAdjective] komşularımızla ilişkilerimizde geri dönülemez zararlar vermiş olabiliriz."
 AFG_industrial_events.53.t:0 "[FROM.GetAdjective] Hükümeti Toprağı Transfer Ediyor"
 AFG_industrial_events.54.a:0 "Durumu daha fazla büyütmek istemiyoruz."
 AFG_industrial_events.54.b:0 "Gerekirse toprakları güç kullanarak kurtarırız."
 AFG_industrial_events.54.desc:0 "[FROM.GetNameDef] sınırında yaşanan durumu dikkatle yönettiğimiz halde, hükümetleri bize Peştun topraklarını devretmeyi reddetti. Tek seçeneğimiz, askeri müdahale tehdidiyle durumu tırmandırmak gibi görünüyor."
 AFG_industrial_events.54.t:0 "[FROM.GetNameDefCap] Toprak Transferini Reddediyor"
 AFG_industrial_events.55.a:0 "Onları yatıştırmaktan başka seçeneğimiz yok."
 AFG_industrial_events.55.b:0 "Toprağımızı ne pahasına olursa olsun savunmaya hazırız."
 AFG_industrial_events.55.desc:0 "[FROM.GetAdjective] hükümeti, sözde Peştun topraklarımızı işgal ettiğimiz için bunu kınayan bir açıklama yaptı ve gerekirse zorla toprakları kurtarmaya hazır olduklarını belirtti. Tabii ki blöf yapıyor olabilirler, ancak şu anda gerçek niyetlerini bilmiyoruz."
 AFG_industrial_events.55.t:0 "[FROM.GetNameDefCap] Savaşla Tehdit Ediyor"
 AFG_industrial_events.56.a:0 "Artık tehditlerimizi uygulama zamanı."
 AFG_industrial_events.56.b:0 "Geri adım atmamız gerek."
 AFG_industrial_events.56.desc:0 "[FROM.Capital.GetCapitalVictoryPointName]’daki inatçı ahmaklar, sınır boyunca hak ettiğimiz toprakları vermeyi reddetti. Artık tehdidimizi gerçekleştirmeli ya da uluslararası alanda prestij kaybetmeyi göze almalıyız."
 AFG_industrial_events.56.t:0 "[FROM.GetNameDefCap] Ültimatomu Reddediyor"
 AFG_industrial_events.57.a:0 "Uluslararası hukuk ve düzen için bir zafer."
 AFG_industrial_events.57.desc:0 "[FROM.GetAdjective] hükümeti nihayet mantığa geldi ve sınır boyunca yaşanan gergin bölgede taleplerinden vazgeçerek durumu tırmandırmamaya karar verdi."
 AFG_industrial_events.57.t:0 "[FROM.GetAdjective] Hükümeti Talepten Vazgeçti"
 AFG_industrial_events.58.a:0 "Bu çatışmayı sonlandıralım."
 AFG_industrial_events.58.b:0 "Onları topraklarımızdan çıkaracağız."
 AFG_industrial_events.58.desc:0 "[FROM.GetAdjective] diplomatlar, sınır boyunca tartışmalı Peştun topraklarının kendi kontrollerinde olduğunu kabul etmemiz şartıyla bize barış teklifinde bulundu. Şu anda bölgeyi işgal ettikleri için onları kısa sürede çıkarabileceğimize dair hiçbir garanti yok. Ancak, bu, [FROM.GetNameDef]’in sınırlarımızdan parça parça toprak koparabileceği bir emsal oluşturur."
 AFG_industrial_events.58.t:0 "[FROM.GetNameDefCap] Barış Teklifinde Bulundu"
 AFG_industrial_events.59.a:0 "O halde topraklarımızı savunmaya devam edeceğiz."
 AFG_industrial_events.59.desc:0 "[FROM.GetNameDef] hükümeti, son barış teklifimizi reddetti. Belli ki, bizi hak ettiğimiz topraklardan çıkarmak için hala yeterli güce sahip olduklarına inanıyorlar."
 AFG_industrial_events.59.t:0 "[FROM.GetNameDefCap] Barış Teklifini Reddediyor"
 AFG_industrial_events_31_tt:0 "§RBöyle bir karar [FROM.GetNameDefCap] ile savaşa yol açabilir!§!"
 AFG_political_events.01.a:0 "İlgi çekici bir teklif."
 AFG_political_events.01.b:0 "Bölge için alternatif planlarımız var."
 AFG_political_events.01.desc:0 "[FROM.GetNameDef] temsilcileri, Orta Asya'nın yeniden düzenlenmesi için cesur bir teklif sundu. Teklifleri, [FROM.GetAdjective] sınırı boyunca bazı eyaletlerin kontrolünü onlara devretmemizi ve [FROM.Capital.GetCapitalVictoryPointName] yönetiminde yeni bir sosyalist federasyon kurulmasını gerektiriyor. Bu, bölgede güçlü bir tampon devlet inşasına yardımcı olmamıza ve askerimizin başka yerlere konuşlandırılması için savunma yükünü hafifletmemize olanak sağlayabilir."
 AFG_political_events.01.t:0 "Orta Asya Birleşme Teklifi"
 AFG_political_events.02.a:0 "Harika!"
 AFG_political_events.02.desc:0 "[FROM.GetNameDefCap], Orta Asya'nın kontrolümüz altında tek bir siyasi varlık olarak birleşmesi teklifimizi kabul etti. Onlarca yıllık istikrarsızlıktan sonra halkımız için yeni bir çağ başlıyor gibi görünüyor."
 AFG_political_events.02.t:0 "[FROM.GetName] Teklifi Kabul Etti"
 AFG_political_events.03.a:0 "Önümüze sonsuza kadar engel olamazlar."
 AFG_political_events.03.desc:0 "[FROM.GetNameDefCap], Orta Asya'nın kontrolümüz altında tek bir siyasi varlık olarak birleşmesi teklifimizi reddetti. Bu büyük bir gerileme olsa da, hayal henüz ölmedi. Doğru zamanı bekleyip yeniden harekete geçmeliyiz."
 AFG_political_events.03.t:0 "[FROM.GetName] Teklifi Reddetti"
 AFG_political_events.10.a:0 "Bu girişimi destekliyoruz."
 AFG_political_events.10.b:0 "Bir efendiden kurtulduk, bir başkasına ihtiyacımız yok."
 AFG_political_events.10.desc:0 "[FROM.GetNonIdeologyName] hükümeti, iki ulusumuzu güçlendirmek amacıyla bir konfederasyon kurmamız için ilginç bir teklif sundu. Bu, iki ülkenin sınırlarını birbirine açarak tek bir ekonomik pazar ve dünya sahnesinde ortak dış politika oluşturmak anlamına gelecek. Ancak bu, sonunda kendi hareket özgürlüğümüzü kısıtlayacaktır."
 AFG_political_events.10.t:0 "[FROM.GetNameDefCap] Konfederasyon Teklif Ediyor"
 AFG_political_events.100.a:0 "Uzun vadeli barış getiriyorsa, kim karşı çıkabilir?"
 AFG_political_events.100.b:0 "Böyle bir şey yapmayacağız."
 AFG_political_events.100.desc:0 "[FROM.GetNameDef] hükümeti, Doğu [PER.GetNonIdeologyName]’de bir tampon devlet kurmanın stratejik gerekliliğini belirledi. Bu amaçla, Horasan devletinin kurulmasını kolaylaştırmak için Doğu İran’daki bazı toprakların devrini resmen talep ettiler. Yeni tampon devletin bölgede istikrar sağlayacağını savunuyorlar."
 AFG_political_events.100.t:0 "Horasan Tampon Devleti"
 AFG_political_events.101.a:0 "Batı kanadımız sonunda güven altında."
 AFG_political_events.101.desc:0 "[FROM.GetNameDef] hükümeti, belirlenen toprakların Doğu [PER.GetNonIdeologyName]’de devrini kabul etti. Bu devir, planlandığı gibi Horasan tampon devletinin kurulmasına olanak sağlayacak."
 AFG_political_events.101.t:0 "[FROM.GetNameDefCap] Tampon Devlet Kurulmasını Kabul Etti"
 AFG_political_events.102.a:0 "Gündemimizi başka yollarla sürdüreceğiz."
 AFG_political_events.102.desc:0 "[FROM.GetNameDef] hükümeti, Doğu [PER.GetNonIdeologyName]’deki talep edilen toprakların devrini üzülerek reddetti. Böyle bir devrin sonuçları ve bölgesel istikrar üzerindeki potansiyel etkileri konusunda endişelerini dile getirdiler."
 AFG_political_events.102.t:0 "[FROM.GetNameDefCap] Tampon Devlet Teklifini Reddediyor"
 AFG_political_events.11.a:0 "Harika!"
 AFG_political_events.11.desc:0 "[FROM.GetAdjective] hükümeti, konfederasyon teklifimizi kabul etti. Artık iki siyasi ve ekonomik sistemimizi tek bir çatı altında bütünleştirme sürecine başlayabiliriz. Umarız bu, yakın gelecekte bölgesel rakiplerimiz için caydırıcı olur."
 AFG_political_events.11.t:0 "[FROM.GetName] Konfederasyonu Kabul Etti"
 AFG_political_events.110.a:0 "Onları uzak tutacaksa, kabul edelim."
 AFG_political_events.110.b:0 "Bir karış toprak bile vermeyiz."
 AFG_political_events.110.t:0 "[FROM.GetNameDefCap] Toprak Talep Ediyor"
 AFG_political_events.111.a:0 "Harika!"
 AFG_political_events.111.desc:0 "[FROM.GetNameDefCap], talep ettiğimiz eyaletleri devretmeyi kabul etti. On yıllarca süren anlaşmazlıktan sonra, nihayet kayıp halkımızı tekrar kucaklayabiliriz."
 AFG_political_events.111.t:0 "[FROM.GetNameDefCap] Toprak Vermeyi Kabul Etti"
 AFG_political_events.112.a:0 "Denenmeye değerdi."
 AFG_political_events.112.b:0 "O halde zorla alacağız."
 AFG_political_events.112.desc:0 "[FROM.GetNameDefCap], talep ettiğimiz eyaletleri devretmeyi reddetti. Görünen o ki, gelecekte hak ettiğimiz toprakları geri almak için başka yollar bulmamız gerekecek."
 AFG_political_events.112.t:0 "[FROM.GetNameDefCap] Toprak Vermeyi Reddediyor"
 AFG_political_events.12.a:0 "Kaçırılmış bir fırsat."
 AFG_political_events.12.desc:0 "[FROM.GetAdjective] hükümeti, iki ülkemizden oluşan bir konfederasyon kurma teklifimizi reddetti. Bu, dış politikamızda büyük bir gerilemeye neden oldu ve [FROM.GetNameDef] ile uzun vadeli ilişkimizin nasıl olacağına dair endişe yarattı."
 AFG_political_events.12.t:0 "[FROM.GetName] Konfederasyonu Reddetti"
 AFG_political_events.120.a:0 "Bu, bölgedeki stratejik hedeflerimizle örtüşüyor."
 AFG_political_events.120.b:0 "[SOU.GetAdjective] kanı [FROM.GetNonIdeologyName]’de asla dökülmez!"
 AFG_political_events.120.desc:0 "[AFG.GetNonIdeologyName]’deki komünist hareketin temsilcileri, büyüyen devrimlerinde destek istemek için bize başvurdu. Zor durumdaki bu ülkenin sosyalist bir ekonomiyi kaldırıp kaldıramayacağı tartışmalı olsa da, sosyalizmin sınırlarını Orta Asya ve ötesine itmenin önemi göz ardı edilemez."
 AFG_political_events.120.t:0 "[FROM.GetNameDefCap] Destek Talep Ediyor"
 AFG_political_events.121.a:0 "Teşekkürler yoldaşlar!"
 AFG_political_events.121.desc:0 "Uluslararası dayanışma ideallerine bağlılıklarını göstermek için, [FROM.GetNameDefCap] mücadelemizde bize yardım etmeyi kabul etti. Tüm teçhizatlı gönüllü birliklerinin yakın zamanda bize gönderileceğini bildirdiler."
 AFG_political_events.121.t:0 "[FROM.GetNameDefCap] Yardıma Geliyor"
 AFG_political_events.122.a:0 "Sosyalist ideallere ihanet."
 AFG_political_events.122.desc:0 "[FROM.GetNameDefCap], yardım talebimizi reddetti. Devrimimizin erken ve başarısızlığa mahkum olduğunu savunuyorlar. Halkımız, öngörülebilir bir gelecekte [FROM.GetNameDef]’e karşı derin bir kırgınlık besleyecek gibi görünüyor."
 AFG_political_events.122.t:0 "[FROM.GetNameDefCap] Desteğini Çekiyor"
 AFG_political_events.130.a:0 "Bu girişimi destekliyoruz."
 AFG_political_events.130.b:0 "Bize böyle bir teklifi danışmak bile akılsızca."
 AFG_political_events.130.desc:0 "[FROM.GetNonIdeologyName] hükümeti, uluslarını güçlendirmek için [ROOT.GetAdjective] sınırı boyunca bazı topraklarımızla bir konfederasyon oluşturma önerisini görüşmek için bize danıştı. Sınırlarımızı ayarlamamız gerekebilir fakat bu, bölgede güçlü bir müttefik yaratmaya da yardımcı olabilir."
 AFG_political_events.130.t:0 "[FROM.GetNameDefCap] Toprak Talep Ediyor"
 AFG_political_events.131.a:0 "Harika!"
 AFG_political_events.131.desc:0 "[FROM.GetAdjective] hükümeti, konfederasyon teklifimizi kabul etti. Artık yeni topraklarımızı siyasi ve ekonomik sistemimize entegre etme sürecine başlayabiliriz. Umarız bu, yakın gelecekte bölgesel rakiplerimiz için caydırıcı olur."
 AFG_political_events.131.t:0 "[FROM.GetName] Konfederasyonu Kabul Etti"
 AFG_political_events.132.a:0 "Kaçırılmış bir fırsat."
 AFG_political_events.132.desc:0 "[FROM.GetAdjective] hükümeti, konfederasyon kurma teklifimizi reddetti. Bu, dış politikamızda büyük bir gerilemeye neden oldu ve [FROM.GetNameDef] ile uzun vadeli ilişkimizin nasıl olacağına dair endişe yarattı."
 AFG_political_events.132.t:0 "[FROM.GetName] Konfederasyonu Reddetti"
 AFG_political_events.140.a:0 "Genç ve karizmatik Mohammad Daoud Khan."
 AFG_political_events.140.b:0 "Her daim tutarlı Sardar Shah Mahmud Khan."
 AFG_political_events.140.c:0 "Gelenekçi Muhammed İbrahim Han."
 AFG_political_events.140.desc:0 "Ülkenin bu tür olaylarda tecrübesizliği nedeniyle bu seçim biraz kaotik geçti. Yine de, geniş tabanlı adaylardan bazıları öne çıktı. Sandıklar kapanırken, seçmenler şu adaydan yana oy kullandı gibi görünüyor:"
 AFG_political_events.140.t:0 "Seçim Sonuçları"
 AFG_political_events.150.a:0 "Bu bizi sadece güçlendirir"
 AFG_political_events.150.b:0 "Bu konuda bize yaklaşmaları bile aptallık"
 AFG_political_events.150.desc:0 "[FROM.GetNonIdeologyName] hükümeti, askeri ekonomilerimizi küçük bir ölçüde entegre ederek her iki ulusumuzu da güçlendirmeye yönelik bir teklifle bize başvurdu. Bu, savaş durumunda birbirimize yardım etmemizin gerekeceği anlamına geliyor, ama belki de daha yakın bir işbirliği için bu kabul edilebilir bir bedeldir?"
 AFG_political_events.150.t:0 "[FROM.GetNameDefCap] bir Savunma Antlaşması Talep Ediyor"
 AFG_political_events.151.a:0 "Mükemmel!"
 AFG_political_events.151.desc:0 "[FROM.GetAdjective] hükümeti savunma teklifimizi kabul etti. Şimdi askeri komplekslerimizi birbiriyle entegre etme sürecini başlatabiliriz. Umarız bu, yakın gelecekteki bölgesel rakiplerimiz için caydırıcı bir etki yaratır."
 AFG_political_events.151.t:0 "[FROM.GetName] Antlaşmayı Genişletmeyi Kabul Ediyor"
 AFG_political_events.152.a:0 "Kaçırılmış bir fırsat."
 AFG_political_events.152.desc:0 "[FROM.GetAdjective] hükümeti, savunma sanayilerimizi koordine etme teklifimizi reddetti ve bu nedenle [FROM.GetLeader] ile olan dostluk hayallerimiz sert bir şekilde son buldu."
 AFG_political_events.152.t:0 "[FROM.GetName] Antlaşmayı Reddediyor"
 AFG_political_events.153.a:0 "Bölgede daha fazla müttefik iyi olur."
 AFG_political_events.153.b:0 "Bu kadar uzak topraklara neden karışalım?"
 AFG_political_events.153.desc:0 "Gizli bir mesajla, [FROM.GetNonIdeologyName]'deki gelenekçi bir kabile lideri olan $AFG_faqir_of_ipi$, tahta çıkışı için destek aramak amacıyla hükümetimize ulaştı. Desteğimizle, çıkarlarımızla uyumlu güçlü bir ulus kuracağını vaat ediyor."
 AFG_political_events.153.t:0 "[AFG.GetNonIdeologyName]’den $AFG_faqir_of_ipi$ Yardım Talep Ediyor"
 AFG_political_events.154.a:0 "Bize bunu nasıl yaparlar!"
 AFG_political_events.154.desc:0 "[FROM.GetAdjective] hükümeti talebimize yanıt verdi ve $AFG_faqir_of_ipi$'ın tahta çıkmasına destek vermeyi üzülerek reddetti. Potansiyel karışıklıklara ve mevcut jeopolitik ortama ilişkin endişeleri gerekçe gösteren [FROM.GetAdjective], diğer stratejik önceliklere odaklanmaya karar verdi."
 AFG_political_events.154.t:0 "[FROM.GetNameDefCap] Planı Reddediyor"
 AFG_political_events.155.a:0 "[AFG.GetNonIdeologyName]'in geleceği bize ait!"
 AFG_political_events.155.desc:0 "Talebimize yanıt olarak, [FROM.GetName] hükümeti $AFG_faqir_of_ipi$'ın [ROOT.GetNonIdeologyName] tahtına çıkmasını desteklemeyi kabul etti. Bu destek, girişimimizin başarısını garantilemek için askeri destek ve teçhizat içerecektir."
 AFG_political_events.155.t:0 "[FROM.GetNameDefCap] Bize Destek Vermeyi Kabul Etti"
 AFG_political_events.156.a:0 "Mükemmel!"
 AFG_political_events.156.desc:0 "Daha önce anlaşıldığı üzere, iç savaşın başlamasıyla birlikte [FROM.GetAdjective] ekipmanları bize sağlandı. [ROOT.Capital.GetCapitalVictoryPointName]’deki ajanları ayrıca gizli [FROM.GetAdjective] birliklerinin mücadelede bize yardımcı olmak için yakında ülkeye ulaşacağını garanti etti."
 AFG_political_events.156.t:0 "[JAP.GetAdjective] Desteği Geldi"
 AFG_political_events.157.a:0 "Mükemmel!"
 AFG_political_events.157.desc:0 "Daha önce anlaşıldığı üzere, iç savaşın başlamasıyla birlikte [FROM.GetAdjective] ekipmanları bize sağlandı. [ROOT.Capital.GetCapitalVictoryPointName]’deki ajanları ayrıca gizli [FROM.GetAdjective] birliklerinin mücadelede bize yardımcı olmak için yakında ülkeye ulaşacağını garanti etti."
 AFG_political_events.157.t:0 "[GER.GetAdjective] Desteği Geldi"
 AFG_political_events.158.a:0 "Bölgede daha fazla müttefik iyi olur."
 AFG_political_events.158.b:0 "Bu kadar uzak topraklara neden karışalım?"
 AFG_political_events.158.desc:0 "Gizli bir mesajla, [FROM.GetNonIdeologyName]'deki gelenekçi bir kabile lideri olan $AFG_faqir_of_ipi$, tahta çıkışı için destek aramak amacıyla hükümetimize ulaştı. Desteğimizle, çıkarlarımızla uyumlu güçlü bir ulus kuracağını vaat ediyor."
 AFG_political_events.158.t:0 "[AFG.GetNonIdeologyName]’den $AFG_faqir_of_ipi$ Yardım Talep Ediyor"
 AFG_political_events.159.a:0 "Bize bunu nasıl yaparlar!"
 AFG_political_events.159.desc:0 "[FROM.GetAdjective] hükümeti talebimize yanıt verdi ve $AFG_faqir_of_ipi$'ın tahta çıkmasına destek vermeyi üzülerek reddetti. Potansiyel karışıklıklara ve mevcut jeopolitik ortama ilişkin endişeleri gerekçe gösteren [FROM.GetAdjective], diğer stratejik önceliklere odaklanmaya karar verdi."
 AFG_political_events.159.t:0 "[FROM.GetNameDefCap] Planı Reddediyor"
 AFG_political_events.160.a:0 "[AFG.GetNonIdeologyName]'in geleceği bize ait!"
 AFG_political_events.160.desc:0 "Talebimize yanıt olarak, [FROM.GetName] hükümeti $AFG_faqir_of_ipi$'ın [ROOT.GetNonIdeologyName] tahtına çıkmasını desteklemeyi kabul etti. Bu destek, girişimimizin başarısını garantilemek için askeri destek ve teçhizat içerecektir."
 AFG_political_events.160.t:0 "[FROM.GetNameDefCap] Bize Destek Vermeyi Kabul Etti"
 AFG_political_events.170.a:0 "Çok yaşa yeni Emir!"
 AFG_political_events.170.desc:0 "Mirza Hurşid Cah Bahadur birkaç gün önce ulusumuza geldi. Şimdi, Babür ve Timurlu İmparatorlukları üzerindeki hak iddiasının tanındığı ve kendisinin Afganistan'ın yeni Emiri olarak taç giydirildiği görkemli bir tören düzenleniyor. Zamanı gelince, belki de bu kadim imparatorlukların şanına hak iddia edebiliriz."
 AFG_political_events.170.t:0 "Babür Şehzadesi'nin Taç Giyme Töreni"
 AFG_political_events.171.a:0 "Çok yaşa yeni Emir!"
 AFG_political_events.171.desc:0 "Seyyid Mir Muhammed Alim Han, Sovyetler tarafından Buhara'dan sürgün edildiğinden beri Kabil'de bulunuyordu. Afganistan'ın yeni Emiri olarak taç giymesiyle, belki de onun hak iddialarını kullanarak Orta Asya'yı [SOV.GetAdjective] tehdidinden geri alabiliriz."
 AFG_political_events.171.t:0 "Buhara Emiri'nin Taç Giyme Töreni"
 AFG_political_events.172.a:0 "Uğruna savaşmaya değmez"
 AFG_political_events.172.b:0 "Kim olduklarını sanıyorlar?"
 AFG_political_events.172.desc:0 "\nBu hafta başında [FROM.GetNameDef]'e bağlı kuvvetler, bölgeyi düşmanlarının olası işgalinden koruma görevinde olduklarını belirterek Veziristan toprağımıza girdi ve işgal etti. Bu açıkça bir savaş eylemi olsa da, görünüşe göre bizimle bir kavga aramadıkları, daha ziyade dağınık Peştun halkını yeniden birleştirmeyi amaçladıkları için büyük olasılıkla görmezden gelmeyi seçebileceğimiz bir durumdur."
 AFG_political_events.172.t:0 "[FROM.GetNameDefCap] Veziristan'ı işgal etti!"
 AFG_political_events.173.a:0 "Daima istikrarlı olan $AFG_shah_mahmud_khan$"
 AFG_political_events.173.b:0 "Askeri açıdan parlak $AFG_sardar_shah_wali_khan$"
 AFG_political_events.173.c:0 "Daha ilerici $AFG_mohammed_daoud_khan$"
 AFG_political_events.173.desc:0 "Birçok kişinin $AFG_mohammad_hashim_khan$ tarafından alınan kararları sorgulaması nedeniyle, kardeşlerinden birini $AFG_mohammed_zahir_shah$'a bağlı yeni lider olarak atayarak kraliyet yönetimini güvence altına alma kararı alındı. Onun yerine kim geçirilecek?"
 AFG_political_events.173.t:0 "Yeni Bir Kraliyet Başbakanı"
 AFG_political_events.20.a:0 "Düşman etkisini azaltmak işimize yarar."
 AFG_political_events.20.b:0 "[FROM.GetNonIdeologyName] ile ilgilenmiyoruz"
 AFG_political_events.20.desc:0 "[FROM.GetNameDefCap]’ın diplomatları, ekonomilerine yatırım yapmamız için ekonomik bir teklifle bize geldiler. Sanayilerini geliştirirsek, ileride ihracattan pay alacağımızı savunuyorlar. Ayrıca, bunun tarihi olarak [SOU.GetAdjective]ler ve [ENG.GetAdjective]’in başlıca oyuncu olduğu [FROM.GetNonIdeologyName]’de onları rahatsız edeceğini açıkça belirttiler."
 AFG_political_events.20.t:0 "[FROM.GetName] Yatırım Arayışında"
 AFG_political_events.21.a:0 "Cömert bir katkı!"
 AFG_political_events.21.desc:0 "[FROM.GetAdjective] diplomatları, hükümetlerinin [ROOT.GetNonIdeologyName]’de yatırım yapmamızı desteklediğini duyurdu. Mühendisler ve girişimciler yeni sanayi tesisleri kurmak için ülkeye doğru yola çıktı."
 AFG_political_events.21.t:0 "[FROM.GetName] Ekonomimize Yatırım Yapmayı Kabul Etti"
 AFG_political_events.22.a:0 "Bunu unutmayacağız."
 AFG_political_events.22.desc:0 "[FROM.GetAdjective] diplomatları, hükümetlerinin [ROOT.GetNonIdeologyName]’e yatırım yapmayı reddettiğini açıkladı. Uzun vadeli amaçlarımızın net olmadığını ve ülkemizin sonunda düşmanlarının nüfuz alanına girebileceğinden endişe ettiklerini söylediler."
 AFG_political_events.22.t:0 "[FROM.GetName] Ekonomimize Yatırım Yapmayı Reddediyor"
 AFG_political_events.30.a:0 "Bu yeni bir başlangıç ve biz [ROOT.GetAdjective] Cumhuriyeti olacağız"
 AFG_political_events.30.b:0 "Her şeyden önce Peştunların ulusuyuz."
 AFG_political_events.30.c:0 "Demokrasi ve İslam'ın birleşimi yolumuzdur."
 AFG_political_events.30.desc:0 "Yıllarca süren siyasi reformlar ve ülke genelindeki çeşitli gruplar arasında yapılan uzlaşmalardan sonra, artık monarşinin zincirlerinden tamamen kurtulma şansımız var. Ancak ulus olarak kim olduğumuzu yeniden tanımlamalıyız."
 AFG_political_events.30.t:0 "[ROOT.GetNonIdeologyName]'in Geleceği"
 AFG_political_events.40.a:0 "Tartışacak durumda değiliz."
 AFG_political_events.40.b:0 "Bu bir blöftür ve korkutmalarına boyun eğmeyiz."
 AFG_political_events.40.desc:0 "[FROM.GetAdjective] elçiliğinden temsilciler, hükümetimize bir ültimatom verdi. Ülkemizde [FROM.GetAdjective] çıkarlarını riske atabilecek yabancı etkileri azaltmamızı, aksi takdirde hükümetimizin askeri müdahaleyle değiştirilmesini göze almamızı istiyorlar."
 AFG_political_events.40.t:0 "[FROM.GetNameDefCap] Ültimatom Verdi"
 AFG_political_events.41.a:0 "Onları dikkatle izlemeye devam edeceğiz."
 AFG_political_events.41.desc:0 "[FROM.GetAdjective] hükümeti, bölgede çıkarlarımızı zayıflatabilecek yabancı etkilerin sona erdirilmesi taleplerimizi kabul etti. Müdahalemizden hoşnut olmasalar da, yakın zamanda mücadele edecek halleri yok gibi görünüyor."
 AFG_political_events.41.t:0 "[FROM.GetNameDefCap] Taleplere Boyun Eğdi"
 AFG_political_events.42.a:0 "Onları uyumlu hale getirmek için başka yollar bulmalıyız."
 AFG_political_events.42.b:0 "Bize başka seçenek bırakmadılar."
 AFG_political_events.42.desc:0 "[FROM.GetAdjective] hükümeti, ülkelerindeki yabancı etkilerin sona erdirilmesi taleplerimizi reddetti. İç işlerine ve diğer ülkelerle yaptığı anlaşmalara karışmaya hakkımız olmadığını savundular."
 AFG_political_events.42.t:0 "[FROM.GetNameDefCap] Talepleri Reddediyor"
 AFG_political_events.43.a:0 "Durumu izlemeye devam edeceğiz."
 AFG_political_events.43.desc:0 "[FROM.GetNameDefCap]’daki büyükelçimiz, başka bir ülkenin temsilcileriyle [FROM.Capital.GetCapitalVictoryPointName]’da yakın zamanda bir anlaşma imzalandığını bildirdi. Anlaşmanın ayrıntıları belirsiz olsa da, [FROM.GetAdjective] hükümetinin bölgede çıkarlarımızı baltalamak isteyen ülkeler tarafından etkilendiğine şüphe yok."
 AFG_political_events.43.t:0 "[FROM.GetNameDefCap]'da Yabancı Müdahale"
 AFG_political_events.51.a:0 "Bölgede daha fazla müttefik iyi olur."
 AFG_political_events.51.b:0 "Bu kadar uzak topraklara neden karışalım?"
 AFG_political_events.51.desc:0 "Gizli bir mesajda, [FROM.GetNonIdeologyName]’nin eski hükümdarı $AFG_amunullah_khan$, hükümetimize tahta geri dönmesi için destek istedi. Alman desteğiyle, güçlü ve modern bir ülke kuracağına ve çıkarlarımızı gözeten bir politika izleyeceğine söz veriyor."
 AFG_political_events.51.t:0 "[AFG.GetNonIdeologyName]’den $AFG_amunullah_khan$ Yardım Talep Ediyor"
 AFG_political_events.52.a:0 "Bize bunu nasıl yaparlar!"
 AFG_political_events.52.desc:0 "[FROM.GetAdjective] hükümeti talebimize yanıt verdi ve üzüntüyle $AFG_amunullah_khan$’ın tahta geri dönmesi için destek vermeyeceklerini açıkladı. Olası karışıklıklardan ve mevcut jeopolitik ortamdan duydukları endişeyi öne sürerek, [FROM.GetAdjective] başka stratejik önceliklere odaklanmaya karar verdi."
 AFG_political_events.52.t:0 "[FROM.GetNameDefCap] Planı Reddediyor"
 AFG_political_events.53.a:0 "[AFG.GetNonIdeologyName]'in geleceği bize ait!"
 AFG_political_events.53.desc:0 "Talebimize karşılık olarak, [FROM.GetName] hükümeti $AFG_amunullah_khan$’ın [ROOT.GetNonIdeologyName] tahtına geri dönmesini desteklemeyi kabul etti. Bu destek, başarı şansımızı artırmak için askeri destek ve teçhizat da içerecek."
 AFG_political_events.53.t:0 "[FROM.GetNameDefCap] Bize Destek Vermeyi Kabul Etti"
 AFG_political_events.54.a:0 "Harika!"
 AFG_political_events.54.desc:0 "Daha önce anlaşıldığı üzere, iç savaşın başlamasıyla birlikte [FROM.GetAdjective] ekipmanları bize sağlandı. [ROOT.Capital.GetCapitalVictoryPointName]’deki ajanları ayrıca gizli [FROM.GetAdjective] birliklerinin mücadelede bize yardımcı olmak için yakında ülkeye ulaşacağını garanti etti."
 AFG_political_events.54.t:0 "[GER.GetAdjective] Desteği Geldi"
 AFG_political_events.60.a:0 "Ortak kaderimizi kabul edeceğiz!"
 AFG_political_events.60.b:0 "[ROOT.GetAdjective] halkı adına onlar kim oluyor?"
 AFG_political_events.60.desc:0 "[FROM.GetNameDef] hükümeti, Turko-Fars birliği adını verdikleri yeni bir siyasi yapı kuruyor. Görünüşe göre, Türk ve Fars mirasını kullanarak tüm halklarımızı tek bir hükümet altında birleştirmeyi amaçlıyorlar. İlk adım ise aramızda askeri bir ittifak kurmak. Kabul edersek, zamanla liderlikleri altında daha fazla bütünleşmeyi zorlayacakları kesin."
 AFG_political_events.60.t:0 "$AFG_turko_persian_union$ Daveti"
 AFG_political_events.61.a:0 "Harika!"
 AFG_political_events.61.desc:0 "[FROM.GetNameDefCap], Turko-Fars Birliğimize katılmayı kabul etti. Birlikte, ordularımız ortak düşmanlarımıza karşı daha iyi caydırıcı olabilecek. Fakat daha da önemlisi, onların bağımsızlığını zamanla aşındırmak için bir fırsatımız var."
 AFG_political_events.61.t:0 "[FROM.GetNonIdeologyName] $AFG_turko_persian_union$’a Katıldı"
 AFG_political_events.62.a:0 "Zamanla yanlışlarını görecekler."
 AFG_political_events.62.b:0 "Bizimle değillerse, düşmanımızdırlar!"
 AFG_political_events.62.desc:0 "[FROM.GetNameDefCap], Turko-Fars Birliği üyeliğini reddetti. Tüm [TUR.GetAdjective] ve [PER.GetAdjective] halkı adına konuşmaya cüret ettiğimiz için öfkeli olduklarını belirttiler."
 AFG_political_events.62.t:0 "[FROM.GetNonIdeologyName] $AFG_turko_persian_union$’u Reddetti"
 AFG_political_events.70.a:0 "Bu dönemde çatışmayı göze alamayız."
 AFG_political_events.70.b:0 "Savaşı göze alamayız, ancak [ROOT.OVERLORD.capital.GetCapitalVictoryPointName]’dan onay almamız gerek."
 AFG_political_events.70.c:0 "Sınırlar belirlenmiştir ve daha fazla tartışılmayacaktır."
 AFG_political_events.70.desc:0 "1893’te Britanya Hindistanı ile [FROM.GetNonIdeologyName] arasında sınır olarak belirlenen Durand Hattı uzun zamandır bir anlaşmazlık kaynağıydı. [FROM.GetAdjective] milliyetçiliğinin yükselişi ve sınırın iki yanında Peştun kabilelerini birleştirme arzusu ile, [FROM.GetLeader] hükümeti Durand Hattı’nı resmen reddetti. [FROM.Capital.GetCapitalVictoryPointName], şimdi sınırların yeniden müzakere edilmesini talep ediyor; tarihi haksızlıkları ve Peştun topraklarının adaletsizce bölünmesini gerekçe gösteriyor. Anlaşmaya varamazsak savaşla tehdit ediyorlar."
 AFG_political_events.70.t:0 "[FROM.GetNonIdeologyName] Durand Hattı'nı Reddediyor"
 AFG_political_events.71.a:0 "Afganistan için muhteşem bir zafer!"
 AFG_political_events.71.desc:0 "Tüm olasılıklara rağmen, [FROM.GetNameDef] Durand Hattı’nın yeniden müzakeresini kabul etti. Büyük baskı altında ve bölgede uzun bir çatışma riskini göze almak istemeyen [FROM.GetAdjective] hükümeti, Peştun topraklarındaki haklı talebimizi tanıyarak sınırların yeniden çizilmesini kabul etti. Bu diplomatik zafer, halkımızı birleştirirken [ROOT.GetLeader]’ın meşruiyetini de güçlendirdi. [ROOT.GetNameDef] her zamankinden daha güçlü ve birleşmiş durumda."
 AFG_political_events.71.t:0 "[FROM.GetNameDefCap] Sınırların Yeniden Müzakeresini Kabul Ediyor"
 AFG_political_events.72.a:0 "Yeni bir çatışmaya karışmaktan kaçınmalıyız."
 AFG_political_events.72.b:0 "Tehditlerle toprak tavizi vermeyeceğiz."
 AFG_political_events.72.desc:0 "[AFG.GetNameDef]’deki siyasi durum kritik bir noktaya ulaştı. Hükümetleri Durand Hattı’nı resmen reddetti ve Peştun kabilelerini birleştirmek için sınırların yeniden müzakeresini talep ediyor. [AFG.GetAdjective] hükümeti, bu taleplerin karşılanmaması halinde savaş ilan edeceklerini net bir şekilde ifade etti. Masraflı ve uzun bir çatışma ihtimaline karşı, [FROM.GetNameDef], bölgesel istikrarı korumak ve daha fazla tırmanmayı önlemek için tartışmalı toprakları [AFG.GetNameDef]’e devretmeyi önerdi."
 AFG_political_events.72.t:0 "[FROM.GetNameDef] Toprak Tavizi Teklif Ediyor"
 AFG_political_events.73.a:0 "Pragmatik bir çözüm."
 AFG_political_events.73.desc:0 "Mevcut küresel gerginlikler ve bölgede olası masraflı bir çatışma göz önüne alındığında, [FROM.Capital.GetCapitalVictoryPointName], tartışmalı toprakları [AFG.GetNonIdeologyName]’e devretmenin en çıkarlarına uygun olduğuna karar verdi. İstikrarı korumak ve gereksiz bir savaştan kaçınmak için bu talimata uymamız istendi."
 AFG_political_events.73.t:0 "[FROM.GetNameDefCap] Toprak Tavizini Kabul Ediyor"
 AFG_political_events.74.a:0 "Gerekeni yapacağız."
 AFG_political_events.74.desc:0 "[AFG.GetNonIdeologyName]’den gelen Durand Hattı’nın yeniden müzakeresi ve Peştun topraklarının devredilmesi talepleri [FROM.Capital.GetCapitalVictoryPointName] tarafından kesin bir şekilde reddedildi. Çatışma ihtimaline rağmen, [FROM.GetAdjective] hükümeti, bu toprakları vermenin tehlikeli bir emsal oluşturacağına ve bölgedeki konumlarını zayıflatacağına karar verdi. [AFG.GetNonIdeologyName]’in taleplerini reddetmemiz ve gerekirse sınırı savunmaya hazırlanmamız emredildi."
 AFG_political_events.74.t:0 "[FROM.GetNameDefCap] Toprak Tavizini Reddediyor"
 AFG_political_events.75.a:0 "O zaman savaşa hazırlanmalıyız."
 AFG_political_events.75.desc:0 "Taleplerimize ve Peştun halkının birlik arzusuna rağmen, [FROM.GetNameDef] sınırların yeniden müzakere edilmesini kesin bir dille reddetti. Cevapları net; toprak devrini reddediyor ve daha fazla tırmanmaya karşı uyarıyorlar. Görünen o ki, bu toprakları kurtarmanın tek yolu çatışma olacak."
 AFG_political_events.75.t:0 "Sınır Yeniden Müzakeresini Reddettiler"
 AFG_political_events.80.a:0 "Bu çıkarımıza uygun."
 AFG_political_events.80.b:0 "Politikamızı bize dayatmaya hakları yok."
 AFG_political_events.80.desc:0 "İslam dünyasında üstünlük kurmak için cesur bir hamleyle, [FROM.GetNameDef] bir ültimatom yayınladı. Büyüyen ittifaklarına katılarak İslam ülkelerini [FROM.GetAdjective] liderliği altında birleştirmemizi talep ediyorlar. Bu talebe uymamamız halinde, tam ölçekli bir işgalle karşılaşacağımızı belirttiler."
 AFG_political_events.80.t:0 "[FROM.GetNameDefCap] Dış Politika Uyumu Talep Ediyor"
 AFG_political_events.81.a:0 "Gerçekten başka seçenekleri yoktu."
 AFG_political_events.81.desc:0 "Ültimatomumuza karşılık olarak, [FROM.GetNameDef] taleplerimize boyun eğmeyi seçti. İttifakımıza katılmayı kabul ettiler ve İslam dünyasını birleştirme konusunda [ROOT.GetNameDef]’in gücünü ve liderliğini tanıdılar. Bu stratejik hamle, etkimizin genişlemesini sağlarken bölgede egemen güç olmamızı da pekiştirdi. Artık yanımızda olduklarına göre, birleşik bir İslami cephe vizyonumuz daha da yakınlaştı."
 AFG_political_events.81.t:0 "[FROM.GetNameDefCap] Katılmayı Kabul Etti"
 AFG_political_events.82.a:0 "O halde yok edilecekler."
 AFG_political_events.82.desc:0 "Ültimatomumuza karşı gelerek, [FROM.GetNameDef] ittifakımıza katılma talebimizi reddetti. Irak hükümeti bağımsızlığında kararlı ve otoritemize boyun eğmeye istekli değil."
 AFG_political_events.82.t:0 "[FROM.GetNameDefCap] Katılmayı Reddediyor"
 AFG_political_events.85.a:0 "Bu işimize yarayabilir."
 AFG_political_events.85.b:0 "[FROM.GetAdjective] siyasetinde yer almayacağız."
 AFG_political_events.85.desc:0 "Gizli bir iletiyle, [FROM.GetAdjective] hükümeti savunma paktı için bize ulaştı. Savaş halinde birbirimizi savunacak karşılıklı bir anlaşma istiyorlar; bizimle ortaklık yapmanın düşmanlarımız karşısında stratejik faydalarını görüyorlar. Afganistan’ın İslam dünyasında baskın güç olma hedefi, daha geniş jeopolitik çıkarlarımızla örtüşebilir."
 AFG_political_events.85.t:0 "[FROM.GetNameDefCap] Koruma Talep Ediyor"
 AFG_political_events.86.a:0 "Bölge genelinde genişlemeye başlayacağız."
 AFG_political_events.86.desc:0 "[FROM.GetNameDefCap] savunma paktı önerimizi kabul etti. Bu pakt, savaş halinde iki ülkenin de birbirini desteklemesini garanti ediyor ve stratejik pozisyonumuzu güçlendiriyor. [FROM.GetNameDef]’in askeri gücü arkamızdayken, İslam dünyasında baskın güç olma hedeflerimiz artık daha ulaşılabilir."
 AFG_political_events.86.t:0 "[FROM.GetNameDefCap] Pakta Katılmayı Kabul Etti"
 AFG_political_events.87.a:0 "Zaman alacak ama hedeflerimize tek başımıza ulaşacağız."
 AFG_political_events.87.desc:0 "Özenle hazırlanmış bir yanıtla, [FROM.GetNameDef] savunma paktı teklifimizi reddetti. Olası stratejik faydaların farkında olmalarına rağmen, şu an başka ortaklıklara öncelik vermeye ve bizimle böyle bir anlaşmaya girmekten kaçınmaya karar verdiler."
 AFG_political_events.87.t:0 "[FROM.GetNameDefCap] Pakta Katılmayı Reddediyor"
 AFG_political_events.90.a:0 "Huzursuzluğu bastırmak için ek güvenlik güçleri göndermeliyiz."
 AFG_political_events.90.desc:0 "[AFG.GetNameDef], [AFG.GetLeader] yönetiminde, Orta Asya’daki cumhuriyetlerimizde gerici faaliyetleri aktif olarak teşvik ediyor. [AFG.GetAdjective] ajanlarının, yerel halk arasında huzursuzluk çıkarıp anti-[ROOT.GetAdjective] duyguları körüklediği düşünülüyor. Bu yıkıcı davranış, bölgede otoritemize doğrudan bir meydan okuma ve Orta Asya topraklarımızın istikrarını tehdit ediyor. Bu yabancı müdahaleye karşı koymalı ve cumhuriyetlerimiz üzerindeki kontrolü sürdürmeliyiz."
 AFG_political_events.90.t:0 "[AFG.GetNameDefCap], Orta Asya'da Gerici Hareketleri Destekliyor"
 AFG_political_events.91.a:0 "İsyanları bastırmalı ve otoritemizi geri kazanmalıyız."
 AFG_political_events.91.desc:0 "[AFG.GetNameDef] ile savaşın patlak vermesiyle, Orta Asya cumhuriyetlerimizde durum kritik bir noktaya ulaştı. [AFG.GetAdjective] müdahalesinden ilham alan ve mevcut çatışmadan cesaret bulan birkaç cumhuriyet, bağımsızlıklarını ilan ederek [ROOT.GetNameDef]’den ayrıldı. Bu yaygın isyan, tüm bölgenin istikrarını tehdit ediyor ve askeri kaynaklarımızı daha da zorluyor. Ayaklanmaları hızla bastırmalı ve düzeni yeniden sağlamalıyız, yoksa Orta Asya üzerindeki kontrolümüzü kaybederiz."
 AFG_political_events.91.t:0 "Orta Asya Cumhuriyetleri Ayaklandı"
 AFG_political_events.95.a:0 "Bu bölgesel güvenlik için şart, onaylandı."
 AFG_political_events.95.b:0 "[AFG.GetNonIdeologyName] bizi ilgilendirmiyor."
 AFG_political_events.95.desc:0 "[AFG.GetNonIdeologyName]’deki son iç savaş, [ROOT.Capital.GetCapitalVictoryPointName]’da alarm yarattı. Ancak, bölgeden gelen raporlar [GER.GetAdjective] birliklerinin [AFG.GetLeader]’in güçlerine yasal hükümeti devirmek için yardım ettiğini gösterdiğinden, durum daha da acil hale geldi. Bu, [AFG.GetLeader]’in [GER.GetNameDef] ile iş birliği içinde olduğuna işaret ediyor ve bu da bölgede çıkarlarımız için büyük bir tehdit anlamına gelir. Bu nedenle, silahlı kuvvetler üyeleri, yasal hükümete gizlice yardım etmemize ve ülkede faşist bir devralmayı önlememize izin verecek planlar hazırladı."
 AFG_political_events.95.t:0 "[GER.GetAdjective] Birlikleri [FROM.GetNonIdeologyName]'de Aktif"
 AFG_political_events_110_desc_balochistan:0 "[FROM.GetNameDef] hükümeti Belucistan topraklarını talep etti. Bu toprakların haklı olarak kendilerine ait olduğunu ve mevcut sınırların halklarını ve topraklarını haksızca böldüğünü savunuyorlar."
 AFG_political_events_110_desc_durand:0 "[FROM.GetNameDef] hükümeti, sınır boyunca bazı topraklarımızı talep etti. Bu toprakların haklı olarak kendilerine ait olduğunu ve mevcut sınırların halklarını ve topraklarını haksızca böldüğünü savunuyorlar."
 AFG_political_events_153_tt:0 "§Y[JAP.GetNonIdeologyName], iç savaş başladığında bize yardım etmek için silah tedarik edecek ve gönüllüler gönderecek.§!"
 AFG_political_events_51_tt:0 "[AFG.GetNonIdeologyName] iç savaşı başladığında: "
 AFG_political_events_90_tt:0 "Orta Asya eyaletlerindeki direniş hücrelerini kaldırmak için §Y[AFG_get_turkik_people_name_key]§! kararlarının kilidini açar. §REğer direniş hücrelerini kaldıramazsak ve [FROM.GetNameDef] ile savaş halindeysek, eyaletler bize isyan edecek!§!"
 AFG_political_influence_major_warning_tt:0 "[FROM.GetNameDefCap], bizim ideolojimize uymayan bir ideolojiye §R%40§!’ın üzerinde destek sağlarsa, §Y$AFG_foreign_intervention_category$§! kararları üzerinden müdahale etme ve hatta işgal etme hakkı kazanırız."
 GOE_IRQ_news.1.a:0 "İsyancıları destekliyoruz."
 GOE_IRQ_news.1.b:0 "[ENG.GetNameDef] nasıl tepki verecek?"
 GOE_IRQ_news.1.c:0 "Durumu kontrol altına almalıyız."
 GOE_IRQ_news.1.d:0 "Büyük Savaş’tan bu yana [ENG.GetAdjective] yönetimi ve bölgeye göç nedeniyle artan huzursuzluğun ardından, [PAL.GetName]'daki Arap nüfusu isyan etti. İsyancılar, [ENG.GetAdjective] kuvvetlerinin geri çekilmesini ve Filistin’in tam bağımsızlığını talep ediyor. [ENG.GetAdjective] yönetiminin bu talepleri kabul etmesi pek olası olmasa da, bölgenin idaresinin onlar için giderek daha pahalı hale geleceği açık."
 GOE_IRQ_news.1.t:0 "Büyük Filistin İsyanı"
 GOE_IRQ_news.2.a:0 "Buna göre hazırlanmalıyız."
 GOE_IRQ_news.2.d:0 "[FROM.GetNameDef] hükümeti, Ankara Antlaşması’nı resmen reddederek, bu antlaşmadaki toprak anlaşmalarını geçmişin bir kalıntısı olarak nitelendirdi. Bu karar, [TUR.GetNameDef], [PER.GetNameDef] ve [FROM.GetNonIdeologyName] arasındaki mevcut sınır ve anlaşmaları doğrudan sorguluyor ve bölgeyi siyasi bir belirsizliğe sürüklüyor. Hem [TUR.Capital.GetCapitalVictoryPointName] hem de [PER.Capital.GetCapitalVictoryPointName]'da bu meydan okuma karşısında kamuoyu öfkesi büyürken, [FROM.GetNameDef]'in tek taraflı eylemine karşı kararlı bir yanıt çağrısı yükseliyor."
 GOE_IRQ_news.2.t:0 "[FROM.GetNameDefCap] Ankara Antlaşmasını Reddediyor"
 GOE_RAJ.1.a:0 "Harika bir fikir"
 GOE_RAJ.1.b:0 "Bu fazla saldırgan olurdu"
 GOE_RAJ.1.desc:0 "Tebamız [FROM.GetNameDef], Hint alt kıtasında etkimizizi genişletmek için [BHU.GetAdjective] keşiş krallığını boyunduruk altına alma fırsatını kolluyor. Bu, iç Asya'ya bir kapı açabilir."
 GOE_RAJ.1.t:0 "[FROM.GetName], [BHU.GetName]'i İşgal Etmek İçin İzin İstiyor"
 GOE_RAJ.10.a:0 "Savaşıyoruz"
 GOE_RAJ.10.b:0 "Yemini bozmamız gerek"
 GOE_RAJ.10.desc:0 "Subhas Chandra Bose devrimini başlattı. Bir telgraf geldi; eğer sözümüzü tutacaksak, tam zamanı. \nBu, Asya’daki büyük bir rakibi tamamen saf dışı bırakma şansı olabilir."
 GOE_RAJ.10.t:0 "[FROM.GetName], [JAP.GetName]'i Yeminini Yerine Getirmeye Çağırıyor."
 GOE_RAJ.11.a:0 "Kan ve Özgürlük!"
 GOE_RAJ.11.desc:0 "[FROM.GetName] tamamen seferber oldu ve mücadelemizde bize yardım etmeye hazır."
 GOE_RAJ.11.t:0 "[FROM.GetName] Sözünü Tutuyor"
 GOE_RAJ.12.a:0 "Yemin bozanlar!"
 GOE_RAJ.12.desc:0 "Hiçbir [FROM.GetAdjective] askeri bize yardım etmeye hazır değil. Söz verilen yardım ortada yok ve Tokyo sessiz. Görünen o ki yalnızız."
 GOE_RAJ.12.t:0 "[FROM.GetName] Sözünü Bozuyor"
 GOE_RAJ.13.a:0 "Devredin"
 GOE_RAJ.13.b:0 "Aslında bize lazım"
 GOE_RAJ.13.desc:0 "Azad Hind hükümetinin, zafer sağlamlaşana kadar ön cepheden uzak, yönetim için adanmış bir başkente ihtiyacı olabilir.\nYakın zamanda ele geçirilen Andaman Adaları bunun için mükemmel olabilir."
 GOE_RAJ.13.t:0 "Andaman Adalarını [GetRajName]'e Devretmek?"
 GOE_RAJ.14.a:0 "Harika"
 GOE_RAJ.14.desc:0 "[JAP.GetAdjective], Andaman Adalarını başarıyla işgal etti. Kontrolünü bize devretmeye karar verdiler, böylece orada uygun bir hükümet kurabiliriz."
 GOE_RAJ.14.t:0 "[JAP.GetName], Andaman'ları Devrediyor"
 GOE_RAJ.14.tt:0 "Başkentimizi Andaman'a §Y$RAJ_shaheed_and_swara$j§! focusunu tamamlayarak taşıyabiliriz."
 GOE_RAJ.15.a:0 "Ne planlıyorlar?"
 GOE_RAJ.15.desc:0 "[RAJ.GetNameDefCap], Aden Limanı’nın kontrolünü devretme planlarına rağmen, limanın kontrolünü elinde tutacağını bildirdi.\nBeklendiği üzere bu, parlamentoda özellikle Winston Churchill tarafından büyük tartışmalara yol açtı, fakat şu an herhangi bir disiplin cezası planlanmıyor."
 GOE_RAJ.15.t:0 "[RAJ.GetNameDefCap], [992.GetName] üzerindeki kontrolünü sürdürüyor"
 GOE_RAJ.16.a:0 "Daha az idari yük."
 GOE_RAJ.16.desc:0 "1935 Hindistan Yönetim Yasası çerçevesinde planlandığı gibi, [GetRajAdjective] yönetimi [992.GetName]'in idari sorumluluğunu bize devretti."
 GOE_RAJ.16.t:0 "[FROM.GetNameDefCap], [992.GetName]'i Devrediyor"
 GOE_RAJ.17.a:0 "[TIB.GetName]'e garanti ver"
 GOE_RAJ.17.b:0 "Başka bir cephe açamayız."
 GOE_RAJ.17.desc:0 "Saldırgan bir hamleyle, [RAJ.GetName] [TIB.GetName] sınırında askeri hazırlık yapıyor ve kalpgahını korumak için güvenlik bölgesini genişletmek istediğini ilan ediyor. Bu, bölgede çıkarlarımızla tamamen çelişiyor."
 GOE_RAJ.17.t:0 "[RAJ.GetName], [TIB.GetName]'e Karşı Harekete Geçiyor"
 GOE_RAJ.18.a:0 "Güç kullanarak almak zorunda kalacaklar"
 GOE_RAJ.18.b:0 "Evden bu kadar uzakta savaşmak göze alınamaz"
 GOE_RAJ.18.desc:0 "[RAJ.GetNameDefCap], geçmişin boyunduruğunu atarken [RAJ.GetLeader], bölgemizdeki sömürge topraklarının geri verilmesini talep edecek kadar cüretkâr davrandı. Alt kıtayı tek güçlü bir devlet altında birleştirmek yeni ülke için en önemli mesele gibi görünüyor."
 GOE_RAJ.18.t:0 "[RAJ.GetLeader], Sömürge Topraklarının Geri Verilmesini Talep Ediyor"
 GOE_RAJ.19.a:0 "O halde zorla alacağız"
 GOE_RAJ.19.desc:0 "[FROM.GetAdjective] hükümeti, birçok uyarıya rağmen [GetRajAdjective] topraklarını teslim etmeyi inatla reddetti; mevcut durum kabul edilemez."
 GOE_RAJ.19.t:0 "[FROM.GetName], Sömürgeleri Vermeyi Reddediyor"
 GOE_RAJ.2.a:0 "Harika"
 GOE_RAJ.2.desc:0 "[FROM.GetName], toprak genişleme talebimizi onayladı. Yolumuzda çok az engel kalmalı."
 GOE_RAJ.2.t:0 "[FROM.GetName] Onaylıyor"
 GOE_RAJ.20.a:0 "Adalet yerini buldu"
 GOE_RAJ.20.desc:0 "[FROM.GetName], taleplerimizi isteksizce kabul etti. Bu tür baskıcı politikaların uzun süre kabul edilmeyeceğini, bunun yalnızca küçük bir tazminat olarak yapılabildiğini açıkça belirtiyorlar."
 GOE_RAJ.20.t:0 "[FROM.GetName], Sömürgeleri Devrediyor"
 GOE_RAJ.21.a:0 "Onlara barış öner"
 GOE_RAJ.21.b:0 "İmperyalistlere barış yok"
 GOE_RAJ.21.desc:0 "İngiliz İmparatorluğu'nun eski hükümeti teslim oldu ve hükümeti ülkeyi terk etti. Alt kıtanın kontrolünü sağlamlaştırırken eski efendilerimizle nasıl başa çıkacağımıza karar vermemiz gerek."
 GOE_RAJ.21.t:0 "Kırılan Zincir"
 GOE_RAJ.22.a:0 "Taviz yok"
 GOE_RAJ.22.b:0 "Doğu düştü"
 GOE_RAJ.22.desc:0 "Lord Linlithgow'dan gelen telaşlı bir telgraf, [RAJ.GetLeader] liderliğindeki isyancıların ülkenin kontrolünü ele geçirdiğini bildirdi.\nLinlithgow, [RAJ.GetLeader]'dan beyaz barış teklifiyle birlikte ülkeye geliyor, Hindistan üzerindeki tüm haklarımızdan feragat etmemiz koşuluyla."
 GOE_RAJ.22.t:0 "Britanya Rajı Düştü"
 GOE_RAJ.23.a:0 "Öyle olsun."
 GOE_RAJ.23.desc:0 "[ENG.GetName], barış teklifimizi reddetti. [ENG.GetAdjective] savaşı, incilerini yeniden ele geçirene kadar sürdürmek niyetinde."
 GOE_RAJ.23.t:0 "[ENG.GetName], Barış Teklifini Reddediyor"
 GOE_RAJ.24.a:0 "Kan döküldü"
 GOE_RAJ.24.desc:0 "[ENG.GetName], barış teklifimizi istemeyerek kabul etti. [GetRajName], kendi kaderini çizmekte özgür."
 GOE_RAJ.24.t:0 "[ENG.GetName], Barış Teklifini Kabul Ediyor"
 GOE_RAJ.25.a:0 "Barışı İmzala"
 GOE_RAJ.25.b:0 "Henüz bitmedi"
 GOE_RAJ.25.desc:0 "[RAJ.GetAdjective], eski efendileriyle barış imzalayarak nihayet imparatorluk yönetiminden tamamen bağımsızlık kazandı. Artık aynısını yapma, büyük bir moral zaferle ayrılma seçeneğimiz var."
 GOE_RAJ.25.t:0 "[RAJ.GetName], [ENG.GetName] ile Beyaz Barış Yaptı"
 GOE_RAJ.26.a:0 "Harika!"
 GOE_RAJ.26.desc:0 "Liderimizi başarıyla hapisten çıkardık. Bu, davamıza yapı ve motivasyon getirecek büyük bir avantaj."
 GOE_RAJ.26.t:0 "Subhas Chandra Bose Hapisten Kurtarıldı"
 GOE_RAJ.27.a:0 "Hayır, savaş devam etmeli"
 GOE_RAJ.27.b:0 "Anlaştık"
 GOE_RAJ.27.desc:0 "Zulmedenlerin zincirlerinden kurtulan [RAJ.GetNameDefCap], ülkelerimizin artık sonuçsuz bir savaşa devam etmesini istemiyor."
 GOE_RAJ.27.t:0 "[RAJ.GetNameDefCap] beyazların barışını diliyor"
 GOE_RAJ.28.a:0 "Kötüye işaret"
 GOE_RAJ.28.desc:0 "[FROM.GetName], çatışmadan çıkma girişimimizi reddetti. Bu, bizim mi yoksa onların mı sonu olacak?"
 GOE_RAJ.28.t:0 "[FROM.GetName], Beyaz Barış İmzalamayı Reddediyor"
 GOE_RAJ.29.a:0 "Victor Hope, Kont'u değiştirecek"
 GOE_RAJ.29.b:0 "Freeman-Freeman kalsın"
 GOE_RAJ.29.desc:0 "Hindistan Genel Valisi olarak Freeman-Freeman Thomas'ın dönemi sona ererken, yerine uygun bir aday mı atayacağımıza yoksa Marquess of Willingdon'ın görevini uzatıp uzatmayacağımıza karar vermeliyiz."
 GOE_RAJ.29.t:0 "[RAJ.GetName] İçin Yeni Genel Vali"
 GOE_RAJ.3.a:0 "Yazık"
 GOE_RAJ.3.desc:0 "[FROM.GetName], toprak genişleme talebimizi reddetti ve bu dönemde alt kıtayı istikrarsızlaştırmanın Kraliyet'in çıkarına olmadığını bildirdi."
 GOE_RAJ.3.t:0 "[FROM.GetName] Reddediyor"
 GOE_RAJ.30.a:0 "Nihayet özgür olacağız."
 GOE_RAJ.30.b:0 "Yok, burayı sevdik"
 GOE_RAJ.30.desc:0 "Yüzyıllarca süren yönetimin ardından [ENG.GetAdjective] yönetimi nihayet Hindistan'dan ayrılıyor. Görevliler ofislerini topluyor, sömürge yöneticileri son raporlarını hazırlıyor ve Union Jack devlet binalarından indiriliyor. Ancak geçiş pek de sorunsuz değil; sınırlar ve askeri kontrolle ilgili sorular henüz çözülmedi ve nihai bağımsızlığın biraz daha gecikmesine yol açıyor."
 GOE_RAJ.30.t:0 "Britanya Rajı Yönetimi Düşüyor"
 GOE_RAJ.30_we_are_leaving_tt:0 "§Y[RAJ.GetName]§!, yönetimi yeniden düzenlenirken ve sonunda serbest bırakılmadan önce geçici olarak [ENG.GetAdjective] kontrolü altında kalacak."
 GOE_RAJ.31.a:0 "Yapmalıyız"
 GOE_RAJ.31.a_tt:0 "Doğu Hindistan Şirketi kurulacak ve Hindistan'ın bazı kısımlarını devralacak"
 GOE_RAJ.31.b:0 "Asla"
 GOE_RAJ.31.desc:0 "[RAJ.GetName], Büyük Buhran'dan kurtulmaya çalışırken fiyat kontrolü ülkeyi istikrarsızlaştırmış gibi görünüyor. Rupiyi Sterlin'e bağlamak, her iki ülkeyi de ekonomik çalkantıya sokma riski taşıyor. \nA özel şahıslardan oluşan holding, Raj'ı iki parçaya bölme ve devletin mali yükünü hafifletme önerisiyle bize yaklaştı. Bir kısmı özel kontrolde, bir kısmı ise hâlâ kraliyetin kontrolü altında.\nHiçbir şey yapmamak, daha da kötü sonuçlar doğurabilir."
 GOE_RAJ.31.t:0 "[RAJ.GetName]'de Fiyat Kaosu"
 GOE_RAJ.32.a:0 "Devret"
 GOE_RAJ.32.b:0 "Tut"
 GOE_RAJ.32.b_tt:0 "§YAden Eyaleti§! üzerindeki kontrolümüzü sürdüreceğiz ve §YTicaret Limanı§! focusunu tamamlayabileceğiz."
 GOE_RAJ.32.desc:0 "[ENG.GetAdjective] hükümetinin planına göre, Aden Eyaleti'nin idaresini onlara devretmeliyiz; ancak istersek tutmak için bastırabiliriz."
 GOE_RAJ.32.t:0 "Aden Sorunu"
 GOE_RAJ.33.a:0 "Buna izin verilemez"
 GOE_RAJ.33.b:0 "Başka kaygılarımız var"
 GOE_RAJ.33.b_tt:0 "Gujarat ve Delhi'nin kontrolünü kaybedersek beyaz barışa zorlanacağız"
 GOE_RAJ.33.c:0 "Zafere!"
 GOE_RAJ.33.desc:0 "Uzun zaman önce tarihe karışmış bir İmparatorluğun gerçek varisleri olduğunu iddia eden bir grup, ülkenin kuzeybatısında bağımsızlık savaşı ilan etti ve hoşnutsuz fraksiyonları bayrağı altında topladı. Hindistan'ın çoğu kontrol altında olsa da bu isyan, istikrarı tehdit ediyor. Bu tarih kitaplarında bir dipnot mu olacak yoksa imparatorluğun dönüşü mü?"
 GOE_RAJ.33.t:0 "Kuzeybatı Hindistan'da Ayaklanma!"
 GOE_RAJ.34.a:0 "Felaket!"
 GOE_RAJ.34.desc:0 "[UK_INDIA.GetName]'de felaket! Batıdaki uzun savaş nedeniyle yerel yönetim çöktü. Ülkeyi kontrol altında tutmak için isyancılara toprak tavizinde bulundular. Bu isyancıları tanımasak da savaş şimdilik kaybedildi."
 GOE_RAJ.34.t:0 "[UK_INDIA.GetName] Yönetimi Çöktü"
 GOE_RAJ.35.a:0 "Beklenmedik oldu"
 GOE_RAJ.35.desc:0 "Tek bir kurşun bile atılmadan Raj sona erdi. Hindistan üzerindeki kontrolümüz sağlamlaştı ve Majestelerinin Hükümeti imparatorluk yükünden yorularak müdahale etmemeye karar verdi."
 GOE_RAJ.35.t:0 "[ENG.GetName], Bizi Serbest Bırakıyor"
 GOE_RAJ.37.a:0 "Blöflerine karşılık verelim mi?"
 GOE_RAJ.37.desc:0 "Son işgal politikalarımız, tahmin edildiği gibi direniş faaliyetlerinde artışa yol açtı. Bu durum, Majestelerinin Hükümeti’nin dikkatini çekmiş görünüyor. Sert ifadelerle yazılmış bir mektup ulaştı; Londra'nın yönetimdeki pervasız tutumumuzu tasvip etmediği açıkça belirtiliyor. Mesaj, özenle seçilmiş kelimelerle dolu olmasına rağmen tehditkar bir hava taşıyor. Açıkça uyarılıyoruz: Tutumumuzu yeniden gözden geçirmezsek, hoşlanmayabileceğimiz şekilde zorla düzeni sağlamak için müdahale edilebiliriz."
 GOE_RAJ.37.t:0 "Whitehall’dan bir uyarı"
 GOE_RAJ.38.a:0 "Şimdilik uslu duracağız."
 GOE_RAJ.38.desc:0 "Görünüşe göre [ENG.GetAdjective] hükümeti yerel yönetim anlayışımızdan fazlasıyla bıkmış durumda. İngiliz güçleri, istikrar operasyonları kisvesi altında büyük bir güçle bölgeye geldi. Direniş ağları kökünden söküldü, sorunlu unsurlar bastırıldı ve bizim nüfuzumuz dikkatlice kenara itildi.\nBirleşik Krallık, bunun geçici olduğunu, bölgenin bütünlüğünü korumak için gerekli bir müdahale olduğunu ısrarla belirtiyor. Ancak mesaj açık: Burada yönetim onlarda ve eğer yönetmek istiyorsak, bunu onların şartlarına göre yapmalıyız."
 GOE_RAJ.38.t:0 "İmparatorluk Karşılık Veriyor"
 GOE_RAJ.39.a:0 "İşçi Güvenliğini Garantile"
 GOE_RAJ.39.a_tt:0 "Güç sahibi olduğumuzda, §Y6 ay§! içinde işçi güvenliğini artırmakla yükümlü olacağız. Bunu yapmamak sendikaları rahatsız edecektir. Artırılan işçi güvenliği şunları sağlar:"
 GOE_RAJ.39.b:0 "Asgari ücreti garanti et"
 GOE_RAJ.39.b_tt:0 "Güçü ele geçirdiğimizde, §Y6 ay§! içinde asgari ücreti garanti etmekle yükümlü olacağız. Bunu yapmamak sendikaları rahatsız edecektir. Garantili asgari ücret şunları sağlar:"
 GOE_RAJ.39.c:0 "Toplantıyı sonlandır"
 GOE_RAJ.39.c_tt:0 "§Y$RAJ_royal_indian_navy_mutiny$§! tamamlanana kadar onlarla tekrar görüşemeyeceğiz."
 GOE_RAJ.39.desc:0 "Karanlık ve loş bir mahzende, Sendika liderleri hükümetin meraklı gözlerinden uzak bir şekilde bizimle görüşmeyi kabul etti. Onlar çiftçiler, fabrika işçileri ve balıkçılar gibi halkın geniş kesimleri üzerinde etkiye sahip. Mevcut hükümeti devirmek için çabalarımıza destek olmaya istekli, ancak karşılığında bazı tavizler istiyorlar.."
 GOE_RAJ.39.t:0 "Sendikalarla Görüşmeler"
 GOE_RAJ.4.a:0 "Kabul edilemez şartlar"
 GOE_RAJ.4.b:0 "Boyun eğmek zorundayız"
 GOE_RAJ.4.desc:0 "Kıtadaki güvenlik durumu hızla kötüleşirken, [FROM.GetNameDef] Krallığımızın kesin olarak kendi etki alanlarına entegre olmasını talep etti.\n[FROM.GetAdjective] hükümeti, bir miktar bağımsızlığımızın kalacağını vurgulasa da, devlete yönelik potansiyel güvenlik risklerini artık kabul edemeyeceklerini belirtiyor."
 GOE_RAJ.4.t:0 "[FROM.GetName] Boyunduruk Talep Ediyor"
 GOE_RAJ.40.a:0 "Nasıl cesaret edebilirler?"
 GOE_RAJ.40.desc:0 "Hindistan güçleri, [986.GetName] yakınlarındaki tartışmalı bölgeye geçti. Delhi’nin kuzeyindeki tepelerde ve ovalarda çatışmalar çıkıyor. Onlar, bu toprakların tarihî haklarla devrime ait olduğunu iddia ediyor. Başbakan, radyo konuşmasında Pakistan’ı sömürge bölünmesinin bir kalıntısı olarak nitelendirdi. Gerilimler artıyor ve bir çatışma yaklaşıyor gibi görünüyor."
 GOE_RAJ.40.t:0 "Delhi Kuzeyinde Sınır Çatışması"
 GOE_RAJ.41.a:0 "Devrim ilerliyor."
 GOE_RAJ.41.b:0 "Acı bir kayıp"
 GOE_RAJ.41.desc:0 "Hindistan askerleri sınır bölgelerini ele geçirdi. Pakistan kuvvetleri ağır çatışmaların ardından geri çekildi ve bölge şimdi komünist bayraklarla donatıldı. Hindistan yayınları bunu halkın zaferi olarak nitelendiriyor."
 GOE_RAJ.41.t:0 "[RAJ.GetName], [986.GetName]'i ele geçirdi"
 GOE_RAJ.42.a:0 "Nasıl cüret ederler?"
 GOE_RAJ.42.desc:0 "Hindistan kuvvetleri, [431.GetName] yakınlarındaki tartışmalı bölgeye girdi. Kalküta’nın kuzeyindeki ovalarda çatışmalar çıkıyor. Onlar, bu toprakların tarihsel haklarla devrime ait olduğunu iddia ediyorlar. Radyo konuşmasında Başbakan, Pakistan’ı sömürge bölünmesinin bir kalıntısı olarak nitelendirdi. Gerilim artıyor ve çatışma kaçınılmaz görünüyor."
 GOE_RAJ.42.t:0 "[431.GetName] bölgesinde sınır çatışması"
 GOE_RAJ.43.a:0 "Devrim ilerliyor."
 GOE_RAJ.43.b:0 "Acı bir kayıp"
 GOE_RAJ.43.desc:0 "Hindistan askerleri Kalküta’yı ele geçirdi. Pakistan kuvvetleri şiddetli çatışmaların ardından geri çekildi ve bölge üzerinde artık komünist bayraklar dalgalanıyor. Hindistan yayınları bunu halkın zaferi olarak nitelendiriyor."
 GOE_RAJ.43.t:0 "[RAJ.GetName], [431.GetName]’i ele geçirdi"
 GOE_RAJ.44.a:0 "Nasıl cüret ederler?"
 GOE_RAJ.44.desc:0 "Hint güçleri, [433.GetName] yakınlarındaki tartışmalı bölgeye girdi. Hint askerleri Tac Mahal’i ele geçirdi. Devrime tarihî haklarla ait olduğunu iddia ediyorlar. Başbakan, bir radyo konuşmasında Pakistan’ı sömürge bölünmesinin kalıntısı olarak nitelendirdi. Gerilimler artıyor ve çatışma kaçınılmaz görünüyor."
 GOE_RAJ.44.t:0 "[433.GetName] bölgesinde sınır çatışması"
 GOE_RAJ.45.a:0 "Devrim ilerliyor."
 GOE_RAJ.45.b:0 "Acı bir kayıp"
 GOE_RAJ.45.desc:0 "Hindistan askerleri [433.GetName]’i ele geçirdi. Pakistan güçleri şiddetli çatışmaların ardından geri çekildi ve bölge şimdi komünist bayraklarla donatıldı. Hindistan yayınları bunu halkın zaferi olarak nitelendiriyor."
 GOE_RAJ.45.t:0 "[RAJ.GetName], [433.GetName]’i ele geçirdi"
 GOE_RAJ.46.a:0 "Kızılları kov!"
 GOE_RAJ.46.b:0 "Baskıya dayanamayız"
 GOE_RAJ.46.c:0 "Biz zaten komünizme doğru gidiyoruz!"
 GOE_RAJ.46.desc:0 "Köylerde huzursuzluk patlak verdi; uzun süredir gölgelerde faaliyet gösteren komünist kışkırtıcılar halkı silahlanmaya çağırdı. Köyler toprak sahiplerine karşı ayaklandı ve belediye binalarında orak ve çekiç sembolleri dalgalanıyor.\n\nBu ayaklanma, [FROM.GetName]in sloganları ve silahlarıyla şekillendi.\n\nUlusumuzun kalbi ve ruhu için yeni bir savaş başladı."
 GOE_RAJ.46.t:0 "Halk Ayaklanması"
 GOE_RAJ.47.a:0 "Onları yakından izleyeceğiz."
 GOE_RAJ.47.desc:0 "Hindistan Halk Cumhuriyeti ideolojik etkisini sınırlarının ötesine yaymaya başladı.\n\nSon haftalarda, ülke siyasetimizde Hindistan yanlısı sesler giderek yükseldi. Yayınlarda, Hindistan’ın merkeziyetsiz sosyalizm modeli, yabancı nüfuza karşı direnişi ve sömürge sonrası bir devleti dönüştürmedeki görünür başarısı övülüyor.\n\nBunun [From.GetNameDef] tarafından iç politikamızı değiştirmek için koordineli bir çaba olup olmadığı belirsiz — ancak etkileri hissediliyor."
 GOE_RAJ.47.t:0 "Hindistan’ın nüfuzu artıyor"
 GOE_RAJ.48.a:0 "Endişe Verici"
 GOE_RAJ.48.desc:0 "[RAJ.GetNameDef] tarafından ilham alınan bir dizi yayın ve radyo programının ardından, [This.GetAdjective] toplumunun giderek artan bir kesimi Hint köylü sosyalizmi modeline yöneliyor. Toprak reformu, kendi kendini yönetme ve emperyalizme karşı birlik mesajı, hem işçiler hem de köylüler arasında karşılık buluyor.\n\nHenüz marjinal bir hareket olmasına rağmen, [This.GetAdjective] liderliğinin birçoğu, güçlü bir tepki verilmezse bu düşüncelerin kitlesel grevlere ya da daha kötüsü, [From.GetNameDef]'in devrimci hedefleriyle uyumlu silahlı ayaklanmalara dönüşebileceğinden endişe ediyor."
 GOE_RAJ.48.t:0 "[This.GetNameDef]’de Hint Devrimci Nüfuzu"
 GOE_RAJ.49.a:0 "Acı bir kayıp"
 GOE_RAJ.49.b:0 "[431.GetName] bizim hakkımızdır."
 GOE_RAJ.49.desc:0 "Pakistanlı birlikler Kalküta üzerinde kontrolü sürdürüyor. Hint kuvvetleri ağır çatışmaların ardından geri çekildi ve Pakistan bölgeyi elinde tutmaya devam ediyor. Hint yayınları, ulusal utancı önlemek için bu başarısızlığı sansürlüyor."
 GOE_RAJ.49.t:0 "[PAK.GetName], [431.GetName] üzerindeki kontrolünü sürdürüyor"
 GOE_RAJ.5.a:0 "Kabul edilemez"
 GOE_RAJ.5.desc:0 "[FROM.GetName], taleplerimizi reddetti ve bağımsız bir Krallık olduklarını, kendi kuralları ve kaygıları bulunduğunu vurguladı."
 GOE_RAJ.5.t:0 "[FROM.GetName] Reddediyor"
 GOE_RAJ.50.a:0 "Acı bir kayıp"
 GOE_RAJ.50.b:0 "[433.GetName] bizim hakkımızdır."
 GOE_RAJ.50.desc:0 "Pakistanlı birlikler [433.GetName] üzerinde kontrolü sürdürüyor. Hint kuvvetleri ağır çatışmaların ardından geri çekildi ve Pakistan bölgeyi elinde tutmaya devam ediyor. Hint yayınları, ulusal utancı önlemek için bu başarısızlığı sansürlüyor."
 GOE_RAJ.50.t:0 "[PAK.GetName], [433.GetName] üzerindeki kontrolünü sürdürüyor"
 GOE_RAJ.51.a:0 "Acı bir kayıp"
 GOE_RAJ.51.b:0 "[986.GetName] bizim hakkımızdır."
 GOE_RAJ.51.desc:0 "Pakistan askerleri sınır bölgesindeki kontrolü sürdürüyor. Hint güçleri şiddetli çatışmaların ardından geri çekildi ve Pakistan bölgeyi elinde tutmaya devam ediyor. Hint yayınları, ulusal utancı önlemek için bu yenilgiyi sansürlüyor."
 GOE_RAJ.51.t:0 "[PAK.GetName], [986.GetName] üzerindeki kontrolünü sürdürüyor"
 GOE_RAJ.52.a:0 "Lord Mountbatten bu gemiyi yönlendirmeli"
 GOE_RAJ.52.b:0 "Bırakın [ROOT.GetLeader] kalsın"
 GOE_RAJ.52.desc:0 "Mountbatten'in bölgedeki deneyimi ve eşinin V. K. Krishna Menon ile uzun süredir devam eden dostluğu ve işbirliği nedeniyle Menon, Sir Stafford Cripps ve Clement Attlee ile yapılan gizli toplantılarda Hindistan Ulusal Kongresi tarafından kabul edilebilir bir genel başkan adayı olarak Mountbatten'in adını tek başına öne sürecek. Mountbatten'in talimatı, bölünmeyi önlemek ve iktidar devrinin sonucu olarak birleşik bir Hindistan'ı korumaktır; ancak kendisi, eğer kesinlikle ihtiyaç duyulursa, Britanya'nın en az itibar kaybıyla derhal geri çekilmesini sağlamak için değişen duruma uyum sağlama yetkisine sahiptir."
 GOE_RAJ.52.t:0 "Mountbatten Genel Vali Adayı olarak"
 GOE_RAJ.53.a:0 "Pattabhi'nin zaferi, Gandhi'nin zaferidir."
 GOE_RAJ.53.b:0 "Mahatma rehberimiz olmaya devam ediyor."
 GOE_RAJ.53.desc:0 "Hindistan Ulusal Kongresi'nin yıllık toplantısı Tripuri'de başladı ve beraberinde Kongre başkanlığı yarışını da getirdi. Mahatma Gandhi, radikallerin meydan okumasına karşı Andhra'lı hekim, bankacı ve Kongre'nin resmî tarihinin yazarı Dr. Pattabhi Sitaramayya'yı destekliyor. Pattabhi başkanlığı alırsa partiyi eski kadrolar yönlendirecek; ancak Gandhi'nin manevi otoritesi her zaman makamların üzerinde oldu. Kongre'ye kim liderlik etmeli?"
 GOE_RAJ.53.t:0 "Tripuri Kongresi"
 GOE_RAJ.54.a:0 "Bırakın gitsinler."
 GOE_RAJ.54.b:0 "Pattabhi ile uzlaşalım."
 GOE_RAJ.54.desc:0 "Çalışma Komitesi topluca istifa etti. Gandhi'nin şiddetsizlik ilkesinden kopuşumuzu kabul etmeyen Dr. Pattabhi Sitaramayya ve diğer eski kadrolar, Kongre teşkilatının önemli bir bölümünü de yanlarına alarak ayrıldı. Pattabhi artık, birliğe en çok ihtiyaç duyduğumuz anda hareketi bölebilecek Gandhici bir muhalefetin sözcülüğünü yapıyor. Nasıl karşılık vermeliyiz?"
 GOE_RAJ.54.t:0 "Eski Kadrolar Ayrılıyor"
 GOE_RAJ.6.a:0 "Harika!"
 GOE_RAJ.6.desc:0 "[FROM.GetName], taleplerimizi kabul etti ve ülkeleri fiilen bize bağlı bir devlet haline geldi."
 GOE_RAJ.6.t:0 "[FROM.GetName] Boyun Eğiyor"
 GOE_RAJ.7.a:0 "Ona yardım edeceğiz."
 GOE_RAJ.7.a_tt:0 "§YChandra Bose devrimini başlattığında [RAJ.GetName]'e karşı savaşa çağrılacağız§!"
 GOE_RAJ.7.b:0 "Başka planlarımız var"
 GOE_RAJ.7.desc:0 "[GetRajName] için bağımsızlık kazanma çabasında, milliyetçi lider Chandra Bose, [GetRajAdjective] kıtasını istikrarsızlaştırma önerisiyle bize başvurdu. Kabul edersek, zamanı geldiğinde [GetRajAdjective]’deki emperyal işgali devirmek için yardıma çağrılacağız."
 GOE_RAJ.7.t:0 "Subhas Chandra Bose, [GetRajAdjective] hükümetini devirmeyi teklif ediyor."
 GOE_RAJ.8.a:0 "Bağımsızlığa bir adım daha"
 GOE_RAJ.8.desc:0 "[FROM.GetName], bağımsızlık mücadelemizde bize destek olacağını bildirdi."
 GOE_RAJ.8.t:0 "[FROM.GetName] Yardım Etmeyi Kabul Ediyor"
 GOE_RAJ.9.a:0 "Yine de yardıma ihtiyacımız yok"
 GOE_RAJ.9.desc:0 "[FROM.GetName], [ENG.GetAdjective]'e karşı bir savaşa karışmaları halinde kendi planlarının tehlikeye gireceğini belirterek, bize yardım etmekten kaçınacağını bildirdi."
 GOE_RAJ.9.t:0 "[FROM.GetName] Yardım Etmeyi Reddediyor"
 GOE_RAJ_33_c_tt:0 "§RAteşkes teklif edilene kadar 255 gün boyunca hayatta kalmalıyız. Ateşkes sırasında Batı, Doğu, Orta, Güney veya Kuzey Hindistan'daki tüm eyaletleri işgal edersek, daha büyük toprak imtiyazları elde edeceğiz!§!"
 GOE_RAJ_eic.2.a:0 "Esnek olmalı"
 GOE_RAJ_eic.2.b:0 "Tasarruflu olmalı"
 GOE_RAJ_eic.2.c:0 "Hükümetle iyi ilişkileri olmalı"
 GOE_RAJ_eic.2.d:0 "Acımasız olmalı"
 GOE_RAJ_eic.2.desc:0 "Bir şirketin büyümesini yönetecek sağlam bir ele ihtiyacı vardır ve bize en yüksek yatırım geri dönüşünü sağlayacak bir lider seçmeliyiz. Seçilecek kişinin kişiliği tüm liderlik grubuna yansıyacak, bu yüzden doğru tercihi yapmak çok önemli."
 GOE_RAJ_eic.2.t:0 "Bir CEO Atayın"
 GOE_RAJ_eic.3.a:0 "Delirdiler mi?"
 GOE_RAJ_eic.3.b:0 "Mavi lotus aksın"
 GOE_RAJ_eic.3.desc:0 "[FROM.GetName], ülkelerimiz arasında afyonun serbestçe akmasına izin vermemizi talep ediyor. İnsanlar buna para vermeye razıysa, kim oluyoruz da haklarını ellerinden alıyoruz? Ahlaken yanlış ve bireyler için zararlı olabilir, ama eğer para veriyorlarsa neden engel olalım? Tek sorun, [FROM.GetAdjective] hükümetinin ayrıca bu... malları yaymak için bir ticaret limanı talep etmesi."
 GOE_RAJ_eic.3.t:0 "[RAJ.GetName], Afyon Ticareti Yapmamızı Talep Ediyor"
 GOE_RAJ_eic.4.a:0 "Havuç olmadıysa, sıra sopada"
 GOE_RAJ_eic.4.desc:0 "[FROM.GetName] taleplerimizi kesinlikle reddetti ve bağımsız bir ülke olduklarını, kendi yasaları bulunduğunu hatırlattı. Böyle bir talepte bulunmamız bile neredeyse kutsala hakaret."
 GOE_RAJ_eic.4.t:0 "[FROM.GetName] Kesinlikle Reddediyor"
 GOE_RAJ_eic.5.a:0 "Zorbalıksız bir anlaşma"
 GOE_RAJ_eic.5.desc:0 "[FROM.GetName], ülkelerimiz arasında büyük miktarda afyon ticaretini kabul etti. Yeni ticaret limanıyla malları tüm dünyaya doğrudan dağıtabileceğiz. Bu tüketim dostları ve düşmanları yakınlaştırsın."
 GOE_RAJ_eic.5.t:0 "[FROM.GetName] Kabul Ediyor"
 GOE_RAJ_eic.6.a:0 "Bu toprağı satmaya razı değiliz"
 GOE_RAJ_eic.6.a_tt:0 "[FROM.GetName] bu eyaleti tekrar talep edemeyecek, ama başka eyaletler isteyebilir."
 GOE_RAJ_eic.6.b:0 "Asla"
 GOE_RAJ_eic.6.b_tt:0 "[FROM.GetName] artık bizden başka toprak isteyemeyecek"
 GOE_RAJ_eic.6.c:0 "Kulağa iyi geliyor"
 GOE_RAJ_eic.6.desc:0 "İş operasyonlarını genişletmek isteyen [RAJ.GetName], [RAJ_i_want_to_buy_this_land.GetName]'i satın almak için bize ülkemize önemli miktarda yatırım karşılığında bir teklif sundu."
 GOE_RAJ_eic.6.t:0 "[RAJ.GetName], [RAJ_i_want_to_buy_this_land.GetName]'i Satın Almak İstiyor"
 GOE_RAJ_eic.7.a:0 "Fikirleri değişecek"
 GOE_RAJ_eic.7.desc:0 "[FROM.GetName], bu toprak parçasını vermek istemiyor ama gelecekte başka toprak transferleri için fırsatlar olabileceğini dışlamıyor."
 GOE_RAJ_eic.7.t:0 "[FROM.GetName] Toprağından Vazgeçmek İstemiyor"
 GOE_RAJ_eic.8.a:0 "Tuhaf bir tutum"
 GOE_RAJ_eic.8.desc:0 "[FROM.GetName], bize hiçbir toprağını devretmeyeceğini ve böyle bir teklifte bulunmanın bile terbiyesizce olduğunu bildirdi."
 GOE_RAJ_eic.8.t:0 "[FROM.GetName] Hiçbir Transferi Kabul Etmiyor"
 GOE_RAJ_eic.9.a:0 "Harika anlaşmalar!"
 GOE_RAJ_eic.9.desc:0 "[FROM.GetName] ticareti kabul etti. Parayı yakında havale edeceğiz ve varlıkların devri yakında gerçekleşecek."
 GOE_RAJ_eic.9.t:0 "[FROM.GetName] Kabul Ediyor"
 GOE_RAJ_famine.1.a:0 "Eyvah"
 GOE_RAJ_famine.1.desc:0 "[?global.famine_state.GetName]'de kahverengi leke hastalığı görüldü. Yetkililer, bu mantar hastalığının yayılmasından ve kış hasadını etkilemesinden endişe ediyor."
 GOE_RAJ_famine.1.t:0 "[?global.famine_state.GetName]'de Kahverengi Leke Hastalığı Salgını"
 GOE_RAJ_famine.10.a:0 "Soğuk kalpli ahmaklar"
 GOE_RAJ_famine.10.desc:0 "[FROM.GetName], bize yardım etmeyeceğini ve böyle bir küresel kriz döneminde devletimize karşı herhangi bir yükümlülüğü olduğu düşüncesini reddettiğini bildirdi."
 GOE_RAJ_famine.10.t:0 "[FROM.GetName], Bize Yardım Etmeyi Reddediyor"
 GOE_RAJ_famine.11.a:0 "Harika!"
 GOE_RAJ_famine.11.desc:0 "[FROM.GetName], bize cömertçe büyük bir yardım paketi sağladı ve kıtlığın hafiflemesine ve komşu eyaletlere yayılmasının önlenmesine yardımcı oldu."
 GOE_RAJ_famine.11.t:0 "[FROM.GetName], Büyük Yardım Paketi Sağladı"
 GOE_RAJ_famine.12.a:0 "İyi!"
 GOE_RAJ_famine.12.desc:0 "[FROM.GetName], bize küçük bir yardım paketi sağladı; kıtlığın hafiflemesine ve komşu eyaletlere yayılmasının önlenmesine yardımcı oldu. Elbette daha fazlasını yapabilirlerdi ama bu da hiç yoktan iyidir."
 GOE_RAJ_famine.12.t:0 "[FROM.GetName], Küçük Yardım Paketi Sağladı"
 GOE_RAJ_famine.13.a:0 "Halkın acısıyla kazanılan miller"
 GOE_RAJ_famine.13.desc:0 "Kıtlığın en kötüsü geçmiş gibi görünüyor. İyi bir hasat, en kötü sıkıntıları hafifletti ve gıda fiyatları düşmeye başladı. Normalliğe dönmek biraz zaman alacak olsa da, bölgenin iyileşmesi için ilk adım atıldı.\nBüyük trajedinin ardından kendimize sormalıyız: Zaferin gerçek bedeli nedir?"
 GOE_RAJ_famine.13.t:0 "[?global.famine_state.GetName] Kıtlığı Sona Erdi"
 GOE_RAJ_famine.2.a:0 "Belki de artık bitti"
 GOE_RAJ_famine.2.desc:0 "Büyük bir kasırga ve ardından gelen birçok fırtına [?global.famine_state.GetName]'i vurdu. Hasar büyük olmakla birlikte, Kahverengi Leke Hastalığı'nın daha geniş bir alana yayılmasına da neden oldu ve mantarların etkisini daha da artırdı."
 GOE_RAJ_famine.2.t:0 "[?global.famine_state.GetName]'i Kasırga Vurdu"
 GOE_RAJ_famine.3.a:0 "Umarım yine yanılmışlardır."
 GOE_RAJ_famine.3.desc:0 "Bu yılki mahsul verimine ilişkin resmi tahminler önemli bir açık öngörüyor. Bu tahminlerin geçmişte yanlış çıktığı ise herkesçe biliniyor."
 GOE_RAJ_famine.3.t:0 "Güvenilmez Mahsul Tahminleri"
 GOE_RAJ_famine.4.a:0 "Gıda dağıtım ağı boğuluyor"
 GOE_RAJ_famine.4.desc:0 "Hint eyaletleri ve prenslikleri, artan gıda fiyatlarıyla ilgili endişeler nedeniyle eyaletler arası ticaret engelleri uygulamaya başladı. Bu engeller, eyaletler giderek daha izole hale geldikçe gıda fiyatlarını daha da artırma riski taşıyor."
 GOE_RAJ_famine.4.t:0 "Eyaletler Arası Ticaret Engelleri"
 GOE_RAJ_famine.5.a:0 "İşler kötüleşiyor"
 GOE_RAJ_famine.5.desc:0 "Tahıl fiyatları arttıkça, yerel yönetim halka yardımcı olmak için fiyat kontrolleri uygulamaya çalıştı. Ancak bu, büyük miktarda tahılın ya karaborsaya ya da büyük depolara kaldırılmasıyla sonuçlandı.\nYerel yönetim önlemleri hafifletse de, tahıl sıkıntısının yaygın olduğuna dair inanç devam ediyor ve bu da çılgınca enflasyona yol açtı."
 GOE_RAJ_famine.5.t:0 "[?global.famine_state.GetName]'de Fiyat Kaosu"
 GOE_RAJ_famine.6.a:0 "..."
 GOE_RAJ_famine.6.desc:0 "Yerel yönetim, eyalette ağır sanayi için önemli olan ve Batı değerleri ile modernizasyona sempatik olan üst ve orta sınıflara temel gıda maddelerinin öncelikli olarak verilmesini onayladı. Bu, gıda fiyatlarının daha da yükselmesine neden oldu."
 GOE_RAJ_famine.6.t:0 "[?global.famine_state.GetName]'de Öncelikli Dağıtım"
 GOE_RAJ_famine.7.a:0 "Bu iyi değil"
 GOE_RAJ_famine.7.desc:0 "[?global.famine_state.GetName]'de büyük sivil huzursuzluk patlak verdi. Temel ihtiyaçların yokluğu, geniş kırsal nüfusu yardım arayışıyla aşırı kalabalık şehirlere sürükledi.\nBu durum hızla kontrolden çıkarak kalabalıkların birbirine girmesine neden oldu."
 GOE_RAJ_famine.7.t:0 "[?global.famine_state.GetName]'de Kıtlık Durumu"
 GOE_RAJ_famine.7.tt:0 "§YKıtlık, önleyici önlemler alınmazsa her ay komşu eyaletlere yayılabilir\nKıtlık karar kategorisinin kilidini açar§!"
 GOE_RAJ_famine.9.a:0 "Üzgünüz dostum. Hiçbir şey veremeyiz."
 GOE_RAJ_famine.9.b:0 "Büyük miktarda yardım göndereceğiz"
 GOE_RAJ_famine.9.c:0 "Az miktarda yardım göndereceğiz"
 GOE_RAJ_famine.9.desc:0 "[FROM.Getname], ülkesinin bir kısmında kıtlık yaşandığı kötüleşen bir durumla karşı karşıya. Hükümeti, uluslararası toplumdan acıyı hafifletmek ve acil duruma son vermek için ellerinden gelebilecek her türlü yardımı istedi."
 GOE_RAJ_famine.9.t:0 "[FROM.Getname], Kıtlık Yardımı İstiyor"
 GOE_RAJ_famine.9.tt:0 "§YKıtlık§! Kararlarını Etkinleştirir"
 GOE_RAJ_generals.1.a:0 "Kesinlikle!"
 GOE_RAJ_generals.1.b:0 "İlgilenmiyoruz."
 GOE_RAJ_generals.1.desc:0 "[RAJ.GetLeader], [RAJ.GetAdjective] askerlerinin İngiliz askerleri tarafından eğitilmesi için [ENG.GetNameDefCap]'a gönderilmesini ve bunun için iyi bir ödeme yapılmasını teklif etti."
 GOE_RAJ_generals.1.t:0 "Sömürge Askeri Değişim Programı"
 GOE_RAJ_generals.2.a:0 "Harika!"
 GOE_RAJ_generals.2.desc:0 "[ENG.GetLeader], teklifimize olumlu cevap verdi ve askerlerimizin [ENG.GetNameDefCap]'a gönderilmesine izin verdi."
 GOE_RAJ_generals.2.t:0 "[ENG.GetNameDefCap] Kabul Etti!"
 GOE_RAJ_generals.3.a:0 "Ne yazık."
 GOE_RAJ_generals.3.desc:0 "[ENG.GetLeader], teklifimize yanıt verdi ve ilgilenmediğini belirtti."
 GOE_RAJ_generals.3.t:0 "[ENG.GetNameDefCap] Teklifimizi Reddetti."
 GOE_RAJ_generals.4.a:0 ""
 GOE_RAJ_generals.4.b:0 ""
 GOE_RAJ_generals.4.desc:0 ""
 GOE_RAJ_generals.4.t:0 ""
 GOE_RAJ_generals.5.a:0 ""
 GOE_RAJ_generals.5.desc:0 ""
 GOE_RAJ_generals.5.t:0 ""
 GOE_RAJ_generals.6.a:0 ""
 GOE_RAJ_generals.6.desc:0 ""
 GOE_RAJ_generals.6.t:0 ""
 GOE_RAJ_generals.7.a:0 "Karşılıklı faydalı bir anlaşma!"
 GOE_RAJ_generals.7.b:0 "İlgilenmiyoruz."
 GOE_RAJ_generals.7.desc:0 "[RAJ.GetLeader], [ENG.GetAdjective] sivil sanayisinden tedarik ekipmanları satın almak için bize bir istek gönderdi. Bu ticaretleri düzenlememiz karşılığında iyi bir komisyon teklif ettiler."
 GOE_RAJ_generals.7.t:0 "[RAJ.GetNameDefCap], Tedarik Malzemeleri Satın Almak İstiyor"
 GOE_RAJ_generals.8.a:0 "Harika!"
 GOE_RAJ_generals.8.desc:0 "[ENG.GetLeader], teklifimize olumlu cevap verdi ve onlardan tedarik ekipmanları almamıza izin verdi."
 GOE_RAJ_generals.8.t:0 "[ENG.GetNameDefCap] Kabul Etti!"
 GOE_RAJ_generals.9.a:0 "Ne yazık."
 GOE_RAJ_generals.9.desc:0 "[ENG.GetLeader], teklifimize yanıt verdi ve ilgilenmediğini belirtti."
 GOE_RAJ_generals.9.t:0 "[ENG.GetNameDefCap] Teklifimizi Reddetti."
 GOE_RAJ_goa.1.a:0 "Bu potansiyel bir çatışmaya değmez."
 GOE_RAJ_goa.1.b:0 "Kesinlikle hayır. Goa bizim!"
 GOE_RAJ_goa.1.desc:0 "[RAJ.GetLeader], Goa'nın geri alınmasını talep etti. [RAJ.GetLeader], Goa'nın [RAJ.GetAdjective] toprağı olduğunu iddia ediyor ve askeri eylem tehdidinde bulunuyor."
 GOE_RAJ_goa.1.t:0 "[RAJ.GetNameDefCap], Goa'yı Talep Ediyor"
 GOE_RAJ_goa.2.a:0 "Goa artık bizim!"
 GOE_RAJ_goa.2.desc:0 "[FROM.GetLeader], sorunu uzatmamaya karar verdi ve bir çatışmayı önlemek için Goa'nın ilhak edilmesine izin verdi."
 GOE_RAJ_goa.2.t:0 "[FROM.GetNameDefCap], Goa'yı Bıraktı"
 GOE_RAJ_goa.3.a:0 "Bu savaş demek!"
 GOE_RAJ_goa.3.b:0 "Bir daha düşünelim, geri çekilelim."
 GOE_RAJ_goa.3.desc:0 "[FROM.GetLeader], tehditlerimize rağmen Goa'yı vermeyi reddetti."
 GOE_RAJ_goa.3.t:0 "[FROM.GetNameDefCap], Goa'nın Devredilmesini Reddediyor"
 GOE_RAJ_goa.4.a:0 "Harika."
 GOE_RAJ_goa.4.desc:0 "[RAJ.GetLeader], askeri tehditlerimize karşılık verdi ve [RAJ.GetAdjective] askerleri Goa'dan çekildi."
 GOE_RAJ_goa.4.t:0 "[RAJ.GetNameDefCap] Geri Çekildi."
 GOE_RAJ_loyalist.01.a:0 "$NSB_soviet_spanish_civil_war.4.a$"
 GOE_RAJ_loyalist.01.desc:0 "Bugün iyi haberler getiriyoruz. [RAJ.GetNameDef] içindeki yönetim, temel malların üretimini ve ihracatını [RAJ.GetNonIdeologyName]’den daha geniş İmparatorluk topraklarına artırma teklifinde bulundu. Depolarımızın, Hint çayı, pamuk ve jüt ile dolmasını bekleyebiliriz; çünkü [RAJ.GetNameDef], bereketli topraklarımız için değerli bir varlık olduğunu kanıtlıyor."
 GOE_RAJ_loyalist.01.t:0 "[FROM.GetAdjective] İmparatorluğu için İhracatlar"
 GOE_RAJ_loyalist.02.a:0 "$NSB_soviet_civil_war_common.126.a$"
 GOE_RAJ_loyalist.02.desc:0 "İmparatorluk genelinde üretim hatlarının geliştirilmesi konusunda kapsamlı görüşmeler yapıldı. Bu sayede [?RAJ_crown_commodities_civ_built_flag.GetName] bölgesinde sanayi tesisleri kurup genişletebildik. Umuyoruz ki, bu gelişme artan küresel talepler karşısında İmparatorluğu güçlendirecektir."
 GOE_RAJ_loyalist.02.t:0 "$RAJ_the_empires_workshop$"
 GOE_RAJ_loyalist.03.a:0 "Bu savaş bize fayda sağlayabilir. Devam edin."
 GOE_RAJ_loyalist.03.b:0 "[PER.GetNameDef] ile savaş? Hayır, çok riskli."
 GOE_RAJ_loyalist.03.desc:0 "Bu sabah, [RAJ.GetNameDef] yönetimi bize resmen başvurarak [PER.GetNameDef]'a tam kapsamlı bir işgal başlatmak için izin talebinde bulundu. Fars koridorunu koruma ve düşmanlarımızın eline geçmeden [PER.GetNameDef] petrol sahalarını güvence altına alma gibi gerekçeler öne sürüyorlar. Böyle bir harekat uluslararası toplumun tepkisini çekebilir, ancak sağlayacağı stratejik avantajları görmezden gelmek aptallık olur. Nasıl ilerlemeliyiz?"
 GOE_RAJ_loyalist.03.t:0 "[FROM.GetAdjective] Hükümetinin İran'ı İşgal Planı"
 GOE_RAJ_loyalist.04.a:0 "[PER.GetNameDef]'a yürüyoruz!"
 GOE_RAJ_loyalist.04.desc:0 "[ENG.GetNameDef]'daki elçimizden iyi haber geldi. [ENG.GetAdjective] hükümeti, [PER.GetNameDef]'a bir işgal hazırlığı yapmamıza izin vermeyi kabul etti. Kraliyet'in onayıyla, birliklerimizi toplamalı ve savaşa hazırlanmalıyız."
 GOE_RAJ_loyalist.04.t:0 "[FROM.GetNameDefCap] Savaşı Onayladı"
 GOE_RAJ_loyalist.05.a:0 "Kraliyetin arzularına saygı göstermeliyiz."
 GOE_RAJ_loyalist.05.desc:0 "Ne yazık ki [PER.GetNameDef]'a yapılacak bir işgal için yalvarışlarımız duyulmadı. Taç, herhangi bir askeri operasyon başlatmamamıza karar verdi ve biz katılmasak da [ENG.GetAdjective] hükümetinin emirlerine uymak en ihtiyatlı yol olacaktır."
 GOE_RAJ_loyalist.05.t:0 "[FROM.GetNameDefCap], askerî operasyonlarımızı durdurmamızı resmen talep etti"
 GOE_RAJ_loyalist.06.a:0 "Savunma bütçemizi güçlendirmeliyiz."
 GOE_RAJ_loyalist.06.b:0 "Taarruz kabiliyetlerimize odaklanmalıyız."
 GOE_RAJ_loyalist.06.c:0 "[RAJ.GetAdjective] hava kuvvetlerinin desteğe ihtiyacı var."
 GOE_RAJ_loyalist.06.d:0 "Deniz operasyonlarımızı genişletelim."
 GOE_RAJ_loyalist.06.desc:0 "Güneydoğu Asya Komutanlığı'nın kurulmasıyla bir yol ayrımına geldik. Bu operasyona ayırabileceğimiz sınırlı kaynaklar var ve [ENG.GetNameDef] ile koordineli olarak savaş çabalarını desteklemek için neye odaklanmamız gerektiğine karar vermeliyiz."
 GOE_RAJ_loyalist.06.t:0 "Güneydoğu Asya Komutanlığı"
 GOE_RAJ_loyalist.07.a:0 "Buna izin veremeyiz."
 GOE_RAJ_loyalist.07.b:0 "Savunmamız için fedakarlık yapmalıyız."
 GOE_RAJ_loyalist.07.desc:0 "Koruma adına, [FROM.GetNameDefCap], [event_target:RAJ.RAJ_annexing_country_target.GetName]'ı savunmasının geliştirilmesi için [FROM.GetAdjective] yönetimi altına almayı öneriyor. Bu senaryo egemenliğimiz açısından ideal olmasa da, bunun geçici bir önlem olduğunu varsaymak zorundayız. En azından, öyle umuyoruz."
 GOE_RAJ_loyalist.07.t:0 "Malaya'nın Savunması"
 GOE_RAJ_loyalist.08.a:0 "$GOE_RAJ_loyalist.07.a$"
 GOE_RAJ_loyalist.08.b:0 "$GOE_RAJ_loyalist.07.b$"
 GOE_RAJ_loyalist.08.desc:0 "Koruma adına, [FROM.GetNameDefCap], [event_target:RAJ.RAJ_annexing_country_target.GetName]'ı savunmasının geliştirilmesi için [FROM.GetAdjective] yönetimi altına almayı öneriyor. Bu senaryo egemenliğimiz açısından ideal olmasa da, bunun geçici bir önlem olduğunu varsaymak zorundayız. En azından, öyle umuyoruz."
 GOE_RAJ_loyalist.09.a:0 "Öyle olsun."
 GOE_RAJ_loyalist.09.desc:0 "Ne yazık ki tüm çabalarımıza rağmen, [FROM.GetNameDef] koruma teklifimizi reddetti. Görünen o ki savunma planımız onları himayemiz altına girmeye ikna edemedi."
 GOE_RAJ_loyalist.09.t:0 "[FROM.GetNameDefCap] Savunma Planımızı Reddetti"
 GOE_RAJ_loyalist.10.a:0 "Mükemmel. Hazırlıklara başlayın."
 GOE_RAJ_loyalist.10.desc:0 "Harika haber! [FROM.GetNameDefCap], topraklarında asker konuşlandırmamıza ve yabancı işgaline karşı koruma sağlamamıza izin verdi. Bu, savaş çabalarımıza büyük katkı sağlayacak!"
 GOE_RAJ_loyalist.10.t:0 "[FROM.GetNameDefCap], [event_target:RAJ.RAJ_annexing_country_target.GetName]'ın Yönetimini Devralmamızı Onayladı"
 GOE_RAJ_loyalist.11.a:0 "$ENG_winston_churchill$, [RAJ.GetNameDef]'ı yönetmeli."
 GOE_RAJ_loyalist.11.b:0 "Churchill en iyi şekilde danışman pozisyonunda hizmet edecektir."
 GOE_RAJ_loyalist.11.c:0 "Churchill'in [RAJ.GetNameDef]'da yeri yoktur."
 GOE_RAJ_loyalist.11.desc:0 "Bugün [ENG.GetAdjective] İmparatorluğu için kara bir gün. [ENG.GetNameDef]'ın düşüşünün ardından, sürgündeki liderliğini ağırlamak gibi eşsiz bir konumdayız. Bu, kısmen Taç'a olan bağlılığımızı yeniden teyit etme çabalarımızın bir sonucudur. $ENG_winston_churchill$ [ENG.GetNameDef]'ı elinden gelenin en iyisiyle yönetti ve şimdi onun [RAJ.GetNameDef]'da hangi pozisyonda yer alabileceğine karar vermeliyiz."
 GOE_RAJ_loyalist.11.t:0 "$RAJ_the_jewel_becomes_the_crown$"
 GOE_RAJ_loyalist.12.a:0 "Elveda, $ENG_winston_churchill$."
 GOE_RAJ_loyalist.12.desc:0 "Bu zorlu zamanlarda hala umut ışığı var. Teslim olmamıza rağmen, $ENG_winston_churchill$ adadan kaçmayı başardı ve [RAJ.GetNameDef]'a ulaştı. Buradan [ENG.GetAdjective] çıkarlarını koruyabilir ve vatanımızı geri alana kadar savaş operasyonlarını yürütebilir."
 GOE_RAJ_loyalist.12.t:0 "$ENG_winston_churchill$ [ENG.GetNameDef]'dan kaçtı"
 GOE_RAJ_loyalist.13.a:0 "$ENG_winston_churchill$ yeniden Başbakan olmalı."
 GOE_RAJ_loyalist.13.b:0 "Artık onun hizmetine ihtiyacımız yok."
 GOE_RAJ_loyalist.13.desc:0 "Anavatan topraklarımız nihayet yeniden kontrolümüz altına girdiğine göre, eski kabinemizi yeniden oluşturmaya başlayabiliriz. $ENG_winston_churchill$, [RAJ.GetNameDef]'daki sürgünden olumlu karşılanan bir dönüş yaptı ve bundan sonraki süreçte nasıl ilerleyeceğimize karar verme zamanı geldi."
 GOE_RAJ_loyalist.13.t:0 "$ENG_winston_churchill$'ın Dönüşü"
 GOE_RAJ_loyalist.14.a:0 "Buna izin verebiliriz."
 GOE_RAJ_loyalist.14.b:0 "Bu kaynaklar için başka planlarımız var."
 GOE_RAJ_loyalist.14.desc:0 "Bu sabah [FROM.GetNameDef]'dan bir elçi heyeti aldık. Hükümetleri, artan savaş çabalarını desteklemek için [288.GetName]'daki [BRM.GetAdjective] $state_resource_tungsten$'ı işletme hakkı talep ediyor. Bu teklifi hafife almamak gerektiğinden, nasıl bir yol izleyeceğimize karar vermeliyiz."
 GOE_RAJ_loyalist.14.t:0 "[FROM.GetName] için [BRM.GetAdjective] $state_resource_tungsten$"
 GOE_RAJ_loyalist.15.a:0 "Bunu öğrenmek iyi oldu."
 GOE_RAJ_loyalist.15.desc:0 "Hükümdarımız [OVERLORD.GetNameDef], [RAJ.GetNameDef]'a [288.GetName]'daki $state_resource_tungsten$ kaynak haklarını, sanayilerini desteklemeleri ve savaş çabalarına katkıda bulunmaları için verdi. Bu, [OVERLORD.GetNameDef]'a bölgedeki çıkarlarını desteklemeye ne kadar kararlı olduğumuzu kanıtlama fırsatıdır."
 GOE_RAJ_loyalist.15.t:0 "[288.GetName]'daki $state_resource_tungsten$ İşletme Hakkı [RAJ.GetName]'e Verildi"
 GOE_RAJ_loyalist.16.a:0 "Büyük bir lütuf."
 GOE_RAJ_loyalist.16.desc:0 "[FROM.GetNameDefCap], [288.GetName]'daki $state_resource_tungsten$ kaynak haklarını bize verdi. Bu, savaş çabalarımıza katkı sağlayacak ve Taç adına mücadelemizi sürdürmemize yardımcı olacaktır."
 GOE_RAJ_loyalist.16.t:0 "[FROM.GetName] Kaynak İşletme Haklarını Veriyor"
 GOE_RAJ_loyalist.17.a:0 "Bu sonuç son derece moral bozucu."
 GOE_RAJ_loyalist.17.desc:0 "Ne yazık ki [FROM.GetNameDef], Burma'daki $state_resource_tungsten$ kaynaklarını işletme talebimizi reddetti. Savaş endüstrimizin gelişimini sürdürmek için bu kaynaklar hayati önem taşıyabileceğinden, bu durum büyük bir hayal kırıklığıdır."
 GOE_RAJ_loyalist.17.t:0 "Burma $state_resource_tungsten$ [FROM.GetName] Tarafından Reddedildi"
 GOE_RAJ_loyalist.77.t:0 "Burma'nın Savunması"
 GOE_RAJ_mughals_peace_deal.1.a:0 "Mükemmel"
 GOE_RAJ_mughals_peace_deal.1.desc:0 "Sonunda süregelen savaşın ekonomik zorlukları, [UK_INDIA.GetAdjective] hükümeti için baş edilemez hale geldi. Üstlerinin itirazlarına rağmen, barış karşılığında bize önemli toprak tavizleri teklif ettiler."
 GOE_RAJ_mughals_peace_deal.1.t:0 "[UK_INDIA.GetName] Toprak Tavizleri Sunuyor"
 GOE_RAJ_navy.1.a:0 "Bu, her ikimiz için de çok faydalı olacak!"
 GOE_RAJ_navy.1.b:0 "İlgilenmiyoruz."
 GOE_RAJ_navy.1.desc:0 "[RAJ.GetLeader], [RAJ.GetAdjective] ve [ENG.GetAdjective] yönetimleri arasında bir deniz ticaret anlaşması yapılmasını öneren bir teklif gönderdi. \nBu, denizcilik üretiminde karşılıklı işbirliği sağladığı gibi, gelecekte daha fazla ticaret anlaşmasının da önünü açacak."
 GOE_RAJ_navy.1.t:0 "[RAJ.GetNameDefCap], Denizcilik Anlaşması Öneriyor"
 GOE_RAJ_navy.10.a:0 "Karşılıklı faydalı bir anlaşma!"
 GOE_RAJ_navy.10.b:0 "İlgilenmiyoruz."
 GOE_RAJ_navy.10.desc:0 "[RAJ.GetNameDefCap]'dan yetkililer, modern gemi sözleşmelerimizi satın almak ve Kraliyet Hint Donanması için 1936 Kruvazörlerimizi geliştirme hakkı istiyor. Bunun karşılığında iyi bir ödeme yapmayı teklif ediyorlar."
 GOE_RAJ_navy.10.t:0 "[RAJ.GetNameDefCap], Modern Gemi Sözleşmesi İstiyor."
 GOE_RAJ_navy.11.a:0 "Kraliyet Hint Donanması için harika haber!"
 GOE_RAJ_navy.11.desc:0 "[ENG.GetNameDefCap]'dan yetkililer, modern gemi sözleşmelerini vermeyi kabul etti ve ilk etapta beş kruvazör alacağız."
 GOE_RAJ_navy.11.t:0 "[ENG.GetNameDefCap], Modern Gemi Sözleşmelerini Bize Verdi!"
 GOE_RAJ_navy.12.a:0 "Ne yazık."
 GOE_RAJ_navy.12.desc:0 "[ENG.GetNameDefCap]'dan yetkililer, teklifimizi kabul etmedi ve teklifimizin onlar için çok düşük olduğunu belirtti."
 GOE_RAJ_navy.12.t:0 "[ENG.GetNameDefCap] Teklifi Reddetti."
 GOE_RAJ_navy.2.a:0 "Mükemmel"
 GOE_RAJ_navy.2.desc:0 "[FROM.GetNameDefCap]'dan yetkililer önerilen denizcilik anlaşmasını kabul etti ve anlaşmayı imzaladılar. Bu, gelecekte büyük fayda sağlayacak."
 GOE_RAJ_navy.2.t:0 "[FROM.GetNameDefCap] Kabul Etti!"
 GOE_RAJ_navy.3.a:0 "Ne yazık."
 GOE_RAJ_navy.3.desc:0 "[FROM.GetNameDefCap]'dan yetkililer, önerilen denizcilik anlaşmasını reddetti. Anlaşmanın kendilerine hiçbir fayda sağlamadığını ve açıkça tek taraflı olduğunu belirttiler."
 GOE_RAJ_navy.3.t:0 "[ENG.GetNameDefCap], Ticaret Anlaşmasını Reddediyor."
 GOE_RAJ_navy.4.a:0 "Fedakarlık buna değer."
 GOE_RAJ_navy.4.b:0 "Buna asla izin vermeyiz!"
 GOE_RAJ_navy.4.desc:0 "[RAJ.GetNameDefCap]'dan yetkililer, Kraliyet Hint Donanması'nda hizmet vermek ve yeni Deniz Piyadelerini eğitmek için donanma komutanlarımızdan birini transfer etmemizi istedi. Bu maliyetli bir iş, fakat iyi bir ödeme teklif ediyorlar."
 GOE_RAJ_navy.4.t:0 "[RAJ.GetNameDefCap], Donanma Komutanı Transferi İstiyor"
 GOE_RAJ_navy.5.a:0 "Mükemmel"
 GOE_RAJ_navy.5.desc:0 "[FROM.GetNameDefCap]'dan yetkililer, komutanlarından birini donanma genişletmemize yardım etmek için [RAJ.GetNameDefCap]'a göndermeyi kabul etti."
 GOE_RAJ_navy.5.t:0 "[ENG.GetNameDefCap] Kabul Etti!"
 GOE_RAJ_navy.6.a:0 "Ne yazık."
 GOE_RAJ_navy.6.desc:0 "[FROM.GetNameDefCap] yetkilileri, Komutanlarından birini [RAJ.GetNameDefCap]'ye göndermeyi reddetti ve onun yerine kendi komutanlarımızı eğitmemiz konusunda ısrar etti."
 GOE_RAJ_navy.6.t:0 "[ENG.GetNameDefCap] Teklifi Reddetti."
 GOE_RAJ_navy.7.a:0 "Zaten kullanmıyoruz!"
 GOE_RAJ_navy.7.b:0 "İlgilenmiyoruz."
 GOE_RAJ_navy.7.desc:0 "[FROM.GetLeader], hizmet dışı bırakılan eski gemilerimizi satın almayı talep etti, bunlar şu anda kullanımda değil, ancak [FROM.GetLeader], [FROM.GetNameDefCap]'nin bunları kullanıma sunabileceği konusunda ısrar ediyor. Çok yüklü bir ödeme teklif ediyorlar"
 GOE_RAJ_navy.7.t:0 "[RAJ.GetNameDefCap], Kullanılmayan Gemilerimizi Satın Almak İstiyor"
 GOE_RAJ_navy.8.a:0 "Kraliyet Hint Donanması için harika haber!"
 GOE_RAJ_navy.8.desc:0 "[FROM.GetLeader], eski gemilerini satın alma talebimizi kabul etti. Gemiler yakında Hindistan'a varacak."
 GOE_RAJ_navy.8.t:0 "[ENG.GetNameDefCap], Ticaret Teklifimizi Kabul Etti!"
 GOE_RAJ_navy.9.a:0 "Ne yazık."
 GOE_RAJ_navy.9.desc:0 "[FROM.GetLeader], gemilerini satın alma teklifimizi reddetti. Artık donanmamızı genişletmek için başka bir yol bulmalıyız."
 GOE_RAJ_navy.9.t:0 "[ENG.GetNameDefCap] Teklifi Reddetti."
 GOE_RAJ_news.1.a:0 "İkincisi şans getirir."
 GOE_RAJ_news.1.desc:0 "[RAJ.GetNonIdeologyName]'daki gerilimin artmaya devam etmesiyle, [?event_target:EIC_FORMER.GetNonIdeologyName]'in bölgeyi nasıl istikrara kavuşturacağı sorusu, parlamentolarında önemli bir tartışma konusu olmuştur. Bu sabah, [?event_target:EIC_FORMER.GetLeader] bir konuşma yaparak hem [RAJ.GetNonIdeologyName]'da hem de [?event_target:EIC_FORMER.GetNonIdeologyName]'de ekonomik büyümeyi teşvik etmek amacıyla [429.GetName]'de yeni bir şirket devleti kurma yönündeki [?event_target:EIC_FORMER.GetLeader.GetHerHis] planını duyurdu. [?event_target:EIC_FORMER.GetLeader.GetSheHeCap], bu devletin taçtan bağımsız olarak faaliyet göstereceğini, ancak yine de vergilendirme yoluyla [?event_target:EIC_FORMER.GetNonIdeologyName]'e ekonomik olarak bağlı olacağını iddia ediyor. [?event_target:EIC_FORMER.GetSheHeCap] bunu '19. yüzyıl Doğu Hindistan Şirketi'nin manevi halefi' olarak tanımladı.\n\n[?event_target:EIC_FORMER.GetLeader], bunun geçici karışıklığa ve artan istikrarsızlığa yol açabilse de, yeni ekonomik güvenlik ve bölgenin kademeli olarak istikrara kavuşması için zemin hazırlayacağını söyledi."
 GOE_RAJ_news.1.t:0 "[?event_target:EIC_FORMER.GetAdjective] Doğu Hindistan Şirketi'nin Dönüşü"
 GOE_RAJ_news.2.a:0 "Raj düştü."
 GOE_RAJ_news.2.desc:0 "[RAJ.GetNonIdeologyName]'daki hızla yükselen komünist duygular, bugün Kraliyet Hint Donanması'nın bir isyan ilan etmesiyle kritik bir dönüm noktasına ulaştı; bu da zaten zayıflamış olan sömürge yönetiminin [RAJ.GetNonIdeologyName] üzerindeki azıcık nüfuzunu da kaybetmesiyle sonuçlandı. Sonuç olarak, [RAJ.GetLeader] tarafından yeni bir Hindistan Halk Cumhuriyeti ilan edildi.\n\nKaçınılmaz çatışmayı önlemek amacıyla [RAJ.GetLeader], [PAK.GetLeader] liderliğinde bağımsız bir [PAK.GetAdjective] devletinin kurulması ve iki ulus arasında derhal yürürlüğe girecek bir ateşkes ile birlikte, [PAK.GetAdjective] özerkliği için şimdiden bir anlaşma sağladı."
 GOE_RAJ_news.2.t:0 "Kraliyet Hint Donanması'nda İsyan"
 GOE_RAJ_news.3.a:0 "Umut verici."
 GOE_RAJ_news.3.desc:0 "[RAJ.GetNonIdeologyName]'da Doğu Hindistan Şirketi'ni yeniden yapılandırma kararı, gerileyen [RAJ.GetAdjective] ekonomisini istikrara kavuşturmak amacıyla birkaç yıl önce [?event_target:EIC_FORMER.GetNonIdeologyName] tarafından alınmıştı. Bu hamlenin [?event_target:EIC_FORMER.GetAdjective] ekonomistleri tarafından genellikle bir başarı olarak kabul edilmesiyle, [?event_target:EIC_FORMER.GetAdjective] hükümeti, derhal yürürlüğe girmek üzere, Raj tarafından kontrol edilen kalan toprakların [RAJ.GetNameDefCap]'e devredileceğini duyurdu. Raj yönetimi lağvedilecek ve bu da [RAJ.GetNameDefCap]'in tüm alt kıtayı denetlemesine olanak tanıyacak."
 GOE_RAJ_news.3.t:0 "Raj'ın Ecel Çanı"
 GOE_RAJ_news.4.a:0 "Gerçekten de yeni bir süper güç"
 GOE_RAJ_news.4.b:0 "Korkutucu"
 GOE_RAJ_news.4.desc:0 "[FROM.GetNameDef] lideri [FROM.GetLeader]'ın Hint alt kıtasındaki tüm halkların birleştiğini ilan ettiği, bunun Asya ve tüm dünya tarihinde yeni bir sayfa açtığı bildirildi. Birçok analist şimdiden Hindustan'ın birleşmesinin dünya siyaseti üzerinde ciddi etkileri olabileceğini ve yeni bir Süper Gücün yükselişi anlamına geleceğini belirtiyor."
 GOE_RAJ_news.4.t:0 "Hindustan Birleşti"
 GOE_RAJ_partition.10.a:0 "Vaktimiz yok"
 GOE_RAJ_partition.10.b:0 "Bu savaşı bitirmeliyiz"
 GOE_RAJ_partition.10.desc:0 "Hint alt kıtasında savaş patlak verdi. Her iki ülke üzerinde de ciddi etkimiz olduğundan, bu deliliği sona erdirmek için müdahale etmemiz iyi olabilir."
 GOE_RAJ_partition.10.t:0 "Hint Alt Kıtasında Savaş"
 GOE_RAJ_partition.11.desc:0 "Uzun yıllar boyunca [RAJ.GetNameDef] ağırlıklı olarak Taç’tan gelen yöneticiler tarafından yönetildi, ancak artan özerklik talepleri karşısında yeni bir Hint Parlamentosu kurmamız zorunlu hale geldi. Bu, yerli liderliğin ülkenin şekillenmesinde rol oynamasını sağlayacak ve aynı zamanda imparatorluğun çıkarlarının da gözetilmesini temin edecektir. Ancak, bu yeni hükümete kimin liderlik edeceği konusunda bir karar vermemiz gerekiyor."
 GOE_RAJ_partition.12.a:0 "Hayatımızın ışığı söndü."
 GOE_RAJ_partition.12.desc:0 "Mahatma Gandhi, bugün Delhi'deki Birla Evi'nde akşam duasına giderken vurularak öldürüldü. Nathuram Godse adlı Hindu milliyetçisi saldırgan, kalabalık tarafından yakalanmadan önce yakın mesafeden üç el ateş etti. Bağımsızlık mücadelemize önderlik eden adam artık aramızda değil; bütün ulus yasa boğuldu."
 GOE_RAJ_partition.12.t:0 "Gandhi Suikasta Uğradı"
 GOE_RAJ_partition.2.a:0 "Polis geri çekilmeli."
 GOE_RAJ_partition.2.b:0 "Kalabalığı dağıtın."
 GOE_RAJ_partition.2.desc:0 "[ENG.GetAdjective] yönetimine karşı [?unrest_target_state.GetName]'de protestolar patlak verdi. Yerel kolluk kuvvetleri, göstericilerle yetkililer arasında artan şiddetli çatışmalar rapor ediyor."
 GOE_RAJ_partition.2.t:0 "[?unrest_target_state.GetName]'de Yaygın Protestolar"
 GOE_RAJ_partition.3.a:0 "Ulusal muhafızları gönderin"
 GOE_RAJ_partition.3.b:0 "Kışkırtıcılarla arabuluculuk yapmaya çalışın"
 GOE_RAJ_partition.3.desc:0 "[?unrest_target_state.GetName]'deki gerginlik kritik seviyeye ulaştı, polis giderek huzursuzlaşan kalabalığı kontrol etmekte zorlanıyor. Hükümete bağlı fabrikalar kışkırtıcıların başlıca hedefi haline geldi ve artan huzursuzlukla birlikte sık sık sabotajlara uğruyor."
 GOE_RAJ_partition.3.t:0 "[?unrest_target_state.GetName]'de Ayaklanmalar"
 GOE_RAJ_partition.4.a:0 "Bu bizim suçumuz mu?"
 GOE_RAJ_partition.4.b:0 "Gerginliği azaltmak için kampanya başlat"
 GOE_RAJ_partition.4.c:0 "Kışkırtıcıları hapse at"
 GOE_RAJ_partition.4.desc:0 "Bağımsızlık hareketi ivme kazanırken, toplumda derin ve büyüyen bir bölünme ortaya çıkıyor. Birleşik Hindistan’ı korumakta kararlı Hindular, çoğunluğu Hindu olan bir devlette dışlanmaktan korkan Müslümanlarla gitgide daha fazla çatışıyor. Müslümanlar ise ayrı bir vatan talep ediyor. Bu gerginlik, her iki taraftaki aşırılıkçı gruplar arasında şiddetli çatışmalara yol açtı ve ülkenin istikrarını ciddi şekilde tehdit ediyor."
 GOE_RAJ_partition.4.t:0 "Dini Şiddet"
 GOE_RAJ_partition.5.a:0 "Durum gelişiyor..."
 GOE_RAJ_partition.5.b:0 "Polis gücünü artır"
 GOE_RAJ_partition.5.desc:0 "[GetRajName]'de Müslümanların Hindistan'dan ayrı bir vatan isteği yükselirken, Hindu milliyetçileri de Müslüman etkisine karşı karşı-protestolar düzenliyor ve bu sıkça şiddetli çatışmalara yol açıyor."
 GOE_RAJ_partition.5.t:0 "Hindular ve Müslümanlar Arasında Çatışmalar"
 GOE_RAJ_partition.6.a:0 "Hangi dine mensup olursak olalım, hepimiz Hindistan'ın çocuklarıyız."
 GOE_RAJ_partition.6.desc:0 "Uzun yıllar önce kaderle bir sözleştik, ve şimdi o sözü yerine getirme zamanı geldi, tamamen olmasa da önemli ölçüde. Dünya uyurken gece yarısı saatinde Hindistan hayata ve özgürlüğe uyanacak. Tarihte nadiren gelen bir an gelir ki, eskiden yeniye adım atarız, bir çağ sona erer ve uzun süre bastırılan bir ulusun ruhu kendini ifade eder."
 GOE_RAJ_partition.6.t:0 "Kaderle Buluşma"
 GOE_RAJ_partition.7.a:0 "Nehru açık seçim"
 GOE_RAJ_partition.7.b:0 "Bunca fedakarlık yapan adam, Gandhi"
 GOE_RAJ_partition.7.c:0 "Jinnah bir şansı hak ediyor"
 GOE_RAJ_partition.7.d:0 "Louis Mountbatten, hala yardımına ihtiyacımız var"
 GOE_RAJ_partition.7.desc:0 "Ulusumuz, bir dönemi kapatırken, öz-yönetimle yeni bir sayfa açıyor."
 GOE_RAJ_partition.7.t:0 "Liderlik Sorunu"
 GOE_RAJ_partition.8.a:0 "Karanlık uçurumda ne görmüş olabilir?"
 GOE_RAJ_partition.8.desc:0 "Nathuram Godse olarak tanımlanan bir adam, Mahatma Gandhi'ye çok dinli bir dua toplantısı sırasında suikast girişiminde bulunmaya çalıştı; ancak ateş edemeden cumhurbaşkanının korumaları tarafından yakalandı.\nGandhi'nin durumu iyi, güvenli bir alana götürüldü; sözcüler, olaydan dolayı sarsıldığını ve dünyanın ve kendisinin gelecekteki yeri hakkında derin düşüncelere daldığını belirttiler."
 GOE_RAJ_partition.8.t:0 "Gandhi Suikast Girişiminden Kurtuldu"
 GOE_RAJ_partition.9.a:0 "Sınırlı zamanımız var"
 GOE_RAJ_partition.9.desc:0 "[ENG.GetName], Hint alt kıtasındaki çatışmalar konusunda ciddi endişelerini dile getirdi. Hükümeti, iki ülkenin kanlı savaşa girmesini istemediğini ve gerekirse savaşı durdurmak için güç kullanacağını bize açıkça bildirdi."
 GOE_RAJ_partition.9.t:0 "[ENG.GetName] Müdahale Etmeye Hazırlanıyor"
 GOE_RAJ_partition_become_free_to_stop_the_chaos_tt:0 "Bağımsızlık kazanana kadar istikrarsızlık devam edecek gibi görünüyor"
 GOE_RAJ_princely.1.a:0 "Mir Osman Ali Khan, imparatorluğumuzu yüceltecek"
 GOE_RAJ_princely.1.b:0 "Mirza Khurshid Jah Bahadur en makul seçenek"
 GOE_RAJ_princely.1.c:0 "Ahmad Yar Khan bizi koruyacak!"
 GOE_RAJ_princely.1.d:0 "Huseyn Shaheed Suhrawardy bizi geleceğe taşıyacak!"
 GOE_RAJ_princely.1.desc:0 "Babür'ün tarihi imparatorluğu geniş ve iyilikseverdi ve alt kıtaya yüzlerce yıl hükmetti. Bu mirasa layık olacaksak önümüzde çok iş var. Gurkani hanedanından pek çok kişi hayatta olsa da, sadece biri bizi zafere götürebilir."
 GOE_RAJ_princely.1.t:0 "[ROOT.GetNameDef]'e Liderlik Edecek Prensi Seçin"
 GOE_RAJ_princely.2.a:0 "Huseyn Shaheed Suhrawardy bizi geleceğe taşıyacak!"
 GOE_RAJ_princely.2.b:0 "Maharaja Hari Singh halkın iradesini taşıyor!"
 GOE_RAJ_princely.2.c:0 "Bodh Chandra Singh en büyük stratejistimiz!"
 GOE_RAJ_princely.2.d:0 "Hiçbiri yeterli değil."
 GOE_RAJ_princely.2.desc:0 "$GOE_RAJ_princely.1.desc$"
 GOE_RAJ_princely.2.t:0 "[ROOT.GetNameDef]'e Liderlik Edecek Prensi Seçin"
 GOE_RAJ_princely.3.a:0 "Umed Singh halkla çok iyi anlaşıyor."
 GOE_RAJ_princely.3.b:0 "Pratap Singh Rao Gaekwad bariz seçim!"
 GOE_RAJ_princely.3.c:0 "Maharaja Jayachamarajendra Wadiyar en iyisi."
 GOE_RAJ_princely.3.d:0 "Belki ilk listeyi yeniden düşünmeliyiz."
 GOE_RAJ_princely.3.desc:0 "$GOE_RAJ_princely.1.desc$"
 GOE_RAJ_princely.3.t:0 "[ROOT.GetNameDef]'e Liderlik Edecek Prensi Seçin"
 GOE_RAJ_transfered_commander_tt:0 "[RAJ.GetNameDefCap]'a transfer edildi"
 GOE_generic_events.1.a:0 "Vichy hükümeti meşru otoritedir."
 GOE_generic_events.1.b:0 "Sürgündeki hükümete yardım edeceğiz."
 GOE_generic_events.1.c:0 "[FRA.GetAdjective]'lerden tamamen kurtulalım!"
 GOE_generic_events.1.desc:0 "[FRA.GetAdjective] ordusunun Paris'i savunmaktaki başarısızlığı hükümetin çökmesine yol açtı. Aceleyle varılan bir ateşkesin ardından Vichy'de yeni bir rejim kuruldu. Ancak bir dizi [FRA.GetAdjective] yetkili ülkeden kaçarak sürgün bir hükümet kurdu ve [FRA.GetNonIdeologyName] kurtarılana kadar mücadeleye devam edeceklerine yemin ettiler. Şimdi kendi hükümetimize zor bir karar düştü."
 GOE_generic_events.1.t:0 "[FRA.GetAdjective] Hükümeti Çöktü"
 GOE_generic_events.2.a:0 "Akıllıca bir karar."
 GOE_generic_events.2.desc:0 "[FROM.GetNameDef] hükümeti, [FRA.GetAdjective] halkının tek temsilcisi olarak otoritemize saygı gösterme taahhüdünde bulundu ve dış politikanın tüm meselelerinde liderliğimizi takip etmeye devam edeceklerini açıkladı."
 GOE_generic_events.2.t:0 "[FROM.GetAdjective] Yönetimi Sadık Kaldı"
 GOE_generic_events.3.a:0 "Bu kabul edilemez!"
 GOE_generic_events.3.b:0 "Önemsiz bir mesele."
 GOE_generic_events.3.desc:0 "[FROM.GetNameDef] yönetimi, meşru [FRA.GetAdjective] hükümeti olarak otoritemizi tanımayı reddederek bizi arkamızdan vurdu. Bunun yerine düşmanlarımıza sadakat yemini ettiler."
 GOE_generic_events.3.t:0 "[FROM.GetAdjective] Yönetimi Bize İhanet Etti"
 GOE_generic_events.4.a:0 "Bu fırsatçı davranış kabul edilemez."
 GOE_generic_events.4.b:0 "Böyle bir şeyin olması kaçınılmazdı."
 GOE_generic_events.4.desc:0 "[FROM.GetNameDef] hükümeti son yaşanan kargaşayı fırsat bilerek bizden bağımsızlığını ilan etti. Hükümet değişikliğinin şokuyla sarsılan silahlı kuvvetlerimiz, durumu yeniden kontrol altına alıp [FROM.GetAdjective] topraklarını zorla geri alma imkanının hala mümkün olduğuna inanıyor."
 GOE_generic_events.4.t:0 "[FROM.GetAdjective] Yönetimi Bağımsızlık İlan Etti"
 GOE_generic_events.5.a:0 "Zafer bizim olacak!"
 GOE_generic_events.5.desc:0 "Eski baskıcılarımız bağımsızlık ilanımıza öfkelendi ve yeni kazandığımız özgürlükleri yok etmek için kuvvetlerini seferber etmeye başladı. Görünüşe göre bağımsızlığımız kan dökülmeden kazanılmayacak."
 GOE_generic_events.5.t:0 "Bağımsızlığımızı Savunuyoruz"
 GOE_generic_events_1_tt:0 "§RVichy Fransası bize savaş ilan edebilir!§!"
 IRQ_kurdistan_events.1.a:0 "Elbette yardım edeceğiz!"
 IRQ_kurdistan_events.1.b:0 "[IRQ.GetNameDefCap]'deki küçük bir devrimle ilgilenmiyoruz."
 IRQ_kurdistan_events.1.desc:0 "[IRQ.GetNameDefCap]'deki Kürt milliyetçilerinden devrimleri için yardım isteyen bir ileti aldık."
 IRQ_kurdistan_events.1.t:0 "Kürt Milliyetçileri Bizden Yardım İstiyor"
 IRQ_kurdistan_events.2.a:0 "Bu harika bir haber!"
 IRQ_kurdistan_events.2.desc:0 "[FROM.GetNameDefCap]'deki bağlantılarımız, yardım talebimize olumlu yanıt verdi ve davamıza destek olacaklarını bildirdi."
 IRQ_kurdistan_events.2.t:0 "[FROM.GetNameDefCap] Bize Yardım Etmeyi Kabul Etti"
 IRQ_kurdistan_events.3.a:0 "Bu bizi yıldırmamalı!"
 IRQ_kurdistan_events.3.desc:0 "[FROM.GetNameDefCap]'deki bağlantılarımız, yardım talebimizi maalesef reddetti. Artık kendi başımızayız."
 IRQ_kurdistan_events.3.t:0 "[FROM.GetNameDefCap] Bize Yardım Etmeyi Reddetti"
 IRQ_kurdistan_events.4.a:0 "İşçiler haklı."
 IRQ_kurdistan_events.4.b:0 "Bu sosyalist uygulamalara izin veremeyiz!"
 IRQ_kurdistan_events.4.desc:0 "Son dönemde sanayileşme çabalarımızla birlikte çeşitli sendikaların yükselişine tanık olduk. Fabrika işçileri, hak ettiklerini düşündükleri adil çalışma koşullarını talep ederek birleşti. Onları yatıştırmak bize fayda sağlayabilir, ancak bunun bizi politik olarak nasıl etkileyeceği bilinmez."
 IRQ_kurdistan_events.4.t:0 "Sendikalar Kuruldu"
 IRQ_political_events.10.a:0 "Müdahale edip dostlarımızı tekrar iktidara getireceğiz."
 IRQ_political_events.10.b:0 "Diplomatik bir protesto yayınla."
 IRQ_political_events.10.desc:0 "1930 yılında müzakere edilen İngiliz-Irak Antlaşması, genç ulusa daha fazla özerklik sağlarken onu fiilen dış politikamızın bir parçası haline getiriyordu. Ancak hükümet, antlaşmayı feshetti ve [FROM.GetAdjective] topraklarından tamamen çekilmemizi talep ediyor. Bölgeden aldığımız petrole olan bağımlılığımız, [FROM.GetAdjective] hükümetinin tedariki kesmesi durumunda tüm ulusal güvenliğimizi tehlikeye atabilir."
 IRQ_political_events.10.t:0 "[FROM.GetNonIdeologyName] Antlaşmayı Feshetti"
 IRQ_political_events.11.a:0 "Arap dünyası için bir zafer!"
 IRQ_political_events.11.desc:0 "Beklenmedik şekilde, [FROM.GetAdjective] hükümeti, çekilmemizle ilgili elçimize yalnızca sert ifadelerle yazılmış bir diplomatik protesto iletti. Şimdilik [FROM.GetAdjective] tarafından ciddi bir tepkiyle karşılaşmayacağız gibi görünüyor."
 IRQ_political_events.11.t:0 "[FROM.GetNameDef] Diplomatik Protesto Yayınladı"
 IRQ_political_events.12.a:0 "Topraklarımızı savunacağız."
 IRQ_political_events.12.b:0 "Bunun için savaşmaya değmez."
 IRQ_political_events.12.desc:0 "[FROM.GetNameDef] hükümeti, batıdaki ve önemli bir Arap azınlığa sahip olan topraklarımızı bırakmamızı talep etti. Bu taleplerini, bölgedeki Arapların korunması için yaptıklarını söylüyorlar. Ancak aynı topraklarda çok sayıda petrol altyapısı da bulunuyor; bu da ekonomilerine fayda sağlayacaktır. Bu ültimatomu reddedersek, muhtemelen toprakları zorla almaya çalışacaklar."
 IRQ_political_events.12.t:0 "[FROM.GetNameDefCap] Toprak Talep Ediyor"
 IRQ_political_events.13.a:0 "Arap dünyası için bir başka zafer."
 IRQ_political_events.13.desc:0 "[FROM.GetNameDefCap] hükümeti, talep ettiğimiz toprakları bize devretmeyi kabul etti. Ordumuz bölge için savaşa hazırdı, ancak savaşmadan kazandık."
 IRQ_political_events.13.t:0 "[FROM.GetNameDefCap] Toprak Transferini Kabul Etti"
 IRQ_political_events.14.a:0 "O zaman zorla alacağız."
 IRQ_political_events.14.b:0 "Blöfümüzü gördüler."
 IRQ_political_events.14.desc:0 "[FROM.GetNameDefCap] hükümeti, talep ettiğimiz toprakları devretmeyi reddetti. Bölgeyi [FROM.GetAdjective] yönetiminden kurtarmak istiyorsak ordumuza güvenmek zorundayız."
 IRQ_political_events.14.t:0 "[FROM.GetNameDefCap] Toprak Transferini Reddetti"
 IRQ_political_events.15.a:0 "Gerçekten rahatlatıcı."
 IRQ_political_events.15.desc:0 "[FROM.GetAdjective] ordusu, sınır boyunca arttırdığı hazırlık durumunu düşürüyor. Topraklarımızı savunmaya hazırdık fakat şimdilik savaşın önlenmesi rahatlatıcı."
 IRQ_political_events.15.t:0 "[FROM.GetNameDef] ile Gerilim Azaldı"
 IRQ_political_events.16.a:0 "Halkta sorun yoksa onları ödüllendirelim."
 IRQ_political_events.16.b:0 "Onlara güvenemeyiz."
 IRQ_political_events.16.desc:0 "[GER.GetAdjective] eğilimli subayları ordularından çıkararak bize olan sadakatlerini kanıtlayan [FROM.GetAdjective] hükümeti, komşu eyaleti [455.GetName]'yi entegre etme fırsatını talep etti. Her iki ülkenin kraliyet aileleri arasında bağlar zaten mevcut ve bu, üzerimizdeki bazı idari yükleri ortadan kaldıracaktır."
 IRQ_political_events.16.t:0 "[FROM.GetNameDefCap] [455.GetName] Üzerinde Kontrol Talep Ediyor"
 IRQ_political_events.17.a:0 "Bu olumlu bir değişiklik."
 IRQ_political_events.17.b:0 "Mevcut düzenden memnunuz."
 IRQ_political_events.17.desc:0 "[FROM.FROM.GetNonIdeologyName], [FROM.GetAdjective] etki alanı içinde sorumluluğunu genişleterek [ROOT.GetNameDef]'in idaresini ele almak istiyor. Kabul edersek, artık doğrudan [FROM.GetAdjective] yetkililerine bağlı olmayacağız, ancak yine de dünya sahnesinde bağımsız hareket edemeyeceğiz."
 IRQ_political_events.17.t:0 "[FROM.FROM.GetNonIdeologyName] Bizi Yönetmek İstiyor"
 IRQ_political_events.18.a:0 "Kutlama vakti!"
 IRQ_political_events.18.desc:0 "Bugün, [455.GetName] eyaletinin idaresini resmen devraldık. Bu, büyük Arap dünyasını yönetimimiz altında birleştirmek adına anlamlı bir adım."
 IRQ_political_events.18.t:0 "[FROM.GetNameDefCap] Transferi Onayladı"
 IRQ_political_events.19.a:0 "[ROOT.GetNonIdeologyName] ve [455.GetName] için zor bir gün."
 IRQ_political_events.19.desc:0 "[FROM.GetNameDef] ile ilişkilerimizi geliştirmek için tüm çabalarımıza rağmen, [455.GetName] üzerindeki sorumluluğu devralma planımız çok sayıda sorun nedeniyle reddedildi. [FROM.GetAdjective] halen bize güvensizlikle yaklaşıyor."
 IRQ_political_events.19.t:0 "[FROM.GetNameDefCap] Transferi Reddetti"
 IRQ_political_events.20.a:0 "Gerçekten şaşırtıcı."
 IRQ_political_events.20.desc:0 "[FROM.GetAdjective] hükümeti, ülkelerinin sorumluluğunu [IRQ.GetNonIdeologyName]'a devretme planımızı reddetti. Bu durumun onları memnun edeceğini düşünmüştük, fakat bildikleri şeytanı seçmeyi tercih ettiler."
 IRQ_political_events.20.t:0 "[FROM.GetNameDef] Yönetimi Teklifi Reddetti"
 IRQ_political_events.21.a:0 "Transferi düzenle ama önce yerlilere danış."
 IRQ_political_events.21.b:0 "Yerlerini unutuyorlar."
 IRQ_political_events.21.desc:0 "[FROM.GetNameDef] hükümeti, son dönemde bölgede artan şiddet olayları sebebiyle [PAL.GetName]'dan derhal çekilmemizi talep etti. Yönetimi kendilerinin üstlenmesinin Araplara daha faydalı olacağını ve mevcut yönetimimizin zararlı olduğunu savunuyorlar. Çekilmek askeri açıdan yararlı olsa da, dış politikada ciddi zararları olabilir."
 IRQ_political_events.21.t:0 "[FROM.GetNameDefCap] [454.GetName] Üzerinde Kontrol Talep Ediyor"
 IRQ_political_events.22.a:0 "Mevcut düzen sürdürülemez..."
 IRQ_political_events.22.b:0 "Kendi planlarımız var."
 IRQ_political_events.22.desc:0 "[FROM.GetAdjective] hükümeti, [ROOT.GetName]'dan çekilerek idaresini [IRQ.GetNameDef]'e devretmeyi planlıyor. Süreci hemen bozmazsak birkaç gün içinde [IRQ.Capital.GetCapitalVictoryPointName]'dan talimat almaya başlayacağız."
 IRQ_political_events.22.t:0 "[FROM.FROM.GetNonIdeologyName] Devralmayı Planlıyor"
 IRQ_political_events.23.a:0 "Arap dayanışması bugün kazandı."
 IRQ_political_events.23.desc:0 "Kendi kuvvetleri için durumun sürdürülemez olduğunu anlayan [ENG.GetAdjective] hükümeti, [454.GetName]'dan çekilmeyi kabul etti ve bölgenin yönetimini bize devretti."
 IRQ_political_events.23.t:0 "[ENG.GetNameDefCap] Transferi Onayladı"
 IRQ_political_events.24.a:0 "Arap dünyası bugün ağlıyor."
 IRQ_political_events.24.b:0 "Buna izin vermeyeceğiz. [FROM.GetNameDefCap] ile iş birliğimiz sona erdi."
 IRQ_political_events.24.desc:0 "[FROM.GetNameDef], [454.GetName] üzerindeki sorumluluğu devralma planımızı çok sayıda sorun nedeniyle reddetti. [ENG.GetAdjective]'nin bölgeden barışçıl bir şekilde çekilmesini sağlayacak bir seçenek sunmamıza rağmen, kanlı ve pahalı işgali sürdürmeyi tercih ettiler."
 IRQ_political_events.24.t:0 "[FROM.GetNameDefCap] Transferi Reddetti"
 IRQ_political_events.25.a:0 "Emperyalist işbirlikçiler."
 IRQ_political_events.25.desc:0 "[FROM.GetAdjective] hükümeti, ülkelerinin sorumluluğunu [IRQ.GetNonIdeologyName]'a devretme planımızı reddetti. Onları memnun edeceğini düşündük, fakat yine bildikleriyle devam etmek istediler."
 IRQ_political_events.25.t:0 "[FROM.GetNameDef] Yönetimi Teklifi Reddetti"
 IRQ_political_events.26.a:0 "Birlikte daha güçlüyüz."
 IRQ_political_events.26.b:0 "Şimdilik ilgilenmiyoruz."
 IRQ_political_events.26.c:0 "Asla egemenliğimizden vazgeçmeyeceğiz!"
 IRQ_political_events.26.desc:0 "[FROM.GetNameDef] diplomatları, bize federasyon üyeliği teklif etti. Katılmak ekonomik ve güvenlik açısından fayda sağlayabilir, ancak büyük ölçüde özerklikten vazgeçmemiz gerekir."
 IRQ_political_events.26.t:0 "[FROM.GetNameDefCap] Federasyon Üyeliği Teklif Ediyor"
 IRQ_political_events.27.a:0 "Birlikte daha güçlüyüz."
 IRQ_political_events.27.desc:0 "[FROM.GetNameDefCap] akıllıca bir karar vererek federasyon üyeliğini kabul etti. Memurlarımız ve diplomatlarımız hızlı bir entegrasyon süreci için tüm düzenlemeleri yapıyor."
 IRQ_political_events.27.t:0 "[FROM.GetNameDefCap] Federasyon Üyeliğini Kabul Etti"
 IRQ_political_events.28.a:0 "Belki fikirleri değişir?"
 IRQ_political_events.28.desc:0 "[FROM.GetNameDefCap] aptalca bir kararla federasyon üyeliğini reddetti. Ancak ileride halkları daha istekli olduğunda katılmaya karşı olmadıklarını belirttiler."
 IRQ_political_events.28.t:0 "[FROM.GetNameDefCap] Federasyon Üyeliğini Reddetti"
 IRQ_political_events.29.a:0 "Ne kadar dar görüşlüler..."
 IRQ_political_events.29.desc:0 "[FROM.GetNameDefCap], federasyon üyeliği teklifimizi sert bir şekilde reddetti. Ülkelerine olan etkisinden dolayı böyle bir düzenlemeyi asla gönüllü kabul etmeyeceklerini belirttiler."
 IRQ_political_events.29.t:0 "[FROM.GetNameDefCap] Federasyona Karşı Çıktı"
 IRQ_political_events.30.a:0 "Yeni bir savaşı göze alamayız."
 IRQ_political_events.30.b:0 "Blöf yapıyorlar."
 IRQ_political_events.30.desc:0 "[FROM.GetNameDef] hükümeti, Lübnan üzerindeki kontrolümüzden vazgeçmemizi talep ederek bölgede Arap halkını koruma ve birleştirme görevini öne sürdü. Taleplerini pan-Arapçılık diliyle ifade etseler de, bölgenin stratejik konumu ve değerli limanlar dahil altyapısı, asıl amaçlarının merkezinde yer alıyor. Taleplerini reddedersek, meseleyi barışçıl şekilde kapatmayacakları açık."
 IRQ_political_events.30.t:0 "[FROM.GetNameDef] [553.GetName] Üzerinde Hak Talep Ediyor"
 IRQ_political_events.31.a:0 "Transfer için hazırlık yap, ama önce yerlilere danış."
 IRQ_political_events.31.b:0 "Yerlerini unutuyorlar."
 IRQ_political_events.31.desc:0 "[FROM.GetNameDef] hükümeti, [PAL.GetName]'dan derhal çekilmemizi talep etti. Bölgede son dönemde yaşanan şiddet olaylarını gerekçe göstererek, yönetimin Araplara zarar verdiğini ve kendilerinin bölgeyi daha iyi yöneteceğini iddia ediyorlar. Çekilmek askeri açıdan avantajlı olsa da, dış politikada ciddi zararlar doğurabilir."
 IRQ_political_events.31.t:0 "[FROM.GetNameDefCap] [553.GetName] Üzerinde Hak Talep Ediyor"
 IRQ_political_events.32.a:0 "Mevcut düzen sürdürülemez..."
 IRQ_political_events.32.b:0 "Kendi planlarımız var."
 IRQ_political_events.32.desc:0 "[FROM.GetAdjective] hükümeti, [ROOT.GetName]'dan çekilmeyi ve idaresini [IRQ.GetNameDef]'e devretmeyi planlıyor. Süreci hemen bozmazsak birkaç gün içinde [IRQ.Capital.GetCapitalVictoryPointName]'dan talimat almaya başlayacağız."
 IRQ_political_events.32.t:0 "[FROM.FROM.GetNonIdeologyName] Devralmayı Planlıyor"
 IRQ_political_events.33.a:0 "Arap dayanışması bugün kazandı."
 IRQ_political_events.33.desc:0 "Kendi kuvvetleri için durumun sürdürülemez olduğunu anlayan [ENG.GetAdjective] hükümeti, [454.GetName]'dan çekilmeyi kabul etti ve bölgenin yönetimini bize devretti."
 IRQ_political_events.33.t:0 "[ENG.GetNameDefCap] Transferi Onayladı"
 IRQ_political_events.34.a:0 "Arap dünyası bugün ağlıyor."
 IRQ_political_events.34.desc:0 "Çok sayıda sorun nedeniyle [FROM.GetNameDef], [553.GetName] üzerindeki sorumluluğu devralma planımızı reddetti. [ENG.GetAdjective]'nin bölgeden barışçıl şekilde çekilmesini sağlayacak bir seçenek sunmamıza rağmen, kanlı ve pahalı işgali sürdürmeyi tercih ettiler."
 IRQ_political_events.34.t:0 "[FROM.GetNameDefCap] Transferi Reddetti"
 IRQ_political_events.35.a:0 "Emperyalist işbirlikçiler."
 IRQ_political_events.35.desc:0 "[FROM.GetAdjective] hükümeti, ülkelerinin sorumluluğunu [IRQ.GetNonIdeologyName]'a devretme planımızı reddetti. Onları memnun edeceğini düşündük, fakat yine bildikleriyle devam etmek istediler."
 IRQ_political_events.35.t:0 "[FROM.GetNameDef] Yönetimi Teklifi Reddetti"
 IRQ_political_events.40.a:0 "Fazla seçeneğimiz yok."
 IRQ_political_events.40.b:0 "Kesinlikle hayır!"
 IRQ_political_events.40.desc:0 "[FROM.GetNameDef] hükümeti resmi olarak Suriye'nin kontrolünü kendi otoritelerine devretmemizi talep etti. Bölgede istikrar ve refahın sağlanması için Arap dünyasının ayrılmaz bir parçası olan Suriye'nin [FROM.GetNameDef] ile tek yönetim altında birleştirilmesi gerektiğini savunuyorlar. Taleplerini pan-Arap birliğine doğru bir adım olarak çerçevelerken, Suriye'den vazgeçmek Orta Doğu'daki etkimizi önemli ölçüde azaltacaktır. Önerilerinin reddedilmesi ilişkileri daha da zorlayabilir ve potansiyel olarak gerilimin tırmanmasına yol açabilir."
 IRQ_political_events.40.t:0 "[FROM.GetNameDefCap] Suriye'yi Talep Ediyor"
 IRQ_political_events.41.a:0 "Böyle daha iyi olacağız."
 IRQ_political_events.41.b:0 "Mevcut düzen bize yeter."
 IRQ_political_events.41.desc:0 "Şaşırtıcı bir gelişmeyle [FROM.GetNameDef] hükümeti, yönetimimizi [FROM.FROM.GetNameDef]'e devretmeyi kabul etti. Hükümetimizin içindeki pek çok kişi, bu anlaşmanın gerçekten bizim çıkarlarımızı yansıtıp yansıtmadığını veya daha büyük bir jeopolitik oyunda piyon olup olmadığımızı sorguluyor. Artık bu transferi kabul edip etmeyeceğimize veya yabancı kontrol dayatmasına direnip direnmeyeceğimize karar vermemiz gerekiyor. -Made by 0rata1T-"
 IRQ_political_events.41.t:0 "[FROM.GetNameDefCap] Bizi Transfer Etmek İstiyor"
 IRQ_political_events.42.a:0 "Konuyu daha fazla zorlamayalım."
 IRQ_political_events.42.b:0 "Toprağı almanın başka yolları da var."
 IRQ_political_events.42.desc:0 "[FROM.GetNameDef] hükümeti, Suriye'nin idaresini bize devretme önerimizi kesin bir şekilde reddetti ve Arap birliği vizyonumuzu geri çevirdi. Bu ret, Arap dünyasının birleşmesi çabalarını baltalıyor ve Suriye halkının daha güçlü, birleşik bir devlete katılma şansını ellerinden alıyor. Şimdi diplomatik yolları mı zorlayacağız, yoksa meseleyi daha güçlü yollarla mı çözmeye çalışacağız?"
 IRQ_political_events.42.t:0 "[FROM.GetNameDefCap] Talebimizi Reddetti"
 IRQ_political_events.43.a:0 "Mükemmel!"
 IRQ_political_events.43.desc:0 "[FROM.GetNameDef], Suriye'nin idaresinin bize devri önerimizi kabul etti; bu, Arap dünyasının birleşmesi yolunda önemli bir adım. Bu tarihi anlaşma, bölgede liderliğimizi güçlendiriyor ve birleşik, refah içinde bir Arap ulusu hayaline bizi yaklaştırıyor."
 IRQ_political_events.43.t:0 "[FROM.GetNameDefCap] Talebimizi Kabul Etti"
 IRQ_political_events.44.a:0 "$IRQ_political_events.40.a$"
 IRQ_political_events.44.b:0 "$IRQ_political_events.40.b$"
 IRQ_political_events.44.desc:0 "[FROM.GetNameDef] hükümeti onlara katılmamızı talep etti. Bunu kabul edip etmeyeceğimize veya yabancı kontrolünün dayatılmasına direnip direnmeyeceğimize karar verme zamanı geldi."
 IRQ_political_events.44.t:0 "[FROM.GetNameDefCap] İlhakımızı Talep Ediyor"
 IRQ_political_events.50.a:0 "Fazla seçeneğimiz yok."
 IRQ_political_events.50.b:0 "Kesinlikle hayır!"
 IRQ_political_events.50.desc:0 "[FROM.GetNameDef] hükümeti resmi olarak Kuveyt'in kontrolünü kendi otoritelerine devretmemizi talep etti. Bölgede istikrar ve refahın sağlanması için Arap dünyasının ayrılmaz bir parçası olan Kuveyt'in [FROM.GetNameDef] ile tek yönetim altında birleştirilmesi gerektiğini savunuyorlar. Taleplerini pan-Arap birliğine doğru bir adım olarak çerçevelerken, Kuveyt'ten vazgeçmek Orta Doğu'daki etkimizi önemli ölçüde azaltacaktır. Önerilerinin reddedilmesi ilişkileri daha da zorlayabilir ve potansiyel olarak gerilimin tırmanmasına yol açabilir."
 IRQ_political_events.50.t:0 "[FROM.GetNameDefCap] Kuveyt'i Talep Ediyor"
 IRQ_political_events.51.a:0 "Böyle daha iyi olacağız."
 IRQ_political_events.51.b:0 "Mevcut düzen bize yeter."
 IRQ_political_events.51.desc:0 "Şaşırtıcı bir gelişmeyle [FROM.GetNameDef] hükümeti, yönetimimizi [FROM.FROM.GetNameDef]'e devretmeyi kabul etti. Hükümetimizin içindeki pek çok kişi, bu anlaşmanın gerçekten bizim çıkarlarımızı yansıtıp yansıtmadığını veya daha büyük bir jeopolitik oyunda piyon olup olmadığımızı sorguluyor. Artık bu transferi kabul edip etmeyeceğimize veya yabancı kontrol dayatmasına direnip direnmeyeceğimize karar vermemiz gerekiyor."
 IRQ_political_events.51.t:0 "[FROM.GetNameDefCap] Bizi Transfer Etmek İstiyor"
 IRQ_political_events.52.a:0 "Konuyu daha fazla zorlamayalım."
 IRQ_political_events.52.b:0 "Toprağı almanın başka yolları da var."
 IRQ_political_events.52.desc:0 "[FROM.GetNameDef] hükümeti, Kuveyt'in idaresini bize devretme önerimizi kesin bir şekilde reddetti ve Arap birliği vizyonumuzu geri çevirdi. Bu ret, Arap dünyasının birleşmesi çabalarını baltalıyor ve Kuveyt halkının daha güçlü, birleşik bir devlete katılma şansını ellerinden alıyor. Şimdi diplomatik yolları mı zorlayacağız, yoksa meseleyi daha güçlü yollarla mı çözmeye çalışacağız?"
 IRQ_political_events.52.t:0 "[FROM.GetNameDefCap] Talebimizi Reddetti"
 IRQ_political_events.53.a:0 "Mükemmel!"
 IRQ_political_events.53.desc:0 "[FROM.GetNameDef], Kuveyt'in idaresinin bize devri önerimizi kabul etti; bu, Arap dünyasının birleşmesi yolunda önemli bir adım. Bu tarihi anlaşma, bölgede liderliğimizi güçlendiriyor ve birleşik, refah içinde bir Arap ulusu hayaline bizi yaklaştırıyor."
 IRQ_political_events.53.t:0 "[FROM.GetNameDefCap] Talebimizi Kabul Etti"
 IRQ_political_events.60.a:0 "Pekala."
 IRQ_political_events.60.b:0 "Onlara güvenemeyiz."
 IRQ_political_events.60.desc:0 "Müttefiklerin artan baskısıyla karşı karşıya kalan [FROM.GetNonIdeologyName]'daki gasıp yönetim, bir barış anlaşması önerdi. Naipliği tekrar kurup otoritemizi yeniden tesis etmeyi ve toprak bütünlüklerini koruma karşılığında çatışmaya son vermemizi teklif ediyorlar. Bu öneri, direnişin anlamsızlığını kabul etse de, Golden Square'in hedeflerinde ciddi bir geri adım ve taraftarları arasında huzursuzluğa yol açabilir."
 IRQ_political_events.60.t:0 "[FROM.GetNameDefCap] Barış Teklifi Sunuyor"
 IRQ_political_events.61.a:0 "En azından kan dökülmesi sona erdi."
 IRQ_political_events.61.desc:0 "[FROM.GetNameDefCap], barış teklifimizi kabul etti. Şartlara göre [FROM.GetAdjective] otoritesine boyun eğiyoruz ve çatışma sona eriyor. Savaş bitti ancak bu karar, bağımsızlık ve egemenlik için savaşanlar arasında iç huzursuzluğa yol açabilir."
 IRQ_political_events.61.t:0 "[FROM.GetNameDefCap] Barış Anlaşmasını Kabul Etti"
 IRQ_political_events.62.a:0 "O zaman sonuna kadar savaşacağız."
 IRQ_political_events.62.desc:0 "[FROM.GetNameDefCap], barış teklifimizi reddetti ve koşulsuz teslim olmamızda ısrar ediyor. Müzakerelerin başarısız olmasıyla, çatışma sürecek ve Müttefiklerin tüm gücüyle yüzleşmek zorunda kalacağız. Önümüzde zorlu bir yol var, fakat bağımsızlık için kararlılığımız sarsılmaz."
 IRQ_political_events.62.t:0 "[FROM.GetNameDefCap] Barış Anlaşmasını Reddetti"
 IRQ_political_events.70.a:0 "Bir insan ne kadar şanslı olabilir ki?"
 IRQ_political_events.70.desc:0 "Bugün Musul'da, $IRQ_bakr_sidqi$, onbaşı Abdullah Al-Talafari tarafından gerçekleştirilen bir suikast girişiminin hedefi oldu. Genç adam, Sidqi'ye ve sağ kolu Muhmmad Ali Jawad'a silah doğrulttu. Saldırıda Jawad ağır yaralanırken, Sidqi en ufak bir zarar görmeden kurtuldu."
 IRQ_political_events.70.t:0 "$IRQ_bakr_sidqi$ Suikast Girişiminden Kurtuldu"
 IRQ_political_events.71.a:0 "Zaten yeterince meşruyuz"
 IRQ_political_events.71.b:0 "$IRQ_sharaf_bin_rajeh$ uygun olacaktır"
 IRQ_political_events.71.c:0 "Bize kral değil, başkan lazım!"
 IRQ_political_events.71.desc:0 "Ülkemizde pek çok kişi Golden Square'i meşru yöneticiler olarak kabul etmiyor ve bizi gaspçı ve meşruiyetten yoksun kişiler olarak görüyor. Bu sorunu çözmek için bakanlarımız birkaç çözüm önerdi. Ya halkın taleplerini göz ardı edip zamanla sönmesini bekleyeceğiz, ya da Emir of Taif'i II. Faysal için yeni bir naip olarak atayacağız. Elbette, dini nüfus arasında pek de popüler olmayacak bir cumhuriyet ilan etme seçeneği de var..."
 IRQ_political_events.71.t:0 "Yönetimimizi Meşrulaştırmak"
 IRQ_political_events.72.a:0 "Abd Al-Ilah naipliği devralacak"
 IRQ_political_events.72.b:0 "Onun yerine doğrudan Faysal II gelmeli!"
 IRQ_political_events.72.desc:0 "Bugün erken saatlerde, büyük kralımız I. Gazi, Bağdat'ta spor arabasıyla seyahat ederken geçirdiği bir trafik kazasında trajik biçimde hayatını kaybetti. Bazıları bunun yalnızca bir kaza olduğunu iddia ederken, bazıları ise kralın Kuveyt ile birleşme planları nedeniyle bunun Nuri Said'in emriyle olabileceğini öne sürüyor. Ancak kimse kesin olarak bilmiyor. Bir gerçek var ki, artık birinin bayrağı devralıp onun yerine geçmesi gerekiyor."
 IRQ_political_events.72.t:0 "I. Gazi'nin Ölümü"
 IRQ_political_events.73.a:0 "Abd Al-Ilah, Haşimi hakkını geri alacak"
 IRQ_political_events.73.b:0 "Anayasaya dayalı monarşimizin korunması şart!"
 IRQ_political_events.73.desc:0 "Merhum I. Gazi için yapılan cenaze törenleri nedeniyle monarşi yanlısı duygular arttı. Bu durum, Abd Al-Ilah'ın uzun süredir mutlak yönetimi baltalayan başbakanların yetkisini kısıtlaması ve Arabistan'da tam anlamıyla Haşimi yönetimini geri getirmek için iyi bir ilk adım oluşturuyor."
 IRQ_political_events.73.t:0 "Mutlak Haşimi Yönetimine Artan Destek"
 IRQ_political_events.74.a:0 "Tam zamanında."
 IRQ_political_events.74.b:0 "Bunu karşılayamayız."
 IRQ_political_events.74.desc:0 "Yeni [FROM.GetAdjective] dostlarımız, geniş kaynak sahalarına yatırım çekmek amacıyla petrol baronları ve sanayi yöneticilerinden oluşan bir heyet göndermeyi öneriyor. Anlaşma, silah karşılığı petrol şeklinde karşılıklı faydaya dayalı bir başlangıç takasıyla güvence altına alınacak."
 IRQ_political_events.74.t:0 "[FROM.GetName] Petrol Delegasyonu Davet Etti"
 IRQ_political_events.75.a:0 "Şahane"
 IRQ_political_events.75.desc:0 "[FROM.GetAdjective] dostlarımız, öncelikli bir takas anlaşması imzalamamız koşuluyla, gelecekteki yatırımları görüşmek üzere bir heyet göndermeyi kabul etti. Bu olumlu bir gelişme oldu."
 IRQ_political_events.75.t:0 "Delegasyon Kabul Edildi"
 IRQ_political_events.76.a:0 "Talihsiz bir durum"
 IRQ_political_events.76.desc:0 "Ne yazık ki [FROM.GetAdjective] hükümeti, değerli petrol kaynaklarını silah takası teklifimizi reddetti. Onların kaybı, bizim kazancımız oldu."
 IRQ_political_events.76.t:0 "Delegasyon Reddedildi"
 IRQ_political_events.77.a:0 "Gücümüz Büyüyor!"
 IRQ_political_events.77.b:0 "Ne yapalım"
 IRQ_political_events.77.desc:0 "[680.GetName] bölgesindeki hızlı bir harekatın ardından, [IRQ.GetAdjective] ordusu tüm büyük yerleşim yerlerini ele geçirdi ve bölgenin kendi kontrolleri altında olduğunu ilan etti."
 IRQ_political_events.77.t:0 "[IRQ.GetNameDefCap], [680.GetName] Bölgesini Fethetti"
 IRQ_political_events.78.a:0 "Geçici Bir Gerileme..."
 IRQ_political_events.78.b:0 "Deyrizor Ayakta!"
 IRQ_political_events.78.desc:0 "Ciddi zorluklarla karşılaşan [IRQ.GetAdjective] ordusu Deyrizor şehrinden geri çekildi, bu çatışmanın sonu olmayabilir ancak şimdilik bölge [SYR.GetAdjective] olarak kalacak."
 IRQ_political_events.78.t:0 "[IRQ.GetNameDefCap], [680.GetName] Bölgesinden Çekiliyor"
 IRQ_political_events.80.a:0 "Şiirleri herkesçe duyulsun."
 IRQ_political_events.80.desc:0 "Şiirleriyle uzun zamandır Bağdat hükümetinin arkasındaki yabancı eli alaya alan Maruf er-Rusafi, bir kez daha bütün kahvehanelerin gündeminde. Son şiirleri, borçlarını kanıyla ödemiş ve yalnızca kendisine hesap vermesi gereken bir ulusu anlatıyor; öğrenciler bunları sokaklarda açıkça okuyor. Sözleri, Irak'ın bütünüyle bağımsız olmasını isteyen herkese yeni bir ses verdi."
 IRQ_political_events.80.t:0 "Özgürlüğün Şairi"
 IRQ_regent_turned_down_absolute_powers:0 "§YAbd Al-Ilah§!, mutlak monarşiyi yeniden kurma fırsatını reddetti"
 IRQ_rusafi_verses_of_independence:0 "Er-Rusafi'nin Bağımsızlık Şiirleri"
 MainInvader190:0 "Bu sabah, [PER.GetAdjective] hükümetinden düşmanlıkları sona erdirme teklifini ve karşılığında bize geniş doğal kaynaklarına erişim izni vereceklerini bildiren haber aldık. Bu, savaşın hızlı bir şekilde sona ermesini sağlayacak ve daha büyük hedeflerimize odaklanmamıza olanak tanıyacak. Ayrıca, petrol imtiyazları sayesinde gelecekteki savaş çabalarını sürdürmek için iyi bir konumda olacağız."
 MainInvader191:0 "Görünüşe göre [FROM.GetAdjective] bizim teklifimizi kabul etti ve teslimiyet şartlarımızı hazırlamaya başladı. Bu, bazı doğal kaynaklarımızı kaybedeceğimiz anlamına geliyor, ancak [FROM.GetNameDef] kontrolü altında tam birer uyruk olmaktan çok daha avantajlı."
 MainInvader192:0 "Karanlık bir gün. Düşmanımız, kayıplarına ve barış taleplerimize rağmen topraklarımıza ilerlemeye devam etmeye karar verdi. Savaşı sonlandırmamıza ve onlara kaynaklarımızı vermemize izin vermemeleri hayal kırıklığı yaratıyor; bu yüzden savaşmaya devam etmekten başka seçeneğimiz yok."
 NotMainInvader190:0 "Bu sabah, [PER.GetAdjective] hükümetinden düşmanlıkları sona erdirme teklifi aldık. Şu an için bize doğrudan bir kazanç ya da geri ödeme olmasa da, bu teklif savaşın hızlı bir şekilde sona ermesini sağlayacak ve daha büyük hedeflerimize odaklanmamıza olanak tanıyacak."
 NotMainInvader191:0 "Görünüşe göre [FROM.GetAdjective] teklifimizi kabul etti ve teslimiyet şartlarımızı hazırlamaya başladı. Böyle bir duruma düşmemeyi umuyorduk ama içinde bulunduğumuz koşullarda, bu sonuç elden gelen en iyisi."
 NotMainInvader192:0 "Karanlık bir gün. Düşmanımız, kayıplarına ve barış taleplerimize rağmen topraklarımıza ilerlemeye devam etmeye karar verdi. Savaşı sonlandırmamıza izin vermemeleri hayal kırıklığı yaratıyor ve artık savaşmaya devam etmekten başka seçeneğimiz yok."
 PER_communist_events.1.a:0 "Endişe verici bir gelişme."
 PER_communist_events.1.desc:0 "Bizden bağımsızlık isteyen radikaller son günlerde daha da aktif olmaya başladı. Bu artışın neden kaynaklandığı tam olarak belli değil, ancak yerel otoriteler sokaklarda yükselen milliyetçi ve sosyalist söylemlerden endişe duyuyor. Durumun büyümesini önlemek istiyorsak, muhtemelen bir baskı başlatmamız gerekecek."
 PER_communist_events.1.t:0 "Radikal Faaliyetler Artıyor"
 PER_communist_events.10.a:0 "Avantaj bizdeyken saldıracağız."
 PER_communist_events.10.b:0 "Artık geri adım atma vakti."
 PER_communist_events.10.desc:0 "Körfez krizine diplomatik bir çözüm bulma şansımız, [FROM.GetNameDef]'in bölgedeki ablukamızı kırmak üzere bir donanma görev gücü göndermeye karar vermesiyle ortadan kalktı. Sürpriz üstünlüğümüzü korumak istiyorsak hemen önleyici saldırı başlatmalıyız. Yoksa geri adım atmamız gerekecek."
 PER_communist_events.10.t:0 "[FROM.GetNameDefCap] Donanmasını Gönderiyor"
 PER_communist_events.11.a:0 "Onların güvenliği bizimkinden ayrı değil."
 PER_communist_events.11.b:0 "Devlet sırlarını paylaşmayacağız."
 PER_communist_events.11.desc:0 "[FROM.GetNonIdeologyName] hükümeti, Basra Körfezi'ndeki sömürge güçlerine karşı anti-gemi teknolojilerinin geliştirilmesinde mühendislik desteği talep etti. Herhangi bir ilerlemede gelecekte bizimle iş birliği yapacaklarına dair taahhüt verdiler."
 PER_communist_events.11.t:0 "[FROM.GetNameDefCap] Askerî Teknoloji Talep Ediyor"
 PER_communist_events.12.a:0 "Mükemmel!"
 PER_communist_events.12.desc:0 "Mühendislerimiz, [FROM.GetAdjective]'nin bazı askeri teknolojileri bizimle paylaşma kararının ardından gizli [FROM.GetAdjective] araştırma ve tasarımlarının gelmesini sabırsızlıkla bekliyor. Bu, kendi tasarımlarımızı önemli ölçüde hızlandıracak."
 PER_communist_events.12.t:0 "[FROM.GetNameDefCap] Teknoloji Transferini Kabul Etti"
 PER_communist_events.13.a:0 "Onlarsız da başaracağız."
 PER_communist_events.13.desc:0 "[FROM.GetAdjective] hükümeti, Basra Körfezi'ni dış donanmalardan koruyacak teknolojilerin paylaşılmasını reddetti. Mühendislerimiz hayal kırıklığı yaşasa da, kendi başlarına geliştirmeye kararlılar."
 PER_communist_events.13.t:0 "[FROM.GetNameDefCap] Teknoloji Transferini Reddetti"
 PER_communist_events.14.a:0 "Sözlerinde durmaları iyi oldu."
 PER_communist_events.14.desc:0 "[FROM.GetNameDef] ile yaptığımız anlaşma uyarınca, bize sömürgecileri Basra Körfezi'nden çıkaracak bir silah tasarımı teslim ettiler. Tasarımın ihtiyacımızı karşılayıp karşılamayacağı yakında belli olacak."
 PER_communist_events.14.t:0 "[FROM.GetNameDefCap] Tasarım Teslim Etti"
 PER_communist_events.2.a:0 "Çabalarımızı iki katına çıkaracağız."
 PER_communist_events.2.desc:0 "[FROM.GetAdjective] otoriteleri, bölge genelinde Kürt bağımsızlık hareketlerini bastırdı. Bölgedeki bağlantılarımız ya saklandı ya da [ROOT.GetNameDef]'e kaçtı."
 PER_communist_events.2.t:0 "Kürt Bağımsızlık Hareketine Baskı"
 PER_communist_events.20.a:0 "Onlara özerklik ver."
 PER_communist_events.20.b:0 "Bu topraklar yetki alanımızda kalmalı."
 PER_communist_events.20.desc:0 "Aşiret yapısını zayıflatma çabalarına karşı koymak ve daha fazla özerklik talebine yanıt olarak, yeni kurulan K*rdistan Demokrat Partisi resmi olarak [SOU.GetNameDef] içinde ayrı bir Sosyalist Cumhuriyet olarak işlev görmek istemektedir. Burada bir tercih yapmalıyız. Ya bu bölge üzerindeki kontrolü kendimiz sürdüreceğiz ya da bunu [KUR.GetAdjective] halkına bırakacağız."
 PER_communist_events.20.t:0 "[KUR.GetAdjective] Halkı Özerklik Talep Ediyor"
 PER_communist_events.3.a:0 "Bu tırmanışı önlemeliyiz!"
 PER_communist_events.3.desc:0 "Kürt ayrılıkçıları ve sosyalistler arasında son günlerde faaliyetler zirveye ulaştı. Ülke genelinde silah dağıtıldığına dair artan kanıtlar var ve önümüzdeki haftalarda bir isyan kaçınılmaz olabilir. Harekete geçmezsek, büyük bir savaş kaçınılmaz!"
 PER_communist_events.3.t:0 "Kürt İsyanı Yaklaşabilir"
 PER_communist_events.4.a:0 "Bunun arkasında kim var?"
 PER_communist_events.4.desc:0 "Son günlerde [PER.GetAdjective] sınırı çevresindeki topraklarda işgalimize karşı direniş belirgin şekilde arttı. Sebebi tam olarak bilinmese de, birilerinin bölgede anti-[ROOT.GetAdjective] duyguları körüklediğinden endişe ediliyor."
 PER_communist_events.4.t:0 "[PER.GetAdjective] Sınırında Direniş Artıyor"
 PER_communist_events.5.a:0 "Tepkiyle geri çekiliyoruz."
 PER_communist_events.5.b:0 "Onlar ve hangi donanmayla?"
 PER_communist_events.5.desc:0 "Görünüşe göre Basra Körfezi ve çevre bölgelerdeki son zamanlardaki kargaşanın çoğunun kaynağı muhtemelen [FROM.GetNameDef]'den geliyor. Bölgede elde ettikleri bir dizi stratejik zaferle birlikte, şimdiye kadarki en büyük hamlelerini yapabilecek kadar cesaretlenmiş görünüyorlar. Hükümetimize sert bir uyarıda bulunan [FROM.GetAdjective] rejimi, Arap Yarımadası ve Basra Körfezi'nden tamamen çekilmemizi talep etti; hatta uymamamız halinde Körfez'i ablukaya alma isteklerini gösterecek kadar ileri gitti."
 PER_communist_events.5.t:0 "Basra Körfezi Krizi"
 PER_communist_events.6.a:0 "İşimiz henüz bitmedi!"
 PER_communist_events.6.desc:0 "Diplomatik gösterişe rağmen, [FROM.GetAdjective] kuvvetleri bölgeden çekilmeye başladı. Bu, hükümetimiz için büyük bir stratejik zafer ve dünyanın birçok yerinde sömürgecilik karşıtı bir gelişme olarak kutlanıyor."
 PER_communist_events.6.t:0 "[FROM.GetNameDefCap] Geri Çekilmeyi Kabul Etti"
 PER_communist_events.7.a:0 "O halde kararlılığımızı gösterelim."
 PER_communist_events.7.b:0 "Bu kadar tırmandırmaya gücümüz yetmez."
 PER_communist_events.7.desc:0 "[FROM.Capital.GetCapitalVictoryPointName]'deki inatçı aptallar, Basra Körfezi ve Arabistan'daki tartışmalı bölgelerden çekilmeyi reddetti. Görünüşe göre tehditlerimizi uygulama irademiz olmadığını düşünüyorlar."
 PER_communist_events.7.t:0 "[FROM.GetNameDefCap] Geri Çekilmeyi Reddediyor"
 PER_communist_events.8.a:0 "Topçuları hazırlayın."
 PER_communist_events.8.b:0 "Mesajlarını aldık, çekilme emrini ver."
 PER_communist_events.8.desc:0 "Körfez krizinde açık bir tırmanış olarak, [FROM.GetNameDef] tehditlerini hayata geçirerek sivil deniz ve hava taşımacılığını engellemeye başladı. Ayrıca askeri birimleri de olası bir çatışmaya karşı yüksek alarma geçirdi."
 PER_communist_events.8.t:0 "[FROM.GetNameDefCap] Basra Körfezini Ablukaya Aldı"
 PER_communist_events.9.a:0 "Bu onlara ders olur."
 PER_communist_events.9.desc:0 "[FROM.GetNameDef]'in son zamanlardaki yüksek perdeden çıkışları, bölgedeki kararlılığımız karşısında kırıldı. [FROM.GetLeader], bölgedeki barışı koruma arzusunu belirten alçakgönüllü bir konuşma yaptı. Müttefikleri, [FROM.GetAdjective] ilkelerini terk etmelerinden dolayı şaşkına dönmüş olabilir."
 PER_communist_events.9.t:0 "[FROM.GetNameDefCap] Söylemini Yumuşattı"
 PER_communist_events_1_tt:0 "Direnişi bastırmak için §Y$PER_anti_gulf_decisions_cat$§! kararları açılır."
 PER_communist_events_3_tt:0 "§RBir Kürt isyanı ve savaşından kaçınmak için ayaklanmaya karşı baskı uygulamalıyız!§!"
 PER_communist_events_4_tt:0 "§RÖnümüzdeki aylarda Basra Körfezi'ndeki eyaletlerimizde direniş artabilir!§!"
 PER_fascist_events.1.a:0 "Bir kukla Pahlavi bizim için yeterli."
 PER_fascist_events.1.b:0 "Yeni İran için yeni bir hanedan!"
 PER_fascist_events.1.desc:0 "İmparatorluk Konseyi, Şah'ın kim olacağına karar vermek için toplandı. Bazıları, meşruiyet sağlamak için Kaçar hanedanını yeniden kurmayı savunurken; diğerleri ise Pahlavi Hanedanı'nın devam etmesini, bir kısmı da yeni bir hanedanın kurulmasını öneriyor."
 PER_fascist_events.1.t:0 "İmparatorluk Konseyi Toplanıyor"
 PER_fawzia_married:0 "Fawzia Fuad Evlendi"
 PER_foreign_policy_events.1.a:0 "Savaşmak faydasız olur."
 PER_foreign_policy_events.1.b:0 "Bırak gelsinler!"
 PER_foreign_policy_events.1.desc:0 "[FROM.GetAdjective] hükümeti, diplomatik durumumuzdan giderek daha fazla endişe duymaya başlıyor gibi görünüyor. Geçen hafta boyunca, [FROM.GetAdjective] büyükelçisi [THIS.GetLeader] ile tam altı kez görüştü ve son turda neredeyse bir ültimatom verdi.\n\nYa [FROM.GetNameDef] ile savunma paktına katılır ve 'iç işlerinde belli bir seviyede danışmanlığı' kabul ederiz, ya da [FROM.GetNameDef] muhtemelen ülkemize askeri müdahalede bulunacak."
 PER_foreign_policy_events.1.t:0 "[FROM.GetNameDef]'den Baskı"
 PER_foreign_policy_events.2.a:0 "Şimdilik daha fazla zorlamayalım..."
 PER_foreign_policy_events.2.b:0 "[FROM.GetNameDef]'i işgal etmeye hazırlanın!"
 PER_foreign_policy_events.2.c:0 "[SOU.GetAdjective] ile birlikte ortak işgale hazırlanalım"
 PER_foreign_policy_events.2.desc:0 "[FROM.GetNameDef] ile olan sorunlarımızı diplomatik yollarla çözme girişimlerimiz başarısız oldu. Büyükelçimiz, bir tur daha görüşme yapmak istediğinde, [FROM.GetLeader] tarafından kaba bir şekilde, [FROM.GetAdjective]ların pozisyonunun net olduğu ve tartışacak başka bir şey olmadığı söylendi."
 PER_foreign_policy_events.2.t:0 "[FROM.GetNameDefCap] Reddediyor"
 PER_foreign_policy_events.3.a:0 "Fars Koridorunu güvence altına almalıyız!"
 PER_foreign_policy_events.3.b:0 "[PER.GetAdjective] bağımsızlığına saygı göstereceğiz."
 PER_foreign_policy_events.3.desc:0 "[FROM.GetNameDef]'den, [PER.GetNameDef]'e karşı ortak askeri operasyon öneren bir diplomatik nota aldık. [FROM.GetAdjective] Komutanlığı, bu operasyonun İran petrol sahalarını ve [FROM.GetNameDef]'e ikmal hatlarımızı güvence altına alacağını ve aynı zamanda potansiyel bir düşmanın [TUR.GetNameDef] üzerinden [PER.GetName] yoluyla Bakü petrol sahalarına ve [RAJ.GetNameDef]'e ilerlemesini önleyeceğini belirtiyor."
 PER_foreign_policy_events.3.t:0 "Anglo-[SOV.GetAdjective] İran İşgali"
 PER_foreign_policy_events.4.a:0 "Hazırlıklara başla!"
 PER_foreign_policy_events.4.desc:0 "[FROM.GetAdjective] büyükelçisi, [FROM.GetNameDef]'nin [PER.GetNameDef]'ye karşı ortak bir askeri operasyon düzenlemeyi ve yürütmeyi kabul ettiğini belirten bir not iletti. Hem [ROOT.GetAdjective] hem de [FROM.GetAdjective] Komutları, bunun İran petrol sahalarını ve [FROM.GetAdjective] tedarik hatlarını [ROOT.GetNameDef]'ye güvenli hale getirmemize olanak tanıyacak, aynı zamanda [TUR.GetNameDef]'den potansiyel bir düşman ilerlemesini önleyecek, sayıca az ve teknolojik olarak rakipsiz bir düşmana karşı hızlı ve etkili bir operasyon olacağından emindir. [PER.GetName] Bakü petrol sahalarına ve [RAJ.GetNameDef]'ye doğru."
 PER_foreign_policy_events.4.t:0 "Anglo-[SOV.GetAdjective] İran İşgali"
 PER_foreign_policy_events.5.a:0 "Her zamanki gibi güvenilmezler..."
 PER_foreign_policy_events.5.desc:0 "[ROOT.GetAdjective] ve [FROM.GetAdjective] diplomatları arasındaki birkaç yorucu toplantıdan sonra [FROM.GetNameDef], [PER.GetNameDef] planlarımıza dahil olmamaya karar verdi. [FROM.GetLeader]'nin kendisi bile bu teklifin bölgesel hırslarımızı haklı çıkarma girişiminden başka bir şey olmadığını ima etmeye cüret etti. \nGörünüşe göre [PER.GetNameDef] ile kendi başımıza uğraşmak zorunda kalacağız."
 PER_foreign_policy_events.5.t:0 "[FROM.GetAdjective] Hükümeti Reddediyor."
 PER_imperial_events.1.a:0 "Kabul ediyoruz. Bu herkesin yararına."
 PER_imperial_events.1.b:0 "Buna razı olamayız."
 PER_imperial_events.1.desc:0 "Bu sabah, [PER.Capital.GetCapitalVictoryPointName]'den bir elçi [SOU.Capital.GetCapitalVictoryPointName]'ye ulaştı ve [PER.GetNameDef] Şahı'nın iki ülkenin güvenliği için bir saldırmazlık paktı imzalama teklifini getirdi. [PER.GetNameDef]'in güney sınırlarımıza yakınlığı göz önüne alındığında, bunu ciddiye almalıyız."
 PER_imperial_events.1.t:0 "[FROM.GetNameDefCap] Saldırmazlık Görüşmesi İstiyor"
 PER_imperial_events.10.a:0 "Onlara boyun eğmekten başka çaremiz yok."
 PER_imperial_events.10.b:0 "Belki de bu topraklar için bizden bir bedel ödeyebilirler?"
 PER_imperial_events.10.c:0 "Bunu ancak ölümüz üzerinden alırlar."
 PER_imperial_events.10.desc:0 "Bugün [PER.GetNameDef] Şahı'ndan Belucistan bölgesindeki hakimiyetimizi bırakmamızı talep eden bir mesaj alındı. [PER.GetAdjective] hükümetine göre, bu topraklar ilahi hakla onların. Dikkatli olmalıyız, onları kışkırtırsak savaş ilan edebilirler."
 PER_imperial_events.10.t:0 "[FROM.GetNameDefCap] Belucistan Topraklarını Talep Ediyor"
 PER_imperial_events.100.a:0 "Bir daha saldırmaya kalkmasınlar!"
 PER_imperial_events.100.desc:0 "İşgalcileri püskürttükten ve onları kendi topraklarına geri gönderdikten sonra, düşmanlarımızı barış görüşmeleri için Tahran'a davet ettik. Neyse ki önerimize sıcak baktılar ve saatler süren müzakereler sonrası, artık [PER.GetNameDef]'e saldırmayacaklarına ve sınırdaki bazı topraklarını bize bırakacaklarına dair anlaştık."
 PER_imperial_events.100.t:0 "Tahran Antlaşması"
 PER_imperial_events.101.a:0 "Başkentlerine kadar kovalamalıyız!"
 PER_imperial_events.101.desc:0 "İşgalcileri püskürttükten ve onları kendi topraklarına gönderdikten sonra, düşmanlarımızı barış görüşmeleri için Tahran'a davet ettik. Maalesef, barış teklifimize olumlu yanıt vermediler ve savaş devam ediyor."
 PER_imperial_events.101.t:0 "Başarısız Müzakereler"
 PER_imperial_events.11.a:0 "Harika iş."
 PER_imperial_events.11.desc:0 "Harika haber. [FROM.GetNameDefCap] akıllıca bir kararla Belucistan topraklarını kontrolümüze bıraktı. Sonunda İndus bölgesinde bir dayanağımız var."
 PER_imperial_events.11.t:0 "[FROM.GetNameDefCap] Belucistan'ı Teslim Ediyor"
 PER_imperial_events.110.a:0 "$PER_imperial_events.80.a$"
 PER_imperial_events.110.b:0 "$PER_imperial_events.80.b$"
 PER_imperial_events.110.desc:0 "$PER_imperial_events.80.desc$"
 PER_imperial_events.110.t:0 "$PER_imperial_events.80.t$"
 PER_imperial_events.111.a:0 "Planımız işe yaradı!"
 PER_imperial_events.111.desc:0 "[SOV.GetAdjective]ları püskürttükten ve onları kendi topraklarına gönderdikten sonra, barış görüşmeleri için Tahran'a davet ettik. Neyse ki önerimize sıcak baktılar ve saatler süren müzakerelerden sonra, sınır topraklarını savaşın devamını önlemek amacıyla bize bırakacaklarına anlaştık."
 PER_imperial_events.111.t:0 "Sınır Devletlerimizi Güvence Altına Almak"
 PER_imperial_events.112.a:0 "Başkentlerine kadar kovalamalıyız!"
 PER_imperial_events.112.desc:0 "[SOV.GetAdjective]ları püskürttükten ve onları kendi topraklarına gönderdikten sonra, barış görüşmeleri için Tahran'a davet ettik. Maalesef, barış teklifimize olumlu yanıt vermediler ve savaş devam ediyor."
 PER_imperial_events.112.t:0 "Başarısız Müzakereler"
 PER_imperial_events.12.a:0 "Tamam, öyle olsun."
 PER_imperial_events.12.b:0 "O halde zorla alırız."
 PER_imperial_events.12.c:0 "Bu iş fazla riskli oldu. Görüşmeleri kes."
 PER_imperial_events.12.desc:0 "[RAJ.GetAdjective] hükümeti, Belucistan'ı hiçbir tazminat almadan bırakmak istemiyor gibi görünüyor. Taleplerini kabul edebilir ya da onlara savaş ilan edebiliriz. Seçim senin."
 PER_imperial_events.12.t:0 "[FROM.GetNameDefCap] Belucistan'ı Satmayı Teklif Ediyor"
 PER_imperial_events.120.a:0 "Evet, bu kabul edilebilir."
 PER_imperial_events.120.b:0 "Asla, başkente kadar ilerleyin."
 PER_imperial_events.120.desc:0 "Bu sabah [PER.GetAdjective] hükümetinden teslimiyet niyetiyle bir mesaj aldık. Bunun bir parçası olarak, topraklarını işgal etmemize ve monarşilerini kukla lider olarak sürdürmelerine izin vermeye razılar. Ne cevap vermeliyiz?"
 PER_imperial_events.120.t:0 "[PER.GetNameDefCap] Teslimiyet Müzakeresi"
 PER_imperial_events.121.a:0 "Bu bir rahatlama..."
 PER_imperial_events.121.desc:0 "[ENG.GetAdjective] hükümeti, [PER.GetNameDef]'i kendi gözetimlerinde yönetmemize izin vermeyi kabul etti. Umarız bu kan dökülmesini sona erdirir."
 PER_imperial_events.121.t:0 "[ENG.GetNameDefCap] Teklifimizi Kabul Etti"
 PER_imperial_events.122.a:0 "Kara günler..."
 PER_imperial_events.122.desc:0 "[ENG.GetAdjective] hükümeti teslim teklifimizi reddetti. Savaşa devam etmek zorundayız; ancak kaybedersek şartlarını kabul edeceğiz."
 PER_imperial_events.122.t:0 "[ENG.GetNameDefCap] Teklifimizi Reddetti"
 PER_imperial_events.13.a:0 "Harika!"
 PER_imperial_events.13.desc:0 "Mükemmel haber! [PER.GetNameDef] Şahı, Belucistan'ın kontrolüne geçmesi için bize ödeme yapmayı kabul etti. Küçük bir toprak kaybettik ama para kendi çabalarımıza yardımcı olacak."
 PER_imperial_events.13.t:0 "[FROM.GetNameDefCap] Belucistan'ı Satın Almayı Kabul Etti"
 PER_imperial_events.130.a:0 "Evet, bu kabul edilebilir."
 PER_imperial_events.130.b:0 "Asla, başkente kadar ilerleyin."
 PER_imperial_events.130.desc:0 "Bu sabah [PER.GetAdjective] hükümetinden teslimiyet niyetiyle bir mesaj aldık. Teslimiyetin bir parçası olarak, kuzey topraklarını bize bırakmaya razılar. Ne cevap vermeliyiz?"
 PER_imperial_events.130.t:0 "[PER.GetNameDefCap] Teslimiyet Müzakeresi"
 PER_imperial_events.131.a:0 "Bu bir rahatlama..."
 PER_imperial_events.131.desc:0 "[SOU.GetAdjective] hükümeti teklifimizi kabul etti. Kuzey topraklarımızı kaybettik ama en azından [SOU.GetAdjective] Ordusu'nun ilerlemesini durdurduk..."
 PER_imperial_events.131.t:0 "[SOU.GetNameDefCap] Teklifimizi Kabul Etti"
 PER_imperial_events.132.a:0 "Kara günler..."
 PER_imperial_events.132.desc:0 "[SOU.GetAdjective] hükümeti teslimiyet teklifimizi reddetti. Savaşa devam etmek zorundayız; ancak kaybedersek şartlarını kabul edeceğiz."
 PER_imperial_events.132.t:0 "[SOU.GetNameDefCap] Teklifimizi Reddetti"
 PER_imperial_events.14.a:0 "Askerlerimizi toplayın!"
 PER_imperial_events.14.desc:0 "Korkarım ki kumarımız işe yaramadı; [PER.GetNameDef] Şahı, bildirimimizi alır almaz ülkemize resmi olarak savaş ilan etti. Askerleri, istediklerini zorla almak için İndus'a saldırmaya hazırlanıyor. Üzücü bir durum."
 PER_imperial_events.14.t:0 "[FROM.GetNameDefCap] Savaş İlan Etti"
 PER_imperial_events.140.a:0 "Onlara bir ders vermek lazım"
 PER_imperial_events.140.b:0 "Daha önemli işlerimiz var"
 PER_imperial_events.140.desc:0 "[FROM.GetLeader], [FROM.GetNameDef]'nin artık [ROOT.GetAdjective] derebeyliğini kabul etmeyeceğini açıkladı. [FROM.GetNameDefCap], mümkünse [ROOT.GetNameDef] ile iyi ilişkiler sürdürmek istiyor ancak [FROM.GetLeader], gerekirse silaha sarılmaya ve bağımsızlıkları için savaşmaya hazır olduklarını belirtiyor."
 PER_imperial_events.140.t:0 "[FROM.GetNameDefCap] Bağımsızlık İlan Ediyor"
 PER_imperial_events.141.a:0 "Azadi! Son adama kadar savaşacağız!"
 PER_imperial_events.141.desc:0 "Beklendiği gibi, [FROM.getLeader], [ROOT.GetLeader]'dan resmi bağımsızlık talebini reddetti. Bu beklenen bir gelişme olduğundan, [ROOT.GetAdjective] silahlı kuvvetleri ülkenin kilit noktalarını zaten güvence altına aldı. Ulus bu kez çok daha hazırlıklı."
 PER_imperial_events.141.t:0 "Mücadele Yeniden Başladı"
 PER_imperial_events.142.a:0 "Baskıdan kurtulduk"
 PER_imperial_events.142.desc:0 "Oldukça şaşırtıcı bir şekilde, [FROM.GetLeader], [ROOT.GetAdjective] bağımsızlık ilanını kabul etti. Bu noktadan itibaren, [FROM.GetNameDef] artık [ROOT.GetAdjective] siyasetine herhangi bir müdahalede bulunmayacak. [ROOT.Capital.GetCapitalVictoryPointName]'de [ROOT.GetLeader] önderliğini kutlayan büyük bir kalabalık toplandı."
 PER_imperial_events.142.t:0 "[PER.GetAdjective] Onuru Geri Kazanıldı"
 PER_imperial_events.15.a:0 "Neyse ki."
 PER_imperial_events.15.desc:0 "[PER.GetNameDef], Belucistan bölgesini zorla almaya çalışmanın riskli olacağına karar verdi. En azından şimdilik barış içindeyiz."
 PER_imperial_events.15.t:0 "[FROM.GetNameDefCap] Geri Adım Attı"
 PER_imperial_events.150.a:0 "Durum lehimize değil..."
 PER_imperial_events.150.b:0 "Devam etmeliyiz! Kazanacağız!"
 PER_imperial_events.150.desc:0 "Savaş ilerledikçe hedeflerimize belirlediğimiz sürede ulaşamadık. Son zamanlarda [FROM.GetAdjective] hükümetinden savaşın sona ermesi için barış talepleri aldık. Savaşı sürdürebiliriz ama kendi kayıplarımızı da hesaba katmalıyız."
 PER_imperial_events.150.t:0 "[FROM.GetNameDefCap] Beyaz Barış Talep Ediyor"
 PER_imperial_events.151.a:0 "Bu bir zaferdir!"
 PER_imperial_events.151.desc:0 "Harika haber! [FROM.GetNameDefCap], barış taleplerimizi kabul etti ve birliklerini sınırlarımızdan çekmeye başladı. Onları durdurmak için çok uğraştık ve bu gün yıllarca kutlanmalı!"
 PER_imperial_events.151.t:0 "[FROM.GetNameDefCap] Kuvvetlerini Çekiyor"
 PER_imperial_events.152.a:0 "Fırsatı değerlendirmedikleri için pişman olacaklar!"
 PER_imperial_events.152.desc:0 "Kara bir gün. Düşmanlarımız, kayıplarına ve barış taleplerimize rağmen ilerlemeye devam etmeye karar verdi. Savaşmak istiyorlarsa, savaşacaklar!"
 PER_imperial_events.152.t:0 "[FROM.GetNameDefCap] Taviz Vermiyor"
 PER_imperial_events.153.a:0 "Tüm birlikleri derhal geri çekin."
 PER_imperial_events.153.desc:0 "Bu sabah, Savaş Kabinesi’nden, [PER.GetNameDef]e karşı taarruzu yöneten müttefiklerimizin düşmanla barış görüşmeleri süresince düşmanlıkları sona erdirmemizi talep ettiklerine dair haber aldık. [FROM.GetAdjective] hükümetine yardım etmek için çatışmaya katıldığımızdan, savaşmaya devam etmemiz mantıklı olmaz."
 PER_imperial_events.153.t:0 "[FROM.GetNameDefCap] Barış Çağrısında Bulunuyor"
 PER_imperial_events.16.a:0 "O halde savaş!"
 PER_imperial_events.16.desc:0 "[RAJ.GetAdjective] hükümeti, Belucistan topraklarını bırakmayı kesin olarak reddetti. Şimdi [RAJ.GetNameDef]'e karşı savaş açmanın zamanı!"
 PER_imperial_events.16.t:0 "[FROM.GetNameDefCap] Belucistan'ı Vermeyi Reddediyor"
 PER_imperial_events.160.a:0 "Durum lehimize değil..."
 PER_imperial_events.160.b:0 "Devam etmeliyiz! Kazanacağız!"
 PER_imperial_events.160.desc:0 "Savaş ilerledikçe, hedeflerimize belirlediğimiz sürede ulaşamadık. Hatta saldırmaya çalıştıklarımız, bizi kendi topraklarımıza kadar geri püskürttü. Son olarak, [FROM.GetAdjective] hükümetinden savaşı sona erdirmek üzere teslim olmamızı talep eden bir mesaj aldık. Teslim olursak, [PER.GetNameDef] bizden sınır bölgelerini kendilerine bırakmamızı istiyor. Savaşı sürdürebiliriz, ancak kendi kayıplarımızı da hesaba katmalıyız."
 PER_imperial_events.160.t:0 "[FROM.GetNameDefCap] Teslim Olmamızı Talep Ediyor"
 PER_imperial_events.161.a:0 "Bu bir zaferdir!"
 PER_imperial_events.161.desc:0 "Harika haber! [FROM.GetNameDefCap] barış taleplerimizi kabul etti ve birliklerini sınırlarımızdan çekmeye başladı. Ayrıca sınır bölgelerini bize bırakma sürecini başlattılar. Onları durdurmak için çok uğraştık ve bu gün yıllarca kutlanmalı!"
 PER_imperial_events.161.t:0 "[FROM.GetNameDefCap] Kuvvetlerini Çekiyor"
 PER_imperial_events.162.a:0 "Fırsatı değerlendirmedikleri için pişman olacaklar!"
 PER_imperial_events.162.desc:0 "Kara bir gün. Düşmanlarımız, kayıplarına ve barış taleplerimize rağmen ilerlemeye devam etmeye karar verdi. İşledikleri suçların bedelini ödemeye yanaşmamaları, yaşanan her şeye hakarettir. Savaşmak istiyorlarsa, savaşacaklar!"
 PER_imperial_events.162.t:0 "[FROM.GetNameDefCap] Taviz Vermiyor"
 PER_imperial_events.170.a:0 "Durum lehimize değil..."
 PER_imperial_events.170.b:0 "Devam etmeliyiz! Kazanacağız!"
 PER_imperial_events.170.desc:0 "Savaş ilerledikçe, hedeflerimize belirlediğimiz sürede ulaşamadık. Hatta saldırmaya çalıştıklarımız, bizi kendi topraklarımıza kadar geri püskürttü. Son olarak, [FROM.GetAdjective] hükümetinden savaşı sona erdirmek üzere teslim olmamızı talep eden bir mesaj aldık. Teslim olursak, birkaç yıl boyunca savaş tazminatı ödememiz gerekecek. Savaşı sürdürebiliriz, ancak kendi kayıplarımızı da hesaba katmalıyız."
 PER_imperial_events.170.t:0 "[FROM.GetNameDefCap] Teslim Olmamızı Talep Ediyor"
 PER_imperial_events.171.a:0 "Bu bir zaferdir!"
 PER_imperial_events.171.desc:0 "Harika haber! [FROM.GetNameDefCap], barış taleplerimizi kabul etti ve birliklerini sınırlarımızdan çekmeye başladı. Savaş sırasında işledikleri suçlar sayesinde onlardan tazminat da alabildik. Onları durdurmak için çok uğraştık ve bu gün yıllarca kutlanmalı!"
 PER_imperial_events.171.t:0 "[FROM.GetNameDefCap] Kuvvetlerini Çekiyor"
 PER_imperial_events.172.a:0 "$PER_imperial_events.162.a$"
 PER_imperial_events.172.desc:0 "$PER_imperial_events.162.desc$"
 PER_imperial_events.172.t:0 "$PER_imperial_events.162.t$"
 PER_imperial_events.180.a:0 "Bu herkes için faydalı."
 PER_imperial_events.180.b:0 "Bu seçenek olamaz, savaşa devam."
 PER_imperial_events.180.desc:0 "Bu sabah, [PER.GetAdjective] hükümetinden savaşın sona erdirilmesi ve karşılığında kendi iradeleriyle yönetimlerinin bizim kontrolümüzde bir kuklaya dönüşmesi teklifi aldık. Bu, savaşı hızla sona erdirecek ve daha büyük hedeflerimize odaklanmamıza olanak tanıyacaktır."
 PER_imperial_events.180.t:0 "[FROM.GetNameDefCap] Bağlılık Yemini Etmeyi Teklif Ediyor"
 PER_imperial_events.181.a:0 "Pirus zaferi, ama elimizden gelenin en iyisi."
 PER_imperial_events.181.desc:0 "Görünüşe göre [FROM.GetAdjective]lar teklifimizi kabul etti ve teslimiyet şartlarımızı hazırlamaya başladılar. Her ne kadar ideal bir durum olmasa da, [FROM.GetNameDef]i kendi yönetimleri altında bırakmak, pek çok hayatı kurtaracaktır."
 PER_imperial_events.181.t:0 "[FROM.GetNameDefCap] Şartlarımızı Kabul Etti"
 PER_imperial_events.182.a:0 "Bu gerçekten üzücü..."
 PER_imperial_events.182.desc:0 "Kara bir gün. Düşmanlarımız, kayıplarına ve barış taleplerimize rağmen ilerlemeye devam etmeye karar verdi. Zaferle savaşı bitirmemize izin vermemeleri üzücü; savaşa devam etmekten başka çaremiz yok."
 PER_imperial_events.182.t:0 "[FROM.GetNameDefCap] Şartlarımızı Reddetti"
 PER_imperial_events.190.a:0 "Bu şartları kabul edebiliriz"
 PER_imperial_events.190.b:0 "Bu bizim için uygun değil, savaşa devam."
 PER_imperial_events.190.desc:0 "Bu sabah, [PER.GetAdjective] hükümetinden çatışmaları sona erdirme teklifi aldık; karşılığında ittifakımıza çok büyük miktardaki doğal kaynaklarına erişim izni verecekler. Bu, savaşı hızla sona erdirecek ve daha büyük hedeflerimize odaklanmamızı sağlayacaktır. Sadece bununla kalmayıp, petrol imtiyazlarıyla gelecekteki olası savaş çabalarımızı sürdürmek için de iyi bir konumda olacağız."
 PER_imperial_events.190.t:0 "[FROM.GetNameDefCap] Teslimiyet Şartlarını Görüşmek İstiyor"
 PER_imperial_events.191.a:0 "Bu, [PER.GetNameDef] için yapabileceğimiz en iyisi."
 PER_imperial_events.191.desc:0 "Görünüşe göre [FROM.GetAdjective] teklifimizi kabul etti ve teslim şartlarımızı hazırlamaya başladı. Bu durum bazı doğal kaynaklarımızdan mahrum kalacağımız anlamına gelse de, [FROM.GetNameDef] kontrolü altında tamamen tebaa olmaktan çok daha elverişlidir."
 PER_imperial_events.191.t:0 "[FROM.GetNameDefCap] Şartlarımızı Kabul Etti"
 PER_imperial_events.192.a:0 "Bu gerçekten üzücü..."
 PER_imperial_events.192.desc:0 "Karanlık bir gün. Düşmanımız, kayıplarına ve barış taleplerimize rağmen topraklarımıza doğru ilerlemeye devam etme kararı aldı. Savaşı bitirmemize ve kaynaklarımızı onlara vermemize izin vermekteki isteksizlikleri hayal kırıklığı yaratıyor ve savaşmaya devam etmekten başka seçeneğimiz yok."
 PER_imperial_events.192.t:0 "[FROM.GetNameDefCap] Şartlarımızı Reddetti"
 PER_imperial_events.2.a:0 "Mükemmel haber."
 PER_imperial_events.2.desc:0 "Harika haber! Elçimiz [SOU.Capital.GetCapitalVictoryPointName]'den döndü ve [SOU.GetNameDef] bizimle saldırmazlık paktı yapmak istiyor. Böylece [SOU.GetAdjective]ların işimize karışmasını engelleyerek savaş planlarımızı sürdürebiliriz."
 PER_imperial_events.2.t:0 "[SOU.GetNameDefCap] Saldırmazlık Paktına Katılıyor"
 PER_imperial_events.20.a:0 "[PER.GetNameDef] için üzücü bir gün..."
 PER_imperial_events.20.desc:0 "Bu öğleden sonra Tahran'ın merkezinde silah sesleri duyuldu ve ulusa hitaben yaptığı konuşmada Rıza Şah Pehlevi bir kurşunla vuruldu ve durumu kritik hale geldi. İlk müdahale ekiplerinin tüm çabalarına rağmen Şah, aldığı yaralardan dolayı ne yazık ki hayatını kaybetti. Suçluların, Şah'ın liderliğine karşı çıkan [PER.GetAdjective] ordusundaki subaylar olduğu ortaya çıktı. Rıza Şah Pehlevi'nin oğlu Muhammed Rıza Pehlevi, [PER.GetNameDef]'nin yeni Şahı olarak yemin edecek. Onun yönetiminin daha az çalkantılı olmasını umalım."
 PER_imperial_events.20.t:0 "Rıza Şah Pehlevi Suikasta Uğradı!"
 PER_imperial_events.200.a:0 "Elbette bu dostluk paktını imzalayacağız!"
 PER_imperial_events.200.b:0 "Biz akraba değiliz, [SSB_leader.GetLeader]: seni tanımıyoruz."
 PER_imperial_events.200.desc:0 "[SSB_leader.GetLeader], [ROOT.GetLeader]'ye karşılıklı bir saldırmazlık paktı imzalama önerisiyle yaklaştı ve gelecekte daha fazla işbirliği olasılığını açık bıraktı. [event_target:SSB_leader.GetAdjective] diplomatları, iki ulusumuzun ortak tarihleri ​​ve çıkarları hakkında ayrıntılara girerek ve ardından kardeş uluslar arasında barışa yönelik ciddi bir çağrıda bulunarak kendi sahalarında çok çalıştılar. İleri geri müzakereler keyifli geçti, ancak imzalayıp imzalamama kararı sonuçta bize düşüyor."
 PER_imperial_events.200.t:0 "Sadabad Paktı"
 PER_imperial_events.201.a:0 "[ROOT.GetNameDef]'e her zaman sadık bir dost olacaksın."
 PER_imperial_events.201.desc:0 "[FROM.GetLeader], dostluk antlaşması ve saldırmazlık paktı teklifimizi büyük bir coşkuyla kabul etti ve hiç vakit kaybetmeden anlaşmayı imzaladı. Bu anlaşma sayesinde, ülkede ve dünyada barışa bir adım daha yaklaştık!"
 PER_imperial_events.201.t:0 "[FROM.GetName] Sadabad Paktını İmzaladı"
 PER_imperial_events.202.a:0 "...bunu 'hayır' diyerek de geçiştirebilirdin."
 PER_imperial_events.202.desc:0 "[FROM.GetLeader], [ROOT.GetLeader]'ye uzun soluklu bir mektup kaleme aldı ve onlara bir dostluk anlaşması ve saldırmazlık anlaşması teklifinin üzerinde düşünüldüğü kağıt ve mürekkebe değmediğini bildirdi. [FROM.GetLeader], [FROM.GetNameDef] ve [ROOT.GetNameDef] arasında resmileştirilmiş bir ittifakın dışında kalan her şeyin sadece zaman kaybı olduğunu ve bundan sonra gelecekteki [ROOT.GetAdjective] planlarından muaf tutulmayı tercih edeceklerini yazmaya devam etti."
 PER_imperial_events.202.t:0 "[FROM.GetName] Sadabad Paktını Reddetti!"
 PER_imperial_events.210.a:0 "Toprağı verelim..."
 PER_imperial_events.210.b:0 "Topraklarımızı asla alamazlar."
 PER_imperial_events.210.desc:0 "[FROM.GetLeader], [ROOT.GetLeader]'a [FROM.GetAdjective] sınır topraklarının bir kısmının kendi ellerine bırakılması yönündeki taleplerini bildiren uzun bir mektup kaleme aldı. Bu açıkça egemenliğimize saygısızlık etmeye yönelik korkunç bir girişim olsa da, reddetmemiz halinde [FROM.GetNameDef]'in bu toprakları güvence altına almak için sert adımlar atabileceği anlamına da gelebilir. Nasıl ilerlemeliyiz?"
 PER_imperial_events.210.t:0 "[FROM.GetName] Sınır Topraklarımızı Talep Ediyor!"
 PER_imperial_events.211.a:0 "Ah, şu saf insanlar..."
 PER_imperial_events.211.desc:0 "Bu sabah, [FROM.GetNameDef] taleplerimizi isteksizce kabul ettiğini ve sınır topraklarını devretme sürecine başladığını bildirdi. Farkında olmasalar da, bu bize ileride planlarımızı kolaylaştıracak."
 PER_imperial_events.211.t:0 "[FROM.GetName] Taleplerimizi Kabul Etti!"
 PER_imperial_events.212.a:0 "Bundan pişman olacaklar."
 PER_imperial_events.212.desc:0 "Bu sabah, [FROM.GetNameDef] taleplerimizi kesin bir dille reddettiğini bildirdi. Bu planlarımız açısından küçük bir sorun yaratıyor, ancak bu toprakları eski usul ele geçireceğimiz anlamına geliyor."
 PER_imperial_events.212.t:0 "[FROM.GetName] Taleplerimizi Reddetti!"
 PER_imperial_events.220.a:0 "Musaddık açık ara en iyi seçim"
 PER_imperial_events.220.b:0 "Belki de Furugi daha iyi bir seçenek?"
 PER_imperial_events.220.c:0 "Kaşani, din adamları desteğini artıracaktır."
 PER_imperial_events.220.desc:0 "[PER.GetAdjective] hükümetinin kitlesel yeniden yapılandırılması nedeniyle, [PER.GetNameDef] halkının yeni Başbakanlarını seçmesine izin vermek için seçim çağrısı yapıldı. Ülke genelinde çok sayıda vatandaş sandık başına akın ederken, özellikle iki aday öne çıkıyor. Mohammad Mosaddegh ve Mohammad Ali Foroughi. Millet sonunda nasıl oy kullanacak?"
 PER_imperial_events.220.t:0 "Seçim Dönemi"
 PER_imperial_events.230.a:0 "Daha ne bekliyorsunuz? Taç giyme törenini hazırlayın!"
 PER_imperial_events.230.b:0 "Pehlevi Hanedanı'nı bertaraf etmemiz ihtiyatlı bir hareket olacaktır."
 PER_imperial_events.230.c:0 "Pehlevi Hanedanı'nı [SAF.GetNameDef]'e sürgün edelim."
 PER_imperial_events.230.desc:0 "[ENG.GetNameDef]'te yıllar süren sürgünün ardından, Kaçar Hanedanı'nın veliahtı Mohammad Hassan Mirza, [PER.GetNameDef] tahtına dönmek için sabırsızlanıyor. Pehlevi Hanedanı'nın yönetimi, [ENG.GetAdjective] hükümetinin beklentilerini karşılamadı ve eski hükümdar ailesini yeniden iktidara getirerek bölgedeki [ENG.GetAdjective] çıkarlarının güvence altına alınacağı umuluyor."
 PER_imperial_events.230.t:0 "Kaçar Hanedanı’nın Dönüşü"
 PER_imperial_events.231.a:0 "Mükemmel. Şimdi yeni Kaçar Şahı’nı taçlandırmalıyız."
 PER_imperial_events.231.desc:0 "Dikkatli bir değerlendirmenin ardından, Pehlevi Hanedanı [PER.GetNameDef] tahtından indirildi. Onlarca yıllık ülke hizmetlerine rağmen, [ENG.GetAdjective] hükümetinin çıkarları doğrultusunda hareket etmemiz elzemdir. [PER.GetAdjective] monarşisindeki yerlerini kaybetmiş olsalar da, ülke içindeki siyasi çevrelerde varlık göstermeye devam etme niyetindeler."
 PER_imperial_events.231.t:0 "Pehlevi Ailesi İktidardan Uzaklaştırıldı"
 PER_imperial_events.232.a:0 "Üzücü, ama şimdi yeni Kaçar Şahı’nı taçlandırmalıyız."
 PER_imperial_events.232.desc:0 "Kaçar Hanedanı'nın [PER.GetNameDef] tahtına yeniden oturtulması planı doğrultusunda, ülkemizin geleceği için en iyi çözümün Pehlevi ailesini [SAF.GetNameDef]'e sürgün etmek olduğuna karar verildi. Bu hamle, ileride bize daha fazla özerklik tanıyabilecek olan [ENG.GetNameDef]'in desteğini kazanmamızı sağlayacaktır."
 PER_imperial_events.232.t:0 "Pehlevi Ailesi [SAF.GetNameDef]’e sürgün edildi"
 PER_imperial_events.233.a:0 "Yeni Şahımıza!"
 PER_imperial_events.233.desc:0 "Bu sabah, [FROM.Capital.GetCapitalVictoryPointName]'da düzenlenen görkemli bir taç giyme töreniyle Mohammad Hassan Mirza, [PER.GetNameDef]'ın yeni Şahı ilan edildi. Onlarca yıllık Pehlevi iktidarının ardından, bu büyük milletin tahtına nihayet bir Kaçar oturdu. Kaçar Hanedanı'nı yeniden iktidara getirme çabalarımız, [PER.GetNameDef]'daki çıkarlarını daha iyi koruyabileceğini uman [ENG.GetAdjective] hükümetini memnun etmiştir."
 PER_imperial_events.233.t:0 "Mohammad Hassan Mirza’nın Taç Giyme Töreni"
 PER_imperial_events.3.a:0 "Talihsiz bir gelişme..."
 PER_imperial_events.3.desc:0 "Maalesef [SOU.GetNameDef] saldırmazlık paktı imzalama konusunda ikna edilemedi. Kuzeyden gelebilecek tehdide karşı dikkatli olmalıyız."
 PER_imperial_events.3.t:0 "[SOU.GetNameDefCap] Teklifimizi Reddetti"
 PER_imperial_events.30.a:0 "Ne harika bir zamandı!"
 PER_imperial_events.30.desc:0 "Büyük Kiros tarafından kurulan kadim Ahameniş İmparatorluğu'nun anısına, [PER.GetNameDef] Şahı görkemli bir tören düzenledi. Bu törenle [PER.GetNonIdeologyName]'nin kadim uygarlığı ve tarihi ile kendi yönetiminde elde edilen çağdaş gelişmeler sergilendi. Dünyanın önde gelen tüm liderleri bu kutlamaya davet edildi; ancak [PER.GetNameDef]'deki yoksullar, bu gösterinin para israfı olduğunu düşünerek huzursuzluk çıkarmaya başladı. Yine de, tüm konuklar muhteşem yemekler yedi ve görkemli askeri geçit törenini izledi."
 PER_imperial_events.30.t:0 "Pers İmparatorluğu Kutlaması"
 PER_imperial_events.40.a:0 "Şah, Mısır'dan Fawzia ile evlenecek"
 PER_imperial_events.40.b:0 "Şah, İran Teymurtash ile evlenecek"
 PER_imperial_events.40.c:0 "Şah, İrandokht Kaçar ile evlenecek"
 PER_imperial_events.40.desc:0 "Şah olmaya hazırlanırken Muhammed Rıza Pehlevi'nin aşkı bulmak için bolca vakti oldu. Gönlünü fetheden üç kadın var, ancak sadece biri taç giyecek ve onun yanında [PER.GetNameDef] naibi olacak. Mısır'dan Sultan kızı Fawzia; Şah'ın ilk aşkı İran Teymurtash; ve İsviçre'de tanıştığı eski Kaçar prensesi İrandokht."
 PER_imperial_events.40.t:0 "Bir Şahbanu Seçimi"
 PER_imperial_events.50.a:0 "Neyse ki sağ kurtuldu!"
 PER_imperial_events.50.desc:0 "Bugün öğleden sonra Tahran merkezinde, Rıza Şah Pehlevi'nin ulusa hitap ettiği sırada başarısız bir suikast girişiminde bulunuldu. Suikastçılar anında yakalandı ve Şah'ın liderliğinden memnun olmayan [PER.GetAdjective] ordusundan oldukları ortaya çıktı. Şah bu suikast girişimini halkı arkasında toplamak için kullandı."
 PER_imperial_events.50.t:0 "Rıza Şah Pehlevi Suikastten Kurtuldu!"
 PER_imperial_events.60.a:0 "Kabul ediyoruz. Bu herkes için en iyisi."
 PER_imperial_events.60.b:0 "Bunu kabul edemeyiz."
 PER_imperial_events.60.desc:0 "Bu sabah, [PER.Capital.GetCapitalVictoryPointName]'den bir elçi [GER.Capital.GetCapitalVictoryPointName]'ye ulaştı ve [PER.GetNameDef] Şahı'nın iki ülkenin güvenliği için bir saldırmazlık paktı imzalama teklifini getirdi. [PER.GetNameDef]'in petrol gibi hayati kaynaklarının bolluğu göz önüne alındığında, bu dikkate almamız gereken bir şey."
 PER_imperial_events.60.t:0 "[FROM.GetNameDefCap] Saldırmazlık Görüşmesi İstiyor"
 PER_imperial_events.61.a:0 "Mükemmel haber."
 PER_imperial_events.61.desc:0 "Harika haber! Elçimiz [GER.Capital.GetCapitalVictoryPointName]'den döndü ve [GER.GetNameDef] bizimle saldırmazlık paktı yapmak istiyor. [GER.GetNameDef]'in hedefleri göz önünde bulundurulduğunda, ülkemizin güvenliği için en iyisi bu."
 PER_imperial_events.61.t:0 "[GER.GetNameDefCap] Saldırmazlık Paktına Katılıyor"
 PER_imperial_events.62.a:0 "Talihsiz bir gelişme..."
 PER_imperial_events.62.desc:0 "Maalesef [GER.GetNameDef]'i saldırmazlık paktı imzalamaya ikna edemedik. Bu üzücü, ancak yine de ileride onların fraksiyonuna katılmamıza engel olmayabilir."
 PER_imperial_events.62.t:0 "[GER.GetNameDefCap] Teklifimizi Reddetti"
 PER_imperial_events.70.a:0 "Nezaketli bir teklif. Davet gönderin."
 PER_imperial_events.70.b:0 "Böyle boş işlere ayıracak vaktimiz yok."
 PER_imperial_events.70.desc:0 "Bu sabah Tahran'daki Sadabad Sarayı'ndan, [PER.GetNameDef] adına doğrudan bize bir mektup ulaştı. Rıza Şah Pehlevi, Berlin'i ziyaret edip iki ülke arasındaki ilişkileri geliştirmek istiyor. Führer, [PER.GetNameDef] ile iyi ilişkiler kurmak konusunda istekli. Ne yapmalıyız?"
 PER_imperial_events.70.t:0 "Rıza Şah Pehlevi [GER.GetNameDef]'i Ziyaret Etmek İstiyor"
 PER_imperial_events.71.a:0 "Brandenburg Kapısı bu mevsimde harikadır!"
 PER_imperial_events.71.desc:0 "[GER.GetNameDef]'e gönderdiğimiz iyi niyet mektubuna yanıt olarak, [GER.GetLeader] Berlin'i ziyaret etmemizi istiyor. Tahran'da çok işimiz olmasına rağmen, dünyanın durumunu göz önünde bulundurursak, [GER.GetNameDef] ile iyi ilişkiler kurmak faydalı olacaktır."
 PER_imperial_events.71.t:0 "[GER.GetNameDefCap] Ziyaret Davetini Kabul Ediyor"
 PER_imperial_events.72.a:0 "O halde işe geri dönelim."
 PER_imperial_events.72.desc:0 "[GER.GetNameDef]'e gönderdiğimiz iyi niyet mektubuna yanıt olarak, [GER.GetLeader] Berlin'e gelme teklifimizi üzülerek reddetti. Bu üzücü, çünkü güçlü bir liderle yakınlaşmak için iyi bir fırsat olurdu. Olmadı, ne yapalım."
 PER_imperial_events.72.t:0 "[GER.GetNameDefCap] Ziyaret İçin Çok Meşgul"
 PER_imperial_events.80.a:0 "Daha büyük sorunlarımız var, birlikleri çekin."
 PER_imperial_events.80.b:0 "Hayır! İleri saldırmalıyız!"
 PER_imperial_events.80.desc:0 "[PER.GetAdjective] ordusunun son zamanlardaki saldırıları, bölgelerimizde önemli kayıplara yol açtı. [PER.GetNameDef]'deki durum bizim için olumsuz gelişiyor ve kayıplarımızı konsolide edip birliklerimizi bölgeden çekmek mantıklı olabilir. Ancak, bu bazı toprakları [PER.GetAdjective]lara bırakmamız anlamına gelecek."
 PER_imperial_events.80.t:0 "[PER.GetNameDef]'deki Durum"
 PER_industrial_events.1.a:0 "Bu iyi bir ticaret anlaşmasına benziyor"
 PER_industrial_events.1.b:0 "Buna ihtiyacımız yok."
 PER_industrial_events.1.desc:0 "[PER.GetAdjective] hükümeti bugün, $STATE_413$'te yeni elde edilen petrolleriyle ilgili kaynak hakları teklifiyle bize başvurdu. Söz konusu bölge bu hayati kaynak açısından oldukça zengin. Belki de değerlendirmeye değer bir teklif?"
 PER_industrial_events.1.t:0 "[FROM.GetNameDefCap] Kaynak Hakları Teklifi"
 PER_industrial_events.2.a:0 "Tam anlamıyla karlı bir iş!"
 PER_industrial_events.2.desc:0 "[FROM.GetNameDefCap] yeni elde edilen petrolümüzle ilgili teklifimizi büyük bir nezaketle kabul etti. Bu sadece dev petrol imparatorluğumuzu daha da büyütecek."
 PER_industrial_events.2.t:0 "[FROM.GetNameDefCap] Ticaret Teklifimizi Kabul Etti"
 PER_industrial_events.3.a:0 "Kayıp onların!"
 PER_industrial_events.3.desc:0 "Maalesef [FROM.GetNameDef], [PER.GetAdjective] petrolüyle ilgili cömert ticaret anlaşmamızı reddetti. Belki de işimizi başka bir yerde yapmalıyız?"
 PER_industrial_events.3.t:0 "[FROM.GetNameDefCap] Ticaret Teklifimizi Reddetti"
 PER_irandokht_married:0 "İrandokht Evlendi"
 PER_islamic_revolution_events.1.a:0 "Nasıl ilerleyeceğimize dikkat etmeliyiz."
 PER_islamic_revolution_events.1.desc:0 "Görünüşe göre ülkemizin gelişimiyle ilgili aldığımız bazı kararlar, din adamlarının bir kısmını rahatsız etmeye başladı. Bu rahatsızlık büyümeye devam ettikçe, onları daha fazla dışlamamaya dikkat etmeliyiz."
 PER_islamic_revolution_events.1.t:0 "Din Adamları Arasında İstikrarsızlık"
 PER_islamic_revolution_events.2.a:0 "Bu devrimcilere baskı uygulayalım."
 PER_islamic_revolution_events.2.b:0 "Hemen din adamlarını memnun edelim."
 PER_islamic_revolution_events.2.c:0 "Bırakın denesinler!"
 PER_islamic_revolution_events.2.desc:0 "Aldığımız kararlarla din adamlarını dışlamaya devam ettik ve bunun sonucunda, İslam’ın üst düzey birçok ismi, [PER.GetNameDef] halkı arasında destek toplamaya başladı. Zamanımız daralıyor ve büyük bir devrimle karşı karşıya kalabiliriz. Nasıl ilerlemeliyiz?"
 PER_islamic_revolution_events.2.t:0 "İslami Devrimciler Kıpırdanıyor"
 PER_kurdish_rebellion_growing:0 "Kürt İsyanı Büyüyor"
 PER_kurds_armed_and_ready:0 "Kürtler Silahlı ve Hazır"
 PER_orchestrating_rebellions:0 "İsyanları Tertip Ediyor"
 PER_resource_rights_on_war_tt:0 "§RÜlkelerimiz arasında savaş çıkarsa, kaynak hakları ve harita dışı fabrikalar kaldırılacaktır!§!"
 PER_revolution_events.1.a:0 "Askerleri toplayın!"
 PER_revolution_events.1.desc:0 "Bu sabah, muhalefet partileri bir koalisyon kurdu ve ordumuza sızdıktan sonra silahlanarak Saadabad kompleksi üzerine yürümeye hazırlanıyorlar! [PER.GetNameDef]'in egemenliğini korumak için savaşmaya hazırlanın!"
 PER_revolution_events.1.t:0 "Darbe Kapıda"
 PER_saadabad_pact:0 "Sadabad Paktı Talep Edildi"
 PER_saadabad_pact_member:0 "Sadabad Paktı Üyesi"
 PER_ssb_events.1.a:0 "Kesinlikle, imzalayacağız!"
 PER_ssb_events.1.b:0 "Bu [THIS.GetNameDefCap]'ın çıkarlarına uygun değil."
 PER_ssb_events.1.desc:0 "[SSB_leader.GetLeader], tüm Sadabad imzacı ülkelerinin liderleriyle bir toplantı ayarladı. [SSB_leader.GetLeader], Sadabad Paktı'nın başlangıçta ülkelerimiz arasında basit bir saldırmazlık paktı olduğunu, ancak ekonomik ve askeri işbirliğimiz arttıkça çok daha büyük bir hal aldığını belirtti. Her yönden dünya süper güçleriyle çevrili olan ülkelerimiz, onlara karşı güçsüz durumda. [SSB_leader.GetLeader], askeri işbirliği ve ekonomik birlik sağlamak için resmi bir ittifak önerdi ve bu güçlere karşı tek başımıza başarısız olmaya mahkum olduğumuzu vurguladı."
 PER_ssb_events.1.t:0 "[SSB_leader.GetNameDefCap] Bizi Sadabad İttifakı'na Davet Ediyor"
 PER_ssb_events.10.a:0 "Bu pakt ekonomimiz üzerinde büyük bir etki yaratmaya başlıyor."
 PER_ssb_events.10.desc:0 "[FROM.GetAdjective] hükümeti, Sadabad bölgesindeki önde gelen şirketlerle büyük miktarda [SSB_resource_event_scripted_loc] karşılığında çeşitli kaynakların değiş tokuş edildiği anlaşmaları tamamladı. [SSB_resource_event_scripted_loc]'un büyük kısmı doğrudan özel kuruluşlara giderken, hükümetimiz idari ücret olarak mütevazı bir pay alıkoyuyor."
 PER_ssb_events.10.t:0 "[PER.GetName] Petrol İhracat Anlaşması İmzaladı"
 PER_ssb_events.11.t:0 "[TUR.GetName] Krom İhracat Anlaşması İmzaladı"
 PER_ssb_events.2.a:0 "Harika!"
 PER_ssb_events.2.desc:0 "Toplantı sona erdi ve [FROM.GetLeader], Sadabad Paktı üyeleri arasında resmi bir ittifakın ülkelerimizin hayatta kalması için son derece önemli olduğunu vurgulayarak ittifaka katılmayı kabul etti."
 PER_ssb_events.2.t:0 "[FROM.GetNameDefCap] Sadabad İttifakı'na Katıldı!"
 PER_ssb_events.3.a:0 "Sadabad ittifakı onsuz da yaşayacak!"
 PER_ssb_events.3.desc:0 "Toplantı sona erdi ve ne yazık ki [FROM.GetLeader]'ı katılmaya ikna edemedik. Mevcut askeri ve ekonomik işbirliğimiz devam edecek, ancak [FROM.GetLeader] resmi bir Sadabad İttifakı'nın [FROM.GetNameDefCap]'ın çıkarlarına uygun olmadığını belirtti."
 PER_ssb_events.3.t:0 "[FROM.GetNameDefCap] İttifak Teklifimizi Reddetti."
 PER_ssb_events.4.a:0 "Bu karşılıklı fayda sağlayan bir anlaşma!"
 PER_ssb_events.4.b:0 "Bu açıkça çıkarlarımıza uygun değil."
 PER_ssb_events.4.desc:0 "[FROM.GetLeader], [FROM.GetAdjective] hükümetinin bir önerisini tartışmak üzere Sadabad paktı imzacıları arasında bir toplantı düzenledi. [FROM.GetLeader], her yönden büyük güçler tarafından tehdit edildiğimiz tehlikeli bir konumda olduğumuzu belirterek, ekonomilerimizi daha da sıkı bir şekilde entegre etmeyi, [FROM.GetAdjective] hükümetinin sanayimizi genişletmek için kaynak yatırmasını ve sanayimizi paylaşmayı teklif etti."
 PER_ssb_events.4.t:0 "[FROM.GetNameDefCap] Ekonomik Entegrasyon Öneriyor"
 PER_ssb_events.5.a:0 "Muhteşem!"
 PER_ssb_events.5.desc:0 "Toplantı sona erdiğinde, [FROM.GetLeader] fikirden heyecan duyduğunu ve bunun karşılıklı fayda sağlayan bir anlaşma olduğuna inandığını ifade etti."
 PER_ssb_events.5.t:0 "[FROM.GetNameDefCap] Kabul Etti!"
 PER_ssb_events.6.a:0 "Ne yazık."
 PER_ssb_events.6.desc:0 "Toplantı sona erdiğinde, [FROM.GetLeader] öneri hakkında şüphelerini dile getirdi ve bunun tek yönlü olduğunu ve bölgede [THIS.GetAdjective] hakimiyeti kurma amacı güttüğünü belirtti."
 PER_ssb_events.6.t:0 "[FROM.GetNameDefCap] Reddetti."
 PER_ssb_events.7.a:0 "[ROOT.GetAdjective] olmanın tam zamanı!"
 PER_ssb_events.7.desc:0 "[IRQ.GetNameDefCap] bugün Berlin-Bağdat demiryolu üzerinden tüm Sadabad Paktı imzacı ülkeleriyle ticareti serbest bırakan yasayı imzaladı. Bu, tüm Avrupa ile kapsamlı, kolay ve ucuz ticaret yapmamızı sağlayacak ve ekonomilerimiz için büyük bir destek olacak."
 PER_ssb_events.7.t:0 "[IRQ.GetNameDefCap] Berlin-Bağdat Demiryolu'nu Sadabad Paktı'na Açıyor"
 PER_ssb_events.8.a:0 "Umarım bu paktın tamamen çökmesine yol açmaz..."
 PER_ssb_events.8.desc:0 "Alarm verici haberlere göre, [FROM.PREV.GetNameDefCap] bir üyeye savaş ilan ederek Sadabad Antlaşması'nın temel şartını ihlal etti. Sonuç olarak, [FROM.PREV.GetNonIdeologyName] Sadabad Paktı'ndan atıldı. Bunun paktın geleceği üzerinde ne gibi etkileri olacağını zaman gösterecek - belki kalan üyelerin dayanışmasını artırmasına yol açacak veya belki de Sadabad Paktı'nın sonunu getirecek bir zincirleme reaksiyon başlatacak..."
 PER_ssb_events.8.t:0 "[FROM.PREV.GetNameDefCap] Sadabad Paktı'nı Bozarak [FROM.PREV.FROM.GetNameDefCap]'a Savaş İlan Etti!"
 PER_ssb_events.9.a:0 "Harika!"
 PER_ssb_events.9.desc:0 "Sadabad Paktı içinde ortak bir araştırma anlaşması olasılığı bir süredir tartışılıyordu, ancak uzun görüşmelerin ardından nihayet bir anlaşmaya varıldı. Araştırmalarla ilgili tüm keşifler ve bilgiler pakt üyeleri arasında paylaşılacak ve Sadabad Paktı içinde ortak araştırma projelerine izin veren sistemler kuruldu. Bu, bilimde dünyanın geri kalanıyla birlikte liderler ve yenilikçiler olarak yer almamızı sağlayacak yeni bir bilim çağının kapılarını açabilir."
 PER_ssb_events.9.t:0 "Sadabad Araştırma İşbirliği'nin Şafağı"
 PER_teymourtash_married:0 "Teymourtash Evlendi"
