 goe_japan.1.a:0 "Tabii ki"
 goe_japan.1.b:0 "Hayır"
 goe_japan.1.desc:0 "Hint Ulusal Ordusu lideri Subhas Chandra Bose bize bir teklif sundu; kuvvetleri [BRM.GetName]'e ilerlememize yardımcı olmaya hazır. Bunu, Hindistan’ı [ENG.GetAdjective] yönetiminden kurtarmanın ilk adımı olarak görüyor ve Burma’ya saldırarak Britanya Rajı’nı zayıflatabileceğimize inanıyor. Adamları sıkı milliyetçiler ve bölgeyi çok iyi biliyorlar. Teklifi kabul ediyor muyuz?"
 goe_japan.1.t:0 "Bose, Burma Seferi İçin Destek Teklif Ediyor"
