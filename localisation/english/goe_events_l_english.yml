 RAJ_partition_1.a:0 "Kabul edilemez."
 RAJ_partition_1.desc:0 "Başta sivil bir protesto olarak başlayan olaylar, yerel polis güçlerinin mağdur halkla karşı karşıya gelmesiyle şiddete dönüştü. [ENG.GetAdjective] polisi, şiddet tehdidi altında hareket ettiklerini iddia ederken, protestocular ise tamamen şiddet karşıtı davrandıklarını savunuyorlar.\nKimse ölmedi, fakat 2 polis hafif yaralandı ve 1 protestocu sarsıntı geçirerek hastaneye kaldırıldı."
 RAJ_partition_1.t:0 "[FROM.GetName]'deki Protesto Şiddete Dönüştü"
