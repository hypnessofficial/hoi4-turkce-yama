 SSB_if_join_tt:0 "Bu anlaşmayı kabul etmek, tüm imzacı ülkeler arasında §YSaldırmazlık Paktı§! kurulmasını ve §YOrtak Odak Ağacı§! açılmasını sağlayacak, ayrıca §YSadabad Paktı§! ulusal ruhunu verecektir. Bu ruh, ortak odak ağacındaki odaklar tamamlandıkça zamanla iyileşecektir."
