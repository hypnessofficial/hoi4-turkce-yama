 FRA_full_employment_desc:0 "Kısmen Büyük Savaş'ın büyük kan dökülmesinden dolayı çok düşük işsizliğe sahip olma gibi gıpta edilecek bir konumdayız. Ancak bu, şirketlerin vasıflı işçi bulmasını zorlaştırdı ve ordu, işgücü piyasasıyla acemi askerler için rekabet etmekte zorlanıyor. Askere almayı genişletmek sorunu daha da kötüleştirecektir. Açığı kapatmak için ya askere alımda ya da ekonomide başka insan gücü kaynakları bulmaya çalışmalıyız."
