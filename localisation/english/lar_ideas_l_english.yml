 SPR_military_disloyalty:0 "Askeri Sadakatsizlik"
 SPR_military_disloyalty_desc:0 "1932'deki başarısız \"Sanjurjada\" askeri darbe girişimi bugüne kadar İspanyol ordusuna gölge düşürmeye devam ediyor. Sonrasında, aralarında darbenin lideri José Sanjurjo'nun da bulunduğu çeşitli sadakatsiz askeri komutanlar, Portekiz'e sürgüne kaçtılar ve komplolarına şimdi bile devam ediyorlar.\n\nEbu başarısızlık bile sadakatsiz subayların cesaretini kırmadı, ancak İspanya'da bile birçok kişi Monarşiye, hatta güçlü bir Faşist diktatörlüğe dönüş görmeyi arzuluyor. Hükümetin ordunun iç işlerine aşırı derecede müdahalesi başka bir ayaklanmanın fitilini ateşleyebilir; öncekinden çok daha şiddetli ve kanlı."
 SPR_military_disloyalty_tt:0 "§RBirlik eğitemez, birlikleri terhis edemez veya birlik şablonlarını düzenleyemez.§!\n"
 SPR_national_strikes:0 "Ulusal Grevler"
 SPR_national_strikes_desc:0 "Ülke, bir işçi devriminin başlangıç aşamalarının pençesinde gibi görünüyor; grev üstüne grev, işçiler daha az iş ve daha fazla ücret talep ederken sanayiyi ve günlük yaşamı felç ediyor ve yoksul kiracı çiftçiler, hükûmet görmezden gelirken giderek daha fazla tarım arazisine el koyuyor."
