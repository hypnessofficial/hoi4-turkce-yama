 SPR_government_power_struggle_desc:0 "Son seçimlerde galip gelseler de, solun siyasi partileri, her biri yeni hükûmetin hakimiyeti için yarıştığı için parçalanmış durumda. Başkanlık makamının kendisi özellikle saldırı altında, çünkü başkanın siyasi Sol'un çeşitli kısımlarıyla olan uzun süredir devam eden kan davaları doruk noktasına ulaşıyor. Hevesli ve hırslı politikacılar şimdiden bu pozisyonu açgözlülükle izliyor."
