 SPA_awaiting_the_rebellion:0 "İsyanı Beklerken"
 SPA_awaiting_the_rebellion_desc:0 "Darbe titizlikle planlandı ve her an başlatmaya hazırız. Ancak, önceki başarısızlıklarımızdan ders çıkardık. 1932 Sanjurjada fiyaskosunun tekrarı yerine, halkın hissiyatı davamızı yeterince destekleyene kadar bekleyeceğiz, böylece o kadar kolay devrilmeyeceğimizden emin olacağız."
 SPA_carlism:0 "Karlizm"
 SPA_carlism_desc:0 "1830'da Kral VII. Ferdinand, Pragmatik Yaptırımı ilan etti ve kızı, gelecekteki II. Isabella'yı veliaht yaptı. Bu eylem, kardeşi Infante Carlos'u veraset hattından çıkardı ve böylece, Kral'ın ölümü üzerine, Infante Carlos'un destekçileri bir dizi iç savaş başlattı, Karlizm sancağı altında birleşerek ve Salic veraset hattının yeniden kurulması için savaştılar.\n\nBir asır sonra, Karlist hareketi hala çok canlı ve Requetéler olarak adlandırılan milisleri, Hristiyanlığı savunmak ve haklı Kral'ın geri dönüşünü savunmak için bir kez daha ihtiyaç duyulacakları zamana hazırlık olarak durmaksızın eğitim yapıyor."
