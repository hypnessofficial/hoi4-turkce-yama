 SPR_political_violence:0 "Siyasi Şiddet"
 SPR_political_violence_desc:0 "İspanyol siyasi sahnesi, artan bir kutuplaşma ve şiddet sahnesidir. Son büyük ayaklanma olan Asturias Madenciler Grevi'nden bu yana sadece iki yıl geçti ve mevcut siyasi iklim, yeni, çok daha büyük ve çok daha az yerel bir ayaklanmanın tüm özelliklerine sahip gibi görünüyor. Yaklaşan seçimlerin bu toplumsal huzursuzluk sarmalına bir son vermesi pek olası görünmüyor."
