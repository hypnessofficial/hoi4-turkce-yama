 FRA_worker_shortage_desc:0 "Ordunun taleplerinin, işgücü kıtlığı konusundaki endişeleri geçersiz kılmasına izin verildi. Birçok şirket şimdi, üretim çıktısını etkilemeye başlayan vasıflı işçi kıtlığı bildiriyor. Askere alma yasalarımızı gevşetmek insanların fabrikalara geri dönmesine izin verecektir, ancak altta yatan sorunları çözmeyecektir."
