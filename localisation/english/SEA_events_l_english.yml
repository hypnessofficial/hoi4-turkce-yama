 tsr_manchukuo.1.a:0 "Statükoyu korumalıyız"
 tsr_manchukuo.1.b:0 "Puyi tahtına sahip olmalı!"
 tsr_manchukuo.1.c:0 "İmparatora güvenilemez, Pujie doğru seçim"
 tsr_manchukuo.1.desc:0 "İmparatorun konumu, Mançurya'nın bir imparatorluk olarak konumu açısından her zaman biraz sıkıntılı olmuştur. Ulusun işlevsel olarak başbakan Zhang Jinghui ve Kwantung Ordusu yönetimi altında bir cumhuriyet olarak hareket etmesiyle İmparator çok zayıftır, neredeyse sadece bir kukla olarak işlev görür. Ancak bu tamamen değiştirilebilir, çünkü bazı Kwantung Ordusu subayları ulusun refahı için tahtın kesinlikle İmparatorun elinde olması gerektiği inancındadır. Ancak Puyi'yi zayıf ve güvenilmez gören ve tahtın Japon eğitimi almış kardeşi Pujie'nin eline geçmesini tercih edenler de var."
 tsr_manchukuo.1.t:0 "Liderlik Sorunu"
 tsr_manchukuo.10.a:0 "Yapabileceğimiz hiçbir şey yok"
 tsr_manchukuo.10.b:0 "Ölümüne savaşacağız!"
 tsr_manchukuo.10.desc:0 "[MAN.GetNameDef] ve davet edilmediğimiz [SOV.GetNameDef] arasındaki görüşmelerden sonra, topraklarımızı [MAN.GetNameDef] devletine devretmeyi kabul ettiler. Bunu kabul etmezsek her iki taraftan da ciddi sonuçlarla karşılaşacağız."
 tsr_manchukuo.10.t:0 "[SOV.GetLeader] Topraklarımızı Transfer Ediyor"
 tsr_manchukuo.11.a:0 "Dikkatli davranacağız"
 tsr_manchukuo.11.b:0 "İsterlerse istifa etsinler"
 tsr_manchukuo.11.c:0 "Kwantung Ordusu'nun özür dilemesini sağla"
 tsr_manchukuo.11.desc:0 "Xing'an ili Valisi ve Pan-Moğol politikacı Lingsheng'in Kwantung Ordusu tarafından idam edilmesinin ardından ülkede bir huzursuzluk dalgası yaşandı. Xing'an Ordusu ile $MAN_urzhin_garmaev$ ve $MAN_jonjurjab$ gibi Moğol ve Buryat Generaller bu durum halledilmezse istifa edecekleri tehdidinde bulundular, ancak aynı zamanda yatıştırma politikası Japonya'yı kızdırma riski taşıyabilir."
 tsr_manchukuo.11.t:0 "Lingsheng Olayı"
 tsr_manchukuo.12.a:0 "Şu lanet haydutlar!"
 tsr_manchukuo.12.b:0 "Sadece durumun gelişmesini izlememiz gerekecek."
 tsr_manchukuo.12.desc:0 "Serengdongrub liderliğindeki İç Moğolistan Halk Devrimci Partisi'nin Mançuryalı haydutlarla birlikte kuzeydeki birkaç önemli yere sızdığı ve şimdi saldırmak için zamanlarını bekledikleri yönünde raporlar geldi. Bunun ne zaman olacağını henüz bilmiyoruz ama yakında olacağından korkuyoruz."
 tsr_manchukuo.12.t:0 "İMHDP Sızması"
 tsr_manchukuo.13.a:0 "Onlara iyi hizmet ederdi"
 tsr_manchukuo.13.b:0 "Ona burada ihtiyacımız var"
 tsr_manchukuo.13.desc:0 "Mançurya'nın yaşadığı hızlı endüstriyel ilerlemeyle birlikte, [MAN.GetLeader] olası bir kabine üyesi olarak gözünü uzun süredir $JAP_naoki_hoshino$ üzerine dikmiş durumda. Bu nedenle şimdi Genel İşler Kurulu direktörü olarak görev yapması için [MAN.GetNameDef] devletine transfer edilmesini talep etti."
 tsr_manchukuo.13.t:0 "[MAN.GetLeader], $JAP_naoki_hoshino$ Transferini Talep Ediyor"
 tsr_manchukuo.14.a:0 "Mükemmel"
 tsr_manchukuo.14.desc:0 "Japonlarla yapılan birçok görüşmenin ardından, $JAP_naoki_hoshino$ kabinemize transferi konusunda nihayet anlaşmaya varıldı. Genel İşler Kurulu direktörü olarak ekonomimizin büyümesine yardımcı olarak bize iyi hizmet edecektir."
 tsr_manchukuo.14.t:0 "$JAP_naoki_hoshino$ Mançurya'ya Vardı"
 tsr_manchukuo.15.a:0 "Neyse"
 tsr_manchukuo.15.desc:0 "Argümanlarımızla ikna olmayan Japonlar, $JAP_naoki_hoshino$ Mançurya'da bir kabine pozisyonuna sahip olmasındansa Japonya'da evinde kalmasının daha iyi olacağına karar verdiler. Bu hayal kırıklığı yaratsa da, yine de ilerlemenin bir yolunu bulacağız."
 tsr_manchukuo.15.t:0 "$JAP_naoki_hoshino$ Japonya'da Kalıyor"
 tsr_manchukuo.16.a:0 "O zaman onları birleştireceğiz"
 tsr_manchukuo.16.b:0 "Ayrı kalmalarını tercih ederiz"
 tsr_manchukuo.16.desc:0 "Ulusal İşbirliği Hükümeti'nin ilan edilmesinin ardından, [FROM.GetLeader] Çin'deki varlıklarımızı [RNG.GetLeader] altında değil, kendi yönetimi altında birleştirmemizi talep etti. Tam olarak planladığımız şey olmasa da, bu durumda birkaç kukla devlet yerine tek bir kukla devlet aracılığıyla yönetmek büyük olasılıkla daha verimli olacaktır."
 tsr_manchukuo.16.t:0 "[FROM.GetLeader] Çin Üzerinde Kontrol Talep Ediyor"
 tsr_manchukuo.17.a:0 "Harika"
 tsr_manchukuo.17.desc:0 "[FROM.GetNameDef] ile yapılan görüşmelerin ardından en iyi hareket tarzının Çin yönetimini bizim altımızda birleştirmek olacağı konusunda anlaşmaya varıldı. Onlarla daha fazla işbirliği yapmayı dört gözle bekliyoruz."
 tsr_manchukuo.17.t:0 "[FROM.GetLeader] Teklifimizi Kabul Ediyor"
 tsr_manchukuo.18.a:0 "Kahretsin"
 tsr_manchukuo.18.desc:0 "Onları ikna etmek için gösterdiğimiz en iyi çabalara rağmen, [FROM.GetAdjective] hükümet Çin yönetimlerini bizim altımızda birleştirmenin çıkarlarına uygun olmayacağına karar verdi. Şimdilik bölünmüş kalacağız."
 tsr_manchukuo.18.t:0 "[FROM.GetLeader] Teklifimizi Reddediyor"
 tsr_manchukuo.19.a:0 "Lanet Bolşevikler..."
 tsr_manchukuo.19.desc:0 "Onları ikna etmek için gösterdiğimiz en iyi çabalara rağmen, Sovyetler işgal ettikleri toprakların hiçbirine layık olmadığımıza karar verdiler. Bu ilişkimize büyük bir darbe indirdi."
 tsr_manchukuo.19.t:0 "Sovyetler Bize Hiçbir Şey Vermiyor"
 tsr_manchukuo.2.a:0 "Neden olmasın?"
 tsr_manchukuo.2.b:0 "Topraklarımızı asla böyle teslim etmeyiz!"
 tsr_manchukuo.2.desc:0 "Bu Akşam, [FROM.GetLeader] oldukça ilginç bir teklifle geldi: Dalian liman kenti çevresindeki Kwantung Kiralanmış Bölgesi'nin idaresini devretmemiz, bu arada operasyonlarımızı eskisi gibi aktif tutmaya devam etmemiz. İki ulusumuz zaten ayrılmaz olduğu için Dalian'ı Mançurya'nın geri kalanıyla yeniden birleştirmenin mantıklı olacağını ve aynı zamanda bizi bazı idari maliyetlerden kurtaracağını belirtti."
 tsr_manchukuo.2.t:0 "[FROM.GetLeader] Dalian Üzerinde Kontrol Talep Ediyor"
 tsr_manchukuo.20.a:0 "Bu da olur"
 tsr_manchukuo.20.desc:0 "Dış Mançurya'nın transferine çok fazla Rus olduğu gerekçesiyle karşı çıkan Sovyetler, bu topraklara olan iddiamız çok daha yeni olduğu için en azından Moğolistan ve Tuva'yı transfer etmeyi kabul ettiler."
 tsr_manchukuo.20.t:0 "Sovyetler Moğolistan ve Tuva'yı Transfer Ediyor"
 tsr_manchukuo.21.a:0 "En azından bir şeydir"
 tsr_manchukuo.21.desc:0 "Olayların garip bir dönüşüyle Sovyetler, Moğolistan'ı bir tampon devlet olarak tutarken, bölgeyle çok daha kişisel bir bağımız olduğunu iddia ederek Dış Mançurya'yı devretmeye karar verdiler."
 tsr_manchukuo.21.t:0 "Sovyetler Mançurya'yı Transfer Ediyor"
 tsr_manchukuo.22.a:0 "Fantastik"
 tsr_manchukuo.22.desc:0 "Sovyetler neyse ki tüm toprak taleplerimizi kabul edecek kadar lütufkardı, sadece Moğolistan ve Tuva'yı değil, aynı zamanda Dış Mançurya'yı da alanımıza kattılar. Bundan sadece iyi şeyler çıkabilir."
 tsr_manchukuo.22.t:0 "Sovyetler Tüm Taleplerimize Boyun Eğiyor"
 tsr_manchukuo.3.a:0 "Mükemmel!"
 tsr_manchukuo.3.desc:0 "Kwantung Kiralanmış Bölgesi'ni Mançurya ulusunun geri kalanıyla yeniden birleştirmenin mantıklı olacağı argümanımızı kabul eden Japon yetkililer, bölgeyi devretmeyi kabul ettiler."
 tsr_manchukuo.3.t:0 "Dalian Transferi"
 tsr_manchukuo.4.a:0 "Neyse"
 tsr_manchukuo.4.desc:0 "Bizim iddialarımıza ikna olmayıp, Japonlar, Dalian limanının devredilmesi yönündeki ciddi talebimize güldüler. Bunun \"tamamen saçma\" olduğunu iddia ederek, bu alandaki rolümüzün gerçekte ne kadar önemli olduğunu yeniden düşünmemizi önerdiler."
 tsr_manchukuo.4.t:0 "Japonlar Reddediyor"
 tsr_manchukuo.5.a:0 "Devrim muzaffer olacak!"
 tsr_manchukuo.5.b:0 "Hainler!"
 tsr_manchukuo.5.desc:0 "Mançurya'daki şok edici olayların ardından, İç Moğolistan Halk Devrimci Partisi olarak bilinen bir grup komünist, dalgayı yakalamaya ve Mengjiang Hükümetine darbe yapmaya çalışmaya karar verdi. Başlangıçta tüm ülkeyi ele geçirmekte başarılı olamasalar da, bölgedeki Japon kontrolünün hızla çözüldüğü göz önüne alındığında yakında başarılı olabilirler."
 tsr_manchukuo.5.t:0 "Devrim Yayılıyor"
 tsr_manchukuo.6.a:0 "Elbette kuzeydeki kardeşlerimizi destekleyeceğiz!"
 tsr_manchukuo.6.b:0 "Asla"
 tsr_manchukuo.6.desc:0 "Japonlara karşı savaşlarındaki zaferin ardından, Mançurya'daki yerel ÇKP şubesi, Çin üzerindeki hakimiyet savaşında birlik olmamızı önerdi. Bu sadece iktidarı ele geçirme girişimi mi henüz belli değil, ancak altın bir fırsat olabilir."
 tsr_manchukuo.6.t:0 "[MAN.GetLeader] İttifak Öneriyor"
 tsr_manchukuo.7.a:0 "O zaman öyle yapacağız"
 tsr_manchukuo.7.b:0 "Asla!"
 tsr_manchukuo.7.desc:0 "Çin Hükümeti'ne karşı savaştaki zaferin ve Çin Halk Cumhuriyeti'nin ilanının ardından, [MAN.GetLeader], Hükümet içinde yüksek pozisyonlar vaadiyle diğer tüm ÇKP şubelerini bu yeni cumhuriyete entegre olmaya çağırdı. Reddedersek, devrime ihanet edenler olarak görüleceğimizi ve Halk Kurtuluş Ordusu'nun tam askeri gücüyle karşılaşacağımızı iddia ediyor."
 tsr_manchukuo.7.t:0 "[MAN.GetLeader] Entegrasyon Öneriyor"
 tsr_manchukuo.8.a:0 "Hodri meydan!"
 tsr_manchukuo.8.desc:0 "Tavrımızdan hoşnut olmayan [FROM.GetLeader], cömert teklifimizin geri kalanını boyunduruk altına almak için yapılan başka bir girişim olduğunu ve bu saçmalıkta yer almayacaklarını yanıtladı. Bu nedenle bize işgal etmekten ve hakkımız olanı almaktan başka seçenek bırakmadılar."
 tsr_manchukuo.8.t:0 "[FROM.GetLeader] Entegrasyonu Reddediyor"
 tsr_manchukuo.9.a:0 "Hiçbir şeye sahip olmayacaklar"
 tsr_manchukuo.9.b:0 "İlk teklif daha hoş geliyordu"
 tsr_manchukuo.9.c:0 "Moğolistan bizim, ama Mançurya'yı almalarına izin ver"
 tsr_manchukuo.9.d:0 "Hepsini almalarına izin ver"
 tsr_manchukuo.9.desc:0 "Çin'deki durumdaki hızlı ilerlemelerin ardından, tüm Çin'in temsilcisi olarak duran [FROM.GetNameDef] lideri [FROM.GetLeader], bölgede bir müttefik karşılığında bir zamanlar kendilerine ait olan toprakların transferine yardım etmemizi önerdi. Bölgesel transferin daha muhafazakar tahminleri yalnızca devrim sırasında kaybedilen Moğolistan ve Tuva'dan oluşurken, partideki birçok yetkilinin bölgeyle kişisel bağlantıları olduğu için bazıları dış Mançurya'nın iadesi için bile bastırıyor."
 tsr_manchukuo.9.t:0 "[FROM.GetLeader] Bölgesel Transfer Talep Ediyor"
 tsr_manchukuo_border_war.1.a:0 "Gücümüz Büyüyor!"
 tsr_manchukuo_border_war.1.b:0 "Neyse"
 tsr_manchukuo_border_war.1.desc:0 "[1039.GetName] bölgesindeki hızlı bir harekatın ardından, [MAN.GetAdjective] ordu Kalgan'ı ele geçirdi ve bölgeyi kendi kontrolleri altında ilan etti."
 tsr_manchukuo_border_war.1.t:0 "[MAN.GetNameDefCap], [1039.GetName] Bölgesini Fethediyor"
 tsr_manchukuo_border_war.2.a:0 "Geçici Bir Gerileme..."
 tsr_manchukuo_border_war.2.b:0 "Kalgan ayakta!"
 tsr_manchukuo_border_war.2.desc:0 "Ciddi zorluklarla karşılaşan [MAN.GetAdjective] ordu Kalgan şehrinden geri çekildi, bu çatışmanın sonu olmayabilir ama şimdilik Kalgan [CHI.GetAdjective] kalacak."
 tsr_manchukuo_border_war.2.t:0 "[MAN.GetNameDefCap], [1039.GetName] Bölgesinden Geri Çekiliyor"
 tsr_manchukuo_border_war.3.a:0 "Pekin sonunda bizim!"
 tsr_manchukuo_border_war.3.b:0 "Bize başka seçenek bırakmıyorlar, geri çekilin!"
 tsr_manchukuo_border_war.3.desc:0 "[MAN.GetAdjective] ordunun Pekin'e muzaffer yürüyüşünün ardından, [CHI.GetAdjective] ordu güneyde daha savunulabilir bir konuma geri çekildi."
 tsr_manchukuo_border_war.3.t:0 "[MAN.GetNameDefCap], [608.GetName] Bölgesini Fethediyor"
 tsr_manchukuo_border_war.4.a:0 "Başarısız olduk."
 tsr_manchukuo_border_war.4.b:0 "Pekin öyle kolay düşmeyecek!"
 tsr_manchukuo_border_war.4.desc:0 "Şehri ele geçirmeyi başaramayan [MAN.GetAdjective] ordu Pekin'den geri çekildi, bu geçici barışın ne kadar süreceği ise hala belirsiz."
 tsr_manchukuo_border_war.4.t:0 "[MAN.GetNameDefCap], [608.GetName] Bölgesinden Geri Çekiliyor"
 tsr_manchukuo_border_war.5.a:0 "Zafere bir adım daha yaklaştık!"
 tsr_manchukuo_border_war.5.b:0 "Bir il daha gitti..."
 tsr_manchukuo_border_war.5.desc:0 "Hebei'nin tamamen ele geçirilmesinin ardından, kışkırtılmadıkça [MAN.GetAdjective] ordunun Çin topraklarında daha fazla ilerlemeyeceğine dair bir anlaşma ile ateşkes sağlandı."
 tsr_manchukuo_border_war.5.t:0 "[MAN.GetNameDefCap], [614.GetName] Bölgesini Fethediyor"
 tsr_manchukuo_border_war.6.a:0 "Neyse."
 tsr_manchukuo_border_war.6.b:0 "Hebei hala ayakta!"
 tsr_manchukuo_border_war.6.desc:0 "Pekin [MAN.GetAdjective] orduya düşerken, güçlerinin Hebei İli içinde daha fazla ilerlemesi durduruldu."
 tsr_manchukuo_border_war.6.t:0 "[MAN.GetNameDefCap], [614.GetName] Bölgesinden Geri Çekiliyor"
 tsr_manchukuo_news.1.a:0 "Yavru köpek kükrüyor mu?"
 tsr_manchukuo_news.1.b:0 "Kaderimizi talep edeceğiz!"
 tsr_manchukuo_news.1.c:0 "Bu noktaya nasıl geldi?"
 tsr_manchukuo_news.1.d:0 "Son Derece Beklenmedik"
 tsr_manchukuo_news.1.desc:0 "Japon yöneticiler ile çeşitli haydut hizipleri arasında artan şiddet ve çatışma döneminin ardından, [MAN.GetLeader] adında bir haydut Hsinking'i ele geçirmeyi başardı ve sırasıyla İmparatoru kendi tarafına katılmaya ikna etti. \n\nİmparatorun isyancıların yanında yer almasıyla ordu kısa sürede onu takip etti ve şimdi Mançurya bir dönüm noktasında duruyor, Japonlar kovulacak mı yoksa isyan geldiği kadar çabuk bastırılacak mı?"
 tsr_manchukuo_news.1.t:0 "Büyük Mançurya İsyanı"
 tsr_sichuan_border_war.1.a:0 "Gücümüz Büyüyor!"
 tsr_sichuan_border_war.1.b:0 "Bu iyi değil"
 tsr_sichuan_border_war.1.desc:0 "[601.GetName] bölgesindeki hızlı bir harekatın ardından, Liu Wenhui komutasındaki [SIC.GetAdjective] ordu, ilin büyük kısımlarını ele geçirdi ve bölgeyi kendi kontrolleri altında ilan etti."
 tsr_sichuan_border_war.1.t:0 "[SIC.GetNameDefCap], [601.GetName] Bölgesini Fethediyor"
 tsr_sichuan_border_war.2.a:0 "En azından Xikang'ın geri kalanını geri almadılar..."
 tsr_sichuan_border_war.2.b:0 "Xikang ayakta!"
 tsr_sichuan_border_war.2.desc:0 "Ciddi zorluklarla karşılaşan [SIC.GetAdjective] ordu, [601.GetName] bölgesinden geri çekildi ve askeri gezilerini sonlandırdıklarını ilan etti. Sınır olduğu gibi kalacak."
 tsr_sichuan_border_war.2.t:0 "[SIC.GetNameDefCap], [601.GetName] Bölgesinden Geri Çekiliyor"
 yulbars_khan_fled_tt:0 "$KUM_yulbars_khan$ Hotan'a kaçtı"
