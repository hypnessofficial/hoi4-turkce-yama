 SEA_warlords.2.a:0 "Şu küstah Generaller!"
 SEA_warlords.2.b:0 "Neyse."
 SEA_warlords.2.desc:0 "Liu Xiang'ın vefatının ardından [FROM.GetNameDef], Yang Sen'in yükselişine yol açan bir güç mücadelesiyle sarsıldı. Liu Xiang'ın güçlerimiz tarafından suikaste uğradığına dair söylentilerin ardından, hükümetimizle aralarına mesafe koyan ve entegrasyona direnen bir duruş benimsediler."
 SEA_warlords.2.t:0 "[FROM.GetNameDefCap] Meydan Okumaya Devam Ediyor"
 SEA_warlords.20.a:0 "$wtt_political_warlord_support.23.a$"
 SEA_warlords.20.desc:0 "$wtt_political_warlord_support.23.desc$"
 SEA_warlords.20.t:0 "[FROM.GetName] Subayları Geldi"
 SEA_warlords.21.a:0 "$wtt_political_warlord_support.22.a$"
 SEA_warlords.21.desc:0 "$wtt_political_warlord_support.22.desc$"
 SEA_warlords.21.t:0 "$wtt_political_warlord_support.22.t$"
 SEA_warlords.22.a:0 "Devreye girmeliyiz"
 SEA_warlords.22.b:0 "Onları kendi hallerine bırak"
 SEA_warlords.22.desc:0 "[SIC.GetNameDef] lideri Liu Xiang'ın ölümüyle, bölgeyi hükümetimize daha az elverişli birine kaptırma riskini almamak için devreye girip kontrolü doğrudan ele almamız gerektiği giderek daha açık hale geliyor. Ancak bu, şu anda iktidar için çabalayan daha küçük komutanları daha da düşmanlaştırma riski taşıyabilir, bu yüzden yine de dikkatli davranmalıyız."
 SEA_warlords.22.t:0 "Liu Xiang'ın Ölümü"
 SEA_warlords.23.a:0 "Yalnız savaşmaktansa birlikte savaşmak daha iyidir"
 SEA_warlords.23.b:0 "Asla boyun eğmeyeceğiz"
 SEA_warlords.23.desc:0 "Görünüşe göre [From.GetLeader] Çin için savaşı başlattı ve bu süreçte diğer savaş ağalarını merkezi hükümete karşı kendi tarafında topladı. Eğer katılırsak yetkimizin çoğunu [From.GetNameDef] devletine teslim etme riskiyle karşı karşıya kalırız, ancak reddetmek onların gazabına uğramamıza neden olabilir."
 SEA_warlords.23.t:0 "[From.GetNameDefCap] İtaat Talep Ediyor"
 SEA_warlords.24.a:0 "Mükemmel"
 SEA_warlords.24.desc:0 "[From.GetLeader], merkezi hükümete karşı birlik olma teklifimize coşkuyla yanıt verdi ve bu savaşta bize yardım etmeye yemin etti. Ulusumuzu birleştirmeye doğru bir adım daha attık."
 SEA_warlords.24.t:0 "[From.GetLeader] Boyun Eğiyor"
 SEA_warlords.25.a:0 "O zaman onları da indirmemiz gerekecek!"
 SEA_warlords.25.desc:0 "[From.GetLeader], Çin savaşında birlik olma teklifimize bir dizi hakaret ve küfürle yanıt verdi; görevimizin sadece iktidarı ele geçirmek ve illeri boyunduruk altına almak için başarısız bir girişim olduğunu iddia etti. Görünüşe göre bu savaşta onları yanımızda göremeyeceğiz."
 SEA_warlords.25.t:0 "[From.GetLeader] Reddediyor"
 SEA_warlords.26.a:0 "Kabul etmekten başka çaremiz yok"
 SEA_warlords.26.b:0 "Asla teslim olmayacağız!"
 SEA_warlords.26.desc:0 "Bölgede ve Ma ailesi içinde hakimiyet kurmaya çalışan bir dizi hamlenin ardından, [FROM.GetLeader] ona sadakat yemini etmemizin bizim çıkarımıza olacağına karar verdi. [FROM.GetLeader] ayrıca teklifini reddedersek cezalandırılacağımızı ve ordularımızın yok edileceğini, ancak seçimin nihayetinde bize ait olduğunu iddia etti."
 SEA_warlords.26.t:0 "[FROM.GetLeader] Teslimiyetimizi Talep Ediyor"
 SEA_warlords.27.a:0 "Harika haber"
 SEA_warlords.27.desc:0 "Savaşın sadece daha fazla kan dökülmesine ve bölgede istikrarsızlığa yol açacağından korkan [FROM.GetLeader], bize sadakat yemini etmenin en iyisi olacağına karar verdi."
 SEA_warlords.27.t:0 "[FROM.GetLeader] Teslim Oluyor"
 SEA_warlords.28.a:0 "O zaman onları yere sereceğiz"
 SEA_warlords.28.desc:0 "Daha fazla kan dökülmesini önlemek için gösterdiğimiz en büyük çabalara rağmen, [FROM.GetLeader] tehditlerimizin boş olduğunu ve bir işgale kalkışırsak [FROM.GetNameDef] ordularının bizi [ROOT.Capital.GetName] şehrine kadar geri süreceğini iddia eden hakaret dolu bir mektup gönderdi."
 SEA_warlords.28.t:0 "[FROM.GetLeader] Meydan Okuyor"
 SEA_warlords.29.a:0 "Makul geliyor."
 SEA_warlords.29.b:0 "Asla teslim olmayacağız!"
 SEA_warlords.29.desc:0 "Savaştaki son gelişmelerin ardından, [FROM.GetLeader] bize karşı savaşmanın artık değmeyeceğine ve bunun yerine daha büyük düşmana karşı birlik olmamız gerektiğine karar verdi. Bununla birlikte [FROM.GetLeader], kabul edersek askerlerimiz ve liderlerimiz için tam bir af önerdi ve güçlerimizi birleştirmemiz karşılığında Çin'e karşı olası herhangi bir suçu affetti."
 SEA_warlords.29.t:0 "[FROM.GetLeader] Barış Öneriyor"
 SEA_warlords.3.a:0 "Mükemmel."
 SEA_warlords.3.desc:0 "Liu Xiang'ın vefatının ardından [FROM.GetNameDef] hızla dağıldı ve şimdi otoritemiz altında. Bunu avantajımıza kullanmalıyız."
 SEA_warlords.3.t:0 "[FROM.GetNameDefCap] Entegrasyonu Kabul Ediyor"
 SEA_warlords.30.a:0 "O hain!"
 SEA_warlords.30.desc:0 "Barış ve af teklifimizin [FROM.GetNameDef] devletini yok etmek için bir aldatmaca olduğunu iddia eden [FROM.GetLeader], düşmanlıkları durdurmayı reddetti ve bunun yerine bu sabah başka bir saldırı başlattı. Görünüşe göre çatışmayı sona erdirmek için sadece bir mektuptan fazlası gerekecek."
 SEA_warlords.30.t:0 "[FROM.GetLeader] Teslim Olmayı Reddediyor"
 SEA_warlords.31.a:0 "Bize başka seçenek bırakmıyorlar"
 SEA_warlords.31.b:0 "Bırakın denesinler"
 SEA_warlords.31.desc:0 "Sınır boyunca son zamanlarda yaşanan provokasyonların ardından, [FROM.GetLeader] şimdi resmen birliklerimizi [434.GetName] bölgesinden çekmemizi ve onu [FROM.GetAdjective] yetkililere teslim etmemizi talep eden bir istekte bulundu. Reddedersek, [FROM.GetName] devletinin askeri güçle cevap vereceğini ve Delhi'ye ulaşana kadar yürümeyi bırakmayacaklarını iddia ediyor."
 SEA_warlords.31.t:0 "[FROM.GetLeader], [434.GetName] Transferini Talep Ediyor"
 SEA_warlords.32.a:0 "O zaman savaşırız"
 SEA_warlords.32.desc:0 "Onları ikna etmek için gösterdiğimiz en iyi çabalara rağmen, [434.GetName] bölgesini diplomatik olarak ele geçirme çabalarımız sonuçsuz kaldı. McMahon Hattı'nı yineleyen [FROM.GetLeader], bölge üzerinde hiçbir hakkımız olmadığını ve provokasyonumuzun sadece bir blöf olduğunu iddia etti."
 SEA_warlords.32.t:0 "[FROM.GetLeader] Reddediyor"
 SEA_warlords.33.a:0 "Mükemmel"
 SEA_warlords.33.desc:0 "Birkaç gergin günün ardından, [FROM.GetLeader], [434.GetName] bölgesini transfer etmeyi ve McMahon Hattı'ndan vazgeçmeyi kabul etti, bunu uygulamanın sadece değeceğinden daha fazla soruna neden olacağını iddia etti. Bununla ülkemiz daha da büyüyor."
 SEA_warlords.33.t:0 "[FROM.GetLeader], [434.GetName] Transferini Kabul Ediyor"
 SEA_warlords.34.a:0 "Yalanlarına kanmayacağız!"
 SEA_warlords.34.b:0 "Bu Birleşik Cepheyi tartışması için onu Guangzhou'ya gönder"
 SEA_warlords.34.desc:0 "Bir dizi provokasyonun ardından Guangxi ve Guangdong illeri, Japonlara karşı çok pasif kaldığımızı iddia ederek ve bu nedenle yönetimimizi sorgulayarak birlik oldular. Eğer harekete geçmezsek güçlerimize karşı yürüyeceklerini ve Nanjing'i kendileri için alacaklarını iddia ediyorlar. Chiang Kai-Shek'in Japonlarla nasıl başa çıkılacağını daha fazla tartışmak için Guangzhou'ya gitmesini önermiş olsalar da, bunun sadece bir tuzak olup olmadığı belirsiz."
 SEA_warlords.34.t:0 "Liangguang Olayı"
 SEA_warlords.35.a:0 "Öyleyse birleşeceğiz!"
 SEA_warlords.35.b:0 "Bekleyip görelim..."
 SEA_warlords.35.desc:0 "Moraller yüksek ve kollar daha da yukarı kalkmışken, Chiang Kai-Shek bu sabah koruma olarak küçük bir taburla geldi. Ancak teklifi kabul etmenin bir tuzak olmadığı anlaşılıyor ve müzakereler hemen başladı. Chen Jitang ve Li Zongren, Chiang'ı Japonlara karşı birleşik bir cephe oluşturması için zorladılar, hatta şimdilik komünistlerle çatışmaları durduracak kadar ileri gittiler. Bunun doğru seçim olup olmadığını söylemek zor, ama pekala olabilir."
 SEA_warlords.35.t:0 "Chiang Kai-Shek Guangzhou'ya Vardı"
 SEA_warlords.36.a:0 "[ROOT.GetLeader] istifa etmek zorunda kalacak"
 SEA_warlords.36.b:0 "Geri adım atmayacağız!"
 SEA_warlords.36.c:0 "Bu tehdidi ancak birlikte savuşturabiliriz!"
 SEA_warlords.36.desc:0 "Nanjing'in tehditlerimizin hiçbirine boyun eğmeyeceklerini beyan etmesinin ve ardından bizim muhalefet beyanımızın ardından, ordumuzun bir kısmı firar etti ve general Yu Hanmou, [ROOT.GetLeader] istifa etmezse Guangzhou'ya yürüyeceği ve bunu zorla gerçekleştireceği tehdidinde bulundu."
 SEA_warlords.36.t:0 "Firarlar ve Bir Hain"
 SEA_warlords.36.tt:0 "§RGuangxi Teklifimizi Reddederse, derhal bir iç savaşa düşeceğiz!§!"
 SEA_warlords.37.a:0 "Bırakın gelsinler!"
 SEA_warlords.37.b:0 "Teslim oluyoruz"
 SEA_warlords.37.desc:0 "Nanjing'in tehditlerimizin hiçbirine boyun eğmeyeceklerini beyan etmesinin ve ardından bizim muhalefet beyanımızın ardından, Merkezi Hükümetin bizi askeri güçle yönetimlerine teslim olmaya zorlayacağından korkanlar var."
 SEA_warlords.37.t:0 "Guangxi İçin Savaş"
 SEA_warlords.38.a:0 "Pekala"
 SEA_warlords.38.desc:0 "[GXC.GetLeader] liderini sürme sürecinde illerini yok edeceğimizden korkarak, bunun yerine tüm liderlerin bağışlanması ve pozisyonlarını korumaları karşılığında cumhuriyetimizin bir parçası olmayı önerdiler. Bu adil bir uzlaşma gibi görünüyor."
 SEA_warlords.38.t:0 "Guangxi Kliği Teslim Oluyor"
 SEA_warlords.39.a:0 "Mükemmel"
 SEA_warlords.39.desc:0 "İç savaşın eşiğindeki birkaç yoğun saatin ardından, Chen Jitang istifa etmeyi kabul etti ve birliklerimizi Guangdong'a taşıdık. İle bundan sonra ne olacağı artık tamamen bizim elimizde."
 SEA_warlords.39.t:0 "Guangdong Kliğinin Çöküşü"
 SEA_warlords.4.a:0 "O zaman onları da ezeceğiz!"
 SEA_warlords.4.b:0 "Bu fırsatı değerlendirmeliyiz! Çok yaşa Han!"
 SEA_warlords.4.desc:0 "Hotan'a yürüyüşümüz başlarken, Yulbars Han Ma Hushan'a desteğini açıkladı ve Hami üzerindeki yönetimimize karşı isyan çağrısında bulundu. Bununla birlikte artık iki cephede savaşıyoruz."
 SEA_warlords.4.t:0 "İkinci Kumul İsyanı"
 SEA_warlords.40.a:0 "O inatçı sersem..."
 SEA_warlords.40.desc:0 "Bizim tarafımıza geçen firarlara ve Yu Hanmou'nun Guangzhou'ya yürüme tehdidine rağmen Chen Jitang geri adım atmayı reddettikten sonra, il, Hükümet yanlısı ve Hükümet karşıtı güçlerle tam teşekküllü bir iç savaşa sürüklendi. Bu kaosu düzeltmek için devreye girmeliyiz."
 SEA_warlords.40.t:0 "Guangdong'da Bir İç Savaş"
 SEA_warlords.41.a:0 "Neyse"
 SEA_warlords.41.desc:0 "İşgal tehditlerimizin bir masaldan ibaret olduğunu iddia eden [GXC.GetLeader], geri adım atmayacaklarını, aksine bizi müzakereye zorlayacaklarını ilan etti. Bunun başarılı olup olmayacağını söylemek için henüz çok erken, ama bekleyip görmemiz gerekecek."
 SEA_warlords.41.t:0 "Guangxi Kliği Meydan Okuyor"
 SEA_warlords.42.a:0 "Onu ibretlik yap"
 SEA_warlords.42.b:0 "Şimdilik Sun Tongxuan'ın devralmasına izin ver"
 SEA_warlords.42.desc:0 "Daha uzun süre dayanma kapasitesine sahip olmasına rağmen, Han Fuju Jinan'dan kaçmaya ve kanadımızı savunmasız bırakmaya karar verdi. İhanet nedeniyle güçlerimiz tarafından zaten yakalandı ancak soru hala ona ne yapmamız gerektiği. Örnek teşkil etmesi için onu ve topraklarını tamamen ele mi geçirmeliyiz, yoksa daha fazla sorunu önlemek için bu arada başka bir generalin devralmasını mı sağlamalıyız?"
 SEA_warlords.42.t:0 "Han Fuju Jinan'dan Kaçtı"
 SEA_warlords.43.a:0 "Merkezi Hükümetin yanında ol"
 SEA_warlords.43.b:0 "Kuomintang başarısız oldu, Japonlara katılmalıyız!"
 SEA_warlords.43.desc:0 "Han Fuju'nun Jinan'dan korkakça kaçışından sonra, savaşın parçaladığı Shandong ilinde bir güç boşluğu oluştu. Devreye girmek yerine Sun Tongxuan'ı Geçici Vali olarak atamayı seçen Merkezi Hükümet, bundan sonra ne yapılacağı kararını bizim elimize bıraktı."
 SEA_warlords.43.t:0 "Sun Tongxuan Yönetimi"
 SEA_warlords.44.a:0 "Evet, sadece daha derin bir işbirliği ile başarılı olabiliriz!"
 SEA_warlords.44.b:0 "Güneyin Kralı ile işbirliği yapmayacağız!"
 SEA_warlords.44.desc:0 "[FROM.GetNameDef] tarafından, iki bölgemizin Liangguang olarak bilinen varlık altında bir kez daha birleştiğini görmek istediklerine dair haber aldık. Bu, Qing Hanedanlığı dönemine Liangguang Genel Valiliği olarak atıfta bulunan bir fikir. Artık bu tür imparatorluk unvanlarına ihtiyacımız olmasa da, bu birleşik varlığın o dönemde sahip olduğu güç ve prestij yadsınamazdı."
 SEA_warlords.44.t:0 "[FROM.GetLeader], Liangguang'ın Birleşmesini Öneriyor"
 SEA_warlords.45.a:0 "Zafer bizim olacak!"
 SEA_warlords.45.desc:0 "Mükemmel haber! [GXC.GetNameDefCap], Liangguang sancağı altında önerdiğimiz birleşmeyi kabul etti. Birlikte, emrimizde bol miktarda endüstriyel, hammadde ve insan gücü bulunan güçlü bir ittifak oluşturuyoruz! Tüm Çin artık birleşik gücümüz ve irademiz karşısında titriyor."
 SEA_warlords.45.t:0 "[FROM.GetLeader] Birleşmeyi Kabul Ediyor"
 SEA_warlords.46.a:0 "Artık ya zafer ya ölüm!"
 SEA_warlords.46.desc:0 "[GXC.GetNameDef] tarafından haber aldık ve ne yazık ki yakında kaybedilecek 'egemenliklerinin' bizim için kolektif bir birleşik gelecekten daha önemli olduğuna karar verdiler. Şimdi alternatif adımları düşünmeliyiz, bu birleşmeyi güç kullanarak gerçekleştirme olasılığı en yüksek olanıdır, çünkü bize karşı hizalanan güçlere ancak birlikte dayanabiliriz."
 SEA_warlords.46.t:0 "[FROM.GetLeader] Bizi Terk Ediyor"
 SEA_warlords.46.tt:0 "§RBu muhtemelen [CHI.GetNameDef] ile bir savaşa yol açacaktır§!"
 SEA_warlords.47.a:0 "[ROOT.GetLeader] kalmalı"
 SEA_warlords.47.b:0 "Yeni Guangxi Kliği daha güçlü otoriteye sahip!"
 SEA_warlords.47.desc:0 "Birleşme gittikçe yaklaşırken, bu yeni kliği kimin yönetmesi gerektiği konusunda zor bir karar vermeliyiz. [ROOT.GetLeader] hava kuvvetlerinin yüksek komutasını elinde tutarken, Li Zongren kara muharebesinin ustası ve birlikler için ilham verici bir figür olduğu için her iki seçim de sağlam. Kim galip gelecek?"
 SEA_warlords.47.t:0 "Liangguang Kliği Liderliği"
 SEA_warlords.48.a:0 "Onları tekrar kontrolümüz altına alacağız!"
 SEA_warlords.48.b:0 "Onları kışkırtmamak akıllıca olur..."
 SEA_warlords.48.desc:0 "Ulusumuza birliği getirmek, hatalı hizipleri küçük ve bölünmüşken çok daha kolaydır. Ne yazık ki, güney illeri birleşmeye başladı ve gücümüze karşı bu set, artan bir endişe uyandırıyor. Direnmeyi seçerlerse bize karşı endişe verici miktarda kaynak ve insan gücü toplayabilirler."
 SEA_warlords.48.t:0 "Güney Bize Karşı Toplanıyor"
 SEA_warlords.48.tt:0 "§REğer onları yarım yıl içinde yenemezsek, bir çıkmaza girmek zorunda kalacağız!§!"
 SEA_warlords.49.a:0 "Öyleyse zamanımızı bekleyeceğiz..."
 SEA_warlords.49.desc:0 "Siyasi rakiplerimizden gelen artan baskı ve birliklerimiz arasında azalan moralle, sonuçsuz kavgamızı durdurmamız ve doğuda beliren daha büyük tehditlere dönmemiz gerektiği giderek daha açık hale geliyor. Gün kaybedildi, [GDC.GetLeader] güçleri şimdilik Çin'in güney kısımlarını işgal etmeye devam edecek."
 SEA_warlords.49.t:0 "Durgunlaşan Bir Çatışma"
 SEA_warlords.5.a:0 "Öyleyse zamanımızı bekleyeceğiz..."
 SEA_warlords.5.desc:0 "Merkezi Hükümet'ten artan baskı ve birliklerimiz arasında azalan moralle, sonuçsuz kavgamızı durdurmamız ve Çin üzerinde beliren daha büyük tehditlere dönmemiz gerektiği giderek daha açık hale geliyor. Gün kaybedildi, Ma Hushan'ın güçleri ilimizin güney kısımlarını işgal etmeye devam edecek."
 SEA_warlords.5.t:0 "Durgunlaşan Bir Çatışma"
 SEA_warlords.50.a:0 "Doğuda beliren tehdidi birlikte yeneceğiz"
 SEA_warlords.50.desc:0 "Xi'an'dan gönderilen bir heyet bugün bize ulaştı ve önümüzdeki aylarda Japon karşıtı önlemleri daha fazla tartışmak istiyor. Görünüşe göre [FROM.GetLeader], Shaanxi dağlarındaki ÇKP ile temas kurmuş ve onlarla birlikte bir ittifak kurmak istiyor. Bunu yapmak için [FROM.GetLeader], yaklaşan çatışmada yardımcı olabilecek bir iyilik kazanmak için [SOV.GetNameDef] ile olan bağlantılarımızı kullanmamızı istiyor."
 SEA_warlords.50.t:0 "[FROM.GetLeader] Tarafından Bir Heyet Geldi"
 SEA_warlords.51.a:0 "Belki kendimize başka bir müttefik bulmuşuzdur"
 SEA_warlords.51.desc:0 "Bu haftanın başlarında, temsilcimiz Li Kenong, Japon karşıtı konuları ve işgalcilere karşı mücadelede Sovyet yardımı sorusunu tartışmak üzere Luochuan'da [FROM.GetLeader] ile bir araya geldi. Toplantının sonunda Japonya'ya direnmeyi kabul ettiler, ancak Chiang Kai-shek ile müzakere etmeyi kabul etmediler. Ancak babasını öldürdükleri için Japonlara kin besleyen Zhang, generalissimoyu Japonlara karşı ÇKP'ye katılmaya ikna etmek için elinden gelen her şeyi yapacağını, bu onu öldürse bile, belirtti."
 SEA_warlords.51.t:0 "Luochuan'da Verimli Görüşmeler"
 SEA_warlords.52.a:0 "Bu mühleti memnuniyetle kabul edeceğiz"
 SEA_warlords.52.b:0 "[FROM.GetNameDef] için aklımızda başka planlar var"
 SEA_warlords.52.desc:0 "[FROM.GetLeader], şu anda [CHI.GetLeader] emriyle sahamızdaki sözde haydutların bastırılmasıyla görevli. Bu elbette bizi de içeriyor, ancak [FROM.GetLeader] bize ulaştı ve KMT ile aramızda bir Birleşik Cephe kurmaya hazırlanırken düşmanlıkları şimdilik durdurup durduramayacağımızı merak ediyor. Bu teklifi kabul ediyor muyuz?"
 SEA_warlords.52.t:0 "[FROM.GetLeader], Kuşatma Harekatını Durdurmak İstiyor"
 SEA_warlords.53.a:0 "Bunu iyi değerlendireceğiz"
 SEA_warlords.53.desc:0 "[FROM.GetLeader], Nanjing'deki merkezi hükümet tarafından ordularına sağlanan silahları ve fonları kaçırmaya başladı ve [JAP.GetAdjective] yeminli düşmanları olduğumuz için karşılıklı güvenimizi artırmak ve bizi güçlendirmek amacıyla çeşitli yollarla devrimci üs sahamıza teslim ediyor."
 SEA_warlords.53.t:0 "[FROM.GetLeader] Dava İçin Fon ve Teçhizat Kaçırıyor"
 SEA_warlords.54.a:0 "Mükemmel haber!"
 SEA_warlords.54.desc:0 "[FROM.GetLeader], sadece bizi güçlendirmek için değil, aynı zamanda merkezi hükümetin dikkatini çekmek için Yan'an şehrinde konuşlu birlikleri geri çekti. Bunu yaparak, [CHI.GetLeader] muhtemelen bastırma birliklerini cezalandırmak ve onları güneydoğuya yerleştirmeye çalışmak için kuzeye yönelecek, bu arada [FROM.GetLeader] ve [SHX.GetLeader] gibi isyankar yerel yönetimleri azarlayacak. Ancak Xi'an'dayken, [FROM.GetLeader], [CHI.GetLeader] Japonya'ya karşı bir Birleşik Cephe kurmaya ikna etmek için sert bir yaklaşım benimsemeyi planlıyor."
 SEA_warlords.54.t:0 "[FROM.GetLeader] Birliklerini [1032.GetName] Bölgesinden Çekiyor"
 SEA_warlords.55.a:0 "Öyleyse zamanımızı bekleyeceğiz..."
 SEA_warlords.55.desc:0 "Merkezi Hükümetten sonuç üretmek için gelen ancak sonuç vermeyen artan baskı ve birliklerimiz arasında azalan moralle, sonuçsuz kavgamızı durdurmamız ve Çin üzerinde beliren daha büyük tehditlere dönmemiz gerektiği giderek daha açık hale geliyor. Gün kaybedildi, [PRC.GetNameDef] zorluklar karşısında güçlü duruyor ve güçleri şimdilik ilimizin kuzey kısımlarını işgal etmeye devam edecek."
 SEA_warlords.55.t:0 "Taarruz Durgunlaşıyor"
 SEA_warlords.55.tt:0 "Artık §Y$XIC_request_relocation_to_northeastern_command$§! milli hedefini alabileceğiz!"
 SEA_warlords.56.a:0 "Savunmaya proaktif bir yaklaşım mı? Şahane!"
 SEA_warlords.56.b:0 "Ona bu görevi emanet edemeyiz"
 SEA_warlords.56.desc:0 "Genç mareşal [FROM.GetLeader], Japon tehdidine daha yakın olmak ve saldırganlıklarına karşı bir kale görevi görmek için [608.GetName] bölgesindeki kuzeydoğu garnizonuna transfer edilmeyi talep etti. Fengtian Kliği'nin eski lideri olarak, kayıp vatanını geri almak için proaktif bir hamle yapmak istiyor gibi görünüyor. Ne diyoruz?"
 SEA_warlords.56.t:0 "[FROM.GetLeader], [608.GetName] Bölgesine Yerleştirilme Talep Ediyor"
 SEA_warlords.57.a:0 "Bu gün için pişman olacaklar..."
 SEA_warlords.57.desc:0 "Halinden memnun hain [FROM.GetLeader], Japonlara karşı bir ileri karakol pozisyonu kurma isteğimizi reddetti, açıkça Çin'in en iyi geleceğini düşünmüyor."
 SEA_warlords.57.t:0 "[FROM.GetLeader] İsteğimizi Reddediyor"
 SEA_warlords.58.a:0 "Pekala, görevimiz bitti"
 SEA_warlords.58.b:0 "[608.GetName] bölgesini zorla almak zorunda kalacaklar!"
 SEA_warlords.58.desc:0 "[XIC.GetNameDef] ve [FROM.GetNameDef] tarafından, [608.GetName] ve çevresindeki toprakları Japonlara karşı yeni bir ileri harekat üssü olarak kullanmak üzere Genç Mareşal'e devretme yönündeki yeni planlarına boyun eğmemiz için ortak bir talep geldi. Görünüşe göre öyle ya da böyle özerkliğimizi sona erdirmeyi planlıyorlar..."
 SEA_warlords.58.t:0 "[XIC.GetNameDef] Devletine Boyun Eğmek İçin Hükümet Baskısı"
 SEA_warlords.59.a:0 "Onurumuzu geri kazanmaya bir adım daha yaklaştık!"
 SEA_warlords.59.desc:0 "Nihayet, Fengtian Kliği'nin kayıp topraklarını geri alma zamanı geldi. [608.GetName] artık komtamız altında ve Shaanxi'deki haydutları bastırma görevimiz resmen sona erdi. Yakında, kayıp vatanın tamamı tekrar kontrolümüz altında olacak!"
 SEA_warlords.59.t:0 "Büyük Kuzey Hamlesi"
 SEA_warlords.6.a:0 "Sovyetlerin dikkatini çekmemek için mümkün olduğunca az gönder"
 SEA_warlords.6.b:0 "Sovyetler cehenneme, tam desteğimize sahipler"
 SEA_warlords.6.c:0 "Hiçbir şey ayıramayız"
 SEA_warlords.6.desc:0 "[FROM.GetLeader], [SIK.GetLeader] ile olan savaşta yardımımızı istedi. Onları kaybetmek ildeki yerimizi kaybetmemiz anlamına gelse de, Sovyetleri kızdırmamak da hayati önem taşıyor çünkü bu, potansiyel bir ortağı ve garantörü kaybetmek anlamına gelir."
 SEA_warlords.6.t:0 "[FROM.GetLeader] Yardım İstiyor"
 SEA_warlords.60.a:0 "Zuolin'in hayaleti hala peşimizi bırakmıyor..."
 SEA_warlords.60.desc:0 "Kwantung Ordusu'nun yıllar önce öldürdüğü eski mareşal Zhang Zuolin'e bir zamanlar sadık olan birçok general ve asker, şimdi oğlu [FROM.GetLeader] çağrısına kulak veriyor ve [FROM.GetNameDef] tarafına iltica ediyor. Bu bir felaket!"
 SEA_warlords.60.t:0 "Generaller [FROM.GetNameDef] Tarafına İltica Ediyor"
 SEA_warlords.61.a:0 "En azından istediğimiz ittifakı kurduk..."
 SEA_warlords.61.b:0 "Hayır, [ROOT.GetLeader] nihai hedefini ilerletmek için özerk kalmalıyız!"
 SEA_warlords.61.desc:0 "[CHI.GetLeader] kaçırmamızın ve Çin halkına karşı daha büyük tehdide odaklanmak için kuşatma harekatlarına ara vermeye zorla ikna etmemizin ardından, [ROOT.GetLeader] ve en yakın adamlarının sorumlu tutulacağı ve Kuzeybatı Haydut Bastırma Karargahının tamamen feshedileceği merkezi hükümetten tutuklama emirleri ve tehditler aldık. Bu kaderi kabul mü etmeliyiz, yoksa başka bir gün savaşmaya devam mı etmeliyiz?"
 SEA_warlords.61.t:0 "Başarısız Bir Görev"
 SEA_warlords.62.a:0 "Görevlerinde başarısız oldular, dizginleyin onları"
 SEA_warlords.62.desc:0 "[ROOT.GetLeader] kaçırılmasının ve ikinci bir Birleşik Cephe oluşturmaya zorla ikna edilmesinin ardından, hükümet yetkililerimiz [FROM.GetLeader] ve adamlarına tutuklama emirleri ve tehditler yayınladı ve Kuzeybatı Haydut Bastırma Karargahının özerk görevine son vermek için birlikleri harekete geçirmeye başladı. Bu hainlerin hak ettiklerini almalarının zamanı geldi."
 SEA_warlords.62.t:0 "Kuzeybatı Haydut Bastırma Karargahının Feshi"
 SEA_warlords.63.a:0 "Yoldaşlarımıza cömertlikleri için teşekkür ediyoruz"
 SEA_warlords.63.desc:0 "Bu haftanın başlarında, batısındaki Irkeshtam Geçidi üzerinden Kaşgar çevresindeki birliklerimize ek [SOV.GetAdjective] silahları ve malzemeleri ulaştı. Hükümetimize silah sağlamaktan sorumlu [SOV.GetAdjective] yetkili Alexander Barmine tarafından görevlendirilen bu durum, [SOV.GetNameDef] devletinin işbirliğimizi daha da derinleştirmek için aklında belirli planları olduğunu gösteriyor."
 SEA_warlords.63.t:0 "Irkeshtam Geçidi Yoluyla Ek [SOV.GetAdjective] Malzemeleri Ulaştı"
 SEA_warlords.64.a:0 "Altınına el koy!"
 SEA_warlords.64.desc:0 "36. Kuomintang tümeninin gözden düşmüş komutanı ve [KHM.GetNameDef] Padişahı $KHM_ma_hushan$, birliklerini terk ettikten sonra [441.GetName] bölgesine geldi ve yanında kendisinin ve adamlarının eski devletin başkentinden çaldıkları 1000 ons altını getirdi. Bu fırsat kokuyor..."
 SEA_warlords.64.t:0 "$KHM_ma_hushan$ [KHM.GetAdjective] Altınlarıyla Geldi"
 SEA_warlords.65.a:0 "Sadık kaldığı sürece"
 SEA_warlords.65.b:0 "Sınırlarımızdan taviz vermeyeceğiz!"
 SEA_warlords.65.desc:0 "NKVD tarafından desteklenen ildeki askeri darbeden sonra şu anda [FROM.GetNameDef] kontrolünü elinde tutan sadık bağlı devletimiz [FROM.GetLeader], bölgeleri daha iyi geliştirmek ve dağınık insanları aynı sancak altında birleştirmek için ili Kırgızistan ile birleştirme arzusunu dile getirdi. Ne diyoruz?"
 SEA_warlords.65.t:0 "[FROM.GetLeader], Kırgızları Birleştirmek İstiyor"
 SEA_warlords.66.a:0 "Harika bir gün!"
 SEA_warlords.66.desc:0 "[FROM.GetLeader] isteğimizi kabul etti ve bu mesaj alındığında Pamir bölgesi bize transfer ediliyor. Şu andan itibaren eyalet, doğrudan [FROM.GetAdjective] yönetimden özerk olarak tarafımızdan yönetilecek."
 SEA_warlords.66.t:0 "[FROM.GetLeader] Kırgızistan'ı Transfer Ediyor"
 SEA_warlords.67.a:0 "Bir gün geri alacağız..."
 SEA_warlords.67.desc:0 "[FROM.GetLeader] toprak transferi isteğimizi reddetti. Bu onlardan beklenen bir şeydi, ancak uzun vadede ilişkilerimize kesinlikle zarar verecek."
 SEA_warlords.67.t:0 "[FROM.GetLeader] İsteğimizi Reddediyor"
 SEA_warlords.68.a:0 "Guominjun'un hayaleti hala peşimizi bırakmıyor..."
 SEA_warlords.68.desc:0 "Feng Yuxiang ve bir zamanlar bize isyan eden ve onları ezdikten sonra tekrar katılan bir örgüt olan Guominjun'a sadık askerleri, [FROM.GetLeader] askeri örgütün yeniden canlandığını ilan etmesiyle şimdi [FROM.GetNameDef] tarafına iltica ediyor."
 SEA_warlords.68.t:0 "Guominjun Generalleri [FROM.GetNameDef] Tarafına İltica Ediyor"
 SEA_warlords.69.a:0 "Amaçlarına hizmet ettiler"
 SEA_warlords.69.b:0 "Hala işimize yarayabilirler"
 SEA_warlords.69.desc:0 "Düşman kuvvetlerinin eline geçen ve He-Umezu anlaşmasının bir parçası olarak Japonya tarafından yapılan bölgesel askerden arındırma taleplerini onurlandırmak için yerel bir özerklik görevi gören Hebei-Chahar Siyasi Konseyi artık gerçek bir amaca hizmet etmiyor. Belki de liderliklerini dizginlemenin ve güçlerini merkezi hükümetin komutası altına almanın zamanı gelmiştir."
 SEA_warlords.69.t:0 "Hebei-Chahar Siyasi Konseyi'nin Feshi"
 SEA_warlords.7.a:0 "En azından bir şeydir"
 SEA_warlords.7.desc:0 "Merkezi Hükümet, ulusla olan ortaklıklarına hayatta kalmamızdan daha fazla değer verdikleri için Sovyet yetkililerini kızdırmamak adına bize asgari destek vermeye karar verdi."
 SEA_warlords.7.t:0 "Minimum Yardım Ulaştı"
 SEA_warlords.70.a:0 "Nihayet yeni bir hükümet tipi için zaman geldi!"
 SEA_warlords.70.b:0 "Bir kez daha imparatorluk olacağız!"
 SEA_warlords.70.c:0 "Çok Yaşa Büyük Ma Hanedanı!"
 SEA_warlords.70.desc:0 "Halkımız tarafından Panthay ve Dungan İsyanları sırasında arzulanan şeyi şimdi elde etmiş ve tüm Qing ve Kuomintang yönetimi kalıntılarını Çin'den çıkarmışken, birçoğu toprakları yönetme biçimimizi sorgulamaya başladı. Du Wenxiu'nun görevini devralıp yeni altın çağımızı mı başlatmalıyız, yoksa daha güvenli yolu seçip Yuan Shikai'nin ayak izlerinden mi gitmeliyiz?"
 SEA_warlords.70.t:0 "Pingnan Guo'nun Mirası"
 SEA_warlords.71.a:0 "Komünizme karşı olan mücadelelerinde onlara yardım edeceğiz!"
 SEA_warlords.71.b:0 "Uğraşacak yeterince sorunumuz zaten var"
 SEA_warlords.71.desc:0 "[FROM.GetLeader], [SIK.GetLeader] ile olan mücadelede yardımımızı talep etti. Onları kaybetmek, ailemizin ildeki dayanağını kaybetmemiz anlamına gelecek olsa da, birliklerimiz başka bir yerde savaşırken doğumuzdaki komünistlerin bu fırsatı değerlendirmesine izin vermememiz de hayati önem taşımaktadır."
 SEA_warlords.71.t:0 "[FROM.GetLeader] Yardım Talep Ediyor"
 SEA_warlords.72.a:0 "Bununla gidişatı tersine çevirebiliriz!"
 SEA_warlords.72.desc:0 "[FROM.GetNameDef] lideri [FROM.GetLeader], Sovyetlerin eyaletimizi ele geçirmesini engelleme çabalarımızı tam olarak desteklemeye karar verdi ve bu sayede devletle olan kendi ilişkilerini de riske attı."
 SEA_warlords.72.t:0 "[FROM.GetNameDef]'den Yardım Ulaşıyor"
 SEA_warlords.73.a:0 "Lanet olası hainler"
 SEA_warlords.73.desc:0 "[FROM.GetNameDef] lideri [FROM.GetLeader], Sovyet yetkililerini memnun etmek için bize hiçbir yardımda bulunmamaya karar verdi; zira bu ulusla olan ortaklıklarına bizim hayatta kalmamızdan çok daha fazla değer veriyorlar."
 SEA_warlords.73.t:0 "[FROM.GetNameDef]'den Hiçbir Yardım Gelmiyor"
 SEA_warlords.74.a:0 "Aramıza hoş geldiniz kardeşlerim"
 SEA_warlords.74.desc:0 "Ma Hushan'a karşı yapılan darbenin ardından, aile üyelerimizin çoğu, zamanı geldiğinde kaybedilen kliklerini geri almak için bize katılmak üzere sınırı akın akın geçmeye başladı."
 SEA_warlords.74.t:0 "Hotan Ma Kliğinin Çöküşü"
 SEA_warlords.75.a:0 "Şanslarını deneyebilirler"
 SEA_warlords.75.b:0 "Aptalca bir fikir"
 SEA_warlords.75.desc:0 "İç Moğol Ordusu ve Büyük Han Adil Ordusu, hava desteğimizi almaları ve Japon kurmay subaylarının gözetiminde olmaları koşuluyla, savaş ağası [SHX.GetLeader]'in bölgelerine bir operasyon başlatmaya hazır. Belki de Çin'de daha büyük çaplı bir savaşı tetiklemeden İç Moğolistan'ın daha büyük bir kısmını güvence altına alabiliriz."
 SEA_warlords.75.t:0 "[FROM.GetLeader] Suiyuan Harekatını Başlatmak İstiyor"
 SEA_warlords.8.a:0 "Bununla durumu tersine çevirebiliriz!"
 SEA_warlords.8.desc:0 "Merkezi Hükümet, Sovyetlerin ilimizi ele geçirmesini ve bununla birlikte devletle olan ilişkilerini riske atmasını engellemek için çabalarımızın tamamen arkasında durmaya karar verdi."
 SEA_warlords.8.t:0 "Yardım Ulaştı"
 SEA_warlords.9.a:0 "Şu lanet hainler"
 SEA_warlords.9.desc:0 "Merkezi Hükümet, ulusla olan ortaklıklarına hayatta kalmamızdan çok daha fazla değer verdikleri için Sovyet yetkililerini memnun etmek adına bize herhangi bir yardımda bulunmamaya karar verdi."
 SEA_warlords.9.t:0 "Hiç Yardım Ulaşmadı"
 SIC_can_lead_to_war_with_china_tt:0 "§RBu, Merkezi Hükümet ile daha fazla çatışmaya yol açabilir!§!"
 SIK_failed_campaign_tt:0 "[SIK.GetLeader], Kuomintang'ı ilden sürmekte başarısız oldu"
 SIK_locks_good_focus_tt:0 "§RBirlşik Sinkiang Kliği hedefine ulaşamadık§!"
 SOV_accepted_Astrov:0 "[SOV.GetNameDefCap], $astrov_design_bureau$ firmasından bir ekip gönderdi."
 SOV_accepted_Morozov:0 "[SOV.GetNameDefCap], $morozov_design_bureau$ firmasından bir ekip gönderdi."
 SOV_accepted_OKMO:0 "[SOV.GetNameDefCap], $okmo$ firmasından bir ekip gönderdi."
 TSR_recieve_equipment_warlord:0 "Anlaşmanın kendilerine düşen kısmını yerine getirdiklerinde 1000 piyade teçhizatı alacağız"
 TSR_recieve_manpower_warlord:0 "Anlaşmanın kendilerine düşen kısmını yerine getirdiklerinde 5000 insan gücü alacağız"
