 SEA_japan.1.a:0 "Bu saçmalığa şimdi bir son verin!"
 SEA_japan.1.b:0 "Geleneklere dönme vakti geldi!"
 SEA_japan.1.c:0 "Ordu dizginlenmeli!"
 SEA_japan.1.d:0 "Ordu dizginlenmeli!"
 SEA_japan.1.desc:0 "İmparatorluk ulusunun ruhuna yönelik tehditleri gerekçe göstererek, IJA içindeki Kōdōha hizbine sadık genç subaylar, hükümet ve askeri liderliği militarizm ve devletin doğrudan İmparatorluk kontrolü anlayışına karşı çıkanlardan arındırmak amacıyla bir darbe düzenlediler. Üst düzey yetkililerin konutlarını çoktan kuşattılar ve Tokyo'nun hükümet merkezini ele geçirdiler. Ancak isyancıların kendilerini desteklemek için konuşacağı umutlarına rağmen İmparator sessizliğini koruyor. Bu olay nasıl ilerleyecek?"
 SEA_japan.1.e:0 "Halk her taraftan yıkıma uğratıldığını fark etmeli!"
 SEA_japan.1.t:0 "26 Şubat Olayı"
 SEA_japan.2.a:0 "Yaylalılar tepeleri tutsun."
 SEA_japan.2.desc:0 "Genel Vali, düşmanın karaya çıktığını ve dağlık bölgelerdeki asker toplama masalarının dolup taştığını bildiriyor. Takasagoların İmparator'a bağlılıklarından mı, yıllar boyu aldıkları eğitimden mi, yoksa burası kendi adaları olduğu ve üzerinde bir istilacı bulunduğu için mi gönüllü olduklarını söylemeye cesaret edemiyor. Yalnızca kendi bıçaklarıyla geldiklerini, askerlerimizin geçilmez dediği arazide ilerlediklerini ve dağıtabileceğimiz tüfeklerden daha kalabalık olduklarını belirtiyor."
 SEA_japan.2.t:0 "Takasago Gönüllüleri"
 SEA_japan.3.a:0 "Her sırt, her sahil, her köy!"
 SEA_japan.3.desc:0 "Düşman Anayurt Adaları'na çıktı. Nisan ayından beri hazır olan plan, ilk raporun gelişinden saatler sonra kurmaylarca uygulanmaya başlandı: tümenlere kıyıya ilerlemeleri emredildi, yedekler seferber edildi ve bütün vilayetlere kamyonlarını, kerestelerini ve pirinçlerini ordunun emrine vermeleri bildirildi. Valiler, kentlere hiçbir şey kalmayacağını söyleyerek itiraz ediyor. Kendilerine kibarca, sahiller tutulamazsa ortada kent de kalmayacağı söyleniyor."
 SEA_japan.3.t:0 "Ketsu-Go"
 SEA_japan_air_accidents_events.01.a:0 "Yıkıcı bir darbe..."
 SEA_japan_air_accidents_events.01.desc:0 "Amiral Isoroku Yamamoto, bugün erken saatlerde düşman ateşiyle düşürüldü. Bir grup [USA.GetAdjective] avcı uçağı, istihbarat iletilerimizi ele geçirdikten sonra onu engelledi. Çirkin saldırılarına 'İntikam Harekatı' adını vermiş olmaları, bir mesaj vermek istediklerini açıkça gösteriyor. Ulusumuz bu büyük savaşçının kaybının yasını tutarken, bu onursuz düşmanı devirme görevlerimizi unutmamalıyız!"
 SEA_japan_air_accidents_events.01.t:0 "$JAP_isoroku_yamamoto$'nun Trajik Ölümü"
 SEA_japan_air_accidents_events.02.a:0 "Onuru korundu"
 SEA_japan_air_accidents_events.02.desc:0 "Amiral Isoroku Yamamoto, bugün erken saatlerde transit uçuş sırasında düşman ateşine maruz kaldı. Bölgedeki deniz hava kuvvetleriyle temas kurmayı ve baraj ateşinden uzak durmayı başaran Yamamoto, kaçmayı ve uçağını başarıyla indirmeyi başardı. Amiral, cesareti ve bu kadar sıcak bir durumda sakin kaldığı için övgüyle karşılandı."
 SEA_japan_air_accidents_events.02.t:0 "İntikam Harekatı Önlendi"
 SEA_japan_air_accidents_events.03.a:0 "Bir mesaj gönderildi."
 SEA_japan_air_accidents_events.03.desc:0 "Kriptanalistlerimiz haftalar boyunca düşmanın deniz trafiğini bir sabah gazetesi kadar kolaylıkla okudular ve bu hafta bize bir seyahat planı verdi: dakikasına göre ayarlanmış kalkış, eskort ve varış. [JAP.GetAdjective] donanması dakik değilse hiçbir şey değildir. \n\nA uzun menzilli savaş uçaklarının uçuşu şafaktan önce ayrıldı ve deniz tarafından randevuya varmak için tüm ayağı dalga tepesi yüksekliğinde tam radyo sessizliği içinde, açık su üzerinde geniş bir yay çizerek uçtu. Belirlenen saatten bir dakika sonra geldiler. Eskort kenara itildi ve $JAP_isoroku_yamamoto$'yi taşıyan uçak ormanın içine doğru yanarak düştü. Pilotlarımızdan ikisi cinayeti üstlendi ve ikisi de bunu kabul etmeyecek; bu iddia muhtemelen savaşın kendisinden daha uzun süre dayanacak gibi görünüyor.\n\nPearl Harbor'ın mimarına maaşın tamamı ödendi. Şimdi daha zor bir görev geliyor: [JAP.GetNameDef] nasıl bildiğimizden asla şüphelenmemeli. Bırakın övgü sahil gözlemcilerine ve iyi şansa düşsün ve kodlarının aynen oldukları gibi kalmasına izin verin."
 SEA_japan_air_accidents_events.03.t:0 "İntikam Operasyonu Başarılı Oldu"
 SEA_japan_air_accidents_events.04.a:0 "Parmaklarımızın arasından kayıp gitti."
 SEA_japan_air_accidents_events.04.desc:0 "Seyahat programı mükemmeldi. Zamanlama mükemmeldi. Çatışma dışında her şey mükemmeldi.\n\nSavaşçılarımız randevuyu tam olarak planlandığı gibi yaptı, ancak eskort izin verdiğimizden daha hızlı hedeften uzaklaştı ve karışıklık içinde $JAP_isoroku_yamamoto$'yi taşıyan uçak güneye doğru kayıp güvenli bir şekilde yere indi. Pilotlarımız eve kanatlarında deliklerle ve şimdiye kadar yapılan en uzun avcı önleme girişimi için gösterecek hiçbir şey olmadan geldiler.\n\nKabul edebileceğimiz bir amiralin kaybı. Bakanlığı çok daha fazla rahatsız eden şey, düşmanın bundan ne anlayacağıdır. Boş okyanusun yüzlerce kilometre ötesinde bu kadar hassas bir pusu tesadüfen gerçekleşmez ve [JAP.GetNameDef] bizim kadar iyi sayabilir. Eğer sinyallerinin okunduğu sonucuna varırlar ve kodlarını buna göre değiştirirlerse, bu savaşın en iyi istihbaratını ıskalayan bir silah sesiyle takas etmiş olacağız."
 SEA_japan_air_accidents_events.04.t:0 "İntikam Operasyonu Başarısız"
 SEA_japan_foreign_policy.1.a:0 "Bu bizim için bir Fırsat"
 SEA_japan_foreign_policy.1.b:0 "Ne pahasına olursa olsun bağımsızlığımızı korumalıyız!"
 SEA_japan_foreign_policy.1.desc:0 "[FROM.GetNameDef] Kwantung Ordusu liderliği teslimiyetimizi talep etti. Ancak bir teklifle geldiler. Onlara katılırsak, eski Moğol topraklarını geri almamıza yardım edecekler ve onların kontrolü altında yeni bir Moğol İmparatorluğu kurmamıza izin verecekler. Ne diyoruz?"
 SEA_japan_foreign_policy.1.t:0 "[FROM.GetNameDefCap] Teslimiyetimizi Talep Ediyor"
 SEA_japan_foreign_policy.10.a:0 "Bu uğrunda savaşmaya değmez"
 SEA_japan_foreign_policy.10.b:0 "Bunu onlara vermeyeceğiz!"
 SEA_japan_foreign_policy.10.desc:0 "[FROM.GetNameDef] tarafından bize gönderilen bir heyet bize bir ültimatom sundu. Tonkin bölgesinden birliklerimizi boşaltmamız ve birliklerinin bölgede mevzilenip askeri üsler kurmasına izin vermemiz için bize bir hafta süre verdiler. Bunun Çinlilerin [VIN.GetAdjective] egemenliğini tehdit etmemesini sağlamak için olduğunu öne sürüyorlar, ancak bunun gerçekte neyle ilgili olduğunu biliyoruz..."
 SEA_japan_foreign_policy.10.t:0 "[FROM.GetNameDefCap], [671.GetName] İşgalini Talep Ediyor"
 SEA_japan_foreign_policy.100.a:0 "Memnuniyetle kabul edeceğiz"
 SEA_japan_foreign_policy.100.b:0 "Bana şüpheli geliyor..."
 SEA_japan_foreign_policy.100.desc:0 "[FROM.GetNameDef] lideri [FROM.GetLeader], onlarla bir para birliğine katılmamız için bize bir teklifle yaklaştı, bu her iki ulusumuzun ekonomisini güçlendirmekten başka bir işe yaramayacak. Kaçırılmayacak kadar iyi bir anlaşma gibi geliyor değil mi?"
 SEA_japan_foreign_policy.100.t:0 "[FROM.GetNameDefCap] Bizi Bir Para Birliğine Davet Ediyor"
 SEA_japan_foreign_policy.101.a:0 "Harika"
 SEA_japan_foreign_policy.101.desc:0 "[FROM.GetNameDef] lideri [FROM.GetLeader], uluslarımız arasında ortak bir para birimi oluşturulması teklifimize olumlu yanıt verdi ve bunun derhal yürürlüğe girmesini kolaylaştırmak için gerekli evrakları imzaladı. Tüm Asya için parlak bir gelecek vizyonumuzu paylaşıyorlar!"
 SEA_japan_foreign_policy.101.t:0 "[FROM.GetNameDefCap] Para Birliğine Katılıyor"
 SEA_japan_foreign_policy.102.a:0 "Ne kadar acınası!"
 SEA_japan_foreign_policy.102.desc:0 "[FROM.GetNameDef] lideri [FROM.GetLeader], ittifakımız içinde ortak bir para biriminin kabul edilmesi talebimize sert bir şekilde yanıt verdi ve böyle bir konuyu zorlamaya çalışırsak gümrük vergileri koymakla tehdit etti. Görünüşe göre [FROM.GetNameDef] aklımızdaki parlak geleceğin bir parçası olmayacak."
 SEA_japan_foreign_policy.102.t:0 "[FROM.GetNameDefCap] Para Birliğini Reddediyor"
 SEA_japan_foreign_policy.103.a:0 "Kaçırılmayacak kadar iyi"
 SEA_japan_foreign_policy.103.b:0 "Ekonomik bağımsızlığımızdan vazgeçmeyeceğiz!"
 SEA_japan_foreign_policy.103.desc:0 "[FROM.GetNameDef] lideri [FROM.GetLeader] bugün başkentimize gelerek bize bir teklif sundu. Para birliği faaliyetlerimizi artırmamızı ve onlarla ekonomik entegrasyonumuzu ilerletmemizi istiyorlar. Ekonomimize önemli ölçüde yardımcı olurdu, ancak tüm bunlarda şüpheli bir şeyler var..."
 SEA_japan_foreign_policy.103.t:0 "[FROM.GetNameDefCap] Ekonomik Entegrasyon Talep Ediyor"
 SEA_japan_foreign_policy.104.a:0 "Saflıkları için minnettarız"
 SEA_japan_foreign_policy.104.desc:0 "[FROM.GetNameDef] lideri [FROM.GetLeader] teklifimize olumlu yanıt verdi ve diplomatları, daha fazla ekonomik entegrasyonlarını kolaylaştırmak için gerekli belgeleri imzalamak üzere ülkemize geldiler."
 SEA_japan_foreign_policy.104.t:0 "[FROM.GetNameDefCap] Teklifimizi Kabul Ediyor"
 SEA_japan_foreign_policy.105.a:0 "Korkunç haber..."
 SEA_japan_foreign_policy.105.desc:0 "[FROM.GetNameDef] lideri [FROM.GetLeader], entegrasyon davetimize büyük bir hoşnutsuzlukla yanıt verdi ve ülkelerimiz arasında herhangi bir yakın ekonomik ortaklığın masada olmadığını ve sonsuza kadar olmayacağını iddia etti. Belki de onlar için ne hazırladığımızı görebiliyorlardı..."
 SEA_japan_foreign_policy.105.t:0 "[FROM.GetNameDefCap] Teklifimizi Reddediyor"
 SEA_japan_foreign_policy.106.a:0 "Durumu kabul etmek zorunda kalacağız"
 SEA_japan_foreign_policy.106.b:0 "Zafer ya da ölüm!"
 SEA_japan_foreign_policy.106.desc:0 "[FROM.GetNameDef] lideri [FROM.GetLeader] başlangıçta vaat edilenden bir adım daha ileri gitti ve yoldan sapmamamızı sağlamak için bir hareketle ekonomilerine olan bağımlılığımızı daha da artırmak için piyasaları manipüle ediyor. Onlardan hemen ayrılmazsak, bu pratikte bağımsız bir ulus olarak statümüzün sonu olacak. Bu konuda ne yapmalıyız?"
 SEA_japan_foreign_policy.106.t:0 "[FROM.GetNameDefCap] Ekonomimizi Entegre Ediyor"
 SEA_japan_foreign_policy.107.a:0 "Harika!"
 SEA_japan_foreign_policy.107.desc:0 "[FROM.GetNameDef] liderliğinin bizimle daha fazla entegre olmayı seçtiğine dair muhteşem haber, bugün erken saatlerde Diyet'te büyük alkışlarla karşılandı. Sunabileceğimiz şeyler, egemenliklerine vurulan hafif darbeye rağmen teklifi avantajlı görmeleri için açıkça yeterliydi."
 SEA_japan_foreign_policy.107.t:0 "[FROM.GetNameDefCap] Daha Fazla Entegrasyonu Kabul Ediyor"
 SEA_japan_foreign_policy.108.a:0 "Onlar örgütün birliği için bir risk!"
 SEA_japan_foreign_policy.108.b:0 "Gözümüz üzerlerinde olacak"
 SEA_japan_foreign_policy.108.desc:0 "Bariz avantajlara ve birlik için açıkça en iyisi olmasına rağmen, [FROM.GetNameDef] daha fazla entegrasyon teklifimizi reddetti. Sebepleri hakkında sadece spekülasyon yapılabilir, ancak birliğin en iyi çıkarlarını düşünmedikleri görülüyor."
 SEA_japan_foreign_policy.108.t:0 "[FROM.GetNameDefCap] Daha Fazla Entegrasyonu Reddediyor"
 SEA_japan_foreign_policy.109.a:0 "Durumu kabul etmek zorunda kalacağız"
 SEA_japan_foreign_policy.109.b:0 "Zafer ya da ölüm!"
 SEA_japan_foreign_policy.109.desc:0 "Ekonomilerimizi entegre etmek görünüşe göre [FROM.GetAdjective] halkını tatmin etmeye yetmedi, çünkü [FROM.GetNameDef] lideri [FROM.GetLeader] bugün başlangıçta vaat edilenden bir adım daha ileri gitti ve şimdi uluslarına tam entegrasyonumuzu talep ediyor. Onlardan hemen ayrılmazsak, bu bağımsız bir ulus olarak statümüzün sonu olacak. Bu konuda ne yapmalıyız?"
 SEA_japan_foreign_policy.109.t:0 "[FROM.GetNameDefCap] Tam Entegrasyon Talep Ediyor"
 SEA_japan_foreign_policy.11.a:0 "[ROOT.GetAdjective] Halkı İçin Harika Bir Gün"
 SEA_japan_foreign_policy.11.desc:0 "[FROM.GetNameDef] liderliği mantıklı davrandı ve Çin birliklerinin [VIN.GetAdjective] topraklarına girmemesini sağlamak üzere orada bir güvenlik bölgesi kurmamıza izin vermek için Tonkin'den birliklerini boşaltmaya başladı. Gün kazanıldı!"
 SEA_japan_foreign_policy.11.t:0 "[FROM.GetNameDefCap], [671.GetName] Bölgesini Devrediyor"
 SEA_japan_foreign_policy.110.a:0 "Harika!"
 SEA_japan_foreign_policy.110.desc:0 "[FROM.GetNameDef] liderliğinin ulusumuza entegre olmaya izin verdiğine dair muhteşem haber, bugün erken saatlerde Diyet'te büyük alkışlarla karşılandı. Sunabileceğimiz şeyler, egemenliklerinin sona ermesine rağmen teklifi avantajlı görmeleri için açıkça yeterliydi."
 SEA_japan_foreign_policy.110.t:0 "[FROM.GetNameDefCap] Tam Entegrasyonu Kabul Ediyor"
 SEA_japan_foreign_policy.111.a:0 "Onlar örgütün birliği için bir risk!"
 SEA_japan_foreign_policy.111.b:0 "Gözümüz üzerlerinde olacak"
 SEA_japan_foreign_policy.111.desc:0 "Bariz avantajlara ve birlik için açıkça en iyisi olmasına rağmen, [FROM.GetNameDef] tam entegrasyon teklifimizi reddetti. Sebepleri hakkında sadece spekülasyon yapılabilir, ancak birliğin en iyi çıkarlarını düşünmedikleri görülüyor."
 SEA_japan_foreign_policy.111.t:0 "[FROM.GetNameDefCap] Tam Entegrasyonu Reddediyor"
 SEA_japan_foreign_policy.112.a:0 "Bu, çabalarımızı diğer alanlara odaklamamıza olanak tanıyor"
 SEA_japan_foreign_policy.112.b:0 "İmparatorluğumuzdan taviz vermek mi? Asla!"
 SEA_japan_foreign_policy.112.desc:0 "[FROM.GetNameDef] ülkesine ait diplomatlar, Pasifik Muhafızı doktrinlerinin bir parçası olduğunu, bizim Avrupa ve Afrika'ya odaklanmamıza izin verirken onların da Asya'yı komünizmden koruyacağını iddia ederek, hayati bölgelerden bazılarına kaynak hakları karşılığında Burma ve Malezya'daki bağlı devletlerimizin hakimiyetinin kendilerine verilmesini öngören bir anlaşma önerdiler. Ne diyoruz?"
 SEA_japan_foreign_policy.112.t:0 "[FROM.GetNameDefCap] Asya Kolonilerimizin Kontrolünü Talep Ediyor"
 SEA_japan_foreign_policy.113.a:0 "Onlar için Pasifik'i koruyacağız"
 SEA_japan_foreign_policy.113.desc:0 "[FROM.GetNameDef] lideri [FROM.GetLeader] teklifimizi nezaketle kabul etti ve bölgedeki hayati doğal kaynakların kontrolünü elinde tutma karşılığında Malezya ve Burma'daki kolonilerinin bize devredilmesini kolaylaştıracak evrakları imzaladı. Bugün Asya halkı için harika bir gün!"
 SEA_japan_foreign_policy.113.t:0 "[FROM.GetNameDefCap] Asya Kolonilerini Devrediyor"
 SEA_japan_foreign_policy.114.a:0 "Kibirli batılılar..."
 SEA_japan_foreign_policy.114.desc:0 "[FROM.GetNameDef] lideri [FROM.GetLeader] utanç verici bir gösteri yaptı ve bize batı zihniyetinin ne kadar bulanık ve yozlaşmış olduğunu gösterdi. Onlara reddedemeyecekleri, Asya'yı daha iyi bir yer haline getirecek bir anlaşma sunduk, ancak bir şekilde bir yolunu buldular. Bugün ittifakımız için karanlık bir gün."
 SEA_japan_foreign_policy.114.t:0 "[FROM.GetNameDefCap] İsteğimizi Reddediyor"
 SEA_japan_foreign_policy.115.a:0 "Asya'da Japon hakimiyetini kabul etme zamanı geldi"
 SEA_japan_foreign_policy.115.b:0 "Onları zorla almaları gerekecek!"
 SEA_japan_foreign_policy.115.desc:0 "Zayıflığımızın sağladığı fırsatı değerlendiren [From.GetAdjective], kolonilerimizde 'düzeni sağlamamız' için bize 'yardım' teklif etti. Dünyanın başka yerlerinde yangın varken, bu bölgeler üzerindeki hakimiyetimizi sürdürme olasılığımızın olmadığını savunuyorlar.\n\nBu açıkça kolonilerimizin kontrolünü bizden almak için bir hile, ama başka ne seçeneğimiz var?"
 SEA_japan_foreign_policy.115.t:0 "[From.GetNameDefCap], Kolonilerimizden Biri Üzerinde Hakimiyet İstiyor"
 SEA_japan_foreign_policy.116.a:0 "Akıllıca bir karar"
 SEA_japan_foreign_policy.116.desc:0 "[From.GetNameDefCap], kolonilerinde 'düzeni sağlama' teklifimizi dikkatlice değerlendirdi ve kabul etmeye karar verdi. Bağlı devletlerinin tam kontrolünü fiilen bize devrettiler."
 SEA_japan_foreign_policy.116.t:0 "[From.GetNameDefCap] Kolonilerin Hakimiyetini Veriyor"
 SEA_japan_foreign_policy.117.a:0 "Bunun onlar için nasıl sonuçlanacağını göreceğiz"
 SEA_japan_foreign_policy.117.b:0 "O zaman onları zorla özgürleştireceğiz!"
 SEA_japan_foreign_policy.117.desc:0 "[From.GetNameDefCap], kolonilerinde 'düzeni sağlama' teklifimizi dikkatlice değerlendirdi ve reddetmeye karar verdi. Görünüşe göre Asya halklarının çıkarlarını en iyi şekilde düşünmüyorlar."
 SEA_japan_foreign_policy.117.t:0 "[From.GetNameDefCap] Kolonilerin Hakimiyetini Reddediyor"
 SEA_japan_foreign_policy.118.a:0 "Birlikte daha güçlü olacağız"
 SEA_japan_foreign_policy.118.b:0 "Bu tarafsızlık ilkelerimize aykırı olurdu..."
 SEA_japan_foreign_policy.118.desc:0 "Uzaklardan bir heyet yakın zamanda başkentimize geldi ve [ROOT.GetLeader] ile bir görüşme talep etti. [FROM.GetNameDef] ülkesinden olduklarını iddia ediyorlar ve uluslarımız arasında bir ittifak arıyorlar. Kabul ediyor muyuz?"
 SEA_japan_foreign_policy.118.t:0 "[FROM.GetNameDefCap] Bizi İttifaklarına Davet Ediyor"
 SEA_japan_foreign_policy.119.a:0 "Gelecek vizyonumuzu paylaşıyorlar"
 SEA_japan_foreign_policy.119.desc:0 "[FROM.GetLeader], uluslarımız arasında bir ittifakı resmileştirme teklifimizi nezaketle kabul etti ve etki alanımıza entegrasyonlarını kolaylaştırmak için girişimlere başladı bile. Bugün kutlama günü!"
 SEA_japan_foreign_policy.119.t:0 "[FROM.GetNameDefCap] Davetimizi Kabul Ediyor"
 SEA_japan_foreign_policy.12.a:0 "Kararlarından pişman olacaklar!"
 SEA_japan_foreign_policy.12.b:0 "Bunu sineye çekmeliyiz"
 SEA_japan_foreign_policy.12.desc:0 "[FROM.GetNameDef] liderliği mantıklı davranmayı reddetti ve Çinhindi'nde bir karış toprak bile vermeyeceklerini belirtti. Bu, güneye doğru daha fazla genişlememizi büyük ölçüde engelliyor... Bunu kabul etmeli miyiz, yoksa batıyı devirmenin zamanı geldi mi?"
 SEA_japan_foreign_policy.12.t:0 "[From.GetNameDefCap] Taleplerimizi Reddediyor"
 SEA_japan_foreign_policy.120.a:0 "Kendi kayıpları"
 SEA_japan_foreign_policy.120.desc:0 "[FROM.GetLeader], bunun tarafsızlık ilkelerine aykırı olacağını belirterek uluslarımız arasında bir ittifak teklifimizi kabaca reddetmeye karar verdi. Bu hatalı karara yol açan yolsuzluk miktarını ancak hayal edebiliriz."
 SEA_japan_foreign_policy.120.t:0 "[FROM.GetNameDefCap] Bize Katılmayı Reddediyor"
 SEA_japan_foreign_policy.121.a:0 "Ah..."
 SEA_japan_foreign_policy.121.desc:0 "Eski hakim devletimiz [FROM.GetLeader], ulusumuz üzerindeki kontrolün [JAP.GetNameDef] ülkesine devredilmesini kolaylaştıran belgeleri imzaladı. Görünüşe göre başka bir büyük gücün koruması altına girdik. Artık kaprislerine tabi olacağımız yeni bir Hakim Devletimiz var."
 SEA_japan_foreign_policy.121.t:0 "[FROM.GetNameDefCap] Bizi [JAP.GetAdjective] Kontrolüne Devrediyor"
 SEA_japan_foreign_policy.122.a:0 "Görünüşe göre [From.GetNameDef] içinde bir şeyler dönüyor..."
 SEA_japan_foreign_policy.122.desc:0 "[From.GetAdjective], sol eğilimli memurlarını ve generallerini geri çağırmaya karar verdi ve bunun yerine bize sağ eğilimli generallerini ve memurlarını gayri resmi sürgün olarak gönderdi."
 SEA_japan_foreign_policy.122.t:0 "[From.GetAdjective] Generallerin Değişimi"
 SEA_japan_foreign_policy.123.a:0 "Bu, [Root.GetNameDef] üzerindeki hakimiyetimizi güçlendirecek."
 SEA_japan_foreign_policy.123.desc:0 "Sağ eğilimli generallerimizi ve memurlarımızı, daha önce [From.GetNameDef] ülkesine gayri resmi sürgüne gönderdiğimiz sol eğilimlilerle değiştirme süreci şimdi tamamlandı."
 SEA_japan_foreign_policy.123.t:0 "[Root.GetAdjective] Generaller Değiştirildi"
 SEA_japan_foreign_policy.124.a:0 "Birlikte daha güçlü olacağız"
 SEA_japan_foreign_policy.124.b:0 "Bu tarafsızlık ilkelerimize aykırı olurdu..."
 SEA_japan_foreign_policy.124.desc:0 "Uzaklardan bir heyet yakın zamanda başkentimize geldi ve [ROOT.GetLeader] ile bir görüşme talep etti. [FROM.GetNameDef] ülkesinden olduklarını iddia ediyorlar ve uluslarımız arasında bir ittifak arıyorlar. Kabul ediyor muyuz?"
 SEA_japan_foreign_policy.124.t:0 "[FROM.GetNameDefCap] Bizi Beşinci Enternasyonal'e Davet Ediyor"
 SEA_japan_foreign_policy.125.a:0 "Gelecek vizyonumuzu paylaşıyorlar"
 SEA_japan_foreign_policy.125.desc:0 "[FROM.GetLeader], uluslarımız arasında bir ittifakı resmileştirme teklifimizi nezaketle kabul etti ve etki alanımıza entegrasyonlarını kolaylaştırmak için girişimlere başladı bile. Bugün kutlama günü!"
 SEA_japan_foreign_policy.125.t:0 "[FROM.GetNameDefCap] Davetimizi Kabul Ediyor"
 SEA_japan_foreign_policy.126.a:0 "Kendi kayıpları"
 SEA_japan_foreign_policy.126.desc:0 "[FROM.GetLeader], bunun tarafsızlık ilkelerine aykırı olacağını belirterek uluslarımız arasında bir ittifak teklifimizi kabaca reddetmeye karar verdi. Bu hatalı karara yol açan yolsuzluk miktarını ancak hayal edebiliriz."
 SEA_japan_foreign_policy.126.t:0 "[FROM.GetNameDefCap] Bize Katılmayı Reddediyor"
 SEA_japan_foreign_policy.127.a:0 "Hayır, bunu sineye çekmeliyiz..."
 SEA_japan_foreign_policy.127.b:0 "Evet, bunun bedelini ödeyecekler!"
 SEA_japan_foreign_policy.127.desc:0 "Hain [FROM.GetLeader], Rus iç savaşının sonunda uluslarımız arasında imzalanan anlaşmaları bozarak [JAP.GetNameDef] içindeki komünistlerin lehine bizi terk etti. Dönek davranışları için onları cezalandırmalı mıyız?"
 SEA_japan_foreign_policy.127.t:0 "[FROM.GetNameDefCap] Beşinci Enternasyonal'e Katılıyor"
 SEA_japan_foreign_policy.128.a:0 "Taleplerini reddedecek güce sahip değiliz"
 SEA_japan_foreign_policy.128.b:0 "Son adama kadar savaşacağız!"
 SEA_japan_foreign_policy.128.desc:0 "[FROM.GetNameDef] lideri [FROM.GetLeader], yasadışı ayrılıkçı devletimizin Tokyo'daki merkezi otoritenin yönetimine tekrar boyun eğmesini ve [FROM.GetAdjective] etki alanına geri dönmesini talep etti. Bu bariz tehdide nasıl yanıt vermeliyiz?"
 SEA_japan_foreign_policy.128.t:0 "[FROM.GetLeader] Teslimiyetimizi Talep Ediyor"
 SEA_japan_foreign_policy.129.a:0 "Muhteşem"
 SEA_japan_foreign_policy.129.desc:0 "[FROM.GetNameDef] lideri [FROM.GetLeader] akıllıca taleplerimizi kabul etti ve otoritemize boyun eğdi, [FROM.GetAdjective] ulusunu bir kez daha etki alanımıza geri getirdi. [FROM.GetAdjective] halkı burjuva diktatörlüklerinden kurtarıldığı için bugün muzafferiz!"
 SEA_japan_foreign_policy.129.t:0 "[FROM.GetLeader] Taleplerimizi Kabul Ediyor"
 SEA_japan_foreign_policy.13.a:0 "Uğrunda savaşmaya değmez"
 SEA_japan_foreign_policy.13.b:0 "Kendilerini ne sanıyorlar?"
 SEA_japan_foreign_policy.13.desc:0 "\nBu hafta başlarında, [JAP.GetNameDef] güçleri harekete geçti ve bölgeyi düşmanları tarafından olası bir işgalden koruma görevinde olduklarını belirterek [721.GetName] toprağımızı işgal etti. Bu açıkça bir savaş nedenidir, ancak şu anda savaşmayı göze alabileceğimiz bir düşman olmadıkları için muhtemelen görmezden gelmeyi seçebileceğimiz bir durumdur."
 SEA_japan_foreign_policy.13.t:0 "[FROM.GetNameDefCap], [721.GetName] bölgesini işgal ediyor!"
 SEA_japan_foreign_policy.130.a:0 "O zaman topraklarımızı zorla geri almalıyız!"
 SEA_japan_foreign_policy.130.desc:0 "[FROM.GetNameDef] lideri [FROM.GetLeader], halkın iradesinin [ROOT.GetAdjective] etki alanında devrimci bir devletten ziyade bağımsız bir demokrasi olduğunu iddia ederek teslimiyet taleplerimizi ne yazık ki reddetti. Yanlış seçimi yaptılar..."
 SEA_japan_foreign_policy.130.t:0 "[FROM.GetLeader] Taleplerimizi Reddediyor"
 SEA_japan_foreign_policy.131.a:0 "Proletarya İçin!"
 SEA_japan_foreign_policy.131.b:0 "Bu çılgınlığı durdurmalıyız!"
 SEA_japan_foreign_policy.131.desc:0 "[FROM.GetAdjective] hükümetinin ve Pak Hon-yong gibi kışkırtıcıların son çağrılarından sonra, [ROOT.GetAdjective] proletaryasının barışçıl bir hükümet değişikliğini beklemekten bıktığı görülüyor. Yoğun tartışmaların ardından diplomasinin başarısız olduğu ve silahlı çatışmanın başladığı, Hon-yong'un güçlerinin ülkenin güney kısımlarının kontrolünü çoktan ele geçirdiği görülüyor."
 SEA_japan_foreign_policy.131.t:0 "[FROM.GetNameDefCap], [ROOT.GetNameDef] İçinde Bir İç Savaşı Kışkırtıyor"
 SEA_japan_foreign_policy.132.a:0 "Taleplerini reddedecek güce sahip değiliz"
 SEA_japan_foreign_policy.132.b:0 "Son adama kadar savaşacağız!"
 SEA_japan_foreign_policy.132.desc:0 "[FROM.GetNameDef] lideri [FROM.GetLeader], burjuva diktatörlüğümüzün Tokyo'daki merkezi komünist otoritenin yönetimine boyun eğmesini ve ulusumuzun halkının [FROM.GetAdjective] etki alanının sadık bir parçası olarak kendilerini düzgün bir şekilde yönetmelerine izin vermesini talep etti. Bu bariz tehdide nasıl yanıt vermeliyiz?"
 SEA_japan_foreign_policy.132.t:0 "[FROM.GetLeader] Teslimiyetimizi Talep Ediyor"
 SEA_japan_foreign_policy.133.a:0 "Muhteşem"
 SEA_japan_foreign_policy.133.desc:0 "[FROM.GetNameDef] lideri [FROM.GetLeader] taleplerimizi kabul etti ve otoritemize boyun eğdi, [FROM.GetAdjective] ulusunu etki alanımıza getirdi. [FROM.GetAdjective] halkı burjuva diktatörlüklerinden kurtarıldığı için bugün muzafferiz!"
 SEA_japan_foreign_policy.133.t:0 "[FROM.GetLeader] Taleplerimizi Kabul Ediyor"
 SEA_japan_foreign_policy.134.a:0 "O zaman halklarını zorla özgürleştirmeliyiz!"
 SEA_japan_foreign_policy.134.desc:0 "[FROM.GetNameDef] lideri [FROM.GetLeader], halkın iradesinin [ROOT.GetAdjective] etki alanında devrimci bir devletten ziyade bağımsız bir ulus olduğunu iddia ederek teslimiyet taleplerimizi ne yazık ki reddetti. Yanlış seçimi yaptılar..."
 SEA_japan_foreign_policy.134.t:0 "[FROM.GetLeader] Taleplerimizi Reddediyor"
 SEA_japan_foreign_policy.135.a:0 "Refah ufukta görünüyor!"
 SEA_japan_foreign_policy.135.desc:0 "Bugün erken saatlerde, [ROOT.GetLeader] ve çeşitli [JAP.GetAdjective] ordu liderleri ortak bir bildiriyle yeni bir [ROOT.GetAdjective] devletinin kurulduğunu ilan ettiler. Tüm düşmanlarımıza karşı muzaffer olacağız!"
 SEA_japan_foreign_policy.135.t:0 "İkinci Filipin Cumhuriyeti'nin İlanı"
 SEA_japan_foreign_policy.136.a:0 "Bu gün tarihe kara bir leke olarak geçecek!"
 SEA_japan_foreign_policy.136.desc:0 "Dün, tarihe kara bir leke olarak geçecek bir tarihte, [ROOT.GetNameDef] aniden ve kasıtlı olarak [JAP.GetNameDef] donanma ve hava kuvvetleri tarafından saldırıya uğradı. [ROOT.GetNameDefCap] o Ulusla barış içindeydi ve [JAP.GetNonIdeologyName] talebi üzerine, Hükümeti ve İmparatoru ile Pasifik'te barışın korunmasına yönelik görüşmeleri sürdürüyordu. Gerçekten de, [JAP.GetAdjective] hava filolarının [ROOT.GetAdjective] Oahu Adası'nı bombalamaya başlamasından bir saat sonra, Amerika Birleşik Devletleri'ndeki [JAP.GetAdjective] Büyükelçisi ve meslektaşı, Dışişleri Bakanımıza son bir [ROOT.GetAdjective] mesajına resmi bir yanıt iletti. Ve bu yanıt mevcut diplomatik müzakerelere devam etmenin yararsız göründüğünü belirtirken, hiçbir savaş veya silahlı saldırı tehdidi veya iması içermiyordu. Ama şimdi gerçekle yüzleşme zamanı... Savaştayız!"
 SEA_japan_foreign_policy.136.t:0 "Pearl Harbor'a Saldırı"
 SEA_japan_foreign_policy.137.a:0 "[ROOT.GetLeader] iyi bir pozisyon kazanacak, bu yüzden kabul ediyoruz"
 SEA_japan_foreign_policy.137.b:0 "Bu otonomimizin sonu olur, hayır!"
 SEA_japan_foreign_policy.137.desc:0 "[JAP.GetLeader] hükümetimizi [MAN.GetNameDef] ile birleştirmemizi, bağımsızlığımızı sona erdirmemizi ve liderliğimize [MAN.GetAdjective] hükümeti içinde üst düzey pozisyonlar vermemizi talep etti. Bu teklifi kabul ediyor muyuz?"
 SEA_japan_foreign_policy.137.t:0 "[MAN.GetNameDef] İle Birleşme"
 SEA_japan_foreign_policy.138.a:0 "Akıllıca Bir Seçim"
 SEA_japan_foreign_policy.138.desc:0 "[FROM.GetNameDef]'in [FROM.GetLeader]'ı hükümetimizle birleşmeye yönelik [JAP.GetAdjective] teklifini kabul etti ve [FROM.GetAdjective] topraklarının tamamı artık bizim hukuki yetkimiz altına giriyor. Bu bizim için harika bir gün!"
 SEA_japan_foreign_policy.138.t:0 "[FROM.GetNameDefCap] Bizimle Birleşiyor"
 SEA_japan_foreign_policy.139.a:0 "Büyük Bir Utanç"
 SEA_japan_foreign_policy.139.desc:0 "Sığ [FROM.GetLeader] mantıklı düşünmeyi reddetti ve onları [MAN.GetAdjective] hükümetiyle birleştirme teklifimizi reddetti. Belki daha iyi bir anlaşma ve hatta belki de uygun dozda bir gözdağı gereklidir."
 SEA_japan_foreign_policy.139.t:0 "[FROM.GetNameDefCap] Birleşmeyi Reddediyor"
 SEA_japan_foreign_policy.14.a:0 "Pekala"
 SEA_japan_foreign_policy.14.desc:0 "Devletimizin kurulmasına yardımcı olan [FROM.GetAdjective] yöneticiler, hükümet yapımızı yeniden düzenlemek ve hukuk sistemimizi yeniden şekillendirmek için şu anın iyi bir zaman olduğuna karar verdiler. Uzun vadede bu bizi sadece güçlendirmeye hizmet edecek, bu yüzden onları reddetmek için hiçbir nedenimiz yok."
 SEA_japan_foreign_policy.14.t:0 "[FROM.GetNameDefCap] Hükümetimizi Yeniden Düzenliyor"
 SEA_japan_foreign_policy.140.a:0 "Pekala, bu idari görevlerimizi daha basit hale getirir"
 SEA_japan_foreign_policy.140.b:0 "Kulağa şüpheli geliyor"
 SEA_japan_foreign_policy.140.desc:0 "[MAN.GetLeader] diğer Çin kukla hükümetlerini [MAN.GetNameDef] ile birleştirmemizi, otonomilerini sona erdirmemizi ve topraklarını [MAN.GetAdjective] hükümetine vermemizi talep etti. Bu teklifi kabul ediyor muyuz?"
 SEA_japan_foreign_policy.140.t:0 "[MAN.GetLeader] Kukla Yönetimlerini Birleştirmeye Çalışıyor"
 SEA_japan_foreign_policy.141.a:0 "Daha sonra tekrar denemek zorunda kalacağız..."
 SEA_japan_foreign_policy.141.desc:0 "[JAP.GetLeader] diğer Çin kukla hükümetlerini bizimkilerle birleştirme talebimizi tamamen reddetti. Görünüşe göre böyle bir hamlenin hükümet tarafından kolayca kabul edilmesi için henüz çok erkendi."
 SEA_japan_foreign_policy.141.t:0 "[JAP.GetLeader] Teklifimizi Reddediyor"
 SEA_japan_foreign_policy.15.a:0 "Bu uğrunda savaşmaya değmez"
 SEA_japan_foreign_policy.15.b:0 "Bunu onlara vermeyeceğiz!"
 SEA_japan_foreign_policy.15.desc:0 "Şehrin, fırsat doğması halinde düşmanlarının kendilerine saldırması için iyi bir nokta olabileceğini öne süren [592.GetName] bölgesini yöneten [FROM.GetAdjective] birlikleri bize bir ültimatom sundu. Ya içeri girmelerine izin verip esasen şehirle istediklerini yapma yetkisi vereceğiz ya da [FROM.GetAdjective] ordusunun tüm gücüyle yüzleşeceğiz. Ne yapmalıyız?"
 SEA_japan_foreign_policy.15.t:0 "[FROM.GetNameDefCap], [729.GetName] İşgalini Talep Ediyor"
 SEA_japan_foreign_policy.16.a:0 "[ROOT.GetAdjective] Halkı İçin Harika Bir Gün"
 SEA_japan_foreign_policy.16.desc:0 "[729.GetName] bölge yöneticileri, direnişin nihayetinde beyhude olacağını fark ederek birliklerimizi içeri almaya karar verdiler. Halkımız seviniyor, çünkü bir başka batılı güç daha Doğu Asya'dan kovuldu!"
 SEA_japan_foreign_policy.16.t:0 "[FROM.GetNameDefCap], [729.GetName] Bölgesini Devrediyor"
 SEA_japan_foreign_policy.17.a:0 "Kararlarından pişman olacaklar!"
 SEA_japan_foreign_policy.17.b:0 "Bunu sineye çekmeliyiz"
 SEA_japan_foreign_policy.17.desc:0 "[729.GetName] bölge yöneticileri hadlerini unuttular ve [592.GetName] içindeki valilerimiz tarafından kendilerine daha önce iletilen talepleri reddetmeye karar verdiler. [FROM.GetAdjective] imparatorluğunu kesin olarak devirme zamanı geldi!"
 SEA_japan_foreign_policy.17.t:0 "[From.GetNameDefCap] Taleplerimizi Reddediyor"
 SEA_japan_foreign_policy.18.a:0 "Birlikte daha güçlü olacağız"
 SEA_japan_foreign_policy.18.b:0 "Bu tarafsızlık ilkelerimize aykırı olurdu..."
 SEA_japan_foreign_policy.18.desc:0 "Uzaklardan bir heyet yakın zamanda başkentimize geldi ve ekselansları ile bir görüşme talep etti. [FROM.GetNameDef] ülkesinden olduklarını iddia ediyorlar ve uluslarımız arasında bir ittifak arıyorlar. Kabul ediyor muyuz?"
 SEA_japan_foreign_policy.18.t:0 "[FROM.GetNameDefCap] Bizi İttifaklarına Davet Ediyor"
 SEA_japan_foreign_policy.19.a:0 "Kendileri için en iyisini biliyorlar"
 SEA_japan_foreign_policy.19.desc:0 "[FROM.GetLeader], uluslarımız arasında bir ittifakı resmileştirme teklifimizi nezaketle kabul etti ve etki alanımıza entegrasyonlarını kolaylaştırmak için girişimlere başladı bile. Bugün kutlama günü!"
 SEA_japan_foreign_policy.19.t:0 "[FROM.GetNameDefCap] Davetimizi Kabul Ediyor"
 SEA_japan_foreign_policy.2.a:0 "İmparator bunu duymaktan memnun olacak"
 SEA_japan_foreign_policy.2.desc:0 "[FROM.GetLeader], [FROM.GetAdjective] tahtı için adayımız Prens De lehine istifa etti. Bölge artık işgalimiz altına girdi ve hükümetlerinin yeniden düzenlenmesi kısa süre içinde devam edecek."
 SEA_japan_foreign_policy.2.t:0 "[FROM.GetNameDefCap] Yönetimimize Boyun Eğiyor"
 SEA_japan_foreign_policy.20.a:0 "Kendi kayıpları"
 SEA_japan_foreign_policy.20.desc:0 "[FROM.GetLeader], bunun tarafsızlık ilkelerine aykırı olacağını belirterek uluslarımız arasında bir ittifak teklifimizi kabaca reddetmeye karar verdi. Bu hatalı karara yol açan yolsuzluk miktarını ancak hayal edebiliriz."
 SEA_japan_foreign_policy.20.t:0 "[FROM.GetNameDefCap] Bize Katılmayı Reddediyor"
 SEA_japan_foreign_policy.21.a:0 "Eğer yapmak istedikleri buysa"
 SEA_japan_foreign_policy.21.desc:0 "Lütufkar hakim devletimiz [FROM.GetNameDef], gerçek Moğol devleti olma iddialarımızı nihayet meşrulaştırmaya karar verdi ve bu politika değişikliğini kolaylaştırmak için hükümetimizin ve kurumlarımızın bir başka yeniden düzenlenmesini önerdi. Bugün [ROOT.GetAdjective] halkı için harika bir gün!"
 SEA_japan_foreign_policy.21.t:0 "[FROM.GetNameDefCap] Hükümetimizi Daha Da Yeniden Düzenliyor"
 SEA_japan_foreign_policy.22.a:0 "Bize bir zarar vermezler, bırakın kalsınlar"
 SEA_japan_foreign_policy.22.b:0 "Ulusal güvenliğimizi artırmamız zorunludur!"
 SEA_japan_foreign_policy.22.desc:0 "[FROM.GetAdjective] emirleri doğrultusunda hareket ettiğinden şüphelenilen ajanlar sınırlarımız içinde görüldü, görünüşe göre soylularla temas kurmaya çalışıyorlar ve vatandaşlarımızı büyük Ortak Refah vaatleriyle cezbediyorlar. Durumu nasıl ele almalıyız?"
 SEA_japan_foreign_policy.22.t:0 "Şüpheli [FROM.GetAdjective] Ajanları Görüldü"
 SEA_japan_foreign_policy.23.a:0 "Ortak Refah Alanı onları cezbediyor..."
 SEA_japan_foreign_policy.23.desc:0 "[FROM.GetAdjective] ajanları şimdi Lhasa genelinde pan-asyacı propaganda yaymaya başladılar ve yerel soyluları etkilemek için fon kaçırmaya başladılar. Durum yakında kontrolden çıkacak gibi görünüyor..."
 SEA_japan_foreign_policy.23.t:0 "[FROM.GetNameDefCap] Halkımızı Etkiliyor"
 SEA_japan_foreign_policy.24.a:0 "Bir şeyler planlıyorlar..."
 SEA_japan_foreign_policy.24.desc:0 "Subaylarımız, [FROM.GetAdjective] ajanlarının, bir zamanlar Tibet'in Güçlü Adamı lakabıyla anılan ve çok fazla güce sahip bir soylu olan Thubten Kunphela ile temas kurmada görünüşe göre başarılı olduklarını bildirdi. İşler buradan sonra bizim için kötüleşebilir..."
 SEA_japan_foreign_policy.24.t:0 "[FROM.GetNameDefCap] Thubten Kunphela ile Temas Kuruyor"
 SEA_japan_foreign_policy.25.a:0 "Bu iş çığırından çıkıyor!"
 SEA_japan_foreign_policy.25.desc:0 "İngiliz Hindistanı'nda sürgünde kurulan ve Thubten Kunphela'ya sadakat besleyen bir siyasi parti olan Tibet İyileştirme Partisi, son zamanlarda bilinmeyen göndericilerden silah paketleri alıyor. Görünüşe göre ulaşamayacağımız bir konumdan bir darbe hazırlığı içinde olabilirler."
 SEA_japan_foreign_policy.25.t:0 "[FROM.GetNameDefCap] Tibet İyileştirme Partisini Askerileştiriyor"
 SEA_japan_foreign_policy.26.a:0 "Belki de haklıdır"
 SEA_japan_foreign_policy.26.b:0 "Onları defedin!"
 SEA_japan_foreign_policy.26.desc:0 "Nihayet o gün geldi. Bu sabahın erken saatlerinde, Thubten Kunphela silahlı destekçileriyle birlikte Lhasa üzerine yürüdü, yönetimimizin yozlaşmış ve gayrimeşru olduğunu iddia etti ve [ROOT.GetNameDef] ülkesinin [FROM.GetAdjective] etki alanının bir parçası olarak daha iyi durumda olacağını belirtti. Taleplerine boyun mu eğeceğiz, yoksa son bir direniş mi göstereceğiz?"
 SEA_japan_foreign_policy.26.t:0 "Güçlü Adamın Darbesi"
 SEA_japan_foreign_policy.27.a:0 "Gerçekten harika bir gün"
 SEA_japan_foreign_policy.27.desc:0 "Şu anda gayrimeşru korkak [MON.GetLeader] tarafından yönetilen Dış Moğolistan diyarını talep etmek ve seferimizi başlatmak için o gün nihayet geldi. Dünyaya Cengiz Han'ın ruhunun yaşadığını gösterme zamanı!"
 SEA_japan_foreign_policy.27.t:0 "[FROM.GetNameDefCap] Pan-Moğol İddialarını Destekliyor"
 SEA_japan_foreign_policy.28.a:0 "Harika"
 SEA_japan_foreign_policy.28.desc:0 "Haklı olarak Moğol topraklarını işgal ettikten sonra, hakim devletimiz [FROM.GetNameDef] söz verdikleri gibi bölgelerin idaresini bize devretti. Bize duydukları güven için çok minnettarız!"
 SEA_japan_foreign_policy.28.t:0 "[FROM.GetNameDefCap] Moğol Eyaletlerini Devrediyor"
 SEA_japan_foreign_policy.29.a:0 "En azından artık diğer alanlara odaklanabiliriz"
 SEA_japan_foreign_policy.29.desc:0 "Suiyuan Harekatı sona erdi ve yeni sınırlar çizildi. Bu muhtemelen, bölgedeki eylemlerimize karşı artık yüksek alarmda olan Çin merkezi hükümetinin katılımı olmadan bağlı devletlerimizin böyle bir saldırıya kalkışabileceği son seferdi."
 SEA_japan_foreign_policy.29.t:0 "Suiyuan Harekatının Sonuçları"
 SEA_japan_foreign_policy.3.a:0 "İmparatora saygısızlık ettiler, buna izin verilemez!"
 SEA_japan_foreign_policy.3.b:0 "Zaten onlara ihtiyacımız yoktu"
 SEA_japan_foreign_policy.3.desc:0 "[FROM.GetLeader], ilahi hükümdarımıza karşı geldiğinde Nima-odsor'a ne yaptığımızı görmesine rağmen taleplerimize boyun eğmeyi reddetti. Belki de onlara bir tevazu dersi vermenin zamanı gelmiştir."
 SEA_japan_foreign_policy.3.t:0 "[FROM.GetNameDefCap] İmparatora Boyun Eğmeyi Reddediyor"
 SEA_japan_foreign_policy.30.a:0 "Bir tehdit daha halledildi"
 SEA_japan_foreign_policy.30.desc:0 "Nihayet, [JAP.GetNameDef] ve onların acımasız bağlı devletlerinin amansız saldırısı durdu ve birlikleri pozisyonlarına dönüyor. Bugün yaşananların tarihte hatırlanıp hatırlanmayacağı bilinmiyor, ancak en azından Nankin Hükümeti artık bölgedeki [JAP.GetAdjective] emellerinin farkında."
 SEA_japan_foreign_policy.30.t:0 "Suiyuan Harekatının Sonu"
 SEA_japan_foreign_policy.31.a:0 "Onlara kiminle uğraştıklarını gösterin"
 SEA_japan_foreign_policy.31.desc:0 "[MEN.GetNameDef] ve Büyük Han Adalet Ordusu'na ait güçler Suiyuan'daki mevzilerimize saldırdı ve elimizdeki İç Moğol aymaklarını ele geçirmeye niyetli görünüyorlar. Geçmelerine izin veremeyiz!"
 SEA_japan_foreign_policy.31.t:0 "Japon Yanlısı Güçler Mevzilerimize Saldırıyor!"
 SEA_japan_foreign_policy.32.a:0 "Onlara bunun sözünü verebiliriz"
 SEA_japan_foreign_policy.32.b:0 "[JAP.GetAdjective] ile hiçbir anlaşma yapmayacağız"
 SEA_japan_foreign_policy.32.desc:0 "[FROM.GetAdjective] diplomatlar dış politikaları konusunda yüz seksen derece dönüş yaptılar ve şimdi komünist ve Japon karşıtı duyguları bastırmamız şartıyla bizimle daha yakın çalışmak istediklerini belirtiyorlar. Anlaşmada şüpheli bir şeyler var, ama belki de riske girmeye değer?"
 SEA_japan_foreign_policy.32.t:0 "Japonya Komünist Tehdide karşı İşbirliği Arıyor"
 SEA_japan_foreign_policy.33.a:0 "İlk adım atıldı"
 SEA_japan_foreign_policy.33.desc:0 "[FROM.GetNameDef] lideri [FROM.GetLeader] teklifimizi kabul etti ve devletimize karşı protestoları yasaklamaya söz verirken, aynı zamanda ulus içindeki komünist faaliyetleri bastırmaya hazırlanıyor. Yakında, tüm Asya halklarını kaçınılmaz ve mutlak bir yıkıma götürmekle tehdit eden o irinli yarayı yok edebilmek için onlarla bir ittifakı resmileştirebileceğiz."
 SEA_japan_foreign_policy.33.t:0 "[FROM.GetLeader] Taleplerimizi Kabul Ediyor"
 SEA_japan_foreign_policy.34.a:0 "Kararlarından pişman olacaklar"
 SEA_japan_foreign_policy.34.desc:0 "[FROM.GetNameDef] lideri [FROM.GetLeader], [FROM.GetAdjective] halkının merhameti hak etmediğine karar verdi, lütfedip sunduğumuz teklifi reddetti ve [FROM.GetAdjective] ulusunu sona erdirmemiz gerektiği kararını bizim yerimize verdi."
 SEA_japan_foreign_policy.34.t:0 "[FROM.GetLeader] Taleplerimizi Reddediyor"
 SEA_japan_foreign_policy.35.a:0 "Buna nasıl cüret ederler!"
 SEA_japan_foreign_policy.35.desc:0 "Batı kıyısındaki çeşitli radyo istasyonları, halkımızı Asya çatışmasında kendi taraflarını tutmaya ikna etmek için [FROM.GetAdjective] propagandası yayınlamaya başladı. Çok fazla zarar vermeden önce bunu kapatmalıyız!"
 SEA_japan_foreign_policy.35.t:0 "[FROM.GetNameDefCap] [FROM.GetAdjective] Yanlısı Duygular Yayıyor"
 SEA_japan_foreign_policy.36.a:0 "Dostluklarını kullanabiliriz"
 SEA_japan_foreign_policy.36.b:0 "Bu saçmalığı hemen bastırın!"
 SEA_japan_foreign_policy.36.desc:0 "[FROM.GetNameDef] ülkesine ait radyo istasyonları ulusumuz genelinde [FROM.GetAdjective] yanlısı propaganda yayınlamaya başladı. [FROM.GetAdjective] hükümeti şimdi de radyo istasyonlarının açık kalmasına izin vermemiz karşılığında endüstrilerimize yatırım yapmayı teklif ederek bize yaklaştı."
 SEA_japan_foreign_policy.36.t:0 "[FROM.GetNameDefCap] [FROM.GetAdjective] Yanlısı Duygular Yayıyor"
 SEA_japan_foreign_policy.37.a:0 "Tam da tahmin ettiğimiz gibi"
 SEA_japan_foreign_policy.37.desc:0 "[FROM.GetLeader] teklifimizi kabul etmeye karar verdi ve radyo istasyonlarımızın [FROM.GetAdjective] yayınlarında açık kalmasına izin verecek. Ayrıca sanayicilerimizin orada dükkan açmasına da izin verdiler."
 SEA_japan_foreign_policy.37.t:0 "[FROM.GetNameDefCap] Nüfuzumuzun Yayılmasına İzin Veriyor"
 SEA_japan_foreign_policy.38.a:0 "Kaderin onlar için ne hazırladığını biliyorlar"
 SEA_japan_foreign_policy.38.desc:0 "[FROM.GetLeader], bağımsızlıklarının ilahi pan-Asya misyonundan bir şekilde daha değerli olduğuna karar vererek [FROM.GetNameDef] içindeki müdahalemizi engellemeye karar verdi."
 SEA_japan_foreign_policy.38.t:0 "[FROM.GetNameDefCap] Nüfuzumuzun Yayılmasını Engelliyor"
 SEA_japan_foreign_policy.39.a:0 "Elbette bunun arkasında gizli bir niyet var"
 SEA_japan_foreign_policy.39.desc:0 "[FROM.GetNameDef] lideri [FROM.GetLeader], doğal kaynaklarımıza yatırım yapılmasına izin vermeye karar verdi ve [FROM.GetAdjective] şirketleri sınırlarımız içinde operasyonlar kurmaya başladı bile."
 SEA_japan_foreign_policy.39.t:0 "[FROM.GetAdjective] Doğal Kaynaklarımıza Yatırım Yapıyor"
 SEA_japan_foreign_policy.4.a:0 "Birlikte daha güçlü olacağız"
 SEA_japan_foreign_policy.4.b:0 "Bu tarafsızlık ilkelerimize aykırı olurdu!"
 SEA_japan_foreign_policy.4.c:0 "Savaşın ortasındayız! Onlardan beklemelerini isteyin."
 SEA_japan_foreign_policy.4.c_tt:0 "Sınırlı savaş sona erdiğinde yanıt vermemiz istenecek."
 SEA_japan_foreign_policy.4.desc:0 "Bir [FROM.GetAdjective] heyeti, Asya kıtasına hakim olma arayışlarında işbirliğimizi arayarak ve bu çabayı sürdürürken mevcut ve gelecekteki savaşlarında onlara katılmamızı talep ederek bize yaklaştı. Hayır cevabını kabul edecek gibi görünmüyorlar ama bu kesinlikle bizim yararımıza olamaz?"
 SEA_japan_foreign_policy.4.t:0 "[FROM.GetNameDefCap] İttifaklarına Katılmamızı Talep Ediyor"
 SEA_japan_foreign_policy.40.a:0 "İmparatorun yüce otoritesi her zaman önce gelmelidir!"
 SEA_japan_foreign_policy.40.b:0 "Tüm Asya devletleri için refahı sürdürmeliyiz!"
 SEA_japan_foreign_policy.40.desc:0 "Büyük Doğu Asya Ortak Refah Alanı'nın kurulmasıyla bir soru ortaya çıktı. Vaat edilen Asya refahı hedefini mi izleyeceğiz, yoksa haklı olarak bizim olanı alıp Asya üzerindeki kontrolümüzü daha doğrudan mı sağlayacağız?"
 SEA_japan_foreign_policy.40.t:0 "Doğu Asya Ortak Refah Sorunu"
 SEA_japan_foreign_policy.41.a:0 "Bu stratejiyi hemen uygulamalıyız!"
 SEA_japan_foreign_policy.41.b:0 "Kararımızla beklemek akıllıca olurdu"
 SEA_japan_foreign_policy.41.desc:0 "Senbu, kıta topraklarımız üzerindeki kontrolümüzü artırmak için kuruldu ve işgal altındaki bölgelerimizde uyumu artırmaya çalışmaya başladı. Belki de onlara daha fazla idari görev vermenin ve onları uygun şekilde kullanmanın zamanı gelmiştir?"
 SEA_japan_foreign_policy.41.t:0 "Senbu"
 SEA_japan_foreign_policy.42.a:0 "Bu bizim en büyük çıkarımızadır"
 SEA_japan_foreign_policy.42.b:0 "Bu işte bir bit yeniği var"
 SEA_japan_foreign_policy.42.desc:0 "[FROM.GetLeader], her iki ulusumuzun da ortak bir kadere sahip olduğunu ve ancak yan yana yürüyerek komünist tehdidi ortadan kaldırabileceğimizi ilan etti. Bu amaçla, şartları sadece geçici olduğunu belirtse de bize bir ittifak teklifi sunuldu. Tekliflerini kabul etmeli miyiz?"
 SEA_japan_foreign_policy.42.t:0 "Bir Çin-Japon İttifakı"
 SEA_japan_foreign_policy.43.a:0 "Harika"
 SEA_japan_foreign_policy.43.desc:0 "[FROM.GetAdjective] ulusu, Asya istikrarına yönelik nihai tehdide, yani komünistlere karşı bize silahlı olarak katıldığı için halkımız seviniyor. Bu pakt sadece geçici olsa da, bize büyük avantajlar getireceği kesin."
 SEA_japan_foreign_policy.43.t:0 "[FROM.GetLeader] Paktı İmzalıyor"
 SEA_japan_foreign_policy.44.a:0 "Bu konuda yapılabilecek bir şey yok"
 SEA_japan_foreign_policy.44.desc:0 "Aptalca, [FROM.GetNameDef] lideri [FROM.GetLeader] onursuzca davranmaya karar verdi ve harika teklifimizi reddetti. İttifak iptal edildi ve Kwantung Ordusu bir kez daha gözünü kuzey Çin'e dikti. Belki de şu anda ihtiyaç duyulan şey dış politikamızda bir düzenlemedir."
 SEA_japan_foreign_policy.44.t:0 "[FROM.GetLeader] Paktı İmzalamayı Reddediyor"
 SEA_japan_foreign_policy.45.a:0 "Kaçırılmayacak kadar iyi"
 SEA_japan_foreign_policy.45.b:0 "Ekonomik bağımsızlığımızdan vazgeçmeyeceğiz!"
 SEA_japan_foreign_policy.45.desc:0 "[FROM.GetNameDef] lideri [FROM.GetLeader] bugün başkentimize gelerek bize bir teklif sundu. Birleşik ekonomik faaliyetlerimizi artırmamızı ve onlarla entegrasyonumuzu ilerletmemizi istiyorlar. Ekonomimize önemli ölçüde yardımcı olurdu, ancak tüm bunlarda şüpheli bir şeyler var..."
 SEA_japan_foreign_policy.45.t:0 "[FROM.GetNameDefCap] Ekonomik Entegrasyon Talep Ediyor"
 SEA_japan_foreign_policy.46.a:0 "Saflıkları için minnettarız"
 SEA_japan_foreign_policy.46.desc:0 "[FROM.GetNameDef] lideri [FROM.GetLeader] teklifimize olumlu yanıt verdi ve diplomatları, daha fazla ekonomik entegrasyonlarını kolaylaştırmak için gerekli belgeleri imzalamak üzere ülkemize geldiler."
 SEA_japan_foreign_policy.46.t:0 "[FROM.GetNameDefCap] Teklifimizi Kabul Ediyor"
 SEA_japan_foreign_policy.47.a:0 "Korkunç haber..."
 SEA_japan_foreign_policy.47.desc:0 "[FROM.GetNameDef] lideri [FROM.GetLeader], entegrasyon davetimize büyük bir hoşnutsuzlukla yanıt verdi ve ülkelerimiz arasında herhangi bir yakın ekonomik ortaklığın masada olmadığını ve sonsuza kadar olmayacağını iddia etti. Belki de onlar için ne hazırladığımızı görebiliyorlardı..."
 SEA_japan_foreign_policy.47.t:0 "[FROM.GetNameDefCap] Teklifimizi Reddediyor"
 SEA_japan_foreign_policy.48.a:0 "Refah ufukta görünüyor!"
 SEA_japan_foreign_policy.48.desc:0 "[FROM.GetNameDef] ülkesine ait sanayiciler yerel sanayilerimizi geliştirmeye ve sınırlarımız içinde yeni şirketler kurmaya başladılar. Bu bizi refaha yaklaştıracaktır."
 SEA_japan_foreign_policy.48.t:0 "[FROM.GetNameDefCap] Sanayilerimizi Geliştiriyor"
 SEA_japan_foreign_policy.49.a:0 "Refah ufukta görünüyor!"
 SEA_japan_foreign_policy.49.desc:0 "Bugün Şanghay'da yapılan bir duyuruda, [ROOT.GetLeader], IJA tarafından gönderilen generaller ve yöneticilerle birlikte, yozlaşmış Kuomintang derebeyliğine daha iyi bir alternatif olan yeni bir Çin hükümetinin kurulduğunu ilan etti. Yaşasın Çin Cumhuriyeti!"
 SEA_japan_foreign_policy.49.t:0 "Yeniden Düzenlenmiş Hükümetin İlanı"
 SEA_japan_foreign_policy.5.a:0 "Olması gerektiği gibi"
 SEA_japan_foreign_policy.5.desc:0 "[FROM.GetLeader] mantıklı davrandı ve [FROM.GetNameDef] ülkesinin ittifakımıza girişini kolaylaştırmak için gerekli belgeleri resmen imzalayacağına karar verdi. Bugün kutlanacak bir gün!"
 SEA_japan_foreign_policy.5.t:0 "[FROM.GetNameDefCap] Teklifimizi Kabul Ediyor"
 SEA_japan_foreign_policy.50.a:0 "Durumu kabul etmek zorunda kalacağız"
 SEA_japan_foreign_policy.50.b:0 "Zafer ya da ölüm!"
 SEA_japan_foreign_policy.50.desc:0 "Ekonomilerimizi entegre etmek [FROM.GetAdjective] halkını tatmin etmeye yetmedi, çünkü [FROM.GetNameDef] lideri [FROM.GetLeader] bugün uluslarına tam entegrasyonumuzu talep etti. Onlardan hemen ayrılmazsak, bu bağımsız bir ulus olarak statümüzün sonu olacak. Bu konuda ne yapmalıyız?"
 SEA_japan_foreign_policy.50.t:0 "[FROM.GetNameDefCap] Tam Entegrasyon Talep Ediyor"
 SEA_japan_foreign_policy.51.a:0 "Harika!"
 SEA_japan_foreign_policy.51.desc:0 "[FROM.GetNameDef] liderliğinin ulusumuza entegre olmayı kabul ettiğine dair muhteşem haber, bugün erken saatlerde Ulusal Diyet'te büyük alkışlarla karşılandı. Sunabileceğimiz şeyler, egemenliklerinin sona ermesine rağmen teklifi avantajlı görmeleri için açıkça yeterliydi."
 SEA_japan_foreign_policy.51.t:0 "[FROM.GetNameDefCap] Tam Entegrasyonu Kabul Ediyor"
 SEA_japan_foreign_policy.52.a:0 "Onlar Asya'nın birliği için bir risk!"
 SEA_japan_foreign_policy.52.b:0 "Gözümüz üzerlerinde olacak..."
 SEA_japan_foreign_policy.52.desc:0 "Bariz avantajlara ve Asya'nın geleceği için açıkça en iyisi olmasına rağmen, [FROM.GetNameDef] tam entegrasyon için nazik talebimizi reddetti. Sebepleri hakkında sadece spekülasyon yapılabilir, ancak bölgenin çıkarlarını düşünmedikleri görülüyor."
 SEA_japan_foreign_policy.52.t:0 "[FROM.GetNameDefCap] Tam Entegrasyonu Reddediyor"
 SEA_japan_foreign_policy.53.a:0 "Tetikte olmalıyız!"
 SEA_japan_foreign_policy.53.desc:0 "[FROM.GetAdjective] emirleri doğrultusunda hareket ettiğinden şüphelenilen ajanlar sınırlarımız içinde görüldü, görünüşe göre soylularla temas kurmaya çalışıyorlar ve vatandaşlarımızı büyük Ortak Refah vaatleriyle cezbediyorlar. Görünüşe göre Moğolistan halkı için planları var."
 SEA_japan_foreign_policy.53.t:0 "Khan Khentii Uulyn Aymak'ta Yıkıcı Unsurlar Görüldü"
 SEA_japan_foreign_policy.54.a:0 "Siyasi muhalifleri silahlandırıyorlar!"
 SEA_japan_foreign_policy.54.desc:0 "Son zamanlarda, [FROM.GetNameDef] ülkesine ait silahların karaborsalarımızı doldurduğu, birçoğunun sınırlarımız içindeki muhaliflere ve yıkıcı unsurlara ulaştığı görülüyor. Görünüşe göre ya sadece bizi istikrarsızlaştırmayı ya da daha kötüsü hükümetimizi devirmeyi hedefliyor olabilirler!"
 SEA_japan_foreign_policy.54.t:0 "[FROM.GetAdjective] Silahları Karaborsaları Dolduruyor"
 SEA_japan_foreign_policy.55.a:0 "Artık ya hep ya hiç, en kötüsüne hazırlanın!"
 SEA_japan_foreign_policy.55.desc:0 "İç Moğolistan ordusuna ait güçlerin güney sınırımızda toplandığı görüldü. Görünüşe göre topraklarımıza bir saldırı için hazırlanıyor olabilirler, ancak kesin hedefleri belirsiz."
 SEA_japan_foreign_policy.55.t:0 "İç Moğolistan Saldırısı Söylentileri"
 SEA_japan_foreign_policy.56.a:0 "Artık ya hep ya hiç, en kötüsüne hazırlanın!"
 SEA_japan_foreign_policy.56.desc:0 "Bayan Tümen dışında ve doğu bölgelerimizin diğer kısımlarında Mançuryalı Gerillalar görüldü. Şu anda sıradan haydutlardan daha kötü değiller, ancak zamanla gerçek bir sorun haline gelecekler."
 SEA_japan_foreign_policy.56.t:0 "Doğuda Mançuryalı Gerillalar Görüldü"
 SEA_japan_foreign_policy.57.a:0 "Onlarla savaşamayız"
 SEA_japan_foreign_policy.57.b:0 "Devrimi korumalıyız!"
 SEA_japan_foreign_policy.57.desc:0 "Bugün erken saatlerde, [FROM.GetAdjective] hükümeti bize bir ültimatom sundu. Ulusumuzun yok edilmesini istemiyorsak onlara teslim olmamızı talep ediyorlar. Ancak bizim için ne hazırladıklarını biliyoruz ve belki de onlara direnmek bizim yararımıza olabilir?"
 SEA_japan_foreign_policy.57.t:0 "[FROM.GetAdjective] Teslimiyet Baskısı"
 SEA_japan_foreign_policy.58.a:0 "Harika"
 SEA_japan_foreign_policy.58.desc:0 "[FROM.GetAdjective] hakim devletimiz, eski Kuomintang kontrollü birçok eyaletin idaresini bize devretti ve bu toprakları devletimize düzgün bir şekilde entegre etmek için hazırlıklara başlamamızı istedi. Onları hayal kırıklığına uğratmayacağız!"
 SEA_japan_foreign_policy.58.t:0 "[FROM.GetNameDefCap] Çin Eyaletlerini Devrediyor"
 SEA_japan_foreign_policy.59.a:0 "Refah ufukta görünüyor!"
 SEA_japan_foreign_policy.59.desc:0 "Bugün erken saatlerde, [ROOT.GetLeader] ve çeşitli [JAP.GetAdjective] ordu liderleri ortak bir bildiriyle yeni bir [ROOT.GetAdjective] devletinin kurulduğunu ilan ettiler. Tüm düşmanlarımıza karşı muzaffer olacağız!"
 SEA_japan_foreign_policy.59.t:0 "Burma Devleti'nin İlanı"
 SEA_japan_foreign_policy.6.a:0 "Birlikleri saldırıya hazırlayın!"
 SEA_japan_foreign_policy.6.desc:0 "[FROM.GetLeader] mantıklı davranmayı reddediyor ve [FROM.GetNameDef] ülkesinin bizimle bir ittifaka katılmayacağını belirtti. Bilmedikleri şey, yaklaşan dünya çatışmasında tarafsız kalmalarına izin vermeye niyetimiz olmadığı..."
 SEA_japan_foreign_policy.6.t:0 "[FROM.GetNameDefCap] Bize Katılmayı Reddediyor"
 SEA_japan_foreign_policy.60.a:0 "Onlarla savaşın, tüm hainleri yok edin!"
 SEA_japan_foreign_policy.60.b:0 "Onlara katılmalıyız, refah ufukta görünüyor!"
 SEA_japan_foreign_policy.60.desc:0 "[JAP.GetLeader], bize ve mevcut gidişatımıza karşı olan yeni bir [ROOT.GetAdjective] devletinin kurulduğunu ilan etti. Görünüşe göre bizden bağımsızlıkları için savaşmaya hazırlar ve savaşmadan pes etmeyecekler!"
 SEA_japan_foreign_policy.60.t:0 "Japonya Burma Devleti'ni Kuruyor"
 SEA_japan_foreign_policy.61.a:0 "Tahmin edilebilirdi"
 SEA_japan_foreign_policy.61.b:0 "Belki de haklıdır..."
 SEA_japan_foreign_policy.61.desc:0 "Hain Wang Jingwei geçen hafta konutundan ayrılırken görüldü ve bilinmeyen bir yere gitti. Geriye dönüp bakıldığında, [ROOT.GetLeader] politikalarından duyduğu memnuniyetsizlik nedeniyle bu kaçınılmaz görünüyordu. Ancak özlenmeyecek."
 SEA_japan_foreign_policy.61.t:0 "Wang Jingwei'nin İhaneti"
 SEA_japan_foreign_policy.62.a:0 "Güçlü bir lider olacaktır"
 SEA_japan_foreign_policy.62.b:0 "Sun Dianying daha yetenekli"
 SEA_japan_foreign_policy.62.desc:0 "Kuomintang'ın eski yüksek rütbeli bir üyesi olan Wang Jingwei Şanghay'a geldi ve bizimle çalışmak istiyor. Konumu ve popülaritesi nedeniyle, hükümetimizde ona önemli bir pozisyon vermek akıllıca olabilir, çünkü bizi iyi yönetebilir."
 SEA_japan_foreign_policy.62.t:0 "Wang Jingwei Taraf Değiştiriyor"
 SEA_japan_foreign_policy.63.a:0 "[ROOT.GetLeader] iyi bir pozisyon kazanacak, bu yüzden kabul ediyoruz"
 SEA_japan_foreign_policy.63.b:0 "Bu özerkliğimizin sonu olurdu, hayır!"
 SEA_japan_foreign_policy.63.desc:0 "[JAP.GetLeader], hükümetimizi [RNG.GetNameDef] ile birleştirmemizi, bağımsızlığımızı sona erdirmemizi ve liderliğimize [RNG.GetAdjective] hükümeti içinde yüksek rütbeli pozisyonlar vermemizi talep etti. Bu teklifi kabul ediyor muyuz?"
 SEA_japan_foreign_policy.63.t:0 "[RNG.GetNameDef] ile Birleşme"
 SEA_japan_foreign_policy.64.a:0 "Neden kabul ettiklerini anlıyoruz"
 SEA_japan_foreign_policy.64.desc:0 "[FROM.GetNameDef] lideri [FROM.GetLeader], [JAP.GetAdjective] hükümetimizle birleşme teklifini kabul etti ve [FROM.GetAdjective] topraklarının tamamı artık bizim yetki alanımıza giriyor. Bu bizim için harika bir gün!"
 SEA_japan_foreign_policy.64.t:0 "[FROM.GetNameDefCap] Bizimle Birleşiyor"
 SEA_japan_foreign_policy.65.a:0 "Zamanı gelince kabul edecekler..."
 SEA_japan_foreign_policy.65.desc:0 "Sığ görüşlü [FROM.GetLeader] mantıklı olmayı reddetti ve [RNG.GetNameDef] ile birleşme teklifimizi reddetti. Belki daha iyi bir anlaşma ve hatta uygun bir dozda gözdağı gereklidir."
 SEA_japan_foreign_policy.65.t:0 "[FROM.GetNameDefCap] Birleşmeyi Reddediyor"
 SEA_japan_foreign_policy.66.a:0 "Refah ufukta görünüyor!"
 SEA_japan_foreign_policy.66.desc:0 "Bugün erken saatlerde, [ROOT.GetLeader] ve çeşitli [JAP.GetAdjective] ordu liderleri ortak bir bildiriyle yeni bir [ROOT.GetAdjective] devletinin kurulduğunu ilan ettiler. Tüm düşmanlarımıza karşı muzaffer olacağız!"
 SEA_japan_foreign_policy.66.t:0 "Özgür Hindistan Geçici Hükümetinin İlanı"
 SEA_japan_foreign_policy.67.a:0 "Onlarla savaşın, tüm hainleri yok edin!"
 SEA_japan_foreign_policy.67.b:0 "Onlara katılmalıyız, refah ufukta görünüyor!"
 SEA_japan_foreign_policy.67.desc:0 "[JAP.GetLeader], bize ve mevcut gidişatımıza karşı olan yeni bir [ROOT.GetAdjective] devletinin kurulduğunu ilan etti. Görünüşe göre bizden bağımsızlıkları için savaşmaya hazırlar ve savaşmadan pes etmeyecekler!"
 SEA_japan_foreign_policy.67.t:0 "Japonya Özgür Hindistan Geçici Hükümetini Kuruyor"
 SEA_japan_foreign_policy.68.a:0 "Refah ufukta görünüyor!"
 SEA_japan_foreign_policy.68.desc:0 "Bugün erken saatlerde, [ROOT.GetLeader] ve çeşitli [JAP.GetAdjective] ordu liderleri ortak bir bildiriyle yeni bir [ROOT.GetAdjective] devletinin kurulduğunu ilan ettiler. Tüm düşmanlarımıza karşı muzaffer olacağız!"
 SEA_japan_foreign_policy.68.t:0 "İkinci Filipin Cumhuriyeti'nin İlanı"
 SEA_japan_foreign_policy.69.a:0 "Onlarla savaşın, tüm hainleri yok edin!"
 SEA_japan_foreign_policy.69.b:0 "Onlara katılmalıyız, refah ufukta görünüyor!"
 SEA_japan_foreign_policy.69.desc:0 "[JAP.GetLeader], bize ve mevcut gidişatımıza karşı olan yeni bir [ROOT.GetAdjective] devletinin kurulduğunu ilan etti. Görünüşe göre bizden bağımsızlıkları için savaşmaya hazırlar ve savaşmadan pes etmeyecekler!"
 SEA_japan_foreign_policy.69.t:0 "Japonya İkinci Filipin Cumhuriyeti'ni Kuruyor"
 SEA_japan_foreign_policy.7.a:0 "Tekrar düşününce, şimdi boyun eğmeliyiz"
 SEA_japan_foreign_policy.7.b:0 "O zaman bırakın gelsinler!"
 SEA_japan_foreign_policy.7.desc:0 "Hayır cevabını kabul etmeyen [FROM.GetAdjective] birliklerinin, muhtemelen hızla içeri girip bize boyun eğdirmeyi ve bizi kendi etki alanlarına almayı amaçlayarak ülkemize hızlı bir işgal için hazırlandığı görüldü. Bu muhtemelen çatışmadan kaçınmak için son şansımız, ancak soru şu. Bunu kabul ediyor muyuz?"
 SEA_japan_foreign_policy.7.t:0 "[FROM.GetNameDefCap] Bir İşgale Hazırlanıyor"
 SEA_japan_foreign_policy.70.a:0 "Asla teslim olmayacağız!"
 SEA_japan_foreign_policy.70.b:0 "Bu sırtımızdan bir düşmanı eksiltecek"
 SEA_japan_foreign_policy.70.desc:0 "[FROM.GetAdjective] diplomatlar bize bir ültimatom vererek doğu sınırlarımızı yeniden çizmemizi ve onlarla şartlı bir barış imzalamamızı, esasen Asya meselelerini terk etmemizi talep ettiler. Bu bize çabalarımızı tamamen Avrupa topraklarımızı geri almaya odaklama ve belki de diğer tüm düşmanlarımız düştüğünde doğuyu geri almak için geri dönme yeteneği verecek."
 SEA_japan_foreign_policy.70.t:0 "Japonya Şartlı Teslimiyetimizi Talep Ediyor"
 SEA_japan_foreign_policy.71.a:0 "Kılıcımızla düşecekler!"
 SEA_japan_foreign_policy.71.desc:0 "Moskova'daki aptallar ilk taleplerimize teslim olmayı reddettiler. Bu, devletlerinin tamamen yok edilmesini ve başlangıçta planlanandan daha da fazla sınır ayarlamasını gerektiriyor!"
 SEA_japan_foreign_policy.71.t:0 "[FROM.GetNameDefCap] Teslimiyeti Reddediyor"
 SEA_japan_foreign_policy.72.a:0 "Bugünü kazandık!"
 SEA_japan_foreign_policy.72.desc:0 "[FROM.GetLeader] adına konuşan diplomatlar, kuyruklarını bacaklarının arasına kıstırarak taleplerimizi kabul ettiler ve Sibirya'daki varlıklarını bize teslim ediyorlar. Bugün İmparatorluk için harika bir gün!"
 SEA_japan_foreign_policy.72.t:0 "[FROM.GetNameDefCap] Doğuyu Teslim Ediyor"
 SEA_japan_foreign_policy.73.a:0 "Bizi terk ettiler..."
 SEA_japan_foreign_policy.73.b:0 "O zaman onların yerine Japonya'nın korumasını kazanmalıyız!"
 SEA_japan_foreign_policy.73.desc:0 "Müttefiklerimiz, [JAP.GetNameDef] taleplerine boyun eğerek Doğu Asya'dan çekildiler. Bu bizi çok savunmasız bir durumda bırakıyor. Yeni müttefikler mi arayacağız, yoksa [JAP.GetAdjective] ile savaşmaya devam mı edeceğiz?"
 SEA_japan_foreign_policy.73.t:0 "[SOV.GetNameDefCap] Sibirya'dan Çekiliyor"
 SEA_japan_foreign_policy.74.a:0 "Pekala"
 SEA_japan_foreign_policy.74.b:0 "Onlara ihtiyacımız yok"
 SEA_japan_foreign_policy.74.desc:0 "[FROM.GetName] eski müttefiklerinin bariz ihanetinden hayal kırıklığına uğrayan [FROM.GetNameDef] lideri [FROM.GetLeader], şimdi topraklarının ve halkının koruyucusu olarak yeni pozisyonu almamızı istemek için bize ulaştı. Lütfediyor muyuz?"
 SEA_japan_foreign_policy.74.t:0 "[FROM.GetNameDefCap] Korumamızı İstiyor"
 SEA_japan_foreign_policy.75.a:0 "Çok minnettarız!"
 SEA_japan_foreign_policy.75.desc:0 "Görünüşe göre [FROM.GetNameDef] içindeki bağlantılarımız, bağlantılarımızın çoğunun bulunduğu Kōdōha hizbinin yakın zamanda başarılı bir darbe ile hükümeti devralmasının ardından nihayet ulusun liderliğiyle bir anlaşma sağlamayı başardı. Yaşasın iki imparator!"
 SEA_japan_foreign_policy.75.t:0 "[FROM.GetAdjective] Teçhizatı Ulaşıyor"
 SEA_japan_foreign_policy.76.a:0 "Durumu kabul etmek zorunda kalacağız"
 SEA_japan_foreign_policy.76.b:0 "Kendilerini çok yüksek görüyorlar"
 SEA_japan_foreign_policy.76.desc:0 "[FROM.GetLeader], Kōdōha darbesinin ardından ilan edilen olağanüstü hal ve yönettiğimiz bölgelerde saklanan muhalif subayların olasılığı nedeniyle, ulusun entegre bir parçası olmamız gerektiğini ilan etti. Bu da [FROM.GetAdjective] devleti tarafından tam yönetime izin verecektir. Kabul ediyor muyuz?"
 SEA_japan_foreign_policy.76.t:0 "[FROM.GetNameDefCap] Tam Entegrasyon Talep Ediyor"
 SEA_japan_foreign_policy.77.a:0 "Harika!"
 SEA_japan_foreign_policy.77.desc:0 "[FROM.GetNameDef] valimiz [FROM.GetLeader], bugün erken saatlerde ulusumuza tam entegrasyonu kabul etti. Bu, hükümetimizin nihayet Kore bölgelerimizin yerel bölümleri üzerinde bile tam kontrole sahip olabileceği anlamına geliyor."
 SEA_japan_foreign_policy.77.t:0 "[FROM.GetNameDefCap] Tam Entegrasyonu Kabul Ediyor"
 SEA_japan_foreign_policy.78.a:0 "Yönetimde daha güvenilir birine ihtiyacımız var!"
 SEA_japan_foreign_policy.78.b:0 "Şimdilik isteklerine saygı duyacağız..."
 SEA_japan_foreign_policy.78.desc:0 "Bariz avantajlara ve ulusun geleceği için açıkça en iyisi olmasına rağmen, [FROM.GetNameDef] valisi [FROM.GetLeader] tam entegrasyon talebimizi reddetti. Sebepleri hakkında sadece spekülasyon yapılabilir, ancak ulusun en iyi çıkarlarını düşünmedikleri görülüyor."
 SEA_japan_foreign_policy.78.t:0 "[FROM.GetNameDefCap] Tam Entegrasyonu Reddediyor"
 SEA_japan_foreign_policy.79.a:0 "Evet, bu bize fayda sağlayacak"
 SEA_japan_foreign_policy.79.b:0 "Hayır! Mançurya'nın kaderi başka yerde yatıyor!"
 SEA_japan_foreign_policy.79.desc:0 "[FROM.GetLeader], her iki nüfusumuzun da iyiliği için olduğunu iddia ederek bize bir teklifle yaklaştı. Talep, ulusumuzun zamanı gelince [FROM.GetNameDef] ülkesinin entegre bir parçası olması, özerkliğimizin sona ermesi ve bizi krallıklarının temel bir parçası haline getirmesidir. Bu bize gerçekten fayda sağlıyor mu?"
 SEA_japan_foreign_policy.79.t:0 "[FROM.GetNameDefCap] Daha Yakın Entegrasyon İstiyor"
 SEA_japan_foreign_policy.8.a:0 "Ve düzen sağlandı"
 SEA_japan_foreign_policy.8.desc:0 "Nihayet, uzun istişarelerden sonra, [FROM.GetNameDef] heyeti kendilerine sunduğumuz revize edilmiş belgeleri imzalamaya karar verdi, askeri müdahaleden kaçındılar ancak bu süreçte bağımsızlıklarından vazgeçtiler. Şimdi, güneye saldırmaya tamamen hazırız!"
 SEA_japan_foreign_policy.8.t:0 "[FROM.GetNameDefCap] Taleplerimize Boyun Eğiyor"
 SEA_japan_foreign_policy.80.a:0 "Pekala"
 SEA_japan_foreign_policy.80.desc:0 "[FROM.GetNameDef] içindeki yönetici elit olan Concordia Derneği, teklifimizi kabul etti ve yakın gelecekte bölgeyi krallığımızın ayrılmaz bir parçası olarak yönetmeye hazır. Birleşme planlarımız sorunsuz ilerleyebilecek gibi görünüyor."
 SEA_japan_foreign_policy.80.t:0 "Concordia Derneği Kabul Ediyor"
 SEA_japan_foreign_policy.81.a:0 "Onlarla daha sonra ilgileneceğiz"
 SEA_japan_foreign_policy.81.b:0 "Eğer istekleri buysa..."
 SEA_japan_foreign_policy.81.desc:0 "[FROM.GetNameDef] içindeki yönetici elit olan Concordia Derneği, ulusumuza entegre olmaktan fayda sağlamadıklarını iddia ederek teklifimizi reddetmeye karar verdi. Belki de Mançuryalı muhalifler veya komünistler tarafından ikna edildiler, ancak ne yazık ki bu o kadar kolay geri alabileceğimiz bir karar değil..."
 SEA_japan_foreign_policy.81.t:0 "Concordia Derneği Bize Karşı Çıkıyor"
 SEA_japan_foreign_policy.82.a:0 "[FROM.GetAdjective] dostlarımız için her şey!"
 SEA_japan_foreign_policy.82.b:0 "Bu bizi çok büyük bir tehlikeye atar"
 SEA_japan_foreign_policy.82.desc:0 "Uzak doğudaki [FROM.GetName] ulusundaki tarihi dostlarımız bize cazip bir teklifle yaklaştılar. Tarihsel bağlarımız ve [SOV.GetAdjective] devletine karşı karşılıklı güvensizliğimiz nedeniyle, birimiz [SOV.GetNameDef] ile savaşa girerse diğerinin de gireceğini belirten bir askeri pakt teklif ettiler. Bu kesinlikle kaçırılmayacak kadar iyi bir fırsat değil mi?"
 SEA_japan_foreign_policy.82.t:0 "[FROM.GetNameDefCap] Sovyet Karşıtı İşbirliği Arıyor"
 SEA_japan_foreign_policy.83.a:0 "Mükemmel!"
 SEA_japan_foreign_policy.83.desc:0 "[FROM.GetNameDef] içindeki büyük dostlarımız, karşılıklı bir anti-[SOV.GetAdjective] paktı kurma teklifimizi nezaketle kabul ettiler. Delegeler şu anda anlaşmayı gerçeğe dönüştürmek için gerekli belgeleri imzalıyorlar ve gerekirse [SOV.GetNameDef] ülkesine hızlı bir işgal için hazırlıklar da sürüyor."
 SEA_japan_foreign_policy.83.t:0 "[FROM.GetLeader] Paktı İmzalıyor"
 SEA_japan_foreign_policy.84.a:0 "Belki ikinci bir izolasyon bize fayda sağlar..."
 SEA_japan_foreign_policy.84.desc:0 "Ne yazık ki, iki ulusumuz arasındaki ilişkileri geliştirmeye yönelik tarihi çabalarımıza rağmen, [FROM.GetLeader] karşılıklı anti-[SOV.GetAdjective] paktı teklifimizi geri çevirdi. Paktın [SOV.GetAdjective] ajanları tarafından keşfedilmesi durumunda [FROM.GetAdjective] ulusu için çok tehlikeli olduğu belirtiliyor."
 SEA_japan_foreign_policy.84.t:0 "[FROM.GetLeader] Paktı Reddediyor"
 SEA_japan_foreign_policy.85.a:0 "Öngörümüz karşılığını veriyor."
 SEA_japan_foreign_policy.85.d:0 "Sovyet Karşıtı Paktı imzaladığımızda şüphelendiğimiz gibi, şimdi kendimizi Sovyetler Birliği ile savaş halinde buluyoruz. Ortak imzacıların sözlerini tutma ve bize katılma zamanı geldi."
 SEA_japan_foreign_policy.85.t:0 "Pakt Üyelerini Savaşa Çağır"
 SEA_japan_foreign_policy.86.a:0 "[From.GetNameDefCap] yalnız değil!"
 SEA_japan_foreign_policy.86.b:0 "Bu bizim savaşımız değil."
 SEA_japan_foreign_policy.86.b_tt:0 "§YBu, paktı onurlandıran tüm ülkeler tarafından bir ihanet olarak görülecektir (Görüş §!§R-50§!§Y)§!"
 SEA_japan_foreign_policy.86.desc:0 "Polonya-Japon Anti-Sovyet Paktı, tüm imzacıların Sovyetler Birliği ile herhangi bir savunma çatışmasına katılmasını şart koşuyor. [From.GetName] şimdi Sovyetler tarafından saldırıya uğradı ve tüm pakt üyelerinin derhal yardıma gelmesi için bir talep gönderdi. Dünyayı Sovyetler Birliği tehdidinden kesin olarak korumaya yönelik [Root.GetAdjective] bağlılığını gösterme zamanı geldi."
 SEA_japan_foreign_policy.86.t:0 "[From.GetNameDefCap] Pakt Üyelerini Savaşa Çağırıyor"
 SEA_japan_foreign_policy.87.a:0 "İmzaladığımız şey bu"
 SEA_japan_foreign_policy.87.desc:0 "Concordia Derneği kısa süre önce Kōdōha taleplerini kabul ettikten sonra, bunun olması sadece an meselesiydi. Bugün, bir [FROM.GetAdjective] heyeti, uluslarına tam entegrasyonumuzu kolaylaştıracak belgelerle geldi, bu belgeler kendi delegelerimiz tarafından zaten imzalanmıştı."
 SEA_japan_foreign_policy.87.t:0 "[FROM.GetAdjective] İlhakı"
 SEA_japan_foreign_policy.88.a:0 "Harika"
 SEA_japan_foreign_policy.88.desc:0 "[FROM.GetNameDef] lideri [FROM.GetLeader], bugün erken saatlerde ulusumuza tam entegrasyonu kabul etti. Bu, hükümetimizin nihayet Mançurya bölgelerimizin yerel bölümleri üzerinde bile tam kontrole sahip olabileceği anlamına geliyor."
 SEA_japan_foreign_policy.88.t:0 "[FROM.GetNameDef] İlhakı"
 SEA_japan_foreign_policy.89.a:0 "Neden olmasın?"
 SEA_japan_foreign_policy.89.b:0 "Bu iyi bir zaman değil"
 SEA_japan_foreign_policy.89.desc:0 "[FROM.GetNameDef] tarafından bir teklif aldık. Sanayi kapasitelerinin bir kısmı karşılığında uzun vadeli bir kaynak ticaretiyle ilgileniyorlar. Şu anda gözleri [FROM.FROM.GetName] içindeki bir dizi kaynakta."
 SEA_japan_foreign_policy.89.t:0 "[FROM.GetAdjective] Kaynak Karşılığında Sanayi Teklif Ediyor"
 SEA_japan_foreign_policy.9.a:0 "Tennoheika Banzai!"
 SEA_japan_foreign_policy.9.desc:0 "[FROM.GetLeader] kişisine lütfedip sunduğumuz son şans reddedildi ve birliklerimiz artık büyük şehirlerini hızla işgal etmeye hazır. Onlara [ROOT.GetAdjective] ulusunun neyden yapıldığını gösterme zamanı geldi!"
 SEA_japan_foreign_policy.9.t:0 "[FROM.GetLeader] Boyun Eğmeyi Reddediyor"
 SEA_japan_foreign_policy.90.a:0 "Harika"
 SEA_japan_foreign_policy.90.desc:0 "Kaynakları karşılığında sanayi ticareti talebimiz hakkında [FROM.GetAdjective] tarafından haber aldık. Görünüşe göre bu anlaşmanın faydaları konusunda hemfikiriz ve şartları mutlulukla kabul ettiler. Kaynakları kısa süre içinde alacağız."
 SEA_japan_foreign_policy.90.t:0 "[FROM.GetAdjective] Sanayi Ticareti Anlaşması"
 SEA_japan_foreign_policy.91.a:0 "İlk seferde başaramazsan..."
 SEA_japan_foreign_policy.91.desc:0 "Önerilen anlaşmamız hakkında çoğunlukla tarafsız olsalar da, [FROM.GetAdjective] sonuçta kaynaklar karşılığında onlara sanayi ticareti teklifimizi reddetmeyi seçtiler. Bunun iyi bir zaman olmadığını iddia ediyorlar, bu da ilişkimizi daha da güçlendirdikten sonra gelecekte belki bir anlaşmaya varabileceğimizi gösteriyor."
 SEA_japan_foreign_policy.91.t:0 "[FROM.GetAdjective] Sanayi Ticaret Anlaşmasını Reddediyor"
 SEA_japan_foreign_policy.92.a:0 "Bağlar ticaret yoluyla güçlendirilebilir"
 SEA_japan_foreign_policy.92.b:0 "Anlaşmalara gerek görmüyoruz..."
 SEA_japan_foreign_policy.92.c:0 "Onlarla uygun bir savunma anlaşması kurmalıyız"
 SEA_japan_foreign_policy.92.d:0 "Önerilen tüm anlaşmaları imzalamalıyız!"
 SEA_japan_foreign_policy.92.desc:0 "[FROM.GetNameDef] ülkesine ait diplomatlar, ülkelerindeki askeri hizipler tarafından kısıtlanan bağlarımızın güçlendirilmesi konusunda bize yaklaştılar, bu hizipler şimdi halledildi. Hem ticaret, hem araştırma hem de savunma anlaşmaları istiyorlar. Bunlardan birini imzalayabiliriz ya da hepsini kabul edebiliriz. Buraya gelmek için harcadıkları onca çabadan sonra onları tamamen reddetmek iyi bir fikir gibi görünmüyor."
 SEA_japan_foreign_policy.92.t:0 "[FROM.GetAdjective] Daha Yakın Bağlar İstiyor"
 SEA_japan_foreign_policy.93.a:0 "Mükemmel!"
 SEA_japan_foreign_policy.93.desc:0 "[FROM.GetNameDef] ülkesinin lütufkar lideri [FROM.GetLeader], tekliflerimizden birini kabul ederek ulusumuzla daha yakın ticaret ve araştırma bağlantıları kurmayı kabul etti. Bu [ROOT.GetNameDef] ve diplomatik başarıları için harika bir gün!"
 SEA_japan_foreign_policy.93.t:0 "[FROM.GetLeader] Bir İşbirliği Anlaşması İmzalıyor"
 SEA_japan_foreign_policy.94.a:0 "Korkunç"
 SEA_japan_foreign_policy.94.desc:0 "[FROM.GetNameDef] ülkesinin iki yüzlü lideri [FROM.GetLeader], tüm tekliflerimizi reddederek uluslarımız arasında daha yakın bağlantılar fikrini kapattı. Bu [ROOT.GetNameDef] ve diplomatik başarıları için karanlık bir gün..."
 SEA_japan_foreign_policy.94.t:0 "[FROM.GetLeader] Hiçbir Anlaşma İmzalamıyor"
 SEA_japan_foreign_policy.95.a:0 "Mükemmel!"
 SEA_japan_foreign_policy.95.desc:0 "[FROM.GetNameDef] ülkesinin lütufkar lideri [FROM.GetLeader], tekliflerimizden birini kabul ederek ulusumuzla bir savunma paktı kurmayı, her ikimizin de saldırıya uğraması durumunda diğerinin yardımına gelmeyi vaat etmeyi kabul etti. Bu [ROOT.GetNameDef] ve diplomatik başarıları için harika bir gün!"
 SEA_japan_foreign_policy.95.t:0 "[FROM.GetLeader] Bir Savunma Anlaşması İmzalıyor"
 SEA_japan_foreign_policy.96.a:0 "Mükemmel!"
 SEA_japan_foreign_policy.96.desc:0 "[FROM.GetNameDef] ülkesinin lütufkar lideri [FROM.GetLeader], tüm tekliflerimizi kabul ederek daha yakın ticaret, araştırma ve geliştirme bağlantıları kurmayı ve ayrıca ulusumuzla bir savunma paktı kurmayı, her ikimizin de saldırıya uğraması durumunda diğerinin yardımına gelmeyi vaat etmeyi kabul etti. Bu [ROOT.GetNameDef] ve diplomatik başarıları için harika bir gün!"
 SEA_japan_foreign_policy.96.t:0 "[FROM.GetLeader] Kapsamlı Bir Diplomatik Anlaşma İmzalıyor"
 SEA_japan_foreign_policy.97.a:0 "Bunda bir sorun görmüyoruz"
 SEA_japan_foreign_policy.97.b:0 "Kağıtlarınızı Tokyo'ya geri götürebilirsiniz!"
 SEA_japan_foreign_policy.97.desc:0 "[FROM.GetNameDef] lideri [FROM.GetLeader], [FROM.GetAdjective] ulusuyla karmaşık ticaret ilişkileri olasılığını görüşmek üzere başkentimize diplomatlar gönderdi. Bu ilişkimizi daha da yakınlaştırır, ancak kaynaklarımıza daha ucuza erişmelerine izin verir, bu da ekonomimize zarar verme riski taşır."
 SEA_japan_foreign_policy.97.t:0 "[FROM.GetNameDefCap] Ticaret Anlaşmaları Talep Ediyor"
 SEA_japan_foreign_policy.98.a:0 "Harika"
 SEA_japan_foreign_policy.98.desc:0 "[FROM.GetNameDef] lideri [FROM.GetLeader], uluslarımız arasında daha ucuz ticaret teklifimize olumlu yanıt verdi ve bunun derhal yürürlüğe girmesini kolaylaştırmak için gerekli evrakları imzaladı. Tüm Asya için parlak bir gelecek vizyonumuzu paylaşıyorlar!"
 SEA_japan_foreign_policy.98.t:0 "[FROM.GetNameDefCap] Ticaret Teklifini Kabul Ediyor"
 SEA_japan_foreign_policy.99.a:0 "Ne kadar acınası!"
 SEA_japan_foreign_policy.99.desc:0 "[FROM.GetNameDef] lideri [FROM.GetLeader], ittifakımız içinde daha ucuz ticaret talebimize sert bir şekilde yanıt verdi ve böyle bir konuyu zorlamaya çalışırsak gümrük vergileri koymakla tehdit etti. Görünüşe göre [FROM.GetNameDef] aklımızdaki parlak geleceğin bir parçası olmayacak."
 SEA_japan_foreign_policy.99.t:0 "[FROM.GetNameDefCap] Ticaret Teklifini Reddediyor"
 SEA_japan_news_events.01.a:0 "Taishō döneminin yollarına geri dönmeliyiz!"
 SEA_japan_news_events.01.b:0 "Görünüşe göre birileri sonunda omurga sahibi oldu"
 SEA_japan_news_events.01.desc:0 "\n[JAP.GetLeader] tarafından yapılan tutkulu bir konuşmada, ordudaki Kōdōha hizbinin son darbe girişiminin ardından ordunun bu sefer çok ileri gittiğini haykırıyor. Ayrıca 'sayısız suikast ve uç unsurlar tarafından hükümetimizin devrilmeye çalışılması yetmezmiş gibi, şimdi de son olayı kendi güçlerini güçlendirmek ve ulusumuzun kontrolünü halkından almak için kullanmaya çalışıyorlar. Bunun devam etmesine izin verilemez!' diyor. \n\nGörünüşe göre [JAP.GetNameDef] içinde çatışma mayalanıyor."
 SEA_japan_news_events.01.t:0 "[JAP.GetLeader] Askeri Müdahaleye Karşı Konuşuyor"
 SEA_japan_news_events.02.a:0 "Tüm Asya'ya refah getireceğiz!"
 SEA_japan_news_events.02.b:0 "Propaganda makinesinden bir başka hile"
 SEA_japan_news_events.02.desc:0 "\nÜye devletler arasında ekonomik kendi kendine yeterliliğin ve işbirliğinin sağlanması, Batı emperyalizminin ve Sovyet komünizminin etkisine direnme hedefleriyle, [JAP.GetLeader] bugün Dai Tōa Kyōeiken'in kuruluşunu duyurdu. Bunun gerçekten birliğin amacı mı yoksa [JAP.GetAdjective] propaganda makinesinin bir başka dikkatli hilesi mi olduğu hala herkesin aklının en üstünde."
 SEA_japan_news_events.02.t:0 "Büyük Doğu Asya Ortak Refah Alanı'nın Oluşumu"
 SEA_japan_news_events.03.a:0 "Emperyalizme karşı bir zafer daha!"
 SEA_japan_news_events.03.d:0 "Japon taarruzları Burma'da devam ediyor ve Rangoon'un düşüşü yakın zamanda gerçekleşti. İngiliz Burması'nın başkenti olarak bu şehir muazzam bir stratejik öneme sahip ve kaybı devam eden Burma harekatında belirleyici bir faktör olabilir.\n\nSömürge Valisi'nin kendisinin, eşyalarının Vali Konağı'ndan bir kamyon konvoyuna transferini denetlerken Japon ileri birimleri tarafından yakalandığı bildirildi, ancak bu henüz doğrulanmadı."
 SEA_japan_news_events.03.t:0 "Rangoon'un Düşüşü"
 SEA_japan_popup_events.1.a:0 "Bu fırsat kokuyor!"
 SEA_japan_popup_events.1.b:0 "Bu yabancının doğru söylediğine güvenemeyiz"
 SEA_japan_popup_events.1.desc:0 "Ajanlarımız, Mançurya sınırındaki Posyet'te kendisine Genrikh Samoilovich Lyushkov diyen bir [SOV.GetAdjective] sığınmacıyı ele geçirdi. NKVD'nin yüksek rütbeli bir subayı gibi görünüyor ve görünüşe göre bölgedeki [SOV.GetAdjective] askeri gücü hakkında değerli gizli belgelere sahip. Büyük Temizlik'ten kaçtığını iddia ediyor, belki de bu [SOV.GetNameDef] iç işleyişine dair fikir edinmek için değerli bir fırsattır?"
 SEA_japan_popup_events.1.t:0 "Genrikh Lyushkov Mançurya'ya Geldi"
 SEA_japan_popup_events.10.a:0 "Ne kadar onursuzca! Hızlı hareket etmeliyiz!"
 SEA_japan_popup_events.10.desc:0 "Son zamanlarda, ordu içindeki radikal gelenekçi bir hizip olan Kōdōha hizbi tarafından planlanan olası bir darbe söylentileri dolaşıyor. Yarbay Saburō Aizawa'nın örgütlerinin ayrılmaz bir parçası olması nedeniyle duruşması bitene kadar bekleyecekleri muhtemel görünüyor. Olası güdülerini bildiğimizden, bu darbe sırasında değerlerine tehdit olarak gördükleri birçok kişiye suikast düzenlemeye çalışmaları muhtemel görünüyor. Yakın gelecekte bir kan banyosu görmemek için hızlı hareket etmemiz gerekebilir."
 SEA_japan_popup_events.10.t:0 "Askeri Darbe Söylentileri"
 SEA_japan_popup_events.11.a:0 "Emirler verilecek ama kanıt bırakmamaya çalışın"
 SEA_japan_popup_events.11.b:0 "Hayır, eski İmparator yaşamalı!"
 SEA_japan_popup_events.11.desc:0 "Hükümetimizi kuralı uzun zaman olmasına rağmen İmparator hala ev hapsindeyken, muhalefet her zamankinden daha hızlı büyüyor. Görünüşe göre halkımız Hirohito'nun tahta düzgün bir şekilde geri döndüğünü görmek istiyor ve yakında durumla ilgili bir şey yapmazsak onu serbest bırakmak için harekete geçmeye hazırlanıyor olabilirler. Belki de tahta geri döndürülebilecek böyle bir figür olmasaydı biraz sakinleşirlerdi, bunu gerçekleştirmemiz ne kadar popüler olmasa da. Buna nasıl yaklaşmalıyız?"
 SEA_japan_popup_events.11.t:0 "Halk Ayaklanması Söylentileri"
 SEA_japan_popup_events.12.a:0 "Ulus yas tutuyor"
 SEA_japan_popup_events.12.b:0 "Failleri bulun, Nagako cevap istiyor!"
 SEA_japan_popup_events.12.desc:0 "Başbakan bugün erken saatlerde eski İmparator Shōwa'nın imparatorluk konutunda ölü bulunduğunu duyurdu. Birçoğu bunun ordunun gücünü güvence altına almak için kasıtlı bir hamle olabileceğinden şüpheleniyor, ancak resmi iddia doğal nedenlerden öldüğü yönünde olsa da Tokyo polisinin ölüm nedenini doğrulamak için içeri girmesine izin verilmedi. Bu kesinlikle ordunun kendisi tarafından yapılan bir vatana ihanet değil mi?"
 SEA_japan_popup_events.12.t:0 "İmparator Konutunda Ölü Bulundu"
 SEA_japan_popup_events.13.a:0 "Sıkıyönetim ilan et, Nagako ulusun istikrarsızlığını çözecek!"
 SEA_japan_popup_events.13.desc:0 "Merhum İmparator Shōwa'nın eşi Nagako'nun emriyle Tokyo Metropolitan Polisi tarafından yapılan son soruşturmalar sayesinde, Kōdōha hizbinin eski İmparator'un soğukkanlılıkla öldürülmesinden gerçekten sorumlu olduğu keşfedildi. Bunu vatana ihanet ilan etmek için fazlasıyla gerekçemiz varken, bu hain kliğin iktidardan indirilmesinin zamanı geldi."
 SEA_japan_popup_events.13.t:0 "Kōdōha Subayları Hirohito'nun Cinayetiyle Suçlandı"
 SEA_japan_popup_events.14.a:0 "Machida Chūji, Rikken Minseitō'yu iyi yönetsin"
 SEA_japan_popup_events.14.desc:0 "Tehlikeli zamanlara rağmen, genel seçimler sonuçlandı ve halkımız Temsilciler Meclisi'nde kendilerini kimin temsil edeceğine karar verdi. Machida Chūji liderliğindeki Rikken Minseitō seçimden en büyük parti olarak çıktı, Rikken Seiyūkai ise çoğunluğunu kaybetti. Sivil hükümetin son zamanlarda düşen yetkileri nedeniyle büyük bir önem taşımasa da, bu seçim demokrasimizin, ne kadar kırılgan olsa da, hala ayakta olduğunu gösteriyor."
 SEA_japan_popup_events.14.t:0 "1936 Genel Seçimlerinin Sonucu"
 SEA_japan_popup_events.15.a:0 "Durdurulmalılar!"
 SEA_japan_popup_events.15.desc:0 "Bu sabah erken saatlerde, Başbakan Keisuke Okada, Tokyo İstasyonu'nda Yamanote Hattı'nı beklerken Tokkō gizli polis memurları tarafından vurularak öldürüldü. Hemen ardından ordu, İmparatorluk Diyetine bir tehdit yayınlayarak onları dışlama girişiminin güçle karşılanacağını belirtti. Bu durumun açık bir tırmanışıdır ve geçici Başbakan Machida Chūji, durumu kabul etmesi ve bir açıklama yapması için İmparator'a başvurdu. Hangi tarafı tutacağını sadece zaman gösterecek."
 SEA_japan_popup_events.15.t:0 "Okada Tokyo İstasyonunda Öldürüldü"
 SEA_japan_popup_events.16.a:0 "Liberal Machida Chūji"
 SEA_japan_popup_events.16.b:0 "Sosyalist Abe Isoo"
 SEA_japan_popup_events.16.c:0 "Akranlar Meclisi Başkanı Tokugawa Iesato"
 SEA_japan_popup_events.16.desc:0 "Geçici Başbakan Machida Chūji'nin son ricalarına yanıt olarak İmparator Hirohito, devam eden hizipler arası çatışmanın kışkırttığı şiddete karşı konuştu ve bu zorlu zamanlarda görevi üstlenip yeni Başbakan olması için kimi aday göstereceğine karar verdi. Aday gösterdiği kişi..."
 SEA_japan_popup_events.16.t:0 "İmparator Yeni Bir Başbakan Aday Gösteriyor"
 SEA_japan_popup_events.17.a:0 "İşler kızışıyor..."
 SEA_japan_popup_events.17.desc:0 "Hem Japon İmparatorluk Ordusu hem de Japon İmparatorluk Donanması içindeki birçok yüksek rütbeli yetkili, hükümetimizin siyasetimiz üzerindeki etkilerine son verme beyanının ardından ordunun greve gideceğini ilan etti. Bir saldırı durumunda mevcut hükümeti savunmayacaklarını söylüyorlar ve muhtemelen Başbakanımızı iktidardan indirmek için başka bir darbe planlıyorlar."
 SEA_japan_popup_events.17.t:0 "Ordu Grev İlan Ediyor"
 SEA_japan_popup_events.18.a:0 "Metropolitan Polisini derhal Tokyo'ya konuşlandırın!"
 SEA_japan_popup_events.18.b:0 "Sanayi Kuşağı'nın kontrolünü ele geçirmediklerinden emin olmalıyız!"
 SEA_japan_popup_events.18.desc:0 "Sivil polis güçlerinin yakın zamanda diyete sadakat ilan etmesinin ardından Ordu, hükümete sadık güçlere karşı çatışmalara hazırlanmaya başladı. Görünüşe göre bir iç savaş çıkması durumunda bölgelerin kontrolünü güvence altına almaya çalışıyorlar. Bu isyan eylemine karşı koymaya en kısa sürede başlamalıyız!"
 SEA_japan_popup_events.18.t:0 "Ordu Kendini Mevziliyor"
 SEA_japan_popup_events.19.a:0 "Taleplerine boyun eğmemeliyiz!"
 SEA_japan_popup_events.19.b:0 "Halkımız haddini aştı, geri çekilin!"
 SEA_japan_popup_events.19.desc:0 "Şanghay'da başka bir Japon subayının öldürülmesinden sonra, bölgeden tamamen çekilmezsek bir hafta içinde saldıracaklarını belirten bir ültimatom aldık. \n\nNasıl yanıt vermeliyiz?"
 SEA_japan_popup_events.19.t:0 "Hongkou Ültimatomu"
 SEA_japan_popup_events.2.a:0 "Sürmesi için yapılmamıştı"
 SEA_japan_popup_events.2.b:0 "Bunu ne pahasına olursa olsun sürdürmeliyiz!"
 SEA_japan_popup_events.2.desc:0 "Dōshikai liderliği arasındaki son iç anlaşmazlıklardan sonra, örgütün çökmek üzere olduğu görülüyor. Kishi ve müttefiklerinin Tōjō'ya karşı bariz saygısızlığını ve ayrıca etrafta dolaşan olası suikast planlarına dair çok sayıda söylentiyi gerekçe gösterenler ile hava büyük bir huzursuzluk içeriyor. Kishi'nin imparatorun ve IJA'nın iradesine aykırı olacak teknokratik bir diktatörlük planladığına dair söylentilerden bahsetmiyorum bile. Bu eşleşmeyi bırakmak mı en iyisi, yoksa kaçırılmayacak kadar değerli mi?"
 SEA_japan_popup_events.2.t:0 "Savunma Kardeşliği Çöküşün Eşiğinde!"
 SEA_japan_popup_events.20.a:0 "Bunun bedelini ödeyecekler!"
 SEA_japan_popup_events.20.desc:0 "Çinli yetkililer, Çin'e yönelik 'haksız saldırganlıklarımız' konusunda 'kırılma noktasına' gelindiğini iddia ediyor! Tazminat taleplerimiz reddedildi ve Şanghay'da daha fazla Japon vatandaşının saldırıya uğradığına dair raporlar var. Çinlilerle kararlı bir şekilde başa çıkmak için bir bahaneye ihtiyacımız varsa, o da budur!"
 SEA_japan_popup_events.20.t:0 "[FROM.GetLeader] Hongkou Ültimatomunu Reddediyor"
 SEA_japan_popup_events.21.a:0 "Savaş beklemek zorunda kalacak."
 SEA_japan_popup_events.21.desc:0 "Şaşırtıcı bir şekilde Çinliler, Şanghay'ın kontrolü için gönderilen ültimatomun ardından geri adım atmayı seçtiler. Bizi kızdırmanın bedelinin ağır olduğunu anladılar ve şehrin kendisi ve çevresindeki bölgeler de dahil olmak üzere kapsamlı toprak tavizlerini kabul ettiler. Çin yavaş yavaş bizim oluyor."
 SEA_japan_popup_events.21.t:0 "[FROM.GetLeader] Hongkou Ültimatomunu İmzalıyor"
 SEA_japan_popup_events.22.a:0 "Taishō Dönemi ruhunu geri getirme zamanı geldi!"
 SEA_japan_popup_events.22.desc:0 "Tartışmalı Barışı Koruma Yasası'nın iptal edildiği haberini duyduktan sonra, Osaka Kalesi'ndeki karargahlarında bulunan ordu garnizonu, parkın dışına konuşlanmış hükümete sadık garnizonlara ateş açtı. Görünüşe göre savaşmadan geri adım atmayacaklar ve hegemonyalarını korumak anlamına geliyorsa ulusumuzun ruhunda bir yarık açmaya hazırlar. Onları devirmeliyiz!"
 SEA_japan_popup_events.22.t:0 "Osaka Kalesi Kuşatması"
 SEA_japan_popup_events.23.a:0 "Pekala, Nobuhito onun yerini alacak"
 SEA_japan_popup_events.23.desc:0 "İmparator Hirohito'nun meşruiyeti, siyaset üzerindeki artan askeri hakimiyete karşı kayıtsızlığı ve ülkedeki hizipler arasında şiddet arttığında harekete geçmemesi nedeniyle sorgulanır hale geldi. Şimdi birçok kişi, sivil hükümetin açık sözlü bir destekçisi olan küçük kardeşlerinden biri olan Nobuhito'nun İmparator unvanını alması çağrısında bulunuyor, çünkü ağabeylerinin ikisi de vatana ihanet eylemlerinde bulundu. Bu, mevcut hükümetimiz için kraliyet desteğini koruyabilecek ve halkımızın moralini yükseltebilecektir."
 SEA_japan_popup_events.23.t:0 "Kayıtsız İmparator"
 SEA_japan_popup_events.24.a:0 "Geleceğimizi geri kazandık!"
 SEA_japan_popup_events.24.desc:0 "Ana Adalar'daki İmparatorluk Ordusu'nun son kalıntıları beyaz bayrağı salladı ve ulusumuzun hükümeti ile kendi ordusu arasında yıllardır süren çatışmanın sona erdiğini işaret etti. Çatışmalar nedeniyle ulusun büyük bir kısmı hasar gördü, ancak bu [ROOT.GetAdjective] halkı için yeni bir başlangıcı işaret ediyor. Denizaşırı ülkelerde düşmanımız hala varlığını sürdürüyor ancak şu anda yeniden inşa zamanı. Hükümet, yozlaşmış unsurların artık müdahale edemeyeceği ilk genel seçimi düzenlemek için planlar yaptı bile."
 SEA_japan_popup_events.24.t:0 "İmparatorluk Ordusu Teslim Oluyor"
 SEA_japan_popup_events.25.a:0 "Rikken Minseitō kazandı!"
 SEA_japan_popup_events.25.b:0 "Rikken Seiyūkai kazandı!"
 SEA_japan_popup_events.25.desc:0 "Ordunun siyasetimizden uzaklaştırılmasından sonraki ilk seçim şimdi yapılıyor ve insanlar oylarını ulusun geleceğini yönlendirmek için kullanıyorlar. Seçim şu anda liberal Rikken Minseitō partisi ile her ikisi de yakın zamanda İmparatorluk Diyetine liderlik etmiş olan daha muhafazakar Rikken Seiyūkai arasında duruyor. Oylar veriliyor ve yakında bir kazanan belirlenecek."
 SEA_japan_popup_events.25.t:0 "Genel Seçim"
 SEA_japan_popup_events.26.a:0 "Onlara direnmenin bir faydası yok"
 SEA_japan_popup_events.26.b:0 "Bu Japon boyunduruğunu kırma zamanı!"
 SEA_japan_popup_events.26.desc:0 "Japonya'da ordu ve hükümet arasında süregelen iç savaşla birlikte, ülkemizde konuşlanmış Kwantung Ordusu, Mançurya'da kendi feodal savaş lordu devletlerini güvence altına alma umuduyla kendi hükümetimize karşı askeri bir darbe gerçekleştirme fırsatını değerlendirdi. Buna izin mi vermeliyiz, yoksa elimizdeki her şeyle onlara direnmeli miyiz?"
 SEA_japan_popup_events.26.t:0 "Kwantung Ordusu'nun Darbesi"
 SEA_japan_popup_events.27.a:0 "İşgalcileri denize dökün!"
 SEA_japan_popup_events.27.desc:0 "Japonya'da ordu ve hükümet arasında süregelen iç savaşla birlikte, Kore halkı bunun ülkelerinin kontrolünü geri kazanmak ve Japon zalimlerini kovmak için bir an olduğunu fark etti. Kore Yarımadası bir kez daha kendi halkının yönetimi altında gelişecek."
 SEA_japan_popup_events.27.t:0 "Altın Fırsat"
 SEA_japan_popup_events.28.a:0 "Hokkaido mükemmel"
 SEA_japan_popup_events.28.b:0 "Shikoku yeterince uzak"
 SEA_japan_popup_events.28.c:0 "Kagoshima'da bir şube kurun"
 SEA_japan_popup_events.28.desc:0 "Komünist parti, hem İmparatorluk Ordusu'nun hem de hükümetin gözünden ve zihninden uzakta, yeraltı operasyonlarına başlamaya karar verdi. Şimdi akıllarına gelen tek soru şu: Hangi bölge, keşfedilme ve kökünün kazınma olasılığının mümkün olduğunca düşük olacağı kadar uzak olurdu?"
 SEA_japan_popup_events.28.t:0 "Kırsal Bir Operasyon Üssü"
 SEA_japan_popup_events.29.a:0 "Devrim sonunda başladı!"
 SEA_japan_popup_events.29.desc:0 "Bu sabah erken saatlerde, İmparatorluk Ordusu'na ait güçler, Miyazaki'nin eteklerinde komünist devrimcilerin bulunduğu bir depoyu işgal ederek onları tutuklamaya çalıştı. Kyūichi Tokuda, yerel komünist gerillalar tarafından Abashiri hapishanesinden kurtarıldı ve Miyazaki deposunda çıkan çatışmanın ardından Tokuda tarafından bir radyo yayınında devrimin en kısa sürede başlatılması emri verildi. Görünüşe göre eylem zamanı geldi."
 SEA_japan_popup_events.29.t:0 "Miyazaki Olayı"
 SEA_japan_popup_events.3.a:0 "Bu bir felaket!"
 SEA_japan_popup_events.3.desc:0 "Bugün erken saatlerde İmparatorluk Diyeti Temsilciler Meclisi'nin genel kurul oturumunda, Rikken Seiyukai Partisi üyesi Hamada Kunimatsu, ordu bakanı Hisaichi Terauchi'ye ve askeri hiziplerin artan gücüne sert bir eleştiri yöneltti. Bakan tarafından ordunun otoritesine saygısızlık ettiği ve sözde onuruna hakaret ettiği gerekçesiyle yüzleşildiğinde, 'Tutanakları kontrol edin ve orduya hakaret eden herhangi bir kelime varsa seppuku yapacağım ve sizden özür dileyeceğim. Eğer böyle bir kelime yoksa, siz seppuku yapacaksınız' şeklinde yanıt verdi. Bundan sonra, Terauchi buna çok öfkelendi ve sahneden Hamada'ya dik dik baktı, meclis salonunda öfkeli bağırışların uçuştuğu bir kaosa neden oldu."
 SEA_japan_popup_events.3.t:0 "Harakiri Tartışması"
 SEA_japan_popup_events.30.a:0 "Burada Kōza-ha haklı"
 SEA_japan_popup_events.30.b:0 "Bugün Rōnō-ha'nın idealleri en parlak şekilde parlıyor"
 SEA_japan_popup_events.30.desc:0 "İmparatorluk Ordusu'nun yenilgisinden sonra durum daha istikrarlı hale gelmişken, ulusal diyette hangi yolun izleneceği konusunda tartışma çıktı. Kōza-ha, yalnızca proletaryayı kullanarak ve halkı yönlendirmek için otoriter bir rehber el kullanarak ideal geleceğimize ulaşabileceğimizi savunurken, Rōnō-ha, devleti kontrol etmek için daha yumuşak ve daha az müdahaleci bir şemsiye hareketinin ideal olacağını savunuyor. Hangi fikir hayata geçirilmeli?"
 SEA_japan_popup_events.30.t:0 "Devletin Gelecekteki Yönü Üzerine Tartışma"
 SEA_japan_popup_events.31.a:0 "Sanzō Nosaka popülariteye sahip"
 SEA_japan_popup_events.31.b:0 "Kyūichi Tokuda deneyime sahip"
 SEA_japan_popup_events.31.desc:0 "Devrimin zaferi ve gücün artık Kōza-ha'nın elinde olmasıyla yeni halk cumhuriyeti için bir başbakan seçme zamanı geldi. Savaş sırasında önde gelen iki parti lideri Sanzō Nosaka ve Kyūichi Tokuda idi ve devrimin zaferiyle ikisi de bizi komünizme götürmeye yetenekli ve istekli olduklarını gösterdiler. İdeolojik olarak her zaman uyumlu olmasalar da ikisi de büyük bir potansiyel gösteriyor ve bu nedenle seçimin kime düşeceği tamamen kadere bağlı. Uluslararası Nosaka mı yoksa daha deneyimli ama belki de daha az popüler olan Tokuda mı olacak?"
 SEA_japan_popup_events.31.t:0 "Kōza-ha İçin Bir Lider"
 SEA_japan_popup_events.32.a:0 "Hitoshi Yamakawa deneyime sahip"
 SEA_japan_popup_events.32.b:0 "Kanson Arahata halkın desteğine sahip"
 SEA_japan_popup_events.32.c:0 "Yamakawa Kikue en devrimci fikirlere sahip"
 SEA_japan_popup_events.32.desc:0 "İç savaşın sona ermesi ve devrimin zaferinin ardından İşçi-Çiftçi hizbi partinin ve halkın güvenini kazandı. İdeallerinde o kadar ortodoks olmadıkları için birçok takipçi ve sonuç olarak da iktidar koltuğunu kazanmayı başardılar. Ancak asıl soru hala duruyor, cumhuriyetin bir sonraki başbakanı kim olacak? Üç aday sunuldu ancak nihai seçim hala duruyor. Sosyalist hareketin merkezi bir figürü olarak deneyimini gösteren Hitoshi Yamakawa mı olacak? Halktan büyük destek toplamayı başaran ve bu nedenle zaten başkan seçilen Kanson Arahata mı olacak? Yoksa parti içindeki daha az önemine rağmen hem bir lider hem de reformcu olarak role uygun olduğunu gösteren Yamakawa Kikue mi olacak?"
 SEA_japan_popup_events.32.t:0 "Rōnō-ha İçin Bir Lider"
 SEA_japan_popup_events.33.a:0 "Onları normal insanlar gibi yaşat"
 SEA_japan_popup_events.33.b:0 "Cezalarını hapiste çeksinler"
 SEA_japan_popup_events.33.c:0 "Hayatta kalmaları çok tehlikeli!"
 SEA_japan_popup_events.33.d:0 "Onları sürgüne gönder"
 SEA_japan_popup_events.33.desc:0 "Güç artık sıkıca halkın elindeyken, eski imparatorluk ailesi sorunu hala başımızın üzerinde asılı duruyor. En iyi nasıl ele alınacakları konusunda birçok farklı görüş var, bazıları reformu ve onları sıradan işçi statüsüne indirmeyi teşvik ederken, bazıları hem savaş sırasında hem de çok önce halka karşı işledikleri suçlar için daha sert cezalarla karşı karşıya kalmaları gerektiğini savunuyor. Seçimin nereye düşeceği hala belirsiz, ancak ne olursa olsun ele alınması gerekebilecek muhalif görüşler olacaktır."
 SEA_japan_popup_events.33.t:0 "İmparatorluk Ailesinin Kaderi"
 SEA_japan_popup_events.34.a:0 "Onların büyüleyici geleneklerinden yararlanmalıyız"
 SEA_japan_popup_events.34.b:0 "Bu devrimci liderlere hak ettikleri özerklik verilmeli!"
 SEA_japan_popup_events.34.desc:0 "Siyasi düşünürlerimizin çoğu lümpen proletaryanın devrimimizin ana gövdesi olduğunu ve Ainu halkının da bu gruba dahil olduğunu savunuyor. Dahası, Ainu halkının ilkel bir komünist sistemde yaşadığına inanıyorlar ve onları 'Komünist devrimin liderleri' olmaya layık görüyorlar. Ancak şimdi soru şu, hangi şekilde öyle olmalılar? Geleneklerinin sosyalist toplumumuza dahil edilmesi yoluyla mı olmalı, yoksa Ainu halkına özerklik verilmesi yoluyla mı olmalı?"
 SEA_japan_popup_events.34.t:0 "Ainu Devrimi Teorisi Üzerine Tartışmalar"
 SEA_japan_popup_events.35.a:0 "Nezaketle kabul edeceğiz"
 SEA_japan_popup_events.35.b:0 "Hayır, valilik kalmalı!"
 SEA_japan_popup_events.35.desc:0 "Hakim devletimiz [FROM.GetNameDef], sömürge valimizin [ROOT.GetAdjective] tahtının varisi ve Japon İmparatorluğu'na sadık Yi Un lehine istifa etmesini talep etti. Bu, kaçırılmayacak kadar iyi bir anlaşma gibi geliyor."
 SEA_japan_popup_events.35.t:0 "[FROM.GetLeader] Yi Hanedanını Güçlendirmek İstiyor"
 SEA_japan_popup_events.36.a:0 "Devam etmelerine izin ver"
 SEA_japan_popup_events.36.b:0 "Bu sosyalist kışkırtıcıları bastırın!"
 SEA_japan_popup_events.36.desc:0 "Şu anda ülkemizde komünist duyguları yayan [FROM.GetAdjective] hücrelerin aktif olduğu dikkatimizi çekti. Bu yeterince zararsız görünse de, propagandanın bazılarının doğası gereği oldukça devrimci olduğu anlaşılıyor. İşçilerin örgütlenmeye ve birleşmeye teşvik edildiğine dair raporlar daha da sıklaşıyor ve yakın tarihe bakıldığında, bunun [FROM.GetAdjective] liderliğinin bizi nihayetinde entegre etmek için ayrıntılı bir hilesi olmadığından emin olamayız."
 SEA_japan_popup_events.36.t:0 "[FROM.GetNameDefCap] Komünist Duyguları Kışkırtıyor"
 SEA_japan_popup_events.37.a:0 "Devam etmelerine izin ver"
 SEA_japan_popup_events.37.b:0 "Bu sosyalist kışkırtıcıları bastırın!"
 SEA_japan_popup_events.37.desc:0 "Şu anda ülkemizde komünist duyguları yayan [FROM.GetAdjective] hücrelerin aktif olduğu dikkatimizi çekti. Bu kendi başına yeterince zararsız görünse de, propagandanın bazılarının doğası gereği oldukça devrimci olduğu anlaşılıyor. İşçilerin örgütlenmeye ve birleşmeye teşvik edildiğine dair raporlar daha da sıklaşıyor ve yakın tarihe bakıldığında, bunun [FROM.GetAdjective] liderliğinin bizi nihayetinde entegre etmek için ayrıntılı bir hilesi olmadığından emin olamayız."
 SEA_japan_popup_events.37.t:0 "[FROM.GetNameDefCap] Komünist Duyguları Kışkırtıyor"
 SEA_japan_popup_events.38.a:0 "Proletarya İçin!"
 SEA_japan_popup_events.38.b:0 "Bu çılgınlığı durdurmalıyız!"
 SEA_japan_popup_events.38.desc:0 "Uzun bir artan komünist duygu döneminden sonra, [ROOT.GetAdjective] proletaryasının barışçıl bir hükümet değişikliğini beklemekten bıktığı görülüyor. Yoğun tartışmaların ardından diplomasinin başarısız olduğu ve silahlı çatışmanın başladığı görülüyor."
 SEA_japan_popup_events.38.t:0 "[ROOT.GetNameDef] İçinde İç Savaş"
 SEA_japan_popup_events.39.a:0 "İleriye giden yol budur!"
 SEA_japan_popup_events.39.b:0 "Hayır, [ROOT.GetLeader] liderlik etmeye devam edecek"
 SEA_japan_popup_events.39.desc:0 "Japonya'daki çeşitli sosyalist hareketleri bünyemize katmamız sayesinde, Girō Senoo liderliğindeki Budist sosyalist hareket hızla büyüdü ve Budizmi Canlandırma Gençlik Birliği sosyalist gençlerimiz için gidilecek hareket haline geldi. Şimdi, parti danışmanı Tsuji Jun, devletin partinin başında giderek daha popüler hale gelen Girō Senoo ile daha iyi durumda olacağını iddia ederek liderlik konusunda [ROOT.GetLeader] üzerinde baskı kurdu. Manevi kurtuluşun yanı sıra sosyal ve ekonomik özgürleşmeye giden doğru yol bu mu?"
 SEA_japan_popup_events.39.t:0 "Budizmin Canlanması"
 SEA_japan_popup_events.4.a:0 "Ne pahasına olursa olsun desteğini kazanmalıyız!"
 SEA_japan_popup_events.4.b:0 "Aklımızda başka adaylar var"
 SEA_japan_popup_events.4.c:0 "Bizi desteklemiyorsa, gitmeli..."
 SEA_japan_popup_events.4.desc:0 "İmparatorumuz, bir Shōwa Restorasyonu ve yeni bir askeri hükümetin kurulması yönündeki hırslarımıza karşı ilgisizliğini ifade etti. Muhtemelen hala kontrol hizbinin büyüsü altında, ancak bizimle taraf olmazsa, muhtemelen imparatorluk ekselanslarını kardeşi Yasuhito ile değiştirmek zorunda kalacağız. Onu bize katılması için 'ikna' etmeli miyiz yoksa tarihin akışına bırakmak akıllıca olabilir mi?"
 SEA_japan_popup_events.4.t:0 "İmparatoru İkna Etmek"
 SEA_japan_popup_events.40.a:0 "Savaşlarını malzemelerimizle beslemeye devam edemeyiz!"
 SEA_japan_popup_events.40.b:0 "Bir Asya ülkesi bizim için tehdit oluşturmaz, sorun yok"
 SEA_japan_popup_events.40.desc:0 "[JAP.GetNameDef] Asya'da hızla genişlerken, komşularını işgal edip uluslarını harap ederken, endüstrilerimiz ve doğal kaynaklarımız ekonomilerini desteklemeye ve savaş silahlarına dönüştürülmek üzere fabrikalarına akmaya devam ediyor. Halkımız şimdi buna karşı giderek daha eleştirel yaklaşıyor ve harekete geçilmesi için haykırıyor. Ne yapmalıyız?"
 SEA_japan_popup_events.40.t:0 "[JAP.GetAdjective] Yayılmacılığına Dair Endişe Verici Raporlar"
 SEA_japan_popup_events.41.a:0 "Yanlış yönlendiriliyorlar"
 SEA_japan_popup_events.41.desc:0 "Düşüncesiz kararlarını ılımlı genişlememize ve düşmanlarımızı yatıştırmamıza dayandıran savaş çığırtkanı [FROM.GetAdjective] vatandaşlarının, [FROM.GetNameDef] lideri [FROM.GetLeader] üzerinde bize ambargo uygulaması için baskı yaptığı görülüyor. Uluslarımız arasında artık ticaret yapılmamasına karar verdiler, bu da bize karşı tarafsızlıklarının açık bir ihlalidir..."
 SEA_japan_popup_events.41.t:0 "[FROM.GetAdjective] Ambargosu"
 SEA_japan_popup_events.42.a:0 "Bu bataklığa bir son vermeliyiz!"
 SEA_japan_popup_events.42.desc:0 "Doğu Asya savaşının cepheleri siyasi mayın tarlalarına dönüşürken ve geniş toprak parçaları düşmandan korunmasız bir şekilde yatarken, halk [ROOT.GetLeader] kişisinin savaşı kazanma yetkinliğini sorgulamaya başlıyor. Durum aceleyle çözülmezse, savaş çabalarını yeniden canlandırarak veya daha yetkin bir kabine getirerek, savaş kaybedilmiş sayılabilir..."
 SEA_japan_popup_events.42.t:0 "Halk [ROOT.GetLeader] Kişisine Güvenini Kaybediyor"
 SEA_japan_popup_events.43.a:0 "İmparatorların isteğine karşı gelmeye nasıl cüret ederler?"
 SEA_japan_popup_events.43.b:0 "İmparatorun saltanatından kara bulutlar dağılmalı!"
 SEA_japan_popup_events.43.desc:0 "İmparatorun Doğu Asya savaşının resmi olarak sona erdiğini duyurma arzusunu duyan Binbaşı Kenji Hatanaka komutasındaki birkaç darbeci, İmparatorluk Muhafızlarını Tokyo İmparatorluk Sarayı'nı işgal etmeye ve İmparatoru ev hapsine almaya ikna etmek için harekete geçti. Generaller Shizuichi Tanaka ve Takeshi Mori bu darbe girişimine hızlı bir son vermek için hazırlandılar, ancak hangi tarafın üstün geleceğini kim bilebilir?"
 SEA_japan_popup_events.43.t:0 "Kyūjō Olayı"
 SEA_japan_popup_events.44.a:0 "Zamanı geldi"
 SEA_japan_popup_events.44.b:0 "Hayır, sahada kalmalı!"
 SEA_japan_popup_events.44.desc:0 "Moğol Halk Ordusu'nun başkomutanı ve 1921'in büyük Moğol devrimcilerinden biri olan Khorloogiin Choibalsan, ülkemizi büyüklüğe taşımak için güçlü bir adaydır. Son askeri başarılarıyla, artık ulusu tek lideri olarak gerçekten yönetecek kadar yetkin olduğunu da kanıtladı. Bakanlar Kurulu'nun 10. Başkanı olma zamanı geldi mi?"
 SEA_japan_popup_events.44.t:0 "Khorloogiin Choibalsan'ın Yükselişi"
 SEA_japan_popup_events.45.a:0 "Konsolidasyonumuz devam ediyor"
 SEA_japan_popup_events.45.desc:0 "Resmi Japon ordu komutanlığının çöküşü ve Ana Adalar'da patlak veren iç savaşın ardından, güneybatı sınırımızda bulunan Doğu Hebei Özerk Hükümeti olarak bilinen Japon himayesi artık korumasız durumda. Saldırma zamanı geldi, [JAP.GetAdjective] hükümetinin kıtada neler olup bittiğini umursamayacak kadar çok başka sorunu varken onu almalıyız."
 SEA_japan_popup_events.45.t:0 "Doğu Hebei Özerk Hükümeti'ni İşgal Etmek"
 SEA_japan_popup_events.46.a:0 "Onlarla daha sonra ilgileneceğiz..."
 SEA_japan_popup_events.46.desc:0 "Resmi Japon ordu komutanlığının çöküşü ve Ana Adalar'da patlak veren iç savaşın ardından, [MAN.GetNameDef] güneybatı sınırında bulunan Doğu Hebei Özerk Hükümeti olarak bilinen eski himayemiz artık korumasız durumda. Bu nedenle, hükümetimizin kıtada neler olup bittiğini umursamayacak kadar çok başka sorunu varken saldırmaya ve onu almaya karar verdiler."
 SEA_japan_popup_events.46.t:0 "Kwantung Ordusu Doğu Hebei'yi İşgal Ediyor"
 SEA_japan_popup_events.47.a:0 "Kuzeyde bir Fırtına kopuyor..."
 SEA_japan_popup_events.47.desc:0 "[FROM.GetNameDef] lideri [FROM.GetLeader], Rus İç Savaşı'nın sonunda bölgeyi onlara geri verirken imzaladığımız antlaşmaları aşağılık bir şekilde hiçe sayarak, [655.GetName] içindeki ormancılık ve madencilik haklarımızı iptal eden yeni bir belge imzaladı."
 SEA_japan_popup_events.47.t:0 "[FROM.GetNameDefCap] [655.GetName] Üzerindeki Kaynak Haklarımızı İptal Ediyor"
 SEA_japan_popup_events.48.a:0 "Tokugawa'ya mutlak güç vermek daha önce hiç yanlış gitmemişti"
 SEA_japan_popup_events.48.desc:0 "Düşman birliklerinin topraklarımıza ayak basmasının ardından, [ROOT.GetLeader] sıkıyönetim ilan etti ve işgalciler topraklarımızdan atılana kadar ulusal bir olağanüstü hal ilan etti. Bunun ne kadar süreceğini kimse bilmiyor, ancak bildikleri tek şey, toprakların bir kez daha Tokugawa ailesinin mutlak kontrolü altında olduğu."
 SEA_japan_popup_events.48.t:0 "[ROOT.GetLeader] Ulusal Olağanüstü Hal İlan Ediyor"
 SEA_japan_popup_events.49.a:0 "Görünüşe göre militarizmin hayaleti hala peşimizde..."
 SEA_japan_popup_events.49.desc:0 "Donanmadaki ılımlıların bir üyesi olarak iktidara yükselişinin ardından, [ROOT.GetLeader] halkın gözünde oldukça popüler oldu. Şimdi ordunun bir kez daha büyük bir güç kazanmasıyla, ona karşı hala kin besledikleri görülüyor, çünkü bugün erken saatlerde konutunda ölü bulundu. Sahte olması muhtemel olsa da, Başbakan'ın üzerinde ülkenin liderliğini Adachi Kenzō'ya devreden bir vasiyet bulundu."
 SEA_japan_popup_events.49.t:0 "[ROOT.GetLeader] Ölü Bulundu!"
 SEA_japan_popup_events.5.a:0 "Mükemmel!"
 SEA_japan_popup_events.5.desc:0 "Yeterli 'ikna'nın ardından, büyük imparatorumuzun yeni kurulan hükümetimizi desteklemeye karar verdiği ve bize Shōwa Restorasyonu planlarımızla ilerlememiz için resmi onayı verdiği görülüyor. Bu, ulusumuzu güçlendirmeye hizmet edecek!"
 SEA_japan_popup_events.5.t:0 "Hirohito Yeni Hükümeti Desteklemeye Karar Veriyor"
 SEA_japan_popup_events.50.a:0 "Pekala, istedikleri Başbakan buysa..."
 SEA_japan_popup_events.50.b:0 "Taleplerine uymayacağız!"
 SEA_japan_popup_events.50.desc:0 "İmparatorluk Kuralı Yardım Derneği'nin kurulmasıyla, Düşünce Polisi lideri Genki Abe'nin ve kamu hizmetinin çeşitli liderlerinin [ROOT.GetLeader] eylemlerinden pek memnun olmadıkları açıkça ortaya çıktı. Şimdi, Nazi yanlısı politikacı Seigō Nakano lehine istifa etmesini talep ediyorlar. Bu baskıyı kabul etmeli miyiz?"
 SEA_japan_popup_events.50.t:0 "Tokkō ve Bürokratlardan Ortak Bir Talep"
 SEA_japan_popup_events.51.a:0 "İmparator için!"
 SEA_japan_popup_events.51.desc:0 "Donanma personelimizin Pasifik savunma çevremizi daha uzak atollere kadar genişletmek istemesi nedeniyle filomuz yakın zamanda bir Amerikan filosuyla karşılaştığında Batı İmparator Zinciri'nde devriye gezmek üzere gönderildi. Savaş çetin geçti ama sonunda düşmanı paketledik, hem donanmalarına hem de morallerine ciddi zarar verdik. Bu başarıdan dolayı komutanlarımıza yeterli terfiler verilmiştir."
 SEA_japan_popup_events.51.t:0 "Midway Savaşı"
 SEA_japan_popup_events.52.a:0 "Onlara ne için olduğunu gösterdik"
 SEA_japan_popup_events.52.desc:0 "Japonlar, Pasifik savunma çevrelerini daha uzak atollere kadar genişletmeye çalıştıklarından beri filoları bir kez daha Pearl Harbor'a yaklaşmaya başladı. Ancak düşmanlarımızın haberi olmadan şifre kırıcılarımız Midway'e planladıkları saldırının tarihini ve yerini zaten belirleyerek bizim de pusu kurmamızı sağladı. Pasifik Filosu komutanı, Japonlar gelmeden önce Midway bölgesine Frank Jack Fletcher komutasında büyük bir kuvvet göndermişti ve bu dikkatli hazırlık sayesinde, şimdi onların kuvvetlerine, çabuk toparlanamayacakları önemli bir darbe indirdik."
 SEA_japan_popup_events.52.t:0 "Midway Savaşı"
 SEA_japan_popup_events.53.a:0 "Utanç verici bir görüntü"
 SEA_japan_popup_events.53.desc:0 "Donanma personelimizin Pasifik savunma çevremizi daha uzak atollere kadar genişletmek istemesi nedeniyle filomuz yakın zamanda Midway Atolü'nü ele geçirmek üzere yola çıktı. Ancak komutanlarımızın haberi olmadan, Amerikalı şifre kırıcılar Midway'e planladığımız saldırının tarihini ve yerini zaten belirleyerek kendi pusularını kurmuşlardı. Savaş yıkıcı bir kayıpla sonuçlandı ve medya, moralleri yüksek tutmak için kamuoyuna verilen kayıplarla ilgili her türlü bilgiyi sansürlüyor."
 SEA_japan_popup_events.53.t:0 "Midway'deki Felaket"
 SEA_japan_popup_events.54.a:0 "Bu benzeri görülmemiş bir felaket!"
 SEA_japan_popup_events.54.desc:0 "Japonlar, Pasifik savunma çevrelerini daha uzak atollere kadar genişletmeye çalıştıklarından beri filoları bir kez daha Pearl Harbor'a yaklaşmaya başladı. Ancak düşmanlarımızın haberi olmadan şifre kırıcılarımız Midway'e planladıkları saldırının tarihini ve yerini zaten belirleyerek bizim de pusu kurmamızı sağladı. Pasifik Filosu komutanı, Japonlar gelmeden önce Frank Jack Fletcher komutasında Midway bölgesine büyük bir kuvvet göndermişti. Ancak tüm çabalarımıza rağmen filomuz onlarınkine rakip olamadı ve birkaç saat içinde savaşın gidişatı belirlendi. Belki de bu, düşmanlarımızın Pasifik filomuzu dizginlemek için ihtiyaç duyduğu dönüm noktasıdır."
 SEA_japan_popup_events.54.t:0 "Yıkıcı Midway Savaşı"
 SEA_japan_popup_events.6.a:0 "O zaman oğlu lehine tahttan çekilmeli"
 SEA_japan_popup_events.6.b:0 "Onu ev hapsine alın!"
 SEA_japan_popup_events.6.desc:0 "Büyük imparatorumuzu ikna etmeye yönelik ısrarlı girişimlerimize rağmen, mantıklı olmayı reddediyor gibi görünüyor. İdeal olmasa da, bunun bir olasılık olduğunu biliyorduk ve bu tür bir senaryoyla başa çıkmak için planlarımız vardı. Japon İmparatorluk Ordusu'nda general olan kardeşi Yasuhito, onun yerini alacak aklımızdaki adaydır. Bu, ya Hirohito'nun oğlu Akihito için bir Sesshō (Naip) olarak ya da ideolojimizle çok daha uyumlu yeni bir imparator olarak olacaktır."
 SEA_japan_popup_events.6.t:0 "Hirohito Yeni Hükümeti Desteklemeyi Reddediyor"
 SEA_japan_popup_events.7.a:0 "Yasuhito onun yerini alacak"
 SEA_japan_popup_events.7.desc:0 "Bugün erken saatlerde subaylarımız İmparator Shōwa'yı konutunda ölü bulduklarını bildirdiler. Yabancı ajanlar tarafından suikasta uğradığını iddia ediyorlar, ancak kesin olarak bilemeyiz, çünkü gerçek bize fayda sağlamaktan çok zarar verebilir. Bu tehdit nedeniyle ordu sıkıyönetim ilan etti ve İmparatorluk Ordusu generali Prens Chichibu'nun taç giyeceğini belirtti, çünkü saldırganlar hala serbestken veraseti devam ettirmek ve tacı Akihito'ya vermek çok tehlikeli olurdu. Bu daha büyük bir komplonun parçası mı, yoksa gerçekten yabancı bir saldırgan mı var?"
 SEA_japan_popup_events.7.t:0 "Hirohito Suikasta Uğradı!"
 SEA_japan_popup_events.8.a:0 "Masaki adamlar arasında daha popüler"
 SEA_japan_popup_events.8.b:0 "Araki ulusun Sōtō'su (Führer benzeri lider) yapılmalı"
 SEA_japan_popup_events.8.desc:0 "Yeni askeri hükümetimizin kurulmasıyla liderlik sorunu bir kez daha gündeme geldi. Kōdōha'nın kurucusu Sadao Araki, başbakanlık görevini üstlenmek istediğini belirtti ve bunu imparatora iletti, ancak Jinzaburō Masaki'nin hem adamlar hem de genel halk arasında Araki'den daha popüler olmasıyla, Başbakanlık rolünü ona vermek ve Araki'nin sadece törensel bir pozisyon alması daha akıllıca olabilir. Ne yapmalıyız?"
 SEA_japan_popup_events.8.t:0 "Askeri Kliğin Liderliği Sorunu"
 SEA_japan_popup_events.9.a:0 "Bu tür batı kavramlarından uzak durmalıyız!"
 SEA_japan_popup_events.9.b:0 "Araki haklı ve bu fikirleri benimsemeliyiz"
 SEA_japan_popup_events.9.desc:0 "Ordu içinde tanınmış bir siyasi filozof olan General Sadao Araki, İmparatoru, halkı, toprağı ve ahlakı bir ve bölünmez olarak birbirine bağlayan ideolojisinin felsefi temelini oluşturmak için samurayların eski Bushido kodunu Avrupa faşizmine benzer fikirlerle ilişkilendirdi. Bu fikirleri güçlendirmek için, ideolojik modelini üzerine inşa ettiği batıdakilere daha yakın bir hükümet biçimi benimsemek akıllıca olabilir. Ne diyoruz?"
 SEA_japan_popup_events.9.t:0 "Ahlak, Bushido ve Faşizm Sorunu"
 SEA_japan_tokko_arrest_events.1.a:0 "Harika Haber"
 SEA_japan_tokko_arrest_events.1.desc:0 "Tokkō, iç istikrarımıza yönelik bir tehdit keşfetti. Görünüşe göre toplumumuzu baltalamak isteyen sosyalist ve komünist örgütler var. Kanson Arahata, Saburō Eda, Ryōkichi Minobe, Itsurō Sakisaka, Kōzō Sasaki, Mosaburō Suzuki, Minoru Takano ve Hitoshi Yamakawa gibi birden fazla yüksek rütbeli komünist parti üyesinden oluşan tutuklanacak kişiler listesi hazırlandı."
 SEA_japan_tokko_arrest_events.1.t:0 "Halk Cephesi Olayı"
 SEA_japan_tokko_arrest_events.2.a:0 "Yabancı Ajanlar hak ettiklerini buluyor!"
 SEA_japan_tokko_arrest_events.2.b:0 "[ENG.GetAdjective] halkını kızdırmamaya çalışın"
 SEA_japan_tokko_arrest_events.2.desc:0 "Tokkō, iç istikrarımıza yönelik bir tehdit keşfetti. Ülkemizde ikamet eden 11 İngiliz vatandaşı, elebaşları Reuters'in Tokyo büro şefi MJ Cox olmak üzere Askeri Sırlar Koruma Yasasını ihlal şüphesiyle tutuklanacak. [ENG.GetAdjective] hükümeti bunların casus olmadığını iddia etse de, yine de sorgulanmak üzere Askeri Polis Karargahı binasına götürüldüler."
 SEA_japan_tokko_arrest_events.2.t:0 "Cox Olayı"
 SEA_japan_tokko_arrest_events.3.a:0 "Kwantung Ordusu'nun ilgilenmesine izin verin"
 SEA_japan_tokko_arrest_events.3.b:0 "Hemen toplu tutuklamalar yapmalıyız!"
 SEA_japan_tokko_arrest_events.3.c:0 "Bize tehdit oluşturmuyorlar, görmezden gelin"
 SEA_japan_tokko_arrest_events.3.desc:0 "Tokkō, iç istikrarımıza yönelik başka bir tehdit keşfetti. Birçok Güney Mançurya Demiryolu Soruşturma Departmanı üyesi, Kwantung Ordusu'nun Askeri Polisi tarafından iki kez tutuklandı ve kolonilerimizde Japon karşıtı ve komünist propaganda yayma şüphesiyle tutuluyor. Ayrıca daha önce Ana Adalarda yasaklanan Marksist yöntemleri kullanarak sosyal araştırma ve analizle uğraştıkları da görülüyor. Bu komplo çok derinlere inebilir, nasıl ele alınmalı?"
 SEA_japan_tokko_arrest_events.3.t:0 "Gassakusha Olayı"
 SEA_japan_tokko_arrest_events.4.a:0 "Yabancı Ajanlar hak ettiklerini buluyor!"
 SEA_japan_tokko_arrest_events.4.b:0 "[SOV.GetAdjective] halkını kızdırmamaya çalışın"
 SEA_japan_tokko_arrest_events.4.desc:0 "Tokkō, iç istikrarımıza yönelik başka bir tehdit keşfetti. Bu sefer, [GER.GetAdjective] gazeteci Richard Sorge başkanlığında, ulusumuz genelinde casusluk ve yıkıcı faaliyetlerden suçlu bulunan bir [SOV.GetAdjective] casus çetesini ortaya çıkardılar. Eski Asahi Shimbun gazetecisi Hotsumi Ozaki ve aristokrasimizin bir üyesi olan Koichi Saionji gibi, ilgilenilmesi gereken işbirlikçiler de kazanmış görünüyorlar."
 SEA_japan_tokko_arrest_events.4.t:0 "Sorge Olayı"
 SEA_japan_tokko_arrest_events.5.a:0 "Daha fazla muhalefet bastırıldı"
 SEA_japan_tokko_arrest_events.5.desc:0 "Yokohama Özel Yüksek Polisi, daha önce Tokkō tarafından zorla feshedilen Komünist Partiyi canlandırmaya çalışmak suçlamasıyla yaklaşık otuz beş entelektüeli tutukladı. Şüpheliler arasında Chuo Koron, Kaizō ve Nippon Hyoron dergilerinin editörleri de bulunuyor. Kolluk kuvvetlerimiz, ulusumuzun ruhunu bu manevi tehditten koruma konusunda iyi bir iş çıkarıyor gibi görünüyor."
 SEA_japan_tokko_arrest_events.5.t:0 "Yokohama Olayı"
 SEA_japan_tokko_arrest_events.6.a:0 "Başbakanımız hakkında kötü konuşmaya nasıl cüret eder? Tutuklayın!"
 SEA_japan_tokko_arrest_events.6.desc:0 "Aşırı sağcı siyasi parti Tōhōkai'nin kurucusu ve lideri Nakano Seigo tutuklandı. Bu, partinin baskı nedeniyle yasal faaliyetlerine devam edemediği iddiasının ardından geldi ve Kabinemiz tarafından algılanan 'siyasi baskı' nedeniyle yasadışı doğrudan eylemde bulunmayı planladıkları görülüyor. Ne kadar onursuzca!"
 SEA_japan_tokko_arrest_events.6.t:0 "Nakano Seigo Olayı"
 SEA_japan_tokko_arrest_events.7.a:0 "Bu savaşı kazanacağımıza neden güvenmiyorlar?"
 SEA_japan_tokko_arrest_events.7.desc:0 "Mainichi Shimbun'un baş muhabiri Takeo Shinmyo, savaş çabalarını eleştirdiği için Tokkō tarafından tutuklandı. İddiaya göre Hizmetler Arası Rekabetimizin bir parçası olarak, 'Bambu mızrak işe yaramaz. Bu bir uçak, bir deniz uçağı.' ve 'Büyük Doğu Asya Savaşı'nın sonucu deniz ve hava gücünün güçlendirilmesine bağlıdır ve düşmanın hava gücüne bambu mızraklarla karşı koyamayız' diyerek ordumuzun liderliğini doğrudan eleştirdi ve bizi zafere yalnızca donanmanın götürebileceği fikrini savundu."
 SEA_japan_tokko_arrest_events.7.t:0 "Bambu Mızrak Olayı"
 SEA_japan_tokko_arrest_events.8.a:0 "Direktifi izleyin ve toplu tutuklamalara başlayın!"
 SEA_japan_tokko_arrest_events.8.b:0 "Hasır altı edin, zaten bize faydası var"
 SEA_japan_tokko_arrest_events.8.desc:0 "Birçok Güney Mançurya Demiryolu Soruşturma Departmanı üyesi, Kwantung Ordusu'nun Askeri Polisi tarafından iki kez tutuklandı ve Japon karşıtı ve komünist propaganda yayma şüphesiyle tutuluyor. [JAP.GetNameDefCap] bize durumla uygun şekilde ilgilenmemiz talimatını verdi ancak doğrudan müdahale etmeyecek. Durum nasıl ele alınmalı?"
 SEA_japan_tokko_arrest_events.8.t:0 "Gassakusha Olayı"
 SEA_warlords.1.a:0 "[ROOT.GetNameDefCap] amacına hizmet etti."
 SEA_warlords.1.b:0 "Savaşmaya devam etmeliyiz!"
 SEA_warlords.1.desc:0 "Liu Xiang'ın vefatı ve Merkezi Hükümet'ten gelen artan baskıyla, [ROOT.GetNameDef] devletinin yakında dağılabileceği giderek daha açık hale geliyor. Ancak bu ölümün bir tesadüf değil, bir suikast olduğuna inananlar var ve Merkezi Hükümeti kızdırma pahasına savaşa devam etmek istiyorlar."
 SEA_warlords.1.t:0 "Liu Xiang'ın Ölümü"
 SEA_warlords.10.a:0 "Onu hemen işe koyacağız!"
 SEA_warlords.10.desc:0 "Kumul Hanlığı'nın düşüşünün ardından, $KUM_yulbars_khan$ yakalanmaktan kurtulmayı başardı ve ortak düşmanımıza karşı savaşa devam etmek için bize kaçtı. Onu kollarımızı açarak karşılamalıyız."
 SEA_warlords.10.t:0 "$KUM_yulbars_khan$ Hotan'a Vardı"
 SEA_warlords.100.a:0 "Bu ihanet cezasız kalmayacak!"
 SEA_warlords.100.desc:0 "[XIC.GetNameDef] devletinden gelen acil bir rapor, [XIC.GetLeader] birliklerini [1032.GetName] bölgesinden çektiğini, [PRC.GetNameDef] güçlerinin bölgeye akmasına izin verdiğini ve bölgeyi kendilerininmiş gibi talep ettiğini belirtiyor. [XIC.GetName] devletinin tüm amacı [PRC.GetName] devletini kontrol altında tutmak ve onları yok etmekti - onlara yardım etmek değil."
 SEA_warlords.100.t:0 "[XIC.GetName], [ROOT.GetLeader] İhanet Ediyor"
 SEA_warlords.11.a:0 "Savaşa devam etme zamanı"
 SEA_warlords.11.desc:0 "Bir Kuomintang generali olan $KUM_yulbars_khan$, Sinkiang ilinin valisi [SIK.GetLeader] güçlerine karşı başarısız bir ayaklanmanın ardından şimdi tarafımıza döndü. Onu kollarımızı açarak karşılamalıyız."
 SEA_warlords.11.t:0 "$KUM_yulbars_khan$ Geldi"
 SEA_warlords.12.a:0 "Eve hoş geldin"
 SEA_warlords.12.desc:0 "Ma Hushan'ın devletinin düşüşünün ardından, $XSM_ma_hongbin$ yakalanmaktan kaçtı ve sonunda bize ulaştı, şimdi burada ikamet ediyor. Gelecek birçok savaşta onun deneyimini ve uzmanlığını iyi kullanmalıyız."
 SEA_warlords.12.t:0 "$XSM_ma_hongbin$ Geldi"
 SEA_warlords.13.a:0 "Hainlere güvenmeyiz"
 SEA_warlords.13.b:0 "İkinci şansına sahip olacak"
 SEA_warlords.13.desc:0 "Ma Hushan'ın güçlerinin düşüşünün ardından, isyancılarla güçlerini birleştiren Kaşgar'ın eski valisi $KHM_mahmut_muhiti$, hükümetimiz için tekrar vali ve subay olarak hizmet etmek üzere geri dönmeyi teklif etti. Görünüşe göre kendini affettirmek için ikinci bir şans istiyor, ancak geçmiş eylemleri göz önüne alındığında ona güvenmek akıllıca olmayabilir."
 SEA_warlords.13.t:0 "Hain Geri Dönüyor"
 SEA_warlords.14.a:0 "$wtt_political_warlord_support.10.a$"
 SEA_warlords.14.b:0 "$wtt_political_warlord_support.10.b$"
 SEA_warlords.14.c:0 "İnsan gücü iste."
