 SEA_PHI_political_events.1.a:0 "İhtiyacımız olan kaynaklar için alternatif kaynaklara sahip olmak çok önemli"
 SEA_PHI_political_events.1.b:0 "Aklımızda başka ticaret ortakları var"
 SEA_PHI_political_events.1.desc:0 "[USA.GetAdjective] ticaretine olan bağımlılıklarını azaltmak isteyen [FROM.GetNameDef], yeni bir ticaret anlaşması teklifiyle bize yaklaştı. Onlara benzer şekilde, bu bizim de küçük bir ticaret ortağı grubuna olan bağımlılığımızı azaltmamıza olanak tanıyabilir."
 SEA_PHI_political_events.1.t:0 "[FROM.GetName] Bir Ticaret Anlaşması Öneriyor"
 SEA_PHI_political_events.10.a:0 "Bu karşılıklı olarak faydalı olmalı"
 SEA_PHI_political_events.10.desc:0 "Önerdiğimiz gibi, [FROM.GetNameDef], şu anda [FROM.GetAdjective] limanlara doğru yola çıkan ticaret ve nakliye gemileri karşılığında bize bir [PHI_GetTradedEquipment] sevkiyatı gönderdi."
 SEA_PHI_political_events.10.t:0 "[FROM.GetName] Gemi Satın Almayı Kabul Ediyor"
 SEA_PHI_political_events.11.a:0 "Belki başka teçhizatları elden çıkarmaya isteklidirler"
 SEA_PHI_political_events.11.desc:0 "Ne yazık ki, [FROM.GetNameDef] gemilerimizin bir kısmı karşılığında bize [PHI_GetTradedEquipment] sağlamayı reddetti."
 SEA_PHI_political_events.11.t:0 "[FROM.GetName] Ticaret Teklifini Reddediyor"
 SEA_PHI_political_events.12.a:0 "Çabalarımız sonuç verdi"
 SEA_PHI_political_events.12.desc:0 "Sert müzakerelerin ve [PHI.GetNameDef] tarafından verilen bir dizi tavizin ardından, [USA.GetLeader], [USA.GetNameDef] devletinin [Root.GetRulingPartyLong] planlarına müdahale etmeyeceğini duyurdu. [USA.GetLeader.GetSheHeCap], [PHI.GetNameDef] devletinin Amerikan halkı için acil bir tehdit oluşturmadığına ve istikrarlı bir hükümetin düzgün bir şekilde devam etmesini sağlamak için uygun adımları attığımıza ikna oldu.[TreatyOfManilaToBeSigned]"
 SEA_PHI_political_events.12.t:0 "Amerikan Müdahalesi Tehdidi Sona Erdi"
 SEA_PHI_political_events.13.a:0 "Güney Doğu Asya'da komünizmi durdurmak için müdahale et"
 SEA_PHI_political_events.13.b:0 "[PHI.GetName] devletine ambargo uygula"
 SEA_PHI_political_events.13.c:0 "Sert bir dille yazılmış mektup gönder"
 SEA_PHI_political_events.13.desc:0 "[PHI.GetNameDef] Komünist Partisi temsilcilerimizi defalarca geri çevirdi ve bizimle olan tüm ilişkileri kesmekle tehdit etti.\n\nÜst düzey askeri yetkililer, [Root.GetLeader] masasına bir askeri plan sundular. Planın savunucuları, komünist bir Filipinler'in güvenliğimiz için bir tehdit olduğunu ve komünizmin yayılmasını durdurmak için müdahale etmemiz gerektiğini savunuyorlar."
 SEA_PHI_political_events.13.t:0 "[PHI.GetCommunistParty] Sorunu"
 SEA_PHI_political_events.14.a:0 "Eski hakim devletimize direneceğiz"
 SEA_PHI_political_events.14.desc:0 "[USA.GetNameDefCap], [PHI.GetName] devletine savaş ilan etti. Bu, [USA.GetAdjective] endişelerin [PHI.GetRulingPartyLong] rolü hakkında yatıştırılamamasının ardından geldi. [USA.GetLeader] kamuoyuna yaptığı açıklamada, bu savaşın Güney Doğu Asya'da komünizmin yayılmasını durdurmak için gerekli olduğunu belirtti."
 SEA_PHI_political_events.14.t:0 "Savaş İlan Edildi"
 SEA_PHI_political_events.15.a:0 "En azından silahlı bir tepki değil"
 SEA_PHI_political_events.15.desc:0 "[USA.GetNameDefCap], '[PHI.GetAdjective] hükümetinin komünist nüfuzunu kısıtlamadaki başarısızlığı' nedeniyle [PHI.GetNameDef] üzerine tam bir ticaret ambargosu ilan etti."
 SEA_PHI_political_events.15.t:0 "[USA.GetAdjective] Ambargo"
 SEA_PHI_political_events.16.a:0 "Durum göz önüne alındığında mümkün olan en iyi sonuç"
 SEA_PHI_political_events.16.desc:0 "Değişen hükümetimize ve dış politikamıza yanıt olarak, [USA.GetAdjective] hükümeti eylemlerimizi kınayan bir mektup gönderdi. Ancak Güney Amerika'daki önceki müdahaleleri göz önüne alındığında, bu hafif bir tepki gibi görünüyor."
 SEA_PHI_political_events.16.t:0 "[USA.GetName] Protesto Gönderdi"
 SEA_PHI_political_events.17.a:0 "Evangelista'yı ata, radikal liderliğe ihtiyacımız var"
 SEA_PHI_political_events.17.b:0 "Daha entelektüel bir yaklaşım için Santos'u ata"
 SEA_PHI_political_events.17.desc:0 "Ulusal Hükümet üzerindeki Amerikan gözetiminin zayıflığını fırsat bilen Partido Komunista ng Pilipinas (Filipinler Komünist Partisi), boşluğu doldurmak için hızla devreye girdi ve seçilmiş parti üyeleri, yalnızca kendilerinin sunabileceği acil ve kararlı eylem çağrısında bulundu. Diğer gruplar hala bir miktar nüfuza sahip olsa da, komünist kesim hızla öne çıktı. \n \nAncak şimdi, partiyi ve ulusu yükselen kızıl şafağa doğru kimin yönetmesi gerektiğini belirlemeliyiz."
 SEA_PHI_political_events.17.t:0 "Yeni Liderliğimiz"
 SEA_PHI_political_events.18.a:0 "[FROM.GetName] devletini Komintern'e kabul et"
 SEA_PHI_political_events.18.b:0 "Onları reddet"
 SEA_PHI_political_events.18.desc:0 "[PHI.GetNameDef] içindeki çiftçilerin, fabrika işçilerinin ve balıkçıların yükselişini büyük bir ilgiyle izliyorduk ve şimdi bize Komintern'e katılma isteklerini belirten diplomatik girişimlerde bulundular. Nasıl yanıt vermeliyiz?"
 SEA_PHI_political_events.18.t:0 "[FROM.GetName] Komintern'e Katılmak İstiyor"
 SEA_PHI_political_events.19.a:0 "Dünya bugün biraz daha karanlık görünüyor"
 SEA_PHI_political_events.19.desc:0 "[SOV.GetNameDef] heyetimiz yeni döndü, ancak kötü haberler getirdiler - Komintern'e girişimiz reddedildi. En azından şimdilik, karanlık dalgalara karşı tek başımızayız."
 SEA_PHI_political_events.19.t:0 "[FROM.GetName] Komintern'e Girişi Reddetti"
 SEA_PHI_political_events.2.a:0 "Harika haber"
 SEA_PHI_political_events.2.desc:0 "[FROM.GetNameDef] ile önerdiğimiz ticaret anlaşması hükümetleri tarafından olumlu karşılandı. Onların bu hevesi, yeni ticaret ortakları arayışımız için harika bir başlangıç."
 SEA_PHI_political_events.2.t:0 "Japonya Ticaret Anlaşmasını İmzaladı"
 SEA_PHI_political_events.20.a:0 "İyi şanslar, general!"
 SEA_PHI_political_events.20.desc:0 "Başkan [USA.GetLeader], Douglas MacArthur'u tekrar aktif göreve getirdi ve onu Filipinler'de konuşlu yeni kurulan Uzak Doğu'daki ABD Ordu Kuvvetleri'ne komuta etmesi için görevlendirdi. Başkan bu atamayı, MacArthur'un Filipinler'de uzun yıllar askeri danışman olarak çalışması ve oradaki savunma durumu hakkında iyi bilgi sahibi olması nedeniyle yaptı. \n \nOradaki güçleri sahada daha iyi yönetebilmesi için, artık onun üzerinde kontrolümüz olmayacak. Ancak, yeteneklerine burada ihtiyaç duyarsak onu geri çağırabileceğiz. Yine de bunu yapmadan önce dikkatlice düşünmeliyiz, çünkü Filipinler'den ayrılması Amerikan çıkarlarının geri çekilmesi ve bu kritik zamanda Pasifik'teki sorumluluklarımızı terk etmemiz olarak görülebilir."
 SEA_PHI_political_events.20.t:0 "Douglas MacArthur Filipinler'e Atandı"
 SEA_PHI_political_events.21.a:0 "Filipinler'e hoş geldiniz, General!"
 SEA_PHI_political_events.21.desc:0 "Mükemmel haber! Başkan [USA.GetLeader], General Douglas MacArthur'u Uzak Doğu'daki ABD Ordu Kuvvetleri'ne komuta etmesi için görevlendirdi. Emekliliği sırasında burada birkaç yıl askeri danışman olarak görev yaptığı için MacArthur'a çok aşinayız ve atanıp düzenli hizmete geri dönmesi, [USA.GetNameDef] devletinin savunmamız konusundaki sorumluluğunu ciddiye aldığının kesin bir işaretidir. \n \nManila'ya vardığında, derhal [USA.GetNameDef] devletinden kaynak sağlamaya girişti ve cesur Filipin halkının yanında herhangi bir saldırıya karşı sonuna kadar duracağına yemin etti."
 SEA_PHI_political_events.21.t:0 "Douglas MacArthur Filipinler'e Vardı"
 SEA_PHI_political_events.3.a:0 "Bu bize rekabet avantajı sağlayacak"
 SEA_PHI_political_events.3.b:0 "Herkesle aynı fiyatı alacaklar"
 SEA_PHI_political_events.3.desc:0 "Bağımsızlık yolları belirlenmişken, [FROM.GetNameDef] uluslarımız arasında bir ticaret anlaşması taslağıyla bize yaklaştı. Kaynaklarımızı ithal etmeyi onlar için daha cazip hale getirecek bir anlaşma öneriyorlar; oysa daha önce ticaret ortakları [FROM.GetAdjective] çıkarlar yerine [USA.GetAdjective] çıkarlara göre seçilmiş olabilir."
 SEA_PHI_political_events.3.t:0 "[FROM.GetName] Yeni Ticaret Anlaşması Öneriyor"
 SEA_PHI_political_events.30.a:0 "MacArthur ve Eisenhower birlikte mi çalışıyor? Kesinlikle!"
 SEA_PHI_political_events.30.b:0 "Hayır, Eisenhower'ı burada kullanmak daha önemli."
 SEA_PHI_political_events.30.desc:0 "Uzak Doğu'daki ABD Ordu Kuvvetleri Yüksek Komutanı Douglas MacArthur, himayesindeki Dwight D. Eisenhower'ın hizmetlerini talep etti. Eisenhower, MacArthur Ordu Şefi iken zaten onun emrinde görev yapmıştı ve belli ki yaşlı general onun potansiyelini görmüş. Biz de Eisenhower'ı Birleşik Devletler Ordusu içinde yükselen bir yıldız olarak görüyoruz ve böylesine aktif ve büyüyen bir komutanlıkta bulunmak ona çok fazla deneyim kazandırabilir. \n\nEisenhower'ın kendisi, bunu uzun vadeli bir atama olarak görmediğini ve MacArthur'dan ve aktif görevdeki bir kurmay subay olmaktan öğrenebileceği her şeyi öğrendikten sonra iki yıl içinde Amerika Birleşik Devletleri'ne dönmeyi planladığını vurguladı."
 SEA_PHI_political_events.30.t:0 "Eisenhower Filipinler Tarafından Talep Edildi"
 SEA_PHI_political_events.31.a:0 "Filipinler'e hoş geldiniz!"
 SEA_PHI_political_events.31.desc:0 "General MacArthur'un Dwight D. Eisenhower'ın Filipinler'de bize katılması yönündeki talebi onaylandı! Böyle yükselen bir yıldızın bize katılmasından dolayı şanslıyız ve bu, Amerika Birleşik Devletleri'nin korunmamıza ne kadar adanmış olduğunun bir başka kanıtı. Bize bunun kabaca iki yıllık kısa vadeli bir görev olacağı açıkça belirtildi, ancak Filipinler'de kalmasını teşvik etmenin bir yolu olabilir."
 SEA_PHI_political_events.31.t:0 "Dwight D. Eisenhower Filipinler'e Vardı"
 SEA_PHI_political_events.4.a:0 "Harika haber"
 SEA_PHI_political_events.4.desc:0 "[FROM.GetAdjective] temsilciler, uluslarımız arasında bir ticaret anlaşması oluşturmak üzere daha fazla delege göndereceklerini duyurdular. [FROM.GetNameDef] ile yapılacak böyle yeni bir anlaşma, kritik kaynaklarımızı kimden temin edeceğimiz konusunda bize daha fazla seçenek sunmayı vaat ediyor."
 SEA_PHI_political_events.4.t:0 "[FROM.GetName] Ticaret Anlaşmasını Kabul Ediyor"
 SEA_PHI_political_events.40.a:0 "Demokrasi meşalesi sönüyor!"
 SEA_PHI_political_events.40.b:0 "Polis Şefi Eisenhower devreye girecek!"
 SEA_PHI_political_events.40.desc:0 "Manuel Quezon bugün saat 15:00'te Luneta Parkı'nda destekçilerine bir konuşma yaparken suikaste uğradı. Silahlı saldırgan hala serbest, ancak Sakdalista hareketiyle bağlantılı olduğundan şüpheleniliyor. Bu arada, Ulusal Meclis ulusal güvenlik nedenleriyle kapatıldı. Jandarma Manila'da güçlü bir şekilde ortaya çıktı ve sokaklar boşaltıldı. Ülkenin üzerine rahatsız edici bir sessizlik çöktü, bundan sonra ne olacağına dair toplu bir nefes tutulmuş durumda."
 SEA_PHI_political_events.40.t:0 "Manuel Quezon Suikaste Kurban Gitti!"
 SEA_PHI_political_events.41.a:0 "Bağımsızlık gittikçe yaklaşıyor."
 SEA_PHI_political_events.41.desc:0 "Sürgünden çeşitli Japon silahlarıyla donanmış bir takipçi kadrosuyla dönen Artemio Ricarte, Manuel Quezon'un katilini bulup yakaladığını iddia etti ve şimdi başkanın öldürülmesinin neden olduğu kriz sırasında düzeni sağlamak için jandarma ile birlikte çalışma sözü veriyor. Sakdalista hareketine yöneltilen şüpheler nedeniyle, meşruiyet kazanmak ve böylece Amerika Birleşik Devletleri'nden bağımsızlığı mümkün olduğunca çabuk hızlandırmak için Ganap partisiyle çalışacağına söz verdi. Buna karşılık Jandarma, görünüşte gerilimi tırmandırmamak için Manila'dan çekildi, bu arada Amerikan garnizonu yüksek alarma geçirildi, ancak henüz herhangi bir hamle yapmadı."
 SEA_PHI_political_events.41.t:0 "Sürgündeki Sakdalistalar Geri Dönüyor"
 SEA_PHI_political_events.42.a:0 "Aguinaldo bizi daha önce bağımsızlığa taşıdı."
 SEA_PHI_political_events.42.b:0 "Ricarte'nin davamıza olan sarsılmaz bağlılığına ihtiyacımız var."
 SEA_PHI_political_events.42.c:0 "Laurel'in bağlantıları var."
 SEA_PHI_political_events.42.desc:0 "Artık Filipinler üzerinde kontrol sağlandığına ve istikrar geri dönmeye başladığına göre, Yürütme Komisyonu'nun toplanıp ulustaki nihai otoritenin nerede olduğuna karar verme zamanı geldi. Aralarından seçim yapılabilecek üç aday var. \n\nİspanyollara karşı devrimin kahramanı Emilio Aguinaldo, uzun süredir Filipin bağımsızlığının destekçisi ve Amerika Birleşik Devletleri altında Filipinler halkının Amerikan ihracatı için sadece bir tüketici pazarı olduğunu, hatta Filipinliler Amerika Birleşik Devletleri vatandaşı bile sayılmadığı için parya olduklarını dile getirdi. \n\nArtemio Ricarte, İspanya ve Amerika Birleşik Devletleri'ne karşı savaşlar sırasında Filipin Ordusu şefiydi, ardından Amerikalı işgalcilere sadakat yemini etmeyi reddettiği için sürgün edildi. Ülkeye olan sevgisi hiç azalmadı ve Japonya'da yaşarken bile nihai bağımsızlığımızı görmek için çalıştı. \n\nJosé Laurel, daha ılımlı bir seçim, bu Yüksek Mahkeme Yargıcı uluslararası eğitim almış ve Japon yetkililerle ailevi bağları var, bu nedenle Filipinler ile Japonlar arasında bağlar kurmak ve böylece bağımsızlık davamızı geliştirmek için iyi bir konumda olabilir."
 SEA_PHI_political_events.42.t:0 "Liderlik Mücadelesi"
 SEA_PHI_political_events.43.a:0 "İş artık [MacOrGarrison] kalmış durumda."
 SEA_PHI_political_events.43.desc:0 "Sürgünden çeşitli Japon silahlarıyla donanmış bir takipçi kadrosuyla dönen Artemio Ricarte, Manuel Quezon'un katilini bulup yakaladığını iddia etti, ancak Polis Şefi Eisenhower iddiayı reddetti ve adamın günah keçisi olması için para ödenmiş fakir bir köylü olduğunu belirtti. \n\nBuna karşılık grup, adaletin yerini bulmasını sağlamaya kararlı bir şekilde Ulusal Meclis'e yürüdü ve binaya baskın düzenledi. Girişte ateş açıldı ve yoldan geçen iki kişi vuruldu. Amerikan destekli muhafızlar suçlandı ve Eisenhower, gerilimi tırmandırma korkusuyla jandarmayı bölgeden çekmek zorunda kaldı. \n\nÇabalarına rağmen, çevre bölgelerden otobüslerle getirilen Sakdalista isyancıları tarafından kışkırtılan çeteler oluştu ve polisi tamamen alt etmekle tehdit etti. Çaresizlik içinde Eisenhower, yardım için [MessageToMac]acil bir mesaj gönderdi."
 SEA_PHI_political_events.43.t:0 "Ulusal Meclis Kuşatması"
 SEA_PHI_political_events.44.a:0 "Her şey özgürlük ve demokrasi adına!"
 SEA_PHI_political_events.44.desc:0 "Gerçekleştiğinde, [MacOrGarrison] tarafından verilen tepki ani ve ezici oldu. Hiçbir şansa bırakılmadan, tüm Filipin Tümeni Manila'ya konuşlandırıldı, önce süvariler hücum etti, hemen ardından süngü takmış piyadeler geldi. Daha inatçı bir direnişin olduğu yerlerde, direnişi temizlemek için göz yaşartıcı gaz kullanıldı. Ezici güç karşısında şaşkına dönen Sakdalista milisleri barikatlarını terk etmek zorunda kaldı ve şehirden uzaklaştı. \n\nFaşist bir darbenin ilk tehdidi engellenmiş olsa da, bir iç savaşa doğru daha geniş bir tırmanış tehlikesi hala devam ediyor ve bu nedenle [MacOrEisenhower], askeri olağanüstü hal ilan etmeyi, sıkıyönetim uygulamayı ve devam eden istikrarlı yönetimi sağlamak için diktatörlük yetkilerini üstlenmeyi uygun gördü."
 SEA_PHI_political_events.44.t:0 "Askeri Olağanüstü Hal"
 SEA_PHI_political_events.45.a:0 "Bu nüfuzumuzu genişletir"
 SEA_PHI_political_events.45.b:0 "[USA.GetNonIdeologyName] ile savaş riskine giremeyiz"
 SEA_PHI_political_events.45.desc:0 "[FROM.GetAdjective] hükümeti, [USA.GetNameDef] devletine karşı bir bağımsızlık mücadelesi planlarıyla bize yaklaştı. Bu planlar henüz harekete geçirilmedi, ancak [PHI.GetNameDef] bağımsızlık talep ettiğinde, taleplerini desteklememizi ve reddedilirse mücadelelerine katılmamızı istediler."
 SEA_PHI_political_events.45.t:0 "[FROM.GetName] Bağımsızlık İçin Destek İstiyor"
 SEA_PHI_political_events.46.a:0 "Mükemmel!"
 SEA_PHI_political_events.46.desc:0 "[FROM.GetAdjective] hükümetinden, nihai bağımsızlık talebimizi desteklemeye istekli olduklarını belirten bir mesaj aldık. Bu tek başına [ROOT.overlord.GetNameDef] devletini ikna etmeye yardımcı olsa da, [FROM.GetNameDef] ayrıca bağımsızlığa yönelik herhangi bir adımı geri almaya çalışırlarsa bizi askeri olarak destekleme sözü de verdi."
 SEA_PHI_political_events.46.t:0 "[FROM.GetName] Bağımsızlık Planlarımızı Destekliyor"
 SEA_PHI_political_events.47.a:0 "Sömürgeciliğin tasfiyesi hakkındaki söylemleri sadece laftan ibaretmiş"
 SEA_PHI_political_events.47.desc:0 "[FROM.GetNameDef] devletine gönderilen diplomatlarımız, hükümetlerinin bağımsızlığa yönelik adımlarımız için yardım sözü vermeyi reddetmesinin ardından hızla geri döndü. Bize yardım etmek istediklerini iddia etseler de, [ROOT.overlord.GetNameDef] ile bir savaşa girme riskini alamazlardı."
 SEA_PHI_political_events.47.desc.2:0 "[FROM.GetNameDef] devletine gönderilen diplomatlarımız, hükümetlerinin bağımsızlığa yönelik adımlarımız için yardım sözü vermeyi reddetmesinin ardından hızla geri döndü. Görünüşe göre bağımsız olmamıza yardım etmekten çok yeni hakim devletimiz olmakla ilgileniyorlar."
 SEA_PHI_political_events.47.t:0 "[FROM.GetName] Bağımsızlık Planlarını Desteklemeyi Reddetti"
 SEA_PHI_political_events.48.a:0 "Zaten onlara verecektik"
 SEA_PHI_political_events.48.b:0 "Henüz hazır değiller"
 SEA_PHI_political_events.48.desc:0 "Bugün erken saatlerde [FROM.GetNameDef] içinde düzensizlikler olduğuna dair raporlar aldık. Bunu takiben, hükümetlerinden bir bağımsızlık ilanı aldık; açıkça bizi müdahale etmemeye ikna etmeye çalışsalar da, yeni kazandıkları bağımsızlıklarını korumak için savaşmaktan kaçınmayacaklarını açıkça belirttiler."
 SEA_PHI_political_events.48.desc.2:0 "Bugün erken saatlerde [FROM.GetNameDef] içinde düzensizlikler olduğuna dair raporlar aldık. Bunu takiben, hükümetlerinden bir bağımsızlık ilanı aldık ve [JAP.GetAdjective] hükümetinden açık bir destek beyanı geldi. Açıklama bize müdahale etmememiz çağrısında bulunsa da, [FROM.GetAdjective] hükümeti, yeni kazandıkları bağımsızlıklarını korumak için [JAP.GetAdjective] desteğiyle savaşmaktan kaçınmayacaklarını açıkça belirtti."
 SEA_PHI_political_events.48.desc.3:0 "Bugün erken saatlerde [FROM.GetNameDef] içinde düzensizlikler olduğuna dair raporlar aldık. Bunu takiben, hükümetlerinden bir bağımsızlık ilanı aldık ve birkaç Güney Amerika hükümetinden açık bir destek beyanı geldi. Açıklama bize müdahale etmememiz çağrısında bulunsa da, [FROM.GetAdjective] hükümeti, yeni kazandıkları bağımsızlıklarını korumak için Güney Amerika desteğiyle savaşmaktan kaçınmayacaklarını açıkça belirtti."
 SEA_PHI_political_events.48.desc.4:0 "Bugün erken saatlerde [FROM.GetNameDef] içinde düzensizlikler olduğuna dair raporlar aldık. Bunu takiben, hükümetlerinden bir bağımsızlık ilanı aldık ve [SPR.GetAdjective] hükümetinden açık bir destek beyanı geldi. Açıklama bize müdahale etmememiz çağrısında bulunsa da, [FROM.GetAdjective] hükümeti, yeni kazandıkları bağımsızlıklarını korumak için [SPR.GetAdjective] desteğiyle savaşmaktan kaçınmayacaklarını açıkça belirtti."
 SEA_PHI_political_events.48.desc.5:0 "Bugün erken saatlerde [FROM.GetNameDef] içinde düzensizlikler olduğuna dair raporlar aldık. Bunu takiben, hükümetlerinden bir bağımsızlık ilanı aldık ve [SPR.GetAdjective] ile bazı Güney Amerika hükümetlerinden açık bir destek beyanı geldi. Açıklama bize müdahale etmememiz çağrısında bulunsa da, [FROM.GetAdjective] hükümeti, yeni kazandıkları bağımsızlıklarını korumak için Hispanik müttefiklerinin desteğiyle savaşmaktan kaçınmayacaklarını açıkça belirtti."
 SEA_PHI_political_events.48.t:0 "[FROM.GetName] Bağımsızlık İlan Ediyor"
 SEA_PHI_political_events.49.a:0 "Harika haber!"
 SEA_PHI_political_events.49.desc:0 "Bağımsızlık ilanımıza birkaç gün boyunca yanıt vermeyen ve muhtemelen [FROM.GetAdjective] liderliği arasında hararetli tartışmaların yaşandığı bir sürecin ardından, [FROM.GetNameDef] resmen [ROOT.GetAdjective] bağımsızlığını tanıyacağını duyurdu."
 SEA_PHI_political_events.49.t:0 "[FROM.GetName] Bağımsızlığa İzin Veriyor"
 SEA_PHI_political_events.5.a:0 "Kaynak satın alacak başka birini bulacağız"
 SEA_PHI_political_events.5.desc:0 "[FROM.GetNameDef] ile ticaret anlaşması için yaptığımız makul teklif reddedildi. Görünüşe göre diğer ticaret ortaklarıyla yapılan anlaşmalar veya jeopolitik kaygılar, hem bizim hem de kendi çıkarlarına aykırı hareket etmelerine neden oldu."
 SEA_PHI_political_events.5.t:0 "[FROM.GetName] Ticaret Anlaşmasını Reddediyor"
 SEA_PHI_political_events.50.a:0 "Bırakın denesinler!"
 SEA_PHI_political_events.50.desc:0 "Bağımsızlık ilanımıza yanıt olarak, [FROM.GetNameDef] resmi bir cevap vermedi ve müdahale etmek için yakın üslere birliklerini kaydırmaya başladı."
 SEA_PHI_political_events.50.t:0 "[FROM.GetName] Üzerimizdeki Kontrolü Geri Kazanmak İçin Savaşıyor"
 SEA_PHI_political_events.51.a:0 "Özlenecek"
 SEA_PHI_political_events.51.desc:0 "[USA.GetNameDef] içindeki askeri durumun yeterince vahim olduğu kanıtlandı ve $USA_douglas_macarthur$'dan derhal eve dönmesi istendi."
 SEA_PHI_political_events.51.t:0 "$USA_douglas_macarthur$ [USA.GetNameDef] Ülkesine Geri Çağrıldı"
 SEA_PHI_political_events.52.desc:0 "[USA.GetNameDef] içindeki askeri durumun yeterince vahim olduğu kanıtlandı ve $USA_dwight_d_eisenhower$'dan derhal eve dönmesi istendi."
 SEA_PHI_political_events.52.t:0 "$USA_dwight_d_eisenhower$ [USA.GetNameDef] Ülkesine Geri Çağrıldı"
 SEA_PHI_political_events.53.a:0 "Deneyimleri kesinlikle yararlı olacaktır"
 SEA_PHI_political_events.53.desc:0 "$USA_douglas_macarthur$'ın [PHI.GetNameDef] görevine katılan, 1935'ten beri bu görevde rol oynayan ve son zamanlarda daha aktif bir rol üstlenen $USA_dwight_d_eisenhower$ şimdi evine döndü. Görev sırasında, ilk kez uçak kullanmak ve $USA_douglas_macarthur$ gibi [PHI.GetAdjective] ordusunu reforme etme konusunda temelden farklı fikirlere sahip komutanlarla çalışmak da dahil olmak üzere değerli askeri deneyimler kazandı."
 SEA_PHI_political_events.53.t:0 "$USA_dwight_d_eisenhower$, [PHI.GetName] Devletinden Dönüyor"
 SEA_PHI_political_events.54.a:0 "Savaşa gerilla güçleriyle devam edebiliriz"
 SEA_PHI_political_events.54.desc:0 "Manila bölgesinin yakın zamanda kaybedilmesiyle, güçlerimiz geleneksel taktiklerle savaşı kazanma güvenini kaybetti. Ordu resmen teslim olurken ve hükümetimiz tahliye edilirken, düşmana direnmek için yeni örgütler şimdiden kuruluyor."
 SEA_PHI_political_events.55.a:0 "Onlar için iyi"
 SEA_PHI_political_events.55.b:0 "Artık eşitler olarak işbirliği yapabiliriz"
 SEA_PHI_political_events.55.c:0 "Biz de artık diplomatik bağımsızlığın peşinden gitmeliyiz"
 SEA_PHI_political_events.55.desc:0 "Önemli ekonomik ve siyasi hazırlıkların ardından, [PHI.GetNameDef] bağımsızlığını ilan etti. Bu durum beklendiği üzere, [PHI.GetAdjective] bağımsızlığı için bir rota çizen ve Kongre'nin 1934'te imzalayarak yasalaştırdığı Tydings-McDuffie yasasının ardından gerçekleşti. [PHI.GetNameDefCap] artık [USA.GetNameDef] baskısı olmadan kendi siyasi ve ekonomik politikalarını oluşturmakta özgür."
 SEA_PHI_political_events.55.t:0 "$PHI_treaty_of_manila$"
 SEA_PHI_political_events.56.a:0 "Kendi donanmamızı idare edebiliriz"
 SEA_PHI_political_events.56.b:0 "Yerel görev gücünü almalarına izin ver"
 SEA_PHI_political_events.56.c:0 "Pasifik Okyanusu'nu halletmelerine izin ver"
 SEA_PHI_political_events.56.d:0 "Pasifik Okyanusu'nu halletmelerine izin ver ama bir denetçi gönder"
 SEA_PHI_political_events.56.desc:0 "Bir donanma kurmak ve askeri çabalarımıza daha fazla katkıda bulunmak isteyen [FROM.GetNameDef], yakınlarında faaliyet gösteren bir veya daha fazla görev gücünü kontrollerine devretmemizi talep etti."
 SEA_PHI_political_events.56.e:0 "Pasifik Okyanusu'nu halletmelerine izin ver ve yakıt tedarik et"
 SEA_PHI_political_events.56.t:0 "[FROM.GetName] Pasifik Donanması Üzerinde Kontrol Talep Ediyor"
 SEA_PHI_political_events.57.a:0 "Bu, askeri yeteneklerimiz için büyük bir gelişme"
 SEA_PHI_political_events.57.desc:0 "Yerel [FROM.GetAdjective] deniz kuvvetleri üzerinde kontrol talebimiz hükümetleri tarafından onaylandı. Görev güçleri, yeniden organize edilmek üzere limanlarımıza emredildi."
 SEA_PHI_political_events.57.desc.2:0 "$SEA_PHI_political_events.57.desc$ Ek olarak, [371.GetName] bölgesindeki petrol sahaları, bu büyük edinimden sonra lojistiklerini desteklemek için güçlerimize yakıt üretecek şekilde ayarlandı."
 SEA_PHI_political_events.57.t:0 "Deniz Kuvvetleri Emanet Edildi"
 SEA_PHI_political_events.58.a:0 "Kendi donanmamızı inşa etmeye odaklanmak zorunda kalacağız"
 SEA_PHI_political_events.58.desc:0 "Ne yazık ki [FROM.GetAdjective] Müttefikimiz donanmalarını kısmen ordumuza devretme talebimizi reddetti. Deniz harekât alanına katkıda bulunmak istiyorsak tersane üretimini artırmamız gerekecek gibi görünüyor."
 SEA_PHI_political_events.58.t:0 "[FROM.GetName] Donanmayı Devretmeyi Reddetti"
 SEA_PHI_political_events.59.a:0 "Özgürlük galip geldi"
 SEA_PHI_political_events.59.b:0 "Savaş popülerliğini yitiriyordu"
 SEA_PHI_political_events.59.desc:0 "[USA.GetNameDef] yeni hükümetini devirmek için [PHI.GetNameDef] üzerine askeri bir müdahale başlatmış olsa da, bu plan başarılı olmadı. Her iki taraf da savaşın sadece uzadığını kabul ederken, savaşı sona erdirmek için müzakereler başladı ve [PHI.GetAdjective] bağımsızlığı artık tanınıyor."
 SEA_PHI_political_events.59.t:0 "[USA.GetAdjective] Müdahalesinin Başarısızlığı"
 SEA_PHI_political_events.6.a:0 "[FROM.GetAdjective] yoldaşlarımızla işbirliği için iyi bir başlangıç"
 SEA_PHI_political_events.6.desc:0 "[FROM.GetNameDef] içindeki [FROM.GetCommunistParty] partisinin artan nüfuzu meyvelerini veriyor; temsilcileri, güçlerimizi desteklemek için seferber olan [FROM.GetAdjective] bir gönüllü kuvvet hakkında bizi bilgilendirmek üzere Çin'i boydan boya geçti. Ayrıca, bu gönüllüler kendi birliklerimizi donatmaya yardımcı olmak için yedek teçhizat da getiriyorlar."
 SEA_PHI_political_events.6.t:0 "[FROM.GetName] Destek Sağlıyor"
 SEA_PHI_political_events.60.a:0 "Muhtemelen sadece yenilgiyi hazmedemiyor"
 SEA_PHI_political_events.60.desc:0 "1935 başkanlık seçimlerinin ardından, [ROOT.GetNeutralLeader] hala önemli yenilgisini kabullenmedi ve konuyu seçimlerden sorumlu konseye taşıyarak itiraz ediyor. Müdahale kanıtı bulunursa, parti konuyu muhtemelen ülkenin en yüksek mahkemelerinden birine taşıyacaktır."
 SEA_PHI_political_events.60.t:0 "Aguinaldo Seçim Sonuçlarını Sorguluyor"
 SEA_PHI_political_events.61.a:0 "Ülke için neyin en iyi olduğunu biliyorlar"
 SEA_PHI_political_events.61.desc:0 "Kapsamlı bir soruşturmanın ardından, 1935 seçim sonuçlarını incelemekten sorumlu konsey, usulsüzlük kanıtı bulduğunu iddia ediyor. Yargının [ROOT.GetDemocraticParty] partisini diskalifiye etmesi ve bunun sonucunda [ROOT.GetNeutralParty] zaferiyle sonuçlanması olmasaydı, bu tek başına çok dikkat çekici olmayabilirdi. [USA.GetAdjective] süreci hızla reddetme girişimleri, yolsuzluğun bir başka kanıtı olarak görüldüğü için feci şekilde ters tepti."
 SEA_PHI_political_events.61.t:0 "Yargı Seçimi İptal Etti"
 SEA_PHI_political_events.62.a:0 "Milliyetçiler Katolik değerlerimiz için savaşıyor"
 SEA_PHI_political_events.62.b:0 "Cumhuriyetçiler özgürlük ve hürriyet için savaşıyor"
 SEA_PHI_political_events.62.desc:0 "[SPR.GetNonIdeologyName] ile olan tarihi ve kültürel bağlarımız, oradaki çatışmanın halkımız tarafından yakından takip edilmesine neden oldu. "
 SEA_PHI_political_events.62.t:0 "İspanya İç Savaşı İçin Gönüllüler?"
 SEA_PHI_political_events.63.desc:0 "Mevcut başkan [ROOT.GetLeader] görev süresinin sonuna geliyor ve bir sonraki başkan için yakında seçimler yapılacak. [ROOT.GetLeader] liderliğinin başarıları, liderliğinin devam etme olasılığına dair umut verici bir tablo çizse de, bazı seçmenler reformlarımız için yeni bir yön ve onlara rehberlik edecek yeni bir başkan arıyor."
 SEA_PHI_political_events.63.keep_leader:0 "[ROOT.GetLeader] bir dönem daha kalmalı"
 SEA_PHI_political_events.63.laurel:0 "$PHI_jose_laurel$ bu kargaşa zamanlarında iyi bir lider olurdu"
 SEA_PHI_political_events.63.roxas:0 "$PHI_manuel_roxas$ bağlantıları ekonomik reformda yardımcı olurdu"
 SEA_PHI_political_events.63.t:0 "[GetYear] Başkanlık Seçimi"
 SEA_PHI_political_events.64.desc_generic:0 "[ROOT.GetLeader] mevcut dönemi sona erdi ve yeni bir başkanlık seçimi şimdi bir sonraki başkanımızı belirliyor. Kötüleşen sağlığı nedeniyle, $PHI_manuel_luis_quezon$ yarıştan çekildi."
 SEA_PHI_political_events.64.desc_quezon:0 "Tüberküloza yakalanmasının ardından, $PHI_manuel_luis_quezon$ sağlığının kademeli olarak kötüleşmesi ne yazık ki ölümüyle sonuçlandı. Ulus yas tutarken başkan yardımcısı Quezon'un eski görevlerini geçici olarak devraldı, ancak yakında bir halef belirlemenin zamanı gelecek."
 SEA_PHI_political_events.64.osmena:0 "$PHI_sergio_osmena$ gemiyi rotasında tutacak"
 SEA_PHI_political_events.64.t:0 "$PHI_manuel_luis_quezon$ Ölümü"
 SEA_PHI_political_events.65.a:0 "Yazık"
 SEA_PHI_political_events.65.desc:0 "Ne yazık ki, [ROOT.GetNameDef] içindeki [USA.GetAdjective] askeri misyonunu güçlendirme talebimiz reddedildi. [USA.GetNameDef] devletinin diğer askeri planları görünüşe göre onun uzmanlığını gerektiriyor."
 SEA_PHI_political_events.65.t:0 "Dwight D. Eisenhower [USA.GetName] Devletinde Kalıyor"
 SEA_PHI_political_events.66.a:0 "Bu, bölgede istikrar sağlayacaktır"
 SEA_PHI_political_events.66.b:0 "[USA.GetNameDef] devletini yabancılaştıramayız"
 SEA_PHI_political_events.66.desc:0 "[USA.GetAdjective] nüfuz alanındaki bir başka ülke olarak, [FROM.GetNameDef] şimdi Hispanik uluslardan oluşan bir ittifak yaratarak bu alan içindeki işbirliğini geliştirmeyi amaçlıyor. Bu, zaman zaman emperyalizmle sınırlanan [USA.GetAdjective] baskısına karşı bir denge unsuru sunabilir."
 SEA_PHI_political_events.66.t:0 "[FROM.GetName] Karşılıklı Yardım Antlaşması Öneriyor"
 SEA_PHI_political_events.67.a:0 "Harika haber"
 SEA_PHI_political_events.67.desc:0 "[FROM.GetNameDefCap], şimdi yürürlüğe girecek olan koşullu bir ittifakı ortaya koyan önerdiğimiz karşılıklı yardım antlaşmasını imzaladı. Bu, [FROM.GetAdjective]-[ROOT.GetAdjective] işbirliğini güçlendirmede net bir ilk adımdır."
 SEA_PHI_political_events.67.t:0 "[FROM.GetName] Karşılıklı Yardım Antlaşmasını İmzaladı"
 SEA_PHI_political_events.68.a:0 "Belki bölgedeki rakipleri daha istekli olur"
 SEA_PHI_political_events.68.desc:0 "İdeolojik farklılıklar veya belki de [USA.GetNameDef] devletini yabancılaştırma endişeleri, [FROM.GetNameDef] devletinin önerdiğimiz karşılıklı yardım antlaşmasını imzalamamasına neden oldu, görünüşe göre müttefikleri başka yerlerde bulmalıyız."
 SEA_PHI_political_events.68.t:0 "[FROM.GetName] Karşılıklı Yardım Antlaşmasını İmzalamıyor"
 SEA_PHI_political_events.69.a:0 "Birlikte kolonileştirilmemizin intikamını alabiliriz"
 SEA_PHI_political_events.69.b:0 "[FROM.capital.GetCapitalVictoryPointName] tarafından yönetilmeyeceğiz"
 SEA_PHI_political_events.69.desc:0 "Bağımsızlığını kazandığından beri, [FROM.GetNameDef] bağımsızlığını pekiştirmek için birçok adım attı ve şimdi diğer Hispanik ülkelerle işbirliğini genişletmek istiyor. Bu şimdi kendisini ülkemizi onlarınkiyle bir Hispanik İmparatorluğu'nda birleştirme önerisi olarak gösteriyor."
 SEA_PHI_political_events.69.t:0 "[FROM.GetName] Birleşme Öneriyor"
 SEA_PHI_political_events.7.a:0 "Harika bir ilk adım"
 SEA_PHI_political_events.7.desc:0 "[FROM.GetLeader] temsilcileri, gönüllülerimizin desteği ve sağlanan savaş malzemeleri için teşekkürlerini ilettiler. [FROM.GetAdjective] iç savaştaki kapsamlı tecrübeleri, bu kaynakların kesinlikle etkili bir şekilde kullanılacağı anlamına geliyor."
 SEA_PHI_political_events.7.t:0 "[FROM.GetName] Desteğimiz İçin Bize Teşekkür Ediyor"
 SEA_PHI_political_events.70.a:0 "Harika haber!"
 SEA_PHI_political_events.70.desc:0 "[ROOT.capital.GetCapitalVictoryPointName] şehrini ziyaret eden [FROM.GetAdjective] temsilciler dalgası, birkaç gün sonra onaylanan şeyi açıkça ortaya koydu: [FROM.GetNameDef], [ROOT.GetNameDef] ile birleşme talebimizi kabul etti."
 SEA_PHI_political_events.70.t:0 "[FROM.GetName] Birleşmeyi Kabul Ediyor"
 SEA_PHI_political_events.71.a:0 "Öyleyse belki farklılıklarımız sandığımızdan daha büyüktür"
 SEA_PHI_political_events.71.b:0 "Israr etmeliyiz"
 SEA_PHI_political_events.71.desc:0 "[FROM.GetNameDefCap] birleşme teklifimizi kabul etmemeye karar verdi. İttifakımızı değerli gördüklerini iletseler de, bunu çok ileri bir adım olarak değerlendirdiler."
 SEA_PHI_political_events.71.t:0 "[FROM.GetName] Birleşmeyi Reddetti"
 SEA_PHI_political_events.9.a:0 "Müthiş bir anlaşma."
 SEA_PHI_political_events.9.b:0 "O teçhizata ihtiyacımız var"
 SEA_PHI_political_events.9.desc:0 "Bir [PHI_GetTradedEquipment] sevkiyatı karşılığında, [FROM.GetNameDef] bize ticaret ve nakliye gemilerinden oluşan bir filo göndermeyi teklif ediyor."
 SEA_PHI_political_events.9.t:0 "[FROM.GetName], Askeri Teçhizat Karşılığında Gemi Satmayı Teklif Ediyor"
 SEA_PRC_border_war_events.1.a:0 "Gücümüz Artıyor!"
 SEA_PRC_border_war_events.1.b:0 "Geri çekilmeliyiz..."
 SEA_PRC_border_war_events.1.desc:0 "[1045.GetName] sınırı boyunca süren çatışmaların ardından, [PRC.GetNameDef] savunma hatlarını yarmayı ve düşmanını dışarı itmeyi başardı. [PRC.GetNameDefCap] şimdi eyaleti kendi mülkü ilan ediyor."
 SEA_PRC_border_war_events.1.t:0 "[PRC.GetNameDefCap], [1045.GetName] Eyaletini Fethediyor"
 SEA_PRC_border_war_events.2.a:0 "Geçici Bir Aksilik..."
 SEA_PRC_border_war_events.2.b:0 "İşgalcileri kovduk!"
 SEA_PRC_border_war_events.2.desc:0 "[1045.GetName] sınırı boyunca süren çatışmaların ardından, [PRC.GetNameDef] savunma hatlarını yarmayı ve düşmanını dışarı itmeyi başaramadı. Ancak [PRC.GetNameDefCap] bir miktar topçu ele geçirmeyi başardı."
 SEA_PRC_border_war_events.2.t:0 "[PRC.GetNameDefCap], [1045.GetName] Eyaletinden Geri Çekiliyor"
 SEA_PRC_border_war_events.3.desc:0 "[615.GetName] sınırı boyunca süren çatışmaların ardından, [PRC.GetNameDef] savunma hatlarını yarmayı ve düşmanını dışarı itmeyi başardı. [PRC.GetNameDefCap] şimdi eyaleti kendi mülkü ilan ediyor."
 SEA_PRC_border_war_events.3.t:0 "[PRC.GetNameDefCap], [615.GetName] Eyaletini Fethediyor"
 SEA_PRC_border_war_events.4.desc:0 "[615.GetName] sınırı boyunca süren çatışmaların ardından, [PRC.GetNameDef] savunma hatlarını yarmayı ve düşmanını dışarı itmeyi başaramadı. Ancak [PRC.GetNameDefCap] bir miktar topçu ele geçirmeyi başardı."
 SEA_PRC_border_war_events.4.t:0 "[PRC.GetNameDefCap], [615.GetName] Eyaletinden Geri Çekiliyor"
 SEA_PRC_border_war_events.5.desc:0 "[1032.GetName] sınırı boyunca süren çatışmaların ardından, [PRC.GetNameDef] savunma hatlarını yarmayı ve düşmanını dışarı itmeyi başardı. [PRC.GetNameDefCap] şimdi eyaleti kendi mülkü ilan ediyor."
 SEA_PRC_border_war_events.5.t:0 "[PRC.GetNameDefCap], [1032.GetName] Eyaletini Fethediyor"
 SEA_PRC_border_war_events.6.desc:0 "[1032.GetName] sınırı boyunca süren çatışmaların ardından, [PRC.GetNameDef] savunma hatlarını yarmayı ve düşmanını dışarı itmeyi başaramadı. Ancak [PRC.GetNameDefCap] bir miktar topçu ele geçirmeyi başardı."
 SEA_PRC_border_war_events.6.t:0 "[PRC.GetNameDefCap], [1032.GetName] Eyaletinden Geri Çekiliyor"
 SEA_PRC_faction_events.1.a:0 "Bu anlaşma bize daha çok yarıyor"
 SEA_PRC_faction_events.1.b:0 "Söz konusu bile olamaz!"
 SEA_PRC_faction_events.1.desc:0 "[FROM.GetLeader], [XIC.GetName] bölgesini aramızda bölüşmeye olan ilgimizi ölçmek için [ROOT.GetLeader] makamına bir elçi gönderdi."
 SEA_PRC_faction_events.1.t:0 "[FROM.GetNameDefCap] [1032.GetName] Eyaletini Talep Ediyor"
 SEA_PRC_faction_events.10.a:0 "Çin'in sorunları bizim kan davamızdan daha büyük"
 SEA_PRC_faction_events.10.b:0 "Liderliklerine asla boyun eğmeyeceğiz!"
 SEA_PRC_faction_events.10.desc:0 "Bazı arka kapı kanalları aracılığıyla [FROM.GetLeader] tarafından bize bir mesaj ulaştı ve görünüşe göre dağ köylerindeki izolasyon [FROM.GetNameDef] liderinde bir fikir değişikliğine neden olmuş. Şimdi Çin'i birleştirmek ve halkını dış tehditlerden korumak için yardımımızı istiyor. İlgi çekici bir teklif, ancak Komünistlere güvenilebilir mi?"
 SEA_PRC_faction_events.10.t:0 "[FROM.GetNameDefCap] Bir İttifak Öneriyor"
 SEA_PRC_faction_events.11.a:0 "Tüm Çin'i koruyacağız"
 SEA_PRC_faction_events.11.desc:0 "[FROM.GetNameDef]'nin lideri, Çin'i korumak ve birleştirmek için birleşik bir cephe oluşturma teklifimizi reddederek [FROM.GetLeader.GetSheHe]'nin ne kadar aptal olduğunu bir kez daha dünyaya gösterdi. Bu, halkımızı koruma görevinin tamamen bize düştüğü anlamına geliyor. Dünyaya göreve fazlasıyla hazır olduğumuzu kanıtlayacağız!"
 SEA_PRC_faction_events.11.t:0 "Aptal [FROM.GetLeader] Teklifimizi Reddediyor"
 SEA_PRC_faction_events.2.a:0 "Direnmek faydasız..."
 SEA_PRC_faction_events.2.b:0 "Bırakın denesinler!"
 SEA_PRC_faction_events.2.desc:0 "Görünüşe göre [FROM.GetName] lideri [FROM.GetLeader] ve [PRC.GetNameDef] lideri [PRC.GetLeader], tıpkı yılanlar gibi topraklarımızı aralarında paylaşmak için bir araya gelmişler. Orduları, korkakça girişimlerini engellemediğimiz takdirde her an sınırlarımızı geçmeye hazır bekliyor. Soru şu ki, ikisini de uzun süre engelleyebilir miyiz?"
 SEA_PRC_faction_events.2.t:0 "Yaklaşan İşgal"
 SEA_PRC_faction_events.20.a:0 "Adam doğruyu söylüyor!"
 SEA_PRC_faction_events.20.b:0 "Saçmalık!"
 SEA_PRC_faction_events.20.desc:0 "[FROM.GetLeader], [ROOT.GetFactionName] üyeleriyle yapılan son bir zirvede savaş çabalarını ve [?PRC_faction_leader_var.GetLeader] liderliğini açıkça sorguladı. Savaşın nasıl yönetildiğini ve yürütülme şeklini eleştirdi, [?PRC_faction_leader_var.GetName] liderini çatışmayı kasten uzatmakla suçladı. Bu, ittifak içinde daha fazla koz elde etmek için [FROM.GetLeader] tarafından yapılan bir oyun olabilir, ancak belki de suçlamalarında bir doğruluk payı vardır?"
 SEA_PRC_faction_events.20.t:0 "[FROM.GetLeader], [?PRC_faction_leader_var.GetName] Liderliğini Sorguluyor"
 SEA_PRC_faction_events.21.a:0 "Açık bir bilgelik işareti"
 SEA_PRC_faction_events.21.desc:0 "Görünüşe göre [ROOT.GetLeader] tarafından yapılan ve [?PRC_faction_leader_var.GetNameDef] liderliğinin [ROOT.GetFactionName] üzerindeki yönetimini eleştirdiği son konuşma, [FROM.GetName] lideri [FROM.GetLeader] üzerinde bir etki yarattı. [FROM.GetLeader], [FROM.GetName] desteğine sahip olduğumuzu garanti etti."
 SEA_PRC_faction_events.21.t:0 "[FROM.GetNameDefCap] Bize Desteğini Sunuyor"
 SEA_PRC_faction_events.22.a:0 "Kör bir aptal hala bir aptaldır"
 SEA_PRC_faction_events.22.desc:0 "[ROOT.GetLeader] tarafından yapılan son bir konuşmada, [?PRC_faction_leader_var.GetName] liderliğinin [ROOT.GetFactionName] üzerindeki yönetimini eleştirdi, bu da ittifak zirvesine katılan herkes tarafından hoş karşılanmadı. [FROM.GetName] lideri [FROM.GetLeader], [ROOT.GetFactionName] ittifakını zayıflatmaya ve üyelerini birbirine düşürmeye çalıştığı için [ROOT.GetLeader] kişisini açıkça azarladı."
 SEA_PRC_faction_events.22.t:0 "[FROM.GetLeader], [ROOT.GetLeader] Kişisini Azarladı"
 SEA_PRC_faction_events.3.a:0 "Bu sadece geçici bir aksilik!"
 SEA_PRC_faction_events.3.desc:0 "Görünüşe göre [FROM.GetName] lideri [FROM.GetLeader], elçilerimizi eli boş geri çevirerek en az diğerleri kadar aptalca davranıyor. Daha zayıf bir komşuyu ikimiz arasında bölüşme yönündeki cömert teklifimiz duymazdan gelindi."
 SEA_PRC_faction_events.3.t:0 "[FROM.GetLeader] Teklifimizi Reddediyor"
 SEA_PRC_faction_events.30.a:0 "Aslında pek bir seçeneğimiz yok..."
 SEA_PRC_faction_events.30.b:0 "Saçmalık!"
 SEA_PRC_faction_events.30.desc:0 "Görünüşe göre [FROM.GetNameDef] topraklarımıza sızmayı ve tebaamızın çoğunun sadakatini güvence altına almayı başardı. Şimdi bu bölgelerin resmen [FROM.GetNameDef] ülkesine devredilmesini talep ediyorlar. Reddedersek ne olacağı belirtilmedi, ancak güçlü bir tepki vermeleri muhtemel."
 SEA_PRC_faction_events.30.t:0 "[FROM.GetNameDefCap] Toprak Yeniden Dağıtımı Talep Ediyor"
 SEA_PRC_faction_events.31.a:0 "Akıllıca bir hareket"
 SEA_PRC_faction_events.31.desc:0 "[FROM.GetNameDefCap], başarıyla sızdığımız eyaletleri devretme 'isteğimizi' kabul etti ve bu da resmi topraklarımızda bir artışla sonuçlandı. [FROM.GetNameDefCap] bundan memnun değildi ama bize karşı çıkmaya cesaret edemedi. Bu bölge artık resmen [ROOT.GetNameDef] tarafından yönetilecek."
 SEA_PRC_faction_events.31.t:0 "[FROM.GetNameDefCap] İsteğimizi Kabul Ediyor"
 SEA_PRC_faction_events.32.a:0 "Yanlış adım uçurumu davet eder..."
 SEA_PRC_faction_events.32.b:0 "Hain müttefiklere müsamaha göstermeyeceğiz!\n§R[FROM.GetName] başka bir ittifaka katılmaya çalışabilir§!"
 SEA_PRC_faction_events.32.desc:0 "[FROM.GetNameDefCap], sızmayı başardığımız bölgeleri devretme isteğimizi reddetti."
 SEA_PRC_faction_events.32.t:0 "[FROM.GetNameDefCap] Uymayı Reddediyor"
 SEA_PRC_faction_events.4.a:0 "İşler yolunda gidiyor!"
 SEA_PRC_faction_events.4.desc:0 "[CHI.GetNameDef] ve [PRC.GetNameDef] birleşik tehdidi, [FROM.GetLeader] için çok fazla olmuş gibi görünüyor; taleplerimize boyun eğdi ve birliklerimizin [FROM.GetNameDef] içine direnişsiz yürümesine izin vermeyi kabul etti. Görünüşe göre güç haklıymış..."
 SEA_PRC_faction_events.4.t:0 "[FROM.GetNameDefCap] Taleplerimize Boyun Eğdi"
 SEA_PRC_faction_events.40.a:0 "Verilmeyen bir karar da alınmış bir karardır"
 SEA_PRC_faction_events.40.b:0 "İleriye doğru kendi yolumuzu çizeceğiz"
 SEA_PRC_faction_events.40.c:0 "Eski sadakatler bizi sadece geri tutacak"
 SEA_PRC_faction_events.40.d:0 "Tek bir, gerçek Çin var!"
 SEA_PRC_faction_events.40.desc:0 "Diğer Çin devletlerine nasıl yaklaşmak istediğimize karar vermemiz gereken bir dönüm noktasındayız. [ROOT.GetLeader] bunu birçok uykusuz gecede düşündü ve tüm Çin'i birleştirmek için ileriye giden tek bir yol olduğu açık görünüyor..."
 SEA_PRC_faction_events.40.e:0 "Birleştiğimizde daha güçlüyüz"
 SEA_PRC_faction_events.40.t:0 "İleriye Giden Yol - Çin'in Kaderi"
 SEA_PRC_faction_events.41.a:0 "Kim ayrılıyor yine?"
 SEA_PRC_faction_events.41.desc:0 "Görünüşe göre [FROM.GetLeader], [FROM.GetNameDef] ülkesinin [ROOT.GetFactionName] ittifakının sunduğu güç ve güvenlik olmadan daha iyi durumda olduğuna karar verdi. Biz olmadan nasıl idare edeceklerini sadece hayal edebiliriz!"
 SEA_PRC_faction_events.41.t:0 "[FROM.GetNameDefCap], [ROOT.GetFactionName] İttifakından Ayrılıyor"
 SEA_PRC_faction_events.42.a:0 "Onlar olmadan da idare ederiz"
 SEA_PRC_faction_events.42.desc:0 "Görünüşe göre [FROM.GetLeader], [FROM.GetNameDef] ve [FROM.GetFactionName] ittifakının biz olmadan daha iyi durumda olduğuna karar verdi. [FROM.GetLeader] kişisini böyle anlamsız bir karar almaya iten çılgınlık nedir bilinmiyor, ancak kesin olan bir şey var; bu bizi daha savunmasız bıraktı. [FROM.GetNameDef] neyin peşinde olduğunu sadece hayal edebiliriz, ancak kesinlikle iyi bir şey değil."
 SEA_PRC_faction_events.42.t:0 "[ROOT.GetNameDefCap], [FROM.GetFactionName] İttifakından Atıldı"
 SEA_PRC_faction_events.5.a:0 "Buna pişman olacaklar"
 SEA_PRC_faction_events.5.desc:0 "Görünüşe göre [FROM.GetName] lideri [FROM.GetLeader], [CHI.GetNameDef] ve [PRC.GetNameDef] ordularının birleşik tehdidine boyun eğmeyi reddederek ilk başta hayal edilenden daha sert bir kumaşa sahip. Bu meydan okuma aptalca olduğu kadar takdire şayan. [FROM.GetNameDef] silahlı kuvvetleri yakında gücümüzün önünde dağılacak!"
 SEA_PRC_faction_events.5.t:0 "[FROM.GetNameDefCap] Taleplerimizi Reddediyor"
 SEA_PRC_faction_events.50.a:0 "Hayır, [FROM.GetLeader] güvenilmez!"
 SEA_PRC_faction_events.50.b:0 "İleriye giden yolumuz birlikte yatıyor"
 SEA_PRC_faction_events.50.desc:0 "[FROM.GetLeader] bize bir heyet göndererek bizi kendi gruplarına katılmaya ikna etmeye çalışıyor. Çin'in geleceğinin belirsiz olduğu bir dönüm noktasında olduğumuzu söylüyorlar. [FROM.GetName] heyetine göre, tüm Çin'i birleştirmek için ileriye dönük tek bir yol var; o da birliktelik. [FROM.GetLeader]'nin [FROM.GetLeader.GetHerHis]'nin aklında ne gibi gizli amaçlar taşıdığını ve [FROM.GetLeader.GetSheHe]'ye güvenilecek olup olmadığını merak etmeden duramayız..."
 SEA_PRC_faction_events.50.t:0 "[FROM.GetNameDefCap] Bir İttifak Öneriyor"
 SEA_PRC_faction_events.51.a:0 "Gölgeleri kovalamak güneşi kaybetmektir"
 SEA_PRC_faction_events.51.desc:0 "[FROM.GetLeader] heyetimiz eve eli boş döndü, kötü haberler hariç. [FROM.GetNameDef] ülkesini ittifakımıza davet etme yönündeki cömert teklifimiz görünüşe göre güvensizlik ve kötü gizlenmiş bir küçümsemeyle karşılandı. Görünüşe göre [FROM.GetLeader], [FROM.GetNameDef] ülkesinin [ROOT.GetFactionName] ittifakının sunduğu güç ve güvenlik olmadan daha iyi durumda olduğuna karar verdi. Biz olmadan nasıl idare edeceklerini sadece hayal edebiliriz!"
 SEA_PRC_faction_events.51.t:0 "[FROM.GetNameDefCap] Teklifimizi Reddediyor"
 SEA_PRC_faction_events.52.a:0 "Karanlık günler onları bekliyor kesinlikle"
 SEA_PRC_faction_events.52.desc:0 "[FROM.GetLeader] tarafından, [FROM.GetNameDef] ülkesinin [ROOT.GetFactionName] ittifakından çekilmeye ve güçlerini [PRC.GetNameDef] ile birleştirmeye karar verdiğine dair bir haber aldık. [FROM.GetLeader] kişisini böyle anlamsız bir karar almaya iten çılgınlık nedir bilinmiyor, ancak zorlukları ve yıkımı davet etmek istiyorlarsa, yollarında duracak biz kim oluyoruz?"
 SEA_PRC_faction_events.52.t:0 "[FROM.GetNameDefCap], [ROOT.GetFactionName] İttifakından Ayrılıyor"
 SEA_PRC_faction_events.53.a:0 "Tüm Çin için harika bir gün!"
 SEA_PRC_faction_events.53.desc:0 "[FROM.GetNameDef] heyetimiz eve iyi haberlerle döndü. [FROM.GetLeader]'nin, ittifak teklifimizi imzalayarak [FROM.GetLeader.GetHerHim]'ye ilk başta itibar ettiğimizden çok daha akıllı bir hükümdar olduğu ortaya çıktı. Tamamen beklenmedik olmasa da, her zaman yağmur beklenmeli ve bunun yerine güneş parladığında daha da mutlu olunmalıdır. Bu, uluslarımızı ve [ROOT.GetFactionName]'yi büyük ölçüde güçlendirecektir."
 SEA_PRC_faction_events.53.t:0 "[FROM.GetNameDefCap], [ROOT.GetFactionName] İttifakına Katılıyor"
 SEA_PRC_faction_events.60.a:0 "[FROM.GetName] ülkesini [ROOT.GetFactionName] ittifakına kabul edeceğiz"
 SEA_PRC_faction_events.60.b:0 "Onlar olmadan daha iyiyiz"
 SEA_PRC_faction_events.60.t:0 "$generic.2.t$"
 SEA_PRC_faction_events.70.desc:0 "[FROM.GetLeader], bizi kendi hiziplerine katılmaya ikna etmeye çalışmak için bize bir heyet gönderdi. Asya'nın geleceğinin dengede olduğu bir dönüm noktasında durduğumuzu söylüyorlar. [FROM.GetName] heyetine göre, Batılı sömürgecilerden bağımsızlığımızı güvence altına almak için ileriye giden tek bir yol var - o da birlikte olmak."
 SEA_PRC_faction_events.71.a:0 "Pekala, daha iyi bir gelecek zamanı"
 SEA_PRC_faction_events.71.b:0 "Asla, onlar bizim"
 SEA_PRC_faction_events.71.desc:0 "[FROM.GetNameDef] tarafından gelen bir mektupta, [FROM.GetLeader] Asyalı tebaamızı yeni kurulan [FROM.GetFactionName] ittifakındaki velayetlerine bırakmamızı istiyor"
 SEA_PRC_faction_events.71.t:0 "[FROM.GetNameDefCap] Asyalı Tebaamızın Velayetini İstiyor"
 SEA_PRC_faction_events.72.a:0 "Hem teklifi hem de şartı kabul edeceğiz"
 SEA_PRC_faction_events.72.b:0 "Hayır, mevcut durumumuz yeterince makul"
 SEA_PRC_faction_events.72.desc:0 "[FROM.GetNameDefCap] bizi serbest bırakmayı teklif etti - tek bir şartla: Bağımsızlığımız ancak [FROM.FROM.GetNameDef]'in yeni kurulan [PRC.GetFactionName] ittifakına katılmamız durumunda verilecektir."
 SEA_PRC_faction_events.72.t:0 "[FROM.GetNameDefCap] Şartlı Olarak Özgürlüğümüzü Teklif Ediyor"
 SEA_PRC_faction_events.73.a:0 "Bu yeni bir şafak"
 SEA_PRC_faction_events.73.desc:0 "[FROM.FROM.GetNameDefCap], yeni hizbimize katılmaları şartıyla [FROM.GetNameDef] ülkesini serbest bırakmayı kabul etti ve [FROM.GetNameDef] kabul etti. [ROOT.Capital.GetName] içinde bir karşılama töreni yapılması planlanıyor"
 SEA_PRC_faction_events.73.t:0 "[FROM.FROM.GetNameDefCap] Kabul Ediyor — [FROM.GetNameDef], [PRC.GetFactionName] İttifakına Katılıyor"
 SEA_PRC_faction_events.74.a:0 "Kararlarını verdiler"
 SEA_PRC_faction_events.74.desc:0 "Teklife rağmen, [FROM.GetLeader], [FROM.GetAdjective] halkının tercihinin statüko olduğunu belirterek [FROM.GetNameDef] ülkesinin [PRC.GetNameDef] tarafından yeni kurulan [PRC.GetFactionName] ittifakına katılma teklifini reddettiğini duyurdu."
 SEA_PRC_faction_events.74.t:0 "[FROM.GetNameDefCap], [PRC.GetFactionName] İttifakına Katılmayı Reddediyor"
 SEA_PRC_faction_events.80.a:0 "Bırakın gelsinler ve denesinler"
 SEA_PRC_faction_events.80.b:0 "İtaat etmekten başka şansımız yok"
 SEA_PRC_faction_events.80.desc:0 "[FROM.capital.GetName] şehrinden, [FROM.GetLeader] açık mührünü taşıyan bir mesaj geldi. Birlik ve ulusal kaderin süslü dilinin arkasında bir talep yatıyor - boyun eğmeli ve [FROM.GetNameDef] yetkisini alanımız üzerinde kabul etmeliyiz. Müzakereye yer yok, sadece itaat veya sonuçlar."
 SEA_PRC_faction_events.80.t:0 "[FROM.GetName] Boyun Eğmemizi Talep Ediyor"
 SEA_PRC_faction_events.81.a:0 "O zaman diz çöktürülecekler"
 SEA_PRC_faction_events.81.desc:0 "Ültimatom reddedildi. Küstahça bir meydan okuma eyleminde, [FROM.GetLeader] halkının boyun eğmeyeceğini açıkça belirtti. Elçilerimiz reddedildiğine göre, diplomasi yerini savaşa bırakacak."
 SEA_PRC_faction_events.81.t:0 "[FROM.GetName] Cömert Teklifimizi Reddediyor"
 SEA_PRC_faction_events.82.a:0 "Parçalanmış bir güneş ışığını topluyor"
 SEA_PRC_faction_events.82.desc:0 "[FROM.GetName] ültimatomumuzu kabul etti. Liderleri ulusal birlik ve tarihi kaderden bahsediyor, ancak anlamı açık - artık [ROOT.GetNameDef] üstünlüğünü kabul ediyorlar.\nBoyun eğmeleri gönülsüz olsa da, Çin'i daha fazla bölünmeden ve kan dökülmesinden kurtarıyor."
 SEA_PRC_faction_events.82.t:0 "[FROM.GetName] Boyun Eğiyor"
 SEA_PRC_faction_events.90.a:0 "Evet, ortak bir düşmana karşı birleşmeliyiz"
 SEA_PRC_faction_events.90.b:0 "Hayır, onlara güvenemeyiz"
 SEA_PRC_faction_events.90.desc:0 "İkimizin de karşı karşıya olduğu mevcut saldırganlık ışığında, [FROM.GetNameDef] davamıza katılmak istiyor. Bu, onları ve [FROM.GetFactionName] ittifakının tüm üyelerini kabul etmek anlamına gelir."
 SEA_PRC_faction_events.90.t:0 "[FROM.GetNameDefCap], [ROOT.GetFactionName] İttifakına Katılmak İstiyor"
 SEA_PRC_faction_events.91.a:0 "Ne yazık!"
 SEA_PRC_faction_events.91.desc:0 "[FROM.GetNameDefCap], ortak düşmanımıza karşı ittifaklarına katılma teklifimizi reddetti. Açıklamalarında, birlikte daha güçlü olmamıza rağmen, [ROOT.GetNameDef] güvenilemeyeceği vurgulandı."
 SEA_PRC_faction_events.91.t:0 "[FROM.GetNameDefCap] Bizi Reddediyor"
 SEA_PRC_fourth_army_incident.1.a:0 "[PRC.GetNameDefCap] birliklerini daha iyi kontrol etmeli"
 SEA_PRC_fourth_army_incident.1.b:0 "Şüpheleri sadece doğal"
 SEA_PRC_fourth_army_incident.1.desc:0 "Komutanlarımız, [PRC.GetNameDef] ile olan ittifakımızın sürtüşmeye yol açtığını bildirdi. [PRC.GetNameDef] temsil eden komutanların emirlerimizi takip etmekte tereddüt ettikleri ve bazen onlara açıkça itaat etmedikleri, kendi birliklerimiz için sorun yaratma tehdidinde bulundukları bildiriliyor."
 SEA_PRC_fourth_army_incident.1.t:0 "Müttefikler Arasında Huzursuzluk"
 SEA_PRC_fourth_army_incident.10.a:0 "Bunun sonunda olacağını biliyorduk"
 SEA_PRC_fourth_army_incident.10.desc:0 "Yeni Dördüncü Ordu olayının ardından, [FROM.GetNameDef] eylemlerimizi bir saldırganlık eylemi olarak gördü ve iç savaşı yeniden başlattı. Daha yakın zamanda yan yana savunan birlikler cephede birbirleriyle savaşıyor ve cephe hatlarının arkasındaki durum çok daha iyi değil."
 SEA_PRC_fourth_army_incident.10.t:0 "[FROM.GetName] İç Savaşı Yeniden Başlatıyor"
 SEA_PRC_fourth_army_incident.11.a:0 "Bu yeterli olacaktır"
 SEA_PRC_fourth_army_incident.11.desc:0 "Yeni Dördüncü Ordu olayının ardından [FROM.GetLeader] eylem talebimize yanıt olarak, [FROM.GetLeader] liderliğimize resmi bir özür mektubu yazdı. Komutanlarına emirler konusundaki anlaşmazlıklar karşısında farklı hareket etmeleri talimatını vermeye çalışacağına söz veriyor."
 SEA_PRC_fourth_army_incident.11.t:0 "[FROM.GetLeader] Dost Ateşi Olayı İçin Özür Diledi"
 SEA_PRC_fourth_army_incident.12.a:0 "Artık ikimiz de daha acil konulara odaklanabiliriz"
 SEA_PRC_fourth_army_incident.12.desc:0 "Liderlerine gönderilen özür mektubuna yanıt olarak, [FROM.GetNameDef] bunu Yeni Dördüncü Ordu Olayı için gönülsüzce yeterli bir çözüm olarak kabul etti."
 SEA_PRC_fourth_army_incident.12.t:0 "[FROM.GetName] Özrü Kabul Ediyor"
 SEA_PRC_fourth_army_incident.2.a:0 "Neyse ki gerçek tehdide odaklanabiliriz"
 SEA_PRC_fourth_army_incident.2.desc:0 "Komutanlarımızla [FROM.GetNameDef] komutanları arasındaki bazı olaylardan sonra, hükümetleri bize gerginliği yatıştırmak isteyen bir mesaj gönderdi. Kendi birliklerimizin komutasını elimizde tutabileceğimizi resmen teyit ettiler ve planlarımızı koordine ederek daha ikili bir işbirliği kurmaya çalışıyorlar."
 SEA_PRC_fourth_army_incident.2.t:0 "[FROM.GetNameDefCap] Gerginliği Azaltmaya Çalışıyor"
 SEA_PRC_fourth_army_incident.3.a:0 "Birliklerimizin eylemlerine komutanlarımız karar verir, onlarınki değil"
 SEA_PRC_fourth_army_incident.3.b:0 "Belki de haklılar"
 SEA_PRC_fourth_army_incident.3.desc:0 "[FROM.GetNameDef] hükümeti, sahadaki komutanlarımız arasındaki koordinasyon eksikliği hakkında bize bir şikayette bulundu. Subaylarımızın [FROM.GetName] komutanlığından gelen emirlere uymaya isteksiz olduklarını ve hepsini gereksiz yere savunmasız pozisyonlarda bıraktıklarını belirten komutanlarından gelen raporları aktarıyorlar. Özellikle, [FROM.GetNameDef] devam eden taktiksel bir geri çekilmeye katılacağımızdan ve bunu iç çatışmalarla tehlikeye atmayacağımızdan emin olmamızı istiyor."
 SEA_PRC_fourth_army_incident.3.t:0 "[FROM.GetNameDefCap] Koordinasyon Eksikliğinden Şikayet Ediyor"
 SEA_PRC_fourth_army_incident.4.a:0 "Çok iyi"
 SEA_PRC_fourth_army_incident.4.desc:0 "[FROM.GetNameDef] komutanlığının itaatsizliği hakkındaki şikayetlerimizden sonra, hükümetleri onu geri adım atmaya ve stratejik planlarımızla işbirliği yapmaya başarıyla zorladı."
 SEA_PRC_fourth_army_incident.4.t:0 "[FROM.GetNameDefCap] Komutanlığı Azarladı"
 SEA_PRC_fourth_army_incident.5.a:0 "[CHI.GetLeader] tarafından eylem talep et"
 SEA_PRC_fourth_army_incident.5.b:0 "Bu ittifaka artık güvenemeyiz"
 SEA_PRC_fourth_army_incident.5.desc:0 "Komutanlığımızın katılmak istemediği bir geri çekilmeyi gerçekleştirirken milliyetçi güçler tarafından kuşatılan Yeni Dördüncü Ordu'nun neredeyse tamamen yok edildiğine dair raporlar aldık. Çatışmanın nasıl başladığına dair anlatılanlar muğlak, ancak dost ateşi olayı olarak başlamış olabilecek şey, her iki taraf da kasıtlı saldırı altında olduklarından şüphelendiğinde kısa sürede bir kan banyosuna dönüştü."
 SEA_PRC_fourth_army_incident.5.t:0 "Yeni Dördüncü Ordu Milliyetçi Güçler Tarafından Saldırıya Uğradı"
 SEA_PRC_fourth_army_incident.6.a:0 "Bu, eldeki sorunlardan gereksiz bir dikkat dağıtmadır"
 SEA_PRC_fourth_army_incident.6.desc:0 "[ROOT.GetName] birliklerinin [FROM.GetName] birlikleriyle savaştığı yakın tarihli bir olaydan sonra, ikincisi [ROOT.GetFactionName] ittifakından ayrıldı. [FROM.GetNameDef] Yeni Dördüncü Ordusu'nun çok ağır kayıplar verdiği olay, geri çekilme emirleri üzerine bir anlaşmazlığın ardından, geri çekilen birliklerimiz [FROM.GetName] askerleriyle karşılaştığında bilinmeyen bir tarafın ateş açmasıyla geldi."
 SEA_PRC_fourth_army_incident.6.t:0 "[FROM.GetName], Dost Ateşi Olayından Sonra [ROOT.GetFactionName] İttifakından Ayrılıyor"
 SEA_PRC_fourth_army_incident.7.a:0 "Bu sadece onların itaatsizliğine bağlanabilir"
 SEA_PRC_fourth_army_incident.7.b:0 "[FROM.GetNameDef] ile dostane ilişkiler sürdürmeye çalışmalıyız"
 SEA_PRC_fourth_army_incident.7.desc:0 "[ROOT.GetName] birliklerinin [FROM.GetName] birlikleriyle savaştığı yakın tarihli bir olaydan sonra, ikincisi bu olaya neden olmadaki rolümüzü kabul etmemizi ve komutanlarımızın daha dikkatli olacağına dair garantiler vermemizi talep ediyor. [FROM.GetNameDef] Yeni Dördüncü Ordusu'nun çok ağır kayıplar verdiği olay, geri çekilme emirleri üzerine bir anlaşmazlığın ardından, geri çekilen birliklerimiz [FROM.GetName] askerleriyle karşılaştığında bilinmeyen bir tarafın ateş açmasıyla geldi."
 SEA_PRC_fourth_army_incident.7.t:0 "[FROM.GetName] Dost Ateşi Olayından Sonra Eylem Talep Ediyor"
 SEA_PRC_fourth_army_incident.8.a:0 "Şu anda bir çatışmayı göze alamayız"
 SEA_PRC_fourth_army_incident.8.c:0 "Bu acil bir cevap gerektiriyor"
 SEA_PRC_fourth_army_incident.8.desc:0 "Yeni Dördüncü Ordu olayından sonra eylem talebimize yanıt olarak, [FROM.GetNameDef] herhangi bir hatayı kabul etmeye isteksiz oldu. Bu, ulusumuza ve savaş çabalarını destekleyen birliklere karşı açık bir güvensizlik ve hatta örtülü düşmanlık işaretidir."
 SEA_PRC_fourth_army_incident.8.t:0 "[FROM.GetName] Özür Dilemeyi Reddediyor"
 SEA_PRC_fourth_army_incident.9.a:0 "Beklendiği gibi"
 SEA_PRC_fourth_army_incident.9.desc:0 "Özür dilemememize rağmen, [FROM.GetNameDef], Yeni Dördüncü Ordu Olayı üzerindeki bu çatışmayı daha da tırmandırmaya isteksiz olduğunu gösterdi, ancak olayı kesinlikle hatırlayacaklar."
 SEA_PRC_fourth_army_incident.9.t:0 "[FROM.GetName] Geri Adım Atıyor"
 SEA_PRC_misc_events.1.a:0 "Bu böyle devam etmeyecek!"
 SEA_PRC_misc_events.1.desc:0 "Çin halkı yabancı işgalcilere karşı kararlılığımızdan şüphe etmeye başladı!"
 SEA_PRC_misc_events.1.t:0 "Halk Kararlılığımızdan Şüphe Ediyor"
 SEA_PRC_misc_events.10.a:0 "Her türlü uluslararası gönüllüyü kabul edeceğiz"
 SEA_PRC_misc_events.10.desc:0 "İspanyol İç Savaşı'nın emektar sahra doktoru ve Kanadalı bir komünist olan Norman Bethune, [ROOT.GetAdjective] halkının tıbbi bakım kalitesini iyileştirmesine yardımcı olmak için geldi. Daha önce mobil kan nakli istasyonu oluşturmadaki başarısıyla dikkat çeken çabaları, şimdi muhtemelen [ROOT.GetNameDef] uzak kırsal bölgelerindeki tıbbi uygulamaları iyileştirmeyi içerecek."
 SEA_PRC_misc_events.10.t:0 "Kanadalı Doktor Norman Bethune Geldi"
 SEA_PRC_misc_events.11.a:0 "Uygun bir methiye"
 SEA_PRC_misc_events.11.desc:0 "Acı haber [ROOT.Capital.GetName] şehrine ulaştı. Doktor Norman Bethune - halkımıza iki yıldan fazla bir süre özverili bir şekilde yardım ettikten sonra - parmağındaki görünüşte önemsiz bir kesik sonrasında ölümcül olan bir enfeksiyon nedeniyle vefat etti. [ROOT.GetLeader], bu haberi aldıktan sonra Bethune'un çalışmalarını öven bir methiye yazdı. Kaleme alınan övgü, doktorun yoldaşlarını desteklemek için dünyayı dolaşma istekliliğini ve farklı ülkelerin proletaryası arasındaki işbirliğine nasıl örnek olduğunu vurguluyor."
 SEA_PRC_misc_events.11.t:0 "Norman Bethune Vefat Etti"
 SEA_PRC_misc_events.12.a:0 "Yutulması zor bir hap"
 SEA_PRC_misc_events.12.desc:0 "Doğu sınırını koruma çabasıyla [SOV.GetNameDef], [JAP.GetNameDef] ile bir 'tarafsızlık paktı' imzaladı. Ancak bu, [JAP.GetNameDef] ülkesinin [SOV.GetAdjective] müdahalesi endişesi olmadan Asya'da genişlemek için serbest bırakılacağı anlamına geliyor."
 SEA_PRC_misc_events.12.t:0 "[SOV.GetAdjective]-Japon Saldırmazlık Paktı İmzalandı"
 SEA_PRC_misc_events.13.a:0 "Onlara Mançurya varlıklarımızı verin"
 SEA_PRC_misc_events.13.b:0 "Onlara Moğol varlıklarımızı verin"
 SEA_PRC_misc_events.13.c:0 "Onlara elimizdeki her şeyi verin"
 SEA_PRC_misc_events.13.d:0 "Onlara hiçbir şey vermeyin!"
 SEA_PRC_misc_events.13.desc:0 "[FROM.GetNameDef] tarafından, haklı olarak kendilerine ait olduğunu iddia ettikleri toprakları teslim etmemizi isteyen bir heyet aldık ve bu doğru olabilir... Belirli bir bakış açısından. [FROM.GetLeader], mecbur kalıp Çinlilere istediklerini verirsek çok minnettar olur ve reddedersek eşit derecede üzülürdü - o kadar ki [FROM.GetLeader.GetSheHe] toprağı zorla almayı düşünebilirdi. Veya en azından heyet böyle iddia ediyor..."
 SEA_PRC_misc_events.13.t:0 "[FROM.GetNameDefCap] Toprak Talep Ediyor"
 SEA_PRC_misc_events.14.a:0 "Birleşik Çin'e bir adım daha!"
 SEA_PRC_misc_events.14.desc:0 "[FROM.GetNameDef] heyetimiz harika haberlerle döndü! [FROM.GetLeader] kişisine haklı Mançurya topraklarımızı teslim etme talebimiz kabul edildi. [ROOT.GetLeader], bu başarıyı elde ettikleri için hem [FROM.GetLeader] hem de diplomatlarımızı övgüye boğdu."
 SEA_PRC_misc_events.14.t:0 "[FROM.GetNameDefCap] Mecbur Bırakıyor"
 SEA_PRC_misc_events.15.desc:0 "[FROM.GetNameDef] heyetimiz harika haberlerle döndü! [FROM.GetLeader] kişisine haklı Moğol topraklarımızı teslim etme talebimiz kabul edildi. [ROOT.GetLeader], bu başarıyı elde ettikleri için hem [FROM.GetLeader] hem de diplomatlarımızı övgüye boğdu."
 SEA_PRC_misc_events.16.desc:0 "[FROM.GetNameDef] heyetimiz harika haberlerle döndü! [FROM.GetLeader] kişisine [FROM.GetNameDef] tarafından tutulan haklı topraklarımızı teslim etme talebimiz kabul edildi. [ROOT.GetLeader], bu başarıyı elde ettikleri için hem [FROM.GetLeader] hem de diplomatlarımızı övgüye boğdu."
 SEA_PRC_misc_events.17.a:0 "Kör bir aptal hem kör hem de aptaldır"
 SEA_PRC_misc_events.17.b:0 "Bizim olanı zorla alacağız!"
 SEA_PRC_misc_events.17.desc:0 "[FROM.GetNameDef] heyetimiz üzgün bir ruh haliyle döndü. [FROM.GetLeader] kişisine haklı topraklarımızı teslim etme talebimiz ret ve küçümsemeyle karşılandı. [ROOT.GetLeader], hem [FROM.GetLeader] hem de diplomatlarımızı haklı olarak bizim olanı güvence altına alamadıkları için lanetliyor."
 SEA_PRC_misc_events.17.t:0 "[FROM.GetNameDefCap] Reddediyor"
 SEA_PRC_misc_events.18.a:0 "[326.GetName] Teslim Et"
 SEA_PRC_misc_events.18.b:0 "[729.GetName] Teslim Et"
 SEA_PRC_misc_events.18.c:0 "[728.GetName] Teslim Et"
 SEA_PRC_misc_events.18.d:0 "Her şeyi teslim et"
 SEA_PRC_misc_events.18.desc:0 "[FROM.GetNameDef] heyetimiz üzgün bir ruh haliyle döndü. [FROM.GetLeader] kişisine haklı topraklarımızı teslim etme talebimiz ret ve küçümsemeyle karşılandı. [ROOT.GetLeader], hem [FROM.GetLeader] hem de diplomatlarımızı haklı olarak bizim olanı güvence altına alamadıkları için lanetliyor."
 SEA_PRC_misc_events.19.a:0 "[FROM.GetNameDefCap], [326.GetName] Teslim Ediyor"
 SEA_PRC_misc_events.19.b:0 "[FROM.GetNameDefCap], [729.GetName] Teslim Ediyor"
 SEA_PRC_misc_events.19.c:0 "[FROM.GetNameDefCap], [728.GetName] Teslim Ediyor"
 SEA_PRC_misc_events.19.d:0 "[FROM.GetNameDefCap] her şeyi teslim ediyor"
 SEA_PRC_misc_events.19.desc:0 "[FROM.GetNameDef] taleplerimizi kabul ettiği için şanslıyız."
 SEA_PRC_misc_events.19.e:0 "[FROM.GetNameDefCap], [743.GetName] Bölgesini Teslim Ediyor"
 SEA_PRC_misc_events.2.a:0 "Bizim hakkımızdaki düşüncelerini değiştirmeliyiz"
 SEA_PRC_misc_events.2.desc:0 "Çin halkı yabancı işgalcilere karşı kararlılığımızdan şüphe etmeye başladı."
 SEA_PRC_misc_events.2.t:0 "Güven Kaybı"
 SEA_PRC_misc_events.3.a:0 "Büyük bir kayıp"
 SEA_PRC_misc_events.3.desc:0 "28 ½ Bolşeviklerin eski akıl hocası ve hem Çin komünist partisinin hem de Moskova Sun Yat-sen Üniversitesi'nin kıdemli bir figürü olan $PRC_pavel_mif$, [SOV.GetNameDef] ülkesinde tutuklandı ve tasfiye edildi. Görünüşe göre Mif'in Stalin'in eski rakipleriyle olan ilişkileri ölümcül oldu."
 SEA_PRC_misc_events.3.t:0 "$PRC_pavel_mif$ [SOV.GetNameDef] Ülkesinde Tutuklandı ve Tasfiye Edildi"
 SEA_PRC_misc_events.5.a:0 "Nihayet! Uzmanlığına ihtiyacımız olacak"
 SEA_PRC_misc_events.5.desc:0 "Milliyetçi güçlerden kaçınarak geçen üç yıldan fazla bir sürenin ardından, He Long ordusuna asgari hasarla [ROOT.capital.GetName] şehrine ulaştı. Long'un gerilla operasyonlarını yönetmek üzere Kızıl Ordu'ya katılmadan önce Milliyetçi güçleri komuta etme ve eğitme deneyimi işe yarayacak - ve ordusu da öyle."
 SEA_PRC_misc_events.5.t:0 "He Long ve İkinci Cephe Ordusu [ROOT.capital.GetName] Şehrine Ulaştı"
 SEA_PRC_misc_events.6.a:0 "Dünyaya gerçek yüzümüzü göstermek için bir fırsat"
 SEA_PRC_misc_events.6.desc:0 "Çin'in diğer bölgelerinde yıllarca gazeteci olarak çalıştıktan sonra, Amerikalı Edgar Snow röportaj yapmak için Mao'ya ulaştı. Devam eden röportaj dizisinde, Mao ve Snow esas olarak [JAP.GetAdjective] emperyalizmi ve [ROOT.GetNameDef] ve [CHI.GetNameDef] uluslarının buna direnmek için nasıl örgütlenebileceği hakkında konuştular, Mao özellikle Japonya'nın ciddi askeri yenilgilere uğraması durumunda bir devrim öngördü. Bu röportajlar ve Snow'un [ROOT.GetNameDef] içindeki deneyimleri, buradaki hayata dair eşsiz içgörülerini sunan bir kitabın temelini oluşturacak."
 SEA_PRC_misc_events.6.t:0 "Amerikalı Gazeteci Edgar Snow, Mao ile Röportaj Yapıyor"
 SEA_PRC_misc_events.8.a:0 "Bu yazılar kesinlikle etkili olacak"
 SEA_PRC_misc_events.8.desc:0 "Yan'an yakınlarındaki dağlarda, Anka Kuşu Tepesi'ndeki mağara evinden - [ROOT.GetCommunistParty] diğer liderleriyle paylaştığı - Mao, şiir yazmanın yanı sıra askeri taktiklerden siyasete kadar çeşitli konularda yazılar yazıyor."
 SEA_PRC_misc_events.8.t:0 "$PRC_mao_zedong$ İçin Verimli Bir Dönem"
 SEA_PRC_misc_events.9.a:0 "Bu bizi geleceğe taşımaya yardımcı olacak"
 SEA_PRC_misc_events.9.desc:0 "[JAP.GetNonIdeologyName] yenilgisinden sonra, Çin Komünist partisi önlerindeki yolu tartışmak için toplandı. 7. kongre, 1928'den bu yana yapılan ilk ulusal kongreyi ve zayıflamış bir parti nedeniyle önceki kongrenin Moskova'da yapılmasıyla Çin topraklarında toplanmaya dönüşü işaret ediyor. Tartışılan maddeler arasında [JAP.GetAdjective] güçlerine karşı taktiklerimizin başarıları ve başarısızlıkları vardı. Diğer noktalar arasında, [ROOT.GetLeader]'ın ulusumuzu ileriye en iyi nasıl taşıyacağına dair vizyonunu uygulamaya çalışan yeni bir anayasanın kabulü yer alıyordu."
 SEA_PRC_misc_events.9.t:0 "Çin Komünist Partisi 7. Ulusal Kongresi"
 SEA_PRC_political_events.1.a:0 "$PRC_wang_ming$ yönetsin"
 SEA_PRC_political_events.1.b:0 "$PRC_bo_gu$ yönetsin"
 SEA_PRC_political_events.1.desc1:0 "28 ½ Bolşeviklerin güç mücadelesinde galip gelmesiyle, ulusu yönetecek bir temsilci seçme zamanı geldi. [SOV.GetNameDef] sürgününe rağmen, $PRC_bo_gu$ onay almazsa, $PRC_wang_ming$ liderliğe dönme zamanı geldi."
 SEA_PRC_political_events.1.desc2:0 "28 ½ Bolşeviklerin güç mücadelesinde galip gelmesiyle, ulusu yönetecek bir temsilci seçme zamanı geldi. Her iki aday da [SOV.GetNameDef] komünistleriyle iyi bağlantılara sahip olsa da, $PRC_bo_gu$ daha az siyasi deneyime sahip. Ancak, $PRC_wang_ming$'in siyasi ve diplomatik zekasından daha ağır basarsa, gelecek mücadelelerde yararlı olabilecek askeri konularda derin bir anlayış gösteriyor. Her iki adam da görevi üstlenmeye hazır."
 SEA_PRC_political_events.1.t:0 "[Root.GetName] Lideri Olarak $PRC_wang_ming$ mi Yoksa $PRC_bo_gu$ mu?"
 SEA_PRC_political_events.10.a:0 "Ne yazık"
 SEA_PRC_political_events.10.desc:0 "Emperyalist [FROM.GetName], bizimle saldırmazlık paktı imzalama talebimizi reddetti. Görünüşe göre rakiplerimizle olan ilişkilere bizimle olanlardan daha fazla öncelik veriyorlar."
 SEA_PRC_political_events.10.t:0 "[FROM.GetName] Saldırmazlık Paktı İmzalamayı Reddediyor"
 SEA_PRC_political_events.11.a:0 "Özgür olsunlar"
 SEA_PRC_political_events.11.b:0 "Hayır, bizim tebaamız olarak kalacaklar"
 SEA_PRC_political_events.11.desc:0 "[FROM.GetLeader], [Root.GetLeader] kişisine bir telgraf göndererek [FROM.GetName] bağımsızlığını resmen talep etti. Telgraf reddedersek ne olacağını söylemiyor, ancak mutlu olmayacaklarını varsaymak güvenli."
 SEA_PRC_political_events.11.t:0 "[FROM.GetName] Özgür Olmak İstiyor"
 SEA_PRC_political_events.12.a:0 "Ne gün ama!"
 SEA_PRC_political_events.12.desc:0 "[ROOT.Capital.GetName] şehrinde muhteşem bir gün — [FROM.GetName] boyunduruğundan kurtulduk. Kutlama zamanı, zamanımız yaklaşıyor."
 SEA_PRC_political_events.12.t:0 "[FROM.GetName] Bizi Serbest Bırakmayı Kabul Ediyor"
 SEA_PRC_political_events.13.a:0 "Umutsuz zamanlar umutsuz önlemler gerektirir..."
 SEA_PRC_political_events.13.b:0 "Zamanımızı bekleyeceğiz..."
 SEA_PRC_political_events.13.desc:0 "Ne yazık — [ROOT.GetLeader]'ın telgrafına yanıt olarak [FROM.GetName], bağımsızlığımızı garanti etmeyi reddetti, bunun yerine kaderimizin açıklanamaz bir şekilde onlara bağlı olduğunu ilan etti."
 SEA_PRC_political_events.13.t:0 "[FROM.GetName] Bizi Serbest Bırakmayı Reddediyor"
 SEA_PRC_political_events.19.a:0 "Hainler, hepsi"
 SEA_PRC_political_events.19.desc:0 "Komünistlerle yeniden başlayan çatışmalar, bazı komutanlarımızın onlara katılması nedeniyle ordumuzu zayıflattı. [PRC.GetNameDef] ile gerçekten uyumlu olup olmadıklarını veya sadece rüzgarın estiği yolu takip edip etmediklerini zaman gösterecek."
 SEA_PRC_political_events.19.t:0 "Bazı Generallerimiz Taraf Değiştirdi!"
 SEA_PRC_political_events.2.a:0 "Yoldaşlarımızı korumalıyız"
 SEA_PRC_political_events.2.b:0 "Onları garanti edeceğiz — bağlı devletimiz olmayı kabul ederlerse"
 SEA_PRC_political_events.2.c:0 "Bu çok riskli"
 SEA_PRC_political_events.2.desc:0 "Desteğimize ve orta Çin dağlarındaki nispeten korunaklı yerlerine rağmen, [FROM.GetNameDef] çatışma durumunda onları koruma sözü vermemizi talep etti. Milliyetçi güçler veya yabancı emperyalizm tarafından başka bir anti-komünist kampanyadan korkup korkmadıkları belirsiz, ancak herhangi bir garanti vermeden önce bu tür çatışmalara sürüklenme riskini tartmamız gerekiyor."
 SEA_PRC_political_events.2.t:0 "[FROM.GetNameDefCap] Toprak Garantisi İstiyor"
 SEA_PRC_political_events.20.a:0 "Umut verici bir işaret!"
 SEA_PRC_political_events.20.desc:0 "Çin genelinde düşmanlıkların yeniden başlaması, düşman subayları arasında belirsizliğe neden oldu ve bazılarının bizim tarafımıza geçmesine neden oldu."
 SEA_PRC_political_events.20.t:0 "Çin Genelindeki Generaller Davamıza Akın Ediyor"
 SEA_PRC_political_events.21.a:0 "[FROM.GetNameDefCap] onların yardımından faydalanacaktır"
 SEA_PRC_political_events.21.b:0 "Evde onların uzmanlığına ihtiyacımız var"
 SEA_PRC_political_events.21.desc:0 "\nAskeri strateji konusunda [ROOT.GetAdjective] tavsiyesi arayan [FROM.GetNameDef], $SOV_vasily_chuykov$ ve $SOV_aleksandr_cherepanov$ kişilerinin Çin'e dönmesine izin vermemizi talep etti. Chuykov başlangıçta [FROM.GetNameDef] içinde konuşlanmıştı ve Çinceyi akıcı bir şekilde konuşuyor, ancak henüz Japonya tarafından işgal edilmediği zamanlarda Mançurya'daki [ROOT.GetAdjective] çıkarları konusundaki bir çatışmadan sonra geri çağrılmıştı."
 SEA_PRC_political_events.21.t:0 "[FROM.GetName], $SOV_vasily_chuykov$ ve $SOV_aleksandr_cherepanov$ Kişilerinin Onlara Tavsiye Vermesini İstiyor"
 SEA_PRC_political_events.22.a:0 "Tekrar hoş geldiniz!"
 SEA_PRC_political_events.22.desc:0 "\n[FROM.capital.GetName] içindeki temsilcilerimiz, [FROM.GetNameDef] ülkesinin $SOV_vasily_chuykov$ kişisinin Çin'e dönmesine izin verme isteğimizi kabul ettiği haberiyle bizimle iletişime geçti ve onun [ROOT.GetNameDef] yolunda olduğunu bize bildirdi. Ek olarak, $SOV_aleksandr_cherepanov$ ona katıldı."
 SEA_PRC_political_events.22.t:0 "[FROM.GetName], $SOV_vasily_chuykov$ ve $SOV_aleksandr_cherepanov$ Göndermeyi Kabul Ediyor"
 SEA_PRC_political_events.23.a:0 "Belki de tasfiyelerden sonra çok az yetenekli komutan kalmıştır"
 SEA_PRC_political_events.23.desc:0 "\n$SOV_vasily_chuykov$'un [ROOT.GetNameDef] içinde bir ataşe olarak uygunluğuna rağmen, [FROM.GetNameDef] ne onu ne de $SOV_aleksandr_cherepanov$'ı göndermemeye karar verdi ve şu anda daha önemli askeri planlarla meşgul olduklarını iddia etti."
 SEA_PRC_political_events.23.t:0 "[FROM.GetName], $SOV_vasily_chuykov$ ve $SOV_aleksandr_cherepanov$ Göndermeyi Reddediyor"
 SEA_PRC_political_events.24.a:0 "[FROM.GetNameDef] yoldaşlarımıza yardım edeceğiz"
 SEA_PRC_political_events.24.b:0 "[CHI.GetName] içinde iyi iş çıkarıyorlar"
 SEA_PRC_political_events.24.desc:0 "\n$SOV_vasily_chuykov$ ve $SOV_aleksandr_cherepanov$'un [CHI.GetNameDef] görevini duyan [FROM.GetNameDef], onları ataşe olarak ağırlamaya da ilgi gösterdi. [FROM.GetNameDefCap], komutanların Çince akıcılığı ile kapsamlı askeri deneyimi birleştiren pratik beceri setini fark etmiş gibi görünüyor veya belki de sadece [CHI.GetName] ülkesini bu uzmanlıktan mahrum bırakmak istiyorlar."
 SEA_PRC_political_events.24.t:0 "[FROM.GetName], $SOV_vasily_chuykov$ ve $SOV_aleksandr_cherepanov$ Kişilerini Yeniden Atamamızı İstiyor"
 SEA_PRC_political_events.25.a:0 "Ordumuz için bir kayıp"
 SEA_PRC_political_events.25.desc:0 "\n[PRC.GetNameDef] tarafından $SOV_vasily_chuykov$ ve $SOV_aleksandr_cherepanov$ kişilerinin bölgelerine yeniden konuşlandırılması talebinin ardından, onların yönünde seyahat etmeye başladılar. Danışman olarak kalmaları yönündeki çağrımıza rağmen, [FROM.GetNameDef] tarafından kendilerine verilen emirlere uymamazlık edemediler."
 SEA_PRC_political_events.25.t:0 "[FROM.GetName], $SOV_vasily_chuykov$ ve $SOV_aleksandr_cherepanov$ Kişilerini [PRC.GetName] İçine Emrediyor"
 SEA_PRC_political_events.26.a:0 "Bakalım ne gibi önerileri var"
 SEA_PRC_political_events.26.desc:0 "\n[FROM.GetNameDefCap] talebimizi onurlandırmaya karar verdi ve $SOV_vasily_chuykov$ ile $SOV_aleksandr_cherepanov$ kişilerinin [ROOT.GetNameDef] içine yerleşmesini emretti. Tavsiyeleri şüphesiz değerli olacak ve yer değiştirme [CHI.GetNameDef] ordusuna bir darbe olacak."
 SEA_PRC_political_events.26.t:0 "[FROM.GetName], $SOV_vasily_chuykov$ ve $SOV_aleksandr_cherepanov$ Kişilerini [PRC.GetName] İçine Emrediyor"
 SEA_PRC_political_events.27.a:0 "Hata yapıyorlar"
 SEA_PRC_political_events.27.desc:0 "\n[FROM.GetNameDef] tarafından daha önce sağlanan desteğe rağmen, $SOV_vasily_chuykov$ ve $SOV_aleksandr_cherepanov$'un [CHI.GetNameDef] içindeki görevlerini sonlandırmayı reddederek, komutanları burada ataşe olarak konuşlandırmamızı engellediler. [CHI.GetNameDef] ordusunun şu anda [FROM.GetNameDef] için büyük önem taşıdığını savunuyorlar."
 SEA_PRC_political_events.27.t:0 "[FROM.GetName], $SOV_vasily_chuykov$ ve $SOV_aleksandr_cherepanov$ Göndermeyi Reddediyor"
 SEA_PRC_political_events.3.a:0 "Bu bizi güvende tutmalı"
 SEA_PRC_political_events.3.desc:0 "[FROM.GetNameDef] görevimiz başarılı oldu ve karşılaşabileceğimiz her türlü tehdide karşı bizi koruma sözü verdiler. Bu koruma, aksi takdirde başka bir taktiksel geri çekilmenin potansiyel aciliyeti nedeniyle tehlikeye giren [ROOT.capital.GetName] şehrini geliştirmek gibi uzun vadeli hedeflere odaklanmamızı sağlamalıdır."
 SEA_PRC_political_events.3.t:0 "[FROM.GetNameDefCap] Toprak Garantisini Kabul Ediyor"
 SEA_PRC_political_events.31.a:0 "Bu bizi güvende tutmalı"
 SEA_PRC_political_events.31.b:0 "Tekrar düşününce... yapmayalım"
 SEA_PRC_political_events.31.desc:0 "[FROM.GetNameDef] görevimiz başarılı oldu ve karşılaşabileceğimiz her türlü tehdide karşı bizi koruma sözü verdiler. Bu koruma, aksi takdirde başka bir taktiksel geri çekilmenin potansiyel aciliyeti nedeniyle tehlikeye giren [ROOT.capital.GetName] şehrini geliştirmek gibi uzun vadeli hedeflere odaklanmamızı sağlamalıdır."
 SEA_PRC_political_events.31.t:0 "[FROM.GetNameDefCap] Toprak Garantisini Kabul Ediyor — Bir Bedel Karşılığında"
 SEA_PRC_political_events.32.a:0 "Kendi kayıpları"
 SEA_PRC_political_events.32.desc:0 "[FROM.GetNameDefCap], onları garanti etmemiz şeklindeki diplomatik seçeneği artık sürdürmek istemediklerini yanıtladı. Görünüşe göre bağlı devlet olma ilkesi onlar için katlanılamayacak kadar fazlaydı."
 SEA_PRC_political_events.32.t:0 "[FROM.GetNameDefCap] Kararından Pişman"
 SEA_PRC_political_events.4.a:0 "Ne yazık"
 SEA_PRC_political_events.4.desc:0 "Diplomatlarımızın en iyi çabalarına rağmen, [FROM.GetNameDef], [ROOT.GetNameDef] korumayı taahhüt etmeyi reddetti. Sadece bu tür koruma vaatlerinin zaten gerekli olmayacağını umabiliriz."
 SEA_PRC_political_events.4.t:0 "[FROM.GetName] Bizi Garanti Etmeyi Reddediyor"
 SEA_PRC_political_events.41.a:0 "Huzursuz bir ittifak"
 SEA_PRC_political_events.41.desc:0 "Yıllardır siyasi rakip olan $PRC_mao_zedong$ ve $PRC_zhang_guotao$, tehlikeli durumumuz karşısında farklılıklarını bir kenara bırakmak için [ROOT.Capital.GetName] şehrinde bir araya geldiler. İkisi de diğerine tam olarak güvenmese de, düşmanımızın düşmanı gerçekten dosttur."
 SEA_PRC_political_events.41.t:0 "İsteksiz İkili Yönetim"
 SEA_PRC_political_events.42.a:0 "Onları tekrar aramıza hoş geldiniz"
 SEA_PRC_political_events.42.b:0 "Onları eski durumuna getirin ancak yakından izleyin"
 SEA_PRC_political_events.42.c:0 "Hainler bir kere hainler her zaman"
 SEA_PRC_political_events.42.desc:0 "[PRC.GetNameDef] kırıldığında, bizi kendileri için terk eden memurların gidecek hiçbir yeri kalmadı. Bazıları aracılar aracılığıyla haber göndererek sadece rüzgara boyun eğdiklerini ve sadakatlerinin hiçbir zaman gerçek anlamda ele geçirilmediğini iddia ediyor. Diğerleri hiçbir şey söylemez ve onlarla ne yapmayı planladığımızı öğrenmek için beklerler."
 SEA_PRC_political_events.42.t:0 "Savurgan Subaylar"
 SEA_PRC_political_events.43.a:0 "Onları işe geri koyun"
 SEA_PRC_political_events.43.b:0 "İhanetlerinin hesabını verecekler"
 SEA_PRC_political_events.43.desc:0 "Komünistlerin safına geçen bir avuç subayın dönecek bir evi kalmadı, bir zamanlar hizmet ettikleri klikler onlar gidince silinip gitti. Tüm Çin'in hükümeti olarak onlara ne olacağı sorusu artık bize düşüyor."
 SEA_PRC_political_events.43.t:0 "Ustası Olmayan Subaylar"
 SEA_PRC_political_events.5.a:0 "İçeri alın"
 SEA_PRC_political_events.5.b:0 "Aşırı genişleme riskini alamayız"
 SEA_PRC_political_events.5.desc:0 "[FROM.GetNameDefCap], bizimle işbirliğini genişletme arayışında bir adım daha atarak [ROOT.GetFactionName] ittifakına katılmayı talep etti. Bunu [ROOT.GetFactionName] ittifakının Çin'e yararlı bir genişlemesi olarak mı göreceğimize yoksa böyle bir ittifakın potansiyel bir yük mü olacağına karar vermeliyiz."
 SEA_PRC_political_events.5.t:0 "[FROM.GetName], [ROOT.GetFactionName] İttifakına Katılmak İstiyor"
 SEA_PRC_political_events.6.a:0 "Yeni bir gün"
 SEA_PRC_political_events.6.desc:0 "[FROM.GetNameDef] heyetimiz, [FROM.GetFactionName] ittifakına kabul edildiğimizi duyurmak üzere eve döndü. Onlarla birlikte, [FROM.GetAdjective] diplomatları işbirliğimizin nasıl görünebileceğini tartışmak üzere geldi."
 SEA_PRC_political_events.6.t:0 "[FROM.GetName], [FROM.GetFactionName] İttifakına Katılmamızı Kabul Ediyor"
 SEA_PRC_political_events.7.a:0 "Ne yazık"
 SEA_PRC_political_events.7.desc:0 "[FROM.GetName] ülkesine gönderdiğimiz diplomatlar, [FROM.GetFactionName] ittifakına katılmamıza izin verilmediği haberiyle döndüler. Görünüşe göre [FROM.GetNameDef] diplomatik çabalarını başka bir yere odaklıyor."
 SEA_PRC_political_events.7.t:0 "[FROM.GetName], [FROM.GetFactionName] İttifakına Katılmamızı Reddediyor"
 SEA_PRC_political_events.8.a:0 "Zaten dahil olmak istemiyoruz"
 SEA_PRC_political_events.8.b:0 "Bu onları daha agresif davranmaya itebilir"
 SEA_PRC_political_events.8.desc:0 "Kendini potansiyel düşmanlarla çevrili gören [FROM.GetNameDef], kendilerine yönelik bölgedeki herhangi bir çatışmada pasifliğimizi sağlamak için bir saldırmazlık paktı arayışıyla bize yaklaştı."
 SEA_PRC_political_events.8.t:0 "[FROM.GetName] Saldırmazlık Paktı İmzalamak İstiyor"
 SEA_PRC_political_events.9.a:0 "Bu bir rahatlama"
 SEA_PRC_political_events.9.desc:0 "Dikkatli bir değerlendirmeden sonra, [FROM.GetNameDef] önerdiğimiz saldırmazlık paktını imzalamaya karar verdi. Neyse ki bölgedeki çatışmalara dahil olmakla ilgilenmiyor gibi görünüyorlardı."
 SEA_PRC_political_events.9.t:0 "[FROM.GetName] Saldırmazlık Paktı İmzalamayı Kabul Ediyor"
 SEA_PRC_request_aid.1.a:0 "Elimizden geleni gönderin"
 SEA_PRC_request_aid.1.b:0 "Hiçbir şey veremeyiz"
 SEA_PRC_request_aid.1.desc:0 "Geçmişte [FROM.GetNameDef] ülkesine sık sık verdiğimiz destek nedeniyle, onlara teçhizat sağlamamızı bir kez daha talep ediyorlar. Bu talep, yakın zamanda sona eren ve onlara insan gücü ve malzeme açısından ağır kayıplara mal olan Uzun Yürüyüş ile ilgili olabilir."
 SEA_PRC_request_aid.1.t:0 "[FROM.GetName] Silah Talep Ediyor"
 SEA_PRC_request_aid.10.a:0 "Mükemmel!"
 SEA_PRC_request_aid.10.desc:0 "[FROM.GetNameDefCap], ulusu geliştirme kapasitemizi büyük ölçüde artıracak bir Teknolojik İşbirliği Anlaşması imzalamayı kabul etti."
 SEA_PRC_request_aid.10.t:0 "[FROM.GetName] Teknolojik İşbirliği Anlaşmasının İmzalandığını Duyuruyor"
 SEA_PRC_request_aid.11.a:0 "Ne yazık!"
 SEA_PRC_request_aid.11.desc:0 "[FROM.GetNameDefCap], iç ihtiyaçlara öncelik verilmesi gerektiğini gerekçe göstererek Teknolojik İşbirliği Anlaşması imzalamayı reddetti. Davamıza sempati duysalar da, bu çaba için herhangi bir kaynak ayıramadılar."
 SEA_PRC_request_aid.11.t:0 "[FROM.GetName] Teknolojik İşbirliği Anlaşmasını Reddediyor"
 SEA_PRC_request_aid.2.a:0 "Mükemmel, iyi kullanacağımızdan emin olacağız"
 SEA_PRC_request_aid.2.desc:0 "[FROM.GetNameDefCap] talep ettiğimiz teçhizatı göndermeyi kabul etti. Bu büyük sevkiyat, birkaç yeni tümeni sahaya sürmemize olanak tanıyacak ve destek bölüklerinin kurulmasını sağlayacak uzman ekipmanı sağlayacak."
 SEA_PRC_request_aid.2.t:0 "[FROM.GetName] Yardım Gönderiyor"
 SEA_PRC_request_aid.21.a:0 "Bu harika bir haber, onları çok iyi kullanacağız!"
 SEA_PRC_request_aid.21.desc:0 "[SOV.GetNameDef] ülkesinden 150 yeni inşa edilmiş T-34 tankımızı taşıyan bir sevkiyat [ROOT.Capital.GetName] şehrine ulaştı. Sevkiyatı alanlar arasında [ROOT.GetName] hükümetinden temsilciler ve Halk Kurtuluş Ordusu Kara Kuvvetleri'nin önde gelen subayları vardı. HKOKK sembolüyle boyanmış tankları inceleyen subaylar, tank mürettebatı için bir eğitim ve alışma döneminden sonra onları konuşlandırmaya hevesliydi."
 SEA_PRC_request_aid.21.t:0 "[FROM.FROM.GetName] Ülkesinden Yeni İnşa Edilen Tanklar Geldi"
 SEA_PRC_request_aid.3.a:0 "Başka bir kaynak bulmak zorunda kalacağız"
 SEA_PRC_request_aid.3.desc:0 "[FROM.GetNameDef] yardım talebimiz reddedildi, [FROM.GetAdjective] yetkilileri [FROM.GetNameDef] ülkesinin son bir yeniden yapılanmadan sonra verecek çok az teçhizatı olduğunu belirtti."
 SEA_PRC_request_aid.3.t:0 "[FROM.GetName] Yardım Göndermeyi Reddediyor"
 SEA_PRC_request_aid.31.a:0 "Çok fazla verebiliriz"
 SEA_PRC_request_aid.31.a.tt:0 "§Y[FROM.GetName]§! ülkesine §R350 BT-7 Tankı§! göndermeyi kabul edeceğiz"
 SEA_PRC_request_aid.31.b:0 "Biraz verebiliriz"
 SEA_PRC_request_aid.31.b.tt:0 "§Y[FROM.GetName]§! ülkesine §R100 BT-7 Tankı§! göndermeyi kabul edeceğiz"
 SEA_PRC_request_aid.31.c:0 "En azından inşa etmeye yardım edebiliriz"
 SEA_PRC_request_aid.31.c.tt:0 "§Y[FROM.GetName]§! için §R150 BT-7 Tankı§! üretmeyi kabul edeceğiz"
 SEA_PRC_request_aid.31.desc:0 "[FROM.GetNameDef], zırhlı bir savaş gücü oluşturmak için gereken sanayi kapasitesine ve deneyime sahip olmadığı için, [FROM.GetLeader] yardımımız için bir talep gönderdi. [FROM.GetNameDefCap], mükemmel arazi hızları nedeniyle özellikle BT-7 hafif tanklarımızı istiyor. Nasıl yanıt vermeliyiz?"
 SEA_PRC_request_aid.31.e:0 "[FROM.GetNameDef] talebini reddet"
 SEA_PRC_request_aid.31.t:0 "[FROM.GetName] Tank Talep Ediyor"
 SEA_PRC_request_aid.32.a:0 "Harika bir şeyin başlangıcı"
 SEA_PRC_request_aid.32.desc:0 "BT-7 tank talebimize yanıt olarak, [FROM.GetName] bize büyük miktarda göndermeyi kabul etti - en az 350 (çoğunlukla) yepyeni BT-7! Generallerimiz, yeni işe alınan tank mürettebatı için eğitim programları ayarlamak da dahil olmak üzere bunları en iyi nasıl konuşlandıracaklarına dair bir plan hazırlıyorlar."
 SEA_PRC_request_aid.32.t:0 "[FROM.GetName] Tank Gönderiyor"
 SEA_PRC_request_aid.33.a:0 "Daha fazla olabilirdi ama hiç yoktan iyidir"
 SEA_PRC_request_aid.33.desc:0 "BT-7 tank talebimize yanıt olarak, [FROM.GetName] yalnızca sembolik bir miktar göndermeyi kabul etti. Bir tank tümenini tam olarak donatmak için yeterli değil, ancak başlamamız için yeterli. Başka bir şey olmasa bile, modern tanklar tedarik etmenin başka yollarını ararken mürettebatımızı eğitmek için 100 aracı kullanabiliriz."
 SEA_PRC_request_aid.33.t:0 "[FROM.GetName] Biraz Tank Gönderiyor"
 SEA_PRC_request_aid.34.a:0 "Mükemmel! Geldiklerinde onları iyi bir şekilde kullanacağız"
 SEA_PRC_request_aid.34.desc:0 "BT-7 tank talebimize yanıt olarak, [FROM.GetName] önümüzdeki aylarda 150 BT-7 inşa etmeyi ve hazır olduğunda bize göndermeyi kabul etti. Biraz zaman alacak, ancak önlem modern bir zırhlı kuvvet sahaya sürme arzularımız için iyi bir başlangıcı temsil edecek."
 SEA_PRC_request_aid.34.t:0 "[FROM.GetName] Tank Üretecek"
 SEA_PRC_request_aid.35.a:0 "Bu harika bir haber, onları çok iyi kullanacağız!"
 SEA_PRC_request_aid.35.desc:0 "[SOV.GetNameDef] ülkesinden 150 yeni inşa edilmiş BT-7 tankımızı taşıyan bir sevkiyat [ROOT.Capital.GetName] şehrine ulaştı. Sevkiyatı alanlar arasında [ROOT.GetName] hükümetinden temsilciler ve Halk Kurtuluş Ordusu Kara Kuvvetleri'nin önde gelen subayları vardı. HKOKK sembolüyle yeni boyanmış tankları inceleyen subaylar, tank mürettebatı için bir eğitim ve alışma döneminden sonra onları konuşlandırmaya hevesliydi."
 SEA_PRC_request_aid.35.t:0 "[FROM.FROM.GetName] Ülkesinden Yeni İnşa Edilen Tanklar Geldi"
 SEA_PRC_request_aid.4.a:0 "Çok fazla verebiliriz"
 SEA_PRC_request_aid.4.a.tt:0 "§Y[FROM.GetName]§! ülkesine §R250 T-34 Tankı§! göndermeyi kabul edeceğiz"
 SEA_PRC_request_aid.4.b:0 "Biraz verebiliriz"
 SEA_PRC_request_aid.4.b.tt:0 "§Y[FROM.GetName]§! ülkesine §R50 T-34 Tankı§! göndermeyi kabul edeceğiz"
 SEA_PRC_request_aid.4.c:0 "En azından inşa etmeye yardım edebiliriz"
 SEA_PRC_request_aid.4.c.tt:0 "§Y[FROM.GetName]§! için §R150 T-34 Tankı§! üretmeyi kabul edeceğiz"
 SEA_PRC_request_aid.4.desc:0 "[FROM.GetNameDef], zırhlı bir savaş gücü oluşturmak için gereken sanayi kapasitesine ve deneyime sahip olmadığı için, [FROM.GetLeader] yardımımız için bir talep gönderdi. [FROM.GetNameDefCap], ateş gücü, koruma ve hareketlilik konusundaki mükemmel dengeleri nedeniyle özellikle T-34 orta tanklarımızı istiyor. Nasıl yanıt vermeliyiz?"
 SEA_PRC_request_aid.4.e:0 "[FROM.GetNameDef] talebini reddet"
 SEA_PRC_request_aid.4.t:0 "[FROM.GetName] Tank Talep Ediyor"
 SEA_PRC_request_aid.5.a:0 "Harika bir şeyin başlangıcı"
 SEA_PRC_request_aid.5.desc:0 "T-34 tank talebimize yanıt olarak, [FROM.GetName] bize büyük miktarda göndermeyi kabul etti - en az 250 (çoğunlukla) yepyeni T-34! Generallerimiz, yeni atanan tank mürettebatı için eğitim programları ayarlamak da dahil olmak üzere bu tankları en iyi nasıl konuşlandıracaklarına dair bir plan hazırlıyorlar."
 SEA_PRC_request_aid.5.t:0 "[FROM.GetName] Tank Gönderiyor"
 SEA_PRC_request_aid.6.a:0 "Daha fazla olabilirdi ama hiç yoktan iyidir"
 SEA_PRC_request_aid.6.desc:0 "T-34 tank talebimize yanıt olarak, [FROM.GetName] bize yalnızca sembolik bir miktar göndermeyi kabul etti. Bir tank tümenini tam olarak donatmak için yeterli değil, ancak başlamamız için yeterli. Başka bir şey olmasa bile, modern tanklar tedarik etmenin başka yollarını ararken tank mürettebatımızı eğitmek için 50 aracı kullanabiliriz."
 SEA_PRC_request_aid.6.t:0 "[FROM.GetName] Biraz Tank Gönderiyor"
 SEA_PRC_request_aid.7.a:0 "Mükemmel! Geldiklerinde onları iyi bir şekilde kullanacağız"
 SEA_PRC_request_aid.7.desc:0 "T-34 tank talebimize yanıt olarak, [FROM.GetName] önümüzdeki aylarda 150 T-34 inşa etmeyi ve hazır olduğunda bize göndermeyi kabul etti. Biraz zaman alacak, ancak önlem modern bir zırhlı kuvvet sahaya sürme arzularımız için iyi bir başlangıcı temsil edecek"
 SEA_PRC_request_aid.7.t:0 "[FROM.GetName] Tank Üretecek"
 SEA_PRC_request_aid.8.a:0 "Ne yazık!"
 SEA_PRC_request_aid.8.desc:0 "[FROM.GetName], kendi acil ihtiyaçlarının herhangi bir aktif veya yedek araç ayırmalarını engellediğini gerekçe göstererek tank talebimizi reddetti. Ne yazık ki, [FROM.GetName] bize bazı eğitim kılavuzları gönderdi. Yani, en azından bu var."
 SEA_PRC_request_aid.8.t:0 "[FROM.GetName] Tank İsteğimizi Reddediyor"
 SEA_PRC_request_aid.9.a:0 "Bu çabaya yardım etmeyi kabul et"
 SEA_PRC_request_aid.9.b:0 "Bunun için vaktimiz yok"
 SEA_PRC_request_aid.9.desc:0 "[FROM.GetLeader] tarafından bir Teknolojik İşbirliği Anlaşması talep eden bir telgraf aldık. Anlaşma, 'bilgi ve insanlığın iyileştirilmesi yoluyla devrim araçlarını yaymanın yoldaşça yolunu' ilerletecektir"
 SEA_PRC_request_aid.9.t:0 "[FROM.GetName] Teknolojik İşbirliği Anlaşması İmzalamak İstiyor"
 SEA_PRC_zhang_guotao_events.1.a:0 "Guotao'nun adına bir ordusu olsa da, Parti meşruiyet iddialarına karşı çıkıyor"
 SEA_PRC_zhang_guotao_events.1.b:0 "Belki de haklıdır?"
 SEA_PRC_zhang_guotao_events.1.desc:0 "Dördüncü Cephe Ordusu'ndan sorumlu General $PRC_zhang_guotao$, henüz güvenli üs bölgelerimize ulaşmamış iki ordudan birini yönetiyor. Hangi yolu izleyecekleri konusunda Mao ile anlaşmazlığa düştükten sonra hala Uzun Yürüyüş'teler. Ekim 1935'te, $PRC_zhang_guotao$ kendisini [ROOT.GetNameDef] gerçek lideri ilan etti ve hatta kendi Merkez Komitesini, Merkezi Hükümetini ve Merkezi Askeri Komisyonunu kuracak kadar ileri gitti. Ayrıca $PRC_mao_zedong$, $PRC_zhang_wentian$ ve $PRC_zhou_enlai$ kişilerinin Partiden ihraç edilmesi gerektiğini beyan etti. \n\n$PRC_zhang_guotao$ şimdi [ROOT.GetLeader] kişisine ordusuyla birlikte üs bölgelerinin güvenliğine doğru ilerlediğini bildiren bir telgraf gönderdi. Telgraf ayrıca, Parti'nin [SOV.GetNameDef] elçisi Lin Yuying'in isteklerine göre, Guotao'nun Mao ve diğerleriyle barışçıl bir uzlaşma lehine Parti Organlarını askıya aldığını belirtiyor. Ne söylerse söylesin, Guotao güçlü bir siyasi rakip olmaya devam ediyor ve hafife alınmamalı."
 SEA_PRC_zhang_guotao_events.1.t:0 "Parti İçinde Bölünme"
 SEA_PRC_zhang_guotao_events.2.a:0 "Guotao ve ordusunu hoş karşılayın — ama gözünüz üzerinde olsun"
 SEA_PRC_zhang_guotao_events.2.b:0 "Ona güvenemeyiz — $PRC_zhang_guotao$ kınayın ve topraklarımıza girişini reddedin"
 SEA_PRC_zhang_guotao_events.2.desc:0 "Mao'nun siyasi rakibi ve Dördüncü Cephe Ordusu'ndan $PRC_zhang_guotao$, kendisinin ve ordusunun [ROOT.Capital.GetName] yakınına geldiğine dair bir telgraf gönderdi. Uzun Yürüyüşleri $PRC_mao_zedong$ yürüyüşünden yaklaşık bir yıl daha uzun sürdü ve ordu bu çileden kesinlikle yorgun düşmüş durumda. Belki de bu yüzden $PRC_zhang_guotao$, mevcut parti liderliğine meydan okumak istemediğini bir kez daha vurguladı."
 SEA_PRC_zhang_guotao_events.2.t:0 "$PRC_zhang_guotao$ Tarafından Telgraf"
 SEA_PRC_zhang_guotao_events.3.a:0 "Parti liderliğine bir meydan okuma mı?"
 SEA_PRC_zhang_guotao_events.3.desc:0 "Sonunda, $PRC_zhang_guotao$ ve Dördüncü Cephe Ordusu için Uzun Yürüyüş sona erdi — üs bölgelerimize nispeten sağlam bir şekilde ulaştılar. Bilgilendirme toplantıları başladı bile, ancak Guotao liderlik iddialarından henüz vazgeçmedi. Bunun yerine, bununla ne kastettiğini açıklamadan, yaklaşan mücadeleyi kazanmaya yardımcı olmak için yapılması gerekenleri desteklediğini iddia ediyor. Bu karmaşayı çözmek için [Root.GetLeader] tarafından Politbüro'nun daha fazla toplantı yapması gerekecek."
 SEA_PRC_zhang_guotao_events.3.t:0 "$PRC_zhang_guotao$ ve Dördüncü Cephe Ordusu [ROOT.capital.GetName] Şehrine Ulaştı"
 SEA_PRC_zhang_guotao_events.4.a:0 "Davamıza ihanet eden bir hain"
 SEA_PRC_zhang_guotao_events.4.b:0 "Onu kalmaya ikna et"
 SEA_PRC_zhang_guotao_events.4.desc:0 "$PRC_zhang_guotao$, Merkez Komitesi ile onarılamaz ilişkisini ve partiyle yaşadığı hayal kırıklığını gerekçe göstererek Çin Komünist Partisi'nden ayrıldığını açıkladı."
 SEA_PRC_zhang_guotao_events.4.t:0 "$PRC_zhang_guotao$ Komünist Partiden Ayrılıyor"
 SEA_PRC_zhang_guotao_events.5.a:0 "$PRC_zhang_guotao$ bize katılmasına izin ver"
 SEA_PRC_zhang_guotao_events.5.b:0 "Reddet — ona güvenemeyiz"
 SEA_PRC_zhang_guotao_events.5.desc:0 "$PRC_mao_zedong$ siyasi rakibi ve 'eski' komünist lider $PRC_zhang_guotao$, yabancı saldırganlığa karşı mücadelede bizim tarafımıza katılmak için [ROOT.GetLeader] ile temasa geçti. Kısa süre önce [PRC.GetLeader] Merkez Komitesi liderliğini kınaması nedeniyle 'eski' bir komünist olarak adlandırılan Guotao, o zamandan beri Partiden ayrıldı ve şimdi bize katılmak istiyor. Deneyimi faydalı olabilir, ancak [PRC.GetNameDef] hain olarak gördükleri birinin bize katılmasına izin verdiğimiz için kesinlikle öfkelenecektir."
 SEA_PRC_zhang_guotao_events.5.t:0 "$PRC_zhang_guotao$ Davamıza Katılmak İstiyor"
 SEA_PRC_zhang_guotao_events.6.a:0 "Bir hain!"
 SEA_PRC_zhang_guotao_events.6.desc:0 "$PRC_zhang_guotao$ sadece Çin Komünist Partisi'nden ayrılmakla kalmadı, aynı zamanda [CHI.GetNameDef] liderliğindeki KMT'ye de katıldı. Onlarla doğrudan bir çatışmaya girersek, $PRC_zhang_guotao$ düşman tarafında olacak."
 SEA_PRC_zhang_guotao_events.6.t:0 "$PRC_zhang_guotao$ KMT'ye Katıldı"
 SEA_PRC_zhang_guotao_events.7.a:0 "İsteksiz İkili Yönetim bir hataydı — ona güvenilemez"
 SEA_PRC_zhang_guotao_events.7.desc:0 "$PRC_zhang_guotao$, Merkez Komitesi ve $PRC_mao_zedong$ ile onarılamaz ilişkisini ve partiyle yaşadığı hayal kırıklığını gerekçe göstererek Çin Komünist Partisi'nden ayrıldığını açıkladı."
 SEA_PRC_zhang_guotao_events.7.t:0 "$PRC_zhang_guotao$ Komünist Partiden Ayrılıyor"
 SEA_border_incidents_events.1.a:0 "Köy bizim olacak!"
 SEA_border_incidents_events.1.b:0 "Derhal geri çekilmelerini söylemeliyiz!"
 SEA_border_incidents_events.1.desc:0 "100'den az [ROOT.GetAdjective] askerden oluşan bir ordu, altı Sovyet danışmanın rehberliğinde tartışmalı [MAN.GetAdjective] Tauran köyü üzerine harekete geçti. [JAP.GetAdjective] ordusu henüz bölgede görünmese de, bizi geri püskürtmek için her an gelebilirler. Köy bu riske değer mi, yoksa daha temkinli mi davranmalıyız?"
 SEA_border_incidents_events.1.t:0 "Birliklerimiz Tauran Üzerine İlerliyor"
 SEA_border_incidents_events.2.a:0 "Birliklere derhal harekete geçmelerini emredin!"
 SEA_border_incidents_events.2.b:0 "Bu zahmete değmez..."
 SEA_border_incidents_events.2.desc:0 "100'den az [MON.GetAdjective] askerden oluşan bir ordu, Sovyet askeri danışmanlarının yönetiminde tartışmalı [MAN.GetAdjective] Tauran köyünü işgal etti. Görünüşe göre savaşmadan geri adım atmayacaklar ve [761.GetName] üzerindeki tam kontrolümüzü sürdürmek istiyorsak mağlup edilmeleri gerekecek."
 SEA_border_incidents_events.2.t:0 "Tauran Olayı"
 SEA_border_incidents_events.3.a:0 "Taarruz için hazırlanın!"
 SEA_border_incidents_events.3.desc:0 "100'den az [MON.GetAdjective] askerden oluşan bir ordu, Sovyet askeri danışmanlarının yönetiminde tartışmalı [MAN.GetAdjective] Tauran köyünü işgal etti. Görünüşe göre savaşmadan geri adım atmayacaklar ve [761.GetName] üzerindeki tam kontrolümüzü sürdürmek istiyorsak mağlup edilmeleri gerekecek. Efendimiz [JAP.GetNameDef] derhal harekete geçilmesini talep etti ve Kwantung Ordusu durumu İmparator'un şahsına yapılmış bir hakaret olarak görüyor."
 SEA_border_incidents_events.3.t:0 "Tauran Olayı"
 SEA_border_incidents_events.4.a:0 "Bir fırtına toplanıyor"
 SEA_border_incidents_events.4.desc:0 "Tauran gibi sınır köyleri üzerindeki anlaşmazlıklarımızın ardından [FROM.GetNameDef] ile aramızda tırmanan gerilimin bir parçası olarak, bölgeye yerleştirdiğimiz garnizona saldırmak üzere bölgeye birlik sevk ettikleri görülüyor. Bölgeyi son adama kadar savunmaya hazırlanmalı ve işgalcileri haklı [ROOT.GetAdjective] topraklarından püskürtmeliyiz!"
 SEA_border_incidents_events.4.t:0 "[FROM.GetAdjective] Birlikleri Tauran'a Taarruza Hazırlanıyor"
 SEA_border_incidents_events.5.a:0 "Bu meseleyi onurumuzla hallettik"
 SEA_border_incidents_events.5.b:0 "Daha ileriye yürümemeleri için dua ediyoruz..."
 SEA_border_incidents_events.5.desc:0 "Buir Gölü çevresindeki sınır bölgesinde [MON.GetAdjective] ve [JAP.GetAdjective] kuvvetleri arasında yaşanan çatışmanın ardından, [MON.GetAdjective] kuvvetlerinin tamamen geri çekildiği bildiriliyor. [JAP.GetAdjective] birlikleri bölgedeki çok sayıda stratejik tepeyi işgal etti ve Tauran köyüne yeniden girmeye hazırlanıyor.\n\nMuharebe sırasında [JAP.GetAdjective] tarafı çok sayıda [MON.GetAdjective] askerini ve [SOV.GetAdjective] danışmanını esir aldı, bu da düşman moraline yıkıcı bir darbe vuracaktır."
 SEA_border_incidents_events.5.t:0 "Buir Gölü'nde [JAP.GetAdjective] Zaferi"
 SEA_border_incidents_events.6.a:0 "Hiç denememektense onurlu bir şekilde başarısız olmak daha iyidir"
 SEA_border_incidents_events.6.b:0 "Kuvvetlerimiz alınlarının akıyla çıktı"
 SEA_border_incidents_events.6.desc:0 "Buir Gölü çevresindeki sınır bölgesinde [MON.GetAdjective] ve [JAP.GetAdjective] kuvvetleri arasında yaşanan çatışmanın ardından, Ulanbatur'daki [JAP.GetAdjective] büyükelçisi ateşkes talebinde bulundu. \n\n Muharebe sırasında [MON.GetAdjective] mevzilerine yapılan birkaç [JAP.GetAdjective] taarruzu ağır kayıplarla başarısız oldu, bu da [JAP.GetAdjective] ordusunda kuvvetlerinin kabiliyetleri hakkında endişe yarattı."
 SEA_border_incidents_events.6.t:0 "Buir Gölü'nde [JAP.GetAdjective] Yenilgisi"
 SEA_border_incidents_events.7.a:0 "Zaten değersiz bir köydü"
 SEA_border_incidents_events.7.b:0 "O halde şimdilik bizim"
 SEA_border_incidents_events.7.desc:0 "[JAP.GetAdjective] ve [MON.GetAdjective] kuvvetleri arasında Buir Gölü civarındaki çatışmalar, her iki tarafın da yeniden toparlanmak ve ikmal yapmak için çekişmeli bölgeden çekilmesiyle dindi. Daha fazla taarruzun beyhude olduğunu kabul eden [JAP.GetAdjective] ordusu, köyün [MON.GetAdjective] toprakları içinde kaldığını kabul ederek ateşkes ve sınırın belirlenmesi için müzakere talep etti."
 SEA_border_incidents_events.7.t:0 "Buir Gölü'nde Kördüğüm"
 SEA_border_incidents_events.8.a:0 "Mükemmel"
 SEA_border_incidents_events.8.desc:0 "Tauran köyünü işgal etmemizin ardından, [FROM.GetAdjective] kuvvetlerinin civardan geri çekildiği ve geri dönme niyetinde olmadıkları görülüyor. Daha fazla taarruzun beyhude olduğunu kabul eden [JAP.GetAdjective] ordusu, köyün [ROOT.GetAdjective] toprakları içinde kaldığını kabul etti."
 SEA_border_incidents_events.8.t:0 "[FROM.GetNameDefCap] Geri Adım Atıyor"
 SEA_china.1.a:0 "Elimizden geleni gönderin"
 SEA_china.1.b:0 "Hiçbir şey veremeyiz"
 SEA_china.1.desc:0 "[FROM.GetNameDef]'den malzeme desteği göndermemizi isteyen bir talep aldık. Her ne kadar [FROM.GetLeader] geçmişte bizim hakkımızda şüpheli açıklamalarda bulunsa da bu, bölgedeki yabancı çıkarları bağlamak için bir fırsat olabilir."
 SEA_china.1.t:0 "[FROM.GetNameDefCap] Desteğimizi İstiyor"
 SEA_china.10.a:0 "Gücümüz sayımızdadır"
 SEA_china.10.b:0 "Bunu kabul edemeyiz"
 SEA_china.10.desc:0 "[FROM.GetNameDef] tarafından, [FROM.GetFactionName] üyelerinin tamamıyla birlikte [ROOT.GetFactionName] ittifakına katılma teklifi aldık. Kabul edersek, potansiyel bir rakibimiz daha azalacak ve kendi konumumuz güçlenecek. Soru daha çok niyetlerinin, yerimizi almaya çalışmayacaklarına güvenilip güvenilemeyeceğidir."
 SEA_china.10.t:0 "[FROM.GetNameDefCap] Bize Katılmayı Talep Ediyor"
 SEA_china.11.a:0 "Bu yolu birlikte yürüyoruz"
 SEA_china.11.desc:0 "[FROM.GetFactionName] liderinden bir yanıt aldık ve dünyanın kendi köşemize içe dönük bakma çağı sona erdi. [FROM.GetNameDef] hükümeti bizi kollarını açarak karşıladı ve artık dünyada eşit şartlarda yerimizi alabiliriz."
 SEA_china.11.t:0 "[FROM.GetNameDefCap] Kaydımızı Destekliyor"
 SEA_china.12.a:0 "Ne yazık"
 SEA_china.12.b:0 "Kendi yolumuzda yürüyoruz"
 SEA_china.12.desc:0 "[FROM.GetFactionName] liderleri güçlerimizi birleştirme teklifimizi reddettiler. Bu, dünyaya barış ve istikrar getirmek için bir fırsattı, ancak ne yazık ki bazıları bu tür şeylere karşı."
 SEA_china.12.t:0 "[FROM.GetNameDefCap] İsteğimizi Reddediyor"
 SEA_china.13.a:0 "Ne kadar trajik"
 SEA_china.13.desc:0 "Şanlı liderimiz [CHI.GetLeader] arabasında vuruldu, düşmanca bir yol karşılaşmasının feci bir sonu. Tetikçinin tek başına hareket ettiği söylendi, ancak hemen ardından gelen takip sırasında öldürüldüğü için potansiyel komplocular serbest kalacak. Parti bir yedek aramaya başladı."
 SEA_china.13.t:0 "[CHI.GetLeader] Öldürüldü"
 SEA_china.14.a:0 "Bir Oldu Bitti..."
 SEA_china.14.b:0 "Bunu kabul edemeyiz, silahlara!"
 SEA_china.14.desc:0 "[JAP.GetNameDef] ülkesini yatıştırma çaresizliği içinde, merkezi hükümet onlara üzerimizde hakimiyet teklif etti. Bu utanç verici bir eylem. Yeni hükümetten böyle bir cesaret beklemiyorduk."
 SEA_china.14.t:0 "[FROM.GetName] Kontrolünü [JAP.GetNameDef] Ülkesine Devrediyor"
 SEA_china.15.a:0 "Pekala"
 SEA_china.15.desc:0 "Silahlı kuvvetlerimizde savaş için baskı yapanları yatıştırmak için [CHI.GetName], [FROM.GetName] üzerindeki kontrolü bize devretti. Görünüşe göre yakın gelecekte herhangi bir çatışmamız olmayacak."
 SEA_china.15.t:0 "[FROM.GetNameDef] Kontrolü Bize Verildi"
 SEA_china.16.a:0 "Mükemmel!"
 SEA_china.16.desc:0 "Bizi saldırmamak için yatıştırma çabasıyla, [From.GetName] bize demirleme hakları verdi. Kwantung Ordusu şimdilik geri çekilmeye karar verdi."
 SEA_china.16.t:0 "[From.GetName] Bize Demirleme Hakları Verdi"
 SEA_china.17.a:0 "Mükemmel!"
 SEA_china.17.desc:0 "Bizi saldırmamak için yatıştırma çabasıyla, [From.GetName] bize hava üssü erişimi verdi. Kwantung Ordusu şimdilik geri çekilmeye karar verdi."
 SEA_china.17.t:0 "[From.GetName] Bize Hava Üssü Erişimi Verdi"
 SEA_china.18.a:0 "Mükemmel!"
 SEA_china.18.desc:0 "Bizi saldırmamak için yatıştırma çabasıyla, [From.GetName] bize kaynak hakları verdi. Kwantung Ordusu şimdilik geri çekilmeye karar verdi."
 SEA_china.18.t:0 "[From.GetName] Bize Kaynak Hakları Verdi"
 SEA_china.19.a:0 "Pekin'in talebini kabul et"
 SEA_china.19.b:0 "Antlaşmayı iptal etmeyi reddet"
 SEA_china.19.desc:0 "[CHI.GetNameDef] tarafından resmi bir mektup bugün dışişleri bakanlığımıza ulaştı. Dokuz Güç Antlaşması'nın [CHI.GetAdjective] egemenliğini kısıtladığını ve derhal yırtılıp atılması gerektiğini savunuyor. [CHI.GetLeader], paktın bir baskı kalıntısı olduğu konusunda ısrar ediyor ve rızamız olsun ya da olmasın tam bağımsızlığı geri kazanmaya yemin ediyor."
 SEA_china.19.t:0 "[CHI.GetName] Dokuz Güç Antlaşmasının İptalini Talep Ediyor"
 SEA_china.19_tt:0 "§RÇin'in Japonya'ya karşı savaşına katılacağız!§!"
 SEA_china.2.a:0 "Mükemmel, iyi kullanacağımızdan emin olacağız"
 SEA_china.2.desc:0 "Bir anda netlik kazandıktan sonra [FROM.GetNameDef], mücadelelerimizde bizi desteklemeye karar verdi. Bunun bir nezaket eylemi olduğu izlenimine kapılmıyoruz, daha ziyade onların kirli işlerini bize yaptırmak konusundaki kişisel çıkarlarımızdan biri."
 SEA_china.2.t:0 "[FROM.GetNameDefCap] Bizi Desteklemeyi Kabul Ediyor"
 SEA_china.20.a:0 "Memnuniyet verici ve kesin bir zafer"
 SEA_china.20.desc:0 "[FROM.GetNameDefCap], Dokuz Güç Antlaşması'ndan derhal çekildiğini doğruladı. Antlaşmanın geçersiz olduğunu ve [CHI.GetAdjective] egemenliğinin engellenmeden durması gerektiğini kabul ediyorlar."
 SEA_china.20.t:0 "[FROM.GetName] Dokuz Güç Antlaşmasını Terk Ediyor"
 SEA_china.21.a:0 "Konunun üzerine git"
 SEA_china.21.b:0 "Şimdilik geri çekil"
 SEA_china.21.desc:0 "[FROM.GetNameDefCap], Pasifik'teki hassas güç dengesini gerekçe göstererek Dokuz Güç Antlaşması'nı dağıtmayı reddediyor. Hakaret herhangi bir ölümlüyü öfkelendirirdi, ancak emperyalist yardakçıların zamanı geçti. Baskıyı artırıp artırmayacağımıza veya diplomatik arenadan çekilip çekilmeyeceğimize karar vermeliyiz."
 SEA_china.21.t:0 "[FROM.GetName] Pekin'e Meydan Okuyor"
 SEA_china.22.a:0 "[CHI.GetName] üzerine ambargo uygula"
 SEA_china.22.b:0 "Hiçbir şey yapma"
 SEA_china.22.desc:0 "Pekin ısrar ediyor. Kabine bu artan baskıya nasıl cevap verileceğini ve ticareti altüst edebilecek bir ambargo ile karşılık verilip verilmeyeceğini veya [CHI.GetName] yükümlülüklerinden tamamen serbest bırakılıp bırakılmayacağını tartışıyor."
 SEA_china.22.t:0 "[CHI.GetName] Konunun Üzerine Gidiyor"
 SEA_china.23.a:0 "Korkutulmayacağız"
 SEA_china.23.desc:0 "[FROM.GetAdjective] hükümeti, Dokuz Güç Antlaşması'nı reddetmemizin cezası olarak bize karşı bir ambargo ilan etti ve [FROM.GetNameDef] liman başkanları artık her Çin yük gemisini geri çeviriyor. Yerel basın, önlemi ekonomik boğma, emperyalizm çağının son bir nefesi olarak kınıyor."
 SEA_china.23.t:0 "[FROM.GetName] Bize Ambargo Uyguluyor"
 SEA_china.24.a:0 "Ulusal egemenlik için zafer"
 SEA_china.24.desc:0 "[FROM.GetNameDef] tarafından bir telgraf Nankin'e ulaşıyor ve Dokuz Güç Antlaşması'ndan çekildiklerini doğruluyor. Yabancı nehir devriyeleri eve yelken açmaya hazırlanırken, [FROM.GetAdjective] diplomatlar anlaşmanın artık Çin için bağlayıcı olmadığını kabul ediyor. Radyo başka bir eşitsiz sözleşmenin sonunu ilan ederken Dışişleri Bakanlığı önünde kalabalıklar toplanıyor."
 SEA_china.24.t:0 "[FROM.GetName] Dokuz Güç Antlaşmasını İptal Ediyor"
 SEA_china.25.a:0 "$morozov_design_bureau$"
 SEA_china.25.b:0 "$astrov_design_bureau$"
 SEA_china.25.c:0 "$okmo$"
 SEA_china.25.d:0 "Yardımı hak etmiyorlar"
 SEA_china.25.desc:0 "[FROM.GetNameDefCap], daha modern bir savaş tarzına geçişlerini desteklemek için zırhlı birliklerimizden uzmanların bulunması talebiyle bize yaklaştı. Büyük üreticilerimizden birinden bir danışma ekibi gönderebilir veya taleplerini doğrudan reddedebiliriz."
 SEA_china.25.t:0 "Çin Zırhlı Uzmanları Talep Ediyor"
 SEA_china.26.a:0 "Zafere doğru yürüyoruz"
 SEA_china.26.desc:0 "Şimdi [SOV.GetNameDef] tarafından bize bir grup uzman göndermeyi kabul ettikleri bir cevap aldık. Yardım kısa süre içinde gelmeli ve geldiğinde uzmanları tank kolordumuzu güçlendirmek için işe koyabiliriz."
 SEA_china.26.t:0 "[SOV.GetNameDefCap] Cevap Veriyor"
 SEA_china.27.a:0 "Zamanla buna pişman olacaklar"
 SEA_china.27.desc:0 "Ne yazık ki [SOV.GetNameDef] ihtiyacımız olan yardımı bize göndermemeye karar verdi. Bu küçük talebi reddetmelerinin nedenini bilmesek de, alternatif yollar bulmamız gerekiyor gibi görünüyor..."
 SEA_china.27.t:0 "[SOV.GetNameDefCap] Cevap Veriyor"
 SEA_china.28.a:0 "Başka şansımız yok"
 SEA_china.28.b:0 "Asla!"
 SEA_china.28.desc:0 "Merkezi hükümet [JAP.GetNameDef] karşısında teslim oldu ve toprak saldırganlığına karşı çıkmayacağına söz verdi. Darbe şimdi bize iniyor, [JAP.GetAdjective] topraklarımızı talep ediyor, diplomatik zorlamayla ilhak istiyor."
 SEA_china.28.t:0 "[FROM.GetName] Boyun Eğmeyi Talep Ediyor"
 SEA_china.29.a:0 "Onu hapse atın!"
 SEA_china.29.b:0 "Onu kaybetmeyi göze alamayız..."
 SEA_china.29.desc:0 "Ülkemizin özgürlüğü için duyduğu şevk içinde $CHI_zhang_xueliang$ yetkisini büyük ölçüde aştı. Normalde bu kabul edilemez olurdu, ancak normal zamanlarda yaşamıyoruz ve [ROOT.GetLeader] onu hapsetmemizi talep ederken, [CHI_zhang_xueliang.GetName]'in yetkinliği faydalı olabilir."
 SEA_china.29.t:0 "$CHI_zhang_xueliang$'ın akıbeti"
 SEA_china.3.a:0 "Başka bir kaynak bulmak zorunda kalacağız"
 SEA_china.3.desc:0 "Destek talebimizin [FROM.GetNameDef] tarafından reddedilmesi şaşırtıcı değil. Her ne kadar umutlarımız hiçbir zaman büyük olmasa da, onların en azından [JAP.GetNameDef]'nin tüm Asya'ya sunduğu tehdidi kabul etmelerini bekliyorduk. Ama belli ki yanılmışız."
 SEA_china.3.t:0 "[FROM.GetNameDefCap] Taleplerimizi Reddediyor"
 SEA_china.4.a:0 "Onları destekleyeceğiz"
 SEA_china.4.b:0 "Önce kendi güvenliğimizi sağlamalıyız"
 SEA_china.4.desc:0 "[FROM.GetNameDef] içindeki [FROM.GetLeader] tarafından, [JAP.GetNameDef] ile olan çatışmalarında finansal ve maddi yardım talep eden bir soruşturma gönderildi. Mesaj sadece telsiz veya bir elçi aracılığıyla değil, [ROOT.GetName] boyunca seyahat ederken oldukça kalabalık toplayan $CHI_soong_mei_ling$ şahsından daha az olmayan biri aracılığıyla geldi. [JAP.GetNameDef] ülkesini bağlamak tek başına bize fayda sağlarken, bu turun popülaritesinden de yararlanabiliriz."
 SEA_china.4.t:0 "[FROM.GetNameDefCap] Desteğimizi İstiyor"
 SEA_china.4.tt:0 "§YKararlılığımızı Göster§! kararından gelen §YTopçu Teçhizatı§! ödülünü 100 artırır"
 SEA_china.5.a:0 "Zafere giden yol açık"
 SEA_china.5.desc:0 "Talebimize bir yanıt aldık ve yabancı fonların kısa süre içinde bize sunulacağını bildirmekten mutluluk duyuyoruz. Bunlar sanayimiz için büyük bir nimet olmalı ve silahlı kuvvetlerimizi büyük ölçüde büyütmemize izin vermeli ve muhtemelen yardım daha sonra malzemeyi de içerecek şekilde genişletilebilir."
 SEA_china.5.t:0 "[FROM.GetNameDefCap] Bizi Desteklemeyi Kabul Ediyor"
 SEA_china.5.tt:0 "§YKararlılığımızı Göster§! kararından gelen §Y$CIC_BANK_HEADER$§! ödülünü §Y1000§! artırır!"
 SEA_china.6.a:0 "Ülkenin bekası için savaşın!"
 SEA_china.6.desc:0 "Yalvarışlarımızın cevabı, bizi terk etmeyi seçen [FROM.GetNameDef] tarafından geri döndü. Hiçbir destek gönderilmeyecek ve herhangi bir fon sağlanmayacak. Daha önce birçok kez olduğu gibi saldırganlık karşısında yalnızız. Galip geleceğiz çünkü gelmezsek mirasımız unutulacak."
 SEA_china.6.t:0 "[FROM.GetNameDefCap] İsteğimizi Reddediyor"
 SEA_china.7.a:0 "Düşmanlarımıza karşı birlikte duracağız"
 SEA_china.7.b:0 "Bağımsızlığımızı vaatlerle takas etmeyeceğiz"
 SEA_china.7.desc:0 "[FROM.GetName] merkezi hükümeti, [ROOT.GetName] ülkesinin kendi hiziplerine katılması için bir davette bulundu. Ulusal birlikten ve yabancı işgaline tek vücut olarak direnme ihtiyacından bahsediyorlar. İdeolojik farklılıklar devam etse de, artan tehditler karşısında işbirliği olasılığı değerlendirmeyi hak edebilir."
 SEA_china.7.t:0 "[FROM.GetName] Tarafından Bir Davet"
 SEA_china.8.a:0 "Birlikte daha güçlüyüz"
 SEA_china.8.desc:0 "[FROM.GetLeader] teklifimizi kabul etti. [FROM.GetNameDefCap] ittifakımıza katılacak ve ulusu birleştirme ve dış tehditlerden koruma mücadelesinde yanımızda duracak. Bu, daha büyük Çin birliğine doğru atılmış önemli bir adımdır."
 SEA_china.8.t:0 "[FROM.GetName] Daveti Kabul Ediyor"
 SEA_china.9.a:0 "Zamanla buna pişman olacaklar"
 SEA_china.9.desc:0 "[FROM.GetLeader], bölgesel bağımsızlığı ve siyasi özerkliği koruma ihtiyacını gerekçe göstererek ittifakımıza katılmayı reddetti. Ne yazık ki bu karar, ülke içindeki kalıcı bölünmeleri yansıtıyor."
 SEA_china.9.t:0 "[FROM.GetName] Teklifi Reddediyor"
 SEA_china_democratic.1.a:0 "ÇİKDP'nin iyi adayları var"
 SEA_china_democratic.1.b:0 "Carsun Chang değerini gösterdi"
 SEA_china_democratic.1.c:0 "Soong Ching-ling ideal lider"
 SEA_china_democratic.1.d:0 "Zeng Qi'ye bu fırsat verilmeli"
 SEA_china_democratic.1.desc:0 "Çin'de serbest seçimleri yeniden kurmanın ve hem dış hem de iç güçler tarafından ezilen cumhuriyeti geri getirmenin zamanı nihayet geldi. Ancak soru şu ki, Dr. Sun'ın görevini kim üstlenecek ve bu yeni cumhuriyetin ilk başkanı olacak?"
 SEA_china_democratic.1.t:0 "Cumhuriyet İçin Bir Başkan"
 SEA_china_democratic.10.a:0 "Zafer için birlikte!"
 SEA_china_democratic.10.b:0 "Bu tarafsızlık ilkelerimize aykırı olurdu..."
 SEA_china_democratic.10.desc:0 "Uzaklardan bir heyet yakın zamanda başkentimize geldi ve [ROOT.GetLeader] ile bir görüşme talep etti. [FROM.GetNameDef] ülkesinden olduklarını iddia ediyorlar ve [JAP.GetNameDef] ile olan savaşlarına katılmamızı istiyorlar. Kabul ediyor muyuz?"
 SEA_china_democratic.10.t:0 "[FROM.GetNameDefCap] Savaşlarına Katılmamızı İstiyor"
 SEA_china_democratic.11.a:0 "Halklarına borçluyuz"
 SEA_china_democratic.11.desc:0 "[FROM.GetLeader], uluslarımız arasında bir anti-[JAP.GetAdjective] ittifakını resmileştirme teklifimizi nezaketle kabul etti ve doğu tehdidine karşı önlemler almaya başladı bile. Bugün kutlama günü!"
 SEA_china_democratic.11.t:0 "[FROM.GetNameDefCap] Mütevazı İsteğimizi Kabul Ediyor"
 SEA_china_democratic.12.a:0 "Korkunç haber..."
 SEA_china_democratic.12.desc:0 "[FROM.GetLeader], bunun tarafsızlık ilkelerine aykırı olacağını belirterek uluslarımız arasında bir anti-[JAP.GetAdjective] ittifakı teklifimizi kabaca reddetmeye karar verdi. Bu hatalı karara yol açan yolsuzluk miktarını ancak hayal edebiliriz."
 SEA_china_democratic.12.t:0 "[FROM.GetNameDefCap] Bize Katılmayı Reddediyor"
 SEA_china_democratic.13.a:0 "Onları destekleyeceğiz"
 SEA_china_democratic.13.b:0 "Kendi ekonomilerine bakmak zorundalar"
 SEA_china_democratic.13.desc:0 "[FROM.GetNameDef] içindeki [FROM.GetLeader] tarafından, ülkeleri için mali destek alma konusunda bir soruşturma alındı. Sınırlarımız içinde yaşayan birçok [FROM.GetAdjective] gurbetçiyi kendi davalarına topladılar ve halk desteği bunun lehine arttı. Taleplerini kabul etmeli miyiz?"
 SEA_china_democratic.13.t:0 "[FROM.GetNameDefCap] Desteğimizi İstiyor"
 SEA_china_democratic.14.a:0 "Zafere giden yol açık"
 SEA_china_democratic.14.desc:0 "Talebimize bir yanıt aldık ve yabancı fonların kısa süre içinde bize sunulacağını bildirmekten mutluluk duyuyoruz. Bunlar ekonomimiz için bir nimet olmalı ve endüstrilerimizi ve silahlı kuvvetlerimizi büyük ölçüde büyütmemize izin vermelidir."
 SEA_china_democratic.14.t:0 "[FROM.GetNameDefCap] Bizi Desteklemeyi Kabul Ediyor"
 SEA_china_democratic.15.a:0 "Yoldan çıkarıldık..."
 SEA_china_democratic.15.desc:0 "Yalvarışlarımızın cevabı, bizi terk etmeyi seçen [FROM.GetNameDef] tarafından geri döndü. Hiçbir destek gönderilmeyecek ve herhangi bir fon sağlanmayacak. [FROM.GetNameDef] içindeki halk desteğine rağmen yalnızız. Galip geleceğiz çünkü gelmezsek mirasımız unutulacak."
 SEA_china_democratic.15.t:0 "[FROM.GetNameDefCap] İsteğimizi Reddediyor"
 SEA_china_democratic.16.a:0 "Bu yatırım için onlara teşekkür ediyoruz"
 SEA_china_democratic.16.b:0 "Yardımlarına ihtiyacımız yok!"
 SEA_china_democratic.16.desc:0 "[FROM.GetNameDef] ülkesine ait sanayiciler yerel sanayilerimizi geliştirmeye ve sınırlarımız içinde yeni şirketler kurmaya başladılar. Bu bizi refaha yaklaştıracaktır."
 SEA_china_democratic.16.t:0 "[FROM.GetNameDefCap] Ekonomimize Yatırım Yapıyor"
 SEA_china_democratic.17.a:0 "Asla boyun eğmeyeceğiz!"
 SEA_china_democratic.17.b:0 "Halkımız için en iyisi bu"
 SEA_china_democratic.17.desc:0 "Nankin'den, merkezi hükümetin açık mührünü taşıyan bir mesaj geldi. Birlik ve ulusal kaderin süslü dilinin arkasında bir talep yatıyor - [CHI.GetLeader] otoritesine boyun eğmeli ve [CHI.GetNameDef] yetkisini alanımız üzerinde kabul etmeliyiz. Müzakereye yer yok, sadece itaat veya sonuçlar."
 SEA_china_democratic.17.t:0 "[FROM.GetName] Boyun Eğmemizi Talep Ediyor"
 SEA_china_democratic.17.tt:0 "§R[FROM.GetName] ülkesinin bir bağlı devleti olacağız§!"
 SEA_china_democratic.18.a:0 "Parçalanmış bir güneş ışığını topluyor"
 SEA_china_democratic.18.desc:0 "[FROM.GetName] ültimatomumuzu kabul etti. Liderleri ulusal birlik ve tarihi kaderden bahsediyor, ancak anlamı açık - artık [CHI.GetNameDef] üstünlüğünü kabul ediyorlar.\nBoyun eğmeleri gönülsüz olsa da, Çin'i daha fazla bölünmeden ve kan dökülmesinden kurtarıyor."
 SEA_china_democratic.18.t:0 "[FROM.GetName] Cumhuriyet'e Dönüyor"
 SEA_china_democratic.19.a:0 "O zaman diz çöktürülecekler"
 SEA_china_democratic.19.desc:0 "Ültimatom reddedildi. Küstahça bir meydan okuma eyleminde, [FROM.GetLeader] halkının boyun eğmeyeceğini açıkça belirtti. Elçilerimiz reddedildiğine göre, diplomasi yerini savaşa bırakacak."
 SEA_china_democratic.19.t:0 "[FROM.GetName] Boyun Eğmeyi Reddediyor"
 SEA_china_democratic.2.a:0 "Birlikte daha güçlü olacağız"
 SEA_china_democratic.2.b:0 "Bu tarafsızlık ilkelerimize aykırı olurdu..."
 SEA_china_democratic.2.desc:0 "Uzaklardan bir heyet yakın zamanda başkentimize geldi ve [ROOT.GetLeader] ile bir görüşme talep etti. [FROM.GetNameDef] ülkesinden olduklarını iddia ediyorlar ve uluslarımız arasında bir ittifak arıyorlar. Kabul ediyor muyuz?"
 SEA_china_democratic.2.t:0 "[FROM.GetNameDefCap] Bizi İttifaklarına Davet Ediyor"
 SEA_china_democratic.20.a:0 "İtaat edeceğiz"
 SEA_china_democratic.20.b:0 "Bu işte bir bit yeniği var!"
 SEA_china_democratic.20.desc:0 "[FROM.GetNameDef] başkanı [FROM.GetLeader], yönettiğimiz bölgede Mínquán ilkesini uygulamaya başlamamız için bize resmi bir talep gönderdi. Bu bizi Cumhuriyet'e yaklaştıracak ve kalkınmamıza yardımcı olacaktır."
 SEA_china_democratic.20.t:0 "[FROM.GetNameDefCap] Mínquán Uygulanmasını Talep Ediyor!"
 SEA_china_democratic.3.a:0 "Gelecek vizyonumuzu paylaşıyorlar"
 SEA_china_democratic.3.desc:0 "[FROM.GetLeader], uluslarımız arasında bir ittifakı resmileştirme teklifimizi nezaketle kabul etti ve etki alanımıza entegrasyonlarını kolaylaştırmak için girişimlere başladı bile. Bugün kutlama günü!"
 SEA_china_democratic.3.t:0 "[FROM.GetNameDefCap] Davetimizi Kabul Ediyor"
 SEA_china_democratic.4.a:0 "Kendi kayıpları"
 SEA_china_democratic.4.desc:0 "[FROM.GetLeader], bunun tarafsızlık ilkelerine aykırı olacağını belirterek uluslarımız arasında bir ittifak teklifimizi kabaca reddetmeye karar verdi. Bu hatalı karara yol açan yolsuzluk miktarını ancak hayal edebiliriz."
 SEA_china_democratic.4.t:0 "[FROM.GetNameDefCap] Bize Katılmayı Reddediyor"
 SEA_china_democratic.5.a:0 "Demokrasi İçin!"
 SEA_china_democratic.5.b:0 "Bu çılgınlığı durdurmalıyız!"
 SEA_china_democratic.5.desc:0 "Uzun bir artan cumhuriyetçi duygu döneminden sonra, [ROOT.GetAdjective] demokratlarının barışçıl bir hükümet değişikliğini beklemekten bıktığı görülüyor. Yoğun tartışmaların ardından, diplomasinin başarısız olduğu ve silahlı çatışmanın patlak verdiği görülüyor."
 SEA_china_democratic.5.t:0 "[ROOT.GetNameDef] İçinde İç Savaş"
 SEA_china_democratic.6.a:0 "Devam etmelerine izin ver"
 SEA_china_democratic.6.b:0 "Bu küstah kışkırtıcıları bastırın!"
 SEA_china_democratic.6.desc:0 "Şu anda ülkemizde cumhuriyetçi duyguları yayan [FROM.GetAdjective] hücrelerin aktif olduğu dikkatimizi çekti. Bu yeterince zararsız görünse de, propagandanın bazılarının doğası gereği oldukça devrimci olduğu anlaşılıyor. İşçilerin örgütlenmeye ve birleşmeye teşvik edildiğine dair raporlar daha da sıklaşıyor ve yakın tarihe bakıldığında, bunun [FROM.GetAdjective] liderliğinin bizi nihayetinde entegre etmek için ayrıntılı bir hilesi olmadığından emin olamayız."
 SEA_china_democratic.6.t:0 "[FROM.GetNameDefCap] Cumhuriyetçi Duyguları Kışkırtıyor"
 SEA_china_democratic.7.a:0 "Zaten o kolonilerin pek bir faydasını görmüyoruz."
 SEA_china_democratic.7.b:0 "Gerçek sahipleri biz olurduk."
 SEA_china_democratic.7.b.tt:0 "§RBu onlara bize karşı bir savaş sebebi verecek!§!"
 SEA_china_democratic.7.desc:0 "[CHI.GetNameDef] tarafından oldukça sert ifadeli bir nota aldık. [CHI_country_to_be_liberated.GetNameDef] ülkesini serbest bırakmamızı ve toprakları gerçek sahiplerine iade etmemizi talep ediyorlar."
 SEA_china_democratic.7.t:0 "[CHI.GetNameDefCap] Asya Kolonilerini Serbest Bırakmamızı Talep Ediyor"
 SEA_china_democratic.8.a:0 "En tatmin edici bir sonuç"
 SEA_china_democratic.8.desc:0 "[FROM.GetNameDef] ülkesinin [CHI_country_to_be_liberated.GetNameDef] ülkesini serbest bırakması yönündeki taleplerimize yanıt az önce geldi. Belki biraz şaşırtıcı bir şekilde, [CHI_country_to_be_liberated.GetNameDef] ülkesini bağımsız bir ulus olarak serbest bırakmayı kabul ettiler."
 SEA_china_democratic.8.t:0 "[FROM.GetNameDefCap], [CHI_country_to_be_liberated.GetNameDef] Serbest Bırakmayı Kabul Ediyor"
 SEA_china_democratic.9.a:0 "Ne pahasına olursa olsun onları özgürleştirmeliyiz"
 SEA_china_democratic.9.desc:0 "[FROM.GetNameDef] ülkesinin [CHI_country_to_be_liberated.GetNameDef] ülkesini serbest bırakması yönündeki taleplerimize yanıt az önce geldi. Dış işlerinin bizi ilgilendirmediğini belirterek, kolonilere hak ettikleri bağımsızlığı verme fikrini reddediyorlar."
 SEA_china_democratic.9.t:0 "[FROM.GetNameDefCap] Kolonileri Serbest Bırakmayı Reddediyor"
 SEA_china_improvement.1.a:0 "Gönüllüler zafere yürüyor"
 SEA_china_improvement.1.desc:0 "Güneş parlıyor, gömlekler ütülü ve botlar boyanmış. Askerler düzgün saflarda duruyor, mezuniyetleri için bir konuşma yapmaya gelen [ROOT.GetLeader] dinliyorlar. Yakında mezunlar cephede olacak ve [ROOT.GetNameDef] için zafer getirecekler."
 SEA_china_improvement.1.t:0 "Yeni Bir Subay Sınıfı"
 SEA_china_improvement.1_tt:0 "\n §Y$MODIFIER_CONSCRIPTION_TOTAL_FACTOR$§! §Gher 6 ayda bir artacak§!"
 SEA_china_improvement.2.a:0 "Uzun mücadele başlasın"
 SEA_china_improvement.2.desc:0 "Afyon ticaretinin devlet otoritesi ve kamu güveni üzerindeki aşındırıcı etkisini kabul ederek, afyon sendikalarının etkisini azaltmak için uzun vadeli bir kampanya başlatmamız gerekiyor. Yetkililer daha sıkı denetimler, idari değişiklikler ve kamu bilinci kampanyaları ile görevlendirildi, bunların hiçbiri bir gecede meyve vermeyecek. Yine de her adım, [CHI.GetAdjective] zayıflıklarından beslenen gölge ağlarını zayıflatıyor."
 SEA_china_improvement.2.t:0 "Zehri Kökünden Kazımak"
 SEA_china_improvement.2_tt:0 "§YYasadışı Ticaretin§! olumsuz etkisi her 6 ayda bir azaltılacak"
 SEA_china_improvement.3.a:0 "Harika İş"
 SEA_china_improvement.3.desc:0 "Yıllarca süren ısrarlı reform, sessiz tasfiyeler ve amansız denetimden sonra, son büyük afyon ağları dağıtıldı. Onlarca yıldır ilk kez, devletin iradesi kırsalda rakipsiz hüküm sürüyor. Alaycılar eski günlerden bahsediyor ama onlar bile havanın daha temiz olduğunu kabul etmek zorunda."
 SEA_china_improvement.3.t:0 "Ahlaksızlığın Sonu"
 SEA_china_misc.1.desc:0 "$CHI_retreat_to_taiwan_desc$"
 SEA_china_misc.1.t:0 "$CHI_retreat_to_taiwan$"
 SEA_china_warlords.1.a:0 "Bırakın gelsinler ve denesinler"
 SEA_china_warlords.1.b:0 "İtaat etmekten başka şansımız yok"
 SEA_china_warlords.1.desc:0 "Nankin'den, merkezi hükümetin açık mührünü taşıyan bir mesaj geldi. Birlik ve ulusal kaderin süslü dilinin arkasında bir talep yatıyor - [FROM.GetLeader] otoritesine boyun eğmeli ve [FROM.GetNameDef] yetkisini alanımız üzerinde kabul etmeliyiz. Müzakereye yer yok, sadece itaat veya sonuçlar."
 SEA_china_warlords.1.t:0 "[FROM.GetName] Boyun Eğmemizi Talep Ediyor"
 SEA_china_warlords.1.tt:0 "§R[FROM.GetName] ülkesinin bir bağlı devleti olacağız§!"
 SEA_china_warlords.2.a:0 "Parçalanmış bir güneş ışığını topluyor"
 SEA_china_warlords.2.desc:0 "[FROM.GetName] ültimatomumuzu kabul etti. Liderleri ulusal birlik ve tarihi kaderden bahsediyor, ancak anlamı açık - artık [ROOT.GetNameDef] üstünlüğünü kabul ediyorlar.\nBoyun eğmeleri gönülsüz olsa da, Çin'i daha fazla bölünmeden ve kan dökülmesinden kurtarıyor."
 SEA_china_warlords.2.t:0 "[FROM.GetName] Boyun Eğiyor"
 SEA_china_warlords.3.a:0 "O zaman diz çöktürülecekler"
 SEA_china_warlords.3.desc:0 "Ültimatom reddedildi. Küstahça bir meydan okuma eyleminde, [FROM.GetLeader] halkının boyun eğmeyeceğini açıkça belirtti. Elçilerimiz reddedildiğine göre, diplomasi yerini savaşa bırakacak."
 SEA_china_warlords.3.t:0 "[FROM.GetName] Reddediyor"
 SEA_china_warlords.4.a:0 "Boyun eğmeliyiz"
 SEA_china_warlords.4.b:0 "Asla!"
 SEA_china_warlords.4.desc:0 "Durumun istikrar kazanması ve merkezi otoritenin yeniden teyit edilmesiyle [FROM.GetNameDef], savaş lordu özerkliğinin son kalıntılarını ortadan kaldırmak için harekete geçiyor. [THIS.GetNameDefCap] şimdi kalan tüm idari ve askeri kontrolü merkezi hükümete devretmesi ve birleşme sürecini tamamlaması bekleniyor."
 SEA_china_warlords.4.t:0 "[FROM.GetNameDef] Tam İlhak Talep Ediyor"
 SEA_china_warlords.5.a:0 "Birlik galip geliyor"
 SEA_china_warlords.5.desc:0 "Ulusal birlik ihtiyacını kabul eden [FROM.GetLeader], [FROM.GetNameDef] dağıtılmasını ve tüm yetkinin [ROOT.GetNameDef] tarafına devredilmesini kabul etti. İdari organları dağıtılırken silahlı kuvvetleri ulusal komuta yapısına dahil edildi."
 SEA_china_warlords.5.t:0 "[FROM.GetNameDefCap] Entegrasyonu Kabul Ediyor"
 SEA_china_warlords.6.a:0 "Buna pişman olacaklar"
 SEA_china_warlords.6.desc:0 "Merkezi hükümete açık bir meydan okumayla, [FROM.GetLeader] ültimatomu reddetti. [FROM.GetNameDefCap] nominal bir bağlı devlet olmaya devam ediyor, ancak eylemleri bağımsızlık özlemlerini kabul ediyor. Bu itaatsizlik cevapsız kalamaz."
 SEA_china_warlords.6.t:0 "[FROM.GetNameDefCap] Entegrasyonu Reddediyor"
 SEA_generic_events.10.a:0 "Her şeyi reddedeceğiz"
 SEA_generic_events.10.b:0 "Olaya karışan kişilerle aramıza mesafe koy"
 SEA_generic_events.10.desc:0 "[GetOppositionPartyName] gibi muhalefet hareketlerinin artan popülaritesi, hükümetin iktidarda kalmak için giderek daha yaratıcı önlemlere başvurmasına yol açtı. Böyle bir plan yakın zamanda ifşa oldu ve [ROOT.GetRulingParty] partisini iktidarda tutmak için harcanan kaynakların ölçeği büyük tepkiye neden oldu."
 SEA_generic_events.10.t:0 "Hükümet Yolsuzluk Skandalı"
 SEA_generic_events.11.a:0 "Adil bir şekilde tazmin edilmelerini sağlayacağız"
 SEA_generic_events.11.b:0 "Bu geçip gidecek"
 SEA_generic_events.11.desc:0 "[GetOppositionPartyName] desteğinin özellikle güçlü olduğu gemi inşa endüstrisindeki işçiler, şu anda gemi inşa çabalarımızı aksatan büyük bir grev başlattı. Siyasi endişelerinin hepsi giderilemese de, çalışma koşullarını iyileştirerek daha fazla huzursuzluğu önleyebiliriz."
 SEA_generic_events.11.t:0 "[GetOppositionPartyAdjective] Liman İşçileri Greve Gidiyor"
 SEA_generic_events.12.a:0 "Sadece ülkeyi korumak için olduğu konusunda onlara güvence ver"
 SEA_generic_events.12.b:0 "Barışı sağlamak istediğimiz konusunda onlara güvence ver"
 SEA_generic_events.12.c:0 "Yorum yapmayı reddet"
 SEA_generic_events.12.desc:0 "[GetOppositionPartyName] destekçileri ve diğer muhalifler bugün, büyüyen ordumuzun yurtdışında konuşlandırılacağından endişe ederek askeri birikimimizi ılımlı hale getirmemizi talep eden bir protesto düzenledi."
 SEA_generic_events.12.desc_wartime:0 "[GetOppositionPartyName] destekçileri ve diğer muhalefet partileri bugün, ordumuzun fedakarlığını [ROOT.GetAdjective] çıkarlar için gereksiz görerek mevcut savaşımızı sona erdirmemizi talep eden bir protesto düzenledi."
 SEA_generic_events.12.t:0 "[GetOppositionPartySupportersName] Savunma Önlemlerine Karşı Çıkıyor"
 SEA_generic_events.13.a:0 "Saygın bir politikacının kalabalığı sakinleştirmesine izin ver"
 SEA_generic_events.13.b:0 "Orduyu gönder"
 SEA_generic_events.13.desc:0 "Polis bizi bilgilendirme şansı bile bulamadan, hükümet yetkilileri [root.capital.GetCapitalVictoryPointName] şehrinde çalışırken huzursuzlukla karşılaştıklarını bildirdi. Görünüşe göre [ROOT.GetRulingParty] karşıtı büyük bir siyasi gösteri olarak başlayan olay yağmaya dönüştü ve şehir genelinde hasara neden oldu."
 SEA_generic_events.13.t:0 "[GetOppositionPartyAdjective] Destekçiler [root.capital.GetCapitalVictoryPointName] Şehrinde İsyan Çıkardı"
 SEA_generic_events.14.a:0 "[GetOppositionPartyAdjective] önerilerden birkaçını dahil edeceğiz"
 SEA_generic_events.14.b:0 "Protestonun barışçıl kalmasını sağla"
 SEA_generic_events.14.desc:0 "[GetOppositionPartyName] partisinin hükümette fazla gücü olmamasına rağmen sahip olduğu büyük popülarite, ülke çapında çok sayıda büyük protestoya yol açtı. Protestocuların taleplerinden bazılarını karşılamak durumu yatıştırabilir, ancak kendine has sorunları da var."
 SEA_generic_events.14.t:0 "Hükümet Karşıtı Büyük Protesto"
 SEA_generic_events.15.a:0 "Yerel parti yetkililerini kına"
 SEA_generic_events.15.b:0 "Protestocuları suçla"
 SEA_generic_events.15.desc:0 "[GetOppositionPartyName] tarafından düzenlenen yerel bir kitlesel protestonun, polise cisimler fırlatılmasının ardından karşılık olarak ateş açılmasıyla kanlı bir hal aldığı haberini aldık. Bu olay, ne hükümetin ne de [GetOppositionPartySupportersName] suçlusu olsa da, ülkenin istikrarı konusunda ciddi endişeler yaratıyor."
 SEA_generic_events.15.t:0 "[GetOppositionPartyAdjective] Protestolar Şiddete Dönüştü"
 SEA_generic_events.2.a:0 "Yerlerine yenileri getirilecek"
 SEA_generic_events.2.b:0 "Müdahale etmek sadece daha fazla soruna neden olur"
 SEA_generic_events.2.desc:0 "Yerel bir fabrikadaki [GetOppositionPartyAdjective] işçiler, daha iyi çalışma koşulları ve daha fazla siyasi özgürlük talebiyle üretimi kısa süreliğine durdurdu. Sınırlı ölçekte olsa da, grev [GetOppositionPartyName] popülaritesini gösteriyor."
 SEA_generic_events.2.t:0 "[GetOppositionPartyName] Grev Düzenliyor"
 SEA_generic_events.3.a:0 "Bu hakka sahip oldukları için şanslılar"
 SEA_generic_events.3.desc:0 "[GetOppositionPartyName] destekçilerinin başkentte bir gösteri düzenlediği bildiriliyor, hükümetin verimsizliklerini eleştiriyorlar ve daha merkezi bir hükümeti teşvik ediyor gibi görünüyorlar."
 SEA_generic_events.3.t:0 "[GetOppositionPartySupportersName] Zayıf Hükümeti Protesto Ediyor"
 SEA_generic_events.4.a:0 "Eylemlerini kına"
 SEA_generic_events.4.b:0 "Olayı görmezden gel"
 SEA_generic_events.4.desc:0 "Küçük bir [GetOppositionPartyName] destekçisi grubu, yakın zamanda küçük ama gürültülü bir protestoyla bir hükümet toplantısını böldü. Zararsız olsa da, benzer olayların artan yaygınlığı muhalefet hareketlerine olan desteği gösteriyor."
 SEA_generic_events.4.t:0 "[GetOppositionPartySupportersName] Hükümet Toplantısını Bozdu"
 SEA_generic_events.5.a:0 "Haberlerin bunu yayınlamadığından emin ol"
 SEA_generic_events.5.b:0 "Onlar için iyi"
 SEA_generic_events.5.desc:0 "[GetOppositionPartyName] bugün son zamanların en büyük mitinglerinden birini düzenledi ve [ROOT.GetLeader] hükümetine güçlü bir alternatif sunma sözü verdi. Hükümet şu anda mitingi görmezden gelip gelmeyeceği veya aksi takdirde [GetOppositionPartyAdjective] davaya yeni destekçiler çekebileceği için haberin yayılmasını engelleyip engellemeyeceği konusunda kararsız."
 SEA_generic_events.5.t:0 "[GetOppositionPartyName] Miting Düzenliyor"
 SEA_generic_events.6.a:0 "Halka açık bir şekilde özür dile"
 SEA_generic_events.6.b:0 "Bu planla aramıza mesafe koyacağız"
 SEA_generic_events.6.desc:0 "[ROOT.GetRulingParty] ile uyumlu hükümet yetkililerini içeren bir skandal, fonlarını sabote ederek [GetOppositionPartyName] partisini zayıflatma planlarını özetleyen bir belgenin bulunmasının ardından gün yüzüne çıktı. Yetkililer bağımsız hareket ediyor olsa da, [GetOppositionPartySupportersName] buna muhtemelen inanmayacaktır."
 SEA_generic_events.6.t:0 "[GetOppositionPartyName] Partisini Zayıflatmaya Yönelik Hükümet Planı İfşa Oldu"
 SEA_generic_events.7.a:0 "Onların endişelerine dayanarak kendimizinkini düzenleyelim"
 SEA_generic_events.7.desc:0 "[GetOppositionPartyAdjective] parti bugün bir miting düzenliyor ve gelen raporlar [ROOT.GetRulingParty] mitingleriyle aynı ölçekte bir katılım öngörüyor. Destekçilerimizin onların endişeleriyle bağ kuramayacağını ummaktan başka çaremiz yok."
 SEA_generic_events.7.t:0 "[GetOppositionPartyName] Büyük Miting Düzenliyor"
 SEA_generic_events.8.a:0 "Bunu [GetOppositionPartyName] partisini kınamak için kullanabiliriz"
 SEA_generic_events.8.b:0 "Şiddeti kınamaya odaklan"
 SEA_generic_events.8.desc:0 "[GetOppositionPartyName] popülaritesi bugün sorunlara neden oldu; bir grup destekçisi, polis müdahale etmek zorunda kalana kadar hükümet ve [ROOT.GetRulingParty] destekçileriyle çatıştı. Yerel olsa da, olay hala huzursuz siyasi iklimi gösteriyor."
 SEA_generic_events.8.t:0 "[GetOppositionPartySupportersName] Sokak Çatışmalarına Karıştı"
 SEA_generic_events.9.a:0 "[GetOppositionPartyName] partisini halka açık bir şekilde yabancı ajanlar olarak kına"
 SEA_generic_events.9.b:0 "Sızanları kökünden kazımaya odaklan"
 SEA_generic_events.9.desc:0 "Son zamanlardaki huzursuzluk raporlarının ardından, hem ordu hem de polis, [GetOppositionPartyName] üyelerinin hükümetimizi zayıflatmak veya casusluk yapmak isteyen diğer ülkeler tarafından etkilendiği sonucuna bağımsız olarak vardı."
 SEA_generic_events.9.t:0 "Yabancı Ajanlar [GetOppositionPartyAdjective] Popülaritesini İstismar Ediyor"
 SEA_imperial_influence_demand_event_option_1:0 "Kararlılığımızı sınayacağız"
 SEA_imperial_influence_demand_event_option_10:0 "Ertelenen bir seçim, yapılmış bir seçimdir"
 SEA_imperial_influence_demand_event_option_2:0 "Yolumuz açık"
 SEA_imperial_influence_demand_event_option_3:0 "Büyük şeyler genellikle küçük başlangıçlara sahiptir"
 SEA_imperial_influence_demand_event_option_4:0 "Hiçbir şey bedavadan daha pahalı değildir"
 SEA_imperial_influence_demand_event_option_5:0 "Daha fazla telaş, daha az hız"
 SEA_imperial_influence_demand_event_option_6:0 "Yap ya da yapma, deneme diye bir şey yoktur"
 SEA_imperial_influence_demand_event_option_7:0 "Eylem sözlerden daha yüksek sesle konuşur"
 SEA_imperial_influence_demand_event_option_8:0 "Kader kimseyi beklemez"
 SEA_imperial_influence_demand_event_option_9:0 "Kararlılık taşı aşındırır"
 SEA_imperial_influence_events.00.a:0 "[GetNameImperialInfluenceDemandOptions]"
 SEA_imperial_influence_events.00.b:0 "[GetNameImperialInfluenceFailureOptions]"
 SEA_imperial_influence_events.1.a:0 "Ordu Hizbini Görmezden Gel"
 SEA_imperial_influence_events.1.b:0 "Donanma Hizbini Görmezden Gel"
 SEA_imperial_influence_events.1.c:0 "Zaibatsu Hizbini Görmezden Gel"
 SEA_imperial_influence_events.1.d:0 "Sivil Hükümet Hizbini Görmezden Gel"
 SEA_imperial_influence_events.1.desc:0 "[ROOT.GetNameDef] içindeki çeşitli iç gruplar arasında şiddetli bir güç mücadelesi patlak verdi; hepsi [GetImperialInfluenceRulerTitle]'nin kulağı için yarışıyor ve [GetImperialInfluenceGenderHimHer]'yi kendi davalarına yönlendirmeye çalışıyor. Herkesin aklındaki soru şu; [GetImperialInfluenceRulerTitle] sonuçta hangi grubu tercih edecek ve [GetImperialInfluenceGenderHeShe] hangisini göz ardı edecek?"
 SEA_imperial_influence_events.1.t:0 "İç Güç Mücadelesi Patlak Verdi"
 SEA_imperial_influence_events.100.desc:0 "Ordu hizbi [GetImperialInfluenceRulerTitle] üzerindeki nüfuzunu artırmaya çalıştı, ancak eksiklikleri nedeniyle bunu başaramadı. Bu yüzden itibar kaybettiler ve dolayısıyla prestijleri azaldı, bu da nüfuzlarının azaldığı anlamına geliyor."
 SEA_imperial_influence_events.100.t:0 "Ordu Hizbi Nüfuz Kaybediyor"
 SEA_imperial_influence_events.110.desc:0 "Ordu taleplerini iletti. Görünüşe göre üretim yeteneklerini ve [GetImperialInfluenceRulerTitle] üzerindeki nüfuzlarını genişletmek istiyorlar ve bu nedenle çıktımızı artırmak için daha fazla Askeri Fabrika inşa etmemizi talep ediyorlar. Biraz sabır göstermeye istekli görünüyorlar, ancak sonsuza kadar beklemeyecekler."
 SEA_imperial_influence_events.110.t:0 "Ordu Hizbi Silah Üretimini Genişletmek İstiyor"
 SEA_imperial_influence_events.120.desc:0 "Ordu taleplerini iletti. Merkezi kontrol ve kendi başlarına hareket etme özerkliğinden yoksun oldukları için, göreve yeni bir Kara Kuvvetleri Komutanı atanmasını istiyorlar, bu da [GetImperialInfluenceRulerTitle] üzerindeki nüfuzlarını güçlendirmeye hizmet edecek. Biraz sabır göstermeye istekli görünüyorlar, ancak sonsuza kadar beklemeyecekler."
 SEA_imperial_influence_events.120.t:0 "Ordu Hizbi Siyasi Atamalar Talep Ediyor"
 SEA_imperial_influence_events.130.desc:0 "Ordu taleplerini iletti. Ulusal zorunlu askerliğimizi artırmamızı ve yaklaşan savaş çabaları için daha fazla genç erkeği askere almak üzere kırsal köylere işe alım görevlileri göndermemizi istiyorlar. Sadece silahlı kuvvetlerimizi güçlendirme kisvesine rağmen, görünüşe göre [GetImperialInfluenceRulerTitle] üzerindeki kontrollerini ve nüfuzlarını da artırmak istiyorlar. Biraz sabır göstermeye istekli görünüyorlar, ancak sonsuza kadar beklemeyecekler."
 SEA_imperial_influence_events.130.t:0 "Ordu Hizbi Zorunlu Askerlik Yasası Değişiklikleri İstiyor"
 SEA_imperial_influence_events.140.desc:0 "Ordu taleplerini iletti. Ordumuzdaki alay sayısını artırmamızı ve yaklaşan fetihlere yardımcı olmak için daha fazla tümen kurmamızı istiyorlar. Sadece silahlı kuvvetlerimizi güçlendirme kisvesine rağmen, görünüşe göre [GetImperialInfluenceRulerTitle] üzerindeki kontrollerini ve nüfuzlarını da artırmak istiyorlar. Biraz sabır göstermeye istekli görünüyorlar, ancak sonsuza kadar beklemeyecekler."
 SEA_imperial_influence_events.140.t:0 "Ordu Hizbi Genişleme Planlıyor"
 SEA_imperial_influence_events.150.desc:0 "Ordu taleplerini iletti. Görünüşe göre motorlu araç üretim yeteneklerini ve [GetImperialInfluenceRulerTitle] üzerindeki nüfuzlarını genişletmek istiyorlar ve bu nedenle genişleme ihtiyaçlarını karşılamak için daha fazla kamyon inşa etmemizi talep ediyorlar. Biraz sabır göstermeye istekli görünüyorlar, ancak sonsuza kadar beklemeyecekler."
 SEA_imperial_influence_events.150.t:0 "Ordu Hizbi Destek Kamyonlarında Israrcı"
 SEA_imperial_influence_events.160.desc:0 "Ordu taleplerini iletti. Görünüşe göre tank üretim yeteneklerini ve [GetImperialInfluenceRulerTitle] üzerindeki nüfuzlarını genişletmek istiyorlar ve bu nedenle genişleme ihtiyaçlarını karşılamak için daha fazla tank inşa etmemizi talep ediyorlar. Biraz sabır göstermeye istekli görünüyorlar, ancak sonsuza kadar beklemeyecekler."
 SEA_imperial_influence_events.160.t:0 "Ordu Hizbi Artan Tank Üretimi Talep Ediyor"
 SEA_imperial_influence_events.161.desc:0 "Ordu taleplerini iletti. Görünüşe göre topçu üretim yeteneklerini ve [GetImperialInfluenceRulerTitle] üzerindeki nüfuzlarını genişletmek istiyorlar ve bu nedenle genişleme ihtiyaçlarını karşılamak için daha fazla topçu inşa etmemizi talep ediyorlar. Biraz sabır göstermeye istekli görünüyorlar, ancak sonsuza kadar beklemeyecekler."
 SEA_imperial_influence_events.161.t:0 "Ordu Hizbi Artan Topçu Üretimi Talep Ediyor"
 SEA_imperial_influence_events.200.desc:0 "Donanma hizbi [GetImperialInfluenceRulerTitle] üzerindeki nüfuzunu artırmaya çalıştı, ancak eksiklikleri nedeniyle bunu başaramadı. Bu yüzden itibar kaybettiler ve dolayısıyla prestijleri azaldı, bu da nüfuzlarının azaldığı anlamına geliyor."
 SEA_imperial_influence_events.200.t:0 "Donanma Hizbi Nüfuz Kaybediyor"
 SEA_imperial_influence_events.210.desc:0 "Donanma taleplerini iletti. Görünüşe göre üretim yeteneklerini ve [GetImperialInfluenceRulerTitle] üzerindeki nüfuzlarını genişletmek istiyorlar ve bu nedenle çıktımızı artırmak için daha fazla Tersane inşa etmemizi talep ediyorlar. Biraz sabır göstermeye istekli görünüyorlar, ancak sonsuza kadar beklemeyecekler."
 SEA_imperial_influence_events.210.t:0 "Donanma Hizbi Tersane Üretimini Genişletmek İstiyor"
 SEA_imperial_influence_events.220.desc:0 "Donanma taleplerini iletti. Merkezi kontrol ve kendi başlarına hareket etme özerkliğinden yoksun oldukları için, göreve yeni bir Donanma Komutanı atanmasını istiyorlar, bu da [GetImperialInfluenceRulerTitle] üzerindeki nüfuzlarını güçlendirmeye hizmet edecek. Biraz sabır göstermeye istekli görünüyorlar, ancak sonsuza kadar beklemeyecekler."
 SEA_imperial_influence_events.220.t:0 "Donanma Hizbi Siyasi Atamalar Talep Ediyor"
 SEA_imperial_influence_events.230.desc:0 "Donanma taleplerini iletti. Ulusal zorunlu askerliğimizi artırmamızı ve yaklaşan savaş çabaları için daha fazla genç erkeği askere almak üzere kırsal köylere donanma elçileri göndermemizi istiyorlar. Sadece silahlı kuvvetlerimizi güçlendirme kisvesine rağmen, görünüşe göre [GetImperialInfluenceRulerTitle] üzerindeki kontrollerini ve nüfuzlarını da artırmak istiyorlar. Biraz sabır göstermeye istekli görünüyorlar, ancak sonsuza kadar beklemeyecekler."
 SEA_imperial_influence_events.230.t:0 "Donanma Hizbi Zorunlu Askerlik Yasası Değişiklikleri İstiyor"
 SEA_imperial_influence_events.240.desc:0 "Donanma taleplerini iletti. Görünüşe göre uçak gemisi filolarını ve [GetImperialInfluenceRulerTitle] üzerindeki nüfuzlarını genişletmek istiyorlar ve bu nedenle genişleme ihtiyaçlarını karşılamak için daha fazla uçak gemisi inşası emri vermemizi talep ediyorlar. Biraz sabır göstermeye istekli görünüyorlar, ancak sonsuza kadar beklemeyecekler."
 SEA_imperial_influence_events.240.t:0 "Donanma Hizbi Artan Uçak Gemisi Üretimi Talep Ediyor"
 SEA_imperial_influence_events.241.desc:0 "Donanma taleplerini iletti. Görünüşe göre üretim yeteneklerini ve [GetImperialInfluenceRulerTitle] üzerindeki nüfuzlarını genişletmek istiyorlar ve bu nedenle genişleme ihtiyaçlarını karşılamak için daha fazla Tersane inşası emri vermemizi talep ediyorlar. Biraz sabır göstermeye istekli görünüyorlar, ancak sonsuza kadar beklemeyecekler."
 SEA_imperial_influence_events.241.t:0 "Donanma Hizbi Artan Gemi Üretimi Talep Ediyor"
 SEA_imperial_influence_events.242.desc:0 "Donanma taleplerini iletti. Görünüşe göre zırhlı filolarını ve [GetImperialInfluenceRulerTitle] üzerindeki nüfuzlarını genişletmek istiyorlar ve bu nedenle genişleme ihtiyaçlarını karşılamak için daha fazla zırhlı inşası emri vermemizi talep ediyorlar. Biraz sabır göstermeye istekli görünüyorlar, ancak sonsuza kadar beklemeyecekler."
 SEA_imperial_influence_events.242.t:0 "Donanma Hizbi Artan Zırhlı Üretimi Talep Ediyor"
 SEA_imperial_influence_events.300.desc:0 "Zaibatsular [GetImperialInfluenceRulerTitle] üzerindeki nüfuzlarını artırmaya çalıştılar, ancak eksiklikleri nedeniyle bunu başaramadılar. Bu yüzden itibar kaybettiler ve dolayısıyla prestijleri azaldı, bu da nüfuzlarının azaldığı anlamına geliyor."
 SEA_imperial_influence_events.300.t:0 "Zaibatsu Hizbi Nüfuz Kaybediyor"
 SEA_imperial_influence_events.310.desc:0 "Zaibatsu liderleri taleplerini iletti. Görünüşe göre varlıklarını ve sanayilerini ve [GetImperialInfluenceRulerTitle] üzerindeki nüfuzlarını genişletmek istiyorlar ve bu nedenle sanayi tabanımızı artırmak için daha fazla Sivil Fabrika inşa etmemizi talep ediyorlar. Biraz sabır göstermeye istekli görünüyorlar, ancak sonsuza kadar beklemeyecekler."
 SEA_imperial_influence_events.310.t:0 "Zaibatsu Hizbi Sanayi Tabanımızı Genişletmek İstiyor"
 SEA_imperial_influence_events.320.desc:0 "Zaibatsu liderleri taleplerini iletti. Görünüşe göre üyelerinden en az birinin [GetImperialInfluenceRulerTitle] danışma kuruluna yerleştirilmesini istiyorlar, böylece sanayileşmeye ve ulusun yoluna rehberlik edebilirler. Biraz sabır göstermeye istekli görünüyorlar, ancak sonsuza kadar beklemeyecekler."
 SEA_imperial_influence_events.320.t:0 "Zaibatsu Hizbi Siyasi Atamalar Talep Ediyor"
 SEA_imperial_influence_events.330.desc:0 "Zaibatsu liderleri taleplerini iletti. Ulusumuzun ekonomik stratejisini ayarlamamızı ve sanayi holdinglerine daha fazla fon gitmesini istiyorlar. Sadece ekonomimizi güçlendirme kisvesine rağmen, görünüşe göre [GetImperialInfluenceRulerTitle] üzerindeki kontrollerini ve nüfuzlarını da artırmak istiyorlar. Biraz sabır göstermeye istekli görünüyorlar, ancak sonsuza kadar beklemeyecekler."
 SEA_imperial_influence_events.330.t:0 "Zaibatsu Hizbi Ekonomi Yasası Değişiklikleri İstiyor"
 SEA_imperial_influence_events.340.desc:0 "Zaibatsu liderleri taleplerini iletti. Görünüşe göre şirketlerinden en az birinin [GetImperialInfluenceRulerTitle] tarafından doğrudan sözleşmeler için işe alınmasını istiyorlar, böylece sanayileşmeye ve ulusun yoluna rehberlik edebilirler. Biraz sabır göstermeye istekli görünüyorlar, ancak sonsuza kadar beklemeyecekler."
 SEA_imperial_influence_events.340.t:0 "Zaibatsu Hizbi Bir Sanayi Şirketi İşe Almamızı Talep Ediyor"
 SEA_imperial_influence_events.400.desc:0 "Sivil Hükümet [GetImperialInfluenceRulerTitle] üzerindeki nüfuzunu artırmaya çalıştı, ancak eksiklikleri nedeniyle bunu başaramadı. Bu yüzden itibar kaybettiler ve dolayısıyla prestijleri azaldı, bu da nüfuzlarının azaldığı anlamına geliyor."
 SEA_imperial_influence_events.400.t:0 "Sivil Hükümet Nüfuz Kaybediyor"
 SEA_imperial_influence_events.420.desc:0 "Parti liderleri taleplerini iletti. Görünüşe göre üyelerinden en az birinin [GetImperialInfluenceRulerTitle] danışma kuruluna yerleştirilmesini istiyorlar, böylece ulusun siyasi yönüne rehberlik edebilir ve onu daha parlak bir geleceğe yönlendirebilirler. Biraz sabır göstermeye istekli görünüyorlar, ancak sonsuza kadar beklemeyecekler."
 SEA_imperial_influence_events.420.t:0 "Sivil Hükümet Hizbi Siyasi Atamalar Talep Ediyor"
 SEA_imperial_influence_events.430.desc:0 "Parti liderleri taleplerini iletti. Ulusumuzun ekonomik stratejisini ayarlamamızı ve yatırım ve ticaret stratejilerinin enternasyonalizm ve ticaret ortaklarımızla daha iyi ilişkiler lehine kaydırılmasını istiyorlar. Sadece ekonomimizi güçlendirme kisvesine rağmen, görünüşe göre [GetImperialInfluenceRulerTitle] üzerindeki kontrollerini ve nüfuzlarını da artırmak istiyorlar. Biraz sabır göstermeye istekli görünüyorlar, ancak sonsuza kadar beklemeyecekler."
 SEA_imperial_influence_events.430.t:0 "Sivil Hükümet Hizbi Ticaret Yasası Değişiklikleri İstiyor"
 SEA_imperial_influence_events.440.desc:0 "Parti liderleri taleplerini iletti. Görünüşe göre Ordunun [GetImperialInfluenceRulerTitle] üzerindeki artan gücünden ve nüfuzundan rahatsızlar ve büyümelerini ve güçlerini sınırlamak için hızlı eylem istiyorlar. Biraz sabır göstermeye istekli görünüyorlar, ancak sonsuza kadar beklemeyecekler."
 SEA_imperial_influence_events.440.t:0 "Sivil Hükümet Hizbi Ordunun Nüfuzunu Sınırlamak İstiyor"
 SEA_imperial_influence_events.450.desc:0 "Parti liderleri taleplerini iletti. Görünüşe göre Donanmanın [GetImperialInfluenceRulerTitle] üzerindeki artan gücünden ve nüfuzundan rahatsızlar ve büyümelerini ve güçlerini sınırlamak için hızlı eylem istiyorlar. Biraz sabır göstermeye istekli görünüyorlar, ancak sonsuza kadar beklemeyecekler."
 SEA_imperial_influence_events.450.t:0 "Sivil Hükümet Hizbi Donanmanın Nüfuzunu Sınırlamak İstiyor"
 SEA_imperial_influence_events.460.desc:0 "Parti liderleri taleplerini iletti. Görünüşe göre Zaibatsuların [GetImperialInfluenceRulerTitle] üzerindeki artan gücünden ve nüfuzundan rahatsızlar ve büyümelerini ve güçlerini sınırlamak için hızlı eylem istiyorlar. Biraz sabır göstermeye istekli görünüyorlar, ancak sonsuza kadar beklemeyecekler."
 SEA_imperial_influence_events.460.t:0 "Sivil Hükümet Hizbi Zaibatsuların Nüfuzunu Sınırlamak İstiyor"
 SEA_imperial_influence_events.500.a:0 "Hazırlıklar aceleyle yapılmalı!"
 SEA_imperial_influence_events.500.desc:0 "[ROOT.GetLeader], Doğu Hint Adaları'nda bulunabilecek kaynaklara olan ihtiyaçlarının artık kritik bir noktaya ulaştığını iddia ederek, Güney Saldırı Doktrini'nin tam ölçekli olarak yürürlüğe girmesi için hazırlıkların başlatılmasını talep eden Donanma Karargahı tarafından imzalanmış bir mektup aldı. Elbette görmezden gelinebilirler, ancak belki de onları bekletmek akıllıca olmaz."
 SEA_imperial_influence_events.500.t:0 "Donanma Hizbi Güneye Saldırmamızı Talep Ediyor"
 SEA_imperial_influence_events.501.a:0 "Ne kadar onursuz bir davranış!"
 SEA_imperial_influence_events.501.desc:0 "Donanma Karargahı tarafından bize ayrılan süre içinde Güney Saldırı Doktrini'nin yürütülmesi için hazırlanan planları yürürlüğe koyamayınca, [ROOT.GetLeader] üzerinde baskı kurma girişimine katılan Donanma Subaylarının çoğunun istifa ettiği görülüyor."
 SEA_imperial_influence_events.501.t:0 "Donanma Subayları Öfkeyle İstifa Ediyor"
