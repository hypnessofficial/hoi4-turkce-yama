 cavity_magnatron:0 "Boşluk Magnetronu"
 cavity_magnatron_desc:0 "Boşluk Magnetronu adı verilen mikrodalgalar üreten bir tüp kullanarak, mevcut radar sistemlerinin nesnelerden dalgaları sektirerek onları tespit etme yeteneğini önemli ölçüde artırabiliriz."
 centimetric_radar:0 "Santimetrik Radar"
 centimetric_radar_desc:0 "Mikrodalga bantlarında çalışan yeni radar, önceki radarların yakalayamayacağı kadar küçük nesneleri tespit etmemizi sağlar."
 central_planning:0 "Merkezi Planlama"
 central_planning_desc:0 "Tüm branşlardan subaylar, belirli bir operasyonun maksimum verimlilikte çalışmasını sağlamak için planlanmasına katkıda bulunur."
 centralized_fire_control:0 "Merkezi Ateş Kontrolü"
 centralized_fire_control_desc:0 "Merkezi bir Ateş Kontrol sistemi, tüm topçu desteği çağrılarının tek bir yerde değerlendirilmesine ve gerekirse, bir birimin yalnızca kendilerine atanan topçudan ateş talep edebilmesi yerine, bir tümenin tüm ateş gücünün bir hedefe yoğunlaştırılmasına olanak tanır.\n\n"
 civilian_industry:0 "Sivil sanayi"
 click_to_open_doctrine:0 "Doktrinleri açmak için §Gtıklayın§!"
 coastal_defense_ships:0 "Kıyı Savunma Gemileri"
 coastal_fort_tech_1:0 "Geliştirilmiş Kıyı Tahkimatları"
 coastal_fort_tech_1_desc:0 "Kıyı tahkimatlarımızın etrafındaki araziyi daha iyi kullanarak ve yeni teknolojiyi de dahil ederek, mevcut yapılarımızı güçlendirebilir ve daha da genişletebiliriz."
 coastal_fort_tech_2:0 "Gelişmiş Kıyı Tahkimatları"
 coastal_fort_tech_2_desc:0 "Sığınaklarımızı ve tahkimatlarımızı yamaçların ve tepelerin daha içlerine inşa ederek, en büyük deniz çıkarma kuvvetlerini bile püskürtebilecek daha da büyük kompleksler inşa edebiliriz."
 combat_unit_destruction:0 "Muharebe Birimi İmhası"
 combat_unit_destruction_desc:0 "Yakın Hava Desteği pilotlarımızı, yok edildiği onaylanana kadar aynı hedefi tekrar tekrar saldırmaları için eğitmek, hedeflerin kıl payı bir ıskalamadan sonra yalnız bırakılmamasını sağlar."
 combined_arms:0 "Müşterek Harekat"
 combined_arms_desc:0 "İyi organize edilmiş takımlarda birlikte çalışan Zırhlı, Piyade ve Destek birimleri, aynı kuvvetlerin ayrı ayrı kullanılmasından çok daha etkilidir."
 combined_operations_raiding:0 "Müşterek Harekat Akını"
 combined_operations_raiding_desc:0 "Tüm kaynakları düşman ticaret konvoylarını avlamak için belirlemek. Ana filomuz ve denizaltılarımız arasındaki koordinasyon, filomuzu her zaman tetikte tutar. Sularımızda hiçbir gemi fark edilmeden geçemez."
 computing_machine:0 "Hesaplama Makinesi"
 computing_machine_desc:0 "Modern bilgisayarlar için teorik bir temel geliştirmek ve bunları pratiğe dökmeye başlamak için elektromekanik makineler inşa etmek, bu olanaklar alanına atılacak ilk adımlar olacaktır."
 computing_tech:0 "Hesaplama teknolojisi"
 concentrated_fire_plans:0 "Yoğunlaştırılmış Ateş Planları"
 concentrated_fire_plans_desc:0 "Farklı bataryaların ateşini senkronize bir bombardımana yoğunlaştırarak düşmana çok daha büyük hasar verilebilir.\n\n"
 concentrated_industry:0 "Yoğunlaştırılmış Sanayi I"
 concentrated_industry2:0 "Yoğunlaştırılmış Sanayi II"
 concentrated_industry2_desc:0 "Üretimi daha da yoğunlaştırmak maliyetleri düşürmeye yardımcı olacaktır."
 concentrated_industry3:0 "Yoğunlaştırılmış Sanayi III"
 concentrated_industry3_desc:0 "Altyapı harcamaları, ağları daha odaklı sanayimize uyarlayarak düşürülebilir."
 concentrated_industry4:0 "Yoğunlaştırılmış Sanayi IV"
 concentrated_industry4_desc:0 "Sanayimizdeki kilit noktaları birbirine yakın tutmak, bu yoğunlaştırılmış tesislerin etkisini artırır."
 concentrated_industry5:0 "Yoğunlaştırılmış Sanayi V"
 concentrated_industry5_desc:0 "Büyük sanayi kompleksleri artık sanayimizin birçok parçasını birleştirerek nakliye ve işçilik maliyetlerini en aza indiriyor."
 concentrated_industry_category:0 "Yoğunlaştırılmış Sanayi Teknolojileri"
 concentrated_industry_desc:0 "Endüstriyel üretimimizi birkaç kilit tesise odaklamak, verimliliğini önemli ölçüde artırmamızı sağlayacaktır.\n\n"
 construction1:0 "İnşaat I"
 construction1_desc:0 "Geliştirilmiş yöntemler ve malzemeler, hem sivil hem de askeri binaları daha hızlı inşa etmemizi sağlar."
 construction2:0 "İnşaat II"
 construction2_desc:0 "Aletlerimizi ve ekipmanlarımızı modernize etmek, inşaat çabalarımıza daha fazla yardımcı olacaktır."
 construction3:0 "İnşaat III"
 construction3_desc:0 "Modern araçların benimsenmesi ve inşaattaki ilerlemelerimizden edindiğimiz deneyim, onarımları çok daha hızlı hale getirmek için uygulanabilir."
 construction4:0 "İnşaat IV"
 construction4_desc:0 "Daha yüksek derecede mekanizasyon ve daha iyi rutinler, bina inşaat hızlarını daha da artırır."
 construction5:0 "İnşaat V"
 construction5_desc:0 "Verimli inşaatın geleceği, bireysel projeler için daha kapsamlı planlamanın yanı sıra mümkün olan her yerde standartlaştırılmış çözümler gerektirecektir."
 construction_tech:0 "İnşaat teknolojisi"
 continuous_offensive:0 "Sürekli Taarruz"
 continuous_offensive_desc:0 "Düzgün bir şekilde sömürülen Yarımlar genellikle çok etkili olsa da, er ya da geç saldırgan her zaman yorulur ve savunmacı yeni savunma hatlarını yeniden düzenleyip oluşturabilir. Ancak, yeterli rezerv ve doğru organizasyonla, bir taarruz çok daha büyük bir derinliğe kadar devam ettirilebilir ve düşmana yıkıcı sonuçlar doğurabilir."
 convoy_defense_tree:0 "Konvoy Savunma Doktrini"
 convoy_escorts:0 "Konvoy Eskortları"
 convoy_escorts_bs:0 "Konvoy Eskortları"
 convoy_escorts_bs_desc:0 "Konvoylarımızın bir parçası olarak hızlı su üstü gemileri, düşman denizaltılarını tespit etmemizi ve zamanında müdahale etmemizi sağlayacaktır. Tespit, denizaltı sıkıntısını ortadan kaldırmanın anahtarıdır."
 convoy_escorts_desc:0 "Konvoylarımızın bir parçası olarak hızlı su üstü gemileri, düşman denizaltılarını tespit etmemizi ve zamanında müdahale etmemizi sağlayacaktır. Tespit, denizaltı sıkıntısını ortadan kaldırmanın anahtarıdır."
 convoy_interdiction:0 "Konvoy Engellemesi"
 convoy_interdiction_bs:0 "Konvoy Engellemesi"
 convoy_interdiction_bs_desc:0 "Denizaltılarımızın daha iyi koordinasyonu, yoldaki ticaret konvoylarına saldırmalarını sağlayacaktır. Düşmanın ikmal hatlarını bozmak bize stratejik avantaj sağlayacaktır."
 convoy_interdiction_desc:0 "Denizaltılarımızın daha iyi koordinasyonu, yoldaki ticaret konvoylarına saldırmalarını sağlayacaktır. Düşmanın ikmal hatlarını bozmak bize stratejik avantaj sağlayacaktır."
 convoy_interdiction_ti:0 "Konvoy Engellemesi"
 convoy_interdiction_ti_desc:0 "Denizaltılarımızın daha iyi koordinasyonu, yoldaki ticaret konvoylarına saldırmalarını sağlayacaktır. Düşmanın ikmal hatlarını bozmak bize stratejik avantaj sağlayacaktır."
 convoy_sailing:0 "Konvoy Seyri"
 convoy_sailing_bs:0 "Konvoy Seyri"
 convoy_sailing_bs_desc:0 "Zorunlu konvoy seyrini getirmek, düşman akınlarını tespit etmeyi ve zamanında müdahale etmeyi kolaylaştıracaktır. Sayıca çok olmak güvenliktir."
 convoy_sailing_desc:0 "Zorunlu konvoy seyrini getirmek, düşman akınlarını tespit etmeyi ve zamanında müdahale etmeyi kolaylaştıracaktır. Sayıca çok olmak güvenliktir."
 convoy_sailing_ti:0 "Konvoy Seyri"
 convoy_sailing_ti_desc:0 "Zorunlu konvoy seyrini getirmek, düşman akınlarını tespit etmeyi ve zamanında müdahale etmeyi kolaylaştıracaktır. Sayıca çok olmak güvenliktir."
 cruiser_armor_advice_tt:0 "\nDaha iyi bir §YZırh§! modülünü §YKruvazörlere§! monte etmek, hasara dayanma yeteneklerini geliştirir."
 cruiser_submarines:0 "Kruvazör Denizaltı Gövdesi"
 cv_suicide_craft:0 "$suicide_craft$ (Uçak Gemisi)"
 cv_suicide_craft_desc:0 "$suicide_craft_desc$"
 cv_tech:0 " Uçak Gemisi modelleri"
 damage_control_1:0 "Yangınla Mücadele Tatbikatları"
 damage_control_1_desc:0 "Bir geminin mürettebatının her üyesi, Kaptandan basit denizciye kadar, gemideki yangınları kontrol altına alma ve söndürme konusunda yardımcı olabilmelidir."
 damage_control_2:0 "Ayrı Yangın Şebekeleri"
 damage_control_2_desc:0 "Geminin etrafındaki ana su hatlarını ayırarak, bir isabetin gemiyi yangınla mücadele edemez hale getirme olasılığı büyük ölçüde azalır."
 damage_control_3:0 "Dizel Motorlu Acil Durum Pompaları"
 damage_control_3_desc:0 "Genellikle ana motorlara güç için bağımlı olan ağır pompalarla, makine dairesindeki tek ve oldukça hafif bir isabet, gemiyi su üstünde kalamaz hale getirebilir."
 day_bombing:0 "Gündüz Bombardımanı"
 day_bombing_desc:0 "Görünürlüğün büyük avantajı nedeniyle gündüz yapılan odaklanmış çabalar yıkıcıdır. Güç gösterisi hoş bir yan etkidir.\n\n"
 dd_tech:0 " Muhrip modelleri"
 dead_reckoning_bombing:0 "Parakete Hesabı Bombardımanı"
 dead_reckoning_bombing_desc:0 "Önceki konumlardan hızı, yönü ve sürüklenmeyi ölçerek, gece boyunca bile daha hassas bomba bırakma hesaplamaları yapabiliriz."
 decryption_tech:0 "Şifre çözme yöntemleri"
 decryption_tech_research:0 " Şifre Çözme Araştırma Hızı"
 deep_operations:0 "Derinlemesine Operasyonlar"
 deep_operations_desc:0 "Derinlemesine Operasyonlar veya Derin Savaş kavramı, düşmanın savunma hatlarını birden fazla noktada yarmak ve operasyonel rezervlerini, operasyonel derinliğini yok etmek ve stratejik derinliğinin mümkün olduğunca fazlasını işgal etmektir."
 defence_in_depth:0 "Derinlemesine Savunma"
 defence_in_depth_desc:0 "Nispeten hafif bir direniş sunarak ve geçici olarak toprak vererek, zaman karşılığında alan takası yapabilir ve saldıran kuvvetlerin karşı saldırıya geçmeden önce kendilerini tüketmelerine izin verebiliriz."
 degaussing:0 "Manyetik Alan Giderme"
 degaussing_desc:0 "Güçlü elektro-manyetik bobinler kurarak, bir geminin manyetik imzası önemli ölçüde azaltılabilir, bu da onu manyetik mayınlara karşı çok daha az savunmasız hale getirir."
 delay:0 "Oyalama"
 delay_desc:0 "Bir savaş kazanılamasa bile, pusu ve oyalama taktikleriyle saldıran kuvvetlerin ilerlemesini yavaşlatmak avantajlı olabilir."
 depth_charges_advice_tt:0 "\n§YDerinlik Bombası§! modülünü §YHafif Gemilere§! ve §YKruvazörlere§! monte etmek, düşman §YDenizaltılarına§! saldırmalarını sağlayacaktır."
 desert_training_tech:0 "Çöl Eğitimi"
 direct_ground_support:0 "Doğrudan Kara Desteği"
 direct_ground_support_desc:0 "Yakın Hava Desteği pilotlarını yer tabanlı gözlemcilerle yakından koordine ederek, hava ateş gücü savaşta birliklere en iyi şekilde yardımcı olmak için hassas bir şekilde yönlendirilebilir."
 dispersed_fighting:0 "Dağınık Muharebe"
 dispersed_fighting_desc:0 "Daha dağınık bir formasyon benimsemek, aynı sayıda uçağın daha geniş bir alanı devriye gezmesine olanak tanır."
 dispersed_industry:0 "Dağıtılmış Sanayi I"
 dispersed_industry2:0 "Dağıtılmış Sanayi II"
 dispersed_industry2_desc:0 "Üretimimizi daha da merkezsizleştirmek, belirli kısımlarına saldırmayı zorlaştırır."
 dispersed_industry3:0 "Dağıtılmış Sanayi III"
 dispersed_industry3_desc:0 "Fabrikaların başka operasyonlar kisvesi altında faaliyet göstermesi, doğrudan saldırı riskini azaltacaktır."
 dispersed_industry4:0 "Dağıtılmış Sanayi IV"
 dispersed_industry4_desc:0 "Fabrikalarımızı kamufle etmek ve dağıtmak, tamamen bozulması çok zor bir ağ oluşturur."
 dispersed_industry5:0 "Dağıtılmış Sanayi V"
 dispersed_industry5_desc:0 "Sadece sanayimizin değil, onu bir arada tutan altyapının da gizlilik içinde çalışmasını sağlayarak, hava saldırılarıyla yok edilmesini daha da zorlaştırabiliriz."
 dispersed_industry_category:0 "Dağıtılmış Sanayi Teknolojileri"
 dispersed_industry_desc:0 "Sanayilerimizi yayarak, savaş zamanlarında düşmanın hedef almasını zorlaştırmayı sağlayabiliriz.\n\n"
 dispersed_support:0 "Dağıtılmış Destek"
 dispersed_support_desc:0 "Destek birimlerimizi dağıtarak, ateş hattının dışında kalırken daha geniş bir alanı kaplamalarını sağlayabiliriz, bu da daha fazla savunmaya sahip tümenlerle sonuçlanır.\n\n"
 dive_bombing:0 "Dalma Bombardımanı"
 dive_bombing_desc:0 "Dalma bombardımanı daha fazla isabet sağlar, ancak en iyi sonuçlar için hem dalışlarını yavaşlatabilen hem de dalıştan çıkma streslerine dayanabilen özel uçaklar gerektirir."
 dogfighting_experience:0 "İt Dalaşı Deneyimi"
 dogfighting_experience_desc:0 "Bir it dalaşının telaşlı girdabında dost ve düşmanların göreceli pozisyonlarını takip etmek kolay değil, ancak pilotlarımız deneyim kazandıkça bunda daha usta hale geliyorlar."
 early_carrier:0 "İlkel Uçak Gemisi (Uçak Gemisi I)"
 early_refining:0 "İlkel Rafinasyon"
 early_refining_desc:0 "Ham petrol, herhangi bir modern savaş için hayati olan bir dizi maddeye ve malzemeye rafine edilebilir. Modern bir sanayi inşa etmek için bu yöntemlerde önde olmak gerekli olacaktır."
 early_ship_hull_carrier:0 "Güverte Dönüşümleri"
 early_ship_hull_carrier_desc:0 "Eski gövdelerin dönüştürülmesi, deniz havacılığı ile ilgili ucuz deneyler yapılmasına ve uçak gemileri inşa etme ve işletme konusunda deneyim kazanılmasına olanak tanır. Bu gemiler, amaca yönelik inşa edilmiş bir uçak gemisinden daha az yetenekli olacak, ancak yaratılması çok daha hızlı olacaktır."
 early_ship_hull_carrier_short:0 "Güverte Dönüşümleri"
 elastic_defence:0 "Esnek Savunma"
 elastic_defence_desc:0 "Tüm gücü cephe hattına odaklamak yerine, esnek bir savunma, savunmacının tepki vermesi ve saldırgan dağılmış ve bataklığa saplanmışken karşı saldırıya geçmesi için daha fazla zaman tanıyan 'daha derin' bir savunma katmanı oluşturur."
 electric_torpedo:0 "Elektrikli Torpido"
 electric_torpedo_desc:0 "Kolayca tespit edilen bir baloncuk izi bırakmak yerine, elektrikli bir motora sahip bir torpido, çarpana kadar pratik olarak görünmez kalır. Bu aynı zamanda fırlatan denizaltıya geri dönen bir iz olmadığı anlamına da gelir."
 electronic_mechanical_engineering:0 "Elektronik Mekanik Mühendisliği"
 electronic_mechanical_engineering_desc:0 "Elektrikli makinelerin artık bizi sadece ısıtıp aydınlatmakla kalmayıp, düşünmemize ve iletişim kurmamıza da yardımcı olabildiği bir çağda yaşıyoruz. Elektronik, gelecek yüzyılda askeri istihbaratın anahtarı olacaktır."
 electronics:0 " Elektronik"
 electronics_folder:0 "Mühendislik"
 electronics_folder_desc:0 "Mühendislik, radar, şifreleme ve gelişmiş teknoloji araştırması."
 elite_forces:0 "Elit Kuvvetler"
 elite_forces_desc:0 "Sadece en iyilerin en iyisi özel kuvvetler olacaktır. Eğitimi geçen askerler herkesten daha güçlü, daha hızlı ve daha sert savaşacaktır."
 elite_rangers_doctrine:0 "Seçkin Korucular"
 elite_rangers_doctrine_desc:0 "Korucularımız silahlı kuvvetlerimizin gururudur. Sadece en iyileri toplamaya devam etmeli ve onları daha büyük başarılara itmeliyiz."
 encryption_tech:0 "Şifreleme yöntemleri"
 encryption_tech_research:0 " Şifreleme Araştırma Hızı"
 engineers_tech:0 "Mühendis Teknolojisi"
 escort_carriers:0 "Eskort Uçak Gemileri"
 escort_carriers_desc:0 "Bir Uçak Gemisi uçağının kapsadığı alan, ticaret konvoylarına eskortluk etmeyi çok daha kolay bir görev haline getirir. Kaynak akışını güvence altına almak esastır."
 escort_patrols:0 "Eskort Devriyeleri"
 escort_patrols_desc:0 "Tespiti iyileştirmek, konvoy eskortçularımızı denizaltılara karşı çok daha ölümcül hale getirir. Saklanacak yerleri olmadığında, gerçek bir tehdit oluşturmazlar."
 escort_relay_system:0 "Eskort Röle Sistemi"
 escort_relay_system_desc:0 "Avcı uçakları tarafından eskort edilen bombardıman uçakları, düşman ateşine yanıt verme yeteneğimizi büyük ölçüde artırır."
 excavation1:0 "Kazı I"
 excavation1_desc:0 "Sondaj tekniklerindeki ilerlemeler, daha önce ulaşılması imkansız olan kaynakları kazmamızı sağlar."
 excavation2:0 "Kazı II"
 excavation2_desc:0 "Yeni teknikler, kaynakları daha verimli bir şekilde toplamamıza yardımcı oluyor. Artık çıkarma sırasında kaynakları kirletmiyoruz, bu da daha fazla verim sağlıyor."
 excavation3:0 "Kazı III"
 excavation3_desc:0 "Jeolojideki ilerleme, kaynakların yerini belirlememize yardımcı oluyor. Artık çıkarma çabalarımızı, büyük miktarda doğal kaynak bulunma olasılığının daha yüksek olduğu yerlere odaklayabiliriz."
 excavation4:0 "Kazı IV"
 excavation4_desc:0 "Anahtar süreçlerin otomasyonu ve mekanik alanındaki ilerlemeler, tüm kaynak sahalarımızı çok daha verimli hale getiriyor."
 excavation5:0 "Kazı V"
 excavation5_desc:0 "Yüzey madenciliği gibi alanlardaki ilerlemeler, mevcut çıkarma sahalarımızdan daha fazla kaynak verimi almamızı sağlıyor."
 excavation_tech:0 " Kazı Teknolojileri"
 experimental_rockets:0 "Deneysel Roketler"
 experimental_rockets_desc:0 "Sıvı yakıtlı roketlerin menzilini ve güvenilirliğini artırarak roketçilik bilimini ilerletmek, bize teknoloji hakkında yeterince şey öğretecek ve daha gelişmiş modeller için fırlatma rampaları inşa etmemizi sağlayacaktır."
 extreme_environment_training:0 "Aşırı Ortam Eğitimi"
 extreme_environment_training_desc:0 "En zorlu ortamlarda savaşabilmemiz gerekiyor. Doğru eğitim ve teçhizatla, birliklerimiz en ekstrem koşullarda savaşabilecektir."
 fighter_ace_initiative:0 "Avcı Ası Girişimi"
 fighter_ace_initiative_desc:0 "Beş düşmanı düşürerek As statüsüne ulaşan pilotlara özel ödüller ve statü vermek, risk almayı teşvik eder ve As pilotlarda bir seçkinlik hissi yaratır - ancak bu, deneyimli pilotların muharebe pozisyonlarında kalma eğilimini de artırır."
 fighter_baiting:0 "Avcı Yemleme"
 fighter_baiting_desc:0 "Savunmasız görünerek, avcı uçaklarımız düşman uçaklarını pusuya düşürebilir."
 fighter_sweeps:0 "Avcı Süpürmeleri"
 fighter_sweeps_desc:0 "Düşman toprakları üzerinde agresif avcı devriyeleri, kalkış veya iniş sırasında özellikle savunmasız olduklarında uçaklarını yakalayabilir veya düşman eğitim uçuşlarını bozabilir."
 fighter_veteran_initiative:0 "Avcı Gazisi Girişimi"
 fighter_veteran_initiative_desc:0 "Hem ihtiyatlı taktiklerle hem de deneyimli pilotları eğitim pozisyonlarına döndürerek uzun vadeli pilot hayatta kalmasına odaklanmak, öğrendikleri dersleri yeni pilotlara aktarmalarına büyük ölçüde yardımcı olur."
 fire_control_methods_1:0 "Çatal Atışı"
 fire_control_methods_1_desc:0 "Hedefi vurmak için ilk adım, hedefin her iki tarafına da isabet edene kadar bir seferde birkaç top ateşleyerek onu çatala almaktır."
 fire_control_methods_2:0 "Merdiven Atışı"
 fire_control_methods_2_desc:0 "Hedefin üzerinden ateş edip düşman gemisinin arkasındaki isabetlerin izini kaybetmek yerine, atışlar kasıtlı olarak hedefin önüne düşürülür ve menzili belirlemek için isabet ile hedef arasındaki mesafe ölçülür."
 fire_control_methods_3:0 "Mermi Boyaları"
 fire_control_methods_3_desc:0 "Mermilere ateşlendiğinde küçük renk paketleri eklemek, hedefin etrafındaki isabetleri renklendirir ve birden fazla geminin birbirlerinin isabetleriyle karışmadan aynı hedefe saldırmasına olanak tanır."
 firebrigades:0 "İtfaiye tugayları"
 firebrigades_desc:0 "'İtfaiye tugayları', düşman yarıklarına veya diğer kritik sorunlara tepki vermek için aceleyle bir araya getirilen kuvvetlerdi.\n\n"
 fleet_in_being:0 "Mevcudiyet Filosu"
 fleet_in_being_desc:0 "Gemiler daha güvende oldukları limanda kalır ve sadece uygun anlarda düşmanlarla çatışmaya girer. Gemilerimizin varlığı, düşmanların limanlarımızı alma konusunda daha isteksiz olmalarını sağlayacaktır.\n\n"
 fleet_in_being_tree:0 "Mevcudiyet Filosu Doktrinleri"
 fleet_submarines:0 " Filo Denizaltısı"
 flexible_line:0 "Esnek Hat"
 flexible_line_desc:0 "Montaj hattı ne kadar iyi yağlanmış bir makine olursa olsun, yine de insanlar tarafından işletilir, bu da gerektiğinde uyum sağlamaya olanak tanır. Endüstriyel üretimimizde bundan yararlanmalıyız."
 floating_airfield:0 "Yüzen Havaalanı"
 floating_airfield_bs:0 "Yüzen Havaalanı"
 floating_airfield_bs_desc:0 "Uçak gemilerinin filomuza daha iyi entegrasyonu, hem denizden hem de havadan saldırmaya hazır olmamızı sağlar. Gittiğimiz her yerde havaya hakim olmamız anahtardır."
 floating_airfield_desc:0 "Uçak gemilerinin filomuza daha iyi entegrasyonu, hem denizden hem de havadan saldırmaya hazır olmamızı sağlar. Gittiğimiz her yerde havaya hakim olmamız anahtardır."
 floating_airfield_ti:0 "Yüzen Havaalanı"
 floating_airfield_ti_desc:0 "Uçak gemilerinin filomuza daha iyi entegrasyonu, hem denizden hem de havadan saldırmaya hazır olmamızı sağlar. Gittiğimiz her yerde havaya hakim olmamız anahtardır."
 floating_fortress:0 "Yüzen Kale"
 floating_fortress_bs:0 "Yüzen Kale"
 floating_fortress_bs_desc:0 "Zırhlılar en yüksek alarm durumundayken, düşman sularımızı tehdit etmeye cüret ederse her zaman karşılık vermeye hazır olacağız. Her filonun sağlam bir temele ihtiyacı vardır ve zırhlının gücü eşsizdir."
 floating_fortress_desc:0 "Zırhlılar en yüksek alarm durumundayken, düşman sularımızı tehdit etmeye cüret ederse her zaman karşılık vermeye hazır olacağız. Her filonun sağlam bir temele ihtiyacı vardır ve zırhlının gücü eşsizdir."
 floating_fortress_ti:0 "Yüzen Kale"
 floating_fortress_ti_desc:0 "Zırhlılar en yüksek alarm durumundayken, düşman sularımızı tehdit etmeye cüret ederse her zaman karşılık vermeye hazır olacağız. Her filonun sağlam bir temele ihtiyacı vardır ve zırhlının gücü eşsizdir."
 flying_fortress:0 "Uçan Kale"
 flying_fortress_desc:0 "Yüksekten uçan ağır bombardıman uçaklarımızı kendilerini savunmak için silahlarla ve bir darbe alıp yine de eve dönebilecek kadar zırhla donatmak."
 force_rotation:0 "Kuvvet Rotasyonu"
 force_rotation_desc:0 "Savaş veya sadece uzun süreli yoğun odaklanma yorucudur, ancak mümkün olduğunca taze kuvvetleri değiştirerek pilot yorgunluğuna bağlı hataları azaltabiliriz."
 formation_fighting:0 "Formasyon Muharebesi"
 formation_fighting_desc:0 "Doğru formasyonlarda uçmak, pilotlarımızın birbirlerinin kör noktalarını kapamasına olanak tanır, bu da düşman uçaklarını tespit etme yeteneğini artırır."
 formation_flying:0 "Formasyon Uçuşu"
 formation_flying_desc:0 "Formasyon halinde uçarak, uçaklar birbirine destek olabilir veya düşmanlara saldırmak için birlikte çalışabilir."
 forward_interception:0 "İleri Önleme"
 forward_interception_desc:0 "Düşman hava sahasına daha yakın faaliyet göstererek, avcı uçaklarımızın düşman uçaklarını hedeflerine ulaşmadan önce önleme olasılığı artar."
 forward_observers:0 "İleri Gözetleyiciler"
 forward_observers_desc:0 "İleri Gözetleyiciler, topçu ateşinin doğruluğunu ve etkilerini doğrudan gözlemleyebilecekleri pozisyonlar alırlar ve düzeltme için sonuçları toplara geri iletirler."
 fuel_refining:0 "Yakıt Rafinasyonu I"
 fuel_refining2:0 "Yakıt Rafinasyonu II"
 fuel_refining2_desc:0 "Rafineri düzenlerinin daha iyi planlanması, yakıt israfını azaltır."
 fuel_refining3:0 "Yakıt Rafinasyonu III"
 fuel_refining3_desc:0 "Geliştirilmiş geri kazanım yöntemleri, yan ürünlerden yakıt rafine etmeyi sağlar."
 fuel_refining4:0 "Yakıt Rafinasyonu IV"
 fuel_refining4_desc:0 "Kimya mühendisliğindeki yeni gelişmeler, yeni kaynaklardan yakıt rafine etmeyi sağlar."
 fuel_refining5:0 "Yakıt Rafinasyonu V"
 fuel_refining5_desc:0 "Rafinerilerin yapımında yeni yöntemler ve geliştirilmiş düzenler kullanmak, israfı azaltırken verimi önemli ölçüde artırır."
 fuel_refining_desc:0 "Kimyasal krakingdeki ilerlemeler, petrolden hafif yakıtların daha iyi verim alınmasını sağlar."
 fuel_silos:0 "Yakıt Depolama"
 fuel_silos_desc:0 "Yakıtın Toplu Depolanması, hem güvenli hem de hazır olmasını sağlamak için karmaşık bir tank, boru ve vana seti gerektirir."
 grand_assault:0 "Büyük Taarruz"
 grand_assault_desc:0 "Yeterli kuvvetler oluşturulduktan ve hedefleri iyi planlandıktan sonra, güçlü bir saldırı düşmanı yok etmekten başka bir şey yapamaz."
 grand_banzai_charge:0 "Büyük Banzai Taarruzu"
 grand_battle_plan:0 "Büyük Savaş Planı"
 grand_battle_plan_desc:0 "Savaşa girmeden önce kapsamlı planlama ve hazırlık, başarının anahtarıdır.\n\n"
 grand_battlefleet:0 "Büyük Muharebe Filosu"
 grand_battlefleet_desc:0 "Liderlik eğitimi, komutanlarımızın devasa filoları komuta ederken bile savaşın sıcağında sakin kalmalarını sağlar. Filomuz her türlü muhalefeti doğrudan ezecektir."
 grand_mechanized_offensive:0 "Mekanize Taarruz"
 grand_mechanized_offensive_desc:0 "Motorize birlikler iyi ve güzeldir, ancak taarruzlara liderlik etmek için onları koruyan ve ağır silahlar taşıyan zırhlı nakliye araçlarında savaşa gidebilen Piyadelere ihtiyacımız var.\n\n"
 ground_support_integration:0 "Kara Desteği Entegrasyonu"
 ground_support_integration_desc:0 "Taktik bombardıman uçağı gücümüzü yer tabanlı gözlemcilerle tam olarak entegre etmek, hem isabetlerini artırır hem de savaşta kara kuvvetlerimizi doğrudan desteklemelerini sağlar."
 guerilla_warfare:0 "Gerilla Savaşı"
 guerilla_warfare_desc:0 "Düşman ilerler, biz geri çekiliriz; düşman kamp kurar, biz taciz ederiz; düşman yorulur, biz saldırırız; düşman geri çekilir, biz takip ederiz."
 gwtank:0 "Büyük Savaş Tankı"
 heavy_air:0 "Ağır uçak"
 heavy_armor_advice_tt:0 "\nDaha iyi bir §YZırh§! modülünü §YAğır Gemilere§! monte etmek, hasara dayanma yeteneklerini geliştirir. §YZırhlılar§! ve §YMuharebe Kruvazörleri§!, farklı §YZırh Düzenleri§! ile tanımlanır, Muharebe Kruvazörleri genellikle daha kötü zırha sahiptir."
 heavy_battery_advice_tt:0 "\n\n§YAğır Batarya§! modüllerini monte etmek, bir §YAğır Geminin§! §YAğır Top Saldırısını§! artırır, bu da düşman §YAna Gemilerine§! saldırmasını ve yok etmesini sağlar. §YAğır Bataryalar§! genellikle §YHafif Gemiler§! ve §YHafif Kruvazörler§! gibi daha küçük gemilere karşı zayıf performans gösterir."
 heavy_battleship2:0 "Süper Ağır Zırhlı II"
 heavy_battleship2_desc:0 "Daha güçlü silahlar ve geliştirilmiş ateş kontrol sistemleri ile önceki süper ağır tasarımımızda bir iyileştirme."
 helicopter_tech:0 "Helikopterler"
 high_level_bombing:0 "Yüksek İrtifa Bombardımanı"
 high_level_bombing_desc:0 "Daha yüksek irtifalardan bazı hava çatışmalarından ve uçaksavar silahlarından kaçınabiliriz. Bombaları daha yükseğe bırakmak daha fazla hassasiyet gerektirir, ancak daha güvenlidir."
 hills_training_tech:0 "Tepelik Eğitimi"
 home_defence:0 "Anavatan Savunması"
 home_defence_desc:0 "Yerdeki gözcüler ile tespit ve dinleme noktaları, düşman saldırılarını izlemek ve yok etmek için hava kuvvetlerimizle uyum içinde çalışır."
 homing_torpedo:0 "Güdümlü Torpido"
 homing_torpedo_desc:0 "Akustik bir dedektörle donatılmış olan torpido, önündeki en büyük gürültü kaynağına - genellikle hedefe - kilitlenebilir."
 hospital_tech:0 "Sahra Hastaneleri"
 human_infantry_offensive:0 "Piyade Taarruzu"
 human_infantry_offensive_desc:0 "Piyadenin taarruz ruhu, savaşları kazanmanın belirleyici unsurudur. Piyademiz yol göstermelidir."
 human_wave_offensive:0 "İnsan Dalgası Taarruzu"
 human_wave_offensive_desc:0 "Bir İnsan Dalgası Taarruzu, bir saldırganın yoğun bir şekilde yoğunlaştırılmış piyade oluşumlarıyla düşman hattına karşı bir cephe saldırısı yürüttüğü ve yakın dövüşe girerek savunucuları ezme niyetinde olduğu bir piyade taktiğidir."
 hunt_and_destroy:0 "Avla ve Yok Et"
 hunt_and_destroy_desc:0 "Doğrudan ateş desteği sunmanın yanı sıra, Yakın Hava Desteği birimleri bağımsız olarak hedef avlayabilir, genellikle cephe hatlarına doğru hareket ederken düşman kara kuvvetlerine beklenmedik bir şekilde saldırabilir."
 hunter_killer_groups:0 "Avcı Katil Grupları"
 hunter_killer_groups_desc:0 "Muhripler, düşman denizaltılarını avlamak için gruplar oluşturur. Keşif ve avcılık uzmanlarının birleşik çabaları, harika bir ölüm timi oluşturur."
 improved_airplane_launcher:0 "Geliştirilmiş Uçak Mancınığı"
 improved_airplane_launcher_desc:0 "Geliştirilmiş bir pnömatik mekanizma, çok daha büyük uçakların mancınıkla fırlatılmasına olanak tanır. Bu, arama yarıçaplarını artırır.\n\nBu modülü §YKruvazörlere§!, §YAğır Gemilere§! veya özel §YDenizaltılara§! monte etmek, düşman gemilerini tespit etme yeteneklerini geliştirir."
 improved_cavity_magnatron:0 "Geliştirilmiş Desimetrik Radar"
 improved_cavity_magnatron_desc:0 "Radar kullanımı zaten çok önemli olduğunu kanıtladı, ancak desimetrik radar setlerimiz iyi bir kapsama alanı sağlamak için çok az. Daha fazla birime radar takmak, teknolojik avantajımızı en üst düzeye çıkarmamızı sağlayacaktır."
 improved_computing_machine:0 "Geliştirilmiş Hesaplama Makinesi"
 improved_computing_machine_desc:0 "Artık programlanabilir elektronik dijital bilgisayarlar yapılabilir. Hala pahalı ve büyük olsalar da, bu makineler insan kapasitesinin çok ötesinde istihbarat analizine olanak tanır."
 improved_cruiser_armor_scheme:0 "Eğimli Kemer Kruvazör Zırh Düzeni"
 improved_cruiser_armor_scheme_desc:0 "Kemer zırhını bir açıyla yerleştirerek, aynı ağırlık ve kalınlıktaki zırhın delinmesi çok daha zor hale gelir.\n\nBu modülü §YKruvazörlere§! monte etmek, §Ydüşman hasarına dayanma§! yeteneklerini geliştirir, ancak aynı zamanda §Yhızlarını§! da §Razaltır§!."
 improved_decryption:0 "Şifre Çözme - Yan Kanal Saldırısı"
 improved_decryption_desc:0 "Daha sofistike bilgisayarların geliştirilmesi, yeni el kod kırma yöntemleriyle birleştirildiğinde gelişmiş şifreleri kırmak için kullanılabilecek farklılaştırma gibi yeni kriptanaliz yöntemlerinin uygulanmasına olanak tanır."
 improved_depth_charges:0 "Derinlik Bombası Fırlatıcı"
 improved_depth_charges_desc:0 "Bir derinlik bombasını gemiden belirli bir mesafeye fırlatan basit bir mekanik cihaz. Bu, muhribin artık onu vurmak için doğrudan hedefin üzerinden geçmek zorunda olmadığı anlamına gelir.\n\nBu modülü §YHafif Gemilere§! ve §YKruvazörlere§! monte etmek, düşman §YDenizaltılarına§! saldırmalarını sağlayacaktır."
 improved_destroyer:0 "Geliştirilmiş Muhrip (Muhrip III)"
 improved_dp_light_battery:0 "Geliştirilmiş Çift Amaçlı Batarya"
 improved_dp_light_battery_desc:0 "Motorlu tam kapalı Çift top kundakları, ateş gücünü ve korumayı büyük ölçüde artırırken ağırlıktan tasarruf sağlar.\n\nBu modülü monte etmek, düşman §YPerdeleme Gemileriyle§! çatışmaya yardımcı olan §Y$EQUIPMENT_DESIGNER_LG_ATTACK_ICON_TOOLTIP$§! artırır. Bu modüller ayrıca §Y$EQUIPMENT_DESIGNER_ANTI_AIR_ATTACK_ICON_TOOLTIP$§! artırır.\nBir §Yİkincil Batarya§! Modülü monte etmek, bir §Y$ship_hull_cruiser$§!, §Y$ship_hull_carrier$§! veya §Y$ship_hull_heavy$§! gemisine az miktarda §Y$EQUIPMENT_DESIGNER_LG_ATTACK_ICON_TOOLTIP$§! verir ve ikinci bir hedefe saldırmasına olanak tanır."
 improved_encryption:0 "Şifreleme - Döngüsel Permütasyonlar"
 improved_encryption_desc:0 "Şifre makinelerinin rastgeleleştirilmesindeki sınırlamalar, şifreleri kırmak için kullanılabilir. Rotor mekaniklerinin rastgeleliğini artırarak, bu tür kriptanalizi daha zor hale getirebiliriz."
 improved_equipment_conversion:0 "Toz Kömür Ateşlemeli Kazanlar"
 improved_equipment_conversion_desc:0 "Kazanlarımızı ısıtmak için ince toz haline getirilmiş kömür kullanarak çok daha yüksek yanma verimliliği elde edebiliriz, bu da sanayimiz için daha iyi enerji üretimi ile sonuçlanır."
 improved_fire_control_system:0 "Geliştirilmiş Ateş Kontrol Sistemi"
 improved_fire_control_system_desc:0 "Bir hedefin rotasını, hızını ve mesafesini girerek, mekanik bir bilgisayar, bir sonraki salvo ateşlenmeye hazır olduğunda hedefin nerede olacağını doğru bir şekilde tahmin edebilir."
 improved_heavy_armor_scheme:0 "Hepsi ya da Hiç Zırh Düzeni"
 improved_heavy_armor_scheme_desc:0 "Bu düzen, geminin sadece en hayati bölgelerini korumaya odaklanırken, önemsiz kısımları göz ardı eder.\n\nBu modülü §YAğır Gemilere§! monte etmek, §Ydüşman hasarına dayanma§! yeteneklerini geliştirir. §YZırhlılar§! ve §YMuharebe Kruvazörleri§!, farklı §YZırh Düzenleri§! ile tanımlanır."
 improved_heavy_battery:0 "Geliştirilmiş Ağır Batarya"
 improved_heavy_battery_desc:0 "Güçlü Tokmaklar, ağır topların yükleme hızını artırırken, otomatik flaş sızdırmaz kapılar güvenliği artırır.\n\nBir §YAğır Batarya§! modülü monte etmek, bir geminin §YAğır Top Saldırısını§! artırır ve düşman §YAna Gemilerine§! karşı performansı geliştirir."
 improved_heavy_shell:0 "Süper Ağır Zırh Delici Mermi"
 improved_heavy_shell_desc:0 "Bir tonun üzerinde ağırlığa sahip bu devasa mermiler, eşi benzeri görülmemiş bir güçle vurur ve en ağır zırha bile ciddi bir tehdit oluşturur."
 improved_infantry_weapons_2:0 "Geliştirilmiş Piyade Teçhizatı II"
 improved_infantry_weapons_2_desc:0 "Piyade için kişisel ve mürettebat tarafından kullanılan silahların yanı sıra bir askerin ihtiyaç duyduğu diğer çeşitli teçhizatlar. Geliştirilmiş silah modelleri ve daha uzmanlaşmış teçhizat."
 improved_light_battery:0 "Geliştirilmiş Hafif Batarya"
 improved_light_battery_desc:0 "Küçük kalibreli bir top için kapalı, motorlu bir kundak, mürettebata hava koşullarından ve mermi şarapnellerinden bir miktar koruma sağlar.\n\nBu modülü monte etmek, düşman §YPerdeleme Gemileriyle§! çatışmaya yardımcı olan §YHafif Top Saldırısını§! artırır."
 improved_light_shell:0 "Küçük Kalibreli Zırh Delici Mermi"
 improved_light_shell_desc:0 "Küçük kalibreli toplar için uygun bir zırh delici mermi, muhriplere ve diğer hafif gemilere zırhlı rakiplere karşı bir savaşma şansı verir."
 improved_machine_tools:0 "Geliştirilmiş Takım Tezgahları"
 improved_machine_tools_desc:0 "Taret tornaları seri üretim için vazgeçilmez olduğunu kanıtlıyor. Tornaların kendilerinin verimli bir şekilde inşa edilmesini ve kullanılmasını sağlamak bize önemli bir endüstriyel avantaj sağlayacaktır."
 improved_medium_battery:0 "Geliştirilmiş Orta Batarya"
 improved_medium_battery_desc:0 "Geliştirilmiş bir taret düzeni daha hızlı yüklemeye olanak tanırken, daha iyi zırh hayatta kalma kabiliyetini artırır.\n\nBir §YHafif Orta Batarya§! modülü monte etmek, düşman §YPerdeleme Gemileriyle§! çatışmaya yardımcı olan §YHafif Top Saldırısını§! artırır. Bir §YOrta Batarya§! modülü monte etmek, düşman §YAna Gemileriyle§! çatışmaya yardımcı olan §YAğır Top Saldırısını§! artırır."
 improved_medium_shell:0 "Orta Kalibreli Yarı Zırh Delici Mermi"
 improved_medium_shell_desc:0 "Zırh delme performansı ile patlayıcı güç arasında bir uzlaşma olan bu mermi, hafif gemilerin zayıf zırhını deldikten sonra önemli ölçüde daha fazla hasar verir."
 improved_naval_mines:0 "Manyetik Mayın"
 improved_naval_mines_desc:0 "Bu sofistike mayın, geçen bir gemiden kaynaklanan manyetik alandaki değişiklikleri tespit ettiğinde patlar."
 improved_oil_processing:0 "Geliştirilmiş Petrol İşleme"
 improved_oil_processing_desc:0 "Daha önce deneysel olan damıtma yöntemlerini büyük ölçekli operasyonlara taşımak, mevcut malzemelere ve ihtiyaçlara daha iyi uyum sağlamamızı sağlayacaktır."
 improved_radio:0 "Geliştirilmiş Radyo"
 improved_radio_desc:0 "Sinyal gücündeki iyileştirmeler, Radyoların eskisinden daha uzağa yayın yapmasını sağladı."
 improved_rocket_engines:0 "Geliştirilmiş Roket Motorları"
 improved_rocket_engines_desc:0 "İlk uzun menzilli balistik füzeler inşa edilebilir ve giderek daha hassas hale getirilebilir, uzak düşman şehirlerine ve hatta uzaya ulaşabilir."
 improved_rubber_processing:0 "Geliştirilmiş Kauçuk İşleme"
 improved_rubber_processing_desc:0 "Dehidrojenasyon reaksiyonlarını hızlandırmak için yeni süreçlerle büyük ölçekli sentetik kauçuk üretimi mümkündür."
 improved_seaplane_tender:0 "Gelişmiş Deniz Uçağı Gemisi"
 improved_seaplane_tender_desc:0 "Denizde ikmal ve kurtarma vinci teknolojisindeki gelişmeler, deniz uçağı operasyonlarının verimliliğini artırır. \n\n§YMuhriplere§! bir §YDeniz Uçağı Gemisi§! modülü monte etmek, düşman gemilerini tespit etme yeteneklerini geliştirir."
 improved_secondary_battery:0 "Taretli İkincil Batarya"
 improved_secondary_battery_desc:0 "İkincil topları motorlu taretlere yerleştirerek, daha ağır ağırlık ve ağır denizlerde azalan stabilite pahasına çok daha geniş bir ateş alanı kazanırlar.\n\nBir §Yİkincil Batarya§! Modülü monte etmek, bir §YKruvazöre§!, §YUçak Gemisine§! veya §YAğır Gemiye§! az miktarda §YHafif Top Saldırısı§! verir ve ikinci bir hedefe saldırmasına olanak tanır."
 improved_ship_torpedo_launcher:0 "Geliştirilmiş Gemi Torpido Kovanı"
 improved_ship_torpedo_launcher_desc:0 "Daha güçlü motorlar, tek bir kundağa daha fazla kovan takılmasına ve hedefe daha hızlı yönlendirilmesine olanak tanır.\n\nBu modülü §YHafif Gemilere§! veya §YKruvazörlere§! monte etmek, düşman §YAna Gemilerine§! önemli hasar vermelerini sağlar."
 improved_sonar:0 "Aktif Sonar"
 improved_sonar_desc:0 "Modüle edilmiş ses dalgalarını kullanarak, bu sistem batık bir hedefe olan kerterizi ve mesafeyi doğru bir şekilde ölçebilir.\n\nBu modülü §YHafif Gemiler§! veya §YKruvazörler§! üzerindeki bir §YElektronik Yuvasına§! monte etmek, düşman §YDenizaltılarını§! tespit etmelerine yardımcı olacaktır."
 improved_special_forces:0 "Genişletilmiş Özel Kuvvetler Programı"
 improved_special_forces_desc:0 "Özel kuvvetler, sıradan askerlerin yapamayacağı görevleri yerine getirebilir. Daha fazla askerimizin kalifiye olması için eğitim programlarını genişletmemiz gerekiyor."
 improved_submarine_mine_laying:0 "Torpido Kovanı Mayın Döşeme"
 improved_submarine_mine_laying_desc:0 "Mayınları torpido kovanlarına sığacak şekilde yeniden tasarlamak, taşınan torpidolar pahasına da olsa herhangi bir denizaltının bir mayın döşeyici olmasına olanak tanır."
 improved_submarine_snorkel:0 "Geliştirilmiş Denizaltı Şnorkeli"
 improved_submarine_snorkel_desc:0 "Geliştirilmiş bir tasarım, motorlara su emilmesini önler ve ayrıca şnorkel başlığının radar imzasını azaltır.\n\nBu modülü §YDenizaltılara§! monte etmek, §YGörünürlüklerini§! azaltarak tespit edilmelerini zorlaştırır."
 industry:0 "£industry_texticon Sanayi"
 industry_folder:0 "Sanayi"
 industry_folder_desc:0 "Sanayi ve üretim."
 infantry_at:0 "Piyade Tanksavar I"
 infantry_at2:0 "Piyade Tanksavar II"
 infantry_at2_desc:0 "Piyadenin daha ağır zırhlı birimlere etkili bir şekilde saldırması için, yüksek patlayıcılı tanksavar silahlarının daha küçük ve daha hafif yapılması gerekir."
 infantry_at_desc:0 "Piyade birimlerimizi tanksavar tüfekleriyle donatmak, hareket kabiliyetini korurken daha hafif zırhlı araçları alt etmelerini sağlayacaktır."
 infantry_folder:0 "Piyade"
 infantry_folder_desc:0 "Piyade kuvvetleri için teçhizat ve silahlar."
 infantry_offensive:0 "Piyade Taarruzu"
 infantry_offensive_desc:0 "Piyadenin taarruz ruhu, savaşları kazanmanın belirleyici unsurudur. Piyademiz yol göstermelidir.\n\n"
 infantry_tech:0 "Piyade teknolojisi"
 infantry_weapons:0 " Piyade Silahları"
 infantry_weapons2:0 "Geliştirilmiş Piyade Teçhizatı I"
 infantry_weapons2_desc:0 "Piyade için kişisel ve mürettebat tarafından kullanılan silahların yanı sıra bir askerin ihtiyaç duyduğu diğer çeşitli teçhizatlar. Geliştirilmiş silah modelleri ve daha uzmanlaşmış teçhizat."
 infiltration_assault:0 "Sızma Taarruzu"
 infiltration_assault_desc:0 "Bir saldırının açılış hamlelerinde piyade, düşman hattındaki zayıf noktaları hedefleyerek daha iyi savunulan bölümleri atlayıp izole etmeli, bu bölümler daha sonra saldıran kuvvetlerin geri kalanı tarafından yok edilebilir."
 infiltration_bombing:0 "Sızma Bombardımanı"
 infiltration_bombing_desc:0 "Düşman formasyonlarına katılmak veya onları üsse kadar takip etmek delilik gibi görünebilir. Yeterli pratikle, bu tamamen mümkündür."
 infiltration_in_depth:0 "Derinlemesine Sızma"
 infiltration_in_depth_desc:0 "Kuvvetlerimiz artık düşman direnek noktalarını çok daha derinlemesine atlayıp izole etmek için eğitilmiştir, ideal olarak taarruz kuvvetlerimiz düşmanın geri bölgelerine ulaşana ve kuvvetleri tamamen kesilene kadar durmamalıdır."
 infrastructure_destruction:0 "Altyapı Yıkımı"
 infrastructure_destruction_desc:0 "Pilotlarımızı demiryolları ve köprüler gibi altyapıya saldırmanın en iyi yolları konusunda eğitmek, daha etkili Taktik bombardıman sağlar."
 integrated_convoy_defence:0 "Entegre Konvoy Savunması"
 integrated_convoy_defence_bs:0 "Entegre Konvoy Savunması"
 integrated_convoy_defence_bs_desc:0 "Daha iyi donanma ve hava koordinasyonu, düşmanlarımıza ticaret konvoylarımıza yaklaşmadan kilometrelerce uzaktan saldırmamızı sağlar. Bu, konvoy seyrinin etkinliğini önemli ölçüde artıracaktır."
 integrated_convoy_defence_desc:0 "Daha iyi donanma ve hava koordinasyonu, düşmanlarımıza ticaret konvoylarımıza yaklaşmadan kilometrelerce uzaktan saldırmamızı sağlar. Bu, konvoy seyrinin etkinliğini önemli ölçüde artıracaktır."
 intergrated_support:0 "Entegre Destek"
 intergrated_support_desc:0 "Destek kuvvetlerini muharebe birlikleriyle yakından entegre etmek, saldırıda daha güçlü olan tümenlerle sonuçlanır.\n\n"
 interwar_antiair:0 "Uçaksavar"
 interwar_antitank:0 "Tanksavar"
 interwar_artillery:0 "Savaşlar Arası Topçu"
 interwar_artillery_desc:0 "Farklı topçu türlerinin geliştirilmesinde öğrenilen dersler, diğer parçaların tasarımına çapraz olarak uygulanabilir."
 jet_technology:0 "Jet teknolojisi"
 jungle_training_tech:0 "Cengel Eğitimi"
 jungle_warfare:0 "Orman Harbi"
 jungle_warfare_desc:0 "Askerlerimizi ormanda etkili kılmak için özel eğitim."
 kampfgruppe:0 "Kampfgruppe"
 kampfgruppe_desc:0 "Bir Kampfgruppe, belirli bir görevi yerine getirmek için organize edilen geçici bir oluşumdu."
 keypoint_bombing:0 "Kilit Nokta Bombardımanı"
 keypoint_bombing_desc:0 "Kara kuvvetlerimizi desteklemek için savaş alanındaki hedeflenmiş kilit noktaları doğru bir şekilde bombalamak, düşmanı yenmelerine büyük ölçüde yardımcı olabilir."
 land_doctrine:0 "Kara Doktrini"
 land_doctrine_folder:0 "Kara Doktrini"
 land_doctrine_folder_desc:0 "Kara doktrini, kara kuvvetlerinizin savaşma şeklidir."
 land_fort_tech_1:0 "Geliştirilmiş Kara Kaleleri"
 land_fort_tech_1_desc:0 "Tahkimatlarımızın etrafındaki araziyi daha iyi kullanarak ve yeni teknolojiyi de dahil ederek, mevcut yapılarımızı güçlendirebilir ve daha da genişletebiliriz."
 land_fort_tech_2:0 "Gelişmiş Kara Kaleleri"
 land_fort_tech_2_desc:0 "Geçmiş hatalardan ders alarak ve sadece yapının kendisini değil, aynı zamanda temel temellerini de güçlendirerek, en tecrübeli düşmanları bile durdurabilecek çok daha büyük tahkimatlar inşa edebileceğiz."
 landing_craft:0 "Çıkarma Gemisi"
 landing_craft_desc:0 "Özel çıkarma gemileri, düşman topraklarına çıkarma yapmayı biraz daha az baş ağrıtıcı hale getirir."
 large_front_offensive:0 "Geniş Cephe Taarruzu"
 large_front_offensive_desc:0 "Cephenin birden fazla alanında İnsan Dalgası Taarruzları düzenleyerek veya tehdidinde bulunarak, düşmanın ateş gücünü herhangi bir tek saldırıya karşı yoğunlaştırmasını önleyebiliriz."
 large_front_operations:0 "Geniş Cephe Operasyonları"
 large_front_operations_desc:0 "Geniş bir cephede savaşmak, birden fazla birimin çabalarını uzun mesafeler boyunca koordine etmeyi içerir: Taktiksel yerine operasyonel düzeyde.\n\n"
 light_air:0 " Hafif uçak"
 light_battery_advice_tt:0 "\n\n§YHafif Batarya§! modüllerini §YHafif Gemilere§! ve §YKruvazörlere§! monte etmek, düşman §YPerdeleme Gemilerini§! yok etmeye yardımcı olan §YHafif Top Saldırılarını§! geliştirir. §YHafif Bataryalar§! genellikle §YKruvazörler§! ve §YAğır Gemiler§! gibi zırhlı gemilere karşı zayıf performans gösterir!"
 light_fighter:0 " Avcı modelleri"
 logistical_bombing:0 "Lojistik Bombardıman"
 logistical_bombing_desc:0 "Düşmanın ikmal hatlarına havadan saldırmaya daha fazla odaklanmak, bölgedeki kendi kara kuvvetlerimize daha büyük bir avantaj sağlar."
 logistics_tech:0 "Lojistik Bölüğü"
 low_echelon_support:0 "Alt Kademe Desteği"
 low_echelon_support_desc:0 "Yakın Hava Desteği birimlerini doğrudan küçük kara oluşumlarına atamak, geleneksel topçunun menzili dışında olsalar bile her zaman çağırabilecekleri ek ateş gücüne sahip olmalarını sağlar."
 magnetic_detonator:0 "Manyetik Tapa"
 magnetic_detonator_desc:0 "Yeni bir tapa, torpido hedefin altından geçtiğinde dünyanın manyetik alanındaki kaymayı algılar. Bir geminin tam altındaki bir patlama çok daha fazla hasara neden olur ve genellikle hedefin omurgasını kırarak onu anında batırır."
 marine_tech:0 " Deniz Piyadesi teknolojisi"
 marines:0 "Deniz Piyadeleri I"
 marines2:0 "Deniz Piyadeleri II"
 marines2_desc:0 "Amfibi savaş sürekli yenilik gerektirir. Geliştirilmiş lojistik destek ve taşınabilir limanlar, deniz piyadelerimizin aksi takdirde imkansız olabilecek çıkarmalar yapmasını sağlayabilir."
 marines3:0 "Deniz Piyadeleri III"
 marines3_desc:0 "Deniz piyadeleri amfibi piyadelerden daha fazlası olabilir. Gelecekte, deniz piyade kolordumuz en disiplinli ve organize özel kuvvetler arasında yer alacaktır."
 marines_desc:0 "Amfibi savaşta uzmanlaşan birlikler giderek daha vazgeçilmez hale geliyor. Deniz piyademiz özel çıkarma gemileri ve eğitimle desteklendiğinden, doğaçlama yöntemler ve teçhizat geçmişte kalıyor."
 mass_assault:0 "Toplu Taarruz"
 mass_assault_desc:0 "'Mükemmel' silahlar abartılıyor, çok sayıda 'yeterince iyi' silah zafere giden yoldur!\n\n"
 mass_destruction:0 "Kitle İmha"
 mass_destruction_desc:0 "Bombardıman uçakları, en yıkıcı silahlarla büyük miktarlarda donatılmıştır. Pilotlarımızdan sadece birkaçı geçse bile sonuçları garanti eder."
 mass_motorization:0 "Toplu Motorizasyon"
 mass_motorization_desc:0 "Motorize birliklere daha da büyük bir odaklanma."
 massed_bomber_formations:0 "Toplu Bombardıman Formasyonları"
 massed_bomber_formations_desc:0 "Formasyonda kalarak, bombardıman uçaklarımız gruplarını savunabilir ve başarılı bomba bırakma şansımızı artırabilir."
 massed_strikes:0 "Toplu Saldırılar"
 massed_strikes_desc:0 "Uçak gemisi görevleri için eğitilmiş pilotlar, aşırı kalabalık bir uçak gemisinin bile sorunsuz çalışmasını sağlayacak, düşmanı saracak ve deniz savaşlarındaki etkinliklerini büyük ölçüde artıracaktır. Bir uçak gemisi, herkesin rolünü bildiği iyi yağlanmış bir makine gibi çalışmalıdır."
 masterful_blitz:0 "Usta Yıldırım Harbi"
 masterful_blitz_desc:0 "Yıldırım Harbi'ni biz icat etmemiş olabiliriz, ancak bu stratejiyi öyle bir geliştirecek ve rafine edeceğiz ki, en müstahkem düşman savunma hatları bile şanlı ordumuzun ilerleyişini durduramayacak."
 mechanical_computing:0 "Mekanik Hesaplama"
 mechanical_computing_desc:0 "Gelişmiş diferansiyel analiz yapabilen makineler inşa etmek, ne tür makine destekli hesaplamaların yapılabileceğini kökten değiştirecektir."
 mechanised_offensive:0 "Mekanize Taarruz"
 mechanised_offensive_desc:0 "Motorize birlikler iyi ve güzeldir, ancak taarruzlara liderlik etmek için onları koruyan ve ağır silahlar taşıyan zırhlı nakliye araçlarında savaşa gidebilen Piyadelere ihtiyacımız var."
 mechanized_wave:0 "Mekanize Dalga"
 mechanized_wave_desc:0 "Mekanize kuvvetler, hem Zırhlı kuvvetleri desteklemek hem de gediklerin kanatlarını güvence altına almak için Yarımları düzgün bir şekilde sömürmek için gereken hızlı ilerlemeleri yürütmek için idealdir."
 medium_air:0 " Orta uçak"
 medium_battery_advice_tt:0 "\n\n§YHafif Orta Batarya§! veya §YOrta Batarya§! modüllerini §YKruvazörlere§! monte etmek, düşman §YPerdeleme Gemileri§! veya §YAna Gemiler§! ile savaşmalarını sağlayan §YHafif Top Saldırılarını§! veya §YAğır Top Saldırılarını§! geliştirir. Herhangi bir §YOrta Batarya§! monte etmek bir gemiyi §YAğır Kruvazör§! olarak belirlerken, sadece §YHafif Orta Batarya§! monte etmek bir gemiyi §YHafif Kruvazör§! olarak belirler."
 midget_submarines:0 "Cep Denizaltısı Gövdesi"
 military_industry:0 "Askeri sanayi"
 military_police_tech:0 "Askeri Polis Teknolojisi"
 militia_tech:0 "Milisler"
 miniature_fighters:0 "Minyatür Avcı Uçakları"
 miniature_fighters_desc:0 "Daha küçük avcı uçaklarıyla, çok fazla ateş gücünden ödün vermeden daha fazlasını savaşa taşıyabiliriz, ayrıca Ana Gemilerin yükünü de azaltabiliriz."
 mio_cat_all_artillery_equipment:0 "Tüm Topçu teknolojileri"
 mio_cat_all_cas_and_modules:0 "Tüm Yakın Hava Desteği Teknolojileri"
 mio_cat_all_heavy_aircraft_and_modules:0 "Tüm Ağır Uçak Teknolojileri"
 mio_cat_all_light_aircraft_and_modules:0 "Tüm Hafif Uçak Teknolojileri"
 mio_cat_all_light_fighter_and_modules:0 "Tüm Avcı Teknolojileri"
 mio_cat_all_medium_aircraft_and_modules:0 "Tüm Orta Uçak Teknolojileri"
 mio_cat_all_naval_bomber_and_modules:0 "Tüm Deniz Bombardıman Uçağı Teknolojileri"
 mio_cat_tech_all_armor_and_modules:0 "Tüm Zırhlı Teknolojileri"
 mio_cat_tech_all_capital_ship_and_modules:0 "Tüm Ana Gemi Teknolojileri"
 mio_cat_tech_all_carrier_and_modules:0 "Tüm Uçak Gemisi Teknolojileri"
 mio_cat_tech_all_cruiser_and_modules:0 "Tüm Kruvazör Teknolojileri"
 mio_cat_tech_all_destroyer_and_modules:0 "Tüm Muhrip Teknolojileri"
 mio_cat_tech_all_motorized_mechanized:0 "Tüm Motorize ve Mekanize Teknolojiler"
 mio_cat_tech_all_screen_ship_and_modules:0 "Tüm Perdeleme Gemisi Teknolojileri"
 mio_cat_tech_all_submarine_and_modules:0 "Tüm Denizaltı Teknolojileri"
 mio_cat_tech_heavy_armor_and_modules:0 "Ağır Zırhlı Teknolojileri"
 mio_cat_tech_light_armor_and_modules:0 "Hafif Zırhlı Teknolojileri"
 mio_cat_tech_medium_armor_and_modules:0 "Orta Zırhlı Teknolojileri"
 mobile_defence:0 "Mobil Savunma"
 mobile_defence_desc:0 "Mobil kuvvetler, düşmanın saldırabileceği her yerde savunmayı güçlendirmek için kullanılabilir."
 mobile_infantry:0 "Mobil Piyade"
 mobile_infantry_desc:0 "Normal Piyade genellikle hızla hareket eden Zırhlı kuvvetlere ayak uydurmak, onlara tepki vermek veya onlardan kaçmak için çok yavaştır. Çözüm, modern savaşın hızına ayak uydurabilen Motorize veya Mekanize Piyadeye odaklanmaktır.\n\n"
 mobile_warfare:0 "Mobil Harp"
 mobile_warfare_desc:0 "Mobil Harp, düşman kuvvetlerini kesmek ve düzensiz hale getirmek için hız ve manevraya odaklanır.\n\n"
 modern_blitzkrieg:0 "Modern Yıldırım Harbi"
 modern_blitzkrieg_desc:0 "Mobil Harbin zirvesi olan Modern Yıldırım Harbi, teknolojinin en son gelişmelerini ve önceki doktrinlerden öğrenilen dersleri içerir."
 modern_depth_charges:0 "Geliştirilmiş Derinlik Bombası Havanı"
 modern_depth_charges_desc:0 "Daha büyük bir itici şarj, uygun bir derinlik bombasını belirli bir derinliğe oldukça uzak bir mesafeden bir denizaltıya fırlatır.\n\nBu modülü §YHafif Gemilere§! ve §YKruvazörlere§! monte etmek, düşman §YDenizaltılarına§! saldırmalarını sağlayacaktır."
 modern_naval_mines:0 "Basınç Mayını"
 modern_naval_mines_desc:0 "Bu son derece gelişmiş mayın, yakından hareket eden bir geminin neden olduğu sudaki küçük basınç değişikliklerini tespit eder."
 modern_oil_processing:0 "Modern Petrol İşleme"
 modern_oil_processing_desc:0 "Hidrokraking, alkilasyon, merkaptan oksidasyonu ve izomerizasyon gibi yeni gelişmiş petrol işleme yöntemleriyle petrol rafinerilerimiz daha da geliştirilebilir."
 modern_rubber_processing:0 "Modern Kauçuk İşleme"
 modern_rubber_processing_desc:0 "Daha optimize edilmiş polimerizasyon süreçlerine geçmek, daha düşük maliyetler ve daha yüksek çıktı ile sonuçlanacaktır."
 modern_ship_torpedo_launcher:0 "Modern Gemi Torpido Kovanı"
 modern_ship_torpedo_launcher_desc:0 "Güçlü sıkıştırılmış hava şarjları, daha ağır torpidoların daha yüksek hızlarda fırlatılmasına olanak tanır.\n\nBu modülü §YHafif Gemilere§! veya §YKruvazörlere§! monte etmek, düşman §YAna Gemilerine§! önemli hasar vermelerini sağlar."
 modern_sonar:0 "Modern Sonar"
 modern_sonar_desc:0 "Sinyal filtreleme ve yönlü taramadaki ilerlemeler, bu yeni sonar modeline eşsiz bir hassasiyet kazandırarak düşman denizaltılarını ölümcül bir hassasiyetle avlamamızı sağlar. \n\nBu modülü §YHafif Gemiler§! veya §YKruvazörler§! üzerindeki bir §YElektronik Yuvasına§! monte etmek, düşman §YDenizaltılarını§! tespit etmelerine yardımcı olacaktır."
 monopulse_radar:0 "Tek Darbeli Radar"
 monopulse_radar_desc:0 "Tek Darbeli Radar ile, birkaç antenden gelen sinyalleri karşılaştırarak bir hedefin yönünü belirleyebilir, tespiti iyileştirebiliriz."
 mot_rockets_research:0 "Motorize Roket Topçusu Araştırma Hızı"
 mothership:0 "Uçan Uçak Gemisi"
 motorised_infantry:0 "Motorize Piyade"
 motorised_infantry_desc:0 "Piyade nakliyatlarında motorlu araçların kullanımını sahada genişleterek, aksi takdirde yavaş hareket eden piyade birimlerinin hareket kabiliyeti büyük ölçüde artırılabilir, bu da daha hızlı tepkiler ve yeni stratejiler sağlar."
 motorized_rocket_unit:0 "Motorize Roket Topçusu"
 mountain_defensive_training:0 "Dağ Savunma Eğitimi"
 mountain_defensive_training_desc:0 "Özel eğitim, birliklerimizin dağlık arazide daha iyi savunma yapmasını sağlayacaktır."
 mountain_gun:0 "Dağ Topu"
 mountain_gun_desc:0 "Dağlık arazi, parçalara ayrılabilen ve ihtiyaç duyulan her yere katır sırtında taşınabilen bir topun geliştirilmesine yol açmıştır."
 mountain_warfare:0 "Dağ Harbi"
 mountain_warfare_desc:0 "Askerlerimizi dağ sıralarında etkili kılmak için özel eğitim."
 mountain_warfare_militias_tech:0 "$ITA_grande_rivolta_rurale$"
 mountaineers_combat_1:0 "Hattı Tutmak"
 mountaineers_combat_1_desc:0 "Elit kuvvetlerimiz, çabalarını uzmanlaştıkları alanları tutmaya odaklamalıdır. Pusu taktikleri ve geliştirilmiş alay organizasyonunun birleşimi, özel kuvvetlerimizin işgalci kuvvetlere karşı önemli bir derinlemesine savunma sunmasını sağlar."
 mountaineers_combat_2:0 "Dağ Topçusu"
 mountaineers_combat_2_desc:0 "Dağ Topçusu alayları, zorlu arazide eğitim görmüş ve faaliyet göstermiş olan elit tümenlerimizin hızlı uzun menzilli desteği için tasarlanmış özel kuvvetlerdir. Varlıkları, özel kuvvetlerimizin muharebe yeteneklerini önemli ölçüde artırır."
 mountaineers_combat_3:0 "Müşterek Harekat Eğitimi"
 mountaineers_combat_3_desc:0 "Elit alaylarımız oldukça bağımsız bir temelde faaliyet gösterse de, eğitim rejimlerini müşterek harekat operasyonlarına odaklanarak artırmak, sahadaki faydalarını artırır."
 mountaineers_keystone_1:0 "Silahlı Kuvvetlerin Bel Kemiği"
 mountaineers_keystone_1_desc:0 "Elit özel kuvvetlerimizin başarısı, askeri felsefemizin onların varlığı etrafında yeniden düzenlenmesini gerektirir."
 mountaineers_keystone_2:0 "Paylaşılan Eğitmenler"
 mountaineers_keystone_2_desc:0 "Dağ kuvvetlerimizin edindiği bilgiyle, bunu özel kuvvetlerimizin diğer branşlarında iyi bir şekilde kullanmamak aptallık olur. Genel kurumsal bilgimizi geliştirmek umuduyla bir eğitmen rotasyonu programı başlatacağız."
 mountaineers_tech:0 " Dağcı Teknolojisi"
 mtg_landing_craft:0 "Çıkarma Gemisi"
 mtg_landing_craft_desc:0 "Özel çıkarma gemileri, düşman topraklarına çıkarma yapmayı biraz daha az baş ağrıtıcı hale getirir."
 mtg_tank_landing_craft:0 "Gelişmiş Çıkarma Gemisi"
 mtg_tank_landing_craft_desc:0 "Gelişmiş Çıkarma gemileri, çocuklarımızın bir çıkarma sırasında sahile daha hızlı ve daha etkili bir şekilde çıkabileceği anlamına gelir."
 mtg_transport:0 "Nakliye Gemisi"
 mtg_transport_desc:0 "Sadece asker taşımak için tasarlanmış, herhangi bir savunma kabiliyeti olmayan gemi."
 mtgnavalfolder:0 "Donanma"
 mtgnavalfolder_desc:0 "Gemiler ve denizaltılar. Gemilerinizi özelleştirmek için yeni modüller araştırın."
 mtgnavalsupportfolder:0 "Donanma Desteği"
 mtgnavalsupportfolder_desc:0 "Donanma silahları ve uzman donanma teçhizatı. Gemilerinizi özelleştirmek için yeni modüller araştırın."
 multialtitude_flying:0 "Çok İrtifalı Uçuş"
 multialtitude_flying_desc:0 "Hava muharebesi üç boyutta gerçekleşir, ancak çoğu pilot üstlerinde veya altlarında uçan uçakları takip etmeyi daha zor bulur. Oluşumlarımızı dikey olarak yayarak bundan yararlanabiliriz."
 naval_air:0 " Deniz uçağı"
 naval_air_operations:0 "Deniz Hava Operasyonları"
 naval_air_operations_desc:0 "Uçak gemilerinden görev yapmak üzere eğitilmiş pilotlar, denizlere hükmetmemiz için yeni bir yol açar. Uçaklar, düşman filosunu inceltmenin etkili bir yoludur."
 naval_armor:0 "Deniz Zırhı"
 naval_artillery:0 "Deniz Topçusu"
 naval_bomber:0 " Deniz Bombardıman Uçağı modelleri"
 naval_doctrine:0 "Deniz Doktrini"
 naval_doctrine_folder:0 "Deniz Doktrini"
 naval_doctrine_folder_desc:0 "Deniz doktrini, Donanmanızın savaşma şeklidir."
 naval_folder:0 "Donanma"
 naval_folder_desc:0 "Gemiler ve denizaltılar."
 naval_minelaying:0 " Deniz Mayın Döşeme Teknolojisi"
 naval_minelaying_research:0 "Mayın Döşeme Araştırması"
 naval_minelaying_research_desc:0 "Deniz patlayıcıları için manyetik algılama ve kararlı ateşleme kaynaklarındaki gelişmeler."
 naval_mines:0 "Mayın Harbi Teknolojileri"
 naval_minesweeping:0 " Deniz Mayın Temizleme Teknolojisi"
 naval_strike_tactics:0 "Deniz Saldırısı Taktikleri"
 naval_strike_tactics_desc:0 "Pilotları gemi hareketlerini tahmin etme ve saldırıları koordine etme konusunda eğitmek, düşman gemilerine yönelik hava saldırılarımızı daha verimli hale getirecektir."
 naval_strike_torpedo_tactics:0 "Deniz Saldırısı Torpido Taktikleri"
 naval_strike_torpedo_tactics_desc:0 "Pilotları torpidolarla daha hassas vuruşlar yapmak için eğitmek, düşman gemilerine yönelik hava saldırılarımızı daha verimli hale getirecektir."
 naval_strike_torpedo_tactics_oi:0 "Deniz Saldırısı Torpido Taktikleri"
 naval_strike_torpedo_tactics_oi_desc:0 "Pilotları torpidolarla daha hassas vuruşlar yapmak için eğitmek, düşman gemilerine yönelik hava saldırılarımızı daha verimli hale getirecektir."
 nd_conscription:0 "Ayrımcı Olmayan Askerlik"
 nd_conscription_desc:0 "Sakatlar ve topallar bile askere alınmalı, sivil diye bir şey olamaz."
 night_assault_tactics:0 "Gece Taarruzu Taktikleri"
 night_assault_tactics_desc:0 "Gece hareket etmeye ve savaşmaya alışkın olan askerler, ya bir saldırı için önceden mevzilenebilirler ya da doğrudan habersiz düşman kuvvetlerine saldırabilirler."
 night_bombing:0 "Gece Bombardımanı"
 night_bombing_desc:0 "Düşman savunmaları azalmışken ve bombardıman uçaklarımız karanlıkla kaplıyken, gece gündüz saldırgan ve verimli kalabiliriz. Düşmanımıza ne kadar ısrarcı olduğumuzu gösterin.\n\n"
 night_vision:0 "Gece Görüşü I"
 night_vision2:0 "Gece Görüşü II"
 night_vision2_desc:0 "Başlangıçta keskin nişancılar tarafından kullanılmak üzere tasarlanan erken kızılötesi dürbünlerin sınırlı bir görüş menzili vardı. Hem taşınabilirlik hem de görüş geliştikçe, bu cihazlar gece çalışan daha fazla birlik tarafından kullanılabilir."
 night_vision_desc:0 "Düşmanı görülmeden görebilmek, gece operasyonlarının anahtarıdır. Kızılötesi teknolojisinin icadıyla, ordumuzu hantal olsalar da bunu mümkün kılan cihazlarla donatabiliriz."
 no_doctrine_chosen:0 "Doktrin Seçilmedi"
 nsb_armour_folder:0 "Zırhlı"
 nsb_armour_folder_desc:0 "Tanklar ve varyantları."
 nuclear:0 " Nükleer Teknoloji"
 nukes:0 "Nükleer Bombalar"
 nukes_desc:0 "Bir atom bombası inşa etme projesi, bir ulusun üstlenebileceği en gizli ve zor görevlerden biri olacaktır, ancak başarılı olursa, sadece günümüz savaşlarının seyrini değil, dünyanın geleceğini de değiştirebilir."
 offensive_formations:0 "Taarruz Formasyonları"
 offensive_formations_desc:0 "Daha saldırı odaklı formasyonlarda eğitim, avcı uçaklarımızı savaşta daha ölümcül hale getirir."
 oil_processing:0 "Petrol İşleme"
 oil_processing_desc:0 "Sentetik damıtma ve petrol ürünlerinin rafine edilmesi için bir fabrika ağı, ulusumuz için yakıt tedarikini sağlamaya yönelik bir sonraki adımdır."
 operational_concentration:0 "Operasyonel Yoğunlaşma"
 operational_concentration_desc:0 "Herhangi bir askeri eylemin anahtarı, ezici yerel üstünlüktür. Tüm cephe boyunca ezici bir şekilde üstün olmadıkça, bu, her yerde güçlü olmaya çalışmak yerine ihtiyaç duyulan yerlerde birlikleri yoğunlaştırmak için cephe hattınızın bazı kısımlarını zayıflatmayı içerir."
 operational_destruction:0 "Operasyonel Yıkım"
 operational_destruction_desc:0 "Düşman kara kuvvetlerinin ikmal hatlarına saldırmak, savaş alanları arasında hareket etme yeteneklerini engeller. Bu, Hava Üstünlüğüne sahip olduğumuz alanlarda faaliyet gösterirken ordumuza bir avantaj sağlar."
 operational_integrity_tree:0 "Operasyonel Bütünlük Doktrini"
 overwhelming_firepower:0 "Ezici Ateş Gücü"
 overwhelming_firepower_desc:0 "Ezici ateş gücü sağlamak için mevcut tüm destek birimlerini çağırmak, bir hedefi büyük ölçüde yumuşatabilir veya daha iyisi, bir saldırganın gününü ciddi şekilde mahvedebilir."
 paras_airborne_light_armor:0 "Hava İndirme Zırhlısı"
 paras_airborne_light_armor_desc:0 "Belirli hafif tanklar, ağır planörle hava indirme için uyarlanabilir. Bu yeni muharebe indirme yöntemi niş olabilir, ancak bize yeni fırsatlar sunar."
 paras_bonus_1:0 "Geliştirilmiş Seyrüsefer Eğitimi"
 paras_bonus_1_desc:0 "En iyi indirme bile ters gidebilir. Birliklerimizin doğaçlama seyrüsefer konusunda iyi eğitildiğinden emin olmalıyız."
 paras_bonus_2:0 "Stratejik Hava Nakliye Kolordusu"
 paras_bonus_2_desc:0 "Özel bir hava nakliye idaresinin oluşturulmasını kurumsallaştırmak, kargo uçaklarımızı hava indirme için özel amaca daha iyi donatmamızı sağlar."
 paras_combat_1:0 "Hava İndirme Muhaberesi"
 paras_combat_1_desc:0 "Hatların gerisindeki birliklerimizle mükemmel bir iletişim hattına sahip olmakla hiçbir şey kıyaslanamaz. Muhabere bölüklerini hava indirme için eğitmek, bu kritik iletişimleri en kötü koşullarda bile sürdürecektir."
 paras_combat_2:0 "Hava İndirme Tıbbi Müfrezesi"
 paras_combat_2_desc:0 "Hava indirme operasyonlarımızın ölçeği o kadar arttı ki, temel tıbbi teçhizatın bile hava indirme için hazırlanması gerekiyor."
 paras_combat_drop:0 "Muharebe İndirmesi"
 paras_combat_drop_desc:0 "Tehlikeli olmasına rağmen, elit kuvvetlerimizi doğrudan zorunlu giriş tekniklerinde eğitmek, konvansiyonel saldırı ile birlikte bize önemli muharebe avantajları sağlayabilir."
 paras_dispersed_drop:0 "Keşif ve Sabotaj"
 paras_dispersed_drop_desc:0 "Operasyonlarımızın doğası, hava indirme birliklerimizin oldukça dağınık hava indirmelerinde uzmanlaşmasını gerektirir, bu da düşman varlığımızdan haberdar olmadan önce önemli sabotajların gerçekleşmesine olanak tanır."
 paras_keystone_1:0 "En İyilerin En İyisi"
 paras_keystone_1_desc:0 "Sadece en savaş tecrübeli gaziler hava indirme taburlarımız için düşünülmelidir. Bu, acemi sahamızı azaltabilir, ancak savaş alanında kesinlikle karşılığını verecektir."
 paras_keystone_2:0 "Silahlı Kuvvetlerin Bel Kemiği"
 paras_keystone_2_desc:0 "Silahlı kuvvetlerimiz bundan böyle hava indirme birliklerimizin beceri ve eğitimi üzerine inşa edilecektir. Gelişleriyle gökyüzü kararacak ve düşmanımız korkuyu tanıyacaktır."
 paratroopers:0 "Paraşütçüler I"
 paratroopers2:0 "Paraşütçüler II"
 paratroopers2_desc:0 "Sadece birkaç paraşütçüyle yapılan küçük operasyonlardan daha büyük hava indirme tümenlerine geçiş, bu kuvvetleri bir yenilik olmaktan çıkarıp savaşın doğal bir parçası haline getirerek büyük hava indirme çıkarmalarının yolunu açar."
 paratroopers3:0 "Paraşütçüler III"
 paratroopers3_desc:0 "Paraşüt operasyonlarını hava durumuna göre uyarlamayı öğrenmek, atlama botları gibi teçhizatı standartlaştırmak ve genişletilmiş özel eğitim, bu tehlikeli görevlerdeki karışıklığı ve riskleri en aza indirecektir."
 paratroopers_desc:0 "Ordumuza hava indirme kuvvetleri dahil ederek, zorunlu girişler yapabilir ve kilit birlikleri daha önce erişilemeyen alanlara konumlandırabiliriz, bu da yeni taktik fırsatlar sağlar."
 pathfinder_groups:0 "Yol Bulucu Grupları"
 pathfinder_groups_desc:0 "Gazi pilotlar, hedef pozisyonlarını aydınlatmak için en iyi araçlarla donatılmıştır. Hiçbir duman veya kötü hava, bombardıman uçaklarının görevlerini yerine getirmesini engelleyemez."
 penal_infantry:0 "Ceza Taburları"
 penal_infantry_desc:0 "Ceza taburları, mahkum askerlere ve Kızıl Ordu subaylarına vatan için kan dökme ve geçmişte işledikleri utanç verici veya onursuz eylemler için kendilerini affettirme fırsatı sunar."
 peoples_army:0 "Halk Ordusu"
 peoples_army_desc:0 "Halk Ordusu, silahlar üzerinde insanların önceliğine inanır, üstün motivasyonla aşağı teknoloji telafi edilir ve sivil nüfustan yaygın destek görür.\n\n"
 phased_array:0 "Faz Dizilimli"
 phased_array_desc:0 "Mekanik dönüşe dayanan geleneksel radarın aksine, faz dizilimleri ışını yönlendirmek için elektronik kullanır, bu da aynı anda birden fazla hedefi izlemek gibi birden fazla işlevi yerine getirmesini sağlar."
 pocket_defence:0 "Cep Savunması"
 pocket_defence_desc:0 "Savunmadayken birliklerimizin bir cepte yakalanması mümkündür. Bu durumda, kaçınılmaz karşı saldırı onları kurtarana kadar sadece dayanmalıdırlar."
 pre_dreadnoughts:0 "Ön-Dretnot Gemiler"
 prepared_defense:0 "Hazırlanmış Savunma"
 prepared_defense_desc:0 "Daha kapsamlı saha tahkimat sistemleri, bir birimin savunmasını büyük ölçüde geliştirir."
 pykrete_tech:0 "Paykrit Teknolojisi"
 radar_tech:0 "RADAR teknolojisi"
 radio:0 "Radyo"
 radio_desc:0 "Amatör radyo operatörlerinin icatlarını benimsemek ve FM radyo kullanımını genişletmek, radyo parazitini azaltacak ve radyo teknolojisi için yeni kullanımlar bulmamızı sağlayacaktır."
 radio_detection:0 "Radar"
 radio_detection_desc:0 "RADAR, Radyo Tespit ve Menzil Belirleme'nin geliştirilmesi, fiziksel nesneleri tespit etmek için radyo dalgalarını kullanmayı sağlar. Bu icatların birimleri bulma üzerindeki etkisi göz önüne alındığında, araştırma son derece gizlidir."
 radio_detection_sp_2_tt:0 "$coordination_bonus$: §G+%2§!\n$MODIFIER_STATIC_ANTI_AIR_HIT_CHANCE_FACTOR$: §G+%20§!"
 radio_detection_unlock_tt:0 "§Y$land_facility$§! tesisinde §Y$sp_air_radar$§! deneysel araştırmasını tamamlayarak açılır!"
 raider_patrols:0 "Akıncı Devriyeleri"
 raider_patrols_desc:0 "Hem hızlı hem de ağır toplu gemilerin devriyeleri, düşman ticaret konvoylarının saklanacak hiçbir yeri olmadığını gösterir.\nSadece denizaltılar avlanamaz."
 railway_gun:0 "$railway_gun_equipment_1$"
 rangers_backbone_doctrine:0 "Hafif Piyade Uzmanlığı"
 rangers_backbone_doctrine_desc:0 "Orman uzmanlarımızın edindiği beceriler, tüm seçkin kuvvetlerimizin yararlanabileceği bir şeydir. Bu bilgiyi hafif ve seçkin birliklerin tüm şubelerinde kullanmalıyız."
 rangers_fire_support_integration:0 "Ateş Desteği Entegrasyonu"
 rangers_fire_support_integration_desc:0 "Taşınabilir sinyal ekipmanına sahip ileri gözlemcilerin korucu ekiplerine entegrasyonu, küçük, izole birimlerin bile topçu ateşi desteği olmadan savaşmak zorunda kalmaması anlamına gelir."
 rangers_guerilla_doctrine:0 "Orman Gerillaları"
 rangers_guerilla_doctrine_desc:0 "İnisiyatif ve hareket, düşmana saldırabilmenin temel bileşenleridir. Korucularımız gizlilik ve sürprizi kullanmakta üstün olmalıdır."
 rangers_jaegers_training:0 "Jaeger Geleneklerini Dahil Et"
 rangers_jaegers_training_desc:0 "Ormanlarda savaşmak, bölgenin sunduklarıyla geçinmek üzere eğitilmiş, tuzak kurma, pusu ve mükemmel atış konusunda uzman hafif piyadeler."
 rangers_jungle_training:0 "Korucu Orman Eğitimi"
 rangers_jungle_training_desc:0 "Sadece hayatta kalmakta değil, aynı zamanda en sık ormanlarda, tropikal sıcakta savaşmakta da usta olan bu korucular, normal birliklerin girmeye cesaret edemediği alanlarda faaliyet göstermek için anahtardır."
 rangers_recon_terrain_training:0 "Keşif Korucuları Arazi Ustalığı"
 rangers_recon_terrain_training_desc:0 "Korucu taktiklerinin temel bir ön koşulu, düşmanı beklemediği bir yerden vurmak için en zorlu arazileri geçebilme yeteneğidir."
 rangers_tech:0 "Korucular I"
 rangers_tech2:0 "Korucular II"
 rangers_tech2_desc:0 "Orman uzmanlarını küçük keşif birimleri yerine toplu halde kullanmak, bize hafifçe savunulan sektörlere karşı kitlesel saldırılar düzenleme fırsatı verir."
 rangers_tech3:0 "Korucular III"
 rangers_tech3_desc:0 "Zorlu bölgelerde faaliyet göstermek özel teçhizat ve özel eğitim yöntemleri gerektirir. Birliklerimizin en son araçlarla donatıldığından ve en son yöntemler kullanılarak eğitildiğinden emin olmalıyız."
 rangers_tech_cat:0 " Korucular Teknolojisi"
 rangers_tech_desc:0 "Orman muharebesinde uzmanlaşarak, hafif piyademizi araziye ve bitki örtüsüne uyum sağlayacak şekilde eğiterek, savunmada birliklerden tasarruf edebilir veya hatta düşman hatlarını bizi en az bekledikleri yerden yarabiliriz."
 rangers_urban_combat:0 "Korucular Şehir Savaşı Uzmanlığı"
 rangers_urban_combat_desc:0 "Orman ve şehir savaşı, kısa angajman mesafeleri ve sınırlı gözlem ile belirli benzerlikleri paylaşır. Bir ortamda yetenekli birlikler diğerine uyum sağlamak için eğitilebilir."
 recon_tech:0 "Keşif Bölüğü"
 regimental_combat_teams:0 "Alay Muharebe Timleri"
 regimental_combat_teams_desc:0 "Bir alay muharebe timi, Topçu, Tank ve Keşif unsurları gibi destek birimleriyle yakından entegre edilmiş bir Piyade alayıdır ve saldırırken daha fazla esneklik sağlayan küçük, kendi kendine yeten bir birim oluşturur."
 reinforced_wings_mothership:0 "Güçlendirilmiş Ana Gemi Kanatları"
 reinforced_wings_mothership_desc:0 "Uçan Uçak Gemileri olmadan avcı uçakları adeta havada mahsur kalır, bu da operasyonel etkinliklerini ciddi şekilde sınırlar. Uçan Uçak Gemisi'nin hava filolarını güçlendirmek, tüm filonun beka kabiliyetini artırmak için en uygun maliyetli stratejidir."
 research_requirements_and:0 "Aşağıdaki teknolojileri gerektirir:"
 research_requirements_or:0 "Aşağıdaki teknolojilerden birini gerektirir:"
 rocket_artillery2:0 "Roket Topçusu Yükseltmesi I"
 rocket_artillery2_desc:0 "Birden fazla roket kullanan kundağı motorlu topçu, karşı ateşi önlemek için hareket kabiliyetini korurken hızla büyük ölçekli yıkıma neden olabilir."
 rocket_artillery3:0 "Roket Topçusu Yükseltmesi II"
 rocket_artillery3_desc:0 "Menzilden feragat ederek etki için, daha büyük araçlara daha ağır roketler monte edebiliriz. Takımlar halinde çalışan bu topçu bataryaları, hızla yeniden doldurmak ve yer değiştirmek için işbirliği yapabilir."
 rocket_artillery4:0 "Roket Topçusu III"
 rocket_artillery4_desc:0 "Dönüşle stabilize edilen roketler, daha hafif topçu bataryalarının menzilini artırabilir."
 rocket_engines:0 "Roket Motorları"
 rocket_engines_desc:0 "Roket itki bilgisi, daha önce ulaşılamayan hızlarda çalışan uçan bombalar ve roketle çalışan uçaklar inşa edebileceğimiz bir noktaya ulaşıyor."
 rocket_interceptor:0 "Roket Önleme Uçağı"
 rocket_interceptor_2:0 "Roket Önleme Uçağı II"
 rocket_interceptor_2_desc:0 "Hala kullanımı son derece tehlikeli kabul edilen roketle çalışan avcı uçakları, aşırı hızlarının ancak kısa yakıt penceresinin kullanımını en üst düzeye çıkarmak için artık otopilotlar ve diğer uçaklar tarafından çekilerek destekleniyor."
 rocket_interceptor_3:0 "Roket Önleme Uçağı III"
 rocket_interceptor_3_desc:0 "Yeni iniş teknikleri ve daha güvenli yakıt sistemleri, roket avcı uçaklarının başarı ve hayatta kalma şansını önemli ölçüde artırdı ve bu son teknoloji araçların bir zamanlar teorik olan potansiyelini yerine getirdi."
 rocket_interceptor_desc:0 "Planörlere dayalı roketle çalışan önleme uçakları, kısa süreler için diğer tüm uçaklardan daha hızlı hareket edebilir. Yakıtın değişkenliği uçakları riske atsa da, kalkış yapabilir ve saldırılara herhangi bir düşmanın beklediğinden daha hızlı tepki verebilirler."
 rocketry:0 "Roketçilik teknolojisi"
 rubber_processing:0 "Kauçuk İşleme"
 rubber_processing_desc:0 "Doğal kauçuğa olan bağımlılığımızı azaltmak için sentetik kauçuğun endüstriyel olarak işlenmesi gerekmektedir."
 schwerpunk:0 "Schwerpunkt"
 schwerpunk_desc:0 "Herhangi bir operasyonda Schwerpunkt veya Odak Noktası belirlenmeli ve o noktada kazanmak için maksimum kuvvet yoğunlaştırılmalıdır."
 scout_plane1:0 "Keşif Uçağı I"
 scout_plane1_desc:0 "Düşman birlik hareketleri hakkında istihbarat toplamak ve düşman deniz konuşlandırmaları hakkında raporlar sunmak, Büyük Savaş'taki ilk konuşlandırmalarından bu yana uçakların orijinal görevi olmuştur ve hala önemli bir görevdir."
 scout_plane2:0 "Keşif Uçağı II"
 scout_plane2_desc:0 "Hava gözetimi ve uzun menzilli keşif için özel uçaklar geliştirerek, rakibimizin niyetleri ve yetenekleri hakkında doğru bir resim elde etmemizi ve sürdürmemizi sağlarız."
 seaplane_tender_advice_tt:0 "\n§YMuhriplere§! bir §YDeniz Uçağı Gemisi§! modülü monte etmek, düşman gemilerini tespit etme yeteneklerini geliştirir."
 secondary_battery_advice_tt:0 "\nBir §Yİkincil Batarya§!, §YKruvazörlerin§! ve §YAğır Gemilerin§! başka bir hedefe hasar verirken düşman §YPerdeleme Gemilerine§! ikincil hedef olarak saldırmasına olanak tanır."
 secret_weapons_folder:0 "Gizli Silahlar"
 secret_weapons_folder_desc:0 "Harika silahlar, çılgın bilimin ürünü."
 shbb_tech:0 " Süper Ağır Zırhlı modelleri"
 ship_modules_tech:0 "Gemi modülleri"
 shock_and_awe:0 "Şok ve Dehşet"
 shock_and_awe_desc:0 "Büyük bir ateş gücü yoğunlaşması, bir düşmanın devam etme iradesini felç etmek için anında veya yeterince zamanında bu ezici Şok ve Dehşet seviyesini uygulayacaktır."
 signal_company_tech:0 "Muhabere Bölüğü Teknolojisi"
 ski_troops:0 "Soğuk Hava Uzmanları"
 ski_troops_desc:0 "Soğuk hava uzmanları, savaş alanı taktiklerimiz için hayati öneme sahiptir. Bu uzmanları askeri anayasamızda resmi olarak tanıyarak, onları daha da yükseltmek için kaynak ve eğitim serbest bırakabiliriz."
 smoke_generator:0 "Sis Jeneratörleri"
 smoke_generator_desc:0 "Hafif ve orta gemilerin motorlarına ve bacalarına yapılan bazı küçük modifikasyonlar, düşmanla temastan kaçınmak veya teması kesmek için çok fazla duman çıkarmalarını sağlar."
 snorkel_advice_tt:0 "\n§YŞnorkelleri§! §YDenizaltılara§! monte etmek, §YGörünürlüklerini§! önemli ölçüde azaltır, bu da onları düşman gemileri için görmeyi ve saldırmayı zorlaştırır."
 sonar:0 "Pasif Sonar"
 sonar_advice_tt:0 "\n§YSonar§! modülünü §YHafif Gemilere§! ve §YKruvazörlere§! monte etmek, düşman §YDenizaltılarını§! tespit etmelerine yardımcı olacaktır."
 sonar_desc:0 "Temel bir hidrofon seti, çıkardıkları sese göre su altı hedeflerinin izlenmesini sağlar.\n\nBu modülü §YHafif Gemiler§! veya §YKruvazörler§! üzerindeki bir §YElektronik Yuvasına§! monte etmek, düşman §YDenizaltılarını§! tespit etmelerine yardımcı olacaktır."
 sp_advance_sabot_shells:0 "Gelişmiş Sabot Mermileri"
 sp_advance_sabot_shells_desc:0 "Zırh delici mühimmat araştırmalarına ayrılan ek kaynaklar, birçok farklı kullanım durumunda Sabot stabilizasyonunun nasıl iyileştirileceği konusunda bize içgörü kazandırdı."
 sp_aip_engine_advanced_tech:0 "Yüksek Hızlı Walter Motorları"
 sp_aip_engine_advanced_tech_desc:0 "Havadan Bağımsız İtki Sistemi konusundaki deneyimimiz ve anlayışımız, son teknoloji motorlar geliştirmemizi sağladı. Sessiz, hızlı ve ölümcül."
 sp_aip_engine_improved_tech:0 "HBT-Dizel Kombinasyon Motorları"
 sp_aip_engine_improved_tech_desc:0 "HBT teknolojisinin daha da rafine edilmesiyle, hem performans hem de motorların kullandığı malzeme tüketimi açısından iyileşme görüyoruz."
 sp_armored_advanced_flamethrower_tech:0 "Gelişmiş Alev Makinesi"
 sp_armored_advanced_flamethrower_tech_desc:0 "$advanced_flamethrower_desc$"
 sp_armored_engineer_tech:0 "Zırhlı Mühendis Bölüğü"
 sp_armored_engineer_tech_desc:0 "Mühendislik uzmanlığını zırhlı koruma ile birleştiren zırhlı mühendis birimleri, ağır ateş altında engelleri temizleme ve ön cephe ilerlemelerini destekleme konusunda uzmanlaşmıştır."
 sp_armored_lc_high_impact_obliterator_cannon_tech:0 "Yüksek Etkili İmha Topu"
 sp_armored_lc_high_impact_obliterator_cannon_tech_desc:0 "$lc_high_impact_obliterator_cannon_desc$"
 sp_armored_lc_naval_engine_conversion_tech:0 "Deniz Motoru Dönüşümü"
 sp_armored_lc_naval_engine_conversion_tech_desc:0 "Güçlendirilmiş krank milleri, yüksek torklu şanzımanlar ve özel soğutma sistemleri gibi deniz mühendisliği tekniklerini kullanmak, Kara Kruvazörü motorlarının güç çıkışını ve dayanıklılığını artırabilir, bu da onların muazzam ağırlığı ve stresi daha iyi yönetmelerini sağlar."
 sp_armored_lc_specialized_field_manuals_tech:0 "Özelleştirilmiş Saha Kılavuzları"
 sp_armored_lc_specialized_field_manuals_tech_desc:0 "Kara Kruvazörü mürettebatı için özel olarak hazırlanmış, bu devasa savaş makinelerini etkili bir şekilde komuta etmek için gereken benzersiz operasyonel prosedürleri, bakım protokollerini ve karmaşık savaş alanı taktiklerini kapsayan ayrıntılı eğitim kılavuzları geliştirmek."
 sp_armored_lc_transmission_improvements_tech:0 "Şanzıman İyileştirmeleri"
 sp_armored_lc_transmission_improvements_tech_desc:0 "Kara Kruvazörlerinin aşırı gücünü ve ağırlığını kaldırabilen, genel hareketliliği artıran ve mekanik gerilimi azaltan daha verimli şanzımanlar yaratmak için rafine edilmiş dişli oranları, debriyaj mekanizmaları ve tork konvertörleri."
 sp_armored_lc_weapon_fire_control_tech:0 "Silah Ateş Kontrolü"
 sp_armored_lc_weapon_fire_control_tech_desc:0 "Silah hassasiyetini ve ateşleme koordinasyonunu artırmak için gelişmiş hedefleme optikleri, telemetreler ve jiroskopik stabilizatörler uygulamak, topların devasa geri tepmelerine ve yavaş manevra kabiliyetlerine rağmen hedefleri etkili bir şekilde vurabilmelerini sağlamak."
 sp_armored_maintenance_tech:0 "Zırhlı Bakım Bölüğü"
 sp_armored_maintenance_tech_desc:0 "Zırhlı kurtarma araçlarının kullanımı, bakım personelimizin her türlü teçhizatı kurtarmasını ve onarmasını sağlayarak savaş alanında maksimum operasyonel hazırlık sağlar."
 sp_armored_motorized_military_police_tech:0 "Motorize Askeri Polis"
 sp_armored_motorized_military_police_tech_desc:0 "Askeri motosikletlerle donatılmış bu birimler, hatların gerisinde düzeni sağlamak, konvoylara eşlik etmek ve devriye gezmekle görevlidir. Hızları ve hareket kabiliyetleri, kesintilere hızla müdahale etmelerini ve gerekirse aktif muharebe bölgelerinde keşif yapmalarını sağlar."
 sp_armored_signal_tech:0 "Zırhlı Muhabere Bölüğü"
 sp_armored_signal_tech_desc:0 "Birliklerimizi komuta araçlarıyla donatmak, zırhlı koruma altında güvenli ve güvenilir savaş alanı iletişimi ve koordinasyonu sağlayacaktır."
 sp_artillery_purpose_built_gun_motor_carriages_tech:0 "Amaca Yönelik İnşa Edilmiş Top Motorlu Taşıyıcılar"
 sp_artillery_purpose_built_gun_motor_carriages_tech_desc:0 "Süper ağır obüsleri taşımak ve desteklemek için tasarlanmış, hareketlilik ve savaş alanı konuşlandırma kolaylığı sağlayan özel araçlar."
 sp_artillery_rocket_assisted_projectiles_tech:0 "Roket Destekli Mermiler"
 sp_artillery_rocket_assisted_projectiles_tech_desc:0 "Süper ağır obüsler için menzili uzatmak ve roket itkisiyle etkiyi artırmak üzere tasarlanmış geliştirilmiş mermiler."
 sp_cluster_shells:0 "Misket Mermileri"
 sp_cluster_shells_desc:0 "Misket mermileri, geniş bir alana birden fazla alt mühimmat dağıtarak düşman birliklerine ve teçhizatına karşı hasarı en üst düzeye çıkarır."
 sp_helicopter_artillery_observers_tech:0 "Helikopter Keşif Bölüğü"
 sp_helicopter_artillery_observers_tech_desc:0 "Helikopterler, gerçek arazi ne olursa olsun savaş alanının iyi bir görüş açısını elde edebilir ve bu nedenle topçu salvolarına doğru geri bildirim sağlamak için mükemmel ileri gözcülerdir."
 sp_helicopter_med_evac_tech:0 "Helikopter Tıbbi Tahliye Bölüğü"
 sp_helicopter_med_evac_tech_desc:0 "Gelen yaralı var! Gelen yaralı var! Helikopterler, normal ambulanslardan daha da hızlı yaralı tahliyesi sağlar."
 sp_helicopter_transport_pods_tech:0 "Helikopter Nakliye Bölüğü"
 sp_helicopter_transport_pods_tech_desc:0 "Nakliye kapsülleriyle donatılmış helikopterler veya altlarında bir hatla mal çeken helikopterler, ikmal malzemelerini ve teçhizatı hızlı ve araziye bakılmaksızın taşıyabilir. Çamura saplanmak geçmişte kaldı!"
 sp_ice_composite_runawayas:0 "Buz Kompozit Pistler"
 sp_ice_composite_runawayas_desc:0 "Buz kompozitlerinin sürekli gelişimiyle, uçak gemimiz ve uçaklarımız için koruma sağlamak adına en iyi malzemeleri ve inşaat tekniklerini arıyoruz."
 sp_multi_product_supply_ships:0 "Çok Ürünlü İkmal Gemisi"
 sp_multi_product_supply_ships_desc:0 "Yeni üretilen ikmal gemilerinin kullanımıyla, yakıt, mühimmat ve ikmal malzemelerinin daha sorunsuz transferini sağlayabiliriz."
 sp_refined_pykrete:0 "Rafine Paykrit"
 sp_refined_pykrete_desc:0 "Pykrete'in daha da rafine edilmesiyle, Buz Uçak Gemisindeki uçaklarımız için artık çok daha iyi yalıtım ve korumaya sahip olabiliriz."
 sp_rockets_dual_chamber_rocket_engine_1:0 "Çift Odalı Roket Motorları"
 sp_rockets_dual_chamber_rocket_engine_1_desc:0 "Motora ikinci bir yanma odası ekleyerek, roket motorlarımızın uçuş süresini ve etkinliğini artırabiliriz."
 sp_rockets_dual_chamber_rocket_engine_2:0 "Gelişmiş Çift Odalı Roket Motorları"
 sp_rockets_dual_chamber_rocket_engine_2_desc:0 "Çift yanmalı motorun daha da geliştirilmesi, tasarımın etkinliğinde daha da büyük iyileşmelere yol açabilir."
 sp_rockets_improved_guidance:0 "Geliştirilmiş Güdüm"
 sp_rockets_improved_guidance_desc:0 "Roketler için daha iyi güdüm sistemleri, uçan bombalarımızı daha uzağa göndermemizi sağlayacak ve onları düşmanlarımız için daha da büyük bir tehdit haline getirecektir. Daha küçük roketler için güdüm sistemlerini geliştirerek, roket topçularımız da nişanlarını geliştirebilecektir."
 sp_rockets_improved_rocket_bomber:0 "$improved_rocket_propelled_bombs$"
 sp_rockets_improved_rocket_bomber_desc:0 "$improved_rocket_propelled_bombs_desc$"
 sp_rockets_rocket_bomber:0 "$rocket_propelled_bombs$"
 sp_rockets_rocket_bomber_desc:0 "$rocket_propelled_bombs_desc$"
 sp_shock_hardening_techniques:0 "Şok Sertleştirme Teknikleri"
 sp_shock_hardening_techniques_desc:0 "Çeşitli Şok Sertleştirme Teknikleri kullanarak ve bileşenlerimiz için gerilim dengeleyiciler kullanarak, erken patlama oranını düşürdük, mermilerimizi daha güvenilir ve etkili hale getirdik."
 sp_standard_tenshioned_replenishment_alongside_method:0 "Standardize Gerilimli Yan Yana İkmal Yöntemi"
 sp_standard_tenshioned_replenishment_alongside_method_desc:0 "Standartlaştırılmış Gergin İkmal Yan Yana Yöntemi veya STREAM, uzun menzilli deniz operasyonlarımızın istikrarlı bir şekilde ikmal edilmesini sağlamanın daha ileri bir evrimidir"
 sp_variable_time_fuze_shells:0 "Değişken Zamanlı Tapa Mermileri"
 sp_variable_time_fuze_shells_desc:0 "Değişken Zamanlı Tapa Mermilerini benimseyerek, sahra topçumuzu rakiplerimize karşı yıkıcı hale getirdik. Mermiler yere ulaşmadan patlayarak çok daha büyük bir ölüm bölgesi yaratıyor."
 special_forces_doctrine:0 "Özel Kuvvetler Doktrini"
 special_forces_doctrine_folder:0 "Özel Kuvvetler Doktrini"
 special_forces_doctrine_folder_desc:0 "Özel kuvvetlerimizin nasıl eğitildiği."
 special_forces_marines:0 "Deniz Piyade Kolordusunu Yükselt"
 special_forces_marines_desc:0 "Deniz Piyade Kolordusu, kimsenin gitmeye cesaret edemediği yerde hizmet eder. Ana kıyıdan yabancı iklime kadar, bu uzmanlar sızma ve amfibi savaşta başarılıdır. Geniş bir erişim ve esnek bir felsefe, askeri doktrinimizin temelini oluşturmalıdır."
 special_forces_mountaineers:0 "Dağcıları Yükselt"
 special_forces_mountaineers_desc:0 "Elverişsiz ortamlar ve çetin çatışmalar, en sert askerleri elit kuvvetlerimize çeker. Onların doktrinel felsefemizdeki önceliğini kutsallaştırmak, en iyilerin işe alınmasından faydalanmaya devam etmemizi sağlar."
 special_forces_paratroopers:0 "Paraşütçüleri Yükselt"
 special_forces_paratroopers_desc:0 "Binlerce asker dolu nakliye uçağının görüntüsüyle gökyüzünün kararması kadar korkutucu bir şey yoktur. Doktrinel felsefemiz, havacılığın aşıladığı şok ve dehşetten yararlanmalıdır."
 special_forces_rangers:0 "Korucuları Yükselt"
 special_forces_rangers_desc:0 "Hafif piyade başarımızın anahtarıdır. Keskin nişancı gelenekleri ve sızma taktikleri, seçkin oluşumlarımızı inşa etmede temel olmalıdır."
 special_forces_recon:0 "Savaş Alanı İstihbaratı"
 special_forces_recon_desc:0 "Elit alaylarımız, karşı istihbarat ve savaş alanı farkındalığından eşsiz bir şekilde yararlanır. Ek eğitim, bize daha fazla fayda sağlayacağından emindir."
 ss_tech:0 " Denizaltı modelleri"
 strategic_bomber:0 " Stratejik Bombardıman Uçağı modelleri"
 strategic_destruction:0 "Stratejik Yıkım"
 strategic_destruction_desc:0 "Pilotlarımız stratejik hedeflere deniz veya kara kuvvetlerimizden çok daha hızlı erişebilir. Yeni acemilerini donatacak araçları olmadığında, yakında düşman kuvvetlerini sayıca geride bırakacağız."
 strategic_destruction_tree:0 "Stratejik Yıkım Doktrini"
 streamlined_line:0 "Modernize Hat"
 streamlined_line_desc:0 "Montaj hattının standardizasyonu ve katı yapısı, verimliliğinin ve güvenliğinin anahtarıdır. Endüstriyel üretimimizde geliştirmemiz gereken temel yönler bunlar olmalıdır."
 submarine_doctrine:0 "Denizaltı Operasyonları Doktrinleri"
 submarine_mine_laying:0 "Mayın Döşeyen Denizaltı"
 submarine_mine_laying_desc:0 "Mayınları tutmak ve serbest bırakmak için özel ekipman kurarak, özel olarak tasarlanmış bir denizaltı, batık durumdayken ve umarım tespit edilmeden mayın döşeyebilir."
 submarine_offensive:0 "Denizaltı Taarruzu"
 submarine_offensive_bs:0 "Denizaltı Taarruzu"
 submarine_offensive_bs_desc:0 "Denizaltılarımız arasındaki iletişimin zirvesine ulaşmak, onların taarruza geçmelerini sağlar. Düşman ticaret konvoylarını, yerine koyabileceklerinden daha hızlı yok edelim."
 submarine_offensive_desc:0 "Denizaltılarımız arasındaki iletişimin zirvesine ulaşmak, onların taarruza geçmelerini sağlar. Düşman ticaret konvoylarını, yerine koyabileceklerinden daha hızlı yok edelim."
 submarine_operations:0 "Denizaltı Operasyonları"
 submarine_operations_bs:0 "Denizaltı Operasyonları"
 submarine_operations_bs_desc:0 "Savaşı kazanmak için düşman filosuyla doğrudan çatışmaya girmemize gerek yok. Tepki veremeden ticaret konvoylarına saldırın ve tekrar yüzeyin altına kaybolun. Göremediğiniz şeyle savaşamazsınız."
 submarine_operations_desc:0 "Savaşı kazanmak için düşman filosuyla doğrudan çatışmaya girmemize gerek yok. Tepki veremeden ticaret konvoylarına saldırın ve tekrar yüzeyin altına kaybolun. Göremediğiniz şeyle savaşamazsınız."
 subsidiary_carrier_role:0 "Yardımcı Uçak Gemisi Rolü"
 subsidiary_carrier_role_desc:0 "Uçak gemileri Zırhlıları destekler, savunmadan taarruza geçme hazırlıklarını artırır. Uçak Gemisinin hem gökyüzündeki bir göz hem de güçlü bir hızlı saldırı kuvveti olarak kullanışlılığı, daha yavaş olan Zırhlıları iyi bir şekilde tamamlar."
 subsidiary_carrier_role_ti:0 "Yardımcı Uçak Gemisi Rolü"
 subsidiary_carrier_role_ti_desc:0 "Uçak gemileri Zırhlıları destekler, savunmadan taarruza geçme hazırlıklarını artırır. Uçak Gemisinin hem gökyüzündeki bir göz hem de güçlü bir hızlı saldırı kuvveti olarak kullanışlılığı, daha yavaş olan Zırhlıları iyi bir şekilde tamamlar."
 suicide_craft:0 "Yokosuka MXY7 Ohka"
 suicide_craft_desc:0 "Roketle çalışan kamikaze aracı"
 sup_delay:0 "Oyalama"
 sup_delay_desc:0 "Bir savaş kazanılamasa bile, pusu ve oyalama taktikleriyle saldıran kuvvetlerin ilerlemesini yavaşlatmak avantajlı olabilir."
 sup_mechanized_offensive:0 "Mekanize Taarruz"
 sup_mechanized_offensive_desc:0 "Motorize birlikler iyi ve güzeldir, ancak taarruzlara liderlik etmek için onları koruyan ve ağır silahlar taşıyan zırhlı nakliye araçlarında savaşa gidebilen Piyadelere ihtiyacımız var."
 superior_firepower:0 "Üstün Ateş Gücü"
 superior_firepower_desc:0 "Bu doktrin, düşmana insanları değil, mermileri atmaya odaklanır. İnsan gücümüz değerli, mermiler ucuzdur.\n\n"
 support_folder:0 "Destek Bölükleri"
 support_folder_desc:0 "Keşif, Mühendis, Sahra Hastaneleri ve diğer destek bölükleri."
 support_tech:0 " Destek teknolojisi"
 support_tech_research:0 " Destek Birimi Araştırma Hızı"
 support_weapons:0 "Destek Silahları I"
 support_weapons2:0 "Destek Silahları II"
 support_weapons2_desc:0 "Hafif ve ağır makineli tüfeklerin özelliklerini birleştiren otomatik silahların geliştirilmesi, piyademizin teçhizatlarını kullanma şekillerinde çok yönlülük sağlar."
 support_weapons3:0 "Destek Silahları III"
 support_weapons3_desc:0 "Makineli tüfeklerin güvenilirliğini korurken ve geliştirirken, sürekli mermi akışının ölümcüllüğünü sağlamak için daha yüksek atış hızlarıyla da deney yapabiliriz."
 support_weapons4:0 "Destek Silahları IV"
 support_weapons4_desc:0 "Taarruz tüfeklerinin artan kullanımıyla, tüm askerler tarafından her ortamda kullanılabilecek güvenilir otomatik silahlar geliştirmek, modern bir ordu için bir önceliktir."
 support_weapons_desc:0 "Otomatik silahlar daha taşınabilir hale geliyor. Hafif makineli tüfekler zaten etkili olduğunu kanıtladı ve elde taşınan destek silahlarının geliştirilmesi devam etmelidir."
 survival_training:0 "Hayatta Kalma Eğitimi"
 survival_training_desc:0 "Özel kuvvetlerimiz genellikle düşman hatlarının gerisinde ve kısıtlı ikmalle savaşacaktır. Onları zorlu hava koşullarına dayanmaları ve sınırlı malzemelerle savaşmaları için eğitmeliyiz."
 synth_oil_experiments:0 "Sentetik Petrol Deneyleri"
 synth_oil_experiments_desc:0 "Petrole olan bağımlılığı azaltmak için, diğer maddelerden ve malzemelerden ikame üretme süreçleri araştırılabilir."
 synth_resources:0 " Sentetik kaynaklar"
 synth_resources_research:0 " Sentetik Kaynak Araştırma Hızı"
 tactical_bomber:0 " Taktik Bombardıman Uçağı modelleri"
 tactical_control:0 "Taktik Kontrol"
 tactical_control_desc:0 "İleri mevkilerde müşterek harekat operasyonlarına aşina olan subaylar artık tüm branşların operasyonlarını doğrudan kontrol edebilir."
 tank_landing_craft:0 "Gelişmiş Çıkarma Gemisi"
 tank_landing_craft_desc:0 "Gelişmiş Çıkarma gemileri, çocuklarımızın bir çıkarma sırasında sahile daha hızlı ve daha etkili bir şekilde çıkabileceği anlamına gelir."
 tech_engineers:0 "Mühendis Bölüğü I"
 tech_engineers2:0 "Mühendis Bölüğü II"
 tech_engineers2_desc:0 "Modern teçhizat ve yüksek patlayıcılarla, mühendislerimiz geleneksel görevlerinin ötesine geçebilir ve yaratıcılıklarıyla karada ve denizde düşmanı şaşırtabilirler."
 tech_engineers3:0 "Mühendis Bölüğü III"
 tech_engineers3_desc:0 "Askeri mühendislik projeleri daha büyük bir ölçeğe yaklaşıyor. Gelişmiş altyapısal yardımın inşası, sahada normalde mevcut olanın ötesinde ikmal gerektiren operasyonları mümkün kılar."
 tech_engineers4:0 "Mühendis Bölüğü IV"
 tech_engineers4_desc:0 "Daha önce kalıcı tahkimatlar ve tedarik sistemleri olarak kabul edilenleri inşa ederken yerel hareketliliği koruyan geleceğin muharebe mühendisleri, birliklerimiz nerede saldırıya uğrarsa uğrasın hazırlıklı olmalarını sağlayacaktır."
 tech_engineers_desc:0 "Tahkimatların inşası ve engellerin aşılması, muharebe mühendislerini sahada hayati kılar. Mühendislerimize çok yönlü bir rol vermek, onları ihtiyaç duyulacakları çeşitli durumlarda konuşlandırmamızı sağlar."
 tech_field_hospital:0 "Sahra Hastanesi I"
 tech_field_hospital2:0 "Sahra Hastanesi II"
 tech_field_hospital2_desc:0 "Taşınabilir hastanelerin kullanımını kurarak, tıbbi bakımı ihtiyaç duyulan yere getirerek, birçok gereksiz ölümü ve kalıcı yaralanmayı durdurabiliriz."
 tech_field_hospital3:0 "Sahra Hastanesi III"
 tech_field_hospital3_desc:0 "Cerrahi, sahada ihtiyaç duyulan en yaygın acil prosedürler arasındadır. Bunun için prosedürler ve araçlar cepheye daha yakın olmalı ve askeri tıbbi birimlerin bir parçası olarak yetenekli cerrahların bulunmasını sağlamalıyız."
 tech_field_hospital4:0 "Sahra Hastanesi IV"
 tech_field_hospital4_desc:0 "Saha tıbbında birçok iyileştirme yapılmış olsa da, birçok ilerleme doğaçlamadır ve yerleşik bir doktrinimiz yoktur. Daha fazla deneyimle, bu birimlerin rolünü daha net açıklayabilir ve doğaçlama yenilikleri kalıcı hale getirebiliriz."
 tech_field_hospital_desc:0 "Bir zayiat, ölü bir asker anlamına gelmek zorunda değil. Gerideki yaralılarımıza anında tıbbi müdahale sağlamak, bunu sağlamanın ilk adımıdır."
 tech_logistics_company:0 "Lojistik Bölüğü I"
 tech_logistics_company2:0 "Lojistik Bölüğü II"
 tech_logistics_company2_desc:0 "Risk analizlerimizi yeni savaş koşullarına uyarlamak, lojistik desteğimizin güvenliğini artıracaktır."
 tech_logistics_company3:0 "Lojistik Bölüğü III"
 tech_logistics_company3_desc:0 "Birlik ikmal ihtiyaçlarının sürekli istatistiksel değerlendirmesi, kaynaklarımızın faydasını en üst düzeye çıkarmaya katkıda bulunur."
 tech_logistics_company4:0 "Lojistik Bölüğü IV"
 tech_logistics_company4_desc:0 "İkmaller için standartlaştırılmış sınıflandırmalar geliştirmek, karışıklığı en aza indirecek ve planlamayı daha verimli hale getirecektir."
 tech_logistics_company_desc:0 "Saflarımızda uzman Lojistik Subaylarının bulunması, israfı en aza indirmek için destek ağlarının kullanılmasını sağlayacaktır."
 tech_maintenance_company:0 "Bakım Bölüğü I"
 tech_maintenance_company2:0 "Bakım Bölüğü II"
 tech_maintenance_company2_desc:0 "Rutin operasyonel bakım prosedürleri, teçhizatın arızalanma riskini en aza indirir ve birlikleri arızalanmadan önce değiştirmeleri için uyarır."
 tech_maintenance_company3:0 "Bakım Bölüğü III"
 tech_maintenance_company3_desc:0 "Birliklerimizin sahada yaygın onarımları yapmak için her zaman temel malzemelere sahip olmasını sağlamak, hasarlı olduğu bilinen teçhizatın sürekli kullanımını önleyecektir."
 tech_maintenance_company4:0 "Bakım Bölüğü IV"
 tech_maintenance_company4_desc:0 "Büyük Savaş'taki aktif yedeklilik için tasarım deneyimleri, bakımı kolaylaştırmak için daha modern teçhizatla çalışmak üzere yenilenebilir."
 tech_maintenance_company_desc:0 "Bakım, onarım ve revizyon, askeri teçhizatı güvenilir ve kullanımı güvenli tutmak için önemlidir. Buna adanmış bölüklere sahip olmak, buna uygun ilginin gösterilmesini sağlayacaktır."
 tech_military_police:0 "Askeri Polis I"
 tech_military_police2:0 "Askeri Polis II"
 tech_military_police2_desc:0 "İşgal altındaki topraklarda trafik kontrolü ve kamu düzenini sağlama gibi düzenli polis görevlerini üstlenerek, askeri polisimiz partizan hareketlerinin içinde geliştiği kaos ve karışıklığı en aza indirebilir."
 tech_military_police3:0 "Askeri Polis III"
 tech_military_police3_desc:0 "İşgalden önce kurulan yerel casus ağları ve muhbirlerle işbirliği yaparak, askeri polisimiz direnişin nerede ortaya çıkabileceğine proaktif olarak hazırlanabilir."
 tech_military_police4:0 "Askeri Polis IV"
 tech_military_police4_desc:0 "İşgal altındaki toprakları güvenli bir şekilde polislemek, muhalefeti acımasızca ortadan kaldırmak kadar normale dönmekle de ilgilidir. Askeri polisimiz, hem askerler hem de siviller için güvenliği sağlamak üzere bu sürecin erken başlamasını sağlamalıdır."
 tech_military_police_desc:0 "Normal birlikler daha kısa bir süre için işgali yönetebilir, ancak onlar her şeyden önce askerdir. Askeri polisi kuvvetlerimize entegre etmek, direnişe müdahale etmek ve sabotajı araştırmak için sahada insanlarımız olmasını sağlayacaktır."
 tech_mountaineers:0 "Dağcı Piyade I"
 tech_mountaineers2:0 "Dağcı Piyade II"
 tech_mountaineers2_desc:0 "Hayatta kalmanın ötesine geçerek, kuvvetlerimiz dağları kendi avantajlarına kullanmak için eğitilebilir. Hafif teçhizat ve katır nakliyatıyla, bu araziyi diğer piyadelerden daha iyi manevra yapabilirler."
 tech_mountaineers3:0 "Dağcı Piyade III"
 tech_mountaineers3_desc:0 "Yüksek irtifalardaki ve düşük sıcaklıklardaki en zorlu dağ görevlerine hazırlanmak, dağ birliklerimizden olağanüstü eğitim ve disiplin gerektirecektir."
 tech_mountaineers_desc:0 "Dağ sıralarındaki muharebe, birlikleri birçok tehlikeye maruz bırakır, ancak bazen kaçınılamaz. Askerlerimize bu ortam için özel eğitim vererek bu riskleri en aza indirebiliriz."
 tech_recon:0 "Keşif Bölüğü I"
 tech_recon2:0 "Keşif Bölüğü II"
 tech_recon2_desc:0 "Keşif görevleri genellikle tehlikelidir ve kayıplar yüksektir. Devriyelerimizi hızla hareket etmeye ve geri çekilmeye hazırlamak ve onları düşman tarafından yerleştirilen engelleri temizlemek için donatmak, hayatta kalma şanslarını artıracaktır."
 tech_recon3:0 "Keşif Bölüğü III"
 tech_recon3_desc:0 "Telsiz teknolojisindeki iyileştirmeler, keşif görevlerinin nasıl yürütülebileceğini değiştirerek toplanan istihbaratın hızlı bir şekilde iletilmesini sağlar."
 tech_recon4:0 "Keşif Bölüğü IV"
 tech_recon4_desc:0 "Casusluk, gerilla operasyonları ve komando eğitimini birleştiren derin keşif operasyonları, taktik seçimlerimize yardımcı olacak ve karar verme sürecimizi hızla uyarlamamızı sağlayacaktır."
 tech_recon_desc:0 "Ana kuvveti hareket ettirmeden önce daha küçük gruplar göndererek keşif yapmak, düşmanın nerede olduğu ve kaç kişiyle karşı karşıya olduğumuz hakkında istihbarat toplamamızı sağlar."
 tech_signal_company:0 "Muhabere Bölüğü I"
 tech_signal_company2:0 "Muhabere Bölüğü II"
 tech_signal_company2_desc:0 "Askeriyenin farklı branşları arasındaki iletişime odaklanan muhabere bölükleri, kara kuvvetlerinin deniz ve hava operasyonlarıyla çabalarını koordine etmelerini ve hareketlerini daha hızlı planlamalarını sağlayabilir."
 tech_signal_company3:0 "Muhabere Bölüğü III"
 tech_signal_company3_desc:0 "Giderek daha taşınabilir hale gelen iletişim teknolojisi, sırt çantası olarak kişisel olarak taşınmaya daha uygundur. Muhabere sınıfının bu artan hareketliliğinden yararlanılmalıdır."
 tech_signal_company4:0 "Muhabere Bölüğü IV"
 tech_signal_company4_desc:0 "Muhabere uzmanlarımız arasında, bu teçhizatın saha kullanımına ilişkin eşsiz ilk elden bilgiye sahip kişiler bulunmaktadır. Onları yeni iletişim teknolojilerinin araştırılmasına dahil ederek, uzmanlıklarından yararlanabiliriz."
 tech_signal_company_desc:0 "Sahada iletişimi kurmak ve sürdürmek her zaman özel beceriler gerektirmiştir. Büyük Savaş'ta yeni iletişim ve tespit teknolojisinin ortaya çıkmasıyla, uygulamanın önünde yeni olanaklar yatmaktadır."
 tech_special_forces:0 " Özel Kuvvetler"
 tech_special_forces_desc:0 "Alışılmadık savaş, uzman eğitimi gerektirir. Birliklerimizin hazır ve zorlu koşullara uyum sağlayabildiğinden emin olmalıyız."
 torpedo_advice_tt:0 "\n§YTorpido Kovanları§! modülünü §YHafif Gemilere§! veya §YKruvazörlere§! monte etmek, düşman §YPerdeleme Grubunu§! aşabilirlerse §YMuharebe Hattındaki§! düşman §YAna Gemilerine§! önemli hasar vermelerini sağlar."
 torpedo_cruiser_mtg:0 "Torpido Kruvazörü"
 tp_tech:0 " Nakliye modelleri"
 trade_interdiction:0 "Ticaretin Engellenmesi"
 trade_interdiction_desc:0 "Düşman gemilerini ne kadar erken tespit edersek, o kadar erken yok edebiliriz. Ticaret konvoylarına vurun ve tepki vermeye zamanları olmadan kaçın.\n\n"
 trade_interdiction_tree:0 "Ticaretin Engellenmesi Doktrinleri"
 train_tech:0 "Trenler ve Demiryolları"
 transport:0 "Nakliye Gemisi"
 transport_desc:0 "Sadece asker taşımak için tasarlanmış, herhangi bir savunma kabiliyeti olmayan gemi."
 transport_planes_cat:0 "Nakliye Uçakları"
 trench_warfare:0 "Siper Savaşı"
 trench_warfare_desc:0 "Bir kürek genellikle piyadenin en iyi silahıdır. Birimler, aldıkları her pozisyonda siper kazmanın değerini öğrenirler."
 undersea_blockade:0 "Denizaltı Ablukası"
 undersea_blockade_bs:0 "Denizaltı Ablukası"
 undersea_blockade_bs_desc:0 "Denizaltılar, düşmanın önemli ham madde akışını kesmek için mükemmel bir araçtır. Düşmanın üretimini felç edecek ve onları aç bırakarak kazanacağız."
 undersea_blockade_desc:0 "Denizaltılar, düşmanın önemli ham madde akışını kesmek için mükemmel bir araçtır. Düşmanın üretimini felç edecek ve onları aç bırakarak kazanacağız."
 unrestricted_submarine_warfare:0 "Sınırsız Denizaltı Harbi"
 unrestricted_submarine_warfare_desc:0 "Denizaltılarımızın sivil ya da değil, herhangi bir gemiyi uyarmadan batırmasına izin verin. Bazıları bunu savaş kurallarının ihlali olarak görse de, etkinliği inkar edilemez."
 urban_training_tech:0 "Şehir Eğitimi"
 vast_offensives:0 "Geniş Çaplı Taarruzlar"
 vast_offensives_desc:0 "Bir yarık açılabilirse, mümkün olduğunca güçlü bir şekilde sömürülmelidir: Düşman hatlarından mümkün olduğunca derine iten geniş bir taarruz, cephelerinin savunmasını daha zor, imkansız veya anlamsız hale getirecektir."
 volkssturm:0 "Volkssturm"
 volkssturm_desc:0 "Volkssturm veya Halk Milisleri, düzenli askerlik hizmeti için çok yaşlı, çok genç veya başka bir şekilde uygun olmayan erkeklerden oluşuyordu.\n\n"
 werwolf_guerillas:0 "Werwolf Gerillaları"
 werwolf_guerillas_desc:0 "Werwolf'lar, savaş kaybedildiğinde işgalci güçlere karşı savaşacak olan planlanmış bir Alman direniş grubuydu."
 wolfpacks:0 "Kurt Sürüleri"
 wolfpacks_desc:0 "Denizaltılarımız sürüler halinde organize edildiğinde aralarındaki koordinasyon büyük ölçüde artar. Bir düşman tespit edildiğinde denizaltımız sürünün geri kalanı gelene kadar bekler ve ancak şans ezici bir şekilde lehimize olduğunda saldırır."
