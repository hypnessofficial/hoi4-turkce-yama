 advanced_depth_charges:0 "Derinlik Bombası Havanı"
 advanced_depth_charges_desc:0 "Muhrip üzerindeki bir havan, patlayıcı bir yükü çok daha uzağa fırlatabilir, bu da geminin saldırı boyunca denizaltıyla sonar temasını sürdürmesine ve isabetliliğini önemli ölçüde artırmasına olanak tanır.\n\nBu modülü §YHafif Gemilere§! ve §YKruvazörlere§! monte etmek, düşman §YDenizaltılarına§! saldırmalarını sağlayacaktır."
 advanced_dp_light_battery:0 "Gelişmiş Çift Amaçlı Batarya"
 advanced_dp_light_battery_desc:0 "Otomatik Seri ateşli kapalı top kundakları, ateş gücünü büyük ölçüde artırır.\n\nBu modülü monte etmek, düşman §YPerdeleme Gemileriyle§! çatışmaya yardımcı olan §Y$EQUIPMENT_DESIGNER_LG_ATTACK_ICON_TOOLTIP$§! artırır. Bu modüller ayrıca §Y$EQUIPMENT_DESIGNER_ANTI_AIR_ATTACK_ICON_TOOLTIP$§! artırır.\nBir §Yİkincil Batarya§! Modülü monte etmek, bir §Y$ship_hull_cruiser$§!, §Y$ship_hull_carrier$§! veya §Y$ship_hull_heavy$§! gemisine az miktarda §Y$EQUIPMENT_DESIGNER_LG_ATTACK_ICON_TOOLTIP$§! verir ve ikinci bir hedefe saldırmasına olanak tanır."
 advanced_encryption:0 "Şifreleme - Darbe-Kod Modülasyonu"
 advanced_encryption_desc:0 "Teknolojik iyileştirmeler ve zor kazanılan deneyim, iletişimimizde daha fazla trafik akışı güvenlik önlemi uygulamamızı sağlar."
 advanced_equipment_conversion:0 "Yüksek Verimli Türbinler"
 advanced_equipment_conversion_desc:0 "Geliştirilmiş jeneratör tasarımlarını benimsemek, bunların çok daha yüksek basınç ve sıcaklıklarda çalışmasına olanak tanıyacak, böylece kömür santrallerimizin enerji verimliliğini büyük ölçüde artıracaktır."
 advanced_fire_control_system:0 "Gelişmiş Ateş Kontrol Sistemi"
 advanced_fire_control_system_desc:0 "Hem hedef hem de ateş eden gemi hakkında çok sayıda girdiyi ve hava koşulları ve deniz durumu gibi bilgileri izleyen büyük ve karmaşık bir mekanik bilgisayar, çok hassas balistik hesaplamalara olanak tanır."
 advanced_firebases:0 "Gelişmiş Ateş Destek Üsleri"
 advanced_firebases_desc:0 "Topçu kampları, ilerleyen kuvvetlere mümkün olan en fazla desteği vermek için cephe hatlarına yakın, tahkim edilmiş üslerde konumlandırılabilir."
 advanced_heavy_battery:0 "Gelişmiş Ağır Batarya"
 advanced_heavy_battery_desc:0 "Geliştirilmiş Geri Tepme Azaltma Mekanizmaları ve gecikme bobinleri, uçuş halindeki mermilerin parazitini azaltır ve isabeti önemli ölçüde artırır.\n\nBir §YAğır Batarya§! modülü monte etmek, bir geminin §YAğır Top Saldırısını§! artırır ve düşman §YAna Gemilerine§! karşı performansı geliştirir."
 advanced_infantry_weapons2:0 "Geliştirilmiş Piyade Teçhizatı III"
 advanced_infantry_weapons2_desc:0 "Piyade için kişisel ve mürettebat tarafından kullanılan silahların yanı sıra bir askerin ihtiyaç duyduğu diğer çeşitli teçhizatlar. Kişisel Taarruz Tüfekleri ve tanksavar roketlerini içerecek şekilde daha da Modernize edildi. Daha önce sınırlı bir ölçüde dağıtılan silahların geliştirilmiş mevcudiyeti."
 advanced_light_battery:0 "Gelişmiş Hafif Batarya"
 advanced_light_battery_desc:0 "Gelişmiş bir çift kundak, zırhlı koruma altında önemli ölçüde daha fazla ateş gücü sağlar.\n\nBu modülü monte etmek, düşman §YPerdeleme Gemileriyle§! çatışmaya yardımcı olan §YHafif Top Saldırısını§! artırır."
 advanced_machine_tools:0 "Gelişmiş Takım Tezgahları"
 advanced_machine_tools_desc:0 "Takım tezgahlarını servomekanizmalar kullanarak otomatikleştirmek daha önce tartışılmıştı. Bu fikirleri pratiğe dökmek, bilgisayarlar gibi otomasyondaki diğer ilerlemelerden yararlanmayı sağlar."
 advanced_medium_battery:0 "Gelişmiş Orta Batarya"
 advanced_medium_battery_desc:0 "Güçlü yükleme ve uzaktan güç kontrolünü entegre ederek, modern kruvazörler şimdiye kadar imkansız kabul edilen atış hızlarına ve isabet oranlarına ulaşabilir.\n\nBir §YHafif Orta Batarya§! modülü monte etmek, düşman §YPerdeleme Gemileriyle§! çatışmaya yardımcı olan §YHafif Top Saldırısını§! artırır. Bir §YOrta Batarya§! modülü monte etmek, düşman §YAna Gemileriyle§! çatışmaya yardımcı olan §YAğır Top Saldırısını§! artırır."
 advanced_naval_mines:0 "Akustik Mayın"
 advanced_naval_mines_desc:0 "Bu tür bir deniz mayını, sensörleri yakındaki bir geminin gürültüsünü tespit ettiğinde patlar."
 advanced_oil_processing:0 "Gelişmiş Petrol İşleme"
 advanced_oil_processing_desc:0 "Hidro-muamele gibi yeni deneysel saflaştırma teknikleri, nihai ürünü büyük ölçüde iyileştirmek için petrol imalatında kullanılabilir."
 advanced_radio:0 "Gelişmiş Radyo"
 advanced_radio_desc:0 "Radyo teknolojisindeki gelişmeler, radyoların menzilini artırdı ve hatta bazılarını taşınabilecek kadar küçülttü. Bazıları buna Telsiz diyor."
 advanced_rocket_engines:0 "Gelişmiş Roket Motorları"
 advanced_rocket_engines_desc:0 "Roketçiliğin geleceği, menzili çok az sınır tanıyan kıtalararası füzeler gibi olanaklar açarken, yükleri daha ölümcül hale geliyor."
 advanced_rubber_processing:0 "Gelişmiş Kauçuk İşleme"
 advanced_rubber_processing_desc:0 "Dodesil merkaptan polimerizasyon değiştiricileri gibi geliştirilmiş süreçlere sahip genel amaçlı bir sentetik kauçuk tarifi, sentetik kauçuk üretimini genişletmemizi sağlayacaktır."
 advanced_ship_torpedo_launcher:0 "Gelişmiş Gemi Torpido Kovanı"
 advanced_ship_torpedo_launcher_desc:0 "Daha büyük çaplı kovanlar, daha ağır savaş başlıklarına sahip daha büyük torpidolara olanak tanır.\n\nBu modülü §YHafif Gemilere§! veya §YKruvazörlere§! monte etmek, düşman §YAna Gemilerine§! önemli hasar vermelerini sağlar."
 advanced_sonar:0 "Gelişmiş Sonar"
 advanced_sonar_desc:0 "İnceltilmiş hidrofon dizileri ve aktif sonar sinyali teknikleri, düşman denizaltılarının doğruluğuna ve menziline önemli iyileştirmeler sunar. \n\nBu modülü §YHafif Gemiler§! veya §YKruvazörler§! üzerindeki bir §YElektronik Yuvasına§! monte etmek, düşman §YDenizaltılarını§! tespit etmelerine yardımcı olacaktır."
 advanced_special_forces:0 "Gelişmiş Özel Kuvvetler Eğitimi"
 advanced_special_forces_desc:0 "Kapsamlı eğitimle, özel kuvvetlerimizin normal insanların ötesinde performans göstereceğinden emin olacağız."
 advanced_submarine_warfare:0 "Gelişmiş Denizaltı Harbi"
 advanced_submarine_warfare_desc:0 "Denizaltılarımız arasındaki iletişimde büyük bir gelişme, saldırıları mükemmel bir şekilde zamanlamalarını sağlar. Bizi nihayet gördüklerinde, batan bir gemiden bakıyor olacaklar."
 aerial_hangars:0 "Hava Hangarları"
 aerial_hangars_desc:0 "Ana gemiye takılı Hava Hangarları, uçağın üzerine daha da fazla minyatür avcı uçağı sığdırmamızı sağlayarak artan ateş gücü ve daha fazla menzil sağlar."
 air_defence:0 "Hava Savunması"
 air_defence_desc:0 "Pilotlarımızı görünüşte tehlike olmadığında bile sürekli olarak tetikte olmaları için eğiterek, düşman uçaklarını önleme şansları artar."
 air_doctrine:0 "Hava Doktrini"
 air_doctrine_folder:0 "Hava Doktrini"
 air_doctrine_folder_desc:0 "Hava doktrini, Hava Kuvvetlerinin nasıl savaştığıdır."
 air_equipment:0 " Hava Teçhizatı"
 air_equipment_research:0 " Hava Araştırma Hızı"
 air_land_battle:0 "Hava-Kara Muharebesi"
 air_land_battle_desc:0 "Kara kuvvetleri zaten müşterek harekat oluşumlarında faaliyet gösterirken, Hava-Kara Muharebesi şimdi de kara kuvvetleri ve hava kuvvetleri arasında yakın koordinasyonu vurgulayarak Hava ve Kara savaş alanlarını sorunsuz bir bütün halinde birleştirir."
 air_offense:0 "Avcı Eskortları"
 air_offense_desc:0 "Gündüz bombardımanına odaklanırken, bombardıman uçaklarımızı önleyici avcılardan korumamız gerekiyor. Avcı pilotlarımızı bombardıman uçaklarıyla yakın çalışacak şekilde eğitmek, düşman hava sahasında bombardıman uçaklarını korurken savaş yeteneklerini artıracaktır."
 air_skirmish:0 "Hava Çatışması"
 air_skirmish_desc:0 "Ne yazık ki, ülkemiz üzerinde bulunan her düşman uçağını yok etmek her zaman mümkün değil, ancak tespit edildikleri andan ayrıldıkları ana kadar sürekli olarak onları taciz ederek yıpratmak mümkündür."
 air_superiority:0 " Hava Üstünlüğü"
 air_superiority_desc:0 "Hava Üstünlüğü sağlamak, düşman bombardıman uçaklarının ülkemize karşı kullanılmasını zorlaştıracak, bombardıman uçaklarımızın düşmanlarımıza karşı kullanılmasını sağlayacaktır."
 air_techs_folder:0 "Hava"
 air_techs_folder_desc:0 "Uçaklar ve varyantları."
 airdrop_mines:0 "Havadan Mayın Döşeme"
 airdrop_mines_bba:0 "$airdrop_mines$"
 airdrop_mines_bba_desc:0 "$airdrop_mines_desc$"
 airdrop_mines_desc:0 "Mayınları küçük bir paraşütle donatarak, uçaklardan güvenli bir şekilde bırakılabilirler, bu da hızlı ve verimli mayın tarlaları oluşturulmasını sağlar."
 airplane_launcher_advice_tt:0 "\nBir §YMancınık§! modülünü §YKruvazörlere§!, §YAğır Gemilere§! veya özel §YDenizaltılara§! monte etmek, düşman gemilerini tespit etme yeteneklerini geliştirir."
 airsweep_mines:0 "Havadan Mayın Temizleme"
 airsweep_mines_bba:0 "$airsweep_mines$"
 airsweep_mines_bba_desc:0 "$airsweep_mines_desc$"
 airsweep_mines_desc:0 "Uçaklar, deniz mayınlarını havadan tespit etmek ve güvenli bir şekilde patlatmak için özel ekipmanlarla donatılabilir."
 already_researching:0 "§GBu teknolojiyi zaten araştırıyorsunuz.§!"
 amphibious_mechanized_infantry:0 "Amfibi Traktörler"
 amphibious_mechanized_infantry_2:0 "Geliştirilmiş Amfibi Traktörler"
 amphibious_mechanized_infantry_2_desc:0 "Bu Amtraclar, sahilde daha kolay boşaltma için arka bir yükleme rampası gibi temel versiyona göre çeşitli iyileştirmeler içerir."
 amphibious_mechanized_infantry_desc:0 "Amfibi Traktörler veya Amtraclar, Deniz Piyadelerinin zırhlı koruma altında bir sahile çıkarılmasına olanak tanır. Ancak bu, düşük yakıt verimliliği pahasına gelir."
 amphibious_tank:0 "Amfibi Tank"
 amphibious_tank_2:0 "Geliştirilmiş Amfibi Tank"
 amphibious_tank_2_desc:0 "İkinci nesil amfibi tanklar, daha iyi koruma ve artırılmış ateş gücüne sahiptir."
 amphibious_tank_desc:0 "Amfibi Tanklar, bir sahil saldırısı sırasında Deniz Piyadelerine zırhlı ateş desteği vermek için tasarlanmıştır."
 antiair1:0 "Uçaksavar Yükseltmesi"
 antiair1_desc:0 "Daha hızlı yeniden doldurma mekanizmalarıyla, büyük mermiler taşıyan uçaksavar topları yine de gerekli atış hızlarını koruyabilir."
 antiair2:0 "Uçaksavar II"
 antiair2_desc:0 "Yüksekten uçan uçakları hedeflemek için, uçaksavar toplarında daha uzun kartuşlar ve namlular gerekecektir."
 antiair3:0 "Geliştirilmiş Uçaksavar Yükseltmesi I"
 antiair3_desc:0 "Radar sistemleri geliştikçe, uçaksavar toplarının radar yönlendirmesiyle kullanılması daha uygun hale geliyor. Bu teknolojiye ayak uydurmak, mevcut en isabetli uçaksavar sistemlerinden bazılarını yapmamızı sağlayacaktır."
 antiair4:0 "Geliştirilmiş Uçaksavar Yükseltmesi II"
 antiair4_desc:0 "Daha hızlı uçaklara karşı hızlı tepki vermek için modern radar, bilgisayarlaşma ve otomatik yükleyici sistemlerini birleştirmek gerekli olacaktır."
 antiair5:0 "Uçaksavar V"
 antiair5_desc:0 "Karadan havaya füzeler, uçaksavar savaşının geleceğidir. Bunlar için mobil bir platform geliştirmek bir sonraki hedefimiz olmalıdır."
 antitank1:0 "Tanksavar Yükseltmesi"
 antitank1_desc:0 "Etkili tanksavar silahlarının önemi Büyük Savaş'ta ortaya konmuştur. Modern tank tasarımlarıyla mücadele etmek için bu silahların yeni bir neslini tanıtmak gerekli olacaktır."
 antitank2:0 "Tanksavar II"
 antitank2_desc:0 "Şimdiye kadar çoğu tanksavar topu oldukça hafifti. Eğimli zırha sahip daha ağır tanklarla mücadele etmek için daha büyük kalibreli toplar gerekecektir."
 antitank3:0 "Geliştirilmiş Tanksavar Yükseltmesi I"
 antitank3_desc:0 "HEAT (yüksek patlayıcılı tanksavar) mermileri, sınırlı namlu çıkış hızını telafi etmek için tanksavar topçusunda kullanılabilir."
 antitank4:0 "Geliştirilmiş Tanksavar Yükseltmesi II"
 antitank4_desc:0 "Zırh delici terk sabotlu mermiler kullanan yeni çok yönlü tanksavar topları, neredeyse her tankın zırhını delebilir."
 antitank5:0 "Tanksavar V"
 antitank5_desc:0 "Farklı türdeki yeni mühimmat teknolojisini daha yüksek namlu çıkış hızına sahip toplarla birleştirerek, düşmanlarımızın geliştirebileceği her türlü yeni zırha hazırlıklı olabiliriz."
 armor:0 " Zırhlı teknolojisi"
 armored_car1:0 "$gw_armored_car_equipment$"
 armored_car2:0 "$armored_car_equipment_1$"
 armored_car3:0 "$armored_car_equipment_2$"
 armored_operations:0 "Zırhlı Operasyonlar"
 armored_operations_desc:0 "Tanklar ve diğer zırhlı araçlar, piyadeyi savaş alanlarına ulaştırmak ve muharebede doğrudan destek sunmak için son derece kullanışlıdır."
 armored_spearhead:0 "Zırhlı Mızrakbaşı"
 armored_spearhead_desc:0 "Tankları tam potansiyelleriyle kullanmak için Piyadeyi desteklemeye bağlı kalamazlar. Bunun yerine, saldırıların öncülüğünü yapabilecek hızlı hareket eden, bağımsız birimler halinde oluşturulmalıdırlar.\n\n"
 armored_train:0 "$train_equipment_3$"
 armour_folder:0 "Zırhlı"
 armour_folder_desc:0 "Tanklar ve varyantları."
 artillery1:0 "Topçu I"
 artillery1_desc:0 "Daha modern malzemeler ve mekanizmalarla, Büyük Savaş'tan kalma obüsler ve sahra topları, modern savaş için yeniden hazneli hale getirilebilir ve modernize edilebilir."
 artillery2:0 "Geliştirilmiş Topçu Yükseltmesi I"
 artillery2_desc:0 "Eski parçaları yükseltmek bizi ancak bir yere kadar götürebilir. Yeni hidrolik geri tepme cihazlarından ve daha uzun namlulardan yararlanan yeni obüs tasarımlarına ihtiyaç duyulacaktır."
 artillery3:0 "Geliştirilmiş Topçu Yükseltmesi II"
 artillery3_desc:0 "Daha hafif kundaklarda daha ağır toplara olanak sağlamak için, obüs tasarımlarına namlu frenleri dahil edilebilir."
 artillery4:0 "Topçu IV"
 artillery4_desc:0 "Taşıma için parçalara ayrılabilecek hafif topçu geliştirmek, daha önce ulaşılması zor alanlara topçu desteği getirmeyi mümkün kılacaktır."
 artillery5:0 "Gelişmiş Topçu Yükseltmesi"
 artillery5_desc:0 "Daha alçak silüetlere sahip topçu tasarımlarının düşman tarafından hedef alınması daha zor olacaktır."
 artillery_folder:0 "Topçu"
 artillery_folder_desc:0 "Tümenler için Topçu, Tanksavar ve Uçaksavar silahları."
 assault_breakthrough:0 "Taarruz Yarığı"
 assault_breakthrough_desc:0 "Tüm cephe boyunca büyük bir saldırı başlatmak yerine, saldırıyı sadece bir veya birkaç düşman hattı noktasına yoğunlaştırmak ve orada bir yarık açmak çok daha etkili olabilir."
 assault_concentration:0 "Taarruz Yoğunlaşması"
 assault_concentration_desc:0 "Bir saldırıdan önce, öncü unsurlar dikkatlice hazırlanır ve ileri pozisyonlara yerleştirilir, bu da açılış anlarında maksimum kuvvetin uygulanabilmesini sağlar."
 assembly_line_production:0 "Montaj Hattı Üretimi"
 assembly_line_production_desc:0 "Zaten birçok endüstride kullanımda olan motorlu montaj hattı, benzeri görülmemiş bir üretim çığına izin vererek savaşın seyrini değiştirebilir."
 asw_tech:0 " Denizaltı Savunma Harbi Teknolojisi"
 atomic_research:0 "Atom Araştırması"
 atomic_research_desc:0 "Nükleer fisyonda, atomu bölmek muazzam miktarda enerji ve sınırsız yıkıcı yetenek sağlar."
 attritional_containment:0 "Yıpratıcı Kuşatma"
 attritional_containment_desc:0 "Bir düşman pozisyonunu ortadan kaldırmak için bir saldırı başlatamazsak, yine de kayıplara neden olacak ve düşmanın kendi saldırılarını başlatmasını önleyecek sürekli küçük saldırılara maruz bırakılmalıdır."
 backhand_blow:0 "Ters El Darbesi"
 backhand_blow_desc:0 "Her karış toprak için savaşmak yerine, düşman sızmalarından büyük ölçüde kaçınılır, ta ki kendilerini fazla açana kadar, bu noktada karşı saldırılarla kesilip yok edilebilirler."
 base_cost:0 "Temel Maliyet"
 base_strike:0 "Üs Saldırısı"
 base_strike_desc:0 "Düşmanın limanlarına saldırmak, filolarını yeniden inşa etme yeteneklerini felç edecektir. Bu, sırf sayıca üstünlükle denizlere hükmetmemizi sağlayacaktır.\n\n"
 base_strike_main:0 "Üs Saldırısı Doktrini"
 basic_battery:0 "Deniz Topçuluğu"
 basic_battery_desc:0 "Deniz toplarının eğitim ve yükseliş mekanikleri için temel tasarım."
 basic_carrier:0 "Temel Uçak Gemisi (Uçak Gemisi II)"
 basic_cruiser_armor_scheme:0 "Temel Kruvazör Zırh Düzeni"
 basic_cruiser_armor_scheme_desc:0 "Ana Gemilerde görülen kemer ve güverte zırhı arasındaki ayrımı kopyalayan ve şarapnellere ve küçük kalibreli toplara karşı bir miktar koruma sunan bir zırh düzeni.\n\nBu modülü §YKruvazörlere§! monte etmek, §Ydüşman hasarına dayanma§! yeteneklerini geliştirir, ancak aynı zamanda §Yhızlarını§! da §Razaltır§!."
 basic_decryption:0 "Şifre Çözme - Frekans Analizi"
 basic_decryption_desc:0 "Kriptanaliz giderek gelişmiş bir matematik bilimi haline geliyor. Kart katalogları gibi sistemler ve siklometreler gibi cihazlar gerekli çalışmalara yardımcı olabilir."
 basic_depth_charges:0 "Temel Derinlik Bombaları"
 basic_depth_charges_desc:0 "Basınca duyarlı bir tetikleyiciye sahip basit bir patlayıcı kap, önceden ayarlanmış bir derinliğe ulaştığında patlar.\n\nBu modülü §YHafif Gemilere§! ve §YKruvazörlere§! monte etmek, düşman §YDenizaltılarına§! saldırmalarını sağlayacaktır."
 basic_dp_light_battery:0 "Temel Çift Amaçlı Batarya"
 basic_dp_light_battery_desc:0 "Gemi karşıtı ve uçaksavar toplarını tek bir kundakta birleştirmek, daha fazla esneklik sağlar ve ağırlıktan tasarruf ettirir.\n\nBu modülü monte etmek, düşman §YPerdeleme Gemileriyle§! çatışmaya yardımcı olan §Y$EQUIPMENT_DESIGNER_LG_ATTACK_ICON_TOOLTIP$§! artırır. Bu modüller ayrıca §Y$EQUIPMENT_DESIGNER_ANTI_AIR_ATTACK_ICON_TOOLTIP$§! artırır.\nBir §Yİkincil Batarya§! Modülü monte etmek, bir §Y$ship_hull_cruiser$§!, §Y$ship_hull_carrier$§! veya §Y$ship_hull_heavy$§! gemisine az miktarda §Y$EQUIPMENT_DESIGNER_LG_ATTACK_ICON_TOOLTIP$§! verir ve ikinci bir hedefe saldırmasına olanak tanır."
 basic_dp_medium_battery:0 "Gelişmiş Orta Çift Amaçlı Batarya"
 basic_dp_medium_battery_desc:0 "Otomatik yüklemeli Seri ateşli Orta kapalı top Bataryaları, ateş gücünü büyük ölçüde artırır.\n\nBir §YHafif Orta Batarya§! modülü monte etmek, düşman §YPerdeleme Gemileriyle§! çatışmaya yardımcı olan §Y$EQUIPMENT_DESIGNER_LG_ATTACK_ICON_TOOLTIP$§! artırır. Bu modül ayrıca §Y$EQUIPMENT_DESIGNER_ANTI_AIR_ATTACK_ICON_TOOLTIP$§! artırır."
 basic_encryption:0 "Şifreleme - Çok Alfabeli Şifreler"
 basic_encryption_desc:0 "Yeni iletişim yöntemleriyle birlikte yeni ele geçirme riskleri de ortaya çıkıyor. Rotor şifre makineleri, hızlı ve karmaşık şifrelemeye olanak sağlamak için kullanılabilir."
 basic_fire_control_system:0 "Temel Ateş Kontrol Sistemi"
 basic_fire_control_system_desc:0 "Geminin toplarının tüm ateşi merkezi bir konumdan kontrol edilir, bu da daha sıkı bir atış grubu ve artan isabet sağlar."
 basic_fortification_tech:0 "Temel Tahkimat"
 basic_fortification_tech_desc:0 "Yapılarda daha güçlü malzemeler ve metal takviyeler kullanarak, çökmelerinden endişe etmeden daha büyük tahkimatlar inşa edebiliriz."
 basic_heavy_armor_scheme:0 "Eğimli Kemer Zırh Düzeni"
 basic_heavy_armor_scheme_desc:0 "Kemer zırhını bir açıyla yerleştirerek, aynı ağırlık ve kalınlıktaki zırhın delinmesi çok daha zor hale gelir.\n\nBu modülü §YAğır Gemilere§! monte etmek, §Ydüşman hasarına dayanma§! yeteneklerini geliştirir. §YZırhlılar§! ve §YMuharebe Kruvazörleri§!, farklı §YZırh Düzenleri§! ile tanımlanır."
 basic_heavy_battery:0 "Temel Ağır Batarya"
 basic_heavy_battery_desc:0 "Ağır zırh altında devasa topları barındıran devasa bir taret.\n\nBir §YAğır Batarya§! modülü monte etmek, bir geminin §YAğır Top Saldırısını§! artırır ve düşman §YAna Gemilerine§! karşı performansı geliştirir."
 basic_heavy_cruiser:0 "Temel Ağır Kruvazör (Ağır Kruvazör II)"
 basic_heavy_shell:0 "Zırh Delici Başlıklı Mermi"
 basic_heavy_shell_desc:0 "Bir balistik başlık takarak, mermiler zırh delme performanslarını korurken daha aerodinamik hale getirilebilir."
 basic_light_battery:0 "Temel Hafif Batarya"
 basic_light_battery_desc:0 "Daha küçük gemilerde kullanım için küçük kalibreli bir top için açık, motorlu bir kundak.\n\nBu modülü monte etmek, düşman §YPerdeleme Gemileriyle§! çatışmaya yardımcı olan §YHafif Top Saldırısını§! artırır."
 basic_light_shell:0 "Küçük Kalibreli Yarı Zırh Delici Mermi"
 basic_light_shell_desc:0 "Zırh delme performansı ile patlayıcı güç arasında bir uzlaşma olan bu mermi, hafif gemilerin zayıf zırhını deldikten sonra önemli ölçüde daha fazla hasar verir."
 basic_light_tank:0 "H. Tank I"
 basic_machine_tools:0 "Temel Takım Tezgahları"
 basic_machine_tools_desc:0 "Herhangi bir makine atölyesinde bulunan küçük ve çok yönlü tiplerden teknolojik sınırları zorlayan büyük ölçekli, gelişmiş modellere kadar çeşitli yeni geliştirilmiş freze makineleri askeri üretimde kullanılabilir."
 basic_medium_battery:0 "Temel Orta Batarya"
 basic_medium_battery_desc:0 "Kruvazörlerde kullanım için iki veya üç orta kalibreli topa sahip motorlu bir taret.\n\nBir §YHafif Orta Batarya§! modülü monte etmek, düşman §YPerdeleme Gemileriyle§! çatışmaya yardımcı olan §YHafif Top Saldırısını§! artırır. Bir §YOrta Batarya§! modülü monte etmek, düşman §YAna Gemileriyle§! çatışmaya yardımcı olan §YAğır Top Saldırısını§! artırır."
 basic_medium_shell:0 "Zırh Delici Başlıklı Orta Mermi"
 basic_medium_shell_desc:0 "Bir balistik başlık takarak, mermiler zırh delme performanslarını korurken daha aerodinamik hale getirilebilir."
 basic_naval_mines:0 "Temas Mayını"
 basic_naval_mines_desc:0 "Deniz tabanına demirlenmiş basit bir yüzen bomba. Mayın, bir gemiyle temas ettiğinde patlar."
 basic_secondary_battery:0 "Kazamat İkincil Batarya"
 basic_secondary_battery_desc:0 "Gövde boyunca açıklıklara yerleştirilen bu daha küçük toplar, gemiye daha küçük gemilere karşı bir miktar savunma sağlar, ancak sınırlı bir ateş alanına sahiptir.\n\nBir §Yİkincil Batarya§! Modülü monte etmek, bir §YKruvazöre§!, §YUçak Gemisine§! veya §YAğır Gemiye§! az miktarda §YHafif Top Saldırısı§! verir ve ikinci bir hedefe saldırmasına olanak tanır."
 basic_ship_hull_carrier:0 "1936 Uçak Gemisi Gövdesi"
 basic_ship_hull_cruiser:0 "1936 Kruvazör Gövdesi"
 basic_ship_hull_heavy:0 "1936 Ağır Gemi Gövdesi"
 basic_ship_hull_heavy_short:0 "1936 Ağır Gemi Gövdesi"
 basic_submarine_snorkel:0 "Temel Denizaltı Şnorkeli"
 basic_submarine_snorkel_desc:0 "Motor dairesinden kontrol kulesine uzanan basit bir hava borusu. Uzatıldığında, denizaltının motorlarını çalıştırmasına ve pillerini su altındayken şarj etmesine olanak tanır.\n\nBu modülü §YDenizaltılara§! monte etmek, §YGörünürlüklerini§! azaltarak tespit edilmelerini zorlaştırır."
 basic_torpedo:0 "Temel Torpido"
 basic_torpedo_desc:0 "Hedefe su hattının altından çarpana kadar önceden belirlenmiş bir rotada çalışan patlayıcı bir savaş başlığına sahip, kendi kendine hareket eden bir silah.\n\nBu modülü §YHafif Gemilere§! veya §YKruvazörlere§! monte etmek, düşman §YAna Gemilerine§! önemli hasar vermelerini sağlar."
 basic_train:0 "$train_equipment_1$"
 battlefield_destruction:0 "Savaş Alanı Yıkımı"
 battlefield_destruction_desc:0 "Hava kuvvetleri uzak düşman ülkelerine saldırabilirken, savaşlarda orduyu doğrudan desteklemede de büyük fayda sağlayabilir."
 battlefield_support:0 "Savaş Alanı Desteği"
 battlefield_support_desc:0 "Taktik bombardıman uçaklarının, kara kuvvetlerimizin savaşta olduğu yerlerin yakınındaki hedeflere saldırması zordur, çünkü seviyeli bombardıman dalma bombardımanından daha az isabetlidir, ancak daha fazla eğitim ve yer tabanlı gözlemcilerle etkileşim bu sorunların üstesinden gelmeye yardımcı olabilir."
 battlefield_support_tree:0 "Savaş Alanı Desteği Doktrini"
 battlefield_support_tree_research:0 "Savaş Alanı Desteği Doktrini"
 battlefleet_concentration:0 "Muharebe Filosu Konsantrasyonu"
 battlefleet_concentration_desc:0 "Bir düşman gemisi tespit edilir edilmez yakındaki gemileri çağırın. Koordineli odaklanmış ateş, düşman gemilerini hızla işe yaramaz hale getirir. Onları birer birer avlayın."
 battlefleet_concentration_ti:0 "Muharebe Filosu Konsantrasyonu"
 battlefleet_concentration_ti_desc:0 "Bir düşman gemisi tespit edilir edilmez yakındaki gemileri çağırın. Koordineli odaklanmış ateş, düşman gemilerini hızla işe yaramaz hale getirir. Onları birer birer avlayın."
 bb_tech:0 " Zırhlı modelleri"
 bc_tech:0 " Muharebe Kruvazörü modelleri"
 bicycle_infantry:0 "Bisikletli Piyade"
 bicycle_infantry_desc:0 "Bisikletli normal piyade, yürüyen emsallerinden çok mütevazı bir fiyata daha hareketlidir."
 blackshirt_assault_battalion_tech:0 "$blackshirt_assault_battalion$"
 blitzkrieg:0 "Blitzkrieg"
 blitzkrieg_desc:0 "Blitzkrieg, Mobil Piyade ve hava desteği ile desteklenen hızlı hareket eden Zırhlı kuvvetlerin düşman hatlarını yarmak, onları düzensiz hale getirmek ve kuşatmak stratejisini ifade eder."
 bomber_ace_initiative:0 "Bombardıman Uçağı Ası Girişimi"
 bomber_ace_initiative_desc:0 "As bombardıman pilotlarını resmi olarak tanımak ve ödüllendirmek, cüretkarlığı ve inisiyatifi teşvik eder."
 bomber_veteran_initiative:0 "Bombardıman Uçağı Gazisi Girişimi"
 bomber_veteran_initiative_desc:0 "Gazi pilotların bilgilerini yeni acemilere aktarmasını sağlayan bir politika, hayatta kalma beklentilerini büyük ölçüde artırır."
 branch_interoperation:0 "Branşlar Arası İşbirliği"
 branch_interoperation_desc:0 "Silahlı kuvvetlerin farklı branşları arasındaki artan koordinasyon, onların müşterek harekat operasyonlarında daha iyi çalışmalarını sağlar."
 breakthrough_priority:0 "Yarma Önceliği"
 breakthrough_priority_desc:0 "Operasyonel Yoğunlaşmayı genişleterek, cephenin tüm ihtiyaçları, Yarımlar için kuvvetleri yoğunlaştırma ihtiyacına tabi kılınır. Yerel yenilgiler, belirleyici bir darbe vurmaya kıyasla önemsizdir."
 c3i_theory:0 "C3I"
 c3i_theory_desc:0 "Etkili kurmay subaylar, bir komutan ile kontrol ettiği birimler arasında Komuta, Kontrol, İletişim ve İstihbarat akışını sağlar."
 ca_tech:0 " Kruvazör modelleri"
 camicie_nere_security_militias:0 "$ITA_camicie_nere$"
 capital_ship_raiders:0 "Ana Gemi Akıncıları"
 capital_ship_raiders_desc:0 "En güçlü gemilerimiz ticaret konvoylarını avlarken, düşman artık sayıca çok olmakta güvenlik bulamayacak. Onlar, bizi bulmamamız için dua eden oturan ördeklerdir."
 carousel_bombing:0 "Atlıkarınca Bombardımanı"
 carousel_bombing_desc:0 "Bombardıman uçakları genellikle hedef alanlarına ulaşır ulaşmaz tüm bombalarını atmak ve sonra mümkün olan en kısa sürede eve uçmak isterler. Bu alan bombardımanı için işe yarasa da, küçük bir hedefi vurmak söz konusu olduğunda, maksimum isabet için hedefin üzerinde oyalanmak ve bomba yüklerinin sadece bir kısmını bir seferde bırakmak daha etkilidir."
 carrier_battlegroups:0 "Uçak Gemisi Muharebe Grupları"
 carrier_battlegroups_desc:0 "Uçak gemileri, düşmanı her türlü deniz topundan daha uzak mesafeden vurma yeteneğine sahiptir ve gökyüzündeki gözlerimiz sayesinde asla hazırlıksız yakalanmayacağız. Toplu haldeki uçak gemileri, hafife alınmaması gereken bir güçtür."
 carrier_operations:0 "Uçak Gemisi Operasyonları"
 carrier_operations_desc:0 "Uçak gemileri, pilotlarımızın karadaki hava üslerimizden daha hızlı ve daha kolay bir şekilde denizde saldırmalarını sağlayacaktır. Onlar tepki vermeye zaman bulamadan saldıracağız."
 carrier_primacy:0 "Uçak Gemisi Önceliği"
 carrier_primacy_desc:0 "Modern uçaklar, sıradan deniz toplarından daha fazla menzile ve hassasiyete sahiptir. Uçak gemilerini filomuza entegre edin ve denizlere gökyüzünden hükmedin."
 carrier_task_forces:0 "Uçak Gemisi Görev Güçleri"
 carrier_task_forces_desc:0 "Uçak gemileri ve hafif kruvazörlerle organize edilmiş görev güçleri, düşmanın bizi asla hazırlıksız yakalayamamasını sağlar."
 cas_ace_initiative:0 "Kara Saldırı Ası Girişimi"
 cas_ace_initiative_desc:0 "As Yakın Hava Desteği pilotlarını resmi olarak tanımak ve ödüllendirmek, cüretkarlığı ve inisiyatifi teşvik eder."
