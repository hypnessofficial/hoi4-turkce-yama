 advanced_cruiser_armor_scheme_desc:0 "Bu düzen, geminin sadece en hayati bölgelerini korumaya odaklanırken, önemsiz kısımları göz ardı eder.\n\nBu modülü §YKruvazörlere§! monte etmek, §Ydüşman hasarına dayanma§! yeteneklerini geliştirir, ancak aynı zamanda §Yhızlarını§! da §Razaltır§!."
