 big_ship_deck_space:0 "Yüzen Havaalanı Pisti"
 big_ship_deck_space_desc:0 "Uçakların bakımını, yakıt ikmalini ve ikmalini yapmaya ve onları görevlerine hazırlamaya olanak tanıyan açık alan. Uçak gemisi olmayan uçak varyantlarını depolamaya ve kullanmaya olanak tanır."
 carrier_ship_engine_1:0 "50,000 Bg Motor"
 carrier_ship_engine_1_desc:0 "Temel bir motor seti, orta büyüklükte bir uçak gemisinin uçakların güvenli çalışması için gerekli hızlara ulaşmasını sağlar."
 carrier_ship_engine_1_short:0 "Uçak Gemisi Motoru I"
 carrier_ship_engine_2:0 "120,000 Bg Motor"
 carrier_ship_engine_2_desc:0 "Bu yeni güç ünitesi, bir uçak gemisinin çoğu eski kruvazörü ve bazı muhripleri geride bırakmasını sağlayarak düşman su üstü kuvvetlerinden kaçmasına olanak tanımak için tasarlanmıştır."
 carrier_ship_engine_2_short:0 "Uçak Gemisi Motoru II"
 carrier_ship_engine_3:0 "150,000 Bg Motor"
 carrier_ship_engine_3_desc:0 "Büyük uçak gemilerinin bile çok yüksek hızlarda hareket etmesini sağlamak için tasarlanmış bir motor."
 carrier_ship_engine_3_short:0 "Uçak Gemisi Motoru III"
 carrier_ship_engine_4:0 "210,000 Bg Motor"
 carrier_ship_engine_4_desc:0 "Bu güç ünitesi, bir uçak gemisi grubunun merkez parçası olarak işlev görmesi amaçlanan modern bir 'hızlı uçak gemisi' donatmak için tasarlanmıştır."
 carrier_ship_engine_4_short:0 "Uçak Gemisi Motoru IV"
 carrier_ship_nuclear_engine_1:0 "Nükleer Uçak Gemisi Reaktörü"
 carrier_ship_nuclear_engine_1_desc:0 "Devasa uçak gemilerini yeniden yakıt ikmaline ihtiyaç duymadan çalıştırabilen güçlü bir nükleer reaktör."
 carrier_ship_nuclear_engine_1_short:0 "Uçak Gemisi Reaktörü"
 cruiser_ship_engine_1:0 "60,000 Bg Motor"
 cruiser_ship_engine_1_desc:0 "Dişlisiz bir türbine buhar sağlayan temel bir kazan seti."
 cruiser_ship_engine_1_short:0 "Kruvazör Motoru I"
 cruiser_ship_engine_2:0 "70,000 Bg Motor"
 cruiser_ship_engine_2_desc:0 "Dişli ile donatılmış bir buhar türbini önemli ölçüde daha verimlidir, bu da ek ağırlığın ek güç için kullanılmasına olanak tanır."
 cruiser_ship_engine_2_short:0 "Kruvazör Motoru II"
 cruiser_ship_engine_3:0 "80,000 Bg Motor"
 cruiser_ship_engine_3_desc:0 "Geliştirilmiş kazan düzenlemeleri, daha fazla güç için daha yüksek buhar basıncı sağlar."
 cruiser_ship_engine_3_short:0 "Kruvazör Motoru III"
 cruiser_ship_engine_4:0 "90,000 Bg Motor"
 cruiser_ship_engine_4_desc:0 "Gelişmiş malzemeler, bu motorun yüksek yükte çok daha uzun süre çalışmasını sağlar."
 cruiser_ship_engine_4_short:0 "Kruvazör Motoru IV"
 cruiser_submarine_specialization:0 "Uzun Menzilli Avcılar"
 cruiser_submarine_specialization_desc:0 "Kruvazör Denizaltılar, ağır su altı akıncılığının zirvesini temsil eder. Manevra kabiliyeti ve gizlilik konusundaki eksikliklerini, menzilleriyle kesinlikle telafi ederler."
 dp_light_battery_1:0 "100mm Çift Amaçlı Batarya"
 dp_light_battery_1_desc:0 "Özel bir kundakta bulunan, hem uçaklara hem de su üstü hedeflerine saldırmasına olanak tanıyan küçük bir top."
 dp_light_battery_1_short:0 "Çift Amaçlı Ana Batarya I"
 dp_light_battery_2:0 "113mm Çift Amaçlı Batarya"
 dp_light_battery_2_desc:0 "Yüksek açılı kundağa ve top kalkanına sahip, yüzey hedeflerinin yanı sıra uçaklara da angaje olmasını sağlayan küçük bir top."
 dp_light_battery_2_short:0 "Çift Amaçlı Ana Batarya II"
 dp_light_battery_3:0 "127mm Çift Amaçlı Batarya"
 dp_light_battery_3_desc:0 "Yüksek açılı kapalı bir taret içinde, yüzey hedeflerinin yanı sıra uçaklara da angaje olmasını sağlayan küçük bir top."
 dp_light_battery_3_short:0 "Çift Amaçlı Ana Batarya III"
 dp_light_battery_4:0 "127mm SA. Çift Amaçlı Batarya"
 dp_light_battery_4_desc:0 "Yüksek açılı motorlu bir taret içinde, yüzey hedeflerinin yanı sıra uçaklara da angaje olmasını sağlayan küçük, seri ateşli bir top."
 dp_light_battery_4_short:0 "Çift Amaçlı Ana Batarya IV"
 dp_ship_medium_1:0 "152mm SA. Çift Amaçlı Batarya"
 dp_ship_medium_1_desc:0 "Yüksek bir atış açısı için sıfırdan tasarlanan bu kundak, hafif kruvazörlerin daha büyük Gemilere ve Uçaklara bile saldırmasına olanak sağlamak için yaratılmıştır."
 dp_ship_medium_1_short:0 "Hafif Kruvazör Bataryası IV"
 dp_ship_secondaries_1:0 "100mm Çift Amaçlı İkincil Batarya"
 dp_ship_secondaries_1_desc:0 "Ağır uçaksavar topunun ve ikincil bataryanın görevlerini birleştirerek, bu kundak bir geminin uçaksavar yeteneklerini önemli ölçüde artırırken aynı zamanda daha küçük su üstü hedeflerine karşı bir miktar savunma sağlar."
 dp_ship_secondaries_1_short:0 "Çift Amaçlı İkincil Batarya I"
 dp_ship_secondaries_2:0 "113mm Çift Amaçlı İkincil Batarya"
 dp_ship_secondaries_2_desc:0 "Çift amaçlı ikincil topları bir tarette barındırmak, mürettebat korumasını büyük ölçüde artırır."
 dp_ship_secondaries_2_short:0 "Çift Amaçlı İkincil Batarya II"
 dp_ship_secondaries_3:0 "127mm Çift Amaçlı İkincil Batarya"
 dp_ship_secondaries_3_desc:0 "Motorlu çift çift amaçlı taretler, ateş gücünde büyük bir artışa olanak tanır."
 dp_ship_secondaries_3_short:0 "Çift Amaçlı İkincil Batarya III"
 dp_ship_secondaries_4:0 "127mm SA. Çift Amaçlı İkincil Batarya"
 dp_ship_secondaries_4_desc:0 "Her türlü hedefe karşı seri ateş için yaratılan bu silahlar, nihai ikincil silahlardır."
 dp_ship_secondaries_4_short:0 "Çift Amaçlı İkincil Batarya IV"
 fixed_ship_torpedo_slot:0 "Torpidolar"
 heavy_ship_engine_1:0 "30,000 Bg Motor"
 heavy_ship_engine_1_desc:0 "Toplar ve zırh için ağırlık boşaltmak amacıyla tasarlanan bu motor, hiçbir zaman özellikle yüksek hız vermek için tasarlanmamıştır."
 heavy_ship_engine_1_short:0 "Ağır Motor I"
 heavy_ship_engine_2:0 "90,000 Bg Motor"
 heavy_ship_engine_2_desc:0 "Önceki tasarımlardan önemli ölçüde daha güçlü olan bu motor, ağır bir gemiye eski modellere göre rahat bir hız marjı vermek için tasarlanmıştır."
 heavy_ship_engine_2_short:0 "Ağır Motor II"
 heavy_ship_engine_3:0 "150,000 Bg Motor"
 heavy_ship_engine_3_desc:0 "Toplar ve zırh ağırlık olarak büyüdükçe, bu motor kaçan düşmanları kovalamak veya üstün düşmanlara karşı menzili açık tutmak için daha yüksek hızlara izin vermek üzere tasarlanmıştır."
 heavy_ship_engine_3_short:0 "Ağır Motor III"
 heavy_ship_engine_4:0 "210,000 Bg Motor"
 heavy_ship_engine_4_desc:0 "Yeni malzemeler ve geliştirilmiş kazan tasarımıyla tasarlanan bu güç ünitesi, modern bir zırhlının hızlı uçak gemilerine ve kruvazörlere ayak uydurmasını sağlamak için tasarlanmıştır."
 heavy_ship_engine_4_short:0 "Ağır Motor IV"
 heavy_ship_nuclear_engine_1:0 "Nükleer Ağır Gemi Reaktörü"
 heavy_ship_nuclear_engine_1_desc:0 "Yeniden yakıt ikmaline ihtiyaç duymadan en ağır gemileri bile çalıştırabilen güçlü bir nükleer reaktör."
 heavy_ship_nuclear_engine_1_short:0 "Ağır Gemi Reaktörü"
 light_ship_engine_1:0 "35,000 Bg Motor"
 light_ship_engine_1_desc:0 "Küçük bir buhar türbini seti, küçük bir gemiyi büyük bir hızla itebilir veya daha büyük bir gemiyi daha yavaş hızlarda çalıştırabilir."
 light_ship_engine_1_short:0 "Hafif Motor I"
 light_ship_engine_2:0 "40,000 Bg Motor"
 light_ship_engine_2_desc:0 "Yüksek basınçlı kazanlar kullanarak, aynı ağırlık ve makine alanı daha yüksek bir çıktı üretebilir."
 light_ship_engine_2_short:0 "Hafif Motor II"
 light_ship_engine_3:0 "45,000 Bg Motor"
 light_ship_engine_3_desc:0 "Malzemelerdeki yeni gelişmeler, çok daha yüksek buhar basıncına ve dolayısıyla daha fazla güç çıkışına olanak tanır."
 light_ship_engine_3_short:0 "Hafif Motor III"
 light_ship_engine_4:0 "50,000 Bg Motor"
 light_ship_engine_4_desc:0 "Geliştirilmiş motor düzenleri ve türbin dişlileri, aynı ağırlık miktarı için daha yüksek verimlilik sağlar."
 light_ship_engine_4_short:0 "Hafif Motor IV"
 midget_submarine_specialization:0 "Cep Denizaltısı Öncüleri"
 midget_submarine_specialization_desc:0 "Liman akıncılığı veya hafif konvoy akıncılığı için tasarlanmış küçük denizaltılar, deniz doktrinimize mükemmel bir şekilde uyar."
 ship_airplane_launcher_1:0 "Deniz Uçağı Mancınığı"
 ship_airplane_launcher_1_desc:0 "Basit bir uçak fırlatıcı, küçük bir keşif uçağını havaya fırlatır."
 ship_airplane_launcher_2:0 "Geliştirilmiş Deniz Uçağı Mancınığı"
 ship_airplane_launcher_2_desc:0 "Geminin daha büyük menzilli ve hızlı bir uçağı fırlatmasına olanak tanıyan geliştirilmiş bir fırlatma mekanizması."
 ship_anechoic_tile:0 "Anekoik Karolar"
 ship_anechoic_tile_desc:0 "Geminin hem pasif hem de aktif sonar tarafından tespit edilebileceği menzili azaltmak için tasarlanmış kauçuk karo kaplama."
 ship_anti_air_1:0 ".50 kal. MG"
 ship_anti_air_1_desc:0 "Bir dizi ağır makineli tüfek, uçaklara karşı az miktarda yakın savunma sağlar."
 ship_anti_air_1_short:0 "Uçaksavar I"
 ship_anti_air_2:0 "20mm Uçaksavar"
 ship_anti_air_2_desc:0 "Küçük bir otomatik top, önemli ölçüde daha büyük bir mermi atarak saldıran bir uçağı birkaç vuruşta öldürür."
 ship_anti_air_2_short:0 "Uçaksavar II"
 ship_anti_air_3:0 "37mm Uçaksavar"
 ship_anti_air_3_desc:0 "Önceki kalibre topların, saldıran bir uçağı mühimmatını bırakmadan önce güvenilir bir şekilde öldürmek için çok hafif olduğu kanıtlanmıştır. Daha büyük bir mermi daha büyük bir top gerektirir, ancak gerçekten vurduklarında hedefi yok etme şansı önemli ölçüde daha yüksektir."
 ship_anti_air_3_short:0 "Uçaksavar III"
 ship_anti_air_4:0 "40mm Dörtlü Uçaksavar"
 ship_anti_air_4_desc:0 "En son model uçaksavar topları, hızlı uçan hedefleri takip edebilmek için motorlu bir kundağa ve tek bir hedefe karşı birkaç top pozisyonunun ateşini koordine etmek için gelişmiş bir direktör sistemine sahiptir."
 ship_anti_air_4_short:0 "Uçaksavar IV"
 ship_armor_bb_1:0 "200mm Kemer/40mm Güverte"
 ship_armor_bb_1_desc:0 "Bir gemiyi kendi kalibresindeki toplara karşı korumak için tasarlanan bu zırh düzeni, geminin her parçasının kullanışlılığına göre iyi korunmasını sağlar."
 ship_armor_bb_1_short:0 "Zırhlı Zırhı I"
 ship_armor_bb_2:0 "350mm Kemer/150mm Güverte"
 ship_armor_bb_2_desc:0 "Eğimli bir kemere sahip olan bu zırh düzeni, bir ana muharebe gemisini kendi kalibresindeki toplara karşı korumak için tasarlanmıştır."
 ship_armor_bb_2_short:0 "Zırhlı Zırhı II"
 ship_armor_bb_3:0 "380mm Kemer/155mm Güverte"
 ship_armor_bb_3_desc:0 "Önceki zırh düzenlerinden radikal bir sapma olan bu tasarım, geminin merkezinde ağır zırhlı bir kale oluşturur ancak geminin diğer kısımları için korumadan feragat eder. Bir gemiyi kendi kalibresindeki toplara karşı savunmak için tasarlanmıştır."
 ship_armor_bb_3_short:0 "Zırhlı Zırhı III"
 ship_armor_bc_1:0 "150mm Kemer/25mm Güverte"
 ship_armor_bc_1_desc:0 "Gemiyi daha küçük toplara karşı korumak için tasarlanan bu zırh düzeni, daha yüksek hıza izin vermek için çok daha az ağırlığa sahiptir."
 ship_armor_bc_1_short:0 "Muharebe Kruvazörü Zırhı I"
 ship_armor_bc_2:0 "305mm Kemer/100mm Güverte"
 ship_armor_bc_2_desc:0 "Hız ve koruma arasında bir uzlaşma olan bu zırh düzeni, bir gemiyi kruvazörlerin ve muhriplerin toplarına karşı savunmak için tasarlanmıştır."
 ship_armor_bc_2_short:0 "Muharebe Kruvazörü Zırhı II"
 ship_armor_bc_3:0 "330mm Kemer/130mm Güverte"
 ship_armor_bc_3_desc:0 "Ağırlık sınırlamaları göz önünde bulundurularak tasarlanan bu zırh düzeni, diğer alanları açıkta bırakarak bir geminin hayati kısımları için korumayı en üst düzeye çıkarmaya çalışır. Bu düzenin zırhlı sınıfı silahlara uzun süre dayanması beklenmez."
 ship_armor_bc_3_short:0 "Muharebe Kruvazörü Zırhı III"
 ship_armor_carrier_deck:0 "90mm Güverte"
 ship_armor_carrier_deck_desc:0 "Ağır zırh plakaları, daha az çalışma alanı pahasına hangar boşluklarını düşman bombardıman uçaklarının isabetlerine karşı korur."
 ship_armor_carrier_deck_short:0 "Uçuş Güvertesi Zırhı"
 ship_armor_cruiser_1:0 "50mm Kemer/40mm Güverte"
 ship_armor_cruiser_1_desc:0 "Bir kruvazöre muhripler ve diğer hafif silahlı gemilerle savaşırken hafif bir avantaj sağlamak için tasarlanmış bir zırh düzeni."
 ship_armor_cruiser_1_short:0 "Kruvazör Zırhı I"
 ship_armor_cruiser_2:0 "100mm Kemer/30mm Güverte"
 ship_armor_cruiser_2_desc:0 "Bir kruvazörün eski hafif kruvazörler ve daha küçük gemilerle iyi bir koruma ile çatışmaya girmesini sağlamak için tasarlanmış daha ağır bir kemer."
 ship_armor_cruiser_2_short:0 "Kruvazör Zırhı II"
 ship_armor_cruiser_3:0 "120mm Kemer/50mm Güverte"
 ship_armor_cruiser_3_desc:0 "Zırhlıları zırhlamak için kullanılan yöntemleri kopyalayan bu zırh düzeni, dünya çapındaki silah gelişmelerine ayak uydurmak için tasarlanmıştır."
 ship_armor_cruiser_3_short:0 "Kruvazör Zırhı III"
 ship_armor_cruiser_4:0 "150mm Kemer/60mm Güverte"
 ship_armor_cruiser_4_desc:0 "Bu zırh düzeni, diğer tüm alanların pahasına, bir gemiyi su üstünde ve savaşta tutmak için kesinlikle gerekli olan alanlar üzerinde korumayı en üst düzeye çıkarmaya çalışır."
 ship_armor_cruiser_4_short:0 "Kruvazör Zırhı IV"
 ship_armor_ice_carrier_deck_1:0 "Paykrit Pist Güçlendirmeleri"
 ship_armor_ice_carrier_deck_1_desc:0 "Daha güçlü ve daha dayanıklı bir yapı sağlayan ek inşaat takviyeleri, aynı zamanda elementlere karşı daha iyi direnç sunar."
 ship_armor_ice_carrier_deck_2:0 "Çelik Takviyeli Paykrit Pist"
 ship_armor_ice_carrier_deck_2_desc:0 "Çelik Takviyeli Paykrit, daha fazla hasara dayanabilen daha sağlam bir yapı sağlarken, daha iyi yalıtım sunar."
 ship_armor_ice_carrier_deck_3:0 "Buz-Kompozit Pist"
 ship_armor_ice_carrier_deck_3_desc:0 "Kullanılan malzemeler ve yöntemler, en iyi yapı direncini sunar ve hava koşullarının gemi operasyonları üzerindeki etkisini azaltır."
 ship_armor_shbb:0 "450mm Kemer/210mm Güverte"
 ship_armor_shbb_desc:0 "Zırh tasarımındaki son söz olan bu zırh düzeni, bilinen tüm ana batarya mermilerini yenmek için tasarlanmıştır, bu da böyle donatılmış bir geminin dünyadaki diğer herhangi bir zırhlıyı vurup batırmasına olanak tanır."
 ship_armor_shbb_short:0 "Süper Ağır Zırh"
 ship_deck_space:0 "Hangar Alanı"
 ship_deck_space_desc:0 "Geminin içinde tekerlekli uçakların bakımını ve silahlandırılmasını sağlayan geniş bir açık alan. Bir gemiye daha fazla hangar alanı eklemek maliyeti önemli ölçüde artırır."
 ship_depth_charge_1:0 "Derinlik Bombası Rayları"
 ship_depth_charge_1_desc:0 "Basit bir ray seti, gemi batık hedefin üzerinden geçerken derinlik bombalarının geminin kıçından yuvarlanmasını sağlar."
 ship_depth_charge_1_short:0 "Derinlik Bombası I"
 ship_depth_charge_2:0 "Derinlik Bombası Fırlatıcı"
 ship_depth_charge_2_desc:0 "Küçük bir patlayıcı şarj kullanarak, bu cihaz bir derinlik bombasını oldukça uzağa fırlatır, bu da tek bir geminin daha geniş bir alana bir derinlik bombası paterni bırakmasını sağlar."
 ship_depth_charge_2_short:0 "Derinlik Bombası II"
 ship_depth_charge_3:0 "Denizaltı Savunma Havanı"
 ship_depth_charge_3_desc:0 "Temas tapalı daha küçük bir derinlik bombası için bir projektör, geminin sonar temasını kesmeden bir hedefe saldırmasına olanak tanır."
 ship_depth_charge_3_short:0 "Derinlik Bombası III"
 ship_depth_charge_4:0 "Gelişmiş Denizaltı Savunma Havanı"
 ship_depth_charge_4_desc:0 "Önceki modelin bir evrimi olan bu havan, önemli ölçüde daha büyük bir şarjı daha uzun bir mesafeye ateşleyebilir."
 ship_depth_charge_4_short:0 "Derinlik Bombası IV"
 ship_engine_sub_aip_1:0 "Havadan Bağımsız İtki"
 ship_engine_sub_aip_1_desc:0 "Yeni motor tiplerinin ilk yinelemesi, denizaltının su altında daha uzun süre operasyonel kalmasını sağlar, ancak bu, büyük ölçüde artan yakıt tüketimi ve azalan gemi menzili pahasına olur."
 ship_engine_sub_aip_2:0 "HBT-Dizel Kombinasyon Motoru"
 ship_engine_sub_aip_2_desc:0 "Havadan bağımsız itki sistemlerinin yeni versiyonu, daha düşük yakıt tüketiminde daha iyi performans sunar."
 ship_engine_sub_aip_3:0 "Yüksek Hızlı Walter Motorları"
 ship_engine_sub_aip_3_desc:0 "HBT Motorları ile elde edilebileceğini düşündüğümüz zirveye ulaştık. Bu motor, aynı zamanda yakıt tüketimini kabul edilebilir seviyelerde tutarken mükemmel hız sunar."
 ship_escort_deck_space:0 "Refakatçi Gemisi Hangar Alanı"
 ship_escort_deck_space_desc:0 "Tekerlekli uçakların bakımının yapılmasına ve silahlandırılmasına izin veren geminin içindeki açık alan. Uçak Gemilerindeki hangarlardan çok daha küçük ve sıkışıktır."
 ship_extra_fuel_tank:0 "Ek Yakıt Tankları"
 ship_extra_fuel_tank_desc:0 "Genişletilmiş yakıt depolaması daha fazla operasyonel menzil sağlar."
 ship_fire_control_system_0:0 "Merkezi Mesafe Ölçümü"
 ship_fire_control_system_0_desc:0 "Geminin direğinde yüksekte bulunan merkezi bir istasyon, hedefe olan mesafeyi belirler ve bu bilgiyi top kundaklarına iletir."
 ship_fire_control_system_0_short:0 "Ateş Kontrol 0"
 ship_fire_control_system_1:0 "Direktör Ateşi"
 ship_fire_control_system_1_desc:0 "Merkezi bir direktör istasyonu, topçu subayının komutuyla tüm topları aynı anda ateşler."
 ship_fire_control_system_1_short:0 "Ateş Kontrol I"
 ship_fire_control_system_2:0 "Mekanik Mesafe Koruyucu"
 ship_fire_control_system_2_desc:0 "Gemideki mekanik bir bilgisayar, mesafe ölçerlerden ve diğer sensörlerden gelen bilgilere göre hedefe olan menzili ve kerterizi sürekli olarak günceller."
 ship_fire_control_system_2_short:0 "Ateş Kontrol II"
 ship_fire_control_system_3:0 "Balistik Bilgisayar"
 ship_fire_control_system_3_desc:0 "Daha karmaşık bir mekanik bilgisayar, hedefi vurmak için balistik çözümleri hesaplarken çok çeşitli faktörleri dikkate alır."
 ship_fire_control_system_3_short:0 "Ateş Kontrol III"
 ship_heavy_battery_1:0 "28 cm Top"
 ship_heavy_battery_1_desc:0 "Büyük Savaş'tan kalma büyük kalibreli bir top."
 ship_heavy_battery_1_short:0 "Ağır Batarya I"
 ship_heavy_battery_2:0 "30.5 cm Top"
 ship_heavy_battery_2_desc:0 "Ağır zırhlı bir kundakta bir dizi büyük kalibreli top. Taretin yeniden tasarımı daha yüksek top yükselişine izin vererek menzili artırır."
 ship_heavy_battery_2_short:0 "Ağır Batarya II"
 ship_heavy_battery_3:0 "38 cm Top"
 ship_heavy_battery_3_desc:0 "Hassasiyeti ve atış hızını artırmak için bir dizi yeni teknolojiyi içeren, ağır toplar için ağır zırhlı bir kundak."
 ship_heavy_battery_3_short:0 "Ağır Batarya III"
 ship_heavy_battery_4:0 "40.6 cm Top"
 ship_heavy_battery_4_desc:0 "Ağır ateş gücünün nihai evrimi olan bu ağır zırhlı kundak, uzun mesafelerde yüksek derecede hassasiyet sağlar."
 ship_heavy_battery_4_short:0 "Ağır Batarya IV"
 ship_light_battery_1:0 "85 mm SA. Top"
 ship_light_battery_1_desc:0 "Muhriplerde ve daha küçük gemilerde kullanım için görece küçük bir top."
 ship_light_battery_1_short:0 "Hafif Batarya I"
 ship_light_battery_2:0 "105 mm SA. Top"
 ship_light_battery_2_desc:0 "Hedefleri hızlı bir şekilde takip etmesini sağlayan motorlu kundağa sahip küçük bir top."
 ship_light_battery_2_short:0 "Hafif Batarya II"
 ship_light_battery_3:0 "127 mm SA. Top"
 ship_light_battery_3_desc:0 "Mürettebatı şarapnel parçalarından ve sert hava koşullarından korumak için bir top kalkanına sahip küçük bir top."
 ship_light_battery_3_short:0 "Hafif Batarya III"
 ship_light_battery_4:0 "130 mm SA. Top"
 ship_light_battery_4_desc:0 "Motorlu, zırhlı bir kundakta bir çift küçük top."
 ship_light_battery_4_short:0 "Hafif Batarya IV"
 ship_light_battery_sub:0 "200mm Batarya"
 ship_light_battery_sub_desc:0 "Daha çok hafif kruvazörlerde bulunan bir kalibreye sahip müthiş bir güverte topu."
 ship_light_medium_battery_1:0 "14.5 cm Top"
 ship_light_medium_battery_1_desc:0 "Atış hızı ve mermi ağırlığı arasında bir uzlaşma olan bu top, hafif kruvazörlerin daha küçük gemileri yenmesi için tasarlanmıştır."
 ship_light_medium_battery_1_short:0 "Hafif Kruvazör Bataryası I"
 ship_light_medium_battery_2:0 "15 cm Top"
 ship_light_medium_battery_2_desc:0 "Bu top, önceki modellerden mantıksal bir evrimi temsil eder ve hafif kruvazörlerin muhriplere ve eski kruvazörlere karşı ateş gücünde rahat bir avantaja sahip olmasını amaçlar."
 ship_light_medium_battery_2_short:0 "Hafif Kruvazör Bataryası II"
 ship_light_medium_battery_3:0 "15.5 cm Top"
 ship_light_medium_battery_3_desc:0 "Bir dizi yeni teknolojiyi içeren bu hafif zırhlı kundak, muhriplerin ve hafif kruvazörlerin ana bataryaları arasındaki farkı daha da açar."
 ship_light_medium_battery_3_short:0 "Hafif Kruvazör Bataryası III"
 ship_light_medium_battery_4:0 "15.5 cm Otomatik Yüklemeli Top"
 ship_light_medium_battery_4_desc:0 "Yüksek bir atış hızı için sıfırdan tasarlanan bu kundak, hafif kruvazörlerin çok sayıda isabetle daha büyük düşmanları bile etkisiz hale getirmesine olanak sağlamak için yaratılmıştır."
 ship_light_medium_battery_4_short:0 "Hafif Kruvazör Bataryası Otomatik Yüklemeli"
 ship_medium_battery_1:0 "17 cm Top"
 ship_medium_battery_1_desc:0 "Zırhlılara önemli hasar veremese de, bu orta top bir ağır kruvazörün daha hafif gemilerle ve diğer kruvazörlerle güvenle çatışmaya girmesini sağlar."
 ship_medium_battery_1_short:0 "Ağır Kruvazör Bataryası I"
 ship_medium_battery_2:0 "19 cm Top"
 ship_medium_battery_2_desc:0 "Daha önceki bir tasarımın evrimi olan bu top, zırhtaki artışlara ve deniz savaşlarının yapıldığı daha uzun menzillere ayak uydurmak için yapılmıştır."
 ship_medium_battery_2_short:0 "Ağır Kruvazör Bataryası II"
 ship_medium_battery_3:0 "20.3 cm Top"
 ship_medium_battery_3_desc:0 "Bir kruvazöre monte edilebilecek en büyük top olmasa da, bu top silah ağırlığı ve ateş gücü arasında en iyi dengeyi kurar ve kruvazör zırhını güvenilir bir şekilde yenebilir."
 ship_medium_battery_3_short:0 "Ağır Kruvazör Bataryası III"
 ship_medium_battery_4:0 "20.3 cm Otomatik Yüklemeli Top"
 ship_medium_battery_4_desc:0 "Mevcut mühimmat stoklarıyla sınırlı kalibresi ve eski gemileri yenileme amacıyla tasarlanan bu yeni top, atış hızını önemli ölçüde artırmak için gelişmiş bir otomatik yükleme sistemine sahiptir."
 ship_medium_battery_4_short:0 "Ağır Kruvazör Bataryası IV"
 ship_mine_layer_1:0 "Mayın Döşeme Rayları"
 ship_mine_layer_1_desc:0 "Bir su üstü gemisinin deniz mayınlarını taşıması ve döşemesi için modifikasyonlar."
 ship_mine_layer_sub:0 "Mayın Döşeme Kovanları"
 ship_mine_layer_sub_desc:0 "Bir denizaltının gövdesinde yapılan modifikasyonlar, bir dizi mayın döşemesine olanak tanır."
 ship_mine_sweeper_1:0 "Mayın Tarama Donanımı"
 ship_mine_sweeper_1_desc:0 "Çeşitli tarama ekipmanlarını konuşlandırmak için donanım."
 ship_radar_1:0 "Desimetrik Deniz Arama Radarı"
 ship_radar_1_desc:0 "50 cm dalga boyu aralığında çalışan basit bir radar seti, 10 kilometreden fazla bir menzilde kötü hava koşullarında bile su üstü gemilerinin tespit edilmesini sağlar."
 ship_radar_1_short:0 "Radar I"
 ship_radar_2:0 "Geliştirilmiş Desimetrik Deniz Arama Radarı"
 ship_radar_2_desc:0 "30 cm dalga boyu aralığında çalışan geliştirilmiş bir radar seti, 25 kilometreden fazla menzillerde küçük bir geminin bile menzilini ve kerterizini doğru bir şekilde ölçebilir."
 ship_radar_2_short:0 "Radar II"
 ship_radar_3:0 "Santimetrik Topçu Radarı"
 ship_radar_3_desc:0 "Boşluk magnetronları ile donatılmış bu radar seti, sadece çok küçük hedeflerin tespit edilmesini değil, aynı zamanda mermi sıçramalarının tespit edilmesini de sağlar. Bu, gece veya kötü hava koşullarında bile hedeflere karşı gerçek kör atış yapılmasına olanak tanır."
 ship_radar_3_short:0 "Radar III"
 ship_radar_4:0 "Entegre Ateş Kontrol Radarı"
 ship_radar_4_desc:0 "Santimetre dalga boyu aralığında çalışan bu radar seti, gemilerin topçu kontrolüne tam olarak entegre edilmiştir ve tüm hava koşullarında son derece hassas topçu ateşi kontrolü sağlar."
 ship_radar_4_short:0 "Radar IV"
 ship_seaplane_tender_1:0 "Deniz Uçağı Gemisi"
 ship_seaplane_tender_1_desc:0 "Deniz uçaklarına yakıt ikmali yapmak ve onları kurtarmak için teçhizat, kıyı tabanlı ikmale daha az güvenerek onları operasyonel tutar."
 ship_seaplane_tender_2:0 "Gelişmiş Deniz Uçağı Gemisi"
 ship_seaplane_tender_2_desc:0 "En eski deniz uçağı gemileri dönüştürülmüş ticaret gemileri olsa da, daha yeni tipler amaca uygun olarak inşa edilmiştir ve büyük ölçüde geliştirilmiş deniz uçağı destek yeteneklerine sahiptir."
 ship_secondaries_1:0 "75mm SA. Top"
 ship_secondaries_1_desc:0 "Geminin yan tarafındaki bir kazamatta bulunan bu hafif top, daha büyük gemilere daha küçük gemilere karşı bir miktar savunma sağlar."
 ship_secondaries_1_short:0 "İkincil Batarya I"
 ship_secondaries_2:0 "120mm SA. Top"
 ship_secondaries_2_desc:0 "Ana gemileri muhriplere ve torpido botlarına karşı savunmak için tasarlanmış, seri ateşli toplar için küçük bir taretli kundak."
 ship_secondaries_2_short:0 "İkincil Batarya II"
 ship_sonar_1:0 "Hidrofonlar"
 ship_sonar_1_desc:0 "Batık bir hedefi çıkardığı sese göre izlemek için basit bir hidrofon seti."
 ship_sonar_2:0 "Aktif Sonar"
 ship_sonar_2_desc:0 "Suya kısa bir 'ping' gönderen, ardından batık bir denizaltı gövdesinden gelen yankıyı dinleyen aktif bir gürültü yayıcı."
 ship_sonar_3:0 "Gelişmiş Sonar"
 ship_sonar_3_desc:0 "Daha güçlü sinyal darbeleri ve yönlü tarama kullanan geliştirilmiş aktif sonar dizisi."
 ship_sonar_4:0 "Modern Sonar"
 ship_sonar_4_desc:0 "Su altındaki hedeflerin üstün takibini sağlayan son teknoloji sonar sistemi."
 ship_sub_snorkel_1:0 "Temel Şnorkel"
 ship_sub_snorkel_1_desc:0 "Denizaltının ana motorlarını su altında çalıştırmasına olanak tanıyan bir cihaz, bu da yüzeye çıkarak kendini saldırıya maruz bırakmadan pillerini şarj etmesini sağlar."
 ship_sub_snorkel_2:0 "Geliştirilmiş Şnorkel"
 ship_sub_snorkel_2_desc:0 "Şnorkel tasarımındaki iyileştirmeler, ağır denizlerde ana motorları kullanırken yaşanan sorunları azaltır ve şnorkelin radarda tespit edilme olasılığını düşürür."
 ship_submarine_deck_space:0 "Denizaltı Hangar Alanı"
 ship_submarine_deck_space_desc:0 "Bir denizaltının az sayıda deniz uçağı taşımasına, fırlatmasına ve kurtarmasına izin veren su geçirmez bir bölme ve mancınık teçhizatı."
 ship_super_heavy_battery_1:0 "46 cm Top"
 ship_super_heavy_battery_1_desc:0 "Bir gemiye monte edilmiş en büyük top olan bu devasa toplar, herhangi bir mesafedeki olası her türlü zırhı delmek için tasarlanmıştır."
 ship_super_heavy_battery_1_short:0 "Süper Ağır Batarya"
 ship_torpedo_1:0 "3x 450mm Torpido Kovanı"
 ship_torpedo_1_desc:0 "Su üstü savaş gemilerine monte edilebilen bir dizi orta büyüklükte torpido."
 ship_torpedo_1_short:0 "Torpido Kovanı I"
 ship_torpedo_2:0 "4x 450mm Torpido Kovanı"
 ship_torpedo_2_desc:0 "Kundağa başka bir torpido kovanı monte ederek, bir su üstü gemisi daha yüksek isabet şansıyla daha geniş bir yelpaze ateşleyebilir."
 ship_torpedo_2_short:0 "Torpido Kovanı II"
 ship_torpedo_3:0 "3x 533mm Torpido Kovanı"
 ship_torpedo_3_desc:0 "Daha büyük torpidolar daha büyük bir savaş başlığı taşıyabilir ve hedefe önemli ölçüde daha fazla hasar verebilir. Ancak bu, kovanın daha az tüpe sahip olmasını gerektirir."
 ship_torpedo_3_short:0 "Torpido Kovanı III"
 ship_torpedo_4:0 "4x 533mm Torpido Kovanı"
 ship_torpedo_4_desc:0 "Su üstü gemilerinden büyük torpidolar fırlatmanın mekanik sorunlarını çözen bu gelişmiş model, başka bir salvo için hızla yeniden doldurulabilir."
 ship_torpedo_4_short:0 "Torpido Kovanı IV"
 ship_torpedo_sub_1:0 "4x 450mm Torpido Kovanı"
 ship_torpedo_sub_1_desc:0 "Denizaltının içinden yeniden doldurulabilen temel bir torpido kovanı seti."
 ship_torpedo_sub_1_short:0 "Torpido Kovanları I"
 ship_torpedo_sub_2:0 "6x 450mm Torpido Kovanı"
 ship_torpedo_sub_2_desc:0 "Daha büyük bir torpido odası, daha fazla torpido kovanının monte edilmesini sağlar. Ayrıca mürettebat için biraz daha fazla yaşam alanı sağlar."
 ship_torpedo_sub_2_short:0 "Torpido Kovanları II"
 ship_torpedo_sub_3:0 "4x 533mm Torpido Kovanı"
 ship_torpedo_sub_3_desc:0 "Daha büyük bir torpido kovanı seti, denizaltıların daha büyük torpidolar fırlatmasına olanak tanır."
 ship_torpedo_sub_3_short:0 "Torpido Kovanları III"
 ship_torpedo_sub_4:0 "6x 533mm Torpido Kovanı"
 ship_torpedo_sub_4_desc:0 "Elektrikli bir yükleme ramının eklenmesi, torpido kovanlarının dakikalar içinde yeniden doldurulmasını sağlar."
 ship_torpedo_sub_4_short:0 "Torpido Kovanları IV"
 ship_torpedo_sub_nuclear:0 "Nükleer Torpido"
 ship_torpedo_sub_nuclear_desc:0 "Nükleer bir savaş başlığı taşıyan torpidolar, düşman gemilerine karşı son derece etkili bir silah sağlar, ancak bu, daha yüksek kaza riski pahasına olur."
 slbm_launcher:0 "Denizaltı Nükleer Füze Fırlatıcı"
 slbm_launcher_desc:0 "Nükleer balistik füzeler için denizaltıya monte bir fırlatıcı."
 sub_missile_launcher:0 "Denizaltı Füze Fırlatıcı"
 sub_missile_launcher_desc:0 "Güdümlü ve balistik füzeler için denizaltıya monte bir fırlatıcı."
 sub_ship_engine_1:0 "1,000 Bg Motor"
 sub_ship_engine_1_desc:0 "Dizel ve elektrik motorlarının birleşimi, bir denizaltının su altında makul bir hızda çalışmasını sağlar."
 sub_ship_engine_1_short:0 "Denizaltı Motoru I"
 sub_ship_engine_2:0 "2,000 Bg Motor"
 sub_ship_engine_2_desc:0 "Daha güçlü bir dizel motor, denizaltıya bir hedef tespit ettiğinde pozisyona hızla geçme yeteneği verir."
 sub_ship_engine_2_short:0 "Denizaltı Motoru II"
 sub_ship_engine_3:0 "3,000 Bg Motor"
 sub_ship_engine_3_desc:0 "Yeni malzemeler ve üretim yöntemleri, tam güçte daha uzun süre çalışabilen motorların oluşturulmasına olanak tanır."
 sub_ship_engine_3_short:0 "Denizaltı Motoru III"
 sub_ship_engine_4:0 "4,000 Bg Motor"
 sub_ship_engine_4_desc:0 "Turboşarjlı gelişmiş motorlar, ya hedefleri kovalamak ya da pilleri daha hızlı şarj etmek için kısa bir süre için çok daha hızlı çalışabilir."
 sub_ship_engine_4_short:0 "Denizaltı Motoru IV"
 sub_ship_nuclear_engine_1:0 "Nükleer Denizaltı Reaktörü"
 sub_ship_nuclear_engine_1_desc:0 "Denizaltılar için nükleer itki sağlayan küçük bir reaktör, modern deniz filoları için genişletilmiş su altı dayanıklılığı ve verimli çalışma sağlar."
 sub_ship_nuclear_engine_1_short:0 "Denizaltı Reaktörü"
