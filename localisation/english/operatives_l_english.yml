 upgrade_airforce_department:0 "Hava Kuvvetleri Departmanı"
 upgrade_airforce_department_desc:0 "§LHava İstihbarat Departmanı teşkilatımızın yararlı bir şubesi olacak; düşman hava kuvvetlerine sızmaktan ve düşman uçak hareketleri hakkında istihbarat toplamaktan sorumlu olacak.§!"
 upgrade_anti_partisan:0 "Anti-partizan"
 upgrade_anti_partisan_desc:0 "§LPropaganda, kendi vatandaşlarımızın sadakatini sağlamak için güçlü bir araçtır, ancak düşman topraklarında itaat yaratmak çok daha karmaşıktır. Operatiflerimizi düşman direniş hareketlerine sızdırmak üzere eğiterek, etkili tutuklamalar yapmaya ve onların yıkıcı faaliyetlerine son vermeye başlayabiliriz. Elbette o zaman, yabancı partizanlar eski rejimlerine dönme umudunu kaybedeceklerdir.§!"
 upgrade_army_department:0 "Kara Kuvvetleri Departmanı"
 upgrade_army_department_desc:0 "§LDüşman ordusu hakkında istihbarat son derece önemlidir ve bir askeri istihbarat departmanı kurmak gereklidir. Operatiflerimiz, düşman saflarına sızmak, asker ve general olarak hizmet etmek ve düşman hatlarının gerisinde buldukları sırları bize bildirmek üzere eğitilecekler.§!"
 upgrade_blueprint_stealing:0 "Plan Hırsızlığı"
 upgrade_blueprint_stealing_desc:0 "§LDüşmanımızın deneysel silahlar ve araçlar için gizli projeleri olduğunu biliyoruz, bilmediğimiz şey ise bu projelerin tam olarak ne olduğu ve ne inşa ettikleridir. Düşmanlarımızın deneysel silah departmanlarına sızarak, bize karşı ne kullanmayı planladıklarını tam olarak öğrenme fırsatı kazanmakla kalmayacak, aynı zamanda bu bilgiyi kendi silah departmanımızı ilerletmek için kullanma konusunda eşsiz bir fırsat yakalayacağız.§!"
 upgrade_commando_training:0 "Komando eğitimi"
 upgrade_commando_training_desc:0 "§LDepartmanımız genellikle savaşın daha incelikli yönleriyle ilgilenirken, operasyonlarımızı tamamlamak için genellikle küçük bir ağır silahlı asker ekibi gerekir. Tüm operatiflerimizi Komando savaşı yöntemleri konusunda eğiterek, sabotaj operasyonlarında daha etkili olacaklar, düşman karşı-istihbaratı tarafından tespit edilme olasılıkları azalacak ve düşman kriptolojik ekipmanlarını ele geçirme konusunda daha yetenekli olacaklar.§!"
 upgrade_crypto_strength:0 "Devlet Şifre Okulu"
 upgrade_crypto_strength_2:0 "Makine Destekli Şifreleme"
 upgrade_crypto_strength_2_desc:0 "§LStandart şifre oluşturma yöntemimizin, iletişimlerimizi düşman gözlerinden korumak için yetersiz olduğu giderek daha belirgin hale geliyor. En iyi beyinlerimiz, istediğimiz sıklıkta yeni şifreler üretmek için alfabenin harflerini karıştırabilen bir makine teorisi geliştirdi. Böyle bir teknolojiyi kullanmak, şifreleme yöntemlerimizi düşmanlarımız için tam bir muamma haline getirecektir.§!"
 upgrade_crypto_strength_desc:0 "§LKodlar ve şifreler şimdiye kadar denizaşırı casus ağlarımızı kurmanın ve korumanın en etkili yolu olduğunu kanıtladı. Devlet İletişim Merkezi, düşmanlarımızın deşifre etmeye çaresiz kalacağı yeni ve karmaşık şifreleme yöntemlerinin oluşturulmasına kendini adayacaktır.§!"
 upgrade_decryption_boost:0 "Radyo Dinleme Grubu"
 upgrade_decryption_boost_2:0 "Makine Destekli Şifre Çözme"
 upgrade_decryption_boost_2_desc:0 "§LMakineler verileri şifrelemede zaten faydalı olduklarını kanıtladılar, makine destekli şifreli sinyallerin deşifre edilmesi en zor olanıdır. Kriptanaliz makineleri, henüz kodunu bilmediğimiz mesajları kırmada hayati önem taşır ve deşifre ekibimiz için değerli bir varlık olacaktır.§!"
 upgrade_decryption_boost_desc:0 "§LRadyo dalgaları, uzun mesafeler arasında uzaktan iletişim kurmayı mümkün kılmıştır ve sinyaller genellikle yayının frekansını düzensiz bir oranda sürekli değiştirerek şifrelenir. Düşman iletişimini dinleyeceksek, düşman radyo şifrelemesini kırmaya adanmış bir dinleme grubu kurmalıyız.§!"
 upgrade_diplo_training:0 "Diplomatik Eğitim"
 upgrade_diplo_training_desc:0 "§LAjanlarımızı birkaç yabancı yatırımcının ve diplomatın avucunu yağlamak üzere eğitmek, onları davamızın iyi niyetine ikna edebilir ve çıkarlarını devlet düşmanlarından uzaklaştırabilir.§!"
 upgrade_economy_civilian:0 "Ekonomi/Sivil"
 upgrade_economy_civilian_desc:0 "§LAjanlarımız, düşman topraklarında sivil rolünü üstlenmek ve endüstriyel ve sivil sektörlerinde faaliyet göstermek üzere eğitilecek; düşmanımızın endüstrisi ve ekonomisi hakkında istihbarat toplayacaklar.§!"
 upgrade_form_department:0 "Departman Kur"
 upgrade_form_department_desc:0 "§LKriptoloji, gizli iletişimi sürdürmek için kodlar ve şifreler oluşturma yöntemidir. Gerekli kod olmadan, bir şifreyle yazılmış bir mesajı anlamak neredeyse imkansız olabilir. Düşmanlarımızınkini deşifre ettiğimiz kadar kendi verilerimizi de şifrelememiz aynı derecede önemlidir.§!"
 upgrade_interrogation_techniques:0 "Sorgulama teknikleri"
 upgrade_interrogation_techniques_desc:0 "§LGenellikle bir düşman ajanının bedenini kırmak yerine zihnini kırmak daha etkili olabilir. Fiziksel güç kullanımı güvenilmezdir ve genellikle yanlış bilgiyle sonuçlanır; gerçekten yetenekli bir sorgucu, düşmanın iradesini şiddet kullanmadan kırabilir. Ama, eğer iş o noktaya gelirse, onları konuşturmanın yolları var...§!"
 upgrade_invisible_ink:0 "Görünmez Mürekkep"
 upgrade_invisible_ink_desc:0 "§LGörünmez mürekkeple yazılmış bir mektup çıplak gözle sadece boş bir kağıt parçasıdır, ancak UV ışığı veya amonyak gibi kimyasalların uygulanması mektubun içeriğini ortaya çıkarır. Tüm operatiflerimiz tarafından görünmez mürekkep kullanımını standartlaştırarak, bilgilerimiz düşmanlarımız tarafından ele geçirilse bile gizli kalacaktır.§!"
 upgrade_naval_department:0 "Deniz Kuvvetleri Departmanı"
 upgrade_naval_department_desc:0 "§LDenizlerdeki muharebe zaferi güvence altına almanın kilit bir parçasıdır ve deniz teknolojilerindeki ilerlemeyle birlikte bir Deniz İstihbarat Departmanı kurmamız hayati önem kazanmıştır.§!"
 upgrade_passive_defense:0 "Pasif savunma"
 upgrade_passive_defense_desc:0 "§Lİç Güvenlik, istihbaratımız için hayati bir araç olma potansiyeline sahiptir. İç Güvenlik ve Garnizon birliklerimizi casusluk ve karşı istihbarat yöntemleri konusunda eğiterek, uzmanlarımız başka işlerle meşgulken bile evimizde her zaman bir savunma varlığına sahip olmamızı sağlayacağız.§!"
 upgrade_plastic_explosives:0 "Plastik patlayıcılar"
 upgrade_plastic_explosives_desc:0 "§LPlastik patlayıcıların macun benzeri dokusu, onları düşman üretimini sabote etmek için ideal kılar, bu nedenle yabancı partizanları bu maddeyle silahlandırmamız doğaldır. Bombalar kolayca gözden uzak yerlere ve düşman fabrikalarının hassas bölgelerine yerleştirilebilir ve maddenin dövülebilir doğası, onu görkemli bir siyasi suikast için ideal bir silah haline getirir...§!"
 upgrade_portable_radios:0 "Taşınabilir radyolar"
 upgrade_portable_radios_desc:0 "§LGeleneksel radyo iletişim cihazları gizli bir ortamda kullanılamayacak kadar büyük ve hareketsizdir, ancak bu teknolojinin kompakt versiyonlarını inşa ederek ve bunları evrak çantası gibi sıradan ev eşyaları olarak gizleyerek, ajanlarımız şüphe veya alarm uyandırmadan günün her saatinde iletişim kurabilecekler.§!"
 upgrade_psycho_warfare:0 "Psikolojik Harp"
 upgrade_psycho_warfare_desc:0 "§LPropaganda, kendi devletimiz içindeki ideolojik çıkarlarımızı güvence altına almada etkili bir araç olmuştur, ancak hiçbir araç düşman rejimlerinden ve ülkeye getirebilecekleri şeylerden korku yaymak kadar etkili olmamıştır. Ajanlarımızı yabancı uluslar içindeki anti-ideolojik hareketlerle müttefik kılarak, ideolojimizi dünya çapında yaymada çok daha etkili olacağız...§!"
 upgrade_suicide_pills:0 "İntihar hapları"
 upgrade_suicide_pills_desc:0 "§Lİstenmese de, bir avuç ajanın düşmanımız tarafından yakalanması kaçınılmazdır. Operatiflerimize sorgu odasında onları bekleyen dehşetten kaçmanın bir yolunu sunmalıyız ve bir dişin yerine konmuş bir siyanür hapı, eğer iş o noktaya gelirse onlara bu kaçışı sağlayacaktır.§!"
 upgrade_training_centers:0 "Yerelleştirilmiş eğitim merkezleri"
 upgrade_training_centers_desc:0 "§LAjanlarımız her ortama uyum sağlayabilse de, yabancı toprakların kültürel normları ve dilleri o kültürde doğup büyüyenlere daha doğal gelir. Dünya çapında bir casus ağı kuracaksak, işe alım ve eğitim merkezlerimizi tüm dünyaya yaymalı ve tüm kültürlerden ve geçmişlerden ajanlar işe almalıyız.§!"
