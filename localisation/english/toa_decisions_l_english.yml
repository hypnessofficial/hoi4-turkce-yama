 ARG_international_loan_decisions_desc:0 "[ROOT.GetAdjective] ekonomisini restore etmek için, canlanma sürecimizi başlatmak amacıyla bir kredi için dünyanın büyük güçlerine ulaşmak akıllıca olacaktır. Ancak, çok fazla borca girmemeye dikkat etmeliyiz."
 ARG_international_loan_decisions_tt:0 "§YUluslararası Kredi§! kararlarının kilidini açar. Hedef uluslar kabul ederse, [ROOT.GetNonIdeologyName] şunları kazanır: \n$ARG_international_loan_tt$"
 ARG_international_loan_tt:0 "Şunları veren §Y$ARG_international_loan_modifier$§! ekle:\nGünlük Politik Güç Maliyeti: §R-%20.0§!\n Kaynak Kazanma Verimliliği: §G+%5.0§!\n İnşaat Hızı: §G+%4.0§!\n Fabrika Çıktısı: §G+%6.0§!\n Tersane Çıktısı: §G+%6.0§!\n"
 ARG_intervenciones_federales_decisions:0 "Intervenciones Federales"
 ARG_intervenciones_federales_decisions_desc:0 "Yeni kabinemize yönelik artan darbe tehdidi, intervenciones federales'in etkinleştirilmesiyle sonuçlandı. Bu yeni yasayı uygulayacağımız eyaletleri seçmeliyiz. Bunu yapmak, hükümetlerini savunmaya istekli insanları daha verimli bir şekilde çağırmamıza ve onlara yardım etmemize olanak tanıyacaktır."
 ARG_intervenciones_federales_decisions_tt:0 "§YIntervenciones Federales§! kararlarının kilidini açar, bu da §YYaklaşan Askeri Darbe Girişimi§!'nden gelen §YAskeri Hücreleri§! etkisiz hale getirmemize olanak tanır."
 ARG_island_negotiations_decisions:0 "Ada Müzakereleri"
