 ARG_island_negotiations_decisions_tt:0 "Büyük ölçekli bir savaşta yer almıyorsak ([ENG.GetFlag]§Y[ENG.GetNameDefCap]§!) ile bir barış anlaşması müzakere etmemizi sağlayacak §YAda Müzakereleri§! kararlarının kilidini açar."
