l_english:
 FRA_SNCAN_formed:0 "SNCAN Kuruldu"
 FRA_SNCAO_formed:0 "SNCAO Kuruldu"
 FRA_SNCASE_formed:0 "SNCASE Kuruldu"
 FRA_SNCASO_formed:0 "SNCASO Kuruldu"
 FRA_agricultural_collectivization_desc:0 "Sanayi için geçerli olan, Fransa genelindeki çiftçiler için de aynı ölçüde geçerlidir. Küçük çiftlikler modern ekipmanları karşılayamaz, büyük ölçüde büyük büyükbabalarının yaptığı gibi çalışırlar. Onları tarımsal üretim birimlerinde birleştirerek verimliliği ve çıktıyı artıracağız."
 FRA_agricultural_protectionism_desc:0 "Dünya ekonomisi, geleneksel üretim yöntemlerimize giderek daha düşmanca hale geldi. Eğer çiftçilerimizi korumak için önlemler almazsak, denizaşırı ülkelerden gelen seri üretilen gıda maddeleri karşısında çiftçilerimiz rekabet edemez hale geldikçe yakında eşi benzeri görülmemiş oranlarda bir krizle karşı karşıya kalacağız."
 FRA_air_dominance_desc:0 "Uçağın gelişimi, ordunun endişelenmesi gereken üçüncü bir kanat yarattı. Bu kanadı güvence altına almalı veya felaketle yüzleşmeliyiz."
 FRA_air_ground_cooperation:0 "Hava-Kara İş Birliği"
 FRA_air_ground_cooperation_desc:0 "Havadaki savaş, ancak yerdeki bir hedefin peşinde olduğunda gerçek askeri sonuçlar yaratır. Havadaki savaş ile yerdeki savaşı ne kadar iyi entegre edersek, o kadar etkili oluruz."
 FRA_align_belgium:0 "Belçika'yı Hizaya Getir"
 FRA_align_belgium_desc:0 "Belçikalılar varlıklarını bize borçlular ve bu gerçeği unutmalarına izin veremeyiz. Eğer bağımsız kalmalarına izin verirsek, en azından dost bir hükûmetin kurulmasını sağlayacağız."
 FRA_anti_fascist_coalition:0 "Anti-Faşist Koalisyon"
 FRA_anti_fascist_coalition_desc:0 "İlerlemenin yürüyüşüne en büyük tehdit, gerici faşizmin yayılmasıdır. Bu tehditle mücadele etmeye istekli her ülkenin yanında durmalıyız, yoksa hiçbirimiz için bir yarın olmayacak."
 FRA_appeal_to_overseas_territories:0 "Denizaşırı Topraklara Çağrı"
 FRA_appeal_to_overseas_territories_desc:0 "Fransa'nın metropol bölgeleri düşmana düşmüş olsa da, imparatorluğunun çoğu hala özgür. Eğer onları yardımımıza toplayabilirsek, savaşı düşmana geri götürebiliriz."
 FRA_appeal_to_overseas_territories_tt:0 "Dünyanın çeşitli yerlerindeki sömürge topraklarının bizim tarafımıza geçme şansı var."
 FRA_appeal_to_the_french_nation:0 "Fransız Ulusuna Çağrı"
 FRA_appeal_to_the_french_nation_desc:0 "Fransa savaşı kaybetmiş olabilir, ama savaşı kaybetmedi. Direnmek her vatansever Fransız'ın görevidir."
 FRA_arms_purchases_in_the_us:0 "ABD'den Silah Alımları"
 FRA_arms_purchases_in_the_us_desc:0 "Askeri sanayimiz, kuvvetlerimizi gerekli modern silahlarla tedarik etme görevine basitçe uygun değil. Ancak ABD'nin ayıracak üretim kapasitesi var. İzolasyonizmlerine geri dönmeye karar vermezlerse, bize ihtiyacımız olan silahları satmaya ikna edilebilecekleri görülüyor."
 FRA_autoroutes:0 "Otoyollar"
 FRA_autoroutes_desc:0 "Almanlar, ülkelerinin çeşitli kısımlarını birbirine bağlayan sınırlı erişimli, yüksek hızlı yollar konseptiyle dünyayı hayran bıraktı. Onlar kadar iyi yapabileceğimizi dünyaya gösterebiliriz."
 FRA_avenge_waterloo:0 "Waterloo'nun İntikamını Al"
 FRA_avenge_waterloo_desc:0 "Birinci Napolyon'un tarihi, sonsuza dek en büyük yenilgisiyle tanımlanacaktır. Eğer başarılı olmak istiyorsak, onun kaybettiği yerde kazanabileceğimizi göstermeliyiz."
 FRA_ban_communism_desc:0 "Her ne kadar herhangi birinin ciddi bir şekilde bir komünist devrimin kaosunu ve kanını kendi anavatanına getirmek isteyebileceği düşünülemez olsa da, aramızda tam da bunu yapacak bazıları varmış gibi görünüyor. Onların devlete karşı komplo kurmalarına daha fazla izin veremeyiz. En sert önlemler alınmalıdır."
 FRA_ban_the_leagues:0 "Birlikleri Yasakla"
 FRA_ban_the_leagues_desc:0 "Aşırı sağcı birliklerin kontrolsüz bir şekilde örgütlenmesine izin verildi. Şu anda bir darbe denemek için çok zayıf olsalar da, gelecekte ne yapabileceklerini söylemek mümkün değil. Onları şimdi dağıtmak en iyisi."
 FRA_battle_of_maneuver:0 "Manevra Savaşı"
 FRA_battle_of_maneuver_desc:0 "Orduların çarpıştığı küçük bir alan olarak savaş alanı eski nosyonu öldü. Kitlesel motorizasyon, uçaklar ve hızlı radyo iletişimiyle, savaşlar yüzlerce kilometre boyunca hızla hareket ediyor. Buna ne kadar erken hazırlanırsak o kadar iyi."
 FRA_begin_rearmament:0 "Yeniden Silahlanmaya Başla"
 FRA_begin_rearmament_desc:0 "Mareşal Foch'un 1919'da öngördüğü 20 yıllık ateşkes hızla sona eriyor ve dünyanın önümüzdeki birkaç yıl içinde savaşa girme olasılığı giderek artıyor. Hazır olmalıyız."
 FRA_bring_home_quebec:0 "Quebec'i Yuvaya Getir"
 FRA_bring_home_quebec_desc:0 "Uzun zaman önce kaybedilen il, zamanla yeniden bizim olacak. Dünyadaki tüm Fransızca konuşan insanlar eninde sonunda anavatanla yeniden birleşecektir."
 FRA_buy_time:0 "Zaman Kazan"
 FRA_buy_time_desc:0 "Sahada Almanlarla yüzleşmeye hazır değiliz. Müttefiklerimiz zayıf, ordumuz güncelliğini yitirmiş. Eğer hayatta kalmak istiyorsak bazı fedakarlıklar yapmak zorunda kalabiliriz."
 FRA_carrier_planes:0 "Uçak Gemisi Uçakları"
 FRA_carrier_planes_desc:0 "Bir uçak gemisi ancak uçakları kadar iyidir. Modern uçaklar olmadan, herhangi bir uçak gemisi boşa bir yatırımdır."
 FRA_carry_the_revolution_east:0 "Devrimi Doğuya Taşı"
 FRA_carry_the_revolution_east_desc:0 "Doğu sınırımızda yeni düzenimize en büyük tehdit yatıyor. Orada toplanan gerici güçler, en az göze alabileceğimiz anda saldıracaklar - ama sadece onlara hazırlanmaları için zaman verirsek."
 FRA_carry_the_revolution_north:0 "Devrimi Kuzeye Taşı"
 FRA_carry_the_revolution_north_desc:0 "Kanalın karşısında sanayi devriminin doğduğu yer ve onunla birlikte modern kapitalizmin evi yatıyor. Bu yerin karşı-devrimci bir düşman için bir sıçrama tahtası haline gelmesine izin veremeyiz."
 FRA_carry_the_revolution_south:0 "Devrimi Güneye Taşı"
 FRA_carry_the_revolution_south_desc:0 "Faşizme düşen ilk ülke İtalya'ydı. Sonuç olarak, ideoloji İtalya'da sıkı bir şekilde yerleşmiştir. Dünya görüşlerimiz barış içinde bir arada var olamaz. Onlar da bunu bizim kadar iyi biliyorlar ve şüphesiz harekete geçmeye hazırlanacaklar. Biz de öyle yapmalıyız."
 FRA_carry_the_revolution_west:0 "Devrimi Batıya Taşı"
 FRA_carry_the_revolution_west_desc:0 "İberya yarımadasının rejimleri bir ipliğe bağlı, popüler bir devrim tarafından süpürülmeye hazır. O ipliği biz koparacağız."
 FRA_carry_the_revolution_west_tt:0 "§Yİspanya§!'ya veya İspanya İç Savaşı'nın hayatta kalan, komünist olmayan herhangi bir fraksiyonuna karşı §YHükûmeti Devir§! savaş hedefi kazandırır."
 FRA_celebrate_the_commune:0 "Komünü Kutla"
 FRA_celebrate_the_commune_desc:0 "Kısa ömürlü olsa da, Paris Komünü Fransız topraklarında bir komünist toplum yaratma ilk girişimiydi."
 FRA_colonial_industry_effect_tt:0 "Daha önce yatırım yapılan her sömürge eyaletine iki §YSivil Fabrika§! ekler.\n"
 FRA_colonial_naval_bases:0 "Sömürge Donanma Üsleri"
 FRA_colonial_naval_bases_desc:0 "Küresel güç projeksiyonunun anahtarı, anavatan sularından uzakta bir filo bulundurma yeteneğidir. Zaten büyük sömürge mülklerimiz var, şimdi onları filomuz için yakıt ikmali ve onarım üsleri olarak hizmet edecek şekilde geliştirmeliyiz."
 FRA_colonial_recruitment_desc:0 "Anavatan askere alma için müsait olmadığından, yardım için sömürgelerimize yönelmeliyiz. Tebaamızın çoğu bizim için savaşmak üzere silahlanmaya isteklidir."
 FRA_compensate_italy:0 "İtalya'yı Tazmin Et"
 FRA_compensate_italy_desc:0 "Geçmişte, bazı küçük çöl parçaları üzerindeki çatışmalar uluslarımızı çatışmaya sürükledi. Böyle bir saçmalık kolayca durdurulabilir ve karşılıklı olarak kabul edilebilir bir sonuca hızla ulaşılabilir."
 FRA_concessions_to_italy:0 "İtalya'ya Tavizler"
 FRA_concessions_to_italy_desc:0 "İtalya hala Afrika'da bir imparatorluk hayal ediyor. Eğer bazı tavizler sunarsak - ve Etiyopya'yı fethini onaylarsak - Roma ile Berlin arasında bir mihverin oluşmasını önleyebiliriz."
 FRA_confirm_eastern_commitments:0 "Doğu Taahhütlerini Onayla"
 FRA_confirm_eastern_commitments_desc:0 "Büyük Savaş'tan sonra, yeniden canlanan bir Almanya ve yayılmacı bir Sovyetler Birliği'ne karşı bir denge unsuru olarak Doğu Avrupa'da bir ittifaklar ağı kurduk. Bölgedeki müttefiklerimiz şimdi, eğer çağrılırsak gerçekten onların yardımına gelip gelmeyeceğimizi merak ediyor. Başka bir yerden yardım aramaya karar vermeden önce onları rahatlatmalıyız."
 FRA_connections_to_industrialists:0 "Sanayicilerle Bağlantılar"
 FRA_connections_to_industrialists_desc:0 "Savaş sanayilerindeki işçilerle iş birliği yardımcı olurken, fabrikaları yöneten insanlarla iş birliği yapmanın kendi içinde faydaları vardır."
 FRA_constitutional_convention:0 "Anayasa Konvansiyonu"
 FRA_constitutional_convention_desc:0 "Cumhuriyetimizin doğasında temel bir değişiklik bir gecede yapılamaz ve yeni bir anayasa müzakere etmeden de yapılamaz."
 FRA_continue_the_fight:0 "Mücadeleye Devam Et"
 FRA_continue_the_fight_desc:0 "Şimdiye kadar pek az asker bize katılmayı seçti, ama elimizdekiler silahlandırılmalı ve donatılmalıdır."
 FRA_cooperation_with_the_communists:0 "Komünistlerle İş Birliği"
 FRA_cooperation_with_the_communists_desc:0 "Ortak mücadelemizde, kendilerini sunan hiçbir müttefiki reddetmemeliyiz - kendilerine yoldaş deseler bile."
 FRA_coordinate_rearmament:0 "Yeniden Silahlanmayı Koordine Et"
 FRA_coordinate_rearmament_desc:0 "Almanların ve diğer rakiplerimizin birleşik geliştirme sürecine ayak uydurmak için, çabalarımızı müttefiklerimizle de koordine etmeliyiz."
 FRA_coordinate_rearmament_tt:0 "İttifakımızın üyeleri için üretim lisanslarının maliyetini düşürür."
 FRA_counter_action_desc:0 "Action Française, uzun süredir monarşiye dönüşün en güçlü savunucusu olmuştur. Ne yazık ki, diğer konulardaki görüşleri daha az hoştur. Onlara amaçlarına hizmet ettiklerini bildirme ve onlardan kurtulma zamanı geldi."
 FRA_destroy_decadence:0 "Çürümeyi Yok Et"
 FRA_destroy_decadence_desc:0 "Hiçbir ülke, en küçük bir meseleyi bile aylarca tartışmasına izin verirse büyük olmamıştır. Okyanusların arkasında güvende olan ve küresel imparatorluklar tarafından desteklenen bazı ülkeler, bu lüksü karşılayabileceklerine inanabilirler. Biz yapamayız."
 FRA_destroy_the_counter_revolution:0 "Karşı-Devrimi Yok Et"
 FRA_destroy_the_counter_revolution_desc:0 "Şimdi bile, Fransa'daki bazı insanlar en ufak bir zayıflık gösterdiklerinde hançeri kendi halklarının sırtına saplamaya hazırlanıyor. Onlara izin vermeyeceğiz ve önce biz vuracağız."
 FRA_devalue_the_franc_desc:0 "Diğer ülkeler ekonomilerine yardımcı olmak için para birimlerinin değer kaybetmesine izin verirken, biz bunu kararlılıkla reddettik. Sonuç olarak, ekonomimiz diğerlerinin gerisinde kalıyor. Eğer daha rekabetçi olmak ve yaklaşan fırtınayı atlatmak istiyorsak, popüler olmayan bir önlem olacağı kanıtlansa bile, para birimimizin devalüasyonunu göz ardı etmemeliyiz."
 FRA_develop_colonial_dockyards:0 "Sömürge Tersanelerini Geliştir"
 FRA_develop_colonial_dockyards_desc:0 "İmparatorluğumuzun çeşitli yerlerindeki donanma üsleri genişletilip modernize edildiğinde, gerekli ağır sanayiyi kurmaya ve denizaşırı gemi inşa etmek için gerekli büyük rıhtımları inşa etmeye bakabiliriz."
 FRA_diplomatic_freedom:0 "Diplomatik Özgürlük"
 FRA_diplomatic_freedom_desc:0 "Cumhuriyetçi hükûmetler, yardımımızı çektiğimiz an düşecek olan Doğu Avrupa'daki yapay yapılara kendilerini zincirlediler. Onlar birer yükümlülük, varlık değil ve bu yüzden kendimizi onlardan kurtaracağız."
 FRA_dirigisme_desc:0 "Sovyet modelinin tam teşekküllü planlı ekonomisi açıkça çok aşırı bir önlem olsa da, ekonomimizi optimize etmek için belirli bir ölçüde planlama ve yönlendirme gereklidir."
 FRA_disunite_germany:0 "Almanya'yı Parçala"
 FRA_disunite_germany_desc:0 "Fransa'ya karşı kazanılan zafer, Prusya'nın daha küçük Alman devletlerini kendi sancağı altında birleştirmesine olanak tanıdı. Şimdi Almanlar yenildiğine göre, bu sürecin tersine çevrilmesi sadece doğrudur."
 FRA_disunite_germany_tt:0 "§YKıta Sistemi§!'nin adını §YConfédération du Rhin§! olarak değiştirir."
 FRA_division_cuirassee:0 "Bölüm Cuirassée"
 FRA_division_cuirassee_desc:0 "De Gaulle adında girişimci bir subay, ağır zırhı piyade ve orta tanklarla birleştirerek bir bütün olarak savaşacak yeni bir tür tümen önerdi."
 FRA_dominate_the_middle_east:0 "Orta Doğu'ya Hükmet"
 FRA_dominate_the_middle_east_desc:0 "Orta Doğu ülkeleri, Osmanlı İmparatorluğu'nun cesedinden oyulmuş yapay yapılardır. Ortalama bir Fransız köyünden daha egemen değiller ve onlara bu gerçeği hatırlatmanın zamanı geldi."
 FRA_economic_devolution:0 "Ekonomik Yetki Devri"
 FRA_economic_devolution_desc:0 "Paris'teki bir bürokratın Bordeaux'daki bir şirket için en iyisini bildiğini düşünmek saçmadır. Girişimcilerimize güvenmeli ve kendi çözümlerini yaratmaları için onları güçlendirmeliyiz."
 FRA_egalite_liberte_solidarite_desc:0 "İlk Fransız Devrimi bin yıldır süren rejimleri süpürdü ve Avrupa'nın manzarasını sonsuza dek değiştirdi. Onların başlattığı işi biz bitireceğiz."
 FRA_encourage_immigration:0 "Göçü Teşvik Et"
 FRA_encourage_immigration_desc:0 "Anavatanımız, Büyük Savaş'ta meydana gelen kayıpları telafi etmek için umutsuzca işçilere ihtiyaç duyuyor. Fransa'ya yerleşmeyi kolaylaştırarak, bu açığı kapatabilecek vasıflı göçmenleri çekebiliriz."
 FRA_establish_spheres_of_influence:0 "Nüfuz Alanları Oluştur"
 FRA_establish_spheres_of_influence_desc:0 "Yüzyıllardır halkımız, ölümlü, kalıtsal düşmanlar olduğumuz inancıyla yaşadı. Bu inanç, çıkarlarımızın uyumsuz olduğu fikrine dayanıyordu. Ama eğer sadece nüfuz alanlarımızı tanımlayıp müdahale etmekten özenle kaçınırsak kesinlikle bir anlaşmaya varabiliriz."
 FRA_expand_the_citizenship:0 "Vatandaşlığı Genişlet"
 FRA_expand_the_citizenship_desc:0 "Bir cumhuriyetin topraklarında yaşayan bazı insanların onun vatandaşı olmasına izin verilmemesi kabul edilemez, ancak bu durum bizimkinde devam etmesine izin verildi. Bunu derhal düzeltmeliyiz."
 FRA_expand_to_the_suez:0 "Süveyş'e Genişle"
 FRA_expand_to_the_suez_desc:0 "Levant'taki kontrolün biz ve Britanya arasında bölünmesi, neyse ki artık uymak zorunda olmadığımız, işlemeyen bir uzlaşmaydı."
 FRA_family:0 "Aile"
 FRA_family_desc:0 "Toplumdaki en küçük birim birey değildir - ailedir. Bu basit ve açık gerçeği tartışmak, eski cumhuriyetin en büyük kusuruydu."
 FRA_fatherland:0 "Anavatan"
 FRA_fatherland_desc:0 "Her [FRA.GetAdjective] erkek, kadın ve çocuğun görevi, komşusunu savunmak ve ona yardım etmektir. Bu, ancak düzen ve ulusa koşulsuz sadakat yoluyla başarılabilir. Bu konuda hiçbir soru olamaz, yoksa eski cumhuriyetin kaderini paylaşırız. Düzeni ve ulusal güvenliği sağlamak için gereken her şeyi yapacağız. Sonunda, halk bunun kendi çıkarlarına en uygun olduğunu anlayacaktır."
 FRA_firepower_kills:0 "Ateş Gücü Öldürür"
 FRA_firepower_kills_desc:0 "Büyük Savaşın dersleri, acımasız olduğu kadar basitti: insanların açık nişangahlarla birbirleriyle savaştığı günler sona erdi. Bugün, öldürme, en modern silahlarla uzun menzilde kitlesel ölçekte yapılıyor."
 FRA_flying_artillery_desc:0 "Bugünün hızlı hareket eden savaşlarında, yerdeki yavaş topçu parçaları yetişemeyebilir. Bomba taşıyan uçaklar onların rolünü üstlenebilir."
 FRA_force_the_issue:0 "Meseleyi Zorla"
 FRA_force_the_issue_desc:0 "Halk Cephesini kurduğumuzdan beri çok yol kat ettik. Ama işimizi yarım bırakamayız. Soldaki herkesin bir seçim yapıp bir tavır alma zamanı geldi - ya devrimle ya da devrime karşı."
 FRA_force_the_issue_tt:0 "İstikrar cezası, §YDemokratik§! Partilerin popülaritesine bağlıdır.\n"
 FRA_foreign_guest_workers:0 "Yabancı Misafir İşçiler"
 FRA_foreign_guest_workers_desc:0 "İşçi eksikliğimiz, sanayimizi genişletmede ve silahlı kuvvetlerimizin boyutunu büyütmede büyük bir darboğazdır. Müttefiklerimizden vasıflı işçileri fabrikalarımızda çalışmaya davet etmek, orduya gönderilecek insan gücünü serbest bırakır."
 FRA_form_the_national_committee:0 "Ulusal Komiteyi Kur"
 FRA_form_the_national_committee_desc:0 "Pek az kişi davamızın başarılı olabileceğine inanırdı. Ama şimdi nihayet düşmandan kurtarılan herhangi bir Fransız toprağının kontrolünü almaya hazır, tam işlevli bir sürgün hükûmeti kurulduğunu ilan edecek kadar güçlüyüz."
 FRA_form_the_popular_front:0 "Halk Cephesini Kur"
 FRA_form_the_popular_front_desc:0 "Almanya ve İtalya'da faşizmin yükselişiyle, eğer davamız hayatta kalacaksa soldaki iç çekişmelerin durması gerektiği açıkça ortaya çıktı. Soldaki tüm partilerden oluşan geniş, popüler bir cephe, faşizmi yaratan ekonomik koşulları nihayet ele almak için halk yetkisine sahip olacaktır."
 FRA_form_the_provisional_government_of_the_republic:0 "Geçici Hükûmeti Kur"
 FRA_form_the_provisional_government_of_the_republic_desc:0 "Paris'in kurtuluşuyla, artık bir sürgün hükûmeti değiliz. Ülkemizi yeniden inşa etmenin zorlu işine başlama zamanı geldi."
 FRA_form_the_state_arsenals:0 "Devlet Cephaneliklerini Kur"
 FRA_form_the_state_arsenals_desc:0 "Ordumuzu modern silahlarla tedarik etmek için, özel şirketlerin gerekli üretim kapasitelerini geliştirmesini bekleyemeyiz."
 FRA_france_leads:0 "Fransa Liderlik Ediyor"
 FRA_france_leads_desc:0 "Fransa gibi gururlu bir tarihe sahip bir ulus, dış politikasını başka ülkelerin dikte etmesine izin veremez. Kendi çıkarlarımız tarafından yönlendirilen kendi seçimlerimizi yapacağız."
 FRA_france_undividable_desc:0 "Fransa, tek bir bayrak altında tek bir birim olarak oluşturulmalıdır. Sadece bölünme korkularını gidermek için bile olsa, bunu açıkça kabul etme zamanı geldi."
 FRA_franco_soviet_treaty:0 "Fransız-[SOV.GetAdjective] Antlaşması"
 FRA_franco_soviet_treaty_desc:0 "[SOV.GetAdjective]ler de bizim kadar Avrupa'da faşizmin yükselişinden endişeli. Belki de zamanı geldiğinde bizi desteklemeleri için onları ikna edebiliriz."
 FRA_freedom_front:0 "Özgürlük Cephesi"
 FRA_freedom_front_desc:0 "Komünistlerin vaat ettiği kaos ve kargaşa ile karşı karşıya kalındığında, kişisel olarak kınanabilir bulabileceğiniz diğer partilerle bile ittifak yapmaya istekli olunmalıdır."
 FRA_french_forces_of_the_interior:0 "İç Fransız Kuvvetleri"
 FRA_french_forces_of_the_interior_desc:0 "Direnişin Fransa genelinde binlerce silahlı adamı var. Biz ve müttefiklerimiz ülke genelinde ilerlerken, onları toplayıp ordumuzda askerlere dönüştüreceğiz."
 FRA_french_forces_of_the_interior_tt:0 "Kurtarılan her çekirdek eyalette zayıf piyade birlikleri oluşturur."
 FRA_french_union:0 "Fransız Birliği"
 FRA_french_union_desc:0 "Yeni bir Fransa, dünyayı kapsayan, egemenliğimizin tüm parçalarının birleştiği bir Fransa ilan etme zamanı geldi. Her parçada halkın bu yeni, daha büyük Fransa'nın bir parçası olma iradesini doğrulamak için referandumlar düzenleyeceğiz."
 FRA_french_union_tt:0 "Sömürge imparatorluğumuzun çeşitli yerlerinde referandumlar düzenlenecektir. Bazı kısımlar bunun yerine tamamen bağımsız olmayı seçebilir."
 FRA_fusiliers_marine:0 "Fusiliers Marins"
 FRA_fusiliers_marine_desc:0 "Kıyıların aşılmaz savunmalar olduğu günler sona erdi. Gelecekte, nerede olursa olsun savaşı düşmana götürebilmeli ve her türlü muhalefete karşı bir çıkarma alanı ele geçirebilmeliyiz."
 FRA_general_work_council:0 "Genel İş Konseyi"
 FRA_general_work_council_desc:0 "İşverenler ve çalışanlar arasındaki anlaşmazlıkları ele almak ve işçilerimizin mümkün olan en verimli şekilde istihdam edilmesini sağlamak için ulusal bir ajans oluşturacağız."
 FRA_global_integration:0 "Küresel Entegrasyon"
 FRA_global_integration_desc:0 "Britanya İmparatorluğu, karşılıklı olarak birbirini destekleyen parçalardan oluşan ince ayarlı bir sistemdir. Sömürgelerimizle aynı derecede iyi yapamayacağımızı söyleyen hiçbir şey yok."
 FRA_grow_the_empire:0 "İmparatorluğu Büyüt"
 FRA_grow_the_empire_available_tt:0 "Aşağıdaki bölgelerin tümü, §Y[ROOT.GetNameWithFlag]§! ülkesine bağlı olan §Y[BEL.GetNameWithFlag]§! veya §Y[COG.GetNameWithFlag]§! tarafından kontrol edilmelidir:\n§Y$STATE_295$\n$STATE_538$\n$STATE_718$\n$STATE_769$\n$STATE_768$\n$STATE_890$\n$STATE_888$\n$STATE_889$§!\n"
 FRA_grow_the_empire_desc:0 "Belçika büyüklüğünde bir ülkenin, kendi boyutunun kat kat fazlası bir sömürgeyi elinde tutmasına izin verilmesi saçmadır. Böyle bir toprağı yönetmek için biz çok daha uygunuz."
 FRA_guarantee_the_constitution:0 "Anayasayı Garanti Et"
 FRA_guarantee_the_constitution_desc:0 "Cumhuriyetçi basın, kraliyet yönetiminin meşruiyetine karşı asılsız kampanyalarını başlatamadan önce, halkın bireysel haklarına saygı gösterme konusunda demir gibi garantiler vererek onların duruşunu aşındırmalıyız."
 FRA_host_the_german_exiles:0 "Alman Sürgünleri Misafir Et"
 FRA_host_the_german_exiles_desc:0 "Marx ve Engels'in evi olan Almanya, bir zamanlar komünist düşünce ve pratiğin ön saflarındaydı. Naziler iktidara geldiğinde birçok Alman komünist kaçtı. Eğer onlara bir yuva verirsek, kurtarılmış toprakların daha etkili bir hükûmetini organize etmemize yardımcı olabilirler."
 FRA_industrial_collectivization:0 "Sanayi Kolektifleştirmesi"
 FRA_industrial_collectivization_desc:0 "Bugünkü Fransız ekonomisi, az çalışanı olan, sonsuza dek birbirleriyle rekabet eden ve verimsiz küçük ölçekli üretimde kaynakları tüketen küçük şirketlerden oluşuyor. Dünya sahnesinde rekabet edebilecek şirketler yaratmak için nihayet bu küçük şirketleri birleştireceğiz."
 FRA_industrial_expansion_effect_tt:0 "Daha önce yatırım yapılan metropol eyaletlerine iki §YSivil Fabrika§! ekler.\n"
 FRA_infantry_tanks:0 "Piyade Tankları"
 FRA_infantry_tanks_desc:0 "Ne olursa olsun, tankların ilk ve son görevi, piyadenin araziyi alıp elinde tutmasını sağlamaktır. Bu nedenle, piyade birimlerimizi her zaman modern, yetenekli tanklarla donatmalıyız."
 FRA_integralism:0 "Entegralizm"
 FRA_integralism_desc:0 "Entegralizm ideolojisi, toplumun tüm yönlerinin bir araya gelip daha büyük bir bütünün küçük bir parçasıymış gibi çalışması gerektiğini belirtir. Bu toplum, tüm parçalarının uyum içinde birlikte çalışmasını sağlamak için iyi düzenlenmelidir."
 FRA_intervention_in_central_africa:0 "Orta Afrika'ya Müdahale"
 FRA_intervention_in_central_africa_desc:0 "Orta Afrika, müttefik savaş çabası için hayati önem taşır ve bizim için önemli bir propaganda darbesi olarak ele geçirilebilir."
 FRA_intervention_in_greece:0 "Yunanistan'a Müdahale"
 FRA_intervention_in_greece_desc:0 "Yunanistan, Akdeniz'deki en değerli topraklardan bazılarını kontrol ediyor. Düşmanca bir hükûmetin onun kontrolüne sahip olmasına izin veremeyiz ve bu yüzden önce biz hareket etmeliyiz."
 FRA_intervention_in_indochina:0 "Hindiçin'e Müdahale"
 FRA_intervention_in_indochina_desc:0 "Avrupa'daki savaştan çok uzakta olan Hindiçin'deki sömürgelerimiz, bölgedeki çıkarlarımızı savunmamıza yardımcı olmak için ideal bir alandır."
 FRA_intervention_in_madagascar:0 "Madagaskar'a Müdahale"
 FRA_intervention_in_madagascar_desc:0 "Eğer düşmanın Madagaskar'ı alıp tahkim etmesine izin verilirse, Hint Okyanusu'nda felaketle karşı karşıya kalırız. Hızlı ve kararlı bir eylem, adanın bizim tarafımızda kalmasını sağlayabilir."
 FRA_intervention_in_north_africa:0 "Kuzey Afrika'ya Müdahale"
 FRA_intervention_in_north_africa_desc:0 "Kuzey Afrika, anavatanı geri almak için bir işgal için mümkün olan en iyi hazırlık alanını sunuyor. Onu bizim tarafımıza çevirmek, kurtuluş kampanyamız için hayati önem taşır."
 FRA_intervention_in_spain:0 "İspanya'ya Müdahale"
 FRA_intervention_in_spain_desc:0 "İspanya'daki iç savaş, ideolojiler arasındaki çatışmayı kapımıza kadar getirdi. Çatışmanın ülkemize sıçramaması için dikkatli davranmalıyız."
 FRA_intervention_in_syria:0 "Suriye'ye Müdahale"
 FRA_intervention_in_syria_desc:0 "Suriye'deki stratejik toprakları düşmana vermemek, Süveyş kanalını korur ve doğu Akdeniz'deki durumumuzu önemli ölçüde iyileştirir."
 FRA_intervention_in_west_africa:0 "Batı Afrika'ya Müdahale"
 FRA_intervention_in_west_africa_desc:0 "Batı Afrika, anavatanlarımızı geri almak için yeni bir orduya askere alınabilecek milyonlarca sakine ev sahipliği yapıyor."
 FRA_invest_in_indochina:0 "Hindiçin'e Yatırım Yap"
 FRA_invest_in_indochina_desc:0 "Hindiçin'deki mülklerimizle anavatanımız arasındaki uzun mesafe bir dezavantaj gibi görünebilir, ancak aynı zamanda oradaki herhangi bir sanayiyi düşman saldırısından korur."
 FRA_invest_in_our_weaker_allies:0 "Daha Zayıf Müttefiklerimize Yatırım Yap"
 FRA_invest_in_our_weaker_allies_desc:0 "Eğer savaş durumunda yetenekli müttefiklere sahip olacaksak, onların kendi askeri ihtiyaçlarını karşılamalarını sağlamalıyız. Sanayilerine yapılacak ılımlı yatırımlar programı, ihtiyaç duydukları mühimmatı yerel olarak üretmelerine olanak tanıyacaktır."
 FRA_invest_in_our_weaker_allies_trigger_tt:0 "Bizden daha az askeri fabrikası var"
 FRA_invest_in_syria:0 "Suriye'ye Yatırım Yap"
 FRA_invest_in_syria_desc:0 "Suriye, Avrupa veya Afrika'da bir savaş durumunda bizi ikmal etmek için mükemmel bir konumdadır. Endüstriyel potansiyelini artırmak, bölgedeki konumumuzu da destekleyecektir."
 FRA_invest_in_the_colonies:0 "Sömürgeleri Geliştir"
 FRA_invest_in_the_colonies_desc:0 "Avrupa'daki endüstriyel merkezlerimiz, büyük bir endüstriyel genişlemeyi sürdürmek için nüfusa ve kaynaklara sahip değil. Eğer ekonomimiz dünyanın geri kalanıyla rekabet edecekse, sömürgelerimizi kullanmalıyız."
 FRA_invest_in_the_metropole:0 "Anakarayı Geliştir"
 FRA_invest_in_the_metropole_desc:0 "Sanayilerimizi yeniden inşa etmedeki ilk adımımız, kıtasal mülklerimizdeki endüstriyel tabanımızı iyileştirmek olmalıdır."
 FRA_invest_in_west_africa:0 "Batı Afrika'ya Yatırım Yap"
 FRA_invest_in_west_africa_desc:0 "Batı Afrika'daki geniş işçi ve kaynak rezervleri, onu yatırım için mükemmel bir aday yapar."
 FRA_invite_anti_fascist_emigrants:0 "Anti-Faşist Göçmenleri Davet Et"
 FRA_invite_anti_fascist_emigrants_desc:0 "Her faşist rejimin attığı ilk adım, eleştirmenlerini ve ülkenin nasıl organize edilebileceğine dair alternatif bir vizyon sunabilecek insanları sürgün etmektir. Ancak, bu insanlar aynı zamanda ülkeleri kurtarıldığı güne hazırlanmak için bir sürgün hükûmeti kurmaya da mükemmel bir şekilde uygundur."
 FRA_invite_communist_ministers:0 "Komünist Bakanları Davet Et"
 FRA_invite_communist_ministers_desc:0 "Radikal sağın tepkisinden korkmak, komünistlerin gerçek hükûmete dahil edilmesini engelledi. Ama korku kötü bir danışmandır. Eğer bu çatışmayı yaşayacaksak, bırakın gelsinler."
 FRA_invite_portugal:0 "Portekiz'i Davet Et"
 FRA_invite_portugal_desc:0 "Sömürge imparatorluğu çok azalmış olsa da, keşif ve fetih ateşi her Portekizlinin kalbinde hala yanıyor."
 FRA_je_suis_la_deluge:0 "Je Suis Le Déluge"
 FRA_je_suis_la_deluge_desc:0 "Fransız devrimi, Avrupa'yı çok uzun zamandır kontrol eden eski ve zayıf rejimleri silip süpüren tufandı. Şimdi, yeni bir tufan burada."
 FRA_join_the_ententes:0 "İtilaflara Katıl"
 FRA_join_the_ententes_desc:0 "Fransa aynı anda iki karşılıklı savunma taahhüdünü sürdüremez. Eğer İngilizleri bizim taahhütlerimizi de onurlandırmaya ikna edemezsek, bir seçim yapmak zorunda kalırız. Farklı ittifak ağlarımızı tek bir bütün halinde birleştirerek, ittifaklarımızın caydırıcılık faktörünü bir kat daha artırırız."
 FRA_laissez_faire:0 "Laissez-Faire"
 FRA_laissez_faire_desc:0 "Komünistler, ülkemizin ekonomik yapısını radikal bir şekilde yeniden modellemekten, çalışkan insanın haklı mülkünden mahrum bırakmaktan açıkça bahsediyorlar. Buna karşı, basit özgürlük nosyonunu ortaya koyacağız. Dinamik bir ekonomi, her zaman boğucu bir kırmızı bürokrasi solcu kabusundan daha iyi performans gösterecektir."
 FRA_laissez_faire_tt:0 "Ekonomimiz yaklaşık iki yıllık bir sürenin ardından daha verimli hale gelecektir."
 FRA_latin_entente:0 "Latin İtilafı"
 FRA_latin_entente_desc:0 "Roma İmparatorluğu'nun halef devletleri arasında var olan kardeşlik yadsınamaz. Avrupa'nın Cermen halkları kıtayı çok uzun zamandır yönetti. Ulusal doğum hakkımızı geri alma zamanı geldi."
 FRA_league_of_french_bolshevist_volunteers_desc:0 "Bir sosyalist ülke bir yabancı işgalci tarafından tehdit edildiğinde, tüm sosyalist ülkeler tehdit altındadır. Yoldaşlarımız hayatları için savaşırken boş durmamalıyız."
 FRA_legal_equality:0 "Yasal Eşitlik"
 FRA_legal_equality_desc:0 "Önemli olan her yönden, kadınlar hala ikinci sınıf vatandaş olarak kabul ediliyor, her zaman bir erkeğin iradesine tabi. Bu saçmalık şimdi sona eriyor."
 FRA_loyalty_to_moscow:0 "Moskova'ya Sadakat"
 FRA_loyalty_to_moscow_desc:0 "Sovyetler Birliği'nde uygulanan Sosyalizm modeli mükemmel olmayabilir, ancak Sovyetler Birliği'nin sosyalist fikirlerin en yüksek derecede uygulanmasını başardığı makul şüphenin ötesindedir. Kendi yolumuzu bulmaya çalışmak aptallık olur."
 FRA_loyalty_to_the_cause:0 "Davaya Sadakat"
 FRA_loyalty_to_the_cause_desc:0 "Diğer ülkeler kendi Komünizm vizyonlarını formüle edebilirler, ancak bizimkinden taviz vermemiz için hiçbir neden yok. Onlar yarı yolda durmuş, sonun araçları haklı çıkarıp çıkarmadığı konusunda şüpheye düşmüş olabilirler. Biz durmayacağız."
 FRA_methodical_battle:0 "Metodik Savaş"
 FRA_methodical_battle_desc:0 "Bazıları savaşın kaos olduğunu iddia eder, ama onlar aptaldır. Bir savaş, genel plana dayalı olarak doğru araçların metodik uygulamasından başka bir şey değildir. İyi plan yapın ve düşmanın niyetleri tarihi bir dipnot kadar önemsiz olabilir."
 FRA_military_factories_effect_tt:0 "Daha önce yatırım yapılan her eyalete iki §YAskeri Fabrika§! ekler.\n"
 FRA_national_champions:0 "Ulusal Şampiyonlar"
 FRA_national_champions_desc:0 "Küresel düzeyde rekabet etme potansiyeline sahip birkaç şirket seçerek ve onları en yüksek derecede destekleyerek, diğer herhangi birine eşit modern bir ekonomi yaratabiliriz."
 FRA_national_council_of_the_resistance_desc:0 "Fransa'da direniş giderek güçleniyor ve o kadar güçlü hale geldi ki, faaliyetlerini koordine etmek için yeni bir yönlendirme komitesine ihtiyaç duyuyor."
 FRA_national_regeneration:0 "Ulusal Yenilenme"
 FRA_national_regeneration_desc:0 "Aşırı demokrasi ve yanlış yönlendirilmiş cumhuriyetçilik ülkemizi zehirledi ve halkımızı böldü. Bu yaraları sarmak uzun zaman alacak, ama nihayet ilk adımlar atıldı."
 FRA_national_regeneration_trigger_tt:0 "Tarafsız ve Faşist desteğin toplamı %50'nin üzerinde"
 FRA_national_uprising_desc:0 "Saat geldi. Şimdi silahları alıp bunca yıldır sizi gizleyen gölgelerden çıkma zamanı!"
 FRA_nationalize_key_industry:0 "Kilit Sanayileri Millileştir"
 FRA_nationalize_key_industry_desc:0 "Mevcut durumda, yaklaşan tehdidi karşılamak için ekonomimizi radikal bir şekilde yeniden yapılandırmaktan çekinmemeliyiz. Zaman az - serbest piyasanın sorunu çözmesini bekleyemeyiz."
 FRA_naval_rearmament:0 "Donanma Yeniden Silahlanması"
 FRA_naval_rearmament_desc:0 "Gemi inşa sanayimiz, diğer alanlardaki gelişmelere ayak uydurmaya odaklanırken ihmal edildi. Sonuç olarak, şimdi Akdeniz ve Atlantik'teki rakiplerimiz tarafından geride bırakılma tehlikesiyle karşı karşıyayız. Kaybedilen zamanı telafi etmek için daha fazla yatırım yapmalıyız."
 FRA_no_further_humiliations:0 "Daha Fazla Aşağılanmaya Hayır"
 FRA_no_further_humiliations_desc:0 "Yıllardır, ardı ardına gelen cumhuriyetçi hükûmetler, Almanların uluslararası antlaşmaları çiğnemesine izin verdi, bunlardan bazıları mürekkebi kurumadan küstahça bozuldu. Bu şimdi sona eriyor."
 FRA_orleanist_restoration:0 "Orléans Restorasyonu"
 FRA_orleanist_restoration_desc:0 "Orléans Hanedanı, Fransa'daki kraliyetçiler arasında önemli bir desteğe sahiptir. Bazı muhalifler taht için farklı bir adayı tercih etse de, Orléans varisinin ülkeyi arkasında barışçıl bir şekilde birleştirme şansının en iyi olduğuna şüphe yoktur."
 FRA_political_unity:0 "Siyasi Birlik"
 FRA_political_unity_desc:0 "Mutlakiyetçiliğin çöküşünden bu yana Fransa tarihi, bir siyasi iç çekişme hikayesi olmuştur. Birlik olduğunda - Fransa galip geldi. İç çekişme olduğunda - Fransa yenildi. Bu nedenle, azınlığın hırslarının çoğunluğun geçimini zedelemesine izin veremeyiz."
 FRA_pre_empt_the_fascist_attack:0 "Faşist Saldırıyı Önle"
 FRA_pre_empt_the_fascist_attack_desc:0 "Neden düşmanın barış içinde hazırlanmasına ve kaçınılmaz saldırının en uygun olduğu anı seçmesine izin verelim? Önce biz vuracağız ve bu tehdidi hazırlanmaya vakti olmadan ezeceğiz."
 FRA_pre_empt_the_fascist_attack_tt:0 "§YHükümet'i devirme§!tüm §Ykomşu faşist ülkelere§! karşı savaş hedefi kazanır."
 FRA_prioritize_the_joffre:0 "Joffre'a Öncelik Ver"
 FRA_prioritize_the_joffre_desc:0 "Mevcut uçak gemisi filomuz umutsuzca güncelliğini yitirmiş ve herhangi bir potansiyel düşman tarafından geride bırakılmıştır. Yeni bir uçak gemisi projesine en yüksek önceliğin verildiğinden emin olmalıyız."
 FRA_prioritize_the_joffre_tt:0 "İnşaat kuyruğuna %40 tamamlanmış modern bir §YUçak Gemisi§! ekler."
 FRA_proclaim_the_third_empire:0 "Üçüncü İmparatorluğu İlan Et"
 FRA_proclaim_the_third_empire_desc:0 "Bonapartistler taht mücadelesinde dışlanmış sayılabilir, ancak onlarla birlikte tüm Avrupa'nın Fransızların İmparatoru'na boyun eğdiği bir zamanın hayalini taşıyorlar."
 FRA_promote_entrepeneurship:0 "Girişimciliği Teşvik Et"
 FRA_promote_entrepeneurship_desc:0 "Dinamik bir piyasanın atan kalbi, her zaman bir fırsat gördüğünde onu sömürmek için hızla hareket eden birey olmuştur. Son yıllarda, bu ruh gereksiz düzenlemelerle boğulmuştur. Onları geri almalıyız."
 FRA_protect_the_rights_of_man:0 "İnsan Haklarını Koru"
 FRA_protect_the_rights_of_man_desc:0 "Asla açıkça söylemeseler de, görebilen herkes için aşikardır: mülkiyet hakkını kısıtlamak, gururlu atalarımızın uğruna savaştığı tüm hakları ortadan kaldırmanın sadece ilk adımıdır. Buna izin vermeyeceğiz!"
 FRA_public_welfare:0 "Kamu Refahı"
 FRA_public_welfare_desc:0 "Tebaasının en küçüğü için çalışmayan bir kral, hiç kral değildir."
 FRA_ratify_the_stresa_front:0 "Stresa Cephesini Onayla"
 FRA_ratify_the_stresa_front_desc:0 "İtalya, Afrika'daki topraklar karşılığında ittifakımıza katılacağını belirtti. Kalemi kağıda koyma ve gerekli antlaşmaları onaylama zamanı geldi."
 FRA_reach_out_to_spain:0 "İspanya'ya Ulaş"
 FRA_reach_out_to_spain_desc:0 "İç savaşından yeni toparlanmış olan İspanya, kıtayı yeniden şekillendirme girişimimizde doğal müttefikimizdir."
 FRA_reach_out_to_trade_unions:0 "Sendikalara Ulaş"
 FRA_reach_out_to_trade_unions_desc:0 "Eğer şimdi düşman tarafından hizmete sokulan sanayilere karşı saldıracaksak, oradaki işçilerle iyi iletişim kurmak en iyi yol gibi görünüyor. Herhangi bir dış güçten çok daha verimli bir şekilde, gerçekleşen herhangi bir üretimi geciktirebilir veya sabote edebilirler."
 FRA_reconciliation:0 "Uzlaşma"
 FRA_reconciliation_desc:0 "Geçmişte, Fransız devrimleri ülkeyi çok sık olarak sonsuz devrimci ve karşı-devrimci terör spazmlarına sürükledi. Belki de herkesin bir yeri olduğu, devrimi desteklesin ya da desteklemesin, bir cumhuriyet kurma zamanı gelmiştir."
 FRA_reconnect_to_the_balkans:0 "Balkanlarla Yeniden Bağlantı Kur"
 FRA_reconnect_to_the_balkans_desc:0 "Fransa, orta Avrupa'nın güçlerini dengelemek için uzun süredir Balkan ülkelerine ulaştı. Bu bağlantı, daha yakın zamanda ihmal edilmiş olsa da hala oradadır."
 FRA_reform_the_labour_laws:0 "İş Kanunlarını Reform Et"
 FRA_reform_the_labour_laws_desc:0 "Fransa işçileri düşük ücret ve az sosyal haklarla ağır koşullar altında çalışıyor. Onların durumunu iyileştirmek için kapsamlı bir reform paketi uygulama zamanı geldi."
 FRA_refus_absurde:0 "Refus Absurde"
 FRA_refus_absurde_desc:0 "Yenilgi anında bile, direnme iradesi bazı kalplerde güçlü kalır. İşgal altındaki topraklardaki direniş hareketinin temelini onlar oluşturacaktır."
 FRA_reorganize_the_aviation_industry:0 "Havacılık Sanayisini Yeniden Düzenle"
 FRA_reorganize_the_aviation_industry_desc:0 "Onlarca küçük şirkete bölünmüş olan havacılık sanayimiz, Almanya ve ABD'deki sanayinin on yıllarca gerisindedir. Radikal bir yeniden yapılanma gereklidir."
 FRA_reorganize_the_dutch:0 "Hollandalıları Yeniden Düzenle"
 FRA_reorganize_the_dutch_desc:0 "Hollandalılar da bir zamanlar Fransız İmparatorluğu'nun bir parçasıydı. Şimdi yenildiklerine göre, işlerin bu doğal haline dönme zamanı geldi."
 FRA_repeal_the_law_of_exile:0 "Sürgün Yasasını Kaldır"
 FRA_repeal_the_law_of_exile_desc:0 "Hiçbir Fransız kraliyet ailesi başkanının veya varisinin, açık izin olmaksızın Fransız topraklarında bulunmasına izin verilmez. Monarşinin muzaffer dönüşünü yaşamadan önce, bu can sıkıcı küçük engeli ortadan kaldırmalıyız."
 FRA_retribution_for_sedan:0 "Sedan için İntikam"
 FRA_retribution_for_sedan_desc:0 "Yarım asırdan fazla bir süredir Almanlar, Sedan Savaşı'nı ve orada Üçüncü Napolyon'a karşı kazandıkları zaferi kutladılar. Gelecekte, her Alman o yerin adını lanetlemeyi öğrenecek."
 FRA_return_to_borodino:0 "Borodino'ya Dönüş"
 FRA_return_to_borodino_desc:0 "Borodino'da, Napolyon Avrupa'daki zaferine en çok yaklaştı. Rus Ordusu neredeyse yok edilmişti ve eğer biraz daha hızlı olsaydı, Rusları anlaşmaya zorlayabilirdi. Bunun yapılabileceğini dünyaya göstereceğiz."
 FRA_review_foreign_policy:0 "Dış Politikayı Gözden Geçir"
 FRA_review_foreign_policy_desc:0 "1919'da kurulan kıtasal düzen giderek daha fazla tehdit altında görünüyor. Yaklaşan fırtınayı atlatmak için yeni ittifaklar sağlamak amacıyla dış politika seçeneklerimizi gözden geçirme zamanı geldi."
 FRA_revise_the_constitution:0 "Anayasayı Gözden Geçir"
 FRA_revise_the_constitution_desc:0 "Cumhuriyet anayasası her zaman çok uzun süre devam etmesine izin verilen bir ara çözüm olarak tasarlanmıştı. Şimdi, bir hükümdarın geri dönmesine izin vermek için onu yeniden yazacağız."
 FRA_revive_the_franco_polish_alliance:0 "Fransız-Polonya İttifakını Canlandır"
 FRA_revive_the_franco_polish_alliance_desc:0 "Fransa her zaman bağımsız bir Polonya'yı desteklemiştir. Son yıllarda, ülkelerimiz arasındaki ilişkiler biraz soğudu. Ufukta Almanya tehdidi varken, paktımızı yeniden alevlendirme zamanı geldi."
 FRA_revive_the_franco_polish_alliance_tt:0 "\nEğer kendi ittifakımızın lideri olsaydık, Polonya ittifakımıza davet edilirdi."
 FRA_revive_the_national_bloc:0 "Ulusal Bloku Canlandır"
 FRA_revive_the_national_bloc_desc:0 "Siyasi manzara her geçen gün daha da radikalleşiyor. Sol, komünistlerle ortak dava yapmaktan fısıldıyor. Şimdi ihtiyaç duyulan şey, güçlü, istikrarlı bir liderliktir."
 FRA_revolution_to_the_utmost:0 "Devrim Sonuna Kadar"
 FRA_revolution_to_the_utmost_desc:0 "Yarım bırakılmış bir devrim hiç devrim değildir. İş bitene ve yeni siyasi sistem güvende olana kadar durmamalıyız. Bedeli ne olursa olsun."
 FRA_revolutionary_zeal_desc:0 "Fransız halkı her zaman eski düzeni ortadan kaldırmak ve yenisini yükseltmek için özel bir şevke sahip olmuştur. Bu cesaretlendirilmemelidir."
 FRA_rush_the_richelieus:0 "Richelieu'leri Aceleye Getir"
 FRA_rush_the_richelieus_desc:0 "Avrupa'daki durum giderek daha umutsuz hale gelirken, yeni yüzey birimlerimizi geleneksel yollarla inşa etmek için zamanımız yok. Yeni zırhlılarımızı mümkün olan en kısa sürede hizmete sokmak için malzemelere öncelik vermeliyiz."
 FRA_secure_the_crown_of_spain:0 "İspanya Tacını Güvence Altına Al"
 FRA_secure_the_crown_of_spain_desc:0 "Kralın doğuştan gelen haklarını talep etmenin ilk adımı, İspanya'yı ortaya çıkan çeşitli sahte hükûmetlerden güvence altına almaktır. Onların küçük çekişmeleri ülkeyi zaten bir kez kanlı bir iç savaşa sürükledi - bir daha yapmalarına izin vermemeliyiz."
 FRA_slum_clearing:0 "Gecekondu Temizliği"
 FRA_slum_clearing_desc:0 "Dünyanın büyük güçlerinden birinde olmasına rağmen, basit Fransız işçisi genellikle iğrenç sefalet içinde korkunç koşullarda yaşıyor. Unvanına layık hiçbir kral, tebaasının böyle bir durumda yaşamasına tahammül edemez."
 FRA_special_forces:0 "Özel Kuvvetler"
 FRA_special_forces_desc:0 "Gelecekte, savaş giderek daha fazla normal piyadenin sınırına ulaşacağı alanlarda yapılacaktır. Bu koşullarda performans gösterebilecek yeni ve daha yetenekli oluşumlar yaratmalıyız."
 FRA_split_belgium:0 "Belçika'yı Böl"
 FRA_split_belgium_desc:0 "Belçika artık nüfuz alanımızda olduğuna göre, onun Fransızca konuşan kısımlarını yuvaya çağırma zamanı geldi. Geri kalanı yeni bir devlet olarak oluşturulacak."
 FRA_stimulate_the_dynamic_market:0 "Dinamik Piyasayı Canlandır"
 FRA_stimulate_the_dynamic_market_desc:0 "Dinamik piyasanın en verimli ekonomik örgütlenme biçimi olduğu kanıtlanmıştır. Ama hala insanlar tarafından yönetiliyor ve insanlar bazen sıkı çalışmalarının boşa gitmeyeceğine dair bazı güvencelere ihtiyaç duyarlar. Bazı kısıtlamaları yasayla kaldırarak ve garantiler vererek, yatırımcıların korkularını yenmelerine ve ekonomimizi canlandırmamıza yardımcı olabiliriz."
 FRA_strengthen_the_little_entente:0 "Küçük İtilaf'ı Güçlendir"
 FRA_strengthen_the_little_entente_desc:0 "Küçük İtilaf, bizi Doğu Avrupa ve Balkanlar'daki müttefiklerimizin yardımına gelmeye mecbur kılıyor. Bu ittifakın zayıflamasına izin verdik, ama şimdi her zamankinden daha çok ihtiyaç var. Onu canlandırma zamanı geldi."
 FRA_strengthen_the_unions:0 "Sendikaları Güçlendir"
 FRA_strengthen_the_unions_desc:0 "Çok uzun zamandır, bireysel işçinin yoldaşlarıyla bir araya gelerek toplu pazarlık yapma hakkı saldırıya açık bırakıldı. Artık değil."
 FRA_support_the_finns:0 "Finleri Destekle"
 FRA_support_the_finns_desc:0 "Finler hayatları için savaşıyor. Onlara yardım etmeliyiz."
 FRA_surface_combat:0 "Yüzey Muharebesi"
 FRA_surface_combat_desc:0 "Topçuluktaki ilerlemelerle, başka bir ana gemiyle uzun süreli bir slugging maçından sağ çıkmayı umabilecek bir gemi inşa etmek neredeyse imkansız hale geldi. Düşmanı kitlesel torpido salvolarıyla ezmek için modern muhriplerden ve torpido botlarından oluşan bir filoya sahip olmak çok daha iyidir."
 FRA_the_blum_viollette_proposal:0 "Blum-Viollette Teklifi"
 FRA_the_blum_viollette_proposal_desc:0 "Fransız Cumhuriyeti vatandaşlığı, nitelikli herkese açık olmalıdır. Cezayir'deki sadık tebaamızın çoğu tam vatandaş olmak istiyor, ancak henüz buna izin verilmiyor. Onları tam vatandaş yaparak, Cezayir'i Fransa'ya çok daha yakından bağlardık."
 FRA_the_civil_and_military_organization:0 "Sivil ve Askeri Örgüt"
 FRA_the_civil_and_military_organization_desc:0 "Direniş eylemleri yürüten birçok küçük grup, daha büyük bir örgüt oluşturmak için bir araya geliyor. Buna onayımızı vermeliyiz."
 FRA_the_congress_of_paris:0 "Paris Kongresi"
 FRA_the_congress_of_paris_desc:0 "Berlin Kongresi'nde, Afrika'nın sınırları şekillendi. Ama bugünkü harita bir yama işi gibi görünüyor. Haritayı yeniden çizme ve böylece yeni bir sömürge imparatorluğunun temelini oluşturma zamanı geldi."
 FRA_the_council_of_rambouillet:0 "Rambouillet Konseyi"
 FRA_the_council_of_rambouillet_desc:0 "Ülke kargaşa içindeyken, halk güçlü bir lider arıyor. Cumhuriyetçiliğin Fransız halkını hayal kırıklığına uğrattığı açıkça ortaya çıktı ve Fransa'nın doğal yöneticilerinin geri dönme zamanı geldi. Ama önce, monarşinin restorasyonu için zemin hazırlanmalı."
 FRA_the_first_citizen_of_the_state:0 "Devletin Birinci Vatandaşı"
 FRA_the_first_citizen_of_the_state_desc:0 "Kral, önemli bir güce sahip olsa da, asla eski türden bir tiran veya mutlakiyetçi bir hükümdar olarak görülmemelidir. Bunun yerine, modern bir hükümdar yasalara saygı duymalı ve iktidarı yasadışı olarak gasp edecek olanlara karşı ilk savunma hattı olmalıdır."
 FRA_the_free_french_navy:0 "Özgür Fransız Donanması"
 FRA_the_free_french_navy_desc:0 "Müttefiklerimiz hayatta kalmak için umutsuz bir mücadele içinde kilitlenmiş durumdalar ve bunun için deniz yolları hayati önem taşıyor. Onlara yardım etmek için üzerimize düşeni yapmalıyız."
 FRA_the_legitimate_heir:0 "Meşru Varis"
 FRA_the_legitimate_heir_desc:0 "Meşrutiyetçiler, Karlist kolunu Fransa tahtının meşru varisi olarak görmektedir. Adaylarını tahta atamak, İspanya ve Fransa'yı bir çifte monarşide yönetme gibi cazip bir olasılık sunar."
 FRA_the_maquis:0 "Maki"
 FRA_the_maquis_desc:0 "Fransa'nın kırsal alanları, işgalciden veya onların işbirlikçi uşaklarından kaçmak isteyen herkese sığınak sunar. Direniş eylemiyle emeğini düşmana vermeyi reddeden insanları desteklemeliyiz, böylece zamanla o alanları direniş yuvalarına dönüştürebiliriz."
 FRA_the_natural_borders_of_france:0 "Fransa'nın Doğal Sınırları"
 FRA_the_natural_borders_of_france_desc:0 "Bir ülkenin önce kendi çıkarlarına bakması doğaldır. Mücadelemizde Almanlarla barış içinde bir arada var olamayız ve bu yüzden anavatanlarımızı savunmak için doğal sınırlarımızı güvence altına almalıyız."
 FRA_the_old_school:0 "Eski Ekol"
 FRA_the_old_school_desc:0 "Donanma teknolojisindeki tüm ilerlemelere rağmen, deniz gücünün kilit unsuru hala diğer filo birimlerinin desteğiyle hareket eden ana gemidir. Bu ana gemi hala zırhlı mı yoksa yeni uçak gemisi mi olursa olsun, diğer deniz güçleriyle başa çıkabildiğimizden emin olmak için gemi inşa sanayimizin boyutunu daha da artırmalıyız."
 FRA_the_regiment_normandie:0 "Normandiya Alayı"
 FRA_the_regiment_normandie_desc:0 "Biz Fransızların tüm cephelerde savaşıyor olarak görülmesi hayati önem taşır. Sovyetler şimdi ortak düşmanımıza karşı savaşa girdiğine göre, onlara yardım etmek için küçük bir avcı pilotu grubu gönderebiliriz."
 FRA_the_young_school:0 "Genç Ekol"
 FRA_the_young_school_desc:0 "Havacılık, denizaltılar ve torpidolardaki gelişmeler ana gemiyi geçersiz kılmıştır. Sınırlı donanma sanayimizle, modern deniz savaş alanının tehditlerine karşı çaresiz olan devasa yüzen kaleler inşa etmek için zaman ve para harcamayı göze alamayız. Bunun yerine, daha fazla küçük gemi inşa etmemize olanak tanıyan verimliliği artırmaya odaklanmalıyız."
 FRA_towards_a_new_europe:0 "Yeni bir Avrupa'ya Doğru"
 FRA_towards_a_new_europe_desc:0 "Fransa bir yol ayrımında. Kendimizi eski düzene zincirleyebilir veya yeniyi kucaklayabiliriz. Almanlar kıtayı yeniden yapmaya hazırlanırken, onların iyi tarafında olmak bizim için faydalı olacaktır."
 FRA_two_countries_two_crowns:0 "İki Ülke, İki Taç"
 FRA_two_countries_two_crowns_desc:0 "Ülkeleri birinin diğerinin tebaası olarak görmeyeceği bir şekilde birleştirmenin makul bir yolu yoktur. Bunun yerine krala her ikisini de kişisel, ancak yasal olmayan bir birlik içinde yönetmesini tavsiye edeceğiz."
 FRA_undersea_combat:0 "Denizaltı Muharebesi"
 FRA_undersea_combat_desc:0 "Denizaltı son on yılda olgunlaştı. Artık tüm yüzey gemilerine ölümcül bir tehdit oluşturuyor, aynı zamanda tespit edilmesi ve yok edilmesi giderek daha zorlaşıyor."
 FRA_unite_the_crowns:0 "Taçları Birleştir"
 FRA_unite_the_crowns_desc:0 "İspanya güvence altına alındığında, şimdi taçları birleştirebilir ve yeni bir krallık, Franko-İspanyol Krallığı yaratabiliriz."
 FRA_utilize_the_leagues:0 "Birlikleri Kullan"
 FRA_utilize_the_leagues_desc:0 "Siyasi şiddetin Fransa'da sıradan hale gelmesi üzücü bir gerçektir. Eğer ülke komünist devrim tehdidinden kurtulacaksa, komünist haydutlarla sokakta karşılaşabilecek ve karşılaşacak olan insanların yardımından çekinmemeliyiz."
 FRA_womens_suffrage_desc:0 "Defalarca haklarını kazanmak için barikatlarda savaşan Fransa'nın çalışkan kadınlarının seçimlerde oy kullanmalarına izin verilmemesi ne kadar absürtse o kadar da utanç vericidir. Bu adaletsizliği ortadan kaldıracağız."
 FRA_work:0 "İş"
 FRA_work_desc:0 "Zanaatkar, ekonominin en önemli bileşenidir. Doğru insanlar tarafından yönlendirildiğinde, emeğini ülkesinin hizmetine sunmaktan daha asil bir çağrı yoktur."
 POR_Spanish_Republic_SPD:0 "[SPD.GetFlag]§Y[SPD.GetNameDef]§!"
 POR_Spanish_Republic_SPR:0 "[SPR.GetFlag]§YCumhuriyetçi İspanya§!"
 POR_a_new_industry_desc:0 "Otomatik üretimdeki en son teknolojik gelişmeler sayesinde, yeni verimlilik seviyelerine ulaşmak için sivil tesislerimizi iyileştirmeye ve genişletmeye devam edebiliriz."
 POR_a_powerful_merchant_marine:0 "Güçlü Bir Ticaret Filosu"
 POR_a_powerful_merchant_marine_desc:0 "Ekonomimizin ihtiyaç duyduğu tüm kaynakları taşıyabilecek büyük bir ticaret filosu inşa etmemiz gerekiyor. Bu, daha küçük Tersanelerde ticari gemiler inşa ederek yapılabilir."
 POR_a_royal_wedding:0 "Bir Kraliyet Düğünü"
 POR_a_royal_wedding_desc:0 "Portekiz tahtının meşru varisi Dom Duarte Nuno de Braganza ile Brezilya tahtı talibinin kızı Orléans Prensesi Maria Francisca arasındaki bir evlilik, Portekiz ve Brezilya'daki Monarşist unsurları memnun edecektir."
 POR_advanced_artillery:0 "Gelişmiş Topçu"
 POR_advanced_artillery_desc:0 "Yeni topçu parçaları geliştirmeli ve birlikleri barajları daha verimli bir şekilde gerçekleştirme ve piyade ilerlemesini destekleme yolları konusunda eğitmeliyiz."
 POR_advanced_light_aircraft:0 "Gelişmiş Hafif Uçak"
 POR_advanced_light_aircraft_desc:0 "Havacılık ile ordunun diğer kolları arasındaki koordinasyon hayati önem taşır. Birliklerimizi desteklemek için modern uçaklar geliştirmek, savaştaki başarımızı önemli ölçüde artıracaktır."
 POR_air_naval_research:0 "Hava Deniz Araştırması"
 POR_air_naval_research_desc:0 "Büyüyen hava kuvvetlerimizi ve donanmamızı koordine etmenin yeni yollarını geliştirmek için en iyi pilotlarımızı ve deniz subaylarımızı bir araya getirmeliyiz."
 POR_allow_free_elections:0 "Serbest Seçimlere İzin Ver"
 POR_allow_free_elections_desc:0 "Birleşik Krallık'tan gelen nüfuz nihayet Portekiz'de yeşerdi ve halkımız çıkarlarını en iyi temsil edecek hükûmeti seçme hakkını talep ediyor."
 POR_annex_wargoal:0 "İlhak Et"
 POR_anti_fascism:0 "Anti-Faşizm"
 POR_anti_fascism_desc:0 "Faşizm davamız için büyük bir tehdittir ve bununla başa çıkılması gerekir. Dünyayı onun şeytani pençelerinden kurtarmak için her yolla savaşmalıyız."
 POR_anti_fascism_tt:0 "Büyük veya komşu Faşist uluslara karşı §YHükûmeti Devir§! savaş hedefi kazandırır:"
 POR_appease_monarchists:0 "Monarşistleri Yatıştır"
 POR_appease_monarchists_desc:0 "Ülkemizdeki monarşist unsurların desteğini kazanmak için, onları hükûmete dahil etmeli ve Monarşinin restorasyonunun gelecek için bir olasılık olduğu izlenimini vermeliyiz. Bu tavizler bize rejimin ihtiyaç duyduğu istikrarı ve desteği sağlayabilir."
 POR_armor_focus:0 "Zırhlı Odaklanması"
 POR_armor_focus_desc:0 "Savaş alanına hükmetmek için en iyi savaş makinelerine ihtiyacımız var. Zırhlı araçlarımızı üreten tesisleri genişletmeli ve daha fazla araştırmaya yatırım yapmalıyız."
 POR_army_reorganization:0 "Ordu Yeniden Düzenlemesi"
 POR_army_reorganization_desc:0 "Orduyu yeniden düzenlememiz, şişirilmiş subay sayısını ve verimsiz birimleri azaltmamız ve uygun bir askere alma sistemi kurmamız gerekiyor. Bu, modern bir ordunun temellerini yaratacaktır."
 POR_arsenal_do_alfeite:0 "Arsenal do Alfeite"
 POR_arsenal_do_alfeite_desc:0 "Ana önceliğimiz, uzak imparatorluğumuzu koruyabilecek güçlü bir Donanma inşa etmek olmalıdır. Daha büyük gemiler inşa etme kapasitesine ve bilgisine sahip olmalıyız. Lizbon'daki ana Donanma Tersaneleri genişletilmeli ve gemi inşa uzmanları işe alınmalıdır."
 POR_assist_the_requetes:0 "Requetélere Yardım Et"
 POR_assist_the_requetes_desc:0 "Portekiz ordusu ve hava kuvvetlerinden birkaç üye, Karlistlerin savaş çabalarını denetlemek ve liderlerine danışmanlık yapmak için İspanya'ya gönderilecek. Oradayken, her iki tarafın kullandığı savaş taktikleri hakkında da bilgi toplayacaklar."
 POR_atlantic_defense_strategy:0 "Atlantik Savunma Stratejisi"
 POR_atlantic_defense_strategy_desc:0 "Okyanusun ortasında izole edilmiş adalarımız kolayca tek tek alınabilir. Ancak doğru yatırımlarla, batmaz uçak gemilerine dönüştürülebilirler!"
 POR_battleship_effort:0 "Zırhlı Çabası"
 POR_battleship_effort_desc:0 "Eğer denizlerin kontrolünü ele geçirmek istiyorsak, birçok ülkenin donanmasının onlara baktığında titreyeceği güçlü modern zırhlıların üretimini artırmalıyız."
 POR_british_guns:0 "Britanya Silahları"
 POR_british_guns_desc:0 "Askeri sanayimiz modern savaş silahları üretmeye hazır değil. Onları Birleşik Krallık'ta satın almak için bir antlaşma imzalayabiliriz."
 POR_british_industrial_investments:0 "Britanya Sanayi Yatırımları"
 POR_british_industrial_investments_desc:0 "Sivil sanayimizin büyüyen ekonomimizin taleplerini karşılamak için genişletilmesi gerekiyor. Britanya hükûmeti, ideallerine daha yakın hizalanmamız koşuluyla ülkemize yeni bir yatırım yapmakla ilgileniyor..."
 POR_british_investment_in_mines:0 "Madenlere Britanya Yatırımı"
 POR_british_investment_in_mines_desc:0 "Britanya hükûmeti ülkemizdeki kaynakların sömürülmesine yatırım yapma ilgilerini gösterdi. Bu, maden çıkarma tesislerimizi ve Ar-Ge'deki ilerlemelerimizi iyileştirmek için değerli bir fırsat olabilir."
 POR_camisas_azuis:0 "Camisas Azuis"
 POR_camisas_azuis_desc:0 "Camisas Azuis, Nasyonal Sendikalistlerin silahlı milisiydi, ancak grup idealleri nedeniyle kınandı ve dağıtıldı. Mavi Gömleklilerin seferberliği ordumuza değerli bir insan gücü kaynağı sağlayacağından, bu örgütün yeniden kurulmasına izin vermeliyiz."
 POR_carrier_effort:0 "Uçak Gemisi Çabası"
 POR_carrier_effort_desc:0 "Modern uçakların oluşturduğu artan tehditle, uçak gemileri denizler için verilen savaşta giderek daha önemli hale geliyor."
 POR_colonial_army_desc:0 "Güçlü bir ulusa sahip olmak için sadece Metropol Ordusu'na güvenemeyiz. Sömürge birimleri kurmalı, onları silahlandırmalı ve modern savaşta savaşmak için eğitmeliyiz."
 POR_colonial_assimilation_policy_desc:0 "Diğer ülkelerin aksine, Portekiz ulusu ırkla değil, paylaşılan kültürü ve medenileştirme misyonuyla tanımlanır. Irk önyargısı yerine, ırkların karışmasına ihtiyacımız var."
 POR_concordat_with_the_holy_see:0 "Vatikan ile Konkordato"
 POR_concordat_with_the_holy_see_desc:0 "Vatikan'la, Kilise'nin sosyal rolünü teşvik eden ve Portekiz'in siyasi işlerine karışmasını önleyen bir anlaşma müzakere edeceğiz.\n\n\"Deus, Pátria e Família\" - António de Oliveira Salazar"
 POR_continue_the_public_works:0 "Kamu İşlerine Devam Et"
 POR_continue_the_public_works_desc:0 "Devletin yıllarca süren istikrarsız mali durumdan sonra uyguladığı düzenlemeler sayesinde ekonomik durumumuzu istikrara kavuşturmayı başardık ve altyapımızı canlandırmak için kamu projelerine yatırım yapmaya devam etmeliyiz."
 POR_cooperate_with_french_militants:0 "Fransız Militanlarla İşbirliği Yap"
 POR_cooperate_with_french_militants_desc:0 "Fransa'daki yoldaşlarımız, ülkelerini işgal eden Faşist uluslara karşı verdikleri mücadelede umutsuzca yardıma ihtiyaç duyuyor. Onlara savaşlarında bir şansları olması için silah, teçhizat ve mühimmat sağlamalıyız."
 POR_corpo_do_estado_maior:0 "Corpo do Estado Maior"
 POR_corpo_do_estado_maior_desc:0 "Askeri Reform, Ordu Genelkurmay Başkanlığı'nı (Corpo do Estado Maior) modern savaşın incelenmesi için seçkin bir kurum olarak yeniden kurdu. Verimliliğini artırmak için yeni tesislere yatırım yapmalıyız."
 POR_deal_with_fascism:0 "Faşizmle Başa Çık"
 POR_deal_with_fascism_desc:0 "Faşizm, insanlığa keder ve sefalet getiren bir vebadır. Ona karşı çıkma, tam da kaynağında vurma zamanı geldi. Galip geldiğimizde, dünyayı kendi irademize göre yeniden şekillendireceğiz ve bu daha iyi olacak."
 POR_deal_with_fascism_tt:0 "Büyük veya komşu Faşist uluslara karşı §Yİlhak§! savaş hedefi kazandırır:"
 POR_deal_with_the_japanese_threat:0 "Japon Tehdidiyle Başa Çık"
 POR_deal_with_the_japanese_threat_desc:0 "Japon ordusu, yakındaki enklavları işgal ederek ve sömürgelerimizi izole ederek Pasifik'teki mülklerimizi tehdit ediyor. Onlar beklemezken şimdi Japon anavatanına savaş getirerek potansiyel düşmanlıklarını öngörmeliyiz."
 POR_defend_the_borders:0 "Sınırları Savun"
 POR_defend_the_borders_desc:0 "İşgal tehlikesi her zaman mevcuttur ve topraklarımız boyunca savunulacak uzun sınırlarımız var. Olası herhangi bir işgale direnmek için yeterli tahkimatlar inşa etmeliyiz."
 POR_develop_mozambique:0 "Mozambik'i Geliştir"
 POR_develop_mozambique_desc:0 "Mozambik'te altyapı ve sanayi geliştirerek, alüminyum kaynaklarını kendi yararımıza sömürebileceğiz."
 POR_develop_north_angola:0 "Kuzey Angola'yı Geliştir"
 POR_develop_north_angola_desc:0 "Kuzey Angola'da bir demir kaynağı keşfettik, bu değerli kaynağı sömürmek için gereken madencilik sanayisini inşa etmeliyiz."
 POR_develop_south_angola:0 "Güney Angola'yı Geliştir"
 POR_develop_south_angola_desc:0 "Güney Angola'daki kaynak arayışı başarılı oldu. Şimdi gerekli sömürü sanayisini geliştirebiliriz."
 POR_ditadura_militar:0 "Ditadura Militar"
 POR_ditadura_militar_desc:0 "Nihayet Salazar'ı iktidardan uzaklaştırmak ve Askeri Diktatörlüğü restore etmek için gerekli desteğe sahibiz. Yeni Devleti geride bırakacak ve Portekiz'in bu kader anında refaha kavuşması için gereken önlemleri alacağız."
 POR_endless_sea_desc:0 "Asya'daki enklavlarımız, onları çevreleyen imparatorlukların düşmanlıklarına maruz kalıyor. Herhangi bir potansiyel işgale direnebilmeleri için savunmalarını güçlendirmeye odaklanmalıyız."
 POR_estado_novo_desc:0 "1933 anayasamızdan bu yana Korporatizm ve Otarki ilkelerini takip ettik. Daha büyük ulusal güçlenmeye giden en kesin yol, bu yaklaşımı daha da vurgulamak, yeni, daha güçlü bir devlet inşa etmektir."
 POR_expand_the_chinese_territories:0 "Çin Topraklarını Genişlet"
 POR_expand_the_chinese_territories_desc:0 "Şimdi Asya ulusları savaşla zayıflamışken, topraklarımızı Makao'dan Çin'e genişletme zamanı geldi. Yorgun Çin ve Japon orduları bize rakip olamayacak!"
 POR_expand_the_chinese_territories_tt:0 "Herhangi bir ulusa karşı §Yİlhak§! savaş hedefi kazandırır:\n[592.GetName] ([592.Owner.GetFlag]§Y[592.Owner.GetName]§!)\n[594.GetName] ([594.Owner.GetFlag]§Y[594.Owner.GetName]§!)\n[325.GetName] ([325.Owner.GetFlag]§Y[325.Owner.GetName]§!)\n[613.GetName] ([613.Owner.GetFlag]§Y[613.Owner.GetName]§!)\n[622.GetName] ([622.Owner.GetFlag]§Y[622.Owner.GetName]§!)\n[604.GetName] ([604.Owner.GetFlag]§Y[604.Owner.GetName]§!)\n[615.GetName] ([615.Owner.GetFlag]§Y[615.Owner.GetName]§!)\n[611.GetName] ([611.Owner.GetFlag]§Y[611.Owner.GetName]§!)\n[328.GetName] ([328.Owner.GetFlag]§Y[328.Owner.GetName]§!)"
 POR_extraction_industries:0 "Maden Çıkarma Sanayileri"
 POR_extraction_industries_desc:0 "Zenginliklerimizin çoğu toprakta yatıyor, ancak madenlerimiz eski ve zanaatkar usulü. Modern bir Maden Çıkarma Sanayisi inşa etmeliyiz."
 POR_fascist_portugal_joins_scw_tt:0 "§YFaşist Portekiz§!, [SPA.GetFlag]§Y[SPA.GetNameDef]§!'in [GetSpanishRepublicFlagAndNameDef]'e karşı olan savaşlarına katılır."
 POR_field_maneuvers:0 "Saha Manevraları"
 POR_field_maneuvers_desc:0 "Corpo do Estado Maior, en eski doktrinlerimizi yeniden değerlendirmemize ve güncellememize yardımcı olacak yeni manevralar geliştirdi; modern bir ordu yaratmak için gerekli bir adım."
 POR_food_industries:0 "Gıda Sanayileri"
 POR_food_industries_desc:0 "Portekiz'in öne çıkıp imalat sanayisini canlandırma zamanı geldi. Ülkenin kuzey kesiminde gıda fabrikaları geliştirerek başlayabiliriz."
 POR_fuzileiros:0 "Fuzileiros"
 POR_fuzileiros_desc:0 "İyi eğitimli bir Deniz Piyade Gücü, denizaşırı mülklerimizin güvenliği için temeldir."
 POR_haven_of_neutrality_macau:0 "Makao, Tarafsızlık Sığınağı"
 POR_haven_of_neutrality_macau_desc:0 "Mevcut tarafsız tutumumuz ve şu anda Asya genelinde şiddetle devam eden çatışmalarla birlikte Makao, bu çalkantılı zamanlarda bir umut ve istikrar ışığı haline gelmiştir. Bu bölgeyi genişletmeye yatırım yapmalıyız."
 POR_honor_anglo_portuguese_alliance:0 "Anglo-Portekiz İttifakını Onurlandır"
 POR_honor_anglo_portuguese_alliance_desc:0 "On dördüncü yüzyıldan kalma Anglo-Portekiz İttifakı, dünyanın en eski ittifakıdır. Bu kader anında, bu antlaşmayı onurlandıracak ve savaşta [ENG.GetNameDef]'e yardım edeceğiz.\nBirlikte galip geleceğiz!"
 POR_hydroelectricity:0 "Hidroelektrik"
 POR_hydroelectricity_desc:0 "Portekiz'in Kuzey ve Merkezine yapılan büyük yatırımla, şimdi elektrik üretecek ve nehir akışlarını düzenleyecek bir baraj ağı inşa etmek mümkündür."
 POR_iberian_workers_effect_tooltip_tt:0 "[POR.GetFlag]§Y[POR.GetNameDef]§! ve [GetSpanishRepublicFlagAndNameDef], §Y'İberya İşçileri Birleşti'§! olayını alır."
 POR_industrial_modernization:0 "Sanayi Modernizasyonu"
 POR_industrial_modernization_desc:0 "Sivil sanayimizin çoğu hala güncelliğini yitirmiş durumda. Yükseltmesine zaman ve kaynak ayırırsak çok daha verimli hale gelebilir."
 POR_infrastructure_in_angola:0 "Angola'da Altyapı"
 POR_infrastructure_in_angola_desc:0 "Angola'nın birçok keşfedilmemiş zenginliği var. Gelecekte kaynaklarını sömürmek için bölgedeki altyapıyı geliştirmeliyiz."
 POR_infrastructure_in_angola_tt:0 "Angola'daki Cabinda iline §Y2 Donanma Üssü§! ekle.\n   Angola'daki Luanda iline §Y3 Donanma Üssü§! ekle.\n"
 POR_instituto_superior_tecnico:0 "Instituto Superior Técnico"
 POR_instituto_superior_tecnico_desc:0 "Portekiz'in yaklaşan mücadelede geride kalmaması için son teknoloji öğretim ve araştırma tesislerine sahip gelişmiş bir Mühendislik okuluna ihtiyacı var."
 POR_intervention_in_spain:0 "İspanya'ya Müdahale"
 POR_intervention_in_spain_desc:0 "İspanyol hükûmetinin hizalanması bizim için kabul edilemez. Hırsları, ideallerimiz ve halkımız için bir tehdit haline geldi, bu yüzden harekete geçmeli ve bu düşmanca tutumu zorla ortadan kaldırmalıyız."
 POR_intervention_in_spain_tt:0 "[Root.GetFlag]§Y[Root.GetNameDefCap]§!:\n[GetSpanishRepublicFlagAndNameDef]'e karşı §YHükûmeti Devir§! savaş hedefi kazanır."
 POR_invest_in_sandalwood_and_coffee_production:0 "Sandalağacı ve Kahve Üretimine Yatırım Yap"
 POR_invest_in_sandalwood_and_coffee_production_desc:0 "Timor'daki başlıca plantasyon şirketimiz SAPT, ek hükümet yatırımlarından büyük ölçüde fayda sağlayacaktır. Onları şimdi finanse edersek, ürünleri yakın gelecekte bize büyük getiriler sağlayabilir."
 POR_jet_research:0 "Jet Araştırması"
 POR_jet_research_desc:0 "Eğer göklere hükmetmek istiyorsak, uçaklarımız için en yeni gelişmeleri uygulamalıyız. Jet motorları gibi uçaklarımızı itmenin yeni yollarını araştırmak, alınacak en umut verici yol gibi görünüyor."
 POR_join_the_allies:0 "Müttefiklere Katıl"
 POR_join_the_allies_desc:0 "Avrupa'daki büyük Demokrasilerin liderliğini takip etme ve mücadelelerinde onlara katılma zamanı geldi. Birlikte her düşmana karşı duracağız!"
 POR_join_the_axis:0 "Mihver'e Katıl"
 POR_join_the_axis_desc:0 "Almanlarla aynı safta yer almalı ve gelecek çatışmalarda onları desteklemeliyiz. Almanya orta Avrupa'daki büyük güç olabilir, ama Portekiz en güçlü denizaşırı İmparatorluk olacak!"
 POR_join_the_carlist_fight:0 "Karlist Mücadelesine Katıl"
 POR_join_the_carlist_fight_desc:0 "İspanya iç savaşında bir Karlist zaferini sağlamanın en iyi yolu, Requetéler için savaşmak ve diğer İspanyol fraksiyonlarını kendimiz yenmektir."
 POR_join_the_comintern:0 "Komintern'e Katıl"
 POR_join_the_comintern_desc:0 "Sovyetler Birliği, diğer ülkelerin kendi Sosyalist liderliğini takip etmeleri için yolu açtı. Sovyet yoldaşlarımızla iş birliği yapmak bizim için faydalı olacaktır, çünkü hepimiz aynı hedefleri arıyoruz."
 POR_kingdom_reunited_tooltip_tt:0 "§Y[POR.GetNameDefCap]§! ve §Y[BRA.GetNameDef]§! artık §YPortekiz ve Brezilya İmparatorluğu§! olarak bilinecektir."
 POR_latin_america:0 "Latin Amerika"
 POR_latin_america_desc:0 "Şimdi İmparatorluğumuz sağlamlaştığına göre, Amerikan mülklerimizi çevreleyen topraklara bakabilir ve Brezilya İmparatorluğu'nun bir zamanlar sahip olduğu toprakları geri talep edebiliriz."
 POR_latin_american_communism:0 "Latin Amerika Komünizmi"
 POR_latin_american_communism_desc:0 "Latin Amerika halklarına ulaşmalıyız. Orada mevcut olan Komünist unsurlara başvurarak ve birleşik bir uluslararası blok fikrini yayma çabalarını destekleyerek, Amerikan ve Avrupa Sosyalistleri arasında bir ittifakın temellerini oluşturacağız."
 POR_light_aircraft_focus:0 "Hafif Uçak Odaklanması"
 POR_light_aircraft_focus_desc:0 "Havacılık sürekli gelişiyor ve ordumuzu desteklemek için uygun bir uçak sanayisi geliştirmeliyiz."
 POR_limited_self_rule:0 "Sınırlı Özyönetim"
 POR_limited_self_rule_desc:0 "Afrika sömürgelerimizin özerkliğini artırarak, kendi hükûmetlerini kurmalarına izin vererek, daha acil meselelere odaklanabiliriz. Bu sömürgesizleştirme bizi dünya çapındaki demokrasilere daha da yaklaştırabilir."
 POR_luso_tropicalism:0 "Luso-Tropikalizm"
 POR_luso_tropicalism_desc:0 "15. yüzyıldan beri Portekiz'in çok kültürlü doğasını tanımalı ve ulusal birliği vurgulamalı, Afrika sömürgelerimizi topraklarımıza entegre etmeli ve yerel nüfusa vatandaşlık vermeliyiz. Elbette muhalifler olacaktır, ancak topraklarımızda yaşayan insanlar için doğru olanı yapmalıyız."
 POR_mapa_cor_de_rosa:0 "Mapa Cor-de-Rosa"
 POR_mapa_cor_de_rosa_desc:0 "1890'daki Britanya Ültimatomu ile uğradığımız aşağılanmanın intikamını alma zamanı geldi. Batı ve Doğu Afrika'daki sömürgelerimiz nihayet birleştirilecek!"
 POR_mechanized_focus:0 "Mekanize Odaklanması"
 POR_mechanized_focus_desc:0 "Mekanize araçlar, düşman ateşi altındayken piyadelerimizi korumak için diğer tekerlekli araçlardan çok daha uygundur. Bu tür araçların araştırılması ve üretilmesi çok önemli olabilir."
 POR_merchant_marine_protection:0 "Ticaret Filosu Koruması"
 POR_merchant_marine_protection_desc:0 "Büyük Savaş'taki deneyimimiz bize ticari gemilerin denizaltıların oluşturduğu tehdide karşı korunması gerektiğini öğretti."
 POR_metropolitan_army:0 "Metropol Ordusu"
 POR_metropolitan_army_desc:0 "Portekiz'e yönelik en büyük tehlike, bir Avrupa savaşına sürüklenmek ve anakaramızın işgal edilmesidir. Sadece güçlü ve modern bir ordu düşmanlarımızı caydırabilir!"
 POR_military_research_facilities:0 "Askeri Araştırma Tesisleri"
 POR_military_research_facilities_desc:0 "Eğer modern ve yetkin bir orduyu sürdürmek istiyorsak, silahlanma sanayilerimizi iyileştirme çabalarımıza yeterli bir araştırma yatırımı eşlik etmelidir."
 POR_military_vehicles:0 "Askeri Araçlar"
 POR_military_vehicles_desc:0 "Ordumuzun gelecek savaşlar için modern araçlara ihtiyacı var. Eğer gelecekteki çatışmalarda galip geleceksek, onlara en yüksek kalitede yeterli bir tedarik almalarını sağlamalıyız."
 POR_monarchist_uprising_in_brazil:0 "Brezilya'da Monarşist Ayaklanması"
 POR_monarchist_uprising_in_brazil_desc:0 "Brezilyalı monarşistlere başvurmak, Brezilya tahtının restorasyonunun yolunu açmaya yardımcı olacaktır. Herhangi bir muhalefete karşı galip gelmelerini sağlamalıyız."
 POR_nation_in_arms_desc:0 "Portekiz halkı, Faşizmin ve Emperyalizmin kötülüğüyle savaşmaya hazırlanmalı. Onlara silah vermeli ve zamanı geldiğinde ulusumuzun savaşmaya hazır olması için askeri eğitime başlamalıyız!"
 POR_national_cruiser_production:0 "Ulusal Kruvazör Üretimi"
 POR_national_cruiser_production_desc:0 "Büyük gemilerin inşasına odaklanmaya devam etmeliyiz. Modern kruvazörler donanmamıza büyük bir ateş gücü sağlayacaktır."
 POR_national_gold_reserves:0 "Ulusal Altın Rezervleri"
 POR_national_gold_reserves_desc:0 "Tarafsız kalırken bu savaşta kazanılacak kar var. Her iki taraf da dostluğumuz ve mallarımız için rekabet ediyor ve eğer taleplerini karşılamayı başarırsak, altın rezervlerimiz önemli ölçüde artabilir."
 POR_national_syndicalism_desc:0 "Salazar'ın Nasyonal Sendikalist Hareketi dağıtma ve Francisco Rolão Preto'yu sürgün etme hatasını düzelteceğiz. Hareketi yeniden meşrulaştırmalı ve Preto'yu geri getirmeliyiz."
 POR_nationalist_intervention:0 "Milliyetçi Müdahalesi"
 POR_nationalist_intervention_desc:0 "İspanyol hükûmetinin hırsları çıkarlarımızı tehdit ediyor ve buna müsamaha gösteremeyiz. Eğer komşularımız davamıza hizalanmaya istekli değillerse, o zaman onları daha ikna edici yollarla bunu yapmaya zorlamak zorunda kalacağız."
 POR_nationalist_intervention_tt:0 "[Root.GetFlag]§Y[Root.GetNameDefCap]§!:\n[SPA.GetFlag][SPA.GetNameDefCap]'e karşı §YHükûmeti Devir§! savaş hedefi kazanır."
 POR_nationalize_industry:0 "Sanayiyi Millileştir"
 POR_nationalize_industry_desc:0 "Özel sermaye çok uzun zamandır ekonomimizi tüketiyor ve toplumumuzun ilerlemesini geciktiriyor. Portekiz halklarının yararı için özel şirketleri millileştirerek ve her bir fabrikanın üretiminin kontrolünü ele alarak ondan kurtulmalıyız."
 POR_naval_research_institute:0 "Denizcilik Araştırma Enstitüsü"
 POR_naval_research_institute_desc:0 "Doğru yatırımla, Escola Naval'imiz araştırma çabalarını geliştirebilir ve gelecekteki subaylar için daha yüksek kaliteli bir eğitim sağlayabilir."
 POR_observation_mission:0 "Gözlem Misyonu"
 POR_observation_mission_desc:0 "İspanya'ya yeni taktiklerin ve silah sistemlerinin kullanımını denetlemek için bir Askeri Gözlem Misyonu gönderilecek."
 POR_ogma:0 "OGMA"
 POR_ogma_desc:0 "Oficinas Gerais de Material Aeronáutico tesislerini geliştirmek, uçak üretimimizi önemli ölçüde artıracaktır."
 POR_ogme:0 "OGME"
 POR_ogme_desc:0 "Oficinas Gerais de Material de Engenharia'ya yatırım yaparak, ordumuzu modern ve yüksek kaliteli teçhizatla çok daha hızlı bir şekilde tedarik edebileceğiz."
 POR_oppose_germany:0 "Almanya'ya Karşı Çık"
 POR_oppose_germany_desc:0 "Almanya'nın düşmanlıkları tamamen kabul edilemez ve yine de şimdiye kadar kimse onları durduramadı. Şimdi ordumuz nihayet savaşa hazır olduğuna göre, Portekiz mücadeleye katılacak ve ulusları özgürlüklerinden mahrum bırakmak isteyen herkese karşı duracaktır."
 POR_our_comrades_overseas:0 "Denizaşırı Yoldaşlarımız"
 POR_our_comrades_overseas_desc:0 "Blokumuzun bir parçası olmaya istekli olan Latin Amerika ulusları arasında bir konferans düzenleyeceğiz. Dünyaya Latin Amerika ve İberya halkları arasındaki birliği gösterme zamanı geldi."
 POR_our_comrades_overseas_tt:0 "Latin Amerika'daki herhangi bir bağımsız §YKomünist§! ulus, §Y'Portekiz bizi Halk Cephesi Bloku'na davet ediyor'§! olayını alacaktır."
 POR_popular_front:0 "Halk Cephesi"
 POR_popular_front_desc:0 "İspanyol Halk Cephesi yolu gösteriyor. Komünistleri, Sosyalistleri ve Anarşistleri, Faşizme ve Dünya Devrimine karşı direnişin öncüsü olacak geniş bir cephede birleştirmeliyiz."
 POR_portuguese_artillery:0 "Portekiz Topçusu"
 POR_portuguese_artillery_desc:0 "Saha topçusu modern savaş alanlarında hayati önem taşır. Topçu silahları üretimimizi artırmamızı sağlayacak yeni tesisler inşa etmeye yatırım yapmalıyız."
 POR_portuguese_legion:0 "Portekiz Lejyonu"
 POR_portuguese_legion_desc:0 "İspanya İç Savaşı'nın patlak vermesine yanıt olarak, askeri polis sınıra gönderildi. Onların polislik görevlerini üstlenebilecek gönüllü, vatansever bir silahlı milis oluşturmalıyız."
 POR_portuguese_oil:0 "Portekiz Petrolü"
 POR_portuguese_oil_desc:0 "Petrolü olmayan bir ulus, çatışma durumunda ekonomisini sürdüremez. Angola'da ticari olarak uygun petrol sahaları aramalıyız."
 POR_potential_civil_war_high_requirement_tt:0 "§REğer bu odak tamamlandığı sırada §Yİstikrar§! §Y%60§R'ın §Raltındaysa, bir iç savaş başlayacaktır!§!§!§!§!"
 POR_potential_civil_war_low_requirement_tt:0 "§REğer bu odak tamamlandığı sırada §Yİstikrar§! §Y%40§R'ın §Raltındaysa, bir iç savaş başlayacaktır!§!§!§!§!"
 POR_promote_the_monarchist_cause_in_portugal:0 "Portekiz'de Monarşist Davayı Teşvik Et"
 POR_promote_the_monarchist_cause_in_portugal_desc:0 "Monarşistleri, Portekiz halkları arasında monarşist duyguyu yaymaları için teşvik etmeli ve desteklemeliyiz."
 POR_protect_chinese_civilians:0 "Çinli Sivilleri Koru"
 POR_protect_chinese_civilians_desc:0 "Makao'daki Portekiz toprağı yakınlarındaki yabancı askeri manevra raporları sivil nüfus arasında huzursuzluğa neden olmaya başladı. Vatandaşlarımıza veya toprağımıza yönelik herhangi bir tehdide müsamaha göstermeyeceğiz; şanlı ulusumuzun selameti için şimdi harekete geçmeliyiz!"
 POR_proudly_alone:0 "Gururla Yalnız"
 POR_proudly_alone_desc:0 "Savaşa katılmak, potansiyel olarak ülkemizin işgaline ve denizaşırı topraklarımızın kaybına neden olacaktır. Ayrıca, çatışmaya girmek İberya Yarımadası'nı istikrarsızlaştıracak ve Portekiz'i İspanya tarafından da işgal edilme riskine sokacaktır. Tarafsız kalmalı ve topraklarımızın güvenliğini aramalıyız, çünkü pusuda bekleyen başka tehditler var..."
 POR_puppet_wargoal:0 "Kukla (Odak)"
 POR_rebuild_the_lines_of_torres_vedras:0 "Torres Vedras Hatlarını Yeniden İnşa Et"
 POR_rebuild_the_lines_of_torres_vedras_desc:0 "Üst düzey subaylar arasındaki bir dizi subay, sınırlarımızın savunulamayacak kadar geniş olduğunu iddia ediyor ve Linhas de Torres Vedras'ı yeniden inşa etmemizi, eski tahkimatları modern savaşa uygun hale getirmemizi öneriyor. Düşmanın hatlarımızı yarması durumunda Lizbon'a çekileceğiz, Napolyon Savaşları sırasında Fransız işgaline karşı bize iyi hizmet eden aynı stratejiyi izleyeceğiz."
 POR_recover_brazil:0 "Brezilya'yı Geri Al"
 POR_recover_brazil_desc:0 "Eski Portekiz İmparatorluğu'nun görkemini geri kazanmak için, eski Amerikan sömürgelerimize odaklanmalıyız. Brezilya toprağı Portekiz'e aittir ve bu nedenle zorla geri alınacaktır."
 POR_recover_the_east_indies:0 "Doğu Hint Adaları'nı Geri Al"
 POR_recover_the_east_indies_desc:0 "Haklı olarak bizim olanı talep etmeliyiz. Doğu Hint Adaları yeniden Portekiz kontrolü altında olacak."
 POR_refuse_the_naval_blockade:0 "Deniz Ablukasına Uymayı Reddet"
 POR_refuse_the_naval_blockade_desc:0 "[ENG.GetNameDef] ile savaşta olan ülkelere uygulanan deniz ablukasından yararlanabiliriz. Diplomatlarımız, [ENG.GetAdjective] ile savaşan o ülkelere, ekonomik destekleri karşılığında gemicilik kapasitemizi ödünç vermek için uygun anlaşmalar müzakere edecektir."
 POR_regimento_de_comandos:0 "Regimento de Comandos (Komando Alayı)"
 POR_regimento_de_comandos_desc:0 "Farklı savaş durumları için eğitilmiş ve en zorlu koşullarda görev yapabilecek elit kuvvetlere ihtiyacımız var.\n\n\"Audaces Fortuna Juvat\""
 POR_remember_olivenca:0 "Olivença'yı Hatırla"
 POR_remember_olivenca_desc:0 "İspanyollar uzun zaman önce Olivença üzerindeki egemenliğimizi reddettiler. Şimdi onu ve civardaki diğer toprakları geri alacağız..."
 POR_reorganization_of_the_communist_party:0 "Komünist Partinin Yeniden Düzenlenmesi"
 POR_reorganization_of_the_communist_party_desc:0 "Salazar'ın diktatörlük rejimi sırasında, parti üyelerimizin çoğu tutuklandı. Onları geri getirecek ve parti yapımızı yeniden düzenleyecek, her departmanın en nitelikli kişiler tarafından yönetilmesini sağlayacağız."
 POR_republican_spain_exists_tooltip_tt:0 "[SPR.GetFlag]§YCumhuriyetçi İspanya§! var."
 POR_research_agreements:0 "Araştırma Anlaşmaları"
 POR_research_agreements_desc:0 "Gelişmiş askeri teknolojisine erişim sağlayan bir Almanya ile bir anlaşma yapmalıyız, bu da araştırmamızı artıracak ve savaş alanında daha iyi teçhizat konuşlandırmamıza olanak tanıyacaktır."
 POR_research_collaboration:0 "Araştırma İş Birliği"
 POR_research_collaboration_desc:0 "Sovyetler Birliği'ndeki yoldaşlarımızın hırslı, iyi finanse edilen bir Ar-Ge programı var. Teknolojik gelişmelerini bizimle paylaşma anlaşması, proleter savaşımızda karşılıklı olarak faydalı olacaktır."
 POR_research_sharing:0 "Araştırma Paylaşımı"
 POR_research_sharing_desc:0 "Birleşik Krallık'taki silah arkadaşlarımız teknolojik araştırma açısından bizden çok ileride. Bir araştırma paylaşım anlaşması bizi ve dolayısıyla ittifakımızı güçlendirecektir."
 POR_restart_investment_into_timor:0 "Timor'a Yatırımı Yeniden Başlat"
 POR_restart_investment_into_timor_desc:0 "Timor, Büyük Buhran sırasında ekonomik bir yük olarak görülmüştü ve bu nedenle krizin ilk başladığı andan beri bizden çok az destek veya yönetim gördü. Japon Nan'yō Kōhatsu kalkınma şirketinin bölgeye yatırım yapmasıyla, belki de oradaki kendi yatırımlarımızı yeniden başlatmanın zamanı gelmiştir."
 POR_restoration_of_the_monarchy:0 "Monarşinin Restorasyonu"
 POR_restoration_of_the_monarchy_desc:0 "D. Duarte Nuno de Braganza'nın yönetimi altında Portekiz Monarşisinin restorasyonunu ilan edeceğiz. \nViva o Rei de Portugal!"
 POR_revert_the_local_autonomy_policies:0 "Yerel Özerklik Politikalarını Geri Al"
 POR_revert_the_local_autonomy_policies_desc:0 "1911'deki Manufahi İsyanı'ndan sonra sömürge politikamız, bölgenin daha fazla entegrasyonuna yönelik önceki girişimleri terk ederek yerli hükümdarları göstermelik liderler olarak kullanmaya geri döndü. Belki de bunu tersine çevirmeli ve devletimizin çok kültürlülüğünü benimsemeliyiz."
 POR_roads_bridges_and_dams:0 "Yollar, Köprüler ve Barajlar"
 POR_roads_bridges_and_dams_desc:0 "Altyapımızı ve yol sistemlerimizi iyileştirmeye odaklanan kamu inşaat projelerine yatırım yapmalıyız."
 POR_second_navy_reequipment:0 "İkinci Donanma Yeniden Donatımı"
 POR_second_navy_reequipment_desc:0 "Donanma Yeniden Donatım programının ilk aşaması bitti. Şimdi ikinci aşamaya geçmeli, Donanma Tersanelerimizi iyileştirmeli ve yurtdışından bir dizi modern gemi satın almak için bir ihale açmalıyız."
 POR_securing_the_free_world:0 "Özgür Dünyayı Güvence Altına Almak"
 POR_securing_the_free_world_desc:0 "Eğer büyük bir güç olacaksak, öyle davranmaya başlamak iyi olur. İdeallerimizi ve çıkarlarımızı paylaşan daha küçük ulusları herhangi bir potansiyel dış tehdide karşı koruyacağız."
 POR_send_assistance:0 "Yardım Gönder"
 POR_send_assistance_desc:0 "Cepheler sağlamlaşmış gibi göründüğü için İspanya İç Savaşı'ndaki Milliyetçilerin kaderi pamuk ipliğine bağlı. Mücadeleye katılmalı ve isyancılara cumhuriyetçi hükûmeti yenmelerinde yardım etmeli, İberya'daki Komünist tehdidi tamamen ortadan kaldırmalıyız."
 POR_spanish_republic_tt:0 "[GetSpanishRepublicFlagAndNameDef]:"
 POR_spr_tooltip_at_peace_tt:0 "[SPR.GetFlag]§YCumhuriyetçi İspanya§! ile barış içinde!"
 POR_spr_tooltip_country_exist_tt:0 "[SPR.GetFlag]§YCumhuriyetçi İspanya§! var"
 POR_staff_wargames:0 "Kurmay Savaş Oyunları"
 POR_staff_wargames_desc:0 "Subaylarımızı, modern doktrinlerden, organizasyondan, eğitimden ve teçhizattan tam olarak yararlanabilecek şekilde hazırlamaya odaklanmalıyız."
 POR_standardization:0 "Standardizasyon"
 POR_standardization_desc:0 "Teçhizatımızın üretimlerinde yüksek düzeyde uyumluluk ve verimlilik elde etmesini sağlayan bir standardizasyon sistemi uygulamamız gerekiyor."
 POR_strengthen_the_regime:0 "Rejimi Güçlendir"
 POR_strengthen_the_regime_desc:0 "Hala rejime karşı komplo kuran birçok muhalif var. Gizli polisi güçlendirecek, onlara yıkıcı örgütleri kökünden kazıma imkanı sağlayacağız."
 POR_strict_neutrality_in_the_spanish_civil_war:0 "İspanya İç Savaşı'nda Katı Tarafsızlık"
 POR_strict_neutrality_in_the_spanish_civil_war_desc:0 "İspanya İç Savaşı patlak verdi, ancak şu anda uluslararası çatışmalara sürüklenmeyi göze alamayız. Ulusumuzu güçlendirirken ve diplomatik ilişkilerimizi geliştirirken katı bir tarafsızlık politikası ilan etmeliyiz."
 POR_submarine_effort:0 "Denizaltı Çabası"
 POR_submarine_effort_desc:0 "Modern denizaltıların araştırma ve üretimine başlamalıyız. Bu, sualtı savaşına katıldığımızda bize güçlü bir avantaj sağlayacaktır."
 POR_support_a_spanish_monarchy_in_the_war:0 "Savaşta bir İspanyol Monarşisini Destekle"
 POR_support_a_spanish_monarchy_in_the_war_desc:0 "Karlistlere çok fazla değer verdiğimizden değil, ama tabii ki bir İspanyol monarşisi, yarımadada bir faşist veya komünist rejimin varlığından çok daha iyi olurdu. Kötünün iyisini tercih etmeliyiz..."
 POR_support_the_spanish_nationalists:0 "İspanyol Milliyetçilerini Destekle"
 POR_support_the_spanish_nationalists_desc:0 "Komünist ve Anarşist tehdide karşı ülkelerinin şanı için savaşan İspanyol Milliyetçilerine desteğimizi göstermeliyiz."
 POR_support_the_spanish_republic:0 "İspanyol Cumhuriyeti'ni Destekle"
 POR_support_the_spanish_republic_desc:0 "İspanya halkları, tüm ülkelerini ele geçirmekle tehdit eden Milliyetçi darbeye karşı savaşlarında mücadele ediyor. Şimdi Cumhuriyetçileri desteklemeliyiz çünkü eğer onlar yok olurlarsa, kapımızda potansiyel yeni bir düşman buluruz."
 POR_support_the_spanish_republic_effect_tooltip_tt:0 "[GetSpanishRepublicFlagAndNameDef]'e §Y2000§! adet §YPiyade Teçhizatı§! gönder. Önce eskiler gider."
 POR_textile_industry:0 "Tekstil Sanayisi"
 POR_textile_industry_desc:0 "Tekstil sanayimizin tam potansiyeline ulaşmak için, topraklarımızda üretilen büyük miktarda pamuğu işlememize olanak tanıyan yeni fabrikalar inşa etmeliyiz."
 POR_the_capital_of_espionage:0 "Casusluğun Başkenti"
 POR_the_capital_of_espionage_desc:0 "Lizbon'da sonsuz ajanlar ve komplolar var: transatlantik sevkiyatlar hakkında bilgi toplayan casuslar, eski düşmanlarıyla iş birliği yapan hainler ve düşmana yanlış istihbarat ileten çift taraflı ajanlar. Topraklarımızdan geçen bilgi kırıntılarını toplayarak ve kendi karşı istihbaratımızı geliştirerek bu durumdan yararlanabiliriz."
 POR_the_communist_threat:0 "Komünist Tehdidi"
 POR_the_communist_threat_desc:0 "Komünistler, sadece Portekiz'de değil, tüm dünyada aldatıcı ideallerini gizlice yayıyorlar. Bizi içeriden yiyip bitirmeden önce bu küresel tehdidi ortadan kaldırmaya odaklanmalıyız."
 POR_the_communist_threat_tt:0 "Büyük veya komşu Komünist uluslara karşı §Y[GetWargoalBasedOnGovernment]§! savaş hedefi kazandırır:"
 POR_the_eastern_menace:0 "Doğu Tehdidi"
 POR_the_eastern_menace_desc:0 "[JAP.GetNameDef]'in Çin ve Güneydoğu Asya'daki başarısı, esas olarak karşılaştıkları düşman birliklerinin zayıf durumundan kaynaklanıyordu. Doğu topraklarımızda aynısının olmasını önlemeliyiz. Sömürgelerimizi güçlendirecek ve [JAP.GetAdjective] yapmadan önce ilk darbeyi biz vuracağız."
 POR_the_empire_of_brazil:0 "Brezilya İmparatorluğu"
 POR_the_empire_of_brazil_desc:0 "Sahne, Prens Pedro'nun Brezilya tahtını talep etmesi ve Brezilya İmparatoru olarak taç giymesi için hazırlandı."
 POR_the_empire_of_brazil_potential_civil_war_tt:0 "§REğer §YBrezilya§R §YTarafsız §RDEĞİLSE§R ve bu odak tamamlandığında §Y%50'den az İstikrara§R veya §Y%70 Tarafsızlığa§R sahipse, Brezilyalı Monarşistler bizi de içine çeken bir iç savaş başlatacak!§!§!§!§!§!§!§!§!§!§!"
 POR_the_fifth_empire_desc:0 "Beşinci İmparatorluk, entelektüel ve ruhani bilginin, İnanç ve İmparatorluğun nihai birleşimini temsil eder. Sadece Portekiz Ulusu, tüm dünyayı sadece toprakta değil, aynı zamanda ruh ve kültürde de birleştirerek bu gerçeğe giden yolda liderlik edebilir."
 POR_the_iberian_socialist_union:0 "İberya Sosyalist Birliği"
 POR_the_iberian_socialist_union_annex_puppets_tt:0 "Her İspanyol kuklası ilhak edilecek."
 POR_the_iberian_socialist_union_cores_tt:0 "§Yİberya Sosyalist Birliği§!, tüm İberya, Islas Canarias ve Islas Baleares üzerinde hak iddia eder."
 POR_the_iberian_socialist_union_cosmetic_name_tt:0 "§YPortekiz§!, §Yİberya Sosyalist Birliği§! olarak bilinecektir."
 POR_the_iberian_socialist_union_desc:0 "Savaş sırasındaki İspanyol Cumhuriyetçileriyle olan ortak mücadelelerimiz, İberya Yarımadası'nı bir Halk Sosyalist hükûmeti altında birleştirme zamanının geldiğini gösteriyor.\nBirlikte düşmanlarımızı tamamen ve kesin olarak yeneceğiz!"
 POR_the_iberian_socialist_union_tt:0 "([SPR.GetFlag]§YCumhuriyetçi İspanya§!) §Y'İberya Sosyalist Birliği'§! olayını alır."
 POR_the_kingdom_reunited:0 "Krallık Yeniden Birleşti"
 POR_the_kingdom_reunited_desc:0 "Portekiz ve Brezilya tahtlarının restorasyonunun ardından, ortak mücadelelerimizin anıları geride bırakılmadan önce ülkelerimizin birleşmesini gerçekleştirmeliyiz. \nBrezilya hükûmetine, eğer gönüllü olarak imzalamazlarsa, meseleyi başka yollarla zorlamak zorunda kalacağımızı açıkça belirten bir teklif sunacağız..."
 POR_the_popular_front_bloc:0 "Halk Cephesi Bloku"
 POR_the_popular_front_bloc_desc:0 "Şimdi İberya kimliğimizi vurguladığımıza ve ulusumuzu [Root.GetNameDef] olarak sağlamlaştırdığımıza göre, Komünizmi yurtdışında yaymalı ve davamıza katılmaya ve tiranlığa ve baskıya karşı birlikte savaşmaya istekli müttefikler aramalıyız."
 POR_the_popular_front_bloc_explanatory_tt:0 "Avrupa'daki herhangi bir bağımsız §YKomünist§! ulus, §Y'Portekiz bizi Halk Cephesi Bloku'na davet ediyor'§! olayını alacaktır."
 POR_the_popular_front_bloc_tt:0 "§Y'Portekiz bizi Halk Cephesi Bloku'na davet ediyor'§! olayını alır."
 POR_the_return_of_duarte:0 "Duarte'nin Dönüşü"
 POR_the_return_of_duarte_desc:0 "D. Duarte Nuno de Braganza'nın Portekiz'e dönmesine izin vermek Cumhuriyetçiler tarafından kabul edilmeyecektir, ancak Monarşinin restorasyonu için gerekli bir adımdır."
 POR_the_royal_iberian_alliance:0 "Kraliyet İberya İttifakı"
 POR_the_royal_iberian_alliance_desc:0 "Avrupa ve ötesindeki tehditlerle yüzleşmek için İspanyol monarşisinin iş birliğini aramalıyız. Ancak birleşirsek bu kargaşa zamanında galip çıkabiliriz."
 POR_they_need_our_help:0 "Yardımımıza İhtiyaçları Var"
 POR_they_need_our_help_desc:0 "İspanya'daki durum kritik. Milliyetçilerin zaferini önleyeceksek şimdi harekete geçmeliyiz. İspanyol akrabalarımıza mücadelelerinde katılacağız; birlikte isyancıları yeneceğiz!"
 POR_topple_government_wargoal:0 "Hükûmeti Devir"
 POR_tropas_paraquedistas:0 "Tropas Paraquedistas"
 POR_tropas_paraquedistas_desc:0 "Düşman kuvvetlerinin gerisine indirilebilecek, paha biçilmez bir taktik avantaj sağlayan seçkin bir piyade saldırı gücü oluşturacağız."
 POR_unify_leftist_youth_wings:0 "Solcu Gençlik Kollarını Birleştir"
 POR_unify_leftist_youth_wings_desc:0 "PCP'nin gençlik kolunu kuracak, mevcut örgütleri birleştirecek ve potansiyel üyelere katılmaları için çağrıda bulunacağız. Bu, genç üyelerimizin buluşabileceği, tartışabileceği ve siyasi faaliyetlerimizde ilk adımlarını atabileceği bir platformun oluşturulmasına yol açacaktır."
 POR_visit_the_front:0 "Cepheyi Ziyaret Et"
 POR_visit_the_front_desc:0 "Birkaç Portekizli subay, İspanyol cephesini ziyaret etmek için gönderilecek. Hava kuvvetleri tarafından kullanılan yeni tekniklere odaklanan bir denetim yapacaklar."
 POR_workers_of_iberia_unite:0 "İberya İşçileri, Birleşin!"
 POR_workers_of_iberia_unite_civil_war_tt:0 "§YTarafsız§! §Rdestekçiler bir iç savaş başlatacak§!"
 POR_workers_of_iberia_unite_desc:0 "Her türlü tiranlığa karşı İberya proletaryasının birliğini ilan etmeli ve İspanyol yoldaşlarımıza İç Savaşlarında katılarak Faşizme karşı bir kale haline gelmeliyiz.\nFedakarlıklarımız unutulmayacak, çünkü bizimki haklı bir davadır!"
 SPA_a_fleet_worthy_of_a_king:0 "Bir Krala Layık Bir Filo"
 SPA_a_fleet_worthy_of_a_king_desc:0 "Eğer hükümdar iradesini okyanuslarda gösterecekse donanmamız büyük ölçüde genişletilmelidir. Yeni donanma altyapısı derhal inşa edilecektir."
 SPA_a_great_maritime_power:0 "Büyük Bir Deniz Gücü"
 SPA_a_great_maritime_power_desc:0 "İspanyol gücü bir zamanlar okyanuslarda korkulurdu. Yüzyıllar boyunca talihimiz azalsa da, denizlerle olan bağımız devam ediyor. Denizcilik mirasımızı kucaklayacak ve dünya su yollarındaki varlığımızı yenileyeceğiz."
 SPA_a_great_spain:0 "Büyük Bir İspanya"
 SPA_a_great_spain_desc:0 "Yeni filizlenen İkinci Cumhuriyet; din, aile ve mülkiyeti koruma görevlerinde başarısız oldu. Sol, Hristiyan medeniyetimizi kuşatırken, Confederación Española de Derechas Autónomas onun savunmasında duracak ve İspanya'ya gerçek bir birlik ve yeni bir ruh verecektir. Parlamento halkın iradesine boyun eğecek, ya da biz onu ortadan kaldıracağız."
 SPA_a_methodical_approach:0 "Metodik Bir Yaklaşım"
 SPA_a_methodical_approach_desc:0 "Bu iç savaşta başarının anahtarı, cesur manevralar ve pervasız saldırılarda değil, dikkatli ve metodik planlama ile kasıtlı ve kesin saldırılarda yatmaktadır."
 SPA_a_modern_fighter_fleet:0 "Modern bir Avcı Filosu"
 SPA_a_modern_fighter_fleet_desc:0 "Pilotlarımıza devletimizin toplayabileceği en iyi makineler verilmelidir. Sayıdaki eksiğimizi beceri, cesaret ve teçhizatla telafi etmeliyiz."
 SPA_a_one_party_state:0 "Tek Partili Devlet"
 SPA_a_one_party_state_desc:0 "Demokrasi, Cumhuriyetçilerin bize inandırmak istediği gibi kendi başına bir amaç olmaktan ziyade, aslında devletin tam kontrolünü zayıf ve değersiz olanlardan kapmak için bir araçtan başka bir şey değildir. Diğer tüm siyasi partileri ortadan kaldıracağız, böylece güçlü bir vizyona sahip olanlar Büyük bir İspanya arayışlarında engellenmeyecekler."
 SPA_a_one_party_state_tt:0 "Mevcut birleşik §YFaşist olmayan§! desteğin yarısı bir §Rİstikrar§! cezası olarak uygulanır:\n"
 SPA_absorb_carlist_remnants:0 "Karlist Kalıntılarını Absorbe Et"
 SPA_absorb_carlist_remnants_desc:0 "Karlizm neredeyse tamamen yok edilmişken, fraksiyonun daha az fanatik unsurları cephede hala bir işe yarayabilir. Bu fırsatı kaçırmamalıyız - toplayabildiğimiz her yetenekli beden bir bütün olarak Falanj'ın hedeflerini ilerletecektir."
 SPA_absorb_the_portuguese_empire:0 "Portekiz İmparatorluğu'nu Soğur"
 SPA_absorb_the_portuguese_empire_desc:0 "Sadece Portekiz anakarasını kontrol etme zamanı değil, aynı zamanda uluslarımızı gerçekten tek olarak pekiştirme zamanı da geldi. Bir adım, onların bizim egemenliğimize tam entegrasyonu olacak ve ikincisi, henüz o şekilde görmeseler bile yeni İberya hegemonyamızın bir parçası olan Portekiz sömürge imparatorluğunun fethi olacak. Bu kolayca düzeltilebilir."
 SPA_absorb_the_portuguese_empire_tt:0 "Kontrol ettiğimiz tüm §YPortekiz§! çekirdekleri üzerinde hak iddia edeceğiz"
 SPA_adopt_the_26_points:0 "26 Noktayı Benimse"
 SPA_adopt_the_26_points_desc:0 "Falange'ın \"27 Noktası\"ndan siyasi partilerin birleşmesine karşı olan hükmü uygun bir şekilde çıkardıktan sonra ortaya çıkan \"26 Nokta\", hükümet politikalarına ilham vermek için ödünç alabileceğimiz iyi bir parti manifestosu haline geliyor."
 SPA_all_shall_serve:0 "Herkes Hizmet Edecek"
 SPA_all_shall_serve_desc:0 "Yeni İspanya, tüm İspanyolların iradesinin ifadesidir ve bu nedenle herkesin onun savunmasında görevini yapmasına izin verilmelidir. Askere alma standartları buna göre genişletilmelidir."
 SPA_an_armored_corps:0 "Bir Zırhlı Kolordu"
 SPA_an_armored_corps_desc:0 "İspanya'nın komşuları tarafından geride bırakılmaması için bir zırhlı kolorduya ihtiyacı var."
 SPA_arms_modernization:0 "Silah Modernizasyonu"
 SPA_arms_modernization_desc:0 "Birliklerimiz en adanmış, sadık, dindar, ateşli ve en iyi eğitimli olabilir, ancak yine de Hristiyanlığı savunmak için yeterli silaha ihtiyaçları var. İhtiyaç duydukları şeye sahip olmalarını sağlayacağız."
 SPA_artillery_modernization:0 "Topçu Modernizasyonu"
 SPA_artillery_modernization_desc:0 "Topçu, modern savaşın kilit bir parçasıdır ve bu yüzden eskiyen parçalarımızı yeni ve daha güçlü modellerle modernize etmeliyiz."
 SPA_autarky:0 "Otarki"
 SPA_autarky_desc:0 "Konumumuzun başkaları tarafından tehdit edilmemesi için ekonomimizin tamamen kendi kendine yeterli olmasını sağlamalıyız."
 SPA_banish_the_party_leaders:0 "Parti Liderlerini Sürgün Et"
 SPA_banish_the_party_leaders_desc:0 "Falanj ve Karlistlerin bireysel parti liderlikleri giderek daha fazla kendi gündemlerini dayatmaya çalışıyor ve başımıza bela oluyorlar. Birliklerini bozarak konumlarını baltalayarak, bu inatçı liderleri ülkeden sürmeyi haklı çıkarabilir ve yerlerine Franco'ya sadık kuklalar getirebiliriz."
 SPA_battle_rites:0 "Savaş Ayinleri"
 SPA_battle_rites_desc:0 "Ulusumuzun savunmasında savaşmak kutsal bir görevdir. Rahiplerimiz savaş alanında askerlere eşlik edecek ve Kral ve İnanç için en büyük fedakarlığı yapan herkes için yerinde son ayinleri yönetecek, herkesin Cennette ödüllendirilmesini sağlayacaktır."
 SPA_bolster_offensive_infrastructure:0 "Taarruz Altyapısını Güçlendir"
 SPA_bolster_offensive_infrastructure_desc:0 "Taarruz planlamamızdaki en büyük darboğaz, cephe birliklerimize yeterli ikmal sağlayamamamızdır. Bu sektörlerdeki altyapıyı iyileştirmeye odaklanarak taarruz operasyonlarımız büyük ölçüde güçlendirilmelidir."
 SPA_bolster_offensive_infrastructure_tt:0 "İspanya İç Savaşı gerektirir.\n3 rastgele cephe eyaletine §Y1 Altyapı§! ekle.\n"
 SPA_capitalist_economic_aid:0 "Kapitalist Ekonomik Yardım"
 SPA_capitalist_economic_aid_desc:0 "Batı ekonomik yardımı, ulusumuzun çilesinden sonra toparlanmasında paha biçilmez olacaktır."
 SPA_caudillo_of_spain:0 "İspanya'nın Kaudillosu"
 SPA_caudillo_of_spain_desc:0 "Francisco Franco'nun başarıları kendini gösterdi ve potansiyel rakipleri zamansız sonlarla karşılaştı. Cunta içinde onu resmi liderimiz olarak atama desteği artıyor ve geriye kalan tek şey resmi bir bildiri yapmak."
 SPA_claim_the_aragonese_possessions:0 "Aragon Mülklerini Talep Et"
 SPA_claim_the_aragonese_possessions_desc:0 "Aragon Krallığı bir zamanlar Akdeniz'de geniş bir alana yayılmıştı. Aragon Krallığı'nın tarihi devamı olarak İspanya, bu toprakların kontrolüne geri verilmesini haklı olarak hak ediyor. Bu hakkı savunacağız."
 SPA_claim_the_french_throne:0 "Fransız Tahtını Talep Et"
 SPA_claim_the_french_throne_desc:0 "İspanyol ve Fransız tahtları yarım asırdan fazla bir süredir hanedan olarak bağlantılıdır. Mevcut Kralımız da farklı değil ve aynı zamanda Fransız tahtının meşruiyetçi talibidir. Bu, basitçe sömürülmesi gereken bir durumdur."
 SPA_claim_west_africa:0 "Batı Afrika'yı Talep Et"
 SPA_claim_west_africa_desc:0 "Batı Afrika'daki Fransız hakimiyeti tamamen haksızdır. Bölge, Ekvator Ginesi'ndeki sömürgemizle doğal bir coğrafi bağlantı oluşturur ve bu nedenle her açıdan İspanyol Sömürge İmparatorluğu'nun ayrılmaz bir parçası olarak kabul edilmelidir."
 SPA_commerce_protection:0 "Ticaret Koruması"
 SPA_commerce_protection_desc:0 "Küresel ticaret, her zamankinden daha fazla, sağlıklı bir ekonominin anahtarıdır. Kendi ticari gemiciliğimizi koruma yeteneği, kendimizi bulabileceğimiz herhangi bir gelecekteki çatışmada konumumuzu güçlendirecektir."
 SPA_con_paquito:0 "Paquitolu"
 SPA_con_paquito_desc:0 "Davamızın güçlü liderlere ihtiyacı var ve Francisco Franco, övülen Afrika Ordusu'nun sadakatine sahip. Ayaklanmamızın başarılı olması için, karar vermekteki oyalanmasına rağmen, desteğini almalıyız, ancak bu muhtemelen bir bedelle gelecektir..."
 SPA_con_paquito_tt:0 "İç savaşın başlamasıyla, §YFrancisco Franco§! bir Milliyetçi Mareşal olur.\n"
 SPA_confirm_the_fueros:0 "Fuerosları Onayla"
 SPA_confirm_the_fueros_desc:0 "Ulusun yönetimi Kral'ın yetkisi altındadır, ancak eski ayrıcalıklar Krallığı bir bütün olarak oluşturan bölgelerin kendi kendini yönetme hakkını korur. Bu haklar veya adlandırıldıkları gibi fueroslar, çeşitli bölgelerin sadakatinin sürdürülmesi isteniyorsa onaylanmalıdır."
 SPA_consolidate_the_north:0 "Kuzeyi Sağlamlaştır"
 SPA_consolidate_the_north_desc:0 "Zafere giden yolda ilk adım, kuzey topraklarının fethi ve sağlamlaştırılması olmalıdır. Bu tamamlandıktan sonra, Cumhuriyetçi cephedeki diğer savunmasız alanlara geçebiliriz."
 SPA_contact_the_union_militar_espanola:0 "Unión Militar Española ile Temas Kur"
 SPA_contact_the_union_militar_espanola_desc:0 "Cumhuriyete karşı komplo kuran subayların büyük bir gizli topluluğu olan Unión Militar Española'da, davamıza sempati duyabilecek birçok kişi var. Onlarla temas kurmalı ve zamanı geldiğinde bu liderlerden olabildiğince çok destek almalıyız."
 SPA_cultivate_fanaticism:0 "Fanatizmi Geliştir"
 SPA_cultivate_fanaticism_desc:0 "Karlist askerinin en takdire şayan özellikleri, tehlike ve zorluk karşısındaki azmi ve sarsılmaz kararlılığıdır, çünkü Tanrı'nın düşerlerse görevleri için onları ödüllendireceğini bilirler. Düşenlerin bu adanmışlığı ve fedakarlığı, tüm yeni acemiler için ulaşılması gereken bir örnek olarak tutulmalıdır."
 SPA_defenders_of_catholicism:0 "Katolikliğin Savunucuları"
 SPA_defenders_of_catholicism_desc:0 "Dört yüz yıl önce olduğu gibi, İspanya yine Katolik inancının savunucusu olmalıdır. Bu bağlamda, sıradan asker inancının kılıcı ve kalkanı olmalı ve Kralı onu savaşmak için nereye gönderirse göndersin bu kutsal görevi aklında tutmalıdır."
 SPA_defenses_against_invasion:0 "İşgale Karşı Savunmalar"
 SPA_defenses_against_invasion_desc:0 "İspanya'nın kıyı şeritleri çok geniştir ve işgal ihtimalini düşman için tatsız bir hale getirmek için elimizden geleni yapmalıyız. Güçlü tahkimatlar umarım ödülü maliyetine değmez hale getirir."
 SPA_defenses_against_invasion_tt:0 "Bir §YDonanma Üssü§! olan kıtasal çekirdek illere §Y1 Kale§! ve §Y2 Kıyı Kalesi§! yerleştirir.\n"
 SPA_defenses_against_strategic_bombing:0 "Stratejik Bombalamaya Karşı Savunmalar"
 SPA_defenses_against_strategic_bombing_desc:0 "Eğer küresel çatışmaya katılırsak, şehirlerimizin müstakbel düşmanlarımızın şüphesiz bize uygulayacağı kaçınılmaz büyük ölçekli stratejik bombalamaya karşı yeterince korunduğundan emin olmalıyız."
 SPA_demand_french_north_africa:0 "Fransız Kuzey Afrikası'nı Talep Et"
 SPA_demand_french_north_africa_desc:0 "[FRA.GetAdjective] kolonileri, anavatanlarının düşüşüyle zayıflamış durumda. Onlara korumamızı teklif etmeliyiz, reddetmenin bir seçenek olmadığı zımni anlayışıyla."
 SPA_develop_all_talent:0 "Tüm Yetenekleri Geliştir"
 SPA_develop_all_talent_desc:0 "Hak eden herkese, devlete ilgi duyabilecek fikirleri takip etmek için gerekli finansmanın yanı sıra yüksek öğrenime hazır erişim sağlanacaktır. Yeni araştırma ve geliştirme tesislerinin oluşturulmasına yatırım yapmak, şüphesiz bize çok sayıda farklı alanda birçok ödül verecektir."
 SPA_dictator_for_life:0 "Ömür Boyu Diktatör"
 SPA_dictator_for_life_desc:0 "Franco ulusuna iyi hizmet etti. Bu durumu değiştirme gereği görmüyoruz ve kesinlikle eskinin zayıf monarşisine geri dönme gereği de yok."
 SPA_dios_patria_rey:0 "Dios, Patria y Rey!"
 SPA_dios_patria_rey_desc:0 "Karlistlerin savaş çığlığı tarih boyunca yankılanır ve doğru olduğuna inandığımız inançları örnekler. Hepimizin Katolikliğin, yerel topluluklarımızın ve bir bütün olarak İspanyol ulusunun savunmasında ve Kralımızın nihai egemenliğinde sadece küçük bir rol oynadığımızı hatırlatır. Tanrı, Vatan ve Kral!"
 SPA_direct_the_universities:0 "Üniversiteleri Yönlendir"
 SPA_direct_the_universities_desc:0 "Şu anda akademide çalışan yetenek, şüphesiz askeri amaçlar için yönlendirilmiş araştırmalarda daha iyi kullanılabilir. Üniversitelere buna göre talimat vereceğiz."
 SPA_doctrinal_advancements:0 "Doktrinsel Gelişmeler"
 SPA_doctrinal_advancements_desc:0 "Yabancı destekçilerimiz önceki on yıllarda askeri düşünce ve doktrinde bol miktarda ilerleme kaydettiler. Belki de fikirlerini bizimle paylaşmaya ikna edebiliriz, böylece onları mevcut savaşımızda test edebiliriz."
 SPA_domestic_industrial_developments:0 "Yurtiçi Sanayi Gelişmeleri"
 SPA_domestic_industrial_developments_desc:0 "Batı yeniliği, İspanyol işçisi için uyarlanabilir, her iki dünyanın en iyisini alarak ve ulusun toparlanmasını iyileştirerek."
 SPA_eliminate_the_carlists:0 "Karlistleri Yok Et"
 SPA_eliminate_the_carlists_desc:0 "İspanya için vizyonumuz Karlistlerinkiyle uyumlu değil. Ölen bir hanedana tutunarak, zayıf liderleri ve dini fanatizmleriyle, İspanya'nın geleceği için bir tehdit oluşturuyorlar. Bu muhalifleri kökünden kazımalıyız, böylece gerçek güçlü liderler ortaya çıkabilir ve ülkeyi demir bir yumrukla birleştirebilir."
 SPA_embrace_pan_hispanism:0 "Pan-Hispanik Milliyetçiliği Kucakla"
 SPA_embrace_pan_hispanism_desc:0 "Son yıllarda, eski sömürgelerimizde Panhispanizmde bir artış oldu ve şimdi başarılı yeniden fetih kampanyalarımızla, onların fikirlerini kucaklama zamanı geldi, böylece İspanyol İmparatorluğu bin yıl daha ayakta kalabilir!"
 SPA_embrace_pan_hispanism_tt:0 "§Y[CHL.GetName]§!, §Y[ARG.GetName]§!, §Y[ECU.GetName]§!, §Y[PRU.GetName]§!, §Y[URG.GetName]§!, §Y[PAR.GetName]§!, §Y[BOL.GetName]§!, §Y[COL.GetName]§!, §Y[VEN.GetName]§!, §Y[PAN.GetName]§!, §Y[COS.GetName]§!, §Y[NIC.GetName]§!, §Y[HON.GetName]§!, §Y[ELS.GetName]§!, §Y[GUA.GetName]§!, §Y[MEX.GetName]§!, §Y[DOM.GetName]§!, §Y[CUB.GetName]§! ve §Y[PUE.GetName]§!'nin tüm çekirdek eyaletlerini kontrol ediyoruz."
 SPA_embrace_the_spanish_destiny:0 "İspanyol Kaderini Kucakla"
 SPA_embrace_the_spanish_destiny_desc:0 "İspanya eşsiz bir kaderi bekliyor: tüm İspanyollara güçlü ve özgür bir ulusa ait olma özgürlüğünü vermek; düşmanlarımızın itirazları üzerinden dünyadaki seçkin konumumuzu yeniden üstlenmek; ve Hristiyan yaşam tarzını savunmak."
 SPA_emergency_munitions_corporations:0 "Acil Durum Mühimmat Şirketleri"
 SPA_emergency_munitions_corporations_desc:0 "Eğer cesur birliklerimiz için yeterli düzeyde ikmal sağlamayı sürdüreceksek, savaş çabası derhal güçlendirilmelidir. Savaşmayanları, birliklerimiz için en temel ihtiyaçları yapacak derme çatma atölyelerde organize edeceğiz."
 SPA_encourage_local_industrialization:0 "Yerel Sanayileşmeyi Teşvik Et"
 SPA_encourage_local_industrialization_desc:0 "Sanayileşme çeşitli bölgesel hükûmetlerimiz tarafından teşvik edilmelidir, çünkü bunun gibi yerel girişimler şüphesiz bir bütün olarak ulusu güçlendirmeye hizmet edecektir."
 SPA_encourage_local_mining:0 "Yerel Madenciliği Teşvik Et"
 SPA_encourage_local_mining_desc:0 "Sanayimiz kaynaklara ihtiyaç duyuyor ve net ithalatçı rolünde rehavete kapıldı. Ülkemizde daha yaygın madencilik işletmelerine doğru bir hamleyi teşvik etmeliyiz, İberya yarımadasının zenginliklerinden yararlanmak ve yabancı tedarikçilere olan bağımlılığımızı azaltmak için."
 SPA_ensure_agricultural_self_sufficiency:0 "Tarımsal Kendi Kendine Yeterliliği Sağla"
 SPA_ensure_agricultural_self_sufficiency_desc:0 "Kendimizi yurtdışından gıda ithalatından kurtarmalıyız - tarımımız tüm ulusumuzu besleyebilecek noktaya kadar genişletilmelidir."
 SPA_equipment_modernization:0 "Teçhizat Modernizasyonu"
 SPA_equipment_modernization_desc:0 "Yeni ordumuz için sadece en iyi silahlar yeterli olacaktır ve buna göre yeni silahlar geliştirmeliyiz."
 SPA_equipment_shipments:0 "Teçhizat Sevkiyatları"
 SPA_equipment_shipments_desc:0 "Zaferimizi güvence altına almak için ihtiyaç duyduğumuz tek şey asker değil. Yurtdışındaki destekçilerimizin acil teçhizat ihtiyacımızı ve bu konuda bize nasıl yardımcı olabileceklerini anlamaları sağlanmalıdır."
 SPA_establish_the_directory:0 "Direktörlüğü Kur"
 SPA_establish_the_directory_desc:0 "Ayaklanmanın büyük mimarı Emilio Mola, Cunta'dan ve Falanj'ın siyasi liderlerinden planının bir sonraki aşamasına başlamak için yeterli desteği aldı: ülke güvence altına alınana kadar iç savaşın tüm yönlerini yönetecek bir Direktörlük kurulması."
 SPA_establish_the_directory_tt:0 "§Y[ROOT.GetName]§!, §Yİspanyol Direktörlüğü§! olarak bilinecektir.\n"
 SPA_exemplify_the_art_and_science_of_warfare:0 "Savaş Sanatı ve Bilimini Örnekle"
 SPA_exemplify_the_art_and_science_of_warfare_desc:0 "Savaş bir sanat olduğu kadar bir bilimdir de ve onu takip edenlere fikirlerini keşfetmeleri için gerekli araçları ve tesisleri vermeliyiz."
 SPA_expand_conscription:0 "Zorunlu Askerliği Genişlet"
 SPA_expand_conscription_desc:0 "İç savaş ülkemizi yıpratıyor, ancak Cumhuriyetçiler üzerindeki baskımızı hafifletemeyiz. Yenilenmiş bir askere alma çabasıyla beslenen yenilenmiş bir itme gereklidir."
 SPA_expand_spanish_bases:0 "İspanyol Üslerini Genişlet"
 SPA_expand_spanish_bases_desc:0 "İttifak kurduğumuz emperyalistler, nüfuzlarını dünyaya yaymak için üslerimizi kullanmayı arzuluyorlar. Onları barındırmak için kıtasal hava ve deniz üslerimizi genişletmeliyiz."
 SPA_expand_the_air_branch:0 "Hava Kolunu Genişlet"
 SPA_expand_the_air_branch_desc:0 "İç savaş bize hava gücünün oynadığı önemli rolü açıkça gösterdi. Eğer dikkate alınması gereken bir güç olacaksak, bu genişlememiz gereken bir alandır."
 SPA_expand_the_axis_gold_trade:0 "Mihver Altın Ticaretini Genişlet"
 SPA_expand_the_axis_gold_trade_desc:0 "Mihver güçleri, Müttefik ablukası altında gergin bir şekilde ticaret için çaresiz durumda. Altınları, hem bizden hem de diğer tarafsız ülkelerden doğal kaynaklar edinebilecekleri ulusumuza akıyor. Bundan büyük kar ediyoruz ve bu yüzden belki de bunu daha da teşvik etmeliyiz..."
 SPA_expand_the_requetes:0 "Requetéleri Genişlet"
 SPA_expand_the_requetes_desc:0 "Şimdiye kadar nispeten küçük, ama görece iyi eğitimli bir saldırı birliğine güvendik. Ancak hırslarımız çok daha fazlasını gerektiriyor. Bu Requetéleri genişletmeli ve avlanma çağrısına cevap veren herkes için gerekli eğitimi sağlamalıyız."
 SPA_expand_the_slipways:0 "Kızakları Genişlet"
 SPA_expand_the_slipways_desc:0 "Daha önce en büyük gemileri diğer uluslardan satın alıyorduk. Bu gemileri kendimiz inşa etme özgürlüğüne sahip olmak için kendi kızaklarımızın boyutunu artırmalıyız."
 SPA_expand_the_special_forces:0 "Özel Kuvvetleri Genişlet"
 SPA_expand_the_special_forces_desc:0 "Bir avuç uzman, düzinelerce normal piyadenin başaramayacağını başarabilir. Belirli görevler için özel eğitime başlayacak, ihtiyaç ortaya çıkması durumunda gerekli araçların emrimizde olmasını sağlayacağız."
 SPA_expand_the_war_industry:0 "Savaş Sanayisini Genişlet"
 SPA_expand_the_war_industry_desc:0 "Güçlü bir devlet, eğer o gücü sergileyecekse büyük bir savaş sanayisi gerektirir - ve bizimki daha büyük olabilir."
 SPA_extol_the_martyrs_of_the_war:0 "Savaşın Şehitlerini Yücelt"
 SPA_extol_the_martyrs_of_the_war_desc:0 "Davamız için canlarını verenler, fedakarlıkları için hatırlanmalı ve onurlandırılmalıdır. Eylemleri hepimize bir örnek olarak hizmet etmelidir."
 SPA_facilitate_pyrenees_freight_transports:0 "Pirene Yük Taşımacılığını Kolaylaştır"
 SPA_facilitate_pyrenees_freight_transports_desc:0 "Kuzeyden gelen yeni malzeme tedariki, talebi karşılamak için daha da kolaylaştırılmalıdır ve bu yüzden Pirene'lerden geçen demiryollarını genişleteceğiz."
 SPA_facilitate_pyrenees_freight_transports_tt:0 "§YMadrid§!, §YGuadalajara§!, §YDoğu Aragón§!, §YCataluña§!, §YBurgos§! ve §YPaís Vasco§!'da maksimum §YAltyapı§! ekle."
 SPA_fascist_economic_aid:0 "Faşist Ekonomik Yardım"
 SPA_fascist_economic_aid_desc:0 "İç savaş ulusumuzu harap etti, ama belki yeni müttefiklerimiz yeniden yapılanma programlarımıza yardımcı olmaya istekli olabilir."
 SPA_foment_a_carlist_split:0 "Bir Karlist Bölünmesini Kışkırt"
 SPA_foment_a_carlist_split_desc:0 "Karlistler, Milliyetçi cephenin kendisi kadar içeriden bölünmüş durumda. Çeşitli Karlist liderleri birbirine düşürerek güçlerini zayıflatabilir, farklı Karlist gruplarla ayrı anlaşmalar yapma yolunu açabiliriz."
 SPA_found_the_academia_vazquez_de_mella:0 "Academia Vázquez De Mella'yı Kur"
 SPA_found_the_academia_vazquez_de_mella_desc:0 "Yeni İspanyol monarşisine fayda sağlayabilecek yeni ilerlemeler ve gelişmeler yapmak için Karlist düşünürler tarafından da kullanılabilecek büyük bir Gelenekçi düşünce merkezi kurmalıyız."
 SPA_fuse_the_parties:0 "Partileri Birleştir"
 SPA_fuse_the_parties_desc:0 "Gerekli zemin hazırlandı ve Falanj ile Karlistleri, Francisco Franco başkanlığında tek bir partide birleştirme zamanı geldi."
 SPA_fuse_the_parties_tt:0 "§YYaklaşan Karlist Ayaklanması§! §Ggörevini§! §Gkaldırır.§!\n"
 SPA_glory_and_wealth_on_the_sea_lanes:0 "Deniz Yollarında Şan ve Zenginlik"
 SPA_glory_and_wealth_on_the_sea_lanes_desc:0 "İspanya'nın kaderi her zaman okyanusların ötesinde yattı. Şan ve zenginlik bizi bekliyor, sadece geçmişte olduğu gibi deniz yolları üzerindeki kontrolümüzü yenilememiz gerekiyor."
 SPA_hand_over_the_ceda_campaign_chest:0 "CEDA Kampanya Sandığını Devret"
 SPA_hand_over_the_ceda_campaign_chest_desc:0 "Seçim kampanyamızdan sonra elimizde bol miktarda fon kaldı. Parlamentonun sesimizi reddetmesi durumunda, onun ortadan kaldırılmasına hazırlanmalıyız. Confederación Española de Derechas Autónomas'ın kampanya sandığını ordunun aydınlanmış kesimlerine devredeceğiz, böylece Sola karşı ayaklanmalarını hazırlayabilirler."
 SPA_head_the_junta_nacional:0 "Junta Nacional'e Başkanlık Et"
 SPA_head_the_junta_nacional_desc:0 "Karlist savaş makinesinin en yüksek savaş zamanı yürütme organı olan Junta Nacional Carlista de Guerra, çeşitli Karlist bölgesel cuntalarını birleştirecek bir lidere ihtiyaç duyar. Manuel Fal Conde o lider olabilir."
 SPA_imperial_security:0 "İmparatorluk Güvenliği"
 SPA_imperial_security_desc:0 "İmparatorluğun güvenliği büyük ana gemilerde değil, bunun yerine yeterli miktarda kruvazörde yatmaktadır. Yeni modellerin ve yeni ticaret koruma doktrinlerinin geliştirilmesi derhal başlamalıdır, böylece denizaşırı mülklerimize ikmal sağlanmasını güvence altına alabiliriz."
 SPA_improve_cross_country_railways:0 "Ülke Çapı Demiryollarını İyileştir"
 SPA_improve_cross_country_railways_desc:0 "Ulusal demiryolu ağımızın genişletilmesi sadece çok ihtiyaç duyulan işleri sağlamakla kalmayacak, aynı zamanda birliklerin, ikmalin hareketini kolaylaştıracak ve tüm İspanyollar için ulusal bir gurur kaynağı olarak hizmet edecektir."
 SPA_improve_domestic_naval_facilities:0 "Yurtiçi Donanma Tesislerini İyileştir"
 SPA_improve_domestic_naval_facilities_desc:0 "Büyük bir donanma, büyük bir altyapı gerektirir. Yeni tersaneler ve tesisler gereklidir ve bunların inşasına şimdiden başlamalıyız."
 SPA_improve_living_standards:0 "Yaşam Standartlarını İyileştir"
 SPA_improve_living_standards_desc:0 "Ulusumuzun ekonomik yükselişinden elde edilen faydalardan, statüsü ne olursa olsun herkesin pay almasına izin verilmelidir."
 SPA_integrate_the_requetes:0 "Requetéleri Entegre Et"
 SPA_integrate_the_requetes_desc:0 "Düşünce tarzımıza daha yatkın olan Karlist Requetéler, silahlı kuvvetlerimize daha yakından entegre edilmelidir. Deneyimleri ve eğitimleri önümüzdeki mücadelede paha biçilmez olacaktır."
 SPA_invest_in_naval_infrastructure:0 "Donanma Altyapısına Yatırım Yap"
 SPA_invest_in_naval_infrastructure_desc:0 "İspanya, filomuzun genişlemesini desteklemek için yeni donanma tesislerine ihtiyaç duyuyor."
 SPA_italian_shipbuilding_expertise:0 "İtalyan Gemi İnşa Uzmanlığı"
 SPA_italian_shipbuilding_expertise_desc:0 "İtalyan uzmanları davet ederek gemi inşa yeteneklerimizi geliştirebilmeli, özellikle en büyük gemiler açısından donanmamızı daha kolay genişletmemize olanak sağlamalıyız."
 SPA_join_the_allies:0 "Müttefiklere Katıl"
 SPA_join_the_allies_desc:0 "Sarkacın hangi yöne sallandığı bizim için açık - Müttefiklere katılacak, onların güçlü ekonomik yardımını kabul edecek ve kaçınılmaz olarak savaşı kazandıklarında onların iyi tarafında olduğumuzdan emin olacağız."
 SPA_join_the_axis:0 "Mihver'e Katıl"
 SPA_join_the_axis_desc:0 "İspanya'nın geleceği, kurulu dünya düzeninin devrilmesinde yatmaktadır. Bizim gibi düşünenlerle ittifak kurmalıyız, böylece gücümüzü onlarınkiyle birleştirebiliriz."
 SPA_la_division_azul:0 "La División Azul"
 SPA_la_division_azul_desc:0 "Komünist tehdidi burada İberya'da yenmiş olsak da, kötülüğün kökü hala Doğu'da duruyor. Savaşın yükünü başkaları taşırken, bu tehditle mücadelede üzerimize düşeni yapmak için bir gönüllü tümeni göndermeliyiz."
 SPA_mandatory_pre_military_training:0 "Zorunlu Askerlik Öncesi Eğitim"
 SPA_mandatory_pre_military_training_desc:0 "Orduya askere alınmaya hazırlanmak için, tüm erkekler zorunlu askerlik öncesi eğitim alacaktır."
 SPA_martyrdom_for_primo_de_rivera:0 "Primo De Rivera için Şehitlik"
 SPA_martyrdom_for_primo_de_rivera_desc:0 "Falanj partisinin kurucusu José Antonio Primo de Rivera, iç savaşın başlamasından beri hapsedilmiş durumda. Bize bir esir takası teklif edilmiş olsa da, belki de bu potansiyel siyasi rakip, idam edilmiş bir şehit olarak davamıza daha iyi hizmet eder... Esir takası için yapılan müzakerelerin 'başarısız' olmasını sağlayacağız."
 SPA_militarize_the_masses:0 "Kitleleri Militarize Et"
 SPA_militarize_the_masses_desc:0 "Savunduğumuz değerler tek başına Requetélerimiz tarafından savunulamaz. Taç'a sadık olan ve kalplerinde Tanrı sevgisi taşıyan herkes, ideallerinin savunmasında askeri görevini yapmalıdır."
 SPA_motorization:0 "Motorizasyon"
 SPA_motorization_desc:0 "Bir ordunun kitlesel motorizasyonu, geniş bir yelpazede yeni taktiksel ve stratejik fırsatlar sunar. Bu, kaçıramayacağımız bir avantajdır."
 SPA_national_recovery:0 "Ulusal Toparlanma"
 SPA_national_recovery_desc:0 "İç savaşın yıkımından toparlanmak için ortak bir ulusal çaba gösterme zamanı geldi."
 SPA_negotiate_carlist_support:0 "Karlist Desteğini Müzakere Et"
 SPA_negotiate_carlist_support_desc:0 "Davamızın sadece ulaşmamız gereken müttefikleri var. Sol'un din karşıtı duyguları, uzun süredir Cumhuriyet ile bir çatışmaya hazırlanan Karlistleri düşmanlaştırdı. Eğer onların desteğini kazanırsak, ayaklanmamız çok daha güçlenecektir."
 SPA_negotiate_carlist_support_tt:0 "İç savaşın başlamasıyla, §Y3 piyade§! taburlu 5 iyi eğitimli birlik kazanılır.\n"
 SPA_negotiate_carlist_support_tt_2:0 "§REğer İspanya Karlist olmazsa, bu birlikler İç Savaşın sonunda kaldırılacaktır!§!\n"
 SPA_no_compromise_on_carlist_ideals:0 "Karlist İdeallerinden Taviz Yok"
 SPA_no_compromise_on_carlist_ideals_desc:0 "İlk ayaklanmamızda Falanj ile iş birliği yapmış olsak da, şimdi ideallerimizden taviz vermenin vatana ihanetle eşdeğer olduğu bizim için açık. Eğer Falanj taleplerimizi kabul etmezse, o zaman onları da ortadan kaldırmaktan başka seçeneğimiz yok."
 SPA_no_compromise_on_carlist_ideals_tt:0 "§RFaşist destekçiler bir iç savaş başlatacak!§!\n"
 SPA_no_compromise_on_carlist_ideals_tt_2:0 "§Y[ROOT.GetName]§!, §YKarlist İspanya§! olarak bilinecektir.\n"
 SPA_obtain_training_staff:0 "Eğitim Personeli Edin"
 SPA_obtain_training_staff_desc:0 "Gururumuzu incitebilecek olsa da, yabancı destekçilerimizin savaş sanatında sahip olduğu üstün deneyimi kabul etmeliyiz. Subaylarımızı eğitmek ve birliklerimizi eğitmeye yardımcı olmak için askeri uzmanlarını İspanya'ya davet etmeliyiz, bu da bize Cumhuriyetçilere karşı gerekli avantajı sağlayacaktır."
 SPA_portuguese_aid:0 "Portekiz Yardımı"
 SPA_portuguese_aid_desc:0 "Yardımı nereden gelirse gelsin kabul etmeliyiz. 1932'deki başarısız isyandan sonra kaçmak zorunda kalan liderlerimizin çoğunu barındıran Portekiz, eğer istersek bize maddi yardım sağlamaya istekli olabilir ve bu, gelecekte daha da yakın bir iş birliğinin temelini bile oluşturabilir."
 SPA_prepare_the_carlist_insurrection:0 "Karlist Ayaklanmasını Hazırla"
 SPA_prepare_the_carlist_insurrection_desc:0 "Falanj ile ittifakımız bir zorunluluktan doğmuştur ve ömrü şimdiden haftalarla sayılabilir. Sözde müttefiklerimiz bize saldırmadan önce onlara saldırmalı ve kusurlu ideolojilerini halkın zihninde kök salma şansı bulamadan ortadan kaldırmalıyız."
 SPA_prepare_the_carlist_insurrection_tt:0 "Ayaklanmada Karlist tarafı için kontrol edilen eyaletleri güvence altına almaya olanak tanıyan §YKarlist Ayaklanmasını Hazırlama§! kararlarının kilidini açar.\n\nAyrıca, eğer kontrol ediliyorsa, §YBurgos§! ve §YNavarra§!'yı Karlist tarafı için güvence altına alır."
 SPA_prepare_the_pyrenees_defenses:0 "Pirene Savunmalarını Hazırla"
 SPA_prepare_the_pyrenees_defenses_desc:0 "Cumhuriyetçilerin yardım çığlıklarıyla [FRA.GetNameDef]'e ulaştığına dair söylentiler kulağımıza geldi. Pek olası olmasa da, bunun doğru olma riskini alıp kuzey sınırlarımızı savunmasız bırakamayız. [FRA.GetAdjective] müdahalesi ihtimaline karşı savunma hazırlıkları derhal başlatılmalıdır."
 SPA_prepare_the_pyrenees_defenses_tt:0 "§YPaís Vasco§!, §YNavarre§!, §YBatı Aragón§!, §YDoğu Aragón§! ve §YCataluña§!'daki Fransız sınırındaki illere 2. seviye §YKale§! yerleştirir.\n"
 SPA_press_the_gibraltar_claim:0 "Cebelitarık İddiasını Bastır"
 SPA_press_the_gibraltar_claim_desc:0 "Cebelitarık enklavının varlığının Kralımıza olan hakaretinin intikamı alınmalıdır."
 SPA_primo_de_rivera_prisoner_exchange:0 "Primo De Rivera Esir Takası"
 SPA_primo_de_rivera_prisoner_exchange_desc:0 "Falanj'ın kurucusu, eski diktatör Miguel Primo de Rivera'nın oğlu José Antonio Primo de Rivera, iç savaşın başlamasından önce bile hapsedilmişti. Cumhuriyetçiler bizimle bir esir takasına girme niyetlerini belirttiler ve eğer ideolojik liderimizi geri kazanacaksak, kabul etmeliyiz."
 SPA_prosperity_of_the_empire:0 "İmparatorluğun Refahı"
 SPA_prosperity_of_the_empire_desc:0 "İmparatorluğun toparlanması ve refahı çok önemlidir ve ulusumuzun altyapısını iyileştirmeye ve dolayısıyla ticareti ve endüstriyel gelişmeyi teşvik etmeye ek odaklanarak, bu hedefe kısa sürede ulaşılmasını sağlayacağız."
 SPA_reassert_american_dominance:0 "Amerika Hakimiyetini Yeniden Sağla"
 SPA_reassert_american_dominance_desc:0 "Bağımsızlıklarından bu yana geçen yüzyılda Latin Amerika'daki çeşitli uluslar sadece kendi aralarında çekişip durdular. Kültürel birliğimizde yatan gücü unuttular ve bu yüzden onlara etraflarında döndükleri eksenin biz olduğumuzu hatırlatacağız."
 SPA_reassert_american_dominance_tt:0 "Daha zayıf Amerikan ülkelerinin barışçıl bir şekilde boyun eğdirilmesine olanak tanıyan §YAmerika Hakimiyetini Yeniden Sağla§! kararlarının kilidini açar.\n"
 SPA_rebuild_the_battlefleet:0 "Savaş Filosunu Yeniden İnşa Et"
 SPA_rebuild_the_battlefleet_desc:0 "İspanyol-Amerikan Savaşı'ndan sonra kırk yıl boyunca donanmamız uyuşuk ve çekingen oldu. Herhangi bir düşmanla başa çıkabilecek yeni büyük savaş gemilerinin eklenmesi, saflarında bir yeniden doğuş hissi uyandıracak ve aynı zamanda komşularımızla denizlerde rekabet etmemize olanak tanıyacaktır."
 SPA_reclaim_spanish_africa:0 "İspanyol Afrikası'nı Genişlet"
 SPA_reclaim_spanish_africa_desc:0 "Kuzey Afrika'daki mülklerimizin mevcut sınırlarının taşa yazılması için hiçbir neden yok. Mevcut Fransız zayıflığıyla, belki de bölgedeki iddiamızı ortaya koymak için şimdiden daha iyi bir zaman yoktur."
 SPA_reduce_reliance_on_foreign_resources:0 "Yabancı Kaynaklara Bağımlılığı Azalt"
 SPA_reduce_reliance_on_foreign_resources_desc:0 "Başkalarına bağımlılık, potansiyel düşmanlarımız tarafından ancak sömürülebilecek bir zayıflıktır. Elimizden geldiğince her kaynakta kendi kendine yeterlilik için çabalamalıyız."
 SPA_reduce_reliance_on_foreign_resources_tt:0 "Mevcut kaynak yataklarının genişletilmesine ve yeni anakara kaynak yataklarının geliştirilmesine olanak tanıyan benzersiz §YKynak Araştırması§! kararlarının kilidini açar.\n"
 SPA_regional_agrarian_commissions:0 "Bölgesel Tarım Komisyonları"
 SPA_regional_agrarian_commissions_desc:0 "Kırsal kesim savaş tarafından harap edildi. Halkın aç kalmamasını sağlamak için, her bölge için derhal yürürlüğe girecek tarım komisyonları kuracağız. Bunlar, hasar görmemiş ekilebilir arazinin verimliliğini en üst düzeye çıkaracak ve halkı beslememizi sağlayacaktır."
 SPA_restart_small_scale_shipbuilding:0 "Küçük Ölçekli Gemi İnşaatını Yeniden Başlat"
 SPA_restart_small_scale_shipbuilding_desc:0 "Donanmamız, daha küçük yerli tersanelerin inşa edebileceği boyutta çok sayıda eskort gemisine ihtiyaç duyacaktır. Bu tersaneler tarafından yeni tasarımların geliştirilmesini teşvik etmeliyiz."
 SPA_restore_the_empire:0 "İmparatorluğu Restore Et"
 SPA_restore_the_empire_desc:0 "İmparatorluğumuz bekliyor! Onu ele geçirmemize olanak tanıyacak askeri sanayiyi kurmamız yeterli."
 SPA_restore_the_iberian_union:0 "İberya Birliği'ni Restore Et"
 SPA_restore_the_iberian_union_desc:0 "İspanya ve Portekiz'in en son bir kaderi paylaşmasının üzerinden neredeyse dört yüzyıl geçti, ama çok kısa sürdü. İberya birlikte daha güçlüdür ve bu yüzden Portekiz tahtı üzerinde yeni bir iddianın 'keşfedilmesini' sağlayacağız..."
 SPA_restore_the_monarchy:0 "Monarşiyi Restore Et"
 SPA_restore_the_monarchy_desc:0 "Geçici hükûmet, komünistlerin kovulması ve İkinci Cumhuriyet'in sona ermesinde amacına hizmet etti. Şimdi İspanyol monarşisinin restorasyon zamanı!"
 SPA_restore_the_monarchy_tt:0 "§Y[ROOT.GetName]§!, §Yİspanya Krallığı§! olarak bilinecektir.\n"
 SPA_retake_gibraltar:0 "Cebelitarık'ı Geri Al"
 SPA_retake_gibraltar_desc:0 "Cebelitarık'ın İspanya'nın sıcak bağrından koparılmasının üzerinden iki yüzyıldan fazla zaman geçti. İberya'nın yüzündeki bu Britanyalı yaranın varlığına devam edilemez."
 SPA_retake_the_americas:0 "Amerikaları Geri Al"
 SPA_retake_the_americas_desc:0 "Büyük Latin Amerika güçlerinin liderliğimizi isteyerek kabul etme niyeti yok - ne de eski mülklerimizi [USA.GetNameDef]'den bir savaş olmadan geri alacağız. Meydan okuma büyük olsa da, eğer onu aşabilirsek, imparatorluk emellerimizin gerçekleşmesi yakındır."
 SPA_retake_the_spanish_netherlands:0 "İspanyol Hollandası'nı Geri Al"
 SPA_retake_the_spanish_netherlands_desc:0 "İmparatorluğumuz bir zamanlar Almanya'nın sınırlarına kadar uzanıyordu. Tekrar öyle olmaması ve bu süreçte 80 Yıl Savaşlarının intikamını almamız için hiçbir neden yok."
 SPA_revive_the_spirit_of_the_carlist_wars:0 "Karlist Savaşlarının Ruhunu Canlandır"
 SPA_revive_the_spirit_of_the_carlist_wars_desc:0 "19. yüzyıldaki Karlist savaşları davamız için üzücü kayıplar olabilir, ancak direniş ruhu bu güne kadar yaşıyor. Haklı varis İspanyol tahtına oturana ve tüm İspanyollar için Hristiyan inancını koruyana kadar dinlenmeyeceğiz."
 SPA_safeguard_the_freedom_of_worship:0 "İbadet Özgürlüğünü Koru"
 SPA_safeguard_the_freedom_of_worship_desc:0 "Cumhuriyetçiler Tanrı'ya olan inancı tehdit ediyor ve biz de Hristiyanlığın son kalesi olduğumuzu herkese açıkça belirtmeliyiz. Tüm Hristiyanların ibadet hakkını ve özgürlüğünü koruyacağız ve dileyen herkes onların savunmasında mücadelemize katılabilir."
 SPA_save_the_alcazar:0 "Alkazar'ı Kurtarın!"
 SPA_save_the_alcazar_desc:0 "Toledo'daki Alkazar hala davamıza sadık kuvvetler tarafından tutuluyor, ancak kuşatma altındalar! Onları kurtarmak, stratejik olarak önemli olmasa da, büyük bir propaganda zaferi olacak ve Francisco Franco'nun askeri cuntanın fiili lideri olarak konumunu pekiştirecektir."
 SPA_secure_the_national_defense_council:0 "Ulusal Savunma Konseyi'ni Güvence Altına Al"
 SPA_secure_the_national_defense_council_desc:0 "Lidersiz, davamız gevşek bir şekilde hizalanmış hedeflere sahip bir askeri ve sivil liderler Cuntası tarafından yönetiliyor. Eğer irademizi dayatacak ve İspanya'nın hak ettiği yeniden doğuşu başaracaksak, bu çeşitli ve bazen kavgacı örgüt üzerinde hakimiyet sağlamalıyız."
 SPA_secure_the_northern_garrisons:0 "Kuzey Garnizonlarını Güvence Altına Al"
 SPA_secure_the_northern_garrisons_desc:0 "Uygun 'teşvik' ile Kuzey'deki garnizon komutanlarının desteğini alacağız. İyi zamanlanmış eş zamanlı bir ayaklanma ile bu, ilk darbe girişimimiz başarısız olursa, Solculara karşı savaşımızı yürüteceğimiz sağlam bir güç üssü sağlayacaktır."
 SPA_secure_the_northern_garrisons_tt:0 "§Y[171.GetName]§!, §Y[174.GetName]§!, §Y[788.GetName]§!, §Y[791.GetName]§!, §Y[176.GetName]§!, §Y[166.GetName]§! ve §Y[172.GetName]§!'deki §YGarnizon Kontrolünü§! §GTam§!'a yükseltir.\n\nMilliyetçiler, bu illerdeki §YGarnizon Kontrolleri§! en az §OZayıf§! olduğu sürece iç savaşa bu illerin kontrolünde başlayacaktır.\n"
 SPA_settle_the_succession_question:0 "Veraset Sorununu Çöz"
 SPA_settle_the_succession_question_desc:0 "Karlist davası, tahta farklı iddiaları destekleyen kamplar arasında bölünmüş durumda. Karlist varisi Alfonso Carlos, 1936 sonlarında çocuksuz öldü, ancak ölmeden önce varisi olarak Xavier of Bourbon-Parma'yı atadı. Ancak, bunun yerine eski sürgündeki anayasal kral XIII. Alfonso'nun iddiasını destekleyenler de var."
 SPA_sin_paquito:0 "Paquitosuz"
 SPA_sin_paquito_desc:0 "Hükümet, potansiyel sadakatsizliğinden korkarak Francisco Franco'yu Kanarya Adaları'ndaki kuvvetlere komuta etmesi için gönderdi. Ancak davetlerimize rağmen kendisi de bize destek sözü vermedi, kararsızlığıyla bizi oyalamaktan başka bir işe yaramadı. Eğer \"Kanarya Adaları Güzeli 1936\" bize katılmaya karar vermezse o zaman onsuz devam edeceğiz."
 SPA_spanish_austerity:0 "İspanyol Kemer Sıkma Politikası"
 SPA_spanish_austerity_desc:0 "İstenmese de, ulusumuzun toparlanması için ihtiyaç duyduğumuz fonları serbest bırakmak için bir kemer sıkma politikası gereklidir."
 SPA_stamp_out_the_maquis:0 "Makileri Kökünden Kazı"
 SPA_stamp_out_the_maquis_desc:0 "Düşmanlarımızın kalıntıları olan Makiler, İspanyol anakarası üzerindeki kontrolümüze meydan okumak amacıyla sürekli bir gerilla savaşı yürüttüler. Zamanla, nüfuzları azaldı ve şimdi onları tamamen kökünden kazımanın tam zamanı."
 SPA_strengthen_the_empire:0 "İmparatorluğu Güçlendir"
 SPA_strengthen_the_empire_desc:0 "Yeni filizlenen İspanyol İmparatorluğu'nun ekonomisi hala mücadele ediyor ve hazinenin daha fazlası, sanayimizin İç Savaşın yıkımından daha hızlı toparlanmasını sağlamak için tahsis edilmelidir."
 SPA_strengthen_the_supreme_reality_of_spain:0 "İspanya'nın Yüce Gerçekliğini Güçlendir"
 SPA_strengthen_the_supreme_reality_of_spain_desc:0 "Çok uzun zamandır ayrılıkçılık, muhalefet ve yerel özerklik İspanyol devletini zayıflattı. Bu saçma sapan nosyonları ortadan kaldıracak ve herkesin, grubu veya sınıfı ne olursa olsun, ilişki kurabileceği ve katkıda bulunabileceği birleşik bir İspanya için yeni bir gerçeklik sunacağız."
 SPA_support_the_war_industry:0 "Savaş Sanayisini Destekle"
 SPA_support_the_war_industry_desc:0 "Savaş sanayimizi genişletmeden önce, bağlı olacağı yan sanayiyi genişletmeye dikkat etmeliyiz."
 SPA_supremacy_of_the_communion:0 "Cemaatin Üstünlüğü"
 SPA_supremacy_of_the_communion_desc:0 "Tanrı'nın Cenneti ve Dünyayı yarattığı ne kadar kesinse, Gelenekçi Cemaat de İspanya'nın üniter geleceğinin anahtarını o kadar elinde tutar. 19. yüzyıldaki Karlist ayaklanmaları engellenmiş olabilir, ancak ruhları asla kırılmadı: İnanca sadık olanlar, Cumhuriyete karşı bir kez daha ayaklanmaya hazırdır."
 SPA_suspend_the_constitution:0 "Anayasayı Askıya Al"
 SPA_suspend_the_constitution_desc:0 "Zayıflığını ve kusurluluğunu defalarca kanıtlamış bir anayasaya bağlı kaldıkça ilerleme kaydedemeyiz. Onu askıya alacak, bu gerekli kardeş katliamı boyunca bize rehberlik edebilecek bir askeri geçiş hükûmetinin yolunu açacağız, bu da zamanla yeni, güçlü, otoriter bir hükûmete yol açacaktır."
 SPA_syndicalize_production:0 "Üretimi Sendikalaştır"
 SPA_syndicalize_production_desc:0 "Hareketimiz hem kapitalizmden hem de komünizmden kendini ayırır. Bunun yerine, çalışanların ve işverenlerin tüm İspanya'nın iyiliği için verimliliği en üst düzeye çıkarmak üzere birlikte çalışabilecekleri ulusal sendikalar oluşturacağız."
 SPA_tackle_the_vulnerable_fronts:0 "Savunmasız Cephelerle Mücadele Et"
 SPA_tackle_the_vulnerable_fronts_desc:0 "Düşman cephe hattının belirli kısımlarında güvenlik açıkları gözlemlendi. Taarruzlarımızın etkisini en üst düzeye çıkarmak için bu alanlara odaklanmalıyız."
 SPA_tackle_the_vulnerable_fronts_tt:0 "Bir taarruzun başlangıcında düşmana karşı geçici bir savaş bonusu sağlayarak §Yİç Savaş Taarruzları§! kararlarını yükseltir.\n"
 SPA_the_army_of_africa:0 "Afrika Ordusu"
 SPA_the_army_of_africa_desc:0 "Yaklaşan mücadelede zaferin anahtarı, tecrübeli Afrika Ordusu'dur. Onların davamıza sadakatini sağlamalı, Kuzey Afrika'nın yıldırım işgali için planlar yapmalı ve ardından bu savaşta sertleşmiş birlikleri, lehimize dengeyi değiştirebilecekleri anakaraya transferini hazırlamalıyız."
 SPA_the_army_of_africa_model:0 "\"Afrika Ordusu\" Modeli"
 SPA_the_army_of_africa_model_desc:0 "Afrika Ordusu'nun iç savaştaki başarısı gözden kaçmadı. Yeni ordumuz onun belirlediği standardı karşılamalı ve bu yüzden onu onların örneğine göre modelleyeceğiz."
 SPA_the_army_of_africa_tt:0 "İç savaşın başlamasıyla, §Y7 piyade§! ve §Y2 topçu§! taburlu ve §YKeşif§! ve §Yİstihkâm§! Destekli 5 iyi eğitimli birlik ve §Y[290.GetName]§! üzerinde garantili kontrol kazanılır.\n"
 SPA_the_condor_legion:0 "Kondor Lejyonu"
 SPA_the_condor_legion_desc:0 "[GER.GetNameDef]'deki destekçilerimiz bize mücadelemizde yardımcı olmak için Kondor Lejyonu'nu gönderdi, ancak başarılı olacaksak büyük ölçüde genişletilmesi gerekecek. Davamızı savunmak ve adımıza daha fazla askeri yardım almak için [GER.GetNameDef]'e bir diplomatik elçi göndereceğiz."
 SPA_the_corpo_truppe_volontarie:0 "Corpo Truppe Volontarie"
 SPA_the_corpo_truppe_volontarie_desc:0 "[ITA.GetNameDef]'deki destekçilerimiz bize mücadelemizde yardımcı olmak için Corpo Truppe Volontarie'yi gönderdi, ancak başarılı olacaksak büyük ölçüde genişletilmesi gerekecek. Davamızı savunmak ve adımıza daha fazla askeri yardım almak için [ITA.GetNameDef]'e bir diplomatik elçi göndereceğiz."
 SPA_the_crusade_against_democracy:0 "Demokrasiye Karşı Haçlı Seferi"
 SPA_the_crusade_against_democracy_desc:0 "Sadece haklı Karlist varisi, Tanrı'nın Kendisi tarafından, yönetme ilahi hakkıyla görevlendirilmiştir. Demokrasi sadece Kral'a bir hakaret değil, aynı zamanda Tanrı'nın İradesine karşı bir küfürdür. Bu vebanın bu dünyada daha fazla var olmasına izin verilmemelidir."
 SPA_the_crusade_against_democracy_timer_tt:0 "§YDemokrasiye Karşı Haçlı Seferi§! son değiştirildiğinden beri en az 70 gün geçti.\n"
 SPA_the_duty_to_work:0 "Çalışma Görevi"
 SPA_the_duty_to_work_desc:0 "Tüm İspanyolların devlete karşı bir görevi vardır. Eğer bu görev onların cephede savaşmasını gerektirmiyorsa, savaşanları tedarik etmek ve donatmak için ellerinden geleni yapmalarını gerektirecektir."
 SPA_the_fifth_column:0 "Beşinci Kol"
 SPA_the_fifth_column_desc:0 "Emilio Mola'nın sözleriyle: \"Dört sütunum Madrid'e yaklaşırken, şehrin içinden beşinci bir destek kolu yükselecek ve Cumhuriyetçi savunmayı içeriden zayıflatacak\". Yaklaştığımız tüm şehirlerde bu 'Beşinci Kollar'ı düzenleyerek bize kesin bir avantaj sağlayacağız."
 SPA_the_fifth_column_tt:0 "Düşman toprağında küçük ayaklanmalar yaratmaya olanak tanıyan §YBeşinci Kolları Aktive Et§! Kararlarının kilidini açar.\n"
 SPA_the_iberian_pact:0 "İberya Paktı"
 SPA_the_iberian_pact_desc:0 "İki ulusumuzun bütünlüğü, aralarındaki iyi ilişkilere dayanmaktadır. Hem İspanya'nın hem de Portekiz'in girdikleri herhangi bir küresel savaşta veya katıldıkları herhangi bir ittifakta her zaman aynı tarafta yer alacakları bir pakt önermeliyiz. Birleşik bir İberya, güçlü bir İberya'dır!"
 SPA_the_iberian_pact_tt:0 "Bu anlaşma, her iki tarafı da diğerinin katıldığı herhangi bir ittifaka veya herhangi bir savaşta aynı tarafa katılmakla yükümlü kılar.\n"
 SPA_the_iberian_pact_tt_2:0 "§RBonusların etkili olması için [POR.GetNameDefCap]'in anlaşmayı onaylaması gerekir.§!\n"
 SPA_the_latin_bloc:0 "Latin Bloku"
 SPA_the_latin_bloc_desc:0 "Dünyada büyük güç blokları oluşuyor. Aralarında artan gerilimlere karışmak yerine, kültürel ve ideolojik olarak bizim gibi olan uluslarla kendi güç bloğumuzu kurmalıyız: Akdeniz çevresindeki Latin ülkeleri."
 SPA_the_national_and_popular_army_of_spain:0 "İspanya'nın Ulusal ve Halk Ordusu"
 SPA_the_national_and_popular_army_of_spain_desc:0 "Yeni İspanyol ulusunun askeri gücü, tüm sağlıklı erkeklerin askere alınma onuruna sahip olacağı ulusal ve halk ordusunda organize edilecektir."
 SPA_the_national_syndicalist_state:0 "Nasyonal-Sendikalist Devlet"
 SPA_the_national_syndicalist_state_desc:0 "İç savaş bitti ve geçici askeri hükûmetin kontrolü bırakıp Falanj'ın gerçek liderlerinin ortaya çıkıp İspanya için yeni bir dönem başlatma zamanı geldi."
 SPA_the_national_syndicalist_state_tt:0 "§Y[ROOT.GetName]§!, §Yİspanyol İmparatorluğu§! olarak bilinecektir.\n"
 SPA_the_phalanx_ascendant:0 "Yükselen Falanj"
 SPA_the_phalanx_ascendant_desc:0 "Falanj'ın yükselişi şimdi. Sona ermiş Cumhuriyet ölüm döşeğinde ve mücadele uzun ve zor olacak olsa da, İspanyol İmparatorluğu'nun yeniden doğuşu yolunda ilk adımları attık."
 SPA_the_plan_imperial:0 "\"İmparatorluk Planı\""
 SPA_the_plan_imperial_desc:0 "İspanyol donanmasının statüsünü dünyanın en büyüklerinden biri olarak geri döndürmek için büyük bir programa girişeceğiz."
 SPA_the_spanish_miracle:0 "İspanyol Mucizesi"
 SPA_the_spanish_miracle_desc:0 "İstikrar Planı en çılgın hayallerimizin ötesinde karşılığını verdi; yaşadığımız ekonomik patlama ancak bir mucize olarak adlandırılabilir!"
 SPA_the_stabilization_plan:0 "İstikrar Planı"
 SPA_the_stabilization_plan_desc:0 "Falanjistlerin mantıksız otarki hayalinden ve onun peşinde uygulanan savunulamaz ekonomik politikalardan uzaklaşmalıyız. Dünyanın geri kalanıyla ekonomik eşitliği sağlamak için bunun yerine ekonomik liberalleşmeye bakmalıyız, umarım bu tüm İspanyollara fayda sağlayacak bir ekonomik patlamayı tetikler."
 SPA_the_tangiers_enclave:0 "Tanca Enklavı"
 SPA_the_tangiers_enclave_desc:0 "Tanca şehri 1923'te Fransa, İspanya ve Britanya'nın ortak yönetimi altında uluslararası bir bölge haline getirildi. İki ortak yöneticimizin şu anda bir savaşa bulaşmış olduğunu görerek, devreye girip şehrin korunmasını tek başımıza üstlenmeliyiz."
 SPA_the_tangiers_enclave_tt:0 "§RBu, uluslararası bölgedeki diğer yöneticilerimizi kızdırabilir!§!\n"
 SPA_the_third_dimension_of_warfare:0 "Savaşın Üçüncü Boyutu"
 SPA_the_third_dimension_of_warfare_desc:0 "Karlistlerin yılmaz ruhu zaten karada hüküm sürüyor; şimdi gökleri de fethetmeli."
 SPA_the_war_in_the_north:0 "Kuzeydeki Savaş"
 SPA_the_war_in_the_north_desc:0 "Kuzey her zaman Karlist hareketinin kalbi olmuştur. Herhangi bir isyan, burayı operasyon üssümüz olarak güvence altına almaya odaklanmalıdır."
 SPA_the_war_of_vengeance:0 "İntikam Savaşı"
 SPA_the_war_of_vengeance_desc:0 "1898 İspanyol-Amerikan Savaşı hala canlı anılardadır ve İspanyol'un ulusal ruhu üzerindeki derin etkisi en iyi '98 Kuşağı'nın yazılarında örneklendirilmiştir. Sömürgelerimizin kaybının ulusal utancının intikamı alınmalıdır. Amerika yola getirilmeli."
 SPA_the_will_to_empire:0 "İmparatorluk İradesi"
 SPA_the_will_to_empire_desc:0 "Bir İmparatorluk kurma kararlılığına sahibiz. İspanya'nın tarihi doyumunun İmparatorlukta yattığını onaylıyoruz. İspanya için Avrupa'da seçkin bir konum talep ediyor ve İspanya'nın Hispanik dünyayı bir arada tutan manevi eksen olmaya devam edeceğini ilan ediyoruz."
 SPA_unify_the_nationalist_front:0 "Milliyetçi Cephe'yi Birleştir"
 SPA_unify_the_nationalist_front_desc:0 "İsyan ya da kendilerini adlandırmaya başladıkları isimle \"Milliyetçiler\", yalnızca Cumhuriyeti devirme arzusunda birleşen grupların gevşek bir karışımıdır. Başarıya giden yol, iç kavgalardan kaçınmak ve ortak düşmanımıza karşı mücadeleye odaklanmaktan geçiyor"
 SPA_unite_iberia:0 "İberya'yı Birleştir"
 SPA_unite_iberia_desc:0 "Portekiz ve İspanya bir zamanlar birleşmişti ve bazıları yine olması gerektiğini söylerdi. Katılıyoruz. İberya'nın birleşmesi dünyadaki konumumuzu ölçülemez derecede güçlendirecektir."
 SPA_unite_the_requetes:0 "Requetéleri Birleştir"
 SPA_unite_the_requetes_desc:0 "Çok uzun zamandır bölgesel Karlist cuntaları birbirinden bağımsız olarak faaliyet gösterebildi. Onları ve milislerini, Requetéleri, Karlist savaş çabasını daha iyi organize etmek ve iç muhalefeti ortadan kaldırmak için birleştirmeliyiz."
 SPA_utilize_the_intellectuals:0 "Aydınları Kullan"
 SPA_utilize_the_intellectuals_desc:0 "Üstün entelektüel yeteneklere sahip olanlara, ülkelerine askerlerimizin yapamayacağı şekillerde en iyi hizmeti verebilmeleri için ihtiyaç duydukları kaynaklar verilmelidir."
 SPR_a_frontline_suited_for_intellectuals:0 "Aydınlara Uygun Bir Cephe"
 SPR_a_frontline_suited_for_intellectuals_desc:0 "En parlak beyinlerimizin cephede faşistle savaşması bir israftır - onlardan hatların çok gerisinde çok daha iyi yararlanılabilir; mücadelemize birkaç ek askerin muhtemelen yapabileceğinden çok daha fazla fayda sağlayacak yeni savaş araçları yaratarak."
 SPR_a_new_military_academy:0 "Yeni Bir Askeri Akademi"
 SPR_a_new_military_academy_desc:0 "Gerçekten profesyonel bir ulusal askeri hedefimize ulaşmak için yeni bir akademi kurmalıyız, subaylarımızın olabileceklerinin en iyisi olmasını sağlamalıyız."
 SPR_a_new_way_of_warfare:0 "Yeni Bir Savaş Yöntemi"
 SPR_a_new_way_of_warfare_desc:0 "Piyademizin cesareti şüphesizdir, ancak savaşın gerçekleri piyadenin aşabileceğinin çok ötesine geçti. Komünlerimizi savunmak için hem karada hem de göklerde yeni savaş makineleri geliştirmeye başlamalıyız."
 SPR_a_red_fleet:0 "Kızıl Bir Filo"
 SPR_a_red_fleet_desc:0 "Sosyalizmi dünyaya yaymada üzerimize düşeni yapmak için güçlü bir donanma gereklidir. Kızıl Filomuzun inşası bugün başlıyor."
 SPR_a_red_iberia:0 "Kızıl Bir İberya"
 SPR_a_red_iberia_desc:0 "İberya yarımadasının tamamını sosyalizmin sancağı altında birleştirme zamanı geldi."
 SPR_against_fascism:0 "Faşizme Karşı"
 SPR_against_fascism_desc:0 "Faşist düşman İberya yarımadasında yenilmiş olabilir, ancak hala sınırlarımızın ötesinde var. Bu mücadeleyi sonuna kadar götürmek bizim görevimizdir."
 SPR_against_trotskyism_and_stalinism:0 "Troçkizm ve Stalinizme Karşı"
 SPR_against_trotskyism_and_stalinism_desc:0 "Çok uzun zamandır Troçki ve Stalin ile destekçileri arasındaki çekişme, sosyalist davanın birliğini ve bütünlüğünü baltaladı. Eğer farklılıklarını bir kenara bırakamazlarsa, o zaman davamızı onların nüfuzundan kurtarmaktan başka çaremiz yok."
 SPR_against_trotskyism_and_stalinism_tt:0 "§YStalinist§! veya §YTroçkist Sovyetler Birliği§! veya §YMeksika§!'ya karşı §Y$puppet_wargoal_focus$§! savaş hedefi kazandırır."
 SPR_agrarian_collectivization:0 "Tarımsal Kolektivizasyon"
 SPR_agrarian_collectivization_desc:0 "Tarımımızın kolektif organizasyonu, hasatları en çok kar getiren yerde satmak yerine, komünlerde yaşayan herkesin ihtiyaç duyduğu gıdaya sahip olmasını sağlayacaktır."
 SPR_all_must_bear_the_torch:0 "Herkes Meşaleyi Taşımalı"
 SPR_all_must_bear_the_torch_desc:0 "Her insan kendi içinde bir devrimdir; eğer bireyin cesareti ve vahşiliği olmasaydı, kolektif düşmanlarının karşısında düşerdi. Bu mesaj tüm destekçilerimizle eve götürülmelidir; her birimiz anarşizmin meşalesini yüksek tutmaya yardım etmeliyiz."
 SPR_all_must_do_their_part:0 "Herkes Üzerine Düşeni Yapmalı"
 SPR_all_must_do_their_part_desc:0 "Sosyalist davanın başarılı olması için her kişi davaya katkıda bulunmalıdır. Çeşitli komünlerimiz arasındaki iç bölünmelere yerimiz yok."
 SPR_an_army_of_all_classes:0 "Tüm Sınıfların Ordusu"
 SPR_an_army_of_all_classes_desc:0 "Faşist tehdit karşısında sınıf önemsizdir. Herkesin hizmet vermekten memnuniyet duyacağı bir ordu kuracağız ve aynı zamanda onları yurttaşlarının değer verdiği sağlıklı sosyalist değerlere maruz bırakacağız."
 SPR_anarchism_knows_no_borders:0 "Anarşizm Sınır Tanımaz"
 SPR_anarchism_knows_no_borders_desc:0 "Eğer dünya ulusları bizi aralarında hoş görmek istemiyorsa, o zaman barış içinde kolektifleşebileceğimiz bir gelecek için tek çaremiz, tüm ulus-devletlerin kendisinin ortadan kaldırılmasıdır."
 SPR_anarchist_uprising_flag:0 "Anarşistler ayaklandı."
 SPR_anti_fascist_unity:0 "Anti-Faşist Birlik"
 SPR_anti_fascist_unity_desc:0 "Anarşist ve anti-Stalinist müttefiklerimizle aramızdaki anlaşmazlıklar giderek kötüleşiyor. Bunun kontrolden çıkmasına izin veremeyiz. Dikkatimizi gerçek düşmana yeniden odaklamalıyız, iç barışın bedeli yoldan çıkmış müttefiklerimize hükûmet düzeyinde tavizler vermek olsa bile."
 SPR_anti_fascist_unity_tt:0 "Tavizler karşılığında Anarşist ayaklanmasını geciktirmeyi mümkün kılan §YAnti-Faşist Birlik§! kararlarının kilidini açar.\n"
 SPR_appeal_for_increased_autonomy:0 "Artan Özerklik İçin Başvuru"
 SPR_appeal_for_increased_autonomy_desc:0 "Zaferimizi mümkün kılan [SOV.GetAdjective] yardımının bedeli boyun eğmek oldu. Sosyalizmin sadık ve yetenekli savunucuları olduğumuzu gösterdik ve bu kesinlikle Moskova'da tanınıyor. Belki de dizginleri gevşetmeleri için onları ikna edebiliriz."
 SPR_appropriate_church_riches:0 "Kilise Zenginliklerine El Koy"
 SPR_appropriate_church_riches_desc:0 "Katolik Kilisesi tarafından biriktirilen servet, davamızı finanse etmek için çok daha iyi harcanabilir. Onu mevcut fabrikaları iyileştirmek ve yenilerini kurmak için kullanacağız, bunların hepsi nihai hedefimize ulaşmada üzerlerine düşeni yapacaktır."
 SPR_appropriate_the_means_of_production:0 "Üretim Araçlarına El Koy"
 SPR_appropriate_the_means_of_production_desc:0 "Zenginler için çalıştığımız günler geride kaldı. Emeğimizin karşılıksız kaldığı günler geride kaldı. Fabrikaları ve atölyeleri, çiftlikleri ve dükkanları ele geçirecek, sınıfı ortadan kaldıracak ve işçiyi kendi kaderinin efendisi yapacağız."
 SPR_arm_the_people:0 "Halkı Silahlandır"
 SPR_arm_the_people_desc:0 "Ulusal bir ordu, hükûmetin halkı üzerinde kontrolü sürdürmesinin bir yolu olarak kolayca kullanılabilir ve bu nedenle toplumsal savunma için bir çare değildir. Topluluklarını savunmak için silah verilmesi gereken halkın kendisidir."
 SPR_arm_the_tide:0 "Dalgayı Silahlandır"
 SPR_arm_the_tide_desc:0 "Yeterli teçhizat olmadan sosyalist işçinin bireysel gayreti savaşta başarılı olamaz. Onlara ihtiyaç duydukları savaş araçlarını vereceğiz."
 SPR_arm_the_workers_militias:0 "İşçi Milislerini Silahlandır"
 SPR_arm_the_workers_militias_desc:0 "İşgücünden milisler organize ettik ve şimdi faşist düşmana ve sadakatsiz orduya karşı öncü oluşturabilmeleri için yeterli donanıma sahip olmalarını sağlamalıyız."
 SPR_autogestion:0 "Autogestión"
 SPR_autogestion_desc:0 "İşçilerin otogestión (özyönetim) ilkelerine göre işyeri kendi kendini yönetmelerine izin vererek çıktıyı en üst düzeye çıkaracağız. Bu, işçi özerkliği, moral ve sonuç olarak genel verimlilik açısından birçok fayda sağlayacaktır."
 SPR_avenge_foreign_interference:0 "Yabancı Müdahalenin İntikamını Al"
 SPR_avenge_foreign_interference_desc:0 "Yabancı güçler iç savaşta bize karşı müdahale ederek faşist düşmanlarımızı desteklediler. Bunu unutmadık ve cevabımız nihayet hazır."
 SPR_avenge_foreign_interference_tt:0 "İç savaş sırasında Milliyetçilere gönüllü gönderen tüm ülkelere savaş hedefleri verir.\n"
 SPR_beacon_of_socialism:0 "Sosyalizmin Feneri"
 SPR_beacon_of_socialism_desc:0 "Ulusumuz, işçinin davasına hizmet etme arzusuyla benzer düşünen bilim adamlarını kesinlikle çekecek parlayan bir sosyalizm feneridir."
 SPR_carlist_uprising_flag:0 "Karlistler ayaklandı."
 SPR_class_war:0 "Sınıf Savaşı"
 SPR_class_war_desc:0 "Halk Cephesi kavramı kusurludur; işçi, burjuvaziyle birlikte çalışmaya zorlandığı sürece asla gerçekten özgür olamaz. Sadece tavizsiz bir sınıf savaşı bize arzuladığımız özgürlüğü getirebilir, bu aynı anda kapitalistlerle ve faşistlerle savaşmak anlamına gelse bile."
 SPR_collective_recovery_efforts:0 "Kolektif Toparlanma Çabaları"
 SPR_collective_recovery_efforts_desc:0 "Bir bütün olarak İspanyol toplumu, şiddetli iç savaşımızdan kaynaklanan hasarı onarmak için tek bir büyük hamlede toplanmalıdır. Halkın işe geri dönebilmesi için fabrikalarımız yeniden inşa edilmeli ve yerel topluluklar arasındaki etkileşimi kolaylaştırmak için yeni altyapı inşa edilmelidir."
 SPR_collectivization_and_workers_control:0 "Kolektivizasyon ve İşçi Kontrolü"
 SPR_collectivization_and_workers_control_desc:0 "Yerel yönetimin gerekli yönleri için işçi konseylerine yöneleceğiz, her işçiye söz hakkı verirken aynı zamanda daha büyük ölçekli iş birliğine olanak tanıyacağız."
 SPR_collectivize_industry:0 "Sanayiyi Kolektifleştir"
 SPR_collectivize_industry_desc:0 "Sanayinin kolektifleştirilmesi, verimliliği ve işçi moralini daha da artırmaya hizmet edecektir."
 SPR_communal_autarky:0 "Komünal Otarki"
 SPR_communal_autarky_desc:0 "Dünya bizi dışladı ve bu yüzden kendi topraklarımızda bulduğumuz doğal kaynaklarla idare etmek zorundayız. Bu, ustalaşmayı öğreneceğimiz bir optimizasyon egzersizidir."
 SPR_communal_military_strategies:0 "Komünal Askeri Stratejiler"
 SPR_communal_military_strategies_desc:0 "Anarşizmin ilkelerine sadık kalarak büyük ölçekli savaşı organize etmek büyük bir meydan okumadır. Bu aynı zamanda karşılamamız gereken bir meydan okumadır, çünkü onsuz savaştığımız her şey kaybolur."
 SPR_communists_in_the_government:0 "Hükûmetteki Komünistler"
 SPR_communists_in_the_government_desc:0 "Hükûmetteki komünist nüfuz o kadar arttı ki, şimdi Cumhuriyetin yeni gerçeklerini yansıtmak için liderlikte tam bir değişiklik talep ediyorlar."
 SPR_communists_in_the_government_tt:0 "Stalinist bakanlar §Gmevcut§! olur, ancak Demokratik bakanlar §Rkaldırılır§!.\n"
 SPR_connect_the_country:0 "Ülkeyi Birbirine Bağla"
 SPR_connect_the_country_desc:0 "Ülkeyi kapsayan büyük bir altyapı projeleri, yarımadanın en ücra bölgeleri arasında malların hızlı hareketini sağlayacaktır. Bu, uzun vadede sadece bize fayda sağlayacaktır."
 SPR_crush_the_revolution:0 "Devrimi Ez"
 SPR_crush_the_revolution_desc:0 "Anarşist komünlerin kendilerini yönetmedeki bağımsız tavrı başımıza bela oldu ve açıkçası, zayıf savunmaları cephe hatlarımızda kritik bir zayıflık oluşturuyor. Onlarsız daha iyiyiz ve bu yüzden bu devrimin tamamen ve kesin olarak ezilme zamanı geldi."
 SPR_crush_the_revolution_tt:0 "§RTarafsız destekçiler bir iç savaş başlatacak!§!\n"
 SPR_deal_with_the_devil:0 "Şeytanla Anlaşma"
 SPR_deal_with_the_devil_desc:0 "Almanların Sovyetlerle savaşma konusunda bol deneyimi var ve resmi bir ittifaka asla razı olamasak da, belki de askeri bilgilerinin değiş tokuşu bize ortak düşmanımıza karşı kendi savaş çabalarımızda açık bir avantaj sağlayabilir."
 SPR_deal_with_the_devil_tt:0 "§RBonusların etkili olması için [GER.GetNameDefCap]'in anlaşmayı onaylaması gerekir.§!\n"
 SPR_demand_ministerial_positions:0 "Bakanlık Pozisyonları Talep Et"
 SPR_demand_ministerial_positions_desc:0 "Eğer Cumhuriyet devam eden desteğimizi istiyorsa, politikacılarımıza hükûmette pozisyonlar vermelidir. Ancak o zaman bizi ortak mücadelemizde değerli müttefikler olarak gördüklerini açıkça belli ederler."
 SPR_disband_the_army:0 "Orduyu Terhis Et"
 SPR_disband_the_army_desc:0 "Ordudaki sadakatsizlik işaretlerini daha fazla görmezden gelemeyiz. Komplocuları harekete geçirebilecek olsa bile, orduyu derhal terhis etmeye çalışmaktan ve inisiyatifi ele geçirmekten başka seçeneğimiz yok."
 SPR_disband_the_army_tt:0 "§Gİç savaşın başlangıcında Milliyetçi ittifaka katılacak ordunun oranını §Y%50§!'den §Y%20§!'ye düşürür ve Afrika Ordusu tümenlerinin sayısını §Y5§!'ten §Y3§!'e indirir.§!\nSadık §Y%80§!'lik kısım §Rterhis edilir§!, ancak teçhizatı depoya iade edilir.\n\nEğer bu odak alınmazsa, hükûmet iç savaşın başlangıcında orduyu tepkisel olarak terhis edecek ve ek bir fayda sağlamayacaktır.\n\n§RSadakatsiz ordu kalıntıları iç savaşın derhal başlamasını kışkırtacaktır!§!\n"
 SPR_distribute_arms_to_the_people:0 "Halka Silah Dağıt"
 SPR_distribute_arms_to_the_people_desc:0 "Ordudaki sadakatsizlik artık neredeyse kesin ve Cumhuriyetin değerlerini savunmak için onlara güvenemeyeceğimiz açık. Cumhuriyetin en iyi çıkarlarını kalbinde taşıyanlara silah dağıtmaya başlamalıyız, böylece olası bir isyana karşı ilk savunmayı oluşturabilirler."
 SPR_distribute_arms_to_the_people_tt:0 "İç savaşın başlamasıyla, §Y3 piyade§! taburlu 10 eğitimsiz birlik kazanılır.\n"
 SPR_doctrinal_advancements:0 "Doktrinsel Gelişmeler"
 SPR_doctrinal_advancements_desc:0 "İç savaştan öğrendiğimiz dersler, savaşın mevcut gerçeklerine daha uygun yeni askeri doktrinlere daha da geliştirilebilir."
 SPR_end_fascism_at_all_costs:0 "Her Ne Pahasına Olursa Olsun Faşizmi Bitir"
 SPR_end_fascism_at_all_costs_desc:0 "Faşistlerin tamamen yok edilmesinin ötesinde hiçbir şeyin önemi yoktur - eğer bunu başarmak için ruhumuzu komünizme satmamız gerekiyorsa, öyle olsun."
 SPR_enemies_of_our_enemy:0 "Düşmanımızın Düşmanları"
 SPR_enemies_of_our_enemy_desc:0 "İç savaş sırasında düşmanlarımıza yardım etmiş olsalar da, şimdi ortak bir düşmanımız var. Belki de daha büyük mücadele kazanılana kadar farklılıklarımızı bir kenara bırakma zamanı gelmiştir."
 SPR_engineering_advances:0 "Mühendislik Gelişmeleri"
 SPR_engineering_advances_desc:0 "Mühendislikteki yeni gelişmeler, geliştirilmiş sanayinin yanı sıra yeni tip uçak ve zırhların inşasına olanak tanır."
 SPR_enlarge_the_weapon_caches:0 "Silah Depolarını Büyüt"
 SPR_enlarge_the_weapon_caches_desc:0 "1934 Asturias Madenciler Grevi'nden bile önce, özgürlüklerimizi askeri silahlarla savunmanın kaçınılmaz ihtiyacına hazırlık olarak ülke genelinde gizlice silah depoları kuruldu. Bu kriz zamanlarında, onları daha da büyütmemiz iyi olacaktır."
 SPR_enlarge_the_weapon_caches_tt:0 "İç savaşın başlamasıyla, teçhizatın §Y%50§!'si yerine §Y%80§!'ini elinde tutar.\n"
 SPR_enlist_the_carabineros:0 "Karabineroları Askere Al"
 SPR_enlist_the_carabineros_desc:0 "Cepheleri doldurmak için bir ara çözüm olarak alışılmadık çözümlere yönelmeliyiz. Ordu olmadan, paramiliter bir sınır muhafızı ve gümrük gücü olan Karabinerolar, siperleri doldurmak için herhangi bir kuvvet kadar iyi hizmet edecektir."
 SPR_enlist_the_carabineros_tt:0 "5 rastgele eyalette §Y3 Piyade§! taburlu 1 birlik kazanılır.\n"
 SPR_ensure_loyalty:0 "Sadakati Sağla"
 SPR_ensure_loyalty_desc:0 "Hükûmet, ordusu tarafından en acımasız şekilde ihanete uğradı. Bu yarayı onarmanın ilk adımı, bundan sonra atayacağımız tüm subayların sadakatini sağlamaktır."
 SPR_expand_soviet_aid:0 "Sovyet Yardımını Genişlet"
 SPR_expand_soviet_aid_desc:0 "Bu savaşı tek başımıza yönetemeyiz; uluslararası yardım almalıyız. [SOV.GetNameDefCap]'e, faşizme karşı kritik mücadelenin burada, İberya'da olduğu ve ilerlemelerinin burada durdurulması gerektiği anlatılmalıdır."
 SPR_expand_soviet_aid_tt:0 "\n§RSovyet yardımı, iç savaş bittikten sonra ödenecek önemli bir bedelle gelecektir!§!\n"
 SPR_expand_the_means_of_production:0 "Üretim Araçlarını Genişlet"
 SPR_expand_the_means_of_production_desc:0 "Kolektifin sağlığı, sanayisinin gücüne bağlıdır. Bizimkini genişleterek içeride istikrarı sağlayabilir ve dışarıdaki düşmanlara karşı savunmamızı güçlendirebiliriz."
 SPR_expand_the_naval_academy:0 "Deniz Harp Okulunu Genişlet"
 SPR_expand_the_naval_academy_desc:0 "İç savaş, donanmamızın liderliğindeki eksiklikleri gösterdi. Deniz harp okulumuzun kalitesindeki iyileştirmeler ve boyutunu artırmak, bu maliyetli taktiksel ve stratejik hataların gelecekte çok daha az olası olmasını sağlamalıdır."
 SPR_experiences_from_the_civil_war:0 "İç Savaştan Deneyimler"
 SPR_experiences_from_the_civil_war_desc:0 "Ordumuzun iç savaş sırasındaki deneyimleri, askeri düşünce ve teçhizat geliştirmede dramatik yeni ilerlemelerle sonuçlandı."
 SPR_exploit_spains_riches:0 "İspanya'nın Zenginliklerini Sömür"
 SPR_exploit_spains_riches_desc:0 "İberya yarımadası doğal kaynaklar açısından zengindir. Bunların sömürülmesi savaş sanayimizi büyük ölçüde güçlendirecek, aynı zamanda ulusumuzun yeniden inşası için kullanılabilecek zenginlik yaratacaktır."
 SPR_factory_and_plant_committees:0 "Fabrika ve İşyeri Komiteleri Kur"
 SPR_factory_and_plant_committees_desc:0 "Yeni İberya devletimizde kolektifleştirilen sanayinin daha verimli çalışması için işletmeleri yönetmeyi bilen kişilerden fabrika ve işyeri komiteleri oluşturmalı, birbirleriyle kolayca eş güdüm sağlamalarına olanak tanımalıyız."
 SPR_faith_in_the_cause:0 "Davaya İnanç"
 SPR_faith_in_the_cause_desc:0 "Tüm dünya size karşıyken yenilgici düşünceye yer yoktur. Ya barışçıl bir geleceğe ulaşma konusundaki sarsılmaz inancımızı koruruz ya da düşeriz."
 SPR_foreign_arms_purchases:0 "Yabancı Silah Alımları"
 SPR_foreign_arms_purchases_desc:0 "'Kurtardığımız' altın rezervleri, şiddetle ihtiyaç duyduğumuz yabancı silahları elde etmek için kullanılabilir. Uluslararası kamuoyu bizi ille de desteklemiyor, bu yüzden bunları almak için muhtemelen alışılmadık kanallardan geçmek zorunda kalacağız, ancak..."
 SPR_foreign_arms_purchases_tt:0 "Çeşitli tipte teçhizat satın alımına olanak tanıyan §YYabancı Silah Alımları§! kararlarının kilidini açar.\n"
 SPR_foreign_industrial_aid:0 "Yabancı Sanayi Yardımı"
 SPR_foreign_industrial_aid_desc:0 "Yeni paktlarımızla, yabancı işletmeleri ulusumuza yatırım yapmaya ve yeniden yapılanmamıza yardımcı olmaya teşvik edeceğiz."
 SPR_fortify_la_linea_de_la_concepcion:0 "La Línea de la Concepción'u Tahkim Et"
 SPR_fortify_la_linea_de_la_concepcion_desc:0 "La Línea de la Concepción, ötesinde yatan düşmana karşı ilk kaledir. Yeterli savunmalarla, Cebelitarık'tan gelen herhangi bir saldırıyı doğrudan karşılayabilmeliyiz."
 SPR_fortify_la_linea_de_la_concepcion_tt:0 "§YSevilla§! ve §YGranada§!'daki Cebelitarık sınırındaki illere 3. seviye §YKale§! yerleştirir.\n"
 SPR_fortify_the_central_government:0 "Merkezi Hükûmeti Güçlendir"
 SPR_fortify_the_central_government_desc:0 "Hükûmeti komünist nüfuza karşı güçlendirmeliyiz, yoksa gizlice Cumhuriyetin kontrolünü içeriden ele geçirmeyi başarabilirler."
 SPR_fortify_the_coastlines:0 "Kıyı Şeritlerini Tahkim Et"
 SPR_fortify_the_coastlines_desc:0 "Denizden işgal olasılığını göz ardı edemeyiz. Genişletilmiş savunmalar, bu cephede savunmasız kalırsak düşman için bu olasılığı çok daha tatsız bir hale getirmelidir."
 SPR_fortify_the_coastlines_tt_1:0 "§YGalicia§!, §YAsturias§! ve §YPaís Vasco§!'daki kıyı illerine §Y1 Kıyı Kalesi§! yerleştirir.\n"
 SPR_fortify_the_coastlines_tt_2:0 "Bir §YDonanma Üssü§! olan kıtasal çekirdek illere §Y1 Kale§! ve §Y2 Kıyı Kalesi§! yerleştirir.\n"
 SPR_fortify_the_iron_ring:0 "Demir Halkayı Tahkim Et"
 SPR_fortify_the_iron_ring_desc:0 "Bask Ülkesi'nin en büyük şehri olan Bilbao, kendi 'Demir Halkası' tahkimatlarına sahip olacak ve Basklara onu faşist düşmana karşı savunmak için zorlu bir engel sağlayacaktır."
 SPR_fortify_the_pyrenees:0 "Pireneleri Tahkim Et"
 SPR_fortify_the_pyrenees_desc:0 "En bariz saldırı yolu kuzeyden olacaktır. Pirenelerin, içinden veya kıyı şeritleri boyunca düşecek herhangi bir darbeye karşı tahkim edilmesi zorunludur."
 SPR_fortify_the_pyrenees_tt:0 "§YPaís Vasco§!, §YNavarre§!, §YBatı Aragón§!, §YDoğu Aragón§! ve §YCataluña§!'daki Fransız sınırındaki illere 3. seviye §YKale§! yerleştirir.\n"
 SPR_freedom_of_thought:0 "Düşünce Özgürlüğü"
 SPR_freedom_of_thought_desc:0 "Dar görüşlülüğün topluluklarımızda yeri yoktur. Toplumumuzun temel dayanaklarını kabul ettikleri sürece, fikirleri ne olursa olsun herkes hoş karşılanır."
 SPR_fuel_for_the_war_machine:0 "Savaş Makinesi için Yakıt"
 SPR_fuel_for_the_war_machine_desc:0 "Kaynaklar savaş sanayimiz için çok önemlidir ve bu ihtiyaçlarda ne kadar kendi kendimize yeterli olursak o kadar iyi. Ülkemiz genelinde yeni madenler, çelik fabrikaları ve alüminyum izabe tesisleri inşa ederek böyle bir kendi kendine yeterliliğe ulaşma yolunda büyük bir yol kat edebiliriz."
 SPR_global_defense_council:0 "Küresel Savunma Konseyi"
 SPR_global_defense_council_desc:0 "Sınırlarımız İberya yarımadasının coğrafyasının ötesine genişledi ve geçici savunma konseyimize verdiğimiz unvan artık onun bir parçası olan herkesi temsil etmiyor. Örgütümüzü bu gezegendeki tüm halkları uygun şekilde kapsayan bir şeyle yeniden adlandıracağız."
 SPR_global_defense_council_tt:0 "§Y[ROOT.GetName]§!, §YKüresel Savunma Konseyi§! olarak bilinecektir.\n"
 SPR_global_defense_council_tt_2:0 "Yeterince yüksek §YUyum§! olan herhangi bir yabancı kontrolündeki eyaletin devredilmesine ve hak iddia edilmesine olanak tanıyan §YDevrimin Tohumları§! kararlarının kilidini açar.\n"
 SPR_gold_reserves_flag:0 "Altın Rezervleri zaten ele geçirildi veya yer değiştirildi"
 SPR_hinder_nkvd_interference:0 "NKVD Müdahalesini Engelle"
 SPR_hinder_nkvd_interference_desc:0 "Sovyet NKVD'si çok uzun zamandır İspanya'nın iç işlerine müdahale ediyor. Stalin'in sesli eleştirmenleri ortadan kayboldu, politikacılarımız izole edildi ve faşistlerle mücadele çabalarımıza bazen düşmanlarımızdan çok sözde müttefiklerimiz karşı çıkıyor. Artık yeter. Stalinistlere karşı savaşacağız."
 SPR_hinder_nkvd_interference_tt:0 "§YYaklaşan Anarşist Ayaklanması§! görevini §YYaklaşan Hükûmet Baskını§! göreviyle değiştirir.\n"
 SPR_ideological_allies:0 "İdeolojik Müttefikler"
 SPR_ideological_allies_desc:0 "İspanya iç savaşın potasında yeniden dövüldü - hem Sağın hem de Solun aşırılığına karşı ideolojik müttefiklerimizle birlikte duracağız."
 SPR_improve_military_infrastructure:0 "Askeri Altyapıyı İyileştir"
 SPR_improve_military_infrastructure_desc:0 "Kuşatılmış komünlere zamanında ulaşmak için komünler arası altyapımızı büyük ölçüde iyileştirmeliyiz. Bu, bir bütün olarak Savunma Konseyi'nin herhangi bir bireysel komünün başa çıkamayabileceği herhangi bir dış tehdide hızla yanıt vermesini sağlamalıdır."
 SPR_increase_arms_production:0 "Silah Üretimini Artır"
 SPR_increase_arms_production_desc:0 "Komünizmin ideallerini savunmak için ordumuz silahlara ihtiyaç duyar. Bu silahları sağlayabilmemiz için büyük ulusumuzun endüstriyel kapasitesi iyileştirilmelidir."
 SPR_international_brigades:0 "Uluslararası Tugaylar"
 SPR_international_brigades_desc:0 "Davamız çok uluslararası ilgi çekti ve dünyanın dört bir yanından insanlar bizimle faşist tehdide karşı savaşmak için geldi. Topluluğun sağlığı için üzerlerine düşeni yaptıkları sürece kimse geri çevrilmeyecek. Onları uluslararası tugaylarda organize edeceğiz."
 SPR_international_brigades_tt:0 "§YMáté Zalka§!, 2. seviye bir §YMareşal§! olarak mevcut!"
 SPR_invite_socialist_intellectuals:0 "Sosyalist Aydınları Davet Et"
 SPR_invite_socialist_intellectuals_desc:0 "Toplumumuz, sosyalist davaya olan bağlılığımızı paylaşan tüm aydınlar için bir sığınak olacaktır. Bu bireyler, dehalarının geri kalanımızın yararlanacağı ilerlemeler sağlaması için uzaklardan ve yakınlardan davet edilmelidir."
 SPR_join_the_global_fight_against_fascism:0 "Faşizme Karşı Küresel Mücadeleye Katıl"
 SPR_join_the_global_fight_against_fascism_desc:0 "İspanya'da faşizmi yendik, ancak hala dünyanın diğer uluslarında var. Bu mücadeleyi sonuna kadar götürmek bizim görevimizdir."
 SPR_land_redistribution:0 "Toprak Yeniden Dağıtımı"
 SPR_land_redistribution_desc:0 "Toprak işlemek isteyen herkese bunu yapma izni verilmelidir. Savaştan önce onu düzgün bir şekilde kullanamayanların elindeki topraklar, şimdi onu kullanabilenlere tahsis edilecektir."
 SPR_lessons_from_the_civil_war:0 "İç Savaştan Dersler"
 SPR_lessons_from_the_civil_war_desc:0 "İç savaşın mücadeleleri bize savaş sanatı hakkında birçok ders öğretti. Bunları yeni model ordumuza uygulamamak aptallık olur."
 SPR_literacy_programs:0 "Okuryazarlık Programları"
 SPR_literacy_programs_desc:0 "Okuma yazma bilmemek işçi nüfusu arasında yaygındır, ancak uygun programlarla bu hızla iyileştirilebilir, şüphesiz gizli yeteneklerin ortaya çıkmasına olanak tanır."
 SPR_maintain_the_second_republic:0 "İkinci Cumhuriyeti Koru"
 SPR_maintain_the_second_republic_desc:0 "İsyancı ordu darbe girişiminde başarılı olamadı ve hükûmetimiz özgürce yönetme yeteneğini koruyor. İkinci Cumhuriyet, 1934'teki madenciler grevinde galip geldiği gibi, Sağ tehdidine karşı da galip gelecektir."
 SPR_maintaining_the_fire:0 "Ateşi Sürdürmek"
 SPR_maintaining_the_fire_desc:0 "Savaş yorgunluğu çöküşün habercisidir. Güçlü kalmalı ve insanlarda onları en fazlasını yapmaya iten ateşi yeniden canlandırmalıyız."
 SPR_masters_of_our_own_fate:0 "Kendi Kaderimizin Efendileri"
 SPR_masters_of_our_own_fate_desc:0 "Stalinistler ve onların Cumhuriyetçi kuklaları özgürlüklerimizi giderek daha fazla ihlal ediyor, çabalarımızı sistematik olarak baltalıyor ve davamızın önde gelen destekçilerini ortadan kaldırıyor. Artık yeter. Onlarla da savaşmak anlamına gelse bile, kendi kaderimizin efendisiyiz."
 SPR_masters_of_our_own_fate_tt:0 "§RKomünist ve Demokratik destekçiler bir iç savaş başlatacak!§!\n"
 SPR_masters_of_our_own_fate_tt_2:0 "§Y[ROOT.GetName]§!, §YAragon Bölgesel Savunma Konseyi§! olarak bilinecektir.\n"
 SPR_masters_of_our_own_fate_tt_3:0 "§Y[ROOT.GetName]§!, §Yİspanyol Komünü§! olarak bilinecektir.\n"
 SPR_masters_of_our_own_fate_tt_4:0 "POUM bakanları §Gmevcut§! olur, ancak Demokratik ve Stalinist bakanlar §Rkaldırılır§!.\n"
 SPR_militarize_the_industry:0 "Sanayiyi Militarize Et"
 SPR_militarize_the_industry_desc:0 "Komünler, askeri malzeme üretimlerini artırmaya teşvik edilmelidir, yoksa cesur askerlerimizi evlerimizi savunmak için ihtiyaç duydukları araçlardan mahrum bırakma riskine gireriz."
 SPR_militarize_the_people:0 "Halkı Militarize Et"
 SPR_militarize_the_people_desc:0 "Ellerimizi kandan temiz tutma lüksümüz yok. Herkese kendini savunmak için silah kullanması öğretilmeli, böylece zamanı geldiğinde gelecekleri için savaşabilirler."
 SPR_modernize_the_armed_forces:0 "Silahlı Kuvvetleri Modernize Et"
 SPR_modernize_the_armed_forces_desc:0 "Avrupa'nın batısındaki zayıf konumumuz, silahlı kuvvetlerimiz için yeni silahlar ve teçhizat geliştirilmesiyle büyük ölçüde güçlendirilecektir."
 SPR_mujeres_libres:0 "Mujeres Libres"
 SPR_mujeres_libres_desc:0 "Sosyal devrim sadece kısmen başarılı oldu. Bir sonraki adım, işçi sınıfı kadınının kurtuluşu, güçlendirilmesi ve eğitimidir. Eşitlik bir bütün olarak topluma fayda sağlayacaktır."
 SPR_nationalize_the_industry:0 "Sanayiyi Millileştir"
 SPR_nationalize_the_industry_desc:0 "Sanayimizin yatırımcıların ve şirketlerin elinde çürümesine izin vermek yerine, üretimlerini daha iyi yönlendirmek ve organize etmek için onu devletin kendi kontrolü altına alacağız."
 SPR_navy_modernization:0 "Donanma Modernizasyonu"
 SPR_navy_modernization_desc:0 "Uğradığımız kayıpların bir faydası, yeni ve modern gemi modelleri inşa etmekten kaçınmak için hiçbir nedenimiz olmamasıdır. Uygun tasarımları araştırmalı ve derhal inşaatlarını görmeliyiz."
 SPR_new_leadership:0 "Yeni Liderlik"
 SPR_new_leadership_desc:0 "Cumhuriyetin bu zorlu zamanlarda hayatta kalması için yeni bir liderliğe ihtiyaç var. Faşist tehditle en iyi nasıl mücadele edileceğine dair yeni bakış açılarına sahip danışmanlar ve bakanlar getireceğiz, bu da ilkelerimizi ve inançlarımızı daha iyi korumamızı sağlayacaktır."
 SPR_no_pasaran:0 "¡No Pasarán!"
 SPR_no_pasaran_desc:0 "Anti-faşist inancı her şehirde, her evde yankılansın; her çatıdan her sokağa; her barikattan her hendeğe: \"¡Pasarán'a hayır!\" - Geçemeyecekler!"
 SPR_no_pasaran_tt:0 "Kontrol edilen eyaletlerde §Y1 Zafer Puanı§! olan tüm illere §Y1 Kale§! yerleştirir.\nKontrol edilen eyaletlerde §Y3 Zafer Puanı§! olan tüm illere §Y2 Kale§! yerleştirir.\nKontrol edilen eyaletlerde §Y10 Zafer Puanı§! olan tüm illere §Y3 Kale§! yerleştirir.\nKontrol edilen eyaletlerde §Y30 Zafer Puanı§! veya daha fazla olan tüm illere §Y4 Kale§! yerleştirir.\n"
 SPR_oppose_the_communists:0 "Komünistlere Karşı Çık"
 SPR_oppose_the_communists_desc:0 "Komünistler, faşizme karşı mücadelede gerekli bir müttefikten başka bir şey değildir. Bu bittiğinde, onlarla kendi yöntemimizle başa çıkmalıyız."
 SPR_petition_for_french_aid:0 "Fransız Yardımı İçin Dilekçe Ver"
 SPR_petition_for_french_aid_desc:0 "Kuzeydeki komşularımız bize yardım etme arzularında tereddüt ediyorlar, herhangi bir eylemde bulunmaları durumunda iç huzursuzluk olasılığından korkuyorlar. Bu kadar kararsız kalmalarına izin veremeyiz; hayatta kalmamız onların harekete geçme istekliliğine bağlıdır."
 SPR_petition_for_french_aid_tt:0 "§RBonusların etkili olması için [FRA.GetNameDefCap]'in anlaşmayı onaylaması gerekir.§!\n"
 SPR_plant_the_seeds_of_revolution:0 "Devrimin Tohumlarını Ek"
 SPR_plant_the_seeds_of_revolution_desc:0 "Bizimkilere benzer duygulara sahip olanlar, baskıcı hükümetleri tarafından uzun süredir susturuldu. Bu gruplara ihtiyaç duydukları silahları vereceğiz, böylece uluslarını içeriden devirebilirler ve düşmanlarımızı bozguna uğratıp onlarla birleştiğimizde davamıza katılabilirler."
 SPR_plant_the_seeds_of_revolution_tt:0 "Komşu düşman ülkelerde Anarşist ayaklanmalar yaratmaya olanak tanıyan §YDevrimin Tohumları§! kararlarının kilidini açar.\n"
 SPR_portuguese_anarchism:0 "Portekiz Anarşizmi"
 SPR_portuguese_anarchism_desc:0 "Özgürlük savaşımız Portekiz sınırını aştı ve hükûmet istikrarsızlaşıyor. Uygun destekle, sınırları içinde tam ölçekli bir anarşist ayaklanmanın meydana gelmesi düşünülemez değil. Bu ateşi yakmalıyız!"
 SPR_prepare_for_the_next_war:0 "Bir Sonraki Savaşa Hazırlan"
 SPR_prepare_for_the_next_war_desc:0 "Eğer savaşla parçalanmış ulusumuza yönelik çeşitli dış tehditlere karşı güçlü duracaksak askeri sanayimiz genişletilmelidir. Gelebilecek her şeye hazırlıklı olmalıyız."
 SPR_provide_for_the_people:0 "Halkın İhtiyaçlarını Karşıla"
 SPR_provide_for_the_people_desc:0 "İlk işimiz halkımıza gıda tedarikini sağlamaktır. Zaferimiz kıtlık felaketiyle gölgelenmemelidir."
 SPR_reaffirm_the_popular_front_strategy:0 "Halk Cephesi Stratejisini Yeniden Onayla"
 SPR_reaffirm_the_popular_front_strategy_desc:0 "Bizimle müttefiklerimiz arasındaki farklılıkların şimdilik unutulması zorunludur, böylece hepimiz daha önemli olan savaşa odaklanabiliriz: faşistlere karşı."
 SPR_rebuild_the_nation:0 "Ulusu Yeniden İnşa Et"
 SPR_rebuild_the_nation_desc:0 "İç Savaşın dehşetinden sonra, istikrar geri döndü ve yavaş yavaş endüstriyel temelimize yeniden kavuşuyoruz. Sanayi genişletme programlarına kapsamlı yatırımlar dönemi, şüphesiz ekonomimize yeniden ivme kazanması için ihtiyaç duyduğu desteği verecektir."
 SPR_recovering_from_civil_war_focus_tt:0 "Yeterince yüksek §YUyum§! varsa sahip olunan İspanyol eyaletlerini §YÇekirdek Eyalet§! statüsüne döndürmeyi mümkün kılan §Yİç Savaştan Toparlanma§! kararlarının kilidini açar.\n"
 SPR_red_bulwark_in_the_west:0 "Batıdaki Kızıl Siper"
 SPR_red_bulwark_in_the_west_desc:0 "Coğrafi konumumuz müttefiklerimizden izolasyon konumudur. Eğer saldırıya uğrarsak, özellikle güçlü deniz güçleri tarafından, [SOV.GetNameDef]'den yardım bekleyemeyiz. Bu nedenle savunmalarımızın, sosyalizmin bir kalesi, Avrupa'daki batı çapası olarak hareket edebileceğimiz şekilde olmasını sağlamalıyız."
 SPR_reeducate_the_bourgeoisie:0 "Burjuvaziyi Yeniden Eğit"
 SPR_reeducate_the_bourgeoisie_desc:0 "Halk Cephesi miadını doldurdu ve şimdi burjuvazinin yeniden eğitilip ekonomik ve toplumsal yanılgılarından kurtarılma zamanı geldi. Onları henüz devletin düzgün vatandaşları haline getireceğiz."
 SPR_regional_defense_council_of_aragon:0 "Aragon Bölgesel Savunma Konseyi"
 SPR_regional_defense_council_of_aragon_desc:0 "Savaş amaçları için ve sadece zorunluluktan, İç Savaş sonucunda ortaya çıkan özerk anarşist komünler, çabalarımızı koordine edebilecek tek bir Savunma Konseyi altında birleştirilmelidir. Aragon'da bir tane kurarak başlayacağız."
 SPR_regional_defense_council_of_iberia:0 "İberya Bölgesel Savunma Konseyi"
 SPR_regional_defense_council_of_iberia_desc:0 "Bir zamanlar Portekiz olan yerin kurtuluşuyla, İberya yarımadasında var olan tüm komünlerin isteklerini temsil eden yeni bir savunma konseyi kurabiliriz."
 SPR_regional_defense_council_of_iberia_tt:0 "§Y[ROOT.GetName]§!, §Yİberya Bölgesel Savunma Konseyi§! olarak bilinecektir.\n"
 SPR_relocate_the_gold_reserves:0 "Altın Rezervlerini Yer Değiştir"
 SPR_relocate_the_gold_reserves_desc:0 "Altın rezervlerimiz yurtdışından savaş malzemeleri satın almada kilit rol oynuyor. Güvenli bir yerde saklandığından emin olmalıyız, bu da maalesef onu yurtdışına taşımayı gerektiriyor."
 SPR_relocate_the_gold_reserves_tt:0 "§RAltın Rezervlerimiz ev sahibi ülkenin insafına kalacaktır!§!\n"
 SPR_remove_after_civil_war_tt:0 "§RBu birlikler İç Savaşın sonunda kaldırılacaktır!§!\n"
 SPR_repair_and_expand_the_dockyards:0 "Tersaneleri Onar ve Genişlet"
 SPR_repair_and_expand_the_dockyards_desc:0 "Büyük tersaneler iç savaşın yıkımından muaf değildi. Bunları onarırken, gelecekteki donanma genişletme programlarına hazır olmak için onları genişletmeyi de düşünmeliyiz."
 SPR_reprofessionalize_the_military:0 "Orduyu Yeniden Profesyonelleştir"
 SPR_reprofessionalize_the_military_desc:0 "Zorunluluktan, ordumuz askeri hayatın katı disipliniyle eğitilmemiş olanlardan yeniden inşa edildi. Ordumuzu geçici bir acil durum gücünden gerçek bir ulusal askeri güce dönüştürmek için, onu yeniden profesyonelleştirmeli ve uygun disiplin ve komuta yapılarıyla donatmalıyız."
 SPR_restore_higher_education:0 "Yüksek Öğrenimi Restore Et"
 SPR_restore_higher_education_desc:0 "Savaş sırasında hasar gören yüksek öğrenim kurumları yeniden inşa edilmeli ve genişletilmelidir, sanayimiz için sürekli bir parlak beyin tedariki sağlanmalıdır."
 SPR_revive_the_republican_navy:0 "Cumhuriyetçi Donanmayı Canlandır"
 SPR_revive_the_republican_navy_desc:0 "Donanmamız da ordumuz gibi iç savaşın başlangıcında parçalandı ve yeniden inşası devletimizin ulusal güvenliği için bir öncelik olmalıdır. Bu, derhal başlayacağımız yeni altyapının kurulmasını gerektirecektir."
 SPR_secularize_the_new_state:0 "Yeni Devleti Laikleştir"
 SPR_secularize_the_new_state_desc:0 "İnşa ettiğimiz yeni toplumda dine yer yoktur. Bunlar sadece sınıf yapılarını güçlendirmeye veya işçileri itaate yatıştırmaya hizmet eder. Ancak zihnimizi bu hurafelerden kurtararak gerçekten özgür olabiliriz."
 SPR_secure_democratic_principles:0 "Demokratik İlkeleri Güvence Altına Al"
 SPR_secure_democratic_principles_desc:0 "Komünist nüfuzun, komünistlerle veya [SOV.GetNameDef] ile ilişkimiz ne olursa olsun, İkinci Cumhuriyet'in üzerine kurulduğu ilkeleri değiştirmesine veya hatta yok etmesine izin veremeyiz - bu ilkeler açıkça olmasa da kalplerimizde taşınmalıdır."
 SPR_secure_the_guardia_civil:0 "Guardia Civil'i Güvence Altına Al"
 SPR_secure_the_guardia_civil_desc:0 "Aşırılıkçı unsurlar kamu düzenini bozmaya devam ediyor ve sivil huzursuzluğa karşı mücadelenin ön saflarında Sivil Muhafızlar (Guardia Civil) var. Şiddeti durdurmayı ve kontrolü sürdürmeyi hedefliyorsak, ulusal polis gücümüzün sadakatini sağlamak önceliğimiz olmalıdır."
 SPR_secure_the_guardia_civil_tt:0 "İç savaşın başlamasıyla, §Y3 piyade§! taburlu 6 zayıf eğitimli birlik kazanılır. Milliyetçiler, §Y6 piyade§! taburlu 3 eğitimli birlik kazanır.\n"
 SPR_secure_the_guardia_civil_tt_2:0 "İç savaşın başlamasıyla, §Y3 piyade§! taburlu 10 zayıf eğitimli birlik kazanılır. Milliyetçiler, §Y6 piyade§! taburlu 5 eğitimli birlik kazanır.\n"
 SPR_secure_the_guardia_de_asalto:0 "Guardia de Asalto'yu Güvence Altına Al"
 SPR_secure_the_guardia_de_asalto_desc:0 "Toplumun kutuplaşması artıyor ve bununla birlikte şiddet de. İyi eğitimli ağır polis rezervimiz olan Taarruz Muhafızları'nın (Guardia de Asalto) sadakatini sağlamalıyız. Şiddet tırmanmaya devam ederse paha biçilmez olacaklardır."
 SPR_secure_the_guardia_de_asalto_tt:0 "İç savaşın başlamasıyla, §Y6 piyade§! taburlu 3 eğitimli birlik kazanılır. Milliyetçiler, §Y3 piyade§! taburlu 6 zayıf eğitimli birlik kazanır.\n"
 SPR_secure_the_guardia_de_asalto_tt_2:0 "İç savaşın başlamasıyla, §Y6 piyade§! taburlu 5 eğitimli birlik kazanılır. Milliyetçiler, §Y3 piyade§! taburlu 10 zayıf eğitimli birlik kazanır.\n"
 SPR_secure_the_guardia_get_both_types_tt:0 "§REğer iki odaktan hiçbiri alınmazsa, Milliyetçiler bunun yerine her iki tipi de alacaktır!§!\n"
 SPR_seize_public_transport:0 "Toplu Taşımayı Ele Geçir"
 SPR_seize_public_transport_desc:0 "Herkes özgürlük mücadelesinde üzerine düşeni yapmak ister. Müttefiklerimiz arasında toplu taşıma sektöründe çalışan birçok kişi var ve bunlar araçlarını cesur askerlerimizin hizmetine sunmaya hevesliler. Bu bize düşmanlarımıza karşı alışılmadık bir taktik avantaj sağlayabilir."
 SPR_seize_public_transport_tt:0 "§RBu Ruh, İç Savaşın sonunda kaldırılacaktır!§!\n"
 SPR_seize_the_gold_reserves:0 "Altın Rezervlerini Ele Geçir"
 SPR_seize_the_gold_reserves_desc:0 "Cumhuriyet'in altın rezervleri Faşistlerin veya muhtemelen daha da kötüsü, Stalinistlerin eline düşme riski altında. Onları ele geçirerek şüphesiz hükûmetin gazabını çekme riskini alıyoruz, ancak bu, savaş çabamızı karaborsadan yabancı silah alımlarını finanse ederek finanse etmemize olanak tanıyabilir."
 SPR_shared_burdens:0 "Paylaşılan Yükler"
 SPR_shared_burdens_desc:0 "Otoriterlikten, kapitalizmden ve dini hurafelerden özgürlüklerimiz için vereceğimiz mücadele uzun ve zorlu olacaktır. Emeğimizin ödüllerini hepimiz toplamadan önce, şüphesiz bizi bekleyen zorlukları taşımada hepimiz üzerimize düşeni yapmalıyız."
 SPR_slipway_enlargement:0 "Kızak Genişletmesi"
 SPR_slipway_enlargement_desc:0 "Daha büyük askeri gemiler inşa etmek için tersane tesislerimizin genişletilmesini araştırmalıyız."
 SPR_solidify_government_control:0 "Hükûmet Kontrolünü Sağlamlaştır"
 SPR_solidify_government_control_desc:0 "Ülke genelindeki özerk devletlerin özgürlükleri, bütünün iyiliği için kısıtlanmalıdır. Yurtdışındaki faşist tehditler karşısında birliğimizi zayıflatmalarına izin veremeyiz."
 SPR_soviet_equipment_shipments:0 "Sovyet Teçhizat Sevkiyatları"
 SPR_soviet_equipment_shipments_desc:0 "Yurtiçi sanayimizin sağlayamadığı, [SOV.GetNameDef]'den silah sevkiyatlarıyla telafi edilmelidir."
 SPR_soviet_industrial_aid:0 "Sovyet Sanayi Yardımı"
 SPR_soviet_industrial_aid_desc:0 "Sadece silah sevkiyatları, cephe birliklerimizin ihtiyaç duyduğu kotaları doldurmayacaktır. Yurtiçi sanayimizi genişletmedeki Sovyet yardımı, şimdilik bu farkı kapatmamıza ve hatta belki de sonunda tam kendi kendine yeterliliğe ulaşmamıza olanak tanıyabilir."
 SPR_soviet_military_advisors:0 "Sovyet Askeri Danışmanları"
 SPR_soviet_military_advisors_desc:0 "Sovyet askeri danışmanları, birliklerimize ve liderlerimize düşmanlarımıza karşı ihtiyaç duydukları avantajı sağlayabilir."
 SPR_soviet_recovery_aid:0 "Sovyet Toparlanma Yardımı"
 SPR_soviet_recovery_aid_desc:0 "Savaş kazanıldıktan sonra, [SOV.GetNameDef] yeniden inşa çabalarımızda bize yardımcı olmaya hazırdır."
 SPR_soviet_technological_advancements:0 "Sovyet Teknolojik Gelişmeleri"
 SPR_soviet_technological_advancements_desc:0 "[SOV.GetNameDefCap] bizim sahip olmadığımız teknolojiye sahip. Faşizmi yenme amacıyla, surely bu ilerlemeleri bizimle paylaşmaya istekli olurlar mı?"
 SPR_stabilize_the_nation:0 "Ulusu İstikrara Kavuştur"
 SPR_stabilize_the_nation_desc:0 "İç savaştan galip çıktık, ancak şimdi istikrarın geri dönmesini ve bunun bir daha olmamasını sağlamalıyız."
 SPR_strengthen_the_anti_fascist_coalition:0 "Anti-Faşist Koalisyonu Güçlendir"
 SPR_strengthen_the_anti_fascist_coalition_desc:0 "Koalisyonumuzun muhalif kısımlarını ortadan kaldırdık - umarım bu şimdi nihayet faşizmi kökünden kazımadaki birleşik kararlılığımızı güçlendirmeye odaklanabileceğimiz anlamına gelir."
 SPR_strengthen_the_euzko_gudarostea:0 "Euzko Gudarostea'yı Güçlendir"
 SPR_strengthen_the_euzko_gudarostea_desc:0 "Bask bölgesi hayati bir sanayiye sahiptir ve daha iyi savunulmalıdır. Yerel hükûmeti tarafından kurulan orduyu genişletmek, oradaki cephe hatlarını güçlendirmede büyük bir yol kat edecektir."
 SPR_strengthen_the_euzko_gudarostea_tt:0 "§YPaís Vasco§!'da §Y3 Piyade§! taburlu 6 birlik kazanılır.\n"
 SPR_subvert_soviet_control:0 "Sovyet Kontrolünü Yık"
 SPR_subvert_soviet_control_desc:0 "Zaferimizi mümkün kılan [SOV.GetAdjective] yardımının bedeli boyun eğmek oldu ve bu yüzden çilemiz henüz bitmemiş gibi görünüyor. Özgürlüğümüz ve bağımsızlığımız için son bir mücadeleye hazırlanmak üzere, [SOV.GetAdjective]'in ülkemiz üzerindeki komünist nüfuzu yayma çabalarını baltalamaya başlayacağız."
 SPR_subvert_soviet_control_tt:0 "\n§R[SOV.GetNameDefCap]'in itaatsizliğimizin bir sonucu olarak cezai işlem yapması muhtemeldir!§!\n"
 SPR_subvert_the_stalinists:0 "Stalinistleri Yık"
 SPR_subvert_the_stalinists_desc:0 "Bu kavgayı biz başlatmadık, ama eğer Stalinistler ısrar ederse onların oyununu oynayacağız. Destekçilerini kendi tarafımıza çekerek ve ikmallerini sızdırarak güç tabanlarını içeriden zayıflatacağız. Nereye giderlerse gitsinler karşılarında bizi bulacaklar."
 SPR_support_french_communists:0 "Fransız Komünistlerini Destekle"
 SPR_support_french_communists_desc:0 "[FRA.GetNameDefCap]'in yakın geçmişinde komünist duyguya dair bir tarih var. Eğer işçinin hedeflerini ilerletmede iş birliğimizin bilgeliğini görürlerse güçlerimizi birleştireceğiz, ancak eğer o kadar aydınlanmış değillerse onlara sosyalizmi zorla getirmeliyiz."
 SPR_take_the_initiative:0 "İnisiyatifi Ele Al"
 SPR_take_the_initiative_desc:0 "Düşmanlarımız bize ne zaman ve nerede saldıracaklarını seçerken boş duramayız. Savaşlar inisiyatif göstererek kazanılır ve bu yüzden yapmamız gereken budur."
 SPR_the_anti_fascist_crusade:0 "Anti-Faşist Haçlı Seferi"
 SPR_the_anti_fascist_crusade_desc:0 "İspanyollar, başkaları tehlikeyi fark etmeden çok önce faşistlerle savaştı. Bu savaş bizim savaşımızdır ve kazanılana kadar durmayacağız."
 SPR_the_anti_fascist_workers_revolution:0 "Anti-Faşist İşçi Devrimi"
 SPR_the_anti_fascist_workers_revolution_desc:0 "Şimdi İspanyol işçisinin faşist düşmana karşı ayaklanma zamanı! Burjuvazi ile el ele duruyoruz, ama sadece bu tehdidin üstesinden gelmek için gerektiği sürece. Devrim şimdi başlıyor!"
 SPR_the_five_year_plan:0 "Beş Yıllık Plan"
 SPR_the_five_year_plan_desc:0 "Cesur yeni bir plan, İspanyol devletini en fazla beş yıllık bir süre içinde yerel bir endüstriyel güç merkezine dönüştürecektir."
 SPR_the_future_of_the_republic:0 "Cumhuriyetin Geleceği"
 SPR_the_future_of_the_republic_desc:0 "Mevcut mücadelenin, Cumhuriyetin geleceği üzerindeki etkisi açısından şüphesiz belirleyici olduğu görülecektir. Bu geleceği uygun şekilde şekillendirmek için hiçbir çaba veya masraftan kaçınmamalıyız."
 SPR_the_inevitable_counterblow:0 "Kaçınılmaz Karşı Darbe"
 SPR_the_inevitable_counterblow_desc:0 "Komünal yaşam tarzımıza yönelik uluslararası düşmanlık artıyor. Darbenin düşmesi an meselesidir ve onu karşılamaya hazır olmalıyız."
 SPR_the_maximum_concession:0 "Maksimum Taviz"
 SPR_the_maximum_concession_desc:0 "Faşizmle savaşma ruhuyla mümkün olan en büyük tavizi verdik: kapitalistlerle ve otoriter komünistlerle iş birliği. Bu taviz, gidebileceğimiz en son noktadır ve sonsuza kadar süremez. Sürerken ondan en iyi şekilde yararlanacağız."
 SPR_the_peoples_fleet:0 "Halkın Filosu"
 SPR_the_peoples_fleet_desc:0 "Halkın iradesi hem karada hem de denizde kendini gösterir. Bu irade, derhal inşa etmeye başlayacağımız yeni bir filo tarafından desteklenmelidir."
 SPR_the_popular_army:0 "Halk Ordusu"
 SPR_the_popular_army_desc:0 "Yeni ordumuz, ordunun ihanetiyle lekelenmemiş olanlardan oluşacak; Cumhuriyetin üzerine inşa edildiği ilkelere olan savunmalarında gayretli olan, ancak belki de daha önce hizmet etmemiş olan nüfus arasındaki kişilerden. Bu yeniden yapılanmayla birlikte, bu yeni orduya mücadelelerinde yardımcı olacak yeni silahlar ve doktrinler de geliştireceğiz."
 SPR_the_popular_front:0 "Halk Cephesi"
 SPR_the_popular_front_desc:0 "Faşizmin ve dini hurafelerin kişisel özgürlüklerimize oluşturduğu tehlike çok büyüktür ve Sağ'a karşı muhalefetlerinde birleşmiş siyasi partilerden oluşan geniş bir cephe kurmalıyız. Ancak bir araya gelirsek onların ilerlemesini durdurabilir ve cumhuriyetimizi kurtarabiliriz."
 SPR_the_red_tide:0 "Kızıl Dalga"
 SPR_the_red_tide_desc:0 "Halkımız davamızın adil ve doğru olduğunu biliyor ve tek yapmamız gereken, ordumuz için kararlı bir acemi akışı sağlamak için bu duyguyu kullanmaktır. Kızıl bir dalga gibi, kuvvetlerimiz bize karşı çıkan herkesin üzerinden geçecek."
 SPR_the_spanish_red_army:0 "İspanyol Kızıl Ordusu"
 SPR_the_spanish_red_army_desc:0 "İspanyol işçisinin çıkarlarını yabancı tehditlere karşı savunmak için yeni ve sadık bir ordu yaratılacaktır. Bunu Sovyetler Birliği'ninkine göre modelleyeceğiz."
 SPR_the_stalinist_doctrine:0 "Stalinist Doktrin"
 SPR_the_stalinist_doctrine_desc:0 "Gevşek anti-faşist gruplar ittifakımız arasında, Marx'ın sözünü Stalin'den bağımsız olarak yorumlayanlar var. Bu, tüm Sosyalizmin başına beladır ve devam etmesine izin verilemez. İşçinin mücadelesi tehlikeye girmesin diye bu muhalif sesleri ortadan kaldırmalı ve tek bir lider altında birleşmeliyiz."
 SPR_the_threats_abound:0 "Tehditler Bol"
 SPR_the_threats_abound_desc:0 "Dünyanın bizim varlığımızla aynı fikirde olmadığı açık. Nereye dönersek dönelim soğuk bir omuzla, hatta açıkça düşmanlıkla karşılaşıyoruz. Artık bizim için aşikar: güvenebileceğimiz hiçbir müttefikimiz yok. Bu sona ermiş ulus-devletlerin her biriyle savaşa hazırlanmalıyız."
 SPR_those_who_would_not_help_us:0 "Bize Yardım Etmeyenler"
 SPR_those_who_would_not_help_us_desc:0 "Faşistlere karşı mücadelemizde Batı tarafından terk edildik, ancak o zamandan beri işler değişti ve kendilerini kendi savaşlarında buldular. Şimdi yine onların yardımına ihtiyacımız var ve belki bu sefer yeni bir düşmana karşı öncü oluşturduğumuzda bize kulak vermeyi öğrenmişlerdir."
 SPR_those_who_would_not_help_us_tt:0 "§RBonusların etkili olması için ülkelerin anlaşmayı onaylaması gerekir.§!\n"
 SPR_to_do_that_which_is_right:0 "Doğru Olanı Yapmak"
 SPR_to_do_that_which_is_right_desc:0 "Her erkek, kadın ve çocuk, toplumunun istikrarının ve güvenliğinin davaya yaptığı kişisel katkıya bağlı olduğunu bilir. Her küçük eylem er ya da geç dünya devriminin başarısına hizmet edeceğinden, halkı üzerine düşeni yapmaya teşvik etmeliyiz."
 SPR_torchbearers_of_tomorrow:0 "Yarının Meşale Taşıyıcıları"
 SPR_torchbearers_of_tomorrow_2:0 "Yarının Meşalesini Taşıyanlar"
 SPR_torchbearers_of_tomorrow_2_desc:0 "Davamızı düşünsel, askerî veya sınai uğraşlarla destekleyerek üzerine düşeni yapanlar, geleceğin ta kendisidir. Bu düşünce güçlü bir itici güç olabilir. Bu nedenle günlük çalışmalarının önemini kavramalarını sağlamalıyız."
 SPR_torchbearers_of_tomorrow_desc:0 "Davamızın desteğinde, ister entelektüel ister askeri arayışlarla olsun, üzerlerine düşeni yapanlar, geleceğin ta kendisidir. Bu farkındalık güçlü bir itici güç olabilir ve bu yüzden çalışmalarının öneminin farkında olmalarını sağlamalıyız."
 SPR_train_the_union_youth:0 "Sendika Gençliğini Eğit"
 SPR_train_the_union_youth_desc:0 "Ordudan sadakatsizlik homurtuları yükseliyor ve en kötüsüne hazırlıklı olmalıyız. Genç destekçilerimizin adanmış ve kararlı kesimlerine silah kullanımı ve temel askeri taktikler konusunda hızlandırılmış kurslar vereceğiz, böylece en kötü şey olursa bir an önce silahlanabilirler."
 SPR_train_the_union_youth_tt:0 "İç savaşın başlamasıyla, §Y3 piyade§! taburlu 5 iyi eğitimli birlik kazanılır.\n"
 SPR_transplant_soviet_industry:0 "Sovyet Sanayisini Naklet"
 SPR_transplant_soviet_industry_desc:0 "Sovyetler, binlerce kilometre mesafede bile tüm fabrikaların yerini değiştirme konusunda özellikle usta olduklarını gösterdiler. Kendi yerli askeri sanayimizi başlatmak için, daha az önemli fabrikalarından bazılarının İberya yarımadasına nakledilmesini talep edeceğiz."
 SPR_unify_the_london_bureau:0 "Londra Bürosu'nu Birleştir"
 SPR_unify_the_london_bureau_desc:0 "Üçüncü Enternasyonal'in kurulmasına ve Troçki ile Stalin arasındaki güç mücadelelerine tepki olarak, her iki Marksizm yorumunu da reddeden Uluslararası Devrimci Sosyalist Birlik Bürosu kuruldu. Troçkizm ve Stalinizme karşı birleşik bir Sosyalizm cephesi oluşturmak için oradaki temaslarımıza ulaşacağız."
 SPR_united_under_socialism:0 "Sosyalizm Altında Birleşmiş"
 SPR_united_under_socialism_desc:0 "Çeşitli bölgelerden ve geçmişlerden gelmemize rağmen, bu farklılıkları geride bırakmalı ve sosyalizm arayışımızda birleşmeye odaklanmalıyız."
 SPR_war_of_independence:0 "Bağımsızlık Savaşı"
 SPR_war_of_independence_desc:0 "Birliğin bir başka üye devleti haline gelmemek için eski müttefiklerimize karşı dönme zamanı geldi. Halkımızdan hem sol hem de sağ otoriterlikten özgürlüğün nihai ödülünü elde etmek için son bir büyük çaba gerekmektedir."
 SPR_war_of_independence_tt:0 "§REğer taleplerimizi kabul etmezlerse bu savaşa yol açacaktır!§!"
 SPR_wartime_industry:0 "Savaş Zamanı Sanayisi"
 SPR_wartime_industry_desc:0 "Kendimizi bir kez daha savaşta buluyoruz ve bu yüzden endüstriyel genişlememizin sivil ihtiyaçlardan ziyade askeri ihtiyaçlara hizmet etmeye odaklanmasını sağlamalıyız."
 SPR_wealth_redistribution:0 "Servet Yeniden Dağıtımı"
 SPR_wealth_redistribution_desc:0 "Şimdi zenginlerin mülküne el konulduğuna göre, bu serveti yeniden dağıtarak nüfusun tüm kesimlerinin ödüllerini eşit olarak toplamasını sağlayarak herkesin bu zafere ortak olmasını sağlayacağız."
 VIC_a_nation_reborn:0 "Yeniden Doğan Bir Ulus"
 VIC_a_nation_reborn_desc:0 "Aşağılanmış ve yenilmiş ulusumuzu yeniden inşa etme sürecinin uzun ve acı verici sonunda, cumhuriyetçiliğin kanserinden ve iç bölünmelerinden arınmış, yeniden doğmuş yeni bir Fransa duruyor."
 VIC_aid_small_businesses:0 "Küçük İşletmelere Yardım Et"
 VIC_aid_small_businesses_desc:0 "Ekonomimizi oluşturan birçok küçük şirket, karne uygulaması ve diğer savaş önlemlerinden ağır darbe aldı. Hayatta kalmalarına yardımcı olmak için bunu düzeltmeye çalışmalıyız."
 VIC_analyze_our_defeat:0 "Yenilgimizi Analiz Et"
 VIC_analyze_our_defeat_desc:0 "Yenilgimiz kaçınılmaz değildi. Birçok farklı insan, uzun bir aşağılık rehavet zinciri içinde görevlerinde başarısız oldu. Kesin nedenleri bulacağız ve gelecekte daha iyi hazırlanmış olduğumuzdan emin olacağız."
 VIC_anti_bolshevist_volunteers:0 "Anti-Bolşevik Gönüllüler"
 VIC_anti_bolshevist_volunteers_desc:0 "İnsanlık tarihinin en büyük mücadelesi şu anda batı medeniyetinin güçleri ile Komünizmin güçleri arasında gerçekleşiyor. Bu devasa savaş verilirken boş duramayız."
 VIC_buy_from_the_enemy:0 "Düşmandan Satın Al"
 VIC_buy_from_the_enemy_desc:0 "Askeri sanayimiz bize yeterli modern silah sağlama görevine uygun değildi ve hala değil. Mevcut her kaynaktan modern silahlar edinmeye bakmalıyız."
 VIC_celebrate_motherhood:0 "Anneliği Kutla"
 VIC_celebrate_motherhood_desc:0 "Bir kadının yerinin ev olduğu, tıpkı erkeğin yerinin tezgah veya tarla olduğu gibi apaçık ortadadır. Halkımıza, bir kadının işinin ulusun hayatta kalması için erkeğinki kadar hayati olduğu hatırlatılmalıdır."
 VIC_concessions_to_the_germans:0 "Almanlara Tavizler"
 VIC_concessions_to_the_germans_desc:0 "Durumun gerçekleri, eski düşmanlarımızla bir anlaşmaya varmamızı gerektiriyor. Üzerimize yüklenen ezici yükleri azaltmanın bir yolu olmalı."
 VIC_down_with_marianne:0 "Kahrolsun Marianne"
 VIC_down_with_marianne_desc:0 "Fransız cumhuriyetçiliğinin sembolü olan Marianne'e olan sahte-dini tapınma, halkımızın zihinlerini bulandırdı. Tıpkı temsil ettiği değersiz Cumhuriyet gibi, onun tüm izleri yok edilmelidir."
 VIC_emergency_powers_to_petain:0 "Petain'e Acil Durum Yetkileri"
 VIC_emergency_powers_to_petain_desc:0 "Fransa için savaş kaybedildiğinde, devleti güvence altına almak için radikal önlemler alınması gerektiği açıktır. Başkan, gerekli olanı yapmaktan kısıtlanamaz."
 VIC_end_the_occupation:0 "İşgali Sona Erdir"
 VIC_end_the_occupation_desc:0 "Ulusal devrimimizin sonunda, eski düşmanlarımızın yanında yerimizi almaya ve Bolşevizm tehdidinden arınmış, cumhuriyetçiliğin bölücü cazibelerinden arınmış yeni bir Avrupa için savaşmaya hazırız."
 VIC_finish_the_naval_buildup:0 "Donanma İnşasını Bitir"
 VIC_finish_the_naval_buildup_desc:0 "Geç cumhuriyet, filoyu modernize etmek için bir dizi gemi inşa etmeye başladı. Çok geç başlandı ve çok yavaş ilerledi, zamanında bitirilemedi. Ama yine de yeni bir Fransız Donanması'nın çekirdeği olarak hizmet edebilir."
 VIC_form_the_milice:0 "Milice'i Kur"
 VIC_form_the_milice_desc:0 "Fransa genelinde direniş giderek güçlenirken, onlara karşı savaşı götürebilecek bir güç yaratmalıyız. Sadece en vatansever üyeleri işe alacak ve bu teröristleri yola getirmek için uygun gördükleri şekilde hareket etme konusunda onlara geniş bir özgürlük vereceğiz."
 VIC_hidden_materials:0 "Gizli Malzemeler"
 VIC_hidden_materials_desc:0 "Almanlar, antlaşmalarının şartlarını hile yapmasalardı ordularını bu kadar hızlı yeniden inşa edemezlerdi. Bu nedenle, bizim de aynısını yapmamız sadece adil ve doğrudur."
 VIC_learn_from_the_enemy:0 "Düşmandan Öğren"
 VIC_learn_from_the_enemy_desc:0 "Nasıl ve neden başarısız olduğumuzu anlamanın en hızlı yolu, rakiplerimizin neyi doğru yaptığını anlamaktır."
 VIC_long_term_economic_planning:0 "Uzun Vadeli Ekonomik Planlama"
 VIC_long_term_economic_planning_desc:0 "Mevcut durumu diğer tüm endişelerin önüne geçecek kadar önemli görmek cazip gelse de, uygulanması uzun zaman alan şeyler olduğunu unutmamalıyız. Bir dizi ekonomik plan oluşturarak, ekonomimizi verimli bir şekilde büyütebiliriz."
 VIC_mandatory_work_service:0 "Zorunlu Çalışma Hizmeti"
 VIC_mandatory_work_service_desc:0 "Almanlardan, eğer onlara işçi sağlarsak işgal maliyetlerimizin azaltılacağına dair bir söz almayı başardık. Ancak, görünüşe göre halk arasında anavatanlarına ihtiyaç duydukları bu saatte yardım etmek için gerekli işi yapmaya istekli pek az kişi var. Teşviklerin başarısız olduğu yerde, şimdi maalesef zorlama kullanmalıyız."
 VIC_modernize_the_airforce:0 "Hava Kuvvetlerini Modernize Et"
 VIC_modernize_the_airforce_desc:0 "Belki de yenilgimizin en aşağılayıcı kısmı, havada rekabet edemememizdi. Çok az modern uçağımız vardı. Savaş etrafımızda devam ederken, yeni uçaklar hızla üretime alınıyor. Benzer bir şeyin bir daha olmasına izin vermemeliyiz."
 VIC_prosecute_the_losers:0 "Kaybedenleri Yargıla"
 VIC_prosecute_the_losers_desc:0 "Fransa, Kaiser'in ordularına yıllarca dayandı, ancak mevcut savaşta çöktü. Bunun bir nedeni olmalı ve bu ortaya çıkana ve sorumlular adalete teslim edilene kadar durmamalıyız."
 VIC_rebuild_the_military:0 "Orduyu Yeniden İnşa Et"
 VIC_rebuild_the_military_desc:0 "Fransa ordusu tamamen yenildi ve aşağılandı, onu tam savaş gücüne geri getirmek uzun bir çaba gerektirecek."
 VIC_the_legionary_service_order:0 "Lejyoner Hizmet Düzeni"
 VIC_the_legionary_service_order_desc:0 "Ordumuz büyük ölçüde silahsızlandırılmış ve her halükarda tüm Fransa'yı korumak için çok gerilmişken, rejimi desteklemek için yeni bir vatanseverler örgütüne ihtiyacımız var."
 VIC_the_national_bureau_of_statistics:0 "Ulusal İstatistik Bürosu"
 VIC_the_national_bureau_of_statistics_desc:0 "Eğer halkımızı daha iyi bir geleceğe götüreceksek, kararlarımızı dayandıracağımız somut verilere ihtiyacımız var. Bu verileri oluşturmakla görevli yeni bir ajans kurmalıyız."
 VIC_the_national_revolution:0 "Ulusal Devrim"
 VIC_the_national_revolution_desc:0 "Yenilgimiz şüphesiz ulusumuzdaki temel bir kusurdan kaynaklandı. Bu kusuru gidermek uzun zaman alacak, ama belki de yenilgimizin şoku daha güçlü bir şekilde geri dönmemizi sağlar."
 VIC_up_with_jean_darc:0 "Yaşasın Jeanne d'Arc"
 VIC_up_with_jean_darc_desc:0 "Jeanne d'Arc, görünüşte ezici bir düşmana karşı cesurca savaştı, anavatanın iyiliği için her şeyini feda etti ve işgalcileri kovmak için ulusu sancağı altında topladı. Kesinlikle Marianne'den daha iyi bir sembol değil mi gençlerimizin örnek alması için?"
 VIC_venerate_the_craftsman:0 "Zanaatkarı Yücelt"
 VIC_venerate_the_craftsman_desc:0 "Çok uzun zamandır emek tartışması, büyük bir şirkette büyük bir fabrikada çalışan sanayi işçisine odaklandı. Kendi atölyesinde çalışan, ailesini geçindiren vasıflı zanaatkarın başarılarını gösterme zamanı geldi."
 autonomous_state:0 "Özerk Devlet"
 free_french_focus:0 "Özgür Fransız Odak Ağacı"
 french_focus:0 "Fransız Odak Ağacı"
 has_hired_juan_negrin_tt:0 "§YJuan Negrín§!: Danışman olarak işe alındı"
 invite_to_faction_tt:0 "İttifakımıza davet edilir."
 nationalist_victory:0 "Milliyetçi İspanya, İspanya İç Savaşı'nı kazandı"
 portugal_guarantees_freedom_tt:0 "Avrupa'daki tüm bağımsız küçük §YDemokratik§! veya §YTarafsız§! ulusların bağımsızlığını garanti eder."
 republican_victory:0 "Cumhuriyetçi İspanya, İspanya İç Savaşı'nı kazandı"
 semi_autonomous_state:0 "Yarı Özerk Devlet"
 unlocks_espionage_operation_tt:0 "Bir §YCasusluk Operasyonunun§! kilidini açar:\n"
 vichy_french_focus:0 "Vichy Fransası Odak Ağacı"
