 remove_theorist:0 "§RTeorisyen§! olarak §Ykaldır§!:\n"
 rocket_effort:0 "Roket Çabası"
 rocket_effort_desc:0 "Roket ve jet motorları, insansız ve insanlı araçlar için benzeri görülmemiş hızlar sağlar. Bu teknolojilere öncülük etmek, düşmanı şaşırtmamızı sağlayacaktır."
 royal_ordinance_focus:0 "[Root.GetRoyalOrdnanceFactoriesName]"
 royal_ordinance_focus_desc:0 "[Root.GetRoyalOrdnanceFactoriesDesc]"
 scw_in_progress_tt:0 "İspanya bir iç savaşta."
 secret_bonus:0 "Harika Silahlar Bonusu"
 secret_weapon_focus:0 "Gelişmiş Silahlar"
 secret_weapon_focus_desc:0 "Bir ada İmparatorluğu olarak her zaman Deniz araştırmalarının ön saflarında olmalıyız, ancak uzun menzilli roketçilik de zarar vermez."
 secret_weapons:0 "Gizli Silahlar"
 secret_weapons_desc:0 "Tüm ekstra kaynakları tank ve uçak geliştirmeye harcamak cazip gelse de, savaşları kazanmanın sırrı tamamen yeni bilim alanlarında yatmaktadır; elektronik, roketçilik ve nükleer araştırma."
 shadow_scheme_focus:0 "Gölge Planı"
 shadow_scheme_focus_desc:0 "Hava Bakanlığı, sivil fabrikaların askeri fabrikalara daha kolay dönüştürülmesi için parlak bir öneriyle geldi. Çeşitli kilit şirketlere uygun hibeler ve kredilerle, fabrikaları askeri uygulamalara geçişi çok daha sorunsuz hale getirmek için önceden genişletilebilir ve uyarlanabilir."
 shadow_scheme_focus_tt:0 "Savaşa girerken iki eyalette toplam §G4§! İnşaat Alanı ve §Y4 Askeri Fabrika§! verir.\n"
 shbb_focus:0 "Süper Ağır Zırhlılar"
 shbb_focus_desc:0 "Kısa vadede, Zırhlı sayısı bakımından ne İngiltere'yi ne de Amerika Birleşik Devletleri'ni geçmemiz pek olası değil, ama belki de buna ihtiyacımız yok. Bunun yerine, Batılıların Washington antlaşmasının izin verdiğinden çok daha güçlü Zırhlılar inşa etmek mümkün olabilir."
 ships_bonus:0 "Gemi modelleri bonusu"
 singapore_focus:0 "Singapur Stratejisi"
 singapore_focus_desc:0 "Singapur, Doğu'daki birincil deniz üssümüz olarak kalmalıdır. Hong Kong Japonlara düşebilir, ancak Singapur, Ana Filo düşmanı kesin olarak yenmek için gelene kadar zaptedilemez kalmalıdır."
 sirte_oil_developed:0 "Sirte Petrol Sahaları Geliştirildi"
 southern_expansion_focus:0 "Güney Genişlemesi"
 southern_expansion_focus_desc:0 "İmparatorluk Donanması tarafından tercih edilen Güney Genişleme Doktrini, Japonya'nın güneye, Güneydoğu Asya ve Pasifik'e doğru genişlemesi gerektiğini dikte eder. Avrupa güçlerinin zengin sömürgeleri Japon endüstrisi için kritik kaynaklara sahiptir, ancak bu yol Amerika Birleşik Devletleri ile çatışmaya yol açacaktır. Önleyici bir saldırı yerindedir."
 southern_expansion_focus_tt:0 "Seçildiğinde §YSovyetler Birliği§! ile §Ysaldırmazlık paktı§! ekle\n"
 soviet_focus:0 "Sovyet Milli Hedefi"
 sp_landward_forts_focus:0 "Kara Tahkimatları"
 sp_landward_forts_focus_desc:0 "Singapur Adası'ndaki mevcut savunmalar yetersiz. Tahkimatları güçlendirmek için çabalarımıza odaklanmalıyız!"
 special_bonus:0 "Özel kuvvetler bonusu"
 special_forces:0 " Özel Kuvvetler"
 special_forces_bonus:0 "Özel Kuvvetler bonusu"
 special_forces_desc:0 "Elit kuvvetlere ihtiyacımız var; dağ birlikleri ve paraşütçüler önceliğimiz olmalı."
 spiritual_mobilization_focus:0 "Ruhsal Seferberlik"
 spiritual_mobilization_focus_desc:0 "Sadece askerlerimiz değil, tüm ulusumuz savaşa ruhsal olarak hazırlanmalı. Bu amaçla, milliyetçiler Ulusal Ruhsal Seferberlik Hareketi'nde vatanseverliği ve hükümete desteği artırmak için bir araya getirildi."
 ss_bonus:0 "Denizaltı modelleri bonusu"
 strat_dest_bonus:0 "Stratejik Yıkım doktrinleri bonusu"
 strike_usa_focus:0 "ABD'ye Saldır!"
 strike_usa_focus_desc:0 "Hain Amerikalılar bizi merhametlerine bırakmış, petrol ve diğer umutsuzca ihtiyaç duyulan kaynaklarımızı kontrol ediyorlar. Sanayileri bizimkinden çok daha üstün, bu yüzden saldırırsak, sert saldırmalıyız! ABD'ye karşı uzun süreli bir savaşı kazanmayı umamayız..."
 student_movement_focus:0 "Öğrenci Hareketi"
 student_movement_focus_desc:0 "Eğitim Bakanlığı, Ruhsal Seferberliğin diğer herhangi bir parçası kadar önemlidir ve eğitimcilerin ve öğrencilerin ulusun arkasında toplanması, kalıcı bir askeri odaklı eğitim sistemi inşa edecektir."
 sub_op_bonus:0 "Denizaltı Operasyonları doktrinleri bonusu"
 subdue_warlords_focus:0 "Savaş Ağalarını Boyunduruk Altına Al"
 subdue_warlords_focus_desc:0 "Çinliler, bir zamanlar gururlu imparatorluklarının radikaller ve askeri klikler tarafından paramparça edilmesine izin verdiler. Japonya İmparatorluğu, tebaalarının bile bu tür bölünmelerine göz yummayacaktır."
 subject_autonomy_mod_tt:0 "Tebaalarda Özerklik: §G-0.5§!"
 submarine_effort:0 "Denizaltı Çabası"
 submarine_effort_desc:0 "Denizaltı savaşı, torpido botunun icadından bu yana en heyecan verici deniz gelişmesidir. Denizaltılara karşı korunmanın yanı sıra, onları düşman nakliyesine karşı da kullanmak iyi olacaktır."
 subvert_india_focus:0 "Hint Ulusal Ordusu"
 subvert_india_focus_desc:0 "İngiltere bir imparatorluk kurma çabalarımızı yargılarsa, onlara kendilerinin zaten çökmekte olduğunu göstereceğiz. Hint savaş esirleri ve sürgünler, Britanya Raj'ını devirebilecek bir hareketin temelini oluşturacaktır."
 synth_bonus:0 "Sentetik kaynak teknolojileri"
 synth_oil_effort_tt:0 "§YSentetik Rafineri§! için yeterli inşaat alanı yok!"
 synth_oil_focus:0 "Sentetik Petrol Odağı"
 synth_oil_focus_desc:0 "Kendi petrol üretimimiz çok sınırlı ve petrol ithal etmek bizi yabancı çıkarların insafına bırakıyor. En güvenli çözüm, sentetik petrol teknolojimizi mükemmelleştirmek olacaktır."
 technology_sharing:0 "Teknoloji Paylaşımı"
 technology_sharing_desc:0 "Müttefiklerimizle teknolojik gelişmeleri paylaşarak, tüm grubumuz savaş zamanı Ar-Ge'yi daha verimli bir şekilde yürütebilecektir."
 tfv_canada.63.a:0 "Gerçekten de."
 tfv_canada.63.b:0 "Asla!"
 tfv_canada.63.d:0 "[CAN.GetAdjective] devletinin yeni hükümeti, Newfoundland'daki topraklarımızın tavizi için bize ilginç bir teklif sunuyor. Ulusumuzun yasalarının bölünmez bir devleti tanıdığı doğru olsa da, danışmanlarımız Avrupa'daki durumdan dikkat dağıtabilecek yeni bir cephe olasılığını düşünmemizi tavsiye ediyor."
 tfv_canada.63.t:0 "[CAN.GetNameDef] Newfoundland İçin Tavizler Teklif Ediyor"
 ti_bonus:0 "Ticaret Engelleme doktrinleri bonusu"
 tizard_mission_focus:0 "Tizard Misyonu"
 tizard_mission_focus_desc:0 "Kaynak ve endüstriyel kapasite eksikliğimiz nedeniyle tam olarak yararlanamadığımız teknolojide birçok atılım ürettik. Henry Tizard, ABD ile bir teknoloji paylaşım antlaşması müzakere etmek için bir heyete başkanlık etmek istiyor."
 tp_bonus:0 " Nakliye gemisi modelleri"
 uk_amphibious_focus:0 "Amfibi Savaş"
 uk_amphibious_focus_desc:0 "Dalgalara hükmetmek güzel, ama bazen ayaklarınızı ıslatmanız gerekir. Düşman topraklarına çıkarma kuvvetleri indirme yeteneğimizi ihmal etmemeliyiz."
 uk_asia_focus:0 "Doğu Asya'yı Güçlendir"
 uk_asia_focus_desc:0 "Doğu'daki eski sömürgelerimizin birçoğu iç savaşlar ve yerel ülkelerin emperyal hırsları tarafından tehdit ediliyor. Kalan ileri karakollarımızı ihmal etmemeli, küresel varlığımızı güvence altına almak için bu bölgeleri geliştirmeye devam etmeliyiz."
 uk_australia_focus:0 "Avustralya'da Gelişim"
 uk_australia_focus_desc:0 "Avustralya Tersanelerine ve Sanayisine yapılacak bir yatırım, ekonomilerine bir destek sağlayacak ve savaş durumunda daha büyük bir katkı sağlamalarına olanak tanıyacaktır."
 uk_balkan_strategy:0 "Balkan Stratejisi"
 uk_balkan_strategy_desc:0 "Balkanlardaki ulusların birçoğu İngiliz yanlısıdır ve orta Avrupa'dan bizimle aynı tehdidi görmektedir. Fırsatı değerlendirir ve onları erkenden desteklersek, sadakatlerini güvence altına alabiliriz, ancak intikamcı komşularını kızdırmak pahasına."
 uk_battleship_focus:0 "Zırhlı Odağı"
 uk_battleship_focus_desc:0 "Teorisyenler hava üstünlüğü veya deniz üstünlüğü hakkında tartışırken, kimse bir zırhlının silahlarının saraylarına doğrultulmasını istemez. Uçak gemisi meraklıları sonunda haklı çıksa bile, zırhlılar yıllarca okyanuslara hakim olmaya devam edecektir."
 uk_burma_focus:0 "Burma Yolu"
 uk_burma_focus_desc:0 "Japonya'ya karşı mücadelelerinde Çinlilere, Burma ve Çin arasında bir yol - ve ilgili altyapı - inşa ederek yardım etmeliyiz, böylece malzemeler Japon yağmasından güvenli bir şekilde karadan onlara ulaşabilir."
 uk_canada_focus:0 "Kanada'da Gelişim"
 uk_canada_focus_desc:0 "Kanada Sanayisine ve Tersanelerine yapılacak bir yatırım, ekonomilerine bir destek sağlayacak ve savaş durumunda daha büyük bir katkı sağlamalarına olanak tanıyacaktır."
 uk_carrier_focus:0 "Uçak Gemisi Odağı"
 uk_carrier_focus_desc:0 "Deniz teorisyenleri arasında zırhlının devam eden uygulanabilirliği hakkında yoğun bir tartışma var. Modern hava gücünün deniz gücüne hakim olacağını ve uçak gemisinin okyanusların kralı olarak zırhlının yerini alacağını savunanlar var."
 uk_china_focus:0 "Çin'i Etkile"
 uk_china_focus_desc:0 "Çinli milliyetçiler kendilerini sömürge çabalarımızın düşmanları olarak adlandırmış olsalar da, çok az müttefiki olan düşmanlar arasında sıkışıp kalmışlardır. Onlara ulaşırsak, politikalarını değiştirmeye istekli olabilirler."
 uk_colonial_focus:0 "Sömürge Elitini Teşvik Et"
 uk_colonial_focus_desc:0 "Geniş, yayılan imparatorluğumuz dünyanın en büyük beyinlerinden bazılarına ev sahipliği yapıyor, ancak büyüklüğü birçoğunun asla tanışmasını engelliyor. En önemli projelerimizde birlikte çalışmalarını teşvik ederek daha hızlı sonuçlar alabiliriz."
 uk_commonwealth_focus:0 "İngiliz Milletler Topluluğu Bağları"
 uk_commonwealth_focus_desc:0 "Taç'a ortak bağlılıkla birleşen İngiliz Milletler Topluluğu ulusları, başka bir küresel çatışma durumunda ilk güvenebileceğimiz uluslardır. Oradaki diplomatik yönetimimizi güvence altına almak hayati önem taşıyacaktır."
 uk_convoy_focus:0 "Konvoy Eskort Odağı"
 uk_convoy_focus_desc:0 "Ne kadar vurgulansa azdır, konvoylarımız can damarımızdır. Onları korumak ve kaybedilen tonajı hızla değiştirmek için elimizden gelen her şeyi yapmalıyız."
 uk_destroyer_focus:0 "Muhrip Odağı"
 uk_destroyer_focus_desc:0 "Modern zırhlılar harikalar yaratıyor, ancak konvoylarımızın korunmasında mütevazı muhripin kritik rolünü ihmal etmemeliyiz."
 uk_embargo_focus:0 "Ambargo Politikası"
 uk_embargo_focus_desc:0 "Diktatörleri - ister kırmızı ister kahverengi olsun - yenmenin en iyi yolu, savaş açmak için ihtiyaç duydukları kaynaklardan onları mahrum bırakmaktır. Sorun sadece onlarla iş yapan bankacıları ve şirketleri sindirmektir..."
 uk_empire_focus:0 "İmparatorluğu Güçlendir"
 uk_empire_focus_desc:0 "İmparatorluğumuz geniştir ve gücümüze rağmen zayıf bir şekilde savunulmaktadır. Bununla mücadele etmek için krallık genelinde İmparatorluk Vatanseverliğini teşvik etmeliyiz."
 uk_free_india_focus:0 "Hindistan Bağımsızlığı"
 uk_free_india_focus_desc:0 "Japonya aktif olarak Hindistan'da isyanı körüklüyor ve hatta Hintli askerlerden oluşan bir 'Ulusal Hint Ordusu' kurdu. Bunu önlemek için hiçbir şey yapılmazsa durum tehlikeli hale gelebilir. Ya Japonya'yı hızla yenebiliriz ya da Hintlilere birkaç yıl içinde bağımsızlık sözü verebiliriz."
 uk_greece_focus:0 "Yunanistan'ı Zorla"
 uk_greece_focus_desc:0 "Yunanistan'da üs hakkına sahip olmak bizim çıkarımızadır ve açıkçası Yunanlılar bizi reddedecek durumda değiller."
 uk_india_focus:0 "Raj'ı Geliştir"
 uk_india_focus_desc:0 "Hindistan'daki sömürgelerimizin durumu hem yurtdışında hem de yurtiçinde tartışmalı olmaya devam ediyor, ancak onlar için ne olursa olsun, endüstriyel kapasitelerini güçlendirmek şu aşamada bir önceliktir."
 uk_iran_focus:0 "İran'ı Güvence Altına Al"
 uk_iran_focus_desc:0 "İran sadece düşmanlarımıza verilmemesi gereken petrolden zengin değil; aynı zamanda Hindistan, Orta Doğu ve Sovyetler Birliği arasındaki stratejik bağlantı noktasıdır."
 uk_iraq_focus:0 "Irak'ı Güvence Altına Al"
 uk_iraq_focus_desc:0 "1932'de Irak'a bağımsızlık verdik, ancak mevcut küresel durum göz önüne alındığında, bu bir hata olmuş olabilir. Irak petrolünün düşmanlarımıza ulaşmasına asla izin verilmemelidir..."
 uk_jet_focus:0 "Jet Uçağı"
 uk_jet_focus_desc:0 "Jet motorunun uçaklarda pervaneli motorların yerini alacağı neredeyse kesin görünüyor. Potansiyel çok büyük ve İngiltere'nin bu önemli araştırma alanında geride kalmasına izin vermemeliyiz."
 uk_malta_focus:0 "Malta'yı Güçlendir"
 uk_malta_focus_desc:0 "Malta, orta Akdeniz'de mükemmel bir konuma, Mısır ve Süveyş Kanalı üzerinden Hindistan'a ve Uzak Doğu'ya uzanan can damarımız boyunca hayati bir ara istasyona sahiptir. Daha güçlü bir şekilde tahkim etmek için harcanan zaman asla boşa gitmez."
 uk_mediterranean_focus:0 "Akdeniz Kalesi"
 uk_mediterranean_focus_desc:0 "Akdeniz üzerinden geçen rota, Hindistan'a ve Hindistan'dan hayati derecede önemli bir kestirme yoldur. Bu nedenle, açık ve elimizde tutulması son derece önemlidir."
 uk_new_zealand_focus:0 "Yeni Zelanda'yı Geliştir"
 uk_new_zealand_focus_desc:0 "Yeni Zelanda ulusumuzla güçlü bir bağını sürdürüyor ve faşist tehdide karşı uyardı. Savaş durumunda katkıları kesindir ve buna göre hazırlanmalarına yardımcı olmalıyız."
 uk_protect_suez:0 "Süveyş'i Koru"
 uk_protect_suez_desc:0 "Süveyş kanalını kontrol etmek, İngiliz İmparatorluğu'nun deniz hakimiyetini sürdürme araçlarının bir parçasıdır. Bu bölgeyi kaybetmek felaket olurdu. Güçlendirmek için önlemler alınmalıdır."
 uk_rock_focus:0 "Kayayı Güçlendir"
 uk_rock_focus_desc:0 "Akdeniz'in girişini kontrol etmenin yanı sıra, Cebelitarık hem Atlantik'te hem de Akdeniz'de gemilerin faaliyet gösterebileceği güçlü bir şekilde savunulan bir liman sağlar. Bu nedenle, güçlü bir şekilde korunması zorunludur."
 uk_sanction_italy_focus:0 "İtalya'ya Yaptırım Uygula"
 uk_sanction_italy_focus_desc:0 "Mussolini yeni bir Roma İmparatorluğu hayal ediyor ve kulağa ne kadar saçma gelse de, bir gün hayalini gerçekleştirmek için bize saldırabilir. Savaşa gelmeden önce bunu önlemek için elimizden geleni yapmalıyız."
 uk_sanction_japan_focus:0 "Japonya'ya Yaptırım Uygula"
 uk_sanction_japan_focus_desc:0 "Japonlar 'Büyük Doğu Asya Ortak Refah Alanı'nı yaratmaya kararlı görünüyorlar; elbette kendi hegemonyaları altında. İngiliz İmparatorluğu, diğer Batı güçlerinin sömürgeleriyle birlikte birincil engeldir. İhtiyaç duydukları kaynaklara erişimleri engellenmelidir."
 uk_scandinavian_focus:0 "İskandinav Müdahalesi"
 uk_scandinavian_focus_desc:0 "İsveç demir ihracatı olmasaydı İskandinavya'nın pek stratejik önemi olmazdı. Bu hayati kaynağın Almanya'ya ulaşmasını önlemek için hem İsveç'e hem de Norveç'e baskı yapmalıyız. Reddederseler, işgal etmeye hazır olmamız gerekebilir..."
 uk_service_focus:0 "Denizaşırı Hizmet"
 uk_service_focus_desc:0 "Silahlı kuvvetler personelini sömürge istasyonlarına ve tekrar eve döndürerek farklı cephelerdeki koşulları öğrenebilir, deneyim kazanabilir ve bunu evdeki yoldaşlarıyla paylaşabilirler."
 uk_small_arms_focus:0 "BSA Şirketi"
 uk_small_arms_focus_desc:0 "[Root.GetBSACompanyDesc]"
 uk_south_africa_focus:0 "Güney Afrika'yı Geliştir"
 uk_south_africa_focus_desc:0 "Güney Afrika'daki siyasi durum belirsiz. Savaş çabalarımızı destekleyeceklerine tam olarak güvenemeyiz, ancak sanayilerini güçlendirmelerine yardımcı olarak İngiliz davasına desteği artırmayı umabiliriz."
 uk_spain_focus:0 "İspanya'yı Zorla"
 uk_spain_focus_desc:0 "İspanyollar Kraliyet Donanması'nın gücünü çoğundan daha iyi bilirler, ama belki bir hatırlatma yerindedir..."
 uk_turkey_focus:0 "Türkiye'yi Zorla"
 uk_turkey_focus_desc:0 "Bizi sevmek zorunda değiller, ama Coni Türk zırhlılarımızdan korkacak kadar bilmeli..."
 uk_waves_focus:0 "Britanya Dalgalara Hükmeder"
 uk_waves_focus_desc:0 "[Root.GetBritanniaRulesTheWavesDesc]"
 unlocks_decision:0 "Kararın Kilidini Açar: "
 upgrades_design_company:0 "§YTasarım Şirketini§! §GYükseltir§!"
 usa_focus:0 "ABD Milli Hedefi"
 volunteer_corps:0 "Gönüllü Birlikler"
 volunteer_corps_desc:0 "Halkımızı özgürlük idealleri uğruna ölmeye zorlamak bir ironi egzersizi olurdu, ancak yurtdışındaki insanlara yardım etmek isteyenler için araçlar oluşturmak değildir."
 warrior_traditions_focus:0 "Savaşçı Gelenekleri"
 warrior_traditions_focus_desc:0 "Tarih boyunca Japonya, savaşçı sınıfı arasında benzersiz bir dizi gelenek sürdürmüştür. Bu değerler, rütbesi ne olursa olsun her asker tarafından yeniden canlandırılmalı ve değer verilmelidir."
 why_we_fight:0 "Neden Savaşıyoruz"
 why_we_fight_desc:0 "Dünya giderek daha güvensiz hale geliyor. Halkımız, güç peşinde koşanların işlediği vahşetleri görmeli. Halkı davamıza toplama ve herkesin özgürlüğümüz için savaşmaya hazır olmasını sağlama zamanı geldi."
 why_we_fight_effect:0 "§YTarafsız Dış Politika§! ruhumuz yoksa, gruplar oluşturabileceğiz.\n"
