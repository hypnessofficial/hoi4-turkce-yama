 air_base_expansion_focus:0 "Hava Üssü Genişletmesi"
 air_base_expansion_focus_desc:0 "Ordumuzu daha iyi desteklemek için Hava kuvvetlerinin daha büyük Hava üslerine ihtiyacı var."
 air_bonus:0 "Hava modelleri bonusu"
 air_defense_focus:0 "Hava Savunması"
 air_defense_focus_bypass_tt:0 "§YHava Savunması§! için yeterli inşaat alanı yok!"
 air_defense_focus_desc:0 "Düşmanın nereden geleceği konusunda hiçbir soru yok; kıyıyı kapsamlı uçaksavar bataryalarıyla korumalıyız."
 air_defense_focus_tt:0 "§YDoğu Anglia§!, §YSussex§! ve §YGüney-Batı İngiltere§!'ye maksimum §YHava Savunması§! ekle!"
 air_doc_bonus:0 "Hava doktrini bonusu"
 air_focus_bypass_tt:0 "§YHava Üssü§! için yeterli inşaat alanı yok!"
 air_innovation:0 "Hava Yenilikleri"
 air_innovation_2:0 "Hava Yenilikleri II"
 air_innovation_2_desc:0 "Gökyüzünde kazanabileceğimiz her avantaj değerlidir. Tüm çabalarımızı avcı uçaklarımızı geliştirmeye odaklamalıyız."
 air_innovation_desc:0 "Modern savaşlar göklere hakim olmadan kazanılamaz. Hava kuvvetlerini geliştirmek için elimizden gelen her şeyi yapmalıyız!"
 air_rearmament_focus:0 "Hava Yeniden Silahlanması"
 air_rearmament_focus_desc:0 "[Root.GetAirRearmamentDesc]"
 air_sup_bonus:0 "Hava Üstünlüğü doktrinleri bonusu"
 aircraft_production_focus:0 "Uçak Üretim Grubu"
 aircraft_production_focus_desc:0 "Uçak üretimi en yüksek önceliğimiz olmaya devam ediyor. Londra Uçak Üretim Grubu (LAPG), mevcut tüm uçakla ilgili üretimi yönetmek ve koordine etmek için oluşturulmalıdır."
 anschluss_mefo_bills_double_reduction:0 "§YMEFO Senetleri§!'ni günlük siyasi güç kazancını §G+0.10§! oranında değiştir\n"
 apply_integration_effects_retroactively:0 "\nBu, daha önce bu kararın alındığı tüm eyaletlere §Hgeriye dönük olarak§! uygulanacaktır."
 armor_bonus:0 "Zırh modelleri bonusu"
 armor_effort:0 "Zırh Çabası"
 armor_effort_desc:0 "Piyademizi motorize etmekten öğrendiklerimizi uygulayarak, zırhlı araçlarımızı da geliştirebiliriz."
 armor_innovations_focus:0 "Zırh İnovasyonu"
 armor_innovations_focus_desc:0 "Ordumuz yükselişteyken, bazı Generaller bir dizi modern zırhlı araca yatırım yapmamızı önerdi."
 army_air_innovations_focus:0 "Ordu Hava İnovasyonu"
 army_air_innovations_focus_desc:0 "Hava kuvvetlerinin birincil görevi, övülen Ordumuzu desteklemek olmalıdır!"
 army_effort:0 "Ordu Çabası"
 army_effort_desc:0 "Hava ve deniz savaşlarının artan olanaklarına rağmen, kara muharebesi yarının savaşlarında hala kilit rol oynamaktadır. Hazırlıkla, siperlerin cehennemini yeniden yaşamaktan kaçınabiliriz."
 army_innovations_focus:0 "Ordu İnovasyonu"
 army_innovations_focus_desc:0 "Ordu artık İmparatorluğun tanınmış birinci sınıf hizmeti olduğuna göre, Kara Doktrinleri çalışmasına daha fazla kaynak ayırmamız gerekiyor."
 army_motorization_focus:0 "Ordu Motorizasyonu"
 army_motorization_focus_desc:0 "Motorizasyona daha fazla odaklanmak, en azından iyi yolları olan bölgelerde Piyadelerin savaş alanına ulaşma hızını artıracaktır."
 army_primancy_focus:0 "Ordu Önceliği"
 army_primancy_focus_desc:0 "İki ana hizmet kolundan, İmparatorluğun güçlü sağ kolu gerçekten de Ordu'dur! Araziyi ele geçirme ve tutma yeteneği, Donanma'nın sağlayabileceği küçük hizmetlerden çok daha ağır basar. Bu basit, apaçık gerçeği kabul ederek ve Ordu'ya daha fazla kaynak ayırarak olasılıklar sınırsızdır."
 arty_bonus:0 "Topçu teknolojileri bonusu"
 atlantikwall_tooltip:0 "Aşağıdaki Atlantik kıyı eyaletlerinin her birine §YKıyı Kaleleri§! yerleştirin, bunların tamamı sizin tarafınızdan kontrol ediliyor:\n"
