l_english:
 1939_bookmark_threat:0 "Son Faşist yayılmacılık"
 AST_CSIR:0 "CSIR"
 AST_CSIR_desc:0 "İngiliz Milletler Topluluğu Bilimsel ve Endüstriyel Araştırma Örgütü, Avustralya'da bilim ve üretimin verimliliğini artırmak için hükümet araştırma kolumuzdur. Desteğimizi artırarak, savaşın sinirlerine daha fazla enerji vereceğiz."
 AST_a_deal_with_japan:0 "Japonya ile Anlaşma"
 AST_a_deal_with_japan_desc:0 "Güney Batı Pasifik yörüngemizdeyken, Japonya İmparatorluğu ile bir yakınlaşma sağlayabiliriz. Kuzey Batı'da kalır ve bizim alanımızı bize bırakırsa, savaşmamız için hiçbir neden kalmayacaktır."
 AST_abandon_the_westminster_system:0 "Westminster Sistemini Terk Et"
 AST_abandon_the_westminster_system_desc:0 "Westminster Parlamentosu Büyük Britanya'dan mirasımız olsa da, modern çağda kullanışlılığını yitirmiştir. Kabine anlaşmazlıkları ve parti rekabetleri, son ekonomik kriz boyunca Avustralya'yı istikrara kavuşturmaya pek yardımcı olmadı."
 AST_additional_militia_training:0 "Ek Milis Eğitimi"
 AST_additional_militia_training_desc:0 "Milislerimizin çoğu hizmete uygun değil - ya hasta ya da yetersiz donanımlı. Tehlikeli bir dünyada bu ihmali gidermek için adımlar atıyoruz."
 AST_adopt_westminster:0 "Westminster'ı Benimse"
 AST_adopt_westminster_desc:0 "Birleşik Krallık'tan miras aldığımız Westminster sistemini benimsiyoruz."
 AST_airborne_defence:0 "Hava İndirme Savunması"
 AST_airborne_defence_desc:0 "Avustralya üzerindeki gökleri, önleyiciler ve uçaksavarlar da dahil olmak üzere hava savunmasına yatırım yaparak korumalıyız."
 AST_allied_works_council:0 "Müttefik İşler Konseyi"
 AST_allied_works_council_desc:0 "Avustralya'daki tüm askeri inşaatlar Müttefik İşler Konseyi tarafından denetlenecektir. Bu merkezi planlama, hükümetin ihtiyaç duyduğu üretkenlik türünü elde etmesini sağlayacaktır."
 AST_army_inventions_directorate:0 "Ordu Buluşları Müdürlüğü"
 AST_army_inventions_directorate_desc:0 "Savaşlar yeniliği ve yaratıcılığı teşvik eder ve hükümetin iyi fikirleri kötülerden ayırmanın bir yoluna ihtiyacı vardır. Yeni bir özel patent ofisi, hükümete yapılan birçok başvurudan hangisinin herhangi bir değeri olduğunu belirlemeye adanacaktır."
 AST_australian_arms_production:0 "Avustralya Silah Üretimi"
 AST_australian_arms_production_desc:0 "Uzun konvoy süreleri, Avustralya'nın kendi silahlarını üretme konusunda diğer Dominyonlardan daha büyük bir sorumluluk alması gerektiği anlamına geliyor. Fabrikalarımız ve bilgi birikimimiz var."
 AST_australian_army_catering_corps:0 "Avustralya Ordu İkram Birliği"
 AST_australian_army_catering_corps_desc:0 "Avustralya ordusu, yiyeceklerinin kalitesi nedeniyle, büyük ölçüde aşçılarının kalitesi nedeniyle kötü hizmet alıyor. Bu süreci yeniden düzenleyerek morali ve etkinliği artırabiliriz."
 AST_australian_womens_army_service:0 "Avustralya Kadın Ordu Servisi"
 AST_australian_womens_army_service_desc:0 "Her erkek cephede gereklidir, bu nedenle sürüş, sinyal ve bakım işleri binlerce Avustralyalı kadın tarafından üstlenilecektir."
 AST_cac_boomerang:0 "CAC Bumerang"
 AST_cac_boomerang_desc:0 "Bumerang, Avustralya'nın avcı uçağı tasarımına katkısı ve ithal uçak kaybına karşı bir sigorta poliçesi olacaktır. Japon ve Amerikan uçaklarıyla rekabet etmeliyiz."
 AST_cac_woomera:0 "CAC Woomera"
 AST_cac_woomera_desc:0 "Avustralya kendi bombardıman kolunu geliştirecektir. Woomera sadece hafif bir araçtır, ancak anavatanımızı korumak ve hafif muharebe hava desteği için yeterli olacaktır."
 AST_central_bureau:0 "Merkez Büroyu Koordine Et"
 AST_central_bureau_desc:0 "ABD ile koordine edilen bir Sinyal ve İstihbarat bürosu, yaklaşan fırtınada bize stratejik bir avantaj vaat ediyor. Bu alandaki uzmanlığımız kabul edilmelidir."
 AST_citizen_military_forces:0 "Vatandaş Askeri Kuvvetleri"
 AST_citizen_military_forces_desc:0 "Savaş durumunda hazırlığımızı artırmak için bir yedek ordu hazırlama zamanı geldi. Mevcut milisleri anavatan savunması için orduya alacak ve ardından gerekirse denizaşırı hizmet için hazırlayacağız."
 AST_civil_construction_corps:0 "Sivil İnşaat Birliği"
 AST_civil_construction_corps_desc:0 "Havaalanları, ulaşım, kaleler ve diğer önemli askeri altyapıların inşasına yardımcı olmak için Sivil İnşaat Birliği'nde hizmet etmek üzere sağlıklı erkekleri askere alacağız."
 AST_classify_aliens:0 "Yabancıları Sınıflandır"
 AST_classify_aliens_desc:0 "Avustralya bir göçmen ülkesidir ve bu nedenle, anavatanlarına sadakati olan bazılarını almış olabilir. Yabancı doğumlu Avustralyalıları kaydedecek ve takip edeceğiz."
 AST_cockatoo_island_shipyards:0 "Cockatoo Adası Tersaneleri"
 AST_cockatoo_island_shipyards_desc:0 "Cockatoo Adası Tersanelerinin genişletilmesi ve iyileştirilmesi hükümetimiz için önemli bir önceliktir. Sidney Limanı, insan gücüne ve kaynaklara en iyi erişime sahiptir ve deniz inşaat çabalarımızı oraya odaklamalıyız."
 AST_commitment_to_the_cause:0 "Davaya Bağlılık"
 AST_commitment_to_the_cause_desc:0 "Yabancı bir kralın zincirlerini atma ve Emperyalist savaş çığırtkanlığının tüm Avustralya'yı riske attığı bir İşçi Cenneti inşa etme zamanı geldi."
 AST_commonwealth_aircraft_corporation:0 "İngiliz Milletler Topluluğu Uçak Şirketi"
 AST_commonwealth_aircraft_corporation_desc:0 "İngiliz Milletler Topluluğu Uçak Şirketi, Avustralya'daki uçak ve uçak motorlarının birincil üreticisidir. Kanıtlanmış bir geçmişe sahiptir ve ona destek, pilotlarımıza ihtiyaç duydukları malzemeleri sağlayacaktır."
 AST_cruisers:0 "Kruvazörler"
 AST_cruisers_desc:0 "Zırhlıları ve uçak gemilerini büyük köpeklere bırakabiliriz, çünkü bir yığın kruvazör büyüklüğünde gemi ihtiyaçlarımızı fazlasıyla karşılayacaktır."
 AST_daimler_dingo:0 "Daimler Dingo"
 AST_daimler_dingo_desc:0 "Bu İngiliz yapımı zırhlı araç, savaş alanındaki hareket kabiliyetimizi artıracaktır. Ve sonuçta, ulusal köpeğimizin adını taşıyor."
 AST_deal_with_japan_tt:0 "§YMalaya§!'nın egemenliğini bir ittifak karşılığında Japonya'ya devretmeyi önereceğiz. Bu mümkün olmazsa, bunun yerine §YKalimantan§!, §YSulawesi§! ve §YMoluk Adaları§! eyaletlerini Japonya'ya devretmeyi önereceğiz.\n"
 AST_death_from_down_under:0 "Aşağıdan Gelen Ölüm"
 AST_death_from_down_under_desc:0 "Hava gücünü daha iyi anlayarak ve uçaksavar silahlarının kaba kuvvetiyle hava savunma sistemimizi yükselttikten sonra hiçbir bombardıman uçağı limanlarımıza ve şehirlerimize zarar veremeyecektir."
 AST_delegation_to_china:0 "Çin'e Heyet"
 AST_delegation_to_china_desc:0 "Uzun süredir İmparatorluk açgözlülüğüyle parçalanmış olan Çin halkının bir dosta ihtiyacı var. Ve Faşizme karşı bölgesel bir müttefike ihtiyacımız var. Çin hükümetiyle bu resmi görüşme bizi daha da yakınlaştıracaktır."
 AST_demand_new_zealand:0 "Yeni Zelanda'yı Talep Et"
 AST_demand_new_zealand_desc:0 "Kiviler uzun zamandır en yakın müttefiklerimiz ve dostlarımızdı. Aynı sahillerde savaştık ve aynı yararsız İmparatorluk savaşlarında öldük. İki ülkemizi tek bir bayrak altında birleştirme zamanı geldi."
 AST_department_of_supply_and_development:0 "Tedarik ve Geliştirme Bakanlığı"
 AST_department_of_supply_and_development_desc:0 "Savaş zamanında, lojistik ve tedarik konularını - mühimmat, yakıt tedariki ve bir orduyu hareket halinde tutmak için gerekli her şeyi - ele almak için özel bir departmana ihtiyacımız var."
 AST_direct_support:0 "Doğrudan Destek"
 AST_direct_support_desc:0 "Silah başına, Yoldaşlar! Faşizme karşı savaşta acı çeken Çinli kardeşlerimizin çağrısını duyun! Kaydolun ve tüm işçilerin küresel mücadelesine katılın!"
 AST_dominate_the_skies:0 "Gökleri Domine Et"
 AST_dominate_the_skies_desc:0 "Avustralya birçok düşman hava üssünden uzaktadır, bu nedenle küremizin köşesinde tam hava üstünlüğüne sahip olmak hedefimiz olmalıdır."
 AST_empire_air_training_scheme:0 "İmparatorluk Hava Eğitim Programı"
 AST_empire_air_training_scheme_desc:0 "Avustralya'nın uygun bir hava eğitim programına taahhüt etme zamanı geldi. Birleşik Krallık'ın teşviki ve desteğiyle, tüm Dominyonlar savaş çabaları için pilot ve destek ekibi katkısında bulunmak üzere birlikte çalışacaktır."
 AST_empower_the_workers:0 "İşçileri Güçlendir"
 AST_empower_the_workers_desc:0 "Mahkumlar, çiftçiler ve liman işçilerinden oluşan bir ulus. İşte Avustralya bu. Avustralya işçilerine ve proletaryasına ses ve güç verme zamanı geldi. Yaşasın Devrim."
 AST_establish_advisory_war_council:0 "Danışma Savaş Konseyi Kur"
 AST_establish_advisory_war_council_desc:0 "Avustralya politikacıları ideolojik ve partizan anlaşmazlıkları bir kenara bırakmalı ve savaşın yürütülmesi konusunda danışmak ve tavsiyede bulunmak için bir araya gelmelidir."
 AST_expand_lithgow_small_arms_factory:0 "Lithgow Hafif Silah Fabrikasını Genişlet"
 AST_expand_lithgow_small_arms_factory_desc:0 "Vickers ve Brenlerimiz Lithgow Hafif Silah Fabrikası'ndan geliyor. Büyüdükçe, savaş kapasitemizi artırmayı daha kolay bulacağız."
 AST_expand_northern_presence:0 "Kuzey Varlığını Genişlet"
 AST_expand_northern_presence_desc:0 "Şehirlerimiz çoğunlukla adanın doğu ve batı kıyılarında olduğundan, Avustralya'nın kuzey sınırı işgal veya saldırı durumunda uygun savunma veya hazırlıktan yoksundur. O bölgedeki yeni askeri yapılar memnuniyetle karşılanacaktır."
 AST_expand_the_northern_railway:0 "Kuzey Demiryolunu Genişlet"
 AST_expand_the_northern_railway_desc:0 "Güneyde Adelaide'den kuzeyde Alice Springs'e kadar uzanan bir demiryolumuz var. Şimdi bu kuzey noktasını bölgedeki diğer şehirlere uzatmalı ve tüm Avustralya'yı birbirine bağlamalıyız."
 AST_expand_the_raaf:0 "RAAF'ı Genişlet"
 AST_expand_the_raaf_desc:0 "Hava kuvvetlerimizin büyümesi gerekiyor, bu yüzden daha fazla üs, daha fazla eğitim ve daha fazla üretime yatırım yapıyoruz."
 AST_fight_work_or_perish:0 "Savaş, Çalış ya da Yok Ol"
 AST_fight_work_or_perish_desc:0 "Düşmanımız Dominyon için varoluşsal bir tehdit oluşturduğundan, Avustralyalılar bir seçim yapmalıdır. Savaşacaklar, çalışacaklar ya da yok olacaklar."
 AST_fly_the_jolly_roger:0 "Korsan Bayrağını Uçur"
 AST_fly_the_jolly_roger_desc:0 "Ada kalemizden, kıyılarımızdan geçen düşman ticaretini ve tedarikini taciz etmek ve yok etmek için denizaltı sürüleri gönderebiliriz."
 AST_fund_australian_defense_research:0 "Avustralya Savunma Araştırmasını Finanse Et"
 AST_fund_australian_defense_research_desc:0 "Avustralya artık tamamen egemen bir ulus olduğuna göre, daha önce olduğu gibi gelişmiş prototiplere ve planlara erişimimiz yok. Düşmanlarımızın her zaman önünde kalmamızı ve teknolojide geride kalmamamızı sağlamalıyız."
 AST_fund_owen_gun_research:0 "Owen Silahı Araştırmasını Finanse Et"
 AST_fund_owen_gun_research_desc:0 "Evelyn Owen, orman savaşının zorlu baskılarına dayanabilen yeni bir hafif makineli tüfek geliştirdi. Bu silahın üretimine ve geliştirilmesine hükümet kaynaklarını ayırmalıyız."
 AST_hmas_assault:0 "HMAS Taarruz"
 AST_hmas_assault_desc:0 "Pasifik'teki savaş amfibi bir savaş olacağından, deniz piyadelerine bir sahili nasıl alacaklarını öğretmek için özel bir deniz üssünün inşası savaş çabaları için zorunludur."
 AST_homeland_defense_tt:0 "Muhtemel çıkarma bölgelerini ve limanları koruyan §Ysahil tahkimatları ve kara tahkimatları§! ile Anavatanı tahkim et."
 AST_indirect_support:0 "Dolaylı Destek"
 AST_indirect_support_desc:0 "Çin Halk Cumhuriyeti savaşta, ancak kendimizi açığa vuracak durumda değiliz. Küçük bir silah sevkiyatı ve ihtiyatlı bir teşvik şu anda riske atabileceğimiz tek şey."
 AST_industries_assistance_corporation:0 "Sanayi Yardım Kurumu"
 AST_industries_assistance_corporation_desc:0 "Son küresel ekonomik bozulma, Avustralya'da yatırımı ve girişimciliği caydırdı. Sanayi Yardım Kurumu, ekonomiyi yeniden canlandırmak için ülke çapında küçük işletmelere danışmanlık yapacak ve finansman sağlayacaktır."
 AST_introduce_unconventional_warfare:0 "Geleneksel Olmayan Savaşı Tanıt"
 AST_introduce_unconventional_warfare_desc:0 "Pasifik ormanları yeni bir tür savaş gerektirecektir. Yoğun bitki örtüsü arasında hızlı ve sessizce hareket etmeyi öğrenmeliyiz - düşmanlarımıza pusu kurmalı ve onlardan da aynısını beklemeliyiz."
 AST_invest_in_victory:0 "Zafere Yatırım Yap"
 AST_invest_in_victory_desc:0 "Nüfusumuza savaş tahvili satarak, tasarruflarını savaş çabalarına katkıda bulunabilirler."
 AST_japan_tech_sharing:0 "Japonya Teknoloji Paylaşımı"
 AST_japan_tech_sharing_desc:0 "Japon bilim adamları kendi araştırma enstitülerimizi geride bırakabildiler, ancak Yükselen Güneş İmparatorluğu ile yeni uyumumuz öğrenme ve paylaşım için yeni fırsatlar açıyor."
 AST_join_comintern:0 "Komintern'e Katıl"
 AST_join_comintern_desc:0 "Geleceğimiz Komünizmde, bu yüzden bu küresel mücadelede dünya çapındaki Yoldaşlarımıza katılmalıyız. Papa Joe bize yolu gösterecek ve Avustralya'dan ve her yerden işçileri şanlı bir yarına götürecektir."
 AST_kangaroo_point_shipyards:0 "Kangaroo Point Kuru Havuzu"
 AST_kangaroo_point_shipyards_desc:0 "Evans Deakin & Company, Kangaroo Point'te bir tersane ve önemli bir kuru havuz önermektedir. Böyle bir girişim, deniz gücü projeksiyon kapasitemizi artırmak için ideal olacaktır."
 AST_m_special_unit:0 "M Özel Birimi"
 AST_m_special_unit_desc:0 "M Özel Birimi, savaşta düşman düzenleri ve yerleşimleri hakkında anlık istihbarat göndererek ileri keşif ve keşif kolumuz olacaktır."
 AST_national_security_act:0 "Ulusal Güvenlik Yasası"
 AST_national_security_act_desc:0 "Artık savaşta olduğumuza göre, Federal hükümet Avustralya'yı korumak için daha büyük yetkiler üstlenecektir. Daha fazla basın sansürü, muhalif grupların bastırılması ve Dominyon'un savunması için vergi toplama ve mülke el koyma yeteneğinin artırılması."
 AST_naval_auxiliary_patrol:0 "Deniz Yardımcı Devriyesi"
 AST_naval_auxiliary_patrol_desc:0 "Büyük toprağımızın birçok limanı, gizli denizaltı saldırıları için davetkar hedeflerdir. Kıyı devriye gemilerinden oluşan bir yardımcı kuvvet, herhangi bir tehlikeye karşı bizi uyaracaktır."
 AST_naval_bombers:0 "Deniz Bombardıman Uçakları"
 AST_naval_bombers_desc:0 "Suyla çevriliyiz, bu yüzden düşman filolarını önlememizi ve saldırmamızı sağlayacak uçaklara ve eğitime bakmalıyız. Deniz bombardımanı özel bir beceridir ve bir odak noktası olmalıdır."
 AST_never_another_gallipoli:0 "Bir Daha Asla Gelibolu Olmasın"
 AST_never_another_gallipoli_desc:0 "Avustralya'nın duygu yoluyla daha fazla maliyetli savaşa sürüklenmemesini sağlamanın tek yolu, dış politikamızın tam kontrolünü ele almaktır. Uzak bir Kral'a ihtiyacımız yok ve bizi çıkarlarımıza hizmet etmeyen çatışmalara sürükleyen eski kan bağlarını karşılayamayız."
 AST_new_general_tt:0 " §YIven Mackay§! adında yeni bir §Y3 Beceri§! General ortaya çıkacak."
 AST_nz_puppet:0 "Yeni Zelanda Kuklası"
 AST_nz_puppet_desc:0 "Yeni Zelanda işçileri Avustralyalı kardeşleriyle birleşmelidir. Onları koruyabiliriz ve bizim yönlendirmemize boyun eğdikleri sürece nazik bir dostluk eli uzattık."
 AST_our_own_empire:0 "Kendi İmparatorluğumuz"
 AST_our_own_empire_desc:0 "Eski sömürgenin kendi ayakları üzerinde durma ve bir Avustralya imparatorluğu ilan etme zamanı geldi. Hayırseverliğimiz ve ileri görüşlü planlamamız bölgedeki herkesin iyiliği için olacaktır."
 AST_pacific_area_navy:0 "Pasifik Bölgesi Donanması"
 AST_pacific_area_navy_desc:0 "Majesteleri Avrupa'da hayatta kalmak için savaşsa da, acil önceliğimiz Pasifik'teki düşmanlarımızla savaşabilecek bir donanma olmalıdır. Bu hedefle uyumlu stratejiler geliştirmeliyiz."
 AST_preemptive_intervention:0 "Önleyici Müdahale"
 AST_preemptive_intervention_desc:0 "Japonya'nın son on yıldaki imparatorluk inşası, Pasifik'teki her özgür halk için bir tehdit oluşturmaktadır. Aç gözlerini bize çevirene kadar bekleyemeyiz. Eylem zamanı şimdi."
 AST_promote_reservists:0 "Yedekleri Terfi Ettir"
 AST_promote_reservists_desc:0 "Bir anavatan savunma gücüne ihtiyacımız olmasına rağmen, milisleri ve yedekleri düzenli orduya terfi ettirmek, mevcut askerlerde ve deneyimde bize gerekli bir destek sağlayacaktır."
 AST_protect_overseas_commerce:0 "Denizaşırı Ticareti Koru"
 AST_protect_overseas_commerce_desc:0 "Bir ada ülkesi, dalgaların ötesinden başkalarından getirebileceği malzemelere güvenir. Konvoy hatlarını ve ticaret yollarını savunmak sadece bir strateji değil, bir zorunluluktur."
 AST_protect_the_dutch_colonies:0 "Hollanda Sömürgelerini Koru"
 AST_protect_the_dutch_colonies_desc:0 "Hollanda, Endonezya sömürgelerinin zayıf ve uzak bir efendisidir. Onları Japonya, Çin veya diğer potansiyel düşman ulusların saldırılarına karşı savunamaz. Daha büyük iyilik için kontrolü üstlenmeliyiz."
 AST_protect_the_homeland:0 "Anavatanı Koru"
 AST_protect_the_homeland_desc:0 "Avustralya büyüktür, ancak kıyıları korunabilir. Kendi ulusumuzu güvende tutmak en yüksek önceliktir."
 AST_protect_the_south_west_pacific:0 "Güney Batı Pasifik'i Koru"
 AST_protect_the_south_west_pacific_desc:0 "Bölgesel gücümüzü kullanarak tüm Güney Batı Pasifik'i etki alanımıza dahil etme zamanı geldi. Mirasımızı yağmalamak isteyen yabancılardan halkı ve kaynakları ancak biz koruyabiliriz."
 AST_rationing_and_recycling:0 "Karne ve Geri Dönüşüm"
 AST_rationing_and_recycling_desc:0 "Her kaynak önemlidir. Vatandaşlarımız için yiyecekleri karneye bağlayacak, yıpranmış mallardan alabildiğimiz kadar metal elde etmek için geri dönüştürecek ve ülke çapında tasarrufu teşvik edeceğiz."
 AST_rats_of_tobruk:0 "Tobruk Sıçanları"
 AST_rats_of_tobruk_desc:0 "Cesur askerlerimiz çöl savaşında ve savaş alanından malzeme toplamada usta olduklarını kanıtladılar. Düşmanı taciz ediyor, üslerinden saldırıyor ve karşı saldırıdan önce geri çekiliyorlar."
 AST_rats_of_tobruk_effect_1:0 "Tobruk'ta elit birim kazan"
 AST_rats_of_tobruk_effect_2:0 "Sidney'de elit birim kazan"
 AST_research_city_excursions:0 "Araştırma Şehri Gezileri"
 AST_research_city_excursions_desc:0 "Sovyetler Birliği toprakları boyunca araştırma şehirleri ve laboratuvarlar inşa etti ve Avustralyalı araştırmacıları Komünist bilimin ihtişamını öğrenmeye davet etti."
 AST_research_collaboration:0 "Araştırma İşbirliği"
 AST_research_collaboration_desc:0 "İngilizler bize yakın müttefikler arasında bilimsel ilerlemeyi paylaşmanın avantajını gösterdi. Bunu koordine etmek için gerekli adımları atarsak, tüm fraksiyonumuz savaş zamanı Ar-Ge'yi daha verimli bir şekilde yürütebilecektir."
 AST_research_cooperation:0 "Araştırma İşbirliği"
 AST_research_cooperation_desc:0 "Avustralyalılar zeki ve becerikli bir halktır, ancak ciddi bir bilimsel program için altyapımız veya nüfusumuz yok. Müttefiklerimizle birlikte çalışacak, karşılıklı fayda için bilgi ve atılımları paylaşacağız."
 AST_royal_australian_artillery:0 "Kraliyet Avustralya Topçusu"
 AST_royal_australian_artillery_desc:0 "Topçu savaş alanının kraliçesidir ve ağır silahlara erişimimizi genişletmeliyiz."
 AST_royal_australian_submarine_service:0 "Kraliyet Avustralya Denizaltı Servisi"
 AST_royal_australian_submarine_service_desc:0 "Denizaltılar geleceğin deniz silahıdır ve müttefiklerimizin kuvvetlerinin önemli bir bileşenidir. Bu savaş tarzını benimsemeliyiz."
 AST_scrap_iron_flotilla:0 "Hurda Demir Filotillası"
 AST_scrap_iron_flotilla_desc:0 "Filomuzu yükseltene kadar, sahip olduğumuz eski gemilerle idare edeceğiz. Düşmanımız eski muhriplerimizi Hurda Demir Filotillası olarak adlandırabilir, ancak bizi gururlandıracaktır."
 AST_sentinel_tank_project:0 "Sentinel Tank Projesi"
 AST_sentinel_tank_project_desc:0 "Avustralya kendi yerli zırhlı aracını geliştirmelidir. Alman ve Amerikan fikirlerine dayanan Sentinel programı ilerletilmelidir."
 AST_sever_ties_with_uk:0 "İngiltere ile Bağları Kopar"
 AST_sever_ties_with_uk_desc:0 "Birleşik Krallık'tan ayrılma zamanı geldi. Avustralya, Londra'dan müdahale olmadan kendi rotasını çizebilir ve kendi bölgesinde kendi kaderine bir hak iddia edebilir."
 AST_south_australian_housing_trust:0 "Güney Avustralya Konut Vakfı"
 AST_south_australian_housing_trust_desc:0 "Güney Avustralya daha fazla sanayi ve yatırıma ihtiyaç duyuyor, bu nedenle özellikle Adelaide çevresinde bir dizi planlı topluluk ve konut iyileştirmesine kaynak ayıracaktır."
 AST_specialize_equipment:0 "Teçhizatı Özelleştir"
 AST_specialize_equipment_desc:0 "Kullandığımız İngiliz yapımı teçhizatın tamamı benzersiz muharebe durumumuz için etkili değil. Özel ve ısmarlama araçlar gerekli hale geldi."
 AST_squash_the_squanderbugs:0 "İsraf Böceklerini Ez"
 AST_squash_the_squanderbugs_desc:0 "Enflasyondan etkilenen tüketim mallarına yapılan israflı harcamalar, savaş tahvillerinden ve savaş çabalarından para çalıyor. Ordumuz ihtiyaç içindeyken bu lüks iştahını caydırmalıyız."
 AST_standard_gauge_railway:0 "Standart Hat Demiryolu"
 AST_standard_gauge_railway_desc:0 "Onlarca yıldır Avustralya, ulaşım ve nakliye ihtiyaçlarımızı karmaşık hale getiren rakip demiryolu hatlarına sahipti. Nihayet ülke çapında demiryolu hatlarını standartlaştırma zamanı geldi."
 AST_strengthen_ties_with_uk:0 "İngiltere ile Bağları Güçlendir"
 AST_strengthen_ties_with_uk_desc:0 "Sadakatimiz Anavatan'adır. Onu takip ettiği yere gidecek ve düşmanlarıyla savaşmaya kararlı olacağız. Tanrı Kralı Korusun."
 AST_supply_indonesian_nationalists:0 "Endonezya Milliyetçilerini Tedarik Et"
 AST_supply_indonesian_nationalists_desc:0 "Endonezya halkını Hollandalı zalimlerine karşı mücadelelerinde desteklemeliyiz. Eğitime ve öğretime ihtiyaçları olacak, ancak sayısal üstünlükleriyle, bu adalet mücadelesindeki zafer kaçınılmazdır, bize olan minnetleri de öyle."
 AST_support_indonesian_uprising:0 "Endonezya Ayaklanmasını Destekle"
 AST_support_indonesian_uprising_desc:0 "Endonezyalılar Hollandalılara karşı silahlandıklarına göre, sözlerden daha fazlasına ihtiyaçları olacak. Ayaklanmanın silahlara ve diğer teçhizata, ayrıca tam teşekküllü diplomatik desteğe ihtiyacı var."
 AST_support_the_centre_party:0 "Merkez Partiyi Destekle"
 AST_support_the_centre_party_desc:0 "Yeni Güney Galler'de güçlü bir anti-Komünist hareket ortaya çıktı. Yeni Muhafız müttefiklerinin yardımıyla Merkez Parti, Avustralya'yı güçlendirmenin anahtarını elinde tutabilir."
 AST_support_the_policy_of_appeasement:0 "Yatıştırma Politikasını Destekle"
 AST_support_the_policy_of_appeasement_desc:0 "Son savaşın maliyetleri hala ulusal hafızada ağır bir şekilde hissediliyor. Dünyanın yarısındaki toprak tavizleri Avustralya'yı savaştan uzak tutabilirse, kesinlikle bu tavizleri düşünmeliyiz."
 AST_swpa_protector:0 "GBPA Koruyucusu"
 AST_swpa_protector_desc:0 "Avustralya, Güney Batı Pasifik Bölgesi'nin koruyucusu olarak birincil konumu üstlenmelidir. Çinhindi'nden Endonezya üzerinden Yeni Gine'ye kadar olan tüm deniz bölgesi bizim himayemizde olmalıdır."
 AST_swpi_research_tt:0 "ABD ile veya fraksiyonumuzun diğer üyeleriyle bir §Yteknoloji paylaşım anlaşması§! yapacağız."
 AST_the_singapore_strategy:0 "Singapur Stratejisi"
 AST_the_singapore_strategy_desc:0 "Singapur, güvende olmak için Londra'dan çok uzak. Avustralya, bu imparatorluk ileri karakolunu başkalarının saldırganlığından koruma görevini üstlenecektir."
 AST_the_south_west_pacific_initiative:0 "Güney Batı Pasifik Girişimi"
 AST_the_south_west_pacific_initiative_desc:0 "Güney Batı Pasifik Bölgesi'ni düşman güçlerden savunmaya odaklanan kendi ittifak ağımızı oluşturmak için güç tabanını ve güvenilirliği oluşturduk. Benzer düşünen güçleri arayacak ve Avustralya'yı küresel meselelerde önemli bir ses haline getireceğiz."
 AST_the_swpa_menace:0 "GBPA Tehdidi"
 AST_the_swpa_menace_desc:0 "Japonya, Avustralya'nın güvenliğini ve bölgedeki özgürlüğü tehdit eden bir imparatorluk inşa ediyor. Müttefiklerimiz olmak için benzer düşünen uluslara yönelmeliyiz."
 AST_the_threat_against_the_people:0 "Halka Karşı Tehdit"
 AST_the_threat_against_the_people_desc:0 "İmparatorluk Japonya'sının militarist ve Faşist gücü, tüm Avustralyalıların refahına bir tehdittir ve dünya işçilerinin barış içinde bir arada yaşamasını engeller. Avustralya, bu halk düşmanını geri püskürtecek ve onları kasvetli, kayalık adalarında kalmaya zorlayacaktır."
 AST_uranium_mining:0 "Uranyum Madenciliği"
 AST_uranium_mining_desc:0 "Son on yıllarda, Güney Avustralya'da, özellikle Mt Gee çevresinde büyük uranyum yatakları bulduk. Uranyum artık hayati bir askeri kaynaktır ve bu rezervlerin işletilmesi artırılmalıdır."
 AST_volunteer_air_observers_corps:0 "Gönüllü Hava Gözlemcileri Birliği"
 AST_volunteer_air_observers_corps_desc:0 "Gözlerinizi gökyüzünden ayırmayın! Avustralyalıları yaygın uçak siluetlerini öğrenmeye ve Dominyon'a yaklaşan şüpheli veya düşman uçaklarını hükümete bildirmeye çağırıyoruz."
 AST_volunteer_defence_corps:0 "Gönüllü Savunma Birliği"
 AST_volunteer_defence_corps_desc:0 "Yaşlı gazilerden ve düzenli orduda olmayan diğer vatandaşlardan bir Gönüllü Savunma Birliği toplandı. Ordunun düşmanlarına karşı doğrudan harekete geçmesini sağlamak için bir anavatan muhafızı olarak hizmet edeceklerdir."
 AST_war_on_japan:0 "Japonya'ya Savaş"
 AST_war_on_japan_desc:0 "Japonya'nın saldırganlığı çok uzun sürdü. Doğu Asya'yı tecavüz edip yağmaladı ve şimdi gözlerini daha güneydeki topraklara ve kaynaklara dikti. Kenara çekilemeyiz."
 AST_western_australian_government_railways:0 "Batı Avustralya Hükümet Demiryolları"
 AST_western_australian_government_railways_desc:0 "Batı Avustralya'daki devlete ait demiryollarına şu anda karayolu yapımından daha fazla öncelik verilmelidir. Coğrafya Batı'da treni destekliyor - bundan faydalanmalıyız."
 AST_womens_auxilliary_australian_air_force:0 "Kadın Yardımcı Avustralya Hava Kuvvetleri"
 AST_womens_auxilliary_australian_air_force_desc:0 "Nüfusumuzun tam yarısı evde oturmaktansa savaş çabalarında daha iyi kullanılır. Uçak bakımı, sinyal birliği ve diğer ilgili görevler kadınlara devredilecektir."
 AST_woo_usa:0 "ABD'yi Etkile"
 AST_woo_usa_desc:0 "Gerçek müttefikimiz, İngiliz köklerine sahip başka bir Pasifik gücü olan Amerika'dır. Bu zengin ve güçlü toprak, ihtiyaçlarımızı daha iyi anlayabilir, refahımızı artırabilir ve bizi saldırganlıktan koruyabilir."
 AST_workers_paradise:0 "İşçi Cenneti"
 AST_workers_paradise_desc:0 "Stalinist Komünist deneyi bir başarısızlıktır, ancak Sosyalizmin doğru yol olduğuna inanıyoruz. Avustralya, Moskova'dan yönergesiz, işçilerin takip edeceği ikinci bir yola çıkacaktır."
 AST_z_special_unit:0 "Z Özel Birimi"
 AST_z_special_unit_desc:0 "Z Özel Birimi, düşman hatlarının gerisinde keşif ve sabotaj konusunda uzmanlaşmış komando ekibimiz olacaktır. Bu, en ciddi eğitime istekli cesur adamlar gerektirecektir."
 BEL_luxembourg_war_goal:0 "Lüksemburg'un Entegrasyonu"
 BEL_luxembourg_war_goal_desc:0 "Lüksemburg, Belçika ile dil, kültür ve coğrafya gibi birçok şeyi paylaşıyor. Doğal olarak ikisi birleşmelidir!"
 CAN_1st_canadian_parachute_battalion:0 "1. Kanada Paraşüt Taburu"
 CAN_1st_canadian_parachute_battalion_desc:0 "Anavatan savunmasına odaklanmamızı tercih edenlerin direnişine rağmen, modern hava indirme savaşı düşmanlarımıza baskın yapmak için özel bir paraşüt taburuna ihtiyaç duyar."
 CAN_a_motorized_army:0 "Motorlu Bir Ordu"
 CAN_a_motorized_army_desc:0 "Kanada'nın kamyon ve motor üretimindeki deneyimi, motorlu silahlı kuvvetlerin araştırılması ve geliştirilmesinde bize bir avantaj sağladı."
 CAN_alberta_coal_towns:0 "Alberta Kömür Kasabaları"
 CAN_alberta_coal_towns_desc:0 "Kayalık Dağlar boyunca sömürülmeye hazır kömür yatakları var. Bu yeni maden yerlerine göçü teşvik edebilir ve batıda istihdamı artırabiliriz."
 CAN_aluminium_company_of_canada:0 "Kanada Alüminyum Şirketi"
 CAN_aluminium_company_of_canada_desc:0 "Alüminyum hafiftir ve paslanmazdır. Alüminyum madenciliğimizi ve üretimimizi genişleterek, fabrikalarımızın ve montaj hatlarımızın her zaman beslenmesini sağlayabiliriz."
 CAN_army_modernization:0 "Ordu Modernizasyonu"
 CAN_army_modernization_desc:0 "Yanıcı maddelerden uzak, yanmaz evimizde çok uzun süre güvende kalan Kanada, ordusunun eski teçhizat ve eğitimle idare etmesine izin verdi. Çok geç olmadan modernizasyona geçmeliyiz."
 CAN_bits_and_pieces_program:0 "Parça Parça Programı"
 CAN_bits_and_pieces_program_desc:0 "Parça Parça Programı, küçük tüketim mallarına adanmış bir dizi küçük fabrikayı savaş çabaları için seferber edecektir. Bir bisiklet fabrikası bir dizi yararlı savaş malı için kapasite bulabilir."
 CAN_burn_the_royal_portraits:0 "Kraliyet Portrelerini Yak"
 CAN_burn_the_royal_portraits_desc:0 "Artık hükümdar yok! Artık yabancı bir kuklanın ve yabancı bir parlamentonun yönetimine boyun eğmeyeceğiz. Kanada özgür ve eşit olacaktır. Halk yükselecek."
 CAN_camp_x:0 "Kamp X"
 CAN_camp_x_desc:0 "İstihbarat toplama ve casus eğitimi, Oshawa yakınlarındaki gizli bir yerde merkezileştirilecektir. Hem İngiltere'den hem de Amerika'dan gelen sinyaller için merkezi bir konuma sahiptir."
 CAN_canada_pacific_railway:0 "Kanada Pasifik Demiryolu"
 CAN_canada_pacific_railway_desc:0 "CPR, tüm kaynaklarını savaş çabalarına sundu. Binlerce ton malzeme ve materyal, büyük Dominyonumuzu denizden denize kesintisiz olarak geçecektir."
 CAN_canada_united:0 "Kanada Birleşti"
 CAN_canada_united_desc:0 "Nüfusumuz kıta boyunca ince bir çizgide yayılmış olsa da, bu dünya krizinde Kanada değerlerini savunmak ve zayıfları korumak için bir araya geldik."
 CAN_canada_wheat_board:0 "Kanada Buğday Kurulu"
 CAN_canada_wheat_board_desc:0 "Batılı çiftçilerimizin Buhran'daki yıkımı, buğday, arpa, yulaf ve diğer mahsullerin satışı için fiyatları belirlemek üzere Kanada Buğday Kurulu'nu canlandırır ve yeniden canlandırırsak ele alınabilir."
 CAN_canadian_citizenship_act:0 "Kanada Vatandaşlık Yasası"
 CAN_canadian_citizenship_act_desc:0 "Mevcut durumda, kimin Kanada vatandaşı olup olmadığı İngiliz yasalarına dayanmaktadır ve bir Kanada vatandaşı bir İngiliz Tebaa'sından farklı değildir. Kanada uyruklularının ve vatandaşlarının artık sadece İngiliz tebaa statüsünün alt sınıfları olarak görülmemesini sağlamalıyız."
 CAN_canadian_infantry_corps:0 "Kanada Piyade Kolordusu"
 CAN_canadian_infantry_corps_desc:0 "Artık bir kolordu seviyesinde bir oluşum kuracak kadar adamımız var. Kanada Piyade Kolordusu, son savaştan bu yana ilk kolordu büyüklüğündeki grubumuzdur."
 CAN_cmp_truck:0 "CMP Kamyonu"
 CAN_cmp_truck_desc:0 "Kanada fabrikaları düşman bombardımanından güvendedir ve bu nedenle savaş çabaları için ulaşım yapmaya yönlendirilebilir. CMP Kamyon tasarımımız çok yönlüdür ve birçok iklime uygundur."
 CAN_commit_to_the_war:0 "Savaşa Taahhüt Et"
 CAN_commit_to_the_war_desc:0 "Dünya yanıyor ve Kanada'nın oynayacağı bir rol var. Demokrasiyi ve İngiliz yaşam tarzını korumaya yemin ediyoruz."
 CAN_commonwealth_air_training_plan:0 "İngiliz Milletler Topluluğu Hava Eğitim Planı"
 CAN_commonwealth_air_training_plan_desc:0 "Hava muharebe eğitimi İngiliz Milletler Topluluğu ve Dominyon müttefiklerimizle koordine edilecektir. Bu daha verimlidir ve havaalanlarımızda toplu ve güvenli bir şekilde yapılabilir."
 CAN_communist_labor_total_war_committee:0 "Komünist Emek Topyekun Savaş Komitesi"
 CAN_communist_labor_total_war_committee_desc:0 "Kanadalı Komünistler de vatanseverdir! Faşizme karşı küresel savaşta, tüm ulusu savaş için seferber etmek üzere burjuva liberalleriyle birlikte çalışabiliriz."
 CAN_compromise_with_quebec:0 "Quebec ile Uzlaşma"
 CAN_compromise_with_quebec_desc:0 "Quebec ulusal askerliğe karşı çıkıyor. Bu sorun Büyük Savaş'ta ülkeyi neredeyse parçalıyordu ve kriz zamanında ulusal birliğimizi bozmayı göze alamayız. Belki Quebec sakinleri için savaş hizmeti konusunda bir anlaşma yapabiliriz."
 CAN_cookie_carriers:0 "Cookie Uçak Gemisi"
 CAN_cookie_carriers_desc:0 "Stratejik hava savaşı, düşmanlarımıza lezzetli ikramlar bırakmak için ağır bombardıman uçakları gerektirir."
 CAN_crown_corporations:0 "Taç Şirketleri"
 CAN_crown_corporations_desc:0 "Temel hizmetleri sağlamak ve ekonomik ve endüstriyel büyümeyi teşvik etmek için Kanada birçok yeni Taç Şirketi oluşturmalıdır. Özel teşebbüsün adım atmadığı yerde hükümet adım atmalıdır."
 CAN_defence_of_canada_regulations:0 "Kanada Savunma Yönetmelikleri"
 CAN_defence_of_canada_regulations_desc:0 "Savaş zamanlarında, savaş çabalarının baltalanmasını önlemek için sivil haklar kısıtlanmalıdır. Bu, basın, muhalif gruplar ve bazı yasal haklar üzerinde kısıtlamalar anlamına gelir."
 CAN_defence_scheme_no_1:0 "Savunma Planı No.1"
 CAN_defence_scheme_no_1_desc:0 "Savaş durumunda Amerika Birleşik Devletleri'ne karşı bir karşı saldırı için savaş arası planımız olan Savunma Planı No.1'in tozunu alma zamanı geldi."
 CAN_defence_scheme_no_2:0 "Savunma Planı No. 2"
 CAN_defence_scheme_no_2_desc:0 "Savunma Planı No. 2, Amerika Birleşik Devletleri ile Japonya İmparatorluğu arasında Pasifik'te bir savaş durumunda acil durum planımızdır. İdeal olarak, savaş durumunda tarafsız kalacağız, ancak koşullar ne olursa olsun, batı kıyımızda güçlü bir savunma kurulacaktır."
 CAN_defense_research_grants:0 "Savunma Araştırma Hibeleri"
 CAN_defense_research_grants_desc:0 "Kanada artık tamamen egemen bir ulus olduğuna göre, daha önce olduğu gibi gelişmiş prototiplere ve planlara erişimimiz yok. Düşmanlarımızın her zaman önünde kalmamızı ve teknolojide geride kalmamamızı sağlamalıyız."
 CAN_degauss_ship_hulls:0 "Gemi Gövdelerini Degauss Et"
 CAN_degauss_ship_hulls_desc:0 "Gemi gövdelerimizi degauss etmeye başlayacağız, manyetik imzalarını azaltacağız. Bu onları manyetik mayınlardan korur ve gemilerin elektronik profilini azaltır."
 CAN_demand_labrador_and_newfoundland:0 "Labrador ve Newfoundland'ı Talep Et"
 CAN_demand_labrador_and_newfoundland_desc:0 "Newfoundland, sömürge statüsüne geri dönmek zorunda kalan başarısız bir Dominyon'dur. Uygun yeri Kanada'dır."
 CAN_demand_labrador_tooltip:0 "§H[ENG.GetName]§!'in, umutsuz bir durumda olmadıkları sürece taleplerimizi kabul etmesi §Rçok düşük bir olasılıktır§!.\n\n"
 CAN_department_of_munitions_and_supply:0 "Mühimmat ve Tedarik Bakanlığı"
 CAN_department_of_munitions_and_supply_desc:0 "Kanada'nın ulusal kaynaklarının kontrolünü ve yönetimini Mühimmat ve Tedarik Bakanlığı'nda C.D. Howe'a devredeceğiz."
 CAN_destroyer_effort:0 "Muhrip Gayreti"
 CAN_destroyer_effort_desc:0 "Tedarik ve asker konvoylarına yönelik denizaltı saldırıları tehdidi, bu sualtı tehlikelerini avlamak ve öldürmek için muhrip yapımına odaklanmamızı gerektirir."
 CAN_dollar_a_year_men:0 "Yılda Bir Dolar Adamları"
 CAN_dollar_a_year_men_desc:0 "Kanada sanayisinin verimlilik sorunları var, ancak bir dizi zengin iş adamı sembolik bir meblağ karşılığında hizmetlerini ve tavsiyelerini sundu. Bu küçük danışman grubu bizi ileriye taşıyacaktır."
 CAN_dominion_rifle_association:0 "Kanada Dominyonu Tüfek Derneği"
 CAN_dominion_rifle_association_desc:0 "Kanada Dominyonu Tüfek Derneği 1868'de kuruldu ve 1900'de bir parlamento yasasıyla şirketleşti. Bu örgütün genişlemesini desteklemeliyiz, böylece daha fazla Kanadalı erkek ateşli silah kullanmayı öğrenebilir."
 CAN_escort_fleet:0 "Eskort Filosu"
 CAN_escort_fleet_desc:0 "Okyanuslar bizi dünyanın kargaşasının çoğundan ayırıyor, bu nedenle ordularımız savaşacak ve tedarik edilecekse, eskort oluşumlarına ve denizaltı karşıtı savaşa öncelik vermeliyiz."
 CAN_fleet_in_being:0 "Mevcut Filo"
 CAN_fleet_in_being_desc:0 "Büyük bir deniz gücü inşa ederek, onu asla konuşlandırmasak bile salt varlığı düşmanlarımız için bir tehdit olabilir. Gemilerimizin yola çıkıp deniz yollarına saldırması düşüncesi bile onları temkinli olmaya zorlar."
 CAN_forced_quebec_conscription:0 "Zorunlu Quebec Askerliği"
 CAN_forced_quebec_conscription_desc:0 "Tıpkı 1917'de olduğu gibi, Quebec'teki Fransız Kanadalı vatandaşlarımız orduya daha fazla adam getirmek için ulusal bir askere alma fikrine direniyorlar. Bir azınlığın Parlamento'nun iradesine meydan okumasına seyirci kalmayacağız."
 CAN_fund_fairchilds_development:0 "Fairchild'ın Gelişimini Finanse Et"
 CAN_fund_fairchilds_development_desc:0 "Quebec'teki Fairchild uçak fabrikasına bombardıman uçağı parçası üretimini artırmak için ihtiyaç duyduğu kaynaklar verilmelidir. Fabrikadaki istihdamı binlerce artırabilmeliyiz."
 CAN_fund_the_national_research_council:0 "Ulusal Araştırma Konseyi'ni Finanse Et"
 CAN_fund_the_national_research_council_desc:0 "Kanada'nın bilim ve ilerleme geçmişi vardır, ancak araştırmacılara olan ihtiyaç her zamankinden daha büyüktür. NRC'nin arkasına daha fazla ağırlık verme zamanı geldi."
 CAN_habakkuk_carrier:0 "Habakkuk Uçak Gemisi"
 CAN_habakkuk_carrier_desc:0 "Habakkuk Projesi, odun hamuru ve buzdan yapılmış bir malzemeden bir denizaltı karşıtı uçak gemisi inşa etme planımızdır. Bu, çeliği daha önemli kullanımlar için serbest bırakacak ve Kanada bilimini ilerletecektir."
 CAN_halifax_shipyards:0 "Halifax Tersaneleri"
 CAN_halifax_shipyards_desc:0 "Avrupa'nın tam karşısında elverişli bir konuma sahip olan Halifax rıhtımları, rekor bir hızla yeni gemiler inşa ediyor. Atlantik Savaşı kazanılabilir."
 CAN_heavy_cruiser_effort:0 "Ağır Kruvazör Gayreti"
 CAN_heavy_cruiser_effort_desc:0 "Filolarımızı ağır kruvazörler etrafında inşa edebiliriz ve bunu uygulanabilir bir strateji haline getirmek için yeterli limanımız var."
 CAN_if_day:0 "Eğer Günü"
 CAN_if_day_desc:0 "Kanadalılar yabancı hakimiyet tehdidini ciddiye almıyorlar, bu yüzden korkuyu eve sokmak için Winnipeg'in bir Nazi işgalini simüle edeceğiz. Bu kesinlikle Zafer Tahvili satışlarını artıracaktır."
 CAN_imperial_oil:0 "İmparatorluk Petrolü"
 CAN_imperial_oil_desc:0 "İmparatorluk Petrolü, Batı Kanada'da arama yapmak için finansman sağlamak istiyor. Bu, petrol rezervlerimizi artıracak ve savaş makinesini yağlayacaktır."
 CAN_independent_command:0 "Bağımsız Komuta"
 CAN_independent_command_desc:0 "Büyük Savaş'ta, Kanada birlikleri nihayetinde İngiliz subaylarına karşı sorumluydu, bu da Somme ve Passchendaele'de anlamsız katliamlara yol açtı. Bu sefer, Kanada kendi komutasını alacak."
 CAN_john_inglis_and_company:0 "John Inglis ve Şirketi"
 CAN_john_inglis_and_company_desc:0 "John Inglis ve Şirketi, Kanada ordusu için yeni makineli tüfekler ve toplar inşa etmeye yönlendirilmelidir."
 CAN_join_comintern:0 "Komintern'e Katıl"
 CAN_join_comintern_desc:0 "Sovyetler Birliği iyi niyetini ve gücünü kanıtladı. Kanada Sovyet ittifakına katılmalıdır."
 CAN_join_germany:0 "Almanya'ya Katıl"
 CAN_join_germany_desc:0 "Hitler, ulusunu güçlendirirken makul taleplerde bulunan makul bir adam olduğunu kanıtladı. Yeni bir Altın Çağ için Reich'e dayanışma içinde katılacağız."
 CAN_liberate_the_workers_of_the_world:0 "Gerçek Devrimin Ruhu"
 CAN_liberate_the_workers_of_the_world_desc:0 "İnşa ettiğimiz ütopyaya olan inancımız o kadar büyük ki, genç erkek ve kadınlarımız, baskıcı rejimlerin boyunduruğu altında acı çeken yabancı topraklardaki ezilmiş yoldaşlarımızın da tamamen Kanada özgürlüğümüzden bir tat alabilmeleri için sancağın etrafında toplanıyor."
 CAN_light_cruiser_effort:0 "Hafif Kruvazör Gayreti"
 CAN_light_cruiser_effort_desc:0 "Asla birçok ana gemi inşa edemeyeceğiz, ancak toplu olarak inşa edilen daha küçük kruvazörler hala etkili olabilir."
 CAN_long_branch_arsenal:0 "Long Branch Cephaneliği"
 CAN_long_branch_arsenal_desc:0 "Batı Toronto'daki Long Branch Cephaneliği tüfek üretim merkezimiz olacaktır. Binlerce Lee-Enfield'e ihtiyacımız var ve Cephaneliğin merkezi konumu ülke çapında dağıtıma yardımcı olacaktır."
 CAN_maritime_colonial_railway:0 "Denizcilik Sömürge Demiryolu"
 CAN_maritime_colonial_railway_desc:0 "Doğu eyaletlerimiz, Sömürgelerarası Demiryolu'nun Kanada Ulusal Demiryolu'na satılmasından bu yana demiryolu hatlarından yetersiz hizmet almaktadır. Merkezi eyaletler ile Atlantik eyaletleri arasındaki bağlantıları genişletmek için yeni bir Denizcilik Sömürge Demiryolu'nu teşvik ediyor ve üstleniyoruz."
 CAN_mend_relations_with_the_trotskyites:0 "Troçkistlerle İlişkileri Düzelt"
 CAN_mend_relations_with_the_trotskyites_desc:0 "Partideki eski anlaşmazlıklar halkımızı çok uzun süredir böldü. Bu bir zamanlar güvenilir sürgünleri kucaklama ve halk iradesinin tek gerçek ışığı olarak amacımızı yeniden şekillendirme zamanı geldi."
 CAN_mine_the_shield:0 "Kalkanı Kaz"
 CAN_mine_the_shield_desc:0 "Kanada Kalkanı nikel, bakır, altın ve gümüş bakımından zengindir. Bize doğanın mineral zenginliği verilmiştir. Onu daha fazla sömürme zamanı geldi."
 CAN_montreal_laboratory_collaboration:0 "Montreal Laboratuvarı İşbirliği"
 CAN_montreal_laboratory_collaboration_desc:0 "Montreal Laboratuvarı, dünyanın dört bir yanından bilim adamları için bir cazibe merkezi haline geldi. Fransız ve İngiliz bilim adamları özellikle hoş karşılandılar ve Dominyonların çabalarına büyük ölçüde ihtiyaç duyulan uzmanlığı getiriyorlar."
 CAN_national_housing_act:0 "Ulusal Konut Yasası"
 CAN_national_housing_act_desc:0 "Modernleşen bir Dominyon'un ülke çapında konut konusunda standartlaştırılmış düzenlemelere sahip olması gerekir. Tüm Kanadalıların yaşam koşullarını iyileştirmeliyiz."
 CAN_national_resources_mobilization_act:0 "Ulusal Kaynakları Seferberlik Yasası"
 CAN_national_resources_mobilization_act_desc:0 "Kanada büyüktür ve nüfusu toprak boyunca dağınık ceplerde bulunur. İstihdam durumunu takip etmek ve denizaşırı hizmet için uygun olan herkesin bulunabilmesini sağlamak için bir sistem geliştirilmelidir."
 CAN_national_steel_car:0 "Ulusal Çelik Araba"
 CAN_national_steel_car_desc:0 "Buhran boyunca mücadele etmesine rağmen, Ulusal Çelik Araba şirketi, genişletilmiş demiryolu ve ordu için ihtiyaç duyacağımız araçların yapımına yardımcı olacak uzmanlığa ve deneyime sahiptir."
 CAN_newfoundland_act:0 "Newfoundland Yasası"
 CAN_newfoundland_act_desc:0 "Newfoundland ve Labrador bölgeleri hem kültürel hem de coğrafi olarak bize yakındır, ancak İngiliz yönetimi altında olmaya devam etmektedirler. Topraklarla birleşme ve onları yönetmede yardımcı olma talebinde bulunmamızın zamanı geldi."
 CAN_north_american_alliance:0 "Kuzey Amerika İttifakı"
 CAN_north_american_alliance_desc:0 "Amerika Birleşik Devletleri ile büyük ve kalıcı bir ortaklık ilan etme zamanı geldi. Barış ve kardeşlik içinde birleştiğimizde kimse bize meydan okuyamaz."
 CAN_offer_concessions_for_labrador_and_newfoundland:0 "Labrador ve Newfoundland İçin Tavizler"
 CAN_offer_concessions_for_labrador_and_newfoundland_desc:0 "İngilizler, anavatanımıza bitişik topraklar üzerinde hakimiyet iddia ediyor. Üstün bir düşmanla savaşmak istemesek de, durumları gerektirirse optimal olmayan bir ticareti düşünmeye istekli olabilirler."
 CAN_offer_concessions_for_labrador_tooltip:0 "§H[ENG.GetName]§!'in bu talebi doğrudan bir talepten daha fazla dikkate alması daha olasıdır. Aşağıdaki durumlarda talebimizi kabul etmeleri §Gdaha olasıdır§!:\n - Savaşta iseler\n - Bize karşı yüksek bir görüşleri varsa\n - §H%25'ten§! fazla Teslim Olma İlerlemesine sahiplerse\n - Bizimle aynı ideolojiye sahiplerse\n\nKabul ederlerse:\n"
 CAN_patriation:0 "Vatanlaştırma"
 CAN_patriation_desc:0 "Kanada'nın Ana İngiltere ile bağlarını azaltma zamanı geldi. Kendi kaderine sahip, kıtaya ve Pasifik'in ötesine olduğu kadar İngiltere ve Avrupa'ya da bakan yetişkin bir ulusuz."
 CAN_permanent_joint_defense_board:0 "Kalıcı Ortak Savunma Kurulu"
 CAN_permanent_joint_defense_board_desc:0 "Coğrafya ve ortak miras bizi Amerika Birleşik Devletleri'ne bağlıyor, ancak kıta tek başımıza savunmamız için çok büyük. Kuzey Amerika'nın korunması konusunda danışma ve planlama için bir ortak savunma kurulu gereklidir."
 CAN_pinion_the_eagle:0 "Kartalı Kıstır"
 CAN_pinion_the_eagle_desc:0 "Amerika Birleşik Devletleri ile uzun sınırımız çok uzun süredir savunmasız kaldı. Amerika, Kanada güvenliğine yönelik en büyük tehdit olmaya devam ediyor, bu nedenle ABD'nin işgal etmesini çok zor ve zahmetli hale getirmek için harekete geçilecektir."
 CAN_polymer_corporation:0 "Polimer Şirketi"
 CAN_polymer_corporation_desc:0 "Yeni taç şirketi Polimer Şirketi, yeni kauçuk polimerlerinin üretiminde son derece verimli olduğunu kanıtladı."
 CAN_rcaf_station_borden:0 "RCAF İstasyonu Borden"
 CAN_rcaf_station_borden_desc:0 "Kanada hava kolordusu Borden, Ontario'da doğdu ve bu üs yeni nesil pilotları eğitmek için kullanılmalıdır."
 CAN_reactivate_farmers_unity_league:0 "Çiftçi Birlik Ligi'ni Yeniden Aktif Hale Getir"
 CAN_reactivate_farmers_unity_league_desc:0 "Birlik Ligi, şanlı devrimimize giden yolda önemli çalışmalar yaptı. Şimdi, umutsuz ihtiyaç zamanımızda, bu kırsal sadıklara devlete mümkün olan her şekilde yardım etmeleri için çağrıda bulunmalıyız."
 CAN_red_deer_training_camp:0 "Red Deer Eğitim Kampı"
 CAN_red_deer_training_camp_desc:0 "Red Deer Eğitim Kampı, yeni ordumuzun eğitimi için ana yer olacaktır. Tam bir cephanelik ve yakındaki havaalanlarıyla Red Deer ideal bir konuma sahiptir."
 CAN_refuge_for_scientists:0 "Bilim Adamları İçin Sığınak"
 CAN_refuge_for_scientists_desc:0 "Savaşın kargaşasından uzak olan Kanada, çalışmalarını bomba ve mermilerden uzak bir şekilde yürütmek isteyen bilim adamları için umut verici bir iniş yeri olduğunu kanıtladı."
 CAN_reject_authoritarianism:0 "İçgözlemsel Komünizm"
 CAN_reject_authoritarianism_desc:0 "Etrafımızda çatışma ve bölünme artarken, benzersiz coğrafi ve toplumsal koşullarımızın bizi daha geniş sosyalist hareketlerden ve onlarla birlikte gelen söylentili otoriterliğin tuzaklarından caydırdığı açıkça ortaya çıktı. Halk hareketi yeniden başlamalı - bizimle."
 CAN_retool_angus_shops:0 "Angus Dükkanlarını Yeniden Donat"
 CAN_retool_angus_shops_desc:0 "Modern bir ordunun zırha ihtiyacı vardır ve CPR'nin Angus Dükkanları bunun inşası için uygundur. Tank inşa etmek için bu altyapıyı yeniden donatın ve elden geçirin."
 CAN_rowell_sirois_commission:0 "Rowell-Sirois Komisyonu"
 CAN_rowell_sirois_commission_desc:0 "Rowell-Sirois Komisyonu, Kanada'nın federal anayasal düzenlemesinin Büyük Buhran'dan kurtulmayı engellediğini belirledi. Ülke çapında hizmet standartlarını eşitlemeliyiz."
 CAN_royal_regiment_of_canadian_artillery:0 "Kraliyet Kanada Topçu Alayı"
 CAN_royal_regiment_of_canadian_artillery_desc:0 "Güncel topların eksikliğine rağmen, topçularımızı uçaksavar silahlarını ve yeni 25 librelikleri nasıl kullanacakları da dahil olmak üzere modern bir savaşta savaşmaları için eğitmeye başlamalıyız."
 CAN_send_in_the_zombies:0 "Zombileri Gönder"
 CAN_send_in_the_zombies_desc:0 "Kanada'nın tüm uygun erkeklerini orduda çalıştırma zamanı geldi. NRMA aracılığıyla sanayide çalışmak üzere birçok adam seferber ettik, ancak şimdi denizaşırı gönderilmelidirler."
 CAN_shadow_factories:0 "Gölge Fabrikalar"
 CAN_shadow_factories_desc:0 "Uçak fabrikalarına ihtiyacımız var, ancak parça imalatının diğer fabrikalara, özellikle otomobil fabrikalarının yakınına dağıtılması daha kolay ve daha güvenlidir. Bu, gizliliği ve güvenliği teşvik edecektir."
 CAN_skewer_the_eagle:0 "Kartalı Şişle"
 CAN_skewer_the_eagle_desc:0 "Amerikan tehdidini çevrelemek ve kontrol altına almak için Meksikalı kardeşlerimizle bir ittifak kuracağız."
 CAN_stalin_and_friends_hate_us_now:0 "Muhalif Şüpheleri"
 CAN_strengthen_the_commonwealth_ties:0 "İngiliz Milletler Topluluğu Bağlarını Güçlendir"
 CAN_strengthen_the_commonwealth_ties_desc:0 "Dominyon arkadaşlarımız en sadık dostlarımızdır ve hepimiz Majestelerinin desteğiyle birlikte yürümeliyiz."
 CAN_supply_the_empire:0 "İmparatorluğu Tedarik Et"
 CAN_supply_the_empire_desc:0 "Odun, demir, nikel ve kömür bakımından bu kadar zengin başka bir ulus var mı? Konvoylarımız ve demiryollarımız güvende olduğu sürece, ham maddeleri limanlarımıza ve ardından İmparatorluk ortaklarımıza gönderebiliriz."
 CAN_supply_the_red_army:0 "Kızıl Ordu'yu Tedarik Et"
 CAN_supply_the_red_army_desc:0 "Sovyetler Birliği halk düşmanlarına karşı savaşta olduğundan, Kanada Moskova'ya silah ve malzeme konusunda yardım etmelidir."
 CAN_support_a_synarchist_baja:0 "Sinarkist bir Baja'yı Destekle"
 CAN_support_a_synarchist_baja_desc:0 "Kuzey Amerika'da muhafazakar milliyetçiliğin yayılmasını ilerletmek için, Meksika'da bir Sinarkist isyanın arkasına ağırlığımızı koymalıyız. Başarılı olduğunda, sözleri yarımküre boyunca yaymaya hazır iki Faşist devletimiz olacak."
 CAN_support_the_blue_shirts:0 "Mavi Gömleklileri Destekle"
 CAN_support_the_blue_shirts_desc:0 "Ulusumuzun faşizme dönüşü, rakiplerimizi sindirmek ve etkilemek için güçlü bir paramiliter kol gerektirecektir. Mavi Gömlekliler, yeni düzenimize meydan okuyan herkese cevabımız olacaktır."
 CAN_support_the_world_revolution:0 "Dünya Devrimini Destekle"
 CAN_support_the_world_revolution_desc:0 "Halkın şarkısını duyuyor musunuz? Bu Enternasyonal! Kanada, proletaryayı zincirlerinden kurtarmak için çaba gösterecektir."
 CAN_swastika_clubs:0 "Gamalı Haç Kulüpleri"
 CAN_swastika_clubs_desc:0 "Birçok Kanadalı, Faşizm fikirlerini ve ideallerini teşvik etmek için Gamalı Haç Kulüplerine yöneliyor. Büyüleyici!"
 CAN_the_black_devils:0 "Kara Şeytanlar"
 CAN_the_black_devils_desc:0 "Tehlikeli görevler için özel bir komando birimi mevcut olmalıdır. Şeytan Tugayı'nın oluşturulmasında Amerikan Müttefiklerimizle işbirliği ayarlandı."
 CAN_the_pacific_coast_air_defence_radar_system:0 "Pasifik Kıyısı Hava Savunma Radar Sistemi"
 CAN_the_pacific_coast_air_defence_radar_system_desc:0 "Britanya Kolumbiyası kıyısı, güney hariç kayalık ve seyrek nüfusludur. Pasifik üzerinden gelen olağandışı bir şeyi tespit etmek için bir radar istasyonları zinciri gibi erken uyarı sistemlerine güvenmek zorunda kalacağız."
 CAN_the_plan:0 "Plan"
 CAN_the_plan_desc:0 "Pilotların eğitimi konusunda deneyim ve içgörü paylaşmak için müttefiklerimizle birleştik. Savaş havadan kazanılabilir, bu nedenle İngiliz Milletler Topluluğu Hava Eğitim Planı zafere giden anahtar olabilir."
 CAN_the_rocky_mountain_rangers:0 "Rocky Mountain Korucuları"
 CAN_the_rocky_mountain_rangers_desc:0 "Batıdaki anavatan savunması, Kamloops'ta bulunan Rocky Mountain Korucularına düşecektir."
 CAN_the_sabre_project:0 "Sabre Projesi"
 CAN_the_sabre_project_desc:0 "Jet uçakları geleceğin göklerine hakim olacak, bu nedenle yabancı jet uçaklarının kendi varyantlarımızın üretimine yatırım yapmalıyız."
 CAN_the_valentine_tank:0 "Valentine Tankı"
 CAN_the_valentine_tank_desc:0 "Kanada, İngiliz tasarımı dayanıklı bir orta tank olan Valentine Tankını üretme lisansına sahiptir."
 CAN_the_walkie_talkie:0 "Telsiz"
 CAN_the_walkie_talkie_desc:0 "Donald Hings, radyo dalgaları üzerinde çalışan yeni bir el tipi iki yönlü iletişim cihazı icat etti ve patentini alıyor. Bu, iletişimi ve hedeflemeyi büyük ölçüde artıracaktır."
 CAN_trade_fleet:0 "Ticaret Filosu"
 CAN_trade_fleet_desc:0 "Kanada bir ticaret ülkesidir. Daha fazla yük gemisi ve konvoy inşa edin."
 CAN_trotsky_loves_us:0 "Silah Arkadaşları"
 CAN_turner_valley_oilfield:0 "Turner Vadisi Petrol Sahası"
 CAN_turner_valley_oilfield_desc:0 "1914'te keşfedilen Calgary dışındaki Turner Vadisi, İmparatorluğun en büyük petrol sahalarından biri haline geldi. Daha fazla geliştirme, sanayi ve hükümet için en önemli öncelik olmalıdır."
 CAN_united_shipyards:0 "Birleşik Tersaneler"
 CAN_united_shipyards_desc:0 "Montreal'deki Birleşik Tersaneler rıhtımı, çıkarma gemilerimiz ve kargo gemilerimiz için birincil kaynak haline geldi."
 CAN_uranium_mining:0 "Uranyum Madenciliği"
 CAN_uranium_mining_desc:0 "Müttefiklerimiz uranyum gerektirecek gizli bir proje üzerinde çalışıyorlar. Neyse ki, Eldorado şirketi nadir minerali keşfetti ve madenlerin etrafına bir kasaba inşa etti - Port Radium. Hükümet bu şirketin kontrolünü ele almalı ve bu son derece hassas minerali korumalıdır."
 CAN_victory_aircraft_limited:0 "Zafer Uçakları Limited"
 CAN_victory_aircraft_limited_desc:0 "Zafer Uçakları, Kanada'nın bombardıman filosunu inşa etmekle görevlendirildi. Herkes için Lancaster!"
 CAN_war_bonds:0 "Savaş Tahvilleri"
 CAN_war_bonds_desc:0 "Savaş çabalarını yetersiz vergi tabanımıza veya kaynak ihracatımıza dayandıramayız. Vatansever Kanada halkı ülkelerine yatırım yapmalı ve Savaş Tahvilleri aracılığıyla savaş çabalarını desteklemelidir."
 CAN_war_fueled_economy:0 "Savaşla Beslenen Ekonomi"
 CAN_war_fueled_economy_desc:0 "Hammaddelere ve mamul mallara yönelik denizaşırı talep Kanada'yı Buhran'dan çıkarıyor. Orman ve minerallerdeki doğal zenginliğimiz müttefik savaş makinesini besleyebilir ve ulusu zenginleştirebilir."
 CAN_wartime_prices_and_trade_board:0 "Savaş Zamanı Fiyatları ve Ticaret Kurulu"
 CAN_wartime_prices_and_trade_board_desc:0 "Vurgunculuğu ve stokçuluğu önlemek için, malların çoğu Kanadalıya ulaşılabilir olması için fiyat kontrolleri getirildi."
 CAN_we_have_the_hurricane:0 "Hurricane'e Sahibiz"
 CAN_we_have_the_hurricane_desc:0 "Birleşik Krallık, bir Hurricane avcı uçağı hattı kurmamız için bize izin verdi. Bu uçaklar hava filomuzun çekirdeği olacak."
 CAS_bonus:0 "Yakın Hava Desteği modelleri bonusu"
 CAS_effort:0 "YHD Çabası"
 CAS_effort_desc:0 "Modern bir ordu sadece karada değil, havada da araçlardan destek almalıdır."
 ENG_AIR_REARMAMENT_DESC_COMMUNIST:0 "Kıtasal bir düşmanla herhangi bir savaşta, Halk Hava Kuvvetleri zaferin anahtarı olacaktır. Öncelikle, hava üslerimizin yeniden silahlanma planlarımızı destekleyebildiğinden emin olmalıyız!"
 ENG_AIR_REARMAMENT_DESC_HISTORICAL:0 "Kıtasal bir düşmanla herhangi bir savaşta, Kraliyet Hava Kuvvetleri zaferin anahtarı olacaktır. Öncelikle, hava üslerimizin yeniden silahlanma planlarımızı destekleyebildiğinden emin olmalıyız!"
 ENG_BRITANNIA_RULES_THE_WAVES_DESC_COMMUNIST:0 "İşçi Kurtuluş Donanması'nın uzun gölgesinde, diğer deniz güçleri telafi etmek için yenilikçi yeni doktrinler bulmak zorunda kalıyor. Rahatlamamalı ve sadece bireysel gemilerin miktarına ve kalitesine güvenmemeliyiz."
 ENG_BRITANNIA_RULES_THE_WAVES_DESC_HISTORICAL:0 "Kraliyet Donanması'nın uzun gölgesinde, diğer deniz güçleri telafi etmek için yenilikçi yeni doktrinler bulmak zorunda kalıyor. Rahatlamamalı ve sadece bireysel gemilerin miktarına ve kalitesine güvenmemeliyiz."
 ENG_BSA_COMPANY_DESC_COMMUNIST:0 "Devrimci Mühimmat Fabrikaları yeterli hafif silah üretmiyor, ancak Büyük Savaş'ta yaptığımız gibi, Birmingham Small Arms Company ile sözleşme yapabilir ve kapasitelerini genişletebiliriz."
 ENG_BSA_COMPANY_DESC_HISTORICAL:0 "Kraliyet Mühimmat Fabrikaları yeterli hafif silah üretmiyor, ancak Büyük Savaş'ta yaptığımız gibi, Birmingham Small Arms Company ile sözleşme yapabilir ve kapasitelerini genişletebiliriz."
 ENG_COASTAL_COMMAND_DESC_COMMUNIST:0 "Sanayimiz, İmparatorluğun birçok uzak bölgesinden İngiltere'ye gönderilen kaynaklarla yürütülmektedir. Konvoylarımız can damarımızdır ve hem İşçi Kurtuluş Donanması hem de Halk Hava Kuvvetleri tarafından korunmalıdır. Limanlarımıza yaklaşımları korumak için özel bir PAF oluşumu kurmalıyız!"
 ENG_COASTAL_COMMAND_DESC_HISTORICAL:0 "Sanayimiz, İmparatorluğun birçok uzak bölgesinden İngiltere'ye gönderilen kaynaklarla yürütülmektedir. Konvoylarımız can damarımızdır ve hem Kraliyet Donanması hem de Kraliyet Hava Kuvvetleri tarafından korunmalıdır. Limanlarımıza yaklaşımları korumak için özel bir RAF oluşumu kurmalıyız!"
 ENG_GENERAL_REARMAMENT_DESC_AHISTORICAL:0 "Öncüllerimiz askeri durumumuzu çok fazla ihmal ettiler. Silahlı kuvvetlerimizin yakıcı yetersizliklerini çözmek için genel bir yeniden silahlanma programı başlatmalıyız."
 ENG_GENERAL_REARMAMENT_DESC_HISTORICAL:0 "Başka bir Büyük Savaş'ın kaçınılmaz olduğu görülüyor. Hitler olmazsa Mikado olur, hatta Sovyetler bile... Kamuoyu, genel bir yeniden silahlanma programı başlatabileceğimiz kadar değişti."
 ENG_LIMITED_REARMAMENT_AHISTORICAL:0 "İç politikaya ve uluslararası ilişkilere yönelik yeni yaklaşımımız, onu desteklemek için sağlıklı bir ordu gerektiriyor. Hazırlık olarak, sivil sanayimizi genişletmeye başlamalıyız, böylece zamanı geldiğinde askeri sanayimizin gelecekteki bir genişlemesi için istikrarlı bir temel oluşturabilir."
 ENG_LIMITED_REARMAMENT_HISTORICAL:0 "Almanya'dan ve dünyadaki diğer Faşist güçlerden gelen son kışkırtmalar, zamanımızda barışın tadını çıkaramayabileceğimizi gösteriyor. Hazırlık olarak, durum daha da kötüleşirse kendi yeniden silahlanmamız için taşları yerine oturtmaya başlamalıyız."
 ENG_NAVAL_REARMAMENT_DESC_COMMUNIST:0 "İkinci Londra Deniz Antlaşması ile bir deniz silahlanma yarışını önlemeye çalışsak da, imzacılar bile çoğunlukla bunu görmezden geliyor. İşçi Kurtuluş Donanması küresel üstünlüğünü asla kaybetmemelidir. Her zaman dünyanın en büyüğü olarak kalmasını sağlamalıyız."
 ENG_NAVAL_REARMAMENT_DESC_HISTORICAL:0 "İkinci Londra Deniz Antlaşması ile bir deniz silahlanma yarışını önlemeye çalışsak da, imzacılar bile çoğunlukla bunu görmezden geliyor. Kraliyet Donanması küresel üstünlüğünü asla kaybetmemelidir. Her zaman dünyanın en büyüğü olarak kalmasını sağlamalıyız."
 ENG_ROYAL_ORDNANCE_FACTORIES_DESC_COMMUNIST:0 "Woolwich'teki Devrimci Cephanelik, ihtiyacımız olan tüm mühimmat ve hafif silahları üretmek için acınacak derecede yetersiz. Ülke çapında, tercihen nispeten güvenli bölgelerde çok daha fazla fabrika kurmalıyız."
 ENG_ROYAL_ORDNANCE_FACTORIES_DESC_HISTORICAL:0 "Woolwich'teki Kraliyet Cephaneliği, ihtiyacımız olan tüm mühimmat ve hafif silahları üretmek için acınacak derecede yetersiz. Ülke çapında, tercihen nispeten güvenli bölgelerde çok daha fazla fabrika kurmalıyız."
 ENG_ROYAL_ORDNANCE_FACTORIES_NAME_COMMUNIST:0 "Devrimci Mühimmat Fabrikaları"
 ENG_ROYAL_ORDNANCE_FACTORIES_NAME_HISTORICAL:0 "Kraliyet Mühimmat Fabrikaları"
 ENG_ROYAL_TANK_REGIMENT_DESC_COMMUNIST:0 "İngiltere tankı icat etti ve bu yüzden Cumhuriyet Muhafızları Tank Alayı dünyanın en iyi tanklarıyla donatılmalı, ancak durum şu anda böyle değil. Özel Araç Geliştirme Komitesi, İngiltere'yi tank geliştirmenin ön saflarında tutmak için modern bir tasarım araştırmayı ve geliştirmeyi öneriyor."
 ENG_ROYAL_TANK_REGIMENT_DESC_HISTORICAL:0 "İngiltere tankı icat etti ve bu yüzden Kraliyet Tank Alayı dünyanın en iyi tanklarıyla donatılmalı, ancak durum şu anda böyle değil. Özel Araç Geliştirme Komitesi, İngiltere'yi tank geliştirmenin ön saflarında tutmak için modern bir tasarım araştırmayı ve geliştirmeyi öneriyor."
 ENG_ROYAL_TANK_REGIMENT_NAME_COMMUNIST:0 "Cumhuriyet Muhafızları Tank Alayı"
 ENG_ROYAL_TANK_REGIMENT_NAME_HISTORICAL:0 "Kraliyet Tank Alayı"
 ENG_belgium_security:0 "Belçika'yı Güvence Altına Al"
 ENG_belgium_security_desc:0 "Bir uyarı açıkça yeterli değildi. Siyasi eğilimler bu şekilde devam ederse, Belçika sularımız için doğrudan bir tehdit oluşturacaktır. Müdahale etmeli ve Avrupa anakarasında stratejik bir dayanak noktası oluşturmalıyız."
 ENG_benelux_intervention:0 "Benelüks Müdahalesi"
 ENG_benelux_intervention_desc:0 "Benelüks Bölgesi'ndeki siyasi ortam bize karşı düşmanca bir hal alıyor. Demokrasinin herhangi bir düşmanına müsamaha gösterilmeyeceğine ve gerekirse güç kullanmaya hazır olduğumuza dair net bir uyarı göndermeliyiz."
 ENG_danish_intervention:0 "Danimarka Müdahalesi"
 ENG_danish_intervention_desc:0 "Danimarka'nın dünya barışı düşmanlarına verdiği destek artmaya devam etti. Bizim tarafımızda kalmalarını sağlamanın tek bir yolu var. Avrupa'da bir kara işgali gerekirse, bölgede stratejik bir dayanak noktası oluşturmak için Danimarka'yı kullanmalıyız."
 ENG_dutch_security:0 "Hollanda'yı Güvence Altına Al"
 ENG_dutch_security_desc:0 "Hollanda'daki siyasi hareketler düşmanlarımızı desteklemeye devam ediyor. Özgür bir Avrupa sağlamak için Hollanda'nın boyun eğdirilmesi gerekecek."
 ENG_embargo_germany:0 "Almanya'ya Ambargo Uygula"
 ENG_embargo_germany_desc:0 "Alman yeniden silahlanması bir hakaret ve dünya barışına büyük bir tehdittir. Savaş makinelerini beslemek için ihtiyaç duydukları kaynakları tedarik etmeyeceğiz."
 ENG_embargo_ussr:0 "[SOV.GetNameDefCap]'a Ambargo Uygula"
 ENG_embargo_ussr_desc:0 "[SOV.GetNameDefCap] güçleniyor ve askeri çabalarını beslemek için İngiliz kaynaklarını kullanıyor. Ticaretimize erişimlerini engellemeliyiz."
 ENG_expand_the_secret_intelligence_service_focus:0 "Gizli İstihbarat Servisi'ni Genişlet"
 ENG_expand_the_secret_intelligence_service_focus_desc:0 "Genellikle MI6 olarak adlandırılan Gizli İstihbarat Servisi, anavatanımızı her türlü yıkıcı faaliyetten ve yabancı tehditlerden korumaya yardımcı olur. Büyük Savaş sırasında kurulmuş olsalar da, yirmili yıllarda yeniden düzenlendiler. Ancak o zaman bazı önemli ayrıntıları kaçırdık ve örgütün boyutunu bir kez daha artırmaya çalışmalıyız."
 ENG_home_defence:0 "Anavatan Savunması"
 ENG_home_defence_desc:0 "İngiliz halkını koruyamazsak, geniş bir imparatorluğun hiçbir faydası olmaz. Çabalarımızı Britanya Adaları'nı güvende tutmaya odaklamalıyız."
 ENG_home_defence_tt:0 "Bir işgal durumunda §YAnavatanı Savun§! kararlarının kilidini açar."
 ENG_issue_gasmasks:0 "Gaz Maskesi Dağıt"
 ENG_issue_gasmasks_desc:0 "Dünya her geçen gün daha tehlikeli hale geliyor. Sivil nüfusu herhangi bir zehirli gaz saldırısından korumalıyız. Britanya rahat nefes alacak."
 ENG_military_training_act:0 "Askeri Eğitim Yasası"
 ENG_military_training_act_desc:0 "Büyük Savaş, halkımızda bir daha savaşmak zorunda kalmayacakları izlenimini bıraktı. Dünya tehlikeli hale geldikçe, tüm yetenekli genç erkeklerin temel askeri eğitim almasını sağlamalıyız."
 ENG_mot_focus_tooltip:0 "Artık Motorlu Piyade Tümenleri konuşlandırabiliriz."
 ENG_motorized_focus:0 "Motorlu Bir Ordu"
 ENG_motorized_focus_desc:0 "Son zamanlarda Ordu, tamamen motorlu piyade birlikleriyle deneyler yapıyor. Henüz tam motorlu tümenler oluşturmadılar, ancak Savaş Bakanı'na doğru sözlerle bu yakında mümkün olabilir."
 ENG_norwegian_intervention:0 "Norveç Müdahalesi"
 ENG_norwegian_intervention_desc:0 "Norveç'in demokrasiye karşı hareketleri zemin kazanmaya devam ediyor. Güç kullanmamız gerekse bile, politikalarının kendi çıkarlarımızla aynı hizada kalmasını sağlamalıyız."
 ENG_swedish_intervention:0 "İsveç Müdahalesi"
 ENG_swedish_intervention_desc:0 "İsveç'in demokrasiye karşı hareketleri endişe verici derecede etki kazandı. İsveç çeliğinin düşmanlarımızın elinde silaha dönüşme riskini alamayız. İsveçliler özgür kalacak, ancak ülkeleri üzerinde belirli bir derecede etki sağlamamız gerekiyor."
 ENG_tank_focus:0 "[Root.GetRoyalTankRegimentName]"
 ENG_tank_focus_desc:0 "[Root.GetRoyalTankRegimentDesc]"
 ENG_vickers_experimental_facility_focus:0 "Vickers Deneysel Tesisleri"
 ENG_vickers_experimental_facility_focus_desc:0 "Özel teknolojik projelerin araştırılması ve geliştirilmesini ilerletmek için, Vickers'ın Foxwarren'deki deneysel tesislerini genişletmeye çalışmalıyız."
 ENG_vickers_experimental_facility_focus_tt:0 "§Y[126.GetName]§!'de başka §YDeneysel Tesisler§! yoksa, §Y[126.GetName]§!'de §G1§! §YAerodinamik ve Aviyonik Tesisi§! kazanacağız."
 ENG_war_with_germany:0 "Almanya ile Savaş"
 ENG_war_with_germany_desc:0 "Almanlar bize başka seçenek bırakmadı. Özgür dünya ve çocuklarımızın geleceği uğruna. Savaş zamanı."
 ENG_war_with_italy:0 "İtalya ile Savaş"
 ENG_war_with_italy_desc:0 "İtalyanlar yeni bir İmparatorluk planlarından vazgeçmeyi reddediyor ve sınırlarını genişletmek için savaşa girmeye istekli olduklarını kanıtladılar. Çok geç olmadan bu tehdidi ortadan kaldırmak için elimizden geleni yapmalıyız."
 ENG_war_with_japan:0 "Japonya ile Savaş"
 ENG_war_with_japan_desc:0 "Diğer tüm seçenekler tükendi ve Japonlar yayılmacı yollarından vazgeçmeyi reddediyor. Britanya İmparatorluğu'nun ve Asya halkının güvenliği için Japonları boyunduruk altına almalıyız."
 ENG_war_with_ussr:0 "Düşünülemez Operasyon"
 ENG_war_with_ussr_desc:0 "[SOU.GetNameDef] tehdidi itirazlarımıza rağmen büyümeye devam ediyor. Saldırgan bir [SOU.GetName]'e müsamaha gösteremeyiz ve daha iyi bir yarın için savaşa girmekten başka seçeneğimiz kalmadı."
 FOCUS_SHORTCUT_TOOLTIP:0 "$PATH|H$ yoluna gitmek için §GSol tıklayın§!"
 FOCUS_SHORTCUT_TOOLTIP_KEYED:0 "£GFX_$KEY$ veya §G$PATH|H$ yoluna kaydırmak için§!'ye tıklayın"
 FRA_aggressive_focus:0 "Saldırgan Odak"
 FRA_aggressive_focus_desc:0 "Düşmanlar sınırlarımıza hareket ederken boş duramayız. Ve müttefiklerimizi bir savaş senaryosunda kendi başlarının çaresine bakmaları için bırakamayız. Ordumuzu hazırlayın! Gamelin bu iş için biçilmiş kaftan."
 FRA_air_doctrine:0 "Hava Doktrini"
 FRA_air_doctrine_desc:0 "Hava savaşında yeni teorileri daha hızlı bir şekilde test etmek için yeterli deneyim kazandık. Bu, yeni taktiksel ve stratejik olasılıkları keşfetmemizi sağlayacaktır. Hava muharebesi modern savaşın anahtarıdır."
 FRA_air_focus:0 "Hava Odağı"
 FRA_air_focus_desc:0 "Hava kuvvetlerimizi genişletme zamanı geldi! Hem personel hem de uçak sayısında büyük bir artışı desteklemek için yeni Hava Üsleri inşaatına başlama planları zaten yapıldı."
 FRA_algerie_france:0 "Cezayir Fransa'sına Yatırım Yap"
 FRA_algerie_france_desc:0 "Avrupa tehlikeli zamanlarla karşı karşıya. Güneydeki topraklarımızı geliştirmeye odaklanmalı ve anakarayı her zaman destekleyebildiğimizden emin olmalıyız."
 FRA_algerie_france_tt:0 "Sömürge Fransa'sında §YAltyapı§! için yeterli inşaat alanı yok"
 FRA_alpine_forts:0 "Alp Kaleleri"
 FRA_alpine_forts_desc:0 "Alpleri yeni planladığımız savunma hattımızla kaplamayı bitirdikten sonra İtalyanlar sınırı o kadar kolay geçemeyecekler. Konumumuzu yanıtlamak ve güçlendirmek için zamanımız olacak."
 FRA_army_of_aggression:0 "Saldırı Ordusu"
 FRA_army_of_aggression_desc:0 "Düşmanlarımız Avrupa'da kol gezerken artık modası geçmiş bir duvarın arkasında oturamayız. Ordumuzu güçlendirme ve Fransa'nın büyük bir ulus olmaya devam etmesini sağlamak için sınırlarımızı zorlama zamanı geldi."
 FRA_army_reform:0 "Ordu Reformu"
 FRA_army_reform_desc:0 "Hiçbir piyade birimi veya yüksek teknolojili tank tek başına savaşı kazanamaz. Hem taktiksel hem de stratejik yeteneklerimizi geliştirmek için çabalarımızı ortaya koymalıyız. Doğru kişilerle iş başında bir ordu olarak gelişebiliriz."
 FRA_artillery_focus:0 "Grande Batterie"
 FRA_artillery_focus_desc:0 "Topçumuz, belirli noktalara ateş odaklamak için tek bir güçlü birim oluşturacaktır. Her seferinde bir yaylım ateşiyle düşman hattını zayıflatacak ve gerekirse yolumuzu açacağız!"
 FRA_bomber_focus:0 "Bombardıman Uçağı Odağı"
 FRA_bomber_focus_desc:0 "Hava desteği hem savunma hem de saldırı yeteneklerimizin önemli bir parçasıdır. Hızlı, daha çevik ve isabetli bombardıman uçakları geliştirmeye çabalarımızı odaklarsak, herhangi bir kara savaşında avantajımızı koruruz."
 FRA_capital_ship_focus:0 "Ana Gemi Odağı"
 FRA_capital_ship_focus_desc:0 "Zırhlılarımızın tasarımını geliştirmek büyük taktiksel avantajlara yol açacaktır. Menzilleri ve güçleri tartışmasız olduğundan, hiç kimse silahlarından kaçamayacaktır."
 FRA_carrier_focus:0 "Uçak Gemisi Odağı"
 FRA_carrier_focus_desc:0 "Deniz teorisyenleri dikkatimizi eski Uçak Gemilerimize yöneltti. Geliştirme doğru yönde ilerletilirse Uçak Gemilerinin nasıl daha fazla kullanılabileceğine dair önerileri var. Tam desteğimiz olmadan gerçek bir ilerleme kaydedilemez."
 FRA_cas_focus:0 "Yakın Hava Desteği Odağı"
 FRA_cas_focus_desc:0 "Kara kuvvetlerimiz ve gemilerimiz için destek sağlayan uçaklar, nispeten küçük bir yatırımla çok verimli bir katkı oldu. Bu uçakların şimdi birkaç önerilen iyileştirmesi var. Mühendislerimiz yeni nesil destek uçaklarını geliştirebilir."
 FRA_colonial_industry:0 "Sömürge Sanayisi"
 FRA_colonial_industry_desc:0 "Sömürgelerdeki sanayilerimize odaklanmalıyız. Avrupa'da gerilim artarsa, düşman bombardıman uçaklarının ulaşamayacağı bir endüstriyel kapasiteye sahip olmaya devam edeceğiz."
 FRA_colonial_industry_tt:0 "Sömürge Fransa'sında §YSivil Fabrikalar§! için yeterli inşaat alanı yok"
 FRA_colonial_military_factories:0 "Sömürge Askeri Fabrikaları"
 FRA_colonial_military_factories_desc:0 "Askeri üretimimizi Avrupa dışına yerleştirmek, düşman hava sahamızın kontrolünü ele geçirse bile, ön cephe birliklerimize sürekli bir teçhizat akışını sürdürmemizi sağlar."
 FRA_colonial_military_factories_tt:0 "Sömürge Fransa'sında §YAskeri Fabrika§! için yeterli inşaat alanı yok"
 FRA_czech_guarantee:0 "Çek Garantisi"
 FRA_czech_guarantee_desc:0 "Çek sınırında gerilim artıyor. Yayılmacı ulusların özgür ve demokratik bir ulusu ele geçirmesine izin veremeyiz. Çekler özgür bir halk olarak kalmalıdır. Bizden bir garantiyle, bir işgal planlayan herkes iki kez düşünecektir."
 FRA_defensive_focus:0 "Savunma Odağı"
 FRA_defensive_focus_desc:0 "Böyle zamanlarda savunmamızı güçlendirmek en iyisidir. Tehditler varsa, kendi topraklarımızda onlarla başa çıkabilmemiz için bize gelsinler. Ordumuzu yönetecek mükemmel bir adayımız var, tek ihtiyacımız olan sizin sözünüz."
 FRA_defensive_strategems:0 "Savunma Stratejileri"
 FRA_defensive_strategems_desc:0 "Fransa halkının bizim için savaşmasını istiyorsak, net bir yönümüzün olması her zamankinden daha önemli. Kendi aramızda kavga etmeyi bırakıp Fransa ve bunun yerine \"Liberté, égalité, fraternité\" için savaşmalıyız."
 FRA_dismantle_the_democracies:0 "Demokrasileri Sök"
 FRA_dismantle_the_democracies_desc:0 "Orta Avrupa'daki yeni [GER.GetAdjective] demokratik ittifakı yeni keşfettiğimiz konumumuzu tehdit ediyor. Daha güçlü olmadan önce şimdi harekete geçmeliyiz."
 FRA_extend_the_maginot_line:0 "Maginot Hattını Uzat"
 FRA_extend_the_maginot_line_desc:0 "Belçika'nın yerini tutacağına güvenemeyiz, eğer düşman ordularını geçirirlerse başımız belaya girebilir. Maginot Hattını uzatmak, istenmeyen orduları Fransa'dan uzak tutmak için hayati önem taşıyor!"
 FRA_extra_research_slot:0 "Grandes Écoles'ü Destekle"
 FRA_extra_research_slot_2:0 "Ulusal Araştırma Merkezi'ni Kur"
 FRA_extra_research_slot_2_desc:0 "Umut vadeden genç beyinler her yerde ortaya çıkıyor. Araştırmalarını yürütmeleri için onlara tesisler sağlamalıyız. Teknolojideki gelişmeler bize en çok ihtiyaç duyduğumuz yerde avantaj sağlayabilir."
 FRA_extra_research_slot_desc:0 "Umut vadeden genç beyinler her yerde ortaya çıkıyor. Araştırmalarını yürütmeleri için onlara tesisler sağlamalıyız. Teknolojideki gelişmeler bize en çok ihtiyaç duyduğumuz yerde avantaj sağlayabilir."
 FRA_fighter_focus:0 "Avcı Odağı"
 FRA_fighter_focus_desc:0 "Bazı devrim niteliğindeki sivil mühendislik, hızlarını, menzillerini ve maksimum irtifalarını geliştirmek için Avcılarımıza uygulanabilir. Başkalarının yaptığı ilerlemelere ayak uydurmak istiyorsak buna odaklanmalıyız."
 FRA_fortification_focus:0 "Tahkimat Odağı"
 FRA_fortification_focus_desc:0 "Kalelerimiz ne kadar kritik olsa da, onları daha verimli bir şekilde inşa etmenin yollarını bulmalıyız. Maginot hattı düşman kuvvetlerinin güçlü bir caydırıcısı olmuştur, bunun gibi daha fazla savunmanın güvenliğini kullanabiliriz."
 FRA_france_first:0 "Önce Fransa"
 FRA_france_first_desc:0 "Biz Fransa'yız! Büyük Savaş'ın galipleri! Avrupa'nın kurtarıcıları! Bu dünyanın gördüğü en büyük düşünürlerin eviyiz. Çok fazla ulus dünyayı kaosa sürüklemeye çalışıyor. Bize ihtiyaç var ve çağrıya kulak vereceğiz. Dümeni ele alacak, fırtınayı atlatacak ve insanlığı egemenliğimiz altında güvenliğe yönlendireceğiz!"
 FRA_go_with_britain:0 "İngiltere ile Git"
 FRA_go_with_britain_desc:0 "Rusya sonsuza dek değiştiğinden, eski Üçlü İtilaf'tan sadece Fransa ve İngiltere kaldı. Tarih tekerrür etmeye mahkumsa, Avrupa'da demokrasi ve özgürlüğün kaleleri olan bu iki ulusun Müttefik olarak kalmasını sağlamalıyız."
 FRA_heavy_armor_focus:0 "Char de Bataille"
 FRA_heavy_armor_focus_desc:0 "Savaş tankları Fransız Ordusu için ileriye giden yoldur. Savaş alanını kontrol etmek istiyoruz ve bunun için yeni güçlü tanklara ihtiyacımız olacak!"
 FRA_heavy_bomber_focus:0 "Ağır Bombardıman Uçağı Odağı"
 FRA_heavy_bomber_focus_desc:0 "Modern ağır bombardıman uçakları, daha küçük hava çatışmalarını kendi başlarına halledebilecek şekilde silahlandırılacaktır. Mühendislerimizin en yeni teknolojiyi geliştirmeye odaklanmasına izin verirsek, düşman üretim tesislerini yok etme şansımız daha yüksek olacaktır."
 FRA_heavy_fighter_focus:0 "Ağır Avcı Odağı"
 FRA_heavy_fighter_focus_desc:0 "Ağır Avcılarımız daha savunmasız bombardıman uçaklarını destekleyebilmelidir. Bu, bir miktar hız pahasına daha ağır silahlanma ve daha uzun menzil gerektirir."
 FRA_humanite_unie:0 "Humanité Unie"
 FRA_humanite_unie_desc:0 "Şişman bankacılar ve iktidar hırsıyla dolu demagoglar kanlı hakimiyetlerini dünya üzerinde güçlendiriyorlar. Her geçen gün özgür insanların köleleştirildiğini ve dünyanın bireyin açgözlülüğüyle yaratılan krize daha da sürüklendiğini görüyoruz. Fransız ideallerine her zamankinden daha çok ihtiyaç var! İnsanlığın bize ihtiyacı var ve biz de insanlığı birleştirmeliyiz!"
 FRA_improved_screen_ships:0 "Geliştirilmiş Perdeleme Gemileri"
 FRA_improved_screen_ships_desc:0 "Muhripler ve Daha Hafif Kruvazörler, daha ağır Zırhlılarımızı veya Uçak Gemilerimizi savunmada kilit bir rol oynar. Denizdeki savunma hattımızı kaybedersek, tüm gemileri ve adamları riske atarız. Gemilerimizin en son teknolojiyle inşa edildiğinden emin olmalıyız."
 FRA_industrial_expansion:0 "Endüstriyel Genişleme"
 FRA_industrial_expansion_desc:0 "Evde daha güçlü bir endüstriyel varlığa ihtiyacımız var. Bol miktarda hazır iş gücümüz var, ancak daha fazla fabrika hattına ihtiyacımız var."
 FRA_industrial_expansion_tt:0 "Metropol Fransa'da §YSivil Fabrikalar§! için yeterli inşaat alanı yok"
 FRA_infantry_focus:0 "Levée en masse"
 FRA_infantry_focus_desc:0 "Savaşabilecek tüm erkek ve kadınlar savaşacak. Silahları toplu halde üretmek maliyeti düşürecektir. Herkesin eline bir tüfek vereceğiz."
 FRA_initiate_government_reform:0 "Hükümet Reformu"
 FRA_initiate_government_reform_desc:0 "Dünya tehlikeli hale geldi. Artık kendi küçük çekişmelerimizle bağlı kalamayız. Politikacılarımızı güçlendirme ve Fransa uğruna ilerleme zamanı geldi."
 FRA_invite_romania:0 "Romanya'yı Davet Et"
 FRA_invite_romania_desc:0 "Romanya demokrasisi, iç faşist fraksiyonları ile Sovyet komünizmi arasında sıkışmış, kırılgandır. Onları Küçük Antant'a dahil etmek, desteğimizle istikrarı korumalarını sağlayacaktır."
 FRA_invite_yugoslavia:0 "Yugoslavya'yı Davet Et"
 FRA_invite_yugoslavia_desc:0 "Yugoslavya'nın yayılmacı komşular hakkında endişelenmesine gerek kalmadan yeterince endişesi var. Onları Küçük Antant'a geri getirmek hem onlara hem de bize büyük bir hizmet olacaktır."
 FRA_jet_effort:0 "Jet Gayreti"
 FRA_jet_effort_desc:0 "Hava muharebesi tamamen hareketlilikle ilgilidir. Jet motoru o kadar güçlü bir ilerlemedir ki, düşman pilotları onları gökyüzünden sökerken hareketsiz duruyor gibi görünecektir."
 FRA_join_comintern:0 "Komintern'e Katıl"
 FRA_join_comintern_desc:0 "Her döndüğümüz yerde düşmanlarla, güçlü müttefiklerle konumumuzu güçlendirmemiz gerekiyor. Komintern ile bağlarımız güçlendi ve kendimizi tamamen onların davasına adama zamanı geldi."
 FRA_join_germany:0 "Almanya'ya Katıl"
 FRA_join_germany_desc:0 "Alman Reich hesaba katılması gereken bir güç haline geliyor. Daha iyi bir gelecek vizyonları çıkarlarımızla aynı hizada olabilir. Onları desteklemeliyiz ve toz duman dağıldığında Fransa Avrupa'daki haklı payını alacaktır."
 FRA_leftist_rhetoric:0 "Solcu Retorik"
 FRA_leftist_rhetoric_desc:0 "Amaç açık. Herkes için eşitlik. Fransız siyasetinde kapitalist çıkarlar istemiyoruz. Komünist örgütlerimizin gelişmesi için en uygun koşulları sağlamamız zorunludur."
 FRA_light_medium_armor:0 "Automitrailleuses"
 FRA_light_medium_armor_desc:0 "Yasaya göre, Piyade tüm tank kuvvetlerini kontrol eder. Daha hafif, daha hızlı süvari 'araçları' veya Automitrailleuses seyahat için daha uygundur ve monte edilmiş silahlarıyla hala bir miktar hasar verebilir."
 FRA_little_entente:0 "Küçük Antant"
 FRA_little_entente_desc:0 "Büyük Savaş'tan sonra Avusturya ve Macaristan'ın komşularına yönelik saldırganlığını önlemek için kurulan bir ittifak olan Küçük Antant, Fransa tarafından destekleniyordu, ancak şimdi dağılmaya başladı. İngiltere ile bağları güvence altına almak yerine, Çekoslovakya'daki kurucularından başlayarak bu fraksiyonu restore etmek ve pekiştirmek için inisiyatif almalıyız."
 FRA_mechanized_focus:0 "Mekanize Odak"
 FRA_mechanized_focus_desc:0 "Zırhlı araçlar savaşta giderek daha önemli bir rol oynamaktadır. Ortalama bir tanktan biraz daha az ürkütücü olsalar da, iletişim, komuta, ulaşım ve şehir savaşında bize avantaj sağlıyorlar."
 FRA_metropolitan_france:0 "Metropol Fransa'ya Yatırım Yap"
 FRA_metropolitan_france_desc:0 "La Métropole her zaman önce gelmeli. İş yaratmak ve daha hızlı asker sevkiyatı sağlamak için altyapımızı geliştirerek başlayabiliriz."
 FRA_metropolitan_france_tt:0 "Metropol Fransa'da §YAltyapı§! için yeterli inşaat alanı yok"
 FRA_military_factories:0 "Askeri Fabrikalar"
 FRA_military_factories_desc:0 "Savaş makinemiz kapasite olarak geride kalıyor. Kuvvetlerimize sürekli yeni teçhizat verildiğinden emin olmak için ana topraklarda askeri teçhizat üretimine odaklanmalıyız."
 FRA_military_factories_tt:0 "Metropol Fransa'da §YAskeri Fabrika§! için yeterli inşaat alanı yok"
 FRA_motorized_focus:0 "Motorlu Odak"
 FRA_motorized_focus_desc:0 "Piyade araçlarımızı inşa etmenin daha iyi yollarını bulmak, ön cepheleri destekleme ve güçlendirme yeteneğimize yardımcı olacaktır."
 FRA_national_mobilization:0 "Ulusal Seferberlik"
 FRA_national_mobilization_desc:0 "Nihayet harekete geçebilecek bir hükümetimiz var. Şimdi ordumuzu güçlendirme ve Fransa için savaşmaya hazır olma zamanı."
 FRA_naval_bomber_focus:0 "Deniz Bombardıman Uçağı Odağı"
 FRA_naval_bomber_focus_desc:0 "Gemilerin uçaklara karşı son derece savunmasız olduğu kanıtlandı. Herhangi bir karşı önlemin önünde kalmamızı sağlamak için teknolojilerini geliştirmeye devam etmeliyiz."
 FRA_naval_doctrine:0 "Deniz Doktrini"
 FRA_naval_doctrine_desc:0 "Gemi tasarımlarındaki son gelişmeler taktiksel ve stratejik manevralarda yeni seçenekler açtı. Bu yeni teorilerle şansımızı denemeden önce, düzgün bir şekilde test edilmeleri ve planların sağlamlaştırılması gerekiyor."
 FRA_navy_focus:0 "Donanma Odağı"
 FRA_navy_focus_desc:0 "Donanmamızı genişletmeyi planlıyorsak, ilk adım deniz üslerimizi iyileştirmek ve genişletmektir. Eşsiz gemilerimiz her zaman savaşa hazır kalmak için sürekli dikkat gerektirir."
 FRA_navy_focus_tt:0 "§YDeniz Üssü§! için yeterli inşaat alanı yok!"
 FRA_nuclear_effort:0 "Nükleer Gayret"
 FRA_nuclear_effort_desc:0 "Nükleer bilimdeki ilk testler umut verici sonuçlar verdi. Gücünü kullanmak bize insanlığın daha önce hiç görmediği bir silah verebilir."
 FRA_polish_guarantee:0 "Polonya Garantisi"
 FRA_polish_guarantee_desc:0 "Polonyalı diplomatlar sınırlarındaki gerilimden endişe duyduklarını ifade ettiler. Yüce ulusumuzdan bir garanti, bir işgal planlayan herkesi caydıracaktır."
 FRA_revise_versailles:0 "Versay'ı Gözden Geçir"
 FRA_revise_versailles_desc:0 "Almanlar zaten Versay Antlaşması'nın öngördüğü tazminatları görmezden geliyorlar, bu da Fransa'nın artık saygı uyandırmadığını gösteriyor. Aksine, Büyük Savaş'ta kaybedilen canlar için daha fazlasını talep etme hakkımız var, ancak adil bir antlaşma, onu uygulamak için güçlü bir Fransa, yeni bir Fransa gerektirecektir."
 FRA_right_wing_rhetoric:0 "Sağcı Retorik"
 FRA_right_wing_rhetoric_desc:0 "Her Fransız'a ulaşmaya ve ulusal ruhlarını yükseltmeye odaklanmalıyız. Onlara ihtiyaç duydukları güçlü liderler olabileceğimizi gösterin ve şanlı ulusumuzun gururlu vatandaşları olacaklardır."
 FRA_scw_intervention_nationalists:0 "Milliyetçi Müdahale"
 FRA_scw_intervention_nationalists_desc:0 " Milliyetçiler nihayet İspanya'da zemin kazanıyor. Davaları haklı bir davadır ve onlar için savaşmaya istekli herkesin bunu yapmasına izin verilmelidir."
 FRA_scw_intervention_republicans:0 "Cumhuriyetçi Müdahale"
 FRA_scw_intervention_republicans_desc:0 "Cumhuriyetçi İspanya'nın yardımımıza ihtiyacı var! \nDava için savaşmaya istekli herkesin bunu yapmasına izin verilmelidir. Başka bir faşist rejimin zemin kazanmasına izin veremeyiz."
 FRA_strengthen_government_support:0 "Hükümeti Güçlendir"
 FRA_strengthen_government_support_desc:0 "Önümüzdeki yıl için Fransa'nın her yerindeki insanların isteklerini karşılayacak planlar yaptık. Onlara eylem yeteneğine sahip olduğumuzu ve Fransa'yı yönetmeye layık olduğumuzu gösterin, böylece bir kez daha birleşebiliriz."
 FRA_strengthen_government_support_tooltip:0 "'Hükümeti Güçlendir Desteği' fikri amacına ulaştı."
 FRA_support_status_quo:0 "Statükoyu Destekle"
 FRA_support_status_quo_desc:0 "Fransa özgürlüğün beşiği ve koruyucusudur ve öyle kalmalıdır. Bir daha birliğe ulaşmak istiyorsak, demokrasimizi zayıflamadan önce istikrara kavuşturmalıyız."
 FRA_support_the_left:0 "Solu Destekle"
 FRA_support_the_left_desc:0 "Komintern güçleniyor. Çıkarlarımızın aynı hizada olabileceğini gösterme ve komünist örgütlerimizi destekleme zamanı geldi."
 FRA_support_the_right:0 "Sağı Destekle"
 FRA_support_the_right_desc:0 "Fransa her zaman güçlü ve gururlu bir ulus olmuştur, ancak hükümet eylemsizliği halkı bölmüştür. Fransa'yı birleştirmeli ve çürümeye yenik düşmemek için üstünlüğümüzü ve gücümüzü savunmalıyız."
 FRA_woo_italy:0 "İtalya'yı Etkile"
 FRA_woo_italy_desc:0 "İtalya güçlü bir ulus olma potansiyeline sahip. Mussolini'nin güçlü liderliği sayesinde İtalya halkı birleşmiş ve doğru dava için savaşmaya hazır. Bırakın o dava bizim olsun."
 GER_HERMANN_GORING_WERKE_NAME:0 "Devlet Kontrollü Sanayi"
 GER_HERMANN_GORING_WERKE_NAME_COMMIE:0 "VEB Vereinigte Maschinenwerke"
 GER_HERMANN_GORING_WERKE_NAME_FASCIST:0 "Hermann Göring-Werke"
 GER_HERMANN_GORING_WERKE_NAME_KAISER:0 "Kaiser-Werke"
 GER_KAISER_WAGEN_NAME:0 "Wilhelm-Wagen"
 GER_KDF_WAGEN_NAME:0 "KdF-Wagen"
 GER_VOLKS_WAGEN_NAME:0 "Volkswagen"
 GER_a_new_and_better_germany:0 "Yeni ve Daha İyi Bir Almanya"
 GER_a_new_and_better_germany_desc:0 "Ulusumuzu yeniden inşa ederken, gerekli olanın ötesine geçmeyi hedeflemeliyiz, böylece şimdi inşa ettiklerimiz zamanın sınavına dayanacaktır."
 GER_accept_british_naval_dominance:0 "İngiliz Deniz Üstünlüğünü Kabul Et"
 GER_accept_british_naval_dominance_desc:0 "Komünizmle savaşmak için müttefiklere ihtiyacımız var ve İngilizler öncelikli bir aday. İlişkilerin iyileştirilmesi adına deniz üstünlüklerini kabul ederek ve kapsamlı bir deniz gücü inşaatından vazgeçerek endişelerini gidereceğiz."
 GER_air_doctrine_shortcut:0 "Hava Kuvvetleri"
 GER_air_innovation_2:0 "Hava Yenilikleri II"
 GER_air_innovation_2_desc:0 "Reich Hava Bakanlığı'nın görevleri büyük önem taşımaktadır. Luftwaffe, dünyanın en gelişmiş Hava Kuvvetleri olmalıdır!"
 GER_align_hungary:0 "Macaristan'ı Hizala"
 GER_align_hungary_desc:0 "Macaristan zaten etki alanımızda, ancak onları düşünce tarzımıza daha da yakınlaştırabiliriz, böylece gelecekte daha kolay manipüle edilebilirler."
 GER_align_romania:0 "Romanya'yı Hizala"
 GER_align_romania_desc:0 "Romanya zaten etki alanımızda, ancak onları düşünce tarzımıza daha da yakınlaştırabiliriz, böylece gelecekte daha kolay manipüle edilebilirler."
 GER_ally_the_shade:0 "Gölgeyle Bir İttifak"
 GER_ally_the_shade_desc:0 "Eğer güneşte yerlerini alamıyorsak, o zaman üzerimize gölge düşürenlerle müttefik olacağız."
 GER_alone_or_peace_faction_tt:0 "bir grupta değil veya [GER.GetNameDef] ile barış içinde olan bir grupta."
 GER_anschluss_desc_old:0 "Anschluss, veya Avusturya ile birleşme, Alman halkının uzun süredir devam eden bir hedefidir. Versay Antlaşması ile yasaklanmış olsa da, nihayet bunu gerçekleştirme zamanı geldi. Avusturyalılara görkemli kaderimizi paylaşma şansı verelim!"
 GER_anschluss_eq_trigger_tt:0 "Orduda §Y50.000§!'den fazla piyade ekipmanı var"
 GER_anschluss_old:0 "Anschluss"
 GER_anti_comintern_pact:0 "Anti-Komintern Paktı"
 GER_anti_comintern_pact_desc:0 "Komünist Enternasyonal'in ulusların iç işlerine karışması sadece iç barışlarını ve sosyal refahlarını tehlikeye atmakla kalmıyor, aynı zamanda dünya barışı için de bir tehdit oluşturuyor! Komünist olmayan birçok ülkeden paketi imzalamalarını isteyeceğiz ve kızıl tehdidi kontrol altında tuttuğumuzdan emin olacağız."
 GER_anti_comintern_pact_unaligned:0 "İdeolojik Savunmalar"
 GER_anti_comintern_pact_unaligned_desc:0 "Askeri tehdit maruz kaldığımız tek tehlike değil. Komünizmi nasıl uzak tutacağımıza bakmalıyız ve bu amaçla diğer komünist olmayan kardeşlerimizle bir pakt oluşturarak ilerlemesini engellemeye kararlıyız."
 GER_anti_soviet_pact:0 "Anti-[SOV.GetAdjective] Paktı"
 GER_anti_soviet_pact_desc:0 "Anti-Komintern Paktı'nı bir adım öteye taşıyabilir ve tüm üyelerden Sovyetler Birliği'ne karşı bir koalisyona katılmalarını isteyebiliriz. Eğer herhangi bir imza sahibi SSCB ile savaşa girerse, diğer tüm üyeler de savaş ilan etmelidir."
 GER_anti_soviet_pact_tt:0 "§YSovyetler Birliği'ne karşı savunma ittifakına katılmak için Anti-Komintern Paktı'nın tüm üyelerine teklif gönderir.§!"
 GER_anti_soviet_pact_tt_2:0 "§YSavunma ittifakı, üyelerini Komintern tarafından saldırıya uğrarlarsa savaşa çağırır!§!"
 GER_anti_soviet_pact_tt_3:0 "§YAnti-Sovyet Paktı§! Ulusal Ruhu kazanır.\n"
 GER_anti_soviet_pact_unaligned:0 "Antlaşmayı Resmi Hale Getir"
 GER_anti_soviet_pact_unaligned_desc:0 "Komünizmle askeri bir çatışmaya hazırlanmalı, tüm anti-komintern paktı imzacılarından herhangi bir Sovyet saldırganlığına karşı askeri destek çağrısı yapan ek bir maddeye razı olmalarını istemeliyiz. Birbirimize birçok yönden zaten bağlı olduğumuz için bu, sadece bir formalite olmalıdır."
 GER_army_innovation:0 "Ordu Yenilikleri"
 GER_army_innovation_2:0 "Ordu Yenilikleri II"
 GER_army_innovation_2_desc:0 "SSCB'deki tesislerimizde öğrenilen dersler, doktrinlerimizi ve ekipmanımızı daha da geliştirmemizi sağlayacaktır. Ancak bu sefer gelişmeleri kendimize saklayacağız!"
 GER_army_innovation_desc:0 "Heinz Guderian ve diğer radikal teorisyenler, iletişim, 'schwerpunkte' (ağırlık noktaları) tanımlaması ve birleşik silah kuvvetlerinin yerel yoğunlaşmalarını vurgulayan cesur yeni doktrinler için bastırıyorlar. Onlara serbest dizgin vermek, Büyük Savaş'ın et kıyma makinesi dehşetinden kaçınmaya yardımcı olabilir."
 GER_around_maginot:0 "Maginot Etrafında"
 GER_around_maginot_desc:0 "Fransa'ya karşı taktiksel bir avantaj sağlamak istiyorsak, onlara her taraftan saldırabilmeliyiz. Kuzeyden bir saldırı beklemezler, ki bu tam da birkaç engeli aştıktan sonra onlara saldıracağımız yerdir."
 GER_assassinate_mussolini:0 "Mussolini'yi Suikastle Öldür"
 GER_assassinate_mussolini_desc:0 "İtalyan faşizminin kilit taşını sona erdirme zamanı geldi. Alman elleri lideri suikastle öldürecek, ardından İtalyan kralcıları tek bir hızlı hareketle iktidarı ele geçirecek."
 GER_atlantikwall:0 "Atlantik Duvarı"
 GER_atlantikwall_desc:0 "Batı Avrupa'yı fethettiğimize göre, Atlantik Okyanusu'ndan gelebilecek olası bir saldırıya karşı kendimizi sağlamlaştırmalıyız. Avrupa kıyıları boyunca uzanan devasa bir tahkimat ağı bize bolca koruma sağlamalıdır."
 GER_autarky:0 "Otoarşi"
 GER_autarky_desc:0 "Almanya'nın gerçekten büyük olması için kendi kendine yeterli olması gerekir. Kaynaklarımızı daha iyi kullanmalı ve inşaatımızda daha verimli olmalıyız."
 GER_autobahn:0 "Reichsautobahn"
 GER_autobahn_desc:0 "1933'teki başlangıcından bu yana, [GetAutobahnName] projesi görkemli bir başarı olmuştur. İnşaat çabaları işsizliği azalttı ve geniş yollar [GER.GetName]'ın ekonomik iyileşmesinin bir anıtı olarak duruyor. Ancak yapılacak çok iş var."
 GER_autobahn_fallback_tt:0 "Reichsautobahn'ın halihazırda inşa edilmiş olmasıyla, rastgele seçilen §Y4 §! eyaletleri, ağı daha da genişletmek ve genişletmek için §Y1§! düzeyinde altyapı alacak."
 GER_autobahn_tt:0 "§YBrandenburg§!, §YHannover§!, §YThüringen§! ve §YFranken§!'de maksimum §YAltyapı§! ekle!"
 GER_baltic_membership:0 "Baltık Üyeliği"
 GER_baltic_membership_desc:0 "İki on yıldır Baltıklar, yeniden ilhak ve [GER.GetBalticMembershipDesc] gibi ölümcül çifte tehlikeler altında yaşıyorlar. Onlara [GER.GetDanubianMembershipDesc] tehdidine karşı üyelik ve koruma sunacağız."
 GER_break_the_anglo_french_colonial_hegemony:0 "Anglo-Fransız Sömürge Hegemonyasını Kır"
 GER_break_the_anglo_french_colonial_hegemony_desc:0 "Batı'nın sömürgecilik üzerindeki tekelini kırmanın zamanı geldi, çok uzun zaman oldu."
 GER_bulwark_against_bolshevism:0 "[GER.GetBulwarkName]"
 GER_bulwark_against_bolshevism_desc:0 "Ulusumuz [GER.GetBulwarkBolshevismDesc]'e karşı bir kalkan olarak duruyor, Batı'yı [GER.GetBulwarkCommunismDesc] etkisinden koruyor. Bu görevi gururla taşımalı ve gerekirse silah kullanmaya hazırlanmalıyız."
 GER_bulwark_against_bolshevism_tt:0 "§RBu Ulusal Ruh, eğer [SOV.GetNameDef] ile aynı grupta veya aynı tarafta savaşılıyorsa kaybedilecektir.§!\n"
 GER_bypass_maginot_in_the_south:0 "Maginot'u Güneyde Bypass Et"
 GER_bypass_maginot_in_the_south_desc:0 "İngilizlerin Aşağı Ülkelerde çıkarları var, bu yüzden Maginot'un etrafında alternatif yollar aramalıyız. Güney, dağlık ve geçilmesi zor olsa da, yeterli olmalı. Alman zekası bizi zafere ulaştıracak."
 GER_carte_blanche_for_alsace_and_french_colonies:0 "Alsace ve Fransız Sömürgeleri İçin Tam Yetki"
 GER_carte_blanche_for_alsace_and_french_colonies_desc:0 "Yeni müttefikimize, Alsace-Lorraine'in haklı topraklarımızı ve Afrika sömürgelerinden adil payımızı geri alma konusunda bize serbestlik tanıması için başvurmalıyız."
 GER_central_european_alliance:0 "Orta Avrupa İttifakı"
 GER_central_european_alliance_desc:0 "Artık kıtanın dikkatini soruna odakladığımıza göre, çözümü sunmalıyız: Avrupa'daki tüm küçük uluslar için, yaşam tarzımız için en ölümcül tehdide karşı koruma sağlayacak bir ittifak kuracağız."
 GER_central_european_alliance_tt:0 "Eğer bir grupta değilse:\n"
 GER_china_friend:0 "Çin ile Dost Ol"
 GER_china_friend_desc:0 "Çin ile köklü dostluğumuzu derinleştirelim. Bunu yapmak Japonya'yı yabancılaştıracaktır, ancak Japonya Doğu'nun İtalya'sından başka nedir ki?"
 GER_clamp_down_on_fascism:0 "Faşizme Karşı Baskı Uygula"
 GER_clamp_down_on_fascism_desc:0 "Nazi rejimi altında son birkaç yılda hükümetin ve faşist ideologlarının ve destekçilerinin baskıcı, diktatörlük ve kraliyet karşıtı doğası çok açık hale geldi. Düşünce tarzlarının başını her kaldırdığı yerde bastırılmasını sağlamalıyız."
 GER_coal_liquidization:0 "Kömür Sıvılaştırma"
 GER_coal_liquidization_desc:0 "Almanya petrol sıkıntısı çekiyor ve bu nedenle sentetik petrol alanındaki çabalarımızı iki katına çıkarmalıyız."
 GER_crossing_the_atlantic:0 "Atlantik'i Geçmek"
 GER_crossing_the_atlantic_1_factory_tt:0 "Bu tersaneleri alan her kıyı eyaleti için bir iç eyaletten §Y1 Askeri Fabrika§! kaldır.\n"
 GER_crossing_the_atlantic_2_factories_tt:0 "Bu tersaneleri alan her kıyı eyaleti için bir iç eyaletten §Y2 Askeri Fabrika§! kaldır.\n"
 GER_crossing_the_atlantic_desc:0 "Yönetimimize karşı tüm kıtasal muhalefeti yendikten sonra, üretim çabamızı büyük bir donanma oluşturmaya yeniden odaklanmalıyız, böylece İngilizler ve Amerikalılarla savaşabiliriz. Tanrı'nın iyi zamanında, tüm gücü ve kudretiyle Eski Dünya, yeni dünyayı boyunduruk altına almak ve aşağılamak için öne çıkana kadar dinlenmeyeceğiz."
 GER_crossing_the_atlantic_trigger_tt:0 "Değil: Herhangi Bir Düşman Ülkesi: \n  Önemli Bir Ülke Olarak Kabul Ediliyor \n  Herhangi Bir Kontrollü Eyalet:\n     §YErupa§!'da!"
 GER_czech_friend:0 "Çekoslovakya ile Dost Ol"
 GER_czech_friend_desc:0 "Çekler ve Slovaklar çalışkan ve takdire şayan insanlardır. Bölgesel hırslarımızın onlarla çatışması talihsizliktir, ancak boyun eğdirmek yerine dostluk peşinde koşmak için çok geç değil."
 GER_danubian_expansion:0 "Tuna Genişlemesi"
 GER_danubian_expansion_desc:0 "Etkimizi [SOV.GetAdjective] saldırganlığına yatkın Balkan uluslarına genişletmeye çalışmalıyız. Tuna üzerindeki diğer uluslara [GER.GetDanubianMembershipDesc] tehdidine karşı üyelik ve koruma sunacağız."
 GER_danubian_membership:0 "Tuna Üyeliği"
 GER_danubian_membership_desc:0 "Avusturya-Macaristan İmparatorluğu'nun Tuna halef ulusları, bizim müttefikimiz olmanın ne anlama geldiğini unutmadılar. Onlara [GER.GetDanubianMembershipDesc] tehdidine karşı üyelik ve koruma sunacağız."
 GER_danzig_for_guarantees:0 "Garanti Karşılığı Danzig"
 GER_danzig_for_guarantees_desc:0 "Polonyalılar kesinlikle [GER.GetDanzigGuaranteesBolsheviksDesc] tehlikesini hissetmelidir. Danzig, Poznan ve Silezya Voyvodalığı'nın geri dönüşü konusunda, [GER.GetDanzigGuaranteesRedsDesc] işgal durumunda askeri destek garantileri karşılığında bir anlaşmaya varabiliriz."
 GER_danzig_or_war:0 "Danzig Ya da Savaş"
 GER_danzig_or_war_POL_civil_war:0 "Destek karşılığında Danzig'i al"
 GER_danzig_or_war_POL_faction_GER_leader:0 "§R[This.GetName], bonusların etkili olması için anlaşmayı onaylamalıdır. Savaş ilan edilirse [Root.GetFactionName] grubundan ayrılırlar.§!\n"
 GER_danzig_or_war_POL_faction_GER_noleader:0 "§R[This.GetName], bonusların etkili olması için anlaşmayı onaylamalıdır. Savaş ilan edilirse [Root.GetFactionName] grubundan ayrılırsınız.§!\n"
 GER_danzig_or_war_desc:0 "Danzig Alman'dı, Danzig Alman kaldı ve Danzig bundan sonra Alman olacak! Eğer Polonya bölgeyi bırakmazsa, Alman halkını kaçınılmaz savaşa hazırlamalıyız. Danzig ve çevresindeki topraklar Almanya'ya geri dönecek!"
 GER_danzig_trigger_polish_civil_war:0 "Polonya'da bir iç savaş var ve aşağıdakilerden biri doğru olmalı:\n      Almanya bir tarafa gönüllü gönderdi\n      Bir taraf Almanya ile aynı grupta"
 GER_danzig_vs_slovakia:0 "Slovakya için Danzig"
 GER_danzig_vs_slovakia_desc:0 "Polonyalılar Lebensraum planlarımızın önünde duruyorlar. Yine de, uzun vadeli önceliklerimizi değiştirmek ve bunun yerine onların dostluğunu aramak için çok geç değil. Bunun gerçekleşmesinin tek olası yolu bir bölge takasıdır; Slovakya için Danzig. Polonya, Zaolzie'yi işgal ederek bölgeye zaten bir ilgi gösterdi."
 GER_demand_memel:0 "Doğu İddialarını Yeniden İleri Sür"
 GER_demand_memel_desc:0 "Büyük Savaş, Polonya'nın yeniden dirilmesi ve Memel'in Litvanya'ya devredilmesiyle Doğu'da birçok Alman toprağının kaybedilmesine neden oldu. Her iki ulusa da bir ültimatom gönderilecek, ancak Polonya, en azından, sadece sözlere boyun eğmeyecektir."
 GER_demand_memel_threat:0 "Almanya Doğu İddialarını Yeniden İleri Sürdü"
 GER_demand_slovenia:0 "Slovenya'yı Talep Et"
 GER_demand_slovenia_desc:0 "Saint-Germain-en-Laye Antlaşması, birçok tarihi Avusturya toprağının halef devletlere geçmesini sağladı. Avusturya, Alman ulusuyla birleştikten sonra bu adaletsizlikleri sona erdirmenin zamanı geldi. Artık Slovenya olarak bilinen tarihi Carniola ve Styria eyaletleri eve getirilmelidir."
 GER_demand_slovenia_threat:0 "Almanya Slovenya'yı Talep Etti"
 GER_demand_sudetenland:0 "Südetland'ı Talep Et"
 GER_demand_sudetenland_desc:0 "Südet Almanlarının kaderi, Versay Antlaşması'nın neden olduğu en kötü adaletsizliklerden biriydi. Çek itirazlarına bakılmaksızın, korumamız altına alınmalılar."
 GER_demand_sudetenland_threat:0 "Almanya Südetland'ı Talep Etti"
 GER_denmark_friend:0 "Danimarka ile Dost Ol"
 GER_denmark_friend_desc:0 "Gambot diplomasisi henüz ölmedi. Deniz genişleme planlarımız küçük kuzey komşumuz tarafından iyi biliniyor. Vastaca üstün ordularımızdan duydukları korkuyla birleşince, onları etki alanımıza korkutmak yeterince kolay olmalı."
 GER_dutch_friend:0 "Hollanda ile Dost Ol"
 GER_dutch_friend_desc:0 "Hollandalılar, başka bir Büyük Savaş durumunda ne kadar dayanacaklarını çok iyi biliyorlar. Almanya'nın Britanya'yı ciddi şekilde tehdit edebileceğine ikna olurlarsa, sert bir işgalden kaçınmak için bizimle ittifakı seçebilirler."
 GER_economic_path_shortcut:0 "Ekonomi"
 GER_end_of_czechoslovakia:0 "Çekoslovakya'nın Kaderi"
 GER_end_of_czechoslovakia_desc:0 "Eski Çek topraklarını doğru bir şekilde yönetebilenler arasında bölme zamanı geldi. Ayrıca doğuda ayrı bir Slovak kukla devleti oluşturmayı da düşünmeliyiz."
 GER_expatriate_the_communists:0 "Komünistleri Sürgün Et"
 GER_expatriate_the_communists_desc:0 "Komünizmin iç tehdidi ulusumuzu rahatsız etmeye devam ediyor. Bağlıların nereye kaçtığına bakılmaksızın, bundan kurtulmalıyız."
 GER_fan_the_prussian_militarism:0 "Prusya Militarizmini Canlandır"
 GER_fan_the_prussian_militarism_desc:0 "İç savaş kayıplarımızı telafi etmek için, yeni askerlerin işe alınmasını ve eğitimini iyileştirmek için Prusya militarizm duygusuna başvurmalıyız. Ordumuzun bizi Nazi diktatörlüğünden kurtarmış olması, bu Prusya ideallerinin artık her zamankinden daha popüler olmasını sağlıyor."
 GER_fate_of_greece:0 "Yunanistan'ın Kaderi"
 GER_fate_of_greece_desc:0 "Yunanistan, Avrupa'da serbest bırakılan yeni güçlerle başa çıkamadığını kanıtladı. Onlara sadece Almanya'nın sağlayabileceği korumayı sunmanın zamanı geldi."
 GER_fate_of_yugoslavia:0 "Yugoslavya'nın Kaderi"
 GER_fate_of_yugoslavia_desc:0 "Yugoslav devleti her zaman yapay bir yapıydı ve merkezi otorite çökmeye başladı. Düzeni yeniden sağlamak için müdahale etmeliyiz. Karşılaştığımız tek soru, bunu yapmanın en iyi yolunun ne olacağıdır."
 GER_finnish_membership:0 "Finlandiya Üyeliği"
 GER_finnish_membership_desc:0 "Avrupa'nın merkezinden uzakta olan Finler, [GER.GetFinnishMembershipDesc] ile tek başlarına yüzleşme riski taşıyorlar. Ama zorunda değiller. Onlara [GER.GetDanubianMembershipDesc] tehdidine karşı üyelik ve koruma sunacağız."
 GER_first_ljubljana_award:0 "Birinci Ljubljana Ödülü"
 GER_first_ljubljana_award_desc:0 "İkiyüzlü batılı güçler, birçok azınlığı Sırpların yönetimine teslim ederken ulusal kendi kaderini tayin hakkını vaaz ettiler. Bu tarihi yanlışı düzeltmek ve aynı zamanda dost edinmek için bir konumdayız. Avrupa düzeninde bizimle taraf olmak isteyenler için çok cömert olabiliriz."
 GER_first_ljubljana_award_tt:0 "Tüm orijinal [YUG.GetAdjective] çekirdek eyaletleri ya §Y[YUG.GetName]§! ya da tebaalarından herhangi biri tarafından sahipleniliyor.\n"
 GER_first_vienna_award:0 "Birinci Viyana Ödülü"
 GER_first_vienna_award_desc:0 "Macarlar, Büyük Savaş'tan sonra en çok acı çeken halklardan biriydi. Avusturya-Macaristan İmparatorluğu'nun katliamında, birçok Macar, ataları yüzyıllardır orada yaşamış olmasına rağmen yabancı topraklarda mahsur kaldı. Çekoslovakya'dan bazı toprakları onlara vererek Macaristan ile ilişkilerimizi büyük ölçüde geliştirebiliriz."
 GER_focus_on_the_true_enemy:0 "Gerçek Düşmana Odaklan"
 GER_focus_on_the_true_enemy_desc:0 "Düşmanlarımız içeride değil, dışarıda bulunuyor. Batı'nın sömürge tekelinin devam eden suçu, güneşte yerimizi aramaya çalıştığımızda maruz kaldığımız Versay Antlaşması'nın adaletsizliğiyle ancak gölgeleniyor. Şimdi sona eriyor."
 GER_four_year_plan:0 "Dört Yıllık Plan"
 GER_four_year_plan_desc:0 "Ulusun yeniden silahlanması ve nihai kendi kendine yeterliliği için iddialı bir plana ihtiyacımız var. Bu, önümüzdeki dört yıl içinde başarılmalıdır."
 GER_german_war_economy:0 "Alman Savaş Ekonomisi"
 GER_german_war_economy_desc:0 "Büyük ulusumuzun insanları, savaş çabaları için kullanılmalı. Her erkeğin kendi payına düşeni yapması beklenen tam bir savaş ekonomisine geçiş yapacağız."
 GER_grosraumwirtschaft:0 "Großraumwirtschaft"
 GER_grosraumwirtschaft_desc:0 "Almanya'yı Avrupa'nın merkezindeki kaderine hazırlamalıyız. Altyapımız Batı'yı Doğu ile, Güney'i Kuzey ile birleştirecek."
 GER_hermann_goring_werke:0 "[Root.GetHermannGoringWerkeName]"
 GER_hermann_goring_werke_desc:0 "Özel kapitalistlerin değişken etkisinden kurtulmalıyız. Bu nedenle, madencilik ve çelik sektörlerindeki büyümeyi denetlemek için kontrolümüz altında bir sanayi holdingi kuracağız, çünkü bu, askeri sanayimizin omurgasını oluşturacaktır."
 GER_historical_path_shortcut:0 "Politika: Tarihi"
 GER_improve_national_spirit:0 "Ulusal Ruhu İyileştir"
 GER_improve_national_spirit_desc:0 "Büyük Savaş'ın galiplerinin başkentleri elimizdeyken, nihayet yenilgimizin gölgesini üzerimizden atabiliriz. Almanya için yeni bir çağ başlıyor!"
 GER_improve_national_spirit_tooltip:0 "Biz veya Grubumuz üyeleri, Londra ve Paris'i ve bunların bulunduğu eyaletleri kontrol etmeliyiz."
 GER_integrate_war_economies:0 "Savaş Ekonomilerini Entegre Et"
 GER_integrate_war_economies_desc:0 "Etki alanımızdaki uluslar bize aşırı ekonomik bağımlılıklar geliştirmiştir. Bunu, ekonomileri üzerindeki kontrolümüzü ve dış politikaları üzerindeki etkimizi artırmak için kullanabiliriz."
 GER_integrate_war_economies_tt:0 "Eğer §Y[HUN.GetName]§!, §Y[Root.GetName]§! ile aynı grupta ise, §Y[Root.GetName]§! ve §Y[HUN.GetName]§!'a her birine §Y4 Askeri Fabrika§! ekle ve §Y[HUN.GetName]§!, §Y[Root.GetName]§!'ın kuklası olur.\n"
 GER_integrate_war_economies_tt2:0 "Eğer §Y[ROM.GetName]§!, §Y[Root.GetName]§! ile aynı grupta ise, §Y[Root.GetName]§! ve §Y[ROM.GetName]§!'a her birine §Y4 Askeri Fabrika§! ekle ve §Y[ROM.GetName]§!, §Y[Root.GetName]§!'ın kuklası olur.\n"
 GER_integrate_war_economies_tt3:0 "§R[HUN.GetName] bonusların etkili olması için anlaşmayı onaylamalıdır.§!\n"
 GER_integrate_war_economies_tt4:0 "§R[ROM.GetName] bonusların etkili olması için anlaşmayı onaylamalıdır.§!\n"
 GER_italy_ally:0 "İtalya ile İttifak"
 GER_italy_ally_desc:0 "İtalyanlar güvenilmez olabilir - Büyük Savaş'ta kanıtladıkları gibi - ancak Mussolini ve Faşist hareketi, İtalya için hala umut olduğunu gösterdi. Almanya, İtalya ile ittifak kurarak kesinlikle sadece kazanacaktır, değil mi?"
 GER_italy_declined_assassination_tt:0 "§Y[ITA.GetNameWithFlag]§! suikast teklifimizi reddetmedi"
 GER_japan_friend:0 "Japonya ile Dost Ol"
 GER_japan_friend_desc:0 "Çin ile uzun zamandır verimli bir ilişkimiz oldu, ancak hırslarımız Çin'i kurtlara atmak anlamına gelse bile, bunun yerine Japonya'nın akraba savaşçı kültürüyle hizalanarak daha iyi hizmet edebiliriz..."
 GER_japan_friend_tt:0 "von Falkenhausen'i geri çağırır.\n"
 GER_kdf_wagen:0 "[Root.GetKdfWagenName]"
 GER_kdf_wagen_desc:0 "Vatandaşlarımızın, biriktirme planıyla kendi gelecekteki 'halk arabalarını' satın almalarına izin vereceğiz ve bu parayı da bu arabaların yapımına katkıda bulunacak fabrikaların inşasını finanse etmek için kullanacağız."
 GER_long_range_escorts:0 "Uzun Menzilli Eskortlar"
 GER_long_range_escorts_desc:0 "Taktik ve stratejik bombardıman uçaklarımız, hedef alana ve geri dönüşe kadar koruma sağlamak için daha uzun menzilli eskortlara ihtiyaç duyar."
 GER_low_countries_membership:0 "Aşağı Ülkeler Üyeliği"
 GER_low_countries_membership_desc:0 "Avrupa'nın doğu sınırlarından uzak olsalar da, Aşağı Ülkeler, Orta Avrupa düşerse sıranın kendilerine geleceğini biliyorlar. Onlara, komünizm tehdidine karşı bizimle birlikte durabilmeleri için üyelik teklif edeceğiz."
 GER_mackensen_dead:0 "Von Mackensen öldü."
 GER_military_doctrine_shortcut:0 "Ordu"
 GER_modular_construction:0 "Modüler İnşaat"
 GER_modular_construction_desc:0 "Denizaltılarımızın parçalarını çeşitli inşaat tesislerinde inşa ederek, montaj ve inşaat hızı büyük ölçüde artırılır."
 GER_mol_rib_pact:0 "[GER.GetMolotovRibbentropName]"
 GER_mol_rib_pact_desc:0 "[GER.GetTheUSSRName] ile dostluk ve saldırmazlık antlaşması mideleri bulandırabilir, ancak değerli petrollerinin Almanya'ya akmaya devam etmesini sağlayacaktır. Gizli ek protokol, Romanya, Polonya, Litvanya, Letonya, Estonya ve Finlandiya topraklarını [GER.GetAdjective] ve [SOV.GetAdjective] etki alanlarına ayıracaktır..."
 GER_mol_rib_pact_tt:0 "§YSovyetler Birliği§! ile bir §Ysaldırmazlık paktı§! yapın ve Polonya'yı [SOV.GetName] ve Almanya arasında §Ybölmeye§! razı olun.\n"
 GER_nationalist_spain_ally:0 "İspanya ile İttifak"
 GER_nationalist_spain_ally_desc:0 "İspanya İç Savaşı'nda milliyetçi zafer, iki ülkemiz arasında daha yakın bir ilişki için zemin hazırladı. Franco, Akdeniz'in anahtarını elinde tutuyor."
 GER_nationalist_spain_ally_tt:0 "§YMilliyetçi İspanya§! ile diplomatik ilişkileri artırır!"
 GER_naval_doctrine_shortcut:0 "Donanma"
 GER_naval_effort2:0 "Tersane Tesislerini Genişlet"
 GER_naval_effort2_desc:0 "Gerçekten dikkate değer bir donanmayı yeniden inşa etmek için, gemi inşa kapasitemizi büyük ölçüde genişletmeliyiz."
 GER_naval_effort2_tt:0 "§Y[ROOT.GetFlag][ROOT.GetNameDef]§! tarafından kontrol edilen §Y2§! kıyı eyaletinde §Y2 Deniz Tersanesi§! inşa eder!"
 GER_naval_rearmament:0 "Donanma Yeniden Silahlanması"
 GER_naval_rearmament_desc:0 "1935'te sağladığımız İngiliz-Alman Deniz Anlaşması, donanmamızı büyük ölçüde genişletmemize olanak tanıyor. Bunu yapmak için hiçbir çabadan kaçınmamalıyız."
 GER_no_balkan_communism:0 "Balkanlarda Komünizm Yok"
 GER_no_balkan_communism_BUL_tt:0 "§YBulgaristan Sosyalist Cumhuriyeti§!'ne karşı §YHükümeti Devir§! savaş hedefi kazanır.\n"
 GER_no_balkan_communism_HUN_tt:0 "§YMacar Halk Cumhuriyeti§!'ne karşı §YHükümeti Devir§! savaş hedefi kazanır.\n"
 GER_no_balkan_communism_ROM_tt:0 "§YRomanya Halk Cumhuriyeti§!'ne karşı §YHükümeti Devir§! savaş hedefi kazanır.\n"
 GER_no_balkan_communism_YUG_tt:0 "§YSFR Yugoslavya§!'ya karşı §YHükümeti Devir§! savaş hedefi kazanır.\n"
 GER_no_balkan_communism_desc:0 "Balkanlara komünist etkiler sızdı, buna izin veremeyiz. Kök salmadan yok edilmeli."
 GER_no_balkan_communism_tt:0 "Balkanlardaki komünist uluslara karşı §YHükümeti Devir§! savaş hedefleri kazanır.\n"
 GER_no_reds_in_western_europe:0 "Batı Avrupa'da Kızıllar Yok"
 GER_no_reds_in_western_europe_BEL_tt:0 "§YBelçika Kooperatifi§!'ne karşı §YHükümeti Devir§! savaş hedefi kazanır.\n"
 GER_no_reds_in_western_europe_FRA_tt:0 "§YFransız Komünü§!'ne karşı §YHükümeti Devir§! savaş hedefi kazanır.\n"
 GER_no_reds_in_western_europe_HOL_tt:0 "§YHalkın Birleşik Eyaletleri§!'ne karşı §YHükümeti Devir§! savaş hedefi kazanır.\n"
 GER_no_reds_in_western_europe_LUX_tt:0 "§YRóża Luksemburg§!'a karşı §YHükümeti Devir§! savaş hedefi kazanır.\n"
 GER_no_reds_in_western_europe_desc:0 "Batı Avrupa'ya komünist etkiler sızdı, buna izin veremeyiz. Kök salmadan yok edilmeli."
 GER_no_reds_in_western_europe_tt:0 "Aşağı Ülkeler ve Fransa'daki komünist uluslara karşı §YHükümeti Devir§! savaş hedefleri kazanır.\n"
 GER_norway_friend:0 "Norveç ile Dost Ol"
 GER_norway_friend_desc:0 "Norveç, kuzey İsveç'teki devasa madenlerden gelen değerli demir ihracatının çoğunu kontrol ediyor. Genişleyen donanmamızın tehdidiyle onları 'dostluğa' korkutmalıyız."
 GER_operation_tannenbaum:0 "Tannenbaum Operasyonu"
 GER_operation_tannenbaum_desc:0 "İsviçre en iğrenç ve sefil insanlara ve siyasi sisteme sahiptir. Yeni Almanya'nın bu ölümcül düşmanlarıyla nihayet ilgilenme zamanımız geldi."
 GER_oppose_hitler:0 "Hitler'e Karşı Çık"
 GER_oppose_hitler_civil_war:0 "§RFaşist destekçiler bir iç savaş başlatacak.§!\n"
 GER_oppose_hitler_desc:0 "Hitler'in hükümdarlığı sona ermeli. Rheinland'ı yeniden askerileştirerek Batı güçlerini kışkırtmak istiyor, ancak bunu yapmak, Wehrmacht'taki sadık unsurların yardımıyla iktidarı ele geçirmemiz için bize bahane verecektir."
 GER_oppose_hitler_shortcut:0 "Politika: Muhalefet"
 GER_ostwall:0 "Ostwall"
 GER_ostwall_desc:0 "Doğu'daki kazanımlarımıza rağmen, eğer gidişat değişirse düşman ilerlemesini durdurabileceğimizi sağlamalıyız. Karadeniz'den Baltık Denizi'ne, Dinyeper nehri boyunca bir tahkimat hattı, Panther-Wotan mevzii inşa etmeliyiz."
 GER_ostwall_forts:0 "Fraksonunuz tarafından tamamen kontrol edilen aşağıdaki eyaletlerin her birinde, Dinyeper nehri boyunca Baltık Denizi'ne kadar §YKara Kaleleri§! yerleştirin:\n"
 GER_ostwall_forts_2:0 "§YTartu§!\n§YPskov§!\n§YNevel§!\n§YVitebsk§!\n§YMinsk§!\n§YBobruysk§!\n§YMozyr§!\n§YKiev§!\n§YCherkasy§!\n§YDnipropetrovsk§!\n§YZaporozhe§!\n"
 GER_ostwall_tt:0 "Grubumuzun bir üyesinin kontrolünde.\n"
 GER_our_place_in_the_sun:0 "Güneşteki Yerimiz"
 GER_our_place_in_the_sun_desc:0 "Herkes bilsin ki Alman İmparatorluğu bir kez daha güneşteki yerini alma hakkını ileri sürüyor! Halkımız artık gölgelerde aşağılanmayacak."
 GER_plan_z:0 "Plan Z"
 GER_plan_z_desc:0 "Amiral Raeder, İngilizlerin en iyi yüzey saldırısı politikasıyla yenilebileceğine inanıyor. Bunu başarmak için yeterli sayıda zırhlı ve uçak gemisi inşa etmek büyük bir görev olacak ve zaman alacaktır; belki de çok fazla zaman... Öte yandan, mevcut yüzey donanmamız acınası bir şekilde yetersizdir."
 GER_poland_friend:0 "Polonya ile Dost Ol"
 GER_poland_friend_desc:0 "Polonya'nın artık denize erişimi olmasa da, Slovakya'yı onlara vererek iyi niyetimizi kanıtladık. Belki de doğudaki gelecekteki bölgesel kazanımlara dair belirsiz vaatlerde bulunarak onları bize daha da yakınlaştırabiliriz."
 GER_polish_membership:0 "Polonya Üyeliği"
 GER_polish_membership_desc:0 "Polonyalıların tüm komşularına karşı güvensizlikleri var, ancak en büyük tehdidin Doğu'dan geldiğini biliyorlar. Onlara [GER.GetDanubianMembershipDesc] tehdidine karşı üyelik ve koruma sunacağız."
 GER_pool_technical_know_how:0 "Teknik Bilgi Birikimini Paylaş"
 GER_pool_technical_know_how_desc:0 "Her ulusun endüstriyi yönetme ve ekipmanı sürdürme konusunda kendi yöntemleri vardır. Bu bilgiyi ittifakın diğer üyeleri arasında yaymak için teknik ekipler göndererek birbirimizden öğrenebiliriz."
 GER_pool_technical_know_how_tt:0 "§YGrubumuzdaki§! her §YUlus§! da bu §YUlusal Ruh§!'u alacaktır."
 GER_prepare_for_the_next_blockade:0 "Bir Sonraki Ablukaya Hazırlan"
 GER_prepare_for_the_next_blockade_desc:0 "Cehennemi İngiliz ablukası bize son savaşı kaybettiren şeydi. Aynı hatayı bir daha yapmayacağız. Bu kez, halkı geleceğe hazırlamak için daha da büyük çabalara girişeceğiz."
 GER_prepare_italian_coup:0 "İtalyan Darbesini Hazırla"
 GER_prepare_italian_coup_desc:0 "İtalya'nın faşizme düşüşü geri alınmalı. İtalyan kralcılarına desteğimizle bir darbe teklifiyle yaklaşacağız."
 GER_prepare_italian_coup_tt:0 "Teklifimizi kabul ederlerse:\n"
 GER_pride_of_the_modern_germany:0 "Modern Almanya'nın Gururu"
 GER_pride_of_the_modern_germany_desc:0 "Kraliyet İngiliz Donanması'nı büyüklük olarak yakalamak yıllar alacak. Bu yüzden, onu kalitede aşmalıyız. Gemilerimiz şimdiye kadar denizlerde seyreden en modern ve güçlü gemiler olacak!"
 GER_rebuild_the_high_seas_fleet:0 "Açık Deniz Filosunu Yeniden İnşa Et"
 GER_rebuild_the_high_seas_fleet_desc:0 "Batı'ya başarılı bir şekilde meydan okuyacaksak, bir zamanlar görkemli olan Açık Deniz Filomuzu yeniden inşa etmek için büyük bir deniz inşaat programına ihtiyacımız var."
 GER_rebuild_the_nation:0 "Ulusumuzu Yeniden İnşa Et"
 GER_rebuild_the_nation_desc:0 "İç savaşın yıkımından sonra, ulusumuzu yeniden inşa etmeye bakmalıyız. Bu hedefe ulaşmak için tüm kaynaklarımızı odaklayabilmek için halktan bir süreliğine kişisel konforlarını bir kenara bırakmalarını isteyeceğiz."
 GER_reestablish_free_elections:0 "Serbest Seçimleri Yeniden Kur"
 GER_reestablish_free_elections_desc:0 "Yakın gelecekte yapılacak serbest seçimleri yeniden kurarak demokratik ideallere geri döneceğiz."
 GER_reichskommissariats_tt:0 "Fethedilen topraklarda §YReichskommissariatlar§! ve §YProtektoralar§! gibi özel §YBağlı Devletlerin§! ve §Yİdari Birimlerin§! kurulmasına olanak tanır. Ayrıca, Avrupa'nın öngörülen nüfuz alanlarına bölünmesini de sağlar.\n"
 GER_reinstate_imperial_possessions:0 "İmparatorluk Mülklerini Yeniden Kur"
 GER_reinstate_imperial_possessions_desc:0 "Tarihi Alman bölgelerinin başarılı bir şekilde yeniden fethiyle, şimdi onları [Root.GetName]'a tam teşekküllü eyaletler olarak yeniden kurma sürecine başlayabiliriz. Versay'ın son utancı nihayet ortadan kalktı!"
 GER_reintegrate_luxemburg_and_alsace_lorraine:0 "Lüksemburg ve Alsace-Lorraine'i Yeniden Entegre Et"
 GER_reintegrate_luxemburg_and_alsace_lorraine_desc:0 "Tarihsel olarak Alman bölgelerinin başarılı bir şekilde yeniden fethiyle, şimdi onların [Root.GetName]'a yeniden entegrasyon sürecine başlayabiliriz. Nüfuslarının vatan için vatansever görevlerini yapmalarına izin verilmelidir."
 GER_rekindle_imperial_sentiment:0 "İmparatorluk Duygusunu Yeniden Canlandır"
 GER_rekindle_imperial_sentiment_desc:0 "Avusturya-Macaristan İmparatorluğu Büyük Savaş'tan sonra parçalanmış olsa da, İmparatorluğun geçişini yas tutanlar hala bulunabilir. Halef devletlerin kendi güçleri için yeniden birleşmeye karar vermeleri umuduyla bu emperyal duyguları geliştireceğiz."
 GER_rekindle_imperial_sentiment_tt:0 "Bağlantısız destek yeterince yüksek olduğunda, bu ulusların Avusturya-Macaristan İmparatorluğu'nu yeniden kurmaları ve Merkez Devletleri'ne katılmaları için kararlar alınmasını sağlar.\n"
 GER_rekindle_imperial_sentiment_tt_2:0 "Bağlantısız destek yeterince yüksek olduğunda, bu ulusların Avusturya-Macaristan İmparatorluğu'nu yeniden kurmaları ve Mitteleuropa'ya katılmaları için kararlar alınmasını sağlar.\n"
 GER_return_of_the_kaiser:0 "Kaiser'in Dönüşü"
 GER_return_of_the_kaiser_desc:0 "Kaiserreich'in bir kaisere ihtiyacı var ve II. Wilhelm hala Hollanda'da sürgünde yaşıyor. Sürgününü kaldıracak ve Batı Demokrasilerinin ne düşündüğüne bakmaksızın tahta dönmeye davet edeceğiz."
 GER_reverse_the_brain_drain:0 "Beyin Göçünü Tersine Çevir"
 GER_reverse_the_brain_drain_desc:0 "Baskıcılar ve otoriter rejimler yenildiğine göre, ülkeden kaçan bilim insanları için vatanlarına dönmeyi ve yeniden orada çalışmayı çekici hale getirmeye çalışabiliriz."
 GER_revive_the_kaiserreich:0 "Kaiserreich'i Canlandır"
 GER_revive_the_kaiserreich_desc:0 "Son on yılda yaşanan olaylar, demokrasinin kötü niyetli iç unsurları uzak tutmak için çok zayıf olduğunu gösterdi. Bir Kaiser'in güçlü liderliğine geri dönmeliyiz ve onun dönüşüne hazırlık olarak anayasayı Deutsches Kaiserreich'in anayasasına geri çevireceğiz."
 GER_revive_the_kaiserreich_tt:0 "§YAlman Askeri Cuntası§!, §YAlman İmparatorluğu§! olarak bilinecektir.\n"
 GER_rhineland:0 "Rheinland"
 GER_rhineland_desc:0 "Rheinland, Büyük Savaş'ın sonundan bu yana askerden arındırılmıştı, ancak bu hakaret daha fazla durmayacak! Almanya egemen bir ulustur ve sınırları içindeki herhangi bir yere asker göndermekte özgürdür!"
 GER_rhineland_ultimatum:0 "§RAskerden arındırma, karşı konulur ve geri çekilirseniz tersine çevrilebilir.§!\n"
 GER_rocketry_focus:0 "Roketçilik"
 GER_rocketry_focus_desc:0 "Roket itkisi, üç askeri branşın tamamında büyük yeniliklerin anahtarını elinde tutuyor."
 GER_safeguard_the_baltic:0 "Baltık'ı Güvence Altına Al"
 GER_safeguard_the_baltic_desc:0 "Baltıklar birkaç on yıl öncesine kadar Rus İmparatorluğu'nun bir parçasıydı ve [GER.GetRussiansDemonym]'in onları yeniden ilhak etmeye çalışması mantıklıdır. Bunu önlemeli ve [SOV.GetAdjective] işgali durumunda askeri desteğimizi sunmalıyız."
 GER_scandinavian_membership:0 "İskandinav Üyeliği"
 GER_scandinavian_membership_desc:0 "Dağlar ve soğuk, [GER.GetGreatRedMenaceName] Tehdit'e karşı koruma sağlamaz ve İskandinavlar bunu bilmelidir. Onlara [GER.GetDanubianMembershipDesc] tehdidine karşı üyelik ve koruma sunacağız."
 GER_schlieffen_once_more:0 "Bir Kez Daha Schlieffen"
 GER_schlieffen_once_more_desc:0 "Maginot hattı aşılmalıdır. Bir kez daha Belçika ve Lüksemburg'dan geçerek, zafer için hızlı bir darbe indireceğiz."
 GER_second_ljubljana_award:0 "İkinci Ljubljana Ödülü"
 GER_second_ljubljana_award_desc:0 "Yugoslavya sorunu çözüldüğüne göre, dikkatimizi Yunanistan'a çevirmenin zamanı geldi. Onlar da Müttefikler tarafından haksız yere büyütüldü. Gerçek dostlarımızın kim olduğunu görme zamanı."
 GER_second_ljubljana_award_tt:0 "Etkinlik, [Root.GetName] veya değerli bir müttefik için toprak talep etme imkanı verir."
 GER_second_vienna_award:0 "İkinci Viyana Ödülü"
 GER_second_vienna_award_desc:0 "Transilvanya'da Macar çoğunluğu var ve haklı olarak Macaristan'daki dostlarımıza ait olmalı. Ancak, Romanya rejiminin ve halkının bu talebe nasıl tepki vereceğini söylemek zor."
 GER_secure_the_new_state:0 "Yeni Devleti Güvence Altına Al"
 GER_secure_the_new_state_desc:0 "Onu oluşturan iç savaş ışığında, geçici hükümet güçsüz. Güvence altına alındığından ve kolayca devrilemeyeceğinden emin olmalıyız."
 GER_see_to_the_eastern_front:0 "Doğu Cephesine Bak"
 GER_see_to_the_eastern_front_desc:0 "Büyük Savaş'tan öğrendiğimiz bir şey varsa, o da dış doğu topraklarımıza yönelik bir saldırıya hazırlanmamız gerektiğidir. Bu topraklar restore edilmeli ve işgale karşı güçlendirilmelidir."
 GER_see_to_the_eastern_front_tt:0 "Doğu sınırındaki 3 eyalete 6 §YKara Kalesi§! ekle.\n"
 GER_see_to_the_eastern_front_tt2:0 "Doğu sınırındaki 4 eyalete 8 §YKara Kalesi§! ekle.\n"
 GER_shared_rd_programs:0 "Ortak Ar-Ge Programları"
 GER_shared_rd_programs_desc:0 "Davamızın iyiliği için bilimsel bilgimizi birleştirmeli ve teknolojik ilerlemelerimizi yeni müttefiklerimizle paylaşmalıyız."
 GER_soviet_ally:0 "[GER.GetTheUSSRName] ile İttifak"
 GER_soviet_ally_desc:0 "Belki de [GER.GetRussiansDemonym] ile aramızdaki [GER.GetUSSRAllianceDesc] farklılıklarını bir kenara bırakıp, bizi birleştiren şeye odaklanmak mümkündür: bencil liberalizme ve yozlaşmış Batı'ya duyulan nefret. [GER.GetTheUSSRName] ile bir müttefik olarak, askeri güçlerinin yanı sıra, ihtiyacımız olan tüm kaynaklara erişimimiz olacaktır..."
 GER_soviet_treaty:0 "[GER.GetTheUSSRName] ile Antlaşma"
 GER_soviet_treaty_desc:0 "[SOV.GetNameDef] ile yeni bir araştırma antlaşması yaparak, başlıca daha iyi tanklar geliştirebiliriz. Eğer kabul ederlerse, 1933'te Kama'da kapattığımız tank okulunu yeniden açabiliriz. [SOV.GetAdjective] işbirliği, elbette, yapılan yeniliklerden onların da faydalanacağı anlamına gelecektir..."
 GER_spain_wargoal_tt:0 "§YCumhuriyetçi İspanya§!'ya karşı §Yİlhak§! savaş hedefi kazanır.\n"
 GER_strategic_air_effort:0 "Stratejik Hava Çabası"
 GER_strategic_air_effort_desc:0 "Zafer, düşmanın endüstrilerini yok ederek elde edilecek. Stratejik bombardıman uçaklarının tasarımına ve üretimine odaklanmalıyız."
 GER_strike_at_the_source:0 "Kaynağa Saldır"
 GER_strike_at_the_source_desc:0 "Korku içinde yaşamak hayat değildir; yaşam tarzımıza yönelik bu tehdidi bir kez ve sonsuza dek sona erdirmeliyiz. Avrupa'daki [GER.GetStrikeAtTheSourceDesc]'in kaynağı yok edilmelidir."
 GER_support_the_finns:0 "Finlandiya'yı Destekle"
 GER_support_the_finns_desc:0 "Finler kendilerini [GER.GetRussiansDemonym]'in ateş hattında buluyorlar. Komünist tehdide karşı onlara bir garanti sunacak ve onlara mütevazı endüstriyel yardımda bulunacağız."
 GER_sweden_friend:0 "İsveç ile Dost Ol"
 GER_sweden_friend_desc:0 "İskandinav ülkeleri dominolar gibidir; birlikte dururlar ve düşerler. Norveç ve Danimarka bizim etki alanımızdayken, İsveç kesinlikle onları takip edecektir."
 GER_swedish_trade_agreement:0 "Alman-İsveç Ticaret Anlaşması"
 GER_swedish_trade_agreement_desc:0 "Çeliğimiz kalitesiz ve savaş makinemizi beslemek için en iyi malzemeye ihtiyacımız var. Neyse ki kuzeydeki [SWE.GetName] ideal bir ortak; mevcut yüksek kaliteli kaynaklar, tarafsız ve gelecekteki planlarımız gerçekleştiğinde çok fazla sorun çıkarması pek olası değil."
 GER_synthetic_rubber:0 "Sentetik Kauçuk"
 GER_synthetic_rubber_desc:0 "Büyük ölçekli motorizasyon ve havacılık, çok miktarda kauçuk gerektirir ve bizde hiç kaynak bulunmamaktadır. Sentetik olarak üretme yöntemimizi geliştirmeliyiz."
 GER_tackle_the_communist_threat:0 "[GER.GetTackleCommunistThreatName] Tehdidiyle Mücadele Et"
 GER_tackle_the_communist_threat_desc:0 "[SOV.GetNameDef] var olduğu sürece, bizim için bir tehdit olacaktır. Onların saldırmasını beklemek yerine, inisiyatifi kendi ellerimize alacağız."
 GER_tactical_air_effort:0 "Taktik Hava Çabası"
 GER_tactical_air_effort_desc:0 "Zafer, düşmanın kara kuvvetlerini yok ederek elde edilecek. Yakın ve derin hedeflere yönelik taktik saldırılarla kendi ordularımızı desteklemeye odaklanmalıyız."
 GER_the_central_powers:0 "Merkez Devletleri"
 GER_the_central_powers_desc:0 "Batı'ya karşı durmak için müttefiklere ihtiyacımız var. Demokrasilerin baskısına karşı durmak için kendi grubumuzu oluşturacağız."
 GER_the_great_red_menace:0 "Büyük [GER.GetGreatRedMenaceName] Tehdit"
 GER_the_great_red_menace_desc:0 "Önceki savaşta yaptığımız eylemler hala birçok kişinin hafızasında taze. Kıtanın korkularını gerçek tehlikeye odaklamalıyız: Doğu'da beliren büyük [GER.GetGreatRedMenaceDesc]. Kıtanın gözlerini açmak için büyük bir propaganda kampanyası başlatacağız."
 GER_the_iberian_problem:0 "İber Sorunu"
 GER_the_iberian_problem_desc:0 "Komünizmin kaleleri hala duruyor. Başta komünist İspanya olmak üzere hepsinin kökünün kazınmasını sağlamalıyız."
 GER_the_mannheim_project:0 "Mannheim Projesi"
 GER_the_mannheim_project_desc:0 "Norveç'teki Ağır Su tesisleri artık kontrolümüz altında olduğuna göre, atomun sırlarını çözme ve onu [GER.GetDanzigGuaranteesBolsheviksDesc]'e karşı silahlandırma çabalarımızı iki katına çıkarabiliriz."
 GER_the_mannheim_project_tt:0 "Bu odak, mevcut Atom Araştırması düzeyine bağlı olarak farklı ödüller verir:\n\n"
 GER_the_monarchy_compromise:0 "Monarşi Uzlaşması"
 GER_the_monarchy_compromise_desc:0 "Nazi tiranlığından kurtuluşumuz için savaşan ordu, açıkça kralcı eğilimlere sahip. Ulusun izlediği yoldan memnuniyetlerini sağlamak için bir uzlaşma yapmalı ve monarşinin geri dönüşüne izin vermeliyiz."
 GER_trade_interdiction_desc_old:0 "Tersanelerimiz U-bot üretmeye kararlı, ancak bu 'kurt sürülerini' kullanmanın daha iyi yollarını geliştirmeliyiz. Amiral'lere simülasyonlarını ve savaş oyunlarını yürütmeleri için ihtiyaç duydukları her şeyi verin..."
 GER_trade_interdiction_old:0 "Ticaret Engellemesi"
 GER_turkey_friend:0 "Türkiye ile Dost Ol"
 GER_turkey_friend_desc:0 "Atatürk'ün Türkiye'si takdire şayan bir modernleşme yolunda ilerliyor ve ülke Boğazlar ve Çanakkale Boğazı üzerinden Karadeniz'e erişimi kontrol ediyor. Türkiye'yi etki alanımıza sokmak birinci önceliğimiz olmalı!"
 GER_turkey_puppet:0 "Türkiye'yi Kukla Yap"
 GER_turkey_puppet_desc:0 "Türkiye, biz ve Sovyetler Birliği arasında bir mengenede kaldı. Baskı altında, Türkler büyük olasılıkla irademize boyun eğecek ve bir kukla devlete dönüşecek. Anlaşmanın bir parçası olarak, SSCB doğu Türkiye'de biraz toprak alacak. Ancak taleplerimizi reddederlerse, bu savaş anlamına gelir."
 GER_u_boat_effort:0 "U-Bot Çabası"
 GER_u_boat_effort_desc:0 "Komodor Dönitz, Britanya'yı diz çöktürmenin en iyi yolu olarak sınırsız denizaltı savaşı stratejisini savunuyor. Yeterli sayıda U-bot ile, İngiliz yerel endüstrilerini uzaktaki imparatorluğundan gereken tüm kaynaklardan mahrum bırakabiliriz."
 GER_uplift_the_rosenberg_office:0 "Rosenberg Ofisini Yükselt"
 GER_uplift_the_rosenberg_office_desc:0 "Reich içinde, işgal altındaki toprakların yönetimi ve kontrolü, iç gözetim ve Nazi Partisi'nin tüm entelektüel ve ideolojik eğitimi de dahil olmak üzere birçok şeyin uygun şekilde koordine edilmesi gerekiyor. Rosenberg önemli bir parti teorisyeni ve ideologu olduğundan, tüm bunlar merkezi olarak Rosenberg Ofisi'nden kararlaştırılmalı ve kontrol edilmelidir."
 GER_ussr_war_goal:0 "[GER.GetTheUSSRName] ile Savaş"
 GER_ussr_war_goal_desc:0 "Propaganda çabalarımızı Alman halkını - ve dünyayı - [SOV.GetNameDef] ile haklı bir savaşa hazırlamaya odaklayabiliriz."
 GER_war_with_france:0 "Fransa ile Savaş"
 GER_war_with_france_desc:0 "Almanya, doğu sınırı sorununa şimdilik tatmin edici bir çözüm bulduğuna göre, dikkatimizi batıya çevirme zamanı. Alsace-Lorraine'in kaybı Alman halkının onurunda bir lekedir ve sadece adil ve haklı bir savaşla bunun intikamını alabiliriz."
 GER_war_with_france_threat:0 "Fransız toprakları üzerinde iddialar"
 GER_war_with_greece:0 "Yunanistan ile Savaş"
 GER_war_with_greece_desc:0 "Yunanistan zaten savaşta olduğuna göre, Almanya'nın Doğu Akdeniz'de bir üs edinme fırsatını kaçırması yazık olurdu."
 GER_weserubung:0 "Weserübung Operasyonu"
 GER_weserubung_desc:0 "Norveç kritik bir stratejik noktadır ve İsveç ile olan çelik ticaretimizi bozmak isteyen herhangi bir düşman için açık bir saldırı noktası olacaktır. Düşmanlarımızın bu bölgede üs kurma riskini alamayız. Norveç'in işgali için iyi bir sahne alanı elde etmek için önce Danimarka'ya saldırmalıyız."
 GER_weserubung_tt:0 "\n§Y[144.GetName]§!'ı tamamen kontrol etmek, her ay §Y[SWE.GetName]§!'den §YNarvik§! üzerinden yüksek kaliteli cevher sağlayacaktır. Bu, her 6 ayda bir ek bir §YAçık Deniz Sivil Fabrikası§! ile sonuçlanacak ve toplamda en fazla 8 §YAçık Deniz Sivil Fabrikası§! olacaktır. §Y[144.GetName]§! üzerindeki kontrol kaybedilirse bu sevkiyatlar kesintiye uğrayabilir. Eğer [ENG.GetNameDefCap] başarılı bir şekilde [SWE.GetName]'ı işgal eder ve madenleri sabote ederse veya [SWE.GetNameDef] onları havaya uçurursa sivil fabrikalar kalıcı olarak kaybedilecektir. Madenler yeniden başlatılırsa sevkiyatlar devam edebilir."
 GER_weserubung_tt_complete:0 "§YNarvik§!'i kontrol etmekten şu anda kazanılan §YAçık Deniz Sivil Fabrikaları§!: §G[?GER_narvik_civs]§!\nBir sonraki fabrikaya kadar sevkiyat ilerlemesi: [?GER_narvik_shipments]/6"
 GER_west_wall:0 "Batı Duvarı"
 GER_west_wall_desc:0 "Batı Duvarı, Fransa'nın övülen Maginot Hattı'na paralel uzanır ve önceki Dünya Savaşı'nda Siegfried Hattı'nın işgal ettiği zeminin çoğunu kaplar. Savunmasını güçlendirmek, sınırı daha az adamla tutmamızı sağlayarak, herhangi bir potansiyel doğu seferine katılmak için bölmeleri serbest bırakacaktır."
 GER_west_wall_forts:0 "Fransız sınırına §Y12 Kara Kalesi§! ekle.\n"
 GER_west_wall_tt:0 "§RRheinland yeniden askerileştirilirse, şunları da kazanırsınız:§!\n"
 GER_wunderwaffe:0 "Mucize Silahlar"
 GER_wunderwaffe_desc:0 "Heisenberg ve von Braun, gerçek kıyamet silahları için sahip oldukları belirli fikirleri keşfetmek için sabırsızlanıyorlar. Tek ihtiyaçları ekstra kaynak..."
 HUN_a_new_flagship:0 "Filonun Gururu"
 HUN_a_new_flagship_desc:0 "Denizcilik geleneğimizin hikayeli tarihi deneme, sıkıntı ve ihanetle dolu olmuştur. Mirasımızın gururunu geri getirme çabasıyla, amirallerimiz tüm ulusa ilham verecek yeni bir amiral gemisi önermektedir."
 HUN_dockyards:0 "Gemicilik Sektörünü Yenile"
 HUN_dockyards_desc:0 "Gözlerimiz sınırlarımızın restorasyonuna sıkıca dikilmişken, geçmişteki zaferlerimize rakip olacak bir Akdeniz filosu geliştirme görevine başlamalıyız."
 HUN_protect_czechoslovakia_tt:0 "\nAşağıdaki durumlarda boyun eğmeleri daha olasıdır:\n - §HDünya Gerilimi§! yüksekse\n - Bir §Hfraksiyonda§! değillerse\n - Bize karşı §Hyüksek bir görüşe§! sahiplerse\n - Bizimle bir §Hsaldırmazlık paktı§! varsa\n - §Haskerleri§! bizimkinden daha zayıfsa"
 HUN_unify_with_austria_tt:0 "\nAşağıdaki durumlarda boyun eğmeleri daha olasıdır:\n - §H%50'den az Savaş Desteğine§! sahiplerse\n - Bir §Hfraksiyonda§! değillerse\n - Bize karşı §Hyüksek bir görüşe§! sahiplerse\n - §Haskerleri§! bizimkinden daha zayıfsa"
 ITA_albania_war_goal:0 "Arnavutluk İşgali"
 ITA_albania_war_goal_desc:0 "Arnavutluk, birliklerimiz için kolay bir hedef oluşturuyor. Çok fazla direnişle karşılaşmamız olası değil. Dünyaya İtalya'nın gücünü göstermeli ve Roma İmparatorluğu'nun ihtişamını yeniden tesis etmeliyiz!"
 ITA_anti_uk_war_goals:0 "İngiltere ile Savaş"
 ITA_anti_uk_war_goals_desc:0 "Çökmekte olan İngiliz İmparatorluğu bizi Akdeniz'de kafese kapattı ve anahtarları asla gönüllü olarak vermeyecek. Zamanı geldiğinde İngilizlere saldırmalıyız!"
 ITA_armored_effort:0 "Zırhlı Çaba"
 ITA_armored_effort_desc:0 "Etiyopya'da savaşmak iyi ve güzel, ancak tanklarımız Avrupada'ki çökmekte olan -ancak hala güçlü- plütodemokrasilere karşı savaşmak için gereken standartlara sahip değil."
 ITA_army_primacy:0 "Ordunun Üstünlüğü"
 ITA_army_primacy_desc:0 "Endüstriyel olarak İtalya, hala çökmekte olan sömürge imparatorluklarının gerisinde kalıyor. Orduya mı yoksa donanmaya mı öncelik vereceğimizi seçmeliyiz. Seçim açık görünüyor; antik Roma İmparatorluğu lejyonlarına bağlı olduğu gibi, yeni İtalyan İmparatorluğu da öyle olmalı!"
 ITA_atlantic_fleet:0 "Atlantik Filosu"
 ITA_atlantic_fleet_desc:0 "İngiliz kafesinden çıktığımızda, gücümüzü okyanuslar ötesine yansıtmamız gerekecek. Bu bizim birinci önceliğimiz olmalı."
 ITA_bomber_effort:0 "Bombardıman Uçağı Çabası"
 ITA_bomber_effort_desc:0 "Orduların gökyüzüne bakmadan savaşları kazanabileceği çağ geride kaldı. Askerlerimize ihtiyaç duydukları hava desteğini sağlamak için taktik bombardıman uçaklarımızı geliştirmeliyiz."
 ITA_bulgaria_friend:0 "Bulgaristan ile Dost Ol"
 ITA_bulgaria_friend_desc:0 "Bulgaristan etki alanımızda. Onların İtalya ile güvenli hizalanması, Balkan hırslarımızın anahtarıdır."
 ITA_capital_ships:0 "Ana Gemi Çabası"
 ITA_capital_ships_desc:0 "En çok zırhlıya sahip olan ulus okyanuslara hükmedecek. Kraliyet Donanması'nın Akdeniz'de bizi geride bırakmasına izin vermemeliyiz..."
 ITA_carrier_effort:0 "Uçak Gemisi Çabası"
 ITA_carrier_effort_desc:0 "Modern savaş filoları zırhlılar değil, uçak gemileri üzerine odaklanacak. Hava gücünün gemiler üzerindeki üstünlüğü Amerikalılar tarafından 1921'de zaten gösterilmişti!"
 ITA_claims_on_france:0 "Fransa Üzerindeki İddialar"
 ITA_claims_on_france_desc:0 "Vichy Fransa'dan toprak alın. Almanların Paris'i fethi ve Fransa'da yeni bir hükümetin kurulmasıyla, Güney Avrupa'dan haklı payımızı talep etme zamanı geldi. Almanya kuzeyde büyük ölçüde genişledi ve kendi payımıza bir dilim verilmesi adil olacaktır."
 ITA_claims_on_france_tt:0 "§YVichy Fransa§! var ve §YSavoy§! ve §YKorsika§!'yı kontrol ediyor!"
 ITA_claims_on_turkey:0 "Türkiye Üzerindeki İddialar"
 ITA_claims_on_turkey_desc:0 "1915 Londra Antlaşması, İtalya'ya Anadolu'daki Türk topraklarını, Batı güçlerinin Levant'taki kazanımları karşılığında vaat etti. Onlar kendi paylarını aldılar, sadece Milletler Cemiyeti mandaları olduklarını iddia ettiler, İtalya ise reddedildi. Yeni İtalya eskisinden çok daha güçlü ve Türkleri İngiliz vaatlerini tutmaya zorlayacağız."
 ITA_demand_balearic_islands:0 "Balear Adaları'nı Talep Et"
 ITA_demand_balearic_islands_desc:0 "Franco'nun yeni rejimine desteğimizi kanıtladıktan sonra, savunmak için savaştığımız önemli bölgelerden biri olan Balear Adaları'nın Akdeniz'deki stratejik kontrolümüzü güçlendirmek için İtalya'ya devredilmesini talep etme konumundayız."
 ITA_escort_effort:0 "Eskort Çabası"
 ITA_escort_effort_desc:0 "Akdeniz'deki savunmasız konvoylarımızı korumak için daha fazla çaba sarf etmeliyiz."
 ITA_ethiopian_war_logistics:0 "Etiyopya Savaşı Lojistiği"
 ITA_ethiopian_war_logistics_desc:0 "Etiyopya'yı görkemli fethimiz için lojistik durumu yanlış değerlendirmiş olabiliriz. Cesur birliklerimize gerekli malzemeleri sağlamak birincil hedefimiz olmalı."
 ITA_fortification_effort:0 "Tahkimat Çabası"
 ITA_fortification_effort_desc:0 "Kıyılarımızı ve sınırlarımızı, solmakta olan ve çökmekte olan emperyal güçler Fransa ve Britanya'nın saldırganlığına karşı savunmalıyız."
 ITA_fortification_effort_forts:0 "Fransız sınırına §Y15 Kara Kalesi§! ekle.\n"
 ITA_germ_italy_same_tt:0 "§Yİtalya§! ve §YAlmanya§! aynı §Yİdeoloji§!ye sahip."
 ITA_german_millitary_cooperation:0 "Alman Askeri İşbirliği"
 ITA_german_millitary_cooperation_desc:0 "Güçlü Alman ordusuyla sıkı işbirliği yaparak, Alman verimliliği ve İtalyan inovasyonunun en iyi kısımlarını birleştirebiliriz. Bize karşı durmaya cesaret eden herkes üzerinde stratejik bir avantaja sahip olacağız."
 ITA_german_rd_treaty:0 "Almanya ile Antlaşma"
 ITA_german_rd_treaty_desc:0 "Büyük uluslarımızın her ikisinin de yararına teknolojik sırları değiş tokuş etmek için Almanlardan istemeliyiz."
 ITA_go_after_france:0 "Fransa'nın Peşine Düş"
 ITA_go_after_france_desc:0 "Fransa... Her an ilerlemeyi engellemeye çalışan ve sık sık İtalyan halkının varlığını tehlikeye atan batının bir başka gerici demokrasisi. İtalya'nın iyiliği ve İmparatorluğun geleceği için savaşa gidiyoruz."
 ITA_greece_friend:0 "Yunanistan ile Dost Ol"
 ITA_greece_friend_desc:0 "Yunanlar, Batı medeniyetinin beşiği ve eski bir halktır. Amaçlarını bizimkilerle hizalamak imkansız olmamalı..."
 ITA_greece_war_goal:0 "Yunanistan ile Savaş"
 ITA_greece_war_goal_desc:0 "Yunanistan'ı dahil etmezsek nasıl bir Roma İmparatorluğu'nu restore ediyoruz? Kolay bir hedef olmalı..."
 ITA_italian_highways:0 "İtalyan Otoyolları"
 ITA_italian_highways_desc:0 "İmparatorluğumuz boyunca birliklerin kolay hareketliliğini sağlamak için altyapımızı genişletmemiz gerekiyor. Dünyanın her köşesindeki düşmanlarla, tüm İtalyan topraklarını savunabilmek için bu kritik bir parçadır."
 ITA_italy_first:0 "Önce İtalya"
 ITA_italy_first_desc:0 "Görkemli Duce'miz Hitler'e asla ikinci keman çalmayacak! Roma İmparatorluğu'nun derslerine kulak vermeliyiz; İtalyan işlerine Cermen müdahalesi asla iyi sonuçlanmaz..."
 ITA_japan_friend:0 "Japonya ile Dost Ol"
 ITA_japan_friend_desc:0 "Japonlar bize çok benziyor; pozitif bir demografiye sahip genç, aç bir güç, İngiltere ve Hollanda gibi çökmekte olan plutodemokrasilerin ticaretinden rehin tutuluyor. Okyanuslar boyunca canlı bir Deniz Ekseni oluşturmak için onlarla birleşmeliyiz!"
 ITA_jet_engine_effort:0 "Jet Motoru Çabası"
 ITA_jet_engine_effort_desc:0 "İtalya, Secondo Campini'nin parlak çalışmaları sayesinde jet motoru geliştirmede ön saflarda olmalı. Regio Aeronautica için tasarımlarını daha da geliştirmesi için ona ihtiyaç duyduğu tüm kaynakları sağlamalıyız."
 ITA_libyan_infrastructure:0 "Libya Altyapısı"
 ITA_libyan_infrastructure_desc:0 "Kuzey Afrika'daki geniş topraklarımız, altyapı açısından imparatorluğumuzun geri kalanının hala gerisinde. Çabalarımızı onları aynı seviyeye getirmeye odaklamalıyız."
 ITA_light_ship_effort:0 "Hafif Gemi Çabası"
 ITA_light_ship_effort_desc:0 "Denizaşırı topraklarımıza giden konvoyların korunmaya ihtiyacı var. Yeni doktrinler ve daha modern destroyerler geliştirmemiz gerekiyor."
 ITA_mare_nostrum:0 "Mare Nostrum"
 ITA_mare_nostrum_desc:0 "Kaynaklarımız sınırlıdır ve bazı acı verici seçimler yapmalıyız, ancak İngiliz İmparatorluğu bizi Akdeniz'de kafese kapattı. Çıkış yolu bulmak, onlarınkine bile rakip olabilecek bir donanma gerektirecek..."
 ITA_marines_and_landing_craft:0 "Deniz Piyadeleri ve Çıkarma Gemileri"
 ITA_marines_and_landing_craft_desc:0 "Savaşlar sadece deniz gücüyle kazanılmaz; ordularımızı dalgaların ötesine taşıyabilmeli ve onları güvenli bir şekilde karaya çıkarabilmeliyiz..."
 ITA_modernized_army:0 "Modernize Edilmiş Ordu"
 ITA_modernized_army_desc:0 "Daha iyi topçu, savaş verimliliğimizi büyük ölçüde artıracak, ancak yeni taktiklere ve doktrinlere de ihtiyacımız var."
 ITA_modernized_artillery:0 "Modernize Edilmiş Topçu"
 ITA_modernized_artillery_desc:0 "Regio Esercito, teorik olarak, dünyanın en büyük ordularından biridir. Ne yazık ki, tüm bu adamları düzgün bir şekilde donatmamız imkansız. En kötüsü de, topçularımızın çoğu 1918'den kalma!"
 ITA_pact_of_steel:0 "Çelik Paktı"
 ITA_pact_of_steel_desc:0 "Nazi Almanyası ile ilişkimiz ideolojik farklılıklar ve çelişen amaçlar yüzünden sıkıntılı; Duce, Almanya'nın Avusturya ve Balkanlar'daki hırsları konusunda aşırı derecede temkinli. Ancak gerçekler değişiyor..."
 ITA_portugal_friend:0 "Portekiz ile Dost Ol"
 ITA_portugal_friend_desc:0 "Portekiz, İspanya ile birlikte İtalyan halkının doğal müttefikleridir. Bu dostluk bağlarını güçlendirmeliyiz."
 ITA_romania_friend:0 "Romanya ile Dost Ol"
 ITA_romania_friend_desc:0 "Romanya'daki uzak akrabalarımızı etki alanımıza sokmak bizim için en iyi olacaktır. Duce, onların 'Demir Muhafızları'nda büyük potansiyel görüyor."
 ITA_sea_wolves:0 "Deniz Kurtları"
 ITA_sea_wolves_desc:0 "Alman müttefiklerimiz korkunç derecede verimli denizaltılar ve bunları kullanmak için 'kurt sürüsü' doktrinleri geliştirdiler. Onlardan öğrenmeliyiz."
 ITA_slovenia_dalmatia_claims:0 "Yugoslavya Üzerindeki İddialar"
 ITA_slovenia_dalmatia_claims_desc:0 "Yugoslavya'da hala önemli bir İtalyan nüfusu var, Venedik'in görkemli günlerinden kalma en azından. Bu bölgeleri İtalyan yönetimine geri döndürmek, Roma İmparatorluğu'nu yeniden yaratma yolunda önemli bir adımdır!"
 ITA_slovenia_dalmatia_claims_threat:0 "İtalya'nın Yugoslavya Üzerindeki İddiaları"
 ITA_spanish_italian_faction:0 "İspanyol-İtalyan İttifakı"
 ITA_spanish_italian_faction_desc:0 "Franco ve İspanyol milliyetçileri, din, kültür ve ideoloji ile birleşmiş doğal müttefiklerimizdir. Birlikte, Cebelitarık'ı ele geçirebilir ve Kraliyet Donanması'nın işini çok zorlaştırabiliriz..."
 ITA_support_nationalist_spain:0 "Milliyetçi İspanya'yı Destekle"
 ITA_support_nationalist_spain_desc:0 "İspanya, gelecekte olası bir faşist müttefik mi olacak yoksa işe yaramaz bir cumhuriyet olarak mı kalacak - ya da daha kötüsü, komünizme veya anarşiye mi düşecek belirleyecek bir iç savaşın ortasında. Çok geç olmadan gerçek İspanyollara destek sağlamalıyız!"
 ITA_turkey_friend:0 "Türkiye ile Dost Ol"
 ITA_turkey_friend_desc:0 "Türklerin İtalyan-Türk savaşı ve Büyük Savaş'tan sonra bizi sevmek için bir nedenleri yok. Ancak, Realpolitik eski şikayetlerden daha öncelikli ve Akdeniz'deki mevcut durum iki yıldızımızı hizalayabilir."
 ITA_victoryinETH:0 "Afrika'da Zafer"
 ITA_victoryinETH_desc:0 "Birinci İtalya-Etiyopya Savaşı'ndaki başarısızlık 40 yıldır İtalyan onuruna bir leke olmuştur, şimdi zafer elde ederek o leke silinecek ve Faşizmin Demir İradesinin gücü kanıtlanacaktır!"
 ITA_yugoslavia_friend:0 "Yugoslavya ile Dost Ol"
 ITA_yugoslavia_friend_desc:0 "Yugoslavya'yı şimdi düşman etmek yerine, nihai fethini daha uygun bir zamana erteleyebiliriz. Bunun yerine, rejimle dostluk kurabilir ve ülkeyi etki alanımıza sokabiliriz."
 JAP_army_primancy_focus_bypass_tt:0 "Ana bölgede §YAskeri Fabrikalar§! için yeterli inşaat alanı yok."
 JAP_military_doctrine_shortcut:0 "Askeri"
 JAP_navy_primancy_focus_bypass_tt:0 "Ana bölgede §YDonanma Tersaneleri§! için yeterli inşaat alanı yok."
 JAP_okadas_military_purge_speech_shortcut:0 "Siyaset:\nAskeri Tasfiye"
 JAP_revere_the_emperor_shortcut:0 "Siyaset: İmparatorluk Yolu"
 JAP_synth_oil_focus_tt:0 "Idemitsu Kosan endüstri kuruluşu olarak mevcut"
 NATIONAL_FOCUS_EXCLUSIVE_INFO_DESC:0 "Karşılıklı olarak özel"
 NATIONAL_FOCUS_EXCLUSIVE_INFO_ENTRY:0 "$FOCUS|Y$"
 NATIONAL_FOCUS_MUTUALLY_EXCLUSIVE_TREE:0 "Dallar karşılıklı olarak özeldir."
 NATIONAL_FOCUS_NO_CURRENT_EFFECT:0 "Bu odağın şu anda hiçbir etkisi yoktur. Dünya durumundaki değişiklikler bunu etkileyebilir."
 NAV_effort:0 "Deniz Hava Kuvvetleri Çabası"
 NAV_effort_desc:0 "Tıpkı yeni deniz savaşının kısmen su yüzeyinin altında gerçekleşmesi gibi, bir kısmı da suların üzerindeki havada gerçekleşir."
 NZL_2nzef:0 "2. YZSG"
 NZL_2nzef_desc:0 "Son savaşın dehşetine rağmen, Yeni Zelanda yeniden yürüyüşe hazır. 2. Yeni Zelanda Sefer Gücü şu anda organize ediliyor."
 NZL_amend_the_maori_affairs_act:0 "Maori İşleri Yasasını Değiştir"
 NZL_amend_the_maori_affairs_act_desc:0 "Maori İşleri Yasasını, az kullanılan toprakların üretkenliğini artıracak, ancak Maori vatandaşlarımızı gereksiz yere yerinden etmeyecek şekilde değiştirmeliyiz."
 NZL_army_reforms:0 "Ordu Reformları"
 NZL_army_reforms_desc:0 "Ordumuzun eğitim ve terfi sistemini modernize etmeliyiz. Bu şekilde devam eden dünya krizinde ne olursa olsun hazırlıklı olabiliriz."
 NZL_arrest_pacifist_leaders:0 "Pasifist Liderleri Tutukla"
 NZL_arrest_pacifist_leaders_desc:0 "Şimdi ülke içinde anlaşmazlık zamanı değil. Herkes savaşı kazanmaya odaklanmalı ve bu, savaşa karşı konuşan herkesi gözaltına almak anlamına geliyorsa, o zaman bunu yapacağız."
 NZL_artillery_focus:0 "Topçu Odağı"
 NZL_artillery_focus_desc:0 "Topçu, piyadelerimizin herhangi bir ileri hareketi için hayati öneme sahiptir. Balistik ve daha büyük namlulu silahlara yönelik araştırmaları genişletin."
 NZL_befriend_japan:0 "Japonya ile Dost Ol"
 NZL_befriend_japan_desc:0 "Bir Pasifik ulusu olarak, bölgedeki en güçlü güçle aynı tarafta olmak güvenlik çıkarlarımıza uygundur. Japonya ve güçlü donanmaları bizi dünyanın tehlikelerinden koruyabilir."
 NZL_big_bob_tank:0 "Büyük Bob Tankı"
 NZL_big_bob_tank_desc:0 "Avrupa savaş alanları, düşmanlarımızın süper tanklarıyla rekabet etmek için daha ağır zırh talep ediyor. Büyük Bob, Yeni Zelanda'nın bu tasarım çabasına katkısı olacaktır."
 NZL_bob_semple_tank:0 "Bob Semple Tankı"
 NZL_bob_semple_tank_desc:0 "Yeni Zelanda'nın neden kendi tankı olmasın? Temuka'daki Çalışma Bakanlığı, sadece makineli tüfeklerle donatılmış hafif bir tank geliştiriyor. Bunu bir prototipten öteye götüremesek bile, kazandığımız deneyim paha biçilmez olacaktır."
 NZL_bomber_focus:0 "Bombardıman Uçağı Odağı"
 NZL_bomber_focus_desc:0 "Hafif bombardıman uçakları kıyı şeritlerimizi etkili bir şekilde koruyabilir ve düşmanlarımıza karşı denizaşırı mücadelede ihtiyaç duyulacaktır."
 NZL_bureau_of_industry:0 "Sanayi Bürosu"
 NZL_bureau_of_industry_desc:0 "Yeni Zelanda, çiftçiliğe ağırlık veren bir tarım toplumudur. Sanayi Bürosu, sermaye altyapısına ve imalata büyük yatırım yapılmasını teşvik etmelidir."
 NZL_capital_ship_effort:0 "Ana Gemi Gayreti"
 NZL_capital_ship_effort_desc:0 "Yeni Zelanda'nın birinci sınıf bir donanması olacaksa, birinci sınıf gemileri olmalıdır. Zırhlılara ve ağır kruvazörlere yatırım yapmalıyız."
 NZL_charlton_automatic_rifle:0 "Charlton Otomatik Tüfeği"
 NZL_charlton_automatic_rifle_desc:0 "Vatandaşlarımızdan biri standart Lee Enfield tüfeğini tam otomatik bir silaha dönüştürdü. Bu, Yeni Zelanda yaratıcılığının en iyisidir ve bu doğrultuda yeniliği teşvik etmeliyiz."
 NZL_coastal_defense:0 "Kıyı Savunması"
 NZL_coastal_defense_desc:0 "Yeni Zelanda, düşmanlardan uzak bir ada ülkesidir, bu nedenle kıyı şeritlerimiz boyunca amfibi saldırıya hazırlıklı olmalıyız."
 NZL_constitution_amendment_act:0 "Anayasa Değişiklik Yasası"
 NZL_constitution_amendment_act_desc:0 "Yeni Zelanda'nın kendisini İngiliz hakimiyetinden ayırmayı düşünme zamanı geldi. Kendi işlerimiz üzerinde daha fazla kontrol sahibi olmak için anayasamızı değiştireceğiz."
 NZL_defend_our_islands:0 "Adalarımızı Savun"
 NZL_defend_our_islands_desc:0 "Ada cennetimize denizden saldırıya hazırlıklı olmalıyız. Deniz bombardıman uçakları çıkarma araçlarını önleyebilir ve saldırabilir, hatta ana gemileri hedef alabilir."
 NZL_department_of_scientific_and_industrial_research:0 "Bilimsel ve Endüstriyel Araştırma Bakanlığı"
 NZL_department_of_scientific_and_industrial_research_desc:0 "Diğer İngiliz Milletler Topluluğu ve Dominyon ulusları bilimsel ve endüstriyel araştırmalara yatırım yapıyor, bu yüzden biz de aynısını yapmalıyız."
 NZL_destroyer_effort:0 "Muhrip Gayreti"
 NZL_destroyer_effort_desc:0 "Küçük sanayi tabanımızla muhripler, Yeni Zelanda'nın deniz gücünü yansıtmasının en verimli yoludur. Kıyıları devriye gez, denizaltıları önle ve erken uyarı gözcüleri kur."
 NZL_domestic_arms_industry:0 "Yerli Silah Sanayii"
 NZL_domestic_arms_industry_desc:0 "Yapabildiğimiz kadar çok sanayiyi hafif silah üretimine yönlendirmeliyiz. Mühimmat, silah parçaları, destek teçhizatı vb. ihtiyacımız var. Bunlar yurt içinde yapılabilir."
 NZL_empower_the_working_class:0 "İşçi Sınıfını Güçlendir"
 NZL_empower_the_working_class_desc:0 "İşçi Partisi kuruluşundan bu yana işçi sınıfını savundu, gerçekten de liderlerimizin çoğu işçi sınıfı kökenlidir. Sendikalar için daha dramatik korumalar ve yetkiler için bastıralım."
 NZL_expand_devonport_naval_base:0 "Devonport Deniz Üssünü Genişlet"
 NZL_expand_devonport_naval_base_desc:0 "Devonport Deniz Üssü donanmamızın karargahı olacak, ancak topyekun savaşın yeni taleplerini karşılamak için genişletilmelidir."
 NZL_expand_the_nzpaf:0 "NZPAF'ı Genişlet"
 NZL_expand_the_nzpaf_desc:0 "Yeni Zelanda Daimi Hava Kuvvetleri yeni kıyı devriye araçlarına ve deniz bombardıman uçaklarına ihtiyaç duyuyor. Modern uluslar hava savaşını ihmal edemez,"
 NZL_expand_the_university_of_auckland:0 "Auckland Üniversitesi'ni Genişlet"
 NZL_expand_the_university_of_auckland_desc:0 "Auckland Üniversitesi en önemli yükseköğretim kurumumuzdur. Tesislerini genişleterek, en iyi beyinlerimizden bazılarını burada evde tutmaya çalışabiliriz."
 NZL_fighter_focus:0 "Avcı Odağı"
 NZL_fighter_focus_desc:0 "Avcılar, müttefiklerimiz için belirleyici silah olacak bombardıman uçaklarını önlemede ve onlara eşlik etmede etkilidir."
 NZL_form_the_rnzaf:0 "RNZAF'ı Kur"
 NZL_form_the_rnzaf_desc:0 "Hava kuvvetlerini diğer muharebe kollarından bağımsız hale getirme zamanı geldi. Kraliyet Yeni Zelanda Hava Kuvvetleri kendi komuta yapısına sahip olacak ancak Kraliyet Hava Kuvvetleri ile yakın işbirliği içinde olacaktır."
 NZL_form_the_rnzn:0 "RNZN'yi Kur"
 NZL_form_the_rnzn_desc:0 "Bir zamanlar küçük olan kıyı devriyemiz artık Kraliyet Donanması denetiminden bağımsız olarak faaliyet gösterebilen gemileri içerecek şekilde büyüdü. Yeni Zelanda'nın kendi donanması olacak."
 NZL_heavy_bombers:0 "Ağır Bombardıman Uçakları"
 NZL_heavy_bombers_desc:0 "Savaş ancak düşman anavatanının kalbine saldırarak kazanılabilir. Düşman fabrikalarına ve şehirlerine yıkıcı bir darbe indirmek için ağır bombardıman uçakları gereklidir."
 NZL_in_the_darkness:0 "Karanlıkta"
 NZL_in_the_darkness_desc:0 "Anavatanımızın savunduğu demokratik sistemlerde doğal bir çürüme var. Gerçek güç taviz yoluyla gösterilemez."
 NZL_independent_new_zealand:0 "Bağımsız Yeni Zelanda"
 NZL_independent_new_zealand_desc:0 "Artık bir Cumhuriyetiz! Yeni Zelanda'nın Birleşik Krallık'a, onu güvenli bir şekilde yetiştirdiği için her çocuğun annesine borçlu olduğu minnetten başka bir borcu yoktur. Ancak İngiliz Milletler Topluluğu'nun güvenli yuvasını terk etmeli ve dünyayı kendi çıkarlarımızı göz önünde bulundurarak görmeliyiz."
 NZL_industrial_conscription:0 "Endüstriyel Askerlik"
 NZL_industrial_conscription_desc:0 "Sağlıklı hiçbir erkeğin silahlı kuvvetlerde hizmet etmemesi veya savaşla ilgili bir sanayide çalışmaması için hiçbir neden yoktur. Yeni yasalarımız herkesi seferberlik ve üretim çarkına sokacaktır."
 NZL_join_comintern:0 "Komintern'e Katıl"
 NZL_join_comintern_desc:0 "Sosyalist kardeşlerimizle bir ittifak kurma zamanı geldi. Komintern aracılığıyla işçi cennetine ulaşacağız."
 NZL_light_cruiser_effort:0 "Hafif Kruvazör Gayreti"
 NZL_light_cruiser_effort_desc:0 "Orta büyüklükteki gemiler orta büyüklükteki bir güç için uygundur. Hafif kruvazörler etkili olabilir, ancak gerekirse büyük çatışmalardan kaçmak için hıza sahiptirler."
 NZL_long_range_patrol:0 "Uzun Menzilli Devriye"
 NZL_long_range_patrol_desc:0 "Uzun Menzilli Devriye, Kuzey Afrika'daki geniş toprakları kapsamayı amaçlamaktadır. Bu keşif ve komando birimi, dünyanın en zorlu iklimlerinden bazılarında özel görevler üstlenecektir."
 NZL_maori_affairs_act:0 "Maori İşleri Yasası"
 NZL_maori_affairs_act_desc:0 "Maorilerin sahip olduğu toprakların çoğu ekonomik olarak verimsizdir. Onu birleştirebilir ve daha fazlasını hükümet kontrolü altına alabilirsek, bu çorak yerleri verimli sanayi ve ticaret alanlarına dönüştürebiliriz."
 NZL_maori_conscription:0 "Maori Askerliği"
 NZL_maori_conscription_desc:0 "Sefer Gücüne bağlı Maori Taburu'nun cesareti ve kahramanlığı, isteksiz Maorileri bile hizmete alarak tüm nüfusumuzdan en iyi şekilde yararlanmamız gerektiğinin bir işaretidir."
 NZL_maori_volunteers:0 "Maori Gönüllüleri"
 NZL_maori_volunteers_desc:0 "Vatanseverliklerini gösteren yüzlerce Maori, Yeni Zelanda ordusunda hizmet etmek için gönüllü oluyor."
 NZL_modern_fighters:0 "Modern Avcılar"
 NZL_modern_fighters_desc:0 "Avcı tasarımlarımızı daha uzun menzilli, daha hızlı araçlara yükseltme zamanı geldi. Müttefiklerimiz dünyanın şimdiye kadar gördüğü en gelişmiş uçaklardan bazılarıyla yolu gösterdiler."
 NZL_national_defense_institute:0 "Ulusal Savunma Enstitüsü"
 NZL_national_defense_institute_desc:0 "Yeni Zelanda artık tamamen egemen bir ulus olduğuna göre, daha önce olduğu gibi gelişmiş prototiplere ve planlara erişimimiz yok. Düşmanlarımızın her zaman önünde kalmamızı ve teknolojide geride kalmamamızı sağlamalıyız."
 NZL_national_roads_board:0 "Ulusal Yollar Kurulu"
 NZL_national_roads_board_desc:0 "Yeni Zelanda'nın engebeli arazisi tutarlı bir yol yapım sistemini engelledi, ancak mevcut olanı iyileştirmemiz gerekiyor. Bir otoyol sistemi araştırılmalı, yollar asfaltlanmalı ve dağlardan yeni yollar açılmalıdır."
 NZL_new_zealand_steel:0 "Yeni Zelanda Çeliği"
 NZL_new_zealand_steel_desc:0 "Yeni Zelanda, özellikle Kuzey Adası'nda bol miktarda demir kumu yatağıyla kutsanmıştır. Bu kumdan cevher çıkarmak özel bir işlem gerektirir, ancak gelecek yıllar boyunca çelik endüstrimizin temel taşı olarak hizmet edebilir."
 NZL_project_seal:0 "Fok Projesi"
 NZL_project_seal_desc:0 "Fok Projesi, düşmanlarımızı alt etmek için tsunamileri tetikleyebilen bir silah geliştirmek üzere Amerikalılarla yeni bir girişimdir. Biraz hayal ürünüdür, ancak geliştirilen sıçrayan bomba büyük umut vaat ediyor."
 NZL_purchase_old_ships:0 "$SMB_purchase_destroyers_and_subs$"
 NZL_purchase_old_ships_desc:0 "$SMB_purchase_destroyers_and_subs_desc$"
 NZL_ratana_alliance:0 "Ratana İttifakı"
 NZL_ratana_alliance_desc:0 "Ratana hareketiyle bir ittifak, Maori Yeni Zelandalılarını hükümete getirecek ve umarım İngiliz fethinin bazı yaralarını sarmaya başlayacaktır."
 NZL_research_collaboration:0 "Araştırma İşbirliği"
 NZL_research_collaboration_desc:0 "İngilizler bize yakın müttefikler arasında bilimsel ilerlemeyi paylaşmanın avantajını gösterdi. Bunu koordine etmek için gerekli adımları atarsak, tüm fraksiyonumuz savaş zamanı Ar-Ge'yi daha verimli bir şekilde yürütebilecektir."
 NZL_rule_them_all:0 "Hepsine Hükmet"
 NZL_rule_them_all_desc:0 "Güney Pasifik'in antipod ulusları tek bir birleşik güç olmalıdır. Avustralya üstün ahlakımıza boyun eğmeyi düşünmelidir."
 NZL_schofield_tank:0 "Schofield Tankı"
 NZL_schofield_tank_desc:0 "Semple Tankı ihtiyaçlarımızı karşılamadıysa, belki de uygun bir topu olan bir tank işe yarayacaktır. Birleşik tekerlek/palet sistemi orijinaldir ve tank tasarımı konusunda bize yeni bilgiler sağlayabilir."
 NZL_social_security_act:0 "Sosyal Güvenlik Yasası"
 NZL_social_security_act_desc:0 "Yeni Zelanda'nın işsizleri, ekonomi düzelene ve daha fazla iş imkanı oluşana kadar bakılmalıdır. 1935'te bir Noel ikramiyesiyle başladık, ancak tüm vatandaşlar için uygun bir sosyal güvenlik ağı zamanı geldi."
 NZL_statute_of_westminster:0 "Westminster Tüzüğü"
 NZL_statute_of_westminster_desc:0 "Westminster Tüzüğü, bizi İmparatorluk içinde tutarken Taç altında daha fazla bağımsızlık verir."
 NZL_strengthen_the_commonwealth:0 "İngiliz Milletler Topluluğunu Güçlendir"
 NZL_strengthen_the_commonwealth_desc:0 "Daha küçük bir Dominyon olarak, dostlarımıza ve ailemize yakın durmak önemlidir. İngiliz topraklarındaki arkadaşlarımızla bağlarımızı güçlendireceğiz."
 NZL_submarine_effort:0 "Denizaltı Gayreti"
 NZL_submarine_effort_desc:0 "Herhangi bir işgal deniz yoluyla gelmek zorunda kalacağından, okyanusun kurtları güçlü bir savunma hattı olabilir. Gizli ve sürüler halinde avlanan bir denizaltı filosu deniz yollarımızı koruyabilir."
 NZL_taranaki_oil:0 "Taranaki Petrolü"
 NZL_taranaki_oil_desc:0 "Kuzey adasındaki Taranaki bölgesi mineraller ve petrol bakımından zengindir. Girişimciler bu petrol rezervlerini işletmeye çalıştılar, ancak rafinerilere ve sondaja daha fazla yatırım yapılması gerekiyor."
 NZL_technology_sharing_with_britain:0 "İngiltere ile Teknoloji Paylaşımı"
 NZL_technology_sharing_with_britain_desc:0 "Büyük Britanya'nın bilimsel ve endüstriyel tabanı bizimkinden çok daha üstündür, ancak aile olduğumuz için bildiklerini bizimle paylaşmaya isteklidirler."
 NZL_technology_sharing_with_japan:0 "Japonya ile Teknoloji Paylaşımı"
 NZL_technology_sharing_with_japan_desc:0 "Japonya dünyanın en iyi bilim adamlarından ve teknoloji yenilikçilerinden çoğuna sahiptir. Bildiklerini silah arkadaşlarımız olan bizimle paylaşacak kadar cömertler."
 NZL_technology_sharing_with_soviet_union:0 "Sovyetler Birliği ile Teknoloji Paylaşımı"
 NZL_technology_sharing_with_soviet_union_desc:0 "Sovyetler Birliği dünyanın en iyi bilim adamlarından ve teknoloji yenilikçilerinden çoğuna sahiptir. Bildiklerini silah arkadaşlarımız olan bizimle paylaşacak kadar cömertler."
 NZL_the_first_labor_government:0 "İlk İşçi Hükümeti"
 NZL_the_first_labor_government_desc:0 "Yeni Zelanda için İlk İşçi Hükümeti, ilerici bir sosyal ve ekonomik gündem izleme fırsatına sahiptir. Endüstriyel düzenleme, işçi hakları, sosyal refah yasaları ve ücret kuralları gündemdedir."
 NZL_the_lee_affair:0 "Lee Olayı"
 NZL_the_lee_affair_desc:0 "Grey Lynn Milletvekili John Lee, İşçi Partisi grubu içinde sorunlara neden oluyor. Aldığımız temkinli yol yerine daha radikal bir gündem için ajitasyon yapıyor. İsyanını susturmak için önlemler alınmalıdır."
 NZL_the_manpower_act:0 "İşgücü Yasası"
 NZL_the_manpower_act_desc:0 "Savaş başladığından beri Maoriler büyük sayılarda şehirlere geldi. İşgücü Yasası, bu enerjileri Yeni Zelanda fabrikalarına yönlendirmemizi sağlayacaktır."
 NZL_the_plan:0 "İngiliz Milletler Topluluğu Hava Eğitim Planı"
 NZL_the_plan_desc:0 "Pilotların eğitiminde tecrübe ve bilgi birikimini paylaşmak için müttefiklerimizle bir araya geldik. Savaş havadan kazanılabilir, bu nedenle Milletler Topluluğu Hava Eğitim Planı zaferin anahtarı olabilir."
 NZL_think_big:0 "Büyük Düşün"
 NZL_think_big_desc:0 "Kendimizi Avustralyalı veya Kanadalı müttefiklerimizden daha küçük bir Dominyon olarak görmeye alıştık. Ancak Yeni Zelanda endüstriyel büyüklüğe tamamen yeteneklidir."
 NZL_transfer_ships_tt:0 "[ENG.GetNameDefCap] bize §Y2 Hafif Kruvazör§! transfer eder."
 NZL_transfer_the_new_zealand_division:0 "Yeni Zelanda Tümenini Transfer Et"
 NZL_transfer_the_new_zealand_division_desc:0 "2. Yeni Zelanda Tümeni harekete geçirildi, bu yüzden onu çatışmanın olduğu yere göndermeliyiz. Büyük Savaş'taki Yeni Zelanda Tümeni Akdeniz'e bağlıydı ve yeni tümen de öyle olacak."
 NZL_wairarapa_sheep_farms:0 "Wairarapa Koyun Çiftlikleri"
 NZL_wairarapa_sheep_farms_desc:0 "Wairarapa'nın yün endüstrisi Yeni Zelanda ekonomisinin temel taşlarından biridir. Dünya Buhran'dan çıktıkça yünümüze daha fazla talep olacaktır."
 NZL_waitangi_tribunal:0 "Waitangi Mahkemesi"
 NZL_waitangi_tribunal_desc:0 "İngiliz Yeni Zelandalıları, atalarının Yeni Zelanda Maorilerini yerinden etmek, bozmak ve marjinalleştirmek için yaptıklarını kabul etmelidir. Kanlı savaşlar, toprak gaspları ve görmezden gelinen doğal haklar. Bu mirası tanımak iyileşmeye yönelik bir adımdır."
 RAJ_administrative_oversight:0 "İdari Gözetim"
 RAJ_administrative_oversight_desc:0 "Endüstriyel yolsuzlukla başa çıkılıp bağımsızlığımız güvence altına alındıktan sonra, yerel yöneticileri hükümetin kanatları altına alma zamanı geldi. Zor bir görev gibi görünse de, kabile liderleri ve yerel yetkililer nüfusumuzun büyük bir kısmı üzerinde etkiye sahiptir. Bu karanlık zamanlarda ülkemizin iyiliği için dahil edilmelidirler."
 RAJ_air_support_effort:0 "Hava Desteği Gayreti"
 RAJ_air_support_effort_desc:0 "Birleşik Silahlar savaşı yeni savaş şeklidir, bu nedenle kara ve deniz kuvvetlerini destekleyebilecek uçakların eğitimi ve üretimine biraz enerji odaklamalıyız."
 RAJ_all_india_forward_bloc:0 "Tüm Hindistan İleri Bloku"
 RAJ_all_india_forward_bloc_desc:0 "Tüm Hindistan İleri Bloku, İngilizlerin Hindistan'dan çekilmesinin çok uzun sürdüğünü düşünüyor. Daha güçlü - hatta militan - bir pozisyon alınmalıdır."
 RAJ_an_indian_sandhurst:0 "Bir Hint Sandhurst'ü"
 RAJ_an_indian_sandhurst_desc:0 "Hindistan son savaştan beri kendi askeri okulunu talep ediyordu ve nihayet 1932'de bir tane kurduk. Hint Askeri Akademisi birkaç yıldır Hintli subaylar yetiştiriyor ve bize çekirdek bir komuta grubu veriyor."
 RAJ_army_motorization:0 "Ordu Motorizasyonu"
 RAJ_army_motorization_desc:0 "Hindistan tren ve atla verimli bir şekilde kaplanamayacak kadar büyüktür. Ordunun motorlu tümenleri ve düzenli kamyon taşımacılığı olmalıdır."
 RAJ_assam_oil:0 "Assam Petrolü"
 RAJ_assam_oil_desc:0 "Assam, özellikle Digboi'deki rafineri olmak üzere Hint petrol üretiminin merkezidir. Bu kaynağa erişim genişletilmeli ve işletilmelidir."
 RAJ_battaglione_azad_hindoustan:0 "Battaglione Azad Hindoustan"
 RAJ_battaglione_azad_hindoustan_desc:0 "İtalya, eski Hint savaş esirlerinden oluşan bir alay olan Battaglione Azad Hindoustan'ı kurdu. Sabotaj, paraşütle atlama ve sızma konusunda eğitimli olan BAH, ulusal gurur için büyük bir adım olabilir."
 RAJ_british_arms_investors:0 "İngiliz Silah Yatırımcıları"
 RAJ_british_arms_investors_desc:0 "Silah fabrikalarımızı hızla harekete geçirmek istiyorsak, İngiliz bankalarından askeri altyapımıza yatırım yapmalarını istememiz gerekecek."
 RAJ_british_army_support:0 "İngiliz Ordusu Desteği"
 RAJ_british_army_support_desc:0 "İngiliz Ordusu 200 yıllık işgalden sonra Hindistan'ı iyi tanıyor. Halkı ve toprağı tanıyorlar ve Hintli askerlerin evde savaşmaları için eğitimlerini destekleyebileceklerdir."
 RAJ_british_pilot_training:0 "İngiliz Pilot Eğitimi"
 RAJ_british_pilot_training_desc:0 "Kraliyet Hava Kuvvetleri, eğitim almaları için Hint pilotları kabul etti. Bu eğitim, kendi hava filomuzun geliştirilmesinde büyük bir yardım olacaktır."
 RAJ_british_rail_investors:0 "İngiliz Demiryolu Yatırımcıları"
 RAJ_british_rail_investors_desc:0 "Hindistan'daki sivil ve ulaşım altyapısının İngiliz finansörlerinden büyük bir nakit akışına ihtiyacı var."
 RAJ_capital_ship_effort:0 "Ana Gemi Gayreti"
 RAJ_capital_ship_effort_desc:0 "Bir İngiliz ileri karakolu olarak Hindistan, denize hakim olmada ana gemilerin gücünü gördü. Kendi ağır kruvazörlerimizi ve zırhlılarımızı inşa etmeliyiz."
 RAJ_chindits:0 "Çinditler"
 RAJ_chindits_desc:0 "Hindistan'ın özel bir kuvvetler tümenine ihtiyacı var, bu yüzden Asya ormanlarında düşman hatlarının gerisinde faaliyet göstermek üzere Çinditleri kurduk. Bu riskli bir operasyondur ve yüksek zayiat oranlarına sahip olacaktır, ancak savaş çabalarına büyük hizmet edebilir."
 RAJ_clamp_down_on_corruption:0 "Yolsuzluğa Baskı Yap"
 RAJ_clamp_down_on_corruption_desc:0 "İngilizlerin Hindistan'ın demiryolu sistemini genişletme çabalarına rağmen, genişlemenin faydalarının çok azı Hindistan'a ulaşıyor gibi görünüyor. Ulaşım sektöründe yaygın bir yolsuzluk ve ikili anlaşma var ve bu konuda bir şeyler yaptığımız görülmelidir."
 RAJ_combined_arms_academy:0 "Birleşik Silahlar Akademisi"
 RAJ_combined_arms_academy_desc:0 "Sovyet askeri eğitimi, yeni Birleşik Silahlar Akademisi aracılığıyla daha verimli hale getirilebilir. Hava, kara ve deniz gücünü kullanarak modern savaş hakkında güncel bilgilere sahip olabiliriz."
 RAJ_create_general_rani_tt:0 "\n§YLakshmi Sahgal§! adında §Y5 Beceri Generali§! ortaya çıkacaktır"
 RAJ_create_unit_gurkas_tt:0 "Delhi'de elit bir Gurka birimi kazan."
 RAJ_create_unit_rani_tt:0 "Delhi'de bir piyade birimi kazan."
 RAJ_create_unit_red_eagles_tt:0 "Delhi'de elit bir piyade tümeni kazan.\n"
 RAJ_create_unit_sikh_tt:0 "Delhi'de bir piyade birimi kazan."
 RAJ_cripps_mission:0 "Cripps Misyonu"
 RAJ_cripps_mission_desc:0 "Yükselen milliyetçi bağımsızlık ateşine rağmen Hindistan'ı Müttefik ve İngiliz davasına sadık tutmalıyız. Sir Stafford Cripps, milliyetçi liderlere taleplerinin ele alınacağına dair güvence verebilecek yetenekli bir müzakerecidir."
 RAJ_cruiser_effort:0 "Kruvazör Gayreti"
 RAJ_cruiser_effort_desc:0 "Kruvazörler, [ROOT.GetAdjective] deniz gücünün geliştirilmesi ve genişletilmesinde şimdilik yeterli olacaktır."
 RAJ_east_india_railways:0 "Doğu Hindistan Demiryolları"
 RAJ_east_india_railways_desc:0 "Doğu Hindistan Demiryolu'nun hükümet kontrolü, genişlemesi ve iyileştirilmesiyle ilgili tüm kararları bakanlarımızın ellerine bırakır."
 RAJ_enable_local_industrialization:0 "§HKırsal Sanayileşme§! kararlarını etkinleştirir, §HTarım Toplumu§! Ruhunun değiştirilmesine izin verir."
 RAJ_expand_air_bases:0 "Hava Üslerini Genişlet"
 RAJ_expand_air_bases_desc:0 "Hindistan çok büyüktür, bu nedenle hava sahasını devriye gezmek ve korumak, altkıtadaki üslerde hava kapasitemizi artırmamız gerektiği anlamına gelir."
 RAJ_expand_mazagon_dock:0 "Mazagon Rıhtımını Genişlet"
 RAJ_expand_mazagon_dock_desc:0 "Mumbai'deki Mazagon Rıhtımı, Batı Kıyısı'ndaki en önemli gemi yapımcımızdır. Bu dünya krizinde daha fazla kapasiteye ihtiyacı var."
 RAJ_fighter_effort:0 "Avcı Gayreti"
 RAJ_fighter_effort_desc:0 "Bombardıman uçaklarına eşlik etmek ve ulusumuzu tehdit eden herhangi bir düşman uçağını önlemek için avcı uçaklarına ihtiyacımız var."
 RAJ_found_scindia_shipyard:0 "Scindia Tersanesini Kur"
 RAJ_found_scindia_shipyard_desc:0 "Ülkenin Doğu Kıyısı'nda bir tersaneye ihtiyacımız var, bu nedenle Visakhapatnam'da Scindia Tersanesi'ni kurmak denizcilik geleceğimiz için mantıklıdır."
 RAJ_german_technology:0 "[Root.GetGermanTechnologyName]"
 RAJ_german_technology_desc:0 "Alman bilim adamları dünyanın en iyileridir ve askeri makineleri en iyi modern mühendislik tekniklerine dayanmaktadır. İlerlemelerini bizimle paylaşmaya isteklidirler."
 RAJ_german_technology_german:0 "Alman Teknolojisi"
 RAJ_german_technology_japan:0 "Japon Teknolojisi"
 RAJ_great_indian_peninsula_railway:0 "Büyük Hint Yarımadası Demiryolu"
 RAJ_great_indian_peninsula_railway_desc:0 "1925'te Büyük Hint Yarımadası Demiryolu'nun hükümet kontrolü, genişlemesi ve iyileştirilmesiyle ilgili tüm kararların bize düştüğü anlamına geliyor. Büyüyen bir nüfusun daha iyi ulaşım altyapısına ihtiyacı var."
 RAJ_imperial_service_troops:0 "İmparatorluk Hizmet Birlikleri"
 RAJ_imperial_service_troops_desc:0 "İmparatorluk Hizmet Birlikleri Hindistan Prensleri tarafından askere alınır ve yüz binleri bulabilir. Bu zor zamanlarda, Majestelerinin racaların sadakatine güvenebileceğini bilmek harika."
 RAJ_indian_armor:0 "Hint Zırhı"
 RAJ_indian_armor_desc:0 "Hindistan kendi yerli zırhını ve tank tümenini geliştirmeye odaklanmalıdır."
 RAJ_indian_defense_research:0 "Hint Savunma Araştırması"
 RAJ_indian_defense_research_desc:0 "Hindistan artık tamamen egemen bir ulus olduğuna göre, daha önce olduğu gibi gelişmiş prototiplere ve planlara erişimimiz yok. Düşmanlarımızın her zaman önünde kalmamızı ve teknolojide geride kalmamamızı sağlamalıyız."
 RAJ_indian_gentlemen_officers:0 "Hintli Centilmen Subaylar"
 RAJ_indian_gentlemen_officers_desc:0 "İmparatorluk yetkilileriyle yakın işbirliği içinde Raj'a hizmet eden centilmenler, yeni Hint Ordusu'na liderlik edecek sadık adamlara ihtiyacımız olursa hazır bir komutan kaynağıdır."
 RAJ_indian_gurkhas:0 "Hint Gurkaları"
 RAJ_indian_gurkhas_desc:0 "Pencap ve Nepal yaylalarının Gurkaları askeri becerileriyle efsanevidir. Yıllardır Raj'a sadakatle hizmet ettiler ve her türlü savaşta üstündürler."
 RAJ_indian_institute_of_science:0 "Hint Bilim Enstitüsü"
 RAJ_indian_institute_of_science_desc:0 "Bangalore'daki Hint Bilim Enstitüsü kampüsü, Hindistan nüfusunun en iyi ve en parlaklarının ilerlemelerimizi daha da ileri götürmesine olanak tanıyor."
 RAJ_indian_national_army:0 "Hint Ulusal Ordusu"
 RAJ_indian_national_army_desc:0 "İngiliz kontrolündeki kuvvetlerden farklı bir Hint Ulusal Ordusu organize edildi. Onu İngiliz müdahalesinden uzak bölgelerde inşa edebilir ve Müttefiklere karşı sıralanabilir, Hint insan gücünü Raj'dan çekebiliriz."
 RAJ_indian_national_army_effect:0 "Faşist destekçiler özgürlük için bir iç savaş başlatır. Büyüklük parti desteğine ve özerklik ilerlemesine bağlıdır."
 RAJ_indian_national_army_support:0 "[GER.GetNameDefCap] davalarını destekleyecektir."
 RAJ_indian_national_congress:0 "Hint Ulusal Kongresi"
 RAJ_indian_national_congress_desc:0 "Hint Ulusal Kongresi altkıtadaki seçimlerde çok başarılı oldu. Bağımsız bir Hindistan için ya da en azından İmparatorluk içinde daha fazla özerkliğe sahip bir Hindistan için güçlü bir sestirler."
 RAJ_indian_peoples_army:0 "Hint Halk Ordusu"
 RAJ_indian_peoples_army_desc:0 "Komünist davadan öğrenecek ve onunla müttefik olacak bir askeri güç organize etmeliyiz."
 RAJ_indian_peoples_army_effect:0 "Komünist destekçiler özgürlük için bir iç savaş başlatır. Büyüklük parti desteğine ve özerklik ilerlemesine bağlıdır."
 RAJ_indian_peoples_army_support:0 "[SOV.GetNameDefCap] davalarını destekleyecektir."
 RAJ_indian_sandhurst_tt:0 "§YKodandera Madappa Cariappa§! adında §Y4 Beceri Generali§! ortaya çıkacaktır.\n§YKodandera Subayya Thimayya§! adında §Y3 Beceri Generali§! ortaya çıkacaktır.\n§YJayanto Nath Chaudhuri§! adında §Y3 Beceri Generali§! ortaya çıkacaktır."
 RAJ_indianisation_of_army:0 "Ordunun Hintlileştirilmesi"
 RAJ_indianisation_of_army_desc:0 "Hindistan'ı topyekun bir savaşta düzgün bir şekilde korumak için tüm Hindistan nüfusu seferber edilmelidir. Bu sadece Hint nüfusundan daha geniş çapta asker toplamak anlamına gelmeyecek, aynı zamanda Hintli subayların otorite zincirinde bir yerde komuta almasına izin vermek anlamına da gelecektir."
 RAJ_industrial_expansion:0 "Endüstriyel Genişleme"
 RAJ_industrial_expansion_desc:0 "Yüz milyonlarca insan Hindistan'ı evi olarak görüyor - bu nüfusun endüstriyel bir devin temeli olmaması için hiçbir neden yok."
 RAJ_institute_of_fundamental_research:0 "Temel Araştırma Enstitüsü"
 RAJ_institute_of_fundamental_research_desc:0 "Önde gelen bilim adamlarımızdan ve sanayicilerimizden bazıları, fizik bilimlerindeki en son keşiflerden yararlanmak için yeni bir Temel Araştırma Enstitüsü'nü savunuyor."
 RAJ_integrate_princely_railways:0 "Prens Demiryollarını Entegre Et"
 RAJ_integrate_princely_railways_desc:0 "Bazı Hint prensleri kendi demiryolu sistemlerini finanse ettiler, ancak şimdiye kadar Raj tarafından inşa edilen demiryolu hatlarıyla zayıf bir şekilde entegre oldular. Ulusun trenlerini birbirine bağlamak için bir şeyler yapılmalıdır."
 RAJ_integration_tooltip:0 "§H$RAJ_population_decisions$§! kararları şimdi şunları ekler:"
 RAJ_integration_tooltip_post:0 "$apply_integration_effects_retroactively$"
 RAJ_ishapore_arsenal:0 "Ishapore Cephaneliği"
 RAJ_ishapore_arsenal_desc:0 "Ishapore Cephaneliği ve Tüfek Fabrikası 18. yüzyıldan beri faaliyettedir. Silah tasarımında birçok yenilikten sorumludur ve silah üretim sistemimizin merkezindedir."
 RAJ_japanese_army_air_force_academy:0 "[Root.GetJAAFAName]"
 RAJ_japanese_army_air_force_academy_desc:0 "Japon Hava Kuvvetleri Akademisi, Asya'daki Avrupa hakimiyetine karşı savaşmak isteyen Hintli askerleri kabul etmeye karar verdi."
 RAJ_japanese_army_air_force_academy_german:0 "Luftwaffe Hava Eğitim Okulu"
 RAJ_japanese_army_air_force_academy_japan:0 "Japon Ordu Hava Kuvvetleri Akademisi"
 RAJ_jungle_training:0 "Orman Eğitimi"
 RAJ_jungle_training_desc:0 "Hindistan, Burma ve Çinhindi ormanlarla kaplıdır ve askerlerimizi bu tehlikeli arazide etkili kılmak için özel eğitim önerilir."
 RAJ_jungle_training_effect:0 "§HOrman Eğitimi§!'ni etkinleştirir!\n§HDeniz Piyadeleri\n Orman§!\n Saldırı: §G+5%§!\n Hareket: §G+10%§!\n§HDağcılar\n Orman§!\n Saldırı: §G+5%§!\n Hareket: §G+10%§!\n§HParaşütçüler\n Orman§!\n Saldırı: §G+5%§!\n Hareket: §G+10%§!\n"
 RAJ_land_clearance:0 "Arazi Temizliği"
 RAJ_land_clearance_desc:0 "Yerel liderler aracılığıyla kanalize edilen artan etkiyle, devlet adına doğal kaynaklarımızı ve arazimizi daha iyi kullanabiliyoruz."
 RAJ_land_clearance_effect_tt:0 "§H$RAJ_population_decisions$§! kararları şimdi §G1§! İnşaat Alanı ekler.\n$apply_integration_effects_retroactively$"
 RAJ_lessons_of_the_great_war:0 "Büyük Savaş'ın Dersleri"
 RAJ_lessons_of_the_great_war_desc:0 "Hindistan sömürge askerleri son dünya savaşına katıldı ve bu çatışmadan alınan dersler ordunun eğitimi ve organizasyonuna uygulanmalıdır."
 RAJ_lions_of_the_great_war:0 "Büyük Savaş'ın Aslanları"
 RAJ_lions_of_the_great_war_desc:0 "Sihlerin güçlü bir askeri geleneği vardır ve son savaşta yüksek derecede ödüllendirilmişlerdir. Pencap Aslanları kendi başlarına güçlü bir alay oluştururlar ve bölge daha fazla asker toplamak için olgundur."
 RAJ_modernizing_army:0 "Modernleşen Ordu"
 RAJ_modernizing_army_desc:0 "Çok uzun bir süredir Hint silahlı kuvvetleri, İngiltere'deki ana orduya sunulan fayda ve teçhizatın çok azına sahip, sömürge bir ileri karakoldan biraz daha fazlası olarak görülüyordu. Raj'da sahip olduklarımızı modernize etme zamanı geldi."
 RAJ_modernizing_navy:0 "Modernleşen Donanma"
 RAJ_modernizing_navy_desc:0 "Daha iyi motorlar, daha fazla mürettebat alanı, daha yüksek hız ve daha büyük toplar. Hindistan donanması yakında kıtanın en iyileri arasında yer alacaktır."
 RAJ_navy_funding:0 "Donanma Finansmanı"
 RAJ_navy_funding_desc:0 "Hindistan Kraliyet Donanması'na Birleşik Krallık'tan daha fazla fon ve varlık verilecektir."
 RAJ_navy_funding_effect:0 "Teknolojiye zaten sahipseniz donanmanıza §Y2 Hafif Kruvazör§! eklenecektir.\n"
 RAJ_navy_funding_effect_mtg:0 "Bu türden §Y2 Hafif Kruvazör§! donanmamıza eklenecektir.\n"
 RAJ_orde_wingate_tt:0 "§YOrde Wingate§! adında §Y4 Beceri Generali§! ortaya çıkacaktır.\n"
 RAJ_princely_state_donations:0 "Prens Devletleri Bağışları"
 RAJ_princely_state_donations_desc:0 "Hindistan Prens Devletleri, uzun süredir İngilizler altında çekirdek Hint ordusu olarak hizmet veren adamları sağladı. Bu yerel yöneticilerden gelen daha fazla bağış, İmparatorluğa verdikleri desteğin altını çiziyor."
 RAJ_provincial_elections:0 "İl Seçimleri"
 RAJ_provincial_elections_desc:0 "Yeni Hindistan Hükümeti Yasası illerde seçim yapılmasını zorunlu kılarak Hint nüfusuna karşı sorumlu bir yerel yönetim ölçüsü oluşturuyor. Bunun İngiliz yönetimi üzerindeki etkisini göreceğiz."
 RAJ_quit_india_movement:0 "Hindistan'ı Terk Et Hareketi"
 RAJ_quit_india_movement_desc:0 "Gandhi'nin Hindistan Bağımsızlığı kampanyası, İngilizlerin Hindistan'ı terk etmesi çağrısıyla doruk noktasına ulaştı. Raj'ın savaş bitmeden sona ermesi düşünülemez, ancak sahadaki durum her geçen gün daha da gerginleşiyor."
 RAJ_raf_funding:0 "RAF Finansmanı"
 RAJ_raf_funding_desc:0 "Hindistan Kraliyet Hava Kuvvetleri'ne Birleşik Krallık'tan daha fazla fon ve varlık verilecektir."
 RAJ_rani_of_jhans:0 "Jhansi Kraliçesi"
 RAJ_rani_of_jhans_desc:0 "Jhansi Kraliçesi, 1857 Hint Devrimi'nin büyük bir kahramanıydı. Cesaret ve ulusal gurur örneği, silahlanmak ve kendi alaylarını kurmak isteyen tüm Hint kadınları için bir modeldir."
 RAJ_rebuilding_the_nation:0 "Ulusunu Yeniden İnşa Et"
 RAJ_rebuilding_the_nation_desc:0 "İmparatorluk zalimi kovulduğuna ve Hint nüfusu harekete geçirildiğine göre, iki yüzyıllık işgalin verdiği zararı onarma zamanı geldi."
 RAJ_red_eagle_division:0 "Kızıl Kartal Tümeni"
 RAJ_red_eagle_division_desc:0 "Kızıl Kartal Tümeni, zorlu koşullarda savaşmaya hazır, denizaşırı savaşmak üzere eğitilen ilk Hint tümeni olacaktır."
 RAJ_research_city_excursions:0 "Araştırma Şehri Gezileri"
 RAJ_research_city_excursions_desc:0 "Sovyet Araştırma Şehirleri bir harikadır ve Hindistan nüfusu enerjik ve zeki beyinlerle doludur. Genç mühendislerimizi bu şehirlere göndermek, yerli bir araştırma ve sanayi tabanı geliştirmemize yardımcı olacaktır."
 RAJ_research_collaboration:0 "Araştırma İşbirliği"
 RAJ_research_collaboration_desc:0 "İngilizler bize yakın müttefikler arasında bilimsel ilerlemeyi paylaşmanın avantajını gösterdi. Bunu koordine etmek için gerekli adımları atarsak, tüm fraksiyonumuz savaş zamanı Ar-Ge'yi daha verimli bir şekilde yürütebilecektir."
 RAJ_revive_the_screw_guns:0 "Vidalı Topları Canlandır"
 RAJ_revive_the_screw_guns_desc:0 "Kuzey Hindistan'ın dağlık arazisi, sökülüp ihtiyaç duyulan her yere katır sırtında taşınabilen bir topçu parçasının geliştirilmesine yol açtı. Bu 7 librelik biraz modası geçmiş olabilir, ancak kullanışlılığını görmezden gelmemeliyiz."
 RAJ_royal_indian_air_force:0 "Kraliyet Hint Hava Kuvvetleri"
 RAJ_royal_indian_air_force_desc:0 "Küçük hava tümenimizi alıp onu silahlı kuvvetlerin kendi koluna genişletme zamanı geldi. Bağımsız komutaya sahip ulusal bir hava kuvveti, Hint halkına ve İmparatorluğa daha iyi hizmet edebilecektir."
 RAJ_royal_indian_artillery:0 "Kraliyet [ROOT.GetAdjective] Topçusu"
 RAJ_royal_indian_artillery_desc:0 "Kraliyet Hint Topçusu, Doğu Hindistan Şirketi'nin 1748'de Hintli topçularla bir topçu taburu kurmasından bu yana var olmuştur. Bu uzun yıllara dayanan deneyimden yararlanabiliriz."
 RAJ_royal_indian_navy:0 "Kraliyet [ROOT.GetAdjective] Donanması"
 RAJ_royal_indian_navy_desc:0 "Kraliyet [ROOT.GetAdjective] Donanması'nın hızla genişletilmesi gerekecektir. Yeni taktikler ve yeni gemiler öncelikli olmalıdır."
 RAJ_screening_effort:0 "Perdeleme Gayreti"
 RAJ_screening_effort_desc:0 "Hindistan, Süveyş Kanalı'na giden güney güzergahını savunmada önemli bir rol oynamaktadır. Perdeleme ve eskort görevleri, hayati malzemelerin ve askerlerin Avrupa ve Afrika cephelerine ulaşmasına yardımcı olacaktır."
 RAJ_seek_help_from_germany:0 "Almanya'dan Yardım İste"
 RAJ_seek_help_from_germany_desc:0 "Almanya bize İngiltere'nin verdiği zararı asla vermedi ve Reich, İngiliz gücüne karşı en olası meydan okumadır. Mihver güçlerine daha da yaklaşmalıyız."
 RAJ_seek_help_from_germany_promised:0 " Alman Reich yardımlarını vadetti"
 RAJ_seek_help_from_soviet:0 "Sovyet'ten Yardım İste"
 RAJ_seek_help_from_soviet_desc:0 "Sovyetler Birliği, İngiliz İmparatorluk gücüne karşı doğal bir denge unsuru. Devrimin motoru olduklarını iddia ediyorlar ve devrimlerini Hindistan'a ihraç etmeleri için onları teşvik etmeliyiz."
 RAJ_seek_help_from_soviet_promised:0 " Sovyetler Birliği yardımlarını vadetti"
 RAJ_strengthen_ties_with_british_investors:0 "İngiliz Yatırımcılarla Bağları Güçlendir"
 RAJ_strengthen_ties_with_british_investors_desc:0 "Fabrikalarımızı ve kaynaklarımızı genişletmek için hala büyük ölçüde İngiliz sermayesine güveniyoruz. Kendi güçlü bankacılık sektörümüz olana kadar, destek aramak için Londra'ya diz çökmeliyiz."
 RAJ_submarine_effort:0 "Denizaltı Gayreti"
 RAJ_submarine_effort_desc:0 "Asya'da Japon deniz yüzey gücünün yükselişiyle, enerjimizi denizin altına yönlendirmek, denizaltılardan saldırmak mantıklı olabilir."
 RAJ_swaraj:0 "Swaraj"
 RAJ_swaraj_desc:0 "Gandhi'nin kendi kendini yönetme kavramı - Swaraj - Hindistan genelinde popülerlik kazanıyor. İngiliz kurumlarından ve geleneklerinden tamamen kopmayı savunuyor ve Swaraj grupları Hint okullarında ajitasyon yapıyor."
 RAJ_tata_steel:0 "Tata Çelik"
 RAJ_tata_steel_desc:0 "Tata Çelik, İmparatorluğun en büyük çelik üreticisi olma yolunda ilerliyor. Daha fazla üretim, Hindistan'ın modernleşmesini daha da hızlandıracaktır."
 RAJ_the_bangalore_torpedo:0 "Bangalore Torpidosu"
 RAJ_the_bangalore_torpedo_desc:0 "İngiliz Hindistanı'nın savaş sanatına en büyük katkılarından biri, mühendisler ateş altındayken engelleri yok etmek için kullanılabilecek bir dizi bağlı boru olan Bangalore Torpidosu'dur. Bu cihaz dünya çapında büyük popülerlik kazanmıştır."
 RAJ_the_smiling_buddha:0 "Gülümseyen Buda"
 RAJ_the_smiling_buddha_desc:0 "Bilim adamları atom enerjisinin sırrını çözmeye yakınlar - ve bu çok güçlü patlayıcıların yaratılmasına yol açacaktır. Atom silahları arayışında geride kalamayız."
 RAJ_two_nation_theory:0 "İki Ulus Teorisi"
 RAJ_two_nation_theory_desc:0 "Uzun süre tek bir bölge olarak yönetilmesine rağmen, Hindistan'ı biri Hindu diğeri Müslüman olmak üzere iki ulus olarak görmek mantıklıdır. Ülkenin bölünmesi tek cevap olmayabilir, ancak bağımsız bir Hindistan için herhangi bir anlaşma altkıtanın bu ikili doğasıyla yüzleşmelidir."
 RAJ_two_nation_theory_effect:0 "Hindistan özgürlüğünü kazandığında Pakistan serbest bırakılacaktır.\n"
 RAJ_vickers_berthier_gun:0 "Vickers-Berthier Silahı"
 RAJ_vickers_berthier_gun_desc:0 "Vickers-Berthier biraz hantaldır ancak hızla üretilebilme erdemine sahiptir. Hindistan gibi bir ulus için bu, bir silahta çok önemli bir özelliktir."
 RAJ_workforce_integration:0 "İşgücü Entegrasyonu"
 RAJ_workforce_integration_desc:0 "Bölgesel ve kabile liderlerinin yerel gücünü kullanarak, aksi takdirde boşa harcanan kaynakları kırsal alanlardaki iyileştirme programlarına yönlendirebiliyoruz."
 ROM_white_squadron_focus:0 "Beyaz Filo"
 ROM_white_squadron_focus_desc:0 "Soylu bir aileden gelen yetenekli bir pilot olan Marina Ştirbei tarafından önerilen Beyaz filo, yalnızca kadınlar tarafından yönetilen hava ambulanslarından oluşan bir hizmettir. Sadece kurtuluşun yakın olabileceği düşüncesi bile askerlerimizin moralini yüksek tutabilir."
 SAF_Union_of_the_African_People:0 "Afrika Halkları Birliği"
 SAF_Union_of_the_African_People_desc:0 "En uzun süre boyunca, Afrika halklarının kendi kaderlerini belirlemede söz hakkı yoktu. O günler sona erdi. Dünyanın intikamcı güçlerinin başarılarımızı geri alma girişimlerine dayanabilecek kadar güçlü bir fraksiyon yaratacağız. Afrika sömürgecilikten kurtulacak."
 SAF__south_african_military_college:0 "Güney Afrika Askeri Koleji"
 SAF__south_african_military_college_desc:0 "Güney Afrika'nın Amerika Birleşik Devletleri'ndeki West Point çizgilerinde modellenmiş bir askeri akademisi olmalıdır. Bu bize Birliğe sadık profesyonel bir subay kadrosu verecektir."
 SAF_a_king_for_our_people:0 "Halkımız İçin Bir Kral"
 SAF_a_king_for_our_people_desc:0 "Güney Afrika'nın bir kralı olmalı ve neyse ki şu anda kimsenin kullanmadığı bir Windsor var. Eski VIII. Edward, Windsor Dükü, tahtımıza oturabilir."
 SAF_a_king_for_our_people_trigger_tt:0 "Kral Edward sürgün edildi"
 SAF_abandon_westminster:0 "Westminster'ı Terk Et"
 SAF_abandon_westminster_desc:0 "Süveyş'in Cape rotasının yerini alması ve Boer Savaşı'nın biçimlendirici deneyimi, Dominyon müttefiklerimizinkinden farklı bir Güney Afrika kimliği yaratılmasına yardımcı oldu. Kendimizi Kral'dan uzaklaştırmalı ve kendi yolumuzu çizmeliyiz."
 SAF_anti_colonialist_crusade:0 "Anti-Sömürgeci Haçlı Seferi"
 SAF_anti_colonialist_crusade_desc:0 "Sömürgecilik, dünya işçilerini ezen emperyalist sistemin kalbinde yer almaktadır. Bu sistemi yıkmak ve Afrika halkını yüzyıllardır katlanmak zorunda kaldıkları sömürüden kurtarmak için eşsiz bir konumdayız."
 SAF_anti_submarine_tactics:0 "Denizaltı Karşıtı Taktikler"
 SAF_anti_submarine_tactics_desc:0 "Denizaltılar Ümit Burnu'ndan geçen gemileri tehdit ediyor. Onları bulmalı ve yok etmeliyiz."
 SAF_armament_effort:0 "Silahlanma Gayreti"
 SAF_armament_effort_desc:0 "Güney Afrika herhangi bir yabancı gücün işgalinden güvendedir, ancak müttefiklerinden de uzaktır. Birliğin asla savunmasız kalmaması için kendi silah sanayisini geliştirmesi hayati önem taşımaktadır."
 SAF_armor_effort:0 "Zırh Gayreti"
 SAF_armor_effort_desc:0 "Tanklar son savaşın hantal canavarlarından çok yol kat etti. Araştırmamız ve eğitimimiz düşmanlarımızın - ya da dostlarımızın - gerisinde kalamaz."
 SAF_burn_the_kings_portraits:0 "Kralın Portrelerini Yak"
 SAF_burn_the_kings_portraits_desc:0 "Kahrolsun Kraliyet Ailesi! Bu sembolik jest, yabancı tahttan ayrılışımızı kamuoyuna ilan edecektir."
 SAF_cape_garrison_artillery:0 "Cape Garnizon Topçusu"
 SAF_cape_garrison_artillery_desc:0 "Cape, birçok ulus için önemli bir deniz yolu olmaya devam ediyor ve Güney Afrika'nın kalbine açılan kapıdır. Garnizonun kıyı savunmalarının ve topçularının genişletilmesi yapılacaklar listemizin başında olmalıdır."
 SAF_celebrate_the_great_trek:0 "Büyük Göç'ü Kutla"
 SAF_celebrate_the_great_trek_desc:0 "Bir asır önce, Afrikaner atalarımız yükselen İngiliz sömürge gücünden ayrıldı ve kuzeydoğuda kendi Boer uluslarını kurdular. Dayanıklı ruhları hala Güney Afrika erdeminin en iyisini temsil ediyor."
 SAF_civil_war_tt:0 "Güney Batı Afrika'daki §Yfaşist Milliyetçiler§! ile ülkenin geri kalanındaki §Ydemokratik Birlikçiler§! arasında §Rbir iç savaş çıkacaktır§!."
 SAF_commemorate_the_battle_of_blood_river:0 "Kan Nehri Savaşı'nı An"
 SAF_commemorate_the_battle_of_blood_river_desc:0 "1838'de, bir Boer yerleşimci vagon kampı on binlerce Zulu savaşçısını püskürttü ve Natal'daki Zulu gücüne ölümcül bir darbe vurdu. Bu kesinlikle davamızın doğruluğunun ilahi bir işaretiydi."
 SAF_commit_to_the_five_year_plan:0 "Beş Yıllık Plana Taahhüt Et"
 SAF_commit_to_the_five_year_plan_desc:0 "Güney Afrika hava kuvvetlerinin modernizasyonu ve genişletilmesi için bir Beş Yıllık Plan geliştirdik. Hükümet bu programın gerisinde kalmamaya kamuoyu önünde taahhüt etmelidir."
 SAF_csir:0 "CSIR"
 SAF_csir_desc:0 "Güney Afrika bilim ve teknolojide diğer Dominyonların gerisinde kalıyor, bu nedenle Pretoria'da Bilimsel ve Endüstriyel Araştırma Konseyi'nin kurulması hükümet için acil bir mesele haline geldi."
 SAF_defense_collaboration_initiative:0 "Savunma İşbirliği Girişimi"
 SAF_defense_collaboration_initiative_desc:0 "İngilizler bize yakın müttefikler arasında bilimsel ilerlemeyi paylaşmanın avantajını gösterdi. Bunu koordine etmek için gerekli adımları atarsak, tüm fraksiyonumuz savaş zamanı Ar-Ge'yi daha verimli bir şekilde yürütebilecektir."
 SAF_demand_madagascar:0 "Madagaskar'ı Talep Et"
 SAF_demand_madagascar_desc:0 "Avrupa'daki durumun dramatik değişiklikleriyle, tüm sömürgecilik sistemini yeniden değerlendirme zamanı geldi. Madagaskar neden düşen bir imparatorluğa zincirlenmeli?"
 SAF_desert_air_force:0 "Çöl Hava Kuvvetleri"
 SAF_desert_air_force_desc:0 "Çöl gökyüzü açıktır ve sıcaklık ve kum, uçaklarımızın mekaniklerine özel dikkat gösterilmesi gerektiği anlamına gelir. Bu affetmeyen ortamda öğrenilecek değerli beceriler vardır."
 SAF_desert_equipment:0 "Çöl Teçhizatı"
 SAF_desert_equipment_desc:0 "Kuzey Afrika'daki savaş özel teçhizat gerektiriyor ve kuvvetlerimiz o cephede hizmet etmek üzere çağrılabileceğinden, o teçhizatın sağlanması ve tedariki önemli bir lojistik mesele haline gelecektir."
 SAF_disrupt_the_trade:0 "Ticareti Aksat"
 SAF_disrupt_the_trade_desc:0 "Son savaş konvoyların ve eskortların önemini gösterdi. Güney Afrika önemli bir ticaret yolu üzerinde yer alıyor ve düşman gemilerini önlemek ve yok etmek için ideal bir konuma sahip."
 SAF_emergency_workers:0 "Acil Durum İşçileri"
 SAF_emergency_workers_desc:0 "Savaş çabaları için Güney Afrika nüfusunun daha fazlasını seferber etme zamanı geldi. Kadınlar da daha düşük maliyetle fabrikalara getirilebilir."
 SAF_empower_the_workers:0 "İşçileri Güçlendir"
 SAF_empower_the_workers_desc:0 "Biz madenciler ve çiftçilerden oluşan bir ülkeyiz. Güney Afrika'nın çalışan halkı ulusal iradenin tek gerçek temsilcisidir."
 SAF_encourage_segregation:0 "Ayrımcılığı Teşvik Et"
 SAF_encourage_segregation_desc:0 "Yönetici sınıfımızın gücünü ve birliğini teşvik etmek için farklı etnik nüfuslarımızı yasal olarak ayırmak için daha fazla çaba göstermeliyiz."
 SAF_equal_opportunity_employment:0 "Fırsat Eşitliği İstihdamı"
 SAF_equal_opportunity_employment_desc:0 "Ulusumuzdaki işçilerin durumunu iyileştireceksek, ten renklerine bakılmaksızın tüm işçilerin eşit muamele görmesini sağlamakla başlamalıyız."
 SAF_equipment_effort:0 "Teçhizat Gayreti"
 SAF_equipment_effort_desc:0 "Ordumuz için gerekli olan destek teçhizatının tedarikini ihmal edemeyiz. Silahlar ve tanklar iyidir, ancak üniformalara, telsizlere, tamir takımlarına ve daha fazlasına ihtiyacımız var."
 SAF_establish_the_atomics_energy_board:0 "Atom Enerjisi Kurulunun Kurulması"
 SAF_establish_the_atomics_energy_board_desc:0 "Atom silahları, baruttan bu yana en büyük askeri buluş olacak; eğer atomu kontrol altına alabilirsek, bu gücün barışçıl kullanımlarından bahsetmiyorum bile. Bunu incelemek için en iyi bilim adamlarımızı bir araya getirin."
 SAF_expand_the_cape_corps:0 "Cape Kolordusunu Genişlet"
 SAF_expand_the_cape_corps_desc:0 "Cape Kolordusunu çoğunlukla muharip olmayan bir güç olarak yeniden kursak da, işgal tehdidi Kolorduya daha fazla kaynak, eğitim ve silahlara erişim vermemiz gerektiği anlamına geliyor."
 SAF_expand_the_mining_industry:0 "Madencilik Sektörünü Genişlet"
 SAF_expand_the_mining_industry_desc:0 "Güney Afrika'nın mineral zenginliği efsanevidir ve derin altın, krom ve platin rezervlerini daha yeni yeni kullanmaya başladık."
 SAF_expand_the_rand_mines:0 "Rand Madenlerini Genişlet"
 SAF_expand_the_rand_mines_desc:0 "Rand Madenleri dünyanın en derin altın madenlerinden bazılarıdır - ve bu 19. yüzyıl teknolojisiyle bile böyledir. Artık çok daha fazlasını yapabiliriz. Derin kazın! Ve hatta açgözlülükle."
 SAF_expand_the_simons_town_base:0 "Simon's Town Üssünü Genişlet"
 SAF_expand_the_simons_town_base_desc:0 "Cape'deki Simon's Town, 1790'lardan beri güney Afrika'daki en önemli deniz üssü olmuştur. Daha fazla ve daha büyük gemileri barındırmak için yeniden donatılmalı ve genişletilmelidir."
 SAF_expand_the_south_african_artillery:0 "Güney Afrika Topçusunu Genişlet"
 SAF_expand_the_south_african_artillery_desc:0 "Topçu kolordusu 1934'te birleştirildi. Şimdi boyutunu ve kapasitesini artırma zamanı geldi."
 SAF_fund_the_university_of_south_africa:0 "Güney Afrika Üniversitesi'ni Finanse Et"
 SAF_fund_the_university_of_south_africa_desc:0 "Pretoria'daki Güney Afrika Üniversitesi kıtadaki en iyi üniversitelerden biridir - hatta güney yarımkürede. Ona yatırım yaparak, gençlerimizi denizaşırı göndermek yerine kendi yerel yeteneklerimizi yetiştirebiliriz."
 SAF_german_research_tt:0 "Almanya ile bir teknoloji paylaşım anlaşması yapacağız."
 SAF_german_scientists:0 "Alman Bilim Adamları"
 SAF_german_scientists_desc:0 "Alman bilim adamları dünyanın en iyileri arasındadır ve bizimle paylaşacak çok şeyleri vardır."
 SAF_heavy_engineering:0 "Ağır Mühendislik"
 SAF_heavy_engineering_desc:0 "Güney Afrika'nın en son mühendislik teknikleriyle güncel kalması önemlidir. Sanayi tabanımız küçük olsa da, akranlarımıza hızla yetişmek için ağır makinelere ve mühendisliğe yatırım yapmalıyız."
 SAF_improve_the_hawker_hartbees:0 "Hawker Hartbees'i Geliştir"
 SAF_improve_the_hawker_hartbees_desc:0 "Sahip olduğumuz Hawker Hartbees'ler dünyanın en gelişmiş avcı uçakları değil, ama idare edeceğiz. Geliştirilmiş mekanikler ve eğitim, bu çift kanatlı uçaklardan en iyi şekilde yararlanacaktır."
 SAF_improve_the_three_oh_three:0 "Üç Sıfır Üç'ü Geliştir"
 SAF_improve_the_three_oh_three_desc:0 "Güney Afrika birlikleri çeşitli iklimlerde savaşacak ve Lee-Enfield tüfeğinin kolayca özelleştirilebilmesi bizim için bir şans. .303 fişeği, ihtiyaçlarına göre diğer ülkeler tarafından birkaç kez değiştirildi."
 SAF_infrastructure_effort:0 "Altyapı Gayreti"
 SAF_infrastructure_effort_desc:0 "Güney Afrika'nın çoğu kırsal ve gelişmemiş durumda. Daha fazla yol ve demiryolu, ülkenin doğal zenginliğini aç limanlarına taşıyabilir."
 SAF_invite_soviet_advisers:0 "Sovyet Danışmanlarını Davet Et"
 SAF_invite_soviet_advisers_desc:0 "Sovyetler Birliği'ni dünya işçilerine özgürlük getirme mücadelelerinde destekleyeceksek, onlardan öğrenerek ordumuzu geliştirmeliyiz."
 SAF_join_comintern:0 "Komintern'e Katıl"
 SAF_join_comintern_desc:0 "Sovyetler Birliği, işçiler ve Faşizme karşı haçlı seferinin ön saflarında yer aldı. Güçlü ittifaklarına katılacağız."
 SAF_joint_air_training_scheme:0 "Ortak Hava Eğitim Programı"
 SAF_joint_air_training_scheme_desc:0 "İngiliz Milletler Topluluğu ulusları, pilotların ve hava mürettebatının eğitimini kolaylaştırmak ve hızlandırmak için kaynaklarını ve deneyimlerini bir araya getiriyor."
 SAF_liberate_belgian:0 "Belçika Sömürgelerini Özgürleştir"
 SAF_liberate_belgian_desc:0 "Belçika Kongosu, sömürü ve baskının en acımasız hikayelerinden biri olarak kabul edilir. O hikayenin son bölümünü biz yazacağız."
 SAF_liberate_british:0 "İngiliz Sömürgelerini Özgürleştir"
 SAF_liberate_british_desc:0 "Britanya İmparatorluğu tarihteki en kötü şöhretli sömürgecilik örneğidir. Onu sona erdireceğiz."
 SAF_liberate_portugese:0 "Portekiz Sömürgelerini Özgürleştir"
 SAF_liberate_portugese_desc:0 "Angola ve Mozambik sömürgeleri sınırlarımızın hemen yanında yer alıyor. Halklarının sömürülmesine son verme zamanı geldi."
 SAF_mechanization_effort:0 "Mekanizasyon Gayreti"
 SAF_mechanization_effort_desc:0 "Motorlu ve mekanize savaş kapımızda. Geleceğin Büyük Göçü paletli ve tekerlekli araçlar tarafından yönlendirilecektir."
 SAF_native_laws_amendment_act:0 "Yerli Yasaları Değişiklik Yasası"
 SAF_native_laws_amendment_act_desc:0 "Afrikaner nüfusuna daha fazla iş garantisi sağlamak için, Siyah Güney Afrikalıların şehirler içindeki yerleşimini sınırlamalıyız. Sadece belediyede uzun bir geçmişi olanların ikamet hakları olacaktır."
 SAF_outlaw_strikes:0 "Grevleri Yasakla"
 SAF_outlaw_strikes_desc:0 "İş durdurmaları ve işgücü kesintileri kriz zamanlarında vatansever değildir. Grevler bundan böyle yasadışı ilan edilir ve hükümet insanları işe geri dönmeye zorlayacaktır."
 SAF_perfect_the_cab_rank_technique:0 "\"Cab-Rank\" Tekniğini Mükemmelleştirin"
 SAF_perfect_the_cab_rank_technique_desc:0 "\"Cab-Rank\" Tekniği, bir dizi bombardıman uçağının uzun bir sıra halinde birer birer hedefi vurmasını içerir. Bu, düşman üzerindeki baskıyı korur, ancak büyük miktarda beceri gerektirir."
 SAF_police_windhoek:0 "Windhoek'u Polis Kontrolüne Al"
 SAF_police_windhoek_desc:0 "Son savaş sona erdiğinden beri eski Alman sömürgesi Güney-Batı Afrika üzerinde bir yetkimiz var. Büyük Windhoek şehrini güvence altına alma ve iyileştirme görevimizi yerine getirmemiz hayati önem taşıyor."
 SAF_prepare_overseas_offensive:0 "Denizaşırı Taarruza Hazırlan"
 SAF_prepare_overseas_offensive_desc:0 "Kilometrelerce kıyı şeridiyle Güney Afrika, askerlerini amfibi savaşta eğitmek için uygundur. Bu en zor becerilerden biridir, ancak çocuklarımız bununla başa çıkabilir."
 SAF_pretoria_arms:0 "Pretoria Silahları"
 SAF_pretoria_arms_desc:0 "Pretoria'daki mevcut çelik fabrikaları ağır levhaya odaklanmıştır. Ancak bazı takım tezgahlarıyla fabrikanın bir kısmını hafif silah üretim merkezine dönüştürebiliriz."
 SAF_protect_the_trade:0 "Ticareti Koru"
 SAF_protect_the_trade_desc:0 "Son savaş konvoyların ve eskortların önemini gösterdi. Güney Afrika önemli bir ticaret yolu üzerinde yer alıyor ve malların hedeflerine ulaşmasını sağlamalıdır."
 SAF_q_services_corps:0 "Q Hizmetleri Kolordusu"
 SAF_q_services_corps_desc:0 "Q Hizmetleri Kolordusu, daimi ordunun lojistiği ve tedarikinden sorumlu merkezi otorite olacaktır. Petrol, erzak, mühimmat ve üniforma dağıtımını üstlenecektir."
 SAF_reclaim_boer_colonies:0 "Boer Sömürgelerini Geri Al"
 SAF_reclaim_boer_colonies_desc:0 "Eski Boer toprağı Transvaal ve diğer bölgeler haklı olarak o girişimci halkın özgür mirasçılarına aittir."
 SAF_reconstitute_the_cape_corps:0 "Cape Kolordusunu Yeniden Kur"
 SAF_reconstitute_the_cape_corps_desc:0 "Tarihsel olarak, Güney Afrika'yı savunmak için Renkli nüfusumuzun bir kısmını hizmete alabildik. Bu, ülkedeki herkes tarafından popüler değil, ancak beyaz Güney Afrikalıları denizaşırı hizmet için serbest bırakacaktır."
 SAF_repeal_the_native_representation_act:0 "Yerli Temsil Yasasını Kaldır"
 SAF_repeal_the_native_representation_act_desc:0 "Irk ayrımcılığı Güney Afrika'daki halk devriminin değerlerine aykırıdır. Siyahlar genel oy kütüklerine geri getirilmeli ve siyasi haklar verilmelidir."
 SAF_replace_the_blenheim:0 "Blenheim'ı Değiştir"
 SAF_replace_the_blenheim_desc:0 "Bristol Blenheim, RAF ve Dominyonlar için kullanışlı bir hafif bombardıman uçağı olmuştur. Ancak daha sağlam, daha uzun menzilli bir şey bulma zamanı gelmiş olabilir."
 SAF_retain_experienced_pilots:0 "Deneyimli Pilotları Tut"
 SAF_retain_experienced_pilots_desc:0 "Çok sık olarak deneyimli pilotlarımız kendi kuvvetimizde kalmak yerine RAF'a geçiyor. RAF'ın ilerleme ve muharebe için daha iyi fırsatları var. Ancak eğitimli pilotlarımızı diğer Güney Afrikalılara ilham verebilecekleri ve eğitebilecekleri eve yakın tutmaya çalışmalıyız."
 SAF_sa_engineer_corps:0 "SA Mühendis Kolordusu"
 SAF_sa_engineer_corps_desc:0 "Güney Afrika Mühendis Kolordusu'nun üniformalı sadece 600 adamı var. Bu modern bir orduda kabul edilemez. Bu önemli görev için daha fazla adama ve daha fazla eğitime ihtiyacımız var."
 SAF_seaward_defence_force:0 "Deniz Savunma Gücü"
 SAF_seaward_defence_force_desc:0 "Deniz Savunma Gücü yirmi yıldır donanmamız olarak hizmet vermektedir. Finansmanı artırılmalıdır."
 SAF_secure_interests_in_africa:0 "Afrika'daki Çıkarları Güvence Altına Al"
 SAF_secure_interests_in_africa_desc:0 "Güney Afrika Birliği, yönetimimize bırakılabilecek bir dizi İngiliz sömürgesine komşudur. Ayrıca Güney-Batı Afrika üzerindeki Yetkimizi kalıcı olarak güvence altına almak için elimizden geleni yapmalıyız."
 SAF_secure_the_cape_sea_route:0 "Cape Deniz Yolunu Güvence Altına Al"
 SAF_secure_the_cape_sea_route_desc:0 "Süveyş düşerse, Cape yeniden Doğu'ya açılan kapı olacaktır. Ne pahasına olursa olsun savunun."
 SAF_south_africa_first:0 "Önce Güney Afrika"
 SAF_south_africa_first_desc:0 "Güney Afrika kıtadaki en güçlü bağımsız ulustur ve bu nedenle Afrika'nın ve eski sömürgelerin geleceği için bir mihenk taşı olabilir."
 SAF_south_african_railways:0 "Güney Afrika Demiryolları"
 SAF_south_african_railways_desc:0 "Güney Afrika Demiryolları şirketinin genişletilmesi gerekiyor. Gençlik grupları orada eğitilebilir ve hem ülkede çalışmak hem de denizaşırı hizmet etmek için gerekli beceriler verilebilir."
 SAF_south_african_soviet_research_treaty:0 "SSCB ile Araştırma Antlaşması"
 SAF_south_african_soviet_research_treaty_desc:0 "Sovyet dostlarımızdan birçok değerli ders aldıktan sonra, ilişkiyi derinleştirme ve resmi bir antlaşma imzalama zamanı geldi."
 SAF_south_african_special_forces:0 "Güney Afrika Özel Kuvvetleri"
 SAF_south_african_special_forces_desc:0 "Güney Afrika'nın ulaşılması zor yerlerdeki zor işleri halletmek için yerli bir komando ekibine ihtiyacı var."
 SAF_south_african_steel:0 "Güney Afrika Çeliği"
 SAF_south_african_steel_desc:0 "Kömürümüz ve demirimiz var. Şimdi sebebimiz var. Pretoria'daki Iscor çelik fabrikalarının genişletilmesi, ülkeye modern silahlar için gerekli olan ağır çelik levhayı sağlayacaktır."
 SAF_special_service_battalion:0 "Özel Hizmet Taburu"
 SAF_special_service_battalion_desc:0 "Güney Afrika, yapacak yararlı bir şeyler bulması gereken genç, işsiz erkeklerle dolu. Özel Hizmet Taburu, çok ihtiyaç duyulan disiplin ve organizasyonu aşılayacaktır."
 SAF_strengthen_the_cape_garrison_artillery:0 "Cape Garnizon Topçusunu Güçlendir"
 SAF_strengthen_the_cape_garrison_artillery_desc:0 "Cape Garnizon topları, Cape'i düşman saldırısından korumak için yükseltilmeli ve artırılmalıdır."
 SAF_submarine_warfare:0 "Denizaltı Savaşı"
 SAF_submarine_warfare_desc:0 "Düşman ticaret konvoyları Ümit Burnu'ndan geçmeye devam ediyor. Onlara aşağıdan saldıracağız."
 SAF_support_axis_interests:0 "Mihver Çıkarlarını Destekle"
 SAF_support_axis_interests_desc:0 "Mihver güçlerinin, Güney Afrika'nın dünyadaki yerini belirlemesine yardımcı olabilecek bir enerjisi ve ideolojisi vardır. Onlara tam diplomatik desteğimizi vermeliyiz."
 SAF_support_axis_interests_effect_tt:0 "Afrika'nın güney ve orta kesimlerinde bulunan işgal altındaki eyaletlerde §YAltyapı§! inşa et ve §Yİnşaat Alanları§! ekle.\n"
 SAF_support_nazification_of_south_west_africa:0 "Güney-Batı Afrika'nın Nazileştirilmesini Destekle"
 SAF_support_nazification_of_south_west_africa_desc:0 "Eski bir Alman sömürgesi olarak, Güney-Batı Afrika'da Alman siyasi fikirlerinin büyümesini teşvik etmemiz uygundur."
 SAF_support_ossewabrandwag:0 "Ossewabrandwag'ı Destekle"
 SAF_support_ossewabrandwag_desc:0 "Faşist Ossewabrandwag paramiliter gücü, yönetici sınıfımızı hedef alan yabancı ajitasyonlara ve iç ayaklanmalara karşı bir siper olarak kullanılmalıdır."
 SAF_support_spain:0 "İspanya'yı Destekle"
 SAF_support_spain_desc:0 "Faşizm Avrupa'da yükselişte ve onu İspanya'da durdurabiliriz - ya da en azından yayılmasını yavaşlatabiliriz. Cumhuriyetçi davayı desteklemek için adam ve malzeme gönderilmelidir."
 SAF_support_the_afrikaner_broederbond:0 "Afrikaner Broederbond'u Destekle"
 SAF_support_the_afrikaner_broederbond_desc:0 "Afrikaner Broederbond, Afrikaner halkı için daha büyük bir ses ve ırkların daha güçlü bir şekilde ayrılması için ajitasyon yapıyor. Boer Savaşı'ndaki İngiliz politikasının hatırası hala güçlü ve Broederbond yeni bir Güney Afrika yaratılmasına yardımcı olabilir."
 SAF_support_the_german_coup:0 "Alman Darbesini Destekle"
 SAF_support_the_german_coup_desc:0 "Alman hükümeti, geçen yüzyıla dayanan daha büyük bir etki için Güney Afrika'yı uzun zamandır verimli bir zemin olarak görüyor. Geleceğimiz İmparatorlukla değil Reich'le, bu yüzden mevcut hükümeti devirme planıyla ilerleyelim."
 SAF_support_the_policy_of_appeasement:0 "Yatıştırma Politikasını Destekle"
 SAF_support_the_policy_of_appeasement_desc:0 "Almanya'nın meşru şikayetleri var ve Dominyonlar son savaşta büyük acılar çekti. Zamanımızda barış için her fırsattan yararlanmalıyız."
 SAF_support_the_world_revolution:0 "Dünya Devrimini Destekle"
 SAF_support_the_world_revolution_desc:0 "İşçilerin zafer kazanmasının tek yolu, tüm dünyayı tek bir çabada birleştirmektir. Devrim evrensel olmalı ve bu nedenle ihraç edilmelidir."
 SAF_suppress_the_stormjaers:0 "Stormjaerleri Bastır"
 SAF_suppress_the_stormjaers_desc:0 "Faşist Alman yanlısı Ossewabrandwag'ın (OB) benzer Avrupa gruplarına modellenmiş bir paramiliter kanadı var. Hükümetin asker toplama ve güvenli ve birleşik bir savaş politikası izleme çabalarını aksatıyorlar. Stormjaerler dağıtılmalıdır."
 SAF_the_cape_defense_institute:0 "Cape Savunma Enstitüsü"
 SAF_the_cape_defense_institute_desc:0 "Güney Afrika artık tamamen egemen bir ulus olduğuna göre, daha önce olduğu gibi gelişmiş prototiplere ve planlara erişimimiz yok. Düşmanlarımızın her zaman önünde kalmamızı ve teknolojide geride kalmamamızı sağlamalıyız."
 SAF_voortrekker_monument:0 "Voortrekker Anıtı"
 SAF_voortrekker_monument_desc:0 "Büyük Göç'ü gerçekleştiren Voortrekkerlere adanmış bir anıt, bu sıkıntılı zamanlarda ulusal ruhu ve birliği güçlendirecektir."
 SAF_war_measures_act:0 "Savaş Önlemleri Yasası"
 SAF_war_measures_act_desc:0 "Savaş çabalarının aksamasına izin veremeyiz, bu nedenle hükümet amaçlarına tam uyumu sağlamak için yeni yasalar çıkarıyoruz. Bu, kaynak akışını koruyacak ve siyasi enerjiyi ihtiyaç duyulan yere odaklamamızı sağlayacaktır."
 SAF_work_for_all_poor:0 "Tüm Yoksullar İçin İş"
 SAF_work_for_all_poor_desc:0 "Yoksul kırsal Afrikanerler son birkaç yıldır iş aramak için şehirlere akın etti ve onlara yardım etmek için pek bir şey yapmadık. Şimdiye kadar. Sanayileşme ve işe erişimlerinin hükümet tarafından korunması bu nüfusa yardımcı olacaktır."
