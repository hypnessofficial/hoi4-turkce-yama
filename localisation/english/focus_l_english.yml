 radar_focus:0 "RADAR"
 radar_focus_desc:0 "Düşman bombardıman uçaklarını tespit etme yeteneği savaş çabaları için hayati önem taşıyacaktır. Radar teknolojisini daha da geliştirmek ve kıyılar boyunca bir tespit istasyonları ağı inşa etmek için hiçbir kaynaktan kaçınmamalıyız."
