 SOV_USSR_ALLIANCE_DESC_EXILES:0 "milliyetçi"
 SOV_annex_tannu_tuva:0 "Tannu Tuva'yı İlhak Et"
 SOV_annex_tannu_tuva_desc:0 "Ekonomik olarak pek önemli olmasa da, siyasi nedenlerle Tannu Tuva Halk Cumhuriyeti'ni Sovyetler Birliği içinde özerk bir oblast olarak resmi olarak ilhak etmeliyiz."
 SOV_anti_capitalist_diplomacy:0 "Anti-Kapitalist Diplomasi"
 SOV_anti_capitalist_diplomacy_desc:0 "Küresel devrimin önündeki en büyük engeller, şüphesiz, ABD'nin şişman bankacıları ve Birleşik Krallık'ın acımasız sömürgeci zalimleridir. Her zaman öncelikli amacımız, onların açgözlü ellerine bir tokat atmak ve liberalist propagandalarını baltalamak olmalıdır."
 SOV_anti_colonialist_rebels:0 "Komintern"
 SOV_anti_colonialist_rebels_desc:0 "Kapitalist sistemin nihai çöküş dönemine girmesiyle, tüm Komünist partiler için doğru duruş son derece agresif, militan, aşırı sol bir çizgi olmalıdır. Özellikle, dünya Komünist partilerini enerjilerini ılımlı solun yok edilmesine adamaya çağırıyoruz."
 SOV_anti_fascist_diplomacy:0 "Anti-Faşist Diplomasi"
 SOV_anti_fascist_diplomacy_desc:0 "Tüm Batı rejimleri baskıcı ve yozlaşmış olsa da, ilerici veya hatta Sosyalist gibi görünenlerden daha kötüsü yoktur! Proletarya arasında böyle yanlış bir bilinç yayarak, Devrimi geciktirmeye ve işçileri sürekli kölelikte tutmaya çalışıyorlar."
 SOV_aviation_cult:0 "Hava Kuvvetleri Kültü"
 SOV_aviation_cult_desc:0 "Sovyetler Birliği, havacılık alanındaki şaşırtıcı başarılarıyla dünyayı etkileyecek. Kahraman pilotlarımız, doğa üzerindeki teknolojik ustalıklarımızı gösteren Bolşevik kültürünün ve ilerlemenin şövalyeleridir. Çar günlerinden bu yana ne kadar yol kat ettik!"
 SOV_claim_bessarabia:0 "Besarabya Üzerinde Hak İddiası"
 SOV_claim_bessarabia_desc:0 "Karadeniz ekonomimiz için Baltık'tan bile daha önemli. Boğazlar ve Çanakkale Boğazı'nın kontrolünü sağlamak için elimizden gelen her şeyi yapmalıyız."
 SOV_claim_on_sinkiang:0 "Sincan Üzerinde Hak İddiası"
 SOV_claim_on_sinkiang_desc:0 "Yoldaş Sheng Shicai'nin yönetimi altında, Sincan zaten fiili bir Sovyet kukla devleti. Bunu resmi hale getirmeliyiz..."
 SOV_claim_on_sinkiang_threat:0 "Sovyet Sincan'ı Talep Etti"
 SOV_claim_on_the_straits:0 "Boğazları Talep Et"
 SOV_claim_on_the_straits_desc:0 "Karadeniz'den Ege Denizi'ne uzanan boğazlar kilit bir stratejik noktadır. Bu bölgenin yabancı güçler tarafından kontrol edilmesine izin veremeyiz. Kızıl Filo'nun önemini sağlamak için boğazları güvence altına almalıyız."
 SOV_claims_on_baltic:0 "Baltık'ta Hak İddiaları"
 SOV_claims_on_baltic_desc:0 "Büyük Petro batıdaki limanlara erişim aramakta haklıydı. Devrimden sonra kaybedilen Baltık Devletleri, Sovyetler Birliği'ne yeniden entegre edilmelidir."
 SOV_claims_on_turkey:0 "Türkiye Üzerinde Hak İddiaları"
 SOV_claims_on_turkey_desc:0 "Türkler sadece Boğazların ortak kontrolü taleplerimizi sürekli olarak reddetmekle kalmadılar, aynı zamanda doğudaki herhangi bir sınır ayarlamasını tartışmayı da reddediyorlar. Belki de onlara bir ders verme zamanı gelmiştir!"
 SOV_closed_city_network:0 "Kapalı Şehir Ağı"
 SOV_closed_city_network_desc:0 "Askeri üslerimizde mevcut olandan daha fazla alan gerektiren araştırmalar için kapalı şehirler kurmalıyız. Şehirlere erişimi kısıtlamak, araştırmamızın gizli kalmasını sağlarken, bilim adamlarımıza büyük ölçekli deneyler için bolca alan sağlar."
 SOV_defense_of_moscow:0 "Moskova Savunması"
 SOV_defense_of_moscow_desc:0 "Faşistler başkentin kapılarını çalıyor! Moskova'nın hiçbir şekilde düşmesine izin verilmemeli. Çocuklardan yaşlılara kadar herkesi, aceleyle yapabildiğimiz savunmaları inşa etmeleri için seferber edin!"
 SOV_defense_of_moscow_forts:0 "Moskova ve çevresine §Y28 Kara Kalesi§! ekle.\n"
 SOV_diversify_the_programme:0 "Programı Çeşitlendir"
 SOV_diversify_the_programme_desc:0 "Son yıllardan çok şey öğrendik ve geleneksel savaş alanlarında ilerleme kaydedildi. Muazzam avantajlar sağlayan savaş yöntemlerini ortaya çıkarabilecek kapasiteye sahip büyük bilim adamlarından oluşan bir ulusuz. Sonuçları görmek istiyorsak, en iyi koşullarda çalıştıklarından emin olmalıyız."
 SOV_expand_red_fleet:0 "Kızıl Filoyu Genişlet"
 SOV_expand_red_fleet_desc:0 "Kızıl Filo, emperyalist güçlerin donanmalarına kıyasla acınacak derecede zayıf. Genişlemesini ulusal bir öncelik haline getirmeliyiz!"
 SOV_far_east_fortification_forts_1:0 "Japon sınırına §Y6 Kara Kalesi§! ekle.\n"
 SOV_far_east_fortification_forts_2:0 "Japon sınırına §Y8 Kara Kalesi§! ekle.\n"
 SOV_far_east_fortification_forts_3:0 "Japon sınırına §Y4 Kara Kalesi§! ekle.\n"
 SOV_great_purge:0 "Büyük Temizlik"
 SOV_great_purge_bypass_tt:0 "Troçki Sovyetler Birliği'nin lideri olur"
 SOV_great_purge_desc:0 "Subaylar arasında tehlikeli bir Troçkist komplo demleniyor; en üst rütbelerde bile. Troçki'nin kişisel katılımı bilinmemekle birlikte, tehdit büyük. SSCB, birkaç yumurta kırmaya hazır olmadığımız sürece başka bir iç savaşa bile sürüklenebilir..."
 SOV_great_purge_tt:0 "Şüpheli Troçkist bakanları ve liderleri tasfiye etmek için bir dizi §Ygöstermelik duruşma§! yapılacak.\n"
 SOV_great_purge_tt2:0 "Tamamlanan tasfiye sayısı, yenilenen §Yiç savaş§! olasılığını etkileyecek ve §HTasfiye Edilen Subaylar§!'dan etkiyi ölçeklendirecektir.\nBu odağı seçmemek §Yiç savaş§!'a ve sürgünden §YLev Troçki§!'nin potansiyel geri dönüşüne yol açacaktır.\n\n"
 SOV_has_not_officers_purged_tt:0 "Ulusal ruhu §YSubaylar Tasfiye Edildi§! yok!"
 SOV_improve_railway_network:0 "Demiryolu Ağını İyileştir"
 SOV_improve_railway_network_desc:0 "Birinci Beş Yıllık Planımız çok başarılı oldu. Ağır sanayideki büyük genişleme, Sovyetler Birliği'ni kendisini savunmak için çok daha güçlü bir konuma getirdi, ancak Sovyet demiryolu ağı bazı kritik darboğazlara çarptı. Halk Demiryolları Komiserliği (NKPS), bu darboğazları kapatmak ve ana vatanı savunabileceğimizi sağlamak için iddialı bir plana sahip."
 SOV_improve_stalin_line:0 "Stalin Hattını İyileştir"
 SOV_improve_stalin_line_desc:0 "Batı sınırımız faşist saldırganlığa karşı daha iyi korunmalıdır. Stalin Hattı uzatılmalı ve modernize edilmelidir."
 SOV_infrastructure_effort:0 "Altyapı Çabası"
 SOV_infrastructure_effort_desc:0 "[ROOT.GetNameDefCap] çok geniş ama çoğunlukla boş. Malları ve ekipmanları ülkenin genişliği boyunca hızlı bir şekilde taşıyabilme yeteneğini sağlamalıyız."
 SOV_militarized_schools:0 "Askerileştirilmiş Okullar"
 SOV_militarized_schools_desc:0 "Sovyet çocukları askeri disiplin ve fedakarlık ve dayanışma gibi Sosyalist erdemlerle eğitilmeli. Genç zihinler daha kolay şekillendirilir."
 SOV_move_industry_to_urals:0 "Endüstriyi Urallara Taşı"
 SOV_move_industry_to_urals_desc:0 "Hain Hitleristlerin SSCB'nin batı kısmındaki değerli fabrikalarımızı ele geçirmelerine izin verilmemeli. Üstün çaba ve fedakarlıkla, en değerli ağır ekipmanları ve tesisleri Çelyabinsk ve Urallardaki diğer yerlere hızlı bir şekilde taşıyabilmeliyiz."
 SOV_new_soviet_man:0 "Yeni Sovyet İnsanı"
 SOV_new_soviet_man_desc:0 "Yeni Sovyet İnsanı bencil olmayan, bilgili, disiplinli ve sağlıklı; temel içgüdüler ve yanlış bilinç üzerinde yaşayan bir zafer. Erkekler herkesin iyiliği için seve seve canlarını verecek ve kadınlar Sovyet toplumunun geleceği için birçok çocuk doğuracak."
 SOV_night_witches_tt:0 "588. Gece Bombardıman Alayı Moskova'da aktif hale gelir."
 SOV_nkvd_divisions:0 "NKVD Tümenleri"
 SOV_nkvd_divisions_desc:0 "NKVD'ye, demiryollarını ve önemli tesisleri koruyan İç Birlikler olarak hareket etmesi için kendi tümenlerinden bazıları verilmelidir."
 SOV_nkvd_upgrade_tooltip:0 "§YNKVD§! artık ordumuza daha sıkı bir şekilde entegre edilmiş durumda, asker moralinin ve Parti'ye olan inancın yüksek olmasını sağlıyor.\n"
 SOV_ocean_going_navy:0 "Okyanusa Açılan Bir Donanma"
 SOV_ocean_going_navy_desc:0 "Birlik, gezegendeki herhangi bir ulustan daha büyük bir kara alanını kapsasa da, dünya okyanusları henüz gemilerimiz tarafından yönetilmiyor. Ağır zırhlı savaş gemileri, gelecekteki okyanusa açılan filomuzun bir parçası olacak."
 SOV_offer_poland_protection_tt:0 "§YPolonya, Sovyet fethi durumunda bu anlaşma yoluyla talep edilen eyaletleri alacaktır.§!\n"
 SOV_operation_zet:0 "Zet Operasyonu"
 SOV_operation_zet_desc:0 "Kuomintang gerici olsa da, Mao ve onun komünizm markasının Çin'de galip gelmesi pek olası görünmüyor. Chiang ile ilişkileri geliştirmeye çalışmalıyız; Japonya'nın gülünç derecede anakronistik İmparatorluğu'nun yakında çökmesi muhtemeldir."
 SOV_pan_slavic_rhetoric:0 "Pan-Slav Retoriği"
 SOV_pan_slavic_rhetoric_desc:0 "Yoldaş Lenin, Dünya Devrimi arayışında bir Rus, Slav kimliğinden vazgeçmekte çok ileri gitti. Belli bir derecede milliyetçilik bize iyi hizmet etmeli ve bir tür Pan-Slavizmin yeniden canlanması bizi diğer Slav uluslarına yaklaştırmaya yardımcı olabilir."
 SOV_partisan_suppression:0 "Partizan Bastırması"
 SOV_partisan_suppression_desc:0 "SMERŞ, işgal altındaki topraklardaki her türlü partizan faaliyetine sızabilmek ve acımasızca bastırabilmek için daha iyi bir şekilde genişletilmelidir."
 SOV_peoples_commissariat:0 "PCDI'yi Kur"
 SOV_peoples_commissariat_desc:0 "SSCB Halk Savunma Sanayi Komiserliği, askeri sanayi projelerimize odaklanan ağır sanayi bakanlığı olacaktır. Uzun vadede, iş yükü bakanlığın daha fazla bölünmesini gerektirebilir."
 SOV_permanent_revolution:0 "Sürekli Devrim"
 SOV_permanent_revolution_desc:0 "Baskıcı demagog gitti! Gerçek güç ulusumuzun halkına geri verildi. Artık herkes çıkarlarını bağımsız ve tavizsiz bir şekilde takip edebiliyor. Sonsuza dek değişiyoruz. Sürekli devrim muzaffer bir devrimdir."
 SOV_permanent_revolution_tt:0 "Troçki geri döndü"
 SOV_permanent_revolution_tt2:0 "§YTroçki§! daha iyi bir lider özelliği kazanır."
 SOV_progress_cult:0 "İlerleme Kültü"
 SOV_progress_cult_desc:0 "Olağanüstü Sovyet bilim insanlarının yeniliklerini kutlamalı ve doğru türden özgür düşünceyi teşvik etmeliyiz. SSCB, bilimin cesur yeni alanlarında yozlaşmış Batı'nın her zaman önünde olacaktır; Komünist Lysenko yoldaşın parlak çalışmasına bakın!"
 SOV_research_city_experiment:0 "Araştırma Şehri Deneyi"
 SOV_research_city_experiment_desc:0 "Önde gelen bilim adamlarımızdan biri olan Kurçatov, bir kilogram uranyumdaki çekirdeklerin parçalanması sırasında açığa çıkan enerjinin 20.000 ton trotil patlamasına eşit olması gerektiğini belirtti. Anavatanın hayatta kalmasını sağlamak için düşmanlarımızdan önce bu gücü kullanmalıyız."
 SOV_smersh_tt:0 "§YDarbe riskini ortadan kaldırır.§!\n"
 SOV_socialist_science:0 "Sosyalist Bilim"
 SOV_socialist_science_desc:0 "Dünya, zihin gibi, sürekli hareket halindedir. Doğa sürekli bir ilerleme durumundadır; hatta devrim. Diyalektik materyalizm ilkeleri, sosyal bilimlerin yanı sıra doğa bilimlerine de uygulanabilir..."
 SOV_southern_thrust:0 "Güney Hamlesi"
 SOV_southern_thrust_desc:0 "İran ve Irak'ı ilhak etmek hem devasa petrol rezervlerini Devrim için güvence altına alacak hem de Mısır ve Hindistan'daki İngiliz emperyalistlerine doğrudan baskı uygulayacaktır."
 SOV_stalin_constitution:0 "Stalin Anayasası"
 SOV_stalin_constitution_desc:0 "Eski anayasamızı güncellemenin ve Sovyetler Birliği'nin işçilerinin ve köylülerinin sahip olduğu haklarla dünyayı etkilemenin zamanı geldi!"
 SOV_tranformation_of_nature:0 "Doğanın Dönüşümü"
 SOV_tranformation_of_nature_desc:0 "Stalin'in Doğanın Dönüşümü Büyük Planı hayata geçirilmeli. Çevre, Halkın lehine çalışmak için büyük ölçekte şekillendirilmeli ve kalıplanmalıdır."
 SOV_transpolar_flights:0 "Transpolar Uçuşlar"
 SOV_transpolar_flights_desc:0 "En cesur pilotlarımız, Kuzey Kutbu üzerinden cesur rotaların mümkün olduğunu henüz kanıtlamaya başlıyor. Hava savaşımızı planlarken bu gibi beklenmedik kestirme yolları kullanarak düşmanı şaşırtabileceğiz."
 SOV_ultimatum_to_greece:0 "Yunanistan'a Ültimatom"
 SOV_ultimatum_to_greece_desc:0 "Ege Adaları, Kızıl Filo'nun serbestçe faaliyet gösterebildiğinden emin olmak için ihtiyacımız olan son stratejik parçadır. Yunanlılar her taraftan baskı altında ve topyekun bir savaştan kaçınmak için büyük olasılıkla biraz toprak vereceklerdir."
 SOV_war_since_purge:0 "Büyük Temizlik'i tamamladığından beri bir savaş yaşadı"
 SOV_war_with_germany:0 "Almanya ile Savaş"
 SOV_war_with_germany_desc:0 "Alman tehdidi büyümeye devam ediyor. Alman ordusunu yok edebilir ve etmeliyiz ve onları yeni efendilerine boyun eğdirmeliyiz."
 SOV_war_with_germany_tt:0 "Molotov-Ribbentrop Paktı yürürlükte değil"
 SOV_war_with_japan:0 "Japonya ile Savaş"
 SOV_war_with_japan_desc:0 "Görünüşe göre Japonların geri adım atmaya niyeti yok. Tek etkili caydırıcı savaş olacak. Kızıl Ordu onları çiğnediğinde taleplerimize direndiklerine pişman olacaklar."
 SOV_war_with_uk:0 "İngiltere ile Savaş"
 SOV_war_with_uk_desc:0 "Emperyalist İngilizler bize hiçbir zaman saygı duymadı. Dünyanın geri kalanını bitirdiklerinde Sovyetler Birliği'ne yöneleceklerine şüphe yok. Saldırgan genişlemelerini önlemenin tek bir yolu var. Savaş!"
 SOV_women_pilots:0 "Havacılıkta Kadınlar"
 SOV_women_pilots_desc:0 "Kahraman uzun mesafe havacımız Yoldaş Raskova'ya, Havacılık Grubu 122 programı aracılığıyla tamamen kadınlardan oluşan bazı hava alayları kurmasına izin verilmelidir."
 SOV_workers_culture:0 "İşçi Kültürü"
 SOV_workers_culture_desc:0 "Sosyalizm sadece bir ekonomik sistem ve Marksizm sadece bir bilim değildir; burjuva ahlakının ve geleneklerinin tüm kalıntılarını yok etmek için Sovyet toplumunun yapısını bile dönüştürmeliyiz."
 SOV_xian_incident:0 "Xi'an Olayı"
 SOV_xian_incident_desc:0 "Önde gelen Kuomintang yetkilileriyle olan temaslarımız aracılığıyla, Çan Kay-Şek'i kaçırıp Mao ile iktidarı paylaşmaya zorlayabilmeliyiz, böylece Japonya'nın saldırılarına daha iyi direnebilmesi için yıkıcı kavgalarına etkili bir şekilde son verebiliriz."
 SOV_xian_incident_tt:0 "Her iki taraf da kabul ederse, Milliyetçi ve Komünist Çin arasında bir ateşkesi zorlayacaktır."
 SWI_add_forts_bordering:0 "[ROOT.GetNameDef] komşu her ilde §H2 Kara Kalesi§! kazanır.\n\n"
 TREE_FILTER_TOGGLE:0 "Daha fazla filtre göstermek için §GSola tıklayın§!"
 UK_secret_focus:0 "Gizli Silahlar"
 UK_secret_focus_desc:0 "Artık bilim kurgu alanına ait olan çeşitli gizli silah projelerinin geliştirilmesine odaklanmak için bilgi ve altyapıya sahibiz."
 USA_TAC:0 "Taktik Bombardıman Uçağı Gayreti"
 USA_TAC_desc:0 "Taktik hedeflere saldırmak için inşa edilen uçaklar, birliklerimizin daha güvenli bir şekilde ilerlemesinin yolunu açacaktır."
 USA_USACE_projects:0 "USACE Projeleri"
 USA_USACE_projects_desc:0 "ABD Ordusu Mühendisler Birliği, dünyanın daha önce hiç görmediği türden birçok gelecekteki askeri projenin temelini atma görevine getirilecektir. Essayons!"
 USA_accumulated_wealth_tax_act:0 "Birikmiş Servet Vergisi Yasası"
 USA_accumulated_wealth_tax_act_desc:0 "Ülkemizdeki bazı insanlar saçma miktarda sermaye biriktirdi. Bu para banka hesaplarında pasif bir şekilde duruyor veya pratik olmayan büyük binalara, yaldızlı mobilyalara ve pahalı tablolara yatırılıyor. Bunların hiçbiri geçerli bir ekonomik amaca hizmet etmiyor. Yeni bir vergi getirerek, bu tür yararsız servet biriktiren vatandaşlarımızı parayı ekonomiye yeniden yatırmaya zorlayacağız."
 USA_adjusted_compensation_act:0 "Ayarlanmış Tazminat Yasası"
 USA_adjusted_compensation_act_desc:0 "Büyük Savaş gazilerimize adil bir emekli maaşı sözü verildi. Birçoğu son zamanlarda buhran vurduğunda zor günler geçirdi. İhtiyaç anında Cumhuriyet'in çağrısına cevap verenlere yardım etmek için elimizden geleni yapmalıyız."
 USA_advanced_basing:0 "İleri Üs Kurma"
 USA_advanced_basing_desc:0 "Düşmanı kıyılarımızdan ne kadar uzak tutabilirsek o kadar iyidir."
 USA_advanced_mahanian_doctrine:0 "Gelişmiş Mahan Doktrini"
 USA_advanced_mahanian_doctrine_desc:0 "Alfred Thayer Mahan'ın deniz savaşı üzerindeki etkisi pek hafife alınamaz. Çalışmalarına dayanarak, belirleyici bir faktör olarak gördüğü zırhlıları iyi bir şekilde kullanabileceğiz."
 USA_agricultural_adjustment_act:0 "Tarımsal Düzenleme Yasası"
 USA_agricultural_adjustment_act_desc:0 "Çiftçilerimiz buhrandan özellikle ağır darbe aldı. Yiyeceklerimizi üreten insanların kontrolsüz bir piyasa tarafından işlerinden edilmemesini sağlamalıyız."
 USA_air_support:0 "Hava Desteği"
 USA_air_support_desc:0 "Hava savaşı öncelikle diğer askeri operasyonlarla birlikte kullanılmalıdır."
 USA_air_war_plans_division:0 "Hava Savaşı Planları Bölümü"
 USA_air_war_plans_division_desc:0 "Havacılıkta ve uçak üretiminde doğru öncelikleri belirlemek uzun vadeli planlama gerektirecektir. AWPD, malzeme, organizasyon ve stratejik planlara sahip olmamızı sağlayacaktır."
 USA_airborne_divisions:0 "Hava İndirme Tümenleri"
 USA_airborne_divisions_desc:0 "Uçakların menzil ve yük kapasitesindeki gelişmeler bir dizi olasılık açtı. Kargo uçakları, düşman hatlarının çok gerisine tam bir asker tümeni indirebilir ve orada büyük bir yıkıma neden olabilir."
 USA_ally_with_the_silver_shirts:0 "Gümüş Gömleklilerle İttifak Kur"
 USA_ally_with_the_silver_shirts_desc:0 "Ulusumuzu dünyadaki hak ettiği yere geri getirmek ve açık kaderimizi talep etmek için daha temel bir yeniden yapılanma gereklidir. Gümüş Gömlekliler bunu başarmamıza yardımcı olacaktır."
 USA_america_first:0 "Önce Amerika"
 USA_america_first_desc:0 "Bazı insanlar hazinelerimizi ve gençlerimizin kanını yabancı savaşlarda harcamamızı istiyor. Bu savaş çığırtkanları tarafından sarsılmamalıyız ve bunun yerine basit bir özdeyişle yaşayacağız: Önce Amerika - Herkes İkinci."
 USA_amphibious_operations:0 "Amfibi Operasyonlar"
 USA_amphibious_operations_desc:0 "En kötü kabuslarımız gerçekleşmedikçe, bu savaş Amerikan topraklarında sona ermeyecektir. İyi yürütülen çıkarmalar zafere giden yolun bir parçası olmalıdır."
 USA_anti_bolshevist_aid:0 "Anti [GetSovietThreatNameAlt] Yardımı"
 USA_anti_bolshevist_aid_desc:0 "[GetSovietThreatNameAlt] Tehdidinin yayılmasıyla savaşanlara verebileceğimiz her silah, mermi, kurşun ve çift bot, nihayetinde bizi savunmaya yardımcı olacaktır."
 USA_anti_imperialism:0 "Anti-Emperyalizm"
 USA_anti_imperialism_desc:0 "Amerika her zaman emperyalist zalimlerin düşmanı olmuştur, ancak sözde demokrasilerin çoğunun, onlardan faydalandıkları sürece bu kurumları hayatta tutmaya istekli olduğu açıkça görülüyor. Sovyetler Birliği devrimcileri daha iyi müttefiklerdir."
 USA_armored_infantry:0 "Zırhlı Piyade"
 USA_armored_infantry_desc:0 "Tanklar tek başına bir savaşı kazanamaz. Toprak tutmak için piyade gerekir. Onlara zırhlı araçlar sağlamak, tanklara ayak uydurmalarını ve üzerlerine atılan her şeye dayanmalarını sağlar."
 USA_army_of_the_united_states:0 "Amerika Birleşik Devletleri Ordusu"
 USA_army_of_the_united_states_desc:0 "Gelecek savaşlar için ABD Ordusu çok küçük. Başarmamız gereken dramatik büyüklük artışını denetlemek için yeni bir organizasyon oluşturmamız gerekecek."
 USA_arsenal_of_democracy:0 "Demokrasi Cephaneliği"
 USA_arsenal_of_democracy_desc:0 "Bir savaşa doğrudan müdahale etmeyi seçip seçmememize bakılmaksızın, demokratik uluslar onları silahlandıracağımızı ve destekleyeceğimizi bilmelidir."
 USA_battleship_primacy:0 "Zırhlı Önceliği"
 USA_battleship_primacy_desc:0 "Japonların Washington Deniz Antlaşması'nı kınamasıyla, okyanuslarda başka bir silahlanma yarışı ile karşı karşıya kalabiliriz. Hem en çok hem de en iyi zırhlılara sahip olmamızı sağlayacağız."
 USA_black_chamber:0 "Kara Oda Operasyonu"
 USA_black_chamber_complete:0 "§RGİZLİ§!"
 USA_black_chamber_desc:0 "Bir dizi Amerikan ülkesinde çıkarlarımızla uyuşmayan siyasi faaliyetler hakkında bilgimiz var. Neyse ki bir yeraltı propaganda ağı kurduk ve bu ülkeleri kendi yönümüze itmeye hazırız. Evde tehdit altında olmadığımızdan emin olmak için yapmamız gereken bir şey bu."
 USA_build_the_pentagon:0 "Pentagon'u İnşa Et"
 USA_build_the_pentagon_desc:0 "Ordumuzun genişlemesi, onu komuta etmek için yeni bir küresel karargah gerektiriyor."
 USA_bureau_of_aeronautics:0 "Havacılık Bürosu"
 USA_bureau_of_aeronautics_desc:0 "Deniz havacılığı geliştirme ihtiyaçlarını karşılamak için, on yıllardır bu konulardan sorumlu olan Havacılık Bürosu'nun genişletilmesi gerekecektir."
 USA_bureau_of_ships:0 "Gemiler Bürosu"
 USA_bureau_of_ships_desc:0 "İnşaat ve Onarım Bürosu ile Mühendislik Bürosu'nu gelecekteki deniz gelişmelerini denetlemek için tek bir kurumda birleştireceğiz. Bu arada, Mühimmat Bürosu'nun şiddetle reddettiği verimsiz torpido performansı söylentilerini araştırmanın zamanı gelmiş olabilir."
 USA_cancel_pearl_harbor_gambit:0 "Pearl Harbor Kumarını İptal Et"
 USA_cancel_pearl_harbor_gambit_desc:0 "Pearl Harbor'da bir filo konuşlandırmak denizcilerimizin hayatlarını tehlikeye atıyor. Japonya ile bir savaşı kışkırtmak için onları riske atmayacağız."
 USA_carribean_sphere:0 "Karayip Alanı"
 USA_carribean_sphere_desc:0 "Karayip adaları, Doğu kıyımıza veya Panama kanalına karşı saldırılar başlatmak için mükemmel bir konum sunuyor, bu yüzden elbette bölgenin düşmanca ele geçirilmesine izin verilmeyeceğini açıkça belirtmeliyiz."
 USA_carrier_primacy:0 "Uçak Gemisi Önceliği"
 USA_carrier_primacy_desc:0 "Gelecek savaşlarda hava gücüne ihtiyaç duyulacak ve menzilini genişletmenin en pratik yolu uçak gemileri kullanmaktır. Daha gelişmiş ve özel modeller oluşturmalıyız."
 USA_central_america:0 "Orta Amerika"
 USA_central_america_desc:0 "Herhangi bir yabancı gücün Panama kanalını ele geçirmesine veya hatta tehdit etmesine izin vermek düşünülemez. Bu nedenle, tüm Orta Amerika uluslarının bağımsızlığını garanti edeceğiz."
 USA_civil_war_fired:0 "İkinci Amerikan İç Savaşı başladı."
 USA_combined_bomber_offensive:0 "Birleşik Bombardıman Taarruzu"
 USA_combined_bomber_offensive_desc:0 "Yanımızda başka bir Büyük Güç varken, büyük ölçekli saldırı bombardımanını araştırma ve uygulama konusunda beklenmedik avantajlara sahibiz."
 USA_committee_on_technocracy:0 "Teknokrasi Komitesi"
 USA_committee_on_technocracy_desc:0 "Bir dizi politikacıyı ve iş adamını bilim adamları ve mühendislerle değiştirmeliyiz. Ekonomiyi yönetmek için teknik uzmanlığa sahipler ve büyük bilimsel ilerleme göreceğiz, bu da ekonomimizin yeniden gelişmesine yol açacaktır."
 USA_communal_property_act:0 "Ortak Mülkiyet Yasası"
 USA_communal_property_act_desc:0 "Çoğunluğun ihtiyaçları asla azınlığın, hatta bir kişinin arzularından daha ağır basmamalıdır. Bunun böyle olmasını sağlamak için, yerel toplulukların kamulaştırmayı daha kolay yürütmesine olanak tanıyan yeni yasalar çıkaracağız."
 USA_continue_the_new_deal:0 "Yeni Anlaşmaya Devam Et"
 USA_continue_the_new_deal_desc:0 "Yeni Anlaşma politikalarının işe yaradığı kanıtlandı. Şimdi yolumuzu kaybetmemeliyiz."
 USA_convoy_tactics:0 "Konvoy Taktikleri"
 USA_convoy_tactics_desc:0 "Ticaret gemilerimizi korumak sadece eskortlar ve etkili istihbaratla ilgili değil, aynı zamanda ticaret yollarımızı ve rutinlerimizi nasıl düzenleyeceğimiz konusundaki taktiksel seçimlerle de ilgilidir."
 USA_crusade_against_communism:0 "Komünizme Karşı Haçlı Seferi"
 USA_crusade_against_communism_desc:0 "Kızıl Terör, bu dünyanın şimdiye kadar karşılaştığı en kötü tehdittir. Ne pahasına olursa olsun, Sovyetler Birliği'nden yayılan yıkıcı ideoloji kaynağında kesilmeli ve bunu yapacak olanlar biz olacağız."
 USA_de_regulate_the_banking_sector:0 "Bankacılık Sektörünü Deregüle Et"
 USA_de_regulate_the_banking_sector_desc:0 "Ekonomik döngüde tamamen normal olan mali piyasalardaki bir düzeltmenin ardından, önceki hükümetler mali faaliyetler üzerinde oldukça mantıksız kısıtlamalar getirdi. Şüphesiz iyi niyetli olsalar da, bu kısıtlamalar açıkça yarardan çok zarar veriyor."
 USA_defense_of_the_pacific:0 "Pasifik'in Savunması"
 USA_defense_of_the_pacific_desc:0 "Japon hükümetinden umut kesildi, yayılmacılığı hem halkımızı hem de Asyalı komşularını tehdit ediyor. Ulus, onu reforme etmek ve hatalarını bir daha asla tekrarlamasını önlemek için Amerikan yönetimi altına alınmalıdır."
 USA_democratic_socialism:0 "Demokratik Sosyalizm"
 USA_democratic_socialism_desc:0 "Sağduyulu hiçbir kişi sosyalizmin insan uygarlığının geleceği olduğunu inkar edemez. Aynı zamanda, bu cumhuriyetin gururlu ve vatansever hiçbir vatandaşı, hükümetin artık halk tarafından ve halk için yapılmadığı bir sistemi destekleyemez. Gururlu atalarımız gibi, her ikisini de birleştiren yeni bir hükümet biçimi yaratacağız."
 USA_department_of_defense:0 "Savunma Bakanlığı"
 USA_department_of_defense_desc:0 "Savaş bakanlığının yeniden adlandırılması, artık korumamızı test edildiği ana kadar görmezden gelmeyi seçemeyeceğimizi vurguluyor. Her zaman tetikte olmalıyız."
 USA_desegregate_the_armed_forces:0 "Silahlı Kuvvetlerde Ayrımcılığı Kaldır"
 USA_desegregate_the_armed_forces_desc:0 "Birinin ülkesinin silahlı kuvvetlerinde silah altında hizmet etmek hoş olmayan bir görev olabilir - ancak aynı zamanda değerli bir hak da olabilir. Birçok vatandaşımızın soyu nedeniyle mahrum bırakıldığı bir hak."
 USA_destroyers_for_bases:0 "Üsler İçin Muhripler"
 USA_destroyers_for_bases_desc:0 "İngiltere'nin gemilere ihtiyacı var ve biz de kendi topraklarımızı korumalıyız. Şu anda İngiliz topraklarında askeri üsler kurma hakkı karşılığında, umarım iyi bir şekilde kullanılacak bazı Muhripler takas edebiliriz."
 USA_destroyers_for_bases_tt:0 "§Y[USA.GetNameDef]§!: \n"
 USA_eliminate_the_southern_threat:0 "Güney Tehdidini Ortadan Kaldır"
 USA_eliminate_the_southern_threat_desc:0 "Meksika son nesildir istikrarsız bir karmaşa içinde. Şiddetin sınırımıza yayılması veya birinin ülkeyi birleştirip kuzeye yürümesi fark etmez - güney kanadımızı güvence altına almalıyız."
 USA_embargo_USSR:0 "SSCB'ye Ambargo Uygula"
 USA_embargo_USSR_desc:0 "Sovyetler Birliği'ni bizimle ticaret fırsatlarından mahrum bırakmak hem askeri çabalarına yardım etmemizi engelleyecek hem de ekonomik modelimizin üstünlüğünü kanıtlayacaktır."
 USA_embargo_germany:0 "Almanya'ya Ambargo Uygula"
 USA_embargo_germany_desc:0 "Almanya, savaş çabaları için petrole ve diğer doğal kaynaklara bağımlıdır. Bunlara erişimlerini kesmek yapabileceğimiz en az şeydir."
 USA_embargo_japan:0 "Japonya'ya Ambargo Uygula"
 USA_embargo_japan_desc:0 "Japonya'ya saldırganlıklarının ABD tarafından kabul edilmeyeceğini veya yardım edilmeyeceğini göstermeliyiz. Bir ambargo, Pasifik'teki tasarımlarını engellemenin ilk adımı olacaktır."
 USA_embargo_the_empire:0 "İmparatorluğa Ambargo Uygula"
 USA_embargo_the_empire_desc:0 "Uzun süredir iyi ilişkiler yaşamamıza rağmen, İngilizler yaşamayı umduğumuz ideallere ihanet etti. Sonuçlarını onlara bildirmenin zamanı geldi."
 USA_empower_the_huac:0 "HUAC'ı Güçlendir"
 USA_empower_the_huac_desc:0 "Amerikan Karşıtı Faaliyetler Meclis Komitesi sağlıklı demokrasimizde önemli bir işlev görüyor. Sadakatsiz unsurların siyasi süreci etkilemeye çalışmasına izin vermemeliyiz."
 USA_end_monarchism:0 "Monarşiyi Sona Erdir"
 USA_end_monarchism_desc:0 "Avrupa monarşileri dünyayı zaten bir dünya savaşına sürükledi - bunu bir daha yapmalarına izin veremeyiz. Atalarımız özgürlüklerini kazanmak için İngiltere Kralı'na savaş açtı - dünyayı onun tiranlığından sonsuza dek kurtaracağız!"
 USA_escort_effort:0 "Eskort Gayreti"
 USA_escort_effort_desc:0 "Denizaltılar ticaret konvoylarımız için bir tehlike oluşturmaktadır. Yeni muhrip modellerinin geliştirilmesine odaklanmak, denizaltı karşıtı savaşı verimli bir şekilde yürütmemizi sağlayacaktır."
 USA_escort_fighters:0 "Eskort Avcıları"
 USA_escort_fighters_desc:0 "Bombardıman uçağı her zaman geçebilirken, kanat adamı geçemeyebilir - her ikisi de dost avcılar tarafından korunmadıkça."
 USA_expand_the_USMC:0 "USMC'yi Genişlet"
 USA_expand_the_USMC_desc:0 "Amerika Birleşik Devletleri Deniz Piyadeleri geçmişteki birçok savaşta belirleyici bir güç olmuştur ve amfibi harekatlarımız için her zamankinden daha alakalı olabilir. Semper fidelis!"
 USA_extend_the_chinese_exclusion_acts:0 "Çin Dışlama Yasalarını Genişlet"
 USA_extend_the_chinese_exclusion_acts_desc:0 "Çin savaşla harap olmuşken, mülteci dalgalarında boğulmamak için Çin göçünü sınırlamak için adımlar atmalıyız."
 USA_extra_tech_team:0 "Ekstra Teknoloji Ekibi"
 USA_fair_labour_standards_act:0 "Adil Çalışma Standartları Yasası"
 USA_fair_labour_standards_act_desc:0 "Yavaş bir iyileşmenin ilk işaretleri ortaya çıkarken, işçilerin buna katılmasını sağlama zamanı geldi. Ücretsiz fazla mesai gibi sömürücü uygulamaları yasaklamalı ve yaşanabilir bir asgari ücret getirmeliyiz."
 USA_fascist_menace:0 "Prusya Tehdidi"
 USA_fascist_menace_desc:0 "Versay Antlaşması ve ekonomik yaptırımlar Almanya'yı durdurmadı ve Prusya militarizmi bir kez daha çirkin, saldırgan yüzünü gösteriyor. Almanya yeniden yenilmeli ve en azından şimdilik bizim kontrolümüz altına alınmalıdır."
 USA_federal_housing_act:0 "Federal Konut Yasası"
 USA_federal_housing_act_desc:0 "Amerika Birleşik Devletleri'nde yoksulluğu ortadan kaldırmaya yönelik devam eden çabalarımızın bir parçası olarak, federal olarak sübvanse edilen bir konut programı oluşturacağız."
 USA_first_special_service_force:0 "Birinci Özel Hizmet Gücü"
 USA_first_special_service_force_desc:0 "Misafirperver olmayan topraklarda düşman hatlarının gerisindeki operasyonlar herhangi bir küresel çatışmanın bir parçası olacaktır. Bu rolleri yerine getirmek için komando birlikleri oluşturmak gelecekteki savaşımız için elzemdir."
 USA_fleet_submarines:0 "Filo Denizaltıları"
 USA_fleet_submarines_desc:0 "Deniz savaşındaki en olası rakiplerimizin ikisi de yabancı ticarete dayanıyor ve bu da denizaltılara karşı çok savunmasız olduğu kanıtlandı. Bu denizaltıların okyanusları geçmelerine ve düşman kıyılarına yakın faaliyet göstermelerine olanak tanıyan çok uzun menzilli olmaları gerekecektir."
 USA_focus_on_asia:0 "Asya'ya Odaklan"
 USA_focus_on_asia_desc:0 "Çoğu insan endişeyle Avrupa'ya bakarken, Pasifik'in ötesinde de belirsizlik ve istikrarsızlıkla karşı karşıyayız. Eve daha yakın saldırıya uğramadan önce yurtdışına müdahale etmek bizim çıkarımıza olabilir."
 USA_focus_on_europe:0 "Avrupa'ya Odaklan"
 USA_focus_on_europe_desc:0 "Avrupa'nın Büyük Güçleri bir kez daha dünyayı bir dünya savaşına sürüklemeye hazırlanıyor. Daha önce yaptığımız gibi, bizi etkileyene kadar bekleyemeyiz. Avrupa'daki herhangi bir ulus barışı tehdit ederse kararlı bir şekilde müdahale etmeye hazır olmalıyız."
 USA_full_desegregation:0 "Tam Ayrımcılık Kaldırma"
 USA_full_desegregation_desc:0 "Çok uzun bir süredir, bazı eyaletlerimiz insanlara eski, modası geçmiş ve insanlık dışı kriterlere göre farklı davrandı. Özgür bir cumhuriyette her vatandaşa eşit davranılmalı - ayrı değil."
 USA_fund_the_navy:0 "Donanmayı Finanse Et"
 USA_fund_the_navy_desc:0 "Düşmanlarımızın bize attığı her yeni şeye uyum sağlayabilmeliyiz. Donanma tatbikatlarına artan fonlama, düşmanlarımızı taktiksel olarak geride bırakabilecek daha verimli bir donanmaya yol açacaktır."
 USA_global_hegemony:0 "Küresel Hegemonya"
 USA_global_hegemony_desc:0 "Sadece varlığımızla çatışmayı önlememizi sağlayacak küresel bir üstünlük konumuna ulaşmanın eşiğindeyiz. Sadece gezegendeki kalan Büyük Güçlerin konumumuzu kabul etmesini sağlamalıyız."
 USA_great_depression_cooldown:0 "Yeni Mevzuat hala hazırlanıyor"
 USA_great_depression_cooldown_tt:0 "Bu yasa geçtikten sonra, daha fazla Yeni Anlaşma mevzuatının hazırlanması ve imzaya hazır olması §Y230 gün§! sürecektir.\n\n"
 USA_guarantee_the_american_dream:0 "Amerikan Rüyasını Garanti Et"
 USA_guarantee_the_american_dream_desc:0 "Halkımızın çoğu hayatta pek bir şey istemiyor: istikrarlı istihdam, iyi sağlık ve bir aile kurmak için bir yer. Buna sahip olmamaları için hiçbir neden yok."
 USA_hemisphere_defense:0 "Yarımküre Savunması"
 USA_hemisphere_defense_desc:0 "Herhangi bir yabancı karışıklığa bakılmaksızın, öncelikle kendi mahallemize bakmalıyız."
 USA_honor_the_confederacy:0 "Konfederasyonu Onurlandır"
 USA_honor_the_confederacy_desc:0 "Çok uzun bir süredir İç Savaş hikayesi kuzey perspektifinden anlatıldı - mahkum bir isyanın hikayesi. Diğer tarafın da duyulmasının zamanı geldi."
 USA_income_tax_reform:0 "Gelir Vergisi Reformu"
 USA_income_tax_reform_desc:0 "Gelir Vergisi her Amerikalının cüzdanından para alıyor - vatandaşlarımızın başka şeyler satın almak ve yerel ekonomilerini desteklemek için harcayabilecekleri para. Amerikalılara kendi mali durumları üzerindeki özerkliklerini geri vereceğiz."
 USA_institute_of_american_sciences:0 "Amerikan Bilimler Enstitüsü"
 USA_institute_of_american_sciences_desc:0 "Ülke çapındaki üniversiteler ve araştırma laboratuvarları şimdiye kadar araştırmalarını uygun gördükleri şekilde yürüttüler. Bu sona ermeli. Dünya standartlarındaki bilim adamlarımızın çabalarını koordine etmek için yeni bir organizasyon oluşturacağız."
 USA_intervention_in_asia:0 "Asya'ya Müdahale"
 USA_intervention_in_asia_desc:0 "Genellikle Avrupa'daki gelişmelerin gölgesinde kalan Asya'nın kendi sorunlu noktaları vardır ve bizi müdahaleye hazırlanmaya zorlar."
 USA_intervention_in_europe:0 "Avrupa'ya Müdahale"
 USA_intervention_in_europe_desc:0 "Büyük Savaş'ın sona ermesinden yirmi yıldan az bir süre sonra, Avrupa ulusları bir kez daha savaşa hazırlanıyor. Durum hızlı müdahale gerektirirse hazırlıklı olmalıyız."
 USA_intervention_in_the_americas:0 "Amerika Kıtalarına Müdahale"
 USA_intervention_in_the_americas_desc:0 "İlk işimiz kendi yarımküremizdeki her türlü olasılığa hazır olduğumuzdan emin olmak olmalıdır."
 USA_invite_foreign_support:0 "Yabancı Destek Davet Et"
 USA_invite_foreign_support_desc:0 "Ordunun ve bazı eyalet hükümetlerinin sadakati hakkında çok rahatsız edici raporlar gelirken, destek için yurtdışına bakmak zorunda kalabiliriz."
 USA_issue_war_bonds:0 "Savaş Tahvili Çıkar"
 USA_issue_war_bonds_desc:0 "Savaş tahvilleriyle, askeri harcamaları finanse etmek için halkın savaş çabalarına ve vatanseverliğine olan desteğine güveniyoruz."
 USA_labour_management_relations_act:0 "İşçi-Yönetim İlişkileri Yasası"
 USA_labour_management_relations_act_desc:0 "Amerika'daki işletmeler her türlü sendika faaliyeti - grevler, örgütlenme, daha yüksek ücret talepleri - tarafından tehdit ediliyor. Bunun devam etmesine izin veremeyiz."
 USA_lend_lease_act:0 "Ödünç Verme-Kiralama Yasası"
 USA_lend_lease_act_desc:0 "Dünyanın büyük demokrasileri saldırı altında. Savaşı kaybederlerse, savaşın kıyılarımıza gelmesi sadece bir zaman meselesidir. Onları desteklemek için elimizden geleni yapmalıyız - teçhizat için hemen ödeme yapamasalar bile."
 USA_lend_lease_act_neutrality_tt:0 "\n\nTarafsızlık Yasasını geçirmek, Ödünç Verme-Kiralama Yasasını geçirme gereksinimlerini §Rönemli ölçüde artıracaktır§!"
 USA_liberty_for_the_philippines:0 "Filipinler İçin Özgürlük"
 USA_liberty_for_the_philippines_desc:0 "Filipinler halkı kendi işlerini organize etme yeteneklerini gösterdi ve Amerikan kontrolünün ülkeleri üzerindeki son kalıntılarının resmi olarak kaldırılmasının zamanı geldi."
 USA_liberty_ships:0 "Özgürlük Gemileri"
 USA_liberty_ships_desc:0 "Malzemelerimizin ve birliklerimizin ihtiyaç duyuldukları cephelere ulaşmasını sağlamak için kargo gemilerinin seri üretimi endüstriyel gelişmelerimize eşlik etmelidir."
 USA_limited_intervention:0 "Sınırlı Müdahale"
 USA_limited_intervention_desc:0 "Bizi tam güçle bir savaşa çekmek olağanüstü bir saldırganlık gerektirirdi, ancak son gelişmelerden sonra birçok insan yurtdışındaki çatışmalara özgürce yardım etmeye isteklidir."
 USA_limited_intervention_tt:0 "\n\nBu yasayı geçirmek ekonominizi seferber etmeyi §Rönemli ölçüde zorlaştıracaktır§!.\n\n"
 USA_louisiana_maneuvers:0 "Louisiana Manevraları"
 USA_louisiana_maneuvers_desc:0 "Bütçe kısıtlamaları bizi birçok askeri gelişmeyi uzaktan izlemeye zorladı. Şimdi, nihayet bazı teorilerimizi pratikte deneyebiliriz."
 USA_magic:0 "SİHİR"
 USA_magic_desc:0 "Donanma, Japon şifreleme kodlarını kırabileceğini düşünüyor, bu da gemi hareketleri de dahil olmak üzere tüm mesaj trafiklerini okumamızı sağlayacaktır."
 USA_main_battle_tanks:0 "Ana Muharebe Tankları"
 USA_main_battle_tanks_desc:0 "Sahadaki deneyimler, bir tankın piyade desteğinden düşman tanklarıyla savaşmaya kadar çok sayıda görevi yerine getirebilmesi gerektiğini açıkça göstermiştir. Bu ihtiyaçları karşılamak için araçlar tasarlamak, üretimi kolaylaştırmamızı sağlar."
 USA_manhattan_project:0 "Manhattan Projesi"
 USA_manhattan_project_desc:0 "Masum görünümlü bir USACE projesi olan İkame Malzemelerin Geliştirilmesi, sonunda Manhattan Projesi olarak bilinecektir. Askeri tarihin en gizli ve tehlikeli girişimlerinden biri olan amacı, ilk atom bombasını yaratmaktır."
 USA_manifest_destiny:0 "Açık Kader"
 USA_manifest_destiny_desc:0 "Ulusumuzun kuruluşunun ve tarihinin özel koşulları, bize dünyanın herhangi bir yerindeki adaletsizliğe ve baskıya müdahale etme yetkisi veriyor. Güvenli bir uluslararası topluluk yaratmak için birincil ihracatımız özgürlük olmalıdır."
 USA_manifest_destiny_tt:0 "§YTüm Faşist ve Komünist uluslara karşı savaş hedefleri verir.§!\n"
 USA_maritime_commission:0 "Denizcilik Komisyonu"
 USA_maritime_commission_desc:0 "Çoğu meslekten olmayan kişi sadece savaş gemilerine odaklanırken, gerçek uzmanlar savaşları kazananın mütevazı kargo gemisi olduğunu bilir. Savaş zamanlarında mevcut olan nakliye miktarını artırmak için, inşaatı koordine etmek üzere özel bir kurul oluşturacağız."
 USA_military_construction:0 "Askeri İnşaat"
 USA_military_construction_desc:0 "Dünya barışını tehdit eden süper güçlerle, kamu işleri projelerimizin sivil olanların yanı sıra askeri konulara da yönlendirilmesi gerekiyor."
 USA_militia_organization_act:0 "Milis Teşkilatı Yasası"
 USA_militia_organization_act_desc:0 "Gururlu cumhuriyetimizin uzun bir vatandaş asker geleneği vardır. Ülkemiz bir gün yabancı bir saldırgan tarafından işgal edilirse, evlerini savunmak için tanıdık topraklarda savaşan iyi organize edilmiş ve iyi silahlanmış bir erkek ve kadın milisiyle karşılaşacaklardır."
 USA_national_employment_strategy:0 "Ulusal İstihdam Stratejisi"
 USA_national_employment_strategy_desc:0 "İşsizlik basit bir gerçekten kaynaklanıyor: insanlar sunulan işlerle eşleşmiyor. İşverenler ihtiyaç duydukları insanları bulamadığı için fabrikalar boş dururken, ülkenin diğer bölgelerindeki insanlar açlıktan ölüyor. Herhangi bir işverenin şirketini yönetmek için ihtiyaç duyduğu insanları bulmasını sağlayacak yeni bir strateji getireceğiz."
 USA_national_prosperity_program:0 "Ulusal Refah Programı"
 USA_national_prosperity_program_desc:0 "Hızlı bir iyileşme ve kalıcı refah sağlamanın anahtarı kontrolsüz pazarlarda değil, özel ve kamu işletmelerini birbirine bağlayan dikkatlice yönlendirilmiş programlarda yatmaktadır."
 USA_naval_radar:0 "Deniz Radarı"
 USA_naval_radar_desc:0 "Radar, düşmanlarımızdan gecenin örtüsünü almak ve onları kötü hava koşullarında bile tespit etmek için baştan çıkarıcı olasılıklar sunuyor."
 USA_neutrality_act:0 "Tarafsızlık Yasası"
 USA_neutrality_act_desc:0 "Avrupa'da savaşın patlak vereceği giderek kesinleşiyor gibi görünüyor. Büyük Savaş sırasında Amerikan şirketleri Müttefiklere büyük miktarda silah sattı ve birçok kişi Amerikan girişinin çoğunlukla bu teslimatların ödenmesini sağlama arzusundan kaynaklandığına inanıyor. Bu sefer savaş vurgunculuğu olmayacak."
 USA_north_american_dominion:0 "Kuzey Amerika Hakimiyeti"
 USA_north_american_dominion_desc:0 "Acil sınırlarımız güvence altına alındıktan sonra, Kuzey Amerika'ya yönelik herhangi bir tehdidi önlemek için daha uzağa bakmalıyız. Bölgedeki hiçbir haydut devlete müsamaha gösteremeyiz."
 USA_office_of_scientific_research_and_development:0 "Bilimsel Araştırma ve Geliştirme Ofisi"
 USA_office_of_scientific_research_and_development_desc:0 "Ufukta savaş belirirken, herhangi bir potansiyel düşman tarafından geride bırakılmamamızı sağlamak için bilimsel çabalarımızı odaklamalıyız."
 USA_office_of_strategic_services:0 "Stratejik Hizmetler Ofisi"
 USA_office_of_strategic_services_desc:0 "Özel bir istihbarat teşkilatı kurmak sadece savaşa değil, gelecekteki yurtdışı operasyonlara da yardımcı olacaktır. İngiliz istihbarat servisleri model olarak hizmet edebilir."
 USA_old_age_pension_act:0 "Yaşlılık Aylığı Yasası"
 USA_old_age_pension_act_desc:0 "Bir ömür boyu çalıştıktan sonra, halkımız yaşlılıkta mali güvence ve saygıyı hak ediyor. Onları desteklemek için mevcut olan mevzuat açıkça yetersizdir."
 USA_pacific_decolonisation:0 "Pasifik Dekolonizasyonu"
 USA_pacific_decolonisation_desc:0 "Avrupa güçlerinin Pasifik'teki varlığının devam etmesi için hiçbir gerekçe yoktur - hiçbiri - ne de Pasifik Adaları halklarının Avrupalı efendilerine kölelik içinde tutulması için. Amerika bu adaletsizlik devam ederken artık boş durmayacaktır."
 USA_pacific_pacification:0 "Pasifik Pasifikasyonu"
 USA_pacific_pacification_desc:0 "Avustralya ve Yeni Zelanda, İngiltere tarafından etkili bir şekilde savunulamayacak kadar uzaktır. [USA.GetNameDef]'e düşman bir ulus tarafından ele geçirilmelerine izin veremeyiz."
 USA_pax_americana:0 "Pax Americana"
 USA_pax_americana_desc:0 "Amerika'daki barış korunmalıdır. Komşu uluslar arasındaki küçük çekişmelerin tırmanmamasını sağlayacak güce sahibiz. Kapımızın önündeki bir savaş tam da düşmanlarımızın istediği şeydir ve bunu önlemek için elimizden gelen her şeyi yapmalıyız."
 USA_pax_americana_tt:0 "@USA §YAmerika Birleşik Devletleri§! Amerikan ülkeleri arasındaki savaşlara müdahale edebilir"
 USA_pearl_harbor_gambit:0 "Pearl Harbor Kumarı"
 USA_pearl_harbor_gambit_desc:0 "Pearl Harbor'daki deniz üssü Japonlar için kolay bir hedeftir. Orada bir filo konuşlandırarak Pasifik'teki gücümüzü göstereceğiz. Böyle cesur bir harekete meydan okumaya cesaret edebilecekler mi?"
 USA_pearl_harbor_gambit_tt:0 "§YOdak çalışırken, Japonya'nın bir saldırı başlatma fırsatı olacaktır.§!"
 USA_preemptive_intervention:0 "Önleyici Müdahale"
 USA_preemptive_intervention_desc:0 "Artık boş durup komşu ülkelerin bizi veya müttefiklerimizi bastırmak için tasarlanmış savaş araçları inşa etmesini izleyemeyiz. Yüce ülkemizin ve dünyanın daha büyük iyiliği için müdahale etmeliyiz."
 USA_prepare_intervention:0 "Müdahaleye Hazırlan"
 USA_prepare_intervention_desc:0 "Diplomatik ve ticari kararlar yoluyla, uluslararası sahnedeki konumumuz tarafsız ve izolasyonistten yabancı saldırganlıklara karşı bir duruş sergilemeye kaydı. Askeri politikalarımız gelecekte bunu yansıtacaktır."
 USA_privatize_the_TVA:0 "TVA'yı Özelleştir"
 USA_privatize_the_TVA_desc:0 "Tennessee Vadisi Otoritesi özel rekabeti dışladı ve bölgedeki inşaat işlerinde bir tekel kurdu. Özel sektörün daha iyi yaptığı kanıtlanmış şeyleri yapmak hükümetin işi olamaz."
 USA_protect_south_america:0 "Güney Amerika'yı Koru"
 USA_protect_south_america_desc:0 "Çift kıtamızın güney kısmı keşfedildiğinden beri imparatorlukların oyun alanı olmuştur. Birinin bu ulusların rahatsız edilmemesini ve daha üretken bir geleceğe yönlendirilmesini sağlamasının zamanı geldi."
 USA_protectionist_tariffs:0 "Korumacı Tarifeler"
 USA_protectionist_tariffs_desc:0 "Serbest Ticaret pazarlarımızı yabancı rakiplere açtı, bunların birçoğu kendi tarifelerini ve vergilerini yükseltti. Şirketlerimiz sert bir rekabetle karşı karşıyayken, onlarınki gümrük duvarının güvenliğinin tadını çıkarıyor. Bu sona ermeli."
 USA_reach_out_to_the_ware_group:0 "Ware Grubu'na Ulaş"
 USA_reach_out_to_the_ware_group_desc:0 "Hükümetimizin içinde küçük bir grup sadık komünist var. Gizli çalıştıklarına inanıyorlar, ancak isimlerini biliyoruz. Belki de hedefimizin aynı olduğunu görebilir ve hükümete katılmaya ikna edilebilirler."
 USA_recruit_the_free_corps:0 "Özgür Birlikleri İşe Al"
 USA_recruit_the_free_corps_desc:0 "Ordu giderek daha şüpheli hale gelirken, Büyük Savaş kahramanlarına yönelmeliyiz. İhtiyaç anında Alman Freikorps Alman Cumhuriyeti'nin yardımına koştu. İhtiyaç anımız geldiğinde bize sadık kalacak benzer bir organizasyona ihtiyacımız var."
 USA_reestablish_the_gold_standard:0 "Altın Standardını Yeniden Kur"
 USA_reestablish_the_gold_standard_desc:0 "Altın Standardı olmadan para, bir inanç meselesinden biraz daha fazlası olarak var olurken, yaygın enflasyon halkımızın tasarruflarını yiyip bitiriyor ve çalışmalarını değersizleştiriyor. Bu mali açıdan sorumsuz yoldan vazgeçmeliyiz."
 USA_reinforce_monroe_doctrine:0 "Monroe Doktrinini Yeniden Teyit Et"
 USA_reinforce_monroe_doctrine_desc:0 "100 yıldan daha eskiye dayanan Monroe Doktrini, Avrupa'nın Amerika kıtalarını sömürgeleştirme girişimleri durumunda ABD müdahalesini kodladı, ancak Avrupa meselelerinin dışında kaldı. Bu kıtalardaki barış koruyucuları olarak rolümüzü güçlendirmek bölgedeki etkimizi artıracaktır."
 USA_reinforce_monroe_doctrine_tt:0 "Tüm Amerikan uluslarıyla Ticaret Görüşünü artırır.\n"
 USA_reintegration:0 "Yeniden Entegrasyon"
 USA_reintegration_desc:0 "Savaş ulusumuzu böldü, ancak sonunda bize karşı ayaklananlar bile hala kurtarılabilir. Nüfus yollarının yanlışlığını öğrendiğinde, gururlu cumhuriyetimizdeki siyasi sürece yeniden katılmalarına izin verilmelidir."
 USA_rubber_reserve_company:0 "Kauçuk Rezerv Şirketi"
 USA_rubber_reserve_company_desc:0 "Savaşın patlak vermesiyle, ithal kauçuk kaynaklarımızın neredeyse tamamını kaybettik.\n\nMuazzam bir koordineli çabayla, Amerika Birleşik Devletleri'ndeki kauçuk şirketleri sentetik kauçuk üretmenin daha iyi yollarını bulmak için işbirliği yapabilir, hatta savaş çabalarının taleplerini karşılayabilirler."
 USA_scientist_haven:0 "Bilim Adamı Cenneti"
 USA_scientist_haven_desc:0 "Kendimizi dünyada özgürlüğün koruyucuları olarak kabul ettirdikten sonra, yurtdışındaki baskıcı rejimlerden kovulan araştırmacıları ve entelektüelleri memnuniyetle karşılayabilir, onlara fırsatlar diyarında başarılı olma ve davamıza yardımcı olma şansı verebiliriz."
 USA_secure_asia:0 "Asya'yı Güvence Altına Al"
 USA_secure_asia_desc:0 "Avrupa'daki sömürgeci uluslar ya Asya sömürgelerini etkili bir şekilde savunmak istemiyor ya da savunamıyor gibi görünüyor. Bu yükü onlar için üstlenmeliyiz, aksi takdirde bu bölgeler daha fazla saldırganlığın sıçrama tahtası haline gelir."
 USA_secure_china:0 "Çin'i Güvence Altına Al"
 USA_secure_china_desc:0 "Çin uzun, kanlı bir iç savaşla boğuşuyor. Milliyetçi hükümet derinden yozlaşmış ve nüfustaki tüm desteğini kaybetmiştir. Çin'de ülkeyi birleştirebilecek ve yatıştırabilecek tek aktörü - Komünist Partiyi - desteklemeye başlama zamanı geldi."
 USA_seize_cuba:0 "Küba'yı Ele Geçir"
 USA_seize_cuba_desc:0 "Kıyılarımızın hemen açıklarında, bir saldırgan için üs olarak hizmet etmeye hazır, batmaz bir uçak gemisi yatıyor. Bunun olmasına izin vermemeliyiz."
 USA_selective_training_act:0 "Seçici Eğitim Yasası"
 USA_selective_training_act_desc:0 "Amerika Birleşik Devletleri tarihsel olarak savaş zamanlarında bile askere almayı benimsemekte yavaş kalmıştır. Artık bu lüksü karşılayamayız."
 USA_send_lindbergh_to_germany:0 "Lindbergh'i Almanya'ya Gönder"
 USA_send_lindbergh_to_germany_desc:0 "Ünlü havacı, Almanya'nın son savaştan sonra kendini nasıl yeniden inşa ettiğini araştırmak için Avrupa'ya gitmeyi teklif etti. Bu bize değerli bir deneyim kazandırmalıdır. Lindbergh ayrıca danışman rolünde hükümete katılmaya istekli olduğunu da belirtti."
 USA_shatter_the_empires:0 "İmparatorlukları Parçala"
 USA_shatter_the_empires_desc:0 "Bir zamanlar küresel bir imparatorluğun sömürgesiydik, ta ki özgürlüğümüzü kanla satın alana kadar. Kendilerini bu dünyanın efendileri olarak hayal edenler kontrol altına alınana kadar cumhuriyetimiz gerçekten güvende hissedemez."
 USA_south_america:0 "Güney Amerika"
 USA_south_america_desc:0 "Sömürge imparatorlukları bir daha asla Güney Amerika'ya yayılamamalı, Güney kardeşlerimizin güvende kalmasını sağlamak için bağımsızlıklarını garanti edeceğiz."
 USA_strategic_bombing:0 "Stratejik Bombardıman"
 USA_strategic_bombing_desc:0 "Hassas bombardıman yapma kapasitesi, herhangi bir ulusun savaş makinesini raylarında durdurmamızı sağlayacaktır."
 USA_strategic_interests:0 "Stratejik Çıkarlar"
 USA_strategic_interests_desc:0 "Dünya her zamankinden daha bağlantılı. Bir bölümündeki bir tehdit kolayca büyüyerek tüm dünya için bir tehlike haline gelebilir. Herhangi bir duruma hızla yanıt verebilmemizi sağlamak için dünya çapında karşılıklı destekleyici bir üs ağı kurmalıyız."
 USA_strike_at_the_empire:0 "İmparatorluğa Saldır"
 USA_strike_at_the_empire_desc:0 "Dünyadaki özgürlüğe yönelik gerçek tehdit, Avrupalı süper güçlerin inşa ettiği sömürge imparatorluklarıdır. Bir zamanlar kendimizi kurtardığımız İngiliz İmparatorluğu'ndan başlayarak ezilmeli ve nüfusları özgürleştirilmelidir."
 USA_support_rock_island:0 "Rock Island'ı Destekle"
 USA_support_rock_island_desc:0 "Cesur birliklerimizi elimizden gelen her şekilde desteklemek zaferin anahtarıdır. İster uzaktan ağır topçu ateşiyle ister savaş alanında daha doğrudan destekle olsun. Birliklerimizin ihtiyaç duydukları her şeye sahip olduğundan emin olmalıyız."
 USA_suspend_the_presecution:0 "Zulmü Askıya Al"
 USA_suspend_the_presecution_desc:0 "Amerikan vatandaşlarının siyasi görüşleri nedeniyle - ne kadar iğrenç görünürlerse görünsünler - zulüm görmesi, bu ülkenin değerleriyle temelden çelişmektedir. Derhal sona ermelidir."
 USA_tank_destroyer_doctrine:0 "Tank Avcısı Doktrini"
 USA_tank_destroyer_doctrine_desc:0 "Bazı topçu subayları tarafından geliştirilen tartışmalı bir teori, zırhlı atılımlara karşı en iyi silahın hızlı, hafif zırhlı ancak ağır silahlı bir araç olduğunu iddia ediyor."
 USA_tank_experiments:0 "Tank Deneyleri"
 USA_tank_experiments_desc:0 "Tanklar modern savaş alanında vazgeçilmezdir. Onları en iyi nasıl kullanacağımızı bulmalıyız."
 USA_the_canadian_corridor:0 "Kanada Koridoru"
 USA_the_canadian_corridor_desc:0 "Seyrek nüfuslu küçük bir Kanada bölgesi Alaska'yı alt ABD'den ayırıyor. Bu nedenle savunması Kanada'nın iyi niyetine bağlıdır. Ancak en olası saldırgan Kanada'dır. Bu devam edemez."
 USA_the_giant_wakes:0 "Dev Uyanıyor"
 USA_the_giant_wakes_desc:0 "Uluslar demokrasi ve özgürlük değerlerini korumak için bize yöneliyor. Müdahaleci olmayan Amerika'nın doğduğu dünya artık yok ve buna göre uyum sağlamalıyız."
 USA_the_neighbors:0 "Komşular"
 USA_the_neighbors_desc:0 "Öncelikle bize en yakın ülkelerin güvenliğini sağlamalıyız. Düşmanın bize ulaşmak için komşularımızı geçmesi yerine, komşularımızı geçerlerse bizi geçecekler."
 USA_two_ocean_navy_act:0 "İki Okyanus Donanması Yasası"
 USA_two_ocean_navy_act_desc:0 "Ufukta savaş belirirken, hiçbir düşmanın Amerikan kıyılarına ayak basamamasını sağlamalıyız. Donanmamız, sınırlarımızı oluşturan iki büyük okyanustan herhangi birinde herhangi bir düşmanla savaşabilmelidir."
 USA_unholy_alliance:0 "Kutsal Olmayan İttifak"
 USA_unholy_alliance_desc:0 "Bazen düşmanlarımızı seçmek zorunda kalırız. Genellikle seçim kolay değildir. Gelecek bizi bir tiranla yan yana durduğumuz için yargılayabilir veya diğerinden kurtardığımız için övebilir."
 USA_unholy_alliance_tt:0 "Savaş halindelerse, savunmacının yanında yer alarak [SOV.GetNameDef] veya Almanya ile görüşü ve ticaret görüşünü artırır."
 USA_union_representation_act:0 "Sendika Temsil Yasası"
 USA_union_representation_act_desc:0 "Çalışma, insan yaşamının temel bir parçasıdır ve bir sendikada örgütlenmek, demokratik bir toplum örgütlemenin temel bir parçasıdır. Bunu tanımamız ve sendikaların Kongre'de zorunlu temsilinin sağlanması uygundur."
 USA_unlock_contain_japan_tt:0 "§Y[JAP.GetNameDef]§! tehlikeli bir boyutta genişlerse verilecek olan şu anda aktif olmayan ödüller:"
 USA_unrestricted_submarine_warfare:0 "Sınırsız Denizaltı Savaşı"
 USA_unrestricted_submarine_warfare_desc:0 "Tarih, denizaltı savaşını kontrol etmeye çalışan iyi niyetli herhangi bir antlaşmanın yazıldığı kağıda değmediğini göstermiştir. Düşmanlarımızın zaten görmezden geleceği bir şeye bağlı olduğumuzu düşünmemeliyiz."
 USA_us_air_force:0 "ABD Hava Kuvvetleri"
 USA_us_air_force_desc:0 "Askeri hava gücünün temel amacı savaşları kazanmaktır. Giderek daha yıkıcı silahlarla stratejik bombardıman ya düşmanın direnme iradesini kıracak ya da maddi olarak bunu yapamaz hale getirecektir."
 USA_us_army_airforce:0 "ABD Ordu Hava Kuvvetleri"
 USA_us_army_airforce_desc:0 "Askeri hava gücünün temel amacı, kara kuvvetlerinin toprak almasını ve tutmasını sağlamaktır. Diğer her şey ikincildir."
 USA_us_ussr_economic_cooperation:0 "ABD-SSCB Ekonomik İşbirliği"
 USA_us_ussr_economic_cooperation_desc:0 "Kaotik ve kanlı doğumuna rağmen Sovyetler Birliği, modern, sanayileşmiş bir toplum inşa etmede dikkat çekici bir ilerleme kaydetti. Onlara yardım etmek için üzerimize düşeni yapmalıyız."
 USA_voter_registration_act:0 "Seçmen Kayıt Yasası"
 USA_voter_registration_act_desc:0 "Seçimler bir demokrasinin en önemli parçasıdır. Kimlerin katılabileceği konusunda hiçbir kontrol olmamasını talep etmek kesinlikle mantıksızdır - ya da belki de kontrolsüz seçimleri savunan insanların daha uğursuz motivasyonları vardır ve oy sahtekarlığıyla süreci baltalamak isterler..."
 USA_war_department:0 "Savaş Bakanlığı"
 USA_war_department_desc:0 "Sanayileşmiş bir savaş çağında, büyük ulusumuzun kaynaklarını tam potansiyellerine kullanabilecek bir idareye sahip olmalıyız."
 USA_war_plan_black:0 "Savaş Planı Siyah"
 USA_war_plan_black_desc:0 "Almanya'nın politikalarının ve yayılmacılığının akıl sağlığının her türlü ölçüsünü aştığı açıkça görülüyor. Savaş makineleri geri dönüşü olmayan bir noktaya ulaşmadan önce durdurulmalıdırlar."
 USA_war_plan_crimson:0 "Savaş Planı Kırmızı"
 USA_war_plan_crimson_desc:0 "Kanada şimdi dost bir komşu olabilir, ancak bu her zaman böyle olmayabilir."
 USA_war_plan_gold:0 "Savaş Planı Altın"
 USA_war_plan_gold_desc:0 "Fransa iç bölünmeden ve artan siyasi radikalizmden muzdarip, ancak aynı zamanda Avrupa'nın en büyük askeri güçlerinden biri. Bu kombinasyon birçok insanı rahatsız ediyor."
 USA_war_plan_gray:0 "Savaş Planı Gri"
 USA_war_plan_gray_desc:0 "Tarih, Karayip uluslarının oldukça istikrarsız olduğunu göstermiştir. Herhangi biri istikrarsızlığa düşerse Amerikan çıkarlarını korumak için hızla hareket etmek zorunda kalabiliriz."
 USA_war_plan_green:0 "Savaş Planı Yeşil"
 USA_war_plan_green_desc:0 "Meksika devrimin ardından sürekli bir istikrarsızlık içinde olduğundan, kararlı bir şekilde müdahale etmeye hazır olmalıyız."
 USA_war_plan_orange:0 "Savaş Planı Turuncu"
 USA_war_plan_orange_desc:0 "Bizim için Japonya'nın emperyalist hırslarından daha büyük bir tehdit yoktur. Asya ve Pasifik'e yayılma çabaları onları hızla çıkarlarımızla çelişkiye düşürecektir."
 USA_war_plan_red:0 "Savaş Planı Kırmızı"
 USA_war_plan_red_desc:0 "Halka saygı duyma yolunda göründükten sonra, eski zalimlerimiz şimdi kabul ettiğimiz değişim rüzgarlarıyla çelişiyor. İngiliz İmparatorluğu gerçek yüzünü gösteriyor. Nerede durduğumuzu onlara bildirmeliyiz."
 USA_war_plan_ruby:0 "Savaş Planı Yakut"
 USA_war_plan_ruby_desc:0 "Hindistan anlatılmamış milyonlarca insana ev sahipliği yapıyor ve çatışmaya girersek onlarla yüzleşmeye hazır olmalıyız."
 USA_war_plan_scarlet_garnet:0 "Savaş Planı Kırmızı Lal"
 USA_war_plan_scarlet_garnet_desc:0 "Pasifik'te Avustralya ve Yeni Zelanda pekala anavatanlarının yardımına koşabilir. İngiltere ile başa çıkmak için herhangi bir plan, sömürgelerini hesaba katmalıdır."
 USA_war_plan_silver:0 "Savaş Planı Gümüş"
 USA_war_plan_silver_desc:0 "İtalya, Akdeniz'e hükmetme hırsını açıkça ilan etti. İmparatorluk arzuları çıkarlarımızla çelişirse, hazırlıklı olmalıyız."
 USA_war_plan_white:0 "Savaş Planı Beyaz"
 USA_war_plan_white_desc:0 "[GetSovietThreatName] Tehdidinin kontrolsüz bir şekilde genişlemesine izin verilemez. İster dışarıdan ister içeriden olsun, ulusumuza ve genel olarak dünyaya daha büyük bir tehdit yoktur."
 USA_war_plan_yellow:0 "Savaş Planı Sarı"
 USA_war_plan_yellow_desc:0 "Çin bir nesilden fazla bir süredir iç savaş halinde. Durumun müdahale etmek zorunda kalacağımız noktaya ne zaman kötüleşeceğini söylemek mümkün değil."
 USA_war_plans_division:0 "Savaş Planları Bölümü"
 USA_war_plans_division_desc:0 "Barış isteyebiliriz, ancak savaşa hazırlanmalıyız."
 USA_war_powers_act:0 "Savaş Yetkileri Yasası"
 USA_war_powers_act_desc:0 "Giderek daha hızlı uçakların giderek daha büyük bomba yükleri taşıdığı bir dünyada, denizaltıların ve kimyasal silahların olduğu bir dünyada, Başkan'ı ülkeyi savunmak için gerekenleri yapmak üzere Kongre'nin onayını gerektirmeye kısıtlamak felakete davetiye çıkarmaktır."
 USA_war_propaganda:0 "Savaş Propagandası"
 USA_war_propaganda_desc:0 "Halkımız çocuklarını başka bir savaşta ölmeye göndermek istemiyor, ancak birçok politikacı müdahale ihtiyacı görüyor. Düşmanı şeytanlaştırmak ve açık çatışma çağrısı yapmak için propaganda sadece tiranların bir aracı olmayabilir."
 USA_wartime_industry:0 "Savaş Zamanı Sanayisi"
 USA_wartime_industry_desc:0 "Güçlü bir sanayimiz var, ancak hepsi savaş malzemeleri üretimi için iyi uyarlanmış değil. Bu değişimi kolaylaştırmak için verimli süreçler bulmak, kaynaklarımızı kullanmanın anahtarı olacaktır."
 USA_womens_armed_service_integration_act:0 "Kadınların Silahlı Hizmet Entegrasyon Yasası"
 USA_womens_armed_service_integration_act_desc:0 "Hizmet etmek isteyen kimseyi geri çevirmeyi göze alamayız. Üniformalı her kadın, cephede savaşacak bir erkeği serbest bırakır."
 USA_work_with_the_bund:0 "Bund ile Çalış"
 USA_work_with_the_bund_desc:0 "Alman-Amerikan Bund, pozisyonlarımızı Alman kökenli birçok Amerikalıya iletmemize yardımcı olmayı teklif etti. Eyaletlerinde sempatik bir tabanımız olmasını sağlayacaktır."
 USA_work_with_the_bund_tt:0 "Bir iç savaş durumunda aşağıdaki eyaletlerin hükümetle kalmasını sağlar: Ohio, Missouri, Wisconsin, Illinois, Indiana ve Michigan"
 USA_worker_management_act:0 "İşçi Yönetimi Yasası"
 USA_worker_management_act_desc:0 "Çok sık olarak fabrikalar ve ofisler, atölyede hiç çalışmamış insanlar tarafından yönetiliyor. Üretimin gerçeklerini anlayamadıkları için gerçekçi olmayan beklentiler belirliyorlar. Ekonomimizi bu tür yetersiz yöneticilerin verebileceği zarardan korumak için, işçilerin, işçiler tarafından, işçiler için yönetimini uygulayacağız!"
 USA_wpa:0 "WPA"
 USA_wpa_desc:0 "Milyonlarca insan hala Büyük Buhran'ın yol açtığı işsizlikten muzdarip. Bu insanları kamu projelerinde çalıştırmak için bir kurum sorunu tam olarak çözmeyebilir, ancak İş İlerleme İdaresi doğru yönde atılmış bir adımdır."
 WHILE_FOCUSING:0 "Buna odaklanırken, aşağıdaki etkiler olacaktır:\n$EFF$"
 advanced_torpedoes_focus:0 "Gelişmiş Torpidolar"
 advanced_torpedoes_focus_desc:0 "Tahrik sistemlerinde basınçlı hava yerine sıkıştırılmış oksijen kullanarak torpidolarımız, önceki tüm türlerden daha uzağa gidebilecek ve daha büyük bir savaş başlığı taşıyabilecektir."
