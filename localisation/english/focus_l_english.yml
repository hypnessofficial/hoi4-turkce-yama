 aviation_effort:0 "Hava Kuvvetleri Çabası"
 aviation_effort_2:0 "Hava Kuvvetleri Çabası II"
 aviation_effort_2_desc:0 "Hava kuvvetlerimizi ordunun diğer kollarıyla iyi bir şekilde entegre etmek için havacılıkta daha fazla ilerleme gerekli olacaktır."
 aviation_effort_desc:0 "Hiçbir yerde teknolojik gelişmeler hava savaşlarında olduğu kadar hızlı değildir. Havacılık, her modern ulusun ustalaşması gereken bir alandır."
 aviation_effort_tt:0 "§YHava Üssü§! için yeterli inşaat alanı yok!"
 axis_leanings_focus:0 "Mihver Eğilimleri"
 axis_leanings_focus_desc:0 "Avrupa'da bir güç merkezi inşa eden yeni Almanya ile ortak birçok çıkarımız ve değerimiz var. Onlara müttefik olarak katılmak, Asya'daki hakimiyetimize rakip olmayacak kadar uzak, güçlü bir dost kazandıracaktır."
 battleship_focus:0 "Zırhlı Odağı"
 battleship_focus_desc:0 "Japonya güçlü bir donanmaya ihtiyaç duyuyor ve Zırhlı Filomuzun gücünün çekirdeği olmalı. Bırakın diğer uluslar servetlerini denenmemiş Uçak Gemilerine harcasınlar, sadece Zırhlılar denizlere hakim olabilir!"
 bb_bonus:0 "Zırhlı modelleri bonusu"
 bc_bonus:0 "Savaş kruvazörü modelleri bonusu"
 befriend_siam_focus:0 "Siyam ile Dost Ol"
 befriend_siam_focus_desc:0 "Siyam, Avrupa sömürgeleştirmesinden kaçındı ve tebaa bir ulus olmaya alışkın değil. Onları boyunduruk altına almak yerine, böyle kalması için bizimle işbirliği yapmaya ikna etmeliyiz."
 benghazi_oil_developed:0 "Bingazi Petrol Sahaları Geliştirildi"
 bomber_bonus:0 "Bombardıman uçağı modelleri bonusu"
 bomber_command_focus:0 "Bombardıman Komutanlığı"
 bomber_command_focus_desc:0 "Giulio Douhet'in her zaman söylediği gibi; 'Bombardıman uçağı her zaman geçecektir!'. Radar teknolojisi ve uçaksavar savunmalarındaki ilerlemelere rağmen, daha iyi bombardıman uçaklarının geliştirilmesine öncelik vermeliyiz."
 bomber_focus:0 "Bombardıman Uçağı Odaklanması"
 bomber_focus_desc:0 "Gelecekteki insanlar bugünün savaşlarının dehşetinden bahsederken, göklerden yağan ateş belirgin bir şekilde yer alacaktır. Bu hikayelerin düşmanlarımız tarafından anlatılmasını sağlamak için elimizden geleni yapacağız."
 britain_enforced_our_loyalty:0 "İngiltere sadakatimizi zorladı."
 can_degaussing_tech:0 "Degaussing teknolojisini kazan"
 capital_ships_bonus:0 "Ana Gemi modelleri bonusu"
 capital_ships_effort:0 "Ana Gemi Çabası"
 capital_ships_effort_desc:0 "En çok zırhlıya sahip olan ulus okyanuslara hükmedecek. Zırhlılar ve uçak gemileri deniz üstünlüğünde eskiyi ve yeniyi temsil ediyor."
 carrier_focus:0 "Uçak Gemisi Odağı"
 carrier_focus_desc:0 "Japonya güçlü bir donanmaya ihtiyaç duyuyor ve Uçak Gemisi Filomuzun gücünün çekirdeği olmalı. Zırhlının günü sona erdi, düşmanlarımız yakında keşfedecek!"
 chinese_puppet_focus:0 "Çin Kuklası"
 chinese_puppet_focus_desc:0 "Çin, bizimle savaştan kaçınmak istediğini kanıtladı. Belki de liderleri iç bölünmeyi daha büyük bir tehdit olarak görüyorlar. Onlara komünistlerden ve savaş ağalarından korunmamızı, Büyük Doğu Asya Ortak Refah Alanı'nda tebaa olarak sunabiliriz."
 chinese_war_focus:0 "Çin ile Savaş"
 chinese_war_focus_desc:0 "Marco Polo Köprüsü olayı, Çinlilerin işbirliğiyle ilgilenmediğini kanıtladı. Artan gerilim ardından gelen ateşi tehdit ederken, savaş Çin ulusuna düzeni getirmenin tek yolu olabilir."
 coastal_command_focus:0 "Kıyı Komutanlığı"
 coastal_command_focus_desc:0 "[Root.GetCoastalCommandDesc]"
 codebreaking_bonus:0 "Kod kırma bonusu"
 collectivist_ethos:0 "Kollektivist Ethos"
 collectivist_ethos_desc:0 "Düşmanlarımız küçük ulusları bölebilir ve fethedebilir, ancak halkımız birleşmiş kalacaktır. Hepimiz birimiz, birimiz hepimiz için."
 con_def_bonus:0 "Konvoy Savunması doktrini bonusu"
 confirm_cancel_national_focus:0 "Milli Hedefi İptal Et"
 confirm_cancel_national_focus_desc:0 "§H$FOCUS_NAME$§! Milli Hedefini iptal etmek istediğinizden emin misiniz?"
 confirm_cancel_national_focus_progress_loss_plural:0 "§R$LOST_DAYS$§! günlük ilerleme kaybedeceksiniz."
 confirm_cancel_national_focus_progress_loss_singular:0 "§R$LOST_DAYS$§! günlük ilerleme kaybedeceksiniz."
 construction_effort:0 "İnşaat Çabası"
 construction_effort_2:0 "İnşaat Çabası II"
 construction_effort_2_desc:0 "Fabrikalarımızı genişletmeye devam etmek, ticaret için mal ve daha fazla inşaat çabası üretimini hızlandırmamızı sağlayacaktır."
 construction_effort_3:0 "İnşaat Çabası III"
 construction_effort_3_desc:0 "Altyapı ağımızın genişlemesi, inşaat kapasitemizi önemli ölçüde artırdı."
 construction_effort_desc:0 "Savaş dünyayı tehdit etse bile sivil sanayi kapasitesi küçümsenmemelidir."
 construction_effort_tt:0 "§YSivil Fabrikalar§! için yeterli inşaat alanı yok!"
 construction_tech_bonus:0 "İnşaat teknolojisi bonusu"
 continuous_air_production:0 "Hava Üretimi"
 continuous_air_production_desc:0 "Havacılık endüstrimizi israfı ortadan kaldırmak ve üretimi kolaylaştırmak için yeniden organize edebiliriz."
 continuous_boost_freedom:0 "Özerkliği Artır"
 continuous_boost_freedom_desc:0 "Sömürge bürokrasimizi yeniden düzenleyerek ve yerli yöneticiler işe alarak, zamanla kendi işlerimizin sorumluluğunu üstlenebileceğiz."
 continuous_naval_production:0 "Deniz Üretimi"
 continuous_naval_production_desc:0 "Kaynakları tersanelerimize odaklayarak ve yetenekli gemi yapımcılarını askerlik hizmetinden muaf tutarak, gemiler için üretim süresini önemli ölçüde azaltabiliriz."
 continuous_non_factory_construct:0 "İnşaat Mühendisliği"
 continuous_non_factory_construct_desc:0 "İnşaat sektörümüzde hala çok fazla boşluk var. Dikkatimizi ona odaklayarak, inşaat hızında önemli bir iyileşme sağlayabiliriz. Ne yazık ki, takım tezgahlarının üretimi ağır sanayimizin genişlemesinde büyük bir darboğaz oluşturdu, bu nedenle bu alandaki çabalardan faydalanamayacaklar."
 continuous_reduce_training_time:0 "Ordu Eğitimi"
 continuous_reduce_training_time_desc:0 "Her tümende özel ileri eğitim birimleri oluşturarak, daha önce eğitimi bitirmek için geride tutulacak tümenleri bile cepheye konuşlandırabiliriz."
 continuous_repair:0 "İnşaat Onarımı"
 continuous_repair_desc:0 "Fabrika ve inşaat işçilerinden özel onarım ekipleri oluşturacak ve hasarlı altyapının yeniden inşasını iyileştirmek için konuşlandırmalarını merkezi olarak kontrol edeceğiz."
 continuous_restrict_freedom:0 "Tebaaları Bastır"
 continuous_restrict_freedom_desc:0 "Sömürgeci tebaalarımız \"kendi kaderini tayin etme\" veya \"ulusal bağımsızlık\" gibi konularda oldukça aptalca fikirler edindiler. Onları bu düşüncelerden arındırmanın zamanı geldi."
 continuous_special_facility:0 "Tesis İnşaatı"
 continuous_special_facility_desc:0 "Gelecekteki savaşımızı değiştirebilecek yeni atılımları bulmak için daha fazla bilim adamına ev sahipliği yapacak araştırma tesislerimizi geliştirme fırsatımız var."
 continuous_suppression:0 "Direniş Bastırması"
 continuous_suppression_desc:0 "İşgal altındaki topraklardaki büyük direniş gruplarına sızarak ve liderlerini devşirerek, verebilecekleri hasar miktarını önemli ölçüde azaltabiliriz."
 continuous_tech_share:0 "Teknoloji Paylaşımı"
 continuous_tech_share_desc:0 "Araştırma enstitülerimizi ve üniversitelerimizi müttefik ülkelerdeki muadilleriyle iletişim kurmaya teşvik edeceğiz. Bu bize bir teknoloji paylaşım bonusu kazandıracaktır."
 convoy_protection_focus:0 "Konvoy Koruması"
 convoy_protection_focus_desc:0 "Korkakça ve onursuz bir taktik olmasına rağmen, düşman ulusların İmparatorluğumuz çevresinde malzeme ve kaynak taşıyan ticaret gemilerini hedef alması mümkündür. Bu gerçekleşirse, bu gemileri en iyi nasıl koruyacağımızı incelemeliyiz."
 counter_purge:0 " Troçki tarafından tasfiye edildi"
 cr_bonus:0 "Kruvazör modelleri bonusu"
 cruiser_effort:0 "Kruvazör Çabası"
 cruiser_effort_desc:0 "Gelişmiş zırhlı araştırma girişiminde bulunmadan önce, daha küçük kruvazörlerin değiştirilmesi gerekiyor."
 crypto_bomb_focus:0 "Kriptolojik Bomba"
 crypto_bomb_focus_desc:0 "Polonyalılar, Alman Enigma şifrelerini kırabilen 'Kriptolojik Bomba' adını verdikleri parlak bir makine geliştiriyorlar. Bletchley Park tesisimizde daha da geliştirmek için kaynaklarımız var."
 cv_bonus:0 "Uçak gemisi modelleri bonusu"
 dd_bonus:0 "Muhrip modelleri bonusu"
 destroyer_effort:0 "Muhrip Çabası"
 destroyer_effort_desc:0 "Denizaltıların tasarımını ve stratejik kullanımını inceleyerek, bu stratejilere nasıl karşı koyacağımızı da öğrendik. Muhripler bunun için çok önemli olacaktır."
 deterrence:0 "Caydırıcılık"
 deterrence_desc:0 "Tek başımıza, savaştan nadiren fayda sağlarız. Neyse ki, en iyi savunmanın o kadar iyi bilindiğini, onu asla kullanmak zorunda kalmayacağınızı biliyoruz."
 divine_wind_focus:0 "Kutsal Rüzgar"
 divine_wind_focus_desc:0 "Ölüm olasılığıyla korkusuzca yüzleşmek her askerden beklenir, ancak halkımız bunun ötesine geçmeli, imparatorun ve ulusun şanı için hayatta kalma umudu olmadan kendilerini feda etmeye hazırlanmalıdır."
 doctrine_effort:0 "Doktrin Çabası"
 doctrine_effort_2:0 "Doktrin Çabası II"
 doctrine_effort_2_desc:0 "Savaş alanı sadece savaşlar arası yıllarda değil, son çatışmalar sırasında da değişti. Bunu yansıtmak için doktrinlerimizi sürekli olarak yeniden değerlendirmeliyiz."
 doctrine_effort_desc:0 "Büyük Savaş'ta kara muharebesini tanımlayan askeri doktrinler eskimiştir. Yarının askeri düşüncesini şekillendirme görevini en büyük zihinlerimize vermeliyiz."
 either_tt:0 "Şu seçeneklerden birini elde edeceğiz:"
 electronics_bonus:0 "Elektronik bonusu"
 equipment_effort:0 "Ekipman Çabası"
 equipment_effort_2:0 "Ekipman Çabası II"
 equipment_effort_2_desc:0 "Piyade ve destek birliklerimizin çağımızın mümkün olan en iyi ekipmanlarıyla donatılmasını sağlamaya devam edeceğiz."
 equipment_effort_3:0 "Ekipman Çabası III"
 equipment_effort_3_desc:0 "Yabancı ekipmanı taklit etmek veya satın almak yerine, piyade silahlarında dünya lideri olmayı hedeflemeliyiz."
 equipment_effort_desc:0 "Piyade tarafından taşınabilecek ekipman limitleri sürekli zorlanıyor. Askerlerimize mevcut en iyi araçları sağlamaya odaklanacağız."
 excavation_tech_bonus:0 "Kazı teknolojisi bonusu"
 extra_tech_focus:0 "Ekstra Araştırma"
 extra_tech_slot:0 "Ekstra Araştırma Yuvası"
 extra_tech_slot_2:0 "Ekstra Araştırma Yuvası II"
 extra_tech_slot_2_desc:0 "Ulusumuzun hızlı sanayileşmesi, peşinden gitmemiz gereken Ar-Ge'de yeni fırsatlar yarattı."
 extra_tech_slot_desc:0 "Endüstriyel genişlememiz ve diğer son gelişmeler, daha fazla Ar-Ge'yi paralel olarak yürütmemizi sağlayabilir."
 federal_housing_tt:0 "(§YBeş rastgele eyalet§!): §G1§! İnşaat Alanı ekle."
 fighter_bonus:0 "Avcı modelleri bonusu"
 fighter_command_focus:0 "Avcı Komutanlığı"
 fighter_command_focus_desc:0 "İlk önceliğimiz kendi gökyüzümüzü kontrol etmek olmalı! Avcı geliştirmeden daha önemli bir askeri araştırma alanı ayırt etmek zor."
 fighter_focus:0 "Avcı Uçağı Odaklanması"
 fighter_focus_desc:0 "Büyük Savaş'ta it dalaşlarının sonunu görmedik. Avcı uçaklarının geliştirilmesinde önde olmak, gelecekte bize bir avantaj sağlayacaktır."
 flag_franco_british_union:0 "Fransız-İngiliz Birliği"
 fleet_in_being_bonus:0 "Mevcut Filo doktrinleri bonusu"
 flexible_navy:0 "Esnek Donanma"
 flexible_navy_desc:0 "Deniz savaşını denizaltı teknolojisindeki ilerlemeleri hesaba katacak şekilde yeniden icat etmek, düşman konvoylarına karşı verimli bir şekilde saldırmamızı sağlayacaktır."
 foreign_expeditions:0 "Yurtdışı Seferleri"
 foreign_expeditions_desc:0 "Düşmanlarımız kendi idealleri adına uzak çatışmalara müdahale etmeye hazır olduklarından, biz de kendi ideallerimiz için aynısını yapmaya hazır olmalıyız."
 fortress_japan_focus:0 "Kale Japonya"
 fortress_japan_focus_desc:0 "Düşmanlarımız Donanmamızı bir gün ezerse, tahkimatlarımız herhangi bir işgal girişiminin maliyetini çoğu ulusun ödeyebileceğinden çok daha fazla artıracaktır."
 found_own_faction_focus:0 "Kendi Fraksiyonumuzu Kur"
 found_own_faction_focus_desc:0 "Büyük Doğu Asya Ortak Refah Alanı'nın yaratılması için zaten çaba gösterdik. Kalıcı zaferi sağlamak için Japonya, Asya'da ve ötesinde tek başına liderlik edecek kadar güçlü olmalıdır."
 general_rearmament_focus:0 "Genel Yeniden Silahlanma"
 general_rearmament_focus_desc:0 "[Root.GetGeneralRearmamentDesc]"
 generic_focus:0 "Milli Hedef"
 ger_sov_buddies_tooltip:0 "§REğer [SOV.GetAdjective]ler teklifimizi kabul ederse, bu politika değişikliği nedeniyle bir miktar İstikrar kaybı yaşayacağız. Söylemeye gerek yok, Faşist arkadaşlarımız ve Demokratik güçler de bu olayların gidişatından rahatsız olacaklardır.§!\n"
 ger_sov_buddies_tooltip_2:0 "Bu, [Root.GetFactionName]'i dağıtacak ve §YBerlin-Moskova§! fraksiyonunu yaratacaktır.\n"
 german_focus:0 "Alman Milli Hedefi"
 heavy_bomber_bonus:0 "Stratejik Bombardıman Uçağı bonusu"
 hk_air_focus:0 "Hava Savunmaları"
 hk_air_focus_desc:0 "Hong Kong'daki uçaksavar mevzilerini büyük ölçüde genişletmeli ve iyileştirmeliyiz."
 hk_landward_forts_focus:0 "Kara Tahkimatları"
 hk_landward_forts_focus_desc:0 "Hong Kong, Çin anakarasından sürekli bir saldırıya dayanabilmek için bir kale şehri haline gelmek zorunda kalacak."
 hongkong_focus:0 "Hong Kong'u Tut"
 hongkong_focus_desc:0 "Singapur Stratejisi eskidi. Planımız daha cesur olmalı ve Japonya'ya çok daha yakın bir üsse dayanmalı. Yeterli tahkimat ve tesislerle Hong Kong mükemmel hizmet edecektir!"
 ideological_fanaticism:0 "İdeolojik Fanatizm"
 ideological_fanaticism_desc:0 "Kurulan siyasi kıymetlerimiz ve gayelerimiz, herhangi kutsal bir inanç kadar uğruna ölmeye değer. Yoldaşlarımız ölümle karşılaşmaya hazır olmalı, ve bu yoldan sapanlar ölmeye kesinlikle daha iyi hazır olmalı."
 if_no_depression_get_stuff_TT:0 "\nEğer §H$CAN_great_depression_1$§! kaldırıldıysa, farklı bir bonus uygulanacaktır.\n\n"
 imperial_glory_focus:0 "İmparatorluk Zaferi"
 imperial_glory_focus_desc:0 "Kamikaze, Özel Saldırı Birimi'nin taktikleri, intihar saldırılarını doğaçlama bir son çareden yerleşik bir doktrine dönüştürdü. Yeni uçaklarla, esasen insanlı füzelerle, bu saldırılar durdurulamaz olacak."
 imperial_glory_focus_effect:0 "§HYokosuka MXY7 Ohka§! üretimini sağlar!"
 indoctrination_focus:0 "Telkin"
 indoctrination_focus_desc:0 "İdeolojimizi gerçeğe dayalı olarak kurduktan sonra, onu gerçek olarak öğretebiliriz. Eğitim ve medya bu dersi yansıtmalıdır."
 industrial_bonus:0 "Endüstriyel bonus"
 industrial_effort:0 "Endüstriyel Çaba"
 industrial_effort_2:0 "Endüstriyel Çaba II"
 industrial_effort_2_desc:0 "Demir bir irade ve amansız bir çalışma etiği ile, insanları başka bir büyük endüstriyel çaba için seferber edebiliriz."
 industrial_effort_desc:0 "Tüm siyasi çabalarımızı büyük bir ileri atılımla sivil sanayiyi geliştirmeye odaklayın."
 industrial_effort_focus:0 "İmparatorluk Kemer Sıkma Politikası"
 industrial_effort_focus2:0 "Endüstriyel Çaba"
 industrial_effort_focus2_desc:0 "Japonya yeni sanayileşmiş ve henüz bazı Batı ulusları kadar güçlü değil. Yeteneklerimiz arasındaki farkı kapatmak için adımlar atmalıyız."
 industrial_effort_focus_desc:0 "İmparator'un her tebaası İmparatorluğun iyiliği için fedakarlık yapmalıdır."
 infantry_artillery_bonus:0 "Piyade Silahları ve Topçu bonusu"
 infantry_weapons_bonus:0 "Piyade Silahları bonusu"
 infra_effort_focus:0 "Altyapı Çabası"
 infra_effort_focus_desc:0 "Dağlık ülkemizde Altyapı inşa etmek kolay olmadı, yine de çabalar devam etmeli."
 infrastructure_effort:0 "Altyapı Çabası"
 infrastructure_effort_2:0 "Altyapı Çabası II"
 infrastructure_effort_2_desc:0 "Altyapımızı daha da genişletmek, yüksek teknolojili gizli projeler için gerekli taşımaları ve iletişimleri sağlayacaktır."
 infrastructure_effort_desc:0 "Uygun altyapısı olmayan bir ülke gelişmiş projeler veya inşaatlar peşinde koşamaz."
 infrastructure_effort_tt:0 "§YAltyapı§! için yeterli inşaat alanı yok!"
 internationalism_focus:0 "Enternasyonalizm Odaklanması"
 internationalism_focus_desc:0 "İdeoloji sınır tanımaz. Başka bir ulus kendini egemen ilan edebilir, ancak inançlarımız bu tür iddiaların üstündedir."
 interventionism_focus:0 "Müdahalecilik Odaklanması"
 interventionism_focus_desc:0 "Sadece kendi vatandaşlarımızın değil, tüm insanların özgürlüğüne değer veriyoruz. Eğer tiranlığı önlemek savaş anlamına geliyorsa, öyle olsun."
 invite_non_fascist_communist_only_TT:0 "Potansiyel üye devletlerin faşist veya komünist olmaması ve halihazırda bir grupta olmaması gerekir.\n"
 italian_focus:0 "İtalyan Milli Hedefi"
 jap_improved_sprit_focus:0 "Geliştirilmiş Ulusal Ruh"
 jap_improved_sprit_focus_desc:0 "Milliyetçi gurur ve savaşa destek, İmparator'un her tebaasını ele geçirerek onları daha da büyük bağlılık zirvelerine taşıyor!"
 jap_sia_love:0 "Japon-Siyam Diplomasisi"
 jap_sia_love_desc:0 "Japonya, Siyam ile ilişkileri geliştirmek için diplomatik çabalarına odaklandı."
 jet_bonus:0 "Jet Uçağı modelleri bonusu"
 jet_rocket_bonus:0 "Jet ve Roket Motoru bonusu"
 kamikaze_focus_tooltip:0 "Düşman gemilerine karşı intihar saldırıları olan §YKamikaze Saldırısı§! hava görevlerine izin verir.\n"
 land_doc_bonus:0 "Kara doktrinleri bonusu"
 large_navy:0 "Büyük Donanma"
 large_navy_desc:0 "Deniz doktrinlerimizi büyük gemileri barındıracak şekilde uyarlamak ve ticaret konvoylarımızın güvenliğini sağlamak, ne tür gemilere ihtiyacımız olduğu hakkında bize çok şey öğretecektir."
 liberty_ethos:0 "Özgürlük Ethosu"
 liberty_ethos_desc:0 "İnsan ruhunu boğmaya çalışan ideolojik fanatiklerin bu zamanında, bireysel özgürlükleri ve hürriyeti koruyacağız."
 limited_rearmament_focus:0 "Sınırlı Yeniden Silahlanma"
 limited_rearmament_focus_desc:0 "[Root.GetLimitedRearmamentDesc]"
 marine_bonus:0 "Deniz Piyadesi bonusu"
 maud_focus:0 "MAUD Komitesi"
 maud_focus_desc:0 "'Uranyum Patlamasının Askeri Uygulaması' komitesi, kontrolsüz bir nükleer fisyon reaksiyonu elde etmek için uranyum kullanarak inanılmaz güçte bir bomba inşa etmenin teorik olarak mümkün olduğuna inanıyor. Ancak, bu teknolojiyi zamanında kendi başımıza geliştiremeyebiliriz. Amerikalılarla konuşmalıyız."
 mech_army_bonus:0 "Mekanize Ordu bonusu"
 mechanization_effort:0 "Mekanizasyon Çabası"
 mechanization_effort_desc:0 "Motorize piyadenin olanaklarını yeniden düşünerek, günümüzde inşa edilebilecek araçların sınırlarını zorlayabiliriz."
 med_armor_bonus:0 "Orta Zırh modelleri bonusu"
 militarism:0 "Militarizm"
 militarism_desc:0 "Askeriyeyi gerekli bir kötülük olarak görenler, savaş karşısında tereddüt etmeye mahkumdur. Asker bir halk olmak için militarizmi kültürümüze işleyeceğiz."
 military_youth:0 "Askeri Gençlik"
 military_youth_desc:0 "Ulusumuzdaki gençlerin disiplinini ve siyasi eğitimini teşvik eden kuruluşlar, sadakat ve fedakarlığı erken yaşta besleyecektir."
 motorization_effort:0 "Motorizasyon Çabası"
 motorization_effort_desc:0 "Piyadeleri sahaya güvenli bir şekilde sokmak ve çıkarmak için hareketlilik ve koruma çok önemlidir. Bu gelişmelere odaklanmak, hızlı hareket etmemizi sağlayacaktır."
 motorized_bonus:0 "Motorlu Piyade bonusu"
 mountain_guns_tt:0 "§HDağ Topu§!'nu etkinleştirir!\n§HTopçu (Dağlar)§!\n Saldırı: §G+8%§!\n Hareket: §G+15%§!\n§HTank Savar (Dağlar)§!\n Saldırı: §G+8%§!\n Hareket: §G+15%§!"
 mountaineers2_bonus:0 "Dağcılar II bonusu"
 nationalism_focus:0 "Milliyetçilik Odaklanması"
 nationalism_focus_desc:0 "Ulusumuz eşsizdir ve siyasi başarılarımız sadece burada gerçekleşebilirdi. Ne pahasına olursa olsun bunun için savaşmalıyız."
 nav_bomber_bonus:0 "Deniz bombardıman uçağı modelleri bonusu"
 naval_air_effort:0 "Deniz Hava Çabası"
 naval_air_effort_desc:0 "Deniz hedeflerine yönelik hava saldırılarının etkinliği Amerikalılar tarafından 1921 gibi erken bir tarihte gösterildi. Bir deniz gücüyle savaşmayı düşünüyorsak, Hava Kuvvetlerinin bu kolunu ihmal etmemeliyiz."
 naval_air_innovations_focus:0 "Deniz Hava İnovasyonları"
 naval_air_innovations_focus_desc:0 "Hava kuvvetlerinin birincil görevi, övülen Donanmamızı desteklemek olmalıdır!"
 naval_base_focus:0 "Deniz Üssü Genişletmesi"
 naval_base_focus_desc:0 "Deniz genişlemesi daha fazla Deniz üssü gerektirir."
 naval_doc_bonus:0 "Deniz Doktrinleri bonusu"
 naval_effort:0 "Donanma Çabası"
 naval_effort_desc:0 "Donanmamızın genişletilmesi birinci önceliğimiz olmalıdır. Tüm mevcut kaynakları yeni Tersanelere ve hafif su üstü gemileri araştırmasına ayırın."
 naval_effort_tt:0 "§YDeniz Tersaneleri§! için yeterli inşaat alanı yok!"
 naval_innovations_focus:0 "Deniz İnovasyonları"
 naval_innovations_focus_desc:0 "Donanma artık İmparatorluğun tanınmış birinci sınıf hizmeti olduğuna göre, yeni gemi sınıflarının tasarımına daha fazla kaynak ayırmamız gerekiyor."
 naval_rearmament_focus:0 "Deniz Yeniden Silahlanması"
 naval_rearmament_focus_desc:0 "[Root.GetNavalRearmamentDesc]"
 navy_primancy_focus:0 "Donanma Önceliği"
 navy_primancy_focus_desc:0 "İki ana hizmet kolundan, İmparatorluğun güçlü sağ kolu gerçekten de Donanma'dır! Denizleri kontrol etme yeteneği, Ordu'nun sağlayabileceği küçük hizmetlerden çok daha ağır basar. Bu basit, apaçık gerçeği kabul ederek ve Donanma'ya daha fazla kaynak ayırarak olasılıklar sınırsızdır."
 needs_approval:0 "§R[This.GetName] bonusların etkili olması için anlaşmayı onaylamalıdır.§!\n"
 neutrality_focus:0 "Tarafsızlık Odaklanması"
 neutrality_focus_desc:0 "Başkaları küresel bir çatışmada taraf tutmanın cesaret ve bilgelik gerektirdiğini iddia etse de, biz reddetmenin daha fazlasını gerektirdiğini biliyoruz."
 new_ideas:0 "Yeni Bakanlar mevcut.\n"
 northern_expansion_focus:0 "Kuzey Genişlemesi"
 northern_expansion_focus_desc:0 "İmparatorluk Ordusu'nun desteğini alan Kuzey Genişleme Doktrini, Sovyetler Birliği'nin Japon hırslarına yönelik en büyük tehdidi oluşturduğunu kabul eder. Avrupa'da artan gerilimlerle, Rus Uzak Doğu'suna saldırmak için uygun bir anın kendini göstermesi kaçınılmazdır. Hızlı saldırmalıyız."
 nuclear_bonus:0 "Nükleer Bonus"
 nuclear_effort:0 "Nükleer Çaba"
 nuclear_effort_desc:0 "Dünyayı değiştiren bir keşfin eşiğinde dururken, başkalarının bir gün Dünya'yı tüketebilecek ateşi yakmasına izin veremeyiz."
 op_dest_bonus:0 "Operasyonel Yıkım doktrinleri bonusu"
 or_tt:0 "veya"
 oust_germans_focus:0 "Çin-Alman Bağlarını Kopar"
 oust_germans_focus_desc:0 "Alman askeri danışmanları en azından yirmili yıllardan beri Çin'de bulunuyor ve Kuomintang'a kritik destek sağlıyor. Bu artık hoş görülemez. Tüm Alman desteğinin Çinlilere derhal geri çekilmesini talep etme hakkımız var. Almanların taraf seçme zamanı geldi."
 paramilitarism:0 "Paramilitarizm"
 paramilitarism_desc:0 "Askeri prensiplerin askeriye dışında da uygulamaları vardır. Silahlı kuvvetlerimizi tamamlayacak yarı askerileştirilmiş birimlerin geliştirilmesiyle, daha fazla insan askeri eğitim alacaktır."
 peninsular_focus:0 "Yarımada Savaşı"
 peninsular_focus_desc:0 "Singapur'a ulaşmadan önce Malaya üzerinden kuzeyden gelen bir düşmanı önlemeli ve yavaşlatmalıyız."
 political_commissars:0 "Siyasi Komiserler"
 political_commissars_desc:0 "Politikalarımızın askeri pratikte takip edildiğinden emin olmak için, askeri rütbelere siyasi olarak atanmış yetkililer getireceğiz."
 political_correctness:0 "Siyasi Doğruluk"
 political_correctness_desc:0 "Hafif tartışmalı veya utanç verici görüşlere sahip insanlar, kendilerine karşı geniş kapsamlı bir komplo olduğuna dair endişe duyuyor gibi görünüyor. Bu mükemmel bir fikir gibi görünüyor."
 political_effort:0 "Siyasi Çaba"
 political_effort_desc:0 "Dünyada değişim yaratmak için, kendi ülkemizde değişim yaratabilmeliyiz. Siyasi konumumuzu güçlendirmek önce gelmelidir."
 production_effort:0 "Silahlanma Çabası"
 production_effort_2:0 "Silahlanma Çabası II"
 production_effort_2_desc:0 "Sivil fabrikaları askeri ekipman üretimine uyarlamaya çalışmak verimsizdir. Artık askeri üretime hazırlanmaya odaklanmalıyız."
 production_effort_3:0 "Silahlanma Çabası III"
 production_effort_3_desc:0 "Yeni ekipman taleplerini karşılamak için askeri fabrikalarımızı genişletme çabalarına devam etmek gereklidir."
 production_effort_desc:0 "Traktör inşa edebiliyorsanız, tank da inşa edebilirsiniz! Askeri üretim kapasitemizin geride kalmasına izin vermemeliyiz."
 production_effort_tt:0 "§YSilah Fabrikası§! için yeterli inşaat alanı yok!"
