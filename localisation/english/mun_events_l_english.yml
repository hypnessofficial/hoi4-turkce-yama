 CZE_cancel_anti_hungary_focus_tt:0 "§Y$CZE_neutralize_the_hungarian_threat$§! milli hedefini iptal eder"
 CZE_divide_nation_title_dynamic_czech_states:0 "Çek İşçileriyle $MUN_czech.1032.t$"
 CZE_divide_nation_title_dynamic_hungarian_states:0 "[664.GetName] Bölgesinde $MUN_czech.1032.t$"
 CZE_divide_nation_title_dynamic_slovakia_states:0 "[SLO.GetNonIdeologyName] Bölgesinde $MUN_czech.1032.t$"
 CZE_divide_nation_title_dynamic_sudentenland:0 "Südetler'de $MUN_czech.1032.t$"
 CZE_divide_nation_title_dynamic_tesinko_poles:0 "[72.GetName] Bölgesinde $MUN_czech.1032.t$"
 CZE_divide_nation_title_dynamic_ukrainian_states:0 "[73.GetName] Bölgesinde $MUN_czech.1032.t$"
 CZE_divided_nation_event_onbroad_tt:0 "Ana Eyaletlerimizdeki olumsuz §YEyalet Değiştiricilerini§! §YKaldırmamızı§! sağlayan §YKararların§! kilidi açıldı.\n\nBu §YKararları§! tamamlamak aynı zamanda §Y$CZE_a_divided_nation_dynamic_modifier$§! Milli Ruhundaki Olumsuz Değiştiricileri de tamamen §YKaldırılana§! kadar düşürecektir."
 CZE_gun_smuggling_tt:0 "Ülkeye Silah Kaçakçılığı"
 CZE_investment_effects_tt:0 "§Y100 gün§! içinde şunları kazanacağız:\nRastgele §Y3§! eyalette §YAltyapı§!.\nRastgele §Y1§! eyalette §YSivil Fabrika§!.\n"
 CZE_no_time_to_lose_tt:0 "Bir tehdit ortaya çıkmadan önce Tahkimat Projelerimizi tamamlamak için zaman penceremiz artık çok dar."
 CZE_we_dont_get_caught_tt:0 "§Y$CZE_zbrojovka_brno_organization$§! yakalanmadı."
 CZE_we_got_caught_tt:0 "§Y$CZE_zbrojovka_brno_organization$§! yakalandı."
 MUN_czech.1001.d:0 "[SOV.GetNameDef] ile askeri eylemleri koordine etmeyi uman [FROM.GetNameDef], [89.GetName] ve [91.GetName] sınır bölgelerini kendilerine devretmemizi talep etti."
 MUN_czech.1001.t:0 "[FROM.GetNameDefCap], [SOV.GetNameDef] Yönünde Bir Koridor Talep Ediyor"
 MUN_czech.1002.a:0 "Belki de haklılar"
 MUN_czech.1002.b:0 "Hayır, onlar bizim korumamız altında!"
 MUN_czech.1002.d:0 "Güneye doğru genişledikten sonra [FROM.GetName] alışılmadık bir taleple geldi. Toprak ele geçirmeyi değil, Yugoslav Savunma Birliği üzerinde kontrol sağlayarak şu anda bizim tebaamız olan kuzey Balkan ülkelerinin koruyucusu ve derebeyi olmayı talep ediyorlar. Bizden daha yetenekli bir koruyucu olacaklarını söylüyorlar, ancak bu elbette sadece bir bahane olabilir."
 MUN_czech.1002.t:0 "[FROM.GetNameDefCap], Yugoslav Birliği Üzerinde Nüfuz Talep Ediyor"
 MUN_czech.1003.a:0 "Bize başka seçenek bırakmıyorlar"
 MUN_czech.1003.d:0 "Diplomatlarımızın ikna edici argümanlarına rağmen, [FROM.GetNameDef] taleplerimize boyun eğmeyi reddetti."
 MUN_czech.1003.t:0 "[FROM.GetName] Talepleri Reddediyor"
 MUN_czech.1004.a:0 "Çıkarlarımızı korumalıyız"
 MUN_czech.1004.b:0 "Bunun dışında kalalım"
 MUN_czech.1004.d:0 "[FROM.GetAdjective] birliklerinin [HUN.GetAdjective] sınırına doğru ilerlediği haberi [ROOT.capital.GetCapitalVictoryPointName] konumuna ulaştı. [HUN.GetAdjective] temsilcileri şüphesiz yakında bizimle iletişime geçecek olsalar da, [HUN.GetNameDef] tarafına yardım edip potansiyel bir müttefik mi kazanacağımıza yoksa [FROM.GetNameDef] tarafının mevcut planlarına devam etmesine izin mi vereceğimize şimdiden karar vermeliyiz."
 MUN_czech.1004.t:0 "[FROM.GetName] Macaristan'a Karşı Harekete Geçiyor"
 MUN_czech.1005.d:0 "[FROM.GetNameDef] topraklarını istikrarlı bir şekilde büyütürken, onlardan gelen temsilciler şimdi [FROM.GetAdjective] soylularının bir zamanlar sahip olduğu toprakları onlara devretmemizi talep etmeye geldiler. Bunun onlara Adriyatik'e potansiyel bir erişim sağlayacağını söylüyorlar ve görünüşe göre bu konudaki düşüncelerimizle pek ilgilenmiyorlar."
 MUN_czech.1005.t:0 "[FROM.GetName] Kıyı Bölgesi Talep Ediyor"
 MUN_czech.1006.d:0 "[FROM.GetNameDef], ordularımızın birleşik gücüyle herhangi bir saldırganı caydırmak amacıyla karşılıklı bir savunma antlaşmasıyla bize yaklaştı. Ancak ilginç bir şekilde, antlaşmanın [ROOT.GetAdjective] nüfuzunun potansiyel genişlemesinin ve [FROM.GetNameDef] tarafının nasıl yardımcı olabileceğinin ortaya konduğu gizli bir bölümü de var."
 MUN_czech.1006.t:0 "[FROM.GetName] Ortaklık Öneriyor"
 MUN_czech.1007.b:0 "Egemenliğimizi korumalıyız!"
 MUN_czech.1007.d:0 "Kuruluşlarından bu yana bizimle [FROM.GetNameDef] arasındaki güvensizlik, şimdi uyum sağlamamızı talep etmelerine ya da bir işgali göze almalarına yol açtı. Ancak ilginç bir şekilde, [FROM.GetNameDef] aynı zamanda bölgesel hırslarımıza da hitap ediyor ve kendi topraklarındaki taleplerimizi artık sürdürmememiz karşılığında, talep ettiğimiz diğer toprakları elde etmemize yardımcı olabileceklerine söz veriyor."
 MUN_czech.1007.t:0 "[FROM.GetName] Uyum Talep Ediyor"
 MUN_czech.1008.a:0 "Bize saldırmaya karşı daha fazla caydırıcılık"
 MUN_czech.1008.b:0 "Tüm Avrupa'yı savunmamız beklenemez"
 MUN_czech.1008.d:0 "Orta Avrupa'ya köprümüz olan [FROM.GetNameDef] temsilcileri, [CZE_invited_country.GetName] yönetimini davet ederek ittifakımızı genişletmeyi önerdi."
 MUN_czech.1008.t:0 "[FROM.GetName], [CZE_invited_country.GetName] İle İttifak Öneriyor"
 MUN_czech.1009.a:0 "Yeni müttefikimizin şerefine!"
 MUN_czech.1009.b:0 "Taleplerimiz tanındıktan sonra katılacağız"
 MUN_czech.1009.c:0 "İlgilenmiyoruz"
 MUN_czech.1009.d:0 "[FROM.GetNameDef] diplomatları, ittifaklarında memnuniyetle karşılanacağımızı ilettiler. Ancak geçmişte, bölgesel taleplerimiz [FROM.GetNameDef] ile ilişkilerimizde bir tartışma konusuydu. Şimdi bu taleplerde ısrar etmeye devam edip etmeyeceğimize veya daha dostane ilişkiler kurmaya odaklanıp odaklanmayacağımıza karar vermeliyiz."
 MUN_czech.1009.t:0 "[FROM.GetName] Bizi [CZE.GetFactionName] İttifakına Davet Ediyor"
 MUN_czech.1010.a:0 "Değerli müttefikler olurlar"
 MUN_czech.1010.b:0 "[ROOT.GetNameDef] yönetimini korumak yeterlidir"
 MUN_czech.1010.d:0 "Kısa süre önce Küçük Antant anlaşmalarını gerçek bir ittifaka dönüştürmeye çalıştıktan sonra, [FROM.GetNameDef] bir teklifle geldi: bu yeni fraksiyona liderlik etmemizi istiyorlar. Liderlikten feragat edecekler ve karşılığında bizi değerli bir koruyucu olarak kazanacaklar; etki alanımızı genişletecek ama potansiyel olarak tehdit altındaki ulusları da kapsayacak bir anlaşma."
 MUN_czech.1010.t:0 "[FROM.GetName] Bizi [CZE.GetFactionName] Liderliğine Davet Ediyor"
 MUN_czech.1011.a:0 "Bu riske değer"
 MUN_czech.1011.b:0 "Tarafsızlık daha güvenlidir"
 MUN_czech.1011.d:0 "[FROM.GetNameDef] tarafına yönelik herhangi bir saldırganlığı caydırma çabasının bir parçası olarak, diplomatları bize karşılıklı bir savunma antlaşması taslağıyla yaklaştı. Desteğimiz karşılığında bize aynı korumayı teklif edecekler ve herhangi bir saldırganı iki cepheli bir savaşa zorlayacaklar."
 MUN_czech.1011.t:0 "[FROM.GetName] Koruma Anlaşması Öneriyor"
 MUN_czech.1012.a:0 "Direniş [ROOT.GetAdjective] hayatlarını boşa harcar"
 MUN_czech.1012.b:0 "Onursuzluktan önce ölüm!"
 MUN_czech.1012.d:0 "Yeni kurulan ittifaklarından cesaret alan [FROM.GetNameDef], egemenliğimizin kaybına eşit olacak bir dizi taleple geldi. Bölgedeki çıkarları göz önüne alındığında [SOV.GetName] desteğiyle, şimdi reddetmeyi göze alıp alamayacağımıza karar vermeliyiz."
 MUN_czech.1012.t:0 "[FROM.GetName] Boyun Eğmemizi Talep Ediyor"
 MUN_czech.1013.a:0 "Yapmaya değer bir fedakarlık"
 MUN_czech.1013.b:0 "Topraklarımızı korumaya çalışıyoruz!"
 MUN_czech.1013.d:0 "Dikkatli bir değerlendirmenin ardından, [FROM.GetNameDef] hükümeti bir ittifakın avantajlı olacağı görüşünü paylaştığını, ancak bölgesel taleplerini göz ardı edemeyeceklerini açıkladı. Bu nedenle bir teklifle geldiler: fraksiyonumuza katılacaklar, ancak yalnızca talep ettikleri toprakları onlara devredersek."
 MUN_czech.1013.t:0 "[FROM.GetName] Koşullu İttifak Teklif Ediyor"
 MUN_czech.1014.a:0 "Belki de müttefikimizi korumaya çalışmalıyız"
 MUN_czech.1014.b:0 "Belirsiz vaatler düzeyinde tutalım"
 MUN_czech.1014.d:0 "[FROM.GetNameDef] yönetiminden etkili diplomatlar dışişleri bakanına başvurarak 1935 Çekoslovak-Sovyet antlaşmasında belirtilen belirsiz koruma vaatlerini somutlaştırmamızı talep ettiler."
 MUN_czech.1014.t:0 "[FROM.GetName] Koruma Talep Ediyor"
 MUN_czech.1015.a:0 "Koordineli bir çaba hayat kurtarır"
 MUN_czech.1015.b:0 "Kontrol bizde olmalı"
 MUN_czech.1015.d:0 "Artık aynı düşmanlara sahip olduğumuz için [FROM.GetName], fraksiyonumuzu onlarınkine entegre ederek işbirliğimizi derinleştirecek bir teklifle bize geldi."
 MUN_czech.1015.t:0 "[FROM.GetName] Fraksiyonlarımızı Birleştirmeyi Öneriyor"
 MUN_czech.1016.a:0 "Korunacak bir sınır daha azaldı"
 MUN_czech.1016.b:0 "Bu hırslarımızın önüne geçecek"
 MUN_czech.1016.d:0 "Dış politika planlarındaki bir değişikliğin ardından iptal edilen önceki görüşmeler temelinde devam eden [FROM.GetNameDef], bir saldırmazlık paktı üzerindeki görüşmelere devam etmeyi önerdi."
 MUN_czech.1016.t:0 "[FROM.GetName] Saldırmazlık Paktı Öneriyor"
 MUN_czech.1017.a:0 "Onlarla birlikte [GER.GetNameDef] yönetimini vuracağız"
 MUN_czech.1017.b:0 "Bu çok tehlikeli"
 MUN_czech.1017.d:0 "[FROM.GetNameDef], [GER.GetNameDef] yönetimini işgal etmek için gizli planlarla üst düzey [ROOT.GetAdjective] yetkililerine başvurdu. [GER.GetAdjective] tehdidini ortadan kaldırmaya ne kadar kararlı olduklarını gösterdikten sonra, güçlü [GER.GetAdjective] ordusunu birlikte alt etmek için yardım etmemizi istediler."
 MUN_czech.1017.t:0 "[GER.GetNameDef] Üzerine Ortak Bir İşgal mi?"
 MUN_czech.1018.a:0 "Bunu asla beklemeyecekler"
 MUN_czech.1018.b:0 "Geriye dönüp bakıldığında, çok riskli"
 MUN_czech.1018.d:0 "En iyi diplomatik çabalarımıza rağmen, [GER.GetName] üzerine önleyici bir işgal için herhangi bir dış destek toplayamadık; şimdi asıl soru, saldırı planlarımızı tamamen uygulayıp uygulamayacağımızdır."
 MUN_czech.1018.d.FRA:0 "Diplomatlarımız, [FRA.GetNameDef] yönetiminden [GER.GetNameDef] üzerine ortak bir işgalde yer almaya istekli olacakları harika haberiyle döndüler, şimdi birleşik güçlerimizin yeterli olup olmayacağını değerlendirmeliyiz."
 MUN_czech.1018.d.FRA_POL:0 "Hem [FRA.GetNameDef] hem de [POL.GetNameDef] tarafından harika haberler geldi, diplomatlarımız her iki ulusun da [GER.GetNameDef] işgalinde bize yardım etmeyi taahhüt ettiğini bildiriyor."
 MUN_czech.1018.d.POL:0 "Diplomatlarımız, [POL.GetNameDef] yönetiminden [GER.GetNameDef] üzerine ortak bir işgalde yer almaya istekli olacakları harika haberiyle döndüler, şimdi birleşik güçlerimizin yeterli olup olmayacağını değerlendirmeliyiz."
 MUN_czech.1018.t:0 "[GER.GetNameDef] Karşısında Tek Başına Savaşmak mı?"
 MUN_czech.1018.t.2:0 "[GER.GetNameDef] Üzerine Ortak Bir İşgal"
 MUN_czech.1019.a:0 "Belki bu bizi güvende tutar"
 MUN_czech.1019.d:0 "Önceki Bohemya sınırlarını geri getirme arzusu ile [72.GetName] üzerindeki kontrollerini meşrulaştırma isteğini öne süren [FROM.GetAdjective] temsilcileri, [762.GetName] bölgesini devretmemizi talep eden bir ültimatom verdiler."
 MUN_czech.1019.t:0 "[FROM.GetName] [762.GetName] Bölgesini Talep Ediyor"
 MUN_czech.1020.a:0 "Harika bir anlaşma!"
 MUN_czech.1020.b:0 "Bu şartlar kabul edilemez"
 MUN_czech.1020.d:0 "[FROM.GetNameDef] tarafından diplomatlar geldi ve bir kaynak anlaşması karşılığında uluslarının sanayimize ve altyapımıza yatırım yapacağı bir anlaşmanın ana hatlarını çizdi. Önceki yıllardaki başarısız yatırımların ardından gelen bu hamle, ilişkilerimizi geliştirmede yenilenmiş bir çaba olduğunu gösteriyor."
 MUN_czech.1020.t:0 "[FROM.GetName] Koşullu Yatırım Teklif Ediyor"
 MUN_czech.1021.a:0 "Daha fazla ticaret cazip geliyor"
 MUN_czech.1021.b:0 "Yerli üreticilerimizi korumalıyız"
 MUN_czech.1021.d:0 "[CZE.GetNameDefCap], eski Avusturya-Macaristan ulusları arasında bir taslak ticaret anlaşmasıyla bize yaklaştı. Bağımsızlıklarından memnun olsalar da, yeni [CZE.GetAdjective] hükümeti özellikle Avusturya-Macaristan ulusunun faydalı unsurlarını geri getirmeye istekli görünüyor."
 MUN_czech.1021.t:0 "Avusturya-Macaristan Gümrük Birliği'nin Dönüşü mü?"
 MUN_czech.1022.a:0 "Müdahale etmeliyiz"
 MUN_czech.1022.b:0 "Bir düşman daha yaratamayız"
 MUN_czech.1022.c:0 "Büyük bir zafer!"
 MUN_czech.1022.d:0 "[69.GetName] dağları çevresindeki şiddetli çatışmalardan sonra, [CZE.GetAdjective] birlikleri sonunda cepheyi yardı ve çatıştıkları birlikler ciddi bir direniş sunacak kadar toparlanamadan tüm Silezya üzerinde kontrol sağladı."
 MUN_czech.1022.t:0 "[CZE.GetName] Silezya'yı Ele Geçiriyor"
 MUN_czech.1023.a:0 "Birlikleri hazırlayın"
 MUN_czech.1023.d:0 "Ortaçağ krallıkları ve imparatorluklarıyla ilgili bazı eskimiş gerekçeleri öne süren [FROM.GetNameDef], [ROOT.GetAdjective] Silezya'sı üzerinde kontrol sağlamak amacıyla sınır çatışmalarını sınırlı bir savaşa dönüştürdü."
 MUN_czech.1023.t:0 "[CZE.GetName] Silezya İçin Mücadeleyi Başlatıyor"
 MUN_czech.1024.a:0 "Belki de diğer alanlara odaklanmalıyız"
 MUN_czech.1024.b:0 "Durum hala bizim lehimize"
 MUN_czech.1024.c:0 "Bu müzakereye açık değil!"
 MUN_czech.1024.d:0 "Silezya'daki sınır çatışmaları tam ölçekli bir savaşa dönüştükten sonra, [FROM.GetNameDef] şimdi talep ettikleri topraklar devredilirse çatışmayı sona erdirme konusundaki istekliliğini belirtti."
 MUN_czech.1024.t:0 "[CZE.GetName] Barış Anlaşması Öneriyor"
 MUN_czech.1025.a:0 "Umarım bu dersleri evimizde uygulamak zorunda kalmayız"
 MUN_czech.1025.d.1:0 "[CZE_supported_spanish_faction.GetName] tarafına gönderilen [ROOT.GetAdjective] birlikleri, zafere ulaşmalarına yardımcı olduktan sonra eve dönüyor. Çatışmalar, birliklerimiz ve özellikle de sağlık müfrezeleri için yeni içgörülere yol açtı."
 MUN_czech.1025.d.2:0 "İspanya İç Savaşı'nda [ROOT.GetAdjective] kuvvetlerinin cesurca savaşmasına rağmen, desteklediğimiz taraf nihayetinde yenildi. Buna rağmen birliklerimiz ve özellikle de sağlık ekipleri değerli dersler aldı."
 MUN_czech.1025.t:0 "İspanyol Gönüllü Görevinin Sonu"
 MUN_czech.1026.a:0 "Onların kaybı"
 MUN_czech.1026.b:0 "Endişe verici bir gelişme"
 MUN_czech.1026.faction_invite:0 "Diplomatlarımız [FROM.GetNameDef] tarafının bizimle bir ittifaktan neden fayda sağlayacağına dair argümanları iletmelerine rağmen, nihayetinde onları aynı çizgiye getirmede başarısız oldular."
 MUN_czech.1026.faction_merge:0 "En iyi çabalarımıza rağmen, bizim diplomatlarımız ve [FROM.GetAdjective] diplomatları, [ROOT.GetFactionName] ve [FROM.GetFactionName] fraksiyonlarını birleştirme konusunda anlaşmaya varamadılar."
 MUN_czech.1026.france_refuses_to_lead:0 "İttifakımıza katılmaları karşılığında [FROM.GetAdjective] hükümetine teklif edilen liderlik rolüne rağmen, bunu yapmamaya karar verdiler. Görünüşe göre [FROM.GetAdjective] hükümeti tarafsız kalmaya çalışıyor veya zaman kazanıyor."
 MUN_czech.1026.guarantee:0 "Diplomatlarımız, çabalarına rağmen [FROM.GetNameDef] tarafının karşılıklı savunma antlaşması teklifimizi kabul etmediğini bildiriyor. Görünüşe göre onlardan daha fazla risk altında olduğumuzu tahmin ediyorlar, umalım ki yanılıyor olsunlar."
 MUN_czech.1026.non_aggression:0 "Barışçıl niyetlerine dair güvencelere rağmen, [FROM.GetAdjective] diplomatları ulusumuzla bir saldırmazlık paktı imzalamayı reddettiler, nedenini göreceğiz."
 MUN_czech.1026.sphere_of_influence:0 "[FROM.GetAdjective] hükümet üyeleri, [ROOT.GetFactionName] içerisine katılımımızın takdir edildiğine dair bize güvence vermelerine rağmen, etki alanımızı Balkanlar'a genişletmenin çok ileri gideceğini ve potansiyel müttefikleri korkutabileceğini söylediler."
 MUN_czech.1026.t:0 "[FROM.GetName] Teklifi Reddediyor"
 MUN_czech.1026.trade_deal:0 "Ekonomik olarak bağımsız kalma arzusunu öne süren [FROM.GetNameDef], ticaret anlaşması teklifimizi reddetti."
 MUN_czech.1026.unification:0 "Bir federasyonun getireceği faydaları kabul etmesine rağmen [FROM.GetNameDef], sürgündeki hükümetini kendi toprakları için tek meşru hükümet olarak tutmayı seçti."
 MUN_czech.1026.weapons_sale:0 "Cömert teklifimize rağmen [FROM.GetNameDef], şu anda bizden silah satın almamaya karar verdi."
 MUN_czech.1026.white_peace:0 "Temsilcilerimiz bugün, [66.GetName] bölgesini işgal etmemize rağmen [FROM.GetAdjective] liderliğinin bir barış antlaşması imzalamaya istekli olmadığı gibi üzücü bir haberle döndüler. Görünüşe göre ya fethimizde daha ileri gitmek ya da onları yormayı ummak zorunda kalacağız."
 MUN_czech.1027.a:0 "Lanet olası derecede iyi bir anlaşma."
 MUN_czech.1027.b:0 "Onları bu kaynaklardan mahrum bırakmalıyız."
 MUN_czech.1027.d:0 "Başlangıçtaki ideolojik farklılıklara rağmen, [FROM.GetNameDef] pragmatizmimize hitap ederek bir ticaret anlaşması için bize başvurdu. [FROM.GetAdjective] tarafının [202.GetName] bölgesinde kaynak çıkarmasına izin verilmesi karşılığında, endüstriyel kapasitemizi genişletmek için çok umutsuzca ihtiyaç duyduğumuz makine parçalarını sağlamaya yardımcı olacaklar."
 MUN_czech.1027.t:0 "Bir [FROM.GetAdjective]-[ROOT.GetAdjective] Ticaret Anlaşması Kurulsun mu?"
 MUN_czech.1028.a:0 "Kaybedecek zamanımız yok!"
 MUN_czech.1028.d:0 "Ülke içindeki pek çok kişi artık hükümetin geçen yılın sonlarında başlattığı tahkimat projelerine neden devam etmediğini sorguluyor. Hükümet, Tahkimat Konseyi aracılığıyla ek tahkimat inşası projeleri için fon ayırmıştı. Programda hiçbir ilerleme kaydedilmemesi nedeniyle, halk projenin ya devam ettirilmesini ya da fonlarının iade edilmesini talep ediyor. Tahkimat programlarımıza devam etmek istiyorsak, projelerin zamanında bitirilebilmesi için yeniden başlatılmasında kaybedilecek zamanımız yok."
 MUN_czech.1028.t:0 "Gecikmiş Tahkimat Çabaları"
 MUN_czech.1029.a:0 "Mükemmel iş beyler"
 MUN_czech.1029.d:0 "En son tahkimat projemiz tamamlandı ve başka bir projeye başlamak için kaynaklar mevcut. Mühendislerimiz, yeni bir tahkimat hattının temelini atmaya başlamak üzere bir an önce başka bir yere konuşlanmaya hazırlar."
 MUN_czech.1029.t:0 "Tahkimat Projesi Tamamlandı"
 MUN_czech.1030.a:0 "Belki de o kadar kötü olmazdı"
 MUN_czech.1030.b:0 "Pek inandırıcı değil"
 MUN_czech.1030.d:0 "[FROM.GetNameDefCap], onu genişletmeye çalışırken birliklerinin bir parçası olmamızı talep etti. Bölgedeki çeşitli ülkelere Panslavizm, Panbalkanizm ve diğerleri için Avusturya-Macaristan imparatorluğundaki ortak tarih gibi çok çeşitli farklı nedenlerle hitap etseler de, bu çağrı aynı zamanda reddetmemiz halinde açık bir zımni tehdit ile birlikte geliyor."
 MUN_czech.1030.t:0 "[FROM.GetName] Entegrasyon Talep Ediyor"
 MUN_czech.1031.a:0 "Birlikte anavatanlarımızı daha iyi koruyabiliriz"
 MUN_czech.1031.b:0 "Farklılıklarımız çok büyük"
 MUN_czech.1031.d:0 "[ROOT.GetNameDef] teslim olmasına rağmen, [FROM.GetAdjective] hükümeti savaşmaya devam etmemizi sağlayacak sert bir teklifle geldi: ulusumuzdan geriye kalanları onlarnkiyle birleştirmek."
 MUN_czech.1031.t:0 "[FROM.GetName] Birlik Öneriyor"
 MUN_czech.1032.a:0 "Hadi tekrar işe koyulalım"
 MUN_czech.1032.d:0 "[FROM.getname] bölgesindeki sorunları çözmeye yönelik son çabalar, en azından şimdilik, merkezi hükümete yönelik öfkeyi hafifletmede başarılı oldu. Hükümetimizin kaynakları artık ülkemizi bölen sorunlarla mücadele etmeye devam edecek diğer sosyal veya ekonomik programlara ayrılmak üzere serbest bırakıldı."
 MUN_czech.1032.t:0 "Uçurumu Kapatmak"
 MUN_czech.1033.a:0 "[GER.GetAdjective] güçlerine karşı başka bir müttefik"
 MUN_czech.1033.b:0 "Meşru değiller"
 MUN_czech.1033.d:0 "$CZE_edvard_benesh$ liderliğindeki Sürgündeki [FROM.GetAdjective] Hükümeti, [CZE.GetNonIdeologyName] egemenliğini yeniden kazanma mücadelesinde heyetlerini ağırlamamızı talep ediyor."
 MUN_czech.1033.t:0 "Sürgündeki [FROM.GetAdjective] Hükümeti Tanınma Talep Ediyor"
 MUN_czech.1034.a:0 "Orduyu Slovakya'ya gönder!"
 MUN_czech.1034.b:0 "Onları tutukla ama biraz özerklik ver"
 MUN_czech.1034.c:0 "Doğrudan kontrolü al"
 MUN_czech.1034.c_tt:0 "§RÇekoslovakya'nın kaderiyle ilgili [GER.GetNameDef]'nin kararına kalacağız.§!"
 MUN_czech.1034.d:0 "Diğer grupların milliyetçi duygularına boyun eğmemiz nedeniyle, Slovak Halk Partisi üyeleri artık kendi bağımsızlığını veya en azından Slovakya için özerklik arayan kendi paramiliter güçlerini oluşturdular. Şimdi asıl soru, bunu engelleyerek birlik görünümünü korumaya mı odaklanacağımız, yoksa buna izin vererek bunu başarıp hükümete sadık topraklara mı odaklanacağımızdır."
 MUN_czech.1034.t:0 "Slovakya'da Huzursuzluk"
 MUN_czech.1035.a:0 "Bu, daha az mükerrer çaba anlamına gelir"
 MUN_czech.1035.b:0 "Ordumuzu yabancı teçhizat bağımlısı yapamayız"
 MUN_czech.1035.d:0 "[CZE.GetNameDef] ile ayrılmaz ortaklığımız, benzersiz bir anlaşma teklif etmelerine yol açtı: şu anda yurtiçinde ürettiğimiz silahları elbette bir bedel karşılığında bizim için üretecekler. Bu da endüstrimizin diğer sektörlerine odaklanmamızı sağlayacak."
 MUN_czech.1035.t:0 "[FROM.GetName] Bizim İçin Silah Üretmeyi Teklif Ediyor"
 MUN_czech.1036.a:0 "Ulusumuzu iyileştirmeliyiz"
 MUN_czech.1036.d:0 "Büyük Buhran ulusumuza ekonomik veya siyasi olarak hiçbir iyilik yapmadı. Birçok bölgesel ekonomik ve siyasi sorun yakamızı bırakmıyor ve Büyük Buhran'dan mucizevi bir şekilde kurtulmamıza rağmen giderek kötüleşiyor gibi görünüyorlar. Ulusumuzu daha fazla bölmeden önce bu sorunları ele almalıyız."
 MUN_czech.1037.a:0 "Planlarımız iptal edilmelidir"
 MUN_czech.1037.b:0 "Bu hiçbir şeyi değiştirmez"
 MUN_czech.1037.d:0 "Ülkemizde [HUN.GetNameDef] tarafına yönelik apaçık savaş haklılaştırmasını fark ettikten sonra, [GER.GetAdjective] temsilcileri [HUN.GetAdjective] tarafıyla savaşa girmenin [GER.GetNameDef] ile de savaş anlamına geleceğini açıkça belirttiler. Şimdi devam edip etmemek bize bağlı."
 MUN_czech.1037.t:0 "[GER.GetName] [HUN.GetName] Yönetimini Koruyor"
 MUN_czech.1038.a:0 "Kulağa iyi bir anlaşma gibi geliyor"
 MUN_czech.1038.d:0 "[FROM.GetAdjective] hükümetinden temsilciler ve silah şirketleri bize bir silah satışı teklifiyle yaklaştılar. Fiyat oldukça normal görünüyor ve [FROM.GetNameDef] aynı zamanda çok modern olan bazı silahlar da sunuyor."
 MUN_czech.1038.t.1:0 "[FROM.GetName] Tank Tasarımlarının Lisansını Teklif Ediyor"
 MUN_czech.1038.t.2:0 "[FROM.GetName] Silah Satmayı Teklif Ediyor"
 MUN_czech.1038.t.3:0 "[FROM.GetName] Topçu Satmayı Teklif Ediyor"
 MUN_czech.1038.t.4:0 "[FROM.GetName] Hafif Tanklar Satmayı Teklif Ediyor"
 MUN_czech.1038.t.5:0 "[FROM.GetName] Avcı Uçakları Satmayı Teklif Ediyor"
 MUN_czech.1039.a:0 "Buna bir bakacağız"
 MUN_czech.1039.d:0 "[SLO.getname] bölgesine verdiğimiz Özerklik Anlaşması ışığında, $RUT_augustin_voloshyn$ kendi bölgesinin de bizimle aynı türde bir federalleşme anlaşmasına sahip olup olamayacağını sordu. Bu saçma görünüyor ama koşullar göz önüne alındığında, bu talepleri olduğu gibi kabul etmek zorundayız."
 MUN_czech.1039.t:0 "[RUT.getname] Özerklik Anlaşması İstiyor"
 MUN_czech.1040.a:0 "Zararsız görünüyor"
 MUN_czech.1040.b:0 "Buna güvenilemez"
 MUN_czech.1040.d:0 "[CZE.getnameDEFCAP] yakın zamanda iki ulusumuz arasındaki bir gümrük birliği ile ilgili diplomatik görüşmeleri yeniden gündeme getirdi. Vurmaya çalıştıkları anlaşma adil görünüyor, ancak daha sonra hazırlıklı olmayabileceğimiz başka talepleri içerebilir. Bu antlaşma ve ticareti yapılan şeyler önemsiz ve sembolik görünüyor, bu nedenle onu imzalamakta bir zarar olmayacaktır."
 MUN_czech.1040.t:0 "[CZE.getname] bize bir Gümrük Birliği Antlaşması öneriyor"
 MUN_czech.1041.a:0 "Hayal kırıklığı"
 MUN_czech.1041.d:0 "Bu antlaşmanın ekonomilerini nasıl altüst edebileceğine dair bazı nedenleri öne süren [From.getname], iki ulusumuz arasındaki gümrük birliği antlaşmasını imzalamayı reddetti. Bu nedenler değersiz ve asılsız bahaneler gibi görünüyor."
 MUN_czech.1041.t:0 "[FROM.getname] Gümrük Birliği Antlaşmasını Reddediyor"
 MUN_czech.1042.a:0 "Mükemmel"
 MUN_czech.1042.d:0 "Antlaşmanın tatmin edici olduğunu gören [FROM.getname] şartları kabul etti. Umuyoruz ki bu, iki ulusumuz arasında daha yakın bağlar kurma yolundaki ilk adımdır."
 MUN_czech.1042.t:0 "[FROM.getname] Gümrük Birliği Antlaşmasını Kabul Ediyor"
 MUN_czech.1043.a:0 "Kabul ediyoruz"
 MUN_czech.1043.b:0 "Korkunç bir fikir"
 MUN_czech.1043.d:0 "İki ulusumuz arasındaki daha yakın bağları ve dünya çapındaki son gelişmeleri öne süren [FROM.getname], tek başımıza olmaktansa onların koruması altında olmanın daha iyi olacağını söyledi. Bu sadece topraklarımızı işgal etmeleri için bir hile gibi görünüyor. Ne yapmalıyız?"
 MUN_czech.1043.t:0 "[FROM.getname] Federasyonlarına Katılmamızı Talep Ediyor"
 MUN_czech.1044.a:0 "Yazık oldu"
 MUN_czech.1044.b:0 "Başka yollar denemek zorunda kalacağız"
 MUN_czech.1044.d:0 "Bizim altımızda olmaktansa tek başlarına daha iyi olacaklarını gören [FROM.getname] federasyonumuza katılma şansını reddetti. Bu, Avrupa'daki konumumuzu güçlendirme hedefimize indirilmiş bir darbedir. [FROM.getname] aklını başına toplamayacağına göre şimdi ne yapmalıyız?"
 MUN_czech.1044.t:0 "[FROM.getname] Federasyona Katılmayı Reddediyor"
 MUN_czech.1045.a:0 "Mükemmel"
 MUN_czech.1045.d:0 "Tek başlarına olmaktansa bizim himayemizde daha iyi korunacaklarını gören [FROM.getname] akıllıca bir kararla federasyonumuza katıldı. Bu, Avrupa'daki konumumuzu büyük ölçüde güçlendirecektir."
 MUN_czech.1045.t:0 "[FROM.getname] Federasyona Katılmayı Kabul Ediyor"
 MUN_czech.1046.a:0 "Harika haber"
 MUN_czech.1046.d:0 "Ülkemizdeki birçok sorunu ele aldıktan sonra, ulusumuz içindeki gerilimler azalıyor gibi görünüyor. Birçok ekonomik ve sosyal programı bitirdikten sonra şimdi ülkemiz iyileşmeye başlıyor gibi görünüyor."
 MUN_czech.1046.t:0 "Uçurumu İyileştirmek"
 MUN_czech.1048.d:0 "[FROM.GetAdjective] yetkilileri isteksizce bölgesel taleplerimize boyun eğme niyetinde olduklarını bize bildirdiler. [FROM.GetAdjective] birlikleri şimdiden bölgeden çekiliyor."
 MUN_czech.1048.d2:0 "Uzun tartışmalardan sonra yetkililerimiz ve [FROM.GetNameDef] yetkilileri, birliğimizin bir parçası olarak [FROM.GetAdjective] ekonomisinin yeni bir rolü üzerinde başarıyla anlaştılar. Bu düzenlemenin her iki vatandaşımıza da refah getireceği kesindir."
 MUN_czech.1048.d3:0 "Saldırmazlık paktı teklifimiz [FROM.GetAdjective] temsilcileri tarafından anında coşkuyla karşılandı, görünüşe göre hırsları şu anda başka bir yere odaklanmış durumda."
 MUN_czech.1048.d4:0 "Kendilerini ciddi bir tehdit altında bulan [FROM.GetNameDef], uyum taleplerimize boyun eğdi."
 MUN_czech.1048.d5:0 "Uzun tartışmalardan sonra, yetkililerimiz ve [FROM.GetNameDef] yetkilileri, askeri sanayimizin bir bölümünün onlar için teçhizat üretmeye adanacağı bir anlaşmaya başarıyla ulaştılar. Karşılığında piyasalarımız ve üretimimiz için ticari mallar alacağız."
 MUN_czech.1048.t:0 "[FROM.GetName] Talepleri Kabul Ediyor"
 MUN_czech.1048.t2:0 "[FROM.GetName] Teklifi Kabul Ediyor"
 MUN_czech.1049.d:0 "[FROM.GetNameDef] yeni hükümeti bize bir ittifak önerisiyle yaklaştı. Yeni askeri hükümetlerinin başlangıçtaki Alman karşıtı tutumuna rağmen, pragmatik davrandıkları ve eski uluslararası ortaklarının güvenilmez olduğunu anladıkları görülüyor."
 MUN_czech.1050.a:0 "O zaman belki daha uygun şartlar sunmalıyız"
 MUN_czech.1050.b:0 "Daha iyi müttefikler arayalım"
 MUN_czech.1050.d:0 "Diplomatlarımız [FROM.GetNameDef] tarafından, ittifaklarına katılma talebimizin reddedildiği şeklindeki hayal kırıklığı yaratan bir haberle döndüler. Nedenleri belirsiz olsa da, yeni bir müttefik edinemeden geleneksel müttefiklerimizle ilgili endişelerimizi açığa çıkardığımız zor bir durumdayız."
 MUN_czech.1051.a:0 "Kilit [FROM.GetAdjective] müttefikimizi güçlendirmeliyiz"
 MUN_czech.1051.d:0 "Yeni müttefikimiz [FROM.GetNameDef] sınırları ötesindeki nüfuzunu genişletmekle ilgilendiğini ifade etti. Sonuç olarak, [FROM.GetAdjective] temsilcileri, [ROOT.GetAdjective] ve [FROM.GetAdjective] etkisi altındaki alanlar arasında net bir sınırın belirleneceği bu genişleme için izin ve destek istemeye geldiler."
 MUN_czech.1051.t:0 "[FROM.GetName] Etki Alanı Talep Ediyor"
 MUN_czech.1052.a:0 "Onların mücadelesi bizi de koruyacaktır"
 MUN_czech.1052.d:0 "[FROM.GetNameDef] ve [SOV.GetNameDef] arasındaki yeni diplomatik anlaşmanın ardından, [FROM.GetNameDef] bir çatışma durumunda [SOV.GetNameDef] tarafının kendilerini koruyacağından emin. Tek engel ikisi arasındaki kara bağlantısının olmaması, sonuç olarak [FROM.GetAdjective] diplomatlar, bir çatışma çıkması durumunda [SOV.GetAdjective] birliklerinin topraklarımız üzerinden [FROM.GetNameDef] bölgesine geçişine izin vermemiz talebiyle hükümetimize başvurdular."
 MUN_czech.1052.t:0 "[FROM.GetName], [SOV.GetAdjective] Birlikleri İçin Geçiş İzni İstiyor"
 MUN_czech.1053.d:0 "[HUN.GetNameDef] devletini bir kukla devlete dönüştürdükten sonra, [FROM.GetNameDef] şimdi bizim de aynı kaderi kabul etmemizi talep ediyor. Reddetmemiz halinde, [ROM.GetAdjective] toprakları üzerindeki [HUN.GetAdjective] taleplerini destekleyecekleri tehdidinde bulunuyorlar. Şimdi egemenliğimizi kaybetmek ya da toprak bütünlüğümüzden potansiyel olarak taviz vermek arasında bir seçim yapmalıyız."
 MUN_czech.1053.t:0 "[FROM.GetName], [HUN.GetAdjective] Talepleriyle Bize Baskı Yapıyor"
 MUN_czech.1054.a:0 "Başkalarının genişlemesine direnmek için genişlemeliyiz"
 MUN_czech.1054.d:0 "Daha önce kararlaştırıldığı üzere, [FROM.GetNameDef] milletimizi güçlendirmeye yardımcı olacak bir teklifle geldi. Yani [LIT.GetNameDef] ile zorla birleşerek, bu bize ek kaynaklara erişim sağlayacak ve düşmanın [LIT.GetNameDef] üzerinden bize saldırma olasılığını engelleyecektir."
 MUN_czech.1054.t:0 "[LIT.GetName] Bölgesine Ortak İstila?"
 MUN_czech.1055.d:0 "Eşi benzeri görülmemiş bir hava lojistiği başarısıyla [SOV.GetNameDef], mevcut muharebe çabalarımızı desteklemek için birkaç gönüllü tümenini [73.GetName] üzerindeki havalimanımıza konuşlandırmak için hava kuvvetlerini kullandı."
 MUN_czech.1055.t:0 "[SOV.GetAdjective] Gönüllüleri Geldi"
 MUN_czech.1056.d:0 "Tıpkı Büyük Savaş'tan sonra Paris Barış Konferansı'nda bir zamanlar teklif edildiği gibi, [CZE.GetNameDef], müttefiki [YUG.GetNameDef] ile bir koridorun İttifak güvenliği için gerekli olduğunu duyurdu. Bu amaca ulaşmak için, [FROM.GetAdjective] temsilcileri [975.GetName] bölgesini terk etmemizi talep eden bir ültimatom sundu."
 MUN_czech.1056.t:0 "[FROM.GetName] , [975.GetName] Bölgesini Talep Ediyor"
 MUN_czech.2.a:0 "Elbette yardım edeceğiz"
 MUN_czech.2.b:0 "Onlara daha fazla cesaret vermemek daha iyi olabilir"
 MUN_czech.2.d.1:0 "[CZE.getname] üzerindeki emellerimize dair son haberlerin ışığında, birçok Südetler siyasi partisi, [CZE.GetAdjective] hükümetinin altını oymak umuduyla bölgenin her yerinde hızla paramiliter güçler oluşturdu. Şimdi [CZE.getname] karşısındaki kendi çabalarımıza yardımcı olmak amacıyla sınır ötesi baskınlar düzenlemek ve sabotaj eylemleri gerçekleştirmek için desteğimizi istiyorlar."
 MUN_czech.2.d.2:0 "[CZE.getname] üzerindeki emellerimize dair son haberlerin ışığında, Südetler siyasi partileri kendi paramiliter güçleri olan Südetler Serbest Kolordusu'nu hızla seferber etti. Südetler genelindeki Serbest Kolordu birimleri oluşturuldu ve Südetler'deki [CZE.GetAdjective] hükümet binalarına saldırmaya başladı. Şimdi sınır ötesi baskınlar düzenlemelerine ve [CZE.getname] karşısında sabotaj eylemleri gerçekleştirmelerine yardımcı olmamız için tam desteğimizi istiyorlar."
 MUN_czech.2.d.3:0 "[CZE.getname] üzerindeki emellerimize dair son haberlerin ışığında, yerel komünist partiler hızla işçi milislerini seferber etti. Bu işçi milisleri bölgedeki [CZE.GetAdjective] hükümet binalarına saldırmaya başladı. Şimdi sınır ötesi baskınlar düzenlemelerine ve [CZE.getname] ile diğer karşı devrimcilere karşı sabotaj eylemleri gerçekleştirmelerine yardımcı olmamız için tam desteğimizi istiyorlar."
 MUN_czech.2.t.1:0 "Südetler Paramiliterleri yardım istiyor"
 MUN_czech.2.t.2:0 "Südetler Serbest Kolordusu yardım istiyor"
 MUN_czech.2.t.3:0 "Südetler İşçi Milisleri yardım istiyor"
 MUN_czech.3.a:0 "Bu daha ne kadar kötüye gidebilir ki?"
 MUN_czech.3.d:0 "Südetler'i ilhak etmeye yönelik son [FROM.getname] ilgisinin ardından, paramiliter güçler bize karşı çatışmalara girmeye başladı. Hükümet binalarına saldırmaya başladılar ve birkaç bölgede savunmamızın altını oyuyorlar. Bölgedeki askeri durumumuzu iyileştirmeyi umuyorsak, bu paramiliter gruplarla ilgilenmemiz gerekiyor."
 MUN_czech.3.t:0 "Südetler Partizan Faaliyeti"
 MUN_czech.4.a:0 "Sana her zamankinden daha fazla ihtiyacımız var."
 MUN_czech.4.b:0 "Soğukkanlılığımızı kaybetmemeliyız."
 MUN_czech.4.d:0 "Bize karşı gerçekleştirilen askeri saldırganlığa dair son haberler hükümeti derinden sarstı. [CZE.GetLeader], hükümetinin ülkeyi bu krizden çıkarma yeteneğine olan inancını kaybetti. $CZE_jan_syrovy$'nin duruma el koymasını ve ülkeyi yönetmesini talep etti. $CZE_jan_syrovy$ liderlik etme konusunda isteksiz olduğunu söyledi, ancak bunun ışığında [CZE.GetLeader] ona yönetimi devralmaktan ve bizi bu krizden çıkarmaktan başka seçeneği olmadığını söyledi."
 MUN_czech.4.t:0 "Güven Krizi"
 MUN_czech.5.a:0 "Yeri doldurulamaz bir siyasi dev."
 MUN_czech.5.d:0 "Masaryk, yirmi yılı aşkın bir süre boyunca Çekoslovak siyasetinde istikrar sağlayıcı bir figürdü. Koalisyonların kurulamayacağı ve siyasi çıkmazların aşılamayacak kadar büyük olduğu düşünüldüğünde, Masaryk defalarca siyasi mucizeler yaratarak Çekoslovakya'nın güçlenmesine ve bugünkü haline gelmesine yardımcı oldu. Yokluğu çok aranacak ve tüm ulus tarafından hissedilecek."
 MUN_czech.5.t:0 "Tomáš Masaryk Hayatını Kaybetti"
 MUN_czech.7.a:0 "Dostlarımızın yanındayız"
 MUN_czech.7.b:0 "[GER.getnamedef] karşısında hiç şansımız olmazdı"
 MUN_czech.7.d:0 "Kısa süre önce [GER.getnamedef] yönetiminin Südetler'i ilhak etmek istediği ve bu amaca ulaşmak için [CZE.getnamedef] ile savaşa girmeye istekli olacağı haberi bize ulaştı. Şu anda [CZE.getnamedef] ile bir savunma anlaşmamız var, bu da [GER.getnamedef] ile savaşa girerlerse yardımlarına gitmek zorunda kalacağımız anlamına geliyor. Bu sonuçtan kaçınmak istiyorsak, [CZE.getnamedef] ile olan savunma anlaşmalarımızdan derhal çıkmalıyız."
 MUN_czech.7.t:0 "[CZE.getnamedef] İçin Verilen Taahhütleri Yeniden Değerlendirmek"
 MUN_czech.news.1.a:0 "Bu Avrupa için hayra alamet değil."
 MUN_czech.news.1.b:0 "Kaos bir merdivendir."
 MUN_czech.news.1.c:0 "Galip geleceğiz!"
 MUN_czech.news.1.d:0 "Umarız diplomasi galip gelir."
 MUN_czech.news.1.desc:0 "Südet bölgesindeki halk [CZE.getnameDef] yönetimine karşı silahlı bir isyan başlattı. Milislerin bölge genelindeki polis karakollarına ve hükümet binalarına saldırmaya başladığına dair raporlar gelmeye başladı. Bu, [FROM.getname] tarafının bölgeyi ilhak etmek istediğine dair son haberlerle tetiklendi.\n\nBu isyanlar [FROM.getname] ve [CZE.GetNameDef] arasında artık kaçınılmaz görünen daha büyük bir çatışmanın habercisi gibi görünüyor."
 MUN_czech.news.1.t:0 "Südet Krizi"
 MUN_czech.news.2.a:0 "Karpatya mı?"
 MUN_czech.news.2.b:0 "Bu kolay olacak."
 MUN_czech.news.2.c:0 "Cüretin varsa gel!"
 MUN_czech.news.2.desc:0 "\n[CZE.getname] içindeki siyasi kaosun ardından yaşanan son olaylar zincirinde, küçük [RUT.getname] bölgesi herhangi bir ülkenin sınırları dışında kalmıştı. Küçük ayrılıkçı devlet daha sonra kendisini bağımsız bir millet ilan etti ve yeni devletini korumaya çalışmak için milisler oluşturmaya başladı.\n\n[FROM.getnamedefcap] uzun süredir bu bölge üzerinde emelleri vardı ve fırsatı değerlendirerek küçük ayrılıkçı devleti derhal istila etti. [RUT.getname] üzerindeki zaferleri pek çok gözlemci için kaçınılmaz bir sonuç gibi görünüyor."
 MUN_czech.news.2.t:0 "[FROM.GetNameDefCap], [RUT.GetNameDef] Bölgesini İstila Ediyor"
 MUN_czech_bop.1.a:0 "Hazır olacağız."
 MUN_czech_bop.1.d:0 "On yılın ilk yarısındaki reform çabaları meyvelerini vermeye başlıyor. Ordu şu anda Avrupa'nın en modern ordularından biri. Yine de bazı siyasetçiler ve birçok endüstriyel holdingin başındakiler arasında bir rehavet duygusu oluşmaya başladı. Eğer ordumuzun en yüksek hazırlık seviyesinde kalmasını istiyorsak, ordumuzun muharebe yeteneğine dair olası şüphelere ve onu kendi kişisel çıkarları için baltalamaya çalışanlara karşı mücadele etmeliyiz."
 MUN_czech_bop.1.t:0 "Armada'nın Hazırlığı"
 MUN_czech_bop.2.a:0 "Hazırlıklı olacağız."
 MUN_czech_bop.2.a_tt:0 "Komşularımızın yeniden silahlanma çabaları, ordumuzdaki bazılarının olası saldırganlığa karşı koyma yeteneğimizden şüphe duymasına neden oldu. Ordumuza eylemlerimizle güvence vermeliyiz."
 MUN_czech_bop.2.d.1:0 "[GER.getnameDEFcap]'in son zamanlarda Rhineland'i yeniden askerileştirmesi bazı askeri ve siyasi liderlerimizi korkuttu. Pek çok kişi ülkenin kurduğu ittifaklara ve ordunun bir Alman tehdidi olasılığına karşı yürüttüğü hazırlıklara güvense de; bazıları herhangi bir [GER.GetAdjective] tehdidine karşı durabileceğimizden o kadar emin değil."
 MUN_czech_bop.2.d.2:0 "Bazı komşularımızın ordularını büyük ölçüde genişletmek için programlar üstlendikleri yönündeki son haberler, bazı askeri ve siyasi liderlerimizi korkuttu. Pek çok kişi, ülkenin diğer milletlerle yaptığı ittifaklara ve ordunun herhangi bir dış tehdit olasılığına karşı şu anda yapmakta olduğu hazırlıklara güveniyor. Ancak bazıları, yabancı saldırganlık olasılığına karşı koyabileceğimizden o kadar emin değil."
 MUN_czech_bop.2.t.1:0 "Alman Silahlanma Tehdidi"
 MUN_czech_bop.2.t.2:0 "Komşu Ülkelerin Askeri Genişlemesi"
 MUN_czech_bop.3.a:0 "Bunun nereye varacağını görelim."
 MUN_czech_bop.3.b:0 "Gözlem yapmaktan fazlasına izin veremeyiz."
 MUN_czech_bop.3.d:0 "[CZE.getname] kısa süre önce devam eden çatışmayı gözlemlemek üzere ülkemize kişiler gönderdi. Aynı zamanda küçük teçhizat üreticilerinden biri, kendilerinden teçhizat satın almak isteyip istemeyeceğimizi merak ederek ikincil kanallar aracılığıyla bazı diplomatlarımızla temasa geçti. Bu, üzerimize konulan kısıtlamalar nedeniyle ülkemize silah kaçakçılığı yapılmasını gerektirecektir."
 MUN_czech_bop.3.t:0 "[CZE.getname] Ülkemize Gözlemciler Gönderdi"
 MUN_czech_bop.4.a:0 "Hadi yapalım"
 MUN_czech_bop.4.b:0 "Olası tepkilere değmez"
 MUN_czech_bop.4.d:0 "[ETH.getname], $CZE_zbrojovka_brno_organization$ silah üreticisinin temsilcileriyle temasa geçti ve silahlarımızı ülkeye kaçırmakla ilgileniyor. Milletler Cemiyeti'nin [ETH.GetNameDef] aleyhindeki yaptırımlarına rağmen, $CZE_zbrojovka_brno_organization$ bu planı gerçekleştirmeye istekli. Yakalanırsak Milletler Cemiyeti görevini ihlal etmek uluslararası alanda popüler olmadığını kanıtlayacaktır."
 MUN_czech_bop.4.t:0 "$CZE_zbrojovka_brno_organization$ Şeması"
 MUN_czech_bop.5.a:0 "Bunları iyi bir şekilde kullanacağız."
 MUN_czech_bop.5.d:0 "Çek hükümetinin temsilcileriyle görüşen $CZE_zbrojovka_brno_organization$, ülkeye az miktarda hafif silah kaçırmaya başlamak için gizli bir onay aldı. Onların uzmanlığı da arka kanallarımız aracılığıyla bize sunulacak."
 MUN_czech_bop.5.t:0 "$CZE_zbrojovka_brno_organization$ Kaçakçılık Planını Kabul Etti"
 MUN_czech_bop_3_tt:0 "§Y[CZE.getname]§! Silah Üreticisi §Y$CZE_zbrojovka_brno_organization$§! bize silah kaçırmaya çalışabilir."
 MUN_czech_bop_5_tt:0 "Bu §YÜretici§!, savaş sona erdikten sonra §RKaldırılacaktır§!."
 MUN_czech_exile.1.a:0 "Hoş geldiler."
 MUN_czech_exile.1.d:0 "Münih Konferansı'nın ardından [GER.GetNameDef] ülkelerini feshettiğinde, [CZE.GetAdjective] sürgünleri bizimki de dahil olmak üzere birçok ülkeye ulaştı. Günün birinde bizim yardımımızla ülkelerini özgürleştirebilmek umuduyla bize yardım etmek için silah kuşanmaya istekliler."
 MUN_czech_exile.1.t:0 "[CZE.GetAdjective] Sürgünleri [ROOT.GetNameDef] Bölgesine Ulaşıyor"
 MUN_czech_skoda_priority.1.a:0 "İlginç"
 MUN_czech_skoda_priority.d:0 "Škoda Fabrikaları şirketi toplardan tanklara, trenlere ve deniz toplarına kadar geniş bir ürün yelpazesi üretiyor. Bu, kaynakları talebin en yüksek olduğu yere kaydırarak büyük bir çok yönlülük sağlıyor ve biz artık bunu kısmen yönlendirebiliriz."
 MUN_czech_skoda_priority.t:0 "Škoda Fabrikaları"
 MUN_slovakia.news.1.a:0 "Hırçın Çocuklar."
 MUN_slovakia.news.1.b:0 "Görev için Hazırlıklıyız."
 MUN_slovakia.news.1.desc:0 "$GER_first_vienna_award$ sonrasında [664.Getname] bölgesini geri almasına rağmen, [HUN.getnamedef] hala [71.Getname] bölgesindeki [SLO.getnamedef] sınırında ek düzenlemeler yapmak istiyor.\n\nBu çatışma [HUN.getnamedef] için, ordusunun çok daha zayıf bir muhalefete karşı ne kadar güçlü olduğunu test etmek için bir bahane gibi görünüyor. [SLO.getnamedef] tarafının genç ordusu önlerindeki zorlukla karşılaşmaya hazır olmayabilir."
 MUN_slovakia.news.1.t:0 "[71.Getname] Bölgesinde Sınır Çatışmaları"
 MUN_slovakia_little_war.1.a:0 "Mükemmel iş."
 MUN_slovakia_little_war.1.d:0 "Ordumuz [71.Getname] bölgesindeki düşman kuvvetlerini yenerek iyi bir performans sergiledi. Komutanlarımız savaştan, ileride kullanabilecekleri paha biçilemez bilgiler ve dersler öğrendiler."
 MUN_slovakia_little_war.1.t:0 "[71.Getname] Bölgesinde Zafer"
 MUN_slovakia_little_war.2.a:0 "Hayal kırıklığı yaratan performans."
 MUN_slovakia_little_war.2.d:0 "Tüm çabalarımıza rağmen kuvvetlerimiz [71.Getname] bölgesinde yenilgiye uğradı. Çatışma için yeterli mühimmat ve motorlu teçhizatı zamanında toplayamamak kaybımızda kilit bir faktör oldu. Bu aksiliğe rağmen, muharebeye katılan komutanlar çok önemli dersler öğrendiler."
 MUN_slovakia_little_war.2.t:0 "[71.Getname] Bölgesinde Yenilgi"
 MUN_slovakia_little_war.3.a:0 "Nasıl cüret ederler!"
 MUN_slovakia_little_war.3.d:0 "$GER_first_vienna_award$ ile topraklarımızı geri almamıza rağmen, [HUN.getnamedef] hala [71.getname] bölgesinde bizimle daha fazla sınır düzenlemesi yapmak istiyor. Topraklarımızı savaşmadan teslim etmeyeceğimizi onlara göstermek için bu meydan okumaya güçle karşılık vermeliyiz."
 MUN_slovakia_little_war.3.t:0 "[71.Getname] Bölgesinde Sınır Çatışması"
 MUN_slovakia_little_war.4.a:0 "Hayal kırıklığı."
 MUN_slovakia_little_war.4.d:0 "Tüm çabalarımıza rağmen, kuvvetlerimiz [71.Getname] bölgesindeki çatışmayı kazanamadı. Çatışma için yeterli mühimmat ve motorlu teçhizatı zamanında toplayamamak, zafer elde edemememizde kilit bir faktör oldu. Bu aksiliğe rağmen, muharebeye katılan komutanlar çok önemli dersler öğrendiler."
 MUN_slovakia_little_war.4.t:0 "[71.Getname] Bölgesinde Çıkmaz"
 MUN_the_fall_of_the_republic.1.a:0 "Başka seçeneğimiz yoktu!"
 MUN_the_fall_of_the_republic.1.d:0 "[ROOT.GetLeader]'ın Südet Bölgesi'nden vazgeçme yönündeki son kararı, ülke genelinde protestoların patlak vermesine neden oldu. Siyasi ve askeri liderlik, imkansız görünen ihtimaller karşısında anlamsız bir direniş olarak gördükleri şeyde kan dökülmesini önlemek isterken, ülke genelinde pek çok kişi yanlış karar verdiklerini hissetti. Bazı siyasi hareketler şimdi kendi hedeflerini ilerletmek için kargaşadan yararlanmaya çalışıyor."
 MUN_the_fall_of_the_republic.1.t:0 "Yaygın Protesto Patlaması"
 MUN_the_fall_of_the_republic.2.a:0 "Radikal değişikliklere ihtiyacımız var."
 MUN_the_fall_of_the_republic.2.b:0 "Rotamızı korumalıyız!"
 MUN_the_fall_of_the_republic.2.d:0 "Hükümetin Südet Bölgesi'ni Teslim Etme kararının ardından, ordu ve hükümetteki alt düzey liderlerin büyük bir istifa dalgası ülkemizi bombardımana tuttu. Bu kişilerden bazılarının bir gecede ülkeden kaçtığı bildirildi. Görevlilerin ayrılmasından kaynaklanan kanamayı durdurmak ve liderlik yeteneğimize olan güveni bir nebze olsun geri kazandırmak için hükümetimizde köklü değişiklikler yapılması gerekiyor."
 MUN_the_fall_of_the_republic.2.t.1:0 "Birinci Cumhuriyetin Çöküşü"
 MUN_the_fall_of_the_republic.2.t.2:0 "Hükümet İçinde Kaos"
 MUN_the_fall_of_the_republic.3.a:0 "Tabii, neden olmasın?"
 MUN_the_fall_of_the_republic.3.b:0 "Kesinlikle olmaz!"
 MUN_the_fall_of_the_republic.3.c:0 "Onları serbest bırakın."
 MUN_the_fall_of_the_republic.3.d:0 "Milletimizin başına gelen son siyasi kaosla birlikte, küçük Karpat-Ukrayna bölgesi [9.GetCapitalVictoryPointName] merkezinden daha fazla özerklik istiyor. Bölge ile [ROOT.getname] geri kalanı arasındaki uzun süredir devam eden farklılıklara atıfta bulunuyorlar. Ancak bu talep, yerel liderlerin kendilerini güçlendirmek için bir fırsatı değerlendirmesi gibi görünüyor. Bu talebi reddetmek, harcayacak hiç paramızın olmadığı bir anda çok fazla siyasi sermayeye mal olacaktır."
 MUN_the_fall_of_the_republic.3.t:0 "[RUT.getname] Özerklik İstiyor"
 MUN_the_fall_of_the_republic.4.a:0 "Onlara derhal ültimatomu gönderin!"
 MUN_the_fall_of_the_republic.4.b:0 "Bu riskli olabilir, onları bekleyip görelim."
 MUN_the_fall_of_the_republic.4.d:0 "[CZE.getname] üzerinde yaşanan son kaosun ardından, küçük [RUT.getname] bölgesi herhangi bir ülkenin sınırları dışında kaldı. Küçük bölge bağımsız bir ülke olduğunu iddia ediyor ve komşularına diplomatik açılımlar yapıyor. Hükümetimizdeki pek çok kişi, sınırımızdaki böylesine stratejik öneme sahip bir bölgenin başkasının eline geçmesinden endişe ediyor. Ordu, ayrılıkçı bölgeye derhal ilhaklarını talep eden bir ültimatom verilmesini önerdi."
 MUN_the_fall_of_the_republic.4.t:0 "[RUT.getname] Kaderi"
 MUN_the_fall_of_the_republic.5.a:0 "Sizinle son neferimize kadar muharebe edeceğiz!"
 MUN_the_fall_of_the_republic.5.b:0 "Evet demekten başka seçeneğimiz yok."
 MUN_the_fall_of_the_republic.5.d:0 "Bağımsızlığımızın ardından, komşu bir ülkenin bizi kendi topraklarına katmak istemesi sadece bir zaman meselesiydi. [FROM.getname] bunu yapan ilk ülke gibi görünüyor ve teslim olmamızı talep ediyor. Ne yapmalıyız?"
 MUN_the_fall_of_the_republic.5.t:0 "[FROM.getname] İlhakımızı Talep Ediyor!"
 MUN_the_fall_of_the_republic.6.a:0 "Onları uyarmıştık."
 MUN_the_fall_of_the_republic.6.a_tt:0 "Bu operasyon, [RUT.GetNameDef] müttefikleri olmadığı sürece §Y$HUN_pal_teleki$§! üzerinde bir etki yaratmayacaktır."
 MUN_the_fall_of_the_republic.6.b:0 "Bu geri tepebilir, en iyisi beklemek."
 MUN_the_fall_of_the_republic.6.d:0 "Beklenmedik bir hamleyle [FROM.getname] ültimatomumuzu reddetti ve bunun yerine bize karşı silahlı direnişe başvurmaya çalışıyor. Bize istila etmekten başka seçenek bırakmadılar. Muharebe planları ve saldırı rotaları halihazırda formüle edildi, tek yapmamız gereken saldırı emrini vermek."
 MUN_the_fall_of_the_republic.6.t:0 "[FROM.getname] Ültimatomumuzu Reddetti!"
 MUN_the_fall_of_the_republic.7.a:0 "Mükemmel haber."
 MUN_the_fall_of_the_republic.7.d:0 "Kimse için şaşırtıcı olmayacak şekilde, [FROM.getname] taleplerimizi kabul etti ve bazı önemsiz koşullar karşılığında ülkemize ilhak edilmeye razı oldu. Küçük bölgenin bizimki kadar güçlü bir millete direnme şansı yoktu. Kuzey sınırımız artık eskisinden daha korunaklı ve hükümet elde edilen kolay zaferden dolayı çok memnun."
 MUN_the_fall_of_the_republic.7.t:0 "[FROM.getname] Taleplerimize Boyun Eğdi"
