 form_mountainous_republic:0 "Dağlı Cumhuriyetleri Birleştir"
 form_mountainous_republic_category:0 "Kuzey Kafkasya Dağlı Cumhuriyeti'ni Kur"
 form_mountainous_republic_category_desc:0 "Rus İç Savaşı sırasında, büyük Tapa Tchermoeff, Rus işgalcilerini püskürtmek için Kuzey Kafkasya'da bulunan Cumhuriyetleri ortak bir bayrak altında birleştirmeye çalıştı. Şimdi bir kez daha, Kuzey Kafkasya halkı yabancı güçleri kovmak ve şanlarını geri getirmek için birleşecek!"
 form_siberia_altai_coring_states_tt:0 "Tüm §YAltay§! Eyaletlerinde Çekirdek Hak Kazan"
 form_siberia_category:0 "Sibirya Birleşmesi"
 form_siberia_category_desc:0 "Sibirya'nın, günümüzdeki Rus kimliği dışında ne kültürel, ne etnik ne de siyasi olarak birleşik bir kimliği olmamıştır. Ancak, Rusların elleriyle aynı çatı altına getirilmeleri sayesinde, Sibirya halkı hiç bu kadar birleşmemişti. Eğer bir devlet Sibirya'yı birleştirir ve Rus Emperyalistlerini dışarı atarsa, birçok insan bu yeni devlet altında birleşmeyi kesinlikle kabul edecektir ve birçok kişi bunun gerçeğe dönüşmesini istiyor."
