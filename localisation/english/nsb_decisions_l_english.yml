 restructure_supply_system_desc:0 "İnşaat malzemelerini ve demiryolu işçilerini yönlendirerek, bazı demiryollarımız boyunca hızlı bir şekilde az sayıda geçici ikmal deposu oluşturabiliriz. Ancak bu, sistemi çalıştırmanın sürdürülebilir bir yolu değildir. \n\n§RBu karar yalnızca bir kez alınabilir. 3'ten fazla ek ikmal merkezi inşa ederseniz bonus kaybolur.§!"
