 march_through_estonia:0 "Estonya Boyunca Yürüyüş"
 march_through_estonia_desc:0 "Konstantin Päts'in zayıf hükûmeti, Estonya'nın vatanseverlerinin çığlığını yeterince uzun süre susturdu. Estonya silahlı kuvvetleriyle tek başımıza savaşacak insan gücümüz yok, ancak belki de ülke çapında bir dizi yürüyüşle diktatörlüğe olan öfkemizi göstererek, Estonya gençliğine babalarının onlar için savaştığı iyi hayatın Päts ve yandaşları tarafından inkâr edildiğini hatırlatabiliriz."
 poland_strength:0 "§Y[?POL.monarchist_support]§!"
 promote_baltic_fascism_cat:0 "Baltık Faşizmini Teşvik Et"
 promote_baltic_fascism_cat_desc:0 "Baltık, halklarının damarlarında akan Balt kanını temsil edemeyen zayıf, çocuksu rejimlerle karakterizedir. Litvanya, Estonya ve hatta Polonya'daki bazılarına, şimdi bizi bir kez daha ezmeye çalışan Germenlere ve Slavlara karşı duran atalarının görkemini hatırlatmalıyız."
