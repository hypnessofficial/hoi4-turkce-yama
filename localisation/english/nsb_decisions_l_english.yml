 SOV_concessions_germany_baku_SCW:0 "Askeri Yığınak için Bakü Petrol Hakları"
 SOV_concessions_germany_baku_SCW_accept:0 "Kabul edilirse, [GER.GetNameDef] [?SOV.SOV_civil_war_start_state.GetName]'da Askeri fabrikalar inşa etmeye başlayacak. [GetSovietOppositionName] [GER.GetAdjective] tankları ve tüfekleri alır. [GER.GetNameDefCAP] savaşın sonunda [229.GetName]'da Kaynak Hakları elde eder."
 SOV_concessions_germany_baku_SCW_desc:0 "[GER.GetNameDefCap]'in kendi askeri yığınağı için umutsuzca petrole ihtiyacı var. Savaştan sonra onlara petrol sahalarımızda münhasır haklar vaat ederek, bize yardım etmeye fazlasıyla istekli olmalılar."
 SOV_concessions_germany_ukraininan_oil_SCW:0 "Alman sponsorluğunda bir Ukrayna Ayaklanması"
 SOV_concessions_germany_ukraininan_oil_SCW_accept:0 "Kabul edilirse, [GER.GetNameDef] hazır olduğunda bir ayaklanma başlatacak olan Ukraynalı birimleri eğitecek. [GER.GetNameDefCAP] savaşın sonunda Ukrayna topraklarında Kaynak Hakları elde eder."
 SOV_concessions_germany_ukraininan_oil_SCW_desc:0 "Ukrayna'yı kaybetmek kötü olsa da, Stalinistlere karşı bir savaşta değerli bir müttefik olabilirler. Almanya, Ukrayna milislerini gizlice eğitebilir ve ardından Ukraynalı isyancılar hazır olduğunda sürpriz bir saldırı başlatabilir."
 SOV_concessions_japan_sakhalin_SCW:0 "Silah Karşılığında Sahalin"
 SOV_concessions_japan_sakhalin_SCW_accept:0 "Kabul edilirse, [GetSovietOppositionName] savaş başladığında [JAP.GetAdjective] silahları ve tüfekleri ve muhtemelen avcı uçakları alır. [JAP.GetNameDefCap] savaşın sonunda Kuzey Sahalin'in kontrolünü ele geçirecek."
 SOV_concessions_japan_sakhalin_SCW_desc:0 "İsyanın silahlara ihtiyacı var. Belki de Japonlar, Sahalin'in geri kalanını onlara vermeye hazır olduğumuzu gösterirsek bize biraz vermeye hazır olurlar."
 SOV_concessions_japan_vladivostok_SCW:0 "Vladivostok'u Japonya'ya Teklif Et"
