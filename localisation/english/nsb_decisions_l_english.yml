 recruiting_cavalry_flag:0 "Süvari Toplanıyor"
 reform_the_samanid_empire_category:0 "Samanid İmparatorluğu'nda reform"
 reform_the_samanid_empire_category_desc:0 "İran Intermezzo'sundan kaynaklanan Orta Asya'daki Pers kültürünün mirasçıları olarak, bir zamanlar Samanidlerin Fars Sünni Müslüman İmparatorluğu'nun sahip olduğu unvanlar üzerinde hak iddia edebiliriz. Toprakların bir kez daha tek hükümdar altında birleşmesi ile İmparatorluk eski ihtişamına geri getirilebilecek."
