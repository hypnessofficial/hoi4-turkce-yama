 form_idel_ural_category:0 "İdil-Ural Yeniden Birleşmesi"
 form_idel_ural_category_desc:0 "1 Mart 1918'de, Milli Meclis olarak da bilinen Ulusal Konsey, bir İdil-Ural Cumhuriyeti'nin kurulduğunu ilan etmeye çalıştı, ancak İç Savaş'ın her iki tarafı tarafından da engellendi. Bugün, bölgede birleşik bir ulus kavramı hala geniş çapta keşfedilmemiş, ancak eğer biri halkı Rus Emperyalizminden korumak için bunu ilan ederse, halk desteği büyük olacaktır."
