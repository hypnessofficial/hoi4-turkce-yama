l_english:
 BALTIC_belarus_uprising:0 "Yaklaşan Belarus İç Savaşı"
 BALTIC_belarus_uprising_desc:0 "Belarus halkı ikiye bölünüyor; ulusun yarısı [SOV.GetNameDef]'in bir parçası olarak kalmak isterken, diğer yarısı Baltıklara iltica etmek istiyor."
 BALTIC_communist_militancy:0 "Baltık Komünist Militanlığı"
 BALTIC_communist_propaganda:0 "Baltık Komünist Propagandası"
 BALTIC_entente:0 "Baltık Antantı"
 BALTIC_entente_desc:0 "Biz Baltlar, yabancı emperyalizmi altında geçen uzun acı dolu tarihimizle şekillenmiş bir kardeşliği paylaşıyoruz. Tekrar yabancı güçlere boyun eğemeyiz, bunu yapmak egemenliğimizin anahtarlarını bir başka emperyalist güce teslim etmek olur. Ancak bir araya gelerek bağımsızlığımızı korumayı umabiliriz."
 BALTIC_forest_brother_resistance_cat:0 "Orman Kardeşleri Direnişi"
 BALTIC_forest_brother_resistance_cat_desc:0 "Sosyalizm, ulusumuzdaki herkes tarafından tam olarak benimsenmedi ve Orman Kardeşleri'nden daha sesli ve aktif olarak yeni [Root.GetNonIdeologyName] rejimine karşı hoşnutsuzluk gösteren kimse yok. [Root.GetAdjective] milliyetçiliğinin sadık destekçileri olan Orman Kardeşleri, [Root.GetNonIdeologyName] üzerindeki tüm yabancı etkisini reddediyor ve daha milliyetçi bir hükûmet lehine komünist partiyi iktidardan uzaklaştırmak istiyor."
 BALTIC_forest_brothers_resistance:0 "Direniş Faaliyeti"
 BALTIC_forest_brothers_resistance_desc:0 "Orman Kardeşleri, ulusumuz içinde ihanet eylemleri işlemeye hazırlanıyor. Henüz ne yapacaklarını bilmiyoruz, ancak bunun elbette sosyalizmi ülke geneline yayma hedefimize aktif olarak zarar vereceğini biliyoruz."
 BALTIC_promote_communism:0 "[From.Owner.GetNameDef] Topraklarında Sosyalist Propaganda"
 BALTIC_promote_communism_desc:0 "[From.Owner.GetNameDef] köylülerinin çoğu sosyalizmi hâlâ yaşam tarzlarına düşman olarak görüyor. Kızıl Ordu'nun geride bıraktığı yaraları asla iyileştiremesek de, onları bizim devrim anlayışımızın o kadar da kanlı olmadığına ikna edebiliriz."
 BALTIC_promote_communism_militancy:0 "[From.Owner.GetAdjective] Militanları Destekle"
 BALTIC_promote_communism_militancy_desc:0 "Sosyalist coşku, birçok [From.Owner.GetAdjective] işçisinin kalbinde o kadar parlak yanıyor ki, diktatörlüğü devirmek için adımlar atmaya başlamak için yalnızca dış bir gücün desteğine ihtiyaçları var."
 BALTIC_promote_unity_BLR:0 "[From.GetName] Topraklarında Kontrol için Mücadele Et"
 BALTIC_promote_unity_BLR_desc:0 "Belarus iç savaşı patlak verdiğinde, tüm devletler devrimin hangi tarafını destekleyeceklerine bireysel olarak karar vermelidir. [From.GetName]'ın kazanan tarafta olmasını sağlamalıyız."
 EST_anti_vaps_propaganda:0 "Anti-Faşist Propaganda"
 EST_anti_vaps_propaganda_desc:0 "Ulusumuzda anti-faşizmi teşvik ederken ince bir çizgide yürüyoruz. Faşizme karşı olanların çoğu demokrat ve komünist, ancak belki de faşizmin yükselişini engellemek için ortak çabamızda diktatörlüğü desteklemeye ikna edilebilirler."
 EST_convert_FIN_cat:0 "Finlandiya Boyunca Yürüyüş"
 EST_convert_FIN_cat_desc:0 "[FIN.GetFascistParty], uzun zamandır [EST.GetFascistParty] ile yakın ilişkilere sahipti ve şimdi kendi ulusumuz üzerinde egemenlik kurduğumuza göre, Fin gazilerini kendi uluslarını ele geçirmeleri için güçlendirmeliyiz."
 EST_crackdown_on_vaps:0 "Vaps'lara Baskın Düzenle"
 EST_crackdown_on_vaps_desc:0 "Vaps'lar çok cüretkâr oluyor, artan etkilerinin bir kısmını ortadan kaldırmak istiyorsak üyelerine baskın yapmalıyız."
 EST_delay_the_crackdown:0 "Baskını Geciktir"
 EST_delay_the_crackdown_desc:0 "Vaps'larla bir an önce ilgilenilmesini tercih etsek de, ülkeyi kargaşaya sürükleme riskini göze alamayız ve baskın ertelenmelidir."
 EST_disrupt_vaps_recruitment:0 "Vaps İşe Alımlarını Engelle"
 EST_disrupt_vaps_recruitment_desc:0 "Vaps'lar geleneksel olarak orta yaşlıdan yaşlıya kadar değişen gaziler olsalar da, babalarının ve büyükbabalarının adına katılmak isteyen genç sempatizanlardan yoksun değiller. Bu işe alımı aksatmanın ve bu genç adamları faşizmin siren şarkısından uzak tutmanın yollarını bulmalıyız."
 EST_divide_veterans_societies:0 "Gazi Derneklerini Böl"
 EST_divide_veterans_societies_desc:0 "Vaps'lar öncelikle Estonya Bağımsızlık Savaşı'nda savaşanlardan oluşur ve kahramanlarımızın aşırı milliyetçiliğin etkisine girdiğini görmek üzücü olsa da, Vaps'ların birleştirdiği gazi derneklerini dağıtmalı ve bölmeliyiz."
 EST_fight_vaps_decisions:0 "Vaps'larla Savaş"
 EST_fight_vaps_decisions_desc:0 "Baskınımızın başarılı olması için Vaps Hareketi'ne karşı koyulmalıdır. Vaps'ları aksatan eylemler, ulusumuzdaki etkilerini büyük ölçüde azaltacak ve zorla uzaklaştırılmalarını daha da kolaylaştıracaktır."
 EST_launch_vaps_investigation:0 "Vaps Soruşturması Başlat"
 EST_launch_vaps_investigation_desc:0 "Gizli servislerimizin bir kısmını, Vaps'ın hükûmeti yıkma çabalarını sızmak ve durdurmak için görevlendirmeliyiz."
 EST_march_in_FIN_capital:0 "[FROM.GetName] Üzerine Yürüyüş"
 EST_march_in_FIN_capital_desc:0 "Finlandiya gazilerinin yeterince cesaretlendiğini hissettiğimizde, [FROM.GetName] üzerine yürümek için işareti vermemiz yeterli olacak ve Finler nihayet faşizm altında güçlenecekler."
 EST_march_in_FIN_state:0 "[FROM.GetName] Topraklarında Yürü"
 EST_march_in_state:0 "[FROM.GetName] Topraklarında Yürü"
 EST_put_vaps_leaders_on_trial:0 "Vaps Sempatizanlarını Yargıla"
 EST_put_vaps_leaders_on_trial_desc:0 "Hükûmetin bazı üyelerinin Vaps hareketine sempati duyduğu bir sır değil. Bunun devam etmesine izin verilemez; askeri personelimiz Vaps ile olan ilişkileri nedeniyle hain olarak yargılanmalıdır."
 EST_stomp_the_vaps:0 "Yaklaşan Hükûmet Baskını"
 EST_stomp_the_vaps_desc:0 "[EST.GetLeader], [EST.GetLeader.GetHerHis] rejimini bozmak istediğimizi biliyor ve [EST.GetLeader.GetSheHe] bize karşı bir baskın hazırlığı yapıyor ve yürüyüşlerimize bir son vermek istiyor. O zamana kadar hükûmeti devirmeyi başaramazsak, Estonya bir iç savaşla karşı karşıya kalır!"
 EST_vaps_crackdown:0 "Vaps'lara Baskın"
 EST_vaps_crackdown_desc:0 "Vaps Hareketi ile ilişkili tüm derneklere karşı topyekûn bir baskın düzenliyoruz. Vaps'lar siyasi kenarlarda kalırsa, baskın önemsiz olmalı, ancak yeterli destek toplamışlarsa, baskınımızın sonucu Estonya'nın en eski gazilerinden bazılarıyla kanlı bir iç savaş olabilir."
 EST_vaps_revolt_category:0 "Vaps Ayaklanması"
 EST_vaps_revolt_category_desc:0 "Estonya genelindeki bir dizi gazi derneği, Vaps Hareketi olarak bilinen ve hükûmeti devirmekle tehdit eden tek bir faşist varlık halinde örgütlendi. Rejimi barış içinde sürdürmek istiyorsak, bu Estonya milliyetçiliği yükselişini engellemek için harekete geçmeliyiz."
 EST_vaps_uprising:0 "Vaps'lar Tallinn'e Yürüyor"
 EST_vaps_uprising_desc:0 "Vaps'lar, yasadışı bir örgüt olmalarına rağmen Estonya genelinde yürüyüş ve gösteri yapmaya devam ediyor. Bu milliyetçi grubun kök salmasına ne kadar uzun süre izin verirsek, başkalarının da onların davasına katılma riski o kadar artar."
 EST_vapsid_takeover:0 "Bir Vapsid hükûmeti zaten ülkeyi yönetiyor"
 LAT_delay_perkonkrust_decisions:0 "Pērkonkrusts ile Savaş"
 LAT_delay_perkonkrust_decisions_desc:0 "Kalıcı bir çözüm olmasa da, ulusumuzdaki faşist desteği, Pērkonkrusts ile bir şekilde ilgilenilene kadar azaltmak için bazı kampanyalar yürütebiliriz."
 LAT_empower_democrats:0 "Demokratları Güçlendir"
 LAT_empower_democrats_desc:0 "İstenmese de, demokratlar Pērkonkrusts'un sesli muhalifleridir ve ulusumuz için çok daha küçük bir tehdit oluştururlar. Bu, demokratik muhalefete olan desteği artıracaktır, ancak Pērkonkrusts'un faaliyetlerini engellemek için elimizden gelen her şeyi yapmalıyız."
 LAT_equality_campaigns:0 "Eşitlik Kampanyaları"
 LAT_equality_campaigns_desc:0 "Pērkonkrusts, [Root.GetLeader]'ın güneşin tüm Letonyalılar üzerinde eşit parladığı bir Letonya yaratma misyonuna karşıdır ve bu nedenle onların üstünlükçü anlatısını desteklemenin ulusumuzun temel değerlerine aykırı olduğunu açıkça belirtmeliyiz."
 LAT_ignite_civil_war_in_target:0 "[From.Owner.GetAdjective] İç Savaşını Ateşle"
 LAT_ignite_civil_war_in_target_desc:0 "Propaganda ancak bir yere kadar işe yarar, bazen devlete güç ve istikrar getirmek için doğrudan eylem gerekir. Elimizden geleni yaptık, şimdi [From.Owner.GetFascistParty]'i kendi kaderine bırakıyoruz."
 LAT_perkonkrust_revolt_category:0 "Pērkonkrusts İsyanı"
 LAT_perkonkrust_revolt_category_desc:0 "Baltık kabilelerini ve Letonya etnik kökenini yücelten aşırı milliyetçiler olan Pērkonkrusts, uğruna savaştığımız Letonya için varoluşsal bir tehdittir. Pērkonkrusts, yaralı bir ulusal gurur üzerindeki bir enfeksiyondur ve ortadan kaldırılmalıdır."
 LAT_perkonkrust_uprising:0 "Pērkonkrusts Ayaklanması"
 LAT_perkonkrust_uprising_desc:0 "Zamanla, Pērkonkrusts ülke genelinde destek toplayacak ve kontrolsüz bırakılırsa, hükûmete darbe girişiminde bulunmaya cesaret edecektir."
 LAT_promote_falange_militancy:0 "[From.Owner.GetFascistParty] Militanlarını Destekle"
 LAT_promote_falange_militancy_desc:0 "[From.Owner.GetNameDef]'de, kalplerinde Baltların öfkesini taşıyanlar var ve onlara hak ettikleri askeri ve siyasi desteği vermek bizim görevimizdir."
 LAT_promote_fascism:0 "[From.Owner.GetNameDef] Topraklarında Faşist Propaganda"
 LAT_promote_fascism_desc:0 "[From.Owner.GetNameDef]'deki birçok kişi, [From.Owner.GetFascistParty] partisinin [From.Owner.GetAdjective] halkının nihayet kendi kendini yönetmesinin tek yolu olduğunu henüz kabul etmedi. Bu, propaganda çabaları ve [From.Owner.GetFascistParty] partisinin aktif desteği ile düzeltilmelidir."
 LAT_support_loyalists:0 "Muhalefeti Bütünleştir"
 LAT_support_loyalists_desc:0 "Muhalefetin bazı kesimlerini ilhak ederek, Pērkonkrusts'u toplumumuzun siyasi kenarlarına itmek için daha güçlü olacağız."
 LIT_adopt_the_dobuzhinsky_flag_design_decision:0 "Dobujinski'nin Hanedan Bayrağı Tasarımını Kabul Et"
 LIT_adopt_the_dobuzhinsky_flag_design_decision_desc:0 "Bayrağımızın renkleri armamızın renkleriyle eşleşmelidir. Armada yeşil renk bulunmamaktadır ve bu nedenle bayrakta da olmamalıdır. Bu yüzden Mstislav Dobujinski ve Vydūnas tarafından bize sunulan teklifi kabul etmeliyiz."
 LIT_grant_concessions_to_iron_wolf:0 "Demir Kurt'a Tavizler Ver"
 LIT_grant_concessions_to_iron_wolf_desc:0 "Belki de Demir Kurt'a bazı sembolik jestler sunarak, ajitasyonlarını bir nebze olsun yatıştırabiliriz."
 LIT_ignite_civil_war_in_POL:0 "Ayaklanmayı Başlat"
 LIT_ignite_civil_war_in_POL_desc:0 "Hazırlıklar yapıldı. Polonya yakında sadece fikirlerin değil, aynı zamanda yiğitlik ve şanın da bir savaş alanı olacak. Polonya'daki Falanjistleri desteklemek için elimizden gelen her şeyi yaptık, şimdi tek yapmamız gereken zarları atmak ve Tanrı'nın gerçekten onların yanında olmasını ummak."
 LIT_iron_wolf_appeasement:0 "Demir Kurt Ayaklanmasını Geciktir"
 LIT_iron_wolf_appeasement_desc:0 "Ulusumuzdaki Demir Kurt faaliyetlerini aksatmak için çaba göstermeliyiz. Bu önlemlerin hiçbiri onları tamamen ortadan kaldırmayacak olsa da, kalıcı bir çözüm bulana kadar çabalarını geciktirebiliriz."
 LIT_iron_wolf_coup:0 "Demir Kurt Darbesi"
 LIT_iron_wolf_coup_desc:0 "Augustinas Voldemaras'ın takipçileri ulusumuz içinde bir isyan örgütlüyorlar. Demir Kurt'u engellemek için bir şey yapılmazsa, bir iç savaşa sürüklenme riskiyle karşı karşıyayız. Demir Kurt partizanlarına taviz verip onları güçlendirme riskini mi alacağımıza, yoksa liderlerini ulusumuzdan sürerek takipçilerini dağınık ve iddia ettikleri güçlü liderlikten yoksun mu bırakacağımıza karar vermeliyiz."
 LIT_iron_wolf_partisans:0 "Demir Kurt Partizanları"
 LIT_iron_wolf_partisans_desc:0 "Demir Kurt, ulusumuzda örgütleniyor. Zamanla, Litvanya halkı arasındaki desteklerini kaçınılmaz olarak artıracaklar ve sonunda hükûmete karşı bir darbe yapmaya cesaret edebilirler."
 LIT_promote_alternative_paramilitaries:0 "Alternatif Paramiliter Grupları Teşvik Et"
 LIT_promote_alternative_paramilitaries_desc:0 "Vatandaşlarımızın resmi Litvanya ordusuna katılmasını istesek de, bazılarının hükûmetten bağımsız bir gruba bağlılık yemini etmeyi tercih etmesi kaçınılmazdır. Belki de Litvanya Atıcılar Birliği gibi diğer grupları teşvik ederek, bazı milliyetçileri Demir Kurt'a katılmaktan caydırabiliriz."
 LIT_promote_falange_militancy:0 "Falanjist Militanları Destekle"
 LIT_promote_falange_militancy_desc:0 "[POL.GetFascistParty], isyankâr ve şiddetli gösteri yöntemleriyle ünlüdür. Birçok faşist, [POL.GetFascistParty]'in milliyetçi coşkusundan korkar, ancak biz bunun, kalplerinde yanan ve desteklenmesi gereken vatanseverliğin bir ifadesi olduğunu biliyoruz."
 LIT_promote_fascism:0 "Polonya'da Faşist Propaganda"
 LIT_promote_fascism_desc:0 "Onlarca yıldır faşizm, Polonya siyasetinin kenarlarına itildi. Polonyalıların kendiliğinden ayaklanmasını çok isterdik, ancak uluslarında açıkça faşizmi desteklemezsek neredeyse hiç şansları olmaz."
 LIT_relocate_iron_wolf_recruitment:0 "Demir Kurt Temsilciliklerini Taşınmaya Zorla"
 LIT_relocate_iron_wolf_recruitment_desc:0 "Demir Kurt, saflarına yeni adamlar katmak için yerel temsilcilere güvenir. Bu temsilcileri zorla taşıyarak, potansiyel takipçilerin kafasını karıştıracak ve muhtemelen Demir Kurt grubuna girişlerini önleyeceğiz."
 LIT_support_monarchy_in_POL_tt:0 "§YPolonya Üzerindeki Hakkımız§! Kararlarının kilidini açar."
 POL_add_state_to_strike:0 "[From.GetName]'ı greve dahil et"
 POL_anti_capitalist_decisions:0 "Anti-Kapitalist Devrim"
 POL_anti_capitalist_decisions_desc:0 "Kapitalizm yeryüzündeki bir hastalıktır. Bu ulusların çoğu kendilerini \"Demokratik\" olarak adlandırsa da, yalnızca proletaryayı burjuva demokrasisinde köleleştiriyorlar ve yoldaşlarını özgürleştirmek her sosyalistin görevidir."
 POL_anti_fascist_military:0 "Anti-Faşist Ordu"
 POL_anti_fascist_revolution_category:0 "Anti-Faşist Devrim"
 POL_anti_fascist_revolution_category_desc:0 "Faşistler, işçi sınıfının acımasız baskısını sürdüren aşırı milliyetçi diktatörlükler yaratmak için proletaryanın burjuvaziye karşı mücadelesinin dilini aldılar. Sosyalist bir devlet olarak, dünya işçilerini faşizmin teröründen kurtarmalıyız."
 POL_anti_monarchist_purge:0 "Anti-Monarşist Askeri Tasfiye"
 POL_appoint_nationalist_ministers:0 "Milliyetçi Siyasi Kampanyalar"
 POL_ban_monarchist_propaganda:0 "Monarşist Propagandayı Yasakla"
 POL_ban_monarchists:0 "Monarşist Sorununu Bitir"
 POL_ban_polish_imports:0 "[From.GetAdjective] İthalatını Yasakla"
 POL_banned_monarchy_flag:0 "Monarşizmi yasakladı."
 POL_completing_miedzymorze_decision:0 "Zaten başka bir ülkeyle müzakere ediliyor"
 POL_cossack_republic_decisions:0 "Kazak Cumhuriyetleri"
 POL_cossack_republic_decisions_desc:0 "Rus İç Savaşı sırasında, Beyazlarla birlikte savaşan birkaç bağımsız kazak ev sahibi ulusu kuruldu. Beyaz sürgünler şimdi Rus topraklarının derinliklerine doğru ilerlerken, düşmüş cumhuriyetleri yeniden canlandırma fırsatımız var."
 POL_crackdown_in_lviv:0 "Lwów'da Baskın"
 POL_double_propagandise_monarchist_sentiment:0 "[From.GetLeader] Karşıtı Propaganda"
 POL_escelate_the_strike:0 "DEBUG: Grevi Tırmandır"
 POL_escelate_the_strike_desc:0 "Köylü Grevi'ni bir aşama hızla ilerletmek için hata ayıklama kararı. Bu karar, hata ayıklama modu aktif olmadıkça görünmemelidir."
 POL_expand_strikes_to_factories:0 "Grevleri Fabrikalara Genişlet"
 POL_expand_strikes_to_factories_tt:0 "Sanayileşmiş eyaletleri greve dahil etmemizi sağlar."
 POL_expand_the_strike_name:0 "Köylü Grevini Genişlet"
 POL_fight_against_monarchy_in_LIT_cat:0 "Yabancı Hak Sahibine Karşı Savaş"
 POL_fight_against_monarchy_in_LIT_cat_desc:0 "Yabancı bir ajan, hükûmetimiz içinden destek arayarak [Root.GetAdjective] tahtını talep etmeye çalışıyor. Halk ve iç desteği düşük tutabilirsek, hak iddiaları sorununu tamamen bertaraf edebiliriz.\n\nMevcut hak iddiası gücü [Root.GetPolRoyalClaimStrength]"
 POL_flip_lithuania_monarchist:0 "Hak İddiasını Zorla"
 POL_growing_monarchist_sentiment:0 "Büyüyen Monarşist Duygular"
 POL_ignite_monarchist_war:0 "İç Savaşı Ateşle"
 POL_invest_in_lithuania:0 "[From.GetNameDef]'e Yatırım Yap"
 POL_monarchist_civil_war:0 "İç Savaşı Ateşle"
 POL_nationwide_fascist_displays:0 "Ülke Çapında Faşist Gösteriler"
 POL_pacify_peasants_repeatable:0 "[?peasant_state_var.GetName]'ı Sakinleştir"
 POL_pacify_zamosc:0 "Zamość'u Sakinleştir"
 POL_promote_falangism:0 "[FROM.Owner.GetNameDef] Topraklarında Falanjizmi Teşvik Et"
 POL_promote_falangism_benelux:0 "§YBenelüks§!'te Falanjizmi Teşvik Et"
 POL_promote_falangism_caribbean:0 "§YKarayipler§!'de Falanjizmi Teşvik Et"
 POL_promote_falangism_central_america:0 "§YOrta Amerika§!'da Falanjizmi Teşvik Et"
 POL_promote_falangism_decisions:0 "Falanjizmi Teşvik Et"
 POL_promote_falangism_decisions_desc:0 "Almanlarla savaş ufukta görünüyor ve biz silahça zayıf olsak da, [GER.GetLeader] tüm [GER.GetLeader.GerHerHis] düşmanlarını aynı anda ortadan kaldırmayı umamaz! Halk arasında uygun falanjist desteğiyle, dünyanın iyi Katolik ulusları [GER.GetNameDef]'e karşı mücadelemizde bize katılabilir."
 POL_promote_falangism_in_major:0 "[FROM.Owner.GetNameDef] Topraklarında Falanjizmi Teşvik Et"
 POL_promote_falangism_south_america:0 "§YGüney Amerika§!'da Falanjizmi Teşvik Et"
 POL_propagandise_monarchist_sentiment:0 "Monarşist Duyguları Propagandayla Yay"
 POL_purchase_cheap_colony:0 "[FROM.GetName]'ı Satın Al"
 POL_purchase_cheap_colony_desc:0 "[FROM.GetName]'a artan bir Polonya ilgisi var. Bu çıkarlar hükûmetin yetki alanı dışında olsa da, coşkuları bölgenin Polonya tarafından satın alınması için bir gerekçe olarak kullanılabilir."
 POL_purchase_gambia:0 "[701.GetName]'ı Satın Al"
 POL_purchase_gambia_desc:0 "Yüzyıllar önce, Kurlandiya Dükalığı, Lehistan-Litvanya Birliği adına [701.GetName]'ı sömürgeleştirmeye çalıştı. Yerlilerle iyi ilişkilere rağmen, yabancı güçler tarafından dışarı atıldılar. Bu durumun düzeltilme zamanı geldi."
 POL_purchase_madagascar:0 "[543.GetName]'ı Satın Al"
 POL_purchase_madagascar_desc:0 "Madagaskar, Polonyalılara yabancı bitki ve hayvanlarla dolu, yabancı bir manzaradır. Birçoğu bunu adayı Polonyalılar için yaşanmaz kılacak bir şey olarak görse de, bazıları bunu tamamen yeni bir yerde yaşama fırsatı olarak görebilir. Adanın büyüklüğü ve potansiyel ham kaynakları, eğer bir gün gerekirse sürgündeki bir Polonya hükûmetine ev sahipliği yapmak için ideal bir yer haline getiriyor."
 POL_restore_don_cossacks:0 "Don Cumhuriyeti'ni Yeniden Kur"
 POL_restore_don_cossacks_desc:0 "Bolşevizmin şiddetli muhalifleri olan Don Kazakları, Rus iç savaşında Beyazlarla birlikte savaştı. Şimdi tüm toprakları bizim elimizde olduğuna göre, Don sürgünlerini bu topraklara yeniden yerleşmeye ve yoldaşlarıyla birlikte savaşmaya davet edebiliriz."
 POL_restore_kuban_cossacks:0 "Kuban Cumhuriyeti'ni Yeniden Kur"
 POL_restore_kuban_cossacks_desc:0 "Kuban kazaklarının ihaneti, Rus iç savaşında Beyazların yenilgisini garantileyen önemli bir dönüm noktasıydı. Bu sefer, Kubanlıların sadık kalacak bir hükûmet tarafından yönetilmesini sağlayacağız."
