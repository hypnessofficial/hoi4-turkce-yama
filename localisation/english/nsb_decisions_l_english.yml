 form_transcaucasian_republic:0 "Transkafkasya Federasyonu'nu Yeniden Kur"
 form_transcaucasus_category:0 "Transkafkasya Cumhuriyeti"
 form_transcaucasus_category_desc:0 "1936 Sovyet Anayasası'ndan sonra yakın zamanda dağılan Transkafkasya Cumhuriyeti, hala insanların zihninde kazınmış bir fikirdir. Eğer bir ülke bu toprakları birleştirmeyi başarırsa, Devletler Federasyonu'nun yeniden kurulma şansı vardır ve Transkafkasya bir kez daha birleşik ve güçlü bir şekilde ayakta durabilir."
 form_turkestan:0 "Türkleri Birleştir"
 form_turkestan_category:0 "Türk Ulusunu Kur"
 form_turkestan_category_desc:0 "Tarihimiz boyunca Türk halkları sayısız kez birleşti ve bölündü. Eğer tüm Orta Asya bölgesini kontrolümüz altına alabilirsek, bizden önceki büyük Türk Hanlarının mirasını geri alabilir ve halkımızı tek bir ulus olarak birleştirebiliriz!"
 formalize_the_entente:0 "Baltık Antantı'nı Resmîleştir"
 formalize_the_entente_desc:0 "Baltık Antantı'nı tam teşekküllü bir ittifak olarak ilan etmekte tereddüt ettik, ancak sınırlarımızda yükselen emperyalizme karşı kendi başımıza durabilecek kadar üye kazandığımızdan eminiz."
 fought_vaps_flag:0 "Vaps'lara baskın yaptı"
 infiltrate_belarus_decisions:0 "Belarus'a Sız"
 infiltrate_belarus_decisions_desc:0 "SSCB, Belarus alt sınıflarının çıkarlarını temsil ettiğini iddia ediyor, ancak Baltık sosyalistleri bunun saf bir gösteriş olduğunu iddia ediyor. Onlara göre [SOV.GetLeader], kelimenin tam anlamıyla bir burjuva diktatörüdür ve Belarus halkı ancak silahlandırılarak gerçekten sosyalist bir devlette özgürleşebilir."
