 SOV_peace_deal_for_south_sakhalin_and_kuril_islands_desc:0 "[JAP.GetAdjective] hükûmetine, eski topraklarımız olan [537.GetName] ve [555.GetName]'ı geri vermeyi kabul ederlerse tüm düşmanlıkların sona ermesini teklif edeceğiz."
 SOV_permanent_revolution_dec_cat:0 "Sürekli Devrim"
 SOV_permanent_revolution_dec_cat_desc:0 "[GetAppropriatePermanentRevolutionDecCatDesc]"
 SOV_permanent_revolution_dec_cat_desc_soviet:0 "$SOV_the_permanent_revolution_desc$"
 SOV_permanent_revolution_dec_cat_desc_targets:0 "Marksist teori, koşullar uygunsa devrimin kaçınılmaz olduğunu öğretir ve sınırlarımız içinde faaliyet gösteren çok sayıda düşman [SOV.GetAdjective] ajanı, [ROOT.GetName]'daki işçi sınıfı arasında başarılı bir silahlı ayaklanma için koşulların uygun olmasını sağlıyor."
 SOV_plan_start_of_uprising_archangelsk:0 "[FROM.GetName]'da Gizli Karargâh Kur."
 SOV_plan_start_of_uprising_archangelsk_desc:0 "Kuzey bölgesi limanlara erişime sahip ve Moskova'ya nispeten yakın, bu da onu iyi bir üs yapıyor. Ancak, zayıf bir iç altyapıya ve düşük gelişmişliğe sahip, bu yüzden buradan bir savaş yürütmek, bunu hafifletmek için bir şeyler yapılmazsa biraz zor olacaktır."
 SOV_plan_start_of_uprising_chita:0 "[FROM.GetName]'da Gizli Karargâh Kur."
 SOV_plan_start_of_uprising_chita_desc:0 "Sibirya geleneksel olarak anti-stalinist ve anti-bolşevik bir kaledir. Bölge az gelişmiş olabilir, ancak davamıza kazanmak nispeten kolay olmalı."
 SOV_plan_start_of_uprising_odessa:0 "[FROM.GetName]'da Gizli Karargâh Kur."
 SOV_plan_start_of_uprising_odessa_desc:0 "Ukrayna, bir isyan için iyi bir üs. Zengin bir bölge, büyük şehirleri, iyi limanları ve altyapısı var. Ancak, bu aynı zamanda eyaletleri davamıza kazanmanın [SOV.GetNameDef]'in daha az gelişmiş bölgelerine göre daha zor olacağı anlamına da geliyor."
 SOV_plan_start_of_uprising_omsk:0 "[FROM.GetName]'da Gizli Karargâh Kur."
 SOV_plan_start_of_uprising_omsk_desc:0 "Omsk, batı Sibirya'da iyi bir konuma sahip, aynı zamanda Urallar bölgesi ve Büyük Bozkır ile de komşu. Biraz az gelişmiş olsa da, burada bir ayaklanma için iyi ve sağlam bir üs inşa etmek ve ardından Moskova'ya yürüyüşe başlamak nispeten kolay olmalı."
 SOV_plan_start_of_uprising_tashkent:0 "[FROM.GetName]'da Gizli Karargâh Kur."
 SOV_plan_start_of_uprising_tashkent_desc:0 "Üssümüzü Büyük Bozkır Bölgesi'nde kurmak, arkamızın güvende olması anlamına gelir. Moskova'ya ulaşmak için uzun bir yürüyüş anlamına gelecek, ancak savaşın çoğu önümüzde olacak. Ayrıca, bu bölgede destek kazanmak nispeten kolay olmalı."
 SOV_plan_start_of_uprising_ufa:0 "[FROM.GetName]'da Gizli Karargâh Kur."
 SOV_plan_start_of_uprising_ufa_desc:0 "Urallar kolayca savunulabilme avantajına sahip ve üssümüzü buraya kurmak aynı zamanda etkimizi hem Sibirya'ya hem de Kuzey bölgesine, hem de güneye Büyük Bozkır alanına yaymamızı sağlayarak bize birçok farklı seçenek sunuyor."
