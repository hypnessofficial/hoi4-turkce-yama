 support_polish_falange_decisions_desc:0 "Faşizm Litvanya'da başarılı oldu ve Polonya'daki eski kardeşlerimizi terk etmek için hiçbir neden görmüyoruz. Falanjist düşünceyi halk arasında yayarak, [POL.GetFascistParty]'i güçlendirebilir ve oradan da kıta genelinde Leh-Litvan üstünlüğünü kurmak için çalışabiliriz."
