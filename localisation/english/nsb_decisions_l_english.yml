 SOV_infiltrate_stalinist_plans_in_spain_poum:0 "İspanya'daki Stalinist Komutaya Sız"
 SOV_infiltrate_stalinist_plans_in_spain_poum_desc:0 "Yakında burjuva cumhuriyetçi hükûmetine yardım etmek için yeni bir grup Sovyet askeri danışmanı İspanya'ya gönderilecek ve aralarına birkaç anti-Stalinist ajan sızdırma şansımız var. \nBu ajanlar, düşman planlarını uygulanmadan önce öğrenmemizi sağlayacak bir muhbir ağı oluşturmak için burjuva cumhuriyetçi taraftaki POUM sempatizanı askerler, Tugaycılar ve milislerle temas kuracak ve onları saflarına katacak."
