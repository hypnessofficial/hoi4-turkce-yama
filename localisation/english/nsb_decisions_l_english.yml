 SOV_concessions_japan_vladivostok_SCW_desc:0 "Japon Ordusu her zaman Vladivostok'u arzulamıştır. Bu nedenle, bölgenin gelecekteki sahipliğini bir pazarlık kozu olarak kullanırsak, bir seferi kuvvetiyle bize yardım etmeye meyilli olmalılar."
