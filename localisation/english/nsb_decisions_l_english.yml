 SOV_influence_airforce_opposition_desc:0 "Silahlı kuvvetlerdeki bağlantılarımızı kullanarak, davamıza sempati duyan pilotlar ve hava komutanları bulabilmeliyiz. Hava kuvvetlerinin yanımızda olması savaşı kesinlikle çok daha kolay bir görev haline getirecektir."
