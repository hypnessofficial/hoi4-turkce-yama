 POL_sanacja_falanga_decisions:0 "Endecja ve Falanga"
 POL_sanacja_falanga_decisions_desc:0 "Ulusal-Demokratlar ve Falanjistler, İkinci Polonya Cumhuriyeti içinde büyük bir etki kazandılar. Tavizler vererek ve ülke çapında gösteriler düzenleyerek, faşist etki Polonya hükûmeti içinde ve halk arasında katlanarak genişleyebilir."
