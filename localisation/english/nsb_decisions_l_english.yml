 SOV_influence_navy_opposition:0 "Donanma Desteğini Artır"
 SOV_influence_navy_opposition_desc:0 "Donanma bir iç savaşta çok faydalı olmayabilir, ancak yine de kilit yerleri almamıza ve ikmal almamızı sağlamamıza yardımcı olabilirler. Bu yüzden bir dizi kaptanın sadakatini sağlamaya değer. Ayrıca, savaştan sonra bir filoya sahip olmak uluslararası sahnede bize yeni kapılar açar."
