 demobilization_military_mission:0 "Barış Düzenine Dönüş"
 demobilization_military_mission_desc:0 "Çatışma sona erdi, ancak ülkemiz hâlâ topyekûn savaş sürüyormuş gibi faaliyet gösteriyor. Bu yüksek hazırlık seviyesi kaynaklarımızı tüketiyor ve halkı yoruyor. Bu görevi tamamlamak ve kötü olaylardan kaçınmak için seferberlik yasalarımızı düşürmeliyiz. Sivil ekonomiye dönmeli ve askerlik seviyelerimizi azaltmalıyız. Ayrıca ordumuzu küçülterek ülkemizin barış zamanı kapasitesini aşmamasını sağlamalıyız."
