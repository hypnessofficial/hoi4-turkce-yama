 westheia_1933_belgium.1.a:0 "Belçika, savaş yıllarının kralını kaybetti."
 westheia_1933_belgium.1.d:0 "Belçika Kralı I. Albert, Namur yakınlarındaki Marche-les-Dames kayalıklarında yaptığı tırmanış sırasında geçirdiği kazada hayatını kaybetti. Kralın ani ölümü, ülkeyi derin bir yasa boğdu.\n\nBüyük Savaş sırasında ordusunun başında kalan ve işgale karşı direnişin simgesi haline gelen Albert, Belçikalılar için ulusal birliğin ve bağımsızlığın temsilcisiydi. Savaş sonrasında ülkesinin yeniden inşasına ve siyasi reformlara destek veren hükümdarın kaybı, ekonomik bunalım ve Avrupa’da büyüyen belirsizlik ortamında ağır bir darbe olarak karşılanıyor.\n\nVeliaht Prens Leopold’un babasının ardından tahta geçmesi beklenirken, Brüksel’e yabancı başkentlerden taziye mesajları ulaşıyor. Belçika, tarihinin en zor günlerinde kendisine önderlik eden kralına veda ediyor."
 westheia_1933_belgium.1.t:0 "Belçika Kralı I. Albert Hayatını Kaybetti"
 westheia_1933_dabancheng_resistance:0 "Dabancheng’de Direniş"
 westheia_1933_dabancheng_resistance_desc:0 "Yerel halkın eyalet yönetimine karşı direnişi, bölgedeki otoritemizi aşındırmaktadır."
 westheia_1933_east_hebei_border_tensions:0 "Doğu Hebei Sınırındaki Çatışma"
 westheia_1933_irish_oath.1.a:0 "Ayıp."
 westheia_1933_irish_oath.1.b:0 "Ama bu son yaptığınız!"
 westheia_1933_irish_oath.1.d:0 "Éamon de Valera hükûmeti, İrlanda milletvekillerinin İngiliz kralına bağlılık yemini etme zorunluluğunu kaldırdı. Dublin’de kabul edilen anayasa değişikliğiyle, parlamentoya girebilmek için Kraliyet’e sadakat bildirilmesi artık gerekmiyor.\n\nİrlanda cumhuriyetçileri için bu yemin, İngiliz-İrlanda Antlaşması’nın en tartışmalı miraslarından biriydi. De Valera’nın kararı, Dublin’in Londra’yla anayasal bağlarını gevşetme yönündeki kararlılığını ortaya koyuyor. Hükûmetimiz bu adımı diplomatik bir hoşnutsuzlukla mı karşılamalı, yoksa İrlanda’ya karşı ekonomik yaptırımlara mı başvurmalı?"
 westheia_1933_irish_oath.1.t:0 "Kraliyete Bağlılık Yemininin Kaldırılması"
 westheia_1933_irish_oath_removed:0 "Kraliyete Bağlılık Yemini Kaldırıldı"
 westheia_1933_jehol_border_tensions:0 "Jehol Sınırındaki Çatışma"
 westheia_1933_khotan_resistance:0 "Khotan’da Ayrılıkçı Direniş"
 westheia_1933_khotan_resistance_desc:0 "Khotan’daki yerel güçler Sinkiang yönetimini tanımayı reddediyor. Köyler ve kasabalar arasındaki dayanışma, direnişin bastırılmasını zorlaştırırken idari denetim giderek çözülmektedir."
 westheia_1933_little_entente_friendship:0 "Küçük Antant'ın Güçlendirilmesi"
 westheia_1933_marseille_tensions:0 "Marsilya Suikastının Gölgesi"
 westheia_1933_military_dictatorship:0 "Askerî Diktatörlük"
 westheia_1933_rome_protocols_friendship:0 "Roma Protokolleri"
 westheia_1933_zeven.1.a:0 "Bunalımın yankıları denizlere de ulaşıyor."
 westheia_1933_zeven.1.d:0 "Hollanda Doğu Hint Adaları’ndan gelen haberler, De Zeven Provinciën savaş gemisinde denizcilerin ayaklandığını bildiriyor. Büyük Buhran’ın ardından uygulanan maaş kesintileri, Hollandalı ve yerli mürettebat arasında uzun süredir büyüyen hoşnutsuzluğu açık bir isyana dönüştürdü. Sumatra açıklarında bulunan geminin denetimini ele geçiren denizciler, donanma makamlarının emirlerine karşı çıkıyor.\n\nLahey’de hükûmet, olayları donanmanın disiplinine ve sömürge idaresinin otoritesine yönelmiş ciddi bir meydan okuma olarak değerlendiriyor. Hollanda donanması gemi üzerindeki denetimi yeniden sağlamaya hazırlanırken, ekonomik bunalımın yarattığı huzursuzluğun imparatorluğun uzak garnizonlarına kadar ulaştığı görülüyor."
 westheia_1933_zeven.1.t:0 "De Zeven Provinciën’de İsyan"
 westheia_CHI33_fujian_crisis:0 "Fujian Krizi"
 westheia_CHI33_fujian_crisis_desc:0 "Fuzhou'daki isyanı bastırmak için birliklerimizi Fujian'da tutmalı ve eyaletin ikmal hatlarını güvenceye almalıyız."
 westheia_CHI33_fujian_revolt:0 "Fujian Ayaklanması"
 westheia_CHI33_fujian_revolt_desc:0 "19. Yol Ordusu'nun ayaklanması ve limanlara uygulanan abluka, Fujian'da üretimi ve askerî sevkiyatı aksatıyor."
 westheia_CHI33_suppress_fujian_revolt:0 "Fujian Ayaklanmasını Bastır"
 westheia_CHI33_suppress_fujian_revolt_desc:0 "Fujian'da 60 gün boyunca en az 10 tümen bulundurmak ayaklanmanın etkilerini sona erdirecek."
 westheia_PRC33_central_soviet:0 "Merkez Sovyet'i Ayakta Tut"
 westheia_PRC33_central_soviet_desc:0 "Ruijin çevresindeki Merkez Sovyet, Kızıl Ordu'nun siyasi ve askerî dayanağıdır. Köy komitelerinin seferberliğiyle savunma hatlarını ayakta tutacağız."
 westheia_PRC33_dadu_crossing:0 "Dadu Nehri'ni Aş"
 westheia_PRC33_dadu_crossing_desc:0 "Dadu Nehri'nin geçitleri kuzeye giden yolu tutuyor. Luding Köprüsü'nü güvenceye alarak ana kuvvetin ilerlemesini sağlayacağız."
 westheia_PRC33_encirclement:0 "Beşinci Kuşatma"
 westheia_PRC33_encirclement_desc:0 "Milliyetçi kontrol noktaları, cepheye erzak ve takviye ulaşmasını zorlaştırıyor."
 westheia_PRC33_encirclement_prepared:0 "Beşinci Kuşatma"
 westheia_PRC33_encirclement_prepared_desc:0 "Hazırlanan alternatif yollar ve yerel ağlar, Milliyetçi ablukanın etkisini azaltıyor."
 westheia_PRC33_fifth_encirclement:0 "Beşinci Kuşatmaya Karşı Koy"
 westheia_PRC33_fifth_encirclement_desc:0 "Milliyetçi kuvvetler, tahkim edilmiş mevziler ve ikmal yollarıyla çemberi daraltıyor. Daha önce kurduğumuz erzak ağları ve hazırladığımız çekilme güzergâhları baskıyı hafifletebilir."
 westheia_PRC33_fourth_encirclement:0 "Dördüncü Kuşatmayı Püskürt"
 westheia_PRC33_fourth_encirclement_defense:0 "Dördüncü Kuşatmadan Çıkarılan Dersler"
 westheia_PRC33_fourth_encirclement_defense_desc:0 "Kızıl Ordu, Milliyetçi taarruzu püskürtürken edindiği deneyimi savunma mevzilerinde ve birlik eğitiminde kullanıyor."
 westheia_PRC33_fourth_encirclement_desc:0 "Milliyetçi kollar ayrı yollardan ilerliyor. Zhu De ve Zhou Enlai, kuvvetlerimizi tek tek kolların üzerine yoğunlaştırarak çemberi dağıtmayı planlıyor."
 westheia_PRC33_long_march:0 "Uzun Yürüyüş'ü Başlat"
 westheia_PRC33_long_march_desc:0 "Kuşatma uzadıkça ikmal ve takviye bulmak güçleşiyor. Kızıl Ordu çekilme güzergâhlarını hazırlayıp Merkez Sovyet'ten çıkacak ve yeni bir üs arayacak."
 westheia_PRC33_march:0 "Uzun Yürüyüş"
 westheia_PRC33_march_desc:0 "Kızıl Ordu dağ geçitlerinde ilerlerken birlikleri beslemek ve yeniden toplamak güçleşiyor."
 westheia_PRC33_meet_fourth_front:0 "Dördüncü Cephe Ordusuyla Buluş"
 westheia_PRC33_meet_fourth_front_desc:0 "Birinci ve Dördüncü Cephe orduları nihayet birbirine ulaştı. Komutanlar şimdi hareketin hangi yöne devam edeceğini tartışıyor."
 westheia_PRC33_northwest_base:0 "Kuzeybatı Üssünü Kur"
 westheia_PRC33_northwest_base_desc:0 "Kızıl Ordu'yu yeniden örgütleyip Milliyetçi Çin ve Siçuan'la çatışmaya son vereceğiz. Shaanbei veya Yulin'de üs kurabildiysek karargâh kuzeye taşınacak. Ardından Komünist Çin'in ana odak ağacı açılacak."
 westheia_PRC33_rations:0 "Yerel Erzak Ağları"
 westheia_PRC33_rations_desc:0 "Köylerden gelen erzak, askerî taşıma kollarının üzerindeki yükü hafifletiyor."
 westheia_PRC33_rations_network:0 "Yerel Erzak Ağlarını Örgütle"
 westheia_PRC33_rations_network_desc:0 "Köy komiteleri yiyecek toplasın, kuryeler ve taşıyıcılar da erzağı Milliyetçi kontrol noktalarının çevresinden cepheye ulaştırsın."
 westheia_PRC33_reach_wuqi:0 "Wuqi'ye Ulaş"
 westheia_PRC33_reach_wuqi_desc:0 "Birinci Cephe Ordusu'nun öncüleri kuzey Shaanxi'deki Wuqi'ye ulaştı. Shaanbei veya Yulin Şansi'nin elindeyse bu bölgelerin devri için görüşebiliriz."
 westheia_PRC33_rearguard:0 "Artçı Birliklerini Örgütle"
 westheia_PRC33_rearguard_desc:0 "Bölgeyi tanıyan milisler, ana kuvvet yer değiştirirken geçitleri tutabilir ve Milliyetçi birliklerin ilerlemesini geciktirebilir."
 westheia_PRC33_reorganize_command:0 "Komutayı Yeniden Düzenle"
 westheia_PRC33_reorganize_command_desc:0 "Zunyi'den sonra Zhang Wentian parti yönetimini üstlenirken Mao, Zhou Enlai ve Wang Jiaxiang askerî harekâtı yönlendirmede daha etkin rol alıyor."
 westheia_PRC33_retreat_routes:0 "Kızıl Ordu'nun Geri Çekilme Hatlarını Hazırla"
 westheia_PRC33_retreat_routes_desc:0 "Yerel milisler geçitleri, sığlıkları ve yan yolları işaretlesin. Bir çekilme gerekirse ana kuvvet, erzak kollarını nereye yönlendireceğini bilsin."
 westheia_PRC33_retreat_routes_tt:0 "Xiang Nehri geçişinde verilen kayıpları ve toparlanma cezasını azaltır."
 westheia_PRC33_workshops:0 "Seyyar Atölyeleri Kur"
 westheia_PRC33_workshops_desc:0 "Sabit atölyeler kuşatma altında kolay hedef oluyor. Ustalarımız ele geçirilen tüfekleri küçük, taşınabilir atölyelerde onaracak."
 westheia_PRC33_xiang_crossing:0 "Xiang Nehri'ni Geç"
 westheia_PRC33_xiang_crossing_desc:0 "Milliyetçi birlikler Xiang Nehri üzerindeki geçitlere yaklaşıyor. Ana kuvveti hızla geçirmekle ikmal kollarını kurtarmak arasında karar vermeliyiz."
 westheia_PRC33_xiang_losses:0 "Xiang Geçişinin Kayıpları"
 westheia_PRC33_xiang_losses_desc:0 "Nehir geçişindeki dağınıklık yüzünden birliklerin yeniden toplanması zaman alacak."
 westheia_PRC33_xiang_losses_prepared:0 "Xiang Geçişinin Kayıpları"
 westheia_PRC33_xiang_losses_prepared_desc:0 "Artçı birliklerin bildiği geçitler, ikmal kollarının ana kuvvete yeniden katılmasını kolaylaştırdı."
 westheia_PRC33_zunyi_conference:0 "Zunyi Konferansı Kararlarını Kabul Et"
 westheia_PRC33_zunyi_conference_desc:0 "Politbüro, Beşinci Kuşatma'nın yenilgisini ve yürüyüşteki kayıpları Zunyi'de tartıştı. Konferansın kararlarını birliklerimize ulaştırıp yeni görev dağılımını uygulayalım."
 westheia_SOV33_snake_available_tt:0 "Troçki Meksika'da veya §Y$trotskyite_plot$§! ulusal ruhu aktif"
 westheia_SOV33_trotskyite_plot_weakened:0 "$trotskyite_plot$"
 westheia_SOV33_trotskyite_plot_weakened_desc:0 "Troçkist muhalefetin ülke içindeki bağlantıları zayıflatıldı. Buna rağmen eski güç mücadelelerinden kalan güvensizlik, hükûmetin kararlarını etkilemeye devam ediyor."
 westheia_SOV_1933_famine:0 "Sovyet Kıtlığı"
 westheia_SOV_1933_famine_1934:0 "Sovyet Kıtlığı"
 westheia_SOV_1933_famine_1934_desc:0 "Kitlesel açlığın en ağır dönemi geride kaldı. Nüfus kayıpları, iş gücü eksikliği ve tarımsal üretimdeki bozulma toparlanmayı yavaşlatıyor."
 westheia_SOV_1933_famine_1935:0 "Sovyet Kıtlığı"
 westheia_SOV_1933_famine_1935_desc:0 "Gıda arzı toparlanıyor. Kıtlıktan etkilenen bölgeler nüfus kayıplarının ve bozulan tarımsal üretimin sonuçlarını yaşamaya devam ediyor."
 westheia_SOV_1933_famine_desc:0 "Zorla kolektifleştirme ve ağır tahıl toplama kotaları, Ukrayna, Kazakistan, Kuzey Kafkasya ve Volga havzası başta olmak üzere geniş bölgelerde kitlesel açlığa yol açtı. Kırsal nüfus ağır kayıplar verirken iaşe krizi ekonomiyi zorluyor."
 westheia_SOV_1933_intervene_in_purge:0 "Dosyayı kapatın, görevlerine devam etsinler."
 westheia_SOV_1933_kirov_effect_tt:0 "Siyasi paranoya §R10§! artar. Haftalık paranoya artışı önceki hızının iki katına çıkar. §YParti Tasfiyeleri§! yerine §YDerinleşen Parti Tasfiyeleri§! gelir.\n§Yİstikrar§! ve §YSiyasi Güç Kazancı§! §R-%10§! olur. Siyasi danışman ve yasa maliyetleri §R+%66§! olur."
 westheia_SOV_1933_party_screening:0 "Parti Tasfiyeleri"
 westheia_SOV_1933_party_screening_desc:0 "Parti teşkilatları üyelerinin geçmişini ve bağlılığını incelemeye aldı. İhraçlar ve soruşturmalar idareyi yavaşlatıyor, yeni atamaları ve ekonomik kararları zorlaştırıyor."
 westheia_SOV_1933_repression_after_kirov:0 "Derinleşen Parti Tasfiyeleri"
 westheia_SOV_1933_repression_after_kirov_desc:0 "Kirov suikastının ardından soruşturmalar genişledi. Parti kadroları, devlet görevlileri ve subaylar üzerindeki baskı arttıkça atamalar ve yasa değişiklikleri daha fazla siyasi çaba gerektiriyor."
 westheia_SPR33_civil_war_countdown:0 "İç Savaş Tehlikesi"
 westheia_SPR33_civil_war_countdown_desc:0 "Siyasi kutuplaşma ve ordudaki komplolar ülkeyi çatışmaya sürüklemektedir. İç savaş hazırlıkları sırasında alınacak kararlar, ayaklanmanın ne kadar erken veya geç başlayacağını belirleyecektir."
 westheia_SPR33_civil_war_countdown_timeout_tt:0 "İspanya İç Savaşı patlak verecek ve seçtiğimiz siyasi yola ait seçenekler sunulacak."
 westheia_SPR33_civil_war_preparations:0 "Yaklaşan İspanya Krizi"
 westheia_SPR33_civil_war_preparations_desc:0 "Cumhuriyetin geleceği üzerindeki anlaşmazlıklar toplumu ve orduyu bölmektedir. Siyasi gerilimleri kontrol altına alamazsak bu mücadele açık bir iç savaşa dönüşecektir."
 westheia_SPR33_path_choice_title:0 "İspanya Yol Ayrımında"
 westheia_afghanistan_1933.1.a:0 "Kral öldü. Yaşasın Kral Zahir Şah!"
 westheia_afghanistan_1933.1.d:0 "Kral Muhammed Nadir Şah, Kabil’de öğrencilerin katıldığı bir tören sırasında silahlı saldırıya uğrayarak hayatını kaybetti. Saldırganın Abdülhalik adlı genç bir öğrenci olduğu bildiriliyor. Henüz dört yıl önce tahtı devralan hükümdarın ani ölümü, sarayda ve devlet idaresinde büyük bir sarsıntı yarattı.\n\nKraliyet ailesinin önde gelen üyeleri, bir iktidar boşluğu oluşmasını önlemek üzere Nadir Şah’ın on dokuz yaşındaki oğlu Muhammed Zahir Şah’ın etrafında birleşti. Genç hükümdar tahta çıkarken devlet işlerinde hanedanın deneyimli üyelerinin desteğine dayanacak. Afganistan, bir kez daha belirsizliğin gölgesinde hanedan düzeninin devamlılığını korumaya çalışıyor."
 westheia_afghanistan_1933.1.t:0 "Kral Nadir Şah Suikastı"
 westheia_afghanistan_focus_1933.1.a:0 "Afganistan uluslararası toplumdaki yerini alıyor."
 westheia_afghanistan_focus_1933.1.d:0 "Afganistan’ın Milletler Cemiyeti’ne kabul edilmesiyle Kabil yönetimi, uluslararası diplomaside yeni bir adım attı. Nadir Şah’ın ölümünden sonra tahta çıkan Kral Zahir Şah’ın hükûmeti, ülkenin bağımsızlığını ve egemenliğini çok taraflı diplomasi yoluyla güçlendirmeyi amaçlıyor.\n\nÜyelik, Afganistan’ın diğer devletlerle doğrudan temaslarını genişletmesi ve uluslararası görüşmelerde temsil edilmesi için yeni bir zemin oluşturuyor. Başbakan Muhammed Haşim Han yönetimi, bu gelişmeyi ülkenin dış dünyayla ilişkilerini sağlamlaştıran önemli bir başarı olarak değerlendiriyor."
 westheia_afghanistan_focus_1933.1.t:0 "Afganistan Milletler Cemiyeti’ne Katıldı"
 westheia_argentina_navy_1933.1.a:0 "Denizaltıları teslim alalım."
 westheia_argentina_navy_1933.1.b:0 "Bu masrafı üstlenmeyeceğiz."
 westheia_argentina_navy_1933.1.d:0 "İtalya'nın Taranto kentindeki Franco Tosi tersanesinde inşa edilen Santa Fe, Salta ve Santiago del Estero, Atlantik'i aşarak Buenos Aires'e ulaştı. Bu üç gemiyle donanmamız ilk denizaltı filosunu kurmaya hazırlanıyor. Ancak teslimatı kabul etmek, satın alma ve hizmete alma giderlerini de üstlenmemiz anlamına geliyor."
 westheia_argentina_navy_1933.1.t:0 "Tarantino Denizaltıları Buenos Aires'te"
 westheia_ast_succession_1933.1.a:0 "Curtin görevi devralsın."
 westheia_ast_succession_1933.1.d:0 "Başbakan James Scullin, giderek ağırlaşan sağlık sorunları nedeniyle İşçi Partisi liderliğinden ve hükûmetin başından ayrılacağını açıkladı. Büyük Buhran’ın yarattığı baskılar ve parti içindeki anlaşmazlıklarla geçen yıllar, Scullin’in sağlığını ve çalışma gücünü yıprattı.\n\nİşçi Partisi milletvekilleri, liderlik görevini John Curtin’e emanet etti. Curtin, Scullin’in yerine başbakanlığı üstlenerek hükûmetin çalışmalarını sürdürecek. Bu değişim, İşçi Partisi’nin yönetimine yeni bir liderlik kazandırıyor."
 westheia_ast_succession_1933.1.t:0 "Scullin Görevden Ayrılıyor"
 westheia_ast_succession_1933.2.a:0 "Avustralya önemli bir siyasetçisini kaybetti."
 westheia_ast_succession_1933.2.d.opposition:0 "Birleşik Avustralya Partisi lideri Joseph Lyons, geçirdiği kalp krizinin ardından Sidney’de hayatını kaybetti. Eski başbakanın ölümü, Büyük Buhran yıllarında Avustralya siyasetini şekillendiren önemli bir dönemin kapanışını simgeliyor.\n\nUAP’nin liderliğini Robert Menzies devralacak. Parti yeni lideriyle çalışmalarını sürdürecek."
 westheia_ast_succession_1933.2.d.ruling:0 "Başbakan Joseph Lyons, geçirdiği kalp krizinin ardından Sidney’de hayatını kaybetti. Büyük Buhran’ın çalkantılı yıllarında kurduğu Birleşik Avustralya Partisi’ni iktidara taşıyan Lyons, uzlaşmacı tutumu ve kamuoyundaki güçlü desteğiyle Avustralya siyasetinde belirleyici bir yer edinmişti.\n\nLyons’un ölümüyle UAP’nin ve hükûmetin liderliği Robert Menzies’e geçiyor. Avrupa ve Pasifik’te gerilim yükselirken yeni başbakan, ülkenin dış politikasını ve savunma hazırlıklarını yönetmek gibi ağır bir sorumluluk üstlenecek."
 westheia_ast_succession_1933.2.t:0 "Joseph Lyons Hayatını Kaybetti"
 westheia_aus_july_putsch_germany:0 "Avusturya’daki Nazi Darbesi"
 westheia_aus_july_putsch_italy:0 "Avusturya’nın Bağımsızlığına Destek"
 westheia_austria_1933.1.a:0 "Bu kadar abartacak ne var?"
 westheia_austria_1933.1.d:0 "Linz’de sosyal demokrat Schutzbund mensupları ile güvenlik güçleri arasında başlayan silahlı çatışmalar Viyana, Graz ve bazı sanayi bölgelerine yayıldı. İşçi mahallelerinde barikatlar kurulurken fabrikalarda üretim duruyor, sokaklarda silah sesleri yankılanıyor.\n\nYerel makamlar olayların kontrol altına alınabileceğini bildiriyor. Başkentten gelen haberler ise huzursuzluğun birkaç münferit çatışmayla sınırlı kalmayabileceğini gösteriyor."
 westheia_austria_1933.1.t:0 "Avusturya’da Şubat Çatışmaları"
 westheia_austria_1933.10.a:0 "Darbecileri sallandır!"
 westheia_austria_1933.10.d:0 "Asker üniforması giyen Avusturyalı Nasyonal Sosyalistler, Viyana’daki Federal Şansölyelik binasına baskın düzenledi. Saldırıda vurulan Şansölye Engelbert Dollfuss hayatını kaybetti. Devlet radyosunu da ele geçiren darbeciler, hükûmetin devrildiğini ilan ederek ülke çapında bir ayaklanma başlatmaya çalıştı.\n\nAncak Federal Ordu ve polis, darbecilere karşı harekete geçti. Başkentteki baskıncılar tecrit edilirken diğer bölgelerdeki ayaklanmalar da bastırıldı. Avusturya’nın bağımsızlığını korumaya kararlı olan Benito Mussolini, İtalyan birliklerini sınır hattına sevk ederek Berlin’e açık bir uyarı gönderdi.\n\nDarbe başarısız oldu; fakat şansölye öldü ve Almanya ile ilişkilerimiz ağır bir darbe aldı. Kurt Schuschnigg, hükûmetin başına geçerek düzeni yeniden sağlamakla görevlendiriliyor."
 westheia_austria_1933.10.t:0 "Viyana’da Temmuz Darbesi"
 westheia_austria_1933.11.a:0 "Viyana’daki darbe Avrupa’yı sarstı."
 westheia_austria_1933.11.d:0 "Avusturyalı Nasyonal Sosyalistlerin hükûmeti devirmek amacıyla başlattığı darbe girişimi, Federal Ordu ve polis kuvvetleri tarafından bastırıldı. Viyana’daki Federal Şansölyeliğe yapılan baskında Şansölye Engelbert Dollfuss öldürüldü; ülkenin çeşitli bölgelerindeki çatışmalar da yüzlerce can aldı. Radyodan duyurulan hükûmet değişikliği, darbecilerin umduğu desteği getirmedi.\n\nMussolini’nin Avusturya’nın bağımsızlığını destekleyerek sınıra asker sevk etmesi, Almanya ile İtalya arasındaki gerilimi artırdı. Dollfuss’un yerine Kurt Schuschnigg’in geçmesiyle Viyana’daki otoriter yönetim varlığını sürdürürken, başarısız darbenin iki ülke arasındaki güvensizliği uzun süre beslemesi bekleniyor."
 westheia_austria_1933.11.t:0 "Avusturya’da Nazi Darbesi Bastırıldı"
 westheia_austria_1933.2.a:0 "Vatan haini köpekleri öldürün!"
 westheia_austria_1933.2.b:0 "Uzlaşalım, bu kavga saçma."
 westheia_austria_1933.2.d:0 "12 Şubat’ta Linz’de sosyal demokrat Schutzbund milisleri ile hükûmet güçleri arasında başlayan çatışmalar Viyana’ya, Graz’a ve ülkenin sanayi merkezlerine yayıldı. Şansölye Engelbert Dollfuss’un parlamenter kurumları devre dışı bırakması ve muhalefete yönelik baskıları, uzun süredir biriken gerilimi açık silahlı direnişe dönüştürdü.\n\nFederal ordu, polis ve hükûmet yanlısı Heimwehr birlikleri sokaklarda denetimi sağlamaya çalışıyor. Dört gündür süren çatışmaların ardından hükûmetin önünde iki yol var: Muhalefeti zor kullanarak tasfiye etmek veya daha fazla kan dökülmeden siyasi uzlaşma aramak. Vereceğimiz karar, Mayıs ayı için tasarlanan anayasal düzenin de geleceğini belirleyecek."
 westheia_austria_1933.2.t:0 "Avusturya’nın Yol Ayrımı"
 westheia_austria_1933.3.a:0 "Avusturya’da parlamenter düzenin kapıları kapanıyor."
 westheia_austria_1933.3.d:0 "Avusturya’daki Şubat çatışmaları, Federal Ordu, polis ve Heimwehr birliklerinin müdahalesiyle sona erdi. Linz’de başlayan ve işçi mahallelerine yayılan direniş, Dollfuss hükûmetinin emriyle zor kullanılarak bastırıldı. Yüzlerce kişinin hayatını kaybettiği çatışmaların ardından Sosyal Demokrat İşçi Partisi ile bağlı örgütleri yasaklandı; muhalifler tutuklandı veya ülkeyi terk etmek zorunda kaldı.\n\nViyana hükûmeti otoritesini yeniden sağladığını ilan ediyor. Sosyal demokratların siyasi hayattan çıkarılması, Mayıs ayında yürürlüğe konulması tasarlanan otoriter ve korporatist anayasanın önündeki başlıca engellerden birini de ortadan kaldırdı."
 westheia_austria_1933.3.t:0 "Avusturya’da Sosyal Demokrat Muhalefet Ezildi"
 westheia_austria_1933.4.a:0 "Viyana’da uzlaşma için bir kapı aralandı."
 westheia_austria_1933.4.d:0 "Linz’de başlayan ve ülke geneline yayılan silahlı çatışmaların ardından Şansölye Engelbert Dollfuss, sosyal demokrat muhalefetle müzakere yolunu seçti. Hükûmetin geri adımı, çatışmaların daha da büyümesini önlerken Heimwehr çevrelerinde ve otoriter yönetim yanlılarında hoşnutsuzluğa yol açtı.\n\nSosyal demokrat örgütlerin topluca yasaklanması yerine siyasi hayata yeniden katılımları görüşülüyor. Mayıs ayı için hazırlanan otoriter anayasa tasarısı da uzlaşma arayışının gölgesinde kaldı. Avusturya’nın geleceği artık yalnızca hükûmet kararnameleriyle değil, zorlu siyasi pazarlıklarla şekillenecek."
 westheia_austria_1933.4.t:0 "Avusturya’da Şubat Uzlaşması"
 westheia_austria_air_purchase_1933.1.a:0 "Uçakları teslim alalım."
 westheia_austria_air_purchase_1933.1.b:0 "Bu alımdan vazgeçiyoruz."
 westheia_austria_air_purchase_1933.1.d:0 "İtalya’dan temin edilecek ilk beş Fiat CR.20 avcısı için hazırlıklar tamamlandı. Bu küçük parti, pilotlarımızın muharebe eğitimini ilerletecek ve hava birliklerimizin kuruluşuna temel oluşturacak. Uçaklar sivil havacılık faaliyetlerinin sağladığı örtü altında teslim alınabilir."
 westheia_austria_air_purchase_1933.1.t:0 "İtalyan Avcı Uçakları"
 westheia_authoritarian_populism:0 "Otoriter Popülizm"
 westheia_authoritarian_populism_desc:0 "§YOtoriter Popülizm§!\n\n\n\n\n\n\n\n£GFX_westheia_subtype_banner_populist\n\n\n\n\n\n\n\n\nSivil bir lider etrafında merkezileşen, ordunun desteğine ve toplumsal reform vaatlerine dayanan otoriter yönetim. Seçimle gelen kurumların sınırlı veya askıda olduğu bu düzende, iktidar halk adına hareket ettiğini savunurken devlet üzerindeki denetimini korur."
 westheia_balkan_pact_1933.1.a:0 "Balkanların güvenliği ortak sorumluluğumuzdur!"
 westheia_balkan_pact_1933.1.b:0 "Balkanların sorunlarından uzak durmalıyız."
 westheia_balkan_pact_1933.1.d:0 "Balkan devletleri arasındaki yakınlaşma, bölgenin güvenliği için daha kalıcı bir düzen kurma fırsatı doğurdu. Avrupa'da sınırların yeniden çizilmesini isteyen sesler yükselirken Ankara, mevcut sınırların korunmasını ve anlaşmazlıkların barışçı yollarla çözülmesini ortak bir temele bağlamak istiyor.\n\nYunanistan, Romanya, Yugoslavya ve Bulgaristan'a sunulacak teklif, Balkan ülkelerini birbirine yaklaştırmayı amaçlıyor. Ekonomik bağların kuvvetlenmesi de bu iş birliğini destekleyecektir. Ancak bütün hükûmetlerin mevcut sınır düzenine aynı gözle bakmadığı açık. Türkiye bu girişimin öncülüğünü üstlenmeli mi?"
 westheia_balkan_pact_1933.1.t:0 "Balkan Paktı İçin Bir Girişim"
 westheia_balkan_pact_1933.2.d:0 "Türkiye, Balkanlarda mevcut sınırları koruyacak ve bölge devletleri arasındaki iş birliğini güçlendirecek bir pakt teklif etti. Ankara'yla son yıllarda gelişen ilişkilerimiz, geçmişteki düşmanlıkların yerini karşılıklı güvene bırakabileceğini gösteriyor.\n\nAtina için bu girişim, sınır güvenliğini sağlamlaştırmanın ve komşularla ticari bağları artırmanın bir yolu olabilir. Bununla birlikte ortak hareket etme kararı, diğer Balkan devletlerinin kaygılarını da dış politikamızda hesaba katmamızı gerektirecektir. Teklifi kabul edecek miyiz?"
 westheia_balkan_pact_1933.2.t:0 "Ankara'dan Balkan Paktı Teklifi"
 westheia_balkan_pact_1933.3.d:0 "Türk hükûmeti, Balkan devletlerini mevcut sınır düzeninin korunması etrafında bir araya getirecek bir pakt öneriyor. Küçük Antant'la sürdürülen iş birliğinin yanında, güney komşularımızla daha yakın ilişkiler kurmak Romanya'nın bölgedeki konumunu güçlendirebilir.\n\nTicari bağların geliştirilmesi ve diplomatik dayanışma, Bükreş'in sınırların değiştirilmesine yönelik talepler karşısında aradığı desteği artıracaktır. Ankara'nın girişimine katılacak mıyız?"
 westheia_balkan_pact_1933.3.t:0 "Ankara'dan Balkan Paktı Teklifi"
 westheia_balkan_pact_1933.4.d:0 "Ankara, Balkan ülkelerinin güvenliğini ortak bir mesele olarak ele alan yeni bir pakt teklifini Belgrad'a iletti. Savaş sonrasında oluşan sınır düzeninin korunması, Yugoslavya'nın bölge siyasetinin temel hedeflerinden biri olmaya devam ediyor.\n\nTürkiye, Yunanistan ve Romanya'yla kurulacak daha sıkı bağlar, mevcut diplomatik ortaklıklarımızı tamamlayabilir. Artan ticaret de bu yakınlaşmayı sağlamlaştıracaktır. Hükûmetimiz, Balkan iş birliğinin bir parçası olmayı kabul edecek mi?"
 westheia_balkan_pact_1933.4.t:0 "Ankara'dan Balkan Paktı Teklifi"
 westheia_balkan_pact_1933.5.d:0 "Türkiye, Bulgaristan'ı Balkan ülkeleri arasında oluşturulacak yeni bir pakta katılmaya çağırıyor. Teklif, komşularımızla ticari ilişkilerin geliştirilmesi ve bölgesel iş birliğinin güçlendirilmesi için bir fırsat sunuyor.\n\nNe var ki mevcut sınır düzeninin korunması, girişimin temelinde yer alıyor. Sofya'da savaş sonrası antlaşmaların yarattığı kayıpları kabullenmek istemeyen çevreler, böyle bir taahhüdü millî taleplerimizden vazgeçmek olarak görüyor. Uzlaşmayı mı seçeceğiz, yoksa bu düzenin dışında mı kalacağız?"
 westheia_balkan_pact_1933.5.t:0 "Ankara'dan Balkan Paktı Teklifi"
 westheia_balkan_pact_1933.6.a:0 "Balkanlarda yeni bir diplomatik girişim."
 westheia_balkan_pact_1933.6.d:0 "Ankara hükûmeti, Balkanlarda güvenliği ve mevcut sınır düzenini korumayı amaçlayan bir pakt için diplomatik girişim başlattı. Türkiye'nin teklifi Yunanistan, Romanya, Yugoslavya ve Bulgaristan'a iletildi.\n\nBölge devletleri arasındaki yakınlaşmayı kalıcı hâle getirmeyi amaçlayan girişim, karşılıklı ticaretin geliştirilmesini de öngörüyor. Ancak savaş sonrası sınırlar konusundaki görüş ayrılıkları, bütün başkentlerin aynı çizgide buluşmasını güçleştiriyor. Avrupa, Balkanların kendi güvenliğini birlikte sağlama arayışını dikkatle izliyor."
 westheia_balkan_pact_1933.6.t:0 "Türkiye'den Balkan Paktı Girişimi"
 westheia_balkan_pact_1933.accept:0 "Balkan Paktı'na katılıyoruz."
 westheia_balkan_pact_1933.reject:0 "Bu pakta katılmayacağız."
 westheia_bel_government_1933.1.a:0 "Theunis hükümeti göreve başlasın."
 westheia_bel_government_1933.1.d:0 "Ekonomik bunalımın ağırlaştırdığı mali sorunlar ve deflasyon politikasına yönelik tepkiler karşısında Charles de Broqueville'in hükümeti görevinden çekildi. Yeni kabineyi kurmakla görevlendirilen Georges Theunis, bütçeyi ve frangın değerini koruma çabasını sürdürecek. Katolikler ve liberaller arasındaki iş birliği devam ederken, işsizlik ve bankacılık sisteminin kırılganlığı yeni hükümetin önündeki en ağır sorunlar olmayı sürdürüyor."
 westheia_bel_government_1933.1.t:0 "Hükümet İstifa Ediyor"
 westheia_bel_government_1933.2.a:0 "Van Zeeland yeni hükümeti yönetecek."
 westheia_bel_government_1933.2.d:0 "Georges Theunis'in hükümeti, bankacılık krizinin ve franga yönelik baskının giderek ağırlaştığı bir ortamda yerini Paul van Zeeland başkanlığındaki ulusal birlik kabinesine bırakıyor. Katolikler, liberaller ve sosyalistleri bir araya getiren yeni hükümet, ekonomik toparlanmayı sağlamak ve mali sisteme güveni yeniden kazandırmak için farklı bir program hazırlıyor."
 westheia_bel_government_1933.2.t:0 "Hükümet İstifa Ediyor"
 westheia_bolivia_1933.1.a:0 "Tejada Sorzano cumhurbaşkanlığını devralsın."
 westheia_bolivia_1933.1.d:0 "Cumhurbaşkanı Daniel Salamanca ile ordunun üst komuta kademesi arasında uzun süredir devam eden anlaşmazlıklar, Villamontes’te açık bir iktidar mücadelesine dönüştü. Salamanca’nın askerî komutayı yeniden düzenleme girişimine karşı çıkan subaylar, cumhurbaşkanının bulunduğu binayı kuşatarak onu istifaya zorladı.\n\nOrdunun müdahalesiyle Salamanca’nın yönetimi sona ererken cumhurbaşkanlığı makamını yardımcısı José Luis Tejada Sorzano devralıyor. Liberal Parti mensubu Tejada, devletin sivil kurumlarında devamlılığı sağlamaya çalışacak; ancak ordunun siyasi ağırlığı, yeni yönetimin üzerinde belirleyici bir baskı oluşturuyor."
 westheia_bolivia_1933.1.t:0 "Villamontes Darbesi"
 westheia_brazil_air_1933.1.a:0 "Siparişi tamamlayın; avcılarımızı teslim alalım."
 westheia_brazil_air_1933.1.b:0 "Bu harcamayı karşılayamayız; siparişi iptal edin."
 westheia_brazil_air_1933.1.d:0 "Amerika Birleşik Devletleri’nden sipariş edilen dokuz Boeing 267 avcısının teslim işlemlerini tamamlayabiliriz. İlk Boeing partisinden edinilen tecrübe, yeni uçakların kara havacılığına katılmasını kolaylaştıracaktır. Satın almayı tamamlamak ülkenin kaynaklarının bir bölümünü dış siparişe ayırmamızı gerektiriyor."
 westheia_brazil_air_1933.1.t:0 "Boeing Avcı Siparişimiz Hazır"
 westheia_brazil_air_1933.2.a:0 "Uçakları birliklerine teslim edin."
 westheia_brazil_air_1933.2.d:0 "Yabancı uçak alımlarıyla güçlenen kara havacılığımız, Vought V-65B Corsair’leri keşif ve hafif bombardıman birliklerine dağıtıyor. Yeni uçaklar Rio de Janeiro, Porto Alegre ve Curitiba’daki teşkilatlanmayı destekleyecek ve ordunun hava desteğini genişletecektir."
 westheia_brazil_air_1933.2.t:0 "Yeni Corsair’ler Birliklere Dağıtılıyor"
 westheia_brazil_navy_1933.1.a:0 "Minas Geraes yeniden denize açılsın!"
 westheia_brazil_navy_1933.1.d:0 "Rio de Janeiro tersanesindeki kapsamlı modernizasyonun ardından Minas Geraes yeniden filoya katılıyor. Kazanların yenilenmesi, ana topların yükseliş açısının artırılması ve ateş idare donanımının geliştirilmesi, yaşlı zırhlının hizmet ömrünü uzattı. São Paulo ile birlikte donanmamızın ağır topçu gücünü yeniden oluşturacak."
 westheia_brazil_navy_1933.1.t:0 "Minas Geraes Yeniden Filoda"
 westheia_brazil_politics_1933.1.a:0 "Vargas görevde kalıyor; yeni bir dönem başlıyor."
 westheia_brazil_politics_1933.1.d:0 "Yeni anayasanın 16 Temmuz’da ilan edilmesinin ardından Kurucu Meclis, Getúlio Vargas’ı cumhurbaşkanı seçti. Vargas 175 oy alırken en güçlü rakibi Borges de Medeiros 59 oyda kaldı.\n\n1930’dan beri ülkeyi yöneten geçici hükümet yerini anayasal bir düzene bırakıyor. Vargas görevde kalacak ve 20 Temmuz’da yeni dönem için yemin edecek. Meclisin kabul ettiği çerçeve, merkezî yönetim ile eyaletlerin yetkileri arasındaki mücadeleyi sona erdirmese de iktidara anayasal bir dayanak sağlıyor."
 westheia_brazil_politics_1933.1.t:0 "Vargas Anayasal Cumhurbaşkanı Seçildi"
 westheia_brazil_politics_1933.2.a:0 "Garnizonlar uyarılsın, hükümet birlikleri harekete geçsin."
 westheia_brazil_politics_1933.2.d:0 "Natal’deki 21. Avcı Taburu içinde başlayan askerî ayaklanma, yerel yönetimi sarsıyor. İsyancılar Aliança Nacional Libertadora adına hareket ettiklerini ilan ediyor. Mart ayında kurulan ve Temmuz’da kapatılan bu cephe çevresindeki gerilim artık silahlı bir çatışmaya dönüşmüş durumda.\n\nHükümet güvenilir birlikleri harekete geçirirken başka garnizonlara da uyarı gönderiyor. İsyanın yayılma ihtimali, başkentte olağanüstü yetkiler talep edilmesine yönelik baskıyı artırıyor."
 westheia_brazil_politics_1933.2.t:0 "Natal’de Komünist Ayaklanma"
 westheia_brazil_politics_1933.3.a:0 "Olağanüstü hal ilan edilsin."
 westheia_brazil_politics_1933.3.d:0 "Natal’de 23 Kasım’da başlayan ayaklanmayı ertesi gün Recife çevresindeki askerî kalkışma izledi. Hükümet, hareketin başka garnizonlara yayılmasından endişe ediyor.\n\nKongrenin 25 Kasım’da verdiği yetkiye dayanarak Vargas, bugün bütün ülkede otuz günlük sıkıyönetim ilan eden 457 sayılı kararnameyi çıkardı. İsyancıların takibi için alınan önlemler tutuklama ve soruşturmaları genişletirken, muhalefet olağanüstü yetkilerin yalnızca silahlı isyancılara karşı kullanılacağından emin değil. Bu geçici tedbirlerin ne kadar süreceği yeni bir siyasal mücadele konusu hâline geliyor."
 westheia_brazil_politics_1933.3.t:0 "Ülke Çapında Olağanüstü Hal"
 westheia_britain_1933.1.a:0 "Ulusal Hükûmet Baldwin’in liderliğinde devam edecek."
 westheia_britain_1933.1.d:0 "1931 mali krizinin ardından kurulan Ulusal Hükûmete başkanlık eden Ramsay MacDonald, sağlığının bozulması ve yıllardır süren ağır çalışma temposu nedeniyle başbakanlıktan ayrılıyor. Ekonomik bunalım sırasında partiler arası iş birliğini savunan MacDonald’ın kendi İşçi Partisi ile yolları ayrılmış, hükûmet giderek Muhafazakârların parlamento desteğine dayanır hâle gelmişti.\n\nKral V. George, Ulusal Hükûmetin başına Muhafazakâr Parti lideri Stanley Baldwin’i atadı. MacDonald kabinede Konsey Lord Başkanı olarak görev yapmayı sürdürecek. Böylece koalisyonun devamlılığı korunurken ülke, yaklaşan genel seçimlere Baldwin’in liderliğinde hazırlanacak."
 westheia_britain_1933.1.t:0 "Ramsay MacDonald’ın İstifası"
 westheia_bulgarian_government_1933.1.a:0 "Yeni hükümet görevine başlasın."
 westheia_bulgarian_government_1933.1.d:0 "Kral III. Boris, Georgi Kyoseivanov'u yeni hükümeti kurmakla görevlendirdi. Deneyimli diplomat, Andrey Toşev'in ardından başbakanlığı üstlenirken devlet yönetiminde sarayın belirleyici konumu sürüyor.\n\nYeni kabine bir seçim sonucunda göreve gelmiyor. Siyasi partilerin faaliyetleri üzerindeki kısıtlamalar devam ederken Kyoseivanov, hükümdarın güvenine dayanan partisiz yönetimi sürdürecek ve dış ilişkilerde Bulgaristan'ın hareket alanını genişletmeye çalışacak."
 westheia_bulgarian_government_1933.1.t:0 "Kyoseivanov Hükümeti Kuruluyor"
 westheia_burma_1933.1.a:0 "Ayrılmayı önerelim; son kararı Hindistan versin."
 westheia_burma_1933.1.b:0 "Birlikte kalmalarını önerelim; son karar Hindistan’ın."
 westheia_burma_1933.1.d:0 "1935 Burma Yönetim Yasası uyarınca Burma’nın Hindistan’dan ayrılarak doğrudan Londra’ya bağlı bir sömürge hâline getirilmesi için hazırlıklar tamamlandı. Ancak bölgenin idaresini devralacak makamlarla son düzenlemeler yapılmadan önce Hindistan Genel Valiliği’nin görüşü alınacaktır.\n\nLondra, ayrılmayı tavsiye edebilir veya mevcut idari yapının korunmasını önerebilir. Nihai karar Hindistan idaresine bırakılacaktır."
 westheia_burma_1933.1.t:0 "Burma’nın Hindistan’dan Ayrılması"
 westheia_burma_1933.2.a:0 "Burma’nın ayrı bir idareye geçmesini kabul ediyoruz."
 westheia_burma_1933.2.b:0 "Burma, Hindistan idaresinde kalacak."
 westheia_burma_1933.2.d_keep:0 "Londra, Burma’nın Hindistan idaresi altında kalmasını öneriyor; ancak nihai kararı bize bırakmıştır.\n\nBölgeyi elimizde tutarak mevcut yatırımları ve idari bağları koruyabiliriz. Ayrılmayı kabul etmemiz hâlinde Burma’daki topraklarımız ve üzerlerindeki tesisler, doğrudan Britanya’ya bağlı yeni sömürge yönetimine geçecektir."
 westheia_burma_1933.2.d_separate:0 "Londra, Burma’nın Hindistan’dan ayrılarak kraliyete bağlı ayrı bir sömürge idaresine dönüştürülmesini öneriyor. Britanya hükümeti nihai kararı bize bırakmıştır.\n\nAyrılmayı kabul edersek Burma’daki topraklarımız ve üzerlerindeki tesisler yeni yönetime geçecektir. Mevcut idareyi korumayı seçersek bölge Hindistan’ın bir parçası olarak kalacaktır."
 westheia_burma_1933.2.t:0 "Burma’nın Geleceği"
 westheia_canada_1933.1.a:0 "Polisle bastırın."
 westheia_canada_1933.1.b:0 "Belki de haklılardır."
 westheia_canada_1933.1.d:0 "British Columbia'daki yardım kamplarında çalışan işsizler, düşük ödemeler ve ağır yaşam koşullarına karşı yürüttükleri protestoları başkente taşımaya karar verdi. Vancouver'dan doğuya giden yük trenlerine binen göstericiler, Ottawa'da hükümete iş ve insanca ücret taleplerini duyurmak istiyor.\n\nBüyük Buhran boyunca biriken hoşnutsuzluk, yardım kampları politikasının geleceğini tartışmaya açıyor. Hükümet, hareketi polis gücüyle durdurmak ile talepleri kabul ederek yardım düzenini genişletmek arasında karar vermek zorunda."
 westheia_canada_1933.1.t:0 "Ottawa Yürüyüşü"
 westheia_canada_1933.2.a:0 "Karşılıklı ticareti geliştirelim."
 westheia_canada_1933.2.b:0 "Mevcut düzeni koruyacağız."
 westheia_canada_1933.2.d:0 "Ottawa hükümeti, iki ülke arasında karşılıklı ticareti kolaylaştıracak bir anlaşma öneriyor. Büyük Buhran'ın ardından daralan pazarları yeniden açmak ve gümrük engellerini hafifletmek, sınırın iki tarafındaki üreticilere de yeni imkânlar sağlayabilir.\n\nTeklifi kabul etmek Kanada ile ticari ilişkilerimizi güçlendirecek; reddetmek ise mevcut düzenin sürmesi anlamına gelecek."
 westheia_canada_1933.2.t:0 "Kanada'dan Ticaret Anlaşması Teklifi"
 westheia_canada_1933.3.a:0 "İki ülke için de kazançlı bir anlaşma."
 westheia_canada_1933.3.d:0 "Washington hükümeti teklifimizi kabul etti. Karşılıklı ticaret anlaşmasının yürürlüğe girmesiyle Kanada ve Amerika Birleşik Devletleri arasındaki ticari bağlar güçleniyor. Üreticilerimiz için Amerikan pazarına uzanan yeni bir iş birliği dönemi başlıyor."
 westheia_canada_1933.3.t:0 "ABD Ticaret Anlaşmasını Kabul Etti"
 westheia_canada_1933.4.a:0 "Başka fırsatlar arayacağız."
 westheia_canada_1933.4.d:0 "Washington hükümeti, karşılıklı ticareti geliştirmek üzere sunduğumuz anlaşmayı kabul etmedi. Görüşmeler sonuçsuz kaldığından iki ülke arasında yeni bir ticaret anlaşması yürürlüğe girmeyecek."
 westheia_canada_1933.4.t:0 "ABD Ticaret Anlaşmasını Reddetti"
 westheia_canada_1933.5.a:0 "Mackenzie King yeni hükümeti kursun."
 westheia_canada_1933.5.d:0 "Büyük Buhran'ın gölgesinde yapılan federal seçimler, Bennett hükümeti için ağır bir yenilgiyle sonuçlandı. İşsizlik, ekonomik sıkıntılar ve hükümetin yardım politikalarına yönelik tepkiler karşısında seçmenler değişimden yana oy kullandı.\n\nWilliam Lyon Mackenzie King'in Liberal Partisi, Avam Kamarasında çoğunluğu elde ederek hükümeti kurma yetkisini kazandı. Bennett'in reform programı yerini yeni hükümetin politikalarına bırakırken Kanada'da Liberal yönetim yeniden başlıyor."
 westheia_canada_1933.5.t:0 "1935 Federal Seçimleri"
 westheia_cardinal:0 "Kardinal"
 westheia_china_air_1933.1.a:0 "Uçakları teslim alalım."
 westheia_china_air_1933.1.b:0 "Alımdan vazgeçelim."
 westheia_china_air_1933.1.d:0 "Amerikan Curtiss-Wright şirketi, elli Hawk II avcı uçağının sevkiyatını tamamlamaya hazır. Bu uçaklar, modern avcı sayısı az olan hava kuvvetlerimizi güçlendirecek. Bedelini karşılamak için önümüzdeki yıl bütçeden pay ayırmamız gerekecek."
 westheia_china_air_1933.1.t:0 "Curtiss Hawk II Teslimatı"
 westheia_china_air_1933.2.a:0 "Sipariş tamamlandı."
 westheia_china_air_1933.2.d:0 "Nanjing hükûmeti elli Curtiss Hawk II avcı uçağını teslim aldı. Sipariş, Amerikan havacılık sanayisine bir yıllık ek gelir sağlayacak."
 westheia_china_air_1933.2.t:0 "Çin’e Hawk II İhracatı"
 westheia_china_politics_1933.1.a:0 "Kuomintang'ın birliğini koruyalım."
 westheia_china_politics_1933.1.b:0 "Yönetimi sivillere açmanın vakti geldi."
 westheia_china_politics_1933.1.c:0 "Muhalefeti sindirip otoriteyi merkezde toplayalım."
 westheia_china_politics_1933.1.d:0 "Kuomintang yöneticileri Nanjing'deki parti merkezinde toplu fotoğraf çektirdikten sonra silah sesleri duyuldu. Yürütme Yuanı Başkanı Wang Jingwei yaralandı ve hastaneye kaldırıldı. Chiang Kai-shek saldırıdan yara almadan kurtuldu. Japonya'nın Kuzey Çin'deki baskısı artarken, parti yönetiminde hükümetin bundan sonra nasıl hareket edeceği tartışılıyor."
 westheia_china_politics_1933.1.t:0 "Wang Jingwei'ye Suikast Girişimi"
 westheia_china_politics_1933.2.a:0 "Fujian'da merkezî otoriteyi yeniden sağlayacağız."
 westheia_china_politics_1933.2.d:0 "Şanghay'da Japon kuvvetlerine karşı savaşan 19. Yol Ordusu, Fujian'da Nanjing'e başkaldırdı. Ordunun önderleri Fuzhou'da rakip bir hükümet kurmak üzere harekete geçti ve Jiangxi'deki komünistlerle temas kurdu. Limanlar ve ikmal yolları üzerindeki mücadele eyaletteki ticareti ve askerî sevkiyatı aksatıyor."
 westheia_china_politics_1933.2.t:0 "Fujian Ayaklanması"
 westheia_china_politics_1933.3.a:0 "Ateşkesi imzalayalım."
 westheia_china_politics_1933.3.b:0 "Teklifi reddedin."
 westheia_china_politics_1933.3.d:0 "Nanjing hükümeti, Jehol'daki harekâtın ardından Çin Seddi çevresindeki çarpışmaları durdurmak için Tanggu'ya bir heyet gönderdi. Japon komutanlığının önünde bir ateşkes metni var."
 westheia_china_politics_1933.3.t:0 "Çin'den Tanggu Ateşkesi Teklifi"
 westheia_china_politics_1933.4.a:0 "Birliklerimizi toparlayalım."
 westheia_china_politics_1933.4.d:0 "Japon komutanlığı Tanggu'daki ateşkes teklifimizi kabul etti. Sınırda kazanılan zaman, birliklerimizi toparlamamıza olanak sağlayacak."
 westheia_china_politics_1933.4.t:0 "Tanggu Ateşkesi İmzalandı"
 westheia_china_politics_1933.5.a:0 "Sınırdaki hazırlıklar sürsün."
 westheia_china_politics_1933.5.d:0 "Japon komutanlığı heyetimizin ateşkes teklifini reddetti. Çin Seddi çevresindeki birliklerimiz teyakkuzda kalacak."
 westheia_china_politics_1933.5.t:0 "Japonya Tanggu Teklifini Reddetti"
 westheia_collaboration_administration:0 "Sömürge Yönetimi"
 westheia_collaboration_administration_desc:0 "§YSömürge Yönetimi§!\n\n\n\n\n\n\n\n\n\n\n\n£GFX_westheia_subtype_banner_collaboration\n\n\n\n\n\n\n\n\n\n\n\n\nİşgalci güçle işbirliği temelinde kurulan ve dış politikası ile yönetimi bağlı bulunduğu devletin denetiminde olan hükümet."
 westheia_collaboration_communism:0 "Sömürge Yönetimi"
 westheia_collaboration_communism_desc:0 "§YSömürge Yönetimi§!\n\n\n\n\n\n\n\n\n\n\n\n£GFX_westheia_subtype_banner_collaboration\n\n\n\n\n\n\n\n\n\n\n\n\nİşgalci güçle işbirliği temelinde kurulan ve bağlı bulunduğu devletin denetiminde yönetilen hükümet."
 westheia_collaboration_fascism:0 "Sömürge Yönetimi"
 westheia_collaboration_fascism_desc:0 "§YSömürge Yönetimi§!\n\n\n\n\n\n\n\n\n\n\n\n£GFX_westheia_subtype_banner_collaboration\n\n\n\n\n\n\n\n\n\n\n\n\nİşgalci güçle işbirliği temelinde kurulan ve bağlı bulunduğu devletin denetiminde yönetilen hükümet."
 westheia_colombia_1933.1.a:0 "Yeni cumhurbaşkanı görevini devralsın."
 westheia_colombia_1933.1.d:0 "Enrique Olaya Herrera’nın dört yıllık görev süresi sona ererken başkent Bogotá, yeni cumhurbaşkanı Alfonso López Pumarejo’nun göreve başlamasına hazırlanıyor. Olaya’nın ulusal uzlaşma siyaseti, uzun muhafazakâr iktidarın ardından liberal yönetimin temellerini atmıştı. Şimdi cumhurbaşkanlığı makamı, Liberal Parti’nin reform yanlısı kanadının önde gelen isimlerinden López’e devrediliyor.\n\nYeni yönetim, devletin iktisadi ve toplumsal hayattaki rolünü yeniden tanımlama, eğitimi geliştirme ve kırsal kesimin sorunlarına çözüm arama sözü veriyor. Barışçıl devir teslim, liberal yönetimde devamlılık sağlarken Kolombiya’nın siyasi hayatında daha kapsamlı değişikliklerin de habercisi olabilir."
 westheia_colombia_1933.1.t:0 "Alfonso López Pumarejo Göreve Başlıyor"
 westheia_colonial_administration:0 "Koloniyel Yönetim"
 westheia_colonial_administration_desc:0 "§YKoloniyel Yönetim§!\n\n\n\n\n\n\n\n£GFX_westheia_subtype_banner_colonial\n\n\n\n\n\n\n\n\nBir sömürgeyi bağlı bulunduğu devlet adına yöneten, siyasi yetkisini ve idari otoritesini bu devletten alan hükümet."
 westheia_colonial_communism:0 "Koloniyel Yönetim"
