 westheia_congo_1933.1.a:0 "Genel valilik görevini Ryckmans devralsın."
 westheia_congo_1933.1.d:0 "Auguste Tilkens’in genel valilik dönemi sona ererken Belçika hükûmeti, Kongo’nun idaresini Pierre Ryckmans’a devretme kararı aldı. Sömürge hizmetinde ve Ruanda-Urundi idaresinde deneyim kazanmış olan Ryckmans, şimdi Belçika Kongosu’nun genel valiliğini üstlenecek.\n\nYeni genel vali, ekonomik bunalımın etkileriyle karşı karşıya bulunan geniş bir sömürge yönetimini devralıyor. İdari makamlar ve işletmeler yeni yönetimin önceliklerini beklerken, Léopoldville’deki görev değişikliği Belçika egemenliği ve mevcut idari düzen çerçevesinde gerçekleşecek."
 westheia_congo_1933.1.t:0 "Kongo’ya Yeni Genel Vali"
 westheia_constitutional_monarchy:0 "Meşruti Monarşi"
 westheia_constitutional_monarchy_desc:0 "§YMeşruti Monarşi§!\n\n\n\n\n\n\n\n£GFX_westheia_subtype_banner_constitutional\n\n\n\n\n\n\n\n\nHükümetin demokratik kurumlarla yönetildiği, hükümdarın yetkilerinin anayasa ile sınırlandırıldığı monarşi."
 westheia_czechoslovakia_1933.1.a:0 "Milan Hodža hükûmeti devralsın."
 westheia_czechoslovakia_1933.1.d:0 "Jan Malypetr’in başbakanlıktan ayrılma talebi Cumhurbaşkanı tarafından kabul edildi. Yeni hükûmeti kurmakla, Tarım Bakanı Milan Hodža görevlendirildi. Böylece başbakanlık, cumhuriyetin parlamenter usulleri içinde el değiştiriyor.\n\nEkonomik bunalımın etkileri ve ülkenin farklı siyasi çevreleri arasındaki anlaşmazlıklar sürerken Hodža, koalisyonun desteğini korumak ve devlet idaresinde devamlılığı sağlamak zorunda. Prag’daki yeni hükûmet, yaklaşan sorunlara karşı çalışma programını hazırlamaya başlıyor."
 westheia_czechoslovakia_1933.1.t:0 "Prag’da Hükûmet Değişikliği"
 westheia_czechoslovakia_1933.2.a:0 "Cumhuriyetin mirası Beneš'e emanet."
 westheia_czechoslovakia_1933.2.d:0 "Çekoslovakya'nın ilk cumhurbaşkanı Tomáš Garrigue Masaryk, ilerleyen yaşı ve bozulan sağlığı nedeniyle görevinden çekildiğini açıkladı. Büyük Savaş sırasında bağımsızlık davasını dünyaya duyuran ve cumhuriyetin kuruluşuna öncülük eden devlet adamı, artık makamının gerektirdiği sorumlulukları yerine getiremediğini kabul ediyor.\n\nMasaryk'in ayrılışı, Prag'da bir dönemin sonunu işaret ediyor. Cumhuriyetin kuruluşundan beri yanında yer alan Edvard Beneš, onun siyasi mirasını sürdürmek üzere öne çıkarken, Masaryk'in adı ulusun birliğinin ve bağımsızlığının simgesi olarak yaşamaya devam edecek."
 westheia_czechoslovakia_1933.2.t:0 "Kurucu Cumhurbaşkanı Görevden Ayrılıyor"
 westheia_danzig.1.a:0 "Danzig üzerindeki haklarımızdan vazgeçelim."
 westheia_danzig.1.b:0 "Ültimatomu reddediyoruz."
 westheia_danzig.1.d:0 "Berlin’den gelen nota, Danzig’deki uygulamalarımızı Alman halkına karşı bir baskı olarak nitelendiriyor. Alman hükümeti, şehirde yaşayan Almanları koruduğunu ileri sürerek Polonya’nın Özgür Şehir üzerindeki haklarından derhâl vazgeçmesini talep ediyor.\n\nBu talebi kabul etmek, Danzig’i nüfuzumuzdan çıkaracak ve şehrin Berlin ile birleşmesinin önünü açacaktır. Reddetmek ise Almanya’ya aradığı müdahale bahanesini verebilir. Şimdi karar vermeliyiz: Danzig uğruna Berlin’le karşı karşıya gelmeye hazır mıyız?"
 westheia_danzig.1.t:0 "Berlin’den Danzig Ültimatomu"
 westheia_danzig.10.a:0 "Yeni bir kriz daha."
 westheia_danzig.10.d:0 "Danzig’de artan gerilimin ardından Alman hükümeti Varşova’ya bir ültimatom iletti. Berlin, şehirdeki Almanları koruduğunu ileri sürerek Polonya’nın Özgür Şehir üzerindeki haklarından vazgeçmesini istiyor. Polonya’dan gelecek yanıt beklenirken Avrupa başkentleri, bu anlaşmazlığın daha büyük bir çatışmaya dönüşmesinden endişe duyuyor."
 westheia_danzig.10.t:0 "Berlin’den Danzig Talebi"
 westheia_danzig.2.a:0 "Gelişmeleri yakından izleyin."
 westheia_danzig.2.d:0 "Polonya, Danzig’deki özel haklarını genişletmek için bir baskı kampanyası başlattı. Varşova önümüzdeki 365 gün içinde Nazi Partisini Yasakla odağını tamamlayamazsa faşist hükümetimiz bu durumu bir müdahale tehdidine dönüştürebilecek."
 westheia_danzig.2.t:0 "Danzig’de Polonya Baskısı"
 westheia_danzig.3.a:0 "Varşova’nın yanıtını bekliyoruz."
 westheia_danzig.3.d:0 "Varşova, Danzig’de Nazi Partisini yasaklama sürecini zamanında tamamlayamadı. Hükümetimiz, “Danzig’deki Almanları korumak” söylemiyle Polonya’nın şehir üzerindeki haklarından vazgeçmesini istiyor. Kabul hâlinde Danzig bağımsız olacak; Almanya daha sonra ilgili talep odaklarından birini tamamladığında şehir Almanya’ya katılacak. Ret hâlinde Polonya’ya karşı savaş hedefi kazanacağız."
 westheia_danzig.3.t:0 "Danzig Krizinde Süre Doldu"
 westheia_danzig.30.a:0 "Toprak taleplerini kabul edelim."
 westheia_danzig.30.b:0 "Talebi reddediyoruz."
 westheia_danzig.30.d:0 "Berlin’den gelen nota yalnız Danzig’in geleceğiyle sınırlı değil. Alman hükümeti, Gdynia ve Poznan’ın da Alman yönetimine bırakılmasını talep ederek Doğu Prusya ile Reich arasında kesintisiz bir bağlantı kurulmasını istiyor.\n\nBu taleplerin kabulü, Baltık kıyısındaki konumumuzu sarsacak ve batı sınırlarımızı geri çekecektir. Reddetmemiz hâlinde ise Berlin, anlaşmazlığı askerî müdahalesine gerekçe olarak kullanabilir."
 westheia_danzig.30.t:0 "Berlin’den Danzig ve Koridor Talebi"
 westheia_danzig.31.a:0 "Haklarımızdan vazgeçmeyeceğiz."
 westheia_danzig.31.d:0 "Varşova, Danzig ve Polonya Koridoru üzerindeki taleplerimizi reddetti. Hükümetimiz bu yanıtı Alman topraklarının birleştirilmesine karşı bir engel olarak sunuyor. Diplomasi çıkmaza girerken Berlin, taleplerinden vazgeçmeyeceğini ilan ediyor. Artık önümüzde, Varşova’yı geri adım atmaya zorlayacak daha sert bir yol duruyor."
 westheia_danzig.31.t:0 "Polonya Toprak Taleplerimizi Reddetti"
 westheia_danzig.32.d:0 "Almanya, Danzig ve Gdynia karşılığında Slovakya’nın Polonya’ya bırakılmasını teklif ediyor. Danzig ayrı bir Özgür Şehir ise anlaşma, Polonya’nın buradaki özel haklarından vazgeçmesini ve şehrin Alman yönetimine geçmesini gerektirecek."
 westheia_danzig.34.a:0 "Yeni sınırları yürürlüğe koyun."
 westheia_danzig.34.d:0 "Varşova hükümeti, Berlin’in toprak taleplerini kabul ettiğini bildirdi. Danzig ve Polonya Koridoru üzerindeki anlaşmazlık, Alman hükümetinin istediği doğrultuda çözüme kavuşuyor.\n\nYeni sınırların yürürlüğe girmesiyle Doğu Prusya ile Reich arasındaki bağlantı yeniden kurulacak. Polonya’nın geri çekilişi Berlin’de diplomatik bir zafer olarak karşılanırken, Avrupa başkentleri bu uzlaşmanın kalıcı bir barış getirip getirmeyeceğini izliyor."
 westheia_danzig.34.t:0 "Polonya Toprak Taleplerimizi Kabul Etti"
 westheia_danzig.41.a:0 "Katılımı resmileştirin."
 westheia_danzig.41.d:0 "Polonya’nın bağlı devlet haklarından vazgeçmesinin ardından bağımsız kalan Danzig, Alman hükümetinin yeni talebini kabul ederek Almanya’ya katılıyor. Şehrin ayrı yönetimi sona ererken Berlin, Baltık’taki konumunu güçlendiriyor."
 westheia_danzig.41.t:0 "Danzig Almanya’ya Katılıyor"
 westheia_danzig.42.a:0 "Baltık’ta yeni bir durum."
 westheia_danzig.42.d:0 "Polonya’nın bağlı devlet yönetiminden ayrılan Danzig, Almanya’nın yeni talebini kabul ederek Alman yönetimine katıldı. Berlin bu sonucu memnuniyetle karşılıyor; Varşova’nın şehir üzerindeki eski hakları ise sona ermiş bulunuyor."
 westheia_danzig.42.t:0 "Danzig’in Bağımsızlığı Kısa Sürdü"
 westheia_danzig.50.a:0 "Garantiyi savunacağız. Danzig’e yardım edin."
 westheia_danzig.50.b:0 "Bu kez askerî müdahalede bulunmayacağız."
 westheia_danzig.50.d:0 "[event_target:westheia_danzig_attacker.GetName], Milletler Cemiyeti düzeniyle korunan Danzig’e saldırdı. Özgür Şehir’in temsilcileri Londra’dan yardım istiyor. Cemiyetin güvencesini savunmak için Danzig’in yanında savaşa katılabilir ya da müdahaleden kaçınabiliriz."
 westheia_danzig.50.t:0 "Danzig İçin Müdahale Çağrısı"
 westheia_danzig.6.a:0 "Bir sonraki adımı değerlendirelim."
 westheia_danzig.6.d:0 "Varşova, Danzig üzerindeki bağlı devlet haklarından vazgeçmeyi reddetti. Hükümetimiz bu yanıtı, Polonya’ya karşı askerî müdahalenin gerekçesi olarak kullanıyor. Artık Polonya’ya karşı bir savaş hedefimiz var; savaş ilan edip etmeyeceğimize biz karar vereceğiz."
 westheia_danzig.6.t:0 "Polonya Danzig Ültimatomunu Reddetti"
 westheia_danzig.7.a:0 "Diplomasi çıkmaza girdi."
 westheia_danzig.7.d:0 "Polonya, Almanya’nın Danzig üzerindeki haklarından vazgeçme talebini reddetti. Berlin, şehirdeki Almanları koruma iddiasını Polonya’ya karşı savaş gerekçesine dönüştürdü. Henüz savaş ilan edilmedi; Avrupa başkentleri Alman hükümetinin kararını bekliyor."
 westheia_danzig.7.t:0 "Danzig Krizinde Ültimatom Reddedildi"
 westheia_danzig_can_be_ceded_by_poland:0 "Danzig Polonya'ya bağlı ayrı bir ülkedir."
 westheia_danzig_clampdown_category:0 "Danzig’de Polonya Hakları"
 westheia_danzig_clampdown_category_desc:0 "Özgür Şehir’de Berlin’in nüfuzu giderek büyüyor. Tarafsız senatörleri destekleyip kışkırtıcıları yönetimden uzaklaştırarak Danzig’deki tarihsel haklarımızı koruyabiliriz. Bu mücadele, Nazi Partisinin siyasi hâkimiyetine son vermeden tamamlanmış sayılmayacaktır."
 westheia_danzig_crisis_ended_tt:0 "Polonya ile Danzig krizi sona erdi."
 westheia_danzig_crisis_timer:0 "Danzig Krizini Çöz"
 westheia_danzig_crisis_timer_desc:0 "Danzig’deki Nazi nüfuzuna karşı başlattığımız mücadele Berlin’in dikkatini çekti. Alman hükümeti, şehirdeki gelişmeleri müdahalesine gerekçe yapmak için fırsat kolluyor. Baskı bizi geri adım atmaya zorlamadan önce Nazi Partisini yasaklamalı ve Özgür Şehir’deki konumumuzu sağlamlaştırmalıyız."
 westheia_danzig_german_category:0 "Danzig Krizi"
 westheia_danzig_german_category_desc:0 "Varşova’nın Özgür Şehir üzerindeki baskısını izliyoruz. Kriz geri sayımı yalnız baskı kampanyası başladığında Almanya faşist yönetimdeyse açılır. Almanya faşist yönetimden çıkarsa kriz sona erer."
 westheia_danzig_german_outrage:0 "Danzig’in İlhakına Tepki"
 westheia_danzig_german_ties:0 "Danzig ile İdeolojik Yakınlık"
 westheia_danzig_german_timer:0 "Polonya’nın Danzig Baskısını İzle"
 westheia_danzig_german_timer_desc:0 "Varşova’nın Danzig’de yürüttüğü baskı kampanyasını yakından izliyoruz. Polonya şehirdeki Nazi yönetimini sona erdiremezse bu anlaşmazlığı diplomatik bir ültimatoma dönüştürebiliriz. Özgür Şehir’in geleceği, iki başkent arasındaki gerilimin seyrine bağlıdır."
 westheia_danzig_integrate_city_tt:0 "Danzig ilhak edilir ve Danzig eyaleti Polonya’nın çekirdek toprağı olur."
 westheia_danzig_major_concern:0 "Özgür Şehir Düzeninin Bozulması"
 westheia_danzig_nazi_ban_completed_tt:0 "Nazi Partisini Yasakla odağı tamamlandı."
 westheia_danzig_nazi_party_banned:0 "Danzig’de Nazi Partisinin Yasaklanması"
 westheia_danzig_no_fascist_germany_tt:0 "Almanya’da faşist yönetim sona erdi veya Almanya artık mevcut değil."
 westheia_danzig_no_longer_polish_free_city_tt:0 "Danzig artık Polonya’ya bağlı bir Özgür Şehir değil."
 westheia_danzig_no_pending_ultimatum_tt:0 "Almanya’nın Danzig ültimatomu henüz gündemde değil."
 westheia_danzig_purge_fascists:0 "Faşistleri Tasfiye Et ve Polonya Haklarını Güvenceye Al"
 westheia_danzig_purge_fascists_desc:0 "Danzig Senatosundaki Nazi nüfuzu, şehrin huzurunu ve Baltık’taki haklarımızı tehdit ediyor. Berlin adına kışkırtıcılık yapan çevreleri yönetimden uzaklaştırmalı, birliklerimizin geçişini ve donanmamızın limana erişimini güvenceye almalıyız. Özgür Şehir’in ayrı idaresi korunacak, fakat Polonya’nın buradaki hakları artık tartışmaya açılmayacaktır."
 westheia_danzig_support_neutral_senate:0 "Tarafsız Bir Senatoyu Destekle"
 westheia_danzig_support_neutral_senate_desc:0 "Özgür Şehir’in geleceği Berlin’in kışkırtıcılarına bırakılamaz. Senatodaki tarafsız isimleri destekleyerek halkın güvenini kazanmalı ve Danzig’i Alman nüfuzundan uzaklaştırmalıyız. Güçlenen tarafsız bir yönetim, Nazi Partisinin şehirdeki hâkimiyetine son vermemizin önünü açacaktır."
 westheia_danzig_trade_law_unlocked_tt:0 "Danzig artık Polonya’nın bağlı devleti değil, tarafsız bir yönetim altında, Polonya savaşta veya Gdańsk Sanayilerini Entegre Et odağı tamamlanmış."
 westheia_danzig_waiting_for_german_demand:0 "Bağımsız Danzig, bir Alman talep odağını kabul etmeye hazırdır."
 westheia_east_hebei_1933.1.a:0 "Hazırlıkları tamamlayın."
 westheia_east_hebei_1933.1.d:0 "Kwantung Ordusu, Jehol’un güneyindeki Çin mevzilerine karşı sınırlı bir sınır harekâtı hazırlanmasını istedi. Doğu Hebei’nin geçitleri ve ulaşım hatları üzerinde denetim kurulması, Japonya’nın Kuzey Çin üzerindeki askerî baskısını artırabilir. Jehol’da konuşlanan Mançukuo sınır birlikleri, otuz günlük hazırlık döneminin ardından Çin savunmasını sınayacak."
 westheia_east_hebei_1933.1.t:0 "Doğu Hebei Sınırında Hazırlık"
 westheia_east_hebei_1933.2.a:0 "Doğu Hebei Japon idaresine geçecek."
 westheia_east_hebei_1933.2.d:0 "Jehol’dan başlatılan sınır harekâtı, Doğu Hebei’deki Çin birliklerinin geri çekilmesiyle sonuçlandı. Bölgedeki savunmanın çözülmesi, Japon askerî makamlarının geçitler ve ulaşım hatları üzerinde denetim kurmasının önünü açtı. Bu harekâtın ardından Doğu Hebei, Mançukuo’ya bağlanmak yerine doğrudan Japon idaresine alınacak."
 westheia_east_hebei_1933.2.t:0 "Doğu Hebei’de Çin Birlikleri Geri Çekildi"
 westheia_east_hebei_1933.3.a:0 "Bu başarısızlıktan ders çıkaracağız."
 westheia_east_hebei_1933.3.d:0 "Doğu Hebei sınırındaki Çin birlikleri, Jehol’dan başlatılan ilerleme girişimini durdurdu. Saldırıya katılan kuvvetler geri çekilirken bölge Çin’in elinde kaldı. Çin hükûmeti, Japonya’nın sınırdaki askerî baskısını egemenliğine yönelik bir tehdit olarak kınadı. İlişkiler daha da gerilirken subaylarımız çatışmadan çıkarılan dersleri değerlendirecek."
 westheia_east_hebei_1933.3.t:0 "Doğu Hebei Harekâtı Başarısız Oldu"
 westheia_east_hebei_1933.4.a:0 "Sınır mevzilerini savunun."
 westheia_east_hebei_1933.4.d:0 "Jehol’da konuşlanan Mançukuo birliklerinin hareketliliği, Doğu Hebei sınırındaki gerilimi artırıyor. Japon askerî makamlarının desteklediği hazırlıklar, geçitler ve ulaşım hatları üzerindeki denetimimizin sınırlı bir harekâtla sınanabileceğine işaret ediyor. Sınır birliklerimiz yaklaşan saldırıya karşı hazırlanmalı."
 westheia_east_hebei_1933.4.t:0 "Doğu Hebei Sınırında Japon Baskısı"
 westheia_east_hebei_1933.5.a:0 "Kuzeydeki durum ağırlaşıyor."
 westheia_east_hebei_1933.5.d:0 "Doğu Hebei’deki birliklerimiz, Jehol yönünden gelen saldırı karşısında geri çekildi. Bölgedeki savunmanın çözülmesiyle Japon askerî makamları denetimi doğrudan devralmaya hazırlanıyor. Bu yenilgi, Pekin ve Tianjin çevresindeki güvenlik açısından tehdidi büyütüyor."
 westheia_east_hebei_1933.5.t:0 "Doğu Hebei Savunması Çözüldü"
 westheia_east_hebei_1933.6.a:0 "Doğu Hebei’yi savunmayı başardık."
 westheia_east_hebei_1933.6.d:0 "Sınır birliklerimiz, Jehol’dan Doğu Hebei’ye yönelen ilerleme girişimini durdurdu. Savunma mevzileri korunurken saldırıya katılan birlikler geri çekilmek zorunda kaldı. Bölge Çin’in elinde kaldı, ancak Japonya’nın Kuzey Çin üzerindeki baskısı devam ediyor."
 westheia_east_hebei_1933.6.t:0 "Doğu Hebei’de İlerleme Durduruldu"
 westheia_east_hebei_1933.7.a:0 "Birlikler durumu yeniden değerlendirsin."
 westheia_east_hebei_1933.7.d:0 "Doğu Hebei sınırındaki girişim, kesin bir askerî sonuca ulaşılmadan durduruldu. Değişen askerî ve diplomatik koşullar nedeniyle mevcut harekâtın sürdürülmesi mümkün görünmüyor. Bu girişim kapsamında herhangi bir toprak devri yapılmayacak."
 westheia_east_hebei_1933.7.t:0 "Doğu Hebei Harekâtı Durduruldu"
 westheia_east_hebei_1933.8.a:0 "Sınırda teyakkuzu koruyun."
 westheia_east_hebei_1933.8.d:0 "Doğu Hebei sınırındaki çatışma kesin bir sonuca ulaşmadan sona erdi. Bölgenin idaresinde bu girişimden kaynaklanan bir değişiklik olmadı. Sınır birliklerimiz, yeni bir harekât ihtimaline karşı teyakkuzunu koruyor."
 westheia_east_hebei_1933.8.t:0 "Doğu Hebei Sınırında Çatışma Sona Erdi"
 westheia_estonia_1933.1.a:0 "Tallinn’de iktidar tek elde toplanıyor."
 westheia_estonia_1933.1.d:0 "Konstantin Päts, General Johan Laidoner’in desteğiyle Estonya genelinde olağanüstü hâl ilan ederek yönetimi kendi ellerinde topladı. Hükûmet, anayasal düzeni koruduğunu ileri sürerken Bağımsızlık Savaşı Gazileri hareketi Vaps’ın önde gelen isimleri tutuklandı ve yaklaşan seçimler ertelendi.\n\nPäts ile Laidoner, ülkenin siyasi kutuplaşmasına son vermeyi ve kamu düzenini sağlamayı amaçladıklarını bildiriyor. Ancak seçimlerin askıya alınması ve muhalefetin bastırılması, Estonya’yı parlamenter rekabetten uzaklaştırarak dar bir yönetici çevrenin hâkim olduğu otoriter bir düzene sürüklüyor. Tallinn’den gelen haberler, Baltıklar’daki demokratik kurumların geleceğine ilişkin kaygıları artırıyor."
 westheia_estonia_1933.1.t:0 "Estonya’da Päts Darbesi"
 westheia_estonia_cabinet_1933.1.a:0 "Tõnisson yeni hükümeti kursun."
 westheia_estonia_cabinet_1933.1.d:0 "Haftalardır süren hükümet bunalımı sona erdi. Büyük Buhran'ın ağırlaştırdığı ekonomik sorunlar ve partiler arasındaki anlaşmazlıklar karşısında Konstantin Päts'in kabinesinin yerini alacak yeni bir hükümet kuruldu.\n\nRiigikogu, Jaan Tõnisson'un başkanlığındaki kabineyi onayladı. Rahvuslik Keskerakond ile çiftçi ve küçük toprak sahiplerinin temsilcilerine dayanan yeni hükümet, ekonomik darboğazın yanında giderek sertleşen anayasa tartışmalarıyla da yüzleşmek zorunda."
 westheia_estonia_cabinet_1933.1.t:0 "Päts Hükümetinin Sonu"
 westheia_estonia_cabinet_1933.2.a:0 "Päts geçiş hükümetinin başına geçsin."
 westheia_estonia_cabinet_1933.2.d:0 "Vaps hareketinin desteklediği anayasa değişikliği, 14–16 Ekim referandumunda büyük çoğunlukla kabul edildi. Parlamenter düzeni savunan Jaan Tõnisson, sonucun ardından hükümetinin istifasını sundu.\n\nKonstantin Päts şimdi yeni bir geçiş kabinesiyle yönetimi devralıyor. Hükümetin önünde ekonomik sıkıntıların hafifletilmesi ve kabul edilen anayasa değişikliğinin uygulanmasına hazırlık bulunuyor. Bu hükümet değişikliği henüz parlamentonun dağıtılması veya bir darbe anlamına gelmiyor; siyasi mücadele mevcut kurumlar içinde sürüyor."
 westheia_estonia_cabinet_1933.2.t:0 "Päts Geçiş Hükümetini Kuruyor"
 westheia_estonia_focus_1933.1.a:0 "Altı tanketi teslim alalım."
 westheia_estonia_focus_1933.1.b:0 "Bu masrafı karşılamayacağız."
 westheia_estonia_focus_1933.1.d:0 "Polonya’dan temin edilecek altı TKS tanketi teslim alınmaya hazır. Makineli tüfekli bu küçük araçlar, eski tanklarımızın yanında keşif ve eğitim görevlerinde kullanılabilir. Siparişi kabul edersek satın alma ödemeleri önümüzdeki bir yıl boyunca bütçemize ek yük getirecek."
 westheia_estonia_focus_1933.1.t:0 "Polonya Tanketlerinin Teslimatı"
 westheia_estonia_focus_1933.2.a:0 "İki muhribi satın alalım."
 westheia_estonia_focus_1933.2.b:0 "Bu teklifi reddedelim."
 westheia_estonia_focus_1933.2.d:0 "Estonya, Lennuk ve Vambola adlı iki muhribini donanmamıza satmayı teklif ediyor. Eski Rus yapımı gemiler, top ve torpido silahlarıyla filomuzun gücünü artırabilir. Satın alma ödemeleri bir yıl boyunca ekonomimize ek yük getirecek."
 westheia_estonia_focus_1933.2.t:0 "Estonya Muhriplerini Satın Alma Teklifi"
 westheia_estonia_focus_1933.3.a:0 "Anlaşmayı tamamlayalım."
 westheia_estonia_focus_1933.3.d:0 "Peru hükümeti teklifimizi kabul etti. Lennuk ve Vambola’nın devri gerçekleştiriliyor. Satış geliri önümüzdeki bir yıl boyunca bütçemizi rahatlatacak; donanmamızın gelecekteki ihtiyaçlarını daha küçük ve modern bir kuvvet anlayışıyla karşılayabiliriz."
 westheia_estonia_focus_1933.3.t:0 "Peru Muhripleri Satın Alıyor"
 westheia_estonia_focus_1933.4.a:0 "Gemiler bizde kalacak."
 westheia_estonia_focus_1933.4.d:0 "Peru hükümeti muhriplerimizi satın almama kararı aldı. Lennuk ve Vambola donanmamızda kalacak; bu görüşmeden herhangi bir satış geliri elde edemeyeceğiz."
 westheia_estonia_focus_1933.4.t:0 "Peru Satış Teklifini Reddediyor"
 westheia_form_moldavian_empire:0 "Moldova İmparatorluğu'nu İlan Et"
 westheia_form_moldavian_empire_desc:0 "Haritada işaretlenen Romanya, Macaristan, Slovakya, Bulgaristan ve Ukrayna bölgeleriyle Baçka ve Batı Banat'ı I. Tuna'nın yönetiminde birleştirerek Moldova İmparatorluğu'nu ilan edebiliriz. Kuruluşla birlikte bu ülkelerin bütün çekirdek topraklarını imparatorluğun ayrılmaz parçaları sayacak; Edirne, Trakya, Orta Makedonya, Makedonya ve Güney Sırbistan üzerinde de aynı hakkı ileri süreceğiz. Taç büyüyecek, sınırları ise ordumuz çizecek."
 westheia_former_cardinal:0 "Eski Kardinal"
 westheia_fra_cabinet_1933.1.a:0 "Yeni kabine görevine başlasın."
 westheia_fra_cabinet_1933.1.d:0 "Bütçe ve kamu maliyesi etrafındaki anlaşmazlıklar Joseph Paul-Boncour hükümetini Mecliste çoğunluksuz bıraktı. Cumhurbaşkanı Albert Lebrun, yeni kabineyi kurma görevini Radikal Parti lideri Édouard Daladier’ye verdi. Yeni hükümet, mali istikrarı parlamentodaki kırılgan desteğe dayanarak sağlamaya çalışacak."
 westheia_fra_cabinet_1933.1.t:0 "Paul-Boncour Hükümeti Düşüyor"
 westheia_fra_cabinet_1933.2.a:0 "Bu kez bir uzlaşma sağlansın."
 westheia_fra_cabinet_1933.2.d:0 "Bütçe açığını kapatacak önlemler üzerindeki anlaşmazlıklar Daladier hükümetinin Mecliste yenilmesine yol açtı. Görüşmelerin ardından Albert Sarraut yeni hükümeti kurdu. Mali krize bir çözüm bulunmadan çoğunluğu bir arada tutmak kolay olmayacak."
 westheia_fra_cabinet_1933.2.t:0 "Daladier’nin İlk Hükümeti Sona Eriyor"
 westheia_fra_cabinet_1933.3.a:0 "Yine yeni bir hükümet..."
 westheia_fra_cabinet_1933.3.d:0 "Albert Sarraut’nun mali önlemleri parlamentoda yeterli desteği bulamadı. Bir ayını ancak tamamlayan hükümetin ardından Camille Chautemps yeni kabineyi kuruyor. İsimler değişse de bütçe açığı ve birbirine güvenmeyen siyasi gruplar yerinde duruyor."
 westheia_fra_cabinet_1933.3.t:0 "Sarraut Hükümeti de Düşüyor"
 westheia_fra_cabinet_1933.4.a:0 "Bu skandalın hesabı sorulmalı."
 westheia_fra_cabinet_1933.4.d:0 "Stavisky’nin dolandırıcılık ağının ortaya çıkması ve siyasi bağlantıları hakkındaki suçlamalar Chautemps hükümetinin itibarını yıprattı. Basının ve muhalefetin baskısı altında kabine çekildi. Édouard Daladier yeniden hükümetin başına geçerken sokaktaki öfke büyüyor."
 westheia_fra_cabinet_1933.4.t:0 "Stavisky Skandalı Hükümeti Sarsıyor"
 westheia_fra_cabinet_1933.5.a:0 "Önce ülkede sükûnet sağlansın."
 westheia_fra_cabinet_1933.5.d:0 "6 Şubat’ta Paris’te yaşanan şiddet olayları ve can kayıpları siyasi krizi ağırlaştırdı. Daladier, yeni çatışmaların önüne geçmek için görevden çekildi. Eski cumhurbaşkanı Gaston Doumergue, geniş tabanlı bir ulusal birlik hükümeti kurmak üzere geri döndü."
 westheia_fra_cabinet_1933.5.t:0 "Şubat Krizinin Ardından Ulusal Birlik"
 westheia_fra_cabinet_1933.6.a:0 "Bu istikrarsızlık artık sona ermeli."
 westheia_fra_cabinet_1933.6.d:0 "Doumergue’in yürütmeyi güçlendirecek anayasal reform önerileri koalisyon ortaklarını karşı karşıya getirdi. Radikal bakanların çekilmesiyle ulusal birlik hükümeti dağıldı. Pierre-Étienne Flandin yeni bir çoğunluk kurarak görevi devralıyor."
 westheia_fra_cabinet_1933.6.t:0 "Doumergue Koalisyonu Dağılıyor"
 westheia_fra_cabinet_1933.7.a:0 "Bir kabine daha. Bakalım ne kadar dayanacak."
 westheia_fra_cabinet_1933.7.d:0 "Franka yönelik baskı ve mali kriz karşısında Flandin’in istediği olağanüstü mali yetkiler Meclisten geçmedi. Hükümetin çekilmesinin ardından Meclis başkanı Fernand Bouisson farklı siyasi kanatları bir araya getiren bir kabine kurdu."
 westheia_fra_cabinet_1933.7.t:0 "Flandin Hükümeti Mali Krize Yeniliyor"
 westheia_fra_cabinet_1933.8.a:0 "Birkaç gün bile dayanamadılar!"
 westheia_fra_cabinet_1933.8.d:0 "Fernand Bouisson’un geniş tabanlı hükümeti gerekli parlamento desteğini sağlayamadı ve birkaç gün içinde düştü. Yeni görüşmeler sonucunda Pierre Laval hükümeti kurdu. Kabinenin önceliği frangı savunmak ve kamu maliyesini dengelemek olacak."
 westheia_fra_cabinet_1933.8.t:0 "Bouisson’un Kısa Ömürlü Kabinesi"
 westheia_fra_cabinet_1933.9.a:0 "Yeter artık; kararı sandık versin."
 westheia_fra_cabinet_1933.9.d:0 "Laval’ın deflasyon ve harcamaları kısma politikaları muhalefeti büyüttü; koalisyon içindeki desteği de aşındı. Hükümetin istifasının ardından Albert Sarraut yeniden göreve geldi. Yaklaşan genel seçimlere kadar devlet işlerinin yürütülmesi yeni kabinenin sorumluluğunda."
 westheia_fra_cabinet_1933.9.t:0 "Laval Hükümeti Çekiliyor"
 westheia_germany_flags_1933.1.a:0 "İmparatorluğun renklerini geri getirin!"
 westheia_germany_flags_1933.1.b:0 "Yeni Almanya’nın sembolü gamalı haçtır!"
 westheia_germany_flags_1933.1.d:0 "Yeni hükûmet, Weimar Cumhuriyeti’nin siyah-kırmızı-altın renklerini devletin resmî sembollerinden kaldırmaya hazırlanıyor. Cumhurbaşkanı Paul von Hindenburg’un 12 Mart tarihli kararnamesi, kesin bir düzenleme yapılıncaya kadar imparatorluğun siyah-beyaz-kırmızı bayrağı ile Nasyonal Sosyalist hareketin gamalı haçlı bayrağının birlikte kullanılmasını öngörüyor. Bu düzenleme, muhafazakâr çevrelerin eski imparatorlukla kurduğu bağ ile Nazi hareketinin devlet üzerindeki artan etkisini aynı anda yansıtıyor. Almanya’yı temsil edecek başlıca bayrağın hangisi olacağına karar vermeliyiz."
 westheia_germany_flags_1933.1.t:0 "Reich’ın Bayrakları"
 westheia_germany_flags_1933.2.a:0 "Gamalı haç artık Almanya’nın tek bayrağıdır."
 westheia_germany_flags_1933.2.b:0 "İmparatorluğun renklerini koruyacağız."
 westheia_germany_flags_1933.2.d:0 "Nürnberg’de toplanan Reichstag’ın gündemindeki yeni bayrak yasası, Mart 1933’ten beri sürdürülen iki bayraklı uygulamaya son vermeyi amaçlıyor. Tasarı, siyah-beyaz-kırmızıyı Reich’ın renkleri olarak korurken gamalı haçlı bayrağı tek ulusal bayrak ve Reich bayrağı olarak belirliyor. Böylece Nazi Partisi’nin sembolü ile devletin resmî kimliği arasındaki birleşme tamamlanacak. Hükûmet, yeni düzenlemeyi yürürlüğe koymak ya da imparatorluk bayrağını korumak arasında karar vermelidir."
 westheia_germany_flags_1933.2.t:0 "Reich’ın Tek Bayrağı"
 westheia_germany_leadership_1933.1.a:0 "Yeni hükûmet göreve başlıyor."
 westheia_germany_leadership_1933.1.d:0 "Kurt von Schleicher'in hükûmeti, Reichstag'da destek bulamayınca ve Cumhurbaşkanı Paul von Hindenburg'un güvenini kaybedince istifa etti. Franz von Papen'in yürüttüğü görüşmelerin ardından Hindenburg, Adolf Hitler'i şansölyeliğe atadı. NSDAP ile Alman Milliyetçi Halk Partisi'nin yer aldığı yeni kabinede muhafazakâr bakanlar çoğunlukta. Papen ve müttefikleri, Hitler'i bu kabine aracılığıyla denetleyebileceklerine inanıyor. Almanya'da hükûmetin başına artık Nasyonal Sosyalistler geçmiş bulunuyor."
 westheia_germany_leadership_1933.1.t:0 "Hitler Şansölye Atandı"
 westheia_germany_mefo_1933.1.a:0 "Bu yükü daha fazla görmezden gelemeyiz."
 westheia_germany_mefo_1933.1.d:0 "MEFO tahvilleri, yeniden silahlanma siparişlerini ve sanayi yatırımlarını bütçeye hemen yansıtmadan finanse etmemizi sağladı. Ancak biriken yükümlülükler artık kredi düzeni ve kaynak dağılımı üzerinde daha büyük bir baskı oluşturuyor. Silahlanma programının sürdürülmesi giderek daha fazla ekonomik kaynak gerektirirken sivil kesimin ihtiyaçlarını karşılamak da zorlaşıyor. Finansman yükünün büyümesini sınırlamak için fiyat kontrolleri gibi önlemleri değerlendirmeliyiz."
 westheia_germany_mefo_1933.1.t:0 "MEFO Borçlarının Yükü Artıyor"
 westheia_greek_cabinets_1933.1.a:0 "Yeni hükümet göreve başlasın."
 westheia_greek_cabinets_1933.1.d:0 "1932 seçimlerinden sonra kurulan Tsaldaris hükümeti, parlamentodaki kırılgan dengeler karşısında görevini sürdüremedi. Cumhurbaşkanı Alexandros Zaimis, hükümeti kurma görevini Eleftherios Venizelos’a verdi. Yeni kabine siyasi çıkmazı seçimlerle aşmaya hazırlanıyor."
 westheia_greek_cabinets_1933.1.t:0 "Venizelos Yeniden Hükümet Kuruyor"
 westheia_greek_cabinets_1933.2.a:0 "Düzeni sağlayın, ardından yönetimi devredin."
 westheia_greek_cabinets_1933.2.d:0 "5 Mart seçimlerini Venizelos karşıtı koalisyon kazandı. Sonucun ardından Nikolaos Plastiras’ın giriştiği darbe ülkeyi yeni bir krize sürükledi. Venizelos hükümetinin ayrılmasıyla General Alexandros Othonaios, düzeni sağlamak ve iktidarı seçimlerin galibine devretmek üzere geçici bir askerî kabinenin başına geçti."
 westheia_greek_cabinets_1933.2.t:0 "Seçimlerin Ardından Askerî Kabine"
 westheia_greek_cabinets_1933.3.a:0 "Seçim sonucu uygulansın."
 westheia_greek_cabinets_1933.3.d:0 "Plastiras’ın darbe girişiminin başarısız olması ve geçici askerî kabinenin düzeni yeniden sağlamasının ardından Othonaios görevini bıraktı. Seçimlerin galibi Panagis Tsaldaris yeni hükümeti kurdu. Yönetim yeniden sivil kabineye geçiyor."
 westheia_greek_cabinets_1933.3.t:0 "Tsaldaris İktidara Dönüyor"
 westheia_greek_cabinets_1933.4.a:0 "Bir kez daha askerler yönetime el koydu."
 westheia_greek_cabinets_1933.4.d:0 "Ordu içindeki monarşi yanlılarının baskısı karşısında Tsaldaris hükümeti görevden uzaklaştırıldı. Georgios Kondylis iktidarı ele geçirirken Cumhurbaşkanı Zaimis de makamından ayrıldı. Cumhuriyetin geleceği artık askerî yönetimin elinde; Kondylis monarşinin geri getirilmesi için harekete geçiyor."
 westheia_greek_cabinets_1933.4.t:0 "Kondylis Yönetimi Ele Geçiriyor"
 westheia_greek_cabinets_1933.5.a:0 "Artık seçimlere hazırlanabiliriz."
 westheia_greek_cabinets_1933.5.d:0 "II. Georgios’un ülkeye dönüşünden sonra kral ile Kondylis arasında, özellikle siyasi af konusunda anlaşmazlık çıktı. Kondylis’in ayrılması üzerine Konstantinos Demertzis tarafsız bir seçim hükümeti kurmakla görevlendirildi. Krallık yeniden tesis edildi; yeni kabine ülkeyi parlamento seçimlerine götürecek."
 westheia_greek_cabinets_1933.5.t:0 "Demertzis Seçim Hükümetini Kuruyor"
 westheia_greek_navy_1933.1.a:0 "Yeni gemilerimiz Ege'ye açılsın!"
 westheia_greek_navy_1933.1.d:0 "İtalya'daki tersanelere verilen muhrip siparişimizin kalan iki gemisi teslim edilmiştir. Hydra ve Kountouriotis'in ardından Psara ve Spetsai de donanmamıza katılmaktadır. Modern topları ve torpido donanımlarıyla bu gemiler, yaşlanan muhrip filomuzun yenilenmesinde önemli bir adım olacaktır."
 westheia_greek_navy_1933.1.t:0 "Psara ve Spetsai Donanmaya Katılıyor"
 westheia_greek_politics_1933.1.a:0 "Kralı ev hapsine alın."
 westheia_greek_politics_1933.1.b:0 "Kralın müdahalesine izin verin."
 westheia_greek_politics_1933.1.d:0 "Yaklaşan seçimler, monarşi ile cumhuriyet arasındaki eski anlaşmazlığı yeniden gündeme getirmiştir. Kralın siyasi sürece müdahalesinden endişe eden cumhuriyetçiler, kendisinin ev hapsine alınmasını talep ediyor. Böyle bir adım seçimlere giden yolu değiştirecek, fakat ülkenin bölünmüş siyasetinde yeni bir gerilim yaratacaktır."
 westheia_greek_politics_1933.1.t:0 "1936 Seçim Krizi"
 westheia_greek_politics_1933.2.a:0 "Taç geri döndü; siyasi mücadele sürüyor."
 westheia_greek_politics_1933.2.d:0 "Kasım ayındaki tartışmalı halkoylamasının ardından II. Georgios sürgünden dönmüştür. Monarşinin yeniden kurulması, cumhuriyetçilerle kralcılar arasındaki mücadeleyi sona erdirmemiştir. Kralın yeni siyasi düzende nasıl bir rol üstleneceği, yaklaşan seçimlerin başlıca meselelerinden biri olacaktır."
 westheia_greek_politics_1933.2.t:0 "II. Georgios Yunanistan'a Dönüyor"
 westheia_greenland.1.a:0 "Mahkemenin kararına saygı göstermeliyiz."
 westheia_greenland.1.b:0 "Kimse tanımasa da bu topraklar bizimdir!"
 westheia_greenland.1.d:0 "Uluslararası Daimi Adalet Divanı, 5 Nisan 1933 tarihli kararıyla Doğu Grönland üzerindeki hak iddiamızı geçersiz sayarak Danimarka lehine hüküm verdi. Lahey’deki yargıçlar, adanın tamamı üzerindeki Danimarka egemenliğini tanıyor.\n\nŞimdi ya uluslararası hukuka saygı göstererek geri çekileceğiz ya da diğer devletlerin tanımadığı egemenlik iddiamızı sürdürerek diplomatik bir krizi göze alacağız."
 westheia_greenland.1.t:0 "Grönland Anlaşmazlığı"
 westheia_greenland.2.a:0 "Kuzey Atlantik’te uzlaşma sağlandı."
 westheia_greenland.2.d:0 "Uluslararası Daimi Adalet Divanı’nın Danimarka lehine verdiği kararın ardından Norveç hükümeti, Doğu Grönland üzerindeki egemenlik iddiasından vazgeçtiğini açıkladı. Oslo, anlaşmazlığın uluslararası hukuk çerçevesinde sona ermesini kabul ederken Kopenhag kararı memnuniyetle karşıladı.\n\nKuzey Atlantik’te iki komşuyu karşı karşıya getiren ihtilafın barışçıl biçimde kapanması, uluslararası kurumların itibarını güçlendiren bir gelişme olarak görülüyor."
 westheia_greenland.2.t:0 "Grönland Anlaşmazlığı Çözüldü"
 westheia_greenland.3.a:0 "Lahey’in kararı anlaşmazlığı bitiremedi."
 westheia_greenland.3.d:0 "Norveç hükümeti, Uluslararası Daimi Adalet Divanı’nın Danimarka lehine verdiği karara rağmen Doğu Grönland üzerindeki egemenlik iddiasını sürdüreceğini açıkladı. Kopenhag, mahkeme kararının tartışmaya açık olmadığını bildirirken Oslo’nun tutumu Londra’da da kaygıyla karşılandı.\n\nNorveç’in iddiası uluslararası tanınmadan yoksun kalmaya devam ediyor. Lahey’de kapanması beklenen anlaşmazlık, şimdi Kuzey Atlantik’te yeni bir diplomatik gerilimin kaynağı haline geldi."
 westheia_greenland.3.t:0 "Norveç Grönland İddiasından Vazgeçmiyor"
 westheia_greenland_claim_maintained:0 "Grönland Üzerindeki İddia Sürdürülüyor"
 westheia_greenland_court_defied:0 "Uluslararası Mahkeme Kararına İtiraz"
 westheia_greenland_ruling_respected:0 "Grönland Anlaşmazlığında Uzlaşma"
 westheia_grivita_1933.1.a:0 "Ne olursa olsun grevi bastır."
 westheia_grivita_1933.1.b:0 "İşçiler haklı olabilir."
 westheia_grivita_1933.1.d:0 "Büyük Buhran'ın ağırlaştırdığı geçim sıkıntısı ve ücret kesintileri, Bükreş'teki Grivița demiryolu atölyelerinde çalışan işçileri greve sürükledi. Önceki görüşmelerin ardından dinmeyen huzursuzluk, sendika önderlerinin tutuklanmasıyla yeniden alevlendi. İşçiler atölyelerde toplanıyor; tutukluların serbest bırakılmasını ve çalışma şartlarının iyileştirilmesini talep ediyor.\n\nDemiryollarındaki aksama sürerken hükûmet, protestoların diğer sanayi merkezlerine yayılmasından endişe duyuyor. Ordu ve jandarma müdahale için hazır bekliyor, ancak zor kullanılması kan dökülmesine yol açabilir. Devletin otoritesini silahla mı koruyacağız, yoksa işçilerin taleplerini dinleyerek bir uzlaşma mı arayacağız?"
 westheia_grivita_1933.1.t:0 "Grivița İşçi Ayaklanması"
 westheia_guangdong_naval_1933.1.a:0 "Geçişlerine izin verin."
 westheia_guangdong_naval_1933.1.b:0 "Bu gemiler Guangdong’da kalacak!"
 westheia_guangdong_naval_1933.1.d:0 "Kuzeydoğu Donanması’ndan gelen denizcilerle yönetimimiz arasındaki anlaşmazlık büyümektedir. Filonun yeniden teşkilatlandırılması ve kuzeyli subayların görevlerinden uzaklaştırılması, Haiqi ve Haichen’in mürettebatında büyük hoşnutsuzluk yarattı. İki kruvazörün subayları Guangdong’dan ayrılarak Nanjing’deki merkezî yönetimin emrine girmek istiyor. Gidişlerine izin verebilir veya gemilerin burada kalmasını emredebiliriz. Zhaohe’nin makinelerinde süren onarım nedeniyle bu gemi Guangdong’da kalacaktır."
 westheia_guangdong_naval_1933.1.t:0 "Guangdong Filosunda Bağlılık Krizi"
 westheia_guangdong_naval_1933.2.a:0 "İki gemiyi de hizmete alın."
 westheia_guangdong_naval_1933.2.d:0 "Guangdong yönetimiyle yaşadıkları komuta ve personel anlaşmazlıklarının ardından Haiqi ve Haichen kruvazörleri merkezî yönetimin emrine girdi. Kuzeydoğu kökenli subay ve mürettebatlarını taşıyan bu iki gemi artık filomuzun bir parçasıdır. Gemilerin kabulü, güneydeki deniz kuvvetleri üzerindeki nüfuzumuzu da güçlendirecektir."
 westheia_guangdong_naval_1933.2.t:0 "Haiqi ve Haichen Filomuza Katıldı"
 westheia_hol_1933.1.a:0 "Yeni kabine göreve başlasın."
 westheia_hol_1933.1.d:0 "26 Nisan seçimlerinin ardından yürütülen hükümet görüşmeleri sonuçlandı. Charles Ruijs de Beerenbrouck'un kabinesi yerini Hendrikus Colijn başkanlığındaki yeni hükümete bırakıyor. Katolikler, Protestan partiler ve liberallerin katıldığı geniş tabanlı kabine, ekonomik bunalımın ağırlaştırdığı mali sorunlarla ve işsizlikle karşı karşıya. Kraliçe Wilhelmina tarafından atanan bakanlar bugün görevlerine başlıyor."
 westheia_hol_1933.1.t:0 "Colijn'in Kriz Kabinesi Göreve Başladı"
 westheia_hol_command_1933.1.a:0 "Reijnders emekli olsun; komutayı Winkelman devralsın."
 westheia_hol_command_1933.1.b:0 "Neden ikisi de aktif görevde kalmasın?"
 westheia_hol_command_1933.1.d:0 "Izaak Reijnders ile Savunma Bakanı Adriaan Dijxhoorn arasında savunma stratejisi, askerî yetkiler ve hükümetle genelkurmay arasındaki ilişkiler konusunda ciddi görüş ayrılıkları ortaya çıktı. Reijnders'in görevden ayrılması gündemde ve yerine deneyimli general Henri Winkelman öneriliyor. Avrupa'daki savaş sürerken hükümet, yüksek komutadaki anlaşmazlığı çözmek zorunda. Reijnders'i emekliye ayırarak komutayı Winkelman'a verebilir veya görevleri ayırıp her iki subayın deneyiminden yararlanmaya devam edebiliriz."
 westheia_hol_command_1933.1.t:0 "Yüksek Komutada Yol Ayrımı"
 westheia_iceland_1933.1.a:0 "Hermann Jónasson hükûmeti kursun."
 westheia_iceland_1933.1.d:0 "Reykjavík’te hükûmetin başında değişim zamanı geldi. Ásgeir Ásgeirsson’un başbakanlık dönemi sona ererken, yeni hükûmeti kurma görevi Hermann Jónasson’a veriliyor.\n\nEkonomik bunalımın etkileri sürerken halk, yeni yönetimden geçim sıkıntısına çözüm ve ülkenin geleceğine yön verecek bir program bekliyor. Jónasson, İzlanda’nın demokratik kurumları içinde görevini devralmaya hazırlanıyor."
 westheia_iceland_1933.1.t:0 "İzlanda’da Yeni Hükûmet"
 westheia_iceland_alcohol_1933.1.a:0 "Yasağı sürdürmeliyiz."
 westheia_iceland_alcohol_1933.1.b:0 "Devlet denetiminde alkol satışını serbest bırakın."
 westheia_iceland_alcohol_1933.1.d:0 "1933 referandumunda seçmenlerin çoğunluğu alkol yasağının kaldırılmasını destekledi. Şimdi güçlü alkollü içkilerin ithalat ve satışını devlet denetiminde yeniden serbest bırakma zamanı geldi.\n\nYasağın savunucuları, içki satışının ailelere ve toplumsal düzene zarar vereceğini öne sürüyor. Karşı çıkanlar ise kaçakçılığın ve ev yapımı içkilerin önüne geçmek için denetimli satışın daha etkili olacağını savunuyor. Hazırlanan düzenleme bira yasağını yürürlükte bırakıyor."
 westheia_iceland_alcohol_1933.1.t:0 "Alkol Yasağının Kaldırılması"
 westheia_ins_1933.1.a:0 "Ticaret anlaşmasını kabul edelim."
 westheia_ins_1933.1.b:0 "Bu teklifi kabul etmeyeceğiz."
 westheia_ins_1933.1.d:0 "Batavya yönetimi, takımadalar ile Japonya arasındaki ticareti bir anlaşmayla güçlendirmeyi öneriyor. Japon sanayisinin hammadde ihtiyacı ve Doğu Hint Adaları’nın ihracat arayışı, her iki tarafı da müzakere masasına getirdi. Heyetimiz, ticari ilişkilerimizi resmî bir anlaşmaya bağlamanın koşullarını değerlendiriyor."
 westheia_ins_1933.1.t:0 "Batavya Ticaret Görüşmeleri"
 westheia_ins_1933.2.a:0 "Görüşmeler sonuç verdi."
 westheia_ins_1933.2.d:0 "Japon hükûmeti, Batavya görüşmelerinde sunduğumuz ticaret anlaşmasını kabul etti. İki tarafın temsilcileri anlaşma üzerinde uzlaşırken, takımadaların dış ticaretinde yeni bir dönem başlıyor."
 westheia_ins_1933.2.t:0 "Japonya Ticaret Anlaşmasını Kabul Etti"
 westheia_ins_1933.3.a:0 "Başka fırsatları değerlendireceğiz."
 westheia_ins_1933.3.d:0 "Japon hükûmeti, önerdiğimiz ticaret anlaşmasını kabul etmeyeceğini bildirdi. Batavya görüşmeleri bir anlaşmayla sonuçlanmadı; mevcut ticari ilişkiler olağan koşullarıyla sürecek."
 westheia_ins_1933.3.t:0 "Japonya Ticaret Anlaşmasını Reddetti"
 westheia_iraq_air_1933.1.a:0 "Uçakları teslim alalım."
 westheia_iraq_air_1933.1.b:0 "Bu masrafı karşılamayacağız."
 westheia_iraq_air_1933.1.d:0 "İngiltere’den sipariş edilen sekiz de Havilland DH.84M Dragon uçağı teslim edilmeye hazır. Çift motorlu uçaklar hafif bombardıman ve ordu iş birliği görevlerinde kullanılabilecek. Siparişi kabul edersek ödeme yükü önümüzdeki bir yıl boyunca bütçemize yansıyacak."
 westheia_iraq_air_1933.1.t:0 "İngiliz Dragon Uçaklarının Teslimatı"
 westheia_iraq_cabinet_1933.1.a:0 "Yeni hükümete başarılar dileyelim."
 westheia_iraq_cabinet_1933.1.desc:0 "Meclisteki milliyetçi muhalefet, Naci Şevket’in hükümet programını sert biçimde eleştirdi. Kabinesindeki etkili siyasetçiler arasında sıkışan Şevket, sağlık gerekçesiyle 18 Mart’ta istifasını sundu. Kral Faysal, yeni hükümeti kurma görevini bugün Reşid Ali el-Geylani’ye verdi."
 westheia_iraq_cabinet_1933.1.t:0 "Naci Şevket Hükümeti İstifa Etti"
 westheia_iraq_cabinet_1933.2.a:0 "Pekâlâ... Bu kez biraz istikrar görelim."
 westheia_iraq_cabinet_1933.2.desc:0 "Reşid Ali el-Geylani’nin Britanya’ya yönelik uzlaşmacı açıklamaları kendi siyasi çevresinde tepki yarattı. Meclisi feshederek seçime gitmek istedi, fakat Kral Gazi bunu kabul etmedi. Ekim sonunda istifa eden Geylani’nin ardından Cemil el-Midfai yeni kabinesini kurdu."
 westheia_iraq_cabinet_1933.2.t:0 "Geylani’nin Yerine Cemil el-Midfai"
 westheia_iraq_cabinet_1933.3.a:0 "Yine mi? Bir hükümet de yerinde kalsın."
 westheia_iraq_cabinet_1933.3.desc:0 "Sulama yatırımları üzerindeki anlaşmazlıkların ardından yeniden kurulan Midfai kabinesi de zayıf kaldı. Hükümetin çalışmalarından memnun olmayan Kral Gazi, değişiklik istedi. Midfai 25 Ağustos’ta istifa etti; Ali Cevdet el-Eyyubi bugün başbakanlığı devraldı."
 westheia_iraq_cabinet_1933.3.t:0 "Kral Yeni Bir Kabine İstiyor"
 westheia_iraq_cabinet_1933.4.a:0 "Cemil yine mi? Daha geçen yıl ayrılmamış mıydı?"
 westheia_iraq_cabinet_1933.4.desc:0 "Aşiretlerin temsil ve yönetim konusundaki şikâyetleri isyana dönüştü. Ordunun isyanı bastırması konusundaki anlaşmazlıklar ve kabine içi bölünme karşısında Ali Cevdet el-Eyyubi, 23 Şubat’ta istifa etti. Kral, hükümeti kurması için yeniden Cemil el-Midfai’ye başvurdu."
 westheia_iraq_cabinet_1933.4.t:0 "Cemil el-Midfai Yeniden Başbakan"
 westheia_iraq_cabinet_1933.5.a:0 "Daha iki hafta bile olmadı! Yeter artık!"
 westheia_iraq_cabinet_1933.5.desc:0 "Midfai’nin dönüşü aşiret isyanlarını durduramadı. Görüşmeler sonuç vermedi, kuvvet kullanma kararı ise hükümeti kurtarmaya yetmedi. Başbakan 15 Mart’ta istifasını sundu. Şimdi, krizi çözebileceği düşünülen Yasin el-Haşimi yeni hükümeti kurdu."
 westheia_iraq_cabinet_1933.5.t:0 "On Üç Günlük Hükümetin Sonu"
 westheia_iraq_cabinet_1933.6.a:0 "Bir de bu eksikti! Şimdi hükümeti ordu mu seçecek?"
 westheia_iraq_cabinet_1933.6.desc:0 "Bakr Sidqi’nin birlikleri Bağdat’a yönelirken uçaklar, Yasin el-Haşimi’nin görevden alınmasını isteyen bildiriler attı. Hükümet binaları yakınlarına bombalar bırakıldı; Savunma Bakanı Cafer el-Askeri öldürüldü. Kral Gazi direnişe izin vermedi. Haşimi hükümeti ordunun baskısı altında çöktü."
 westheia_iraq_cabinet_1933.6.t:0 "Ordu Hükümete Ültimatom Verdi"
 westheia_iraq_cabinet_1933.7.a:0 "Pekâlâ... Bari bu hükümet birkaç ay dayansın."
 westheia_iraq_cabinet_1933.7.desc:0 "Dünkü askerî müdahalenin ardından Hikmet Süleyman yeni kabinesini kurdu. Kral Gazi tahtta kalıyor, ancak Bakr Sidqi’nin desteği yeni yönetimin temel dayanağı. Başbakan değişiklikleriyle süren kriz artık ordunun açık müdahalesine dönüşmüş durumda."
 westheia_iraq_cabinet_1933.7.t:0 "Hikmet Süleyman Hükümeti Kuruldu"
 westheia_iraq_royal_1933.1.a:0 "Kral öldü. Yaşasın Kral Gazi!"
 westheia_iraq_royal_1933.1.desc:0 "Kral I. Faysal, tedavi görmek için bulunduğu İsviçre’de hayatını kaybetti. Irak Krallığı’nın kuruluşunda önemli rol oynayan hükümdarın ölümüyle tahtın varisi oğlu Gazi olmuştur. Yeni kral, ülkenin bağımsızlığını ve Haşimi hanedanının devamlılığını koruma sorumluluğunu devralıyor."
 westheia_iraq_royal_1933.1.t:0 "I. Faysal’ın Ölümü"
 westheia_iron_guard_1933.1.a:0 "Bu aşırılık yanlılarının siyasette yeri yok!"
 westheia_iron_guard_1933.1.b:0 "Yasaklamak onları daha da radikalleştirir."
 westheia_iron_guard_1933.1.d:0 "Başbakan Ion G. Duca'nın hükûmeti, yaklaşan parlamento seçimleri öncesinde Corneliu Zelea Codreanu önderliğindeki Demir Muhafızlar hareketinin faaliyetlerini durdurmayı tartışıyor. Aşırı milliyetçi ve faşist hareketin başvurduğu siyasi şiddet, paramiliter örgütlenmesi ve anayasal düzene düşmanlığı, devlet makamlarında giderek artan bir kaygı yaratıyor.\n\nYasaklama kararı, örgütün seçimlere katılmasını engelleyecek ve üyelerine yönelik tutuklamaların önünü açacaktır. Hükûmet içindeki sertlik yanlıları devletin otoritesinin korunmasını isterken, diğerleri böylesine geniş bir müdahalenin ülkedeki siyasi gerilimi daha da tırmandıracağından endişe ediyor."
 westheia_iron_guard_1933.1.t:0 "Demir Muhafızların Yasaklanması"
 westheia_iron_guard_1933.2.a:0 "Devlet teröristlere boyun eğmez!"
 westheia_iron_guard_1933.2.d:0 "Başbakan Ion G. Duca, Kral II. Carol ile Peleș Sarayı'nda yaptığı görüşmenin ardından Bükreş'e dönmek üzere geldiği Sinaia tren istasyonunda silahlı saldırıya uğradı. Peronda açılan ateş, başbakanın hayatına son verdi.\n\nSaldırıyı, Demir Muhafızlar'a bağlı ve Nicadori olarak bilinen üç kişilik bir grup gerçekleştirdi. Cinayetin, örgütün yasaklanmasına ve üyelerine yönelik tutuklamalara karşı bir misilleme olduğu düşünülüyor. Hükûmetin başsız kalması Bükreş'te derin bir sarsıntı yaratırken güvenlik güçleri operasyonlarını genişletiyor. Devlet idaresinin devamlılığını sağlamak üzere Constantin Angelescu geçici olarak hükûmetin başına getiriliyor."
 westheia_iron_guard_1933.2.t:0 "Sinaia'da Suikast"
 westheia_iron_guard_1933.3.a:0 "Romanya'da siyasi şiddet büyüyor."
 westheia_iron_guard_1933.3.d:0 "Romanya Başbakanı Ion G. Duca, Sinaia tren istasyonunda Demir Muhafızlar'a bağlı silahlı bir grubun saldırısında öldürüldü. Kral II. Carol ile Peleș Sarayı'nda görüşen başbakan, başkente dönmeye hazırlanırken hedef alındı.\n\nAşırı sağcı hareketin yasaklanmasının ardından işlenen cinayet, Romanya'daki siyasi çatışmayı yeni bir boyuta taşıdı. Güvenlik güçleri Demir Muhafızlar'a yönelik operasyonlarını sürdürürken Constantin Angelescu, kalıcı bir kabine kurulana kadar başbakanlığı geçici olarak üstlendi. Avrupa başkentleri, Bükreş'teki krizin ülkenin istikrarı üzerindeki etkilerini kaygıyla izliyor."
 westheia_iron_guard_1933.3.t:0 "Romanya Başbakanı Suikasta Uğradı!"
 westheia_japan_1933.1.a:0 "Yeni kabineyi Okada kursun."
 westheia_japan_1933.1.d:0 "Teijin hisselerinin satışına ilişkin rüşvet iddiaları, üst düzey bürokratları ve iş insanlarını soruşturmanın odağına taşıdı. Skandalın siyasi baskısı altında Makoto Saitō'nun kabinesi topluca istifa etti. İmparator Hirohito, yeni hükümeti kurma görevini eski Donanma Bakanı Amiral Keisuke Okada'ya verdi."
 westheia_japan_1933.1.t:0 "Teijin Skandalı"
 westheia_jehol_1933.1.a:0 "Hazırlıkları tamamlayın."
 westheia_jehol_1933.1.d:0 "Kwantung Ordusu, Jehol sınırındaki Çin kuvvetlerine karşı sınırlı bir harekâtın hazırlıklarına başladı. Mançukuo yönetiminin bölge üzerindeki iddiasını destekleyen subaylar, Çin birliklerinin geri çekilmesini sağlayarak Mançurya’nın güneybatı yaklaşımını güvence altına almak istiyor.\n\nLiaotung’da toplanacak Mançukuo birlikleri, hazırlıkların tamamlanmasının ardından sınırdaki Çin mevzilerini sınayacak. Bu girişimin başarısı, bölgedeki askerî dengeleri ve Mançukuo’nun gelecekteki sınırlarını belirleyebilir."
 westheia_jehol_1933.1.t:0 "Jehol Sınırında Hazırlık"
 westheia_jehol_1933.2.a:0 "Jehol, Mançukuo idaresine geçecek."
 westheia_jehol_1933.2.d:0 "Jehol sınırındaki çatışma kuvvetlerimizin üstünlüğüyle sonuçlandı. Çin birliklerinin savunması çözülürken Kwantung Ordusu’nun desteklediği harekât, bölgedeki geçitlerin ve yerleşimlerin denetimini ele geçirmemizin önünü açtı.\n\nMançukuo yönetimi, uzun süredir ileri sürdüğü toprak iddiasını fiilî idareye dönüştürmeye hazırlanıyor. Jehol’un Mançukuo’ya bağlanması, Mançurya ile Kuzey Çin arasındaki sınır düzenini bir kez daha değiştirecek."
 westheia_jehol_1933.2.t:0 "Jehol’da Çin Birlikleri Geri Çekildi"
 westheia_jehol_1933.3.a:0 "Bu başarısızlıktan ders çıkaracağız."
 westheia_jehol_1933.3.d:0 "Jehol sınırında Çin birliklerinin direncini sınamak amacıyla başlattığımız harekât beklenen sonucu vermedi. Savunma mevzilerini aşamayan kuvvetlerimiz geri çekilmek zorunda kalırken bölge Çin’in elinde kaldı.\n\nÇin hükûmeti sınırdaki girişimimizi egemenliğine yönelik yeni bir saldırı olarak kınadı. İki ülke arasındaki güvensizlik daha da derinleşirken subaylarımız çatışmadan çıkarılan dersleri değerlendirmeye başladı."
 westheia_jehol_1933.3.t:0 "Jehol Harekâtı Başarısız Oldu"
 westheia_jehol_1933.4.a:0 "Sınır mevzilerini savunun."
 westheia_jehol_1933.4.d:0 "Japon birliklerinin Jehol sınırındaki hareketliliği artıyor. Kwantung Ordusu’nun desteklediği askerî çevreler, bölgenin Mançukuo’ya ait olduğunu öne sürerek birliklerimizin geri çekilmesini istiyor.\n\nLiaotung’daki hazırlıklar, bu taleplerin yakında askerî bir girişimle desteklenebileceğini gösteriyor. Jehol’un savunmasını üstlenen birliklerimiz, yaklaşan sınır çatışmasına karşı hazırlıklı olmalı."
 westheia_jehol_1933.4.t:0 "Jehol Sınırında Japon Baskısı"
 westheia_jehol_1933.5.a:0 "Kuzeydeki durum ağırlaşıyor."
 westheia_jehol_1933.5.d:0 "Jehol sınırındaki birliklerimiz Japon kuvvetlerinin baskısına dayanamayarak geri çekildi. Çatışmanın ardından bölgedeki denetimimiz sarsılırken Mançukuo yönetimi, Japon desteğiyle Jehol’un idaresini devralmaya hazırlanıyor.\n\nBu yenilgi, kuzeydeki güvenliğimiz açısından ağır bir darbe oldu. Japonya’nın Mançukuo üzerinden sürdürdüğü yayılma siyaseti, ülkemizin egemenliğine yönelik tehdidi büyütüyor."
 westheia_jehol_1933.5.t:0 "Jehol Savunması Çözüldü"
 westheia_jehol_1933.6.a:0 "Jehol’u savunmayı başardık."
 westheia_jehol_1933.6.d:0 "Jehol sınırındaki savunma birliklerimiz, Japon kuvvetlerinin ilerleme girişimini durdurdu. Hazırlanan mevziler ve gösterilen direnç sayesinde sınır hattı korunurken saldırgan birlikler geri çekilmek zorunda kaldı.\n\nJehol Çin’in elinde kaldı; ancak çatışma iki ülke arasındaki güvensizliği daha da artırdı. Bu başarı, kuzey sınırlarımızdaki tehdidin ortadan kalktığı anlamına gelmiyor."
 westheia_jehol_1933.6.t:0 "Jehol’da Japon Girişimi Durduruldu"
 westheia_jehol_1933.7.a:0 "Birlikler durumu yeniden değerlendirsin."
 westheia_jehol_1933.7.d:0 "Jehol sınırındaki harekât kesin bir sonuca ulaşmadan durduruldu. Değişen askerî ve diplomatik koşullar nedeniyle mevcut girişimin sürdürülmesi mümkün görünmüyor.\n\nBu çatışma kapsamında herhangi bir toprak devri yapılmayacak. Bölgedeki askerî durum yeniden değerlendirilmek zorunda."
 westheia_jehol_1933.7.t:0 "Jehol Harekâtı Durduruldu"
 westheia_jehol_1933.8.a:0 "Sınırda teyakkuzu koruyun."
 westheia_jehol_1933.8.d:0 "Jehol sınırındaki çatışma kesin bir sonuca ulaşmadan sona erdi. Bölgenin idaresinde bu girişimden kaynaklanan bir değişiklik olmadı.\n\nSınırdaki birliklerimiz tetikte kalırken askerî makamlar son gelişmeleri değerlendirmeye devam ediyor."
 westheia_jehol_1933.8.t:0 "Jehol Sınırında Çatışma Sona Erdi"
 westheia_kaan.2.a:0 "Bakın, bakın Kürdistan'a bakın."
 westheia_kaan.2.d:0 "Türkiye'deki Kürtlerin özgürlüğü için ilan edilen seferberlik, başkentte beklenmedik bir iktidar değişimini beraberinde getirdi. Ülkenin lideri hayatını kaybetti; hükümet içinde artık geri dönüşü olmayan bir konuma ulaşan Kürt Kaan yönetimi devraldı.\n\nEski siyasi düzenin kurumları yerinde duruyor, fakat onları yöneten irade değişti. Kaan, ilk konuşmasında halkına dönerek aynı çağrıyı tekrarladı: Kürdistan'a bakın."
 westheia_kaan.2.t:0 "Kaan Yönetimi Devraldı"
 westheia_kaan_look_at_kurdistan:0 "Bakın, bakın Kürdistan'a bakın."
 westheia_kaan_look_at_kurdistan_desc:0 "Kaan'ın çağrısı meydanlardan cepheye kadar yankılanır. Milisler daha kararlı savaşır, piyade silahları daha ucuza üretilir ve düşmandan ele geçirilen teçhizat yeniden kullanılır. Fakat bu seferberliğin siyasi bedeli ağırdır; işgal edilen bölgelerde yeni yönetime alışmak kolay olmaz."
 westheia_kaan_world_claims_tt:0 "Dünyadaki bütün bölgeler üzerinde hak iddiası kazanırız."
 westheia_kurdistandir:0 "Kürdistandır"
 westheia_kurdistandir_desc:0 "Kaan, farklı siyasi hareketlerle köprü kurarken halkının kimliğini iktidarın merkezine yerleştirir. Herkesin desteğine açıktır; bu açıklık, dış ideolojilerin ülkeye sızmasını da kolaylaştırır. Bir kez hükümete alındığında görevinden uzaklaştırılamaz."
 westheia_latvia_1933.1.a:0 "Riga’da parlamentonun sesi susturuldu."
 westheia_latvia_1933.1.d:0 "Başbakan Kārlis Ulmanis, Jānis Balodis’in ve kendisine bağlı güvenlik güçlerinin desteğiyle Letonya’da yönetimi ele geçirdi. Ordu, polis ve Aizsargi birlikleri başlıca devlet kurumlarını denetim altına alırken ülke genelinde olağanüstü hâl ilan edildi. Saeima’nın çalışmaları durduruldu, siyasi partilerin faaliyetlerine son verildi ve muhalif isimler tutuklandı.\n\nUlmanis, müdahaleyi parti çekişmelerine son vermek ve ulusal birliği sağlamak için gerekli bir adım olarak sunuyor. Parlamentonun yetkilerini Bakanlar Kurulu’nun üstlenmesiyle, Letonya’da siyasi iktidar dar bir yönetici çevrenin elinde toplandı. Riga’daki bu gelişme, Baltıklar’da parlamenter yönetimin bir kez daha otoriterliğe yenik düştüğünü gösteriyor."
 westheia_latvia_1933.1.t:0 "Letonya’da Ulmanis Darbesi"
 westheia_latvia_cabinet_1933.1.a:0 "Bļodnieks yeni hükümeti kursun."
 westheia_latvia_cabinet_1933.1.d:0 "Marģers Skujenieks'in kabinesinin ardından yeni hükümet kurma görüşmeleri sonuçlandı. Büyük Buhran'ın ağırlaştırdığı mali sorunlar ve parçalı Saeima'da kalıcı bir çoğunluk oluşturmanın güçlüğü, koalisyon siyasetini yıpratmayı sürdürüyor.\n\nCumhurbaşkanı Alberts Kviesis döneminde yürütülen görüşmelerin ardından Ādolfs Bļodnieks yeni kabinenin başına geçti. Çiftçiler ve küçük toprak sahiplerini temsil eden Bļodnieks, mali istikrarı korumak ve ekonomik sıkıntıları hafifletmek için parlamentodaki farklı grupların desteğini bir arada tutmak zorunda."
 westheia_latvia_cabinet_1933.1.t:0 "Skujenieks Hükümetinin Sonu"
 westheia_latvia_cabinet_1933.2.a:0 "Ulmanis hükümetin başına geçsin."
 westheia_latvia_cabinet_1933.2.d:0 "Ādolfs Bļodnieks'in hükümeti, bütçe tartışmaları ve koalisyon içindeki anlaşmazlıklar karşısında meclis desteğini koruyamadı. Yeni kabineyi kurma görevi, Zemnieku savienība'nın deneyimli lideri Kārlis Ulmanis'e verildi.\n\nUlmanis yeniden başbakanlık koltuğuna otururken Alberts Kviesis cumhurbaşkanlığını sürdürüyor. Yeni hükümet görevine parlamenter düzen içinde başlıyor; Saeima ve anayasa yürürlükte kalmaya devam ediyor."
 westheia_latvia_cabinet_1933.2.t:0 "Ulmanis Yeni Kabineyi Kuruyor"
 westheia_lithuania_1933.1.a:0 "Darbe girişimini bastırın; hükümetin otoritesini koruyacağız."
 westheia_lithuania_1933.1.b:0 "Girişim yenildi; destekçilerine karşı daha yumuşak davranalım."
 westheia_lithuania_1933.1.d:0 "Voldemaras yanlısı subayların hükümeti devirmeye yönelik girişimi başarısızlığa uğradı. Cumhurbaşkanı Smetona geri adım atmadı ve Tūbelis hükümeti görevini korudu. Şimdi darbecilerin siyasi etkisini kırmak ile daha yumuşak bir tutum benimsemek arasında karar vermeliyiz. İkinci yol kısa vadeli bir uzlaşma sağlayabilir, fakat Voldemaras yanlılarına kendilerini yeniden örgütleme fırsatı da verecektir."
 westheia_lithuania_1933.1.t:0 "Voldemaras Darbe Girişimi"
 westheia_little_entente_1933.1.a:0 "Orta Avrupa'da daha sıkı bir iş birliği."
 westheia_little_entente_1933.1.d:0 "Yugoslavya, Romanya ve Çekoslovakya temsilcileri, Cenevre'de imzaladıkları teşkilatlanma paktıyla Küçük Antant'a daha kalıcı bir yapı kazandırdı. Üç ülkenin dışişleri bakanlarından oluşacak Daimî Konsey, ortak dış politikanın yürütülmesini sağlayacak; bir sekreterya da çalışmaların devamlılığını gözetecek.\n\nMacaristan'ın sınırların değiştirilmesine yönelik talepleri ve Orta Avrupa'da artan belirsizlik karşısında Belgrad, Bükreş ve Prag birlikte hareket etme kararlılığını vurguluyor. Kurulacak Ekonomik Konsey, üyelerin ekonomik çıkarlarını yakınlaştırmayı amaçlarken, karşılıklı ticaret anlaşmaları da üç ülke arasındaki bağları kuvvetlendiriyor. Küçük Antant, savaş sonrası düzeni korumak için saflarını sıklaştırıyor."
 westheia_little_entente_1933.1.t:0 "Küçük Antant Bağlarını Güçlendiriyor"
 westheia_ma_1933.1.a:0 "Yeni birlikler mevzilerini alsın."
 westheia_ma_1933.1.d:0 "Ningxia eyaletinin yönetimine atanan Ma Hongkui, beraberinde getirdiği bağımsız tugaylarla bölgeye ulaştı. Bu birliklerin gelişi, eyaletteki askerî güç dengesini değiştiriyor. Ma Hongbin’in mevcut kuvvetlerinin yanında artık Ma Hongkui’nin doğrudan komuta ettiği askerler de bulunuyor. Yeni birliklerin yerleştirilmesi ve iaşesinin düzenlenmesi, eyalet yönetiminin önündeki ilk görev olacak."
 westheia_ma_1933.1.t:0 "Ma Hongkui Ningxia’ya Ulaştı"
 westheia_malaya_1933.1.a:0 "Caldecott valiliği vekâleten yürütsün."
 westheia_malaya_1933.1.d:0 "Boğazlar Yerleşimleri Valisi ve Malay Devletleri Yüksek Komiseri Sir Cecil Clementi, sağlık sorunları nedeniyle İngiltere’ye dönmek üzere görevinden ayrılıyor. Clementi’nin yokluğunda idarenin kesintiye uğramaması için Sömürge Sekreteri Andrew Caldecott valilik görevini vekâleten üstlenecek.\n\nYeni bir kalıcı vali göreve başlayana kadar Caldecott, mevcut idari düzenin devamlılığından sorumlu olacak. Ekonomik bunalımın kauçuk ve kalay üretimi üzerindeki baskısı sürerken, sömürge makamları mali istikrarı ve üretimin devamını sağlamaya çalışıyor."
 westheia_malaya_1933.1.t:0 "Clementi’nin Ayrılışı"
 westheia_malaya_1933.2.a:0 "Valilik görevini Shenton Thomas devralsın."
 westheia_malaya_1933.2.d:0 "Sir Cecil Clementi’nin sağlık nedenleriyle ayrılmasının ardından valilik görevini vekâleten yürüten Andrew Caldecott, idareyi yeni atanan Sir Shenton Thomas’a devrediyor. Daha önce Altın Sahili valiliğinde bulunan Thomas, Boğazlar Yerleşimleri Valisi ve Malay Devletleri Yüksek Komiseri olarak görevine başlayacak.\n\nKalıcı valinin gelişiyle geçici idare dönemi sona eriyor. Caldecott sömürge yönetimindeki görevlerine dönerken Thomas, İngiliz idaresinin devamlılığını sağlamak ve bölgenin ekonomik sorunlarıyla ilgilenmek üzere sorumluluğu üstleniyor."
 westheia_malaya_1933.2.t:0 "Shenton Thomas Göreve Başlıyor"
 westheia_man_focus_1933.1.a:0 "Gemiyi devredelim."
 westheia_man_focus_1933.1.b:0 "Gemiyi kendi hizmetimizde tutacağız."
 westheia_man_focus_1933.1.d:0 "Mançukuo yönetimi, eski Kashi muhribinin kıyı devriyesi amacıyla kendi donanmasına devredilmesini talep ediyor. Geminin Hai Wei adıyla hizmete alınması, bağlı devletimizin sınırlı deniz gözetim imkânlarını güçlendirecektir."
 westheia_man_focus_1933.1.t:0 "Mançukuo Hai Wei’nin Devrini İstiyor"
 westheia_man_focus_1933.10.a:0 "Yönetimi Mançukuo’ya devredelim."
 westheia_man_focus_1933.10.b:0 "Bu toprakların yönetimi bizde kalacak."
 westheia_man_focus_1933.10.d:0 "Mançukuo hükûmeti, bölgesel yönetim ve stratejik işbirliği gerekçeleriyle Japonya’nın elindeki Çinhindi topraklarının Mançukuo’ya devri için başvuruda bulundu. Toprakların devri, bağlı devletimizin sorumluluklarını genişletecek."
 westheia_man_focus_1933.10.t:0 "Mançukuo: Çinhindi Talebi"
 westheia_man_focus_1933.11.a:0 "Yeni yönetimi kurmaya başlayalım."
 westheia_man_focus_1933.11.d:0 "Japonya, elinde tuttuğu ilgili toprakların yönetimini ülkemize devretmeyi kabul etti."
 westheia_man_focus_1933.11.t:0 "Çinhindi Talebimiz Kabul Edildi"
 westheia_man_focus_1933.12.a:0 "Kararı not ediyoruz."
 westheia_man_focus_1933.12.d:0 "Japonya bölgenin yönetimini kendi elinde tutmaya karar verdi. Toprak devri gerçekleşmeyecek."
 westheia_man_focus_1933.12.t:0 "Çinhindi Talebimiz Reddedildi"
 westheia_man_focus_1933.13.a:0 "Yönetimi Mançukuo’ya devredelim."
 westheia_man_focus_1933.13.b:0 "Bu toprakların yönetimi bizde kalacak."
 westheia_man_focus_1933.13.d:0 "Mançukuo hükûmeti, bölgesel yönetim ve stratejik işbirliği gerekçeleriyle Japonya’nın elindeki Kore topraklarının Mançukuo’ya devri için başvuruda bulundu. Toprakların devri, bağlı devletimizin sorumluluklarını genişletecek."
 westheia_man_focus_1933.13.t:0 "Mançukuo: Kore Talebi"
 westheia_man_focus_1933.14.a:0 "Yeni yönetimi kurmaya başlayalım."
 westheia_man_focus_1933.14.d:0 "Japonya, elinde tuttuğu ilgili toprakların yönetimini ülkemize devretmeyi kabul etti."
 westheia_man_focus_1933.14.t:0 "Kore Talebimiz Kabul Edildi"
 westheia_man_focus_1933.15.a:0 "Kararı not ediyoruz."
 westheia_man_focus_1933.15.d:0 "Japonya bölgenin yönetimini kendi elinde tutmaya karar verdi. Toprak devri gerçekleşmeyecek."
 westheia_man_focus_1933.15.t:0 "Kore Talebimiz Reddedildi"
 westheia_man_focus_1933.16.a:0 "İlgili bölgeleri devredelim."
 westheia_man_focus_1933.16.b:0 "İmtiyazlarımızdan vazgeçmeyeceğiz."
 westheia_man_focus_1933.16.d:0 "Mançukuo, Çin kıyılarında yönetimimizde bulunan imtiyaz bölgelerinin devredilmesini talep ediyor. Japonya’nın bağlı devleti olarak hareket eden bu yönetimin talebini reddetmek, Tokyo ile de gerilim yaratabilir."
 westheia_man_focus_1933.16.t:0 "Mançukuo Kıyı İmtiyazlarını Geri İstiyor"
 westheia_man_focus_1933.17.a:0 "Diplomasi sonuç verdi."
 westheia_man_focus_1933.17.d:0 "Muhatap hükûmet, elindeki ilgili kıyı imtiyaz bölgelerini ülkemize devretmeyi kabul etti."
 westheia_man_focus_1933.17.t:0 "Kıyı Bölgelerinin Devri Kabul Edildi"
 westheia_man_focus_1933.18.a:0 "Konuyu Tokyo’ya iletelim."
 westheia_man_focus_1933.18.d:0 "Muhatap hükûmet kıyı bölgelerinin devrine karşı çıktı. Japonya’ya bağlı olduğumuz için bu anlaşmazlıkta savaş hedefi Tokyo’ya aittir."
 westheia_man_focus_1933.18.t:0 "Kıyı Bölgeleri Talebimiz Reddedildi"
 westheia_man_focus_1933.2.a:0 "Hai Wei’ye hoş geldin."
 westheia_man_focus_1933.2.d:0 "Japonya talebimizi kabul etti. Eski Kashi, Hai Wei adıyla donanmamızda hizmete giriyor."
 westheia_man_focus_1933.2.t:0 "Hai Wei Donanmamıza Katılıyor"
 westheia_man_focus_1933.3.a:0 "Şimdilik kararlarını kabul edelim."
 westheia_man_focus_1933.3.d:0 "Japonya, geminin devredilmesi talebimizi kabul etmedi. Deniz gözetim teşkilatımızı mevcut imkânlarla sürdürmek zorundayız."
 westheia_man_focus_1933.3.t:0 "Hai Wei Talebi Reddedildi"
 westheia_man_focus_1933.4.a:0 "Statülerini yükseltelim."
 westheia_man_focus_1933.4.b:0 "Mevcut düzen devam edecek."
 westheia_man_focus_1933.4.d:0 "Mançukuo hükûmeti, eşitsiz antlaşmaların yeniden görüşülmesi kapsamında Japon İmparatorluğu içindeki statüsünün yükseltilmesini talep ediyor. Yönetim, İmparatorluk Üyesi olarak daha geniş bir hareket alanı istiyor."
 westheia_man_focus_1933.4.t:0 "Mançukuo Daha Geniş Özerklik İstiyor"
 westheia_man_focus_1933.5.a:0 "Yeni statümüzü kabul ediyoruz."
 westheia_man_focus_1933.5.d:0 "Japonya statümüzü İmparatorluk Üyesi olarak yükseltmeyi kabul etti. Yeni düzenleme, imparatorluk içindeki özerkliğimizi genişletiyor."
 westheia_man_focus_1933.5.t:0 "Özerklik Talebimiz Kabul Edildi"
 westheia_man_focus_1933.6.a:0 "Müzakerelere devam edeceğiz."
 westheia_man_focus_1933.6.d:0 "Japon hükûmeti mevcut bağlılık düzeninin korunmasına karar verdi. Antlaşmaların diğer alanlarındaki düzenlemelerimiz yürürlükte kalıyor."
 westheia_man_focus_1933.6.t:0 "Özerklik Talebimiz Reddedildi"
 westheia_man_focus_1933.7.a:0 "Yönetimi Mançukuo’ya devredelim."
 westheia_man_focus_1933.7.b:0 "Bu toprakların yönetimi bizde kalacak."
 westheia_man_focus_1933.7.d:0 "Mançukuo hükûmeti, bölgesel yönetim ve stratejik işbirliği gerekçeleriyle Doğu Hebei’nin yönetiminin Mançukuo’ya devri için başvuruda bulundu. Toprakların devri, bağlı devletimizin sorumluluklarını genişletecek."
 westheia_man_focus_1933.7.t:0 "Mançukuo: Doğu Hebei Talebi"
 westheia_man_focus_1933.8.a:0 "Yeni yönetimi kurmaya başlayalım."
 westheia_man_focus_1933.8.d:0 "Japonya, elinde tuttuğu ilgili toprakların yönetimini ülkemize devretmeyi kabul etti."
 westheia_man_focus_1933.8.t:0 "Doğu Hebei Talebimiz Kabul Edildi"
 westheia_man_focus_1933.9.a:0 "Kararı not ediyoruz."
 westheia_man_focus_1933.9.d:0 "Japonya bölgenin yönetimini kendi elinde tutmaya karar verdi. Toprak devri gerçekleşmeyecek."
 westheia_man_focus_1933.9.t:0 "Doğu Hebei Talebimiz Reddedildi"
 westheia_manchukuo_1933.1.a:0 "İmparator Kangde’nin saltanatı başlasın."
 westheia_manchukuo_1933.1.d:0 "Mançukuo’nun baş yöneticisi Puyi, başkent Hsinking’de düzenlenen törenlerle imparatorluk tahtına çıktı. Son Qing imparatoru, yeni hükümdarlık devri için Kangde adını benimserken devletin resmî yapısı da imparatorluk olarak yeniden tanımlanıyor.\n\nSaray, taç giyme törenini hanedan meşruiyetinin yeniden doğuşu olarak sunuyor. Buna rağmen Japon danışmanların ve Kwantung Ordusu’nun yönetim üzerindeki etkisi sürüyor. Zheng Xiaoxu başbakanlık görevine devam ederken Puyi, artık İmparator Kangde unvanıyla devletin simgesi olacak."
 westheia_manchukuo_1933.1.t:0 "Puyi’nin Taç Giyme Töreni"
 westheia_manchukuo_1933.2.a:0 "Hükûmeti Zhang Jinghui devralsın."
 westheia_manchukuo_1933.2.d:0 "Zheng Xiaoxu’nun hükûmetin yetkileri ve Japon danışmanların müdahaleleri konusundaki itirazları, Kwantung Ordusu ile ilişkilerini giderek zorlaştırdı. Mançukuo idaresi üzerinde daha sıkı bir denetim isteyen Japon askerî makamları, başbakanlıkta bir değişiklik yapılmasını sağladı.\n\nZheng’in yerine, Japonlarla yakın iş birliği içinde çalışan Zhang Jinghui atanıyor. İmparator Puyi’nin saraydaki konumu korunurken hükûmetin günlük idaresi yeni başbakana devredilecek. Bu değişiklik, Mançukuo yönetiminin Japon askerî makamlarına bağımlılığının süreceğini gösteriyor."
 westheia_manchukuo_1933.2.t:0 "Zheng Xiaoxu’nun Yerine Zhang Jinghui"
 westheia_marseille_1933.1.a:0 "Avrupa'da huzur yine bozuldu."
 westheia_marseille_1933.1.d:0 "Fransa'ya resmî bir ziyaret için gelen Yugoslavya Kralı I. Aleksandar, Marsilya sokaklarında halkı selamlarken uğradığı silahlı saldırıda hayatını kaybetti. Aynı araçta bulunan Fransız Dışişleri Bakanı Louis Barthou da aldığı yara nedeniyle yaşamını yitirdi. İki devlet adamının ölümü, Avrupa başkentlerinde büyük bir sarsıntı yarattı. Yugoslavya'da tahta çıkan on bir yaşındaki II. Petar adına, Prens Paul'ün başkanlığında bir naiplik yönetimi kuruldu.\n\nSaldırı, Hırvat ayrılıkçı Ustaşa hareketi ile İç Makedon Devrimci Örgütü'nün iş birliğine bağlanıyor. Ustaşa mensuplarının Macaristan'daki faaliyetleri ve Jankapuszta kampı hakkındaki suçlamalar, Belgrad'ın Budapeşte'ye duyduğu güvensizliği yeniden alevlendirdi. Balkanlar'da zaten kırılgan olan diplomatik denge, şimdi yeni bir sınavla karşı karşıya."
 westheia_marseille_1933.1.t:0 "Marsilya Suikastı"
 westheia_marseille_1933.2.a:0 "Prens Paul naipliği üstlensin."
 westheia_marseille_1933.2.d:0 "Fransa'ya resmî bir ziyaret için giden Kral I. Aleksandar, Marsilya'da halkı selamlarken silahlı saldırıya uğrayarak hayatını kaybetti. Saldırganın İç Makedon Devrimci Örgütü ve Ustaşa hareketiyle bağlantılı olduğu bildiriliyor. Kralın yanında bulunan Fransız Dışişleri Bakanı Louis Barthou da aldığı yara sonucunda öldü.\n\nTaht, henüz on bir yaşındaki II. Petar'a geçti. Yeni kralın yaşının küçüklüğü nedeniyle devlet idaresi bir naiplik heyetine bırakılıyor; heyetin başında Prens Paul yer alacak. Saray, ordunun ve devlet kurumlarının yeni yönetime bağlılığını sağlamaya çalışırken ülke, kralın ölümüyle açılan belirsiz bir döneme giriyor."
 westheia_marseille_1933.2.t:0 "Kral I. Aleksandar Suikastı"
 westheia_mexico_1933.1.a:0 "Cárdenas yeni dönem için başkan seçildi."
 westheia_mexico_1933.1.d:0 "1 Temmuz seçiminde Ulusal Devrimci Parti'nin adayı Lázaro Cárdenas başkan seçildi. Toprak reformu, işçilerin koşulları ve altı yıllık kalkınma programı yeni dönemin temel meseleleri olacak.\n\nSeçim sonucu başkanlık makamının bugün devredildiği anlamına gelmiyor. Abelardo L. Rodríguez geçiş dönemi boyunca görevini sürdürecek; Cárdenas Aralık ayında yönetimi devralacak."
 westheia_mexico_1933.1.t:0 "1934 Başkanlık Seçimi"
 westheia_mexico_1933.2.a:0 "Okullar bilimin ve toplumsal ilerlemenin hizmetinde olacak."
 westheia_mexico_1933.2.b:0 "Kilise'yle yeni bir çatışmaya gerek yok."
 westheia_mexico_1933.2.d:0 "Hükûmet, eğitimi devletin toplumsal dönüşüm programının merkezine yerleştiren yeni bir düzenlemeyi gündeme aldı. Okulların dinî öğretiden uzaklaştırılması, bilimsel düşüncenin güçlendirilmesi ve eğitimin işçi ve köylülerin ihtiyaçlarına yöneltilmesi amaçlanıyor.\n\nKilise çevreleri ve muhafazakâr aileler, devletin çocukların yetiştirilmesi üzerinde daha geniş bir denetim kurmasına karşı çıkıyor. Reformu savunanlar ise cehaletle ve toplumsal eşitsizlikle mücadele için laik bir okul düzeninin gerekli olduğunu belirtiyor. Eğitimdeki bu değişikliği hayata geçirecek miyiz, yoksa Kilise'yle yeni bir çatışmadan kaçınacak mıyız?"
 westheia_mexico_1933.2.t:0 "Sosyalist Eğitim Reformu"
 westheia_mexico_1933.3.a:0 "Yeni başkan görevine başlasın."
 westheia_mexico_1933.3.d:0 "Temmuz seçimlerinin ardından beklenen görev devri gerçekleşiyor. Abelardo L. Rodríguez'in başkanlığı sona ererken Lázaro Cárdenas yeni dönemin sorumluluğunu üstleniyor.\n\nYeni başkan altı yıllık programı uygulamayı ve devrimin toplumsal vaatlerini hayata geçirmeyi hedefliyor. Calles'in parti içindeki etkisi ise yönetimin önündeki temel siyasi meselelerden biri olmaya devam ediyor."
 westheia_mexico_1933.3.t:0 "Cárdenas Başkanlığı Devralıyor"
 westheia_military_dictatorship:0 "Askerî Diktatörlük"
 westheia_military_dictatorship_desc:0 "§YAskerî Diktatörlük§!\n\n\n\n\n\n\n\n\n\n£GFX_westheia_subtype_banner_military\n\n\n\n\n\n\n\n\n\n\nDevletin yönetimi, silahlı kuvvetlerin desteğine dayanan askerî bir liderin elinde toplanmıştır. Siyasi kurumlar ve sivil idare, askerî otoritenin belirleyici etkisi altında faaliyet gösterir."
 westheia_naval_1933.1.a:0 "Beş muhribin devrini onaylayın."
 westheia_naval_1933.1.b:0 "Gemiler Kraliyet Donanması’nda kalacak."
 westheia_naval_1933.1.d:0 "Avustralya hükûmeti, Kraliyet Avustralya Donanması’nın yaşlanan muhrip kuvvetini yenilemek amacıyla bize başvurdu. Stuart ile V ve W sınıfı Vampire, Vendetta, Voyager ve Waterhen’in devri, Pasifik’teki deniz yollarının korunmasına katkıda bulunabilir. Gemiler yeni olmamakla birlikte mevcut Avustralya muhriplerine göre yararlı bir takviye sağlayacaktır. Anlaşma kapsamında bakım, ikmal ve hizmete hazırlık giderleri için ekonomik bir karşılık da alınacaktır."
 westheia_naval_1933.1.t:0 "Avustralya’nın Muhrip Talebi"
 westheia_naval_1933.2.a:0 "Donanmamız için değerli bir takviye."
 westheia_naval_1933.2.d:0 "Londra, beş muhribin Kraliyet Avustralya Donanması’na devredilmesini onayladı. Stuart, Vampire, Vendetta, Voyager ve Waterhen artık donanmamızın emrindedir. Yaşlarına rağmen bu gemiler, kıyılarımızın ve imparatorluğun deniz yollarının savunmasında önemli görevler üstlenebilir."
 westheia_naval_1933.2.t:0 "Britanya Muhrip Devrini Onayladı"
 westheia_naval_1933.3.a:0 "Başka imkânlar aramalıyız."
 westheia_naval_1933.3.d:0 "Britanya hükûmeti, talep ettiğimiz beş muhribi devretmeyeceğini bildirdi. Gemiler Kraliyet Donanması’nın hizmetinde kalacak. Bu anlaşmadan donanmamıza herhangi bir gemi katılmayacak."
 westheia_naval_1933.3.t:0 "Britanya Muhrip Talebimizi Reddetti"
 westheia_naval_1933.4.a:0 "Kruvazör değişimini onaylayın."
 westheia_naval_1933.4.b:0 "Modern kruvazörleri devretmeyeceğiz."
 westheia_naval_1933.4.d:0 "Yeni Zelanda hükûmeti, Kraliyet Donanması’nın Yeni Zelanda Tümeni’nde görev yapan yaşlı Dunedin ve Diomede’nin yerine daha modern Achilles ve Leander’ın tahsis edilmesini istiyor. Eski gemiler geri alınırken modern kruvazörler Pasifik’teki görevleri üstlenecek. Anlaşma, gemilerin hizmete hazırlanması ve ikmal giderlerine karşılık bir ekonomik katkıyı da kapsıyor."
 westheia_naval_1933.4.t:0 "Yeni Zelanda’nın Kruvazör Değişimi Teklifi"
 westheia_naval_1933.5.a:0 "Yeni kruvazörler göreve hazır."
 westheia_naval_1933.5.d:0 "Britanya, kruvazör değişimi teklifimizi kabul etti. Hizmetimizde kalan Dunedin ve Diomede geri verilirken Achilles ve Leander Yeni Zelanda Tümeni’ne katıldı. Daha modern gemiler, Pasifik’teki devriye ve deniz yollarını koruma görevlerinde donanmamızın kapasitesini artıracaktır."
 westheia_naval_1933.5.t:0 "Britanya Kruvazör Değişimini Onayladı"
 westheia_naval_1933.6.a:0 "Mevcut gemilerimizle devam edeceğiz."
 westheia_naval_1933.6.d:0 "Londra, Achilles ve Leander’ın devrine onay vermedi. Önerdiğimiz değişim gerçekleşmeyecek; her iki ülkenin gemileri mevcut donanmalarında kalacak."
 westheia_naval_1933.6.t:0 "Britanya Kruvazör Değişimini Reddetti"
 westheia_nepal_1933.1.a:0 "İnsanlara yardım etmeliyiz!"
 westheia_nepal_1933.1.b:0 "Daha büyük sorunlarımız var"
 westheia_nepal_1933.1.d:0 "15 Ocak öğleden sonra meydana gelen şiddetli deprem, Nepal’in geniş bir bölümünü ve sınırın ötesindeki Bihar’ı sarstı. Katmandu Vadisi’ndeki yerleşimlerden yıkım haberleri gelirken çok sayıda ev, tapınak ve kamu yapısı hasar gördü veya çöktü. Enkaz altında kalanlara ulaşılmaya çalışılıyor; binlerce insan barınak ve temel ihtiyaçlardan yoksun durumda.\n\nSarsıntı, ülkemizin sınırlı ulaşım ve haberleşme imkânlarını da zorlaştırıyor. Yerel idareler kayıpları belirlemeye çalışırken hükûmet, kurtarma çalışmalarını, geçici barınmayı ve yeniden inşayı nasıl karşılayacağına karar vermek zorunda. Bu felaketin yaraları kısa sürede kapanmayacak."
 westheia_nepal_1933.1.t:0 "Büyük Nepal Depremi"
 westheia_nepal_1933.2.a:0 "Korkunç"
 westheia_nepal_1933.2.d:0 "15 Ocak 1934’te Nepal ve Britanya Hindistanı’nın Bihar bölgesini vuran büyük deprem, Himalayaların güneyinde geniş çaplı yıkıma yol açtı. Katmandu Vadisi’ndeki şehirler ve sınırın iki yanındaki yerleşimler ağır hasar görürken binlerce kişinin hayatını kaybettiği bildiriliyor.\n\nUlaşım ve haberleşmedeki aksamalar, felaketin boyutlarının tam olarak belirlenmesini güçleştiriyor. Kurtarma çalışmaları sürerken evsiz kalanların barınması ve yaralıların tedavisi acil ihtiyaçlar arasında yer alıyor. Nepal, yıkılan yapıların ve zarar gören altyapının yeniden kurulması için uzun bir toparlanma dönemiyle karşı karşıya."
 westheia_nepal_1933.2.t:0 "Büyük Nepal Depreminin Ardından"
 westheia_new_zealand_1933.1.a:0 "Savage yeni hükûmeti kursun."
 westheia_new_zealand_1933.1.d:0 "Büyük Buhran’ın yol açtığı işsizlik ve yoksulluk, George Forbes’un koalisyon hükûmetine duyulan güveni derinden sarstı. Genel seçimlerden açık bir zaferle çıkan Michael Joseph Savage liderliğindeki İşçi Partisi, artık ülkenin idaresini devralıyor. Forbes’un görevden ayrılmasıyla Yeni Zelanda tarihinde ilk kez bir İşçi Partisi hükûmeti kurulacak.\n\nSavage, ekonomik güvenliği artırma, işsizliğe karşı mücadele etme ve devletin sosyal sorumluluklarını genişletme sözü veriyor. Yeni başbakan görevine başlarken halkın beklentileri yüksek: Seçmenler, bunalım yıllarının ardından daha güvenceli bir gelecek arıyor."
 westheia_new_zealand_1933.1.t:0 "Yeni Zelanda’da İlk İşçi Partisi Hükûmeti"
 westheia_norway_1933.1.a:0 "Mowinckel yeni hükûmeti kursun."
 westheia_norway_1933.1.d:0 "Ekonomik kısıtlamalar üzerine Storting’de karşılaştığı güvensizlik oyunun ardından Jens Hundseid hükûmeti görevini bırakıyor. Büyük Buhran’ın yarattığı sıkıntılar ve bütçe politikaları üzerindeki anlaşmazlıklar, Çiftçi Partisi hükûmetinin parlamentodaki desteğini tüketti.\n\nKral VII. Haakon’un yeni hükûmeti kurmakla görevlendirdiği Johan Ludwig Mowinckel bugün başbakanlığı devralmaya hazırlanıyor. Liberal lider, ekonomik bunalımın gölgesinde ülkeyi yeniden istikrara kavuşturmak ve parlamentoda işleyen bir çoğunluk bulmak zorunda."
 westheia_norway_1933.1.t:0 "Hundseid Hükûmeti İstifa Ediyor"
 westheia_norway_1933.2.a:0 "Johan Nygaardsvold görevi devralsın."
 westheia_norway_1933.2.d:0 "Norveç siyasetinde yeni bir dönem açılıyor. İşçi Partisi ile Çiftçi Partisi arasında Storting’de varılan ekonomik uzlaşma, Mowinckel hükûmetinin parlamentodaki dayanağını ortadan kaldırdı. Hükûmetin istifasının ardından Johan Nygaardsvold, başbakanlığı devralmak üzere görevlendirildi.\n\nİşsizlikle mücadele, kırsal kesime destek ve bunalımın toplumsal yaralarını sarma vaatleri yeni yönetimin programını şekillendiriyor. Oslo’da iktidar el değiştirirken Norveç, sorunlarına parlamenter düzen içinde çözüm aramayı sürdürüyor."
 westheia_norway_1933.2.t:0 "Nygaardsvold Hükûmeti Görevi Devralıyor"
 westheia_palestine_1933.1.a:0 "Yüksek komiserlik görevini MacMichael devralsın."
 westheia_palestine_1933.1.d:0 "Sağlık sorunları nedeniyle görevinden ayrılan Sir Arthur Wauchope’un ardından, İngiliz hükûmetinin atadığı Sir Harold MacMichael Filistin Yüksek Komiserliği görevini devralmak üzere ülkeye geldi. Wauchope’un 1931’den beri sürdürdüğü idarenin yerini, daha önce Tanganika valiliğinde bulunmuş deneyimli bir sömürge yöneticisi alıyor.\n\nMacMichael, İngiliz manda yönetiminin sorumluluklarını ve bölgedeki siyasi anlaşmazlıkların ağırlığını devralacak. Kudüs’teki görev değişikliğiyle birlikte yüksek komiserlik makamı yeni sahibine geçerken, Filistin’in mevcut idari statüsü korunuyor."
 westheia_palestine_1933.1.t:0 "Filistin’de Yüksek Komiser Değişikliği"
 westheia_papal_protection:0 "Papalık Koruması"
 westheia_papal_succession.2.a:0 "Habemus Papam!"
 westheia_papal_succession.2.d:0 "Vatikan'ın çanları bugün yas için çalıyor. Papa'nın ölümüyle birlikte Papalık Devleti yeni bir dönemin eşiğine geldi.\n\nBir ay önce danışmanlığa atanan Kardinal Pius Maria, Kardinaller Koleji'nin desteğini alarak yeni papa seçildi. Danışmanlık görevinden ayrılan Pius Maria, artık hem Kilise'nin hem de devletin başında."
 westheia_papal_succession.2.t:0 "Papa'nın Ölümü"
 westheia_papal_succession.2.tt:0 "§YPius Maria§! yeni ülke lideri oldu. Siyasi danışmanlık görevi kaldırıldı. §YEski Kardinal§!, §YGelenekçi Papa§! ve §YPapalık Koruması§! lider özelliklerini kazandı."
 westheia_par_1933.1.a:0 "Çatışmalara son verelim."
 westheia_par_1933.1.d:0 "Chaco'da süren ağır çarpışmaların ardından Paraguay hükûmeti, çatışmaların durdurulması ve barış görüşmelerinin başlatılması için bize başvurdu. Her iki ülkenin de verdiği kayıplar ve cephede yaşanan ikmal güçlükleri, savaşı sürdürmenin bedelini giderek artırıyor.\n\nSilahları susturarak Chaco anlaşmazlığının diplomatik yollarla çözülmesinin önünü açacağız."
 westheia_par_1933.1.t:0 "Paraguay'dan Ateşkes Önerisi"
 westheia_par_1933.2.a:0 "Darbeyi bastırın; Franco görevinde kalacak!"
 westheia_par_1933.2.b:0 "Hazırlıkları Franco'dan gizleyin. Doğru anı bekleyeceğiz."
 westheia_par_1933.2.c:0 "Sivil yönetime dönüşün yolunu açın."
 westheia_par_1933.2.d:0 "Ordu içindeki muhalif subaylar, Rafael Franco'nun hükûmetini devirmek için harekete geçti. Savaş sonrasında derinleşen siyasi ayrılıklar ve hükûmetin reformlarından duyulan hoşnutsuzluk, kışlalardaki muhalefeti güçlendirdi.\n\nFranco'ya bağlı güçler darbecileri bastırabilir. Ancak kimi subaylar, hazırlıklarını başkandan gizleyerek Chaco'daki birliklerin geri çekilmesini beklemeyi savunuyor. Sivil muhalefet ise ordunun müdahalesinin Liberal Parti'nin yeniden yönetime gelmesini sağlamasını istiyor."
 westheia_par_1933.2.t:0 "13 Ağustos Darbesi"
 westheia_par_1933.3.a:0 "Saldırmazlık paktını imzalayalım."
 westheia_par_1933.3.b:0 "Bu öneriyi kabul edemeyiz."
 westheia_par_1933.3.d:0 "Paraguay hükûmeti, Chaco anlaşmazlığının yeniden silahlı çatışmaya dönüşmesini önlemek için bir saldırmazlık paktı önerdi. Asunción, sınır sorunlarının müzakere yoluyla çözülmesini ve iki ülkenin birbirine karşı kuvvet kullanmaktan kaçınmasını istiyor.\n\nBu öneriyi kabul etmek, uzun savaşın ardından ilişkilerimizin normalleşmesi yolunda önemli bir adım olacaktır."
 westheia_par_1933.3.t:0 "Paraguay ile Kalıcı Barış"
 westheia_par_1933.4.a:0 "Kalıcı barış yolunda bir adım."
 westheia_par_1933.4.d:0 "Bolivya hükûmeti önerimize olumlu yanıt verdi. İki ülke arasında saldırmazlık paktı imzalandı. Chaco'daki anlaşmazlıkları yeni bir savaşa başvurmadan çözmek için artık diplomasiye ağırlık verebiliriz."
 westheia_par_1933.4.t:0 "Bolivya Saldırmazlık Paktını Kabul Etti"
 westheia_par_1933.5.a:0 "Diplomatik çabalarımız sürecek."
 westheia_par_1933.5.d:0 "Bolivya hükûmeti, saldırmazlık paktı önerimizi kabul etmeyeceğini bildirdi. Görüşmeler bir anlaşma sağlanamadan sona erdi."
 westheia_par_1933.5.t:0 "Bolivya Önerimizi Reddetti"
 westheia_par_1933.6.a:0 "Yeni başkan görevine başlasın."
 westheia_par_1933.6.d:0 "Sivil yönetimin yeniden kurulmasının ardından düzenlenen seçimler, Liberal Parti'nin desteklediği José Félix Estigarribia'yı ülkenin başına taşıdı. Chaco Savaşı'nın komutanı, şimdi ülkenin siyasi ve ekonomik sorunlarıyla yüzleşmek zorunda.\n\nFélix Paiva, başkanlık görevini Estigarribia'ya devrediyor."
 westheia_par_1933.6.t:0 "1939 Seçimleri: Estigarribia Göreve Geliyor"
 westheia_par_1933.7.a:0 "Morínigo yönetimi devralsın."
 westheia_par_1933.7.d:0 "Başkan José Félix Estigarribia, eşi Julia Miranda Cueto ve pilot Carmelo Peralta, San Bernardino'ya giderken geçirdikleri uçak kazasında hayatlarını kaybetti. Haber, başkentte büyük bir şaşkınlık ve yasla karşılandı.\n\nOrdu ve hükûmet çevreleri, yönetimin devamlılığını sağlamak üzere Savaş Bakanı Higinio Morínigo'nun başkanlığa geçmesi üzerinde anlaştı."
 westheia_par_1933.7.t:0 "Başkan Estigarribia Uçak Kazasında Öldü"
 westheia_par_1933.8.a:0 "Cemiyetin otoritesi bir kez daha sorgulanıyor."
 westheia_par_1933.8.d:0 "Paraguay hükûmeti, Chaco anlaşmazlığında Milletler Cemiyeti'nin izlediği politikaya tepki göstererek örgütten çekildiğini duyurdu. Asunción, cemiyetin kararlarının ulusal çıkarlarını ve güvenliğini yeterince gözetmediğini savunuyor.\n\nKarar, Bolivya ile yaşanan çatışmaya diplomatik bir çözüm bulma çabalarının sürdüğü bir dönemde alındı. Paraguay yönetimi, ülkesinin geleceğinin dışarıdan dayatılan şartlarla belirlenmesini kabul etmeyeceğini açıkladı."
 westheia_par_1933.8.t:0 "Paraguay Milletler Cemiyeti'nden Çekildi"
 westheia_parliamentary_conservatism:0 "Parlamenter Demokrasi"
 westheia_parliamentary_conservatism_desc:0 "§YParlamenter Demokrasi§!\n\n\n\n\n\n\n£GFX_westheia_subtype_banner_parliamentary\n\n\n\n\n\n\n\nHükümetin meclisin güvenine dayandığı, partilerin seçimler ve koalisyon görüşmeleri yoluyla yönetimi paylaştığı parlamenter düzen. Kabineler değişse de anayasal kurumların sürekliliği korunur."
 westheia_peace_zero_occupation_tt:0 ""
 westheia_peru_1933.1.a:0 "Benavides devletin idaresini devralsın."
 westheia_peru_1933.1.d:0 "Cumhurbaşkanı Luis Miguel Sánchez Cerro, Lima’daki Santa Beatriz Hipodromu’nda askerî birlikleri teftiş etmesinin ardından silahlı saldırıya uğradı. Açık otomobiliyle alandan ayrıldığı sırada vurulan cumhurbaşkanı, aldığı yaralar nedeniyle hayatını kaybetti. Saldırganın Abelardo Mendoza Leyva olduğu bildiriliyor.\n\nSiyasi gerilimlerin zaten yüksek olduğu başkentte suikast haberi büyük bir sarsıntı yarattı. İktidar boşluğunun yeni bir çatışmaya dönüşmesini önlemek amacıyla toplanan Kurucu Kongre, General Óscar Benavides’i cumhurbaşkanlığına seçti. Yeni yönetimin önceliği, devlet otoritesini korumak ve ülkeyi bu bunalımdan çıkarmak olacak."
 westheia_peru_1933.1.t:0 "Sánchez Cerro Suikastı"
 westheia_philippines_1933.1.a:0 "Yeni genel valiyi karşılayalım."
 westheia_philippines_1933.1.d:0 "Washington tarafından atanan Frank Murphy, Manila’da görevine başladı. Yeni genel vali, mali istikrarı ve yerel yönetimin güçlendirilmesini öncelikleri arasında gösteriyor. Bağımsızlığa geçiş konusundaki tartışmalar sürerken Amerikan idaresinin son yılları yeni bir döneme giriyor."
 westheia_philippines_1933.1.t:0 "Frank Murphy Genel Valiliği Devralıyor"
 westheia_philippines_1933.2.a:0 "Constabulary ayaklanmayı bastırsın."
 westheia_philippines_1933.2.b:0 "Şikâyetlerini dinleyip uzlaşma arayalım."
 westheia_philippines_1933.2.d:0 "Sakdal hareketinin taraftarları Luzon’daki bazı kasabalarda yönetim binalarını ele geçirdi. Derhâl bağımsızlık, vergi yükünün hafifletilmesi ve toprak düzeninin değiştirilmesi talepleri köylüler arasında yankı buluyor. Constabulary müdahaleye hazırlanırken hükümet, hareketi zor kullanarak dağıtmakla uzlaşma aramak arasında bir karar vermeli."
 westheia_philippines_1933.2.t:0 "Sakdal Ayaklanması"
 westheia_philippines_1933.3.a:0 "Quezon ve Osmeña seçimi kazandı."
 westheia_philippines_1933.3.d:0 "Yeni anayasal yönetimin ilk seçimlerinde Manuel L. Quezon ile Sergio Osmeña’nın oluşturduğu ortak liste zafer kazandı. Quezon başkanlık görevini üstlenmeye hazırlanırken mevcut genel vali, Milletler Topluluğu’nun resmen açılacağı kasım ayına kadar idareyi sürdürecek."
 westheia_philippines_1933.3.t:0 "Milletler Topluluğu Seçimi"
 westheia_philippines_1933.4.a:0 "Yeni yönetim göreve başlasın."
 westheia_philippines_1933.4.d:0 "Manuel L. Quezon başkanlık yeminini etti ve Filipinler Milletler Topluluğu yönetimi göreve başladı. Genel valilik dönemi sona ererken savunma ve dış ilişkilerde Amerikan yetkileri sürüyor. Yeni hükümetin önünde kurumları geliştirmek ve bağımsızlığa geçişi hazırlamak gibi büyük görevler bulunuyor."
 westheia_philippines_1933.4.t:0 "Filipinler Milletler Topluluğu Kuruluyor"
 westheia_philippines_1933.5.a:0 "Sergio Osmeña görevi devralsın."
 westheia_philippines_1933.5.d:0 "Uzun süredir veremle mücadele eden Başkan Manuel L. Quezon hayatını kaybetti. Savaş ve sürgün yıllarının ağır yükünü taşıyan başkanın ölümüyle anayasal halefiyet hükümleri devreye giriyor. Başkan Yardımcısı Sergio Osmeña, hükümetin sürekliliğini sağlamak üzere başkanlık görevini devralacak."
 westheia_philippines_1933.5.t:0 "Başkan Quezon Hayatını Kaybetti"
 westheia_player_justification:0 "Oyuncu Savaş Hedefi Süresi"
 westheia_player_justification_desc:0 "Oyuncuların elle başlattığı savaş hedefi gerekçelendirmeleri 30 günlük alt sınıra göre hazırlanır."
 westheia_poland_army_1933.1.a:0 "Araçları zırhlı birliklerin kullanımına verin."
 westheia_poland_army_1933.1.d:0 "1931 yılında Britanya’dan sipariş edilen 38 Vickers Mk.E tankının teslimatı geçen yıl başladı ve bu yılın başlarına uzandı. Araçların kabulü, silahlarının takılması ve birliklere hazırlanması, yalnızca fabrikadan çıkmalarından daha uzun sürüyor.\n\nÇift kuleli Vickers’lar, zırhlı birliklerimizin eğitim ve geliştirme çalışmalarına katılacak. Motorun soğutulması ve silahlandırma konusundaki sorunlar sürse de bu araçlardan elde edilecek deneyim, yerli tank çalışmalarına yol gösterebilir."
 westheia_poland_army_1933.1.t:0 "Vickers Tankları Hizmete Hazırlanıyor"
 westheia_poland_constitution_1933.1.a:0 "Yeni anayasa yürürlüğe girsin."
 westheia_poland_constitution_1933.1.d:0 "Cumhurbaşkanı Ignacy Mościcki, uzun süredir hazırlanan yeni anayasayı imzaladı. 1921 tarihli Mart Anayasası’nın yerini alan bu düzenleme, devletin ağırlık merkezini parlamentodan cumhurbaşkanlığına taşıyor. Hükûmetin sorumluluğu cumhurbaşkanına bağlanırken Sejm’in yürütme üzerindeki etkisi daraltılıyor.\n\nSanacja çevreleri, güçlü bir yürütmenin siyasi çekişmelere son vereceğini ve devletin devamlılığını güvence altına alacağını savunuyor. Muhalefet ise parlamenter denetimin zayıflatılmasının otoriter yönetimi kalıcılaştıracağından endişeli. Polonya, yeni anayasanın çizdiği siyasi düzene adım atıyor."
 westheia_poland_constitution_1933.1.t:0 "Nisan Anayasası"
 westheia_poland_leadership_1933.1.a:0 "Mareşal’e veda ediyoruz."
 westheia_poland_leadership_1933.1.d:0 "Mareşal Józef Piłsudski, uzun süredir ağırlaşan hastalığının ardından Varşova’daki Belweder Sarayı’nda hayatını kaybetti. Polonya’nın yeniden bağımsızlığını kazanmasında ve 1920’de Sovyet ilerleyişinin durdurulmasında belirleyici rol oynayan Mareşal’in ölümü, ülkeyi derin bir yasa boğdu.\n\n1926’daki Mayıs Darbesi’nden beri devletin en güçlü siyasi otoritesi olan Piłsudski, Sanacja çevrelerini şahsında bir arada tutuyordu. Onun yokluğunda bu birlik artık kendiliğinden korunamayacak. Cumhurbaşkanı Ignacy Mościcki, devletin devamlılığını sağlamak üzere yönetimin merkezine yerleşirken Polonya yeni ve belirsiz bir döneme giriyor."
 westheia_poland_leadership_1933.1.t:0 "Mareşal Piłsudski Hayatını Kaybetti"
 westheia_poland_leadership_1933.2.a:0 "Mareşal’in yokluğunda saflarımız çatlıyor."
 westheia_poland_leadership_1933.2.d:0 "Mareşal’in ölümünün üzerinden bir ay geçmesine rağmen Sanacja çevreleri ortak bir çizgide buluşamadı. Piłsudski’nin şahsi otoritesinin örttüğü anlaşmazlıklar artık açıkça dile getiriliyor. Her hizip, onun siyasi mirasının gerçek temsilcisi olduğunu ileri sürüyor.\n\nWalery Sławek çevresindeki eski çalışma arkadaşları ile Edward Rydz-Śmigły etrafında güçlenen askerî ve milliyetçi kanat, devletin geleceği üzerinde nüfuz mücadelesine girişti. Cumhurbaşkanı Ignacy Mościcki’nin çevresi de kendi konumunu korumaya çalışıyor. Sol ve sağ Sanacja hiziplerinden yükselen talepler, atamalar ve hükûmet politikaları üzerinde giderek daha ağır bir baskı kuruyor.\n\nMareşal’in bir arada tuttuğu iktidar bloğu, artık birbirine rakip odaklara bölünüyor. Devleti yönetmek kadar, kendi saflarımızdaki bu çekişmeyi denetim altında tutmak da zorundayız."
 westheia_poland_leadership_1933.2.t:0 "Sanacja’da Miras Kavgası"
 westheia_poland_leadership_1933.3.a:0 "Polonya için bir devrin sonu."
 westheia_poland_leadership_1933.3.d:0 "Polonya Mareşali Józef Piłsudski, uzun süredir devam eden hastalığının ardından Varşova’daki Belweder Sarayı’nda hayatını kaybetti. Polonya’nın bağımsızlığını yeniden kazanmasında ve 1920’de Sovyet ilerleyişinin durdurulmasında belirleyici rol oynayan Piłsudski, ülkesinin siyasi hayatında tartışmasız bir ağırlığa sahipti.\n\n1926’daki Mayıs Darbesi’nden bu yana Sanacja yönetimini bir arada tutan Mareşal’in ölümü, Polonya’da bir devri kapatıyor. Cumhurbaşkanı Ignacy Mościcki yönetimin devamlılığını sağlamaya çalışırken, Avrupa başkentleri Varşova’daki gelişmeleri yakından izliyor."
 westheia_poland_leadership_1933.3.t:0 "Mareşal Piłsudski Hayatını Kaybetti"
 westheia_polger_1933.1.a:0 "Almanya’ya bir diplomat göndereceğiz."
 westheia_polger_1933.1.b:0 "Böyle bir atılıma hiç gerek yok."
 westheia_polger_1933.1.d:0 "Almanya ile aramızdaki sınır anlaşmazlıkları ve karşılıklı güvensizlik, Avrupa’daki konumumuzu zorlaştırıyor. Berlin hükûmetiyle doğrudan görüşmeler açarak uyuşmazlıkların çözümünde güç kullanımından vazgeçmeyi ve sorunlarımızı diplomasi yoluyla ele almayı öneren bir saldırmazlık bildirisi hazırlayabiliriz.\n\nBöyle bir anlaşma sınır meselelerini tek başına çözmeyecek ve mevcut ittifaklarımızın yerini almayacaktır. Yine de iki ülke arasındaki gerginliği hafifletebilir ve bize daha sakin bir diplomatik ortam sağlayabilir. Alman hükûmetine ulaşalım mı?"
 westheia_polger_1933.1.t:0 "Almanya-Polonya Saldırmazlık Bildirisi"
 westheia_polger_1933.2.a:0 "Kabul ediyoruz."
 westheia_polger_1933.2.b:0 "Böyle bir anlaşmaya gerek yok."
 westheia_polger_1933.2.d:0 "Varşova’dan gelen diplomatik heyet, ülkelerimiz arasındaki ilişkilerde yeni bir sayfa açmayı teklif ediyor. Polonya hükûmeti, on yıllık bir bildiriyle uyuşmazlıkların barışçıl yollarla çözülmesini ve tarafların birbirlerine karşı güç kullanmaktan kaçınmasını güvence altına almak istiyor.\n\nBu teklif, Versailles düzeninden kaynaklanan sınır anlaşmazlıklarını ortadan kaldırmıyor. Ancak doğu komşumuzla gerginliği azaltarak Berlin’e diplomatik hareket alanı sağlayabilir. Polonyalıların teklifini kabul edecek miyiz?"
 westheia_polger_1933.2.t:0 "Polonya’dan Saldırmazlık Teklifi"
 westheia_polger_1933.3.a:0 "Bildiriyi imzalayalım."
 westheia_polger_1933.3.d:0 "Alman hükûmeti, saldırmazlık bildirisi önerimizi kabul ettiğini bildirdi. Taraflar, aralarındaki sorunların doğrudan görüşmeler ve diğer barışçıl yollarla çözülmesi konusunda uzlaştı.\n\nBildirinin imzalanması sınır anlaşmazlıklarımızı kendiliğinden sona erdirmeyecek. Yine de Berlin ile Varşova arasında karşılıklı güç kullanmama taahhüdü kurulacak ve uzun süredir gergin olan ilişkilerimizde daha sakin bir dönemin kapısı aralanacaktır. Temsilcilerimiz imza için hazır."
 westheia_polger_1933.3.t:0 "Berlin Teklifimizi Kabul Etti"
 westheia_polger_1933.4.a:0 "Yazık oldu; bir fırsat kaçtı."
 westheia_polger_1933.4.d:0 "Berlin’den beklediğimiz yanıt olumsuz geldi. Alman hükûmeti, sunduğumuz saldırmazlık bildirisini imzalamayı gerekli görmediğini diplomatlarımıza iletti.\n\nİlişkileri yumuşatmak için açtığımız kapı şimdilik kapalı kalacak. Heyetimiz Varşova’ya dönerken, Almanya ile aramızdaki sorunları başka diplomatik yollarla ele almak zorundayız."
 westheia_polger_1933.4.t:0 "Almanya Teklifimizi Reddetti"
 westheia_polger_1933.5.a:0 "Berlin ile Varşova arasında yeni bir sayfa."
 westheia_polger_1933.5.d:0 "Almanya ve Polonya, Berlin’de on yıllık bir saldırmazlık bildirisi imzaladı. Alman Dışişleri Bakanı Konstantin von Neurath ve Polonya Büyükelçisi Józef Lipski’nin imzaladığı metin, iki ülke arasındaki uzun süredir devam eden diplomatik gerginliği hafifletmeyi amaçlıyor.\n\nİki taraf, uyuşmazlıklarını barışçıl yollarla çözmeyi ve birbirlerine karşı güç kullanmamayı taahhüt etti. Ancak Almanya’nın Versailles Antlaşması’ndan kaynaklanan sınır düzenlemelerine yönelik itirazları tamamen ortadan kalkmış değil. Berlin ile Varşova arasındaki bu yakınlaşma Avrupa başkentlerinde dikkatle izleniyor."
 westheia_polger_1933.5.t:0 "Almanya-Polonya Saldırmazlık Bildirisi İmzalandı"
 westheia_pope:0 "Gelenekçi Papa"
 westheia_pope_weekly_neutrality_tt:0 "Haftalık Tarafsızlık Desteği: §G+0.20§!"
 westheia_portugal_1933.1.a:0 "Yeni devletin düzenini sağlamlaştıracağız."
 westheia_portugal_1933.1.d:0 "Mart ayında halkoyuna sunulan yeni anayasa, sonuçların resmen ilan edilmesiyle yürürlüğe girdi. Salazar'ın hazırladığı düzen, 1926'dan beri süren askerî diktatörlüğe kalıcı bir anayasal çerçeve kazandırıyor. Ulusal Meclis ve meslek gruplarını temsil edecek Korporatif Meclis öngörülürken devletin ağırlık merkezi güçlü yürütme organında toplanıyor.\n\nEstado Novo, siyasi rekabetin yerine millî birlik ve toplumsal düzeni koyduğunu ilan ediyor. Hükûmet, kendi otoritesinden bağımsız bütün siyasi hareketleri bir tehdit olarak görüyor. Komünistlere, demokratik muhalefete ve bağımsız faşist örgütlenmelere karşı baskı artırılırken Portekiz'in siyasi hayatı yeni rejimin sınırları içinde yeniden şekillendiriliyor."
 westheia_portugal_1933.1.t:0 "Estado Novo Anayasası Yürürlüğe Girdi"
 westheia_prc_1933.1.a:0 "Zhang Wentian görevi devralsın."
 westheia_prc_1933.1.d:0 "Politbüro, Beşinci Kuşatma sırasındaki yenilgileri ve geri çekilmenin ağır kayıplarını görüşmek için Zunyi'de toplandı. Bo Gu ile Komintern danışmanı Otto Braun'un askerî kararları eleştirilirken Mao Zedong, Politbüro Daimî Komitesi'ne alındı. Konferansta başlayan görev değişimiyle Zhang Wentian parti yönetimini Bo Gu'dan devralıyor."
 westheia_prc_1933.1.t:0 "Zunyi Konferansı"
 westheia_prc_prologue.1.a:0 "Tüfek yüklerini bırakın. Ana kuvvet karşıya geçsin."
 westheia_prc_prologue.1.b:0 "İkmal kollarına zaman kazandırın."
 westheia_prc_prologue.1.d:0 "Milliyetçi öncü birlikler nehri ve çevredeki yolları ateş altında tutuyor. Ağır yükleri bırakırsak ana kuvvet daha hızlı geçebilir. İkmal kollarını beklersek eldeki malzemeyi koruruz, ancak dağılan birlikleri toparlamak daha uzun sürer."
 westheia_prc_prologue.1.t:0 "Xiang Nehri'nde Çember Daralıyor"
 westheia_prc_prologue.2.a:0 "Birinci Cephe Ordusu kuzeye ilerlesin."
 westheia_prc_prologue.2.d:0 "Birinci ve Dördüncü Cephe orduları buluştu. Mao kuzeye ilerleyip yeni bir üs kurmayı savunuyor. Zhang Guotao ise güneyde daha elverişli bir hat bulabileceğimizi düşünüyor. Görüş ayrılığı, ortak karargâhın geleceğini belirsiz bırakıyor."
 westheia_prc_prologue.2.t:0 "İki Ordu, İki İstikamet"
 westheia_prc_prologue.3.a:0 "Denetimimizdeki bölgeleri devredin."
 westheia_prc_prologue.3.b:0 "İsteği reddedin."
 westheia_prc_prologue.3.d:0 "Wuqi'ye ulaşan Komünist birlikler, Shaanbei ve Yulin'de kalıcı bir üs istiyor. Denetimimizdeki bölgeleri devredersek Kızıl Ordu karargâhını kuzeye taşıyabilecek."
 westheia_prc_prologue.3.t:0 "Komünist Heyet Kuzeyde Üs İstiyor"
 westheia_prc_prologue.4.a:0 "Ateşkesi uygulayın ve orduyu toparlayın."
 westheia_prc_prologue.4.d:0 "Kızıl Ordu'nun yeniden örgütlenmesi için Milliyetçi Çin ve Siçuan'la çatışmaya son vereceğiz. Kuzeyde güvenli bir üs varsa karargâh ve Zunyi'deki birlikler oraya taşınacak."
 westheia_prc_prologue.4.t:0 "Kızıl Ordu'nun Yeni Karargâhı"
 westheia_reichskommissariat:0 "Reichskomiserlik"
 westheia_reichskommissariat_desc:0 "§YReichskomiserlik§!\n\n\n\n\n\n\n\n\n\n\n£GFX_westheia_subtype_banner_reich\n\n\n\n\n\n\n\n\n\n\n\nAlmanya'ya bağlı bölgeleri bir Reichskomiser aracılığıyla yöneten, siyasi ve idari yetkisini Alman yönetiminden alan işgal idaresi."
 westheia_romania_leadership_1933.1.a:0 "Vaida-Voevod yeni hükûmeti kursun."
 westheia_romania_leadership_1933.1.d:0 "Başbakan Iuliu Maniu ile Kral II. Carol arasındaki anlaşmazlıklar, hükûmetin görevini sürdürmesini olanaksız hâle getirdi. İçişleri idaresi üzerindeki yetki tartışmaları ve sarayın devlet işlerine müdahalesi, Maniu'nun krala duyduğu güveni tüketti. Başbakanın istifasıyla Ulusal Köylü Partisi hükûmetinde bir dönem kapanıyor.\n\nKral, yeni kabineyi kurma görevini aynı partinin önde gelen isimlerinden Alexandru Vaida-Voevod'a verdi. Ekonomik bunalımın ağırlığı sürerken yeni başbakan, sarayla çalışma imkânı bulmak ve ülkenin giderek artan toplumsal huzursuzluğunu dizginlemek zorunda."
 westheia_romania_leadership_1933.1.t:0 "Maniu Hükûmeti Çekiliyor"
 westheia_romania_leadership_1933.2.a:0 "Ion G. Duca hükûmeti devralsın."
 westheia_romania_leadership_1933.2.d:0 "Alexandru Vaida-Voevod'un hükûmeti sona ererken Kral II. Carol, ülkenin yönetimini Ulusal Liberal Parti lideri Ion G. Duca'ya emanet etti. Böylece Ulusal Köylü Partisi'nin iktidarı yerini, ekonomik bunalımla mücadele etmeyi ve devletin otoritesini yeniden sağlamlaştırmayı vadeden yeni bir kabineye bırakıyor.\n\nDuca, yeni seçimlere hazırlanırken anayasal düzeni koruma kararlılığını vurguluyor. Siyasi şiddetin yayılması ve aşırı sağcı hareketlerin güç kazanması, hükûmetin önündeki en acil meseleler arasında. Başkentte bütün gözler, yeni başbakanın bu sorunlara nasıl karşılık vereceğine çevrilmiş durumda."
 westheia_romania_leadership_1933.2.t:0 "Kral, Duca'yı Göreve Çağırıyor"
 westheia_romania_leadership_1933.3.a:0 "Tătărescu hükûmeti devralsın."
 westheia_romania_leadership_1933.3.d:0 "Ion G. Duca'nın öldürülmesinin ardından başbakanlığı geçici olarak üstlenen Constantin Angelescu, görevini yeni kabineye devretmeye hazırlanıyor. Krizin ilk günlerinde devlet idaresinin devamlılığını sağlayan geçici yönetimin yerini, daha kalıcı bir hükûmet alacak.\n\nKral II. Carol, yeni kabineyi kurmak üzere Ulusal Liberal Parti'den Gheorghe Tătărescu'yu görevlendirdi. Yeni başbakan, siyasi şiddetin gölgesinde kamu düzenini yeniden sağlamlaştırmak ve ekonomik bunalımın etkileriyle mücadele etmek zorunda."
 westheia_romania_leadership_1933.3.t:0 "Geçici Hükûmet Görevini Tamamlıyor"
 westheia_romania_procurement_1933.1.a:0 "Siparişi onaylayın."
 westheia_romania_procurement_1933.1.b:0 "Bu masrafı üstlenemeyiz."
 westheia_romania_procurement_1933.1.d:0 "Polonya’nın PZL tesisleriyle yapılan görüşmeler, elli P.11b avcı uçağının satın alınması için bir anlaşma taslağıyla sonuçlandı. Uçaklar eski avcı filolarımızın yenilenmesini sağlayacak, ancak siparişin finansmanı bütçemiz üzerinde ek yük oluşturacaktır."
 westheia_romania_procurement_1933.1.t:0 "Polonya Avcı Uçağı Siparişi"
 westheia_romania_procurement_1933.2.a:0 "Filolarımızı yenileyelim."
 westheia_romania_procurement_1933.2.d:0 "Polonya’dan sipariş edilen PZL P.11b avcı uçaklarının teslimat ve kabul işlemleri tamamlandı. Yeni uçaklar hava kuvvetlerimize katılmaya hazırdır."
 westheia_romania_procurement_1933.2.t:0 "Polonya Avcıları Teslim Edildi"
 westheia_rome_1933.1.d:0 "Macar hükûmeti, İtalya ve Avusturya arasında daha yakın ekonomik ve siyasi iş birliği kurulmasını öneriyor. Budapeşte, Tuna havzasındaki ekonomik sıkıntılara karşı ticaretin geliştirilmesini ve ortak diplomatik çıkarlarımızın gözetilmesini istiyor.\n\nMacaristan'ın girişimine katılmak, Orta Avrupa'daki nüfuzumuzu ve bölge ülkeleriyle ilişkilerimizi güçlendirebilir. Roma Protokolleri teklifini kabul edecek miyiz?"
 westheia_rome_1933.1.t:0 "Macaristan'dan Roma Protokolleri Teklifi"
 westheia_rome_1933.2.d:0 "Budapeşte, Avusturya ve İtalya ile ekonomik ve siyasi bağlarını güçlendirmek üzere bir protokol teklifi sundu. Macar hükûmeti, bölge ülkelerinin ticari ilişkilerini geliştirerek ekonomik bunalımın etkilerini hafifletebileceğini savunuyor.\n\nBu yakınlaşma ülkemize yeni pazarlar ve diplomatik destek sağlayabilir. Ancak kurulacak ortaklığın dış politikamız üzerindeki etkilerini de değerlendirmeliyiz."
 westheia_rome_1933.2.t:0 "Macaristan'dan Roma Protokolleri Teklifi"
 westheia_rome_1933.3.d:0 "Roma'daki temsilcilerimizden olumlu haber geldi. İtalyan hükûmeti teklifimizi kabul ederek ülkemizle daha yakın ekonomik ve siyasi iş birliğine hazır olduğunu bildirdi. İki ülke arasındaki ticaret anlaşması yürürlüğe girdi."
 westheia_rome_1933.3.t:0 "İtalya Roma Protokolleri'ni Kabul Etti"
 westheia_rome_1933.4.d:0 "İtalyan hükûmeti, Roma Protokolleri için sunduğumuz teklifi kabul etmediğini bildirdi. Görüşmeler sonuçsuz kaldı; İtalya ile önerdiğimiz ticaret anlaşması imzalanmayacak."
 westheia_rome_1933.4.t:0 "İtalya Roma Protokolleri'ni Reddetti"
 westheia_rome_1933.5.d:0 "Viyana hükûmeti teklifimize olumlu yanıt verdi. Avusturya, ekonomik ilişkilerimizi güçlendirmeyi ve bölgedeki ortak çıkarlarımız doğrultusunda iş birliğini geliştirmeyi kabul etti. İki ülke arasındaki ticaret anlaşması yürürlüğe girdi."
 westheia_rome_1933.5.t:0 "Avusturya Roma Protokolleri'ni Kabul Etti"
 westheia_rome_1933.6.d:0 "Viyana hükûmeti teklifimizi değerlendirdikten sonra Roma Protokolleri'ne katılmayacağını bildirdi. Avusturya ile önerdiğimiz ticaret anlaşması imzalanmayacak."
 westheia_rome_1933.6.t:0 "Avusturya Roma Protokolleri'ni Reddetti"
 westheia_rome_1933.accept:0 "Roma Protokolleri'ni kabul ediyoruz."
 westheia_rome_1933.accepted_reply:0 "İş birliğimiz güçleniyor."
 westheia_rome_1933.reject:0 "Bu teklifi kabul etmiyoruz."
 westheia_rome_1933.rejected_reply:0 "Başka ortaklıklar aramalıyız."
 westheia_saar.1.a:0 "Saar’ın savunmasına katılacağız."
 westheia_saar.1.b:0 "Bu anlaşmazlık uğruna savaşa giremeyiz."
 westheia_saar.1.d:0 "Milletler Cemiyeti’nin himayesindeki Saar Havzası saldırıya uğradı. Bölge yönetimi, uluslararası güvencelerin yerine getirilmesini isteyerek İngiltere ve Fransa’ya yardım çağrısında bulunuyor. Hükümetimiz şimdi bir karar vermek zorunda: Saar’ın savunmasına katılmak, Avrupa’daki barış düzenini koruma kararlılığımızı gösterecektir. Sessiz kalmamız ise Cemiyet’in otoritesine ağır bir darbe indirebilir."
 westheia_saar.1.t:0 "Saar Havzası’nda Barış Tehlikede"
 westheia_saar.10.a:0 "Saar halkı tercihini yaptı."
 westheia_saar.10.d:0 "Saar Havzası’nda bugün yapılan halk oylaması, bölgenin geleceğine ilişkin tartışmalara kesin bir yanıt verdi. Oyların yaklaşık yüzde 90,7’si Almanya’ya katılma yönünde kullanıldı. Milletler Cemiyeti yönetiminin devamını isteyenler azınlıkta kalırken, Fransa’ya katılma seçeneği çok sınırlı destek buldu.\n\nBerlin’de sonuçlar büyük bir coşkuyla karşılanıyor. Saar halkının tercihi artık Milletler Cemiyeti Konseyi’nin önüne gelecek; bölgenin devrine ilişkin son söz Cenevre’de söylenecek."
 westheia_saar.10.t:0 "Saar Plebisiti"
 westheia_saar.11.a:0 "Devir için geri sayım başladı."
 westheia_saar.11.d:0 "Cenevre’de toplanan Milletler Cemiyeti Konseyi, Saar Havzası’ndaki halk oylamasının ardından bölgenin Almanya’ya katılmasını onayladı. Saar’ın Alman yönetimine devredileceği tarih 1 Mart olarak belirlendi.\n\nFransız ve Alman temsilciler, bölgenin devri ile madenlerin geleceğine ilişkin düzenlemeleri tamamlamak üzere görüşmelere hazırlanıyor. Büyük Savaş’ın ardından kurulan geçici Saar yönetimi artık son günlerini yaşıyor."
 westheia_saar.11.t:0 "Milletler Cemiyeti Kararı"
 westheia_saar.12.a:0 "Saar yeniden Almanya’nın bir parçası."
 westheia_saar.12.d:0 "Milletler Cemiyeti yönetimindeki Saar Havzası bugün resmen Almanya’ya katıldı. Ocak ayındaki halk oylaması ve Cemiyet Konseyi’nin kararının ardından yürütülen devir işlemleri tamamlandı; Saarbrücken’de yönetim Alman makamlarına geçti.\n\nFransa’nın bölgedeki kaynak hakları sona ererken, Saar’ın madenleri ve sanayi tesisleri Alman ekonomisine yeniden bağlandı. Berlin bu gelişmeyi ulusal birliğin yeniden kurulması yolunda önemli bir başarı olarak kutluyor."
 westheia_saar.12.t:0 "Saar’ın Yeniden Entegrasyonu"
 westheia_siam_1933.1.a:0 "Hükûmeti Phraya Phahon devralsın."
 westheia_siam_1933.1.d:0 "1932’de mutlak monarşinin sona ermesinin ardından kurulan yeni düzen, hükûmet ile Halk Partisi’nin askerî kanadı arasındaki anlaşmazlıklarla sarsılıyor. Ekonomi planı etrafındaki tartışmaların ardından Başbakan Phraya Manopakorn Nitithada’nın meclisi kapatması ve anayasal işleyişi askıya alması, siyasi krizi daha da derinleştirmişti.\n\nPhraya Phahon önderliğindeki subaylar, başkentte yönetimi ele geçirerek Manopakorn hükûmetini görevden uzaklaştırdı. Geniş çaplı çatışma yaşanmadan sonuçlanan müdahalenin ardından devletin idaresini Phraya Phahon devralacak. Darbeciler anayasal düzeni yeniden işletme sözü verirken, Khana Ratsadon’un askerî kanadı hükûmetin belirleyici gücü hâline geliyor."
 westheia_siam_1933.1.t:0 "Siyam’da Askerî Darbe"
 westheia_sinkiang_1933.1.a:0 "Bölgeyi elde tutamıyoruz. Geri çekilin."
 westheia_sinkiang_1933.1.d:0 "Güneydeki eyaletlerden gelen haberler, otoritemizin artık kâğıt üzerinde kaldığını gösteriyor. Yerel yöneticiler emirlerimizi uygulamıyor, garnizonlar kırsal bölgelerde denetim sağlayamıyor ve ayrılıkçı güçler kendi idari yapılarını kuruyor. Direnişin genişliği, bölgeyi mevcut imkânlarımızla elde tutmayı olanaksız hâle getirdi.\n\nYeni bir savaşa girişmek yerine güneydeki fiilî durumu kabul etmek zorundayız. Khotan Ma yönetimi ayrı bir devlet olarak ortaya çıkarken birliklerimiz ve memurlarımız bölgenin idaresini devredecek. Bu geri çekilme, karşılıklı bir savaş ilanı olmadan gerçekleşecek."
 westheia_sinkiang_1933.1.t:0 "Khotan’da Denetimi Kaybettik"
 westheia_sinkiang_leadership_1933.1.a:0 "Hizmet etmek isteyenleri saflarımıza alalım."
 westheia_sinkiang_leadership_1933.1.d:0 "Mançurya’da Japon ilerleyişine karşı savaşan gönüllülerden bir grup, Sovyetler Birliği üzerinden geçerek Sinkiang’a ulaştı. Uzun yolculuğun yorgunluğunu taşıyan bu askerlerin bir bölümü eyalet kuvvetlerinde hizmet etmeye hazır. Tecrübelerinden yararlanarak saflarımızdaki insan gücü açığını kapatabiliriz."
 westheia_sinkiang_leadership_1933.1.t:0 "Kuzeydoğulu Gönüllüler Sinkiang’a Ulaştı"
 westheia_sinkiang_leadership_1933.2.a:0 "Jin’in yönetimi sona erdi. Sheng idareyi devralsın."
 westheia_sinkiang_leadership_1933.2.d:0 "Süregelen isyanlar, askerî başarısızlıklar ve yönetimine duyulan hoşnutsuzluk Jin Shuren’in otoritesini aşındırdı. Başkentteki muhalif görevliler, Beyaz Rus askerleri ve Kuzeydoğulu gönüllülerin katıldığı darbe, valiyi Ürümqi’den kaçmaya zorladı. Askerî gücü elinde tutan Sheng Shicai, yaşanan iktidar boşluğunda eyalet yönetiminin başına geçiyor."
 westheia_sinkiang_leadership_1933.2.t:0 "Ürümqi’de Darbe"
 westheia_soviet_diplomacy_1933.4.a:0 "Cenevre'de yeni bir üye."
 westheia_soviet_diplomacy_1933.4.d:0 "Cenevre'de toplanan Milletler Cemiyeti Genel Kurulu, Sovyetler Birliği'ni üyeliğe kabul etti. Moskova, Avrupa'da artan gerilim karşısında ortak güvenlik arayışına katılırken Sovyet temsilcileri de Cemiyet Konseyi'nde yerlerini alacak."
 westheia_soviet_diplomacy_1933.4.t:0 "Sovyetler Birliği Milletler Cemiyeti'ne Katıldı"
 westheia_soviet_paranoia_1933.1.a:0 "Soruşturmayı genişletin."
 westheia_soviet_paranoia_1933.1.d:0 "Leningrad Parti Komitesi Birinci Sekreteri Sergey Kirov, Smolni Enstitüsü'nde Leonid Nikolayev tarafından vurularak öldürüldü. Moskova, cinayetin ardında örgütlü bir muhalefet olup olmadığını araştırırken parti kadroları üzerindeki denetimi sıkılaştırıyor."
 westheia_soviet_paranoia_1933.1.t:0 "Kirov Suikastı"
 westheia_spain_cabinets_1933.1.a:0 "Lerroux hükümeti kursun."
 westheia_spain_cabinets_1933.1.d:0 "Reform programı, koalisyon içindeki anlaşmazlıklar ve Cumhurbaşkanı Alcalá-Zamora'yla yaşanan güven bunalımı Azaña hükümetini yıprattı. Cumhurbaşkanı yeni hükümeti kurma görevini Radikal Cumhuriyetçi Parti lideri Alejandro Lerroux'ya verdi."
 westheia_spain_cabinets_1933.1.t:0 "Azaña Hükümeti Görevden Ayrılıyor"
 westheia_spain_cabinets_1933.10.a:0 "Casares Quiroga hükümeti kursun."
 westheia_spain_cabinets_1933.10.d:0 "Azaña'nın cumhurbaşkanlığına geçmesinden sonra yeni kabine için yürütülen görüşmeler sonuçlandı. Santiago Casares Quiroga, Halk Cephesi'ni destekleyen cumhuriyetçi partilerin hükümetini kuruyor. Barcia'nın kısa süreli geçici görevi sona erdi."
 westheia_spain_cabinets_1933.10.t:0 "Casares Quiroga Hükümeti"
 westheia_spain_cabinets_1933.11.a:0 "Yeni Cortes için sayım sürsün."
 westheia_spain_cabinets_1933.11.d:0 "İspanya genel seçimler için sandık başına gitti. Kadınların ilk kez ülke çapındaki parlamento seçimlerinde oy kullandığı bu seçimlerde CEDA ve Radikal Cumhuriyetçiler güç kazandı. İkinci turun ve hükümet görüşmelerinin tamamlanmasına kadar Martínez Barrio görevini sürdürecek."
 westheia_spain_cabinets_1933.11.t:0 "1933 Cortes Seçimleri"
 westheia_spain_cabinets_1933.2.a:0 "Martínez Barrio seçim hükümetini kursun."
 westheia_spain_cabinets_1933.2.d:0 "Lerroux'nun kurduğu hükümet Cortes'te yeterli destek bulamadı. Alcalá-Zamora, seçimlere kadar ülkeyi yönetecek yeni kabineyi kurması için Diego Martínez Barrio'yu görevlendirdi. Yeni hükümetin önündeki ilk iş, Cortes'in feshi ve seçimlerin düzenlenmesi olacak."
 westheia_spain_cabinets_1933.2.t:0 "Lerroux Meclisin Güvenini Kaybetti"
 westheia_spain_cabinets_1933.3.a:0 "Lerroux yeniden görevi devralsın."
 westheia_spain_cabinets_1933.3.d:0 "Kasım seçimleri ve aralık ayındaki ikinci tur, sağ partilerle Radikal Cumhuriyetçileri güçlendirdi. Martínez Barrio'nun geçici hükümeti görevini tamamladı. Alejandro Lerroux, CEDA'nın parlamentodaki desteğiyle yeni hükümeti kuruyor."
 westheia_spain_cabinets_1933.3.t:0 "Seçimlerin Ardından Yeni Hükümet"
 westheia_spain_cabinets_1933.4.a:0 "Ricardo Samper hükümeti kursun."
 westheia_spain_cabinets_1933.4.d:0 "1932 darbe girişimine katılanları da kapsayan af yasası, Lerroux hükümetiyle Cumhurbaşkanı Alcalá-Zamora arasında ciddi anlaşmazlık yarattı. Lerroux'nun ayrılmasının ardından, aynı partiden Ricardo Samper yeni kabineyi kurmakla görevlendirildi."
 westheia_spain_cabinets_1933.4.t:0 "Af Yasası Hükümeti Düşürdü"
 westheia_spain_cabinets_1933.5.a:0 "Yeni kabine göreve başlasın."
 westheia_spain_cabinets_1933.5.d:0 "CEDA, Samper hükümetine verdiği desteği çekerek kabinede doğrudan temsil istedi. Samper'in istifasının ardından Lerroux yeniden hükümet kuruyor. Kabinede üç CEDA bakanının yer alması, sol partiler ve işçi örgütleri arasında büyük tepki yaratıyor."
 westheia_spain_cabinets_1933.5.t:0 "CEDA Hükümete Giriyor"
 westheia_spain_cabinets_1933.6.a:0 "Chapaprieta mali programını uygulasın."
 westheia_spain_cabinets_1933.6.d:0 "Koalisyon içindeki anlaşmazlıklar ve maliye politikasına ilişkin tartışmalar, Lerroux'nun yeni bir hükümet değişimine gitmesine yol açtı. Maliye Bakanı Joaquín Chapaprieta, bütçeyi dengelemeyi ve kamu harcamalarını yeniden düzenlemeyi hedefleyen kabinenin başına geçiyor."
 westheia_spain_cabinets_1933.6.t:0 "Chapaprieta Hükümeti Kuruluyor"
 westheia_spain_cabinets_1933.7.a:0 "Portela Valladares görevi devralsın."
 westheia_spain_cabinets_1933.7.d:0 "Straperlo ve Nombela skandalları Radikal Parti'yi yıpratırken, bütçe ve vergi düzenlemeleri üzerinde uzlaşma sağlanamadı. Chapaprieta hükümeti desteğini kaybetti. Alcalá-Zamora, yeni hükümeti kurmak için Manuel Portela Valladares'i görevlendiriyor."
 westheia_spain_cabinets_1933.7.t:0 "Hükümet Yeniden Çıkmazda"
 westheia_spain_cabinets_1933.8.a:0 "Azaña hükümeti göreve başlasın."
 westheia_spain_cabinets_1933.8.d:0 "16 Şubat seçimlerinin ardından Halk Cephesi'nin başarısı kesinleşirken Portela Valladares görevden ayrıldı. Manuel Azaña, seçim programını uygulamak üzere yeni hükümeti kuruyor. Koalisyonun önünde siyasi tutuklulara af ve önceki reformların yeniden yürürlüğe konması var."
 westheia_spain_cabinets_1933.8.t:0 "Halk Cephesi'nin Hükümeti"
 westheia_spain_cabinets_1933.9.a:0 "Barcia geçici olarak hükümeti yönetsin."
 westheia_spain_cabinets_1933.9.d:0 "Alcalá-Zamora'nın görevden alınmasının ardından yapılan seçimde Manuel Azaña cumhurbaşkanlığına seçildi. Hükümet başkanlığından ayrılmasıyla kabinenin idaresini geçici olarak Dışişleri Bakanı Augusto Barcia Trelles üstleniyor. Yeni hükümetin kurulması için görüşmeler sürüyor."
 westheia_spain_cabinets_1933.9.t:0 "Azaña Cumhurbaşkanı Seçildi"
 westheia_spain_reforms_1933.1.a:0 "İnfazlarla direnişi kırın."
 westheia_spain_reforms_1933.1.b:0 "Yargısız infazlara izin vermeyin."
 westheia_spain_reforms_1933.1.d:0 "Cádiz kırsalındaki Casas Viejas’ta başlayan silahlı ayaklanmaya güvenlik kuvvetleri müdahale etmektedir. Gözaltına alınanlara nasıl davranılacağı ve harekâtın sınırları hakkında acil karar verilmesi gerekiyor."
 westheia_spain_reforms_1933.1.t:0 "Casas Viejas Krizi"
 westheia_spain_reforms_1933.100.a:0 "İspanya için farklı bir gelecek."
 westheia_spain_reforms_1933.100.d:0 "Madrid’den gelen haberler, askerî komploya yönelik müdahaleler ve kapsamlı siyasi anlaşmalar sonucunda darbe girişiminin ülke çapında bir savaşa dönüşmeden engellendiğini bildiriyor. Cumhuriyet ayakta kalmış olsa da verilen tavizler ve ordunun yeniden düzenlenmesi ülkeye uzun süre ağır bir yük getirecek."
 westheia_spain_reforms_1933.100.t:0 "İspanyol Cumhuriyeti Darbe Girişimini Engelledi"
 westheia_spain_reforms_1933.2.a:0 "Krizle mevcut politikamız doğrultusunda mücadele edeceğiz."
 westheia_spain_reforms_1933.2.d:0 "Hükümetin siyasi dayanakları üzerindeki mücadele işçi hareketleri ve bölgesel anlaşmazlıklarla birleşmiştir. Asturias’ta huzursuzluk büyürken Katalonya ile ilişkiler de krizin boyutunu belirlemektedir."
 westheia_spain_reforms_1933.2.t:0 "Ekim Krizi"
 westheia_spain_reforms_1933.20.a:0 "Yakınlaşmayı kabul ediyoruz."
 westheia_spain_reforms_1933.20.b:0 "Bu yükümlülüğü üstlenmeyeceğiz."
 westheia_spain_reforms_1933.20.d:0 "İspanyol Cumhuriyeti ekonomik ve askerî işbirliğini artırmak ve güvenliğini diplomatik desteğimize dayandırmak istiyor. Kabul edersek bağımsızlığını garanti altına alacağız."
 westheia_spain_reforms_1933.20.t:0 "İspanyol Cumhuriyeti Yakınlaşma İstiyor"
 westheia_spain_reforms_1933.21.a:0 "İşbirliğini geliştirelim."
 westheia_spain_reforms_1933.21.d:0 "[SOV.GetNameDef], işbirliği teklifimizi kabul etti ve bağımsızlığımızı garanti etmeyi üstlendi. Teçhizat sevkiyatları ve askerî danışmanlar için görüşmeler ilerleyebilir."
 westheia_spain_reforms_1933.21.t:0 "Yakınlaşma Talebimiz Kabul Edildi"
 westheia_spain_reforms_1933.22.a:0 "Başka dayanaklar aramalıyız."
 westheia_spain_reforms_1933.22.d:0 "[SOV.GetNameDef], teklifimizin getireceği yükümlülükleri üstlenmek istemediğini bildirdi. İki ülke arasındaki ilişkiler bu ret cevabından olumsuz etkilendi."
 westheia_spain_reforms_1933.22.t:0 "Yakınlaşma Talebimiz Reddedildi"
 westheia_spain_reforms_1933.23.a:0 "İspanya’yı ittifakımıza kabul edelim."
 westheia_spain_reforms_1933.23.b:0 "Bu başvuruyu kabul edemeyiz."
 westheia_spain_reforms_1933.23.d:0 "İspanyol Cumhuriyeti, mevcut işbirliğini resmî bir ittifaka dönüştürmek istiyor. Madrid hükûmeti, [ROOT.GetFactionName] üyeliğine kabul edilmesi için diplomatik başvuruda bulundu. İspanya’yı aramıza almak, ortak güvenlik taahhütlerimizi de genişletecektir."
 westheia_spain_reforms_1933.23.t:0 "İspanya İttifakımıza Katılmak İstiyor"
 westheia_spain_reforms_1933.24.a:0 "Artık birlikte hareket edeceğiz."
 westheia_spain_reforms_1933.24.d:0 "[SOV.GetNameDefCap] hükûmeti, ittifaka katılma talebimizi kabul etti. İspanyol Cumhuriyeti artık [SOV.GetFactionName] üyesidir. İki ülke arasındaki işbirliği, ortak savunma ve dış politika taahhütleriyle yeni bir aşamaya girdi."
 westheia_spain_reforms_1933.24.t:0 "İttifak Başvurumuz Kabul Edildi"
 westheia_spain_reforms_1933.25.a:0 "Kendi yolumuzu değerlendireceğiz."
 westheia_spain_reforms_1933.25.d:0 "[SOV.GetNameDefCap] hükûmeti, ittifaka katılma başvurumuzu reddetti. Mevcut diplomatik işbirliğimiz resmî bir ittifaka dönüşmeyecek. Güvenliğimizi sağlamak için izleyeceğimiz yolu yeniden değerlendirmeliyiz."
 westheia_spain_reforms_1933.25.t:0 "İttifak Başvurumuz Reddedildi"
 westheia_spain_reforms_1933.3.a:0 "Orduyu gönderin."
 westheia_spain_reforms_1933.3.b:0 "Tavizlerle anlaşmaya varalım."
 westheia_spain_reforms_1933.3.d:0 "Bölgesel yetkiler ve merkezî yönetimin otoritesi üzerindeki anlaşmazlığı çözmeliyiz. Askerî denetim kısa vadede düzeni sağlayabilir; mali ve idari tavizlerle yapılacak anlaşma ise uzun süreli kaynak gerektirecektir."
 westheia_spain_reforms_1933.3.t:0 "Katalonya Meselesi"
 westheia_spain_reforms_1933.4.a:0 "Sadakatsiz subayları tek tek sorgulayın."
 westheia_spain_reforms_1933.4.b:0 "Franco ve Mola’yı merkezden uzaklaştırın."
 westheia_spain_reforms_1933.4.d:0 "Cumhuriyetin emirlerine bağlılığı tartışılan subayları soruşturabilir veya önemli isimleri merkezden uzak görevlere atayabiliriz."
 westheia_spain_reforms_1933.4.t:0 "Komuta Kademesinin Geleceği"
 westheia_spain_reforms_1933.5.a:0 "[?ROOT.SPR33_questioned_general.GetName] hapse atılsın."
 westheia_spain_reforms_1933.5.b:0 "[?ROOT.SPR33_questioned_general.GetName] görevinde kalsın."
 westheia_spain_reforms_1933.5.d:0 "[?ROOT.SPR33_questioned_general.GetName], milliyetçi çevrelere bağlılığı nedeniyle ifade vermeye çağrıldı. Komutanı hapsetmek veya görevinde bırakmak arasında karar vermeliyiz."
 westheia_spain_reforms_1933.5.t:0 "[?ROOT.SPR33_questioned_general.GetName] Sorgulanıyor"
 westheia_spain_reforms_1933.6.a:0 "Bağımsız soruşturma yürütülsün."
 westheia_spain_reforms_1933.6.b:0 "Hükümeti koruyun."
 westheia_spain_reforms_1933.6.d:0 "Kumar izinleri etrafında ortaya çıkan yolsuzluk iddiaları Radikal Parti’yi ve hükümeti sarsmıştır. Bağımsız soruşturma ile siyasi koruma arasında tercih yapılmalıdır."
 westheia_spain_reforms_1933.6.t:0 "Straperlo Skandalı"
 westheia_spain_reforms_1933.7.a:0 "Belgeleri parlamentoya sunun."
 westheia_spain_reforms_1933.7.d:0 "Kolonilerle ilgili mali işlemlere ilişkin yeni suçlamalar hükümetin güvenilirliğini yeniden tartışmaya açmıştır."
 westheia_spain_reforms_1933.7.t:0 "Nombela Dosyası"
 westheia_spain_reforms_1933.8.a:0 "Hukuk herkes için geçerlidir."
 westheia_spain_reforms_1933.8.d:0 "Sorumluların siyasi koruma görmeden hesap vermesi Cumhuriyetin kurumlarına duyulan güveni yeniden güçlendirmektedir."
 westheia_spain_reforms_1933.8.t:0 "Soruşturmanın Sonuçları"
 westheia_spain_timeline_1933.1.a:0 "Sandıktan sonra ülkeyi yönetmek var."
 westheia_spain_timeline_1933.1.desc:0 "İspanya yeniden sandık başına gitmiştir. Seçimlerin ardından yeni hükümetin kurulması beklenirken, siyasi kamplar arasındaki gerilim ve ordudaki huzursuzluk sürmektedir. Cumhuriyetin geleceğini belirleyecek mücadele artık yeni bir aşamaya girmiştir."
 westheia_sweden_1933.1.a:0 "Halk yurdunu birlikte inşa edeceğiz."
 westheia_sweden_1933.1.d:0 "Büyük Buhran’ın gölgesinde süren pazarlıklar sonunda sonuç verdi. Sosyal Demokrat hükûmet ile Çiftçiler Birliği, ekonomik bunalıma karşı ortak bir program üzerinde anlaştı. İşsizliğe karşı alınacak önlemler ve kamu yatırımları, tarım kesimine sağlanacak destekle birlikte parlamentoda daha sağlam bir dayanak kazanıyor.\n\nMuhaliflerin küçümseyerek ‘Kohandeln’ adını verdiği bu uzlaşma, şehirlerdeki işçilerle kırsal kesimin taleplerini aynı masada buluşturdu. Per Albin Hansson’un bütün yurttaşları kucaklayan bir halk yurdu, Folkhemmet, düşüncesi böylece yeni bir siyasi dayanak kazanıyor. Ekonomik buhran karşısında sınıflar arasında çatışma yerine iş birliği tercih ediliyor."
 westheia_sweden_1933.1.t:0 "Kohandeln Anlaşması"
 westheia_tibet_1933.1.a:0 "Naip, Tibet’in idaresini devralsın."
 westheia_tibet_1933.1.d:0 "13. Dalai Lama Thubten Gyatso, Lhasa’da hayatını kaybetti. Tibet’in hem ruhani hem de siyasi hayatına uzun yıllar yön veren hükümdarın ölümü, ülkeyi derin bir yasa sürükledi. Devletin bağımsızlığını korumaya ve idari düzenini güçlendirmeye çalışan Dalai Lama’nın ardından, yönetimin devamlılığı en önemli mesele hâline geldi.\n\nYeni Dalai Lama’nın bulunması ve devletin başına geçebilecek yaşa ulaşması zaman alacak. Bu ara dönemde ülkenin idaresini, Reting Rinpoche olarak tanınan Jamphel Yeshe Gyaltsen naip sıfatıyla üstlenecek. Ruhani makamın devamlılığı korunurken hükümet, manastırlar ve ileri gelenler yeni dönemin sorumluluklarıyla karşı karşıya kalıyor."
 westheia_tibet_1933.1.t:0 "13. Dalai Lama’nın Ölümü"
 westheia_tuna.1.a:0 "Sarayın cömertliği, halkın cebinden."
 westheia_tuna.1.d:0 "Mehmet Tuna'nın hükümete katılmasının üzerinden iki hafta geçti. Şimdi saraydan gelen bir açıklama, aristokratın yalnızca siyasi danışman olmadığını ortaya koyuyor: II. Carol, şeker hastalığı nedeniyle özel bakım gören Tuna'yı şahsi himayesine almış. Tedavisi, maiyeti ve saraydaki yaşamının giderleri devlet hazinesinden karşılanacak.\n\nBükreş'te haber hızla yayılıyor. Saray bu kararı kralın cömertliğinin bir göstergesi olarak sunarken, halk yeni bir gözdenin masraflarını üstlenmeye pek hevesli değil. Hazine için bir imza yeterliydi; kamuoyunun rızasını almak o kadar kolay olmayacak."
 westheia_tuna.1.d_after_coup:0 "II. Carol'un ölümünün ardından saray hesapları kamuoyuna yansıdı. Mehmet Tuna'nın iki hafta önce hükümete katıldığı sırada, tedavisinin ve saraydaki yaşamının giderlerinin hazineye yüklenmesi kararlaştırılmıştı.\n\nTuna artık tahtta oturuyor; ancak unvanının değişmesi eski faturaları ortadan kaldırmıyor. Sarayın himayesiyle başlayan bu yükseliş, yeni hükümdarın halkın gözündeki ilk ciddi sınavına dönüşmüş durumda."
 westheia_tuna.1.t:0 "Sarayın Yeni Gözdesi"
 westheia_tuna.2.a:0 "Taç I. Tuna'nın, gelecek halkın olsun."
 westheia_tuna.2.d:0 "Siyasi partilerin tasfiyesinden üç gün sonra, Bükreş sarayında silah sesleri duyuldu. II. Carol, kendi himayesine aldığı Mehmet Tuna'nın düzenlediği suikastta öldürüldü. Saray çevresinde önceden hazırlanan birlikler harekete geçerken hükümet binaları darbecilerin eline geçti.\n\nTuna, ülkenin giderek radikalleşmesini ve demokrasinin ortadan kaldırılmasını uzun süredir kabul etmiyordu. Kralın güvenini kazanırken bir yandan da son hamlesini hazırlamıştı. Şimdi eski düzenin sona erdiğini ilan ediyor: siyasi yasaklar kaldırılacak, hükümdarın yetkileri anayasa ile sınırlandırılacak ve yönetim yeniden demokratik kurumlara dayanacak.\n\nYeni devletin adı Moldova Krallığı, yeni hanedanı Tuna Hanesi olacak. Sarayın eski gözdesi, I. Tuna adıyla tacı üstlenmek üzere halkın karşısına çıkıyor."
 westheia_tuna.2.t:0 "Sarayda Bir Gece, Yeni Bir Hanedan"
 westheia_tuna.3.a:0 "Balkanlar'da yeni bir hanedan."
 westheia_tuna.3.d:0 "Bükreş'te yaşanan saray darbesinin ardından yeni yönetim ülke üzerindeki denetimini sağlamlaştırıyor. II. Carol'un ölümüne yol açan suikastı düzenleyen eski danışman Mehmet Tuna, I. Tuna adıyla tahta çıktı ve devletin Moldova Krallığı adını aldığını duyurdu.\n\nYeni hükümdar, siyasi partilere yönelik yasakların kaldırıldığını ve demokratik bir meşruti monarşi kurulacağını açıkladı. Tuna Hanesi, yeni düzenin siyasi temsilcisi olarak öne çıkıyor. Bir zamanlar Carol'un koruması altında saraya giren aristokratın şimdi onun tahtında oturması, yabancı başkentlerde şaşkınlıkla karşılandı.\n\nDiplomatlar yeni hanedanın vaatlerini yerine getirip getirmeyeceğini izlerken, Balkanlar bir kez daha beklenmedik bir siyasi dönüşüme sahne oluyor."
 westheia_tuna.3.t:0 "Bükreş'te Darbe: I. Tuna Tahta Çıktı"
 westheia_tuna_aristocrat:0 "Şeker Hastası Aristokrat"
 westheia_tuna_available_tt:0 "1937 yılı bitmeden atanabilir. Atandıktan sonra görevden alınamaz."
 westheia_tuna_brave_king:0 "Cesur"
 westheia_tuna_empire_category:0 "Moldova'nın İmparatorluk Yolu"
 westheia_tuna_empire_category_desc:0 "I. Tuna'nın tahta çıkışı sarayın kaderini değiştirdi. Şimdi Tuna Hanesi, Karpatlar'dan Karadeniz'e uzanan toprakları tek bir taç altında birleştirmeyi hedefliyor. Krallığın sınırları yeni iddiasını taşıyamayacak kadar dar; Bükreş'te artık bir imparatorluk konuşuluyor."
 westheia_tuna_empire_core_reward_tt:0 "Romanya, Macaristan, Slovakya, Bulgaristan ve Ukrayna'nın bütün çekirdek bölgeleri; Baçka, Batı Banat, Edirne, Trakya, Orta Makedonya, Makedonya ve Güney Sırbistan çekirdek bölgelerimiz olur."
 westheia_tuna_empire_required_states_tt:0 "Haritada beyaz sınırla gösterilen bütün bölgeleri, Baçka ve Batı Banat dahil, kontrol ediyoruz."
 westheia_tuna_hayirdir:0 "Hayırdır amk"
 westheia_tuna_moldavian_king:0 "Moldova Kralı"
 westheia_tuna_public_discontent:0 "Sarayın Hasta Himayesi"
 westheia_tuna_public_discontent_desc:0 "Halk tanımadıkları bir hastaya para yedirmekten hoşnut değil."
 westheia_tuna_spendthrift:0 "Müsrif"
 westheia_tunas_guns:0 "Tuna'nın Topları"
 westheia_tunas_guns_desc:0 "Zırhmış, tankmış... Ne kadar uğraştıysak beceremedik. Sarayın emri açık: yürümeyen zırhlıları eritip çeliğini top dökmeye, parasını da yeni silah fabrikalarına yatırın. Tank naz yapar, top işini yapar. İmparatorluğun yolu artık palet sesiyle değil, top gürültüsüyle açılacak."
 westheia_turkey_1933.1.a:0 "Bilim, Cumhuriyet'in geleceğine yol gösterecek."
 westheia_turkey_1933.1.d:0 "Büyük Millet Meclisi, İstanbul Darülfünunu'nun kaldırılmasını ve Maarif Vekâletince yeni bir üniversite kurulmasını öngören kanunu kabul etti. Uzun süredir tartışılan yükseköğretim meselesi, böylece kapsamlı bir yeniden yapılanma dönemine giriyor.\n\nİstanbul Üniversitesi'nin kurulmasıyla öğretim ve araştırmanın çağdaş esaslara göre düzenlenmesi, yeni bilim dallarının geliştirilmesi ve güçlü bir akademik kadro yetiştirilmesi amaçlanıyor. Yabancı bilim insanlarının tecrübesinden de yararlanacak olan reform, Cumhuriyet'in bilimsel ve teknik ilerleme hedeflerinde önemli bir adım olacaktır."
 westheia_turkey_1933.1.t:0 "Üniversite Reformu"
 westheia_turkey_1933.2.a:0 "Dostluk anlaşmasını kabul ediyoruz."
 westheia_turkey_1933.2.b:0 "Bu anlaşmaya gerek yok."
 westheia_turkey_1933.2.d:0 "Türkiye ile Yunanistan arasında son yıllarda gelişen yakınlaşma, geçmişin düşmanlıklarını daha kalıcı bir iş birliğine dönüştürme imkânı sunuyor. Ankara'da hazırlanan Samimî Anlaşma Misakı, ortak sınırların güvenliğini ve iki ülkenin kendilerini ilgilendiren uluslararası meselelerde birbirine danışmasını temel alıyor.\n\nBalkanlarda belirsizliğin arttığı bir dönemde Atina'yla varılacak mutabakat, barışçı ilişkileri sağlamlaştırabilir. Karşılıklı saldırmazlık taahhüdüyle bu dostluğu pekiştirmek üzere anlaşmayı Yunan hükûmetine sunacak mıyız?"
 westheia_turkey_1933.2.t:0 "Türkiye–Yunanistan Dostluk Anlaşması"
 westheia_turkey_1933.3.a:0 "Anlaşmayı kabul ediyoruz."
 westheia_turkey_1933.3.b:0 "Teklifi reddediyoruz."
 westheia_turkey_1933.3.d:0 "Türk hükûmeti, iki ülke arasında gelişen dostluğu yeni bir anlaşmayla sağlamlaştırmayı teklif ediyor. Ankara'da hazırlanan metin, ortak sınırların korunmasını ve iki tarafın ortak çıkarlarını ilgilendiren meselelerde birbirine danışmasını öngörüyor.\n\nTürkiye'yle karşılıklı saldırmazlık taahhüdünde bulunmak, son yıllardaki uzlaşma siyasetini güçlendirebilir ve sınırlarımızdaki belirsizliği azaltabilir. Atina, bu teklifi kabul ederek Ankara'yla yakınlaşmasını sürdürmeli mi?"
 westheia_turkey_1933.3.t:0 "Türkiye'den Dostluk Anlaşması Teklifi"
 westheia_turkish_air_1933.3.a:0 "Yeni tayyareler göreve hazır."
 westheia_turkish_air_1933.3.d:0 "Curtiss ile yapılan anlaşma kapsamında Kayseri’de monte edilen Hawk II av uçakları ile İngiltere’den sipariş edilen Supermarine Southampton deniz uçaklarının teslimat programı tamamlandı. Toplam yirmi dört Hawk II ve altı Southampton, hava ve deniz havacılık birliklerimizi güçlendirecek. Kayseri’de edinilen montaj tecrübesi, Amerikan tasarımının lisans altında üretimine geçişimizin temelini oluşturuyor."
 westheia_turkish_air_1933.3.t:0 "Yeni Tayyareler Hizmete Giriyor"
 westheia_uruguay_1933.1.a:0 "Devletin idaresi Terra’nın elinde toplanacak."
 westheia_uruguay_1933.1.d:0 "Ekonomik bunalımın derinleştirdiği siyasi anlaşmazlıklar, Uruguay’da anayasal düzenin kesintiye uğramasıyla sonuçlandı. Cumhurbaşkanı Gabriel Terra, Colorado Partisi’nin bir kesimi ile Luis Alberto de Herrera önderliğindeki milliyetçilerin desteğini alarak parlamentoyu ve Ulusal Yönetim Konseyi’ni feshetti.\n\nYürütme yetkisini kendi elinde toplayan Terra, kararını ülkeyi siyasi çıkmazdan kurtarmak için gerekli bir adım olarak sunuyor. Muhalifler ise gelişmeleri cumhuriyetin kurumlarına yönelik bir darbe olarak görüyor. Sansür ve siyasi baskıların gölgesinde, devletin idaresi artık cumhurbaşkanının otoritesi altında yeniden şekillenecek."
 westheia_uruguay_1933.1.t:0 "Gabriel Terra’nın Darbesi"
 westheia_uruguay_air_1933.1.a:0 "Yeni uçakları birliklere dağıtın."
 westheia_uruguay_air_1933.1.d:0 "Geçtiğimiz yıl Fransa’dan getirilen yedi Potez 25’in montajı ve uçuş denemeleri tamamlandı. Yeni uçaklar, Askerî Havacılık Okulunun gözlem ve hafif bombardıman kapasitesini artıracak. Yer ekiplerinin hazırladığı makineler artık görev almaya hazır."
 westheia_uruguay_air_1933.1.t:0 "Potez 25 Uçakları Hizmete Giriyor"
 westheia_usa_1933.1.a:0 "Roosevelt yönetimi göreve başlasın."
 westheia_usa_1933.1.d:0 "Kasım 1932 başkanlık seçimlerinde yenilgiye uğrayan Herbert Hoover’ın görev süresi sona erdi. Franklin D. Roosevelt, Washington’da yemin ederek Amerika Birleşik Devletleri’nin 32. başkanı oldu. Hoover, ülkenin Büyük Buhran’ın en ağır günlerini yaşadığı bir dönemde Beyaz Saray’dan ayrılıyor.\n\nSon aylarda artan banka iflasları ve mevduat çekilişleri mali sistemi sarsarken işsizlik ve üretimdeki daralma milyonlarca Amerikalıyı etkilemektedir. Demokrat Parti yönetimi, seçim kampanyasında vaat ettiği Yeni Düzen doğrultusunda ekonomik toparlanmayı sağlamak ve federal hükûmete duyulan güveni yeniden kurmak gibi ağır bir sorumluluk üstleniyor."
 westheia_usa_1933.1.t:0 "Beyaz Saray’da Devir Teslim"
 westheia_usa_withdrawal_1933.1.a:0 "Görev tamamlandı. Birliklerimiz geri dönsün."
 westheia_usa_withdrawal_1933.1.d:0 "Nikaragua’daki son deniz piyadelerimizin görevi sona erdi. Güvenlik sorumluluğunun yerel Ulusal Muhafızlara devredilmesiyle birlikte, ülkemizin uzun süren askerî müdahalesi kapanmaktadır.\n\nBirliklerimizin geri çekilmesiyle Nikaragua’daki askerî erişimimiz de sona erecektir."
 westheia_usa_withdrawal_1933.1.t:0 "Nikaragua’dan Çekiliyoruz"
 westheia_usa_withdrawal_1933.2.a:0 "Birliklerimizi geri çekelim."
 westheia_usa_withdrawal_1933.2.d:0 "Haiti hükümetiyle yürütülen görüşmelerin ardından, ülkedeki son Amerikan deniz piyadelerinin çekilme zamanı geldi. 1915’te başlayan askerî işgal sona ererken güvenlik sorumluluğu Haiti makamlarında kalacaktır.\n\nHaiti’deki askerî erişimimizi sonlandırarak bu uzun müdahale dönemini kapatıyoruz."
 westheia_usa_withdrawal_1933.2.t:0 "Haiti’deki Askerî Varlığımız Sona Eriyor"
 westheia_usa_withdrawal_1933.3.a:0 "Alay geri dönsün; deniz piyadelerimizin görevi sürüyor."
 westheia_usa_withdrawal_1933.3.d:0 "Kuzey Çin’deki Amerikan askerî varlığını azaltma kararı doğrultusunda 15. Piyade Alayı Tianjin’den ayrılmaktadır. Uzun yıllardır yabancı yerleşimlerin ve ulaşım hatlarının korunmasında görev yapan alay, ülkesine dönecektir.\n\nÇin’deki deniz piyadelerimizin görevi devam ettiği için askerî erişimimiz şimdilik korunacaktır."
 westheia_usa_withdrawal_1933.3.t:0 "15. Piyade Alayı Tianjin’den Ayrılıyor"
 westheia_usa_withdrawal_1933.4.a:0 "Çin’deki askerî erişimimizi sonlandıralım."
 westheia_usa_withdrawal_1933.4.d:0 "Şanghay’daki Amerikan deniz piyadelerinin tahliyesi tamamlanmaktadır. Japonya ile giderek artan gerilim ve savunulması güç mevziler, bu kuvvetleri açıkta bırakmayı tehlikeli hâle getirmiştir.\n\nÇin’deki uzun süreli kara garnizon görevimizi sonlandırıyor ve askerî erişimimizi iptal ediyoruz."
 westheia_usa_withdrawal_1933.4.t:0 "Çin’deki Birliklerimizi Geri Çekiyoruz"
 westheia_venezuela_1933.1.a:0 "Ülkenin idaresini López Contreras devralacak."
 westheia_venezuela_1933.1.d:0 "Venezuela’yı 1908’den beri demir yumrukla yöneten General Juan Vicente Gómez, Maracay’da hayatını kaybetti. Yaklaşık yirmi yedi yıldır devletin ve ordunun üzerinde tartışılmaz bir otorite kuran Gómez’ün ölümü, ülkemizde uzun bir dönemin kapanışını işaret ediyor.\n\nİktidar boşluğunun bir mücadeleye dönüşmesini önlemek isteyen Bakanlar Kurulu, Savaş ve Denizcilik Bakanı General Eleazar López Contreras’ı geçici devlet başkanı olarak belirledi. Yeni yönetim ordunun desteğiyle düzeni korumaya hazırlanırken, Gómez döneminde susturulan muhalifler ülkenin geleceğine ilişkin beklentilerini yeniden dile getiriyor."
 westheia_venezuela_1933.1.t:0 "Juan Vicente Gómez’ün Ölümü"
 westheia_western_1933.1.a:0 "Dilekçeyi Londra’ya iletin."
 westheia_western_1933.1.d:0 "Batı Avustralya’da yapılan referandumda seçmenlerin yaklaşık üçte ikisi, eyaletin Avustralya Federasyonu’ndan ayrılması yönünde oy kullandı. Büyük Buhran’ın yarattığı sıkıntılar ve federal gümrük politikalarına duyulan tepki, Dominion League’in yürüttüğü kampanyaya geniş bir destek kazandırdı.\n\nAyrılıkçılar Britanya İmparatorluğu’na bağlılıklarını korumak istiyor; hedefleri federasyondan ayrı bir yönetim kurmak. Ancak referandum tek başına anayasal ayrılığı gerçekleştirmiyor. Sonucun Londra’ya taşınması ve Britanya Parlamentosu’nun müdahalesinin istenmesi gerekiyor. Bu süreç, ülkemizin siyasi birliğini şimdiden sarsıyor."
 westheia_western_1933.1.t:0 "Batı Avustralya Ayrılmak İstiyor"
 westheia_western_1933.2.a:0 "Bu mesele Avustralya’nın anayasal düzeni içinde çözülmelidir."
 westheia_western_1933.2.b:0 "Batı Avustralya’nın ayrı bir dominyon olmasını kabul edin."
 westheia_western_1933.2.d:0 "Batı Avustralya’nın 1933 referandumunun ardından başlattığı ayrılma girişimi parlamentomuzun önüne geldi. Başvuru, eyaletin Avustralya Federasyonu’ndan çıkarılmasını ve Taç’a bağlı ayrı bir yönetim kurulmasını istiyor.\n\nOrtak parlamento komitesinin değerlendirmesi, bir eyaletin talebi üzerine federasyonun anayasal düzenine müdahale etmenin yerleşik dominyon ilişkileriyle bağdaşmayacağı yönünde. Avustralya halkının bütününü temsil eden bir talep bulunmadan dilekçeyi reddedebiliriz. Ayrılığı kabul etmek ise Canberra’nın otoritesini sarsacak ve imparatorluk içinde yeni bir dominyon doğuracaktır."
 westheia_western_1933.2.t:0 "Batı Avustralya’nın Ayrılma Dilekçesi"
 westheia_western_1933.3.a:0 "Federal birlik korunuyor."
 westheia_western_1933.3.d:0 "Londra, Batı Avustralya’nın ayrılma dilekçesini kabul etmeyeceğini bildirdi. Britanya Parlamentosu, federasyonun anayasal düzenini tek bir eyaletin başvurusu üzerine değiştirmeyi uygun görmüyor.\n\nAyrılıkçı temsilciler kararı hayal kırıklığıyla karşıladı; ancak Londra yoluyla ayrılma girişimi sonuçsuz kaldı. Eyalet federasyon içinde kalacak ve mali şikâyetlerin çözümü yeniden Avustralya’nın kendi kurumlarında aranacak. Federal birliği sarsan kriz sona eriyor."
 westheia_western_1933.3.t:0 "Britanya Ayrılma Dilekçesini Reddetti"
 westheia_western_1933.4.a:0 "Federasyonumuz küçüldü."
 westheia_western_1933.4.d:0 "Britanya hükûmeti, Batı Avustralya’nın ayrılma başvurusunu kabul etti. Perth merkezli eyalet yönetimi, Taç’a bağlı ayrı bir dominyon olarak yeniden düzenleniyor. Pilbara ve Kimberley’yi de kapsayan Batı Avustralya artık Canberra’nın yönetiminde olmayacak.\n\nLondra’nın bu kararı federasyon için ağır bir siyasi kayıp olsa da ayrılık savaşa dönüşmeden gerçekleşti. Avustralya, batıdaki eski eyaletiyle ilişkilerini artık ayrı bir hükûmet üzerinden yürütecek."
 westheia_western_1933.4.t:0 "Batı Avustralya Federasyondan Ayrıldı"
 westheia_western_1933.5.a:0 "Batı Avustralya için yeni bir dönem."
 westheia_western_1933.5.d:0 "Londra’nın ayrılma başvurusunu kabul etmesiyle Batı Avustralya, Avustralya Federasyonu’nun dışında yeni bir dominyon hâline geldi. Perth’teki mevcut seçilmiş hükûmet görevini sürdürecek; Philip Collier yönetimi kamu idaresini yeni anayasal konuma uyarlayacak.\n\nAyrılık kampanyasının temelinde farklı bir halk için devlet kurmaktan ziyade Batı Avustralya’nın ekonomik çıkarları ve eyalet yönetiminin yetkileri vardı. Şimdi bu talepler, Britanya Tacı’na bağlı ayrı bir hükûmet çatısı altında karşılanacak."
 westheia_western_1933.5.t:0 "Batı Avustralya Dominyonu"
 westheia_xic_europe_1933.1.a:0 "Bir süre uzaklaşmak en iyisi."
 westheia_xic_europe_1933.1.d:0 "Rehe’nin Japonların desteklediği Mançukuo kuvvetlerinin eline geçmesi, Kuzeydoğu Ordusu’nun itibarına ağır bir darbe indirdi. Yenilginin ardından Zhang Xueliang’a yönelen eleştiriler ve Nanjing’in baskısı giderek artıyor. Zhang, sorumluluğu üstlenerek günlük yönetimden uzaklaşacağını ve Avrupa’ya gideceğini açıkladı. Ordu üzerindeki nüfuzu sürse de yokluğunda idareyi kurmayları yürütecek."
 westheia_xic_europe_1933.1.t:0 "Zhang Xueliang Avrupa’ya Gidiyor"
 westheia_xic_europe_1933.2.a:0 "Yeniden işimizin başına dönelim."
 westheia_xic_europe_1933.2.d:0 "Avrupa’da geçirdiği ayların ardından Zhang Xueliang Shanghai’ya döndü. Yolculuğu ve tedavisi boyunca günlük askerî işlerden uzak kalan genç mareşal, artık yeniden çalışma hayatına katılmaya hazırlanıyor. Kuzeydoğu Ordusu’nun komutanları, onun dönüşüyle birlikte yönetimdeki belirsizliğin sona ermesini bekliyor."
 westheia_xic_europe_1933.2.t:0 "Zhang Xueliang Çin’e Döndü"
 westheia_yemen_1933.1.a:0 "Haklarımızı silahla savunacağız!"
 westheia_yemen_1933.1.b:0 "Bu anlaşmazlık yüzünden savaşa girmeyeceğiz."
 westheia_yemen_1933.1.d:0 "Yemen ile Suudi Arabistan arasındaki belirsiz sınır ve tartışmalı bölgeler üzerindeki egemenlik iddiaları, iki krallığın ilişkilerini giderek geriyor. Asir, Cizan ve Necran çevresindeki yerel bağlılıklar ile sınır hareketliliği, İmam Yahya’nın yönetimi ile Kral Abdülaziz’in hükûmetini karşı karşıya getirmiş durumda.\n\nDiplomatik girişimler anlaşmazlığı gideremedi. Sınırdaki gerilimi askerî güç kullanarak çözmeye çalışabilir veya ülkeyi açık bir savaşa sürüklemekten kaçınabiliriz."
 westheia_yemen_1933.1.t:0 "Suudi Arabistan ile Sınır Anlaşmazlığı"
 westheia_yemen_1933.2.a:0 "Arabistan’da yeni bir savaş."
 westheia_yemen_1933.2.d:0 "Arabistan’ın güneyindeki sınır anlaşmazlıkları açık savaşa dönüştü. Yemen, Suudi Arabistan’a karşı askerî harekâta giriştiğini duyurdu. Asir, Cizan ve Necran çevresindeki egemenlik iddiaları ile yerel güç mücadeleleri, uzun süredir iki krallığın ilişkilerini geriyordu.\n\nİmam Yahya ile Kral Abdülaziz’in yönetimleri arasındaki çatışma, Kızıldeniz kıyıları ve yarımadanın güneybatısındaki güvenlik açısından endişe yaratıyor. Bölgedeki gözlemciler, savaşın daha geniş bir istikrarsızlığa yol açmasından kaygılı."
 westheia_yemen_1933.2.t:0 "Yemen ile Suudi Arabistan Arasında Savaş"
 westheia_yemen_1933.3.a:0 "Taif Anlaşması’nı imzalayalım."
 westheia_yemen_1933.3.d:0 "Sınırdaki çatışmaları sona erdirmek üzere yürütülen görüşmeler, Yemen ile Suudi Arabistan arasında bir barış metni üzerinde uzlaşılmasıyla sonuçlandı. İmam Yahya ile Kral Abdülaziz’in temsilcileri tarafından hazırlanan Taif Anlaşması, savaş hâlinin sona ermesini ve iki krallık arasındaki ilişkilerin barışçı bir çerçevede yeniden kurulmasını öngörüyor.\n\nKarşılıklı egemenliğe saygı ve sınır güvenliğini esas alan anlaşmanın imzalanmasıyla askerî harekât durdurulacak. Uzun süredir devam eden güvensizliğin giderilmesi zaman alacak olsa da bugün çatışmaların yerini diplomasiye bırakması için önemli bir fırsat doğdu."
 westheia_yemen_1933.3.t:0 "Taif Anlaşması"
 westheia_yemen_1933.4.a:0 "Arabistan’da silahlar sustu."
 westheia_yemen_1933.4.d:0 "Yemen ile Suudi Arabistan, 20 Mayıs’ta imzalanan Taif Anlaşması ile aralarındaki savaşa son verdi. Anlaşma, iki krallığın bağımsızlığına ve egemenliğine karşılıklı saygıyı esas alırken sınır anlaşmazlıklarının barışçı ilişkiler çerçevesinde ele alınmasını öngörüyor.\n\nKızıldeniz’in güneyindeki güvenliği sarsan çatışmaların durması, bölgedeki diplomatik çevrelerde memnuniyetle karşılandı. Savaşın bıraktığı güvensizlik devam etse de Yemen ve Suudi Arabistan arasında yeniden barış sağlanmış durumda."
 westheia_yemen_1933.4.t:0 "Taif Anlaşması İmzalandı"
 westheia_zveno_1933.1.a:0 "Saray, yeniden harekete geçeceği günü bekleyecek."
 westheia_zveno_1933.1.d:0 "Sofya'daki hükûmet bunalımından yararlanan Zveno hareketi ve Askerî Birlik, ordunun desteğiyle yönetimi ele geçirdi. Başkentin kilit noktaları askerlerin kontrolüne girerken Kimon Georgiev'in başkanlığında yeni bir hükûmet kuruldu. Parlamento dağıtılıyor, siyasi partiler yasaklanıyor ve ülkenin idaresi merkezden atanacak görevlilere bırakılıyor.\n\nDarbeciler, parti çekişmelerine son vererek güçlü bir devlet kuracaklarını ilan ediyor. Ancak yeni düzen, Kral III. Boris'in siyasi ağırlığını da sınırlıyor. Saray şimdilik durumu kabul etmek zorunda kalsa da ordu içindeki bağlılıklar henüz kesinleşmiş değil."
 westheia_zveno_1933.1.t:0 "Zveno Askerî Darbesi"
 westheia_zveno_1933.2.a:0 "Sofya'da yönetim ordunun elinde."
 westheia_zveno_1933.2.d:0 "Bulgaristan'da Zveno hareketi ve Askerî Birlik, ordunun desteğiyle iktidarı ele geçirdi. Kimon Georgiev'in yeni hükûmeti parlamentoyu feshederek siyasi partilerin faaliyetlerine son verdi. Başkent Sofya'da denetimi sağlayan darbeciler, devlet idaresini merkezîleştirecek köklü reformlar vadederken Kral III. Boris gelişmeleri kabullenmek zorunda kaldı.\n\nBalkan devletleri, komşularındaki yeni yönetimin bölgenin hassas dengeleri üzerindeki etkisini izliyor. Bulgaristan'da parlamenter siyasetin sona ermesi, Avrupa'da otoriter idarelerin güç kazandığı bir dönemde yeni bir dönüm noktası olarak görülüyor."
 westheia_zveno_1933.2.t:0 "Bulgaristan'da Askerî Darbe"
 westheia_zveno_1933.3.a:0 "Devletin idaresi yeniden sarayın elinde."
 westheia_zveno_1933.3.d:0 "Sarayın ordu içinde kurduğu bağlar sonuç verdi. Zveno'nun dayandığı subay çevreleri bölünürken Kral III. Boris, hükûmeti çekilmeye zorladı. Kimon Georgiev ve yakınlarının devlet idaresindeki belirleyici konumu sona eriyor; yeni kabinenin saraya bağlı isimlerden oluşturulması için hazırlıklar başladı.\n\nBu gelişme, parlamenter düzene dönüş anlamına gelmiyor. Siyasi partiler üzerindeki kısıtlamalar sürerken hükûmetin ağırlık merkezi askerî hareketin önderlerinden krala kayıyor. Boris, darbeyi gerçekleştirenlerin elinden yönetimi geri alarak kişisel otoritesini sağlamlaştırdı."
 westheia_zveno_1933.3.t:0 "Zveno Hükûmetinin Sonu"
 westheia_zveno_1933.4.a:0 "Sofya'da son sözü kral söyledi."
 westheia_zveno_1933.4.d:0 "Kral III. Boris, ordu içindeki sadık subayların desteğiyle Zveno hükûmetini görevden uzaklaştırdı. Sofya'da aylar süren nüfuz mücadelesi, sarayın üstünlüğüyle sonuçlanırken askerî hareketin liderleri yönetimdeki ağırlıklarını kaybetti.\n\nYeni düzen, yasaklanan siyasi partilerin yeniden serbest bırakılmasını öngörmüyor. Bulgaristan otoriter bir idare altında kalmaya devam ederken hükûmetin geleceğini belirleyen güç artık kralın kendisi. Balkan başkentleri, sarayın bu hamlesinin komşularıyla ilişkilere nasıl yansıyacağını değerlendiriyor."
 westheia_zveno_1933.4.t:0 "Bulgar Kralından Karşı Darbe"
 winter_war_reason_tt:0 "Kış Savaşı sırasında kullanılamaz."
 WESTHEIA_ideology_tooltip_AUS_austromarxism_desc:0 "§YAvusturya Marksizmi§!\n\n\n\n\n\n\n\n\n\n\n\n\n£GFX_westheia_real_banner_austromarxism\n\n\n\n\n\n\n\n\n\n\n\n\n\nMarksist toplumsal dönüşümü işçi örgütleri, belediye yönetimleri ve demokratik siyaset deneyimiyle birleştirir. Çok uluslu toplumlarda kültürel özerklik ve sınıfsal dayanışma sorunlarına özel önem verir."
 WESTHEIA_ideology_tooltip_AUS_austrostalinism_desc:0 "§YAvusturya Stalinizmi§!\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n£GFX_westheia_real_banner_austrostalinism\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nAvusturya komünist hareketinin Stalin çizgisindeki merkezî parti yönetimini temsil eder. Kamu mülkiyeti, planlı sanayileşme ve disiplinli örgütlenme, Sovyet siyasi modeliyle yakın bağ içinde savunulur."
 WESTHEIA_ideology_tooltip_AUS_austrotrotskyism_desc:0 "§YAvusturya Troçkizmi§!\n\n\n\n\n\n\n\n£GFX_westheia_real_banner_austrotrotskyism\n\n\n\n\n\n\n\n\nAvusturya işçi hareketinde sürekli devrim ve uluslararası sosyalist dayanışma çizgisini temsil eder. Stalinist parti bürokrasisine karşı çıkarak devrimci örgütlenmeyi işçi demokrasisiyle birleştirmeyi savunur."
 WESTHEIA_ideology_tooltip_anarchism_desc:0 "§YAnarşizm§!\n\n\n\n\n\n£GFX_lx4_banner_24\n\n\n\n\n\n\nAnarşizm, otoritenin kendisinin reddedilmesidir ve tekil, merkezi bir devlet yerine toplumun kendi kendini yöneten ve kendi kendini idare eden kolektiflere bölünmesini teşvik eder."
 WESTHEIA_ideology_tooltip_anarchist_communism_desc:0 "§YAnarşist Komünizm§!\n\n\n\n\n\n£GFX_lx4_banner_23\n\n\n\n\n\n\nKomünizmi devletsiz bir toplum fikri olarak benimseyen bir ideoloji olan Anarşist Komünizm, geçiş dönemi bir sosyalist devlet fikrinden kaçınır ve gönüllü birliklere ve karşılıklı yardıma dayalı bir toplumu tercih eder."
 WESTHEIA_ideology_tooltip_anti_revisionism_desc:0 "§YAnti-Revizyonizm§!\n\n\n\n\n\n£GFX_lx4_banner_10\n\n\n\n\n\n\nMarksizm'in halefleri olduğunu iddia eden birçok ideolojiye bir tepki olan Anti-Revizyonizm, orijinal devrimci teorinin kilit unsurlarını korumayı savunur. Esas olarak kapitalist ekonomik unsurların sosyalist devletlere dahil edilmesine karşı çıkan bu ideoloji, ne olduğu kadar ne olmadığıyla da tanımlanır."
 WESTHEIA_ideology_tooltip_buddhist_socialism_desc:0 "§YBudist Sosyalizmi§!\n\n\n\n\n\n£GFX_lx4_banner_15\n\n\n\n\n\n\nDhammik veya Doğal sosyalizm olarak da adlandırılan Budist sosyalizmi, Budizm ilkelerine dayalı sosyalizmi savunan bir siyasi ideolojidir. Hem Budizm hem de sosyalizm, koşullarını analiz ederek ve ana nedenlerini pratik yoluyla ortadan kaldırarak acıya bir son vermeyi amaçlar. Her ikisi de insan yabancılaşmasına ve bencilliğine son vermek için kişisel bilincin dönüşümünü sağlamayı amaçlar."
 WESTHEIA_ideology_tooltip_centrism_desc:0 "§YMerkezcilik§!\n\n\n\n\n\n£GFX_lx4_banner_62\n\n\n\n\n\n\nMerkezcilik, mevcut ve gelecekteki ihtiyaçları uygun şekilde ele alan, kamu güvenini destekleyen ve bu ihtiyaçlar bağlamında risk ve kapasiteyi göz önünde bulundurarak ortak iyiliğe hizmet eden sağduyulu çözümler elde etmek isteyen bir hükümet biçimidir."
 WESTHEIA_ideology_tooltip_conservatism_desc:0 "§YMuhafazakarlık§!\n\n\n\n\n\n£GFX_lx4_banner_43\n\n\n\n\n\n\nToplumdaki hızlı değişimleri potansiyel olarak zararlı gören muhafazakarlık, geleneği ve ılımlı reformları benimser, bazen eski ahlaki değerlere dönüşü savunur."
 WESTHEIA_ideology_tooltip_despotism_desc:0 "§YDespotik§!\n\n\n\n\n\n£GFX_lx4_banner_59\n\n\n\n\n\n\nDespotizm, tek bir kişinin mutlak güçle yönettiği bir hükümet biçimidir."
 WESTHEIA_ideology_tooltip_emperor_fascism_desc:0 "§Yİmparator Faşizmi§!\n\n\n\n\n\n£GFX_lx4_banner_78\n\n\n\n\n\n\nİmparator Faşizmi, kitlelerin söz hakkına sahip olmadığı, genellikle 'yukarıdan faşizm' olarak adlandırılan, yönetimin askeri ve aristokrat bürokratlar tarafından tutulduğu ve ulusun imparatoruna, yanılmaz bir ilahi figür olarak kabul edilen bir hükümdara büyük saygı duyulan bir Aşırı Milliyetçilik biçimidir."
 WESTHEIA_ideology_tooltip_falangism_desc:0 "§YFalanjizm§!\n\n\n\n\n\n£GFX_lx4_banner_71\n\n\n\n\n\n\nFaşizm ve muhafazakarlık özelliklerine sahip otoriter bir ideoloji olan Falanjizm, ulusal ve Katolik kimliğe değer verir."
 WESTHEIA_ideology_tooltip_fascism_ideology_desc:0 "§YFaşizm§!\n\n\n\n\n\n£GFX_lx4_banner_70\n\n\n\n\n\n\nÇeşitli aşırı milliyetçi hareketleri kapsayan faşizm, tipik olarak devlete bağlılığı ve halkı güçlü bir lider altında birleştirmeyi yüceltir."
 WESTHEIA_ideology_tooltip_gen_nazism_desc:0 "§YNazizm§!\n\n\n\n\n\n£GFX_lx4_banner_85\n\n\n\n\n\n\nAşırı milliyetçiliğe dayanan Nasyonal Sosyalizm, ırksal üstünlük fikirleriyle hareket eder. Saldırgan yayılmacılığı ve halkın mutlak güce sahip bir lider altında birleştiği totaliter bir devleti teşvik eder."
 WESTHEIA_ideology_tooltip_japan_militarism_ideology_desc:0 "§YMilitarizm§!\n\n\n\n\n\n£GFX_lx4_banner_68\n\n\n\n\n\n\nMilitarizm, ulus liderinin yalnızca nominal bir kontrole sahip olduğu ve bağımsız bir politikacıdan çok ulusun ordusunun bir kuklası gibi hareket ettiği, hızlı yayılmacı politika nihai hedefiyle gündemlerini sürekli ilettiği bir ideolojidir."
 WESTHEIA_ideology_tooltip_leninism_desc:0 "§YLeninizm§!\n\n\n\n\n\n£GFX_lx4_banner_09\n\n\n\n\n\n\nMarksist düşünceye dayanan bir siyasi ideoloji olan Leninizm, kapitalist toplumu deviren bir devrime öncülük eden bir öncü parti aracılığıyla sosyalist bir devlet kurmayı amaçlar. İktidara geldikten sonra parti, bir karar alınana kadar politikaların iç tartışmaya açık olduğu bir sistemle yönetir."
 WESTHEIA_ideology_tooltip_liberalism_desc:0 "§YLiberalizm§!\n\n\n\n\n\n£GFX_lx4_banner_31\n\n\n\n\n\n\nKişisel özgürlüğe değer veren uzun bir felsefi geleneğe sahip olan liberalizm, bu hakların korunmasını devletin birincil işlevi olarak görür."
 WESTHEIA_ideology_tooltip_marxism_desc:0 "§YMarksizm§!\n\n\n\n\n\n£GFX_lx4_banner_93\n\n\n\n\n\n\nGeniş bir ekonomik ve tarihi görüş yelpazesini kapsayan Marksist siyaset, Karl Marx'ın teorilerini siyasi pratiğe uygulamayı amaçlar. Sınıf mücadelesi ve üretim araçlarının ortak mülkiyetine dayalı bir topluma geçiş ihtiyacı bu ideolojileri karakterize eder."
 WESTHEIA_ideology_tooltip_moderatism_desc:0 "§YIlımlılık§!\n\n\n\n\n\n£GFX_lx4_banner_49\n\n\n\n\n\n\nIlımlılık, ılımlı bir pozisyon veya hareket tarzı benimseyerek sol ve sağın aşırılıklarından kaçınan bir hükümet biçimidir."
 WESTHEIA_ideology_tooltip_nazism_desc:0 "§YNazizm§!\n\n\n\n\n\n£GFX_lx4_banner_85\n\n\n\n\n\n\nAşırı milliyetçiliğe dayanan Nasyonal Sosyalizm, Cermen üstünlüğü fikirleriyle hareket eder. Saldırgan yayılmacılığı ve halkın mutlak güce sahip bir lider, Führer altında birleştiği totaliter bir devleti teşvik eder."
 WESTHEIA_ideology_tooltip_oligarchism_desc:0 "§YOligarşik§!\n\n\n\n\n\n£GFX_lx4_banner_60\n\n\n\n\n\n\nOligarşi, bir grup insanın mutlak güçle yönettiği bir hükümet biçimidir."
 WESTHEIA_ideology_tooltip_populism_desc:0 "§YPopülizm§!\n\n\n\n\n\n£GFX_lx4_banner_38\n\n\n\n\n\n\nBelirgin bir ideolojik çerçevesi olmayan siyasi bir hareket. Popülistler, seçmenler arasında popüler olan veya siyasi 'elitlerin' tercihleriyle çeliştiği algılanan yelpazenin her yerinden politikaları savunurlar."
 WESTHEIA_ideology_tooltip_rexism_desc:0 "§YReksizm§!\n\n\n\n\n\n£GFX_lx4_banner_72\n\n\n\n\n\n\nHem liberal hem de komünist ideallere şiddetle karşı çıkan Reksizm, korporatist bir ekonomi politikasını savunan sadık bir muhafazakar milliyetçi harekettir. Giderek artan popülist ve otoriter bir söylem kullanarak, idealleri diğer faşist hareketlere yaklaşmaktadır."
 WESTHEIA_ideology_tooltip_socialism_desc:0 "§YSosyalizm§!\n\n\n\n\n\n£GFX_lx4_banner_17\n\n\n\n\n\n\nReformist yollarla eşitlik ve sosyalist bir devlet için çabalayan demokratik sosyalizm, kamuoyu yetkisiyle kapitalizmin etkilerini ortadan kaldırmayı veya azaltmayı amaçlar."
 WESTHEIA_ideology_tooltip_stalinism_desc:0 "§YStalinizm§!\n\n\n\n\n\n£GFX_lx4_banner_02\n\n\n\n\n\n\nMarksist-Leninist politikaları uygulayan ve geliştiren bir hükümet biçimi olarak kendini tanımlayan Stalinizm, hızlı sanayileşme ve kolektifleştirmeyi ve ayrıca herhangi bir karşı-devrimci unsuru tasfiye etmek için güçlü, otoriter bir sosyalist devlet ihtiyacını vurgular."
 WESTHEIA_selected_country_ideology_tooltip:0 "[GetWestheiaSelectedCountryIdeologyTooltip]"
