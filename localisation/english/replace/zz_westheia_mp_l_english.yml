 WESTHEIA_AUS33_BOOKMARK_DESC:0 "Avusturya, ekonomik çöküntü ve yaygın işsizlik içinde 1933 yılına giriyor. Engelbert Dollfuß hükûmeti, kırılgan parlamenter çoğunluğunu korumaya çalışırken siyasi kutuplaşma giderek derinleşiyor. Saint-Germain Antlaşması küçük profesyonel ordunun gelişimini sınırlandırıyor; ülkenin sanayisi ise daralan talep ve bankacılık krizinin etkileriyle mücadele ediyor. Avusturya’nın önünde ekonomiyi canlandırmak, bağımsızlığını korumak ve siyasi geleceğini belirlemek gibi zorlu görevler bulunuyor."
 WESTHEIA_AUS33_CR20_DELIVERY_TT:0 "§Y5 Fiat CR.20§! avcı uçağı teslim alınır."
 WESTHEIA_AUS33_MAY_CONSTITUTION_IDEOLOGY_TT:0 "İktidardaki liderin alt ideolojisi §YAvusturya Faşizmi§! olarak değişir."
 WESTHEIA_AUS33_cr20_registration:0 "Fiat CR.20"
 WESTHEIA_AUS33_cr20_registration_desc:0 "İthal Fiat CR.20 uçaklarının envanter kaydı."
 WESTHEIA_AUS33_cr20_registration_legacy:0 "Fiat CR.20"
 WESTHEIA_AUS33_cr20_registration_legacy_desc:0 "İthal Fiat CR.20 uçaklarının envanter kaydı."
 WESTHEIA_AUS33_depression_description_1933:0 "Daralan iç talep, azalan ihracat ve bankacılık krizinin ardından sanayi tesisleri kapasitelerinin altında çalışıyor. Yaygın işsizlik ve kamu maliyesindeki baskı, yatırımları ve ekonomik faaliyetin yeniden canlanmasını güçleştiriyor."
 WESTHEIA_AUS33_depression_description_fallback:0 "30'ların başındaki ekonomik çöküşlerden toparlanma yavaş oldu, ancak görünüşe göre Avusturya nihayet daha iyi zamanlara doğru ilerliyor."
 WESTHEIA_AUS33_depression_name_1933:0 "Ekonomik Çöküntü"
 WESTHEIA_AUS33_depression_name_fallback:0 "Ekonomik Buhrandan Toparlanma"
 WESTHEIA_AUS33_enact_may_constitution:0 "Mayıs Anayasasını Yürürlüğe Koy"
 WESTHEIA_AUS33_enact_may_constitution_desc:0 "Parlamenter sistemin yerine meslek esasına dayanan yeni bir devlet düzeni kuruluyor. Mayıs Anayasası, yürütmenin yetkilerini genişletirken Katolik toplumsal düşüncesini ve Vaterländische Front çevresinde şekillenen korporatif kurumları devletin temeline yerleştirecek."
 WESTHEIA_AUS33_fiat_cr20_inventory:0 "Fiat CR.20"
 WESTHEIA_AUS33_fiat_cr20_inventory_desc:0 "İtalya’dan temin edilen çift kanatlı Fiat CR.20 avcı uçağı."
 WESTHEIA_AUS33_fiat_cr20_inventory_legacy:0 "Fiat CR.20"
 WESTHEIA_AUS33_fiat_cr20_inventory_legacy_desc:0 "İtalya’dan temin edilen çift kanatlı Fiat CR.20 avcı uçağı."
 WESTHEIA_AUS33_may_constitution:0 "Mayıs Anayasası"
 WESTHEIA_AUS33_may_constitution_desc:0 "Mayıs Anayasası, siyasi yaşamı güçlü bir yürütme ve meslek esasına dayalı kurumlar etrafında düzenliyor. Vaterländische Front ile Katolik kurumların desteğine dayanan yönetim, parlamenter rekabeti sınırlandırarak devlet otoritesini pekiştiriyor."
 WESTHEIA_AUS_1933_COMPROMISE_PATH_TT:0 "Şubat çatışmalarında sosyal demokrat muhalefetle uzlaşma yoluna gidilmiş olmalı."
 WESTHEIA_AUS_1933_CRACKDOWN_PATH_TT:0 "Şubat çatışmalarında muhalefeti zor kullanarak bastırma yoluna gidilmiş olmalı."
 WESTHEIA_AUS_1933_DOLLFUSS_DEATH_REQUIRED_TT:0 "Engelbert Dollfuss’un ölümüyle sonuçlanan Temmuz Darbesi yaşanmış olmalı."
 WESTHEIA_AUS_1933_DOLLFUSS_KILLED_TT:0 "§YEngelbert Dollfuss§! hayatını kaybeder."
 WESTHEIA_AUS_AUSTROFASCISM_IDEOLOGY_DESC:0 "§YAvusturya Faşizmi§!\n\n\n\n\n\n\n\n\n£GFX_westheia_real_banner_austrofascism\n\n\n\n\n\n\n\n\n\nKatolik gelenek ve korporatif devlet düşüncesi etrafında örgütlenen otoriter milliyetçiliktir. Parti rekabetini reddeder; toplumsal kesimlerin devlet gözetimindeki meslek örgütleri aracılığıyla temsilini savunur."
