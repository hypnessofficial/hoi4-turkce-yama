 WESTHEIA_FRA_1933_existing_naval_fittings:0 "Mevcut Fransız Donanma Donanımları"
 WESTHEIA_FRA_1933_existing_naval_fittings_desc:0 "1933 başında hizmetteki ve yapımı süren Fransız gemilerinde kullanılan gövdeler ile donanımlar."
 WESTHEIA_FRA_JOSEPH_PAUL_BONCOUR_1933:0 "Joseph Paul-Boncour"
 WESTHEIA_FRA_REPUBLICAN_SOCIALIST_PARTY_1933:0 "Cumhuriyetçi-Sosyalist Parti"
 WESTHEIA_FREE_CITY_RULE:0 "Özgür Şehir, iç yönetiminde ve ordusunda bağımsızdır; savaş ilan edemez, ittifak kuramaz veya kendi başına ittifaka katılamaz. Savaşa çağrılmayı reddedebilir."
 WESTHEIA_GDC33_CRUISERS_RETAIN_TT:0 "Haiqi ve Haichen filomuzda kalır."
 WESTHEIA_GDC33_CRUISERS_TRANSFER_TT:0 "§YHaiqi§! ve §YHaichen§! hafif kruvazörleri §Y[CHI.GetNameDef]§! ülkesine devredilir. §YZhaohe§! Guangdong’da kalır."
 WESTHEIA_GDC33_complete_xicun_power_station:0 "Xicun Elektrik Santralini Tamamla"
 WESTHEIA_GDC33_complete_xicun_power_station_desc:0 "Xicun’da inşa edilen elektrik santralini hizmete alacağız. Yeni üretim kapasitesi, Guangzhou’nun büyüyen fabrikalarının ve şehir halkının elektrik ihtiyacını karşılamaya yardımcı olacaktır."
 WESTHEIA_GDC33_develop_guangdong:0 "Guangdong İlini Geliştir"
 WESTHEIA_GDC33_develop_guangdong_desc:0 "Guangzhou çevresindeki sanayi ve ticaret birikimini yeni yatırımlarla güçlendireceğiz. Üretim tesislerinin genişletilmesi, eyaletin kalkınma programına daha sağlam bir temel sağlayacaktır."
 WESTHEIA_GDC33_three_year_programme:0 "Üç Yıllık Yönetim Programını Benimse"
 WESTHEIA_GDC33_three_year_programme_desc:0 "Eyaletin tarımını, sanayisini, eğitimini ve bayındırlık çalışmalarını ortak bir kalkınma programında birleştireceğiz. Yerel idarelerle eyalet işletmelerinin çalışmalarını eşgüdümleyerek Guangdong’un üretim gücünü artırmalıyız."
 WESTHEIA_GDC33_three_year_programme_idea:0 "Üç Yıllık Yönetim Programı"
 WESTHEIA_GDC33_three_year_programme_idea_desc:0 "Eyalet idaresi, sanayi işletmeleri ve yerel makamlar yatırımları ortak bir programla yürütmektedir. Kaynakların düzenli kullanılması, yeni inşaatların daha hızlı tamamlanmasını sağlamaktadır."
 WESTHEIA_GER33_consolidate_economic_recovery:0 "Ekonomik Toparlanmayı Sağlamlaştır"
 WESTHEIA_GER33_consolidate_economic_recovery_desc:0 "Yenilenen üretim tesislerini araştırma kuruluşlarıyla buluşturmalı, sanayinin kredi ve yatırım imkânlarını sağlamlaştırmalıyız. Böylece ekonomik bunalımın geride bıraktığı atıl kapasiteyi harekete geçirerek toparlanmanın ülke geneline yayılmasını sağlayabiliriz."
 WESTHEIA_GER33_mefo_debt_pressure_required_tt:0 "MEFO borçlarının finansman yükü artmaya başladı."
 WESTHEIA_GER33_mefo_growth_begins_tt:0 "MEFO tahvillerinin §Ytüketim malları faktörü§! her ay artmaya başlar."
 WESTHEIA_GER33_mefo_growth_paused_tt:0 "MEFO tahvillerinin tüketim malları yükü §Y1 Ocak 1936§! tarihine kadar aylık olarak artmaz."
 WESTHEIA_GER33_mefo_growth_schedule_tt:0 "MEFO tahvillerinin §Yaylık tüketim malları artışı§!, §Y1936§! yılında finansman yükü artmaya başladığında devreye girer."
 WESTHEIA_GER33_mefo_growth_standard_tt:0 "[GetCGLevelText]"
 WESTHEIA_GER33_price_controls_unlocked_tt:0 "§YFiyat Kontrollerini Kur§! odağının borç baskısı koşulu karşılanır."
 WESTHEIA_GER33_restore_conscription:0 "Genel Zorunlu Askerliği Geri Getir"
 WESTHEIA_GER33_restore_conscription_desc:0 "Reichswehr'in sınırlı gönüllü kadroları, büyütülmek istenen ordunun insan gücü ihtiyacını karşılayamıyor. Genel zorunlu askerliği yeniden yürürlüğe koyarak yeni birliklerin kurulmasını ve yedeklerin eğitimini sağlayacak daha geniş bir askerlik sistemine geçmeliyiz."
 WESTHEIA_GER_KURT_VON_SCHLEICHER_1933:0 "Kurt von Schleicher"
 WESTHEIA_GRE33_arrest_king_tt:0 "Kralın siyasi müdahalesi engellenir. Seçim krizinin sonunda cumhuriyetçi hükümet yolu açılır."
 WESTHEIA_GRE33_bilateral_trade:0 "Döviz Kısıtlamaları ve İkili Ticaret"
 WESTHEIA_GRE33_bilateral_trade_desc:0 "Döviz kıtlığı ve ithalat denetimleri, dış ticaretimizi ikili anlaşmalar üzerinden yürütmeye yöneltmektedir. Tarım ve maden ürünlerimizin satışı karşılığında sanayi mallarına erişim sağlamak ekonomiyi desteklerken, ticaret ortaklarımızla bağlarımızı da güçlendirmektedir."
 WESTHEIA_GRE33_destroyer_delivery_tt:0 "§YPsara§! ve §YSpetsai§! adlı iki §YHydra sınıfı muhrip§! donanmamıza katılır."
 WESTHEIA_GRE33_election_result_required_tt:0 "1936 seçim krizinin sonucu belirlenmiş olmalı."
 WESTHEIA_GRE33_leave_king_tt:0 "Kral serbest kalır. Seçim krizinin sonunda kralın hükümeti yolu açılır."
 WESTHEIA_GRE33_schachtplan_original:0 "Schachtplan"
 WESTHEIA_GRE33_schachtplan_original_desc:0 "Almanya ile ticaret düzeni, Yunan hammaddelerine erişim karşılığında ülkemize Alman pazarlarını ve sanayi mallarını açmaktadır. Sağladığı ekonomik olanaklar, Alman ekonomisine bağımlılığımızı da artırmaktadır."
 WESTHEIA_GXC33_imported_inventory_bba:0 "İthal Uçak Envanteri"
 WESTHEIA_GXC33_imported_inventory_bba_desc:0 "Yurt dışından alınan uçakların bakım ve envanter kayıtları."
 WESTHEIA_GXC33_imported_inventory_legacy:0 "İthal Uçak Envanteri"
 WESTHEIA_GXC33_imported_inventory_legacy_desc:0 "Yurt dışından alınan uçakların bakım ve envanter kayıtları."
 WESTHEIA_GXC_atlas_ii_inventory:0 "Armstrong Whitworth Atlas II"
 WESTHEIA_GXC_atlas_ii_inventory_desc:0 "Kara birliklerini desteklemek üzere kullanılan iki kişilik çift kanatlı uçak. Keşif ve hafif bombardıman görevleri için ithal edilmiştir."
 WESTHEIA_GXC_atlas_ii_inventory_legacy:0 "Armstrong Whitworth Atlas II"
 WESTHEIA_GXC_atlas_ii_inventory_legacy_desc:0 "Kara birliklerini desteklemek üzere kullanılan iki kişilik çift kanatlı uçak. Keşif ve hafif bombardıman görevleri için ithal edilmiştir."
 WESTHEIA_GXC_aw_16_inventory:0 "Armstrong Whitworth AW.16"
 WESTHEIA_GXC_aw_16_inventory_desc:0 "İngiltere’den ithal edilen tek motorlu çift kanatlı avcı uçağı. İki Vickers makineli tüfeğiyle hava savunması görevlerinde kullanılır."
 WESTHEIA_GXC_aw_16_inventory_legacy:0 "Armstrong Whitworth AW.16"
 WESTHEIA_GXC_aw_16_inventory_legacy_desc:0 "İngiltere’den ithal edilen tek motorlu çift kanatlı avcı uçağı. İki Vickers makineli tüfeğiyle hava savunması görevlerinde kullanılır."
 WESTHEIA_GXC_construction_programme:0 "Guangxi Kalkınma Programını Benimse"
 WESTHEIA_GXC_construction_programme_desc:0 "Eyaletin kalkınmasını siyasi, askerî, ekonomik ve kültürel çalışmaları bir araya getiren ortak bir programla sürdüreceğiz. Yerel idareyi güçlendirerek, halkın geçimini iyileştirerek ve kurumlarımızın çalışmalarını düzenleyerek Guangxi’nin geleceğini sağlam bir temele oturtmalıyız."
 WESTHEIA_GXC_develop_nanning:0 "Nanning İlini Geliştir"
 WESTHEIA_GXC_develop_nanning_desc:0 "Kalkınma programımızı hayata geçirmek için başkent çevresindeki üretim tesislerine yatırım yapmalıyız. Nanning’in sanayi tabanını genişletmek, eyalet idaresinin ve halkın ihtiyaçlarının daha düzenli karşılanmasını sağlayacaktır."
 WESTHEIA_HBC_coordinate_regional_development:0 "Bölgesel Kalkınmayı Eşgüdümle"
 WESTHEIA_HBC_coordinate_regional_development_desc:0 "Yerel idareler, üreticiler ve ulaşım işletmeleri arasında ortak bir çalışma düzeni kuracağız. Yol ve altyapı yatırımlarını bölgenin tarım, ticaret ve sanayi ihtiyaçlarına göre planlayarak kalkınma çalışmalarını hızlandırmalıyız."
 WESTHEIA_HBC_develop_province:0 "Hebei İlini Geliştir"
 WESTHEIA_HBC_develop_province_desc:0 "Beiping ve Tianjin çevresindeki üretim tesislerini, ticareti ve yerel işletmeleri destekleyeceğiz. Bölgesel kalkınma çalışmalarını yeni yatırımlarla birleştirmek, ekonomimizin üretim kapasitesini artıracaktır."
 WESTHEIA_HBC_regional_development:0 "Bölgesel Kalkınma Çalışmaları"
 WESTHEIA_HBC_regional_development_desc:0 "Yerel idareler ve işletmeler arasındaki eşgüdüm, yol ve altyapı çalışmalarında kaynakların daha düzenli kullanılmasını sağlamaktadır."
