 SPR33_military_consortium_desc:0 "Oviedo, Trubia ve Sevilla’daki tesislerin üretim kapasitesi güçlendirilmelidir."
 SPR33_mixed_juries:0 "Karma İşçi Jürilerini Destekle"
 SPR33_mixed_juries_desc:0 "İşçi ve işveren uyuşmazlıklarında arabuluculuğu güçlendirerek üretimi yeniden istikrara kavuşturmalıyız."
 SPR33_negotiate_ceda:0 "Anayasal Sağ ile Görüş"
 SPR33_negotiate_ceda_desc:0 "Parlamenter desteğin anayasal düzen içinde sürdürülmesi için CEDA ile somut yükümlülükler üzerinde görüşmeliyiz."
 SPR33_original_SPR_enlist_the_carabineros:0 "Karabineroları Askere Al"
 SPR33_original_SPR_enlist_the_carabineros_desc:0 "Cepheleri doldurmak için bir ara çözüm olarak alışılmadık çözümlere yönelmeliyiz. Ordu olmadan, paramiliter bir sınır muhafızı ve gümrük gücü olan Karabinerolar, siperleri doldurmak için herhangi bir kuvvet kadar iyi hizmet edecektir."
 SPR33_original_SPR_ensure_loyalty_desc:0 "Hükûmet, ordusu tarafından en acımasız şekilde ihanete uğradı. Bu yarayı onarmanın ilk adımı, bundan sonra atayacağımız tüm subayların sadakatini sağlamaktır."
 SPR33_original_SPR_expand_soviet_aid:0 "Sovyet Yardımını Genişlet"
 SPR33_original_SPR_expand_soviet_aid_desc:0 "Bu savaşı tek başımıza yönetemeyiz; uluslararası yardım almalıyız. [SOV.GetNameDefCap]'e, faşizme karşı kritik mücadelenin burada, İberya'da olduğu ve ilerlemelerinin burada durdurulması gerektiği anlatılmalıdır."
 SPR33_original_SPR_fortify_the_iron_ring_desc:0 "Bask Ülkesi'nin en büyük şehri olan Bilbao, kendi 'Demir Halkası' tahkimatlarına sahip olacak ve Basklara onu faşist düşmana karşı savunmak için zorlu bir engel sağlayacaktır."
 SPR33_original_SPR_new_leadership_desc:0 "Cumhuriyetin bu zorlu zamanlarda hayatta kalması için yeni bir liderliğe ihtiyaç var. Faşist tehditle en iyi nasıl mücadele edileceğine dair yeni bakış açılarına sahip danışmanlar ve bakanlar getireceğiz, bu da ilkelerimizi ve inançlarımızı daha iyi korumamızı sağlayacaktır."
 SPR33_original_SPR_no_pasaran_desc:0 "Anti-faşist inancı her şehirde, her evde yankılansın; her çatıdan her sokağa; her barikattan her hendeğe: \"¡Pasarán'a hayır!\" - Geçemeyecekler!"
 SPR33_original_SPR_relocate_the_gold_reserves:0 "Altın Rezervlerini Yer Değiştir"
 SPR33_original_SPR_relocate_the_gold_reserves_desc:0 "Altın rezervlerimiz yurtdışından savaş malzemeleri satın almada kilit rol oynuyor. Güvenli bir yerde saklandığından emin olmalıyız, bu da maalesef onu yurtdışına taşımayı gerektiriyor."
 SPR33_original_SPR_soviet_equipment_shipments:0 "Sovyet Teçhizat Sevkiyatları"
 SPR33_original_SPR_soviet_equipment_shipments_desc:0 "Yurtiçi sanayimizin sağlayamadığı, [SOV.GetNameDef]'den silah sevkiyatlarıyla telafi edilmelidir."
 SPR33_original_SPR_soviet_industrial_aid:0 "Sovyet Sanayi Yardımı"
 SPR33_original_SPR_soviet_industrial_aid_desc:0 "Sadece silah sevkiyatları, cephe birliklerimizin ihtiyaç duyduğu kotaları doldurmayacaktır. Yurtiçi sanayimizi genişletmedeki Sovyet yardımı, şimdilik bu farkı kapatmamıza ve hatta belki de sonunda tam kendi kendine yeterliliğe ulaşmamıza olanak tanıyabilir."
 SPR33_original_SPR_soviet_military_advisors:0 "Sovyet Askeri Danışmanları"
 SPR33_original_SPR_soviet_military_advisors_desc:0 "Sovyet askeri danışmanları, birliklerimize ve liderlerimize düşmanlarımıza karşı ihtiyaç duydukları avantajı sağlayabilir."
 SPR33_original_SPR_soviet_recovery_aid:0 "Sovyet Toparlanma Yardımı"
 SPR33_original_SPR_soviet_recovery_aid_desc:0 "Savaş kazanıldıktan sonra, [SOV.GetNameDef] yeniden inşa çabalarımızda bize yardımcı olmaya hazırdır."
 SPR33_original_SPR_soviet_technological_advancements:0 "Sovyet Teknolojik Gelişmeleri"
 SPR33_original_SPR_soviet_technological_advancements_desc:0 "[SOV.GetNameDefCap] bizim sahip olmadığımız teknolojiye sahip. Faşizmi yenme amacıyla, surely bu ilerlemeleri bizimle paylaşmaya istekli olurlar mı?"
 SPR33_original_SPR_strengthen_the_anti_fascist_coalition_desc:0 "Koalisyonumuzun muhalif kısımlarını ortadan kaldırdık - umarım bu şimdi nihayet faşizmi kökünden kazımadaki birleşik kararlılığımızı güçlendirmeye odaklanabileceğimiz anlamına gelir."
 SPR33_original_SPR_strengthen_the_euzko_gudarostea_desc:0 "Bask bölgesi hayati bir sanayiye sahiptir ve daha iyi savunulmalıdır. Yerel hükûmeti tarafından kurulan orduyu genişletmek, oradaki cephe hatlarını güçlendirmede büyük bir yol kat edecektir."
 SPR33_original_SPR_subvert_soviet_control:0 "Sovyet Kontrolünü Yık"
 SPR33_original_SPR_subvert_soviet_control_desc:0 "Zaferimizi mümkün kılan [SOV.GetAdjective] yardımının bedeli boyun eğmek oldu ve bu yüzden çilemiz henüz bitmemiş gibi görünüyor. Özgürlüğümüz ve bağımsızlığımız için son bir mücadeleye hazırlanmak üzere, [SOV.GetAdjective]'in ülkemiz üzerindeki komünist nüfuzu yayma çabalarını baltalamaya başlayacağız."
 SPR33_original_SPR_the_future_of_the_republic_desc:0 "Mevcut mücadelenin, Cumhuriyetin geleceği üzerindeki etkisi açısından şüphesiz belirleyici olduğu görülecektir. Bu geleceği uygun şekilde şekillendirmek için hiçbir çaba veya masraftan kaçınmamalıyız."
 SPR33_original_SPR_war_of_independence:0 "Bağımsızlık Savaşı"
 SPR33_original_SPR_war_of_independence_desc:0 "Birliğin bir başka üye devleti haline gelmemek için eski müttefiklerimize karşı dönme zamanı geldi. Halkımızdan hem sol hem de sağ otoriterlikten özgürlüğün nihai ödülünü elde etmek için son bir büyük çaba gerekmektedir."
 SPR33_pacify_catalonia:0 "Katalonya’da Denetimi Sağla"
 SPR33_pacify_catalonia_desc:0 "En az altı tümeni 180 gün bölgede tutarak merkezî otoriteyi yeniden kur."
 SPR33_peace_SPR_enlist_the_carabineros:0 "Karabinero Teşkilatını Güçlendir"
 SPR33_peace_SPR_enlist_the_carabineros_desc:0 "Sınır ve maliye muhafızlarının eğitimini geliştirerek Cumhuriyetin güvenlik teşkilatını düzenli orduyla daha iyi koordine edeceğiz."
 SPR33_peace_SPR_ensure_loyalty_desc:0 "Askerî komplonun dağıtılmasıyla başlayan reformlar, subay atamalarında ve terfilerinde de sürdürülmelidir. Ordunun ve güvenlik kuvvetlerinin anayasal hükûmete bağlılığını sağlamlaştırarak yeni müdahale girişimlerinin önüne geçeceğiz."
 SPR33_peace_SPR_expand_soviet_aid_desc:0 "[SOV.GetNameDef] ile işbirliği ve Cumhuriyetimizin çıkarları doğrultusunda bu programı uygulayacağız."
 SPR33_peace_SPR_fortify_the_iron_ring_desc:0 "Bilbao’nun çevresinde kalıcı savunma tesisleri kurarak ülkenin kuzeyini dış saldırılara karşı koruyacağız."
 SPR33_peace_SPR_new_leadership_desc:0 "Darbe tehlikesini aşan Cumhuriyet, uzlaşmayı kalıcı bir yönetim anlayışına dönüştürmelidir. Hükûmete yeni danışmanlar ve bakanlar kazandırarak anayasal kurumlara güveni yeniden tesis edeceğiz."
 SPR33_peace_SPR_no_pasaran_desc:0 "Cumhuriyeti korumayı başardık. Şimdi ülkenin şehirlerini ve stratejik merkezlerini dışarıdan gelebilecek saldırılara karşı tahkim etmeliyiz."
 SPR33_peace_SPR_relocate_the_gold_reserves:0 "Altın Rezervlerini Değerlendir"
 SPR33_peace_SPR_relocate_the_gold_reserves_desc:0 "Ulusal altın rezervlerinin bir bölümünü ekonomik toparlanmaya ayırabiliriz. Her harcama rezervlerin sağladığı mali güvenceyi azaltacaktır."
