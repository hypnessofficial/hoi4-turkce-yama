 GER_1933_great_depression:0 "Büyük Buhran ve Kitlesel İşsizlik"
 GER_1933_great_depression_desc:0 "Dünya ekonomik bunalımı Alman sanayisini derinden sarstı. Kapanan işletmeler, daralan dış ticaret ve kitlesel işsizlik, ülkenin üretim kapasitesinin önemli bir bölümünü atıl bıraktı. Ekonominin yeniden canlanması, istihdamın artırılmasını ve mali güvenin yeniden kurulmasını gerektiriyor."
 GER_1933_great_depression_recovering:0 "Büyük Buhrandan Toparlanma"
 GER_1933_great_depression_recovering_desc:0 "Sanayi siparişlerinin ve motorlu taşıt üretiminin genişlemesi, atıl tesisleri yeniden çalıştırıyor ve işsizliğin baskısını azaltıyor. Bununla birlikte, kredi darlığı ve ekonomik bunalımın yarattığı güvensizlik henüz tamamen giderilmiş değil. Kalıcı bir toparlanma için araştırma, üretim ve yatırımlar arasındaki bağları güçlendirmeliyiz."
