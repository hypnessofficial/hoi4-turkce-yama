 WESTHEIA_HUN_german_trade_negotiations:0 "Almanya ile Ticaret Görüşmeleri"
 WESTHEIA_HUN_german_trade_negotiations_desc:0 "Tarımsal ürünlerimiz için yeni pazarlar bulmalı ve sanayimizin ihtiyaç duyduğu ticari bağlantıları geliştirmeliyiz. Berlin ile görüşmeler ekonomik toparlanmaya katkı sağlayabilir; ancak Alman nüfuzunun artması iç siyasette yeni dengeler yaratacaktır."
 WESTHEIA_HUN_sign_the_rome_protocols:0 "Roma Protokollerini İmzala"
 WESTHEIA_HUN_sign_the_rome_protocols_desc:0 "İtalya ve Avusturya ile yakınlaşma, diplomatik yalnızlığımızı aşmamıza ve ekonomik ilişkilerimizi geliştirmemize yardımcı olabilir. Roma'daki görüşmeler, Orta Avrupa'da iş birliğine dayanan yeni bir düzenin önünü açacaktır."
