 WESTHEIA_IRQ_dh80_puss_moth_inventory:0 "de Havilland DH.80A Puss Moth"
 WESTHEIA_IRQ_dh80_puss_moth_inventory_desc:0 "İngiltere’den alınan askerî Puss Moth. Tek Gipsy III motoru, gözlem donanımı ve dört adet 20 librelik bomba için hafif askılar taşır. Sabit veya hareketli makineli tüfek eklenmemiştir. Kralın kişisel uçağı bu üç uçağa dahil değildir."
 WESTHEIA_IRQ_dh80_puss_moth_inventory_legacy:0 "de Havilland DH.80A Puss Moth"
 WESTHEIA_IRQ_dh80_puss_moth_inventory_legacy_desc:0 "İngiltere’den alınan askerî Puss Moth. Tek Gipsy III motoru, gözlem donanımı ve dört adet 20 librelik bomba için hafif askılar taşır. Sabit veya hareketli makineli tüfek eklenmemiştir. Kralın kişisel uçağı bu üç uçağa dahil değildir."
