 WESTHEIA_IRQ_national_defence_law:0 "Ulusal Savunma Yasasını Uygula"
 WESTHEIA_IRQ_national_defence_law_desc:0 "Gönüllü birliklerle sınırlı kalan ordumuzun personel ihtiyacını karşılamak için düzenli bir askerlik sistemi kurmalıyız. Ulusal Savunma Yasası, askerî hizmetin kapsamını genişletecektir."
 WESTHEIA_IRQ_petroleum_cooperation_faction:0 "Petrol İhracatçıları İş Birliği"
 WESTHEIA_ITA33_ETHIOPIAN_PREPARATIONS_TT:0 "§YEtiyopya Savaş Lojistiği§! odağı tamamlanmış olmalı."
 WESTHEIA_ITA33_ETHIOPIAN_WAR_STARTED_TT:0 "İtalya–Etiyopya Savaşı başlamış olmalı."
 WESTHEIA_ITA33_MUSSOLINI_POWER_BALANCE_TT:0 "Güç dengesi Mussolini tarafında en az §Y%50§! olmalı."
 WESTHEIA_ITA33_begin_ethiopian_campaign:0 "Etiyopya Seferini Başlat"
 WESTHEIA_ITA33_begin_ethiopian_campaign_desc:0 "Doğu Afrika’daki birliklerimizin ikmali ve sevkiyatı hazırdır. Eritre ve Somali üzerinden başlatılacak sefer, Etiyopya’nın işgalini ve bölgedeki İtalyan sömürgelerinin birleştirilmesini hedeflemektedir."
 WESTHEIA_ITA33_expand_bolzano_aluminium:0 "Bolzano Alüminyum Tesisini Genişlet"
 WESTHEIA_ITA33_expand_bolzano_aluminium_desc:0 "Bolzano’daki yeni sanayi bölgesini alüminyum üretimiyle büyüterek kuzeyin hidroelektrik kaynaklarını metalürji sanayisinin hizmetine sunacağız. Yeni tesisler, havacılık ve diğer sanayi kollarının hafif metal ihtiyacını karşılayacaktır."
 WESTHEIA_ITA33_found_iri:0 "IRI’yi Kur"
 WESTHEIA_ITA33_found_iri_desc:0 "Bankalarla sanayi şirketlerinin birbirine bağlanan borçlarını çözmek için Istituto per la Ricostruzione Industriale kurulacaktır. Stratejik işletmelerin yeniden yapılandırılması, yatırımların ve üretimin toparlanmasının önünü açacaktır."
 WESTHEIA_ITA33_industrial_banking_crisis:0 "Sanayi ve Bankacılık Krizi"
 WESTHEIA_ITA33_industrial_banking_crisis_desc:0 "Dünya ekonomik bunalımı, azalan dış ticaret ve bankaların sanayi şirketlerine bağladığı sermaye İtalyan ekonomisini ağır baskı altında bırakmıştır. Daralan kredi, yeni yatırımları yavaşlatırken hükümet bankaları ve stratejik işletmeleri ayakta tutacak bir yeniden yapılanma arayışındadır."
 WESTHEIA_ITA33_industrial_banking_crisis_recovering:0 "Sanayi ve Bankacılık Krizi"
 WESTHEIA_ITA33_industrial_banking_crisis_recovering_desc:0 "IRI’nin müdahalesi bankalarla sanayi kuruluşlarının çöküşünü önlemiş ve yatırımlar üzerindeki baskıyı hafifletmiştir. Buna rağmen daralan kredi ve zayıf iç talep, kapsamlı yatırımlar yapılıncaya kadar ekonominin toparlanmasını sınırlamaktadır."
 WESTHEIA_ITA_1933_argentine_submarine_order:0 "Arjantin Denizaltı Siparişinin Gelirleri"
 WESTHEIA_ITA_1933_argentine_submarine_order_desc:0 "Franco Tosi tersanesinde Arjantin için inşa edilen denizaltıların teslimatı, İtalyan ekonomisine gelir sağlıyor."
 WESTHEIA_ITA_1933_existing_naval_fittings:0 "Mevcut İtalyan Donanma Donanımları"
 WESTHEIA_ITA_1933_existing_naval_fittings_desc:0 "1933 başında hizmetteki ve yapımı süren İtalyan gemilerinde kullanılan gövdeler ile donanımlar."
 WESTHEIA_JAP33_aircraft_production:0 "Uçak Üretimini Genişlet"
 WESTHEIA_JAP33_aircraft_production_desc:0 "Ordu ve donanmanın yeni uçak siparişlerini karşılamak için mevcut imalatçıların üretim hatlarını genişleteceğiz."
 WESTHEIA_JAP33_approve_second_naval_program:0 "İkinci Donanma Takviye Programını Onayla"
 WESTHEIA_JAP33_approve_second_naval_program_desc:0 "İlk takviye programının gemileri hâlâ inşa edilirken donanma yeni bir sipariş dalgası için ödenek istiyor. İkinci program, tersanelerin kapasitesini ve üretim hızını artırarak antlaşma sınırları içinde filoyu büyütecek."
 WESTHEIA_JAP33_establish_showa_aircraft:0 "Shōwa Uçak Sanayisini Kur"
 WESTHEIA_JAP33_establish_showa_aircraft_desc:0 "Akishima’da kurulacak Shōwa Uçak Sanayisi, Japonya’nın nakliye ve yolcu uçağı üretimi için yeni bir imalatçı kazandıracak."
 WESTHEIA_JAP33_form_japan_iron_and_steel:0 "Japon Demir ve Çelik Şirketi’ni Kur"
 WESTHEIA_JAP33_form_japan_iron_and_steel_desc:0 "Devlete ait Yawata tesislerini altı özel üreticiyle birleştirerek demir ve çelik üretimini ortak bir şirket altında toplayacağız. Yeni şirket, Yawata’nın kapasitesini genişletmek için gereken sermayeyi bir araya getirecek."
 WESTHEIA_JAP33_kodoha_crisis_countdown:0 "26 Şubat Olayına Doğru"
 WESTHEIA_JAP33_kodoha_crisis_countdown_desc:0 "Ordudaki Kōdōha ile rakip subaylar arasındaki gerilim büyüyor. Hizipler arasındaki mücadele, 1936'da hükümeti sarsacak bir krize dönüşebilir."
 WESTHEIA_JAP33_peg_yen_to_sterling:0 "Japon Yenini Sterline Bağla"
 WESTHEIA_JAP33_peg_yen_to_sterling_desc:0 "Altın standardından ayrıldığımızdan beri yenin değeri düştü. Yokohama Specie Bank aracılığıyla döviz kurunu sterlin üzerinden belirleyerek ihracatçılar ve ithalatçılar için daha öngörülebilir bir kur sağlayabiliriz."
 WESTHEIA_JAP33_second_naval_program:0 "İkinci Donanma Takviye Programı"
 WESTHEIA_JAP33_second_naval_program_desc:0 "Yeni gemi siparişleri için ayrılan ödenek, tersanelerin iş gücünü ve malzeme akışını geçici olarak artırıyor."
 WESTHEIA_JAP33_showa_aircraft_concern:0 "Shōwa Uçak Sanayisi"
 WESTHEIA_JAP_1933_naval_fittings:0 "1933 Japon Donanma Donanımı"
 WESTHEIA_JAP_1933_naval_fittings_desc:0 "Japon donanmasının 1933 başında hizmetteki ve yapım aşamasındaki gemilerinde kullanılan gövde ve donanımlar."
