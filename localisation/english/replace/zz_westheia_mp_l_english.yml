 WESTHEIA_LAT_letov_16_inventory_short:0 "Letov Š-16L"
 WESTHEIA_LAT_pirat_inventory:0 "Svenska Aero SA-10 Pirat"
 WESTHEIA_LAT_pirat_inventory_desc:0 "1929’da İsveç’ten alınan tek SA-10 deniz keşif ve eğitim uçağı. Armstrong Siddeley Lynx motoru, gözlem donanımı ve şamandıralarıyla temsil edilir. Sonraki yerli kopyalar başlangıca eklenmemiştir."
 WESTHEIA_LAT_pirat_inventory_legacy:0 "Svenska Aero SA-10 Pirat"
 WESTHEIA_LAT_pirat_inventory_legacy_desc:0 "1929’da İsveç’ten alınan tek SA-10 deniz keşif ve eğitim uçağı. Armstrong Siddeley Lynx motoru, gözlem donanımı ve şamandıralarıyla temsil edilir. Sonraki yerli kopyalar başlangıca eklenmemiştir."
 WESTHEIA_LAT_pirat_inventory_legacy_short:0 "Svenska Aero SA-10 Pirat"
 WESTHEIA_LAT_pirat_inventory_registration:0 "Svenska Aero SA-10 Pirat Tasarımı"
