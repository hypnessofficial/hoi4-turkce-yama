 MONTREUX_WAR_CRISIS.1.a:0 "Bir Romanya zaferi."
 MONTREUX_WAR_CRISIS.1.d:0 "Romanya, kriz boyunca Besarabya'yı elinde tuttu. Sovyetler Birliği Romanya cephesinde kesin bir sonuç elde edemedi ve şartlarımızı kabul etmek zorunda."
 MONTREUX_WAR_CRISIS.1.t:0 "Besarabya Dayanıyor"
 MONTREUX_WAR_CRISIS.2.a:0 "Acı bir yenilgi."
 MONTREUX_WAR_CRISIS.2.d:0 "Besarabya ve Güney Besarabya Sovyet kontrolüne geçti. Savunma hattımızın kırılmasıyla birlikte bu bölgeleri Moskova'ya bırakmaktan başka seçeneğimiz kalmadı."
 MONTREUX_WAR_CRISIS.2.t:0 "Besarabya Düştü"
 MONTREUX_WAR_CRISIS.3.a:0 "Kabul edilemez bir gerileme."
 MONTREUX_WAR_CRISIS.3.d:0 "Türkiye, kriz boyunca Trabzon'u elinde tuttu. Taleplerimizi kabul ettirmeyi başaramadık ve Türk şartlarını kabul etmek zorundayız."
 MONTREUX_WAR_CRISIS.3.t:0 "Türkiye Cephesinde Başarısızlık"
 MONTREUX_WAR_CRISIS.4.a:0 "Bir Sovyet zaferi."
 MONTREUX_WAR_CRISIS.4.d:0 "Türk direnişi çöktü ve Trabzon artık kontrolümüz altında. Ankara, dayattığımız anlaşmayı kabul etmek zorunda kaldı."
 MONTREUX_WAR_CRISIS.4.t:0 "Türkiye Cephesinde Zafer"
 MONTREUX_WAR_CRISIS.5.a:0 "Ciddi bir gerileme."
 MONTREUX_WAR_CRISIS.5.d:0 "Romanya, kriz boyunca Besarabya'yı elinde tuttu. Taarruzumuz kesin bir sonuç elde etmeyi başaramadı."
 MONTREUX_WAR_CRISIS.5.t:0 "Romanya Cephesinde Başarısızlık"
 MONTREUX_WAR_CRISIS.6.a:0 "Sınır güvence altına alındı."
 MONTREUX_WAR_CRISIS.6.d:0 "Besarabya ve Güney Besarabya Sovyet kontrolüne geçti. Romanya, doğu sınırındaki yeni gerçeği kabul etmek zorunda kaldı."
 MONTREUX_WAR_CRISIS.6.t:0 "Romanya Cephesinde Zafer"
 NEP_1933_earthquake_relief_efforts:0 "Yardım Çabaları"
 NEP_1933_earthquake_relief_efforts_desc:0 "Büyük Nepal Depremi’nin ardından kurtarma, geçici barınma ve yeniden inşa çalışmalarına kaynak ayrılıyor. Yardım faaliyetleri, felaketin yarattığı toplumsal sarsıntıyı zamanla hafifletirken ülke ekonomisine ek yük getiriyor."
 NOR_1933_agrarian_populist:0 "Tarımcı Popülist"
 NOR_1933_agrarian_populist_desc:0 "Kırsal kesimin sesi olma iddiasıyla hareket eden Hundseid, ekonomik bunalım karşısında çiftçilerin çıkarlarını ve yerel kalkınmayı öne çıkarır. Parlamento siyasetindeki sert üslubuna rağmen ülkenin istikrarını korumayı amaçlar."
 NOR_1933_establish_nrk:0 "NRK'yı Kur"
 NOR_1933_establish_nrk_desc:0 "Bölgesel yayın kuruluşlarını ulusal bir çatı altında birleştirmeliyiz. Norsk rikskringkasting, haberlerin, eğitimin ve kültürün ülkemizin dört bir yanına ulaşmasını sağlayacak."
 NOR_1933_government_formed_tt:0 "§YNygaardsvold hükûmeti§! göreve başladı"
 NOR_1933_liberal_pacifist:0 "Liberal Pasifist"
 NOR_1933_liberal_pacifist_desc:0 "Mowinckel, Norveç’in güvenliğini silahlanmadan çok ticarette, diplomatik iş birliğinde ve barışçı bir dış politikada arar. Liberal kurumlara bağlılığı, askerî hazırlıkları geri planda bırakan bir yönetim anlayışıyla birleşir."
 NOR_1933_peg_krona_to_sterling:0 "Kronu Sterline Bağla"
 NOR_1933_peg_krona_to_sterling_desc:0 "Altın standardından ayrılmamızın ardından kronun değerine istikrar kazandırmalıyız. Sterlinle sabit bir kur ilişkisi kurmak, Britanya ile ticaretimizi kolaylaştıracak ve ekonomik toparlanmamız için daha öngörülebilir koşullar sağlayacaktır."
 NOR_1933_sterling_peg:0 "Sterline Bağlı Kron"
 NOR_1933_sterling_peg_desc:0 "Kronun sterline bağlanması, dış ticarette kur belirsizliğini azaltarak ekonomik toparlanmayı destekliyor."
 NOR_1933_sterling_relations:0 "Sterlin İş Birliği"
 NZL_1933_devalue_the_pound:0 "Pound’u Devalüe Et"
 NZL_1933_devalue_the_pound_desc:0 "Büyük Buhran, tarım ürünlerimizin dış pazarlardaki gelirini düşürdü. Yeni Zelanda poundunun sterlin karşısındaki değerini azaltarak çiftçilerimizin ihracat gelirlerini destekleyebiliriz. İthalatın pahalanması ve kararın yaratacağı siyasi huzursuzluk ise bu politikanın bedeli olacaktır."
 NZL_1933_devalued_pound:0 "Devalüe Edilmiş Pound"
 NZL_1933_devalued_pound_desc:0 "Poundun değerinin düşürülmesi ihracat gelirlerini desteklerken ithalatı pahalılaştırdı. Ekonomik canlanma umuduna, hükûmetin para politikasına yönelik tartışmalar eşlik ediyor."
 NZL_1933_establish_reserve_bank:0 "Merkez Bankasını Kur"
 NZL_1933_establish_reserve_bank_desc:0 "Para basımı ve kredi koşulları üzerinde daha tutarlı bir denetim kurmak için Yeni Zelanda Merkez Bankasını faaliyete geçirmeliyiz. Yeni kurum, ülkemizin para sistemini düzenleyerek ekonomik yönetimimize kalıcı bir dayanak sağlayacaktır."
 OCfA_RULE_BUFF:0 "Tabur Kapasitesi Altında Kalma Bonusu"
 OCfA_RULE_BUFF_OFF:0 "Devre Dışı"
 OCfA_RULE_BUFF_OFF_DESC:0 "Tabur Kapasitesi sistemi yalnızca bilgilendirici bir takip mekanizması olarak çalışır. Ordunun büyüklüğü ne olursa olsun hiçbir muharebe veya lojistik ceza uygulanmaz."
 OCfA_RULE_BUFF_ON:0 "Etkin"
 OCfA_RULE_BUFF_ON_DESC:0 "Tabur kapasitesinin aşılması Eğitim Süresi, Seferberlik Hızı, Ordu Morali ve Planlama Hızına önemli ölçekleme cezaları uygular."
 OCfA_RULE_MOBILIZATION:0 "Sanayi Seferberliği Orduyu Etkiler"
 OCfA_RULE_MOB_OFF:0 "Devre Dışı"
 OCfA_RULE_MOB_OFF_DESC:0 "Sanayi, mevcut ekonomik yasalarınız veya tüketim malı gereksinimleriniz ne olursa olsun tabur kapasiteniz için %100 lojistik destek sağlar."
 OCfA_RULE_MOB_ON:0 "Etkin"
 OCfA_RULE_MOB_ON_DESC:0 "Konuşlandırılmış tabur kapasitesi tüketim malı kullanımınıza bağlıdır. Sivil ekonomiler daha düşük kapasiteye sahip olurken, tam seferber edilmiş Savaş Ekonomisi tümenleriniz için azami desteği sağlar."
 OCfA_RULE_STRAIN:0 "Askerî-Sanayi Kompleksi Bakımı"
 OCfA_RULE_STRAIN_OFF:0 "Devre Dışı"
 OCfA_RULE_STRAIN_OFF_DESC:0 "Çok sayıda askerî fabrika temel bir idari yük oluşturmaz."
 OCfA_RULE_STRAIN_ON:0 "Etkin"
 OCfA_RULE_STRAIN_ON_DESC:0 "Devasa bir askerî-sanayi kompleksinin büyüklüğü azalan getirilerle karşılaşır. Toplam askerî fabrika sayınız arttıkça lojistik verimliliğiniz azalır."
 OCfA_RULE_WEIGHTING:0 "Tabur Ağırlıklandırması"
 OCfA_RULE_WEIGHT_OFF:0 "Standart (1 Tabur = 1 Kapasite)"
 OCfA_RULE_WEIGHT_OFF_DESC:0 "Türü veya ekipman maliyeti ne olursa olsun her tabur tam olarak 1 birim Konuşlandırılmış Kapasite tüketir."
 OCfA_RULE_WEIGHT_ON:0 "Ağırlıklı (Türe Göre)"
 OCfA_RULE_WEIGHT_ON_DESC:0 "Daha ağır taburlar daha fazla kapasite tüketir. Piyade: 1, Topçu/Motorize: 2, Zırhlı: 3+."
 OCfA_battalion_count:0 "[OCfA_battalion_count_loc]/[?OCfA_calculated_battalion_capacity|Y0]"
 OCfA_battalion_desc:0 "Ordunuzun konuşlandırma kapasitesi, ülkenizin nüfus tabanı ve sanayi üretimi tarafından desteklenir. Bu sınırın aşılması tümenleriniz üzerinde ciddi bir lojistik yük oluşturur.\n\n[OCfA_load_type_loc]: [OCfA_battalion_count_loc]/[?OCfA_calculated_battalion_capacity|Y0] \n\n§HNüfus Katkısı:§!\n Dominyonların nüfus ve eyaletleri üst ülkeye katkı sağlamaz.\n - §YÇekirdek Eyaletler:§! [?OCfA_count_core|Y]\n   ([?OCfA_pop_k_core|Y1]k Pop * [?OCfA_pop_core_weight_value|G2] Ağırlık) / [?OCfA_pop_divisor_value|0] = §G[?OCfA_core_pop|1]§!\n - §YÇekirdek Olmayan Eyaletler:§! [?OCfA_count_non_core|Y]\n   ([?OCfA_pop_k_non_core|Y1]k Pop * [?OCfA_pop_non_core_weight_value|G2] Ağırlık) / [?OCfA_pop_divisor_value|0] = §G[?OCfA_non_core_pop|1]§!\n - §Yİdari Büyüklük:§!\n   [?num_owned_states|Y] Sahip Olunan Eyaletler * [?OCfA_state_weight_value|G1] Ağırlık = §G[?OCfA_base_states|1]§!\n\n§HSanayi Katkısı:§!\n - Askerî Fabrikalar: §Y[?num_of_military_factories|0]§! * §G[?OCfA_mil_weight_value|1]§!\n - Sivil Fabrikalar: §Y[?num_of_civilian_factories|0]§! * §G[?OCfA_civ_weight_value|1]§!\n - Donanma Tersaneleri: §Y[?num_of_naval_factories|0]§! * §G[?OCfA_doc_weight_value|1]§!\n - Toplam Fabrika Ağırlığı: §Y[?OCfA_factory_points|1]§!\n - Sanayileşme Katsayısı: §Yx§![?OCfA_industry_factor|Y2]\n\n§HKüresel Çarpanlar:§![OCfA_is_major_loc][OCfA_has_war_loc][OCfA_battalion_limit_factory_bonus_loc][OCfA_battalion_limit_pop_bonus_loc][OCfA_battalion_limit_pop_core_bonus_loc][OCfA_battalion_limit_pop_non_core_bonus_loc]\n - Kapasite Desteği (minör/majör, nihai kapasiteye eklenir): §G[?OCfA_minor_capacity_bonus|0]§!\n - Sabit Kapasite Değiştiricisi: [?modifier@OCfA_battalion_limit_bonus|Y0]\n - İzin Verilen Minimum: [?OCfA_min_capacity_value|Y0]\n - İzin Verilen Maksimum: [?OCfA_max_capacity_value|Y0]\n\n[OCfA_mobilization_loc][OCfA_upkeep_loc]§HMevcut Değiştiriciler:§!\n [?OCfA_ttf_ocd_value_inversion|Y%1] Eğitim Süresi Katsayısı\n [?OCfA_moz_ocd_value|=%+1] Seferberlik Katsayısı\n [?OCfA_amf_ocd_value|=%+1] Ordu Morali Katsayısı\n [?OCfA_pls_ocd_value|=%+1] Planlama Hızı Katsayısı\n [?OCfA_supply_consumption_ocd_value|=%+1] İkmal Tüketimi Katsayısı\n [?OCfA_attrition_ocd_value|=%+1] Yıpranma Katsayısı\n [?OCfA_land_reinforce_ocd_value|=%+1] Takviye Hızı Katsayısı"
