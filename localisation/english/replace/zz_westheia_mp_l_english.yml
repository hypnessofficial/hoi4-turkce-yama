 AST_sufficient_funds_tt_2:0 "Yeterli Fon §GKazan§!"
 AUS_1933_authoritarian_conservative:0 "Otoriter Muhafazakar"
 AUS_1933_authoritarian_conservative_desc:0 "Dollfuss, Avusturya’nın istikrarını güçlü bir yürütme ve geleneksel kurumlar etrafında sağlamaya kararlıdır. Parlamenter uzlaşmaya duyduğu güvensizlik, onu siyasi otoriteyi kendi ellerinde toplamaya yöneltir."
 AUS_1933_dislikes_germany_flavor:0 "Almanya’yı Sevmez"
 AUS_1933_dislikes_germany_flavor_desc:0 "Berlin’in Avusturya üzerindeki nüfuz arayışına kuşkuyla yaklaşır; ülkesinin bağımsızlığını Alman baskısına karşı korumak ister."
 AUS_1933_likes_italy_flavor:0 "İtalya’yı Sever"
 AUS_1933_likes_italy_flavor_desc:0 "Roma’yla yakın ilişkileri, Avusturya’nın bağımsızlığını destekleyecek bir diplomatik dayanak olarak görür."
 AWARD_STATES:0 "§HEyaletleri Devret§!\n\nİşaretli eyaletleri bu ülkeye devret.\n\n"
 AWARD_STATES_DELAYED:0 "§RTüm sahip olunan eyaletler devredilemez!§!"
 AWARD_STATES_DELAYED_cannot_transfer:0 "Bir ülkenin bütün eyaletleri aynı anda devredilemez."
 AWARD_STATES_DELAYED_ok:0 "İşaretlenen eyaletleri bu ülkeye devret."
 BEL_1933_banking_reform:0 "Bankacılık Reformunu Uygula"
 BEL_1933_banking_reform_desc:0 "Bankaların mevduat toplama faaliyetleri ile sanayi şirketlerine yaptıkları yatırımlar arasındaki bağlar, mali sıkıntıların bütün ekonomiye yayılmasını kolaylaştırıyor. Bu faaliyetleri ayırıp bankacılık yapısını yeniden düzenleyerek tasarruf sahiplerinin güvenini güçlendirmeliyiz."
 BEL_1933_banking_regulations:0 "Bankacılık Düzenlemeleri"
 BEL_1933_banking_regulations_desc:0 "Bankacılık sisteminde yürürlüğe giren düzenlemeler, mali güvenin yeniden kurulmasına ve kaynakların ekonomik faaliyetlere yönelmesine yardımcı oluyor."
 BEL_1933_devalue_the_franc:0 "Frankı Devalüe Et"
 BEL_1933_devalue_the_franc_desc:0 "Altın paritesini korumak için uygulanan deflasyon politikası, sanayimizin dış pazarlardaki rekabet gücünü geri getirmekte yetersiz kaldı. Frangın değerini düşürerek ihracat üzerindeki baskıyı hafifletmeli ve üretimin yeniden canlanmasını sağlamalıyız."
 BONUS_PRODUCTION_POWER_DRAW_FACTOR:0 "Üretimin enerji tüketimi"
 BRA_1933_agricultural_debt_relief:0 "Tarımsal Borçların Yeniden Yapılandırılması"
 BRA_1933_agricultural_debt_relief_desc:0 "Devletin desteklediği borç düzenlemesi, üreticilerin üzerindeki baskıyı hafifletiyor. Alacaklıların zararlarının karşılanması ekonomik kaynakların bir bölümünü tüketse de toparlanan kırsal talep ve kredi imkânları inşaat yatırımlarını destekliyor."
 BRA_1933_itajuba_infantry_bonus:0 "Itajubá Silah Fabrikası"
 BRA_1933_restructure_farmers_debts:0 "Çiftçi Borçlarını Yeniden Yapılandır"
 BRA_1933_restructure_farmers_debts_desc:0 "Tarımsal fiyatların düşüşü, üreticileri ödeyemedikleri borçlarla baş başa bıraktı. Borçların bir kısmının azaltılması ve alacaklıların devlet tahvilleriyle desteklenmesi, kırsal ekonomiye yeniden hareket kazandırabilir. Bu düzenleme kamu kaynaklarına yük getirirken yeni yatırımların önünü açacaktır."
 BUILDING_ENERGY_COST_T:0 "§TEnerji maliyeti: §!"
 BUILDING_ENERGY_GENERATION_POWER_PLANT:0 "$VALUE|H1$ §T+ doğal devlet kaynakları§!"
 BUILDING_ENERGY_GENERATION_T:0 "§TEnerji üretimi: §!"
 BUL_1933_break_zveno_influence:0 "Ordu İçindeki Zveno Etkisini Kır"
 BUL_1933_break_zveno_influence_desc:0 "Sadık subayların desteğiyle Zveno önderliğinin ordu üzerindeki denetimini aşındırabiliriz. Komuta kademesindeki tereddütlü isimleri saraya yaklaştırmak, hükûmetin askerî dayanağını daraltacaktır."
 BUL_1933_dismiss_zveno_government:0 "Zveno Hükûmetini Görevden Al"
 BUL_1933_dismiss_zveno_government_desc:0 "Ordu içindeki denge artık saray lehine dönmüş durumda. Hazırlanan desteği kullanarak Zveno hükûmetini çekilmeye zorlamanın ve bakanlar kurulunu yeniden kralın iradesine bağlamanın zamanı geldi."
 BUL_1933_organize_loyal_officers:0 "Saraya Sadık Subayları Örgütle"
 BUL_1933_organize_loyal_officers_desc:0 "Askerî Birlik'in bütün mensupları Zveno'nun sarayı geri plana itme niyetini paylaşmıyor. Krala bağlı subaylarla gizli temaslar kurarak garnizonlarda güvenilir bir destek ağı oluşturmalıyız."
 BUL_1933_royal_countercoup:0 "Sarayın İktidar Mücadelesi"
 BUL_1933_royal_countercoup_desc:0 "Zveno'nun askerî yönetimi, tacın hükûmet üzerindeki etkisini daraltıyor. Kral III. Boris, ordu içindeki ayrılıkları kullanarak ve saraya bağlı çevreleri bir araya getirerek yeniden söz sahibi olabilir. Önce güvenilir subaylarla bağlar kurulmalı, ardından Zveno'nun dayanakları zayıflatılarak hükûmeti değiştirecek siyasi zemin hazırlanmalıdır."
 BUL_1933_win_opposition_support:0 "Siyasi Muhalefetin Desteğini Kazan"
 BUL_1933_win_opposition_support_desc:0 "Partilerin yasaklanması, eski siyasi çevreleri yönetimin dışında bıraktı. Bu grupların bütün taleplerini benimsemeksizin Zveno'ya karşı desteğini kazanabilir, hükûmet değişikliğine yönelik direnci azaltabiliriz."
 BUL_1933_zveno_army_regime:0 "Zveno Ordu Rejimi"
 BUL_1933_zveno_army_regime_desc:0 "Zveno hareketinin ordu desteğiyle iktidarı ele geçirmesinin ardından parlamento feshedilmiş, siyasi partiler yasaklanmış ve yönetim askerî otoritenin kontrolüne geçmiştir. Yeni hükûmet merkezî otoriteyi güçlendirmeye çalışırken siyasi baskılar ve toplumsal huzursuzluk artmaktadır."
 BUL_acquire_modern_tools_desc_BUL33:0 "Yeni makineler ve daha verimli üretim yöntemleri, daralan piyasalara rağmen işletmelerimizin ayakta kalmasını sağlayacaktır. Tarım ve sanayi arasındaki tedarik bağlarını güçlendirerek ekonomik krizin yatırımlar üzerindeki baskısını hafifleteceğiz."
 BUL_acquire_modern_tools_desc_BUL33_fallback:0 "Bulgar sanayisi temel olarak eski moda, küçük ölçekli imalat ve el sanatlarından oluşmaktadır. Modern bir sanayinin temellerini kurmak ve geliştirmek için uygun araçlara ihtiyacımız var."
 BUL_attract_foreign_capitals_desc_BUL33:0 "Döviz sıkıntısı ve daralan iç piyasa, ekonomik toparlanma için yeni kaynaklar bulmamızı zorunlu kılıyor. Yabancı yatırımcılarla işbirliği yaparak üretim tesislerini genişletecek ve krizin üretim ile tüketim üzerindeki yükünü geride bırakacağız."
 BUL_attract_foreign_capitals_desc_BUL33_fallback:0 "Kendi başımıza güçlü ve verimli bir sanayi kurma imkanımız yok, bu yüzden en iyi seçeneğimiz, işlerini genişletmeye ve Bulgaristan'da faaliyet göstermeye istekli yabancı yatırımcılara başvurmaktır."
 BUL_darzhavna_samoletna_fabrika_desc_BUL33:0 "Loveç’te modern bir Devlet Uçak Fabrikası kurmak için gerekli planlama ve tesis yatırımlarını başlatacağız. Geniş üretim alanları, eğitimli işgücü ve yeni tezgâhlar, mevcut atölyelerimizin imkânlarını aşan uçak üretim çalışmalarına zemin hazırlayacaktır."
 BUL_darzhavna_samoletna_fabrika_desc_BUL33_fallback:0 "Bozhurishte'deki DAR tesisleri zaten hava kuvvetlerimizi beslemek için Bulgar avcı uçakları üretiyor. Şimdi, diğer hafif uçakların üretimine odaklanacak modern tesislere sahip Lovech'te bir Devlet Uçak Fabrikası'nın kurulmasına yatırım yapabiliriz."
 BUL_darzhavna_voenna_fabrika_BUL33:0 "Kazanlık Devlet Askerî Fabrikasını Genişlet"
 BUL_darzhavna_voenna_fabrika_BUL33_fallback:0 "Darzhavna Voenna Fabrika"
 BUL_darzhavna_voenna_fabrika_desc_BUL33:0 "1924’ten beri Kazanlık’ta faaliyet gösteren Devlet Askerî Fabrikası, ordumuzun silah ve mühimmat tedarikindeki başlıca dayanaklarından biridir. Mevcut atölyeleri ve üretim hatlarını genişleterek tüfek, mühimmat, destek malzemesi ve onarım kapasitesini artıracağız."
 BUL_darzhavna_voenna_fabrika_desc_BUL33_fallback:0 "Ordumuzu yüksek kaliteli teçhizatla donatabilecek uygun bir ulusal askeri sanayinin temellerini atmak için Kazanlak'taki Devlet Askeri Fabrikası'nı genişletebiliriz."
 BUL_found_dvf_sopot_desc_BUL33:0 "1935’te alınan kararın ardından Sopot’ta yeni bir askerî mühimmat fabrikasının inşasına başlayacağız. 9 Haziran 1936’da temeli atılan tesisin tamamlanması ve gerekli makinelerin sağlanması, topçu mühimmatında yerli üretim kapasitesini genişletecektir."
 BUL_found_dvf_sopot_desc_BUL33_fallback:0 "Sopot'taki mühimmat fabrikasının inşası 1935'te başladı, ancak henüz bitmedi. Kompleksi en kısa sürede faaliyete geçirmek için kalan makine ve teçhizatın alınması için bir anlaşma yapmalıyız."
 BUL_georgi_benkovski_aircraft_repair_facilities_BUL33:0 "Havacılık Bakım Atölyelerini Genişlet"
 BUL_georgi_benkovski_aircraft_repair_facilities_BUL33_fallback:0 "Georgi Benkovski Uçak Onarım Tesisleri"
 BUL_georgi_benkovski_aircraft_repair_facilities_desc_BUL33:0 "Havacılığımızın eğitim ve teknik birikimini koruyabilmek için mevcut uçak bakım atölyelerini geliştireceğiz. Gövde onarımı, motor bakımı ve yedek parça imalatına yapılacak yatırımlar, kullanılabilir uçakların hizmette tutulmasını ve teknik personelin yetiştirilmesini sağlayacaktır."
 BUL_georgi_benkovski_aircraft_repair_facilities_desc_BUL33_fallback:0 "Ulusal bir hava kuvveti inşa etmek için, uçak gövdesi onarım hangarlarının ve motor test tesislerinin inşası gereklidir. Bu bağlamda, Plovdiv'de Terem Georgi Benkovski uçak onarım tesisini kurmak için ilginç bir proje sunuldu."
 BUL_invigorate_national_industry_desc_BUL33:0 "Yerel girişimcileri ve ulusal üretim kuruluşlarını destekleyerek ekonomik toparlanmayı kendi kaynaklarımız üzerine kuracağız. Yeni yatırımların ve tarımsal ticaretin canlanması, krizin halkımız ve sanayimiz üzerindeki baskısını azaltacaktır."
 BUL_invigorate_national_industry_desc_BUL33_fallback:0 "Altyapımızı, sanayimizi ve tarımımızı geliştirmek için çok uzun süredir yabancı sermayeye güveniyoruz. Eğer kendi kendine yeterlilik ve ülkemizi kendi bildiğimiz gibi geliştirme özgürlüğü istiyorsak, ulusal sanayiye ve yeni tesislerin geliştirilmesine yatırım yaparak başlamalıyız.\nKolay bir iş olmayacak, ama uzun vadede kesinlikle çabaya değecektir."
 BUL_kaproni_bulgarski_BUL33:0 "Kazanlık Uçak Atölyelerini Genişlet"
 BUL_kaproni_bulgarski_BUL33_fallback:0 "Kaproni Bulgarski"
 BUL_kaproni_bulgarski_desc_BUL33:0 "Kazanlık’taki Caproni Bulgarski tesisleri, eğitim uçaklarının üretimi ve teknik personelin yetiştirilmesi için mevcut bir dayanak oluşturuyor. Atölyeleri genişleterek hafif uçak üretimini geliştirecek ve kara birliklerini destekleyebilecek yerli tasarımlar üzerinde çalışacağız."
 BUL_kaproni_bulgarski_desc_BUL33_fallback:0 "İtalyan uçak yapım şirketi Caproni şu anda iflasla karşı karşıya, diğer üretim zincirlerine yönlendirilen kaynak eksikliğini aşmak için mücadele ediyor. Bu, Kazanlak'taki endüstriyel kompleksi olan ve orta ve ağır bombardıman uçaklarının üretimine odaklanabileceğimiz Kaproni Bulgarski'yi satın alma olasılığını bize açıyor."
 BUL_national_railway_lines_BUL33:0 "Ulusal Demiryollarını Modernleştir"
 BUL_national_railway_lines_BUL33_fallback:0 "Ulusal Demiryolu Hatları"
 BUL_national_railway_lines_desc_BUL33:0 "Mevcut ana demiryolu güzergâhlarımızın taşıma kapasitesini ve güvenilirliğini artıracağız. İstasyonların, hatların ve yük taşımacılığının geliştirilmesi, ürünlerimizin pazarlara ve askerî ikmalin garnizonlara daha düzenli ulaşmasını sağlayacaktır."
 BUL_national_railway_lines_desc_BUL33_fallback:0 "Sadece birliklerimizi değil, aynı zamanda ikmal malzemelerimizi de ülke çapında taşımak için hızlı ve güvenilir yollara ihtiyacımız var. Demiryolu hatlarımızı genişletmek lojistik yeteneklerimizi geliştirecektir."
 BUL_reorganize_the_military_industry_desc_BUL33:0 "Silahlanma kısıtlamaları sürerken dahi mevcut askerî atölyelerimizin üretim ve bakım düzenini geliştirebiliriz. Tezgâhların, işbölümünün ve teknik eğitimin modernleştirilmesi, diplomatik sınırlamaların kaldırılmasından ayrı bir hazırlık çalışması olarak yürütülecektir."
 BUL_reorganize_the_military_industry_desc_BUL33_fallback:0 "Askeri sanayimiz modası geçmiş ve verimsizdir, şu anda köhne olan teçhizatı üretmek üzere tasarlanmıştır. Çok geç olmadan bir modernizasyon programı yürütmeliyiz."
 BUL_steel_plant_in_pernik_BUL33:0 "Pernik Metal İşleme Tesislerini Genişlet"
 BUL_steel_plant_in_pernik_BUL33_fallback:0 "Pernik'teki Çelik Fabrikası"
 BUL_steel_plant_in_pernik_desc_BUL33:0 "Pernik havzasındaki kömür üretimi ve mevcut metal işleme imkânları, ülkemizin sanayi gelişimi için önemli bir dayanak oluşturuyor. Haddeleme, onarım ve metal işleme kapasitesini genişleterek demiryollarının, atölyelerin ve ordunun malzeme ihtiyaçlarını daha fazla yerli üretimle karşılayacağız."
 BUL_steel_plant_in_pernik_desc_BUL33_fallback:0 "Bulgaristan, kaynaklar açısından Balkanların en zengin ülkesi değildir ve bu yüzden toprağımızın sakladığı hazinelerden en iyi şekilde yararlanmalıyız. Pernik'teki demir tesislerimizi ve kömür çıkarma tesislerimizi iyileştirmeli ve ilk çelik üretim tesisimizi orada inşa etmeliyiz."
 BUL_vasil_levsky_national_military_university_BUL33:0 "Sofya Askerî Okulunu Genişlet"
 BUL_vasil_levsky_national_military_university_BUL33_fallback:0 "Vasil Levski Ulusal Askeri Üniversitesi"
 BUL_vasil_levsky_national_military_university_desc_BUL33:0 "Sofya’daki Askerî Okulun eğitim tesislerini ve öğretim kadrosunu güçlendireceğiz. Modern silahların kullanımı, birlik idaresi ve teknik eğitim alanlarında yetiştirilecek subaylar, ordumuzun yeniden düzenlenmesine katkıda bulunacaktır."
 BUL_vasil_levsky_national_military_university_desc_BUL33_fallback:0 "Ulusal Askeri Üniversitesi'nin uzun bir tarihi var, ancak askeri eğitimi Neuilly Antlaşması'nın dayatılmasından bu yana büyük ölçüde azaldı. Tesislerini genişletmek ve sonunda başarılı subaylar olacak yeni Harbiyelilerin kaydını teşvik etmek için bir proje finanse etme zamanı geldi."
 CANCEL_TRADE_DEAL_ACTION_DESC:0 "Bu ülkeyle mevcut ticaret anlaşmamızı sona erdirin."
 CANCEL_TRADE_DEAL_SEND_DESC:0 "Bu ülkeyle mevcut ticaret anlaşmamızı sona erdirin."
