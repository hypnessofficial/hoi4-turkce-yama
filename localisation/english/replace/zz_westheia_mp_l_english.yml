 WESTHEIA_TUR33_balkan_pact:0 "Balkan Paktı’nı İmzala"
 WESTHEIA_TUR33_balkan_pact_desc:0 "Türkiye, Yunanistan, Yugoslavya ve Romanya arasında bölgesel güvenliğe yönelik bir anlaşma için görüşmeleri başlatacağız. Her devletin kabulüne bağlı bu girişim, sınırların korunmasına ve Balkanlarda barışın güçlendirilmesine hizmet edecektir."
 WESTHEIA_TUR33_first_industrial_plan:0 "Birinci Beş Yıllık Sanayi Planını Uygula"
 WESTHEIA_TUR33_first_industrial_plan_bonus:0 "Birinci Beş Yıllık Sanayi Planı"
 WESTHEIA_TUR33_first_industrial_plan_desc:0 "Yerli ham maddelerimizi işleyecek tesislere öncelik vererek temel sanayi ürünlerinde dışa bağımlılığımızı azaltacağız. Sümerbank’ın öncülüğünde yürütülecek yatırımlar, dokuma, kâğıt, kimya ve ağır sanayinin gelişmesini sağlayacaktır."
 WESTHEIA_TUR33_greek_friendship:0 "Türk–Yunan Dostluğunu Pekiştir"
 WESTHEIA_TUR33_greek_friendship_desc:0 "Ege’nin iki kıyısında güven ve iş birliğini geliştirmek için Yunanistan ile saldırmazlık ve dostluk ilişkilerimizi kuvvetlendireceğiz. Bu yakınlaşma, Balkanlarda daha geniş bir güvenlik anlayışının temelini oluşturabilir."
 WESTHEIA_TUR33_gur_submarine:0 "Gür Denizaltısını Satın Al"
 WESTHEIA_TUR33_gur_submarine_desc:0 "Denizaltı filomuzu güçlendirmek için yurtdışından yeni bir gemi alacağız. Gür’ün teslim alınması, denizaltıcı personelimizin modern sistemler üzerindeki tecrübesini ve filomuzun harekât imkânlarını artıracaktır."
 WESTHEIA_TUR33_hatay_accession:0 "Hatay’ın Türkiye’ye Katılımını Sağla"
 WESTHEIA_TUR33_hatay_accession_desc:0 "Hatay meselesini sonuçlandırmak üzere bölgenin Türkiye’ye katılımını görüşeceğiz. Diplomatik teklifimize verilecek cevap, katılımın anlaşma yoluyla gerçekleşmesini veya yeni bir uyuşmazlığın doğmasını belirleyecektir."
 WESTHEIA_TUR33_imported_inventory_bba:0 "İthal Uçak Envanteri"
 WESTHEIA_TUR33_imported_inventory_bba_desc:0 "Hava kuvvetlerinde kullanılan ithal uçaklar."
 WESTHEIA_TUR33_imported_inventory_legacy:0 "İthal Uçak Envanteri"
 WESTHEIA_TUR33_imported_inventory_legacy_desc:0 "Hava kuvvetlerinde kullanılan ithal uçaklar."
 WESTHEIA_TUR33_izmit_paper:0 "İzmit Kağıt Fabrikasını Aç"
 WESTHEIA_TUR33_izmit_paper_desc:0 "Kâğıt ihtiyacımızı yurtiçinde karşılamak için İzmit’teki tesisi işletmeye alacağız. Eğitim kurumlarının, yayıncılığın ve kamu idaresinin ihtiyaç duyduğu kâğıdın yerli üretimi, sanayi programımızın önemli bir adımıdır."
 WESTHEIA_TUR33_karabuk:0 "Karabük Demir Çelik Tesislerini İşletmeye Al"
 WESTHEIA_TUR33_karabuk_desc:0 "Karabük’te kurulan bütünleşmiş tesisleri üretime geçirerek ağır sanayimizin ihtiyaç duyduğu demir ve çeliğin yurtiçinde sağlanmasını geliştireceğiz. Enerji tesisi ve yüksek fırınların işletmeye alınması, daha geniş bir sanayi altyapısının kurulmasına hizmet edecektir."
 WESTHEIA_TUR33_kayseri_textile:0 "Kayseri Bez Fabrikasını Aç"
 WESTHEIA_TUR33_kayseri_textile_desc:0 "Kayseri’de kurulan modern dokuma tesisini işletmeye alarak pamuklu kumaş üretimini artıracağız. Fabrika, ithalat ihtiyacımızı azaltırken İç Anadolu’da sanayi işçiliğinin ve teknik bilginin gelişmesini sağlayacaktır."
 WESTHEIA_TUR33_literacy_campaign:0 "Süren Okuryazarlık Seferberliği"
 WESTHEIA_TUR33_literacy_campaign_desc:0 "Millet Mektepleri ve gezici öğretmenler sayesinde okuma yazma öğretimi daha geniş kesimlere ulaşmaktadır. Buna rağmen okul, öğretmen ve yetişmiş insan gücü eksikliği devam etmekte; eğitimdeki ilerlemenin kalıcı sonuçlar vermesi zaman almaktadır."
 WESTHEIA_TUR33_mta_etibank:0 "MTA ve Etibank’ı Kur"
 WESTHEIA_TUR33_mta_etibank_bonus:0 "Maden ve Sanayi Araştırmaları"
 WESTHEIA_TUR33_mta_etibank_desc:0 "Maden yataklarımızı araştıracak bilimsel bir kurum ile işletilebilir kaynakları değerlendirecek bir finans ve sanayi kuruluşuna ihtiyacımız var. Maden Tetkik ve Arama Enstitüsü ve Etibank, araştırma ile yatırımı ortak bir kalkınma programında buluşturacaktır."
 WESTHEIA_TUR33_republic_economy:0 "Cumhuriyet Ekonomisini Güçlendir"
 WESTHEIA_TUR33_republic_economy_desc:0 "Cumhuriyetin ikinci on yılına girerken mali dengemizi sağlamlaştırmalı, üretim gücümüzü artırmalı ve kalkınmanın önündeki engelleri kaldırmalıyız. Devlet kurumları ile özel girişimin imkânlarını ülkemizin gelişmesi için seferber edeceğiz."
 WESTHEIA_TUR33_southampton_inventory_bba:0 "İthal Uçak Envanteri"
