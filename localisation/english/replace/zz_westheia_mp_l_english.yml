 MAN_maintain_eastern_control_desc:0 "Bölgede kalıcı kontrol sağlamak, geçici bir askerî harekâttan fazlasını gerektiriyor. Birliklerimizi burada tutarak ulaşım hatlarını ve yerleşimleri güvence altına almalıyız.\n\n§Y$STATE_717$§! bölgesinde en az §Y6 tümeni§! kesintisiz §Y180 gün§! bulundur. Tümen sayısı 6’nın altına düşerse görev iptal olur ve yeniden başlatılması gerekir."
 MAN_maintain_northern_control_desc:0 "Bölgede kalıcı kontrol sağlamak, geçici bir askerî harekâttan fazlasını gerektiriyor. Birliklerimizi burada tutarak ulaşım hatlarını ve yerleşimleri güvence altına almalıyız.\n\n§Y$STATE_714$§! bölgesinde en az §Y6 tümeni§! kesintisiz §Y180 gün§! bulundur. Tümen sayısı 6’nın altına düşerse görev iptal olur ve yeniden başlatılması gerekir."
