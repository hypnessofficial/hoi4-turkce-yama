 WESTHEIA_XIC33_develop_capital:0 "Yerel Üretimi Geliştir"
 WESTHEIA_XIC33_develop_capital_desc:0 "İdaremiz altındaki üretim ve ticaret faaliyetlerini destekleyeceğiz. Yerel işletmelerin büyümesi, ordumuzun ve sivil halkın ihtiyaçlarının karşılanmasına katkıda bulunacaktır."
 WESTHEIA_XIC33_exiled_cadres_idea:0 "Örgütlenen Kuzeydoğu Kadroları"
 WESTHEIA_XIC33_exiled_cadres_idea_desc:0 "Kuzeydoğudan gelen uzmanların ortak çalışması, yeni yatırımların planlanmasını ve inşaat işlerinin yürütülmesini kolaylaştırmaktadır."
