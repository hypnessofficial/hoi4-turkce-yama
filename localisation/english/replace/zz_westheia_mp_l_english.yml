 SPR33_peace_SPR_strengthen_the_anti_fascist_coalition_desc:0 "Cumhuriyetçi partiler, sendikalar ve demokratik kuruluşlar arasındaki işbirliği, anayasal düzeni korumanın temelidir. Aralarındaki anlaşmazlıkları meclis zemininde çözerek otoriter hareketler karşısında ortak bir siyasi cephe oluşturacağız."
 SPR33_peace_SPR_strengthen_the_euzko_gudarostea_desc:0 "Bask bölgesindeki ekonomik yatırımlar, uzlaşmayla korunan Cumhuriyetin sivil üretim kapasitesini artıracaktır."
