 gomer_advisor_effects:0 "Gömer"
 gomer_advisor_grouped_tt:0 "§YDiplomat kılığında bir general§!\n  Savaş gerekçesi oluşturma süresi: §G-33,3%§!\n  Askerî fabrika inşaat hızı: §G+40%§!\n  Ticaret anlaşması görüş etkisi: §R-40%§!\n\n§Yİstikrar sağlayıcı§!\n  İstikrar: §R-35%§!\n  Direniş hedefi: §R+5%§!\n\n§YDışişleri uzmanı§!\n  Faşist diplomasi kabulü: §R-30§!\n  Komünist diplomasi kabulü: §R-30§!\n  Demokratik diplomasi kabulü: §R-30§!\n  Tarafsız diplomasi kabulü: §R-30§!\n\n§YEn iyi savunma saldırmaktır§!\n  Tümen saldırısı: §G+10%§!\n  Tümen savunması: §R-10%§!"
 gomer_advisor_profile:0 "Ne yanlış gidebilir ki ?"
 gomer_advisor_profile_desc:0 "Gömer’in danışmanlık özellikleri."
 gomer_berlin_losses_tt:0 "Gömer öldü ve danışmanlık etkileri kaldırıldı.\nBerlin/Brandenburg nüfusu: §R-69§!\nBölgede varsa bir sivil fabrika yıkıldı."
 gomer_best_defence_is_to_attack:0 "En iyi savunma saldırmaktır"
 gomer_best_defence_is_to_attack_desc:0 "Gömer için savunma hattı, bir sonraki taarruzun başlangıç noktasıdır. Bu doktrin, Alman tümenlerine savaştıkları her cephede eşlik eder."
 gomer_coup_damage_tt:0 "Berlin/Brandenburg nüfusu: §R-10.000§!\nMünih/Yukarı Bavyera nüfusu: §R-10.000§!\nUygun on fabrikaya %30 oranında onarılabilir hasar verilir."
 gomer_crisis_category:0 "Gömer krizi"
 gomer_crisis_category_desc:0 "Hükûmet içindeki anlaşmazlık artık açık bir iktidar mücadelesine dönüştü. Gömer’in Oster ve Abwehr içindeki muhalif subaylarla olan bağlantıları açığa çıkarken, yıllardır tasarlanan bir askerî müdahalenin nihayet uygulanabileceği konuşuluyor."
 gomer_crisis_choice_available_tt:0 "Görüşmeler sürüyor; Gömer hâlâ faşist Almanya’nın danışmanı."
 gomer_crisis_deadline:0 "Karar vermek için otuz gün"
 gomer_crisis_deadline_desc:0 "Oster çevresindeki subaylar harekete geçmek için yalnızca uygun emri bekliyor. Kabinenin önünde iki seçenek var: Gömer’i ve arkasındaki ağı tasfiye etmek ya da komploculara hükûmeti ele geçirme izni vermek."
 gomer_crisis_open_tt:0 "Oster çevresindeki komplocular harekete geçmeye hazırlanır. Kararlar menüsünde otuz günlük görüşme süresi ve iki seçenek açılır."
 gomer_foreign_affairs_expert:0 "Dışişleri uzmanı"
 gomer_foreign_affairs_expert_desc:0 "Faşist, komünist, demokrat veya tarafsız: Gömer bütün yabancı hükûmetlerle aynı ölçüde anlaşamıyor. Buna karşılık Berlin’deki muhalif subay çevreleriyle kurduğu ilişkiler şaşırtıcı derecede kuvvetli."
 gomer_general_in_diplomats_disguise:0 "Diplomat kılığında bir general"
 gomer_general_in_diplomats_disguise_desc:0 "Dışişleri Bakanlığını genelkurmay karargâhı sanıyor. Savaş gerekçeleri hazırlanıyor, silah fabrikaları yükseliyor; fakat bakanlık koridorlarında yapılan her toplantının yalnızca diplomasiyle ilgili olmadığına dair söylentiler de giderek artıyor."
 gomer_hitler_retires:0 "Gömer yönetime el koyar"
 gomer_hitler_retires_desc:0 "Oster çevresindeki subaylara yıllardır hazırladıkları planı uygulama emri verin. Abwehr, ordu ve hükûmet içindeki komplocular kilit merkezleri ele geçirecek; Gömer ise yeni yönetimin başına geçecek. İktidardaki ideoloji korunacak."
 gomer_leadership_tt:0 "Oster çevresindeki komplocular hükûmet merkezlerini ele geçirir ve Gömer yönetime geçer. İktidardaki ideoloji korunur; danışmanlık özellikleri liderliğine aktarılır. Ayrıca §YLiderlik eden§! özelliğini kazanır:\nHaftalık insan gücü: §G+500§!\nTümen yıpranması: §G-5%§!\nSavaş desteği: §G+10%§!\nGünlük siyasi güç kazanımı: §G+10%§!"
 gomer_sacrifice_tt:0 "Gömer öldürülür ve Oster çevresindeki darbe ağı tasfiye edilir. Danışmanlık görevi ve bütün danışmanlık etkileri kaldırılır."
 gomer_stability_provider:0 "İstikrar sağlayıcı"
 gomer_stability_provider_desc:0 "Gömer, düzeni sağlamanın ilk adımının mevcut düzeni sarsmak olduğuna inanıyor. Halkın güveni azalırken işgal altındaki bölgelerde huzursuzluk büyüyor. Buna rağmen ordu ve istihbarat içindeki bazı subaylar onun yükselişini dikkatle destekliyor."
 gomer_stabilizer.1.a:0 "Ne huzursuz edici bir istikrar."
 gomer_stabilizer.1.d:0 "Avrupa’nın yeniden silahlanmayı endişeyle izlediği bu günlerde Alman hükûmeti, geçtiğimiz hafta danışmanlığa atanan Gömer’i yeni istikrar siyasetinin mimarı olarak tanıttı.\n\nBir diplomat olarak sunulan Gömer, bakanlıklara askerî bir karargâhın temposunu getirdi. Silah fabrikaları için izinler hızla veriliyor, gelecekteki savaşların gerekçeleri hazırlanıyor. Buna karşılık halkın güveni geriliyor; farklı ideolojilerden hükûmetler ve ticaret ortakları Berlin’e giderek daha soğuk bakıyor.\n\nResmî bildiri, Almanya’nın kendini istikrara kavuşturduğunu söylüyor. Yabancı diplomatlar bu kelimenin yeni anlamını çözmeye çalışıyor."
 gomer_stabilizer.1.t:0 "Almanya kendini istikrara kavuşturdu"
 gomer_stabilizer.2.a:0 "Ne ters gidebilir ki?"
 gomer_stabilizer.2.d:0 "Atama kararı imzalandı. Gömer makamına yerleşti, masasına bir harekât haritası serdi ve diplomatik personelin teftiş için sıraya girmesini istedi.\n\nFabrika projeleri görülmemiş bir hızla onaylanıyor. Bir sonraki savaşın gerekçeleri de öyle. Halkın güveni ve yabancı hükûmetlerin iyi niyeti ise aynı hızla ters yönde ilerliyor.\n\nKıdemli bir memur atama dosyasına kısa bir not iliştirmiş: Bir diplomat istemiştik. Dışişleri kadrosuna bir general yerleştirdiniz."
 gomer_stabilizer.2.t:0 "Bunu yapmamalıydın"
 gomer_stabilizer.3.a:0 "Komplo artık gizlenemez."
 gomer_stabilizer.3.d:0 "Gömer’in kabine içindeki yükselişinin yalnızca kişisel hırsın sonucu olmadığı artık açıkça görülüyor. Abwehr içindeki Hans Oster çevresiyle uzun süredir temas hâlinde olan Gömer, hükûmetin geleceğini tartışmak üzere yapılan toplantıyı açık bir hesaplaşmaya çevirdi.\n\nOster ve ona bağlı subaylar, yıllardır üzerinde çalışılan müdahale planlarını yeniden gündeme getirdi. Berlin’deki hükûmet merkezlerinin, iletişim ağlarının ve askerî karargâhların aynı anda ele geçirilmesi öngörülüyor. Gömer’in rolü ise artık belirsiz değil: komplonun başarıya ulaşması hâlinde yeni yönetimin başına geçmesi bekleniyor.\n\nKabinedeki Hitler yanlıları derhâl tasfiye talep ederken komplocular yalnızca emir bekliyor. Almanya’nın önünde otuz gün var."
 gomer_stabilizer.3.t:0 "Oster komplosu gün yüzüne çıkıyor"
 gomer_stabilizer.4.a:0 "Komplo sona erdi."
 gomer_stabilizer.4.d:0 "Alman hükûmeti, ordu ve Abwehr içindeki geniş çaplı bir darbe girişiminin engellendiğini açıkladı. Gömer’in Hans Oster çevresiyle olan bağlantıları soruşturmanın merkezindeydi.\n\nSon günlerde hükûmet merkezlerinde gerçekleştirilen tutuklamaların ardından Gömer muhafızlar eşliğinde götürüldü ve bir daha görülmedi. Oster çevresindeki subayların hazırladığı müdahale planlarına el konuldu, bağlantılı görevliler görevlerinden uzaklaştırıldı ve Gömer’in adı kabine listesinden silindi.\n\nYıllardır perde arkasında şekillenen komplo, uygulanma emri verilmeden sona erdi."
 gomer_stabilizer.4.t:0 "Oster komplosu tasfiye edildi"
 gomer_stabilizer.5.a:0 "Komplo hükûmet oldu."
 gomer_stabilizer.5.d:0 "Almanya’daki haberleşme kısıtlamalarının ardından hükûmet değişiminin ayrıntıları ortaya çıkıyor. Hans Oster çevresindeki Abwehr subayları ve ordudaki müttefikleri, yıllardır hazırlanan müdahale planını uygulamaya koydu.\n\nKomplocular aynı anda hükûmet binalarını, askerî karargâhları ve iletişim merkezlerini ele geçirdi. Hitler’e bağlı birlikler Berlin ve Münih’te direniş gösterse de çatışmaların ardından etkisiz hâle getirildi. Eski yönetimin ileri gelenleri tutuklandı.\n\nDarbe planlarında uzun süredir merkezi bir isim olan Gömer, komplocuların desteğiyle Almanya’nın yeni lideri ilan edildi. Diplomat kılığındaki general artık gölgelerde çalışan bir komplocu değil; devletin başındaki adam."
 gomer_stabilizer.5.t:0 "Oster komplosu başarıya ulaştı"
 gomer_stabilizer.6.a:0 "Fırsat kaybedildi."
 gomer_stabilizer.6.d:0 "Haftalardır hükûmet çevrelerinde dolaşan darbe söylentileri trajik bir sonla doğrulandı. Oster çevresindeki subaylar harekete geçmek için siyasi onay beklerken kabine hiçbir karar alamadı.\n\nGecikme komplonun açığa çıkmasına yol açtı. Gömer hayatını kaybetti, bağlantılı subayların bir kısmı tutuklandı ve bir sivil sanayi tesisi meydana gelen patlamada yıkıldı. Bakanlıklarda şimdi kimin ihanet ettiği ve planların nasıl sızdırıldığı tartışılıyor.\n\nYıllarca hazırlanan Oster komplosu, tek bir emir verilmeden sona erdi."
 gomer_stabilizer.6.t:0 "Oster komplosu çöktü"
 gomer_stabilizer.7.a:0 "Çok geç kaldık."
 gomer_stabilizer.7.d:0 "Aman tanrım Gömer patladı\nBOMBOCLAT :("
 gomer_stabilizer.7.t:0 "Almanya yeterince hızlı davranmadı"
 gomer_stabilizer.8.a:0 "Komplo dosyasını kapatın."
 gomer_stabilizer.8.d:0 "Gömer, hükûmet merkezinin arka kapısından muhafızlar eşliğinde çıkarıldı. Şafaktan önce gelen kısa rapor emrin yerine getirildiğini doğruladı.\n\nMakamındaki belgeler arasında Oster çevresindeki Abwehr subaylarıyla yapılan görüşmeler, hükûmet merkezlerinin ele geçirilmesine ilişkin planlar ve müdahale hâlinde görevlendirilecek birliklerin listeleri bulundu. Dosyalara el konuldu, bağlantılı isimler soruşturmaya alındı ve Gömer’in adı kabine listesinden silindi.\n\nOster’ın tasarladığı müdahalenin siyasi yüzü, plan uygulamaya konulamadan ortadan kaldırıldı."
 gomer_stabilizer.8.t:0 "Komplocunun son yürüyüşü"
 gomer_stabilizer.9.a:0 "Oster’ın planı başarıya ulaştı."
 gomer_stabilizer.9.d:0 "Hans Oster ve Abwehr içindeki müttefiklerinin yıllardır hazırladığı darbe planı bu sabah uygulamaya konuldu. Gömer’i destekleyen subaylar hükûmet merkezlerini, iletişim hatlarını ve askerî karargâhları ele geçirerek yönetimi devraldıklarını ilan etti.\n\nHitler’in muhafızları ve parti kadroları müdahaleye silahla karşılık verdi. Berlin ve Münih’te yaşanan çatışmaların ardından Hitler gözaltına alındı ve direniş bastırıldı. İki kentte de ağır kayıplar yaşandı, sanayi tesisleri hasar gördü.\n\nKomplonun siyasi lideri olarak belirlenen Gömer artık Almanya’nın başında. Yıllarca Abwehr bürolarında ve kapalı kapılar ardında hazırlanan plan sonunda başarıya ulaştı."
 gomer_stabilizer.9.t:0 "Oster Planı yürürlüğe konuldu"
 gomer_take_a_long_walk:0 "Gömer uzun bir yürüyüşe çıkar"
 gomer_take_a_long_walk_desc:0 "Mevcut yönetimin yanında yer alın ve Gömer’in Oster çevresiyle birlikte tasfiye edilmesini emredin. Danışmanın ölümüyle kabinedeki görevi ve bütün danışmanlık etkileri sona erecek."
 gomer_the_one_who_leads:0 "Liderlik eden"
 gomer_the_one_who_leads_desc:0 "Bir zamanlar hükûmete akıl veren adam artık ona emir veriyor. Oster çevresindeki komplocuların yıllardır hazırladığı müdahale sonunda başarıya ulaştı ve Gömer bu planın siyasi yüzü olarak devletin başına geçti. Askerlik şubeleri yeni insan gücü sağlıyor, ordu gereksiz yıpranmayı azaltıyor ve bakanlıklar tek bir merkezden yönetiliyor."
 hoi4pc_desc.AFG:0 "Son kez, kendi mezarları olsun."
 hoi4pc_desc.AST:0 "Ve o billabong'un yanından geçerken hayaletinin sesini hâlâ duyabilirsin."
 hoi4pc_desc.BEL:0 "Belçika halkı bir kez daha karanlığa gömülüyor."
 hoi4pc_desc.BEL_GER:0 "Ardenler üzerinden geçen yol açıldı."
 hoi4pc_desc.BUL:0 "Ayastefanos bir hayal olarak kalıyor."
 hoi4pc_desc.CAN:0 "Vimy Sırtı'ndan buraya."
 hoi4pc_desc.CHI:0 "Kudretli Yangtze Nehri doğuya doğru akıyor; dalgaları geçmişin kahramanlarını silip götürüyor."
 hoi4pc_desc.CZE:0 "Zamanımız için barış bu mu?"
 hoi4pc_desc.DEN:0 "Kopenhag'ın üzerine sessizlik çöküyor."
 hoi4pc_desc.DEN_GER:0 "Altı saat."
 hoi4pc_desc.ENG:0 "Britanya İmparatorluğu'nun üzerinde güneş nihayet batıyor."
 hoi4pc_desc.ETH:0 "Afrika'da özgürlüğün ışığı titreşiyor."
 hoi4pc_desc.FIN:0 "Kar, düşenlerin üzerini örtüyor."
 hoi4pc_desc.FRA:0 "Özgürlük, eşitlik, kardeşlik — ya da ölüm."
 hoi4pc_desc.GER:0 "Nihai zafer."
 hoi4pc_desc.GRE:0 "\"Gel de al!\""
 hoi4pc_desc.HBC:0 "Song bir kez geri çekilmişti; artık kaçacak hiçbir yer kalmamıştı."
 hoi4pc_desc.HOL:0 "Denizin kudretini durdurabildiler, fakat insanınkini değil."
 hoi4pc_desc.HUN:0 "Tuna boyunca bir ağıt daha yankılanıyor."
 hoi4pc_desc.INS:0 "Doğu Hint Adaları'nın artık yeni bir efendisi var."
 hoi4pc_desc.IRE:0 "Ve onlar birleşmiş bir vatanın hayalini kurdular."
 hoi4pc_desc.ITA:0 "Bütün yollar Roma'ya çıkar; artık kanla döşenmiş halde."
 hoi4pc_desc.JAP:0 "Doğan Güneş tutuldu."
 hoi4pc_desc.LUX:0 "Saklanamayacak kadar küçük."
 hoi4pc_desc.MAL:0 "Musonlar ve ormanlar onları durduramadı."
 hoi4pc_desc.MAN:0 "Gök'ün Yetkisi ona hiçbir zaman bahşedilmemişti."
 hoi4pc_desc.MEX:0 "Tanrı'dan bu kadar uzak, ölüme bu kadar yakın."
 hoi4pc_desc.MON:0 "Bozkırların artık yeni bir efendisi var."
 hoi4pc_desc.NOR:0 "Kuzey ışıkları bile sönükleşiyor."
 hoi4pc_desc.NZL:0 "ANZAC unutmaz."
 hoi4pc_desc.PHI:0 "Takımadaların üzerine sessizlik çöküyor."
 hoi4pc_desc.POL:0 "Henüz kaybolmamıştı... şimdiye kadar."
 hoi4pc_desc.POR:0 "Lizbon boyun eğiyor ve Keşifler Çağı artık yalnızca eski bir hatıra."
 hoi4pc_desc.PRC:0 "Ve böylece bir kez daha yürüdüler, bir daha asla dönmemek üzere."
 hoi4pc_desc.RAJ_dominion:0 "İmparatorluğun Mücevheri çatlıyor."
 hoi4pc_desc.RAJ_free:0 "Hindistan halkı özgürlüğün tadına baktı, fakat bu yalnızca kısa bir andı."
 hoi4pc_desc.ROM:0 "Eflak'ın ormanları mezarlarının üzerinde yükseliyor."
 hoi4pc_desc.RSI:0 "Duce'nin son kumarı burada sona eriyor."
 hoi4pc_desc.SHX:0 "Dağlar yalnızca kaderlerini geciktirebildi."
 hoi4pc_desc.SIA:0 "Menam hâlâ akıyor; krallarına kayıtsız."
 hoi4pc_desc.SND:0 "Qi toprakları krallarından birini daha geride bıraktı."
 hoi4pc_desc.SOV:0 "Bir adım bile geri yok."
 hoi4pc_desc.SPA:0 "¡Tanrı ve İspanya uğruna!"
 hoi4pc_desc.SPB:0 "Eski sancak son kez katlanıyor."
 hoi4pc_desc.SPC:0 "Ne tanrı, ne efendi, ne de umut."
 hoi4pc_desc.SPD:0 "¡Geçemeyecekler!"
 hoi4pc_desc.SWI:0 "Tarafsızlık İsviçre'yi kurtaramadı."
 hoi4pc_desc.TAN:0 "Tannu ne?"
 hoi4pc_desc.TUR:0 "Boğaz'ın kapıları açıldı."
 hoi4pc_desc.USA:0 "Ve böylece dünya O'nun ayaklarının altında, Zaman'ın ruhu ise O'nun kölesi olacak."
 hoi4pc_desc.YUG:0 "Artık yalnızca mezarları birleşik."
 hoi4pc_desc.default:0 "Savaş cehennemdir."
 hoi4pc_header.balkan_campaign:0 "§Y[?winning_country^peace_gui_index.GetNameDefCap]§!, §YBalkan Seferi§! sırasında §Y[?losing_country^peace_gui_index.GetNameDef]§!'nin direnişini ezdi."
 hoi4pc_header.normal:0 "§Y[?winning_country^peace_gui_index.GetNameDefCap]§!, silahlı bir çatışmada §Y[?losing_country^peace_gui_index.GetNameDef]§!'yi mağlup etti."
 hoi4pc_header.operation_sealion:0 "§Y[?winning_country^peace_gui_index.GetNameDefCap]§!, §YManş Denizi'ni geçti§! ve §YDeniz Aslanı Harekâtı§! kapsamında §Y[?losing_country^peace_gui_index.GetNameDef]§!'yi işgal etti."
 hoi4pc_header.operation_weserubung:0 "§Y[?winning_country^peace_gui_index.GetNameDefCap]§!, §YWeserübung Harekâtı§! sırasında §Y[?losing_country^peace_gui_index.GetNameDef]§!'yi kontrol altına aldı."
 hoi4pc_header.second_italo_ethiopian_war:0 "§Y[?winning_country^peace_gui_index.GetNameDefCap]§!, §Yİkinci İtalya-Etiyopya Savaşı§!'nda §Y[?losing_country^peace_gui_index.GetNameDef]§!'yi mağlup etti."
 hoi4pc_header.second_sino_japanese_war:0 "§Y[?winning_country^peace_gui_index.GetNameDefCap]§!, §Yİkinci Çin-Japon Savaşı§!'nda §Y[?losing_country^peace_gui_index.GetNameDef]§!'yi mağlup etti."
 hoi4pc_header.ww2_general:0 "§Y[?winning_country^peace_gui_index.GetNameDefCap]§!, §Rİkinci Dünya Savaşı§!'nın kaosu içinde §Y[?losing_country^peace_gui_index.GetNameDef]§!'yi mağlup etti."
 hoi4pc_header.ww2_pacific_theater:0 "§Y[?winning_country^peace_gui_index.GetNameDefCap]§!, §Rİkinci Dünya Savaşı§!'nın §YPasifik Cephesi§!'nde §Y[?losing_country^peace_gui_index.GetNameDef]§!'yi mağlup etti."
 industry_ratio_loc:0 "Sanayi Kapasitesi Oranı"
 kemalism_ideology:0 "Kemalizm"
 kemalism_ideology_desc:0 "§YKemalizm§!\n\n\n\n\n\n\n\n\n£GFX_lx4_banner_86\n\n\n\n\n\n\n\n\n\nKemalizm; cumhuriyetçilik, milliyetçilik, halkçılık, devletçilik, laiklik ve inkılapçılık ilkelerine dayanan bir düşünce sistemidir. Millî egemenliği ve tam bağımsızlığı esas alır; hukuk, eğitim ve toplumsal yaşamda laikleşmeyi, bilim ve akıl rehberliğinde çağdaşlaşmayı ve ekonomik kalkınmayı savunur."
 lar_spain.34.d:0 "Neris Hanedanı mı ?"
 lar_spain.34.d_tt:0 "Neris hanedanından Megie I tahta çıkacak."
 lax_training_standards:0 "Gevşek Eğitim Standartları"
 lax_training_standards_desc:0 "Barış döneminin katı terfi ölçütlerini gevşeterek cepheye daha hızlı ve daha fazla subay gönderebiliriz; ancak nitelik düşer."
 leadership_from_the_front:0 "Cephede Liderlik"
 leadership_from_the_front_desc:0 "Planlar yapıldıktan ve emirler verildikten sonra, bir subayın yapabileceği en iyi şey birliklere kişisel cesaret örneği göstermektir."
 lgsf_no_new_docking_rights_tt:0 "Lag yaptığı için kapatıldı."
 live_fire_training:0 "Gerçek Mühimmatla Eğitim"
 live_fire_training_desc:0 "Tatbikatlarda bol miktarda gerçek mühimmat kullanmak askerlerin daha hızlı yetişmesini sağlar; ancak gerçekçi eğitim kaçınılmaz olarak kayıplara yol açar."
 local_power_from_dams_factor_tt:0 "$MODIFIER_LOCAL_POWER_FROM_DAMS_FACTOR$: $RIGHT|+=%1$"
 local_power_generation_factor_tt:0 "$MODIFIER_LOCAL_POWER_GENERATION_FACTOR$: $RIGHT|+=%1$"
 lx4_absolute_monarchy:0 "Mutlak Monarşi"
 lx4_absolute_monarchy_desc:0 "§YMutlak Monarşi§!\n\n\n\n\n\n£GFX_lx4_banner_63\n\n\n\n\n\n\nDevletin en yüksek siyasi yetkisini hükümdarda toplar. Yönetimin meşruiyeti hanedan, gelenek ve hükümdarlık hakkına dayanırken temsil kurumlarının yetkileri sınırlı kalır."
 lx4_anarcho_syndicalism:0 "Anarko-Sendikalizm"
 lx4_anarcho_syndicalism_desc:0 "§YAnarko-Sendikalizm§!\n\n\n\n\n\n£GFX_lx4_banner_18\n\n\n\n\n\n\nİşçi sendikalarını hem mücadele aracı hem de gelecekteki toplumun örgütlenme temeli sayar. Üretimin doğrudan işçilerce yönetilmesini ve merkezî devletin yerini özgür birliklerin almasını savunur."
 lx4_authoritarian_democracy:0 "Otoriter Demokrasi"
 lx4_authoritarian_democracy_desc:0 "§YOtoriter Demokrasi§!\n\n\n\n\n\n£GFX_lx4_banner_52\n\n\n\n\n\n\nSeçimler ve temsil kurumları sürse de siyasi rekabet güçlü yürütme tarafından sınırlandırılır. Yönetim, düzen ve istikrar gerekçesiyle muhalefetin hareket alanını daraltır."
 lx4_cardenismo:0 "Cardenismo"
 lx4_cardenismo_desc:0 "§YCardenismo§!\n\n\n\n\n\n£GFX_lx4_banner_87\n\n\n\n\n\n\nDevrimci milliyetçiliği toprak reformu, işçi örgütlenmesi, kamusal eğitim ve ekonomik egemenlikle birleştirir. Özel ekonomiyi bütünüyle kaldırmadan devlet müdahalesi ve kitle örgütleriyle reformları ilerletir."
 lx4_catholic_conservatism:0 "Katolik Muhafazakârlığı"
 lx4_catholic_conservatism_desc:0 "§YKatolik Muhafazakârlığı§!\n\n\n\n\n\n£GFX_lx4_banner_47\n\n\n\n\n\n\nDini kurumları, aileyi ve özel mülkiyeti mevcut siyasi düzen içinde korumayı amaçlar. Parlamenter katılımı otoriteye ve toplumsal düzene verilen önemle birleştirir."
 lx4_christian_democracy:0 "Hristiyan Demokrasi"
 lx4_christian_democracy_desc:0 "§YHristiyan Demokrasi§!\n\n\n\n\n\n£GFX_lx4_banner_47\n\n\n\n\n\n\nHristiyan toplumsal düşüncesini parlamenter demokrasi ve anayasal haklarla birleştirir. Aileyi, sivil toplumu ve sosyal sorumluluk taşıyan bir piyasa ekonomisini destekler."
 lx4_civic_liberalism:0 "Yurttaşlık Liberalizmi"
 lx4_civic_liberalism_desc:0 "§YYurttaşlık Liberalizmi§!\n\n\n\n\n\n£GFX_lx4_banner_35\n\n\n\n\n\n\nSiyasi topluluğu ortak yurttaşlık, hukuk önünde eşitlik ve anayasal haklar temelinde tanımlar. Devletin farklı inanç ve topluluklar karşısında tarafsız olmasını savunur."
 lx4_classical_liberalism:0 "Klasik Liberalizm"
 lx4_classical_liberalism_desc:0 "§YKlasik Liberalizm§!\n\n\n\n\n\n£GFX_lx4_banner_39\n\n\n\n\n\n\nBireysel özgürlüğü, özel mülkiyeti, sözleşme hakkını ve sınırlı hükümeti esas alır. Hukukun üstünlüğünü koruyan devletin ekonomik ve toplumsal yaşama müdahalesini dar tutmayı savunur."
 lx4_clerical_fascism:0 "Ruhban Faşizmi"
 lx4_clerical_fascism_desc:0 "§YRuhban Faşizmi§!\n\n\n\n\n\n£GFX_lx4_banner_74\n\n\n\n\n\n\nFaşist otoriterliği ve aşırı milliyetçiliği dini kurumlar ve söylemlerle birleştirir. Siyasi muhalefete karşı baskıyı, dinsel ve ulusal birliğin korunması iddiasıyla meşrulaştırır."
 lx4_communal_socialism:0 "Komünal Sosyalizm"
 lx4_communal_socialism_desc:0 "§YKomünal Sosyalizm§!\n\n\n\n\n\n£GFX_lx4_banner_20\n\n\n\n\n\n\nOrtak mülkiyeti ve dayanışmayı yerel toplulukların örgütlenmesine dayandırır. Kaynakların toplum yararına kullanılması ve kararların topluluk düzeyinde alınması esastır."
 lx4_conservative_populism:0 "Muhafazakâr Popülizm"
 lx4_conservative_populism_desc:0 "§YMuhafazakâr Popülizm§!\n\n\n\n\n\n£GFX_lx4_banner_50\n\n\n\n\n\n\nHalkın geleneksel değerlerini temsil ettiği iddiasıyla siyasi ve kültürel seçkinlere karşı çıkar. Millî kimliği, toplumsal düzeni ve güçlü halk desteğine dayanan liderliği öne çıkarır."
 lx4_corporatism:0 "Korporatizm"
 lx4_corporatism_desc:0 "§YKorporatizm§!\n\n\n\n\n\n£GFX_lx4_banner_73\n\n\n\n\n\n\nToplumsal kesimleri bağımsız siyasi rekabet yerine devletin tanıdığı meslek ve çıkar örgütlerinde bir araya getirir. Sınıf çatışmasının yerini otorite gözetiminde düzenlenen işbirliğinin almasını amaçlar."
 lx4_council_communism:0 "Konsey Komünizmi"
 lx4_council_communism_desc:0 "§YKonsey Komünizmi§!\n\n\n\n\n\n£GFX_lx4_banner_19\n\n\n\n\n\n\nSiyasi ve ekonomik iktidarın işçi konseylerinde toplanmasını savunur. Üretimin ve kamusal kararların parti bürokrasisi yerine doğrudan seçilmiş temsilciler tarafından yönetilmesini amaçlar."
 lx4_democratic_confederalism:0 "Demokratik Konfederalizm"
 lx4_democratic_confederalism_desc:0 "§YDemokratik Konfederalizm§!\n\n\n\n\n\n£GFX_lx4_banner_21\n\n\n\n\n\n\nMerkezî devlet yerine yerel meclislerin gönüllü birliğini öne çıkarır. Toplulukların özerkliğini, çoğulculuğu ve aşağıdan demokratik örgütlenmeyi savunur."
 lx4_dominant_party_democracy:0 "Hâkim Parti Demokrasisi"
 lx4_dominant_party_democracy_desc:0 "§YHâkim Parti Demokrasisi§!\n\n\n\n\n\n£GFX_lx4_banner_54\n\n\n\n\n\n\nSeçimler ve muhalefet varlığını korurken tek bir parti uzun süreli üstünlüğünü sürdürür. Devlet kaynakları, örgütsel güç ve kurumsal avantajlar siyasi rekabeti eşitsizleştirir."
 lx4_economic_globalism:0 "Ekonomik Küreselcilik"
 lx4_economic_globalism_desc:0 "§YEkonomik Küreselcilik§!\n\n\n\n\n\n£GFX_lx4_banner_44\n\n\n\n\n\n\nUluslararası ticaretin, sermaye hareketlerinin ve ekonomik işbirliğinin genişletilmesini savunur. Ulusal refahı dünya ekonomisiyle daha yakın bütünleşme üzerinden artırmayı amaçlar."
 lx4_esoteric_nationalism:0 "Ezoterik Milliyetçilik"
 lx4_esoteric_nationalism_desc:0 "§YEzoterik Milliyetçilik§!\n\n\n\n\n\n£GFX_lx4_banner_83\n\n\n\n\n\n\nMilliyetçiliği mistik öğretiler, mitler ve gizli bilgi iddialarıyla birleştirir. Ulusun kökeni ve geleceği hakkındaki bu inançları siyasi otoriteye dayanak yapar."
 lx4_green_liberalism:0 "Yeşil Liberalizm"
 lx4_green_liberalism_desc:0 "§YYeşil Liberalizm§!\n\n\n\n\n\n£GFX_lx4_banner_36\n\n\n\n\n\n\nBireysel özgürlükleri çevrenin korunması ve doğal kaynakların sorumlu kullanımıyla birleştirir. Piyasa araçları ve kamusal düzenlemelerle çevresel zararları azaltmayı amaçlar."
 lx4_guided_democracy:0 "Güdümlü Demokrasi"
 lx4_guided_democracy_desc:0 "§YGüdümlü Demokrasi§!\n\n\n\n\n\n£GFX_lx4_banner_53\n\n\n\n\n\n\nHalkın katılımını yönetimin belirlediği sınırlar ve kurumlar içinde düzenler. Seçim ve temsil mekanizmaları, devletin çizdiği siyasi yönelimin dışına çıkamayacak biçimde denetlenir."
 lx4_illiberal_democracy:0 "İlliberal Demokrasi"
 lx4_illiberal_democracy_desc:0 "§Yİlliberal Demokrasi§!\n\n\n\n\n\n£GFX_lx4_banner_57\n\n\n\n\n\n\nSeçimler yapılmasına rağmen temel haklar, bağımsız kurumlar ve hukuki denetim zayıflatılır. Çoğunluk desteği, yürütmenin yetkilerini genişletmek için kullanılır."
 lx4_integral_nationalism:0 "Bütüncül Milliyetçilik"
 lx4_integral_nationalism_desc:0 "§YBütüncül Milliyetçilik§!\n\n\n\n\n\n£GFX_lx4_banner_75\n\n\n\n\n\n\nUlusu bireysel ve sınıfsal çıkarlardan üstün, bölünmez bir bütün olarak görür. Güçlü otoriteyi ve toplumsal disiplin yoluyla ulusal birliğin sağlanmasını savunur."
 lx4_juche:0 "Juche"
 lx4_juche_desc:0 "§YJuche§!\n\n\n\n\n\n£GFX_lx4_banner_12\n\n\n\n\n\n\nSiyasi bağımsızlığı, ekonomik yeterliliği ve askerî öz savunmayı devlet öğretisinin merkezine yerleştirir. Lider, parti ve halkın birliği, merkezî otoriteyi ve sürekli seferberliği meşrulaştırır."
 lx4_kemalism:0 "Kemalizm"
 lx4_kemalism_desc:0 "§YKemalizm§!\n\n\n\n\n\n\n\n\n£GFX_lx4_banner_86\n\n\n\n\n\n\n\n\n\nCumhuriyetçilik, milliyetçilik, halkçılık, devletçilik, laiklik ve inkılapçılık ilkelerini birleştirir. Ulusal egemenliği ve devlet öncülüğünde çağdaşlaşmayı esas alır."
 lx4_labourism:0 "İşçi Hareketi"
 lx4_labourism_desc:0 "§Yİşçi Hareketi§!\n\n\n\n\n\n£GFX_lx4_banner_27\n\n\n\n\n\n\nSendikalar ve işçi sınıfının parlamenter temsilinden güç alır. Çalışma koşullarının iyileştirilmesini, sosyal güvenliği ve kamu hizmetlerinin genişletilmesini savunur."
 lx4_left_nationalism:0 "Sol Milliyetçilik"
 lx4_left_nationalism_desc:0 "§YSol Milliyetçilik§!\n\n\n\n\n\n£GFX_lx4_banner_14\n\n\n\n\n\n\nUlusal bağımsızlığı sosyal adalet, yeniden dağıtım ve halkın ekonomik egemenliğiyle birleştirir. Yabancı nüfuza ve yerel ayrıcalıklara karşı devlet müdahalesini savunur."
 lx4_liberal_conservatism:0 "Liberal Muhafazakârlık"
 lx4_liberal_conservatism_desc:0 "§YLiberal Muhafazakârlık§!\n\n\n\n\n\n£GFX_lx4_banner_43\n\n\n\n\n\n\nAnayasal özgürlükleri ve piyasa ekonomisini toplumsal süreklilikle birleştirir. Yerleşik kurumların korunmasını ve reformların aşamalı biçimde gerçekleştirilmesini savunur."
 lx4_libertarian_marxism:0 "Özgürlükçü Marksizm"
 lx4_libertarian_marxism_desc:0 "§YÖzgürlükçü Marksizm§!\n\n\n\n\n\n£GFX_lx4_banner_17\n\n\n\n\n\n\nMarksist sınıf çözümlemesini merkezî parti yönetimine karşı eleştiriyle birleştirir. İşçilerin öz yönetimini ve toplumun aşağıdan örgütlenmesini öne çıkarır."
 lx4_libertarian_municipalism:0 "Özgürlükçü Belediyecilik"
 lx4_libertarian_municipalism_desc:0 "§YÖzgürlükçü Belediyecilik§!\n\n\n\n\n\n£GFX_lx4_banner_20\n\n\n\n\n\n\nSiyasi kararların yerel halk meclislerinde alınmasını ve belediyelerin konfederal bağlarla birleşmesini savunur. Kamusal ekonomiyi ve doğrudan katılımı merkezî iktidara alternatif olarak görür."
 lx4_maoism:0 "Maoizm"
 lx4_maoism_desc:0 "§YMaoizm§!\n\n\n\n\n\n£GFX_lx4_banner_16\n\n\n\n\n\n\nMarksizmi Çin devriminin deneyimiyle birleştirir; köylülüğe, kitle çizgisine, birleşik cepheye ve öz güce dayanmayı vurgular. Devrim sonrasında bürokratik ayrıcalıklarla mücadeleyi ve toplumsal seferberliği sürdürmeyi savunur."
 lx4_marxism_leninism:0 "Marksizm-Leninizm"
 lx4_marxism_leninism_desc:0 "§YMarksizm-Leninizm§!\n\n\n\n\n\n£GFX_lx4_banner_08\n\n\n\n\n\n\nSınıf mücadelesini toplumsal dönüşümün temeli, öncü partiyi devrimin ve devletin örgütleyicisi sayar. Kamu mülkiyetini, ekonomik planlamayı ve merkezî parti yönetimini esas alır."
 lx4_military_democracy:0 "Askerî Demokrasi"
 lx4_military_democracy_desc:0 "§YAskerî Demokrasi§!\n\n\n\n\n\n£GFX_lx4_banner_55\n\n\n\n\n\n\nSeçimle oluşan sivil kurumların üzerinde ordunun belirleyici nüfuzu bulunur. Askerî yönetim, siyasi düzenin ve devletin temel yöneliminin koruyucusu olarak konumlanır."
 lx4_military_junta:0 "Askerî Cunta"
 lx4_military_junta_desc:0 "§YAskerî Cunta§!\n\n\n\n\n\n£GFX_lx4_banner_64\n\n\n\n\n\n\nSiyasi iktidar bir askerî kurul veya yüksek rütbeli komutanlar topluluğu tarafından kullanılır. Sivil yönetim, askerî hiyerarşi ve güvenlik önceliklerine bağlı hâle gelir."
 lx4_military_socialism:0 "Askerî Sosyalizm"
 lx4_military_socialism_desc:0 "§YAskerî Sosyalizm§!\n\n\n\n\n\n£GFX_lx4_banner_06\n\n\n\n\n\n\nToplumsal reformu, millîleştirmeyi ve üretimi askerî disiplin altında örgütler. Ordu ve siyasi yönetimin birleşen yetkileri sivil yaşam üzerinde belirleyici olur."
 lx4_moderate_conservatism:0 "Ilımlı Muhafazakârlık"
 lx4_moderate_conservatism_desc:0 "§YIlımlı Muhafazakârlık§!\n\n\n\n\n\n£GFX_lx4_banner_51\n\n\n\n\n\n\nMevcut kurumları korurken gerekli reformlara ve siyasal uzlaşmaya açıktır. Düzenin devamlılığını ani dönüşümlere tercih eder."
 lx4_modern_liberalism:0 "Modern Liberalizm"
 lx4_modern_liberalism_desc:0 "§YModern Liberalizm§!\n\n\n\n\n\n£GFX_lx4_banner_34\n\n\n\n\n\n\nBireysel hakları, anayasal kurumları ve düzenlenmiş bir piyasa ekonomisini savunur. Özgürlüğün korunmasında eğitim, sosyal güvence ve kamu hizmetlerine de görev yükler."
 lx4_national_bolshevism:0 "Millî Bolşevizm"
 lx4_national_bolshevism_desc:0 "§YMillî Bolşevizm§!\n\n\n\n\n\n£GFX_lx4_banner_05\n\n\n\n\n\n\nDevrimci ekonomi politikalarını güçlü bir milliyetçi programla birleştirir. Devlet mülkiyeti ve yeniden dağıtımı ulusal egemenlik, disiplin ve siyasi birlik hedeflerine bağlar."
 lx4_national_conservatism:0 "Millî Muhafazakârlık"
 lx4_national_conservatism_desc:0 "§YMillî Muhafazakârlık§!\n\n\n\n\n\n£GFX_lx4_banner_48\n\n\n\n\n\n\nUlusal egemenliği, ortak kimliği ve geleneksel kurumları öne çıkarır. Siyasal değişimin ulusal bütünlük ve toplumsal düzenle uyumlu olmasını savunur."
 lx4_national_socialism:0 "Nasyonal Sosyalizm"
 lx4_national_socialism_desc:0 "§YNasyonal Sosyalizm§!\n\n\n\n\n\n£GFX_lx4_banner_79\n\n\n\n\n\n\nIrkçı üstünlük anlayışını aşırı milliyetçilik, yayılmacılık ve totaliter liderlikle birleştirir. Devleti ve toplumu tek bir siyasi merkez etrafında örgütlerken hedef alınan topluluklara sistematik baskı uygular."
 lx4_neo_nazism:0 "Neo-Nazizm"
 lx4_neo_nazism_desc:0 "§YNeo-Nazizm§!\n\n\n\n\n\n£GFX_lx4_banner_80\n\n\n\n\n\n\nNazi ideolojisinin ırkçılık, antisemitizm ve otoriter milliyetçilik gibi unsurlarını sonraki koşullarda yeniden üretir. Çoğulcu siyaseti reddeder ve dışlayıcı bir ulusal düzen savunur."
 lx4_neoliberalism:0 "Neoliberalizm"
 lx4_neoliberalism_desc:0 "§YNeoliberalizm§!\n\n\n\n\n\n£GFX_lx4_banner_40\n\n\n\n\n\n\nRekabetçi piyasaları, özel girişimi ve ekonomik serbestleşmeyi öne çıkarır. Devletin görevini piyasa düzenini güvenceye almak ve ekonomik faaliyet üzerindeki kısıtlamaları azaltmak olarak tanımlar."
 lx4_one_nation_conservatism:0 "Tek Ulus Muhafazakârlığı"
 lx4_one_nation_conservatism_desc:0 "§YTek Ulus Muhafazakârlığı§!\n\n\n\n\n\n£GFX_lx4_banner_49\n\n\n\n\n\n\nToplumsal sınıflar arasındaki çatışmayı azaltarak ulusal birliği korumayı amaçlar. Yerleşik kurumları muhafaza ederken sosyal reformlara ve sınırlı devlet müdahalesine yer verir."
 lx4_ordoliberalism:0 "Ordoliberalizm"
 lx4_ordoliberalism_desc:0 "§YOrdoliberalizm§!\n\n\n\n\n\n£GFX_lx4_banner_41\n\n\n\n\n\n\nSerbest rekabetin güçlü bir hukuki çerçeve olmadan korunamayacağını savunur. Devlete tekelleşmeyi engelleme, para istikrarını sağlama ve piyasanın kurallarını uygulama görevi verir."
 lx4_palingenetic_nationalism:0 "Ulusal Yeniden Doğuşçuluk"
 lx4_palingenetic_nationalism_desc:0 "§YUlusal Yeniden Doğuşçuluk§!\n\n\n\n\n\n£GFX_lx4_banner_77\n\n\n\n\n\n\nUlusun çöküş içinde olduğu iddiasından hareketle köklü bir yeniden doğuş vaat eder. Kitle seferberliği ve otoriter dönüşüm yoluyla yeni bir ulusal düzen kurmayı amaçlar."
 lx4_party_state_socialism:0 "Parti Devleti Sosyalizmi"
 lx4_party_state_socialism_desc:0 "§YParti Devleti Sosyalizmi§!\n\n\n\n\n\n£GFX_lx4_banner_13\n\n\n\n\n\n\nSosyalist dönüşümü yöneten parti ile devlet kurumlarını birbirine bağlar. Kamu mülkiyeti ve planlama, merkezî parti kararlarının belirlediği idari yapı içinde uygulanır."
 lx4_personalist_dictatorship:0 "Kişisel Diktatörlük"
 lx4_personalist_dictatorship_desc:0 "§YKişisel Diktatörlük§!\n\n\n\n\n\n£GFX_lx4_banner_65\n\n\n\n\n\n\nİktidar kurumlar veya ortak bir yönetici kadrodan çok tek bir liderin kişisel otoritesine dayanır. Atamalar, sadakat ilişkileri ve baskı araçları liderin konumunu korumaya hizmet eder."
 lx4_populist_democracy:0 "Popülist Demokrasi"
 lx4_populist_democracy_desc:0 "§YPopülist Demokrasi§!\n\n\n\n\n\n£GFX_lx4_banner_58\n\n\n\n\n\n\nHalkın doğrudan iradesini temsil ettiği iddiasını siyasi meşruiyetin merkezine yerleştirir. Seçim desteğine dayanırken aracı kurumlar ve denge mekanizmalarıyla gerilim yaşayabilir."
 lx4_progressive_liberalism:0 "İlerici Liberalizm"
 lx4_progressive_liberalism_desc:0 "§Yİlerici Liberalizm§!\n\n\n\n\n\n£GFX_lx4_banner_33\n\n\n\n\n\n\nLiberal hakların korunmasını kurumsal ve toplumsal reformlarla birleştirir. Yerleşik ayrıcalıkları sınırlamayı ve kamusal yaşamı daha kapsayıcı hâle getirmeyi hedefler."
 lx4_progressive_social_democracy:0 "İlerici Sosyal Demokrasi"
 lx4_progressive_social_democracy_desc:0 "§Yİlerici Sosyal Demokrasi§!\n\n\n\n\n\n£GFX_lx4_banner_29\n\n\n\n\n\n\nSosyal devlet politikalarını siyasal ve toplumsal reformlarla birleştirir. Demokratik kurumları koruyarak eşit yurttaşlığı ve sosyal adaleti genişletmeyi savunur."
 lx4_protestant_conservatism:0 "Protestan Muhafazakârlığı"
 lx4_protestant_conservatism_desc:0 "§YProtestan Muhafazakârlığı§!\n\n\n\n\n\n£GFX_lx4_banner_90\n\n\n\n\n\n\nSiyasi sorumluluğu dini ahlak, yerleşik kurumlar ve toplumsal örgütlerin özerkliğiyle ilişkilendirir. Parlamenter siyasete katılırken devrimci dönüşümlere ve sosyalizme karşı çıkar."
 lx4_racial_nationalism:0 "Irkçı Milliyetçilik"
 lx4_racial_nationalism_desc:0 "§YIrkçı Milliyetçilik§!\n\n\n\n\n\n£GFX_lx4_banner_81\n\n\n\n\n\n\nUlusal aidiyeti soy ve ırk üzerinden tanımlar. Yurttaşlık haklarını ve siyasi katılımı bu ayrımlara bağlayarak eşitsiz ve dışlayıcı bir düzen kurmayı amaçlar."
 lx4_radical_liberalism:0 "Radikal Liberalizm"
 lx4_radical_liberalism_desc:0 "§YRadikal Liberalizm§!\n\n\n\n\n\n£GFX_lx4_banner_37\n\n\n\n\n\n\nYerleşik siyasal ve toplumsal ayrıcalıklara karşı kapsamlı liberal reformları savunur. Yurttaşlık haklarını, laik kurumları ve halkın siyasal katılımını genişletmeyi hedefler."
 lx4_radical_republicanism:0 "Radikal Cumhuriyetçilik"
 lx4_radical_republicanism_desc:0 "§YRadikal Cumhuriyetçilik§!\n\n\n\n\n\n£GFX_lx4_banner_37\n\n\n\n\n\n\nParlamenter yönetimi, laik kurumları ve yurttaşlık haklarını savunur. Özellikle Fransız geleneğinde cumhuriyetçi, ruhban karşıtı ve küçük mülk sahiplerini gözeten reformlarla ilişkilidir."
 lx4_revolutionary_state_socialism:0 "Devrimci Devlet Sosyalizmi"
 lx4_revolutionary_state_socialism_desc:0 "§YDevrimci Devlet Sosyalizmi§!\n\n\n\n\n\n£GFX_lx4_banner_03\n\n\n\n\n\n\nDevrim sonrasında toplumu yeniden kurma görevini merkezî devlete verir. Kamu mülkiyeti, planlama ve siyasi seferberlik yoluyla devrimci iktidarın sürekliliğini sağlamayı amaçlar."
 lx4_right_libertarianism:0 "Sağ Liberteryenizm"
 lx4_right_libertarianism_desc:0 "§YSağ Liberteryenizm§!\n\n\n\n\n\n£GFX_lx4_banner_42\n\n\n\n\n\n\nBireysel özgürlüğü ve özel mülkiyeti siyasi düzenin temeli sayar. Devletin vergilendirme, düzenleme ve yeniden dağıtım yetkilerini keskin biçimde sınırlamayı savunur."
 lx4_salazarism:0 "Salazarizm"
 lx4_salazarism_desc:0 "§YSalazarizm§!\n\n\n\n\n\n£GFX_lx4_banner_57\n\n\n\n\n\n\nMuhafazakâr otoriter yönetimi Katolik gelenek, toplumsal hiyerarşi ve korporatif kurumlarla birleştirir. Özel mülkiyet, devlet düzenlemeleri ve merkezî idare altında sürerken muhalefet baskı ve sansürle sınırlandırılır."
 lx4_segregationism:0 "Irksal Ayrımcılık"
 lx4_segregationism_desc:0 "§YIrksal Ayrımcılık§!\n\n\n\n\n\n£GFX_lx4_banner_91\n\n\n\n\n\n\nAyrıcalıklı bir ırksal seçmen topluluğu içinde siyasi rekabeti sürdürürken diğer toplulukların haklarını sınırlar. Toprak, çalışma, ikamet ve siyasal katılım düzenlemeleriyle eşitsizliği kurumsallaştırır."
 lx4_social_conservatism:0 "Toplumsal Muhafazakârlık"
 lx4_social_conservatism_desc:0 "§YToplumsal Muhafazakârlık§!\n\n\n\n\n\n£GFX_lx4_banner_46\n\n\n\n\n\n\nAileyi, dini kurumları ve yerleşik toplumsal değerleri korumayı önceliklendirir. Değişimin toplumsal düzeni ve ahlaki yükümlülükleri zayıflatmaması gerektiğini savunur."
 lx4_social_democracy:0 "Sosyal Demokrasi"
 lx4_social_democracy_desc:0 "§YSosyal Demokrasi§!\n\n\n\n\n\n£GFX_lx4_banner_25\n\n\n\n\n\n\nParlamenter demokrasi içinde sosyal hakları, işçi örgütlerini ve kamu hizmetlerini güçlendirir. Piyasa ekonomisini vergilendirme, sosyal güvence ve devlet müdahalesiyle düzenlemeyi amaçlar."
 lx4_social_liberalism:0 "Sosyal Liberalizm"
 lx4_social_liberalism_desc:0 "§YSosyal Liberalizm§!\n\n\n\n\n\n£GFX_lx4_banner_32\n\n\n\n\n\n\nBireysel özgürlükleri ve parlamenter yönetimi sosyal güvencelerle birleştirir. Devletin fırsat eşitliğini korumak ve piyasanın yol açtığı sorunları azaltmak için müdahale etmesini savunur."
 lx4_socialist_populism:0 "Sosyalist Popülizm"
 lx4_socialist_populism_desc:0 "§YSosyalist Popülizm§!\n\n\n\n\n\n£GFX_lx4_banner_30\n\n\n\n\n\n\nSiyasi meşruiyetini emekçi halkın çıkarlarını savunma iddiasından alır. Yeniden dağıtım, devlet müdahalesi ve kitlesel örgütlenmeyle ekonomik seçkinlerin gücünü sınırlamayı amaçlar."
 lx4_supremacist_totalitarianism:0 "Üstünlükçü Totalitarizm"
 lx4_supremacist_totalitarianism_desc:0 "§YÜstünlükçü Totalitarizm§!\n\n\n\n\n\n£GFX_lx4_banner_84\n\n\n\n\n\n\nBelirli bir topluluğun üstünlüğünü mutlak siyasi otoriteyle birleştirir. Devlet, toplumsal yaşamı denetler ve eşit yurttaşlığı reddeden hiyerarşileri zorla uygular."
 lx4_technocratic_authoritarianism:0 "Teknokratik Otoriterlik"
 lx4_technocratic_authoritarianism_desc:0 "§YTeknokratik Otoriterlik§!\n\n\n\n\n\n£GFX_lx4_banner_56\n\n\n\n\n\n\nKarar alma yetkisini uzmanlardan ve üst düzey yöneticilerden oluşan dar bir çevrede toplar. Teknik verimlilik ve kalkınma hedefleri, siyasi rekabetin sınırlandırılmasına gerekçe oluşturur."
 lx4_technocratic_collectivism:0 "Teknokratik Kolektivizm"
 lx4_technocratic_collectivism_desc:0 "§YTeknokratik Kolektivizm§!\n\n\n\n\n\n£GFX_lx4_banner_04\n\n\n\n\n\n\nOrtak mülkiyetteki kaynakların uzmanlar tarafından bilimsel planlamayla yönetilmesini savunur. Verimlilik ve uzun vadeli kalkınma öne çıkarken kararlar teknik ve idari merkezlerde toplanır."
 lx4_technocratic_dictatorship:0 "Teknokratik Diktatörlük"
 lx4_technocratic_dictatorship_desc:0 "§YTeknokratik Diktatörlük§!\n\n\n\n\n\n£GFX_lx4_banner_67\n\n\n\n\n\n\nDevlet, demokratik denetimden bağımsız bir uzman yönetimi tarafından idare edilir. Teknik yeterlilik ve ekonomik başarı iddiası, siyasi yetkinin dar bir elde toplanmasını meşrulaştırır."
 lx4_theocracy:0 "Teokrasi"
 lx4_theocracy_desc:0 "§YTeokrasi§!\n\n\n\n\n\n£GFX_lx4_banner_66\n\n\n\n\n\n\nSiyasi otorite dini öğretiye, ruhani makamlara veya kutsal hukukun yorumuna dayanır. Devletin meşruiyeti ve kamusal düzen, dini kurumlarla doğrudan ilişkilidir."
 lx4_tibetan_theocracy:0 "Tibet Teokrasisi"
 lx4_tibetan_theocracy_desc:0 "§YTibet Teokrasisi§!\n\n\n\n\n\n£GFX_lx4_banner_69\n\n\n\n\n\n\nRuhani otorite ile dünyevi yönetimi birleştiren geleneksel Tibet düzenini temsil eder. Dini kurumlar, naiplik ve yerleşik toplumsal hiyerarşiler devlet yönetiminde belirleyicidir."
 lx4_totalitarian_socialism:0 "Totaliter Sosyalizm"
 lx4_totalitarian_socialism_desc:0 "§YTotaliter Sosyalizm§!\n\n\n\n\n\n£GFX_lx4_banner_01\n\n\n\n\n\n\nTek parti devleti üretimi, kamusal örgütlenmeyi ve toplumsal yaşamı merkezî denetime alır. Ekonomik planlama ve kitlesel seferberlik, bağımsız siyasal faaliyet üzerindeki baskıyla birlikte yürütülür."
 lx4_traditional_conservatism:0 "Geleneksel Muhafazakârlık"
 lx4_traditional_conservatism_desc:0 "§YGeleneksel Muhafazakârlık§!\n\n\n\n\n\n£GFX_lx4_banner_45\n\n\n\n\n\n\nYerleşik kurumları, tarihsel gelenekleri ve toplumsal yükümlülükleri siyasi düzenin dayanağı sayar. Köklü dönüşümler yerine sürekliliği ve ihtiyatlı reformları tercih eder."
 lx4_ultranationalism:0 "Aşırı Milliyetçilik"
 lx4_ultranationalism_desc:0 "§YAşırı Milliyetçilik§!\n\n\n\n\n\n£GFX_lx4_banner_76\n\n\n\n\n\n\nUlusun çıkarlarını diğer hak ve yükümlülüklerin üzerinde tutar. Sert bir iç birlik anlayışını dışarıya karşı saldırganlık, üstünlük iddiası ve genişleme hedefleriyle birleştirebilir."
 lx4_vanguard_totalism:0 "Öncü Totalitarizm"
 lx4_vanguard_totalism_desc:0 "§YÖncü Totalitarizm§!\n\n\n\n\n\n£GFX_lx4_banner_07\n\n\n\n\n\n\nÖncü partinin devrim adına yalnızca hükümeti değil, toplumun bütün örgütlü alanlarını yönetmesini savunur. Üretim, kültür ve kitle örgütleri sürekli siyasi seferberliğe bağlanır."
 lx4_volkist_nationalism:0 "Völkisch Milliyetçilik"
 lx4_volkist_nationalism_desc:0 "§YVölkisch Milliyetçilik§!\n\n\n\n\n\n£GFX_lx4_banner_82\n\n\n\n\n\n\nUlusu ortak soy, kültür ve toprakla bağlı organik bir topluluk olarak görür. Irksal dışlamayı ve etnik bütünlük fikrini siyasi düzenin merkezine yerleştirir."
 lx4_welfare_socialism:0 "Sosyal Refah Sosyalizmi"
 lx4_welfare_socialism_desc:0 "§YSosyal Refah Sosyalizmi§!\n\n\n\n\n\n£GFX_lx4_banner_28\n\n\n\n\n\n\nSağlık, eğitim, barınma ve sosyal güvenliği toplumsal haklar olarak görür. Kamusal yatırım ve yeniden dağıtım yoluyla ekonomik eşitsizlikleri azaltmayı amaçlar."
