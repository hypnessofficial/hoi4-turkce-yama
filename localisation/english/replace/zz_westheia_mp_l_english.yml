 WESTHEIA_LAT_bulldog_jupiter_inventory:0 "Bristol Bulldog II (Jupiter VI)"
 WESTHEIA_LAT_bulldog_jupiter_inventory_desc:0 "İngiltere’den alınan Bulldog II avcılarının Gnome-Rhône Jupiter VI motorlu on uçaklık grubu. İki sabit tüfek kalibreli makineli tüfek taşır."
