 GER_gomer_the_stabilizer:0 "Gömer"
 GER_gomer_the_stabilizer_advisor:0 "Gömer"
 GER_gomer_the_stabilizer_advisor_desc:0 "Diplomat kılığındaki bir general olan Gömer, görünürde hükûmete hizmet ederken ordu ve Abwehr içindeki muhalif çevrelerle yakın ilişkiler sürdürüyor. Oster ve çevresindeki subayların hazırladığı planlarda adı giderek daha sık geçiyor. Kabineye girdikten sonra azledilemez. Gömer için bir müzakere masasıyla harekât haritası arasında pek az fark vardır."
 GER_otto_strasser_ideology:0 "Strasserizm"
 GER_otto_strasser_ideology_desc:0 "§YStrasserizm§!\n\n\n\n\n\n\n\n\n£GFX_westheia_real_banner_strasserism\n\n\n\n\n\n\n\n\n\nAşırı milliyetçiliği, antikapitalist söylemi ve toplumsal yeniden örgütlenme taleplerini birleştirir. Ulusal topluluğun sınıf çatışmalarının yerine geçirilmesini ve ekonominin güçlü devlet denetimine alınmasını savunur."
 GIVE_STATE_ACTION_ACTION_DESC:0 "Seçilen ülkeye eyalet ver."
 GIVE_STATE_ACTION_TITLE:0 "Eyalet Ver"
 GRE33_alexandros_othonaios:0 "Alexandros Othonaios"
 GRE33_georgios_kondylis:0 "Georgios Kondylis"
 GRE33_panagis_tsaldaris:0 "Panagis Tsaldaris"
 GRE_biamax_desc:0 "Motorlu araçların bakımı, onarımı ve montajında çalışan yerli atölyeleri bir araya getirerek askerî ulaşım araçlarının tedarik ve bakım olanaklarını geliştirmeliyiz."
 GRE_ioannis_metaxas_ideology:0 "Metaksizm"
 GRE_ioannis_metaxas_ideology_desc:0 "§YMetaksizm§!\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n£GFX_westheia_real_banner_metaxism\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nUlusal yenilenmeyi, antikomünizmi ve korporatif örgütlenmeyi merkezî otoriteyle birleştirir. Devletin toplumsal seferberliği, gençlik örgütlerini ve siyasi yaşamı denetlemesini savunur."
 GRE_large_installment_payment_ENG_desc:0 "Britanya borçlarına daha büyük bir ödeme ayıracağız. Kısa vadeli ekonomik yük artacak, ödeme tamamlandığında borç bakiyesi daha hızlı azalacaktır."
 GRE_large_installment_payment_FRA_desc:0 "Fransa borçlarına daha büyük bir ödeme ayıracağız. Kısa vadeli ekonomik yük artacak, ödeme tamamlandığında borç bakiyesi daha hızlı azalacaktır."
 GRE_large_installment_payment_ITA_desc:0 "İtalya borçlarına daha büyük bir ödeme ayıracağız. Kısa vadeli ekonomik yük artacak, ödeme tamamlandığında borç bakiyesi daha hızlı azalacaktır."
 GRE_small_installment_payment_ENG_desc:0 "Britanya alacaklılarına yapılacak bu ödeme süresince kaynaklarımızın bir bölümünü borç hizmetine ayıracağız. Ödeme tamamlandığında Britanya borç bakiyesi azalacaktır."
 GRE_small_installment_payment_FRA_desc:0 "Fransız alacaklılara yapılacak bu ödeme süresince kaynaklarımızın bir bölümünü borç hizmetine ayıracağız. Ödeme tamamlandığında Fransa borç bakiyesi azalacaktır."
 GRE_small_installment_payment_ITA_desc:0 "İtalyan alacaklılara yapılacak bu ödeme süresince kaynaklarımızın bir bölümünü borç hizmetine ayıracağız. Ödeme tamamlandığında İtalya borç bakiyesi azalacaktır."
 GXC_uneasy_minds_idea_desc_GDC33:0 "Nanjing’le siyasi rekabet ve Japonya’nın kuzeydeki yayılması, eyalet yönetiminde güvensizlik yaratmaktadır. Merkezî hükûmetin kararlarıyla yerel çıkarlar arasındaki gerilim, Guangdong’un idaresini ve halkın geleceğe duyduğu güveni zayıflatmaktadır."
 GXC_uneasy_minds_idea_desc_GDC33_fallback:0 "Nanjing yönetimiyle yaşanan mücadeleler, Guangxi’nin siyasi çevrelerinde derin bir güvensizlik bıraktı. Eyaletin özerkliğini koruma kaygısı ve ulusal siyasetin yönüne dair anlaşmazlıklar, yönetimin ortak bir program etrafında toplanmasını zorlaştırıyor."
 HOL_1933_establish_werkfonds:0 "Werkfonds'u Kur"
 HOL_1933_establish_werkfonds_desc:0 "İşsizliğe karşı yürütülen çalışmaların daha düzenli finansmana ihtiyacı var. Kamu ve özel sektör projelerine kredi sağlayacak Werkfonds, üretken yatırımları destekleyerek yeni iş olanakları yaratmamıza yardımcı olacak."
 HOL_1933_werkfonds:0 "Werkfonds Yatırımları"
 HOL_1933_werkfonds_desc:0 "Werkfonds kredileri, kamu çalışmaları ve üretken yatırımlar için gereken finansmanın sağlanmasını kolaylaştırıyor."
 HUN_franz_friedrich_ideology:0 "Monarko-Nazizm"
 HUN_franz_friedrich_ideology_desc:0 "§YMonarko-Nazizm§!\n\n\n\n\n\n\n\n£GFX_westheia_real_banner_monarchonazism\n\n\n\n\n\n\n\n\nHanedan meşruiyetini ırkçı ve aşırı milliyetçi bir kitle devletiyle birleştirmeye çalışır. Tahtın simgesel otoritesi, merkezî parti yönetimi ve otoriter toplumsal seferberlikle birlikte kullanılır."
 ICE_1933_government_of_the_working_classes:0 "Çalışanların Hükümeti"
 ICE_1933_government_of_the_working_classes_desc:0 "İlerici Parti ile Sosyal Demokratların kurduğu yeni hükümet, ekonomik bunalımın yükünü hafifletmek için kamu yatırımlarını ve istihdamı artırmayı hedefliyor. Devletin imkânlarını çalışanların yaşam koşullarını iyileştirmek için seferber etmeliyiz."
 ICE_1933_herring_export_board:0 "Ringa İhracat Kurulunu Kur"
 ICE_1933_herring_export_board_desc:0 "Ringa ihracatını düzenleyecek bir kurul, üreticilerin dış pazarlardaki faaliyetlerini koordine ederek ülkemizin başlıca gelir kaynaklarından birini güçlendirecektir."
 ICE_1933_public_works_programme:0 "Kamu Yatırımları Programı"
 ICE_1933_public_works_programme_desc:0 "Hükümetin kamu yatırımları programı, işsizliğe karşı yeni inşaat projelerini destekliyor."
 INDUSTRIAL_ORG_LIST_WINDOW_ASSIGN_TO_INDUSTRIAL_PARK_TOOLTIP:0 "Bu sanayi parkına §Yatamak§! için §Gtıklayın§!"
 INDUSTRY_TITLE_ENERGY:0 "ENERJİ"
 INS_1933_crisis_import_ordinance:0 "Kriz İthalat Kararnamesi"
 INS_1933_crisis_import_ordinance_desc:0 "Kriz döneminde çıkarılan geçici ithalat düzenlemeleri, koloninin dış ticaretini yeniden şekillendiriyor."
 INS_1933_crisis_import_ordinance_focus:0 "Kriz İthalat Kararnamesini Uygula"
 INS_1933_crisis_import_ordinance_focus_desc:0 "Dünya ticaretindeki daralma, takımadaların ihracat gelirlerini ve ithalat düzenini sarsmıştır. Geçici bir kararnameyle dış ticareti yeniden düzenleyerek ekonomik toparlanma için zemin hazırlamalıyız."
 IRQ_westheia_kurt_kaan:0 "Kürt Kaan"
 IRQ_westheia_kurt_kaan_advisor:0 "Kürt Kaan"
 IRQ_westheia_kurt_kaan_desc:0 "Dağlardan başkentin koridorlarına uzanan Kürt Kaan, kimlik mücadelesini sınırların ötesine taşımaya kararlıdır. Kimi için halkının sesi, kimi için eski düzenin sonudur. Onun gözünde Kürdistan yalnızca haritada çizilecek bir ülke değil, bütün dünyaya anlatılacak bir davadır."
 ITA_antonio_gramsci_ideology:0 "Gramscicilik"
 ITA_antonio_gramsci_ideology_desc:0 "§YGramscicilik§!\n\n\n\n\n\n\n£GFX_westheia_real_banner_gramscism\n\n\n\n\n\n\n\nSınıf mücadelesinde ekonomik güç kadar kültürel ve siyasi hegemonyaya da önem verir. İşçi örgütlenmesini, toplumsal ittifakları ve uzun vadeli siyasi hazırlığı sosyalist dönüşümün araçları olarak görür."
 ITA_westheia_pius_maria:0 "Pius Maria"
 ITA_westheia_pius_maria_advisor:0 "Pius Maria"
 JAP_1933_conciliatory_admiral:0 "Uzlaşmacı Amiral"
 JAP_1933_conciliatory_admiral_desc:0 "Donanma kökenli Saitō, siyasi partiler, askerî çevreler ve devlet seçkinleri arasında uzlaşma sağlayarak kabinesinin istikrarını korumaya çalışır. Yönetimi, donanmanın tecrübesine dayanırken iç siyasette gerilimi ve savaş yanlısı baskıları sınırlamayı hedefler."
 JAP_1933_east_hebei_operation:0 "Doğu Hebei’yi Ele Geçir"
 JAP_1933_east_hebei_operation_desc:0 "Doğu Hebei, Mançurya’nın güneybatısındaki geçitler ile Pekin ve Tianjin çevresindeki ulaşım hatları arasında stratejik bir konuma sahip. Kwantung Ordusu, Çin’in kuzeydeki savunmasını zayıflatmak amacıyla bölge üzerindeki askerî baskıyı artırmak istiyor.\n\nJehol Mançukuo’nun elindeyken, bu bölgedeki Mançukuo sınır birlikleriyle sınırlı bir çatışma hazırlayabiliriz. Zafer hâlinde Doğu Hebei doğrudan Japonya’nın idaresine geçecek. Yenilgi hâlinde Çin’le ilişkilerimiz bozulacak; ordumuz çatışmadan deneyim kazanacak."
 JAP_1933_test_the_chinese:0 "Çin’i Sına"
 JAP_1933_test_the_chinese_desc:0 "Jehol’un Mançurya ile Kuzey Çin arasındaki konumu, Kwantung Ordusu için büyük önem taşıyor. Bölgeyi Mançukuo’nun parçası sayan askerî çevreler, Çin birliklerinin direnme iradesini sınırlı bir harekâtla sınamak istiyor. Liaotung’da Mançukuo sınır birliklerini hazırlayıp Jehol sınırında bir çatışma başlatabiliriz. Başarı hâlinde bölge Mançukuo idaresine geçecek; başarısızlık ise Çin’le ilişkilerimizi daha da gerecek."
 JAP_establish_showa_aircraft_idnsutry_desc_vanilla:0 "Tokyo, Akishima'da Shōwa Hikōki Kōgyō Kabushiki-gaisha'yı kurma izni için bir talep aldık. Bu şirket, silahlı kuvvetlerimize sağlamak üzere askeri uçaklar inşa etmek istiyor. Taleplerini onaylamalı ve bize havacılık teçhizatı sağlama konusunda hemen çalışmaya başlamalarını sağlamalıyız."
 JAP_establish_showa_aircraft_idnsutry_vanilla:0 "Showa Uçak Endüstrisini Kur"
