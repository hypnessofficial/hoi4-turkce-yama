 WESTHEIA_FRA33_DORIOT_ALT_DESC:0 "Jacques Doriot, eski komünist kimliğinden uzaklaşarak otoriter milliyetçiliğe yöneldi. Hareketi, kitle seferberliği ve güçlü bir liderlik etrafında yeni bir siyasi düzen kurmayı hedefliyor."
 WESTHEIA_FRA33_ISABELLE_DESC:0 "Orléans hanedanının etrafında birleşen monarşistler, Prenses Isabelle’i yeniden kurulan Fransız tahtına çıkardı. Yeni yönetim, hanedan geleneği ile devletin sürekliliğini bir araya getirmeyi amaçlıyor."
 WESTHEIA_FRA33_LAVAL_ALT_DESC:0 "Pierre Laval, parlamenter koalisyonların ötesinde güçlü bir yürütme ve otoriter bir ulusal birlik yönetimi kurulmasını savunuyor."
 WESTHEIA_FRA33_LA_ROCQUE_ALT_DESC:0 "François de la Rocque, milliyetçi hareketi disiplin, toplumsal dayanışma ve güçlü devlet düşüncesi etrafında birleştirmeyi amaçlıyor."
 WESTHEIA_FRA33_LEGITIMIST_DESC:0 "Bourbon hanedanının meşruiyet iddiasına dayanan yeni yönetim, Fransız monarşisini hanedan geleneği ve merkezi devlet otoritesi temelinde yeniden kurmayı amaçlıyor."
 WESTHEIA_FRA33_NAPOLEON_DESC:0 "Bonapartçı hareket, Napoléon VI’nın etrafında birleşerek imparatorluk geleneğini yeniden canlandırdı. Yeni rejim, güçlü yürütme ve ulusal itibarın yeniden kazanılmasını öne çıkarıyor."
 WESTHEIA_FRA33_PRINCESS_ISABELLE:0 "Prenses Isabelle"
