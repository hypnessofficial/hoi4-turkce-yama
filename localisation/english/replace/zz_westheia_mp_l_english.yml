 CW_THEY_EMBARGO_TT:0 "[THIS.GetAdjective] Ambargolarını Göster"
 CW_THEY_EMBARGO_TTL:0 "[THIS.GetNameDef] tarafından ambargo uygulanan ülkeleri görmek için tıklayın."
 CW_WE_ARE_EMBARGO_THEM:0 "\n\n§RNot:§! Bu, bizim şu anda onlara uyguladığımız ambargoyu otomatik olarak kaldırmayacaktır!"
 CZE_1933_founding_father:0 "Çekoslovakya'nın Kurucu Babası"
 CZE_1933_founding_father_desc:0 "Cumhuriyetin kuruluşuna önderlik eden Masaryk, bağımsızlığın ve parlamenter düzenin yaşayan simgesidir. Siyasi ayrılıkların üzerinde duran itibarı, genç devletin kurumlarına güven kazandırır."
 CZE_1933_great_depression:0 "Büyük Buhran"
 CZE_1933_great_depression_desc:0 "Dünya ticaretindeki daralma, ihracata dayalı ekonomimizi ağır bir bunalıma sürükledi. Fabrikalarımız sipariş bulmakta zorlanırken üretim geriliyor ve işsizlik yayılıyor. Güçlü sanayi altyapımız varlığını korusa da daralan pazarlar ve mali sıkıntılar, bu kapasiteyi tam olarak kullanmamızı engelliyor."
 CZE_1933_great_depression_recovering:0 "Hafifleyen Büyük Buhran"
 CZE_1933_great_depression_recovering_desc:0 "Korunanın devalüasyonu, ihracatçılarımız üzerindeki baskıyı hafifletti ve üretimin toparlanmasına yardımcı oldu. Ancak işsizlik, daralan pazarlar ve mali sıkıntılar tamamen ortadan kalkmış değil. Ekonomimizin yeniden güçlenmesi için yatırımların ve siparişlerin artması gerekiyor."
 CZE_1933_pragmatic_economist:0 "Pragmatik Ekonomist"
 CZE_1933_pragmatic_economist_desc:0 "Malypetr, ekonomik bunalımın yaralarını büyük vaatlerden çok uygulanabilir tedbirlerle sarmayı amaçlar. Koalisyonlar arasında uzlaşma arayan yönetim anlayışı, kamu kaynaklarının dikkatli kullanımını ve üretimin yeniden canlandırılmasını öne çıkarır."
 CZE_continue_industrial_relocation_schemes_idea_desc:0 "Silah sanayisinin tesisleri ve bakım olanakları geliştiriliyor. Üretim altyapısına ayrılan kaynaklar, askerî fabrikaların genişletilmesini ve hasarlı sanayi tesislerinin onarımını hızlandırıyor."
 CZE_tomas_masaryk_1933_advisor:0 "Tomáš G. Masaryk"
 CheckIfWhitePeaceTrue:0 "\nBu, §3Beyaz Barış§! ile sonuçlanacaktır."
 ControlledPreview:0 "\n§G+§! Kontrol ettiğimiz çekirdek olmayan eyaletlerin puanını alacağız."
 ControlledPreviewDef:0 "\n§R-§! Kontrol ettikleri çekirdek olmayan eyaletlerin puanını alacaklar."
 ControlledPreviewDefRecieve:0 "\n§G+§! Kontrol ettiğimiz çekirdek olmayan eyaletlerin puanını alacağız."
 ControlledPreviewRecieve:0 "\n§R-§! Kontrol ettikleri çekirdek olmayan eyaletlerin puanını alacaklar."
 DAN_baltic_trade_port:0 "Baltık Ticaret Limanı"
 DAN_baltic_trade_port_desc:0 "Baltık’ın ticaret yollarındaki konumu, Danzig’i canlı bir liman ve tersane merkezi yapıyor. Şehrin ağır sanayisi ise limanın ticari gücüne yetişemiyor."
 DAN_free_city_constitution:0 "Özgür Şehir Anayasası"
 DAN_free_city_constitution_desc:0 "Versailles düzeni ve Milletler Cemiyeti güvencesi, Danzig’in iç yönetimini korurken askerî gücünü sınırlar. Polonya’nın özel hakları, şehrin doğrudan ilhakı anlamına gelmez."
 DAN_league_of_nations_guarantee:0 "Milletler Cemiyeti Garantisi"
 DAN_league_of_nations_guarantee_desc:0 "Danzig’in Özgür Şehir statüsü, savaş sonrası Avrupa düzeninin bir parçası olarak Milletler Cemiyeti’nin himayesine alınmıştır. Şehrin bağımsızlığına yönelen bir saldırı, bu düzenin savunucularını da sınayacak; Londra’yı Baltık kıyısındaki krize karşı tutum almaya zorlayacaktır. Ancak Cemiyet’in otoritesi çökerse, Danzig’i koruyan bu diplomatik kalkan da ortadan kalkacaktır."
 DAN_nazi_dominated_senate:0 "Nazi Hakimiyetindeki Senato"
 DAN_nazi_dominated_senate_desc:0 "Nazi hareketinin senatodaki hâkimiyeti, Berlin ile yakınlaşmayı güçlendirirken Özgür Şehir’in siyasi bağımsızlığını ve toplumsal huzurunu aşındırıyor."
 DAN_neutral_senate_campaign:0 "Tarafsız Senato Kampanyası"
 DAN_neutral_senate_campaign_desc:0 "Polonya’nın desteğiyle yürütülen kampanya, şehrin yönetimini Berlin’in ideolojik baskısından uzaklaştırmayı amaçlıyor."
