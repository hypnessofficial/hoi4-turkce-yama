 WESTHEIA_SIK33_barter_trade_idea:0 "Düzenlenen Sovyet Takas Ticareti"
 WESTHEIA_SIK33_barter_trade_idea_desc:0 "İhracat ve takas işlemlerinin düzenlenmesi, yerel ihtiyaçların karşılanmasında sivil ekonominin üzerindeki baskıyı hafifletmektedir."
 WESTHEIA_SIK33_develop_capital:0 "Ürümqi İlini Geliştir"
 WESTHEIA_SIK33_develop_capital_desc:0 "Ürümqi çevresindeki küçük üretim işletmelerini ve ticari faaliyetleri destekleyerek eyaletin ekonomik temelini geliştireceğiz."
 WESTHEIA_SIK33_organize_soviet_barter_trade:0 "Sovyet Takas Ticaretini Düzenle"
 WESTHEIA_SIK33_organize_soviet_barter_trade_desc:0 "Sovyet pazarlarına gönderilen yün, deri ve tarım ürünleri karşılığında eyaletin ihtiyaç duyduğu mamul eşyaları temin edeceğiz. Takas işlemlerinin düzenlenmesi, tedarikteki belirsizliği azaltacak ve yerel ekonominin ihtiyaçlarının karşılanmasını kolaylaştıracaktır."
 WESTHEIA_SIK33_r5_delivery_tt:0 "Envantere §Y6 Polikarpov R-5§! eklenir."
 WESTHEIA_SIK33_r5_inventory:0 "Polikarpov R-5"
 WESTHEIA_SIK33_r5_inventory_desc:0 "Sinkiang’a teslim edilen, Sovyet tasarımı çift kanatlı keşif ve hafif bombardıman uçağı."
 WESTHEIA_SIK33_r5_inventory_legacy:0 "Polikarpov R-5"
 WESTHEIA_SIK33_r5_inventory_legacy_desc:0 "Sinkiang’a teslim edilen, Sovyet tasarımı çift kanatlı keşif ve hafif bombardıman uçağı."
 WESTHEIA_SIK33_road_construction_idea:0 "Ürümqi–İli Yol Çalışmaları"
 WESTHEIA_SIK33_road_construction_idea_desc:0 "Yol yapımı, araç tedariki ve bakım faaliyetlerinin ortak planlanması, eyaletin ulaşım yatırımlarının daha hızlı yürütülmesini sağlamaktadır."
 WESTHEIA_SIK_jin_shuren:0 "Jin Shuren"
 WESTHEIA_SND_develop_shandong:0 "Shandong İlini Geliştir"
 WESTHEIA_SND_develop_shandong_desc:0 "Başkent çevresindeki yerel işletmelere ve üretim tesislerine yatırım yaparak Shandong’un sanayi temelini genişleteceğiz. Kırsal kalkınma çalışmalarını kentlerdeki imalat ve ticaretle birleştirmek, eyalet ekonomisini daha dayanıklı hâle getirecektir."
 WESTHEIA_SND_support_zouping_experiment:0 "Zouping Kırsal Kalkınma Deneyini Destekle"
 WESTHEIA_SND_support_zouping_experiment_desc:0 "Zouping’de yürütülen kırsal kalkınma çalışmalarını destekleyerek yerel idare, eğitim ve üretim arasındaki bağları güçlendireceğiz. Köylerin ihtiyaçlarını eyalet yönetimine ulaştıran bu deney, daha geniş kalkınma çalışmalarımız için sağlam bir temel oluşturacaktır."
 WESTHEIA_SOV33_convene_seventeenth_party_congress:0 "XVII. Parti Kongresini Topla"
 WESTHEIA_SOV33_convene_seventeenth_party_congress_desc:0 "Parti delegeleri Moskova'da bir araya gelerek İkinci Beş Yıllık Plan'ın hedeflerini ve Sovyet sanayisinin önceliklerini görüşecek."
