 WESTHEIA_YUG33_imported_inventory_legacy:0 "İthal Uçak Envanteri"
 WESTHEIA_YUG33_imported_inventory_legacy_desc:0 "Hava kuvvetlerinde kullanılan ithal uçaklar."
 WESTHEIA_YUG33_indigenous_designs:0 "Yugoslav Yerli Tasarımları"
 WESTHEIA_YUG33_indigenous_designs_desc:0 "Ikarus, Rogožarski ve Zmaj çevresinde biriken mühendislik deneyimi, yabancı uçakların bakım ve lisans üretiminden özgün tasarımlara geçişin temelini oluşturuyor. Yerli tasarım bürolarının çalışmaları havacılık araştırmalarımızı hızlandırıyor."
 WESTHEIA_YUG33_lozovac_aluminium:0 "Lozovac Alüminyum Tesisini Kur"
 WESTHEIA_YUG33_lozovac_aluminium_desc:0 "Dalmaçya boksit yatakları yalnızca ihraç edilen bir cevher kaynağı olarak kalmamalı. Šibenik yakınlarındaki Lozovac’ta kurulacak işleme tesisiyle alüminyum sanayimizi geliştirecek ve yerli üretime yeni bir temel kazandıracağız."
 WESTHEIA_YUG33_regularize_dinar:0 "Dinarın Kurunu Düzenle"
 WESTHEIA_YUG33_regularize_dinar_desc:0 "Dinarın resmî değeri ile dış ticarette kullanılan döviz kurları arasındaki fark, işletmelerin hesaplarını ve kredi ilişkilerini zorlaştırıyor. Kur uygulamalarını düzenleyerek dış ticareti canlandırmalı ve tarım ile bankacılık krizinin sanayi üzerindeki baskısını hafifletmeliyiz."
 WESTHEIA_YUG33_restructure_peasant_debts:0 "Çiftçi Borçlarını Yeniden Yapılandır"
 WESTHEIA_YUG33_restructure_peasant_debts_desc:0 "Tarımsal fiyatların düşüşü köylüleri ödeyemeyecekleri borçlarla karşı karşıya bıraktı. Borçların bir bölümünü silip kalan ödemeleri uzun vadeye yayarak çiftçilerin yeniden üretime katılmasını ve bankaların kredi açabilmesini sağlayacağız."
