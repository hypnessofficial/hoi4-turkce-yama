 WESTHEIA_SIA33_rice_export_crisis:0 "Pirinç İhracatında Kriz"
 WESTHEIA_SIA33_rice_export_crisis_desc:0 "Dünya piyasalarında pirinç fiyatlarının düşmesi, Siyam'ın başlıca ihracat gelirini aşındırmıştır. Ürünlerini satmaya devam eden çiftçiler borçlarını ve vergilerini ödemekte zorlanırken, daralan devlet gelirleri yatırımları sınırlandırmaktadır. Ekonomik toparlanma, kırsal kesimin yükünü hafifletmeye ve ihracat gelirlerini yeniden güçlendirmeye bağlıdır."
 WESTHEIA_SIA33_rice_export_recovery:0 "Pirinç İhracatında Toparlanma"
 WESTHEIA_SIA33_rice_export_recovery_desc:0 "Tarım vergilerinin hafifletilmesi, pirinç fiyatlarındaki düşüşün çiftçiler üzerindeki baskısını azaltmıştır. Ancak ihracat gelirleri ve devletin yatırım olanakları henüz eski düzeyine ulaşmamıştır. Kalıcı toparlanma için ihracatı canlandırmalı veya ekonomimizi çeşitlendirmeliyiz."
 WESTHEIA_SIA_INDEPENDENT_1933:0 "Bağımsız"
 WESTHEIA_SIA_KHANA_MILITARY_1933:0 "Khana Ratsadon - Askerî"
 WESTHEIA_SIA_MANOPAKORN_1933:0 "Phraya Manopakorn Nitithada"
 WESTHEIA_SIC33_coordinate_public_works:0 "Bayındırlık Çalışmalarını Eşgüdümle"
 WESTHEIA_SIC33_coordinate_public_works_desc:0 "Yerel idarelerin yol ve altyapı çalışmalarını ortak bir düzen içinde yürüteceğiz. Farklı askerî bölgeler arasındaki ulaşımın iyileştirilmesi, eyaletin ticaretine ve kamu hizmetlerine katkı sağlayacaktır."
 WESTHEIA_SIC33_develop_sichuan:0 "Sichuan İlini Geliştir"
 WESTHEIA_SIC33_develop_sichuan_desc:0 "Chongqing çevresindeki üretim ve ticaret faaliyetlerini yeni yatırımlarla güçlendireceğiz. Yerel işletmelerin gelişmesini desteklemek, Sichuan’ın ekonomik temelini genişletecektir."
 WESTHEIA_SIC33_public_works_programme:0 "Eşgüdümlü Bayındırlık Çalışmaları"
 WESTHEIA_SIC33_public_works_programme_desc:0 "Yerel makamların ortak planlaması, yol ve altyapı yatırımlarında kaynakların daha düzenli kullanılmasını sağlamaktadır."
