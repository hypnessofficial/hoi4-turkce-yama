 OCfA_lower_conscription_decision:0 "Askerlik Gerekliliklerini Azalt"
 OCfA_lower_conscription_decision_desc:0 "Savaş sona erdi ve halk normal hayatına dönmek istiyor. Askerlik yasalarımızı düşürerek erkekleri ailelerine geri gönderebilir ve toplumumuz üzerindeki yükü azaltabiliriz. Bu, barış zamanında yasaları manuel olarak değiştirmekten çok daha ucuzdur."
 OCfA_lower_economy_decision:0 "Sivil Üretime Geçiş"
 OCfA_lower_economy_decision_desc:0 "Fabrikalarımız hâlâ tamamen silah ve tank üretimine odaklanmış durumda. Ekonomimizi düzeltmek için vatandaşlarımız için yeniden mal üretmeye başlamalıyız. Bu program sanayimizin yeniden sivil düzene geçmesine yardımcı olacak."
 OCfA_military_committees:0 "Asker Komiteleri"
 OCfA_military_committees_desc:0 "Askerler liderlerine karşı örgütleniyor. Bu durum orduyu yönetmeyi çok zorlaştırıyor."
 OCfA_mob_breakdown_desc:0 "§HSanayi Seferberliği:§!\n - Mevcut Tüketim Malları: [?OCfA_current_cg_total|%Y]\n - Sanayi Verimliliği: [?OCfA_econ_efficiency_factor|%G]\n\n§LYüksek tüketim malı ihtiyacı tabur kapasitenizin verimliliğini azaltır. Cephede tam tabur kapasitenizi kullanabilmek için ekonominizi seferber edin.§!\n\n"
 OCfA_mob_disabled_desc:0 ""
 OCfA_opereation_capacity_dynamic_modifier:0 "Konuşlandırılmış Tabur Kapasitesi"
 OCfA_propaganda_delay_demob:0 "Ulusal Savunma Kampanyası"
 OCfA_propaganda_delay_demob_desc:0 "Hükümet, ordunun neden hazır durumda kalması gerektiğini açıklamak için haberleri ve halka açık konuşmaları kullanacak. Diğer ülkelerden gelen tehditlere odaklanarak kuvvetlerimizi terhis etme yönündeki baskıyı geciktirebiliriz."
 OCfA_propaganda_delay_demob_tt:0 "Halk desteği zamanla azalır. Her kullanım §YSiyasi Güç maliyetini§! §Y50§! artırır."
 OCfA_reintegration_program:0 "Gazi Destek Programı"
 OCfA_reintegration_program_desc:0 "Eski askerlerin ev ve iş bulmasına yardımcı olmak için az miktarda kaynak harcayabiliriz. Bu halkı memnun eder, ancak gelecekteki çatışmalara hazırlığımızı biraz azaltabilir."
 OCfA_upkeep_desc:0 "§HAskerî-Sanayi Kompleksi Bakımı:§!\n - Yük Faktörü: [?OCfA_infra_strain|Y2]\n\n§LAskerî-sanayi kompleksinizin devasa ölçeği idari sorunlar yaratır. Geniş kapsamlı bir askerî ekonomiyi sürdürmenin maliyetini simüle etmek için verimliliğiniz bu faktöre bölünür.§!\n\n"
 OCfA_upkeep_none:0 ""
 PAR_1933_chaco_cost_veterans:0 "$BOL_toll_of_the_chaco_war$"
 PAR_1933_chaco_cost_veterans_2:0 "$BOL_toll_of_the_chaco_war_2$"
 PAR_1933_chaco_cost_veterans_2_desc:0 "$BOL_toll_of_the_chaco_war_2_desc$"
 PAR_1933_chaco_cost_veterans_desc:0 "$BOL_toll_of_the_chaco_war_desc$"
 PAR_1933_end_the_chaco_war:0 "Chaco Savaşını Bitir"
 PAR_1933_end_the_chaco_war_desc:0 "Chaco'daki savaş halkımızın gücünü ve ülkemizin sınırlı kaynaklarını tüketiyor. Silahları susturmak ve anlaşmazlığı müzakere masasına taşımak için Bolivya hükûmetiyle temasa geçmeliyiz."
 PAR_1933_forget_chaco:0 "Chaco'yu Unut"
 PAR_1933_forget_chaco_desc:0 "Chaco üzerindeki anlaşmazlığın ülkemizin geleceğini belirlemesine artık izin veremeyiz. Savaşın yaralarını sarmalı ve çabalarımızı ülkemizin yeniden yapılanmasına yöneltmeliyiz."
 PAR_1933_leave_the_league_of_nations:0 "Milletler Cemiyeti'nden Çekil"
 PAR_1933_leave_the_league_of_nations_desc:0 "Chaco anlaşmazlığında Milletler Cemiyeti'nin tutumuna duyduğumuz güven sarsıldı. Ulusal çıkarlarımızı savunmak için cemiyet üyeliğimizi sona erdirmeliyiz."
 PAR_1933_settle_bolivian_border:0 "Bolivya ile Sınırlarda Temelli Anlaş"
 PAR_1933_settle_bolivian_border_desc:0 "Kalıcı bir sınır düzeni için Bolivya ile diplomatik temasları yeniden başlatmalıyız. Karşılıklı bir saldırmazlık paktı, yeni bir savaş korkusu olmadan anlaşmazlıklarımızı çözmemizi sağlayacaktır."
 PAR_felix_paiva_1933:0 "Félix Paiva"
 PAY_CIV_FACTORY_ACTION_DESC:0 "Hedef ülkeye bir sivil fabrika gönder."
 PAY_CIV_FACTORY_TITLE:0 "Sivil Fabrika Gönder"
 PAY_DOCKYARD_ACTION_DESC:0 "Hedef ülkeye bir tersane gönder."
 PAY_DOCKYARD_TITLE:0 "Tersane Gönder"
 PAY_MIL_FACTORY_ACTION_DESC:0 "Hedef ülkeye bir askerî fabrika gönder."
 PAY_MIL_FACTORY_TITLE:0 "Askerî Fabrika Gönder"
 PER_1933_renegotiate_oil_concession:0 "Petrol İmtiyazını Yeniden Müzakere Et"
 PER_1933_renegotiate_oil_concession_desc:0 "D’Arcy imtiyazının iptali, Britanya ile aramızdaki petrol anlaşmazlığını uluslararası bir krize dönüştürdü. Şirketin ayrıcalıkları ve ülkemizin petrol gelirleri için yeniden masaya oturmalı, egemenlik taleplerimiz ile devletin mali ihtiyaçları arasında bir uzlaşma aramalıyız. Yeni bir anlaşma krizi yatıştırabilir; ancak yabancı şirketin petrol sektörümüzdeki ağırlığı sürecektir."
 PER_1933_visit_ankara:0 "Ankara’ya Ziyaret"
 PER_1933_visit_ankara_desc:0 "Türkiye ile gelişen ilişkilerimizi bir devlet ziyaretiyle pekiştirelim. Rıza Şah’ın Ankara’da Mustafa Kemal Atatürk ile yapacağı görüşmeler, komşularımızla güveni artırırken Türkiye’nin modernleşme tecrübelerini yakından incelememizi sağlayacaktır."
 PER_anglo_iranian_oil_1933_ns:0 "Anglo-İran Petrol Şirketi"
 PER_anglo_iranian_oil_1933_ns_desc:0 "Petrol imtiyazının iptali Britanya ve petrol şirketiyle ilişkilerimizi bir çıkmaza sürükledi. Gelirler üzerindeki belirsizlik ve dış baskı ekonomimiz üzerindeki yükü ağırlaştırıyor. İmtiyazı yeniden müzakere ederek krizin ek yükünü hafifletebiliriz; şirketin mevcut ayrıcalıkları ise devam edecektir."
 POL33_romanian_p11_order:0 "Romanya Avcı Uçağı Siparişi"
 POL33_romanian_p11_order_desc:0 "Romanya’nın verdiği PZL avcı uçağı siparişi, havacılık sanayimizin üretimini ve ihracat gelirlerini desteklemektedir."
 POLITICS_MEGIE_DESC:0 "Megie I, İspanya'nın hükümdarıdır."
 POL_1933_iron_fisted_marshal:0 "Demir Yumruklu Mareşal"
 POL_1933_iron_fisted_marshal_desc:0 "Bağımsızlık mücadelesinin ve 1920 zaferinin otoritesini arkasına alan Piłsudski, ordunun sadakatiyle siyasetin üzerinde durur. Sanacja düzeninin tartışmasız ağırlık merkezi olan Mareşal, devletin gücünü disiplin ve kararlı bir yönetimde görür."
 POL_committee_of_national_liberation_idea_desc:0 "[WESTHEIA_POL33_Text_POL_committee_of_national_liberation_idea_desc]"
 POR_1933_complete_alfeite:0 "Alfeite Tersanesini Tamamla"
 POR_1933_complete_alfeite_desc:0 "Alfeite’deki çalışmaların son aşamasını tamamlayarak yeni tersane tesislerini filonun hizmetine sunalım."
 POR_1933_economic_reconstruction_idea:0 "Ekonomik Yeniden Yapılanma Programı"
 POR_1933_economic_reconstruction_idea_desc:0 "Kamu yatırımlarının ortak bir programla yürütülmesi, inşaat faaliyetlerini hızlandırıyor."
 POR_1933_economic_reconstruction_law:0 "Ekonomik Yeniden Yapılanma Yasasını Çıkar"
 POR_1933_economic_reconstruction_law_desc:0 "Uzun vadeli kamu yatırımlarını ortak bir program altında toplayalım. Ulaşım, tarım ve devlet tesislerine ayrılan kaynaklar ekonomik yeniden yapılanmanın temelini oluşturacak."
 POR_1933_enact_constitution:0 "1933 Anayasasını Yürürlüğe Koy"
 POR_1933_enact_constitution_desc:0 "Yeni anayasa, askerî diktatörlüğün ardından Estado Novo’nun kurumsal çerçevesini oluşturacaktır. Devletin yeni hukuki düzeni, ülkenin siyasi geleceğine ilişkin mücadeleyi şekillendirecektir."
 POR_1933_estado_novo_idea_name:0 "Estado Novo"
 POR_1933_estado_novo_idea_name_desc:0 "Estado Novo’nun korporatif kurumları, devletin ekonomik ve siyasi örgütlenmesini biçimlendiriyor."
 POR_1933_national_labour_statute_idea:0 "Ulusal Çalışma Statüsü"
 POR_1933_national_labour_statute_idea_desc:0 "Yeni çalışma düzeninin kurumları, üretim ve toplumsal örgütlenme üzerinde devletin denetimini artırıyor."
 POR_1933_regime_institutionalization:0 "Rejimin Kurumsallaşması"
 POR_1933_regime_institutionalization_desc:0 "Yeni anayasa yönetimin hukuki çerçevesini belirledi. Ancak devlet aygıtının yeniden örgütlenmesi kaynak tüketiyor ve ekonomik yatırımları yavaşlatıyor."
