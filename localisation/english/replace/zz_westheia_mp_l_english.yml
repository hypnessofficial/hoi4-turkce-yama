 britain_dominion_exile.1.desc:0 "[ENG.GetLeader] hükümeti, Kraliyet Ailesi'nin kalıntılarıyla birlikte başkentimize çıktı. Sürgündeki bir hükümet kurarak artık İngiliz Milletler Topluluğu için yürütülen savaş çabalarının liderleriyiz. [ENG.GetLeader] tavsiyelerde bulunsa da, [ROOT.GetLeader] ittifakın hem resmi hem de fiili lideridir."
