 WESTHEIA_MEX_1933_PRESIDENT_ELECT_TT:0 "Lázaro Cárdenas başkan seçilir. Abelardo L. Rodríguez, 1 Aralık 1934 tarihindeki görev devrine kadar ülkeyi yönetmeye devam eder."
 WESTHEIA_MEX_1933_adopt_six_year_plan:0 "Altı Yıllık Planı Kabul Et"
 WESTHEIA_MEX_1933_adopt_six_year_plan_desc:0 "PNR'nin Aralık 1933 kongresinde belirlenen altı yıllık program; kırsal kalkınma, kamu yatırımları ve ekonomik toparlanmaya yön verecek. Siyasi yollarımızı seçmeden önce devletin uzun vadeli kalkınma programını kabul edelim."
 WESTHEIA_MEX_1933_establish_petromex:0 "Petromex'i Kur"
 WESTHEIA_MEX_1933_establish_petromex_desc:0 "Petróleos de México, devlet ve yerli özel sermayeyi bir araya getirerek iç pazara yakıt sağlama kapasitesini geliştirecek. Bu girişim petrol sahalarının bütünüyle millîleştirilmesi değildir; yakıt rafinasyonu bilgisinin geliştirilmesine odaklanır."
 WESTHEIA_MEX_1933_nafinsa_credit:0 "Nacional Financiera Kredileri"
 WESTHEIA_MEX_1933_nafinsa_credit_desc:0 "Mali sistemdeki varlıkların değerlendirilmesi, bir yıl boyunca ekonomik toparlanmanın üzerindeki yükü hafifletiyor."
 WESTHEIA_MEX_1933_national_minimum_wage:0 "Ulusal Asgari Ücreti Uygula"
 WESTHEIA_MEX_1933_national_minimum_wage_desc:0 "Yerel ücret tespit çalışmalarını ülke çapında uygulamaya geçirerek çalışanlar için bir taban ücret sağlayalım. Düzenlemenin amacı geçim koşullarını iyileştirmek ve toplumsal güveni güçlendirmektir."
 WESTHEIA_MEX_1933_six_year_plan:0 "Altı Yıllık Plan"
 WESTHEIA_MEX_1933_six_year_plan_desc:0 "Altı yıl boyunca kamu yatırımlarını ve üretken kapasitenin genişlemesini destekleyen ulusal kalkınma programı."
 WESTHEIA_MEX_azcarate_cas_inventory:0 "Corsario Azcárate O2U-4A (Bombardeo)"
 WESTHEIA_MEX_azcarate_cas_inventory_desc:0 "Meksika’da Amerikan lisansıyla üretilmiş O2U-4A. Tek Wasp motoru, sabit tüfek kalibreli makineli tüfek, gözlemci mevzisinde çift makineli tüfek ve hafif bomba askıları taşır. Bu varyant kara desteği görev düzenini temsil eder."
