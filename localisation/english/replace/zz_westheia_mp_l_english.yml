 CAN_1933_bank_of_canada:0 "Kanada Merkez Bankası"
 CAN_1933_bank_of_canada_desc:0 "Kredi ve para dolaşımını düzenlemek ve ülkenin ekonomik istikrarını desteklemek amacıyla kurulan Kanada Merkez Bankası."
 CAN_1933_banking_and_currency_commission:0 "Bankacılık ve Para Komisyonu"
 CAN_1933_banking_and_currency_commission_desc:0 "Büyük Buhran, bankacılık sistemimizin ve para düzenimizin yeterliliğini tartışmaya açtı. Uzmanlardan oluşan bir kraliyet komisyonu, kredi ve para politikasının ülkenin ihtiyaçlarına nasıl cevap verebileceğini incelemelidir."
 CAN_1933_banking_commission_relief:0 "Bankacılık ve Para Düzenlemeleri"
 CAN_1933_banking_commission_relief_desc:0 "Bankacılık ve Para Komisyonunun çalışmaları, kredi ve kamu maliyesinin düzenlenmesine yönelik geçici tedbirlerin önünü açtı."
 CAN_1933_bennetts_new_deal:0 "Bennett’in Yeni Düzenini İlan Et"
 CAN_1933_bennetts_new_deal_desc:0 "Ekonomik bunalım karşısında mevcut politikaların yeterliliği sorgulanıyor. Bennett, çalışma koşullarını ve sosyal güvenceyi iyileştirmeyi amaçlayan bir reform programıyla federal hükümetin sorumluluğunu yeniden tanımlamayı öneriyor."
 CAN_1933_bennetts_new_deal_idea:0 "Bennett'in Yeni Düzeni"
 CAN_1933_bennetts_new_deal_idea_desc:0 "Bennett'in reform programı ekonomiye yeni bir yön vermeyi amaçlıyor. Federal müdahalenin kapsamı ve reformların uygulanması üzerindeki tartışmalar siyasi gerilimi artırıyor. Bennett hükümetin başından ayrıldığında bu program da sona erecek."
 CAN_1933_conservative_reformer:0 "Muhafazakar Reformcu"
 CAN_1933_conservative_reformer_desc:0 "Bennett, ekonomik bunalım karşısında geleneksel muhafazakâr ilkeleri devletin daha etkin rol üstlendiği tedbirlerle bağdaştırmaya çalışır. Kamu kaynaklarını üretime yöneltmek ve halkın güvenini korumak, yönetiminin başlıca hedefleridir."
 CAN_1933_establish_bank_of_canada:0 "Kanada Merkez Bankasını Kur"
 CAN_1933_establish_bank_of_canada_desc:0 "Bankacılık ve Para Komisyonunun çalışmaları, ulusal bir merkez bankasının kurulmasına zemin hazırladı. Kredi ve para dolaşımını düzenleyecek bu kurum, Kanada ekonomisinin istikrarını güçlendirmelidir."
 CAN_1933_improve_relief_camps:0 "İşsizlere Yardım Kamplarını İyileştir"
 CAN_1933_improve_relief_camps_desc:0 "İşsiz erkeklere barınma ve çalışma imkânı sağlayan yardım kamplarındaki ağır koşullar hoşnutsuzluğu artırıyor. Çalışma düzenini ve yaşam koşullarını iyileştirerek yardım sistemine duyulan güveni yeniden kazanmalıyız."
 CAN_1933_relief_camps:0 "İyileştirilmiş Yardım Kampları"
 CAN_1933_relief_camps_concessions:0 "Yardım Kampı İşçileriyle Uzlaşma"
 CAN_1933_relief_camps_concessions_desc:0 "Hükümet, Ottawa'ya yürüyen işçilerin taleplerini kabul ederek yardım programını genişletti. Daha kapsamlı sosyal destek toplumsal güveni güçlendirirken kamu harcamalarını ve üretim üzerindeki yükü artırıyor."
 CAN_1933_relief_camps_desc:0 "Yardım kamplarında çalışma ve yaşam koşullarının iyileştirilmesi, işsizlerin ve ailelerinin üzerindeki baskıyı hafifletiyor. Programın maliyeti ile çalışma düzenine getirilen sınırlamalar üretime yansıyor."
 CAN_1933_us_trade_agreement:0 "ABD ile Ticaret Anlaşması"
 CAN_1933_us_trade_agreement_desc:0 "Amerikan pazarıyla ticari bağlarımızı geliştirmek üzere hazırlanan düzenlemeler, kaynak ve sanayi politikalarımızı yeniden şekillendiriyor."
 CESEC_ENTRY_NAME:0 "$GROUP_NAME$ $LEVEL|H$"
