 WESTHEIA_PER_POLITICAL_PATHS_1936_TT:0 "1 Ocak 1936 veya daha sonraki bir tarihte olunmalı."
 WESTHEIA_PHI_1933_accept_tydings_mcduffie:0 "Tydings–McDuffie Düzenlemesini Kabul Et"
 WESTHEIA_PHI_1933_accept_tydings_mcduffie_desc:0 "Amerika Birleşik Devletleri tarafından kabul edilen düzenleme, bir geçiş yönetimi ve gelecekteki bağımsızlık için anayasal çerçeve sunuyor. Bu yolu kabul ederek kurumlarımızı hazırlayalım."
 WESTHEIA_PHI_1933_old_guard:0 "Eski Muhafız"
 WESTHEIA_PHI_1933_old_guard_desc:0 "Askerî hizmet ve sömürge yönetimi tecrübesini disiplinli bir idare anlayışıyla birleştirir."
 WESTHEIA_PHI_1933_ratify_constitution:0 "1935 Anayasasını Onayla"
 WESTHEIA_PHI_1933_ratify_constitution_desc:0 "Yeni anayasa, Milletler Topluluğu yönetiminin yapısını ve vatandaşların haklarını belirliyor. Halkoylamasıyla onaylanan düzeni uygulamaya hazırlanalım."
 WESTHEIA_PHI_colonial_administration:0 "Amerikan Sömürge İdaresi"
 WESTHEIA_PHI_colonial_security_desc:0 "Yerel güvenlik esas olarak adalara dağılmış Constabulary birliklerine dayanıyor. Düzenli bir ulusal ordunun kurulması için yeni bir savunma teşkilatı gerekiyor."
 WESTHEIA_PHI_colonial_security_name:0 "Sömürge Güvenlik Teşkilatı"
 WESTHEIA_PHI_frank_murphy:0 "Frank Murphy"
 WESTHEIA_PHI_quezon_handover_tt:0 "Manuel L. Quezon seçilmiş başkan olur. Genel vali, §Y15 Kasım 1935§! tarihindeki görev devrine kadar yönetimde kalır."
 WESTHEIA_PHI_regular_army_desc:0 "Filipinler’in kara kuvvetleri, ana adaların savunulması ve yeni birliklerin yetiştirilmesinden sorumludur."
 WESTHEIA_PHI_regular_army_name:0 "Filipin Ordusu"
 WESTHEIA_PHI_sakdal_closed_tt:0 "Uzlaşma yolunda §YSakdalistaları Yeniden İnşa Et§! odağı açılmaz."
 WESTHEIA_PHI_sakdal_rebuild_requirement_tt:0 "Sakdal Ayaklanması eventinde ayaklanmayı bastırma seçeneği seçilmiş olmalı."
 WESTHEIA_PHI_sakdal_unlocked_tt:0 "§YSakdalistaları Yeniden İnşa Et§! odağı kalıcı olarak açılır."
 WESTHEIA_PHI_theodore_roosevelt_jr:0 "Theodore Roosevelt Jr."
 WESTHEIA_POL33_NATIVE_POL_armia_ludowa:0 "Armia Ludowa (Halk Ordusu)"
 WESTHEIA_POL33_NATIVE_POL_armia_ludowa_desc:0 "Yabancı emperyalistleri silah gücüyle yenemeyiz, ancak ne olursa olsun mücadelede ölmeye istekli solcu militanları örgütleyebiliriz. Armia Ludowa'yı partimizin askerî kolu olarak kurarak, sosyalist devrimimizin hırslarına sadık bir orduya her zaman sahip olacağımızı garanti edeceğiz!"
 WESTHEIA_POL33_NATIVE_POL_committee_of_national_liberation:0 "Ulusal Kurtuluş Komitesi"
 WESTHEIA_POL33_NATIVE_POL_committee_of_national_liberation_desc:0 "Almanya ve Rusya arasında sıkışmış, onların emperyalist entrikalarına maruz kalmış tehlikeli bir konumdayız. Ulusal Kurtuluş Komitesi'nin kurulmasıyla, tüm kuşatılmış Polonyalılar direniş faaliyetlerini organize etmek için merkezi bir otoriteye sahip olacak."
 WESTHEIA_POL33_NATIVE_POL_committee_of_national_liberation_idea:0 "Ulusal Kurtuluş Komitesi"
 WESTHEIA_POL33_NATIVE_POL_committee_of_national_liberation_idea_desc:0 ""
 WESTHEIA_POL33_NATIVE_POL_complete_april_constitution:0 "Nisan Anayasasını Tamamla"
 WESTHEIA_POL33_NATIVE_POL_complete_april_constitution_desc:0 "Nisan Anayasası, Polonya'yı Başkan altında daha merkezi bir otoriter rejime dönüştürmek için tasarlanmış bir dizi reformdur. Sanation hükûmeti bu mevzuatla meşrulaştırılmıştır, ancak hala eski sistemi özleyenler var. Nisan Anayasası tamamlanmalı ve [GetAppropriateLeaderNameInBookmark]'in yetkilerini daha da artırmak ve Polonya devletini merkezileştirmek için değiştirilmelidir!"
 WESTHEIA_POL33_NATIVE_POL_import_submarine_technology:0 "ORP Orzeł"
 WESTHEIA_POL33_NATIVE_POL_import_submarine_technology_desc:0 "Modern deniz savaşı hem dalgaların üstünde hem de altında kazanılır ve eğer Almanya'nın U-botlarıyla rekabet etmek istiyorsak, orijinal Polonya denizaltıları tasarlamalı ve dağıtmalıyız."
 WESTHEIA_POL33_NATIVE_POL_light_bomber_focus:0 "Hafif Bombardıman Uçağı Odağı"
 WESTHEIA_POL33_NATIVE_POL_light_bomber_focus_desc:0 "Yakın hava desteği için pike bombardıman uçakları kullanmanın değeri küçümsenmemelidir."
 WESTHEIA_POL33_NATIVE_POL_study_foreign_built_ships:0 "Britanya Gemi Tasarımlarını İncele"
 WESTHEIA_POL33_NATIVE_POL_study_foreign_built_ships_desc:0 "Britanya donanması on yıllardır Polonya'nın müttefikiydi, ancak son zamanlarda Britanya'nın yatıştırma politikası Polonya'yı güvenecek dostu olmayan istikrarsız bir konuma sokuyor. Belki de İngilizlerin tasarımlarını inceleyerek, eşit verimlilikte ve görkemde gemiler üretmeye başlayabiliriz."
 WESTHEIA_POL33_NATIVE_POL_warsaw_main_railway_station:0 "Varşova Ana Tren İstasyonu"
 WESTHEIA_POL33_NATIVE_POL_warsaw_main_railway_station_desc:0 "Varşova, bir ulaşım ve kargo merkezidir. Darboğazları önlemek için, demiryolunun yönetimine ekstra çaba gösterilmelidir."
 WESTHEIA_POL33_NEW_POL_armia_ludowa:0 "Halk Ordusunu Kur"
 WESTHEIA_POL33_NEW_POL_armia_ludowa_desc:0 "Yeni yönetimi savunacak bir halk ordusu örgütlemeliyiz. İşçi ve köylüler arasından gönüllüler toplayarak onları düzenli birlikler halinde eğitecek ve ortak bir komuta altında birleştireceğiz."
 WESTHEIA_POL33_NEW_POL_committee_of_national_liberation:0 "Devrim Komitesini Kur"
 WESTHEIA_POL33_NEW_POL_committee_of_national_liberation_desc:0 "İşçi ve köylü hareketinin temsilcilerini ortak bir devrim komitesinde birleştirelim. Bu örgüt, yeni yönetimin kararlarını koordine edecek ve halkın taleplerinin devlet kurumlarına taşınmasını sağlayacaktır."
 WESTHEIA_POL33_NEW_POL_committee_of_national_liberation_idea:0 "Devrim Komitesi"
 WESTHEIA_POL33_NEW_POL_committee_of_national_liberation_idea_desc:0 "İşçi ve köylü örgütlerinin temsilcileri, yeni yönetimin çalışmalarını ortak bir komite aracılığıyla koordine ediyor. Yerel örgütlerle devlet kurumları arasındaki bu bağ, halkın siyasi katılımını ve yönetimin toplumsal desteğini güçlendiriyor."
 WESTHEIA_POL33_NEW_POL_complete_april_constitution:0 "Nisan Anayasasını Uygula"
 WESTHEIA_POL33_NEW_POL_complete_april_constitution_desc:0 "Yeni anayasa yürürlüğe girdi, ancak devlet kurumlarının yeni düzene uyarlanması henüz tamamlanmadı. Piłsudski’nin ardından ortaya çıkan iktidar mücadelesini yönetirken anayasanın öngördüğü idari düzeni işler hale getirmeliyiz."
 WESTHEIA_POL33_NEW_POL_import_submarine_technology:0 "Denizaltı Teknolojisi İthal Et"
 WESTHEIA_POL33_NEW_POL_import_submarine_technology_desc:0 "Wilk sınıfının hizmet deneyimi, gelecekteki denizaltılarımızın ihtiyaçlarını ortaya koyuyor. Yabancı tersanelerin tasarım ve üretim yöntemlerini inceleyerek yeni denizaltı projelerimizin teknik temelini güçlendirelim."
 WESTHEIA_POL33_NEW_POL_light_bomber_focus:0 "Ordu Destek Bombardıman Uçağı Geliştir"
 WESTHEIA_POL33_NEW_POL_light_bomber_focus_desc:0 "Kara birliklerimizi destekleyecek uçaklar hem keşif yapabilmeli hem de düşmanın mevzilerini ve ikmal hatlarını bombalayabilmelidir. PZL.23 çizgisindeki hafif keşif ve bombardıman uçaklarının geliştirilmesine öncelik verelim."
 WESTHEIA_POL33_NEW_POL_study_foreign_built_ships:0 "Yabancı Gemi Tasarımlarını İncele"
 WESTHEIA_POL33_NEW_POL_study_foreign_built_ships_desc:0 "Fransa’da inşa edilen Wicher sınıfı muhripler ve Wilk sınıfı denizaltılar filomuzun temelini oluşturuyor. Bu gemilerden edindiğimiz deneyimi, Britanya ve diğer yabancı tersanelerin tasarımlarını inceleyerek geliştirelim."
 WESTHEIA_POL33_NEW_POL_warsaw_main_railway_station:0 "Varşova Demiryolu Düğümünü Genişlet"
 WESTHEIA_POL33_NEW_POL_warsaw_main_railway_station_desc:0 "Varşova’daki yeni merkez garın ve şehir içinden geçen demiryolu bağlantısının inşası sürüyor. Peronları, bağlantı hatlarını ve yük taşımacılığını geliştirerek başkentin ülkenin diğer bölgeleriyle ulaşımını güçlendirelim."
 WESTHEIA_POL33_central_industrial_region:0 "Merkezi Sanayi Bölgesini Kur"
 WESTHEIA_POL33_central_industrial_region_desc:0 "Vistül ve San nehirleri arasındaki güvenli iç bölgelerde sanayi yatırımlarını yoğunlaştıralım. Kraków ve Rzeszów çevresindeki üretim ve enerji altyapısını geliştirerek yeni silah fabrikalarının ihtiyaç duyduğu temeli sağlayacağız."
 WESTHEIA_POL33_employment_fund:0 "İş Fonu’nu Kur"
 WESTHEIA_POL33_employment_fund_desc:0 "İşsizliğin ağırlaştırdığı toplumsal sıkıntılara karşı kamu işlerini finanse edecek bir İş Fonu oluşturalım. Yol, demiryolu ve diğer altyapı yatırımları hem iş sağlayacak hem de ekonomik toparlanmanın önünü açacaktır."
 WESTHEIA_POL33_four_year_plan:0 "Dört Yıllık Plan"
 WESTHEIA_POL33_four_year_plan_desc:0 "Erken toparlanma yatırımlarının üzerine kapsamlı bir sanayi programı inşa etmeliyiz. Kwiatkowski’nin dört yıllık yatırım planı, iç pazarı genişletirken üretim kapasitemizi ve ülkenin savunma gücünü artıracaktır."
 WESTHEIA_POL33_german_polish_non_aggression:0 "Alman-Polonya Saldırmazlık Bildirisini Müzakere Et"
 WESTHEIA_POL33_german_polish_non_aggression_desc:0 "Almanya ile aramızdaki anlaşmazlıklar sınırlarımız üzerinde sürekli bir baskı oluşturuyor. Berlin ile doğrudan görüşerek uyuşmazlıkları barışçıl yollarla çözmeyi ve karşılıklı güç kullanımından kaçınmayı öngören bir bildiri hazırlayalım."
 WESTHEIA_POL33_pact_focus_required_tt:0 "§YAlman-Polonya Saldırmazlık Bildirisini Müzakere Et§! odağı tamamlanmış olmalı."
 WESTHEIA_POL33_political_open_tt:0 "Piłsudski’nin ölümünün ardından Sanacja içindeki rekabet başlamış olmalı."
 WESTHEIA_POL33_public_works:0 "İş Fonu Kamu Yatırımları"
 WESTHEIA_POL33_public_works_desc:0 "İş Fonu’nun finanse ettiği kamu işleri, işsizlere istihdam sağlarken yol ve ulaşım altyapısının daha hızlı genişletilmesine yardımcı oluyor."
 WESTHEIA_POLGER_1933_ACCEPT_TT:0 "Polonya’ya teklifin kabul edildiği bildirilir. Bildiri, Polonya’nın imzasıyla yürürlüğe girecektir."
 WESTHEIA_POLGER_1933_SEND_DIPLOMAT_TT:0 "Alman hükûmetine bir saldırmazlık bildirisi önerilir. Yanıtları diplomatik yollarla iletilecektir."
 WESTHEIA_POL_1933_PILSUDSKI_DEATH_TT:0 "§YJózef Piłsudski§! hayatını kaybeder."
 WESTHEIA_POL_1933_VICKERS_READY_TT:0 "§Y38 Vickers Mk.E Typ A§! tankı envanterimize katılır."
 WESTHEIA_POL_1933_agrarian_crisis:0 "Tarımsal Bunalım ve Köylü Huzursuzluğu"
 WESTHEIA_POL_1933_agrarian_crisis_desc:0 "Tarım ürünlerinin düşen fiyatları, ağır borçlar ve daralan kredi köylü ailelerini yoksullaştırıyor. Altın paritesini koruyan deflasyon politikası iç talebi zayıflatırken kentlerdeki işsizlik de sanayinin toparlanmasını engelliyor. Kırsal kesimde büyüyen hoşnutsuzluğu yatıştırmak için borçların hafifletilmesi, tarımsal reform ve üretimi canlandıracak yatırımlar gerekiyor."
 WESTHEIA_POL_1933_reform_desc:0 "Köylünün borç yükünü hafifletmeli, tarımsal üretimin önündeki engelleri kaldırmalı ve kamu yatırımlarıyla iç pazarı canlandırmalıyız. Kırsal kesimdeki huzursuzluğun dinmesi, sanayinin de yeniden büyümesini sağlayacaktır."
 WESTHEIA_POL_1933_reform_name:0 "Tarımsal Reform ve Ekonomik Toparlanma"
 WESTHEIA_POL_JOZEF_PILSUDSKI_1933:0 "Józef Piłsudski"
 WESTHEIA_POL_NATIVE_reform_desc:0 "Ufukta bir köylü grevi var. Ülkenin her yerinde gıda fiyatları fırlıyor ve hem kopuk sanayimiz hem de hükûmetin Polonya'nın en yoksullarına yardım etmedeki eylemsizliği köylülükte büyük bir huzursuzluğa neden oluyor. Ancak yeterli yatırım ve reformla, köylülerin taleplerini karşılamaktan daha fazlasını yapabilecek hale gelmeliyiz."
 WESTHEIA_POL_NATIVE_reform_name:0 "Tarım Reformu"
