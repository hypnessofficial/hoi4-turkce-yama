 SPR33_peace_SPR_the_future_of_the_republic_desc:0 "İç savaşın önlenmesi, Cumhuriyetin geleceğini kendiliğinden güvence altına almaz. Mecliste varılan uzlaşmayı siyasi bir programa dönüştürmeli, reformların ve kamu yönetiminin izleyeceği yolu belirlemeliyiz."
