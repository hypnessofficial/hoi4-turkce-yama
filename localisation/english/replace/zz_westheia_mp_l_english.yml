 SRB_french_coal_mines:0 "Fransa Kontrolündeki Kömür Madenleri"
 SRB_french_coal_mines_desc:0 "Versailles düzeni, Fransa’ya savaşta uğradığı kayıpların karşılığı olarak Saar’ın kömür madenleri üzerinde haklar tanıdı. Fransız idaresi altında üretim sürse de havzanın zenginliği yerel bir silah sanayisini beslemiyor. Madenlerden çıkan kömür, sınırın ötesindeki fabrikaların çarklarını döndürüyor."
 SRB_geoffrey_george_knox:0 "Sir Geoffrey George Knox"
 SRB_international_guarantee:0 "Uluslararası Garanti"
 SRB_international_guarantee_army_lock_tt:0 "Uluslararası yönetim, Saar’da yeni birlikler kurulmasına ve tümen şablonlarının değiştirilmesine izin vermiyor."
 SRB_international_guarantee_desc:0 "Saar’ın güvenliği, bölgenin kendi silahlı kuvvetlerine değil uluslararası antlaşmalara dayanıyor. Yönetim komisyonu, halk oylaması öncesinde askerî hazırlıklara ve siyasi nüfuz mücadelelerine izin vermeyecektir. Yeni birlikler kurulamaz; danışmanlar ve şirketler, Saar’ı kendi çıkarları doğrultusunda yönlendirmek üzere görevlendirilemez."
 SRB_international_guarantee_restrictions_tt:0 "Yeni birliklerin eğitimi ve tümen şablonlarının değiştirilmesi yasaktır. Danışman ve şirket atamaları uluslararası yönetim tarafından engellenir."
 SRB_league_administration:0 "Milletler Cemiyeti Yönetimi"
 SRB_league_administration_desc:0 "Büyük Savaş’ın ardından Saar’ın idaresi, Milletler Cemiyeti tarafından atanan bir yönetim komisyonuna bırakıldı. Uluslararası gözetim, bölgeye huzur ve istikrar getirirken yerel yönetimin hareket alanını daraltıyor. Saar’ın görevi kendi ordusunu ve sanayisini büyütmek değil, halk oylamasına kadar mevcut düzeni korumaktır."
 SRB_league_of_nations_guarantee:0 "Milletler Cemiyeti Garantisi"
 SRB_league_of_nations_guarantee_desc:0 "Saar Havzası, Milletler Cemiyeti’nin himayesi altındadır. Bölgenin dokunulmazlığına yönelen bir saldırı karşısında İngiltere ve Fransa, barış düzenini savunmak üzere müdahaleye çağrılacaktır. Bu güvence, Cemiyet’in varlığını sürdürmesine bağlıdır."
 SRB_neutrality:0 "Saar Havzası"
 SRB_neutrality_ADJ:0 "Saar"
 SRB_neutrality_DEF:0 "Saar Havzası"
 SRB_plebiscite_of_1935:0 "Saar’ın Geleceği"
 SRB_plebiscite_of_1935_desc:0 "Versailles Antlaşması, Saar Havzası’nı on beş yıllığına Milletler Cemiyeti’nin yönetimine bırakırken kömür madenlerinin işletmesini Fransa’ya verdi. Bu geçici düzenin ardından, 1935’te yapılacak halk oylaması bölgenin geleceğini belirleyecek: Almanya’ya dönüş, Fransa’ya katılma ya da Cemiyet yönetiminin sürmesi. Berlin ile Paris’in gölgesinde yaşayan Saar halkı, yaklaşan oylamada kaderini kendi ellerine alacak."
 SRB_unyielding:0 "Boyun Eğmeyen"
 SRB_unyielding_desc:0 "Saar’ın geleceğini dış baskılar değil, uluslararası antlaşmalar ve halkın iradesi belirlemelidir. Yönetim komisyonunun başkanı, bölgeyi faşist nüfuzdan uzak tutmakta kararlıdır."
