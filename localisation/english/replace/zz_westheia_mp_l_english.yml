 WESTHEIA_BUL33_great_depression:0 "Büyük Buhran"
 WESTHEIA_BUL33_great_depression_desc:0 "Dünya piyasalarında tarım ürünlerinin fiyatlarının çökmesi, Bulgar köylüsünün gelirini ve ülkenin ihracat kazancını eritti. Borç yükü, daralan iç talep ve döviz sıkıntısı sanayi yatırımlarını da yavaşlatıyor. Ekonominin toparlanması, tarım kesiminin rahatlatılmasına ve dış ticaretin yeniden canlandırılmasına bağlıdır."
 WESTHEIA_BUL33_great_depression_recovering:0 "Toparlanan Ekonomi"
 WESTHEIA_BUL33_great_depression_recovering_desc:0 "Üretim yöntemlerindeki iyileşme ve tarım ile sanayi arasındaki bağların güçlenmesi, krizin yatırımlar üzerindeki baskısını hafifletmiştir. Bununla birlikte düşük gelirler, borç yükü ve daralan talep ekonomik faaliyetleri sınırlamaya devam etmektedir."
 WESTHEIA_BUL33_kyoseivanov:0 "$BUL_georgi_ivanov_kyoseivanov$"
 WESTHEIA_BUL33_nikola_mushanov:0 "$BUL_nikola_mushanov$"
 WESTHEIA_BUL33_nikola_mushanov_desc:0 "Nikola Müşanov, Halk Bloku hükümetinin başbakanıdır. Anayasal kurumları ve parlamenter yönetimi savunan Müşanov, ekonomik bunalım ve artan siyasi gerilimler karşısında koalisyonunu bir arada tutmaya çalışmaktadır."
 WESTHEIA_BUL33_railway_modernization:0 "Demiryolu Modernizasyonu"
 WESTHEIA_BUL33_railway_modernization_desc:0 "Ana demiryolu hatlarının yenilenmesi için ayrılan teknik ekipler ve malzemeler, hat kapasitesini artırmaya yönelik inşaat çalışmalarını hızlandırmaktadır."
