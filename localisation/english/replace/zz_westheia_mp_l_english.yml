 ROM33_p11_purchase_payment:0 "Polonya Uçak Siparişinin Ödemeleri"
 ROM33_p11_purchase_payment_desc:0 "Polonya’dan satın alınan PZL avcı uçaklarının ödemeleri devlet bütçesinden kaynak ayrılmasını gerektirmektedir."
 ROM_1933_agrarian_credit_crisis:0 "Tarımsal Borç ve Kredi Krizi"
 ROM_1933_agrarian_credit_crisis_desc:0 "Tarım ürünlerinin değer kaybetmesi köylünün gelirini eritirken borçların ödenmesini güçleştirmiştir. Bankaların kredi vermekte zorlanması ve devletin mali sıkıntıları yeni yatırımları geciktirmektedir. Petrol ihracatı ülkeye döviz sağlasa da kırsaldaki yoksullaşmayı ve iç pazardaki daralmayı tek başına durduramamaktadır."
 ROM_1933_democratic_conservative:0 "Demokratik Muhafazakar"
 ROM_1933_democratic_conservative_desc:0 "Maniu, parlamenter düzeni ve anayasal sınırları siyasi hayatın temeli sayar. Muhafazakâr ilkelerini demokratik kurumlarla bağdaştırmaya çalışan tutumu, uzlaşmaya açık fakat temkinli bir yönetim anlayışını beraberinde getirir."
 ROM_1933_grivita_workers_concessions:0 "Grivița İşçilerine Tavizler"
 ROM_1933_grivita_workers_concessions_desc:0 "Grivița'daki çatışmanın büyümesini önlemek için işçilerin taleplerine kulak verdik. Geçim şartlarını iyileştirmeye yönelik tavizler, üretimin daha büyük bir bölümünün halkın ihtiyaçlarına ayrılmasını gerektiriyor. Sanayi üzerindeki yük artsa da hükûmet, toplumsal barışın bu bedeli hak ettiğini savunuyor."
 ROM_1933_interim_prime_minister:0 "Geçici Başbakan"
 ROM_1933_interim_prime_minister_desc:0 "Hükûmetin başında beklenmedik biçimde doğan boşluğu dolduran Angelescu, kalıcı bir kabine kurulana kadar devlet işlerini yürütüyor. Sınırlı siyasi yetkisi ve kriz ortamındaki belirsizlik, yönetimin karar almasını güçleştiriyor."
 ROM_1933_nationalist_anticommunist:0 "Milliyetçi Anti-Komünist"
 ROM_1933_nationalist_anticommunist_desc:0 "Vaida-Voevod, devletin gücünü ve millî birliği siyasetin merkezine koyar. Komünizme duyduğu sert muhalefet ve tavizsiz söylemi, taraftarlarını harekete geçirirken siyasi ayrılıkları da keskinleştirir."
 ROM_1933_resolute_antifascist:0 "Kararlı Antifaşist"
 ROM_1933_resolute_antifascist_desc:0 "Duca, parlamenter düzeni tehdit eden faşist hareketlere karşı devlet otoritesini kullanmaktan çekinmez. Demokratik hükûmetlerle yakınlaşmayı desteklerken ülke içindeki sert siyasi mücadelesi gerilimi artırır."
 ROM_bessarabia_soviet_war_crisis:0 "Besarabya'nın Savunması"
 ROM_bessarabia_soviet_war_crisis_desc:0 "Sovyetler Birliği'ne karşı savaşa girdik. Besarabya'yı 120 gün boyunca Romanya'nın kontrolünde tutmalıyız.\n\n§GKazanırsak:§!\n+10% İstikrar\n+5% Savaş Desteği\n+150 Siyasi Güç\n+5 Harita Dışı Sivil Fabrika\nSovyet-Romanya sınırı askerden arındırılacak.\n\n§RKaybedersek:§!\n-10% İstikrar\n-10% Savaş Desteği\nBesarabya ve Güney Besarabya Sovyetler Birliği'ne bırakılacak."
 ROM_corneliu_codreanu_ideology:0 "Lejyonerizm"
 ROM_corneliu_codreanu_ideology_desc:0 "§YLejyonerizm§!\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n£GFX_westheia_real_banner_legionarism\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nRumen aşırı milliyetçiliğini Ortodoks dini söylem, şiddetli antikomünizm ve antisemitizmle birleştirir. Disiplinli hareket örgütlenmesi ve fedakârlık kültüyle toplumun otoriter biçimde yeniden kurulmasını amaçlar."
 ROM_westheia_mehmet_tuna:0 "Mehmet Tuna"
 ROM_westheia_mehmet_tuna_advisor:0 "Mehmet Tuna"
 RULE_ALLOW_SUBJECT_TRANSFERS:0 "YZ bağımlı devletleri arasında eyalet devrine izin ver"
 RULE_ALLOW_SUBJECT_TRANSFERS_BLOCKED_DESC:0 "Bağımlı devletlerin eyaletlerinin devrini yasakla"
 RULE_ALLOW_SUBJECT_TRANSFERS_FREE_DESC:0 "Tüm bağımlı devlet türleri"
 RULE_ALLOW_SUBJECT_TRANSFERS_LOW_AUTONOMY_ONLY_DESC:0 "Yalnızca düşük özerkliğe sahip bağımlı devletler (koloni seviyesinin altı)"
 RULE_DOMINION_EXILE_ON_ALLIED_COLLAPSE:0 "Hakimiyetler Savaşmaya Devam Ediyor"
 RULE_DOMINION_EXILE_ON_ALLIED_COLLAPSE_DISABLED_DESC:0 "Birleşik Krallık, ittifakındaki son büyük güç hâlâ Almanya ile savaşırken teslim olursa, savaş normal bir şekilde sona erer ve ittifakın hayatta kalan her üyesi onunla birlikte teslim olur."
 RULE_DOMINION_EXILE_ON_ALLIED_COLLAPSE_ENABLED_DESC:0 "Birleşik Krallık, ittifakında Almanya ile savaşan son büyük güçse, Londra'nın düşmesinden kısa bir süre önce bir egemenliğe tam bağımsızlık tanınacak ve §Ybüyük güç§! statüsüne yükseltilecek. İttifak daha sonra teslim olmak yerine savaşmaya devam eder ve İngiliz hükümeti bu egemenlikteki §Yexile§!'ye girer. \n\n§YKanada§! hâlâ mevcutsa, teslim olmamışsa, Birleşik Krallık dışında kimsenin tebaası değilse yönetimi devralır. Halen Birleşik Krallık'la müttefiktir ve Almanya ile savaş halindedir. Uygun değilse, §YAustralia§! görevi devralır ve bu başarısız olursa §YGüney Afrika§!. Üçünden hiçbiri uygun değilse, bu kuralın hiçbir etkisi olmaz ve savaş normal şekilde sona erer.\n\nIronman ve başarılarla uyumludur."
 RULE_OPTION_DISABLED:0 "Devre dışı"
 RULE_OPTION_ENABLED:0 "Etkin"
 RULE_USE_NEW_TOOL:0 "Modun yeni sürümünü kullan"
 SAF_1933_affirm_union_status:0 "Birliğin Statüsünü Pekiştir"
 SAF_1933_affirm_union_status_desc:0 "Güney Afrika'nın iç ve dış işlerinde kendi kararlarını alabilmesi, Birliğin anayasal konumunun açıkça tanımlanmasını gerektiriyor. Westminster sonrasında oluşan yetkilerimizi sağlam bir hukuki temele oturtmalıyız."
 SAF_1933_establish_south_african_airways:0 "Güney Afrika Havayollarını Kur"
 SAF_1933_establish_south_african_airways_desc:0 "Union Airways'in devlet yönetimine alınması, ülkenin hava ulaşımını tek bir ulusal kuruluş altında toplamak için bir fırsat sunuyor. Güney Afrika Havayolları, sivil havacılığın teknik birikimini ve bakım kapasitesini geliştirecektir."
 SAF_1933_form_united_party:0 "Birleşik Partiyi Kur"
 SAF_1933_form_united_party_desc:0 "Hertzog ve Smuts arasındaki iş birliğini kalıcı bir siyasi birlik hâline getirmeliyiz. Ulusal Parti ile Güney Afrika Partisi'nin birleşmesi, koalisyon hükümetine ortak bir program ve daha sağlam bir parlamento tabanı sağlayacaktır."
 SAF_1933_integrate_south_west_africa:0 "Güneybatı Afrika'yla Bütünleş"
 SAF_1933_integrate_south_west_africa_desc:0 "Güneybatı Afrika üzerindeki manda yönetimimizi daha kapsamlı bir bütünleşme programına dönüştürebiliriz. Ortak idare ve kurumların genişletilmesi, bölgeyi Birliğe daha sıkı biçimde bağlayacaktır."
 SAF_1933_union_status:0 "Birliğin Güçlenen Statüsü"
 SAF_1933_union_status_desc:0 "Birliğin anayasal yetkilerinin pekiştirilmesi, Güney Afrika'nın kendi yönetimi üzerindeki hareket alanını genişletiyor."
 SAF_1933_united_party_consensus:0 "Birleşik Parti Uzlaşması"
 SAF_1933_united_party_consensus_desc:0 "Birleşik Parti, hükümeti destekleyen farklı siyasi gelenekleri ortak bir çatı altında topluyor. Koalisyonun kurumsallaşması, iç siyasi uzlaşmayı güçlendiriyor."
 SIA_1933_conservative_bureaucrat:0 "Muhafazakâr Bürokrat"
 SIC_a_loose_unity_desc_SIC33:0 "Sichuan, kendi ordularını besleyen ve ayrı vergi bölgelerini yöneten komutanlar arasında parçalanmıştır. Liu Xiang ile Liu Wenhui’nin rekabeti, diğer askerî liderlerin çıkarlarıyla birleşerek ortak karar alınmasını zorlaştırmaktadır. Aynı eyaletin kaynaklarına dayansak da birliklerimizin bağlılıkları ve idarelerimizin hedefleri birbirinden ayrıdır."
 SIC_a_loose_unity_desc_SIC33_fallback:0 "Sözde \"Sichuan Kliği\" bayrağı altında birleşmiş olsak da, eyaletimizde kendi hedefleri ve tutkuları olan birkaç farklı yönetici var. Liu Wenhui gibi bazıları işlevsel olarak eyaletin geri kalanından ayrı olan kendi küçük bölgelerini bile yarattılar, diğerlerinin ise ordunun nasıl idare edilmesi gerektiği konusunda kendi fikirleri var."
 SIC_armor_efforts_SIC33:0 "Modern Silahları Değerlendir"
 SIC_armor_efforts_SIC33_fallback:0 "Zırhlı Birlik Çabaları"
 SIC_armor_efforts_desc_SIC33:0 "Yabancı zırhlı araçları, havacılık araçlarını ve yeni askerî yöntemleri inceleyeceğiz. Sınırlı yerel denemelerden ve dışarıdan edinilen teknik bilgiden yararlanarak ordumuzun modern silahlara ilişkin birikimini geliştirmeliyiz."
 SIC_armor_efforts_desc_SIC33_fallback:0 "Sahip olduğumuz zırhlı ve hava kuvvetleri yetenekleri modern bir çatışma için çok küçük. Yabancı tehditlere karşı koymak için teknolojimizi geliştirmeye çalışmalıyız."
 SIC_develop_xikang_SIC33:0 "Xikang İdaresini Düzenle"
 SIC_develop_xikang_SIC33_fallback:0 "Xikang'ı Geliştir"
 SIC_develop_xikang_desc_SIC33:0 "Ya’an’da faaliyete geçen Xikang Eyaletini Kurma Komitesinin çalışmalarını destekleyeceğiz. Liu Wenhui’nin denetimindeki batı bölgelerinde idare, ulaşım ve yerel hizmetlerin düzenlenmesi, bölgenin ekonomik temelini güçlendirecektir."
 SIC_develop_xikang_desc_SIC33_fallback:0 "Xikang seyrek nüfuslu ve dağlıktır, bu da illerin kalkınması söz konusu olduğunda genellikle göz ardı edildiği anlamına gelir. Halkın teveccühünü kazanmak ve dolayısıyla ekonomik tabanımızı da iyileştirmek için bu bölgeye yatırım yapmaya çalışmalıyız."
 SIC_push_back_the_tibetans_desc_SIC33:0 "1932’deki çatışmaların ardından Jinsha Nehri’nin batısındaki topraklar üzerindeki taleplerimiz çözüme kavuşmuş değildir. Sınırdaki durumu yeniden değerlendirecek ve Chamdo üzerindeki iddiamızı ileri sürmek için askerî hazırlık yapacağız."
 SIC_push_back_the_tibetans_desc_SIC33_fallback:0 "Harekete geçme zamanı nihayet geldi. 1932'de tehdit ettiğimiz gibi Jinsha nehrini kararlı bir şekilde geçerek Chamdo'ya girmeli ve sonunda Xikang'ı yönetimimiz altında birleştirmeliyiz!"
 SIC_the_domain_of_liu_wenhui_desc_SIC33:0 "Liu Wenhui, 24. Ordusu ve Sichuan’ın güneyi ile batısındaki nüfuzuyla eyaletin başlıca askerî güçlerinden biridir. Liu Xiang’la arasındaki rekabet, idarenin ve orduların eşgüdümünü zorlaştırmaktadır. Onunla kurulacak ilişkiler, batı bölgelerindeki askerî ve siyasi dengeleri belirleyecektir."
 SIC_the_domain_of_liu_wenhui_desc_SIC33_fallback:0 "Liu Xiang'ın amcası ve eski rakibi olan Liu Wenhui, Xikang ilinde kendine ait küçük bir krallık kurdu. Başlangıçta Sıçuan Valisi olan Liu Wenhui, 1935'te görevden alındı ve o zamandan beri Xikang'ı, muhtemelen tüm Xikang'ı kendi yönetimi altında birleştirme hırsıyla, işlevsel olarak bağımsız bir bölge olarak yönetiyor."
 SIC_the_governor_of_sichuan_SIC33:0 "Liu Xiang’ın Eyalet Başkanlığını Sağlamlaştır"
 SIC_the_governor_of_sichuan_SIC33_fallback:0 "Sıçuan Valisi"
 SIC_the_governor_of_sichuan_desc_SIC33:0 "Yeni eyalet hükûmetinin otoritesini güçlendireceğiz. Liu Xiang’ın başkanlığı altında sivil idareyi düzenleyerek yerel komutanların vergi ve yönetim üzerindeki ayrıcalıklarını sınırlandırmalı, eyalet işlerini ortak kurumlarda toplamalıyız."
 SIC_the_governor_of_sichuan_desc_SIC33_fallback:0 "Liu Wenhui'nin yeğeni ve mevcut vali olan Liu Xiang, Sıçuan'ın en zengin ve en önemli kısmını kontrol ediyor. Reformlarına devam ederek teknolojik yeteneklerimizi geliştirirken burayı daha da geliştirmeye çalışmalıyız."
 SIK_a_soviet_airforce_SIK33:0 "Sinkiang Havacılık Birliğini Genişlet"
 SIK_a_soviet_airforce_SIK33_fallback:0 "Bir Sovyet Hava Kuvvetleri"
 SIK_a_soviet_airforce_desc_SIK33:0 "Mevcut havacılık okulunun ve eyalet hava birliğinin imkânlarını genişleteceğiz. Sovyetlerden alınacak R-5 uçaklarıyla keşif ve hafif bombardıman kapasitemizi artırırken pilotların ve yer personelinin eğitimini destekleyeceğiz."
 SIK_a_soviet_airforce_desc_SIK33_fallback:0 "[SOV.GetNameDef] ile artan ilişkilerimiz sayesinde onlardan uçak edinebileceğiz. Buna ek olarak, Urumçi'de pilot okulları kurmaya hazırlandılar ve bizi savaşın geleceğine hazırlamaya yardımcı olmak için danışmanlar göndermeye başladılar."
 SIK_a_united_sinkiang_clique_desc_SIK33:0 "Güneydeki savaşların sona ermesi ve ilgili bölgelerde denetimimizin yeniden kurulmasıyla eyalet idaresini birleştirebiliriz. Yerel yönetimi düzenleyerek ayrılıkçı direnişi sona erdirecek ve garnizonlarımızı ortak bir idare altında toplayacağız."
 SIK_a_united_sinkiang_clique_desc_SIK33_fallback:0 "Yeni 36. Tümen kovulduğunda ve Sincan tamamen yönetimimiz altına girdiğinde artık bölgede müthiş bir güç olarak duruyoruz. Şimdi bakışlarımızı doğuya çevirmeli ve yoldaşlarımızın ve müttefiklerimizin Japon işgalcilere karşı toprak bütünlüğünü sağlamalıyız."
 SIK_cooperate_with_the_ussr_desc_SIK33:0 "Sovyetler Birliği ile mevcut ticaret ve askerî malzeme alışverişimizi genişleteceğiz. Yün, deri ve tarım ürünleri karşılığında sağlanan araçlar ve mamul eşyalar, eyaletimizin ihtiyaçlarının karşılanmasına yardımcı olacaktır."
 SIK_cooperate_with_the_ussr_desc_SIK33_fallback:0 "Sovyetler Birliği ile ilişkimiz Çin içinde benzersizdir ve toprak bütünlüğümüzü sağlamak için bunu kullanmalıyız. Onların yardımıyla Kuomintang'ı ilimizden nihayet kovabiliriz."
 SIK_march_into_khotan_desc_SIK33:0 "Güneyde otoritemize meydan okuyan kuvvetlere karşı harekât hazırlayacağız. Toprakları geri almak tek başına yeterli olmayacaktır; eyalette kalıcı düzen kurulması, savaşların sona ermesini ve idarenin yeniden örgütlenmesini gerektirecektir."
 SIK_march_into_khotan_desc_SIK33_fallback:0 "O gün geldi! Yakında tüm Sincan bizim yönetimimiz altında olacak ve Ma Hushan'ın birlikleri kovulacak!"
 SIK_office_of_sinkiang_border_commissioner_SIK33:0 "Sınır Savunma İdaresini Güçlendir"
 SIK_office_of_sinkiang_border_commissioner_SIK33_fallback:0 "Sincan Sınır Savunma Ofisi"
 SIK_office_of_sinkiang_border_commissioner_desc_SIK33:0 "Mevcut sınır savunma idaresinin yetkilerini ve bölgesel garnizonlar arasındaki eşgüdümü güçlendireceğiz. Eyaletin uzak bölgeleriyle düzenli haberleşme kurmak ve askerî kaynakları ortak bir düzen içinde kullanmak, merkezî otoritemizi sağlamlaştıracaktır."
 SIK_office_of_sinkiang_border_commissioner_desc_SIK33_fallback:0 "Sincan Sınır Savunma Komiserliği Ofisi, bölgesel garnizonları komuta etmekten sorumlu organdır. Bu özerklik sayesinde, il hükümetini güçlendirebilir ve pratik olarak dilediğimiz zaman Merkezi Hükümetten bağımsız hareket edebiliriz."
 SIK_six_great_policies_desc_SIK33:0 "Sheng Shicai yönetiminin programını altı temel ilke etrafında düzenleyeceğiz: anti-emperyalizm, Sovyetler Birliği ile dostluk, ulusal eşitlik, temiz yönetim, barış ve yeniden yapılanma. Bu ilkeler, eyalet idaresinin ve kamu çalışmalarının ortak çerçevesi olacaktır."
 SIK_six_great_policies_desc_SIK33_fallback:0 "Anti-Emperyalizm, Sovyetler Birliği ile Dostluk, Irksal ve ulusal eşitlik, Temiz hükümet ve Halkın Anti-Emperyalist Birliği aracılığıyla teşvik edilen Barış ve yeniden yapılanma şeklindeki altı büyük politika, Sincan Kliği'ndeki Sheng Shicai yönetiminin temelidir. Bunlar aracılığıyla müreffeh bir il sağlayacak ve feodal yönetime geri dönmekten kaçınacağız."
 SOV_konstantin_rodzayevsky_ideology:0 "Rus Faşizmi"
 SOV_konstantin_rodzayevsky_ideology_desc:0 "§YRus Faşizmi§!\n\n\n\n\n\n\n\n\n£GFX_westheia_real_banner_russian_fascism\n\n\n\n\n\n\n\n\n\nRus milliyetçiliğini militan antikomünizm, antisemitizm ve otoriter devlet düşüncesiyle birleştirir. Ulusal yeniden doğuş ve Rusya’nın birliği adına disiplinli bir kitle hareketini savunur."
 SOV_left_opposition_ideology:0 "Troçkizm"
 SOV_left_opposition_ideology_desc:0 "§YTroçkizm§!\n\n\n\n\n\n\n\n\n£GFX_westheia_real_banner_trotskyism\n\n\n\n\n\n\n\n\n\nSürekli devrimi, uluslararası sosyalist mücadeleyi ve işçi demokrasisini vurgular. Devrimin tek ülkede yalıtılmasına ve parti bürokrasisinin yerleşik ayrıcalıklarına karşı çıkar."
 SOV_market_socialism_ideology:0 "Piyasa Sosyalizmi"
 SOV_market_socialism_ideology_desc:0 "§YPiyasa Sosyalizmi§!\n\n\n\n\n\n\n\n\n£GFX_westheia_real_banner_market_socialism\n\n\n\n\n\n\n\n\n\nSosyalist mülkiyet ve kamusal denetim içinde fiyatlara, ticarete ve sınırlı piyasa ilişkilerine yer verir. Planlama ile ekonomik teşvikler arasında denge kurarak üretimi ve toplumsal refahı artırmayı amaçlar."
 SOV_marxism_leninistic_ideology:0 "Marksizm-Leninizm"
 SOV_romanian_front_montreux_crisis:0 "Romanya Cephesi"
 SOV_romanian_front_montreux_crisis_desc:0 "Romanya, Türkiye'nin yanında savaşa girdi. Besarabya'yı ele geçirmek için 120 günümüz var.\n\n§GKazanırsak:§!\n+10% İstikrar\n+5% Savaş Desteği\n+150 Siyasi Güç\nBesarabya ve Güney Besarabya Sovyetler Birliği'ne katılacak.\n\n§RKaybedersek:§!\n-10% İstikrar\n-10% Savaş Desteği\nSovyet-Romanya sınırı askerden arındırılacak.\nRomanya 5 Harita Dışı Sivil Fabrika kazanacak."
 SOV_turkish_front_montreux_crisis:0 "Türkiye Cephesi"
 SOV_turkish_front_montreux_crisis_desc:0 "Türk direnişini kırmak ve Trabzon'u ele geçirmek için 120 günümüz var. Süre sonunda Trabzon Türk kontrolünde değilse Ankara şartlarımızı kabul etmek zorunda kalacak.\n\n§GKazanırsak:§!\n+10% İstikrar\n+5% Savaş Desteği\n+150 Siyasi Güç\nTrabzon Sovyetler Birliği'ne katılacak.\nİstanbul ve Boğaz çevresi askerden arındırılacak.\n\n§RKaybedersek:§!\n-10% İstikrar\n-10% Savaş Desteği\nGürcistan ve Ermenistan askerden arındırılacak.\nTürkiye 5 Harita Dışı Sivil Fabrika kazanacak."
 SPA_francoist_ideology:0 "Frankoculuk"
 SPA_francoist_ideology_desc:0 "§YFrankoculuk§!\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n£GFX_westheia_real_banner_francoism\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nAskerî otoriteyi, İspanyol milliyetçiliğini, Katolik geleneği ve farklı sağcı hareketleri merkezî yönetim altında birleştirir. Siyasi muhalefeti bastırır; toplumsal düzeni devlet, ordu ve geleneksel kurumların işbirliğiyle korur."
