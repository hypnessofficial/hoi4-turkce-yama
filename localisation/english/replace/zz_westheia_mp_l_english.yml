 AST_seagull_iii_airframe:0 "Supermarine Seagull III"
 AST_seagull_iii_airframe_desc:0 "İngiltere’den temin edilen uçak. Tasarımı incelenebilir; yerel üretimi yapılamaz."
 AST_seagull_iii_airframe_legacy:0 "Supermarine Seagull III"
 AST_seagull_iii_airframe_legacy_desc:0 "İngiltere’den temin edilen uçak. Tasarımı incelenebilir; yerel üretimi yapılamaz."
