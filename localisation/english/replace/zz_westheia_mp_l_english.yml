 WESTHEIA_AUS_FEBRUARY_FACTORY_DAMAGE_TT:0 "§YNiederösterreich§!’daki iki sivil fabrikanın yarı kapasitesine eşdeğer toplam hasar oluşur. Hasar onarılarak giderilebilir."
