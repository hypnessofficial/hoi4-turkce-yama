 WESTHEIA_LAT_letov_16_inventory:0 "Letov Š-16L"
 WESTHEIA_LAT_letov_16_inventory_desc:0 "Çekoslovakya’dan alınan Hispano-Suiza motorlu keşif ve hafif bombardıman uçağı. Sabit ve hareketli makineli tüfekler, gözlem donanımı ve hafif bomba askıları taşır."
