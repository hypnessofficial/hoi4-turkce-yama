 WESTHEIA_ENG_wapiti_iii_short:0 "Westland Wapiti III"
 WESTHEIA_EST33_BALTIC_align_paramilitarists:0 "Paramiliterleri Yeniden Hizala"
 WESTHEIA_EST33_BALTIC_align_paramilitarists_desc:0 "[Root.GetNameDef] genelinde çoğu yalnızca [Root.GetAdjective] kendi kaderini tayin hakkının korunmasına adanmış birçok paramiliter grup var. Takdire şayan olsa da, bu grupların bizi [SOV.GetAdjective] kuklaları olarak değil, [Root.GetAdjective] devletinin mantıksal devamı olarak görmeleri tercih edilir."
 WESTHEIA_EST33_BALTIC_allied_shipments:0 "Müttefik Sevkiyatlarını Artır"
 WESTHEIA_EST33_BALTIC_allied_shipments_desc:0 "1918'den beri [Root.GetNonIdeologyAdjective] ordusu Büyük Britanya'dan bize gönderilen sevkiyatlarla donatılmıştır ve Müttefiklere sevkiyatlar büyük ölçüde artırılmazsa [Root.GetNonIdeologyName]'in başka bir Sovyet kukla hükûmetine tabi olabileceğini anlatmak için çaba göstermeliyiz."
 WESTHEIA_EST33_BALTIC_arm_baltic_reds:0 "Baltık Kızıllarını Silahlandır"
 WESTHEIA_EST33_BALTIC_arm_baltic_reds_desc:0 "Sahne hazır, komünist şevk tüm Baltık'ta yanıyor. Kızılların şimdi tek ihtiyacı olan bizden gelen sinyal ve kaynaklar ve Baltık devrimini ateşleyeceğiz!"
 WESTHEIA_EST33_BALTIC_arm_the_nation:0 "Ulusu Silahlandır"
 WESTHEIA_EST33_BALTIC_arm_the_nation_desc:0 "[Root.GetNonIdeologyName]'in her yerinde bir Sovyet işgali tehdidiyle yüzleşmeye hazır ancak bunu yapacak ekipmandan yoksun adamlar var. Piyade teçhizatının hızlı üretimi için silah sanayimizi hazırlamalıyız."
 WESTHEIA_EST33_BALTIC_arms_industry:0 "Silahlanmayı Tamamla"
 WESTHEIA_EST33_BALTIC_arms_industry_desc:0 "Sanayimizin modernizasyonu tamamlandığına ve ülkemizde faaliyet gösteren sayısız yerli askerî sanayi kuruluşu olduğuna göre, [Root.GetAdjective] silah sanayisi nihayet gerçek potansiyeline ulaşabilir!"
 WESTHEIA_EST33_BALTIC_attract_workers_to_capital:0 "İşçileri [Root.Capital.GetName]'e Çek"
 WESTHEIA_EST33_BALTIC_attract_workers_to_capital_desc:0 "[Root.GetNonIdeologyName]'in işçileri kırsal kesimde dağınık bir şekilde yayılmış durumdalar ve genellikle modası geçmiş tarım sektöründe çalışıyorlar. Ulusumuzu savaş için sanayileştirmek istiyorsak, işçileri [Root.Capital.GetName]'deki fabrikalara çekmeliyiz!"
 WESTHEIA_EST33_BALTIC_autobahn:0 "[Root.GetAdjective] Otobanı"
 WESTHEIA_EST33_BALTIC_autobahn_desc:0 "Eğer altyapısı hızlı ve sürekli bir işgücü akışını kolaylaştırmıyorsa, [Root.GetNonIdeologyName]'in ne kadar iyi sanayileşmiş olduğu pek önemli değil. Altyapı sektörümüzü Reich'ınkine göre modelleyerek, onların sahip olduğu verimliliği elde edebiliriz."
 WESTHEIA_EST33_BALTIC_axis_investments:0 "[GetBalticAxisInvesmentsAdj] Yatırımları Ara"
 WESTHEIA_EST33_BALTIC_axis_investments_desc:0 "[GetBalticAxisInvesmentsDesc]"
 WESTHEIA_EST33_BALTIC_baltic_fleet:0 "Baltık Filosu"
 WESTHEIA_EST33_BALTIC_baltic_fleet_desc:0 "[Root.GetNonIdeologyAdjective] filosu dünyanın gıpta ettiği bir filo olmasa da, doğru yatırımla [Root.GetNonIdeologyName]'i denizdeki herhangi bir işgal girişimine karşı savunabileceğini kanıtlayabilir."
 WESTHEIA_EST33_BALTIC_balticwall:0 "Baltık Duvarı"
 WESTHEIA_EST33_BALTIC_balticwall_desc:0 "Doğu'daki tahkimatlar, düşmanlarımız bunun yerine denizden bir saldırı gerçekleştirmeyi seçerse işe yaramaz! İngilizlere, Almanlara veya Sovyetlere rakip olabilecek bir donanma asla inşa edemeyebiliriz, ancak kıyı savunmalarımıza karşı onları çaresiz bırakmak için elimizden geleni yapabiliriz."
 WESTHEIA_EST33_BALTIC_belarus_ssr:0 "[Root.GetNonIdeologyName]-Belarus SSC"
 WESTHEIA_EST33_BALTIC_belarus_ssr_desc:0 "Belarus ve Baltık'ı birleştirme kavramı yabancı bir kavram değildir. Uzun zaman önce Litvanya-Belarus Sovyet Sosyalist Cumhuriyeti, bu iki görünüşte farklı halkın uyumlu bir birleşimi olarak var oldu. Sosyalizm kültür ve dil sınırları tanımaz ve [Root.GetAdjective] ve Belaruslu işçilerin bir arada yaşayamaması için çok az neden görüyoruz."
 WESTHEIA_EST33_BALTIC_british_aircraft:0 "İngiliz Uçak Alımlarını Sürdür"
 WESTHEIA_EST33_BALTIC_british_aircraft_desc:0 "Mevcut İngiliz uçaklarımızın ardından yeni alımlar ve tasarım anlaşmalarıyla hava kuvvetlerimizi geliştirmeliyiz."
 WESTHEIA_EST33_BALTIC_british_designers:0 "İngiliz Tasarımcıları Davet Et"
 WESTHEIA_EST33_BALTIC_british_designers_desc:0 "İngiliz tasarımlarını kapsamlı bir şekilde inceledik ve [Root.Capital.GetName]-Crossley Motorları'nın başarılı bir girişim olduğu kanıtlandığından, İngiliz tasarımcıları [Root.GetNonIdeologyAdjective] Mühendislik Şirketi'ne katılmaya resmî davetiyeler göndermek bizim için iyi olacaktır."
 WESTHEIA_EST33_BALTIC_communist_opposition:0 "Muhalefete Geç"
 WESTHEIA_EST33_BALTIC_communist_opposition_desc:0 "Sovyetler Birliği'nin ne [Root.GetNameDef]'e ne de halkına dost olmadığı kanıtlanmıştır ve [Root.GetNameDef]'in anahtarlarını, [Root.GetAdjective]'i yağmalamaktan başka bir şey istemeyen Kızıl Ordu'nun akbabalarına teslim etmek aptallık olur. Onlar kapitalistlerden daha güvenilir değiller ve eğer [Root.GetCommunistParty] başarılı olacaksa, bu tek başına yapılmalıdır!"
 WESTHEIA_EST33_BALTIC_concessions_for_catholics:0 "Katolikler İçin Tavizler"
 WESTHEIA_EST33_BALTIC_concessions_for_catholics_desc:0 "[Root.GetNameDef]'in alt sınıflarının çoğu dindar Katoliktir ve ilk İşçi Cumhuriyeti'nde dinî uygulama Kızıl Ordu tarafından sert bir şekilde bastırılmıştır. Bu durum [Root.GetNameDef]'in yoksullarının çoğunu devrime karşı çevirdi, bu yüzden eğer gerçekten halkın cumhuriyeti olacaksak, onlara inançlarının korunacağına dair kesin bir güvence vermeliyiz."
 WESTHEIA_EST33_BALTIC_crossley_motors:0 "Askerî Araç Atölyelerini Genişlet"
 WESTHEIA_EST33_BALTIC_crossley_motors_desc:0 "Arsenal-Crossley zırhlı araçlarının yapımında kazanılan deneyimi bakım, onarım ve askerî araç atölyelerini geliştirmek için kullanmalıyız."
 WESTHEIA_EST33_BALTIC_crush_forest_brothers:0 "Orman Kardeşlerini Ez"
 WESTHEIA_EST33_BALTIC_crush_forest_brothers_desc:0 "Orman Kardeşleri, yönetimi ele geçirmemizden bu yana ulusumuz için bir bela oldular; sanayilerimizi, demiryollarımızı sabote ediyor ve resmî hükûmet gösterilerini bozuyorlar. [Root.GetNonIdeologyName]'in ormanlarına girmeli ve bu yanlış yönlendirilmiş bireyleri kökünden sökmeliyiz."
 WESTHEIA_EST33_BALTIC_defence_of_our_nation:0 "Ulusumuzun Savunması"
 WESTHEIA_EST33_BALTIC_defence_of_our_nation_desc:0 "Sivil sanayi, savunmamız için silah sanayisi kadar önemlidir. Makine seslerinin sürekli uğultusu, vatansever halkı ulusumuzu sanayileştirme görevini yaparken tüm [Root.GetNonIdeologyName] boyunca yankılanacak."
 WESTHEIA_EST33_BALTIC_direct_intervention:0 "Doğrudan Sovyet Müdahalesi"
 WESTHEIA_EST33_BALTIC_direct_intervention_desc:0 "Hükûmeti tek başımıza geri alamadığımızı kanıtladık ve mücadelemizde bize yardım etmeleri için [SOV.GetNameDef]'deki müttefiklerimizi çağırmalıyız."
 WESTHEIA_EST33_BALTIC_domestic_motors:0 "Yerli Bir Motor Şirketi"
 WESTHEIA_EST33_BALTIC_domestic_motors_desc:0 "Yabancı tasarımlar iyidir, ancak onlara sonsuza kadar güvenemeyiz. [Root.GetNonIdeologyName] gururlu bir ulustur ve dünyaya tasarımcılarımızın ve düşünürlerimizin Batı'dakiler kadar yeterli olduğunu göstermeliyiz."
 WESTHEIA_EST33_BALTIC_eastwall:0 "Doğu Duvarı"
 WESTHEIA_EST33_BALTIC_eastwall_desc:0 "Almanlar da en az bizim kadar Doğu'dan bir saldırı bekliyor ve Alman yetkililere kendi sınırları kadar bizim sınırımızı da kuvvetle tahkim etmeleri tavsiye edilir."
 WESTHEIA_EST33_BALTIC_end_bourgeouis_dictatorships:0 "Burjuva Diktatörlüklerine Son Ver"
 WESTHEIA_EST33_BALTIC_end_bourgeouis_dictatorships_desc:0 "Baltıklar sözde “tarafsız” diktatörler tarafından domine ediliyor. Ordunun desteğiyle ve halklarının rızası olmadan, Baltık proletaryası kapitalist diktatörlük altında eziliyor. Sadece özgürleşmiş [Root.GetAdjective] işçilerinin elleriyle, haksız sınırlar tarafından ayrı tutulan bu işçiler şanlı kurtuluşumuzu paylaşabilir!"
 WESTHEIA_EST33_BALTIC_end_swedish_neutrality:0 "İsveç Tarafsızlığına Son Ver"
 WESTHEIA_EST33_BALTIC_end_swedish_neutrality_desc:0 "İsveçlilerin tarafsızlık dediği şey zayıflıktan başka bir şey değildir; sınırları ötesindeki alt sınıfların refahına çok az önem vererek, o an en güçlü görünen gücün kaprislerine boyun eğmek. Böylesine zayıf iradeli ve dayanıksız bir hükûmet, sınırımızı paylaşmaya layık değildir ve halkını tiranlıktan koruyacak omurgaya sahip yeni bir İsveç yaratmalıyız."
 WESTHEIA_EST33_BALTIC_finnish_invasion:0 "Finlandiya İşgali"
 WESTHEIA_EST33_BALTIC_finnish_invasion_desc:0 "Finlandiya bizim için kapitalizmin prangaları altına bağlanmış kayıp bir kardeştir. Finlandiya ancak şiddetli bir devrimle, tıpkı Baltıkların özgürleştiği gibi özgürleşebilir."
 WESTHEIA_EST33_BALTIC_focus_on_the_interior:0 "İç Meselelere Odaklan"
 WESTHEIA_EST33_BALTIC_focus_on_the_interior_2:0 "Almanlara Hazırlan"
 WESTHEIA_EST33_BALTIC_focus_on_the_interior_2_desc:0 "Freikorps'un [Root.GetNameDef]'e bunca yıl önce getirdiği mutlak vahşeti unutmamamız hayati önem taşıyor. Köylüler ve işçiler hayvan gibi katledildi, tüm köyler küle ve harabeye döndü ve [Root.GetAdjective] halkının bir daha asla böyle bir vahşete maruz kalmasına izin veremeyiz."
 WESTHEIA_EST33_BALTIC_focus_on_the_interior_desc:0 "Birçok işçi komşularımıza yürümeye ve şanlı devrimimizi tüm Baltık halklarına getirmeye hevesli olsa da, bunun yerine ulusumuzun içine odaklanmalıyız; devrimin ardından rejimi istikrara kavuşturmalıyız."
 WESTHEIA_EST33_BALTIC_ford_motors:0 "Ford ile Araç Tedarikini Genişlet"
 WESTHEIA_EST33_BALTIC_ford_motors_desc:0 "Ford ile ticari bağlantılarımızı geliştirerek araç, yedek parça ve bakım donanımı temin edebiliriz."
 WESTHEIA_EST33_BALTIC_forment_disloyalty:0 "Muhalefeti Birleştir"
 WESTHEIA_EST33_BALTIC_forment_disloyalty_desc:0 "Hem [Root.GetAdjective] hükûmetinin içinde hem de dışında birçok hareket var ve eğer [Root.GetNameDef]'i rahatsız eden mevcut tiranlığı devireceksek, [Root.GetNeutralParty]'e karşı muhalefetin birleştirici sesi olmalıyız!"
 WESTHEIA_EST33_BALTIC_free_the_workers_of_poland:0 "Polonya İşçilerini Özgürleştir"
 WESTHEIA_EST33_BALTIC_free_the_workers_of_poland_desc:0 "Polonyalılar bir zamanlar Baltık'ı yönetmiş olsalar da, şimdi [GER.GetNameDef]'in yırtıcı rejimine karşı savunmasız bir av durumundalar. Güney'deki yoldaşlarımızı savunmalı ve onları bir Polonya Sosyalist Cumhuriyeti altında birleştirmeliyiz!"
 WESTHEIA_EST33_BALTIC_german_baltic_industry:0 "Mihver-Baltık Sanayisi"
 WESTHEIA_EST33_BALTIC_german_baltic_industry_desc:0 "[GetGermanBalticIndustryDesc]"
 WESTHEIA_EST33_BALTIC_german_tank_licences:0 "[GetBalticAxisInvesmentsAdj] Tank Lisansları"
 WESTHEIA_EST33_BALTIC_german_tank_licences_desc:0 "[GetGermanTankLicencesDesc]"
 WESTHEIA_EST33_BALTIC_german_war_economics:0 "[GetBalticAxisInvesmentsAdj] Savaş Ekonomisini Benimse"
 WESTHEIA_EST33_BALTIC_german_war_economics_desc:0 "[GetGermanWarEconomicsDesc]"
 WESTHEIA_EST33_BALTIC_influence_neighbours:0 "Komşuları Etkile"
 WESTHEIA_EST33_BALTIC_influence_neighbours_desc:0 "Bağımsızlık savaşlarından önce olduğu kadar popüler olmasa da, sosyalizm altında özgür bir Baltık kavramı, Baltık'ın kendi kaderini tayin etme kavramı kadar eskidir. Devletimiz, Baltık diktatörlüklerinin baskıcı rejimleri altında yaşayanlar tarafından modellenecek bir şey olarak durabilir ve bunu silahlandırarak Devrimi komşularımıza kansız bir şekilde yayma şansımız var."
 WESTHEIA_EST33_BALTIC_invest_in_baltic_trade:0 "Baltık Ticaretine Yatırım Yap"
 WESTHEIA_EST33_BALTIC_invest_in_baltic_trade_desc:0 "Baltık Denizi, İskandinavya, Almanya ve Rusya'dan gelen ticaretle zengindir ve limanlarımız hepsini zorlukla barındırabilir. Daha parlak ve müreffeh bir [Root.GetNonIdeologyName] için bu denizi bizimle paylaşan dostlarımızla yeni ticaret hatları açmalıyız!"
 WESTHEIA_EST33_BALTIC_modernize_industry:0 "Sanayimizi Modernleştir"
 WESTHEIA_EST33_BALTIC_modernize_industry_desc:0 "Çok uzun zamandır, [Root.GetNonIdeologyName]'in üretimi tarımla tanımlandı ama artık değil. [Root.GetNonIdeologyName]'i modern bir ekonomiye dönüştüreceksek, sanayimizi her eyaletteki büyük şehir merkezleri etrafında yoğunlaştırmalıyız."
 WESTHEIA_EST33_BALTIC_natural_resources:0 "Petrol Şisti Sanayisini Genişlet"
 WESTHEIA_EST33_BALTIC_natural_resources_desc:0 "Kohtla-Järve, Kiviõli ve Sillamäe çevresindeki petrol şisti tesislerini genişleterek yerli yakıt üretimini artırabiliriz."
 WESTHEIA_EST33_BALTIC_original_designs:0 "Orijinal Tasarımlar"
 WESTHEIA_EST33_BALTIC_original_designs_desc:0 "Ulusumuzun 1918'deki doğumundan günümüze kadar, [Root.GetNonIdeologyName] ordularını İngilizlerden gelen silahlarla donattı, ama artık değil. Artık İngilizlere güvenemeyiz, ileriye bakmalı ve [Root.GetNonIdeologyAdjective] menşeli silah üretmeye başlamalıyız."
 WESTHEIA_EST33_BALTIC_overthrow_the_government:0 "[Root.GetNeutralParty]'i Devir"
 WESTHEIA_EST33_BALTIC_overthrow_the_government_desc:0 "[Root.GetLeader]'i ve [Root.GetLeader.GetHerHis] rejimini devirmek için yeterli desteği topladık! Tek yapmamız gereken başkente yürümek ve yeni bir İşçi Cumhuriyeti ilan etmek!"
 WESTHEIA_EST33_BALTIC_path_to_the_north_sea:0 "Kuzey Denizi'ne Bir Yol"
 WESTHEIA_EST33_BALTIC_path_to_the_north_sea_desc:0 "Danimarkalılar bu tırmanan küresel çatışmada ne yazık ki tarafsız kaldılar ve Danimarka boğazları, sosyalist dünyayı Kuzey Denizi'nden ayıran tek şey."
 WESTHEIA_EST33_BALTIC_purge_of_our_own:0 "Kendi Tasfiyemiz"
 WESTHEIA_EST33_BALTIC_purge_of_our_own_desc:0 "Tüm direnişi ezmek için gösterdiğimiz en iyi çabalara rağmen, hala gölgelerde örgütlenen, [Root.GetNonIdeologyName]'de kapitalist bir diktatörlüğü yeniden kurmak için proletaryaya karşı komplo kuranlar var. Popüler bir tasfiye yapmalıyız; eski hükûmetin tüm üyelerini ve onları destekleyen herkesi kökünden sökmeliyiz."
 WESTHEIA_EST33_BALTIC_rebuild_forts:0 "[Root.Capital.GetName] Kalelerini Yeniden İnşa Et"
 WESTHEIA_EST33_BALTIC_rebuild_forts_desc:0 "Bağımsızlık savaşları sırasında, [Root.Capital.GetName] bir şehirden çok bir kaleydi. Tahkimatlar büyük ölçüde sökülmüş ve unutulmuş olsa da, yeniden inşa edilmeli, bakımı yapılmalı ve savaşa hazır hale getirilmelidir."
 WESTHEIA_EST33_BALTIC_red_army:0 "[Root.GetAdjective] Kızıl Tüfekliler"
 WESTHEIA_EST33_BALTIC_red_army_desc:0 "Ordumuz, yalnızca [Root.GetNameDef] içinde sosyalizmi savunmaya ve onu dünya halkı arasında yaymaya istekli olanlardan oluşmalıdır ve bu ancak [Root.GetAdjective] Kızıl Tüfeklileri geri getirerek başarılabilir."
 WESTHEIA_EST33_BALTIC_rejoin_the_railways:0 "Demiryolu Ağını İyileştir"
 WESTHEIA_EST33_BALTIC_rejoin_the_railways_desc:0 "Mevcut demiryolu ağımızı ve bağlantılarını iyileştirerek sanayinin, limanların ve tarımsal bölgelerin birbirine ulaşmasını kolaylaştırmalıyız."
 WESTHEIA_EST33_BALTIC_renew_allied_trade:0 "[GetBalticRenewAlliedTradeTitle]"
 WESTHEIA_EST33_BALTIC_renew_allied_trade_desc:0 "[GetBalticRenewAlliedTradeDesc]"
 WESTHEIA_EST33_BALTIC_request_german_support:0 "[GetBalticAxisInvesmentsAdj] Desteği İste"
 WESTHEIA_EST33_BALTIC_request_german_support_desc:0 "[GetRequestGermanSupportDesc]"
 WESTHEIA_EST33_BALTIC_restore_workers_republic:0 "İşçi Cumhuriyetini Geri Getir"
 WESTHEIA_EST33_BALTIC_restore_workers_republic_desc:0 "Bağımsızlık mücadelemiz sırasında, Sovyetler bir [Root.GetAdjective] İşçi Cumhuriyeti'nin kurulmasına yardım etti. Cumhuriyet başarısız olsa da, liderleri hem [Root.GetNameDef] hem de [SOV.GetNameDef]'de hayatta kalmaya devam ediyor, bu nedenle işçi cumhuriyeti umudu hala var!"
 WESTHEIA_EST33_BALTIC_revolutionary_cabinet:0 "Devrimci Bir Kabine"
 WESTHEIA_EST33_BALTIC_revolutionary_cabinet_desc:0 "Şimdi alt sınıfın yılmaz bekçileri olarak hak ettiğimiz yere geri döndüğümüze göre, yeni devletimizin ideolojisiyle uyumlu bir bakanlar kurulunu yeniden toplayabiliriz."
 WESTHEIA_EST33_BALTIC_school_of_aviation:0 "Baltık Havacılık Okulu"
 WESTHEIA_EST33_BALTIC_school_of_aviation_desc:0 "Bağımsızlık savaşı sırasında hava ve denizin kontrolü mücadelesi bizim adımıza İngilizler tarafından verildi, ancak İngilizler Nazi tehdidine taviz üstüne taviz vermeye devam ederken bizi tekrar savunacaklarına güvenemeyiz. Gökyüzüne kendimiz çıkmalıyız!"
 WESTHEIA_EST33_BALTIC_secure_military_support:0 "Askerî Destek Sağla"
 WESTHEIA_EST33_BALTIC_secure_military_support_desc:0 "Ordudaki birçok kişi ulusu [Root.GetLeader]'den kurtarmak istiyor, tek yapmamız gereken onlara yaklaşmak. Şan ve şöhret arayan bir general, halkın kahramanı olma vaadiyle davamıza kesinlikle çekilecektir."
 WESTHEIA_EST33_BALTIC_seek_support_of_soviets:0 "Sovyetlerin Desteğini Ara"
 WESTHEIA_EST33_BALTIC_seek_support_of_soviets_desc:0 "Kızıl Ordu [Root.GetNameDef]'i yerle bir edip ulusumuzu yeni bir Rus emperyalizmi çağına sokmuş olsa da, onların yardımı olmadan [Root.GetNameDef]'e sosyalizmi getirme şansımız yok."
 WESTHEIA_EST33_BALTIC_sieze_the_means_of_production:0 "Üretim Araçlarına El Koy"
 WESTHEIA_EST33_BALTIC_sieze_the_means_of_production_desc:0 "Eski hükûmet, [Root.GetAdjective] halkının emeğini sömürmek için denizaşırı yatırımcıları davet etti. Proletaryanın ellerinin yabancı burjuva efendilerine hizmet etmeye devam etmesine izin veremeyiz ve bu çok uluslu şirketler tarafından inşa edilen tüm fabrikalar [Root.GetNameDef]'in velayeti altına alınmalıdır."
 WESTHEIA_EST33_BALTIC_soviet_equipment:0 "Sovyet Ekipmanı"
 WESTHEIA_EST33_BALTIC_soviet_equipment_desc:0 "Milislerimizi silahlandırmak için gerekli silah ve malzemelere erişmeden hükûmeti devirmeyi umut edemeyiz. Ruslardan yardım için temas kurarak, eski hükûmet devrimi durdurmaya çalışırsa ordularımızı desteklemek için fazladan silah kazanacağız."
 WESTHEIA_EST33_BALTIC_soviet_military_staff:0 "Sovyet Askerî Personeli"
 WESTHEIA_EST33_BALTIC_soviet_military_staff_desc:0 "[Root.GetAdjective] İşçi Cumhuriyeti dağıtıldıktan sonra, askerî personelimiz büyük ölçüde SSCB'ye sürgüne gitti. Eve getirilmeleri gerekiyor."
 WESTHEIA_EST33_BALTIC_soviet_volunteer_forces:0 "Sovyet Gönüllü Kuvvetleri"
 WESTHEIA_EST33_BALTIC_soviet_volunteer_forces_desc:0 "SSCB, dünya devrimi için savaşmaya ve ölmeye hazır adamlarla adeta taşıyor. [Root.GetNameDef] komünist bir dünya mücadelesinde sadece bir basamak taşı olsa da, davamız için ölmeye hazır cesur Rus sosyalistlerinin sıkıntısı yok."
 WESTHEIA_EST33_BALTIC_squash_resistance:0 "Tüm Direnişi Ez"
 WESTHEIA_EST33_BALTIC_squash_resistance_desc:0 "Hala sosyalizmin [Root.GetAdjective] egemenliğinin düşmanı olduğuna inanan insanlar var ve devrimi ilerleteceksek bu insanlar kökünden sökülmelidir."
 WESTHEIA_EST33_BALTIC_technology_sharing:0 "Teknoloji Paylaşımı"
 WESTHEIA_EST33_BALTIC_technology_sharing_desc:0 "Halihazırda ortağımızın birçok ekipmanını üretiyoruz, ancak belki de tasarımlarını inceleyerek yerli [Root.GetNonIdeologyAdjective] tasarımlarını önemli ölçüde geliştirebiliriz."
 WESTHEIA_EST33_BALTIC_trade_with_neighbors:0 "Komşularla Ticaret Yap"
 WESTHEIA_EST33_BALTIC_trade_with_neighbors_desc:0 "Almanlara veya Sovyetlere her ticaret yatırımı yaptığımızda, kendi kıyametimize katkıda bulunuyoruz. Düşman birliklerinin erzaklarında Litvanya tahılı ve tanklarında Letonya çeliğinden yapılmış Estonya petrolü ile [Root.GetNonIdeologyName]'i işgal etmesine izin veremeyiz. Bunun yerine ortak düşmanımızı yenmek için birbirimize yardım etmeliyiz."
 WESTHEIA_EST33_BALTIC_unchain_education:0 "Tallinn Teknik Enstitüsünü Kur"
 WESTHEIA_EST33_BALTIC_unchain_education_desc:0 "Tallinn’de yüksek teknik öğretimi bağımsız bir enstitü altında örgütleyerek mühendislik ve sanayi araştırmalarını geliştirmeliyiz."
 WESTHEIA_EST33_BALTIC_united_baltic_ssr:0 "Birleşik bir Baltık SSC"
 WESTHEIA_EST33_BALTIC_united_baltic_ssr_desc:0 "Kültür, dil ve kimlik açısından farklı olsalar da, üç Baltık Devleti arasında uzun zamandır bir kardeşlik ve yoldaşlık vardır. Komşularımızın da diğer [Root.GetAdjective]ler kadar yoldaş olduğu kabul edilmelidir ve tek bir işçi cumhuriyetinde birleşmezsek işçiler sadece kaybeder."
 WESTHEIA_EST33_BALTIC_western_revolution:0 "Devrimi Batı'ya Taşı"
 WESTHEIA_EST33_BALTIC_western_revolution_desc:0 "Devrim Baltık'ta durmuyor. Neredeyse tüm Avrupa'nın alt sınıfları, kapitalizmin katı çizmeleri altında fabrikalarda köle gibi çalışıyor ve onları yalnızca [Root.GetAdjective] işçileri kurtarabilir."
 WESTHEIA_EST33_EST_anti_communist_militia:0 "Anti-Komünist Milisler"
 WESTHEIA_EST33_EST_anti_communist_militia_desc:0 "Ulus, doğumuzdaki Bolşevik tehdidiyle savaşmaya istekli ancak eski hükûmet tarafından çok radikal oldukları için reddedilen adamlarla dolu. Vaps'lar için hiçbir miktarda anti-komünist düşünce çok radikal değildir ve bu adamlar ordumuzda diğerleri kadar bir yeri hak ediyor."
 WESTHEIA_EST33_EST_baltic_defence_army:0 "Baltık Savunma Ordusu"
 WESTHEIA_EST33_EST_baltic_defence_army_desc:0 "Silahlı kuvvetlerimiz birlikte çalışıyor ancak esasen ayrı varlıklar. Uluslarımız arasındaki bağlar güçlendikçe, aynı anda hiçbir Baltık Devleti tarafından kontrol edilmeyen ancak hepsinin bir müttefiki olan ayrı bir varlık olan Birleşik Baltık Silahlı Kuvvetleri'ni kurabiliriz."
 WESTHEIA_EST33_EST_baltic_economic_union:0 "Baltık Ekonomik Birliği"
 WESTHEIA_EST33_EST_baltic_economic_union_desc:0 "Şimdi liberal demokrasi ulusumuza geri döndüğüne ve komşularımızla yakın diplomatik bağlar kurduğumuza göre, diğer Baltık Devletleriyle bir ekonomik birliğe girmek mantıklı. Ekonomilerimiz küçük olsa da, birlikte güçlenebilirler!"
 WESTHEIA_EST33_EST_baltic_shield:0 "Baltık Kalkanı"
 WESTHEIA_EST33_EST_baltic_shield_desc:0 "Sovyetler, Estonya'yı emperyalizmin çizmeleri altında ezmek istiyor, ancak bunun olmasına izin veremeyiz. Sınır boyunca sığınaklar inşa edilmeli, Sovyetleri yenemeyebiliriz, ama en azından başka biri gelene kadar ayakta kalabiliriz."
 WESTHEIA_EST33_EST_baltic_stronger_together:0 "Birleşik ama Ayrı"
 WESTHEIA_EST33_EST_baltic_stronger_together_desc:0 "Baltık Devletleri arasında uzun zamandır bir kardeşlik ve yoldaşlık duygusu var, ama her zaman sınırlar ve siyasetle ayrıldık. Bağımsızlığımızı koruma isteğimizle diplomatik olarak birbirimize bağlıyız ve bu yüzden dostlarımız için savaşmaya ve birleşik Baltık silahlı kuvvetlerini genişletmeye kararlı olmalıyız!"
 WESTHEIA_EST33_EST_baltic_unification:0 "Baltık Birleşmesi"
 WESTHEIA_EST33_EST_baltic_unification_desc:0 "Baltık Devletleri arasında uzun zamandır bir kardeşlik ve yoldaşlık duygusu var, ama her zaman sınırlar ve siyasetle ayrıldık. Bağımsız kimliklerimiz güçlü olsa da, varlığımızı korumak için savaşma isteğimiz bizi birbirimize bağlıyor. Belki de Baltık Birliği'nin kendi başına bir ulusa dönüşme zamanı gelmiştir."
 WESTHEIA_EST33_EST_beyond_the_baltic:0 "Baltık'ın Ötesi"
 WESTHEIA_EST33_EST_beyond_the_baltic_desc:0 "Bazıları Baltık Antantı'nın küçük ulusumuzu işgalden korumak için yeterli olduğu konusunda ısrar etse de, hepimiz bunun bir yanılgı olduğunu biliyoruz. Müttefikler 1918'de kendi kaderimizi tayin etme mücadelemizde bize yardım ettiler ve belki de tekrar yardımımıza gelmelerini beklemek o kadar da ahmakça olmaz!"
 WESTHEIA_EST33_EST_break_the_silence:0 "Sessizliği Boz"
 WESTHEIA_EST33_EST_break_the_silence_desc:0 "Konstantin Päts, bu diktatörlüğü Estonya'yı faşizm ve komünizmden koruma bahanesiyle kurdu. Şimdi bu ideolojiler önemsizliğe itildiğine göre, diktatörlüğün devam etmesi için çok az neden var ve serbest seçimler yeniden açılmalıdır."
 WESTHEIA_EST33_EST_cave_to_enemy_pressure:0 "Düşman Baskısına Boyun Eğ"
 WESTHEIA_EST33_EST_cave_to_enemy_pressure_desc:0 "Hem ulusumuzun hem de halkımızın hayatta kaldığı bir geleceğin olmadığı açıkça ortaya çıktı. Akrabalarımızı korumak için çok şey yapmış olsak da, [Root.GetNonIdeologyName]'in halkına büyük bir kayıp vermeden bağımsızlığını sürdürmesinin hiçbir yolu olmadığı açıkça görülüyor."
 WESTHEIA_EST33_EST_chamber_of_deputies:0 "Mebuslar Meclisini Güvence Altına Al"
 WESTHEIA_EST33_EST_chamber_of_deputies_desc:0 "Ulusal Konsey artık Isamaaliit'in sıkı kontrolü altındayken, geriye kalan tek şey Mebuslar Meclisi'nin kontrolünü ele geçirmektir. Sivil hükûmetin tüm meclisleri partinin mutlak çoğunluğu altına girdiğinde, diktatörlük ulusun ve sanayisinin üzerinde tartışmasız bir kontrol sahibi olacaktır."
 WESTHEIA_EST33_EST_corporate_chambers:0 "Şirket Odaları"
 WESTHEIA_EST33_EST_corporate_chambers_desc:0 "Solcular uzun zamandır korporatizm fikrine karşı çıktılar, ancak şimdi Riigikogu onların aralıksız seslerinden kurtulduğuna göre, nihayet Şirket Odalarını kurabiliriz. İşçiler ideolojiye göre değil, mesleğe göre bölünecek ve özel işverenler çıkarlarını diktatörlüğe temsil edecekler. Ne ters gidebilir ki?"
 WESTHEIA_EST33_EST_empower_finnish_militants:0 "Fin Militanları Güçlendir"
 WESTHEIA_EST33_EST_empower_finnish_militants_desc:0 "Vaps Hareketi, kuzeydeki Finli gazilerin yardımı olmadan mümkün olmazdı. Fin gönüllüler Estonya'nın bağımsızlığını kazanmasına yardım etti ve şimdi bu gaziler, bizim gibi, zayıf iradeli hükûmetlerini devirmek ve Finler için çalışan birini kurmak istiyorlar."
 WESTHEIA_EST33_EST_era_of_silence:0 "Sessizlik Dönemi"
 WESTHEIA_EST33_EST_era_of_silence_desc:0 "Şiddet yanlısı aşırı milliyetçi Vaps hareketinin Saaremaa'dan Võrumaa'ya yayılmasıyla birlikte, Devlet Başkanı Estonya için yeni bir dönem başlatmalıdır; seçimlerin, muhalefetin ve direnişin olmadığı bir dönem. Ulus bir sessizlik dönemine girmelidir."
 WESTHEIA_EST33_EST_establish_the_rahvuskogu:0 "Rahvuskogu'yu Kur"
 WESTHEIA_EST33_EST_establish_the_rahvuskogu_desc:0 "Eski Estonya Anayasası'nın halkını faşizm ve tiranlıktan koruyamadığı kanıtlandığından, ulusu güvence altına almak ve zamanla Estonya halkının 1918'de uğruna savaşıp öldüğü demokratik gelenekleri yeniden tesis etmek için yeni bir anayasa taslağı hazırlanmasına karar verilmiştir."
 WESTHEIA_EST33_EST_exploit_the_banks:0 "Bankaları Sömür"
 WESTHEIA_EST33_EST_exploit_the_banks_desc:0 "Konstantin Päts, Estonya bankacılık sektöründe uzun süredir nüfuzlu bir figürdür. Bazıları Päts'in bankaları yozlaştırmada ve Estonya'nın emekçi halkını sömürmede parmağı olduğu yönünde haince bir iddiada bulunsa da, Päts'in özel sektördeki bağlantıları diktatörlüğümüzü kendi sömürümüz için mükemmel bir konuma yerleştiriyor."
 WESTHEIA_EST33_EST_fight_against_communism:0 "Teslim Olmak Yok"
 WESTHEIA_EST33_EST_fight_against_communism_desc:0 "Düşman işgali altındaki hayatın nasıl bir şey olduğuna zaten tanık olduk ve birçok adamımız bir daha bunu görmek zorunda kalmamak için savaşırken öldü. Saflarımızda vatanseverlik yaygınken, ordularımız sessizce düşmeyecek."
 WESTHEIA_EST33_EST_fight_the_vaps:0 "Vaps'lerle Savaş"
 WESTHEIA_EST33_EST_fight_the_vaps_desc:0 "Sağcı Vapsid hareketi Estonya'nın istikrarını bozmaya çalışıyor. Hareket gaziler ve ulusal kahramanlardan oluşan bir grup olarak başlamış olsa da, hızla [EST.GetLeader]'in Nazilerle karşılaştıracağı aşırı milliyetçi bir harekete dönüştü. Estonya için istikrarlı bir gelecek yaratacaksak, ulusumuzdaki bu haydut unsurlar temizlenmelidir."
 WESTHEIA_EST33_EST_finno_estonian_supremacy_league:0 "Fin-Estonya Üstünlük Birliği"
 WESTHEIA_EST33_EST_finno_estonian_supremacy_league_desc:0 "Artık eski Fin hükûmeti geçmişte kaldığına göre, yeni Fin hükûmetinde kurduğumuz yakın iç içe geçmiş bağlantıları, özyönetim ve anti-Bolşevik duyguya dayalı kalıcı bir dostluğun temelini oluşturmak için kullanabiliriz."
 WESTHEIA_EST33_EST_forest_brothers:0 "Orman Kardeşleri"
 WESTHEIA_EST33_EST_forest_brothers_desc:0 "Baltık Devletleri'nin her yerinde, kışın ağaçlarda saklanan ve işgalci ordulara art arda baskınlar düzenleyen komünizm karşıtı militanların hikayelerini duyuyoruz. Bu özgürlük savaşçılarıyla iletişim kurmalı ve Baltık topraklarındaki çabalarını desteklemek için elimizden geleni yapmalıyız."
 WESTHEIA_EST33_EST_form_scandinavia:0 "Estonya İskandinavya'dır"
 WESTHEIA_EST33_EST_form_scandinavia_desc:0 "Kuzeydeki pek çok kişi Estonya'nın İskandinav kimliği iddiasını bir şakadan ibaret görüyor, ama şimdi alt kıtanın tamamı bizim kontrolümüz altındayken, gülecek kim kaldı? İsveç, Norveç ve Danimarka Estonya'nın çizmeleri altında sıkıca dururken, kimse bizi İskandinavya'yı talep etmekten alıkoyamaz!"
 WESTHEIA_EST33_EST_formalize_baltic_entente:0 "Baltık Antantı'nı Resmîleştir"
 WESTHEIA_EST33_EST_formalize_baltic_entente_desc:0 "Baltık Antantı, savaş zamanlarında birbirimizi korumak için kendimizle Baltık kardeşlerimiz arasında yapılan bir anlaşmadır, ancak bu anlaşmaya ne kadar sadık kalındığı en iyi ihtimalle şüphelidir. Almanlar ve Sovyetler toplu olarak ensemizde nefes alıp verirken ve İngilizler kıyılarımızdan çok uzaktayken, işbirliği kırılgan bağımsızlığımızı korumak için hiç bu kadar hayati olmamıştı."
 WESTHEIA_EST33_EST_fortify_tallinn:0 "Tallinn'i Tahkim Et"
 WESTHEIA_EST33_EST_fortify_tallinn_desc:0 "Birçoğu Estonya sınırının tamamını tutabileceğimize inanmak istese de, gerçekçi olarak hayatta kalacaksak bazı yerlerden vazgeçmemiz gerektiğini biliyoruz. Başkentin etrafındaki kaleler, bedeli ne olursa olsun altyapımızın çekirdeğini korumamızı sağlayacaktır."
 WESTHEIA_EST33_EST_fortify_the_border:0 "Sınırı Tahkim Et"
 WESTHEIA_EST33_EST_fortify_the_border_desc:0 "Düşmanlarımızla sınırda buluşacağız ve Letonya ve Litvanya'daki kardeşlerimizin düşmeyeceğine inanacağız. Bu plan ne kadar iddialı olursa olsun, tek bir karış toprağın bile bir daha asla Sovyet veya Alman işgaline maruz kalmasına izin vermemeliyiz."
 WESTHEIA_EST33_EST_glory_of_war:0 "Savaşın Zaferi"
 WESTHEIA_EST33_EST_glory_of_war_desc:0 "Biz bir gaziler hükûmetiyiz, ancak birçok Vapsid üyesi aktif hizmete geri dönemeyecek kadar yaşlı veya yaralanmalarından dolayı yıpranmış durumda. Belki de bu eski savaş köpekleri, yeni nesil Estonyalı askerleri savaşın yollarında eğitmek için yeni bir amaç bulabilirler."
 WESTHEIA_EST33_EST_hold_saaremaa:0 "Saaremaa'yı Tut"
 WESTHEIA_EST33_EST_hold_saaremaa_desc:0 "Uzun ve çetin bir direnişe hazır olmalıyız. Estonya takımadaları anakaranın sanayisinden yoksun olsa da, adaları son bir direniş için hazırlamak bize direniş savaşçılarını destekleyebileceğimiz ve zamanla yurdumuzu geri alabileceğimiz bir operasyon üssü sağlayacaktır."
 WESTHEIA_EST33_EST_ismaaliit:0 "Isamaaliit"
 WESTHEIA_EST33_EST_ismaaliit_desc:0 "Päts'in kendi partisi bile ülkedeki tüm siyasi makamlardan men edilmişken, diktatörlüğün etrafında örgütleneceği yeni bir partiye ihtiyacı var. Vatanseverler Birliği, ulusu Estonya'nın sınırları içindeki ve dışındaki tüm tehditlerden koruyacaktır."
 WESTHEIA_EST33_EST_join_the_allies:0 "Müttefiklere Katıl"
 WESTHEIA_EST33_EST_join_the_allies_desc:0 "Müttefikler, [ROOT.GetAdjective] bağımsızlığının bir dostu olduklarını kanıtladılar ve şimdi geriye kalan tek şey, [ROOT.GetNameDef]'in Müttefik ittifakına resmî girişiyle bu dostluğu resmîleştirmektir."
 WESTHEIA_EST33_EST_join_the_axis:0 "Mihver'e Katıl"
 WESTHEIA_EST33_EST_join_the_axis_desc:0 "Artık Almanlar niyetimizden emin olduğuna göre, Estonya'nın Mihver'e girişinin tamamen makul olması gerektiğinden eminiz."
 WESTHEIA_EST33_EST_long_push_east:0 "Uzun İlerleme"
 WESTHEIA_EST33_EST_long_push_east_desc:0 "Seferimizin bu kadar iyi gideceğini beklemiyorduk, ama işte buradayız; tüfekler elimizde ve düşmanımızın çekirdek topraklarına doğru ilerliyoruz. Onların toprakları geniş, bizimki küçük ve hazırlanmamız gereken çetin bir yolculuk olacak."
 WESTHEIA_EST33_EST_look_north:0 "Kuzeye Bak"
 WESTHEIA_EST33_EST_look_north_desc:0 "Tek başına Baltık Devletleri'nin sınırımızdaki Nazilerin ve Sovyetlerin belasına direnmek için yeterli olmayabileceğinin farkındayız, ancak saldırganlarımızın İskandinavya hırsları göz önüne alındığında, belki de kuzeyli müttefiklerimizi Baltık Antantı'na katılmaya ikna edebiliriz."
 WESTHEIA_EST33_EST_march_on_talinn:0 "Tallinn Yürüyüşü"
 WESTHEIA_EST33_EST_march_on_talinn_desc:0 "Estonya'daki pek çok gazi derneği ve paramiliter grup zaten bizim yanımızda olduğundan, Tallinn'e indiğimizde Konstantin Päts'in bize direnemeyeceğinden eminiz. Riigikogu'ya yürüyeceğiz ve kesin bir dille Artur Sirk altında birleşmiş bir Vapsid hükûmeti ilan edeceğiz."
 WESTHEIA_EST33_EST_mobilize_the_vets:0 "Gazileri Seferber Et"
 WESTHEIA_EST33_EST_mobilize_the_vets_desc:0 "Birçok Estonyalı gaziye, Vaps hareketiyle olan ilişkileri nedeniyle aktif hizmete kaydolma hakkı reddedildi. Şimdi hükûmeti ele geçirdiğimize göre, bu adamlara hizmet etme hakkını verebiliriz."
 WESTHEIA_EST33_EST_modernize_capital:0 "Tallinn'i Modernleştir"
 WESTHEIA_EST33_EST_modernize_capital_desc:0 "Büyük Tallinn şehri çok uzun zamandır Alman ve Rus baskıcılarının sefil pençelerinde tutuldu ve henüz Baltık'ın gıpta edilen potansiyeline ulaşamadı. Büyük şehrimiz asla yabancı ordular tarafından yakılmadı ve kirletilmedi ve Avrupa'nın diğer şehirleriyle rekabet edebilmek için modernleştirilmelidir."
 WESTHEIA_EST33_EST_national_council:0 "Ulusal Konseyi Güvence Altına Al"
 WESTHEIA_EST33_EST_national_council_desc:0 "Ulusal Konsey, hükûmetimizin yerel belediyeleri, şehirleri ve şirket odalarını temsil eden koludur. Bu insanların çıkarlarını düzgün bir şekilde temsil edeceksek, temsilcilerinin yalnızca sadık Isamaaliit partisi üyeleri ve askerî personel olmasını sağlamalıyız; çünkü yalnızca onlar Estonya halkının egemenliğini savunma yeteneğine sahiptir."
 WESTHEIA_EST33_EST_national_pride_in_finland:0 "Finlandiya'da Ulusal Gurur Yürüyüşleri"
 WESTHEIA_EST33_EST_national_pride_in_finland_desc:0 "Fin gaziler bizim sahip olduğumuz organizasyondan yoksunlar, bu yüzden belki de onlara sadece pasif desteğimiz Estonya'da gördüğümüz değişimi getirmek için yeterli değil. Finlandiya'da yürüyüşler düzenleyerek, bir gün iki ulusumuzu son savaşın kahramanları altında birleşmiş görebiliriz."
 WESTHEIA_EST33_EST_new_economic_policy:0 "Ekonomi Politikasını Gözden Geçir"
 WESTHEIA_EST33_EST_new_economic_policy_desc:0 "Büyük Buhran’dan çıkarken İngiltere ve Almanya başta olmak üzere dış pazarlarla ticaretimizi geliştirmeli, yerli sanayiyi ve ihracatı destekleyen bir ekonomi politikası izlemeliyiz."
 WESTHEIA_EST33_EST_occupy_norway:0 "Norveç'i İşgal Et"
 WESTHEIA_EST33_EST_occupy_norway_desc:0 "İsveç ve Finlandiya cebimizdeyken, tek yapmamız gereken Norveçlileri boyunduruk altına almak ve İskandinavya anakarasının tamamı Estonya kontrolüne girecek."
 WESTHEIA_EST33_EST_pan_baltic_bank:0 "Pan-Baltık Bankası"
 WESTHEIA_EST33_EST_pan_baltic_bank_desc:0 "Ekonomik birlik artık yürürlükte olduğuna göre, pan-Baltık bir banka ve ortak bir para birimi kurma olasılığımız var."
 WESTHEIA_EST33_EST_prepare_covert_resistance:0 "Gizli Bir Direniş Hazırla"
 WESTHEIA_EST33_EST_prepare_covert_resistance_desc:0 "Direniş, adam ve tüfekten daha fazlasıdır; ikmal hatlarını sabote etmek, direnişle temas kurmak ve mermilerimiz hedeflerini bulurken düşmanlarımızı dağınık ve şaşkın hale getirmektir. Vatanı geri alacaksak [Root.GetAdjective] istihbaratına yatırım yapmalıyız."
 WESTHEIA_EST33_EST_prepare_for_the_inevitable:0 "Kaçınılmaz Olana Hazırlan"
 WESTHEIA_EST33_EST_prepare_for_the_inevitable_desc:0 "Sonsuza kadar dayanamayız; hükûmetimizi sürgüne gitmeye ve [Root.GetAdjective] direniş çabalarını uzaktan desteklemeye hazırlamamız çok önemlidir."
 WESTHEIA_EST33_EST_prepare_underground_resistance:0 "Endüstriyel Bir Direniş Hazırla"
 WESTHEIA_EST33_EST_prepare_underground_resistance_desc:0 "[Root.GetNonIdeologyName] genelindeki büyük fabrikalar kapanıyor ve düşman tarafından ele geçiriliyor, bu nedenle direnişimiz için silah üretmeye devam edebilmemiz için yurtdışından endüstriyel yatırımlar ve ekipman aramak hayati önem taşıyor; gizlice savaşmak zorunda kalsak bile."
 WESTHEIA_EST33_EST_proclaim_finno_ugra:0 "Fin-Ugor Ülküsünü İlan Et"
 WESTHEIA_EST33_EST_proclaim_finno_ugra_desc:0 "Finlandiya artık kontrolümüz altında olduğuna göre, devletimiz içinde Fin kimliğini pekiştirmek için eşsiz bir konumdayız. Kuzey Avrupa'da sayısız Fin-Ugor halkı var ve bu kimliği birleştirerek, Vapsid davası için savaşacak sayısız yeni askeri yanımıza çekebiliriz."
 WESTHEIA_EST33_EST_propose_baltic_union:0 "Bir Baltık Birliği Öner"
 WESTHEIA_EST33_EST_propose_baltic_union_desc:0 "Uluslarımız arasında artık tüm bu farklı varlıklar iç içe geçmişken, resmî bir Baltık Birliği'nin kurulması kaçınılmaz görünüyor. Birlik, tüm üye uluslara birlik içinde oy ve veto hakkı tanıyacak ve uluslarımızı daha da yakınlaştıracaktır."
 WESTHEIA_EST33_EST_rally_the_nation:0 "Ulusu Topla"
 WESTHEIA_EST33_EST_rally_the_nation_desc:0 "Vaps Hareketi, Estonya bağımsızlık savaşından gazilerin oluşturduğu bir harekettir ve Konstantin Päts rejimi altında haksız yere bastırıldık. Estonyalılar için çalışan bir Estonya yaratacaksak, kendimizi dünyaya duyurmalıyız. Ulus boyunca yürümeliyiz ve herkese bilmelerini sağlamalıyız, biz buradayız. Biz Estonya'nın varlığı için savaşan adamlarız ve duyulmayı hak ediyoruz."
 WESTHEIA_EST33_EST_reach_out_to_germany:0 "Almanya ile Temas Kur"
 WESTHEIA_EST33_EST_reach_out_to_germany_desc:0 "Sovyetlerle sadece ruh ve şevkle savaşabilseydik, SSCB yarın dağılırdı, ancak ne yazık ki Estonya bu kadar ezici bir tehdide karşı kendini savunacak insan gücünden yoksun. Belki de Almanlarla aynı safta yer alarak önümüzdeki on yıla kadar hayatta kalabiliriz."
 WESTHEIA_EST33_EST_republican_defence_league:0 "Kaitseliit’i Güçlendir"
 WESTHEIA_EST33_EST_republican_defence_league_desc:0 "Mevcut gönüllü savunma örgütü Kaitseliit’in eğitimini ve orduyla koordinasyonunu güçlendirmeliyiz."
 WESTHEIA_EST33_EST_secure_the_straits:0 "Boğazları Güvence Altına Al"
 WESTHEIA_EST33_EST_secure_the_straits_desc:0 "Danimarka, Atlantik'e geçişimizi engelliyor ve Estonya gemilerinin Kuzey Denizi'nde tur atması için ortadan kaldırılmalıdır."
 WESTHEIA_EST33_EST_sieze_swedish_assets:0 "İsveç Varlıklarına El Koy"
 WESTHEIA_EST33_EST_sieze_swedish_assets_desc:0 "İsveçliler, kendilerine en korkutucu görünen güce tedarik etmekten başka bir şey yapmadan varlıklarının üzerinde oturuyorlar. İskandinav kaynaklarının bu israfı daha fazla devam edemez, Estonya'nın velayeti altına alınmalıdırlar."
 WESTHEIA_EST33_EST_squash_the_opposition:0 "Muhalefeti Ez"
 WESTHEIA_EST33_EST_squash_the_opposition_desc:0 "Sivil hükûmet üzerindeki kontrolümüz tamamlandığına göre, kabinemizdeki ve yerel yönetimlerdeki tüm kara ihanet tohumlarını temizlemeliyiz. Liderliğimize karşı çıkanlar, Isamaaliit'e karşı çıkmanın Estonya'ya karşı çıkmak olduğunu yakında öğreneceklerdir."
 WESTHEIA_EST33_EST_support_independent_militaries:0 "Bağımsız Orduları Destekle"
 WESTHEIA_EST33_EST_support_independent_militaries_desc:0 "Ulusun her yerinde, bağımsız askerî gruplar Estonya'yı yeniden yabancı emperyalizminden korumak için savaşa girmeye can atıyor, ancak bu orduların ruhen sahip oldukları kaynaklardan yoksunlar. İyi ulusumuzu savunmak için gereken kaynaklarla resmî olsun ya da olmasın tüm askerleri donatmalıyız."
 WESTHEIA_EST33_EST_the_brotherhood:0 "Kardeşlik"
 WESTHEIA_EST33_EST_the_brotherhood_desc:0 "Estonya bir boşlukta var olmuyor ve güneyimizde, Estonya devletine entegre olurlarsa hayatta kalma şansları muhtemelen daha iyi olacak iki çok savunmasız ulus yatıyor. Baltık Devletleri kardeştir ve kardeşler olarak birlikte durmalıyız."
 WESTHEIA_EST33_EST_threat_on_our_border:0 "Sınırımızdaki Tehdit"
 WESTHEIA_EST33_EST_threat_on_our_border_desc:0 "Ufukta savaş görünüyor. Ne için olduğunu bilmiyoruz ve kiminle savaşacağımızı bilmiyoruz, ama savaş şahininin pençelerinin [Root.Capital.GetName] için hazırlandığını ve yaklaşan mücadelede bağlılıklarımızın nerede olduğuna karar vermemiz gerektiğini biliyoruz. Güneydeki Nazilere veya Doğudaki Sovyetlere odaklanılarak planlar yapılmalıdır."
 WESTHEIA_EST33_EST_unite_karelia:0 "Karelya'yı Birleştir"
 WESTHEIA_EST33_EST_unite_karelia_desc:0 "Karelya, Fin halkıyla doludur; Karelyalıların kendisinden Doğu Sámi halkına kadar. Finlandiya kontrolümüz altındayken, devletimizi Karelya'ya genişletebilir ve oradaki Fin halkını birleştirebiliriz."
 WESTHEIA_EST33_EST_unite_our_nations:0 "Uluslarımızı Birleştir"
 WESTHEIA_EST33_EST_unite_our_nations_desc:0 "Finlandiya şimdi gazilerinin elinde ve nüfuzumuz yeni Fin hükûmetinin dokusuna sıkıca örülmüşken, tek yapmamız gereken birkaç ipi çekmek ve halkımızı tek bir ulus halinde birleştirebileceğiz."
 WESTHEIA_EST33_EST_unite_the_finnic_identity:0 "Fin Kimliğini Birleştir"
 WESTHEIA_EST33_EST_unite_the_finnic_identity_desc:0 "İskandinav alt kıtasındaki tüm büyük Finlerin kontrolümüz altında olmasıyla, Fin kimliğini birleştirebilir ve Estonyalıların, Finlerin, Samilerin, Nenetlerin ve diğer tüm Fin-Ugor halklarının evi diyebileceği yeni bir devlet ilan edebiliriz."
 WESTHEIA_EST33_EST_unite_the_sami:0 "Sámi'leri Birleştir"
 WESTHEIA_EST33_EST_unite_the_sami_desc:0 "Sámi'ler, Finlandiya, İsveç, Norveç ve Rusya'da var olan dağınık ve yaygın olarak ezilen bir halktır. Çok uzun zamandır, Sámi halkının Fin dillerini konuşma hakkı reddedildi ve zalimlerine karşı savaşmak için gereken insan gücünden yoksunlar. Onları İskandinav emperyalizminden korumak için Sámi'leri devletimiz içinde birleştirmeliyiz."
 WESTHEIA_EST33_EST_vapsid_youth:0 "Vapsid Gençliği"
 WESTHEIA_EST33_EST_vapsid_youth_desc:0 "Vaps'ların çoğunluğu en parlak dönemlerini çoktan geride bıraktı, ancak gençler birkaç on yıl önce Estonya'yı karakterize eden tarihi bağımsızlık mücadelesine tamamen hayran kalmış durumdalar. Bir Vapsid Gençliği kurarak, bu hevesli genç adamlara babalarının ve büyükbabalarının zaferini yeniden yakalamayı umabilecekleri bir yer vereceğiz."
 WESTHEIA_EST33_EST_veterans_government:0 "Gaziler Hükûmeti"
 WESTHEIA_EST33_EST_veterans_government_desc:0 "Önceki bakanlar kurulu zayıf iradeliydi ve Konstantin Päts'in iradelerine boyun eğdi. Vapsid davasına sempati duyan yeni bir bakanlar kuruluna ihtiyacımız var."
 WESTHEIA_EST33_EST_womens_defence_league:0 "Naiskodukaitse’yi Destekle"
 WESTHEIA_EST33_EST_womens_defence_league_desc:0 "1927’den beri çalışan Naiskodukaitse’nin sağlık, iaşe ve ikmal hizmetlerini destekleyerek cephe gerisindeki görevlerini güçlendirmeliyiz."
 WESTHEIA_EST33_constitution_1933:0 "1933 Anayasasını Yürürlüğe Koy"
 WESTHEIA_EST33_constitution_1933_desc:0 "Referandumda kabul edilen anayasa değişikliğini uygulayarak devlet başkanlığı yetkilerini ve hükümetin çalışma düzenini yeniden belirlemeliyiz."
 WESTHEIA_EST33_destroyer_export:0 "Peru’ya Muhrip Satışı"
 WESTHEIA_EST33_destroyer_export_desc:0 "Lennuk ve Vambola’nın Peru’ya satışı, yaşlanan iki geminin bakım yükünü kaldırırken hazineye döviz kazandırıyor. Satış gelirleri, bir yıl boyunca devlet bütçesini ve donanmanın yenilenmesini destekleyecek."
 WESTHEIA_EST33_destroyer_offer_tt:0 "Peru’ya Lennuk ve Vambola’nın satışı teklif edilir."
 WESTHEIA_EST33_destroyer_payment:0 "Estonya Muhriplerinin Ödemesi"
 WESTHEIA_EST33_destroyer_payment_desc:0 "Estonya’dan alınan Lennuk ve Vambola muhriplerinin bedeli ödeniyor. Donanmamızı güçlendiren bu alım, bir yıl boyunca sivil ekonomiden ilave kaynak ayrılmasını gerektiriyor."
 WESTHEIA_EST33_destroyers_transfer_tt:0 "Estonya’nın Lennuk ve Vambola muhripleri Peru donanmasına devredilir."
 WESTHEIA_EST33_devaluation:0 "Kronun Devalüasyonu"
 WESTHEIA_EST33_devaluation_desc:0 "Kronun değerinin düşürülmesi, ihracatçılarımızın dış pazarlarda rekabet etmesini kolaylaştırıyor. İthal malların pahalanması ve tasarrufların değer kaybetmesi ise halk arasında huzursuzluk yaratıyor."
 WESTHEIA_EST33_devalue_kroon:0 "Kronun Devalüasyonu"
 WESTHEIA_EST33_devalue_kroon_desc:0 "Kronun değerini düşürerek ihracatın rekabet gücünü yeniden sağlayabiliriz. Para biriminin değerindeki kayıp ise toplumda huzursuzluğa yol açacaktır."
 WESTHEIA_EST33_kalev_lembit:0 "Kalev ve Lembit"
 WESTHEIA_EST33_kalev_lembit_desc:0 "İngiltere’den alınan mayın dökücü denizaltılarla kıyı savunmamızı güçlendirelim."
 WESTHEIA_EST33_naiskodukaitse:0 "Naiskodukaitse"
 WESTHEIA_EST33_naiskodukaitse_desc:0 "Naiskodukaitse gönüllüleri ilk yardım, iaşe, haberleşme ve sivil savunma çalışmalarında Kaitseliit’e destek veriyor. Yaralıların bakımı ve birliklerin gerisindeki düzenli hizmetler, cephedeki askerlerin yükünü hafifletiyor."
 WESTHEIA_EST33_parliamentary_instability:0 "Parlamenter İstikrarsızlık"
 WESTHEIA_EST33_parliamentary_instability_desc:0 "Parçalanmış meclis ve kırılgan koalisyonlar, ekonomik bunalıma karşı ortak bir program oluşturulmasını güçleştiriyor. Birbiri ardına düşen hükümetler, devletin karar alma gücünü ve halkın parlamentoya güvenini zayıflatıyor."
 WESTHEIA_EST33_rahvuskogu_required_tt:0 "Rahvuskogu kurulmuş olmalı."
 WESTHEIA_EST33_sell_destroyers:0 "Muhripleri Peru’ya Sat"
 WESTHEIA_EST33_sell_destroyers_desc:0 "Lennuk ve Vambola için Peru’ya satış teklifi göndererek donanmanın yenilenmesine kaynak sağlayabiliriz."
 WESTHEIA_EST33_sterling_peg:0 "Kronun Sterline Bağlanması"
 WESTHEIA_EST33_sterling_peg_desc:0 "Devalüasyonun ardından kronu sterline bağlayarak dış ticarette öngörülebilirliği ve parasal istikrarı güçlendirebiliriz."
 WESTHEIA_EST33_sterling_peg_idea:0 "Sterline Bağlı Kron"
 WESTHEIA_EST33_sterling_peg_idea_desc:0 "Kronun sterline bağlanması, başlıca ihracat pazarlarımızla ticarette kur belirsizliğini azaltıyor. Daha öngörülebilir bir para düzeni, işletmelerin üretim ve yatırım planlarını destekliyor."
 WESTHEIA_EST33_sterling_relations:0 "Sterlin Bölgesinde Ticari İş Birliği"
 WESTHEIA_EST33_submarine_delivery_tt:0 "Tallinn’de Kalev ve Lembit adlı iki denizaltı hizmete alınır."
 WESTHEIA_EST33_tks_delivery_tt:0 "Depoya 6 adet makineli tüfekli TKS tanketi eklenir."
 WESTHEIA_EST33_tks_export:0 "Estonya Tanket Siparişi"
 WESTHEIA_EST33_tks_export_desc:0 "Estonya’ya teslim edilen altı TKS tanketinin satışından elde edilen gelir, Polonya sanayisine yeni kaynak sağlıyor. İhracat ödemeleri, siparişin karşılandığı dönemde ekonomimizi destekliyor."
 WESTHEIA_EST33_tks_payment:0 "Polonya Tanketlerinin Ödemesi"
 WESTHEIA_EST33_tks_payment_desc:0 "Polonya’dan alınan altı TKS tanketinin ödemeleri bütçemizden karşılanıyor. Hafif zırhlı araç kuvvetimizi yenileyen bu sipariş, ödeme dönemi boyunca sivil ekonominin kaynaklarını bağlıyor."
 WESTHEIA_EST_1933_cabinet_1_tt:0 "Jaan Tõnisson devlet başkanı olur."
 WESTHEIA_EST_1933_cabinet_2_tt:0 "Konstantin Päts yeniden devlet başkanı olur."
 WESTHEIA_EST_1933_tree:0 "Estonya 1933 Milli Hedef Ağacı"
