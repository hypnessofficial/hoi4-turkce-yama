 despotism_conservatism_desc:0 "§YUlusal Muhafazakârlık§!\n\n\n\n\n\n\n\n\n\n\n\n£GFX_westheia_real_banner_national_conservatism\n\n\n\n\n\n\n\n\n\n\n\n\nMillî birliği, geleneksel kurumları ve toplumsal düzeni korumayı önceliklendirir. Güçlü yürütme ve yerleşik seçkinlerin etkisi, sınırlı siyasi katılım ve ihtiyatlı reformlarla birlikte sürer."
