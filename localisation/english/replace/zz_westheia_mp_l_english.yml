 WESTHEIA_LAT_fiat_cr1_inventory:0 "Fiat CR.1"
 WESTHEIA_LAT_fiat_cr1_inventory_desc:0 "İtalya’dan alınan CR.1 avcılarının 1931’de kara havacılığına devredilen beş uçaklık grubu. Hispano-Suiza motoru ve iki sabit makineli tüfek taşır. Şamandıralı deniz uçağı değildir."
