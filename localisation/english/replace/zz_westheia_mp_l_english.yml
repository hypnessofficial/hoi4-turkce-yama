 WESTHEIA_CAN_FEDERAL_FINANCE_DESC:0 "Büyük Buhran, federal hükümet ile eyaletler arasındaki mali yük paylaşımını sürdürülemez hâle getirdi. Gelir kaynaklarını, yardım harcamalarını ve yönetimler arası iş birliğini yeniden ele alarak kamu maliyesine daha sağlam bir düzen kazandırmalıyız."
