 WESTHEIA_XIC33_organize_exiled_cadres:0 "Sürgündeki Kuzeydoğu Kadrolarını Örgütle"
 WESTHEIA_XIC33_organize_exiled_cadres_desc:0 "Kuzeydoğudan ayrılmak zorunda kalan idarecileri, mühendisleri ve girişimcileri bir araya getireceğiz. Onların bilgi ve tecrübesi, denetimimizdeki bölgelerde yeni ekonomik imkânlar oluşturmamıza yardımcı olacaktır."
 WESTHEIA_XIC33_reorganize_the_northeastern_army:0 "Kuzeydoğu Ordusunu Yeniden Düzenle"
 WESTHEIA_XIC33_reorganize_the_northeastern_army_desc:0 "Mançurya’nın kaybının ardından kuzeyde kalan birliklerimizin komuta, kadro ve ikmal düzenini yeniden ele alacağız. Dağınık kuvvetlerimizi ortak bir askerî yapı içinde tutmak, ordumuzun gücünü korumanın ilk adımıdır."
 WESTHEIA_YUG33_AFTER_ASSASSINATION_TT:0 "Kral Aleksandar’ın suikast eventi gerçekleşmiş olmalı."
 WESTHEIA_YUG33_crisis_recovering:0 "Tarım ve Bankacılık Krizinde Hafifleme"
 WESTHEIA_YUG33_crisis_recovering_desc:0 "Kur düzenlemeleri ticaretin ve kredi akışının üzerindeki baskıyı azalttı. Ancak çiftçi borçları ve bankaların sorunlu alacakları çözülmeden ekonomi bütünüyle toparlanamaz."
