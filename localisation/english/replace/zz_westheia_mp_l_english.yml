 DNZ_conservative_jurist:0 "Muhafazakar Hukukçu"
 DNZ_conservative_jurist_desc:0 "Hukukun üstünlüğüne ve yerleşik kurumların devamlılığına bağlı olan Ziehm, Özgür Şehir’in siyasi düzenini radikal hareketlerin baskısına karşı korumaya çalışır. Onun gözünde Danzig’in istikrarı, meydanlardaki sloganlardan değil anayasal düzenin muhafazasından geçer."
 DOCTRINE_MASTERY_OVERCAPPED:0 "£doctrine_mastery §Y$VALUE|H0$§!"
 DOTTET_LINE_SEPERATOR:0 "\n--------------\n"
 ENERGY_STRIP_DESC:0 "Enerji, fabrikaların ve binaların çalışmasını sağlar. Üretim ihtiyacı karşılayamadığında sanayimiz yavaşlar. Yeni elektrik santralleri inşa etmek ve santrallerde kömür yakmak enerji üretimini artırır."
 ENG_1933_architect_of_national_consensus:0 "Ulusal Uzlaşmanın Mimarı"
 ENG_1933_architect_of_national_consensus_desc:0 "Ekonomik buhranın ortasında partiler üstü Ulusal Hükûmetin başına geçen MacDonald, mali dengeyi ve iç istikrarı uzlaşmayla korumaya çalışır. Savaştan kaçınma kararlılığı ise ülkenin askerî seferberliğe duyduğu desteği sınırlar."
 ENG_oswald_mosley_ideology:0 "Britanya Faşizmi"
 ENG_oswald_mosley_ideology_desc:0 "§YBritanya Faşizmi§!\n\n\n\n\n\n\n£GFX_westheia_real_banner_british_fascism\n\n\n\n\n\n\n\nBritanya milliyetçiliğini korporatif ekonomi ve güçlü merkezî liderlikle birleştirir. Parlamenter parti rekabetinin yerine devlet tarafından örgütlenen bir temsil ve üretim düzeni kurmayı amaçlar."
 EXCHANGE_GENERALS_ACTION_DESC:0 "Esir alınan komutanlar arasında bir takas teklif et."
 EXCHANGE_GENERALS_TITLE:0 "Esir Takası Teklif Et"
 EXP_TOOLTIP_ARMY_NO_TRAIN_PROFESSIONALISM:0 "§REğitim düşük §YProfesyonellik§!:\n§! nedeniyle durduruldu - Etkili eğitim XP sınırı: $PENALTY|+=%0$"
 FIN_1933_peg_markka_to_sterling:0 "Markkayı Sterline Bağla"
 FIN_1933_peg_markka_to_sterling_desc:0 "Altın standardından ayrılmamızın ardından markkanın değerine istikrar kazandırmalıyız. Sterlinle sabit bir kur ilişkisi kurmak, Britanya ile ticaretimizi kolaylaştıracak ve ekonomik toparlanmamız için daha öngörülebilir koşullar sağlayacaktır."
 FIN_1933_sterling_peg:0 "Sterline Bağlı Markka"
 FIN_1933_sterling_peg_desc:0 "Markkanın sterline bağlanması, dış ticarette kur belirsizliğini azaltarak ekonomik toparlanmayı destekliyor."
 FIN_1933_sterling_relations:0 "Sterlin İş Birliği"
 FIN_power_from_the_dams_dm:0 "Barajlardan Gelen Güç"
 FRA_1933_diplomat_of_the_fragile_republic:0 "Kırılgan Cumhuriyetin Diplomatı"
 FRA_1933_diplomat_of_the_fragile_republic_desc:0 "Paul-Boncour, parlamentodaki kırılgan dengeler arasında Cumhuriyetin güvenliğini diplomatik iş birliği ve kolektif güvenlik yoluyla sağlamaya çalışır. Dış politikadaki kararlılığına rağmen hükûmeti, iç siyasetin istikrarsızlığından etkilenmektedir."
