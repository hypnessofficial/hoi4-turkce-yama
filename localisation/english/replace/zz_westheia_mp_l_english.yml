 TUR_1933_university_reform_desc:0 "Yükseköğretimin yeniden düzenlenmesi, ülkemizin bilimsel çalışmalarına yeni bir yön veriyor. Yenilenen kurumlar, öğretim kadroları ve araştırma anlayışı, çağdaş bilginin geliştirilmesi için daha elverişli bir ortam hazırlıyor."
 TUR_ataturk_saved.1.a:0 "Ve kurtlar sabaha kadar uludu."
 TUR_ataturk_saved.1.d:0 "Doktorlar artık sonu bekliyordu. Cumhuriyet, kendisini uçurumun kenarından çekip çıkaran adamın bir gün aynı uçurum tarafından yutulacağını kabullenmeye hazırlanıyordu. Millet sessizdi. Herkes aynı sorunun cevabını bekliyordu: Mustafa Kemal Atatürk daha ne kadar dayanabilirdi?\n\nFakat Mustafa Kemal teslim olmadı.\n\nGünlerce süren hastalık bedenini tüketti. Ölüm, kapısına kadar geldi; fakat karşısında boyun eğmeyecek bir irade buldu. Bir zamanlar yıkılmak üzere olan bir milleti ayağa kaldıran adam, şimdi kendi bedeninin karşısında aynı mücadeleyi veriyordu.\n\nVe sonunda beklenen olmadı.\n\nŞafak söktüğünde ölüm haberi yerine başka bir haber yayıldı: Mustafa Kemal Atatürk hayattaydı.\n\nBu yalnızca bir hastalığın yenilmesi değildi. Cumhuriyet, kurucusunu ikinci kez kazanmıştı. Milletin üzerine çöken karanlık dağılmış, umutsuzluğun yerini yeniden inanç almıştı.\n\nTarih onun sonunu çoktan yazdığını sanıyordu.\n\nFakat Mustafa Kemal, tarihin yazdığı sonu kabul etmeyecekti.\n\nKaderi kendi yazacaktı."
 TUR_ataturk_saved.1.t:0 "Atatürk İyileşti!"
 TUR_ataturk_shrapnel.1.a:0 "İnanılmaz. Cidden inanılmaz."
 TUR_ataturk_shrapnel.1.d:0 "Cephede yaşanan şiddetli çatışmalar sırasında bir şarapnel parçası Mustafa Kemal Atatürk'ün gözüne isabet etti. Patlamanın ardından yere yığıldı. Etrafındaki askerler derhal yanına koşarak onun durumunu kontrol etti. Ancak kısa bir süre sonra Atatürk ayağa kalktı. Sanki hiçbir şey olmamış gibi üzerindeki tozu silkeleyerek yeniden birliklerine komut vermeye başladı. Çevresindekiler gördüklerine inanamadı. Ağır yaralanmış olmasına rağmen Atatürk cepheden ayrılmayı reddetti. Yaralı gözü bir göz bandıyla kapatıldı ve o, hiçbir şey olmamışçasına ordusunun başında komuta etmeyi sürdürdü."
 TUR_ataturk_shrapnel.1.t:0 "Başkomutan Yaralandı"
