 CHI_long_term_economic_planning_GDC33:0 "Guangdong Şeker Sanayisi Programı"
 CHI_long_term_economic_planning_GDC33_fallback:0 "Uzun Vadeli Ekonomik Planlama"
 CHI_long_term_economic_planning_desc_GDC33:0 "Şeker kamışı tarımı, eyalet fabrikaları ve satış ağları ortak bir program çerçevesinde düzenlenmektedir. Üretim ve ticaretin eşgüdümü, yerel sanayinin gelişmesini ve eyaletin gelir kaynaklarının güçlenmesini desteklemektedir."
 CHI_long_term_economic_planning_desc_GDC33_fallback:0 "Bürokratik aygıtımız Merkezi Hükûmetinki kadar büyük değil. Bu, ekonomik kalkınmayı engelleyen bürokrasinin çoğunu kesmemize ve mütevazı çabalarımızı mümkün olan en yüksek getiriyi elde etmek için odaklamamıza olanak tanır."
 CHI_peoples_tutelage_ideology:0 "Halk Vesayeti"
 CHI_peoples_tutelage_ideology_desc:0 "§YHalk Vesayeti§!\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n£GFX_westheia_real_banner_tutelage\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nHalkın anayasal yönetime hazırlanması gerektiğini savunan parti, geçiş döneminin siyasi rehberliğini üstlenir. İdari merkezileşme ve devlet inşası, sınırlı siyasi rekabetle birlikte yürütülür."
 CHI_sea_develop_capital_arsenal_GDC33:0 "Shijing Cephaneliğini Modernleştir"
