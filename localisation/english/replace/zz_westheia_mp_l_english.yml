 TUR_turkish_soviet_war.1.a:0 "Zafer bizimdir."
 TUR_turkish_soviet_war.1.d:0 "Trabzon, 120 gün boyunca Sovyet saldırısına karşı dayandı. Moskova kesin bir zafer elde edemedi ve şartlarımızı kabul etmek zorunda kaldı."
 TUR_turkish_soviet_war.1.t:0 "Trabzon Dayanıyor"
 TUR_turkish_soviet_war.2.a:0 "Ağır bir yenilgi."
 TUR_turkish_soviet_war.2.d:0 "Trabzon Sovyetlerin eline geçti. Cephedeki yenilgimiz sonucunda Moskova'nın dayattığı şartları kabul etmek zorunda kaldık."
 TUR_turkish_soviet_war.2.t:0 "Trabzon Düştü"
 TUR_turkish_soviet_war_crisis:0 "Trabzon Cephesi"
 TUR_turkish_soviet_war_crisis_desc:0 "Trabzon'u 120 gün boyunca Sovyetlerin eline düşürmemeliyiz. Şehri sürenin sonuna kadar elimizde tutarsak Moskova şartlarımızı kabul etmek zorunda kalacak.\n\n§GKazanırsak:§!\n+10% İstikrar\n+5% Savaş Desteği\n+150 Siyasi Güç\n+5 Harita Dışı Sivil Fabrika\nGürcistan ve Ermenistan askerden arındırılacak.\n\n§RKaybedersek:§!\n-10% İstikrar\n-10% Savaş Desteği\nTrabzon Sovyetler Birliği'ne bırakılacak.\nİstanbul ve Boğaz çevresi askerden arındırılacak."
 USA_1933_complete_hoover_dam:0 "Hoover Barajını Tamamla"
 USA_1933_complete_hoover_dam_desc:0 "Colorado Nehri üzerindeki büyük baraj, kurak güneybatıya su ve elektrik sağlayacak. İnşaatı tamamlayarak hem bölgenin kalkınmasını hızlandırabilir hem de binlerce işçiye istihdam sağlayabiliriz."
 USA_1933_shadow_of_the_great_depression:0 "Büyük Buhran'ın Gölgesinde"
 USA_1933_shadow_of_the_great_depression_desc:0 "Ekonomik çöküş, işsizlik ve bankacılık krizinin baskısı altındaki Hoover yönetimi, kamuoyunun güvenini yeniden kazanmakta zorlanmaktadır. Altyapı yatırımlarına verilen desteğe rağmen süren buhran, hükûmetin siyasi hareket alanını ve toplumsal istikrarı zayıflatır."
 USA_1933_vinson_trammell_act:0 "Vinson–Trammell Yasasını Geçir"
 USA_1933_vinson_trammell_act_desc:0 "Donanmamızın antlaşmaların izin verdiği güce ulaşabilmesi için uzun vadeli bir inşa programına ihtiyacı var. Yeni tersane yatırımları, yaşlanan gemilerin yerini alacak filonun temelini oluşturacaktır."
