 WESTHEIA_LAT33_BALTIC_align_paramilitarists:0 "Paramiliterleri Yeniden Hizala"
 WESTHEIA_LAT33_BALTIC_align_paramilitarists_desc:0 "[Root.GetNameDef] genelinde çoğu yalnızca [Root.GetAdjective] kendi kaderini tayin hakkının korunmasına adanmış birçok paramiliter grup var. Takdire şayan olsa da, bu grupların bizi [SOV.GetAdjective] kuklaları olarak değil, [Root.GetAdjective] devletinin mantıksal devamı olarak görmeleri tercih edilir."
 WESTHEIA_LAT33_BALTIC_allied_shipments:0 "Müttefik Sevkiyatlarını Artır"
 WESTHEIA_LAT33_BALTIC_allied_shipments_desc:0 "1918'den beri [Root.GetNonIdeologyAdjective] ordusu Büyük Britanya'dan bize gönderilen sevkiyatlarla donatılmıştır ve Müttefiklere sevkiyatlar büyük ölçüde artırılmazsa [Root.GetNonIdeologyName]'in başka bir Sovyet kukla hükûmetine tabi olabileceğini anlatmak için çaba göstermeliyiz."
 WESTHEIA_LAT33_BALTIC_arm_baltic_reds:0 "Baltık Kızıllarını Silahlandır"
 WESTHEIA_LAT33_BALTIC_arm_baltic_reds_desc:0 "Sahne hazır, komünist şevk tüm Baltık'ta yanıyor. Kızılların şimdi tek ihtiyacı olan bizden gelen sinyal ve kaynaklar ve Baltık devrimini ateşleyeceğiz!"
 WESTHEIA_LAT33_BALTIC_arm_the_nation:0 "Ulusu Silahlandır"
 WESTHEIA_LAT33_BALTIC_arm_the_nation_desc:0 "[Root.GetNonIdeologyName]'in her yerinde bir Sovyet işgali tehdidiyle yüzleşmeye hazır ancak bunu yapacak ekipmandan yoksun adamlar var. Piyade teçhizatının hızlı üretimi için silah sanayimizi hazırlamalıyız."
 WESTHEIA_LAT33_BALTIC_arms_industry:0 "Silahlanmayı Tamamla"
 WESTHEIA_LAT33_BALTIC_arms_industry_desc:0 "Sanayimizin modernizasyonu tamamlandığına ve ülkemizde faaliyet gösteren sayısız yerli askerî sanayi kuruluşu olduğuna göre, [Root.GetAdjective] silah sanayisi nihayet gerçek potansiyeline ulaşabilir!"
 WESTHEIA_LAT33_BALTIC_attract_workers_to_capital:0 "İşçileri [Root.Capital.GetName]'e Çek"
 WESTHEIA_LAT33_BALTIC_attract_workers_to_capital_desc:0 "[Root.GetNonIdeologyName]'in işçileri kırsal kesimde dağınık bir şekilde yayılmış durumdalar ve genellikle modası geçmiş tarım sektöründe çalışıyorlar. Ulusumuzu savaş için sanayileştirmek istiyorsak, işçileri [Root.Capital.GetName]'deki fabrikalara çekmeliyiz!"
 WESTHEIA_LAT33_BALTIC_autobahn:0 "[Root.GetAdjective] Otobanı"
 WESTHEIA_LAT33_BALTIC_autobahn_desc:0 "Eğer altyapısı hızlı ve sürekli bir işgücü akışını kolaylaştırmıyorsa, [Root.GetNonIdeologyName]'in ne kadar iyi sanayileşmiş olduğu pek önemli değil. Altyapı sektörümüzü Reich'ınkine göre modelleyerek, onların sahip olduğu verimliliği elde edebiliriz."
 WESTHEIA_LAT33_BALTIC_axis_investments:0 "[GetBalticAxisInvesmentsAdj] Yatırımları Ara"
 WESTHEIA_LAT33_BALTIC_axis_investments_desc:0 "[GetBalticAxisInvesmentsDesc]"
 WESTHEIA_LAT33_BALTIC_axis_investments_desc_fasc_eur:0 "Faşizm Avrupa'da güçlü bir varlığa sahiptir ve bazı anlaşılır çekinceler olsa da, Faşist ticaretinin ve yatırımlarının [ROOT.GetNonIdeologyAdjective] ekonomisini ölçülemez derecede güçlendireceği inkar edilemez."
 WESTHEIA_LAT33_BALTIC_axis_investments_desc_fasc_int:0 "Faşizm dünya çapında güçlü bir varlığa sahiptir ve bazı anlaşılır çekinceler olsa da, Faşist ticaretinin ve yatırımlarının [ROOT.GetNonIdeologyAdjective] ekonomisini ölçülemez derecede güçlendireceği inkar edilemez."
 WESTHEIA_LAT33_BALTIC_axis_investments_desc_ger:0 "Almanya'nın ticaret limanları Baltık boyunca mevcuttur ve bir zamanlar düşman olsak da, Mihver ticaretinin ve yatırımlarının [ROOT.GetNonIdeologyAdjective] ekonomisini ölçülemez derecede güçlendireceği inkar edilemez."
 WESTHEIA_LAT33_BALTIC_axis_investments_desc_jap:0 "[JAP.GetName] ekonomik ve askerî gücünü kanıtladı ve tam olarak komşu olmasalar da, [JAP.GetAdjective] ticaretinin ve yatırımlarının [ROOT.GetNonIdeologyAdjective] ekonomisini ölçülemez derecede güçlendireceği inkar edilemez."
 WESTHEIA_LAT33_BALTIC_axis_investments_idea:0 "Mihver Yatırımları"
 WESTHEIA_LAT33_BALTIC_axis_investments_idea_1:0 "Mihver Yatırımları"
 WESTHEIA_LAT33_BALTIC_baltic_fleet:0 "Baltık Filosu"
 WESTHEIA_LAT33_BALTIC_baltic_fleet_desc:0 "[Root.GetNonIdeologyAdjective] filosu dünyanın gıpta ettiği bir filo olmasa da, doğru yatırımla [Root.GetNonIdeologyName]'i denizdeki herhangi bir işgal girişimine karşı savunabileceğini kanıtlayabilir."
 WESTHEIA_LAT33_BALTIC_balticwall:0 "Baltık Duvarı"
 WESTHEIA_LAT33_BALTIC_balticwall_desc:0 "Doğu'daki tahkimatlar, düşmanlarımız bunun yerine denizden bir saldırı gerçekleştirmeyi seçerse işe yaramaz! İngilizlere, Almanlara veya Sovyetlere rakip olabilecek bir donanma asla inşa edemeyebiliriz, ancak kıyı savunmalarımıza karşı onları çaresiz bırakmak için elimizden geleni yapabiliriz."
 WESTHEIA_LAT33_BALTIC_belarus_ssr:0 "[Root.GetNonIdeologyName]-Belarus SSC"
 WESTHEIA_LAT33_BALTIC_belarus_ssr_desc:0 "Belarus ve Baltık'ı birleştirme kavramı yabancı bir kavram değildir. Uzun zaman önce Litvanya-Belarus Sovyet Sosyalist Cumhuriyeti, bu iki görünüşte farklı halkın uyumlu bir birleşimi olarak var oldu. Sosyalizm kültür ve dil sınırları tanımaz ve [Root.GetAdjective] ve Belaruslu işçilerin bir arada yaşayamaması için çok az neden görüyoruz."
 WESTHEIA_LAT33_BALTIC_british_aircraft:0 "İngiliz Uçakları Sipariş Et"
 WESTHEIA_LAT33_BALTIC_british_aircraft_alt:0 "Yabancı Uçak İmalatı"
 WESTHEIA_LAT33_BALTIC_british_aircraft_default:0 "İngiliz Uçak İmalatı"
 WESTHEIA_LAT33_BALTIC_british_aircraft_desc:0 "İngiliz uçaklarına ilişkin mevcut tecrübemizden yararlanarak hava kuvvetlerimiz için yeni uçak, yedek parça ve teknik destek sipariş etmeliyiz. Satın alınan uçaklar, yerli üretim lisansı edinildiği anlamına gelmez."
 WESTHEIA_LAT33_BALTIC_british_aircraft_desc_alt:0 "Yerli havacılık tasarımlarına yönelik çabalar şimdiye kadar en iyi ihtimalle ılımlı kaldı. Hava kuvvetleri şimdiye kadar Alman ve Sovyet kuvvetlerinden ele geçirilen uçaklara güvendi, ancak hayatta kalmak istiyorsak yerli uçak üretimine başlamalıyız ve yabancı bir hava kuvvetlerinden gelen yardım zafer kazanmanın anahtarı olabilir..."
 WESTHEIA_LAT33_BALTIC_british_aircraft_desc_default:0 "Yerli havacılık tasarımlarına yönelik çabalar şimdiye kadar en iyi ihtimalle ılımlı kaldı. Hava kuvvetleri şimdiye kadar Alman ve Sovyet kuvvetlerinden ele geçirilen uçaklara güvendi, ancak hayatta kalmak istiyorsak yerli uçak üretimine başlamalıyız ve İngiliz hava kuvvetleri zafer kazanmanın anahtarı olabilir..."
 WESTHEIA_LAT33_BALTIC_british_designers:0 "İngiliz Tasarımcıları Davet Et"
 WESTHEIA_LAT33_BALTIC_british_designers_desc:0 "İngiliz tasarımlarını kapsamlı bir şekilde inceledik ve [Root.Capital.GetName]-Crossley Motorları'nın başarılı bir girişim olduğu kanıtlandığından, İngiliz tasarımcıları [Root.GetNonIdeologyAdjective] Mühendislik Şirketi'ne katılmaya resmî davetiyeler göndermek bizim için iyi olacaktır."
 WESTHEIA_LAT33_BALTIC_communist_opposition:0 "Muhalefete Geç"
 WESTHEIA_LAT33_BALTIC_communist_opposition_desc:0 "Sovyetler Birliği'nin ne [Root.GetNameDef]'e ne de halkına dost olmadığı kanıtlanmıştır ve [Root.GetNameDef]'in anahtarlarını, [Root.GetAdjective]'i yağmalamaktan başka bir şey istemeyen Kızıl Ordu'nun akbabalarına teslim etmek aptallık olur. Onlar kapitalistlerden daha güvenilir değiller ve eğer [Root.GetCommunistParty] başarılı olacaksa, bu tek başına yapılmalıdır!"
 WESTHEIA_LAT33_BALTIC_concessions_for_catholics:0 "Katolikler İçin Tavizler"
 WESTHEIA_LAT33_BALTIC_concessions_for_catholics_desc:0 "[Root.GetNameDef]'in alt sınıflarının çoğu dindar Katoliktir ve ilk İşçi Cumhuriyeti'nde dinî uygulama Kızıl Ordu tarafından sert bir şekilde bastırılmıştır. Bu durum [Root.GetNameDef]'in yoksullarının çoğunu devrime karşı çevirdi, bu yüzden eğer gerçekten halkın cumhuriyeti olacaksak, onlara inançlarının korunacağına dair kesin bir güvence vermeliyiz."
 WESTHEIA_LAT33_BALTIC_crossley_motors:0 "[Root.Capital.GetName]-Crossley Motorları"
 WESTHEIA_LAT33_BALTIC_crossley_motors_desc:0 "Ulusumuzda artık yabancı yatırım yaygınlaşmış ve otomobil üretimi makul bir verimlilikteyken, [Root.GetNonIdeologyAdjective] ordusu içinde kullanılmak üzere orijinal tasarımlar oluşturmak için Crossley Motor Şirketi ile işbirliği yapabiliriz!"
 WESTHEIA_LAT33_BALTIC_crush_forest_brothers:0 "Orman Kardeşlerini Ez"
 WESTHEIA_LAT33_BALTIC_crush_forest_brothers_desc:0 "Orman Kardeşleri, yönetimi ele geçirmemizden bu yana ulusumuz için bir bela oldular; sanayilerimizi, demiryollarımızı sabote ediyor ve resmî hükûmet gösterilerini bozuyorlar. [Root.GetNonIdeologyName]'in ormanlarına girmeli ve bu yanlış yönlendirilmiş bireyleri kökünden sökmeliyiz."
 WESTHEIA_LAT33_BALTIC_defence_of_our_nation:0 "Ulusumuzun Savunması"
 WESTHEIA_LAT33_BALTIC_defence_of_our_nation_desc:0 "Sivil sanayi, savunmamız için silah sanayisi kadar önemlidir. Makine seslerinin sürekli uğultusu, vatansever halkı ulusumuzu sanayileştirme görevini yaparken tüm [Root.GetNonIdeologyName] boyunca yankılanacak."
 WESTHEIA_LAT33_BALTIC_direct_intervention:0 "Doğrudan Sovyet Müdahalesi"
 WESTHEIA_LAT33_BALTIC_direct_intervention_desc:0 "Hükûmeti tek başımıza geri alamadığımızı kanıtladık ve mücadelemizde bize yardım etmeleri için [SOV.GetNameDef]'deki müttefiklerimizi çağırmalıyız."
 WESTHEIA_LAT33_BALTIC_domestic_motors:0 "Yerli Bir Motor Şirketi"
 WESTHEIA_LAT33_BALTIC_domestic_motors_desc:0 "Yabancı tasarımlar iyidir, ancak onlara sonsuza kadar güvenemeyiz. [Root.GetNonIdeologyName] gururlu bir ulustur ve dünyaya tasarımcılarımızın ve düşünürlerimizin Batı'dakiler kadar yeterli olduğunu göstermeliyiz."
 WESTHEIA_LAT33_BALTIC_eastwall:0 "Doğu Duvarı"
 WESTHEIA_LAT33_BALTIC_eastwall_desc:0 "Almanlar da en az bizim kadar Doğu'dan bir saldırı bekliyor ve Alman yetkililere kendi sınırları kadar bizim sınırımızı da kuvvetle tahkim etmeleri tavsiye edilir."
 WESTHEIA_LAT33_BALTIC_end_bourgeouis_dictatorships:0 "Burjuva Diktatörlüklerine Son Ver"
 WESTHEIA_LAT33_BALTIC_end_bourgeouis_dictatorships_desc:0 "Baltıklar sözde “tarafsız” diktatörler tarafından domine ediliyor. Ordunun desteğiyle ve halklarının rızası olmadan, Baltık proletaryası kapitalist diktatörlük altında eziliyor. Sadece özgürleşmiş [Root.GetAdjective] işçilerinin elleriyle, haksız sınırlar tarafından ayrı tutulan bu işçiler şanlı kurtuluşumuzu paylaşabilir!"
 WESTHEIA_LAT33_BALTIC_end_swedish_neutrality:0 "İsveç Tarafsızlığına Son Ver"
 WESTHEIA_LAT33_BALTIC_end_swedish_neutrality_desc:0 "İsveçlilerin tarafsızlık dediği şey zayıflıktan başka bir şey değildir; sınırları ötesindeki alt sınıfların refahına çok az önem vererek, o an en güçlü görünen gücün kaprislerine boyun eğmek. Böylesine zayıf iradeli ve dayanıksız bir hükûmet, sınırımızı paylaşmaya layık değildir ve halkını tiranlıktan koruyacak omurgaya sahip yeni bir İsveç yaratmalıyız."
 WESTHEIA_LAT33_BALTIC_finnish_invasion:0 "Finlandiya İşgali"
 WESTHEIA_LAT33_BALTIC_finnish_invasion_desc:0 "Finlandiya bizim için kapitalizmin prangaları altına bağlanmış kayıp bir kardeştir. Finlandiya ancak şiddetli bir devrimle, tıpkı Baltıkların özgürleştiği gibi özgürleşebilir."
 WESTHEIA_LAT33_BALTIC_focus_on_the_interior:0 "İç Meselelere Odaklan"
 WESTHEIA_LAT33_BALTIC_focus_on_the_interior_2:0 "Almanlara Hazırlan"
 WESTHEIA_LAT33_BALTIC_focus_on_the_interior_2_desc:0 "Freikorps'un [Root.GetNameDef]'e bunca yıl önce getirdiği mutlak vahşeti unutmamamız hayati önem taşıyor. Köylüler ve işçiler hayvan gibi katledildi, tüm köyler küle ve harabeye döndü ve [Root.GetAdjective] halkının bir daha asla böyle bir vahşete maruz kalmasına izin veremeyiz."
 WESTHEIA_LAT33_BALTIC_focus_on_the_interior_desc:0 "Birçok işçi komşularımıza yürümeye ve şanlı devrimimizi tüm Baltık halklarına getirmeye hevesli olsa da, bunun yerine ulusumuzun içine odaklanmalıyız; devrimin ardından rejimi istikrara kavuşturmalıyız."
 WESTHEIA_LAT33_BALTIC_ford_motors:0 "Ford-Vairogs Üretimini Başlat"
 WESTHEIA_LAT33_BALTIC_ford_motors_desc:0 "Ford ile işbirliği yaparak Riga’daki Vairogs tesislerinde lisanslı araç montajını geliştirebiliriz. Araç ve parça tedarikinin genişlemesi ordumuzun motorlaşmasına katkıda bulunacaktır."
 WESTHEIA_LAT33_BALTIC_forment_disloyalty:0 "Muhalefeti Birleştir"
 WESTHEIA_LAT33_BALTIC_forment_disloyalty_desc:0 "Hem [Root.GetAdjective] hükûmetinin içinde hem de dışında birçok hareket var ve eğer [Root.GetNameDef]'i rahatsız eden mevcut tiranlığı devireceksek, [Root.GetNeutralParty]'e karşı muhalefetin birleştirici sesi olmalıyız!"
 WESTHEIA_LAT33_BALTIC_free_the_workers_of_poland:0 "Polonya İşçilerini Özgürleştir"
 WESTHEIA_LAT33_BALTIC_free_the_workers_of_poland_desc:0 "Polonyalılar bir zamanlar Baltık'ı yönetmiş olsalar da, şimdi [GER.GetNameDef]'in yırtıcı rejimine karşı savunmasız bir av durumundalar. Güney'deki yoldaşlarımızı savunmalı ve onları bir Polonya Sosyalist Cumhuriyeti altında birleştirmeliyiz!"
 WESTHEIA_LAT33_BALTIC_german_baltic_industry:0 "Mihver-Baltık Sanayisi"
 WESTHEIA_LAT33_BALTIC_german_baltic_industry_desc:0 "[GetGermanBalticIndustryDesc]"
 WESTHEIA_LAT33_BALTIC_german_baltic_industry_desc_alt:0 "Ulusumuz şimdi yabancı faşist yatırımı açısından zengin. Diğer faşist hamilerimizin ve [Root.GetNonIdeologyName]'in özel sektörleri neredeyse ayırt edilemez, aynı şirketlerin birçoğu [Root.GetNonIdeologyAdjective]lere ve halklarına aynı şekilde iş sağlıyor."
 WESTHEIA_LAT33_BALTIC_german_baltic_industry_desc_default:0 "Ulusumuz şimdi Alman yatırımı açısından zengin. Almanya'nın ve [Root.GetNonIdeologyName]'in özel sektörleri neredeyse ayırt edilemez, aynı şirketlerin birçoğu [Root.GetNonIdeologyAdjective]lere ve Almanlara aynı şekilde iş sağlıyor."
 WESTHEIA_LAT33_BALTIC_german_tank_licences:0 "[GetBalticAxisInvesmentsAdj] Tank Lisansları"
 WESTHEIA_LAT33_BALTIC_german_tank_licences_desc:0 "[GetGermanTankLicencesDesc]"
 WESTHEIA_LAT33_BALTIC_german_tank_licences_desc_alt:0 "Faşist hamilerimizin tankları, hedeflerine doğru ilerlerken düşmanlarını dağınık ve şaşkın bırakma yeteneklerini kanıtladılar. [Root.GetNonIdeologyName], Doğu'ya yönelik yaklaşan savaşlarda bu taktikleri taklit etmekten büyük fayda sağlayacaktır."
 WESTHEIA_LAT33_BALTIC_german_tank_licences_desc_default:0 "Alman tankları, hedeflerine doğru ilerlerken düşmanlarını dağınık ve şaşkın bırakma yeteneklerini kanıtladılar. [Root.GetNonIdeologyName], Doğu'ya yönelik yaklaşan savaşlarda bu taktikleri taklit etmekten büyük fayda sağlayacaktır."
 WESTHEIA_LAT33_BALTIC_german_war_economics:0 "[GetBalticAxisInvesmentsAdj] Savaş Ekonomisini Benimse"
 WESTHEIA_LAT33_BALTIC_german_war_economics_desc:0 "[GetGermanWarEconomicsDesc]"
 WESTHEIA_LAT33_BALTIC_german_war_economics_desc_alt:0 "Faşist hamilerimiz, daha önce birkaç kez gördüğümüz türden hızlı bir askerî sanayileşme sürecindeler ve onları taklit etmek ve onlardan yatırım aramak bizim için iyi olacaktır."
 WESTHEIA_LAT33_BALTIC_german_war_economics_desc_default:0 "Almanlar, Avrupa'nın daha önce birkaç kez gördüğü türden hızlı bir askerî sanayileşme sürecindeler ve onları taklit etmek ve Reichsbank'tan yatırım aramak bizim için iyi olacaktır."
 WESTHEIA_LAT33_BALTIC_influence_neighbours:0 "Komşuları Etkile"
 WESTHEIA_LAT33_BALTIC_influence_neighbours_desc:0 "Bağımsızlık savaşlarından önce olduğu kadar popüler olmasa da, sosyalizm altında özgür bir Baltık kavramı, Baltık'ın kendi kaderini tayin etme kavramı kadar eskidir. Devletimiz, Baltık diktatörlüklerinin baskıcı rejimleri altında yaşayanlar tarafından modellenecek bir şey olarak durabilir ve bunu silahlandırarak Devrimi komşularımıza kansız bir şekilde yayma şansımız var."
 WESTHEIA_LAT33_BALTIC_invest_in_baltic_trade:0 "Baltık Ticaretine Yatırım Yap"
 WESTHEIA_LAT33_BALTIC_invest_in_baltic_trade_desc:0 "Baltık Denizi, İskandinavya, Almanya ve Rusya'dan gelen ticaretle zengindir ve limanlarımız hepsini zorlukla barındırabilir. Daha parlak ve müreffeh bir [Root.GetNonIdeologyName] için bu denizi bizimle paylaşan dostlarımızla yeni ticaret hatları açmalıyız!"
 WESTHEIA_LAT33_BALTIC_modernize_industry:0 "Sanayimizi Modernleştir"
 WESTHEIA_LAT33_BALTIC_modernize_industry_desc:0 "Çok uzun zamandır, [Root.GetNonIdeologyName]'in üretimi tarımla tanımlandı ama artık değil. [Root.GetNonIdeologyName]'i modern bir ekonomiye dönüştüreceksek, sanayimizi her eyaletteki büyük şehir merkezleri etrafında yoğunlaştırmalıyız."
 WESTHEIA_LAT33_BALTIC_natural_resources:0 "Doğal Kaynakları Geliştir"
 WESTHEIA_LAT33_BALTIC_natural_resources_desc:0 "[Root.GetNaturaResource_BAL], Sovyetler, Müttefikler ve diğer Baltık devletleriyle yaptığımız ticaret sayesinde ülkemizi zenginleştirdi ve ülke genelinde [Root.GetExtraction_BAL]'a yatırım yaparak bu endüstriye daha fazla yatırım yapmak bizim için iyi olacaktır!"
 WESTHEIA_LAT33_BALTIC_original_designs:0 "Orijinal Tasarımlar"
 WESTHEIA_LAT33_BALTIC_original_designs_desc:0 "Ulusumuzun 1918'deki doğumundan günümüze kadar, [Root.GetNonIdeologyName] ordularını İngilizlerden gelen silahlarla donattı, ama artık değil. Artık İngilizlere güvenemeyiz, ileriye bakmalı ve [Root.GetNonIdeologyAdjective] menşeli silah üretmeye başlamalıyız."
 WESTHEIA_LAT33_BALTIC_overthrow_the_government:0 "[Root.GetNeutralParty]'i Devir"
 WESTHEIA_LAT33_BALTIC_overthrow_the_government_desc:0 "[Root.GetLeader]'i ve [Root.GetLeader.GetHerHis] rejimini devirmek için yeterli desteği topladık! Tek yapmamız gereken başkente yürümek ve yeni bir İşçi Cumhuriyeti ilan etmek!"
 WESTHEIA_LAT33_BALTIC_path_to_the_north_sea:0 "Kuzey Denizi'ne Bir Yol"
 WESTHEIA_LAT33_BALTIC_path_to_the_north_sea_desc:0 "Danimarkalılar bu tırmanan küresel çatışmada ne yazık ki tarafsız kaldılar ve Danimarka boğazları, sosyalist dünyayı Kuzey Denizi'nden ayıran tek şey."
 WESTHEIA_LAT33_BALTIC_purge_of_our_own:0 "Kendi Tasfiyemiz"
 WESTHEIA_LAT33_BALTIC_purge_of_our_own_desc:0 "Tüm direnişi ezmek için gösterdiğimiz en iyi çabalara rağmen, hala gölgelerde örgütlenen, [Root.GetNonIdeologyName]'de kapitalist bir diktatörlüğü yeniden kurmak için proletaryaya karşı komplo kuranlar var. Popüler bir tasfiye yapmalıyız; eski hükûmetin tüm üyelerini ve onları destekleyen herkesi kökünden sökmeliyiz."
 WESTHEIA_LAT33_BALTIC_rebuild_forts:0 "[Root.Capital.GetName] Kalelerini Yeniden İnşa Et"
 WESTHEIA_LAT33_BALTIC_rebuild_forts_desc:0 "Bağımsızlık savaşları sırasında, [Root.Capital.GetName] bir şehirden çok bir kaleydi. Tahkimatlar büyük ölçüde sökülmüş ve unutulmuş olsa da, yeniden inşa edilmeli, bakımı yapılmalı ve savaşa hazır hale getirilmelidir."
 WESTHEIA_LAT33_BALTIC_red_army:0 "[Root.GetAdjective] Kızıl Tüfekliler"
 WESTHEIA_LAT33_BALTIC_red_army_desc:0 "Ordumuz, yalnızca [Root.GetNameDef] içinde sosyalizmi savunmaya ve onu dünya halkı arasında yaymaya istekli olanlardan oluşmalıdır ve bu ancak [Root.GetAdjective] Kızıl Tüfeklileri geri getirerek başarılabilir."
 WESTHEIA_LAT33_BALTIC_rejoin_the_railways:0 "Demiryolu Ağını İyileştir"
 WESTHEIA_LAT33_BALTIC_rejoin_the_railways_desc:0 "Mevcut demiryolu ağının bakımını ve bölgesel bağlantılarını iyileştirerek Riga’yı, limanları ve iç bölgeleri birbirine daha etkin biçimde bağlamalıyız."
 WESTHEIA_LAT33_BALTIC_renew_allied_trade:0 "[GetBalticRenewAlliedTradeTitle]"
 WESTHEIA_LAT33_BALTIC_renew_allied_trade_alt:0 "Yabancı Yatırımlar Ara"
 WESTHEIA_LAT33_BALTIC_renew_allied_trade_default:0 "Müttefik Ticaretini Yenile"
 WESTHEIA_LAT33_BALTIC_renew_allied_trade_desc:0 "[GetBalticRenewAlliedTradeDesc]"
 WESTHEIA_LAT33_BALTIC_renew_allied_trade_desc_allied:0 "Devletimizin kuruluşundan bu yana Müttefiklere ticaret ve askerî destek için bağımlı olduk ve şimdi bundan vazgeçmek bizim için ahmakça olur. Sınırlarımıza tecavüz eden Almanların ve Rusların saldırısından bir kez daha kurtulacaksak, ulusumuza Müttefik yatırımlarını çekmeliyiz."
 WESTHEIA_LAT33_BALTIC_renew_allied_trade_desc_default:0 "Devletimizin kuruluşundan bu yana İngiliz ticaretine ve askerî desteğine bağımlı olduk ve şimdi bundan vazgeçmek bizim için ahmakça olur. Sınırlarımıza tecavüz eden Almanların ve Rusların saldırısından bir kez daha kurtulacaksak, ulusumuza müttefik yatırımlarını çekmeliyiz."
 WESTHEIA_LAT33_BALTIC_renew_allied_trade_desc_international:0 "Devletimizin kuruluşundan bu yana diğer uluslara ticaret ve askerî destek için bağımlı olduk ve şimdi bundan vazgeçmek bizim için ahmakça olur. Sınırlarımıza tecavüz eden Almanların ve Rusların saldırısından bir kez daha kurtulacaksak, ulusumuza yabancı yatırımlarını çekmeliyiz."
 WESTHEIA_LAT33_BALTIC_request_german_support:0 "[GetBalticAxisInvesmentsAdj] Desteği İste"
 WESTHEIA_LAT33_BALTIC_request_german_support_desc:0 "[GetRequestGermanSupportDesc]"
 WESTHEIA_LAT33_BALTIC_request_german_support_desc_alt:0 "Faşist hamilerimizin endüstriyel kapasitesinden yoksunuz, ancak belki de yetkililerini, Doğu'ya yönelik yaklaşan Komünist tehdide karşı kendimizi daha iyi savunmak için bize fazladan stoklanmış ekipman vermeye ikna edebiliriz."
 WESTHEIA_LAT33_BALTIC_request_german_support_desc_default:0 "Almanya'nın endüstriyel kapasitesinden yoksunuz, ancak belki de Alman yetkilileri, Doğu'ya yönelik yaklaşan Komünist tehdide karşı kendimizi daha iyi savunmak için bize fazladan stoklanmış ekipman vermeye ikna edebiliriz."
 WESTHEIA_LAT33_BALTIC_restore_workers_republic:0 "İşçi Cumhuriyetini Geri Getir"
 WESTHEIA_LAT33_BALTIC_restore_workers_republic_desc:0 "Bağımsızlık mücadelemiz sırasında, Sovyetler bir [Root.GetAdjective] İşçi Cumhuriyeti'nin kurulmasına yardım etti. Cumhuriyet başarısız olsa da, liderleri hem [Root.GetNameDef] hem de [SOV.GetNameDef]'de hayatta kalmaya devam ediyor, bu nedenle işçi cumhuriyeti umudu hala var!"
 WESTHEIA_LAT33_BALTIC_restore_workers_republic_idea:0 "İşçi Cumhuriyeti"
 WESTHEIA_LAT33_BALTIC_restore_workers_republic_idea_1:0 "İşçi Cumhuriyeti"
 WESTHEIA_LAT33_BALTIC_restore_workers_republic_idea_2:0 "İşçi Cumhuriyeti"
 WESTHEIA_LAT33_BALTIC_restore_workers_republic_idea_sov_1:0 "Restore Edilmiş Sovyet Cumhuriyeti"
 WESTHEIA_LAT33_BALTIC_revolutionary_cabinet:0 "Devrimci Bir Kabine"
 WESTHEIA_LAT33_BALTIC_revolutionary_cabinet_desc:0 "Şimdi alt sınıfın yılmaz bekçileri olarak hak ettiğimiz yere geri döndüğümüze göre, yeni devletimizin ideolojisiyle uyumlu bir bakanlar kurulunu yeniden toplayabiliriz."
 WESTHEIA_LAT33_BALTIC_school_of_aviation:0 "Havacılık Eğitimini Genişlet"
 WESTHEIA_LAT33_BALTIC_school_of_aviation_desc:0 "Hava kuvvetlerinin geleceği yalnız uçak alımlarına bağlı değildir. Pilot, gözlemci ve bakım personeli yetiştiren eğitim kurumlarını güçlendirerek mevcut uçaklarımızı daha verimli kullanabiliriz."
 WESTHEIA_LAT33_BALTIC_school_of_aviation_tech_bonus:0 "Havacılık Okulu"
 WESTHEIA_LAT33_BALTIC_secure_military_support:0 "Askerî Destek Sağla"
 WESTHEIA_LAT33_BALTIC_secure_military_support_desc:0 "Ordudaki birçok kişi ulusu [Root.GetLeader]'den kurtarmak istiyor, tek yapmamız gereken onlara yaklaşmak. Şan ve şöhret arayan bir general, halkın kahramanı olma vaadiyle davamıza kesinlikle çekilecektir."
 WESTHEIA_LAT33_BALTIC_seek_support_of_soviets:0 "Sovyetlerin Desteğini Ara"
 WESTHEIA_LAT33_BALTIC_seek_support_of_soviets_desc:0 "Kızıl Ordu [Root.GetNameDef]'i yerle bir edip ulusumuzu yeni bir Rus emperyalizmi çağına sokmuş olsa da, onların yardımı olmadan [Root.GetNameDef]'e sosyalizmi getirme şansımız yok."
 WESTHEIA_LAT33_BALTIC_sieze_the_means_of_production:0 "Üretim Araçlarına El Koy"
 WESTHEIA_LAT33_BALTIC_sieze_the_means_of_production_desc:0 "Eski hükûmet, [Root.GetAdjective] halkının emeğini sömürmek için denizaşırı yatırımcıları davet etti. Proletaryanın ellerinin yabancı burjuva efendilerine hizmet etmeye devam etmesine izin veremeyiz ve bu çok uluslu şirketler tarafından inşa edilen tüm fabrikalar [Root.GetNameDef]'in velayeti altına alınmalıdır."
 WESTHEIA_LAT33_BALTIC_soviet_equipment:0 "Sovyet Ekipmanı"
 WESTHEIA_LAT33_BALTIC_soviet_equipment_desc:0 "Milislerimizi silahlandırmak için gerekli silah ve malzemelere erişmeden hükûmeti devirmeyi umut edemeyiz. Ruslardan yardım için temas kurarak, eski hükûmet devrimi durdurmaya çalışırsa ordularımızı desteklemek için fazladan silah kazanacağız."
 WESTHEIA_LAT33_BALTIC_soviet_military_staff:0 "Sovyet Askerî Personeli"
 WESTHEIA_LAT33_BALTIC_soviet_military_staff_desc:0 "[Root.GetAdjective] İşçi Cumhuriyeti dağıtıldıktan sonra, askerî personelimiz büyük ölçüde SSCB'ye sürgüne gitti. Eve getirilmeleri gerekiyor."
 WESTHEIA_LAT33_BALTIC_soviet_volunteer_forces:0 "Sovyet Gönüllü Kuvvetleri"
 WESTHEIA_LAT33_BALTIC_soviet_volunteer_forces_desc:0 "SSCB, dünya devrimi için savaşmaya ve ölmeye hazır adamlarla adeta taşıyor. [Root.GetNameDef] komünist bir dünya mücadelesinde sadece bir basamak taşı olsa da, davamız için ölmeye hazır cesur Rus sosyalistlerinin sıkıntısı yok."
 WESTHEIA_LAT33_BALTIC_squash_resistance:0 "Tüm Direnişi Ez"
 WESTHEIA_LAT33_BALTIC_squash_resistance_desc:0 "Hala sosyalizmin [Root.GetAdjective] egemenliğinin düşmanı olduğuna inanan insanlar var ve devrimi ilerleteceksek bu insanlar kökünden sökülmelidir."
 WESTHEIA_LAT33_BALTIC_technology_sharing:0 "Teknoloji Paylaşımı"
 WESTHEIA_LAT33_BALTIC_technology_sharing_desc:0 "Halihazırda ortağımızın birçok ekipmanını üretiyoruz, ancak belki de tasarımlarını inceleyerek yerli [Root.GetNonIdeologyAdjective] tasarımlarını önemli ölçüde geliştirebiliriz."
 WESTHEIA_LAT33_BALTIC_trade_with_neighbors:0 "Komşularla Ticaret Yap"
 WESTHEIA_LAT33_BALTIC_trade_with_neighbors_desc:0 "Almanlara veya Sovyetlere her ticaret yatırımı yaptığımızda, kendi kıyametimize katkıda bulunuyoruz. Düşman birliklerinin erzaklarında Litvanya tahılı ve tanklarında Letonya çeliğinden yapılmış Estonya petrolü ile [Root.GetNonIdeologyName]'i işgal etmesine izin veremeyiz. Bunun yerine ortak düşmanımızı yenmek için birbirimize yardım etmeliyiz."
 WESTHEIA_LAT33_BALTIC_unchain_education:0 "Eğitimimizin Zincirlerini Kır"
 WESTHEIA_LAT33_BALTIC_unchain_education_desc:0 "[Root.GetNonIdeologyAdjective] eğitim sistemi uzun zamandır dağınık nüfus merkezlerimiz tarafından kısıtlanmıştır, ancak şimdi kırsal halkın şehirlere daha yakınlaşmasıyla, [Root.GetNonIdeologyAdjective] gençliğini daha verimli bir şekilde eğitebileceğiz."
 WESTHEIA_LAT33_BALTIC_united_baltic_ssr:0 "Birleşik bir Baltık SSC"
 WESTHEIA_LAT33_BALTIC_united_baltic_ssr_desc:0 "Kültür, dil ve kimlik açısından farklı olsalar da, üç Baltık Devleti arasında uzun zamandır bir kardeşlik ve yoldaşlık vardır. Komşularımızın da diğer [Root.GetAdjective]ler kadar yoldaş olduğu kabul edilmelidir ve tek bir işçi cumhuriyetinde birleşmezsek işçiler sadece kaybeder."
 WESTHEIA_LAT33_BALTIC_western_revolution:0 "Devrimi Batı'ya Taşı"
 WESTHEIA_LAT33_BALTIC_western_revolution_desc:0 "Devrim Baltık'ta durmuyor. Neredeyse tüm Avrupa'nın alt sınıfları, kapitalizmin katı çizmeleri altında fabrikalarda köle gibi çalışıyor ve onları yalnızca [Root.GetAdjective] işçileri kurtarabilir."
 WESTHEIA_LAT33_LAT_aizsargi:0 "Aizsargi'yi Fonla"
 WESTHEIA_LAT33_LAT_aizsargi_desc:0 "1919'da geçici hükûmet tarafından oluşturulan Aizsargi, hükûmetin resmî paramiliter örgütüdür ve Ulmanis'in darbesine verdikleri destek, destekle bolca ödüllendirilmelidir."
 WESTHEIA_LAT33_LAT_alignment_with_germany:0 "Almanya ile Uyum Arayışı"
 WESTHEIA_LAT33_LAT_alignment_with_germany_desc:0 "Almanlar, solcu ve zayıf olan her şeye karşı bizimle aynı küçümsemeyi paylaşıyor. Geçmişte Letonya'yı boyunduruk altına almak için yanlış yönlendirilmiş girişimlerde bulunmuş olsalar da, hükûmetlerimiz uyumlu olursa böyle bir şeyi tekrar yapmayacaklarından eminiz."
 WESTHEIA_LAT33_LAT_anti_german_propaganda:0 "Alman Karşıtı Propaganda"
 WESTHEIA_LAT33_LAT_anti_german_propaganda_desc:0 "Ulusumuzun faşizm ideallerini benimsese de, [GER.GetLeader]'in oyuncaklarından biri olmadığımızı ve halkımızı yüzyıllardır ezen aynı adamlarla işbirliği yapma niyetinde olmadığımızı açıkça belirtmeliyiz."
 WESTHEIA_LAT33_LAT_appease_democrats:0 "Demokratları Yatıştır"
 WESTHEIA_LAT33_LAT_appease_democrats_desc:0 "Yöntemlerimiz demokratik olmasa da, motivasyonumuz cumhuriyet içindir. Demokratik muhalefete sadece Letonya için en iyisini düşündüğümüzü göstermeliyiz ve belki de Saeima'yı yeniden toplamak onları gerçek niyetlerimizden haberdar edebilir."
 WESTHEIA_LAT33_LAT_avenge_the_ancestors:0 "Ataların İntikamını Al"
 WESTHEIA_LAT33_LAT_avenge_the_ancestors_desc:0 "Letonya, Baltık kabileleri zamanından beri bağımsızlık ışığını görmedi ve hepsi Almanlar, İsveçliler ve Ruslar tarafından sonsuz boyun eğdirilmesinden kaynaklanıyor. Bir bin yıl daha vahşet ve baskı riske atamayız, tüm bu yabancı emperyalistleri Letonya'nın önünde diz çöktürmeliyiz!"
 WESTHEIA_LAT33_LAT_baltic_defence_army:0 "Baltık Savunma Ordusu"
 WESTHEIA_LAT33_LAT_baltic_defence_army_desc:0 "Silahlı kuvvetlerimiz birlikte çalışıyor ancak esasen ayrı varlıklar. Uluslarımız arasındaki bağlar güçlendikçe, aynı anda hiçbir Baltık Devleti tarafından kontrol edilmeyen ancak hepsinin bir müttefiki olan ayrı bir varlık olan Birleşik Baltık Silahlı Kuvvetleri'ni kurabiliriz."
 WESTHEIA_LAT33_LAT_baltic_economic_union:0 "Baltık Ekonomik Birliği"
 WESTHEIA_LAT33_LAT_baltic_economic_union_desc:0 "Şimdi liberal demokrasi ulusumuza geri döndüğüne ve komşularımızla yakın diplomatik bağlar kurduğumuza göre, diğer Baltık Devletleriyle bir ekonomik birliğe girmek mantıklı. Ekonomilerimiz küçük olsa da, birlikte güçlenebilirler!"
 WESTHEIA_LAT33_LAT_baltic_stronger_together:0 "Birleşik ama Ayrı"
 WESTHEIA_LAT33_LAT_baltic_stronger_together_desc:0 "Baltık Devletleri arasında uzun zamandır bir kardeşlik ve yoldaşlık duygusu var, ama her zaman sınırlar ve siyasetle ayrıldık. Bağımsızlığımızı koruma isteğimizle diplomatik olarak birbirimize bağlıyız ve bu yüzden dostlarımız için savaşmaya ve birleşik Baltık silahlı kuvvetlerini genişletmeye kararlı olmalıyız!"
 WESTHEIA_LAT33_LAT_baltic_unification:0 "Baltık Birleşmesi"
 WESTHEIA_LAT33_LAT_baltic_unification_desc:0 "Baltık Devletleri arasında uzun zamandır bir kardeşlik ve yoldaşlık duygusu var, ama her zaman sınırlar ve siyasetle ayrıldık. Bağımsız kimliklerimiz güçlü olsa da, varlığımızı korumak için savaşma isteğimiz bizi birbirimize bağlıyor. Belki de Baltık Birliği'nin kendi başına bir ulusa dönüşme zamanı gelmiştir."
 WESTHEIA_LAT33_LAT_banish_clemens:0 "Celmiņš'i Sürgün Et"
 WESTHEIA_LAT33_LAT_banish_clemens_desc:0 "Gustavs Celmiņš, diktatörlüğün istikrarını ve büyük ulusumuzdaki Letonyalı azınlıkların güvenliğini tehdit eden tehlikeli bir faşisttir. Pērkonkrusts'u ulusumuza daha fazla zarar vermeden ülkeden kovulmalıdır."
 WESTHEIA_LAT33_LAT_beyond_the_baltic:0 "[Root.Get_Beyond_Baltic_Focus_Loc]"
 WESTHEIA_LAT33_LAT_beyond_the_baltic_desc:0 "[Root.Get_Beyond_Baltic_Focus_desc_Loc]"
 WESTHEIA_LAT33_LAT_cave_to_enemy_pressure:0 "[Root.Get_Enemy_Pressure_Focus_Loc]"
 WESTHEIA_LAT33_LAT_cave_to_enemy_pressure_desc:0 "[Root.Get_Enemy_Pressure_Focus_desc_Loc]"
 WESTHEIA_LAT33_LAT_consecrate_the_brotherhood:0 "Kardeşliği Kutsallaştır"
 WESTHEIA_LAT33_LAT_consecrate_the_brotherhood_custom_tt:0 "\"§Y[LAT.GetNameDef]§! bizi kendi gruplarına davet eder\" etkinliğini alır."
 WESTHEIA_LAT33_LAT_consecrate_the_brotherhood_desc:0 "Birçok yönden farklı olsalar da, Baltıklar yine de kardeştir. Kültürlerimiz farklıdır, ancak yüzyıllardır aynı düşmanları ve aynı sorunları paylaştık. Boyun eğmeyi önleyeceksek, Kardeşliği birleşik bir koalisyon halinde bir araya getirmeliyiz."
 WESTHEIA_LAT33_LAT_dievs_keepers:0 "Diev'in Muhafızları"
 WESTHEIA_LAT33_LAT_dievs_keepers_desc:0 "İyi Letonyalı paganlar, Celmiņš'i bir tür dinî lider olarak görerek davamız etrafında giderek daha militan hale gelmeye başlıyor. Yönetimimizdeki daha muhafazakar Katolikler, Baltık paganizmine olan bu hayranlığın Celmiņš'in karizmatik lideri olduğu bir tarikata dönüşmesinden korkuyorlar, ancak bu hevesli genç adamlara bir tüfek vermekten fayda sağlayacağımız kesin."
 WESTHEIA_LAT33_LAT_empower_paramilitarists:0 "Paramiliterleri Güçlendir"
 WESTHEIA_LAT33_LAT_empower_paramilitarists_desc:0 "Letonya ordusu yararlıdır ve elbette herhangi bir uç paramiliter gruptan daha büyüktür, ancak ödül veya tanınma vaadi olmadan Letonya için hayatlarını riske atacak bu bireyleri görmezden gelmeye devam edemeyiz."
 WESTHEIA_LAT33_LAT_establish_chambers_of_professions:0 "Korporatif Odalar Sistemini Kur"
 WESTHEIA_LAT33_LAT_establish_chambers_of_professions_desc:0 "Ekonomik hayatı ticaret, sanayi, tarım ve zanaat odaları aracılığıyla örgütleyerek meslek gruplarını devletin gözetiminde bir araya getirmeliyiz."
 WESTHEIA_LAT33_LAT_fanatic_recruitment:0 "Fanatikleri İşe Al"
 WESTHEIA_LAT33_LAT_fanatic_recruitment_desc:0 "Geçmişte, silahlı kuvvetlerimize radikalleri almaya tereddüt ederdik çünkü güdüleri Letonya'dan çok ideolojilerine aitti, ama Celmiņš ve takipçileri şüphesiz Letonya'yı ve bağımsızlığını herkes kadar korumak istiyorlar."
 WESTHEIA_LAT33_LAT_formalize_baltic_entente:0 "[Root.Get_Baltic_Entente_Focus_Loc]"
 WESTHEIA_LAT33_LAT_formalize_baltic_entente_desc:0 "[Root.Get_Baltic_Entente_Focus_desc_Loc]"
 WESTHEIA_LAT33_LAT_free_the_ugonskrusts:0 "Ugunskrusts'u Özgürleştir"
 WESTHEIA_LAT33_LAT_free_the_ugonskrusts_desc:0 "Pērkonkrusts olmadan önce, önceki Letonya rejimi tarafından ezilen ve boyunduruk altına alınan Ugunskrusts idik. Şimdi özgür olduğumuza göre, sadece daha güçlü bir Letonya devleti isteyen sayısız siyasi mahkumu özgür bırakabiliriz."
 WESTHEIA_LAT33_LAT_free_the_ugonskrusts_tt:0 "Eyalette 6 §YMilis§! Tümeni belirir."
 WESTHEIA_LAT33_LAT_improve_military_life:0 "Askerî Yaşamı İyileştir"
 WESTHEIA_LAT33_LAT_improve_military_life_desc:0 "Eğer adamların Letonya için savaşmasını ve ölmesini istiyorsak, onlara savaşmaya ve ölmeye değer bir yaşam tarzı vermeliyiz. Bu, daha iyi erzaklarla ve savaş kazanıldığında iyi bir yaşam vaadiyle başarılabilir."
 WESTHEIA_LAT33_LAT_integrate_farmers_party:0 "Çiftçi Partisini Entegre Et"
 WESTHEIA_LAT33_LAT_integrate_farmers_party_desc:0 "Bu demokratik maskaralık yeterince uzun sürdü. Çiftçi Partisi'ni Diktatörlüğe entegre etme ve diğer tüm partileri hükûmetten çıkarma zamanı geldi."
 WESTHEIA_LAT33_LAT_join_the_allies:0 "[Root.Get_Join_Allies_Focus_Loc]"
 WESTHEIA_LAT33_LAT_join_the_allies_desc:0 "[Root.Get_Join_Allies_Focus_desc_Loc]"
 WESTHEIA_LAT33_LAT_latvia_for_latvians:0 "Letonya Letonyalılarındır"
 WESTHEIA_LAT33_LAT_latvia_for_latvians_desc:0 "Ulusumuz Almanları veya Rusları yatıştırmak için var değil, ulusumuz Letonyalılar ve sadece Letonyalılar için var. Bazıları Pērkonkrusts'u aşırı milliyetçi olarak görse de, Letonya'nın hayatta kalmasını güvence altına alacaksak onlarla çalışmamız gerektiğini biliyoruz."
 WESTHEIA_LAT33_LAT_lift_ban_on_perkonkrusts:0 "Pērkonkrusts Yasağını Kaldır"
 WESTHEIA_LAT33_LAT_lift_ban_on_perkonkrusts_desc:0 "Resmî olarak, Pērkonkrusts grubu yasa dışıdır, ancak sayıları her geçen gün artmaktadır. Grup üzerindeki yasağı kaldırarak, diktatörlüğün onların ideallerine dostane olduğunu göstereceğiz."
 WESTHEIA_LAT33_LAT_lightning_strike:0 "Yıldırım Düşüyor"
 WESTHEIA_LAT33_LAT_lightning_strike_desc:0 "Komşularımız zayıf ve kolayca sömürülebilir. Litvanya ve Estonya'yı Letonya'nın velayetine almak, elbette kendi korumaları için akıllıca olacaktır."
 WESTHEIA_LAT33_LAT_look_north:0 "[Root.Get_Look_North_Focus_Loc]"
 WESTHEIA_LAT33_LAT_look_north_desc:0 "[Root.Get_Look_North_Focus_desc_Loc]"
 WESTHEIA_LAT33_LAT_martial_prime_minister:0 "Asker Kökenli Bir Başbakan"
 WESTHEIA_LAT33_LAT_martial_prime_minister_desc:0 "Kviesis barış zamanlarında yararlıydı, ama şimdi ufukta savaş var ve halkı yönetmek için bir asker adama ihtiyacımız var. Jānis Balodis bu rol için ideal bir aday olurdu."
 WESTHEIA_LAT33_LAT_merge_presidential_titles:0 "Cumhurbaşkanlığı Unvanlarını Birleştir"
 WESTHEIA_LAT33_LAT_merge_presidential_titles_desc:0 "Balodis hükûmette tehlikeli bir şekilde nüfuzlu hale geliyor ve belki de eş hükümdarlık zamanı sona erdi. Letonya devletini güvence altına almanın yolunu sadece Ulmanis biliyor."
 WESTHEIA_LAT33_LAT_military_diarchy:0 "Askerî Diarşi"
 WESTHEIA_LAT33_LAT_military_diarchy_desc:0 "Balodis'in hükûmetteki nüfuzu o kadar büyüdü ki, birçok kişi diktatörlüğün aslında ordu ve Ulmanis'in bir diarşisi olduğuna inanıyor. Bu yanlış kanıyı gerçekleştirmek ve Balodis'e hükûmet üzerinde daha fazla kontrol vermek akıllıca olacaktır."
 WESTHEIA_LAT33_LAT_military_dictatorship:0 "Askerî Diktatörlük"
 WESTHEIA_LAT33_LAT_military_dictatorship_desc:0 "Ulmanis yararlı ve popüler bir figürandır, bu inkar edilemez, ama belki de bu artan çatışma zamanlarında sadece bu olması en iyisi olurdu; bir figüran. Yönetim sadece orduya bırakılmalıdır."
 WESTHEIA_LAT33_LAT_military_industrial_complex:0 "Letonya Askerî Kompleksi"
 WESTHEIA_LAT33_LAT_military_industrial_complex_desc:0 "Pērkonkrusts'u ihtiyaç duydukları her şeyle donatmak için, Letonya bir devletten çok bir silah fabrikası haline gelmelidir."
 WESTHEIA_LAT33_LAT_multicultural_latvia:0 "Çok Kültürlü Bir Letonya"
 WESTHEIA_LAT33_LAT_multicultural_latvia_desc:0 "Ulusumuz sayısız grup ve bireyden oluşuyor; Letonyalılar, Baltık Almanları, Yahudiler ve sayısız diğerleri. Tüm bu gruplara uğruna savaşmaya değer bir yuva vermeli ve çeşitli kültürel manzaramızın korunmasını sağlamalıyız."
 WESTHEIA_LAT33_LAT_multicultural_latvia_idea:0 "Çok Kültürlü bir Letonya"
 WESTHEIA_LAT33_LAT_nationalised_industry:0 "Kamulaştırılmış Sanayi"
 WESTHEIA_LAT33_LAT_nationalised_industry_desc:0 "Kapitalist ekonomilerin zamanı geçti, bunlar savaş zamanları ve hükûmetin ekonomi üzerinde sıkı bir kontrole sahip olmasını sağlamalıyız."
 WESTHEIA_LAT33_LAT_nationalised_industry_idea:0 "Kamulaştırılmış Sanayi"
 WESTHEIA_LAT33_LAT_ostland:0 "Ostland"
 WESTHEIA_LAT33_LAT_ostland_desc:0 "Almanların Baltıkların ve Doğu Polonya'nın bazı bölgelerinin tek bir birleşik devleti için bir tasarımı var. Ostland vizyonları hiyerarşinin en tepesine Baltık Almanlarını yerleştirse de, bu plandan yararlanıp Letonya tasarımında bir Ostland yaratmamamız için hiçbir neden yok."
 WESTHEIA_LAT33_LAT_pan_baltic_bank:0 "Pan-Baltık Bankası"
 WESTHEIA_LAT33_LAT_pan_baltic_bank_desc:0 "Ekonomik birlik artık yürürlükte olduğuna göre, pan-Baltık bir banka ve ortak bir para birimi kurma olasılığımız var."
 WESTHEIA_LAT33_LAT_prepare_covert_resistance:0 "[Root.Get_Covert_Resistance_Focus_Loc]"
 WESTHEIA_LAT33_LAT_prepare_covert_resistance_desc:0 "[Root.Get_Covert_Resistance_Focus_desc_Loc]"
 WESTHEIA_LAT33_LAT_prepare_underground_resistance:0 "[Root.Get_Underground_Resistance_Focus_Loc]"
 WESTHEIA_LAT33_LAT_prepare_underground_resistance_desc:0 "[Root.Get_Underground_Resistance_Focus_desc_Loc]"
 WESTHEIA_LAT33_LAT_propose_baltic_union:0 "Bir Baltık Birliği Öner"
 WESTHEIA_LAT33_LAT_propose_baltic_union_desc:0 "Uluslarımız arasında artık tüm bu farklı varlıklar iç içe geçmişken, resmî bir Baltık Birliği'nin kurulması kaçınılmaz görünüyor. Birlik, tüm üye uluslara birlik içinde oy ve veto hakkı tanıyacak ve uluslarımızı daha da yakınlaştıracaktır."
 WESTHEIA_LAT33_LAT_ready_the_resistance:0 "[Root.Get_Ready_Resistance_Focus_Loc]"
 WESTHEIA_LAT33_LAT_ready_the_resistance_desc:0 "[Root.Get_Ready_Resistance_Focus_desc_Loc]"
 WESTHEIA_LAT33_LAT_renew_kviesis_term:0 "Kviesis ile Uzlaş"
 WESTHEIA_LAT33_LAT_renew_kviesis_term_desc:0 "Alberts Kviesis’in cumhurbaşkanlığını sürdürmesine izin vererek yeni yönetim ile mevcut devlet kurumları arasında bir uzlaşma sağlayabiliriz. Bu tercih, parlamenter düzenin yeniden kurulmasını isteyenlerle görüşmek için de bir kapı bırakacaktır."
 WESTHEIA_LAT33_LAT_renew_the_constitution:0 "Letonya Anayasasını Yenile"
 WESTHEIA_LAT33_LAT_renew_the_constitution_desc:0 "Kārlis Ulmanis, Letonya'ya yaklaşan faşizm ve komünizm fırtınasına dayanabilecek güçlü bir hükûmet getirdi, ancak şimdi sivil hükûmet Çiftçi Partisi üyeleriyle dolduğuna göre, halk seçimlerini yeniden açmamak için çok az neden var."
 WESTHEIA_LAT33_LAT_reorganize_forest_brothers:0 "Orman Kardeşlerini Yeniden Düzenle"
 WESTHEIA_LAT33_LAT_reorganize_forest_brothers_desc:0 "Orman Kardeşleri, Letonya kimliğinin ve kendi kaderini tayin hakkımızın savunucularıdır, ancak onları rahatsız eden şey, aynı zamanda Litvanyalıların ve Estonyalıların bağımsızlığını savunma tutkularıdır. Bu devam edemez, Letonya Orman Kardeşleri kendilerini Letonya'yı, Celmiņš'i ve Pērkonkrusts Partisi'ni savunmaya adamalıdır!"
 WESTHEIA_LAT33_LAT_restore_saeima:0 "Saeima'yı Geri Getir"
 WESTHEIA_LAT33_LAT_restore_saeima_desc:0 "Saeima, Letonya'daki yerel temsilciler meclisidir ve artık hükûmetimizi yönetmese de, Saeima'yı diktatörlüğe daha çok danışmanlık rolünde yeniden açabiliriz; halka demokrasi yanılsaması vererek."
 WESTHEIA_LAT33_LAT_state_paganism:0 "Devlet Paganizmi"
 WESTHEIA_LAT33_LAT_state_paganism_desc:0 "Ordudaki “Dievturība”nın nüfuzu, diğer tüm dinî inançları neredeyse tamamen gölgede bıraktı. Celmiņš'in etrafında, Eski Tanrılar için savaşmaya ve ölmeye hazır olduklarını iddia eden fanatikler var, ancak gerçekte fanatizmlerinin konusu Celmiņš'tir. Dievturība'yı resmî devlet dini olarak kurarak, Pērkonkrusts'un ideolojisini ülke genelindeki kiliselerde ve tapınaklarda yaymaya başlayabiliriz."
 WESTHEIA_LAT33_LAT_supply_forest_brothers:0 "[Root.Get_Forest_Focus_Loc]"
 WESTHEIA_LAT33_LAT_supply_forest_brothers_desc:0 "[Root.Get_Forest_Focus_desc_Loc]"
 WESTHEIA_LAT33_LAT_support_baltic_fascists:0 "Baltık Faşistlerini Destekle"
 WESTHEIA_LAT33_LAT_support_baltic_fascists_desc:0 "Baltıklar kardeştir ve kardeşler yakın kalmalıdır. Üçümüz de yabancı saldırganlığın hedefiyiz ve Baltık halkını yöneten zayıf iradeli hükûmetlere sahip olmayı göze alamayız. Litvanya, Estonya ve Polonya'daki aşırı sağ hareketleri destekleyerek, birleşik ve dünyaya karşı savaşmaya hazır bir Baltık bloğu oluşturma şansımız var."
 WESTHEIA_LAT33_LAT_suspend_the_constitution:0 "Letonya Anayasasını Askıya Al"
 WESTHEIA_LAT33_LAT_suspend_the_constitution_desc:0 "Letonya Anayasası, demokratik haklarımızı yasayla güvence altına almak için 1922'de imzalandı. Ancak, ufukta savaş varken, anayasanın kullanışlılığını yitirdiği ve bu krizden sağ çıkacaksak askıya alınması gerektiği açıktır."
 WESTHEIA_LAT33_LAT_the_old_ways:0 "Eski Yollar"
 WESTHEIA_LAT33_LAT_the_old_ways_desc:0 "Pērkonkrusts, İsa'ya ve öğretilerine bağlılık yemini etmez, bunun yerine çok daha eski başka tanrılara yemin eder. Muhafazakarlar, Celmiņš'in antik tanrılara olan hayranlığını ürkütücü ve doğal olmayan olarak adlandırırlardı, ancak Pērkonkrusts daha gerçek bir Letonya için savaşıyor; yabancı Tanrıların nüfuzundan arınmış."
 WESTHEIA_LAT33_LAT_the_sun_shines_equally:0 "Güneş Eşit Parlar"
 WESTHEIA_LAT33_LAT_the_sun_shines_equally_desc:0 "Letonya'nın güneşi herkesin üzerinde eşit parlar, bu diktatörlüğün ilkesidir. Yıllardır Letonya'nın sosyal sınıfları kültürel ve etnik temellere göre bölünmüştür ancak bunun devam etmesine izin verilemez; tüm insanlar için eşit fırsatlar için çabalamalıyız ve ideallerimize karşı çıkan paramiliterleri destekleyemeyiz."
 WESTHEIA_LAT33_LAT_the_sun_shines_equally_idea:0 "Güneş Eşit Parlar"
 WESTHEIA_LAT33_LAT_the_thunder_strikes_alone:0 "Yıldırım Yalnız Kükrer"
 WESTHEIA_LAT33_LAT_the_thunder_strikes_alone_desc:0 "Yabancılardan yardıma ihtiyacımız yok. Letonya bağımsızlığını savunma yeteneğinden fazlasına sahip, ancak yalnızca Pērkonkrusts'un rehberliğinde."
 WESTHEIA_LAT33_LAT_threat_on_our_border:0 "[Root.Get_Threat_Border_Focus_Loc]"
 WESTHEIA_LAT33_LAT_threat_on_our_border_desc:0 "[Root.Get_Threat_Border_Focus_desc_Loc]"
 WESTHEIA_LAT33_LAT_united_baltic_empire:0 "Birleşik bir Baltık İmparatorluğu"
 WESTHEIA_LAT33_LAT_united_baltic_empire_desc:0 "Tek bir birleşik Baltık devleti fikri biraz tuhaf bir kavram olsa da, kardeşliğimizin sadece sınırların ötesine uzandığı inkar edilemez. Litvanya ve Estonya kontrolümüz altındayken, sadece yönetimlerini bizimkiyle entegre etmemiz gerekiyor ve Baltık hegemonyası hırsımız gerçeğe dönüşecek."
 WESTHEIA_LAT33_LAT_what_is_capitalism:0 "Devlet Kapitalizmi"
 WESTHEIA_LAT33_LAT_what_is_capitalism_desc:0 "Meslek Odaları sağlam bir şekilde kurulduğuna göre, ekonominin doğrudan kontrolünü ele almamızın zamanı geldi. Ekonomimiz doğası gereği kapitalist kalsa da, diktatörlüğün kilit endüstrilerin kontrolünü ele almasının zamanı geldi."
 WESTHEIA_LAT33_LAT_what_is_socialism:0 "Letonya Sosyalizmi"
 WESTHEIA_LAT33_LAT_what_is_socialism_desc:0 "Letonya Sosyal Demokrat partisi şu anda Saeima'da açık ara en popüler parti ve Fricis Menders'in takipçileri çok ve sesli. Belki de onun bazı reformlarını uygulayarak Letonyalı işçilere daha iyi ve daha üretken çalışma ortamları sağlanabilir."
 WESTHEIA_LAT33_LAT_womens_aizsargi:0 "Kadın Aizsargi'yi Genişlet"
 WESTHEIA_LAT33_LAT_womens_aizsargi_desc:0 "Daha alt seviye uluslar kadınların askerlik hizmetini yasaklardı, ama Letonya'da, bir tüfek tutmaya istekli ve muktedir olan herkes hizmetimizde hoş karşılanır."
 WESTHEIA_LAT33_LAT_wrath_of_the_old_gods:0 "Eski Tanrıların Gazabı"
 WESTHEIA_LAT33_LAT_wrath_of_the_old_gods_desc:0 "Yabancı din tarafından lekelenen tek yer Baltık değil. Dünyanın çoğu İsa'nın öğretilerini takip ediyor ve bu değişmeli. Kendi haçlı seferimizi ilan etmeliyiz; Hristiyanlığa karşı bir haçlı seferi!"
 WESTHEIA_LAT33_devaluation:0 "Latın Devalüasyonu"
 WESTHEIA_LAT33_devaluation_desc:0 "Latın kurunun düşürülmesi ihracatın rekabet gücünü artırmış, ancak ithal malların fiyatlarını ve tasarruf sahiplerinin beklentilerini sarsmıştır."
 WESTHEIA_LAT33_devalue_lats:0 "Latı Devalüe Et"
 WESTHEIA_LAT33_devalue_lats_desc:0 "İhracatımızın rekabet gücünü yeniden kazanmak için latın eski paritesini düşürmeliyiz. Kur değişikliği dış ticareti canlandırırken ithal malların fiyatları ve tasarruflar üzerinde baskı yaratacaktır."
 WESTHEIA_LAT33_kegums_dam:0 "Kegums Hidroelektrik Santralini İnşa Et"
 WESTHEIA_LAT33_kegums_dam_desc:0 "Daugava üzerindeki Ķegums santralini tamamlayarak Riga ve çevresine elektrik sağlayabilir, ülkemizin sanayi ve enerji altyapısını güçlendirebiliriz."
 WESTHEIA_LAT33_parliamentary_instability:0 "Parçalı Parlamento"
 WESTHEIA_LAT33_parliamentary_instability_desc:0 "Çok sayıda partinin temsil edildiği Saeima’da kalıcı çoğunluklar oluşturmak güçtür. Ekonomik bunalım, bütçe tartışmaları ve değişen koalisyonlar hükümetlerin hareket alanını daraltmaktadır."
 WESTHEIA_LAT33_sterling_peg:0 "Latı Sterline Bağla"
 WESTHEIA_LAT33_sterling_peg_desc:0 "Latın yeni kurunu İngiliz sterlinine bağlayarak dış ticarette daha öngörülebilir bir para düzeni oluşturabiliriz. İngiltere ile ekonomik ilişkilerimizin güçlenmesi ihracatçılarımızı destekleyecektir."
 WESTHEIA_LAT33_sterling_peg_idea:0 "Sterline Bağlı Lat"
 WESTHEIA_LAT33_sterling_peg_idea_desc:0 "Latın sterline bağlanması İngiltere ile ticarete daha öngörülebilir bir kur sağlamaktadır. İhracat gelirlerinin toparlanması ekonomiyi rahatlatmaktadır."
 WESTHEIA_LAT33_sterling_relations:0 "Sterlin Bağlantısı"
 WESTHEIA_LAT33_ulmanis_government:0 "Ulmanis Yönetimi"
 WESTHEIA_LAT33_ulmanis_government_long:0 "Ulmanis’in Ulusal Yönetimi"
 WESTHEIA_LAT_1933_parliamentary_coalition:0 "Parlamenter Koalisyon"
 WESTHEIA_LAT_1933_parliamentary_coalition_long:0 "Parlamenter Koalisyon Hükümeti"
 WESTHEIA_LAT_bulldog_9asb_inventory:0 "Bristol Bulldog II (9ASB)"
 WESTHEIA_LAT_bulldog_9asb_inventory_desc:0 "Letonya Bulldog siparişinin son iki uçağı, Gnome-Rhône 9ASB motorlarıyla teslim edildi. Bu tasarım farklı motorlu çifti temsil eder; iki sabit makineli tüfek taşır."
 WESTHEIA_LAT_bulldog_9asb_inventory_legacy:0 "Bristol Bulldog II (9ASB)"
 WESTHEIA_LAT_bulldog_9asb_inventory_legacy_desc:0 "Letonya Bulldog siparişinin son iki uçağı, Gnome-Rhône 9ASB motorlarıyla teslim edildi. Bu tasarım farklı motorlu çifti temsil eder; iki sabit makineli tüfek taşır."
