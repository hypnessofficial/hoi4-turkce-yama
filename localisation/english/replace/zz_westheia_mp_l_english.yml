l_english:
 AFG_1933_announce_the_new_reign:0 "Yeni Saltanatı Dünyaya Duyur"
 AFG_1933_announce_the_new_reign_desc:0 "Nadir Şah’ın ölümünün ardından tahta çıkan Zahir Şah’ın saltanatını yabancı hükûmetlere resmen bildirmeliyiz. Afganistan’da yönetimin devamlılığını ve bağımsızlığımızı vurgulayan diplomatik temaslar, yeni hükümdarın uluslararası konumunu güçlendirecektir."
 AFG_1933_join_the_league_of_nations:0 "Milletler Cemiyeti’ne Katıl"
 AFG_1933_join_the_league_of_nations_desc:0 "Afganistan’ın bağımsızlığı ve egemenliği, uluslararası toplumda daha güçlü biçimde temsil edilmelidir. Milletler Cemiyeti’ne üyelik başvurusu yaparak ülkemizin diplomatik yalnızlığını azaltabilir, anlaşmazlıkların barışçı yollarla çözümüne dayanan uluslararası düzende yerimizi alabiliriz."
 AFG_1933_king_nadir_shah:0 "Kral Nadir Şah"
 AFG_1933_king_nadir_shah_desc:0 "1929’daki iç mücadelelerin ardından tahta çıkan Muhammed Nadir Şah, monarşinin otoritesini yeniden tesis etmeye çalışmaktadır. Kabile ileri gelenleri ve dinî çevrelerle kurduğu uzlaşmalar, ihtiyatlı bir yeniden yapılanma siyasetinin dayanağını oluşturur. Sarayın birleştirici konumu, kırılgan devlet düzeninin istikrarını desteklemektedir."
 AST_1933_federal_union_category:0 "Federal Birliği Koru"
 AST_1933_federal_union_category_desc:0 "Batı Avustralya’nın ekonomik şikâyetleri, federasyondan ayrılma kampanyasını güçlendiriyor."
 AST_1933_three_year_defence_program:0 "Üç Yıllık Savunma Programı"
 AST_1933_three_year_defence_program_desc:0 "Büyük Buhran sırasında ertelenen savunma yatırımları ordumuzu, donanmamızı ve hava kuvvetlerimizi yıprattı. Üç yıla yayılacak bir program hazırlayarak kıyı savunmasını güçlendirecek ve üç kuvvetin ihtiyaçlarını ortak bir plan altında değerlendireceğiz."
 AST_1933_three_year_defence_program_idea:0 "Üç Yıllık Savunma Programı"
 AST_1933_three_year_defence_program_idea_desc:0 "Üç yıla yayılan savunma yatırımları, kara ve kıyı tahkimatlarının ve sabit uçaksavar mevzilerinin yapımını hızlandırıyor. Programın inşaat desteği, odağın tamamlanmasından itibaren üç yıl sürer."
 AST_1933_western_referendum:0 "Batı Referandumu"
 AST_1933_western_referendum_desc:0 "Batı Avustralya’da federasyonun ekonomik politikalarına duyulan tepki büyüyor. Dominion League, eyaletin federasyondan ayrılması için referandum kampanyası yürütüyor."
 AST_1933_western_referendum_mission:0 "Batı Referandumu Yaklaşıyor"
 AST_1933_western_referendum_mission_desc:0 "Batı Avustralya halkı, eyaletin Avustralya Federasyonu’nda kalıp kalmayacağına karar vermek üzere sandığa gidiyor."
 AST_1933_western_secession_concessions:0 "Batı Avustralya Ayrılıkçılığı — Uzlaşma"
 AST_1933_western_secession_concessions_desc:0 "Federal hükûmetin attığı adımlar, Batı Avustralya’daki gerilimi hafifletti. Ancak ayrılma dilekçesi Londra’da değerlendirilirken federal birliğe yönelik güvensizlik sürüyor."
 AST_1933_western_secession_crisis:0 "Batı Avustralya Ayrılıkçılığı"
 AST_1933_western_secession_crisis_desc:0 "Referandumda ayrılma talebinin üstün gelmesi, Batı Avustralya ile federal hükûmet arasındaki gerilimi açık bir siyasi krize dönüştürdü."
 AST_british_intel_sharing:0 "İngiliz İstihbarat Paylaşımı"
 AST_covert_networks:0 "Gizli Ağlar"
 AST_covert_networks_desc:0 "Önce Avustralya Soruşturma Şubesi içinde hareket ederken, [ENG.GetNameDef]'teki benzer hareketlerle sınır ötesi işbirliği arayacağız. Efendimizle olan ittifakımız, ideolojik olarak uyumlu müttefiklere gizlice ulaşmamızı ve istihbarat kapasitemizi genişletmemizi sağlayarak bize başka bir şekilde hizmet edebilir."
 AST_form_australasia_malenesia_core_states_tt:0 "Tüm §YMelanezya§! eyaletleri üzerinde hak kazan."
 AST_form_australasia_malenesia_required_states_tt:0 "Tüm §YMelanezya§! eyaletlerini kontrol eder."
