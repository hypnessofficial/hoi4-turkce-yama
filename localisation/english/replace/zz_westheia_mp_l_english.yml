 WESTHEIA_LAT_pirat_inventory_short:0 "Svenska Aero SA-10 Pirat"
 WESTHEIA_LAT_svenska_siia_inventory:0 "Svenska Aero S.IIa"
 WESTHEIA_LAT_svenska_siia_inventory_desc:0 "İsveç yapımı eski deniz keşif uçağı. Eagle motoru, gözlem donanımı, savunma makineli tüfeği ve çift şamandıra taşır. 1931’de kaybedilen iki uçak başlangıç envanterine dahil değildir."
 WESTHEIA_LAT_svenska_siia_inventory_legacy:0 "Svenska Aero S.IIa"
 WESTHEIA_LAT_svenska_siia_inventory_legacy_desc:0 "İsveç yapımı eski deniz keşif uçağı. Eagle motoru, gözlem donanımı, savunma makineli tüfeği ve çift şamandıra taşır. 1931’de kaybedilen iki uçak başlangıç envanterine dahil değildir."
 WESTHEIA_LAT_svenska_siia_inventory_legacy_short:0 "Svenska Aero S.IIa"
 WESTHEIA_LAT_svenska_siia_inventory_registration:0 "Svenska Aero S.IIa Tasarımı"
 WESTHEIA_LAT_svenska_siia_inventory_registration_legacy:0 "Svenska Aero S.IIa Tasarımı"
 WESTHEIA_LAT_svenska_siia_inventory_short:0 "Svenska Aero S.IIa"
 WESTHEIA_LIB_DWP_1933:0 "DWP"
 WESTHEIA_LIT33_BALTIC_align_paramilitarists:0 "Paramiliterleri Yeniden Hizala"
 WESTHEIA_LIT33_BALTIC_align_paramilitarists_desc:0 "[Root.GetNameDef] genelinde çoğu yalnızca [Root.GetAdjective] kendi kaderini tayin hakkının korunmasına adanmış birçok paramiliter grup var. Takdire şayan olsa da, bu grupların bizi [SOV.GetAdjective] kuklaları olarak değil, [Root.GetAdjective] devletinin mantıksal devamı olarak görmeleri tercih edilir."
 WESTHEIA_LIT33_BALTIC_allied_shipments:0 "Müttefik Sevkiyatlarını Artır"
 WESTHEIA_LIT33_BALTIC_allied_shipments_desc:0 "1918'den beri [Root.GetNonIdeologyAdjective] ordusu Büyük Britanya'dan bize gönderilen sevkiyatlarla donatılmıştır ve Müttefiklere sevkiyatlar büyük ölçüde artırılmazsa [Root.GetNonIdeologyName]'in başka bir Sovyet kukla hükûmetine tabi olabileceğini anlatmak için çaba göstermeliyiz."
 WESTHEIA_LIT33_BALTIC_arm_baltic_reds:0 "Baltık Kızıllarını Silahlandır"
 WESTHEIA_LIT33_BALTIC_arm_baltic_reds_desc:0 "Sahne hazır, komünist şevk tüm Baltık'ta yanıyor. Kızılların şimdi tek ihtiyacı olan bizden gelen sinyal ve kaynaklar ve Baltık devrimini ateşleyeceğiz!"
 WESTHEIA_LIT33_BALTIC_arm_the_nation:0 "Ulusu Silahlandır"
 WESTHEIA_LIT33_BALTIC_arm_the_nation_desc:0 "[Root.GetNonIdeologyName]'in her yerinde bir Sovyet işgali tehdidiyle yüzleşmeye hazır ancak bunu yapacak ekipmandan yoksun adamlar var. Piyade teçhizatının hızlı üretimi için silah sanayimizi hazırlamalıyız."
 WESTHEIA_LIT33_BALTIC_arms_industry:0 "Silahlanmayı Tamamla"
 WESTHEIA_LIT33_BALTIC_arms_industry_desc:0 "Sanayimizin modernizasyonu tamamlandığına ve ülkemizde faaliyet gösteren sayısız yerli askerî sanayi kuruluşu olduğuna göre, [Root.GetAdjective] silah sanayisi nihayet gerçek potansiyeline ulaşabilir!"
 WESTHEIA_LIT33_BALTIC_attract_workers_to_capital:0 "İşçileri [Root.Capital.GetName]'e Çek"
 WESTHEIA_LIT33_BALTIC_attract_workers_to_capital_desc:0 "[Root.GetNonIdeologyName]'in işçileri kırsal kesimde dağınık bir şekilde yayılmış durumdalar ve genellikle modası geçmiş tarım sektöründe çalışıyorlar. Ulusumuzu savaş için sanayileştirmek istiyorsak, işçileri [Root.Capital.GetName]'deki fabrikalara çekmeliyiz!"
 WESTHEIA_LIT33_BALTIC_autobahn:0 "[Root.GetAdjective] Otobanı"
 WESTHEIA_LIT33_BALTIC_autobahn_desc:0 "Eğer altyapısı hızlı ve sürekli bir işgücü akışını kolaylaştırmıyorsa, [Root.GetNonIdeologyName]'in ne kadar iyi sanayileşmiş olduğu pek önemli değil. Altyapı sektörümüzü Reich'ınkine göre modelleyerek, onların sahip olduğu verimliliği elde edebiliriz."
 WESTHEIA_LIT33_BALTIC_axis_investments:0 "[GetBalticAxisInvesmentsAdj] Yatırımları Ara"
 WESTHEIA_LIT33_BALTIC_axis_investments_desc:0 "[GetBalticAxisInvesmentsDesc]"
 WESTHEIA_LIT33_BALTIC_axis_investments_desc_fasc_eur:0 "Faşizm Avrupa'da güçlü bir varlığa sahiptir ve bazı anlaşılır çekinceler olsa da, Faşist ticaretinin ve yatırımlarının [ROOT.GetNonIdeologyAdjective] ekonomisini ölçülemez derecede güçlendireceği inkar edilemez."
 WESTHEIA_LIT33_BALTIC_axis_investments_desc_fasc_int:0 "Faşizm dünya çapında güçlü bir varlığa sahiptir ve bazı anlaşılır çekinceler olsa da, Faşist ticaretinin ve yatırımlarının [ROOT.GetNonIdeologyAdjective] ekonomisini ölçülemez derecede güçlendireceği inkar edilemez."
 WESTHEIA_LIT33_BALTIC_axis_investments_desc_ger:0 "Almanya'nın ticaret limanları Baltık boyunca mevcuttur ve bir zamanlar düşman olsak da, Mihver ticaretinin ve yatırımlarının [ROOT.GetNonIdeologyAdjective] ekonomisini ölçülemez derecede güçlendireceği inkar edilemez."
 WESTHEIA_LIT33_BALTIC_axis_investments_desc_jap:0 "[JAP.GetName] ekonomik ve askerî gücünü kanıtladı ve tam olarak komşu olmasalar da, [JAP.GetAdjective] ticaretinin ve yatırımlarının [ROOT.GetNonIdeologyAdjective] ekonomisini ölçülemez derecede güçlendireceği inkar edilemez."
 WESTHEIA_LIT33_BALTIC_axis_investments_idea:0 "Mihver Yatırımları"
 WESTHEIA_LIT33_BALTIC_axis_investments_idea_1:0 "Mihver Yatırımları"
 WESTHEIA_LIT33_BALTIC_baltic_fleet:0 "Baltık Filosu"
 WESTHEIA_LIT33_BALTIC_baltic_fleet_desc:0 "[Root.GetNonIdeologyAdjective] filosu dünyanın gıpta ettiği bir filo olmasa da, doğru yatırımla [Root.GetNonIdeologyName]'i denizdeki herhangi bir işgal girişimine karşı savunabileceğini kanıtlayabilir."
 WESTHEIA_LIT33_BALTIC_balticwall:0 "Baltık Duvarı"
 WESTHEIA_LIT33_BALTIC_balticwall_desc:0 "Doğu'daki tahkimatlar, düşmanlarımız bunun yerine denizden bir saldırı gerçekleştirmeyi seçerse işe yaramaz! İngilizlere, Almanlara veya Sovyetlere rakip olabilecek bir donanma asla inşa edemeyebiliriz, ancak kıyı savunmalarımıza karşı onları çaresiz bırakmak için elimizden geleni yapabiliriz."
 WESTHEIA_LIT33_BALTIC_belarus_ssr:0 "[Root.GetNonIdeologyName]-Belarus SSC"
 WESTHEIA_LIT33_BALTIC_belarus_ssr_desc:0 "Belarus ve Baltık'ı birleştirme kavramı yabancı bir kavram değildir. Uzun zaman önce Litvanya-Belarus Sovyet Sosyalist Cumhuriyeti, bu iki görünüşte farklı halkın uyumlu bir birleşimi olarak var oldu. Sosyalizm kültür ve dil sınırları tanımaz ve [Root.GetAdjective] ve Belaruslu işçilerin bir arada yaşayamaması için çok az neden görüyoruz."
 WESTHEIA_LIT33_BALTIC_british_aircraft:0 "[GetBritAircraftManufTitle]"
 WESTHEIA_LIT33_BALTIC_british_aircraft_alt:0 "Yabancı Uçak İmalatı"
 WESTHEIA_LIT33_BALTIC_british_aircraft_default:0 "İngiliz Uçak İmalatı"
 WESTHEIA_LIT33_BALTIC_british_aircraft_desc:0 "[GetBritAircraftManufDesc]"
 WESTHEIA_LIT33_BALTIC_british_aircraft_desc_alt:0 "Yerli havacılık tasarımlarına yönelik çabalar şimdiye kadar en iyi ihtimalle ılımlı kaldı. Hava kuvvetleri şimdiye kadar Alman ve Sovyet kuvvetlerinden ele geçirilen uçaklara güvendi, ancak hayatta kalmak istiyorsak yerli uçak üretimine başlamalıyız ve yabancı bir hava kuvvetlerinden gelen yardım zafer kazanmanın anahtarı olabilir..."
 WESTHEIA_LIT33_BALTIC_british_aircraft_desc_default:0 "Yerli havacılık tasarımlarına yönelik çabalar şimdiye kadar en iyi ihtimalle ılımlı kaldı. Hava kuvvetleri şimdiye kadar Alman ve Sovyet kuvvetlerinden ele geçirilen uçaklara güvendi, ancak hayatta kalmak istiyorsak yerli uçak üretimine başlamalıyız ve İngiliz hava kuvvetleri zafer kazanmanın anahtarı olabilir..."
 WESTHEIA_LIT33_BALTIC_british_designers:0 "İngiliz Tasarımcıları Davet Et"
 WESTHEIA_LIT33_BALTIC_british_designers_desc:0 "İngiliz tasarımlarını kapsamlı bir şekilde inceledik ve [Root.Capital.GetName]-Crossley Motorları'nın başarılı bir girişim olduğu kanıtlandığından, İngiliz tasarımcıları [Root.GetNonIdeologyAdjective] Mühendislik Şirketi'ne katılmaya resmî davetiyeler göndermek bizim için iyi olacaktır."
 WESTHEIA_LIT33_BALTIC_communist_opposition:0 "Muhalefete Geç"
 WESTHEIA_LIT33_BALTIC_communist_opposition_desc:0 "Sovyetler Birliği'nin ne [Root.GetNameDef]'e ne de halkına dost olmadığı kanıtlanmıştır ve [Root.GetNameDef]'in anahtarlarını, [Root.GetAdjective]'i yağmalamaktan başka bir şey istemeyen Kızıl Ordu'nun akbabalarına teslim etmek aptallık olur. Onlar kapitalistlerden daha güvenilir değiller ve eğer [Root.GetCommunistParty] başarılı olacaksa, bu tek başına yapılmalıdır!"
 WESTHEIA_LIT33_BALTIC_concessions_for_catholics:0 "Katolikler İçin Tavizler"
 WESTHEIA_LIT33_BALTIC_concessions_for_catholics_desc:0 "[Root.GetNameDef]'in alt sınıflarının çoğu dindar Katoliktir ve ilk İşçi Cumhuriyeti'nde dinî uygulama Kızıl Ordu tarafından sert bir şekilde bastırılmıştır. Bu durum [Root.GetNameDef]'in yoksullarının çoğunu devrime karşı çevirdi, bu yüzden eğer gerçekten halkın cumhuriyeti olacaksak, onlara inançlarının korunacağına dair kesin bir güvence vermeliyiz."
 WESTHEIA_LIT33_BALTIC_crossley_motors:0 "Yabancı Sanayi Ortaklıkları Kur"
 WESTHEIA_LIT33_BALTIC_crossley_motors_desc:0 "Yabancı sanayi kuruluşlarıyla anlaşmalar yaparak makine, teknik bilgi ve yatırım tedarikini genişletebiliriz. Bu ortaklıklar yerli işletmelerin üretim kapasitesini güçlendirecektir."
 WESTHEIA_LIT33_BALTIC_crush_forest_brothers:0 "Orman Kardeşlerini Ez"
 WESTHEIA_LIT33_BALTIC_crush_forest_brothers_desc:0 "Orman Kardeşleri, yönetimi ele geçirmemizden bu yana ulusumuz için bir bela oldular; sanayilerimizi, demiryollarımızı sabote ediyor ve resmî hükûmet gösterilerini bozuyorlar. [Root.GetNonIdeologyName]'in ormanlarına girmeli ve bu yanlış yönlendirilmiş bireyleri kökünden sökmeliyiz."
 WESTHEIA_LIT33_BALTIC_defence_of_our_nation:0 "Ulusumuzun Savunması"
 WESTHEIA_LIT33_BALTIC_defence_of_our_nation_desc:0 "Sivil sanayi, savunmamız için silah sanayisi kadar önemlidir. Makine seslerinin sürekli uğultusu, vatansever halkı ulusumuzu sanayileştirme görevini yaparken tüm [Root.GetNonIdeologyName] boyunca yankılanacak."
 WESTHEIA_LIT33_BALTIC_direct_intervention:0 "Doğrudan Sovyet Müdahalesi"
 WESTHEIA_LIT33_BALTIC_direct_intervention_desc:0 "Hükûmeti tek başımıza geri alamadığımızı kanıtladık ve mücadelemizde bize yardım etmeleri için [SOV.GetNameDef]'deki müttefiklerimizi çağırmalıyız."
 WESTHEIA_LIT33_BALTIC_domestic_motors:0 "Yerli Bir Motor Şirketi"
 WESTHEIA_LIT33_BALTIC_domestic_motors_desc:0 "Yabancı tasarımlar iyidir, ancak onlara sonsuza kadar güvenemeyiz. [Root.GetNonIdeologyName] gururlu bir ulustur ve dünyaya tasarımcılarımızın ve düşünürlerimizin Batı'dakiler kadar yeterli olduğunu göstermeliyiz."
 WESTHEIA_LIT33_BALTIC_eastwall:0 "Doğu Duvarı"
 WESTHEIA_LIT33_BALTIC_eastwall_desc:0 "Almanlar da en az bizim kadar Doğu'dan bir saldırı bekliyor ve Alman yetkililere kendi sınırları kadar bizim sınırımızı da kuvvetle tahkim etmeleri tavsiye edilir."
 WESTHEIA_LIT33_BALTIC_end_bourgeouis_dictatorships:0 "Burjuva Diktatörlüklerine Son Ver"
 WESTHEIA_LIT33_BALTIC_end_bourgeouis_dictatorships_desc:0 "Baltıklar sözde “tarafsız” diktatörler tarafından domine ediliyor. Ordunun desteğiyle ve halklarının rızası olmadan, Baltık proletaryası kapitalist diktatörlük altında eziliyor. Sadece özgürleşmiş [Root.GetAdjective] işçilerinin elleriyle, haksız sınırlar tarafından ayrı tutulan bu işçiler şanlı kurtuluşumuzu paylaşabilir!"
 WESTHEIA_LIT33_BALTIC_end_swedish_neutrality:0 "İsveç Tarafsızlığına Son Ver"
 WESTHEIA_LIT33_BALTIC_end_swedish_neutrality_desc:0 "İsveçlilerin tarafsızlık dediği şey zayıflıktan başka bir şey değildir; sınırları ötesindeki alt sınıfların refahına çok az önem vererek, o an en güçlü görünen gücün kaprislerine boyun eğmek. Böylesine zayıf iradeli ve dayanıksız bir hükûmet, sınırımızı paylaşmaya layık değildir ve halkını tiranlıktan koruyacak omurgaya sahip yeni bir İsveç yaratmalıyız."
 WESTHEIA_LIT33_BALTIC_finnish_invasion:0 "Finlandiya İşgali"
 WESTHEIA_LIT33_BALTIC_finnish_invasion_desc:0 "Finlandiya bizim için kapitalizmin prangaları altına bağlanmış kayıp bir kardeştir. Finlandiya ancak şiddetli bir devrimle, tıpkı Baltıkların özgürleştiği gibi özgürleşebilir."
 WESTHEIA_LIT33_BALTIC_focus_on_the_interior:0 "İç Meselelere Odaklan"
 WESTHEIA_LIT33_BALTIC_focus_on_the_interior_2:0 "Almanlara Hazırlan"
 WESTHEIA_LIT33_BALTIC_focus_on_the_interior_2_desc:0 "Freikorps'un [Root.GetNameDef]'e bunca yıl önce getirdiği mutlak vahşeti unutmamamız hayati önem taşıyor. Köylüler ve işçiler hayvan gibi katledildi, tüm köyler küle ve harabeye döndü ve [Root.GetAdjective] halkının bir daha asla böyle bir vahşete maruz kalmasına izin veremeyiz."
 WESTHEIA_LIT33_BALTIC_focus_on_the_interior_desc:0 "Birçok işçi komşularımıza yürümeye ve şanlı devrimimizi tüm Baltık halklarına getirmeye hevesli olsa da, bunun yerine ulusumuzun içine odaklanmalıyız; devrimin ardından rejimi istikrara kavuşturmalıyız."
 WESTHEIA_LIT33_BALTIC_ford_motors:0 "Motorlu Araç İthalatını Genişlet"
 WESTHEIA_LIT33_BALTIC_ford_motors_desc:0 "Ordunun ve sivil ekonominin araç ihtiyacını karşılamak için yabancı üreticilerden araç, yedek parça ve teknik destek tedarikini genişletmeliyiz."
 WESTHEIA_LIT33_BALTIC_forment_disloyalty:0 "Muhalefeti Birleştir"
 WESTHEIA_LIT33_BALTIC_forment_disloyalty_desc:0 "Hem [Root.GetAdjective] hükûmetinin içinde hem de dışında birçok hareket var ve eğer [Root.GetNameDef]'i rahatsız eden mevcut tiranlığı devireceksek, [Root.GetNeutralParty]'e karşı muhalefetin birleştirici sesi olmalıyız!"
 WESTHEIA_LIT33_BALTIC_free_the_workers_of_poland:0 "Polonya İşçilerini Özgürleştir"
 WESTHEIA_LIT33_BALTIC_free_the_workers_of_poland_desc:0 "Polonyalılar bir zamanlar Baltık'ı yönetmiş olsalar da, şimdi [GER.GetNameDef]'in yırtıcı rejimine karşı savunmasız bir av durumundalar. Güney'deki yoldaşlarımızı savunmalı ve onları bir Polonya Sosyalist Cumhuriyeti altında birleştirmeliyiz!"
 WESTHEIA_LIT33_BALTIC_german_baltic_industry:0 "Mihver-Baltık Sanayisi"
 WESTHEIA_LIT33_BALTIC_german_baltic_industry_desc:0 "[GetGermanBalticIndustryDesc]"
 WESTHEIA_LIT33_BALTIC_german_baltic_industry_desc_alt:0 "Ulusumuz şimdi yabancı faşist yatırımı açısından zengin. Diğer faşist hamilerimizin ve [Root.GetNonIdeologyName]'in özel sektörleri neredeyse ayırt edilemez, aynı şirketlerin birçoğu [Root.GetNonIdeologyAdjective]lere ve halklarına aynı şekilde iş sağlıyor."
 WESTHEIA_LIT33_BALTIC_german_baltic_industry_desc_default:0 "Ulusumuz şimdi Alman yatırımı açısından zengin. Almanya'nın ve [Root.GetNonIdeologyName]'in özel sektörleri neredeyse ayırt edilemez, aynı şirketlerin birçoğu [Root.GetNonIdeologyAdjective]lere ve Almanlara aynı şekilde iş sağlıyor."
 WESTHEIA_LIT33_BALTIC_german_tank_licences:0 "[GetBalticAxisInvesmentsAdj] Tank Lisansları"
 WESTHEIA_LIT33_BALTIC_german_tank_licences_desc:0 "[GetGermanTankLicencesDesc]"
 WESTHEIA_LIT33_BALTIC_german_tank_licences_desc_alt:0 "Faşist hamilerimizin tankları, hedeflerine doğru ilerlerken düşmanlarını dağınık ve şaşkın bırakma yeteneklerini kanıtladılar. [Root.GetNonIdeologyName], Doğu'ya yönelik yaklaşan savaşlarda bu taktikleri taklit etmekten büyük fayda sağlayacaktır."
 WESTHEIA_LIT33_BALTIC_german_tank_licences_desc_default:0 "Alman tankları, hedeflerine doğru ilerlerken düşmanlarını dağınık ve şaşkın bırakma yeteneklerini kanıtladılar. [Root.GetNonIdeologyName], Doğu'ya yönelik yaklaşan savaşlarda bu taktikleri taklit etmekten büyük fayda sağlayacaktır."
 WESTHEIA_LIT33_BALTIC_german_war_economics:0 "[GetBalticAxisInvesmentsAdj] Savaş Ekonomisini Benimse"
 WESTHEIA_LIT33_BALTIC_german_war_economics_desc:0 "[GetGermanWarEconomicsDesc]"
 WESTHEIA_LIT33_BALTIC_german_war_economics_desc_alt:0 "Faşist hamilerimiz, daha önce birkaç kez gördüğümüz türden hızlı bir askerî sanayileşme sürecindeler ve onları taklit etmek ve onlardan yatırım aramak bizim için iyi olacaktır."
 WESTHEIA_LIT33_BALTIC_german_war_economics_desc_default:0 "Almanlar, Avrupa'nın daha önce birkaç kez gördüğü türden hızlı bir askerî sanayileşme sürecindeler ve onları taklit etmek ve Reichsbank'tan yatırım aramak bizim için iyi olacaktır."
 WESTHEIA_LIT33_BALTIC_influence_neighbours:0 "Komşuları Etkile"
 WESTHEIA_LIT33_BALTIC_influence_neighbours_desc:0 "Bağımsızlık savaşlarından önce olduğu kadar popüler olmasa da, sosyalizm altında özgür bir Baltık kavramı, Baltık'ın kendi kaderini tayin etme kavramı kadar eskidir. Devletimiz, Baltık diktatörlüklerinin baskıcı rejimleri altında yaşayanlar tarafından modellenecek bir şey olarak durabilir ve bunu silahlandırarak Devrimi komşularımıza kansız bir şekilde yayma şansımız var."
 WESTHEIA_LIT33_BALTIC_invest_in_baltic_trade:0 "Baltık Ticaretine Yatırım Yap"
 WESTHEIA_LIT33_BALTIC_invest_in_baltic_trade_desc:0 "Baltık Denizi, İskandinavya, Almanya ve Rusya'dan gelen ticaretle zengindir ve limanlarımız hepsini zorlukla barındırabilir. Daha parlak ve müreffeh bir [Root.GetNonIdeologyName] için bu denizi bizimle paylaşan dostlarımızla yeni ticaret hatları açmalıyız!"
 WESTHEIA_LIT33_BALTIC_modernize_industry:0 "Sanayimizi Modernleştir"
 WESTHEIA_LIT33_BALTIC_modernize_industry_desc:0 "Kaunas ve Šiauliai çevresindeki üretim tesislerini geliştirerek sanayi kapasitemizi artırmalıyız. Kırsal yatırımlar tarımsal ekonomiyi desteklerken ülkenin sanayileşmesi aşamalı olarak ilerleyecektir."
 WESTHEIA_LIT33_BALTIC_natural_resources:0 "Tarımsal Üretimi Modernleştir"
 WESTHEIA_LIT33_BALTIC_natural_resources_desc:0 "Çiftliklerin verimini artırmak, kooperatifleri desteklemek ve ürünlerin işlenmesini geliştirmek tarım ekonomimizin dayanıklılığını güçlendirecektir. Kırsal dönüşüm, sanayinin gelişmesiyle birlikte yürütülmelidir."
 WESTHEIA_LIT33_BALTIC_original_designs:0 "Orijinal Tasarımlar"
 WESTHEIA_LIT33_BALTIC_original_designs_desc:0 "Ulusumuzun 1918'deki doğumundan günümüze kadar, [Root.GetNonIdeologyName] ordularını İngilizlerden gelen silahlarla donattı, ama artık değil. Artık İngilizlere güvenemeyiz, ileriye bakmalı ve [Root.GetNonIdeologyAdjective] menşeli silah üretmeye başlamalıyız."
 WESTHEIA_LIT33_BALTIC_overthrow_the_government:0 "[Root.GetNeutralParty]'i Devir"
 WESTHEIA_LIT33_BALTIC_overthrow_the_government_desc:0 "[Root.GetLeader]'i ve [Root.GetLeader.GetHerHis] rejimini devirmek için yeterli desteği topladık! Tek yapmamız gereken başkente yürümek ve yeni bir İşçi Cumhuriyeti ilan etmek!"
 WESTHEIA_LIT33_BALTIC_path_to_the_north_sea:0 "Kuzey Denizi'ne Bir Yol"
 WESTHEIA_LIT33_BALTIC_path_to_the_north_sea_desc:0 "Danimarkalılar bu tırmanan küresel çatışmada ne yazık ki tarafsız kaldılar ve Danimarka boğazları, sosyalist dünyayı Kuzey Denizi'nden ayıran tek şey."
 WESTHEIA_LIT33_BALTIC_purge_of_our_own:0 "Kendi Tasfiyemiz"
 WESTHEIA_LIT33_BALTIC_purge_of_our_own_desc:0 "Tüm direnişi ezmek için gösterdiğimiz en iyi çabalara rağmen, hala gölgelerde örgütlenen, [Root.GetNonIdeologyName]'de kapitalist bir diktatörlüğü yeniden kurmak için proletaryaya karşı komplo kuranlar var. Popüler bir tasfiye yapmalıyız; eski hükûmetin tüm üyelerini ve onları destekleyen herkesi kökünden sökmeliyiz."
 WESTHEIA_LIT33_BALTIC_rebuild_forts:0 "[Root.Capital.GetName] Kalelerini Yeniden İnşa Et"
 WESTHEIA_LIT33_BALTIC_rebuild_forts_desc:0 "Bağımsızlık savaşları sırasında, [Root.Capital.GetName] bir şehirden çok bir kaleydi. Tahkimatlar büyük ölçüde sökülmüş ve unutulmuş olsa da, yeniden inşa edilmeli, bakımı yapılmalı ve savaşa hazır hale getirilmelidir."
 WESTHEIA_LIT33_BALTIC_red_army:0 "[Root.GetAdjective] Kızıl Tüfekliler"
 WESTHEIA_LIT33_BALTIC_red_army_desc:0 "Ordumuz, yalnızca [Root.GetNameDef] içinde sosyalizmi savunmaya ve onu dünya halkı arasında yaymaya istekli olanlardan oluşmalıdır ve bu ancak [Root.GetAdjective] Kızıl Tüfeklileri geri getirerek başarılabilir."
 WESTHEIA_LIT33_BALTIC_rejoin_the_railways:0 "Demiryolu Ağını İyileştir"
 WESTHEIA_LIT33_BALTIC_rejoin_the_railways_desc:0 "Kaunas’ı, iç bölgeleri ve Klaipėda limanını birbirine bağlayan demiryolu ağının bakımını ve taşıma kapasitesini geliştirmeliyiz. Mevcut bağlantıların iyileştirilmesi tarımsal ürünlerin pazarlara ulaşmasını kolaylaştıracaktır."
 WESTHEIA_LIT33_BALTIC_renew_allied_trade:0 "[GetBalticRenewAlliedTradeTitle]"
 WESTHEIA_LIT33_BALTIC_renew_allied_trade_alt:0 "Yabancı Yatırımlar Ara"
 WESTHEIA_LIT33_BALTIC_renew_allied_trade_default:0 "Müttefik Ticaretini Yenile"
 WESTHEIA_LIT33_BALTIC_renew_allied_trade_desc:0 "[GetBalticRenewAlliedTradeDesc]"
 WESTHEIA_LIT33_BALTIC_renew_allied_trade_desc_allied:0 "Devletimizin kuruluşundan bu yana Müttefiklere ticaret ve askerî destek için bağımlı olduk ve şimdi bundan vazgeçmek bizim için ahmakça olur. Sınırlarımıza tecavüz eden Almanların ve Rusların saldırısından bir kez daha kurtulacaksak, ulusumuza Müttefik yatırımlarını çekmeliyiz."
 WESTHEIA_LIT33_BALTIC_renew_allied_trade_desc_default:0 "Devletimizin kuruluşundan bu yana İngiliz ticaretine ve askerî desteğine bağımlı olduk ve şimdi bundan vazgeçmek bizim için ahmakça olur. Sınırlarımıza tecavüz eden Almanların ve Rusların saldırısından bir kez daha kurtulacaksak, ulusumuza müttefik yatırımlarını çekmeliyiz."
 WESTHEIA_LIT33_BALTIC_renew_allied_trade_desc_international:0 "Devletimizin kuruluşundan bu yana diğer uluslara ticaret ve askerî destek için bağımlı olduk ve şimdi bundan vazgeçmek bizim için ahmakça olur. Sınırlarımıza tecavüz eden Almanların ve Rusların saldırısından bir kez daha kurtulacaksak, ulusumuza yabancı yatırımlarını çekmeliyiz."
 WESTHEIA_LIT33_BALTIC_request_german_support:0 "[GetBalticAxisInvesmentsAdj] Desteği İste"
 WESTHEIA_LIT33_BALTIC_request_german_support_desc:0 "[GetRequestGermanSupportDesc]"
 WESTHEIA_LIT33_BALTIC_request_german_support_desc_alt:0 "Faşist hamilerimizin endüstriyel kapasitesinden yoksunuz, ancak belki de yetkililerini, Doğu'ya yönelik yaklaşan Komünist tehdide karşı kendimizi daha iyi savunmak için bize fazladan stoklanmış ekipman vermeye ikna edebiliriz."
 WESTHEIA_LIT33_BALTIC_request_german_support_desc_default:0 "Almanya'nın endüstriyel kapasitesinden yoksunuz, ancak belki de Alman yetkilileri, Doğu'ya yönelik yaklaşan Komünist tehdide karşı kendimizi daha iyi savunmak için bize fazladan stoklanmış ekipman vermeye ikna edebiliriz."
 WESTHEIA_LIT33_BALTIC_restore_workers_republic:0 "İşçi Cumhuriyetini Geri Getir"
 WESTHEIA_LIT33_BALTIC_restore_workers_republic_desc:0 "Bağımsızlık mücadelemiz sırasında, Sovyetler bir [Root.GetAdjective] İşçi Cumhuriyeti'nin kurulmasına yardım etti. Cumhuriyet başarısız olsa da, liderleri hem [Root.GetNameDef] hem de [SOV.GetNameDef]'de hayatta kalmaya devam ediyor, bu nedenle işçi cumhuriyeti umudu hala var!"
 WESTHEIA_LIT33_BALTIC_restore_workers_republic_idea:0 "İşçi Cumhuriyeti"
 WESTHEIA_LIT33_BALTIC_restore_workers_republic_idea_1:0 "İşçi Cumhuriyeti"
 WESTHEIA_LIT33_BALTIC_restore_workers_republic_idea_2:0 "İşçi Cumhuriyeti"
 WESTHEIA_LIT33_BALTIC_restore_workers_republic_idea_sov_1:0 "Restore Edilmiş Sovyet Cumhuriyeti"
 WESTHEIA_LIT33_BALTIC_revolutionary_cabinet:0 "Devrimci Bir Kabine"
 WESTHEIA_LIT33_BALTIC_revolutionary_cabinet_desc:0 "Şimdi alt sınıfın yılmaz bekçileri olarak hak ettiğimiz yere geri döndüğümüze göre, yeni devletimizin ideolojisiyle uyumlu bir bakanlar kurulunu yeniden toplayabiliriz."
 WESTHEIA_LIT33_BALTIC_school_of_aviation:0 "Havacılık Eğitimini Genişlet"
 WESTHEIA_LIT33_BALTIC_school_of_aviation_desc:0 "Mevcut havacılık eğitimini geliştirerek daha fazla pilot, gözlemci ve bakım personeli yetiştirmeliyiz. Eğitim ve yer hizmetlerinin güçlenmesi hava kuvvetlerimizin gelişmesini destekleyecektir."
 WESTHEIA_LIT33_BALTIC_school_of_aviation_tech_bonus:0 "Havacılık Okulu"
 WESTHEIA_LIT33_BALTIC_secure_military_support:0 "Askerî Destek Sağla"
 WESTHEIA_LIT33_BALTIC_secure_military_support_desc:0 "Ordudaki birçok kişi ulusu [Root.GetLeader]'den kurtarmak istiyor, tek yapmamız gereken onlara yaklaşmak. Şan ve şöhret arayan bir general, halkın kahramanı olma vaadiyle davamıza kesinlikle çekilecektir."
 WESTHEIA_LIT33_BALTIC_seek_support_of_soviets:0 "Sovyetlerin Desteğini Ara"
 WESTHEIA_LIT33_BALTIC_seek_support_of_soviets_desc:0 "Kızıl Ordu [Root.GetNameDef]'i yerle bir edip ulusumuzu yeni bir Rus emperyalizmi çağına sokmuş olsa da, onların yardımı olmadan [Root.GetNameDef]'e sosyalizmi getirme şansımız yok."
 WESTHEIA_LIT33_BALTIC_sieze_the_means_of_production:0 "Üretim Araçlarına El Koy"
 WESTHEIA_LIT33_BALTIC_sieze_the_means_of_production_desc:0 "Eski hükûmet, [Root.GetAdjective] halkının emeğini sömürmek için denizaşırı yatırımcıları davet etti. Proletaryanın ellerinin yabancı burjuva efendilerine hizmet etmeye devam etmesine izin veremeyiz ve bu çok uluslu şirketler tarafından inşa edilen tüm fabrikalar [Root.GetNameDef]'in velayeti altına alınmalıdır."
 WESTHEIA_LIT33_BALTIC_soviet_equipment:0 "Sovyet Ekipmanı"
 WESTHEIA_LIT33_BALTIC_soviet_equipment_desc:0 "Milislerimizi silahlandırmak için gerekli silah ve malzemelere erişmeden hükûmeti devirmeyi umut edemeyiz. Ruslardan yardım için temas kurarak, eski hükûmet devrimi durdurmaya çalışırsa ordularımızı desteklemek için fazladan silah kazanacağız."
 WESTHEIA_LIT33_BALTIC_soviet_military_staff:0 "Sovyet Askerî Personeli"
 WESTHEIA_LIT33_BALTIC_soviet_military_staff_desc:0 "[Root.GetAdjective] İşçi Cumhuriyeti dağıtıldıktan sonra, askerî personelimiz büyük ölçüde SSCB'ye sürgüne gitti. Eve getirilmeleri gerekiyor."
 WESTHEIA_LIT33_BALTIC_soviet_volunteer_forces:0 "Sovyet Gönüllü Kuvvetleri"
 WESTHEIA_LIT33_BALTIC_soviet_volunteer_forces_desc:0 "SSCB, dünya devrimi için savaşmaya ve ölmeye hazır adamlarla adeta taşıyor. [Root.GetNameDef] komünist bir dünya mücadelesinde sadece bir basamak taşı olsa da, davamız için ölmeye hazır cesur Rus sosyalistlerinin sıkıntısı yok."
 WESTHEIA_LIT33_BALTIC_squash_resistance:0 "Tüm Direnişi Ez"
 WESTHEIA_LIT33_BALTIC_squash_resistance_desc:0 "Hala sosyalizmin [Root.GetAdjective] egemenliğinin düşmanı olduğuna inanan insanlar var ve devrimi ilerleteceksek bu insanlar kökünden sökülmelidir."
 WESTHEIA_LIT33_BALTIC_technology_sharing:0 "Teknoloji Paylaşımı"
 WESTHEIA_LIT33_BALTIC_technology_sharing_desc:0 "Halihazırda ortağımızın birçok ekipmanını üretiyoruz, ancak belki de tasarımlarını inceleyerek yerli [Root.GetNonIdeologyAdjective] tasarımlarını önemli ölçüde geliştirebiliriz."
 WESTHEIA_LIT33_BALTIC_trade_with_neighbors:0 "Komşularla Ticaret Yap"
 WESTHEIA_LIT33_BALTIC_trade_with_neighbors_desc:0 "Almanlara veya Sovyetlere her ticaret yatırımı yaptığımızda, kendi kıyametimize katkıda bulunuyoruz. Düşman birliklerinin erzaklarında Litvanya tahılı ve tanklarında Letonya çeliğinden yapılmış Estonya petrolü ile [Root.GetNonIdeologyName]'i işgal etmesine izin veremeyiz. Bunun yerine ortak düşmanımızı yenmek için birbirimize yardım etmeliyiz."
 WESTHEIA_LIT33_BALTIC_unchain_education:0 "Eğitimimizin Zincirlerini Kır"
 WESTHEIA_LIT33_BALTIC_unchain_education_desc:0 "[Root.GetNonIdeologyAdjective] eğitim sistemi uzun zamandır dağınık nüfus merkezlerimiz tarafından kısıtlanmıştır, ancak şimdi kırsal halkın şehirlere daha yakınlaşmasıyla, [Root.GetNonIdeologyAdjective] gençliğini daha verimli bir şekilde eğitebileceğiz."
 WESTHEIA_LIT33_BALTIC_united_baltic_ssr:0 "Birleşik bir Baltık SSC"
 WESTHEIA_LIT33_BALTIC_united_baltic_ssr_desc:0 "Kültür, dil ve kimlik açısından farklı olsalar da, üç Baltık Devleti arasında uzun zamandır bir kardeşlik ve yoldaşlık vardır. Komşularımızın da diğer [Root.GetAdjective]ler kadar yoldaş olduğu kabul edilmelidir ve tek bir işçi cumhuriyetinde birleşmezsek işçiler sadece kaybeder."
 WESTHEIA_LIT33_BALTIC_western_revolution:0 "Devrimi Batı'ya Taşı"
 WESTHEIA_LIT33_BALTIC_western_revolution_desc:0 "Devrim Baltık'ta durmuyor. Neredeyse tüm Avrupa'nın alt sınıfları, kapitalizmin katı çizmeleri altında fabrikalarda köle gibi çalışıyor ve onları yalnızca [Root.GetAdjective] işçileri kurtarabilir."
 WESTHEIA_LIT33_LIT_POL_union:0 "Milletler Topluluğu'nu Geri Getir"
 WESTHEIA_LIT33_LIT_POL_union_desc:0 "[Root.GetLeader]'in hem Polonya hem de Litvanya Kralı olmasıyla, geriye kalan tek şey Seimas'ı Sejm ile bir kez daha birleştirmek ve Polonya-Litvanya Milletler Topluluğu yeniden doğmuş olacak."
 WESTHEIA_LIT33_LIT_a_corporatist_economy:0 "Korporatist Bir Ekonomi"
 WESTHEIA_LIT33_LIT_a_corporatist_economy_desc:0 "Batı, Litvanya devleti içinde hızlı bir ekonomik liberalizm bekliyor. Ancak Antanas Smetona, korporatist bir modelin getirdiği kontrol ve merkezileşmeyi çok daha fazla tercih ediyor."
 WESTHEIA_LIT33_LIT_a_king_for_our_people:0 "Halkımız İçin Bir Kral"
 WESTHEIA_LIT33_LIT_a_king_for_our_people_desc:0 "Antanas Smetona tek başına Litvanya'yı yönetemez ve birçok kişi Cumhurbaşkanının bir Başbakan atamasını beklerken, başka bir seçenek daha var. Karl Gero von Urach, Mindaugas II'nin meşru oğludur ve artık Litvanya'nın başı üzerinde Alman yönetimi kefeni olmadığına göre, Kralımızı taçlandırmamızı engelleyen hiçbir şey yoktur."
 WESTHEIA_LIT33_LIT_a_martial_prime_minister:0 "Asker Kökenli Bir Başbakan"
 WESTHEIA_LIT33_LIT_a_martial_prime_minister_desc:0 "Başbakanlık makamı genellikle seçilmiş bir siyasi yetkili tarafından doldurulur, ancak bu savaş zamanlarında ve Cumhurbaşkanının artan yetkileriyle, [ROOT.GetLeader]'in sağ kolu olacak güçlü bir lider seçmeliyiz!"
 WESTHEIA_LIT33_LIT_a_new_noble_class:0 "Yeni Bir Soylu Sınıfı"
 WESTHEIA_LIT33_LIT_a_new_noble_class_desc:0 "Ulusumuz çok uzun zamandır politikacılar ve oligarklar tarafından yönetildi. Kralın Litvanya'ya hizmet edebilmesi için, başkanlık edeceği sadık bir soyluluk mahkemesine sahip olması gerekir."
 WESTHEIA_LIT33_LIT_a_priestly_prime_minister:0 "Rahip Kökenli Bir Başbakan"
 WESTHEIA_LIT33_LIT_a_priestly_prime_minister_desc:0 "Eski konsey üyesi ve şimdi bir rahip olan Vladas Mironas, Ulusal Parti'yi Başbakanı olarak temsil etmek için ideal bir adaydır. Katolik kilisesindeki konumu ve köylülüğe ve tarıma olan bağlılığı, onu Litvanyalı alt sınıflar arasında popüler bir aday yapıyor."
 WESTHEIA_LIT33_LIT_abolish_the_presidency:0 "Cumhurbaşkanlığını Kaldır"
 WESTHEIA_LIT33_LIT_abolish_the_presidency_desc:0 "Şimdiye kadar Smetona ulusun yönetimini elinde tuttu, ancak Mindaugas III'ün artan popülaritesi ile Cumhurbaşkanlığı makamının kaldırılması ve Kralın mutlak yönetimiyle değiştirilmesi ihtiyatlı görünüyor. Smetona, genç Mindaugas III'e danışmanı olarak hizmet ederek Başbakanlık görevine çekilecektir."
 WESTHEIA_LIT33_LIT_anti_communist_militia:0 "Anti-Komünist Milisler"
 WESTHEIA_LIT33_LIT_anti_communist_militia_desc:0 "Ulusumuzu solcu unsurlardan arındırmak bizim hırsımızdır ve neyse ki ülke genelinde hırsımızı paylaşan gönüllüler zaten var. Tek yapmamız gereken bu sol karşıtı örgütleri desteklemek ve onlar bizim için Sovyetlere karşı koruma işinin tamamını yapacaklar!"
 WESTHEIA_LIT33_LIT_appease_nazis:0 "Almanları Yatıştır"
 WESTHEIA_LIT33_LIT_appease_nazis_desc:0 "Savaşa hazırlanmak için her türlü çabayı göstermiş olsak da, Litvanyalıların hayatlarını korumak için yenilgiyi kabul etmeliyiz."
 WESTHEIA_LIT33_LIT_appease_soviets:0 "Rusları Yatıştır"
 WESTHEIA_LIT33_LIT_appease_soviets_desc:0 "Savaşa hazırlanmak için her türlü çabayı göstermiş olsak da, Litvanyalıların hayatlarını korumak için yenilgiyi kabul etmeliyiz."
 WESTHEIA_LIT33_LIT_arm_monarchist_militants:0 "Monarşist Militanları Silahlandır"
 WESTHEIA_LIT33_LIT_arm_monarchist_militants_desc:0 "Sınırlarımızın ötesinde [Root.GetLeader]'in uluslarına düzen ve refah getirmesini isteyenler olduğunu biliyoruz, tıpkı [Root.GetLeader.GetSheHe]'nin bizim için yaptığı gibi! Bu monarşist militanları silahlandırmaya istekli olmalıyız ki, haklı hükümdarlarını tahtlarına getirmek için savaşabilsinler."
 WESTHEIA_LIT33_LIT_arrest_nazis_in_memel:0 "Memel'deki Nazileri Tutukla"
 WESTHEIA_LIT33_LIT_arrest_nazis_in_memel_desc:0 "Memel, Naziler ve faşist sempatizanlarıyla dolu ve bu durum bir Alman işgali için bir emsal oluşturuyor. Memel bölgesini elimizde tutmak istiyorsak, Nazi partisi üyeliğini hapisle cezalandırılan bir suç haline getirmeli ve olası bir Nazi işgaline karşı yeterli hazırlıkları yapmalıyız."
 WESTHEIA_LIT33_LIT_baltic_defence_army:0 "Baltık Savunma Ordusu"
 WESTHEIA_LIT33_LIT_baltic_defence_army_desc:0 "Silahlı kuvvetlerimiz birlikte çalışıyor ancak esasen ayrı varlıklar. Uluslarımız arasındaki bağlar güçlendikçe, aynı anda hiçbir Baltık Devleti tarafından kontrol edilmeyen ancak hepsinin bir müttefiki olan ayrı bir varlık olan Birleşik Baltık Silahlı Kuvvetleri'ni kurabiliriz."
 WESTHEIA_LIT33_LIT_baltic_economic_union:0 "Baltık Ekonomik Birliği"
 WESTHEIA_LIT33_LIT_baltic_economic_union_desc:0 "Şimdi liberal demokrasi ulusumuza geri döndüğüne ve komşularımızla yakın diplomatik bağlar kurduğumuza göre, diğer Baltık Devletleriyle bir ekonomik birliğe girmek mantıklı. Ekonomilerimiz küçük olsa da, birlikte güçlenebilirler!"
 WESTHEIA_LIT33_LIT_baltic_stronger_together:0 "Birleşik ama Ayrı"
 WESTHEIA_LIT33_LIT_baltic_stronger_together_desc:0 "Baltık Devletleri arasında uzun zamandır bir kardeşlik ve yoldaşlık duygusu var, ama her zaman sınırlar ve siyasetle ayrıldık. Bağımsızlığımızı koruma isteğimizle diplomatik olarak birbirimize bağlıyız ve bu yüzden dostlarımız için savaşmaya ve birleşik Baltık silahlı kuvvetlerini genişletmeye kararlı olmalıyız!"
 WESTHEIA_LIT33_LIT_baltic_unification:0 "Baltık Birleşmesi"
 WESTHEIA_LIT33_LIT_baltic_unification_desc:0 "Baltık Devletleri arasında uzun zamandır bir kardeşlik ve yoldaşlık duygusu var, ama her zaman sınırlar ve siyasetle ayrıldık. Bağımsız kimliklerimiz güçlü olsa da, varlığımızı korumak için savaşma isteğimiz bizi birbirimize bağlıyor. Belki de Baltık Birliği'nin kendi başına bir ulusa dönüşme zamanı gelmiştir."
 WESTHEIA_LIT33_LIT_beyond_the_baltic:0 "[Root.Get_Beyond_Baltic_Focus_Loc]"
 WESTHEIA_LIT33_LIT_beyond_the_baltic_desc:0 "[Root.Get_Beyond_Baltic_Focus_desc_Loc]"
 WESTHEIA_LIT33_LIT_claim_greater_lithuania:0 "Büyük Litvanya Üzerinde Hak İddia Et"
 WESTHEIA_LIT33_LIT_claim_greater_lithuania_desc:0 "Bugün bildiğimiz Litvanya, ondan önce gelen Litvanya Büyük Dükalığı'nın sadece bir gölgesidir. Milletler Topluluğu, sadece Polonya ve Litvanya'nın bir birliğinden daha fazlasını, Polonyalıların, Litvanyalıların, Ukraynalıların ve Belarusluların bir birliğini tanımlar."
 WESTHEIA_LIT33_LIT_claim_lithuania_minor:0 "Aşağı Litvanya Üzerinde Hak Talep Et"
 WESTHEIA_LIT33_LIT_claim_lithuania_minor_desc:0 "Almanların yanlış bir şekilde “Königsberg” olarak adlandırdığı bölge aslında Litvanyalıların ata yurdudur. Küçük Litvanya, Baltık Haçlı Seferleri'nden beri Almanların işgali altında varlığını sürdürmüştür ve geri alınmalıdır."
 WESTHEIA_LIT33_LIT_claim_livonia:0 "Livonya Üzerinde Hak İddia Et"
 WESTHEIA_LIT33_LIT_claim_livonia_desc:0 "Kuzeyde yüzyıllardır bağımsızlık görmemiş iki genç devlet var. Kesinlikle Litvanya'nın elleri tarafından daha iyi yönlendirilirlerdi..."
 WESTHEIA_LIT33_LIT_claim_livonia_monarchy:0 "Livonya Üzerinde Hak İddia Et"
 WESTHEIA_LIT33_LIT_claim_livonia_monarchy_desc:0 "Baltık ulusları arasında kırılmaz bir kardeşlik ve yoldaşlık duygusu vardır ve şimdi tahtımızda bir Kral olduğuna göre, bu kardeşlik duygusunu ilahi hakkımız olarak talep etme hakkımız vardır."
 WESTHEIA_LIT33_LIT_claim_prussia:0 "Doğu Prusya'yı Ele Geçir"
 WESTHEIA_LIT33_LIT_claim_prussia_desc:0 "Doğu Prusya, sayısız Litvanyalı ve Polonyalı azınlığa ev sahipliği yapmaktadır ve bu adamların [Root.GetNameDef]'deki yoldaşlarıyla birleşme zamanı gelmiştir."
 WESTHEIA_LIT33_LIT_defence_from_above:0 "Yukarıdan Savunma"
 WESTHEIA_LIT33_LIT_defence_from_above_desc:0 "Eğer düşman onları gökyüzünden bombalamaya devam ederse tahkimatlarımız tamamen işe yaramaz. Bir savunma hazırlamalı ve yukarıdan atılan her bomba ve mermi için havaya ateşle karşılık vermeliyiz."
 WESTHEIA_LIT33_LIT_demand_vilnius:0 "Vilnius'u Talep Et"
 WESTHEIA_LIT33_LIT_demand_vilnius_desc:0 "Çok uzun zamandır geleneksel Litvanya başkenti Polonya'daki düşmanlarımız tarafından tutuldu ve hükûmetimiz bu konuda bir şey yapamayacak kadar zayıf iradeliydi, ama artık değil. Vilnius tekrar Litvanyalı olacak!"
 WESTHEIA_LIT33_LIT_enforce_military_rule:0 "Askerî Yönetimi Uygula"
 WESTHEIA_LIT33_LIT_enforce_military_rule_desc:0 "Litvanya, bağımsızlık mücadelesinde yalnız değildir. Letonya ve Estonya da bizimkiyle aynı düşmanlarla çevrili, ancak hükûmetleri halklarını savunmak için gerekli olanı yapacak omurgadan yoksun. Tüm Baltık'ta ordunun yönetimini uygulamalıyız."
 WESTHEIA_LIT33_LIT_exile_voldemares:0 "Voldemaras'ı Sürgün Et"
 WESTHEIA_LIT33_LIT_exile_voldemares_desc:0 "Augustinas Voldemaras güvenli bir şekilde parmaklıklar ardındayken, Demir Kurt'un havlamasının ısırığı olmayacağını düşünebilirsiniz, ancak örgütü hala onun serbest bırakılması için ajitasyon yapıyor ve ulus için aktif bir tehdit oluşturuyor. Eğer Voldemaras serbest bırakılır ancak bir daha asla Litvanya'ya girmesi yasaklanırsa, Demir Kurt hareketi kaçınılmaz olarak ivme kaybedecek ve biz de onların oluşturduğu tehditten kurtulacağız."
 WESTHEIA_LIT33_LIT_expand_lithuanian_shipyards:0 "Litvanya Tersanelerini Genişlet"
 WESTHEIA_LIT33_LIT_expand_lithuanian_shipyards_desc:0 "Polonya'nın kontrolümüz altında olmasıyla, deniz kapasitemizi büyük ölçüde genişletme ve Baltık Denizi'nde hakimiyet için rekabet etme fırsatı verildi."
 WESTHEIA_LIT33_LIT_expand_military_budget:0 "Askerî Bütçeyi Genişlet"
 WESTHEIA_LIT33_LIT_expand_military_budget_desc:0 "Ordu mensupları arasındaki yaygın bir şikayet, sivil hükûmet içinde çalışanlara kıyasla nispeten düşük maaşlarıdır. Raštikis'in Başbakanlık makamını işgal etmesiyle, orduya ihtiyaç duyduğu bütçeyi verme zamanı geldi."
 WESTHEIA_LIT33_LIT_exploit_the_international_bank:0 "Uluslararası Bankayı Sömür"
 WESTHEIA_LIT33_LIT_exploit_the_international_bank_desc:0 "Uluslararası Banka'nın bir üyesi olarak Antanas Smetona, devletin yararına bankacılık sektörünü sömürmek için birinci sınıf bir konumdadır. Bu yaklaşan savaş zamanlarında başka ne seçeneğimiz var?"
 WESTHEIA_LIT33_LIT_formalize_baltic_entente:0 "[Root.Get_Baltic_Entente_Focus_Loc]"
 WESTHEIA_LIT33_LIT_formalize_baltic_entente_desc:0 "[Root.Get_Baltic_Entente_Focus_desc_Loc]"
 WESTHEIA_LIT33_LIT_fortify_memel:0 "Memel'i Tahkim Et"
 WESTHEIA_LIT33_LIT_fortify_memel_desc:0 "Almanlara Litvanya egemenliğini savunmaları konusunda, bir tilkiye bir kümese bekçilik etmesi konusunda güvenilebileceğinden daha fazla güvenilemez! [GER.GetLeader] Litvanya devletinin bir düşmanıdır ve Memel'in bizi Alman saldırganlığı için bir hedef haline getirdiği sır değildir!"
 WESTHEIA_LIT33_LIT_free_voldemares:0 "Voldemaras'ı Serbest Bırak"
 WESTHEIA_LIT33_LIT_free_voldemares_desc:0 "Belki de Smetona eski Başbakanını tutuklamakta çok aceleci davrandı. Voldemaras açıkça Litvanya bağımsızlığının bir dostudur ve onun becerilerini ve sadık kamuoyu desteğini hükûmetimiz içinde kullanmamak aptallık olur."
 WESTHEIA_LIT33_LIT_greater_commonwealth:0 "Büyük Milletler Topluluğu"
 WESTHEIA_LIT33_LIT_greater_commonwealth_desc:0 "Milletler Topluluğu'nun hırsları, uzun zamandır kaybolmuş Krallığın sadece tarihi sınırlarının çok ötesine uzanıyor. Polonyalıların kalbindeki Milletler Topluluğu, büyük bir emperyal güç, denizden denize parlayan çok kültürlü bir imparatorluktur!"
 WESTHEIA_LIT33_LIT_indivisible_power_of_the_state:0 "Devletin Bölünmez Gücü"
 WESTHEIA_LIT33_LIT_indivisible_power_of_the_state_desc:0 "Ben devletim, devlet benim. Diktatörlüğün yasaları ve kuralları sağlam bir şekilde kurulduğuna göre, geriye kalan tek şey diktatörün gücünün mutlak olmasını sağlamaktır. Bazıları demokrasiye dönmeyi arzulasa da, ayı ve kartalın toplu nefesi Litvanya'nın ensesindeyken bunun tehlikeli ve ahmakça bir fikir olduğunu biliyoruz."
 WESTHEIA_LIT33_LIT_infiltrate_homeland:0 "[Root.Get_Covert_Resistance_Focus_Loc]"
 WESTHEIA_LIT33_LIT_infiltrate_homeland_desc:0 "[Root.Get_Covert_Resistance_Focus_desc_Loc]"
 WESTHEIA_LIT33_LIT_institute_royal_guards:0 "Kraliyet Muhafızlarını Kur"
 WESTHEIA_LIT33_LIT_institute_royal_guards_desc:0 "Tahtta oturan bir hükümdar varken, sevgili hükümdarımızın kişisel korunmasıyla görevlendirilecek Litvanya ordusu saflarındaki en seçkinleri bulmamız hayati önem taşımaktadır."
 WESTHEIA_LIT33_LIT_integrate_the_opposition:0 "Muhalefeti Entegre Et"
 WESTHEIA_LIT33_LIT_integrate_the_opposition_desc:0 "Antanas Smetona eski hükûmeti beceriksiz politikacılar ve Sovyet sempatizanlarından oluşan bir kabine olarak görse de, saflarında bir dizi yetkin adam olduğunu inkar etmek zordur ve onları yeni Seimas'ta kullanmamak aptallık olur."
 WESTHEIA_LIT33_LIT_invade_poland:0 "Polonya'yı İşgal Et"
 WESTHEIA_LIT33_LIT_invade_poland_desc:0 "Yüzyıllar boyunca Litvanya, Polonya'nın gücün çoğunluğunu elinde tuttuğu sözde bir “Milletler Topluluğu” içinde zincirlenmişti. Polonyalılar bu duruma geri dönmek için susamışlardı ve belki de onlara arzuladıkları Milletler Topluluğu'nu verme zamanı gelmiştir."
 WESTHEIA_LIT33_LIT_join_the_allies:0 "Müttefiklere Katıl"
 WESTHEIA_LIT33_LIT_join_the_allies_desc:0 "[Root.Get_Join_Allies_Focus_desc_Loc]"
 WESTHEIA_LIT33_LIT_king_of_poland:0 "Polonya Krallığı"
 WESTHEIA_LIT33_LIT_king_of_poland_desc:0 "Zamanı geldi; Polonya halkı [POL.GetLeader]'e karşı kışkırtıldı ve monarşist destekçiler hükûmete taleplerini iletmeye hazır. Litvanya desteğiyle, [Root.GetLeader]'i Tanrı tarafından atanmış hükümdarları olarak görecekler."
 WESTHEIA_LIT33_LIT_lithuanian_activist_front:0 "Milliyetçi Örgütlenmeyi Güçlendir"
 WESTHEIA_LIT33_LIT_lithuanian_activist_front_desc:0 "Milliyetçi çevreleri ortak bir siyasi program etrafında örgütleyerek hareketimizin halk ve devlet kurumları içindeki etkisini artırmalıyız. Yeni bir örgütlenme, mevcut yönetimin çizgisinden ayrılan güçleri bir araya getirebilir."
 WESTHEIA_LIT33_LIT_lithuanian_preservationism:0 "Litvanya Korumacılığı"
 WESTHEIA_LIT33_LIT_lithuanian_preservationism_desc:0 "Litvanya Cumhuriyeti genç ve hala dünyadaki yerini bulmaya çalışıyor. Birçoğu onun Komünizme, Faşizme veya Liberalizme boyun eğdiğini görmek ister, ancak bu yabancı nüfuzlara boyun eğme dürtüsünden kaçınmalıyız. Gerçekten bağımsız bir Litvanya, yolunu yalnız bulmalıdır."
 WESTHEIA_LIT33_LIT_lithuanian_rail:0 "Polonya-Litvanya Demiryolları"
 WESTHEIA_LIT33_LIT_lithuanian_rail_desc:0 "Eğer Polonya ve Litvanya gerçekten birleşecekse, birlik arasındaki seyahat önemsiz bir mesele olmalıdır. Demiryollarımızı birleştirerek, tedarik zincirlerimizi ve endüstriyel kapasitemizi büyük ölçüde geliştireceğiz."
 WESTHEIA_LIT33_LIT_lithuanian_youth:0 "Demir Kurt Gençliği"
 WESTHEIA_LIT33_LIT_lithuanian_youth_desc:0 "Ordunun adamlara ihtiyacı var, ama bu ideoloji zamanlarında, oğlanlarımızın kafasına vatansever fikirler ekmeliyiz ki, yeterince büyüdüklerinde, tek ihtiyaçları olan bir tüfek olsun ve tek bir karış Litvanya toprağı için seve seve ölsünler."
 WESTHEIA_LIT33_LIT_look_north:0 "[Root.Get_Look_North_Focus_Loc]"
 WESTHEIA_LIT33_LIT_look_north_desc:0 "[Root.Get_Look_North_Focus_desc_Loc]"
 WESTHEIA_LIT33_LIT_martial_law:0 "Sıkıyönetim"
 WESTHEIA_LIT33_LIT_martial_law_desc:0 "Özgürlük, barışın tadını çıkaran uluslara tanınan bir lükstür, ancak etrafımızdaki düşmanlarla Litvanya böyle bir lüksün tadını çıkaramaz."
 WESTHEIA_LIT33_LIT_merge_civilian_industries:0 "Sivil Sanayileri Birleştir"
 WESTHEIA_LIT33_LIT_merge_civilian_industries_desc:0 "Uluslarımız artık birleştiğine göre, Litvanya'nın sadece Litvanya için ve Polonya'nın sadece Polonya için inşa etmesi pek mantıklı değil. Sanayilerimiz, ulusun iyiliği için bir olmalıdır."
 WESTHEIA_LIT33_LIT_merge_the_arms_industries:0 "Silah Sanayilerini Birleştir"
 WESTHEIA_LIT33_LIT_merge_the_arms_industries_desc:0 "Polonyalı ve Litvanyalı silah üreticileri on yıllardır ayrı ayrı silah üretiyorlardı, ancak şimdi uluslarımız bir olduğuna göre, sanayilerimizi uzmanlaştırma ve Polonyalı ve Litvanyalı fabrikalar arasında işbirliği yaratma fırsatımız var."
 WESTHEIA_LIT33_LIT_merge_the_military_and_civilian_governments:0 "Askerî ve Sivil Hükûmetleri Birleştir"
 WESTHEIA_LIT33_LIT_merge_the_military_and_civilian_governments_desc:0 "Ordu ile Cumhurbaşkanı arasında paylaşılan güç bir süre için yararlıydı, ancak Smetona hızla kullanışlılığını yitiriyor. Sadece acil durum yetkilerinin orduya devri Litvanya'nın devam eden güvenliğini sağlayabilir."
 WESTHEIA_LIT33_LIT_new_kind_of_iron_wolf:0 "Yeni Bir Tür Demir Kurt"
 WESTHEIA_LIT33_LIT_new_kind_of_iron_wolf_desc:0 "Demir Kurt tehdidi artık ortadan kalktığına göre, ulusal sembolümüzü geri alabilir ve silahlı kuvvetlerimiz boyunca gururla sergileyebiliriz."
 WESTHEIA_LIT33_LIT_occupation:0 "İşgal"
 WESTHEIA_LIT33_LIT_occupation_desc:0 "Bizim için çok geç. Ülke, her an bize karşı dönebilecek düşman askerleriyle dolu. Belki de liderlerimizin ve hükûmetimizin istifa etme ve düşmanlarımızın bizimle istediklerini yapmalarına izin verme zamanı gelmiştir."
 WESTHEIA_LIT33_LIT_occupation_tt:0 "§Y[LIT.GetNameDef]§! §Y$LIT_occupation$'yi tamamladığı için efektler:"
 WESTHEIA_LIT33_LIT_offer_military_basing:0 "Üs Hakları Teklif Et"
 WESTHEIA_LIT33_LIT_offer_military_basing_desc:0 "İstediğimiz son şey başka bir savaş. Litvanya hem Almanlar hem de Sovyetler için stratejik bir ilgi sunuyor ve bu yüzden belki de ulusumuzun içinde erişim ve üs hakları ile sığınak inşa etme ve kullanma imkânı sunarak işgalden kaçınabiliriz."
 WESTHEIA_LIT33_LIT_offer_military_basing_tt_1:0 "§GKimin yatıştırıldığına bağlı olarak:§!\n"
 WESTHEIA_LIT33_LIT_offer_military_basing_tt_2:0 "§RVEYA§!\n"
 WESTHEIA_LIT33_LIT_organize_the_iron_wolf:0 "Demir Kurt'u Organize Et"
 WESTHEIA_LIT33_LIT_organize_the_iron_wolf_desc:0 "Demir Kurt dağınık ve düzensiz kalmaya devam ediyor ve Voldemaras'ın kendisi gibi, hükûmeti destekleyip desteklemeyecekleri veya onu devirmek isteyip istemedikleri konusunda kararsızlar. Demir Kurt'a kesin bir vizyon ve hedef sağlayarak, bu kayıp çocuklardan adamlar yaratacağız."
 WESTHEIA_LIT33_LIT_pan_baltic_bank:0 "Pan-Baltık Bankası"
 WESTHEIA_LIT33_LIT_pan_baltic_bank_desc:0 "Ekonomik birlik artık yürürlükte olduğuna göre, pan-Baltık bir banka ve ortak bir para birimi kurma olasılığımız var."
 WESTHEIA_LIT33_LIT_patriotic_education:0 "Vatansever Eğitim"
 WESTHEIA_LIT33_LIT_patriotic_education_desc:0 "Litvanya'daki eğitim sektörü daha iyi günler gördü, ancak fikirlerin gençlerimiz arasında başıboş dolaşmasına izin veremeyiz. Gençler, Rytas gibi iyi kurumlarda vatansever Litvanyalı Katolikler olarak düzgün bir şekilde eğitilmelidir."
 WESTHEIA_LIT33_LIT_patriotic_education_idea:0 "Vatansever Eğitim"
 WESTHEIA_LIT33_LIT_patriotic_socialism:0 "Vatansever Sosyalizm"
 WESTHEIA_LIT33_LIT_patriotic_socialism_desc:0 "Demokratik hükûmet büyük ölçüde Sosyal Demokratlar ve merkezcilerden oluşuyordu ve sosyalizm idealleri Litvanyalı işçilerin zihinlerini kirletiyor. Kazys Grinius açıkça bir sosyalist olsa da, vatansever ruhunu inkar etmek mümkün değil ve belki de onun bazı fikirlerini uygulayarak Litvanyalı işçi hem daha üretken hem de Diktatörlüğe daha destekleyici olabilir."
 WESTHEIA_LIT33_LIT_patriotic_socialism_idea:0 "Vatansever Sosyalizm"
 WESTHEIA_LIT33_LIT_peace_with_poland:0 "Polonya ile Barış"
 WESTHEIA_LIT33_LIT_peace_with_poland_desc:0 "Resmî olarak, Polonya ile Litvanya arasındaki savaş on yıllardır sürüyor, ancak savaşın büyük bir bölümünde iki taraf da çatışmaya girmedi. Vilnius hala onların elinde olmasına rağmen, Doğu ve Batı'daki gerçek düşmanlarımıza odaklanmak için bu çıkmazı resmî bir barışa dönüştürmeliyiz."
 WESTHEIA_LIT33_LIT_peasants_reform:0 "Köylü Reformu"
 WESTHEIA_LIT33_LIT_peasants_reform_desc:0 "Köylülük, ekonomik zenginliğimizin çoğunluğunu oluşturmalarına rağmen Litvanya'nın en fakir insanları arasındadır. Vladas Mironas'ın Başbakan ve tarım şefi olmasıyla, köylü sınıfımıza çok daha iyi yaşam koşulları sağlayabiliriz."
 WESTHEIA_LIT33_LIT_prepare_forest_brothers:0 "[Root.Get_Forest_Focus_Loc]"
 WESTHEIA_LIT33_LIT_prepare_forest_brothers_desc:0 "[Root.Get_Forest_Focus_desc_Loc]"
 WESTHEIA_LIT33_LIT_prepare_resistance:0 "[Root.Get_Ready_Resistance_Focus_Loc]"
 WESTHEIA_LIT33_LIT_prepare_resistance_desc:0 "[Root.Get_Ready_Resistance_Focus_desc_Loc]"
 WESTHEIA_LIT33_LIT_presidential_reform:0 "1938 Anayasasını Yürürlüğe Koy"
 WESTHEIA_LIT33_LIT_presidential_reform_desc:0 "Yeni anayasa cumhurbaşkanlığının devlet içindeki üstün konumunu pekiştirecektir. Hükümetin cumhurbaşkanına karşı sorumluluğunu belirginleştirerek yürütme yetkilerini daha merkezi bir düzende toplamalıyız."
 WESTHEIA_LIT33_LIT_proclaim_greater_lithuania:0 "Büyük Litvanya'yı İlan Et"
 WESTHEIA_LIT33_LIT_proclaim_greater_lithuania_desc:0 "Litvanya bir zamanlar Avrupa'nın en büyük güçlerinden biriydi, ancak yüzyıllar önce Polonyalılar tarafından kesilip hadım edildiğimizden beri eski ihtişamımızı geri getiremedik, ama artık değil. Litvanya bir kez daha Avrupa'nın en büyük gücü olacak!"
 WESTHEIA_LIT33_LIT_propose_baltic_union:0 "Bir Baltık Birliği Öner"
 WESTHEIA_LIT33_LIT_propose_baltic_union_desc:0 "Uluslarımız arasında artık tüm bu farklı varlıklar iç içe geçmişken, resmî bir Baltık Birliği'nin kurulması kaçınılmaz görünüyor. Birlik, tüm üye uluslara birlik içinde oy ve veto hakkı tanıyacak ve uluslarımızı daha da yakınlaştıracaktır."
 WESTHEIA_LIT33_LIT_purge_popular_resistance:0 "Halk Direnişini Temizle"
 WESTHEIA_LIT33_LIT_purge_popular_resistance_desc:0 "Halkımız arasında Smetona'ya ve diktatörlüğüne karşı çıkacak haydut unsurlar var. Bu insanlar Litvanya bağımsızlığının düşmanıdır ve ulusumuzun devam eden istikrarını ve hayatta kalmasını sağlamak için ortadan kaldırılmalıdır."
 WESTHEIA_LIT33_LIT_push_for_ruthenia:0 "Ruthenia Boyunca İlerle"
 WESTHEIA_LIT33_LIT_push_for_ruthenia_desc:0 "Ukrayna ve Belarus'un demiryolu ağları ne yazık ki ihmal edildi, ancak bu topraklar da Milletler Topluluğu'nun diğerleri kadar bir parçasıdır. Sovyetlerin içinden geçip bizim olanı geri alacaksak, Doğu raylarına yatırım yapmalıyız."
 WESTHEIA_LIT33_LIT_rapid_fortifications_in_the_east:0 "Doğuda Hızlı Tahkimatlar"
 WESTHEIA_LIT33_LIT_rapid_fortifications_in_the_east_desc:0 "Devam eden bağımsızlığımıza yönelik en acil tehdidin komünistler olduğu açıktır ve ulusumuzu onların oluşturduğu tehditten korumak için elimizden gelen her şeyi yapmalıyız."
 WESTHEIA_LIT33_LIT_rastikis_military_reforms:0 "Rastikis'in Askerî Reformları"
 WESTHEIA_LIT33_LIT_rastikis_military_reforms_desc:0 "Ordu, başka bir Alman işgalinin getireceği büyüklükte ve ciddiyette bir tehditle yüzleşmeye hazırlıksızdır ve hükûmetin askerî kanadının Litvanya ordusunun vatansever adamlarına yetkin bir liderlik getirmesi hayati önem taşımaktadır."
 WESTHEIA_LIT33_LIT_reminder_of_true_enemy:0 "Gerçek Düşmanın Hatırlatıcısı"
 WESTHEIA_LIT33_LIT_reminder_of_true_enemy_desc:0 "1918 savaşı sırasında Kızıl Ordu ve Freikorps tarafından acımasız bir baskıya maruz kaldık ve ufukta savaş belirirken, bu anıların acı sızısı Litvanyalı bakanların zihinlerini yakıyor. Gecikemeyiz, bu güçlerden hangisinin en büyük tehdidimiz olduğuna karar vermeli ve savaşa yeterli hazırlıkları yapmalıyız!"
 WESTHEIA_LIT33_LIT_request_polish_occupation:0 "Polonya İşgali Talep Et"
 WESTHEIA_LIT33_LIT_request_polish_occupation_desc:0 "Son birkaç on yıldır, Litvanya'yı içermeyen bir Polonya devleti fikri düşünülemez olarak tanımlandı ve Litvanya egemenliği çağdaş Polonyalı politikacılar için bir şaka gibi bir şeydi, bu yüzden belki de acınası uluslarının bir Litvanya işgaliyle tamamen tatmin olurlardı."
 WESTHEIA_LIT33_LIT_restore_greater_lithuania:0 "Büyük Litvanya'yı Geri Getir"
 WESTHEIA_LIT33_LIT_restore_greater_lithuania_desc:0 "Doğu'da sayısız işbirlikçi şimdi bizim adımıza görev almaya hevesliyken, geriye kalan tek şey yerel yönetimleri sadıklarla doldurmak ve Ruthenia üzerinde yeni bir Litvanya hakimiyeti dönemini ilan etmektir!"
 WESTHEIA_LIT33_LIT_restore_order:0 "Düzeni Geri Getir"
 WESTHEIA_LIT33_LIT_restore_order_desc:0 "Çok uzun zaman önce, Litvanya sözde “Milletler Topluluğu”nda daha büyük bir ortaktı ve Polonya sınırımızda ince bir devlet şeridinden başka bir şey değildi. Dünyayı olması gerektiği gibi yeniden kurmanın zamanı geldi."
 WESTHEIA_LIT33_LIT_restore_public_elections:0 "Halk Seçimlerini Geri Getir"
 WESTHEIA_LIT33_LIT_restore_public_elections_desc:0 "Litvanya üzerindeki diktatörlük yönetimi bir süre için yararlı oldu, ancak devlet şimdi istikrara kavuştuğuna göre, halk duyulmayı hak ediyor. Litvanyalı olmanın ne anlama geldiği konusunda kendi aramızda tartıştık, ama belki de halka sormalıyız."
 WESTHEIA_LIT33_LIT_root_out_the_iron_wolf:0 "Demir Kurt'u Kökünden Sök"
 WESTHEIA_LIT33_LIT_root_out_the_iron_wolf_desc:0 "Voldemaras'ı sürgün etmek, Demir Kurt'un hükûmeti devirme çabalarını durdurmuş olsa da, örgüt hala var ve bu adamlar Litvanya ordusu için istikrarlı bir gelecek sağlamak amacıyla siyasi olarak çok uzaklara itilmelidir."
 WESTHEIA_LIT33_LIT_secure_a_loyal_cabinet:0 "Tūbelis Hükümetini Güçlendir"
 WESTHEIA_LIT33_LIT_secure_a_loyal_cabinet_desc:0 "Başbakan Juozas Tūbelis’in hükümeti ekonomik bunalım ve siyasi muhalefet karşısında yönetimin sürekliliğini sağlamalıdır. Cumhurbaşkanı Smetona ile kabine arasındaki iş birliğini güçlendirerek devletin hareket alanını genişletebiliriz."
 WESTHEIA_LIT33_LIT_seek_ties_with_germany:0 "Almanya ile Bağlantı Kur"
 WESTHEIA_LIT33_LIT_seek_ties_with_germany_desc:0 "Resmî olarak Litvanya devletinin bir düşmanı olmasına rağmen, Almanya düşmanımızı paylaşıyor; Polonya. Almanlarla temas kurarak, belki de şu anda Polonyalılar tarafından işgal edilen kayıp Litvanyalı kardeşlerimizi geri alabiliriz."
 WESTHEIA_LIT33_LIT_soviet_mutual_assistance:0 "[SOV.GetAdjective] Karşılıklı Yardımlaşma"
 WESTHEIA_LIT33_LIT_soviet_mutual_assistance_desc:0 "Polonya hem Sovyetlerin hem de Almanların birincil hedefidir ve bunu herkes bilir. İki güç arasında Polonya'yı paylaşma planları olduğuna dair fısıltılar duyduk ve belki de Sovyetleri, Vilnius'un hak sahiplerine iadesi karşılığında çabalarında Litvanya desteği aramaya ikna edebiliriz."
 WESTHEIA_LIT33_LIT_state_media:0 "Devlet Medyası"
 WESTHEIA_LIT33_LIT_state_media_desc:0 "Çok sık olarak gazetelerin yayınları ağzına kadar faşist ve komünist propaganda ile doludur. Bunun yerine genel halk, devlet onaylı yayınları okumaya teşvik edilmelidir; gerçek için tek güvenilir kaynak."
 WESTHEIA_LIT33_LIT_strength_in_unity:0 "Birlikten Güç Doğar"
 WESTHEIA_LIT33_LIT_strength_in_unity_desc:0 "Birlikteyken güçlüyüz ve hiçbir iki ulus Polonya ve Litvanya gibi bir bağa sahip olmadı. Kendimizi bir daha asla bir Milletler Topluluğu'na hapsetmemize izin vermeyecek olsak da, belki iki ulusumuz kırılgan bağımsızlıklarını koruyarak dost olarak işbirliği yapabilirler."
 WESTHEIA_LIT33_LIT_support_monarchism_in_POL:0 "Polonya'da Monarşizmi Destekle"
 WESTHEIA_LIT33_LIT_support_monarchism_in_POL_desc:0 "Tıpkı Litvanya gibi, Polonya'nın da kendine yeni bir Kral seçmesi gerekiyordu. Ancak Litvanya'nın aksine, Polonyalılar tahtları için uygun bir Kral bulamadılar, ama biz Polonya halkına vaat edilen güçlü hükümdarı sağlayabiliriz; Polonya'yı Alman emperyalizminden koruyacak birini."
 WESTHEIA_LIT33_LIT_support_polish_fascists:0 "Polonyalı Faşistleri Destekle"
 WESTHEIA_LIT33_LIT_support_polish_fascists_desc:0 "Polonya bizimle ortak düşmanları paylaşıyor ve Polonya-Litvanya tarihini karakterize eden yılların akrabalığını unutmamalıyız ve Polonya devleti içinde faşizmi desteklemeliyiz."
 WESTHEIA_LIT33_LIT_the_nation_and_its_power:0 "Ulus ve Gücü"
 WESTHEIA_LIT33_LIT_the_nation_and_its_power_desc:0 "Seimas'ın çekişmesi, [GetLithuanianLeaderTitle]'in gücüne bir engel olmaktan başka bir şey değildir. Kendini savunma yeteneğine sahip bir ulus inşa edeceksek, mutlak gücü [GetLithuanianLeaderTitle]'e vermeliyiz."
 WESTHEIA_LIT33_LIT_the_nationalist_council:0 "Milliyetçi Konsey"
 WESTHEIA_LIT33_LIT_the_nationalist_council_desc:0 "Cumhurbaşkanımız zaten resmî olarak herhangi bir siyasi partinin parçası değil, ama Seimas hala kendi aralarında iktidarsız çocuklar gibi çekişiyor. [ROOT.GetRulingParty] ile işbirliği yapmaya teşvik edilmelidirler, yoksa hızlı bir istifa beklemelidirler."
 WESTHEIA_LIT33_LIT_underground_production_centers:0 "[Root.Get_Underground_Resistance_Focus_Loc]"
 WESTHEIA_LIT33_LIT_underground_production_centers_desc:0 "[Root.Get_Underground_Resistance_Focus_desc_Loc]"
 WESTHEIA_LIT33_LIT_unify_the_military:0 "Orduyu Birleştir"
 WESTHEIA_LIT33_LIT_unify_the_military_desc:0 "Litvanya ordusunun bir kısmı Voldemaras ve onun Demir Kurt paramiliter grubuna tamamen hayran kalmış durumda. O kadar ki, tek gereken bir davet ve neredeyse Litvanya ordusunun tamamı Demir Kurt nüfuzu altına girecektir. Bununla, nihayet Smetona'yı hükûmetten atıp Litvanya'yı geri alabiliriz!"
 WESTHEIA_LIT33_LIT_victory_in_trust:0 "Zafer Güvendedir"
 WESTHEIA_LIT33_LIT_victory_in_trust_desc:0 "Hükûmetimizde güvenebileceğimiz kimse yok; ne Kazys Grinius, ne Augustinas Voldemaras, ne de Rastiki. Güçlü adamlar korkak ve haindir, ama bir tüfek ve onu ateşleyecek iyi bir adam? İşte buna güvenebiliriz ve bu bize zafer getirecektir."
 WESTHEIA_LIT33_LIT_victory_in_trust_idea:0 "Zafer Güvendedir"
 WESTHEIA_LIT33_LIT_warsaw_to_crimea_railway:0 "Varşova'dan Kırım'a Demiryolu"
 WESTHEIA_LIT33_LIT_warsaw_to_crimea_railway_desc:0 "Denizden denize hükmetme hırsımızda, aldığımız her toprağın ulusumuzun tam entegre bir parçası haline gelmesi hayati önem taşımaktadır. Doğal sınırlarımız Kuzey'den Güney'e, Doğu'dan Batı'ya uzanıyor ve Kırım'ı demiryolumuzla birleştirme hırsı, bölgedeki hakimiyetimizi sağlamlaştıracaktır."
 WESTHEIA_LIT33_SMETONA_DELIVERY_TT:0 "§YPrezidentas Smetona§! eğitim ve devriye gemisi §YKlaipėda§! limanında donanmaya katılır."
 WESTHEIA_LIT33_anbo_iv_production:0 "ANBO-IV Seri Üretimini Geliştir"
 WESTHEIA_LIT33_anbo_iv_production_desc:0 "ANBO-IV prototipinden edinilen tecrübeyi seri üretime taşımalıyız. Yerli havacılık atölyelerinin geliştirilmesi, keşif ve hafif bombardıman uçaklarını kendi imkânlarımızla üretmemizi sağlayacaktır."
 WESTHEIA_LIT33_establish_navy:0 "Litvanya Donanmasını Kur"
 WESTHEIA_LIT33_establish_navy_desc:0 "Prezidentas Smetona’yı eğitim ve devriye görevleri için donanmada hizmete alarak denizci personel yetiştirmeliyiz. Küçük bir deniz kuvveti kıyılarımızdaki askerî varlığın temelini oluşturacaktır."
 WESTHEIA_LIT33_farm_debt_relief:0 "Çiftçi Borçlarının Yeniden Yapılandırılması"
 WESTHEIA_LIT33_farm_debt_relief_desc:0 "Uzatılan vadeler ve hafifletilen kredi koşulları çiftliklerin borç yükünü azaltmaktadır. İcra baskısının hafiflemesi kırsal talebi ve ekonomik faaliyeti desteklemektedir."
 WESTHEIA_LIT33_farm_investment:0 "Kırsal Kalkınma Yatırımları"
 WESTHEIA_LIT33_farm_investment_desc:0 "İşleme tesisleri ve kırsal yatırımlar tarımsal ekonomiyi desteklemektedir. Ancak nüfusun büyük bölümü hâlâ tarımda çalışmakta ve sanayileşme yavaş ilerlemektedir."
 WESTHEIA_LIT33_linkaiciai_workshops:0 "Linkaičiai Silah Atölyelerini Kur"
 WESTHEIA_LIT33_linkaiciai_workshops_desc:0 "Linkaičiai’de yeni silah ve mühimmat atölyeleri kurarak ordunun bakım ve ikmal ihtiyaçlarını karşılayacak sanayi kapasitesini genişletmeliyiz."
 WESTHEIA_LIT33_modernized_agriculture:0 "Modernleşen Tarım"
 WESTHEIA_LIT33_modernized_agriculture_desc:0 "Kooperatifler, daha iyi kredi koşulları ve gelişen üretim yöntemleri kırsal verimliliği artırmaktadır. Tarım ekonominin temelini oluşturmaya devam etse de sanayiye kaynak aktarılması kolaylaşmıştır."
 WESTHEIA_LIT33_politicized_army:0 "Ordunun Siyasi Ağırlığı"
 WESTHEIA_LIT33_politicized_army_desc:0 "Ordu, mevcut rejimin kuruluşunda belirleyici bir rol oynadı. Subaylar arasındaki siyasi ayrılıklar ve komuta düzenindeki sorunlar, ordunun profesyonel gelişimini güçleştirmektedir."
 WESTHEIA_LIT33_preserve_litas:0 "Litasın İstikrarını Koru"
 WESTHEIA_LIT33_preserve_litas_desc:0 "Litasın mevcut paritesini koruyarak para düzenine duyulan güveni sürdürmeliyiz. Bu tercih tasarrufların değerini korurken ihracatçılarımızın rekabet sorunlarına başka çözümler bulmamızı gerektiriyor."
 WESTHEIA_LIT33_restructure_farm_debts:0 "Çiftçi Borçlarını Yeniden Yapılandır"
 WESTHEIA_LIT33_restructure_farm_debts_desc:0 "Borç yükü ve düşük ürün fiyatları çiftlikleri tehdit ediyor. Borçların vadelerini uzatarak ve kredi koşullarını hafifleterek kırsal ekonomiye nefes aldırmalıyız."
 WESTHEIA_LIT33_suppressed_opposition:0 "Bastırılmış Demokratik Muhalefet"
 WESTHEIA_LIT33_suppressed_opposition_desc:0 "Parlamenter düzenin kaldırılmasına rağmen muhalif siyasi çevreler varlığını sürdürüyor. Yönetimin dışladığı gruplarla yaşanan gerilim siyasi uzlaşmayı ve devlet işlerinin yürütülmesini zorlaştırmaktadır."
 WESTHEIA_LIT33_voldemaras_coup_attempt:0 "Voldemaras Darbe Girişimi"
 WESTHEIA_LIT33_voldemaras_coup_attempt_desc:0 "Voldemaras yanlısı subaylar hükümeti devirmek için harekete geçti. Girişim başarısız olsa da devletin vereceği tepki, milliyetçi muhalefetin gelecekteki etkisini belirleyecektir."
 WESTHEIA_LIT33_voldemaras_sympathy:0 "Voldemaras’a Artan Sempati"
 WESTHEIA_LIT33_voldemaras_sympathy_desc:0 "Darbe girişimi başarısız oldu, ancak hükümetin uzlaşmacı tutumu Voldemaras yanlılarının siyasi çalışmalarını sürdürmesine imkân verdi. Hareketin görüşleri toplumda daha geniş bir karşılık bulmaktadır."
 WESTHEIA_LIT_anbo_iv_prototype_inventory:0 "ANBO-IV (Prototip)"
 WESTHEIA_LIT_anbo_iv_prototype_inventory_desc:0 "Antanas Gustaitis’in 1932’de ilk kez uçan, Pratt & Whitney Wasp motorlu tek ANBO-IV prototipi. Yerli keşif ve hafif bombardıman tasarımının geliştirilmesini temsil eder; seri üretim henüz açılmamıştır."
 WESTHEIA_LIT_anbo_iv_prototype_inventory_legacy:0 "ANBO-IV (Prototip)"
 WESTHEIA_LIT_anbo_iv_prototype_inventory_legacy_desc:0 "Antanas Gustaitis’in 1932’de ilk kez uçan, Pratt & Whitney Wasp motorlu tek ANBO-IV prototipi. Yerli keşif ve hafif bombardıman tasarımının geliştirilmesini temsil eder; seri üretim henüz açılmamıştır."
 WESTHEIA_LIT_anbo_iv_prototype_inventory_legacy_short:0 "ANBO-IV (Prototip)"
 WESTHEIA_LIT_anbo_iv_prototype_inventory_registration:0 "ANBO-IV (Prototip) Tasarımı"
 WESTHEIA_LIT_anbo_iv_prototype_inventory_registration_legacy:0 "ANBO-IV (Prototip) Tasarımı"
 WESTHEIA_LIT_anbo_iv_prototype_inventory_short:0 "ANBO-IV (Prototip)"
 WESTHEIA_LIT_ansaldo_a120_inventory:0 "Ansaldo A.120"
 WESTHEIA_LIT_ansaldo_a120_inventory_desc:0 "İtalya’dan ithal edilen Fiat motorlu keşif ve hafif bombardıman uçağı. Sabit ve hareketli makineli tüfekler, gözlem donanımı ve hafif bomba askılarıyla temsil edilir."
 WESTHEIA_LIT_ansaldo_a120_inventory_legacy:0 "Ansaldo A.120"
 WESTHEIA_LIT_ansaldo_a120_inventory_legacy_desc:0 "İtalya’dan ithal edilen Fiat motorlu keşif ve hafif bombardıman uçağı. Sabit ve hareketli makineli tüfekler, gözlem donanımı ve hafif bomba askılarıyla temsil edilir."
 WESTHEIA_LIT_ansaldo_a120_inventory_legacy_short:0 "Ansaldo A.120"
 WESTHEIA_LIT_ansaldo_a120_inventory_registration:0 "Ansaldo A.120 Tasarımı"
 WESTHEIA_LIT_ansaldo_a120_inventory_registration_legacy:0 "Ansaldo A.120 Tasarımı"
 WESTHEIA_LIT_ansaldo_a120_inventory_short:0 "Ansaldo A.120"
 WESTHEIA_LIT_fiat_cr20_inventory:0 "Fiat CR.20"
 WESTHEIA_LIT_fiat_cr20_inventory_desc:0 "İtalya’dan ithal edilen Fiat CR.20 avcısı. Fiat A.20 motoru ve iki sabit tüfek kalibreli makineli tüfekle temsil edilir. Yerli üretim lisansı verilmez."
 WESTHEIA_LIT_fiat_cr20_inventory_legacy:0 "Fiat CR.20"
 WESTHEIA_LIT_fiat_cr20_inventory_legacy_desc:0 "İtalya’dan ithal edilen Fiat CR.20 avcısı. Fiat A.20 motoru ve iki sabit tüfek kalibreli makineli tüfekle temsil edilir. Yerli üretim lisansı verilmez."
 WESTHEIA_LIT_fiat_cr20_inventory_legacy_short:0 "Fiat CR.20"
 WESTHEIA_LIT_fiat_cr20_inventory_registration:0 "Fiat CR.20 Tasarımı"
 WESTHEIA_LIT_fiat_cr20_inventory_registration_legacy:0 "Fiat CR.20 Tasarımı"
 WESTHEIA_LIT_fiat_cr20_inventory_short:0 "Fiat CR.20"
 WESTHEIA_LIT_letov_s20l_inventory:0 "Letov Š.20L"
 WESTHEIA_LIT_letov_s20l_inventory_desc:0 "Çekoslovakya’dan alınan Hispano-Suiza motorlu eski Letov avcısı. İki sabit makineli tüfek taşır. Başlangıç miktarı satın alımlar ve bilinen kayıplar temelindeki yaklaşık temsildir."
 WESTHEIA_LIT_letov_s20l_inventory_legacy:0 "Letov Š.20L"
 WESTHEIA_LIT_letov_s20l_inventory_legacy_desc:0 "Çekoslovakya’dan alınan Hispano-Suiza motorlu eski Letov avcısı. İki sabit makineli tüfek taşır. Başlangıç miktarı satın alımlar ve bilinen kayıplar temelindeki yaklaşık temsildir."
 WESTHEIA_LIT_letov_s20l_inventory_legacy_short:0 "Letov Š.20L"
 WESTHEIA_LIT_letov_s20l_inventory_registration:0 "Letov Š.20L Tasarımı"
 WESTHEIA_LIT_letov_s20l_inventory_registration_legacy:0 "Letov Š.20L Tasarımı"
 WESTHEIA_LIT_letov_s20l_inventory_short:0 "Letov Š.20L"
 WESTHEIA_MAL_ANDREW_CALDECOTT_1933:0 "Andrew Caldecott"
 WESTHEIA_MAL_CECIL_CLEMENTI_1933:0 "Sir Cecil Clementi"
 WESTHEIA_MAN_1933_CHI_sea_annex_tuva_desc_text_man:0 "Tannu Tuva üzerindeki ulusal haklarımızı tesis edelim. Bağımsızsak mevcut Tuva hükûmetine karşı savaş hedefi de elde ederiz."
 WESTHEIA_MAN_1933_CHI_sea_annex_tuva_desc_text_original:0 "Tuva bir zamanlar devletimizin bir parçasıydı ancak devrimden sonra Ruslar onları bizden çaldı. Onları güneydeki kardeşleriyle yeniden birleştirmeye ve Rusların elinden kurtarmaya çalışmalıyız."
 WESTHEIA_MAN_1933_CHI_sea_demand_mongolia_desc_text_man:0 "Moğolistan topraklarını ulusal bütünlüğümüzün bir parçası olarak kabul edelim. Bağımsızsak mevcut Moğol hükûmetine karşı savaş hedefi de elde ederiz."
 WESTHEIA_MAN_1933_CHI_sea_demand_mongolia_desc_text_original:0 "Bizimle Rusya arasında sıkışmış olan Moğolistan, her an onlara düşebilir. Önce biz saldırmalıyız."
 WESTHEIA_MAN_1933_CHI_sea_integrate_tibet_desc_text_man:0 "Tibet’i ülkemizin ayrılmaz bir parçası olarak kabul ederek Tibet toprakları üzerinde tam ulusal hak tesis edelim."
 WESTHEIA_MAN_1933_CHI_sea_integrate_tibet_desc_text_original:0 "Tibet bağımsızlığı deneyi sona erdi. Askeri bir işgal bir seçenektir, ancak onları barışçıl yollarla tekrar katımıza getirmeyi denemeliyiz."
 WESTHEIA_MAN_1933_air_force_established_tt:0 "§YHsinking§! merkezli ilk avcı birliği §Y1 Nieuport-Delage NiD 29§! ile kurulur. Gerekirse bir hava üssü oluşturulur.\n"
 WESTHEIA_MAN_1933_establish_air_force:0 "Mançukuo Hava Kuvvetlerini Kur"
 WESTHEIA_MAN_1933_establish_air_force_desc:0 "Japon eğitmenlerin desteğiyle küçük bir askerî havacılık teşkilatı oluşturalım. İlk pilotların eğitimi ve tek bir Nieuport-Delage NiD 29 ile kurulacak ilk birlik, gelecekteki hava kuvvetlerimizin çekirdeğini meydana getirecektir."
 WESTHEIA_MAN_1933_japan_requests:0 "Japonya ile Bölgesel Görüşmeler"
 WESTHEIA_MAN_1933_japan_requests_desc:0 "Tokyo ile görüşerek Japon yönetimindeki bölgelerin ülkemize devrini talep edebiliriz."
 WESTHEIA_MAN_1933_monetary_cooperation:0 "Yuan–Yen Paritesi"
 WESTHEIA_MAN_1933_not_japanese_subject_tt:0 "Mançukuo, Japonya’nın bağlı devleti olmamalı."
 WESTHEIA_MAN_1933_pacify_name:0 "Kırsalda Kontrolü Sağla"
 WESTHEIA_MAN_1933_pacify_name_desc:0 "Büyük şehirlerdeki varlığımız, kırsal bölgelerde de sözümüzün geçtiği anlamına gelmiyor. Demiryollarını ve köyleri silahlı grupların baskısından kurtararak hükûmetin otoritesini ülkenin her köşesine taşımalıyız."
 WESTHEIA_MAN_1933_peg_yuan_to_yen:0 "Yuanı Yene Bağla"
 WESTHEIA_MAN_1933_peg_yuan_to_yen_desc:0 "Gümüşe dayanan para düzeninin yarattığı kur baskısını hafifletmek için yuanın değerini Japon yeniyle uyumlu hale getirelim. Bu düzenleme Japonya ile ticareti ve ekonomik bağlantılarımızı güçlendirecektir."
 WESTHEIA_MAN_1933_request_east_hebei:0 "Doğu Hebei’nin Devrini Talep Et"
 WESTHEIA_MAN_1933_request_east_hebei_desc:0 "Japonya’nın yönettiği Doğu Hebei’nin ülkemize devrini isteyelim. Talebimizi Tokyo ile diplomatik görüşmeler yoluyla iletelim."
 WESTHEIA_MAN_1933_tibet_integrate_name:0 "Tibet’i Entegre Et"
 WESTHEIA_MAN_1933_tibet_original_name:0 "Özerk Bir Tibet"
 WESTHEIA_MAN_1933_yen_peg:0 "Yuan–Yen Paritesi"
 WESTHEIA_MAN_1933_yen_peg_desc:0 "Yuanın yenle kurulan parasal bağı, ticari işlemlerdeki kur belirsizliğini azaltıyor."
 WESTHEIA_MAN_ZHENG_XIAOXU_1933:0 "Zheng Xiaoxu"
 WESTHEIA_MA_consolidate_provincial_administration:0 "[WESTHEIA_MA_consolidate_provincial_administration_name]"
 WESTHEIA_MA_consolidate_provincial_administration_GSM:0 "Hexi Eyalet Yönetimini Sağlamlaştır"
 WESTHEIA_MA_consolidate_provincial_administration_NXM:0 "Ningxia Eyalet Yönetimini Sağlamlaştır"
 WESTHEIA_MA_consolidate_provincial_administration_XSM:0 "Qinghai Eyalet Yönetimini Sağlamlaştır"
 WESTHEIA_MA_consolidate_provincial_administration_desc:0 "[WESTHEIA_MA_consolidate_provincial_administration_description]"
 WESTHEIA_MA_consolidate_provincial_administration_desc_GSM:0 "Hexi yönetiminin gelir toplama, yerel güvenlik ve kamu hizmetlerini düzenleme kabiliyetini güçlendirmeliyiz. İlçelerle daha düzenli ilişkiler kurarak kalkınma çalışmalarımızın dayanacağı idari temeli sağlamlaştıracağız."
 WESTHEIA_MA_consolidate_provincial_administration_desc_NXM:0 "Ningxia yönetiminin gelir toplama, yerel güvenlik ve kamu hizmetlerini düzenleme kabiliyetini güçlendirmeliyiz. İlçelerle daha düzenli ilişkiler kurarak kalkınma çalışmalarımızın dayanacağı idari temeli sağlamlaştıracağız."
 WESTHEIA_MA_consolidate_provincial_administration_desc_XSM:0 "Qinghai yönetiminin gelir toplama, yerel güvenlik ve kamu hizmetlerini düzenleme kabiliyetini güçlendirmeliyiz. İlçelerle daha düzenli ilişkiler kurarak kalkınma çalışmalarımızın dayanacağı idari temeli sağlamlaştıracağız."
 WESTHEIA_MA_develop_province:0 "[WESTHEIA_MA_develop_province_name]"
 WESTHEIA_MA_develop_province_GSM:0 "Hexi Bölgesini Geliştir"
 WESTHEIA_MA_develop_province_NXM:0 "Ningxia Bölgesini Geliştir"
 WESTHEIA_MA_develop_province_XSM:0 "Qinghai Bölgesini Geliştir"
 WESTHEIA_MA_develop_province_desc:0 "[WESTHEIA_MA_develop_province_description]"
 WESTHEIA_MA_develop_province_desc_GSM:0 "Hexi bölgesinin sınırlı üretim imkânlarını geliştirmek için başkent çevresindeki atölyelere ve işletmelere yatırım yapacağız. Yerel imalatın güçlenmesi, halkın ve eyalet idaresinin ihtiyaçlarının daha düzenli karşılanmasını sağlayacaktır."
 WESTHEIA_MA_develop_province_desc_NXM:0 "Ningxia bölgesinin sınırlı üretim imkânlarını geliştirmek için başkent çevresindeki atölyelere ve işletmelere yatırım yapacağız. Yerel imalatın güçlenmesi, halkın ve eyalet idaresinin ihtiyaçlarının daha düzenli karşılanmasını sağlayacaktır."
 WESTHEIA_MA_develop_province_desc_XSM:0 "Qinghai bölgesinin sınırlı üretim imkânlarını geliştirmek için başkent çevresindeki atölyelere ve işletmelere yatırım yapacağız. Yerel imalatın güçlenmesi, halkın ve eyalet idaresinin ihtiyaçlarının daha düzenli karşılanmasını sağlayacaktır."
