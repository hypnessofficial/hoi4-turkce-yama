 WESTHEIA_LAT_dh9a_inventory:0 "Airco DH.9A"
 WESTHEIA_LAT_dh9a_inventory_desc:0 "İngiltere’den alınan eski keşif ve bombardıman uçakları. Liberty motoru, öne ateş eden Vickers, gözlemci mevzisindeki Lewis ve harici bomba askıları taşır."
