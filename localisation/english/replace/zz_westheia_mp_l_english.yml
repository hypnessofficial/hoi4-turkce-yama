 GER_1933_political_intriguer:0 "Siyasi Entrikacı"
 GER_1933_political_intriguer_desc:0 "Ordu ve saray çevrelerindeki bağlantılarıyla siyaseti yönlendiren Schleicher, etkisini askerî disiplin ve ekonomik toparlanma arayışıyla birleştirir. Ancak perde arkasındaki güç mücadeleleri hükûmetin istikrarını zayıflatır."
