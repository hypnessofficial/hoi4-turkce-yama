 WESTHEIA_TUR33_university_reform:0 "1933 Üniversite Reformunu Uygula"
 WESTHEIA_TUR33_university_reform_desc:0 "Darülfünunun yerine yeni İstanbul Üniversitesini kuracak reformu hayata geçireceğiz. Bilimsel çalışma ve yükseköğretimde yeni bir düzen oluşturarak uzmanların yetişmesine ve araştırmanın gelişmesine imkân sağlayacağız."
