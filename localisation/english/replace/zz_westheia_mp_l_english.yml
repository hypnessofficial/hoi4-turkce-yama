 WESTHEIA_IRQ_dh84m_dragon_inventory:0 "de Havilland DH.84M Dragon"
 WESTHEIA_IRQ_dh84m_dragon_inventory_desc:0 "Mayıs 1933 İngiliz siparişinin askerî DH.84M modeli. İki Gipsy Major motoru, burunda iki tüfek kalibreli makineli tüfek, tek hareketli sırt makineli tüfeği ve on altı adet 20 librelik bomba askısı taşır. Başlangıçta verilmez; teslimat teklifinin kabul edilmesi gerekir."
 WESTHEIA_IRQ_dh84m_dragon_inventory_legacy:0 "de Havilland DH.84M Dragon"
 WESTHEIA_IRQ_dh84m_dragon_inventory_legacy_desc:0 "Mayıs 1933 İngiliz siparişinin askerî DH.84M modeli. İki Gipsy Major motoru, burunda iki tüfek kalibreli makineli tüfek, tek hareketli sırt makineli tüfeği ve on altı adet 20 librelik bomba askısı taşır. Başlangıçta verilmez; teslimat teklifinin kabul edilmesi gerekir."
