 WESTHEIA_BOL_DANIEL_SALAMANCA_1933:0 "Daniel Salamanca"
 WESTHEIA_BOL_LIBERAL_PARTY_1933:0 "Bolivya Liberal Partisi"
 WESTHEIA_BOL_PRG_1933:0 "Partido Republicano Genuino"
 WESTHEIA_BRA_1933_regional_desc:0 "Federal müdahaleler ve merkezî yönetimin güçlenmesi, eyaletlerdeki siyasal çevrelerle hükümet arasındaki gerilimi artırmıştır. 1932’de bastırılan São Paulo ayaklanmasının ardından silahlar susmuş olsa da anayasal yönetim ve eyalet özerkliği talepleri devam etmektedir. Bu muhalefetin tamamı ayrılıkçılık anlamına gelmez; devletin yeniden örgütlenmesi üzerindeki anlaşmazlık ülkenin siyasal birliğini zorlamaktadır."
 WESTHEIA_BRA_1933_regional_name:0 "Bölgesel Muhalefet"
 WESTHEIA_BRA_1933_support_aircraft_production:0 "Yerli Uçak Üretimini Destekle"
 WESTHEIA_BRA_1933_support_aircraft_production_desc:0 "Henrique Lage’nin havacılık girişimleri ve Antônio Guedes Muniz’in tasarım çalışmaları, ülkemizde uçak üretimini geliştirmek için bir temel sunuyor. Companhia Nacional de Navegação Aérea çevresindeki atölyelere, mühendislik çalışmalarına ve üretim kapasitesine yatırım yaparak yerli havacılık sanayisinin büyümesini destekleyeceğiz."
 WESTHEIA_BRA_1933_weak_desc:0 "1930 hareketinin ardından kurulan geçici yönetim, devlet otoritesini merkezileştirmeye çalışırken eski siyasal çevrelerin, eyalet seçkinlerinin ve kendi müttefiklerinin farklı talepleriyle karşı karşıyadır. São Paulo’daki 1932 çatışmasının ardından anayasa ve temsil talepleri ertelenemez hâle gelmiştir. Vargas’ın iktidarı sürse de yeni siyasal düzen henüz kesinleşmemiştir."
 WESTHEIA_BRA_1933_weak_name:0 "Geçici Hükümetin Meşruiyet Sorunu"
 WESTHEIA_BRA_1934_CONSTITUTIONAL_TT:0 "§YGetúlio Vargas§! görevde kalır. Yönetim §YDemokratik§! gruba, alt ideoloji §YPopülizm§! türüne geçer. Otomatik seçimler kapalı kalır."
 WESTHEIA_BRA_1935_POLITICAL_PATHS_TT:0 "1935 komünist ayaklanması eventi yaşanmış olmalı."
 WESTHEIA_BRA_1935_UPRISING_TT:0 "Natal’de başlayan ayaklanmayı izleyen olağanüstü hal meselesi §Y26 Kasım 1935§! tarihinde ele alınacaktır."
 WESTHEIA_BRA_BOEING_DELIVERY_TT:0 "§Y9 Boeing 267§! avcısı §YRio de Janeiro§! üssünde hava envanterine katılır."
 WESTHEIA_BRA_CORSAIR_DELIVERY_TT:0 "§Y28 Vought V-65B Corsair§! teslim edilir: §Y7§! Rio de Janeiro, §Y7§! Porto Alegre ve §Y14§! Curitiba. Yerli üretim lisansı verilmez."
 WESTHEIA_BRA_MINAS_RETURN_TT:0 "Modernize edilmiş §YMinas Geraes§! zırhlısı §YRio de Janeiro§! limanında filoya katılır. Yeni bir gemi inşa edilmez; modernizasyondaki mevcut gemi hizmete döner."
 WESTHEIA_BRA_NATIVE_RegionalOpposition_desc:0 "Ulusun dört bir yanında Brezilya merkezi hükümetine karşı şikayetleri olan veya ulusun daha az varlıklı eyaletlerini desteklemekten rahatsız olan birçok kişi var. Geçmişte bu duygular, eyaletlerini ulustan ayıran kısa ömürlü ayrılıkçı hareketlere yol açtı. Siyasi durumu yakında istikrara kavuşturamazsak, bu tür hareketler Brezilya'nın parçalanmasına neden olabilir."
 WESTHEIA_BRA_NATIVE_RegionalOpposition_name:0 "Ayrılıkçı Duygular"
 WESTHEIA_BRA_NATIVE_WeakGovernment_desc:0 "Yıllar boyunca devrimler ve darbe girişimleri Brezilya hükümetinin otoritesini zayıflattı. Durum, uzlaşmadan doğan ve az destekçi bulan 1934 anayasasıyla daha da kötüleşiyor. Brezilya'nın geleceği ne olursa olsun, mevcut siyasi düzenlemenin sürdürülemez olduğu kesindir. "
 WESTHEIA_BRA_NATIVE_WeakGovernment_name:0 "Zayıf Hükümet"
