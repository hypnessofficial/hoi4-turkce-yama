 WESTHEIA_SHX_develop_shanxi:0 "Şansi İlini Geliştir"
 WESTHEIA_SHX_develop_shanxi_desc:0 "Kalkınma programımızı hayata geçirmek için Şansi'nin sanayi altyapısını genişletmeliyiz. Başkent çevresine yapılacak yatırımlar yeni üretim tesislerinin kurulmasını ve eyaletin ekonomik gücünün artmasını sağlayacaktır."
 WESTHEIA_SHX_taiyuan_artillery_bonus:0 "Taiyuan Topçu Üretimi"
 WESTHEIA_SHX_ten_year_development:0 "On Yıllık Kalkınma Programı"
 WESTHEIA_SHX_ten_year_development_desc:0 "Eyaletin sanayi ve ulaşım yatırımları ortak bir kalkınma programı çerçevesinde yürütülüyor. Kamu kaynaklarının ve yerel üretimin aynı hedefe yönlendirilmesi, yeni tesislerin inşasını hızlandırıyor."
 WESTHEIA_SHX_ten_year_development_plan:0 "On Yıllık Kalkınma Programını Benimse"
 WESTHEIA_SHX_ten_year_development_plan_desc:0 "Şansi'nin geleceğini yalnızca askerî gücümüzle güvence altına alamayız. Sanayiyi, ulaşımı ve yerel üretimi uzun vadeli bir kalkınma programı altında birleştirerek eyaletimizin ekonomik temelini güçlendireceğiz."
 WESTHEIA_SHX_tongpu_construction:0 "Tongpu Demiryolu Seferberliği"
 WESTHEIA_SHX_tongpu_construction_desc:0 "Tongpu hattının inşası için iş gücü, malzeme ve mühendislik imkânları seferber edildi. Koordineli çalışmalar, yeni demiryolu bağlantılarının kurulmasını hızlandırıyor."
