 WESTHEIA_DEN_steincke_social_reform:0 "Steincke'nin Sosyal Reformunu Uygula"
 WESTHEIA_DEN_steincke_social_reform_desc:0 "Steincke’nin hazırladığı sosyal reform, dağınık yardım düzenlemelerini ortak bir çerçevede toplayarak ihtiyaç sahiplerinin güvencesini ve toplumun dayanışmasını güçlendirecektir."
 WESTHEIA_DEN_steincke_social_reform_spirit:0 "Steincke'nin Sosyal Reformu"
 WESTHEIA_DEN_steincke_social_reform_spirit_desc:0 "Sosyal yardım ve sigorta düzenlemeleri ortak bir çerçevede birleştirilerek ekonomik kriz karşısında toplumsal güven güçlendiriliyor."
 WESTHEIA_ENG33_COLONIAL_COMPLETED_PATH_TT:0 "§Y$ENG_concessions_to_the_trade_unions$§! veya §Y$ENG_home_defence$§! odağı tamamlanmış olmalı."
 WESTHEIA_ENG33_COLONIAL_HOME_PLAYER_ONLY_TT:0 "Anavatan Savunması yolunda bu odak yalnızca oyuncular tarafından seçilebilir."
 WESTHEIA_ENG33_KEEP_AMERICAN_OVERSEAS_TT:0 "§YJamaika ve Cayman Adaları§!, §YLeeward Adaları§! ve §YGüney Bahamalar§! Britanya yönetiminde kalır. §YBermuda§! üzerindeki yönetimimiz sürer."
 WESTHEIA_ENG33_KEEP_DISPUTED_OVERSEAS_TT:0 "§YKuzey İrlanda§!, §YCebelitarık§!, §YFalkland Adaları§! ve §YGüney Georgia§! Britanya yönetiminde kalır."
 WESTHEIA_ENG33_daventry_experiment:0 "Daventry Deneyini Gerçekleştir"
 WESTHEIA_ENG33_daventry_experiment_desc:0 "Watson-Watt ve Wilkins, radyo dalgalarının uçakların yerini belirlemek için kullanılabileceğini düşünüyor. Daventry'deki deneyi desteklemeli ve Suffolk'taki araştırma çalışmalarına gerekli tesisleri sağlamalıyız."
 WESTHEIA_ENG33_depression:0 "Buhranın Gölgesinde"
 WESTHEIA_ENG33_depression_desc:0 "Sterlinin altın standardından ayrılması ve ucuz para politikası toparlanmanın önünü açsa da işsizlik, daralan dış ticaret ve ağır sanayideki durgunluk sürüyor. Hükümet, kamu maliyesini korurken üretimi ve yatırımları canlandırmak zorunda."
 WESTHEIA_ENG33_depression_recovery:0 "Buhranın Gölgesinde"
 WESTHEIA_ENG33_depression_recovery_desc:0 "İç yatırımlar ve finansman koşullarındaki iyileşme inşaat faaliyetlerini canlandırmaya başladı. Ancak ağır sanayide durgunluk ve işsizlik sürüyor; toparlanmanın ülkenin bütün bölgelerine yayılması gerekiyor."
 WESTHEIA_ENG33_depression_regional:0 "Buhranın Gölgesinde"
 WESTHEIA_ENG33_depression_regional_desc:0 "Bölgesel kalkınma yatırımları üretimi yeniden harekete geçiriyor. Ekonomi toparlanırken düşük kapasite kullanımı ve buhranın kamu maliyesi üzerindeki yükü henüz tamamen aşılmış değil."
 WESTHEIA_ENG33_legacy_air_registration:0 "Mevcut Hafif Bombardıman Uçakları"
 WESTHEIA_ENG33_legacy_air_registration_desc:0 "Hizmetteki erken dönem hafif bombardıman uçaklarının kaydı."
 WESTHEIA_ENG33_regional_electricity_grid:0 "Bölgesel Elektrik Şebekelerini Devreye Al"
 WESTHEIA_ENG33_regional_electricity_grid_desc:0 "Yeni iletim hatları ve bölgesel şebekeler, elektrik üretimini sanayi merkezlerine daha verimli biçimde ulaştırmamızı sağlayacak. Santralleri ve dağıtım ağını geliştirerek ekonominin artan enerji ihtiyacını karşılamalıyız."
 WESTHEIA_ENG33_special_areas_act:0 "Özel Bölgeler Yasasını Uygula"
 WESTHEIA_ENG33_special_areas_act_desc:0 "Kömür, çelik ve gemi inşasına bağımlı bölgeler buhrandan ağır etkilendi. Kuzeydoğu İngiltere, Güney Galler ve İskoçya'nın sanayi bölgelerinde yeni işletmeleri destekleyerek istihdamı ve üretimi canlandırmalıyız."
 WESTHEIA_ENG_1933_existing_naval_hulls:0 "Savaş Öncesi Britanya Gemi Sınıfları"
 WESTHEIA_ENG_1933_existing_naval_hulls_desc:0 "Kraliyet Donanmasının hizmetindeki ve tersanelerinde inşa edilen savaş öncesi gemi sınıfları."
 WESTHEIA_ENG_1933_iraqi_aircraft_order:0 "Irak Uçak Siparişi"
 WESTHEIA_ENG_1933_iraqi_aircraft_order_desc:0 "Irak’a teslim edilen sekiz Dragon uçağının ödemeleri bir yıl boyunca İngiliz sanayisine gelir sağlıyor."
 WESTHEIA_ENG_CONSERVATIVE_PARTY_1933:0 "Muhafazakar Parti"
 WESTHEIA_ENG_GEORGE_V_DEATH_REQUIRED_TT:0 "V. George vefat etmiş olmalı."
 WESTHEIA_ENG_NATIONAL_LABOUR_1933:0 "Ulusal İşçi Partisi"
 WESTHEIA_ENG_RAMSAY_MACDONALD_1933:0 "Ramsay MacDonald"
 WESTHEIA_ENG_wapiti_iii:0 "Westland Wapiti III"
 WESTHEIA_ENG_wapiti_iii_desc:0 "Britanya tasarımı iki kişilik ordu iş birliği uçağı. Hafif bomba askıları, bir sabit Vickers makineli tüfeği ve bir arka Lewis makineli tüfeği taşır. Güney Afrika bu modeli Britanya lisansı altında üretebilir."
 WESTHEIA_ENG_wapiti_iii_legacy:0 "Westland Wapiti III"
 WESTHEIA_ENG_wapiti_iii_legacy_desc:0 "Britanya tasarımı iki kişilik ordu iş birliği uçağı. Hafif bomba askıları, bir sabit Vickers makineli tüfeği ve bir arka Lewis makineli tüfeği taşır. Güney Afrika bu modeli Britanya lisansı altında üretebilir."
