 OCfA_event.0.a:0 "İyi haber."
 OCfA_event.0.d:0 "Ordu artık barış zamanı için uygun büyüklükte. Askerler işlerine ve ailelerine geri döndü. Bu ülkemizi daha istikrarlı hâle getiriyor."
 OCfA_event.0.t:0 "Askerler Eve Dönüyor"
 OCfA_event.1.a:0 "Bu bir suç."
 OCfA_event.1.d:0 "Ordu liderleri asker sayılarına ilişkin yalan söylüyor. Gerçekte sahip olduklarından daha fazla askerleri olduğunu iddia ediyorlar. Fazladan ödemeleri kendileri için zimmetine geçiriyorlar. Bu bütçemize zarar veriyor."
 OCfA_event.1.t:0 "Hayalet Askerler"
 OCfA_event.2.a:0 "Düzeni korumalıyız."
 OCfA_event.2.d:0 "Askerler eve dönmek için beklemekten yoruldu. Sokaklarda yürüyüş yapıyor ve neden hâlâ orduda olduklarını soruyorlar. Halk liderlerimize olan güvenini kaybetmeye başlıyor."
 OCfA_event.2.t:0 "Sokaklarda Protestolar"
 OCfA_event.3.a:0 "Makineler sessiz."
 OCfA_event.3.d:0 "Hâlâ çok fazla erkek orduda. Fabrikalarımızda yeterli işçi yok. Bu durum inşaatlarımızı yavaşlatıyor ve herkesin hayatını zorlaştırıyor."
 OCfA_event.3.t:0 "Boş Fabrikalar"
 OCfA_event.4.a:0 "Kontrolü kaybediyoruz."
 OCfA_event.4.d:0 "Askerler izin almadan görev yerlerini terk ediyor. Doğrudan evlerine gidiyorlar. En iyi askerlerimizi kaybediyoruz ve ordu giderek kontrolden çıkıyor."
 OCfA_event.4.t:0 "Askerler Birliklerini Terk Ediyor"
 OCfA_event.5.a:0 "Emirlere uymayacaklar."
 OCfA_event.5.d:0 "Askerler subaylarını dinlemeyi bıraktı. Hükümetle konuşmak için kendi gruplarını oluşturuyorlar. Bu durum orduyu çok zayıf ve yönetilmesi zor hâle getiriyor."
 OCfA_event.5.t:0 "Komuta Kaybı"
