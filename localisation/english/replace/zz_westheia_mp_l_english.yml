 RAJ_1933_coordinate_provincial_administration:0 "Eyalet İdaresini Koordine Et"
 RAJ_1933_coordinate_provincial_administration_desc:0 "Yerel idareler ile genel valilik arasındaki işbirliğini güçlendirmek, düzenin korunduğu bölgelerin yönetim deneyimini merkezî hükümete taşıyacaktır. Sadık bir hükümet, eyaletlerdeki idari uyumdan güç almalıdır."
 RAJ_1933_coordinate_provincial_administration_pp_bonus_tt:0 "Başlangıçta sahip olunan ve §Y%74§! üzerinde Uyumluluğu bulunan her eyalet için §Y$RAJ_a_loyal_government$§! şu şekilde değişir: [?RAJ_1933_coordinate_provincial_administration_pp_bonus_based_on_compliance|+=%%0] $MODIFIER_POLITICAL_POWER_FACTOR$."
 RAJ_1933_monetary_stabilization:0 "Parasal İstikrar Çalışmaları"
 RAJ_1933_monetary_stabilization_desc:0 "Rezervlerin daha düzenli yönetilmesi ve kredi sisteminin koordinasyonu, kamu maliyesi üzerindeki baskıyı hafifletmektedir. Yeni bankacılık düzeninin yerleşmesi, ekonomik faaliyetler için daha öngörülebilir koşullar yaratmaktadır."
 RAJ_1933_reconsider_indias_future:0 "Hindistan’ın Geleceğini Yeniden Değerlendir"
 RAJ_1933_reconsider_indias_future_desc:0 "Mevcut idarenin geleceği yalnızca Londra ile Kongre arasındaki görüşmelerle belirlenmek zorunda değildir. Eski hanedanların iddialarını ve ticari çevrelerin yönetim önerilerini inceleyerek farklı siyasi seçenekleri değerlendirebiliriz."
