 WESTHEIA_IRQ_1933_dragon_payment:0 "İngiliz Uçak Siparişinin Ödemeleri"
 WESTHEIA_IRQ_1933_dragon_payment_desc:0 "Sekiz Dragon uçağının satın alma ödemeleri bir yıl boyunca sivil ekonomiye ek yük getiriyor."
 WESTHEIA_IRQ_ali_jawdat_al_ayyubi:0 "Ali Cevdet el-Eyyubi"
 WESTHEIA_IRQ_army_political_interference:0 "Ordunun Siyasete Müdahalesi"
 WESTHEIA_IRQ_army_political_interference_desc:0 "Genç krallığın subayları, kendilerini yalnızca sınırların değil devletin geleceğinin de koruyucuları saymaktadır. Ordunun siyasi nüfuzu, sivil hükümetlerin istikrarını ve hareket alanını zayıflatmaktadır."
 WESTHEIA_IRQ_bakr_coup_already_happened_tt:0 "Bakr Sidqi’nin darbesi gerçekleşti."
 WESTHEIA_IRQ_complete_kirkuk_mediterranean_pipeline:0 "Kerkük–Akdeniz Boru Hattını Tamamla"
 WESTHEIA_IRQ_complete_kirkuk_mediterranean_pipeline_desc:0 "Kerkük petrolünü Akdeniz limanlarına ulaştıracak boru hattını ve pompalama tesislerini tamamlayarak büyük ölçekli ihracatın önünü açmalıyız. Böylece başlangıçta kullanılamayan petrol üretim kapasitesi devreye girecek."
 WESTHEIA_IRQ_dh60_moth_inventory:0 "de Havilland DH.60 Gipsy Moth"
 WESTHEIA_IRQ_dh60_moth_inventory_desc:0 "İngiltere’den ithal DH.60 eğitim ve irtibat uçağı. Tek Gipsy II motoru ve silahsız gözlem düzeni; sınırlı keşif görevi oyun içinde keşif donanımıyla temsil edilir. Altı uçak, 1932 kayıpları sonrası onaylanan temkinli başlangıç temsilidir. Avcı silahı veya bomba askısı eklenmemiştir."
 WESTHEIA_IRQ_dh60_moth_inventory_legacy:0 "de Havilland DH.60 Gipsy Moth"
 WESTHEIA_IRQ_dh60_moth_inventory_legacy_desc:0 "İngiltere’den ithal DH.60 eğitim ve irtibat uçağı. Tek Gipsy II motoru ve silahsız gözlem düzeni; sınırlı keşif görevi oyun içinde keşif donanımıyla temsil edilir. Altı uçak, 1932 kayıpları sonrası onaylanan temkinli başlangıç temsilidir. Avcı silahı veya bomba askısı eklenmemiştir."
