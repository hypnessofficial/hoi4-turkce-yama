 CHI_sea_industrial_research_projects_SHX:0 "Güney Tongpu Hattını Tamamla"
 CHI_sea_industrial_research_projects_SIC33:0 "Sichuan Sanayi Araştırma Heyetini Davet Et"
 CHI_sea_industrial_research_projects_SIC33_fallback:0 "[WESTHEIA_GDC33_text_3_name]"
 CHI_sea_industrial_research_projects_SIK33:0 "Ürümqi–İli Karayolunu Tamamla"
 CHI_sea_industrial_research_projects_SIK33_fallback:0 "[WESTHEIA_SIC33_text_1_name]"
 CHI_sea_industrial_research_projects_SND33:0 "Jinan Teknik Atölyelerini Geliştir"
 CHI_sea_industrial_research_projects_YUN:0 "Shilongba Santralini Modernleştir"
 CHI_sea_industrial_research_projects_desc_GDC33:0 "Yabancı makinelerden ve teknik bilgiden yararlanırken yerli mühendis ve ustaların yetişmesini destekleyeceğiz. Eyalet işletmelerinin üretim yöntemlerini geliştirmek, büyük sanayi yatırımlarının daha verimli işlemesini sağlayacaktır."
 CHI_sea_industrial_research_projects_desc_GDC33_fallback:0 "[WESTHEIA_HBC33_text_4_desc]"
 CHI_sea_industrial_research_projects_desc_GXC:0 "Liuzhou ve Guilin’deki elektrik işletmelerini büyüterek sanayi tesislerimize daha güvenilir enerji sağlayacağız. Yeni üretim araçları ve teknik araştırmalar, eyaletimizin ekonomik gelişmesini destekleyecektir."
 CHI_sea_industrial_research_projects_desc_HBC33:0 "Huanghai Kimya Sanayisi Araştırma Cemiyetinin çalışmalarına destek vereceğiz. Araştırmacılarla yerel işletmeler arasındaki işbirliğini geliştirerek üretim yöntemlerini iyileştirmeli ve dışarıdan alınan teknik bilgiye bağımlılığı azaltmalıyız."
 CHI_sea_industrial_research_projects_desc_HBC33_fallback:0 "[WESTHEIA_SHX_focus_2Desc]"
 CHI_sea_industrial_research_projects_desc_MA33_GSM:0 "Mevcut atölyelerin araçlarını yenileyerek ustaların teknik bilgisini geliştirmeliyiz. Daha iyi bakım, daha düzenli iş bölümü ve yeni üretim yöntemleri, eyaletin sınırlı sanayi imkânlarından daha fazla yararlanmamızı sağlayacaktır."
 CHI_sea_industrial_research_projects_desc_MA33_KHM:0 "Mevcut atölyelerin araçlarını yenileyerek ustaların teknik bilgisini geliştirmeliyiz. Daha iyi bakım, daha düzenli iş bölümü ve yeni üretim yöntemleri, eyaletin sınırlı sanayi imkânlarından daha fazla yararlanmamızı sağlayacaktır."
 CHI_sea_industrial_research_projects_desc_MA33_NXM:0 "Mevcut atölyelerin araçlarını yenileyerek ustaların teknik bilgisini geliştirmeliyiz. Daha iyi bakım, daha düzenli iş bölümü ve yeni üretim yöntemleri, eyaletin sınırlı sanayi imkânlarından daha fazla yararlanmamızı sağlayacaktır."
 CHI_sea_industrial_research_projects_desc_MA33_XSM:0 "Mevcut atölyelerin araçlarını yenileyerek ustaların teknik bilgisini geliştirmeliyiz. Daha iyi bakım, daha düzenli iş bölümü ve yeni üretim yöntemleri, eyaletin sınırlı sanayi imkânlarından daha fazla yararlanmamızı sağlayacaktır."
 CHI_sea_industrial_research_projects_desc_SHX:0 "Taiyuan'dan güneydeki Fen Vadisi boyunca uzanan demiryolunu tamamlayarak fabrikalarımızı ve yerel pazarlarımızı birbirine bağlayacağız. Yeni hat, ordumuzun ve sanayimizin ihtiyaç duyduğu düzenli taşımacılığı sağlayacaktır."
 CHI_sea_industrial_research_projects_desc_SIC33:0 "Hu Shuhua’nın başkanlığındaki mühendislik heyetini eyaletimize davet edeceğiz. Sanayi kuruluşları, enerji kaynakları ve ulaşım imkânlarının incelenmesi, yeni yatırımların gerçek ihtiyaçlara göre planlanmasını sağlayacaktır."
 CHI_sea_industrial_research_projects_desc_SIC33_fallback:0 "[WESTHEIA_GDC33_text_3_desc]"
 CHI_sea_industrial_research_projects_desc_SIK33:0 "Ürümqi–İli karayolunun tamamlanan kesimlerini düzenli ulaşıma açacağız. Yolun ve bakım noktalarının iyileştirilmesi, ticari malların, makinelerin ve teknik personelin eyalet içinde daha kolay taşınmasını sağlayacaktır."
 CHI_sea_industrial_research_projects_desc_SIK33_fallback:0 "[WESTHEIA_XIC33_text_5_desc]"
 CHI_sea_industrial_research_projects_desc_SND33:0 "Jinan’daki makine, bakım ve imalat atölyelerinin araçlarını yenileyerek teknik bilgi birikimini artıracağız. Yerel ustalar ve eğitim kurumları arasındaki işbirliği, daha verimli üretim yöntemlerinin yaygınlaşmasına yardımcı olacaktır."
 CHI_sea_industrial_research_projects_desc_XIC33:0 "Kuzeydoğudan gelen mühendislerin bilgi birikimini yerel teknik çalışmalarla birleştireceğiz. Üretim yöntemlerinin ve makine kullanımının geliştirilmesi, sınırlı sanayimizin daha verimli çalışmasını sağlayacaktır."
 CHI_sea_industrial_research_projects_desc_XIC33_fallback:0 "[WESTHEIA_SIC33_text_1_desc]"
 CHI_sea_industrial_research_projects_desc_YUN:0 "Kunming'e yıllardır elektrik sağlayan Shilongba Santrali'nin üretim imkânlarını genişletmeli ve jeneratörlerini yenilemeliyiz. Sanayide teknik araştırmaları destekleyen bu yatırım, Yunnan'ın büyüyen tesislerine daha güvenilir bir enerji temeli sağlayacaktır."
 CHI_sea_industrial_research_projects_desc_other:0 "Modern bir endüstri olmadan diğerlerinin gerisinde kalacağız ve onsuz çok geçmeden Merkezi Hükümet tarafından geride bırakılacağız. Daha modern yöntemler ve makineler üzerine araştırmaları finanse etmek, endüstrimizi dünyanın geri kalanıyla aynı seviyede tutmaya yardımcı olacaktır."
 CHI_sea_industrial_research_projects_other:0 "Endüstriyel Araştırma Projeleri"
 CHI_sea_infantry_efforts_GDC33:0 "Yantang Askerî Eğitimini Geliştir"
 CHI_sea_infantry_efforts_GDC33_fallback:0 "[WESTHEIA_HBC33_text_6_name]"
 CHI_sea_infantry_efforts_HBC33:0 "29. Ordunun Yakın Muharebe Eğitimini Geliştir"
 CHI_sea_infantry_efforts_HBC33_fallback:0 "[WESTHEIA_SHX_focus_4Name]"
 CHI_sea_infantry_efforts_SHX:0 "Jin-Sui Ordusunun İkmalini Düzenle"
 CHI_sea_infantry_efforts_XIC33:0 "Kuzeydoğu Ordusunun İkmalini Düzenle"
 CHI_sea_infantry_efforts_XIC33_fallback:0 "[WESTHEIA_GDC33_text_5_name]"
 CHI_sea_infantry_efforts_desc_GDC33:0 "Yantang’daki askerî eğitim kurumlarında subaylarımızın mesleki bilgisini ve birlik idaresini geliştireceğiz. Daha düzenli eğitim ve ortak talim usulleri, Guangdong ordusunun piyade birlikleri arasında eşgüdümü güçlendirecektir."
 CHI_sea_infantry_efforts_desc_GDC33_fallback:0 "[WESTHEIA_HBC33_text_6_desc]"
 CHI_sea_infantry_efforts_desc_HBC33:0 "Büyük Duvar geçitlerinde görev yapacak piyadelerimizi gece baskınları ve yakın muharebe için eğiteceğiz. Tüfek, el bombası ve büyük kılıç kullanımını disiplinli birlik hareketleriyle birleştirerek kısıtlı donanımımızdan daha etkili yararlanmalıyız."
 CHI_sea_infantry_efforts_desc_HBC33_fallback:0 "[WESTHEIA_SHX_focus_4Desc]"
 CHI_sea_infantry_efforts_desc_SHX:0 "Birliklerimizin savaş gücü yalnızca silahlarına değil, cephane ve erzağın cepheye düzenli ulaşmasına da bağlıdır. Depoları ve nakliye düzenini iyileştirerek israfı azaltmalı, Jin-Sui ordusunun ikmal yükünü hafifletmeliyiz."
 CHI_sea_infantry_efforts_desc_XIC33:0 "Mançurya’daki eski üslerinden ve cephaneliklerinden kopan birliklerimizin düzenli iaşeye, mühimmat sevkiyatına ve bakıma ihtiyacı vardır. İkmal işlerini ortak bir düzen içinde yürüterek ordumuzun hareket kabiliyetini ve piyadelerimizin savaş gücünü artıracağız."
 CHI_sea_infantry_efforts_desc_XIC33_fallback:0 "[WESTHEIA_GDC33_text_5_desc]"
 CHI_sea_infantry_efforts_desc_other:0 "Piyade ordumuzun belkemiğidir. Eğitim yöntemlerimizi ve standartlarımızı iyileştirerek aktif muharebede daha da iyi performans göstermelerini sağlayabileceğiz."
 CHI_sea_infantry_efforts_other:0 "Piyade Çabaları"
 CHI_sea_long_term_economic_planning_GDC33:0 "Şeker Sanayisini Yeniden Düzenle"
 CHI_sea_long_term_economic_planning_GDC33_fallback:0 "[WESTHEIA_HBC33_text_3_name]"
 CHI_sea_long_term_economic_planning_HBC33:0 "Kailuan Madenlerinin İşletmesini İyileştir"
 CHI_sea_long_term_economic_planning_HBC33_fallback:0 "[WESTHEIA_SHX_focus_1Name]"
 CHI_sea_long_term_economic_planning_MA33_GSM:0 "Hexi Kervan Ticaretini Düzenle"
 CHI_sea_long_term_economic_planning_MA33_KHM:0 "Vaha Ticaretini Düzenle"
 CHI_sea_long_term_economic_planning_MA33_NXM:0 "Ningxia Ticaretini Düzenle"
 CHI_sea_long_term_economic_planning_MA33_XSM:0 "Yün ve Deri Ticaretini Düzenle"
 CHI_sea_long_term_economic_planning_SHX:0 "Tongpu Demiryolunun İnşasına Başla"
 CHI_sea_long_term_economic_planning_SIC33:0 "Chengdu–Chongqing Karayolunu Tamamla"
 CHI_sea_long_term_economic_planning_SIC33_fallback:0 "[WESTHEIA_GDC33_text_2_name]"
 CHI_sea_long_term_economic_planning_SIK33:0 "Ürümqi–İli Karayolunu Geliştir"
 CHI_sea_long_term_economic_planning_SIK33_fallback:0 "[WESTHEIA_SIC33_text_0_name]"
 CHI_sea_long_term_economic_planning_SND33:0 "Tarımsal Kooperatifleri Yaygınlaştır"
 CHI_sea_long_term_economic_planning_desc_GDC33:0 "Şeker kamışı üreticileriyle eyaletin şeker fabrikaları arasında düzenli bir tedarik ağı kuracağız. İşleme yöntemlerini ve satış teşkilatını geliştirerek yerli şekerin rekabet gücünü artırmalı, eyalet gelirlerini sağlamlaştırmalıyız."
 CHI_sea_long_term_economic_planning_desc_GDC33_fallback:0 "[WESTHEIA_HBC33_text_3_desc]"
 CHI_sea_long_term_economic_planning_desc_HBC33:0 "Kailuan kömür havzasındaki üretim, bakım ve sevkiyat işlerini daha verimli hâle getireceğiz. Maden işletmeleriyle ulaşım ağları arasındaki eşgüdüm, bölgenin fabrikalarına ve şehirlerine düzenli yakıt sağlanmasına yardımcı olacaktır."
 CHI_sea_long_term_economic_planning_desc_HBC33_fallback:0 "[WESTHEIA_SHX_focus_1Desc]"
 CHI_sea_long_term_economic_planning_desc_MA33_GSM:0 "Wuwei ve Jiuquan üzerinden geçen kervan yolları, Hexi ekonomisinin önemli dayanaklarıdır. Tüccarların güvenliğini sağlayarak ve yerel pazarlar arasındaki bağlantıları düzenleyerek bölgenin ticaretini canlandıracağız."
 CHI_sea_long_term_economic_planning_desc_MA33_KHM:0 "Hotan’ın tarımını, el sanatlarını ve çevre vahalarla ticaretini ortak bir düzen içinde geliştirmeliyiz. Pazarların güvenliği ve malların düzenli dolaşımı, yerel ekonominin toparlanmasını sağlayacaktır."
 CHI_sea_long_term_economic_planning_desc_MA33_NXM:0 "Tarım ürünleri, hayvanlar ve yerel atölyelerin malları için daha düzenli pazarlar oluşturmalıyız. Yinchuan ile çevre ilçeler arasındaki ticareti kolaylaştırarak eyaletin gelirlerini sağlamlaştıracağız."
 CHI_sea_long_term_economic_planning_desc_MA33_XSM:0 "Qinghai’nin sürülerinden elde edilen yün ve derilerin toplanmasını, işlenmesini ve pazarlara ulaştırılmasını düzenleyeceğiz. Üreticiler ile tüccarlar arasında daha güvenilir bağlar kurmak, eyalet gelirlerinin ve yerel geçim kaynaklarının istikrarını güçlendirecektir."
 CHI_sea_long_term_economic_planning_desc_SHX:0 "Şansi'nin sanayi merkezleri ve tarım bölgeleri arasındaki ulaşım yetersizdir. Tongpu Demiryolu için iş gücünü ve malzemeyi seferber ederek eyaletimizi kuzeyden güneye bağlayacak hattın inşasına başlamalıyız."
 CHI_sea_long_term_economic_planning_desc_SIC33:0 "Chengdu ile Chongqing arasındaki karayolunun eksik kesimlerini tamamlayacağız. Farklı askerî idarelerin bölgelerinden geçen yolun düzenlenmesi, eyaletin ticaretini ve birliklerin kara ulaşımını kolaylaştıracaktır."
 CHI_sea_long_term_economic_planning_desc_SIC33_fallback:0 "[WESTHEIA_GDC33_text_2_desc]"
 CHI_sea_long_term_economic_planning_desc_SIK33:0 "Ürümqi ile İli arasındaki ulaşım hattını düzenleyeceğiz. Yol çalışmalarını, araç tedarikini ve bakım hizmetlerini ortak bir plan içinde yürütmek, Sovyet sınırıyla ticareti ve eyalet içindeki taşımacılığı kolaylaştıracaktır."
 CHI_sea_long_term_economic_planning_desc_SIK33_fallback:0 "[WESTHEIA_XIC33_text_4_desc]"
 CHI_sea_long_term_economic_planning_desc_SND33:0 "Kırsal üreticilerin krediye, üretim araçlarına ve pazarlara erişimini kolaylaştırmalıyız. Ortak alım, ürün pazarlaması ve tasarruf faaliyetlerini destekleyerek köylerdeki üretimi eyaletin kalkınma programıyla bir araya getireceğiz."
 CHI_sea_long_term_economic_planning_desc_XIC33:0 "Eski sanayi merkezlerimizi kaybetmemiz, elimizdeki kaynakları daha dikkatli kullanmamızı gerektiriyor. Yerel üretim, ulaşım ve tedarik ihtiyaçlarını birlikte planlayarak yeni ekonomik dayanaklar oluşturacağız."
 CHI_sea_long_term_economic_planning_desc_XIC33_fallback:0 "[WESTHEIA_SIC33_text_0_desc]"
 CHI_sea_long_term_economic_planning_desc_other:0 "$CHI_long_term_economic_planning_desc$"
 CHI_sea_long_term_economic_planning_other:0 "$CHI_long_term_economic_planning$"
 CHI_sea_secure_internal_politics_HBC33:0 "Hebei–Chahar Siyasi Konseyini Kur"
 CHI_sea_secure_internal_politics_HBC33_fallback:0 "$CHI_secure_internal_politics$"
 CHI_sea_secure_internal_politics_desc_HBC33:0 "Hebei, Chahar, Beiping ve Tianjin’in idaresini ortak bir siyasi konsey altında düzenleyeceğiz. Merkezî hükûmetle bağlarımızı korurken Japon baskısı altındaki kuzey bölgelerinde askerî ve sivil makamlar arasında eşgüdüm sağlamalıyız."
 CHI_sea_secure_internal_politics_desc_HBC33_fallback:0 "$CHI_secure_internal_politics_desc$"
 CHI_warlord_army_dynamic_modifier_HBC33:0 "29. Ordu"
 CHI_warlord_army_dynamic_modifier_HBC33_fallback:0 "[ROOT.GetAdjective] Ordusu"
 CHI_warlord_army_dynamic_modifier_desc:0 "[WESTHEIA_HBC33_text_8_desc]"
 CHI_warlord_army_dynamic_modifier_desc_HBC33:0 "Eski Kuzeybatı Ordusu birliklerinden oluşturulan 29. Ordu, Song Zheyuan’ın askerî gücünün temelidir. Kısıtlı silah ve mühimmat, birliklerin eğitimini ve ikmalini zorlaştırmaktadır. Disiplin, teşkilat ve savunma hazırlıklarını geliştirerek ordumuzu güçlendirmeliyiz."
 CHI_warlord_army_dynamic_modifier_desc_HBC33_fallback:0 ""
 CHI_warlord_looting_idea_XIC33:0 "Sürgün Ordusunun Yükü"
 CHI_warlord_looting_idea_XIC33_fallback:0 "Sıradanlaşan Yağma"
 CHI_warlord_looting_idea_desc_XIC33:0 "Kuzeydoğudaki üslerinden ayrılan birliklerimizin iaşesi ve barındırılması, yerel halk ile idarelerin omuzlarına ağır bir yük bindirmektedir. Orduyu beslemek için başvurulan düzensiz tahsilat ve el koymalar, üretimi ve günlük hayatı zorlaştırmaktadır."
 CHI_warlord_looting_idea_desc_XIC33_fallback:0 "Tüm askeri güçlerimiz üzerindeki moral ve genel kontrol eksikliğinden dolayı, yerel ürünlerin yağmalanması sıradan bir durumdur. İstikrarlı bir eyalet yaratmak istiyorsak buna bir son vermeliyiz."
 CHI_warlord_state_idea_desc_HBC33:0 "Yönetimimiz, Çin Cumhuriyeti içindeki bölgesel askerî otoriteye dayanmaktadır. Merkezî hükûmetle kurulan bağlar, yerel komutanların nüfuzu ve sivil idarenin sınırlı imkânları arasında denge sağlamak zorundayız. Bölgenin kurumları henüz bütünlüklü bir yönetim oluşturacak kadar güçlü değildir."
 CHI_warlord_state_idea_desc_HBC33_fallback:0 "Devletimiz, kelimenin tanımından çok uzak. Burası, hiçbir devlete sadakat yemini etmeyen bağımsız bir ordunun koruması altında günlük yaşamlarını sürdüren bir bölge ve halk. Bu, hükûmet olarak yapabileceğimiz çok az şey olmasına yol açıyor, ama aynı zamanda iyi yanları da var."
 CHL_willys_famae_corvo_organization_desc:0 "Ordunun motorlu araçları için bakım, onarım ve parça uyarlama atölyeleri."
