 WESTHEIA_1933_TEST_DESC:0 "Büyük Savaş’ın yaraları henüz kapanmadan, Büyük Buhran ulusları yeni bir umutsuzluğa sürüklüyor. İşsizlik ve yoksulluk hükümetleri sarsarken, parlamentolara duyulan güven yerini radikal vaatlere bırakıyor. Almanya’da Versailles düzenine öfke büyüyor, İtalya’da faşizm kök salıyor ve Japonya’nın Mançurya’daki ilerleyişi Uzak Doğu’daki dengeleri altüst ediyor. Milletler Cemiyeti barışı korumaya çalışsa da eski düzenin temelleri çatırdıyor. Dünya henüz yeni bir savaşa hazır değil; fakat barışın ne kadar daha dayanacağını kimse bilmiyor."
