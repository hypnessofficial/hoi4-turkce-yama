 CHI_sea_develop_capital_arsenal_MA33_NXM:0 "Eyalet Silah Atölyelerini Düzenle"
 CHI_sea_develop_capital_arsenal_MA33_XSM:0 "Eyalet Silah Atölyelerini Düzenle"
 CHI_sea_develop_capital_arsenal_SHX:0 "Taiyuan Cephaneliğini Modernleştir"
 CHI_sea_develop_capital_arsenal_SND33:0 "Jinan Cephaneliğinin İdaresini Devral"
 CHI_sea_develop_capital_arsenal_XIC33:0 "Kuzeydoğu Ordusunun Onarım Atölyelerini Kur"
 CHI_sea_develop_capital_arsenal_XIC33_fallback:0 "[WESTHEIA_GDC33_text_1_name]"
 CHI_sea_develop_capital_arsenal_desc_GDC33:0 "Shijing Cephaneliğinin mevcut tüfek ve mühimmat üretimini geliştireceğiz. Tezgâhların bakımı, işçilerin eğitimi ve düzenli malzeme tedariki, Guangdong ordusunun dışarıdan alınan silahlara bağımlılığını azaltacaktır."
 CHI_sea_develop_capital_arsenal_desc_GDC33_fallback:0 "[WESTHEIA_HBC33_text_2_desc]"
 CHI_sea_develop_capital_arsenal_desc_GXC:0 "Nanning’deki silah ve mühimmat atölyelerinin araçlarını yenilemeli ve üretim imkânlarını genişletmeliyiz. Düzenli bakım ve daha sağlam bir imalat düzeni, Guangxi ordusunun yerel ikmal kaynaklarını güçlendirecektir."
 CHI_sea_develop_capital_arsenal_desc_HBC33:0 "Ordumuzun silah ve mühimmat ihtiyacını karşılamak için yerel tamir ve imalat atölyelerini genişleteceğiz. Takım tezgâhlarını, malzeme tedarikini ve usta eğitimini düzenli bir üretim programında birleştirmeliyiz."
 CHI_sea_develop_capital_arsenal_desc_HBC33_fallback:0 "[WESTHEIA_SHX_focus_3Desc]"
 CHI_sea_develop_capital_arsenal_desc_MA33_GSM:0 "Ordunun silahlarını onaran ve mühimmatını hazırlayan küçük atölyeleri daha düzenli bir üretim yapısı içinde bir araya getireceğiz. Bakım araçlarını ve imalat imkânlarını geliştirerek dışarıdan gelen silahlara bağımlılığımızı azaltmalıyız."
 CHI_sea_develop_capital_arsenal_desc_MA33_KHM:0 "Ordunun silahlarını onaran ve mühimmatını hazırlayan küçük atölyeleri daha düzenli bir üretim yapısı içinde bir araya getireceğiz. Bakım araçlarını ve imalat imkânlarını geliştirerek dışarıdan gelen silahlara bağımlılığımızı azaltmalıyız."
 CHI_sea_develop_capital_arsenal_desc_MA33_NXM:0 "Ordunun silahlarını onaran ve mühimmatını hazırlayan küçük atölyeleri daha düzenli bir üretim yapısı içinde bir araya getireceğiz. Bakım araçlarını ve imalat imkânlarını geliştirerek dışarıdan gelen silahlara bağımlılığımızı azaltmalıyız."
 CHI_sea_develop_capital_arsenal_desc_MA33_XSM:0 "Ordunun silahlarını onaran ve mühimmatını hazırlayan küçük atölyeleri daha düzenli bir üretim yapısı içinde bir araya getireceğiz. Bakım araçlarını ve imalat imkânlarını geliştirerek dışarıdan gelen silahlara bağımlılığımızı azaltmalıyız."
 CHI_sea_develop_capital_arsenal_desc_SHX:0 "Taiyuan'da yeniden başlayan silah ve mühimmat üretimini daha sağlam bir temele oturtmalıyız. Atölyeleri genişletmek, üretim araçlarını yenilemek ve topçu imalatındaki tecrübemizi geliştirmek Jin-Sui ordusunun ihtiyaçlarını karşılamamızı sağlayacaktır."
 CHI_sea_develop_capital_arsenal_desc_SND33:0 "Merkezî yönetimle anlaşarak Jinan cephaneliğinin idaresini 3. Yol Ordusu bünyesinde üstleneceğiz. Mevcut tesisleri ve iş gücünü düzenli bir üretim programına bağlamak, ordumuzun silah ve mühimmat ihtiyacının karşılanmasını kolaylaştıracaktır."
 CHI_sea_develop_capital_arsenal_desc_XIC33:0 "Mançurya’daki cephaneliklerimizi kaybettikten sonra elimizdeki silahları hizmette tutmak hayati önem taşımaktadır. Yeni onarım atölyeleri kurarak bakım, yedek parça ve küçük ölçekli askerî üretim imkânlarımızı geliştireceğiz."
 CHI_sea_develop_capital_arsenal_desc_XIC33_fallback:0 "[WESTHEIA_GDC33_text_1_desc]"
 CHI_sea_develop_capital_arsenal_desc_other:0 "Bir Cephanelik olmadan ordumuz olmaz ve ordumuz olmadan devletimiz olmaz. Hayatta kalmamızı sağlamak için bu nedenle endüstriyel yeteneklerimizi genişletmeliyiz."
 CHI_sea_develop_capital_arsenal_other:0 "[ROOT.Capital.GetName] Cephaneliğini Genişlet"
 CHI_sea_expand_public_education_GDC33:0 "Sun Yat-sen Üniversitesinin Shipai Yerleşkesini Genişlet"
 CHI_sea_expand_public_education_GDC33_fallback:0 "[WESTHEIA_HBC33_text_5_name]"
 CHI_sea_expand_public_education_GXC:0 "Guangxi Üniversitesini Destekle"
 CHI_sea_expand_public_education_HBC33:0 "Nankai Üniversitesiyle İşbirliğini Geliştir"
 CHI_sea_expand_public_education_HBC33_fallback:0 "[WESTHEIA_GXC_education_name]"
 CHI_sea_expand_public_education_MA33_GSM:0 "Hexi Okullarını Destekle"
 CHI_sea_expand_public_education_MA33_KHM:0 "Hotan Eğitimini Geliştir"
 CHI_sea_expand_public_education_MA33_NXM:0 "Ningxia Eğitimini Geliştir"
 CHI_sea_expand_public_education_MA33_XSM:0 "Qinghai Okullarını Destekle"
 CHI_sea_expand_public_education_SIC33:0 "Chongqing Üniversitesinin Shapingba Yerleşkesini Genişlet"
 CHI_sea_expand_public_education_SIC33_fallback:0 "[WESTHEIA_GDC33_text_4_name]"
 CHI_sea_expand_public_education_SIK33:0 "Sinkiang Kolejini Yeniden Düzenle"
 CHI_sea_expand_public_education_SIK33_fallback:0 "[WESTHEIA_XIC33_text_6_name]"
 CHI_sea_expand_public_education_SND33:0 "Köy Öğretmen Okullarını Destekle"
 CHI_sea_expand_public_education_XIC33:0 "Sürgündeki Kuzeydoğu Üniversitesini Destekle"
 CHI_sea_expand_public_education_XIC33_fallback:0 "[WESTHEIA_SIC33_text_2_name]"
 CHI_sea_expand_public_education_desc_GDC33:0 "Sun Yat-sen Üniversitesinin Shipai’de yürüttüğü yerleşke çalışmalarını destekleyeceğiz. Yeni eğitim ve araştırma imkânları, eyaletimizin ihtiyaç duyduğu mühendislerin, ziraat uzmanlarının ve idarecilerin yetişmesine katkıda bulunacaktır."
 CHI_sea_expand_public_education_desc_GDC33_fallback:0 "[WESTHEIA_HBC33_text_5_desc]"
 CHI_sea_expand_public_education_desc_GXC:0 "Mevcut üniversitemize kaynak sağlayarak öğretim kadrosunu ve araştırma imkânlarını güçlendireceğiz. Eyaletin ihtiyaç duyduğu teknik ve idari personeli yetiştirmek, kalkınma programımızın kalıcı olmasını sağlayacaktır."
 CHI_sea_expand_public_education_desc_HBC33:0 "Nankai Üniversitesiyle sanayi kuruluşları arasındaki bağları güçlendireceğiz. Uygulamalı kimya, mühendislik ve ekonomi alanlarındaki araştırmalar, bölgenin ihtiyaç duyduğu yetişmiş insan gücüne ve teknik çözümlere katkı sağlayacaktır."
 CHI_sea_expand_public_education_desc_HBC33_fallback:0 "[WESTHEIA_GXC_education_desc]"
 CHI_sea_expand_public_education_desc_MA33_GSM:0 "Wuwei ve çevresindeki yerel okullara kaynak sağlayarak öğretmenleri ve öğrencileri destekleyeceğiz. Temel eğitimi ve teknik bilgiye erişimi genişletmek, bölgenin idari ve ekonomik gelişmesine katkıda bulunacaktır."
 CHI_sea_expand_public_education_desc_MA33_KHM:0 "Yerel okulların ve eğitim kurumlarının araç ve öğretmen ihtiyacını karşılamalıyız. Temel eğitimle birlikte idari ve teknik bilgiyi yaygınlaştırarak Hotan’ın yeniden yapılanması için gerekli kadroları yetiştireceğiz."
 CHI_sea_expand_public_education_desc_MA33_NXM:0 "Yinchuan ve ilçelerdeki okulları destekleyerek öğretmen eksikliğini gidermeli ve daha fazla çocuğa eğitim sağlamalıyız. Okuryazarlığın yaygınlaşması, eyalet idaresinin ve yerel üretimin ihtiyaç duyduğu personelin yetişmesine yardımcı olacaktır."
 CHI_sea_expand_public_education_desc_MA33_XSM:0 "Eyaletteki yerel okulların ve Hui eğitim kurumlarının öğretmen ve malzeme ihtiyacını karşılamalıyız. Temel öğretimin yanında idari ve teknik eğitim imkânlarını genişleterek Qinghai’nin ihtiyaç duyduğu yetişmiş personeli artıracağız."
 CHI_sea_expand_public_education_desc_SIC33:0 "Chongqing Üniversitesinin Shapingba’daki yeni yerleşkesinin gelişmesini destekleyeceğiz. Eğitim ve araştırma tesislerinin genişletilmesi, eyaletin ihtiyaç duyduğu teknik uzmanların ve idarecilerin yetişmesine katkıda bulunacaktır."
 CHI_sea_expand_public_education_desc_SIC33_fallback:0 "[WESTHEIA_GDC33_text_4_desc]"
 CHI_sea_expand_public_education_desc_SIK33:0 "Mevcut Rus dili, hukuk ve siyaset eğitimi kurumunu Sinkiang Koleji olarak yeniden düzenleyeceğiz. Öğretim kadrosunun ve eğitim imkânlarının geliştirilmesi, eyaletin ihtiyaç duyduğu idarecilerin ve uzmanların yetişmesine katkıda bulunacaktır."
 CHI_sea_expand_public_education_desc_SIK33_fallback:0 "[WESTHEIA_XIC33_text_6_desc]"
 CHI_sea_expand_public_education_desc_SND33:0 "Eyaletin köy okullarında görev yapacak öğretmenleri yetiştirmek için öğretmen okullarına ve eğitim çalışmalarına kaynak ayıracağız. Okuryazarlığı ve uygulamalı bilgiyi yaygınlaştırmak, kırsal kalkınmanın ihtiyaç duyduğu yetişmiş insan gücünü sağlayacaktır."
 CHI_sea_expand_public_education_desc_XIC33:0 "Japon işgalinin ardından Kuzeydoğu Üniversitesi eğitimini sürgünde sürdürmektedir. Öğretim üyelerinin ve öğrencilerin çalışmalarını destekleyerek bilimsel birikimimizin dağılmasını önleyecek, gelecekte ülkemizin ihtiyaç duyacağı uzmanları yetiştireceğiz."
 CHI_sea_expand_public_education_desc_XIC33_fallback:0 "[WESTHEIA_SIC33_text_2_desc]"
 CHI_sea_expand_public_education_desc_other:0 "Eğitime erişimi olan bir nüfus olmadan diğer ulusların gerisinde kalırız. Ulusumuzun refahını sağlamak için bu nedenle halk eğitimine yatırım yapmalıyız."
 CHI_sea_expand_public_education_other:0 "Halk Eğitimini Genişlet"
 CHI_sea_fortification_efforts_HBC33:0 "Büyük Duvar Geçitlerini Tahkim Et"
 CHI_sea_fortification_efforts_HBC33_fallback:0 "Tahkimat Çabaları"
 CHI_sea_fortification_efforts_desc_HBC33:0 "Kuzeyden yaklaşan saldırıları karşılamak için Büyük Duvar hattındaki önemli geçitleri güçlendireceğiz. Mevzi, siper ve ikmal hazırlıklarını birlikte yürütmek, sınırlı kuvvetlerimizin savunma imkânlarını artıracaktır."
 CHI_sea_fortification_efforts_desc_HBC33_fallback:0 "Konumumuz şimdilik güvenli kalsa da sınırlarımızı son adama kadar savunmamız gereken bir zaman gelebilir. Bu nedenle sınırlarımızı tahkim etmemiz ve kendimizi siperlere yerleştirmemiz gerektiği açıktır."
 CHI_sea_further_industrial_investment_GDC33:0 "Xicun Çimento Sanayisini Genişlet"
 CHI_sea_further_industrial_investment_GDC33_fallback:0 "[WESTHEIA_HBC33_text_1_name]"
 CHI_sea_further_industrial_investment_GXC:0 "Liuzhou Makine Fabrikasını Genişlet"
 CHI_sea_further_industrial_investment_HBC33:0 "Tianjin Tekstil ve Kimya Sanayisini Genişlet"
 CHI_sea_further_industrial_investment_HBC33_fallback:0 "[WESTHEIA_SHX_focus_0Name]"
 CHI_sea_further_industrial_investment_SHX:0 "Kuzeybatı Sanayi Şirketini Kur"
 CHI_sea_further_industrial_investment_SND33:0 "Jinan Tekstil Sanayisini Genişlet"
 CHI_sea_further_industrial_investment_YUN:0 "Gejiu Kalay Rafinerilerini Modernleştir"
 CHI_sea_further_industrial_investment_desc_GDC33:0 "Guangzhou’nun çimento üretimini Xicun tesisleri çevresinde genişleteceğiz. Henan’daki işletmenin birleştirilmesi ve üretim araçlarının yenilenmesi, eyaletin inşaat ihtiyaçlarını yerel sanayiyle karşılamamızı sağlayacaktır."
 CHI_sea_further_industrial_investment_desc_GDC33_fallback:0 "[WESTHEIA_HBC33_text_1_desc]"
 CHI_sea_further_industrial_investment_desc_GXC:0 "Liuzhou’daki makine fabrikasının atölyelerini ve üretim araçlarını genişleterek eyaletimizin küçük sanayi tabanını güçlendireceğiz. Mevcut teknik birikimi daha fazla üretime dönüştürmek, halkın ve ordunun ihtiyaçlarının yerel kaynaklarla karşılanmasını sağlayacaktır."
 CHI_sea_further_industrial_investment_desc_HBC33:0 "Tianjin’in iplik, dokuma, gıda ve kimya işletmelerinin üretim kapasitesini genişleteceğiz. Yerel girişimcilerle işbirliği yaparak mevcut sanayi birikimini daha güçlü ve çeşitli bir üretim ağına dönüştürmeliyiz."
 CHI_sea_further_industrial_investment_desc_HBC33_fallback:0 "[WESTHEIA_SHX_focus_0Desc]"
 CHI_sea_further_industrial_investment_desc_SHX:0 "Madenleri, enerji üretimini ve imalat tesislerini ortak bir idare altında toplayarak Şansi'nin sanayileşmesini hızlandırmalıyız. Kuzeybatı Sanayi Şirketi, eyaletimizin kaynaklarını üretime dönüştürecek ve dışarıya bağımlılığımızı azaltacaktır."
 CHI_sea_further_industrial_investment_desc_SND33:0 "Jinan’daki iplik, dokuma ve işleme işletmelerinin üretim imkânlarını genişleteceğiz. Mevcut sanayi birikimini ve yerel ticaret ağlarını destekleyerek eyaletimizin ekonomik temelini güçlendirmeliyiz."
 CHI_sea_further_industrial_investment_desc_XIC33:0 "Kuzeydoğudan ayrılan teknik personelin ve yerel işletmelerin imkânlarını bir araya getirerek denetimimizdeki bölgelerde üretimi geliştireceğiz. Kaybettiğimiz Mançurya sanayisinin yerini bir anda dolduramasak da yeni yatırımlar ordumuzun ve sivil idarenin ihtiyaçlarını karşılamaya yardımcı olacaktır."
 CHI_sea_further_industrial_investment_desc_XIC33_fallback:0 "[WESTHEIA_GDC33_text_0_desc]"
 CHI_sea_further_industrial_investment_desc_YUN:0 "Gejiu'nun kalayı eyaletimizin en önemli ihraç ürünlerinden biridir. Rafinerilerde kullanılan araçları yenileyip işleme kapasitesini artırarak daha nitelikli ürün elde edecek ve yerel sanayimizin gelirlerini güçlendireceğiz."
 CHI_sea_further_industrial_investment_desc_other:0 "Küçük bir sanayimiz olsa da Merkezi Hükümetin sanayisiyle boy ölçüşemez. Bu nedenle sanayimize daha fazla yatırım yapmalıyız."
 CHI_sea_further_industrial_investment_other:0 "Daha Fazla Sanayi Yatırımı"
