 WESTHEIA_YUN_develop_yunnan:0 "Yunnan İlini Geliştir"
 WESTHEIA_YUN_develop_yunnan_desc:0 "Sağlam bir sanayi tabanı olmadan eyaletimizin bağımsız hareket etme imkânını koruyamayız. Yeni mali düzenin sağladığı kaynakları başkent çevresindeki üretim tesislerine ve yerel yatırımlara yönlendirmeliyiz."
 WESTHEIA_YUN_fudian_reorganization:0 "Fudian Bankası Reformları"
 WESTHEIA_YUN_fudian_reorganization_desc:0 "Bankanın hesaplarının ve kredi işlemlerinin yeniden düzenlenmesi, eyaletin mali kaynaklarının daha verimli kullanılmasını sağlıyor. Ticaret gelirlerinin daha düzenli toplanması, ekonominin üzerindeki yükü hafifletiyor."
 WESTHEIA_YUN_reorganize_fudian_bank:0 "Fudian Yeni Bankasını Yeniden Düzenle"
 WESTHEIA_YUN_reorganize_fudian_bank_desc:0 "Yeni bankanın sağlam bir mali idareye ihtiyacı var. Hesapları denetleyerek, kredi düzenini iyileştirerek ve ihracat gelirlerini daha etkili kullanarak eyaletimizin mali yapısını güçlendireceğiz."
 WESTHEIA_austrofascism_neutrality:0 "Avusturya Faşizmi"
 WESTHEIA_austrofascism_neutrality_desc:0 "§YAvusturya Faşizmi§!\n\n\n\n\n\n\n\n\n£GFX_westheia_real_banner_austrofascism\n\n\n\n\n\n\n\n\n\nKatolik toplumsal düşüncesini korporatif kurumlar, güçlü yürütme ve Avusturya devletinin bağımsızlığıyla birleştirir. Parlamento yerine otoriter bir meslekler devleti kurarken sosyalist ve Nazi muhalefetini bastırır."
 WESTHEIA_metaxism_neutrality:0 "Metaksizm"
 WESTHEIA_metaxism_neutrality_desc:0 "§YMetaksizm§!\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n£GFX_westheia_real_banner_metaxism\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nMilliyetçiliği, antikomünizmi ve korporatif toplumsal örgütlenmeyi güçlü yürütme altında birleştirir. Monarşik çerçeveyi koruyan otoriter yönetim, siyasi rekabeti sınırlandırır ve ulusal yenilenmeyi devlet eliyle yönlendirir."
 WarExhaustionMechanicLoc:0 "Teslimiyet İlerlemesi"
 WarExhaustionMechanicLoc2:0 "Savaş Yorgunluğu"
 XIC_northwest_bandit_suppression_headquarters_XIC33:0 "Kuzeybatı Haydut Bastırma Karargâhını Kur"
 XIC_northwest_bandit_suppression_headquarters_XIC33_fallback:0 "Haydut Bastırma Karargahı"
 XIC_northwest_bandit_suppression_headquarters_desc_XIC33:0 "Kuzeydoğu Ordusunun kuzeybatıya sevkiyle birlikte komünistlere karşı harekâtı ortak bir karargâhtan yöneteceğiz. Zhang Xueliang’ın komutası altında birliklerin eşgüdümünü sağlayacak ve bölgedeki askerî hazırlıkları genişleteceğiz."
 XIC_northwest_bandit_suppression_headquarters_desc_XIC33_fallback:0 "Shaanxi'deki komünistlere yönelik operasyonlarımız durdu ve sadece 1935'in ikinci yarısında bölgede bir piyade tümeni ve bir alay kaybettik. Subaylarımızdan ve askerlerimizden komünistlere karşı sonuçsuz savaşı durdurmamız ve kuzeydoğudaki kayıp illerimizin restorasyonuna odaklanmamız yönündeki artan baskıyla bir seçim yapmamız gerekiyor."
 XSM_send_ma_lin_on_hajj_desc_MA33:0 "Ma Lin ile Ma Bufang arasındaki iktidar mücadelesini sona erdirmek için sivil valinin hac yolculuğunu destekleyeceğiz. Ma Lin’in eyaletten ayrılmasıyla yönetim Ma Bufang’ın elinde toplanacak; Nanjing’in resmî ataması ise ayrı bir mesele olarak kalacaktır."
 XSM_send_ma_lin_on_hajj_desc_MA33_original:0 "Ma Lin zamanının dolduğunu biliyor, ancak onu herhangi bir sebep olmadan görevden almak yine de halkı kızdıracaktır. Bu nedenle onu Hacca gitme bahanesiyle pozisyonundan vazgeçmeye zorlamalıyız."
 XSM_sweep_out_communists_MA33:0 "Komünist Sızmalara Karşı Hazırlan"
 XSM_sweep_out_communists_MA33_original:0 "Komünistleri Süpür"
 XSM_sweep_out_communists_desc_MA33:0 "Komünist örgütlerin eyaletimizde taraftar toplamasına ve yerel yönetimi zayıflatmasına izin veremeyiz. Güvenlik birimleri arasındaki işbirliğini artırarak propaganda ve örgütlenme faaliyetlerine karşı hazırlık yapacağız."
 XSM_sweep_out_communists_desc_MA33_original:0 "Sovyet Cumhuriyeti'nin eline düşmeyeceksek Zhang Guotao ve onun komünist grubunu kovmak en büyük önceliktir. Bu nedenle topraklarımızdan kalan tüm komünistleri süpürmeliyiz."
 YUG_1933_agrarian_banking_crisis:0 "Tarım ve Bankacılık Krizi"
 YUG_1933_agrarian_banking_crisis_desc:0 "Dünya piyasalarında tarım ürünlerinin değer kaybetmesi, Yugoslav köylüsünün gelirini ve ülkenin ihracat kazancını eritti. Borçların ödenememesi ve yabancı sermayenin çekilmesi bankaları sarsarken, çiftçi borçlarına getirilen moratoryum krizin yükünü ortadan kaldıramadı. Daralan iç pazar ve kredi sıkıntısı sanayi üretimini ve yeni yatırımları yavaşlatıyor."
 YUG_1933_royal_dictatorship:0 "Kraliyet Diktası"
 YUG_1933_royal_dictatorship_desc:0 "Parlamenter siyaseti askıya alarak yönetimi kendi elinde toplayan kral, devletin birliğini güçlü bir merkezî otoriteyle korumayı amaçlıyor. Sarayın kararlı tutumu hükûmetin hareket alanını genişletse de siyasi ve millî ayrılıkları ortadan kaldırmaya yetmiyor."
