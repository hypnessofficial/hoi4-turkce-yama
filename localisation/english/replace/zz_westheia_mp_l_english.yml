 power_grid_interconnection:0 "Elektrik Şebekelerinin Birleştirilmesi"
 power_grid_interconnection_desc:0 "Yüksek gerilim hatları bölgesel şebekeleri birbirine bağlar. Böylece barajlarda üretilen elektrik, uzak bölgelerdeki fabrikalara taşınabilir."
 power_high_pressure_boilers:0 "Yüksek Basınçlı Kazanlar"
 power_high_pressure_boilers_desc:0 "İnce öğütülmüş kömür yakıp buhar basıncını yükselterek santrallerimizin her ton yakıttan daha fazla enerji elde etmesini sağlayabiliriz."
 power_hydrogen_cooled_generators:0 "Hidrojenle Soğutulan Jeneratörler"
 power_hydrogen_cooled_generators_desc:0 "Jeneratör gövdelerini hava yerine hidrojenle doldurmak, ısının daha etkili biçimde uzaklaştırılmasını sağlar ve iç direnci azaltır. Böylece jeneratörler aşırı ısınmadan daha fazla elektrik üretebilir."
 power_large_hydro_turbines:0 "Büyük Hidroelektrik Türbinleri"
 power_large_hydro_turbines_desc:0 "En büyük barajlarımız için tasarlanan dev Francis ve Kaplan türbinleri, yüksekten akan büyük su kütlelerinden daha önce görülmemiş bir verimlilikle elektrik üretir."
 power_plant:0 "Elektrik Santrali"
 power_plant_desc:0 "Sanayimiz için elektrik üretir. Üretim kapasitesi bölgenin arazi yapısına bağlıdır; dağlar, tepeler, ormanlar ve nehirler üretimi artırır. Yerel petrol sahaları her santral seviyesine ek üretim sağlar."
 power_plant_plural:0 "Elektrik Santralleri"
 power_steam_reheating:0 "Buharın Yeniden Isıtılması"
 power_steam_reheating_desc:0 "Kısmen genleşen buharı türbine yeniden girmeden önce kazanda tekrar ısıtmak, yakılan her birim yakıttan daha fazla enerji elde edilmesini sağlar."
 power_supercritical_steam:0 "Süperkritik Buhar"
 power_supercritical_steam_desc:0 "Çok yüksek basınç ve sıcaklıklarda suyun sıvı ve gaz hâlleri arasındaki sınır ortadan kalkar. Bu koşullara dayanacak şekilde tasarlanan santraller, her ton kömürden daha fazla enerji üretir."
