 marines_expeditionary_desc:0 "Koordineli saldırılar, geliştirilmiş disiplinlerarası planlama ve lojistikten faydalanır. Doktrin felsefemiz geliştikçe, bu görev güçlerine daha fazla destek sağlamak bize kesinlikle fayda sağlayacaktır."
