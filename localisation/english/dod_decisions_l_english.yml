 YUG_arm_communist_militants:0 "[YUG_communist_coup_target.GetAdjective] Militanları Silahlandır"
 YUG_arm_communist_militants_desc:0 "Devrimi sınırlar ötesindeki yoldaşlarımıza sadece sözlerle getiremeyiz. Müttefiklerimize efendilerini devirmek için ihtiyaç duydukları silahları sağlamalıyız."
