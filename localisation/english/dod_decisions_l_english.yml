 YUG_communist_coup:0 "Komünist Darbe Kışkırt"
 YUG_communist_coup_desc:0 "Yeterince hazırlandılar, şimdi tek yapmamız gereken sınırlarımızdaki militanlara onayımızı vermek ve onlar da yozlaşmış kapitalist hükümetlerine karşı bir darbe girişiminde bulunacaklar!"
 YUG_instigate_in_albania:0 "Arnavutluk'ta Köylü Ayaklanmaları Kışkırt"
 YUG_instigate_in_albania_desc:0 "Arnavut halkı kendilerini Slav olarak tanımlamasa da, sınırımıza olan yakınlıkları ve Arnavutlar ile Güney Slavlar arasındaki kültürel alışveriş, onları Pan-Slav İşçi Kongresi'ne katılmak için ideal bir aday haline getiriyor."
 YUG_instigate_in_bulgaria:0 "Bulgaristan'da Köylü Ayaklanmaları Kışkırt"
 YUG_instigate_in_bulgaria_desc:0 "Güney Slav işçilerinin neredeyse tamamı devletimiz tarafından özgürleştirildi, Bulgarlar hariç. Ancak Bulgarları ezenlere karşı ayaklanmaya teşvik ederek Balkanların Slav işçilerini gerçekten özgürleştirdiğimizi iddia edebiliriz."
