 YUG_propaganda_in_target_desc:0 "Hedefimiz seçildi, şimdi tek yapmamız gereken sosyalist müttefiklerimize etkili propaganda sağlamak ve çok geçmeden Balkanların üst sınıflarını devirmek için gerekli isyan tohumlarını ekmiş olacağız."
