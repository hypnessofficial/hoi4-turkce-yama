 ROM_change_sides_to_allies_desc:0 "Hükümetimizdeki değişiklikler, savaştaki hizalanmamızda bir değişikliği kolaylaştırdı. Müttefiklere katılarak, bu küresel çaptaki çatışmadaki mevcut “yoldaşlarımız”, Romen mermilerinin yeni bir hedef bulmasıyla şaşkınlığa uğrayacak."
