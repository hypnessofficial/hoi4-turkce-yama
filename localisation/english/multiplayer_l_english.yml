 OOS_DESC:0 "$WHO|H$ artık doğru oyun durumuna sahip değil.\n$DUMP_INFO$\nTeknik bilgi:\n$INFO$\n\n Sunucu artık tüm oyuncuların doğru bir oyun durumuna sahip olduğunu garanti edemez. Olası çözümler: \n 1. Sunucu oyunu yeniden senkronize edebilir. \n 2. Oyuncu oyundan ayrılıp, eğer anında katılım (hotjoin) etkinse yeniden bağlanabilir.\n 3. Sunucu oyunu yeniden kurabilir. \n 4. Bozuk bir oyun durumuyla oynamaya devam edin. (Tavsiye edilmez. Muhtemelen daha sonra çökmeyle sonuçlanacaktır.)"
