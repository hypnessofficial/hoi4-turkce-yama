l_english:
 DEN_aalborg_portland_cement_plant:0 "Aalborg Portland Çimento Fabrikası"
 DEN_aalborg_portland_cement_plant_desc:0 "Anakara Danimarka doğal kaynaklar açısından fakirdir, ancak çimento üretimi sahip olduğumuz bir varlıktır. Aalborg Portlands Çimento Fabrikası'nı genişleterek yerli inşaat kabiliyetlerimizi güvence altına alırdık."
 DEN_acquire_military_equipment:0 "Askerî Teçhizat Edin"
 DEN_acquire_military_equipment_desc:0 "Daha küçük bir ulus olarak, silah üretme yeteneğimiz sınırlıdır - ancak [?DEN.DEN_overlord_nation.GetFactionName] savaş çabasına gerçekten katkıda bulunmak için piyasadaki mümkün olan en iyi teçhizatı edinmeliyiz. Belki müttefiklerimizi sübvanse edilmiş bir anlaşmayla bize gerekli silahları sağlamaya ikna edebiliriz."
 DEN_add_basic_submarine_tech_tt:0 "Teknoloji Ekle: §YHavmanden Sınıfı§!"
 DEN_add_flyvevabnet_dynamic_modifier:0 "§Y$DEN_flyvevabnet_dynamic_modifier$§! ekle, şunları sağlar"
 DEN_add_haeren_dynamic_modifier:0 "§Y$DEN_haeren_dynamic_modifier$§! ekle, şunları sağlar"
 DEN_add_sovaernet_dynamic_modifier:0 "§Y$DEN_sovaernet_dynamic_modifier$§! ekle, şunları sağlar"
 DEN_add_war_preparations_dynamic_modifier:0 "§Y$DEN_war_preparations_dynamic_modifier$§! ekle, şunları sağlar"
 DEN_adjust_industrial_prioritize:0 "Endüstriyel Öncelikleri Ayarla"
 DEN_adjust_industrial_prioritize_desc:0 "Savaş kapımızda ve sanayilerimizi savaş çabalarına üretmek ve katkıda bulunmak üzere ayarlayarak buna göre hareket etmeliyiz. Her erkek ve kadın, ülkenin ihtiyacına hizmet etmek için görevini şikayetsiz anlamalı ve yerine getirmelidir."
 DEN_advanced_flight:0 "İleri Uçuş"
 DEN_advanced_flight_desc:0 "Havacılık son birkaç yılda hızlı bir ilerleme kaydetti, ancak hala daha fazla yenilik ve iyileştirme bizi bekliyor. Gökyüzüne gerçekten hükmetmek için, teknolojik ilerlemede öncülük etmeliyiz!"
 DEN_advanced_flight_modifier_tt:0 "$DEN_modify_flyvevabnet_dynamic_modifier$: \n$MODIFIER_AIR_MISSION_EFFICIENCY$: §G+%5.0§! \n$MODIFIER_AIR_NIGHT_PENALTY$: §G-%5.00§! \n$MODIFIER_AIR_WEATHER_PENALTY$: §G-%5.00§!\n\n"
 DEN_agricultural_reinvestments:0 "Tarımsal Yeniden Yatırımlar"
 DEN_agricultural_reinvestments_desc:0 "Tarım, ithal ettiğimiz ve kullandığımız yeni makinelerin mekanizasyonu ve tanıtımıyla daha verimli hale geldi. Bu sektörden artan vergi gelirini yeniden yatırmak, verimliliği daha da artırabilir."
 DEN_agricultural_subsidies:0 "Tarımsal Sübvansiyonlar"
 DEN_agricultural_subsidies_desc:0 "Çiftçilerimiz borç krizleri ve hacizlerle mücadele ediyor. Bir süredir aralarında bir çaresizlik ve öfke duygusu kaynıyor ve kontrolsüz bırakılırsa daha tehlikeli bir şeye dönüşme riski taşıyor. Bu durumu ele almalı ve tarım sektörüne elimizden geldiğince yardım etmeliyiz."
 DEN_agricultural_subsidies_modifier_tt:0 "$DEN_modify_economic_crisis_dynamic_modifier$ \n$MODIFIER_GLOBAL_MONTHLY_POPULATION$: §G+%10.0§!\n\n"
 DEN_air_force_power_projection:0 "Hava Kuvveti Güç Yansıtma"
 DEN_air_force_power_projection_desc:0 "Şimdi Flyvevåbnet'i ordumuzun üçüncü büyük kolu olarak birleştirdiğimize göre, yaygın krallığımızın gökyüzünü güvence altına almaya odaklanabiliriz. Geniş ve başarılı bir hava kuvveti hala inebileceği ve kalkabileceği hava üslerine bağlıdır."
 DEN_align_industries:0 "Sanayileri Ulusal Çıkarlara Hizala"
 DEN_align_industries_desc:0 "Verimli kaynak tahsisi ve odaklanmış endüstriyel çıktı ihtiyacı her şeyden önemli hale geldi. Çabalarımızı koordine ederek ve üretimi düzene sokarak, her fabrikanın, her işçinin ve her kaynağın [DEN.GetNameDef] hizmetinde tam potansiyeline kadar kullanılmasını sağlayacağız."
 DEN_align_with_foreign_powers:0 "Yabancı Güçlerle Hizalan"
 DEN_align_with_foreign_powers_desc:0 "[?DEN.DEN_overlord_nation.GetNameDefCap] fethedilmiş toprağın bir karışını bile savaşmadan vermeyecek ve biz tek başımıza onların askeri gücüne karşı koyamayız. Eğer bir gün boyunduruk zincirlerini atmak ve özgürlüğümüzü yeniden kazanmak istiyorsak, bize bu zor durumda yardımcı olabilecek potansiyel müttefikler aramalıyız."
 DEN_align_with_overlord:0 "[?DEN.DEN_overlord_nation.GetNameDef] ile Hizalan"
 DEN_align_with_overlord_desc:0 "[?DEN.DEN_overlord_nation.GetNameDef] ile yaptığımız barış anlaşmasında yüksek düzeyde bir bağımsızlığı korumayı başarsak da, hala sadece bir kuklayız. Ancak bu bize ilginç fırsatlar sunuyor. Belki de, [?DEN.DEN_overlord_nation.GetNameDef] ile hizalanırsak, daha güçlü efendimizden yararlanabilir ve bu yenilgiyi zafere dönüştürebiliriz..."
 DEN_appropriate_odense_staalskibsvaerft:0 "Odense Staalskibsværft'e El Koy"
 DEN_appropriate_odense_staalskibsvaerft_desc:0 "Donanmamızın boyutunu gerçekten genişletmek için ek üretim yeteneklerine ihtiyacımız var. Odense'deki A.P. Møller-Mærsk’in tersanelerini ele geçirmek, üretim araçlarımızı önemli ölçüde hızlandıracaktır."
 DEN_appropriate_odense_staalskibsvaerft_modifier_tt:0 "$DEN_modify_industrial_capability_dynamic_modifier$ \n$MODIFIER_REPAIR_SPEED_FACTOR$: §G+%10§!\n\n"
 DEN_arm_the_resistance:0 "Direnişi Silahlandır"
 DEN_arm_the_resistance_desc:0 "İşgal başladığından beri sayısız direniş hareketi ortaya çıktı. Eğer bir gün [?DEN.DEN_overlord_nation.GetAdjective] baskı boyunduruğunu atmayı umuyorsak, bu grupları silahlandırmalı ve bir kez daha bağımsızlığımızı ilan ettiğimiz gün için hazır olmalarını sağlamalıyız."
 DEN_artillery_add_modifier_tt:0 "$DEN_add_haeren_dynamic_modifier$ $MODIFIERS_ARMY_ARTILLERY_DEFENCE_FACTOR$: §G+%10.0§!\n\n"
 DEN_artillery_modifier_tt:0 "$DEN_modify_haeren_dynamic_modifier$ \n$MODIFIERS_ARMY_ARTILLERY_DEFENCE_FACTOR$: §G+%10.0§!\n\n"
 DEN_ask_for_support:0 "Destek İste"
 DEN_ask_for_support_desc:0 "[GER.GetAdjective]lar, inşa etmek istediğimiz ülke türünün en iyi örneği olarak duruyor. Bu nedenle, hükûmetteki bu çalkantılı dönemde destek istemek için ulaşabileceğimiz daha iyi insanlar düşünemiyoruz. En kısa zamanda [GER.capital.GetCapitalVictoryPointName]'a bir heyet göndermeliyiz!"
 DEN_ask_for_weapons:0 "Silah Teslimatı Talep Et"
 DEN_ask_for_weapons_desc:0 "[?DEN.DEN_overlord_nation.GetAdjective] efendilerimiz silah ve mühimmat stoklarımızı tüketmeye devam ediyor, bu da bir kez daha bağımsızlığımızı ilan etme günü geldiğinde karşı koyma yeteneğimizi sakatlıyor. Müttefiklerimizden boş envanterlerimizi yenilemek için gerekli malzemeleri havadan indirmelerini isteyebiliriz."
 DEN_assault_troops:0 "Storm Afdeling"
 DEN_assault_troops_desc:0 "Ordu hattı tutabilir ve düşmanlarımızı azar azar geri püskürtebilirken, karşılaştığımız herhangi bir tehdidi yok etmek için gereken gücü seçkin birliklerimizin gücünde bulacağız. Eğitimlerine öncelik vermeli ve yedekte itaatkâr, disiplinli özel kuvvetlerimiz olduğundan emin olmalıyız."
 DEN_avenging_1864:0 "1864'ün İntikamını Almak"
 DEN_avenging_1864_desc:0 "1864'ün aşağılayıcı yenilgisi yarım yüzyıldan fazla bir süredir ulusumuzu yaraladı. Güney sınırımızı kesin olarak güvence altına almanın ve bir daha hiçbir düşmanın bize hangi şartlara uymamız gerektiğini dikte edememesini sağlamanın zamanı geldi de geçiyor."
 DEN_baltic_sea_domination:0 "Baltık Denizi Hakimiyeti"
 DEN_baltic_sea_domination_add_modifier_tt:0 "$DEN_add_sovaernet_dynamic_modifier$ $MODIFIER_NAVY_ORG_FACTOR$: §G+%5.0§! \n$MODIFIER_NAVAL_MORALE_FACTOR$: §G+%5.0§! \n$MODIFIER_NAVY_SCREEN_ATTACK_FACTOR$: §G+%5.00§! \n$MODIFIER_NAVY_SCREEN_DEFENCE_FACTOR$: §G+%5.00§! \n$MODIFIER_SCREENING_EFFICIENCY$: §G+%10.0§!\n\n"
 DEN_baltic_sea_domination_completed_tt:0 "§Y$DEN_baltic_sea_domination$§! odağını tamamladı ve [DEN.GetNameDef] şunlara sahip:"
 DEN_baltic_sea_domination_desc:0 "Rus imparatorluğunun yükselişinden ve hatta kısa ömürlü İsveç imparatorluğundan bile önce, Danimarka Baltık Denizi'ne hükmetmeyi hedefliyordu. Bağımsızlığımızı gerçekten güvence altına almak ve ana vatanlarımızı korumak için, bir kez daha deniz üstünlüğü yoluyla tüm Baltık Denizi'ni kontrol etmeyi hedeflemeliyiz."
 DEN_baltic_sea_domination_modifier_tt:0 "$DEN_modify_sovaernet_dynamic_modifier$ \n$MODIFIER_NAVY_ORG_FACTOR$: §G+%5.0§! \n$MODIFIER_NAVAL_MORALE_FACTOR$: §G+%5.0§! \n$MODIFIER_NAVY_SCREEN_ATTACK_FACTOR$: §G+%5.00§! \n$MODIFIER_NAVY_SCREEN_DEFENCE_FACTOR$: §G+%5.00§! \n$MODIFIER_SCREENING_EFFICIENCY$: §G+%10.0§!\n\n"
 DEN_bombefly:0 "Bombefly"
 DEN_bombefly_add_modifier_tt:0 "$DEN_add_flyvevabnet_dynamic_modifier$ $MODIFIER_AIR_BOMBING_TARGETTING$: §G+%5.0§! \n$MODIFIER_STRATEGIC_BOMBER_BOMBING$: §G+%5.0§! \n$MODIFIER_AIR_AGILITY_FACTOR$: §G+%5§!\n\n"
 DEN_bombefly_desc:0 "[DEN.GetNameDef]'i tamamen güvende tutmanın tek yolu, düşmanımızın endüstriyel yeteneklerini bombalama ve yok etme yeteneğidir."
 DEN_bombefly_modifier_tt:0 "$DEN_modify_flyvevabnet_dynamic_modifier$: \n$MODIFIER_AIR_BOMBING_TARGETTING$: §G+%5.0§! \n$MODIFIER_STRATEGIC_BOMBER_BOMBING$: §G+%5.0§! \n$MODIFIER_AIR_AGILITY_FACTOR$: §G+%5§!\n\n"
 DEN_build_a_modern_dannevirke:0 "Modern bir Dannevirke İnşa Et"
 DEN_build_a_modern_dannevirke_desc:0 "Danimarkalılar yüzyıllardır anakara Avrupa'ya bakan ağır tahkimatlar inşa ettiler, bunların en ünlüsü Dannevirke'dir. [GER.GetNameDef] bir kez daha silahlanırken ve çevremizdeki büyük güçleri karıştırırken, sınırlarımızı korumak için modern bir Dannevirke inşa etmeliyiz."
 DEN_build_motorveje:0 "Ulusal Motorveje İnşa Et"
 DEN_build_motorveje_desc:0 "Son zamanlarda ulusal otoyollarla ilgili çok fazla konuşma ve hatta bazı planlamalar oldu. Bir motorveje ağı inşa etmek, ülke genelinde daha hızlı seyahat süresini kolaylaştırır ve ülkeyi daha sıkı bir araya getirir."
 DEN_buy_allied_weapons:0 "Müttefik Silahları Tedarik Et"
 DEN_buy_allied_weapons_desc:0 "Daha küçük bir ulus olarak, silah üretme yeteneğimiz sınırlıdır - ve bağımsızlığımızı güvence altına almak için piyasadaki mümkün olan en iyi teçhizatı edinmeliyiz. Belki müttefiklerimizi sübvanse edilmiş bir anlaşmayla bize gerekli silahları sağlamaya ikna edebiliriz."
 DEN_buy_foreign_aircraft:0 "Yabancı Uçak Edin"
 DEN_buy_foreign_aircraft_desc:0 "Danimarka Tugayını, [DEN.GetNameDef] üzerindeki göklerde üstünlük için [?DEN.DEN_overlord_nation.GetNameDef] ile rekabet edecek uçaklar edinerek güçlendirmeliyiz."
 DEN_buy_foreign_ships:0 "Muhrip Tedarik Et"
 DEN_buy_foreign_ships_desc:0 "[DEN.GetNameDef]’in kıyı şeridini ve birçok adasını güvence altına almak için önce deniz yollarımızı koruyabilecek yetenekli bir filo sağlamalıyız. Durumumuza sempati duyabilecek ülkelere sessizce yaklaşarak, kendi donanmamızı desteklemek için onlardan eski muhripler tedarik edebiliriz."
 DEN_civilian_preparations:0 "Sivil Hazırlıklar"
 DEN_civilian_preparations_desc:0 "Askeri ve sanayi sektörü ne kadar hazırlıklı olursa olsun, sivil kararlılık çökerse ve halk savunmamızda hızla bocalar ve barış ararsa, hiçbir işe yaramayacaktır. Her bir Danimarkalı kalbindeki kararlılığı sertleştirmeli ve kendilerine olan inançlarını güçlendirmeliyiz."
 DEN_claim_sweden:0 "İsveç'e Hak İddia Et"
 DEN_claim_sweden_desc:0 "İsveçliler bir zamanlar en şiddetli rakiplerimizdi ve yüzyıllar boyunca zaman zaman bizim egemenliğimiz altındaydı. Ve Danimarka'nın aksine, İsveç'in modern bir orduyu çalıştırmak için gereken bol miktarda doğal kaynağı vardır. Belki de İsveç'i bir kez daha bizim etki alanımıza dahil etme ve tüm kaynaklarını bize açma zamanı gelmiştir..."
 DEN_collaboration_government:0 "Samarbejdsregering"
 DEN_collaboration_government_desc:0 "Bir barış anlaşması imzalamak ve [?DEN.DEN_overlord_nation.GetNameDef] ile işbirliği yapmak, halkımızı yıkım ve harabeden kurtarmanın tek yoluydu. [?DEN.DEN_overlord_nation.GetAdjective] işgal gücüyle yakın çalışan bir işbirliği hükûmeti kurarak, benzer durumdaki diğer birçok ulustan çok daha fazla bağımsızlık ve egemenlik elde edeceğiz."
 DEN_connect_the_islands:0 "Adaları Birleştir"
 DEN_connect_the_islands_desc:0 "[ROOT.GetNameDefCap], bizi anakaraya bağlayan tek noktanın güney Jutland'da olduğu çok sayıda adadan oluşur. Ülkemiz genelinde ve her şeyden önce adalar arasında seyahati kolaylaştırmak için bizi daha sıkı bağlayan köprüler inşa etmeliyiz."
 DEN_conservatives_support:0 "Muhafazakârların Desteğini Kazan"
 DEN_conservatives_support_desc:0 "Muhafazakâr Parti'nin büyük bir kısmı Bondepartiet veya DNSAP gibi partilerle işbirliği yapmayı hayal bile edemese de, [DEN.GetNameDef]'in yaklaşan fırtınaya karşı ne kadar savunmasız ve hazırlıksız olduğunu görebilenler hala var. Onları davamıza katılmaya ikna etmeliyiz!"
 DEN_conspire_with_the_officer_corps:0 "Subay Kadrosuyla Komplo Kur"
 DEN_conspire_with_the_officer_corps_desc:0 "Çok daha büyük bir siyasi yetkiye ve daha tutarlı bir gündeme sahip birleşik bir sağ eğilimli koalisyonla, şimdi en azından bazılarının arkamızda durması için subay kadrosuna yaklaşabiliriz."
 DEN_contribute_to_the_war:0 "Savaş Çabasına Katkıda Bulun"
 DEN_contribute_to_the_war_desc:0 "[?DEN.DEN_overlord_nation.GetAdjective] efendilerimize karşı duruşumuzu ve niyetimizi açıkça belirtmiş olsak da, ordumuzu daha fazla geliştirmemize izin vermeyecekler. Sadece [?DEN.DEN_overlord_nation.GetFactionName]'e katılarak ve savaş çabasına katkıda bulunma sözü vererek ordumuzu, donanmamızı ve hava kuvvetlerimizi geliştirmemize izin verilecektir. Ve [?DEN.DEN_overlord_nation.GetNameDef]'nin desteğiyle gözlerimizi İskandinav ülkelerinin geri kalanına çevirebiliriz..."
 DEN_convert_automobile_production:0 "Otomobil Üretimini Dönüştür"
 DEN_convert_automobile_production_add_modifier_tt:0 "$DEN_add_haeren_dynamic_modifier$ $MODIFIER_ARMY_SPEED_FACTOR$: §G+%5§! \n$MODIFIER_ORG_LOSS_WHEN_MOVING$: §G-%5.0§!\n\n"
 DEN_convert_automobile_production_desc:0 "Danimarkalı otomobil üreticilerine sivil üretim hatlarını savaş çabalarına katkıda bulunmak ve savunma yeteneklerimizi desteklemek için dönüştürmelerini emretme zamanı geldi. Kendi kamyon üretimimizi güvence altına almak ve ordumuzu daha yüksek bir dereceye kadar mekanize etmek, onu daha çevik ve esnek hale getirecektir."
 DEN_convert_automobile_production_modifier_tt:0 "$DEN_modify_haeren_dynamic_modifier$ \n$MODIFIER_ARMY_SPEED_FACTOR$: §G+%5.00§! \n$MODIFIER_ORG_LOSS_WHEN_MOVING$: §G-%5.0§!\n\n"
 DEN_create_danforce:0 "Danforce'u Yarat"
 DEN_create_danforce_desc:0 "[?DEN.DEN_overlord_nation.GetNameDefCap] üstünlüklerini gerçekten tehdit edecek kadar büyük bir orduya sahip olmamızı yasakladı. Bunun yerine, [DEN.GetNameDef]'i baskıdan kurtarmaya katılabilecek bir gücü eğitmek ve tedarik etmek için özgür ve dostane bir ulus aramalıyız."
 DEN_dano_german_military_cooperation:0 "Danimarka-Alman Askerî İşbirliği"
 DEN_dano_german_military_cooperation_desc:0 "Ordumuzu hedeflerimize ulaşabilecek noktaya getirmek için, [GER.GetNameDef]'deki dost hükûmetimize yaklaşmamız ve askeri ve teknolojik işbirliği talep etmemiz önemli olabilir. Bu teklifle, [DEN.GetNameDef] için tasavvur ettiğimiz gelecek gerçeğe daha da yaklaşacaktır."
 DEN_danske_stalvalsevaerket:0 "Danske Stålvalseværket"
 DEN_danske_stalvalsevaerket_desc:0 "Sanayi sektöründen birkaç temsilci, çelik üretiminin artırılması için kampanya yürüttü. Eğer yeni bir değirmen kurarsak, bu ekonomiye bir destek olabilir ve bizi çelik üretiminde daha kendine yeterli hale getirebilir."
 DEN_declare_independence:0 "Danimarka Bağımsızlığını İlan Et"
 DEN_declare_independence_desc:0 "Bir kez daha bağımsızlığımızı ilan etme zamanı geldi, ve gerekirse bunun için savaşma zamanı!"
 DEN_declare_neutrality:0 "Tarafsızlığı Yeniden Teyit Et"
 DEN_declare_neutrality_desc:0 "Son savaş sırasındaki taahhütsüzlüğümüz bize iyi hizmet etti ve bizi savaşın dehşetinden kurtardı. Tarafsızlığımızı ilan etmek bizi bir kez daha kurtarabilir."
 DEN_denmark_first:0 "Önce Danimarka"
 DEN_denmark_first_desc:0 "Kendi liyakatimizle bu kadar ilerledik, o zaman neden destek için büyük güçlerden herhangi birine başvuralım? Bunun yerine, [DEN.GetNameDef] kendi ayakları üzerinde duracak ve dünyadaki diğer büyük ittifaklar kadar önemli hale gelecek. Længe leve Danmark!"
 DEN_devalue_the_krone:0 "Kronu Devalüe Et"
 DEN_devalue_the_krone_desc:0 "Kronu devalüe ederek tarım ürünlerimiz uluslararası pazarda daha rekabetçi hale gelecek ve ihracat fırsatlarını artıracaktır, bu da zor durumdaki çiftçileri rahatlatacaktır."
 DEN_devalue_the_krone_modifier_tt:0 "$DEN_modify_economic_crisis_dynamic_modifier$ \n$MODIFIER_STABILITY_WEEKLY$ §G+%0.10§!\n\n"
 DEN_develop_greenland:0 "Grönland'ı Geliştir"
 DEN_develop_greenland_desc:0 "Anakara Danimarka, yerli üretimlerimizde geliştirebileceğimiz ve kullanabileceğimiz az sayıda doğal kaynağa sahiptir. Diğer yandan Grönland'a sahip olmamız bu kaynaklar açısından çok daha zengindir ve eğer Grönland'a yatırım yapıp geliştirirsek faydalarını toplamayı umuyoruz."
 DEN_develop_iceland:0 "İzlanda'yı Geliştir"
 DEN_develop_iceland_desc:0 "İzlanda’nın Kuzey Atlantik'teki konumu, açık denizleri kontrol etmek için deniz seferleri başlatmak için onu birinci sınıf bir aday yapar. Bölgeye kaynak ve para akıtarak, onu daha geniş krallığa daha yakından entegre edebilir ve stratejik konumundan daha iyi yararlanabiliriz."
 DEN_develop_island_states_tt:0 "Kararın kilidini açar: §YBüyük Kemer Bölgesini Geliştir§!\n\n"
 DEN_develop_jutland_states_tt:0 "Kararın kilidini açar: §YJutland Bölgesini Geliştir§!\n\n"
 DEN_develop_remote_islands:0 "Kararın kilidini açar: §YAdaları Geliştir§!\n\n"
 DEN_domestic_designs:0 "Yerli Tasarımlar"
 DEN_domestic_designs_desc:0 "Hava kuvvetlerimiz yetenek açısından ciddi şekilde eksiktir. Bu çoğunlukla kendi uçağımızı üretmememizden kaynaklanmaktadır ve bu nedenle en kötüsü en kötüye gelirse bir savaş çıkaracak sayılara sahip değiliz. Kendi uçaklarımız için yerli bir üretim hattı kurmalıyız."
 DEN_dominium_maris_baltici:0 "Dominium Maris Baltici"
 DEN_dominium_maris_baltici_desc:0 "[ROOT.GetNameDefCap] bir zamanlar Baltık Denizi çevresindeki en güçlü ulustu. Deniz üzerinde hakimiyet için Baltıklılar, Lehler, Ruslar ve her şeyden önce İsveçlilerle savaştık. Şimdi tüm bölgeyi kontrolümüz altına almak için hazırız."
 DEN_economic_crisis_neutrality_drift_modifier:0 "$DEN_modify_economic_crisis_dynamic_modifier$ \n$neutrality_drift$: §R-%0.02§!\n\n"
 DEN_economic_mobilization_strategy:0 "Ekonomik Seferberlik Stratejisi"
 DEN_economic_mobilization_strategy_desc:0 "Ekonomiyi ve kitleleri yaklaşan savaşa hazırlamalıyız. Sanayilerin mümkün olduğunca verimli çalışmasını sağlamak için yeni bir ekonomik strateji uygulamamız gerekecek, aynı zamanda Danimarka halkını Kral ve ülke için görevlerini yapmaya ikna etmeliyiz."
 DEN_effects_after_fortify_our_borders_tt:0 "§Y$DEN_fortify_our_borders$§! odağını tamamladı:"
 DEN_encourage_paramilitary:0 "Para-askeri Örgütleri Teşvik Et"
 DEN_encourage_paramilitary_desc:0 "Yerel tabanlı para-askeri örgütleri teşvik etmek, sadece savaş durumunda ulusal güvenliği desteklemekle kalmaz, aynı zamanda vatandaşlar arasında bir topluluk ve birlik duygusunu da artırır."
 DEN_escalate_the_sabotages:0 "Sabotajları Tırmandır"
 DEN_escalate_the_sabotages_desc:0 "Özgürlüğümüzü bir kez daha kazanmak için savaşmak zorunda kalacağımız giderek daha açık hale geliyor. [?DEN.DEN_overlord_nation.GetAdjective] işgaline yönelik sabotaj çabalarımızı yoğunlaştırmalıyız."
 DEN_establish_danske_flotille:0 "Den Danske Flotille'yi Kur"
 DEN_establish_danske_flotille_desc:0 "Sürgünde bir filo kurarak, adamları eğitebilir ve topraklarımızın kurtuluşuna yardımcı olacak becerilerini keskinleştirecek deniz tatbikatları yapabiliriz. Filomuz [?DEN.DEN_overlord_nation.GetAdjective] donanmasında ciddi bir muhalefetle karşılaşacak ve her şekilde üstünlük sağlamalıyız."
 DEN_establish_domestic_tank_manufacturing:0 "Yerli Tank Üretimi Kur"
 DEN_establish_domestic_tank_manufacturing_desc:0 "Savaş, 20. yüzyılda önemli ölçüde değişti - ve biz de onunla birlikte değişmeliyiz. Hızlı hareket eden, sert vuran bir ordu günümüzde zaferle sonuçlanan savaşların anahtarıdır. Kendi tank tedarikimizi güvence altına almak, modern savaş alanında başarıyı sağlayacaktır."
 DEN_establish_domestic_tank_manufacturing_modifier_tt:0 "$DEN_modify_haeren_dynamic_modifier$ \n$MODIFIERS_ARMY_ARMOR_ATTACK_FACTOR$: §G+%5.0§!\n\n"
 DEN_establish_the_danelaw:0 "Danelagen"
 DEN_establish_the_danelaw_desc:0 "Bir zamanlar egemenliğimiz Kuzey Denizi boyunca uzanır ve İngilizler yasalarımıza uyardı. Halkımızın geleceğini dalgaları güvence altına alarak güvence altına almak için yeniden yükselme zamanı geldi. Danelagen'i yeniden tanıtacağız ve diğer tüm ülkeleri bize kulak vermeye zorlayacağız!"
 DEN_expand_dansk_industri_syndikat:0 "Dansk Industri Syndikat'ı Genişlet"
 DEN_expand_dansk_industri_syndikat_desc:0 "Dansk Industri Syndikat veya yaygın olarak bilindiği gibi Riffelsyndikatet, ülkenin en büyük silah üreticisidir ve ordumuzun Madsen tüfeklerini üretir. Fabrikalarına yatırım yapmak ve genişletmek ulusal güvenlik açısından son derece önemlidir."
 DEN_expand_haerens_tekniske_korps:0 "Hærens Tekniske Korps'u Genişlet"
 DEN_expand_haerens_tekniske_korps_desc:0 "Ordunun Teknik Kolordusu, hem silah hem de mühimmat üreten Silah Cephaneliği ve Hærens Geværfabrik'i işletmektedir. Bu tesisleri genişletmek, tüfek ve topçu üretimini artıracak, bu da elbette askeri yeteneklerimizi güçlendirecektir."
 DEN_expand_institut_for_teoretisk_fysik:0 "Institut for Teoretisk Fysik'i Genişlet"
 DEN_expand_institut_for_teoretisk_fysik_desc:0 "Institut for Teoretisk Fysik, fizikte dünya lideri bir otoritedir ve teorik fizikçi Niels Bohr tarafından kurulmuştur. Kurumu finanse ederek ve tesislerini genişleterek ödüllerini toplamayı umuyoruz ve hatta potansiyel olarak Niels Bohr'u davamıza katabiliriz..."
 DEN_expand_kobenhavns_university:0 "Københavns Universitet'i Genişlet"
 DEN_expand_kobenhavns_university_desc:0 "[DEN.GetNameDef]'in teknolojik bir taşra haline gelme riskini alamayız. Kopenhag Üniversitesi'nde bilimsel ilerlemeye ve teknolojik gelişmeye yatırım yapmak, rakiplerimizden herhangi bir alanda geride kalmamamızı sağlayacaktır."
 DEN_expand_the_brigades:0 "Tugayları Genişlet"
 DEN_expand_the_brigades_desc:0 "Danimarka Tugayı'nın [ROOT.GetNameDef]'i kurtarma şansını güvence altına almak için, tümenlerine daha fazla insan gücü eklemeliyiz."
 DEN_expand_the_industries:0 "Sanayilerimizi Genişlet"
 DEN_expand_the_industries_desc:0 "Danimarka geleneksel olarak tarıma dayanmıştır, ki bu en büyük ihracatımız olmaya devam etmektedir. Eğer çeşitlendirip diğer sanayilerimizi genişletirsek, ekonomiyi bir bütün olarak güçlendirir ve Danimarka toplumunu ani değişikliklere karşı daha sağlam hale getiririz."
 DEN_expand_the_ivittuut_mine:0 "Ivittuut Madenini Genişlet"
 DEN_expand_the_ivittuut_mine_desc:0 "Ivittuut'taki maden, modern uçakların üretiminde çok önemli bir bileşen olan tek alüminyum kaynağımızdır. Bu madeni genişleterek ya yerli uçak üretimimizi artırabilir ya da alüminyumu diğer ülkelere ihraç edebiliriz."
 DEN_expand_the_resistance:0 "Direnişi Genişlet"
 DEN_expand_the_resistance_desc:0 "İşgal başladığından beri hayatın her kesiminden birçok farklı direniş grubu ortaya çıkmış olsa da, eğer bir gün [?DEN.DEN_overlord_nation.GetAdjective] güçlerini topraklarımızdan geri püskürtmeyi umuyorsak, bu gruplara daha da fazla insan toplamalıyız."
 DEN_expand_ubadsvabnet:0 "Ubådsvåbnet'i Genişlet"
 DEN_expand_ubadsvabnet_desc:0 "Kıyı şeridimizin ve birçok adamızın en iyi korunması, düşmanın göremediğidir. Geniş bir denizaltı filosuna sahip olmak, fark edilmeden saldırmamıza ve kayıp vermeden kuvvetlerimizi geri çekmemize olanak tanıyacaktır."
 DEN_expand_vaernepligten:0 "Værnepligten'i Genişlet"
 DEN_expand_vaernepligten_desc:0 "Ordu, herhangi bir olası işgalciyi caydırmaktan tamamen aciz, zar zor bir sembolik güçtür. Eğer ulusun gerçek bir savunmasını yapacaklarsa, zorunlu askerliği hızla genişletmeliyiz."
 DEN_expand_vaernepligten_modifier_tt:0 "$DEN_modify_neglected_military_dynamic_modifier$ \n$MODIFIER_MOBILIZATION_SPEED$: §G+%10.00§!\n\n"
 DEN_experimental_technology:0 "Deneysel Teknoloji"
 DEN_experimental_technology_desc:0 "Savaş makinemizi geliştirirken, araştırma ve geliştirme sektörümüzün de deneylerini ilerletmeye devam ettiğinden emin olmalıyız. Üniversitelere ve laboratuvarlara, gelişimimizi daha da ileriye taşımak için ihtiyaç duyacakları finansmanı sağlamamız zorunludur."
 DEN_finish_off_finland:0 "Doğu Cephemizi Güvence Altına Al"
 DEN_finish_off_finland_desc:0 "Kuzey İskandinavya'daki çıkarlarımız, Doğu kanadımızı güvence altına almadığımız sürece her zaman tehdit altında olacaktır. Fin topraklarını korumak için önleyici tedbirler almalıyız!"
 DEN_five_year_plan:0 "Beş Yıllık Planı Tanıt"
 DEN_five_year_plan_desc:0 "Halkımızın geleceğini güvence altına almak için [DEN.GetNameDef] için cesur yeni bir ekonomik model üretebilen ve uygulayabilen bir komite kurmalıyız. Bu yeni Beş Yıllık Plan, gerçekten çiçek açmamızı ve refaha ermemizi sağlayacaktır!"
 DEN_flyvertaktisk_kommando:0 "Flyvertaktisk Kommando"
 DEN_flyvertaktisk_kommando_add_modifier_tt:0 "$DEN_add_flyvevabnet_dynamic_modifier$ $MODIFIER_AIR_ACCIDENTS_FACTOR$ §G-%5.0§! \n$MODIFIER_AIR_NIGHT_PENALTY$: §G-%5.00§! \n$MODIFIER_AIR_WEATHER_PENALTY$: §G-%5.00§!\n\n"
 DEN_flyvertaktisk_kommando_desc:0 "Hava kuvvetlerinin iki farklı kolunu tek bir birimde birleştirmek yeterli değil. Bu yeni askeri kolun mümkün olduğunca verimli ve tutarlı olması için, hava kuvvetini düzgün bir şekilde koordine edebilecek bir merkezi komuta yapısı oluşturmalıyız."
 DEN_flyvertaktisk_kommando_modifier_tt:0 "$DEN_modify_flyvevabnet_dynamic_modifier$: \n$MODIFIER_AIR_ACCIDENTS_FACTOR$ §G-%5.0§! \n$MODIFIER_AIR_NIGHT_PENALTY$: §G-%5.00§! \n$MODIFIER_AIR_WEATHER_PENALTY$: §G-%5.00§!\n\n"
 DEN_flyveskolen:0 "Flyveskolen"
 DEN_flyveskolen_add_modifier_tt:0 "$DEN_add_flyvevabnet_dynamic_modifier$ $MODIFIER_AIR_ACE_GENERATION_CHANCE_FACTOR$: §G+%5.00§! \n$MODIFIER_AIR_MISSION_EFFICIENCY$: §G+%5.0§! \n$MODIFIER_AIR_AGILITY_FACTOR$: §G+%5§!\n\n"
 DEN_flyveskolen_desc:0 "Tüm kolektif hava kuvveti becerilerimizi ve bilgimizi Flyvevåbnet'te topladıktan sonra, bu uzmanlığı ortak bir eğitim okulu oluşturarak hevesli Harbiyelilere genişletmeliyiz."
 DEN_flyveskolen_modifier_tt:0 "$DEN_modify_flyvevabnet_dynamic_modifier$: \n$MODIFIER_AIR_ACE_GENERATION_CHANCE_FACTOR$: §G+%5.00§! \n$MODIFIER_AIR_MISSION_EFFICIENCY$: §G+%5.0§! \n$MODIFIER_AIR_AGILITY_FACTOR$: §G+%5§!\n\n"
 DEN_foreign_designs:0 "Yabancı Tasarımlar"
 DEN_foreign_designs_desc:0 "İki hava kuvvetimizin de işlevsel bir avcı veya bombardıman uçağı tasarlama ve inşa etme yeteneği yoktur. Uçak satın almak için başka yerlere bakmalıyız. Eğer tasarımı tatmin edici bulursak, bir üretim lisansı almayı düşünebiliriz."
 DEN_form_the_danish_freedom_council:0 "Danmarks Frihedsråd"
 DEN_form_the_danish_freedom_council_desc:0 "[?DEN.DEN_overlord_nation.GetNameDef] tarafından yapılan işgale karşı çıkan tüm siyasi partilerden geniş bir destek koalisyonu toplayarak bir konsey oluşturmalıyız. Bu Özgürlük Konseyi, istiladan sonra ortaya çıkan farklı direniş hareketlerini daha etkili bir şekilde koordine edebilir ve olası bir bağımsızlık savaşını da koordine edebilir."
 DEN_fortify_our_borders:0 "Sınırlarımızı Güçlendir"
 DEN_fortify_our_borders_desc:0 "Avrupa'da gerilim bir kez daha artıyor. Büyük Savaş'tan yara almadan çıkmış olsak da, bunun tekrar olacağının garantisi yok. En iyisini umarken en kötüsüne hazırlanmalıyız. Sınırlarımızı ve bağımsızlığımızı savunmak birinci önceliğimizdir!"
 DEN_fortify_the_islands:0 "Adaları Güçlendir"
 DEN_fortify_the_islands_desc:0 "Doğu Danimarka'nın tamamı yüzlerce adanın üzerinde yer alıyor ve donanmamız hepsini komşularımızın çok daha büyük filolarından koruyacak kadar büyük değil. Kilit noktalara kıyı tahkimatları inşa ederek potansiyel işgalcileri püskürtebiliriz."
 DEN_fromandskorpset:0 "Frømandskorpset"
 DEN_fromandskorpset_desc:0 "Hem ordudaki hem de donanmadaki son gelişmeler, ordumuzu önemli ölçüde güçlendirdi. Gücümüzü uzak ve geniş, suların üzerine ve yabancı kıyılara yansıtmaktan çok daha fazlasını yapabilecek durumdayız - eğer istersek."
 DEN_full_employment:0 "Tam İstihdam"
 DEN_full_employment_desc:0 "Sanayilere ve tarıma yatırım yapmaktan hiç kaçınmadığımız için şimdi faydalarını toplama zamanı geldi. Ekonomik kriz ve yüksek işsizlik yıllarını geride bıraktık. Ulus tam kapasite çalışıyor ve hatta işe alacak insan bulamıyor. Refah önümüzde."
 DEN_full_social_mobilization:0 "Tam Sosyal Seferberlik"
 DEN_full_social_mobilization_desc:0 "Savaş kapımızda ve özgürlüğümüzü güvence altına almak için toplumun her yönünü seferber etmeliyiz. Her erkek, kadın ve çocuk görevlerini ve yükümlülüklerini bilmelidir. Bu bir bedel gerektirecek, ancak tüm endüstriyel kapasitemiz yeniden silahlanmayı ve Danimarka halkının güvenliğini desteklemeye yönelik olmalıdır."
 DEN_generalkommandoen:0 "Generalkommandoen "
 DEN_generalkommandoen_desc:0 "İyi eğitimli, iyi disiplinli ve iyi işleyen subaylar, başarılı bir ordunun kökleridir. Dünyanın en verimli ve yetkin subaylarını üretmeyi ve genelkurmayımızı onlarla doldurmayı hedeflemeliyiz."
 DEN_generalkommandoen_modifier_tt:0 "$DEN_modify_haeren_dynamic_modifier$ \n$MODIFIER_ARMY_ORG_FACTOR$: §G+%5.0§! \n$MODIFIER_ORG_LOSS_WHEN_MOVING$: §G-%5.0§! \n$MODIFIERS_ARMY_CORE_ATTACK_FACTOR$: §G+%5.0§!\n\n"
 DEN_haeren_reorganization:0 "Hæren'in Yeniden Düzenlenmesi"
 DEN_haeren_reorganization_desc:0 "Danimarka ordusu küçük ve sınırlarımızı savunmaya tamamen hazırlıksızdır. Bağımsızlığımızı korumak ve potansiyel düşmanları caydırmak için etkili bir merkezi komutaya sahip etkili bir savaş gücü olarak yeniden düzenlenmelidir."
 DEN_haeren_reorganization_modifier_neglected_military_tt:0 "$DEN_modify_neglected_military_dynamic_modifier$ \n$MODIFIER_PLANNING_SPEED$: §G+%10.0§!\n\n"
 DEN_heavy_market_regulations:0 "Ağır Sanayi Düzenlemeleri"
 DEN_heavy_market_regulations_desc:0 "Sanayi şirketleri yıllar içinde büyüdü ve zenginleşti. Ekonomi üzerindeki hakimiyetleri birçok insan için endişe verici hale geldi. Onları kısıtlamalı ve şirketin ihtiyaçlarını ulusun ihtiyaçlarının önüne koymadıklarından emin olmak için sıkı bir denetim altına almalıyız."
 DEN_hjemmevaernet:0 "Hjemmeværnet"
 DEN_hjemmevaernet_add_modifier_tt:0 "$DEN_add_haeren_dynamic_modifier$ $MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$: §G+%5.0§!\n\n"
 DEN_hjemmevaernet_desc:0 "Danimarka'yı herhangi bir saldırgandan korumak için ayaklanmaya hazır pek çok insan var. Eğer biri bizi işgal etmeye cüret ederse diye, bu insanların savaşma ruhundan yararlanarak bir iç güvenlik gücü oluşturmalıyız."
 DEN_hjemmevaernet_modifier_tt:0 "$DEN_modify_haeren_dynamic_modifier$ \n$MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$: §G+%5.0§!\n\n"
 DEN_import_machinery_and_material:0 "Makine ve Malzeme İthal Et"
 DEN_import_machinery_and_material_desc:0 "Komşularımızın endüstriyel gücüyle rekabet etmeyi umuyorsak, bu konuda akıllı olmalıyız. Daha sanayileşmiş ülkelerden modern aletler ve malzemeler ithal etmek, kendi yeteneklerimizi artırır ve onları daha da geliştirir."
 DEN_improve_aalborg_portland_tt:0 "Bu, §Y$DEN_aalborg_portland$§! Endüstriyel Şirketini şu şekilde geliştirecektir: \n$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+%10.00§!\n\n"
 DEN_increase_cooperation:0 "Artan İşbirliği"
 DEN_increase_cooperation_desc:0 "İtiraf etmek istemesek de, [?DEN.DEN_overlord_nation.GetAdjective] istilasını asla geri püskürtemezdik - ve teslim olarak [?DEN.DEN_overlord_nation.GetAdjective] altındaki başka hiçbir ülkenin sahip olmadığı belirli bir özerklik seviyesini sağladık. Bu nedenle, bu bağımsızlığı güvence altına almak ve bu ilişkinin faydalarını toplamak için efendilerimizle daha yakından çalışmaya gayret etmeliyiz."
 DEN_increase_industrial_production:0 "Endüstriyel Üretimi Artır"
 DEN_increase_industrial_production_desc:0 "Kent sanayileri son zamanlarda hem istihdamı hem de ekonomik çıktıyı artırarak önem kazanmıştır. Sanayilerimiz yeteneklerini artırmış olsa da, daha da verimli hale gelme potansiyelleri var."
 DEN_increase_maritime_trade:0 "Deniz Ticaretini Artır"
 DEN_increase_maritime_trade_desc:0 "Gelecek açık denizlerde ve ürünlerimizi uzak ve geniş bir alana ihraç etmek için ticaret filomuzun üzerindedir. Nüfus ve siyasi etki açısından küçük bir ulus olabiliriz, ancak büyük bir ticaret gücü olabiliriz."
 DEN_increase_produce_production:0 "Gıda Üretimini Artır"
 DEN_increase_produce_production_desc:0 "Yeniden yatırımlarımız karşılığını verdi ve küçük çiftliklerden büyük kooperatiflere kadar herkes refaha kavuşuyor. Şimdi gıda üretimini daha da artırmak için çok uygun durumdayız."
 DEN_industrial_investments:0 "Endüstriyel Yatırımlar"
 DEN_industrial_investments_desc:0 "Kent merkezleri son birkaç yılın kargaşasından muaf kalmadı. İşsizlik fırladı, işletmeleri iflasın eşiğine getirdi veya tamamen başarısız oldu. Durumu istikrara kavuşturmak için endüstriyel sektöre yönelik bazı iyi hedeflenmiş yardım paketleriyle devreye girebiliriz."
 DEN_industrial_preparations:0 "Endüstriyel Hazırlıklar"
 DEN_industrial_preparations_desc:0 "Toplumumuzun her yönünü savaşa hazırlamalıyız - herhangi bir sürprizle hazırlıksız yakalanma riskini göze alamayız. Sanayiler, bizi daha kendine yeterli hale getirmek için önce hazırlanmalı, bu da sırayla herhangi bir işgalciyi yardım gelene kadar yeterince uzun süre geri püskürtme yeteneklerimizi destekleyecektir."
 DEN_industrial_reinvestments:0 "Endüstriyel Yeniden Yatırımlar"
 DEN_industrial_reinvestments_desc:0 "Tarımı modernize etmek, insanları tarlalardaki işlerinden serbest bıraktı. Endüstriyel kent merkezlerine yeniden yatırım yapmak, bu insanların doldurabileceği yeni iş fırsatları sunar ve bunu yaparken endüstriyel üretimimizi artırır."
 DEN_industrial_research_bonus_tt:0 "Endüstriyel Araştırma Bonusu: §G+%5.00§!"
 DEN_institute_corporatism:0 "Korporatizmi Kur"
 DEN_institute_corporatism_desc:0 "İtalyan modelinden esinlenerek, farklı ekonomik sektörlerden işçiler ve kapitalistler ulusal politika yapımına katılmalı, böylece bu gruplar arasında arabuluculuk yapabilir ve ulusal ekonomi için en faydalı reformları gerçekleştirebiliriz. Bu, [DEN.GetNameDef] için sağlam bir siyasi gelecek güvence altına almamıza yardımcı olacaktır."
 DEN_intel_sharing:0 "İstihbarat Paylaşımı"
 DEN_intel_sharing_desc:0 "Ülkelerimiz arasında istihbarat paylaşarak [?DEN.DEN_overlord_nation.GetNameDef]'e karşı müttefiklerimizle işbirliğini derinleştirmek, bağlarımızı ve nihayetinde [?DEN.DEN_overlord_nation.GetAdjective] baskısını devirme yeteneğimizi güçlendirecektir."
 DEN_jagerfly:0 "Jagerfly"
 DEN_jagerfly_add_modifier_tt:0 "$DEN_add_flyvevabnet_dynamic_modifier$ $MODIFIER_AIR_ESCORT_EFFICIENCY$: §G+%5.00§! \n$MODIFIER_AIR_INTERCEPT_EFFICIENCY$: §G+%5§! \n$MODIFIER_AIR_AGILITY_FACTOR$: §G+%5§!\n\n"
 DEN_jagerfly_desc:0 "Şehirlerimizi gökyüzünden gelen yıkıcı bombardımanlardan korumak için, havacılık kaynaklarımızı yapabileceğimiz en iyi avcı uçaklarını yaratmaya odaklamalıyız."
 DEN_jagerfly_modifier_tt:0 "$DEN_modify_flyvevabnet_dynamic_modifier$: \n$MODIFIER_AIR_ESCORT_EFFICIENCY$: §G+%5.00§! \n$MODIFIER_AIR_INTERCEPT_EFFICIENCY$: §G+%5§! \n$MODIFIER_AIR_AGILITY_FACTOR$: §G+%5§!\n\n"
 DEN_joint_military_drills:0 "Ortak Askerî Tatbikatlar"
 DEN_joint_military_drills_desc:0 "1864'ten beri tarafsız olan Danimarka kuvvetleri, oldukça uzun bir süredir gerçek bir savaş görmedi. Eğer yeni müttefikimize yaklaşırsak onlardan çok şey öğrenebiliriz ve ortak bir askeri tatbikat yaparak her iki ulus da birbirinden deneyim kazanabilir."
 DEN_kanslergadeforliget:0 "Kanslergadeforlig'e Devam Et"
 DEN_kanslergadeforliget_desc:0 "Büyük Buhran, [ROOT.GetName]'da artan işsizlik ve başarısız bir tarım sektörüyle hala hissediliyor. Parti çizgilerini aşarak içinde bulunduğumuz krizi nasıl ele alacağımız konusunda bir anlaşmaya varmalıyız."
 DEN_king_assumes_power:0 "Kral İktidarı Ele Alır"
 DEN_king_assumes_power_desc:0 "Bu belirsiz zamanlarda bizi ileriye götürecek sağlam bir ele ihtiyacımız var. İstikrara ve geleneğe ihtiyacımız var. Kral, bu sıkıntılı zamanlarda hükûmet üzerinde tam yetkiyi üstlenmeye belki ikna edilebilir."
 DEN_konge_og_faedreland:0 "Kral ve Vatan İçin"
 DEN_konge_og_faedreland_desc:0 "Kral X. Christian’ın sarsılmaz adanmışlığı ve onuru, bu deneme zamanlarında kitleler için bir umut ışığı olsun. Vatanımızı savunmak için bir halk olarak birleşmeliyiz!"
 DEN_limited_market_regulations:0 "Sınırlı Sanayi Düzenlemeleri"
 DEN_limited_market_regulations_desc:0 "Sanayi sektörü yıllar içinde ulusun ekonomisinde önem kazandı ve hatta gelişiyor. Büyümelerine zarar vermeyecek kadar onları dizginlemeli ve yeterince dizginlemeliyiz ki ulus için bir güvenlik riski haline gelmesinler."
 DEN_limited_social_mobilization:0 "Sınırlı Sosyal Seferberlik"
 DEN_limited_social_mobilization_desc:0 "Savaş Avrupa'nın üzerinde beliriyor - ama bir daha hazırlıksız yakalanmamalıyız! Egemenliğimizi güvence altına almak için ne kadar zor olursa olsun gerekli hazırlıkları yapmalıyız."
 DEN_luftstotte:0 "Luftstøtte"
 DEN_luftstotte_add_modifier_tt:0 "$DEN_add_flyvevabnet_dynamic_modifier$ $MODIFIER_AIR_CAS_EFFICIENCY$: §G+%5§! \n$MODIFIER_AIR_AGILITY_FACTOR$: §G+%5§! \n$MODIFIER_GROUND_ATTACK_FACTOR$: §G+%5.0§!\n\n"
 DEN_luftstotte_desc:0 "Hava kuvvetimizin en iyi kullanımı, kara birliklerimizi elimizden geldiğince desteklemektir. Havacılık günümüz savaşlarında son derece önemli hale geldi, ancak savaşlar hala yerde kazanılıyor."
 DEN_luftstotte_modifier_tt:0 "$DEN_modify_flyvevabnet_dynamic_modifier$: \n$MODIFIER_AIR_CAS_EFFICIENCY$: §G+%5§! \n$MODIFIER_AIR_AGILITY_FACTOR$: §G+%5§! \n$MODIFIER_GROUND_ATTACK_FACTOR$: §G+%5.0§!\n\n"
 DEN_march_on_the_capital:0 "Başkente Yürü"
 DEN_march_on_the_capital_desc:0 "Nihayet, partimizin ayaklanıp [DEN.GetNameDef]'nin geleceğini kontrol altına alma zamanı geldi. [ROOT.capital.GetCapitalVictoryPointName]'a yürümeliyiz ve sesimizi duyurmalıyız! Bu, [DEN.GetAdjective] tarihinde güçlü ve güvenli bir dönemin başlangıcı olacak!"
 DEN_military_cooperation_program:0 "Askerî İşbirliği Programı"
 DEN_military_cooperation_program_desc:0 "Bir ittifak sağladıktan sonra, her iki ülke de ortak bir askeri işbirliği programında birbirinden öğreneceklerdir. Ve anlaşmayı tatlandırmak için, yeniden silahlanma çabalarımızı desteklemek için yeni müttefiklerimizden satın alınan askeri teçhizatı sübvanse etmeyi kabul ettiler."
 DEN_military_might:0 "Yeniden Canlanan Askerî Güç"
 DEN_military_might_desc:0 "[DEN.GetNameDef]'nin askeri gücü her geçen gün daha da güçleniyor, ancak her zaman iyileştirme için yer vardır. Hæren ve Flyvevåbnet'e fonlarımızı odaklayarak sahadaki eğitimlerini ve verimliliklerini artıralım."
 DEN_military_preparations:0 "Askerî Hazırlıklar"
 DEN_military_preparations_desc:0 "Ordularımız düşmanı püskürtemezse, sanayileri bir saldırıya hazırlamak işe yaramaz olacaktır. Savunmamızı güçlendirmeli ve birliklerimizin hattı tutmak için gereken disipline ve sinirlere sahip olduğundan emin olmalıyız."
 DEN_modernize_agricultural_machinery:0 "Tarımsal Makineleri Modernleştir"
 DEN_modernize_agricultural_machinery_desc:0 "Tarımsal makineleri ve teknolojiyi modernize etmek, daha yüksek verimlilikle zengin bir hasat sağlayabilir ve böylece üretimi artırabilir."
 DEN_modernize_industrial_machinery:0 "Endüstriyel Makineleri Modernleştir"
 DEN_modernize_industrial_machinery_desc:0 "Danimarka geleneksel olarak gıda ihracatımıza dayanan bir tarım ekonomisi olmuştur, ancak kent sanayileri on yıllar içinde önem kazanmıştır. Modern makinelere yatırım yaparak sanayiler daha da büyüyebilir."
 DEN_modernize_the_navy:0 "Donanmayı Modernleştir"
 DEN_modernize_the_navy_add_modifier_tt:0 "$DEN_add_sovaernet_dynamic_modifier$ $MODIFIER_NAVAL_DETECTION$: §G+%10§! \n$MODIFIER_NAVAL_ACCIDENTS_CHANCE$ §G-%10.00§!\n\n"
 DEN_modernize_the_navy_desc:0 "Eğer günümüzün en iyi donanmalarıyla başa baş gitmek istiyorsak, nicelikten çok kaliteyi hedeflemeliyiz. Daha modern gemiler tarafından silah ve manevra kabiliyeti olarak geride bırakılırsak sayılar bize yardımcı olmaz."
 DEN_modernize_the_navy_modifier_tt:0 "$DEN_modify_sovaernet_dynamic_modifier$ \n$MODIFIER_NAVAL_DETECTION$: §G+%10§! \n$MODIFIER_NAVAL_ACCIDENTS_CHANCE$ §G-%10.00§!\n\n"
 DEN_modify_danish_resistance_dynamic_modifier:0 "§Y$DEN_resistance_dynamic_modifier$§! değiştiricisini şununla değiştir"
 DEN_modify_economic_crisis_dynamic_modifier:0 "§Y$DEN_economic_crisis_dynamic_modifier$§! değiştiricisini şununla değiştir"
 DEN_modify_flyvevabnet_dynamic_modifier:0 "§Y$DEN_flyvevabnet_dynamic_modifier$§! değiştiricisini şununla değiştir"
 DEN_modify_haeren_dynamic_modifier:0 "§Y$DEN_haeren_dynamic_modifier$§! değiştiricisini şununla değiştir"
 DEN_modify_industrial_capability_dynamic_modifier:0 "§Y$DEN_industrial_capability_dynamic_modifier$§! değiştiricisini şununla değiştir"
 DEN_modify_neglected_military_dynamic_modifier:0 "§Y$DEN_neglected_military_dynamic_modifier$§! değiştiricisini şununla değiştir"
 DEN_modify_political_edicts_dynamic_modifier:0 "§Y$DEN_political_edicts_dynamic_modifier$§! değiştiricisini şununla değiştir"
 DEN_modify_sovaernet_dynamic_modifier:0 "§Y$DEN_sovaernet_dynamic_modifier$§! değiştiricisini şununla değiştir"
 DEN_modify_war_preparations_dynamic_modifier:0 "§Y$DEN_war_preparations_dynamic_modifier$§! değiştiricisini şununla değiştir"
 DEN_national_unity:0 "Ulusal Birlik"
 DEN_national_unity_desc:0 "Aniden ordumuzu yeniden silahlandırmak ve inşa etmek, tüm Danimarka nüfusunun desteğini gerektirecektir. Halkı birleştirmeli ve kararlılıkla tek vücut olarak ilerlemeliyiz."
 DEN_naval_power_projection:0 "Deniz Gücü Yansıtma"
 DEN_naval_power_projection_desc:0 "Büyük ve güçlü bir donanmaya sahip olmak, irademizi krallığımızın her köşesine yansıtamıyorsa hiçbir işe yaramaz. Alanımızı bir deniz üsleri zinciriyle bağlamak, sular üzerindeki hakimiyetimizi demirleyecektir."
 DEN_new_artillery_tactics:0 "Yeni Topçu Taktikleri"
 DEN_new_artillery_tactics_desc:0 "Hærens Tekniske Korps bugün silah, topçu ve mühimmat üretiyor. Ancak Hærens Tekniske Korps içinde deneysel bir tümen kurarak belki de kendi topçumuzu tasarlayıp üretebiliriz, ki bu da ordunun büyük fayda sağlayacağı bir şeydir."
 DEN_new_forsvarsforlig_modifier_tt:0 "$DEN_modify_neglected_military_dynamic_modifier$ \n$MODIFIER_MOBILIZATION_SPEED$: §G+%10.00§! \n$MODIFIER_SURRENDER_LIMIT$: §G+%10.00§!\n\n"
 DEN_no_market_regulations:0 "Tüm Sanayi Düzenlemelerini Kaldır"
 DEN_no_market_regulations_desc:0 "Sanayiler, piyasadaki düzenlemelerimize rağmen büyüdü ve refaha kavuştu - onlar sayesinde değil. Eğer gerçekten dünyanın geri kalanıyla sanayilerimizle rekabet etmek istiyorsak, üzerlerindeki tüm düzenlemeleri kaldırmalıyız."
 DEN_nordic_security:0 "İskandinav Güvenliği"
 DEN_nordic_security_desc:0 "Yeni bir ittifakla kendi bağımsızlığımızı güvence altına aldıktan sonra nihayet dikkatimizi İskandinav ülkelerinin geri kalanına çevirebiliriz. Hepimizin birbirini koruyabilmesi için onları ittifakımıza katılmaya ikna etmeliyiz ve eğer mantığı göremezlerse onları kendilerinden korumakla yükümlüyüz."
 DEN_north_sea_ambitions:0 "Kuzey Denizi Hırsları"
 DEN_north_sea_ambitions_add_modifier_tt:0 "$DEN_add_sovaernet_dynamic_modifier$ $MODIFIER_NAVY_ORG_FACTOR$: §G+%5.0§! \n$MODIFIER_NAVAL_MORALE_FACTOR$: §G+%5.0§! \n$MODIFIER_NAVY_ANTI_AIR_ATTACK_FACTOR$ §G+%5.00§! \n$MODIFIER_NAVY_CAPITAL_SHIP_DEFENCE_FACTOR$ §G+%5.00§! \n$MODIFIER_POSITIONING$ §G+%5.00§!\n\n"
 DEN_north_sea_ambitions_completed_tt:0 "§Y$DEN_north_sea_ambitions$§! odağını tamamladı ve [DEN.GetNameDefCap] şunlara sahip:"
 DEN_north_sea_ambitions_desc:0 "Bizimki, Avrupa kıyılarından Kuzey Atlantik denizlerine kadar uzanan geniş bir ulustur. Bu geniş krallığı korumak ve denizaşırı topraklarımızı güvence altına almak için cesur ve hırslı bir plana girişmeliyiz. Bu suları bize karşı çıkan herhangi bir güçle rekabet edebilecek bir Kuzey Denizi filosu inşa etmek tek amacımız olmalıdır."
 DEN_north_sea_ambitions_modifier_tt:0 "$DEN_modify_sovaernet_dynamic_modifier$ \n$MODIFIER_NAVY_ORG_FACTOR$: §G+%5.0§! \n$MODIFIER_NAVAL_MORALE_FACTOR$: §G+%5.0§! \n$MODIFIER_NAVY_ANTI_AIR_ATTACK_FACTOR$ §G+%5.00§! \n$MODIFIER_NAVY_CAPITAL_SHIP_DEFENCE_FACTOR$ §G+%5.00§! \n$MODIFIER_POSITIONING$ §G+%10.0§!\n\n"
 DEN_north_sea_oil_drilling:0 "Kuzey Denizi Petrol Sondajı"
 DEN_north_sea_oil_drilling_desc:0 "Maden arayıcıları, Nørrejylland kıyısı açıklarında petrol yatakları keşfettiler. Eğer bu rezervleri çıkarabilirsek, kararsız ticaret piyasasına daha az bağımlı hale gelir ve daha kendine yeterli oluruz."
 DEN_offer_protection:0 "Koruma Teklif Et"
 DEN_offer_protection_desc:0 "İskandinav Bölgesi ve Baltık Denizi çevresindeki nüfuzumuzu ve gücümüzü daha da artırmak için, ihtiyacı olanlara uygun koruma sunarak bir Danimarka Hegemonyası kurmalıyız. İskandinav ve Baltık kardeşlerimizi savunmak, tüm bölgedeki güvenliği güçlendirecek ve hepimize fayda sağlayacaktır."
 DEN_overthrow_the_government:0 "Hükûmeti Devir"
 DEN_overthrow_the_government_desc:0 "Ülkemiz çok uzun zamandır sadece kendilerini düşünen açgözlü insanlar tarafından yönetildi - Danimarka halkına tehdit oluşturan tüm tehlikeleri görmezden gelerek. Yeni bir düzenin kurulması ve [DEN.GetNameDef] için yeni bir çağın başlaması zamanı geldi!"
 DEN_pan_scandinavianism:0 "Pan-İskandinavizm"
 DEN_pan_scandinavianism_desc:0 "İskandinavya ve daha az ölçüde tüm İskandinav bölgesi, binlerce yıldır uzun, ortak bir tarihle yakından iç içe geçmiştir. Halklarımız arasındaki zaten yakın bağları kullanarak, birleşmeye doğru adımlar atabiliriz."
 DEN_petition_for_independence:0 "Bağımsızlık için Dilekçe Ver"
 DEN_petition_for_independence_desc:0 "Üzerimize düşeni yaptık ve [?DEN.DEN_overlord_nation.GetAdjective] efendilerimize tüm girişimlerinde yardımcı olduk. Kendimizi güvenilir ve güvenilir olarak gösterdik, bu yüzden [?DEN.DEN_overlord_nation.GetNameDef]'e sadık bir müttefik olarak kalırken bağımsızlık için dilekçe verme zamanı geldi."
 DEN_pledge_allegiance:0 "Sadakat Yemini Et"
 DEN_pledge_allegiance_desc:0 "[?DEN.DEN_overlord_nation.GetNameDef] ile olan ilişkimizden tam olarak yararlanabilmek için onlara sadakat yemini etmeliyiz - her iki ulusun da büyüyüp faydalanabileceği simbiyotik bir ortaklık yaratma hırslarımızdaki samimiyetimizden şüphe duymalarına izin vermeden."
 DEN_policy_of_disarmament:0 "Silahsızlanma Politikası"
 DEN_policy_of_disarmament_desc:0 "Birkaç on yıldır bir silahsızlanma politikası izliyoruz, ki bu da Büyük Savaş'ın dehşetinden kurtulmamızın nedenlerinden biridir. Herhangi bir komşuya tehdit edici görünmeyerek bu sefer de kurtulabiliriz."
 DEN_political_unity:0 "Siyasi Birlik"
 DEN_political_unity_desc:0 "Ancak işbirliği yaparak ve parti çizgilerinin üzerinde çalışarak ulusumuzu güvende tutmayı umabiliriz. Siyasi farklılıklarımızı bir kenara bırakmak hiç bu kadar önemli olmamıştı ve sadece pragmatik olarak Danimarka'yı koruyabiliriz."
 DEN_potential_fuel_silos_tt:0 "§YFuel Storage§! araştırıldığında, §Y2§! Eyalette §G1§! İnşaat Alanı ve §G1§! §YFuel Silo§! ekle."
 DEN_potential_refinery_tt:0 "§Y$synth_oil_experiments$§! araştırıldığında, §Y$STATE_99$§!'da §G1§! İnşaat Alanı ve §G1§! §Y$synthetic_refinery$§! ekle."
 DEN_prioritize_army:0 "Hæren'e Öncelik Ver"
 DEN_prioritize_army_desc:0 "Herhangi bir ordunun bel kemiği ordunun kendisidir. Kaynaklarımızı askerlerin eğitimine ve savaş makineleri ile teçhizatının üretimine yönlendirirsek, [DEN.GetNameDef]'i tehdit etmeye cüret eden herkese karşı koymaya hazır olmaktan da öte oluruz."
 DEN_prioritize_navy:0 "Søværnet'e Öncelik Ver"
 DEN_prioritize_navy_desc:0 "Ana topraklarımız küçük bir yarımadadan ibarettir ve bu nedenle bekleyen filomuzun gelişimine öncelik vermemiz büyük önem taşır. [DEN.GetAdjective] donanması bir gün [ENG.GetAdjective] veya [JAP.GetAdjective]'ninkiyle rekabet edebilir, ancak sadece onu geliştirmek için zaman ve para harcarsak."
 DEN_prospecting_new_sites:0 "Yeni Alanlar Araştırma"
 DEN_prospecting_new_sites_desc:0 "Qaarsuarsuk'taki eski maden tükenmiştir, ancak Qullissat bölgesinde başka yataklar vardır. Burada yeni bir maden açmak sadece Grönland'daki sanayiler için değil, aynı zamanda evdeki ihtiyaçlarımızı da karşılayacağı için çok faydalı olacaktır."
 DEN_protect_bornholm:0 "Bornholm'u Koru"
 DEN_protect_bornholm_desc:0 "Bornholm, [SWE.GetNameDef]'nin hemen güneyinde ve [GER.GetNameDef]'nin kuzeyinde, Danimarka'nın geri kalanından her iki ülkeye de daha yakın, tehlikeli bir şekilde yerleştirilmiştir. Baltık'taki bu stratejik olarak yerleştirilmiş adayı güçlendirmeli ve üzerindeki kontrolümüzü güvence altına almalıyız."
 DEN_protect_greenland:0 "Grönland'ı Koru"
 DEN_protect_greenland_desc:0 "Grönland uzun zamandır krallığımızın bir parçası olmuştur ve adadaki iddialar Viking Çağı'na kadar uzanmaktadır. Bu adayı kaybetmek ulusal bir felaket ve büyük bir prestij kaybı olacaktır. Adaya yönelik herhangi bir potansiyel saldırıyı caydırmak için savunmasını güçlendirmeliyiz."
 DEN_protect_the_faroe_islands:0 "Faroe Adalarını Koru"
 DEN_protect_the_faroe_islands_desc:0 "Artan dünya gerilimiyle, Kuzey Denizi yakında bazı ağır çatışmalar görebilir. Faroe Adaları, Grönland ve birçok kaynağı üzerinde kontrol uygulama yeteneğimizde hayati bir bağlantıdır. Bu takımadaları kaybetmek bizim için yıkıcı olabilir, bu yüzden savunmasını güvence altına almamız son derece önemlidir."
 DEN_public_works:0 "Kamu İşleri"
 DEN_public_works_desc:0 "Bir kamu işleri programı yayınlayarak, sadece adalarımızı birbirine bağlayan köprüler inşa ederek ulusumuzun altyapısını iyileştirmekle kalmaz, aynı zamanda yeni konut projeleri başlatabilir ve hala yüksek olan işsizlik seviyesini düşürebiliriz."
 DEN_rally_the_nation:0 "Ulusu Topla"
 DEN_rally_the_nation_desc:0 "Şimdi ülkenin kontrolünü ele geçirdiğimize göre, halkın desteğini kazanmamız son derece önemlidir. Bize karşı pek bir şey yapamasalar da, arkanızda bıçaklı bir halk yerine, yanınızda ulusları için savaşmaya hazır bir halka sahip olmak çok daha iyidir. [DEN.GetAdjective] gururunu geri getirelim ve halkı ülkeleri için savaşmaya toplayalım!"
 DEN_reclaim_atlantic_islands:0 "Atlantik Adalarımızı Geri Al"
 DEN_reclaim_atlantic_islands_desc:0 "Faroe ve İzlanda'nın sözü edilecek doğal kaynakları olmayabilir, ancak yine de krallığımızın bir parçasıdır ve adalar Kuzey Atlantik'e hükmetmek için bir sıçrama taşı görevi gördüğü için hayati stratejik öneme sahiptir.\n\nGrönland, ulusumuzun modern ve etkili bir orduyu çalıştırmak için gereken her türlü doğal kaynağa sahip tek parçasıdır, bu da onu en büyük önceliğimiz yapar."
 DEN_reclaim_norway:0 "Norveç'i Geri Al"
 DEN_reclaim_norway_desc:0 "Danimarka Tacı, İsveçliler 1814'te bizden almadan önce yüzlerce yıl [NOR.GetNameDef]'i yönetti. Kralın kardeşi, [NOR.GetNameDef]'nin Kralı Haakon, doğrudan kontrolü ele almakta ve halkını korumak için gerekli seçimleri yapmakta isteksiz olduğunu gösterdi. İki ülkeyi bir kez daha Danimarka yönetimi altında birleştirme zamanı geldi."
 DEN_refit_civilian_ships:0 "Eski Gemileri Yeniden Donat"
 DEN_refit_civilian_ships_decision_tt:0 "Konvoyları askeri amaçlar için yeniden donatma kararlarının kilidini açar."
 DEN_refit_civilian_ships_desc:0 "Bizden çok daha büyük donanmalara sahip uluslarla çevriliyiz. Yeteneklerine yetişmek istiyorsak sayılarımızı artırmalıyız. Yeterli gemiyle, çoğu donanmayı geri püskürtebiliriz."
 DEN_refit_civilian_ships_industrial_modifier_tt:0 "$DEN_modify_industrial_capability_dynamic_modifier$ \n$MODIFIER_INDUSTRIAL_REFIT_SPEED_FACTOR$: §G+%20§!\n\n"
 DEN_refortify_tunestillingen:0 "Tunestillingen'i Yeniden Güçlendir"
 DEN_refortify_tunestillingen_desc:0 "Avrupa son kez savaşa girdiğinde, København'ı korumak için bir dizi tahkimat olan Tunestillingen'i inşa ederek savunmamızı hazırladık. Bu kaleler o zamandan beri bakımsız kaldı, ancak onları yeniden inşa ederek ve modernize ederek Başkentimizin güvenliğini sağlayabiliriz."
 DEN_reintegrate_iceland:0 "İzlanda'yı Yeniden Entegre Et"
 DEN_reintegrate_iceland_desc:0 "Çok uzun zaman önce, [ICE.GetNameDef] ulusumuzun bir parçasıydı - ve yüzyıllardır öyleydi. [ICE.GetAdjective] halkını krallığımıza katılmaya ve bir kez daha birleşik bir ulus olmaya ikna etme zamanı geldi de geçiyor."
 DEN_remove_economic_crisis_in_730_days_tt:0 "§Y$DEN_economic_crisis_dynamic_modifier$§! 730 gün içinde kaldırılacak"
 DEN_reorient_production_lines:0 "Üretim Hatlarını Yeniden Yönlendir"
 DEN_reorient_production_lines_desc:0 "Kendimizi çok yakında daha fazla askeri teçhizata ihtiyaç duyabileceğimiz istikrarsız bir durumda buluyoruz. Askeri silahlar için bu artan ihtiyacı karşılamak için, sivil fabrikaları silah üretimine dönüştürmemiz gerekiyor."
 DEN_reorient_production_lines_output_modifier_tt:0 "$DEN_modify_industrial_capability_dynamic_modifier$ \n$MODIFIER_CONSUMER_GOODS_FACTOR$: §Y+%10.0§! \n$MODIFIER_LINE_CHANGE_PRODUCTION_EFFICIENCY_FACTOR$: §G+%10.00§! \n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+%5.00§! \n$MODIFIER_INDUSTRIAL_CAPACITY_DOCKYARD_FACTOR$: §G+%5.00§! \n$MODIFIER_EQUIPMENT_CONVERSION_SPEED$: §G+%10§!\n\n"
 DEN_research_and_development:0 "Araştırma ve Geliştirmeye Yatırım Yap"
 DEN_research_and_development_desc:0 "Petrol ve makineler, modern toplumu döndüren şeylerdir ve bu alanların neredeyse hepsinde geride kaldık. Daha da geride kalmadığımızdan emin olmalıyız."
 DEN_restructuring_sovaernet:0 "Søværnet'i Yeniden Yapılandırma"
 DEN_restructuring_sovaernet_add_modifier_tt:0 "$DEN_add_sovaernet_dynamic_modifier$ $MODIFIER_NAVAL_COORDINATION$: §G+%5§! \n$MODIFIER_NAVY_ORG_FACTOR$: §G+%5.0§! \n$MODIFIER_NAVAL_MORALE_FACTOR$: §G+%5.0§! \n$MODIFIER_NAVAL_CRITICAL_SCORE_CHANCE_FACTOR$ §G+%5.00§!\n\n"
 DEN_restructuring_sovaernet_desc:0 "Onlarca yıldır barış içinde olduğumuzdan, deniz komuta yapımızdaki bir dizi hata fark edilmemişti. Onlarla başa çıkmanın tek yolu şimdi Søværnet'in tam bir yeniden düzenlenmesidir."
 DEN_restructuring_sovaernet_modifier_tt:0 "$DEN_modify_sovaernet_dynamic_modifier$ \n$MODIFIER_NAVAL_COORDINATION$: §G+%5§! \n$MODIFIER_NAVY_ORG_FACTOR$: §G+%5.0§! \n$MODIFIER_NAVAL_MORALE_FACTOR$: §G+%5.0§! \n$MODIFIER_NAVAL_CRITICAL_SCORE_CHANCE_FACTOR$ §G+%5.00§!\n\n"
 DEN_rigid_training:0 "Sıkı Eğitim"
 DEN_rigid_training_desc:0 "Sadece sayılar bize göklerde üstünlük sağlamayacak. Pilotlarımızı, gökleri [?DEN.DEN_overlord_nation.GetAdjective] uçaklarından arındırabilmeleri için sıkı bir eğitimden geçirmeliyiz."
 DEN_safeguard_the_eastern_front:0 "Doğu Cephesini Güvence Altına Al"
 DEN_safeguard_the_eastern_front_desc:0 "Finlandiya tarihsel olarak her zaman bizim ulaşamayacağımız bir yerde olmuştur, ancak yeniden canlanan gücümüzle, onu hegemonyamız altına almaktan çok daha fazlasını yapabiliriz. Finlandiya'yı güvence altına almak, Doğu Cephemizi güvence altına almak ve Baltık Denizi üzerindeki kontrolümüzü güçlendirmek anlamına gelir."
 DEN_sanction_sabotages:0 "Sabotajları Onayla"
 DEN_sanction_sabotages_desc:0 "[?DEN.DEN_overlord_nation.GetNameDef] ile işbirliği yapıyor olsak da, bu ille de işgale barışçıl bir şekilde direnemeyeceğimiz anlamına gelmez. Hatta halkımızı tehlikeye atmadan direnmenin bizim görevimiz olduğu iddia edilebilir."
 DEN_scandinavian_security:0 "İskandinav Güvenliği"
 DEN_scandinavian_security_desc:0 "İskandinavya ve Baltık Denizi, son birkaç yüzyıldır [DEN.GetNameDef] için ana jeopolitik odak noktaları olmuştur. Kıta üzerindeki büyük Avrupa güçlerine odaklanmadan önce, önce kuzey kanadımızı bastırmalı ve pasifize etmeliyiz."
 DEN_schleswigian_farmers_modifier_tt:0 "$DEN_modify_economic_crisis_dynamic_modifier$ \n$neutrality_drift$: §R-%0.02§!\n\n"
 DEN_science_pact:0 "Bir Araştırma ve Ortaklık Programına Gir"
 DEN_science_pact_desc:0 "Ulusumuz sanayilere daha ağır bir vurgu yaptıkça bilimsel ve teknolojik ilerlemede büyük adımlar atmış olsak da, hala belirli ulusların gerisindeyiz. Dost bir ülkeye yönelerek karşılıklı yarar sağlayan bir araştırma ve ortaklık programına girebilir, ilerlememizi daha da artırabiliriz."
 DEN_secure_danish_freedom:0 "Danimarka Özgürlüğünü Güvence Altına Al"
 DEN_secure_danish_freedom_desc:0 "[?DEN.DEN_overlord_nation.GetAdjective] güçlerini topraklarımızdan püskürtmek, Danimarka özgürlüğünü gerçekten güvence altına almak için yeterli olmayacaktır. [?DEN.DEN_overlord_nation.GetNameDef]'nin bir daha asla bir tehdit olmayacağından emin olmalıyız."
 DEN_secure_our_supply_lines:0 "İkmal Hatlarımızı Güvence Altına Al"
 DEN_secure_our_supply_lines_desc:0 "Bir ordu midesi üzerinde yürür - bu bugün binlerce yıl önce olduğu kadar doğrudur. Neyse ki, biz büyük bir gıda üreticisiyiz ve lojistiğimizdeki birkaç iyileştirme ile birliklere istikrarlı bir tedarik sağlayabiliriz."
 DEN_secure_our_supply_lines_modifier_tt:0 "$DEN_modify_economic_crisis_dynamic_modifier$ \n$MODIFIER_GLOBAL_MONTHLY_POPULATION$: §G+%10.0§! \n$democratic_drift$: §G+%0.05§!\n\n"
 DEN_secure_swedish_steel:0 "İsveç Çeliğini Güvence Altına Al"
 DEN_secure_swedish_steel_desc:0 "[DEN.GetNameDefCap] kaynak açısından fakir bir ülkedir ve modern bir orduyu çalıştırmak için gereken malzemenin çoğundan yoksundur. Diğer yandan İsveç'in bol miktarda doğal kaynağı vardır - ve eskiden Danimarka yönetimi altındaydı. [SWE.GetNameDef]'i bir kez daha bizim yönetimimiz altına alma zamanı geldi."
 DEN_secure_the_norwegian_coast:0 "Norveç Kıyısını Güvence Altına Al"
 DEN_secure_the_norwegian_coast_desc:0 "Danimarka ve Norveç yüzyıllardır birleşikti ve eğer Kuzey Denizi'ni kontrol etmek veya onun ötesine genişlemek istiyorsak, ülkelerimizi bir kez daha birleştirmeliyiz. Norveç kıyısı, Atlantik'e hükmetmek istiyorsak hayati bir sıçrama taşıdır."
 DEN_seek_foreign_support_tt:0 "Kararın kilidini açar: §YYabancı Güçlerden Destek Ara§!"
 DEN_seek_independence:0 "Bağımsızlık Ara"
 DEN_seek_independence_desc:0 "[?DEN.DEN_overlord_nation.GetNameDef] ile işbirliği yapmamıza rağmen, Danimarka'nın bağımsızlığı artık bir garanti değil. İşgal güçlerine direnerek ve zamanı geldiğinde saldırarak özgürlüğümüzü güvence altına almalıyız."
 DEN_seek_industrial_investments:0 "Endüstriyel Yatırım Ara"
 DEN_seek_industrial_investments_desc:0 "[?DEN.DEN_overlord_nation.GetNameDef] ile hizalanıp onların güvenini ve lütfunu kazandıktan sonra, efendimizden sanayimize yatırım yapmasını ve üretim yeteneklerimizi desteklemesini isteyebileceğimiz elverişli bir durumdayız."
 DEN_seek_military_investments:0 "Askerî Yatırım Ara"
 DEN_seek_military_investments_desc:0 "Sadakatimizi yemin edip [?DEN.DEN_overlord_nation.GetNameDef] ile ilişkilerimizi güçlendirdikten sonra, şimdi [?DEN.DEN_overlord_nation.GetLeader]'ın lütfuna sahibiz. Bu, doğrudan ona dönüp askeri üretimimize [?DEN.DEN_overlord_nation.GetAdjective] yatırımları istememize olanak tanır."
 DEN_seek_protection:0 "Koruma Ara"
 DEN_seek_protection_desc:0 "İstediğimiz kadar hazırlanabiliriz, ancak daha büyük, daha güçlü komşularla çevriliyiz - niyetlerinden gerçekten emin olamayız. Bu nedenle, bağımsızlığımızı güvence altına almak için başka bir yerden koruma aramak sağlam bir fikirdir."
 DEN_seize_power:0 "İktidarı Ele Geçir"
 DEN_seize_power_desc:0 "[DEN.GetNameDefCap] nihayet yeni bir faşist hükûmeti kabul etmeye hazır. Rigsdag'ı lağvedeceğiz ve bunun yerine büyük ulusumuzun geleceğini $DEN_cay_lembcke$'nin ellerine bırakacağız. Ancak, en ufak bir direniş olursa, onu kesin olarak ezmeye hazır olmalıyız."
 DEN_seize_the_production:0 "Üretim Araçlarını Ele Geçir"
 DEN_seize_the_production_desc:0 "Olağanüstü zamanlar olağanüstü önlemler gerektirir. Tam endüstriyel potansiyelimize ulaşmak için üretim araçlarını ele geçirmeliyiz. Bu, sanayilerin ulusun ihtiyacına hizmet etmesini ve mümkün olduğunca verimli çalışmasını sağlayacaktır."
 DEN_side_with_industry:0 "Sanayinin Yanında Ol"
 DEN_side_with_industry_desc:0 "İş dünyasının karşılaştığı sorunları çözmek için ücretleri düşürmeli ve ithal mallara daha yüksek gümrük vergileri koymalıyız, aksi takdirde işverenler gelişmekte zorlanacaktır."
 DEN_side_with_unions:0 "Sendikaların Yanında Ol"
 DEN_side_with_unions_desc:0 "[DEN.GetNameDef]'deki tüm insanların yaşam koşullarını iyileştirerek ancak işgücü piyasasını rahatsız eden sorunları çözebiliriz ve ancak sendikaları güçlendirerek bunu başarabiliriz."
 DEN_sign_a_trade_deal:0 "Bir Ticaret Anlaşması Müzakere Et"
 DEN_sign_a_trade_deal_desc:0 "Askeri kuvvetlerimizi yeniden silahlandırmakta kararlıyız, ancak bu şeyler zaman alır - sahip olamayabileceğimiz zaman. Daha hızlı daha fazla teçhizat edinmeliyiz. Kendi üretim yeteneklerimiz sınırlı olduğu için dostane niyetli bir ulusa yönelmeli ve ihtiyacımız olanı tedarik etmeliyiz."
 DEN_sign_forsvarsforliget:0 "Forsvarsforliget'i İmzala"
 DEN_sign_forsvarsforliget_desc:0 "Avrupa'da gerilim bir kez daha artarken, mevcut savunma yeteneklerimizin ciddi şekilde eksik olduğunu itiraf etmeliyiz. Ordu, donanma ve hava kuvvetleri için finansmanı artırmak üzere yeni bir savunma anlaşması imzalamak, askeri yeteneğimizi güçlendirir ve ulusumuzun bütünlüğünü güvence altına alır."
 DEN_sign_non_aggression_deal:0 "Saldırmazlık Paktı İmzala"
 DEN_sign_non_aggression_deal_desc:0 "Daha güçlü bir ulusla dost olmayı başarırsak ve onlarla bir saldırmazlık paktı imzalarsak çok şey kazanırız. Yakın gelecekte istikrarsız durumumuzu değiştirmeyebilir, ancak ileride bu daha yakın bağlar farklı ticaret anlaşmaları açarak ve işbirliğini artırarak bize fayda sağlayabilir."
 DEN_sikkerhedspolitiet:0 "Sikkerhedspolitiet"
 DEN_sikkerhedspolitiet_desc:0 "Bir istihbarat servisi kurmak, Avrupa'daki gerilimler artarken ve çatışma egemenliğimizi aşındırmakla tehdit ederken uyanıklığımızı artırmamıza yardımcı olacaktır."
 DEN_slaedepatruljen_sirius:0 "Slædepatruljen Sirius"
 DEN_slaedepatruljen_sirius_desc:0 "Anakara Danimarka kışın çok az kar alır ve nadiren uzun süre kalır. Ancak, karın tüm yıl boyunca kilometrelerce kalın olduğu Grönland'a sahibiz. Bundan yararlanabilir ve birliklerimizi soğuğa alıştırmak için orada eğitebiliriz."
 DEN_social_stability:0 "Sosyal İstikrar"
 DEN_social_stability_desc:0 "Diğer ulusları sarsan sosyal istikrarsızlıktan kaçınmak için önleyici adımlar atmalıyız! Sanayilere ve ekonomiye geniş çaplı reformlar yapmadan önce, sağlam ve istikrarlı bir duruşumuz olmalı."
 DEN_sovaernets_operative_kommando:0 "Søværnets Operative Kommando"
 DEN_sovaernets_operative_kommando_add_modifier_tt:0 "$DEN_add_sovaernet_dynamic_modifier$ $MODIFIER_NAVAL_COORDINATION$: §G+%5§! \n$MODIFIER_NAVY_ORG_FACTOR$: §G+%5.0§! \n$MODIFIER_NAVAL_MORALE_FACTOR$: §G+%5.0§! \n$MODIFIER_NAVAL_CRITICAL_SCORE_CHANCE_FACTOR$ §G+%5.00§!\n\n"
 DEN_sovaernets_operative_kommando_desc:0 "Donanmalarımızı verimli bir şekilde koordine edebilecek yetkin bir merkezi komuta yapısına ihtiyacımız var. Bu göreve sadece en iyi ve en parlak subaylar güvenilmelidir."
 DEN_sovaernets_operative_kommando_modifier_tt:0 "$DEN_modify_sovaernet_dynamic_modifier$ \n$MODIFIER_NAVAL_COORDINATION$: §G+%5§! \n$MODIFIER_NAVY_ORG_FACTOR$: §G+%5.0§! \n$MODIFIER_NAVAL_MORALE_FACTOR$: §G+%5.0§! \n$MODIFIER_NAVAL_CRITICAL_SCORE_CHANCE_FACTOR$ §G+%5.00§!\n\n"
 DEN_start_the_rearmament:0 "Yeniden Silahlanmayı Başlat"
 DEN_start_the_rearmament_desc:0 "[DEN.GetNameDef] çok uzun zamandır ordumuzu ihmal etti ve egemenliğimizi komşularımızın ellerine bıraktı. Avrupa'yı saran kargaşa ile bu böyle devam etmeyecek! Askeri yeteneklerimizi bir kez daha inşa etmeli ve kaderimizin kendi ellerimizde olduğundan emin olmalıyız."
 DEN_stockpile_oil:0 "Petrol Stokla"
 DEN_stockpile_oil_add_modifier_war_preparations_tt:0 "$MODIFIER_FUEL_GAIN_FACTOR$: §G+%10.00§! \n$MODIFIER_MAX_FUEL_FACTOR$: §G+%15.00§! \n$modifier_production_speed_fuel_silo_factor$: §G+%25.00§!\n\n"
 DEN_stockpile_oil_desc:0 "En kötüsüne hazır olmalı ve savaşa hazırlanmaya başlamalıyız. Hiçbir zaman savaş görmesek bile, yakınımızdaki büyük bir çatışma bizi etkileyecektir. Bu etkiyi en aza indirmek için büyük stratejik kaynak rezervleri biriktirmeliyiz."
 DEN_stockpile_oil_modifier_neglected_military_tt:0 "$DEN_modify_neglected_military_dynamic_modifier$ \n$MODIFIER_SURRENDER_LIMIT$: §G+%10.00§!\n\n"
 DEN_stockpile_oil_modifier_war_preparations_tt:0 "$DEN_modify_war_preparations_dynamic_modifier$ \n$MODIFIER_FUEL_GAIN_FACTOR$: §G+%10.00§! \n$MODIFIER_MAX_FUEL_FACTOR$: §G+%15.00§! \n$modifier_production_speed_fuel_silo_factor$: §G+%25.00§!\n\n"
 DEN_strength_in_numbers:0 "Sayıdaki Güç"
 DEN_strength_in_numbers_desc:0 "Çok daha güçlü bir düşmana karşı savaşma şansımız olmasını istiyorsak, müttefikler aramalıyız - tarafsızlığımız kahrolsun! Bu saflığı geride bırakıp dünyanın gerçeklerine uyum sağlama zamanı geldi."
 DEN_strengthen_military_industries:0 "Askerî Sanayileri Güçlendir"
 DEN_strengthen_military_industries_desc:0 "Sağlam bir askeri silah sanayisine yatırım yapmak önümüzdeki zamanlarda kritik olabilir. Halkımızı korumak için silahlanmaya ihtiyaç duyduğumuzda iyi hazırlanmış olduğumuzdan emin olmalıyız."
 DEN_strengthen_the_danish_brigades:0 "Danimarka Tugaylarını Güçlendir"
 DEN_strengthen_the_danish_brigades_desc:0 "[?DEN.DEN_overlord_nation.GetNameDef]'nin sahip olduğu ateş gücünü toplayamayacağız, bu yüzden akıllıca savaşmalı ve onları alt etmeliyiz. Düşmanlarımızı incelemeli ve savaş alanında sömürmek için zayıf yönlerini bulmalıyız."
 DEN_strengthen_the_officer_corp:0 "Subay Kadrosunu Güçlendir"
 DEN_strengthen_the_officer_corp_desc:0 "Subaylar, askeri operasyonların başarısında çok önemli bir rol oynar ve silahlı kuvvetlerimizin etkinliğini sağlamak için subay kadromuzu güçlendirmeye yeniden bir vurgu yapmalıyız. Yeni nesil yetenekli ve adanmış liderler yetiştirmeliyiz."
 DEN_support_battalions:0 "Destek Taburları"
 DEN_support_battalions_desc:0 "Eğer Danimarka Tugayı işlevsel bir güç olacaksa ve [ROOT.GetNameDef]'i kurtarma şansı olacaksa, yeterli malzemeye sahip olmalıdır. Tüfekler ve makineli tüfekler çok iyi, ancak topçu ve uçaksavar desteği bu devirde zorunludur."
 DEN_support_bornholms_industries:0 "Bornholm Sanayilerini Destekle"
 DEN_support_bornholms_industries_desc:0 "Bornholm'un önemli doğal kaynakları olmasa da, birkaç sanayisine yatırım yapmak ve aynı zamanda tüm komşularımıza kimin adası olduğunu hatırlatmak yine de iyi bir fikir olabilir."
 DEN_support_schleswigian_farmers:0 "Schleswig Çiftçilerini Destekle"
 DEN_support_schleswigian_farmers_desc:0 "Güney Jutland'da büyüyen marjinal hareketler var, nihayetinde gergin ekonomik durum ve kolektif kimlikleri üzerindeki sürtünme tarafından teşvik ediliyor; Almanlar mı yoksa Danimarkalılar mı? Bölgedeki ekonomik teşvikimizi artırarak bu muhalefetin bir kısmını azaltabiliriz."
 DEN_support_the_faroes_industries:0 "Faroe Sanayilerini Destekle"
 DEN_support_the_faroes_industries_desc:0 "İçinde bulunduğumuz belirsiz zamanlarda, Faroe Adaları'nda var olan birkaç sanayiyi desteklemek akıllıca olabilir, bu da stratejik olarak yerleştirilmiş takımadalar üzerindeki iddiamızı inkâr edilemez hale getirir."
 DEN_sway_the_nordics:0 "İskandinavları Etkile"
 DEN_sway_the_nordics_desc:0 "Eski bir deyiş olan ‘Kalem Kılıçtan Keskindir’ hakkında söylenecek bir şeyler var. Kaba kuvvet kullanmak yerine, diplomatik yollarla diğer ulusları davamıza çekmeye çalışmak akıllıca olabilir."
 DEN_swedish_steel_production:0 "İsveç Çelik Üretimi"
 DEN_swedish_steel_production_desc:0 "Kuzey [SWE.GetNameDef]'nin maden zenginliğini egemenliğimiz altına aldıktan sonra, kendi çıkarma yeteneklerimizi artırmak için tüm madenlerden yararlanmak için mükemmel bir konumdayız, aynı zamanda zenginliğin bir kısmını yurtdışına ihraç etmek için de - güvenlik garantileri karşılığında."
 DEN_territory_for_protection:0 "Koruma için Toprak"
 DEN_territory_for_protection_desc:0 "Yeniden silahlanma programı plana göre ilerliyor, ancak orduda bunun yeterli olacağına dair hala şüphe var. Sadece bir saldırmazlık paktına sahip olmak yerine daha somut bir koruma garantisi için topraklarımızdan bazılarını satabiliriz. Böyle bir anlaşma ekonomimize bile fayda sağlayabilir."
 DEN_the_Kanslergadeforlig_modifier_tt:0 "$DEN_modify_economic_crisis_dynamic_modifier$ \n$democratic_drift$: §G+0.05§!\n\n"
 DEN_the_royal_guard:0 "Den Kongelige Livgarde'yi Genişlet"
 DEN_the_royal_guard_desc:0 "Kraliyet Muhafızları, Kral ve ailesinin güvenliğini korumakla yaklaşık 300 yıldır görevlidir ve görevlerinde adanmış ve sadık olduklarını defalarca kanıtlamışlardır. Sayılarını ve disiplinlerini artırarak silahlı kuvvetlerimizi daha da güçlendirebiliriz."
 DEN_torpedofly:0 "Torpedofly"
 DEN_torpedofly_add_modifier_tt:0 "$DEN_add_flyvevabnet_dynamic_modifier$ $MODIFIER_NAVAL_STRIKE_TARGETTING_FACTOR$: §G+%10.§! \n$MODIFIER_AIR_AGILITY_FACTOR$: §G+%5§!\n\n"
 DEN_torpedofly_desc:0 "Denizaşırı mülklerimizi elimizde tutmanın tek yolu, gücümüzü ve irademizi sular boyunca yansıtabilmektir. Bu, büyük bir deniz ve hava kuvveti koordinasyonu ve stratejisi gerektirecektir."
 DEN_torpedofly_modifier_tt:0 "$DEN_modify_flyvevabnet_dynamic_modifier$: \n$MODIFIER_NAVAL_STRIKE_TARGETTING_FACTOR$: §G+%10.§! \n$MODIFIER_AIR_AGILITY_FACTOR$: §G+%5§!\n\n"
 DEN_total_war:0 "Total Krig"
 DEN_total_war_desc:0 "Bu savaştaki mevcut kayıplarımız kabul edilemez. Ancak, bu son değil. Birliklerimizi toplamalı ve topyekûn savaş için hazırlanmalıyız. Düşmanı geri püskürtebilir ve sahip olduğumuz her şeyi onlara karşı kullanırsak, bu fırtınayı atlatma şansımız olabilir. Halkı toplayın, sanayilerimizin sonuncusunu seferber edin, yerimizi korumalıyız!"
 DEN_trade_deal_consumer_goods_modifier_tt:0 "$DEN_modify_industrial_capability_dynamic_modifier$ \n$MODIFIER_CONSUMER_GOODS_FACTOR$: §Y-%15.0§!\n\n"
 DEN_trade_with_britain:0 "İngiltere ile Ticaret Yap"
 DEN_trade_with_britain_desc:0 "[ENG.GetNameDefCap] tarihsel olarak tarım ürünleri için en büyük ihracat pazarımız olmuştur, ancak Büyük Buhran'dan sonra bu ticaret neredeyse durmuştur. Kronun devalüasyonu ile, eski ticaret bağlantılarımızı yeniden kurmayı denemek için İngilizlere ulaşma zamanı geldi."
 DEN_trade_with_germany:0 "Almanya ile Ticaret Yap"
 DEN_trade_with_germany_desc:0 "[GER.GetNameDefCap] tarihsel olarak büyük miktarlarda tarım ürünlerimizi ithal etmiştir ve Büyük Savaş bile bunu durduramamıştır. Ancak son birkaç yılda iki ülke arasındaki ticaret azalmıştır. Belki şimdi bu eğilimi tersine çevirme zamanıdır!"
 DEN_train_mountain_infantry:0 "Dağ Eğitimi"
 DEN_train_mountain_infantry_desc:0 "İskandinavya'nın Batı ve Kuzey kısımları dağlık arazidir - anakara Danimarka'da sahip olmadığımız bir şey. Krallığımızı daha iyi korumak için savaş yeteneklerimizi artırmak üzere bu dağlarda askeri tatbikatlar yapmalıyız."
 DEN_undermine_overlord_continuous_focus:0 "Hâkim Devlet Nüfuzunu Zayıflat"
 DEN_undermine_overlord_continuous_focus_desc:0 "Danimarka egemenliğini sağlamak için Hâkim Devletlerimizi direnmek ve zayıflatmak için elimizden geleni yapmalıyız."
 DEN_unify_flyvevabnet:0 "Flyvevåbnet'i Birleştir"
 DEN_unify_flyvevabnet_desc:0 "Şu anki haliyle, iki farklı ve tamamen ayrı hava kuvvetimiz var; ordunun Hærens Flyvertropper'ı ve donanmanın Marinens Flyvevæsen'i. Her iki kol da genellikle birbiriyle anlaşmazlık içindedir. Onları tek bir hava kuvveti biriminde birleştirmek, tutarlı bir strateji yaratır ve silahlı kuvvetlerin yeni bir kolunu kurar."
 DEN_unify_the_right:0 "Sağı Birleştir"
 DEN_unify_the_right_desc:0 "[DEN.GetNameDefCap] çok uzun zamandır sorumsuzca yönetildi! Sadece Danimarka halkının saf inadı ve azmi sayesinde hala bir ülke olarak işlev görüyoruz. Sağcı siyasi partilerin nihayet Solcu tehdidine karşı ortak bir davada birleşme zamanı geldi!"
 DEN_unlocks_coastal_fortification_efforts:0 "Kararın kilidini açar: §YKıyı Tahkimat Çabaları§!\n\n"
 DEN_unlocks_fortification_efforts:0 "Kararın kilidini açar: §YTahkimat Çabaları§!\n\n"
 DEN_welcome_foreign_scientists:0 "Yabancı Bilim Adamlarını Karşıla"
 DEN_welcome_foreign_scientists_desc:0 "Avrupa'da bir kez daha sorunlar demleniyor ve insanlar kendilerini bastırmaya çalışan rejimlerden kaçıyor. Bunlardan bazılarını kollarımızı açarak karşılayarak çok fazla bilgi ve yetkinlik kazanabiliriz."
 DEN_with_modernize_the_navy_completed_tt:0 "\n§Y$DEN_modernize_the_navy$§! tamamlandığında:"
 DEN_with_refit_old_ships_completed_tt:0 "§Y$DEN_refit_civilian_ships$§! tamamlandığında:"
 FIN_a_cry_for_help:0 "Bir Yardım Çığlığı"
 FIN_a_cry_for_help_desc:0 "Milletler Cemiyeti, üye devletleri çatışmadan koruma görevinde başarısız oldu. Ancak yurtdışında hâlâ yardım çığlığımızı duyup yardımımıza gelebilecek olanlar var. Ya da öyle umuyoruz."
 FIN_a_fascist_regime:0 "Faşist bir Rejim"
 FIN_a_fascist_regime_desc:0 "Ulusal parlamento ordunun nüfuzu altındayken, artık [FIN.GetName]'a güç, onur ve sadakate dayalı bir rejim kurabiliriz."
 FIN_a_fascist_regime_no_focus_coup_tt:0 "\nEğer §Y$FIN_prepare_a_military_coup$§! odağı tamamlandıysa: "
 FIN_a_fascist_regime_no_focus_discredit_tt:0 "\nEğer §Y$FIN_discredit_the_democratic_system$§! odağı tamamlandıysa: "
 FIN_a_new_course_for_kokoomus:0 "Kokoomus için Yeni Bir Rota"
 FIN_a_new_course_for_kokoomus_desc:0 "Son olaylar, insanlar güçlü, mantıklı bir liderlik ve geleneksel değerlere dönüş ararken Kokoomus partisine olan destekte bir artışa yol açtı. Partinin muhafazakâr gündemini ilerleterek bundan faydalanmalıyız."
 FIN_academic_karelian_society:0 "Akademik Karelya Topluluğu"
 FIN_academic_karelian_society_desc:0 "On yılı aşkın bir süredir, Helsinki Üniversitesi'ndeki bir grup aydın ve öğrenci giderek daha etkili hale geldi. Temel hedefleri, Finlandiya'yı tarihimiz doğrultusunda geliştirme arayışı olması nedeniyle bizimkilerle iyi örtüşüyor. Belki birlikte işbirliği yapmanın bir yolunu bulabiliriz."
 FIN_acquire_andros_dockyards:0 "Andros Tersanelerini Satın Al"
 FIN_acquire_andros_dockyards_desc:0 "Turku'daki Andros tersanesinin satın alınması, önde gelen gemi tasarımcımız $FIN_crichton_vulcan_organization$'ın üretim yeteneklerini büyük ölçüde artıracaktır. Bu yeni eklemeyle, [ROOT.GetAdjective] Donanması daha fazla ve daha iyi gemiler üretebilecek, bölgedeki güçlerini ve nüfuzlarını artıracaktır."
 FIN_advanced_jaeger_training_program:0 "Gelişmiş Jaeger Eğitim Programı"
 FIN_advanced_jaeger_training_program_desc:0 "Jaeger birliklerimiz, kökenleri Büyük Savaş'a, ilklerinin Almanya'da eğitim aldığı zamana dayanan, uzun zamandır silahlı kuvvetlerin seçkinleri olarak kabul edilmektedir. Belki de birlikleri modernize ederek yeniden canlandırmanın ve dolayısıyla tüm ordunun moralini yükseltmenin zamanı gelmiştir."
 FIN_aid_for_entrepreneurs:0 "Girişimcilere Yardım"
 FIN_aid_for_entrepreneurs_desc:0 "Kapitalizmin en kötü unsurlarını engellememiz gerekse de, ekonomimiz artan girişimcilik faaliyetlerinden büyük ölçüde faydalanabilir. Önemli endüstriler için yatırım hibeleri ve kredileri oluşturarak bu tür faaliyetleri teşvik edebiliriz."
 FIN_align_the_agrarian_league:0 "Tarımcılar Birliği'ni Hizala"
 FIN_align_the_agrarian_league_desc:0 "[ROOT.GetNameDefCap] son yüzyılda dikkate değer bir sanayileşme geçirdi, tarımsal emekleriyle ulusu besleyen milyonların içinde bulunduğu zor durumu görmezden gelemeyiz. Tarımcılar Birliği ile çalışarak, onların endişelerinin de şehirdeki mevkidaşları kadar iyi ele alındığından emin olabiliriz."
 FIN_ambitions_in_the_south:0 "Güney'deki Hırslar"
 FIN_ambitions_in_the_south_claims_tt:0 "[ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§!, [ROOT.GetNameDef] tarafından halihazırda hak iddia edilmeyen §Ytüm [EST.GetAdjective]§!, §Y[LAT.GetAdjective]§! ve §Y[LIT.GetAdjective] çekirdek eyaletlerinde§! hak iddia eder."
 FIN_ambitions_in_the_south_desc:0 "Baltık'ın küçük ulusları komşuları tarafından kıskançlıkla gözleniyor. Eğer yenileceklerse, potansiyel bir düşmandan ziyade bizim yararımıza olması daha iyidir."
 FIN_antagonize_the_soviets:0 "Sovyetleri Düşman Edin"
 FIN_antagonize_the_soviets_desc:0 "[SOU.GetNameDefCap], sosyalizm söylemine bürünebilir, ama orası bir işçi cenneti değil. İşçi sınıfının hayatını iyileştirmek için kendi yolumuzu bulacağız ve [SOV.GetAdjective] tehdidiyle işbirliği yapmayacağız."
 FIN_antagonize_the_soviets_event_tt:0 "[ROOT.GetFlag]§Y[ROOT.GetNameDef]§!'i [SOV.GetFlag]§Y[SOV.GetNameDef]§!'e karşı korumak için bir garanti arayarak §YAvrupa'daki her büyük demokratik veya komünist ulusa§! ulaşır."
 FIN_approach_major_democracies:0 "Büyük Demokrasilere Yaklaş"
 FIN_approach_major_democracies_desc:0 "Jeopolitikadaki daha saldırgan aktörlerin genişleyen nüfuzunu engellemek isteyen dünyanın liberal demokrasileriyle ortak bir çıkarımız var. Belki de bu ortak amaç doğrultusunda birlikte çalışabiliriz."
 FIN_approach_the_soviets:0 "Sovyetlere Yaklaş"
 FIN_approach_the_soviets_desc:0 "[SOU.GetNameDef]'deki yoldaşlarımız, burjuva emperyalizmine karşı proleter mücadelenin ön saflarında yer alıyor. Liderliklerine ulaşmalı ve [FIN.GetNameDef]'deki burjuvaziye karşı mücadelemiz için destek kazanmaya çalışmalıyız."
 FIN_arm_the_lotta_svard:0 "Lotta Svärd'ı Silahlandır"
 FIN_arm_the_lotta_svard_desc:0 "Lotta Svärd, yardımcı bir güç olarak rollerinde büyük bir varlık olduklarını kanıtladı. Yeterlilikleri ve vahim durumumuz göz önüne alındığında, belki de örgütü daha iyi silahlandırmanın ve silahlı kuvvetlere daha etkili bir şekilde entegre etmenin zamanı gelmiştir."
 FIN_bank_of_aland:0 "Åland Bankası"
 FIN_bank_of_aland_desc:0 "Åland Bankası, [ROOT.GetName]'ın ekonomisinin temel taşıdır ve büyümeyi ve refahı yönlendirmek için gerekli istikrarı ve desteği sağlar. \nÅland Bankası'na yatırım yaparak, [ROOT.GetName] geleceğine yatırım yapmakta, daha güçlü, daha müreffeh bir ulusun temelini atmaktadır."
 FIN_bring_foreign_armor_experts:0 "Yabancı Zırhlı Uzmanları Getir"
 FIN_bring_foreign_armor_experts_desc:0 "Tanklar, herhangi bir modern ordunun çok önemli bir bileşenidir, ancak onlarla olan deneyimimiz sınırlıdır. Belki de bu alandaki yabancı uzmanları bize yardım etmeleri için davet ederek onlarla olan yeteneklerimizi genişletebiliriz."
 FIN_bring_foreign_armor_experts_variants_tt:0 "[GER.GetFlag]§Y[GER.GetNameDefCap]§!, eğer ittifakımızdaysa bize §Y100§! eski hafif tank gönderecek. \n[ITA.GetFlag]§Y[ITA.GetNameDefCap]§!, [JAP.GetFlag]§Y[JAP.GetNameDefCap]§!, [SWE.GetFlag]§Y[SWE.GetNameDefCap]§!, [FRA.GetFlag]§Y[FRA.GetNameDefCap]§!, [ENG.GetFlag]§Y[ENG.GetNameDefCap]§!, [USA.GetFlag]§Y[USA.GetNameDefCap]§!, [SOV.GetFlag]§Y[SOV.GetNameDefCap]§!, eğer ittifakımızdaysa bize §Y50§! eski hafif tank gönderecek."
 FIN_british_threat:0 "İngiliz Tehdidi"
 FIN_british_threat_desc:0 "[ENG.GetNameDefCap], küresel burjuva ekonomisinin ve onun emperyalist dokunaçlarının kalbidir. Dünyanın nihayet onun zulmünden kurtulabilmesi için o kalbe şiddetle bir hançer saplamalıyız."
 FIN_coastal_defense:0 "Kıyı Savunması"
 FIN_coastal_defense_coastal_garrisons_dec_tt:0 "[GetCoastalGarrisonsDecTooltipFromNavyBranch]"
 FIN_coastal_defense_desc:0 "Yabancı saldırganlık karşısında, Fin kıyı şeridinin iyi korunmasını sağlamak son derece önemlidir. Kıyı savunma altyapısını geliştirerek, denizden gelebilecek olası tehditlere karşı kendimizi daha iyi hazırlayabiliriz."
 FIN_coastal_garrisons_locked:0 "\nKararın kilidini açar: §Y$FIN_coastal_garrisons$§!, Baltık'taki kıyı eyaletlerine garnizon tümenleri konuşlandırmamıza olanak tanır. \nEğer karar başka bir odak tarafından zaten açılmışsa: §Y$FIN_coastal_garrisons$§! kararını tamamlama §GMaliyeti ve Süresi§! §Gyarıya indirilir§!."
 FIN_coastal_garrisons_unlocked:0 "\n§Y$FIN_coastal_garrisons$§! kararını tamamlama Maliyeti ve Süresi yarıya indirilir."
 FIN_collaboration_with_the_left:0 "Sol ile İşbirliği"
 FIN_collaboration_with_the_left_desc:0 "Sol eğilimli partileri yabancılaştırmak hükûmetimizi güçlendirmeye pek yaramaz. Ancak onlarla işbirliği yapmanın bir yolunu bulursak, nüfusun daha fazlasını davamıza toplayabiliriz."
 FIN_communist_cw_construction_workers_tt:0 "- §Gİnşaat İşçileri, §YSivil Sanayi§! ve §YAltyapıya§! karşı sabotaj eylemleri gerçekleştirecek§!.\n"
 FIN_communist_cw_trade_unions_tt:0 "- §GSendika üyeleri, §YAskerî Sanayi§! ve §YTersanelere§! karşı sabotaj eylemleri gerçekleştirecek§!.\n"
 FIN_confederated_finno_russian_republics_dec_cat_tt:0 "§Y[ROOT.GetNameDef]§!'nin çekirdek eyaletleri olarak Fin nüfusuna sahip eski [SOV.GetAdjective] eyaletlerini entegre etmemize olanak tanıyan §Y$FIN_confederated_finno_russian_republics_category$§! Kararlarının kilidini açar."
 FIN_confederated_finno_russian_republics_desc:0 "Artık yönetimimiz altında sayısız farklı halk bulunuyor. Devletimiz içinde bir halklar hiyerarşisinin gelişmesini önlemek için, hükûmeti bir cumhuriyetler konfederasyonu olarak yeniden organize edeceğiz. Bu, tüm halkların kendi yönetimlerinde adil bir söz hakkına sahip olmasını sağlayacaktır."
 FIN_confederated_finno_russian_republics_state_modifier_tt:0 "\n§Y[ROOT.GetNameDef] tarafından kontrol edilen her [SOV.GetNameDef] çekirdek eyaleti§!:"
 FIN_contract_with_yhteissisu:0 "Yhteissisu ile Sözleşme"
 FIN_contract_with_yhteissisu_desc:0 "Önde gelen [ROOT.GetAdjective] şirketleriyle işbirliği içinde, [ROOT.GetAdjective] Savunma Kuvvetleri için güvenilir ve verimli ulaşım sağlama hedefiyle Yhteissisu Oy şirketini kuracağız. \nSisu S-21 kamyon üretimini Yhteissisu'ya devretmek, askerî kullanım için kamyon ve otobüs üretimini destekleyecek ve kuvvetlerimizin her durum için gerekli kaynaklarla donatılmasını sağlayacaktır."
 FIN_control_the_flux_of_iron_ore:0 "Demir Cevheri Akışını Kontrol Et"
 FIN_control_the_flux_of_iron_ore_desc:0 "İsveç demir cevheri ve Norveç'in bunun dağıtımı, kıta genelinde ve ötesinde savaşların yürütüldüğü bir mekanizma olmaya devam ediyor. Bu kritik kaynak akışının mülkiyetini, düşmanlarımızın eline geçmeden önce ele geçirmeliyiz."
 FIN_control_the_flux_of_iron_ore_tt:0 "§Y[666.GetName]§!, §Y[918.GetName]§!, §Y[144.GetName]§!, §Y[924.GetName]§! ve §Y[925.GetName]§! eyaletleri üzerinde kontrol talep eder. \n[ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§!, [ROOT.GetAdjective] taleplerini reddeden herhangi bir ülkeye karşı §Y$take_state_focus$§! savaş hedefi kazanır."
 FIN_conversion_of_civilian_vessels:0 "Sivil Gemilerin Dönüştürülmesi"
 FIN_conversion_of_civilian_vessels_desc:0 "Savaş devam ederken, emrimizdeki tüm mevcut kaynakları kullanmalıyız. Sivil gemilerin dönüştürülmesiyle, [ROOT.GetName] deniz yeteneklerini hızla güçlendirebilir ve kıyılarını düşman tehditlerinden koruyabilir. Büyük buz kıranlar kıyı savunma gemileri olarak yeniden tasarlanabilirken, daha küçük gemiler muhrip veya devriye botu olarak hizmet edebilir ve [ROOT.GetAdjective] kıyısı boyunca zorlu bir savunma ağı oluşturabilir."
 FIN_conversion_of_civilian_vessels_ns_tt:0 " [GetAppropriateDlcConversionTooltip]\n"
 FIN_cooperate_with_social_democrats:0 "Sosyal Demokratlarla İşbirliği Yap"
 FIN_cooperate_with_social_democrats_desc:0 "Kapitalistlerle uzlaşma konusundaki istekliliklerinde açıkça yanlış yönlendirilmiş olsalar da, Sosyal Demokratların proletaryadan büyük destek aldığını ve liderlerinin çoğunun kendi alanlarında uzman olduğunu inkâr edemeyiz. İşçi cumhuriyetimizin yaratılmasında onlarla daha fazla işbirliği yapmalıyız."
 FIN_cooperation_with_germany:0 "Almanya ile İşbirliği"
 FIN_cooperation_with_germany_desc:0 "[GER.GetNameDef] ve [SOU.GetNameDef]'nin eninde sonunda birbirleriyle çatışacağı jeopolitik gerçeğine güvenebiliriz. Eğer [GER.GetAdjective]larla işbirliği yapsaydık, [SOU.GetAdjective]larla önceki savaşlardaki kayıplarımızın intikamını alabilir ve kendimiz için yeni fırsatlar yaratabilirdik."
 FIN_cooperation_with_germany_subsidies_tt:0 "§Y[GER.GetName]§!'ı hedefleyerek, §Y$small_plane_airframe$§!, §Y$medium_plane_airframe$§!, §Y$light_tank_chassis$§!, §Y$medium_tank_chassis$§!, §Y$artillery_equipment$§!, §Y$anti_air_equipment$§! ve §Y$anti_tank_equipment$§! için [?ROOT.FIN_basic_subsidies_value|Y2] £GFX_civ_factory_output ile §Y[ROOT.GetName]§!'a bir teçhizat sübvansiyonu ekleniyor."
 FIN_cw_soviet_commandos_tt:0 "- 6 §YPiyade§! taburu, 2 §YTopçu§! taburu ve 4 §YDestek Taburu§! bulunan Sovyet Komando birimleri, §Gbaşkent eyaletimizde ortaya çıkacak§!.\n\n"
 FIN_cw_soviet_equipment_delivery_tt:0 "- Sovyet Teçhizatı §GStoklarımıza teslim edilecek§!.\n"
 FIN_deep_sea_raiders:0 "Derin Deniz Akıncıları"
 FIN_deep_sea_raiders_desc:0 "Savaş çabaları tehlikedeyken, [ROOT.GetAdjective] Donanması, düşman ikmal hatlarını kesintiye uğratmak ve kendi ticaret yollarımızı korumak için modern denizaltıların üretimini artırmalıdır. Bu şık ve ölümcül gemiler, düşman denizcilerinin kalbine korku salacak ve [ROOT.GetName]'ın bir deniz gücü olarak yerini sağlamlaştırmaya yardımcı olacaktır."
 FIN_defense_in_depth:0 "Derinlemesine Savunma"
 FIN_defense_in_depth_desc:0 "Düşman güçlendikçe ve daha kararlı hale geldikçe, tek bir statik cephe hattının onları geri tutmak için yeterli olmayabileceği açıkça ortaya çıkıyor. Ana cephe hattının arkasında yeni tahkimatlar ve daha küçük savunma hatları inşa etmeliyiz, bu da çoklu koruma katmanları sağlar ve kuvvetlerimize gerektiğinde karşı saldırı yapma esnekliği verir. Düşmanın almaya çalıştığı her santim [ROOT.GetAdjective] toprağı için bedel ödeteceğiz."
 FIN_defensive_preparations:0 "Savunma Hazırlıkları"
 FIN_defensive_preparations_coastal_garrisons_dec_tt:0 "[GetCoastalGarrisonsDecTooltipFromPoliticalBranch]"
 FIN_defensive_preparations_desc:0 "İdeoloji ne olursa olsun, doğudaki komşumuzla çatışmaya mahkûm görünüyoruz. Kaçınılmaz olana hazırlanmalı ve savunmamızı hızla genişletmeliyiz. Başarısız olursak, ulusumuz bir kez daha düşmanlarımız tarafından yutulabilir."
 FIN_defensive_preparations_mining_the_sea_dec_tt:0 "[GetMiningTheSeasDecTooltipFromPoliticalBranch]"
 FIN_discredit_the_democratic_system:0 "Demokratik Sistemi İtibarsızlaştır"
 FIN_discredit_the_democratic_system_desc:0 "Demokratik sistemimiz, kararlı, anlamlı bir eylem olmaksızın sadece bir krizden diğerine savruluyor. İçinde bulunduğumuz bu tehlikeli durumda, artık bu tür bir zayıflığa tahammül edemeyiz ve kitleleri bu siyasi sistemin başarısızlıkları konusunda eğitmeliyiz."
 FIN_dominate_the_skies:0 "Göklere Hükmet"
 FIN_dominate_the_skies_desc:0 "[ROOT.GetAdjective] gökleri bizim olacak! Yeni avcı uçaklarının üretimi ve modern hava muharebe teknolojilerinin araştırılması ve geliştirilmesine yapılan yatırım, hava üstünlüğünü sağlamamıza ve vatanımızı korumamıza olanak tanıyacaktır. Yetenekli pilotlarımız göklere hükmedecek ve savaşı düşmana taşıyacaktır."
 FIN_dominate_the_skies_ns_tt:0 " $FIN_dominate_the_skies_dynamic_modifier_tt$\n"
 FIN_dreams_of_expansionism:0 "Yayılmacılık Hayalleri"
 FIN_dreams_of_expansionism_desc:0 "Risto Ryti, doğumuzdaki Karelya topraklarının kontrolünü ele geçirene kadar asla kalıcı barışa sahip olamayacağımızı haklı olarak kabul ediyor. Onları güvence altına aldığımızda, komşularımızla çok daha savunulabilir bir sınır yaratacağız."
 FIN_elijarvi_mine:0 "Elijärvi Madeni"
 FIN_elijarvi_mine_desc:0 "Elijärvi yakınlarındaki kazı çalışmalarıyla bağlantılı olarak bulunan ve krom açısından çok zengin olabilecek krom cevherinin varlığına işaret eden numuneler aldık. Bölgede yeni madencilik operasyonları başlatmalı ve askeri sanayi için güvenilir bir krom kaynağı sağlamalıyız."
 FIN_enhance_southern_infrastructure:0 "Güney Altyapısını Geliştir"
 FIN_enhance_southern_infrastructure_desc:0 "[ROOT.GetAdjective] ulusu dünyadaki yerini sağlamlaştırmaya çalışırken, endüstriyel kapasitesini inşa etmeye ve geliştirmeye odaklanmalıdır. Bu hedefe ulaşmanın ilk adımı, kısa vadede hafif ve ağır sanayinin taleplerini daha iyi karşılamaya hazır olmalarını sağlamak için güney bölgelerindeki altyapıyı iyileştirmektir."
 FIN_every_finnish_mio_tt:0 "\nTüm §YUlusal§! Askeri Endüstriyel Organizasyonlar:"
 FIN_expand_air_bases:0 "Hava Üslerini Genişlet"
 FIN_expand_air_bases_desc:0 "[ROOT.GetName] çevresinde gerilimler artarken, Savunma Kuvvetlerimizin yeterli şekilde faaliyet gösterme imkanına sahip olmasını sağlamalıyız. \nPilotlarının çatışma zamanlarında hızla konuşlanabilmesini sağlamak için ülke genelindeki hava üslerinin sayısını genişletme taahhüdünde Hava Kuvvetlerini destekleyeceğiz."
 FIN_expand_air_force_academy:0 "Hava Kuvvetleri Akademisini Genişlet"
 FIN_expand_air_force_academy_desc:0 "Hava Kuvvetlerini geliştirme ulusal çabasının bir parçası olarak, Hava Kuvvetleri Akademisi'nin önemli bir genişlemesine girişeceğiz. Genişletme sadece yeni tesisleri değil, aynı zamanda Kauhava ve Tikkakoski'de yeni hava alanlarının inşasıyla pilot eğitiminde bir yükseltmeyi de içerecektir."
 FIN_expand_imatra_hydropower_plant:0 "Imatra Hidroelektrik Santralini Genişletin"
 FIN_expand_imatra_hydropower_plant_desc:0 "1922 yılında kurulan Imatra Hidroelektrik Santrali, [ROOT.GetName]'nin büyüyen endüstrisi için güvenilir bir enerji kaynağı olduğunu kanıtladı. Beşinci ve Altıncı makinelerin genişletilmesiyle tesisin kapasitesi yalnızca artacak ve [928.GetName] bölgesinde daha fazla endüstriyel büyüme sağlanacak."
 FIN_expand_mining_prospection:0 "Maden Arama Faaliyetlerini Genişlet"
 FIN_expand_mining_prospection_desc:0 "Modern madencilik araçlarına yatırım ve maden altyapısının genişletilmesi, sağlam bir mineral çıkarma endüstrisinin temelini atar. Artan bir üretim, ulusal savunmanın ihtiyaçlarına hizmet edecek ve ülkenin çatışmaya hazırlığını pekiştirecektir."
 FIN_expand_mining_prospection_tt:0 "Halihazırda §Y£resources_strip|5 $state_resource_steel$§! sağlayan her çekirdek eyalete §Y2£resources_strip|5 §! üretimi ekler. \nMevcut etkiler:"
 FIN_expand_production_lines:0 "Üretim Hatlarını Genişlet"
 FIN_expand_production_lines_desc:0 "[ROOT.GetAdjective] Hava Kuvvetleri, savaş çabasının artan taleplerini karşılamak için üretim kapasitesini genişletmelidir. Yeni üretim hatları inşa ederek, yeni uçakların üretimini artırabilir ve Hava Kuvvetlerimizin düşmanlarımıza karşı savaşta güçlü bir varlık olarak kalmasını sağlayabiliriz."
 FIN_expand_ship_building_industry:0 "Gemi İnşa Sanayisini Genişlet"
 FIN_expand_ship_building_industry_desc:0 "Askerî gemilere olan ihtiyaç arttıkça, onları üretebilecek tersanelere olan ihtiyaç da artar. Genişletilmiş bir gemi inşa sanayisi ile [ROOT.GetName], silahlı kuvvetlerine güç yansıtmak ve kıyılarını korumak için ihtiyaç duydukları gemileri sağlamak için daha iyi donanımlı olacaktır."
 FIN_expand_state_military_factories:0 "Devlet Askerî Fabrikalarını Genişlet"
 FIN_expand_state_military_factories_desc:0 "Devlet tarafından işletilen fabrikalarımız, bu kriz zamanında ordu tarafından üzerlerine yüklenen talepleri karşılamakta zorlanıyor. İkmal hatlarını sürdürmek istiyorsak, üretim tesislerimizi genişletmemiz gerekiyor."
 FIN_expansion_towards_the_atlantic:0 "Atlantik'e Doğru Genişleme"
 FIN_expansion_towards_the_atlantic_desc:0 "[ROOT.GetAdjective] gemi yapımı Atlantik'e doğru yelken açacak, deniz yeteneklerini genişletecek ve okyanus boyunca güç yansıtmak için daha büyük gemiler inşa edecektir. Savaş gemileri ve uçak gemilerinin eklenmesiyle, [ROOT.GetName]'ın Donanması dünya sahnesinde hesaba katılması gereken bir güç haline gelecektir."
 FIN_expansion_towards_the_atlantic_no_state_tt:0 "Atlantik Okyanusu kıyısındaki bir Avrupa eyaletine §G2§! İnşaat Alanı, §Y2 Tersane§! ve §Y2 Deniz Üssü§! ekler."
 FIN_extra_refresher_exercises:0 "Ek Tazeleme Tatbikatları"
 FIN_extra_refresher_exercises_desc:0 "Avrupa'da gerilim artmaya devam ediyor ve eğer [ROOT.GetAdjective] bağımsızlığı korunacaksa, Finlandiya'nın savunmasını yoğun eğitim tatbikatları yoluyla güçlendirmemiz, olası herhangi bir çatışma patlak vermesine hazırlanmamız ve Finlerin ulusun egemenliğini gerekirse savunma konusundaki kararlılığını ve hazırlığını göstermemiz gerekiyor."
 FIN_faction_name:0 "[ROOT.GetFactionName]"
 FIN_finnish_autonomy:0 "Fin Özerkliği"
 FIN_finnish_autonomy_desc:0 "Aramızdaki en adanmış komünistlerden bazıları bile [SOU.GetNameDef] ile işbirliğinin fiili bir Rus egemenliğine yol açacağı endişesini taşıyordu. Ancak dikkatli bir diplomasi sayesinde, müttefiklerimizle özerkliğimizi güvence altına alan bir anlayış düzeyine ulaştık."
 FIN_finnish_federation_of_trade_unions:0 "Finlandiya Sendikalar Federasyonu"
 FIN_finnish_federation_of_trade_unions_desc:0 "Sendikalar, sanayinin gerçek efendilerini, yani işçileri temsil eder. Sendikalar federasyonu ile işbirliği yaparak, tüm ekonomiyi işçi sınıfının iyileştirilmesi için yeniden organize edebiliriz."
 FIN_finnish_influence_in_the_baltic:0 "Baltık'taki Fin Nüfuzu"
 FIN_finnish_influence_in_the_baltic_desc:0 "Baltık bölgesinin kolektif güvenliği, benzer düşünenlerin birbirleriyle işbirliği yapmasına ve hepsinin saldırgan güçlere karşı güvenilir bir savunma sürdürmesini sağlamasına bağlıdır. Bu nedenle, tüm komşularımızın aynı yönde ilerlediğinden emin olmalıyız."
 FIN_finnish_influence_in_the_baltic_tt:0 "Herhangi bir bağımsız §YBaltık ülkesini§! ve §Y[POL.GetName]'yı§! etkiler. \nEğer ülke [ROOT.GetFlag]§Y[ROOT.GetName]§! ile aynı ideolojiyi paylaşıyorsa: §Y'[ROOT.GetName] bizi [GetAppropriateFinnishFactionInviteTooltip]'a davet ediyor'§! olayını alır."
 FIN_finnish_irredentism:0 "Fin İrredantizmi"
 FIN_finnish_irredentism_desc:0 "Eski Rus İmparatorluğu'ndan bağımsızlığımızı kazanmamıza rağmen, haklı olarak bizim tarafımızdan yönetilmesi gereken ancak düşmanlarımızın baskı boyunduruğu altında sıkışıp kalmış topraklar ve insanlar hâlâ var. Halkımızı bu toprakların kurtuluşu için harekete geçirmeliyiz."
 FIN_finnish_irredentism_take_states_tt:0 "\nBarış Konferanslarında §Y[ROOT.GetAdjective] çekirdekleri ve hak iddiaları§! üzerindeki §YEyaletleri Al§! eylemi için §Yazaltılmış maliyet§!.\n\n"
 FIN_finnish_learned_societies:0 "Fin Bilim Toplulukları"
 FIN_finnish_learned_societies_desc:0 "Ulusun aydınlarının çoğu yurtdışına kaçmış olsa da, sosyalist düşünceyi benimseme bilgeliğine sahip önemli bir sayı hâlâ mevcut. Bu aydınları araştırmalarına yatırım yaparak yükseltmeliyiz."
 FIN_finnish_legion_of_honor:0 "Fin Şeref Lejyonu"
 FIN_finnish_legion_of_honor_desc:0 "Birliklerimiz, sınırımızdaki komünist sürüsünü geri tutan kalkandır. Onların cesaretini, en cesurlarının katılmayı arzulayabileceği seçkin bir Şeref Lejyonu yaratarak daha fazla onurlandırmalıyız."
 FIN_finnish_march_of_conquest:0 "Fin Fetih Yürüyüşü"
 FIN_finnish_march_of_conquest_desc:0 "Çok uzun zamandır [SOU.GetNameDef] ve seleflerine karşı savunmadaydık. Şimdi gidişatı tersine çevirme ve sınırları geri itme, Karelya halkını [SOU.GetAdjective] zulmünden ne pahasına olursa olsun kurtarma zamanı."
 FIN_finnish_neutrality:0 "Fin Tarafsızlığı"
 FIN_finnish_neutrality_desc:0 "Halkımızın özgürlükleri için savaşma gücü ve kararlılığı silinemez. Ancak, komşularımızın zor kazanılmış bağımsızlığımızı yok etmek için bir nedeni olmaması için bir tarafsızlık politikası izlemeliyiz."
 FIN_finnish_radio_intelligence:0 "Fin Radyo İstihbaratı"
 FIN_finnish_radio_intelligence_desc:0 "Savaş yoğunlaştıkça, Fin ordusu güvenilir istihbarat toplamanın önemini fark etti. Reino Hallama'nın liderliğinde, düşman iletişimini kesmek ve şifresini çözmek için yetenekli bir radyo operatörleri grubu toplandı. Bu operatörler, becerileri ve bilgileriyle Fin silahlı kuvvetlerine değerli bilgiler sağlayacak ve savaşın gidişatını değiştirmeye yardımcı olacaklar."
 FIN_finnish_supremacy_in_the_north:0 "Kuzey'de Fin Üstünlüğü"
 FIN_finnish_supremacy_in_the_north_desc:0 "Bölgemizin diğer ulusları daha büyük güçlerin ellerinde boyun eğmelerini çekişip müzakere ederken, bir alternatif sunabilecek tek biziz. Liderliğimiz altında, halklarımızı bizi tehdit edebilecek herhangi bir düşmana karşı zafere taşıyabiliriz."
 FIN_finnish_supremacy_in_the_north_influence_tt:0 "\n\nFaşist bir rejim altında olmayan herhangi bir bağımsız İskandinav veya Baltık ülkesini etkiler."
 FIN_finnish_supremacy_in_the_north_invite_to_faction_tt:0 "Herhangi bir bağımsız faşist İskandinav veya Baltık ülkesi '§Y[ROOT.GetNameDef] bizi $FIN_finnish_supremacy_league$'a davet ediyor'§! olayını alır."
 FIN_finnish_supremacy_in_the_north_unlock_decisions_country_specific_tt:0 "Ülkede §YHükûmete Baskı Yap§! ve §Yİdeolojik Mitingleri Teşvik Et§! kararlarının kilidini açar."
 FIN_finnish_supremacy_in_the_north_unlock_decisions_tt:0 "İskandinav ve Baltık ülkelerinde §YHükûmete Baskı Yap§! ve §Yİdeolojik Mitingleri Teşvik Et§! kararlarının kilidini açar."
 FIN_finno_estonian_union:0 "Fin-Estonya Birliği"
 FIN_finno_estonian_union_desc:0 "Estonya halkıyla uzun bir geçmişi paylaşıyoruz, bu nedenle onları büyük güçler arasında sıkışıp kalmış, evlerinin uluslararası bir mücadelede başka bir savaş alanı olmasını beklerken görmek bize acı veriyor. Belki bir birlik yoluyla onları böyle bir kaderden kurtarabiliriz."
 FIN_finno_soviet_pact:0 "Fin-Sovyet Paktı"
 FIN_finno_soviet_pact_desc:0 "Tarihsel şikayetler kahrolsun, [SOU.GetAdjective] halkı sosyalizm mücadelesinde değerli müttefikler olduklarını kanıtladı. Gerici Avrupa'nın kaçınılmaz saldırısına hazırlık olarak hükûmetlerimiz arasında bir anlaşmayı resmîleştirmenin zamanı geldi."
 FIN_finno_soviet_pact_flag:0 "[FIN.GetFlag]§Y[FIN.GetNameDef]§! ile §YFin-Sovyet Paktı§!'nı imzaladı!"
 FIN_foreign_aircraft:0 "Yabancı Uçak"
 FIN_foreign_aircraft_desc:0 "[ROOT.GetAdjective] Hava Kuvvetleri, ulusun egemenliğini korumak ve vatanımızın güvenliğini sağlamak için yeteneklerini genişletmelidir. Yeteneklerimizi ve kendi uçağımızın gelişimini iyileştirmek için yabancı uçak tasarımları ve uzmanlığı aranacaktır."
 FIN_foreign_aircraft_equipment_and_subsidies_tt:0 "\n§Ybize teçhizat satmaya istekli ülkelerden§! uçak teçhizatı satın al. \n§Ybize teçhizat satmaya istekli ülkeleri§! hedefleyerek, §Y$small_plane_airframe$§! için [?ROOT.FIN_basic_subsidies_value|Y2] £GFX_civ_factory_output ile §Y[ROOT.GetName]§!'a teçhizat sübvansiyonu ekle.\nSatıcı ülkeler:\n"
 FIN_foreign_aircraft_equipment_only_tt:0 "\n§Ybize teçhizat satmaya istekli ülkelerden§! uçak teçhizatı satın al. \nSatıcı ülkeler:\n"
 FIN_foreign_armor:0 "Yabancı Zırhlı"
 FIN_foreign_armor_desc:0 "[ROOT.GetAdjective] Ordusu savaş sırasında zırhlı yeteneklerini güçlendirmeye çalışırken, çözümler için kendi sınırlarımızın ötesine bakmalıyız. İsveç Landsverk L-62 II gibi yabancı zırhlıların satın alınması, [ROOT.GetAdjective] cephaneliğine hoş bir katkı sağlayabilir ve ülkenin zorluklar karşısındaki becerikliliğini ve uyum sağlama yeteneğini gösterebilir."
 FIN_foreign_armor_equipment_and_subsidies_tt:0 "\n§Ybize teçhizat satmaya istekli ülkelerden§! zırhlı teçhizatı satın al. \n§Ybize teçhizat satmaya istekli ülkeleri§! hedefleyerek, §Y$light_tank_chassis$§! için [?ROOT.FIN_basic_subsidies_value|Y2] £GFX_civ_factory_output ile §Y[ROOT.GetName]§!'a teçhizat sübvansiyonu ekle.\nSatıcı ülkeler:\n"
 FIN_foreign_armor_equipment_only_tt:0 "\n§Ybize teçhizat satmaya istekli ülkelerden§! zırhlı teçhizatı satın al. \nSatıcı ülkeler:\n"
 FIN_found_pohjolan_voima:0 "Pohjolan Voima'yı Kur"
 FIN_found_pohjolan_voima_desc:0 "Orman sanayisi ve ağır sanayideki son genişlemeyle birlikte daha fazla güç ihtiyacı ortaya çıkıyor. Enerji üretimini merkezileştirecek ve [ROOT.GetName]'ın endüstriyel büyümesini körüklemek için hidroelektriğin sınırsız potansiyelinden yararlanacağız."
 FIN_found_pohjolan_voima_factories_tt:0 "\nEn az 3 seviye $infrastructure$ olan §Y5 adede kadar tam kontrollü çekirdek eyalete§! §G2§! İnşaat Alanı ve §Y1 $industrial_complex$§! ekler."
 FIN_funds_from_kalevala_koru_oy:0 "Kalevala Koru Oy'dan Fonlar"
 FIN_funds_from_kalevala_koru_oy_desc:0 "Sosyal Demokrat Kadınlar Birliği üyeleri tarafından kurulan kaliteli bir mücevher üreticisi olan Kalevala Koru Oy, büyük bir başarıya imza attı. Uzmanlıklarını kullanarak ekonomimizi canlandırabilir ve elde edilen zenginliği diğer girişimleri finanse etmek için kullanabiliriz."
 FIN_german_military_advisors:0 "Alman Askerî Danışmanları"
 FIN_german_military_advisors_desc:0 "Motorlu teçhizat ve uçakların kullanılması nedeniyle savaş hızla değişiyor. Belki de bu yeni kaynakları kendi avantajımıza en iyi şekilde nasıl kullanacağımızı [GER.GetAdjective] silah arkadaşlarımızdan öğrenmenin zamanı gelmiştir."
 FIN_german_threat:0 "Alman Tehdidi"
 FIN_german_threat_desc:0 "Prusya militarizmi [GER.Capital.GetCapitalVictoryPointName]'da bir kez daha çirkin yüzünü gösterdi. Diğerleri Avrupa'nın başkentlerini [GER.GetLeader]'in postalları altında görmekten memnunken, biz değiliz. Barışa yönelik bu tehdidin kesin olarak ele alınmasının zamanı geldi."
 FIN_germans_rejected_to_protect_finland_flag:0 "[GER.GetNameDefCap] koruma talebimizi zaten reddetti."
 FIN_greater_finland:0 "Büyük Finlandiya"
 FIN_greater_finland_desc:0 "Artık toprağımıza göz diken acımasız komşular tarafından avlanmayacağız. Bunun yerine, avcı biz olacağız ve sınırlarımızı doğal sınırlarına, Karelya topraklarının ötesine genişleteceğiz."
 FIN_heimosodat_dec_tt:0 "Sovyet kontrolündeki §Y[215.GetName]§! ve §Y[216.GetName]§! eyaletlerinde §Y$FIN_stir_anti_soviet_sentiment_in_karelia$§! için ve [SOV.GetNameDef]'e karşı §Y$FIN_instigate_a_new_karelian_uprising$§! için §Y$FIN_the_last_kinship_war$§! kararlarının kilidini açar.\n\n"
 FIN_helsinki_air_defense:0 "Helsinki Hava Savunması"
 FIN_helsinki_air_defense_desc:0 "[ROOT.GetName] üzerinde savaş belirirken, Helsinki güçlendirilmelidir. Şehir ve kıyı şeridi saldırıya karşı savunmasızdır ve onları korumak [ROOT.GetAdjective] ordusuna düşer. Geliştirilmiş hava savunmaları ve kıyı tahkimatları sadece şehri korumakla kalmayacak, aynı zamanda ulusun herhangi bir saldırıya dayanma kararlılığını da güçlendirecektir."
 FIN_improves_nokia_designer_tt:0 "\n§Y$FIN_nokia$§! Endüstriyel Tasarımcısına etkiler:"
 FIN_in_a_defensive_war_against_a_major_tt:0 "[ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§!, bir §Ybüyük ülkeye§! karşı savunma savaşında!"
 FIN_increase_military_budget:0 "Askerî Bütçeyi Artır"
 FIN_increase_military_budget_desc:0 "Ulusun güvenliği son derece önemlidir. Askerî finansmanı artırarak, savunma kuvvetleri iyi donanımlı olacak ve olası tehditlere karşı daha iyi hazırlanacaktır."
 FIN_increase_military_investment:0 "Askerî Yatırımı Artır"
 FIN_increase_military_investment_building_tt:0 "[ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§! ve §YTüm İskandinav müttefikleri§!: \nTam kontrollü bir çekirdek eyalete §G2§! İnşaat Alanı ve §G2§! §YAskerî Fabrika§! ekle. \n\nMevcut etkiler:"
 FIN_increase_military_investment_desc:0 "Çatışmanın ekonomik ve lojistik bileşeni, cephedeki savaşlar kadar hayatta kalmamız için de hayati önem taşır. Bu nedenle, kuvvetlerimize ihtiyaç duydukları tüm teçhizatı sağlamaya devam edebilmeleri için silah sanayimize yatırım yapmalıyız."
 FIN_indoctrinate_the_workers:0 "İşçileri Telkin Et"
 FIN_indoctrinate_the_workers_desc:0 "Nüfus üzerindeki artan denetimimizle, etkili propaganda yöntemlerini neyin oluşturduğuna dair daha fazla içgörüye sahibiz. Bu bilgiyi, nüfusu telkin etmek, hükûmete ve [FIN.GetNameDef]'e mutlak sadakatlerini sağlamak için kullanmalıyız."
 FIN_industrial_cooperation:0 "Endüstriyel İşbirliği"
 FIN_industrial_cooperation_desc:0 "Mihver güçleri üyeleri, zengin bir bilgi ve kaynağa sahiptir. Bu kullanılmamış varlıkları ilgili uluslarımızın iyiliği için daha iyi kullanmak üzere endüstriyel olarak işbirliği yapma zamanımız geldi."
 FIN_industrial_development:0 "Endüstriyel Gelişim"
 FIN_industrial_development_desc:0 "Dünya giderek sanayileşirken, [ROOT.GetName] küresel sahnede önemli bir oyuncu olacaksa ayak uydurmalıdır. Ağır sanayimize yapacağımız yatırımlar sadece istihdam yaratıp ekonomiyi canlandırmakla kalmayacak, aynı zamanda geleceğin zorluklarını karşılamak için gerekli kaynakları da sağlayacaktır."
 FIN_industrial_upgrade_in_harjavalta:0 "Harjavalta'da Endüstriyel Yükseltme"
 FIN_industrial_upgrade_in_harjavalta_desc:0 "Harjavalta'da, nikel ve bakır sanayisini modernize etme ve düzene sokma çabaları sürüyor. En son teknoloji ve geliştirilmiş üretim yöntemleriyle, amaç üretimi en üst düzeye çıkarmak ve [ROOT.GetName]'ın bu hayati minerallerin önde gelen üreticisi olarak konumunu güçlendirmektir."
 FIN_industrialize_the_region:0 "Bölgeyi Sanayileştir"
 FIN_industrialize_the_region_building_tt:0 "[ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§! ve §YTüm İskandinav müttefikleri§!: \nTam kontrollü bir çekirdek eyalete §G2§! İnşaat Alanı ve §G2§! §YSivil Fabrika§! ekle. \n\nMevcut etkiler:"
 FIN_industrialize_the_region_desc:0 "Kuzey Savunma Cephesi'nin birleşik askerî gücü önemli olsa da, ekonomilerimizin uzun süreli bir savaşta onu destekleyebilmesini sağlamak için daha fazlasını yapmalıyız. Bunu yapmak için, sanayilerimizi canlandırmaya yatırım yapmamız gerekiyor."
 FIN_innovative_designs:0 "Yenilikçi Tasarımlar"
 FIN_innovative_designs_desc:0 "Mühendislerimiz, cesur bir yenilik hamlesiyle, zırhlı savaşın sınırlarını zorlayan bir süper ağır tank önerisi olan iddialı \"Hyökkäysvaunu\" projesini ortaya çıkarıyor. Alışılmışın dışında görünse de bu cesur çaba, [ROOT.GetNameDef]'nin çığır açan tasarımları keşfetme ve savaş alanında mümkün olanın sınırlarını zorlama konusundaki kararlılığını yansıtıyor."
 FIN_integrate_kola_and_karelia:0 "Kola ve Karelya'yı Entegre Et"
 FIN_integrate_kola_and_karelia_desc:0 "[SOU.GetAdjective] yoldaşlarımızla güçlü bir işbirliği ilişkisi kurmuş olsak da, sınır anlaşmazlıkları patlamaya hazır bir yağmur bulutu gibi üzerinde asılı duruyor. Belki de havayı temizlemeli ve nihayet bu sorunları düşman olarak değil, müttefik olarak ele almalıyız."
 FIN_integrate_kola_and_karelia_tt:0 "§Y[213.GetName]§!, §Y[215.GetName]§! ve §Y[216.GetName]§! eyaletleri üzerinde kontrol talep eder. \n[ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§!, [ROOT.GetAdjective] taleplerini reddeden herhangi bir ülkeye karşı §Y$take_state_focus$§! savaş hedefi kazanır."
 FIN_integrate_oy_tikkakoski:0 "Oy Tikkakoski'yi Entegre Et"
 FIN_integrate_oy_tikkakoski_desc:0 "[ROOT.GetAdjective] silah sanayisini güçlendirmek için Oy Tikkakoski, devlete ait askerî silah fabrikasına entegre edilecek. Bu hamle, silah üretimini artıracak ve [ROOT.GetAdjective] ordusu için yeni ateşli silahların geliştirilmesini hızlandıracaktır."
 FIN_intellectual_elite:0 "Entellektüel Elit"
 FIN_intellectual_elite_desc:0 "Ordunun ve aydınların daha aydın üyelerinin dikkatli işbirliği sayesinde, ulusu sosyalizm ve yozlaşmanın pençesinden kurtarmayı başardık. Akademik uğraşlarına yatırım yaparak bizi destekleyenleri ödüllendirmenin zamanı geldi."
 FIN_jaeger_movement:0 "Jaeger Hareketi"
 FIN_jaeger_movement_desc:0 "[ROOT.GetAdjective] Yüksek Komutanlığı, daha önce Jaeger eğitimi almış subayları terfi ettirerek savunma kuvvetlerini yeniden canlandırmak için bir öneri sundu. Bu subaylar, düşman hatları gerisinde gerilla savaşı ve sabotaj operasyonlarında uzmandır, bu da onları yeni birliklerin alışılmadık savaş taktiklerindeki becerilerini geliştirmek ve onları savaşa yönlendirmek için mükemmel adaylar yapar."
 FIN_janiskoski_power_plant:0 "Jäniskoski Enerji Santrali"
 FIN_janiskoski_power_plant_desc:0 "Kolosjoki nikel madeninin elektrikli izabe tesisine güvenilir enerji sağlamak ve [722.GetName] alanının büyümesini desteklemek için Jäniskoski'de bir enerji santrali inşa edeceğiz, bu da Kuzey [ROOT.GetName]'de ekonomik kalkınmayı teşvik edecek."
 FIN_join_axis:0 "[GetFascistFactionForFinland]'e Katıl"
 FIN_join_axis_desc:0 "Mihver güçlerinin kudretine karşı durabilecek çok az kişi olacak. Kenarda kalmak yerine, onların ittifakına katılmalı ve kendi dış politika hedeflerimizi takip etmek için onu kullanmalıyız."
 FIN_join_the_allies:0 "[GetAlliesFactionForFinland]'e Katıl"
 FIN_join_the_allies_desc:0 "Tarafsızlık, hızla büyük güçlerin elinde vasallaşmaya yol açan köhne bir politika haline geliyor. Jeopolitik konumumuz göz önüne alındığında bir risk olsa da, Müttefiklere katılmak uzun vadede egemenliğimizi korumamıza olanak tanıyabilir."
 FIN_join_the_comintern:0 "[GetSovietFactionForFinland]'e Katıl"
 FIN_join_the_comintern_desc:0 "Eski milliyetçilik kavramlarını ve bununla ilişkili şikayetleri reddetmeli ve [SOU.GetNameDef] ile birlikte çalışmalıyız. Birlikte, Avrupa'nın gerici güçlerine karşı gidişatı değiştirmeye yardımcı olabilir ve aynı zamanda kendi geleceğimizi güvence altına alabiliriz."
 FIN_join_the_comintern_leader_tt:0 "\nKomünist [ROOT.GetFlag]§Y[ROOT.GetNonIdeologyName]§! Stalin'in [SOV.GetFlag]§Y[SOV.GetName]§!'ı tarafından yönetilen bir ittifaka katıldığında §Y$FIN_otto_wille_kuusinen$§! ülke lideri olacak."
 FIN_joint_scientific_program:0 "Ortak Bilimsel Program"
 FIN_joint_scientific_program_desc:0 "Düşmanlara karşı teknolojik bir üstünlük geliştirmek, bir ulusun çatışmadan galip çıkıp çıkmayacağında belirleyici faktör olabilir. Bilimsel bilgimizi müttefiklerimizle birleştirerek, teknolojik avantajın bize ait olmasını sağlayabiliriz."
 FIN_joint_scientific_program_tt:0 "§YTüm [ROOT.GetAdjective] müttefikleri veya bağlı devletleri§! §Y$FIN_joint_research_and_development_program_name$§! teknoloji paylaşım grubuna katılacak."
 FIN_keepers_of_the_baltic_countries:0 "Baltık Ülkelerinin Koruyucuları"
 FIN_keepers_of_the_baltic_countries_desc:0 "Baltık halkının [GER.GetNameDef] veya [SOU.GetNameDef] tarafından yutulmaya pek niyeti yok. Ortak tarihimiz ve bakış açımızla bu ulusları barışçıl bir şekilde, onları yok etmeyecek bir biçimde yönetebilecek tek biziz."
 FIN_keepers_of_the_baltic_countries_tt:0 "[ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§!, [ROOT.GetAdjective] ittifakındaki her Baltık bağlı devletinin veya müttefikinin ilhakını talep eder. \n[ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§!, bir müttefik tarafından kontrol edilen her Baltık eyaletini talep eder. \n[ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§!, tarafsız veya düşman bir ülke tarafından kontrol edilen her Baltık eyaletinde hak iddia eder. \n§YHalihazırda [ROOT.GetFlag][ROOT.GetNameDefCap] tarafından kontrol edilen her Baltık eyaleti§!: §G+%30.0§! Uyum ekle."
 FIN_keepers_of_the_north:0 "Kuzey'in Koruyucuları"
 FIN_keepers_of_the_north_desc:0 "Kuzey'de bu bölgeyi dış düşmanlardan yönetecek ve savunacak irade gücüne sahip tek rejim biziz. Bölgenin tüm halkları bizim yönetimimiz altında birleşene kadar asla kalıcı barışa sahip olamayız."
 FIN_keepers_of_the_north_tt:0 "[ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§!, [ROOT.GetAdjective] ittifakındaki her İskandinav bağlı devletinin veya müttefikinin ilhakını talep eder. \n[ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§!, bir müttefik tarafından kontrol edilen her İskandinav eyaletini talep eder. \n[ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§!, tarafsız veya düşman bir ülke tarafından kontrol edilen her İskandinav eyaletinde hak iddia eder. \n§YHalihazırda [ROOT.GetFlag][ROOT.GetNameDefCap] tarafından kontrol edilen her İskandinav eyaleti§!: §G+%30.0§! Uyum ekle."
 FIN_long_range_patrols:0 "Uzun Menzilli Devriyeler"
 FIN_long_range_patrols_battalion_tt:0 "Destek taburu §Y$long_range_patrol_support$§! açar."
 FIN_long_range_patrols_desc:0 "Uzun Menzilli Devriyeler, modern savaşın zorluklarıyla karşı karşıya olan [ROOT.GetAdjective] ordusunun keşif ve sabotaj çabalarında önemli bir unsur haline gelecektir. Bu yüksek eğitimli birimler, düşman hatlarına sızma, istihbarat toplama ve yıkıcı sürpriz saldırılar düzenleme konusunda uzmanlaşmıştır, bu da onları savaş çabalarında çok önemli bir varlık haline getirir."
 FIN_maan_turva:0 "Maan Turva"
 FIN_maan_turva_desc:0 "Ancak nüfusun dikkatli bir şekilde izlenmesiyle hiçbir ihanet veya yıkıcılığın gerçekleşmediğinden emin olabiliriz. Karşılığında, rejimi koruyabilir ve ulusun içeriden yok edilmemesini sağlayabiliriz."
 FIN_makola_mine:0 "Makola Madeni"
 FIN_makola_mine_desc:0 "Makola ve Hitura'da zengin nikel ve bakır yatakları bulundu. Uzmanlarımız bu yatakların ulusumuzun ekonomik büyümesi ve hızla genişleyen askeri sanayisi için büyük potansiyel taşıdığını düşünüyor ve en kısa sürede değerli madenlerin istikrarlı bir kaynağını güvence altına almak için Makola madeninde inşaat çalışmalarına başlanmasını tavsiye ediyorlar."
 FIN_mannerheim_line:0 "Mannerheim Hattı"
 FIN_mannerheim_line_desc:0 "Savunmamızı güçlendirmek amacıyla dikkatimizi Mannerheim Hattı'na çevirmeliyiz. Karmaşık bir savunma tahkimatı ağı olan hat, ülkenin doğu sınırı boyunca uzanır ve düşman saldırılarına karşı güvence altına alınmalıdır. Bu amaçla ordu, hem tahkimatların kendisini hem de onları dolu ve faal tutan ikmal hatlarını iyileştirmek için çalışıyor."
 FIN_marine_jaeger_divisions:0 "Deniz Jaeger Tümenleri"
 FIN_marine_jaeger_divisions_desc:0 "1934'ün sonlarında kurulan Fin Deniz Jaegers, Rannikkojääkärit, Fin Donanması'nın seçkin deniz piyade kolu olarak oluşturuldu. Bu yüksek eğitimli ve uyarlanabilir askerler, kıyı savunmasından amfibi saldırılara kadar çeşitli görevleri yerine getirmek üzere donatılmıştır ve Baltık Kıyısı boyunca olası herhangi bir angajmanda kilit bir varlık olacaklardır."
 FIN_militarized_society:0 "Militarize Edilmiş Toplum"
 FIN_militarized_society_desc:0 "Ulusumuz karşı karşıya olduğumuz saldırıdan sağ çıkacaksa, siyaset kisvesini bırakmalı ve toplumun tamamen militarizasyonunu benimsemeliyiz. Ancak bu tür aşırı önlemlerle düşmanlarımızı yenebiliriz."
 FIN_military_aid:0 "Askerî Yardım"
 FIN_military_aid_desc:0 "Müttefiklerin çok çeşitli silah üreticileri var, silahlı kuvvetlerimizi hızla modernize etmek için onlardan faydalanmalıyız."
 FIN_military_aid_equipment_tt:0 "\nMüttefiklerden teçhizat alacağız."
 FIN_military_aid_subsidies_tt:0 "§YHer büyük müttefiki§! hedefleyerek, §Y$small_plane_airframe$§!, §Y$medium_plane_airframe$§!, §Y$light_tank_chassis$§!, §Y$medium_tank_chassis$§!, §Y$artillery_equipment$§!, §Y$anti_air_equipment$§! ve §Y$anti_tank_equipment$§! için [?ROOT.FIN_basic_subsidies_value|Y2] £GFX_civ_factory_output ile §Y[ROOT.GetName]§!'a bir teçhizat sübvansiyonu ekleniyor."
 FIN_military_promotions:0 "Askerî Terfiler"
 FIN_military_promotions_desc:0 "Askerî subaylarımız ulusa büyük bir onur ve özveriyle hizmet ettiler. Bizi tarihi düşmanlarımızın elinde boyun eğmekten kurtarmadaki payları için en iyilerini ödüllendirmenin zamanı geldi."
 FIN_military_research:0 "Askerî Araştırma"
 FIN_military_research_desc:0 "Savaş, yeni teknolojilerin ve onları kullanan taktiklerin ortaya çıkmasıyla sürekli olarak yeniden icat ediliyor. Silahlı kuvvetlerimizin devam eden gücünü ve hazırlığını sağlamak için, ittifakımızın üyeleri bilgi ve teknolojimizi bir araya getirmelidir."
 FIN_mineral_wealth:0 "Maden Zenginliği"
 FIN_mineral_wealth_desc:0 "[ROOT.GetNameDefCap], henüz kullanılmamış bol miktarda doğal kaynağa sahiptir. Güvenilir bir askeri güç sürdüreceksek, bu kaynakları kullanmalı ve ekonomik kendi kendine yeterliliğimizi geliştirmeliyiz."
 FIN_mineral_wealth_development:0 "Maden Zenginliği Geliştirme"
 FIN_mineral_wealth_development_desc:0 "Coğrafyamız ve komşularımız göz önüne alındığında, potansiyel müttefiklerden veya ekonomik ortaklardan kopma ihtimalimiz var. Bu nedenle, izole edilmiş olsak bile savaşa devam edebilmemizi sağlamak için ulusumuzun kullanılmamış kaynaklarından faydalanmalıyız."
 FIN_mineral_wealth_development_states_tt:0 "[ROOT.GetFlag]§Y[ROOT.GetName]§!'ın veya bir §Y[ROOT.GetAdjective] bağlı devletinin§! zaten bu kaynaklardan herhangi birini üreten her çekirdek eyaletine §G[?FIN_mineral_wealth_development_resource_amount]§! birim £resources_strip|5 §Y$state_resource_steel$§!, £resources_strip|6 §Y$state_resource_chromium$§!, £resources_strip|4 §Y$state_resource_tungsten$§! veya £resources_strip|2 §Y$state_resource_aluminium$§! ekle.\nMevcut etkiler:\n"
 FIN_mineral_wealth_tt:0 "Maden kaynakları (£resources_strip|5 §Y$state_resource_steel$§!, £resources_strip|6 §Y$state_resource_chromium$§!, £resources_strip|4 §Y$state_resource_tungsten$§! veya £resources_strip|2 §Y$state_resource_aluminium$§!) üreten §Y3 adede kadar tam kontrollü çekirdek eyalete§! §G1§! İnşaat Alanı ve §G1§! §Y$industrial_complex$§! ekle. \nEyalette halihazırda üretilen her maden kaynağından §Y6 birim ekler§!. \nMevcut Etkiler:"
 FIN_mining_the_sea_locked:0 "\nKararın kilidini açar: §Y$FIN_mining_the_sea$§!, §Y$STRATEGICREGION_9$§!'a mayın döşememize olanak tanır. \nEğer karar başka bir odak tarafından zaten açılmışsa: §Y$FIN_mining_the_sea$§! kararını tamamlama §GMaliyeti ve Süresi§! §Gyarıya indirilir§!."
 FIN_mining_the_sea_unlocked:0 "\n§Y$FIN_mining_the_sea$§! kararını tamamlama Maliyeti ve Süresi yarıya indirilir."
 FIN_moderate_politics:0 "Ilımlı Siyaset"
 FIN_moderate_politics_desc:0 "Büyük güçler arasında gerilimler kaynarken, hükûmetimizin herhangi bir ittifakın ideolojilerine karşı çok hoşgörülü olarak görülmediğinden emin olmalıyız. Bu nedenle, bir iç ılımlılık politikası izlemeliyiz."
 FIN_modernize_production_lines:0 "Üretim Hatlarını Modernleştir"
 FIN_modernize_production_lines_cas_designs_tt:0 "$FIN_modify_finnish_airforce_ns_intro$ \n$FIN_support_for_ground_forces_dynamic_modifier_tt$\n"
 FIN_modernize_production_lines_desc:0 "En gelişmiş askerî uçakları üretebilen dünya standartlarında bir havacılık endüstrisi yaratmak için, [ROOT.GetAdjective] hükûmeti hava teçhizatı imalatından sorumlu ulusal fabrikaları yükseltmeye yatırım yapacak ve [ROOT.GetName]'ın Hava Kuvvetlerinin en yeni ve en güvenilir uçak teknolojisine erişimini sağlayacaktır."
 FIN_modernize_production_lines_fighter_designs_tt:0 "$FIN_modify_finnish_airforce_ns_intro$ \n$FIN_dominate_the_skies_dynamic_modifier_tt$\n"
 FIN_modernize_production_lines_naval_airforce_tt:0 "$FIN_modify_finnish_airforce_ns_intro$ \n$FIN_naval_airforce_dynamic_modifier_tt$\n"
 FIN_modernize_production_lines_no_focus_tt:0 "Eğer §Y$FIN_support_for_ground_forces$§! odağı tamamlandıysa: \n$FIN_support_for_ground_forces_dynamic_modifier_tt$ \nEğer §Y$FIN_dominate_the_skies$§! odağı tamamlandıysa: \n$FIN_dominate_the_skies_dynamic_modifier_tt$\n"
 FIN_modernize_the_army:0 "Orduyu Modernleştir"
 FIN_modernize_the_army_desc:0 "Her hükûmetin önceliği halkının savunması ve güvenliğidir. Silahlı kuvvetlerimiz yetersiz kaldığında, bu nedenle onu birincil görevini bir kez daha yerine getirebilecek ölçüde modernize etmeye ve geliştirmeye yatırım yapmakla yükümlüyüz."
 FIN_modernize_the_army_leaders_tt:0 "§Ybeceri seviyesi 4§! veya daha yüksek olan §Y3 adede kadar Birim Lideri§!:"
 FIN_modernize_the_industry:0 "Sanayiyi Modernleştir"
 FIN_modernize_the_industry_desc:0 "Teknolojik emeklerimizin meyvelerinin savaş alanı uygulamalarının ötesinde kullanımları vardır. Birçoğu sanayimizi daha verimli hale getirmek için kullanılabilir. Biraz yatırımla, yeni edindiğimiz bilgilerle büyük bir endüstriyel modernizasyon programı başlatabiliriz."
 FIN_modify_fascist_regime_ns_intro:0 "§Y$FIN_fascist_regime$§! Ulusal Ruhunu şununla değiştir:"
 FIN_modify_finnish_airforce_ns_intro:0 "§Y$FIN_finnish_airforce$§! Ulusal Ruhunu şununla değiştir:"
 FIN_modify_finnish_army_ns_intro:0 "§Y$FIN_finnish_army$§! Ulusal Ruhunu şununla değiştir:"
 FIN_modify_finnish_navy_ns_intro:0 "§Y$FIN_finnish_navy$§! Ulusal Ruhunu şununla değiştir:"
 FIN_motti_tactics:0 "Motti Taktikleri"
 FIN_motti_tactics_desc:0 "Motti stratejisi, lojistik ve iletişim hatlarını felce uğratmak amacıyla düşman birimlerini kuşatmayı ve izole etmeyi içerir. Bu yaklaşımın uygulanması, savaş alanındaki etkinliğini sağlamak için savunma kuvvetlerinin dikkatli bir şekilde planlanmasını ve eğitilmesini gerektirir. Motti savaşını kullanarak ve mükemmelleştirerek, düşmanı alt edebilecek ve en az bekledikleri yerden saldırabileceğiz."
 FIN_mustapaidat:0 "Mustapaidat"
 FIN_mustapaidat_desc:0 "Toplumun devam eden militarizasyonu, halkımızın olabilecekleri en güçlü olmasını sağlayacaktır. Paramiliter güçleri birleştirerek, henüz orduya katılamayacak kadar genç olanlardan belki de bunun için çok yaşlı olanlara kadar toplumun tüm katmanlarında askerî değerleri teşvik edebiliriz."
 FIN_national_aircraft_production:0 "Ulusal Uçak Üretimi"
 FIN_national_aircraft_production_desc:0 "[ROOT.GetName] savaş tehdidiyle karşı karşıya kalırken, modern bir hava kuvvetinin ülkenin savunması için gerekli olduğu giderek daha açık hale geldi. Bu amaçla, [ROOT.GetAdjective] uçak tasarımcılarına ve üreticilerine gerekli kaynakları ve desteği sağlamak amacıyla ulusal bir uçak üretim programı başlatıldı ve [ROOT.GetName]'ın Avrupa'nın büyük güçleriyle rekabet edebilmesi sağlandı."
 FIN_national_armor_focus:0 "Ulusal Zırhlı Odaklanması"
 FIN_national_armor_focus_desc:0 "Savaş çabaları yoğunlaştıkça, [ROOT.GetName] dikkatini kendi askerî sanayisine çevirmelidir. Yerli tank üretim yeteneklerini geliştirmeye odaklanarak, zırhlı kuvvetlerimizi desteklemeyi ve savaş alanındaki benzersiz ihtiyaçlarına göre uyarlanmış araçlar yaratmayı hedefliyoruz."
 FIN_national_fanatism:0 "Ulusal Fanatizm"
 FIN_national_fanatism_desc:0 "Toplum, [FIN.GetAdjective] üstünlüğü davasına fanatizm ve adanmışlıkla tamamen aşılanmalıdır. Bizi kimsenin durduramayacağını ve birlikte çalıştığımızda ulusumuzun büyüklüğe yükselişini durdurabilecek hiçbir şey olmadığını defalarca kanıtladık."
 FIN_national_firepower:0 "Ulusal Ateş Gücü"
 FIN_national_firepower_desc:0 "Ulusumuzun karşı karşıya olduğu acil dış tehditler göz önüne alındığında, yeni askerî fabrikalara büyük bir yatırım yapmalıyız. Bu tesisler, kara kuvvetlerimiz ve kıyı bataryalarımız için en son topçu toplarını üretmeye adanacak ve [ROOT.GetNameDef]'nin sınırlarını savunmak için gerekli ateş gücüne sahip olmasını sağlayacaktır."
 FIN_national_unity:0 "Ulusal Birlik"
 FIN_national_unity_desc:0 "Savaş yaklaştıkça, büyük ulusumuzun halkını toplayacak ve dünyaya bir kez daha Fin olmanın ne demek olduğunu göstereceğiz."
 FIN_naval_airforce:0 "Deniz Hava Kuvveti"
 FIN_naval_airforce_desc:0 "[ROOT.GetName]'ın deniz kuvvetleri büyüdükçe, havacılık yetenekleri de büyümelidir. Özel bir deniz hava kuvvetinin kurulması, Fin donanmasının Baltık Denizi'ne hâkim olmak için ihtiyaç duyduğu desteğe sahip olmasını, hava gücünü ve yüzey filolarını koordine ederek her türlü tehdidi püskürtmesini sağlayacaktır."
 FIN_naval_airforce_ns_tt:0 " $FIN_naval_airforce_dynamic_modifier_tt$\n"
 FIN_no_faction:0 "onların ittifakına"
 FIN_northern_defense_front:0 "Kuzey Savunma Cephesi"
 FIN_northern_defense_front_countries_tt:0 "§Yİskandinav§! ve §YBaltık ülkeleri§! [ROOT.GetName]'dan gelen diplomatik talepleri kabul etmeye daha yatkın olacak."
 FIN_northern_defense_front_desc:0 "İskandinavya ve Baltık'taki komşularımız büyük güçler için kolay lokma. Ama kaynaklarımızı birleştirip askerî olarak işbirliği yapsaydık, en büyük düşmanları bile bize saldırmaktan caydırabilirdik."
 FIN_northern_defense_front_faction_tt:0 "§Y'[ROOT.GetName] bizi $FIN_northern_defense_front_faction$'a davet ediyor'§! olayını alır."
 FIN_northern_defense_front_influence_tt:0 "§Y'[ROOT.GetName] Siyasetimizi Etkiliyor'§! olayını alır."
 FIN_operation_kilpapurjehdus:0 "Kilpapurjehdus Operasyonu"
 FIN_operation_kilpapurjehdus_desc:0 "Milletler Cemiyeti kararıyla, Åland 1921'den beri askerden arındırılmıştır, bu da bölgede asker veya askerî malzeme bulunmadığı anlamına gelir. Ancak, Avrupa'da gerilimler artıyor ve adalara düşman çıkarma yapma tehdidiyle karşı karşıya olan yüksek komutamız, Åland'ı silahlandırmak ve güçlendirmek için bir plan hazırladı. \nHazırlıklar yapıldı ve birliklerimiz harekete geçmeye hazır!"
 FIN_organized_support_for_finland:0 "Finlandiya için Organize Destek"
 FIN_outokumpu_for_defence_industry:0 "Savunma Sanayii için Outokumpu"
 FIN_outokumpu_for_defence_industry_desc:0 "Ulusal metal sanayi şirketi Outokumpu Oy'a yatırım yapmak, [ROOT.GetName]'ın savunma hazırlığını artırmaya yardımcı olacaktır. \nPori'de yerli bir metal fabrikasının ve ham bakırı rafine etmek için bir bakır elektroliz tesisinin kurulması, [ROOT.GetName]'ın bakır ve pirinç üretimine kendi kendine yeterlilik getirecektir."
 FIN_oy_alkoholiliike:0 "Oy Alkoholiliike"
 FIN_oy_alkoholiliike_desc:0 "Umutsuz zamanlar umutsuz önlemler gerektirir ve şimdi Alkol Şirketi Oy Alkoholiliike'nin, silahları için temel bileşenler sağlayarak Fin ordusunu destekleme zamanı. \nDikkatli üretim ve arıtma yoluyla, son derece etkili yangın kokteyllerinin yaratılmasında uzmanlaşacaklar ve piyadeye düşman hafif zırhlılarını etkisiz hale getirmek için ihtiyaç duydukları avantajı sağlayacaklar."
 FIN_oy_alkoholiliike_ns_tt:0 "$FIN_modify_finnish_army_ns_intro$ \n$FIN_oy_alkoholiliike_dynamic_modifier_tt$\n"
 FIN_pact_for_continuation_war_fin_focus_tt:0 "\n[GER.GetFlag]§Y[GER.GetNameDef]§! [SOV.GetFlag]§Y[SOV.GetNameDef]§!'e savaş ilan ettiğinde etkiler:\n[ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§!, [SOV.GetFlag]§Y[SOV.GetNameDef]§!'e karşı savaşa katılacak."
 FIN_parmis_devils:0 "Pärmi'nin Şeytanları"
 FIN_parmis_devils_desc:0 "Nikke Pärmi'nin ceza taburu, aksi takdirde parmaklıklar ardında çürüyecek olan insan gücünün etkili bir kullanımı olduğunu kanıtladı. Ülkeleri için savaşmaya istekli mahkûmlardan oluşan bir tümen yaratarak onun çalışmalarını genişletmeliyiz."
 FIN_parmis_devils_spawn_tt:0 "§Y[ROOT.Capital.GetName]§!'da gazi §Y$FIN_nikke_parmi$§! komutasında §Y1 Ceza Tümeni§! oluşturulacak. \nSınırlı §YCeza Tümenleri§! alımının kilidini açar."
 FIN_patriotic_peoples_movement:0 "Vatansever Halk Hareketi"
 FIN_patriotic_peoples_movement_desc:0 "Vatansever Halk Hareketi, önceki rejimin geri püskürtmesine rağmen, kitleleri ulusal gurur ve ulusun komünizme karşı savunulması ihtiyacı konusunda eğitmede büyük işler başardı. Onları güvenimize alırsak, rejimimiz için çok daha büyük bir destek tabanı kazanırız."
 FIN_pilot_training:0 "Pilot Eğitimi"
 FIN_pilot_training_desc:0 "Modern savaşta hava gücüne olan talebin artmasıyla, pilotlarımız için daha gelişmiş ve uzmanlaşmış eğitim gereklidir. Yeni eğitim yöntemlerine ve ekipmanlarına yatırım yaparak, [ROOT.GetAdjective] Hava Kuvvetleri pilotlarının dünyanın en iyileri arasında olmasını sağlayabilir."
 FIN_political_unity:0 "Siyasi Birlik"
 FIN_political_unity_desc:0 "Siyasi ideoloji ne olursa olsun, hepimiz halkımız için en iyisini istiyoruz. Bu kriz zamanında, küçük siyasi çekişmeleri bir kenara bırakıp birlikte çalışmalıyız."
 FIN_power_from_the_dams:0 "Barajlardan Gelen Güç"
 FIN_power_from_the_dams_desc:0 "[ROOT.GetName]'nin bol nehirlerinin doğal kaynaklarından yararlanılarak hidroelektrik altyapımızın anlamlı bir şekilde genişletilmesi önerildi. Uzmanlarımıza göre, yeni hidroelektrik santrallerin inşasına yatırım yapmak, endüstriyel kapasitemizi önemli ölçüde genişletmenin ve ülkemizin büyümesini hızlandırmanın yollarını sağlayacak."
 FIN_pragmatic_socialism:0 "Pragmatik Sosyalizm"
 FIN_pragmatic_socialism_desc:0 "Bolşeviklerin ve benzerlerinin yöntemlerinden nefret etsek de, işçi sınıfını modern kapitalizmin dehşetinden kurtarmak için daha fazlasının yapılması gerektiğini inkâr etmiyoruz. Demokratik, pragmatik sosyalizmin dikkatli bir şekilde uygulanmasıyla bunu başaracağız."
 FIN_prepare_a_military_coup:0 "Askerî Darbeye Hazırlan"
 FIN_prepare_a_military_coup_desc:0 "[FIN.GetNameDef]'nin bir kriz anında zor kararları alabilen güçlü, kararlı bir liderliğe ihtiyacı var. Şu anda buna muktedir olan tek insanlar ordu. Ulusun demokratlar ve sosyalistler altında dağılmasını beklemek yerine, askerî bir darbe için zemin hazırlayacağız."
 FIN_preserve_sapmi:0 "Sápmi'yi Koru"
 FIN_preserve_sapmi_cores_tt:0 "\n[ROOT.GetFlag]§Y[ROOT.GetNameDef]§! tarafından kontrol edilen §Yher Sámi çekirdek eyaleti§!, [ROOT.GetFlag]§Y[ROOT.GetNameDef]§!'nin bir çekirdek eyaleti olur."
 FIN_preserve_sapmi_desc:0 "Sámi halkı, hem sınırlarımız içinde hem de ötesinde, uzun süredir emperyalist baskıdan muzdarip. Bu halkla aramızı düzeltmeli ve komşularımızın elinde devam eden acılarından onları kurtarmaya yardımcı olmalıyız."
 FIN_preserve_sapmi_event_tt:0 "Herhangi bir Sámi çekirdek eyaletini kontrol eden her tarafsız veya müttefik ülke '§Y$AAT_finland_diplomacy.05.t$§!' olayını alır."
 FIN_proclaim_greater_finland:0 "Büyük Fin Federasyonunu İlan Et"
 FIN_proclaim_greater_finland_compliance_tt:0 "\n[ROOT.GetFlag][ROOT.GetNameDef] tarafından kontrol edilen her gerekli eyalete §G%70.0§! Uyum ekler.\n\n"
 FIN_proclaim_greater_finland_desc:0 "Sınırlarımız sadece birkaç yıl önce hayal edebileceğimizin ötesine geçti. Bu kadar çok yeni toprakla, hükûmetimizi yönettiği çeşitli bölgeyi daha iyi yansıtacak şekilde yeniden organize etmek gerekli hale geldi."
 FIN_railways_and_infrastructure:0 "Demiryolları ve Altyapı"
 FIN_railways_and_infrastructure_desc:0 "Büyük Savaş, kaynakların veya insanların ihtiyaç duydukları yere ulaşmasında sanayiyi ve orduyu destekleyen sağlam demiryolu ve karayolu ağlarının gerekliliğini gösterdi. Onlarca yıllık işgal ve kan dökülmesinden sonra, lojistik ağlarımızın acilen yatırıma ihtiyacı var."
 FIN_rapid_raiders:0 "Hızlı Akıncılar"
 FIN_rapid_raiders_desc:0 "Dünya ilerledikçe, Donanmamız da ilerlemelidir. En son torpido teknolojisiyle donatılmış modern muhriplerin araştırılmasına ve üretimine yatırım yaparak, düşmanlarımıza hızlı ve ölümcül bir güçle saldırabileceğiz."
 FIN_reach_out_to_scandinavia:0 "İskandinavya'ya Ulaş"
 FIN_reach_out_to_scandinavia_desc:0 "İskandinav komşularımızın çoğu bizimle aynı duyguları paylaşıyor ve büyük güç çatışmalarına sürüklenmekle pek ilgilenmiyorlar. Onlarla güçlü ilişkiler sürdürerek, kolektif savunmamızın temellerini atabiliriz."
 FIN_reach_out_to_scandinavia_shared_focus_tree_tt:0 "[ROOT.GetFlag]§Y[ROOT.GetNameDefCap]§!, Ortak Odak §Y$NORDIC_reaching_out_to_our_neighbors$§!'ı tamamlar."
 FIN_red_finland:0 "Kızıl Finlandiya"
 FIN_red_finland_desc:0 "Beyaz Terör'e kurban giden yoldaşlarımızın intikamını gerçek bir işçi cumhuriyeti kurarak aldık. Şimdi geriye kalan tek şey, başardıklarımızı sınırlarımızın ötesinde onu yok etmek isteyenlerden korumaktır."
 FIN_red_finland_resistance_target_tt:0 "Kızıl Finlandiya: §G-%15§!"
 FIN_red_finland_resistance_tt:0 "\nAktif direniş gösteren her kontrollü eyalete §G-%15.0§! Direniş Hedefi ekler.\n\n"
 FIN_red_guard_divisions_tt:0 "\n- 6 §YMilis§! taburu ve 1 §YDestek Taburu§! bulunan Kızıl Muhafız birimleri, §Gkontrollü eyaletlerde ortaya çıkacak§!.\n"
 FIN_repurpose_small_industries:0 "Küçük Sanayileri Yeniden Amaçlandır"
 FIN_repurpose_small_industries_desc:0 "Büyük güçlerin devasa sanayilerine sahip olmasak da, faaliyette olan sayısız küçük fabrikamız var. Sıfırdan başlamak yerine, bu küçük tesisleri savaş üretimi için yeniden amaçlandırmalıyız."
 FIN_right_wing_policies:0 "Sağcı Politikalar"
 FIN_right_wing_policies_desc:0 "Sol, yabancı güçlerin ajanlarından başka bir şey değildir. Eğer [SOU.Capital.GetCapitalVictoryPointName] ile aralarını iyi tutacaksa, vatanlarını bir anda satarlardı. Ulusumuz refah içinde ve hayatta kalacaksa, sağ partilere ve örgütlere yönelmeliyiz."
 FIN_salvaged_and_retooled:0 "Kurtarılmış ve Yeniden Donatılmış"
 FIN_salvaged_and_retooled_desc:0 "Silahlı kuvvetlerimiz savaşta galip gelecekse, savaş zamanı kaynaklarını en üst düzeye çıkarmaya odaklanmalıyız. Ele geçirilen düşman teçhizatından yararlanmak, hasarlı malzemeyi kurtarmak ve gerektiğinde Fin Taktik Doktrini'ne uyacak şekilde yeniden amaçlandırmak, ordumuzun ikmal ihtiyaçlarını karşılamamıza ve askerî yeteneklerimizi büyük ölçüde güçlendirmemize olanak tanıyacaktır."
 FIN_salvaged_and_retooled_sisu_trait_repurposed_tt:0 "\n§Y$FIN_mechanized_equipment_3$§! (1944 Mekanize Teknolojisi) araştırıldığında:\n"
 FIN_sea_mines_strategy:0 "Deniz Mayınları Stratejisi"
 FIN_sea_mines_strategy_desc:0 "Stratejik konumlara mayın döşeyerek, [ROOT.GetAdjective] Donanması kıyıları etrafındaki suları düşman filoları için tehlikeli hale getirmeyi, [ROOT.GetAdjective] kıyılarına yaklaşmalarını zorlaştırmayı ve deniz ticaretimizin güvenliğini sağlamayı amaçlamaktadır."
 FIN_sea_mines_strategy_mining_the_sea_dec_tt:0 "[GetMiningTheSeasDecTooltipFromNavyBranch]"
 FIN_secure_the_baltic_sea:0 "Baltık Denizi'ni Güvence Altına Al"
 FIN_secure_the_baltic_sea_desc:0 "Genellikle kara sınırlarımıza ve onları en iyi nasıl savunacağımıza odaklansak da, sahil şeridimizin savunmasızlığını ihmal ederek çabalarımızın boşa gitmesine izin veremeyiz. Bu nedenle bu kanadı güvence altına almak için büyük bir kıyı savunma programına yatırım yapmalıyız."
 FIN_secure_the_baltic_sea_dockyards_tt:0 "\nBaltık Denizi'ndeki §Y2§! adede kadar tam kontrollü eyalete §G2§! §YTersane§! §Yekle§!. \nMevcut etkiler:"
 FIN_secure_the_baltic_sea_forts_tt:0 "\nEn az 2 seviye §Y$naval_base$§! olan Baltık Denizi'ndeki her tam kontrollü eyalete §Y$bunker$§! ve §Y$coastal_bunker$§!'a §G2 seviye§! §Yekle§!. \nMevcut etkiler:"
 FIN_seek_german_protection:0 "Alman Koruması Ara"
 FIN_seek_german_protection_desc:0 "Milletler Cemiyeti, uluslararası hukuku korumada tamamen başarısız oldu. Silahlı kuvvetlerin gücünün uluslararası ilişkilerde tek belirleyici faktör olduğunu kabul etmeliyiz. Ulusumuzun hayatta kalması için, bu nedenle [GER.GetNameDef] gibi daha güçlü komşularımızdan yardım aramalıyız."
 FIN_sissi:0 "Sissi"
 FIN_sissi_desc:0 "Çatışma devam ederken, hafif piyade Sissi birliklerimiz Fin Ordusu için paha biçilmez bir varlık haline geliyor, uzun menzilli devriyeler ve pusulardaki uzmanlıklarını düşman hedeflerine saldırmak için kullanıyorlar. Arazi hakkında üstün bilgiye ve hızlı ve sessiz hareket etme yeteneğine sahip olan bu birlikler, düşmanın başına bela ve Fin halkı için bir gurur kaynağı olduklarını kanıtlıyorlar."
 FIN_social_democracy:0 "Sosyal Demokrasi"
 FIN_social_democracy_desc:0 "Bolşevik tarzı bir devrim bir ulusun üzerine salındığında ortaya çıkan başarısızlıkları ve dehşeti gördük. İşçi sınıfına fayda sağlayan kalıcı bir toplum yaratacaksak, bu mümkün olan her yerde demokratik, barışçıl yollarla olmalıdır."
 FIN_social_democratic_womens_union:0 "Sosyal Demokrat Kadınlar Birliği"
 FIN_social_democratic_womens_union_desc:0 "Toplumdaki kadınların durumu ezelden beri ihmal edilmiştir. Sosyal Demokrat Kadınlar Birliği'ni hükûmetin kalbine daha derinden dahil ederek, nihayet onların endişelerini ele alabilir ve herkes için daha adil bir toplum yaratabiliriz."
 FIN_socialist_welfare:0 "Sosyalist Refah"
 FIN_socialist_welfare_compliance_tt:0 "§YAktif direniş gösteren her kontrollü eyalete§! §G+%15.0§! Uyum ekler."
 FIN_socialist_welfare_desc:0 "Ekonominin dikkatli yönetimi ve ulusumuzun savunulması sayesinde, artık çalışan halkı gerçek bir refah devletinin kurulmasıyla ödüllendirecek kaynaklara sahibiz. Halkımızın uzun ve mutlu hayatlar yaşamasını sağlayacağız."
 FIN_socialist_welfare_if_kuusinen_tt:0 "\nEğer §Y$FIN_otto_wille_kuusinen$§! bu odağı tamamlamadan önce Ülke Lideri olarak atanırsa etkiler:"
 FIN_socialist_welfare_if_laaltonen_tt:0 "\nEğer §Y$FIN_aimo_aaltonen$§! bu odağı tamamlamadan önce Ülke Lideri olarak atanırsa etkiler:"
 FIN_socialist_welfare_if_leino_tt:0 "\nEğer §Y$FIN_yrjo_leino$§! bu odağı tamamlamadan önce Ülke Lideri olarak atanırsa etkiler:"
 FIN_socialist_welfare_traits_more_info_tt:0 "\n§Y$FIN_the_second_finnish_civil_war$§! veya §Y$FIN_pragmatic_socialism$§! odağının tamamlanmasının ardından daha fazla ayrıntı."
 FIN_socialist_welfare_traits_upgrade_tt:0 "\nMevcut liderin Ülke Lideri Özelliğini geliştir."
 FIN_sosialistinen_eduskuntaryhma:0 "Sosialistinen Eduskuntaryhmä"
 FIN_sosialistinen_eduskuntaryhma_desc:0 "Sosyalist Parlamento Grubu, düşmanlaştırma yerine [SOU.GetNameDef] ile yakınlaşmayı savunuyor. Önerileri, [SOU.GetAdjective]ların müdahalesi olmaksızın kendi sosyalizm biçimimizi korumak için en iyi umudu sunabilir."
 FIN_sotilaalliset_kappalaiset:0 "Sotilaalliset Kappalaiset"
 FIN_sotilaalliset_kappalaiset_desc:0 "Bir papaza erişim, askerlerimizin güvendiği çok önemli bir hizmettir. Bu papazların çoğu da haklı olarak ulusumuzun geleceği hakkında endişeli. Onlarla işbirliği yapsaydık, sadece cephede göz ve kulak kazanmakla kalmaz, aynı zamanda doğru mesajların birliklere ulaşmasını da sağlardık."
 FIN_soviet_refused_finno_soviet_pact_flag:0 "[SOV.GetFlag]§Y[SOV.GetNameDefCap]§! Fin-Sovyet Paktı'nı imzalamayı reddetti"
 FIN_soviet_threat:0 "Sovyet Tehdidi"
 FIN_soviet_threat_desc:0 "[SOU.GetNameDefCap], dünya genelindeki işçi sınıfının hayatına bir tehdittir, çünkü onları bir fetih savaşına sürüklemekten hiç çekinmeyecektir. Çok fazla güç toplamadan önce, tehdidi şimdi sona erdirmeliyiz."
 FIN_state_is_in_the_atlantic_tt:0 "Herhangi bir tam kontrollü eyalet Atlantik kıyısındadır."
 FIN_strengthen_military_administration:0 "Askerî Yönetimi Güçlendir"
 FIN_strengthen_military_administration_desc:0 "Mannerheim, bu çalkantılı zamanlarda ulusumuzu kahramanca yönetti, siyasi dogmaları askerî bir hassasiyetle aştı. Ulusun hayatta kalmaya devam etmesi adına, ona ve orduya gerekli gördükleri şekilde yönetme yetkisini vermeliyiz."
 FIN_strengthen_military_administration_history_entry:0 "Askerî Liyakat Ödülü"
 FIN_strengthen_the_naval_bases:0 "Deniz Üslerini Güçlendir"
 FIN_strengthen_the_naval_bases_desc:0 "[ROOT.GetName] savaşa hazırlanırken, deniz üslerinin iyi donanımlı ve iyi korunmuş olması çok önemlidir. Deniz üslerimizin altyapısını ve savunmasını geliştirerek, filomuzun güvende kalmasını ve düşmanla çatışmaya hazır olmasını sağlayabiliriz."
 FIN_strengthen_the_naval_bases_ns_tt:0 "$FIN_modify_finnish_navy_ns_intro$ \n$MODIFIER_REPAIR_SPEED_FACTOR$: §G+10%§! \n"
 FIN_subsidized_national_industrialization:0 "Sübvanse Edilmiş Ulusal Sanayileşme"
 FIN_subsidized_national_industrialization_desc:0 "[SOU.GetNameDef], sanayileşme yoluyla ulusun üretici güçlerinin kitlesel seferberliğinde büyük adımlar attı. Belki de Finlandiya'da benzer bir programı hayata geçirmek için uzmanlarından yardım istemeliyiz."
 FIN_subsidized_national_industrialization_factories_required_tt:0 "$TRIGGER_NUM_OF_TOTAL_CONTROLLED_FACTORIES_MORE_THAN$§Y[?ROOT.FIN_subsidized_national_industrialization_factories_required]§! (Mevcut §[GetColorControlledFactoriesForNewIndustrializationProgram][?ROOT.num_of_controlled_factories]§!)"
 FIN_suomalainen_sosialismi:0 "Suomalainen Sosialismi"
 FIN_suomalainen_sosialismi_desc:0 "Kapitalizmin sefil perişanlığı, iç savaş sırasında Mannerheim ve müttefikleri tarafından salınan karşı devrimci yıkım nedeniyle toplumumuza nüfuz etmeye devam ediyor. Buna izin veremeyiz, işçi sınıfını özgürleştirmenin bir yolunu bulmalıyız."
 FIN_suomen_akatemia:0 "Suomen Akatemia"
 FIN_suomen_akatemia_desc:0 "Tanınmış matematikçi Leo Sario liderliğindeki birkaç [ROOT.GetAdjective] aydını, ulusun önde gelen akademik kurumu olacak, bilimsel yeniliği yönlendirecek ve [ROOT.GetName]'ı teknolojik gelişmenin ön saflarında konumlandırmaya yardımcı olacak Suomen Akatemia'nın kurulmasını zorluyor."
 FIN_suomen_ilmavoimat:0 "Suomen Ilmavoimat"
 FIN_suomen_ilmavoimat_desc:0 "Araştırma ve eğitime yapılan yatırımlar yoluyla [ROOT.GetAdjective] Hava Kuvvetleri'nin etkinliğini artırmaya odaklanmalıyız. \nHedef, modern savaşın zorluklarını karşılayabilen modern ve esnek bir hava kolu oluşturmak ve aynı zamanda muharebe operasyonları sırasında yer birliklerine hayati destek sağlamaktır."
 FIN_suomen_maavoimat:0 "Suomen Maavoimat"
 FIN_suomen_maavoimat_desc:0 "Finlandiya Savunma Kuvvetlerinin yeteneklerini, yeni askerî teçhizat araştırmasına yatırım yaparak ve olası tehditler karşısında hazırlığı sağlamak için eğitim tesislerini modernize ederek geliştirmeliyiz."
 FIN_suomen_merivoimat:0 "Suomen Merivoimat"
 FIN_suomen_merivoimat_desc:0 "[ROOT.GetName]'ın deniz kuvvetleri, vatanlarını olası herhangi bir tehdide karşı savunmaya hazır olmalıdır. Modern deniz teçhizatını araştırmaya ve geliştirilmiş bir eğitim programı geliştirmeye vurgu yaparak, [ROOT.GetAdjective] Donanması sulardaki çıkarlarımızı koruyabilen güçlü bir kuvvet haline gelecektir."
 FIN_support_for_ground_forces:0 "Kara Kuvvetlerine Destek"
 FIN_support_for_ground_forces_desc:0 "Savaş devam ederken, kara kuvvetlerinin daha fazla hava desteğine ihtiyacı olduğu açıkça ortaya çıktı. Bu amaçla, yerdeki birliklerimize hayati hava koruması sağlamak için yakın hava desteği uçaklarının geliştirilmesine ve üretimine yatırım yapacağız. Bu onlara pozisyonlarını korumak ve düşmana karşı geri püskürtmek için ihtiyaç duydukları desteği verecektir."
 FIN_support_for_ground_forces_ns_tt:0 " $FIN_support_for_ground_forces_dynamic_modifier_tt$\n"
 FIN_tactical_wargaming_department:0 "Taktiksel Savaş Oyunu Departmanı"
 FIN_tactical_wargaming_department_desc:0 "Modern savaşın talepleri her geçen gün artıyor. Eğer yüksek komutamız ayak uyduracaksa, onu taktiksel savaş oyunları aracılığıyla yeni yöntemler deneyebilecekleri yeni departmanlarla genişletmemiz gerekiyor."
 FIN_tactical_wargaming_department_every_army_leader_tt:0 "§YTüm Ordu Liderleri§! (kilidi açılanlar dahil): \n  Planlama Yeteneği Ekle: §G1§!"
 FIN_take_over_the_suojeluskunta:0 "Suojeluskunta'yı Devral"
 FIN_take_over_the_suojeluskunta_desc:0 "Suojeluskunta, bir kriz anında ulusun savunulmasına yardımcı olmak için çağrılabilecek yedeklerden oluşan bir yardımcı kuvvet olarak hareket etmiştir. Örgütü kontrolümüz altına alırsak, binlerce kişiyi davamıza telkin etmek için kullanabiliriz."
 FIN_the_cold_front:0 "Soğuk Cephe"
 FIN_the_cold_front_desc:0 "Fin cephesinin sert kış koşulları uygun hazırlık gerektirir. Savunma kuvvetlerinin kışın zorlukları karşısında direncini sağlamak için ikmal yolları güvence altına alınmalı ve kamuflaj taktikleri geliştirilmelidir."
 FIN_the_communist_side_in_cw_tt:0 "\n$FIN_communism$:"
 FIN_the_fascist_side_in_cw_tt:0 "\n$FIN_fascism$:"
 FIN_the_finnish_swedish_peoples_party:0 "Finlandiya İsveç Halk Partisi"
 FIN_the_finnish_swedish_peoples_party_desc:0 "İsveç kökenli insanlar Finlandiya'da önemli bir azınlık oluşturuyor, çıkarlarını en ateşli şekilde temsil eden partiyle işbirliği yapmak, politikalarımız için bize önemli destek kazandırabilir ve İsveç'in kendisinin lütfunu kazanabilir."
 FIN_the_finnish_throne:0 "Fin Tahtı"
 FIN_the_finnish_throne_desc:0 "Kokoomus uzun zamandır bir Fin monarşisini savunuyor. Son dönemdeki destek artışı ve iktidar dizginlerini sıkılaştırmalarıyla, artık mevcut sistemi feshedip yerine bir krallık kurma imkanına sahipler."
 FIN_the_lone_wolf:0 "Yalnız Kurt"
 FIN_the_lone_wolf_desc:0 "[ROOT.GetAdjective] halkının çıkarlarını [ROOT.GetAdjective] halkının kendisinden daha fazla düşünen kimse yoktur. Tarih, başkalarının yardımımıza gelmesine güvenmek yerine kendimize güvenmemiz gerektiğini göstermiştir."
 FIN_the_merchant_fleet:0 "Ticaret Filosu"
 FIN_the_merchant_fleet_desc:0 "Savaş çabasının bir parçası olarak, [ROOT.GetName]'ın ticaret filosu, hayati malzemelerin ihtiyaç duyulan yerlere taşınmasını sağlamak için ayak uydurabilmelidir. Yeni gemilerin üretimine yatırım yaparak, kendimizi sürdürme yeteneğimizi güçlendirebilir ve herhangi bir çatışmada konumumuzu güvence altına alabiliriz."
 FIN_the_merchant_fleet_ns_tt:0 " $FIN_the_merchant_fleet_dynamic_modifier_tt$\n"
 FIN_the_peoples_democratic_league:0 "Halkın Demokratik Ligi"
 FIN_the_peoples_democratic_league_desc:0 "Halkın Demokratik Ligi, [FIN.GetNameDef] içindeki çeşitli sol kanat grupları koordine etmenin ön saflarında yer aldı. Proletaryanın iradesinin yerine getirilmesini sağlayabilecek gerçek bir işçi ittifakının temellerini attılar."
 FIN_the_red_watch:0 "Kızıl Nöbet"
 FIN_the_red_watch_desc:0 "İç savaştan bu yana yarattığımız her şeyi kapitalist tiranlığı yeniden kurmak için baltalayacak olanlar var. Kızıl Muhafızların kurulmasıyla, bu tür hain faaliyetlerin cumhuriyetimize yayılmadan önce kökünü kazıyabiliriz."
 FIN_the_second_finnish_civil_war:0 "İkinci Fin İç Savaşı"
 FIN_the_second_finnish_civil_war_desc:0 "Büyüyen proletarya arasında sınıf bilincinin genişlemesi ve liderliğinin örgütsel becerileri sayesinde, burjuva efendilerimizi kesin olarak devirmek için nihayet kaynakları topladık."
 FIN_the_workers_state:0 "İşçi Devleti"
 FIN_the_workers_state_desc:0 "Proletarya diktatörlüğü sağlam bir şekilde kurulduğuna göre, artık ulusu proletaryanın çıkarlarını siyasetin en ön saflarına koyacak şekilde yeniden yaratmaya başlayabiliriz. Çocuklarımızı eğitme şeklimizden, fabrikalarımızı organize etme şeklimize kadar her şey tamamen elden geçirilecektir."
 FIN_tire_factory_at_nokia:0 "Nokia'daki Lastik Fabrikası"
 FIN_tire_factory_at_nokia_add_synthetic_refineries_tt:0 "§G2§! §Y$synthetic_refinery$§! ekle."
 FIN_tire_factory_at_nokia_desc:0 "Çatışma zamanlarında, [ROOT.GetName]'nin ordu için bir lastik kaynağına ihtiyacı vardır, bu nedenle silahlı kuvvetlerimizin hareketliliğini ve hazırlığını sağlamak için güvenilir bir tedarikin güvence altına alınması bir öncelik olmalıdır. \nSuomen Gummitehdas'ın Nokia'daki lastik fabrikasını genişletme ve potansiyel kıtlıkların üstesinden gelmek için sentetik kauçuk ve geri dönüştürülmüş malzemeler kullanmak üzere üretim hatlarını yükseltme planımız var."
 FIN_tire_factory_at_nokia_tech_tt:0 "\n§Y$synth_oil_experiments$§! teknolojisi araştırıldığında:"
 FIN_tornio_steel_factory:0 "Tornio Çelik Fabrikası"
 FIN_tornio_steel_factory_desc:0 "Kemi madeni yakınlarındaki Tornio'da bir çelik fabrikası kurmak, Finlandiya'nın metal endüstrisinde devrim yaratmayı vaat ediyor. Outokumpu'nun artık bol miktarda krom ve nikel kaynaklarına erişimiyle, yeni fabrika en kaliteli çeliği üretecek ve Finlandiya'nın endüstriyel yeteneklerindeki boşluğu dolduracaktır."
 FIN_towards_a_red_government:0 "Kızıl Bir Hükûmete Doğru"
 FIN_towards_a_red_government_desc:0 "1918'de işçi devrimi dalgaları ulusu sardığında, proletarya Mannerheim'ın gerici güçleri ve Alman müttefikleri tarafından ihanete uğradı. Şehit yoldaşlarımızın intikamını almanın ve her zaman olmamız gereken işçi cumhuriyetini nihayet kurmanın zamanı geldi."
 FIN_trade_agreements:0 "Ticaret Anlaşmaları"
 FIN_trade_agreements_desc:0 "İç politika kararlarımızı her zaman desteklemese de, askeri modernizasyonumuzu desteklemek için ticaret anlaşmaları yapmaya istekli birçok ülke var. Esas olarak, daha az sevimsiz komşularımızın güvenliğini baltalamak için."
 FIN_underground_resistance_cells:0 "Yeraltı Direniş Hücreleri"
 FIN_underground_resistance_cells_desc:0 "Düşman ilerledikçe, bazı Finler boyun eğmeyi reddediyor. Küçük, çevik direniş hücreleri silahlanıp pusular, baskınlar ve sabotajlar düzenliyor. Arazi bilgileri ve davaya olan bağlılıkları, ne kadar güçlü olursa olsun herhangi bir işgalci için onları zorlu bir tehdit haline getiriyor."
 FIN_union_of_finnish_brothers_in_arms:0 "Finlandiyalı Silah Arkadaşları Birliği"
 FIN_union_of_finnish_brothers_in_arms_desc:0 "Finlandiyalı Silah Arkadaşları Birliği, nasyonal sosyalist hareketin ön saflarında yer alıyor ve ulusumuz yurtdışından tehdit altına girdikçe giderek daha fazla destek kazanıyor. Onlarla işbirliği yapsaydık, ulusun savunulması için büyük bir destek kazanabilirdik."
 FIN_united_under_the_north_star:0 "Kutup Yıldızı Altında Birleşmiş"
 FIN_united_under_the_north_star_desc:0 "İskandinav dostlarımız ve yoldaşlarımız, bölgemizin çıkarlarını umursamayan emperyalist güçlerin insafına kalmış durumda. Ama birlikte, en güçlü imparatorlukları bile caydıracak bir ittifak kurarak halkımız için barışı sağlayabiliriz."
 FIN_unlock_foreign_politics_decisions_baltic_tt:0 "Baltık ülkelerinde ve [POL.GetName]'da §YHükûmete Baskı Yap§! ve §Yİdeolojik Mitingleri Teşvik Et§! kararlarının kilidini açar."
 FIN_unlock_foreign_politics_decisions_nordic_tt:0 "İskandinav ülkelerinde §YHükûmete Baskı Yap§! ve §Yİdeolojik Mitingleri Teşvik Et§! kararlarının kilidini açar."
 FIN_utilize_the_sami:0 "Sámileri Kullan"
 FIN_utilize_the_sami_desc:0 "Sert Arktik arazisinde uzman gezginler olan Sámi halkının eşsiz becerilerini tanımalıyız. Toprak bilgilerini kullanarak keşif yeteneklerimizi geliştirebilir ve onları ren geyiği çobanları olarak istihdam ederek uzak bölgelerdeki ikmal hatlarımızı iyileştirebiliriz. Sámiler savunma stratejimizde hayati bir rol oynayabilir ve onların uzmanlığının tam olarak kullanılmasını sağlamalıyız."
 FIN_vaisala_radiosonde_tests:0 "Väisälä'nın Radyosonda Testleri"
 FIN_vaisala_radiosonde_tests_desc:0 "Profesör Vilho Väisälä'nın rehberliğinde, radyosonda teknolojisindeki öncü çabalar, başarılı ticari üretimin yolunu açtı. 1931'deki ilk Fin radyosonda fırlatmasının başarısı üzerine inşa edilen sürekli araştırma ve geliştirme, önemli teknolojik ilerlemelere yol açtı."
 FIN_viron_kansa:0 "Viron Kansa"
 FIN_viron_kansa_desc:0 "Baltık Denizi ile ayrılmış olsak da, [ROOT.GetName] ve [EST.GetName] halkları birbirleriyle uzun bir ortak geçmişe sahiptir. Dahası, bağımsızlığımızı sürdürmek için mücadele ederken hemen hemen aynı zorluklarla karşılaşıyoruz. Belki de barışçıl bir birleşme yoluyla halkımızı savaştan kurtarabiliriz."
 FIN_viron_kansa_positive_outcome_tt:0 "[EST.GetFlag][EST.GetNameDefCap] ittifakımıza katılacak veya tarafımızdan ilhak edilecek."
 FIN_wartsila_engine_production:0 "Wärtsilä Motor Üretimi"
 FIN_wartsila_engine_production_desc:0 "Ordu için kendi motorlarımızı üretebilme becerisine ve kapasitesine sahip olmak ulusal güvenliğimizi artıracaktır. Müttefiklerimizle ve Wärtsilä gibi yerli şirketlerle çalışarak bu güvenlik seviyesine ulaşabiliriz."
 FIN_weapon_caches:0 "Silah ZULALARI"
 FIN_weapon_caches_desc:0 "Silahlı kuvvetlerimizin ezilmesi ve hükûmetin düşmesi durumunda, ulusu geri alabilmek için bir acil durum planımız olmalı. Bunun için bir öneri, gelecekteki direniş güçlerinin kullanması için gizlice silah zulaları yerleştirmektir."
 FIN_winter_warfare:0 "Kış Savaşı"
 FIN_winter_warfare_battalion_tt:0 "Destek taburu §Y$winter_logistics_support$§! açar."
 FIN_winter_warfare_desc:0 "En kötüsüne hazırlan, en iyi gibi savaş. Sert kış koşulları için ikmal yollarını güçlendirmemiz ve birliklerimizi soğuğa dayanmaları ve cephelerde savaşmaya devam etmeleri için eğitmemiz gerekiyor."
 ICE_a_naval_hub_in_the_atlantic:0 "Atlantik'te bir Denizcilik Merkezi"
 ICE_a_naval_hub_in_the_atlantic_desc:0 "İzlanda bir adadır. Filoyu silahlı kuvvetlerin ana kolu olarak görmek son derece mantıklıdır. Düşmanların kıyılarımıza ulaşmasını durdurabilir, müttefiklerimizi denizlere hükmetmede destekleyebilir ve seferi kuvvetleri ihtiyaç duydukları her yere taşıyabilir. Güçlü bir donanma inşa etmek İzlanda için bariz bir seçimdir."
 ICE_a_profesional_army:0 "Orduyu Profesyonelleştir"
 ICE_a_profesional_army_desc:0 "Ordu şu anda adamızı düzgün bir şekilde savunmak için çok zayıf ve bu sorunu çözmenin tek yolu, ordumuzun sadece acı sona kadar savaşacak en iyi adamlardan oluştuğundan emin olmaktır."
 ICE_advanced_technology:0 "İleri Teknoloji"
 ICE_advanced_technology_desc:0 "Ada küçük. Asla büyük sanayileşmiş uluslarla eşit şartlarda rekabet edemeyecek. Kendi nişimizi bulmalı ve orada refaha ermeliyiz. Nispeten yeni bir şey, rekabette geriden başlamadığımız bir yer. İleri teknoloji ve elektronik, refaha erebileceğimiz ve gelişebileceğimiz yerlerdir."
 ICE_agricultural_expansion:0 "Tarımsal Genişleme"
 ICE_agricultural_expansion_desc:0 "İzlanda tarımını modernize etmek için birçok iyileştirme yapılabilir. Modern teknolojiden ve doğal kaplıcalardan kolayca erişilebilen ısıtmadan yararlanarak, tarımsal üretim artırılabilir ve arazi ve işçiler başka kullanımlar için serbest bırakılabilir."
 ICE_allied_weapons_seller_trigger:0 "§YMüttefik§! veya §YTarafsız§! Ülkeler"
 ICE_american_investments:0 "Amerikan Yatırımları"
 ICE_american_investments_desc:0 "Adada binlerce Amerikalının konuşlanması kendi başına ekonomi için iyidir. Ama aynı zamanda Amerikan şirketlerinin yan kuruluşlar kurmaya ve İzlanda şirketlerine yatırım yapmaya daha fazla ilgi duyması anlamına da gelir. Sonuç olarak, kartlarımızı doğru oynarsak bu durum bizim için çok faydalı olabilir."
 ICE_american_protection:0 "Amerikan Koruması"
 ICE_american_protection_desc:0 "[GetAmericanProtectionText]"
 ICE_american_protection_desc_british_subject:0 "[ENG.GetNameDefCap] bu savaşta zor durumda. Düşman kuvvetleri işgal etmeye karar verirse bizi koruyamayabilirler. [USA.GetAdjective] hükûmetine yaklaşmalı ve İzlanda'yı koruma görevini devralmalarını teklif etmeliyiz."
 ICE_american_protection_desc_standard:0 "Savaş yaklaşıyor ve biz yalnız kalamayacak kadar küçüğüz. [USA.GetNameDefCap] bizi koruyabilir. [USA.GetAdjective] hükûmetine ulaşmalı ve İzlanda'nın korunması için burada asker bulundurmalarını teklif etmeliyiz. Bu, bağımsızlık yolumuzdan bir geri adım olacak, ancak sadece geçici bir aksaklık olacak. İşgal edilmek daha kötü olurdu."
 ICE_american_protection_tt:0 "§Y[ROOT.GetName]§!, §Y[USA.GetNameDef]§!'nin bir kuklası olur!"
 ICE_american_soldiers:0 "Amerikan Askerlerini Ağırlamak"
 ICE_american_soldiers_desc:0 "Amerika Birleşik Devletleri, en çok değer verdikleri değerleri korumak için nüfuzlarını uzak ve geniş bir alana yaymaya heveslidir. Askerlerinin toprağımızda serbestçe konuşlanmasına izin verebiliriz ve bazıları da burada kalıp kendi kuvvetlerimizi destekleyebilir."
 ICE_an_airbase_in_the_sea:0 "Denizde bir Hava Üssü"
 ICE_an_airbase_in_the_sea_desc:0 "Adanın üzerindeki ve çevresindeki denizin üzerindeki gökyüzüne hükmederek, hiçbir düşmanın buraya güçlü bir şekilde inememesini sağlayabiliriz. Ve inseler bile, bir hava kuvveti düşmanın her zaman gerekli malzemelerden yoksun olmasını sağlayabilir. Bu nedenle, İzlanda silahlı kuvvetlerini inşa etmenin doğal yolu, modern bir hava kuvveti inşa etmektir."
 ICE_anglo_icelandic_relations:0 "İngiliz-İzlanda İlişkileri"
 ICE_anglo_icelandic_relations_desc:0 "[ENG.GetNameDefCap] büyük olasılıkla gelecekteki en iyi ticaret ortağımızdır. Her durumda, [ENG.GetAdjective]'i düşman edinmek ülkemiz için ciddi şekilde zararlı ve muhtemelen düpedüz tehlikeli olacaktır. Bu nedenle, deniz aşırı komşumuzla iyi ilişkiler sürdürmek için elimizden gelenin en iyisini yapmalıyız."
 ICE_anglo_icelandic_relations_tt:0 "Eğer §YBalıkçılık Sanayisini Genişlet§! odağını tamamladıysanız:"
 ICE_anti_capitalist_propaganda:0 "Anti-Kapitalist Propaganda"
 ICE_anti_capitalist_propaganda_desc:0 "Kapitalizmin bize ne faydası oldu ki? Evet, ulusa küçük bir refah getirmiş olabilir ama aynı zamanda bizi ülkenin şu an içinde bulunduğu krize de sürükledi. Liberal demokrasiye olan aşırı güven ve hakim devletimizin bize yalnızca kırıntıları vermeye razı olması karşısında, geleceğin başka bir yerde olması gerektiği açıkça görülmelidir."
 ICE_banking_on_the_future:0 "Geleceğe Yatırım Yapmak"
 ICE_banking_on_the_future_desc:0 "Bankacılık sektörü, büyük kaynaklar gerektirmeyen bir sektördür. Tek yapmamız gereken yabancı sermayeyi çekmek. Bankacılık sektörümüzü sübvanse ederek ve İzlanda bankalarını yatırımcılar için çekici hale getirmek için elimizden gelen her şeyi yaparak, bu adayı gelecek yıllarda fayda sağlayacak bir finans merkezi olarak kurabiliriz."
 ICE_break_with_the_crown:0 "Taç ile Kopuş"
 ICE_break_with_the_crown_desc:0 "Danimarka tacıyla resmi bir kopuş yapma zamanı geldi. Kralı ve Danimarka'daki yozlaşmış kabinesini kınamalı ve İzlanda'yı bir kez daha bağımsız bir ulus olarak, kendi hayallerine ve özlemlerine doğru kendi yolunu izlemekte özgür ilan etmeliyiz."
 ICE_break_with_the_crown_revolution_tt:0 "§Y$ICE_prepare_for_the_revolution$§! odağı tamamlandığında:"
 ICE_break_with_the_crown_tt:0 "[ROOT.GetNameDefCap] bağımsız olur."
 ICE_break_with_the_crown_workers_tt:0 "§Y$ICE_rally_the_workers_of_reykjavik$§! odağı tamamlandığında:"
 ICE_civilian_war_duty:0 "Sivil Savunma"
 ICE_civilian_war_duty_desc:0 "Vatandaşlarımızın savaş veya kriz evlerimize gelirse tam olarak nasıl hareket edeceklerini bilmeleri ve her sivilin zamanı geldiğinde lojistik, itfaiye ve dağıtım gibi görevlerini yapmaya hazır olması önemlidir."
 ICE_compensation:0 "Tazminat"
 ICE_compensation_desc:0 "Danimarka'ya ve dünyaya, hesaba katılması gereken bir ulus olduğumuzu kanıtladık. Son zamanlarda ve yüzyıllar boyunca fedakarlıklar yaptık. Atlantik'te oturan İzlanda, Danimarka tacının adalarını korumak için iyi bir konumdadır. Bunların korunmasını bize devrederek, Danimarka daha güçlü bir ortak kazanacak ve çekirdek topraklarını korumaya daha iyi odaklanabilecektir."
 ICE_completion_break_with_the_crown_tt:0 "§Y$ICE_break_with_the_crown$§! odağını tamamlarken:"
 ICE_death_from_above:0 "Yukarıdan Gelen Ölüm"
 ICE_death_from_above_desc:0 "Eğer savaşı havada kazanırsak, savaşı kazanırız ve hızlı kazanırız. Hatta daha hızlı, eğer hava ve ordu kollarımız arasındaki işbirliğini artırırsak ve mümkün olan her yerde düşman ikmal hatlarını kesmeye hazır özel paraşüt alayları eğitirsek."
 ICE_declare_absolute_neutrality:0 "Mutlak Tarafsızlık İlan Et"
 ICE_declare_absolute_neutrality_desc:0 "Danimarka'ya ne olursa olsun, İzlanda bir Avrupa savaşının dışında kalmak için elinden gelen her şeyi yapmalıdır. Mutlak tarafsızlık ilan ederek, adamızın herhangi bir şeye sürüklenmesine izin vermeyeceğimizi herkese açıkça belirtiyoruz."
 ICE_declare_absolute_neutrality_tt:0 "Eğer §Y[ROOT.OVERLORD.GetNameDef]§!'e savaş ilan edilirse §Y[ROOT.GetNameDef]§! bağımsız olacak"
 ICE_develop_icelandic_shipping:0 "İzlanda Gemiciliğini Geliştir"
 ICE_develop_icelandic_shipping_desc:0 "Biz bir adayız, okyanusun ortasında bir ada. Gemi yapımına odaklanmak, olabilecek en bariz seçimdir."
 ICE_doctrinal_studies:0 "Doktrin Çalışmaları"
 ICE_doctrinal_studies_desc:0 "Savaş sanatı kolay bir sanat değildir, hele ki her ulusun ustalaşabileceği bir sanat hiç değildir. Küresel güçleri incelemeli ve savaşlarını nasıl yürüttüklerinden öğrenmeliyiz."
 ICE_embrace_the_workers_revolution:0 "İşçi Devrimini Kucakla"
 ICE_embrace_the_workers_revolution_desc:0 "İşçilerden gelen destek bu değişimi mümkün kıldı. Bu nedenle, sendikaların, işçilerin ve birliklerin yeni devlette lider bir konuma gelmesi sadece doğaldır. İşçi devriminin liderleri, ülkeyi yeni zirvelere taşıyabilir ve bize herhangi bir hükümdarın getirebileceğinden çok daha büyük bir ilerleme getirebilir."
 ICE_emergency_conversions:0 "Acil Durum Dönüşümleri"
 ICE_emergency_conversions_desc:0 "Ulusun ağır gemiler için mutlaka kapasitesi olmasa da, bol miktarda daha büyük balıkçı gemimiz, ticaret gemimiz ve özel teşebbüs gemimiz var. Acil bir durumda, bunlara makineli tüfekler veya daha hafif toplar yerleştirebilir ve çoğu rakiple rekabet edebilecek kadar büyük bir deniz kuvvetini hızlı ve verimli bir şekilde oluşturabiliriz."
 ICE_emergency_conversions_tt:0 "§YKonvoyları§! §YDestroyerlere§! veya §YKruvazörlere§! dönüştürmek için §Ykararların§! kilidini açar!"
 ICE_enact_conscription:0 "Herþjónustu"
 ICE_enact_conscription_desc:0 "Ulusumuz için gelecek giderek daha belirsiz hale geldikçe, savunma yüksek bir öncelik haline geliyor. Silahlı kuvvetlerimizin neredeyse hiç var olmaması gerçeğini düzeltmek için, tüm genç yetişkinlerimiz için zorunlu askerliği yürürlüğe koymalıyız."
 ICE_engineering_projects:0 "Mühendislik Projeleri"
 ICE_engineering_projects_desc:0 "Eğer bir gün güçlü olacaksa, adanın geliştirilmesi gerekiyor. Büyük mühendislik projeleri iş olanakları yaratacak ve İzlanda endüstriyel büyümesinin temelini oluşturacaktır."
 ICE_expand_industrial_complexes:0 "Sanayi Komplekslerini Genişlet"
 ICE_expand_industrial_complexes_desc:0 "Askeri sanayilerimiz, az gelişmiş ve yetersiz kullanıldıkları için Avrupa'daki diğer güçlerin çok gerisinde kalıyor ve askeri sanayi kuruluşlarımızı genişletmek ve sübvanse etmek için büyük yatırımlar yapmazsak, sanayilerimiz asla yetişemeyebilir."
 ICE_expand_the_civilian_fleet:0 "Sivil filoyu genişlet"
 ICE_expand_the_civilian_fleet_desc:0 "Güçlü bir sivil filo, hem denizcilik geleneklerini sürdürmenin hem de ekonomimize bir nimet sağlamanın çifte bonusuna sahiptir. Ticaret gemileri barış zamanında ekonomiyi taşıyacak ve savaş zamanında donanmamızın ihtiyaç duyduğu deneyimli denizcileri üretecektir."
 ICE_expand_the_fishing_industry:0 "Balıkçılık Sanayisini Genişlet"
 ICE_expand_the_fishing_industry_desc:0 "Balıkçılık her zaman İzlanda yaşamının önemli bir parçası olmuştur. Sahip olduğumuz ana doğal kaynaktır ve bol miktarda bulunur. Bu nedenle çabalarımızı buraya odaklamalıyız. Gerçek potansiyelin olduğu alanda güçlenin."
 ICE_expand_the_harbour:0 "Limanı Genişlet"
 ICE_expand_the_harbour_desc:0 "Adaya giden ve adadan gelen daha fazla ve daha büyük gemi, daha büyük bir limana ihtiyacımız olduğu anlamına gelir. Devlet, ekonomiyi genişletmeye devam edebilmemiz için Reykjavik limanının genişletilmesini finanse etmelidir."
 ICE_expand_the_industrial_base:0 "Sanayi Tabanını Genişlet"
 ICE_expand_the_industrial_base_desc:0 "Hakim devletin sanayi ürünlerine olan bağımlılığımızı ortadan kaldırmak, sanayimizi ve dolayısıyla işçi sınıfımızı güçlendirir. Bir devrim doğru araçlar olmadan yapılamaz. Hakim devlete olan bu bağımlılığı sonlandırarak ülkemiz, devrimi ileriye taşıyacak yerli üretim silahların yanı sıra yeni ve parlak beyinler de dahil olmak üzere ihtiyaç duyduğu her şeye kavuşabilir."
 ICE_expanding_the_university_of_reykjavik:0 "Reykjavik Üniversitesini Genişletmek"
 ICE_expanding_the_university_of_reykjavik_desc:0 "Bilgi anahtardır. Eğer ülke bir gün dünyanın ilerisinde olacaksa, çabalarımızı odaklamalıyız. Reykjavik Üniversitesi'nin finansmanını artırarak gelecekteki büyüme için bir platform yaratırız."
 ICE_fighting_as_equals:0 "Eşitler Olarak Savaşmak"
 ICE_fighting_as_equals_desc:0 "Birlikte bir savaş veriyoruz. İzlanda üzerine düşenden fazlasını yapıyor. Danimarka'nın İzlanda'nın artık bir tâbi değil, bu ittifakta eşit bir ortak olduğunu kabul etme zamanı geldi. İzlanda'yı resmen bağımsız bir ulus ilan etme zamanı geldi."
 ICE_fighting_as_equals_tt:0 "§Y[ROOT.getName]§! bağımsızlığını ilan eder"
 ICE_flying_boats:0 "Uçan Tekneler"
 ICE_flying_boats_desc:0 "Eğer suda düşmanlarımızla rekabet edemezsek, o zaman bir sonraki en iyi şeye, gökyüzüne başvuracağız. Çünkü eğer gökyüzünü kontrol edersek, düşmanlarımızın gemilerinin bir anlamı kalmaz, çünkü bir anda batırılırlar."
 ICE_gardhur_airfield:0 "Garður Havaalanı"
 ICE_gardhur_airfield_desc:0 "Uçaklar modern altyapının gerçek bir parçası haline geliyor. İzlanda geride kalmamalı. Başkente yakın bir havaalanı, İzlanda'yı geleceğe fırlatmanın anahtarı olacaktır."
 ICE_general_strike:0 "Genel Grev"
 ICE_general_strike_desc:0 "Genel olarak dünyaya ve özellikle aşağılık Danimarka kralımıza, İzlanda işçilerinin güçlü ve birleşik durduğunu gösterelim. Tüm endüstriyel işleri ve adadan gelen ve adaya giden tüm nakliyeyi durduracak büyük bir grev, kukla hükûmete gerçekten zarar vermeli ve insanlara gücün nerede olduğunu göstermelidir."
 ICE_general_strike_tt:0 "\n§YGenel Grev§! bittiğinde:"
 ICE_heavy_industry:0 "Ağır Sanayi"
 ICE_heavy_industry_desc:0 "Tarım, balıkçılık ve gemicilik geçmişte kaldı. Ulusu geleceğe taşımak için ağır sanayiye odaklanmalıyız. Sanayiyi genişleterek, İzlanda'nın parlak, ancak dumanlı bir geleceği olacak."
 ICE_hrafninn_flygur:0 "Hrafninn Flýgur"
 ICE_hrafninn_flygur_desc:0 "Kuzgunlar gibi, göklere hükmedeceğiz. İzlanda, tüm dünyada uçak endüstrisi ve önde gelen uçak teknolojisi ile ilişkilendirilecektir."
 ICE_hydroelectric_power:0 "Hidroelektrik Güç"
 ICE_hydroelectric_power_desc:0 "Eğer bu ülkenin sahip olduğu başka bir kaynak varsa, o da sudur; nehirler ve kaplıcalar. Bunların kullanımını genişletmek, ulusun endüstriyel gelişimini güçlendirebilir."
 ICE_iceland_air:0 "İzlanda Hava Yolları"
 ICE_iceland_air_desc:0 "Günümüzde bir ada olmak, dünyadan kopuk olmak anlamına gelmez. Modern uçaklarla hem Avrupa hem de Amerika kıtasına daha da yaklaşabiliriz. Hava, yarının deniz yollarıdır."
 ICE_iceland_defense_force:0 "İzlanda Savunma Gücü"
 ICE_iceland_defense_force_desc:0 "Amerikan yardımıyla İzlanda modern bir ordu kurabilir. Birliklerimizi eğitmek için bilgi, deneyim ve insan gücüne sahipler. Onlarla birlikte bir güç oluşturmak, birimlerimizi gerçek bir seçkin güç yapma potansiyeline sahiptir."
 ICE_industrial_cooperation:0 "Endüstriyel İşbirliği"
 ICE_industrial_cooperation_desc:0 "Danimarkalı sanayicileri, vergi muafiyetleri ve benzeri şeyler karşılığında İzlanda'da yan kuruluşlar kurmaya davet etmek, burada iş olanakları yaratabilir. Ayrıca bu adanın sanayileşmesine çok ihtiyaç duyulan bir destek verecektir. Danimarka'nın yardımıyla bu ülkeyi ileriye taşıyabiliriz."
 ICE_industrial_research_school:0 "Endüstriyel Araştırma Okulu"
 ICE_industrial_research_school_desc:0 "Üniversite büyük bir başarıdır. Ülke, bu başarının üzerine endüstriyel gelişime yönelik daha odaklı bir yüksek öğrenim yaratarak inşa etmelidir. Bu şekilde, ihtiyacımız olan mühendisleri elde ettiğimizden emin olabiliriz."
 ICE_infiltrating_the_british_isles:0 "Britanya Adalarına Sızma"
 ICE_infiltrating_the_british_isles_desc:0 "Devrimci alev, boğulup sönmemesi için yayılmalıdır. Kurtuluş için en bariz hedef, Britanya Adaları'nın ezilen işçileridir. [ROOT.GetNameDefCap], ezilen bölgelerdeki işçilere, emperyalist ve kapitalist hakimlerine karşı ayaklanmaları için yardım edecektir. Birlikte, devrimci idealleri sıradan işçinin gerçeği haline getirebiliriz."
 ICE_infiltrating_the_british_isles_tt:0 "Galler, İskoçya ve Kuzey İrlanda'da komünist ayaklanmalar başlatmak için §Ykararların§! kilidini açar."
 ICE_infiltration:0 "Sızma"
 ICE_infiltration_desc:0 "Ağlarımızı yaymak ve ekonomimizi diğerleriyle daha fazla bütünleştirmek başka fırsatlar da sunar. Dünya çapında kilit kişiler ve şirketlerle temas kurarak, İzlanda her türlü bilgiyi elde etmek için iyi bir konumda olacaktır."
 ICE_infrastructure_development:0 "Altyapı Geliştirme"
 ICE_infrastructure_development_desc:0 "Altyapıyı modernize etmek ve iyi bir ulaşım sistemi inşa etmek, bu ülkeye refaha giden bir otoyol sağlayacaktır."
 ICE_infrastructure_projects:0 "Altyapı Projeleri"
 ICE_infrastructure_projects_desc:0 "Eğer bu ülke bir gün güçlü olacaksa, yapılması gereken ilk şey altyapıyı inşa etmektir. İyi bir altyapı, her türlü endüstriyel genişlemenin temelidir."
 ICE_international_brigades:0 "Uluslararası Tugaylar"
 ICE_international_brigades_desc:0 "Baskıya karşı mücadele, burada kazanılmış olsa bile devam etmelidir. Aksi takdirde zaferimizin sadece geçici olma riskini alırız. [ROOT.GetName]'ın oğulları ve kızları, ihtiyaç duyulan her yerde yardım etmeye hazır olmalı ve devlet, gerekli yeni yasaları uygulayarak ve gerekli silah ve teçhizatı sağlayarak bunu desteklemek için elinden gelenin en iyisini yapmalıdır."
 ICE_international_relations:0 "Uluslararası İlişkiler"
 ICE_international_relations_desc:0 "Önümüzdeki yol zor olacak, bu kesin. Eğer yalnız yürüyeceksek, daha da zor olacak. Bu nedenle, yeni müttefikler aramalıyız. Komünist Enternasyonal, yeni ittifaklar aramayı deneyebileceğimiz böyle bir yerdir, ancak başka seçenekler de var. Önemli olan, hemen yapmaya başlamamız gereken, aktif olarak yeni bir zemin kırmaktır."
 ICE_international_research_community:0 "Uluslararası Araştırma Topluluğu"
 ICE_international_research_community_desc:0 "Hem komünist enternasyonal aracılığıyla hem de dünya çapındaki ülkelerle diğer işbirliği projeleriyle başkalarından öğrenilecek çok şey var. Uluslararası toplumla etkileşime girerek, [ROOT.GetName] yeni ihtişam seviyelerine ulaşacaktır. Kolektivizm, ilerlemeye giden tek doğru yoldur!"
 ICE_international_research_community_tt:0 "Bir ittifakta olmayan veya [ROOT.GetName] ile bir ittifakta olan her komünist ülke:"
 ICE_international_trade:0 "Uluslararası Ticaret"
 ICE_international_trade_desc:0 "İzlanda'nın finansal dünya sahnesinde daha aktif olması gerekiyor. Serbest ticareti benimseyerek ve ülkemizi yabancı yatırımlara açarak daha fazla ticaret fırsatı yaratabilir ve ekonomimizi daha da canlandırabiliriz."
 ICE_joint_military_training:0 "Ortak Askerî Eğitim"
 ICE_joint_military_training_desc:0 "Adada bir orduyu modern savaşta düzgün bir şekilde eğitmek için yeterli deneyimimiz yok. Bu nedenle, Danimarka ile birlikte çalışmak bizim gibi küçük bir ada için en iyi yaklaşımdır."
 ICE_joint_shipbuilding_programme:0 "Ortak Gemi İnşa Programı"
 ICE_joint_shipbuilding_programme_desc:0 "Danimarka'ya yardım etmenin en iyi yolu deniz yoluyladır. Birlikte Kuzey Denizi'ni koruyabiliriz. Bunu yapmak için gemilere ihtiyacımız var, bu yüzden bir filo oluşturmak için ortak bir çaba, askeri işbirliği stratejimizi oluşturmada doğal bir adımdır."
 ICE_keflavik_airbase:0 "Keflavík Hava Üssü"
 ICE_keflavik_airbase_desc:0 "Amerikalılar, Atlantik'te daha iyi devriye gezebilmek için daha büyük bir hava üssü inşa etmek istiyorlar. Bunu onaylamalıyız çünkü bu sadece bu ülkeyi daha güçlü yapacaktır."
 ICE_local_arms_industry:0 "Yerel Silah Sanayisi"
 ICE_local_arms_industry_desc:0 "Yerel olarak silah üreterek, hem kendi kuvvetlerimizi tedarik edebilir hem de uluslararası pazarda satabiliriz, bu da sadece savunma kabiliyetlerimizi değil aynı zamanda ekonomimizi de artıracağımız anlamına gelir. Bu nedenle İzlanda silah sanayisi, yatırımlarımız için kilit bir odak noktası olmalıdır."
 ICE_low_cost_aircrafts:0 "Düşük Maliyetli Uçaklar"
 ICE_low_cost_aircrafts_desc:0 "Sahip olmadığımız şey büyük bir sanayi, ama sahip olduğumuz şey uçak yapımını optimize etmeyi bilen seçkin birkaç bireydir. Kabul edelim ki zayıf ekonomimizle bile hava silahlanma yarışında ayakta kalabilmemiz için onların yeteneklerinden faydalanmalıyız."
 ICE_mine_iceland:0 "İzlanda'yı Mayınla"
 ICE_mine_iceland_desc:0 "Deniz yolları açısından, İzlanda kuzey hariç her yönden kritik bir şekilde açıktır. Adamızdaki insanların güvenliğini düzgün bir şekilde sağlamak için, açık bir çatışma durumunda İzlanda sularını kapsamlı bir şekilde mayınlamaya hazır olmalıyız."
 ICE_mineral_prospecting:0 "Maden Arama"
 ICE_mineral_prospecting_desc:0 "Teorik olarak, dağlarda gizli doğal kaynaklar olabilir. Bunları ortaya çıkarmaya çalışarak, İzlanda'daki ana sanayi olarak balıkçılık ve tarıma bir alternatif sağlayabiliriz."
 ICE_modernizing_the_coast_guard:0 "Sahil Güvenliği Modernleştirme"
 ICE_modernizing_the_coast_guard_desc:0 "İzlanda Sahil Güvenliği uzun zamandır hem iç hem de dış güvenlik için kullanılan ana gücümüz olmuştur. Bu nedenle, modernizasyonun ve teknolojik gelişmelerin hızlı temposuna ayak uydurabildiklerinden emin olmalıyız."
 ICE_modernizing_the_island:0 "Adayı Modernleştirmek"
 ICE_modernizing_the_island_desc:0 "Yeni teorilerin pratiğe dökülmesi gerekiyor. ekonominin reforma ihtiyacı var. Şimdi bu değişiklikleri zorlama zamanı."
 ICE_not_our_king:0 "Bizim Kralımız Değil"
 ICE_not_our_king_desc:0 "İzlanda Krallığı - ne saçmalık. İzlanda'nın bir krala ihtiyacı yok ve kesinlikle bir Danimarkalıya değil. Geleceğe doğru bir adım atarken, İzlandalılar arasında geçmişle tam bir kopuş için destek oluşturmaya başlama zamanı geldi."
 ICE_not_standing_idly_by:0 "Boş Durmamak"
 ICE_not_standing_idly_by_desc:0 "Savaş geliyor, istesek de istemesek de. Adayı savunma şansımız olacaksa ulusu silahlandırmalıyız. Ölüm kalım meselesi, bu kesin."
 ICE_off_shore_oil_drilling:0 "Açık Deniz Petrol Sondajı"
 ICE_off_shore_oil_drilling_desc:0 "Petrol giderek daha önemli bir kaynak haline geliyor. Günümüz donanmaları büyük miktarlarda tüketiyor. Adanın etrafındaki deniz yatağında petrol olabileceğine inanmak için nedenler var. Bu yüksek riskli, yüksek ödüllü bir seçenek, ancak bu petrolün var olup olmadığını ve yüzeye çıkarılıp çıkarılamayacağını araştırmak değerli olabilir."
 ICE_organize_a_march:0 "Bir Yürüyüş Düzenle"
 ICE_organize_a_march_desc:0 "Halkımız çok uzun zamandır yabancı hakim güçlerin esareti altında. Başkente yönelik, tıpkı Roma'ya karşı yapılan gibi milliyetçi bir yürüyüş, güçlü Viking geçmişimizin bir hatırlatıcısı olacaktır. Özgürlüğüne düşkün her İzlandalıyı bize katılmaya ikna edebilirsek, hükümete İzlanda halkının güçlü, kalabalık ve birlik olduğunu gösterebiliriz! Birlikte, daha yüce bir gelecek yaratabiliriz!"
 ICE_organize_the_greyshirts:0 "Gri Gömleklileri Örgütle"
 ICE_organize_the_greyshirts_desc:0 "Gençlikten eğitilmiş iyi silahlanmış bir milis, gençleri yetiştirmek ve onları yeni dünyamıza uydurmak için faydalı bir araç olabilir. Ek olarak, yarı askeri eğitim aynı zamanda silahlı kuvvetlerin yeteneklerini desteklemek anlamına da gelir, ki bu da haklı olarak bizim olanı geri alırken faydalı olabilir."
 ICE_overlord_research_cooperation_tt:0 "Ortak İzlanda araştırma programları"
 ICE_patrolling_the_atlantic:0 "Atlantik'te Devriye"
 ICE_patrolling_the_atlantic_desc:0 "Ticaret filomuzu koruyabilmek için okyanusa açılan eskort gemilerine ihtiyacımız var. Yeni modeller tasarlamak için Danimarka ile birlikte çalışmalıyız."
 ICE_political_unity:0 "Siyasi Birlik"
 ICE_political_unity_desc:0 "Tehlike zamanlarında, ulusun bir arada durması özellikle önemlidir. Siyasi farklılıklarımızı bir kenara bırakmalı ve [ROOT.GetName]'ı savaştan uzak tutmak için ne gerekiyorsa yapmalıyız."
 ICE_prepare_for_the_revolution:0 "Devrime Hazırlan"
 ICE_prepare_for_the_revolution_desc:0 "Başarılı bir devrim kendi kendine olmaz. Titizlikle hazırlanması gerekir. Tohumlar ekilmeli ve sulanmalıdır. Halk ne zaman ayaklanacağını bilmeli ve devrimciler ayaklandıklarında onlara rehberlik etmelidir. Afişler basılmalıdır. Profesyonel devrimciler askere alınmalı ve eğitilmeli, silahlar düzgün bir şekilde saklanmalı ve liderler kontrolü ele almaya hazır olmalıdır."
 ICE_rally_the_workers_of_reykjavik:0 "Reykjavik İşçilerini Topla"
 ICE_rally_the_workers_of_reykjavik_desc:0 "İzlanda'nın sözü edilecek bir ordusu yok, ama başkentin işçileri kesinlikle hesaba katılması gereken bir güç olabilir. Eğer işçiler sisteme karşı ayaklanırsa, onları durdurabilecek pek bir şey olmaz, bu yüzden onları davaya kazanmak olabildiğince önemlidir."
 ICE_reclaiming_the_empire:0 "İmparatorluğu Geri Alma"
 ICE_reclaiming_the_empire_desc:0 "Grönland bir zamanlar İzlanda'dan gelen vikingler tarafından iskan edilmişti. Norveç ve Danimarka o zamandan beri, adaya gerçek bir hakları olmamasına rağmen, onun için çekişti. Grönland'ın haklı sahiplerine iadesini talep etme zamanı geldi. Eğer miraslarına ve tarihlerine hiç değer veriyorlarsa, onu bize koşulsuz olarak devredeceklerdir. Zafer yolumuzda devam edelim!"
 ICE_recruiting_international_workers:0 "Uluslararası İşçileri Askere Alma"
 ICE_recruiting_international_workers_desc:0 "Ulusumuzu komünistler ve sosyalistler için bir rol model topluma dönüştürerek ve devrimci alevi her zamanki gibi parlak tutarak, tıpkı Sovyet devletinin ilk günleri gibi uluslararası devrimcileri çekebiliriz. Nereden gelirlerse gelsinler, işçilere ve devrimci askerlere [ROOT.GetName]'ın meşaleyi taşıdığını ve ait oldukları yerin burası olduğunu göstermeliyiz."
 ICE_remove_dissent_in_the_working_class_tt:0 "§Y$ICE_dissent_in_the_working_class$§!'i kaldıracak "
 ICE_republicanism:0 "Cumhuriyetçilik"
 ICE_republicanism_desc:0 "İzlanda'nın bir Krala ihtiyacı yok. Naiblik, onsuz da iyi yapabildiğimizi gösterdi. Bu ortaçağ kurumunu ortadan kaldırma ve bir cumhuriyete hazırlanma zamanı geldi."
 ICE_research_cooperation:0 "Araştırma İşbirliği"
 ICE_research_cooperation_desc:0 "Bizimle aynı çizgide olan güçlerle işbirliği yaparak gelecekte silahlar açısından bize avantaj sağlayacak teknolojileri daha iyi geliştirebiliriz. Değerli ortaklarımızdan öğrenebilir, aynı zamanda meraklı gözlerden uzak, iyi ve tenha test alanları sunabiliriz."
 ICE_research_cooperation_tt:0 "Ortak araştırma programları"
 ICE_reykjavik_dockyards:0 "Reykjavik Tersaneleri"
 ICE_reykjavik_dockyards_desc:0 "Bir filo inşa etmenin ilk adımı, daha modern ve çok sayıda rıhtımdır. Devlet fonları, başka bir şey yapmadan önce gemi inşa kabiliyetlerini genişletmeye gitmelidir."
 ICE_royal_marines:0 "Kraliyet Deniz Piyadeleri"
 ICE_royal_marines_desc:0 "İzlanda'nın ordusu asla büyük olmayacak. Ama uzmanlaşabiliriz ve deniz piyadeleri bir ada ülkesi için bariz bir seçimdir. Bir Deniz Piyade Kolordusu oluşturarak ve eğiterek, ihtiyaç duyulan her yere konuşlandırılabilecek esnek bir güç elde ederiz."
 ICE_securing_the_north_sea_passage:0 "Kuzey Denizi Geçidini Güvence Altına Alma"
 ICE_securing_the_north_sea_passage_desc:0 "İzlanda mülkü olması gerekeni geri alma zamanı geldi. Kuzey Denizi'ndeki Shetland ve Faroe adaları, [ROOT.GetNameDef]'e giden ve oradan gelen geçişi kontrol etmenin hayati anahtarlarıdır."
 ICE_state_corporatism:0 "Devlet Korporatizmi"
 ICE_state_corporatism_desc:0 "Zayıf Danimarka boyunduruğunun son kalıntılarından kurtulduğumuza göre, yeni bir devlet kurma zamanı geldi. Ulusumuzun güvenliğini sağlamanın en iyi yolu, sendika liderleri, sanayi kodamanları ve partinin tüm İzlandalıların ortak iyiliği için birlikte çalıştığı güçlü bir liderin arkasında birleşmektir. Devlet sanayicileri destekleyecek ve onlar da karşılığında devleti destekleyecektir."
 ICE_state_owned_enterprises:0 "Devlet Teşebbüsleri"
 ICE_state_owned_enterprises_desc:0 "Adamız artık kendi başına daha düzgün bir şekilde ayakta durabildiğine göre, işçileri çekebilecek ve ekonomiyi, ayrıca devlet aygıtının verimliliğini artırabilecek endüstriler kurmayı düşünme zamanı geldi."
 ICE_state_owned_industry:0 "Devlet Teşebbüsü"
 ICE_state_owned_industry_desc:0 "[ROOT.GetNameDef] gibi küçük bir ülke, ihtiyaç duyulan malları üretmek için kapitalistlere güvenemez. Verimliliği en üst düzeye çıkarmak ve en çok ihtiyaç duyulan malların üretilmesini sağlamak için, devletin devreye girip sanayinin kontrolünü ele alması gerekiyor. Artık ülke hayatta kalmak için yabancı yatırıma bağımlı olmayacak. İzlanda devleti vatandaşlarına ve silahlı kuvvetlerine bakacaktır."
 ICE_state_visits:0 "Devlet Ziyaretleri"
 ICE_state_visits_desc:0 "Faşistlerin yönettiği ülkelerin şu anda dünyada değişimi yönlendirenler olduğu inkâr edilemez. Eğer İzlanda değişecekse, belki onlardan öğrenilecek şeyler vardır. Resmi ilişkiler en kısa sürede kurulmalı ve herhangi bir işbirliği fırsatı derhal araştırılmalıdır."
 ICE_support_equipment:0 "Destek Teçhizatı"
 ICE_support_equipment_desc:0 "Ordunun her birimi ve isyan polisi daha ağır mühimmatın yanı sıra uygun ilk yardım çantaları ve bastırma silahlarını da kullanabilir. Bu nedenle, buna en kısa sürede yatırım yaptığımızdan emin olmalıyız."
 ICE_taking_the_fight_to_our_enemies:0 "Savaşı Düşmanlarımıza Götürmek"
 ICE_taking_the_fight_to_our_enemies_desc:0 "Deniz bizi çevreliyor ve yüzyıllardır büyük denizler halkımızı ve kim olduğumuzu şekillendirdi. Bundan edindiğimiz bilgiden yararlanarak, savaşı düşmanlarımıza, en az bekledikleri yerlerde götürebiliriz."
 ICE_the_armed_forces_of_iceland:0 "İzlanda Silahlı Kuvvetleri"
 ICE_the_armed_forces_of_iceland_desc:0 "Eğer savaş İzlanda'ya gelirse, İzlanda kendini savunabilmelidir. Herhangi bir olası işgalciyi yenebilecek bir güç oluşturmaya başlamalıyız. Küçük bir nüfusa sahip küçük bir adadır, ancak konum ve boyut kendi başına bir güç olabilir, çünkü hiçbir düşman onu almak için büyük kuvvetler ayıramayacaktır."
 ICE_the_icelandic_police_force:0 "İzlanda Polis Gücü"
 ICE_the_icelandic_police_force_desc:0 "İzlanda ordusu asla çok büyük olmayacak. Ancak bir alternatif olarak, ulusal polis gücünün görevlerini işgal savunmasını da içerecek şekilde genişletebiliriz. Bu şekilde, sahip olduğumuz sınırlı insan gücünü daha verimli kullanabilir ve adanın savunmasını daha iyi hazırlayabiliriz."
 ICE_the_kingdom_of_iceland:0 "İzlanda Krallığı"
 ICE_the_kingdom_of_iceland_desc:0 "Bu ülke bağımsızlığa doğru uzun bir yol kat etti. Krallığı kurmak, özgürlüğe doğru son adım olarak görülmelidir. Artık sadece bir Kralı ve Dış Politikayı Danimarka ile paylaşıyoruz. Yavaş yavaş bu bağ, sadece bir formalite haline gelene kadar aşındırılabilir."
 ICE_the_merchant_fleet:0 "Ticaret Filosu"
 ICE_the_merchant_fleet_desc:0 "Gemiler bir zamanlar bu ulusu yaratmanın temel bir parçasıydı. Gemiler geleceğin de bir parçası olacak. Güçlü bir ticaret donanması, gelecekteki İzlanda ekonomisinin çekirdeği olacaktır."
 ICE_the_viking_spirit:0 "Viking Ruhu"
 ICE_the_viking_spirit_desc:0 "Eski vikinglerle ilişkilendirilen kelimeler korkusuz ve ölümcüldü. Ötesinde ne olduğunu bilmeden okyanusları aştılar ve sadece güçlü olanlar başarılı oldu. Bugün İzlandalıların olması gereken şey korkusuz ve cesurdur, çünkü ancak cüret ve cesaretle, ülke bir zamanlar olanı geçecek ve bir kez daha Kuzey Denizi'ne hükmedecektir."
 ICE_thungur_hnifur:0 "Þungur Hnífur"
 ICE_thungur_hnifur_desc:0 "İzlanda ordusu asla büyük olmayacak. Bunu telafi etmek için, birliklerimize mümkün olan en iyi eğitimi verdiğimizden ve güçlü yönlerimize odaklandığımızdan emin olmalıyız ki vurduğumuzda darbe ağır olsun."
 ICE_thungur_hnifur_idea:0 "Elit Kuvvetler"
 ICE_trade_relations:0 "Ticaret İlişkileri"
 ICE_trade_relations_desc:0 "Küçük bir ulus, ihtiyaç duyduğu her şeyi üretmeyi umamaz. Ancak, dünya çapındaki ülkelerle iyi ilişkiler sürdürerek ve Avrupa ile Kuzey Amerika arasında tam ortada bulunan stratejik konumu kullanarak, İzlanda bir finans ve ticaret merkezi olmak için mükemmel bir konumdadır. Bu bağlantıları en iyi şekilde kullanmak, ülkenin umutsuzca ihtiyaç duyduğu teçhizatı tedarik etmeyi kolaylaştırmalıdır."
 ICE_transformation_of_nature:0 "Doğanın Dönüşümü"
 ICE_transformation_of_nature_desc:0 "Elektrik, sanayileşmenin anahtarıdır. İzlanda'nın doğası, tıpkı vatandaşlar gibi devlete hizmet etmelidir. Nehirler ve şelaleler barajlara, taşlar taş ocaklarına dönüştürülebilir ve kaplıcalar ısıtma için kullanılabilir. İlerleme yürüyüşümüzde hiçbir şey bizi durdurmamalı."
 ICE_united_we_stand:0 "Birlikten Kuvvet Doğar"
 ICE_united_we_stand_desc:0 "Büyük Savaş sırasında tecrit edildik. Danimarka tarafsızdı ve İzlanda tüm pazarlara erişimini kaybetmekten muzdaripti. Danimarka yeniden silahlanıyor ve gerekirse onlara yardım etmeye hazır olmalıyız. Bu sefer İzlanda dünyaya damgasını vuracak."
 ICE_viking_spirit_tt:0 "§YViking Ruhunu Geliştir§! için Kararların kilidini açar!"
 ICE_vinland:0 "Vinland"
 ICE_vinland_desc:0 "Bir Kuzey Atlantik İmparatorluğu fikri, Amerika'nın kendisi de İzlanda kökenli olan Leifur Eiríksson'dan başkası tarafından keşfedilmesiyle doğdu. Ne yazık ki, Vinland'daki viking kolonisi yok oldu, ama şimdi uzun zamandır kayıp olan hayalimizi gerçeğe dönüştürme zamanı. Odin için!"
 ICE_we_shall_defend_our_island:0 "Adamızı Savunacağız"
 ICE_we_shall_defend_our_island_desc:0 "Adamız bizim evimizdir ve kimse onu bizim kadar iyi bilmez. Ordumuzu dağlarda savaşta uzmanlaştırarak, kıyıdan çekilebilir ve düşmanlarımız karaya çıkıp kendinden emin ve rehavete kapıldıkları anda onları yok edebiliriz."
 NORDIC_ad_hoc_military_industry:0 "Geçici Askerî Sanayi"
 NORDIC_ad_hoc_military_industry_desc:0 "Anıtsal fabrika kampüsleri veya beton ve duman alanları planlamak ve inşa etmek için zaman yok. Sanayimizi olabildiğince çabuk, mümkün olan her yerde inşa etmeliyiz, [NORDIC_get_alliance_name] etrafına dağılmış küçük fabrikalarla, böylece tek bir savaşta hepsini kaybetme riskine girmeyiz."
 NORDIC_against_tyranny_TT:0 "Dış güçlerin istilasına karşı diğer İskandinav ülkelerini desteklemek için §Yİskandinav Ülkesine Silah Gönder§!, §Yİskandinav Ülkesi için Gönüllü Gönder§! ve §Yİskandinav Ülkesini Savun§! kararlarının kilidini açar."
 NORDIC_air_exercises:0 "Hava Tatbikatları"
 NORDIC_air_exercises_desc:0 "Hava muharebesi yeni bir savaş çağı getirirken, uluslarımız arasındaki bu yeni işbirliği çağı da sıkı bir şekilde icra edilen ortak hava operasyonlarıyla eşlik etmelidir. Bunun için, kuvvetlerimiz tek vücut olana kadar birlikte tatbikat yapmalıdır."
 NORDIC_air_infrastructure:0 "Hava Altyapısı"
 NORDIC_air_infrastructure_desc:0 "ÇEVİRİLECEK_İSKANDİNAV"
 NORDIC_air_production:0 "Hava Üretimi"
 NORDIC_air_production_desc:0 "Kuzey yarımküre ve ötesinde üstünlük kurmayı umuyorsak, büyük güçlerin yıllardır biriktirdiği stoklara yetişmemiz gerekiyor. Neyse ki, düşmanı geride bırakmak ve o boşluğu kapatmak için kullanabileceğimiz uygulamaları, bilgiyi ve ekipmanı paylaşabiliriz."
 NORDIC_aircraft_concentration:0 "Uçak Yoğunlaşması"
 NORDIC_aircraft_concentration_desc:0 "ÇEVİRİLECEK_İSKANDİNAV"
 NORDIC_airfields:0 "Hava Alanları"
 NORDIC_airfields_desc:0 "ÇEVİRİLECEK_İSKANDİNAV"
 NORDIC_amphibious_forces:0 "Amfibi Kuvvetler"
 NORDIC_amphibious_forces_desc:0 "Düşmanlarımıza her yerde, her zaman saldırabileceğimizi sağlayarak, onların saldırı yeteneklerini azaltabiliriz. Eğer her zaman kıyı şeritleri boyunca bir çıkarma yapmaktan korkmak zorundalarsa, cephe hattına o kadar çok birim konuşlandıramazlar. Bu nedenle odağımız amfibi operasyonlar ve deniz piyadeleri olmalıdır."
 NORDIC_anti_air_construction:0 "Uçaksavar İnşaatı"
 NORDIC_anti_air_construction_desc:0 "ÇEVİRİLECEK_İSKANDİNAV"
 NORDIC_artillery_program:0 "Topçu Programı"
 NORDIC_artillery_program_desc:0 "ÇEVİRİLECEK_İSKANDİNAV"
 NORDIC_baltic_interests:0 "Baltık Çıkarları"
 NORDIC_baltic_interests_desc:0 "ÇEVİRİLECEK_İSKANDİNAV"
 NORDIC_baltic_sea_dominance:0 "Baltık Denizi Hakimiyeti"
 NORDIC_baltic_sea_dominance_desc:0 "Baltık Denizi uzun zamandır bizim arka bahçemiz olmuştur. Diğer ulusların dalgalarında serbestçe dolaşmasına izin verirsek şansımız yok. Bu soğuk ve mesafeli enginliğe hükmedebilmek için kıyıları inşa edelim."
 NORDIC_bomber_command:0 "Bombardıman Komutanlığı"
 NORDIC_bomber_command_desc:0 "Ortak bir bombardıman komutanlığı kurmak, savaş alanındaki yer desteğimizi ve düşman hatları gerisindeki bombardıman saldırılarımızı daha iyi koordine etmemizi sağlayacaktır. Bu, kuzey uluslarımızın düşmanlarımıza karşı ortak bir çaba göstermesinin tek yoludur."
 NORDIC_carrier_effort:0 "Uçak Gemisi Çabası"
 NORDIC_carrier_effort_desc:0 "Deniz muharebesinin yeni sınırı, onların üzerindeki gökyüzüdür. En iyi uçak gemilerini ve mümkün olan en iyi uçak gemisi uçaklarını yaratmak için kaynaklarımızı bir araya getirmeliyiz. Bu şekilde denizlere hükmedebilir ve bunu yaparak ülkelerimizin gerektirdiği güvenliği yaratabiliriz."
 NORDIC_central_training_developments:0 "Merkezi Eğitim Gelişmeleri"
 NORDIC_central_training_developments_desc:0 "ÇEVİRİLECEK_İSKANDİNAV"
 NORDIC_civilian_contributions:0 "Sivil Katkılar"
 NORDIC_civilian_contributions_desc:0 "Artık genel nüfusun ittifakımızın diğer üyeleriyle yeni bir ortak kimlik duygusuna sahip olduğuna göre, [NORDIC_get_alliance_name]'a güvenlik ve zafer getirecek savaş makinesini beslemek için gereken katkıları ve fedakarlıkları yapmaya istekli olacaklarını biliyoruz."
 NORDIC_communist_first_selector_left:0 "Kuzey Halk Ordusu Bürosu"
 NORDIC_communist_first_selector_right:0 "Kuzey Halk Kalkınma Kurulu"
 NORDIC_communist_institution_1:0 "Kuzey Federasyonu"
 NORDIC_communist_institution_2:0 "Kuzey Politbürosu"
 NORDIC_communist_second_selector_left:0 "Kuzey İleri Bilimler Akademisi"
 NORDIC_communist_second_selector_right:0 "Halkın Askerî Tahsisat Bürosu"
 NORDIC_consolidating_institutions:0 "Kurumları Pekiştirme"
 NORDIC_consolidating_institutions_desc:0 "ÇEVİRİLECEK_İSKANDİNAV"
 NORDIC_construction_armies:0 "İnşaat Orduları"
 NORDIC_construction_armies_desc:0 "ÇEVİRİLECEK_İSKANDİNAV"
 NORDIC_control_the_northern_sea:0 "Kuzey Denizlerini Kontrol Et"
 NORDIC_control_the_northern_sea_desc:0 "Norveç ve Kuzey denizleri, Atlantik'e açılan kapıdır. Çabalarımızı oraya odaklamak, Avrupa'nın kuzey kıyısındaki uluslarla başa çıkmamızı ve hatta istersek Kuzey Amerika'ya ulaşmamızı sağlayacaktır."
 NORDIC_court_foreign_power_TT:0 "Komünist veya Faşist bir büyük gücün ittifakına katılmanıza olanak tanıyan §YYabancı Güce Kur Yap§! kararının kilidini açar."
 NORDIC_defend_the_danish_belt:0 "Danimarka Kuşağını Savun"
 NORDIC_defend_the_danish_belt_desc:0 "Danimarka Kuşağı, Baltık Denizi'ne açılan kapıdır. Eğer Kuzey Atlantik'ten Baltık Denizi'ne ulaşamazlarsa, uluslarımız bir deniz istilasından çok daha güvende olacaktır, bu yüzden çabalarımızı onu bir duvara dönüştürmeye yoğunlaştıralım ki Baltık Denizi'nde engelsiz dolaşabilelim."
 NORDIC_democratic_first_selector_left:0 "İskandinav Kalkınma Departmanı"
 NORDIC_democratic_first_selector_right:0 "İskandinav Araştırma Kurulu"
 NORDIC_democratic_institution_1:0 "İskandinav Bakanlar Komisyonu"
 NORDIC_democratic_institution_2:0 "İskandinav Baş Parlamentosu"
 NORDIC_democratic_second_selector_left:0 "İskandinav Hava Kuvvetleri Komitesi"
 NORDIC_democratic_second_selector_right:0 "İskandinav Müşterek Deniz Komutanlığı"
 NORDIC_develop_resources:0 "Kaynakları Geliştir"
 NORDIC_develop_resources_desc:0 "Yeterince dikkatli bakarsanız ne bulacağınızı asla bilemezsiniz. Eğer çabalarımızı odaklarsak, savaş çabaları için çok önemli olan keşfedilmemiş kaynak yataklarını ortaya çıkarabilir ve hatta zaten sahip olduklarımızdan daha fazlasını çıkarmak için yeni yollar geliştirebiliriz."
 NORDIC_economic_union:0 "Ekonomik Birlik"
 NORDIC_economic_union_desc:0 "Kaynaklarımızı bir araya getirmeliyiz, hepimizin komşusunun ihtiyacı olan bir şeye sahibiz. Ekonomilerimizi uzun süredir ayrı tutan engelleri yıkarak daha yüksek bir verimlilik seviyesine ulaşacağız. Kaynaklar aramızda akmalı ki birbirimize daha iyi yardım edebilelim."
 NORDIC_emergency_funding:0 "Acil Durum Finansmanı"
 NORDIC_emergency_funding_desc:0 "ÇEVİRİLECEK_İSKANDİNAV"
 NORDIC_emergency_military_industry:0 "Acil Durum Askerî Sanayisi"
 NORDIC_emergency_military_industry_desc:0 "ÇEVİRİLECEK_İSKANDİNAV"
 NORDIC_equipment_conversion_focus:0 "Teçhizat Dönüşüm odağı"
 NORDIC_equipment_conversion_focus_desc:0 "Eski silahlar ve araçlarla dolu, ya naftalinlenmiş ya da düşmüş düşmanlarımızdan ele geçirilmiş devasa depolarımız var. Bu eski teçhizat, mevcut savaş makinemizin sunduğu en yeni ve en ölümcül olana dönüştürülebilir."
 NORDIC_estonian_collaboration:0 "Estonya İşbirliği"
 NORDIC_estonian_collaboration_desc:0 "ÇEVİRİLECEK_İSKANDİNAV"
 NORDIC_expand_naval_base_network:0 "Deniz Üssü Ağını Genişlet"
 NORDIC_expand_naval_base_network_desc:0 "ÇEVİRİLECEK_İSKANDİNAV"
 NORDIC_expand_naval_production:0 "Donanma Üretimini Genişlet"
 NORDIC_expand_naval_production_desc:0 "ÇEVİRİleCEK_İSKANDİNAV"
 NORDIC_expedited_training:0 "Hızlandırılmış Eğitim"
 NORDIC_expedited_training_desc:0 "ÇEVİRİLECEK_İSKANDİNAV"
 NORDIC_expert_naval_mechanics:0 "Uzman Deniz Mekanikçileri"
 NORDIC_expert_naval_mechanics_desc:0 "ÇEVİRİleCEK_İSKANDİNAV"
 NORDIC_extended_range:0 "Genişletilmiş Menzil"
 NORDIC_extended_range_desc:0 "ÇEVİRİLECEK_İSKANDİNAV"
 NORDIC_fighter_command:0 "Avcı Komutanlığı"
 NORDIC_fighter_command_desc:0 "İdeallerimizi ve genel görevimizi paylaştığımız gibi, üzerimizdeki gökyüzünü de paylaşıyoruz. Birbirimizin hava sahasını korumak ve savaş alanı üzerinde hava üstünlüğü kazanmak için birlikte uçmalıyız ki bağlarımız düşmanın yer desteğiyle kopmasın."
 NORDIC_fill_the_infrastructure_gaps:0 "Altyapı Boşluklarını Doldur"
 NORDIC_fill_the_infrastructure_gaps_desc:0 "Bir araya gelmeden önce, ülkelerimiz farklı gelişmişlik seviyelerindeydi ve [NORDIC_get_alliance_name]'daki en gelişmiş ülkelerdeki bazı bölgeler bile daha iyi altyapı kullanabilirdi. Tüm tekneleri yükseltmek için bir araya gelmeliyiz."
 NORDIC_first_joint_institution:0 "[NORDIC_get_institution_1_name]"
 NORDIC_first_joint_institution_desc:0 "Gerçek entegrasyon ve işbirliğine doğru ilk adımlarımızı atarken, [NORDIC_get_alliance_name]'ın yeni bir kuruma ihtiyacı var, [NORDIC_get_institution_1_desc]"
 NORDIC_first_joint_institution_desc_com:0 "halklarımızı birleştirebilecek ve onlara kendi kaderini tayin hakkı sunarken üretim araçlarının mülkiyetini garanti edebilecek bir yer."
 NORDIC_first_joint_institution_desc_dem:0 "uluslarüstü örgütümüzdeki farklı ülkelerin kabine üyelerinin, Avrupa'da yükselen gerilimler boyunca halklarımızı yönlendirmek için çabalarımızı nasıl daha iyi birleştireceklerini tartışabilecekleri bir yer."
 NORDIC_first_joint_institution_desc_mon:0 "aristokratik bağlantılar ağımızı çözebilecek ve onları, her birinin güç yapısında yerine getireceği bir role sahip soylu akranlarımızın birleşik bir takımyıldızına yerleştirebilecek bir yer."
 NORDIC_first_selector_left:0 "[NORDIC_get_first_selector_left]"
 NORDIC_first_selector_left_desc:0 "ÇEVİRİLECEK_İSKANDİNAV"
 NORDIC_first_selector_right:0 "[NORDIC_get_first_selector_right]"
 NORDIC_first_selector_right_desc:0 "ÇEVİRİLECEK_İSKANDİNAV"
 NORDIC_form_joint_alliance:0 "[NORDIC_get_alliance_name]'ı Kur"
 NORDIC_form_joint_alliance_desc:0 "Pan-İskandinav rüyası, 1864'te bir arada durma başarısızlığıyla ciddi bir darbe aldı. [NORDIC_GetFormAllianceSecondParagraph]"
 NORDIC_form_joint_alliance_desc_com:0 "Ancak, proleter devrimin itici gücüyle halklarımızı bir araya getirebilir ve uluslarımızı Kuzey Halkları ittifakında birleştirerek kapitalizme karşı mücadeleye odaklayabiliriz."
 NORDIC_form_joint_alliance_desc_dem:0 "Ancak, paylaştığımız demokratik değerlere dayalı yeni bir ittifak kurmak, kendimizi savunurken ve özgürlük düşmanlarına karşı hızlı bir zafer getirirken, her yerdeki demokrasiler için bir ışık olabilir."
 NORDIC_form_joint_alliance_desc_mon:0 "Ancak, paylaştığımız köklü geleneklerimize dayanan kraliyet mirasımız, büyük resmi görmemizi ve sevgili krallarımızın ve kraliçelerimizin korunması için tek vücut olarak birlikte çalışmamızı sağlar."
 NORDIC_ground_operations:0 "Kara Operasyonları"
 NORDIC_ground_operations_desc:0 "Daha fazla üs inşa etmek, ortak hava operasyonlarımızda daha fazla esnekliğe sahip olmamızı sağlar ve daha fazla uçaksavar bataryası inşa ederek toprağımızı savunabilir ve pilotlarımızın sırtından biraz yük alabiliriz. Hava operasyonlarımızın etkinliğini en üst düzeye çıkarmak için birbirine bağlı bir yer destek sistemi böyle oluşturulur."
 NORDIC_improved_assembly:0 "Geliştirilmiş Montaj"
 NORDIC_improved_assembly_desc:0 "ÇEVİRİLECEK_İSKANDİNAV"
 NORDIC_industrial_cooperation:0 "Endüstriyel İşbirliği"
 NORDIC_industrial_cooperation_desc:0 "ÇEVİRİLECEK_İSKANDİNAV"
 NORDIC_infantry_first:0 "Önce Piyade"
 NORDIC_infantry_first_desc:0 "Nesiller boyu adamlarımız, önlerindeki başka bir zavallı ruhla her santim için diş ve tırnakla savaşmak için sadece silahları ve üzerlerindeki giysilerle savaş alanına gittiler. Eğer birliklerimiz önlerindeki düşmanın gözlerini görebilirse, oluşturdukları tehdidi görecek ve ulusları için ölüme kadar savaşacaklardır."
 NORDIC_jet_engines:0 "Jet Çağına"
 NORDIC_jet_engines_desc:0 "Jet motorlarındaki yeni gelişmeler, sınıfının en iyisi pervaneli uçakları amaçsızca süzülen kağıt uçurtmalar gibi gösteriyor. Hava muharebesinin yeni çağı burada ve jet motoru tarafından domine edilecek. Yatırımlarımızı bu alanda bir araya getirirsek, düşmanlarımızı atlayabilir ve uçak besin zincirinin en tepesini üretebiliriz."
 NORDIC_joint_military_exercises:0 "Müşterek Askerî Tatbikatlar"
 NORDIC_joint_military_exercises_desc:0 "Askerlerimiz ve subaylarımız daha önce içinde bulunduğumuz gibi bir ittifakla hiç karşılaşmadılar, birlikte çalışmak ikinci doğaları haline gelene kadar tek vücut olarak talim yapmaları gerekiyor. Bu gerçekleştiğinde, [NORDIC_get_alliance_name] kuvvetleri durdurulamaz olacaktır."
 NORDIC_joint_special_forces:0 "Müşterek Özel Kuvvetler"
 NORDIC_joint_special_forces_desc:0 "ÇEVİRİLECEK_İSKANDİNAV"
 NORDIC_large_scale_production:0 "Büyük Ölçekli Üretim"
 NORDIC_large_scale_production_desc:0 "ÇEVİRİLECEK_İSKANDİNAV"
 NORDIC_latvian_collaboration:0 "Letonya İşbirliği"
 NORDIC_latvian_collaboration_desc:0 "ÇEVİRİLECEK_İSKANDİNAV"
 NORDIC_leverage_nordic_investments:0 "İskandinav Yatırımlarından Faydalan"
 NORDIC_leverage_nordic_investments_desc:0 "ÇEVİRİLECEK_İSKANDİNAV"
 NORDIC_lithuanian_collaboration:0 "Litvanya İşbirliği"
 NORDIC_lithuanian_collaboration_desc:0 "ÇEVİRİLECEK_İSKANDİNAV"
 NORDIC_machine_tools_research:0 "Takım Tezgahları Araştırması"
 NORDIC_machine_tools_research_desc:0 "İnsan gücü denklemin sadece bir parçasıdır. Kaybedemeyecekleri kayıpları telafi edebilmek için düşmanlarımızdan daha fazla üretmeliyiz. Bu yüzden kendimizi yeni savaş makineleri geliştirmekle sınırlayamayız, dikkatimizi onları ortaya çıkaran makinelere odaklamalıyız."
 NORDIC_materiel_design:0 "Malzeme Tasarımı"
 NORDIC_materiel_design_desc:0 "Savaş nesiller boyunca birçok yönden değişti, ancak yüzyıllardır genellikle bir adam ve tüfeğine indirgeniyor. Bu yeni savaş çağında, [NORDIC_get_alliance_name] adamlarının silahlarını ihmal edemeyiz ve daha iyi silahlar tasarlayarak daha iyi askerler yapacağız."
 NORDIC_mechanized_army:0 "Mekanize Ordu"
 NORDIC_mechanized_army_desc:0 "Adamlarımızı çelik ve toplarla kaplı devasa araçların içinde ve yanında savaşmak için eğitirsek, daha az adamla daha büyük bir darbe indirebiliriz. Tabii, söz konusu devlerden yeterince üretebildiğimiz sürece."
 NORDIC_mechanized_infantry:0 "Mekanize piyade"
 NORDIC_mechanized_infantry_desc:0 "ÇEVİRİLECEK_İSKANDİNAV"
 NORDIC_military_construction:0 "Askerî İnşaat"
 NORDIC_military_construction_desc:0 "ÇEVİRİLECEK_İSKANDİNAV"
 NORDIC_military_industry_hub:0 "Askerî Sanayi Merkezi"
 NORDIC_military_industry_hub_desc:0 "Askeri sanayilerimizi verimli bir şekilde yoğunlaştırarak, bu yakınlık ve uzmanlaşmayı savaş makinelerimiz için yeni zirvelere ulaşmak için kullanabiliriz. Fabrikalarımızı yerinde tuttuğumuz sürece düşmanlarımızdan daha fazla üreteceğiz."
 NORDIC_monarchist_first_selector_left:0 "Denizler Büyük Dükalığı"
 NORDIC_monarchist_first_selector_right:0 "Silahlanma Baronluğu"
 NORDIC_monarchist_institution_1:0 "Norden Soyluları"
 NORDIC_monarchist_institution_2:0 "Kuzey Aslanları Konseyi"
 NORDIC_monarchist_second_selector_left:0 "Hava Kuvvetleri Büyük Dükalığı"
 NORDIC_monarchist_second_selector_right:0 "Kraliyet Ordu Mareşali"
 NORDIC_mountaineers:0 "Dağ Uzmanları"
 NORDIC_mountaineers_desc:0 "İskandinav bölgesi, dağcıları eğitmek ve kullanmak için ideal bir şekilde uygundur. Güçlü bir dağ uzmanı kadrosuyla, bölgeyi çok daha kolay savunabilmeli ve fırsat bulduğumuzda karşı saldırı yapmayı mümkün kılmalıyız. Toprağımızın bir kısmı düşman eline geçse bile, asla teslim olmayacağız."
 NORDIC_mutual_guarantees:0 "Karşılıklı Garantiler"
 NORDIC_mutual_guarantees_desc:0 "ÇEVİRİleCEK_İSKANDİNAV"
 NORDIC_naval_aircraft:0 "Donanma Uçağı"
 NORDIC_naval_aircraft_desc:0 "Deniz savaşının geleceği gökyüzünde yatıyor. Donanma bombardıman uçaklarımız düşmanlarımızın gemilerini denizin dibine gönderecek ve uçak gemilerimizden kalkan avcı uçakları, düşman uçaklarının dumanıyla gökyüzünü kaplayacak."
 NORDIC_naval_construction:0 "Donanma İnşaatı"
 NORDIC_naval_construction_desc:0 "Uzun bir denizcilik geleneğine ve dünya standartlarında denizcilere sahip olmak güzel ve iyi, ama onları düşmanlarımıza karşı kullanacak gemilerimiz yoksa hiçbir anlamı yok. Birlikte büyük bir filo inşa edelim ve bizi tehdit eden herhangi bir ülkeyi ezmek için kullanalım."
 NORDIC_naval_engineering:0 "Deniz Mühendisliği"
 NORDIC_naval_engineering_desc:0 "ÇEVİRİLECEK_İSKANDİNAV"
 NORDIC_naval_exercises:0 "Deniz Tatbikatları"
 NORDIC_naval_exercises_desc:0 "Uluslarımızın hepsinin yüzyıllar öncesine dayanan bir denizcilik mirası var, Baltık ve Kuzey Atlantik kültürümüzü ve yaşam tarzlarımızı şekillendirdi, ancak herhangi bir denizci ulusun bildiği gibi, deniz aynı anda hem bir hendek hem de bir otoyol olabilir. Denizden nasıl savunma ve saldırı yapacağımızı öğrenelim."
 NORDIC_naval_officer_academy:0 "Deniz Subay Akademisi"
 NORDIC_naval_officer_academy_desc:0 "İyi bir subay, deniz savaşında çoğu diğer muharebe türünden daha fazla önem taşır. Gemileri ve görev güçlerini yöneten subaylar hiyerarşisinden koordinasyon olmadan tek bir denizcinin yapabileceği pek bir şey yoktur. Bu adamları zor seçimler yapmak ve birlikte çalışmak için eğitmek son derece önemlidir."
 NORDIC_naval_research_institute:0 "Deniz Araştırma Enstitüsü"
 NORDIC_naval_research_institute_desc:0 "Düşmanlarımıza yetişmek bizim için yeterli olmayacak, daha önce olduğumuz gibi Deniz teknolojisinin ön saflarında olmalıyız. Bölgemizin keşif ve deniz hakimiyeti mirasını kucaklayalım."
 NORDIC_nordic_airforce:0 "[NORDIC_get_nordic_airforce_name]"
 NORDIC_nordic_airforce_communist:0 "Kuzey Halk Hava Komiserliği"
 NORDIC_nordic_airforce_democratic:0 "İskandinav Hava Savunma Programı"
 NORDIC_nordic_airforce_desc:0 "Gökyüzü ittifakımızın yeni cephesidir. [NORDIC_get_nordic_airforce_desc]"
 NORDIC_nordic_airforce_desc_com:0 "Kapitalizm güçlerinin, hepimizin eşit olarak paylaşması gereken özgürlük örneğini ele geçirmesine izin veremeyiz. Hava kuvvetlerimiz düşmanlarımızın gökyüzünü saracak ve üzerlerine bir cehennem ateşi yağmuru yağdıracaktır."
 NORDIC_nordic_airforce_desc_dem:0 "İşte bu yüzden [NORDIC_get_nordic_airforce_name], [NORDIC_get_alliance_name]'daki her ulusumuzun vatandaşlarını korumak için gerekli kaynakları yönetecektir. Ayrıca hava kuvvetlerimizin birbirleriyle işbirliği yapmasını ve sorunsuz bir şekilde birlikte çalışmasını sağlayacaklardır."
 NORDIC_nordic_airforce_desc_mon:0 "Hava kabiliyetlerimizi geliştirirsek, gücümüzü daha iyi yönlendirebiliriz. Birleşik hava kuvvetlerimizin gücü önünde düşmanlarımızı eğilmeye zorlayacağız."
 NORDIC_nordic_airforce_monarchist:0 "Birleşik Kraliyet Hava Kuvvetleri"
 NORDIC_nordic_army:0 "[NORDIC_get_nordic_army_name]"
 NORDIC_nordic_army_communist:0 "Kuzey Halk Ordusu"
 NORDIC_nordic_army_democratic:0 "Kara Operasyonları Departmanı"
 NORDIC_nordic_army_desc:0 "[NORDIC_get_nordic_army_desc]"
 NORDIC_nordic_army_desc_com:0 "Hangi ulustan gelirlerse gelsinler, [NORDIC_get_nordic_army_name]'daki tüm askerler [NORDIC_get_alliance_name]'ın bir parçasıdır ve birleşik gücümüz ve amansız irademizle kapitalizm yok edilene kadar yürüyeceklerdir."
 NORDIC_nordic_army_desc_dem:0 "[NORDIC_get_nordic_army_name]'nin rolü, demokrasilerimizdeki farklı kara kuvvetlerinin tamamlayıcı bir şekilde çalışması için parametreler oluşturmak olacaktır. Böylece birinin güçlü yönleri diğerlerinin zayıf yönlerini dengeleyecek ve kıta genelindeki baskıyı her seferinde bir il olmak üzere ortadan kaldırma hedefiyle."
 NORDIC_nordic_army_desc_mon:0 "[NORDIC_get_alliance_name] kuvvetleri sadece ordular değildir, çok daha fazlasıdır. [NORDIC_get_nordic_army_name], hükümdarları ve temsil ettikleri topraklar için tek bir bayrak altında cesurca savaşacaktır."
 NORDIC_nordic_army_monarchist:0 "Yürüyen Aslanlar"
 NORDIC_nordic_construction_developments:0 "İskandinav İnşaat Gelişmeleri"
 NORDIC_nordic_construction_developments_desc:0 "[NORDIC_get_alliance_name]'da yapılacak çok şey var ve kıyamet saati gelmeden önce az zaman var. Uluslarımızın gelişiminde hız kazanmak için ihtiyacımız olan iyileştirmeleri bulmak için birlikte çalışmak zorunda kalacağız."
 NORDIC_nordic_electronics:0 "İskandinav Elektroniği"
 NORDIC_nordic_electronics_desc:0 "Elektronik burada ve gelecekte savaşın belirleyici faktörü olabilir, elektronik silahlanma yarışında düşmanımızın bizi yenmesine izin veremeyiz. Bu yeni gücün bizim tarafımızda olması için bu elektronikleri birlikte geliştirelim."
 NORDIC_nordic_industry:0 "[NORDIC_get_nordic_industry_name]"
 NORDIC_nordic_industry_communist:0 "Kilit Adımlarla İşçiler"
 NORDIC_nordic_industry_democratic:0 "İskandinav Sanayi Geliştirme Fonu"
 NORDIC_nordic_industry_desc:0 "[NORDIC_get_nordic_industry_desc]"
 NORDIC_nordic_industry_desc_com:0 "İşçiler [NORDIC_get_alliance_name]'ın can damarıdır ve var olma nedenidir. [NORDIC_get_nordic_industry_name] ile günlük yaşam için malları üretme araçlarına katılımı ve savaş zamanında savaş makinemizi desteklemeyi garanti edebiliriz."
 NORDIC_nordic_industry_desc_dem:0 "Savaşla veya savaşsız, uluslarımız sivil nüfusumuzu desteklemek ve yaşam kalitelerini artırmak için gereken altyapıyı ve sermayeyi inşa etmelidir. Elbette, savaş zamanı geldiğinde, savaş ekonomimizin hayati bir temel taşı olacaktır."
 NORDIC_nordic_industry_desc_mon:0 "Noblesse Oblige kavramı, tebaamıza bakmamızı ve sadece onların lütfunu kazanmakla kalmayıp, savaş zamanlarında savaş ekonomimizin temeli olacak bir altyapı inşa etmemizi gerektirir. [NORDIC_get_nordic_industry_name] artık ihtiyaç duyulmayana kadar bu rolü yerine getirecektir."
 NORDIC_nordic_industry_monarchist:0 "Kraliyet Geliştirme Enstitüsü"
 NORDIC_nordic_military_industry:0 "[NORDIC_get_nordic_military_industry_name]"
 NORDIC_nordic_military_industry_communist:0 "Kuzey Halk Silah Üretimi"
 NORDIC_nordic_military_industry_democratic:0 "İskandinav Malzeme Tedariki"
 NORDIC_nordic_military_industry_desc:0 "[NORDIC_get_nordic_military_industry_desc]. Eğer son adamımıza kadar savaşıyorsak, o zaman bu adamlar doğru araçlarla daha büyük bir darbe indirecektir."
 NORDIC_nordic_military_industry_desc_com:0 "Devrim kendini savunmayacak ve aynı şekilde [NORDIC_get_alliance_name]'ımızın zaten özgürleşmiş işçilerinden güçlü bir itme olmadan yayılmayacaktır."
 NORDIC_nordic_military_industry_desc_dem:0 "[NORDIC_get_nordic_industry_name] Programı, savaş makinemizin işlemesi için gereken dişlilerle her zaman tedarik edilmesini sağlamak ve uluslarımızı terör ve tiranlıktan korumak için kurulacaktır."
 NORDIC_nordic_military_industry_desc_mon:0 "Modern zamanlarımızda, krallıklar sağda solda yıkılıyor ve bir kraliyet ailesinin ruhu tek başına onu unutulmaktan kurtaramayacak. Krallıklarımızın yok oluşuyla savaşmak için gerekli silahlara sahip olduğundan emin olmalıyız."
 NORDIC_nordic_military_industry_monarchist:0 "Kraliyet Silah Fabrikaları"
 NORDIC_nordic_mio:0 "İskandinav Askeri Sanayi Kuruluşu"
 NORDIC_nordic_mio_desc:0 "ÇEVİRİLECEK_İSKANDİNAV"
 NORDIC_nordic_navy:0 "[NORDIC_get_nordic_navy_name]"
 NORDIC_nordic_navy_communist:0 "Kuzey Deniz Komiserliği"
 NORDIC_nordic_navy_democratic:0 "Deniz Koordinasyon Komutanlığı"
 NORDIC_nordic_navy_desc:0 "[NORDIC_get_nordic_navy_desc]"
 NORDIC_nordic_navy_desc_com:0 "Dalgalar halka aittir ve [NORDIC_get_alliance_name] onu kuzey halkı için kurtarmaya ve talep etmeye kararlıdır. [NORDIC_get_nordic_navy_name], düşmanlarımızın son göreceği şeyin kızıl bir ufukta yükselen gemilerimiz olmasını sağlayacaktır."
 NORDIC_nordic_navy_desc_dem:0 "Denizlerin enginliği ülkelerimizi tek tek cüceleştirir, ancak güçlerimizi birleştirirsek operasyonlarımızı koordine edebilir ve sınırlı kaynaklarımızı kendi ağırlığımızın üzerinde yumruk atmak için daha verimli bir şekilde harcayabiliriz. Bu, [NORDIC_get_nordic_navy_name]'daki temsilcilerin görevi olacak, kesinlikle zorlu bir görev, ancak arkalarında [NORDIC_get_alliance_name]'ın tüm kaynakları ve desteği olacak."
 NORDIC_nordic_navy_desc_mon:0 "[NORDIC_get_alliance_name]'ın birleşik donanmaları, tüm egemenlik alanlarımızda dalgalara hükmedecektir. [NORDIC_get_nordic_navy_name], geriye sadece gemi enkazları kalana kadar düşmanlarımızı dövecek bir gelgit olacaktır."
 NORDIC_nordic_navy_monarchist:0 "Kraliyet Armadası"
 NORDIC_nordic_research:0 "[NORDIC_get_nordic_research_name]"
 NORDIC_nordic_research_communist:0 "Kuzey Halk Üniversitesi"
 NORDIC_nordic_research_democratic:0 "İskandinav Araştırma Konseyi"
 NORDIC_nordic_research_desc:0 "Sadece güç savaşları kazandırmaz. Teknolojik gelişmeler, 20. yüzyıl uluslarına modern savaşta avantaj sağlayan şeydir. [NORDIC_get_nordic_research_desc]"
 NORDIC_nordic_research_desc_com:0 "[NORDIC_get_nordic_industry_name], en son imha araçlarını geliştirecek ve en iyi araçları seri üretecek enstitü olacaktır, böylece halkımızın elinde faşizmin ve kapitalizmin başları üzerinde giyotin olabilirler."
 NORDIC_nordic_research_desc_dem:0 "[NORDIC_get_nordic_industry_name], askerlerimizin ve generallerimizin savaşın zorluklarıyla başa çıkmak için en iyi araçlara sahip olmaları için sermayeyi ve kaynakları doğru ellere teslim edecektir. İleri teknoloji, vatandaşlarımızın kanını boş yere dökülmekten koruyacaktır."
 NORDIC_nordic_research_desc_mon:0 "Kuzeydeki krallıklar her zaman bilimin ilerlemesi için alan sağlamıştır ve [NORDIC_get_nordic_industry_name] bu geleneği sürdürecek, krallıklarımızın en iyi beyinlerini tek bir binada birleştirecek, birbirlerine yardım ederek tüm efendilerine hizmet edeceklerdir."
 NORDIC_nordic_research_monarchist:0 "Birleşik Kraliyet Akademileri"
 NORDIC_nordic_rocketry:0 "İskandinav Roketçiliği"
 NORDIC_nordic_rocketry_desc:0 "Ya bombalarımız bir uçağın müdahalesi olmadan teslim edilebilseydi? Kendi kendine ilerleyen silahlar gelecektir, eğer istersek [NORDIC_get_alliance_name]'ın konforundan düşmanı yok edebiliriz."
 NORDIC_nordic_tank_platform:0 "İskandinav Tank Platformu"
 NORDIC_nordic_tank_platform_desc:0 "ÇEVİRİLECEK_İSKANDİNAV"
 NORDIC_nordic_university:0 "İskandinav Üniversitesi"
 NORDIC_nordic_university_desc:0 "ÇEVİRİLECEK_İSKANDİNAV"
 NORDIC_northern_command:0 "Kuzey Komutanlığı"
 NORDIC_northern_command_desc:0 "Eylemlerimizi daha iyi koordine edebilmek için ortak bir askeri komuta şarttır. Silahlı kuvvetlerin birlikte sorunsuz çalışması ve kararların hızlı ve tüm tarafların çıkarı gözetilerek alınması gerekiyor. Ortak silahlı kuvvetlerimiz için daha fazla plan yapılabilmesi için böyle bir komutanlığın kurulmasını sağlamalıyız."
 NORDIC_nuclear_production:0 "Nükleer Üretim"
 NORDIC_nuclear_production_desc:0 "Artık atomu parçalama bilgisine sahip olduğumuza göre, onu da kullanabiliriz. Ama önce, savaşın gidişatını lehimize çevirmek için yeterli miktarda üretmek için gereken malzemeleri ve altyapıyı üretmeliyiz."
 NORDIC_nuclear_research:0 "Nükleer araştırma"
 NORDIC_nuclear_research_desc:0 "Bilim adamları, atomun parçalanması nihayet silah haline getirildiğinde üzerimize inecek olan yeni dünya hakkında ağızlarını kapalı tutamıyorlar. Neden tek bir darbeyle savaşa son verebilecek bu teknolojik mucizeden mahrum kalalım."
 NORDIC_open_up_land_for_construction:0 "İnşaat için Arazi Aç"
 NORDIC_open_up_land_for_construction_desc:0 "ÇEVİRİLECEK_İSKANDİNAV"
 NORDIC_overwhelming_numbers:0 "Ezici Sayılar"
 NORDIC_overwhelming_numbers_desc:0 "ÇEVİRİLECEK_İSKANDİNAV"
 NORDIC_political_cooperation:0 "Siyasi İşbirliği"
 NORDIC_political_cooperation_desc:0 "Boş laf, gerçekten birlikte çalışmak için yeterli olmayacaktır. Eğer gerçekten hesaba katılması gereken bir güç olmak istiyorsak, tüm sistemlerimizin daha büyük, iyi yağlanmış bir makinenin dişlileri olması gerekiyor."
 NORDIC_procurement_fund:0 "Tedarik Fonu"
 NORDIC_procurement_fund_desc:0 "Büyük ekonomik ve askeri güçler, savunma ve fetih araçlarını üretme kapasitesine sahiptir ve yerli bir askeri sanayimiz olsa da, sönük kalmaktadır. Bu endüstriyel güce henüz yetişemeyebiliriz, ancak savunmamız için hayati önem taşıyan büyük miktarda silah ve araç temin etmek için fonlarımızı bir araya getirebiliriz."
 NORDIC_radar_expansion:0 "Radar Genişlemesi"
 NORDIC_radar_expansion_desc:0 "ÇEVİRİLECEK_İSKANDİNAV"
 NORDIC_railway_expansion:0 "Demiryolu Genişlemesi"
 NORDIC_railway_expansion_desc:0 "Demiryolları uluslarımızın atardamarlarıdır ve şimdi her zamankinden daha fazla bu ulaşım yollarına olabildiğince yaygın bir şekilde ihtiyacımız var. Şimdi amaçta birleştiğimize göre, lokomotiflerin çeliği ve hızıyla fiziksel olarak birleşmeliyiz."
 NORDIC_reaching_out_to_our_neighbors:0 "Komşularımıza Ulaşma"
 NORDIC_reaching_out_to_our_neighbors_desc:0 "ÇEVİRİLECEK_İSKANDİNAV"
 NORDIC_research_investments:0 "Müşterek Araştırma Yatırımları"
 NORDIC_research_investments_desc:0 "Yeni ittifakımız diğerlerinden daha sıkıdır, teknolojik ilerlemelerimizi kendimize saklamamız için bir neden yok. Savaş araçlarımızın düşmanlarımızı kesmek için ihtiyaç duydukları avantaja sahip olmaları için araştırmalarımızı paylaşalım."
 NORDIC_research_tech_sharing_name:0 "İskandinav Araştırma Enstitüsü"
 NORDIC_second_institution:0 "[NORDIC_get_institution_2_name]"
 NORDIC_second_institution_desc:0 "İttifakımız her zamankinden daha yakın ve daha iç içe, ama bu aynı zamanda bir birim olarak hantal ve yavaş olduğu anlamına da geliyor. [NORDIC_get_institution_2_name]'ı kurarak [NORDIC_get_institution_2_desc] "
 NORDIC_second_institution_desc_com:0 "işçilerin iradesinin temsil edileceğinden emin olabiliriz, çoğu kişiyi temsil eden az sayıda insan kesinlikle proletaryanın en iyi çıkarları doğrultusunda hareket edecektir."
 NORDIC_second_institution_desc_dem:0 "uluslarımızın seçmenlerini temsil eden ve savaş karşısında hızla hareket etme yürütme yetkisine sahip bir yasama organına sahip olabiliriz."
 NORDIC_second_institution_desc_mon:0 "birleşik krallıklarımızın en güçlü lordlarını ve leydilerini toplayabiliriz, böylece soyluluğun yükü olan zorlu uzlaşmaları cesurca ve kararlılıkla alabilirler."
 NORDIC_second_selector_left:0 "[NORDIC_get_second_selector_left]"
 NORDIC_second_selector_left_desc:0 "ÇEVİRİLECEK_İSKANDİNAV"
 NORDIC_second_selector_right:0 "[NORDIC_get_second_selector_right]"
 NORDIC_second_selector_right_desc:0 "ÇEVİRİLECEK_İSKANDİNAV"
 NORDIC_shared_intelligence:0 "Paylaşılan İstihbarat"
 NORDIC_shared_intelligence_desc:0 "[NORDIC_get_alliance_name]'ın tüm projesi, gücümüzü paylaşma etrafında dönüyor ve eğer bilgi gerçekten güce eşitse, o zaman düşmanlarımız hakkında bildiklerimizi ve düşmanlarımızın bizim hakkımızda bildiklerini ve hatta hakkımızda bildiklerini düşündükleri şeyleri paylaşalım."
 NORDIC_standarized_parts:0 "Standartlaştırılmış Parçalar"
 NORDIC_standarized_parts_desc:0 "Artık tek vücut olduğumuza göre, fabrikalarımızın mümkün olan en kısa sürede hızlanabilmesi için standartlarımızı birbirimizle paylaşmaktan faydalanabiliriz. Teçhizat ve parçalar değiştirilebilir hale gelebilir, bu da üretimimizi önemli ölçüde kolaylaştırır."
 NORDIC_strengthen_ties:0 "Bağları Güçlendir"
 NORDIC_strengthen_ties_desc:0 "ÇEVİRİLECEK_İSKANDİNAV"
 NORDIC_submarine_cooperation:0 "Denizaltı İşbirliği"
 NORDIC_submarine_cooperation_desc:0 "Düşmanın deniz yoluyla asker ve ikmal taşıma yeteneğini reddederek, savaşı zaten yarı yarıya kazanmış oluruz. Bunu sağlamanın en iyi yolu, son teknoloji denizaltılar üretmek için ortaklaşa çalışmaktır."
 NORDIC_superior_ships:0 "Üstün Gemiler"
 NORDIC_superior_ships_desc:0 "ÇEVİRİLECEK_İSKANDİNAV"
 NORDIC_support_training_collaboration:0 "Destek Eğitimi İşbirliği"
 NORDIC_support_training_collaboration_desc:0 "ÇEVİRİLECEK_İSKANDİNAV"
 NORDIC_synthetic_refineries:0 "Sentetik Rafineriler"
 NORDIC_synthetic_refineries_desc:0 "ÇEVİRİLECEK_İSKANDİNAV"
 NORDIC_tank_development:0 "Tank Geliştirme"
 NORDIC_tank_development_desc:0 "ÇEVİRİLECEK_İSKANDİNAV"
 NORDIC_the_eastern_front:0 "Doğu Cephesi"
 NORDIC_the_eastern_front_desc:0 "ÇEVİRİLECEK_İSKANDİNAV"
 NORDIC_the_nordic_march:0 "İskandinav Yürüyüşü"
 NORDIC_the_nordic_march_desc:0 "ÇEVİRİLECEK_İSKANDİNAV"
 NORDIC_the_southern_front:0 "Güney Cephesi"
 NORDIC_the_southern_front_desc:0 "ÇEVİRİLECEK_İSKANDİNAV"
 NORDIC_to_arms_against_tyranny:0 "Tiranlığa Karşı Silah Başına"
 NORDIC_to_arms_against_tyranny_desc:0 "ÇEVİRİLECEK_İSKANDİNAV"
 NORDIC_unified_recruitment:0 "Birleşik Asker Alımı"
 NORDIC_unified_recruitment_desc:0 "Asker alım çabalarımızı standartlaştırmanın bir yolunu bulmalı ve süreci hızlandırmalıyız ki daha fazla adamımız mümkün olan en kısa sürede askerlik şubesinden cepheye ulaşabilsin."
 NORDIC_unified_recruitment_propaganda:0 "Birleşik Asker Alım Propagandası"
 NORDIC_unified_recruitment_propaganda_desc:0 "ÇEVİRİLECEK_İSKANDİNAV"
 NOR_a_new_norway:0 "Yeni Bir Norveç"
 NOR_a_new_norway_desc:0 "Norveç halkı nihayet sermayenin boyunduruğundan kurtuldu ve bu gerçek, yeni ülkemiz şekillenirken temsil edilmelidir. Artık oligarklar ve kodamanlar ülkenin yönünü belirlemeyecek, bundan sonra Norveç halkı kendi geleceğinin sorumlusudur. Yeni bir Norveç ve ötesi için!"
 NOR_a_resurgent_labor_movement:0 "Yeniden Canlanan Bir İşçi Hareketi"
 NOR_a_resurgent_labor_movement_desc:0 "[NOR.GetName] halkı artık kapitalizmin göz bağlarını kabul etmiyor. Nihayet gerçeği görüyorlar, efendileri tarafından kurulan yoksulluk içinde yavaş yavaş boğuluyorlardı. Şimdi başlarını suyun üzerine kaldırıyorlar ve ufuklarında bir devrim görüyorlar!"
 NOR_a_valuable_partner_to_germany:0 "[GetNorwegianFascistOverlord] için Değerli Bir Ortak"
 NOR_a_valuable_partner_to_germany_desc:0 "Bu ulusun başarısı, özünde [GetNorwegianFascistOverlord]'ninkine bağlıdır. Onlara ne kadar çok yardım edebilirsek, onlar da bizi o kadar çok savaş ganimetiyle ödüllendirirler. Kendimizi [NOR.GetNAme]'ı vazgeçilmez bir ortağa dönüştürebilecek bir yola yönlendirmeliyiz."
 NOR_a_warden_king:0 "Bir Muhafız Kral"
 NOR_a_warden_king_desc:0 "Bir kralın görevi, hayır, onun ayrıcalığıdır, yukarıdaki güçler tarafından kendisine verilen toprakları savunmaktır. Bırakın silahlı kuvvetler, kral yükselip onu kullanmayı seçene kadar uykuda olan mutlak kraliyet gücünün kılıcı olsun."
 NOR_abandoning_nynorsk:0 "Nynorsk'u Terk Etmek"
 NOR_abandoning_nynorsk_desc:0 "Görünüşte milliyetçi amacına rağmen, Nynorsk sadece kırsal ücra köşelerden ve şehir lehçelerinden kalan birçok artıkla birleştirilmiş bir dildir. Çoğu [NOR.GetAdjective]'in zaten yazdığı ve okuduğu dile odaklanmak daha iyi olur. Azınlık dili konuşanlar sadece bizim düzenimize uyum sağlamak zorunda kalacaklar."
 NOR_aluminum_production:0 "Alüminyum Üretimi"
 NOR_aluminum_production_desc:0 "Alüminyum üretimi son derece güç yoğun bir süreçtir ve boksit yataklarımız olmasa da, [ROOT.GetAdjective] topoğrafyası hidroelektrik üretimi için idealdir, bu yüzden kolayca boksit ithal edebilir ve onu yeni başlayan askeri sanayimiz için değerli bir kaynağa dönüştürebiliriz."
 NOR_anti_air_artillery_research:0 "Uçaksavar Topçu Araştırması"
 NOR_anti_air_artillery_research_desc:0 "Yukarıdaki havada yeni teknolojiler konuşlandırıldıkça, hava sahamızı yerden savunmamızı sağlayan silahlar da onlarla eşleşmelidir ki düşmanın hava üstünlüğüne yenik düşmeyelim."
 NOR_anti_air_construction:0 "Uçaksavar İnşaatı"
 NOR_anti_air_construction_desc:0 "Engebeli arazimiz [NOR.GetName]'ı düşman işgali için zor bir hedef haline getiriyor, ancak gökyüzümüz düşman uçaklarına açık, bu da onları potansiyel bir yabancı işgal için bir avantaj haline getiriyor. Bunu önlemek için gerekli uçaksavar bataryalarını inşa etmeliyiz."
 NOR_anti_air_support:0 "Uçaksavar Desteği"
 NOR_anti_air_support_desc:0 "İstilacı nereden gelirse gelsin, bir şey kesindir, gökyüzünün kontrolünü ele geçirmek ve şehirlerimizi ve birliklerimizi bombalamak için uçaklarını kullanmaya çalışacaklardır. Bu, havadan herhangi bir girişimi etkisiz hale getirmek için uçaksavar savunmaları kurmadığımız sürece geçerlidir."
 NOR_appoint_prince_olav_to_army_staff:0 "Prens Olav'ı Ordu Kurmaylığına Ata"
 NOR_appoint_prince_olav_to_army_staff_desc:0 "Artık kraliyet ailesi projemize destek verdiğine göre, onların becerilerinden yararlanmalı ve hepsini Krallığımızı savunma görevine vermeliyiz. Prens Olav'ı ordunun liderliğine atarsak, tam eğitimini ve deneyimini kullanmasını ve karadaki düşmanlarımızla başa çıkmasını garanti edebiliriz."
 NOR_approach_kretsen:0 "Kretsen'e Yaklaş"
 NOR_approach_kretsen_desc:0 "İşgal altındaki toprağımızda yaşayan, savaştan önce Nygaardsvold Hükûmeti'ne karşı olan ancak şimdi bizimle ortak bir düşmanı paylaşan önde gelen [NOR.GetAdjective]lar var. Grimelund çiftliğinde gizlice buluşan bu yargıçlar, yöneticiler, müdürler ve işadamları, eğer bize nüfuzlarını ödünç verirlerse direniş çabalarımızda hayati önem taşıyabilir."
 NOR_approach_the_coordinating_committee:0 "Koordinasyon Komitesine Yaklaş"
 NOR_approach_the_coordinating_committee_desc:0 "Topraklarımız düşmanın elinde kalırken, gölgelerde çalışacak ve küçük sivil gruplarımızı işgale gizlice direnmeleri için organize edecek bir örgüte ihtiyaç var. Koordinasjonskomiteen'in çeşitli profesyonellerinin işi halledeceğine güveniyoruz."
 NOR_approach_the_fatherland_league:0 "Vatan Ligi'ne Yaklaş"
 NOR_approach_the_fatherland_league_desc:0 "Yıllardır Vatan Ligi, Norveç'te muhafazakâr gündemi zorladı, ancak bizim itkimizden ve kararlılığımızdan yoksundular. Onlara ne kadar uyumlu olduğumuzu ve Komünizme karşı ortak hedeflerimize ulaşmak için güçlerimizi nasıl birleştirebileceğimizi gösterebiliriz."
 NOR_arrest_quisling:0 "Quisling'i Tutukla"
 NOR_arrest_quisling_desc:0 "[NOR.GetName]'daki tehlikeli bireylerin bir listesi derlendiğinde, eski Savunma Bakanı Vidkun Quisling nadiren ortaya çıkar. Partisi zayıflıyor, arkadaşları az ve her şeyden önce, Adolf Hitler'e olan körü körüne tapınması -ki bu durum başka birini herhangi bir ülke için tehlikeli yapardı- onu daha da acınası gösteriyor. Ancak, önemsizliğine bakılmaksızın, tedbiri elden bırakmamak iyidir."
 NOR_artillery_development:0 "Topçu Geliştirme"
 NOR_artillery_development_desc:0 "Büyük Savaş, topçunun önemini kanıtladı, zaten olduğumuzdan daha fazla geride kalmamıza izin veremeyiz, yoksa düşman mermilerine karşı güçsüz kalma riskine gireriz."
 NOR_ask_for_foreign_support:0 "Yabancı Destek İste"
 NOR_ask_for_foreign_support_desc:0 "Krallığımızın hiçbir zaman büyük bir faşist destek tabanı olmadığı için, yurtdışındaki Faşist kardeşlerimizin desteğine ihtiyacımız var. Onların yardımıyla [NOR.GetName]'a Pan-Cermen bir Faşist imparatorluğa giden yolu gösterebiliriz."
 NOR_assure_the_population:0 "Nüfusu Temin Et"
 NOR_assure_the_population_desc:0 "[ROOT.GetName]'ın kıyamete doğru sürüklendiği gibi görünebilir, ancak Kraliyet Şansölyesi, Kral VII. Haakon adına, halkın monarşinin toprağı yeniden istikrara kavuşturmak için sağlam bir el tutacağını bilmesini istiyor."
 NOR_bail_out_towns:0 "Kasabaları Kurtar"
 NOR_bail_out_towns_desc:0 "[ROOT.GetName] genelindeki birçok küçük kasaba ekonomik krizden etkilendi. Kendi başlarına asla üstesinden gelemeyecekleri muazzam bir borç yükü altında acı çekiyorlar. Bu toplulukları kurtarmak ve onları refah yoluna koymak için araçlara ve iradeye sahibiz, o yüzden kullanalım."
 NOR_battleship_focus:0 "Savaş Gemisi Odaklanması"
 NOR_battleship_focus_desc:0 "Sadece devasa, zırhlı kütleler dalgalara gerçekten hükmettiğimizi garanti edebilir. Kıyılarında savaş gemilerimizden birini görme tehdidi, potansiyel herhangi bir işgalciyi caydıracaktır."
 NOR_bjarmeland:0 "Bjarmeland"
 NOR_bjarmeland_desc:0 "[ROOT.GetAdjective] kaşifleri yüzyıllardır mümkün olanın ve ulaşılabilir olanın sınırlarını genişletti. Böyle bir vaka, ilk olarak [NOR.GetAdjective]lar tarafından keşfedilen ve şimdi bizim elimizde olmayan Bjarmeland'dır. Bir kez daha uzanıp bu toprağı kendimiz için almalıyız."
 NOR_bring_back_quisling:0 "Quisling'i Geri Getir"
 NOR_bring_back_quisling_desc:0 "Birçoğu onu bilgisiz bir soytarı olarak görüyor, ancak Quisling'in iktidara yükselişi, sözde başarısızlıklarının arkasında kurnazca bir plan olduğunu ima ediyor. [NOR.GetName]'ı eski vikingler gibi yeni ve bereketli topraklara yönlendirmek için dümende olması gereken adam bu türden bir adamdır."
 NOR_broken_gun_policies:0 "Kırık Tüfek Politikaları"
 NOR_broken_gun_policies_desc:0 "Gelecekteki herhangi bir çatışmayı önlemek için, sadece tarafsızlık aradığımızı ve yabancı bir ülkeyi işgal etmeye hazırlanmadığımızı kanıtlamalıyız. Ancak o zaman büyük güçler bizi bir tehdit olarak görmeyecek ve ülkemizi rahat bırakacaktır. [SWI.GetAdjective] ve onların aptalca Silahlı Tarafsızlık Doktrini'nin ne düşündüğüne bakılmaksızın, bunun ancak kapsamlı bir askerden arındırma yoluyla elde edilebileceğine inanıyoruz."
 NOR_build_supplies_network:0 "İkmal Ağı Kur"
 NOR_build_supplies_network_desc:0 "Nefes kesen dağlarımız, göllerimiz ve fiyortlarımız dünyanın gıpta ettiği yerlerdir, ancak aynı zamanda malzeme taşımayı da zorlaştırırlar. Malzemelerin cephelerimize daha hızlı ulaşması için bilinçli bir çaba göstermeliyiz."
 NOR_build_the_northern_rail:0 "Kuzey Demiryolunu İnşa Et"
 NOR_build_the_northern_rail_desc:0 "Ülkemizin kuzey kısmı çok uzun süredir ihmal edildi. Arazi altyapı inşa etmeyi karmaşık bir çaba haline getirse de, gelecekte kesinlikle karşılığını verecek bir çaba olduğundan eminiz."
 NOR_building_an_independent_norway:0 "Bağımsız bir Norveç İnşa Etmek"
 NOR_building_an_independent_norway_desc:0 "[ROOT.GetAdjective] ulusu, mevcut, bağımsız haliyle, sadece 1905'ten beri var olmuştur, bu yüzden yapılacak çok ulus inşa etme işi var, özellikle de bağımsızlığımız için hayati olacak olan sanayimizde."
 NOR_buy_aa_from_sweden:0 "İsveç'ten Uçaksavar Al"
 NOR_buy_aa_from_sweden_desc:0 "Doğudaki komşumuz [SWE.GetName], uzun zamandır Uçaksavar silahları üretiminde bizim yapabileceğimiz her şeyin çok ötesinde başarılı olmuştur. Yaklaşan işgal sırasında gökyüzümüzü savunmak için bu Bofors silahlarını satın alma talebiyle onlara yaklaşabiliriz."
 NOR_claims_on_denmark:0 "Danimarka Üzerindeki Hak İddiaları"
 NOR_claims_on_denmark_desc:0 "[NOR_GetDanishClaimsDesc]"
 NOR_claims_on_denmark_desc_fasc:0 "[DEN.GetNonIdeologyName] hükümdarları eskiden efendilerimizdi, ama bir daha asla. Artık zayıf ve önemsizler, bu yüzden toprak bizim almamız için orada. Yeni bulduğumuz güçle, askeriyeleri bir çocuğun elindeki tereyağlı kurabiye gibi ufalanacak!"
 NOR_claims_on_denmark_desc_mon:0 "Danimarka, sevgili kralımızın evi olarak adlandırdığı toprak olabilir, ancak onun gerçek evinin her zaman [NOR.GetNonIdeologyName] olduğunu biliyoruz, taç için seçilmeden önce bile. Ne olursa olsun, eski ülkesini Krallığına katmalıyız, belki bu onu Monarşimizin hükûmetinde daha aktif bir rol oynamaya motive eder."
 NOR_claims_on_faroe_islands:0 "Faroe Adaları Üzerindeki Hak İddiaları"
 NOR_claims_on_faroe_islands_desc:0 "[NOR_GetFaroeClaimsDesc]"
 NOR_claims_on_faroe_islands_desc_ALT:0 "[DEN.GetNonIdeologyName] ve [SWE.GetNonIdeologyName] monarşilerinin geçmişteki ihlalleri sonucunda Faroe Adaları bizden mahrum bırakılmıştır. Bu artık sona eriyor. Erdemli Kraliçemiz I. Mathilde, bize geri dönmelerini sağlamak için kan bedelini ödeyecektir."
 NOR_claims_on_faroe_islands_desc_PAWJ:0 "[DEN.GetNonIdeologyName] ve [SWE.GetNonIdeologyName] monarşilerinin geçmişteki ihlalleri sonucunda Faroe Adaları bizden mahrum bırakılmıştır. Bu artık sona eriyor. Soylu Mabeyincimiz, bize geri dönmelerini sağlamak için kan bedelini ödeyecektir."
 NOR_claims_on_ireland:0 "İrlanda Üzerinde Hak İddiaları"
 NOR_claims_on_ireland_desc:0 "Bir zamanlar atalarımızın yerleştiği ve Duibhlinn adını verdiği sadece kara bir lagündü. Bu görünüşte önemsiz yerden birçok Viking gelişti, baskın yaptı ve Gal kabileleriyle karıştı. Eminiz ki onu geri almamıza aldırmazlar, sözle ya da zorla."
 NOR_claims_on_scotland:0 "İskoçya Üzerinde Hak İddiaları"
 NOR_claims_on_scotland_desc:0 "Birleşik Krallık'ın bir parçası olmadan önce, İskoçya sadece atalarımızın arka bahçesiydi. Onu, viking köklerini zar zor zapteden o zayıf ellerden geri alalım ve bir kez daha Kuzey Britanya'nın kıyılarında ve dağlarında dolaşalım."
 NOR_coastal_defense:0 "Kıyı Savunması"
 NOR_coastal_defense_desc:0 "[NOR.GetName], dünyanın en uzun kıyı şeritlerinden birine sahiptir, bu yüzden onu güçlendirmek göz korkutucu bir görev olacaktır, ancak yakın zamanda bulduğumuz bağımsızlığımızı koruyacaksak bu yapılmalıdır."
 NOR_complete_the_sourthern_railway_network:0 "Güney Demiryolu Ağını Tamamla"
 NOR_complete_the_sourthern_railway_network_desc:0 "[ROOT.GetNonIdeologyName]'ın güney kısmı kuzey kısmından fersah fersah daha gelişmiş olsa bile, altyapısını diğer ülkelerdekiyle, hatta komşu olanlarla karşılaştırmaya başlarsak, yapılacak çok şey olduğu açıktır."
 NOR_compromise_with_the_nkp:0 "NKP ile Uzlaş"
 NOR_compromise_with_the_nkp_desc:0 "Ulusumuzun güvenliği bir uçurumun kenarında sallanıyor gibi görünürken, belki de Norges Kommunistiske Parti ve onların Stalinizm ile köklü bağlarıyla bir uzlaşma, [SOU.GetNameDef]'nin yardımını güvence altına almamıza yardımcı olabilir. Bu kesinlikle Faşistlere veya Kapitalistlere boyun eğmekten daha tercih edilebilir bir gelecek."
 NOR_consolidate_kingdom:0 "Krallığı Pekiştir"
 NOR_consolidate_kingdom_desc:0 "[GetConsolidateKingdomDesc]"
 NOR_consolidate_kingdom_desc_PAWJ:0 "Şimdi lütufkâr Markiz Peder Anker Wedel-Jarlsberg'imiz, Kraliyet Mabeyincisi ve sevgili VII. Haakon'umuzun sağ kolu, tacımızın topraklarını genişlettiğine göre, kazanımlarımızı pekiştirmek ve tebaamızı yaldızlı ve istikrarlı, biraz sert de olsa bir elle yönetmek için içimize bakmalıyız."
 NOR_consolidate_kingdom_desc_alt:0 "Şimdi haklı kraliçemiz I. Mathilde, tacımızın geniş topraklarını görev bilinciyle denetlediğine göre, kazanımlarımızı pekiştirmek ve tebaamızı kadife eldivenler ve istikrarlı bir elle yönetmek için içimize bakmalıyız."
 NOR_consolidate_power:0 "Gücü Pekiştir"
 NOR_consolidate_power_desc:0 "Artık aradığımız geleceği güvence altına alacak güce sahip olduğumuza göre, onu elimizde tutabildiğimizden emin olma zamanı. Tasfiyeler ve yeni atamalar yoluyla, bu devleti başarılı olmamızı ve refaha ermemizi sağlayacak şekle sokacağız."
 NOR_contain_the_labor_movement:0 "İşçi Hareketini Kontrol Altına Al"
 NOR_contain_the_labor_movement_desc:0 "İşçi sınıfının çıkarlarına adanmış bir hareket olduğu sürece, [NOR.GetName]'a giren sermayeyi ve akışını sürdürme araçlarını asla tam olarak kontrol edemeyeceğiz."
 NOR_continue_nygaardsvold_government:0 "Nygaardsvold Hükûmetine Devam Et"
 NOR_continue_nygaardsvold_government_desc:0 "Johan Nygaardsvold liderliğindeki İşçi hükûmeti şimdiye kadar bize iyi hizmet etti, bu yüzden güneydeki komşularımızın siyasi gerilimlerine bakılmaksızın, çabalarımızı Norveç ekonomisini yaşadığımız ekonomik krizden çıkarmaya odaklamaya devam etmeliyiz."
 NOR_convert_merchant_ships:0 "Ticaret Gemilerini Dönüştür"
 NOR_convert_merchant_ships_desc:0 "Ticaret filomuz ekonomimizin gururudur, ancak işgalciler topraklarımızı yok ederse bize bir faydası olmayacaktır. Gemicilik kodamanlarımız [ROOT.GetName] için bir fedakarlık yapmak ve bu gemileri savaşa uygun hale getirmemize izin vermek zorunda kalacaklar."
 NOR_convoy_bombing:0 "Konvoy Bombalaması"
 NOR_convoy_bombing_desc:0 "Düşmanın ticaret filosu ne kadar küçük olursa, devasa filomuz o kadar etkili olabilir. Nakliyelerini baltalarsak, savaşın gidişatını değiştirebiliriz."
 NOR_convoy_defense:0 "Konvoy Savunması"
 NOR_convoy_defense_desc:0 "Ulusumuzun mücevheri devasa ticaret filosudur, bu yüzden onu boşa harcamaya dayanamayız, onu savunma çabalarımızı geliştirmeli, dayanmasını sağlamalı ve savaş üzerinde daha büyük bir etki yaratmalıyız."
 NOR_crackdown_on_civilian_life:0 "Sivil Yaşama Baskı"
 NOR_crackdown_on_civilian_life_desc:0 "Keyfi uğraşlar için zaman yok. Savaş burada ve bu yeni zamanlarda bu, savaşın ancak topyekûn olabileceği anlamına gelir, yoksa rejimimiz için ölüm ve onursuzlukla sonuçlanır. Sivil yaşam, anavatana hizmet lehine kısıtlanmalıdır."
 NOR_crush_big_communist:0 "[?GLOBAL.platonic_big_communist.GetNameDef]'i Ez"
 NOR_crush_hitler:0 "Hitler'i Ez"
 NOR_crush_hitler_desc:0 "Çok az insan Adolf Hitler kadar insanlığa karşı suç işlemiştir. Anlatılmamış sayıda hayatı yok etti ve kötülüğünün sınırı yok gibi görünüyor. Onun son oyunu, değer verdiğimiz her şeyin yok edilmesidir, bu yüzden o bizi bitirmeden önce onun planlarını biz bitirmeliyiz."
 NOR_crush_stalin:0 "[GetCrushStalinName]"
 NOR_crush_stalin_canonical:0 "Stalin'i Ez"
 NOR_crush_stalin_desc:0 "Yıllardır Iosif Stalin, Marx'ın ve Lenin'in sözlerini kendi çıkarı için çarpıttı, düşmanlarını uydurma mahkemelerde haksız yere mahkûm etti ve egosunu tatmin etmek için sayısız can feda etti. Proletaryanın geleceğini yok etmeden önce onu durdurmalıyız."
 NOR_crush_stalin_generic:0 "Kızıl Ayı'yı Ez"
 NOR_cultivate_the_conservative_parties:0 "Muhafazakâr Partileri Geliştir"
 NOR_cultivate_the_conservative_parties_desc:0 "[NOR.GetName]'daki düşük Faşizm desteğine rağmen, Storting çevresinde dönen pek çok muhafazakâr grup var. Onları geliştirerek Faşizm tohumlarını ekebilir ve sonra [NOR.GetAdjective] siyasetindeki gücümüzü pekiştirmek için onları bize yönlendirebiliriz."
 NOR_cut_military_budget:0 "Askerî Bütçeyi Kes"
 NOR_cut_military_budget_desc:0 "Dünya alevler içinde gibi görünebilir, ancak bu bizim orduya ihtiyacımız olduğu anlamına gelmez. Açık bir tarafsızlık politikamız var, bu yüzden daha önce silahlanma ve savunmaya bağlı kaynakları, daha adil ve müreffeh bir [ROOT.GetName] inşa etmeye yönlendirebiliriz."
 NOR_defend_finland:0 "Finlandiya'yı Savun"
 NOR_defend_finland_desc:0 "Aşağılık [SOU.GetName]'in gururlu [FIN.GetName] ulusundan faydalanmasına izin veremeyiz. Halk içinmiş gibi davranan ama sadece onları ezen bir rejimin tiranlığına karşı silahlanmalıyız. Finlandiya bağımsız kalmalıdır."
 NOR_demand_king_haakons_rise_to_power:0 "Kral Haakon'un İktidara Yükselişini Talep Et"
 NOR_demand_king_haakons_rise_to_power_desc:0 "Baron Wedel-Jarlsberg'in coşkulu bir konuşması sayesinde, [NOR.GetName] halkı hükûmetin dizginlerini ele geçirmesi için güçlü iradeli bir monarşi için feryat ediyor. Tek sorun, Kral VII. Haakon'un kendisinin ülkenin halkının temsilcileri tarafından yönetilmesi gerektiğini vurgulamaya devam etmesidir. Görünüşe göre kralın biraz ikna edilmeye ihtiyacı var."
 NOR_demand_nationalizations:0 "Kamulaştırma Talep Et"
 NOR_demand_nationalizations_desc:0 "Bu burjuva hükûmeti, henüz üretim araçları üzerindeki kolektif mülkiyetin gücünü bilmiyor. Ülke genelindeki hayati fabrikaların kamulaştırılmasını talep etmeliyiz ki devrimi daha başlamadan yola koyabilelim. Daha da önemlisi, ne kadar çok fabrika o kadar çok işçi ve davamızın müttefiki demektir."
 NOR_denounce_the_german_reich:0 "[GetNorwegianThreateningFascist]'ı Kına"
 NOR_denounce_the_german_reich_desc:0 "[GetNorwegianThreateningFascist]'in dünya halklarını ezip geçmesine izin veremeyiz. Faşizme karşı bizim safımıza katılmaları için dünyadaki herkese neyi savunduğumuzu duyurmalıyız."
 NOR_drobak_coastal_fort:0 "Drøbak Kıyı Kalesi"
 NOR_drobak_coastal_fort_desc:0 "Drøbak, daha spesifik olarak Drøbak Boğazı, başkentimizi savunmanın anahtarı olabilir. İyi yerleştirilmiş bir torpidonun bir istilayı, yanıt vermek için gereken hazırlıkları yapacak kadar geciktirebileceğini asla bilemezsiniz."
 NOR_eirik_raudes_land:0 "Eirik Raudes Ülkesi"
 NOR_eirik_raudes_land_desc:0 "Lahey'in 1933'teki saçma kararı bozulmalıdır. Bir Norveçli olan Erik the Red'in bin yıl önce keşfettiği toprağı [DEN.GetName]'a vermeye nasıl cüret ederler. Sadece birkaç yıl önce Grönland'ın Doğu Kıyısı'nın bir kısmına sahiptik, ama yakında onu ve daha fazlasını alacağız, bizim olanı geri aldığımızda Erik The Red'in mirası devam edecek."
 NOR_elevate_hirden:0 "Hirden'i Yükselt"
 NOR_elevate_hirden_desc:0 "Hirden, Nasjonal Samling'in paramiliter kolu olarak bize iyi hizmet etti, ancak kendimizi gelişen bir faşist rejimle bulduğumuzda, [NOR.GetAdjective] hükûmetinin güç yapısındaki konumunu sağlamlaştırmayı düşünmeliyiz."
 NOR_emergency_conversions:0 "Ticaret Gemilerini Dönüştür"
 NOR_emergency_conversions_desc:0 "Devasa bir ticaret filomuz var, ancak tehlikeli denizlerde kendileri için büyük bir riskle yelken açıyorlar. Bu daha küçük gemilerden birkaçını soymalı, hafifçe silahlandırmalı ve savunmasız nakliyemizi korumalarını sağlamalıyız. Gerekirse daha sonra daha özel görevler için onları her zaman yeniden donatabiliriz."
 NOR_emergency_conversions_tt:0 "§YKonvoyları§! §YMuhriplere§! dönüştürmek için §Ykararların§! kilidini açar!"
 NOR_empower_hirden:0 "Hirden'i Güçlendir"
 NOR_empower_hirden_desc:0 "Kendi paramiliter örgütümüz Hirden, Nasjonal Samling'in [NOR.GetName]'ın geleceği için planlarının bel kemiği olmuştur. Hükûmeti ele geçirmek ve gerekirse savaşmak için ona odaklanmak hayati önem taşıyacaktır."
 NOR_empower_large_industrial_groups:0 "Büyük Sanayi Gruplarını Güçlendirin"
 NOR_empower_large_industrial_groups_desc:0 "Büyük sanayi kuruluşları, ortalama [ROOT.GetAdjective] vatandaşının günlük ihtiyaçlarını üreten fabrika inşa etme ve bakımını yapma konusunda kanıtlanmış bir geçmişe sahiptir. Elbette onlara güvenmek, [ROOT.GetNonIdeologyName]'nin endüstriyel bağımsızlığa giden yoluna giden doğru yoldur."
 NOR_empower_sivorg:0 "Sivorg'u Güçlendir"
 NOR_empower_sivorg_desc:0 "Kretsen ve Koordinasyon Komitesi çabalarımıza katıldığına göre, artık onları aynı şemsiye altında birlikte çalıştırma zamanı geldi. Sivorg, [NOR.GetName]'da sivil direnişi organize etmek için her türden sivili kapsayan bir örgüt olacaktır."
 NOR_encourage_recruitment:0 "Askere Alımı Teşvik Et"
 NOR_encourage_recruitment_desc:0 "Sevgili Mabeyincimizin dediği gibi, Kral Haakon kalplerimizde yaşıyor, bu yüzden herkes onun için savaşabilir ve ölebilir! Ruhu [ROOT.GetNameDef]'deki her tebaayı yükseltsin ki hükümdarları için savaşmak üzere askere yazılsınlar."
 NOR_enhance_coastal_defense:0 "Kıyı Savunmasını Geliştir"
 NOR_enhance_coastal_defense_desc:0 "Kıyı mülklerimizin genişliği iki ucu keskin bir kılıçtır. Bir yandan adamlarımızın denizde gelişmesine olanak tanır, ama diğer yandan düşmanın bir deniz istilası için geniş bir giriş yolu olduğu anlamına gelir."
 NOR_establish_milorg:0 "Milorg'u Kur"
 NOR_establish_milorg_desc:0 "[NOR.GetName]'daki işgale karşı direniş şiddetli olmaya devam ediyor, ancak örgütlenme ve disiplinden yoksun. Sürgünden yönetilen iyi koordine edilmiş bir askeri direniş, hükûmetimizin [NOR.GetAdjective] topraklarına dönüşü için zemin hazırlayabilir."
 NOR_expand_Haeren:0 "Hæren'i Genişlet"
 NOR_expand_Haeren_desc:0 "Mevcut kara kuvvetlerimiz kıtadaki diğer ordularla karşılaştırıldığında sönük kalıyor, [ROOT.GetName] hiçbir zaman militarist bir ulus olmadı. Küresel savaş tehdidi büyüdükçe, nüfusumuzun genç ulusumuzu savunmaya hazır olduğundan emin olmalıyız."
 NOR_expand_merchant_marine:0 "Ticaret Filosunu Genişlet"
 NOR_expand_merchant_marine_desc:0 "Modern savaş kaynak ve teçhizat gerektirir, [ROOT.GetName]'ın umutsuzca eksik olduğu iki şey. Savaş belirirken, hayatta kalmak için ihtiyacımız olan her şeyi getirecek yeterli gemimiz olduğundan emin olmalıyız. Evet, zaten çoğu ulustan daha fazla sivil gemimiz var, ama yol boyunca birçoğunu kaybetmeyi bekliyoruz ve eksik kalmayı göze alamayız."
 NOR_expand_military_industry:0 "Askerî Sanayiyi Genişlet"
 NOR_expand_military_industry_desc:0 "Yeni başlayan askeri sanayimiz küresel kapitalizmi alt etmek için yeterli olmayacak. Sürekli genişleyen silahlı kuvvetlerimizin ihtiyaçlarını karşılamak için genişletilmelidir."
 NOR_expand_naval_academy:0 "Deniz Akademisini Genişlet"
 NOR_expand_naval_academy_desc:0 "Daha fazla gemi, onları savaşa götürecek daha fazla subaya ihtiyacımız olduğu anlamına gelir. Deniz akademimiz yıllardır yeterliydi, ancak donanmamız genişledikçe, subay ve denizci tedariki de genişlemelidir."
 NOR_expand_norges_tekniske_hogskole:0 "Norges Tekniske Høgskole'yi Genişlet"
 NOR_expand_norges_tekniske_hogskole_desc:0 "Ufukta beliren büyük ölçekli çatışma göz önüne alındığında, giderek daha karmaşık hale gelen savaşın taleplerini karşılamak için Teknik Enstitümüzün ölçeğini artırmamız gerekecek."
 NOR_expand_the_dockyards:0 "Tersaneleri Genişlet"
 NOR_expand_the_dockyards_desc:0 "Dünyanın en büyük ticaret filolarından birine sahip olmamıza rağmen, tersane kapasitemiz kesinlikle genişletilebilir ve sadece kargo gemileri ve tankerler üretmek yerine askeri gemilerin daha iyi bir çıktısı için optimize edilebilir."
 NOR_expanded_conscription_drive:0 "Genişletilmiş Askerlik Çağrısı"
 NOR_expanded_conscription_drive_desc:0 "Mücadele bitene kadar, tarihi ideallerimize göre şekillendirecek savaş alanlarını beslemek için taze birliklere ihtiyacımız olacak. Savaşabilecek her erkek ve kadın saflarımıza katılmalı, yoksa vatanımız istila edilir."
 NOR_extensive_recruitment:0 "Kapsamlı Asker Alımı"
 NOR_extensive_recruitment_desc:0 "İmparatorluğumuzu genişletmek istiyorsak, [NOR.GetAdjective] topraklarını İskandinav atalarının ruhuna sahip askerler aramak için taramalıyız. Balıkçılık ve çiftçilik, imparatorluğumuzun genişlemesine göre ikincildir, bu yüzden savaşabilecek her yetenekli adam düşmanlarımıza karşı silahlanmaya hazır olmalıdır."
 NOR_fascist_industrial_investments:0 "Faşist Endüstriyel Yatırımlar"
 NOR_fascist_industrial_investments_desc:0 "Faşist dostlarımız, modern bir ülkenin rekabet edebilmesi için gereken gelişmiş sanayi için gerekli zekâya ve sermayeye sahiptir. Bunu daha da faydalı bir müttefik olmanın bir yolu olarak kullanabiliriz."
 NOR_fascist_invasion_of_norway:0 "Norveç'in Faşist İstilası"
 NOR_fascist_invasion_of_norway_desc:0 "Düşünülemez olan oldu, bizden çok uzakta olduğunu düşündüğümüz faşist tehdit kapımızın önüne geldi ve onu kırdı. Sadece yardım buraya ulaşana kadar dayanmayı umabiliriz."
 NOR_fascist_military_collaboration:0 "Faşist Askerî İşbirliği"
 NOR_fascist_military_collaboration_desc:0 "Yurtdışından gelen Faşistler mevcut rejimimizi elde etmemize yardımcı oldu ve neyse ki şimdi neredeyse eşitler olarak daha yakın bir askerî işbirliği kurma konumundayız."
 NOR_fde_intelligence_agency:0 "Forsvarets İstihbarat Servisi"
 NOR_fde_intelligence_agency_desc:0 "Askerlerimiz ve subaylarımız cepheye körü körüne gidemezler. Ne ile karşılaşacaklarını bilmeleri ve planlarında aldatmacayı kullanabilmeleri gerekir. Bu yüzden Ordunun bir istihbarat kolu kuracağız, böylece askerlerimizin yerine onlar ellerini kirletebilir."
 NOR_field_hospitals:0 "Saha Hastaneleri"
 NOR_field_hospitals_desc:0 "[NOR.GetName]'ın nüfusu diğer ülkelerdeki gibi dipsiz değildir. Malzeme değiştirilebilir, ancak kaybedilen bir yoldaş, kapitalizme karşı uluslararası mücadele için bir ruh daha az demektir. Hem adam hem de toprak kaybetme riskine girmemek için, yaralı askerleri en kısa sürede cepheye geri göndermek için çabalarımızı odaklamalıyız."
 NOR_for_the_king_and_prince:0 "Kral ve Prens İçin"
 NOR_for_the_king_and_prince_desc:0 "Kralımız Haakon ve oğlu Prens Olav, her [NOR.GetAdjective] için bir ilham kaynağıdır. Askerlerimize her ileri adımın, öldürülen her düşmanın ve dökülen her litre kanın boşuna olmadığını hatırlatmalıyız. Her şey Kraliyet Ailemiz, [NOR.GetName] Soyluları ve temsil ettikleri her şey içindir."
 NOR_foreign_plane_designs:0 "Yabancı Uçak Tasarımları"
 NOR_foreign_plane_designs_desc:0 "Genç ve uzun süredir ihmal edilmiş bir ulus olarak, [ROOT.GetName] modern muharebenin gerektirdiği hava gücünü tasarlamak ve üretmek için gerekli altyapıya, bilgi birikimine veya araçlara sahip değildir. [NOR.GetName]'ın hava kuvvetlerini tedarik etmek için uluslararası silah pazarına yönelmeliyiz."
 NOR_fortify_norway:0 "Norveç'i Güçlendir"
 NOR_fortify_norway_desc:0 "Kalelerimiz yeterince uzun süre ihmal edildi, inşaat ekiplerini hızla modernize etmek ve hatta mevcut kalelerimizi yeniden inşa etmek ve gerektiğinde yenilerini inşa etmek için toplamalıyız."
 NOR_frontkjempere:0 "Frontkjempere"
 NOR_frontkjempere_desc:0 "Birçok [NOR.GetAdjective], yurtdışında fetih yapan kurtarıcılarımıza yardım etmek için cephe hatlarını özlüyor. Birçoğu ölecek, ama bu küresel bir milliyetçi hareketin parçası olmanın ödediğimiz bedelidir. Kim bilir, belki [NOR.GetName] kendini yeterince sevdirir de kendi işgalini yönetme güvenini kazanır."
 NOR_fund_local_construction:0 "Yerel İnşaatı Finanse Et"
 NOR_fund_local_construction_desc:0 "Sanayileşmemizin başkentimizde ve birkaç diğer büyük şehirde merkezileşmesine izin veremeyiz. İlerleme, [ROOT.GetName]'ın tamamını olabildiğince eşit bir şekilde kapsamalıdır. Bu yüzden, daha çeşitli bir endüstriyel temel ve daha sağlam bir ekonomi için yerel inşaatı teşvik etmek üzere kasabalara ve küçük şehirlere yatırım yapalım."
 NOR_get_industrialist_support:0 "Sanayici Desteği Al"
 NOR_get_industrialist_support_desc:0 "Düşük sanayileşme seviyemize rağmen, büyük işletmeler iktidar kolları üzerinde büyük bir etkiye sahiptir ve bizim yardımımızla, bizi destekledikleri sürece daha fazla etki kazanabilirler.\n\nSonuçta, sermayenin tek ideolojisi sermayenin genişlemesidir ve bunun için araçları sağladığımız sürece, bizim tarafımızda olacaklardır."
 NOR_get_rid_of_quisling:0 "Quisling'den Kurtul"
 NOR_get_rid_of_quisling_desc:0 "Quisling'in darbesi asla kalıcı olmayacaktı. Faşist müttefiklerimizin işgale bir meşruiyet görünümü vermek için birine ihtiyaç duyması durumunda bir geçici çözümdü. Artık bu kendine aşırı güvenen beceriksiz adama ihtiyacımız olmayacağı açık olduğuna göre, onu mümkün olan en kısa sürede atmalıyız."
 NOR_haerens_flyvevaaben:0 "Hærens Flyvevaaben"
 NOR_haerens_flyvevaaben_desc:0 "Savaşın yeni cephesi gökyüzündedir. Düşmanın hava sahamız üzerinde tam kontrol sahibi olmasına izin verirsek, kara kuvvetlerimiz etkili bir şekilde hareket edemeyecektir. Kara birliklerimiz lehine hareket edebilecek bir hava kuvveti geliştirmeliyiz."
 NOR_hurtigruten:0 "Hurtigruten"
 NOR_hurtigruten_desc:0 "[ROOT.GetNonIdeologyName]'ın sadece alışılmadık derecede uzun bir ülke olmakla kalmayıp, aynı zamanda her yerinde çok zorlu bir araziye sahip olduğu inkâr edilemez. Bu kesinlikle ulusal kimliğimizi şekillendirdi, ama aynı zamanda altyapı ve demiryolları düzgün bir şekilde inşa etmeyi de imkansız hale getiriyor. Bir çözüm olarak Hurtigruten'i, [ROOT.GetAdjective] kıyı şeridi boyunca insanları ve malları taşımak için bir dizi feribot olarak kurmalıyız."
 NOR_iceland:0 "İzlanda"
 NOR_iceland_desc:0 "[NOR_GetIcelandClaimDesc]"
 NOR_iceland_desc_ALT:0 "Kalmar Birliği'nin dağılmasından sonra İzlanda haksız yere bizden alındı. Bu yüzyıllar önce olmasına rağmen unutmadık. Kraliçemiz, Prens'imiz ve yönettikleri halk, bu durum düzeltilene ve İzlanda bir kez daha Norveç Krallığı'nın bir parçası olana kadar uyumayacak."
 NOR_iceland_desc_PAWJ:0 "Kalmar Birliği'nin dağılmasından sonra İzlanda haksız yere bizden alındı. Bu yüzyıllar önce olmasına rağmen unutmadık. Mabeyincimiz, Kralımız ve Prens'imiz bu durum düzeltilene ve İzlanda bir kez daha Norveç Krallığı'nın bir parçası olana kadar uyumayacak."
 NOR_improve_production_lines:0 "Üretim Hatlarını Geliştir"
 NOR_improve_production_lines_desc:0 "Eğer savaşmaya devam etmek için silah ve teçhizat sağlayamıyorsak, ülkemizi savunmadaki cesaretin bir anlamı yoktur. Modern savaş, karşı koyacak mermilere sahip olmakla ilgilidir, onları ateşleyebildiğimiz kadar hızlı yapabildiğimizden emin olalım."
 NOR_improved_training:0 "Geliştirilmiş Eğitim"
 NOR_improved_training_desc:0 "Adamlarımızı uygun eğitim olmadan savaş alanına gönderirsek, Seferberlik Emirlerini atlayıp yerine ölüm belgeleri düzenlesek daha iyi olur.\nYeni acemiler için gıcırdayan eğitim programının, daha iyi bir savaş gücüne sahip olabilmemiz ve onları olabildiğince çabuk çıkarabilmemiz için bir elden geçirilmesi gerekiyor."
 NOR_improved_weapons:0 "Geliştirilmiş Silahlar"
 NOR_improved_weapons_desc:0 "Kara kuvvetlerimiz tarafından kullanılan teçhizat acınacak bir durumdadır. Bu, bağımsızlığımıza mal olabilecek kabul edilemez bir ihmal miktarıdır. Bu eğilimi tersine çevirmek için elimizden geldiğince acele etmeliyiz."
 NOR_increase_air_production:0 "Hava Üretimini Artır"
 NOR_increase_air_production_desc:0 "[NOR.GetName]'ın uçaklara ihtiyacı var ve onlara şimdi ihtiyacı var! Eğer çabalarımızı uçak üretimine yönlendirirsek, o zaman kendimizi savunabilir ve düşmanın savunmasını aşabiliriz."
 NOR_increase_research_funding:0 "Araştırma Finansmanını Artır"
 NOR_increase_research_funding_desc:0 "[ROOT.GetName] hiçbir zaman teknolojik bir güç merkezi olmadı, henüz. Avrupa'nın geri kalanına yetişmeyi umuyorsak yeni araştırmalara yatırım yapmalıyız, yoksa gelecekteki bir düşmana bağımlı olma riskine gireriz."
 NOR_independent_norway_removal_tt:0 "§Y$NOR_independent_norway_dmod$§!, §R[ROOT.GetNonIdeologyName] başka bir ulusun tebaası olursa kaldırılacaktır!§!"
 NOR_invest_in_airfields:0 "Hava Alanlarına Yatırım Yap"
 NOR_invest_in_airfields_desc:0 "Eğer onları fırlatmak için gerekli altyapıya sahip değilsek, uçaklara sahip olmanın bir anlamı yoktur. Genişleyen bir hava kuvvetinin taleplerini karşılamak için gerekli altyapıda ciddi şekilde eksiğiz."
 NOR_invite_cadillac_to_norway:0 "Cadillac'ı Norveç'e Davet Et"
 NOR_invite_cadillac_to_norway_desc:0 "Yıllar önce sevgili Prens Olav'ımıza, o zamanlar neşeli bir bebekken, minyatür bir Cadillac hediye edilmişti. Cadillac'ı [NOR.GetNameDef]'e davet edersek, sancağımızı düşmanlarımızın cesetleri üzerinde taşıyacak araçları geliştirmemize ve üretmemize yardımcı olurlarsa kesinlikle takdir edecektir. Bu, prense çocukluğundan neşeli anılar getirsin."
 NOR_invite_foreign_investment:0 "Yabancı Yatırım Davet Et"
 NOR_invite_foreign_investment_desc:0 "Sanayimiz on yıllardır ihmal edildi, bu yüzden Avrupa'daki diğer ulusların seviyelerine sanayileşmek için gerekli sermayeden yoksunuz. Neyse ki, yurtdışında geleceğimize yatırım yapmaya istekli birçok açgözlü yatırımcı var, bir bedel karşılığında."
 NOR_invite_german_engineers:0 "Faşist Mühendisleri Davet Et"
 NOR_invite_german_engineers_desc:0 "[NOR.GetName] hiçbir zaman bir sanayi devi olmadı, seleflerimiz kendi ürünlerimizi üretmekten çok ticaret yapmaya odaklandılar. Bu yüzden müttefiklerimize ve daha da önemlisi düşmanlarımıza yetişmek için gereken bilgiyi güvence altına almak için [GetNorwegianFascistOverlord]'nin yardımına ihtiyacımız var."
 NOR_invite_secret_army:0 "Gizli Orduyu Devşir"
 NOR_invite_secret_army_desc:0 "Geçmişte, [NOR.GetNonIdeologyName] liderleri bir Komünist Devrim durumunda ülkeyi savunmak için gizli bir ordu yarattılar, ancak artık amaçları geçersiz olduğu için onları yargılamaya gerek yok. Uzlaşabilir ve ülkelerini bize karşı değil, bizimle birlikte savunmak isteyenleri davet edebiliriz."
 NOR_invite_soviet_designers:0 "Sovyet Tasarımcıları Davet Et"
 NOR_invite_soviet_designers_desc:0 "Komünist müttefiklerimizin sahip olduğu teknik bilgi birikimi bizimkinden on yıllar ileride, eğer bize uzmanlıklarını ödünç verirlerse, düşmanlarımızı atlayabilir ve üstün silahlar ve araçlarla gereksiz kan dökülmesini önleyebiliriz."
 NOR_invite_transnational_manufacturers:0 "Uluslararası Üreticileri Davet Et"
 NOR_invite_transnational_manufacturers_desc:0 "Ticaret o kadar çok odaklandık ki, ülkemizdeki üretim olanaklarının hepsini sömürmedik. Şimdi sendikalarla işimiz bittiğine göre, yabancı şirketler iş gücü piyasasına engelsiz erişimimiz için ülkemize akın edecek."
 NOR_join_the_allies:0 "Müttefiklere Katıl"
 NOR_join_the_allies_desc:0 "En kötüsü nihayet gerçekleştiğinde, güçlü ve güvenilir müttefiklere sahip olmak, boyun eğme ile özgürlük arasındaki fark anlamına gelecektir. [FRA.GetName] ve [ENG.GetName] Büyük Savaş'ı Almanya'ya karşı kazandı ve yine yapabileceklerine inanıyoruz."
 NOR_join_the_comintern:0 "Komintern'e Katıl"
 NOR_join_the_comintern_desc:0 "Komünist Enternasyonal, dünya çapında proletarya devrimi için savaşan gerçek şemsiyedir. Kapitalizmi ve Faşizmi yenmeyi umuyorsak, bu en iyi ve tek yoldur."
 NOR_jonas_lie_coup:0 "Jonas Lie'nin Darbesi"
 NOR_jonas_lie_coup_desc:0 "Quisling'in beceriksizliğinin sınırı yok gibi görünüyor. Daha başlamadan rejimimize bir engel oldu ve komuta zincirimizdeki zayıf halka o. Öte yandan, başlangıçtan beri [GetNorwegianFascistOverlord]'nin [ROOT.GetName]'ı işgal etmesinin güçlü bir savunucusu ve gerektiğinde amansız bir düzen ajanı olan Jonas Lie var. Halkını müttefikimizin hedefleri doğrultusunda yönetmesi gereken kişi o olmalı."
 NOR_kickstart_military_industry:0 "Askerî Sanayiyi Harekete Geçir"
 NOR_kickstart_military_industry_desc:0 "[ROOT.GetName] uzun süredir diğer ulusların tebaası olmuştur ve bu nedenle hiçbir zaman bir iç askeri sanayi geliştirmemiştir. Özgürlüğümüzü korumak için, savunma üretimimiz için diğer ülkelere güvenmeyi bırakmalı ve savaş makinemizi inşa etmeye başlamalıyız."
 NOR_kystvakten:0 "Kystvakten"
 NOR_kystvakten_desc:0 "Geniş kıyımızı korumak için, ufkun her santimini görebilmemiz için sayılara ihtiyaç vardır. Topraklarımızı düşman gemilerine karşı koruyacak bir gemi ağı oluşturalım."
 NOR_leaving_the_hard_thirties_behind:0 "Zorlu Otuzları Geride Bırakmak"
 NOR_leaving_the_hard_thirties_behind_desc:0 "Yıllardır büyük buhranın artçı şoklarına katlandık ve gerekli araçlar ve sanayi tabanı olmadan, genç ulusumuzu sağlam bir zemine oturtma şansı çok az. [ROOT.GetName]'ın büyüyüp gelişebileceği bir temel inşa etmeye başlama zamanı."
 NOR_liberal_conservative_alliance:0 "Liberal Muhafazakâr İttifakı"
 NOR_liberal_conservative_alliance_desc:0 "Høyre ve Venstre sırasıyla sağ ve sol anlamına gelse de, iki partimizin o serseri İşçi Partisi'nden gelen herhangi bir saldırıyı saptırmak ve bir hükûmet koalisyonu kurmak için yeterli ortak çıkarı var. Birlikte [ROOT.GetName]'ı sermayeye dost ve burada ve yurtdışında savaşmaya hazır bir ulus haline getireceğiz."
 NOR_luftforsvaret:0 "$NOR_royal_air_force_dmod$"
 NOR_luftforsvaret_desc:0 "Hava Kuvvetlerimizin sadece kara ordularımız için bir destek kolu olmaktan çıkıp, silahlı kuvvetlerin kendi başına bir kolu haline gelme zamanı geldi. Modern muharebe için gerekli tüm operasyonları etkili bir şekilde yürütebilecek kaynaklara sahip bir kol."
 NOR_lurk_in_the_shadows:0 "Gölgelerde Gizlen"
 NOR_lurk_in_the_shadows_desc:0 "Storting kendini yerken, biz bunu kendi avantajımıza kullanacağız. Parlamentonun sürekli başarısızlığı, [NOR.GetAdjective] halkını Nasjonal Samling'e ve Faşizmin pençelerine çekmek için ihtiyacımız olan toplanma noktasıdır."
 NOR_lynrytter:0 "Lynrytter"
 NOR_lynrytter_desc:0 "Blitzkrieg'in üstün strateji olduğu kanıtlandığına göre, onu benimsemeli ve tanklarımızı düşmanlarımızın cephe hatları üzerinden sürmeliyiz. Zırhlılarımız [NOR.GetNameDef]'e hızlı zafer getirdiğinde Odin'in kendisi yanımızda olacak"
 NOR_military_police:0 "Askerî Polis"
 NOR_military_police_desc:0 "Rejimimize karşı direniş arttıkça, filizlenmeden önce tomurcuğunda boğmak için gerekli araçları elde etmeliyiz. Daha gelişmiş bir Askerî Polis, [NOR.GetName] halkı yeni düzeni kabul etmeyi öğrenene kadar gücümüzü korumanın tek yolu olabilir."
 NOR_mine_laying_effort:0 "Mayın Döşeme Çabası"
 NOR_mine_laying_effort_desc:0 "Gemilerimiz her yerde aynı anda olamaz, ancak mayınlar daha fazla suyu kaplamamıza ve düşman kaptanlarının güvenlik kesinliğini reddetmemize yardımcı olabilir. En yeni mayın kaçınma ve etkisizleştirme tekniklerinin üstesinden gelmek için daha iyi mayınlara ihtiyacımız var."
 NOR_modernize_fortifications:0 "Tahkimatları Modernleştir"
 NOR_modernize_fortifications_desc:0 "Bazıları tahkimatlarımıza 'Napolyonvari' dedi, ki bu bağlamda iltifat olmaktan başka her şeydir. Sığınaklarımız eski olabilir ama düşmanlarımızın silahları değil. Kalelerimizi standarda getirme çabası ve kaynakları gelecekte kesinlikle karşılığını verecektir."
 NOR_moscows_education_centers:0 "Komünist Eğitim Merkezleri"
 NOR_moscows_education_centers_desc:0 "Yıllarca Komintern, tüm İskandinavya'dan yoldaşlara Devrimi yeraltından yürütmek için gerekli becerileri öğretti. Artık onları gün ışığında ağırlayabilir, Devrimin sürekli olarak nasıl devam ettirileceğini öğretebiliriz."
 NOR_nasjonal_samling:0 "Nasjonal Samling"
 NOR_nasjonal_samling_desc:0 "Yıllardır [NOR.GetName]'daki önde gelen Faşist parti, ana akım merkez ve sol partiler tarafından kenara itildi. Artık bu sona erdi. Gerçekten [NOR.GetAdjective] bir Faşist Rejim getirmek için lideri Vidkun Quisling'in, yetenekli ve karizmatik liderimizin arkasında toplanmalıyız."
 NOR_nationalize_the_hydro_plants:0 "Hidroelektrik Santrallerini Kamulaştır"
 NOR_nationalize_the_hydro_plants_desc:0 "Hidroelektrik güç, [ROOT.GetAdjective] endüstrisinin temel direklerinden biridir, ancak şu anda yanlış ellerde, kapitalist ellerde! Devrimin bir sonraki aşamasını körükleyecek gücü üretme araçlarını ele geçirelim."
 NOR_naval_air_force:0 "Deniz Hava Kuvveti"
 NOR_naval_air_force_desc:0 "Uçaklarımız, [ROOT.GetName]'ı işgal eden bir filoyla kıyılarımızdaki barışçıl sular arasındaki farkı yaratabilir. Denizler üzerindeki gökyüzüne hükmedebilirsek, dalgalara bir kez daha hükmedebiliriz."
 NOR_norges_rikstanksfabrikk:0 "Norges Rikstanksfabrikk"
 NOR_norges_rikstanksfabrikk_desc:0 "Artık zırhlı savaşın temellerini öğrendiğimize göre, kendi ulusal tank üretim programımızı veya Rikstanksfabrikk'i geliştirmeye hazırız. Bu, kesintisiz bir zırhlı araç tedarikini garanti etmenin tek yoludur."
 NOR_norges_tekniske_hogskole:0 "Norges Tekniske Høgskole"
 NOR_norges_tekniske_hogskole_desc:0 "Yirmi yılı aşkın bir süredir, Trondheim'daki Norveç Teknoloji Enstitüsü ülkedeki mühendisliğin ön saflarında yer almaktadır, ancak komşularımızla ve muhtemelen düşmanlarımızla rekabet etmeyi umuyorsak, teknik eğitime daha fazla fon sağlanması gerekecektir. Sanayimizin gerekli uzmanlıktan yoksun kalmasına izin veremeyiz."
 NOR_nortraship:0 "Nortraship"
 NOR_nortraship_desc:0 "Savaş bizi kendi ulusumuzdan sürgün ettiğine göre, nakliye çabalarımızı tek bir bayrak altında birleştirmemiz gerekiyor. Nortraship, uzaktan savaş çabalarını desteklememize ve müttefiklerimizin bizi [ROOT.GetName]'a geri getirecek kadar uzun süre hayatta kalmalarına yardımcı olmamızı sağlayacaktır."
 NOR_norwegian_carriers:0 "Norveç Uçak Gemileri"
 NOR_norwegian_carriers_desc:0 "Savaşın geleceğinin, denizdeyken bile, hava sahasının kontrolüne büyük ölçüde bağlı olduğunu defalarca gördük. Uçak gemileri, düşman gemilerinin üzerindeki gökyüzüne hükmetmemize ve onları hızla yenmemize yardımcı olacaktır."
 NOR_norwegian_engineering:0 "Norveç Mühendisliği"
 NOR_norwegian_engineering_desc:0 "Gerçekten Kalıcı bir Devrim elde etmek istiyorsak, sömürülen kardeşlerimizle yapılan savaş aletlerinden kendimizi kurtarmamız gerekiyor. Bu devrimi gerçekten bizim diyebilmek istiyorsak kendi tasarımlarımızı geliştirmeli ve kendi teçhizatımızı yapmalıyız."
 NOR_norwegian_planes:0 "Norveç Uçakları"
 NOR_norwegian_planes_desc:0 "Bugünün müttefiklerinin yarının işgalcileri olabileceğine tanık olduk, bu nedenle uçaklarımız için yabancı güçlere güvenemeyiz, modern savaş alanındaki önemleri çok büyüktür."
 NOR_norwegian_reichsprotectorate:0 "Norveç Reichsprotektoratı"
 NOR_norwegian_reichsprotectorate_desc:0 "Birçok başarımız sayesinde, [GetNorwegianFascistOverlord] [NOR.GetName]'ın ulusumuzu imparatorluklarına tam olarak katmaya hazır olduğuna karar verdi. Bu onların gücünün ve bizim ona olan saygımızın bir yansımasıdır. Sürekli genişleyen güç ve toprak susuzluklarını tatmin etmek için ne gerekiyorsa yapacağız."
 NOR_norwegian_school_of_economics:0 "Norveç Ekonomi Okulu"
 NOR_norwegian_school_of_economics_desc:0 "Dünya ekonomisinde kendimizi kanıtlamayı umuyorsak, uzmanlığa ihtiyaç vardır ve bu zaman alır. Ulusal ekonomi okulumuz olarak bir Norges Handelshøyskole kurmak, sivil ve daha sonra askeri sanayimizin gelişmesi için ilk adımdır."
 NOR_offensive_doctrines:0 "Saldırı Doktrinleri"
 NOR_offensive_doctrines_desc:0 "Eski doktrinimiz, düşmanımız yorulana kadar sadece savunacağımız varsayımı altında tasarlanmıştı. Bu, seleflerimizin ve gelecekteki düşmanlarımızın beklentisiydi ve bu yüzden daha en başından itibaren saldırıya geçmemiz için daha fazla neden var."
 NOR_officers_academy:0 "Subay Akademisi"
 NOR_officers_academy_desc:0 "İyi bir subay, savaşan kuvvetlerimizin etkinliğini katlar ve küçük nüfusumuzla bu hayati önem taşıyacaktır, özellikle de bir yabancı saldırısından sağ çıkma umudumuz varsa."
 NOR_old_vinland:0 "Eski Vinland"
 NOR_old_vinland_desc:0 "Eski İskandinav kaşifleri, kendilerini herkesten daha batıya itmeye devam ettiler, ta ki nihayet bereketli Vinland topraklarına, ya da şimdiki adıyla Newfoundland ve Labrador'a ulaşana kadar. Bir kez daha batıya yürüyelim ve ilk başta bizim kalması gerekeni fethedelim."
 NOR_organize_partisan_militias:0 "Partizan Milisleri Örgütle"
 NOR_organize_partisan_militias_desc:0 "Kapitalizmin [NOR.GetName] işçileri üzerindeki pençesini bir savaş olmadan yumuşatmayacağı aşikardır. İsteklileri silahlandıralım ve eğitelim, böylece zamanı geldiğinde ortaya çıkıp Sermayenin zincirlerini kırmak için devrimin yolunu açabilirler."
 NOR_our_royal_claims:0 "Kraliyet Hak İddialarımız"
 NOR_our_royal_claims_desc:0 "[NOR_GetOurRoyalClaimsDesc]"
 NOR_our_royal_claims_desc_king:0 "Böyle mütevazı bir krala sahip olduğumuz için şanslıyız, mevcut yargı yetkisi dışındaki topraklara yönelik herhangi bir iddiayı reddeden bir kral. Bu iddiaları zorlamak ve onları krallığımıza katmak için ne gerekiyorsa yapmaya istekli olan sevgili Kontumuz Peder Anker Wedel-Jarlsberg'e sahip olduğumuz için daha da şanslıyız. Kralımızın toprağı için savaşalım!"
 NOR_our_royal_claims_desc_queen:0 "Kral VII. Haakon'un artık aramızda olmaması talihsizliktir, ancak bize bıraktığı mirası, ki buna Avrupa çapındaki sayısız iddiası da dahildir, hatırlamalıyız. Sadece kendi iddialarına sahip olmakla kalmayıp, aynı zamanda bu iddiaları zorlamak ve onları krallığımıza katmak için ne gerekiyorsa yapmaya istekli olan sevgili Kraliçemiz I. Mathilde'e sahip olduğumuz için daha da şanslıyız. Tacımızın toprağı için savaşalım!"
 NOR_pan_germanic_cooperation:0 "Pan-Cermen İşbirliği"
 NOR_pan_germanic_cooperation_desc:0 "Kültürel olarak, [NOR.GetNonIdeologyName] daha geniş Cermen dünyasına aittir, bu yüzden onlarla daha yakın işbirliği aramak mantıklıdır. Uzanıp imparatorluklarımızı birlikte inşa edelim."
 NOR_pan_germanic_entent:0 "Pan-Cermen Antantı"
 NOR_patrol_our_coast:0 "Kıyılarımızda Devriye Gez"
 NOR_patrol_our_coast_desc:0 "Kıyılarımız, önlerinde geniş bir deniz manzarasına tanıklık ediyor, hepsi [NOR.GetAdjective] topraklarına bir saldırı için olası bir yol. Mevcut filomuz bu sularda yetersiz kalıyor. Bu devasa alanı başarılı bir şekilde savunabilmesi için Donanmamızı genişletmeliyiz."
 NOR_pilot_training:0 "Pilot Eğitimi"
 NOR_pilot_training_desc:0 "Yeni başlayan hava kuvvetimiz küçük ve az gelişmiş olsa da, bize sürekli bağımsızlığımızı getirecek olan yeni nesil [NOR.GetAdjective] pilotlarına ilham vermek için havacılar ve kaşifler geleneğimizden yararlanabiliriz."
 NOR_power_to_the_royal_guard:0 "Kraliyet Muhafızlarına Güç"
 NOR_power_to_the_royal_guard_desc:0 "Hans Majestet Kongens Garde, sevgili kralımızın kendi Kraliyet Muhafızı, sürekli olarak krallıktaki en iyi eğitimli ve en kararlı savaş gücü olmuştur. Kralımızdan ve naibinden aldıkları ilham elle tutulur derecededir, bu yüzden ordumuzun hücumuna liderlik etmeli ve düşmanlarımızı ezecek olan mızrağın ucu olacaklardır."
 NOR_prepare_a_mobile_government:0 "Mobil bir Hükûmet Hazırla"
 NOR_prepare_a_mobile_government_desc:0 "Savaş başladığına göre, hükûmetimizin sırtında bir hedef var. Düşman, liderlerimizi yok etmek ve [NOR.GetName] halkını boyunduruk altına almak için her yola başvuracaktır. Hükûmetin en kritik işlevlerini tehlikeden uzaklaştırmaya hazır olmamız önemlidir."
 NOR_prepare_for_war:0 "Savaşa Hazırlan"
 NOR_prepare_for_war_desc:0 "Artık kaçınılmaz görünüyor, öyleyse neden barışın ebedi olacağını düşünerek kendimizi kandıralım. Savaş, bizim gibi ulusların üzerine sinsice çökebilir, bu yüzden her şeye hazır olmalıyız."
 NOR_preparing_the_return_to_norway:0 "Norveç'e Dönüşü Hazırlama"
 NOR_preparing_the_return_to_norway_desc:0 "Sahne hazırlandı, düşman hatlarının gerisinde ortalığı kasıp kavuran direniş güçlerimiz, kilit işgal yöneticilerinin işbirliği, sürgünde iyi eğitimli birlikler ve müttefiklerimizden askeri destek var. Savaşı düşmanlarımıza geri götürme ve [NOR.GetNonIdeologyName]'ı geri alma zamanı geldi!"
 NOR_prince_olav_to_navy_staff:0 "Prens Olav'ı Donanma Kurmaylığına"
 NOR_prince_olav_to_navy_staff_desc:0 "Projemize karşı süregelen direnişlerine rağmen, Prens Olav Krallığımızın deniz kuvvetlerini yönetme fikrine açık. Ne de olsa, 1928 Olimpiyatları'nda Yelken dalında altın madalya kazandı, bu yüzden dalgalarla bir bütün olduğunu biliyoruz. O donanmamıza liderlik etmeye odaklandığında, düşmanlarımızın tebaamızın tuttuğu somonlara yem olacağından eminiz."
 NOR_prince_olavs_inspiration:0 "Prens Olav'ın İlhamı"
 NOR_prince_olavs_inspiration_desc:0 "Mevcut durumumuza rağmen, [NOR.GetAdjective] halkı hâlâ Prenslerine güveniyor. Savaşa katılmasa da, sürgünden verdiği destek hükûmetimizin meşruiyeti için paha biçilmezdir."
 NOR_print_more_money:0 "Daha Fazla Para Bas"
 NOR_print_more_money_desc:0 "Yeni başlayan finansal sistemimiz, Zorlu Otuzların kemer sıkma politikalarından henüz tam olarak kurtulamadı, durumun daha da kötüleşmesini önlemek için elimizdeki tüm araçları kullanmalıyız, buna ülkede dolaşabilecek daha fazla nakit basmak da dahil."
 NOR_proactive_defense:0 "Proaktif Savunma"
 NOR_proactive_defense_desc:0 "Eğer onları zaten yok ettiysek düşmanlarımız saldıramaz. Savaş bizim topraklarımıza dokunmadan önce savaşı onların topraklarına taşıyalım, onlara [NOR.GetName] halkının tehdit edildiğinde neler yapabileceğini gösterelim."
 NOR_promote_civilian_donations:0 "Sivil Bağışları Teşvik Et"
 NOR_promote_civilian_donations_desc:0 "Eski feodal tımarlar gibi, her vasal hükümdarına aidatını ödemelidir. Elbette o barbar günler geride kaldı, bizim mütevazı monarşik sistemimiz ondan daha aydınlanmıştır, bu yüzden bu haraç büyük ölçüde gönüllüdür."
 NOR_prosecute_the_nkp:0 "NKP'yi Soruştur"
 NOR_prosecute_the_nkp_desc:0 "İşçi Partisi, [NOR.GetName] işçilerinden ziyade Stalin'e olan bağlılıkları aşikar olduğunda NKP'den ayrıldı. Çürümüş leşinin çok uzun süre iltihaplanmasına izin verdik. Bu hainleri, bizi [SOU.GetName]'a ihanet etmeden önce tüm gücümüzle ezmeliyiz."
 NOR_protect_finnmark_from_the_bolsheviks:0 "Finnmark'ı Bolşeviklerden Koru"
 NOR_protect_finnmark_from_the_bolsheviks_desc:0 "En kuzeydeki ve en doğudaki bölgemiz olarak Finnmark, [SOV.GetNameDef]'nin [FIN.GetNonIdeologyName]'a zorbalık yapmanın yeterli olmadığına karar vermesi durumunda bariz bir giriş noktası olacaktır."
 NOR_quislings_coup:0 "Quisling'in Darbesi"
 NOR_quislings_coup_desc:0 "Nasjonal Samling'in iktidara kaçınılmaz yükselişi için koşullar olgunlaştı. Fører'i Vidkun Quisling tarafından yeterince yönetilen bu, [NOR.GetAdjective] topraklarının tam kontrolüne ve nihayetinde tüm İskandinavya'ya yayılmamıza yönelik ilk adımdır."
 NOR_quislings_coup_happened:0 "Quisling darbesine çoktan başladı"
 NOR_quislings_regime:0 "Quisling'in Rejimi"
 NOR_quislings_regime_desc:0 "Nasjonal Samling'in Fører'inin istikrarlı dehası aşikardır. Ve birçoğu onu siyasi ve kişisel düzeyde, hatta kendi kabinesinde bile reddetse de, inatçılığının ve özgüveninin sonuç verdiği inkâr edilemez. Kesinlikle işleyen bir rejimi sürdürebilecek kapasitededir, ne kadar süreyle? Bu henüz belli değil."
 NOR_radar_research:0 "Radar Araştırması"
 NOR_radar_research_desc:0 "Geniş bir kıyı şeridine sahip bir ülke olarak, onu etkili bir şekilde izleyebilmemiz hayati önem taşır. Radar olan teknolojik mucize sayesinde, gelen gemi ve uçaklardan daha uzun mesafelerden haberdar olabiliriz."
 NOR_ramp_up_naval_production:0 "Donanma Üretimini Hızlandır"
 NOR_ramp_up_naval_production_desc:0 "Hikayelerle dolu denizcilik geleneğimize rağmen, mevcut donanma gücümüz hırslarımızla eşleşmiyor. İlk adımda, Prens'imizin ve gelecekteki kralımız Olav'ın donanmasını besleyecek tersaneleri inşa etmekte hiçbir çabadan kaçınmamalıyız."
 NOR_rearm_for_defense:0 "Savunma için Yeniden Silahlan"
 NOR_rearm_for_defense_desc:0 "Önümüzdeki tehlikeyi yanlış değerlendirmiş olabiliriz. Kıyılarımız kararlı bir düşmana karşı koruma sağlamayacak ve İskandinav komşularımızın sonsuza dek bir tampon olacağına körü körüne güvenemeyiz. Şimdi kaybedilen zamanı telafi etmeli ve [NOR.GetName]'ı kendini savunmaya hazır hale getirmek için yeniden silahlandırmalıyız."
 NOR_reawaken_the_permanent_revolution:0 "Kalıcı Devrimi Yeniden Uyandır"
 NOR_reawaken_the_permanent_revolution_desc:0 "Troçki bize devrimin durmayacağını ve proletarya tarihin sürücü koltuğuna oturana kadar gerçekten de duramayacağını öğretti. İskandinavya ve ötesindeki proletaryayı ayağa kaldıralım!"
 NOR_rebuild_the_royal_navy:0 "Kraliyet Donanmasını Yeniden İnşa Et"
 NOR_rebuild_the_royal_navy_desc:0 "Ülkemizden çok uzaktayız, bu yüzden ona tekrar ulaşmak muhtemelen deniz yoluyla olacaktır. Kraliyet Donanması'nı yeniden inşa etmek, ulusumuzu yeniden inşa etmekle eşdeğerdir."
 NOR_recruit_norwegian_refugees:0 "Norveçli Mültecileri Askere Al"
 NOR_recruit_norwegian_refugees_desc:0 "Yüzlerce, hatta binlerce [NOR.GetAdjective], düşmanın baskısından kaçmak için işgali terk ediyor. Birçoğu ülkeyi savunmak için savaşan gücün bir parçası, ama kaçamadılar; diğerleri direnişle savaşmayı öğrendi; ve bazıları hiç savaşmadı, ama eğitilebilir. Bu savaştan sağ çıkmak için elimizden gelen her insanı kullanmalıyız."
 NOR_reform_the_army:0 "Orduyu Reforme Et"
 NOR_reform_the_army_desc:0 "Kristian Laake ve Liberal parti elindeki yılların ihmali, orduyu ancak döküntü olarak adlandırılabilecek bir durumda bıraktı. Askeri hiyerarşimizi, lojistiğimizi, stratejilerimizi ve protokollerimizi yeniden inşa etmeliyiz ki muhtemelen karşılaşacağımız modern ordularla denk olsunlar."
 NOR_replace_laake:0 "Laake'yi Değiştir"
 NOR_replace_laake_desc:0 "Kristian Laake, atandığından beri Liberal Parti'nin bir aracı olmuştur. Ordunun yeteneklerinde sayısız azalmaya yol açtı ve Norveç'i zafere götürecek becerilere veya iradeye sahip görünmüyor. Orduyu [NOR.GetName]'daki yaşamın ön saflarına koymaya hazır birine ihtiyacımız var."
 NOR_repurpose_lighthouses:0 "Deniz Fenerlerini Yeniden Amaçlandır"
 NOR_repurpose_lighthouses_desc:0 "Hava ve jeoloji, [ROOT.GetAdjective] kıyısı boyunca deniz fenerlerini bir gereklilik ve hatta ulusumuzun bir simgesi haline getirmiştir. Onları Radar ekipmanını desteklemek ve işgalcileri savuşturmamıza yardımcı olmak için kullanarak umut fenerlerine dönüştürebiliriz."
 NOR_required_prep_fascist_TT:0 "§YFaşist bir Darbe için Toplam Destek§! $RIGHT|0Y$'den yüksek (Mevcut destek: $LEFT|0Y$)"
 NOR_research_funding:0 "Araştırma Finansmanı"
 NOR_research_funding_desc:0 "Soylu [ROOT.GetAdjective] hükümdarlarımız aydınlanmaya adanmıştır ve bu yüzden, egemenliğimizin önce şiddetle ve nihayetinde sadece iyilikle genişlemesi için gereken bilimsel ilerlemeye hamilik yapmaktan mutluluk duyarlar."
 NOR_restart_public_investment:0 "Kamu Yatırımını Yeniden Başlat"
 NOR_restart_public_investment_desc:0 "Altyapımızın ve ekonomimizin ihmal nedeniyle çürümesine izin verme zamanı değil, İşçi hükûmeti bir kez daha ülkenin geleceğine yatırım yapmalı, ister sivil üretim olsun, ister umduğumuzdan daha erken gelebilecek bir savaş için hazırlıklar olsun."
 NOR_restore_public_trust_in_the_storting:0 "Halkın Storting'e Güvenini Geri Kazandır"
 NOR_restore_public_trust_in_the_storting_desc:0 "Onlarca yıllık istikrarsızlık ve eylemsizlikten sonra, genel nüfusun parlamentomuz olan Storting'e güvenmemesi anlaşılabilir bir durumdur. Kamu güveni olmadan, ülkemizi istikrara kavuşturmak için gereken önlemleri alamayacağız."
 NOR_revamp_hydroelectric_capacity:0 "Hidroelektrik Kapasitesini Yenile"
 NOR_revamp_hydroelectric_capacity_desc:0 "Alüminyum, uçakların ve diğer savaş aletlerinin yapımı için hayati önem taşır, ancak boksiti Alüminyuma işlemek için gereken enerji miktarı onu maliyetli bir süreç haline getirir. Neyse ki, [NOR.GetName] birçok gölümüzü ve nehrimizi hidroelektrik barajlarına dönüştürmek için mükemmel bir topoğrafyaya sahiptir. Böylece, büyük boksit yataklarımız olmamasına rağmen gereken alüminyumu üretebiliriz."
 NOR_revive_pomor_trade:0 "Pomor Ticaretini Canlandır"
 NOR_revive_pomor_trade_desc:0 "Yüzyıllar boyunca kuzeydeki halklarımız Beyaz Deniz'deki Pomor bölgesiyle ticaret yaptı. Her iki nüfusun da refahını sağladı, ancak emperyal güçler ve kapitalizm buna bir son verdi. Uzun zamandır kardeşlerimizle olan ticareti canlandıralım."
 NOR_reviving_the_norgesveldet:0 "Norgesveldet'i Canlandırma"
 NOR_reviving_the_norgesveldet_desc:0 "Atalarımız herkesten korkulurdu, görebildikleri ve yelken açabildikleri her yere baskın düzenleyip fethederlerdi. Geçmişe bakmalı ve o ruhu geri getirmeliyiz. Çocukları geceleri uykusuz bırakan yeni viking tehdidi olabiliriz."
 NOR_rikstanken:0 "Rikstanken"
 NOR_rikstanken_desc:0 "Acı gerçek şu ki, [ROOT.GetName] daha önce hiç tank sahibi olmadı. Herhangi bir zafer şansımız olmasını umuyorsak, zırhlı bir zorunluluktur. Soru şu ki, yaklaşımımız ne olmalı? Çok sayıda tank, bizim durumumuzdaki bir ülke için maliyetli bir teklif olabilir; belki suları tek bir tankla test edebiliriz? Ya da belki, ulusun tankları için paradan başka bir şey feda edebiliriz."
 NOR_rule_the_northern_sea:0 "Kuzey Denizi'ne Hükmet"
 NOR_rule_the_northern_sea_desc:0 "Krallığımız Kuzey Denizi'ne doğru genişlesin! Gemilerimiz, krallığımızı ufka uzatan kol olacaktır. Bunun gerçekleşmesi için, böyle bir hakimiyeti sürdürmek için gereken deniz üslerine ve daha ileri gitmemizi sağlayacak pratiklere ve tekniklere ihtiyacımız var."
 NOR_sabotage_unions:0 "Sendikaları Sabote Et"
 NOR_sabotage_unions_desc:0 "İşçilerin insan hakları dediği şey, bizim için endüstriyel büyümeye engeldir. Sendikalist hareketi içeriden ve dışarıdan boğabiliriz, böylece askeri hazırlığımıza yönelik her türlü engeli kolayca kaldırabiliriz."
 NOR_secret_police:0 "Gizli Polis"
 NOR_secret_police_desc:0 "[NOR.GetAdjective] nüfusu üzerindeki pençemizi sıkılaştırma zamanı geldi. Bazı mayalanma cepleri fark ediyoruz. Önemsiz görünebilirler, ancak onları kontrol altında tutmak için taktikler geliştirmeye zaman bulamadan birleşik bir cephe haline gelebilirler. Sonuçta, bir bıçağın keskinliğini korumanın en iyi yolu onu sık sık kullanmaktır."
 NOR_secure_denmark:0 "Danimarka'yı Güvence Altına Al"
 NOR_secure_denmark_desc:0 "[NOR.GetName]'ın güneyinde yer alan büyük güçler, eski efendimiz [DEN.GetName] tarafından uzun süredir uzak tutuluyordu, eğer onların zayıf ordusu teslim olsaydı, [NOR.GetName]'a açılan kapı ardına kadar açık olurdu. Bu kapıyı kendimiz tutarak bunu önlemeliyiz."
 NOR_secure_the_swedish_iron_ore:0 "İsveç Demir Cevherini Güvence Altına Al"
 NOR_secure_the_swedish_iron_ore_desc:0 "[SWE.GetName], kuzey limanları donduğunda Narvik üzerinden akan, topraklarının altında muazzam miktarda yüksek kaliteli demir cevherine sahiptir. Bu cevher kaynağını bu kadar açıkta ve herhangi bir yabancı tiranın kolayca erişebileceği bir şekilde bırakmak kabul edilemez, düşmanlarımız aynı şeyi düşünmeden önce onu ele geçirmeliyiz."
 NOR_send_the_king_back_to_denmark:0 "Kralı Danimarka'ya Geri Gönder"
 NOR_send_the_king_back_to_denmark_desc:0 "Kraliyet Ailesi'ni etrafta tutarsak kendimize komünist diyemeyiz. İktidarın kollarını ve üretim araçlarını ele geçirmişken, bir monarşi karşı-devrim ve muhalefet için bir toplanma noktası oluşturacaktır. Kraliyet ailesiyle hızla ilgilenmeliyiz."
 NOR_send_the_storting_home:0 "Storting'i Eve Gönder"
 NOR_send_the_storting_home_desc:0 "Ulusal parlamentomuz son nefesini çok zaman önce verdi. Onu hayatta tutmak sadece onun acısını ve açıkçası bizimkini de uzatacaktır. Bırakın politikacılar evlerine dönüp aileleriyle vakit geçirsinler, Kral'ın adamları meseleleri kendi ellerine alacak."
 NOR_shield_of_the_north:0 "Kuzeyin Kalkanı"
 NOR_shield_of_the_north_desc:0 "Eğer kullanmıyorsan bir kılıç nedir ki? Altındaki tebaayı korumayacaksa bir kalkan nedir ki? Kraliyet ailemiz sadece [NOR.GetNameDef]'i değil, görevleri gereği kendilerinin olan krallıkları ve toprakları da korumalıdır. Hukuken olmasa bile."
 NOR_social_incrementalism:0 "Sosyal Artımcılık"
 NOR_social_incrementalism_desc:0 "Zorlu Otuzlar [NOR.GetAdjective] halkının zihninde sadece bir anı haline gelirken, muhafazakârlığın arı kovanını dürtmekten kaçınmak için yavaş da olsa sosyal ilerlemeyi aramalıyız."
 NOR_soviet_industrial_cooperation:0 "Sovyet Endüstriyel İşbirliği"
 NOR_soviet_industrial_cooperation_desc:0 "Daha büyük, daha gelişmiş ülkelerden yardım istemekte utanılacak bir şey yok. Devrimi savunma savaşında her işçi, köylü ve mühendis bizim yoldaşımızdır ve roller tersine dönseydi bizim de yapacağımız gibi, sanayimizi geliştirmeleri için yardımlarını memnuniyetle karşılayacağız."
 NOR_squash_dissent:0 "Muhalefeti Ez"
 NOR_squash_dissent_desc:0 "Çabalarımızın meyvelerinin haşereler tarafından çalınmasına izin veremeyiz. Muhalefeti bulup kesin olarak ortadan kaldırmak zorunludur. Sonuçta, hükûmetimizden şüphe duyan herkes bizim düşmanımızdır."
 NOR_start_rearmament:0 "Yeniden Silahlanmayı Başlat"
 NOR_start_rearmament_desc:0 "Belki de topyekûn silahsızlanma, savaştan kaçınmanın umduğumuz kesin yolu değildir. Toprağımıza olası bir saldırıya karşı hazırlıklara başlasak iyi olur."
 NOR_stavanger_airfield:0 "Stavanger Hava Alanı"
 NOR_stavanger_airfield_desc:0 "Stavanger havaalanının yakında tamamlanması planlanıyor ve konumu askeri bir hava alanı için mükemmel. Bu sivil havaalanını askeri bir hava üssü olarak kullanmak için gerekli ayarlamaları yapabiliriz."
 NOR_submarine_fleet:0 "Denizaltı Filosu"
 NOR_submarine_fleet_desc:0 "Denizaltılar, verimlilikleri ve gizlilikleriyle, denizler üzerindeki savaşın gidişatını her seferinde bir torpido ile değiştirebilir. Şansımızı en üst düzeye çıkarmayı umuyorsak, daha fazla ve daha iyi denizaltı yapmalıyız."
 NOR_support_finland_in_winter_war:0 "Kış Savaşı'nda Finlandiya'yı Destekle"
 NOR_support_finland_in_winter_war_desc:0 "Bolşevikler Finlandiya için geliyor ve orada duracaklarına inanmak için hiçbir nedenimiz yok. Doğudaki kızıl ayı hepimizi yutmadan önce Fin kardeşlerimizi desteklemeliyiz."
 NOR_swedish_claims:0 "İsveç Üzerindeki Hak İddiaları"
 NOR_swedish_claims_desc:0 "[NOR_GetSwedishClaimsDesc]"
 NOR_swedish_claims_desc_fas:0 "İskandinavya'daki monarşilerin tarihi uzun ve karmaşık bir karmaşadır, ancak bunu kendi avantajımıza kullanabiliriz. İsveç, bir zamanlar ulusumuza ait olan tüm bölgeleri çaldı, intikamı [SWE.GetAdjective]'i işgal etmek ve imparatorluğumuzu tarihi [NOR.GetAdjective] topraklarının bir karışımına dönüştürmek için gerekçemiz olarak kullanabiliriz."
 NOR_swedish_claims_desc_mon:0 "İstemeyerek de olsa, tarihimiz ve kraliyet ailelerimiz [SWE.GetNonIdeologyName]'ınkine bağlı olmuştur. Yüzyıllardır süren bu git gel sırasında, [SWE.GetAdjective]lar geniş toprak parçalarını çaldı; Jämtland, Härjedalen ve Bohuslän. Suçlunun Bernadotte, Vasa, Oldenburg Hanedanı ya da başka bir şey olması önemli değil. İntikamımızı alacağız ve topraklarımızı geri alacağız"
 NOR_tank_procurement:0 "Tank Tedariki"
 NOR_tank_procurement_desc:0 "Yerli tank programımız 20. yüzyılın zırhlı savaşı için açıkça yetersizdir. İyi tarafı, gerekli uzmanlığa ve üretim hacmine sahip birçok ülkenin zırhlı araçlarını satışa sunuyor olabileceğidir, bu [ROOT.GetAdjective] Ordusunu bu yüzyıla taşımak için harika bir kestirme yol olacaktır."
 NOR_the_administrative_council:0 "İdari Konsey"
 NOR_the_administrative_council_desc:0 "Kabul etmek gerekir ki, [NOR.GetAdjective] işgali daha iyi gidebilirdi. Belki bir yaklaşım değişikliği yardımcı olur, bu yüzden doğrudan yönetmek yerine, nüfusa bir özerklik görünümü vermek için yerel işbirlikçilerden bir konsey atayabiliriz."
 NOR_the_chamberlains_overture:0 "Kraliyet Mabeyincisinin Uvertürü"
 NOR_the_chamberlains_overture_desc:0 "Storting önemsizliğe doğru topallarken, Soylu değerlerin bir örneği olan, Jarlsberg Feodal Kontluğu'nun ikinci varisi ve mütevazı Kralımız VII. Haakon'un Lord Şansölyesi Baron Peder Anker Wedel-Jarlsberg, geleceğin çözümü için geçmişe bakmamız gerektiğini öne sürüyor. Yani, belki de kraliyet aygıtı tüm hükûmetin kontrolünü ele alabilir."
 NOR_the_crowns_executive_powers:0 "Tahtın Yürütme Yetkileri"
 NOR_the_crowns_executive_powers_desc:0 "Kral, mutlak gücü kullanma çağrılarını reddetmeye devam ederken, ona yürütme yetkileri vermekten başka seçeneğimiz yok. Siyasi uykusundan uyandığında, [ROOT.GetNonIdeologyName]'ı zafere götürecek araçlara sahip olacak!"
 NOR_the_glucksburg_sea_wall:0 "Glücksburg Deniz Duvarı"
 NOR_the_glucksburg_sea_wall_desc:0 "Jarlsberg Kontu, şanlı kralımız VII. Haakon'un mensup olduğu hanedan olan Glücksburg Hanedanı adına bir deniz duvarı inşaatına başladı. Kraliyet Ailesi'nin gücünün bir vekili olarak duracak, düşmanlarımızı uzak tutacak ve fiyortlarımızı ve dağlarımızı zarardan koruyacaktır."
 NOR_the_kingdom_of_norway:0 "Norveç Krallığı"
 NOR_the_kingdom_of_norway_desc:0 "Zamanı geldi, Kral Haakon bilsin ya da bilmesin. Demokrasi ve halk yönetimi iddialarını bir kenara bırakalım ve monarşinin zırhlı eldiveninin düşmanlarımızı paramparça etmesine izin verelim. Kralın kendi yeniden taç giyme törenine katılmaktan başka seçeneği olmayacak."
 NOR_the_kings_abdication:0 "Kralın Tahttan Çekilmesi"
 NOR_the_kings_abdication_desc:0 "Kral ve Mabeyincisi, işgalcilerimizin göz korkutucu gücünü fark ettiklerinde, halklarına verecek veya onlardan alacak hiçbir şeyleri kalmadı. Kral VII. Haakon, nadir bir halka açık görünümde, her [NOR.GetAdjective] vatandaşının topraklarımızı dolduran faşistlere boyun eğmesi gerektiğini duyurdu."
 NOR_the_kings_line:0 "Kralın Hattı"
 NOR_the_kings_line_desc:0 "Krallığımızın sınırları etrafında uzanan sığınaklar ve makineli tüfek yuvaları, Kral'ın direnişinin ve iradesinin fiziksel bir tezahürüdür. Adamlarımız kanlarını döksün ki kralın hattı dayansın ve krallığı bozulmadan kalsın."
 NOR_the_kings_no:0 "Kralın Hayırı"
 NOR_the_kings_no_desc:0 "Kralımız VII. Haakon, düşmanımızın boyun eğme talebini reddetti. [NOR.GetName] bir toprak değil, bir halkdır ve [NOR.GetAdjective] halkı, tüm toprakları alınmış olsa bile savaşmaya devam edecektir."
 NOR_the_neutrality_guard:0 "Tarafsızlık Muhafızları"
 NOR_the_neutrality_guard_desc:0 "Başkaları, bir düşman üzerinde avantaj elde etmek için tarafsız konumumuzu kötüye kullanabilir ve sınırlarımızı savunamadığımızda bizi onlarla savaşa sürükleyebilir. Özel bir Tarafsızlık Muhafızı, hiçbir yabancı savaşan tarafın güvenimizi ihlal etmeyeceğini garanti edebilir."
 NOR_the_royal_guards_battalion:0 "Kraliyet Muhafızları Taburu"
 NOR_the_royal_guards_battalion_desc:0 "Bir süredir, Kraliyet Muhafızları en seçkin savaş gücümüz olmuştur, bu programı genişletebilir ve eğitimlerini geliştirebiliriz ki silahlı kuvvetlerimizin öncüsü olabilsinler."
 NOR_the_royal_norwegian_navy:0 "$NOR_royal_navy_dmod$"
 NOR_the_royal_norwegian_navy_desc:0 "Dünyanın en uzun kıyı şeritlerinden birine sahip olmanın avantajları vardır, ancak aynı zamanda onu savunmak için ekstra çaba harcanması gerektiği anlamına da gelir. Donanmamız, ulusumuzun savunmasının ilk hatları olacaktır."
 NOR_the_secret_army:0 "Gizli Ordu"
 NOR_the_secret_army_desc:0 "1918'den beri Hemmelige Hæren olarak adlandırılan özerk bir güç, bir komünist devralma riski durumunda harekete geçmek için [NOR.GetName]'ın her yerine yerleştirilmiş ve gizlenmiştir. Komünizme karşı yeminleri, Faşizme ve daha da önemlisi, kendi devralmamıza destek olarak saptırılabilir."
 NOR_the_seeds_of_the_revolution:0 "Devrimin Tohumları"
 NOR_the_seeds_of_the_revolution_desc:0 "Kapitalizm kendi yıkımının araçlarını yarattı ve işte biz burada devreye giriyoruz. Şimdi görevimiz, [NOR.GetName] halkına daha parlak bir geleceğin tohumlarını ekmek. Sonra kendi emeğimizin meyvesini toplayana kadar zaman kollayacağız."
 NOR_the_stumbling_storting:0 "Tökezleyen Storting"
 NOR_the_stumbling_storting_desc:0 "Siyasi istikrarsızlık tünelinin sonunda bir ışık gördük, ama şimdi daha fazla kaosa doğru titriyor. Johan Nygaardsvold'un tüm çabalarına rağmen, Storting'in kendi içindeki çekişmeleri onu giderek daha fazla kaosa sürüklüyor."
 NOR_the_voice_of_the_people:0 "Halkın Sesi"
 NOR_the_voice_of_the_people_desc:0 "Halkı dinlemeli ve bu sesi yükseltecek araçları getirmeli ve Marx'ın gerçeklerini yaymalıyız. Ancak o zaman Devrimimiz aşağıdan yukarıya gerçekleştirilecektir. Bırakın halk, sermayenin baskısından kurtulma taleplerini haykırsın."
 NOR_the_weapons_of_conquest:0 "Fetih Silahları"
 NOR_the_weapons_of_conquest_desc:0 "Düşmanlarımızı fethetmek, sadece adamlardan ve savaşma iradesinden daha fazlasını gerektirir. Birçoğu ölecek, ancak şanslarını artırmak için araçlar yapmak, sınırlarımızı daha da genişletebileceğimiz anlamına gelir."
 NOR_ulfhedhnar_wolf_coats:0 "Ulfheðnar"
 NOR_ulfhedhnar_wolf_coats_desc:0 "Kral Harald Fairhair'i koruyan bir berserker gücü olan eski Kurt Postlular gibi, bu yeni Ulfheðnar, topraklarımızı savunmak ve genişletmek için kuvvetlerimizin öncüsü olacak seçkin savaşçı kastı olacaktır."
 NOR_uproot_secret_army:0 "Gizli Orduyu Kökünden Sök"
 NOR_uproot_secret_army_desc:0 "1918'de bir önceki hükûmet tarafından kurulan gizli ordu, hiç gerçekleşmeyen bir komünist darbeyi bekleyerek gölgelerde gizlendi ve bu arada birçoğu sadık faşistlere radikalleşti. Bu adamlar sadece her an yüzümüzde patlayabilecek bir saatli bomba, onlarla ilgilenilmeli."
 NOR_use_xu:0 "XU'yu Kullan"
 NOR_use_xu_desc:0 "İşgal altındaki [NOR.GetName]'da değerli bilgiler var. Direniş savaşçılarımız, müttefiklerimiz ve sürgündeki kendi savaş çabalarımız için istihbarat sağlayabilecek bir örgüte ihtiyacımız var."
 NOR_vote_of_no_confidence:0 "Güvensizlik Oylaması"
 NOR_vote_of_no_confidence_desc:0 "Nygaardsvold ve onun işçi partisinin Bolşevikleri ve Nazileri uzak tutacağına güvenebilir miyiz? Bu silahsızlanması, Troy'un kapılarını açan bir Yunanlıdan çok, toprağını Komünizmden savunmaya hazır bir Başbakandan daha çok benziyor. Bu toy ulusumuzu [SOU.GetNameDef]'e teslim etmelerine izin veremeyiz."
 NOR_war_in_finland:0 "Finlandiya'da Savaş"
 NOR_war_in_finland_desc:0 "Finlandiya halkı yeterince acı çekti, onları Kapitalizm'den kurtarmak için kuvvetlerimizi [SOU.GetName] ile birleştirmeliyiz. Bu, tüm İskandinav halklarını kurtarmada sadece ilk adım olacak."
 NOR_weathering_the_storm_to_come:0 "Gelecek Fırtınayı Atlatmak"
 NOR_weathering_the_storm_to_come_desc:0 "Halkımızın refahını artırmaya yönelik önceki girişimlerimize rağmen, şimdi her yandan artan tehditlerin gerçeğiyle yüzleşmeliyiz. Avrupa genelinde yükselen fırtına için hazırlıklara başlamalıyız. Eğer onu savunamazsak inşa ettiğimiz her şey boşa gidecektir."
 NOR_worker_armies:0 "İşçi Orduları"
 NOR_worker_armies_desc:0 "Yapılacak çok iş var ve hepsini bir anda yapacak yeterli nüfus yok. İşçileri askeri bölükler ve tümenler gibi bir hiyerarşi içinde kurarak, her seferinde bir proje ile tekrar ayağa kalkmaya başlayabiliriz."
 NOR_workers_and_farmers_rise:0 "İşçiler ve Çiftçiler Ayaklanıyor"
 NOR_workers_and_farmers_rise_desc:0 "Zemin hazırlandı, tohum ekildi ve Devrim ateşi yakılmak üzere. Bırakın [NOR.GetNonIdeologyName] işçileri ve çiftçileri ayaklansın ve üretim araçlarını kapitalistlerin ve toprak sahiplerinin kanlı ellerinden alsın."
 SWE_RIT_communist:0 "Teknoloji Enstitüsü"
 SWE_RIT_historical:0 "Kraliyet Teknoloji Enstitüsü"
 SWE_a_plea_of_desperation:0 "Bir Umutsuzluk Yalvarışı"
 SWE_a_plea_of_desperation_desc:0 "Egemenliğimizin sönmesini isteyen rakiplerle birden fazla taraftan çevrili olarak, yaklaşan saldırıdan sağ çıkacaksak potansiyel müttefikler aramak için çok az seçeneğimiz var."
 SWE_acquire_ww2_tanks_and_wrecks:0 "Savaş Alanı Tank Enkazlarını Edin"
 SWE_acquire_ww2_tanks_and_wrecks_desc:0 "Avrupa'da toz duman dağılırken, savaş alanlarında kendi tasarımlarımızı nasıl geliştireceğimiz konusunda araştırma ve geliştirme için kullanabileceğimiz sayısız terk edilmiş tank yatıyor. Belki de bu savaş ganimetleri başkaları tarafından alınmadan önce bu durumdan faydalanmanın zamanı gelmiştir."
 SWE_affordable_housing:0 "Uygun Fiyatlı Konut"
 SWE_affordable_housing_desc:0 "Şehirlerde konut standartları iyileşmeye başlasa da, çok fazla insan hâlâ karşılanamaz kiralarla yoksulluk içinde kilitli kalmış durumda. Durumu düzeltmek için herkesin uygun fiyatlı konuta erişimini sağlamalıyız."
 SWE_airforce_modernization:0 "Hava Kuvvetleri Modernizasyonu"
 SWE_airforce_modernization_desc:0 "Hava kuvvetlerimizin en güncel teçhizata sahip olmasını sağlamak, onu tam olarak kullanamıyorlarsa anlamsızdır. Pilotlarımızın son deneyimlerinin hava doktrinimize dahil edilmesini sağlamalıyız."
 SWE_align_more_closely_with_the_landsorganisationen:0 "Landsorganisationen ile Daha Yakından Hizalan"
 SWE_align_more_closely_with_the_landsorganisationen_desc:0 "Güçlü sendikalar ve işçi korumaları, herhangi bir modern iş gücünde bir zorunluluktur. Tüm işçilerin iyiliği için bu sendikalarla güçlü bağlar kuracağız."
 SWE_align_more_closely_with_the_landsorganisationen_tt:0 "Danışmanların kilidini açar:\n"
 SWE_all_cards_on_deck:0 "Tüm Kartlar Masada"
 SWE_all_cards_on_deck_desc:0 "Deniz üzerindeki uzun süren çatışmalar, savaşın gidişatını pek değiştirmez. Donanmamız yola çıktığında, hedefi düşmanı tek bir kesin darbeyle ezmek olacaktır."
 SWE_allow_landsverk_to_operate:0 "Landsverk'in Bağımsız Çalışmasına İzin Ver"
 SWE_allow_landsverk_to_operate_desc:0 "Landsverk, [GER.GetAdjective] ordusunun Versailles Antlaşması'nın zırhlı araç geliştirme konusundaki kısıtlamalarını aşması için uzun süredir bir boşluk olarak faaliyet göstermiştir. [GER.GetName] ile yakın bağları sürdürmek ve teknolojik gelişmelerinden yararlanmak için çalışmalarına devam etmelerine izin vermeliyiz."
 SWE_allow_landsverk_to_operate_tt:0 "§R[GER.GetNameDef] ile savaşa girmek, Landsverk'teki [GER.GetAdjective] işçilerinin İsveç'teki 2 Landsverk fabrikasına geçici olarak zarar vermesine izin verecektir§!"
 SWE_appeal_for_support:0 "Destek Çağrısı"
 SWE_appeal_for_support_desc:0 "[SWE.GetName]'ın aristokratik düzeni, on yıllar boyunca güçlerini ve nüfuzlarını aşındırdı, ancak henüz sönmedi. Onların desteğini ve kaynaklarını toplayarak, ulusu daha doğal bir yönetim biçimine döndürebiliriz."
 SWE_appeal_for_support_tt:0 "Milliyetçi hareket için siyasi destek kazanmak üzere §Y'Destek Çağrısı' kararlarının§! kilidini açar."
 SWE_approach_the_allies:0 "Müttefiklere Yaklaş"
 SWE_approach_the_allies_desc:0 "[ENG.GetNameDefCap] ve müttefikleri, Avrupa'daki herhangi bir çatışmadan nihayetinde galip çıkacaktır. Bu nedenle, onların düşmanı olma niyetimiz olmadığını açıkça belirtmemiz akıllıca olacaktır."
 SWE_aquire_modern_panzers:0 "Modern Panzerler Edin"
 SWE_aquire_modern_panzers_desc:0 "Teknolojik durgunluğun, en güçlü görünen ulusların bile savaş zamanlarında çökmesine neden olduğu kanıtlanmıştır. Bu nedenle, kendimiz böyle bir kaderden kaçınacaksak, ordu için modern zırhlı araçlar edinmek bir önceliktir."
 SWE_archapeligo_harrasment:0 "Takımada Tacizi"
 SWE_archapeligo_harrasment_desc:0 "Kıyılarımız, olası herhangi bir saldırgan için bir engeldir. Ancak takımadalarla olan aşinalığımızdan, donanmaya bunun için kaynak verirsek bölgedeki düşman gemilerini daha iyi taciz etmek için daha fazla yararlanabiliriz."
 SWE_as_the_barometer_falls:0 "Barometre Düşerken"
 SWE_as_the_barometer_falls_desc:0 "Sebebi ne olursa olsun, topraklarımıza bir tecavüzle hazırlıksız yakalanmayı göze alamayız. Bu nedenle, silahlı kuvvetlerin bu tür herhangi bir senaryoyla başa çıkmak için acil durum planlarına ve yeterli eğitime sahip olmasını sağlamalıyız."
 SWE_attack_Landsorganisationen:0 "Landsorganisationen'a Saldır"
 SWE_attack_Landsorganisationen_desc:0 "Eğer ulusu Bolşevizm'den kurtaracaksak, Sosyal Demokratlar aşılması gereken büyük bir engeldir. Onlarla küçük seçimlerde doğrudan savaşmak yerine, kaynaklarımızı partiyi finanse eden sendikalara karşı kamuoyunu döndürmek için kullanacağız."
 SWE_beneath_sticks_and_stones:0 "Sopaların ve Taşların Altında"
 SWE_beneath_sticks_and_stones_desc:0 "Düşman uçakları, savaş alanındaki hedeflerini göremiyorlarsa etkinliklerinin çoğunu kaybederler. Kuvvetlerimizi kamuflaj tekniklerinin kullanımında eğiterek, düşmanı bu çok önemli avantajdan mahrum bırakabiliriz."
 SWE_betray_germany_plan:0 "Bir İsveç Rike'sine Doğru"
 SWE_betray_germany_plan_desc:0 "[GER.GetNameDefCap] aşırı gerilmiş ve çökmeye mahkûm. Bu nedenle, onların çöküşünü hızlandırarak kendi geleceğimizi güvence altına almak için planlar yapmalıyız. Ancak bu, yalnızca [GER.GetNameDef]’nin düşmanları bizimle ayrı bir barış yapmaya istekliyse mümkün olacaktır…"
 SWE_bofors_anti_tank_gun:0 "Bofors Anti-Tank Topu"
 SWE_bofors_anti_tank_gun_desc:0 "Bofors’un silah yapımındaki uzmanlığı vazgeçilmez olduğunu kanıtladı. Biraz yatırımla, rakiplerimizin bize fırlatabileceği en iyi zırhlı araçlarla başa çıkmak için yeni nesil bir anti-tank topu yaratabilirler."
 SWE_bofors_anti_tank_gun_tt:0 "§HBofors Anti Tank Topu§!'nu etkinleştirir!\nDestek Anti-Tank Sert saldırı: §G+%10§!\nDestek Anti-Tank Delme: §G+%10§!\nAnti-Tank Sert saldırı: §G+%10§!\nAnti-Tank Delme: §G+%10§!\nMotorlu Anti-Tank Sert saldırı: §G+%10§!\nMotorlu Anti-Tank Delme: §G+%10§!\nHafif Tank Avcısı Sert saldırı: §G+%10§!\nHafif Tank Avcısı Delme: §G+%10§!\nOrta Tank Avcısı Sert saldırı: §G+%10§!\nOrta Tank Avcısı Delme: §G+%10§!\nAğır Tank Avcısı Sert saldırı: §G+%10§!\nAğır Tank Avcısı Delme: §G+%10§!\nSüper Ağır Tank Avcısı Sert saldırı: §G+%10§!\nSüper Ağır Tank Avcısı Delme: §G+%10§!\nModern Tank Avcısı Sert saldırı: §G+%10§!\nModern Tank Avcısı Delme: §G+%10§!"
 SWE_bofors_fly_swatter:0 "Bofors Sinek Kapanı"
 SWE_bofors_fly_swatter_desc:0 "Bofors, uçaksavar teknolojisinde yeni bir standart belirleme potansiyeline sahiptir. Onlara bunu yapmaları için kaynakları vermeli ve İsveç semalarının düşman uçaklarından temiz kalmasını sağlamalıyız."
 SWE_bornholm_crisis:0 "Bornholm Krizi"
 SWE_bornholm_crisis_desc:0 "Bornholm adaları, [DEN.GetName]'a yasal olarak asla devredilmemiş olmasına rağmen, yüzyıllar önce isyan ettiğinde tarafımızdan kaybedildi. Aşağı Baltık Denizi'ni kontrol ettiği için stratejik olarak önemli olan bu yeri [DEN.GetName]'ın savunamayacağı açıktır. Biz savunabiliriz ve güvenliğimiz için kontrolünü yeniden ele geçirmeliyiz."
 SWE_cement_control_of_the_baltic:0 "Baltık Denizi'nin Kontrolünü Pekiştir"
 SWE_cement_control_of_the_baltic_desc:0 "Deniz gücümüzü Baltık Denizi boyunca oluşturup yansıtırsak, savaşın hiçbir İskandinav Ulusunun kıyılarına asla ulaşmamasını sağlayabiliriz."
 SWE_central_nordic_army_command:0 "Merkezi İskandinav Ordu Komutanlığı"
 SWE_central_nordic_army_command_desc:0 "İskandinav Savunma Konseyi üyelerinin ordularını merkezileştirerek, kuvvetlerimizi uyumlu bir birim olarak daha verimli kullanabiliriz."
 SWE_central_nordic_army_command_tt:0 "\nHer §Yİskandinav savunma konseyi üyesinin§! ordusunu ve generalini [SWE.GetName]'a devreder.\n§Y[SWE.GetName]§! hariç her §Yİskandinav savunma konseyi üyesi§! kazanır:"
 SWE_central_nordic_army_command_tt_2:0 "Kabul etme olasılıkları daha yüksek olacaktır eğer:\n -Bize karşı §Yyüksek bir görüşleri§! varsa\n -Onlardan daha güçlü bir §Yordumuz§! varsa\n -Onlarla aynı §Yhükûmet tipine§! sahipsek\n -Onları §Ygaranti§! altına alırsak"
 SWE_centralized_military_aid:0 "Merkezileştirilmiş Askerî Sanayiler"
 SWE_centralized_military_aid_desc:0 "Bizim ve üye devletlerin askeri yeteneklerinde iyileştirmeler yapmamız gerekiyor. Silah üretimine yatırım yapmak, ordularımıza sınırlarımızı savunmak için gerekli araçları sağlayacaktır."
 SWE_centralized_military_aid_tt:0 "Her §Yİskandinav savunma konseyi üyesi§! kazanır:\n   §G1§! İnşaat Alanı ekle\n   §G1§! §YAskerî Fabrika§! ekle"
 SWE_civil_war_tt:0 "§Y[ROOT.GetFlag][ROOT.GetName]§!'da §RNasyonal Sosyalistler ile mevcut hükûmet arasında§! §Rbir iç savaşı tetikleyecek!§!"
 SWE_coalition_war_cabinet:0 "Demokratik Savaş Kabinesi"
 SWE_coalition_war_cabinet_desc:0 "Dünyadaki son olaylar ulusu sarstı ve çatışmanın [SWE.GetName]'a yayılacağı korkularını ateşledi. Bu zor zamanlarda birlik duygusunu teşvik etmek için, Riksdag'daki büyük partilerin önde gelen üyelerinden oluşan bir koalisyon savaş kabinesi oluşturacağız."
 SWE_coalition_war_cabinet_tt:0 "§YMevcut liderimize özellikler eklemek için kararların kilidini açar§!"
 SWE_coastal_support:0 "Kıyı Desteği"
 SWE_coastal_support_desc:0 "Donanmamız, düşman uluslarının kıyılarına yapılacak amfibi saldırıları desteklemek için silahlarını kullanma konusunda iyice eğitilmelidir."
 SWE_continue_the_second_industrial_revolution:0 "İkinci Sanayi Devrimine Devam Et"
 SWE_continue_the_second_industrial_revolution_desc:0 "Devam eden sanayileşme, halkımız için artan refah ve güvenliğin anahtarıdır. Bu nedenle, yeni teknolojilerin gücünden yararlanmalı ve [SWE.GetName] genelinde sürekli artan bir sanayileşme hızı izlemeliyiz."
 SWE_crisis_affecting_variables:0 "Kabul etme olasılıkları daha yüksek olacaktır eğer:\n -Bize karşı §Yyüksek bir görüşleri§! varsa\n -Onlardan daha güçlü bir §Yordumuz§! varsa\n -%40'tan az §YSavaş Desteği§! varsa\n -Bir ittifakta değillerse"
 SWE_crusade_against_bol:0 "Bolşevizme Karşı Haçlı Seferi"
 SWE_crusade_against_bolshevism:0 "[AAT_crusade_against_sov]"
 SWE_crusade_against_bolshevism_desc:0 "[SOV.GetNameDefCap], yüzyıllardır gördüğümüz geleneksel Avrupa değerlerine yönelik en büyük tek tehdittir. Onu sadece kontrol altına almak artık yeterli değil, Bolşevizme karşı yeni bir haçlı seferine girişmeli ve onu yok etmeliyiz."
 SWE_crusade_against_bolshevism_tt:0 "\nEğer §Y$SWE_crusade_against_the_eastern_threat$§! aktifken §Y[SWE.GetName]§! veya herhangi bir ittifak üyesi bu eyaletlerden herhangi birini ele geçirirse:\n§Y[195.GetName]§!,§Y[206.GetName]§!,§Y[202.GetName]§!,§Y[242.GetName]§!,§Y[219.GetName]§!,§Y[137.GetName]§!,§Y[218.GetName]§!,§Y[217.GetName]§!,§Y[252.GetName]§!,§Y[249.GetName]§!,§Y[229.GetName]§!,§Y[247.GetName]§!,§Y[408.GetName]§!,§Y[214.GetName]§! tam 365 gününe sıfırlanacaktır."
 SWE_crusade_against_rus:0 "Rus Emperyalizmine Karşı Haçlı Seferi"
 SWE_danish_alignment:0 "Danimarka Hizalanması"
 SWE_danish_alignment_desc:0 "[DEN.GetName] stratejik bir konumda ve komşularından önemli ölçüde daha zayıf, bu da onlardan birinin [DEN.GetAdjective]'i bağımsızlığından mahrum bırakmaya çalışmasını neredeyse kaçınılmaz kılıyor. Bu nedenle, fırsatı kaybetmeden önce ilk biz saldırmalıyız."
 SWE_decentralized_nordic_army_command:0 "Merkezi Olmayan İskandinav Ordu Komutanlığı"
 SWE_decentralized_nordic_army_command_desc:0 "İskandinav Savunma Konseyi'nin ordu komutasını merkezileştirmek, komutan subaylar için çok fazla çıkar çatışmasına neden olacaktır. Üye devletlerin her birinin ulusal güvenliğinin tek garantisi, kendi kuvvetlerinin kontrolünü sürdürmektir."
 SWE_decentralized_nordic_army_command_tt:0 "\nHer §Yİskandinav savunma konseyi üyesi§! kazanır: §YKapsamlı Askerlik§!.\nHer §Yİskandinav savunma konseyi üyesi§! kazanır:"
 SWE_decentralized_nordic_army_command_tt_2:0 "Her §Yİskandinav savunma konseyi üyesi§!: "
 SWE_decentralized_nordic_volunteer_group:0 "İskandinav Gönüllü Grubu"
 SWE_decentralized_nordic_volunteer_group_desc:0 "Tüm İskandinavya'da pek çok yetenekli adam var; avcılar, keskin nişancılar ve benzerleri, orduda hizmet edebilecekler. Onları bulup askere almalıyız."
 SWE_decentralized_nordic_volunteer_group_tt:0 "Her §Yİskandinav savunma konseyi üyesi§! için §G+5000§! İnsan gücü kazan!\nHer §Yİskandinav savunma konseyi üyesi§!: Her §Yİskandinav savunma konseyi üyesi§! için §G+5000§! İnsan gücü!"
 SWE_decisive_battle_tactics:0 "Kesin muharebe taktikleri"
 SWE_deep_mining_complexes:0 "Derin Madencilik Kompleksleri"
 SWE_deep_mining_complexes_desc:0 "[SWE.GetName], yeraltında sıkışıp kalmış bol miktarda doğal kaynağa sahiptir. Bu kaynakları daha iyi kullanmak için madencilik sektörüne yatırımı artırmalıyız. Ayrıca, madenleri yok ederek, düşmanların muhtemelen istedikleri şeye erişimini engelleyerek bize yönelik saldırıları caydırabiliriz."
 SWE_defense_above_all:0 "Her Şeyden Önce Savunma"
 SWE_defense_above_all_desc:0 "Dünyanın bizimkinden farklı bir zaman çizelgesinde olduğu gerçeğiyle yüzleşmeliyiz ve artık herhangi bir savunma kabiliyeti olmaksızın devletimizin geleceği üzerine kumar oynayamayız."
 SWE_defense_act:0 "Savunma Yasası"
 SWE_defense_act_desc:0 "Savaş bir kez daha Avrupa'nın üzerinde beliriyor ve Riksdag'da verilmesi gereken zor kararlar var. Hiçbiri, Savunma Yasası'nın geçirilmesinden ve iktidar koalisyonunu parçalama potansiyelinden daha acil değil."
 SWE_defense_act_tt:0 "§YÖnümüzdeki seçimlerde siyasi liderlerimizi yeniden düzenleyebileceğiz§!"
 SWE_defense_in_depth:0 "Derinlemesine Savunma"
 SWE_defense_in_depth_desc:0 "Hiçbir düşman kuvveti, büyük ölçüde ikmal hatlarının kısıtlamaları ve askerlerin fiziksel ve zihinsel sınırlamaları nedeniyle sonsuz bir momentuma sahip değildir. Bu nedenle, daha sağlam bir savunma biçimi, delindiğinde çöken katı cephe hatlarına değil, düşmanın momentumunu giderek tüketen savunma katmanlarına dayanır."
 SWE_delegation_to_berlin:0 "Berlin'e Heyet"
 SWE_delegation_to_berlin_desc:0 "Kitleleri davamıza toplamada büyük adımlar atmış olsak da, henüz devletin kontrolünü ele geçirecek kadar desteğimiz yok. Ancak, [GER.GetLeader]'in mücadelemizde bize yardım etmek için [GER.GetAdjective] kuvvetlerini bir bedel karşılığında konuşlandırmaya açık olabileceğine dair söylentiler var."
 SWE_delegation_to_berlin_tt:0 "Eğer §Y[GER.GetFlag][GER.GetNameDef]§! talebi kabul ederse, iç savaşta §Y[ROOT.GetFlag][ROOT.GetAdjective]§! Nasyonal Sosyalistlerine katılacak ve §R[ROOT.GetFlag][SWE.GetNameDefCap] [GER.GetNameDef]'nin bir kuklası olacak!§!"
 SWE_demand_atlantic_resource_rights:0 "Atlantik Kaynak Hakları Talep Et"
 SWE_demand_atlantic_resource_rights_desc:0 "[DEN.GetAdjective] egemenliğini başarıyla aşındırdık, şimdi bir sonraki adımı atarak onları bölgedeki potansiyel saldırganlardan koruma bahanesiyle Atlantik'teki topraklarından mahrum bırakmalıyız."
 SWE_demand_demilitarization_of_finnish_border:0 "Fin Sınırının Askerden Arındırılması"
 SWE_demand_demilitarization_of_finnish_border_desc:0 "[FIN.GetName]'ın yeniden entegrasyon planlarımızın bir parçası olarak, doğudaki [SOV.GetAdjective]lara karşı güvenilir bir savunma sürdürmelerine izin verirken egemenliklerini aşındırmaya devam etmeliyiz. Bu nedenle, bizimle olan sınırlarının askerden arındırılmasını zorlamalıyız, bu da işlerine zorla müdahale etmemiz gerekirse bir savunma kurmalarını zorlaştıracaktır."
 SWE_domestic_designs:0 "Yerli Uçak Tasarımları"
 SWE_domestic_designs_desc:0 "SAAB'ın kuruluşu tamamlandığına göre, tasarım ve mühendislik uzmanlıklarını [SWE.GetAdjective] hava kuvvetlerinin özel gereksinimlerini karşılayan uçaklar yaratmak için kullanmalıyız."
 SWE_economic_deregulation:0 "Ekonomik Deregülasyon"
 SWE_economic_deregulation_desc:0 "Ulus varoluşsal tehditlerle karşı karşıyayken bu anlamsız refah harcamalarını desteklemeyi göze alamayız. Bu nedenle, sert bütçe kararları almalı ve özel sektörün devletin bıraktığı boşlukları doldurabilmesi için külfetli düzenlemeleri kaldırmalıyız."
 SWE_economic_deregulation_tt:0 "§YFolkhemmet§!'i kaldırır!"
 SWE_economic_independence:0 "Ekonomik Bağımsızlığı Koru"
 SWE_economic_independence_desc:0 "Şanlı devrimimizde [GER.GetAdjective] desteği için minnettar olsak da, onların vilayetlerinden bir diğeri olma niyetimiz yok. Ekonomimizi yeniden inşa etmek için, onu her şeyden önce ekonomik bağımsızlığı teşvik edecek şekilde yapılandırmamız gerekiyor."
 SWE_economic_integration:0 "Ekonomiyi [GER.GetNameDef] ile Entegre Et"
 SWE_economic_integration_desc:0 "Kanlı iktidara yükselişimizin ardından, ulus harabe halinde ve acilen yeniden inşaya ihtiyacı var. Sanayimiz darmadağınken, ekonomik güçlerinden yararlanmak için sanayimizi daha geniş [GER.GetAdjective] ekonomisiyle entegre etmeye çalışmalıyız."
 SWE_education_reform:0 "Stadsbarn"
 SWE_education_reform_desc:0 "Alva Myrdal’ın ‘Stadsbarn’ adlı kitabı, devletin çocukluk gelişimindeki rolü konusunda eğitimciler arasında bir heyecan yaratıyor. Alva ve kocası Gunnar, son kitapları ‘Nüfus Krizi’nde sosyal politika konusunda da bir tartışma başlattılar. Belki de bu üretken çifti, teoriyi pratiğe dökebilecekleri kabineye almalıyız."
 SWE_en_svensk_tiger:0 "En Svensk Tiger"
 SWE_en_svensk_tiger_desc:0 "Rakiplerimizin hakkımızda toplayabileceği herhangi bir bilgi, ulusal güvenliğimizi baltalamak için kullanılabilir. Bunu önlemek için, güçlü ve sessiz olmak, tıpkı heybetli kaplan gibi, [SWE.GetAdjective] karakterinin bir parçası olmalıdır."
 SWE_end_the_fubkrieg:0 "Modern Taktikler, Modern Savaş"
 SWE_end_the_fubkrieg_desc:0 "Savaş son yıllarda hızla değişti ve ordunun dünkü çatışmaya hazırlanması nedeniyle tüm çabalarımızın boşa gitmesini göze alamayız. En güncel taktikleri kullandıklarından emin olmak, ulusu savunmada çok önemli olacaktır."
 SWE_establish_nordland:0 "Reichsprotektorat Nordland"
 SWE_establish_nordland_desc:0 "[GER.GetNameDef]'nin rehberliğinde küllerimizden, daha önce hiç olmadığımız kadar güçlü bir şekilde yükseldik. Şimdi, davaya olan sadakatimiz için Doğu'nun derinliklerine doğru egemenliğimizin genişletilmesiyle ödüllendirileceğiz."
 SWE_establish_nordland_tt:0 "§Y[SWE.GetNameDef]§!, §Y$SWE_establish_nordland$§! olarak bilinecek!"
 SWE_establish_politburo:0 "Politbüro Kur"
 SWE_establish_politburo_desc:0 "Güçleri ellerinden alındığında, burjuvazi ve aristokrasi artık yoktur. Bu nedenle, nüfuzlarının son kalıntısı olan Riksdag'ı feshedeceğiz. Onun yerine, yeni bir işçi hükûmeti kuracağız."
 SWE_extend_the_time_of_preparedness:0 "Hazırlık Süresini Uzat"
 SWE_extend_the_time_of_preparedness_desc:0 "Bazıları [ROOT.GetName]'da işlerin derhal normale dönmesini tercih etse de, ufukta daha fazla tehdit var. Ulusu savunma yeteneğimizi sürdürmek için, mevcut hazırlık durumumuzu ve topyekûn savunma taahhüdümüzü sürdürmemiz gerekiyor."
 SWE_finland_claims:0 "Fin Hak İddialarımızın Tanınması"
 SWE_finland_claims_desc:0 "[FIN.GetNameDef] toprağı haklı olarak bizim egemenliğimizdir ve yeni bulduğumuz güçle, üzerindeki kontrolümüzü yeniden tesis edebiliriz. Ancak, bölgedeki son çatışmalar jeopolitik durumu karmaşıklaştırdı. Bu nedenle, iddialarımıza ağırlık kazandırmak için [GER.GetNameDef]'nin desteğine ihtiyacımız var."
 SWE_finlands_cause_is_ours:0 "Finlandiya'nın Davası Bizim Davamızdır"
 SWE_finlands_cause_is_ours_desc:0 "[FIN.GetName]'a yöneltilen [SOV.GetAdjective] saldırganlığı kaçınılmaz olarak bir gün bize de yönelecektir. Mevcut çatışmaya kayıtsız kalmak yerine, eski tehdidi geri püskürtmek için [FIN.GetAdjective]'e katılmalıyız."
 SWE_finnish_buffer_state:0 "Fin Tampon Devleti"
 SWE_finnish_buffer_state_desc:0 "[SOV.GetNameDef]'nin [SWE.GetAdjective] işlerinin kontrolünde kendi çıkarlarına daha uygun birini görmeyi tercih edeceğine şüphe yok. Aramızda bir çatışmanın patlak vermesini önlemek için, [FIN.GetName]'ın bizim çıkarlarımızla uyumlu bir tampon devlet olması çok önemlidir."
 SWE_finnish_integration:0 "Östra Rikshalvan"
 SWE_finnish_integration_desc:0 "[FIN.GetAdjective] egemenliği son yıllarda tarafımızdan başarıyla aşındırıldı. Şimdi son hamleyi yapıp, bir kez daha haklı bağlı devletimiz olarak yerlerini almalarını talep etmeliyiz. Eğer bunu kendi istekleriyle yapmazlarsa, onları aklını başına getirmeye zorlayacağız."
 SWE_five_year_plan:0 "Devlet Planlama Komitesi"
 SWE_five_year_plan_desc:0 "Politbüronun kurulması ve tüm sanayinin kamulaştırılmasıyla, şimdi ekonomik işleri izleyebilecek ve politbüronun merkez komitesine politika kararları önerebilecek bir kuruma ihtiyacımız var."
 SWE_folkhemmet_modification_tt:0 "§YFolkhemmet§!'i şununla değiştirir:"
 SWE_foreign_designs:0 "Yabancı Uçak Tasarımlarını İncele"
 SWE_foreign_designs_desc:0 "Diğer ulusların zaten sahip olduğu şeyleri yeniden icat ederek zaman kaybetmemeliyiz. SAAB’ın uzmanlığı, yurtdışından lisanslanan tasarımları uyarlayarak ve üreterek daha iyi kullanılabilir."
 SWE_foreign_designs_tt:0 "Savaşta olmadığımız, ideolojimize uyan her büyük ülke için §Yhava araçları§! için §Y1x§! §G%35§! Araştırma Bonusu kazan"
 SWE_form_saab:0 "SAAB'ı Kur"
 SWE_form_saab_desc:0 "[SWE.GetName]'da kazançlı hükûmet sözleşmeleri için rekabet eden bir dizi uçak üreticisi var. Onları birleştirerek, hepsinin kolektif uzmanlığından maliyet etkin bir şekilde yararlanabiliriz."
 SWE_formation_flying:0 "Formasyon Uçuşu"
 SWE_formation_flying_desc:0 "Sağlam bir hava savunmasını sürdürmek, potansiyel tehditlere hızla yanıt verebilen iyi organize edilmiş avcı gruplarını gerektirir."
 SWE_fredrik_strom_tt:0 "$SWE_fredrik_strom$"
 SWE_ga_pa_tactics:0 "Gå-på Şok Taktikleri"
 SWE_ga_pa_tactics_desc:0 "[SWE.GetName] bir zamanlar, tankların ortaya çıkmasından çok önce, savaş alanında son derece hareketli kuvvetlerin kullanımına öncülük etti. O yenilikçi ruhu yeniden alevlendirmenin ve kendi blitzkrieg formumuzu geliştirmenin zamanı geldi."
 SWE_ger_swe_nuclear_bonus:0 "Alman-İsveç Uranprojekt Bonusu"
 SWE_germanify_sweden:0 "Cermen Kültürünü Benimse"
 SWE_germanify_sweden_desc:0 "Birçok kişi ayrı halklar olduğumuzu iddia etse de, son deneyimler bize İsveç'in kanla bağlı bir Cermen kardeşliğinin parçası olduğunu göstermiştir. Kendimizi yabancı nüfuzun tüm kalıntılarından kurtarmanın ve Cermen köklerimizi bir kez daha benimsemenin zamanı geldi."
 SWE_gotaverken:0 "Götaverken"
 SWE_gotaverken_desc:0 "Donanmayı modernize etmek için, Götaverken'deki tersaneleri genişletmemiz ve savaş gemilerinin inşası için yeni üretim teknolojilerine yatırım yapmamız gerekiyor."
 SWE_government_weapons_contract:0 "Hükûmet Silah Sözleşmesi"
 SWE_government_weapons_contract_desc:0 "[SWE.GetName] genelinde silah yapımında uzmanlığa sahip pek çok şirket var. Eğer topyekûn savaşa hazırlanacaksak, bu şirketlerin askerî teçhizat sözleşmeleri yoluyla genişlemesini teşvik etmemiz gerekiyor."
 SWE_greater_nordic_reich:0 "Det Stornordiska Riket"
 SWE_greater_nordic_reich_desc:0 "Sadece güçle, kendimizi İskandinavya'nın tartışmasız efendileri olarak kanıtladık. Ama bu halkımız için sadece bir başlangıç. Tek bir Rike olarak birleşirken, dünya gelecek olanlar için kendini hazırlamalı."
 SWE_greater_nordic_reich_tt:0 "§Yİskandinav§! bağlı devletlerini çekirdek yapma ve ilhak etme olanağı tanır"
 SWE_hedgehog_defense:0 "Kirpi Savunması"
 SWE_hedgehog_defense_desc:0 "Derinlemesine savunma operasyonlarımızın etkinliğini, düşmanın baypas edebileceği savunulabilir konumlardaki küçük asker ceplerinden oluşan 'kirpi' taktiklerini kullanarak artırabiliriz. Ancak, cepleri kontrol altında tutmak düşmanın momentumunu tüketecek ve onları karşı saldırıya karşı savunmasız bırakacaktır."
 SWE_hemvarnet:0 "Hemvärnet"
 SWE_hemvarnet_desc:0 "Kendi yerel bölgelerindeki stratejik yerleri savunmak için daha eski askerî teçhizatla donatılabilecek binlerce istekli gönüllü var. Bu, ordunun ulusu bir kerede savunmaya çalışırken aşırı gerilmesini önlemede büyük bir yol kat edecektir."
 SWE_hemvarnet_tt:0 "Savaş durumunda acil durum birimleri olarak etkinleştirilebilecek Ev Muhafızları hücreleri kurmaya izin verir"
 SWE_husqvarna_vapenfabrik:0 "Husqvarna Silah Fabrikası"
 SWE_husqvarna_vapenfabrik_desc:0 "Husqvarna, [SWE.GetAdjective] ordusu için küçük silah teçhizatı üretme konusunda uzun bir geçmişe sahiptir. Endüstriyel tabanlarını genişletme ve uzmanlıklarını orduyu modernize etmek için kullanma zamanı geldi."
 SWE_hygenic_housing:0 "Hijyenik Konut"
 SWE_hygenic_housing_desc:0 "Çok fazla insan hâlâ insan yaşamına uygun olmayan aşırı kalabalık gecekondularda yaşıyor. Temiz bir sayfa açmalı ve herkesin hijyenik, işlevsel konutlara erişimini sağlamalıyız."
 SWE_hygenic_housing_tt:0 "§YHijyenik konut politikası, her iki ayda bir yeni bir çekirdek eyaletin değiştiriciyi kazanmasıyla zamanla Södermanland'dan dışarı doğru yayılmaya başlayacak§!"
 SWE_icelandic_independence:0 "İzlanda Bağımsızlığı"
 SWE_icelandic_independence_desc:0 "TODO"
 SWE_increase_intelligence_funding:0 "İstihbarat Finansmanını Artır"
 SWE_increase_intelligence_funding_desc:0 "[SWE.capital.GetCapitalVictoryPointName] son yıllarda bir casusluk faaliyeti merkezi haline geldi. İstihbarat servisimize, çıkarlarımızı tehdit etmeden önce bu tür faaliyetleri izlemede daha aktif bir rol alabilmeleri ve yeni teknolojiler geliştirebilmeleri için finansmanı artırmalıyız."
 SWE_individual_liberty_and_prosperity_for_all:0 "Yoksulluğu Azaltma"
 SWE_individual_liberty_and_prosperity_for_all_desc:0 "İnsanları yoksulluktan çıkarmak için daha fazlasını yapmamız gerektiği açık. Ancak, desteğimizi geçerli bir ulusal savunmayı sürdürme ihtiyacıyla dikkatlice dengelememiz gerekiyor."
 SWE_infrastructure:0 "Altyapı Yatırımı"
 SWE_infrastructure_desc:0 "[SWE.GetName]'ın büyük bir kısmı hâlâ kırsal ve acınacak derecede az gelişmiş. Doğal kaynaklarımızdan daha iyi yararlanmak için bunu düzeltmeliyiz."
 SWE_italian_destroyers:0 "İtalyan Muhripleri Satın Al"
 SWE_italian_destroyers_desc:0 "Sıfırdan gemi inşa etmek pahalıdır. Ancak, birçok ülke eski gemilerinden bazılarını satmaya istekli olabilir. Örneğin [ITA.GetNameDefCap], bize çok makul bir fiyata bir dizi muhrip satmaya şimdiden ilgi gösterdi."
 SWE_italian_ships_tt:0 "[ROOT.GetFlag][ROOT.GetName]'a yol açacaktır: \n "
 SWE_italian_ships_tt_2:0 "\n§R[ENG.GetNameDefCap] gemilerin teslimatını engellemeye çalışabilir!§!"
 SWE_jagartrupper:0 "Jägartrupper"
 SWE_jagartrupper_desc:0 "Sayıca üstün bir kuvvetle karşı karşıya kalındığında, hareketlerini veya ikmal erişimlerini kısıtlayarak oyun alanını eşitlemek gerekir. Küçük komando ekipleri kullanarak, düşman hatlarına sızabilir ve kilit noktalardaki altyapılarını sabote edebiliriz."
 SWE_jagartrupper_tt:0 "§Yİnsan gücü§! karşılığında bitişik kontrollü eyaletlerdeki düşman limanlarını ve ikmal merkezlerini sabote etmek için seçkin korucular gönderme yeteneği sağlar!\nMevcut bir arazi özelliği olmayan Ordu Liderleri §YKorucu§! özelliği kazanır"
 SWE_join_allies_for_colonies:0 "Mülk Değişimi"
 SWE_join_allies_for_colonies_desc:0 "Kendimizle Müttefikler arasındaki ilişkilerin güçlenmesiyle, askerî koalisyonlarına girmemiz karşılığında dünya çapındaki eski sömürge mülklerimizi geri kazanma fırsatımız var."
 SWE_join_the_anti_soviet_pact:0 "Anti-Sovyet Paktı'na Katıl"
 SWE_join_the_anti_soviet_pact_desc:0 "Çoğu ülke [SOV.GetNameDef]'nin yükselişinden korkuyor ancak Anti-Komintern Paktı'nın imzacılarından başka, nüfuzlarının yayılmasını önlemek için bir şey yapmaya pek niyetleri yok. Biz de pakta katılarak niyetimizi açıkça belirtmeliyiz."
 SWE_join_the_anti_soviet_pact_tt:0 "[GER.GetName] ile nüfuz alanları oluşturacağız, bu da onların §Y2 yıl§! boyunca §Y[DEN.GetName]§! ve §Y[NOR.GetName]§!'a saldırma olasılığını çok düşürecek!"
 SWE_karnvapenprogram:0 "Kärnvapenprogram"
 SWE_karnvapenprogram_air_bonus:0 "Kärnvapenprogram Hava Bonusu"
 SWE_karnvapenprogram_bonus:0 "Kärnvapenprogram Bonusu"
 SWE_karnvapenprogram_desc:0 "Atom silahlarının geliştirilmesiyle, ulusal güvenliğimizi gerçekten garanti altına almanın tek yolu, kendimize ait bu tür silahlar ve yeterli dağıtım sistemleri geliştirmektir. Nükleer enerji ve konvansiyonel silahlar geliştirme kisvesini kullanarak, bunu büyük güçleri alarma geçirmeden yapabiliriz."
 SWE_karnvapenprogram_nuclear_bonus:0 "Kärnvapenprogram Nükleer Bonusu"
 SWE_king_in_council:0 "Konseydeki Kral"
 SWE_king_in_council_desc:0 "Kral Gustav tahta çıktığında, [SWE.GetAdjective] siyaseti üzerinde büyük bir güce sahipti. Saltanatı boyunca, otoritesi ütopyacı demokrasi vizyonlarına sahip idealist politikacılar tarafından aşındırıldı. Bu doğal olmayan durum, Kral'ın kadim güçlerini geri getirerek tersine çevrilmelidir."
 SWE_king_in_council_tt:0 "§YKraliyetçiler§! iktidar partisi olur."
 SWE_kockums:0 "Kockums"
 SWE_kockums_desc:0 "Kockums, donanma için gemi ve denizaltı üretebildiğini kanıtladı. Operasyonlarını genişletmeli ve üretebilecekleri gemi sayısını artırmalıyız."
 SWE_kp_bill:0 "Mekanize KP Bil"
 SWE_kp_bill_desc:0 "Savaş alanındaki son gelişmeler, birlikleri ihtiyaç duyulan yerlere hızla yeniden konuşlandırma gerekliliğini göstermiştir. Şimdiye kadar bu görevi yerine getirmek için sivil uyarlanmış kamyonlar kullandık, ancak amaca yönelik inşa edilmiş bir zırhlı taşıma aracı savaşta çok daha etkili olacaktır."
 SWE_land_air_warfare:0 "Kara - Hava Savaşı"
 SWE_land_air_warfare_desc:0 "Silahlı kuvvetlerin her bir kolu kendi uzmanlık eğitimini ve teçhizatını gerektirse de, düşmanı yerde ve havada aynı anda alt etmek için birlikte çalıştıklarında savaş alanında en etkilidirler."
 SWE_landverk_l_62:0 "Landsverk L-62"
 SWE_landverk_l_62_desc:0 "Landverk tank tasarımlarının ve Bofors uçaksavar toplarının başarısı üzerine inşa ederek, en hızlı manevralarla bile başa çıkabilen dünya standartlarında bir mobil uçaksavar platformu yaratabiliriz."
 SWE_let_fly_all_guns:0 "Ateş Serbest, Tüm Silahlar"
 SWE_let_fly_all_guns_desc:0 "Diğer ulusların engin sanayisine sahip olmasak da, en yetenekli silah üreticilerinden bazılarına sahibiz. Ek yatırımla, yeteneklerini tam olarak kullanarak kuvvetlerimize savaş alanında teknolojik bir avantaj sağlayabiliriz."
 SWE_license_skf_ball_bearings:0 "SKF Rulmanları"
 SWE_license_skf_ball_bearings_desc:0 "SKF, birçok modern askerî aracın üretimi için çok önemli olan bilyalı rulmanların üretiminde bir dünya lideri haline geldi. Bunu savaşan uluslarla yapacağımız ticaret müzakerelerinde kendi avantajımıza kullanmalıyız."
 SWE_lindholmens_varv:0 "Lindholmens Varv"
 SWE_lindholmens_varv_desc:0 "Lindholmens Varv son yıllarda sivil gemilerin inşasına odaklanmıştır. Bazı küçük değişikliklerle, tersaneleri donanmanın genişlemesini ve modernizasyonunu desteklemek için dönüştürülebilir."
 SWE_liquidate_the_monarchy:0 "Monarşiyi Tasfiye Et"
 SWE_liquidate_the_monarchy_desc:0 "[SWE.GetName]'daki parazit monarşi kurumunu kesin olarak feshetmenin zamanı geldi. Kraliyet ailesi ve daha geniş aristokrasinin unvanları ellerinden alınacak ve servetleri halk arasında yeniden dağıtılacaktır."
 SWE_lottakaren:0 "Lottakåren"
 SWE_lottakaren_desc:0 "[SWE.GetName] kadınları da erkekler kadar ulusu savunmaya isteklidir. Cephe dışı görevlerde kadınları askere almak ve eğitmek için bir örgütü finanse ederek, silahlı kuvvetleri takviye edebilir ve savunma yeteneklerimizi artırabiliriz."
 SWE_loyalty_laws:0 "Sadakat Yasaları"
 SWE_loyalty_laws_desc:0 ""
 SWE_lynx_armored_car_recon_company_tt:0 "\n§Y$armored_car_recon$§!:\n§Yorman:§!\n Hareket Etkin Değişimi: §G+%5§!\n  Saldırı Etkin Değişimi: §G+%5§! \n§YÇöl:§!\n  Hareket Etkin Değişimi: §R-%15§!\n   Saldırı Etkin Değişimi: §R-%15§!\n§YKar:§!\n Hareket Etkin Değişimi: §G+%8§!\n  Saldırı Etkin Değişimi: §G+%5§!\n\n"
 SWE_lynx_armored_car_tt:0 "§YLynx zırhlı aracını§! etkinleştirir, şu sonuçları verir: \n§YZırhlı Araba§! ve §Y$armored_car_recon$§!:\n Sert Saldırı: §G+%10§!\n Delme: §G+%10§! \n Organizasyon: §G+5§!\n\n§YZırhlı Araba§!:\n§Yorman:§!\n Hareket Etkin Değişimi: §G+%15§!\n  Saldırı Etkin Değişimi: §G+%20§! \n§YÇöl:§!\n  Hareket Etkin Değişimi: §R-%40§!\n   Saldırı Etkin Değişimi: §R-%20§!\n§YKar:§!\n Hareket Etkin Değişimi: §G+%35§!\n  Saldırı Etkin Değişimi: §G+%20§!"
 SWE_lynx_winter_armored_cars:0 "Lynx Zırhlı Aracı"
 SWE_lynx_winter_armored_cars_desc:0 "Savaş [SWE.GetName]'a gelirse, hareketlilik savunmamız için çok önemli olacaktır. Modern, amaca yönelik inşa edilmiş bir zırhlı araç geliştirmek, birliklerimize savaş alanında keşif ve yumuşak hedeflere saldırmak için hayati bir araç verecektir."
 SWE_marauder_bombers:0 "Akıncı Bombardıman Uçakları"
 SWE_marauder_bombers_desc:0 "Son deneyimler, yer hedeflerini havadan yok etme yeteneğinin genellikle savaşlarda belirleyici bir faktör olabildiğini göstermiştir. Hatta bir savaşı tamamen sona erdirmenin bir yolu bile olabilir."
 SWE_meet_with_the_king:0 "Kral ile Görüş"
 SWE_meet_with_the_king_desc:0 "[SWE.GetName]'daki milliyetçilik dalgası Kral'ın dikkatini çekti. Bu desteği toplayan önde gelen isimlerin niyetlerini görüşmek üzere kraliyet sarayında kendisiyle görüşmesini talep etti."
 SWE_meet_with_the_king_tt:0 "[SWE.GetName] kraliyet turları aracılığıyla kraliyetçi hareket için desteği artırmak üzere kararların kilidini açar"
 SWE_merge_army_complexes:0 "Ordu Komplekslerini Birleştir"
 SWE_merge_army_complexes_desc:0 "Askerî komplekslerimizi merkezileştirmek daha verimli olacaktır. Onları üye devletlerde bırakmak, bir işgal durumunda onları kaybetme riskini taşır."
 SWE_merge_army_complexes_tt:0 "Her §Yİskandinav savunma konseyi üyesi§!: §R-1§! §YAskerî Fabrika§!\n(§Y[SWE.GetName]§!) Her §Yİskandinav savunma konseyi üyesi§! için §G+1§! §YAskerî Fabrika§!"
 SWE_military_academy:0 "Askerî Akademi"
 SWE_military_academy_desc:0 "Askeriyenin kolları son yıllarda büyük bir deneyim biriktirdi. Bir askerî akademi sistemi kurarak, bilgilerinin nesiller boyu aktarılmasını sağlayabiliriz."
 SWE_military_independence:0 "Bağımsız bir Orduyu Koru"
 SWE_military_independence_desc:0 "Daha yakınlarda daha acil meseleler varken neden [SWE.GetAdjective] askerleri Alplerde veya Kuzey Afrika'da [GER.GetNameDef] için ölsün? Askerî bağımsızlığımızı korumalı ve sınırlarımızdaki tehditler için gücümüzü toplamalıyız."
 SWE_military_integration:0 "Orduyu [GER.GetNameDef] ile Entegre Et"
 SWE_military_integration_desc:0 "İsveçliler savaşmayı unuttu, ancak [GER.GetNameDef] ile olan bağlarımızı geliştirerek bu bilgiyi geri getirme fırsatımız var. Ordumuzu onlarınkiyle entegre ederek, Avrupa'nın Bolşevizm'den kurtuluşuna katkıda bulunabilir ve bu süreçte [SWE.GetAdjective] halkını sertleştirebiliriz."
 SWE_mobilization_of_society:0 "Toplumun Seferberliği"
 SWE_mobilization_of_society_desc:0 "Bir fabrika işçisinden bir kabine bakanına kadar herkes, ulusun savunması için fedakarlık yapmaya istekli olmalıdır. Bu, kaynakları savaş üretimine yeniden önceliklendirmek veya silahlanmak anlamına gelse de, [SWE.GetName]'ın hayatta kaldığını görmek için her şeyi yapacağız."
 SWE_mythologize_swedish_history:0 "Karşı Devrim"
 SWE_mythologize_swedish_history_desc:0 "Devlet aygıtının kontrolünü ele geçirdik, ancak iktidardaki tutunmamızı güvence altına almak için yapılması gereken çok şey var. Bu nedenle, siyasi destekçilerimizi tatmin etmek için bir dizi reform uygulayacağız ve aynı zamanda otoritemize direnen tüm direnişçilerin kökünü kazıyacağız."
 SWE_mythologize_swedish_history_tt:0 "Milliyetçileri iktidara yükselişleri sırasında destekleyen gruplara karşı önceki yükümlülükleri yerine getirmek için kararların kilidini açar ve görevleri etkinleştirir. §RYükümlülükler yerine getirilmezse istikrar büyük ölçüde etkilenecektir!§!"
 SWE_narvik_crisis:0 "Narvik Krizi"
 SWE_narvik_crisis_desc:0 "Narvik, kış aylarında demir cevherimiz için ana ihracat yolu olarak stratejik öneme sahiptir. Bu çalkantılı zamanlarda kendi ulusal güvenliğimizi sağlamak için, bölge bizim yargı yetkimiz altına alınmalıdır. Ve eğer [NOR.GetName] bu süreçte zayıflarsa, daha da iyi."
 SWE_neither_death_nor_dishonor:0 "Ne Ölüm Ne de Onursuzluk"
 SWE_neither_death_nor_dishonor_desc:0 "İskandinavlar bir uçurumun kenarında. Batı'da Alman kurtları uluyor. Doğu'da Bolşevikler zaman kolluyor, kızıl hançerlerini ana yurtlarımızın derinliklerine saplamaya hazır. Kalemimiz kılıç olmalı, kurnazlığımız zırhımız olmalı. \nİki kötülük arasında seçim yapmayacağız, ölüm ya da onursuzluk olmayacak."
 SWE_neither_death_nor_dishonor_tt:0 "$MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$: §G+%4§! \n$MODIFIERS_ARMY_CORE_ATTACK_FACTOR$: §G+%4§! \n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+%4§!\n$MODIFIER_INDUSTRIAL_CAPACITY_DOCKYARD_FACTOR$: §G+%4§!, §Y[SWE.GetName]§! ile aynı ittifaktaki her İskandinav ülkesi için veya her §Y$autonomy_aat_defense_council_member$§! için!"
 SWE_nordic_centralized_air_command:0 "İskandinav Merkezi Hava Komutanlığı"
 SWE_nordic_centralized_air_command_desc:0 "Hava savunması modern savaşta çok önemli bir cephe haline geldi, ancak teknolojik gelişmelere ayak uydurmak pahalı. Güçlü bir savunmayı sürdürürken maliyetleri düşürmek için, birleşik bir İskandinav Hava Komutanlığı oluşturmalıyız."
 SWE_nordic_centralized_air_command_tt:0 "Her §Yİskandinav savunma konseyi üyesi§! bağlı devlet tipi:\nHava kuvvetlerini §Y[SWE.GetName]§!'a devreder!"
 SWE_nordic_defense_fleet:0 "İskandinav Savunma Filosu"
 SWE_nordic_defense_fleet_desc:0 "İskandinav Savunma Antlaşması'nın onaylanmasıyla, deniz varlıklarımızı birleşik bir komuta sistemi altında birleştirme sürecine başlayabiliriz."
 SWE_nordic_defense_fleet_tt:0 "Her §Yİskandinav savunma konseyi üyesi§! bağlı devlet tipi:\nFiloyu §Y[SWE.GetName]§!'a devreder!"
 SWE_nordic_liberation_movement:0 "İskandinav kurtuluş hareketi"
 SWE_nordic_liberation_movement_desc:0 "TODO"
 SWE_nordic_protection_complex:0 "İskandinav Savunma Kompleksi"
 SWE_nordic_protection_complex_desc:0 "Biz İskandinav ülkeleri olarak hepimiz barış istiyoruz. Gerçekten arzuladığımız tek şey, Kuzey'de yaşama, Kuzey'de yaşlanma ve Kuzey'de gömülme temel hakkıdır. Eğer biri bunu bizden almaya çalışırsa, onlar da burada gömülecektir."
 SWE_nordic_protection_complex_tt:0 "Her §Yİskandinav savunma konseyi üyesi§! kazanır:\n   §G1§! İnşaat Alanı ekle\n   §G1§! §YSivil Fabrika§! ekle"
 SWE_nordic_research_exchange:0 "İskandinav Araştırma Değişimi"
 SWE_nordic_research_exchange_desc:0 "İskandinavlar teknolojik olarak gelişmiştir ve ilerlemelerimizi birbirimizle paylaşmamak ayıp olur."
 SWE_nordljus:0 "Nordljus'u İnşa Et"
 SWE_nordljus_desc:0 "Donanmamız Baltık'ın diğer güçleriyle rekabet edemez ve en ağır rakiplere karşı koymak için yeni bir amiral gemisine ihtiyaç var. Böyle büyük bir proje İskandinav ekonomilerini olumsuz etkileyecektir, ancak bazen durum şu kadar basittir:\n\nGüç, güçle karşılanmalıdır"
 SWE_nordljus_tt:0 "Her §Yİskandinav savunma konseyi üyesi§! kazanır: "
 SWE_nordljus_tt_2:0 "Üretim hattı §Y%60§! tamamlanmış olarak başlayacak"
 SWE_norma_projektilfabrik:0 "Norma Projektilfabrik"
 SWE_norma_projektilfabrik_desc:0 "Norma Projektilfabrik, geçen yüzyıldan beri [SWE.GetName]'da ve [NOR.GetName]'da mühimmat üretmektedir. Üretim kapasitelerini genişletmek, silahlı kuvvetlerimize istikrarlı bir mühimmat tedarikini sürdürmede büyük bir yol kat edecektir."
 SWE_norma_projektilfabrik_tt:0 "Eğer §Y[NOR.GetNameDef]§! ile tamamlanırsa §G1§! ekstra §YAskerî Fabrika§! ekle:\nBüyük bir ülkeyle savaşta\n%0'dan fazla teslimiyet ilerlemesi var\n§Y[SWE.GetNameDef]§!: §YNorveç§! ile savaşta değil!"
 SWE_operation_save_denmark:0 "Operasyon: Danimarka'yı Kurtar"
 SWE_operation_save_denmark_desc:0 "Yüzyıllar boyunca [DEN.GetName] ile anlaşmazlıklarımız olmuş olabilir, ancak bugün halkıyla birleşmiş durumdayız ve onları tiranlıktan kurtarmaya hazırız."
 SWE_operation_save_norway:0 "Operasyon: Norveç'i Kurtar"
 SWE_operation_save_norway_desc:0 "[NOR.GetName] ve [SWE.GetName]'ın yüzyıllar öncesine dayanan iç içe geçmiş bir tarihi var. Halkının yabancı bir gücün postalları altında sıkışıp kaldığını görmek kabul edilemez ve fırsat doğduğunda onları kurtarmak için planlar yapmalıyız."
 SWE_organize_a_putsch:0 "Bir Darbe Düzenle"
 SWE_organize_a_putsch_desc:0 "Nihayet [SWE.GetAdjective] halkı arasında Riksdag'ın kontrolünü ele geçirebilecek kadar destek topladık. [SWE.GetAdjective] olmanın ne demek olduğunu unutmuş olan yanlış yönlendirilmiş demokratlar ve sosyalistlerden şüphesiz direniş olacaktır, ancak onları bir kenara itecek gücümüz var."
 SWE_paid_holidays:0 "Devlet Tarafından Ödenen Tatil"
 SWE_paid_holidays_desc:0 "İşçiler ve işletmeler arasında çok fazla gerilime neden olan bir konu tatil zamanı olmuştur. Özel sektör, yasaları çiğnemeden işçileri desteklemek için sadece asgari düzeyde hareket ederken kârlarını en üst düzeye çıkaracaktır. Devletin devreye girip tatilleri bir değişiklik olsun diye işçilerin yararına düzenlemesinin zamanı geldi."
 SWE_paid_holidays_policy_tt:0 "Yılın büyük bölümünde §G+%3§! §Yİstikrar§! ve §G+%5§! §Yİnşaat hızı§!.\nYılın 30 günü için §Y+%20 Tüketim Malları§!"
 SWE_peoples_commissar_for_defense:0 "Halk Savunma Komiseri"
 SWE_peoples_commissar_for_defense_desc:0 "Bir gün, dünya işçileri birleştiğinde tüm sınırlar ortadan kalkacak. O güne kadar, topraklarımıza herhangi bir tecavüze karşı uyanık ve hazırlıklı kalmalıyız. Savunmamızı denetlemek için, eski aristokratların etkisinden arınmış yeni bir savunma bakanlığı kurmamız gerekiyor."
 SWE_per_albin_bus:0 "[SWE.GetLeader] Otobüsü"
 SWE_per_albin_bus_desc:0 "Rakiplerimizin emrinde bu kadar çok ateş gücü varken, hükûmetin bir hava saldırısı veya işgal ile başsız kalması mümkündür. Böyle bir senaryoyu önlemek için, bir kriz sırasında silahlı kuvvetler ve halkla teması sürdürebilecek hareketli bir hükûmet karargahına ihtiyacımız var."
 SWE_per_albin_bus_tt:0 "Liderimizin tahliye olmasına izin veren bir Mobil karargah birimi oluşturur. Ancak otobüs imha edilirse, bu Başbakanımız için iyiye işaret olmayacaktır."
 SWE_per_albin_line:0 "[SWE.GetLeader] Hattı"
 SWE_per_albin_line_desc:0 "[SWE.GetName]’ın kıyı şeridi geniştir ve büyük ölçüde savunmasızdır. Bir düşmanın kıyılarımıza bir işgal gücü çıkarmasını önlemek için, onları Baltık'a geri püskürtebilecek kıyı boyunca bir dizi güçlendirilmiş mevzi oluşturmamız gerekiyor."
 SWE_per_albin_line_tt:0 "Malmö ve boğazı çevresindeki kilit savunma alanlarına, Vänern ve Vättern gölleri etrafındaki darboğazlara, ayrıca Gotland ve Stockholm'e tahkimatlar ekler"
 SWE_police_reforms:0 "Bir Karşı-Devrimi Önle"
 SWE_police_reforms_desc:0 "Politikalarımız şaşırtıcı olmayan bir şekilde burjuvazi ve aristokrasi arasında bize çok güçlü düşmanlar kazandırıyor. Onların bir karşı-devrim başlatmasını önleyeceksek, hızla hareket etmeli ve onları, proletarya arasındaki tüm potansiyel sınıf hainleriyle birlikte kökünden kazımalıyız."
 SWE_preemptive_strike:0 "Önleyici Saldırı"
 SWE_preemptive_strike_desc:0 "Birçok kişi çatışmayı geride bırakmak istese de, aynı hataları tekrar yapmayı göze alamayız. Rakiplerimiz çok güçlenmeden veya daha da kötüsü, kendi atom silahlarını geliştirmeden önce onlara saldırmalıyız. Hızlı ve sert vurursak, onları hazırlıksız yakalayabiliriz."
 SWE_prevent_a_red_dictatorship:0 "Kızıl Bir Diktatörlüğü Önle"
 SWE_prevent_a_red_dictatorship_desc:0 "Sosyal Demokratlar, komünistler için bir Truva atından başka bir şey değildir. Eğer İsveç'in Sovyet etki alanına düşmesini önleyeceksek, seçmenlerin milliyetçi partileri Riksdag'ın kontrolüne getirmesini sağlamalıyız. Gerekli her yolu kullanarak."
 SWE_privately_managed_holidays:0 "Özel Yönetimli Tatil"
 SWE_privately_managed_holidays_desc:0 "Devletin, bir işletmenin nasıl faaliyet göstereceğine karar vermesine müdahale etme hakkı yoktur. Bu nedenle, özel sektörün tatil politikalarını kontrol etmesine izin vereceğiz. Eğer işçiler beğenmezse, başka bir yerde iş bulabilirler."
 SWE_promote_nordic_identity:0 "İskandinav Kimliğini Teşvik Et"
 SWE_promote_nordic_identity_desc:0 "İskandinav ve [GER.GetAdjective] kültürü arasında benzerlikler olabilir, ancak biz [GER.GetAdjective] değiliz. İskandinavya ve Finlandiya halkının, çağlar öncesine dayanan ve diğer herkesten korunması ve kutsal sayılması gereken kendi kültür ve gelenekleri vardır."
 SWE_radiojanst:0 "Radiotjänst"
 SWE_radiojanst_desc:0 "Radiotjänst, halk arasında popüler olduğunu kanıtladı, her gün kültürel etkinliklerin ve haberlerin yayınlarını sunuyor. Yayıncıyı genişleterek, iyi bilgili bir nüfusu korurken ürettiği program türlerini artırabiliriz."
 SWE_rapid_mobilization:0 "Hızlı Seferberlik"
 SWE_rapid_mobilization_desc:0 "Tüm ulus, bir işgal korkusuyla nefesini tutuyor. Yurtdışındaki son eylemler nedeniyle, artık tereddüt edilemez, egemenliğimizi savunmak için silahlı kuvvetleri tamamen seferber etmeliyiz."
 SWE_rapid_mobilization_tt:0 "Bir demokrasi olmasına rağmen askere alma yasasını §Yİhtiyaç Üzerine Hizmet§!'e kadar artırmaya izin verir"
 SWE_rapid_response_force:0 "Hızlı Müdahale Gücü"
 SWE_rapid_response_force_desc:0 "Cephe boyunca gerektiğinde hızla yeniden konuşlandırılabilecek zırhlı araçlardan oluşan bir hızlı müdahale gücünü sürdürerek, çok sayıda tankı destekleme ihtiyacı duymadan tankların avantajlarına sahip olabiliriz."
 SWE_rationing:0 "Karne Uygulaması"
 SWE_rationing_desc:0 "Büyük Savaş'ın [SWE.GetName]'ın masum insanları üzerine getirdiği ekonomik mücadeleleri çok iyi hatırlıyoruz. Gıda, yakıt ve diğer temel ihtiyaçlar için bir karne sistemi kurarak böyle bir felaketten tekrar kaçınmalıyız."
 SWE_rationing_tt:0 "Az miktarda §YSavaş Desteği§!, §Yistikrar§! veya §Ytüketim malları§! karşılığında karne politikaları uygulama kararlarının kilidini açar. Uygulanabilecek olası politikalar şunları içerir:\n"
 SWE_reclaiming_the_rus:0 "Rus'u Geri Alma"
 SWE_reclaiming_the_rus_desc:0 "Atalarımız bir zamanlar batı Rusya ve Ukrayna nehirlerinde sıkça dolaşır, kıyılarına yerleşirlerdi. Bu bölgeleri etki alanımıza entegre etme ve sömürgeleştirme yoluyla başlattıkları şeyi tamamlama zamanı geldi."
 SWE_refit_gotaverken_for_rapid_repairs:0 "Götaverken'i Hızlı Onarımlar için Yeniden Donat"
 SWE_refit_gotaverken_for_rapid_repairs_desc:0 "Tersaneleri onarımlara ayırmak, gemi inşa hızımızı azaltabilir, ancak filoyu savaş durumunda tutma yeteneğimizi önemli ölçüde artıracaktır."
 SWE_refuge_for_revolutionaries:0 "Devrimciler için Sığınak"
 SWE_refuge_for_revolutionaries_desc:0 "Sosyalizm kaçınılmaz olsa da, kendilerini bir çatışmanın kaybeden tarafında bulan veya proletaryaya ihanet etmiş bir devlette kapana kısılmış devrimciler hâlâ var. Tüm bu devrimcilerin [SWE.GetName]'da amaç ve güvenlik bulabileceğini açıkça belirteceğiz."
 SWE_refuge_for_revolutionaries_tt:0 "Diğer ülkelerden komünist danışmanlar, kendi ülkelerinin siyasi durumuna bağlı olarak [SWE.GetName]'a transfer olacak. Şu anda bu danışmanlar [SWE.GetName]'a transfer olacak:"
 SWE_refuge_from_war:0 "Savaştan Sığınma"
 SWE_refuge_from_war_desc:0 "Savaş kaçınılmaz olarak, yeni bir rejim altında hayatlarından endişe edenlerin bir göçüne yol açar. Kaçanların birçoğunun bize fayda sağlayabilecek becerileri var. Bu nedenle, kesinlikle karşılıklı yarar sağlayan bir düzenleme bulabiliriz."
 SWE_refuge_from_war_tt:0 "Şu anda komünist olmayan her ülke için, o ülkenin komünist desteğiyle orantılı olarak insan gücü kazanır. §Yİskandinavlar§! ve §Ybüyük güçler§! daha büyük bir olası insan gücü payı sağlarken, §Yküçük güçler§! daha küçük bir olası pay sağlar, toplam olası insan gücü kazancı: §G+80000§!\nMevcut dünya durumuna göre kazanılan toplam insan gücü: §G+[?SWE_refugee_from_war_total_manpower_gained]§!\nEn az insan gücü sağlayan ulus: §Y[?SWE_refugee_min_manpower_country.GetName]§!: §G+[?SWE_refugee_min_manpower_gained]§!\nEn çok insan gücü sağlayan ulus: §Y[?SWE_refugee_max_manpower_country.GetName]§!: §G+[?SWE_refugee_max_manpower_gained]§!\nÜlke başına kazanılan ortalama insan gücü: §G+[?SWE_refugee_from_war_average_manpower_per_country]§!"
 SWE_reject_saltsjobaden:0 "Saltsjöbaden Anlaşmasını Reddet"
 SWE_reject_saltsjobaden_desc:0 "Bu anlaşma reddedilmelidir, işverenleri kendi işlerini uygun gördükleri şekilde yürütme haklarından mahrum bırakacak ve haksızlığa uğradıklarını hissettiklerinde işçilerin emeklerini geri çekme gücünü kısıtlayacaktır. Bu düzenlemeden kimsenin faydalanacağı yok."
 SWE_research_slot_1:0 "[AAT_Sweden_royal_institute_name]"
 SWE_research_slot_1_desc:0 "Ulusun bilimsel ve mühendislik uzmanlığını genişletmek, modern, yetenekli bir orduyu sürdürmek için çok önemli olacaktır. Bunu yapmak için, [AAT_Sweden_royal_institute_name]'nin genişletilmesine yatırım yapacağız."
 SWE_research_slot_2:0 "Uppsala Üniversitesini Genişlet"
 SWE_research_slot_2_desc:0 "Uppsala Üniversitesi, Anders Celcius, Carl Linnaeus ve Jacob Berzelius gibi aydınlara ev sahipliği yapmış olan İskandinav bölgesinin en eski üniversitesidir. Dünya dönerken ve çalkalanırken, bilimin belirsiz bir dünyada en büyük silah olduğu açıktır ve böylesine prestijli bir üniversiteye yatırım yapmak kesin bir başarı olacaktır."
 SWE_restoring_order:0 "Düzeni Geri Getirme"
 SWE_restoring_order_desc:0 "Kahramanca iktidarı ele geçirmemizin ardından halk arasında düzen dağıldı. Nüfusu davamıza çekmek için, onlara ulusumuzu yeniden büyüklüğe kavuşturabileceğimizi göstermeliyiz. Ve bize hâlâ karşı çıkanlar, kökleri kazınıp ortadan kaldırılacaktır."
 SWE_retool_dockyards:0 "Tersaneleri Yeniden Donat"
 SWE_retool_dockyards_desc:0 "Çabalarımızı daha küçük gemilere ve denizaltılara odaklamak, büyük güçlerle rekabet etmeye çalışmak yerine güçlü yönlerimize oynamamızı sağlayacaktır."
 SWE_revoke_anti_militia_laws:0 "Milis Karşıtı Yasaları Kaldır"
 SWE_revoke_anti_militia_laws_desc:0 "Riksdag'daki dar görüşlü politikacılar, Munckska kåren'in ortaya çıkmasının ardından 1934'te paramiliter grupların oluşturulmasını yasakladı. Aramızda bu kadar çok sosyalist ve diğer hain varken, yasağı tersine çevirmeli ve ulusu güvende tutmak için yeni bir Stormtrupper gücü yaratmalıyız."
 SWE_revoke_anti_militia_laws_tt:0 "[SWE.GetFascistParty] iktidara geldikten sonra yeni bir §YStormtrupper§! milis tümen şablonu oluşturur ve §YStormtrupper Milis Alımı§! kilidini açar."
 SWE_ring_a_ding_ding:0 "Militärcykel"
 SWE_ring_a_ding_ding_desc:0 "Bisikletler, zırhlı arabalar veya tanklar kadar heybetli olmayabilir, ancak maliyetin bir kısmıyla artırılmış hareket kabiliyeti sunarlar."
 SWE_rockets:0 "Raketdrift"
 SWE_rockets_desc:0 "Jet motorlu uçaklar etkileyici olsa da, roket teknolojisi bize pilot eğitimi için maliyetli bir ihtiyaç olmaksızın çok daha büyük hız ve menzile sahip tek kullanımlık silahlar yaratma yeteneği sunar."
 SWE_rule_the_baltic:0 "Baltık'a Hükmet"
 SWE_rule_the_baltic_desc:0 "[SWE.GetName], Baltık kesin olarak kontrolümüz altına girene kadar güvende olmayacak. Bunu yapmak için, komşularımızın en iyi tasarımlarıyla başa çıkabilecek daha büyük gemilerin inşasında uzmanlık kazanmamız gerekiyor."
 SWE_saltsjobaden_agreement:0 "Saltsjöbaden Anlaşmasını Kabul Et"
 SWE_saltsjobaden_agreement_desc:0 "İşçiler ve işverenler arasındaki anlaşmazlıklar kontrolden çıkıyor ve ulusu dize getirme riski taşıyor. Sınırlarımızdaki tehditlerin üstesinden geleceksek birleşmemiz gerekiyor. Bu nedenle, iş uyuşmazlıklarının yarattığı kesintiyi en aza indirmek için bir anlaşma yapmalıyız."
 SWE_sami_reconcilliation:0 "Sámi Uzlaşması"
 SWE_sami_reconcilliation_desc:0 "Sámi halkı, uluslar tarihi topraklarını çalıp haklarını kısıtladığı için yüzyıllardır acı çekti. Telafi etmek ve Sami ile uzlaşma sürecini başlatmak için elimizden geleni yapacağız."
 SWE_scandinavian_defense_union:0 "İskandinav Savunma Birliği"
 SWE_scandinavian_defense_union_desc:0 "Son çatışmalar, inatla izole tarafsızlığa bağlı kalmanın son derece tehlikeli olduğunu göstermiştir. Gelecekte düşmanlarla çevrili kalmaktan kaçınmak istiyorsak, İskandinav komşularımızla herhangi birimize saldırılması durumunda birbirimizi savunmak için bir anlaşma yapmalıyız."
 SWE_scramble_for_the_baltic:0 "Baltık için Kapışma"
 SWE_scramble_for_the_baltic_desc:0 "Baltık devletlerinin şu anda işgal ettiği topraklar, geçmiş yüzyıllarda bir zamanlar İsveç imparatorluğunun etki alanıydı. Geniş Baltık denizi üzerindeki üstünlüğümüzü yeniden tesis edeceksek, [GER.GetAdjective]lar veya [SOV.GetAdjective]lar bizden önce davranmadan bu toprakları geri almak için hızla hareket etmeliyiz."
 SWE_secret_mobilization:0 "Gizli Seferberlik"
 SWE_secret_mobilization_desc:0 "Kuvvetlerimizi seferber etmede çok hızlı hareket edersek, rakiplerimizi alarma geçirebilir ve savunmaya çalıştığımız işgali tetikleyebiliriz. Bu nedenle, şüphe uyandırmamak için dikkatli hareket etmeliyiz."
 SWE_seek_foreign_guarantees:0 "Yabancı Garantiler Ara"
 SWE_seek_foreign_guarantees_desc:0 "TODO"
 SWE_seize_landsverk:0 "Landsverk'i Ele Geçir"
 SWE_sieze_landsverk:0 "Landsverk'i Ele Geçir"
 SWE_sieze_landsverk_desc:0 "Landsverk, [GER.GetAdjective] ordusunun versailles antlaşmasının zırhlı araç geliştirme konusundaki kısıtlamalarını aşması için uzun süredir bir boşluk olarak faaliyet göstermiştir. Hükûmetteki bazıları, [GER.GetAdjective] savaş makinesinden kendimizi uzaklaştırmak için şirketi ele geçirmemiz gerektiğini savunuyor."
 SWE_social_democracy:0 "Sosyal Demokrasi"
 SWE_social_democracy_desc:0 "Sosyal Demokratların İsveç için bir vizyonu var; korku veya öfkeye değil, umuda dayanıyor. Toplumda en çok ihtiyacı olanları destekleyerek herkes için istikrar ve mutluluğun sağlanabileceği umudu. İşbirliğimiz ve nezaketimizle, nihayet halkın evini yaratacağız."
 SWE_socialist_reforms:0 "Sosyalist Reformlar"
 SWE_socialist_reforms_desc:0 "Şimdi Riksdag'da yeterli gücü kazandığımıza göre, gerçek bir Sosyalist cumhuriyetin temellerini atmaya başlayabiliriz. Konumumuzu güvence altına almak için, burjuvazinin nüfuzunu engellemek ve proletaryanın desteğini kazanmak için hızla reformlar getirmeliyiz."
 SWE_socialist_reforms_tt:0 "§YFolkhemmet§! artık §Y$MODIFIER_CONSUMER_GOODS_FACTOR$§!'in %25'ine eşdeğer bir §Yaraştırma§! bonusu sağlıyor.\n§YFolkhemmet§! artık §Y$MODIFIER_CONSUMER_GOODS_FACTOR$§!'in %50'sine eşdeğer bir §Y$BONUS_PRODUCTION_EFFICIENCY_CAP_FACTOR$§! bonusu sağlıyor."
 SWE_something_something_neutrality_butt_really:0 "Tarafsızlık Falan Ama Aslında"
 SWE_something_something_neutrality_butt_really_desc:0 "TODO"
 SWE_special_forces:0 "Özel Kuvvetlere Yatırım Yap"
 SWE_special_forces_desc:0 "Modern savaş bazen, takviyeye ihtiyaç duymadan zorlu arazilerde görevler yürütebilen veya düşman hatlarının gerisinde hareket edebilen küçük özel kuvvet grupları gerektirir. Bu nedenle, gerektiğinde [SWE.GetAdjective] ordusunun öncüsü olarak hareket edebilecek bir özel kuvvetler kolu kurmalıyız."
 SWE_specialized_equipment:0 "Özelleştirilmiş Askerî Teçhizat"
 SWE_specialized_equipment_desc:0 "Yeni özel kuvvetlerin eğitimi iyi gidiyor. Ancak, görevleri için özel teçhizat ve araçları olsaydı daha etkili olabilecekleri giderek daha belirgin hale geliyor."
 SWE_specialized_equipment_tt:0 "Daha önce seçilen özel kuvvetlere (korucular, paraşütçüler veya deniz piyadeleri) göre özel teçhizatın kilidini aç."
 SWE_standardize_equipment:0 "Teçhizatı Standartlaştır"
 SWE_standardize_equipment_desc:0 "Çok uzun zamandır silahlı kuvvetlerimiz, bazıları geçen yüzyıldan kalma sayısız küçük silahla faaliyet gösterdi. Bu, birliklere mühimmat tedarikini son derece zor ve kesintiye karşı savunmasız hale getiriyor. Silahlarımızı ve mühimmatımızı standartlaştırarak bunu düzeltmeliyiz."
 SWE_standardize_equipment_trigger_tt:0 "Orduda §Y13000§!'den fazla piyade teçhizatı"
 SWE_starve_the_fascists_of_iron:0 "Düşmanlarımızı Demirden Mahrum Bırak"
 SWE_starve_the_fascists_of_iron_desc:0 "Gelecekteki düşmanlarımızı yatıştırmada başkalarının yaptığı hataları tekrarlamayacağız, sadece kaynaklarımızı bize karşı savaş açmak için kullanmalarına izin vermeyeceğiz. Bugünden itibaren, gıpta edilen demir cevherimiz de dahil olmak üzere onlara tüm kaynak ihracatını yasaklayacağız."
 SWE_strike_the_capitalist_beast_down:0 "Kapitalist Canavarı Yere Ser"
 SWE_strike_the_capitalist_beast_down_desc:0 "İsveç işçi sınıfı, çok uzun zamandır burjuvazinin boyunduruğu altında acı çekti. Sosyal Demokratlar kapitalizmin sertliğini yumuşatabileceklerine inanırken, seçmenlere gerçeği sadece sosyalistler sunuyor, kapitalizm düzeltilemez. Kapitalizm kaldırılmalıdır."
 SWE_support_danish_communists:0 "Danimarkalı Komünistleri Destekle"
 SWE_support_danish_communists_desc:0 "[DEN.GetName]’ın Baltık ve Kuzey Denizi arasındaki stratejik konumu, ulusal güvenliğimiz üzerinde kabul edilemez bir kontrol seviyesi sağlıyor. Bize ihanet etmemelerini sağlamanın tek yolu, [DEN.GetAdjective] komünist hareketini desteklemek ve orada dost bir rejim kurmaktır."
 SWE_support_norwegian_communists:0 "Norveçli Komünistleri Destekle"
 SWE_support_norwegian_communists_desc:0 "[NOR.GetName] burjuva yönetiminden kurtulana kadar asla tam olarak güvende olmayacağız. Ancak, bizim tarafımızdan dayatılan sosyalist bir hükûmeti asla kabul etmezler. Bu nedenle, yerleşik düzeni devirme mücadelelerinde [NOR.GetAdjective] komünistlerini desteklemeliyiz."
 SWE_surface_raiders:0 "Yüzey Akıncıları"
 SWE_surface_raiders_desc:0 "Hızla inşa edilmiş bir dizi küçük gemiyle, nakliye ve birlik hareketlerini kesintiye uğratarak bir düşmanın savaş çabasına ciddi şekilde zarar verebiliriz."
 SWE_swedes_not_sweden_to_finlands_aid:0 "[SWE_FinnishVolunteerFocusLoc]"
 SWE_swedes_not_sweden_to_finlands_aid_desc:0 "Hükûmet, ulusun tarafsızlığını bozmadan [FIN.GetName]'a askeri olarak aktif bir şekilde yardım edemese de, İskandinav komşularımızı gönüllü olarak savunmak için hayatlarını ortaya koymaya hazır binlerce [SWE.GetAdjective] vatandaşı var."
 SWE_swedes_not_sweden_to_finlands_aid_post_fin_war:0 "Finlandiya'nın yardımına İsveç değil, İsveçliler"
 SWE_swedes_not_sweden_to_finlands_aid_pre_fin_war:0 "İsveç Gönüllü Kolordusu"
 SWE_swedes_not_sweden_to_finlands_aid_tt:0 "\nOtomatik olarak şuna yükseltilecek: "
 SWE_swedes_not_sweden_to_finlands_aid_tt_2:0 "[FIN.GetName] büyük bir güçle savaşta olduğunda"
 SWE_swedish_finnish_defense_agreement:0 "İsveç-Finlandiya Savunma Anlaşması"
 SWE_swedish_finnish_defense_agreement_desc:0 "[SOV.GetNameDef] tehdidi ortadan kaldırılana kadar, [FIN.GetAdjective] ile askeri olarak işbirliği yapmak bizim çıkarımızadır. Bir gün onları tekrar yönetimimiz altına alacağız, ama şimdilik uğraşmamız gereken daha büyük sorunlar var."
 SWE_swedish_finnish_defense_agreement_faction:0 "İsveç-Finlandiya Savunma Anlaşması"
 SWE_swedish_shooting_movement:0 "İsveç Atıcılık Hareketi"
 SWE_swedish_shooting_movement_desc:0 "Yaklaşık bir asırdır, [SWE.GetAdjective] Atıcılık Hareketi, sivil nüfusun atıcılıktaki yeterliliğini ve gerekirse savaşma iradesini artırmak için atış poligonları ve yarışmalar düzenlemiştir. Bugün içinde bulunduğumuz çalkantılı durum göz önüne alındığında, belki de örgüte yatırım yapmalıyız."
 SWE_swedish_shooting_movement_tt:0 "Her Hemvärnet seviyesi için İnsan gücü: §G+400§!\nHer Hemvärnet seviyesi için ulusal stoka §Y+100§! birim $SWE_infantry_equipment_0$ eklenir\nKonuşlandırılan Hemvärn tümenlerinin başlangıç deneyimini §Y%10§!'dan §Y%30§!'a çıkarır!\nKonuşlandırılan Hemvärn tümenlerinin başlangıç teçhizat faktörünü §Y%60§!'tan §Y%90§!'a çıkarır!\nKonuşlandırılan Hemvärn tümenlerinin başlangıç insan gücü faktörünü §Y%70§!'ten §Y%90§!'a çıkarır!"
 SWE_tank_development:0 "Tank Geliştirme"
 SWE_tank_development_desc:0 "Diğer ulusların yapabildiği gibi zırhlı araçları büyük miktarlarda konuşlandıramasak da, tasarımlarımızda ve üretimimizde daha verimli olabiliriz."
 SWE_the_aland_issue:0 "Åland Meselesi"
 SWE_the_aland_issue_desc:0 "Ålandlılar İsveççe konuşuyor, kendilerini İsveçli olarak tanımlıyor ve Milletler Cemiyeti'nin müdahalesi olmasaydı İsveçli olurlardı. Öyleyse nasıl olur da birisi onların İsveçli olmadığı sonucuna varabilir? Bu tarihsel adaletsizliği düzeltmenin zamanı geldi."
 SWE_the_aland_question:0 "[145.GetName] Sorunu"
 SWE_the_aland_question_desc:0 "[SOV.GetNameDef], [FIN.GetName] üzerinde yeniden kontrol kurmaya çalışırken, [145.GetName]'ın stratejik topraklarının kontrolünü ele geçirmelerine izin veremeyiz. Kıyımızın hemen açıklarında olan adalar, [SOV.GetAdjective] hava ve deniz gücünü [SWE.GetAdjective] topraklarının derinliklerine yansıtmak için kullanılabilir."
 SWE_the_aland_question_tt:0 "§Y[FIN.GetName]§!, §YÅland§! üzerindeki kontrolü bu senaryoda §Y§Y$SWE_the_aland_issue$§!§!'den daha fazla devretmeyi kabul etme olasılığı yüksektir, meğerki §Y[SWE.GetName]§! §Y[FIN.GetName]§!'dan çok daha büyük bir orduya sahip olmasın!"
 SWE_the_barrel:0 "Fıçı"
 SWE_the_barrel_desc:0 "Son çatışmalar, havacılık alanındaki teknolojik gelişmeleri hızlandırdı. Bu nedenle, potansiyel rakiplerimizle aynı hızda ilerlemeli ve gökyüzümüzü korumak için kendi jet tabanlı uçağımızı geliştirmeliyiz."
 SWE_the_cross_we_bear:0 "Taşıdığımız Haç"
 SWE_the_cross_we_bear_desc:0 "Hepimiz İskandinav kardeşleriyiz. [SWE.GetAdjective] devleti, İskandinav kardeşlerimiz işgal altında inim inim inlerken vicdanen boş duramaz. Onları zincirlerinden kurtarmak bizim görevimizdir, böylece hepimiz kuzeyde, savaştan ve tiranlıktan uzak yaşayıp ölebiliriz."
 SWE_the_cross_we_bear_tt_1:0 "İşgal altındaki her §Yİskandinav§! ülkesi için:"
 SWE_the_cross_we_bear_tt_2:0 "Kurtarılan her §Yİskandinav§! ülkesi için: "
 SWE_the_cross_we_bear_tt_3:0 "§Y$SWE_the_cross_we_bear$§! gücünü şu kadar artırır:"
 SWE_the_lion_of_the_north_rises:0 "Kuzeyin Aslanı Yükseliyor"
 SWE_the_lion_of_the_north_rises_desc:0 "Çok uzun zamandır İsveç, küresel güç mücadelelerinin kenarında oturdu. Bu yüzden, büyük güçlerden gelen çirkin taleplere ve ablukalara maruz kaldık. O günler bitti, Kuzeyin aslanı bir kez daha yükselecek ve bölgenin lideri olarak yerini alacak."
 SWE_the_narvik_solution:0 "Narvik Çözümü"
 SWE_the_narvik_solution_desc:0 "Narvik, demir cevherimizin sevkiyatı için çok önemlidir, bu nedenle bu sevkiyatları güvence altına almayı veya kesintiye uğratmayı uman savaşan ulusların hedefi haline gelmiştir. Tarafsızlığımızı ve ihracatımızı sürdürmek için, [NOR.GetName] adına Narvik'in kontrolünü üstlenerek bölgedeki gerilimi azaltmalıyız."
 SWE_the_new_order:0 "Yeni Düzen"
 SWE_the_new_order_desc:0 "En güçlünün hayatta kalması inançlarımızın temelidir. Bu nedenle, zayıflamış [GER.GetName]'ı yok etmenin ve kendimizi bir kez daha bağımsız bir büyük güç olarak kabul ettirmenin zamanı geldi."
 SWE_the_new_order_peace_message:0 "İsveç, Almanya'ya karşı isyan etti"
 SWE_the_new_order_tt:0 "$SWE_the_new_order$ tamamladığımızda [GER.GetNameDef]'nin her düşmanıyla beyaz barış yapacağız"
 SWE_the_new_order_tt_2:0 "§Y[SWE.GetName]§!, §Y$SWE_the_new_order$§! olarak bilinecek!"
 SWE_the_nordic_defense_council:0 "İskandinav Savunma Konseyi"
 SWE_the_nordic_defense_council_desc:0 "Kendi başımıza, İskandinav uluslarının her biri yayılmacı komşularımız için kolay avdır. Ancak kolektif savunmamızın yükünü paylaşmak için bir araya gelerek, gelecekteki herhangi bir saldırgana karşı gerçek bir caydırıcılık yaratabiliriz. İlk olarak, böyle bir örgütün potansiyel üyeleri arasında bir savunma antlaşması onaylamalıyız."
 SWE_the_old_enemy_stirs:0 "Eski Düşman Kıpırdanıyor"
 SWE_the_old_enemy_stirs_desc:0 "Kanlı bir iç savaş ve on yıllık büyük bir sanayileşmenin ardından, [SOV.GetNameDef] eski Rus İmparatorluğu'nun ve ötesinin toprakları üzerinde yeniden kontrol kurmaya çalışıyor. [SOV.GetName] etki alanında kapana kısılmaktan kaçınmak istiyorsak, hızla hareket etmeli ve savaşa hazırlanmalıyız."
 SWE_the_threat_of_the_iron_curtain:0 "Demir Perde Tehdidi"
 SWE_the_threat_of_the_iron_curtain_desc:0 "Dünyanın büyük bir bölümünü yutan son çatışmaya rağmen, galip güçler arasında gerilimler demleniyor. Rakiplerimiz Baltık'ın kontrolü için yarışırken onlar tarafından avlanmaktan kaçınmak istiyorsak, benzer düşünen uluslardan oluşan bir ittifakın parçası olarak onları caydırmalıyız."
 SWE_totalforsvar:0 "Totalförsvar"
 SWE_totalforsvar_desc:0 "Şüphelendiğimiz gibi, son çatışmalar kaçınılmaz olarak topyekûn savaşa dönüşüyor. Bu nedenle, birliklerimize ulusu savunmak için ihtiyaç duydukları teçhizatı sağlamak için ekonomiyi savaş üretimine geçirmemiz gerekiyor."
 SWE_totalforsvar_tt:0 "Ekonomimizi seferberlikten çıkarma görevini devre dışı bırakır"
 SWE_train_the_sheltered:0 "Sığınanları Eğit"
 SWE_train_the_sheltered_desc:0 "Bölgemizdeki çatışma, birçok İskandinav komşumuzun buraya, [SWE.GetName]'a sığınmasına neden oldu. Birçoğu savaşma çağında ve ulusun savunmasına yardım etmek için çağrılabilir."
 SWE_ture_nerman_tt:0 "$SWE_ture_nerman$"
 SWE_undermine_the_fascists:0 "Faşistleri Zayıflat"
 SWE_undermine_the_fascists_desc:0 "İktidar için yarışan faşistler, öfkeli bir güruhtan başka bir şey değildir, fırsat verilirse ulusu mahvederler. Onlara olan desteği zayıflatmalı ve tüm gerçek vatanseverlerin Kral'a sadık kalmasını sağlamalıyız."
 SWE_unify_the_national_socialist_movement:0 "Nasyonal Sosyalist Hareketi Birleştir"
 SWE_unify_the_national_socialist_movement_desc:0 "Nasyonal Sosyalist hareket, birbirini eleştiren küçük başyazılar yazan veya sadece sokaklarda kavga eden sayısız gruba bölünmüştür. Eğer bir hükûmet kurma şansları olacaksa, tek bir lider ve onun mesajı etrafında toplanmaları gerekecek."
 SWE_unify_the_national_socialist_movement_tt_1:0 "Etkinlikten aşağıdakilerden biri alınabilir:"
 SWE_unify_the_national_socialist_movement_tt_2:0 "Veya:"
 SWE_unify_the_national_socialist_movement_tt_3:0 "Stormtrupper'ların askere alındığı eyaletlerde yürüyüşler yoluyla faşist desteği artırmak için kararların kilidini açar."
 SWE_united_kingdoms_of_sweden_and_norway:0 "İsveç ve Norveç Birleşik Krallıkları"
 SWE_united_kingdoms_of_sweden_and_norway_desc:0 "Narvik krizi ve ardından gelen kazanımlarımızdan sonra, [NOR.GetName] zayıflamış ve moralsiz kalmıştır. Şimdi [NOR.GetAdjective] bağımsızlığına son darbeyi vurmalı ve uluslarımızın tek bir hükümdar altında yeniden birleşmesini zorlamalıyız."
 SWE_universal_basic_income:0 "Evrensel Temel Gelir"
 SWE_universal_basic_income_desc:0 "Her erkek ve kadının en azından asgari varoluş seviyesini sürdürebileceğinden emin olunmalı ve vatandaşlarına bakmak devletin yükümlülüğüdür. Evrensel temel gelir her ikisini de çözer."
 SWE_universal_basic_income_tt:0 "Yeni fethedilen eyaletler §G+%25§! uyum ve §Y%0§! direnişle başlar"
 SWE_unrestricted_submarine_warfare:0 "Sınırsız Denizaltı Savaşı"
 SWE_unrestricted_submarine_warfare_desc:0 "Denizaltılar, değiştirilmesi çok daha pahalı olan nakliye ve düşman savaş gemilerini taciz etme yeteneği sunar. Donanmamız ve rakiplerimiz arasındaki silah farkını kapatmak için onları kullanmalıyız."
 SWE_uranium_project:0 "[GER.GetAdjective]-[SWE.GetAdjective] Uranprojekt"
 SWE_uranium_project_desc:0 "[GER.GetAdjective] bilim adamları yıllardır nükleer araştırma yapmaktadır. Bir atomun enerjisinin tek bir devasa patlamada serbest bırakılabileceğini iddia ediyorlar. Deneyler için ağır suya erişim ve birleşik bilimsel uzmanlığımızla, böyle bir harika silah yaratmalarına yardımcı olabiliriz."
 SWE_urbanization:0 "Kentleşme"
 SWE_urbanization_desc:0 "Sanayileşme ve kentleşme el ele gider. Şehirlerde daha fazla iş bulunabildikçe, kırsaldan daha fazla insan onlara taşınır. Şehirlerin aşırı kalabalık gecekondulara dönüşmesini önleyeceksek, altyapılarına yatırım yapmalı ve gelecek nüfus artışına hazırlanmalıyız."
 SWE_urbanization_tt:0 "§YSivil Fabrikalar§! ve §YDeniz Tersaneleri§! kazanmak için §YSiyasi güç§! harcama kararının kilidini açar!"
 SWE_varnplikt:0 "Värnplikt"
 SWE_varnplikt_desc:0 "Küçük bir profesyonel orduya güvenmek, egemenliğimizi daha saldırgan komşularımıza karşı savunmak için yeterli olmayacaktır. Bu nedenle, savaşma çağındaki tüm erkeklerin en azından bir miktar askerî eğitime sahip olmasını sağlamak için bir askerlik hizmeti sistemi uygulayacağız."
 SWE_vasa_ii:0 "[SWE_vasa_ii_loc]"
 SWE_vasa_ii_communist:0 "Röd Orkan"
 SWE_vasa_ii_default:0 "Vasa II"
 SWE_vasa_ii_desc:0 "Efsanevi Vasa'nın bir halefini inşa etme zamanı geldi. Umarım bu sefer savaşta kendini kanıtlama fırsatı bulur."
 SWE_volvo:0 "Volvo"
 SWE_volvo_desc:0 "Volvo, sağlam, güvenilir bileşenler ve araçlar inşa etme konusunda bir üne kavuşmuştur. Kamyon ve motorlar için sivil tasarımlarını askeri uygulamalara uyarlayarak başarıları üzerine inşa etmeliyiz."
 SWE_war_games:0 "Savaş Oyunları"
 SWE_war_games_desc:0 "Artık jeopolitik olarak nerede durduğumuz konusunda biz ve rakiplerimiz arasında hiçbir bahane kalmadı. Bu nedenle, orduyu bu rakiplerle çatışmayı öngören savaş oyunlarına dahil ederek kaybedecek bir şeyimiz yok."
 SWE_winter_drill:0 "Kış Tatbikatı"
 SWE_winter_drill_desc:0 "Birliklerimizi [SWE.GetAdjective] arazisini ve havanın avantajlarından nasıl yararlanacaklarını anlamaları için iyice eğiterek, kendilerinden önemli ölçüde daha büyük düşman kuvvetlerine karşı üstünlük sağlayabilirler."
 SWE_winter_drill_tt:0 "§YSon Direniş§! için §G-%25§! maliyet!\n"
 SWE_work_projects_for_the_unemployed:0 "İşsizler için İş Projeleri"
 SWE_work_projects_for_the_unemployed_desc:0 "Çalışabilecek durumda olup iş bulamayan insanlar, radikalizmin itici gücüdür. İnsanların hükûmete karşı dönmesini önleyeceksek, işsizler için iş projeleri oluşturmamız gerekiyor."
 SWE_zeth_hoglund_tt:0 "$SWE_zeth_hoglund$"
 every_independent_nordic_and_baltic_country_tt:0 "Tüm bağımsız İskandinav ve Baltık ülkeleri"
