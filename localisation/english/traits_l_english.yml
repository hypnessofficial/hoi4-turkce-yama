 FIN_personal_agenda_paasikivi_tt:0 "§GRealist Muhafazakar§!: %§Y95§!'ten fazla £GFX_stability_texticon $stability$ sahibi olmak £GFX_power_balance_texticon §YKamu Güvenini§! artıracaktır. \n  - §RGeçici Hükümet§!: %§Y60§!'tan az £GFX_stability_texticon $stability$ sahibi olmak £GFX_power_balance_texticon §YKamu Güvenini§! azaltacaktır. \n  - $losing_soverignty_threatened_tt$"
