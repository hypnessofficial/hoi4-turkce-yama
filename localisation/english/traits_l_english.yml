 FIN_personal_agenda_aaltonen_tt:0 "§GAnti-Faşist Haçlı Seferi§!: Tüm aktif savaşlarda %§Y10§!'dan fazla Savaş Katkısına ve bir Faşist ülkeye karşı savaş halindeyken %§Y5§!'ten az Teslimiyet İlerlemesine sahip olmak £GFX_power_balance_texticon §YKamu Güvenini§! artıracaktır. \n  - §RBölünmüş Proletarya§!: $communism$ ideolojisi için %§Y80§!'den az desteğe sahip olmak £GFX_power_balance_texticon §YKamu Güvenini§! azaltacaktır. \n  - $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_annala_tt:0 "§GGüçlü Ulus§!: Sahada §Y300.000§!'den fazla £GFX_manpower_texticon  $MANPOWER$ ve bir Faşist ülkeye karşı savaş halindeyken %§Y5§!'ten az Teslimiyet İlerlemesine sahip olmak £GFX_power_balance_texticon §YKamu Güvenini§! artıracaktır. \n  - §RSosyalistlere Yönelik Endişe Verici Destek§!: $democratic$ veya $communism$ ideolojileri için %§Y9§!'dan fazla desteğe sahip olmak £GFX_power_balance_texticon §YKamu Güvenini§! azaltacaktır. \n  - $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_kallio_tt:0 "§GAşırılıkçıları Yok Et§!: $fascism$ ve $communism$ ideolojileri için %§Y1§!'den az desteğe sahip olmak £GFX_power_balance_texticon §YKamu Güvenini§! artıracaktır. \n  - §RAşırılıkçılara Yönelik Endişe Verici Destek§!: $fascism$ veya $communism$ ideolojileri için %§Y9§!'dan fazla desteğe sahip olmak £GFX_power_balance_texticon §YKamu Güvenini§! azaltacaktır. \n  - $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_kuusinen_tt:0 "§GBir Organizasyonlar Güneş Sistemi§!: Tüm §Yİskandinav§! ve §YBaltık çekirdek eyaletlerinin§! Finlandiya veya bir müttefik tarafından kontrol edilmesi £GFX_power_balance_texticon §YKamu Güvenini§! artıracaktır. \n  - §RUnutulmuş Fin-Karelyalılar§!: §YKarjala§!, §YKola§!, §YOnega§! ve §YOlonets§! eyaletlerini kontrol etmemek £GFX_power_balance_texticon §YKamu Güvenini§! azaltacaktır. \n  - $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_leino_tt:0 "§GAvrupa Faşizmi Yok Edildi§!: Avrupa'yı Faşist hükümetlerden uzak tutarken $fascism$ ideolojisi için §Y%1§!'den az desteğe sahip olmak £GFX_power_balance_texticon §YHalkın Güveni§!'ni artıracaktır. \n  - §RBölünmüş Proletarya§!: $communism$ ideolojisi için §Y%80§!'den az desteğe sahip olmak £GFX_power_balance_texticon §YHalkın Güveni§!'ni azaltacaktır. \n  - $losing_soverignty_threatened_tt$"
