 take_claimed_state_desc:0 "$TARGET|Y$ ülkesinden $STATE|Y$ eyaletini al"
 take_claimed_state_short_desc:0 "Bu savaş hedefi, seçilen eyaletleri barış konferansında almayı daha ucuz hale getirecektir."
