l_english:
 MR_pact_litvinov:0 "Litvinov"
 MR_pact_molotov:0 "Molotov"
 MR_pact_ribbentrop:0 "Ribbentrop"
 anglo_egypt_treaty:0 "İngiliz-Mısır Antlaşması"
 anglo_egypt_treaty_desc:0 "Nominal olarak bağımsız olmasına rağmen, Mısır 1882'den beri korumamız altındadır. Kral Faruk, Habeşistan'daki İtalyan askeri operasyonları ışığında ilişkimizi bir antlaşmayla resmileştirmek istiyor. Mısır bize bir müttefik olarak katılacak, biz ise Süveyş Kanalı'nın kontrolünü elimizde tutacak ve savaş durumunda savunmalarına yardım etmeyi taahhüt edeceğiz."
 anglo_egypt_treaty_short_desc:0 "§LMısır'ı bir müttefik olarak tutarken bağımsızlığını resmileştir.§!"
 annex_everything:0 "İlhak Et"
 annex_everything_desc:0 "Seçilen eyaleti ilhak et."
 annex_everything_short_desc:0 "Bu savaş hedefi, ilhak etmeyi barış konferansında seçmeyi daha ucuz hale getirecektir."
 annex_tannu_tuva:0 "Tannu Tuva'yı İlhak Et"
 annex_tannu_tuva_desc:0 "Tuva Halk Cumhuriyeti, adı dışında her şeyiyle bir Sovyetler Birliği üyesidir. Onları resmen büyük ulusumuza ilhak ederek ilişkiyi resmileştirelim."
 annex_tannu_tuva_short_desc:0 "§LTannu Tuva'yı Sovyetler Birliği'ne dahil et.§!"
 anschluss:0 "Anschluss'u Gerçekleştir"
 anschluss_1:0 "Siyasete nüfuz et"
 anschluss_desc:0 "Anschluss, yani Avusturya ile birleşme, Alman halkının uzun süredir devam eden bir hedefidir. Versay Antlaşması tarafından yasaklanmış olmasına rağmen, bunu gerçekleştirme zamanı nihayet geldi. İlhak için zemini hazırlamak üzere Avusturya'daki yerel faşizm desteğini artırmalıyız."
 anschluss_short_desc:0 "§LAvusturya'da Faşizm için halk desteğini artırmak üzere gizli yollar kullan.§!"
 anti_comintern_pact:0 "Anti-Komintern Paktı"
 anti_comintern_pact_desc:0 "Komintern olarak bilinen Komünist Enternasyonal'in amacının, emrindeki tüm araçlarla mevcut Devletleri parçalamak ve boyun eğdirmek olduğunu kabul eden; Komünist Enternasyonal'in ulusların iç işlerine müdahalesine müsamaha göstermenin sadece onların iç barışını ve sosyal refahını tehlikeye atmakla kalmayıp, aynı zamanda dünya barışına da bir tehdit olduğuna inanan; Komünist yıkıcı faaliyetlere karşı savunmada işbirliği yapmayı arzulayan bir pakt yapma zamanı geldi.\nBu, pakta katılan uluslarla ilişkileri geliştirecektir."
 anti_comintern_pact_short_desc:0 "§Lİtalya ve Japonya ile birlikte komünizme karşı birleşik bir cephe oluştur.§!"
 british_far_east:0 "İngiliz Uzak Doğusu"
 british_far_east_desc:0 "Japonya'nın Büyük Doğu Asya'da yeni bir düzenin lideri olarak hak ettiği yeri alabilmesi için Britanya'nın Asya sömürge imparatorluğundan arındırılması gerekiyor. Hong Kong'u ele geçir, Malay Yarımadası'nı işgal et ve Burma'ya ilerle. Hindistan'a doğru sınır boyunca yeni bir cephe kur."
 british_far_east_short_desc:0 "§LHong Kong, Singapur ve Burma'nın fethini tamamla.§!"
 build_factories:0 "Fabrikalar İnşa Et"
 build_factories_desc:0 "Yeni fabrikalar inşa etmek, hem inşaat sırasında hem de sonrasında iş yaratır; bu, ekonomiyi iyileştirmede hayati bir adımdır."
 build_factories_short_desc:0 "§LEkonomiyi iyileştirmek için yeni sivil fabrikalar inşa et.§!"
 build_infrastructure:0 "Altyapı İnşa Et"
 build_infrastructure_desc:0 "Altyapı inşa etmek sadece ulusumuzda seyahat etmeyi kolaylaştırmakla kalmayacak, daha da önemlisi iş yaratacak ve mevcut durgunluktan çıkmamıza yardımcı olacaktır."
 build_infrastructure_short_desc:0 "§LÜlkemizdeki altyapıyı genişlet.§!"
 chain_home:0 "Chain Home Radar Ağı"
 chain_home_desc:0 "Hava savaşının ortaya çıkışı Britanya'yı savunmasız hale getirdi - artık bizi güvende tutmak için yalnızca büyük filolarımıza güvenemeyiz. Kıyımız boyunca 'Chain Home' kod adlı bir radar istasyonları ağı için planlar hazırlandı. İnşaatı, hava sahamızın savunmasında bize büyük ölçüde yardımcı olacaktır."
 chain_home_short_desc:0 "§Lİngiliz kıyısı boyunca bir radar istasyonları ağı inşa et.§!"
 chinese_border_incident_SUCCEEDED:0 "Marco Polo Köprüsü Olayı"
 chinese_border_incident_SUCCEEDED_DESC:0 "Kuvvetlerimizin unsurları, Pekin'in hemen güneyindeki stratejik Marco Polo Köprüsü üzerinde kontrol kurmaya çalışırken Çinli askerlerle şiddetli bir çatışmaya çekildi. Çatışma sonuçsuz sona erdi, ancak bir özür ve ek toprak tavizleri talep ettik."
 chinese_coastal_regions:0 "Çin Kıyı Bölgelerini İşgal Et"
 chinese_coastal_regions_desc:0 "Deniz üstünlüğümüzden yararlanmalı ve kıyıları boyunca kilit limanları işgal ederek Çinlileri tecrit etmeliyiz. İmparatorluk Genel Karargahı, Japon kontrolü altına girmesi gereken birkaç bölge belirlemiştir."
 chinese_coastal_regions_short_desc:0 "§LKıyılarını işgal ederek Çinlileri tecrit et.§!"
 chinese_interior:0 "Çin İçlerini İşgal Et"
 chinese_interior_desc:0 "İçlerine ilerleyerek Çin direnişine kesin olarak bir son verelim. Tüm direnişi ezerek onlara etki alanımızın sınır tanımadığını gösterelim. Bu, Asya'da Japon egemenliğini sağlayacaktır."
 chinese_interior_short_desc:0 "§LÇinlileri batıya, içlerine doğru takip et.§!"
 civil_war:0 "İç Savaş"
 civil_war_desc:0 "İç savaş! Ulus, devletin kontrolü için savaşan hiziplere bölündü."
 civil_war_short_desc:0 "Bu savaş hedefi, ilhak etmeyi barış konferansında seçmeyi daha ucuz hale getirecektir."
 claim_baltic_states:0 "Baltık Devletlerini Talep Et"
 claim_baltic_states_desc:0 "Baltık Devletleri, sona ermesi gereken başarısız bir kapitalizm deneyidir. Almanya ile olan paktımız, bölgede cezasız bir şekilde hareket etmemizi sağlıyor ve Estonya, Letonya ve Litvanya'ya sınırları içinde askeri üsler kurmamıza izin vermeleri için ültimatomlar hazırladık. Bu ulusları Sovyet Sosyalist Cumhuriyetler Birliği'nin tam üyeleri olarak dahil etmek o zaman basit bir mesele olacaktır."
 claim_baltic_states_short_desc:0 "§LBaltık Devletlerini Sovyetler Birliği'ne dahil et.§!"
 claim_bessarabia:0 "Besarabya'yı Talep Et"
 claim_bessarabia_desc:0 "Besarabya toprakları, Rus Devrimi'ni izleyen çalkantılı dönemde Romanya tarafından yasadışı olarak işgal edildi. Haklı olarak bize aittir ve iade edilmelidir. Molotov - Ribbentrop Paktı, Alman müdahalesi tehdidi olmadan Rumenlerle başa çıkmak için bize serbestlik veriyor, bu yüzden harekete geçme zamanı şimdi."
 claim_bessarabia_short_desc:0 "§LRumenleri Besarabya'yı bize iade etmeye zorla.§!"
 claim_karelia:0 "Karelya'yı Talep Et"
 claim_karelia_desc:0 "Molotov - Ribbentrop Paktı uyarınca, Finlandiya bizim çıkar alanımızda yer alıyor ve cömert sınırlarını revize etme zamanı geldi. Karelya Kıstağı'ndaki güneydoğu sınırları Leningrad'a kabul edilemez derecede yakın bir konumda bulunuyor ve ulusumuzun güvenliğini tehlikeye atıyor. Helsinki'ye Fin toprak tavizleri için bir talep yayınlayacağız, ancak reddederlerse savaşmaya hazırlıklı olmalıyız."
 claim_karelia_short_desc:0 "§LLeningrad'ın güvenliğini artırmak için Finlandiya'dan Karelya'yı talep et.§!"
 claim_memel:0 "Memel'i Talep Et"
 claim_memel_desc:0 "Memel, nefret edilen Versay Antlaşması'ndan çıkan bir başka adaletsizliktir. İl yüzlerce yıldır Prusya'ya aitti, ancak İtilaf Devletleri onu Almanya'dan ayırmaya ve Litvanya tarafından yasadışı olarak ilhak edilmesine terk etmeye karar verdi. Bu yanlışı düzeltme zamanı geldi."
 claim_memel_short_desc:0 "§LMemel'in Büyük Alman Reich'e geri verilmesini talep et.§!"
 close_panama_canal:0 "Panama Kanalı'nı Kapat"
 close_panama_canal_desc:0 "Amerikalılar, donanma varlıklarını batı ve doğu kıyıları arasında transfer etmek için Panama Kanalı'na güveniyorlar ve bu onların zayıflığıdır! Bir ileri üs kurmak için Galapagos Adaları'nı ele geçirmeli ve ardından kanalı kapatmak için Panama'ya kuvvet çıkarmalıyız. İmparator için!"
 close_panama_canal_short_desc:0 "§LAmerikalıların kullanımını engellemek için Panama Kanalı'nı işgal et.§!"
 condemn_japan:0 "Japonya'yı Kına"
 condemn_japan_desc:0 "Japonların Çin'e karşı yürüttüğü saldırganlık savaşı, medeniyete ve özgürlüğe karşı bir hakarettir ve aynı zamanda Çin'deki Amerikan yaşamlarını, haklarını ve ekonomik çıkarlarını tehlikeye atmaktadır! Japonya saldırılarını durdurmalı veya sonuçlarıyla yüzleşmelidir."
 condemn_japan_short_desc:0 "§LJaponların Çin'e yönelik saldırganlık savaşını kına.§!"
 conquest_of_abyssinia:0 "Habeşistan'ın Fethi"
 conquest_of_abyssinia_desc:0 "Birinci İtalyan-Habeş Savaşı'nın ve Adwa'daki yenilginin acı hatıraları artık geride kaldı. Etiyopya İmparatorluğu'nun tamamen fethine ve İtalyan Doğu Afrikası'na entegrasyonuna kararlıyız. Zafere doğru ilerle!"
 conquest_of_abyssinia_short_desc:0 "§LEtiyopya'nın işgalini gerçekleştir.§!"
 conquest_of_albania:0 "Arnavutluk'un Fethi"
 conquest_of_albania_desc:0 "İtalyan kuvvetleri 1920'de işgal ettikleri Arnavutluk'un bazı kısımlarından aşağılayıcı bir şekilde çekilmek zorunda kaldılar, ancak şimdi geri dönmemiz için doğru zaman. Arnavutluk'un ilhakı bize Adriyatik girişinin tam kontrolünü verecek ve toprak Balkanlar'daki gelecekteki seferler için bir tutunma noktası olarak hizmet edebilir."
 conquest_of_albania_short_desc:0 "§LArnavutluk'u ele geçirerek Adriyatik'i güvence altına al.§!"
 demand_french_indochina_SUCCEEDED:0 "Talepler Gönderildi"
 demand_french_indochina_SUCCEEDED_DESC:0 "Kuvvetlerimiz Fransız Çinhindi sınırları boyunca konumlandırıldı, bu da teklifimizin reddedilmesi durumunda ciddi sonuçları olacağını açıkça ortaya koyuyor."
 demand_indochina_focus:0 "Fransız Çinhindi'ni Talep Et"
 demand_indochina_focus_desc:0 "Avrupa'daki yenilgisinden sonra, Fransa'nın denizaşırı sömürgeleri üzerindeki hakimiyeti en iyi ihtimalle zayıftır. Yeni Fransız hükümetine, Japonya'ya Çinhindi'ndeki üslerine tam erişim vermesi için baskı yap. Bu bölge, gelecekteki seferler için bir sıçrama tahtası olarak faydalı olacaktır."
 demand_indochina_focus_short_desc:0 "§LYeni Fransız hükümetine Çinhindi'ni bırakması için baskı yap.§!"
 demand_indochina_focus_tt:0 "Fransa, §YHindiçin'e§! sahip."
 demand_sudetenland:0 "Südetler'i Talep Et"
 demand_sudetenland_desc:0 "Südetler'deki Alman halkı, Çekoslovak efendileri tarafından zalimce muamele görüyor, bu daha fazla devam etmesine izin verilemeyecek bir suçtur! Südetler ve halkı derhal Almanya'ya devredilmelidir."
 demand_sudetenland_short_desc:0 "§LPrag üzerinde baskı kurmak için Çekoslovakya sınırı boyunca kuvvetleri yığ.§!"
 deutsches_afrikakorps:0 "Deutsches Afrikakorps"
 deutsches_afrikakorps_desc:0 "Kuzey Afrika'da İngilizlere karşı mücadelelerinde İtalyanlara yardım etmeliyiz. Libya'ya bir seferi kuvvet taşı ve İtalyanların Mısır'a doğru ilerlemesini destekle!"
 deutsches_afrikakorps_short_desc:0 "§LLibya'ya kuvvet çıkararak Kuzey Afrika'daki İtalyan operasyonlarını destekle.§!"
 embargo_japan:0 "Japonya'ya Ambargo Uygula"
 embargo_japan_desc:0 "Japonya'nın Çin'e yönelik saldırıları uyarımıza rağmen devam etti. Japonya ile tüm ticarete ambargo uygulama zamanı geldi."
 embargo_japan_short_desc:0 "§LÇin'e yönelik saldırılarına misilleme olarak Japonya ile tüm ticarete ambargo uygula.§!"
 expand_french_air_force:0 "Armée de l'Air'i Genişlet"
 expand_french_air_force_desc:0 "Hava gücü bir sonraki savaşta kritik olacaktır - gökyüzümüzü teslim etmek kaçınılmaz olarak Fransa'nın kendisini teslim etmesi anlamına gelecektir. Fransa'nın dünyanın en iyi hava kuvvetlerinden birine sahip olmasını sağlamak için Armée de l'Air'i genişletmeye devam etmeliyiz."
 expand_french_air_force_short_desc:0 "§LFransa üzerindeki gökyüzünü korumak için hava kuvvetlerimizin boyutunu artır.§!"
 expand_the_luftwaffe:0 "Luftwaffe'yi Genişlet"
 expand_the_luftwaffe_desc:0 "Versay Antlaşması Almanya'nın bir hava kuvveti bulundurmasına izin vermedi, bu yüzden Luftwaffe'yi rekor sürede sıfırdan inşa etmek zorunda kaldık. Önemli ilerleme kaydettik, ancak yapılacak çok şey var. Luftwaffe'yi genişletmeye devam et ve onu dünyanın en iyi hava kuvveti yap."
 expand_the_luftwaffe_short_desc:0 "§LYaklaşan savaşa hazırlanmak için Luftwaffe'nin boyutunu artır.§!"
 extend_maginot_line:0 "Maginot Hattını Genişlet"
 extend_maginot_line_desc:0 "Almanya'ya doğru olan sınırımız müthiş Maginot Hattı tarafından korunuyor, ancak 1914'te olduğu gibi Belçika ve Lüksemburg üzerinden bir Alman kanat saldırısı her zaman bir olasılıktır. Ağır tahkimatlarımızı Manş Denizi'ne kadar uzatmalıyız, bu Belçika'yı Almanların insafına bırakmak anlamına gelse bile."
 extend_maginot_line_short_desc:0 "§LMaginot Hattını Manş Denizi'ne kadar uzat.§!"
 fall_gelb:0 "Fall Gelb"
 fall_gelb_desc:0 "Maginot Hattı, sınırımızdan Fransa'ya doğrudan bir saldırıyı çok maliyetli hale getirirdi. Schlieffen Planı'ndan esinlenerek, OKH bunun yerine Aşağı Ülkeler üzerinden bir işgal hazırladı. Mümkünse, Belçika'ya geçen Müttefik kuvvetlerini aralarına bir kama sokarak ve Fransa'nın geri kalanından ayırarak izole et ve yok et."
 fall_gelb_short_desc:0 "§LAşağı Ülkeler'i işgal edip zaptederek Maginot Hattı'nı atlat.§!"
 fall_grun:0 "Fall Grün"
 fall_grun_desc:0 "İrlanda'da bir köprübaşı kurarak ana İngiliz savunmalarını atlat. Ada kontrolümüz altına girdiğinde, Britanya çok daha izole bir konumda olacaktır. Bu yeni üsten hava ve deniz kuvvetlerimiz inatçı İngilizleri boyun eğmeye zorlayabilir!"
 fall_grun_short_desc:0 "§LBritanya'yı izole etmek ve yeni deniz üsleri sağlamak için İrlanda'ya bir işgal düzenle.§!"
 fall_rot:0 "Fall Rot"
 fall_rot_desc:0 "Şimdi Fransa'ya geniş bir cephe boyunca bir saldırı başlatacak konumdayız. Güneye sür, Marne'ı geçmeye zorla ve Paris'i ele geçir. Manş kıyısı da işgal edilmeli ve fırsat doğduğunda Maginot Hattı kuşatılıp yok edilmelidir."
 fall_rot_short_desc:0 "§LGüneye, Fransa'nın içlerine ilerle. Marne bu sefer bizi durduramayacak!§!"
 fall_weiss:0 "Fall Weiss"
 fall_weiss_desc:0 "Polonya'nın işgaline başlanmalıdır. Önemli stratejik hedefler arasında Varşova, Krakow ve Lwow bulunmaktadır. Ayrıca Doğu Prusya'daki kuvvetlerimize en kısa sürede bir kara koridoru kurmalıyız. Bu arada, Fransa'ya doğru olan sınırımız ne pahasına olursa olsun savunulmalıdır. Moselland veya Württemberg'in Fransızların eline geçmesine izin verme!"
 fall_weiss_short_desc:0 "§LBatı Duvarı'nı Fransızlara karşı tutarken Polonya'yı işgal et.§!"
 fate_of_czechoslovakia:0 "Çekoslovakya'nın Kaderi"
 fate_of_czechoslovakia_desc:0 "Südetler elimizdeyken, Çekoslovakya savunmasız yatıyor. Bu üzücü artık-devleti sona erdirme zamanı geldi."
 fate_of_czechoslovakia_short_desc:0 "§LÇek devletinden geriye kalanları ilhak etmek için Südetler'de kuvvetleri topla.§!"
 five_year_plans:0 "Beş Yıllık Planlar"
 five_year_plans_desc:0 "Ulusal ekonominin gelişimi için beş yıllık planlar, Sovyetler Birliği'nin geleceği için kesinlikle hayati öneme sahiptir. Ekonomik ve endüstriyel geri kalmışlık, yurtdışındaki kapitalist ve faşist güçlerin elinde nihai yıkımımız anlamına gelecektir. Sanayimizi ve üretim çıktımızı genişletmeye devam etmeliyiz!"
 five_year_plans_short_desc:0 "§LSovyetler Birliği'nin sivil sanayi üretimini genişlet.§!"
 fortify_the_westwall:0 "Batı Duvarı'nı Güçlendir"
 fortify_the_westwall_desc:0 "Batı Duvarı, Fransa'nın övülen Maginot Hattı'na paralel uzanır ve önceki Weltkrieg'de Siegfried Hattı'nın kapladığı alanın çoğunu kaplar. Savunmasını güçlendirmek, sınırı daha az adamla tutmamızı sağlayacak ve tümenleri olası doğu seferlerine katılmak için serbest bırakacaktır."
 fortify_the_westwall_short_desc:0 "§LYeni kaleler inşa ederek Batı Duvarı'nın savunmasını artır.§!"
 french_arms_industry:0 "Silah Sanayisini Artır"
 french_arms_industry_desc:0 "Almanya ile başka bir savaş bu noktada giderek daha olası görünüyor. Silah sanayisini genişleterek kendimizi hazırlamalıyız. Fransız Ordusu, Almanya ile Batı Avrupa üzerindeki egemenlik arasında duran tek şeydir!"
 french_arms_industry_short_desc:0 "§LYaklaşan savaşa hazırlanmak için Fransız silah sanayisini geliştir.§!"
 german_advisors_china:0 "Çin'deki Alman Danışmanlar"
 german_advisors_china_desc:0 "Alman askeri danışmanları en az yirmili yıllardan beri Çin'de bulunmakta ve Kuomintang'a kritik destek sağlamaktadır. Mevcut savaşımız göz önüne alındığında, bu artık hoş görülemez. Anti-Komintern Paktı'nın bir imzacısı olarak, Çinlilere yönelik tüm Alman desteğinin derhal geri çekilmesini talep etme hakkımız vardır. Almanların taraf seçme zamanı geldi."
 german_advisors_china_short_desc:0 "§LÇin'e yardım eden Alman danışmanların geri dönmesini talep et.§!"
 gibraltar_east:0 "Doğu'nun Cebelitarık'ı"
 gibraltar_east_desc:0 "Singapur'u büyük bir deniz üssüne dönüştürme çalışmaları Büyük Savaş'ın sonundan beri devam etmektedir. Bu liman, Kraliyet Donanması için bir kale görevi görecek ve Asya'nın her yerine nüfuzumuzu yansıtmamızı sağlayacaktır. Başlanan işi bitir ve Singapur'un savunmasını iyileştir."
 gibraltar_east_short_desc:0 "§LSingapur'un deniz savunmasını iyileştir.§!"
 goal_construction1:0 "Sanayimizi Geliştir"
 goal_construction1_desc:0 "Modern bir ordu, günümüz savaşlarına hükmeden silahları, uçakları, gemileri ve tankları sağlamak için güçlü bir ekonomi gerektirir."
 goal_construction1_short_desc:0 "§LGüçlü bir ordu endüstriyel güç gerektirir, daha fazla fabrika inşa et!§!"
 goal_construction2:0 "Sanayimizi Geliştir"
 goal_construction2_desc:0 "Modern bir ordu, günümüz savaşlarına hükmeden silahları, uçakları, gemileri ve tankları sağlamak için güçlü bir ekonomi gerektirir."
 goal_construction2_short_desc:0 "§LGüçlü bir ordu endüstriyel güç gerektirir, daha fazla fabrika inşa et!§!"
 goal_construction3:0 "Sanayimizi Geliştir"
 goal_construction3_desc:0 "Modern bir ordu, günümüz savaşlarına hükmeden silahları, uçakları, gemileri ve tankları sağlamak için güçlü bir ekonomi gerektirir."
 goal_construction3_short_desc:0 "§LGüçlü bir ordu endüstriyel güç gerektirir, daha fazla fabrika inşa et!§!"
 goal_construction4:0 "Sanayimizi Geliştir"
 goal_construction4_desc:0 "Modern bir ordu, günümüz savaşlarına hükmeden silahları, uçakları, gemileri ve tankları sağlamak için güçlü bir ekonomi gerektirir."
 goal_construction4_short_desc:0 "§LGüçlü bir ordu endüstriyel güç gerektirir, daha fazla fabrika inşa et!§!"
 grand_offensive:0 "Büyük Taarruzu Başlat"
 grand_offensive_desc:0 "Wehrmacht doğuda cesur Polonyalı kuvvetlerle uğraşırken, ittifakımızın yükümlülüklerini yerine getirmeli ve Almanya'nın derinliklerine saldırmalıyız! Ren Vadisi'ndeki sanayi merkezlerini işgal et. Bu, OKW'nin dikkatini çekmeli ve muhtemelen onları Polonya'ya yönelik saldırılarından vazgeçmeye zorlamalıdır."
 grand_offensive_short_desc:0 "§LRen Vadisi'ndeki Alman sanayisini işgal et.§!"
 home_guard:0 "Vatan Muhafızları"
 home_guard_desc:0 "Fransa kaybedildi ve şimdi Britanya'nın kendisi işgal tehdidiyle karşı karşıya. Yerel gönüllülerden oluşan yeni bir savunma örgütü kurulması önerisi sunuldu. Önceki savaştan birçok gazi düzenli askerlik hizmeti için çok yaşlı, ancak bu şekilde savunmamıza hala katkıda bulunabilirler."
 home_guard_short_desc:0 "§LYerel bir gönüllü savunma örgütü kur.§!"
 improve_alpine_line:0 "Alp Hattını İyileştir"
 improve_alpine_line_desc:0 "Güney sınırımızı İtalya'ya karşı savunan 'Küçük Maginot Hattı', askeri planlamamızda her zaman ikincil öneme sahip olmuştur. Ancak Faşist İtalya giderek daha saldırgan hale geliyor ve güney Fransa'da toprak hırsları olduğunu biliyoruz. Alp Hattı'nın tahkimatlarını Maginot Hattı'nınkilerle aynı standartlara getirmeliyiz."
 improve_alpine_line_short_desc:0 "§Lİtalyan sınırı boyunca savunma tahkimatlarımızı iyileştir.§!"
 improve_stalin_line:0 "Stalin Hattını İyileştir"
 improve_stalin_line_desc:0 "Stalin Hattı üzerindeki çalışmalar 1920'lerde batı sınırımız boyunca başladı, bizi yok etmekten başka bir şey istemeyen Batı Avrupa'nın burjuva uluslarına karşı savunmak için. Bu savunmaları iyileştirmeye devam etmeliyiz."
 improve_stalin_line_short_desc:0 "§LYabancı işgaline karşı korunmak için Stalin Hattı boyunca savunmaları iyileştir.§!"
 increase_naval_production_SUCCEEDED:0 "Donanma Üretimi Artırıldı"
 increase_naval_production_SUCCEEDED_DESC:0 "Donanma üretimimizi başarıyla artırdık. Yakında İmparator, dünyanın şimdiye kadar gördüğü en kudretli donanmaya komuta edecek!"
 independence_wargoal:0 "Bağımsızlık"
 independence_wargoal_desc:0 "Bağımsızlık Savaşı"
 independence_wargoal_short_desc:0 "Bağımsızlık Savaşı"
 industrialize_southern_italy:0 "Güney İtalya'yı Sanayileştir"
 industrialize_southern_italy_desc:0 "Kuzey İtalya her zaman ulusumuzun sanayi merkezi olmuştur, güney ise kıyasla fakir ve az gelişmiş kalmıştır. Güney eyaletlerimizde daha fazla sanayi inşa ederek bu ekonomik bölünmeyi kapatmak için adımlar atmalıyız."
 industrialize_southern_italy_short_desc:0 "§LÜlkemizin fakir güney yarısı sanayileştirilmelidir.§!"
 invade_australia:0 "Avustralya'yı İşgal Et"
 invade_australia_desc:0 "Avustralya'ya tam ölçekli bir işgal düzenleme zamanı geldi. Bu, Pasifik'teki en büyük Müttefik güç kalesini kalıcı olarak ortadan kaldıracak ve Büyük Doğu Asya Ortak Refah Alanı'nın güney kanadını güvence altına alacaktır."
 invade_australia_short_desc:0 "§LAvustralya'ya tam ölçekli bir işgal başlat.§!"
 invasion_of_alaska:0 "Alaska'nın İşgali"
 invasion_of_alaska_desc:0 "Ana Adalara kuzey yaklaşımları, Aleut Adaları'nı işgal ederek güvence altına alınmalıdır. Bu adaların kontrolü, Alaska'yı işgal ederek Kuzey Amerika'da bir tutunma noktası kurmamızı daha da sağlayacaktır. Bu bölgenin uzaklığı, Amerikalıların takviye yapmasını zorlaştırmalıdır."
 invasion_of_alaska_short_desc:0 "§LAmerika'nın Alaska'daki topraklarını işgal et ve zaptet.§!"
 invasion_of_india:0 "Hindistan'ın İşgali"
 invasion_of_india_desc:0 "Nihayet, Hindistan alt kıtası üzerindeki İngiliz egemenliği dönemi sona erecek. Burma'dan ilerlemeli ve İngilizleri tamamen Asya'dan sürmeliyiz. Bu, imparatorluklarının asla toparlanamayacağı bir darbe olacaktır!"
 invasion_of_india_short_desc:0 "§LTüm alt kıtayı işgal ederek İngilizleri Hindistan'dan sür.§!"
 invasion_of_south_africa:0 "Güney Afrika'nın İşgali"
 invasion_of_south_africa_desc:0 "Durdurulamaz kuvvetlerimiz şimdi Güney Afrika'ya saldırmak için bir konumdadır. Fethi, Müttefik donanma birimlerinin Süveyş Kanalı'nı kullanmadan Hint Okyanusu'na girmesini çok zorlaştırmalıdır. Yozlaşmış İngiliz İmparatorluğu gözlerimizin önünde çözülüyor."
 invasion_of_south_africa_short_desc:0 "§LGüney Afrika'ya kuvvet çıkar ve tüm direnişi yok et.§!"
 invasion_of_west_coast:0 "Ketsu-Go Operasyonu"
 invasion_of_west_coast_desc:0 "İmparatorluk Genel Karargahı, Batı Kıyıları'na bir işgal düzenleyerek Amerika ile olan savaşımızı kesin bir sona erdirmeyi seçti. Bu operasyonun hedefleri arasında Los Angeles, San Francisco ve Seattle bulunmaktadır. Köprübaşlarımıza yönelik olası karşı saldırılara hazırlıklı olun."
 invasion_of_west_coast_short_desc:0 "§LAmerika'nın Batı Kıyısı'na bir işgal başlat.§!"
 isolate_australia:0 "Avustralya'yı Tecrit Et"
 isolate_australia_desc:0 "Avustralya, Müttefiklerin Pasifik'teki savaş çabaları için hayati öneme sahiptir ve Japonya'ya ve onun haklı fetihlerine karşı kuvvetlerin toplandığı bir üs olarak hizmet etmesine izin verilmemelidir. Güneybatı Pasifik'teki kilit adaları alarak, Avustralya'yı Amerika Birleşik Devletleri'nden tecrit edebiliriz."
 isolate_australia_short_desc:0 "§LAvustralya'yı çevreleyen kilit adaları işgal ederek onu tecrit et.§!"
 liberate_wargoal:0 "Özgürleştir"
 liberate_wargoal_desc:0 "Bu savaş hedefi, barış konferansında özgürleştirmeyi seçmeyi daha ucuz hale getirecektir."
 liberate_wargoal_short_desc:0 "Özgürleştir"
 may_provoke_hostility:0 "§R[This.GetName] ve diğer uluslar bu eyleme düşmanlıkla karşılık verebilir.§!"
 molotov_ribbentrop_pact:0 "Molotov-Ribbentrop Paktı"
 molotov_ribbentrop_pact_desc:0 "SSCB ile bir dostluk ve saldırmazlık antlaşması imzalayarak, mevcut sınırlarımız arasında yer alan devletlerle ne yapacağımız konusunda bir anlaşmaya varabilir ve daha yüksek hacimli ticaret yapabiliriz. Saldırmazlık şartlarına ek olarak, antlaşma Romanya, Polonya, Litvanya, Letonya, Estonya ve Finlandiya topraklarını Nazi ve Sovyet nüfuz alanlarına ayıran gizli bir protokol içerir ve bu ülkelerin potansiyel toprak ve siyasi yeniden düzenlemelerini öngörür."
 molotov_ribbentrop_pact_short_desc:0 "§LSovyet müdahalesinden kaçınmak için SSCB ile bir saldırmazlık paktı imzala.§!"
 naval_expansion_focus:0 "Donanma Üretimini Artır"
 naval_expansion_focus_desc:0 "Artık Washington Deniz Antlaşması'na bağlı değiliz ve bir ada ülkesi olarak donanma, hayatta kalmamız için kritik öneme sahiptir. Donanma üretimini artırmak için liman tesislerimizi genişletmeliyiz. Ancak o zaman Japonya hak ettiği filoyu inşa edebilir."
 naval_expansion_focus_short_desc:0 "§LJaponya'nın donanma üretimini daha fazla tersane inşa ederek artır.§!"
 occupy_libya_fra:0 "İtalyan Libya'sını İşgal Et"
 occupy_libya_fra_desc:0 "İtalya'nın sömürge imparatorluğu dağıtılmalıdır. Tunus himayemizden İtalyan Libya'sına bir saldırı başlat ve Akdeniz kıyılarını işgal et. Hayati hedefler arasında Trablus ve Bingazi'nin stratejik liman şehirleri bulunmaktadır."
 occupy_libya_fra_short_desc:0 "§LTrablus ve Bingazi'yi işgal etmek için bir saldırı başlat.§!"
 occupy_north_italy_fra:0 "Kuzey İtalya'yı İşgal Et"
 occupy_north_italy_fra_desc:0 "Fransız ordularının bir kez daha kuzey İtalya'ya yürüme zamanı geldi. İtalyan savaş sanayisinin çoğu orada yoğunlaşmıştır ve Roma onun kullanımından mahrum bırakılmalıdır. Övülen Vallo Alpino'yu aş ve Po Vadisi'ne hücum et. Vive la France!"
 occupy_north_italy_fra_short_desc:0 "§LÖvülen Vallo Alpino'yu aş ve Po Vadisi'ne hücum et.§!"
 occupy_philippines:0 "Filipinler'i İşgal Et"
 occupy_philippines_desc:0 "Başarılı bir Pasifik seferinin ilk adımı Filipinler'in işgalidir. Amerikalılar adaları doğrudan Japonya'ya saldırmak için bir ileri üs olarak kullanmaktan çekinmeyeceklerdir, ancak biz de onu Güney Kaynak Bölgesi'ne karşı gelecekteki operasyonlarda aynı amaçla kullanabiliriz."
 occupy_philippines_short_desc:0 "§LBize karşı bir üs olarak kullanılmasını engellemek için Filipinler'e kuvvet çıkar.§!"
 occupy_south_italy_fra:0 "Güney İtalya'yı İşgal Et"
 occupy_south_italy_fra_desc:0 "İtalyan yarımadasının güney yarısı, Sicilya ve Sardinya ile birlikte güvence altına alınmalıdır. Tüm hedefleri ele geçir, ancak ana hedefimiz olan Roma'dan dikkatin dağılmasın. Ebedi Şehir'i işgal ettikten sonra, kıyı boyunca ilerlemeye devam et ve kalan direniş ceplerini ortadan kaldır."
 occupy_south_italy_fra_short_desc:0 "§LSicilya ve Sardinya'yı İtalyan başkentiyle birlikte ele geçir.§!"
 operation_barbarossa:0 "Barbarossa Operasyonu"
 operation_barbarossa_desc:0 "Tarihin en büyük askeri seferine başlamak üzereyiz - Sovyetler Birliği'nin işgali! Napolyon'un başarısız olduğu yerde, biz başarılı olacağız. Sınır boyunca ileri atıl, Sovyet birliklerini kuşat ve yok et ve doğuya doğru ilerlemeye devam et. Moskova'yı ele geçirir ve Arhangelsk - Astrahan ekseni boyunca uzanan bir cephe hattı kurmayı başarırsak operasyon başarılı sayılacaktır. Drang nach Osten!"
 operation_barbarossa_short_desc:0 "§LSovyetler Birliği'ni işgal et ve Arhangelsk - Astrahan hattına ulaş.§!"
 operation_buffel:0 "Büffel Operasyonu"
 operation_buffel_desc:0 "Yarattığımız yeni dünya düzeninde Almanya'nın liderliğini güvence altına almak için, kıta Amerika Birleşik Devletleri'ne tam ölçekli bir işgal yapılmalıdır. Kuzeydoğu Amerikan kıyısı boyunca önemli siyasi ve endüstriyel hedefler, Washington'daki Beyaz Saray da dahil olmak üzere derhal işgal edilmelidir."
 operation_buffel_short_desc:0 "§LKuzey Amerika'yı işgal et ve ABD Doğu Kıyısı'ndaki önemli hedefleri zaptet.§!"
 operation_felix:0 "Felix Operasyonu"
 operation_felix_desc:0 "Akdeniz'deki Müttefik operasyonları, Cebelitarık Boğazı'nı kapatarak kısıtlanmalıdır, ancak İspanyolların davamızı destekleyeceğine güvenilemez. Pireneler üzerinden tam ölçekli bir işgal başlatarak konuyu zorlamalıyız. Hem İspanya hem de Portekiz, Almanya'nın güneybatı kanadını korumak için işgal edilmelidir."
 operation_felix_short_desc:0 "§Lİber yarımadasını işgal et ve Cebelitarık'ın ele geçirilmesini sağla.§!"
 operation_gertrude:0 "Gertrude Operasyonu"
 operation_gertrude_desc:0 "Türkiye'nin işgali, kuvvetleri Avrupa'dan Orta Doğu'ya daha kolay kaydırmamızı sağlayacak ve bize Karadeniz'e tek girişin tam kontrolünü verecektir. Hiçbir koşul altında Türklerin Müttefiklerle hizalanmasına izin verilmemelidir!"
 operation_gertrude_short_desc:0 "§LTürkiye'ye bir işgal düzenleyerek Karadeniz'e girişi güvence altına al.§!"
 operation_herkules:0 "Herkules Operasyonu"
 operation_herkules_desc:0 "Malta'daki İngiliz üssü çok uzun zamandır başımıza bela oldu. Kuzey Afrika'daki operasyonlara müdahale etmeye devam ediyor ve ada Müttefik kontrolü altında olduğu sürece Orta Akdeniz çekişmeli kalacaktır. Ele geçirilmesini sağlamalıyız."
 operation_herkules_short_desc:0 "§LMalta'yı ele geçir ve İngilizlerin üs olarak kullanmasını engelle.§!"
 operation_ikarus:0 "Ikarus Operasyonu"
 operation_ikarus_desc:0 "Kuzey Atlantik'teki Kriegsmarine operasyonlarını desteklemek için, OKW İzlanda'nın işgaline yeşil ışık yaktı. Bu adanın kontrolü, operasyonel menzilimizi daha batıya genişletecek ve Atlantik Savaşı'nı başarılı bir sonuca ulaştırma çabalarımıza büyük ölçüde yardımcı olacaktır."
 operation_ikarus_short_desc:0 "§LAtlantik Savaşı'nı kazanma yolunda bir adım olarak İzlanda'yı işgal et.§!"
 operation_knickerbocker:0 "Knickerbocker Operasyonu"
 operation_knickerbocker_desc:0 "Savaşı Atlantik'in ötesine taşımalıyız. Amerikan Doğu Kıyısı'na bir işgal başlatmadan önce, kuvvetlerimizi yığabileceğimiz üsleri güvence altına almalıyız. Kriegsmarine hem Newfoundland hem de Bermuda için işgal planları hazırladı. Bu adalardan herhangi biri amaçlarımıza uygun olacaktır."
 operation_knickerbocker_short_desc:0 "§LAmerika'ya bir işgal hazırlığı için Atlantik'te üsler güvence altına al.§!"
 operation_laudabiliter:0 "Laudabiliter Operasyonu"
 operation_laudabiliter_desc:0 "İrlanda'nın bağımsızlığı İngiliz onuruna bir lekedir. Kendi iyilikleri için, İrlandalılar Londra'dan sert bir elle yönetilmelidir. Bu başıboş koyunları tekrar sürüye katacak bir işgal için planlama devam etmektedir."
 operation_laudabiliter_short_desc:0 "İrlanda'yı işgal et ve Britanya için yeniden fethet."
 operation_mungo:0 "Mungo Operasyonu"
 operation_mungo_desc:0 "Büyük İskender'in izinden giden kuvvetlerimiz İndus Vadisi'ne ulaştı. Şimdi İngilizleri imparatorluklarının mücevherinden mahrum bırakacak bir konumdayız. Hindistan'a tam ölçekli bir işgal başlat!"
 operation_mungo_short_desc:0 "§Lİngiliz Hindistan'ına bir işgal başlat ve Vaterland için fethet.§!"
 operation_seelowe:0 "Seelöwe Operasyonu"
 operation_seelowe_desc:0 "Batı'daki zaferimiz ancak Büyük Britanya'nın tamamen işgaliyle sağlanabilir. Manş Denizi üzerinden bir çıkarma operasyonu yapmalı ve İngiliz topraklarında bir köprübaşı kurmalıyız. Öncü birliklerimiz daha sonra kırsal alana yayılarak tüm Britanya işgal edilene kadar ilerleyebilir. İmparatorlukları o zaman bir kağıttan ev gibi çökmelidir. Vorwärts!"
 operation_seelowe_short_desc:0 "§LBritanya'ya büyük bir amfibi işgali başlat ve Londra'yı ele geçir.§!"
 operation_tannenbaum:0 "Tannenbaum Operasyonu"
 operation_tannenbaum_desc:0 "İsviçre, Avrupa'nın yüzündeki bir sivilcedir ve İsviçrelilerin kendileri Alman halkının yoldan çıkmış bir kolunu temsil eder. Ne pahasına olursa olsun Büyük Almanya'ya entegre edilmelidirler. Dağ kalelerine saldır ve bu ulus maskaralığına bir son ver."
 operation_tannenbaum_short_desc:0 "§Lİsviçre'yi işgal et ve Alman Reich'e ilhak et.§!"
 operation_weserubung:0 "Weserübung Operasyonu"
 operation_weserubung_desc:0 "İskandinav demiri Alman savaş sanayisi için kritiktir ve tedarikimiz korunmalıdır. Kendi işgalimizi düzenleyerek Müttefiklerin Norveç'i işgalini önleyeceğiz. Bu hedefe ulaşma yolunda bir adım olarak, Danimarka da işgal edilmelidir. Bu, Baltık Denizi'ni düşmanlarımıza kapatmanın ek faydasını sağlayacaktır."
 operation_weserubung_short_desc:0 "§Lİskandinav demir ticaretini güvence altına almak için Danimarka ve Norveç'i işgal et.§!"
 operation_zet:0 "Zet Operasyonu"
 operation_zet_desc:0 "Japon faşistleri tüm Çin'i fethetmek için bir savaş yürütüyorlar. Söylemeye gerek yok, onların başarılı olmasını görmek Sovyetler Birliği'nin çıkarına değildir. Çinlilere elimizden gelen desteği sağlamalıyız. Şanslıysak, İmparatorluk Japon Ordusu imparatorluklarını zayıflatan ve onları öngörülebilir gelecekte meşgul tutan bir bataklığa sürüklenecektir."
 operation_zet_short_desc:0 "§LJaponya'ya karşı savaşlarında Çinlilere destek teklif et.§!"
 panzerwaffe:0 "Panzerwaffe'yi Oluştur"
 panzerwaffe_desc:0 "Yeni mobil savaş teorilerimiz, sert vuran bir tank gücünün yaratılmasını gerektiriyor. Kaçınılmaz yaklaşan savaşa hazırlık olarak Panzerwaffe'mizin boyutunu daha da artırmalıyız."
 panzerwaffe_short_desc:0 "§LHeer için yeni panzer tümenleri kurarak zırhlı bir kuvvet oluştur.§!"
 poland_goal:0 "Danzig ya da savaş!"
 poland_goal_1:0 "Savaşa hazırlan"
 poland_goal_2:0 "Savaş ilan et"
 poland_goal_desc:0 "Danzig Alman'dı, Danzig Alman kaldı ve Danzig bundan sonra da Alman olacak! Alman halkını Polonya ile kaçınılmaz savaşa hazırlamalıyız. Bir propaganda kampanyası, Polonya ulusunun suçları dünyaya ifşa edilirken, gelecek savaş için iradelerini çelikleştirecektir. Danzig ve çevresindeki topraklar Almanya'ya geri dönecek!"
 poland_goal_short_desc:0 "§LAlman halkını Polonya ile savaşa hazırla, sonra Varşova'ya yürü!§!"
 puppet_wargoal_focus:0 "Kukla Yap (Odak)"
 puppet_wargoal_focus_desc:0 "$TARGET|Y$ devletini kukla yap"
 puppet_wargoal_focus_short_desc:0 "Bu savaş hedefi, barış konferansında devleti kukla yapmayı daha ucuz hale getirecektir."
 regia_marina:0 "Regia Marina"
 regia_marina_desc:0 "İtalya'nın kaderi doğrudan Akdeniz'e bağlıdır, eski Romalıların iyi anladığı bir şey. Regia Marina'nın Britanya veya Fransa'ya karşı gelecekteki herhangi bir çatışmada kritik bir rol oynayacağı açıktır. Gemi üretimini artırmak için tersanelerimizi genişletmeliyiz."
 regia_marina_short_desc:0 "§LDonanma üretimini artırmak için daha fazla tersane inşa et.§!"
 reichsautobahn:0 "Reichsautobahn'ı Bitir"
 reichsautobahn_desc:0 "1933'teki başlangıcından bu yana, otoban projesi görkemli bir başarı oldu. İnşaat çabaları işsizliği azalttı ve geniş yollar Almanya'nın ekonomik toparlanmasının bir anıtı olarak duruyor. Ancak yapılacak çok iş var."
 reichsautobahn_short_desc:0 "§LKilit eyaletlerde altyapıyı artırarak otoban inşaatını bitir.§!"
 repel_invaders:0 "İşgalcileri Püskürt"
 repel_invaders_desc:0 "Ülkemiz zalimce saldırıya uğradı ve şu anda pis düşman birlikleri tarlalarımızda ve kasabalarımızda yürüyor! Buna devam edilmesine izin verilemez, kuvvetlerimizi toplayın ve işgalcileri püskürtün!"
 repel_invaders_short_desc:0 "§Lİşgalcileri ulusumuzdan sür!§!"
 rhineland:0 "Rhineland'ı Yeniden Askerileştir"
 rhineland_1:0 "Moselland'ı Yeniden Askerileştir"
 rhineland_2:0 "Rheinland'ı Yeniden Askerileştir"
 rhineland_desc:0 "Ren Bölgesi, Birinci Dünya Savaşı'nın sonundan beri askerden arındırılmıştır, ancak bu hakaret daha fazla devam etmeyecek! Almanya egemen bir ulustur ve birliklerini sınırları içinde istediği yere taşımakta özgürdür!"
 rhineland_short_desc:0 "§LVersay Antlaşması'na meydan okuyarak Alman kuvvetlerini Ren'in batısına taşı.§!"
 russian_far_east:0 "Rus Uzak Doğusu"
 russian_far_east_desc:0 "Sovyetlere Asya'da artık hoş karşılanmadıkları gösterilmelidir. Vladivostok'taki Pasifik Filosu üslerinden başlayarak Rus Uzak Doğusu'nu işgal et. Kuzey Sahalin ve Kamçatka da güvence altına alınmalıdır."
 russian_far_east_short_desc:0 "§LRus Uzak Doğusu'nu Japonya için fethet!§!"
 scandinavian_expedition:0 "İskandinav Seferi"
 scandinavian_expedition_desc:0 "Savaşı Fransız topraklarından uzak tutmak için elimizden geleni yapmalıyız ve Norveç ve kuzey İsveç'e bir sefer, Almanya'nın dikkate alması gereken yeni bir cephe açacaktır. Almanya'nın çeliğinin çoğu bu bölgeden geliyor ve ikmali keserek endüstrilerini felç etmek mümkün olabilir."
 scandinavian_expedition_short_desc:0 "§LKuzey İskandinavya'dan Almanya için yeni bir cephe aç.§!"
 second_vienna_award:0 "İkinci Viyana Ödülü"
 second_vienna_award_desc:0 "Trianon Antlaşması, Macaristan'ı haksız yere topraklarının üçte ikisinden fazlasından mahrum bıraktı. Transilvanya'yı Rumenlere kaybetmek özellikle zordu. Ancak Avrupa'da yeni bir düzen kuruldu ve çalınan Macar topraklarının iadesi için Almanya'daki dostlarımıza dilekçe vermeliyiz."
 second_vienna_award_short_desc:0 "§LTransilvanya'nın Macaristan'a iadesi için Almanya'ya dilekçe ver.§!"
 secure_the_indian_ocean:0 "Hint Okyanusu'nu Güvence Altına Al"
 secure_the_indian_ocean_desc:0 "Müttefik filo hareketlerinin Asya'ya doğru olmasını önlemek için Hint Okyanusu üzerinde kontrol kurmalıyız. Afrika kıyılarındaki Madagaskar da dahil olmak üzere birkaç hedef ele geçirilmelidir. Ada, Orta Doğu'ya giden İngiliz konvoylarını bozmak için bir üs olarak kullanılabilir."
 secure_the_indian_ocean_short_desc:0 "§LKilit hedefleri ele geçirerek Hint Okyanusu üzerinde kontrol kur.§!"
 secure_the_pacific:0 "Pasifik'i Güvence Altına Al"
 secure_the_pacific_desc:0 "Pasifik boyunca Amerikan üsleri ele geçirilmeli, böylece filolarının topraklarımız içindeki güç projeksiyon kabiliyeti azaltılmalıdır. İmparatorluk Donanması Genelkurmayı, Hawaii'deki ABD Pasifik Filosu'nun ana üssü de dahil olmak üzere işgal edilmesi gereken birkaç ada belirlemiştir."
 secure_the_pacific_short_desc:0 "§LPasifik üzerindeki kontrolü sağlamak için kilit Amerikan adalarını işgal et.§!"
 seize_berlin_fra:0 "Berlin'i Ele Geçir"
 seize_berlin_fra_desc:0 "Berlin'e yürümekten ve Tricolor'u Reichstag binasının tepesine dikmekten başka seçeneğimiz yok. Bu savaşı ciddiye başlama şansı bulamadan hızlı bir sonuca ulaştıralım."
 seize_berlin_fra_short_desc:0 "§LAlman başkentini işgal et.§!"
 shadow_scheme:0 "Gölge Planı"
 shadow_scheme_desc:0 "Hava Bakanlığı, 'gölge fabrikalar' yaratmak için bir plan geliştirdi - savaş durumunda askeri üretime daha kolay geçebilmeleri için hazırlanacak ve genişletilecek sivil fabrikalar."
 shadow_scheme_short_desc:0 "§LSavaş ihtimaline karşı sivil fabrikaları hazırla ve genişlet.§!"
 siamese_puppet_focus:0 "Siyam'a Baskı Yap"
 siamese_puppet_focus_desc:0 "Kuvvetlerimizin Burma ve Malaya'daki İngiliz mülklerine ulaşabilmesi için Siyam'a erişmesi gerekiyor. Bir güç gösterisi, Siyam hükümetini Büyük Doğu Asya Ortak Refah Alanı'nda sadık ortaklar olarak bizimle bir ittifak imzalamaya ikna edebilir."
 siamese_puppet_focus_short_desc:0 "§LSiyam'ı bizimle hizalanmaya ikna et.§!"
 siberia_beckons:0 "Sibirya Çağırıyor"
 siberia_beckons_desc:0 "İlerlemeye devam etmeli ve Sibirya'ya doğru ilerlememizi sürdürmeliyiz. Rusları, Asya'daki mülklerimizi tehdit etmeyene kadar batıya sür. Sibirya'nın vahşi doğası imparatorluğumuza bir tampon görevi görecek ve bölgenin el değmemiş doğal kaynakları gelecekteki Japon nesillerine kesinlikle fayda sağlayacaktır."
 siberia_beckons_short_desc:0 "§Lİleri yürü ve İmparator adına Sibirya'yı ele geçir.§!"
 south_pacific_mandate:0 "Güney Pasifik Mandası"
 south_pacific_mandate_SUCCEEDED:0 "Güney Pasifik Mandası güçlendirildi"
 south_pacific_mandate_SUCCEEDED_DESC:0 "Mühendislerimiz Güney Pasifik Mandası'ndaki adalarımızı güçlendirdi. Herhangi bir saldırgan, kuvvetlerimizi yerinden sökmenin zor olduğunu görecektir."
 south_pacific_mandate_desc:0 "Son savaştan sonra Milletler Cemiyeti tarafından bize verilen Pasifik'teki topraklarımız, Amerika'ya karşı gelecekteki herhangi bir savaşta Japonya'nın ilk savunma hattını oluşturacaktır. Bu adalar batmaz uçak gemileridir ve onları güçlendirmek için adımlar atmalıyız."
 south_pacific_mandate_short_desc:0 "§LPasifik adalarımızda yeni kıyı kaleleri inşa et.§!"
 southern_resource_area:0 "Güney Kaynak Bölgesi"
 southern_resource_area_desc:0 "İngiliz Borneo'su ve zengin Hollanda Doğu Hint Adaları, alınmaya hazır hayati stratejik hedeflerdir. Japonya, petrol sahalarına ve kauçuk tarlalarına erişimi güvence altına almalıdır, aksi takdirde endüstrileri aç kalacak ve savaş makinesi çökecektir."
 southern_resource_area_short_desc:0 "§LSavaş endüstrimiz için hammadde sağlamak üzere Güney Kaynak Bölgesi'ni işgal et.§!"
 sov_yes_pact:0 "§Y[SOV.GetNameDefCap]§!, §Y$SOV_MOLOTOV_RIBBENTROP_NAME_COMMUNIST$§! Paktı'nı imzalamayı kabul etti."
 strengthen_vallo_alpino:0 "Vallo Alpino'yu Güçlendir"
 strengthen_vallo_alpino_desc:0 "Tehditler kuzey sınırımız boyunca herhangi bir yönden gelebilir. Fransızlar, Avusturyalılar ve Alman dostları, hatta alçak İsviçreliler bile her an saldırabilir! Bir tahkimat hattı üzerinde çalışmalar başladı, ancak ilerleme yavaş. Kuzey İtalya'ya gelecekteki herhangi bir işgali maliyetli hale getirmek için Alp Duvarı'nı bitir!"
 strengthen_vallo_alpino_short_desc:0 "§Lİtalya'nın kuzey sınırını tahkimatları iyileştirerek güvence altına al.§!"
 support_communism:0 "Komünizmi Destekle"
 support_communism_1:0 "Muhalefeti iktidara getir"
 support_communism_desc:0 "Mevcut siyasi liderlik yanlış bir yön aldı. Biraz manipülasyon, bir tutam propaganda ve belki bir iki skandalla hükümet düşürülebilir ve daha Komünist bir parti iktidara gelebilir."
 support_communism_short_desc:0 "§LDaha Komünist bir hükümetin yolunu aç.§!"
 support_democracy:0 "Demokrasiyi Destekle"
 support_democracy_1:0 "Muhalefeti iktidara getir"
 support_democracy_desc:0 "Mevcut siyasi liderlik yanlış bir yön aldı. Biraz manipülasyon, bir tutam propaganda ve belki bir iki skandalla hükümet düşürülebilir ve daha Demokratik bir parti iktidara gelebilir."
 support_democracy_short_desc:0 "§LDaha Demokratik bir hükümetin yolunu aç.§!"
 support_fascism:0 "Faşizmi Destekle"
 support_fascism_1:0 "Muhalefeti iktidara getir"
 support_fascism_desc:0 "Mevcut siyasi liderlik yanlış bir yön aldı. Biraz manipülasyon, bir tutam propaganda ve belki bir iki skandalla hükümet düşürülebilir ve daha Faşist bir parti iktidara gelebilir."
 support_fascism_short_desc:0 "§LDaha Faşist bir hükümetin yolunu aç.§!"
 support_nationalist_spain:0 "Milliyetçi İspanya'yı Destekle"
 support_nationalist_spain_desc:0 "İspanya İç Savaşı, birçokları tarafından zamanımızı tanımlayan küresel ideolojik çatışmaların yerel bir versiyonu olarak görülmektedir. Milliyetçi tarafa ekipman göndererek, İspanyol ulusunu yok edecek anarşistlere ve Kızıllara karşı bir duruş sergileyebiliriz."
 support_nationalist_spain_short_desc:0 "İç Savaş'ta Milliyetçi İspanya'yı desteklemek için ekipman gönder"
 support_republican_spain:0 "Cumhuriyetçi İspanya'yı Destekle"
 support_republican_spain_desc:0 "İspanya İç Savaşı, birçokları tarafından zamanımızı tanımlayan küresel ideolojik çatışmaların yerel bir versiyonu olarak görülmektedir. Cumhuriyetçi tarafa ekipman göndererek, İspanyol nüfusunu ezmeye çalışan faşist haydutlara karşı bir duruş sergileyebiliriz."
 support_republican_spain_short_desc:0 "İç Savaş'ta Cumhuriyetçi İspanya'yı desteklemek için ekipman gönder"
