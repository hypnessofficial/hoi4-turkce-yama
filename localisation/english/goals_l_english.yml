 test_the_chinese_focus:0 "Çin Sınır Olayı"
 test_the_chinese_focus_desc:0 "Çinliler hala Mançurya'yı özgürleştirmemizi tanımayı reddediyorlar ve Pekin yakınlarındaki sınır boyunca yaşanan gerilimler birkaç çatışmayla sonuçlandı. Bir olay çıkarırsak, çatışmayı tam ölçekli bir savaşa tırmandırabiliriz. Bu bize Çinlilerle kesin olarak başa çıkmak için ihtiyacımız olan bahaneyi verecektir!"
 test_the_chinese_focus_short_desc:0 "§LÇin sınırı boyunca kuvvetleri yığarak bir çatışmayı kışkırt.§!"
 test_the_ussr_focus:0 "Sovyet Sınırını Güçlendir"
 test_the_ussr_focus_desc:0 "Kuzey sınırımız boyunca devam eden Sovyet provokasyonlarına cevap vermeliyiz. Kurulmuş Mançurya sınırlarını aralıksız ihlalleri artık hoş görülemez. Gelecekteki ihlalleri caydırmak için kuzey Mançurya'da kuvvetleri yığ."
 test_the_ussr_focus_short_desc:0 "§LSovyet provokasyonlarını caydırmak için Mançurya'da kuvvetleri yığ.§!"
 threaten_japan:0 "Pasifik'te bayrak göster"
 threaten_japan_desc:0 "Japonya'nın ciddi olduğumuzu bilmesini sağlamak için Pearl Harbor'da güçlü bir filo bulundurmak hayati önem taşımaktadır."
 threaten_japan_short_desc:0 "§LPearl Harbor'da güçlü bir filo bulundur.§!"
 topple_government:0 "Hükümeti Devir"
 topple_government_desc:0 "Yönetimdeki hükümeti devir."
 topple_government_short_desc:0 "Bu savaş hedefi, hükümeti devirmeyi barış konferansında seçmeyi daha ucuz hale getirecektir."
 treaty_of_craiova:0 "Craiova Antlaşması"
 treaty_of_craiova_desc:0 "Güney Dobruca, İkinci Balkan Savaşı'ndan sonra Romanya tarafından bizden alındı. Ancak Avrupa'nın sınırları yeniden çizilme sürecindedir ve Romanya zaten taviz vermek zorunda kalmıştır. Kaybettiğimiz topraklarımızın iadesini talep etmeliyiz."
 treaty_of_craiova_short_desc:0 "§LGüney Dobruca'nın Romanya'dan iadesini talep et.§!"
 tripartite_pact:0 "Üçlü Pakt"
 tripartite_pact_desc:0 "Anti-Komintern Paktı'nı güçlendirmek için imzalayan ülkeler önümüzdeki on yıl boyunca \"asıl amaçlarının yeni bir düzen kurmak ve sürdürmek, ilgili halkların karşılıklı refahını ve refahını teşvik etmek\" olduğu konusunda hemfikirdir."
 tripartite_pact_short_desc:0 "§LYeni bir antlaşma imzalayarak İtalya ve Japonya ile daha da yakın bağlar kur.§!"
 victory_or_death:0 "$TARGET|Y$ Devletini Mağlup Et!"
 victory_or_death_desc:0 "Bu savaş ulusumuzun en yüksek önceliği olmalı, tüm kaynaklarımız onlara karşı kullanılmalıdır."
 victory_or_death_short_desc:0 "§LNe pahasına olursa olsun zafer!§!"
