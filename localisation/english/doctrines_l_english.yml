 SUBDOCTRINE_AERIAL_RECONNAISSANCE:0 "Hava Keşfi"
 SUBDOCTRINE_AERIAL_RECONNAISSANCE_DESC:0 "Askeri havacılığın en eski biçimi keşiftir. Bunda, her çağda olduğu gibi, düşmanın nerede olduğunu ve neyin peşinde olduğunu bilmek herhangi bir silahtan daha güçlü olabilir."
 SUBDOCTRINE_AIR_CAVALRY:0 "Hava Süvarisi"
 SUBDOCTRINE_AIR_CAVALRY_DESC:0 "Helikopter, kara savaşına üçüncü, dikey boyutu dahil etme gibi radikal bir olasılık sunuyor. Orduyu maksimum hareketlilik ve sürpriz için bu yeni yaklaşımdan yararlanacak şekilde yapılandırabiliriz."
 SUBDOCTRINE_ALREADY_ASSIGNED:0 "§RBu Alt Doktrin birden fazla yola atanamaz§!"
 SUBDOCTRINE_ANTI_TANK_FRONT:0 "Anti-Tank Cephe Hattı"
 SUBDOCTRINE_ANTI_TANK_FRONT_DESC:0 "Tüm taktik kademelerde anti-tank savunmasına birleşik bir yaklaşım, dost yarma harekatlarının kanatlarını korumak ve düşman zırhlı saldırılarını önceden planlanmış ölüm bölgelerine yönlendirmek."
 SUBDOCTRINE_ARMORED_CAVALRY:0 "Zırhlı Süvari"
 SUBDOCTRINE_ARMORED_CAVALRY_DESC:0 "Hızlı hafif tanklar ve zırhlı araçlarla desteklenen mekanize kuvvetler, zayıf noktaları araştırabilir ve düşmanı en savunmasız olduğu yerden vurabilir."
 SUBDOCTRINE_ARMORED_INFANTRY_SUPPORT:0 "Zırhlı Piyade Desteği"
 SUBDOCTRINE_ARMORED_INFANTRY_SUPPORT_DESC:0 "Ateş güçleri ve korumalarıyla tanklar, makineli tüfekleri ve piyadenin ilerlemesini engelleyen diğer silahları hızla etkisiz hale getirebilir. Tank-Piyade işbirliği kusursuz olmalıdır."
 SUBDOCTRINE_ARMORED_RAIDERS:0 "Zırhlı Akıncılar"
 SUBDOCTRINE_ARMORED_RAIDERS_DESC:0 "Konvoy eskortları öncelikle denizaltı savunmasına odaklanır. Tam teçhizatlı bir ana muharebe gemisi koyunların arasındaki bir kurt gibi ortalarında belirdiğinde yaşayacakları şoku hayal edin."
 SUBDOCTRINE_ARMORED_SPEARHEAD:0 "Zırhlı Mızrak Başı"
 SUBDOCTRINE_ARMORED_SPEARHEAD_DESC:0 "Tank, sadece yıpratma yerine bir hareket savaşı yaratma fırsatı sunar. Doktrinimiz, düşmanı kuşatmak ve yok etmek için yarmaların hızlı bir şekilde kullanılmasına vurgu yapmalıdır."
 SUBDOCTRINE_ASSAULT_INFANTRY:0 "Hücum Piyadesi"
 SUBDOCTRINE_ASSAULT_INFANTRY_DESC:0 "Orduyu, en küçük taktik birime kadar entegre edilmiş organik ateş destek unsurlarıyla, muharebeye müşterek harp yaklaşımıyla organize edin."
 SUBDOCTRINE_BATTLECRUISER_SUPREMACY:0 "Hızlı Savaş Gemileri"
 SUBDOCTRINE_BATTLECRUISER_SUPREMACY_DESC:0 "Herkesin büyük toplara sahip olduğu bir dünyada, hızlı ana muharebe gemileri istediğimiz kavgaları seçme ve istemediklerimizden kaçma yeteneği sunar."
 SUBDOCTRINE_BATTLESHIP_ANTIAIR_SCREEN:0 "Uçaksavar Savaş Gemileri"
 SUBDOCTRINE_BATTLESHIP_ANTIAIR_SCREEN_DESC:0 "Savaş gemileri, güverte silahları için rakipsiz bir fırsat sunar. Onları düşman uçaklarını hedef alacak şekilde donatmak, görev güçlerimiz için gökyüzünü temiz tutmak adına bir öncelik olmalıdır."
 SUBDOCTRINE_BENEFIT_DESCRIPTION:0 "§gBir Alt Doktrin atamak, bu yolda§! £doctrine_mastery §HUstalık§!§g kazanılmasını sağlar. Belirli ustalık eşiklerine ulaşıldığında, Alt Doktrin ek etkilerin kilidini açar.§!"
 SUBDOCTRINE_BOMBER_INTERCEPTION:0 "Ağır Önleyiciler"
 SUBDOCTRINE_BOMBER_INTERCEPTION_DESC:0 "Çeviklik eksiklikleri daha hafif uçaklara karşı bir dezavantaj olsa da, ağır avcı uçakları yıkıcı anti-bombardıman ateş gücü taşıyabilir."
 SUBDOCTRINE_BROAD_NAVAL_SUPPORT:0 "Genelleştirilmiş Destek"
 SUBDOCTRINE_BROAD_NAVAL_SUPPORT_DESC:0 "Keşif, hava üstünlüğü ve vuruş kabiliyeti tek bir pakette sunulan uçak gemileri, görev gücü komutanının elinde paha biçilmez bir her işe yarayan araçtır."
 SUBDOCTRINE_CARPET_BOMBING:0 "Halı Bombardımanı"
 SUBDOCTRINE_CARPET_BOMBING_DESC:0 "30.000 feet yükseklikten nokta hedefleri vurmaya çalışmak genellikle bomba israfıdır. Yan yana uçmak ve geniş bir yıkım şeridi oluşturmak, ...bir şeyi vurmanın daha güvenilir bir yoludur."
 SUBDOCTRINE_CARRIER_AIRFIELDS:0 "Yüzen Havaalanları"
 SUBDOCTRINE_CARRIER_AIRFIELDS_DESC:0 "Bir uçak gemisi güvertesi, Dünya üzerindeki en pahalı gayrimenkuldür. Ondan maksimum miktarda hava gücü elde etmek için hiçbir çabadan kaçınılmamalıdır."
 SUBDOCTRINE_CARRIER_BATTLEGROUPS:0 "Uçak Gemisi Muharebe Grupları"
 SUBDOCTRINE_CARRIER_BATTLEGROUPS_DESC:0 "Uçak gemisi, çağımızın başat deniz silahı olarak savaş gemisinin yerini hızla alıyor. Filolarımız onların etrafında merkezlenmelidir."
 SUBDOCTRINE_CARRIER_STRIKES:0 "Denizden Kıyıya Hava Gücü"
 SUBDOCTRINE_CARRIER_STRIKES_DESC:0 "Dünyanın neredeyse tüm endüstrisi ve savaş yapma potansiyeli bir kıyı şeridinin hava saldırısı menzili içindedir. Uçak gemilerimiz hava gücünü düşmanın arka bahçesine yerleştirebilir."
 SUBDOCTRINE_COASTAL_AIR_PATROL:0 "Kıyı Hava Devriyesi"
 SUBDOCTRINE_COASTAL_AIR_PATROL_DESC:0 "Geleneksel deniz seviyesi kıyı savunma araçları insan gücü yoğundur ve verimsizdir. Havadan hareketlilik, dost kıyıları gözleyebileceğimiz ve olası işgalcileri cezalandırabileceğimiz anlamına gelir."
 SUBDOCTRINE_COASTAL_DEFENCE:0 "Kıyı Savunma Filosu"
 SUBDOCTRINE_COASTAL_DEFENCE_DESC:0 "Menzil yerine ateş gücüne öncelik veren ve dost kıyılara yakın faaliyet gösteren daha küçük savaş gemileri, düşman filosuna karşı önemli bir caydırıcılık sağlayabilir."
 SUBDOCTRINE_COMMANDOS:0 "Bireysel Mükemmellik"
 SUBDOCTRINE_COMMANDOS_DESC:0 "Her Adam Bir İmparator: Birliklerimiz bireysel olarak zor ve zahmetli görevleri üstlenebilmeli ve her zaman kendi ağırlıklarını taşıyabilmelidir. Onları nasıl eğittiğimiz, cephedeki başarımız için hayati önem taşır."
 SUBDOCTRINE_COST_REDUCTION:0 "Alt Doktrin maliyeti: $VALUE|%=-0$"
 SUBDOCTRINE_DEEP_AIR_RAIDS:0 "Derin Hava Akınları"
 SUBDOCTRINE_DEEP_AIR_RAIDS_DESC:0 "Doğru teçhizat ve eğitimle, düşmanın iç bölgelerinde vurulamayacak kadar derin bir hedef yoktur. Düşman, bombalarımızdan hiçbir yerin güvenli olmadığını bilecektir."
 SUBDOCTRINE_DEEP_BATTLE:0 "Derinlemesine Muharebe"
 SUBDOCTRINE_DEEP_BATTLE_DESC:0 "Modern silahların menzili ve vurucu gücü, bir düşman savunma sisteminin tüm derinliğine, aynı anda, elimizdeki her silahla vurularak aşılmasını sağlar."
 SUBDOCTRINE_DEFENSIVE_POSTURES:0 "Savunma Duruşları"
 SUBDOCTRINE_DEFENSIVE_POSTURES_DESC:0 "Saldırgana zayiat verdirmek ve geciktirmek için inatla yer tutmaya yönelik savunma taktikleri üzerine bir eğitim ve doktrinel vurgu."
 SUBDOCTRINE_DESCRIPTION:0 "Bir Alt Doktrin aracılığıyla, belirli bir alandaki savaş yaklaşımımızı uzmanlaştırır ve mükemmelleştiririz."
 SUBDOCTRINE_DISPERSED_OPERATIONS:0 "Dağınık Operasyonlar"
 SUBDOCTRINE_DISPERSED_OPERATIONS_DESC:0 "Gökyüzü düşmana ait olduğunda ordularımız kolay bir hedef olmayı reddetmelidir. Dağınık düzenler, güçlendirilmiş lojistik ve yoğun uçaksavar ateşi, havada rekabet edemediğimiz yerlerde savaşmaya devam etmemizi sağlar."
 SUBDOCTRINE_DIVE_BOMBERS:0 "Nokta Atışı Vuruşlar"
 SUBDOCTRINE_DIVE_BOMBERS_DESC:0 "Aktif bir kara muharebesi sırasında ön cephedeki hedeflere yapılan hava saldırıları, uçakları yer ateşine maruz bırakır ve dost birlikler için riskli olabilir, ancak uç noktadaki etkileri dramatiktir."
 SUBDOCTRINE_DOGFIGHTING_MASTERY:0 "Göklerin Şövalyeleri"
 SUBDOCTRINE_DOGFIGHTING_MASTERY_DESC:0 "Modern savaşta neredeyse benzersiz bir şekilde, bir savaş pilotu tek başına savaşır. Her pilotun bireysel mükemmelliğini sağlamalıyız."
 SUBDOCTRINE_ESCORT_CARRIER_SUPPORT:0 "Eskort Uçak Gemisi Desteği"
 SUBDOCTRINE_ESCORT_CARRIER_SUPPORT_DESC:0 "Küçük, ekonomik eskort uçak gemileri, konvoylarımıza varış noktalarına kadar savunma amaçlı hava koruması sağlar. Hiçbir düşman denizaltısı cezasız bir şekilde saldıramaz."
 SUBDOCTRINE_ESCORT_FIGHTER:0 "Orta Menzilli Eskort"
 SUBDOCTRINE_ESCORT_FIGHTER_DESC:0 "Taarruz uçaklarımızın cezasız bir şekilde operasyon yapabilmesi için, gökyüzünü düşman uçaklarından temizlemek üzere avcı uçakları tarafından yakından desteklenmeleri gerekir."
 SUBDOCTRINE_EXCLUSIVE_INFO_ENTRY:0 " $NAME|Y$"
 SUBDOCTRINE_EXCLUSIVE_INFO_TITLE:0 "§RŞununla karşılıklı olarak dışlayıcıdır:§!"
 SUBDOCTRINE_EXPEDITIONARY_WARFARE:0 "Seferi Harp"
 SUBDOCTRINE_EXPEDITIONARY_WARFARE_DESC:0 "Dünyadaki tüm muharebe gücü, eğer savaşa gidemiyorsa çok az şey ifade eder. Stratejik amaçlarımıza hizmet edecek şekilde güç projeksiyonu kabiliyetine organizasyonel bir vurgu yapacağız."
 SUBDOCTRINE_FIELD_ENGINEERING:0 "Saha İstihkamcılığı"
 SUBDOCTRINE_FIELD_ENGINEERING_DESC:0 "Askeri mühendislerin rolü köprüler kurmak ve mayın döşemenin yanı sıra düşmanın benzer eserlerini yok etmektir. Doğru teçhizat, eğitim ve kan dökmekten kaçınmak için ter dökmeye isteklilikle modern savaş alanına hükmedebiliriz."
 SUBDOCTRINE_FIGHTER_BOMBERS:0 "Avcı-Bombardıman Uçakları"
 SUBDOCTRINE_FIGHTER_BOMBERS_DESC:0 "Düşman uçaklarıyla savaşmak gerekmediğinde, avcı uçaklarımız orduya yardım etmek için yer hedeflerine saldırılara odaklanabilir."
 SUBDOCTRINE_FIGHTER_CENTRAL_FIELD:0 "Deniz Havacılığı"
 SUBDOCTRINE_FIGHTER_CENTRAL_FIELD_DESC:0 "Hava gücü çağın baskın silahıdır ve uçak gemisi, onun yıkıcı vuruş potansiyelinin küresel bir erişime sahip olmasını sağlar."
 SUBDOCTRINE_FIGHTER_HOMELAND_DEFENSE:0 "Ana Vatan Hava Savunması"
 SUBDOCTRINE_FIGHTER_HOMELAND_DEFENSE_DESC:0 "Savaşı etkili bir şekilde sürdürebilmek için endüstrimiz ve altyapımız her ne pahasına olursa olsun stratejik bombardımandan korunmalıdır."
 SUBDOCTRINE_FIRE_CONCENTRATION:0 "Ateş Yoğunlaştırma"
 SUBDOCTRINE_FIRE_CONCENTRATION_DESC:0 "Ateş destek varlıklarının kontrolünü merkezileştirerek, ordumuz ateş gücünü küçük paketler halinde ziyan etmek yerine kritik noktada yoğunlaştırabilir."
 SUBDOCTRINE_FLEXIBLE_FIRE_SUPPORT:0 "Kara-Deniz Koordinasyonu"
 SUBDOCTRINE_FLEXIBLE_FIRE_SUPPORT_DESC:0 "Hızları ve menzilleriyle taarruz araçlarımız, karadaki orduyu destekleyerek veya denizdeki düşman gemilerine saldırarak çok yönlü bir çifte görev yapabilir."
 SUBDOCTRINE_FLYING_ARTILLERY:0 "Uçan Topçu"
 SUBDOCTRINE_FLYING_ARTILLERY_DESC:0 "Ön cepheden operasyonel derinliğe kadar fırsat hedeflerine angaje olan, vuruş önceliklendirmesine genel bir yaklaşım."
 SUBDOCTRINE_FLYING_BATTERIES:0 "Uçan Bataryalar"
 SUBDOCTRINE_FLYING_BATTERIES_DESC:0 "Destek kollarının hareketliliğini artırarak hızlı motorize ilerlemelere ayak uydurabilmelerini ve destek için hızla eyleme geçebilmelerini sağlayan ordu çapında bir girişim."
 SUBDOCTRINE_FLYING_FORTRESSES:0 "Uçan Kaleler"
 SUBDOCTRINE_FLYING_FORTRESSES_DESC:0 "Yakın formasyonda ve ağır savunma silahlarıyla uçan büyük bombardıman grupları, saldıran herhangi bir avcıyı aynı anda düzinelerce silahın ateşine göğüs germeye zorlayabilir."
 SUBDOCTRINE_GRAND_ASSAULT:0 "Büyük Hücum"
 SUBDOCTRINE_GRAND_ASSAULT_DESC:0 "Birinci Dünya Savaşı'ndan alınan zor dersler üzerine inşa ederek, savaş öncesi planlamaya kasıtlı ve metodik bir yaklaşım benimseyeceğiz. Sonra, her avantaj kullanıldığında, düşmanın üzerine bir çığ gibi düşeceğiz."
 SUBDOCTRINE_GREAT_WAR_INFANTRY:0 "Büyük Savaş Piyadesi"
 SUBDOCTRINE_GREAT_WAR_INFANTRY_DESC:0 "Kazanılan zemini inatla tutmak için hızlı mevzilenmenin takip ettiği sınırlı hedefli saldırıları içeren, piyade savaşına metodik bir yaklaşım."
 SUBDOCTRINE_GUERILLA_WAR:0 "Gerilla Savaşı"
 SUBDOCTRINE_GUERILLA_WAR_DESC:0 "İletişim hatlarına sürekli düşük seviyeli saldırılar düzenleyerek üstün bir düşmanı yıpratın, savaşa devam etme iradesini aşındırın. Kendi sınırlı güçlerimizi korumak için büyük meydan muharebelerinden kaçının."
 SUBDOCTRINE_HEAVY_AIRCRAFT_FOCUS:0 "Çok Rollü Ağır Uçak Odağı"
 SUBDOCTRINE_HEAVY_AIRCRAFT_FOCUS_DESC:0 "Büyük uçak gövdelerinin boyutu ve taşıma kapasitesi, onlara herhangi bir askeri durum için çok çeşitli göreve özel teçhizat taşıma konusunda benzersiz bir yetenek kazandırır."
 SUBDOCTRINE_INFILTRATION_TACTICS:0 "Sızma Taktikleri"
 SUBDOCTRINE_INFILTRATION_TACTICS_DESC:0 "Düşman hatlarına en güçlü oldukları noktada çarpmak yerine, su gibi etraflarından akacağız, taarruz ivmesini koruyacağız ve düşmanı kuşatma tehdidiyle geri çekilmeye zorlayacağız."
 SUBDOCTRINE_IRREGULARS:0 "Düzensizler"
 SUBDOCTRINE_IRREGULARS_DESC:0 "Üstün güçlerle doğrudan muharebeden kaçınılan, düşman azmini yıpratmak için pusu, şaşırtmaca ve taciz gibi gerilla taktiklerinin kullanıldığı asimetrik bir piyade savaşı yaklaşımı."
 SUBDOCTRINE_LARGE_UNIT_TACTICS:0 "Büyük Birim Taktikleri"
 SUBDOCTRINE_LARGE_UNIT_TACTICS_DESC:0 "Dar bir cephede yoğunlaştırılmış operasyonlarda ustalaşabilirsek, ana eylem noktasında düşmanı alt etmek ve bir yarma harekatı yaratmak için yerel üstünlük sağlayabiliriz."
 SUBDOCTRINE_LAST_STAND:0 "Umutsuz Savunma"
 SUBDOCTRINE_LAST_STAND_DESC:0 "Sırtımız duvara dayandığında ve ulusal bekamız tehlikede olduğunda, tek seçenek tüm nüfusun her tarlayı, sokağı ve kasabayı bir savaş alanına çevirerek acı ve fanatik bir direniş göstermesidir."
 SUBDOCTRINE_LIGHT_TASK_FORCES:0 "Hafif Görev Güçleri"
 SUBDOCTRINE_LIGHT_TASK_FORCES_DESC:0 "Uçak gemileri güçlüdür ancak doğrudan muharebede savunmasızdır. Yüklerini teslim edebilmeleri ve zafere katkıda bulunabilmeleri için önce hayatta kalabilir olmaları gerekir."
 SUBDOCTRINE_LINE_OF_BATTLE:0 "Muharebe Hattı"
 SUBDOCTRINE_LINE_OF_BATTLE_DESC:0 "Büyük filomuz nizam halinde ve borda ateşleri gürlerken, büyük topların hala dalgalara hükmettiğini göstereceğiz."
 SUBDOCTRINE_LONG_RANGE_ESCORT:0 "Uzun Menzilli Eskort"
 SUBDOCTRINE_LONG_RANGE_ESCORT_DESC:0 "Düşman ana vatanının refakatsiz gündüz bombardımanı, yıkıcı kayıplara yol açacaktır. Bombardıman uçaklarımıza tüm yol boyunca eşlik edecek menzile sahip avcı uçaklarına ihtiyacımız var."
 SUBDOCTRINE_MARINES_1:0 "$marines_commandoes$"
 SUBDOCTRINE_MARINES_1_DESC:0 "$marines_commandoes_desc$"
 SUBDOCTRINE_MARINES_2:0 "$marines_expeditionary$"
 SUBDOCTRINE_MARINES_2_DESC:0 "$marines_expeditionary_desc$"
 SUBDOCTRINE_MASSED_CARRIER_FLEET:0 "Kitlesel Uçak Gemisi Filosu"
 SUBDOCTRINE_MASSED_CARRIER_FLEET_DESC:0 "Tıpkı karada olduğu gibi, deniz savaşında da başarı, mümkün olduğunca çok vurucu gücün tek bir belirleyici noktada toplanmasına bağlıdır. Bölünme yenilgi doğurur."
 SUBDOCTRINE_MISSION_TYPE_TACTICS:0 "Görev Tipi Taktikler"
 SUBDOCTRINE_MISSION_TYPE_TACTICS_DESC:0 "Liderlerimiz otomat olmamalıdır. Emirlerini akıllıca yorumlamalı ve görevi başarmak için gerekirse onlara sıkı sıkıya bağlı kalmaktan sapmalıdırlar. Zafer, körü körüne itaatten daha önemlidir."
 SUBDOCTRINE_MOBILE_DEFENSE:0 "Hareketli Savunma"
 SUBDOCTRINE_MOBILE_DEFENSE_DESC:0 "Zırhlı kuvvetler saldırıda olduğu kadar savunmada da yararlıdır. Hareketlilikleriyle güçlü savunma arazilerini hızla işgal edebilir veya düşman yarmalarına karşı koymak için pozisyon alabilirler."
 SUBDOCTRINE_MOBILE_INFANTRY:0 "Hareketli Piyade"
 SUBDOCTRINE_MOBILE_INFANTRY_DESC:0 "İlerleme hızına ayak uydurmak ve maliyetli mevzi çatışmalarına saplanıp kalmamak için piyadelerimizin hareketliliğine odaklanın."
 SUBDOCTRINE_MOBILE_RECON_AND_ASSAULT:0 "Hareketli Keşif ve Hücum"
 SUBDOCTRINE_MOBILE_RECON_AND_ASSAULT_DESC:0 "Kapsamlı motorizasyonla desteklenen müşterek harp yaklaşımıyla, düşmanı bulmak için keşif birimlerini ve onları hızla ezmek için hareketli ağır silahları kullanabiliriz."
 SUBDOCTRINE_MOUNTAINEERS_1:0 "$ski_troops$"
 SUBDOCTRINE_MOUNTAINEERS_1_DESC:0 "$ski_troops_desc$"
 SUBDOCTRINE_MOUNTAINEERS_2:0 "$special_forces_mountaineers$"
 SUBDOCTRINE_MOUNTAINEERS_2_DESC:0 "$special_forces_mountaineers_desc$"
 SUBDOCTRINE_MOUNTED_INFANTRY:0 "Binekli Piyade"
 SUBDOCTRINE_MOUNTED_INFANTRY_DESC:0 "Süvarilerimizi 20. yüzyıla uyarlamak için, at üzerindeyken operasyonel hareketliliğe ve attan inildiğinde hızlı, modern ağır silah desteğiyle savaşmaya ihtiyacımız var."
 SUBDOCTRINE_MUTUALLY_EXCLUSIVE:0 "§RBu Alt Doktrin,§! $NAME|H$ §Rbaşka bir yoldayken atanamaz.§!"
 SUBDOCTRINE_NAVAL_GUNFIRE_SUPPORT:0 "Deniz Topçu Ateş Desteği"
 SUBDOCTRINE_NAVAL_GUNFIRE_SUPPORT_DESC:0 "Düşman muharebe filosu etkisiz hale getirildiğinde, ağır deniz toplarımız karadaki birliklerimizi desteklemek için gazaplarını kara hedeflerine çevirmekte özgürdür."
 SUBDOCTRINE_NAVAL_STRIKE_TACTICS:0 "Hassas Deniz Bombardımanı"
 SUBDOCTRINE_NAVAL_STRIKE_TACTICS_DESC:0 "Uçak gemisi uçakları, yüklerini teslim etmek için düşman avcılarından ve uçaksavarlarından oluşan bir ateş çemberinden geçmek zorundadır. Eğitimimiz, saldırıyı eve bastırmada hayatta kalma ve azme vurgu yapacaktır."
 SUBDOCTRINE_NAVAL_TORPEDO_TACTICS:0 "Torpido Sürüsü Taktikleri"
 SUBDOCTRINE_NAVAL_TORPEDO_TACTICS_DESC:0 "Birkaç torpidodan kaçınılabilir. Onlarcasının aynı anda gelmesi, en korunaklı hedefi bile sırf hacim yoluyla yerle bir edebilir."
 SUBDOCTRINE_NIGHT_BOMBING:0 "Gece Stratejik Bombardımanı"
 SUBDOCTRINE_NIGHT_BOMBING_DESC:0 "Douhet'nin aksine, bombardıman uçağı aslında her zaman geçip gitmez. Gece uçmak isabet oranımızı düşürür, ancak uçaklarımızın ve mürettebatımızın hayatta kalma oranını büyük ölçüde artırır."
 SUBDOCTRINE_OPEN_OCEAN_AIR_PATROL:0 "Derin Okyanus Hava Devriyesi"
 SUBDOCTRINE_OPEN_OCEAN_AIR_PATROL_DESC:0 "Modern uçakların menzili, düşman varlıklarına kıyılarımızı tehdit etmeden çok önce deniz arama ve vuruş görevleri yapılmasına olanak tanır."
 SUBDOCTRINE_OPERATIONAL_AIR_SUPPORT:0 "Operasyonel Hava Desteği"
 SUBDOCTRINE_OPERATIONAL_AIR_SUPPORT_DESC:0 "Yüksek hayatta kalma kabiliyetine sahip orta sınıf uçakların sürekli saldırılarıyla operasyonel muharebe alanına hakim olmaya odaklanan bir doktrin."
 SUBDOCTRINE_OVERRIDE_MASTERY_TITLE:0 "§HBu Alt Doktrin, belirli bir birlik grubundan £doctrine_mastery Ustalık kazanır:§!"
 SUBDOCTRINE_PARATROOPERS_1:0 "Sabotaj Ekipleri"
 SUBDOCTRINE_PARATROOPERS_1_DESC:0 "$paras_dispersed_drop_desc$"
 SUBDOCTRINE_PARATROOPERS_2:0 "Yoğunlaştırılmış İndirmeler"
 SUBDOCTRINE_PARATROOPERS_2_DESC:0 "$paras_combat_drop_desc$"
 SUBDOCTRINE_PEOPLES_WAR:0 "Halk Milisleri"
 SUBDOCTRINE_PEOPLES_WAR_DESC:0 "Devlet tarafından seferber edilen ve yönlendirilen halkın direnme iradesi, emperyalizme ve karşı devrime karşı nihai zaferimizi garanti eder."
 SUBDOCTRINE_RANGERS_1:0 "Avcı Gelenekleri"
 SUBDOCTRINE_RANGERS_1_DESC:0 "$rangers_jaegers_training_desc$"
 SUBDOCTRINE_RANGERS_2:0 "$rangers_jungle_training$"
 SUBDOCTRINE_RANGERS_2_DESC:0 "$rangers_jungle_training_desc$"
 SUBDOCTRINE_RAPID_DOMINATION:0 "Hızlı Hakimiyet"
 SUBDOCTRINE_RAPID_DOMINATION_DESC:0 "Düşman üzerinde tam spektrumlu hakimiyet kurmak, onların daha fazla direniş göstermelerini fiziksel ve psikolojik olarak imkansız hale getirir."
 SUBDOCTRINE_SCREEN_ANTI_AIRCRAFT_CRUISERS:0 "Uçaksavar Kruvazörleri"
 SUBDOCTRINE_SCREEN_ANTI_AIRCRAFT_CRUISERS_DESC:0 "Hafif kruvazörler muharebe hattında duracak dayanma gücünden yoksundur, ancak yüksek açılı silahlarla donatılabilir ve filo için güçlü uçaksavar koruması sağlayabilirler."
 SUBDOCTRINE_SCREEN_CONVOY_ESCORT:0 "Konvoy Eskortu"
 SUBDOCTRINE_SCREEN_CONVOY_ESCORT_DESC:0 "Hafif gemilerin temel görevi, tüm savaş çabalarımızın bağlı olduğu deniz ticaretini güvence altına almaktır. Diğer her şey ikincildir."
 SUBDOCTRINE_SCREEN_HUNTER_KILLERS:0 "Avcı Katil Grupları"
 SUBDOCTRINE_SCREEN_HUNTER_KILLERS_DESC:0 "Düşman denizaltıları savaş ekonomimizi boğmakla tehdit ederken, iyi organize edilmiş ve agresif muhrip eskortları avcıyı av haline getirebilir."
 SUBDOCTRINE_SCREEN_INTEGRATED_OPERATIONS:0 "Entegre Operasyonlar"
 SUBDOCTRINE_SCREEN_INTEGRATED_OPERATIONS_DESC:0 "Perdeleme güçleri ana muharebe gemilerinin ateş gücünden yoksundur, ancak hızı zırh olarak kullanarak, şiddetli bir deniz muharebesinde bile değerli hizmetler sağlayabilirler."
 SUBDOCTRINE_SCREEN_JEUNE_ECOLE:0 "Genç Ekol"
 SUBDOCTRINE_SCREEN_JEUNE_ECOLE_DESC:0 "Açık denizlerde büyük topların kapıştığı eski anlayışa bir panzehir olarak küçük gemi sürülerini, torpido saldırılarını ve dolaylı ticaret savaşını vurgulayan doktrinel bir kavram."
 SUBDOCTRINE_SCREEN_PATROL_BOATS:0 "Devriye Botları"
 SUBDOCTRINE_SCREEN_PATROL_BOATS_DESC:0 "Torpidolarla donanmış ucuz hızlı saldırı araçları, özellikle pusudan saldırabilecekleri kıyı sularında, ağır gemilerden oluşan geleneksel bir savaş filosuna karşı güçlü bir araçtır."
 SUBDOCTRINE_SCREEN_SUPPORT_FOCUS:0 "Perdeleme Destek Odağı"
 SUBDOCTRINE_SCREEN_SUPPORT_FOCUS_DESC:0 "Destek gemisi teşkilatımızın eğitim ve organizasyonundaki iyileştirmeler, dolaylı ama dramatik bir şekilde ana muharebe filomuzu güçlendirecektir."
 SUBDOCTRINE_SCREEN_TORPEDO_PRIMACY:0 "Torpido Önceliği"
 SUBDOCTRINE_SCREEN_TORPEDO_PRIMACY_DESC:0 "Ana çatışmadan önce düşman muharebe hattını yıpratmak için savunma amaçlı perdeleme yerine agresif, cüretkar muhrip torpido saldırılarına vurgu."
 SUBDOCTRINE_SELF_PROPELLED_SUPPORT:0 "Kundağı Motorlu Destek"
 SUBDOCTRINE_SELF_PROPELLED_SUPPORT_DESC:0 "Ordunun ağır destek silahlarının mümkün olduğunca çoğu için paletli hareketlilik ve koruma sağlamak: geleceğin yolu budur."
 SUBDOCTRINE_SIEGE_ARTILLERY:0 "Kuşatma Topçusu"
 SUBDOCTRINE_SIEGE_ARTILLERY_DESC:0 "Hiçbir sabit tahkimat, zırhlı gemi kalibresindeki mermilerin çelik yağmuruna karşı uzun süre dayanamaz."
 SUBDOCTRINE_STREAMLINED_DEPLOYMENT:0 "Modernize Edilmiş Konuşlanma"
 SUBDOCTRINE_STREAMLINED_DEPLOYMENT_DESC:0 "Stratejik ölçekte taarruz sonuçları, ancak tanklar dahil tüm kolların vurucu güçlerini belirleyici noktada yoğunlaştırmak üzere toplanmasıyla elde edilebilir."
 SUBDOCTRINE_SUBMARINE_CAPITAL_HUNTERS:0 "Ana Muharebe Gemisi Avcıları"
 SUBDOCTRINE_SUBMARINE_CAPITAL_HUNTERS_DESC:0 "Modern savaşta denizaltının asıl rolü, daha küçük avların dikkat dağıtıcılığından kaçınmak ve her şeyden önce düşman ana muharebe gemilerini batırmaya odaklanmaktır."
 SUBDOCTRINE_SUBMARINE_COASTAL_DEFENSE:0 "Kıyı Savunması"
 SUBDOCTRINE_SUBMARINE_COASTAL_DEFENSE_DESC:0 "Kıyıya yakın çalışan küçük denizaltılar, olası bir işgalcinin yan tarafında sürekli bir diken olduğunu kanıtlayabilir."
 SUBDOCTRINE_SUBMARINE_COASTAL_MINELAYING:0 "Kıyı Mayınlama"
 SUBDOCTRINE_SUBMARINE_COASTAL_MINELAYING_DESC:0 "Gizlilikleri ve çeviklikleriyle denizaltılar, deniz yollarına mayın döşemek ve düşmanın hareket özgürlüğünü kısıtlamak için ideal bir platformdur."
 SUBDOCTRINE_SUBMARINE_FLEET_OPERATIONS:0 "Filo Operasyonları"
 SUBDOCTRINE_SUBMARINE_FLEET_OPERATIONS_DESC:0 "Keşif sağlamak ve genel bir çatışma sırasında düşman gemilerine pusu kurmak için denizaltıların ana muharebe filosuna kitlesel entegrasyonu."
 SUBDOCTRINE_SUBMARINE_LONG_RANGE_SUBMARINES:0 "Uzun Menzilli Denizaltılar"
 SUBDOCTRINE_SUBMARINE_LONG_RANGE_SUBMARINES_DESC:0 "Filolarımız aşırı menzillerde faaliyet gösterdiğinde, su üstü görev güçlerimize tam destek sağlamak için denizaltılarımızın takip edebilmesi gerekir."
 SUBDOCTRINE_SUBMARINE_WOLFPACKS:0 "Kurt Kapanı"
 SUBDOCTRINE_SUBMARINE_WOLFPACKS_DESC:0 "Dağınık avlan - birlikte vur. Denizaltılarımız okyanusun geniş alanlarını kapsayacak şekilde yayılabilir, sonra uygun av tespit edildiğinde birleşmek için birbirlerine sinyal verebilirler."
 SUBDOCTRINE_TACTICAL_BATTLEFIELD_SUPPORT:0 "Taktiksel Muharebe Sahası Desteği"
 SUBDOCTRINE_TACTICAL_BATTLEFIELD_SUPPORT_DESC:0 "Kendi birliklerimizin ilerleyişinin yolunu açmak için düşman müstahkem noktalarına gökten yıkım yağdıran bir hafif bombardıman filosu."
 SUBDOCTRINE_TACTICAL_FLEXIBILITY:0 "Hava Sahası Hakimiyeti"
 SUBDOCTRINE_TACTICAL_FLEXIBILITY_DESC:0 "Gökyüzünün kontrolünü ele geçirmek için tasarlanmış saldırı amaçlı hava-hava muharebe taktiklerine odaklanma."
 SUBDOCTRINE_TANK_DESTROYER_FORCE:0 "Tank Avcısı Gücü"
 SUBDOCTRINE_TANK_DESTROYER_FORCE_DESC:0 "Büyük düşman zırhlı tehditleriyle karşılaştığımızda, ilk hat savunmalarımızın düşmanı her zaman durduracağına güvenemeyiz. Pusu kuran anti-tank birimleriyle derinlemesine savunma esastır."
 SUBDOCTRINE_THEATER_INTERDICTION:0 "Harekât Alanı Önlemesi"
 SUBDOCTRINE_THEATER_INTERDICTION_DESC:0 "Dost birlikleri vurma riskinden kurtulan bombardıman filomuz, düşmanın geri bölgelerinde engellenmeden dolaşabilir, hasar verebilir ve cephedeki savaşa dolaylı yoldan yardım edebilir."
