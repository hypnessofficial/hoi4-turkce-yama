 GRAND_DOCTRINE_BASE_STRIKE:0 "Üs Darbesi"
 GRAND_DOCTRINE_BASE_STRIKE_DESC:0 "Sert vur, önce vur - Deniz havacılığının yeni teknolojileri, düşmanı ufkun ötesinden, henüz savaştığını bile anlamadan vurma konusunda ilgi çekici bir olasılık sunuyor."
 GRAND_DOCTRINE_BATTLEFIELD_SUPPORT:0 "Muharebe Sahası Desteği"
 GRAND_DOCTRINE_BATTLEFIELD_SUPPORT_DESC:0 "Hızlı hareket eden kara operasyonlarına yol açmak için uçan topçu görevi gören hava saldırıları ile yakın ordu-hava kuvvetleri işbirliği için teknikler ve eğitim."
 GRAND_DOCTRINE_BENEFIT_DESCRIPTION:0 "§gBir dizi §HAlt Doktrin§! yolunu kullanılabilir kılmak için bir Büyük Doktrin atayın. Muharebedeki birimlerden £doctrine_mastery §HUstalık§! kazanarak Alt Doktrinlerinizi geliştirin. Tamamlanan Alt Doktrinler, Büyük Doktrininizi daha da yükselterek §HDönüm Noktalarını§! etkinleştirir.§!"
 GRAND_DOCTRINE_CONVOY_RAIDING:0 "Ticareti Önleme"
 GRAND_DOCTRINE_CONVOY_RAIDING_DESC:0 "Modern çağ için korsanlar - Deniz ticaretini boğmaya, düşmanı savaşı sürdürmek için ihtiyaç duyduğu kaynaklardan mahrum bırakmaya odaklanan deniz savaşına dolaylı bir yaklaşım."
 GRAND_DOCTRINE_COST_REDUCTION:0 "Büyük Doktrin maliyeti: $VALUE|%=-0$"
 GRAND_DOCTRINE_DESCRIPTION:0 "Askeri stratejimizin temel taşı olan Büyük Doktrin, savaşa genel yaklaşımımızı şekillendirir."
 GRAND_DOCTRINE_FLEET_IN_BEING:0 "Mevcut Donanma"
 GRAND_DOCTRINE_FLEET_IN_BEING_DESC:0 "Büyük Top Kulübü - Düşman donanmasını ezmek ve onları bir çelik fırtınasında boğmak için deniz topçusuna ve ağır zırha gelenekselci bir odaklanma."
 GRAND_DOCTRINE_GRAND_BATTLEPLAN:0 "Büyük Harp Planı"
 GRAND_DOCTRINE_GRAND_BATTLEPLAN_DESC:0 "Yeterli hazırlıkla hiçbir engel aşılmaz değildir - Büyük Harp Planı, hem saldırıda hem de savunmada tüm kolların sabırlı ve titiz bir şekilde hazırlanmasıyla karakterize edilir."
 GRAND_DOCTRINE_MASS_ASSAULT:0 "Kitlesel Taarruz"
 GRAND_DOCTRINE_MASS_ASSAULT_DESC:0 "Fedakarlık isteğimiz zaferimizi garanti eder - Kitlesel Taarruz, seçilen zaman ve mekanda bir yarma harekatı zorlamak için sayısal üstünlüğün yoğunlaştırılmasına odaklanır."
 GRAND_DOCTRINE_MOBILE_WARFARE:0 "Hareketli Harp"
 GRAND_DOCTRINE_MOBILE_WARFARE_DESC:0 "Beklemedikleri yerden vurun - hareketli harp doktrini, düşmanı önlemek ve bozmak için agresif manevralar yoluyla Birinci Dünya Savaşı'nın siper kördüğümünü kırmayı amaçlar."
 GRAND_DOCTRINE_OPERATIONAL_INTEGRITY:0 "Operasyonel Bütünlük"
 GRAND_DOCTRINE_OPERATIONAL_INTEGRITY_DESC:0 "Operasyonel saldırılar gerçekleştiren genel amaçlı orta sınıf bombardıman uçaklarının savaş alanına hakim olması için bir ön koşul olarak hava üstünlüğünün kazanılması ve sürdürülmesi."
 GRAND_DOCTRINE_SELECTION_TITLE:0 "Bir Büyük Doktrin Seç"
 GRAND_DOCTRINE_SPECIAL_FORCES_QUALITY:0 "Elit Özel Kuvvetler"
 GRAND_DOCTRINE_SPECIAL_FORCES_QUALITY_DESC:0 "$elite_forces_desc$"
 GRAND_DOCTRINE_SPECIAL_FORCES_QUANTITY:0 "Genişletilmiş Özel Kuvvetler"
 GRAND_DOCTRINE_SPECIAL_FORCES_QUANTITY_DESC:0 "$improved_special_forces_desc$"
 GRAND_DOCTRINE_STRATEGIC_DESTRUCTION:0 "Stratejik Yıkım"
 GRAND_DOCTRINE_STRATEGIC_DESTRUCTION_DESC:0 "Savaş yapma potansiyelini kaynağında kesmek için düşmanın iç bölgelerindeki fabrikaların, rafinerilerin ve ulaşım altyapısının kitlesel bombardımanı."
 GRAND_DOCTRINE_SUPERIOR_FIREPOWER:0 "Üstün Ateş Gücü"
 GRAND_DOCTRINE_SUPERIOR_FIREPOWER_DESC:0 "Askerleri değil, mermileri gönderin - Üstün Ateş Gücü, manevra birimlerinin ilerlemesi ve toprak ele geçirmesi için yolu açmak adına ezici ateş kütlelerinin kullanılmasına vurgu yapar."
