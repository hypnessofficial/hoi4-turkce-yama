 INS_soetardjo_pending:0 "Volksraad Soetardjo'nun Özerklik Dilekçesini Tartışıyor"
 INS_soetardjo_pending_desc:0 "Soetardjo, barışçıl milliyetçi harekete liderlik etmesiyle tanınan bir Volksraad üyesidir. Şu anda [INS.GetNameDef]'in daha fazla özerklik verilmesini ve Endonezyalıların Hollanda milletler topluluğunun bir parçası olarak özerk olma arzusunu tartışmak üzere Hollandalı ve Endonezyalı temsilciler arasında bir yuvarlak masa toplantısı düzenlenmesini talep eden bir dilekçe organize ediyor. Bu dilekçe şu anda Volksraad içinde tartışılıyor. Bu tartışmalar sonuçlandıktan sonra, dilekçenin sonuçları büyük önem taşıdığı için nasıl yanıt vereceğimize karar vermeliyiz."
 INS_soetardjo_petition:0 "Soetardjo Dilekçesi Onay Bekliyor"
 INS_soetardjo_petition_desc:0 "Soetardjo'nun çağrısını yaptığı yuvarlak masa toplantısı düzenlendi ve [INS.GetNameDef] kendi kendine yeterliliği sağlamak için bir dizi ekonomik gereksinimi karşılaması gerektiği sonucuna varıldı. Bu hedeflere doğru net bir ilerleme göstermeliyiz, aksi takdirde [HOL.GetNameDef] sonunda statükoyu korumak için kararı bozacaktır."
 INS_soetardjo_petition_refresh_tt:0 "Görev Yeniden Etkinleştirilir: §Y120 günlük§! bir süre ile §YSoetardjo Dilekçesi Onay Bekliyor§!."
