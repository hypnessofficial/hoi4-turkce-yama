 INS_win_condition_base_republic_real:0 "Doğu Hint Adalarını Yok Et"
 INS_win_condition_base_republic_real_desc:0 "Savaşmaya, sivilleri askere almaya ve her Endonezyalı ruhunun içindeki ateşin yanmaya devam etmesini sağlamaya devam etmeliyiz. Hint Adaları yönetimini devirdiğimizde, [HOL.GetNameDef] teslim olmaktan başka seçeneği kalmayacak."
 INS_win_condition_base_republic_warning:0 "Doğu Hint Adalarını Yok Et"
 INS_win_condition_base_republic_warning_desc:0 "Savaşmaya, sivilleri askere almaya ve her Endonezyalı ruhunun içindeki ateşin yanmaya devam etmesini sağlamaya devam etmeliyiz. Hint Adaları yönetimini devirdiğimizde, [HOL.GetNameDef] teslim olmaktan başka seçeneği kalmayacak."
