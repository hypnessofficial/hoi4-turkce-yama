 AST_call_on_fascists:0 "[GET_AST_CALL_ON_FASCISTS]"
 AST_call_on_fascists_desc:0 "Az destekçisi olan küçük bir hareket olarak Önce Avustralya her zaman iki yakasını bir araya getiremiyor. Ancak, benzer fikirlere sahip yabancı bir grup hırslarımızı finanse etmeye istekli olduğunu gösterdi ve ilerlememizin devamını sağlamak için bir çözüm sundu."
