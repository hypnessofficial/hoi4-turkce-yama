 INS_national_revolution_cat:0 "Endonezya Milli Devrimi"
 INS_national_revolution_cat_desc:0 "Hollanda'nın 350 yıllık zorbalığından sonra kontrolü ele aldık ve bağımsızlığımızı ilan ettik. Hollanda otoritemizi tanımıyor, Doğu Hint Adaları'nı kendi sömürgesi gibi yönetmeye devam ediyor ve bize suçlu muamelesi yapıyor.\n\nDaha fazla bölgenin ve önemli şehrin kontrolünü ele almaya devam etmeli ve Hollanda hükümetini içeriden çökertmeliyiz. Ancak, dikkatli bir planlama olmadan çok agresif olmamaya dikkat etmeliyiz, çünkü tarafımızdan yapılacak hızlı bir tırmanma Hollanda askeri eylemini kışkırtabilir."
 INS_national_revolution_cat_map:0 "Yanıltıcı Ayaklanmalar Başlat"
 INS_national_revolution_dutch_cat:0 "Doğu Hint Adalarındaki Devrimci Milisler"
 INS_national_revolution_dutch_cat_desc:0 "Doğu Hint Adaları'ndaki devrimciler yasadışı olarak bağımsızlık ilan ettiler ve milis güçleriyle Doğu Hint Adaları'nın bölgelerinin kontrolünü ele geçirdiler. En iyi çabalarımıza rağmen, mevcut milis güçlerinin çokluğu nedeniyle bu bölgelerde kontrolü yeniden kuramadık.\n\nDaha fazla şehrin kontrolünü ele geçirmeden ve Doğu Hint Adaları yönetimini daha da istikrarsızlaştırmadan önce onları durdurmalıyız. Aşırı da olsa, bu şekilde davranmaya devam ederlerse askeri güç gerekli olabilir."
