 INS_take_batavia:0 "Java'nın kontrolünü ele geçir"
 INS_take_batavia_desc:0 "Hollanda açgözlülüğü, neredeyse sadece Java'ya yatırım yapmalarına neden oldu ve doğu adalarını görmezden gelerek Java'yı tüm sömürgenin Aşil topuğu olarak bıraktı. Bu onların çöküşü olacak! Kuvvetlerimizle Java'ya girmeli, Hollanda iletişim ve ikmal ağlarını yok etmeli ve Hint Adaları yönetimini çalışamaz hale getirmeliyiz."
 INS_the_co_prosperity_sphere_cat:0 "$INS_the_co_prosperity_sphere$"
 INS_unity_in_diversity_cat:0 "Çeşitlilikte Birlik"
 INS_unity_in_diversity_explain_tt:0 "Sanayi yatırımı almış herhangi bir Endonezya prenslik eyaletini §Gcore§! yapmanıza olanak tanır."
 INS_volksraad_allow_language_in_government:0 "Hükümette Endonezceye İzin Ver"
 INS_volksraad_allow_language_in_government_desc:0 "Doğu Hint Adaları'ndaki hükümet görevleri, Volksraad dahil olmak üzere hepsi Hollandaca akıcılık gerektirir, bu da Volksraad'ın birçok üyesinin, özellikle yerli toplulukların temsilcilerinin demokrasisinin geçerliliğini sorgulamasına yol açmıştır. Mümkün olduğunda hükümet pozisyonlarının Endonezce konuşanlar tarafından doldurulabilmesinde ısrar eden bir önerge hazırladılar."
 INS_volksraad_allow_language_in_schools:0 "Okullarda Endonezceye İzin Ver"
 INS_volksraad_allow_language_in_schools_desc:0 "Doğu Hint Adaları'nda yükseköğrenime erişim, büyük ölçüde Hollandalılarla ve Hollandaca konuşan zengin Endonezyalı sınıflarıyla sınırlıdır, çünkü yükseköğrenimin verildiği tek dildir. Volksraad'da Endonezce eğitim veren okulların açılmasına yönelik devam eden bir önerge, Genel Vali'den oylama bekliyor."
 INS_volksraad_cat:0 "Volksraad"
 INS_volksraad_cat_desc:0 "Hollandaca'da Volksraad olarak bilinen Halk Konseyi, “Etik Politikalar”ın uygulanmasının bir parçası olarak Doğu Hint Adaları'na demokrasi getirme girişimi olarak 1918'de kuruldu. Koltuklar, çeşitli yollarla seçilen Hollandalı ve Endonezyalı yetkililerle doldurulmaktadır. Hollanda koşulsuz bir veto hakkını elinde tutarken, Volksraad hükümete önergeler ve yasa tasarıları geçirebilir."
 INS_volksraad_decisions_no_reject:0 "[HOL.GetFlag][HOL.GetNameDefCap] artık Volksraad kararlarını §Yveto§! edemez"
 INS_volksraad_education_subsidies_for_indonesians:0 "Hollandalı Olmayan Sakinler için Eğitim Sübvansiyonları Aç"
 INS_volksraad_education_subsidies_for_indonesians_desc:0 "Doğu Hint Adaları'ndaki Hollandalı öğrencilere verilen sübvansiyonlar ve burslar konusunda Volksraad'da devam eden bir tartışma var. Volksraad'daki yerli toplulukların çeşitli temsilcileri, bu sistemin geçmişi ne olursa olsun herhangi bir öğrenciyi kapsayacak şekilde genişletilmesi gerektiğini savundu. Bu bize nüfus nezdinde çok fazla iyi niyet kazandıracaktır, ancak ucuz da olmayacaktır."
 INS_volksraad_indonesian_national_language:0 "Endonezceyi Resmi Ulusal Dil Yap"
 INS_volksraad_indonesian_national_language_desc:0 "Endonezce, takımadaların birçok yerinde ortak bir dil haline gelerek çeşitli kültürler arasındaki dil boşluklarını kapattı. Endonezcenin artık eğitimde ve hükümet görevlerinde izin verilmesiyle birlikte, birçok Volksraad temsilcisi, Hollandaca ile eşit statüyü paylaşarak sömürgenin resmi dili olarak yasal olarak tanınması için dilekçe veriyor."
 INS_volksraad_knil_rank_limit:0 "Askeri Rütbeler için Ayrımcılık Karşıtı Yasaları Geçir"
 INS_volksraad_knil_rank_limit_desc:0 "Endonezyalı yerlilerin KNIL rütbelerinde yükselmesini engelleyen resmi bir kural olmasa da, bunu yasaklayan yazılı olmayan bir kural var ve en iyi performans gösteren askeri personeli bile Albay statüsünün ötesine geçemez hale getiriyor. Volksraad'daki birkaç parti, hükümete yüksek performans gösteren Endonezyalı subayların çabalarını tanıması için baskı yapıyor."
 INS_volksraad_legalize_displaying_flag:0 "Kırmızı/Beyaz Bayrağın Gösterilmesini Yasallaştır"
 INS_volksraad_legalize_displaying_flag_desc:0 "“Endonezya”nın kırmızı ve beyaz bayrağı, milliyetçi, sömürgecilik karşıtı örgütlerle olan bağlantıları nedeniyle şu anda halka açık olarak sergilenmesi yasadışıdır. Sergilenmesinin yasallaştırılması büyük olasılıkla işbirliği yapma istekliliğimizin bir göstergesi olacak ve takımadalar boyunca milliyetçilerin devam eden radikalleşmesini durduracaktır."
 INS_volksraad_official_flag:0 "Endonezya Bayrağını Resmileştir"
 INS_volksraad_official_flag_desc:0 "Volksraad'daki özerklik için baskı yapan önergeler nihayetinde başarılı oldu ve sadece birkaç yıl önce Hollanda Doğu Hint Adaları olarak adlandırılan yer artık Endonezya Dominyonu'dur. Bayrağımız bu değişiklikleri yansıtacak şekilde ayarlanmalıdır."
 INS_volksraad_reduce_rubber_export_tax:0 "Özel Kauçuk İhracatı Vergisini Azalt"
 INS_volksraad_reduce_rubber_export_tax_desc:0 "Şu anda, piyasa üzerinde bir tekel sürdürmemize izin veren, kauçuk ihraç eden özel şirketlere son derece yüksek bir vergi uygulanmaktadır. Ancak bu, özel tarlaların faaliyet gösterememesi nedeniyle bazı bölgelerde ekonomik durgunlukla sonuçlandı. Bu, uygulandığı sırada değerli görülmüştü, ancak Büyük Buhran'dan kaynaklanan uluslararası korumacılık, kauçuk ihracatı ekonomimizi çok daha az kazançlı hale getirdi. Ekonomiyi canlandırmak için vergiyi azaltmaya değebilir."
 INS_volksraad_remove_education_quotas:0 "Eğitim-Kota Sistemini Kaldır"
 INS_volksraad_remove_education_quotas_desc:0 "Doğu Hint Adaları'ndaki eğitim sistemi şu anda, belirli sayıda Endonezyalı öğrencinin kabul edilmesi ve belirli sayıda Hollandalı öğrencinin kabul edilmesi gereken eğitim kotaları kullanılarak işlemektedir. Bu, haksız bir şekilde Hollandalıların lehine çarpıtıldığına dair yaygın inanç nedeniyle Volksraad'da tartışmalı olmuştur. Volksraad'ın sistemin nasıl reform edileceği konusunda yıllarca tartışmaya devam etmesine izin verebilsek de, kota sistemini tamamen kaldırmaya değebilir."
 INS_war_escalation_10_tt:0 "§Y[INS.GetName]§!: Amerikan diplomatik müdahalesini talep edebilir"
