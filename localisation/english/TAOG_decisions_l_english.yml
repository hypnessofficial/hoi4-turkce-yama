 AST_scale_up_middleback_mines_steel_decision_3_desc:0 "Savaş zamanı metallere olan talep tüm zamanların en yüksek seviyesinde, ancak Middleback Dağları bunu sağlamaya devam ediyor."
 AST_scale_up_pilbara_mines_steel_decision:0 "Pilbara Madenlerini Büyüt"
