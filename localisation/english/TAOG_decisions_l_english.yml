 AST_a_convenient_disaster:0 "Uygun Bir Felaket"
 AST_a_convenient_disaster_desc:0 "Önce Avustralya ne kadar popüler olursa olsun, muhafazakarlar grubun ideolojisine her zaman direnecektir. Önce Avustralya'nın başarılı bir şekilde iktidarı kazanması için normal seçimlerden daha dramatik bir şey, hükümeti kargaşaya sürükleyecek bir şey gerekli olabilir.\n\nHareketimiz böyle bir olayı tek başına kışkırtma kapasitesinden yoksundur, ancak yabancı faşist destekçimiz yoksundur. Yabancı faşistler, iktidara yükselişimize yardım ederek [AST.GetName]'de bir dost bulacaklardır."
 AST_a_convenient_disaster_flag:0 "§YCanberra Hava Felaketi§!, §YUygun Bir Felaket§! kararı aracılığıyla tetiklendi."
 AST_a_convenient_disaster_tt:0 "\nBu olay mevcut hükümeti bozacak ve sonuçta §Y[AST.GetFascistParty]§! partisinin iktidar partisi olmasını sağlayacaktır."
 AST_a_monarchist_appeal:0 "Monarşist Bir Çağrı"
 AST_a_monarchist_appeal_desc:0 "Ülkenin ve düzenin koruyucuları olan Yeni Muhafızlar, mevcut düzensizlikten dehşete düşmüş durumda. İngiliz mirasları ve monarşist idealleri tarafından yönlendirilen önde gelen üyeler, Avustralya'nın, ulusal ve siyasi düzensizliğin bildiğimiz İngiliz Milletler Topluluğu'nun ve monarşisinin sona ermesine yol açtığı [ENG.GetNameDef] ile aynı yola girebileceğinden korkuyorlar.\n\nŞimdi, Yeni Muhafız, yeni bir hükümet kurma konusunda acele etmeden bu potansiyel anayasal krize öncülük etmesi için Genel Valiye çağrıda bulunuyor: ne de yaşlıların kontrolü yeniden kazanmasına henüz izin vermiyoruz. Belki de [AST.GetName]'nin [ENG.GetNameDef]'nin geride bıraktığı gelenekleri onurlandırmasının ve ulusumuzun şan ve birlik içinde yönetilmesinin zamanı gelmiştir."
 AST_a_sound_voice:0 "£BoP_left_texticon  Sağlam Bir Ses"
 AST_a_sound_voice_desc:0 "Bu siyasi kargaşa döneminde, kendinden emin bir ses Avustralya halkı arasında güven uyandırıyor gibi görünüyor. [AST.GetName]'in bir sonraki liderinin sesi olabilir mi?"
 AST_add_the_crown_intervenes_tt:0 "Odak noktasını ortaya çıkar:\n§Y$AST_for_crown_and_empire$§! şube\n§Y$AST_the_kings_men$§!"
 AST_afm_decisions_autonomy_upgrade_tt:0 "\n§YÖnce Avustralya Hareketi Kararlarının§! Özerklik kazanımını yükseltin.\n\n"
 AST_afm_decisions_fascism_upgrade_tt:0 "\n§YÖnce Avustralya Hareketi Kararlarının§! Günlük Faşizm Desteği kazanımını yükseltin.\n\n"
 AST_aid_australian_military_construction:0 "Avustralya Askeri İnşaatına Yardım Et"
 AST_aid_australian_military_construction_desc:0 "İngiltere savaşa hazır değil. Avustralya'ya askeri inşaatlarda yardım ederek sabırsızlıklarını hafifletebiliriz."
 AST_approach_the_independents:0 "£BoP_left_texticon  Bağımsızlara Yaklaş"
 AST_approach_the_independents_desc:0 "Hükümet, Avustralya'yı son zamanlardaki karmaşadan çıkarma yeteneğine olan inanç her geçen gün azaldığından istikrarsızdır. Bağımsızlara yaklaşarak, hükümet değişikliğinin en iyisi olacağını fark etmeleri ikna edilebilir."
 AST_australasia_flag:0 "§YAvustralasya§! kuruldu"
 AST_australia_first_movement_cat:0 "Önce Avustralya Hareketi"
 AST_australia_formables_category:0 "Avustralasya"
 AST_australia_formables_category_desc:0 "Köklerimiz bizi her zaman uzak güneye bağlasa da kollarımız uzadı ve geniş kapsamlı oldu ve artık başkalarının dünya meselelerine ilişkin görüşlerimizi halının altına süpürmesi mümkün olmadı. Genişledik ve daha da genişleyebiliriz; milletimiz için yeni bir isim bunu açıkça ortaya koyacaktır. Kozadan çıkıyoruz, dünyanın hayranlık duyması ve tanıması için kanatlarımızı açıyoruz, renklerimize ve desenlerimize güneydeki yeni ulusa, Avustralasya'ya isim veriyoruz."
 AST_australian_accusations_modifier:0 "Avustralya Suçlamaları"
 AST_australian_comforts_fund:0 "£BoP_right_texticon  Avustralya Yardım Fonu"
 AST_australian_comforts_fund_desc:0 "Hükümet, hayatta kalan eşinin hevesli bir çalışanı olduğu Avustralya Yardım Fonu'na yatırım yaparak Canberra Uçak Kazası kurbanlarından birini onurlandıracaktır.\n\nFon, Avustralyalı askerlere ordu tayınlarını ve kişisel kitlerini destekleyen ürünler göndererek sahada geçirdikleri zamanı kolaylaştırmayı amaçlamaktadır ve böylece savaş çabası da bir yatırımdan faydalanacaktır."
