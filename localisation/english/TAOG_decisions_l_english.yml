 INS_abandon_mission:0 "Görevi Terk Et"
 INS_abandon_mission_desc:0 "Kaynaklarımız sınırsız değil ve [FROM.GetNameDef]'deki mücadele şu anda verebileceğimizden daha fazlasını talep ediyor. Ajanlarımızı geri çekeceğiz ve çabalarımızı en çok ihtiyaç duyulan yerlere yönlendireceğiz."
 INS_anti_colonialist_bonus:0 "[FROM.GetName]'de Sömürgecilik Karşıtı Duyguları Yay"
 INS_anti_colonialist_bonus_desc:0 "[FROM.GetName] halkı, kendi çıkarlarına değil, yabancı bir efendinin çıkarlarına hizmet etmek için çalışıyor. Onlara boyun eğmenin bir seçim olduğunu ve efendilerinin sandıkları kadar güçlü olmadıklarını hatırlatacağız."
 INS_arm_militias:0 "Yerel [FROM.GetAdjective] Milisleri Silahlandır"
 INS_arm_militias_desc:0 "Broşürler ve konuşmalar devrimi sadece bir yere kadar taşıyabilir. Zamanı geldiğinde, [FROM.GetName]'deki yoldaşlarımız savaşabilmelidir. İhtiyaç fazlası silahlar ve malzemeler, sempatizan milislere kaçırılmalıdır, böylece gericilik güçleri savunmasız bir halkla değil, silahlı bir halkla karşı karşıya kalacaktır."
