 AST_scale_up_middleback_mines_steel_decision_1_desc:0 "Iron Knob Madeni bir süredir aktif olsa da, artan demir cevheri talebiyle birlikte, buradaki çabalarımızı genişletmenin zamanı geldi."
 AST_scale_up_middleback_mines_steel_decision_2:0 "Iron Monarch Madenini Aç"
 AST_scale_up_middleback_mines_steel_decision_2_desc:0 "Iron Knob madeni ihtiyaçlarımız için yeterli değil, neyse ki Middleback Dağları demir açısından zengin. Şimdiye kadarki en büyük madenimizi kurma zamanı!"
