 AST_organize_in_nation:0 "§Y[FROM.GetName]§! Sendikalarına Sız"
 AST_organize_in_nation_desc:0 "İşçi hareketi sınır tanımaz. Kaynakları yoldaşlarımızın ağlarına yönlendirerek, komünist örgütleyicileri [FROM.GetName] sendikalarına yerleştirebilir ve işçi sınıfı içinden devrim için taban desteği oluşturabiliriz."
