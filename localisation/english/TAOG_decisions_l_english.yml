 INS_war_escalation_8_tt:0 "§Y[INS.GetName]§!: Java'da sızma kampanyası başlatma odağının kilidini açar. §RBu, Endonezya'nın erken bir zaferine yol açabilir.§!\n§Y[INS.GetName]§!: Sukarno'nun Hayatına Yönelik Başarısız Girişim"
 INS_war_escalation_9_tt:0 "§Y[INS.GetName]§!: Sosyalist Partiler Birleşiyor"
 INS_war_escalation_level_tt:0 "§YMevcut Gerginlik§!\n\nGerginlik Seviyesi zamanla artar ve ayrıca Milislerin §Yyeni eyaletleri işgal etmesiyle§! ve [HOL.GetNameDef]'in milis faaliyetleriyle mücadele etmek için harekete geçmesiyle de artar. Durum yeterince tırmanırsa §Ryekyekün savaşa§! dönüşebilir."
