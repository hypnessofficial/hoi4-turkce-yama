 AST_supply_arms_to_nation:0 "§Y[FROM.GetName]§!'e silah tedarik et"
 AST_supply_arms_to_nation_desc:0 "Yoldaşlarımıza silah tedarik edeceğiz"
 AST_switch_combat_specialization:0 "Muharebe Uzmanlığını Değiştir"
 AST_take_it_to_foreign_streets:0 "Uluslararası İşçi Dayanışması Yürüyüşü Organize Et"
 AST_take_it_to_foreign_streets_desc:0 "İşçilerin sınırları yoktur. Etkimizin çoktan yerleştiği her ulusun sokaklarına Avustralyalı komünist örgütleyicileri göndererek, yerel hareketleri canlandıran ve devrim ateşini canlı tutan koordineli bir uluslararası kampanya başlatacağız."
 AST_take_it_to_foreign_streets_tt:0 "Şu anda sızılmış olan tüm ülkelerde Yabancı Komünist Etkisi'nin süresini 60 gün uzatır."
 AST_the_brisbane_line:0 "Brisbane Hattı"
 AST_the_brisbane_line_desc:0 "Avustralya'nın savunma yetenekleri, yabancı saldırganlığı tamamen engellemek için yeterince güçlü olmayabilir. Tüm toprakların zayıf bir şekilde savunulması yerine hayati toprakların güçlü bir şekilde savunulmasına öncelik veren bir politika benimseyerek, [AST.GetName]'in en gelişmiş ve yerleşim bulunan kısımlarının kontrolümüz altında kalmasını sağlayabiliriz.\n\nBöyle bir politikaya, herhangi bir düzeyde teslimiyeti reddedenler tarafından şüphesiz karşı çıkılacak olsa da, Hükümetin [AST.GetName]'i makul bir yöne yönlendirme sorumluluğu vardır."
 AST_the_crown_intervenes:0 "Kraliyet Müdahale Ediyor"
 AST_the_crown_intervenes_desc:0 "Ülkenin ve düzenin koruyucuları olan Yeni Muhafızlar, mevcut düzensizlikten dehşete düşmüş durumda. İngiliz mirasları ve monarşist idealleri tarafından yönlendirilen önde gelen üyeler, yardımlarını istemek için İngiliz yetkililerle temasa geçtiler.\n\nŞimdi Yeni Muhafız, [AST.GetAdjective] hükümetine çağrıda bulunuyor: İngiliz müdahalesini memnuniyetle karşılayın."
 AST_the_crown_intervenes_trigger_tt:0 "§Y15.000§!'den fazla Yeni Muhafız üyesi"
 AST_the_solomon_islands_protectorate:0 "Solomon Adaları Koruma Bölgesi"
 AST_the_solomon_islands_protectorate_desc:0 "1893'ten beri Solomon Adaları bir himaye altındaydı. Bununla birlikte, savaş koruyucusunu tüketirken, adaların gerçekte ne kadar koruma bekleyebileceği şüphelidir. \n\n[AST.GetNameDefCap], adaları kendisi korumaya çalışacaktır ve Avustralya'nın itibarına sahip bir komşu ülkenin böyle bir göreve çok daha uygun olduğu kesinlikle açık olmalıdır."
 AST_training_camps_specialization:0 "Eğitim kamplarımız birliklerimize uzmanlık eğitimi vermeye hazır olup onları çok çeşitli farklı harekât alanlarında daha etkili hâle getirecektir."
 AST_union_control_1_cat:0 "Sendika Kontrolü"
 AST_union_control_1_cat_desc:0 "Sendika üyelerimiz, Avustralya genelinde halk arasında destek toplamaya başladılar. Her bir eyalette yasama meclisine sızabilir ve Komünist liderliğindeki bir hükümet için içeriden destek oluşturabiliriz. Bu, önemli miktarda politik güce mal olacak ve ülkeyi istikrarsızlaştırmakla tehdit edecektir. \n\nYeni Muhafız Gazileri hareketlerimizi yakından izliyor ve eğer hükümet zamanında harekete geçemezse veya ulus çok istikrarsızlaşırsa, bu çatışma ulusu tamamen parçalayabilir.\n\nKomünizm Desteği: §Y%§![?party_popularity_100@communism|Y]\n\n§Rİstikrar %40'ın altına düşerse veya Gaziler İsyanı zaman aşımına uğrarsa bir İç Savaş patlak verecektir.§!"
 AST_union_control_1_cat_name:0 "Desteğinizdeki sendikaları kışkırtacağınız yeri seçin"
 AST_union_control_1_map_area_name:0 "Hâlâ etkilenebilecek eyaletler"
 AST_union_control_2_cat:0 "Sendika Kontrolü"
 AST_union_control_2_cat_desc:0 "[ROOT.GetNonIdeologyName] işçileri, emperyalist güçlerin deniz aşırı yoldaşlarımızı zincirler içinde tutmaya devam etmesini izlemek için zalimlerini devirmedi. Komünizmin sınırlarımızın ötesine yayılması sadece ideolojik bir hedef değil, stratejik bir zorunluluktur. Devrim ateşini okyanuslar ötesinde körüklemeli, emperyalizmin boyunduruğunu atmak isteyenlere umut ve kaynak sağlamalıyız, ta ki eski düzenin üzerinde duracak bir zemini kalmayana dek."
 AST_union_control_2_foreign_cat:0 "Komünizmi Bastır"
 AST_union_control_progressbar_pip_1:0 "Mevcut"
 AST_union_control_progressbar_pip_2:0 "Etkilenmiş"
 AST_union_control_progressbar_pip_3:0 "İç Savaş Mevcut"
 AST_union_control_progressbar_pip_4:0 "İç Savaş Tetiklendi"
 AST_union_control_progressbar_pip_5:0 "Kukla Yapıldı"
 AST_union_control_tt:0 "Sendikalar kendilerini Avustralya çapındaki eyaletlerde kurmalıdır, ancak Yeni Muhafız Gazileri Komünizmin yayılmasını engellemek için çalışmaktadır."
 AST_union_infiltration_in_progress:0 "Yabancı Sendika Sızması Sürüyor"
 AST_union_strike:0 "Grev Organize Et"
 AST_union_strike_desc:0 "İşçilerimiz iş yerlerinden ayrılarak daha iyi koşullar ve haklar talep ediyor. Bu, hükümete yeni reformlar yapması için kesinlikle baskı yapacaktır."
 AST_veterans_revolt:0 "Gaziler İsyanı"
 AST_veterans_revolt_desc:0 "Orduda, daha önce faşist grupların parçası olan birçok anti-komünist üye var. Komünizmi küçümsüyorlar ve iktidara gelmesini görmektense silaha sarılmayı tercih ederler.\nDevrimimizi gerçekleştirmekte çok gecikirsek veya istikrarın çok düşmesine izin verirsek, bunun olmasını önlemek için meseleyi kendi ellerine alacaklardır."
 AST_vichy_out_of_africa_cat:0 "Vichy Afrika'dan Çık"
 AST_vichy_req_ongoing_flag:0 "Bölge Talebi §YDevam Ediyor§!"
 AST_war_angst_cat:0 "Savaş Endişesi"
 AST_war_is_coming_cat:0 "Savaş Geliyor"
 AST_war_is_coming_cat_desc:0 "Gerilimler artıyor ve hem Avustralyalı yetkililer hem de vatandaşlar, politikaları veya çıkarları ne kadar aksini arzulasa da savaşın kaçınılmaz olabileceğinin farkına varmaya başlıyor.\n\nBir işgal durumunda izlenecek prosedürlere karar vermek için bir Kabine toplantısı çağırmalıyız. Ancak bunu yapmadan önce, tüm Kabinenin aynı fikirde olmayabileceği eylemlerde bulunmaya değebilir."
 AST_you_can_switch_sf:0 "Uzmanlıklar arasında geçiş yapabileceksiniz."
 HOL_recall_conrad_helfrich:0 "Conrad Helfrich'i Doğu Hint Adalarından Geri Çağır"
 HOL_recall_conrad_helfrich_desc:0 "Bu zor zamanlarda, anavatana her şeyden önce öncelik vermeliyiz. Kraliyet Hollanda Donanması'nın en iyi Amirali olarak Conrad Helfrich, Hollanda'ya dönmelidir."
 INSHOL_democratic_elections_tt:0 "§YVolksraad§! iktidar partisi olur.\nMevcut ülke liderini değiştirmek için §YDemokratik Seçimler§! kararlarının kilidini açar."
 INSHOL_nationalist_coallition_tt:0 "§Y$INSHOL_democracy$§! tamamlandıktan sonra §Y$INS_sutan_sjahrir$§! ve §Y$INS_mohammad_hatta$§! ülke lideri olarak mevcut olacaktır."
