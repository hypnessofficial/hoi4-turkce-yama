 AST_insufficient_funds_mission_tt:0 "Kararları Etkinleştir: §Y$AST_summons_to_australian_hall$§!, §Y$AST_print_the_publicist$§!.\n"
 AST_integrate_indonesia:0 "[INS.GetNonIdeologyName] unsurunu Entegre Et"
 AST_integrate_indonesia_indonesia_core_states_tt:0 "Tüm §Y[INS.GetNonIdeologyName]§! eyaletleri üzerinde hak kazan."
 AST_integrate_indonesia_indonesia_required_states_tt:0 "Tüm §Y[INS.GetNonIdeologyName]§! eyaletlerini kontrol eder."
 AST_ireland_weapon_smuggling_cat:0 "İrlandalıları Silahlandırmak"
 AST_japanese_war_mission:0 "Japon Savaşı"
 AST_japanese_war_mission_desc:0 "Avustralya ezici düşmanıyla tek başına yüzleşmek istemiyor — [JAP.GetNameDef]. Bizim ilk adımı atmamızı ve beliren çatışmayı en kısa zamanda çözmemizi istiyorlar."
 AST_kingdom_expansions_cat:0 "Krallık Genişletmeleri"
 AST_labor_campaign_tour_effect_tt:0 "\n§Y$AST_labor_campaign_tour_mission$§! aktifken etkiler (§Y180§! gün):\nGünlük §YA.L.P§! Oyları artışı: §G+%0.05§!\n\n§Y180§! gün içindeki etkiler:"
 AST_labor_campaign_tour_mission:0 "Avustralya İşçi Partisi Kampanya Turu"
 AST_labor_campaign_tour_mission_desc:0 "Avustralya İşçi Partisi (ALP), her vatandaşı temsil etme misyonuyla, emperyalizm ve Avustralya'nın İmparatorluğa olan sadakati konusunda farklı bir bakış açısı benimsedi. Yurtiçi ihtiyaçlar önce gelmelidir ve dış çıkarlar artık öncelikli olmamalıdır.\n\nMesajı hem mevcut iktidar partisine hem de seçmenlere yaymak için ALP ülke çapında bir kampanya turuna çıkacaktır.\n\n§YAktifken etkiler:§!\n§WGünlük §YA.L.P§! Oyları artışı: §G+%0.05§!§!"
 AST_land_development:0 "Arazi Geliştirme"
 AST_land_development_desc:0 "[ROOT.GetFascistParty]'nin onlara fayda sağlayan politikalar izlemesi karşılığında, önde gelen iş dünyası figürleri partinin hedefleriyle uyumlu sanayi reformlarına yatırım yapmayı kabul ettiler.\n\n[ROOT.GetName] topraklarının çok büyük bir kısmı sanayileşmemiş ve az gelişmiş olarak duruyor. Bu bölgeleri geliştirerek, onları inşaata uygun hale getireceğiz."
 AST_make_a_common_enemy:0 "Ortak Bir Düşman Edin"
 AST_make_a_common_enemy_desc:0 "Güvensizlik sesleri, Canberra Hava Felaketi'nde ölen yetkililerin kaybının ardından çoğaldı. Kazanın olağandışı koşulları, yabancı müdahalesi şüphesini teşvik eden tek faktör değil; ne de olsa hiçbir şey ortak bir düşmandan daha fazla birleştirmez."
 AST_make_a_common_enemy_tt:0 "§ROlayın Olası Etkileri:§!"
