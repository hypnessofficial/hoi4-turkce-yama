 SIA_end_factionalism_mission:0 "Koalisyonu Bir Arada Tutmak"
 SIA_end_factionalism_mission_desc:0 "Khana Ratsadon'un her iki kanadı da tamamen hükümetin arkasında duruyor. Eğer her ikisini de §Y270§! gün boyunca §GFull Support§! seviyesinde tutabilirsek, aralarındaki rekabet tamamen sona erdirilebilir. Kanatlardan birinin coşkusu sarsılırsa, çabaya yeniden başlanmalıdır."
 SIA_establish_mountain_weather_posts:0 "Dağ Hava Durumu Mesajlarını Oluşturun"
 SIA_establish_mountain_weather_posts_desc:0 "Dağlık bölgelerdeki gizli karakollar, Müttefik hava kuvvetlerinin şiddetle ihtiyaç duyduğu hava durumu raporlarını radyoyla iletecek."
 SIA_finish_the_triangular_defense_network:0 "Üçgen Savunma Ağını Tamamla"
 SIA_finish_the_triangular_defense_network_desc:0 "Kuzey ve Güney'deki iki kalenin tamamlanmasıyla, onları Bangkok ile birleştirerek üçgen bir savunma ağı oluşturabiliriz. Biri düşerse diğerleri çalışmaya devam edecektir."
 SIA_fortress_hanoi:0 "Hanoi Kalesi"
 SIA_fortress_hanoi_desc:0 "Güney İmparatorluğu Saygon tarafından korunacaktır. Bu kale şehri, [ROOT.GetName] körfezini istilacılardan koruyarak Bangkok için bir muhafız olarak duracaktır."
 SIA_fortress_saigon:0 "Saygon Kalesi"
 SIA_fortress_saigon_desc:0 "Yeni İmparatorluğumuzun Kuzeyi Hanoi tarafından korunacaktır. Kuzeyindeki dağlar ve önündeki Kızıl Nehir ile her türlü istilacıyı uzak tutmak için mükemmel bir konumdadır."
