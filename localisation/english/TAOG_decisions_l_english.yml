 SIA_invite_to_adc:0 "§Y[FROM.GetName]§!'i ittifakımıza davet et"
 SIA_khana_ratsadon_cat:0 "Khana Ratsadon"
 SIA_khana_ratsadon_cat_desc:0 "Mutlak monarşiyi sona erdiren Halk Partisi Khana Ratsadon tek bir blok değildir. Askeri ve sivil kanatlarının her birinin ülkeye dair kendi vizyonları vardır ve aralarındaki gerilim her kararın yüzeyinin altında akar. Her iki hizbi de memnun tutun, aksi takdirde koalisyonun parçalanma riskini alırsınız."
 SIA_khana_ratsadon_civilian_coup_mission:0 "Sivil kanat hükümeti devirmeyi planlıyor!"
 SIA_khana_ratsadon_civilian_coup_mission_desc:0 "Sivil kanat, mevcut hükümet politikalarını kendi çıkarlarına yönelik bir tehdit olarak görüyor. Durumları iyileşmezse hükümeti devirmeyi aktif olarak planlıyorlar."
 SIA_khana_ratsadon_dummy_civilian:0 "Sivil Kanat Darbesi Riski"
 SIA_khana_ratsadon_dummy_civilian_desc:0 "Sivil kanat, Khana Ratsadon partisinin güçlü bir kliğidir. Kendi çıkarlarına ters düştüğünü düşündükleri politikaları onaylamayacaklar, ancak demokrasi yanlısı, sivil yanlısı olarak gördükleri şeyleri onaylayacaklardır."
 SIA_khana_ratsadon_dummy_civilian_tt:0 "Sivil kanat, onları çok fazla kızdırırsak bir darbe başlatacaktır. İç savaşı önlemek için çok uzun süre §Y$idea_SIA_civilian_rebellious$§! durumunda olmamalıyız."
 SIA_khana_ratsadon_dummy_military:0 "Askeri Darbe Riski"
 SIA_khana_ratsadon_dummy_military_desc:0 "Ordu, Khana Ratsadon partisinin güçlü bir kliğidir. Kendi çıkarlarına ters düştüğünü düşündükleri politikaları onaylamayacaklar, ancak ülkenin askerileşmesi lehinde gördükleri şeyleri onaylayacaklardır."
 SIA_khana_ratsadon_dummy_military_tt:0 "Ordu, onları çok fazla kızdırırsak bir darbe başlatacaktır. İç savaşı önlemek için çok uzun süre §Y$idea_SIA_military_rebellious$§! durumunda olmamalıyız."
 SIA_khana_ratsadon_military_coup_mission:0 "Ordu hükümeti devirmeyi planlıyor!"
 SIA_khana_ratsadon_military_coup_mission_desc:0 "Ordu, mevcut hükümet politikalarını kendi çıkarlarına yönelik bir tehdit olarak görüyor. Durumları iyileşmezse hükümeti devirmeyi aktif olarak planlıyorlar."
 SIA_limited_war_cat:0 "Sınırlı Savaş"
 SIA_limited_war_cat_desc:0 "Bölgenin büyük güçlerinin üstesinden açık bir savaşta gelmeyi umut edemeyiz — henüz değil. Taleplerimizi parça parça, dikkatlice kapsamlandırılmış seferler aracılığıyla dile getirerek, kendi gücümüz artmaya devam ederken onların konumlarını aşındırıyoruz."
 SIA_limited_war_indochina:0 "[SIA_GetLimitedWarTarget]"
 SIA_limited_war_indochina_desc:0 "§YSınırlı Savaşı§! kazanmak ve tam ölçekli bir savaşa tırmandırmadan onları ele geçirmek için vurgulanan tüm eyaletlerin kontrolünü ele geçirin.\n§R[?var:global.limited_war_surrender_threshold|%.0]'den fazla teslim olma ilerlemesi kaybetmek, sınırlı savaşı kaybetmemize neden olacaktır§!"
 SIA_limited_war_indochina_no_target:0 "Sınırlı Savaş Başarısız Oldu"
 SIA_limited_war_indochina_target:0 "§Y[?var:limited_war_target.GetName]§!'e karşı §YSınırlı savaş§!"
 SIA_mandate_1:0 "Birinci Yetki"
 SIA_mandate_10:0 "Onuncu Yetki"
 SIA_mandate_10_desc:0 "Tayland halkı, uygun şekilde giyinmeden halka açık toplantılarda, halka açık yerlerde veya şehir sınırlarında görünmemelidir. Uygunsuz giyim, yalnızca külot giymeyi, gömlek giymemeyi veya bele dolanan bir bez giymeyi içerir.\n\nTayland halkı için uygun giyim şunlardan oluşur: Konum ve fırsat elverdiğince üniformalar; Kibar uluslararası tarz kıyafetler; Kibar geleneksel kıyafetler."
 SIA_mandate_11:0 "On Birinci Yetki"
 SIA_mandate_11_desc:0 "Tayland halkı zamanlarını üç kısma ayırmalıdır. Biri iş için, biri kişisel aktiviteler için ve diğeri dinlenme ve uyku için. Bu düzenli olmalı ve alışkanlık haline gelene kadar bir programı takip etmelidir.\n\nTayland halkı normal kişisel aktivitelerini şu şekilde gerçekleştirmelidir: Öğünleri belirlenmiş saatlerde, günde en fazla dört kez yiyin; Yaklaşık 68 saat uyuyun.\n\nTayland halkı iş görevlerini cesaretsizliğe kapılmadan veya kaytarmadan sadakatle yerine getirmelidir. Gün ortası dinlenme ve öğle yemeği süresi bir saatten uzun olmamalıdır. İş gününün sonunda, en az bir saat spor yaparak egzersiz yapın veya bahçecilik, evcil hayvanlara bakma veya ağaç dikme gibi diğer aktiviteler yapın. Ardından duş aldıktan sonra akşam yemeği yiyin.\n\nTayland halkı gece boş zamanlarını gerekli işleri tamamlamak, aileniz ve arkadaşlarınızla sohbet etmek, radyo haberleri dinleyerek veya kitap okuyarak veya fırsat buldukça diğer eğlence veya sanat dallarını takip ederek bilgi aramak için kullanmalıdır"
 SIA_mandate_12:0 "On İkinci Yetki"
 SIA_mandate_12_desc:0 "Halka açık yerlerde veya yollarda, insanlar çocuklara, yaşlılara veya engellilere yardım etmeli ve onları korumalıdır.\n\nMadde 1'i uygulayan kişi, Tayland halkının saygısını hak eden kültürlü bir kişi olarak kabul edilir."
 SIA_mandate_1_desc:0 "Ülke, halk ve milliyet Taylandlı olarak adlandırılacaktır"
 SIA_mandate_1_tt:0 "§Y[THIS.GetName]§!, §Y$SIA_thailand$§! olarak bilinecektir"
 SIA_mandate_2:0 "İkinci Yetki"
 SIA_mandate_2_desc:0 "Tayland halkı, ulusun yararını ve güvenliğini düşünmeden hiçbir işe girişmemelidir\n\nTayland halkı, ulusa zarar verebilecek hiçbir şeyi yabancılara asla açıklamamalıdır. Bu eylemler ulusa ihanettir\n\nTayland halkı, Tayland ulusunun yararını düşünmeden yabancıların ajanı veya sözcüsü olarak hareket etmemeli ve uluslararası anlaşmazlıklarda görüş bildirmemeli veya yabancıların tarafını tutmamalıdır. Bu eylemler ulusa ihanettir.\n\nTayland halkı, ulusu tehlikeye atacak şekilde yabancılar adına gizlice arazi satın almamalıdır. Bu eylemler ulusa ihanettir.\n\nBir kişi ulusa ihanet ettiğinde, bunu aktif ve hızlı bir şekilde durdurmak Tayland halkının görevidir."
 SIA_mandate_3:0 "Üçüncü Yetki"
 SIA_mandate_3_desc:0 "Tayland halkından, milliyetin adıyla veya grubun tercihine göre tutarsız bir şekilde bahsetmeyi bırakın.\n\nTüm Tayland halkından alt gruplara ayırmadan bahsetmek için 'Tay' adını kullanın."
 SIA_mandate_4:0 "Dördüncü Yetki"
 SIA_mandate_4_desc:0 "Ulusal bayrağın hükümet geleneğine göre göndere çekildiğini veya indirildiğini gördüğünüzde veya selam borazanı veya düdüğü sesini duyduğunuzda veya bayrağı göndere çekme veya indirme işareti verildiğinde, bayrağı yönetmeliğe veya geleneğe göre onurlandırın.\n\nUlusal marş duyulduğunda, ister resmi amaçlarla isterse herhangi bir törenin parçası olarak çalınsın, katılımcılar veya katılanlar yönetmeliğe veya geleneğe göre marşı onurlandıracaktır.\n\nUygun saygı göstermeyen herhangi bir kişiyi gözlemlediğinizde, ulusal bayrağı, ulusal marşı ve kraliyet marşını onurlandırmanın önemini görecek şekilde onları uyarın."
 SIA_mandate_5:0 "Beşinci Yetki"
 SIA_mandate_5_desc:0 "Tayland halkı, yalnızca Tayland ürünlerinden yapılmış yiyecekleri tüketmek için çaba göstermelidir.\n\nTayland halkı, yalnızca Tayland ürünlerinden yapılmış kıyafetler giymek için çaba göstermelidir.\n\nTayland halkı, diğer Taylandlıların tarımsal, ticari, endüstriyel ve diğer mesleki çabalarını desteklemelidir.\n\nTayland halkı, hükümet veya Tayland halkı tarafından kurulan herhangi bir kamu hizmetini kullanmalı ve desteklemelidir.\n\nBu yetki tarafından desteklenen tarım, ticaret, sanayi veya diğer meslekleri icra eden Tayland halkı, standartları korumak, kaliteyi artırmak ve işlerini dürüstçe yürütmek için çaba göstermelidir."
 SIA_mandate_6:0 "Altıncı Yetki"
 SIA_mandate_6_desc:0 "Ulusal marşın müziği Phra Chenduriyang tarafından yazılan ve Güzel Sanatlar Bölümü'nde dosyalanan müzik olacaktır\n\nUlusal marşın sözleri ordu tarafından sunulanlar olacaktır"
 SIA_mandate_7:0 "Yedinci Yetki"
 SIA_mandate_7_desc:0 "Her Taylandlı ulusun inşasına yardım etmelidir. Eli silah tutan herkes istikrarlı bir kariyerde çalışmalıdır. Kariyeri olmayan herhangi bir kişi ulusa faydasızdır ve Tayland halkından saygı görmeyi hak etmez."
 SIA_mandate_8:0 "Sekizinci Yetki"
 SIA_mandate_8_desc:0 "Kraliyet marşında, kraliyet marşının sözlerini kısaltacağız ve Siyam kelimesini Tay kelimesiyle değiştireceğiz"
 SIA_mandate_9:0 "Dokuzuncu Yetki"
 SIA_mandate_9_desc:0 "Tayland halkı Tay dilini yüceltmeli, onurlandırmalı ve saygı duymalı ve bunu konuşmaktan onur duymalıdır.\n\nTayland halkı ulusal dili çalışmayı iyi bir vatandaşın görevi olarak görmeli ve en azından okuyup yazabilmelidir; Tayland halkı ayrıca Tayca konuşmayan veya Tayca okuyamayan vatandaşların öğrenmesine yardımcı olmayı ve desteklemeyi de önemli görevleri olarak görmelidir.\n\nTayland halkı doğum yerini, ikametgahını veya bölgesel aksanını bir ayrım işareti olarak görmemelidir. Herkes, Tayland halkı olarak doğan herkesin aynı Tayland kanına sahip olduğunu ve aynı Tayland dilini konuştuğunu doğru kabul etmelidir. Doğum yeri veya aksan fark yaratmaz.\n\nTayland halkı, iyi bir Tayland vatandaşı gibi davranmayı ve henüz iyi bir Tayland ulusu vatandaşının görevlerini bilmeyenleri ve anlamayanları teşvik etmeyi ve talimat vermeyi görevleri olarak görmelidir."
 SIA_modify_cultural_mandates:0 "$idea_SIA_thai_cultural_mandates$ etkisini şu şekilde değiştirir:"
 SIA_movie_theater_cat:0 "$SIA_sala_chaloem_thai_movie_theater$"
 SIA_movie_theater_cat_desc:0 "Gümüş ekran, modern devletin en güçlü araçlarından biridir. Özenle seçilmiş filmler ve propaganda kampanyaları aracılığıyla hükümet kamuoyunu şekillendirebilir, vatanseverliği körükleyebilir ve muhalif sesleri bastırabilir."
 SIA_new_territories_administration_cat:0 "Yeni Topraklar İdaresi"
 SIA_new_territories_administration_cat_desc:0 "Fetih sadece bir başlangıçtır. Ele geçirdiğimiz toprakların, yeniden fethedilmeye davetiye çıkaran bir yük olmaktan ziyade ulusun kalıcı bir parçası olmaları için yönetilmeleri, geliştirilmeleri ve savunulmaları gerekir."
