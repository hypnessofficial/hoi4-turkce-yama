 AST_smuggle_arms_to_ireland:0 "İrlanda'ya Silah Kaçır"
 AST_smuggle_arms_to_ireland_desc:0 "İngilizlerle savaşmaları için İrlandalılara ihtiyaç duydukları silahları tedarik etmeliyiz."
 AST_smuggle_arms_to_ireland_ongoing_flag:0 "Silah Kaçakçılığı §YDevam Ediyor§!"
 AST_smuggle_arms_to_northern_ireland:0 "Kuzey İrlanda'ya Silah Kaçır"
 AST_smuggle_arms_to_northern_ireland_desc:0 "Kuzey İrlanda'yı yeterince silahla donatabilir ve İrlanda ile yeterince iyi bir bağlantı kurabilirsek, o zaman İngilizler müdahale etme şansı bulamadan İrlanda ile birleşebilmesini sağlayabiliriz."
