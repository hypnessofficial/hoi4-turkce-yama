 AST_summon_the_cabinet_tt1:0 "\nBu etkinlik mevcut hükümeti bozacak ve potansiyel olarak §Yçöküşüne§! yol açacaktır."
 AST_summons_to_australian_hall:0 "Australian Hall'a Çağrı"
 AST_summons_to_australian_hall_desc:0 "[AST.GetFascistParty] büyütme çabamızda birleşmeli ve destekçilerimizi seferber etmeliyiz. Australian Hall bizi bekliyor."
