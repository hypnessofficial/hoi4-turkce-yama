 AST_print_the_publicist:0 "The Publicist'i Bas"
 AST_print_the_publicist_desc:0 "Önce Avustralya bülteni The Publicist, potansiyel destekçilere ulaşmada önemli bir rol oynuyor. Başka bir sayı yayınlayarak mesajımızı yayabiliriz."
