 AST_nationalizing_cat:0 "Millileştirme"
 AST_nationalizing_process_ends_tt:0 "§RBu odağı seçmek yukarıdaki tüm odakları kilitleyecektir!§!"
 AST_nationalizing_process_tt:0 "§YMillileştirme Sürüyor§! uygulayarak §YMillileştirmeyi Başlat§! kararını etkinleştirir. Aşağıdaki odaklar için gereklidir ve §YHalkın Avustralyası§! tamamlandığında kaldırılır. §RSeçilmeyen odaklar daha sonra kilitlenecektir!§!"
 AST_naval_efforts_cat:0 "Deniz Çabaları"
 AST_naval_efforts_cat_desc:0 "$AST_royal_prestige_desc$"
 AST_naval_expansion:0 "$NOR_alt_dem_naval_expansion$"
 AST_naval_expansion_desc:0 "[ROOT.GetFascistParty]'nin kendilerine fayda sağlayan politikalar izlemesi karşılığında, önde gelen iş adamları partinin amaçlarıyla uyumlu sanayi reformlarına yatırım yapmayı kabul etti.\n\n[AST.GetName] unsurunun üstün deniz gücüne sahip düşmanlara karşı bir şansı olması için filonun genişletilmesi gerekiyor. Sınırlı bir süre için, tersanelerdeki herkes iş başında olacak ve gemi üretiminde bir artış sağlanacak."
 AST_new_hebrides_and_caledonia_under_our_wing:0 "Yeni Hebridler ve Kaledonya Kanatlarımızın Altında"
 AST_new_hebrides_and_caledonia_under_our_wing_desc:0 "Yeni Hebridler ve Yeni Kaledonya ada gruplarının, tıpkı Avustralya gibi, uzun bir Avrupa işgali geçmişi vardır. [AST.GetNameDef] sonunda yerleşimcilerden kurtulduğuna göre, çevremize, özellikle de bizimkine benzer bir geçmişe sahip akranlarımıza sahip olmak bizim kraliyet sorumluluğumuzdadır.\n\nDünyadaki gerilimlerin adaların işgalcilerini zorladığı bir ortamda, Yeni Hebridler ve Yeni Kaledonya'nın Avustralya sınırları içinde daha güvenli olacağını onlara anlatmak artık mümkün."
 AST_new_zealand_and_clause_6:0 "Yeni Zelanda ve Madde 6"
 AST_new_zealand_and_clause_6_desc:0 "Avustralya kolonilerini bir federasyon altında birleştiren süreçte Yeni Zelanda sonuçta katılmamaya karar verdi. Ancak o günden bu yana, Anayasa Yeni Zelanda'yı Avustralya'nın potansiyel eyaletlerinden biri olarak tanımlamaya devam etti ve kabulüne izin verdi.\n\nUlusal güvenlikleri artık ciddi şekilde tehdit altında olan Yeni Zelanda, 6. Maddenin yürürlüğe girmesinden bu yana ilk kez Krallığımıza katılmaya yönelebilir."
