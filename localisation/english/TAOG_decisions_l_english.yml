 INS_escalate_the_conflict_desc:0 "Daha ciddi operasyonların daha sonra daha az uluslararası incelemeyle karşılaşmasını sağlamak için zemin hazırlayarak, gerilimi ve tırmanmayı artırmak amacıyla düşman güçleriyle isyanlar ve çatışmalar organize edeceğiz."
