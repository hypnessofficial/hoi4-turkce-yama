 SIA_print_additional_money:0 "Ek Para Bas"
 SIA_print_additional_money_tt:0 "Japonya için daha fazla para basacağız."
 SIA_promote_civilian_wing:0 "Sivil Kanadın Gönlünü Al"
 SIA_promote_civilian_wing_desc:0 "Hükümetin ağırlığını sivil kanadın toprak reformu, mahkemeler ve anayasa gündeminin arkasına koyarak Pridi'nin grubunun minnettarlığını kazanabiliriz. Ancak bu tür bir kayırmacılık gözden kaçmaz: Subay kadrosu surat asacak ve sular durulana kadar olağan yönetimin kesintiye uğraması bize pahalıya mal olacaktır."
 SIA_promote_military_wing:0 "Askeri Kanadın Gönlünü Al"
 SIA_promote_military_wing_desc:0 "Subayların taleplerini yerine getirerek ve silahlı kuvvetlerin gücünü sergileyerek Phibun'un grubunun sevgisini kazanabiliriz. Ancak bu tür bir kayırmacılık gözden kaçmaz: Yeniden yapılanma ordunun rutinini altüst eder ve sular durulana kadar olağan yönetimin kesintiye uğraması bize pahalıya mal olacaktır. Kanadı isyanın eşiğinden geri döndürmek için uygun, kaba bir araç."
 SIA_propaganda_campaign_cooldown_tt:0 "Bu kampanya, kaldırıldıktan §Y[?constant:propaganda.SIA.default_propaganda_campaign_cooldown] gün§! sonra tekrar kullanılabilir olacak."
 SIA_propaganda_campaign_empty_slot_tt:0 "Bu film afişi yuvası şu anda §Gboş§!. Yeni bir £SOV_propaganda_text_icon §YSinema Kampanyası§! §Gaktive edilebilir§!."
 SIA_propaganda_campaign_locked_slot_tt:0 "Bu propaganda afişi yuvası şu anda kilitli. Şu odak tamamlanarak açılabilir: TODO"
 SIA_propaganda_poster_slot_available_tt:0 "Boş bir film afişi yuvasına sahip."
 SIA_public_credit_repayment:0 "Kamu Kredisi Geri Ödemesi"
 SIA_public_credit_repayment_tt:0 "Tüm Kamu Kredi Borcumuzu tek seferde ödeyecek, büyük ve geçici bir §YTüketim Malları§! cezası pahasına tüm borcu ortadan kaldıracağız."
 SIA_recover_downed_airmen:0 "Düşen Havacıları Kurtarın"
 SIA_recover_downed_airmen_desc:0 "Yeraltımız, Tayland topraklarına düşen Müttefik el ilanlarını barındıracak ve uzaklaştıracak."
 SIA_release_contigency_funds:0 "Acil Durum Fonlarını Serbest Bırak"
 SIA_release_contigency_funds_tt:0 "§Y$idea_SIA_contingency_funds$§! etkisini şu şekilde değiştirir:\n"
 SIA_release_contigency_funds_tt2:0 "§Y[?var:SIA_contingency_funds]§! ay boyunca. Süre sonunda fonlar ortadan kalkacaktır. Barış zamanında ne kadar uzun süre fon toplarsak, fon savaş zamanında o kadar uzun süre dayanır."
 SIA_seek_support_from_absolutists_monarchists:0 "Mutlakiyetçi Monarşistlerden Destek İste"
 SIA_seek_support_from_absolutists_monarchists_tt:0 "Mutlakiyetçi Monarşistlerden destek alacağız.\n\nİç savaşta bize yardım edecekler ve ek tümenler çıkaracaklar. Ancak gücü ele geçirdikten sonraki §Y720 gün§! içinde §Y$SIA_an_absolute_monarchy$§! odağını tamamlayarak mutlak Monarşizme dönmemizi bekleyecekler.\n\nBunu yapmamak §Yİstikrar§! ve §YSavaş Desteği§!'ne darbe vuracaktır."
 SIA_seek_support_from_constitutional_monarchists:0 "Meşruti Monarşistlerden Destek İste"
 SIA_seek_support_from_constitutional_monarchists_tt:0 "Meşruti Monarşistlerden destek alacağız.\n\nİç savaşta bize yardım edecekler ve ek tümenler çıkaracaklar. Ancak gücü ele geçirdikten sonraki §Y720 gün§! içinde §Y$SIA_a_constitutional_monarchy$§! odağını tamamlayarak anayasal bir Monarşi olarak kalmamızı bekleyecekler.\n\nBunu yapmamak §Yİstikrar§! ve §YSavaş Desteği§!'ne darbe vuracaktır."
 SIA_smuggle_radio_sets:0 "Radyo Setlerini İçeriye Kaçırmak"
 SIA_smuggle_radio_sets_desc:0 "Sessiz bir radyo ağı, direnişi ve onun yabancı dostlarını iletişim halinde tutacak."
 SIA_standing_our_ground_mission:0 "Zeminimizi Korumak"
