 INS_deescalate_the_conflict_2:0 "Ateşkes Emri Ver"
 INS_deescalate_the_conflict_2_desc:0 "Baskınlarımız işe yaradı. Sömürge garnizonu menzilimizi biliyor ve Lahey sindirilmediğimizi biliyor. Yine de her vuruş Hollanda'ya daha fazla asker ve gemi göndermesi için yeni bir neden veriyor ve açık bir savaşa hazır değiliz. Komutanlarımıza ateşkes emri verilecek. Bir sonraki darbe Hollandalılar bizi kışkırttığında değil, biz söylediğimizde inecek."
 INS_deescalate_the_conflict_desc:0 "Hollandalılar bizimle iyi niyetle müzakere etmeyecektir. Onlar için hesaplaşılması gereken bir ulus olmaktan ziyade bastırılması gereken bir rahatsızlık, isyancılar olarak kalıyoruz. Ancak dünyanın büyük güçleri başka bir konudur ve Lahey onları bu kadar kolay göz ardı edemez. Arabuluculuk için uluslararası topluma başvuracağız ve kendi sesimizin başaramadığını yabancı baskının zorlamasına izin vereceğiz."
