 AST_canberra_air_disaster_flag:0 "$AST_canberra_air_disaster_events.1.t$"
 AST_castle_crumbling_mission:0 "Yıkılan Kale"
 AST_castle_crumbling_mission_complete_tt:0 "§YYıkılan Kale§! görevini tamamla"
 AST_castle_crumbling_mission_desc:0 "Avustralya, trajik Canberra Hava Felaketi'nin ardından liderlerine bakıyor. Mevcut hükümet, kabine yetkililerinin kaybından sonra bile halkın güvenine layık kalacak mı, yoksa liderlik değişikliği sadece en iyisi mi olur?"
 AST_castle_crumbling_mission_event_tt:0 "§YOlayın Etkileri:§!"
 AST_castle_crumbling_reactivate_tt:0 "§LGenel Vali müzakerelerin ortasında§! (odak §YKraliyet ve İmparatorluk için§!)§L; Hükümete ilişkin nihai karar ertelenecek.§!\n\n"
 AST_challenge_government_narrative:0 "£BoP_left_texticon  Hükümet Söylemine Meydan Oku"
 AST_challenge_government_narrative_desc:0 "Hükümet tarafından Canberra Hava Felaketi ile ilgili paylaşılan ayrıntılar olağandışı görünüyor ve kaçınılmaz olarak bazı bilgilerin saklanabileceği spekülasyonlarına yol açıyor. Deneyimli bir RAAF subayı ideal uçuş koşullarında uçağını nasıl düşürebilir? Hükümetten cevaplar talep edilmelidir."
 AST_civil_war_in_nation:0 "§Y[FROM.GetName]§!'de Devrimi Kışkırt"
 AST_civil_war_in_nation_desc:0 "Ektiğimiz tohumlar meyve vermeye hazır. [FROM.GetName]'deki Komünist desteği, açık devrimin ulaşılabilecek noktaya geldiği bir seviyeye ulaştı. Fonlama, kışkırtıcılar ve dikkatlice zamanlanmış bir itişle, halkın hoşnutsuzluğunu silahlı bir ayaklanmaya dönüştürebilir ve [FROM.GetName]'i hak ettiği işçi devletine bir adım daha yaklaştırabiliriz."
 AST_communism_support_text:0 "[?party_popularity_100@communism|Y]% Komünist Desteği"
 AST_critics_to_shame:0 "£BoP_right_texticon  Eleştirmenleri Utandır"
 AST_critics_to_shame_desc:0 "Canberra Hava Felaketi tüm ulusu etkiledi ve yasta olan hiçbir Avustralyalı bırakmadı. Böyle zamanlarda, her zaman avantaj sağlamak isteyenler olacaktır. En yüksek sesle eleştirenleri, eleştirilerinin gerçekte ne olduğunu ifşa edeceğiz; düzeni bozma girişimi."
 AST_cw_operation_in_progress:0 "Şu Anda Devrim Kışkırtılıyor"
 AST_demand_central_africa:0 "Orta Afrika'yı Talep Et"
 AST_demand_madagascar:0 "Madagaskar'ı Talep Et"
 AST_demand_southwestern_territories:0 "Güneybatı Topraklarını Talep Et"
 AST_deteriorating_prime_minister_nerves_desc:0 "[AST.GetLeader], kaçınılmaz savaşın baskısı altında zorlanıyor. Yakında rahatlama bulunamazsa, sinirleri dayanmayabilir."
 AST_deteriorating_prime_minister_nerves_mission:0 "Bozulan Başbakan Sinirleri"
 AST_develop_middleback_tt:0 "Bu, §Y$STATE_519$§!'daki §YÇelik§! üretimimizi geliştirmek için üç kararın kilidini açacaktır."
 AST_develop_port_kemla_steel_medium_decision:0 "İkinci Port Kembla Yüksek Fırınını İnşa Et"
 AST_develop_port_kemla_steel_medium_decision_desc:0 "Port Kembla sadece bir yüksek fırınla iyi bir şekilde çalıştı, ancak talep o kadar arttı ki ikinci bir tane inşa etmek isteyebiliriz. Bu, bölgenin çelik üretimini kabaca iki katına çıkaracaktır."
 AST_develop_port_kemla_steel_tt:0 "Bu, §YÇelik§! üretimimizi önemli ölçüde artıracak olan §Yİkinci Port Kembla Yüksek Fırınını İnşa Et§! kararını almamızı sağlayacaktır."
 AST_dockyard_construction:0 "Tersane İnşaatı"
 AST_election_approaching_cat:0 "Seçim Yaklaşıyor"
 AST_election_approaching_cat_desc:0 "Bir hükümet henüz yerine yerleşmişken, bir sonraki seçim yaklaşmaya başlar. Demokratik partiler, desteklerini artırabilecek her şeyin peşinde koşarak, oy verme merkezleri açıldığında ve oy sandıkları oylarla dolduğunda zaferi garantilemek için yeterli olacağını umuyorlar."
 AST_election_countdown:0 "Seçim Geri Sayımı"
 AST_election_countdown_desc:0 "Oy verme merkezlerinin açılmasına sadece günler kaldı.\n\n§W$AST_expected_election_winner_tt$§!"
 AST_election_season_cat:0 "Seçim Sezonu"
 AST_election_season_cat_desc:0 "Bir hükümet henüz yerine yerleşmişken, bir sonraki onun yerini almaya hazırlanır. Bu noktada kamuoyu desteğini etkilemek için yapılabilecek çok az şey vardır, ancak bu partilerin denemesini engellemeyecektir. Bitene kadar bitmez ve o gün sandıkta gelecektir."
 AST_electrical_grid_expansions:0 "Elektrik Şebekesi Genişletmeleri"
 AST_electrical_grid_expansions_desc:0 "[ROOT.GetFascistParty]'nin onlara fayda sağlayan politikalar izlemesi karşılığında, önde gelen iş dünyası figürleri partinin hedefleriyle uyumlu sanayi reformlarına yatırım yapmayı kabul ettiler.\n\nElektrik şebekemizi genişleterek, ithalata dayanmayan yerli enerji üretimini teşvik edebiliriz."
 AST_eminent_successors:0 "£BoP_right_texticon  Seçkin Halefler"
 AST_eminent_successors_desc:0 "Canberra Hava Felaketi kurbanlarından bazıları son derece saygın hükümet yetkilileriydi. Korkunç kaderlerini telafi etmenin bir yolu olmasa da, belki birkaç seçkin halefin atanması hükümeti istikrara kavuşturacak ve hem halkın hem de bakanların güvenini geri getirecektir."
 AST_ensure_cabinet_loyalty:0 "Kabine Sadakatini Sağla"
 AST_ensure_cabinet_loyalty_desc:0 "Gensoru önergesi tehdidi, kabinenin çoğunluğu mevcut hükümet lehinde oy kullandığı sürece hiçbir tehlike oluşturmaz. Kabinenin sadakatini sağlayacağız."
 AST_expand_iron_mining_tt:0 "Hem §Y$AST_exports_for_economic_recovery$§! hem de §Y$AST_within_reach$§! sahibi olmak, §Y$STATE_870$§!'in Pilbara bölgesinin sömürülmesini sağlayacak ve neredeyse tükenmez bir §YÇelik§! kaynağını serbest bırakacaktır. Bunu ekonomimizi güçlendirmek için kullanabiliriz."
 AST_expand_planned_extraction_pilbara_tt:0 "§Y$AST_planned_extraction$§!, §Y$STATE_870$§! eyaletinin Pilbara bölgesinin işletilmesini sağlayarak neredeyse tükenmez bir §YÇelik§! kaynağı ortaya çıkaracaktır. Bunu ekonomimizi beslemek için kullanabiliriz."
 AST_factory_conversions:0 "Fabrika Dönüşümleri"
 AST_factory_conversions_desc:0 "[ROOT.GetFascistParty]'nin onlara fayda sağlayan politikalar izlemesi karşılığında, önde gelen iş dünyası figürleri partinin hedefleriyle uyumlu sanayi reformlarına yatırım yapmayı kabul ettiler.\n\nSavunma sanayisine öncelik verilmeli ve bu nedenle Avustralya fabrikaları onu destekleyecek şekilde dönüştürülmelidir."
 AST_factory_investments:0 "Fabrika Yatırımları"
 AST_factory_investments_desc:0 "[ROOT.GetFascistParty]'nin onlara fayda sağlayan politikalar izlemesi karşılığında, önde gelen iş dünyası figürleri partinin hedefleriyle uyumlu sanayi reformlarına yatırım yapmayı kabul ettiler.\n\nHem askeri hem de sivil ikmallerin çatışma zamanlarında yeterli kalmasını sağlamak istiyorsak, endüstriyel kapasitemizi genişletmemiz gerekiyor."
 AST_final_reforms_effect_tt:0 "\n§Y$AST_final_reforms_mission$§! aktifken etkiler (§Y180§! gün):"
 AST_final_reforms_mission:0 "Nihai Reformlar"
 AST_final_reforms_mission_desc:0 "İstikrarlı liderlik, muhafazakar eğilimler ve İngiltere'ye sadakat yoluyla Birleşik Avustralya Partisi (UAP) desteğini güçlendirdi ve başka bir dönemi giderek daha olası hale getirdi. Kamuoyu desteğini korumak için liderleri reformları hızlandırmalıdır.\n\n§YAktifken etkiler:§!\n§W(§YDemokratik§! Odaklar):\n§Y7§! gün Tamamlanma Süresi düşüşü§!"
 AST_for_100_days:0 "Görevi Etkinleştirir: §Y$AST_insufficient_funds_mission$§!, §Y100§! günler\n için"
 AST_for_50_days:0 "Görevi Etkinleştirir: §Y$AST_insufficient_funds_mission$§!, §Y50§! günler için\n"
 AST_foreign_overlord_reclaim_foothold_in_target_mission:0 "[FROM.GetName]'de dayanak noktasını geri al"
 AST_foreign_overlord_reclaim_foothold_in_target_mission_tt:0 "Biz veya [?FROM.AST_communist_civil_war_enemy_country.GetName], [FROM.GetName]'in hiçbir eyaletini kontrol etmiyorsak:"
 AST_form_australasia:0 "Avustralasya'yı Kur"
 AST_form_australasia_australia_core_states_tt:0 "Tüm §Y[AST.GetNonIdeologyName]§! durumlarında çekirdek kazanın."
 AST_form_australasia_australia_required_states_tt:0 "Tüm §Y[AST.GetNonIdeologyName]§! durumlarını kontrol eder."
 AST_form_australasia_melanesia_core_states_tt:0 "Tüm §YMelanesia§! eyaletlerinde çekirdek kazanın."
 AST_form_australasia_melanesia_required_states_tt:0 "Tüm §YMelanesia§! durumlarını kontrol eder."
 AST_form_australasia_new_zealand_core_states_tt:0 "Tüm §Y[NZL.GetNonIdeologyName]§! eyaletleri üzerinde hak kazan."
 AST_form_australasia_new_zealand_required_states_tt:0 "Tüm §Y[NZL.GetNonIdeologyName]§! eyaletlerini kontrol eder."
 AST_government_formation_period:0 "Hükümet Kurma Dönemi"
 AST_government_formation_period_desc:0 "Her parti kendi politikalarına karar verme yetkisi ister, ancak belirli koşullar bunu gerektiriyorsa, bir ulusal birlik hükümeti en makul seçenek olabilir.\n\n§W§YAktifken etkiler:§!\n£GFX_trigger_yes $AST_election_recently_concluded$\n\n$AST_ruling_party$ bir §YUlusal Birlik Hükümeti§! kurabilir.\n\nAvustralya Odak Ağacı'nda bulunan Demokratik Seçimler penceresinde bir §YUlusal Birlik Hükümeti§! kurun.§!"
 AST_harland_wolff_mio_trigger:0 "Kararı tamamladı §Y$AST_refit_a_retired_british_carrier$§!, odaklamayla kilidi açıldı §Y$AST_royal_prestige$§!"
