 INS_revolution_planning_hq_DONE_desc:0 "Burası milislerimizin rapor verdiği devrimci karargahımız. Bu eyalet bağımsızlığımızı ilan ettiğimizde kontrolümüz altında olacak."
 INS_revolution_planning_hq_DONE_trigger_tt:0 "Sadece bir Karargah kurabilir"
 INS_revolution_planning_hq_desc:0 "Milis karargahımızı, takımadalar boyunca milis üslerimiz için merkezi komutanlığımız olarak faaliyet gösterecek olan [FROM.GetName] eyaletinde kuracağız. Karargahımız ve çevresindeki bölgeye sızma görevlerinde öncelik verilecek ve tamamen bizim kontrolümüz altında olacak."
 INS_revolution_planning_hq_tt:0 "En fazla §Y3§! devrim karargahı inşa etti"
 INS_revolution_planning_influence_state:0 "[FROM.GetName]'de Milis Üssü Kur"
 INS_revolution_planning_influence_state_desc:0 "Milislerimizi bir milis üssü kurmak için [FROM.GetName]'e göndereceğiz, böylece yerel devrimcilerin karargahla iletişim kurabilmelerini ve bağımsızlık ilan ettiğimizde operasyonları daha kolay yürütebilmelerini sağlayacağız."
