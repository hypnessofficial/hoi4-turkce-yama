 SIA_PROPAGANDA_CAMPAIGN_TT_LEFT:0 "[SIA_GetPropagandaCampaignEffects_Left]"
 SIA_PROPAGANDA_CAMPAIGN_TT_RIGHT:0 "[SIA_GetPropagandaCampaignEffects_Right]"
 SIA_appeal_for_support_cat:0 "Destek Başvurusu"
 SIA_appeal_for_support_cat_desc:0 "Hiçbir siyasi hareket tek başına başarılı olamaz. Monarşistler, anayasacılar, askerler ve siviller ülkenin bir bölümü üzerinde nüfuz sahibidir. Zamanı geldiğinde harekete geçme gücüne sahip olmak istiyorsak, destekleri dikkatlice geliştirilmelidir."
 SIA_appeal_to_industrialists:0 "Sanayicilere Başvur"
 SIA_appeal_to_industrialists_tt:0 "Sanayicilerden destek alacağız.\n\nBize iç savaşta yardım edecekler ve ek teçhizat sağlayacaklar. Ancak gücü ele geçirdikten sonraki §Y720 gün§! içinde iç savaşın sonunda sahip olduğumuz fabrikalara ek olarak §Y2§! §YSivil Fabrika§! (Odaklardan veya ticaretten kazanılan fabrikalar hariç) inşa ederek endüstriyel tabanımızı genişletmemizi bekleyecekler.\n\nBunu yapmamak §Yİstikrar§! ve §YSavaş Desteği§!'ne darbe vuracaktır.\n\nİç savaşın başlamasıyla şunları elde edeceğiz: "
 SIA_appeal_to_navy_clique:0 "Donanma Kliğine Başvur"
 SIA_appeal_to_navy_clique_countdown:0 "Donanma Reformlarını Uygula"
 SIA_appeal_to_navy_clique_tt:0 "Donanma Kliğinden destek alacağız.\n\nİç savaşta bize yardım edecekler, tüm donanmamızı ve bir deniz piyadesi tümenini bize verecekler. Ancak gücü ele geçirdikten sonraki §Y720 gün§! içinde §Y$SIA_thonburi_class_coastal_defense_ship$§! odağını tamamlayarak faydalı donanma politikaları geçirmemizi bekleyecekler.\n\nBunu yapmamak §Yİstikrar§! ve §YSavaş Desteği§!'ne darbe vuracaktır.\n\nİç savaşın başlamasıyla şunları elde edeceğiz:\n§YTüm Donanmamız§!\n§YTayland Kraliyet Deniz Piyadeleri§! Deniz piyadesi tümeni\n§YDeniz Piyadeleri§! teknolojisi"
 SIA_appeal_to_rural_people:0 "Kırsal Halka Başvur"
 SIA_appeal_to_rural_people_tt:0 "Kırsal Halktan destek alacağız.\n\nBize iç savaşta yardım edecekler ve milisler sağlayacaklar. Ancak karşılığında, gücü ele geçirdikten sonraki §Y720 gün§! içinde §Y$SIA_mechanization_of_agriculture$§! veya §Y$SIA_reduction_of_agricultural_yield_taxes$§! odaklarından birini tamamlayarak faydalı tarım politikaları geçirmemizi bekleyecekler.\n\nBunu yapmamak §Yİstikrar§! ve §YSavaş Desteği§!'ne darbe vuracaktır.\n\nİç savaşın başlamasıyla şunları elde edeceğiz: "
 SIA_army_navy_reform_cat:0 "Ordu ve Donanma"
 SIA_army_navy_reform_cat_desc:0 "Ordu ve donanma aynı sınırlı kaynak havuzu için rekabet eder. İki branş arasında fon kaydırmak sürekli bir dengeleme eylemidir ve her bir yeniden tahsisin diğerinin hazırlığı için sonuçları vardır."
 SIA_asian_democratic_compact_cat:0 "Asya Demokratik Paktı"
 SIA_asian_democratic_compact_cat_desc:0 "Asya halkları kendi kendilerini yönetme hakkına sahiptir. Asya'nın kendi kaderini tayin etme hakkının sancaktarı olarak, sömürge güçlerine ellerinde tuttukları ulusları serbest bırakmaları için baskı yapabiliriz."
 SIA_blood_of_suphan:0 "Suphan'ın Kanı"
 SIA_celebrating_the_constitution:0 "Anayasayı Kutlamak"
 SIA_cultivate_civilian_wing:0 "Sivil Kanatla İlişkileri Güçlendir"
 SIA_cultivate_civilian_wing_desc:0 "Kraliyet Sarayı Bürosu Direktifi'nin statükonun nezdinde bize kazandırdığı itibar, sivil kanatla sabırlı ve sürdürülebilir bir yakınlaşmanın kapısını aralıyor. Tepki çekecek ani bir kayırmacılık yok, sadece Pridi'nin grubunu her seferinde bir taviz vererek yavaş ve istikrarlı bir şekilde kazanma çalışması var. Bu uzun bir yol, ancak istediğimiz kadar yürüyebiliriz."
 SIA_cultivate_military_wing:0 "Askeri Kanatla İlişkileri Güçlendir"
 SIA_cultivate_military_wing_desc:0 "Kraliyet Sarayı Bürosu Direktifi'nin statükonun nezdinde bize kazandırdığı itibar, askeri kanatla sabırlı ve sürdürülebilir bir yakınlaşmanın kapısını aralıyor. Tepki çekecek ani bir kayırmacılık yok, sadece subay kadrosunu her seferinde bir taviz vererek yavaş ve istikrarlı bir şekilde kazanma çalışması var. Bu uzun bir yol, ancak istediğimiz kadar yürüyebiliriz."
