 AST_scorch_the_north:0 "Kuzeyi Yak"
 AST_scorch_the_north_desc:0 "Kuzeyden bir istila şüpheleniyorsak, böyle ilerlemeleri engellemenin yolları vardır, ancak bunların bir bedeli vardır. Kuzey eyaletlerimizin gelişimi yanık toprak politikasıyla gerilese de, saldırganları uzak tutmak için gereken şey bu olabilir."
 AST_scorch_the_north_tt:0 "§YBir Kuzey eyaleti denizden istila edildiğinde oluşacak etkiler:§!"
 AST_seize_civilian_industry:0 "Sivil Sanayiye El Koy"
 AST_seize_civilian_industry_desc:0 "Tüketim malları hem vatandaşlarımız hem de ekonomimiz için bir gereklilik olsa da, savaş zamanının daha büyük gereklilikleri beraberinde getirdiği gerçeğinden kaçış yoktur. Savaş geliyor; geldiğinde hazırlıklı olacağız."
 AST_seize_local_control_tt:0 "Komünistler eyaletin kontrolünü ele geçirerek, bir iç savaşa girmemiz durumunda eyaletin bizim tarafımızda olmasını sağlarlar.\n"
