 AST_prospect_pilbara_iron_decision:0 "Pilbara Bölgesini Madenciliğe Aç"
 AST_prospect_pilbara_iron_decision_desc:0 "Pilbara bölgesi, dünyada bulunan en büyükler arasında yer alan muazzam demir cevheri rezervlerine sahiptir. Ancak, ülkenin bu son derece uzak bölgesinde, bu kaynağa ulaşmak için gereken yatırım muazzam olacaktır... ama diğer yandan kârlar da öyle olacaktır."
 AST_protector_of_the_indies:0 "Hint Adaları'nın koruyucusu"
 AST_protector_of_the_indies_desc:0 "Avrupa'da çatışmaların alevlenmesinden bu yana [HOL.GetNameDef], Endonezya kolonisinin savunmasıyla ilgilenemeyecek kadar kendi topraklarının savunmasıyla meşgul oldu. [INS.GetNameDef]'nin olası düşüşü, diğer tüm Güneydoğu Asya uluslarının kaderini pekala belirleyebilir ve koloninin kendisinin eline bırakılamaz. \n\n[HOL.GetNameDefCap] de, durumun ciddiyeti göz önüne alındığında, koloninin [AST.GetNameDef] tarafından daha iyi savunulacağının farkındadır."
