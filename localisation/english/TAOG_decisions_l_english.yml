 INS_instigate_in_country_desc:0 "Devrimimiz, son sömürgeci asker [ROOT.GetAdjective] toprağından sürüldüğünde sona ermedi. [FROM.GetName]'deki işçiler ve köylüler, bizim atıp kurtulduğumuz aynı boyunduruğun altında acı çekiyorlar ve şimdi bize zalimin yenilebileceğinin bir kanıtı olarak bakıyorlar. Ajitatörlerimizi onların arasına göndereceğiz, broşürler dağıtacağız, sendikalarını finanse edeceğiz ve devrim koşulları olgunlaşana kadar hoşnutsuzluk alevlerini körükleyeceğiz."
