 INS_gradual_escalation_HOL:0 "Kademeli Tırmanma"
 INS_gradual_escalation_HOL_desc:0 "İkametgahlarımızdan gelen raporlar her geçen hafta daha da kötüleşiyor. İsyancılar faaliyette olmadıkları düşünülen bölgelerde saldırıyor ve Batavia'daki askeri komuta daha önce denenmiş olanlardan daha ağır önlemler alınması için baskı yapıyor. Lahey'de, bir zamanlar sabır tavsiye edenler her kabine toplantısında azalıyor."
 INS_gradual_escalation_republic:0 "Kademeli Tırmanma"
 INS_gradual_escalation_republic_desc:0 "Hollanda misillemeleri her baskınımızdan sonra daha da ağırlaştı ve devriyeleri aylar önce terk ettikleri bölgelere baskı yapıyor. Komutanlarımız uzun zaman önce çözüldüğü düşünülen yerlerde daha çetin çatışmalar yaşandığını ve kayıplarımızın asker alanların yerlerine yenilerini koyabileceğinden daha hızlı arttığını bildiriyor. Çatışma geçen yıl sessiz olan bölgelere yayıldı."
