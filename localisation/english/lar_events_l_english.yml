 SPB_alfonso_king:0 "XIII. Alfonso"
 SPB_alfonso_king2:0 "XIII. Alfonso, uzun yıllar sürgünde kaldıktan sonra İspanyol tahtına geri döndü ve sonunda iki veraset hattını birleştirerek bir asırlık kan dökülmesine son verdi"
