 france.10.e:0 "Mücadeleye Devam Et"
 france_continue_the_fight_tt:0 "Bize onurumuzla teslim olmak için bir şans daha verilmeyecek. Eğer kaybedersek, metropol Fransa'nın tamamı işgal edilecek."
 lar_align_belgium.1.a:0 "Kabul etmekten başka çaremiz yok."
 lar_align_belgium.1.b:0 "1914'te boyun eğmedik ve şimdi de eğmeyeceğiz!"
 lar_align_belgium.1.desc:0 "Fransızca konuşan bazı vatandaşlarımızın maskeli haydutlar tarafından sokaklarda saldırıya uğradığı bir dizi olayın ardından, Fransız büyükelçisi bugün [This.GetLeader]'e çağrıda bulunarak hükûmetinden bir nota sundu; bu notada sınırlarımızdaki Fransız topluluğunu koruyamadığımız açıkça belirtildiği için, Fransız hükûmetinin bunu bizim yerimize yapmayı görevi saydığı belirtiliyor. Bu amaçla, ülkemizde asker bulundurma ve Fransız Jandarması'nın sınırlarımız içinde soruşturma yürütme hakkı da dahil olmak üzere geniş bir dizi hak verilmesini talep ediyorlar.\n\nNotada, bu hakları vermeyi reddetmenin, en ağır sonuçlara yol açacak düşmanca bir eylem olarak kabul edileceği belirtiliyor."
 lar_align_belgium.1.t:0 "Fransa Özel Haklar Talep Ediyor"
 lar_align_belgium.2.a:0 "Akıllıca bir seçim yaptılar."
 lar_align_belgium.2.desc:0 "[From.GetAdjective] kabinesi, birkaç üye oy vermektense istifa etse de, teklifimizi oybirliğiyle kabul etti. Bir askeri irtibat birimi ve küçük bir memur grubu, [From.GetAdjective] yetkilileriyle koordine olmak için şimdiden Brüksel'e doğru yola çıktı."
 lar_align_belgium.2.t:0 "[From.GetNameDefCap] Boyun Eğiyor"
 lar_align_belgium.3.a:0 "Bunu göreceğiz."
 lar_align_belgium.3.b:0 "Belçika tek bir kurşuna veya tek bir damla kana değmez."
 lar_align_belgium.3.desc:0 "Notamıza diplomatik olarak yanıt vermek yerine, [From.GetAdjective] hükûmeti orduyu tam hazır duruma geçirmeyi ve sınırı kapatmayı emretmiş görünüyor. Brüksel'deki gazeteler, zafer olasılıkları konusunda gerçekçi olsalar da, Waterloo Savaşı'na göndermelerle dolu ve eğer işgal edersek Fransız kuvvetleri için utanç verici bir yenilgi öngörüyorlar."
 lar_align_belgium.3.t:0 "[From.GetNameDefCap] Savaşmaya Yemin Ediyor"
 lar_appeal_to_overseas_territories.10.desc:0 "Adanın valisi vatandaşlarına sakin kalmaları ve Vichy'deki meşru hükûmetin emirlerini takip etmeleri için çağrıda bulundu. Adada pek bir hoşnutsuzluk olmadığı, çoğu sakinin bu emre uyduğu görülüyor."
 lar_appeal_to_overseas_territories.10.t:0 "Madagaskar Vichy'de Kalıyor"
 lar_appeal_to_overseas_territories.11.desc:0 "Madagaskar valisi, adadaki askeri üsleri bizim ve müttefiklerimizin kuvvetlerine teklif etti ve herhangi bir saldırıya karşı güvence altına almak için daha fazla destek istedi."
 lar_appeal_to_overseas_territories.11.t:0 "Madagaskar Taraf Değiştiriyor"
 lar_appeal_to_overseas_territories.12.desc:0 "Kampımızdaki pek az kişi Kuzey Afrika'daki Vichy gücünün kalesinin taraf değiştireceğine dair bir umut beslese de, reddin şiddeti yine de oldukça şok ediciydi. [This.GetLeader]'i bir hain ve bir deli olarak etiketleyen yerel vali, Vichy hükûmetini gerekli her yolla desteklemeye yemin etti."
 lar_appeal_to_overseas_territories.12.t:0 "Kuzey Afrika Vichy'de Kalıyor"
 lar_appeal_to_overseas_territories.13.desc:0 "Sürpriz bir gelişmeyle, Fransız Kuzey Afrikası'nın yerel valisi orduya bir dizi açık sözlü Vichy yanlısı yetkiliyi tutuklama emri verdi ve [This.GetLeader]'in yeni hükûmetine desteğini taahhüt etti."
 lar_appeal_to_overseas_territories.13.t:0 "Kuzey Afrika Taraf Değiştiriyor"
 lar_appeal_to_overseas_territories.2.a:0 "Bir korkak ve bir hain."
 lar_appeal_to_overseas_territories.2.desc:0 "Hindiçin'in yerel valisi, hükûmetimizi desteklemek için taraf değiştirmeyi düşünmeyi bile resmen ve alenen reddetti. Koloniye yaptığı bir radyo konuşmasında, aynı zamanda 'bu durumu tek taraflı ve sorumsuzca değiştirmek için hareket etmeye çalışan' herhangi bir gruba karşı sert bir baskı uygulanacağını duyurdu."
 lar_appeal_to_overseas_territories.2.t:0 "Hindiçin Vichy'de Kalıyor"
 lar_appeal_to_overseas_territories.3.a:0 "Harika!"
 lar_appeal_to_overseas_territories.3.desc:0 "Hindiçin valisi, Vichy'deki hükûmetin anayasal olarak meşrulaştırılmadığını ve açıkça baskı altında hareket ettiğini belirterek [This.GetLeader]'e desteğini ilan etti. Ancak bölgedeki askeri kuvvetler büyük ölçüde Vichy hükûmetine sadık kaldı ve şu anda onların geri gönderilmesini sağlayacak bir düzenleme müzakere ediliyor."
 lar_appeal_to_overseas_territories.3.t:0 "Hindiçin [This.GetLeader] Lehine Beyanda Bulunuyor"
 lar_appeal_to_overseas_territories.4.desc:0 "Suriye'deki yerel yönetici çağrımızı tamamen görmezden gelmeyi seçti. Bazı kaynaklar kapalı kapılar ardında kısa bir tartışma olduğunu belirtiyor, ancak sonuçta radyo çağrısı veya davamızı desteklemek için atılan adımlar hakkında resmi bir yorum yapılmadı."
 lar_appeal_to_overseas_territories.4.t:0 "Suriye Vichy'de Kalıyor"
 lar_appeal_to_overseas_territories.5.desc:0 "Suriye'de düşük profilli bir darbe olmuş gibi görünüyor, sömürge yönetimindeki birkaç kilit figür vali tarafından tutuklandı. Daha sonra [This.GetLeader]'e bağlılığını ilan etti ve tüm vatansever Fransızları şimdi anavatanımızı işgal eden düşmana karşı silahlanmaya çağırdı."
 lar_appeal_to_overseas_territories.5.t:0 "Suriye [This.GetLeader] Lehine Beyanda Bulunuyor"
 lar_appeal_to_overseas_territories.6.a:0 "Hepsi bir araya gelse adam denmeye layık değil!"
 lar_appeal_to_overseas_territories.6.desc:0 "Orta Afrika mülklerimizin sömürge yöneticileri, [This.GetLeader]'in radyo çağrısını topluca kınayarak, bunu meşru hükûmetin otoritesini baltalamayı amaçlayan bir ihanet eylemi olarak nitelendirdi. Kaynaklar, daha bağımsız fikirli bazı kişilerin özgürleşme girişiminde bulunması durumunda destek eksikliğinden endişe ederek, taraf değiştirmeleri halinde yerli halkın tepkisinden korktuklarını gösteriyor."
 lar_appeal_to_overseas_territories.6.t:0 "Orta Afrika Vichy'de Kalıyor"
 lar_appeal_to_overseas_territories.7.desc:0 "Yönetici Félix Éboué liderliğinde, orta Afrika kolonileri davamıza katıldı. Yerel halk arasında askere alma çalışmaları şimdiden başladı."
 lar_appeal_to_overseas_territories.7.t:0 "Orta Afrika Taraf Değiştiriyor"
 lar_appeal_to_overseas_territories.8.desc:0 "Batı Afrika'daki yerel yöneticiler bizim tarafımıza geçmeyi genel olarak desteklese de, bölgedeki Avrupalı nüfusun önemli bir kısmının desteklemediği görülüyor. Kamuoyu baskısının artmasıyla, yerel valiler Vichy hükûmetine desteklerini alenen ilan etmek zorunda kaldılar."
 lar_appeal_to_overseas_territories.8.t:0 "Batı Afrika Vichy'de Kalıyor"
 lar_appeal_to_overseas_territories.9.desc:0 "Batı Afrika'daki topraklarımızın yerel yöneticileri hâlâ [This.GetLeader]'in çağrısına nasıl yanıt vereceklerini tartışırken, bölgedeki vatansever vatandaşlar harekete geçmeyi ve sömürge hükûmet görevlerini devralmayı seçtiler. Bölge şimdi bizim kontrolümüz altında."
 lar_appeal_to_overseas_territories.9.t:0 "Batı Afrika [This.GetNameDef] Lehine Beyanda Bulunuyor"
 lar_arms_purchases.1.a:0 "Kesinlikle!"
 lar_arms_purchases.1.b:0 "Kesinlikle hayır!"
 lar_arms_purchases.1.desc:0 "Avrupa'daki hızla kötüleşen durumu dikkate alan Fransız yetkililer, ağır silahlar ve modern uçaklar için ihracat lisansları almak üzere bize ulaştı ve bu lisanslar verilir verilmez fabrikalarımızda siparişler verilecek. Siparişlerin toplam hacmi ekonomide belirgin bir fark yaratmak için çok düşük olsa da, yine de oldukça fazla iş yaratacaktır."
 lar_arms_purchases.1.t:0 "[From.GetNameDefCap] Silah Satın Almak İstiyor"
 lar_arms_purchases.2.a:0 "Eğer gereken buysa."
 lar_arms_purchases.2.desc:0 "Başkan [From.GetLeader]'in desteğiyle, ABD Senatosu ABD fabrikalarında silah siparişleri vermemize izin veren geniş kapsamlı bir yasa tasarısını geçirdi, ancak finansman seçeneklerini keskin bir şekilde kısıtladı. ABD'deki izolasyonist kanat, Büyük Savaş sırasında biriktirdiğimiz devasa borçların ABD'nin Almanya'ya savaş ilan etmesine neden olduğuna hâlâ ikna olmuş durumda, bu yüzden bu silahlar için nakit para ödememizi sağlamak konusunda çok hevesli görünüyorlar."
 lar_arms_purchases.2.t:0 "[From.GetNameDefCap] Kabul Ediyor"
 lar_arms_purchases.3.a:0 "Bu ne cüret!"
 lar_arms_purchases.3.desc:0 "Geniş lobi faaliyetlerine ve birkaç müdahaleci senatörün desteğine rağmen, ABD'den askeri teçhizat için ihracat izni alma girişimlerimiz başarısız oldu. Kongre'deki izolasyonist lobi, herhangi bir silah satışının tam teşekküllü bir müdahaleye doğru ilk adım olacağından korkarak, konuyu gündeme getirme girişimlerini başarıyla engelledi."
 lar_arms_purchases.3.t:0 "[From.GetNameDefCap] Reddediyor"
 lar_bruneval_raid.1.a:0 "Savaşmanın ne kadar korkakça bir yolu."
 lar_bruneval_raid.1.desc:0 "Düşman baskını ile ilgili raporlar geldi ve küçük bir düşman kuvvetinin radar tesislerimizden birine saldırdığını gösteriyor. Garnizonun coşkulu ama sonuçta başarısız bir savunmasının ardından düşman kuvveti tesisi kısa bir süreliğine kontrol altına aldı ancak hemen ve şiddetle gerçekleştirilen bir karşı saldırı onları sahile geri sürdü ve aceleyle çıkarma gemisine binip ayrıldılar.\n\nRadar tesisinin kapsamlı bir incelemesi, bir dizi bileşenin çıkarıldığını ortaya koydu ve bir sayım, radar teknisyenlerinden birinin orada olmadığını, muhtemelen düşman akıncıları tarafından kaçırıldığını ortaya koydu."
 lar_bruneval_raid.1.t:0 "Düşman Komando baskınıyla radar ekipmanını ele geçirdi"
 lar_bruneval_raid.2.desc:0 "Düşman radar tesisine yapılan baskın tam bir başarıydı. Saldırı birimi paraşütten minimum dağılma ile başarılı bir şekilde iniş yaptı.\n\nEkipmanlarını toplayıp kendilerini yönlendirdikten sonra paraşütçüler hedefe doğru hareket ettiler ve zayıf garnizonu kısa ama şiddetli bir çatışmada yok ettiler. Alan güvence altına alındıktan sonra, saldırı gücüne eşlik eden radar teknisyeni radar ekipmanının fotoğraflarını çekti ve bize geri nakledilmek üzere seçilmiş bileşenleri söktü.\n\nUyarılan garnizonla ikinci bir çatışmanın ardından tahliye plajı temizlendi ve kuvvet, sorgulama için bir düşman radar teknisyenini de yanlarına alarak hatlarımıza geri nakledilmek üzere çıkarma gemisine bindi."
 lar_bruneval_raid.2.t:0 "Isırma Operasyonu başarılı"
 lar_capture_tito.1.a:0 "Bu sefer kaçtı."
 lar_capture_tito.1.desc:0 "Yugoslav partizan lideri Tito'yu yakalama veya öldürme operasyonumuz başarıyla sonuçlanmadı. İlk dalga hava indirme birlikleri Tito'nun saklandığından şüphelendiğimiz mağaraya yeterince yakın indi, ancak istihbaratımızın gözden kaçırdığı güçlü düşman birimlerinden ölümcül bir ateşle karşılaştılar. Birliklerimiz cesurca savaşırken, düşman takviyeleri beklenenden daha erken geldi. Umutsuz bir yarma girişimi bile başarılı olmadı. \n\nHayatta kalanlar dost hatlarına çekildi. Tito'nun şu anki nerede olduğu bilinmiyor."
 lar_capture_tito.1.t:0 "Rösselsprung Operasyonu Başarısız Oldu"
 lar_capture_tito.2.a:0 "Onu yakaladık."
 lar_capture_tito.2.desc:0 "Partizan lideri Tito'yu ortadan kaldırma operasyonumuz tam bir başarı oldu. Düşman bir saldırı beklese de, yakın hava desteği ve hava indirme birlikleri tarafından Tito'nun karargahına doğrudan bir saldırının birleşimi onları hazırlıksız yakaladı. Mağara karargahının içinde ve çevresinde şiddetli bir çatışmanın ardından, Tito'nun cesedi ölenler arasında bulundu."
 lar_capture_tito.2.t:0 "Rösselsprung Operasyonu Başarılı Oldu"
 lar_compensate_italy.1.a:0 "İttifakına sahip olacak."
 lar_compensate_italy.1.b:0 "O kadar kolay satın alınamayız."
 lar_compensate_italy.1.desc:0 "[From.GetLeader], uluslarımız arasındaki bazı önemli sorunları çözecek bir antlaşmanın şartlarını görüşmek üzere Roma'ya geldi. Büyük Savaş'ta paylaşılan fedakârlıklarla kutsanmış iki ulusumuzun uzun süredir devam eden kardeşliğine dikkat çekerek, savaş zamanlarında Fransa'nın yardımına geleceğimize dair güvenceler karşılığında Fransız limanı Cibuti'yi kontrolümüze devretmeyi teklif etti."
 lar_compensate_italy.1.t:0 "Fransa Sömürge Tazminatı Teklif Ediyor"
 lar_compensate_italy.2.a:0 "Ödenecek küçük bir bedel."
 lar_compensate_italy.2.desc:0 "[This.GetLeader], [From.GetLeader]'in önerilen antlaşmayı imzalamayı kabul etmesiyle İtalya'dan zaferle döndü. Geriye kalan tek şey, Doğu Afrika'daki mülklerimizi resmen İtalya'ya devretmek."
 lar_compensate_italy.2.t:0 "[From.GetLeader] Kabul Ediyor"
 lar_compensate_italy.3.a:0 "Buradan nereye gideceğiz?"
 lar_compensate_italy.3.desc:0 "İlk başarılara rağmen, [From.GetLeader]'in Cibuti'nin önerilen devrinden çok daha geniş kapsamlı tavizler beklediği anlaşıldığında İtalya ile müzakereler hızla kesildi."
 lar_compensate_italy.3.t:0 "[From.GetLeader] Reddediyor"
 lar_concessions_italy_tt:0 "İtalya'nın, Almanya'ya karşı ortak bir eylemi kabul etme olasılığı daha yüksek olacaktır"
 lar_concessions_to_italy.1.a:0 "Bu sözde Mihver'i daha beşikteyken boğabiliriz!"
 lar_concessions_to_italy.1.b:0 "[ITA.GetLeader]'in sözlerini tutacağına asla güvenilemez."
 lar_concessions_to_italy.1.desc:0 "[From.GetLeader] hükûmeti, İtalya'yı kendi tarafımıza çekmek ve Almanya ile İtalya arasında olası bir ittifakı önlemek için nabız yokladı. [ITA.GetLeader]'in desteği büyük olasılıkla bir tür taviz veya tazminat yoluyla satın alınmak zorunda kalacak. Doğu Afrika'daki mülklerimize bakarak, [From.GetAdjective], Almanya'yı kontrol altında tutmayı amaçlayan resmi bir ittifak karşılığında Cibuti ve Somaliland'ı İtalya'ya devretmeyi teklif ediyor."
 lar_concessions_to_italy.1.t:0 "Fransa, İtalya'ya Toprak Tazminatı Teklif Ediyor"
 lar_concessions_to_italy.2.a:0 "Mesajı gönderin."
 lar_concessions_to_italy.2.desc:0 "[From.GetAdjective] kabinesi teklifimizi kıl payı bir oyla onayladı. Diplomatik çevrelerde [ITA.GetLeader] ile ittifak kurmanın sonuçları hakkında önemli şüpheler kalsa da, şimdi ilerleyebilir ve ortak teklifimizi [ITA.GetAdjective]lere sunabiliriz."
 lar_concessions_to_italy.2.t:0 "[From.GetLeader] Kabul Ediyor"
 lar_concessions_to_italy.3.a:0 "Davamızı tek başımıza savunmak zorunda kalacağız."
 lar_concessions_to_italy.3.desc:0 "Teklifimiz [From.GetAdjective] kabinesinde herhangi bir destek bulamadı. [ITA.GetNameDef] ile bir ittifakın faydalı olacağı konusunda bir fikir birliği olmasına rağmen, [From.GetAdjective] hükûmeti bunu başarmak için toprak tavizleri fikrini kabul edemedi."
 lar_concessions_to_italy.3.t:0 "[From.GetLeader] Reddediyor"
 lar_concessions_to_italy.4.a:0 "Güzel sınırlar için her şey."
 lar_concessions_to_italy.4.b:0 "Satın alınamayız!"
 lar_concessions_to_italy.4.desc:0 "[ENG.GetNameDef] ve [FRA.GetNameDef] büyükelçileri, Stresa'da yapılan anlaşmaların onaylanması için yenilenen bir çabayı görüşmek üzere [This.GetLeader] ile bir araya geldi. Son diplomatik saldırılarının bir parçası olarak, şimdi Doğu Afrika'da toprak tavizleri sunuyorlar, hem Cibuti'yi hem de Somali'nin Britanyalı kısmını devrediyorlar.\n\nGerçek toprak devri, bir ittifak antlaşmasının onaylanmasına bağlı olacaktır."
 lar_concessions_to_italy.4.t:0 "Britanya ve Fransa Sömürge Anlaşması Teklif Ediyor"
 lar_concessions_to_italy.5.a:0 "Bu makul görünüyor."
 lar_concessions_to_italy.5.b:0 "Bu, çok fazla şey isterken çok az şey sunmaktır."
 lar_concessions_to_italy.5.desc:0 "[From.GetAdjective] büyükelçisi hükûmetinden bir nota verdi. Görünüşe göre [From.GetLeader], Stresa'da varılan ön anlaşmaları resmen onaylamak istiyor. Anlaşmayı tatlandırmak için, [From.GetAdjective] kabul etmemiz halinde bize Doğu Afrika'daki Fransız topraklarını teklif ediyor.\n\nDiplomatik çevrelerde, [From.GetAdjective]'in daha önce [ENG.GetAdjective]'e daha da büyük toprak tavizleri içeren ortak bir bildiri yayınlamak için yaklaştığı, ancak reddedildiği söylentileri dolaşıyor."
 lar_concessions_to_italy.5.t:0 "Fransa Sömürge Tavizleri Teklif Ediyor"
 lar_concessions_to_italy.6.a:0 "Bu işi halletmeliyiz."
 lar_concessions_to_italy.6.desc:0 "[From.GetAdjective] hükûmeti, önerdiğimiz toprak takasını prensipte kabul etti ve antlaşmanın nihai şartları üzerinde anlaşıldıktan sonra Stresa anlaşmasını onaylayacağına söz verdi. Daha ince ayrıntıların müzakeresi diplomatik servise bırakıldı ve nihai antlaşma daha sonraki bir tarihte onaylanacak. Toprak devri bu antlaşma imzalanana kadar gerçekleşmeyecek."
 lar_concessions_to_italy.6.t:0 "[ITA.GetLeader] Kabul Ediyor"
 lar_concessions_to_italy.7.a:0 "Bu bizi biraz zor durumda bırakıyor."
 lar_concessions_to_italy.7.desc:0 "[From.GetAdjective] hükûmeti, notamıza oldukça sert bir yanıtla, şu anda bir ittifak kurmak veya Stresa anlaşmasını onaylamakla ilgilenmediğini belirtiyor. Hiçbir toprak tavizinin bunu değiştirme olasılığının olmadığını iddia ediyorlar."
 lar_concessions_to_italy.7.t:0 "[ITA.GetLeader] Reddediyor"
 lar_congress_of_paris.1.a:0 "Tazminatımızı başka bir yerde alırız."
 lar_congress_of_paris.1.desc:0 "[This.GetLeader]'in daveti üzerine, [ITA.GetLeader], [SPA.GetLeader] ve [POR.GetLeader], Afrika'daki sömürge nüfuz alanlarıyla ilgili bir antlaşmayı görüşmek üzere Paris'e geldi. İmparatorluklarını genişletmekle ilgilenen ana güçler Fransa ve İtalya olduğundan, [SPA.GetNameDef] ve [POR.GetNameDef]'i ittifaka katılmaya ve bu hedeflere ulaşmak için savaşa girmeye ikna etmek için tavizler verilmesi gerekecektir.\n\n[POR.GetLeader] büyük olasılıkla Angola ve Mozambik'i birleştirme yönündeki uzun süredir devam eden plana destek sağlamaya çalışacakken, [SPA.GetLeader]'in desteği Fransız Kuzey Afrika topraklarının bir kısmını teslim ederek satın alınmak zorunda kalacak."
 lar_congress_of_paris.1.t:0 "Paris Kongresi"
 lar_congress_of_paris.2.a:0 "Afrika'daki bir İtalyan İmparatorluğu hayali biraz riske değer."
 lar_congress_of_paris.2.b:0 "Bunu desteklememiz için hiçbir neden yok."
 lar_congress_of_paris.2.desc:0 "Müzakerelerin ilk turunda Fransız heyeti, kıtanın tam ortadan basit bir şekilde bölünmesini teklif ederek bize Mısır, Sudan ve daha güneyde Kenya üzerinde hak iddiaları verdi. Teklif ayrıntıdan yoksun olsa da - ve çoğunlukla ikimizin de kontrol etmediği topraklarla ilgili olsa da - büyük bir Afrika imparatorluğunun fethi için Fransız desteği vaat ediyor."
 lar_congress_of_paris.2.t:0 "Afrika Haritasını Yeniden Çizmek"
 lar_congress_of_paris.3.a:0 "İyi iş."
 lar_congress_of_paris.3.desc:0 "[From.GetNameDef] heyeti, önerilen toprak değişikliklerini prensipte kabul etti. Hâlâ üzerinde çalışılması gereken birkaç küçük ayrıntı ve önerilen yeni sınırın tam yerinin hâlâ bazı tartışmalara konu olmasına rağmen, diplomatlarımız anlaşmayı rayından çıkarabilecek büyük bir sorun beklemiyor."
 lar_congress_of_paris.3.t:0 "[From.GetNameDefCap] kabul ediyor"
 lar_congress_of_paris.4.a:0 "Bize daha çok kalır."
 lar_congress_of_paris.4.desc:0 "[From.GetNameDef] heyeti müzakerelerin bittiğini ilan etti. Önerilen değişiklikler hakkında temel bir görüş ayrılığını gerekçe göstererek, [From.GetNameDef]'e dönmek üzere Paris'ten ayrıldılar.\n\n Aceleci ayrılışlarının ardından, [From.GetAdjective] büyükelçisi, [From.GetAdjective] hükûmetinin artık bizimle herhangi bir karşılıklı yardım veya ittifak antlaşmasına bağlı olmadığını beyan etti."
 lar_congress_of_paris.4.t:0 "[From.GetNameDefCap] reddediyor"
 lar_congress_of_paris.5.a:0 "Eğer bedelini ödemeye razılarsa, biz de üzerimize düşeni yapmaya hazırız."
 lar_congress_of_paris.5.b:0 "Hiçbir çöl, tek bir damla İspanyol kanına değmez."
 lar_congress_of_paris.5.desc:0 "Paris'teki diğer heyetler, ülkelerinin hiçbirinin aslında kontrol etmediği toprakları kimin alması gerektiği konusunda tartışırken, diplomatlarımız daha ulaşılabilir bir hedef için bastırıyorlar. Fransız hükûmeti, yaklaşan herhangi bir savaşta onları destekleme sözümüz karşılığında Fas'ı bize devretme teklifimize olumlu yaklaştığını belirtti. Bu, Kuzey ve Batı Afrika'daki topraklarımızı birbirine bağlayacaktır."
 lar_congress_of_paris.6.a:0 "Ödenecek küçük bir bedel."
 lar_congress_of_paris.6.b:0 "Çok şey istiyorlar, çok az şey sunuyorlar."
 lar_congress_of_paris.6.desc:0 "Sert gücümüzün eksikliği, Paris'teki diplomatlarımızın müzakereleri çok fazla etkilemesini zorlaştırsa da, bize yine de Angola ve Mozambik arasındaki toprakları alma desteği ve Güney Afrika'nın büyük bir bölümünü talep etme imkânı sunuldu. Görünüşe göre bu toprakları bize vermek, iki büyük gücün tüm antlaşmayı batırabilecek bir çatışmadan kaçınmasının bir yolu.\n\nAncak bunu kabul etmek, bizi kendi imparatorluklarını genişletme arayışlarında Fransa ve İtalya'nın yanında savaşmaya mecbur kılacaktır."
 lar_dominate_the_middle_east.1.a:0 "Bu yeni gerçeği kabul etmeliyiz."
 lar_dominate_the_middle_east.1.b:0 "Özgürlüğümüzü kazandık ve ondan bu kadar kolay vazgeçmeyeceğiz!"
 lar_dominate_the_middle_east.1.desc:0 "[From.GetLeader] hükûmeti Orta Doğu için yeni bir tam yetkili temsilci atadı. Bugün başkentimizde [This.GetLeader] ile görüşen Fransız temsilci, Fransız hükûmetinin bölgede daha aktif bir rol almak istediğini ve bölgedeki istikrarla ilgili tüm konularda doğrudan kendisine danışılmasını beklediğini belirtti. \n\nBunu reddetmenin sonuçlarını açık bırakırken, Fransız hükûmetinin hükûmetimizden bağımsız bir dış politikayı kabul etmesinin 'zor' olacağını belirtti."
 lar_dominate_the_middle_east.1.t:0 "Fransa Boyun Eğme Talep Ediyor"
 lar_dominate_the_middle_east.2.a:0 "Olması gerektiği gibi."
 lar_dominate_the_middle_east.2.desc:0 "Danışmanlarıyla yaptığı bir tartışmanın ardından, [From.GetLeader] taleplerimizi resmen kabul etti ve temsilcimizin, isteklerimize uygun olmalarını sağlamak için herhangi bir dış politika kararı hakkında danışmanlık yapmasına izin verdi."
 lar_dominate_the_middle_east.2.t:0 "[From.GetNameDefCap] Boyun Eğiyor"
 lar_dominate_the_middle_east.3.a:0 "O zaman ayakları üzerinde ölüm olsun."
 lar_dominate_the_middle_east.3.b:0 "Burası sadece işe yaramaz insanlarla dolu, işe yaramaz bir toprak parçası."
 lar_dominate_the_middle_east.3.desc:0 "[From.GetLeader], temsilcimize yaptığı uzun bir konuşmada, [From.GetAdjective] halkının uzun ve gururlu savaşçı geleneklerini övdü, hiçbir yabancı hükümdara asla boyun eğmediklerini, onları zorlama girişimlerine direneceklerini ve dizlerinin üzerinde yaşamaktansa ayaklarının üzerinde ölmeyi tercih edeceklerini açıkladı."
 lar_dominate_the_middle_east.3.t:0 "[From.GetNameDefCap] Meydan Okuyor"
 lar_end_the_occupation.1.a:0 "Onları kollarımızı açarak karşılıyoruz!"
 lar_end_the_occupation.1.b:0 "Görünüşe göre haddini aşan fikirleri var."
 lar_end_the_occupation.1.desc:0 "Birkaç yılın ardından, [From.GetLeader] hükûmeti 'Ulusal Devrim' programını resmen başarılı ilan etti. Bir radyo konuşmasında, eski Fransız siyasi sisteminin zayıflığı ve çöküşünün kökünün kazındığını ve yerine Fransa gibi asil ve savaşçı bir ulusa daha uygun yeni, yenilenmiş bir hükûmet sisteminin getirildiğini iddia etti.\n\nBu çabanın bir parçası olarak, hükûmeti Ateşkes tarafından kendisine getirilen yükümlülüklerin ve kısıtlamaların kaldırılmasını ve hükûmetinin tüm Fransız topraklarının tam kontrolüne yerleştirilmesini resmen talep etti.\n\nKarşılığında, iki ülkemizi bir nesilde ikinci kanlı savaşa sürükleyenleri cezalandırmak için savaşa yeniden katılmayı teklif etti."
 lar_end_the_occupation.1.t:0 "İşgalin Sonu"
 lar_end_the_occupation.2.a:0 "Onurumuzu geri kazandık."
 lar_end_the_occupation.2.desc:0 "[This.GetLeader] tarafından Çelik Paktı'nın imzalanmasının ardından, ülke genelindeki Alman birlikleri kontrolü Fransız kuvvetlerine devretti. Hem [From.GetLeader]'in hem de [This.GetLeader]'in katıldığı bir törenin ardından, Paris'in Alman garnizonu [From.GetAdjective] bayrağını indirdi ve şehri yıllar sonra ilk kez Üç Renkli Bayrak altında bırakarak şehirden ayrıldı."
 lar_end_the_occupation.2.t:0 "İşgal Sona Eriyor"
 lar_end_the_occupation.3.a:0 "[FRA.GetLeader] ile güçleri birleştirme zamanı geldi!"
 lar_end_the_occupation.3.b:0 "Bu hakarete çelik ve ateşle cevap vereceğiz!"
 lar_end_the_occupation.3.desc:0 "Bolşevik tehdidine karşı omuz omuza durma ve bu savaşı başlatan savaş çığırtkanlarının peşine düşme cömert teklifine rağmen, [From.GetLeader] diplomatik girişimimizi kabaca reddetti. Fransız halkının, şimdiye kadar savaşta herhangi bir savaş hüneri gösteremediğini ve [From.GetNameDef]'in batı sınırlarının savunmasını daha önce bir kez yenilmiş bir ülkeye emanet etmek için hiçbir neden görmediğini ilan etti."
 lar_end_the_occupation.3.t:0 "[From.GetLeader] Reddediyor"
 lar_end_the_occupation.4.a:0 "Sonunda akılları başlarına geldi."
 lar_end_the_occupation.4.b:0 "Neden korkaklara ve hainlere yardım edelim?"
 lar_end_the_occupation.4.desc:0 "Sürpriz bir gelişmeyle, [From.GetLeader]'in bir temsilcisi bize güçleri birleştirme teklifiyle yaklaştı. En sıkı gizlilik altında orduyu dikkatlice yeniden inşa ettikten sonra, [From.GetLeader] savaşa yeniden katılma ve anavatanı kurtarma zamanının geldiğine inanıyor.\n\nAncak, hükûmeti içindeki kaynaklarımız, işgal altındaki Fransız topraklarının iadesi için yapılan önceki bir müzakere girişiminin başarısız olmasının bu son hamlenin arkasındaki gerçek motivasyon olduğuna işaret ediyor."
 lar_end_the_occupation.4.t:0 "Vichy'den bir teklif"
 lar_end_the_occupation.5.a:0 "Harika."
 lar_end_the_occupation.5.desc:0 "[From.GetLeader]'e giden heyetimiz başarılı bir şekilde geri döndü - kendisi de eşliğinde. Yıllar sonra ilk kez Fransız toprağına ayak basan [From.GetLeader], iktidar devrinin kesin ayrıntılarını görüşmek üzere [This.GetLeader] ile bir araya geldi."
 lar_end_the_occupation.5.t:0 "[From.GetLeader] Kabul Ediyor"
 lar_end_the_occupation.6.a:0 "Hangi gerçek vatansever bir Fransız kardeşinin elini böyle iter?"
 lar_end_the_occupation.6.desc:0 "[This.GetLeader]'in bir insan, bir vatansever, bir asker ve bir vatandaş olarak çeşitli başarısızlıkları hakkında uzun bir dersin ardından, [From.GetLeader]'e giden heyetimiz eli boş geri gönderildi. Aynı gün ilerleyen saatlerde bir radyo mesajında, [From.GetLeader] hükûmetimizi alenen 'Fransız tarihinde toplanmış en büyük korkaklar ve hainler meclisi' olarak kınadı.\n\nAnavatanımızı geri kazanıp Almanlardan kurtaracaksak, bunu onların yardımı olmadan yapmak zorunda kalacağız."
 lar_end_the_occupation.6.t:0 "[From.GetLeader] Reddediyor"
 lar_fra_join_the_ententes.1.a:0 "Makul bir teklif."
 lar_fra_join_the_ententes.1.b:0 "Bu bizim çıkarlarımıza uygun değil."
 lar_fra_join_the_ententes.1.desc:0 "[From.GetAdjective] hükûmeti, ayrışan stratejik çıkarlarımızı uzlaştırmak için bir teklifle bize başvurdu. Kıtadaki diplomatik ve askeri yükümlülüklerine bağlı kalmayı planlarken, aynı zamanda dünyanın birçok yerindeki ortak çıkarlarımızın da farkındalar.\n\nBu nedenle teklifleri, çıkarlarımızın tehdit altında olduğunu görmemiz durumunda karşılıklı yardımı garanti edecek bir ittifaka katılmamızı öneriyor."
 lar_fra_join_the_ententes.1.t:0 "[From.GetNameDefCap] Stratejik İttifak Öneriyor"
 lar_fra_join_the_ententes.2.a:0 "İttifakımız güçleniyor."
 lar_fra_join_the_ententes.2.desc:0 "[From.GetAdjective] hükûmeti önerdiğimiz ittifakı tartıştı ve kabul etmeye karar verdi. İlgili diplomatik servislerimiz daha ince ayrıntıları tartışırken, ihtiyacımız olursa [From.GetNameDef]'in yardımımıza geleceğinden emin olabiliriz - yeter ki biz de onlar için aynısını yapmaya istekli olalım."
 lar_fra_join_the_ententes.2.t:0 "[From.GetNameDefCap] Teklifimizi Kabul Ediyor"
 lar_fra_join_the_ententes.3.a:0 "Dar görüşlü Aptallar!"
 lar_fra_join_the_ententes.3.desc:0 "Kapsamlı bir tartışmanın ardından, [From.GetAdjective] kabinesi teklifimizi reddetmek için kıl payı bir oylama yaptı. Resmi yanıtta, [From.GetNameDef] ile [This.GetNameDef] arasındaki bir ittifakın kaçınılmaz olarak [From.GetNameDef]'i, kasıtlı olarak kendini bağlamamaya karar verdiği ülkeleri savunmaya mecbur bırakacağı belirtiliyor. Kendi dış politikamızı seçmekte özgür olsak da, devam ediyor, daha büyük bir çatışmaya çekilmemiz durumunda [From.GetNameDef]'in yardımımıza gelmesini beklememeliyiz."
 lar_fra_join_the_ententes.3.t:0 "[From.GetNameDefCap] Teklifimizi Reddediyor"
 lar_france_french_union.10.desc:0 "Hindiçin'den gelen raporlar, Vietnam, Laos ve Kamboçya halkının en küçük farkla yeni Fransız Birliği'nin bir parçası olmak için oy kullandığını gösteriyor. Bu, yerel yöneticileri bile şaşırtmış görünüyor, çünkü hemen oyların yeniden sayılmasını emrettiler. Bölgedeki milliyetçi gruplar, morallerinin çökmesiyle ağır bir darbe aldı ve birçok üye, inandıkları gibi gerçekten halkın iradesini temsil edip etmediklerini açıkça merak ediyor."
 lar_france_french_union.10.t:0 "Hindiçin Birlik'e Katılma Yönünde Oy Kullandı"
 lar_france_french_union.11.desc:0 "Hindiçin'den gelen referandum sonuçları beklenenden daha kasvetli bir tablo çiziyor. Başkentte pek az kişi milliyetçi yuvaların birliğe katılmak için oy kullanacağına inansa da, milliyetçi duyguların daha önce inanıldığından çok daha yaygın olduğu görülüyor. Sonuç olarak, bölgenin hiçbir kısmı birliğe katılmak için çoğunluk sağlamadı. Milliyetçi aktivistler, bunun ulusal bağımsızlıklarını kazanma anı olduğuna inanarak, savaş pahasına bile olsa Fransa'dan derhal ayrılma çağrısında bulunuyorlar."
 lar_france_french_union.11.t:0 "Hindiçin Birlik'e Karşı Oy Kullandı"
 lar_france_french_union.2.a:0 "Kardeşliğin anlamını anlıyorlar!"
 lar_france_french_union.2.desc:0 "Birçok gözlemciyi şaşırtarak, Cezayir, Fas ve Tunus halkı, Fransız Birliği referandumunu kıl payı bir farkla onayladı. Bu bölgelerin sakinleri artık tam vatandaş olarak kabul edildiğinden, Ulusal Meclis'e bir dizi milletvekili göndermelerine izin veriliyor.\n\nHer üç ülkede de milliyetçi unsurlar hâlâ kalsa da, morallerine büyük bir darbe indirildi ve toparlanmaları en az bir nesil alacak."
 lar_france_french_union.2.t:0 "Kuzey Afrika Birlik'e Katılma Yönünde Oy Kullandı"
 lar_france_french_union.3.a:0 "Ne nankörlük!"
 lar_france_french_union.3.desc:0 "Yerel hükûmetlerin tüm çabalarına rağmen, Cezayir, Fas ve Tunus'taki seçmenler önerilen Fransız Birliği'ni ezici bir çoğunlukla reddetti. Sonuçların açıklanmasının hemen ardından, milliyetçi gruplar zaferlerinden faydalanarak ülkelerinin derhal ve tam bağımsızlığını talep etmek için bölgedeki birçok büyük şehirde büyük gösteriler düzenledi.\n\nKuzey Afrika'daki Fransız Kuvvetleri Komutanı, bazı daha radikal unsurların meseleleri kendi ellerine almaya teşebbüs etmesi muhtemel göründüğünden acil takviye talebinde bulundu."
 lar_france_french_union.3.t:0 "Kuzey Afrika Ayrılma Yönünde Oy Kullandı"
 lar_france_french_union.4.desc:0 "Haftalarca süren kampanyanın ardından, Batı Afrika'daki Fransız topraklarındaki insanlar, topraklarının yeni Fransız Birliği'nin bir parçası olup olmayacağına karar vermek için sandık başına çağrıldı. İlk sonuçlar, Birlik tarafı için sağlıklı bir çoğunluk gösteriyor. Milliyetçi dava, birçok bağımsızlık aktivistinin artık daha fazla siyasi özerklik mücadelesini Ulusal Meclis içinden sürdürmeye hazırlanmasıyla, henüz başlangıç aşamasındayken boğulmuş görünüyor."
 lar_france_french_union.4.t:0 "Batı Afrika Birlik'e Katılma Yönünde Oy Kullandı"
 lar_france_french_union.5.desc:0 "Yoğun ve bazen çalkantılı bir kampanyanın ardından, Fransız Batı Afrikası'nın çoğu bölgesinde Fransız Birliği üyeliği referandumunu milliyetçi tarafın kazandığı görülüyor. Yerel Avrupalılar sonucu sindirmeye çalışırken, yerel bağımsızlık hareketlerinin liderleri eylem çağrısında bulunarak sonucu tam bağımsızlık için açık bir yetki olarak ilan ettiler."
 lar_france_french_union.5.t:0 "Batı Afrika Ayrılma Yönünde Oy Kullandı"
 lar_france_french_union.6.desc:0 "Büyük, az gelişmiş bölgeden yavaş yavaş gelen sonuçlarla, seçmenlerin zayıf bir çoğunluğunun yeni Fransız Birliği'ne katılma referandumunu onayladığı görülüyor. Milliyetçi gruplar yenilgiyi kabul etti, ancak yeni devletin sadakat gösterisini ödüllendirmek için bölgenin geliştirilmesine daha fazla yatırım yapmasını talep etti."
 lar_france_french_union.6.t:0 "Orta Afrika Birlik'e Katılma Yönünde Oy Kullandı"
 lar_france_french_union.7.desc:0 "Fransız Orta Afrikası'ndaki Birlik yanlısı partiler, birbiri ardına bölgelerin yeni Fransız Birliği'ne katılmaya karşı oy vermesiyle bir dizi siyasi aksilik yaşadı. Bağımsızlık yanlısı partilerin zafer üstüne zafer kutlamasıyla, birçok aktivist bölgedeki Fransız hakimiyetinin kesin bir şekilde yenilgiye uğratıldığını iddia ediyor."
 lar_france_french_union.7.t:0 "Orta Afrika Ayrılma Yönünde Oy Kullandı"
 lar_france_french_union.8.desc:0 "Fransız mandası olan Suriye ve Lübnan, yeni Fransız Birliği'nin bir parçası olmak için oy kullandı. Birçok gözlemci bu sonucu en iyi ihtimalle olası görmese de, yerel halkın Fransız Birliği üyeliğinin Avrupa pazarlarına erişimi ve yerel ekonomiye daha fazla yatırımı garanti edeceğine inandığı görülüyor."
 lar_france_french_union.8.t:0 "Suriye Birlik'e Katılma Yönünde Oy Kullandı"
 lar_france_french_union.9.desc:0 "Bölgenin ezici bir çoğunlukla yeni Birlik'e katılmaya karşı oy verdiği anlaşıldığında, son Fransız Birliği referandumunun sonuçlarının açıklanması Şam ve Beyrut'ta yüksek sesli tezahüratlarla karşılandı. Ana milliyetçi partilerin referandumu şimdiden gizli bir bağımsızlık oylaması olarak ilan etmesiyle, yerel askeri komutan başkente takviye talep eden bir dizi rahatsız edici rapor gönderdi."
 lar_france_french_union.9.t:0 "Suriye Birlik'e Karşı Oy Kullandı"
 lar_france_political_violence.1.a:0 "Cumhuriyet buna katlanmalı."
 lar_france_political_violence.1.b:0 "Sorumluları yargılayın."
 lar_france_political_violence.1.desc:0 "Sağcı ve aşırı sağcı birliklerin gevşek bir ittifakı bugün Paris genelinde protestolar ve gösteriler düzenledi. Görünüşe göre protestocular hiçbir zaman barışçıl bir şekilde toplanıp dağılmayı planlamamışlardı. Sanki söylenmemiş bir sinyal verilmiş gibi, gösteriler yön değiştirdi ve Ulusal Meclis'e doğru yöneldi. Aceleyle çağrılan çevik kuvvet polisi, yürüyüş kollarını binanın görüş alanı içinde tutmayı başardı. Birkaç kez, gruplar polis hattına saldırdı ve ancak bir miktar çabayla geri püskürtüldü.\n\nProtestocular ancak gece yarısından sonra dağıldı. Ayaklanma haberleri yayıldı ve büyük olasılıkla halkın, hükûmetin kamu düzenini sağlama yeteneğine olan inancını sarsacak."
 lar_france_political_violence.1.t:0 "Protestolar Şiddete Dönüştü"
 lar_france_political_violence.2.desc:0 "İşçi sendikaları ve aydınlardan oluşan bir koalisyon, son siyasi kararlara yanıt olarak başkentte bir 'Eylem Günü' çağrısında bulundu. Polisin gösterileri kontrol altında tutma çabalarına rağmen, küçük anarşist ve komünist radikal gruplar bir isyan çıkarmaya teşebbüs etti. Çok sayıda dükkân yağmalandı ve tramvaylar devrildi. İsyancıların Ulusal Meclis'e erişimi engellemek için Rue Royale'de barikat kurma girişimleri atlı polis tarafından engellendi.\n\nİsyancılar Fransa geneline dağılırken ve işçiler tezgâhlarına geri dönerken, ülkedeki pek çok kişi hükûmetin hâlâ yasa ve düzeni sağlayıp sağlayamadığını merak ediyor."
 lar_france_political_violence.3.a:0 "Şimdi yapılacak herhangi bir eylem işleri daha da kötüleştirir."
 lar_france_political_violence.3.b:0 "Cumhuriyet galip gelecek!"
 lar_france_political_violence.3.desc:0 "Yakın zamanda alınan bir hükûmet kararının ardından, ülkenin dört bir yanından monarşistler ve sağcı aşırılık yanlıları, benzer bir isyanın parlamentoyu basmayı başaramadığı ancak hükûmeti istifaya zorladığı 1934'te 'yarım kalan işi bitirmek' amacıyla başkente akın etti.\n\nPolis, protestoların muhtemelen şiddete dönüşeceği konusunda önceden uyarılmış olsa da, bu iyi hazırlanmış grupların sergilediği örgütlenme ve saldırganlık düzeyine hazırlıksızdı. Birkaç olayda, Place de la Concorde'u koruyan polis, pozisyonlarını korumak için protestoculara ateş açmak zorunda kaldı.\n\nOnlarca ölü ve yüzlerce yaralıyla, protestocular yaralarını sarmak için başkentten çekildiler, ancak ülkeye hükûmetin kendi başkentinde bile güvende olmadığını göstermeyi başardılar."
 lar_france_political_violence.3.t:0 "Sağcı Ayaklanmalar"
 lar_france_political_violence.4.a:0 "Bu aşırılık yanlıları durdurulmalı."
 lar_france_political_violence.4.desc:0 "[This.GetLeader]'e olan halk desteğinin benzeri görülmemiş yüksekliklere çıktığı kısa bir sakinlik döneminin ardından, Komünistler ve Gerici gruplar arasındaki endemik siyasi şiddetin geri döndüğü görülüyor. Polis, insanlara veya iş yerlerine karşı siyasi güdümlü suçlarda rahatsız edici bir artış bildiriyor ve bu da geride bıraktığımızı düşündüğümüz kaotik günleri akla getiriyor."
 lar_france_political_violence.4.t:0 "Siyasi Şiddet Geri Dönüyor"
 lar_france_stresa_front_italy_agreed:0 "İtalya, toprak tavizleri karşılığında Stresa Cephesi'ne katılmayı kabul etti"
 lar_france_vichy_reunification.1.a:0 "Bu doğal olmayan bölünmeyi iyileştirme zamanı geldi."
 lar_france_vichy_reunification.1.b:0 "Bir hainin herhangi bir şey talep etmeye hakkı yoktur."
 lar_france_vichy_reunification.1.desc:0 "Paris'in kuvvetleri tarafından kurtarılmasının ardından, Sürgündeki Fransız Kuvvetleri lideri [From.GetLeader], hükûmetine Fransa'nın işgal edilmemiş tüm bölgeleri üzerinde tam yetki verilmesini talep etti. İktidarı devretmeyi reddetmenin, Cumhuriyetin meşru hükûmetine karşı silahlanma olarak muamele göreceğini söyledi."
 lar_france_vichy_reunification.1.t:0 "[From.GetLeader] Birleşme Talep Ediyor"
 lar_france_vichy_reunification.2.a:0 "Yeniden bir aradayız."
 lar_france_vichy_reunification.2.desc:0 "Vichy hükûmeti kendini feshetme ve hükûmet yetkisini bize devretme yönünde oy kullandı. Çoğu alt düzey memur yerinde kalmayı seçti ve kalan askeri kuvvetler komutamız altına girdi."
 lar_france_vichy_reunification.2.t:0 "Vichy Hükûmeti Dağılıyor"
 lar_france_vichy_reunification.3.a:0 "O zaman birliği zorla sağlayacağız."
 lar_france_vichy_reunification.3.desc:0 "[From.GetLeader] hükûmeti hükûmet yetkisini bize devretmeyi reddetti. Müzakereleri başlatma girişimleri sessizlikle karşılandı ve onları silah zoruyla zorlamak zorunda kalabiliriz."
 lar_france_vichy_reunification.3.t:0 "Vichy Hükûmeti Yerinde Kalıyor"
 lar_france_volunteers.1.a:0 "Harika mı?"
 lar_france_volunteers.1.desc:0 "[From.GetLeader] hükûmetinin İspanya ile [From.GetNameDef] arasındaki sınır kontrollerini gevşetme kararıyla, bizim tarafımızda savaşmak için bir gönüllü dalgası akmaya başladı.\n\nNe yazık ki, yeni politika evrensel olarak uygulanıyor, bu da savaştaki diğer fraksiyonların da ek destek görmesi muhtemel olduğu anlamına geliyor."
 lar_france_volunteers.1.t:0 "[From.GetNameDef]'den Gönüllüler"
 lar_france_volunteers.3.a:0 "Geri dönmelerine izin verin."
 lar_france_volunteers.3.b:0 "Onları geri gönderin."
 lar_france_volunteers.3.desc:0 "İspanya'daki çatışmaların sona ermesiyle, [From.GetLeader] için savaşmaya giden bazı insanlar geri döndü. Askeri istihbarat, deneyimlerinden herhangi birinin modern savaş hakkında bir fikir sunup sunmadığını görmek için onlarla görüşmek istiyor, ancak hükûmetteki birçok kişi onların diğer siyasi grupları radikalleştirmeye devam edebileceğinden endişe ediyor."
 lar_france_volunteers.3.t:0 "Gönüllüler Geri Dönüyor"
 lar_franco_soviet_treaty.1.a:0 "1894 ruhu yaşıyor!"
 lar_franco_soviet_treaty.1.b:0 "İkimiz de diğerine etkili bir şekilde yardım edemeyiz."
 lar_franco_soviet_treaty.1.desc:0 "[From.GetLeader] hükûmeti, bir ittifak olasılıklarını görüşmek üzere Moskova'ya özel bir elçi gönderdi. [From.GetAdjective] teklifi uyarınca, [From.GetNameDef]'in kendini içinde bulduğu herhangi bir savunma savaşına girme sözü vereceğiz ve eğer bize saldırılırsa [From.GetNameDef] yardımımıza gelecek."
 lar_franco_soviet_treaty.1.t:0 "Fransa Karşılıklı Yardım Antlaşması Teklif Ediyor"
 lar_franco_soviet_treaty.2.a:0 "Bu yeterli olmalı."
 lar_franco_soviet_treaty.2.desc:0 "[From.GetAdjective] hükûmeti teklifimizi kabul etti, ancak Avrupa'nın siyasi manzarasını önemli ölçüde değiştirmek için savaşı asla bir önlem olarak kabul etmeyeceklerini vurguladı. Bu nedenle ittifakımız kesinlikle savunma amaçlı olacak ve her iki taraf da yalnızca bir üçüncü güç tarafından saldırıya uğramaları halinde diğerinin yardımına gelmeyi taahhüt edecek."
 lar_franco_soviet_treaty.2.t:0 "[From.GetNameDefCap] Kabul Ediyor"
 lar_franco_soviet_treaty.3.a:0 "İmkansız mı, sadece elverişsiz mi?"
 lar_franco_soviet_treaty.3.desc:0 "[From.GetAdjective] dışişleri bakanıyla yapılan soğuk bir toplantıda, büyükelçimize bizimle bir ittifak kurmanın [From.GetAdjective] çıkarına olmadığı bildirildi. Kendisine, Avrupa'nın coğrafi gerçeklerinin, [From.GetAdjective] birliklerinin topraklarımıza yapılacak herhangi bir saldırıda bizi etkili bir şekilde desteklemesini ve tam tersini imkansız kıldığı ve bu nedenle [From.GetAdjective] hükûmetinin böyle bir teklifi reddetmek zorunda kalacağı söylendi."
 lar_franco_soviet_treaty.3.t:0 "[From.GetNameDefCap] Reddediyor"
 lar_heavy_water.1.a:0 "Önemli bir aksilik."
 lar_heavy_water.1.desc:0 "Telemark'taki garnizon komutanı, Vemork hidroelektrik santralinin dün gece Ağır Su üretmek için kullanılan tesisleri yok eden feci bir patlama yaşadığını bildiriyor. Soruşturmalar hala devam ederken, mevcut kanıtlar seçkin bir düşman birimi tarafından sabotaj yapıldığını çok güçlü bir şekilde göstermektedir.\n\nAnlaşılan o ki, komandolar bölgeye paraşütle indi, şok edici derecede gevşek olan güvenliği istismar ederek tesise sızdı, depolama tanklarının yanına patlayıcılar yerleştirdi ve ardından patlayıcıların patlamasından sadece birkaç dakika önce geceye çekildi.\n\nHiçbir sivil kayıp bildirilmedi, bu da komutanın yerel direnişin baskından önceden haberdar olabileceği spekülasyonunu yapmasına yol açtı. Yerel garnizon şimdi bölgede bir tarama yapıyor, ancak hiçbir ipucu bulunamadı ve ekibin bölgeyi zaten tahliye ettiğini bekliyoruz."
 lar_heavy_water.1.t:0 "Telemark Ağır Su Tesisi Yok Edildi"
 lar_heavy_water.2.a:0 "Cesaret ve çalışma başarının temelidir."
 lar_heavy_water.2.desc:0 "Telemark'taki yerel temaslardan gelen raporlar, Gunnerside Operasyonu'nun tam bir başarı olduğunu gösteriyor. Paraşütle indikten sonra, ekip tüm muhafızlardan kaçınarak tesise başarıyla sızdı.\n\nEkipmanlarını toplayıp yönlerini bulduktan sonra, ekip hedefe doğru hareket etti ve zayıf garnizonu kısa ama şiddetli bir çatışmada yok etti. Bölge güvence altına alındıktan sonra, saldırı kuvvetine eşlik eden radar teknisyeni radar ekipmanının fotoğraflarını çekti ve bize geri taşınmak üzere seçilmiş bileşenleri söktü. Uyarılmış garnizonla ikinci bir çatışmanın ardından, tahliye sahili temizlendi ve kuvvet, sorgulanmak üzere bir düşman radar teknisyenini de yanına alarak hatlarımıza geri taşınmak üzere çıkarma gemilerine bindi."
 lar_heavy_water.2.t:0 "Gunnerside Operasyonu Başarılı Oldu"
 lar_intervention_in_greece.1.a:0 "Büyük beyinler benzer düşünür!"
 lar_intervention_in_greece.1.b:0 "Kendi stratejimizi kendimiz belirleyeceğiz."
 lar_intervention_in_greece.1.desc:0 "Fransız büyükelçisi, Doğu Akdeniz'deki ortak çıkarlarımıza işaret eden hükûmetinden bir nota verdi. [From.GetLeader] hükûmeti özellikle Girit adasını bir deniz üssü olarak edinmekle ilgileniyor gibi görünüyor, ancak aynı zamanda Yunanistan'da 'dost olmayan veya düşmanca' bir hükûmetin varlığının bölgedeki operasyonları çok daha zorlaştıracağını belirtiyor. Bu nedenle, [From.GetAdjective] hükûmeti, daha elverişli bir hükûmet kurmak veya toprakların yönetimini kendimiz devralmak için Yunanistan'a olası bir ortak müdahale konusunda nabzımızı yoklamak istiyor."
 lar_intervention_in_greece.1.t:0 "Fransa Yunanistan'a Müdahale Teklif Ediyor"
 lar_intervention_in_greece.2.a:0 "Gerekliliğin ortaya çıkması neredeyse kesin."
 lar_intervention_in_greece.2.desc:0 "[From.GetLeader], Roma'daki büyükelçimiz aracılığıyla en derin desteğini ifade eden ve görüşlerimize mutlak bir anlaşma beyan eden bir mesaj gönderdi. [From.GetAdjective] ordusuna, gereklilik ortaya çıkması halinde Yunanistan'a karşı ortak bir askeri harekat için planlar hazırlaması talimatı verildi."
 lar_intervention_in_greece.2.t:0 "[From.GetLeader] Kabul Ediyor"
 lar_intervention_in_greece.3.a:0 "Bu korkunun sesi."
 lar_intervention_in_greece.3.desc:0 "[From.GetAdjective] büyükelçisinden gelen oldukça sert bir notaya göre, hükûmeti şu anda Doğu Akdeniz'deki statükoyu değiştirmekle ilgilenmiyor, oradaki mevcut durumu askeri harekatın taşıyabileceği belirsizliklere tercih ediyor."
 lar_intervention_in_greece.3.t:0 "[From.GetLeader] Reddediyor"
 lar_low_stability_civil_war.1.a:0 "Bir Fransız Devrimi daha mı?"
 lar_low_stability_civil_war.1.desc:0 "Haftalarca süren ajitasyon ve gizli hazırlıkların ardından, birkaç Fransız şehrinde kitlesel grevler patlak verdi. Neredeyse anında, silahlı sözde 'İşçi Savunma Tugayları' kuruldu, bazı durumlarda isyancı ordu birimleri tarafından desteklendi. Hükûmete sadık kuvvetlere ülke genelinde çok sayıda kez ateş açıldı, isyancılar ve sadıklar arasındaki çatışmalar şiddetli silahlı çatışmalara dönüştü.\n\nİç düzenin giderek azalmasıyla, hükûmet ülkenin geniş bir bölümü üzerindeki kontrolünü etkili bir şekilde kaybetti."
 lar_low_stability_civil_war.1.t:0 "Komünist Ayaklanması!"
 lar_low_stability_civil_war.2.a:0 "Hepimiz bunun olacağını biliyorduk."
 lar_low_stability_civil_war.2.desc:0 "Gerici askeri subaylar ve zengin toprak sahiplerinden oluşan bir gizli örgüt, görünüşe göre hükûmete karşı bir askeri darbe hazırlamış. Bazılarının kimliği polis tarafından bilinirken, diğerleri henüz tespit edilmemişti. Soruşturma içinden sızan bir bilginin ardından, komplocular tüm komplo ortaya çıkmadan önce harekete geçmeye karar verdiler.\n\nDarbenin aceleci ve karışık doğası, istenen sürprizi elde edemediği anlamına geliyordu; birimler pozisyonda değildi ve yerel garnizonlar önceden uyarılmıştı. Sadık birlikler hızla hareket etti ve hükûmetimize yönelik bir kafa kesme saldırısını başarıyla engelledi, ancak bunu yapmak için ülkenin büyük bir bölümünü terk etmek zorunda kaldı. İsyanın yayılmasıyla, ülke tam ölçekli bir iç savaşa sürüklenmiş görünüyor."
 lar_low_stability_civil_war.2.t:0 "Gerici Ayaklanması!"
 lar_news.1.a:0 "Onaylayabileceğimiz bir zafer."
 lar_news.1.b:0 "Bu fanatikler orta çağda yaşamaya devam ediyor..."
 lar_news.1.c:0 "Mükemmel bir sonuç!"
 lar_news.1.desc_carlists:0 "Manuel Fal Conde yönetimindeki Karlist kuvvetler nihayet Falanjist ve Cumhuriyetçi düşmanlarını yendi ve İspanya üzerinde tam kontrolü sağladı. Cumhuriyetçi birliklerin izole cepleri, daha önce Cumhuriyetçi olan bölgelerde yerel Karlist kontrolünün uygulanmasını engelleyebilecek bir gerilla savaşı yürütmeye devam etse de, herhangi bir öneme sahip daha fazla koordineli direnişin ortaya çıkması olası değildir.\n\nKarlist Requetélerin cesareti ve fanatizmi zaferlerini sağlamada kilit rol oynadı ve aynı yüksek moral, savaş sonrası İspanyol yeniden yapılanma çabalarını karakterize ediyor. Ancak savaşın bitmesiyle birlikte, birçok Karlist sabırsızlıkla çabalarının ne zaman ödüllendirileceğini ve haklı Karlist talibinin nihayet İspanyol tahtına ne zaman çıkacağını bekliyor."
 lar_news.1.desc_falangist:0 "Uzun ve yorucu bir iç savaşın ardından, Emilio Mola yönetimindeki Milliyetçiler nihayet Karlist ve Cumhuriyetçi düşmanlarını yendi ve İspanya üzerinde tam kontrolü sağladı. Cumhuriyetçi birliklerin izole cepleri, daha önce Cumhuriyetçi olan bölgelerde yerel Milliyetçi kontrolünün uygulanmasını engelleyebilecek bir gerilla savaşı yürütmeye devam etse de, herhangi bir öneme sahip daha fazla koordineli direnişin ortaya çıkması olası değildir.\n\nUlus, savaşta harap olmuş şehirlerini ve endüstrisini yeniden inşa ederken, José Antonio Primo de Rivera yönetiminde sivil bir hükûmete geçiş için hazırlıklar yapılıyor. Mevcut dünya krizinde İspanyol emperyalist emellerinin ne şekilde tezahür edeceği henüz belli değil."
 lar_news.1.desc_franco:0 "Uzun ve yorucu bir iç savaşın ardından, Francisco Franco altında birleşen Milliyetçiler nihayet Cumhuriyetçi düşmanlarını yendi ve İspanya üzerinde tam kontrolü sağladı. Cumhuriyetçi birliklerin izole cepleri, daha önce Cumhuriyetçi olan bölgelerde yerel Milliyetçi kontrolünün uygulanmasını engelleyebilecek bir gerilla savaşı yürütmeye devam etse de, herhangi bir öneme sahip daha fazla koordineli direnişin ortaya çıkması olası değildir.\n\nUlus, savaşta harap olmuş şehirlerini ve endüstrisini yeniden inşa etmeye odaklanırken, Milliyetçilerin ideolojik birleşiminin dış politikaları üzerindeki etkilerinin ne olacağı ve aldıkları cömert dış askeri yardımın geri ödenip ödenmeyeceği henüz belli değil."
 lar_news.1.desc_franco_unified:0 "Son haftalarda muzaffer Milliyetçiler arasındaki çeşitli fraksiyonlar arasında gerilimlerin arttığı görüldü, ancak şimdi, inatçı liderlerin sürgünü ve siyasi partilerin zorla birleştirilmesiyle, Francisco Franco bu bölünmeleri onarmayı ve böylece kalan fraksiyonları kendi davasının arkasında birleştirmeyi başarmış görünüyor. Cumhuriyetçi birliklerin izole cepleri bir gerilla savaşı yürütmeye devam etse de, İç Savaş nihayet gerçekten sona ermiş sayılabilir.\n\nUlus, savaşta harap olmuş şehirlerini ve endüstrisini yeniden inşa etmeye odaklanırken, Milliyetçilerin ideolojik birleşiminin dış politikaları üzerindeki etkilerinin ne olacağı ve aldıkları cömert dış askeri yardımın geri ödenip ödenmeyeceği henüz belli değil."
 lar_news.1.desc_franco_uprising:0 "Milliyetçi dava içindeki farklılıkların üstesinden gelinemeyecek kadar büyük olduğu kanıtlandı, ancak uzun ve yorucu bir iç savaşın ardından Francisco Franco yönetimindeki Milliyetçiler nihayet Karlist ve Cumhuriyetçi düşmanlarını yendi ve İspanya üzerinde tam kontrolü sağladı. Cumhuriyetçi birliklerin izole cepleri, daha önce Cumhuriyetçi olan bölgelerde yerel Milliyetçi kontrolünün uygulanmasını engelleyebilecek bir gerilla savaşı yürütmeye devam etse de, herhangi bir öneme sahip daha fazla koordineli direnişin ortaya çıkması olası değildir.\n\nUlus, savaşta harap olmuş şehirlerini ve endüstrisini yeniden inşa etmeye odaklanırken, aldıkları cömert dış askeri yardımın geri ödenip ödenmeyeceği henüz belli değil."
 lar_news.1.e:0 "Talihsiz bir sonuç."
 lar_news.1.f:0 "¡La guerra ha terminado!"
 lar_news.1.t_anarchists:0 "İspanya İç Savaşı'nda Anarşist Zaferi"
 lar_news.1.t_carlists:0 "İspanya İç Savaşı'nda Karlist Zaferi"
 lar_news.1.t_falangist:0 "İspanya İç Savaşı'nda Falanjist Zaferi"
 lar_news.1.t_franco:0 "İspanya İç Savaşı'nda Milliyetçi Zaferi"
 lar_news.1.t_independent_communist:0 "İspanya İç Savaşı'nda POUM Zaferi"
 lar_news.1.t_republic:0 "İspanya İç Savaşı'nda Cumhuriyetçi Zaferi"
 lar_news.1.t_stalinist:0 "İspanya İç Savaşı'nda Stalinist Zaferi"
 lar_news.10.a:0 "Bizi artık ciddiye almak zorunda kalacaklar!"
 lar_news.10.b:0 "Onların dar görüşlülüğü savaşımızı tehlikeye atıyor!"
 lar_news.10.b_2:0 "Cumhuriyetçilere karşı zaferimizi riske mi atıyorlar?!"
 lar_news.10.c:0 "Bu umabileceğimizden daha iyi!"
 lar_news.10.c_2:0 "Zaferlerinde boğulsunlar!"
 lar_news.10.d:0 "İşler karmaşıklaşıyor..."
 lar_news.10.d_2:0 "Hiç bitmeyecek mi?!"
 lar_news.10.desc:0 "Giderek daha fazla kenara itilmekten ve Milliyetçi Cephe üzerindeki nüfuzlarının giderek daha fazla kısıtlanmasından endişe duyan Manuel Fal Conde yönetimindeki Karlist kuvvetler, Milliyetçi davayla olan bağlarını reddettiler. Kendi bağımsız isyanlarını ilan eden, ağırlıklı olarak ülkenin kuzeyindeki Karlist Requetéler, eski müttefiklerine karşı dönerken, aynı zamanda Cumhuriyetçi düşmanlarına karşı savaşa devam ediyorlar.\n\nİç savaştaki askeri konumları üzerindeki etkileri Milliyetçi liderlik tarafından küçümseniyor, ancak mevcut kaosun Cumhuriyetçilere bolca fırsat sunduğu aşikar."
 lar_news.10.desc_2:0 "Giderek daha fazla kenara çekilmekten ve savaş sonrası yeni kurulan Milliyetçi hükümet üzerindeki etkilerinin giderek daha da kısıtlanmasından çekinen Manuel Fal Conde yönetimindeki Carlist güçler, bu yeni hükümete verdikleri destekten vazgeçtiler. Yine bir başka ayaklanmada, ağırlıklı olarak ülkenin kuzeyinde bulunan Carlist Requetés, yeni bir rakip hükümet ilan ederek eski müttefiklerine sırt çevirdi.\n\nMilliyetçi liderler, Fal Conde'nin eylemlerini kınamakta hızlı davrandılar ve onu \"İspanya'yı bir başka iç savaşa sürüklemekle\" suçladılar, ancak Carlist yanıtlar, Milliyetçi liderliğin hareketi ortadan kaldırmaya yönelik sistemli girişimlerini gösterdi. Cumhuriyetçilerin yenilgisinden bu yana onlara kendilerini savunmaktan başka seçenek kalmıyor."
 lar_news.10.t:0 "İspanya İç Savaşı'nda Karlist Ayaklanması"
 lar_news.11.a:0 "Mükemmel, bırakın birbirlerini parçalasınlar!"
 lar_news.11.b:0 "Öyle ya da böyle, müdahaleleri sona erecek."
 lar_news.11.b_2:0 "Milliyetçilere karşı zaferimizi riske mi atıyorlar?!"
 lar_news.11.c:0 "Boyunduruğu atma zamanı şimdi!"
 lar_news.11.d:0 "Cumhuriyetçilerin kaybetmek için dış yardıma pek ihtiyacı yok..."
 lar_news.11.desc:0 "Kuzeydoğu İspanya'daki çoğunlukla bağımsız hareket eden Anarşist komünler üzerinde merkezi kontrolü yeniden sağlama yönündeki sürekli hükûmet girişimleri ve Stalinistlerin muhalif komünist görüşleri bastırması, şimdi Cumhuriyetçi cephede tam teşekküllü iç çatışmalara yol açtı.\n\nBaşlangıçta sokak çatışmaları ve milislerle hükûmet veya Stalinist güçler arasında düşük ölçekli çatışmalarla sınırlı olan, her iki tarafın da uzlaşmaya yanaşmaması, çatışmanın sadece birkaç gün içinde hızla tırmandığı anlamına geliyordu. Bu iç tehditle başa çıkmak için askeri kaynakların yeniden tahsis edilmesi, Milliyetçilere karşı cephe hatlarının belirgin şekilde zayıfladığı anlamına geliyor."
 lar_news.11.desc_2:0 "Kuzeydoğu İspanya'daki çoğunlukla bağımsız hareket eden Anarşist komünler üzerinde merkezi kontrolü yeniden sağlama yönündeki sürekli hükûmet girişimleri ve Stalinistlerin muhalif komünist görüşleri bastırması, şimdi İspanya İç Savaşı'nın Cumhuriyetçi galipleri arasında tam teşekküllü iç çatışmalara yol açtı.\n\nBaşlangıçta sokak çatışmaları ve milislerle hükûmet veya Stalinist güçler arasında düşük ölçekli çatışmalarla sınırlı olan, her iki tarafın da uzlaşmaya yanaşmaması, çatışmanın sadece birkaç gün içinde hızla tırmandığı anlamına geliyordu. Fraksiyon liderleri uzlaşmayı düşünmeyi reddederken ve savaş hatları çizilirken, İspanya bir başka iç savaşa sürüklenmeye mahkum görünüyor."
 lar_news.11.t:0 "İspanya İç Savaşı'nda Anarşist Ayaklanması"
 lar_news.12.a:0 "Müttefiklerimiz olmalı."
 lar_news.12.b:0 "Onları aramıza hoş karşılıyoruz."
 lar_news.12.c:0 "O zaman onları da yeneceğiz."
 lar_news.12.d:0 "Taraflarını seçtiler."
 lar_news.12.desc:0 "Hala iç savaştan toparlanma sürecinde olmasına rağmen, [From.GetNameDef] şimdi şaşırtıcı bir şekilde [From.GetFactionName]'e giriş için müzakere etti. Görünüşe göre, Milliyetçilerin iç savaş sırasında aldığı büyük ölçekli Mihver yardımı, yeni [From.GetAdjective] hükûmeti ile yabancı destekçileri arasında daha yakın bağlarla sonuçlanmadı."
 lar_news.12.t:0 "[From.GetNameDefCap] [From.GetFactionName]'e Katılıyor"
 lar_news.13.desc:0 "Hala iç savaştan toparlanma sürecinde olmasına rağmen, [From.GetNameDef] şimdi şaşırtıcı bir şekilde [From.GetFactionName]'e giriş için müzakere etti. İş birliği zaten iç savaş sırasında başlamıştı, bu sırada [From.GetNameDef], [From.GetFactionName]'den kapsamlı askeri yardım aldı ve görünüşe göre bu, daha yakından bağlantılı bir geleceğin sadece başlangıcını müjdeledi."
 lar_news.14.a:0 "Akıllıca bir karar verdiler."
 lar_news.14.b:0 "Başka seçeneğimiz yoktu."
 lar_news.14.c:0 "Alçaklar BİZİM toprağımızı veriyor!"
 lar_news.14.d:0 "Ve bir anda Kuzey Afrika'yı kaybettik..."
 lar_news.14.desc:0 "Haftalarca süren amansız [SPA.GetAdjective] baskısıyla karşı karşıya kalan ve dün verilen son bir ültimatomla doruğa ulaşan [From.GetAdjective] hükûmeti, komşularıyla barışı korumak adına taleplere boyun eğmekten ve Kuzey Afrika üzerindeki kontrolü bırakmaktan başka bir çare göremedi."
 lar_news.14.e:0 "Fırsatı değerlendiriyorlar."
 lar_news.14.t:0 "[SPA.GetNameDefCap] Fransız Kuzey Afrikası'nı Talep Ediyor"
 lar_news.15.a:0 "Yakında büyük bir güç doğacak!"
 lar_news.15.b:0 "Fransa için güzel bir gelecek bekliyor!"
 lar_news.15.c:0 "Bu, güç dengesinde büyük bir sarsıntı olurdu!"
 lar_news.15.desc:0 "[SPB.GetNameDef] ve [FRA.GetNameDef]'deki ikiz monarşist hareketler bir süre önce iktidara geldiğinden beri, Franko-İspanyol ilişkileri sıkılaştı ve dış politikaları giderek daha fazla iç içe geçti.\n\nŞimdi, [FRA.GetNameDef]'deki Meşrutiyetçi hareketin Kral [SPB.GetLeader]'i Fransız tahtının haklı talibi olarak resmen adlandırmasının ardından, kendisi resmi bir bildiri yayınlayarak Fransız tacını üstlenme niyetini duyurdu. Buna karşılık, [FRA.GetNameDef]'deki Meşrutiyetçi hükûmet Reims katedralinde görkemli bir taç giyme töreni için hazırlıklara başladı."
 lar_news.15.t:0 "Franko-İspanyol Birliği"
 lar_news.16.a:0 "İberya Birliği olması gerektiği gibi yeniden!"
 lar_news.16.b:0 "İberya yeniden birleşti mi? İlginç."
 lar_news.16.desc:0 "[SPB.GetAdjective] hükûmetinden aylarca süren baskının ardından, [POR.GetNameDef], izole edilmiş, müttefiksiz ve ezici bir [SPB.GetAdjective] ordusuyla karşı karşıya kalarak, [SPB.GetLeader]'in [POR.GetAdjective] tahtı üzerindeki iddialarını kabul etmekten başka bir alternatif göremedi. Sonuç olarak, ulus şimdi genişleyen [SPB.GetNameDef] ulusunda sadece bir ildir."
 lar_news.16.t:0 "İberya Birliği"
 lar_news.17.b:0 "Ne kadar iyi onlar için."
 lar_news.17.t:0 "İspanyol Monarşisi Yeniden Kuruldu"
 lar_news.18.a:0 "Sonunda haklı devlet başkanımıza bir dönüş!"
 lar_news.18.b:0 "Ama gözle görülür bir değişiklik getirecek mi?"
 lar_news.18.desc:0 "Francisco Franco'nun iktidarı bırakıp İspanya'nın haklı Kralı'nın geri dönüşünü ilan etmesinden aylar sonra, [From.GetSPBkingloc] nihayet bu sabah Madrid'e girdi. Coşkulu izleyiciler tarafından alkışlanan kraliyet alayı, Madrid sokaklarından San Jerónimo el Real kilisesine doğru ilerledi.\n\nGörkemli bir törenle, [From.GetSPBking2loc].\n\nUlusun büyük bir kısmı hala harabe halinde olsa da, belki yeni Kral birleştirici ve iyileştirici bir güç olarak hizmet edebilir ve [From.GetNameDef]'i daha görkemli bir geleceğe yönlendirebilir."
 lar_news.19.a:0 "Ortak çıkarlarımızı savunmanın en iyi yolu budur."
 lar_news.19.b:0 "Cesur bir hamle."
 lar_news.19.desc:0 "Bugün, [From.GetNameDef], dünyadaki büyük güç bloklarına bir alternatif olarak durabilecek yeni bir Latin güçleri ittifakının kurulduğunu duyurdu. Aylarca süren müzakerelere rağmen, yeni örgüte hangi ulusların katılmayı seçeceği tam olarak belli değil, ancak uzmanlar tarafından önerilen isimler arasında [POR.GetNameDef], [FRA.GetNameDef] ve [ITA.GetNameDef] yer alıyor."
 lar_news.19.t:0 "Latin Bloku"
 lar_news.2.a:0 "Bu 'zaferin' sürmesine izin verilemez!"
 lar_news.2.b:0 "Yerleşik komünizm biçimlerine ilginç bir alternatif."
 lar_news.2.c:0 "En azından Stalin'in uşakları değiller."
 lar_news.2.d:0 "Bu komünizm trajedisinin gelişmesine izin verilemez!"
 lar_news.2.desc_anarchists:0 "Uzun ve yorucu bir iç savaşın ardından, İspanyol Anarşistleri nihayet Cumhuriyetçi ve Milliyetçi düşmanlarını yendi ve İspanya üzerinde tam kontrolü sağladı. Milliyetçi birliklerin izole cepleri, daha önce Milliyetçi olan bölgelerde barışçıl komünlerin kurulmasını engelleyebilecek bir gerilla savaşı yürütmeye devam etse de, herhangi bir öneme sahip daha fazla koordineli direnişin ortaya çıkması olası değildir.\n\nÇeşitli komünler savaşta harap olmuş köylerini, kasabalarını, şehirlerini ve endüstrilerini yeniden inşa etmeye odaklanırken, görünüşe göre çeşitli dünya liderlerinin Anarşist zafere tepkilerindeki giderek artan düşmanca söylemlere yanıt olarak, savaş zamanı Bölgesel Savunma Konseyi altında örgütlenmeye devam etmeyi seçtiler."
 lar_news.2.desc_independent_communist:0 "Uzun ve yorucu bir iç savaşın ardından, İspanyol bağımsız komünistleri nihayet Cumhuriyetçi ve Milliyetçi düşmanlarını yendi ve İspanya üzerinde tam kontrolü sağladı. Milliyetçi birliklerin izole cepleri, daha önce Milliyetçi olan bölgelerde yerel Komünist kontrolünün uygulanmasını engelleyebilecek bir gerilla savaşı yürütmeye devam etse de, herhangi bir öneme sahip daha fazla koordineli direnişin ortaya çıkması olası değildir.\n\nYeni İspanyol komünist devleti, ulus savaşta harap olmuş şehirlerini ve endüstrisini yeniden inşa etmeye odaklanırken, [SOV.GetNameDef] ile tüm bağlarını zaten kopardı, ancak hem Stalinizmi hem de Troçkizmi reddeden tüm komünist partileri bağımsız bir yol çizmek için onlara katılmaya davet etti."
 lar_news.2.desc_republic_no_help:0 "Uzun ve yorucu bir iç savaşın ardından, İkinci Cumhuriyet nihayet Anarşist ve Milliyetçi düşmanlarını yendi ve İspanya üzerinde tam kontrolü sağladı. Milliyetçi birliklerin izole cepleri, daha önce Milliyetçi olan bölgelerde yerel Cumhuriyetçi kontrolünün uygulanmasını engelleyebilecek bir gerilla savaşı yürütmeye devam etse de, herhangi bir öneme sahip daha fazla koordineli direnişin ortaya çıkması olası değildir.\n\nTüm zorluklara karşı ve asgari Sovyet yardımına dayanarak, İspanyol Cumhuriyeti hem iç hem de dış düşmanlar tarafından kuşatılmışken demokratik bütünlüğünü koruyabildi. Ulus, savaşta harap olmuş şehirlerini ve endüstrisini yeniden inşa etmeye odaklanırken, demokratik bir İspanya'nın mevcut dünya krizinde ne yapacağı henüz belli değil."
 lar_news.2.desc_republic_soviet_help:0 "Geniş Sovyet yardımıyla, İkinci Cumhuriyet nihayet Anarşist ve Milliyetçi düşmanlarını yendi ve İspanya üzerinde tam kontrolü sağladı. Milliyetçi birliklerin izole cepleri, daha önce Milliyetçi olan bölgelerde yerel Cumhuriyetçi kontrolünün uygulanmasını engelleyebilecek bir gerilla savaşı yürütmeye devam etse de, herhangi bir öneme sahip daha fazla koordineli direnişin ortaya çıkması olası değildir.\n\nUlus, savaşta harap olmuş şehirlerini ve endüstrisini yeniden inşa etmeye odaklanırken, ulus üzerindeki Sovyet baskısı artıyor ve demokratik İspanyol hükûmetinin demokratik ilkelerine sadık kalıp kalamayacağı veya Batı Avrupa'daki Moskova nüfuzunun sadece bir karakolu haline gelip gelmeyeceği henüz belli değil."
 lar_news.2.desc_stalinist:0 "Uzun ve yorucu bir iç savaşın ardından, İkinci Cumhuriyet nihayet Anarşist ve Milliyetçi düşmanlarını yendi ve İspanya üzerinde tam kontrolü sağladı. Milliyetçi birliklerin izole cepleri, daha önce Milliyetçi olan bölgelerde yerel Cumhuriyetçi kontrolünün uygulanmasını engelleyebilecek bir gerilla savaşı yürütmeye devam etse de, herhangi bir öneme sahip daha fazla koordineli direnişin ortaya çıkması olası değildir.\n\nİç savaş, İspanya'nın geniş Sovyet yardımı sağlayan bir komünist hükûmete barışçıl geçişini gördü. Ulus, savaşta harap olmuş şehirlerini ve endüstrisini yeniden inşa etmeye odaklanırken, İspanyol-Sovyet bağları sadece güçleniyor gibi görünüyor ve Sovyetler Birliği'nin savaş sonrası endüstriyel kurtarma programlarına yoğun bir şekilde dahil olması bekleniyor."
 lar_news.2.e:0 "Etkileyici bir zafer!"
 lar_news.2.f:0 "En azından kazanan Faşistler olmadı."
 lar_news.2.g:0 "Mümkün olan en iyi sonuç."
 lar_news.2.h:0 "[SOV.GetAdjective]'in [SPD.GetNameDef] üzerindeki nüfuzu endişe verici..."
 lar_news.20.a:0 "¡Por la libertad!"
 lar_news.20.b:0 "İntikamımız hızlı ve korkunç olacak!"
 lar_news.20.c:0 "Ne kadar da uygun. ¡Buena suerte, España!"
 lar_news.20.d:0 "Yağmurdan kaçarken doluya tutulmak..."
 lar_news.20.desc:0 "Son aylarda [SOV.GetAdjective]-[SPD.GetAdjective] ilişkileri giderek gerginleşti ve bağımsız gözlemciler komünistlerin [SPD.GetAdjective] nüfuz konumlarından sistematik olarak uzaklaştırıldığını fark etti. Buna yanıt olarak [SOV.GetNameDef], inatçı [SPD.GetAdjective] hükümetine diz çöktürmeye çalışarak ülkenin doğusunda doğrudan bir işgal bölgesi oluşturdu.\n\nŞimdi bu durum [SPD.GetLeader]'nin ateşli bir yayın yaparak doruğa ulaştığını ilan etti: [SPD.GetAdjective] bağımsızlığını kazanmak ve yurttaşlarını \"ülkeyi Sovyet etkisinden sonsuza kadar kurtarmak\" için bir araya getirmek. Aynı zamanda işgal bölgesine büyük bir [SPD.GetAdjective] sürpriz saldırı başladı."
 lar_news.20.t:0 "[SPD.GetAdjective] Bağımsızlık Savaşı"
 lar_news.21.a:0 "Lekesiz Marksist dünyaya liderlik edeceğiz."
 lar_news.21.b:0 "Aşağılık!"
 lar_news.21.c:0 "İlginç bir teklif!"
 lar_news.21.d:0 "Komünist dava daha da bölünüyor!"
 lar_news.21.desc:0 "[From.GetAdjective]'nin gücü arttıkça, hükümet artık Marksizmin hem Troçkist hem de Stalinist yorumlarına karşı çıkan Uluslararası Devrimci Sosyalist Birlik Bürosu adında yeni bir komünist ittifakın kurulduğunu duyurmayı uygun gördü.\n\nLondra'da ikamet eden bağımsız komünist örgütlerden oluşan bir komite olan \"Londra Bürosu\" ile başlayarak, artık tüm ulusları kucaklıyorlar. saflarına katılmak için \"dışarıdan müdahale olmaksızın komünist idealler için bir yol arzulayanlar\"."
 lar_news.21.t:0 "Londra Bürosu'nu Birleştirmek"
 lar_news.22.a:0 "Çok şey başardık, ama en kötüsüne hazırlanmalıyız!"
 lar_news.22.b:0 "Yaşam tarzımıza varoluşsal bir tehdit oluşturuyorlar!"
 lar_news.22.desc:0 "İspanya İç Savaşı'nın sona ermesinden bu yana bir süre geçmesine rağmen, İberya'daki Anarşist komünlerin beklenen çöküşü gerçekleşmedi. Tam tersine, komünlerin bölgeyi istikrara kavuşturmayı ve yeniden inşa etmeyi başardığı ve dünya genelindeki ülkelerden benzer düşüncelere sahip göçmenleri çekmeye devam ettiği bildirildi.\n\nDevam eden uluslararası düşmanlığın ışığında komünler, kendi \"savunma konseyi\" altında örgütlenmeyi sürdürmeyi ve kapsamlı silahlanma programlarını sürdürmeyi seçtiler."
 lar_news.22.t:0 "Anarşizm Başarılı Oldu"
 lar_news.23.a:0 "Şimdi birlikte savaşacağız."
 lar_news.23.b:0 "Onlar sadece bizim için daha fazla yem."
 lar_news.23.c:0 "Özgürlük için birlikte savaşacağız!"
 lar_news.23.d:0 "İberya ulusları nihayet birlikte çalışıyor..."
 lar_news.23.desc:0 "[POR.GetAdjective] ve [?global.POR_iberian_summit_spanish_tag.GetAdjective] politikacıları, [ENG.GetAdjective] hükûmetine başvurarak ve [ENG.GetFactionName]'e kabul edilmeyi arayarak birlikte çalışıyorlar. Sadece yabancı tehditlere karşı koruma mı arıyorlar yoksa Demokrasi mücadelesine gerçekten katılmaya istekli mi oldukları henüz belli değil. \n\nAncak, durumu değerlendirdikten sonra, [ENG.GetNameDefCap] bunun kendi çıkarları için faydalı olacağına karar verdi ve nihayet İberya uluslarının ittifaka katılmasına izin verdi."
 lar_news.23.t:0 "İberya ulusları [ENG.GetFactionName]'e katılıyor"
 lar_news.24.a:0 "Doğru tarafı seçtik."
 lar_news.24.b:0 "Düşmanlarımız şimdi yok olacak!"
 lar_news.24.c:0 "Şeytanla iş birliği yapıyorlar."
 lar_news.24.d:0 "İberya ulusları nihayet birlikte çalışıyor..."
 lar_news.24.desc:0 "[POR.GetAdjective] ve [?global.POR_iberian_summit_spanish_tag.GetAdjective] politikacıları, [GER.GetAdjective] hükûmetine başvurarak ve [GER.GetFactionName]'e kabul edilmeyi arayarak birlikte çalışıyorlar. Bunun yeni topraklar elde etmek için fırsatçı bir manevra mı yoksa sadece işgalden kaçınmak için umutsuz bir girişim mi olduğu henüz belli değil. \n\nAncak, durumu değerlendirdikten sonra, [GER.GetNameDefCap] bunun kendi çıkarları için faydalı olacağına karar verdi ve nihayet İberya uluslarının ittifaka katılmasına izin verdi."
 lar_news.24.t:0 "İberya ulusları [GER.GetFactionName]'e katılıyor"
 lar_news.25.a:0 "Bu sadece başlangıç."
 lar_news.25.b:0 "İlginç bir gelişme..."
 lar_news.25.desc:0 "Bugün, Braganza Dükü Dom Duarte Nuno, Brezilya'daki Petrópolis Katedrali'nde Orléans-Braganza Prensesi Maria Francisca ile evlendi. Bu evlilik sadece Portekiz ve Brezilya Brigantine hanedanlarını barıştırmakla kalmadı, aynı zamanda Miguelistleri ve Liberal Braganzaları birleştirerek, Portekiz kraliyet ailesi arasındaki rekabetleri geride bıraktı ve her iki ülkede de monarşist duyguyu alevlendirdi. \n\nSöylendiğine göre, törenin ardından Dom Duarte, tanınmış Brezilyalı ve Portekizli kraliyetçi hanımefendiler ve beyefendilerle birkaç sohbete girdi ve burada 'restorasyon' ve 'Monarşi' kelimeleri açıkça telaffuz edildi."
 lar_news.25.t:0 "Brezilya'da Bir Kraliyet Düğünü"
 lar_news.26.a:0 "Yaşasın İmparator!"
 lar_news.26.b:0 "Yeniden başarısız olmak için yükselen bir İmparatorluk."
 lar_news.26.c:0 "Sadece büyüklük sanrıları..."
 lar_news.26.desc:0 "Portekiz ve Brezilya'da monarşinin restorasyonunun ardından, Portekiz Kralı ve Brezilya İmparatoru, her iki ülkenin yeniden birleşmesinin gerekliliğini ve potansiyel faydalarını tartışmak üzere birkaç toplantıya katıldı. \nSon Brezilya-Portekiz zirvesi sırasında uzun müzakerelerin ardından, hükümdarlar [POR.GetNameDef]'in resmi olarak yeniden kurulması konusunda anlaştılar. \n\nBugün, toplanan monarşist kalabalığın kutsamasıyla, [POR.GetLeader], Portekiz ve Brezilya İmparatoru olarak taç giydi. İmparator, tebaasına sadakatleri için teşekkür etti ve yönetimi altındaki tüm vatandaşlar adına hüküm süreceğini belirtti."
 lar_news.26.t:0 "Portekiz ve Brezilya İmparatorluğu"
 lar_news.27.a:0 "Bu sadece başlangıç."
 lar_news.27.b:0 "İberya halklarının iyi bir girişimi."
 lar_news.27.c:0 "Komünist tehdit veba gibi yayılıyor..."
 lar_news.27.d:0 "Gerçek hırslarını gizlemek için sadece süslü bir isim."
 lar_news.27.desc:0 "Portekizli ve İspanyol politikacılar son aylarda çok sayıda toplantı düzenlediler ve burada İberya'da her iki ulustan politikacılar tarafından yönetilen birleşik bir sol kanat devleti olma olasılığını tartıştılar. \n\nUzun bir hazırlık ve müzakere döneminin ardından, bugün Portekizli ve İspanyol liderler, İberyalı vatandaşların kolektif çıkarları en iyi temsil eden liderleri seçeceği ve serbestçe dolaşabilecekleri yeni bir devlet olan [POR.GetNameDef]'in kurulduğunu resmen belirttiler."
 lar_news.27.t:0 "İberya'nın Birleşmesi"
 lar_news.28.a:0 "En azından İç Savaş lehimize ilerledi."
 lar_news.28.b:0 "Çatışma henüz çözülmüş görünmüyor."
 lar_news.28.c:0 "Bırakın zaferlerinde birbirlerini parçalasınlar!"
 lar_news.28.d:0 "Karlistlerle uğraşmamız an meselesi..."
 lar_news.28.desc:0 "İspanya İç Savaşı, kalan Cumhuriyetçi güçlerin teslim olması veya saklanmasıyla sona ermiş gibi görünüyor. Milliyetçi liderlik bunu hemen fırsat bilip İç Savaşın sonunu ilan etse de, uzmanlar Milliyetçi fraksiyonun kendi içindeki sürekli büyüyen muhalefete işaret ediyor ve bunun sadece yeni bir aşamaya geçiyor olabileceğini savunuyor. Ortak bir düşmanın kaybıyla, bu anlaşmazlıkların Milliyetçilerin birliğini daha da parçalamasının çok muhtemel olduğunu düşünüyorlar.\n\nBir dereceye kadar Milliyetçi liderler ve halkın kendisi de bunu görüyor gibi görünüyor, çünkü İç Savaş sırasında Cumhuriyetçileri yenmek için kurulan milisler henüz dağıtılmadı ve bunun yerine komşularına karşı uyanık bir göz tutuyorlar."
 lar_news.28.e:0 "Hızla hareket etmeliyiz, yoksa Karlistler ve Falanjistler ulusumuzu tekrar parçalar!"
 lar_news.28.f:0 "Falanjistlerle uğraşmamız an meselesi..."
 lar_news.28.t:0 "İspanyol Cumhuriyetçiler Yenildi"
 lar_news.281.a:0 "Şanlı bir gün!"
 lar_news.281.b:0 "Bu İspanya için ne anlama gelecek?"
 lar_news.281.desc:0 "Yüzyıllar önce, Mağribiler reconquista'da İberya'dan sürüldü. Şimdi, [From.GetOldAdjective] kuvvetleri güney İberya'nın derinliklerine ilerledi ve yüzyıllar sonra ilk kez bölgede Mağribi yerleşimleri kurmaya başladı. [From.GetOldNameDefCap] bu nedenle, bir zamanlar tüm İberya'yı yöneten eski Sultanlığın mirasını geri alarak “[From.GetNameDefCap]” olarak bilinen yeni bir ulus olarak yeniden düzenlendi.\n\nEski Emevi Halifeliği, neredeyse tüm İslam dünyasını yönetiyordu; Batı'da İberya'dan Doğu'da İran'a kadar. Belki de [From.GetLeader], bu eski İmparatorluğu taklit etmeyi ve Orta Doğu, Kuzey Afrika ve Avrupa'nın dağınık halklarını yeniden birleştirmeyi arzuluyordur."
 lar_news.281.t:0 "Endülüs Restore Edildi!"
 lar_news.29.d:0 "Hükûmetle uğraşmamız an meselesi..."
 lar_news.29.desc:0 "İspanya İç Savaşı, kalan Milliyetçi güçlerin teslim olması veya saklanmasıyla sona ermiş gibi görünüyor. Cumhuriyetçi liderlik bunu hemen fırsat bilip İç Savaşın sonunu ilan etse de, uzmanlar Cumhuriyetçi fraksiyonun kendi içindeki sürekli büyüyen muhalefete işaret ediyor ve bunun sadece yeni bir aşamaya geçiyor olabileceğini savunuyor. Ortak bir düşmanın kaybıyla, bu anlaşmazlıkların İkinci Cumhuriyet'in birliğini daha da parçalamasının çok muhtemel olduğunu düşünüyorlar.\n\nBir dereceye kadar Cumhuriyetçi liderler ve halkın kendisi de bunu görüyor gibi görünüyor, çünkü İç Savaş sırasında Milliyetçileri yenmek için kurulan milisler henüz dağıtılmadı ve bunun yerine komşularına karşı uyanık bir göz tutuyorlar."
 lar_news.29.e:0 "Anarşistlerle uğraşmamız an meselesi..."
 lar_news.29.t:0 "İspanyol Milliyetçiler Yenildi"
 lar_news.291.a:0 "Kei whea mai!"
 lar_news.291.b:0 "Aloha!"
 lar_news.291.desc:0 "Hawai'i, Aotearoa, Tahiti ve Samoa adaları sıkı bir şekilde [From.GetOldAdjective] kontrolü altındayken, [From.GetLeader], ülkenin artık [From.GetNameDef] olarak bilineceğini ve tüm Pasifik halklarının haklı yurdu olduğunu ilan etti.\n\nTüm Polinezya dünyasında büyük bir sevinç var, hatta bazıları [From.GetLeader]'i, sadece iki yüzyıl önce Naha Kehaneti'ni yerine getiren Hawai Kralı Kamehameha'nın tek gerçek halefi olarak ilan edecek kadar ileri gidiyor."
 lar_news.291.new_zealand_desc:0 "Hawai'i, Aotearoa, Tahiti ve Samoa adaları sıkı bir şekilde [From.GetOldAdjective] kontrolü altındayken, [From.GetLeader], ülkenin artık [From.GetNameDef] olarak bilineceğini ve tüm Pasifik halklarının haklı yurdu olduğunu ilan etti.\n\nSömürgeci sömürünün uzun tarihi göz önüne alındığında, yerli Māori, [From.GetOldAdjective] hükûmetine herhangi bir sadakat veya destek taahhüdünde bulunmaktan genellikle çekinmiştir, ancak Kiwi ve Māori liderleri arasında Ratana İttifakı'nın imzalanmasından ve Māori'nin hükûmet içinde artan temsilinden bu yana, [From.GetNameDef], sömürge sonrası çok kültürlülük için bir model ulus haline geldi."
 lar_news.291.t:0 "Polinezya Birleşti!"
 lar_news.3.a:0 "Yakında bizim için de gelecekler."
 lar_news.3.b:0 "Afrika'nın sınırlarını yeniden çizme zamanı."
 lar_news.3.c:0 "Kıta için yeni bir bölünme."
 lar_news.3.desc:0 "[FRA.GetNameDef], [ITA.GetNameDef], [POR.GetNameDef] ve [SPA.GetNameDef] temsilcileri arasındaki kapsamlı görüşmelerin ardından Paris Kongresi, [FRA.GetLeader]'nin sonucu \"Fransız diplomasisinin yazılı anlamda en büyük başarısı\" olarak nitelendirmesiyle Afrika sınırlarını yeniden çizmeye karar verdi. tarih\".\n\nDiğer sömürgeci güçlerin hükümetleri, anlaşmayı \"kıtadaki barışa ve iyi düzene yönelik bir tehdit\" olarak nitelendirerek, anlaşmayı kınamakta hızlı davrandılar.\n\nHenüz onlara sahip olmayan ülkelere geniş toprak parçaları tahsis eden anlaşmayla, Paris'te hazırlanan planın kan dökülmeden uygulanması pek olası değil."
 lar_news.3.t:0 "Paris Kongresi"
 lar_news.4.a:0 "Silah arkadaşlarımızı hoş karşılıyoruz!"
 lar_news.4.b:0 "Yani onurları bu kadar ucuza satın alınabilir mi?"
 lar_news.4.c:0 "Meşruiyet sorunu çözülmüş görünüyor."
 lar_news.4.d:0 "'Bir' Fransız Hükûmeti. 'O' Fransız Hükûmeti değil."
 lar_news.4.desc:0 "En üst düzeydeki müzakerelerin ardından, [GER.GetLeader] bugün kuzey Fransa'daki Alman askeri yönetiminin yakında sona ereceğini ve toprakların tam Fransız egemenliğine geri verileceğini duyurdu. Karşılığında, [VIC.GetLeader] hükûmetinin Çelik Paktı'na katıldığını duyurdu.\n\nŞu anda bu bölgeleri savunan Alman birlikleri, Fransız birlikleri tarafından değiştirilene kadar şimdilik kalacak. Alsas-Loren'in statüsü gibi daha tartışmalı konular görüşülmedi ve görünüşe göre toprak Alman yönetimi altında kaldı."
 lar_news.4.e:0 "Ait olduğumuz yere geri döndük."
 lar_news.4.t:0 "Fransız Hükûmeti Paris'e Dönüyor"
 lar_news.5.a:0 "İtalya konuştuğunda, dünya dinler."
 lar_news.5.b:0 "İttifakımız güçleniyor."
 lar_news.5.c:0 "Almanya'nın etrafındaki çember daralıyor."
 lar_news.5.d:0 "Güney kanadımız güvence altında."
 lar_news.5.desc:0 "İtalya'nın Etiyopya'yı işgali konusundaki ilk aksaklıklara ve anlaşmazlıklara rağmen, [This.GetStresaMembers] liderleri Nisan 1935'te varılan anlaşmaları resmi bir ittifak taahhüdüne dönüştürmek için bir araya geldi.\n\nMüzakerelerin bir parçası olarak, [This.GetStresaConcessions] Bu yeni ittifakın liderleri anlaşmanın sadece Avrupa'da barışı korumayı amaçladığını iddia etse de, birçok diplomat bunun öncelikle Almanya'yı sınırlamak için tasarlandığı konusunda hemfikir."
 lar_news.5.e:0 "İtalya her zamanki gibi güvenilir bir müttefik."
 lar_news.5.t:0 "Stresa Cephesi Onaylandı"
 lar_news.6.a:0 "Yine ihanete uğradık."
 lar_news.6.b:0 "Sıradaki biz miyiz?"
 lar_news.6.c:0 "Fransızlar ne planlıyor?"
 lar_news.6.d:0 "Aptalca bir ittifak yüzünden başka bir savaşa sürüklenmeyeceğiz."
 lar_news.6.desc:0 "Başkan [FRA.GetLeader], önceki yönetimler tarafından verilen stratejik ittifakların ve siyasi garantilerin kapsamlı bir incelemesi de dahil olmak üzere Fransız dış politikasında büyük bir değişiklik olduğunu duyurdu.\n\nÖzellikle, Fransa'yı Doğu Avrupa'daki ülkelere bağlayan ittifaklar ağı \"inceleme altında\" olacak ve birçok gözlemci bunun \"inceleme altında\" olacağı anlamına geliyor. çözüldü.\n\n[POL.GetNameDef], [CZE.GetNameDef] ve [ROM.GetNameDef] liderleri şu ana kadar konu hakkında veya olası tepkiler hakkında yorum yapmayı reddetti."
 lar_news.6.e:0 "Kendilerini ilgilendirmeyen şeylerden akıllıca uzak duruyorlar."
 lar_news.6.t:0 "Fransa Dış Politikasını Yeniden Ayarlıyor"
 lar_news.7.a:0 "Savunmalarımıza dikkat etmeliyiz!"
 lar_news.7.b:0 "Fransa kendini gösteriyor."
 lar_news.7.c:0 "Avrupa'nın küçük ulusları titriyor."
 lar_news.7.d:0 "Avrupa'nın sınırlarını yeniden çizme zamanı."
 lar_news.7.desc:0 "[FRA.GetLeader] ve [GER.GetLeader], Orta Avrupa'daki siyasi ve stratejik durumu tartışmak üzere Berlin'de bir araya geldi. Toplantının ayrıntıları az olmasına ve herhangi bir resmi tebliğ yayınlanmamasına rağmen, gözlemciler [FRA.GetAdjective] ve [GER.GetAdjective]'nin Benelüks ülkelerine yönelik söylem ve politikalarında açık bir değişime dikkat çekti. \n\nBelçika'daki Alman azınlığın bir zamanlar Alman propagandası için sürekli bir davul sesi olduğu yerde, artık sadece geçerken bahsedilirken, Belçika'nın \"bir ulus değil, yapay bir yapı; yalnızca gelişigüzel bir araya getirilmiş bir uluslar topluluğu\" olduğu belirtiliyor ve Fransızca konuşan büyük nüfusa büyük vurgu yapılıyor."
 lar_news.7.e:0 "Mantıklı uluslar arasında mantıklı bir çözüm."
 lar_news.7.t:0 "Fransız-Alman Paktı"
 lar_news.8.a:0 "Bir başka ulus işlerin doğal düzenine geri dönüyor."
 lar_news.8.b:0 "Yakında başka bir devrim yapacaklar."
 lar_news.8.c:0 "Uzun zaman önce geçtiği düşünülen günlere bir dönüş."
 lar_news.8.d:0 "Çok yaşa [FRA.GetLeader]!"
 lar_news.8.desc:0 "[This.GetFrenchCoronationCity]'deki bir törenle [FRA.GetLeader], resmi olarak [This.GetFrenchRoyalTitle] olarak ilan edildi. \n\nOnun yükselişi, yaygın olarak, Üçüncü Cumhuriyet'in, giderek siyasi yelpazenin en uç noktalarındakiler arasındaki şiddetli çatışmalarla tanımlanan bir ortamda siyasi istikrar sağlayamamasının doğrudan bir sonucu olarak değerlendiriliyor. Kendisi şimdi derinden bölünmüş bir ülkeyi yeniden inşa etmek ve yeniden birleştirmek gibi zor bir görevle karşı karşıya; pek çok gözlemci onun iktidara yükselişinde aşırı sağ liglerin oynadığı rolü \"[This.GetFrenchRoyalTitle]\"nin aslında sadece sağcı mafyanın lütfuyla bir hükümdar olduğunun işareti olarak gösteriyor."
 lar_news.8.e:0 "Bu yanlış türden bir mutlak hükümdar!"
 lar_news.8.t:0 "[FRA.GetLeader] Fransa Tahtını Talep Ediyor"
 lar_news.9.a:0 "Radikaller yönetimi ele geçirdi."
 lar_news.9.b:0 "Son Fransız Devrimi."
 lar_news.9.c:0 "Mümkün olan en kötü alternatifi seçerek faşizmden kaçtılar."
 lar_news.9.d:0 "Devrim muzaffer!"
 lar_news.9.desc:0 "Uzun bir siyasi ve ekonomik reform döneminin ardından, Halk Cephesi hükûmetindeki komünist bakanlar bugün merkezin geri kalan bakanlarının ya istifa edip Komünist Parti'yi tek hükûmet partisi olarak tanımalarını ya da derhal Komünist Parti'ye katılmalarını talep ettiler.\n\nAynı zamanda, bir dizi büyük, devlete ait fabrikadan silahlı işçiler ülke genelinde stratejik yerleri işgal etmek için harekete geçti. Paris'ten gelen emirler altındaki ordu kışlada kaldı ve müdahale etmeyi reddetti. \n\nAkşam olduğunda, Komünist darbe tamamlandı ve yeni hükûmet iktidarı güvence altına aldı."
 lar_news.9.e:0 "Avrupa'da bir başka tehdit yükseliyor."
 lar_news.9.t:0 "Fransız Komünistleri İktidarı Ele Geçiriyor"
 lar_non_intervention.1.a:0 "Bu şartlar kabul edilebilir."
 lar_non_intervention.1.b:0 "Bu bir ahmak işi ve biz bunun bir parçası olmayacağız!"
 lar_non_intervention.1.desc:0 "[From.GetLeader], İspanya'da devam eden savaşa dış müdahale olmamasını sağlaması beklenen bir Müdahale Etmeme komitesinin kurulması için resmen çağrıda bulundu. Ancak, mesajla dolaştırılan taslak teklif, müdahale etmemeyi uygulamak için pratik olarak hiçbir sağlam yöntem içermiyor.\n\nMüdahale etmemeyi kabul etsek bile, çok sayıda boşluk, istersek İspanya'daki savaşı etkileyebilmemizi sağlar. Tek somut etki, [From.GetLeader] hükûmetinin popüler desteğine küçük bir artış olacaktır."
 lar_non_intervention.1.t:0 "[From.GetNameDefCap] Bizi Müdahale Etmeme Komitesine Davet Ediyor"
 lar_non_intervention.2.a:0 "Onlardan şüphe etmek için bir nedenimiz yok, değil mi?"
 lar_non_intervention.2.desc:0 "Bunu İspanya'daki şiddeti sona erdirmek için hayati bir adım olarak nitelendiren [From.GetnameDef], Müdahale Etmeme Komitesine resmen imza attı. Şartlarına gerçekten uyup uymayacakları ise henüz belli değil."
 lar_non_intervention.2.t:0 "[From.GetNameDefCap] Müdahale Etmeme Komitesine Katılıyor"
 lar_non_intervention.3.a:0 "Sadece zaman gösterecek."
 lar_non_intervention.3.desc:0 "Sağlam uygulama mekanizmalarının eksikliğini gerekçe gösteren [From.GetNameDef], Müdahale Etmeme Komitesine katılma teklifimizi resmen reddetti. Bunun [From.GetLeader]'in İspanya'ya doğrudan müdahale etmek istediği anlamına gelip gelmediği belirsizliğini koruyor."
 lar_non_intervention.3.t:0 "[From.GetNameDefCap] Müdahale Etmeme Komitesine Katılmayı Reddediyor"
 lar_operative_event.1.a:0 "Bir kurtarma operasyonu düzenlemeliyiz!"
 lar_operative_event.1.desc:0 "Düşman hatlarının gerisinde görevdeyken [This.GetName], düşman [From.From.GetAdjective] karşı istihbaratı tarafından ele geçirildi. Diğer kaynaklardan gelen raporlar, [This.GetSheHe]'nin sorgulanmak üzere uzak bir yerde tutulduğunu belirtiyor. [This.GetSheHe]'nin mümkün olduğunca uzun süre direneceğine inansak da, [This.GetSheHe] çözülmeden önce [This.GetSheHe] kurtarılmadığı veya öldürülmediği sürece düşmanın sonunda faydalı istihbarat elde etmesi muhtemeldir."
 lar_operative_event.1.t:0 "Ajan Yakalandı"
 lar_operative_event.2.a:0 "Bekleyip umut etmekten başka bir şey yapamayız."
 lar_operative_event.2.desc:0 "[From.From.GetNameDef]'de görevdeyken, [This.GetName] görünüşe göre [From.From.GetAdjective] karşı istihbaratı tarafından tespit edildi. [This.GetSheHe]'nin gönderdiği son mesajda, [This.GetHerHim]'i takip eden düşman gözetimini [This.GetSheHe]'nin fark ettiği ve [This.GetSheHe]'nin kaçma ve kurtulma prosedürlerini uygulayacağı belirtiliyordu.\n\nBu prosedürlerin bir parçası olarak, [This.GetName], onları veya başkalarını tehlikeye atmamak için doğal olarak [This.GetHerHis] idarecileriyle temasını kesmiş olacaktır.\n\nBaşarılı olursa, [This.GetName] birkaç hafta içinde bizimle tekrar iletişime geçecektir."
 lar_operative_event.2.t:0 "Ajan Saklanmaya Zorlandı"
 lar_operative_event.3.a:0 "Bir kahraman, [This.GetHerHis] son istirahatine çağrıldı."
 lar_operative_event.3.desc:0 "Görünüşe göre, [From.From.GetNameDef]'de görevli ajanlarımızdan biri olan [This.GetName], en büyük fedakarlığı yaparak görev başında hayatını kaybetti. [From.From.GetAdjective] kaynaklarından gelen raporlar doğal olarak seyrek, ancak görünüşe göre [This.GetName], [From.From.GetAdjective] karşı istihbaratı tarafından takip ediliyordu. [This.GetSheHe]'nin yakalanmak üzere olduğu ve sorgulama altında hayati bilgileri vermekten kaçınmak için ya ölümü seçtiği ya da tutuklanmaya direnirken [From.From.GetAdjective] ajanları tarafından öldürüldüğü muhtemel görünüyor."
 lar_operative_event.3.t:0 "Ajan Öldürüldü"
 lar_operative_event.4.a:0 "[This.GetSheHe] yakında savaşa geri dönecek."
 lar_operative_event.4.desc:0 "[From.From.GetAdjective] karşı istihbaratıyla yaşanan sıcak bir temasın ardından [This.GetName], [This.GetHerHim]'i gözaltına alma girişimini savuştururken [This.GetSheHe]'nin aldığı yaraları sarmak için [This.GetSheHe]'nin bir süre hizmet dışı kalacağını bildirdi.\n\n[This.GetName] şu anda güvenli bir yerde, [This.GetHerHis] yaralarını sarmakta ve [This.GetSheHe] iyileşene kadar birkaç hafta boyunca müsait olmayacak."
 lar_operative_event.4.t:0 "Ajan Yaralandı"
 lar_operative_event.5.a:0 "Ama [This.GetHerHim]'in ölmesini beklemiştik?"
 lar_operative_event.5.desc:0 "Karşı istihbarat servisimiz büyük bir başarı elde etti: Kapsamlı sorgulamanın ve eğer [This.GetSheHe] casuslukla suçlansaydı [This.GetHerHis] muhtemel akıbeti hakkında bilgilendirilmesinin ardından, yakalanan [From.From.GetAdjective] ajanı [This.GetName], devlete karşı işlediği [This.GetHerHis] suçları için tam bir af karşılığında bizimle iş birliği yapmayı kabul etti.\n\n[From.From.GetAdjective] istihbarat servislerinin iç işleyişi hakkındaki [This.GetHerHis] derin bilgisiyle, [This.GetSheHe], [From.From.GetNameDef]'e sızmayı ve [From.From.GetAdjective] karşı istihbaratı tarafından tespit edilmeden kalmayı şüphesiz çok daha kolay bulacaktır."
 lar_operative_event.5.t:0 "Düşman Ajanı Taraf Değiştirdi"
 lar_operative_event.6.a:0 "Seni konuşturmanın yolları var."
 lar_operative_event.6.desc:0 "[This.GetName], yönetimimize sızmaya ve [This.GetHerHis] amirlerine gizli bilgi sızdırmaya çalışırken yakalandı. Sorgulama üzerine [This.GetSheHe], [This.GetHerselfHimself]'in [From.From.GetAdjective] topraklarında faaliyet gösteren [From.GetAgency] için yabancı bir varlık olduğunu itiraf etti. [From.GetAdjective] ulusumuza olan ilgisinin tam doğasının ne olduğu veya yönetimimizin hangi bölümlerinin [From.GetAdjective] İstihbaratının gözleri önüne serildiği henüz bilinmiyor. [This.GetName] hapsedilmiş ve daha fazla sorgulanmayı beklerken, sonunda [This.GetSheHe]'nin [From.From.GetNameDef]'deki [From.GetAdjective] operasyonlarına dair bilinmesi gereken her şeyi ortaya çıkaracağını ancak umabiliriz."
 lar_operative_event.6.t:0 "[From.GetAdjective] Operatifi Yakalandı!"
 lar_portugal_iberian_summit.1.a:0 "Bu teklif çıkarlarımıza uyuyor."
 lar_portugal_iberian_summit.1.b:0 "Önce [?global.POR_iberian_summit_target.GetAdjective] diplomatlarına yaklaşmalıyız."
 lar_portugal_iberian_summit.1.c:0 "Bu saçma bir fikir!"
 lar_portugal_iberian_summit.1.desc:0 "[From.GetNameDef]'den, farklılıklarımızı geride bırakıp ortak bir hedefe doğru birlikte çalışmaya başlamamızı öneren bir mektup aldık. [?global.POR_iberian_summit_target.GetFactionName]'e katılmak için ortak bir talep görüşmemizi ve bunu [?global.POR_iberian_summit_target.GetNameDef]'e sunmamızı teklif ediyorlar. \n\n Sadece bu teklifin başarısının gerçekten mümkün olup olmadığını değil, aynı zamanda gerçekten çıkarlarımıza uygun olup olmadığını da değerlendirmeliyiz."
 lar_portugal_iberian_summit.1.t:0 "İberya Zirvesi"
 lar_portugal_iberian_summit.1_a_tt:0 "Teklifi derhal [GER.GetFlag][GER.GetNameDefCap]'e göndereceğiz.\n"
 lar_portugal_iberian_summit.1_b_tt:0 "Altı ay içinde [GER.GetFlag][GER.GetNameDefCap]'e bir teklif gönderilecektir.\n"
 lar_portugal_iberian_summit.2.a:0 "Talebi derhal gönderin."
 lar_portugal_iberian_summit.2.desc:0 "[From.GetAdjective] hükûmeti [?global.POR_iberian_summit_target.GetFactionName]'e katılma teklifimizi kabul etti. Birlikte, en kısa sürede [?global.POR_iberian_summit_target.GetNameDef]'e sunmak üzere bir talep imzaladık."
 lar_portugal_iberian_summit.2.t:0 "İberya Zirvesi - [From.GetNameDef] Kabul Ediyor"
 lar_portugal_iberian_summit.3.a:0 "Umarım buna değer..."
 lar_portugal_iberian_summit.3.desc:0 "[From.GetAdjective] hükûmeti, teklifimizi [?global.POR_iberian_summit_target.GetNameDef]'e sunmadan önce belirli [?global.POR_iberian_summit_target.GetAdjective] diplomatlarına yaklaşmak için zaman ayırırsak [?global.POR_iberian_summit_target.GetFactionName]'e katılma şansımızın daha yüksek olacağını belirtiyor. Bu şekilde, [?global.POR_iberian_summit_target.GetAdjective] amaçları ve hedefleri hakkında kritik bilgi edineceğiz ve dolayısıyla onların çıkarlarına daha uygun bir teklif yapabileceğiz."
 lar_portugal_iberian_summit.3.t:0 "İberya Zirvesi - [From.GetNameDef] Talebi Geciktirdi"
 lar_portugal_iberian_summit.4.a:0 "Kabul ediyoruz, bize faydalı olabilirler."
 lar_portugal_iberian_summit.4.b:0 "Reddediyoruz, sadece korumamızdan yararlanmak istiyorlar!"
 lar_portugal_iberian_summit.4.desc:0 "İspanya ve Portekiz, [Root.GetFactionName]'e katılmak için bize ortak bir talep gönderdi. Her iki İberya ülkesini de ittifakımıza kabul etmemizi bekliyorlar. \n\nAkdeniz'e erişimi güvence altına alma olasılığını değerlendirirken, askeri komutanlarımız savunmak için kaynağımız olmayabilecek yeni cepheler açma potansiyeli konusunda endişeli..."
 lar_portugal_iberian_summit.4.t:0 "İberya Ülkeleri [Root.GetFactionName]'e Katılmak İstiyor"
 lar_portugal_iberian_summit.5.a:0 "Bu teklif çıkarlarımıza uyuyor."
 lar_portugal_iberian_summit.5.b:0 "Önce [?global.POR_iberian_summit_target.GetAdjective] diplomatlarına yaklaşmalıyız."
