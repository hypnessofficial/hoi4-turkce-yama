 lar_portugal_iberian_summit.6.t:0 "İberya Zirvesi - [From.GetNameDef] Kabul Ediyor"
 lar_portugal_iberian_summit.7.a:0 "Umarım buna değer..."
 lar_portugal_iberian_summit.7.desc:0 "[From.GetAdjective] hükûmeti, teklifimizi [?global.POR_iberian_summit_target.GetNameDef]'e sunmadan önce belirli [?global.POR_iberian_summit_target.GetAdjective] diplomatlarına yaklaşmak için zaman ayırırsak [?global.POR_iberian_summit_target.GetFactionName]'e katılma şansımızın daha yüksek olacağını belirtiyor. Bu şekilde, [?global.POR_iberian_summit_target.GetAdjective] amaçları ve hedefleri hakkında kritik bilgi edineceğiz ve dolayısıyla onların çıkarlarına daha uygun bir teklif yapabileceğiz."
 lar_portugal_iberian_summit.7.t:0 "İberya Zirvesi - [From.GetNameDef] Talebi Geciktirdi"
 lar_portugal_iberian_summit.8.a:0 "Kabul ediyoruz, birlikte düşmanlarımızı yeneceğiz!"
 lar_portugal_iberian_summit.8.b:0 "Reddediyoruz, bizi sadece zayıflatırlar."
 lar_portugal_iberian_summit.8.desc:0 "İspanya ve Portekiz, [Root.GetFactionName]'e katılmak için bize ortak bir talep gönderdi. Her iki İberya ülkesini de ittifakımıza kabul etmemizi bekliyorlar. \n\nAkdeniz'e erişimi güvence altına alma olasılığını değerlendirirken, askeri komutanlarımız savunmak için kaynağımız olmayabilecek yeni cepheler açma potansiyeli konusunda endişeli..."
 lar_portugal_iberian_summit.8.t:0 "İberya Ülkeleri [Root.GetFactionName]'e Katılmak İstiyor"
 lar_portugal_iberian_summit.9.a:0 "Ne aptal komşularımız var!"
 lar_portugal_iberian_summit.9.desc:0 "Durumu açıkça yanlış anlayan ve bizimle iş birliği yapma niyetinden yoksun olan [From.GetAdjective] hükûmeti, [?global.POR_iberian_summit_target.GetFactionName]'e katılma teklifimizi reddetti. \nBelki de şimdi kendi başımıza müttefik bulmaya odaklanmalıyız..."
 lar_portugal_iberian_summit.9.t:0 "İberya Zirvesi - [From.GetNameDef] Reddediyor"
 lar_portugal_iberian_workers_united.1.a:0 "Birleşirsek, asla yenilmeyiz!"
 lar_portugal_iberian_workers_united.1.desc:0 "Çok uzun zamandır İspanya ve Portekiz, benzerlikleri yerine farklılıklarını vurgulayan bağımsız uluslar oldu, ancak o zamanlar sona erdi; İspanyol ve Portekizli işçilerin Faşizme karşı mücadelelerinde bir araya geldiği gün geldi!"
 lar_portugal_iberian_workers_united.1.t:0 "İberya İşçileri Birleşti"
 lar_portugal_iberian_workers_united.2.a:0 "[Root.GetNameDefCap] ve [POR.GetNameDef] birleşmeli!"
 lar_portugal_iberian_workers_united.2.a_tt:0 "§Yİberya Sosyalist Birliği§!, §YCumhuriyetçi İspanya§!'yı ilhak eder.\n"
 lar_portugal_iberian_workers_united.2.b:0 "[Root.GetNameDefCap] bağımsız bir ulus olarak kalacaktır."
 lar_portugal_iberian_workers_united.2.desc:0 "Nihayet barışı sağladığımıza göre, [From.GetNameDefCap], İberya Yarımadası'nın bir Halk Sosyalist hükûmeti altında birleşmesini düşünmek için hükûmetimize başvurdu. Bu, [Root.GetAdjective] ve [From.GetAdjective] kimliklerinin silinmesine yol açacak, çünkü hepimiz İberya Sosyalist Birliği'nin İberyalı vatandaşları olacağız."
 lar_portugal_iberian_workers_united.2.t:0 "İberya Sosyalist Birliği"
 lar_portugal_naval_blockade.1.a:0 "Bu anlaşmayı düşüneceğiz..."
 lar_portugal_naval_blockade.1.desc:0 "[POR.GetAdjective] hükûmeti, [ENG.GetNameDef] tarafından bize uygulanan deniz ablukasına uymakla yükümlü olmadıklarını ilan etti. [POR.GetAdjective] konvoylarının, kendi konvoylarımızın ulaşamadığı yerlere mal taşıyarak savaş çabamızı destekleyeceği adil bir anlaşma teklif eden bir mektup aldık; karşılığında [POR.GetNameDef]'e ucuz tüketim malları göndermek için bir ticaret anlaşması yapılacak."
 lar_portugal_naval_blockade.1.t:0 "[POR.GetNameDefCap] [ENG.GetAdjective] Deniz Ablukasını Reddediyor"
 lar_portugal_naval_blockade.1_tt:0 "[ENG.GetNameDefCap] ile savaşta olan ülkeler için kararın kilidini açar."
 lar_portugal_naval_blockade.2.a:0 "Bu her iki ulusa da fayda sağlayacaktır."
 lar_portugal_naval_blockade.2.desc:0 "[From.GetNameDef]'den bugün, Britanya deniz ablukasından kaçma teklifimizi kabul eden bir mektup geldi. [From.GetAdjective] gemilerinin ulaşamadığı yerlerde ikmal ihtiyaçlarını karşılamak için konvoylarımızı kullanacağız. Karşılığında, kendi projelerimiz için ihtiyacımız olan malzemeleri sağlamak üzere fabrikalarından birinin üretimini bize yönlendirecekler."
 lar_portugal_naval_blockade.2.t:0 "[From.GetName], deniz ablukasından kaçma teklifimizi kabul etti"
 lar_portugal_naval_blockade.3.a:0 "Bu hain fırsatçılar!"
 lar_portugal_naval_blockade.3.desc:0 "[POR.GetAdjective] hükûmeti, tarafımızdan uygulanan deniz ablukasına uymayacaklarını ilan etti. [POR.GetNameDefCap], düşmanlarımıza [POR.GetAdjective] konvoylarını kullanarak mal kaçakçılığı yaparak savaş çabalarını destekleme teklifinde bulundu.\n\nÇatışmadaki tarafsızlıklarına saygı ve anlayışla yaklaşmamıza rağmen, eski dostlarımızın artık Anglo-Portekiz İttifakı'nı onurlandırma arzusu kalmamış gibi görünüyor, açıkça düşmanlarımızı destekliyor ve böylece ülkelerimiz arasında beş asırdan fazla süren bir antlaşmayı bozuyorlar..."
 lar_portugal_naval_blockade.3.t:0 "[POR.GetNameDefCap] Deniz Ablukasına Uymayı Reddediyor"
 lar_portugal_navy_mutiny.1.a:0 "Onlarınki haklı bir dava. Gitmelerine izin verin!"
 lar_portugal_navy_mutiny.1.b:0 "Bu çılgınlığı durdurun!"
 lar_portugal_navy_mutiny.1.desc:0 "Donanma Devrimci Örgütü (Organização Revolucionária da Armada), Donanmamızda bir isyan organize ederek birkaç subayı tutukladı. Dão muhribinin liderliğindeki bu donanma isyanının amacı, Akdeniz'deki İspanyol limanlarına yelken açmak ve Cumhuriyetçilerin yanında İspanya İç Savaşı'na katılmaktır. \n\nAncak, bazı mürettebatların tereddüdü isyancıların başarısını engelledi ve hala onları durdurma fırsatımız var."
 lar_portugal_navy_mutiny.1.t:0 "Donanma İsyanı"
 lar_portugal_navy_mutiny.1_allow_tt:0 "İsyan eden gemiler [SPD.GetNameDefCap]'e devredilecektir. \nEğer [SPD.GetFlag][SPD.GetNameDef] İspanya İç Savaşı'nı kazanırsa, aynı miktarda gemiyi geri devredecektir.\n§RKomünist destek§! ayrılan gemi sayısını etkileyecektir."
 lar_portugal_navy_mutiny.1_stop_tt:0 "İsyancıları durdurmaya çalışacağız.\nİsyancı gemilerin başarılı olma ve [SPD.GetNameDefCap]'e devredilme şansı vardır.\n§RKomünist destek§! isyancı gemi sayısını ve ayrılma şanslarını etkileyecektir."
 lar_portugal_navy_mutiny.2.a:0 "Umarım tek parça halinde geri dönerler..."
 lar_portugal_navy_mutiny.2.desc:0 "Beklenmedik bir şekilde, isyancı gemilerin limandan ayrılmasına izin verme kararımızı öğrendikten sonra, mürettebatın çoğu isyan etmemeye karar verdi ve hükûmetimizin daha ciddi adımlar atıp yakın gelecekte Cumhuriyetçilerle birlikte İspanya İç Savaşı'na katılacağını umdu.\nSadece zaten İspanya yolunda olan Dão muhribi geri dönmeyi reddetti. \nİspanyol hükûmeti, iç savaş sona erdikten sonra tazminat olarak bize bir muhrip gönderme sözü verdi."
 lar_portugal_navy_mutiny.2.t:0 "İsyancılar yelken açıyor"
 lar_portugal_navy_mutiny.2_extra.desc:0 "İsyancıların çoğunu şaşırtacak şekilde, gemilerinin ayrılmasına izin verildi ve şimdi İspanyol limanlarına doğru gidiyorlar. Dão muhribi, arkasından gelen [?POR_ships_revolted_not_including_dao] diğer gemiyle birlikte yolu açıyor. \n\nİspanyol Cumhuriyetçi hükûmetine ulaştık ve iç savaş bittikten sonra Portekiz'e gemi sağlayacaklarını temin ettiler."
 lar_portugal_navy_mutiny.2_tt:0 "Eğer [SPD.GetNameDef] İspanya İç Savaşı'nı kazanırsa, [?POR_ships_revolted] gemi [Root.GetNameDef]'e geri devredilecektir."
 lar_portugal_navy_mutiny.3.a:0 "Bu bir daha asla olmayacak!"
 lar_portugal_navy_mutiny.3.desc:0 "İsyan, sadık sahil kuvvetlerimizin hızlı eylemleri sayesinde bastırıldı. İsyancılar tutuklandı ve hain eylemlerine göre cezalandırıldı. Daha fazla itaatsizlik girişimini önlemek için, bu isyana karışan gemilerin mürettebatını örgütlerimize bağlı güvenilir denizcilerle değiştirdik."
 lar_portugal_navy_mutiny.3.t:0 "İsyan Raporu"
 lar_portugal_navy_mutiny.3_extra.desc:0 "İsyan, subaylarımızın başlangıçta beklediğinden daha iyi organize edilmişti. Sahil topçularımız isyancı gemilere ateş açtığında, isyancılar buhar kazandı ve Dão muhribi limandan çıktı, aralıklarla birkaç gemi daha onu takip etti. Kaçmaya çalışırken bazı gemiler vuruldu ve kıyıya oturdu, orada birliklerimiz hainleri tutukladı.\n\nNe yazık ki, [?POR_ships_revolted] gemi kaçmayı başardı ve şu anda İspanya'ya doğru gidiyor. Bu kayıp için tazmin edilmemizi sağlamak için iç savaştan sonra İspanyol hükûmetine yaklaşacağız."
 lar_portugal_navy_mutiny.3_no_ships_tt:0 "§Gİsyan bastırıldı.§!"
 lar_portugal_navy_mutiny.3_ships_tt:0 "§R[?POR_ships_revolted] gemi §! Cumhuriyetçi İspanya'ya devredilecek.\nEğer Cumhuriyetçiler İspanya İç Savaşı'ndan sonra galip gelirse, aynı miktarda gemiyi geri devredecekler."
 lar_portugal_navy_mutiny.4.a:0 "Bu cesur Portekizli adamların yaptıklarını unutmayacağız!"
 lar_portugal_navy_mutiny.4.desc:0 "İspanyol Cumhuriyeti'ne Milliyetçi isyanına karşı yardım etmeye istekli olan Portekizli mürettebatlar, birkaç Donanma gemisinde isyan etti. Subaylar tutuklandı ve karadan güçlü bir direnişle karşılaşmayı bekleyerek, gemiler mümkün olan en kısa sürede limandan ayrılmaya hazırlandı. \n\nAncak, mürettebatı şaşırtacak şekilde, konunun daha da tırmanmasını önlemek isteyen Portekiz hükûmeti uzlaştı ve denizcilerin yelken açıp davamız için savaşmalarına izin verdi, yeter ki İspanya İç Savaşı bittiğinde geri dönsünler. \n\nBazı mürettebatlar o zaman Portekiz'de kalıp hükûmeti Milliyetçilere karşı daha fazla eylemde bulunmaya zorlamaya karar verdi ve sonunda [?POR.POR_ships_revolted] gemi şimdi limanlarımıza doğru geliyor. Yoldaşlarımızı karşılamalı ve cesaretleri için onlara teşekkür etmeliyiz."
 lar_portugal_navy_mutiny.4.t:0 "Portekizli denizciler yardımımıza geliyor!"
 lar_portugal_navy_mutiny.4_extra.desc:0 "İspanyol Cumhuriyeti'ne Milliyetçi isyanına karşı yardım etmeye istekli olan Portekizli mürettebatlar, birkaç Donanma gemisinde isyan etti. Subaylarının tutuklanmasının ardından, denizciler limandan ayrılmaya çalıştı, ancak Ordu'dan şiddetli bir yanıt aldı. \nAğır sahil topçusu ateşi altında umutsuz bir yarma harekatı gerçekleştirerek, [?POR.POR_ships_revolted] gemi kaçmayı başardı ve şimdi İspanya'ya doğru gidiyor. \n\nBu isyanı kontrol altına alamayan Portekiz hükûmeti, savaş bittiğinde kayıpları için onları tazmin etmemizi talep etti. \n\nAncak, şimdilik yoldaşlarımızı karşılamalı ve tüm o cesur denizcilere fedakarlıkları için teşekkür etmeliyiz, çünkü birçoğu isyan sırasında tutuklandı veya yaralandı."
 lar_portugal_navy_mutiny.4_tt:0 "§G[?POR.POR_ships_revolted] [POR.GetAdjective] gemi§! [Root.GetNameDef]'e devredildi ve şimdi bizim kontrolümüz altında. \nİspanya İç Savaşı bittiğinde [POR.GetNameDef]'e geri devredilecekler."
 lar_portugal_navy_mutiny.5.a:0 "O gemilerin ne kadar iyi performans gösterdiğini göreceğiz..."
 lar_portugal_navy_mutiny.5.desc:0 "İspanya İç Savaşı sona erdi ve Cumhuriyetçi hükûmet, çatışmanın başlangıcında onların yardımına yelken açanlar için tazminat olarak bize [?POR_ships_revolted] gemi sağlamayı kabul etti. Ancak, muhriplerimiz görevlerini yerine getirdikten sonra en iyi durumda olmayabilir ve bu nedenle İspanya Cumhuriyeti, gemilerimizden herhangi birinin kendi gemileriyle değiştirilmesi gerekip gerekmediğine karar vermek için bir inceleme yapacaktır."
 lar_portugal_navy_mutiny.5.t:0 "Denizcilerimiz İspanya İç Savaşı'ndan geri dönüyor"
 lar_portugal_navy_mutiny.5_tt:0 "§G[SPD.GetNameDefCap], [?POR_ships_revolted] gemiyi [Root.GetNameDef]'e geri devredecektir.§!"
 lar_portugal_navy_mutiny.6.a:0 "Elveda silah arkadaşları!"
 lar_portugal_navy_mutiny.6.desc:0 "Şimdi Milliyetçi isyanı yenildiğine göre, çatışmanın ilk aylarında yardımımıza gelen cesur Portekizli denizcilerin nihayet anavatanlarına dönme zamanı geldi.\nPortekiz gemilerinden hangilerinin Portekiz'e geri yelken açmak için iyi durumda olduğuna ve hangilerinin kendi gemilerimizle değiştirilmesi gerektiğine karar vermek için bir inceleme yapacağız.\n\nBu cesur denizcilere çok şey borçluyuz ve cesaretlerini asla unutmayacağız."
 lar_portugal_navy_mutiny.6.t:0 "Portekizli yoldaşlarımıza veda etme zamanı"
 lar_portugal_navy_mutiny.6_tt:0 "[?POR.POR_ships_revolted] gemi [POR.GetNameDef]'e geri devredilecek."
 lar_portugal_overseas_provinces.1.a:0 "İyi haber!"
 lar_portugal_overseas_provinces.1.desc:0 "Kuzey ve güney Angola'daki topraklarımız nihayet ulusumuza entegre edildi. Yerel Angola nüfusu Portekiz vatandaşlığı aldı ve şimdi askerlik hizmeti de dahil olmak üzere diğer tüm Portekiz vatandaşlarıyla aynı hak ve görevleri paylaşıyor. Bu, ordumuzu güçlendirmek için yeni bir insan gücü kaynağına yol açacaktır."
 lar_portugal_overseas_provinces.1.t:0 "Angola Toprakları Entegre Edildi"
 lar_portugal_overseas_provinces.2.a:0 "Bu Portekiz'in iyiliği için."
 lar_portugal_overseas_provinces.2.desc:0 "Eski Mozambik sömürgemiz nihayet ulusumuza entegre edildi. Yerel Mozambik nüfusu Portekiz vatandaşlığı aldı ve şimdi askerlik hizmeti de dahil olmak üzere diğer tüm Portekiz vatandaşlarıyla aynı hak ve görevleri paylaşıyor. Bu, ordumuzu güçlendirmek için yeni bir insan gücü kaynağına yol açacaktır."
 lar_portugal_overseas_provinces.2.t:0 "Mozambik Toprağı Entegre Edildi"
 lar_portugal_overseas_provinces.3.a:0 "Bu, Portekiz uğruna."
 lar_portugal_overseas_provinces.3.desc:0 "Eski sömürgemiz Doğu Timor nihayet ulusumuza entegre edildi. Yerel Timor nüfusu Portekiz vatandaşlığı elde etti ve artık askerlik hizmeti de dahil olmak üzere diğer her Portekiz vatandaşıyla aynı hak ve görevleri paylaşıyor. Bu durum, ordumuzu güçlendirmek için yeni bir insan gücü kaynağı sağlayacaktır."
 lar_portugal_overseas_provinces.3.t:0 "Timor Toprakları Entegre Edildi"
 lar_portugal_promote_monarchist_cause.1.a:0 "Buna nasıl cüret ederler?!"
 lar_portugal_promote_monarchist_cause.1.desc:0 "Portekiz hükûmeti Brezilyalı monarşistlere başvuruyor, Prens Pedro Henrique'yi öven ve Brezilya Tahtı'nı alma hakkını iddia eden bir propaganda kampanyasını destekliyor. \nHükûmetin devrilmesine yol açan büyük bir monarşist hareket tarafından bunalmamak için bunun Brezilya nüfusu üzerindeki potansiyel etkisini göz ardı etmemeliyiz."
 lar_portugal_promote_monarchist_cause.1.t:0 "Portekiz monarşist duyguları teşvik ediyor!"
 lar_portugal_promote_monarchist_cause.2.a:0 "[Root.GetNameDefCap] ve [POR.GetNameDef] yeniden birleşmeli."
 lar_portugal_promote_monarchist_cause.2.b:0 "[Root.GetNameDefCap] bağımsız bir ulus olarak kalacaktır."
 lar_portugal_promote_monarchist_cause.2.desc:0 "[POR.GetNameDefCap], Portekiz ve Brezilya Kralı olarak taç giyecek olan Dom Duarte Nuno'nun yönetimi altında iki ulusumuzun birleşmesini önererek hükûmetimize başvurdu. \n\n[POR.GetAdjective] hükûmeti olumsuz bir yanıtı kabul etmeyeceklerini belirtti ve uluslarımız arasında potansiyel bir çatışmayı önlemek için teklifi kabul etmemizi istedi."
 lar_portugal_promote_monarchist_cause.2.t:0 "Portekiz ve Brezilya Krallığı'nı Yeniden Birleştir"
 lar_portugal_promote_monarchist_cause.3.a:0 "Brezilya Tahtı restore edilecek!"
 lar_portugal_promote_monarchist_cause.3.a_tt:0 "[From.GetFlag]§Y[From.GetNameDefCap]§G iç savaşta bize katılacak.§!§!"
 lar_portugal_promote_monarchist_cause.3.b:0 "Bu hainleri yok etmeliyiz!"
 lar_portugal_promote_monarchist_cause.3.b_tt:0 "[From.GetFlag]§Y[From.GetNameDefCap]§R iç savaşta bize karşı katılacak.§!§!"
 lar_portugal_promote_monarchist_cause.3.desc:0 "[POR.GetAdjective] hükûmetinin yardımıyla, Brezilyalı Monarşistler Rio de Janeiro'nun kontrolünü ele geçirdi ve şimdi bize karşı çıkan faşist hainlere karşı ülke genelinde silahlanıyor. \nDüşman, ulusumuzdaki farklı fraksiyonların desteğini aradı, ancak restore edilmiş [Root.GetName]'in sadık tebaasının korkusu yok, çünkü meşru İmparatorları [Root.GetLeader] onları zafere taşıyacak!"
 lar_portugal_promote_monarchist_cause.3.desc_anti_monarchist:0 "Portekiz hükûmetinin yardımıyla, Brezilyalı Monarşistler ülke genelinde silahlanıyor. Eğer o hainler Monarşiyi restore etme girişimlerinde başarılı olurlarsa, kısa bir süre sonra sevgili ülkemizin Portekiz kontrolüne girdiğini görmemiz çok muhtemel. \n\nÜlkenin çoğunu kaybettik ama neyse ki isyancılar Rio de Janeiro'yu ele geçirme girişimlerinde başarısız oldular, bu da bize birliklerimizi toplayıp başkentten yürüyerek topraklarımızı onları mahvetmek isteyenlerden geri alma fırsatı veriyor."
 lar_portugal_promote_monarchist_cause.3.t:0 "Bir Monarşist Ayaklanması!"
 lar_portugal_promote_monarchist_cause.4.a:0 "Yaşasın İmparator!"
 lar_portugal_promote_monarchist_cause.4.desc:0 "[POR.GetAdjective] hükûmetinin yardımıyla, Brezilyalı Monarşistler hükûmeti barışçıl bir şekilde değiştirmeyi başardılar. Ülke genelinde dağınık olan ve meşru İmparatorumuz [Root.GetLeader]'in tahta çıkmasına hala karşı çıkan birkaç unsur var, ancak yakında yatıştırılacaklar."
 lar_portugal_promote_monarchist_cause.4.t:0 "Brezilya Tahtı Restore Edildi"
 lar_portugal_promote_monarchist_cause.5.a:0 "Bu Portekiz'i güçlendirir."
 lar_portugal_promote_monarchist_cause.5.desc:0 "Brezilya hükûmeti, uluslarımızı birleştirme teklifini imzalamayı akıllıca kabul etti. Güçlü Portekiz ve Brezilya Birleşik Krallığı, Kral [Root.GetLeader]'in yönetimi altında yeniden yükseliyor.\n\nSevgili ulusumuza güç ve refah getirsin!"
 lar_portugal_promote_monarchist_cause.5.t:0 "Brezilya Birleşmeyi Kabul Ediyor"
 lar_portugal_promote_monarchist_cause.6.a:0 "Kaderleri mühürlendi."
 lar_portugal_promote_monarchist_cause.6.desc:0 "[BRA.GetAdjective] hükûmeti, uluslarımızı [Root.GetLeader]'in yönetimi altında birleştirme teklifimizi pervasızca reddetmeyi seçti.\nBu bizim için tamamen kabul edilemez olsa da, eski Portekiz Krallığı'nın gücünü restore etme yolumuzda bu sadece küçük bir engel.\n\nSonunda, başkalarının yapacağı gibi, taleplerimize boyun eğmek zorunda kalacaklar..."
 lar_portugal_promote_monarchist_cause.6.t:0 "Brezilya Birleşmeyi Reddediyor"
 lar_portugal_promote_monarchist_cause.7.a:0 "Monarşistleri destekle."
 lar_portugal_promote_monarchist_cause.7.a_tt:0 "Olası bir iç savaşta Monarşistlerin yanında yer alacaksınız."
 lar_portugal_promote_monarchist_cause.7.b:0 "Anti-Monarşist koalisyonu destekle."
 lar_portugal_promote_monarchist_cause.7.b_tt:0 "Olası bir iç savaşta Faşistlerin yanında yer alacaksınız."
 lar_portugal_promote_monarchist_cause.7.desc:0 "Ülkemizdeki durum kritik. Monarşist hareket ivme kazanıyor ve muhtemelen yakın bir ayaklanmayı önlemek için hükûmette bir anti-monarşist koalisyon iktidara geldi. \nBrezilya vatandaşları bu koalisyonun liderlerinin Faşist eğilimini fark ettikçe sosyal istikrarsızlık hızla artıyor ve toplumumuz Faşizm ve Monarşizm arasında giderek daha fazla kutuplaşıyor.\nBu kader anında, bir taraf seçme zamanı geldi."
 lar_portugal_promote_monarchist_cause.7.t:0 "Monarşistler Yükselişte!"
 lar_portugal_purchase_ships.1.a:0 "Bu her ikimiz için de faydalı olacaktır."
 lar_portugal_purchase_ships.1.a_tt:0 "[POR.GetNameDefCap] bir anlaşma seçtiğinde ödeme olarak §Y1§! harita dışı §YSivil Fabrika§! alacağız."
 lar_portugal_purchase_ships.1.b:0 "İlgilenmiyoruz."
 lar_portugal_purchase_ships.1.desc:0 "[From.GetAdjective] hükûmeti, uygun bir Donanmaları olmadığının farkında olarak, [Root.GetAdjective] gemileri satın almak için bir ihale açtı. İstedikleri gemileri inşa etmeyi kabul edersek, bize kendi amaçlarımız için kullanabileceğimiz mallar sağlayacaklar."
 lar_portugal_purchase_ships.1.t:0 "[From.GetNameDefCap] [Root.GetAdjective] Gemileri Satın Almak İstiyor"
 lar_portugal_purchase_ships.2.a:0 "Denizaltı Satın Al."
 lar_portugal_purchase_ships.2.b:0 "Muhrip Satın Al."
 lar_portugal_purchase_ships.2.c:0 "Hafif Kruvazör Satın Al."
 lar_portugal_purchase_ships.2.desc:0 "[From.GetAdjective] hükûmeti, [Root.GetAdjective] Donanması için gemi inşa etmeyi kabul etti. Seçmemiz için üç farklı teklif sundular."
 lar_portugal_purchase_ships.2.t:0 "[From.GetNameDefCap] Gemilerimizi İnşa Etmeyi Kabul Ediyor"
 lar_portugal_purchase_ships.3.a:0 "Onlarsız da idare ederiz."
 lar_portugal_purchase_ships.3.desc:0 "[From.GetNameDefCap], Donanmamız için [From.GetNameDefCap] gemileri satın alma teklifimizi reddetti. \nAnlaşmayı kabul etmeye istekli başka ülkeler aramak veya kendi donanma tesislerimizi geliştirmeye odaklanmak zorunda kalacağız, böylece güçlü bir [Root.GetAdjective] filosu inşa etmek için herhangi bir yabancı güce güvenmek zorunda kalmayız."
 lar_portugal_purchase_ships.3.t:0 "[From.GetNameDefCap] Gemilerimizi İnşa Etmeyi Reddediyor"
 lar_portugal_purchase_ships.4.a:0 "İyi"
 lar_portugal_purchase_ships.4.a_tt:0 "Yedek Filoya üç denizaltı eklendi"
 lar_portugal_purchase_ships.4.desc:0 "Yaklaşık bir yıllık inşaatın ardından, sipariş ettiğimiz üç [GetPortugueseShipsBuilder] denizaltısı birkaç deniz denemesinden geçti ve nihayet Donanmaya resmi olarak hizmete girmeye hazır.\n Gemiler [Root.GetAdjective] limanında demirli ve mürettebatları emir bekliyor."
 lar_portugal_purchase_ships.4.t:0 "Gemi İnşaatı Tamamlandı - Denizaltılar"
 lar_portugal_purchase_ships.5.a:0 "İyi"
 lar_portugal_purchase_ships.5.a_tt:0 "Yedek Filoya iki muhrip eklendi"
 lar_portugal_purchase_ships.5.desc:0 "Yaklaşık bir yıllık inşaatın ardından, sipariş ettiğimiz iki [GetPortugueseShipsBuilder] muhribi birkaç deniz denemesinden geçti ve nihayet Donanmaya resmi olarak hizmete girmeye hazır.\nGemiler [Root.GetAdjective] limanında demirli ve mürettebatları emir bekliyor."
 lar_portugal_purchase_ships.5.t:0 "Gemi İnşaatı Tamamlandı - Muhripler"
 lar_portugal_purchase_ships.6.a:0 "İyi"
 lar_portugal_purchase_ships.6.a_tt:0 "Yedek Filoya bir hafif kruvazör eklendi"
 lar_portugal_purchase_ships.6.desc:0 "Yaklaşık bir buçuk yıllık inşaatın ardından, sipariş ettiğimiz [GetPortugueseShipsBuilder] hafif kruvazörü birkaç deniz denemesinden geçti ve nihayet Donanmaya resmi olarak hizmete girmeye hazır.\nGemi [Root.GetAdjective] limanında demirli ve mürettebatı emir bekliyor."
 lar_portugal_purchase_ships.6.t:0 "Gemi İnşaatı Tamamlandı - Hafif Kruvazör"
 lar_portugal_royal_iberian_alliance.1.a:0 "Bu ittifak Portekiz için faydalı olacaktır."
 lar_portugal_royal_iberian_alliance.1.b:0 "Bu antlaşma bizim için kabul edilemez."
 lar_portugal_royal_iberian_alliance.1.desc:0 "[From.GetNameDefCap], ülkelerimizin İspanya İç Savaşı sırasında yaşadığı tüm sosyal bölünme ve istikrarsızlıktan sonra, refah ve ilerleme arayışında birleşmemizin İberya ülkelerinin iyiliği için olduğunu belirtiyor.\n\n[From.GetAdjective] hükûmeti, geçmişteki farklılıklarımızı geride bırakarak ve sadece Avrupa'da değil, tüm dünyada bizi bekleyen çoklu tehditleri aşmak için birlikte çalışarak iki krallığımız arasında bir ittifak müzakere etmeyi önerdi."
 lar_portugal_royal_iberian_alliance.1.t:0 "Kraliyet İberya İttifakı'nı Kur"
 lar_portugal_spanish_civil_war.1.a:0 "Yolumuza çıkmasalar iyi olur..."
 lar_portugal_spanish_civil_war.1.desc:0 "Bugün, [POR.GetNameDef], İspanyol Cumhuriyeti'ne desteğini açıkladı ve hükûmetin İspanya İç Savaşı'nda ciddi önlemler almayı düşündüğünü ilan etti. Konuşması sırasında, [POR.GetLeader], İberya'da ortaya çıkan Faşist tehdidi kınayarak, [POR.GetNameDef]'in Milliyetçilere karşı mücadelelerinde İspanyol yoldaşlarına yardım etmenin görevi olduğunu iddia etti."
 lar_portugal_spanish_civil_war.1.t:0 "[POR.GetNameDefCap] İspanyol Cumhuriyeti'ne sempati duyuyor"
 lar_portugal_spanish_civil_war.1_tt:0 "§R[POR.GetNameDefCap], İspanya İç Savaşı'nda [SPD.GetFlag][SPD.GetNameDef]'e katılarak bize karşı savaşabilecek!§!"
 lar_portugal_spanish_civil_war.2.a:0 "Bu işlere karışmamalılar..."
 lar_portugal_spanish_civil_war.2.desc:0 "[POR.GetAdjective] hükûmeti İspanyol Milliyetçilerine desteğini açıkladı ve [POR.GetNameDef]'in İspanya İç Savaşı'nda ciddi önlemler almayı düşündüğünü ilan etti. Konuşması sırasında, [POR.GetLeader], İberya'da yayılan Komünist ve Anarşist tehdidi kınayarak, [POR.GetNameDef]'in Cumhuriyetçilere karşı mücadelelerinde İspanyol komşularına yardım etmenin görevi olduğunu iddia etti."
 lar_portugal_spanish_civil_war.2.t:0 "[POR.GetNameDefCap] İspanyol Milliyetçilerine sempati duyuyor"
 lar_portugal_spanish_civil_war.2_tt:0 "§R[POR.GetNameDefCap], İspanya İç Savaşı'nda [SPA.GetFlag][SPA.GetNameDef]'e katılarak bize karşı savaşabilecek!§!"
 lar_portugal_spanish_civil_war.3.a:0 "Bu işlere karışmamalılar..."
 lar_portugal_spanish_civil_war.3.desc:0 "[POR.GetAdjective] hükûmeti bugün İspanyol Karlistlerine desteğini açıkladı ve [POR.GetNameDef]'in İspanya İç Savaşı'nda ciddi önlemler almayı düşündüğünü ilan etti. Konuşması sırasında, [POR.GetLeader], Monarşinin siyasetiyle çok kutuplaşmış bir İberya Yarımadası'na istikrar ve refah getirmenin tek yolu olduğunu ve [POR.GetNameDef]'in Monarşiyi restore etme mücadelelerinde İspanyol kraliyetçilerine yardım etmenin görevi olduğunu ilan etti."
 lar_portugal_spanish_civil_war.3.t:0 "[POR.GetNameDefCap] İspanyol Karlistlerine sempati duyuyor"
 lar_portugal_spanish_civil_war.3_tt:0 "§R[POR.GetNameDefCap], İspanya İç Savaşı'nda [SPB.GetFlag][SPB.GetNameDef]'e katılarak bize karşı savaşabilecek!§!"
 lar_ratify_the_stresa_front.1.a:0 "[This.GetAdjective] diplomasisinin bir zaferi."
 lar_ratify_the_stresa_front.1.b:0 "Bu artık çıkarlarımıza hizmet etmiyor."
 lar_ratify_the_stresa_front.1.desc:0 "Toprak tavizleri karşılığında Fransa ile bir ittifakı resmileştiren Stresa Anlaşmalarının imzalanması ve onaylanması için hazırlıklar sürüyor. Diplomatik servisin aylarca süren çalışmasının ardından, geriye kalan tek şey kağıda mürekkep dökmek."
 lar_ratify_the_stresa_front.1.t:0 "Stresa Cephesinin Onaylanması"
 lar_ratify_the_stresa_front.2.a:0 "Fransa sözlerini tutar."
 lar_ratify_the_stresa_front.2.b:0 "Durum değişti."
 lar_ratify_the_stresa_front.2.desc:0 "[From.GetAdjective] hükûmetine verdiğimiz sözü yerine getirme zamanı geldi. İttifak artık yürürlükte olduğuna göre, Cibuti'yi onların kontrolüne devretmekle yükümlüyüz."
 lar_ratify_the_stresa_front.3.a:0 "Kara bir gün."
 lar_ratify_the_stresa_front.3.desc:0 "Ani bir geri dönüşle, [From.GetAdjective] hükûmeti, Stresa Anlaşmalarını onaylama konusundaki önceki taahhüdünü artık yerine getirmemeye karar verdi. Diplomatik kanallar aracılığıyla bir açıklama alma girişimleri, [From.GetAdjective] diplomatlarının ani fikir değişikliği karşısında eşit derecede şok olmuş görünmesiyle başarısız oldu."
 lar_ratify_the_stresa_front.3.t:0 "[From.GetNameDefCap] İttifakı Onaylamayı Reddediyor"
 lar_ratify_the_stresa_front.4.a:0 "Söz verdik."
 lar_ratify_the_stresa_front.4.b:0 "Çıkarlarımız ayrıldı."
 lar_ratify_the_stresa_front.4.desc:0 "[FRA.GetNameDefCap] ve [ITA.GetNameDef] Stresa Anlaşmalarını zaten imzaladılar ve ittifaklarını resmileştirdiler. Şimdi pazarlığın kendi payımıza düşen kısmını yerine getirme, Anlaşmaları imzalama ve Somali'deki mülklerimizi [ITA.GetAdjective] kontrolüne devretme sırası bizde."
 lar_rescue_mussolini.1.a:0 "Denemeye değerdi."
 lar_rescue_mussolini.1.desc:0 "Mussolini'yi kurtarma girişimi ağır can kaybıyla başarısız oldu. Asker ve teçhizatla aşırı yüklenmiş olan, paraşütçüleri taşımak için kullanılan planörlerin birkaçı bir dağı geçmek için yeterli irtifa kazanamadı ve kötü havada düştü. Saldırı gücünün sadece küçük bir kısmı mevcutken, komutan hız ve sürpriz üzerine kumar oynamaya karar verdi. \n\nNe yazık ki, hapishane gardiyanları bu sırada tam teyakkuzdaydı ve saldırı grubu otele zorla girmeye çalıştığında ateş açtı. Kısa bir çatışmadan sonra, konumu savunulamaz hale gelen ve mühimmatı azalan komutan, gücünün teslim olmasını teklif etti."
 lar_rescue_mussolini.1.t:0 "Kurtarma Girişimi Başarısız Oldu"
 lar_rescue_mussolini.2.a:0 "Dostlarımızı unutmayız."
 lar_rescue_mussolini.2.desc:0 "Mussolini'yi kurtarma görevi başarılı oldu. Küçük paraşütçü birimi otele yakın bir yere başarıyla indi ve tek bir kurşun bile atılmadan binayı bastı. Yerel gardiyanlar direnişin umutsuzluğunu anladıktan sonra geri çekildi. Mussolini daha sonra bir Fiesler Storch ile uçuruldu ve dost hatlarına geri döndü, oradan [GER.GetLeader] ile görüşmek üzere seyahat edecek."
 lar_rescue_mussolini.2.t:0 "Mussolini Kurtarıldı"
 lar_spain.1.a:0 "İspanya ancak Faşizmin sönmesiyle hayatta kalabilir!"
 lar_spain.1.b:0 "İspanya ancak İkinci Cumhuriyet'in küllerinden yeniden doğabilir!"
 lar_spain.1.desc:0 "Özerk Haklar İspanyol Konfederasyonu'nun kitlesel bir seçim kampanyasına rağmen, 1936 seçimlerini kazanmış görünen, İspanyol Sosyalist İşçi Partisi ve Cumhuriyetçi Sol tarafından Anarşistler, Komünistler ve Sendikacıların yardımıyla kurulan solcu Halk Cephesi'dir. Ağır bir şekilde bölünmüş İspanyol siyasi manzarasını gözler önüne seren Halk Cephesi'nin halk oylamasındaki liderliği, sandalyelerdeki rahat liderliğinden çok daha dar görünüyor.\n\nÖnümüzdeki günlerde ve haftalarda Başkan [Root.GetLeader]'in liderliğinde kurulacak olan yeni hükûmet her ne olursa olsun, giderek yabancılaşan ve düşmanca bir siyasi Sağ ile uğraşmak zorunda kalacak. Bu nedenle, son seçim sonuçlarının ülkemizi saran siyasi şiddeti ve toplumsal huzursuzluğu çözmek yerine, sadece daha da kötüleştirmesi muhtemel görünüyor."
 lar_spain.10.a:0 "Devrimimiz o kadar kolay söndürülmeyecek!"
 lar_spain.10.desc:0 "Şüphesiz, kendimizi yönetmedeki devam eden bağımsızlığımızdan rahatsız olan İkinci Cumhuriyet hükûmeti, Stalinist müttefikleriyle birlikte, topraklarımızdaki kilit stratejik yerlerin ve binaların kontrolünü ele geçirmeye çalıştı. Bu girişimleri geri püskürtmek, eski müttefiklerimizle bir çatışmaya yol açtı ve bu o zamandan beri tam teşekküllü sokak çatışmalarına tırmandı.\n\nUzlaşmazlıkları içinde hükûmet, bizi etkili bir şekilde onlarla savaş durumuna soktu ve bunu yaparak Milliyetçi konumunu büyük ölçüde güçlendirdi."
 lar_spain.10.desc_2:0 "Şüphesiz, kendimizi yönetmedeki devam eden bağımsızlığımızdan rahatsız olan İkinci Cumhuriyet hükûmeti, Stalinist müttefikleriyle birlikte, topraklarımızdaki kilit stratejik yerlerin ve binaların kontrolünü ele geçirmeye çalıştı. Bu girişimleri geri püskürtmek, eski müttefiklerimizle bir çatışmaya yol açtı ve bu o zamandan beri tam teşekküllü sokak çatışmalarına tırmandı.\n\nBarış içinde yaşamamıza izin vermek yerine, uzlaşmaktan ve kontrolü bırakmaktan kaçınmak için Milliyetçilere karşı zorla kazandığımız zaferi riske atıyorlar!"
 lar_spain.10.t:0 "Hükûmet Baskını!"
 lar_spain.100.a:0 "Bir kez daha çökecekler"
 lar_spain.100.b:0 "Yeniden bir dünya gücüyüz!"
 lar_spain.100.d:0 "Bugün itibarıyla, [SPR.GetLeader], tüm Hispanik halkının [SPR.GetNameDef] sancağı altında birleştiğini duyurdu. Amaçlarının tüm Hispanik halkını refaha ulaştırmak ve İmparatorluğun bin yıl daha ayakta kalmasını sağlamak olduğunu belirttiler ve ayrıca ulusal görevlerinin henüz sona ermediğini ifade ettiler."
 lar_spain.100.t:0 "Hispaniklerin Birleşmesi!"
 lar_spain.11.a:0 "Ama ilerleme kaydediyoruz."
 lar_spain.11.desc:0 "Fanatik çatışmalara rağmen, son Karlist direniş cepleri kuvvetlerimiz tarafından yenilgiye uğratıldı. Sonuç olarak çatışma büyük ölçüde basitleşse de, mücadelemiz kalan düşmanlarımıza karşı devam ediyor."
 lar_spain.11.t:0 "Karlistler Yenildi"
 lar_spain.12.desc:0 "Falanjist kuvvetler, son büyük kalelerinin ele geçirilmesinin ardından topluca teslim oldu ve devam eden münferit direnişe rağmen bu, Falanj'ın organize ordusunun sonu anlamına geliyor. Sonuç olarak çatışma büyük ölçüde basitleşse de, mücadelemiz kalan düşmanlarımıza karşı devam ediyor."
 lar_spain.12.t:0 "Falanj Yenildi"
 lar_spain.13.desc:0 "Milliyetçilerin uğradığı en son askeri yenilginin ardından General Franco, tüm kuvvetlerinin teslim olduğunu duyurdu. Sonuç olarak çatışma büyük ölçüde basitleşse de, mücadelemiz kalan düşmanlarımıza karşı devam ediyor."
 lar_spain.13.t:0 "Milliyetçiler Yenildi"
 lar_spain.14.desc:0 "Anarşist direnişi, şiddetli olmasına rağmen, son haftalarda giderek daha düzensiz hale geldi. Bugünkü askeri zafer nihayet Savunma Konseyi'nden koşulsuz bir teslimiyeti tetikledi, ancak bireysel komünlerin emri tanımayı reddettiği yerlerde münferit çatışmalar devam ediyor. Sonuç olarak çatışma büyük ölçüde basitleşse de, mücadelemiz kalan düşmanlarımıza karşı devam ediyor."
 lar_spain.14.t:0 "Anarşistler Yenildi"
 lar_spain.15.desc:0 "POUM direnişi, şiddetli olmasına rağmen, son haftalarda giderek daha düzensiz hale geldi. Bugünkü askeri zafer nihayet komünist liderlikten koşulsuz bir teslimiyeti tetikledi ve bunun üzerine kuvvetlerimiz artık rakipsiz olan kalelerine girmeye başladı. Sonuç olarak çatışma büyük ölçüde basitleşse de, mücadelemiz kalan düşmanlarımıza karşı devam ediyor."
 lar_spain.15.t:0 "POUM Yenildi"
 lar_spain.16.desc:0 "Bir dizi son askeri yenilgiden sonra ve kontrol ettikleri toprağın yarımadanın sadece bir kısmına indiğini gören İkinci Cumhuriyet'in askeri liderleri, hükûmeti devirip barış istediler. Bunu önlemek için bir başka Komünist ayaklanması tetiklense de, kalan Cumhuriyetçi kuvvetler bunları yendi ve şimdi, başka pek bir çareleri kalmadan, koşulsuz bir teslimiyeti kabul ettiler.\n\nSonuç olarak çatışma büyük ölçüde basitleşse de, mücadelemiz kalan düşmanlarımıza karşı devam ediyor."
 lar_spain.16.t:0 "İkinci Cumhuriyet Yenildi"
 lar_spain.17.desc:0 "Bir dizi son askeri yenilgiden sonra ve kontrol ettikleri toprağın yarımadanın sadece bir kısmına indiğini gören komünist askeri liderler nihayet barış istediler. Sonuç olarak çatışma büyük ölçüde basitleşse de, mücadelemiz kalan düşmanlarımıza karşı devam ediyor."
 lar_spain.17.t:0 "Stalinistler Yenildi"
 lar_spain.18.a:0 "Çok daha fazla oyalanmasak iyi olur."
 lar_spain.18.a_tt:0 "Bu Milli Ruh, İç Savaşın başlangıcında kaldırılacaktır.\n"
 lar_spain.18.desc:0 "Planlarımız tamamlandı ve darbeyi başlatmak için pozisyondayız. Ancak, 1932 Sanjurjada darbe girişiminin hazin başarısızlığının tekrarını önlemek için, siyasi iklimin en olgun olduğu zamana kadar beklemeliyiz. Uygun zamanı beklerken izlerimizi örtmek için kaynaklarımızı harcayacağız..."
 lar_spain.18.t:0 "İsyan Zamanını Kolluyor"
 lar_spain.19.a:0 "Güçlü bir lidere ihtiyacımız var; neden onlar olmasın?"
 lar_spain.19.b:0 "Kendi çıkarlarımızı kendimiz savunabiliriz."
 lar_spain.19.desc:0 "[From.GetAdjective] diplomatları, dış politikamızı kendilerininkine bağlamamızı talep ederek, [From.GetNameDef]'in küresel meselelerde 'Hispanik dünyanın liderliğini üstleneceğini' iddia etti."
 lar_spain.19.t:0 "[From.GetNameDefCap] Boyun Eğme Talep Ediyor"
 lar_spain.2.a:0 "...birleşik bir Milliyetçi Cephe olarak kazanacağımız bir savaş!"
 lar_spain.2.b:0 "...Falanj liderliğinde kazanacağımız bir savaş!"
 lar_spain.2.c:0 "...Tanrı, Vatan ve Kral adına kazanacağımız bir savaş!"
 lar_spain.2.d:0 "...demokratik ilkelerimize sadık kalarak kazanacağımız bir savaş!"
 lar_spain.2.desc:0 "Bu sabah tam saat 5:00'te, Kuzey Afrika garnizonlarıyla temasın kesilmesinden tam bir gün sonra, büyük şehirlerdeki tüm hükûmet kurumlarının ve stratejik konumların kontrolünü ele geçirmek amacıyla İspanya genelinde iyi hazırlanmış bir askeri operasyon başlatıldı. Ordu, Donanma ve Hava Kuvvetleri'nin büyük bir kısmı hükûmet emirlerine yanıt vermeyi kesti, aynı zamanda ülkenin Kuzeyinde Karlist milisler isyan etti.\n\nBu darbe girişiminin tam başarısı, yalnızca hızlı hareket ederek hedeflenen yerlerin ve şehirlerin çoğunun kontrolünü elinde tutmayı başaran gayriresmi halk milisleri tarafından engellendi. Ancak, ilk hedeflerine ulaşmadaki bu başarısızlığa rağmen, isyan liderlerinin 1932'de olduğu gibi güçlü konumlarından gönüllü olarak vazgeçmeleri pek olası görünmüyor. Her iki tarafın da uzlaşmaya yanaşmamasıyla, mevcut durumun ülke çapında bir iç savaşa tırmanmasının yolu ardına kadar açık..."
 lar_spain.2.e:0 "...işçinin cesaretiyle kazanacağımız bir savaş!"
 lar_spain.2.f:0 "...komünal devrimci mücadeleyle kazanacağımız bir savaş!"
 lar_spain.2.t:0 "İspanya İç Savaşı"
 lar_spain.20.a:0 "Onları zafere taşıyacağız."
 lar_spain.20.desc:0 "Israrlarımız üzerine, [From.GetAdjective] hükûmeti Hispanik dünyayı ilgilendiren uluslararası konularda liderliğimizi kabul etti."
 lar_spain.20.t:0 "[From.GetNameDefCap] Boyun Eğiyor"
 lar_spain.21.a:0 "O zaman onlara liderliğimizin faydalarını zorla göstereceğiz."
 lar_spain.21.desc:0 "Israrlarımıza rağmen, [From.GetAdjective] hükûmeti Hispanik dünyayı ilgilendiren uluslararası konularda liderliğimizi reddetti. Kendi dış politikalarını izlemeye devam edecekler."
 lar_spain.21.t:0 "[From.GetNameDefCap] Talepleri Reddediyor"
 lar_spain.22.a:0 "Onlara elimizden gelen yardımı sağlamalıyız."
 lar_spain.22.b:0 "Şu anda ayıracak hiçbir şeyimiz yok."
 lar_spain.22.desc:0 "[From.GetAdjective] hükûmeti, Cumhuriyetçilere karşı verdikleri mücadelede maddi yardım talep eden bir haber gönderdi. İç savaş özellikle yıkıcı oluyor ve ikmallerini tüketiyor. Sağlayacağımız herhangi bir yardımın komünizm tehdidini yenmede paha biçilmez olacağını garanti ediyorlar."
 lar_spain.22.t:0 "[From.GetNameDefCap] Yardım Talep Ediyor"
 lar_spain.23.a:0 "Yardımlarını unutmayacağız."
 lar_spain.23.desc:0 "[From.GetAdjective] hükûmeti, komünizmi kontrol altında tutma mücadelemizde bize yardımcı olmak için maddi destek göndereceklerini bildiriyor."
 lar_spain.23.t:0 "[From.GetNameDefCap] Yardım Gönderiyor"
 lar_spain.24.a:0 "İspanyol kanıyla komünizm dizginlenirken onlar yan gelip yatıyor."
 lar_spain.24.desc:0 "[From.GetAdjective] diplomatları, maalesef şu anda bize yardım sağlayamadıklarını bildiriyorlar."
 lar_spain.24.t:0 "[From.GetNameDefCap] Yardım Göndermiyor"
 lar_spain.25.a:0 "Böyle bir pakt bağımızı ölçülemez derecede güçlendirecektir."
 lar_spain.25.b:0 "Eylem bağımsızlığımızı korumalıyız."
 lar_spain.25.desc:0 "[From.GetAdjective] elçileri, hem karşılıklı savunmamızı güçlendirecek hem de İberya yarımadasında barışı koruyacak bir teklifle geldiler.\n\nÖnerilen pakt, her tarafı diğerinin üyesi olduğu herhangi bir ittifaka katılmakla yükümlü kılacak ve aynı zamanda her iki üyenin de diğerinin girdiği herhangi bir çatışmada, ister saldırgan olarak ister savaş ilan edilerek, aynı tarafta yer almasını zorunlu kılacaktır."
 lar_spain.25.t:0 "İberya Paktı"
 lar_spain.26.a:0 "Gerçekten de sadık dostlar."
 lar_spain.26.desc:0 "[From.GetNameDefCap], önerilen İberya Paktı'nın tüm kalbiyle kabul edildiğini bildiriyor. Bundan böyle kendimizi bulabileceğimiz her ittifak veya savaşta bizimle birlikte olacaklar."
 lar_spain.27.a:0 "Farkında olmadan kendilerini zayıflatıyorlar."
 lar_spain.27.desc:0 "[From.GetNameDefCap], önerilen İberya Paktı'nı, dış politikalarında bağımsız hareket etme yeteneklerini çok fazla kısıtlayacağından korktukları için reddettiklerini bildiriyor."
 lar_spain.28.a:0 "Kendimizi adadık."
 lar_spain.28.desc:0 "[iberian_pact_invitee.GetNameDefCap], [iberian_pact_invitee.GetFactionName]'e kabul edildi ve bu nedenle, İberya Yarımadası'nda barışın korunmasını sağlamak için, pazarlığın kendi payımıza düşen kısmını yerine getirme ve bu ittifaka katılma zamanı geldi."
 lar_spain.28.t:0 "İberya Paktı Yürürlüğe Girdi"
 lar_spain.29.desc:0 "Zamanı geldi. [iberian_pact_war_target.GetNameDefCap] düşmanlarıyla savaşa girdi ve bu nedenle, Paktımızın şartları uyarınca, onlara katılmalı ve dış dünyaya karşı birleşik bir cephe sunmalıyız."
 lar_spain.30.a:0 "Ne mükemmel bir fikir."
 lar_spain.30.b:0 "Bu ülkelerle ittifak kurmak şu anki en iyi çıkarımıza değil."
 lar_spain.30.desc:0 "İş birliğimizin giderek arttığını gören [From.GetAdjective] hükûmeti, şimdi tam teşekküllü bir ittifak için bir teklifle geldi; bu ittifak, kendimiz ve İspanyolların yanı sıra İtalyanları ve Fransızları da içerebilir."
 lar_spain.30.t:0 "Latin Bloku"
 lar_spain.31.a:0 "Bu yeni filizlenen ittifakın paha biçilmez bir üyesi olacaklar."
 lar_spain.31.desc:0 "[From.GetAdjective] hükûmeti, Latin Bloku'nu kurma teklifimizi kabul ettiklerini bildiriyor."
 lar_spain.32.a:0 "Belki daha sonra fikirlerini değiştirirler."
 lar_spain.32.desc:0 "[From.GetAdjective] hükûmeti, şu anda bir Latin ittifakına katılmakla ilgilenmediklerini bildiriyor."
 lar_spain.33.a:0 "[union_militar_target_state_1.GetName]'de Unión Militar müttefiklerini güvence altına al."
 lar_spain.33.b:0 "[union_militar_target_state_2.GetName]'de Unión Militar müttefiklerini güvence altına al."
 lar_spain.33.c:0 "[union_militar_target_state_3.GetName]'de Unión Militar müttefiklerini güvence altına al."
 lar_spain.33.desc:0 "Karlist davasının ordu içinde hala müttefikleri var. Onlarla koordine olmak ve yardımlarını almak, ayaklanmamızın başarısını sağlamada büyük bir yol kat edecektir."
 lar_spain.33.t:0 "Unión Militar Española"
 lar_spain.33_tt:0 "Karlist ayaklanması başladığında §Y3 piyade§! taburlu 5 iyi eğitimli Karlist Requeté yaratacaktır.\n"
 lar_spain.34.a:0 "Kral'ın iradesi yerine getirilmeli. Xavier yeni Kralımız olacak!"
 lar_spain.34.a_tt:0 "Monarşi yeniden kurulduğunda Xavier of Bourbon-Parma Kral olacaktır.\n"
 lar_spain.34.b:0 "Hanedan devamlılığı sürdürülmelidir. XIII. Alfonso Kralımız olacak!"
 lar_spain.34.b_tt:0 "Monarşi yeniden kurulduğunda XIII. Alfonso Kral olacaktır.\n"
 lar_spain.34.c:0 "Habsburg taht talibi kendini kanıtladı"
 lar_spain.34.c_tt:0 "Monarşi yeniden kurulduğunda Karl Pius von Habsburg Kral olacaktır.\n"
 lar_spain.34.desc:0 "Çocuksuz Alfonso Carlos'un ölümüyle Karlist soyu tükendi ve sonuç olarak Karlist hareketi içinde bir bölünme ortaya çıktı.\n\nAlfonso Carlos'un kendisi tarafından atanan halefinin iddiasını destekleyecek olanlar var: Xavier of Bourbon-Parma, ancak onun taht üzerinde hanedan iddiası yok. Diğerleri ise, II. Isabella'dan gelen hain soyun bir dalı olmasına rağmen taht üzerinde hanedan iddiası olan sürgündeki kral XIII. Alfonso'nun iddiasını desteklemeyi tercih ediyor.\n\nEğer bu soru hızla ele alınmazsa, desteğimizin çeşitli didişen kamplara bölünmesine neden olabilir."
 lar_spain.34.t:0 "Veraset Sorunu"
 lar_spain.35.a:0 "Bugün bir asırlık adaletsizlik düzeltildi. Yaşasın Kral!"
 lar_spain.35.desc:0 "İspanya'da yaşanan uzun ve çalkantılı siyasi sürecin ardından monarşik düzen yeniden tesis edildi. Bu gelişme, ülkenin yönetim biçiminde önemli bir değişikliğe işaret ederken İspanyol siyasetinde yeni bir dönemin kapısını araladı. Madrid'deki gelişmeler Avrupa başkentlerinde de yakından takip ediliyor. Monarşinin yeniden kurulmasının İspanya'nın iç istikrarına, dış politikasına ve Avrupa'daki konumuna ne ölçüde etki edeceği ise henüz belirsizliğini koruyor."
 lar_spain.35.t:0 "Monarşinin Restorasyonu"
 lar_spain.36.a:0 "Tancalıların hakları için biz ayağa kalkmazsak, kim kalkacak?"
 lar_spain.36.b:0 "Şimdilik sözleri yeterli."
 lar_spain.36.desc:0 "1924 Tanca Protokolü'nü bariz bir şekilde hiçe sayarak, [From.GetAdjective] birlikleri, ancak bir işgal gücü olarak tanımlanabilecek bir şekilde Tanca Uluslararası Bölgesi'ne girdi. İspanyol milliyetçilerinin bölgenin tamamen ilhak edilmesi yönündeki çağrılarına rağmen, [From.GetAdjective] büyükelçisi bunun sadece 'geçici bir savaş zamanı tedbiri' olduğunu ve şehrin daha sonra savaş öncesi statüsüne döneceğini temin ediyor."
 lar_spain.36.t:0 "Tanca'nın İşgali"
 lar_spain.36_tt:0 "Eğer §Y[SPA.GetName]§! geri adım atmazsa, şunları alacağız:\n"
 lar_spain.37.a:0 "Onların boş tehditlerinden korkmayacağız."
 lar_spain.37.b:0 "O zaman geri adım atmalıyız."
 lar_spain.37.desc:0 "[FROM.GetNameDefCap], Tanca'yı işgalimize sert ve resmi bir itirazda bulundu. Eylemlerimizi yasadışı olarak görüyorlar ve derhal çekilmezsek bizi Uluslararası Bölge'den çıkarmak için askeri güç kullanma imasında bulunacak kadar ileri gittiler."
 lar_spain.38.a:0 "Yeniden İspanyol!"
 lar_spain.38.desc:0 "Beklendiği gibi, zayıf [From.GetAdjective] hükûmeti Tanca'yı işgalimize meydan okumaya cesaret edemedi. Şehri ulusumuza daha tam olarak entegre etmekte özgürüz."
 lar_spain.39.a:0 "Başka bir savaşı göze alamayız. Kabul etmeliyiz."
 lar_spain.39.b:0 "O kadar kolay alamayacaklar!"
 lar_spain.39.desc:0 "[From.GetAdjective] diplomatları bize bir ültimatom verdi ve Kuzey Afrika üzerindeki kontrolü derhal [From.GetNameDef]'e bırakmamızı talep etti. Şüphesiz mevcut uluslararası konumumuzun zayıflığından yararlanmayı planlıyorlar..."
 lar_spain.39.t:0 "[From.GetNameDefCap] Kuzey Afrika'yı Talep Ediyor"
 lar_spain.40.a:0 "Çok verimli."
 lar_spain.40.desc:0 "[From.GetNameDefCap] taleplerimizi kabul etti ve diplomatları bize Kuzey Afrika'nın kontrolünün devri için derhal düzenlemeler yaptıklarını temin ediyor."
 lar_spain.40.t:0 "[From.GetNameDefCap] Talepleri Kabul Ediyor"
 lar_spain.41.a:0 "O zaman zorla almak zorunda kalacağız."
 lar_spain.41.desc:0 "[From.GetAdjective] diplomatları, Kuzey Afrika için tüm İspanyol taleplerini kategorik olarak reddettiklerini bize bildirdi."
 lar_spain.41.t:0 "[From.GetNameDefCap] Talepleri Reddediyor"
 lar_spain.42.a:0 "Geçerli bir iddiası var - hevesle kabul ediyoruz. Yaşasın Kral!"
 lar_spain.42.b:0 "Fransa asla İspanya'ya boyun eğmeyecek!"
 lar_spain.42.desc:0 "Yakın zamanda İspanyol tahtına çıkan Kral [From.GetLeader], taç üzerindeki Meşrutiyetçi iddiasını temel alarak Fransız tahtı üzerindeki tasarılarını şimdiden belli etti.\n\nÜlkemizdeki Meşrutiyetçilerin son siyasi zaferiyle, Kral şimdi bu tasarılar üzerinde nihayet harekete geçmenin uygun olduğunu düşündü ve mümkün olan tüm hızla Reims'te taç giyme arzusunu resmen ilan etti."
 lar_spain.42.t:0 "[From.GetNameDefCap] Fransız Tahtını Talep Ediyor"
 lar_spain.43.a:0 "Her şey olması gerektiği gibi."
 lar_spain.43.desc:0 "[From.GetAdjective] Meşrutiyetçi hükûmet, Kral [Root.GetLeader]'in talebini duydu ve şimdi bize Fransız tacı üzerindeki haklı iddiasını tanıdıklarını resmen bildirdi. Taç giyme törenini düzenlemek için derhal düzenlemeler yapacaklarını temin ediyorlar."
 lar_spain.43.t:0 "[From.GetNameDefCap] İddiayı Tanıyor"
 lar_spain.43_tt:0 "Taç giyme töreni için hazırlıklar başlayacak."
 lar_spain.44.a:0 "[Root.GetLeader] ne olursa olsun Fransa Kralı olacak."
 lar_spain.44.desc:0 "Kral [Root.GetLeader]'in Fransız tacı üzerindeki haklı iddiasına rağmen, [From.GetAdjective] hükûmeti son anda geri adım atmış görünüyor. Fransa'nın İspanyol kontrolü algısı karşısında halkın huzursuzluğuna ilişkin endişeleri gerekçe göstererek, resmi bir taç giyme törenini 'üzülerek reddediyorlar'."
 lar_spain.44.t:0 "[From.GetNameDefCap] İddiayı Reddediyor"
 lar_spain.45.a:0 "Akıllıca konuşuyorlar."
 lar_spain.45.b:0 "Portekiz asla isteyerek İspanyollar tarafından yönetilmeyecek!"
 lar_spain.45.desc:0 "Tıpkı 1580 ile 1640 arasında olduğu gibi, [From.GetNameDef], [From.GetLeader] altında iki ulusumuzun birliğini öneriyor. [From.GetAdjective] diplomatları, birleşik bir İberya'nın tek bir lider altında dünyaya gösterebileceği gücü düşünmemizi istiyor."
 lar_spain.45.t:0 "İberya Birliği"
 lar_spain.46.a:0 "Akıllıca seçim yaptılar. Birlikte daha güçlüyüz!"
 lar_spain.46.desc:0 "[From.GetNameDefCap], İberya'yı [Root.GetLeader] liderliğinde birleştirme teklifimizi kabul etti. Hükûmet aygıtlarını bizimkine entegre etmeye başlamak için gerekli düzenlemeleri yapacaklar."
 lar_spain.46.t:0 "İberya Birliği - [From.GetNameDefCap] Kabul Ediyor"
 lar_spain.47.a:0 "Teklifleri kabul edilebilir."
 lar_spain.47.desc:0 "[From.GetNameDefCap], İber yarımadasını ortak liderlik altında birleştirme fikrini reddetti. Kapsamlı müzakerelere rağmen, [From.GetAdjective] delegasyonunun tutumu etkili bir şekilde \"yeterince sertseniz gelin alın\" şeklinde özetlenebilir."
 lar_spain.47.t:0 "İberya Birliği - [From.GetNameDefCap] Reddediyor"
 lar_spain.48.a:0 "Bizi neden buna dahil etmek zorunda kaldılar?!"
 lar_spain.48.desc:0 "[From.GetNameDef]'deki çatışmalar son günlerde [Root.GetAdjective] sınır bölgelerine sıçradı ve [From.GetAdjective] Anarşist milisleri hızla yerel kasabalardan benzer düşünen bireyleri çekmeye başladı. Sınır kuvvetlerimizin hızlı hareket etmesine rağmen, çatışmaların şiddeti onları hazırlıksız yakaladı ve İç Savaşın her iki tarafından gelen savaşta eğitimli [From.GetAdjective] kuvvetleriyle ilk çatışmalardan sonra geri çekilmek zorunda kaldılar.\n\nO zamandan beri, [From.GetAdjective] Anarşist davasına destek, [Root.GetAdjective] toplumu içinde daha da yayıldı ve bu durum büyük ölçüde gizli dış destekten kaynaklanıyor.\n\nSonuç olarak, en iyi çabalarımıza rağmen, ulus etkili bir şekilde daha büyük [From.GetAdjective] İç Savaşı'na yakalandı."
 lar_spain.48.t:0 "Portekiz Anarşizmi"
 lar_spain.49.a:0 "Anarşist davaya desteklerini hevesle karşılıyoruz!"
 lar_spain.49.desc:0 "[Root.GetAdjective] çatışmaları [From.GetAdjective] sınırını aştığından beri, yerel Anarşist destekçiler davamıza akın etti. İyi planlanmış ve uygulanmış bazı 'teşviklerle', Anarşist yanlısı duygu [From.GetAdjective] toplumunun genç üyeleri arasında orman yangını gibi yayıldı.\n\n[Root.GetAdjective] silah depolarının bu [From.GetAdjective] Anarşist hücrelerine devredilmesi sonucunda, [From.GetNameDef]'deki durum, hükûmetin tam teşekküllü bir ayaklanmayı bastırdığı noktaya kadar tırmandı. Bu ayaklanmanın liderleri şimdi daha resmi ve doğrudan yardımımızı talep ettiler, küresel Anarşist mücadelede liderliği üstlenmemizi önerdiler ve çatışmalar yatıştıktan sonra bize daha resmi olarak katılmayı önerdiler."
 lar_spain.50.a:0 "Onları korumamız altına alacağız."
 lar_spain.50.desc:0 "Anarşist mücadelemizin [From.GetAdjective] kısmının lehimize sonuçlanmasıyla, [From.GetAdjective] hücreleri şimdi Savunma Konseyi'ne kabul edilmeyi talep ediyor."
 lar_spain.50.t:0 "Portekiz Anarşizmi - İç Savaş Bitiyor"
 lar_spain.51.a:0 "Onları [SOV.GetNameDef]'e göndereceğiz."
 lar_spain.51.b:0 "Onları [SPR_relocated_gold_reserves_selection_1.GetNameDefCap]'e göndereceğiz."
 lar_spain.51.c:0 "Onları [SPR_relocated_gold_reserves_selection_2.GetNameDefCap]'e göndereceğiz."
 lar_spain.51.d:0 "Onları [SPR_relocated_gold_reserves_selection_3.GetNameDefCap]'e göndereceğiz."
 lar_spain.51.desc:0 "Ulusumuzun altın rezervleri Milliyetçi ilerlemesi tarafından tehdit ediliyor. Harekete geçmeli ve rezervlerin güvenli bir şekilde yurt dışına taşınmasını sağlamalı, onları düşmanlarımızın elinden uzak tutmalıyız."
 lar_spain.51.t:0 "Altın Rezervlerini Yer Değiştir"
 lar_spain.52.a:0 "Belki de bu bir fırsat demektir..."
 lar_spain.52.desc:0 "[From.GetAdjective] hükûmeti, iç savaş süresince güvenli saklama için altın rezervlerini yurt dışına taşıdığından, [From.GetNameDef]'den sevkiyatlar ülkemize gelmeye başladı."
 lar_spain.52.t:0 "[From.GetNameDefCap] Altın Rezervlerini Yer Değiştiriyor"
 lar_spain.53.a:0 "Altın rezervlerine 'ödeme' olarak el koyacağız."
 lar_spain.53.b:0 "Bir [SPR.GetAdjective] zaferi yeterli bir ödeme olurdu."
 lar_spain.53.desc:0 "[SPR.GetAdjective] altın rezervlerinin ülkemize gelmesinin üzerinden bir süre geçti ve biz ödeme olmaksızın [SPR.GetNameDef]'e bol miktarda yardım göndermeye devam ettik. Hükûmet üyeleri bu işlerin komik durumu hakkında yorum yapmaya başlıyor."
 lar_spain.53.t:0 "İspanyol Altın Rezervleri"
 lar_spain.54.a:0 "Buna nasıl cüret ederler?!"
 lar_spain.54.a_tt:0 "§RBunun iç savaştan sonra ekonomimiz üzerinde etkileri olacak!§!\n"
 lar_spain.54.desc:0 "[From.GetNameDef]'deki diplomatlarımız tarafından [From.GetAdjective] hükûmetinin altın rezervlerimize el koyduğu bize bildirildi! İddiaya göre, resmi bir bildiriye bile gerek duymuyorlar ve bunun maddi yardımları için 'gecikmiş ödeme' almak için 'olağan bir mesele' olduğunu belirtiyorlar."
 lar_spain.54.t:0 "Altın Rezervlerine El Konuldu!"
 lar_spain.55.a:0 "Bu talihsiz bir durum..."
 lar_spain.55.desc:0 "Altın rezervlerimize el konulmasıyla, şimdi ulusun yeniden inşasını finanse etmek için acil bir külçe kıtlığı içinde buluyoruz kendimizi. Bu nedenle kamu sektörüne yapılan yatırımlar maalesef ertelenmek zorunda kalacak."
 lar_spain.55.t:0 "Hükûmet Finansman Kıtlığı"
 lar_spain.56.a:0 "Güvenimizi kazandılar."
 lar_spain.56.b:0 "Ama dizginleri sıkı tutmak daha da iyidir."
 lar_spain.56.desc:0 "Sadakatlerini kanıtlamaya ve Devrim için üzerlerine düşeni yapmaya hevesli olmalarına rağmen, [From.GetAdjective] temsilcileri özerkliğin artırılması için davalarını savundular. Eğer dizginleri biraz gevşetirsek, davamıza çok daha iyi yardım edebileceklerini savunuyorlar."
 lar_spain.56.t:0 "[From.GetNameDefCap] Özerklik İçin Başvuruyor"
 lar_spain.57.a:0 "İlerleme!"
 lar_spain.57.desc:0 "[From.GetNameDef]'deki temsilcilerimiz, [From.GetAdjective] hükûmetinin bize daha fazla özerklik vermeyi uygun gördüğünü bildiriyor."
 lar_spain.57.t:0 "[From.GetNameDefCap] Özerklik Veriyor"
 lar_spain.58.a:0 "Bize güvenmiyorlar mı?"
 lar_spain.58.desc:0 "[From.GetNameDefCap]'deki temsilcilerimiz, [From.GetAdjective] hükûmetinin daha fazla özerklik başvurumuzu reddettiğini bildiriyor."
 lar_spain.58.t:0 "[From.GetNameDefCap] Özerkliği Reddediyor"
 lar_spain.59.a:0 "İşçinin davası büyük ölçüde güçlenirdi!"
 lar_spain.59.b:0 "Devrimi kendi başımıza daha iyi yayabiliriz."
 lar_spain.59.desc:0 "Ortak ideolojik çıkarlarımızı gören [From.GetNameDefCap], birleşik bir İberya için bir teklifle elçiler gönderdi. Farklılıklarımızı bir kenara bırakıp [From.GetAdjective] liderliği altında güçlerimizi birleştirerek, İberya Devrimimizin başarısını daha iyi sağlayabileceğimizi öneriyorlar."
 lar_spain.59.t:0 "Kızıl Bir İberya"
 lar_spain.6.a:0 "O zaman zamanımızı bekleyecek ve doğru zaman geldiğinde saldıracağız."
 lar_spain.6.desc:0 "Arkamızda sadece bir haftalık çatışma varken, İspanyol kırsalının büyük miktarda teçhizatın taşınması için pek uygun olmadığı şimdiden anlaşılıyor. Cephe hatlarımızı ve taarruzlarımızı ikmal etmede zorluklar ortaya çıkıyor ve her yerde aynı anda savaşmaya devam edersek daha da kötüleşecek."
 lar_spain.6.t:0 "İç Savaş Cepheleri Sağlamlaşıyor"
 lar_spain.60.a:0 "Birlikte daha güçlüyüz."
 lar_spain.60.desc:0 "[From.GetNameDefCap], tekliflerimize onayla yanıt verdi - birleşik bir sosyalist İberya kavramını kabul ediyorlar."
 lar_spain.60.t:0 "Kızıl Bir İberya - [From.GetNameDefCap] Kabul Ediyor"
 lar_spain.61.a:0 "Ne kadar yanıldıklarını henüz bilmiyorlar."
 lar_spain.61.desc:0 "[From.GetNameDefCap], birleşik bir sosyalist İberya teklifimizi açıkça reddetti. Birçok ortak çıkarımız olduğunu kabul etmekle birlikte, bunları iki bağımsız ulus olarak takip etmek için daha donanımlı olduğumuzu savunuyorlar."
 lar_spain.61.t:0 "Kızıl Bir İberya - [From.GetNameDefCap] Reddediyor"
 lar_spain.62.a:0 "Bu isyanı ezeceğiz!"
 lar_spain.62.desc:0 "Sürekli [From.GetAdjective] müdahalesi ve [From.GetNameDef]'den yasadışı destek alan yeraltı hücreleri, son aylarda yıllardır mücadele ettiğimiz yerel Komünist grupları cesaretlendirdi. Şüphesiz daha fazla dış yardım vaat edilen bu gruplar şimdi silahlandı ve ordudaki sadakatsiz unsurlarla birlikte büyük ölçekli bir ayaklanmada birleşerek, hükûmetin kontrolünü zorla ele geçirmeyi hedefliyor."
 lar_spain.62.t:0 "Komünist Ayaklanması!"
 lar_spain.63.a:0 "Ve alacaklar!"
 lar_spain.63.desc:0 "Beklendiği gibi, iyi yerleştirilmiş bazı maddi desteklerle, bir süredir [From.GetAdjective] hükûmetini rahatsız eden Komünist gruplar şimdi harekete geçirildi. Büyük ölçekli bir ayaklanma hükûmetin kontrolünü ele geçirmeye çalışıyor, ancak büyük ölçüde bizim desteğimize dayanıyor. Liderleri, idealist ve hevesli olsalar da, bir iç savaş yürütme konusunda çok az deneyime sahipler ve şimdi liderlik ve yardım için bize başvurdular."
 lar_spain.63.t:0 "[From.GetNameDefCap]'de Komünist Ayaklanması!"
 lar_spain.64.a:0 "Bize güveniyorlar ve kendi riskimize rağmen onlara yardım etmeliyiz."
 lar_spain.64.b:0 "Onlara yardım etmek için kendi siyasi istikrarımızı riske atamayız."
 lar_spain.64.desc:0 "[From.GetNameDef]'deki siyasi durum uzun süredir istikrarsız olsa da, çatışmanın şiddetinin [From.GetAdjective] hükûmetini şaşırttığı görülüyor. Faşizme karşı mücadelelerinde onlara yardımcı olmak için toplayabildiğimiz her türlü yardımı talep ettiler ve bu kritik zamanda çok fazla oyalanmamamızı istiyorlar.\n\nCumhuriyetçi hükûmetin mevcut iç savaşı dış yardım olmadan kazanıp kazanamayacağı şüphelidir ve demokratik bir İspanya'nın zaferi arzu edilen bir sonuç olsa da, bu yardımı sağlamanın kendi ülkemizdeki Komünist sempatizanları cesaretlendirmesi muhtemeldir."
 lar_spain.64.t:0 "[From.GetNameDefCap] Yardım Talep Ediyor"
 lar_spain.65.a:0 "Bu harika bir haber!"
 lar_spain.65.desc:0 "[From.GetAdjective] hükûmeti, bize sembolik bir yardımın ilk sevkiyatını göndereceklerini bildiriyor. Moralimizi artırmak için kritik olsa da, gerçek maddi etki ihmal edilebilir düzeydedir, ancak Fransızlar gelecekte daha önemli yardım sağlamak için seçenekleri araştırdıklarını temin ediyorlar."
 lar_spain.65.t:0 "[From.GetNameDefCap] Yardım Veriyor"
 lar_spain.66.a:0 "Ve Faşistlerle paylaşılan bir başka sınırın atmayacağına mı inanıyorlar?"
 lar_spain.66.desc:0 "Fransızlar, maalesef bize yardım gönderemediklerini, çünkü bunun iç siyasi istikrarlarını riske atacağını bildiriyorlar."
 lar_spain.66.t:0 "[From.GetNameDefCap] Talebi Reddediyor"
 lar_spain.67.a:0 "Bu uzlaşmazlığı ezeceğiz!"
 lar_spain.67.b:0 "Bunu kabul etmekten başka çaremiz yok."
 lar_spain.67.desc:0 "Görünüşe göre [From.GetAdjective] hükûmeti, son iç savaş zaferini kime borçlu olduğunu çabucak unuttu. Bu sabah, [From.GetNameDef]'deki temsilcilerimizle olan tüm iletişim aniden kesildi ve [From.GetLeader]'den bir duyuru devlet medyasından yayınlandı, [From.GetAdjective] halkını bir başka savaş çabası için harekete geçirmek amacıyla bariz bir propaganda yaydı.\n\nBu sabah ilerleyen saatlerde Moskova'ya resmi bir bağımsızlık bildirgesi teslim edildi."
 lar_spain.67.t:0 "[From.GetAdjective] Bağımsızlık Savaşı!"
 lar_spain.68.a:0 "Ve alacaklar."
 lar_spain.68.b:0 "Sovyetlerle olan ilişkimizi riske atamayız."
 lar_spain.68.desc:0 "[From.GetNameDefCap], [SOV.GetNameDef] ile olan bağımsızlık savaşlarında maddi yardım talebiyle bizimle temasa geçti."
 lar_spain.68.t:0 "[From.GetNameDefCap] Yardım Talep Ediyor"
 lar_spain.69.a:0 "Bu çok olumlu bir haber."
 lar_spain.69.desc:0 "[From.GetNameDefCap], yardım çağrımızı duydu ve şimdi bizi ödünç verme-kiralama yardım programlarına daha kapsamlı bir şekilde dahil etmeyi teklif ettiler."
 lar_spain.69.t:0 "[From.GetNameDefCap] Yardım Sağlıyor"
 lar_spain.6_tt:0 "\nHedeflenen eyaletlerdeki §RPlansız Taarruz§! muharebe cezalarını kaldırmaya olanak tanıyan Harita Üzeri §Yİç Savaş Taarruzları§! Kararlarının kilidini açar.\n"
 lar_spain.7.a:0 "Onların dik başlılığı onlara bizden daha pahalıya mal olacak!"
 lar_spain.7.desc:0 "Milliyetçi Cephe üzerindeki artan nüfuzumuzdan endişe duyan Karlistlerin sabrı tükendi ve meseleleri kendi ellerine almaya karar verdiler. Requeté'leri kuvvetlerimize döndü, aynı zamanda düşmanlarımıza karşı savaşa devam ediyorlar.\n\nBu aptalca eylemle neyi başarmayı umdukları kimsenin tahmini değil, ama şimdiye kadar sadece Cumhuriyetçi konumunu güçlendirmeye hizmet ediyor."
 lar_spain.7.desc_2:0 "Savaş sonrası yeni filizlenen hükûmet üzerindeki artan nüfuzumuzdan endişe duyan Karlistlerin sabrı tükendi ve meseleleri kendi ellerine almaya karar verdiler ve Requeté'leri kuvvetlerimize döndü.\n\nYeni hükûmet üzerindeki hakimiyetlerini kurmak için Cumhuriyetçilere karşı zorla kazandığımız zaferi riske atıyorlar!"
 lar_spain.7.t:0 "Karlist Ayaklanması!"
 lar_spain.70.a:0 "Bizi ikinci kez terk ediyorlar."
 lar_spain.70.desc:0 "[From.GetNameDefCap], şu anda bize yardım edemediklerini, bunun büyük bir kısmının davamıza yardım ederken görülmenin neden olabileceğinden korktukları iç ve uluslararası kamuoyu üzerindeki etkilere borçlu olduğunu bize bildirdi."
 lar_spain.70.t:0 "[From.GetNameDefCap] Yardımı Reddediyor"
 lar_spain.71.a:0 "[SOV.GetNameDef]'in ortadan kaldırılmasına kıyasla diğer her şey ikinci planda kalır."
 lar_spain.71.b:0 "Cumhuriyetçilerle bir antlaşma mı? Asla!"
 lar_spain.71.desc:0 "Her ikimiz de Komünistlerle savaşta olduğumuz için, [From.GetNameDefCap] bir Saldırmazlık Paktı önerdi. Bu, anlık olarak farklılıklarımızı göz ardı ederek daha acil olan Kızıl tehdide odaklanmamızı sağlayacaktır."
 lar_spain.71.t:0 "[From.GetNameDefCap] Saldırmazlık Paktı Talep Ediyor"
 lar_spain.72.a:0 "Daha büyük tehlikeyi fark ediyorlar."
 lar_spain.72.desc:0 "Akıllıca, [From.GetAdjective] hükûmeti bir Saldırmazlık Paktı teklifimizi kabul etti. Derhal yürürlüğe girecektir."
 lar_spain.72.t:0 "[From.GetNameDefCap] Saldırmazlık Paktı Veriyor"
 lar_spain.73.a:0 "Ne planlıyorlar?"
 lar_spain.73.desc:0 "[From.GetNameDefCap], bir Saldırmazlık Paktı teklifimizi duydu, ancak şu anda bunun kendi çıkarlarına en uygun olmadığını bize bildirdi."
 lar_spain.73.t:0 "[From.GetNameDefCap] Saldırmazlık Paktını Reddediyor"
 lar_spain.74.a:0 "Harika bir fikir. Sovyetlere ölüm!"
 lar_spain.74.b:0 "Avantajlarımızı kıskançlıkla korumalıyız."
 lar_spain.74.desc:0 "[From.GetAdjective], [SOV.GetNameDef] ile olan savaşlarında yardımımızı talep etti. Çok şeye ihtiyaçları olmadığını ve sadece bazı kritik istihbaratı paylaşmanın veya komuta kadrolarını [SOV.GetAdjective] taktiklerine daha iyi karşı koymak için eğitmemize yardım etmenin bile paha biçilmez olacağını temin ettiler."
 lar_spain.74.t:0 "[From.GetNameDefCap] Yardım Talep Ediyor"
 lar_spain.75.a:0 "Bu, Sovyetlere karşı mücadelemizde paha biçilmez olacaktır."
 lar_spain.75.desc:0 "Talebimizi değerlendirdikten sonra, [From.GetNameDef], karşılaştıkları [SOV.GetAdjective] stratejilerine daha iyi karşı koymak için komuta kadromuzu eğitecek askeri uzmanlar göndermeyi ve aynı zamanda bize belirli değerli istihbarat parçaları sağlamayı önerdi."
 lar_spain.75.t:0 "[From.GetNameDefCap] Yardım Veriyor"
 lar_spain.76.a:0 "Tüm sırlarını kıskançlıkla koruyorlar."
 lar_spain.76.desc:0 "Ricalarımıza rağmen, [From.GetNameDef], Sovyetlerle olan mücadelemizde bize herhangi bir yardım vermeyi reddetti. Sovyet cephesiyle ilgili onlardan yararlı bilgi alma girişimleri de bir sessizlik duvarıyla karşılaştı."
 lar_spain.76.t:0 "[From.GetNameDefCap] Yardımı Reddediyor"
 lar_spain.77.a:0 "Kral öldü. Yaşasın Kral!"
 lar_spain.77.desc1:0 "1931'de İkinci Cumhuriyet'in ilanından bu yana sürgünde yaşayan, İspanya'yı yöneten son Kral XIII. Alfonso, bugün erken saatlerde Roma'da öldü. Nispeten erken bir yaşta kalp sorunlarına yenik düşen, sürgün durumu ve [Root.GetNameDef]'deki mevcut durum nedeniyle Roma'ya gömülmesi bekleniyor.\n\nAlfonso'nun birinci ve ikinci oğulları 1933'te taht haklarından zaten feragat etmiş olsalar da ve bu nedenle üçüncü oğlu Infante Juan'ın varis gibi görünse de, merhum Kral'ın ikinci oğlu Infante Jaime'nin veraset hakkını yeniden teyit etmeyi düşündüğüne dair söylentiler var."
 lar_spain.77.desc2:0 "Bugün erken saatlerde Kral XIII. Alfonso, şiddetli göğüs ağrıları çektikten sonra Madrid'de beklenmedik bir şekilde öldü. Kral'ın naaşı yakında Madrid'deki San Jerónimo el Real kilisesinde katafalka konulacak ve halkın kraliyet cenazesinden önce saygılarını sunmasına olanak tanınacak.\n\nDaha önce sağırlığı nedeniyle veraset hakkından feragat etmiş olsa da, Kral'ın ikinci oğlu Infante Jaime, babasının ölümünden saatler sonra taht hakkını yeniden teyit etmekte gecikmedi. Ezici Karlist desteği karşısında, küçük kardeşi Infante Juan'ın bu iddiaya itiraz etmesi pek olası değil."
 lar_spain.77.t:0 "XIII. Alfonso Öldü"
 lar_spain.78.a:0 "Çok fazla cüret etti."
 lar_spain.78.desc:0 "İç savaşın başlamasından yalnızca birkaç gün sonra, darbenin seçilmiş lideri José Sanjurjo, İspanya'daki Milliyetçi güçlerin komutasını almak için Portekiz'den giderken bir uçak kazasında öldüğü için bizim tarafımız zaten bir trajediye maruz kaldı.\n\nGörünüşe göre General, iki yılı aşkın sürgünden sonra İspanyol topraklarına dönüşünde kahramanca bir \"cesur havacı\" izlenimi yaratma girişiminde bulunuyor. Mevcut olan daha büyük uçaklardan herhangi biri yerine küçük bir uçakla uçmakta ısrar etti ve ardından tüm ağır bagajlarının aynı uçağa yüklenmesini talep ederek uçağı aşırı yükledi. \n\n Kalkıştan hemen sonra kaza yaparak anında öldürüldü ve bunu yaparak Milliyetçi liderliği, kontrol için yarışan kavgacı generaller topluluğuna indirgedi."
 lar_spain.78.t:0 "Sanjurjo Öldü"
 lar_spain.78_tt:0 "§YJosé Sanjurjo Öldü.§!\n"
 lar_spain.79.a:0 "Krallık için harika bir gün!"
 lar_spain.79.desc:0 "Büyük bir şatafat ve kutlama eşliğinde, bugün Reims Katedrali'nde Kral [Root.GetLeader]'in taç giyme töreni gerçekleşti. Resmi törenden sonra, Kral dışarıda bekleyen coşkulu kalabalığı selamladı, uluslarının bir monarşi statüsüne geri döndüğünü görmekten mest olmuşlardı.\n\nTebaasına yönelik bir konuşmada, Kral şahsında simgelenen Fransız ve İspanyol ülkelerinin birliğini vurguladı. Dünyanın neresinde bir Fransız'ın çıkarları tehdit edilirse, yanlarında davalarını savunacak bir İspanyol bulacaklar."
 lar_spain.79.t:0 "[Root.GetLeader]'in Taç Giyme Töreni"
 lar_spain.8.a:0 "Onların aptallığı onlara bizden daha pahalıya mal olacak!"
 lar_spain.8.desc:0 "Siyasi bağımsızlık konusundaki ısrarımızdan hoşnut olmayan Falanj liderliği, hareketimizi haritadan silmeye karar verdi. Falanjist güçler Requetélerimize saldırdı ve önde gelen düşünürlerimiz ile siyasetçilerimizden birçoğuna tutuklama girişimlerinde bulunuldu.\n\nBu uzlaşmaz tavırlarıyla tüm Milliyetçi Cephe'nin konumunu tehlikeye attılar ve Cumhuriyetçi güçlere ihtiyaç duydukları fırsatı pekâlâ verebilirler."
 lar_spain.8.desc_2:0 "Savaş sonrası hükûmet üzerinde bir miktar nüfuz sahibi olma konusundaki ısrarımızdan hoşnut olmayan Falanj liderliği, hareketimizi haritadan tamamen silmeye karar verdi! Falanjist güçler Requetélerimize saldırdı ve önde gelen düşünürlerimiz ile siyasetçilerimizden birçoğuna tutuklama girişimlerinde bulunuldu.\n\nYeni hükûmet üzerinde nüfuz kazanmamızı engellemek için Cumhuriyetçilere karşı zorla kazandığımız zaferi riske atıyorlar!"
 lar_spain.8.t:0 "Faşist Baskını!"
 lar_spain.81.a:0 "Batı Avrupa'daki nüfuzumuz artıyor!"
 lar_spain.81.desc:0 "İspanya İç Savaşı'na yoğun katılımımız nedeniyle, [SPD.GetAdjective] hükûmeti üzerindeki nüfuzumuz, onların etkili bir şekilde Moskova'ya bağlı bir uydu devlet haline geldikleri noktaya kadar genişledi."
 lar_spain.81.t:0 "Zaferin Bedeli"
 lar_spain.82.a:0 "Bu durumun ne kadar süreceğini göreceğiz."
 lar_spain.82.desc:0 "İç savaşta zafer bizimdir, ancak Sovyet yardımına olan yoğun bağımlılığımız, geri ödenmesi gereken önemli bir borcun üstlenildiği anlamına geliyor. İç savaşın kaotik dönemi aynı zamanda Stalinistlerin yeni ordumuzda ve hükümetimizde kilit pozisyonlara gelmeyi başardıkları anlamına da geldi. Bu nedenle kendimizi zor bir durumda buluyoruz.\n\nMoskova, kendilerine sadık bakanların ve memurların atanması için \"öneriler\" yapmaya başladı bile ve şimdilik onların taleplerine, ciddi ekonomik yansımaları olmadan veya daha kötüsü yeni bir iç savaşa yol açmadan karşı koyamayız. Eğer gerçek bağımsızlığa ulaşmak istiyorsak, kartlarımızı dikkatli oynamalı ve ya bağlılığımızı kanıtlamalıyız ya da öncelikle devletimiz üzerindeki Stalinist etkiyi baltalayıp ortadan kaldırmalıyız."
 lar_spain.82.t:0 "Zaferin Bedeli"
 lar_spain.83.a:0 "Katalonya'da bir işgal bölgesi kurarak bir mesaj göndereceğiz."
 lar_spain.83.b:0 "Bizim müdahalemiz olmadan her şeyin yoluna gireceğinden eminiz."
 lar_spain.83.desc:0 "Geçtiğimiz birkaç hafta boyunca [SPD.GetNameDef]'deki bağlantılarımız, temsilcilerimiz ve sadık Stalinist bakanlarımız ve subaylarımız defalarca önemli bilgilerden mahrum bırakıldı ve [SPD.GetAdjective] hükümet ve askeri yetkililerine erişimleri engellendi. Artık adamlarımızın etkili konumlardan sistematik olarak uzaklaştırıldığı ve hatta dış yardım programlarımızın bile örüldüğü haberi bize ulaştı. \n\n Bu sıklıkta \"tesadüfler\" saf şans olamaz. [SPD.GetAdjective] hükümeti açıkça ihanet işaretleri gösteriyor ve [SOV.GetNameDef]'ye karşı yükümlülüklerinden dönme arzusu gösteriyor ve Moskova'daki sesler cezai eylem ve dizginlerin sıkılması yönünde çağrıda bulunmaya başlıyor."
 lar_spain.83.t:0 "İhanet Belirtileri"
 lar_spain.84.a:0 "Gerilim artıyor. Planlarımıza hızla devam etmeliyiz!"
 lar_spain.84.desc:0 "Moskova'nın, hükümetimiz üzerindeki kontrolünü artırma çabalarına sistematik olarak engel olmamıza karşı gösterdiği sabır artık doruğa ulaştı. Sovyetler, Katalonya, Valensiya ve Aragon'un bazı kısımlarında tek taraflı olarak, gerçekte hiçbir gerçek güce sahip olmayan, sözde bağımsız bir hükümetle bir işgal bölgesi kurdu. Sadık komünist güçler, Moskova yanlısı \"hükümet\"e destek sözü vererek bu yeni bölgeye akın etti.\n\nMesaj açık: Moskova'nın talimatlarına uyun, aksi takdirde daha fazla cezai işlem beklenecektir. Planlarımız gerçekleşmeden nüfuzlarını çok fazla genişletmeleri pek mümkün olmasa da, topraklarımız üzerindeki bu Sovyet hakimiyetini ortadan kaldırmak şüphesiz zor olacaktır."
 lar_spain.84.t:0 "Katalan İşgal Bölgesi"
 lar_spain.85.a:0 "Ülkemizi Stalinist nüfuzdan tek tek eyaletlerle temizliyoruz!"
 lar_spain.85.desc:0 "Kuvvetlerimiz [SPR_stolen_state_name.GetName]'i tamamen güvence altına aldı, tüm Sovyet destekçilerini ve yerel Moskova yanlısı liderliği kovdu ve bölge üzerinde hızla bir [SPD.GetAdjective] yerel hükûmeti yeniden kuruyoruz."
 lar_spain.85.t:0 "[SPD.GetNameDefCap], [SPR_stolen_state_name.GetName]'i Güvence Altına Aldı"
 lar_spain.88.a:0 "Kazanılan bir savaş, kazanılmış bir savaş anlamına gelmez."
 lar_spain.88.desc:0 "[SPD.GetAdjective] kuvvetleri [SPR_stolen_state_name.GetName]'i tamamen güvence altına aldı, destekçilerimizi ve yerel Moskova yanlısı liderliği kovdu ve bölge üzerinde hızla kendi yerel hükûmetlerini yeniden kuruyorlar."
 lar_spain.88.t:0 "[SPD.GetNameDefCap], [SPR_stolen_state_name.GetName]'i Güvence Altına Aldı"
 lar_spain.89.a:0 "Zaten kaybederlerdi."
 lar_spain.89.desc:0 "Beklenmedik bir şekilde, [From.GetAdjective] hükûmeti geri adım attı ve bağımsızlık taleplerimizi kabul etti. Görünüşe göre Avrupa'nın batısında bir başka çatışmaya karışmak istemiyorlar."
 lar_spain.89.t:0 "[From.GetNameDefCap] Talepleri Kabul Ediyor"
 lar_spain.9.a:0 "Bu bölgelerde hükûmet kontrolünü yeniden uygulama zamanı geldi."
 lar_spain.9.desc:0 "Anarşist komünlerin kendilerini yönetmedeki artan bağımsızlığı, son gelişmelerle doruk noktasına ulaştı. Ortak savaş çabamızın kilit kısımları üzerinde merkezi kontrolü sürdürme yönündeki tamamen makul çabalarımızdan hüsrana uğrayan Anarşistler ve POUM müttefikleri, yerel anlaşmazlıkları kuvvetlerimizle tam teşekküllü sokak çatışmalarına tırmandırdı.\n\nYerel başlangıçlarına rağmen, iç çatışma şimdi daha da yayıldı ve Milliyetçilerle olan cephe hatlarımızın bütünlüğünü tehlikeye atmakla tehdit ediyor."
 lar_spain.9.desc_2:0 "Anarşist komünlerin kendilerini yönetmedeki artan bağımsızlığı, son gelişmelerle doruk noktasına ulaştı. İstikrarlı ve merkezi bir hükûmete kademeli bir dönüşe başlama yönündeki tamamen makul çabalarımızdan hüsrana uğrayan Anarşistler ve POUM müttefikleri, yerel anlaşmazlıkları kuvvetlerimizle tam teşekküllü sokak çatışmalarına tırmandırdı.\n\nSaçma sapan bağımsızlık anlayışlarını sürdürmek için Milliyetçilere karşı zorla kazandığımız zaferi riske atıyorlar!"
 lar_spain.9.t:0 "Anarşist Ayaklanması!"
 lar_spain.90.a:0 "Kaos tamamlandı."
 lar_spain.90.desc:0 "Yakın zamanda 1936 seçimlerinde zaferle birleşen Sol'un çeşitli partileri arasındaki güç mücadelesi şimdiden doruk noktasına ulaştı. Başkan Niceto Alcalá-Zamora'nın merkezci ve uzlaşmacı politikalarından endişe duyan, Cortes'teki yabancılaşmış destekçileri, seçimlerle sonuçlanan Cortes'in feshini anayasaya aykırı buldular ve onu görevden aldılar.\n\nAlcalá-Zamora'nın yerine, Cortes eski rakibi Manuel Azaña'yı seçti ve şimdi giderek kutuplaşan İspanyol siyasi sahnesine istikrarı geri getirme gibi gıpta edilmeyecek bir görevi devraldı."
 lar_spain.90.t:0 "Niceto Alcalá-Zamora'nın Görevden Alınması"
 lar_spheres_of_influence.1.a:0 "Mantıklı bir öneri"
 lar_spheres_of_influence.1.b:0 "Nüfuz alanlarına sahip olmak için önce nüfuzun olmalı, Fransa"
 lar_spheres_of_influence.1.desc:0 "[From.GetLeader], uluslarımız arasındaki herhangi bir gerilim nedenini ortadan kaldırmak amacıyla [This.GetLeader] ile görüşmek üzere Berlin'e geldi. Tartışılan konular arasında orta Avrupa'nın yeniden yapılandırılması da var. [From.GetLeader], Fransızca konuşan nüfusuyla [BEL.GetNameDef]'i ulusunun temel bir çıkarı olarak gördüğünü açıkça belirtti. \n\nAncak hükûmeti, [HOL.GetNameDef] ve [LUX.GetNameDef]'in kaderi söz konusu olduğunda çok daha esnek ve son iki ülkenin bizim nüfuz alanımızda, ilkinin ise Fransız nüfuz alanında kabul edilmesi gereken bir mutabakat zaptı öneriyor."
 lar_spheres_of_influence.1.t:0 "Fransa Nüfuz Alanlarını Tartışmak İstiyor"
 lar_spheres_of_influence.2.a:0 "Diplomatik stratejimiz için bir başka başarı."
 lar_spheres_of_influence.2.desc:0 "[From.GetLeader] ile yapılan müzakereler sadece birkaç dakika sürdü ve iki lider bizim önerdiğimiz çizgide hızla bir anlaşmaya vardı. Tek anlaşmazlık noktası, çözümü diplomatik servise bırakılan Belçika'daki küçük Almanca konuşan topluluktu."
 lar_spheres_of_influence.2.t:0 "[From.GetNameDefCap] Kabul Ediyor"
 lar_spheres_of_influence.3.a:0 "Görünüşe göre zamanımızı boşa harcadık."
 lar_spheres_of_influence.3.desc:0 "[From.GetLeader] ve [This.GetLeader] arasında bildirildiğine göre çok gergin bir toplantıda, uluslarımız arasındaki gerilimleri çözme umudu dakikalar içinde yok oldu. Alman heyeti pozisyonundan kımıldamadı ve önemli bir Alman azınlığa sahip bir ulus olarak Belçika'nın [From.GetNameDef]'in doğal bir çıkarı olduğunu ve bizim bu konuda serbest bırakılmamız gerektiği fikrinin kesinlikle kabul edilemez olduğunu ilan etti."
 lar_spheres_of_influence.3.t:0 "[From.GetLeader] Reddediyor"
 lar_split_belgium.1.a:0 "Kaçınılmaz olana karşı savaşarak hiçbir şey kazanılamaz."
 lar_split_belgium.1.b:0 "Bu bizim ülkemiz ve her karış toprağı için savaşacağız."
 lar_split_belgium.1.desc:0 "Son birkaç haftadır, ülkemizdeki Fransızca konuşan nüfusu temsil ettiğini iddia eden bir dizi grup ortaya çıktı ve Valonya'nın Fransa ile 'yeniden birleşmesi' için ajitasyon yapmaya başladı. Bugün, Fransız büyükelçisi, [From.GetLeader] hükûmetinin, ülkemizin Fransızca konuşan bölgelerini kendi ülkelerine katmayı resmi politikası haline getirdiğini ilan eden bir nota verdi.\n\nSınıra yığılan birlik raporları, bu yeni politikayı gerekli her yolla uygulamaya istekli olduklarını gösteriyor."
 lar_split_belgium.1.t:0 "[From.GetLeader] Valonya'yı Talep Ediyor"
 lar_split_belgium.2.a:0 "Demokrasi ne kadar güzel bir şey."
 lar_split_belgium.2.desc:0 "Belçika hükûmeti, Belçika'nın Fransızca konuşan kısımlarında bizim denetimimiz altında Fransa ile birleşme konusunda bir dizi referandum yapmayı kabul etti. Belçika yanlısı tüm partilerin boykot çağrısı yapmasıyla, zaferimiz neredeyse kesin."
 lar_split_belgium.2.t:0 "Belçika Bölünmeyi Kabul Ediyor"
 lar_split_belgium.3.a:0 "Onlara saygıyı öğreteceğiz!"
 lar_split_belgium.3.b:0 "Bu çabaya değmez."
 lar_split_belgium.3.desc:0 "[From.GetAdjective] hükûmeti, Valonya ile Fransa arasındaki birleşme hakkındaki her türlü konuşmaya sert bir baskıyla yanıt verdi, birleşme yanlısı grupların ofislerini bastı ve liderlerini tutukladı. Büyükelçimiz resmi bir protestoda bulunduğunda, kendisine kabaca [From.GetAdjective] hükûmetinin ülke içinde düzeni sağlamaktan sorumlu olduğu ve bu nedenle dış ajanlar tarafından ders verilmeyeceği söylendi."
 lar_split_belgium.3.t:0 "Belçika Meydan Okuyor"
 lar_worker_shortage.1.a:0 "Belki onun yerine kadınları işe alabilirler?"
 lar_worker_shortage.1.desc:0 "Askere almanın genişletilmesi ve daha önce muaf tutulan işçilerin çağrılmasının ardından, birçok şirket boş pozisyonları doldurmada sorun yaşadığını bildiriyor. Silah sanayileri bile bu işçi kıtlığından etkileniyor ve sonuç olarak üretim çıktısı zarar görmeye başladı.\n\nSanayi uzmanları, hükûmeti ya şu anda orduda bulunan erkekleri serbest bırakmak ya da orduya alınan işçilerin yerini alacak yeni insan gücü kaynakları bulmaya teşvik ediyor."
 lar_worker_shortage.1.t:0 "İşçi Kıtlığı Kötüleşiyor"
 lar_worker_shortage.2.a:0 "Nitelik, nicelik değil!"
 lar_worker_shortage.2.desc:0 "Ordunun açık protestosuna rağmen, askere almanın azaltılması ve vasıflı işçiler için askerlik muafiyetlerinin yeniden getirilmesi işçi kıtlığını hafifletti. İstatistikler, verimlilikte belirgin bir iyileşme gösteriyor ve hızla askere almanın genişletilmesinden önceki seviyelere dönüyor."
 lar_worker_shortage.2.t:0 "Askerler Tezgahlara Geri Dönüyor"
 occupied_countries.1.a:0 "Onayımızı aldılar."
 occupied_countries.1.b:0 "Henüz hazır değiller."
 occupied_countries.1.c:0 "Bana bu dilekçeleri getirmeyi bırakın."
 occupied_countries.1.c_tt:0 "İşgal altındaki bir ulus §Yİş Birlikçi Hükümet§! kurmaya hazır olduğunda artık bildirim almayacağız.\nBu hükümetler §YDış Nüfuz§! kararlarıyla her zaman kurulabilir."
 occupied_countries.1.desc:0 "İşgal kuvvetlerimiz ve yerel sivil yetkililer arasında iş birliğini ve uyumu iyileştirmek için uzun ve ortak bir çabanın ardından, şimdi [From.From.GetNameDef]'in kontrolünü yeniden yerel bir hükûmetin ellerine vermeye hazırız. Bu yeni hükûmet, sempatik sivillerden oluşuyor ve bizimle yakın bir şekilde koordine olmaya hazır."
 occupied_countries.1.title:0 "[From.From.GetNameDef]'in Geçici Hükûmeti"
