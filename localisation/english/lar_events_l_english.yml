 LaR_france_vichy_notification_events.1.a:0 "İhanet ve Hainlik!"
 LaR_france_vichy_notification_events.1.desc:0 "[FRA.GetLeader]'nin doğrudan itirazının ardından bölgenin valisi, [FRA.GetLeader] başkanlığındaki sözde \"[FRA.GetAdjective] Sürgündeki Hükümet\"e bağlılığını ilan etti. Bölgedeki birliklerimizden [FRA.GetLeader] güçlerine katılmaları istendi ancak çoğu bizim hatlarımıza geri gönderilmeyi tercih etti.\n\nYine de [FRA.GetLeader] artık bölgenin kontrolünü elinde tutuyor."
