l_english:
 FRA_central_africa_intervention.1.a:0 "Gerçek düşmanın kim olduğunu biliyorlar."
 FRA_central_africa_intervention.1.desc:0 "Sadece orta derecede direnişle karşılaşan müttefik birimleri, orta Afrika'nın Vichy kontrolündeki bölgelerine derinlemesine nüfuz etti. Vichy'den mümkün olduğunca uzun süre dayanma emirlerine rağmen, bölgedeki Fransız birimleri büyük ölçüde direnişi durdurdu ve artık müttefik ilerlemesine karşı koymuyor."
 FRA_central_africa_intervention.1.t:0 "Müttefikler Orta Afrika'yı Güvence Altına Aldı"
 FRA_central_africa_intervention.2.a:0 "Neden kurtarıcılarına dirensinler ki?"
 FRA_central_africa_intervention.2.desc:0 "Orta Afrika'daki Fransız birimleri beklenmedik derecede güçlü bir direniş gösterdi, birkaç müttefik saldırı kolunu pusuya düşürdü ve acı verici kayıplar verdirdi. Karışık bir durumla karşı karşıya kalan ve düşmanı açıkça hafife alan yerel müttefik komutanı, kuvvetlerini başlangıç pozisyonlarına çekti ve emir beklemek için siper kazdı."
 FRA_central_africa_intervention.2.t:0 "Vichy Orta Afrika'yı Elinde Tutuyor"
 FRA_central_africa_intervention.3.a:0 "Hiçbir şey kazanmadık."
 FRA_central_africa_intervention.3.desc:0 "Orta Afrika'daki birkaç kilit nokta etrafındaki ağır çatışmalar her iki tarafı da yorgun düşürdü ve operasyonlara devam edemez hale getirdi. Vichy Fransız kuvvetleri hâlâ bölgedeki kilit arazinin çoğunu kontrol etse de, müttefik kuvvetler bazı bölgelerde küçük kazanımlar elde edebildi. Ancak, ikmal durumu o kadar kötüleşti ki, yakın zamanda hiçbir taraf yeni bir taarruz başlatamayacak."
 FRA_central_africa_intervention.3.t:0 "Orta Afrika'da Ateşkes"
 FRA_indochina_intervention.1.a:0 "Hayati bir başarı."
 FRA_indochina_intervention.1.desc:0 "Müttefik taarruz kolları Hindiçin'deki birçok büyük şehre ulaştı ve bu durum yerel valinin ateşkes istemesine neden oldu. Savunucuların dağınık ve zayıf koordine olmasıyla, daha fazla direnişin boşuna olduğu kabul edildi. Kalan savunucular silahlarını teslim etti ve Vichy Fransası'na geri gönderilmeyi bekliyor."
 FRA_indochina_intervention.1.t:0 "Müttefikler Hindiçin'i Güvence Altına Aldı"
 FRA_indochina_intervention.2.a:0 "Ne büyük bir zaman ve insan israfı."
 FRA_indochina_intervention.2.desc:0 "İnanılmaz derecede zorlu arazideki ağır çatışmalardan sonra, bölgedeki müttefik komutanlar operasyonu durdurdu. İleri unsurların ikmal durumu giderek daha vahim hale gelirken ve Vichy direnişi sertleşirken, müttefik kuvvetler geri çekilip toparlanmaya karar verdi ve bölgeyi Vichy'nin kontrolüne bıraktı."
 FRA_indochina_intervention.2.t:0 "Vichy Hindiçin'i Elinde Tutuyor"
 FRA_indochina_intervention.3.a:0 "Çok şey riske atıldı, az şey kazanıldı."
 FRA_indochina_intervention.3.desc:0 "Kötü havanın başlaması ve her iki tarafta da ikmalin azalmasıyla, Hindiçin'deki müttefik ve Vichy kuvvetlerinin komutanları ateşkes konusunda anlaştı. Saldıran müttefiklerin karşılaştığı büyük zorluklar ve sürpriz unsurunun kaybolması göz önüne alındığında, yüksek komuta durum iyileştikten sonra ilerlemeyi sürdürebilmeyi beklemiyor."
 FRA_indochina_intervention.3.t:0 "Hindiçin'de Ateşkes"
 FRA_syria_intervention.1.a:0 "İyi savaşıldı."
 FRA_syria_intervention.1.desc:0 "Şam'da sakin bir törenle, yerel Vichy kuvvetleri komutanı toprağı resmen Müttefiklere teslim etti. Bölge genelinde çatışmalar sona erdi ve hayatta kalan Vichy kuvvetleri esarete doğru yürüdü. İlgili Fransız askerlerinin çok azı Özgür Fransız kuvvetlerine katılma arzusu dile getirdi, çoğu ülkesine geri gönderilmeyi tercih etti."
 FRA_syria_intervention.1.t:0 "Müttefikler Suriye'yi Güvence Altına Aldı"
 FRA_syria_intervention.2.a:0 "Bir sürü iyi insan boşuna öldü."
 FRA_syria_intervention.2.desc:0 "Birkaç kilit noktada Müttefik ilerlemelerini durduran şiddetli çatışmaların ardından, yerel Müttefik komutanı operasyonların durdurulması çağrısında bulundu. Vichy birlikleri pozisyonlarını sağlamlaştırırken Müttefik kuvvetleri büyük ölçüde başlangıç pozisyonlarına çekildi. Vichy kuvvetleri takibe geçmedi ve pozisyonlarını korumaktan memnun görünüyor."
 FRA_syria_intervention.2.t:0 "Vichy Suriye'yi Elinde Tutuyor"
 FRA_syria_intervention.3.a:0 "Statüko devam ediyor."
 FRA_syria_intervention.3.desc:0 "Suriye'ye yönelik müttefik ilerlemesi durdu ve Vichy kuvvetleri bir savunma hattı oluşturmayı başardı. Çok sayıda, iyi koordine edilmiş saldırıya rağmen, bölgedeki müttefik kuvvetler savunucuları yerinden sökemedi. Her iki taraf da siper kazdı ve bir ateşkes üzerinde anlaşıldı; Vichy bölgenin tüm ilgili kısımlarının kontrolünü elinde tutmaya devam ediyor."
 FRA_syria_intervention.3.t:0 "Suriye'de Ateşkes"
 FRA_west_africa_intervention.1.a:0 "Dünyanın bir başka köşesi şimdi özgürce nefes alıyor."
 FRA_west_africa_intervention.1.desc:0 "Açık arazide hızla ilerleyen müttefik birimleri, Fransız savunucularının çoğunu kanatlardan kuşatmayı ve onları teslim olmaya zorlamayı başardı. Müttefik ilerlemesini durduracak yedek kuvvet kalmayınca, yerel vali toprağı resmen teslim etti."
 FRA_west_africa_intervention.1.t:0 "Müttefikler Batı Afrika'yı Güvence Altına Aldı"
 FRA_west_africa_intervention.2.a:0 "Talih cesurlardan yana olmadı."
 FRA_west_africa_intervention.2.desc:0 "Bir dizi başarısız saldırı ve sert çatışmanın ardından, yerel müttefik komutanı bölgedeki taarruz operasyonlarının durdurulması çağrısında bulundu ve açıkta kalan birimlerine daha savunulabilir araziye geri çekilmelerini emretti. Vichy kuvvetleri kilit noktalar etrafında toparlandı ve siper kazdı, bu da daha fazla saldırının başarılı olma olasılığını düşürdü."
 FRA_west_africa_intervention.2.t:0 "Vichy Batı Afrika'yı Elinde Tutuyor"
 FRA_west_africa_intervention.3.a:0 "Ne büyük bir zaman israfı."
 FRA_west_africa_intervention.3.desc:0 "Tehlikeli ikmal durumlarının ve takviye eksikliklerinin farkında olan Vichy ve müttefik kuvvetleri, birbirlerini elverişsiz koşullarda belirleyici bir savaşa sokmaya çalışmak için uzun bir dizi manevra ve karşı manevra yürüttü. İnsan ve malzeme yıpranmış ve ortada bir karar görünmezken, her iki taraf da siper kazdı ve diğerinin ilk hamlesini bekliyor."
 FRA_west_africa_intervention.3.t:0 "Batı Afrika'da Ateşkes"
