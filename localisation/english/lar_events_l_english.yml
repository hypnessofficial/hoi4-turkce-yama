 LaR_france_vichy_notification_events.6.t:0 "Madagaskar [FRA.GetLeader]'in Tarafına Geçiyor"
 LaR_france_vichy_notification_events.7.a:0 "Ne kadar da alçakça ve Fransızlığa yakışmayan yöntemler!"
 LaR_france_vichy_notification_events.7.desc:0 "[FRA.GetLeader]'e sadık kuvvetler bölgede bir darbe düzenledi. Şafaktan hemen önce, açıkça [FRA.GetLeader]'in emirleri altındaki çok sayıda silahlı grup, herhangi bir koordineli direniş girişimini etkisiz hale getirmek için bölge çevresindeki stratejik yerleri ele geçirdi. Öğleden sonra, tüm büyük nüfus merkezlerini kontrol ettiler ve bölgenin kontrolünü etkili bir şekilde ele geçirdiler."
