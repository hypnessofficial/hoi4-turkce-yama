 RULE_OPTION_FOCUSES_ONLY_40:0 "Sadece Odaklar (1940'a Kadar)"
 RULE_OPTION_FRA_FRAGMENTED:0 "Parçalanmış Fransa"
 RULE_OPTION_FRA_FRAGMENTED_DESC:0 "Fransa'yı oluşturan serbest bırakılabilir tüm kurucu uluslar oyun başlangıcında özgür ve bağımsız devletler olarak serbest bırakılacaktır."
 RULE_OPTION_FREE:0 "Serbest"
