 RULE_OPTION_ASIA_DECOLONIZED_DESC:0 "Asya'daki serbest bırakılabilir tüm sömürgeleştirilmiş uluslar oyun başlangıcında özgür ve bağımsız uluslar olarak serbest bırakılır."
 RULE_OPTION_AST_ADELA_FASCIST_TAOG_AI:0 "Faşist Pankhurst-Walsh"
 RULE_OPTION_AST_ADELA_FASCIST_TAOG_AI_DESC:0 "Adela Pankhurst-Walsh, Avustralya'ya Britanya İmparatorluğu'nu daha da genişletme öncelikli hedefiyle liderlik ediyor, ancak bu genişlemiş imparatorluğu tam olarak kimin miras alacağı ucu açık bir soru olarak kalıyor."
 RULE_OPTION_AST_AI_RANDOM_TAOG_HISTORICAL:0 "Tarihsel"
 RULE_OPTION_AST_AI_RANDOM_TAOG_HISTORICAL_DESC:0 "İstikrarsız da olsa sıkı sıkıya yerleşmiş bir demokrasi, Avustralya'ya daha geniş bir dünyaya bakması ve yaklaşan fırtınaya karşı hazırlanması için gereken temeli sağlıyor."
 RULE_OPTION_AST_ANTI_COMMONWEALTH_COMMUNIST_TAOG_AI:0 "İngiliz Milletler Topluluğu Karşıtı Komünist"
 RULE_OPTION_AST_ANTI_COMMONWEALTH_COMMUNIST_TAOG_AI_DESC:0 "Uzaktaki efendi, Avustralya'nın kaderini çok uzun zamandır belirliyor. Şimdi emperyal boyunduruğu atmanın... ve bu yolda diğerlerini de özgürleştirmenin zamanı geldi."
 RULE_OPTION_AST_COMINTERN_COMMUNIST_TAOG_AI:0 "Komintern Komünisti"
 RULE_OPTION_AST_COMINTERN_COMMUNIST_TAOG_AI_DESC:0 "Komünist ütopya ancak birlik içinde gerçekleştirilebilir, çünkü dünya çapındaki işçi devriminin yolu budur"
 RULE_OPTION_AST_PETER_FASCIST_TAOG_AI:0 "Faşist Stephensen"
 RULE_OPTION_AST_PETER_FASCIST_TAOG_AI_DESC:0 "Önce Avustralya, kendi geleceğini şekillendirmekte özgür, bağımsız bir Avustralya talep ediyor."
 RULE_OPTION_AST_RANDOM_DEMOCRATIC_TAOG_AI:0 "Rastgele Sosyal Demokrat"
 RULE_OPTION_AST_RANDOM_DEMOCRATIC_TAOG_AI_DESC:0 "Ulusun kaderinin kendi iradesine bağlı olduğu Demokratik Avustralya'da en çok halkın sesi önemlidir."
 RULE_OPTION_AUSTRIA_HUNGARY:0 "Avusturya-Macaristan'ı Geri Getir"
 RULE_OPTION_AUSTRIA_HUNGARY_HUN_AI_DESC:0 "Macar YZ'sı, Milli Hedef ağacındaki ilgili yoldan giderek Avusturya-Macaristan İmparatorluğu'nu geri getirmeye çalışacak ve eğer mümkünse Otto von Habsburg'u hükümdarları olarak seçecektir."
 RULE_OPTION_AUS_ANTI_ANSCLUSS_STRESS_AI:0 "Varyant Tarihi - Östfrei!"
 RULE_OPTION_AUS_ANTI_ANSCLUSS_STRESS_AI_DESC:0 "YZ büyük ölçüde Tarihi yolu izleyecek, ancak mümkün olan her yolla Anschluss'u engellemeye çalışacak, acı sona kadar bağımsızlıkları için diş ve tırnakla savaşacaktır. Bu, savaşın patlak vermesi için bir meydan okuma veya gecikme sunabilir."
 RULE_OPTION_AUS_COMMUNIST_AI:0 "Komünist"
 RULE_OPTION_AUS_COMMUNIST_AI_DESC:0 "YZ komünistleşmeye ve hükümeti devirmeye çalışacaktır. Katı bir Avustromarksist gündeme bağlı kalarak kendi ittifaklarını kuracaklardır."
 RULE_OPTION_AUS_COMMUNIST_SOV_ALIGNED_AI:0 "Sovyet Avusturyası"
 RULE_OPTION_AUS_COMMUNIST_SOV_ALIGNED_AI_DESC:0 "YZ komünistleşmeye ve hükümeti devirmeye çalışacak, ardından SSCB ile aynı hizaya gelip Komintern'e katılacaktır."
 RULE_OPTION_AUS_DEMOCRATIC_ALLIES_AI:0 "Avusturya Demokratik - Müttefikler"
 RULE_OPTION_AUS_DEMOCRATIC_ALLIES_AI_DESC:0 "YZ Avusturya'da demokrasiyi yeniden kurarak Müttefiklere katılmaya çalışacaktır."
 RULE_OPTION_AUS_DEMOCRATIC_ALPINE_FEDERATION_AI:0 "Avusturya Demokratik - Alp Federasyonu"
 RULE_OPTION_AUS_DEMOCRATIC_ALPINE_FEDERATION_AI_DESC:0 "YZ Avusturya'da demokrasiyi yeniden kurmaya ve Alp Federasyonu'nu kurmaya çalışacaktır."
 RULE_OPTION_AUS_DEMOCRATIC_FEDERATIVE_AI:0 "Avusturya Demokratik - Federatif"
 RULE_OPTION_AUS_DEMOCRATIC_FEDERATIVE_AI_DESC:0 "YZ Tuna boyunca diğer ulusları demokratik bir yönetim altında davet ederek Tuna Federasyonu'nu kurmaya çalışacaktır."
 RULE_OPTION_AUS_NEUTRALITY_FEDERATIVE_AI:0 "Bağlantısız Federatif"
 RULE_OPTION_AUS_NEUTRALITY_FEDERATIVE_AI_DESC:0 "YZ Tuna boyunca diğer ulusları bağlantısız bir yönetim altında davet ederek Tuna Federasyonu'nu kurmaya çalışacaktır."
 RULE_OPTION_BALKAN_DOMINANCE:0 "Balkan Hakimiyeti"
 RULE_OPTION_BALKAN_DOMINANCE_ROM_AI_DESC:0 "Rumen YZ'sı, Milli Hedef ağacındaki ilgili yoldan giderek Balkan komşuları üzerinde üstünlük kurmaya çalışacaktır."
 RULE_OPTION_BALKAN_ENTENTE:0 "Balkanları Koru"
 RULE_OPTION_BALKAN_ENTENTE_DESC:0 "Türkiye kendini Balkanlar'da güvenliği sağlamaya adayacak ve Yunanistan, Romanya ve Yugoslavya ile bir ittifak kurmaya çalışacaktır."
 RULE_OPTION_BALTIC_ENTENTE:0 "Baltık Antantı"
 RULE_OPTION_BERMONDT:0 "Monarşist: Avalişvili Hanedanı"
 RULE_OPTION_BLOCKED:0 "Engellendi"
 RULE_OPTION_BOLSHEVIK_PRC:0 "28 ½ Bolşevik"
 RULE_OPTION_BOLSHEVIK_PRC_DESC:0 "Yapay Zeka, Sovyetler Birliği ile aynı hizaya gelmeye çalışarak 28 ½ Bolşevik yolundan gidecek. İkinci Birleşik Cephe'de ise, Yapay Zeka ittifakı diplomatik olarak etkilemeye çalışacak."
 RULE_OPTION_BRA_COMMUNIST_INDEPENDENT:0 "Komünizm - Aliança Nacional Libertadora"
 RULE_OPTION_BRA_COMMUNIST_INDEPENDENT_DESC:0 "Brezilya ANL'yi yeniden canlandıracak ve demokratik hükümeti devirmeye çalışacaktır. Yerine ANL konseyi geçecek ve bu konsey komünist reformları uyguladıktan sonra nihayetinde kıtayı faşizm ve emperyalizmden kurtarmaya çalışacaktır."
 RULE_OPTION_BRA_COMMUNIST_STALINISM:0 "Komünizm - Luís Carlos Prestes"
 RULE_OPTION_BRA_COMMUNIST_STALINISM_DESC:0 "Brezilya demokratik hükümeti devirmeye ve yerine Sovyet yanlısı, Luís Carlos Prestes başkanlığında komünist bir hükümet getirmeye çalışacaktır. Daha sonra Komintern'e katılacak ve Sovyetler Birliği'ne yardım edecektir."
 RULE_OPTION_CALIPHATE_AFG:0 "Yeni Bir Hilafet"
 RULE_OPTION_CALIPHATE_AFG_AI_DESC:0 "Afgan yapay zekâsı, Kral Zahir Şah'ı devirip yerine İpi Fakiri'ni getirmeye çalışacaktır. İpi Fakiri de ardından ülkenin modernleşmesini tersine çevirmeyi deneyecektir. Bunun üzerine Afganistan, sınırlarını genişletmeye yönelecek ve nihayetinde yeni bir Hilafet kuracaktır."
 RULE_OPTION_CARDENISMO:0 "Kardenizm"
 RULE_OPTION_CARDENISMO_DESC:0 "Lázaro Cárdenas ve solcu halefleri bir Bolivarcı İttifak yaratacak ve Yanki emperyalistlerine saldıracaktır."
 RULE_OPTION_CARLIST:0 "Carlizm"
 RULE_OPTION_CARLIST_DESC:0 "Manuel Fal Conde yönetimindeki Carlistler Falanjizmi reddedecek ve meşru Carlist Kralı altında eski mutlakiyetçi monarşiye bir dönüş sağlayacaktır."
 RULE_OPTION_CAVE_TO_THE_GERMANS:0 "Almanlara Boyun Eğ"
 RULE_OPTION_CHL_ANTI_IMPERIALISM:0 "Anti-Emperyalizm"
 RULE_OPTION_CHL_ANTI_IMPERIALISM_DESC:0 "Şili YZ'si çeşitli Mapuçe örgütlerini desteklemeyi seçecek, sonunda onların ülkenin kontrolünü ele almasını sağlayacaktır. Daha sonra Emperyalizme karşı bir haçlı seferine çıkacak ve Avrupa kontrolündeki devletleri Güney ve Orta Amerika'dan atacaktır."
 RULE_OPTION_CHL_COMMUNIST:0 "Şili Sosyalist Cumhuriyeti"
 RULE_OPTION_CHL_COMMUNIST_AI_DESC:0 "Şili YZ'si faşistlerin neden olduğu istikrarsızlığı kullanarak Arturo Alessandri'nin istifasını talep edecek ve komünist bir devlet kurabilmeleri için başkanlık yetkilerini artıracaktır."
 RULE_OPTION_CHL_LE_DELUGE:0 "Araucanía ve Patagonya Krallığı"
 RULE_OPTION_CHL_LE_DELUGE_DESC:0 "Şili YZ'si geleneğe yönelecek ve böylece Alessandri'yi iktidardan indirecek, yerine Ibáñez'i getirecektir. Daha sonra bir iç savaşa girecek ve bu savaşta III. Antoine eski Araucanía ve Patagonya Krallığı'nı geri getirecek ve kendini Napolyon'un halefi ilan edecektir."
 RULE_OPTION_CHL_OPERATION_BOLIVAR:0 "Bolivar Operasyonu ile İşbirliği"
 RULE_OPTION_CHL_OPERATION_BOLIVAR_DESC:0 "Şili YZ'si faşizm yoluna girecek, eğer fırsat bulursa Alman Reich'in tarafını seçecek, sonunda savaşa girecek ve eski Şili Krallığı'nı geri getirmeye çalışacaktır."
 RULE_OPTION_CHL_PAN_HISPANISM:0 "Pan-Hispanizm"
 RULE_OPTION_CHL_PAN_HISPANISM_DESC:0 "Şili YZ'si faşizm yoluna girecek, sonunda büyük dünya güçlerinden hiçbirinin tarafını seçmeyecektir. Daha sonra Hispanik dünyayı ya fethedecek ya da diplomatik olarak birleştirecektir."
 RULE_OPTION_COG_COM_INDEPENDENCE_AI:0 "Komünist Kurtuluş Hareketleri"
 RULE_OPTION_COG_COM_INDEPENDENCE_AI_DESC:0 "Kongo YZ'si barışçıl yollarla mümkün olan en kısa sürede bağımsızlığını kazanmaya çalışacak ve daha sonra Afrika genelinde komünizmi yaymaya çalışacaktır."
 RULE_OPTION_COG_COM_REVOLUTION_AI:0 "Simba'nın Devrimi"
 RULE_OPTION_COG_COM_REVOLUTION_AI_DESC:0 "Kongo YZ'si sömürgeci efendilerinden şiddetli bir devrim ve ardından gelen iç savaş yoluyla kurtulmaya çalışacak ve daha sonra Afrika kıtası boyunca komünizmi yaymaya çalışacaktır."
 RULE_OPTION_COG_DEM_INDEPENDENCE_AI:0 "Demokratik Kurtuluş Hareketleri"
 RULE_OPTION_COG_DEM_INDEPENDENCE_AI_DESC:0 "Kongo YZ'si barışçıl yollarla mümkün olan en kısa sürede bağımsızlığını kazanmaya çalışacak ve daha sonra Afrika genelinde demokrasi için kampanya yürütecektir."
 RULE_OPTION_COMMONWEALTH:0 "Monarşist: Wettin Hanedanı"
 RULE_OPTION_COMMUNISM_PER_AI:0 "Komünizm - Tudeh"
 RULE_OPTION_COMMUNISM_PER_DESC:0 "YZ Sovyet yanlısı Tudeh partisinin iktidarda kalacağı bir devrime girişecek. Komünist rejim bölgeyi istikrarsızlaştırmaya çalışacaktır."
 RULE_OPTION_COMMUNIST:0 "Komünist"
 RULE_OPTION_COMMUNIST_AFG_AI_DESC:0 "Afgan YZ'si Sovyetler Birliği'ne yakınlaşacak ve ulusu Komünist bir devlete dönüştürmek için köklü reformlar uygulayacaktır. Daha sonra Komintern'e katılacak ve Orta Asya'nın kontrolünü ele geçirmeye çalışacaktır."
 RULE_OPTION_COMMUNIST_AST_AI_DESC:0 "Avustralya YZ'sı, Milli Hedef ağacındaki ilgili yoldan giderek ülkeyi komünist yapmaya ve Komintern ile ittifak kurmaya çalışacaktır."
 RULE_OPTION_COMMUNIST_BALKAN_FEDERATION:0 "Komünist - Balkan Federasyonu"
 RULE_OPTION_COMMUNIST_BALKAN_FEDERATION_BUL_AI_DESC:0 "Bulgaristan bir Balkan ittifakı kurmaya çalışacak, komşularını devrimi benimsemeye etkileyecek ve nihayetinde Balkanları birleştirecektir."
 RULE_OPTION_COMMUNIST_BEL_AI:0 "Sosyalistler"
 RULE_OPTION_COMMUNIST_BEL_AI_DESC:0 "YZ İşçi Partisi'nin seçimi kazanmasına izin verecek ve ardından yavaş yavaş Komünist blokla aynı hizaya gelmeye başlayacaktır."
 RULE_OPTION_COMMUNIST_BUL_AI_DESC:0 "Bulgaristan Komintern'e katılmaya ve Avrupa'daki faşizm ve kapitalizme karşı Sovyet yoldaşlarıyla birlikte savaşmaya çalışacaktır."
 RULE_OPTION_COMMUNIST_CAN_AI_DESC:0 "Kanada YZ'sı, Milli Hedef ağacındaki ilgili yoldan giderek komünist olmaya ve dünya işçilerinin mücadelesini desteklemeye çalışacaktır."
 RULE_OPTION_COMMUNIST_COMINTERN:0 "Komünist"
 RULE_OPTION_COMMUNIST_COMINTERN_DESC:0 "Portekiz Sovyetler Birliği'ne yönelecek, İspanyol Cumhuriyeti'ni destekleyecek ve Komintern'e katılmaya çalışacaktır."
 RULE_OPTION_COMMUNIST_CZE_AI_DESC:0 "Çekoslovak YZ'si ülkeyi komünizme dönüştürmeye ve Sovyetler Birliği veya başka bir büyük komünist ulusla ittifaka girmeye çalışacaktır."
 RULE_OPTION_COMMUNIST_FRA_AI_DESC:0 "Fransız YZ'sı, Milli Hedef ağacının ilgili dallarından giderek komünist olmaya ve Komintern'e katılmaya çalışacaktır."
 RULE_OPTION_COMMUNIST_GRE_AI:0 "Komünist"
 RULE_OPTION_COMMUNIST_HUN_AI_DESC:0 "Macar YZ'sı, Milli Hedef ağacındaki ilgili yoldan giderek komünist bir ulus olmaya ve diğer büyük komünist uluslarla ittifak kurmaya çalışacaktır."
 RULE_OPTION_COMMUNIST_INDEPENDENT:0 "Birleşik Avrupa Sosyalist Cumhuriyetleri"
 RULE_OPTION_COMMUNIST_INDEPENDENT_DESC:0 "Komünistler hükümeti devirecek ve İspanyol İç Savaşı sırasında İspanyol Milliyetçilerine karşı savaşacak, İber Yarımadası'nı faşizme karşı son Avrupa kalesi olan Birleşik Avrupa Sosyalist Cumhuriyetleri olarak birleştirecektir."
 RULE_OPTION_COMMUNIST_JAP_AI:0 "Kızıl Güneş Doğuyor"
 RULE_OPTION_COMMUNIST_JAP_AI_DESC:0 "Japon YZ'sı, Milli Hedef ağacındaki ilgili yoldan giderek komünist olmaya ve Asya'daki diğer komünist rejimleri desteklemeye çalışacaktır."
 RULE_OPTION_COMMUNIST_NZL_AI_DESC:0 "YZ, Milli Hedef ağacındaki ilgili yoldan giderek komünist olmaya ve Komintern'e katılmaya çalışacaktır."
 RULE_OPTION_COMMUNIST_PAR_AI:0 "Komünist"
 RULE_OPTION_COMMUNIST_PAR_AI_DESC:0 "YZ Rafael Franco'nun komünist hükümetini koruyacak ve Chaco Savaşı için Bolivya'dan intikam almaya çalışacaktır."
 RULE_OPTION_COMMUNIST_PHI_AI:0 "Deniz Komünizmi"
 RULE_OPTION_COMMUNIST_PHI_AI_DESC:0 "Deniz komünizmi kök salıp eşitlik ruhunu dünya okyanuslarına yaymaya çalışırken Filipinler üzerinde kızıl güneş doğacak."
 RULE_OPTION_COMMUNIST_POL_AI_DESC:0 "Polonya YZ'sı, Milli Hedef ağacındaki ilgili yollardan giderek kendini saldırganlığa karşı korumak için SSCB ile bir anlaşmaya varmaya çalışacaktır."
 RULE_OPTION_COMMUNIST_RAJ_AI_DESC:0 "Hint YZ'sı, Milli Hedef ağacındaki ilgili yoldan giderek Sovyetler Birliği ile ittifak kurarak bağımsızlığını kazanmaya çalışacaktır."
 RULE_OPTION_COMMUNIST_RONOHA_JAP_AI:0 "İşçi-Çiftçi Fraksiyonu Yükseliyor"
 RULE_OPTION_COMMUNIST_RONOHA_JAP_AI_DESC:0 "Japon Yapay Zekası komünist olmaya çalışacak ve milli hedef ağacındaki ilgili yoldan giderek Ronoha liderliğinde bir hükümet kuracak, Asya'da emperyalizme karşı bir haçlı seferi başlatacak."
 RULE_OPTION_COMMUNIST_SAF_AI_DESC:0 "Güney Afrika YZ'sı, Milli Hedef ağacının ilgili yollarından giderek komünist olmaya ve Afrika halklarını sömürge yönetiminden kurtarmaya çalışacaktır."
 RULE_OPTION_COMMUNIST_TUR_AI:0 "Komünizm"
 RULE_OPTION_COMMUNIST_TUR_AI_DESC:0 "Türkiye komünist bir hükümet kuracak ve Komintern'e katılmaya çalışacaktır."
 RULE_OPTION_COMMUNIST_USA_AI_DESC:0 "ABD YZ'sı, Milli Hedef ağacındaki ilgili yoldan giderek komünist olmaya çalışacaktır."
 RULE_OPTION_COMMUNIST_YUG_AI_DESC:0 "Yugoslav YZ'sı, Milli Hedef ağacındaki ilgili yoldan giderek ülkeyi komünist bir cumhuriyete dönüştürmeye çalışacaktır."
 RULE_OPTION_DEFAULT:0 "Varsayılan"
 RULE_OPTION_DEFAULT_AI_DESC:0 "YZ, tarihi odakları zorlama seçeneği ve diğer oynanış senaryoları gibi diğer oynanış ayarlarına göre kararlar alacaktır. Bu, 1.5 ve önceki sürümlerdeki davranışla aynıdır."
 RULE_OPTION_DEFAULT_COLONIZATION_DESC:0 "Dünya tarihi olarak sömürgeleştirilmiştir."
 RULE_OPTION_DEFAULT_FRAGMENTATION_DESC:0 "Hiçbir ulus-devlet kurucu parçalarına ayrılmamıştır."
 RULE_OPTION_DEFAULT_GER_FRAGEMNTATION_DESC:0 "Almanya tarihi olarak bütündür"
 RULE_OPTION_DEFENSIVE_DEMOCRAT_BEL_AI:0 "Savunmacı Demokratlar"
 RULE_OPTION_DEFENSIVE_DEMOCRAT_BEL_AI_DESC:0 "YZ zayıf iradeli krallarının prangalarından kurtulacak ve Belçika'yı ne pahasına olursa olsun savunmaya çalışacaktır."
 RULE_OPTION_DEMOCRATIC:0 "Demokratik"
 RULE_OPTION_DEMOCRATIC_AFG_AI_DESC:0 "Afgan YZ'si Kral Zahir Şah'ı amcalarını devirmeye zorlayacak, ardından köklü reformlar yoluna devam edecektir. Bu, Afganistan'ın bir demokrasi olması ve Müttefiklere katılmasıyla sonuçlanacaktır."
 RULE_OPTION_DEMOCRATIC_ALTERNATE:0 "Demokratik - Alternatif"
 RULE_OPTION_DEMOCRATIC_ALTERNATE_CZE_AI_DESC:0 "Çekoslovak YZ'sı, Milli Hedef ağacının ilgili yollarından giderek demokratik kalırken kendini savunmak için kendi ittifakını kurmaya çalışacaktır."
 RULE_OPTION_DEMOCRATIC_ALT_AI:0 "Alternatif Demokratik"
 RULE_OPTION_DEMOCRATIC_ALT_AI_URG_DESC:0 "YZ dünya meselelerinden uzak durmaya ve Blanco partisini iktidara getirerek iç sanayileşmeye odaklanmaya çalışacaktır. Sadece savaşın sonunda müttefiklere katılacaktır."
 RULE_OPTION_DEMOCRATIC_CONTINUE_THE_WAR_IN_BATAVIA:0 "Savaşa Batavia'da Devam Et"
 RULE_OPTION_DEMOCRATIC_CONTINUE_THE_ZUIDERZEE_WORKS:0 "Zuiderzee Çalışmalarına Devam Et"
 RULE_OPTION_DEMOCRATIC_CZE_AI_DESC:0 "Çekoslovak YZ'sı, Milli Hedef ağacının ilgili yollarından giderek demokratik kalmaya ve ağırlıklı olarak iç gelişimine odaklanmaya çalışacaktır."
 RULE_OPTION_DEMOCRATIC_ENG_AI_DESC:0 "İngiliz YZ'sı, Milli Hedef ağacındaki ilgili yoldan giderek Polonya'yı korumaya ve Almanlara karşı savunma savaşında müttefiklere liderlik etmeye çalışacaktır."
 RULE_OPTION_DEMOCRATIC_GRE_AI:0 "Venizelist"
 RULE_OPTION_DEMOCRATIC_HISTORICAL:0 "Demokratik - Tarihi"
 RULE_OPTION_DEMOCRATIC_HISTORICAL_AST_AI_DESC:0 "Avustralya YZ'sı, Milli Hedef ağacındaki tarihi olaylar zincirini ve kararlarını takip etmeye çalışacaktır."
 RULE_OPTION_DEMOCRATIC_HISTORICAL_CAN_AI_DESC:0 "Kanada YZ'sı, Milli Hedef ağacındaki tarihi olaylar zincirini ve kararlarını takip etmeye çalışacaktır."
 RULE_OPTION_DEMOCRATIC_HISTORICAL_FRA_AI_DESC:0 "Fransız YZ'si mümkün olduğunca tarihi olaylar zincirini takip etmeye çalışacaktır."
 RULE_OPTION_DEMOCRATIC_HISTORICAL_HOL_AI_DESC:0 "Hollanda YZ'sı, Milli Hedef ağacındaki ilgili yoldan giderek işgal edildiğinde Müttefiklere katılmaya çalışacak, ancak hükümetini Doğu Hint Adaları'na taşımayacaktır."
 RULE_OPTION_DEMOCRATIC_HISTORICAL_NZL_AI_DESC:0 "YZ mümkün olduğunca tarihi olaylar zincirini takip etmeye çalışacaktır."
 RULE_OPTION_DEMOCRATIC_HISTORICAL_RAJ_AI_DESC:0 "Hint YZ'si Britanya'ya sadık kalacak ve tarihi olaylar zincirini takip etmeye çalışacaktır."
 RULE_OPTION_DEMOCRATIC_HISTORICAL_SAF_AI_DESC:0 "Güney Afrika YZ'si mümkün olduğunca tarihi planı takip edecektir."
 RULE_OPTION_DEMOCRATIC_HISTORICAL_USA_AI_DESC:0 "ABD YZ'si mümkün olduğunca tarihi olaylar zincirini takip etmeye çalışacaktır."
 RULE_OPTION_DEMOCRATIC_HUN_AI_DESC:0 "Macar YZ'sı, Milli Hedef ağacındaki ilgili yoldan giderek anayasal bir monarşi olmaya çalışacak ve yeni Apostolik Kralı olarak V. Carl Wilhelm'i seçecektir."
 RULE_OPTION_DEMOCRATIC_LEAD_THE_MINOR_DEMOCRACIES:0 "Küçük Demokrasilere Liderlik Et"
 RULE_OPTION_DEMOCRATIC_LIBERAL:0 "Demokratik - Liberal"
 RULE_OPTION_DEMOCRATIC_LIBERAL_BUL_AI_DESC:0 "Bulgar Demokrat Partisi, Çar Boris'i iktidardan indirmek ve Müttefik yanlısı bir naip konseyi kurmak için komplo kurarken Müttefiklere katılmaya çalışacaktır."
 RULE_OPTION_DEMOCRATIC_NO_MORE_APPEASEMENT:0 "Artık Yatıştırma Yok"
 RULE_OPTION_DEMOCRATIC_NO_MORE_APPEASEMENT_ENG_AI_DESC:0 "İngiliz YZ'sı, Milli Hedef ağacındaki ilgili yoldan giderek Yatıştırma politikasını durdurmaya ve onu demokratik müdahalecilikle değiştirmeye çalışacaktır."
 RULE_OPTION_DEMOCRATIC_PAR_AI:0 "Demokratik"
 RULE_OPTION_DEMOCRATIC_PAR_AI_DESC:0 "YZ Rafael Franco'nun darbesine karşı savaşacak ve demokratik hükümetini sağlam tutmaya çalışmak için bir iç savaşa girecektir."
 RULE_OPTION_DEMOCRATIC_PER_AI:0 "Demokratik - Anayasal Monarşi"
 RULE_OPTION_DEMOCRATIC_PER_DESC:0 "YZ Şah üzerinde anayasal sınırlar uygulayacak ve sonunda demokratik bir ittifaka katılmaya çalışmadan önce bir demokrasi yolu izleyecektir."
 RULE_OPTION_DEMOCRATIC_POL_AI_DESC:0 "Polonya YZ'si demokrasiyi geri getirmeye ve Müttefiklere katılmaya çalışacaktır."
 RULE_OPTION_DEMOCRATIC_POR_AI_DESC:0 "Birleşik Krallık'tan etkilenen demokratik bir hükümet, Salazar'ın otoriter rejimini devirecek ve İngilizlerin yardımıyla Müttefiklere katılmadan önce ulusal sanayiyi geliştirmeye odaklanacaktır."
 RULE_OPTION_DEMOCRATIC_ROM_AI_DESC:0 "Rumen YZ'sı, Milli Hedef ağaçlarındaki ilgili yollardan giderek ülkeyi işleyen bir demokrasiye dönüştürmeye ve diğer büyük demokratik güçlerle ittifak kurmaya çalışacaktır."
 RULE_OPTION_DEMOCRATIC_SEA:0 "Çin Demokratik Birliği"
 RULE_OPTION_DEMOCRATIC_SEA_DESC:0 "Çin Yapay Zekası, milli hedef ağacının Demokratik Birlik yolundan gitmeye çalışacaktır."
 RULE_OPTION_DEMOCRATIC_SIA_AI:0 "$RULE_OPTION_DEMOCRATIC$"
 RULE_OPTION_DEMOCRATIC_SIA_AI_DESC:0 "$RULE_DEMOCRATIC_ALTERNATE_NZL_AI_DESC$"
 RULE_OPTION_DEMOCRATIC_SOCIALIST:0 "Demokratik - Sosyalist"
 RULE_OPTION_DEMOCRATIC_SOCIALIST_BUL_AI_DESC:0 "Nikola Mushanov liderliğindeki hükümet sosyalist politikaları izleyecek, bir Balkan Konfederasyonu kurmak ve Balkanları yabancı saldırganlara karşı savunmak için komşu uluslarla ilişkilerini geliştirmeye çalışacaktır."
 RULE_OPTION_DEMOCRATIC_YUG_AI_DESC:0 "Yugoslav YZ'sı, Milli Hedef ağacının ilgili yollarından giderek demokratik bir hükümeti sürdürmeye çalışacaktır."
 RULE_OPTION_DEN_FASCIST:0 "Faşist Danimarka"
 RULE_OPTION_DEN_FASCIST_AI_DESC:0 "Faşist Parti Danimarka'da iktidarı ele geçirmeye ve eski Kuzey Denizi İmparatorluğu'nu yeniden kurmaya çalışacaktır."
 RULE_OPTION_DEN_MONARCHIST:0 "Yayılmacı Monarşi"
 RULE_OPTION_DEN_MONARCHIST_AI_DESC:0 "Kral X. Christian doğal kaynakları güvence altına almaya ve İskandinavya'nın geri kalanını her ne pahasına olursa olsun kontrol ederek Danimarka'nın askeri yeteneklerini güçlendirmeye çalışacaktır."
 RULE_OPTION_DEN_REARMAMENT:0 "Danimarka Yeniden Silahlanması"
 RULE_OPTION_DEN_REARMAMENT_AI_DESC:0 "Danimarka daha güçlü uluslarla ittifak arayacak ve herhangi bir işgal girişimine direnmeye çalışacaktır."
 RULE_OPTION_DICTATORSHIP_NEUTRAL:0 "Tarafsız Diktatörlük"
 RULE_OPTION_DICTATORSHIP_NEUTRAL_AI_DESC:0 "YZ otoriter bir diktatörlük yoluna girecek ancak tarafsız kalmaya çalışacaktır."
 RULE_OPTION_DICTATORSHIP_WARMONGER_AI_DESC:0 "YZ otoriter bir diktatörlük yoluna girecek ve topraklarını genişletmeye çalışacaktır."
 RULE_OPTION_DISPERSE_MILITARY_POWER:0 "Askeri Gücü Dağıt"
 RULE_OPTION_DISPERSE_MILITARY_POWER_AI_DESC:0 "YZ dünya meselelerinde tarafsız kalacak ve kışkırtılmadıkça kendi ülkesini geliştirmeye çalışacaktır."
 RULE_OPTION_EMPIRE_AFG:0 "İkinci Afgan İmparatorluğu"
 RULE_OPTION_EMPIRE_AFG_AI_DESC:0 "Afgan yapay zekâsı, Kral Zahir Şah’ı görevden alarak yerine Emir Seyyid Mir Muhammed Alim Han’ı getirmeye çalışacak. Emir, ardından Afgan kabilelerini birleştirmeye çalışacak. Sonrasında ise Afganistan sınırlarını genişletmeye yönelecek ve nihayetinde yeni bir Afgan İmparatorluğu kurmayı hedefleyecek."
 RULE_OPTION_ENG_FRAGMENTED:0 "Parçalanmış Birleşik Krallık"
 RULE_OPTION_ENG_FRAGMENTED_DESC:0 "Birleşik Krallık'ı oluşturan serbest bırakılabilir tüm kurucu uluslar oyun başlangıcında özgür ve bağımsız uluslar olarak serbest bırakılır."
 RULE_OPTION_ETH_ANARCHIST:0 "Anarko-Komünist: Dünyaya Çağrı"
 RULE_OPTION_ETH_ANARCHIST_desc:0 "YZ, dünyanın dört bir yanından komünistlerin ve anarşistlerin desteğiyle Etiyopya'yı anarko-komünist bir federasyona dönüştürmeye çalışacaktır."
 RULE_OPTION_ETH_COLLABORATIONIST:0 "Faşist: İşbirlikçi"
 RULE_OPTION_ETH_COLLABORATIONIST_desc:0 "YZ Haile Selassie'yi arkadan vuracak ve İtalyanların tarafına geçerek Etiyopya'nın faşist bir kukla olmasına neden olacaktır."
 RULE_OPTION_ETH_FRAGMENTED:0 "Parçalanmış Etiyopya"
 RULE_OPTION_ETH_FRAGMENTED_DESC:0 "Etiyopya ülkeyi oluşturan bölgesel devletlere bölünecektir"
 RULE_OPTION_ETH_IMPERIAL:0 "İmparatorluk: Aslan Sağlam Duruyor"
 RULE_OPTION_ETH_INDEPENDENT_FASCIST:0 "Faşist: Bağımsız"
 RULE_OPTION_ETH_INDEPENDENT_FASCIST_desc:0 "YZ Haile Selassie'yi arkadan vuracak ve İtalyanların tarafına geçerek Etiyopya'nın faşist bir kukla olmasına neden olacaktır. Ancak, özgürleşmeye ve bağımsız bir faşist ulus olmaya çalışacaktır."
 RULE_OPTION_ETH_STALINIST:0 "Komünist: Sovyet Yardımı"
 RULE_OPTION_ETH_STALINIST_desc:0 "YZ Etiyopya'yı komünist yapmaya ve Sovyetler Birliği'nin desteğini kazanarak onu Stalinist bir kukla haline getirmeye çalışacaktır."
 RULE_OPTION_EXILES_FASCIST_SOV_AI_DESC:0 "Sovyet YZ'sı, Milli Hedef ağacındaki ilgili yoldan giderek Komünistleri iç savaş yoluyla kovacak ve faşist bir hükümet kuracaktır."
 RULE_OPTION_EXILES_TSARIST_SOV_AI_DESC:0 "Sovyet YZ'sı, Milli Hedef ağacındaki ilgili yoldan giderek Komünistleri iç savaş yoluyla kovacak ve Çarlık Rusyası'nı yeniden kuracaktır."
 RULE_OPTION_EXPANSIONIST_FASCIST_BEL_AI:0 "Yayılmacı Faşistler (VNV)"
 RULE_OPTION_EXPANSIONIST_FASCIST_BEL_AI_DESC:0 "YZ Flaman Milliyetçi Faşistlerle gidecek ve saldırgan bir şekilde aşağı ülkeleri birleştirmeye çalışacak, ardından Fransa'ya yönelecektir."
 RULE_OPTION_FALANGIST:0 "Falanjizm"
 RULE_OPTION_FALANGIST_DESC:0 "José Antonio Primo de Rivera yönetimindeki Falanjistler Carlizm'i reddedecek ve İspanyol emperyalizmini geri getirmeye çalışacaktır."
 RULE_OPTION_FASCISM:0 "Faşizm"
 RULE_OPTION_FASCISM_AFG_AI_DESC:0 "Afgan YZ'si Kral Zahir Şah'ı devirmeye ve yerine ülkeyi hızla modernize etmeye çalışacak olan Amanullah Han'ı getirmeye çalışacaktır. Afganistan daha sonra Mihver güçlerinin yardımıyla sınırlarını genişletmeye çalışacaktır."
 RULE_OPTION_FASCISM_ALTERNATE_GRE_AI_DESC:0 "Yunanistan demokratik olacak, hükümette bir çöküş yaşayacak ve ardından en büyük hırslara yönelecektir..."
 RULE_OPTION_FASCISM_GRE_AI_DESC:0 "Yunanistan Nasyonal Sosyalist bir cumhuriyet olacak ve Türkiye ile birlikte Mihver'e katılmaya çalışacaktır."
 RULE_OPTION_FASCISM_IRQ_AI:0 "Faşizm - Altın Meydan"
 RULE_OPTION_FASCISM_IRQ_AI_DESC:0 "YZ mümkün olan en kısa sürede Altın Meydan'ı iktidara getirmeye çalışacak, ardından İngiltere ile savaşmak için Mihver'e katılacaktır. Daha sonra komşu Arap topraklarını ilhak etmeye çalışacaklardır."
 RULE_OPTION_FASCISM_PER_AI:0 "Faşizm - SUMKA"
 RULE_OPTION_FASCISM_PER_DESC:0 "YZ ülkenin milliyetçilerini birleştirecek ve SUMKA'yı kurarak ülkeye faşist bir rejim getirecektir. Faşist bir ittifaka katılmaya ve komşularına savaş ilan etmeye çalışacaktır."
 RULE_OPTION_FASCISM_TUR_AI:0 "Kemalist Faşizm"
 RULE_OPTION_FASCISM_TUR_AI_DESC:0 "Recep Peker Türkiye'yi faşist bir diktatörlüğe geçirecek ve Mihver'e katılmaya çalışacaktır."
 RULE_OPTION_FASCIST:0 "Faşist"
 RULE_OPTION_FASCIST_AI_URG_DESC:0 "YZ Mihver ile aynı hizaya gelecek ve ülkeyi bir Güney Amerika fethi için sıçrama tahtası haline getirecektir."
 RULE_OPTION_FASCIST_ALTERNATE:0 "Faşist - Alternatif"
 RULE_OPTION_FASCIST_ALTERNATE_GRE_AI:0 "Anadolu Faşisti"
 RULE_OPTION_FASCIST_BUL_AI_DESC:0 "Ülkede faşizm yükselirken, sağcı lider Hristo Lukov Mihver'e katılmaya çalışacak, sonunda Çar'ı devirecek ve bir askeri diktatörlük kuracaktır."
 RULE_OPTION_FASCIST_DICTATORSHIP:0 "Faşist Diktatörlük"
 RULE_OPTION_FASCIST_DICTATORSHIP_DESC:0 "Plutarco Calles, Saturnino Cedillo ve diğer askeri güçlü adamlar Meksika'nın yeni başlayan demokrasi girişimlerini engelleyecek ve Almanya'ya doğru yönelecektir."
 RULE_OPTION_FASCIST_FIFTH_EMPIRE:0 "Beşinci İmparatorluk"
 RULE_OPTION_FASCIST_FIFTH_EMPIRE_DESC:0 "Portekiz hükümeti Faşizmi benimseyecek, İspanyol İç Savaşı sırasında Cumhuriyetçilere karşı savaşacak ve Afrika, Asya ve Amerika'daki kayıp topraklarını geri almaya çalışarak yeniden büyük bir güç olarak yükselecektir."
 RULE_OPTION_FASCIST_GER_AI_DESC:0 "Alman YZ'sı faşist kalacak ve Milli Hedef ağacındaki ilgili yoldan giderek Avrupa'yı ele geçirmeye çalışacaktır."
 RULE_OPTION_FASCIST_HISTORICAL:0 "Faşist - Tarihi"
 RULE_OPTION_FASCIST_INDEPENDENT:0 "Faşist: Falanjist Enternasyonal"
 RULE_OPTION_FASCIST_PHI_AI:0 "Faşizm"
 RULE_OPTION_FASCIST_PHI_AI_DESC:0 "Filipinler Japonlarla aynı hizaya gelecek ve potansiyel olarak kendileri de faşizmin tuzağına düşecektir."
 RULE_OPTION_FASCIST_POR_AI_DESC:0 "Rafael Pereira, Faşist bir diktatör olarak Portekiz'in kontrolünü ele alacak, İspanyol İç Savaşı sırasında Milliyetçileri destekleyecek ve sonrasında Mihver'e katılmaya çalışacaktır."
 RULE_OPTION_FASCIST_SEA:0 "Faşist"
 RULE_OPTION_FASCIST_SEA_DESC:0 "Çin Yapay Zekası, milli hedef ağacının faşist yolundan gitmeye çalışacaktır."
 RULE_OPTION_FASCIST_URG_AI:0 "Faşist"
 RULE_OPTION_FIN_COMMUNIST_PLAN:0 "Komünist"
 RULE_OPTION_FIN_COMMUNIST_PLAN_DESC:0 "Sovyetler Birliği'nden yardım arayan komünistler, hükümeti devirmek ve ülkeyi yurtdışındaki kapitalist ve faşist tehditlere karşı yeni bir devrime yönlendirmek için sosyalistleri, sosyal-demokratları ve diğer solcu unsurları birleştirerek Fin sol hareketini organize edecektir."
 RULE_OPTION_FIN_DEMOCRATIC_PLAN:0 "Demokratik"
 RULE_OPTION_FIN_DEMOCRATIC_PLAN_DESC:0 "Fin Sosyal-Demokratları Fin halkına başvuracak ve Fin siyasetinin seyrinde köklü ama kansız bir değişikliğe öncülük edecektir. Finlandiya daha sonra ülkenin egemenliğini ve muhafazakar-sol toplumunu korumak için diğer batılı büyük demokrasilere katılmaya çalışacaktır."
 RULE_OPTION_FIN_FASCIST_PLAN:0 "Faşist"
 RULE_OPTION_FIN_FASCIST_PLAN_DESC:0 "Vatansever Halk Hareketi liderliğindeki Fin Sağı, eski muhafazakar demokrasiyi devirecek, Almanya ile bağları güçlendirmeye çalışacak ve güçlü bir ordu geliştirmek ve ülkenin sınırlarını Büyük Finlandiya fikrine göre genişletmek için Mustapaidat ve Suojeluskunta gibi örgütlere güvenecektir."
 RULE_OPTION_FLEXIBLE_PHI_AI:0 "Esnek"
 RULE_OPTION_FLEXIBLE_PHI_AI_DESC:0 "Filipinler, potansiyellerini en üst düzeye çıkarmak için ABD ve Japonları birbirine düşürecektir."
 RULE_OPTION_FOCUSES_ONLY:0 "Sadece Odaklar"
 RULE_OPTION_FOCUSES_ONLY_38:0 "Sadece Odaklar (1938'e Kadar)"
