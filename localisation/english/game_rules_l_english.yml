 RULE_OPTION_RIGHT_OPPOSITION_COOPERATIVE_SOV_AI_DESC:0 "Sovyet YZ'sı, Milli Hedef ağacının ilgili dallarından giderek Sağ Muhalefeti iktidara getirmeye ve partiye diğer muhalefet gruplarını dahil etmeye çalışacaktır. YZ için amaç Yüksek Sovyet'i kurmaktır."
 RULE_OPTION_RIGHT_OPPOSITION_SOV_AI_DESC:0 "Sovyet YZ'sı, Milli Hedef ağacının ilgili dallarından giderek Sağ Muhalefeti iktidara getirmeye çalışacaktır."
 RULE_OPTION_ROMANIA:0 "Monarşist: Hohenzollern Hanedanı"
 RULE_OPTION_SAME_FACTION:0 "Sadece Aynı İttifak"
 RULE_OPTION_SAME_IDEOLOGY:0 "Sadece Aynı İdeoloji"
 RULE_OPTION_SAPMI_RELEASED:0 "Sápmi Serbest Bırakıldı"
 RULE_OPTION_SAPMI_RELEASED_DESC:0 "Sápmi Finlandiya, İsveç ve Norveç'ten serbest bırakılacaktır."
 RULE_OPTION_SECOND_REPUBLIC:0 "İkinci Cumhuriyet"
 RULE_OPTION_SECOND_REPUBLIC_DESC:0 "İspanya'nın demokratik hükümeti İkinci Cumhuriyeti sürdürecek, hem Faşizmi hem de Komünizmi reddedecektir."
 RULE_OPTION_SECULAR_REPUBLIC:0 "Laik Cumhuriyet"
 RULE_OPTION_SECULAR_REPUBLIC_DESC:0 "Meksika'da ılımlı laikliğe ve hukukun üstünlüğüne yönelik eğilim güçlenecek ve ülke Amerika'ya doğru yönelecektir."
 RULE_OPTION_SHOW:0 "Göster"
 RULE_OPTION_SHOW_DESC_DESC:0 "Eski dallar Odak Ağacında her zaman görünür kalacaktır."
 RULE_OPTION_SIDQI_IRQ_AI:0 "Bekir Sıdkı - Bağlantısız"
 RULE_OPTION_SIDQI_IRQ_AI_DESC:0 "Bekir Sıdkı tarihi darbesini başlatacak ancak suikasta uğramayacaktır. Bunun yerine, hükümet bölgesel bir güç bloğu oluşturmak için İran ve Türkiye ile çalışacaktır."
 RULE_OPTION_SOCIAL_CATHOLICISM:0 "Sosyal Katoliklik"
 RULE_OPTION_SOCIAL_CATHOLICISM_DESC:0 "Katolik Kilisesi içindeki ılımlı reformcular Meksika içinde yeni bir konkordato oluşturacak, totalitarizmin sosyal çekişmelerine son verecek ve Meksika'yı Britanya'ya doğru yönlendirecektir."
 RULE_OPTION_SOVIET_REPUBLIC:0 "Sovyet Cumhuriyeti"
 RULE_OPTION_SOVIET_REPUBLIC_DESC:0 "Meksika Sovyetler Birliği'ne doğru yönelecek ve Devrimi süngü ucunda Latin Amerika'ya yayacaktır."
 RULE_OPTION_SOV_FRAGMENTED:0 "Dağılmış Sovyetler Birliği"
 RULE_OPTION_SOV_FRAGMENTED_DESC:0 "Sovyetler Birliği tüm SSC'leri oyun başlangıcından itibaren serbest bırakacak ve Soğuk Savaş'ın sonunda dağılmasından hemen sonraki gibi görünecektir."
 RULE_OPTION_SOV_UTTERLY_FRAGMENTED:0 "Tamamen Parçalanmış Sovyetler Birliği"
 RULE_OPTION_SOV_UTTERLY_FRAGMENTED_DESC:0 "Sovyetler Birliği'ni oluşturan serbest bırakılabilir tüm Cumhuriyetler, Okruglar ve Bölgeler oyun başlangıcında özgür ve bağımsız uluslar olarak serbest bırakılır."
 RULE_OPTION_SPR_FAMILIAR:0 "11 Kasım"
 RULE_OPTION_SPR_FAMILIAR_DESC:0 "İspanya'nın sınırları tanıdık bir şeye göre yeniden çizilecektir."
 RULE_OPTION_SPR_FRAGMENTED:0 "Parçalanmış İspanya"
 RULE_OPTION_SPR_FRAGMENTED_DESC:0 "Katalonya, Galiçya ve Navarra oyun başlangıcında özgür ve bağımsız devletler olarak serbest bırakılacaktır."
 RULE_OPTION_STALINIST:0 "Stalinist Komünizm"
 RULE_OPTION_STALINIST_DESC:0 "Moskova'dan emir alan gerçek Komünistler, Anarşistlere ve Faşistlere direnecek, Bağımsız Komünistlerin etkisini azaltacak ve Stalinist rehberlik altında İkinci Cumhuriyet için yeni bir çağ başlatacaktır."
 RULE_OPTION_STALINIST_GRE_AI:0 "Stalinist"
 RULE_OPTION_STALINIST_GRE_AI_DESC:0 "Yunanistan Komintern'e katılmaya ve Türkiye ile Boğazlar için bir savaşa girmeye çalışacaktır."
 RULE_OPTION_SWE_COMMUNISM:0 "Komünizm"
 RULE_OPTION_SWE_COMMUNISM_DESC:0 "İsveç YZ'si komünist ağacı izleyecek ve ya Mihver ya da Müttefiklerle ittifak kuracaktır."
 RULE_OPTION_SWE_DEMOCRATIC_NORDIC_DEFENCE_COUNCIL:0 "İskandinav Savunma Konseyi"
 RULE_OPTION_SWE_DEMOCRATIC_NORDIC_DEFENCE_COUNCIL_DESC:0 "YZ İskandinavları korumak için İskandinav Savunma Konseyi'ni kurmaya çalışacaktır."
 RULE_OPTION_SWE_DEM_ALT:0 "Alternatif Demokratik"
 RULE_OPTION_SWE_DEM_ALT_DESC:0 "İsveç YZ'si demokratik ağacı izleyecek ancak daha hızlı yeniden silahlanarak ve sağ eğilimli politikalara daha fazla yaslanarak savaşa aktif olarak dahil olma olasılığı daha yüksek olacaktır."
 RULE_OPTION_SWE_FASCIST_INDEPENDENT:0 "Bağımsız Faşist"
 RULE_OPTION_SWE_FASCIST_INDEPENDENT_DESC:0 "İsveç YZ'si faşist yolu izleyecek, bağımsız kalacak ve Büyük İskandinav Krallığı'nı kurmaya çalışacaktır."
 RULE_OPTION_SWE_FASCIST_PUPPET:0 "İtaatkar Reichskommissariat Faşisti"
 RULE_OPTION_SWE_FASCIST_PUPPET_BACKSTABBER:0 "Hain Reichskommissariat Faşisti"
 RULE_OPTION_SWE_FASCIST_PUPPET_BACKSTABBER_DESC:0 "İsveç YZ'si faşist yolu izleyecek, Almanya'ya tabi olacak ve zamanı geldiğinde onlardan ayrılacaktır."
 RULE_OPTION_SWE_FASCIST_PUPPET_DESC:0 "İsveç YZ'si faşist yolu izleyecek, Almanya'ya tabi olacak ve efendisine itaatkar kalacaktır."
 RULE_OPTION_SWE_UNALIGNED:0 "Monarşist"
 RULE_OPTION_SWE_UNALIGNED_DESC:0 "İsveç YZ'si bağlantısız yolu izleyecek, kralı iktidara geri getirecek ve Büyük İskandinav Krallığı'nı kurmaya çalışacaktır."
 RULE_OPTION_SWI_ALLIED_DEMOCRATIC:0 "Müttefik Demokratik"
 RULE_OPTION_SWI_ALLIED_DEMOCRATIC_AI_DESC:0 "YZ İsviçre'yi silahlandıracak ve savaşa hazırlayacak, İsviçre'yi dünyanın demokratik güçleriyle aynı hizaya getirecek, sonunda Müttefikler lehine tarafsızlığı bozacaktır."
 RULE_OPTION_SWI_EXPANSIONIST_DEMOCRATIC:0 "Yayılmacı Demokrasi"
 RULE_OPTION_SWI_EXPANSIONIST_DEMOCRATIC_AI_DESC:0 "YZ İsviçre çevresindeki devletleri konfederasyona katılmaya ikna etmeye çalışacak ve bu devletlerin eyaletlerinin özgür olmasına izin vermeyi reddetmesi durumunda ülkeyi silahlandıracaktır."
 RULE_OPTION_SWI_FASCIST:0 "Faşist"
 RULE_OPTION_SWI_FASCIST_AI_DESC:0 "YZ İsviçre'yi Almanya ile aynı hizaya getirecek ve ülkeyi yavaş yavaş faşistleştirecek, sonunda ya Mihver ile ittifak kuracak ya da bir Alman Kuklası olacaktır."
 RULE_OPTION_SWI_IMPERIAL:0 "İmparatorluk"
 RULE_OPTION_SWI_IMPERIAL_AI_DESC:0 "YZ, tarafsızlığı ve demokrasiyi militarist ve yayılmacı bir rejim lehine terk ederek Alp Himayesi'ni kurmaya çalışacaktır."
 RULE_OPTION_THEOCRATIC_ORDER:0 "Teokratik Düzen"
 RULE_OPTION_THEOCRATIC_ORDER_DESC:0 "Sinarkistler ve Cristero'lar Meksika'da iktidarı ele geçirecek ve kıtayı kafirlerden temizlemek için yeni bir Latin Amerika düzeni yaratacaktır."
 RULE_OPTION_THE_KINGS_PARTY:0 "Kralın Partisini Güçlendir"
 RULE_OPTION_THE_KINGS_PARTY_ENG_AI_DESC:0 "İngiliz YZ'sı, Milli Hedef ağacındaki ilgili yoldan giderek Kral VIII. Edward'ın Wallis Simpson ile evliliğini desteklemeye ve Kralın Partisini güçlendirmeye çalışacaktır."
 RULE_OPTION_THE_RETURN_OF_FERDINAND:0 "I. Ferdinand'ın Dönüşü"
 RULE_OPTION_THE_RETURN_OF_FERDINAND_BUL_AI_DESC:0 "Çar III. Boris'in ölümünün ardından babası I. Ferdinand yeniden tahta geçecek ve on yıllar önce kendisine haksızlık edenlerden intikam almaya çalışacaktır."
 RULE_OPTION_THREE_YEARS:0 "3 Yıl"
 RULE_OPTION_TRADE_UNIONS:0 "Sendikalara Taviz Ver"
 RULE_OPTION_TRADE_UNIONS_ENG_AI_DESC:0 "İngiliz YZ'sı, Milli Hedef ağacındaki ilgili yoldan giderek Sendikalara taviz vermeye ve komünist olmaya çalışacaktır."
 RULE_OPTION_TRUE_HISTORICAL_INS_AI:0 "Tarihsel"
 RULE_OPTION_TRUE_HISTORICAL_INS_AI_DESC:0 "Yapay zeka Hollanda'ya sadık kalacak, ancak Japon işgaliyle yüzleştikten sonra bir devrim başlatacak."
 RULE_OPTION_TUR_DEMOCRATIC_ALTERNATE:0 "Demokratik Muhafazakarlık"
 RULE_OPTION_TUR_DEMOCRATIC_ALTERNATE_DESC:0 "Adnan Menderes Türkiye'yi muhafazakar bir demokrasiye geçirecek ve Müttefiklere katılmaya çalışacaktır."
 RULE_OPTION_TUR_DEMOCRATIC_KEMALIST:0 "Demokratik Kemalizm"
 RULE_OPTION_TUR_DEMOCRATIC_KEMALIST_DESC:0 "Celâl Bayar Türkiye'yi Kemalist bir demokrasiye geçirecek ve Müttefiklere katılmaya çalışacaktır."
 RULE_OPTION_TUR_FASCISM_ALTERNATE:0 "Militarist Faşizm"
 RULE_OPTION_TUR_FASCISM_ALTERNATE_DESC:0 "Fevzi Çakmak Türkiye'yi muhafazakar yarı-faşist bir diktatörlüğe geçirecek ve İtalya ile bir ittifak kurmaya çalışacaktır."
 RULE_OPTION_TWO_YEARS:0 "2 Yıl"
 RULE_OPTION_VENEZELIST_GRE_AI_DESC:0 "Yunanistan Megali İdea'yı gerçekleştirme hakkı için savaşacaktır."
 RULE_OPTION_WANG_JINGWEI_SEA:0 "Wang Jingwei Cephesi"
 RULE_OPTION_WANG_JINGWEI_SEA_DESC:0 "Çin Yapay Zekası, milli hedef ağacının Wang Jingwei yolundan gitmeye çalışacaktır."
 RULE_OPTION_YES:0 "Evet"
 RULE_OPTION_YUG_FRAGMENTED:0 "Parçalanmış Yugoslavya"
 RULE_OPTION_YUG_FRAGMENTED_DESC:0 "Yugoslavya'yı oluşturan serbest bırakılabilir tüm kurucu uluslar oyun başlangıcında özgür ve bağımsız uluslar olarak serbest bırakılır."
 RULE_REPUBLICAN_DEMOCRACY_EXPANSIONIST_HUN_AI_DESC:0 "Macar YZ'si Horthy'ye karşı çıkacak, Macaristan'a demokrasi getirecek, sonunda Ejderha Hareketi'ni benimseyecek ve Büyük Macaristan'ı geri getirmeye çalışacaktır."
