 RULE_HISTORICAL_ETH_AI_DESC:0 "Etiyopya YZ'si Milletler Cemiyeti'ni kullanarak İtalya'yı yenmeye çalışacak ve bu başarısız olursa sürgüne gitmeye çalışacaktır. Daha sonra ana toprağını geri kazanmaya ve Etiyopya'yı yeniden inşa etmeye çalışacaktır."
