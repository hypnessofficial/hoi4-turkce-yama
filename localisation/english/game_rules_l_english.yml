 RULE_DEMOCRATIC_ALTERNATE_AST_AI_DESC:0 "Avustralya YZ'sı, Milli Hedef ağacının ilgili yollarından giderek Birleşik Krallık'tan tam bağımsızlık kazanmaya ve bölgelerinde önemli bir güç olmaya çalışacaktır."
 RULE_DEMOCRATIC_ALTERNATE_CAN_AI_DESC:0 "Kanada YZ'sı, Milli Hedef ağacındaki ilgili yoldan giderek tam bağımsızlık kazanmaya ve Amerika Birleşik Devletleri ile bir ittifak kurmaya çalışacaktır."
 RULE_DEMOCRATIC_ALTERNATE_FRA_AI_DESC:0 "Fransız yapay zekası, Almanya'yı kontrol altına almak için Küçük İtilaf'ı oluşturmaya çalışacak. Çekoslovakya'nın bu grubu oluşturması durumunda, onlar da ona katılacak (\"Death or Dishonor\" DLC'si gereklidir)."
 RULE_DEMOCRATIC_ALTERNATE_NZL_AI_DESC:0 "YZ, Milli Hedef ağacındaki ilgili yoldan giderek demokratik kalmaya ve tam egemenlik kurmaya çalışacaktır."
 RULE_DEMOCRATIC_ALTERNATE_SAF_AI_DESC:0 "Güney Afrika YZ'sı, Milli Hedef ağacındaki ilgili yoldan giderek demokratik kalmaya ve ana ülke ile ilişkilerde daha iddialı bir rol almaya çalışacaktır."
 RULE_DEMOCRATIC_ALTERNATE_USA_AI_DESC:0 "ABD YZ'sı, Milli Hedef ağacındaki ilgili yoldan giderek dünya meselelerinde daha aktif bir rol almaya çalışacaktır."
 RULE_DEMOCRATIC_ARG_AI_DESC:0 "YZ demokratikleşmeye çalışacak ve Güney Amerika'da demokrasi ve özgürlüğü korumak için Müttefiklere katılacaktır."
 RULE_DEMOCRATIC_BRA_AI_DESC:0 "Brezilya olağanüstü hali sona erdirerek Vargas'ı devirmeye çalışacaktır. Daha sonra ulusu reforme edecek, demokratik katılımı artıracak ve nihayetinde Mihver güçlerine karşı ABD ile işbirliği yapacaktır."
 RULE_DEMOCRATIC_CONTINUE_THE_WAR_IN_BATAVIA_HOL_AI_DESC:0 "Hollanda YZ'sı, Milli Hedef ağacındaki ilgili yoldan giderek demokratik kalmaya çalışacak, ancak teslim olduğunda başkentini Batavia'ya taşıyacaktır."
 RULE_DEMOCRATIC_CONTINUE_THE_ZUIDERZEE_WORKS_HOL_AI_DESC:0 "Hollanda YZ'sı, Milli Hedef ağacındaki ilgili yoldan giderek demokratik kalmaya çalışacak, ancak sömürgeleri yerine kıtasal yapılanmaya odaklanacaktır."
