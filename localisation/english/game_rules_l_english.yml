 RULE_OPTION_FREE_75:0 "%75 Dünya Geriliminde Serbest"
 RULE_OPTION_GERMANY_FRAGMENTED:0 "Parçalanmış Almanya"
 RULE_OPTION_GERMANY_FRAGMENTED_DESC:0 "Almanya çeşitli daha küçük devletlere parçalanmış olarak başlayacaktır"
 RULE_OPTION_GER_ALT_FASCIST:0 "Alternatif Faşizm"
 RULE_OPTION_GER_ALT_FASCIST_AI_DESC:0 "Alman YZ'si Hitler'i İç Çember üyelerinden biriyle değiştirmeye, von Neurath'ın endişelerini dikkate almaya ve Yeni Dünya Düzeni'ni uygulamaya çalışacaktır."
 RULE_OPTION_GER_COMMUNIST_SPARTACUS:0 "Spartaküs Birliği'ni Canlandır"
 RULE_OPTION_GER_COMMUNIST_SPARTACUS_AI_DESC:0 "Alman YZ'si Nazileri devirmeye ve komünist devrimi Almanya'ya getirmeye çalışacaktır. Daha sonra yeni Spartaküs Birliği altında daha demokratik bir sosyalist rejim kurmaya ve komünist devrimci yangını Avrupa geneline yaymaya çalışacaklardır."
 RULE_OPTION_GER_COMMUNIST_STALINIST:0 "Proletarya Diktatörlüğü"
 RULE_OPTION_GER_COMMUNIST_STALINIST_AI_DESC:0 "Alman YZ'si Nazileri devirmeye ve komünist devrimi Almanya'ya getirmeye çalışacaktır. Daha sonra proletarya diktatörlüğü kurmaya çalışacaklardır."
 RULE_OPTION_GOE_HISTORICAL:0 "GOE - Tarihi"
 RULE_OPTION_GOE_HISTORICAL_RAJ_AI_DESC:0 "$RULE_OPTION_DEMOCRATIC_HISTORICAL_RAJ_AI_DESC$"
 RULE_OPTION_GOE_INDIA_COMMUNISM:0 "GOE - Komünizm (Tarımsal Sosyalizm)"
 RULE_OPTION_GOE_INDIA_COMMUNISM_RAJ_AI_DESC:0 "Hindistan komünist odak ağacı aracılığıyla bağımsızlık kazanmaya çalışacaktır. Başarılı olursa, Hindistan tarımsal ekonomik büyümeye odaklanacak ve kendi benzersiz sosyalist ideolojisini kuracaktır."
 RULE_OPTION_GOE_INDIA_COMMUNISM_URBAN:0 "GOE - Komünizm (Kentsel Sanayicilik)"
 RULE_OPTION_GOE_INDIA_COMMUNISM_URBAN_RAJ_AI_DESC:0 "Hindistan komünist odak ağacı aracılığıyla bağımsızlık kazanmaya çalışacaktır. Başarılı olursa, Hindistan kentleşmeye ve toplumun hızlı sanayileşmesine odaklanacak ve Sovyetler Birliği'nden yardım almaya çalışacaktır."
 RULE_OPTION_GOE_INDIA_EAST_INDIA_COMPANY:0 "GOE - Doğu Hindistan Şirketi"
 RULE_OPTION_GOE_INDIA_EAST_INDIA_COMPANY_RAJ_AI_DESC:0 "Hindistan parçalanacak ve İngilizler Doğu Hindistan Şirketi'ni yeniden kuracaktır."
 RULE_OPTION_GOE_INDIA_FASCISM_BOSE:0 "GOE - Bağımsız Chandra Bose"
 RULE_OPTION_GOE_INDIA_FASCISM_BOSE_RAJ_AI_DESC:0 "Hindistan direniş yoluna girecek ve lider olarak Chandra Bose'u seçecek, bağımsızlığa karşı daha militan bir duruş sergileyecektir."
 RULE_OPTION_GOE_INDIA_FASCISM_HINDUTVA:0 "GOE - Hindutva Faşizmi"
 RULE_OPTION_GOE_INDIA_FASCISM_HINDUTVA_RAJ_AI_DESC:0 "Hindistan direniş yoluna girecek ve lider olarak Savarkar'ı seçecek, bağımsızlığa karşı daha militan bir duruş sergileyecek ve Akhand Bharat'ı kurmaya çalışacaktır."
 RULE_OPTION_GOE_INDIA_MUGHAL:0 "GOE - Babür İmparatorluğu"
 RULE_OPTION_GOE_INDIA_MUGHAL_RAJ_AI_DESC:0 "Hindistan Babür İmparatorluğu'nu kurmaya çalışacaktır."
 RULE_OPTION_GOE_INDIA_UNITED:0 "GOE - Birleşik Hindistan"
 RULE_OPTION_GOE_INDIA_UNITED_RAJ_AI_DESC:0 "Hindistan bağımsız olmaya, Demokratik kalmaya ve Müttefiklere katılmaya çalışacak, ancak tek bir ülke olarak birleşecek ve Bölünmeden kaçınacaktır."
 RULE_OPTION_HABSBURG:0 "Monarşist: Habsburg Hanedanı"
 RULE_OPTION_HASHEMITE_IRQ_AI:0 "Haşimi - Bağlantısız"
 RULE_OPTION_HASHEMITE_IRQ_AI_DESC:0 "YZ bölgedeki gücünü artırırken İngiltere'ye sadık kalmaya çalışacak, yavaş yavaş toprak yönetimini devralacak ve nihayetinde Haşimi Arap Federasyonu'nu kuracaktır."
 RULE_OPTION_HIDE:0 "Gizle"
 RULE_OPTION_HIDE_DESC:0 "Odak Ağacında daha kolay gezinme için belirli eski dallar uygun koşullar altında gizlenecektir."
 RULE_OPTION_HISTORICAL:0 "Tarihi"
 RULE_OPTION_HISTORICAL_AFG_AI_DESC:0 "Afgan YZ'si Müttefikler, Komintern ve Mihver güçlerinden ekonomik tavizler almaya çalışırken dönem boyunca tarafsız kalmaya çalışacaktır."
 RULE_OPTION_HISTORICAL_AUS_AI_DESC:0 "YZ faşistleşecek ve Vaterländische Front'un başında Anschluss'u engellemeye çalışacaktır."
 RULE_OPTION_HISTORICAL_BEL_AI:0 "Tarihi"
 RULE_OPTION_HISTORICAL_BEL_AI_DESC:0 "Belçika başlangıçta saldırıları engellemeye çalışacak, ancak daha sonra Kongo'ya geri çekilecek ve savaşa oradan devam edecektir."
 RULE_OPTION_HISTORICAL_BUL_AI_DESC:0 "Çar III. Boris ülkeyi Mihver'e doğru yönlendirecek, Bulgar sınırlarını barışçıl bir şekilde genişletmek için Alman arabuluculuğuna güvenecek, sonunda Üçlü Pakt'ı imzalayacak ve Bulgaristan'ın savaşa katılımını geciktirecektir."
 RULE_OPTION_HISTORICAL_CHI_AI_DESC:0 "Çin YZ'si mümkün olduğunca tarihi olaylar zincirini takip etmeye çalışacaktır."
 RULE_OPTION_HISTORICAL_COG_AI_DESC:0 "Kongo YZ'si Belçika ile kalacak ve ulusla ilişkisini tam potansiyeline kadar kullanacak, sonunda artan özerklik arayacaktır."
 RULE_OPTION_HISTORICAL_IRQ_AI:0 "Tarihi"
 RULE_OPTION_HISTORICAL_IRQ_AI_DESC:0 "YZ tarihi darbeler arasında gidip gelecek, Altın Meydan'ın kontrolü ele alması ve İngiltere ile savaşa girmesiyle sonuçlanacak, sonunda monarşiyi geri getirecek ve teslim olacaktır."
 RULE_OPTION_HISTORICAL_PAR_AI_DESC:0 "YZ küresel siyasetten uzak duracak ve iç sorunlara odaklanacak, onu savaştan uzak tutan istikrarsızlıklardan geçecektir."
 RULE_OPTION_HISTORICAL_PER_AI:0 "Tarihi"
