l_english:
 ARG_battleship_1:0 "Rivadavia Sınıfı"
 ARG_battleship_1_desc:0 "Rivadavia sınıfı, 1910'ların başında Arjantin donanması için ABD tarafından inşa edilen bir çift dretnot savaş gemisiydi. 27.500 ton deplasmana sahipti ve ana topları olarak on iki adet 305mm/50 kalibre top taşıyordu. 1950'lere kadar hizmette kaldı."
 ARG_destroyer_1:0 "Catamarca Sınıfı"
 ARG_destroyer_1_desc:0 "Catamarca sınıfı destroyerler, Arjantin Donanması tarafından sipariş edildi ve Birinci Dünya Savaşı'ndan kısa bir süre önce İngiltere tarafından inşa edildi. Dört adet 120mm/50 kalibre ana top ve dört adet 533mm torpido tüpüyle silahlandırılmıştı."
 ARG_destroyer_2:0 "Buenos Aires Sınıfı"
 ARG_destroyer_2_desc:0 "Buenos Aires sınıfı destroyerler, 1936 ile 1938 arasında Arjantin için İngiltere'de inşa edildi. İngiliz G sınıfı destroyerlere dayanıyordu. 1300 ton üzerinde deplasmana sahipti ve ana topları olarak dört adet QF 4.7 inç Mark IX top taşıyordu."
 ARG_heavy_cruiser_1:0 "Garibaldi Sınıfı"
 ARG_heavy_cruiser_1_desc:0 "Garibaldi sınıfı, yüzyıl dönümünde Arjantin için inşa edilen zırhlı kruvazörlerden oluşan bir sınıfı temsil eder. Hepsi 1930'ların ortalarında modası geçmişti, sonuncusu 1932'de hizmet dışı bırakıldı. 1931'de İngiliz yapımı Veinticinco de Mayo sınıfı ağır kruvazörlerle değiştirildiler."
 ARG_light_cruiser_1:0 "Libertad Sınıfı"
 ARG_light_cruiser_1_desc:0 "Libertad sınıfı gemilere 'Nehir Savaş Gemisi' tanımı verildi ancak aslında 1900'lerin başındaki daha küçük, daha hafif silahlı korumalı kruvazörlerle daha çok karşılaştırılabilir. Sınıfın iki gemisi 1890'ların sonunda inşa edildi ve İkinci Dünya Savaşı'nın başında hala görevdeydi."
 ARG_light_cruiser_2:0 "La Argentina Sınıfı"
 ARG_light_cruiser_2_desc:0 "La Argentina hafif kruvazörü, 1930'ların sonunda İngiltere tarafından Arjantin için inşa edildi. Savaştan önce birkaç eğitim seferi yaptı ancak savaş sırasında Arjantin tarafsızlığını korumak için aktif filoya alındı. Gemi, İngiliz Arethusa sınıfının büyütülmüş bir versiyonuydu, 6500 ton deplasmana sahipti ve ana topları olarak dokuz adet 6 inç top taşıyordu."
 ARG_submarine_1:0 "Santa Fe Sınıfı"
 ARG_submarine_1_desc:0 "Santa Fe sınıfı, İtalya'dan sipariş edilen ve 1933'te Arjantin'e teslim edilen üç denizaltıyı temsil eder. Sınıfın üç gemisi, 1960'a kadar Arjantin Denizaltı Gücü'nün belkemiğini oluşturdu. İnşa edildikleri Tarento, İtalya'daki tersaneler nedeniyle 'Tarantinolar' olarak adlandırıldılar."
 AST_SH_battleship_1:0 "Centurion Sınıfı"
 AST_SH_battleship_1_desc:0 "Centurion, Alman ve Japon donanmalarının büyük gemilerine karşı koymak için inşa edilen Kraliyet Donanması'nın varsayımsal ağır savaş gemilerinden oluşan bir sınıftı. Büyük 18 inç toplar ve kalın zırh, gemiyi bu gemilerle savaşmak için gerekli ateş gücü ve korumayı sağladı. Güçlü uçaksavar silahlanması, uzun menzil ve iyi hız, Britanya İmparatorluğu'nun geniş denizlerini korumak için bir gereklilikti."
 AST_SH_battleship_2:0 "Aslan II Sınıfı"
 AST_SH_battleship_2_desc:0 "Aslan II sınıfı savaş gemileri, 1944'te önceki Aslan sınıfı savaş gemisinin iyileştirilmiş bir versiyonu olarak tasarlandı. Savaş derslerini içeren bu tasarım daha büyük ve daha ağırdı ve tamamlanmış olsaydı, en son tipte üç veya dört üçlü 16 inç top taşıyacaktı. Kalın zırh plakaları, gemiyi herhangi bir yüzey veya hava düşmanından korudu. Bu gemileri inşa etmenin maliyeti, düşman donanmalarının yenilgisi ve uçak gemilerine duyulan ihtiyaç, projenin terk edilmesine neden oldu."
 AST_battle_cruiser_1:0 "Renown Sınıfı"
 AST_battle_cruiser_1_desc:0 "Renown sınıfı muharebe kruvazörleri, başlangıçta Revenge sınıfı savaş gemilerinin iyileştirilmiş versiyonları olarak kızağa kondu. İnşaatları I. Dünya Savaşı'nın patlak vermesiyle askıya alındı. Amiral Lord Fisher, inşaatlarını muharebe kruvazörü olarak yeniden başlatmayı başardı. Bu gemiler, öz muharebe kruvazörüydü. İyi silahlanmış, hızlı ve manevra kabiliyetine sahipti ancak daha ince zırha ve daha kısa operasyonel menzile sahipti. Orijinal üç gemiden yalnızca ikisi, Repulse ve Renown tamamlandı."
 AST_battle_cruiser_2:0 "Princess Royal Sınıfı"
 AST_battle_cruiser_2_desc:0 "Princess Royal, King George V sınıfı savaş gemilerinin daha hızlı ve daha ucuz bir versiyonu olan varsayımsal muharebe kruvazörlerinden oluşan bir sınıftı. Bu gemiler, hem yüzey hem de uçaksavar savaşı için benzer ancak azaltılmış bir silahlanma taşıyordu: iki üçlü 14 inç top ve altı ikiz 5.25 inç uçaksavar topu. Hızlı hızları ve uzun menzilleri, Kraliyet Donanması'na hızlı saldırı yetenekleri ve konvoy koruması sağlayacaktı, ancak sınırlı zırhları modern savaş gemileriyle savaşmak zorunda kalırsa sorunlu olacaktı."
 AST_battleship_1:0 "Revenge Sınıfı"
 AST_battleship_1_desc:0 "Revenge sınıfı savaş gemileri, 1913'te Queen Elizabeth sınıfı hızlı dretnotların ucuz versiyonları olarak sipariş edildi. Benzer şekilde silahlanmış ve zırhlı olmalarına rağmen, önemli ölçüde daha düşük hızları onları II. Dünya Savaşı sırasında ikincil görevlere zorladı. Sınıfın tasarlanan 8 gemisinden yalnızca 5'i tamamlandı."
 AST_battleship_2:0 "King George V Sınıfı"
 AST_battleship_2_desc:0 "King George V sınıfı savaş gemileri, 1922 Washington ve 1930 Birinci Londra Denizcilik Antlaşmaları'nın sonucuydu, bu da maksimum deplasman ve topçuluğu sınırladı. Bu nedenle, bu gemiler daha önceki ve hatta çağdaş savaş gemilerinden daha küçük kalibreli toplarla donatıldı. Daha küçük kalibreye rağmen, gemiler yeterli silahlanmış, güçlü uçaksavar silahlanmasına sahip ve yeterli korumaya sahipti. Beş gemi sipariş edildi ve eski Queen Elizabeth Sınıfı savaş gemilerinin yerine kızağa kondu."
 AST_battleship_3:0 "Aslan Sınıfı"
 AST_battleship_3_desc:0 "Aslan sınıfı savaş gemileri, King George V savaş gemilerinin ardılı sınıfıydı, birçok özelliğini içeriyordu. Altı gemi, yaşlanan Revenge sınıfı savaş gemilerinin yerini almak üzere 1938 Deniz Programı kapsamında sipariş edildi ancak hiçbiri patlak veren düşmanlıklar nedeniyle tamamlanmadı. Gemiler genel olarak King George sınıfına benzer olacaktı, ancak ana silahlanma daha ağır olacak, yeni bir 16 inç top tanıtılacaktı. Ayrıca daha kalın zırha ve daha güçlü motorlara sahip olacaklardı."
 AST_battleship_4:0 "Vanguard Sınıfı"
 AST_battleship_4_desc:0 "Vanguard sınıfı savaş gemisi, Kraliyet Donanması için inşa edilen son savaş gemisiydi. Tek bir gemi sipariş edildi ancak Pasifik tiyatrosu için dört tane daha düşünüldü. 1940 Acil Savaş Programı kapsamında sipariş edildi, inşaat yüksek bir öncelik almadı ve savaş sonrasında tamamlandı. Sınıf, mükemmel stabilite ve denize elverişlilik sağlayan şık bir gövdeye sahipti. Silahlanma, Queen Elizabeth ve Revenge sınıfı savaş gemileriyle aynıydı, önemli ateş gücü sağladı. Güçlü motorlar ve iyi zırh, gemiyi hızlı ve iyi korunmuş hale getirdi."
 AST_carrier_1:0 "Courageous Sınıfı"
 AST_carrier_1_desc:0 "Bu üç uçak gemisi, dönüştürülmüş muharebe kruvazörleriydi ve Kraliyet Donanması'nın ilk filo uçak gemileriydi. Dönüşümleri, 1922 Washington Denizcilik Antlaşması'nın sonucuydu ve çalışma 1925'te tamamlandı. Orta derecede zırhlı ancak iyi silahlanmış gemilerdi, uzun menzilli ve iyi hızlıydı, ancak dönüşümün doğası gereği uçak kapasiteleri sınırlıydı. Yine de, Kraliyet Donanması'na uçak gemisi inşası ve filo hava projeksiyonu konusunda önemli deneyim kazandırdı."
 AST_carrier_2:0 "Ark Royal Sınıfı"
 AST_carrier_2_desc:0 "Ark Royal uçak gemisi, Washington Denizcilik Antlaşması'nın kısıtlamalarına uyacak şekilde inşa edilen ilk gemidi. Hangarların ve uçuş güvertesinin geminin gövdesinin ayrılmaz bir parçası olduğu ilk gemiydi. 1934'te tasarlanan gemi iyi zırhlı ve silahlanmıştı. Kraliyet Donanması'nın ana kuvvetlerine ayak uydurabilmek için büyük bir uçak desteği ve yeterli operasyonel menzil ve hıza sahipti."
 AST_carrier_3:0 "Illustrious Sınıfı"
 AST_carrier_3_desc:0 "Illustrious sınıfı, 1936 İkinci Londra Denizcilik Antlaşması'nın kısıtlamaları dahilinde tasarlandı, bu da uçak gemisi boyutunu üst sınır olarak 23.000 ton ile sınırladı. Zırhlı bir uçuş güvertesine sahip ilk İngiliz uçak gemisiydi, bu da hava grubu boyutunu azalttı. Ağır zırh ve uçaksavar silahlanması, gemilere güçlü bir savunma sağlarken, güçlü motorlar ve büyük bir yakıt deposu gemilere uzun operasyonel menzil verdi."
 AST_carrier_4:0 "Implacable Sınıfı"
 AST_carrier_4_desc:0 "Implacable sınıfı uçak gemileri, 1938 Deniz Programı kapsamında sipariş edildi ve esasen önceki Illustrious sınıfının iyileştirilmiş versiyonlarıydı. Savaş ve erken ve orta aşamalarda konvoy koruma görevleri için daha küçük gemilere öncelik verilmesi, bu gemilerin inşasını yavaşlattı. Daha büyük gemilerdi, hem gövdede hem de uçuş güvertesinde kalın zırh korurken daha fazla uçak taşıyabiliyordu. Daha güçlü motorlar, Illustrious sınıfına kıyasla daha fazla hız ve operasyonel menzil sağladı."
 AST_destroyer_1:0 "Vendetta Sınıfı"
 AST_destroyer_1_desc:0 "Bu destroyerler, RAN'a transfer edilen ve 'Hurda Demir Filosu'nu oluşturan Amiral ve Thornycroft V ve W sınıflarını içeriyordu. Savaş Acil Programı kapsamında inşa edildi. I. Dünya Savaşı sırasında İngiliz destroyer tasarımının nihai evrimiydi, seleflerinin iyileştirmelerini ve yeni teknolojik gelişmeleri somutlaştırdı. Bu gemilerin büyük sayıları I. Dünya Savaşı'nın son aşamalarında inşa edildi ve sonrasında Kraliyet Donanması'nın destroyer filotillalarının belkemiği oldu. 1930'lardan itibaren, yedek filolara alındı, sonunda konvoy eskort görevlerine verildi. Yeterli silahlanmış, hızlı ve iyi menzilli gemilerdi."
 AST_destroyer_2:0 "G/H/I Sınıfı"
 AST_destroyer_2_desc:0 "G, H ve I sınıfı destroyerler, 1933 ve 1934 Deniz İnşa Programlarının bir parçası olarak sipariş edildi. Genellikle önceki F sınıfının tekrarlarıydı, boyutlarında hafif bir azalma vardı. G ve H sınıflarının silahlanması F sınıfıyla aynıydı, her ikisi de 4.7 inç toplar kullanıyordu. Bu gemiler uzun menzilli, yeterli silahlanmış ve güçlü bir torpido desteğine sahipti. Savaş sırasında yoğun şekilde kullanıldı ve çok sayıda kayıp verdi."
 AST_destroyer_3:0 "Nizam Sınıfı"
 AST_destroyer_3_desc:0 "Nizam sınıfı, RN'den transfer edilen J, K ve N sınıfı destroyerlerin tanımıydı. Daha önceki Tribal sınıfına benziyordu ancak top silahlanmasını vurgulamak yerine, tasarımcılar daha standart bir ağır torpido ve daha hafif top düzenine geri döndü. Gemiler, savaş boyunca modifiye edildi. Yükseltmeler arasında geliştirilmiş uçaksavar topları ve radar vardı. Filo eskortları için ideal hızlı, uzun menzilli ve iyi silahlanmış gemilerdi."
 AST_destroyer_4:0 "Muharebe Sınıfı"
 AST_destroyer_4_desc:0 "Muharebe sınıfı destroyerler, savaş boyunca kullanılan İngiliz destroyerlerinin evrimi üzerine inşa edildi. Gemiler, 1942 ve 1943 Deniz Programlarının bir parçası olarak sipariş edildi. Hem topları hem de torpidoları açısından iyi silahlanmıştı. Uçaksavar silahlanması, Denizaltı Savunma Harekatı (ASW) yetenekleri, hızı ve menzili onları çok yönlü gemiler yaptı."
 AST_heavy_cruiser_1:0 "Hawkins Sınıfı"
 AST_heavy_cruiser_1_desc:0 "Hawkins sınıfı kruvazörler, dünyadaki ilk ağır kruvazörlerdi. Daha önceki Town sınıfı hafif kruvazörlerine, özellikle Birmingham alt sınıfına dayanıyordu ancak 7.5 inç toplar ve daha kalın bir zırh kuşağıyla donatıldı. Almanya'nın büyük konvoy akıncılarıyla savaşmak için tasarlandı. İyi silahlanmış, makul hıza ve menzile sahip ve iyi korumalıydı. Toplamda beş gemi görevlendirildi ancak yalnızca dördü II. Dünya Savaşı'nın başında aktif durumdaydı."
 AST_heavy_cruiser_2:0 "Surrey Sınıfı"
 AST_heavy_cruiser_2_desc:0 "Surrey sınıfı ağır kruvazörler, 1928 Deniz Programı kapsamında önerildi. Daha önceki York sınıfı ağır kruvazörlerin iyileştirilmiş versiyonlarıydı. Tamamlanmış olsalardı, dört adet ikiz 8 inç top taretine, daha ağır zırha ve daha güçlü motorlara sahip olacaklardı. İki gemi sipariş edildi ancak hiçbiri kızağa konmadı."
 AST_heavy_cruiser_3:0 "Amiral Sınıfı"
 AST_heavy_cruiser_3_desc:0 "Amiral sınıfı ağır kruvazörler (Amiral sınıfı muharebe kruvazörleriyle karıştırılmamalıdır), Kraliyet Donanması'nın 8 inç toplarla donatılmış kruvazörler tasarlama ve inşa etme konusundaki son girişimiydi. Tasarım çalışmaları 1938'de başladı ve 1941'de sona erdi, çeşitli önerilerle sonuçlandı. Son öneriler, yeni 8 inç topları üçlü taretlerde, ağır uçaksavar silahlanması, kalın zırh ve iyi hıza sahipti. Düşman kruvazörlerinin olmaması ve bu gemilerin maliyet verimliliği, daha fazla hafif kruvazör inşa etmeye odaklanılmasına neden oldu."
 AST_heavy_cruiser_4:0 "Churchill Tasarımı"
 AST_heavy_cruiser_4_desc:0 "Bu gemiler, II. Dünya Savaşı'nın ilk aşamalarında Alman Deutschland sınıfı büyük top kruvazörlerine karşı koymak için Amirallik Lordu Sir Winston Churchill tarafından önerildi. Bu gemiler, 9.2 inç toplar, ağır uçaksavar ve güçlü zırha sahip olacaktı. Düşman ana gemileriyle etkili bir şekilde savaşmak için tasarlandı. Gemiler, yüksek maliyetler ve yeni bir ağır kruvazöre olan talep eksikliği nedeniyle sonunda iptal edildi."
 AST_light_cruiser_1:0 "C Sınıfı"
 AST_light_cruiser_1_desc:0 "C sınıfı hafif kruvazörler, Kraliyet Donanması'nın yirmi sekiz hafif kruvazöründen oluşan bir gruptu. Kuzey Denizi'nin zorlu koşulları için I. Dünya Savaşı öncesinde ve sırasında inşa edildi. Biraz küçük ve dar olmalarına rağmen sağlam ve yetenekli gemiler olduklarını kanıtladılar. Silahlanmaları daha fazlasıyla yeterliydi, düşman yüzey hedefleriyle savaşmak için yeterli 6 inç top ve ağır bir torpido yükü taşıyordu. I. Dünya Savaşı sırasında yoğun şekilde kullanıldı ve birçok yüzey eylemine katıldı. 1930'ların ortalarında hizmette olan yalnızca Caledon, Ceres ve Carlisle alt sınıflarıydı."
 AST_light_cruiser_2:0 "Southampton Sınıfı"
 AST_light_cruiser_2_desc:0 "Southampton sınıfı hafif kruvazörler, Town sınıfı kruvazörlerin bir alt sınıfıydı ve Japon Mogami sınıfı kruvazörlerine karşı koymak için tasarlandı. Bu gemiler iyi zırhlı, iyi hıza ve menzile sahipti ve dört üçlü tarette on iki adet 6 inç toptan oluşan etkileyici bir silahlanma taşıyordu. Kraliyet Donanması'nın savaş zamanı hafif kruvazör tasarımlarının çoğu için temel oluşturdular."
 AST_light_cruiser_3:0 "Crown Colony Sınıfı"
 AST_light_cruiser_3_desc:0 "Crown Colony sınıfı hafif kruvazörler, önceki Town sınıfının iyileştirilmiş versiyonlarıydı ancak inşayı hızlandırmak ve maliyetleri düşürmek için basitleştirilmiş bir tasarıma sahipti. Gemiler, selefleriyle aynı topları taşıyordu, dört üçlü tarette 6 inç toplar. Benzer şekilde zırhlıydı ancak daha küçük motorları nedeniyle menzilleri biraz azaldı. Tip, Fiji ve Seylan olmak üzere iki alt sınıf içeriyordu."
 AST_light_cruiser_4:0 "Minotaur Sınıfı"
 AST_light_cruiser_4_desc:0 "Swiftsure sınıfı olarak da bilinen bu kruvazörler, Crown Colony sınıfının modifiye edilmiş bir versiyonu olarak tasarlandı, 1941'de onaylanan savaş modifikasyonlarını içeriyordu. Crown Colony sınıfına kıyasla daha uzun operasyonel menzile ve daha fazla uçaksavar silahlanmasına sahipti, ana silahlanma üç üçlü tarette azaltıldı."
 AST_submarine_1:0 "L Sınıfı"
 AST_submarine_1_desc:0 "L sınıfı, Acil Savaş Programı kapsamında önceki denizaltı sınıflarının geliştirilmiş bir versiyonu olarak planlanan orta boy teknelerdi. I. Dünya Savaşı'nın son aşamalarında inşa edildi ve yeni, daha büyük 21 inç torpidolarla donatıldı. II. Dünya Savaşı'nın başlangıcına kadar hizmet ettiler, çoğunlukla ikincil ve eğitim görevleri için kullanıldılar."
 AST_submarine_2:0 "T Sınıfı"
 AST_submarine_2_desc:0 "T sınıfı veya Triton sınıfı tekneler, O, P ve R sınıfı büyük denizaltıların yerini almak üzere tasarlandı. Atlantik ve Pasifik Okyanusu için uygun uzun menzilli orta büyüklükte denizaltılardı. Bu tekneler iyi silahlanmış, stabil platformlardı ve çatışma sırasında yoğun şekilde kullanıldı, inşa edilen teknelerin yüzde 25'i savaş sırasında kaybedildi."
 AST_submarine_3:0 "U Sınıfı"
 AST_submarine_3_desc:0 "U sınıfı, Savaş Acil 1940 ve 1941 Programları kapsamında inşa edilen küçük boy denizaltılardı. Başlangıçta savaş patlak verdiğinde eğitim denizaltıları olarak tasarlandı, tasarım değişti ve bu denizaltılar Kuzey Denizi ve Akdeniz'in sınırlı sularında faydalı olduğunu kanıtladı. Daha küçük boyutları nedeniyle, menzilleri ve silahlanmaları sınırlıydı. Undine, Umpire ve Uproar olmak üzere üç alt sınıf oluşturdu."
 AST_submarine_4:0 "V Sınıfı"
 AST_submarine_4_desc:0 "V sınıfı veya Vampire sınıfı denizaltılar, önceki U sınıfı daha küçük boyutlu tekneleri temel alıyordu. Daha büyük ama yine de nispeten küçüktü, daha iyi deniz tutuşuna sahipti ancak operasyonel menzili ve silahlanması sınırlıydı."
 BRA_battleship_1:0 "Minas Gerais Sınıfı"
 BRA_battleship_1_desc:0 "Minas Gerais, 1900'lerin başında Brezilya için İngiltere tarafından inşa edilen iki dretnot savaş gemisinden oluşan bir sınıftı. II. Dünya Savaşı sırasında aktif durumdaydı ancak herhangi bir ciddi görev için çok modası geçmişti, bunun yerine Brezilya kıyılarında sahil savunma gemileri olarak kullanıldı."
 BRA_destroyer_1:0 "Maranhão Sınıfı"
 BRA_destroyer_1_desc:0 "Maranhão, 1922'de Brezilya'ya satılan İngiliz yapımı K sınıfı bir destroyerdi. Gemi yalnızca 930 ton üzerinde deplasmana sahipti ve dört adet 4 inç top taşıyordu."
 BRA_destroyer_2:0 "Juruena Sınıfı"
 BRA_destroyer_2_desc:0 "Juruena sınıfı destroyerler, 1930'ların sonunda Brezilya tarafından İngiltere'den sipariş edilen altı adet H sınıfı destroyerden oluşan bir seriydi. Ancak gemiler hiç teslim edilmedi, çünkü savaş 1939'da patlak verdiğinde İngilizler tarafından el konuldu. 1.300 ton üzerinde deplasmana sahipti, iyi bir hıza sahipti ve ana topları olarak üç adet QF 4.7 inç Mk IX top ve sekiz adet 533mm torpido tüpü taşıyordu."
 BRA_destroyer_3:0 "Marcílio Dias Sınıfı"
 BRA_destroyer_3_desc:0 "Marcílio Dias sınıfı destroyerler (bazen M sınıfı veya Greenhalgh sınıfı olarak da adlandırılır), 1943'te görevlendirilen Brezilya Donanması'na ait üç gemiden oluşuyordu. ABD yapımı Mahan sınıfı destroyerlere dayanıyordu ve Brezilya'da inşa edilen ilk büyük gemilerdi. 1.500 ton deplasmana sahipti ve beş adet 5 inç/38 kalibre ana top taşıyordu."
 BRA_destroyer_4:0 "Acre Sınıfı"
 BRA_destroyer_4_desc:0 "Acre sınıfı (bazen Amazonas sınıfı olarak da adlandırılır), Brezilya Donanması için inşa edilen altı destroyeri temsil eder. Hiçbiri savaşın sonundan önce tamamlanmadı. Gemiler, savaşın başında İngiltere tarafından el konulan altı Juruena sınıfı destroyerin yerini almak için Brezilya'da modifiye bir İngiliz tasarımı ve bazı ABD ekipmanları kullanılarak inşa edildi."
 BRA_light_cruiser_1:0 "Bahia Sınıfı"
 BRA_light_cruiser_1_desc:0 "Bahia sınıfı, Brezilya için İngiltere tarafından inşa edilen ve 1910'da teslim edilen iki keşif kruvazöründen oluşan bir sınıftı. Gemiler 1920'lerde ağır şekilde yenilenmiş ve modernize edilmişti ancak II. Dünya Savaşı'nın başında hala nispeten modası geçmiş bir tasarımdı. Savaş sırasında kruvazörler öncelikle konvoy eskort görevleri gerçekleştirdi."
 BRA_submarine_1:0 "Humaytá Sınıfı"
 BRA_submarine_1_desc:0 "Brezilya denizaltısı Humaytá, İtalya'dan sipariş edildi ve 1920'lerin sonunda teslim edildi. Derin deniz dalgıcı olarak tasarlanan modifiye bir Balilla sınıfı olarak tasarlandı. Yaklaşık 1.400 ton deplasmana sahipti ve altı adet 533mm torpido tüpüyle silahlandırıldı."
 BRA_submarine_2:0 "Tupy Sınıfı"
 BRA_submarine_2_desc:0 "Tupy sınıfı, 1930'ların ortalarında İtalya tarafından Brezilya için inşa edilen bir denizaltı sınıfıydı. Daha küçük denizaltılardı, yalnızca 600 ton üzerinde deplasmana sahipti ve altı adet 533mm torpido taşıyordu."
 CAN_SH_battleship_1:0 "Centurion Sınıfı"
 CAN_SH_battleship_1_desc:0 "Centurion, Alman ve Japon donanmalarının büyük gemilerine karşı koymak için inşa edilen Kraliyet Donanması'nın varsayımsal ağır savaş gemilerinden oluşan bir sınıftı. Büyük 18 inç toplar ve kalın zırh, gemiyi bu gemilerle savaşmak için gerekli ateş gücü ve korumayı sağladı. Güçlü uçaksavar silahlanması, uzun menzil ve iyi hız, Britanya İmparatorluğu'nun geniş denizlerini korumak için bir gereklilikti."
 CAN_SH_battleship_2:0 "Aslan II Sınıfı"
 CAN_SH_battleship_2_desc:0 "Aslan II sınıfı savaş gemileri, 1944'te önceki Aslan sınıfı savaş gemisinin iyileştirilmiş bir versiyonu olarak tasarlandı. Savaş derslerini içeren bu tasarım daha büyük ve daha ağırdı ve tamamlanmış olsaydı, en son tipte üç veya dört üçlü 16 inç top taşıyacaktı. Kalın zırh plakaları, gemiyi herhangi bir yüzey veya hava düşmanından korudu. Bu gemileri inşa etmenin maliyeti, düşman donanmalarının yenilgisi ve uçak gemilerine duyulan ihtiyaç, projenin terk edilmesine neden oldu."
 CAN_battle_cruiser_1:0 "Renown Sınıfı"
 CAN_battle_cruiser_1_desc:0 "Renown sınıfı muharebe kruvazörleri, başlangıçta Revenge sınıfı savaş gemilerinin iyileştirilmiş versiyonları olarak kızağa kondu. İnşaatları I. Dünya Savaşı'nın patlak vermesiyle askıya alındı. Amiral Lord Fisher, inşaatlarını muharebe kruvazörü olarak yeniden başlatmayı başardı. Bu gemiler, öz muharebe kruvazörüydü. İyi silahlanmış, hızlı ve manevra kabiliyetine sahipti ancak daha ince zırha ve daha kısa operasyonel menzile sahipti. Orijinal üç gemiden yalnızca ikisi, Repulse ve Renown tamamlandı."
 CAN_battle_cruiser_2:0 "Princess Royal Sınıfı"
 CAN_battle_cruiser_2_desc:0 "Princess Royal, King George V sınıfı savaş gemilerinin daha hızlı ve daha ucuz bir versiyonu olan varsayımsal muharebe kruvazörlerinden oluşan bir sınıftı. Bu gemiler, hem yüzey hem de uçaksavar savaşı için benzer ancak azaltılmış bir silahlanma taşıyordu: iki üçlü 14 inç top ve altı ikiz 5.25 inç uçaksavar topu. Hızlı hızları ve uzun menzilleri, Kraliyet Donanması'na hızlı saldırı yetenekleri ve konvoy koruması sağlayacaktı, ancak sınırlı zırhları modern savaş gemileriyle savaşmak zorunda kalırsa sorunlu olacaktı."
 CAN_battleship_1:0 "Revenge Sınıfı"
 CAN_battleship_1_desc:0 "Revenge sınıfı savaş gemileri, 1913'te Queen Elizabeth sınıfı hızlı dretnotların ucuz versiyonları olarak sipariş edildi. Benzer şekilde silahlanmış ve zırhlı olmalarına rağmen, önemli ölçüde daha düşük hızları onları II. Dünya Savaşı sırasında ikincil görevlere zorladı. Sınıfın tasarlanan 8 gemisinden yalnızca 5'i tamamlandı."
 CAN_battleship_2:0 "King George V Sınıfı"
 CAN_battleship_2_desc:0 "King George V sınıfı savaş gemileri, 1922 Washington ve 1930 Birinci Londra Denizcilik Antlaşmaları'nın sonucuydu, bu da maksimum deplasman ve topçuluğu sınırladı. Bu nedenle, bu gemiler daha önceki ve hatta çağdaş savaş gemilerinden daha küçük kalibreli toplarla donatıldı. Daha küçük kalibreye rağmen, gemiler yeterli silahlanmış, güçlü uçaksavar silahlanmasına sahip ve yeterli korumaya sahipti. Beş gemi sipariş edildi ve eski Queen Elizabeth Sınıfı savaş gemilerinin yerine kızağa kondu."
 CAN_battleship_3:0 "Aslan Sınıfı"
 CAN_battleship_3_desc:0 "Aslan sınıfı savaş gemileri, King George V savaş gemilerinin ardılı sınıfıydı, birçok özelliğini içeriyordu. Altı gemi, yaşlanan Revenge sınıfı savaş gemilerinin yerini almak üzere 1938 Deniz Programı kapsamında sipariş edildi ancak hiçbiri patlak veren düşmanlıklar nedeniyle tamamlanmadı. Gemiler genel olarak King George sınıfına benzer olacaktı, ancak ana silahlanma daha ağır olacak, yeni bir 16 inç top tanıtılacaktı. Ayrıca daha kalın zırha ve daha güçlü motorlara sahip olacaklardı."
 CAN_battleship_4:0 "Vanguard Sınıfı"
 CAN_battleship_4_desc:0 "Vanguard sınıfı savaş gemisi, Kraliyet Donanması için inşa edilen son savaş gemisiydi. Tek bir gemi sipariş edildi ancak Pasifik tiyatrosu için dört tane daha düşünüldü. 1940 Acil Savaş Programı kapsamında sipariş edildi, inşaat yüksek bir öncelik almadı ve savaş sonrasında tamamlandı. Sınıf, mükemmel stabilite ve denize elverişlilik sağlayan şık bir gövdeye sahipti. Silahlanma, Queen Elizabeth ve Revenge sınıfı savaş gemileriyle aynıydı, önemli ateş gücü sağladı. Güçlü motorlar ve iyi zırh, gemiyi hızlı ve iyi korunmuş hale getirdi."
 CAN_carrier_1:0 "Courageous Sınıfı"
 CAN_carrier_1_desc:0 "Bu üç uçak gemisi, dönüştürülmüş muharebe kruvazörleriydi ve Kraliyet Donanması'nın ilk filo uçak gemileriydi. Dönüşümleri, 1922 Washington Denizcilik Antlaşması'nın sonucuydu ve çalışma 1925'te tamamlandı. Orta derecede zırhlı ancak iyi silahlanmış gemilerdi, uzun menzilli ve iyi hızlıydı, ancak dönüşümün doğası gereği uçak kapasiteleri sınırlıydı. Yine de, Kraliyet Donanması'na uçak gemisi inşası ve filo hava projeksiyonu konusunda önemli deneyim kazandırdı."
 CAN_carrier_2:0 "Ark Royal Sınıfı"
 CAN_carrier_2_desc:0 "Ark Royal uçak gemisi, Washington Denizcilik Antlaşması'nın kısıtlamalarına uyacak şekilde inşa edilen ilk gemidi. Hangarların ve uçuş güvertesinin geminin gövdesinin ayrılmaz bir parçası olduğu ilk gemiydi. 1934'te tasarlanan gemi iyi zırhlı ve silahlanmıştı. Kraliyet Donanması'nın ana kuvvetlerine ayak uydurabilmek için büyük bir uçak desteği ve yeterli operasyonel menzil ve hıza sahipti."
 CAN_carrier_3:0 "Illustrious Sınıfı"
 CAN_carrier_3_desc:0 "Illustrious sınıfı, 1936 İkinci Londra Denizcilik Antlaşması'nın kısıtlamaları dahilinde tasarlandı, bu da uçak gemisi boyutunu üst sınır olarak 23.000 ton ile sınırladı. Zırhlı bir uçuş güvertesine sahip ilk İngiliz uçak gemisiydi, bu da hava grubu boyutunu azalttı. Ağır zırh ve uçaksavar silahlanması, gemilere güçlü bir savunma sağlarken, güçlü motorlar ve büyük bir yakıt deposu gemilere uzun operasyonel menzil verdi."
 CAN_carrier_4:0 "Implacable Sınıfı"
 CAN_carrier_4_desc:0 "Implacable sınıfı uçak gemileri, 1938 Deniz Programı kapsamında sipariş edildi ve esasen önceki Illustrious sınıfının iyileştirilmiş versiyonlarıydı. Savaş ve erken ve orta aşamalarda konvoy koruma görevleri için daha küçük gemilere öncelik verilmesi, bu gemilerin inşasını yavaşlattı. Daha büyük gemilerdi, hem gövdede hem de uçuş güvertesinde kalın zırh korurken daha fazla uçak taşıyabiliyordu. Daha güçlü motorlar, Illustrious sınıfına kıyasla daha fazla hız ve operasyonel menzil sağladı."
 CAN_destroyer_1:0 "V/W Sınıfı"
 CAN_destroyer_1_desc:0 "Bu destroyerler, Amiral ve Thornycroft V ve W sınıflarını içeriyordu. Savaş Acil Programı kapsamında inşa edildi. I. Dünya Savaşı sırasında İngiliz destroyer tasarımının nihai evrimiydi, seleflerinin iyileştirmelerini ve yeni teknolojik gelişmeleri somutlaştırdı. Bu gemilerin büyük sayıları I. Dünya Savaşı'nın son aşamalarında inşa edildi ve sonrasında Kraliyet Donanması'nın destroyer filotillalarının belkemiği oldu. 1930'lardan itibaren, yedek filolara alındı, sonunda konvoy eskort görevlerine verildi. Yeterli silahlanmış, hızlı ve iyi menzilli gemilerdi."
 CAN_destroyer_2:0 "Ottawa Sınıfı"
 CAN_destroyer_2_desc:0 "Ottawa sınıfı, 1933 ve 1934 Deniz İnşa Programlarının bir parçası olarak sipariş edilen İngiliz G, H ve I sınıfı destroyerlerin Kanada tanımıydı. Genellikle önceki F sınıfının tekrarlarıydı, boyutlarında hafif bir azalma vardı. G ve H sınıflarının silahlanması F sınıfıyla aynıydı, her ikisi de 4.7 inç toplar kullanıyordu. Bu gemiler uzun menzilli, yeterli silahlanmış ve güçlü bir torpido desteğine sahipti. Savaş sırasında yoğun şekilde kullanıldı ve çok sayıda kayıp verdi."
 CAN_destroyer_3:0 "J/K/N Sınıfı"
 CAN_destroyer_3_desc:0 "J, K ve N sınıfları, daha önceki Tribal sınıfına benziyordu ancak top silahlanmasını vurgulamak yerine, tasarımcılar daha standart bir ağır torpido ve daha hafif top düzenine geri döndü. Gemiler, savaş boyunca modifiye edildi. Yükseltmeler arasında geliştirilmiş uçaksavar topları ve radar vardı. Filo eskortları için ideal hızlı, uzun menzilli ve iyi silahlanmış gemilerdi."
 CAN_destroyer_4:0 "Algonquin Sınıfı"
 CAN_destroyer_4_desc:0 "Algonquin sınıfı, İngiliz Muharebe sınıfı destroyerlerin Kanada tanımıydı. Gemiler, 1942 ve 1943 Deniz Programlarının bir parçası olarak sipariş edildi. Hem topları hem de torpidoları açısından iyi silahlanmıştı. Uçaksavar silahlanması, Denizaltı Savunma Harekatı (ASW) yetenekleri, hızı ve menzili onları çok yönlü gemiler yaptı. Savaşa geç katılımları nedeniyle minimal bir katkı sağladılar."
 CAN_heavy_cruiser_1:0 "Hawkins Sınıfı"
 CAN_heavy_cruiser_1_desc:0 "Hawkins sınıfı kruvazörler, dünyadaki ilk ağır kruvazörlerdi. Daha önceki Town sınıfı hafif kruvazörlerine, özellikle Birmingham alt sınıfına dayanıyordu ancak 7.5 inç toplar ve daha kalın bir zırh kuşağıyla donatıldı. Almanya'nın büyük konvoy akıncılarıyla savaşmak için tasarlandı. İyi silahlanmış, makul hıza ve menzile sahip ve iyi korunmuştu. Toplamda beş gemi görevlendirildi ancak yalnızca dördü II. Dünya Savaşı'nın başında aktif durumdaydı."
 CAN_heavy_cruiser_2:0 "Surrey Sınıfı"
 CAN_heavy_cruiser_2_desc:0 "Surrey sınıfı ağır kruvazörler, 1928 Deniz Programı kapsamında önerildi. Daha önceki York sınıfı ağır kruvazörlerin iyileştirilmiş versiyonlarıydı. Tamamlanmış olsalardı, dört adet ikiz 8 inç top taretine, daha ağır zırha ve daha güçlü motorlara sahip olacaklardı. İki gemi sipariş edildi ancak hiçbiri kızağa konmadı."
 CAN_heavy_cruiser_3:0 "Amiral Sınıfı"
 CAN_heavy_cruiser_3_desc:0 "Amiral sınıfı ağır kruvazörler (Amiral sınıfı muharebe kruvazörleriyle karıştırılmamalıdır), Kraliyet Donanması'nın 8 inç toplarla donatılmış kruvazörler tasarlama ve inşa etme konusundaki son girişimiydi. Tasarım çalışmaları 1938'de başladı ve 1941'de sona erdi, çeşitli önerilerle sonuçlandı. Son öneriler, yeni 8 inç topları üçlü taretlerde, ağır uçaksavar silahlanması, kalın zırh ve iyi hıza sahipti. Düşman kruvazörlerinin olmaması ve bu gemilerin maliyet verimliliği, daha fazla hafif kruvazör inşa etmeye odaklanılmasına neden oldu."
 CAN_heavy_cruiser_4:0 "Churchill Tasarımı"
 CAN_heavy_cruiser_4_desc:0 "Bu gemiler, II. Dünya Savaşı'nın ilk aşamalarında Alman Deutschland sınıfı büyük top kruvazörlerine karşı koymak için Amirallik Lordu Sir Winston Churchill tarafından önerildi. Bu gemiler, 9.2 inç toplar, ağır uçaksavar ve güçlü zırha sahip olacaktı. Düşman ana gemileriyle etkili bir şekilde savaşmak için tasarlandı. Gemiler, yüksek maliyetler ve yeni bir ağır kruvazöre olan talep eksikliği nedeniyle sonunda iptal edildi."
 CAN_light_cruiser_1:0 "C Sınıfı"
 CAN_light_cruiser_1_desc:0 "C sınıfı hafif kruvazörler, Kraliyet Donanması'nın yirmi sekiz hafif kruvazöründen oluşan bir gruptu. Kuzey Denizi'nin zorlu koşulları için I. Dünya Savaşı öncesinde ve sırasında inşa edildi. Biraz küçük ve dar olmalarına rağmen sağlam ve yetenekli gemiler olduklarını kanıtladılar. Silahlanmaları daha fazlasıyla yeterliydi, düşman yüzey hedefleriyle savaşmak için yeterli 6 inç top ve ağır bir torpido yükü taşıyordu. I. Dünya Savaşı sırasında yoğun şekilde kullanıldı ve birçok yüzey eylemine katıldı. 1930'ların ortalarında hizmette olan yalnızca Caledon, Ceres ve Carlisle alt sınıflarıydı."
 CAN_light_cruiser_2:0 "Southampton Sınıfı"
 CAN_light_cruiser_2_desc:0 "Southampton sınıfı hafif kruvazörler, Town sınıfı kruvazörlerin bir alt sınıfıydı ve Japon Mogami sınıfı kruvazörlerine karşı koymak için tasarlandı. Bu gemiler iyi zırhlı, iyi hıza ve menzile sahipti ve dört üçlü tarette on iki adet 6 inç toptan oluşan etkileyici bir silahlanma taşıyordu. Kraliyet Donanması'nın savaş zamanı hafif kruvazör tasarımlarının çoğu için temel oluşturdular."
 CAN_light_cruiser_3:0 "Quebec Sınıfı"
 CAN_light_cruiser_3_desc:0 "Quebec sınıfı, İngiliz Crown Colony sınıfı hafif kruvazörlerin Kanada tanımıydı. Bunlar, önceki Town sınıfının iyileştirilmiş versiyonlarıydı ancak inşayı hızlandırmak ve maliyetleri düşürmek için basitleştirilmiş bir tasarıma sahipti. Gemiler, selefleriyle aynı topları taşıyordu, dört üçlü tarette 6 inç toplar. Benzer şekilde zırhlıydı ancak daha küçük motorları nedeniyle menzilleri biraz azaldı. Tip, Fiji ve Seylan olmak üzere iki alt sınıf içeriyordu."
 CAN_light_cruiser_4:0 "Ontario Sınıfı"
 CAN_light_cruiser_4_desc:0 "Ontario sınıfı, İngiliz Minotaur sınıfı (veya Swiftsure sınıfı) hafif kruvazörlerin Kanada tanımıydı. Bu kruvazörler, Crown Colony sınıfının modifiye edilmiş bir versiyonu olarak tasarlandı, 1941'de onaylanan savaş modifikasyonlarını içeriyordu. Crown Colony sınıfına kıyasla daha uzun operasyonel menzile ve daha fazla uçaksavar silahlanmasına sahipti, ana silahlanma üç üçlü tarette azaltıldı."
 CAN_submarine_1:0 "L Sınıfı"
 CAN_submarine_1_desc:0 "L sınıfı, Acil Savaş Programı kapsamında önceki denizaltı sınıflarının geliştirilmiş bir versiyonu olarak planlanan orta boy teknelerdi. I. Dünya Savaşı'nın son aşamalarında inşa edildi ve yeni, daha büyük 21 inç torpidolarla donatıldı. II. Dünya Savaşı'nın başlangıcına kadar hizmet ettiler, çoğunlukla ikincil ve eğitim görevleri için kullanıldılar."
 CAN_submarine_2:0 "T Sınıfı"
 CAN_submarine_2_desc:0 "T sınıfı veya Triton sınıfı tekneler, O, P ve R sınıfı büyük denizaltıların yerini almak üzere tasarlandı. Atlantik ve Pasifik Okyanusu için uygun uzun menzilli orta büyüklükte denizaltılardı. Bu tekneler iyi silahlanmış, stabil platformlardı ve çatışma sırasında yoğun şekilde kullanıldı, inşa edilen teknelerin yüzde 25'i savaş sırasında kaybedildi."
 CAN_submarine_3:0 "U Sınıfı"
 CAN_submarine_3_desc:0 "U sınıfı, Savaş Acil 1940 ve 1941 Programları kapsamında inşa edilen küçük boy denizaltılardı. Başlangıçta savaş patlak verdiğinde eğitim denizaltıları olarak tasarlandı, tasarım değişti ve bu denizaltılar Kuzey Denizi ve Akdeniz'in sınırlı sularında faydalı olduğunu kanıtladı. Daha küçük boyutları nedeniyle, menzilleri ve silahlanmaları sınırlıydı. Undine, Umpire ve Uproar olmak üzere üç alt sınıf oluşturdu."
 CAN_submarine_4:0 "V Sınıfı"
 CAN_submarine_4_desc:0 "V sınıfı veya Vampire sınıfı denizaltılar, önceki U sınıfı daha küçük boyutlu tekneleri temel alıyordu. Daha büyük ama yine de nispeten küçüktü, daha iyi deniz tutuşuna sahipti ancak operasyonel menzili ve silahlanması sınırlıydı."
 CHI_destroyer_1:0 "Jianwei Sınıfı"
 CHI_destroyer_1_desc:0 "Jianwei sınıfı, Çin Milliyetçi donanması için inşa edilen ve 1904'te hizmete giren büyük torpido botlarından oluşan bir sınıftı. Sınıfın iki gemisi modernize edildi ve Japon işgali sırasında hala hizmetteydi. Modernizasyon sonrası 870 ton deplasmana sahiptiler ve iki adet 4.7 inç ana top ile silahlandırılmışlardı."
 CHI_light_cruiser_1:0 "Hairong Sınıfı"
 CHI_light_cruiser_1_desc:0 "Hairong, 1890'ların sonunda Almanya tarafından Çin için inşa edilen korumalı bir kruvazördü. Gemi, yüzyıl dönümünde Çin için üretilen diğer korumalı kruvazörler ve sonraki hafif kruvazörlere benziyordu. Hairong yaklaşık 2.700 ton deplasmana sahipti ve üç adet 5.9 inç QF topu ile silahlandırılmıştı."
 CHL_battleship_1:0 "Almirante Latorre Sınıfı"
 CHL_battleship_1_desc:0 "Almirante Latorre sınıfı, Birinci Dünya Savaşı'nın başlangıcında Şili Donanması için İngiltere'de inşa edilen iki süper-dretnot savaş gemisinden oluşuyordu. Yalnızca biri savaş gemisi olarak tamamlandı, diğeri HMS Eagle uçak gemisine dönüştürüldü. Gemiler 28.000 ton üzerinde deplasmana sahipti ve ana silahlanmaları on adet 14 inç/45 kalibre BL topundan oluşuyordu. Dönemlerinin diğer dretnotlarına kıyasla daha az zırhlı ancak biraz daha hızlılardı."
 CHL_destroyer_1:0 "Almirante Lynch Sınıfı"
 CHL_destroyer_1_desc:0 "Almirante Lynch sınıfı destroyerler, Birinci Dünya Savaşı öncesinde Şili Donanması için İngiltere'de inşa edilen altı gemiden oluşan bir gruptu. Savaşın başlamasından önce yalnızca iki gemi teslim edildi ve 1945'e kadar hizmet verdi. 1.430 ton deplasmana sahiptiler, dönemlerine göre iyi hız ve menzile sahiptiler ve altı adet 4 inç L/40 QF Mark VI ana top ve iki adet 21 inç torpido tüpü ile silahlandırılmışlardı."
 CHL_heavy_cruiser_1:0 "O'Higgins Sınıfı"
 CHL_heavy_cruiser_1_desc:0 "O'Higgins, 20. yüzyılın başında Şili Donanması için İngiltere'de inşa edilen zırhlı bir kruvazördü. 7.800 ton deplasmana sahipti, ana silahlanması dört adet 8 inç/45 kalibre topundan oluşuyordu, ancak Birinci Dünya Savaşı sonrasında inşa edilen ağır kruvazörlere kıyasla oldukça yavaştı."
 CHL_light_cruiser_1:0 "Chacabuco Sınıfı"
 CHL_light_cruiser_1_desc:0 "Chacabuco, 1902'de Şili Donanması için İngiltere'de inşa edilen ve hizmete giren korumalı bir kruvazördü. 4.160 ton deplasmana sahipti ve iki adet Armstrong 8 inç ana top ve üç adet 18 inç torpido tüpü ile silahlandırılmıştı. Erken dönem hafif kruvazörlere kıyasla yavaş ancak iyi zırhlıydı."
 CHL_submarine_1:0 "H Sınıfı"
 CHL_submarine_1_desc:0 "Bu denizaltılar, Birinci Dünya Savaşı sırasında el konulan denizaltılar karşılığında İngiltere'de inşa edilen ve savaştan kısa bir süre sonra Şili'ye transfer edilen altı adet İngiliz H sınıfı veya Holland 602 denizaltıydı. Gemiler 1915 ile 1918 arasında inşa edildi. 360 ton üzerinde deplasmana sahiptiler, 30 metre dalış derinliğine sahiptiler ve dört adet 450mm torpido tüpü ile silahlandırılmışlardı."
 COL_destroyer_2:0 "Antioquia Sınıfı"
 COL_destroyer_2_desc:0 "Antioquia sınıfı, Kolombiya Donanması için Portekiz'de inşa edilen iki destroyerden oluşuyordu. Gemiler 1934'te hizmete girdi. 1.200 ton üzerinde deplasmana sahiptiler ve dört adet BL 4.7 inç top ve sekiz adet 533mm torpido tüpü ile silahlandırılmışlardı."
 DEN_destroyer_4:0 "Huitfeldt Sınıfı"
 DEN_destroyer_4_desc:0 "Huitfeldt sınıfı veya Najaden sınıfı, Danimarka'da inşa edilen ve hizmete giren iki büyük torpido botundan oluşuyordu. İnşaat 1942'de başladı ve gemiler 1947'de tamamlandı. 780 ton üzerinde deplasmana sahiptiler, ana silahlanmaları iki adet 105mm top, altı adet 533mm torpido tüpü ve çeşitli denizaltı savunma silahlarından oluşuyordu."
 DEN_heavy_cruiser_1:0 "Herluf Trolle Sınıfı"
 DEN_heavy_cruiser_1_desc:0 "Herluf Trolle sınıfı, 1901 ile 1908 arasında hizmete giren üç zırhlı sahil savaş gemisini temsil ediyordu. Savaş gemisi sınıflandırmasına rağmen, boyut ve silahlanma açısından bir kruvazöre daha yakındı. İkinci Dünya Savaşı'nın başında yalnızca biri, Peter Skram, hizmetteydi. Gemiler 3.700 ton üzerinde deplasmana sahipti, ana silahlanmaları iki adet 240mm/K43 topundan oluşuyordu ve iyi zırhlıydı, ancak döneminin çoğu dretnot savaş gemisine kıyasla daha yavaştı."
 DEN_submarine_1:0 "Rota Sınıfı"
 DEN_submarine_1_desc:0 "Rota sınıfı denizaltılar, Birinci Dünya Savaşı'nın sonunda Danimarka'da inşa edildi ve hizmete girdi. Küçük denizaltılardı ve Holland 602 tasarımına dayanıyorlardı. 290 ton deplasmana sahiptiler ve dört adet 450mm torpido tüpü ile silahlandırılmışlardı."
 DEN_submarine_2:0 "Havmanden Sınıfı"
 DEN_submarine_2_desc:0 "Havmanden sınıfı, beş planlanan denizaltıdan oluşuyordu. Üçü Alman işgalinden önce, biri işgal sırasında tamamlandı ve beşincisi iptal edildi. Denizaltılar oldukça küçüktü, 320 ton deplasmana sahipti. Beş adet 450mm torpido tüpü ile silahlandırılmışlardı."
 DEN_submarine_4:0 "Støren Sınıfı"
 DEN_submarine_4_desc:0 "Støren, savaş sonrasında Danimarka Donanması'na transfer edilen İngiliz Vampire sınıfı bir denizaltıydı. Gemi nispeten küçüktü, 545 ton deplasmana sahipti ancak dört adet 533mm torpido tüpü ve iyi deniz tutuş kabiliyetine sahipti."
 ENG_SH_battleship_1:0 "Centurion Sınıfı"
 ENG_SH_battleship_1_desc:0 "Centurion sınıfı, Alman ve Japon donanmalarının büyük gemilerine karşı koymak üzere inşa edilen varsayımsal Kraliyet Donanması ağır savaş gemilerinden oluşan bir sınıftır. Büyük 18 inç toplar ve kalın zırh, gemiyi bu gemilerle savaşmak için gerekli ateş gücü ve korumayla donatıyor. İngiliz İmparatorluğu'nun geniş denizlerini korumak için güçlü uçaksavar silahları, uzun menzil ve iyi hız bir zorunluluktu."
 ENG_SH_battleship_2:0 "Aslan II Sınıfı"
 ENG_SH_battleship_2_desc:0 "Aslan II sınıfı savaş gemileri, 1944'te önceki Aslan sınıfı savaş gemisinin iyileştirilmiş bir versiyonu olarak tasarlandı. Savaş deneyimlerini içeren bu tasarım daha büyük ve daha ağırdı ve tamamlanmış olsaydı, en son tipte üç veya dört üçlü 16 inç top taşıyacaktı. Kalın zırh plakaları gemiyi herhangi bir yüzey veya hava düşmanından koruyordu. Bu gemileri inşa etmenin maliyeti, düşman donanmalarının yenilgisi ve uçak gemilerine duyulan ihtiyaç projenin terk edilmesine neden oldu."
 ENG_battle_cruiser_1:0 "Renown Sınıfı"
 ENG_battle_cruiser_1_desc:0 "Renown sınıfı muharebe kruvazörleri, başlangıçta Revenge sınıfı savaş gemilerinin iyileştirilmiş versiyonları olarak kızağa kondu. I. Dünya Savaşı'nın patlak vermesiyle inşaları durduruldu. Amiral Lord Fisher, inşalarını muharebe kruvazörü olarak yeniden başlatmayı başardı. Bu gemiler tipik muharebe kruvazörleriydi. İyi silahlanmış, hızlı ve manevra kabiliyetine sahiplerdi ancak daha ince zırha ve daha kısa operasyonel menzile sahiplerdi. Orijinal üç gemiden sadece ikisi, Repulse ve Renown tamamlandı."
 ENG_battle_cruiser_2:0 "Princess Royal Sınıfı"
 ENG_battle_cruiser_2_desc:0 "Princess Royal sınıfı, King George V sınıfı savaş gemilerinin daha hızlı ve daha ucuz bir versiyonu olan varsayımsal muharebe kruvazörlerinden oluşan bir sınıftır. Bu gemiler hem yüzey hem de uçaksavar savaşı için benzer ancak azaltılmış bir silahlanmaya sahipti: iki üçlü 14 inç top ve altı çift 5.25 inç uçaksavar topu. Yüksek hızları ve uzun menzilleri Kraliyet Donanması'na hızlı saldırı yetenekleri ve konvoy koruması sağlayacaktı ancak sınırlı zırhları modern savaş gemileriyle savaşmak zorunda kalırlarsa sorun yaratacaktı."
 ENG_battleship_1:0 "Revenge Sınıfı"
 ENG_battleship_1_desc:0 "Revenge sınıfı savaş gemileri, 1913'te Queen Elizabeth sınıfı hızlı dreadnoughtların ucuz versiyonları olarak sipariş edildi. Benzer şekilde silahlanmış ve zırhlanmış olmalarına rağmen, önemli ölçüde daha düşük hızları onları II. Dünya Savaşı sırasında ikincil görevlere mahkum etti. Sınıfın planlanan 8 gemisinden sadece 5'i tamamlandı."
 ENG_battleship_2:0 "King George V Sınıfı"
 ENG_battleship_2_desc:0 "King George V sınıfı savaş gemileri, 1922 Washington ve 1930 Birinci Londra Deniz Antlaşmaları'nın başkent gemilerinin maksimum deplasmanını ve topçuluğunu sınırlamasının bir sonucuydu. Bu nedenle, bu gemiler önceki ve hatta çağdaşı savaş gemilerinden daha küçük kalibreli toplarla donatıldı. Daha küçük kalibreye rağmen, gemiler yeterli silahlanmaya, güçlü uçaksavar silahlarına ve yeterli korumaya sahipti. Beş gemi sipariş edildi ve eski Queen Elizabeth sınıfı savaş gemilerinin yerini almak üzere kızağa kondu."
 ENG_battleship_3:0 "Aslan Sınıfı"
 ENG_battleship_3_desc:0 "Aslan sınıfı savaş gemileri, King George V savaş gemilerinin birçok özelliğini bünyesinde barındıran takip sınıfıydı. Yaşlanan Revenge sınıfı savaş gemilerinin yerini almak üzere 1938 Deniz Programı kapsamında altı gemi sipariş edildi ancak patlak veren düşmanlıklar nedeniyle hiçbiri tamamlanamadı. Gemiler genel olarak King George sınıfına benzer olacaktı ancak ana silahlanma daha ağır olacak ve yeni bir 16 inç top tanıtılacaktı. Ayrıca daha kalın zırha ve daha güçlü motorlara sahip olacaklardı."
 ENG_battleship_4:0 "Vanguard Sınıfı"
 ENG_battleship_4_desc:0 "Vanguard sınıfı savaş gemisi, Kraliyet Donanması için inşa edilen son savaş gemisiydi. Tek bir gemi sipariş edildi ancak Pasifik cephesi için dört tane daha düşünüldü. 1940 Acil Savaş Programı kapsamında sipariş edildi, inşasına yüksek öncelik verilmedi ve savaştan sonra tamamlandı. Sınıf, mükemmel stabilite ve deniz tutma kabiliyeti sağlayan şık bir gövdeye sahipti. Silahlanma, Queen Elizabeth ve Revenge sınıfı savaş gemileriyle aynıydı, önemli bir ateş gücü sağlıyordu. Güçlü motorlar ve iyi zırh, gemiyi hızlı ve iyi korunaklı yapıyordu."
 ENG_carrier_1:0 "Courageous Sınıfı"
 ENG_carrier_1_desc:0 "Bu üç uçak gemisi, dönüştürülmüş muharebe kruvazörleriydi ve Kraliyet Donanması'nın ilk filo uçak gemileriydi. Dönüşümleri 1922 Washington Deniz Antlaşması'nın bir sonucuydu ve çalışma 1925'te tamamlandı. Orta düzeyde zırhlı ancak iyi silahlanmış, uzun menzilli ve iyi hıza sahip gemilerdi ancak dönüşümün doğası gereği taşıdıkları uçak sayısı sınırlıydı. Yine de, Kraliyet Donanması'na uçak gemisi inşası ve filo hava projeksiyonu konusunda önemli deneyim kazandırdılar."
 ENG_carrier_2:0 "Ark Royal Sınıfı"
 ENG_carrier_2_desc:0 "Ark Royal uçak gemisi, Washington Deniz Antlaşması'nın kısıtlamalarına uyacak şekilde inşa edilen ilk gemidir. Hangarların ve uçuş güvertesinin geminin gövdesinin ayrılmaz bir parçası olduğu ilk gemidir. 1934'te tasarlanan gemi iyi zırhlanmış ve silahlandırılmıştır. Büyük bir uçak kapasitesine sahipti ve Kraliyet Donanması'nın ana kuvvetlerine yetişebilmek için yeterli operasyonel menzile ve hıza sahipti."
 ENG_carrier_3:0 "Illustrious Sınıfı"
 ENG_carrier_3_desc:0 "Illustrious sınıfı, 1936 İkinci Londra Deniz Antlaşması'nın uçak gemisi boyutunu üst sınır olarak 23.000 tonla sınırlandırması dahilinde tasarlandı. Zırhlı uçuş güvertesine sahip ilk İngiliz uçak gemisiydi, bu da taşıdığı hava grubu boyutunu azalttı. Ağır zırh ve uçaksavar silahları gemilere güçlü bir savunma sağlarken, güçlü motorlar ve büyük yakıt deposu gemilere uzun operasyonel menzil sağlıyordu."
 ENG_carrier_4:0 "Implacable Sınıfı"
 ENG_carrier_4_desc:0 "Implacable sınıfı uçak gemileri, 1938 Deniz Programı kapsamında sipariş edildi ve esasen önceki Illustrious sınıfının iyileştirilmiş versiyonlarıydı. Savaş ve savaşın erken ve orta aşamalarında konvoy koruma görevleri için daha küçük gemilere öncelik verilmesi, bu gemilerin inşasını yavaşlattı. Daha büyük gemilerdi, gövde ve uçuş güvertesinde kalın zırh korurken daha fazla uçak taşıyabiliyorlardı. Daha güçlü motorlar, Illustrious sınıfına kıyasla daha yüksek hız ve operasyonel menzil sağlıyordu."
 ENG_destroyer_1:0 "V/W Sınıfı"
 ENG_destroyer_1_desc:0 "Bu muhripler, Amiralite ve Thornycroft V ve W sınıflarını içeriyordu. Savaş Acil Programı kapsamında inşa edildiler. I. Dünya Savaşı sırasında İngiliz muhrip tasarımının nihai evrimiydi, öncüllerinin iyileştirmelerini ve yeni teknolojik gelişmeleri bünyesinde barındırıyorlardı. I. Dünya Savaşı'nın son aşamalarında çok sayıda inşa edildiler ve sonrasında Kraliyet Donanması'nın muhrip filotillalarının bel kemiği oldular. 1930'lardan itibaren yedek filolara alındılar ve sonunda konvoy eskort görevlerine verildiler. Yeterli silahlanmaya, yüksek hıza ve iyi menzile sahip gemilerdi."
 ENG_destroyer_2:0 "G/H/I Sınıfı"
 ENG_destroyer_2_desc:0 "G, H ve I sınıfı muhripler, 1933 ve 1934 Deniz İnşa Programları'nın bir parçası olarak sipariş edildi. Genel olarak önceki F sınıfının tekrarlarıydı, boyutlarında hafif bir küçülme vardı. G ve H sınıflarının silahlanması F sınıfıyla aynıydı, her ikisi de 4.7 inç toplar kullanıyordu. Bu gemiler uzun menzilli, yeterli silahlanmaya sahip ve güçlü torpido donanımlıydı. Savaş sırasında yoğun şekilde kullanıldılar ve çok sayıda kayıp verdiler."
 ENG_destroyer_3:0 "J/K/N Sınıfı"
 ENG_destroyer_3_desc:0 "J, K ve N sınıfları, önceki Tribal sınıfına benziyordu ancak top silahlanmasını vurgulamak yerine, tasarımcılar daha standart bir ağır torpido ve hafif top düzenine geri döndüler. Gemiler savaş boyunca modifiye edildi. Geliştirmeler arasında iyileştirilmiş uçaksavar topları ve radar vardı. Filo eskortları için ideal, hızlı, uzun menzilli ve iyi silahlanmış gemilerdi."
 ENG_destroyer_4:0 "Muharebe Sınıfı"
 ENG_destroyer_4_desc:0 "Muharebe sınıfı muhripler, savaş boyunca kullanılan İngiliz muhriplerinin evrimi üzerine inşa edildi. Gemiler 1942 ve 1943 Deniz Programları'nın bir parçası olarak sipariş edildi. Hem topları hem de torpidoları açısından iyi silahlanmışlardı. Uçaksavar silahları, denizaltı savunma kabiliyetleri, hızları ve menzilleri onları çok yönlü gemiler yaptı. Savaşa geç katılmaları nedeniyle katkıları minimal düzeyde kaldı."
 ENG_heavy_cruiser_1:0 "Hawkins Sınıfı"
 ENG_heavy_cruiser_1_desc:0 "Hawkins sınıfı kruvazörler dünyadaki ilk ağır kruvazörlerdi. Önceki Town sınıfı hafif kruvazörler, özellikle Birmingham alt sınıfı temel alınarak geliştirilmişlerdi ancak 7.5 inç toplar ve daha kalın bir zırh kuşağıyla donatılmışlardı. Almanya'nın büyük konvoy akıncılarıyla savaşmak üzere tasarlanmışlardı. İyi silahlanmış, makul hız ve menzile sahip ve iyi korumalı gemilerdi. Toplamda beş gemi hizmete girdi ancak sadece dördü II. Dünya Savaşı'nın başında aktif durumdaydı."
 ENG_heavy_cruiser_2:0 "Surrey Sınıfı"
 ENG_heavy_cruiser_2_desc:0 "Surrey sınıfı ağır kruvazörler, 1928 Deniz Programı kapsamında önerildi. Önceki York sınıfı ağır kruvazörlerin iyileştirilmiş versiyonlarıydı. Tamamlanmış olsalardı, dört çift 8 inç top taretine, daha ağır zırha ve daha güçlü motorlara sahip olacaklardı. İki gemi sipariş edildi ancak hiçbiri kızağa konmadı."
 ENG_heavy_cruiser_3:0 "Amiral Sınıfı"
 ENG_heavy_cruiser_3_desc:0 "Amiral sınıfı ağır kruvazörler (Amiral sınıfı muharebe kruvazörleriyle karıştırılmamalıdır), Kraliyet Donanması'nın 8 inç toplarla donatılmış kruvazörler tasarlama ve inşa etme konusundaki son girişimiydi. Tasarım çalışmaları 1938'de başladı ve 1941'de sona erdi, çeşitli önerilerle sonuçlandı. Son öneriler, üçlü taretlerde yeni 8 inç toplar, ağır uçaksavar silahlanması, kalın zırh ve iyi hız özelliklerine sahipti. Düşman kruvazörlerinin eksikliği ve bu gemilerin maliyet verimliliği, bunun yerine daha fazla hafif kruvazör inşa etmeye odaklanılmasına neden oldu."
 ENG_heavy_cruiser_4:0 "Churchill Tasarımı"
 ENG_heavy_cruiser_4_desc:0 "Bu gemiler, II. Dünya Savaşı'nın erken aşamalarında Alman Deutschland sınıfı büyük top kruvazörlerine karşı koymak için Amiral Lord Winston Churchill tarafından önerildi. Bu gemiler 9.2 inç toplara, ağır uçaksavar silahlarına ve güçlü zırha sahipti. Düşman başkent gemileriyle etkili bir şekilde savaşmak üzere tasarlandılar. Yüksek maliyetler ve yeni bir ağır kruvazöre duyulan ihtiyacın olmaması nedeniyle gemilerin inşası iptal edildi."
 ENG_light_cruiser_1:0 "C Sınıfı"
 ENG_light_cruiser_1_desc:0 "C sınıfı hafif kruvazörler, I. Dünya Savaşı öncesinde ve sırasında Kuzey Denizi'nin zorlu koşulları için inşa edilen bir grup hafif kruvazördü. Biraz küçük ve dar olmalarına rağmen sağlam ve yetenekli gemiler olduklarını kanıtladılar. Silahlanmaları fazlasıyla yeterliydi, düşman yüzey hedefleriyle savaşmak için yeterli sayıda 6 inç top taşıyorlar ve düşman gemilerini ve konvoyları bitirmek için ağır torpido yüküne sahiplerdi. I. Dünya Savaşı sırasında yoğun şekilde kullanıldılar ve birçok yüzey muharebesine katıldılar."
 ENG_light_cruiser_2:0 "Southampton Sınıfı"
 ENG_light_cruiser_2_desc:0 "Southampton sınıfı hafif kruvazörler, Town sınıfı kruvazörlerin bir alt sınıfıydı ve Japon Mogami sınıfı kruvazörlere karşı koymak üzere tasarlandı. Bu gemiler iyi zırhlanmış, iyi hıza ve menzile sahip ve dört üçlü tarette on iki 6 inç toptan oluşan güçlü bir silahlanma taşıyorlardı. Kraliyet Donanması'nın savaş dönemi hafif kruvazör tasarımlarının çoğunun temelini oluşturdular."
 ENG_light_cruiser_3:0 "Crown Colony Sınıfı"
 ENG_light_cruiser_3_desc:0 "Crown Colony sınıfı hafif kruvazörler, önceki Town sınıfının iyileştirilmiş versiyonlarıydı ancak inşaatı hızlandırmak ve maliyetleri düşürmek için basitleştirilmiş bir tasarıma sahiplerdi. Gemiler öncülleriyle aynı topları taşıyordu, dört üçlü tarette 6 inç toplar. Benzer şekilde zırhlanmışlardı ancak daha küçük motorları nedeniyle menzilleri biraz daha düşüktü. Tip, Fiji ve Seylan olmak üzere iki alt sınıftan oluşuyordu."
 ENG_light_cruiser_4:0 "Minotaur Sınıfı"
 ENG_light_cruiser_4_desc:0 "Swiftsure sınıfı olarak da bilinen bu kruvazörler, Crown Colony sınıfının modifiye edilmiş bir versiyonu olarak tasarlandı ve 1941'de onaylanan savaş modifikasyonlarını içeriyordu. Crown Colony sınıfına kıyasla daha uzun operasyonel menzile ve daha fazla uçaksavar silahına sahiplerdi, ana silahlanma ise üç üçlü turete indirilmişti. Savaşın sonucunu etkilemek için çok geç inşa edildiler, sipariş edilen gemilerin çoğu sonradan iptal edildi."
 ENG_submarine_1:0 "L Sınıfı"
 ENG_submarine_1_desc:0 "L sınıfı denizaltılar, Acil Savaş Programı kapsamında önceki denizaltı sınıflarının geliştirilmiş versiyonu olarak planlanan orta boy teknelerdi. I. Dünya Savaşı'nın son aşamalarında inşa edildiler ve yeni, daha büyük 21 inç torpidolarla donatıldılar. II. Dünya Savaşı'nın başlangıcına kadar hizmet verdiler ve çoğunlukla ikincil ve eğitim görevlerinde kullanıldılar."
 ENG_submarine_2:0 "T Sınıfı"
 ENG_submarine_2_desc:0 "T sınıfı veya Triton sınıfı denizaltılar, O, P ve R sınıfı büyük denizaltıların yerini almak üzere tasarlandı. Atlantik ve Pasifik Okyanusu'na uygun uzun menzilli, orta büyüklükte denizaltılardı. İyi silahlandırılmış ve stabil platformlardı ve savaş sırasında yoğun şekilde kullanıldılar, inşa edilen teknelerin %25'i savaşta kaybedildi."
 ENG_submarine_3:0 "U Sınıfı"
 ENG_submarine_3_desc:0 "U sınıfı denizaltılar, 1940 ve 1941 Savaş Acil Programları kapsamında inşa edilen küçük boyutlu denizaltılardı. Başlangıçta eğitim denizaltısı olarak tasarlanmışlardı ancak savaşın başlamasıyla tasarım değiştirildi ve bu denizaltılar Kuzey Denizi ve Akdeniz'in sınırlı sularında kullanışlı oldular. Küçük boyutları nedeniyle menzilleri ve silahları sınırlıydı. Undine, Umpire ve Uproar olmak üzere üç alt sınıftan oluşuyorlardı."
 ENG_submarine_4:0 "V Sınıfı"
 ENG_submarine_4_desc:0 "V sınıfı veya Vampir sınıfı denizaltılar, önceki U sınıfı küçük boyutlu tekneler temel alınarak geliştirildi. Daha büyük ama yine de nispeten küçüktüler, daha iyi deniz tutma kabiliyetine sahiplerdi ancak operasyonel menzilleri ve silahları sınırlıydı."
 EST_submarine_2:0 "Kalev Sınıfı"
 EST_submarine_2_desc:0 "Kalev sınıfı, 1936'da Estonya donanması için İngiltere'de inşa edilen iki denizaltıdan oluşuyordu. Birincil amacı mayın döşemekti, ancak aynı zamanda dört adet 533mm torpido tüpü ile silahlandırılmıştı."
 FIN_heavy_cruiser_1:0 "Väinämöinen Sınıfı"
 FIN_heavy_cruiser_1_desc:0 "Väinämöinen sınıfı, 1930'ların başında Finlandiya'da inşa edilen ve hizmete giren iki sahil savunma savaş gemisinden oluşuyordu. Şimdiye kadar inşa edilen son sahil savunma gemileri arasındaydı, ancak boyut ve silahlanma açısından bir ağır kruvazöre daha yakındı. Yalnızca 3.900 ton deplasmana sahiptiler ve oldukça yavaştılar, ancak dört adet 254mm/45 kalibre Bofors topu ile silahlandırılmışlardı."
 FIN_submarine_1:0 "Vetehinen Sınıfı"
 FIN_submarine_1_desc:0 "Vetehinen sınıfı, Finlandiya Donanması için inşa edilen üç orta boy denizaltıdan oluşuyordu. Birinci Dünya Savaşı dönemi Alman UB III denizaltılarına dayanıyordu. 500 tonun altında deplasmana sahiptiler ve dört adet 533mm torpido tüpü ile silahlandırılmışlardı."
 FRA_SH_battleship_1:0 "Charlemagne Sınıfı"
 FRA_SH_battleship_1_desc:0 "Charlemagne sınıfı süper savaş gemileri, diğer donanmaların büyük savaş gemileriyle başa çıkmak için varsayımsal bir tasarımdır. Üst üste binmiş pozisyonlarda öne toplanmış ağır silahlanma, ağır uçaksavar silahlanması ve kalın zırha sahiptir. Tüm tasarım, Richelieu ve İngiliz Nelson sınıflarından unsurlar ödünç alır."
 FRA_SH_battleship_2:0 "Napoléon Bonaparte Sınıfı"
 FRA_SH_battleship_2_desc:0 "Napoléon Bonaparte sınıfı savaş gemileri, Alsace ve Gascogne sınıfları temel alınarak geliştirilen varsayımsal bir tasarımdı. Ağır silahlanması, üçlü taretlerde ön ve arkada eşit olarak dağıtılmıştı, üst üste binen ikincil toplar ve ağır uçaksavar silahlanması vardı. Kalın zırh ve güçlü motorlar, filodaki diğer gemilere yetişmek ve düşmanlarıyla etkili bir şekilde savaşmak için gereken hızı ve savunmayı sağlıyordu."
 FRA_battle_cruiser_1:0 "Durand-Viel Tasarımı"
 FRA_battle_cruiser_1_desc:0 "Durand-Viel muharebe kruvazörü tasarımı, I. Dünya Savaşı'na kadar uzanan bir dizi çalışma arasında bir öneriydi. Esasen Normandie ve Lyon sınıfı savaş gemilerinin muharebe kruvazörü versiyonlarıydı, aynı dörtlü taretlere ve toplara sahiplerdi ancak sayıca daha azdı. Diğer donanmaların çağdaş muharebe kruvazörleri gibi, bir savaş gemisinden daha hızlı ancak daha az zırhlı olacaklardı. I. Dünya Savaşı patlak vermeden önce iptal edildiler."
 FRA_battle_cruiser_2:0 "Dunkerque Sınıfı"
 FRA_battle_cruiser_2_desc:0 "Dunkerque'ler, Alman Deutschland sınıfı cep savaş gemilerine karşı koymak üzere tasarlandı. 1920'lerin ortalarından 1930'ların başına kadar uzanan bir dizi tasarım çalışmasının zirvesiydiler. 1931 ve 1934 deniz programlarında onaylandılar, ana taretlerinin tamamı önde toplanmış olarak İngiliz Nelson sınıfı savaş gemilerine benziyorlardı. Bu, daha kısa bir zırh kuşağına ve dolayısıyla Deniz Antlaşmaları sınırlamalarına uyacak şekilde daha küçük bir gemiye yol açtı."
 FRA_battleship_1:0 "Courbet Sınıfı"
 FRA_battleship_1_desc:0 "Courbet sınıfı savaş gemileri, I. Dünya Savaşı öncesinde ve sırasında Fransız Donanması için inşa edilen ilk süper dreadnoughtlardı. 1910 ve 1911 deniz programlarında onaylandılar, I. Dünya Savaşı sırasında sınırlı hizmet gördüler ancak II. Dünya Savaşı'nda aktif oldular. Önceki Dante sınıfı savaş gemilerinden daha kalın zırha ve daha güçlü toplara sahip olmalarına rağmen, yine de çağdaş ABD ve İngiliz savaş gemilerinden daha düşüktüler. 22.000 tonun biraz üzerinde deplasmana sahiplerdi ve II. Dünya Savaşı öncesindeki tek modernizasyonları iyileştirilmiş uçaksavar silahlanması ve kazanlardı."
 FRA_battleship_2:0 "Richelieu Sınıfı"
 FRA_battleship_2_desc:0 "Richelieu sınıfı savaş gemileri, Fransız Donanması'na hizmete giren son savaş gemileriydi. Dunkerque'in iyileştirilmiş bir tasarımıydı ve 1935 ve 1938 deniz programlarında onaylandı. Mükemmel uçaksavar silahlanması, hızı ve menzili onu mükemmel bir başkent gemisi yapıyordu. Sipariş edilen dört gemiden sadece ikisi denize indirildi ve biri Fransa'nın düşüşünden önce tamamlandı. Kalan gemileri farklı tasarımlarla tamamlama girişimleri oldu, uçaksavar savaş gemisi, savaş gemisi-uçak gemisi melezi veya tam ölçekli uçak gemisi olarak kullanılmaları önerildi."
 FRA_battleship_3:0 "Gascogne Sınıfı"
 FRA_battleship_3_desc:0 "Gascogne sınıfı savaş gemileri, Richelieu sınıfının bir alt sınıfıydı. 1940 deniz programında üç gemi sipariş edildi ancak hiçbiri başlatılmadı. Tasarım Richelieu'nun bir tekrarı olacaktı, ancak ana silahlanma ön ve arkada eşit olarak dağıtılacak, uçaksavar silahlanması iyileştirilecek ve motorlar geliştirilecekti, bu da genel olarak daha iyi bir gemiyle sonuçlanacaktı."
 FRA_battleship_4:0 "Alsace Sınıfı"
 FRA_battleship_4_desc:0 "Alsace sınıfı savaş gemileri, Richelieu sınıfının yerini alması planlanıyordu. Tasarım çalışmaları 1939'da tamamlandı, 1940'ta onaylandı ve 1941'de kızağa konmaları bekleniyordu ancak Fransa'nın düşüşü bunun gerçekleşmesini engelledi. Richelieu tasarımı üzerine daha ağır ve sayıca daha fazla ana top, daha güçlü uçaksavar silahlanması, daha kalın zırh plakaları ve daha büyük motorlarla iyileştirmeler yapıldı."
 FRA_carrier_1:0 "Béarn Sınıfı"
 FRA_carrier_1_desc:0 "Béarn başlangıçta Normandie sınıfı bir savaş gemisi olarak kızağa kondu ancak daha sonra 22.100 ton deplasmanlı bir uçak gemisi olarak tamamlandı ve iki savaş arası yıllarda ve II. Dünya Savaşı'nda hizmet verdi. Dönüştürülmüş bir uçak gemisi olarak hızı yavaştı ve uçaklar için sınırlı alana sahipti ancak orta zırh kuşağı ve uzun menzil bu eksiklikleri telafi ediyordu. İnşası, DCAN'daki (Direction des Constructions et Armes Navale) Fransız tasarımcılara önemli deneyim kazandırdı ve sonrasında bir dizi tasarım çalışmasına yol açtı."
 FRA_carrier_2:0 "Joffre Sınıfı"
 FRA_carrier_2_desc:0 "Joffre sınıfı uçak gemileri (Proje adı PA-16), Fransız Donanması'nın yeni nesil uçak gemileriydi. 1929'da başlayıp 1937'de sona eren tasarım çalışmalarının sonuncusuydu. 1938 deniz programında iki gemi onaylandı, ancak artan çatışmalar inşaat sürecini yavaşlattı ve sonunda Fransa'nın düşüşü bu gemilerin tamamlanmasını engelledi. Deplasmanları yaklaşık 20.000 ton olacaktı. İyi uçaksavar silahlanması, zırhı ve hızı olacaktı ancak ortalamanın altında bir uçak kapasitesine sahip olacaktı. Genel olarak, Fransız Donanması için iyi dengelenmiş ve çok yönlü bir uçak gemisi olacaktı."
 FRA_carrier_3:0 "Jean Bart Sınıfı"
 FRA_carrier_3_desc:0 "Jean Bart uçak gemisi, yarıda kalmış Richelieu sınıfı savaş gemisi Jean Bart'ın Japon IJN Shinano'ya benzer şekilde tam ölçekli bir uçak gemisine dönüştürülmesi için savaş ortasında yapılan bir öneriydi. Büyük gövdesi, büyük bir uçak kapasitesi ve büyük motorlarla birlikte uzun menzil ve hızlı bir uçak gemisiyle sonuçlanacaktı. ABD menşeli ağır uçaksavar silahlanması, uçaklara ve daha küçük yüzey muharebe gemilerine karşı iyi bir savunma sağlayacaktı."
 FRA_carrier_4:0 "Clemenceau Sınıfı"
 FRA_carrier_4_desc:0 "Clemenceau sınıfı uçak gemileri (Proje adı PA-28), Fransız Donanması'nın ilk savaş sonrası uçak gemisi tasarımıydı. Tasarım, yarım kalmış Joffre sınıfı uçak gemilerine benzeyecekti, ancak kurulu ekipman ve silahlar modern Fransız ürünleri olacaktı. ABD ve İngiliz eskort uçak gemilerinin edinilmesi ve savaş sonrası Fransa'nın ekonomik durumu, bu gemilerin kızağa konmasını engelledi. 1955 ve 1957'de kızağa konan sonraki Clemenceau sınıfı uçak gemileriyle (Proje adı PA-54) karıştırılmamalıdır."
 FRA_destroyer_1:0 "Bourrasque Sınıfı"
 FRA_destroyer_1_desc:0 "Bourrasque sınıfı muhripler, 1.500 tonluk serinin bir parçasıydı ve 1920'lerin ortalarında denize indirildi. Önceki Chacal ve sonraki L'Adroit sınıflarıyla birlikte, yeni modern savaş sonrası Fransız filosunun bel kemiğini oluşturdular. Zamanlarına göre hızlı ve iyi silahlanmışlardı ancak torpido silahlanmaları diğer donanmalardaki benzer gemilere kıyasla daha küçüktü."
 FRA_destroyer_2:0 "Le Fantasque Sınıfı"
 FRA_destroyer_2_desc:0 "Le Fantasque sınıfı muhripler, esasen 1930 deniz programı kapsamında inşa edilen önceki 2.400 tonluk serinin (Guépard, Aigle, Vauquelin) süper muhriplerinin iyileştirilmiş versiyonlarıydı. Büyük, ağır silahlı ve çok hızlı muhriplerdi, Fransız filosunun yeni yüksek hızlı birimlerine eskortluk yapmak için mükemmeldiler. Silahlanmaları yeni geliştirilen toplar, yeterli uçaksavar ve torpido silahlanmasından oluşuyordu."
 FRA_destroyer_3:0 "L'Intrépide Sınıfı"
 FRA_destroyer_3_desc:0 "L'Intrépide sınıfı muhripler, önceki Le Hardi sınıfı muhriplerin modifiye edilmiş bir versiyonuydu. 1938 ve 1939 deniz programlarında onaylandılar ancak savaş ve Fransa'nın düşüşü bu gemilerin iptal edilmesine neden oldu. Daha çok uçaksavar rolüne odaklanacaklardı ve deplasmanları 2.800-2.900 tona çıkarılmış, daha büyük motorlara sahip olacaklardı."
 FRA_destroyer_4:0 "Hoche Sınıfı"
 FRA_destroyer_4_desc:0 "Hoche ve Bayard sınıfları, Fransız Donanması'nın son süper muhrip tasarımıydı. Her iki sınıf da Mogador sınıfı temel alınarak geliştirildi, 4.200 ton deplasmana sahipti, benzer ana silahlanma ancak iyileştirilmiş uçaksavar topları ve daha güçlü motorlarla donatıldılar. 1939-40 deniz programlarında onaylandılar ancak savaşın başlaması ve Fransa'nın düşüşü bu gemilerin iptal edilmesine neden oldu."
 FRA_heavy_cruiser_1:0 "Suffren Sınıfı"
 FRA_heavy_cruiser_1_desc:0 "Suffren sınıfı ağır kruvazörler, temelde önceki Duquesne sınıfının deniz tutma kabiliyetleriyle ilgili küçük iyileştirmeler yapılmış tekrarıydı. Her iki sınıf da Fransız donanmasının çağdaş kruvazör felsefesini yansıtıyordu; çok ince zırh ancak iyi hız ve menzil. Standart deplasmanları 10.000 tondu ve bir ağır kruvazör için standart sayılabilecek silahlarla donatıldılar."
 FRA_heavy_cruiser_2:0 "Algérie Sınıfı"
 FRA_heavy_cruiser_2_desc:0 "Algérie sınıfı ağır kruvazör, önceki Suffren ve Duquesne sınıflarının bir devamı niteliğindeydi ancak yeni İtalyan Zara sınıfı ağır kruvazörlerine rakip olacak şekilde tasarlandı. Hem ana zırh kuşağı hem de sualtı koruması önemli ölçüde artırıldı. Uçaksavar silahlanması dönemi için yeterliydi, ancak bu değişiklikler nedeniyle standart deplasman 10.000 tonun üzerindeydi."
 FRA_heavy_cruiser_3:0 "Saint Louis Sınıfı"
 FRA_heavy_cruiser_3_desc:0 "Saint Louis sınıfı ağır kruvazörler, Algérie sınıfı temel alınarak geliştirildi ancak genel görünümü Dunkerque ve Richelieu sınıfı başkent gemilerine daha yakındı. 1940 deniz programında üç gemi sipariş edildi, ancak Fransa'nın düşüşü nedeniyle hiçbiri kızağa konmadı. Yeni toplar ve iyileştirilmiş uçaksavar silahlanmasına sahip olacaklardı ancak zırh Algérie sınıfıyla aynı olacaktı. Fransız Donanması'nın son ağır kruvazör tasarımıydı."
 FRA_heavy_cruiser_4:0 "Forbin Sınıfı"
 FRA_heavy_cruiser_4_desc:0 "Forbin sınıfı ağır kruvazörler, Saint Louis sınıfının bir devamı olarak varsayımsal bir tasarımdı. Fransa ana karası ve kolonileri arasındaki ticaret yollarını korumak için tasarlandı, dört üçlü tarette ağır top silahlanması ve yeterli sayıda uçaksavar silahıyla birlikte uzun menzile ve iyi hıza sahipti. Gemi düzeni ve genel görünümü, önceki Saint Louis sınıfından ve İngiliz Crown Colony sınıfından etkiler taşıyordu."
 FRA_light_cruiser_1:0 "Duguay-Trouin Sınıfı"
 FRA_light_cruiser_1_desc:0 "Duguay-Trouin hafif kruvazörleri, I. Dünya Savaşı sonrasında 1922 deniz programında inşa edilen ilk büyük Fransız savaş gemileriydi. Üst üste binmiş kapalı ana taretlere sahip ilk hafif kruvazörler oldular. Hafif kruvazörler arasında güçlü bir torpido silahlanmasına sahiplerdi ancak neredeyse hiç zırhları yoktu."
 FRA_light_cruiser_2:0 "La Galissonnière Sınıfı"
 FRA_light_cruiser_2_desc:0 "La Galissonnière sınıfı hafif kruvazörler, İtalyan Condottieri tipi hafif kruvazörlere bir yanıttı ve önceki Emile Bertin sınıfı temel alınarak geliştirildi. 1931 ve 1932 deniz programlarında inşa edildiler, dönemin tipik ana silahlanmasına ve yeterli uçaksavar silahlanmasına sahiplerdi. 10.850 ton deplasmana sahiplerdi, artan sayıda keşif uçağı taşıyorlardı ve iyi bir hıza sahiplerdi."
 FRA_light_cruiser_3:0 "De Grasse Sınıfı"
 FRA_light_cruiser_3_desc:0 "DeGrasse sınıfı kruvazörler, 1938 ve 1939 deniz programlarında onaylandı ve esasen iyileştirilmiş La Galissonnière'lerdi. Daha güçlü uçaksavar silahlanmasına ve daha büyük motorlara sahiplerdi. Fransa'nın düşüşü, son iki geminin iptal edilmesine ve baş geminin savaş sonrasında farklı bir tasarımla tamamlanmasına neden oldu. Almanlar onu hafif bir uçak gemisi olarak tamamlamayı planladı ancak bu proje de gerçekleştirilmedi."
 FRA_light_cruiser_4:0 "Colbert Sınıfı"
 FRA_light_cruiser_4_desc:0 "Colbert, 1956'da denize indirilen bir uçaksavar hafif kruvazörüydü. Bu Colbert sınıfı kruvazör, savaş sonrası De Grasse'ye çok benzer şekilde inşa edildi, hem uzun hem de kısa menziller için ağır uçaksavar silahlanmasına sahipti. Colbert ile DeGrasse arasındaki fark, Colbert'in daha küçük motorlara, daha ince zırha ve biraz daha küçük boyutlara sahip olmasıydı."
 FRA_submarine_1:0 "600 Serisi"
 FRA_submarine_1_desc:0 "600 tonluk denizaltı serisi, Fransa'nın I. Dünya Savaşı sonrası ilk modern denizaltılarıydı. Orta boyutta olup yaklaşık 600 ton deplasmana sahiplerdi. Açık denizde kullanılabilir olmalarına rağmen, sahil denizaltısı olarak sınıflandırıldılar ve çoğunlukla Akdeniz'in sıcak sularında kullanıldılar. Bu tipte her biri 4 gemiden oluşan üç sınıf inşa edildi: Sirène, Ariane ve Circé sınıfları. Daha büyük olan 630 tonluk Argonaute, Diane ve Orion sınıflarının temelini oluşturdular."
 FRA_submarine_2:0 "Minerve Sınıfı"
 FRA_submarine_2_desc:0 "Minerve sınıfı denizaltılar (proje adı T2), 630 tonluk seri temel alınarak geliştirildi ancak daha iyi motorlara ve farklı torpido düzenine sahiplerdi. Bu denizaltılar, önceki sınıfların tersane özel tasarımları yerine DCAN'ın (Direction des Constructions et Armes Navale) merkezi tasarımının bir sonucu olan standardizasyon programının ilk parçasıydı."
 FRA_submarine_3:0 "Roland Morillot Sınıfı"
 FRA_submarine_3_desc:0 "Roland Morillot sınıfı denizaltılar (Proje adı Z2), önceki Redoutable sınıfı denizaltılar temel alınarak geliştirilen büyük okyanus denizaltılarıydı. 1.800-2.400 ton deplasmana sahip büyük denizaltılardı ve 10 torpido tüpünden oluşan güçlü bir silahlanmaya sahiplerdi. Fransa'nın düşüşü, hiçbiri tamamlanamadan gerçekleşti."
 FRA_submarine_4:0 "Phénix Sınıfı"
 FRA_submarine_4_desc:0 "Phénix sınıfı denizaltılar, 1939-40 deniz programlarında onaylanan orta boyutta, okyanuslar arası ve uzun menzilli teknelerdi ancak savaşın başlaması ve Fransa'nın düşüşü bu teknelerin iptal edilmesine neden oldu. Redoutable sınıfına benziyorlardı ancak daha küçüklerdi ve 1.200 ton deplasmana sahiplerdi. Benzer şekilde ağır torpido silahlanması taşıyorlardı."
 GER_SH_battleship_1:0 "Schlachtschiff H41"
 GER_SH_battleship_1_desc:0 "H41 savaş gemisi tasarımı, önceki H39 tasarımının bir iyileştirmesiydi. Tasarım, önemli ölçüde daha güçlü zırh, güçlendirilmiş torpido bölmeleri ve geminin dümeni ile pervane şaftları için koruma öngörüyordu. Ana batarya, Birleşik Krallık'ın önerilen Aslan Sınıfı savaş gemilerinkinden daha büyük olan sekiz 42cm topa yükseltildi. Tasarlanan şekliyle bu gemiler neredeyse 70.000 ton deplasmana sahip olacaktı."
 GER_SH_battleship_2:0 "Schlachtschiff H44"
 GER_SH_battleship_2_desc:0 "H44 Sınıfı, H serisi savaş gemisi tasarımlarının sonuncusuydu. Top çapı veya deplasman üzerinde herhangi bir sınırlama olmadan, H42'den H44'e kadar olan tasarımlar giderek daha ağır silahlanma ve zırh korumasına sahipti, sekiz 508mm (20 inç) topla silahlı 131.000 tonluk H44 tasarımıyla zirveye ulaştı."
 GER_battle_cruiser_1:0 "Yorck Sınıfı"
 GER_battle_cruiser_1_desc:0 "Yorck sınıfı muharebe kruvazörlerinin üç gemisi, İngiliz Renown Sınıfı'na yanıt olarak tasarlandı. Dört çift tarette sekiz 380mm top taşıyacaklardı. Üç gemi de 1916'da kızağa kondu, ancak savaş nedeniyle hiçbiri tamamlanamadı."
 GER_battle_cruiser_2:0 "O Sınıfı"
 GER_battle_cruiser_2_desc:0 "1939'da Kriegsmarine, planlanan P sınıfı kruvazörlerden üçünü muharebe kruvazörleriyle değiştirmeye karar verdi. Bu, O sınıfı muharebe kruvazörleriyle sonuçlandı, üç çift tarette altı 38cm (15 inç) top taşıyorlardı. Gemiler 35.400 ton deplasman ve 35 knot azami hızla tasarlandı. Sınıfın üç gemisi için inşa emri verildi, ancak hiçbiri başlatılmadı."
 GER_battleship_1:0 "Deutschland Sınıfı"
 GER_battleship_1_desc:0 "Versay Antlaşması'nın ardından Almanya'nın altı dreadnought öncesi savaş gemisini elinde tutmasına izin verildi. Kriegsmarine tarafından Linienschiffe (Hat Gemileri) olarak sınıflandırılan Deutschland Sınıfı'nın (sonraki Deutschland sınıfı Cep Savaş Gemileriyle karıştırılmamalıdır) sadece iki gemisi 1930'lar boyunca aktif hizmette kaldı. 1 Eylül 1939'da saat 04:47'de Schleswig-Holstein, Polonya'nın Danzig kentindeki Westerplatte üssüne ateş açarak II. Dünya Savaşı'nın ilk atışlarını yaptı."
 GER_battleship_2:0 "Scharnhorst Sınıfı"
 GER_battleship_2_desc:0 "Scharnhorst sınıfı savaş gemileri, Kriegsmarine için inşa edilen ilk modern savaş gemileriydi. Alman Deutschland sınıfı Panzerschiffe'lere (Cep Savaş Gemileri) yanıt olarak tasarlanan Fransız Dunkerque sınıfı muharebe kruvazörlerine karşı inşa edildiler. Scharnhorst sınıfı, üç üçlü tarette dokuz 283mm (11 inç) topla silahlandırılmıştı. Çift 380mm (15 inç) toplarla yeniden silahlandırılmaları planlandı, ancak savaşın patlak vermesiyle bu hiç gerçekleşmedi."
 GER_battleship_3:0 "Bismarck Sınıfı"
 GER_battleship_3_desc:0 "İki gemilik Bismarck sınıfı savaş gemileri, Kriegsmarine için inşa edilen en büyük savaş gemileriydi. Gemiler, inşa halindeki yeni Fransız savaş gemilerine yanıt olarak tasarlandı, Richelieu Sınıfı ile benzer sekiz 38cm (15 inç) top silahlanmasına sahipti, ancak Richelieu'ların iki dörtlü taretinin aksine dört çift taret bulunuyordu. Bismarck, Danimarka Boğazı Muharebesi'nde İngiliz muharebe kruvazörü HMS Hood'u batırmasıyla ünlüdür, ancak daha sonra limana ulaşmadan önce takip edilerek batırıldı."
 GER_battleship_4:0 "Hindenburg Sınıfı"
 GER_battleship_4_desc:0 "Alman Plan Z, Birleşik Krallık'ın deniz gücüne meydan okumak için on savaş gemisinden oluşan bir güç öngörüyordu. H sınıfı, planın taleplerini karşılamak için gereken altı savaş gemisi için bir dizi tasarımdı. II. Dünya Savaşı'nın başlangıcında H39 tasarımından iki gemi kızağa kondu, ancak savaşın başlamasıyla inşa durduruldu. Gemilerin hiçbirine resmi olarak isim verilmedi, ancak Hindenburg sınıfın baş gemisi için olası bir isim olarak tahmin edildi. Gemiler tamamlanmış olsaydı, sekiz 40.6cm (16 inç) toptan oluşan ana bataryasıyla Bismarck Sınıfı gemilerin geliştirilmiş versiyonları olacaklardı."
 GER_carrier_1:0 "Flugzeugdampfer I"
 GER_carrier_1_desc:0 "1915'te tasarlanan Flugzeugdampfer I (Uçak Gemisi I) Projesi, tamamlanmamış yolcu gemisi Ausonia'nın bir uçak gemisine dönüştürülmesiydi. I. Dünya Savaşı'nın sonunda inşaat terk edildi. Tamamlanmış olsaydı, üç hangarında deniz uçakları ve tekerlekli uçakların bir karışımını taşıyacak ve 12.500 ton deplasmana sahip olacaktı."
 GER_carrier_2:0 "Seydlitz Sınıfı"
 GER_carrier_2_desc:0 "Seydlitz, Amiral Hipper sınıfı ağır kruvazörlerin dördüncü gemisi olarak kızağa kondu. Savaşın başlangıcında kısmen tamamlanmıştı, bir uçak gemisine dönüştürülmesi düşünüldü. Weser 1 kod adlı proje, Bremen'e yönelik artan hava saldırıları ve inşası için kaynak eksikliği nedeniyle çalışmalar durdurulduğunda kısmen devam ediyordu."
 GER_carrier_3:0 "Graf Zeppelin Sınıfı"
 GER_carrier_3_desc:0 "Graf Zeppelin, Kriegsmarine'de baştan sona uçak gemisi olarak tasarlanan tek gemi sınıfıydı. İki gemi sipariş edildi, ancak hiçbiri tamamlanamadı. Tasarlanan şekliyle Graf Zeppelin, Bf-109E ve Ju-87D'nin gemi versiyonları olan 30 Bf-109T avcı uçağı ve 12 Ju-87E pike bombardıman uçağı taşıyacaktı."
 GER_carrier_4:0 "Europa Sınıfı"
 GER_carrier_4_desc:0 "1940'larda Kriegsmarine tarafından birkaç sivil gemi uçak gemisine dönüştürülmek üzere değerlendirildi. Bu gemilerin en büyüğü yolcu gemisi Europa'ydı. Almanya'nın en büyük yolcu gemisi olarak, bir uçak gemisine dönüştürülmesi çalışmaları başlamadan önce kışla gemisi ve asker nakliyesi olarak kullanılmıştı. Tamamlanmış olsaydı, 56.000 ton deplasmana sahip olacak ve 42 uçaklık bir hava grubu taşıyacaktı."
 GER_destroyer_1:0 "Tip 23"
 GER_destroyer_1_desc:0 "Tip 23, I. Dünya Savaşı sonrasında Kriegsmarine için inşa edilen bir torpido botu sınıfıydı. 1926 ile 1928 arasında altı gemi inşa edildi ve hepsi II. Dünya Savaşı'nda hizmet gördü. Torpido botu tanımlamasına rağmen, gemiler muhrip boyutundaydı, 920 tondan fazla deplasmana sahipti ve üç 105mm L/45 topuyla silahlandırılmıştı."
 GER_destroyer_2:0 "Zerstörer 1934"
 GER_destroyer_2_desc:0 "Zerstörer 1934 sınıfı, I. Dünya Savaşı'ndan sonra inşa edilen ilk Alman muhrip sınıfıydı. Beş 5 inç top ve sekiz torpido tüpüyle silahlandırılmışlardı. 16 gemi inşa edildi, bunların 12'si iyileştirilmiş Zerstörer 1934A alt sınıfıydı."
 GER_destroyer_3:0 "Narvik Sınıfı"
 GER_destroyer_3_desc:0 "Zerstörer 1936A, müttefikler tarafından Narvik Sınıfı muhripler olarak bilinir, yeni 150mm (5.9 inç) topları taşımak üzere tasarlandı. Kıçta üç tekli top ve pruvada bir çift top olarak tasarlanmışlardı, başlangıçta pruvada tek bir top bulunuyordu. Sınıfın sekiz gemisinden dördü daha sonra çift taretlerle yeniden donatıldı. İkinci bir grup yedi muhrip, pruvada çift toplarla hafifçe değiştirilmiş bir tasarımla inşa edildi."
 GER_destroyer_4:0 "Zerstörer 1944"
 GER_destroyer_4_desc:0 "Dizel motorlu bir muhripin ilk prototipi (Zerstörer 1942) tamamlanmamış olsa da, gemi tipinin geliştirilmesi devam etti. Sonunda Zerstörer 1944 projesine yol açan birkaç öneri yapıldı. Ağır bir ana silahlanmaya ek olarak, gemiler öncüllerine kıyasla artırılmış bir uçaksavar silahlanmasına sahipti, yeni 5,5 cm uçaksavar topu da dahil."
 GER_heavy_cruiser_1:0 "Blücher Sınıfı"
 GER_heavy_cruiser_1_desc:0 "Blücher, Almanya tarafından inşa edilen son zırhlı kruvazördü. Tasarımı zamanı için yenilikçiydi ve sonraki Von der Tann sınıfı muharebe kruvazörlerinin yolunu açtı. I. Dünya Savaşı'na gelindiğinde zaten modası geçmişti. Blücher, 1915'te Doggerbank Muharebesi'nde batırıldı."
 GER_heavy_cruiser_2:0 "Hipper Sınıfı"
 GER_heavy_cruiser_2_desc:0 "Amiral Hipper Sınıfı ağır kruvazörler, Kriegsmarine'nin ilk ağır kruvazörleriydi. Resmi olarak 10.000 ton deplasmana sahiplerdi, gerçekte 16.000 tondan fazlaydı. Dört çift tarette sekiz 8 inç top ve on iki 105mm toptan oluşan ikincil bir bataryayla silahlandırılmışlardı."
 GER_heavy_cruiser_3:0 "Prinz Eugen Sınıfı"
 GER_heavy_cruiser_3_desc:0 "Resmi olarak Hipper Sınıfı'nın bir parçası olan Prinz Eugen alt sınıfı, daha ağır bir uçaksavar silahlanması da dahil olmak üzere birçok iyileştirme içeriyor. Alt sınıftaki üç gemiden sadece Prinz Eugen tamamlandı. Rheinübung Harekâtı sırasında HMS Hood'un batırılmasına katıldı. Savaştan sonra Amerika Birleşik Devletleri'ne transfer edildi ve 1946'da Kwajalein Atolü'nde batmadan önce Able ve Baker atom bombası testlerinde USS Prinz Eugen olarak görev yaptı."
 GER_heavy_cruiser_4:0 "P Sınıfı Kruvazör"
 GER_heavy_cruiser_4_desc:0 "P Sınıfı, Kriegsmarine tarafından resmi olarak Panzerschiff (Zırhlı Gemi) olarak belirlenen büyük bir ağır kruvazör tasarımıydı. Yaklaşık 24.000 ton deplasmana sahip olacaklardı, ABD New York sınıfı savaş gemilerinden 3.000 ton daha hafif ancak 55 metre daha uzun olacaklardı. Silahlanma, iki üçlü tarette altı 280mm toptan oluşuyordu."
 GER_light_cruiser_1:0 "Emden Sınıfı"
 GER_light_cruiser_1_desc:0 "Emden, I. Dünya Savaşı'ndan sonra Almanya'da inşa edilen ilk büyük savaş gemisiydi. 1921'de kızağa kondu ve 1925'te hizmete girdi. Silahlanması, tek taretlerde sekiz 150mm (5.9 inç) toptan oluşuyordu."
 GER_light_cruiser_2:0 "Leipzig Sınıfı"
 GER_light_cruiser_2_desc:0 "Leipzig sınıfı hafif kruvazörler, önceki Königsberg sınıfı kruvazörler üzerine iyileştirmelerle 1928 ile 1935 arasında inşa edildi. 8.100 tondan fazla deplasmana sahiplerdi, yeterli hız ve menzile sahipti ve ana silahlanmalarında dokuz 15cm SK C/25 top bulunuyordu."
 GER_light_cruiser_3:0 "M Sınıfı"
 GER_light_cruiser_3_desc:0 "M sınıfı kruvazörler, ticaret akıncı filoları için keşif gemisi olarak tasarlandı. Plan Z'nin bir parçası olarak altı gemi sipariş edildi, ikisi savaşın başlamasıyla çalışmalar durdurulmadan önce kızağa kondu. Ana silahlanma, dört çift tarette sekiz 150mm top olacaktı."
 GER_light_cruiser_4:0 "Q Sınıfı"
 GER_light_cruiser_4_desc:0 "Q sınıfı kruvazörler, modifiye edilmiş bir M sınıfı tasarımıydı. M sınıfından daha büyük, daha ağır bir uçaksavar silahlanması ve iyileştirilmiş ateş kontrol sistemiyle tasarlandılar."
 GER_submarine_1:0 "UB III Tipi"
 GER_submarine_1_desc:0 "UB III Tipi sahil denizaltısı, I. Dünya Savaşı sırasında Alman İmparatorluk Donanması tarafından inşa edilen bir U-bot sınıfıydı. On torpido taşıyorlardı ve 500 tondan fazla deplasmana sahiplerdi. 1916 ile 1918 arasında 96 adet inşa edildi, ancak 1935'e kadar hepsi hizmet dışı kaldı."
 GER_submarine_2:0 "Tip IIA"
 GER_submarine_2_desc:0 "Alman Tip IIA denizaltısı, tek gövdeli, tamamen kaynaklı, dahili balast tanklarına sahip bir sahil denizaltısıydı. 250 tondan fazla deplasmana sahipti ve beş 533mm torpido tüpü bulunuyordu. 1934 ile 1935 arasında altı adet inşa edildi."
 GER_submarine_3:0 "Tip VIIC"
 GER_submarine_3_desc:0 "Tip VIIC açık deniz denizaltısı, Alman U-bot gücünün bel kemiğiydi, 1940 ile 1945 arasında 568 adet hizmete girdi. Gemiler 770 ton deplasmana sahipti ve beş 533mm torpido tüpüyle silahlandırılmıştı."
 GER_submarine_4:0 "Tip XXI"
 GER_submarine_4_desc:0 "Tip XXI denizaltılar, 'Elektroboote' olarak da bilinir, temel olarak su altında çalışmak üzere tasarlanan ilk denizaltılardı, tespitten kaçınmak veya saldırı başlatmak için su altına girebilen yüzey gemileri değildi. Ana özellikleri aerodinamik gövdesi, kumanda kulesi ve çok sayıda batarya hücresiydi. Alman denizaltı sınıflarının en büyüklerindendi, 1.620 tondan fazla deplasmana sahipti. 1943 ile 1945 arasında 118 gemi hizmete girdi."
 GRE_battleship_1:0 "Kilkis Sınıfı"
 GRE_battleship_1_desc:0 "Kilkis sınıfı, 1908'de hizmete giren ve 1914'te Yunanistan'a satılan iki ABD yapımı Mississippi sınıfı savaş gemisinden oluşuyordu. ABD tarafından inşa edilen son dretnot öncesi savaş gemileriydi. Yalnızca 13.000 ton deplasmana sahiptiler ve ana silahlanmaları dört adet 10 inç/45 kalibre Mk V toptan oluşuyordu. Dönemleri için ortalama silahlanma, hız ve menzile sahiptiler. Her iki gemi de 1936'ya kadar hizmet dışı bırakıldı."
 GRE_destroyer_1:0 "Aetos Sınıfı"
 GRE_destroyer_1_desc:0 "Aetos sınıfı destroyerler, Birinci Dünya Savaşı öncesinde İngiltere'de inşa edildi ve Yunanistan Donanması tarafından satın alındı. Dördü de İkinci Dünya Savaşı sırasında hizmetteydi. 980 ton deplasmana sahiptiler ve dört adet 105mm/40 Armstrong P topu ve dört adet 533mm torpido tüpü ile silahlandırılmışlardı. 1920'lerin sonunda modernize edildiler."
 GRE_destroyer_2:0 "Vasilefs Georgios I Sınıfı"
 GRE_destroyer_2_desc:0 "Vasilefs Georgios I sınıfı, 1930'ların sonunda Yunanistan Donanması için İngiltere'de inşa edilen iki modifiye İngiliz H sınıfı destroyerdi. Gemiler 1.350 ton deplasmana sahipti ve iyi bir hıza sahipti. Uzun menzilliydiler, dört adet 128mm/42 SK C/34 topu ile silahlandırılmışlardı ve güçlü bir torpido desteğine sahiptiler."
 GRE_destroyer_3:0 "Adrias Sınıfı"
 GRE_destroyer_3_desc:0 "Adrias sınıfı, altı İngiliz Hunt III sınıfı destroyer eskortundan oluşuyordu, bunlardan dördü 1942'de sürgündeki Yunanistan Donanması'na transfer edildi. Destroyer eskortları olarak standart bir destroyerden daha yavaştılar. 1.050 ton deplasmana sahiptiler, ana silahlanmaları dört adet 102mm/45 QF Mk XVI topundan oluşuyordu ve güçlü bir torpido ve denizaltı savunma ekipmanı desteğine sahiptiler."
 GRE_destroyer_4:0 "Leon Sınıfı"
 GRE_destroyer_4_desc:0 "Leon sınıfı, ABD yapımı Cannon sınıfı destroyer eskortlarıydı. 1943'te hizmete girdiler ancak Yunanistan Donanması'na 1951'e kadar teslim edilmediler. Gemiler standart bir destroyerden daha yavaştı. 1.240 ton deplasmana sahiptiler, ana silahlanmaları üç adet 3 inç/40 kalibre top ve güçlü bir torpido ve denizaltı savunma ekipmanı desteğinden oluşuyordu."
 GRE_heavy_cruiser_1:0 "Averof Sınıfı"
 GRE_heavy_cruiser_1_desc:0 "Averof, Birinci Dünya Savaşı öncesinde Yunanistan Donanması için İtalya'da inşa edilen zırhlı bir kruvazördü. İkinci Dünya Savaşı boyunca filonun bayrak gemisi olarak hizmet verdi. Averof, döneminin kruvazörlerine kıyasla oldukça güçlüydü, yaklaşık 10.000 ton deplasmana sahipti. Çok iyi zırhlıydı ve ana silahlanması dört adet 234mm/45 Armstrong topundan oluşuyordu. Tüm bunlara rağmen, bir zırhlı kruvazör için nispeten hızlıydı."
 GRE_light_cruiser_1:0 "Elli Sınıfı"
 GRE_light_cruiser_1_desc:0 "Elli, 1914'te ABD tarafından inşa edilen bir hafif kruvazördü. Başlangıçta Çin Donanması için tasarlanmıştı, ancak sonunda Yunanistan'a teslim edildi. Bir kruvazör için küçüktü, yalnızca 2.600 ton deplasmana sahipti. Ana silahlanması iki adet 152mm/45 kalibre toptan oluşuyordu. Gemi, İkinci Dünya Savaşı sırasında hizmet verdi ve Mihver devletlerinin Yunanistan'ı işgalinden önce bir İtalyan denizaltısı tarafından batırıldı."
 GRE_submarine_1:0 "Katsonis Sınıfı"
 GRE_submarine_1_desc:0 "Katsonis sınıfı denizaltılar, 1920'lerin sonunda Yunanistan Donanması için Fransa'da inşa edildi. Sınıfın her iki gemisi de İkinci Dünya Savaşı sırasında hizmet verdi. Yaklaşık 580 ton deplasmana sahiptiler ve altı adet 533mm torpido tüpü ile silahlandırılmışlardı."
 GRE_submarine_2:0 "Matrozos Sınıfı"
 GRE_submarine_2_desc:0 "Yunan denizaltısı Matrozos, İngilizler tarafından ele geçirilen ve 1942'de sürgündeki Yunanistan Donanması'na transfer edilen bir İtalyan Perla sınıfı denizaltıydı. Denizaltı 680 ton deplasmana sahipti ve altı adet 533mm torpido tüpü ile silahlandırılmıştı. 80 metre dalış derinliğine sahipti."
 GRE_submarine_4:0 "Pipinos Sınıfı"
 GRE_submarine_4_desc:0 "Pipinos sınıfının dört gemisi, 1943 ile 1946 arasında sürgündeki Yunanistan Donanması'na transfer edilen İngiliz U sınıfı denizaltılardı. Gemiler 545 ton deplasmana sahipti ve dört adet 533mm torpido tüpü ile silahlandırılmıştı."
 HOL_destroyer_1:0 "Van Ghent Sınıfı"
 HOL_destroyer_1_desc:0 "Van Ghent veya Admiralen sınıfı, 1926 ile 1931 arasında Hollanda Kraliyet Donanması için inşa edilen sekiz destroyerden oluşuyordu. Gemiler, İngiliz A sınıfının erken versiyonlarına dayanıyordu. Tüm gemiler İkinci Dünya Savaşı'nda savaştı ve ya batırıldı ya da kendi elleriyle batırıldı. Gemiler 1.300 ton üzerinde deplasmana sahipti, dört adet 120mm top ile silahlandırılmıştı ve dönemleri için iyi bir hıza sahipti."
 HOL_destroyer_3:0 "Callenburgh Sınıfı"
 HOL_destroyer_3_desc:0 "Gerard Callenburgh sınıfı, Hollanda Kraliyet Donanması için dört destroyer planlanıyordu. Dördü de Alman işgalinden önce denize indirildi, ancak yalnızca ikisi tamamlandı, biri İngiltere'ye kaçtıktan sonra İngilizler tarafından, diğeri ise Almanlar tarafından tamamlandı. Bu destroyerler 1.600 ton üzerinde deplasmana sahipti, ana silahlanmaları beş adet 120mm top ve sekiz adet 533mm torpido tüpünden oluşuyordu ve iyi bir hıza sahipti."
 HOL_destroyer_4:0 "Piet Hein Sınıfı"
 HOL_destroyer_4_desc:0 "Piet Hein sınıfı, savaştan kısa bir süre sonra Hollanda Kraliyet Donanması'na transfer edilen üç İngiliz S sınıfı destroyerden oluşuyordu. Gemiler 1.800 ton üzerinde deplasmana sahipti, dört adet 120mm/45 QF Mk IX topu ile silahlandırılmıştı ve çeşitli denizaltı savunma silahlarına sahipti."
 HOL_heavy_cruiser_1:0 "Soerabaja Sınıfı"
 HOL_heavy_cruiser_1_desc:0 "Hollanda kruvazörü Soerabaja, orijinal adıyla De Zeven Provinciën, Birinci Dünya Savaşı öncesinde Hollanda'da inşa edilen ve hizmete giren bir sahil savunma gemisiydi ('panterschip'). 6.500 ton üzerinde deplasmana sahipti ve ana silahlanması iki adet 280mm ve dört adet 150mm toptan oluşuyordu. 1942'de Japon bombardıman uçakları tarafından batırılana kadar İkinci Dünya Savaşı'nda hizmet verdi."
 HOL_light_cruiser_1:0 "Java Sınıfı"
 HOL_light_cruiser_1_desc:0 "Hollanda, 1920'lerin ortasında iki Java sınıfı hafif kruvazörü hizmete soktu. Gemiler Almanya'da tasarlandı ancak Hollanda'da inşa edildi. Yaklaşık 6.700 ton deplasmana sahiptiler ve ana silahlanmaları on adet 150mm Bofors topundan oluşuyordu. Hafif zırhlıydılar ve dönemleri için iyi bir hıza sahiptiler."
 HOL_light_cruiser_2:0 "De Ruyter Sınıfı"
 HOL_light_cruiser_2_desc:0 "Hafif kruvazör De Ruyter, 1930'ların ortasında Hollanda'da inşa edildi ve hizmete girdi. Esas olarak Hollanda Doğu Hint Adaları'nda hizmet verdi. 6.500 ton üzerinde deplasmana sahipti ve ana silahlanması yedi adet 150mm toptan oluşuyordu. Ortalamanın altında bir hıza ancak iyi bir menzile sahipti."
 HOL_light_cruiser_3:0 "Tromp Sınıfı"
 HOL_light_cruiser_3_desc:0 "Tromp sınıfı, Alman işgalinden hemen önce Hollanda için hizmete giren nispeten küçük iki hafif kruzazörden oluşuyordu. Her ikisi de Uzak Doğu'da hizmet verdi ve savaştan sağ çıktı. Yalnızca 3.350 ton deplasmana sahiptiler ve tasarlandığı gibi ana silahlanmaları altı adet 150mm toptan oluşuyordu."
 HOL_light_cruiser_4:0 "De Zeven Provinciën Sınıfı"
 HOL_light_cruiser_4_desc:0 "De Zeven Provinciën sınıfı, Alman işgalinden hemen önce kızağa konan ancak 1951'e kadar tamamlanmayan iki kruvazörden oluşuyordu. Son tasarım, orijinal 1939 planından modifiye edildi ve 12.000 ton üzerinde deplasmana sahip, sekiz adet Bofors 152mm topu ile silahlandırılmış iki gemiyle sonuçlandı. Hafif bir kruvazör için iyi zırhlıydılar ve iyi bir menzile sahiptiler."
 HOL_submarine_1:0 "K-III Sınıfı"
 HOL_submarine_1_desc:0 "K-III sınıfı, Hollanda Kraliyet Donanması tarafından devriye denizaltıları olarak kullanılmak üzere inşa edilen iki denizaltıdan oluşuyordu. 1920'lerin başında hizmete girdiler ve ABD Holland sınıfı denizaltılarına dayanıyordu. Her biri 580 ton üzerinde deplasmana sahipti ve dört adet 450mm torpido tüpü ile silahlandırılmıştı."
 HOL_submarine_2:0 "O16 Sınıfı"
 HOL_submarine_2_desc:0 "O16 denizaltısı, 1936'da Hollanda Kraliyet Donanması için Hollanda'da üretildi ve hizmete girdi. Büyük bir denizaltıydı, 980 ton üzerinde deplasmana sahipti. 80 metre dalış derinliğine sahipti ve sekiz adet 533mm torpido tüpü ile silahlandırılmıştı."
 HOL_submarine_3:0 "O21 Sınıfı"
 HOL_submarine_3_desc:0 "O21 sınıfı, Hollanda tarafından inşa edilen ve hizmete giren yedi denizaltıdan oluşuyordu. Gemilerin tümü Alman işgali sırasında tamamlanmamıştı, ancak beşi İngiltere'ye kaçmayı başardı ve sürgündeki Hollanda Donanması'na hizmet etti. Denizaltılar önceki O sınıfı denizaltılardan biraz daha büyüktü, 990 ton üzerinde deplasmana sahipti ancak benzer şekilde sekiz adet 533mm torpido tüpü ile silahlandırılmıştı."
 HOL_submarine_4:0 "Zwaardvis Sınıfı"
 HOL_submarine_4_desc:0 "Zwaardvis sınıfı, 1943 ile 1945 arasında sürgündeki Hollanda Kraliyet Donanması'na transfer edilen dört İngiliz Taciturn sınıfı denizaltıyı temsil ediyordu. Gemiler 1.090 ton deplasmana sahipti, on bir adet 533mm torpido tüpü ile silahlandırılmıştı ve 100 metrenin üzerinde dalış derinliğine sahipti."
 ITA_SH_battleship_1:0 "Regina Margherita Sınıfı"
 ITA_SH_battleship_1_desc:0 "Regina Margherita sınıfı, savaşın başlamasından kısa bir süre önce denize indirilecek varsayımsal bir ağır savaş gemisi sınıfıdır. Japon Yamato sınıfı savaş gemileriyle karşılaştırılabilirlerdi. Çok iyi zırhlanmış olacaklar, yaklaşık 60.000 ton deplasmana sahip olacaklar ve 406mm toplarla silahlandırılacaklardı."
 ITA_SH_battleship_2:0 "Regina Elena Sınıfı"
 ITA_SH_battleship_2_desc:0 "Regina Elena sınıfı, İtalya'nın savaşa girişi zamanında denize indirilecek varsayımsal bir ağır savaş gemisi sınıfıdır. ABD'nin planladığı Montana sınıfı savaş gemileriyle karşılaştırılabilirlerdi. Yoğun şekilde zırhlanmışlardı, 70.000 tonun üzerinde deplasmana sahiptiler ve ana bataryalarında 406mm toplar bulunuyordu."
 ITA_battle_cruiser_1:0 "Caracciolo Sınıfı"
 ITA_battle_cruiser_1_desc:0 "Francesco Caracciolo sınıfı, I. Dünya Savaşı'nın hemen ardından önerilen bir başkent gemisi sınıfıydı. Gemiler yaklaşık 34.000 ton deplasmana sahipti, iyi zırhlanmıştı ve boyutlarına ve dönemlerine göre oldukça hızlıydı. Sadece bir gemi denize indirildi, ancak 1921'de iptal edildi."
 ITA_battle_cruiser_2:0 "Principe Amedeo Sınıfı"
 ITA_battle_cruiser_2_desc:0 "Principe Amedeo sınıfı, 1930'ların sonlarında denize indirilecek varsayımsal bir muharebe kruvazörüdür. Fransız Dunkerque muharebe kruvazörleriyle karşılaştırılabilir olacak, yaklaşık 30.000 ton deplasmana sahip olacak ve ana bataryalarında 320mm toplar bulunacaktı."
 ITA_battleship_1:0 "Conte Di Cavour Sınıfı"
 ITA_battleship_1_desc:0 "Conte Di Cavour sınıfı savaş gemileri I. Dünya Savaşı sırasında hizmete girdi. 305mm Armstrong-Vickers topları vardı, 23.000 ton deplasmana sahiptiler ve diğer dreadnought dönemi savaş gemileriyle karşılaştırılabilir azami hıza sahiptiler. 1933'ten başlayarak, sınıfın kalan iki gemisi ciddi bir yeniden tasarımdan geçti, boyutları, silahlanmaları ve performansları dönemin ortaya çıkan 'hızlı' savaş gemileriyle aynı seviyeye getirildi."
 ITA_battleship_2:0 "Caio Duilio Sınıfı"
 ITA_battleship_2_desc:0 "Caio Duilio sınıfı savaş gemileri aslen I. Dünya Savaşı'nın başında hizmete girdi. Ancak her iki gemi de 1937-1940 arasında tam bir yeniden tasarımdan geçti. Bu model yeniden tasarımı temsil eder. Silahlanma on 320mm M1934 topuna yükseltildi, deplasman şimdi 29.000 tondu ve hızları onları 'hızlı' savaş gemisi olarak sınıflandırmaya yetecek seviyedeydi."
 ITA_battleship_3:0 "Littorio Sınıfı"
 ITA_battleship_3_desc:0 "Littorio sınıfı, Vittorio Veneto sınıfı olarak da bilinir, II. Dünya Savaşı sırasında İtalya tarafından kullanılan en modern savaş gemilerini temsil ediyordu. 40.000 tonun üzerinde deplasmana sahiptiler ve boyutlarına göre çok hızlıydılar. İtalyan filosunun bel kemiğini oluşturdular."
 ITA_battleship_4:0 "Impero Sınıfı"
 ITA_battleship_4_desc:0 "Impero savaş gemileri, savaşın sonlarına ait varsayımsal bir savaş gemisi sınıfıydı. Yaklaşık 43.000 ton deplasmana sahiptiler, 381mm Ansaldo toplarıyla silahlandırılmışlardı ve iyi zırhlanmışlardı."
 ITA_carrier_1:0 "Giuseppe Miraglia Sınıfı"
 ITA_carrier_1_desc:0 "Giuseppe Miraglia sınıfı, savaşlararası dönemin başlarına ait varsayımsal bir uçak gemisi sınıfıdır. ABD Lexington sınıfı uçak gemileri ve Japon Kaga veya Akagi uçak gemileriyle karşılaştırılabilir."
 ITA_carrier_2:0 "Falco Sınıfı"
 ITA_carrier_2_desc:0 "Falco, savaşlararası dönem İtalyan uçak gemilerinin varsayımsal bir sınıfıdır. ABD Yorktown sınıfı uçak gemileri ve İngiliz Ark Royal uçak gemisiyle karşılaştırılabilirlerdi. Yaklaşık 21.000 ton deplasmana sahiptiler, iyi zırhlanmışlardı ve ortalama bir uçak kapasitesine sahiptiler."
 ITA_carrier_3:0 "Aquila Sınıfı"
 ITA_carrier_3_desc:0 "Aquila, bir okyanus gemisi olan Roma'nın planlanmış bir dönüşümüydü. Dönüşüm 1941'de başlayacaktı, ancak proje hiçbir zaman tamamlanamadı. Tamamlanmış olsaydı, Aquila 23.500 ton deplasmana sahip olacak ve Japon Hiyo sınıfı ile İngiliz Indomitable sınıfı uçak gemileriyle karşılaştırılabilir olacaktı."
 ITA_carrier_4:0 "Sparviero Sınıfı"
 ITA_carrier_4_desc:0 "Sparviero da bir okyanus gemisi olan Augustus'un planlanmış bir dönüşümüydü. Dönüşüm 1942 sonlarında başladı, ancak fazla ilerlemedi. Almanya, İtalyan ateşkesinden sonra gemiyi ele geçirince batırdı. Uçak gemisi 30.400 ton deplasmana sahip olacak, oldukça iyi zırhlanacak ve güçlü bir uçaksavar savunma bataryasına sahip olacaktı."
 ITA_destroyer_1:0 "Curtatone Sınıfı"
 ITA_destroyer_1_desc:0 "Curtatone sınıfı muhripler, I. Dünya Savaşı'nın ardından İtalya'da inşa edilen ilk muhriplerdi ve çift top montajları kullanan ilk muhriplerdi. Gemiler başlangıçta Palestro sınıfı muhriplerle aynı zamanda sipariş edildi, ancak çelik kıtlığı nedeniyle ertelendi. 1.000 tonun altında deplasmana sahiptiler ve dört 102mm Schneider-Armstrong topu taşıyorlardı."
 ITA_destroyer_2:0 "Soldati Sınıfı"
 ITA_destroyer_2_desc:0 "Soldati sınıfı, 1930'ların sonlarında inşa edilen bir muhrip grubuydu. İki parti vardı. İlk parti 1938-39'da on iki gemiden oluşuyordu. İkinci partideki beş gemi 1941-42'de tamamlandı. İlk parti 1.800 tonun üzerinde deplasmana sahipti ve dört 120mm Ansaldo topuyla silahlandırılmıştı."
 ITA_destroyer_3:0 "Ciclone Sınıfı"
 ITA_destroyer_3_desc:0 "Ciclone sınıfı muhripler torpido botu olarak sınıflandırıldı ancak aslında daha çok bir muhrip eskortuydu. Önceki Orsa sınıfının hafifçe büyütülmüş versiyonlarıydı, 1.100 tonun üzerinde deplasmana sahiptiler ve iyileştirilmiş stabilite ile daha ağır denizaltı savunma silahlarına sahiptiler."
 ITA_destroyer_4:0 "Medaglie d'Oro Sınıfı"
 ITA_destroyer_4_desc:0 "Comandanti Medaglie d'Oro sınıfı, Regia Marina için planlanan ancak İtalyan Ateşkesi zamanına kadar denize indirilmeyen bir muhrip grubuydu. Gemiler önceki İtalyan muhriplerinden önemli ölçüde daha büyüktü, yaklaşık 2.100 ton deplasmana sahiptiler. Ayrıca daha büyük 135mm Ansaldo toplarıyla silahlandırılmışlardı ve iyileştirilmiş motorlara sahiptiler."
 ITA_heavy_cruiser_1:0 "Trento Sınıfı"
 ITA_heavy_cruiser_1_desc:0 "Trento sınıfı, 1920'lerin sonlarından Regia Marina'nın bir ağır kruvazör tasarımıydı. Washington Deniz Antlaşması'nın sınırlamalarına özel olarak tasarlanan ilk gemilerdi ve bu antlaşma kruvazörleri 10.000 ton ve 8 inç toplarla sınırlıyordu. Sınıfın son gemisi Bolzano, 1932'de denize indirilen iyileştirilmiş bir tasarımdı."
 ITA_heavy_cruiser_2:0 "San Giorgio Sınıfı"
 ITA_heavy_cruiser_2_desc:0 "San Giorgio sınıfı, savaşın başlamasından kısa bir süre önce denize indirilecek varsayımsal bir savaşlararası dönem ağır kruvazör sınıfıdır. Bu kruvazörler 11.000 tonun üzerinde deplasmana sahip olacak ve sekiz 203mm Ansaldo topu taşıyacaktı."
 ITA_heavy_cruiser_3:0 "Pisa Sınıfı"
 ITA_heavy_cruiser_3_desc:0 "Pisa sınıfı, savaşın ortalarından kalma varsayımsal bir ağır kruvazördür. Yaklaşık 12.000 ton deplasmana sahipti ve kendi devriye gücünün öncüsü olarak hareket etti."
 ITA_heavy_cruiser_4:0 "Garibaldi Sınıfı"
 ITA_heavy_cruiser_4_desc:0 "Garibaldi sınıfı, savaşın sonlarına ait varsayımsal bir ağır kruvazör sınıfıdır. Yaklaşık 14.000 ton deplasmana sahipti, sekiz 203mm OTO/Ansaldo topuyla iyi silahlandırılmıştı ve çoğu uçak gemisi ve diğer başkent gemileriyle aynı hızda gidebiliyordu."
 ITA_light_cruiser_1:0 "Taranto Sınıfı"
 ITA_light_cruiser_1_desc:0 "Taranto ve Bari kruvazörleri, I. Dünya Savaşı dönemi kruvazörleriydi ve Almanya'dan tazminat olarak alınmıştı. Her ikisi de 4.500-5.100 ton arasında deplasmana sahipti ve Alman 150mm SK/45 toplarıyla silahlandırılmıştı."
 ITA_light_cruiser_2:0 "Duca degli Abruzzi"
 ITA_light_cruiser_2_desc:0 "Duca degli Abruzzi sınıfı, Condottieri sınıfı hafif kruvazörlerin beşinci alt sınıfıydı. II. Dünya Savaşı öncesinde Akdeniz'de üstünlük sağlamak için inşa edildiler. Savaş sırasında hizmete giren en büyük İtalyan hafif kruvazörleriydi, 9.400 tonun üzerinde deplasmana sahiptiler. İyi zırhlanmışlardı ve on 152mm Ansaldo topu taşıyorlardı."
 ITA_light_cruiser_3:0 "Capitani Romani Sınıfı"
 ITA_light_cruiser_3_desc:0 "Capitani Romani hafif kruvazörleri, temelde 1930'ların sonlarındaki büyük yeni Fransız muhriplerinden daha hızlı ve daha güçlü silahlara sahip olacak şekilde tasarlandı. 1939 sonlarında on iki gövde sipariş edildi, ancak sadece üçü 1943'teki İtalyan ateşkesinden önce tamamlandı. Hafif zırhlıydılar ve sadece 3.700 ton deplasmana sahiptiler, ancak oldukça hızlıydılar. Sekiz 135mm OTO/Ansaldo topu taşıyorlardı."
 ITA_light_cruiser_4:0 "San Marco Sınıfı"
 ITA_light_cruiser_4_desc:0 "San Marco sınıfı, önceki Capitani Romani hafif kruvazörlerinin iyileştirilmiş bir versiyonudur. İtalyan ateşkesi nedeniyle San Marco ve yeniden tasarlanmış kardeş gemisi San Giorgio, 1950'lere kadar hizmete girmedi."
 ITA_submarine_1:0 "Mameli Sınıfı"
 ITA_submarine_1_desc:0 "Geoffredo Mameli sınıfı, 1926-1928 arasında denize indirilen Regia Marina'nın orta boy denizaltı sınıfıdır. 800 tonun altında deplasmana sahiptiler ve 100m dalış derinliğine ulaşabiliyorlardı. Pisani, Bandiera ve Squalo sınıfları gibi sonraki modellerin temelini oluşturdular."
 ITA_submarine_2:0 "Perla Sınıfı"
 ITA_submarine_2_desc:0 "Perla ve Adua sınıfı denizaltılar 1930'larda inşa edildi. İtalya'nın inşa ettiği 600 Serisi denizaltıların üçüncü ve dördüncü alt sınıflarıydı. Öncüllerinden daha küçüktüler ve 600 tonun biraz üzerinde deplasmana sahiptiler."
 ITA_submarine_3:0 "Marconi Sınıfı"
 ITA_submarine_3_desc:0 "Marconi sınıfı, 1939-1940 arasında inşa edilen ve önceki Luizzi denizaltılarının yerini alan altı denizaltıdan oluşan bir sınıftı. Her iki sınıfın denizaltıları yaklaşık 1.000 ton deplasmana sahipti ve sekiz 533mm torpido tüpü bulunuyordu. İki sınıfın toplamında sadece bir gemi savaştan sağ çıktı."
 ITA_submarine_4:0 "Pietro Calvi Sınıfı"
 ITA_submarine_4_desc:0 "Pietro Calvi alt sınıfı, önceki Flutto sınıfına göre sadece küçük iyileştirmeler içeriyordu. Flutto sınıfı orta boy denizaltılardı. Çoğu gövde İtalyan ateşkesinden sonra Almanlar tarafından ele geçirildiği için sadece birkaçı denize indirilebildi. Pietro Calvi'nin yeniden tasarlanmış bir versiyonu nihayet 1961'de hizmete girdi."
 JAP_SH_battleship_1:0 "Yamato Sınıfı"
 JAP_SH_battleship_1_desc:0 "Yamato sınıfı, şimdiye kadar yapılmış en ağır savaş gemilerinden oluşuyordu ve 72.000 ton deplasmana sahipti. Bu gemiler, Barış Tanrıçaları planı altında Japon donanmasının gururu ve gücü olarak tasarlandı. Her gemi, bir savaş gemisine monte edilmiş en büyük deniz topçusu olan dokuz adet 460 milimetrelik deniz topu taşıyordu."
 JAP_SH_battleship_2:0 "Süper Yamato Sınıfı"
 JAP_SH_battleship_2_desc:0 "Varsayımsal Süper Yamato sınıfı, Yamato'nun temel alındığı bir tasarımdı ancak silahlar daha da güçlüydü: 51 cm'lik toplar ve en yeni tip güçlü uçaksavar silahları. Zırh kalınlığı, kendi toplarının mermilerine bile dayanacak şekilde tasarlandı ve yaklaşık 70-80.000 ton deplasmana sahipti."
 JAP_battle_cruiser_1:0 "Amagi Sınıfı"
 JAP_battle_cruiser_1_desc:0 "Amagi muharebe kruvazörleri, Japon Donanması'nın sekiz savaş gemisi ve sekiz muharebe kruvazörüne sahip olma planının bir parçası olarak planlanan bir dizi muharebe kruvazörüydü. Washington Deniz Antlaşması'nın ardından Amagi gemileri hurdaya çıkarıldı ve biri uçak gemisine dönüştürüldü."
 JAP_battle_cruiser_2:0 "Tasarım B-65"
 JAP_battle_cruiser_2_desc:0 "Tasarım B-65 muharebe kruvazörleri, iyi uçaksavar silahları ve modern silahlanmaya sahip hızlı, orta derecede zırhlı gemilerdi. ABD Donanması'nın yeni ağır kruvazörleriyle savaşmak ve IJN'nin filo uçak gemilerini korumak için tasarlandılar, tamamlanmış olsalardı hesaba katılması gereken bir güç olacaklardı."
 JAP_battleship_1:0 "Fuso Sınıfı"
 JAP_battleship_1_desc:0 "Fuso sınıfı savaş gemileri I. Dünya Savaşı sırasında inşa edildi ve 1. Londra Deniz Antlaşması'nın imzacılar için yeni savaş gemisi inşasını yasaklaması üzerine 1930'larda modernize edildi. İyi zırhlanmış ve silahlandırılmışlardı, ortada bulunan 6 çift taret ağır bir borda ateşi sağlıyordu ancak bu gemilerin taşıyabileceği ek uçaksavar silahlarını sınırlıyordu."
 JAP_battleship_2:0 "Kongo Sınıfı"
 JAP_battleship_2_desc:0 "Kongo savaş gemileri, I. Dünya Savaşı öncesinde IJN için muharebe kruvazörü olarak inşa edildi, ancak 1930'ların sonlarında büyük ölçüde modernize edildi ve birinci sınıf hızlı savaş gemisi olarak yeniden sınıflandırıldı. Zırhları, topları ve motorları büyük ölçüde yükseltildi ve Kongolar savaşın en hızlı Japon savaş gemileri olarak ortaya çıktı."
 JAP_battleship_3:0 "Tajima Sınıfı"
 JAP_battleship_3_desc:0 "Tajima sınıfı, devasa Yamato sınıfı savaş gemilerinden daha ucuz ve daha hızlı inşa edilecek şekilde tasarlanmış varsayımsal bir hızlı savaş gemisi sınıfıydı. Önceki savaş gemilerinin eski toplarını kullanıyorlardı, ancak yüksek hız, yeterli zırh ve uçaksavar savunması bu gemilere savunma sağlıyordu."
 JAP_battleship_4:0 "Iwami Sınıfı"
 JAP_battleship_4_desc:0 "Iwami sınıfı, inşaatı hızlandırmak için yeni yöntemler kullanan varsayımsal bir savaş gemisi sınıfıydı. Yeni toplar ve ağır uçaksavar toplarıyla iyi silahlandırılmışlardı ve ateş gücü açısından benzer şekilde silahlandırılmış herhangi bir gemiyle başa çıkabilirlerdi. Ancak, ortaya çıkan iyileştirmeler daha ağır ve bu nedenle biraz daha yavaş bir gemi sınıfı anlamına geliyordu."
 JAP_carrier_1:0 "Kaga Sınıfı"
 JAP_carrier_1_desc:0 "Kaga uçak gemisi, Japonya'nın ilk filo uçak gemisiydi. Başlangıçta bir savaş gemisi olarak tasarlanmış ancak uçak gemisi olarak tamamlanmıştı. Bu durum, iyileştirme için sınırlı alana sahip büyük ve ağır zırhlı bir uçak gemisiyle sonuçlandı. Ancak, Japon İmparatorluk Donanması için uçak gemisi inşasında önemli bir deneyim sağladı."
 JAP_carrier_2:0 "Soryu Sınıfı"
 JAP_carrier_2_desc:0 "Soryu ve Hiryu, yan yana seyrederken uçak kurtarma süreçlerini hızlandırmak için ayna adalar üst yapısıyla tasarlandı. Büyük hava grupları için alana sahip hızlı uçak gemileriydi ancak zırhları minimaldi. 20.000 ton deplasmana sahipti ve büyük motorlar yüksek hız ve uzun menzil sağlıyordu."
 JAP_carrier_3:0 "Shokaku Sınıfı"
 JAP_carrier_3_desc:0 "Shokaku sınıfı uçak gemileri, yüksek hız, uzun menzil, ağır koruma ve büyük uçak kapasitesi için tasarlandı, bu da onları mükemmel uçak gemileri yaptı. Geliştirilmiş inşa yöntemleri sayesinde tam yükte 33.000 ton deplasmana sahipti ve çağdaşlarının çoğundan daha fazla hasara dayanabiliyordu."
 JAP_carrier_4:0 "Taiho Sınıfı"
 JAP_carrier_4_desc:0 "Taiho sınıfı uçak gemisi, IJN'nin ilk tamamen zırhlı uçak gemisiydi. Zırhlı uçuş güvertesi, çoklu bomba ve torpido isabetlerine dayanabiliyor ve etkili bir şekilde çalışmaya devam edebiliyordu. Büyük bir hava grubu ve ağır uçaksavar silahları, yalnızca kendini savunma değil, aynı zamanda düşman kuvvetleri üzerinde güç projeksiyonu sağlıyordu."
 JAP_destroyer_1:0 "Minekaze Sınıfı"
 JAP_destroyer_1_desc:0 "Minekaze, Kamikaze ve Mutsuki sınıfı muhripler, dönemlerine göre hem yüzey topları hem de torpidolarla iyi silahlandırılmıştı ancak sınırlı uçaksavar silahları vardı. II. Dünya Savaşı'nın başında modası geçmiş kabul edildiler ve çoğunlukla ikincil rollere verildiler."
 JAP_destroyer_2:0 "Asashio Sınıfı"
 JAP_destroyer_2_desc:0 "Asashio sınıfı muhripler, 2.000 ton deplasmanı aşan ilk Japon muhrip sınıfıydı ve sonarla donatılan ilk muhriplerdi. Ağır torpido silahları ve yeterli hafif uçaksavar topları vardı ve eski Fubuki sınıfından biraz daha büyük bir operasyon yarıçapına sahiptiler."
 JAP_destroyer_3:0 "Akizuki Sınıfı"
 JAP_destroyer_3_desc:0 "Akizuki sınıfı muhripler hem yüzey topları hem de torpidolarla iyi silahlandırılmıştı, yeterli uçaksavar silahlanması ve çok ihtiyaç duyulan ek su bombaları vardı. Planlanan 39 gemiden sadece 12'si seri iptal edilmeden önce tamamlandı."
 JAP_destroyer_4:0 "Shimakaze Sınıfı"
 JAP_destroyer_4_desc:0 "Shimakaze sınıfı, tamamlandığı dönemde dünyanın en hızlı muhribiydi. Yeni yüksek sıcaklık, yüksek basınçlı türbinleri test etmek için bir prototip muhripti. Son derece hızlıydı ve ağır torpidolarla silahlandırılmıştı, ancak bu daha küçük bir operasyon yarıçapı anlamına geliyordu."
 JAP_heavy_cruiser_1:0 "Furutaka Sınıfı"
 JAP_heavy_cruiser_1_desc:0 "Furutaka sınıfı ve onu takip eden Aoba sınıfı ağır kruvazörler, İmparatorluk Japon Donanması'nın ilk ağır kruvazörleriydi. ABD Omaha ve İngiliz Hawkins sınıfı temel alınarak tasarlandılar. Hizmet ömürlerinin ilerleyen dönemlerinde modernize edildiler ve yeni silahlar ile daha iyi motorlar aldılar."
 JAP_heavy_cruiser_2:0 "Ağır Mogami Sınıfı"
 JAP_heavy_cruiser_2_desc:0 "Ağır Mogami sınıfı, daha büyük toplarla donatılmış ve yeniden sınıflandırılmış bir hafif kruvazör sınıfıydı. Bu onları hızlı, ağır silahlı ve iyi zırhlı kruvazörler yaptı. Uzun menzilleri, daha ince zırh koruması pahasına geldi."
 JAP_heavy_cruiser_3:0 "Tone Sınıfı"
 JAP_heavy_cruiser_3_desc:0 "Tone sınıfı ağır kruvazörler başlangıçta hafif kruvazör olarak tasarlanmıştı, ancak daha ağır silahlarla revize edildi. Tüm silahların önde toplandığı, geminin kıç kısmının ise düşman kuvvetlerini keşfetmek için deniz uçaklarını taşımak ve servis etmek için kullanıldığı benzersiz bir tasarıma sahiptiler."
 JAP_heavy_cruiser_4:0 "Ibuki Sınıfı"
 JAP_heavy_cruiser_4_desc:0 "Ibuki sınıfı ağır kruvazörler, Japonya tarafından savaşın sonundan önce inşa edilen son kruvazörlerdi. Mogami sınıfı ağır kruvazörlerin iyileştirilmiş versiyonlarıydı, aynı düzen ve silahlanmaya sahiptiler ancak daha modern uçaksavar silahları ve motorlarla donatılmışlardı."
 JAP_light_cruiser_1:0 "Tenryu Sınıfı"
 JAP_light_cruiser_1_desc:0 "Tenryu sınıfı gemiler yaklaşık 4.400 ton deplasmana sahipti ve diğer donanmaların benzer gemilerine kıyasla hafif silahlandırılmıştı, ancak iyi hız ve yeterli torpido silahlanması bu eksiklikleri telafi ediyordu. Muhrip filotillaları için bayrak gemisi olarak hareket etmek üzere tasarlandılar ve bu nedenle hafif kruvazör ile muhrip arasında bir ara sınıf olarak kabul edildiler."
 JAP_light_cruiser_2:0 "Hafif Mogami Sınıfı"
 JAP_light_cruiser_2_desc:0 "Mogami sınıfı kruvazörler ağır silahlandırılmıştı, iyi zırhla donatılmıştı ve yüksek hız sağlayan güçlü motorlara sahipti. Orijinal tasarımlarından daha büyük toplarla donatıldılar ve ağır kruvazör olarak yeniden sınıflandırıldılar. İyi uçaksavar savunması ve yüksek hız, uzun bir operasyon menzili sağladı."
 JAP_light_cruiser_3:0 "Agano Sınıfı"
 JAP_light_cruiser_3_desc:0 "Agano sınıfı hafif kruvazörler öncelikle muhrip filoları için filotilla lideri olarak tasarlandı. Hızlıydılar, 3 çift 152mm top taşıyorlardı, ancak sınırlı uçaksavar silahları ve ince zırh plakaları tasarımın önemli eksiklikleriydi."
 JAP_light_cruiser_4:0 "Agatsuma Sınıfı"
 JAP_light_cruiser_4_desc:0 "Agatsuma sınıfı, savaşın sonundan önce hiçbir gemisi inşa edilmeyen bir hafif kruvazör sınıfıydı. Kruvazörler, filoları ve uçak gemilerini düşman uçaklarına karşı korumak için hızlı ve ağır silahlı ancak hafif zırhlı olacak şekilde tasarlandı."
 JAP_submarine_1:0 "Kaichu Sınıfı"
 JAP_submarine_1_desc:0 "Kaichu sınıfı denizaltılar I. Dünya Savaşı sonrasında inşa edildi ve önceki denizaltılar temel alınarak geliştirildi. Bu orta boy denizaltılar yeterli silahlanmaya, iyi operasyonel menzile ve dönemlerine göre iyi bir hıza sahipti, ancak 1938'e gelindiğinde biraz modası geçmişlerdi. Toplamda IJN için 42 Kaichu tipi denizaltı inşa edildi ve seri 7 varyant içeriyordu."
 JAP_submarine_2:0 "Kaidai VI Sınıfı"
 JAP_submarine_2_desc:0 "Kaidai VI sınıfı denizaltılar, uzun menzilli ve nispeten iyi hıza sahip büyük ve iyi silahlanmış denizaltılardı. Tüm Kaidai serisi denizaltılar stabil ve başarılı teknelerdi ve Pasifik Savaşı sona erene kadar IJN'ye hizmet ettiler."
 JAP_submarine_3:0 "Ko/Otsu/Hei-gata Sınıfı"
 JAP_submarine_3_desc:0 "Ko-gata, Otsu-gata ve Hei-gata sınıfı tekneler, denizaltı filoları için komuta gemisi olarak görev yapan büyük boy kruvazör denizaltılardı. Gelişmiş radyo ekipmanları, ağır torpido silahlanması ve büyük boyutları sayesinde geniş bir operasyon yarıçapına sahiptiler. Ko ve Otsu-gata sınıfları keşif rolü için deniz uçakları da taşıyordu."
 JAP_submarine_4:0 "Sen-Toku Sınıfı"
 JAP_submarine_4_desc:0 "Sen-Toku sınıfı denizaltılar, II. Dünya Savaşı'nın en büyük su altı gemileriydi. Ağır torpido silahlanması, yeterli hafif uçaksavar ve boyutları ile motorları sayesinde nispeten hızlı ve uzun menzilli denizaltı uçak gemileriydi. Keşif ve sınırlı saldırı yetenekleri için üç Aichi M6A Seiran uçağı taşıyabiliyorlardı."
 JAP_torpedo_cruiser:0 "Kitakami-sınıfı"
 LAT_submarine_1:0 "Ronis Sınıfı"
 LAT_submarine_1_desc:0 "Ronis sınıfı, Letonya Donanması için Fransa'da inşa edilen iki denizaltıdan oluşuyordu. 1927'de hizmete girdiler. Küçüktüler, yalnızca 390 ton deplasmana sahiptiler ve altı adet 533mm torpido tüpü ile silahlandırılmışlardı."
 MEX_destroyer_1:0 "Guanajuato Sınıfı"
 MEX_heavy_cruiser_1:0 "Anáhuac Sınıfı"
 MEX_light_cruiser_1:0 "Progreso Sınıfı"
 NOR_destroyer_1:0 "Draug Sınıfı"
 NOR_destroyer_1_desc:0 "Dört Draug sınıfı destroyer, Norveç Kraliyet Donanması için inşa edilen ilk çoklu gemi destroyer sınıfıydı. Birinci Dünya Savaşı'ndan hemen önce hizmete girdiler ve 580 ton deplasmana sahiptiler. Ana silahlanmaları üç adet 3 inç İngiliz QF topundan oluşuyordu. Ancak, dönemlerinin diğer destroyerlerine kıyasla oldukça yavaştılar."
 NOR_destroyer_2:0 "Sleipner Sınıfı"
 NOR_destroyer_2_desc:0 "Sleipner sınıfı, 1937 ile 1939 arasında Norveç Kraliyet Donanması için Norveç'te inşa edilen büyük torpido botlarından oluşan bir sınıftı. Önceki Draug sınıfının aksine, Sleipner sınıfı nispeten iyi silahlanmış ve denizaltı savunma ekipmanına sahipti. 735 ton deplasmana sahiptiler ve boyutları için iyi bir hıza sahiptiler."
 NOR_destroyer_3:0 "Ålesund Sınıfı"
 NOR_destroyer_3_desc:0 "Ålesund sınıfı, 1939'da kızağa konan ancak Alman işgali nedeniyle tamamlanmayan iki destroyerden oluşuyordu. Tamamlanmış olsalardı, çoğu büyük ulusun destroyerleriyle boyut açısından karşılaştırılabilir ilk Norveç destroyerleri olacaklardı, 1.200 ton üzerinde deplasmana sahip olacaklardı. Silahlanmalarında dört adet 120mm/40 Bofors topu ve dört adet 533mm torpido tüpü bulunacaktı."
 NOR_destroyer_4:0 "Stord Sınıfı"
 NOR_destroyer_4_desc:0 "Stord sınıfı, 1943 ile 1944 arasında sürgündeki Norveç Kraliyet Donanması için inşa edilen dört İngiliz S sınıfı destroyerden oluşuyordu. Yaklaşık 1.800 ton deplasmana sahiptiler, ana silahlanmaları dört adet 120mm/45 QF Mk IX topu, sekiz adet 533mm torpido tüpü ve iyi bir denizaltı savunma ve radar desteğinden oluşuyordu. Ayrıca iyi bir hız ve güvenilirliğe sahiptiler."
 NOR_heavy_cruiser_1:0 "Norge Sınıfı"
 NOR_heavy_cruiser_1_desc:0 "Norge, yüzyılın başında Norveç için İngiltere'de inşa edilen bir sahil savunma gemisiydi. İki adet 210mm toptan oluşan silahlanması bir ağır kruvazörle karşılaştırılabilirdi, ancak yalnızca 4.200 ton üzerinde deplasmana sahip boyutu bir hafif kruvazöre daha yakındı. Hızı bir dretnot savaş gemisine benziyordu. İkinci Dünya Savaşı'nın başında Norveç Kraliyet Donanması'na hizmet veren döneminin dört sahil savunma gemisinden biriydi."
 NOR_submarine_1:0 "B Sınıfı"
 NOR_submarine_1_desc:0 "Norveç B sınıfı denizaltılar, Norveç Donanması için Norveç'te inşa edilen Amerikan Holland tipi denizaltılardı. Sınıfın altı gemisi 1923 ile 1930 arasında hizmete girdi. 420 ton deplasmana sahiptiler, dört adet 450mm torpido tüpü ile silahlandırılmışlardı ve 60 metre dalış derinliğine sahiptiler."
 NOR_submarine_3:0 "Uredd Sınıfı"
 NOR_submarine_3_desc:0 "Uredd sınıfı, 1941 ile 1943 arasında sürgündeki Norveç Donanması için inşa edilen iki İngiliz U sınıfı denizaltıdan oluşuyordu. Gemiler 540 ton deplasmana sahipti ve dört adet 533mm torpido tüpü ile silahlandırılmıştı. İyi bir İngiliz radar ve sonar desteğine ve 60 metre dalış derinliğine sahiptiler."
 NOR_submarine_4:0 "Utsira Sınıfı"
 NOR_submarine_4_desc:0 "Utsira sınıfı, dört İngiliz Vampire sınıfı denizaltıdan oluşuyordu. 1943 ile 1944 arasında inşa edildiler, ancak yalnızca biri savaşın sonundan önce sürgündeki Norveç Donanması'na transfer edildi. Gemiler, önceki U sınıfına kıyasla yalnızca orta düzeyde bir iyileştirmeydi. 545 ton deplasmana sahiptiler, dört adet 533mm torpido tüpü ile silahlandırılmışlardı ve 90 metre dalış derinliğine sahiptiler."
 NZL_SH_battleship_1:0 "Centurion Sınıfı"
 NZL_SH_battleship_1_desc:0 "Centurion, Alman ve Japon donanmalarının büyük gemilerine karşı koymak üzere Kraliyet Donanması için inşa edilen varsayımsal ağır zırhlılar sınıfıydı. Büyük 18 inç toplar ve kalın zırh, gemiye bu gemilerle savaşmak için gerekli ateş gücünü ve korumayı sağlıyordu. İngiliz İmparatorluğu'nun geniş denizlerini kapsamak için güçlü uçaksavar silahlanması, uzun menzil ve iyi hız bir zorunluluktu."
 NZL_SH_battleship_2:0 "Aslan II Sınıfı"
 NZL_SH_battleship_2_desc:0 "Aslan II sınıfı zırhlılar, 1944'te önceki Aslan sınıfı zırhlının geliştirilmiş bir versiyonu olarak tasarlandı. Savaş deneyimlerini içeren bu tasarım daha büyük ve ağırdı ve tamamlanmış olsaydı, en son model üç veya dört üçlü 16 inç top taşıyacaktı. Kalın zırh plakaları gemiyi herhangi bir yüzey veya hava tehdidine karşı koruyordu. Bu gemilerin inşa maliyeti, düşman donanmalarının yenilgisi ve uçak gemilerine duyulan ihtiyaç projenin terk edilmesine neden oldu."
 NZL_battle_cruiser_1:0 "Renown Sınıfı"
 NZL_battle_cruiser_1_desc:0 "Renown sınıfı muharebe kruvazörleri, başlangıçta Revenge sınıfı zırhlıların geliştirilmiş versiyonları olarak kızağa konmuştu. I. Dünya Savaşı'nın patlak vermesi üzerine inşaları durduruldu. Amiral Lord Fisher, inşalarını muharebe kruvazörü olarak yeniden başlatmayı başardı. Bu gemiler tipik muharebe kruvazörleriydi. İyi silahlanmış, hızlı ve manevra kabiliyeti yüksek gemilerdi ancak daha ince zırha ve daha kısa operasyonel menzile sahiplerdi. Orijinal üç gemiden sadece ikisi, Repulse ve Renown tamamlandı."
 NZL_battle_cruiser_2:0 "Princess Royal Sınıfı"
 NZL_battle_cruiser_2_desc:0 "Princess Royal, King George V sınıfı zırhlıların daha hızlı ve daha ucuz bir versiyonu olan varsayımsal muharebe kruvazörleri sınıfıydı. Bu gemiler, hem yüzey hem de uçaksavar savaşı için benzer ancak azaltılmış bir silahlanma taşıyordu: iki üçlü 14 inç top ve altı ikiz 5.25 inç uçaksavar topu. Yüksek hızları ve uzun menzilleri Kraliyet Donanması'na hızlı taarruz yeteneği ve konvoy koruması sağlayacaktı ancak sınırlı zırhları modern zırhlılarla savaşmak zorunda kalırlarda sorun yaratacaktı."
 NZL_battleship_1:0 "Revenge Sınıfı"
 NZL_battleship_1_desc:0 "Revenge sınıfı zırhlılar, 1913'te Queen Elizabeth sınıfı hızlı dreadnoughtların ucuz versiyonları olarak sipariş edildi. Benzer şekilde silahlanmış ve zırhlanmış olmalarına rağmen, önemli ölçüde daha düşük hızları onları II. Dünya Savaşı sırasında ikincil görevlere mahkum etti. Sınıfın planlanan 8 gemisinden sadece 5'i tamamlandı."
 NZL_battleship_2:0 "King George V Sınıfı"
 NZL_battleship_2_desc:0 "King George V sınıfı zırhlılar, başkent gemilerinin maksimum deplasman ve topçuluğunu sınırlayan 1922 Washington ve 1930 Birinci Londra Deniz Antlaşmaları'nın sonucuydu. Bu nedenle, bu gemiler önceki ve hatta çağdaşı zırhlılara kıyasla daha küçük çaplı toplarla donatıldı. Daha küçük çaplı olmalarına rağmen, yeterli silahlanmaya, güçlü uçaksavar silahlarına ve yeterli korumaya sahiplerdi. Eski Queen Elizabeth sınıfı zırhlıların yerine geçmek üzere beş gemi sipariş edildi ve kızağa kondu."
 NZL_battleship_3:0 "Aslan Sınıfı"
 NZL_battleship_3_desc:0 "Aslan sınıfı zırhlılar, King George V zırhlılarının ardılı olarak tasarlanmış ve birçok özelliğini içermişti. 1938 Deniz Programı kapsamında yaşlanan Revenge sınıfı zırhlıların yerini almak üzere altı gemi sipariş edildi ancak hiçbiri patlak veren düşmanlıklar nedeniyle tamamlanamadı. Gemiler genel olarak King George sınıfına benzer olacaktı, ancak ana silahları daha ağır olacak ve yeni 16 inç toplar tanıtılacaktı. Ayrıca daha kalın zırha ve daha güçlü motorlara sahip olacaklardı."
 NZL_battleship_4:0 "Vanguard Sınıfı"
 NZL_battleship_4_desc:0 "Vanguard sınıfı zırhlı, Kraliyet Donanması için inşa edilen son zırhlıydı. Tek bir gemi sipariş edildi ancak Pasifik cephesi için dört gemi daha düşünüldü. 1940 Acil Savaş Programı kapsamında sipariş edildi, inşasına yüksek öncelik verilmedi ve savaştan sonra tamamlandı. Sınıf, mükemmel stabilite ve denizcilik sağlayan şık bir gövdeye sahipti. Silahlanması Queen Elizabeth ve Revenge sınıfı zırhlılarla aynıydı, önemli bir ateş gücü sağlıyordu. Güçlü motorlar ve iyi zırh, gemiyi hızlı ve iyi korunaklı hale getirdi."
 NZL_carrier_1:0 "Courageous Sınıfı"
 NZL_carrier_1_desc:0 "Bu üç uçak gemisi, dönüştürülmüş muharebe kruvazörleriydi ve Kraliyet Donanması'nın ilk filo uçak gemileriydi. Dönüşümleri 1922 Washington Deniz Antlaşması'nın sonucuydu ve çalışmalar 1925'te tamamlandı. Orta derecede zırhlı ancak iyi silahlanmış gemilerdi, uzun menzile ve iyi hıza sahiplerdi ancak dönüşümün doğası gereği taşıdıkları uçak sayısı sınırlıydı. Bununla birlikte, Kraliyet Donanması'na uçak gemisi inşası ve filo hava projeksiyonu konusunda önemli deneyim kazandırdılar."
 NZL_carrier_2:0 "Ark Royal Sınıfı"
 NZL_carrier_2_desc:0 "Ark Royal uçak gemisi, Washington Deniz Antlaşması'nın kısıtlamalarına uyacak şekilde inşa edilen ilk gemidi. Hangarların ve uçuş güvertesinin gövdenin ayrılmaz bir parçası olduğu ilk gemiydi. 1934'te tasarlanan gemi iyi zırhlanmış ve silahlanmıştı. Büyük bir uçak kapasitesine sahipti ve Kraliyet Donanması'nın ana kuvvetlerine ayak uydurabilmek için yeterli operasyonel menzile ve hıza sahipti."
 NZL_carrier_3:0 "Illustrious Sınıfı"
 NZL_carrier_3_desc:0 "Illustrious sınıfı, uçak gemisi boyutunu 23.000 ton üst sınırıyla kısıtlayan 1936 İkinci Londra Deniz Antlaşması'nın kısıtlamaları dahilinde tasarlandı. Zırhlı uçuş güvertesine sahip ilk İngiliz uçak gemisiydi, bu da taşıdığı hava grubunun boyutunu azalttı. Ağır zırh ve uçaksavar silahları gemilere güçlü bir savunma sağlarken, güçlü motorlar ve büyük yakıt deposu gemilere uzun operasyonel menzil verdi."
 NZL_carrier_4:0 "Implacable Sınıfı"
 NZL_carrier_4_desc:0 "Implacable sınıfı uçak gemileri 1938 Deniz Programı kapsamında sipariş edildi ve esasen önceki Illustrious sınıfının iyileştirilmiş versiyonlarıydı. Savaş ve savaşın erken ve orta aşamalarında konvoy koruma görevleri için daha küçük gemilere öncelik verilmesi, bu gemilerin inşasını yavaşlattı. Illustrious sınıfına kıyasla daha fazla uçak taşıyabilen daha büyük gemilerdi, hem gövde hem de uçuş güvertesinde kalın zırh korunurken. Daha güçlü motorlar, Illustrious sınıfına kıyasla daha yüksek hız ve operasyonel menzil sağladı."
 NZL_destroyer_1:0 "V/W Sınıfı"
 NZL_destroyer_1_desc:0 "Bu muhripler, Amiralite ve Thornycroft V ve W sınıflarını içeriyordu. Savaş Acil Durum Programı kapsamında inşa edildiler. I. Dünya Savaşı sırasında İngiliz muhrip tasarımının nihai evrimiydiler, seleflerinin iyileştirmelerini ve yeni teknolojik gelişmeleri bünyelerinde barındırıyorlardı. Savaşın son aşamalarında çok sayıda inşa edildiler ve sonrasında Kraliyet Donanması'nın muhrip filotillalarının belkemiği haline geldiler. 1930'lardan itibaren yedek filolara alındılar ve sonunda konvoy eskort görevlerine verildiler. Yeterli silahlanmaya, yüksek hıza ve iyi menzile sahip gemilerdi."
 NZL_destroyer_2:0 "G/H/I Sınıfı"
 NZL_destroyer_2_desc:0 "G, H ve I sınıfı muhripler, 1933 ve 1934 Deniz İnşa Programları'nın bir parçası olarak sipariş edildi. Genel olarak önceki F sınıfının tekrarlarıydı, boyutlarında hafif bir küçülme vardı. G ve H sınıflarının silahlanması F sınıfıyla aynıydı, her ikisi de 4.7 inç toplar kullanıyordu. Bu gemiler uzun menzilli, yeterli silahlanmaya ve güçlü bir torpido desteğine sahipti. Savaş boyunca yoğun şekilde kullanıldılar ve çok sayıda kayıp verdiler."
 NZL_destroyer_3:0 "J/K/N Sınıfı"
 NZL_destroyer_3_desc:0 "J, K ve N sınıfları, önceki Tribal sınıfına benziyordu ancak topçu silahlanmasını vurgulamak yerine, tasarımcılar daha standart bir ağır torpido ve hafif top düzenine geri döndüler. Gemiler savaş boyunca çeşitli modifikasyonlar geçirdi. Yükseltmeler arasında geliştirilmiş uçaksavar topları ve radar vardı. Filo eskortları için ideal, hızlı, uzun menzilli ve iyi silahlanmış gemilerdi."
 NZL_destroyer_4:0 "Muharebe Sınıfı"
 NZL_destroyer_4_desc:0 "Muharebe sınıfı muhripler, savaş boyunca kullanılan İngiliz muhriplerinin evrimini temel aldı. Gemiler 1942 ve 1943 Deniz Programları'nın bir parçası olarak sipariş edildi. Hem topları hem de torpidoları açısından iyi silahlanmışlardı. Uçaksavar silahlanması, denizaltı savunma kabiliyetleri, hızları ve menzilleri onları çok yönlü gemiler yapıyordu. Savaşa geç katılmaları nedeniyle katkıları minimal düzeyde kaldı."
 NZL_heavy_cruiser_1:0 "Hawkins Sınıfı"
 NZL_heavy_cruiser_1_desc:0 "Hawkins sınıfı kruvazörler dünyanın ilk ağır kruvazörleriydi. Önceki Town sınıfı hafif kruvazörler, özellikle Birmingham alt sınıfı temel alınarak geliştirilmişlerdi ancak 7.5 inç toplar ve daha kalın bir zırh kuşağı ile donatılmışlardı. Almanya'nın büyük konvoy akıncılarıyla savaşmak üzere tasarlanmışlardı. İyi silahlanmışlardı, makul hız ve menzile sahiplerdi ve iyi korunuyorlardı. Toplamda beş gemi hizmete girdi ancak sadece dördü II. Dünya Savaşı'nın başlangıcında aktif durumdaydı."
 NZL_heavy_cruiser_2:0 "Surrey Sınıfı"
 NZL_heavy_cruiser_2_desc:0 "Surrey sınıfı ağır kruvazörler, 1928 Deniz Programı kapsamında önerilmişti. Önceki York sınıfı ağır kruvazörlerin iyileştirilmiş versiyonlarıydı. Tamamlanmış olsalardı, dört adet ikiz 8 inç top taretine, daha ağır zırha ve daha güçlü motorlara sahip olacaklardı. İki gemi sipariş edildi ancak hiçbiri kızağa konmadı."
 NZL_heavy_cruiser_3:0 "Amiral Sınıfı"
 NZL_heavy_cruiser_3_desc:0 "Amiral sınıfı ağır kruvazörler (Amiral sınıfı muharebe kruvazörleri ile karıştırılmamalıdır), Kraliyet Donanması'nın 8 inç toplarla donatılmış kruvazörler tasarlama ve inşa etme konusundaki son girişimiydi. Tasarım çalışmaları 1938'de başladı ve 1941'de sona erdi, çeşitli önerilerle sonuçlandı. Son öneriler, üçlü taretlerde yeni 8 inç toplar, ağır uçaksavar silahlanması, kalın zırh ve iyi hız özelliklerine sahipti. Düşman kruvazörlerinin eksikliği ve bu gemilerin maliyet verimliliği, daha fazla hafif kruvazör inşa etmeye odaklanılmasına neden oldu."
 NZL_heavy_cruiser_4:0 "Churchill Tasarımı"
 NZL_heavy_cruiser_4_desc:0 "Bu gemiler, II. Dünya Savaşı'nın erken aşamalarında Alman Deutschland sınıfı büyük top kruvazörlerine karşı koymak için Denizcilik Bakanı Sir Winston Churchill tarafından önerilmişti. 9.2 inç toplara, ağır uçaksavar silahlanmasına ve güçlü zırha sahip olacaklardı. Düşman başkent gemileriyle etkili şekilde savaşmak üzere tasarlanmışlardı. Yüksek maliyetler ve yeni bir ağır kruvazöre duyulan ihtiyacın azlığı nedeniyle gemilerin inşası iptal edildi."
 NZL_light_cruiser_1:0 "C Sınıfı"
 NZL_light_cruiser_1_desc:0 "C sınıfı hafif kruvazörler, Kraliyet Donanması'na ait yirmi sekiz hafif kruvazörden oluşan bir gruptu. I. Dünya Savaşı öncesinde ve sırasında Kuzey Denizi'nin zorlu koşulları için inşa edildiler. Nispeten küçük ve dar olmalarına rağmen sağlam ve yetenekli gemiler olduklarını kanıtladılar. Silahlanmaları oldukça tatmin ediciydi, düşman yüzey hedefleriyle savaşmak için yeterli sayıda 6 inç top ve ağır bir torpido yükü taşıyorlardı. I. Dünya Savaşı sırasında yoğun şekilde kullanıldılar ve birçok yüzey muharebesine katıldılar. 1930'ların ortalarında sadece Caledon, Ceres ve Carlisle alt sınıfları hizmetteydi."
 NZL_light_cruiser_2:0 "Southampton Sınıfı"
 NZL_light_cruiser_2_desc:0 "Southampton sınıfı hafif kruvazörler, Town sınıfı kruvazörlerin bir alt sınıfıydı ve Japon Mogami sınıfı kruvazörlere karşı koymak üzere tasarlanmışlardı. Bu gemiler iyi zırhlanmıştı, iyi hıza ve menzile sahipti ve dört üçlü tarette on iki adet 6 inç toptan oluşan güçlü bir silahlanma taşıyorlardı. Sonraki Kraliyet Donanması savaş dönemi hafif kruvazör tasarımlarının temelini oluşturdular."
 NZL_light_cruiser_3:0 "Gambia Sınıfı"
 NZL_light_cruiser_3_desc:0 "Gambia sınıfı, Yeni Zelanda'nın İngiliz Crown Colony sınıfı hafif kruvazörler için kullandığı tanımdı. Bunlar, önceki Town sınıfının iyileştirilmiş versiyonlarıydı ancak inşayı hızlandırmak ve maliyetleri düşürmek için basitleştirilmiş bir tasarıma sahiplerdi. Gemiler selefleriyle aynı topları taşıyordu, 6 inç topların yer aldığı dört üçlü taret. Benzer şekilde zırhlanmışlardı ancak daha küçük motorlara sahip oldukları için menzilleri biraz daha düşüktü. Fiji ve Ceylon olmak üzere iki alt sınıfı vardı."
 NZL_light_cruiser_4:0 "Black Prince Sınıfı"
 NZL_light_cruiser_4_desc:0 "Black Prince sınıfı, Kanada'nın İngiliz Minotaur sınıfı (veya Swiftsure sınıfı) hafif kruvazörler için kullandığı tanımdı. Bu kruvazörler, Crown Colony sınıfının modifiye edilmiş bir versiyonu olarak tasarlandı ve 1941'de onaylanan savaş modifikasyonlarını içeriyordu. Crown Colony sınıfına kıyasla daha uzun operasyonel menzile ve daha fazla uçaksavar silahına sahiplerdi, ancak ana silahları üç üçlü tarette toplanmıştı. Savaşın sonucunu etkileyecek kadar geç inşa edildikleri için sipariş edilen gemilerin çoğu iptal edildi."
 NZL_submarine_1:0 "L Sınıfı"
 NZL_submarine_1_desc:0 "L sınıfı denizaltılar, Acil Savaş Programı kapsamında önceki denizaltı sınıflarının geliştirilmiş versiyonu olarak tasarlanan orta boy teknelerdi. I. Dünya Savaşı'nın son aşamalarında inşa edildiler ve yeni, daha büyük 21 inç torpidolarla donatıldılar. II. Dünya Savaşı'nın başlangıcına kadar hizmet verdiler, çoğunlukla ikincil ve eğitim görevlerinde kullanıldılar."
 NZL_submarine_2:0 "T Sınıfı"
 NZL_submarine_2_desc:0 "To sınıfı veya Triton sınıfı denizaltılar, O, P ve R sınıfı büyük denizaltıların yerini almak üzere tasarlandı. Atlantik ve Pasifik Okyanusu'na uygun, uzun menzilli orta büyüklükte denizaltılardı. İyi silahlandırılmış ve stabil platformlardı, inşa edilen teknelerin yüzde 25'i savaş sırasında kaybedildi."
 NZL_submarine_3:0 "U Sınıfı"
 NZL_submarine_3_desc:0 "U sınıfı, 1940 ve 1941 Savaş Acil Durum Programları kapsamında inşa edilen küçük boyutlu denizaltılardı. Başlangıçta eğitim denizaltısı olarak tasarlanmışlardı ancak savaşın başlamasıyla tasarım değiştirildi ve Kuzey Denizi ile Akdeniz'in sınırlı sularında kullanışlı olduklarını kanıtladılar. Küçük boyutları nedeniyle menzilleri ve silahları sınırlıydı. Undine, Umpire ve Uproar olmak üzere üç alt sınıftan oluşuyorlardı."
 NZL_submarine_4:0 "V Sınıfı"
 NZL_submarine_4_desc:0 "V sınıfı veya Vampir sınıfı denizaltılar, önceki U sınıfı küçük boyutlu tekneler temel alınarak geliştirildi. Daha büyük ancak yine de nispeten küçük boyutluydular, daha iyi denizcilik kabiliyetine sahiplerdi ancak operasyonel menzil ve silahlanma açısından sınırlıydılar."
 POR_destroyer_1:0 "Douro Sınıfı"
 POR_destroyer_1_desc:0 "Douro sınıfı, 1930'ların başında denize indirilen yedi muhripten oluşan bir sınıftı. Hem Portekiz'de hem de İngiltere'de inşa edildiler. Gemilerden ikisi 1934'te Kolombiya'ya satıldı. Gemiler 1.200 tonun üzerinde deplasmana sahipti ve dört adet BL 4.7 inç top ve sekiz adet 533mm torpido tüpüyle donatılmışlardı."
 POR_submarine_1:0 "Foca Sınıfı"
 POR_submarine_1_desc:0 "Portekiz Foca sınıfı, I. Dünya Savaşı'ndan hemen sonra Portekiz Donanması için İtalya'da inşa edilen üç küçük denizaltıyı temsil ediyordu. İtalyan Espadarte sınıfının büyütülmüş versiyonları ve İspanyol A sınıfının kardeş gemileriydi. Sadece 260 ton deplasmana sahiplerdi ve iki adet 450mm torpido tüpüyle donatılmışlardı. Üç gemi de 1930'ların ortalarında hizmet dışı bırakıldı."
 POR_submarine_2:0 "Delfim Sınıfı"
 POR_submarine_2_desc:0 "Delfim sınıfı, 1930'ların başında Portekiz Donanması için İtalya'da sipariş edilen ve kızağa konan bir çift denizaltıdan oluşuyordu. Sipariş iptal edildi ve gemiler bunun yerine İtalyan Donanması için tamamlandı. Büyük İtalyan Squalo sınıfı temel alınarak geliştirilmişlerdi, 980 ton deplasmana ve sekiz adet 533mm torpido tüpüne sahiplerdi."
 POR_submarine_4:0 "Narval Sınıfı"
 POR_submarine_4_desc:0 "Narval sınıfı, 1945'te hizmete giren ve II. Dünya Savaşı'ndan sonra Portekiz'e satılan üç İngiliz Subtle sınıfı denizaltıdan oluşuyordu. 840 ton deplasmana ve yedi adet 533mm torpido tüpüne sahiplerdi."
 PRU_destroyer_1:0 "Almirante Villar Sınıfı"
 PRU_destroyer_1_desc:0 "Almirante Villar ve Amirante Guise, eski Rus Novik sınıfı muhripleriydi. Peru Donanması'na ulaşana kadar hem İngiltere hem de Estonya bayrakları altında seyrettiler. Dört adet 102mm/60 kalibre top ve dokuz adet 533mm torpido tüpüyle donatılmışlardı. 1.200 tonun üzerinde deplasmana sahiplerdi ve boyutları ve dönemleri için iyi bir hıza sahiplerdi."
 PRU_light_cruiser_1:0 "Almirante Grau Sınıfı"
 PRU_light_cruiser_1_desc:0 "Almirante Grau sınıfı, Peru Donanması için İngiltere'de inşa edilen ve 1907'de hizmete giren iki I. Dünya Savaşı öncesi hafif kruvazörden oluşuyordu. Hafif kruvazör standartlarında bile oldukça küçük gemilerdi, sadece 3.100 ton deplasmana sahiplerdi ve hızları da ortalamanın altındaydı. Hafif zırhlıydılar ve ana silahları çift 152mm/50 kalibre Vickers toplarıydı."
 PRU_submarine_1:0 "R Sınıfı"
 PRU_submarine_1_desc:0 "Peru R sınıfı denizaltılar, 1920'lerin ortalarında ABD'den sipariş edilen ve ABD'de inşa edilen dört denizaltıdan oluşuyordu. Esasen ABD R sınıfı denizaltılarıyla aynıydı, 570 tonun üzerinde deplasmana ve dört adet 533mm torpido tüpüne sahiplerdi."
 RAJ_SH_battleship_1:0 "Centurion Sınıfı"
 RAJ_SH_battleship_1_desc:0 "Centurion, Alman ve Japon donanmalarının büyük gemilerine karşı koymak üzere Kraliyet Donanması için inşa edilen varsayımsal ağır zırhlılar sınıfıydı. Büyük 18 inç toplar ve kalın zırh, gemiye bu gemilerle savaşmak için gerekli ateş gücünü ve korumayı sağlıyordu. İngiliz İmparatorluğu'nun geniş denizlerini kapsamak için güçlü uçaksavar silahlanması, uzun menzil ve iyi hız bir zorunluluktu."
 RAJ_SH_battleship_2:0 "Aslan II Sınıfı"
 RAJ_SH_battleship_2_desc:0 "Aslan II sınıfı zırhlılar, 1944'te önceki Aslan sınıfı zırhlının geliştirilmiş bir versiyonu olarak tasarlandı. Savaş deneyimlerini içeren bu tasarım daha büyük ve ağırdı ve tamamlanmış olsaydı, en son model üç veya dört üçlü 16 inç top taşıyacaktı. Kalın zırh plakaları gemiyi herhangi bir yüzey veya hava tehdidine karşı koruyordu. Bu gemilerin inşa maliyeti, düşman donanmalarının yenilgisi ve uçak gemilerine duyulan ihtiyaç projenin terk edilmesine neden oldu."
 RAJ_basic_light_cruiser:0 "Southampton Sınıfı"
 RAJ_battle_cruiser_1:0 "Renown Sınıfı"
 RAJ_battle_cruiser_1_desc:0 "Renown sınıfı muharebe kruvazörleri, başlangıçta Revenge sınıfı zırhlıların geliştirilmiş versiyonları olarak kızağa konmuştu. I. Dünya Savaşı'nın patlak vermesi üzerine inşaları durduruldu. Amiral Lord Fisher, inşalarını muharebe kruvazörü olarak yeniden başlatmayı başardı. Bu gemiler tipik muharebe kruvazörleriydi. İyi silahlanmış, hızlı ve manevra kabiliyeti yüksek gemilerdi ancak daha ince zırha ve daha kısa operasyonel menzile sahiplerdi. Orijinal üç gemiden sadece ikisi, Repulse ve Renown tamamlandı."
 RAJ_battle_cruiser_2:0 "Princess Royal Sınıfı"
 RAJ_battle_cruiser_2_desc:0 "Princess Royal, King George V sınıfı zırhlıların daha hızlı ve daha ucuz bir versiyonu olan varsayımsal muharebe kruvazörleri sınıfıydı. Bu gemiler, hem yüzey hem de uçaksavar savaşı için benzer ancak azaltılmış bir silahlanma taşıyordu: iki üçlü 14 inç top ve altı ikiz 5.25 inç uçaksavar topu. Yüksek hızları ve uzun menzilleri Kraliyet Donanması'na hızlı taarruz yeteneği ve konvoy koruması sağlayacaktı ancak sınırlı zırhları modern zırhlılarla savaşmak zorunda kalırlarda sorun yaratacaktı."
 RAJ_battleship_1:0 "Revenge Sınıfı"
 RAJ_battleship_1_desc:0 "Revenge sınıfı zırhlılar, 1913'te Queen Elizabeth sınıfı hızlı dreadnoughtların ucuz versiyonları olarak sipariş edildi. Benzer şekilde silahlanmış ve zırhlanmış olmalarına rağmen, önemli ölçüde daha düşük hızları onları II. Dünya Savaşı sırasında ikincil görevlere mahkum etti. Sınıfın planlanan 8 gemisinden sadece 5'i tamamlandı."
 RAJ_battleship_2:0 "King George V Sınıfı"
 RAJ_battleship_2_desc:0 "King George V sınıfı zırhlılar, başkent gemilerinin maksimum deplasman ve topçuluğunu sınırlayan 1922 Washington ve 1930 Birinci Londra Deniz Antlaşmaları'nın sonucuydu. Bu nedenle, bu gemiler önceki ve hatta çağdaşı zırhlılara kıyasla daha küçük çaplı toplarla donatıldı. Daha küçük çaplı olmalarına rağmen, yeterli silahlanmaya, güçlü uçaksavar silahlarına ve yeterli korumaya sahiplerdi. Eski Queen Elizabeth sınıfı zırhlıların yerine geçmek üzere beş gemi sipariş edildi ve kızağa kondu."
 RAJ_battleship_3:0 "Aslan Sınıfı"
 RAJ_battleship_3_desc:0 "Aslan sınıfı zırhlılar, King George V zırhlılarının ardılı olarak tasarlanmış ve birçok özelliğini içermişti. 1938 Deniz Programı kapsamında yaşlanan Revenge sınıfı zırhlıların yerini almak üzere altı gemi sipariş edildi ancak hiçbiri patlak veren düşmanlıklar nedeniyle tamamlanamadı. Gemiler genel olarak King George sınıfına benzer olacaktı, ancak ana silahları daha ağır olacak ve yeni 16 inç toplar tanıtılacaktı. Ayrıca daha kalın zırha ve daha güçlü motorlara sahip olacaklardı."
 RAJ_battleship_4:0 "Vanguard Sınıfı"
 RAJ_battleship_4_desc:0 "Vanguard sınıfı zırhlı, Kraliyet Donanması için inşa edilen son zırhlıydı. Tek bir gemi sipariş edildi ancak Pasifik cephesi için dört gemi daha düşünüldü. 1940 Acil Savaş Programı kapsamında sipariş edildi, inşasına yüksek öncelik verilmedi ve savaştan sonra tamamlandı. Sınıf, mükemmel stabilite ve denizcilik sağlayan şık bir gövdeye sahipti. Silahlanması Queen Elizabeth ve Revenge sınıfı zırhlılarla aynıydı, önemli bir ateş gücü sağlıyordu. Güçlü motorlar ve iyi zırh, gemiyi hızlı ve iyi korunaklı hale getirdi."
 RAJ_carrier_1:0 "Courageous Sınıfı"
 RAJ_carrier_1_desc:0 "Bu üç uçak gemisi, dönüştürülmüş muharebe kruvazörleriydi ve Kraliyet Donanması'nın ilk filo uçak gemileriydi. Dönüşümleri 1922 Washington Deniz Antlaşması'nın sonucuydu ve çalışmalar 1925'te tamamlandı. Orta derecede zırhlı ancak iyi silahlanmış gemilerdi, uzun menzile ve iyi hıza sahiplerdi ancak dönüşümün doğası gereği taşıdıkları uçak sayısı sınırlıydı. Bununla birlikte, Kraliyet Donanması'na uçak gemisi inşası ve filo hava projeksiyonu konusunda önemli deneyim kazandırdılar."
 RAJ_carrier_2:0 "Ark Royal Sınıfı"
 RAJ_carrier_2_desc:0 "Ark Royal uçak gemisi, Washington Deniz Antlaşması'nın kısıtlamalarına uyacak şekilde inşa edilen ilk gemidi. Hangarların ve uçuş güvertesinin gövdenin ayrılmaz bir parçası olduğu ilk gemiydi. 1934'te tasarlanan gemi iyi zırhlanmış ve silahlanmıştı. Büyük bir uçak kapasitesine sahipti ve Kraliyet Donanması'nın ana kuvvetlerine ayak uydurabilmek için yeterli operasyonel menzile ve hıza sahipti."
 RAJ_carrier_3:0 "Illustrious Sınıfı"
 RAJ_carrier_3_desc:0 "Illustrious sınıfı, uçak gemisi boyutunu 23.000 ton üst sınırıyla kısıtlayan 1936 İkinci Londra Deniz Antlaşması'nın kısıtlamaları dahilinde tasarlandı. Zırhlı uçuş güvertesine sahip ilk İngiliz uçak gemisiydi, bu da taşıdığı hava grubunun boyutunu azalttı. Ağır zırh ve uçaksavar silahları gemilere güçlü bir savunma sağlarken, güçlü motorlar ve büyük yakıt deposu gemilere uzun operasyonel menzil verdi."
 RAJ_carrier_4:0 "Implacable Sınıfı"
 RAJ_carrier_4_desc:0 "Implacable sınıfı uçak gemileri 1938 Deniz Programı kapsamında sipariş edildi ve esasen önceki Illustrious sınıfının iyileştirilmiş versiyonlarıydı. Savaş ve savaşın erken ve orta aşamalarında konvoy koruma görevleri için daha küçük gemilere öncelik verilmesi, bu gemilerin inşasını yavaşlattı. Illustrious sınıfına kıyasla daha fazla uçak taşıyabilen daha büyük gemilerdi, hem gövde hem de uçuş güvertesinde kalın zırh korunurken. Daha güçlü motorlar, Illustrious sınıfına kıyasla daha yüksek hız ve operasyonel menzil sağladı."
 RAJ_destroyer_1:0 "V/W Sınıfı"
 RAJ_destroyer_1_desc:0 "Bu muhripler, Amiralite ve Thornycroft V ve W sınıflarını içeriyordu. Savaş Acil Durum Programı kapsamında inşa edildiler. I. Dünya Savaşı sırasında İngiliz muhrip tasarımının nihai evrimiydiler, seleflerinin iyileştirmelerini ve yeni teknolojik gelişmeleri bünyelerinde barındırıyorlardı. Savaşın son aşamalarında çok sayıda inşa edildiler ve sonrasında Kraliyet Donanması'nın muhrip filotillalarının belkemiği haline geldiler. 1930'lardan itibaren yedek filolara alındılar ve sonunda konvoy eskort görevlerine verildiler. Yeterli silahlanmaya, yüksek hıza ve iyi menzile sahip gemilerdi."
 RAJ_destroyer_2:0 "G/H/I Sınıfı"
 RAJ_destroyer_2_desc:0 "G, H ve I sınıfı muhripler, 1933 ve 1934 Deniz İnşa Programları'nın bir parçası olarak sipariş edildi. Genel olarak önceki F sınıfının tekrarlarıydı, boyutlarında hafif bir küçülme vardı. G ve H sınıflarının silahlanması F sınıfıyla aynıydı, her ikisi de 4.7 inç toplar kullanıyordu. Bu gemiler uzun menzilli, yeterli silahlanmaya ve güçlü bir torpido desteğine sahipti. Savaş boyunca yoğun şekilde kullanıldılar ve çok sayıda kayıp verdiler."
 RAJ_destroyer_3:0 "J/K/N Sınıfı"
 RAJ_destroyer_3_desc:0 "J, K ve N sınıfları, önceki Tribal sınıfına benziyordu ancak topçu silahlanmasını vurgulamak yerine, tasarımcılar daha standart bir ağır torpido ve hafif top düzenine geri döndüler. Gemiler savaş boyunca çeşitli modifikasyonlar geçirdi. Yükseltmeler arasında geliştirilmiş uçaksavar topları ve radar vardı. Filo eskortları için ideal, hızlı, uzun menzilli ve iyi silahlanmış gemilerdi."
 RAJ_destroyer_4:0 "Muharebe Sınıfı"
 RAJ_destroyer_4_desc:0 "Muharebe sınıfı muhripler, savaş boyunca kullanılan İngiliz muhriplerinin evrimini temel aldı. Gemiler 1942 ve 1943 Deniz Programları'nın bir parçası olarak sipariş edildi. Hem topları hem de torpidoları açısından iyi silahlanmışlardı. Uçaksavar silahlanması, denizaltı savunma kabiliyetleri, hızları ve menzilleri onları çok yönlü gemiler yapıyordu. Savaşa geç katılmaları nedeniyle katkıları minimal düzeyde kaldı."
 RAJ_heavy_cruiser_1:0 "Hawkins Sınıfı"
 RAJ_heavy_cruiser_1_desc:0 "Hawkins sınıfı kruvazörler dünyanın ilk ağır kruvazörleriydi. Önceki Town sınıfı hafif kruvazörler, özellikle Birmingham alt sınıfı temel alınarak geliştirilmişlerdi ancak 7.5 inç toplar ve daha kalın bir zırh kuşağı ile donatılmışlardı. Almanya'nın büyük konvoy akıncılarıyla savaşmak üzere tasarlanmışlardı. İyi silahlanmışlardı, makul hız ve menzile sahiplerdi ve iyi korunuyorlardı. Toplamda beş gemi hizmete girdi ancak sadece dördü II. Dünya Savaşı'nın başlangıcında aktif durumdaydı."
 RAJ_heavy_cruiser_2:0 "Surrey Sınıfı"
 RAJ_heavy_cruiser_2_desc:0 "Surrey sınıfı ağır kruvazörler, 1928 Deniz Programı kapsamında önerilmişti. Önceki York sınıfı ağır kruvazörlerin iyileştirilmiş versiyonlarıydı. Tamamlanmış olsalardı, dört adet ikiz 8 inç top taretine, daha ağır zırha ve daha güçlü motorlara sahip olacaklardı. İki gemi sipariş edildi ancak hiçbiri kızağa konmadı."
 RAJ_heavy_cruiser_3:0 "Amiral Sınıfı"
 RAJ_heavy_cruiser_3_desc:0 "Amiral sınıfı ağır kruvazörler (Amiral sınıfı muharebe kruvazörleri ile karıştırılmamalıdır), Kraliyet Donanması'nın 8 inç toplarla donatılmış kruvazörler tasarlama ve inşa etme konusundaki son girişimiydi. Tasarım çalışmaları 1938'de başladı ve 1941'de sona erdi, çeşitli önerilerle sonuçlandı. Son öneriler, üçlü taretlerde yeni 8 inç toplar, ağır uçaksavar silahlanması, kalın zırh ve iyi hız özelliklerine sahipti. Düşman kruvazörlerinin eksikliği ve bu gemilerin maliyet verimliliği, daha fazla hafif kruvazör inşa etmeye odaklanılmasına neden oldu."
 RAJ_heavy_cruiser_4:0 "Churchill Tasarımı"
 RAJ_heavy_cruiser_4_desc:0 "Bu gemiler, II. Dünya Savaşı'nın erken aşamalarında Alman Deutschland sınıfı büyük top kruvazörlerine karşı koymak için Denizcilik Bakanı Sir Winston Churchill tarafından önerilmişti. 9.2 inç toplara, ağır uçaksavar silahlanmasına ve güçlü zırha sahip olacaklardı. Düşman başkent gemileriyle etkili şekilde savaşmak üzere tasarlanmışlardı. Yüksek maliyetler ve yeni bir ağır kruvazöre duyulan ihtiyacın azlığı nedeniyle gemilerin inşası iptal edildi."
 RAJ_light_cruiser_1:0 "C Sınıfı"
 RAJ_light_cruiser_1_desc:0 "C sınıfı hafif kruvazörler, Kraliyet Donanması'na ait yirmi sekiz hafif kruvazörden oluşan bir gruptu. I. Dünya Savaşı öncesinde ve sırasında Kuzey Denizi'nin zorlu koşulları için inşa edildiler. Nispeten küçük ve dar olmalarına rağmen sağlam ve yetenekli gemiler olduklarını kanıtladılar. Silahlanmaları oldukça tatmin ediciydi, düşman yüzey hedefleriyle savaşmak için yeterli sayıda 6 inç top ve ağır bir torpido yükü taşıyorlardı. I. Dünya Savaşı sırasında yoğun şekilde kullanıldılar ve birçok yüzey muharebesine katıldılar. 1930'ların ortalarında sadece Caledon, Ceres ve Carlisle alt sınıfları hizmetteydi."
 RAJ_light_cruiser_2:0 "Southampton Sınıfı"
 RAJ_light_cruiser_2_desc:0 "Southampton sınıfı hafif kruvazörler, Town sınıfı kruvazörlerin bir alt sınıfıydı ve Japon Mogami sınıfı kruvazörlere karşı koymak üzere tasarlanmışlardı. Bu gemiler iyi zırhlanmıştı, iyi hıza ve menzile sahipti ve dört üçlü tarette on iki adet 6 inç toptan oluşan güçlü bir silahlanma taşıyorlardı. Sonraki Kraliyet Donanması savaş dönemi hafif kruvazör tasarımlarının temelini oluşturdular."
 RAJ_light_cruiser_3:0 "Crown Colony Sınıfı"
 RAJ_light_cruiser_3_desc:0 "Crown Colony sınıfı hafif kruvazörler, önceki Town sınıfının iyileştirilmiş versiyonlarıydı ancak inşayı hızlandırmak ve maliyetleri düşürmek için basitleştirilmiş bir tasarıma sahiplerdi. Gemiler selefleriyle aynı topları taşıyordu, 6 inç topların yer aldığı dört üçlü taret. Benzer şekilde zırhlanmışlardı ancak daha küçük motorlara sahip oldukları için menzilleri biraz daha düşüktü. Fiji ve Ceylon olmak üzere iki alt sınıfı vardı."
 RAJ_light_cruiser_4:0 "Minotaur Sınıfı"
 RAJ_light_cruiser_4_desc:0 "Swiftsure sınıfı olarak da bilinen bu kruvazörler, Crown Colony sınıfının modifiye edilmiş bir versiyonu olarak tasarlandı ve 1941'de onaylanan savaş modifikasyonlarını içeriyordu. Crown Colony sınıfına kıyasla daha uzun operasyonel menzile ve daha fazla uçaksavar silahına sahiplerdi, ancak ana silahları üç üçlü tarette toplanmıştı. Savaşın sonucunu etkileyecek kadar geç inşa edildikleri için sipariş edilen gemilerin çoğu iptal edildi."
 RAJ_submarine_1:0 "L Sınıfı"
 RAJ_submarine_1_desc:0 "L sınıfı denizaltılar, Acil Savaş Programı kapsamında önceki denizaltı sınıflarının geliştirilmiş versiyonu olarak tasarlanan orta boy teknelerdi. I. Dünya Savaşı'nın son aşamalarında inşa edildiler ve yeni, daha büyük 21 inç torpidolarla donatıldılar. II. Dünya Savaşı'nın başlangıcına kadar hizmet verdiler, çoğunlukla ikincil ve eğitim görevlerinde kullanıldılar."
 RAJ_submarine_2:0 "T Sınıfı"
 RAJ_submarine_2_desc:0 "T sınıfı veya Triton sınıfı denizaltılar, O, P ve R sınıfı büyük denizaltıların yerini almak üzere tasarlandı. Atlantik ve Pasifik Okyanusu'na uygun, uzun menzilli orta büyüklükte denizaltılardı. İyi silahlandırılmış ve stabil platformlardı, inşa edilen teknelerin yüzde 25'i savaş sırasında kaybedildi."
 RAJ_submarine_3:0 "U Sınıfı"
 RAJ_submarine_3_desc:0 "U sınıfı, 1940 ve 1941 Savaş Acil Durum Programları kapsamında inşa edilen küçük boyutlu denizaltılardı. Başlangıçta eğitim denizaltısı olarak tasarlanmışlardı ancak savaşın başlamasıyla tasarım değiştirildi ve Kuzey Denizi ile Akdeniz'in sınırlı sularında kullanışlı olduklarını kanıtladılar. Küçük boyutları nedeniyle menzilleri ve silahları sınırlıydı. Undine, Umpire ve Uproar olmak üzere üç alt sınıftan oluşuyorlardı."
 RAJ_submarine_4:0 "V Sınıfı"
 RAJ_submarine_4_desc:0 "V sınıfı veya Vampir sınıfı denizaltılar, önceki U sınıfı küçük boyutlu tekneler temel alınarak geliştirildi. Daha büyük ancak yine de nispeten küçük boyutluydular, daha iyi denizcilik kabiliyetine sahiplerdi ancak operasyonel menzil ve silahlanma açısından sınırlıydılar."
 ROM_destroyer_1:0 "Marasti Sınıfı"
 ROM_destroyer_1_desc:0 "Marasti sınıfı, I. Dünya Savaşı sırasında Romanya için inşa edilen bir muhrip sınıfıydı. Sınıfın dört gemisi savaş sırasında İtalyan Donanması tarafından el konuldu ve ikisi 1920'lerin başında Romanya'ya satıldı. Büyük muhriplerdi, 1.400 tonun üzerinde deplasmana sahiplerdi. Dört adet 120mm/45 Schneider-Canet-Armstrong topu ve dört adet 450mm torpido tüpüyle donatılmışlardı. Dönemleri ve boyutları için ortalama hız ve güvenilirliğe sahiplerdi."
 ROM_submarine_1:0 "Delfinul Sınıfı"
 ROM_submarine_1_desc:0 "Delfinul, Romanya Donanması için İtalya'da inşa edilen bir Romanya denizaltısıydı. 1930'da denize indirildi ve 650 ton deplasmana ve altı adet 533mm torpido tüpüne sahipti."
 ROM_submarine_3:0 "Requinul Sınıfı"
 ROM_submarine_3_desc:0 "Requinul ve Marsuinul denizaltıları, Alman müttefikleri için Almanlar tarafından inşa edildi. 1943'te hizmete girdiler. Gemiler Alman Tip VII denizaltıları temel alınarak geliştirilmişti. Orta boy denizaltılardı, 600 ton deplasmana ve altı adet 533mm torpido tüpüne sahiplerdi."
 SAF_SH_battleship_1:0 "Centurion Sınıfı"
 SAF_SH_battleship_1_desc:0 "Centurion, Alman ve Japon donanmalarının büyük gemilerine karşı koymak için Kraliyet Donanması tarafından inşa edilen varsayımsal bir ağır zırhlı sınıfıydı. Büyük 18 inç toplar ve kalın zırh, gemiye bu gemilerle savaşmak için gerekli ateş gücünü ve korumayı sağlıyordu. Güçlü uçaksavar silahları, uzun menzil ve iyi hız, Britanya İmparatorluğu'nun geniş denizlerini korumak için bir gereklilikti."
 SAF_SH_battleship_2:0 "Aslan II Sınıfı"
 SAF_SH_battleship_2_desc:0 "Aslan II sınıfı zırhlılar, önceki Aslan sınıfı zırhlının geliştirilmiş bir versiyonu olarak 1944'te tasarlandı. Savaş deneyimlerini içeren bu tasarım daha büyük ve ağırdı ve tamamlanabilseydi, en yeni model üçlü veya dörtlü 16 inç toplar taşıyacaktı. Kalın zırhlı plakalar gemiyi her türlü yüzey ve hava tehdidine karşı koruyordu. Bu gemilerin inşa maliyeti, düşman donanmalarının yenilgisi ve uçak gemilerine duyulan ihtiyaç projenin iptal edilmesine yol açtı."
 SAF_battle_cruiser_1:0 "Renown Sınıfı"
 SAF_battle_cruiser_1_desc:0 "Renown sınıfı muharebe kruvazörleri, başlangıçta Revenge sınıfı zırhlıların geliştirilmiş versiyonları olarak kızağa konmuştu. I. Dünya Savaşı'nın patlak vermesi üzerine inşaları durduruldu. Amiral Lord Fisher, inşalarını muharebe kruvazörü olarak yeniden başlatmayı başardı. Bu gemiler tipik muharebe kruvazörleriydi. İyi silahlanmış, hızlı ve manevra kabiliyeti yüksek gemilerdi ancak daha ince zırha ve daha kısa operasyonel menzile sahiplerdi. Orijinal üç gemiden sadece ikisi, Repulse ve Renown tamamlandı."
 SAF_battle_cruiser_2:0 "Princess Royal Sınıfı"
 SAF_battle_cruiser_2_desc:0 "Princess Royal, King George V sınıfı zırhlıların daha hızlı ve daha ucuz bir versiyonu olan varsayımsal muharebe kruvazörleri sınıfıydı. Bu gemiler, hem yüzey hem de uçaksavar savaşı için benzer ancak azaltılmış bir silahlanma taşıyordu: iki üçlü 14 inç top ve altı ikiz 5.25 inç uçaksavar topu. Yüksek hızları ve uzun menzilleri Kraliyet Donanması'na hızlı taarruz yeteneği ve konvoy koruması sağlayacaktı ancak sınırlı zırhları modern zırhlılarla savaşmak zorunda kalırlarda sorun yaratacaktı."
 SAF_battleship_1:0 "Revenge Sınıfı"
 SAF_battleship_1_desc:0 "Revenge sınıfı savaş gemileri, 1913'te Queen Elizabeth sınıfı hızlı dreadnoughtların ucuz versiyonları olarak sipariş edildi. Benzer şekilde silahlanmış ve zırhlanmış olmalarına rağmen, önemli ölçüde daha düşük hızları onları II. Dünya Savaşı sırasında ikincil görevlere mahkum etti. Sınıfın planlanan 8 gemisinden sadece 5'i tamamlandı."
 SAF_battleship_2:0 "Kral George V Sınıfı"
 SAF_battleship_2_desc:0 "Kral George V sınıfı zırhlılar, 1922 Washington ve 1930 Londra Deniz Antlaşmaları'nın ana gemilerin deplasman ve top boyutunu sınırlaması sonucu ortaya çıktı. Bu nedenle, bu gemiler önceki ve çağdaşı zırhlılara kıyasla daha küçük çaplı toplarla donatıldı. Daha küçük çaplı olmalarına rağmen yeterli silahlandırma, güçlü uçaksavar savunması ve yeterli korumaya sahiptiler. Eski Queen Elizabeth sınıfının yerine 5 gemi inşa edildi."
 SAF_battleship_3:0 "Aslan Sınıfı"
 SAF_battleship_3_desc:0 "Aslan sınıfı zırhlılar, Kral George V zırhlılarının halefi olarak tasarlandı ve birçok özelliğini miras aldı. 1938 Donanma Programı kapsamında yaşlanan İntikam sınıfının yerine 6 gemi sipariş edildi ancak savaşın patlak vermesi nedeniyle hiçbiri tamamlanamadı. Bu gemiler genel olarak Kral George sınıfına benzer olacaktı, ancak ana silahları daha ağır olacak ve yeni 16 inç toplar kullanacaktı. Ayrıca daha kalın zırh ve daha güçlü motorlara sahip olacaklardı."
 SAF_battleship_4:0 "Vanguard Sınıfı"
 SAF_battleship_4_desc:0 "Vanguard sınıfı zırhlı, Kraliyet Donanması için inşa edilen son zırhlıydı. Tek bir gemi sipariş edildi ancak Pasifik cephesi için dört gemi daha düşünüldü. 1940 Acil Savaş Programı kapsamında sipariş edilen gemi yüksek öncelikli olmadığı için savaştan sonra tamamlandı. Sınıfın aerodinamik gövdesi mükemmel stabilite ve deniz tutuşu sağlıyordu. Silah donanımı Queen Elizabeth ve Revenge sınıfı zırhlılarla aynıydı, önemli bir ateş gücü sunuyordu. Güçlü motorlar ve iyi zırh koruması gemiyi hızlı ve iyi korunaklı yapıyordu."
 SAF_carrier_1:0 "Courageous Sınıfı"
 SAF_carrier_1_desc:0 "Bu üç uçak gemisi, muharebe kruvazörlerinden dönüştürülmüştü ve Kraliyet Donanması'nın ilk filo gemileriydi. Dönüşümleri 1922 Washington Deniz Antlaşması'nın sonucuydu ve çalışmalar 1925'te tamamlandı. Orta düzeyde zırha ancak iyi silahlara sahip gemilerdi, uzun menzilli ve iyi hızlıydılar ancak dönüşümün doğası gereği uçak kapasiteleri sınırlıydı. Yine de, Kraliyet Donanması'na uçak gemisi inşası ve filo hava projeksiyonu konusunda önemli deneyim kazandırdılar."
 SAF_carrier_2:0 "Ark Royal Sınıfı"
 SAF_carrier_2_desc:0 "Ark Royal uçak gemisi, Washington Denizcilik Antlaşması'nın kısıtlamalarına uyacak şekilde inşa edilen ilk gemidi. Hangarların ve uçuş güvertesinin geminin gövdesinin ayrılmaz bir parçası olduğu ilk gemiydi. 1934'te tasarlanan gemi iyi zırhlı ve silahlanmıştı. Kraliyet Donanması'nın ana kuvvetlerine ayak uydurabilmek için büyük bir uçak desteği ve yeterli operasyonel menzil ve hıza sahipti."
 SAF_carrier_3:0 "Illustrious Sınıfı"
 SAF_carrier_3_desc:0 "Illustrious sınıfı, 1936 İkinci Londra Deniz Antlaşması'nın uçak gemisi boyutunu üst sınır olarak 23.000 tonla sınırlandırması dahilinde tasarlandı. Zırhlı uçuş güvertesine sahip ilk İngiliz uçak gemisiydi, bu da taşıdığı hava grubu boyutunu azalttı. Ağır zırh ve uçaksavar silahları gemilere güçlü bir savunma sağlarken, güçlü motorlar ve büyük yakıt deposu gemilere uzun operasyonel menzil sağlıyordu."
 SAF_carrier_4:0 "Implacable Sınıfı"
 SAF_carrier_4_desc:0 "Implacable sınıfı uçak gemileri, 1938 Deniz Programı kapsamında sipariş edildi ve esasen önceki Illustrious sınıfının iyileştirilmiş versiyonlarıydı. Savaş ve savaşın erken ve orta aşamalarında konvoy koruma görevleri için daha küçük gemilere öncelik verilmesi, bu gemilerin inşasını yavaşlattı. Daha büyük gemilerdi, gövde ve uçuş güvertesinde kalın zırh korurken daha fazla uçak taşıyabiliyorlardı. Daha güçlü motorlar, Illustrious sınıfına kıyasla daha yüksek hız ve operasyonel menzil sağlıyordu."
 SAF_destroyer_1:0 "V/W Sınıfı"
 SAF_destroyer_1_desc:0 "Bu muhripler, Amiralite ve Thornycroft V ve W sınıflarını içeriyordu. Savaş Acil Durum Programı kapsamında inşa edildiler. I. Dünya Savaşı sırasında İngiliz muhrip tasarımının nihai evrimiydiler, seleflerinin iyileştirmelerini ve yeni teknolojik gelişmeleri bünyelerinde barındırıyorlardı. Savaşın son aşamalarında çok sayıda inşa edildiler ve sonrasında Kraliyet Donanması'nın muhrip filotillalarının belkemiği haline geldiler. 1930'lardan itibaren yedek filolara alındılar ve sonunda konvoy eskort görevlerine verildiler. Yeterli silahlanmaya, yüksek hıza ve iyi menzile sahip gemilerdi."
 SAF_destroyer_2:0 "G/H/I Sınıfı"
 SAF_destroyer_2_desc:0 "G, H ve I sınıfı muhripler, 1933 ve 1934 Deniz İnşa Programları'nın bir parçası olarak sipariş edildi. Genel olarak önceki F sınıfının tekrarlarıydı, boyutlarında hafif bir küçülme vardı. G ve H sınıflarının silahlanması F sınıfıyla aynıydı, her ikisi de 4.7 inç toplar kullanıyordu. Bu gemiler uzun menzilli, yeterli silahlanmaya ve güçlü bir torpido desteğine sahipti. Savaş boyunca yoğun şekilde kullanıldılar ve çok sayıda kayıp verdiler."
 SAF_destroyer_3:0 "J/K/N Sınıfı"
 SAF_destroyer_3_desc:0 "J, K ve N sınıfları, önceki Tribal sınıfına benziyordu ancak topçu silahlanmasını vurgulamak yerine, tasarımcılar daha standart bir ağır torpido ve hafif top düzenine geri döndüler. Gemiler savaş boyunca çeşitli modifikasyonlar geçirdi. Yükseltmeler arasında geliştirilmiş uçaksavar topları ve radar vardı. Filo eskortları için ideal, hızlı, uzun menzilli ve iyi silahlanmış gemilerdi."
 SAF_destroyer_4:0 "Muharebe Sınıfı"
 SAF_destroyer_4_desc:0 "Muharebe sınıfı muhripler, savaş boyunca kullanılan İngiliz muhriplerinin evrimini temel aldı. Gemiler 1942 ve 1943 Deniz Programları'nın bir parçası olarak sipariş edildi. Hem topları hem de torpidoları açısından iyi silahlanmışlardı. Uçaksavar silahlanması, denizaltı savunma kabiliyetleri, hızları ve menzilleri onları çok yönlü gemiler yapıyordu. Savaşa geç katılmaları nedeniyle katkıları minimal düzeyde kaldı."
 SAF_heavy_cruiser_1:0 "Hawkins Sınıfı"
 SAF_heavy_cruiser_1_desc:0 "Hawkins sınıfı kruvazörler dünyanın ilk ağır kruvazörleriydi. Önceki Town sınıfı hafif kruvazörler, özellikle Birmingham alt sınıfı temel alınarak geliştirilmişlerdi ancak 7.5 inç toplar ve daha kalın bir zırh kuşağı ile donatılmışlardı. Almanya'nın büyük konvoy akıncılarıyla savaşmak üzere tasarlanmışlardı. İyi silahlanmışlardı, makul hız ve menzile sahiplerdi ve iyi korunuyorlardı. Toplamda beş gemi hizmete girdi ancak sadece dördü II. Dünya Savaşı'nın başlangıcında aktif durumdaydı."
 SAF_heavy_cruiser_2:0 "Surrey Sınıfı"
 SAF_heavy_cruiser_2_desc:0 "Surrey sınıfı ağır kruvazörler, 1928 Deniz Programı kapsamında önerilmişti. Önceki York sınıfı ağır kruvazörlerin iyileştirilmiş versiyonlarıydı. Tamamlanmış olsalardı, dört adet ikiz 8 inç top taretine, daha ağır zırha ve daha güçlü motorlara sahip olacaklardı. İki gemi sipariş edildi ancak hiçbiri kızağa konmadı."
 SAF_heavy_cruiser_3:0 "Amiral Sınıfı"
 SAF_heavy_cruiser_3_desc:0 "Amiral sınıfı ağır kruvazörler (Amiral sınıfı muharebe kruvazörleri ile karıştırılmamalıdır), Kraliyet Donanması'nın 8 inç toplarla donatılmış kruvazörler tasarlama ve inşa etme konusundaki son girişimiydi. Tasarım çalışmaları 1938'de başladı ve 1941'de sona erdi, çeşitli önerilerle sonuçlandı. Son öneriler, üçlü taretlerde yeni 8 inç toplar, ağır uçaksavar silahlanması, kalın zırh ve iyi hız özelliklerine sahipti. Düşman kruvazörlerinin eksikliği ve bu gemilerin maliyet verimliliği, daha fazla hafif kruvazör inşa etmeye odaklanılmasına neden oldu."
 SAF_heavy_cruiser_4:0 "Churchill Tasarımı"
 SAF_heavy_cruiser_4_desc:0 "Bu gemiler, II. Dünya Savaşı'nın erken aşamalarında Alman Deutschland sınıfı büyük top kruvazörlerine karşı koymak için Denizcilik Bakanı Sir Winston Churchill tarafından önerilmişti. 9.2 inç toplara, ağır uçaksavar silahlanmasına ve güçlü zırha sahip olacaklardı. Düşman başkent gemileriyle etkili şekilde savaşmak üzere tasarlanmışlardı. Yüksek maliyetler ve yeni bir ağır kruvazöre duyulan ihtiyacın azlığı nedeniyle gemilerin inşası iptal edildi."
 SAF_light_cruiser_1:0 "C Sınıfı"
 SAF_light_cruiser_1_desc:0 "C sınıfı hafif kruvazörler, Kraliyet Donanması'na ait yirmi sekiz hafif kruvazörden oluşan bir gruptu. I. Dünya Savaşı öncesinde ve sırasında Kuzey Denizi'nin zorlu koşulları için inşa edildiler. Nispeten küçük ve dar olmalarına rağmen sağlam ve yetenekli gemiler olduklarını kanıtladılar. Silahlanmaları oldukça tatmin ediciydi, düşman yüzey hedefleriyle savaşmak için yeterli sayıda 6 inç top ve ağır bir torpido yükü taşıyorlardı. I. Dünya Savaşı sırasında yoğun şekilde kullanıldılar ve birçok yüzey muharebesine katıldılar. 1930'ların ortalarında sadece Caledon, Ceres ve Carlisle alt sınıfları hizmetteydi."
 SAF_light_cruiser_2:0 "Southampton Sınıfı"
 SAF_light_cruiser_2_desc:0 "Southampton sınıfı hafif kruvazörler, Town sınıfı kruvazörlerin bir alt sınıfıydı ve Japon Mogami sınıfı kruvazörlere karşı koymak üzere tasarlanmışlardı. Bu gemiler iyi zırhlanmıştı, iyi hıza ve menzile sahipti ve dört üçlü tarette on iki adet 6 inç toptan oluşan güçlü bir silahlanma taşıyorlardı. Sonraki Kraliyet Donanması savaş dönemi hafif kruvazör tasarımlarının temelini oluşturdular."
 SAF_light_cruiser_3:0 "Crown Colony Sınıfı"
 SAF_light_cruiser_3_desc:0 "Crown Colony sınıfı hafif kruvazörler, önceki Town sınıfının iyileştirilmiş versiyonlarıydı ancak inşayı hızlandırmak ve maliyetleri düşürmek için basitleştirilmiş bir tasarıma sahiplerdi. Gemiler selefleriyle aynı topları taşıyordu, 6 inç topların yer aldığı dört üçlü taret. Benzer şekilde zırhlanmışlardı ancak daha küçük motorlara sahip oldukları için menzilleri biraz daha düşüktü. Fiji ve Ceylon olmak üzere iki alt sınıfı vardı."
 SAF_light_cruiser_4:0 "Minotaur Sınıfı"
 SAF_light_cruiser_4_desc:0 "Swiftsure sınıfı olarak da bilinen bu kruvazörler, Crown Colony sınıfının modifiye edilmiş bir versiyonu olarak tasarlandı ve 1941'de onaylanan savaş modifikasyonlarını içeriyordu. Crown Colony sınıfına kıyasla daha uzun operasyonel menzile ve daha fazla uçaksavar silahına sahiplerdi, ancak ana silahları üç üçlü tarette toplanmıştı. Savaşın sonucunu etkileyecek kadar geç inşa edildikleri için sipariş edilen gemilerin çoğu iptal edildi."
 SAF_submarine_1:0 "L Sınıfı"
 SAF_submarine_1_desc:0 "L sınıfı denizaltılar, Acil Savaş Programı kapsamında önceki denizaltı sınıflarının geliştirilmiş versiyonu olarak tasarlanan orta boy teknelerdi. I. Dünya Savaşı'nın son aşamalarında inşa edildiler ve yeni, daha büyük 21 inç torpidolarla donatıldılar. II. Dünya Savaşı'nın başlangıcına kadar hizmet verdiler, çoğunlukla ikincil ve eğitim görevlerinde kullanıldılar."
 SAF_submarine_2:0 "T Sınıfı"
 SAF_submarine_2_desc:0 "T sınıfı veya Triton sınıfı denizaltılar, O, P ve R sınıfı büyük denizaltıların yerini almak üzere tasarlandı. Atlantik ve Pasifik Okyanusu'na uygun, uzun menzilli orta büyüklükte denizaltılardı. İyi silahlandırılmış ve stabil platformlardı, inşa edilen teknelerin yüzde 25'i savaş sırasında kaybedildi."
 SAF_submarine_3:0 "U Sınıfı"
 SAF_submarine_3_desc:0 "U sınıfı, 1940 ve 1941 Savaş Acil Durum Programları kapsamında inşa edilen küçük boyutlu denizaltılardı. Başlangıçta eğitim denizaltısı olarak tasarlanmışlardı ancak savaşın başlamasıyla tasarım değiştirildi ve Kuzey Denizi ile Akdeniz'in sınırlı sularında kullanışlı olduklarını kanıtladılar. Küçük boyutları nedeniyle menzilleri ve silahları sınırlıydı. Undine, Umpire ve Uproar olmak üzere üç alt sınıftan oluşuyorlardı."
 SAF_submarine_4:0 "V Sınıfı"
 SAF_submarine_4_desc:0 "V sınıfı veya Vampir sınıfı denizaltılar, önceki U sınıfı küçük boyutlu tekneler temel alınarak geliştirildi. Daha büyük ancak yine de nispeten küçük boyutluydular, daha iyi denizcilik kabiliyetine sahiplerdi ancak operasyonel menzil ve silahlanma açısından sınırlıydılar."
 SH_battleship_1:0 "Süper Ağır Savaş Gemisi I"
 SH_battleship_1_desc:0 "Dünyanın mevcut durumu, deniz anlaşmalarına uymak için artık hiçbir yer bırakmıyor. Bu sınırlamalar olmadan, tamamen şimdiye kadarki en ağır, en iyi silahlandırılmış savaş gemilerini yaratmaya odaklanabiliriz, birden fazla daha küçük gemiyi etkisiz hale getirebilen."
 SH_battleship_2:0 "Süper Ağır Savaş Gemisi II"
 SH_battleship_2_desc:0 "Daha güçlü silahlar ve geliştirilmiş ateş kontrol sistemleriyle önceki süper ağır tasarımımızın bir iyileştirmesi."
 SIA_destroyer_1:0 "Phra Ruang Sınıfı"
 SIA_destroyer_1_desc:0 "Phra Ruang, 1920'de Tayland Donanması'na satılan eski bir İngiliz R sınıfı muhripti. Gemi sadece 1.000 tonun biraz üzerinde deplasmana sahipti ve ana silahı olarak üç 120mm/45 QF Mk IV topu ve dört 533mm torpido tüpü taşıyordu. Dönemine göre iyi hız, menzil ve güvenilirliğe sahipti."
 SIA_heavy_cruiser_1:0 "Sri Ayuthia Sınıfı"
 SIA_heavy_cruiser_1_desc:0 "Sri Ayuthia sınıfı sahil savunma gemileri, muhtemelen dünyada bu türde inşa edilen son gemilerdi ve sınıfın her iki gemisi de Japonya'da inşa edilmiş ve 1938'de Tayland Donanması için hizmete girmişti. Tasarım olarak boyutta küçük bir kruvazöre (veya büyük bir muhripe), hızda bir zırhlıya ve silahlandırmada bir ağır kruvazöre benziyordu. Ana topları dört 203mm/53 3-Shiki topuydu. Çağdaşı ağır kruvazörlere kıyasla daha hafif zırhlıydılar."
 SIA_light_cruiser_3:0 "Taskin Sınıfı"
 SIA_light_cruiser_3_desc:0 "Taskin sınıfı, İtalya'da inşa edilen bir çift hafif kruvazörden oluşuyordu. 1941'de denize indirildiler ancak 1942'de Tayland donanması tarafından el konuldu. Aslında İtalyan Regia Marina için Etna sınıfı uçaksavar kruvazörleri olacaklardı ancak İtalyan ateşkesinden önce hiçbiri tamamlanamadı. 5.900 ton deplasmana sahip olacaklardı ve ana silahları altı 152mm/53 OTO 1929 topundan oluşacaktı. Bir kruvazör için oldukça yavaş olmalarına rağmen yeterli zırha sahip olacaklardı."
 SIA_submarine_2:0 "Vilun Sınıfı"
 SIA_submarine_2_desc:0 "Vilun sınıfı denizaltılar, 1936-1938 yılları arasında Japonya'da Tayland Donanması için inşa edilen dört küçük sahil denizaltısıydı. 370 ton deplasmana sahiplerdi ve beş 533mm torpido tüpüyle donatılmışlardı."
 SOV_SH_battleship_1:0 "Sovetsky Soyuz Sınıfı"
 SOV_SH_battleship_1_desc:0 "Sovetsky Soyuz sınıfı (Proje 23), Sovyet tersaneleri tarafından inşa edilen son savaş gemisi sınıfıydı ve 1938-43 gemi inşa programı kapsamında onaylandı. Dört gemi planlandı ve standart deplasmanları 59.000 tondu, üç üçlü tarette 406 mm toplar ve ağır ikincil ve uçaksavar silahlanması taşıyordu. Ayrıca çok kalın kuşak zırhını desteklemek için güçlü motorlara sahipti. Savaşın patlak vermesi, bu gemilerin tamamlanmasını engelledi."
 SOV_SH_battleship_2:0 "Proje 23bis"
 SOV_SH_battleship_2_desc:0 "Proje 23bis sınıfı savaş gemileri, önceki Sovetsky Soyuz sınıfının (Proje 23) modifiye ve geliştirilmiş bir versiyonuydu. Öncüllerine kıyasla, aynı 406 mm kalibreli dört üçlü taret, kalınlaştırılmış kuşak zırhı, yeniden düzenlenmiş ikincil top düzeni ve daha güçlü uçaksavar silahlanması taşıyordu."
 SOV_battle_cruiser_1:0 "Borodino Sınıfı"
 SOV_battle_cruiser_1_desc:0 "Borodino sınıfı muharebe kruvazörleri, I. Dünya Savaşı öncesinde 1914'te onaylanan dört gemiden oluşan bir sınıftı. Imperatritsa Mariya sınıfı savaş gemilerine dayanıyordu. Ağır ana silahlanmayı barındırmak için dört üçlü taret, kazamatlarda güçlü ikincil silahlanma ve genel flush-deck yapısıyla çağdaş Rus ana gemi inşa uygulamalarını takip ettiler. Baltık Denizi'nin sığ sularında savaşmak için düşük bir profile ve düşük su çekimine sahipti. Bu dönemin birçok Rus gemisi gibi, I. Dünya Savaşı'nın patlak vermesi ve Rus Devrimi, bu gemilerin asla tamamlanamamasına neden oldu."
 SOV_battle_cruiser_2:0 "Kronshtadt Sınıfı"
 SOV_battle_cruiser_2_desc:0 "Kronshtadt sınıfı (Proje 69) muharebe kruvazörleri, 1938-43 gemi inşa programı kapsamında onaylandı ve 1940'larda tamamlanması planlandı. Orijinal tasarım, 23.000 ton deplasmana sahip büyük boyutlu bir ağır kruvazör hedefliyordu, ancak Alman Scharnhorst muharebe kruvazörleri hakkında bilgi geldikten sonra gemiler 35.000 ton deplasmana çıkarılmak üzere yeniden tasarlandı. Almanya ve Sovyetler Birliği arasında düşmanlıklar patlak verince, gemilerin inşası durduruldu ve sonunda iptal edildi. Alternatif planlar, tamamlanmamış gövdelerin Proje 69AV altında uçak gemisi olarak tamamlanmasını öngörüyordu."
 SOV_battleship_1:0 "Marat Sınıfı"
 SOV_battleship_1_desc:0 "Marat sınıfı savaş gemileri (orijinalde Gangut sınıfı), I. Dünya Savaşı dönemi savaş gemileriydi ve Rus İmparatorluk Donanması'nda hizmet veren ilk Dretnotlardı. Tasarımları ve taret düzeni, sonraki tüm savaş gemisi ve muharebe kruvazörü sınıfları için temel oluşturdu. Rus Devrimi'nin kaosundan yalnızca üç gemi kurtuldu. 1930'larda modernize edildi ve yenilendi, bu da neredeyse pagoda benzeri yüksek bir üst yapıyla sonuçlandı. Modern elektroniklere ve güçlü bir uçaksavar desteğine sahipti."
 SOV_battleship_2:0 "Proje 21"
 SOV_battleship_2_desc:0 "Proje 21 savaş gemileri, 1930'ların ortalarında Stalin'in Okyanus Donanması'nın bir parçası olarak tasarlandı. İngiliz Nelson sınıfı savaş gemilerine çok benziyordu. Gemiler yaklaşık 41.000 ton deplasmana sahip olacak, 3 üçlü tarette (hepsi önde) dokuz adet 406 mm top ve on iki adet 152 mm toptan oluşan ikincil bir silahlanma taşıyacaktı. İyi uçaksavar silahlanması ve kalın zırhı, hava ve yüzey hedeflerine karşı güçlü bir savunma sağlıyordu. Proje sonunda iptal edildi ancak bazı unsurları Sovetsky Soyuz sınıfı (Proje 23) savaş gemilerinde kullanıldı."
 SOV_battleship_3:0 "Lenin Sınıfı"
 SOV_battleship_3_desc:0 "Lenin sınıfı savaş gemisi, Alman Bismarck ve ABD South Dakota sınıfı savaş gemilerine denk gelmek ve karşı koymak için varsayımsal bir tasarımdı. 3 üçlü tarette dokuz adet 406 mm top yeterli ateş gücü sağlarken, 130 mm uçaksavar topları, kalın zırhı ve büyük motorları savaşta hayatta kalmasını sağlayacaktı."
 SOV_battleship_4:0 "Stalingrad Sınıfı"
 SOV_battleship_4_desc:0 "Stalingrad sınıfı (Proje 82) ana gemileri, Sovyet donanmasına II. Dünya Savaşı sonrası dönemde birincil ateş gücünü sağlamak amacıyla tasarlandı. Hızlı, iyi silahlanmış ve iyi zırhlı gemilerdi. İnşası savaş sonrasında başladı, ancak Josif Stalin'in ölümü bu gemilerin iptal edilmesine neden oldu, ancak en az bir tanesinin Sovyet V-2 füzeleriyle donatılmış modifiye bir tasarımla tamamlanması için projeler vardı."
 SOV_carrier_1:0 "Ismail Sınıfı"
 SOV_carrier_1_desc:0 "Ismail sınıfı uçak gemisi, Borodino sınıfı muharebe kruvazörünün tamamlanmamış gövdesinin doğrudan dönüştürülmesiyle oluşturuldu. Dönüşümün doğası gereği, gemi dönemi için kalın bir zırh kuşağına ve güçlü bir yüzey ve uçaksavar silahlanmasına sahip olacaktı. Orta boyutlu bir hava grubu, filosuna gerekli hava örtüsünü sağlayacaktı. Proje, maliyetler ve Ekim Devrimi sonrası Sovyet gemi inşa endüstrisinin durumu nedeniyle gerçekleştirilmedi."
 SOV_carrier_2:0 "Krasnyi Vozdukh"
 SOV_carrier_2_desc:0 "Krasnyi Vozdukh sınıfı uçak gemisi, Sovyet donanmasına filoları üzerinde hava projeksiyonu sağlamak için varsayımsal bir tasarımdı. Boyut olarak İngiliz Ark Royal veya Japon Hiryu sınıflarına benziyordu ancak yüzey hedeflerine karşı ek ikincil toplar ve hava örtüsü için yeterli uçaksavar topları taşıyordu. Artırılmış zırh, bu sınıflara kıyasla biraz daha küçük bir hava grubuyla sonuçlandı."
 SOV_carrier_3:0 "Proje 71B"
 SOV_carrier_3_desc:0 "Proje 71B uçak gemileri, 1930'ların ortalarında ve sonlarında tasarlandı. Stalin'in planında emrettiği yeni yüzey filolarına hava örtüsü sağlamak için planlandı. 30.000 ton deplasmana sahip iki gemi planlandı, güçlü uçaksavar silahlanması, iyi zırh ve yeterli bir hava grubuna sahip olacaktı. Alman işgali, bu gemilerin inşasının iptal edilmesine neden oldu."
 SOV_carrier_4:0 "Proje 72"
 SOV_carrier_4_desc:0 "Proje 72 uçak gemileri, önceki Proje 71 gemilerinin geliştirilmiş versiyonlarıydı. Tasarım çalışmaları 1940'ların başında tamamlandı ve daha ince zırha sahip daha büyük bir gemi ortaya çıktı. Ekstra alan, daha güçlü uçaksavar silahlanması kurmak ve daha büyük bir hava grubu taşıma yeteneği sağlamak için kullanıldı."
 SOV_destroyer_1:0 "Orfey Sınıfı"
 SOV_destroyer_1_desc:0 "Orfey sınıfı destroyerler, önceki Novik sınıfının geliştirilmiş bir versiyonuydu. Boyutlarına göre yeterli yüzey ve uçaksavar silahlanmasına sahipti, menzilleri biraz kısaydı ancak iyi hız ve ağır torpido silahlanmasına sahipti. Ardılları olan Fidonisy ve Izyaslav sınıfları, ana silahlanması ve gövde boyutu artırılmış daha da geliştirilmiş versiyonlardı."
 SOV_destroyer_2:0 "Gnevny Sınıfı"
 SOV_destroyer_2_desc:0 "Gnevny sınıfı (Proje 7) destroyerleri, 1933-1938 gemi inşa programı kapsamında onaylandı. Sınıf, İtalyan destroyeri Maestrale'den büyük ölçüde etkilenmişti ve başarılı bir tasarım olarak kabul edildi. Deplasmanları 1.600-2.000 ton aralığındaydı, iyi silahlanmışlardı ve yeterli uçaksavar ve torpido silahlanmasına sahipti. Güçlü motorlar sayesinde hızlı ancak kısa menzilli gemilerdi."
 SOV_destroyer_3:0 "Soobrazitelnyi Sınıfı"
 SOV_destroyer_3_desc:0 "Soobrazitelnyi (Proje 7U) destroyerleri, önceki Gnevny sınıfının geliştirilmiş bir versiyonuydu. Motorları yeniden tasarlandı ve daha güçlü bir uçaksavar silahlanmasına sahipti. Deplasmanları 1.900 ila 2.400 ton arasındaydı ve hızları ile menzilleri Gnevny sınıfına benziyordu."
 SOV_destroyer_4:0 "Skoryi Sınıfı"
 SOV_destroyer_4_desc:0 "Skoryi sınıfı (Proje 30bis), Ognevoy sınıfının daha da geliştirilmiş bir versiyonuydu. Boyut ve deplasmandaki artış (2.500-3.100 ton), daha stabil bir gemi ve artırılmış operasyonel menzil ile sonuçlandı. Tüm gemiler, modüler bir tasarıma göre savaş sonrasında inşa edildi ve bu da hızlı inşa ve konuşlandırma süreleri sağladı. Silahlanmaları önceki Ognevoy sınıfıyla aynıydı, ancak ana toplar tek kuleler yerine ikiz kulelerde yer alıyordu."
 SOV_heavy_cruiser_1:0 "Krasniy Kavkaz Sınıfı"
 SOV_heavy_cruiser_1_desc:0 "Krasnyi Kavkaz kruvazörü, orijinalde Admiral Nakhimov sınıfı hafif kruvazör olarak Chervona Ukraina'nın yarı kardeşiydi. Krasnyi Kavkaz, daha büyük kalibreli 180 mm toplar ve daha güçlü uçaksavar silahlanması içeren modifiye bir tasarımla tamamlandı. Yeniden inşa edilmiş bir hafif kruvazör olduğu için, zırhı diğer donanmaların ağır kruvazörlerine kıyasla daha inceydi."
 SOV_heavy_cruiser_2:0 "Kirov Sınıfı"
 SOV_heavy_cruiser_2_desc:0 "Kirov sınıfı (Proje 26) kruvazörleri, Sovyet Donanması'nın ilk modern kruvazörleriydi. Tasarım, İtalyan Raimondo Montecuccoli sınıfı hafif kruvazörlerine dayanıyordu ve 1933-1938 gemi inşa programının bir parçası olarak inşa edildi. Gemiler 7.700 ila 9.200 ton deplasmana sahipti. 3 üçlü tarette yeni 180 mm toplar ve sağlam bir uçaksavar bataryasıyla silahlanmıştı. Güçlü motorları iyi bir hız ve kabul edilebilir bir operasyonel menzil sağlarken, zırh kuşağı diğer ağır kruvazörlere kıyasla inceydi."
 SOV_heavy_cruiser_3:0 "Proje 22"
 SOV_heavy_cruiser_3_desc:0 "Proje 22 ağır kruvazörleri, 1930'ların ortalarında komşu ülkelerdeki benzer gemilere karşı koymak için tasarlandı. Tasarım, 15.500 ila 17.000 ton deplasmana sahip daha büyük boyutlu bir gemi çağrısında bulundu. Düşman kruvazörleriyle savaşmak için dört üçlü 240 mm top, kendini savunma için ağır uçaksavar silahlanması ve düşmanı bulmak için daha büyük bir keşif uçağı gücüyle donatıldı. Ana görevleri, düşman kuvvetlerini keşfetmek ve konvoy avlamaktı. Gemilerin maliyeti ve kaynakların diğer ihtiyaçlara ayrılması, projenin iptal edilmesine neden oldu."
 SOV_heavy_cruiser_4:0 "Proje 66"
 SOV_heavy_cruiser_4_desc:0 "Proje 66 ağır kruvazörleri, Sovyet Donanması'nın tamamen topçu kruvazörü tasarlama ve inşa etme konusundaki son girişimiydi. Tasarım çalışmaları 1943'te başladı ve son versiyon savaş sonrasında ortaya çıktı. Gemiler, 3 üçlü tarette 220 mm toplar ve güçlü bir uçaksavar silahlanmasına sahip olacaktı. Deplasman en az 26.500 ton olacaktı. Füze çağının başlaması ve Josef Stalin'in ölümü, projenin sonlandırılmasına neden oldu."
 SOV_light_cruiser_1:0 "Krasniy Krym Sınıfı"
 SOV_light_cruiser_1_desc:0 "Krasniy Krym sınıfı kruvazör, orijinalde Svetlana sınıfı kruvazör olarak I. Dünya Savaşı öncesinde inşasına başlanmıştı ancak savaş ve ardından gelen devrim, tüm sınıfın tamamlanmasını geciktirdi. 1920'lerin ortalarında, yarı kardeşi Chervona Ukraina (eski Admiral Nakhimov) ile birlikte Sovyet Donanması'na katıldı. Bu gemiler, Rus İmparatorluk Donanması'nın ilk türbin tahrikli kruvazörleriydi. Dönemleri için ağır silahlanmış ve iyi zırhlı kruvazörlerdi."
 SOV_light_cruiser_2:0 "Komsomolets Sınıfı"
 SOV_light_cruiser_2_desc:0 "Komsomolets sınıfı hafif kruvazörler, varsayımsal gemilerden oluşan bir seriydi. Eski ve yeni teknolojilerin bir karışımıydı. Svetlana ve Admiral Nakhimov sınıflarının tamamlanmamış gövdeleri kullanılarak gemi inşa maliyetleri düşürüldü. Daha küçük, destroyer kalibreli altı adet ikiz taret ve yeterli uçaksavar silahlanmasıyla donatılmışlardı, keşif ve destroyer filotilla lideri rolü için uygundu. Gemilerin genel görünümü, Kirov sınıfı kruvazörlerine benzerlik gösteriyordu."
 SOV_light_cruiser_3:0 "Chapayev Sınıfı"
 SOV_light_cruiser_3_desc:0 "Chapayev sınıfı (Proje 68) kruvazörleri, Kirov sınıfı (Proje 26) kruvazörlerine dayanıyordu ve 1938-43 gemi inşa programı kapsamında onaylandı. Sovyet donanmasının ilk gerçek hafif kruvazörleri olarak, güçlü bir yüzey ve uçaksavar silahlanmasının yanı sıra yeterli torpido silahlanmasına sahipti. Genel olarak, kalın bir zırh kuşağı, yüksek hız, iyi bir operasyonel menzil ve 10.500 ila 14.000 ton deplasmana sahip iyi gemilerdi. Savaş ve Alman kuvvetlerinin işgali nedeniyle, sınıfın birçok gemisi iptal edildi ve geri kalanları çatışmalar bittikten sonra tamamlandı."
 SOV_light_cruiser_4:0 "Sverdlov Sınıfı"
 SOV_light_cruiser_4_desc:0 "Sverdlov sınıfı kruvazörler (Proje 68bis), Sovyet Donanması'nın son topçu kruvazörleriydi ve önceki Chapayev sınıfının geliştirilmiş versiyonlarıydı. Chapayev'lere kıyasla, aynı ana silahlanma, makine ve zırh korumasına sahipti ancak daha fazla yakıt kapasitesi sayesinde daha uzun menzile, geliştirilmiş sualtı korumasına, artırılmış bir uçaksavar bataryasına ve biraz daha iyi denize elverişliliğe sahipti. Konvoy avlama ve ana gemi eskort rolleri için tasarlandılar. Füze çağının başlaması nedeniyle, birçok gemi iptal edildi veya tamamlanmadı."
 SOV_submarine_1:0 "AG Sınıfı"
 SOV_submarine_1_desc:0 "Amerikansky Golland (Amerikan Holland) sınıfı denizaltılar Kanada'da inşa edildi, ardından I. Dünya Savaşı sırasında Rusya'ya teslim edildi ve son olarak burada monte edildi. Başarılı Holland tipi denizaltıların doğrudan kopyasıydı. Dönemleri için iyi silahlanmış ve denizde iyi performans gösteren tekneler olarak tasarlandı."
 SOV_submarine_2:0 "Seri V Shchuka"
 SOV_submarine_2_desc:0 "Shchuka sınıfı Seri V denizaltıları, Sovyet Donanması'nın en çok sayıda ikinci denizaltılarıydı. Büyük sayıları, Sovyetler Birliği'nin dört filosuna (Karadeniz, Baltık, Kuzey ve Pasifik) konuşlandırılmalarından kaynaklanıyordu. Orta boy devriye denizaltılarıydı ve iyi torpido silahlanması ile denize elverişliliğe sahipti."
 SOV_submarine_3:0 "Seri XIV K-Sınıfı"
 SOV_submarine_3_desc:0 "Seri XIV denizaltıları, genişletilmiş menzile sahip büyük kruvazör denizaltılardı. Temelde Seri IV Pravda sınıfının geliştirilmiş bir versiyonuydu. Bu denizaltılar, hem yüzey topları hem de torpidolardan oluşan ağır bir silahlanmaya sahipti. Uzun menzilliydi ancak denize elverişlilikleri yalnızca tatmin edici seviyedeydi."
 SOV_submarine_4:0 "Proje 611"
 SOV_submarine_4_desc:0 "Proje 611 denizaltıları (NATO Kod Adı: Zulu), Sovyet Donanması'nın II. Dünya Savaşı sonrasında inşa ettiği ilk denizaltı sınıfıydı. Tasarımları Alman Tip XXI denizaltılarına dayanıyordu ve eski Seri XIV K sınıfı teknelerin yerini almak üzere tasarlanmıştı. Ağır torpido silahlanması ve uzun menzile sahip büyük, okyanus aşırı denizaltılardı. Ardılları olan Proje 613 (NATO Kod Adı: Whiskey) ve Proje 641 (NATO Kod Adı: Foxtrot) sınıfı denizaltılar için temel oluşturdular."
 SPA_battleship_1:0 "España Sınıfı"
 SPA_battleship_1_desc:0 "España sınıfı, başlangıçta I. Dünya Savaşı zamanında hizmete giren üç dreadnought zırhlısından oluşan bir sınıftı, ancak biri İspanyol İç Savaşı zamanında karaya oturmuştu. Diğer ikisi savaş sırasında kaybedildi. Bir zırhlı için oldukça küçüklerdi, sadece 15.400 tonun biraz üzerinde deplasmana sahiptiler. Bununla birlikte iyi zırh ve iyi hıza sahiptiler ve ana bataryaları sekiz 305mm/50 Vickers H topundan oluşuyordu."
 SPA_destroyer_1:0 "Alsedo Sınıfı"
 SPA_destroyer_1_desc:0 "Alsedo sınıfının üç muhribi, İspanya'da İspanyol Donanması için inşa edildi. İngiliz L sınıfı tasarımına dayanıyorlardı ve 1924-1925 yılları arasında hizmete girdiler. 1.040 tonun üzerinde deplasmana sahiptiler ve ana silahları olarak üç 102mm/45 Vickers Mk LA topu ve dört 450mm torpido tüpü taşıyorlardı. Dönemlerine göre iyi hız ve menzile sahiptiler."
 SPA_destroyer_2:0 "Churruca Sınıfı"
 SPA_destroyer_2_desc:0 "İspanyol Churruca sınıfı, 1925-1933 yılları arasında denize indirilen on altı muhripten oluşuyordu ve ikisi daha sonra Arjantin'e satıldı. Gemiler İngiliz S sınıfı muhripleri temel alınarak tasarlanmıştı ve İç Savaş sırasında İspanyol Donanması'nın belkemiğini oluşturuyordu. 1.500 tonun üzerinde deplasmana sahiptiler ve ana silahları beş 120mm/45 Vickers-Armstrong topu ve altı 533mm torpido tüpünden oluşuyordu. İyi hız ve mükemmel menzile sahiptiler."
 SPA_destroyer_4:0 "Álava Sınıfı"
 SPA_destroyer_4_desc:0 "Álava sınıfı muhripler, savaş sonrasında önceki Almirante Antequera sınıfının (ki bu da önceki Churruca sınıfının bir alt sınıfıydı) yükseltilmiş versiyonları olarak denize indirildi. 1.710 ton deplasmana sahiptiler ve ana topları olarak dört 120mm/45 Vickers-Armstrong Mk Fs taşıyorlardı. Hız ve menzilleri, üzerine inşa edildikleri önceki tasarımlarla karşılaştırılabilirdi."
 SPA_heavy_cruiser_1:0 "Princesa de Asturias Sınıfı"
 SPA_heavy_cruiser_1_desc:0 "Princesa de Asturias Sınıfı, yüzyıl dönümünde İspanyol Donanması için inşa edilen üç zırhlı kruvazörden oluşuyordu. Üçü de 1930'ların ortalarında ya hurdaya ayrıldı ya da batırıldı. İkiz 240mm Guillén M1896 ve sekiz 140mm/33 Schneider-Canet topuyla silahlandırılmışlardı. Ağır zırhlıydılar ancak standart bir ağır kruvazöre kıyasla biraz yavaştılar."
 SPA_heavy_cruiser_2:0 "Canarias Sınıfı"
 SPA_heavy_cruiser_2_desc:0 "Canarias sınıfının iki ağır kruvazörü, Washington Deniz Antlaşması'nın şartlarına uygun olarak inşa edildi. 1930'ların başında denize indirildiler ancak 1936 yılına kadar tamamlanamadılar. Yaklaşık 10.700 ton deplasmana sahiptiler ve iyi hıza sahiptiler. Nispeten hafif zırhlıydılar ancak ana silah olarak sekiz 203mm/50 Vickers-Armstrong Mk D topu taşıyorlardı."
 SPA_light_cruiser_1:0 "Méndez Núñes Sınıfı"
 SPA_light_cruiser_1_desc:0 "Méndez Núñes sınıfı hafif kruvazörler, 1920'lerin başında İspanyol Donanması için İspanya'da inşa edilen bir çift kruvazördü. Gemiler 1915'te sipariş edilmişti ancak I. Dünya Savaşı sırasındaki malzeme sıkıntıları inşaatı geciktirdi. Tasarım ağırlıklı olarak İngiliz C sınıfı kruvazörlerinden etkilenmişti. Kruvazörler yaklaşık 4.800 ton deplasmana sahipti ancak nispeten yavaştı. Ana silahı altı 152mm/50 Vickers Mk V topundan oluşuyordu. Ayrıca iyi zırh koruması ve bir düzine 533mm torpido tüpüne sahipti."
 SPA_submarine_1:0 "B Sınıfı"
 SPA_submarine_1_desc:0 "B sınıfı, İspanya'da İspanyol Donanması için inşa edilen ilk denizaltılardı. Sınıfın altı gemisi 1922-1925 yılları arasında hizmete girdi. Tek gövdeli gemiler olarak tasarlandıkları için güvenilirlikleri ortalamanın altındaydı. Orta boy denizaltılardı, 550 tonun üzerinde deplasmana sahiptiler. Dört 450mm torpido tüpüyle silahlandırılmışlardı."
 SPA_submarine_2:0 "General Mola Sınıfı"
 SPA_submarine_2_desc:0 "§TGeneral Mola sınıfı, 1934'te hizmete giren ve 1937'de Milliyetçilere devredilen dört İtalyan Archimedes sınıfı denizaltıdan oluşan bir sınıftı. Oldukça büyüklerdi, 880 ton deplasmana sahiptiler ancak çoğu denizaltıdan daha hızlıydılar. Sekiz 533mm torpido tüpüyle silahlandırılmışlardı ve 90m dalış derinliğine sahiptiler.§!"
 SPA_submarine_3:0 "G Sınıfı"
 SPA_submarine_3_desc:0 "İspanyol G sınıfı denizaltılar, Milliyetçi İspanya tarafından lisanslı olarak üretilen bir çift Alman VIIC sınıfı denizaltıydı. Ancak sadece biri tamamlanabildi ve 1947 yılına kadar İspanyol Donanması'na teslim edilmedi. Denizaltılar 770 ton deplasmana sahipti ve beş 533mm torpido tüpüyle donatılmıştı. VIIC'ler Alman denizaltı filosunun iş yükünü çeken modeller olduğu için mükemmel hız ve menzile sahiptiler."
 SPA_submarine_4:0 "D Sınıfı"
 SPA_submarine_4_desc:0 "İspanyol D sınıfının üç denizaltısının tamamı 1944'te denize indirildi ve savaş sonrasında çeşitli zamanlarda hizmete girdi. Üçü de İspanya'da tasarlandı ve inşa edildi. Büyük, okyanus aşırı denizaltılardı, 1.050 ton deplasmana sahiptiler. Altı 533mm torpido tüpüyle donatılmışlardı ve mükemmel hız ve menzile sahiptiler."
 SPR_battleship_1:0 "España Sınıfı"
 SPR_battleship_1_desc:0 "España sınıfı, başlangıçta I. Dünya Savaşı zamanında hizmete giren üç dreadnought zırhlısından oluşan bir sınıftı, ancak biri İspanyol İç Savaşı zamanında karaya oturmuştu. Diğer ikisi savaş sırasında kaybedildi. Bir zırhlı için oldukça küçüklerdi, sadece 15.400 tonun biraz üzerinde deplasmana sahiptiler. Bununla birlikte iyi zırh ve iyi hıza sahiptiler ve ana bataryaları sekiz 305mm/50 Vickers H topundan oluşuyordu."
 SPR_destroyer_1:0 "Alsedo Sınıfı"
 SPR_destroyer_1_desc:0 "Alsedo sınıfının üç muhribi, İspanyol Donanması için İspanya'da inşa edildi. İngiliz L sınıfı temel alınarak tasarlanmışlardı ve 1924-1925'te hizmete girdiler. 1.040 tonun üzerinde deplasmana sahiptiler. Ana silah olarak üç 102mm/45 Vickers Mk LA topu ve dört 450mm torpido tüpü taşıyorlardı. Dönemine göre iyi hız ve menzile sahiptiler."
 SPR_destroyer_2:0 "Churruca Sınıfı"
 SPR_destroyer_2_desc:0 "İspanyol Churruca sınıfı, 1925-1933 arasında denize indirilen ve ikisi sonradan Arjantin'e satılan on altı muhripten oluşuyordu. İngiliz S sınıfı temel alınarak tasarlanmışlardı ve İç Savaş döneminde İspanyol Donanması'nın belkemiğiydiler. 1.500 tonun üzerinde deplasmana sahiptiler. Ana silahları beş 120mm/45 Vickers-Armstrong topu ve altı 533mm torpido tüpünden oluşuyordu. İyi hız ve mükemmel menzil sunuyorlardı."
 SPR_destroyer_4:0 "Álava Sınıfı"
 SPR_destroyer_4_desc:0 "Álava sınıfı muhripler, savaş sonrasında önceki Almirante Antequera sınıfının (Churruca sınıfının bir alt modeli) yükseltilmiş versiyonları olarak hizmete girdi. 1.710 ton deplasmanlıydılar ve ana silah olarak dört 120mm/45 Vickers-Armstrong Mk F topu taşıyorlardı. Hız ve menzil açısından temel aldıkları önceki tasarımlarla benzer özellikler gösteriyorlardı."
 SPR_heavy_cruiser_1:0 "Princesa de Asturias Sınıfı"
 SPR_heavy_cruiser_1_desc:0 "Princesa de Asturias Sınıfı, yüzyıl dönümünde İspanyol Donanması için inşa edilen üç zırhlı kruvazördü. 1930'ların ortalarında hurdaya ayrılmışlardı. İkiz 240mm Guillén M1896 ve sekiz 140mm/33 Schneider-Canet topu taşıyorlardı. Ağır zırhlıydılar ancak standart ağır kruvazörlere kıyasla nispeten yavaştılar."
 SPR_heavy_cruiser_2:0 "Canarias Sınıfı"
 SPR_heavy_cruiser_2_desc:0 "Canarias sınıfının iki ağır kruvazörü, Washington Deniz Antlaşması'nın şartlarına uygun olarak inşa edildi. 1930'ların başında denize indirildiler ancak 1936 yılına kadar tamamlanamadılar. Yaklaşık 10.700 ton deplasmana sahiptiler ve iyi hıza sahiptiler. Nispeten hafif zırhlıydılar ancak ana silah olarak sekiz 203mm/50 Vickers-Armstrong Mk D topu taşıyorlardı."
 SPR_light_cruiser_1:0 "Méndez Núñez Sınıfı"
 SPR_light_cruiser_1_desc:0 "Méndez Núñez sınıfı hafif kruvazörler, 1920'lerin başında İspanyol Donanması için inşa edilen iki kruvazördü. 1915'te sipariş edilmişlerdi ancak I. Dünya Savaşı'ndaki malzeme sıkıntıları inşaatı geciktirdi. Tasarımı büyük ölçüde İngiliz C sınıfı kruvazörlerinden etkilenmişti. Yaklaşık 4.800 ton deplasmanlıydılar ancak nispeten yavaştılar. Ana silahları altı 152mm/50 Vickers Mk V topundan oluşuyordu. İyi zırh koruması ve on iki 533mm torpido tüpüne sahiptiler."
 SPR_submarine_1:0 "B Sınıfı"
 SPR_submarine_1_desc:0 "B sınıfı denizaltılar, İspanyol Donanması için İspanya'da inşa edilen ilk denizaltılardı. Sınıfın altı gemisi 1922-1925 yılları arasında hizmete girdi. Tek gövdeli tasarlandıkları için güvenilirlikleri düşüktü. Orta boy denizaltılardı, 550 tonun üzerinde deplasmana sahiptiler. Dört 450mm torpido tüpüyle donatılmışlardı."
 SPR_submarine_2:0 "General Mola Sınıfı"
 SPR_submarine_2_desc:0 "General Mola sınıfı, 1934'te hizmete giren ve 1937'de Milliyetçilere devredilen dört İtalyan Archimedes sınıfı denizaltıdan oluşuyordu. Oldukça büyüklerdi (880 ton deplasman) ancak çoğu denizaltıdan daha hızlıydılar. Sekiz 533mm torpido tüpü ve 90 metre dalış derinliğine sahiptiler."
 SPR_submarine_3:0 "G Sınıfı"
 SPR_submarine_3_desc:0 "İspanyol G sınıfı denizaltılar, Milliyetçi İspanya tarafından lisanslı üretilen iki Alman VIIC sınıfı denizaltıydı. Ancak sadece biri tamamlanabildi ve 1947'ye kadar İspanyol Donanması'na teslim edilmedi. 770 ton deplasmanlı bu denizaltılar, beş 533mm torpido tüpüyle donatılmıştı. Alman denizaltı filosunun bel kemiği olan VIIC'ler gibi mükemmel hız ve menzile sahiptiler."
 SPR_submarine_4:0 "D Sınıfı"
 SPR_submarine_4_desc:0 "İspanyol D sınıfının üç denizaltısı da 1944'te denize indirildi ve savaş sonrasında hizmete girdi. Tamamı İspanya'da tasarlanıp inşa edilmişti. 1.050 ton deplasmanlı okyanus denizaltılarıydı. Altı 533mm torpido tüpüyle donatılmışlardı ve mükemmel hız/menzil performansı sunuyorlardı."
 SWE_destroyer_1:0 "Ehrensköld Sınıfı"
 SWE_destroyer_1_desc:0 "Ehrensköld sınıfının iki muhribi, I. Dünya Savaşı sonrasında İsveç için inşa edilen ilk modern muhripler olarak 1927'de tamamlandı. Sadece 970 tonun biraz üzerinde deplasmana sahiptiler ve üç 120mm/44 K/45 topu ve altı 533mm torpido tüpüyle donatılmışlardı. Kısa menzile ancak iyi hıza sahiptiler."
 SWE_destroyer_2:0 "Göteborg Sınıfı"
 SWE_destroyer_2_desc:0 "Göteborg sınıfı, 1935-1942 yılları arasında inşa edilen altı muhripten oluşuyordu. Öncüllerine kıyasla daha uzun bir gövdeye ve geliştirilmiş makinelere sahiptiler. Sadece 1.020 tonun biraz üzerinde deplasmana sahiptiler ve ana silah olarak 120mm/44 K/45 topları ve ayrıca altı 533mm torpido tüpü taşıyorlardı. Sınırlı menzile ancak mükemmel hıza sahiptiler."
 SWE_destroyer_3:0 "Visby Sınıfı"
 SWE_destroyer_3_desc:0 "Visby sınıfının dört muhribinin tamamı 1942-1944 yılları arasında inşa edildi. Önceki Göteborg sınıfına benzerlerdi, ancak daha büyüklerdi, 1.130 tonun üzerinde deplasmana sahiptiler. Ayrıca geliştirilmiş motorlara, biraz daha iyi menzile ve güçlü bir denizaltı savunma donanımına sahiptiler."
 SWE_destroyer_4:0 "Öland Sınıfı"
 SWE_destroyer_4_desc:0 "§Tİki Öland sınıfı muhrip, önceki tasarımlardan radikal bir değişimi temsil ediyordu. II. Dünya Savaşı'ndan hemen sonra denize indirildiler ve tamamlandılar. Büyüklerdi, 1.880 ton deplasmana sahiptiler. Ana silah olarak dört 120mm/45 M44 topuyla donatılmışlardı ve güçlü uçaksavar, torpido ve denizaltı savunma donanımına sahiptiler. Önceki muhriplere kıyasla biraz daha yavaştılar, ancak önemli ölçüde geliştirilmiş menzile sahiptiler.§!"
 SWE_heavy_cruiser_1:0 "Sverige Sınıfı"
 SWE_heavy_cruiser_1_desc:0 "Sverige sınıfı, I. Dünya Savaşı öncesinde İsveç Donanması için inşa edilen üç sahil zırhlısından oluşuyordu. Gemiler boyut (6.800 tonun üzerinde deplasman) ve silahlandırma (dört 283mm/44 K/45 M12 topu) olarak ağır kruvazörlere daha çok benziyordu. Gemiler bir kruvazör için nispeten yavaştı ancak çok iyi zırhlanmıştı. Üç gemi de II. Dünya Savaşı sırasında hizmet verdi."
 SWE_light_cruiser_1:0 "Fylgia Sınıfı"
 SWE_light_cruiser_1_desc:0 "Fylgia, 1905'te İsveç Donanması için hizmete giren nispeten küçük bir zırhlı kruvazördü. Savaş sırasında çoğunlukla eğitim görevlerinde kullanıldı ve 1939-41 yılları arasında kapsamlı bir modernizasyon geçirdi. Modernizasyondan önce 4.300 tonun üzerinde deplasmana sahipti ve ana silahı altı 152mm/45 K/50 M1903 topundan oluşuyordu. İyi zırha sahipti ancak bir kruvazör için nispeten yavaştı."
 SWE_light_cruiser_4:0 "Tre Kronor Sınıfı"
 SWE_light_cruiser_4_desc:0 "Tre Kronor sınıfı, II. Dünya Savaşı'nın hemen sonrasında İsveç Donanması için tamamlanan bir çift hafif kruvazörden oluşuyordu. 7.700 tonun biraz altında deplasmana sahiptiler ve iyi hız ve menzile sahiptiler. Ana silahları yedi 152/53 M42 topundan oluşuyordu. Ayrıca güçlü bir uçaksavar, torpido ve denizaltı savunma donanımına sahiptiler."
 SWE_submarine_1:0 "Hajen Sınıfı"
 SWE_submarine_1_desc:0 "Hajen, Bävern ve Valen sınıfları, 1920'lerde İsveç Donanması için inşa edilen küçük ve orta boy denizaltı serisiydi. 1920'de hizmete giren Hajen sınıfı, yaklaşık 400 ton deplasmana ve dört 450mm torpido tüpüne sahip denizaltılardı. Sadece 30m dalış derinliğine sahiptiler."
 SWE_submarine_2:0 "Sjölejonet Sınıfı"
 SWE_submarine_2_desc:0 "Sjölejonet sınıfı, 1936-1942 yılları arasında inşa edilen dokuz denizaltıdan oluşuyordu. Orta boy denizaltılardı, 580 ton deplasmana sahiptiler ve tasarımları ağırlıklı olarak Hollanda O sınıfı denizaltılardan etkilenmişti. Altı 533mm torpido tüpüyle donatılmışlardı ve 60m dalış derinliğine sahiptiler."
 SWE_submarine_3:0 "U Sınıfı"
 SWE_submarine_3_desc:0 "İsveç U sınıfı denizaltılar, 1942-1944 yılları arasında hizmete giren dokuz denizaltıdan oluşan bir sınıftı. Oldukça küçük ve nispeten yavaştılar, sadece 370 ton deplasmana sahiptiler. Dört 533mm torpido tüpüyle donatılmışlardı."
 SWE_submarine_4:0 "Neptun Sınıfı"
 SWE_submarine_4_desc:0 "Neptun sınıfı, 1943'te hizmete giren üç orta boy denizaltıdan oluşuyordu. Esas olarak mayın döşeme görevleri için kullanıldılar. 550 ton deplasmana sahiptiler ve beş 533mm torpido tüpüyle donatılmışlardı."
 TUR_battle_cruiser_1:0 "Yavuz Sınıfı"
 TUR_battle_cruiser_1_desc:0 "Yavuz, orijinalde Alman muharebe kruvazörü Goeben olarak hizmete girmişti ancak el konulmaktan kaçınmak için 1914'te Osmanlılara satıldı ve yeniden hizmete alındı. 23.000 tonun biraz altında deplasmana ve iyi hız ve menzile sahipti. İyi zırhlanmıştı ve ana silahı on 283mm/47 SK L/50 topunun yanı sıra güçlü bir ikincil silah donanımına sahipti."
 TUR_battleship_1:0 "Reşadiye Sınıfı"
 TUR_battleship_1_desc:0 "Reşadiye sınıfı, I. Dünya Savaşı öncesinde Türk Donanması için İngiltere'den sipariş edilen üç dreadnought zırhlısını temsil ediyor. Ancak gemilerden sadece biri tamamlanabildi ve I. Dünya Savaşı'nın başında İngilizler tarafından el konuldu. Gemiler 23.000 ton deplasmana sahip olacaktı ve iyi zırh, hız ve menzile sahip olacaktı. Ana silahları on 343mm/45 Vickers topundan oluşacaktı."
 TUR_destroyer_1:0 "Peyk Sınıfı"
 TUR_destroyer_1_desc:0 "Peyk sınıfı, 1907'de Osmanlı Donanması için hizmete giren büyük, hızlı bir çift torpido botundan oluşuyordu. Gemiler Almanya'da inşa edilmişti ve I. Dünya Savaşı'nı atlatmışlardı ancak II. Dünya Savaşı zamanında modası geçmişlerdi. 775 ton deplasmana sahiptiler ve ana silah olarak ikiz 105mm/37 SK L/40 topları ve üç 450mm torpido tüpü taşıyorlardı. İyi menzile sahiptiler ancak bir muhrip için oldukça yavaştılar."
 TUR_destroyer_2:0 "Barbaros Sınıfı"
 TUR_destroyer_3:0 "Demirhisar Sınıfı"
 TUR_destroyer_3_desc:0 "Demirhisar sınıfının dört muhribi İngiltere'de inşa edildi ve 1942'de tamamlandı. Gemilerden ikisi Kraliyet Donanması tarafından el konuldu, bunlardan biri savaştan sonra iade edildi. Gemiler İngiliz I sınıfı temel alınarak tasarlanmıştı. 1.370 ton deplasmana sahiptiler ve ana silah olarak dört 120mm/45 QF Mk IX topu taşıyorlardı. İyi hız ve menzile sahiptiler ve güçlü bir uçaksavar ve denizaltı savunma donanımına sahiptiler."
 TUR_light_cruiser_1:0 "Mecidiye Sınıfı"
 TUR_light_cruiser_1_desc:0 "Türk gemisi Mecidiye, yüzyıl dönümünde Osmanlı Donanması için ABD'de inşa edilen korumalı bir kruvazördü. Aslında II. Dünya Savaşı sırasında sığ suda batırıldı, ancak çıkarıldı ve kısa bir süre Rus İmparatorluk Donanması'nda hizmet verdikten sonra Türkiye'ye iade edildi. Sadece 3.500 tonun altında deplasmana sahipti ve ana silahı iki 152mm/44 Bethlehem No. 2 ve sekiz 120mm/45 Armstrong Y topundan oluşuyordu. İyi menzile sahipti ancak nispeten yavaş ve hafif zırhlıydı."
 TUR_submarine_1:0 "Birinci İnönü Sınıfı"
 TUR_submarine_1_desc:0 "Birinci İnönü sınıfı, I. Dünya Savaşı sonrasında Türk Donanması için inşa edilen ilk gemiler olan 1920'lerin ortasında Hollanda'da inşa edilen iki sahil denizaltısından oluşuyordu. 520 ton deplasmana ve altı 450mm torpido tüpüyle donatılmışlardı. Biraz yavaştılar ancak iyi menzile sahiptiler."
 TUR_submarine_2:0 "Saldıray Sınıfı"
 TUR_submarine_2_desc:0 "Saldıray sınıfının üç denizaltısı 1930'ların sonunda denize indirildi. Tasarımları ağırlıklı olarak Almanya'dan etkilenmişti, sınıfın ilk gemisi Almanya'da inşa edilirken diğer ikisi İstanbul'da lisans altında inşa edildi. Büyük, okyanus aşırı denizaltılardı, 930 tonun üzerinde deplasmana ve mükemmel menzile sahiptiler. Altı 533mm torpido tüpüyle donatılmışlardı."
 TUR_submarine_3:0 "Oruç Reis Sınıfı"
 TUR_submarine_3_desc:0 "Oruç Reis sınıfı denizaltılar, modifiye edilmiş bir İngiliz S sınıfı tasarımı olarak İngiltere'de inşa edildi. Gemiler 1940'ta denize indirildi, birkaçı geçici olarak Kraliyet Donanması tarafından el konuldu. Biri hariç tamamı sonunda Türkiye'ye iade edildi. Gemiler 625 ton deplasmana ve beş 533mm torpido tüpüne sahipti. Hız ve menzil açısından biraz sınırlıydılar."
 TUR_submarine_4:0 "Sakarya Sınıfı"
 TUR_submarine_4_desc:0 "Sakarya sınıfı denizaltılar, savaş sonrasında Türkiye'ye satılan bir dizi ABD Balao sınıfı denizaltıydı. Dönemleri için çok büyük denizaltılardı, 1.520 tonun üzerinde deplasmana sahiptiler. Mükemmel menzil ve hıza sahiptiler ve on 533mm torpido tüpüyle donatılmışlardı."
 URG_destroyer_1:0 "Uruguay Sınıfı"
 URG_destroyer_1_desc:0 "Uruguay, I. Dünya Savaşı öncesinde Uruguay Donanması için Almanya'da inşa edilen ağır bir torpido botuydu. 1.400 tonun üzerinde deplasmana sahipti ve dört 120mm/45 Krupp QF topuyla donatılmıştı. Güçlü bir uçaksavar donanımı ve iki 450mm torpido tüpüne sahipti. Dönemlerine ve büyüklüklerine göre diğer muhriplere kıyasla oldukça yavaştılar."
 USA_SH_battleship_1:0 "Virginia Sınıfı"
 USA_SH_battleship_1_desc:0 "1920'de, 12 x 16\"/50 topa sahip büyük Güney Dakota Sınıfı zırhlıların inşasına başlandı. Sınıf, ağır savaş gemisi tasarımında yeni bir çağ başlatacaktı ancak Washington Denizcilik Anlaşması'na uymak için 1922'de iptal edildi. Anlaşmanın artık yürürlükte olmaması ve gizli bir Japon savaş gemisi projesi tehdidi nedeniyle, tasarımı modernize edebilir, deplasmanı 55.000 tonun üzerine çıkarabilir ve tasarımı daha yüksek toplarla donatabiliriz. Yeni bir ağır zırhlı sınıfı yaratmak için 18\"/50 kalibrelik toplar."
 USA_SH_battleship_2:0 "Montana Sınıfı"
 USA_SH_battleship_2_desc:0 "Montana Sınıfı, Illinois Sınıfından daha büyük ve daha zırhlıydı; bu artışı karşılamak için hızdan fedakarlık ediyordu. 12 x 18\"/50 kalibrelik toplardan oluşan ana silahı ve en yeni atış kontrol sistemimiz sayesinde Montana'nın ateş gücü eşsiz olacak. İlk tasarımlar 6\" topları içeriyordu ancak bu, çift amaçlı 5\" ikiz taret mevzilerine geri dönecek şekilde değiştirildi."
 USA_battle_cruiser_1:0 "Lexington Sınıfı"
 USA_battle_cruiser_1_desc:0 "Lexington Sınıfı başlangıçta Japonya'nın Kongo sınıfı savaş kruvazörüne bir tepkiydi. 1916 Deniz Kuvvetleri Yasası uyarınca emredilen gemilerin çift taretlerde 16\" top taşıması ve 33 knot hıza ulaşabilmesi amaçlanmıştı. İnşaat başladıktan sonra ABD, Washington Denizcilik Anlaşması'na girdi ve USS Lexington ve USS Saratoga, Taşıyıcılara dönüştürüldü."
 USA_battle_cruiser_2:0 "Alaska Sınıfı"
 USA_battle_cruiser_2_desc:0 "Alaska Sınıfı, Alman cep savaş gemilerine, artık daha çok Japonya'nın \"süper kruvazörlerine\" bir yanıttı. 12\" top taşıyacak ve 10\"e kadar mermi ateşine dayanacak şekilde tasarlanan sınıf, kruvazör hızlarına ulaşabiliyordu ancak su korumasından ödün verilmişti."
 USA_battleship_1:0 "New York Sınıfı"
 USA_battleship_1_desc:0 "New York Sınıfı zırhlılar, 14\"/45 kalibrelik ana toplarla donanmış ilk ABD Savaş Gemileriydi. Çok sayıda 5\"/51 top, ikincil silah ve 10\" üzerinde zırh sağlıyordu."
 USA_battleship_2:0 "North Carolina Sınıfı"
 USA_battleship_2_desc:0 "Kuzey Carolina Sınıfı zorlu bir tasarımdı ve ABD Donanması tarafından 20 yıl içinde inşa edilen ilk zırhlı sınıfıydı. ABD Donanması, bu sınıfın Washington Denizcilik Anlaşmasının standartlarını karşılamasını, 36.000 tonla sınırlı olmasını, ancak 16\"/45 kalibrelik toplarla donanmış olmasını ve ABD Donanması'nın hızlı uçak gemilerine eskortluk edebilmesinin yanı sıra geliştirilmiş zırha sahip olmasını şart koşuyordu."
 USA_battleship_3:0 "Iowa Sınıfı"
 USA_battleship_3_desc:0 "Iowa Sınıfı, daha önceki Kuzey Carolina'nın tüm yeniliklerini ve yeteneklerini ekledi, ancak yer değiştirmesini ve taktiksel hızını önemli ölçüde artırdı. Iowa'lar öncelikle taşıyıcı gruplara eskortluk yapmaktan sorumluydu ve ikinci bir \"kruvazör katili\" rolü akılda tutularak tasarlandı."
 USA_battleship_4:0 "Illinois Sınıfı"
 USA_battleship_4_desc:0 "Illinois Sınıfı, Iowa Sınıfı tarafından tanımlanan tasarım ve rolle devam etti. Zırh üzerinden hızı ve silahlanmayı korudu. Illinois Sınıfı, 16\"/50 kalibrelik topların sayısını 9'dan 12'ye çıkarırken, aynı zamanda daha verimli yüksek seyir hızları sağlamak için kazanları ve makineleri de geliştirdi. Montana Sınıfı gibi, ilk tasarımlar dört adet 4 6 inçlik ikili top taretini içeriyordu, ancak uçaksavar yeteneklerini en üst düzeye çıkarmak için bu, çift amaçlı 5 inçlik ikiz taret yerleşimlerine geri döndürüldü."
 USA_carrier_1:0 "Lexington Sınıfı"
 USA_carrier_1_desc:0 "Lexington Sınıfı uçak gemisi, Washington Denizcilik Antlaşması'nın kısıtlamalarına uymak için iki Lexington Sınıfı muharebe kruvazörünün dönüştürülmüş gövdelerinden doğdu. Sınıf, ABD Donanması'ndaki ilk operasyonel uçak gemisi sınıfıydı ve birkaç yıl boyunca uçak gemisi operasyonlarını geliştirdi."
 USA_carrier_2:0 "Ranger Sınıfı"
 USA_carrier_2_desc:0 "Ranger Sınıfı, ABD Donanması'nın baştan uçak gemisi olarak tasarlanan ilk sınıfıydı. ABD Donanması'nın daha küçük uçak gemisi konseptinin bir parçası olarak sınıf, önceki Lexington Sınıfı'ndan çok daha küçüktü, ancak iç tasarımlardaki iyileştirmeler sayesinde aynı hava grubu desteğini korudu."
 USA_carrier_3:0 "Essex Sınıfı"
 USA_carrier_3_desc:0 "Önceki Lexington, Ranger ve Yorktown varyant sınıflarından alınan derslerle sonuç, Essex Sınıfı oldu, büyük bir uçak grubunu savaşa taşıyabilen hızlı bir gemi. Hasar kontrol tasarımları da Yorktown sınıfından devralındı ve uçak kullanımını iyileştirmek için bir güverte kenarı asansörü eklendi."
 USA_carrier_4:0 "Midway Sınıfı"
 USA_carrier_4_desc:0 "Midway Sınıfı, ABD Donanması'nın uçak gemisi yeteneğinin zirvesiydi. Zırhlı bir güverte uygulandı ve önceki sınıflardan çok daha fazla uçak taşıyabilen Midway Sınıfı'na benzersiz bir alt sınıf tanımı verildi, CVB (Carrier Vessel Battle)."
 USA_destroyer_1:0 "Clemson Sınıfı"
 USA_destroyer_1_desc:0 "Clemson Sınıfı muhrip, bir önceki selefi olan Wickes Sınıfının birçok tasarım unsuruyla devam etti. Clemson, Wickes Sınıfına göre denizde daha iyi yol tutuşuna sahipti ve 4\"/50 kalibrelik ana toplar, 3\"/23 kalibrelik uçaksavar topu ve 12 torpido kovanı ile silahlandırıldı. Sınıf yaşlanıyordu ve neredeyse geçerliliğini yitirmişti, ancak hâlâ ABD Donanması'nın Muhrip kuvvetinin büyük kısmını oluşturuyordu."
 USA_destroyer_2:0 "Sims Sınıfı"
 USA_destroyer_2_desc:0 "Sims Sınıfı, daha akıcı torpido düzeni ve daha uzun gövdesiyle en büyük \"1500 Tonluk\" tasarımdı. Ateş kontrolündeki iyileştirmeler, 5\"/38 kalibrelik toplarıyla daha iyi saldırı yetenekleri sağladı ve 12 merkez hattı torpido kovanı içeriyordu."
 USA_destroyer_3:0 "Fletcher Sınıfı"
 USA_destroyer_3_desc:0 "Fletcher Sınıfı, büyük ölçüde 2500 tona çıkarılması sayesinde muhrip kapasitesi açısından ileriye doğru büyük bir adımı temsil ediyordu. Sınıf, 5\"/38 çift amaçlı topları ve merkez hattı torpido düzenini korurken ilave bir tek kule ekledi ve uçaksavar silahlarında önemli artışların yanı sıra iyileştirilmiş menzil ve daha büyük yer değiştirme elde etti."
 USA_destroyer_4:0 "Allen M Sumner Sınıfı"
 USA_destroyer_4_desc:0 "Sumner Sınıfı, yer değiştirme yalnızca marjinal bir artışla Fletcher Sınıfında devam etti. Gemi, ikili 5\"/38 kalibrelik toplar ve çok daha büyük uçaksavar silahları sayesinde daha fazla silahlanmayı üstlenebildi. İkinci bir dümenin eklenmesi, ASW operasyonları sırasında manevranın iyileştirilmesine olanak sağladı."
 USA_heavy_cruiser_1:0 "Pensacola Sınıfı"
 USA_heavy_cruiser_1_desc:0 "Pensacola Sınıfı, Washington Denizcilik Antlaşması'nın kısıtlamaları altında tasarlandı ve 8\" top kısıtlaması altında ateş gücünü maksimuma çıkarmaya çalıştı. 10 x 8\"/55 toplardan oluşan müthiş bir silahla donatılmıştı. Gövde zırhı inceydi ve tasarımı son derece ağır ama yetenekliydi. ABD Donanması'nın Ağır Kruvazör kuvvetinin büyük kısmını oluşturuyordu."
 USA_heavy_cruiser_2:0 "Wichita Sınıfı"
 USA_heavy_cruiser_2_desc:0 "Wichita Sınıfı gemiler, 8\"55 kalibrelik topları için yeni bir taret tasarımıyla Pensacola Sınıfına ve onun varyantlarına göre silahları iyileştirdi ve 5\"/38 toplardan oluşan ikincil silahları için ateş alanlarını iyileştirdi."
 USA_heavy_cruiser_3:0 "Baltimore Sınıfı"
 USA_heavy_cruiser_3_desc:0 "Baltimore Sınıfı, önceki kruvazör tasarımlarının daha başarılı unsurlarını bir araya getirdi ve büyük ölçüde Brooklyn Sınıfı hafif kruvazörüne dayanıyordu, USS Wichita'dan silahlanma ve zırh konfigürasyonlarıyla evlendi."
 USA_heavy_cruiser_4:0 "Oregon City Sınıfı"
 USA_heavy_cruiser_4_desc:0 "Oregon City Sınıfı kruvazörler, Baltimore Sınıfı üzerinde geniş ve marjinal iyileştirmeler sağladı. En dikkat çeken, daha iyi uçaksavar ateş alanları sağlayan üst yapıdaki değişiklikti. Benzer iyileştirmeler Cleveland'dan Oregon City sınıfı hafif kruvazörlerde de görüldü."
 USA_light_cruiser_1:0 "Omaha Sınıfı"
 USA_light_cruiser_1_desc:0 "Omaha Sınıfı başlangıçta ABD Donanması'nın 1. Dünya Savaşı filosunda önemli bir keşif rolünü yerine getirmek üzere tasarlandı. Hızlı ve yetenekli bir sınıf olan Omaha Sınıfı, 8x1 ve 2x2 taret konfigürasyonunda 6\"/53 kalibrelik toplardan oluşan müthiş bir yükle ve altı torpido fırlatıcıyla donatılmıştı. Omaha Sınıfı eskimişti ancak ABD Donanması'nın Hafif Kruvazör kuvvetinin büyük bir kısmını oluşturuyordu."
 USA_light_cruiser_2:0 "Brooklyn Sınıfı"
 USA_light_cruiser_2_desc:0 "Brooklyn Sınıfı, Washington Denizcilik Anlaşması göz önünde bulundurularak tasarlandı ve bu nedenle 6\" toplarla sınırlıydı. Ateş gücünü en üst düzeye çıkarmak için Brooklyn'ler, üçlü taretlerde 15 adet yeni Mk16 6\" topla donatıldı. Genel tasarım çok dengeliydi ve ABD Donanması için gelecekteki tüm kruvazör tasarımlarının temeli olarak kabul edildi."
 USA_light_cruiser_3:0 "Cleveland Sınıfı"
 USA_light_cruiser_3_desc:0 "Cleveland Sınıfı, Brooklyn Sınıfına dayanıyordu, ancak Washington Deniz Anlaşması kısıtlamaları yoktu. Cleveland Sınıfı, 12 6\" ana top düzenini koruyor ancak ikincil 5\" silahını büyük ölçüde artırdı ve ilave uçaksavar silahları ekledi."
 USA_light_cruiser_4:0 "Fargo Sınıfı"
 USA_light_cruiser_4_desc:0 "Fargo Sınıfı, başarılı Cleveland Sınıfı'nın üzerine inşa edildi. Daha iyi tasarlanmış piramit şeklindeki üst yapı sayesinde daha iyi uçaksavar ateş alanları sundu."
 USA_submarine_1:0 "S Sınıfı"
 USA_submarine_1_desc:0 "S tekneleri, genellikle Sugar Boats olarak bilinir, 1920'lerde tasarlanmış ve inşa edilmiş 51 denizaltıdan oluşan bir seriydi. I. Dünya Savaşı dönemi O & R Tekne serilerinin üzerinde, S Tekneleri daha büyüktü ve sınıf yalnızca dört ileriye bakan 21 inç tüpe sahip olmasına rağmen daha uzun menzil ve daha fazla torpido yeniden yüklemesine izin veriyordu. Yaşlarına rağmen, son S Teknesi 1924'te hizmete girdi, S Tekneleri ABD Donanması'nın mevcut Denizaltı gücünün önemli bir bölümünü oluşturuyordu."
 USA_submarine_2:0 "Porpoise Sınıfı"
 USA_submarine_2_desc:0 "Porpoise Sınıfı denizaltı, ABD Donanması'nın 20'li yılların sonlarında ve 30'lu yılların başlarında inşa edilen bir dizi deneysel \"V Tekne\" sonrasında tasarlanıp inşa edilen ilk modern denizaltısıydı. Tamamen elektrikli tahrikle ilgili başlangıçtaki sorunlara rağmen, sınıf umut vaat ediyordu ve gelecekteki tasarımlar olarak değerlendiriliyordu. Sınıf, 6 torpido kovanı ve 3 inçlik bir güverte silahıyla donatılmıştı."
 USA_submarine_3:0 "Tambor Sınıfı"
 USA_submarine_3_desc:0 "Tambor sınıfı, ABD Deniz Kuvvetleri'nin hem Denizaltı tasarımının \"Filo Teknesi\" rolüne uyması hem de Pasifik Okyanusu sularında iyi performans göstermesi için yıllarca süren deneylerinin sonucuydu. Silahlanma, ek koruma için kıç tarafta dört ateşlemeli 10 torpido kovanına, iki uçaksavar topuyla birlikte 3\" güverte topuna yükseltildi."
 USA_submarine_4:0 "Balao Sınıfı"
 USA_submarine_4_desc:0 "Balao Sınıfı, kökleri Tambor sınıfından gelen tasarımın devamıydı. İyileştirmeler, gövde takviyesi ve güverte tabancasının 5\"/24 kalibreye yükseltilmesinin yanı sıra çok sayıda ince tasarım iyileştirmesi şeklinde geldi."
 VIC_SH_battleship_1:0 "Charlemagne Sınıfı"
 VIC_SH_battleship_1_desc:0 "Charlemagne sınıfı süper zırhlılar, diğer donanmaların büyük zırhlılarına denk gelecek varsayımsal bir tasarımdı. Üst üste dizilmiş pozisyonlarda ağır silah donanımı, ağır uçaksavar silahları ve kalın zırh taşıyorlardı. Tüm tasarım Richelieu ve İngiliz Nelson sınıflarından unsurlar ödünç almıştı."
 VIC_SH_battleship_2:0 "Napoléon Bonaparte Sınıfı"
 VIC_SH_battleship_2_desc:0 "Napoléon Bonaparte sınıfı zırhlılar, Alsace ve Gascogne sınıfları temel alınarak varsayımsal bir tasarımdı. Ağır silah donanımı üçlü taretlerde öne ve arkaya eşit olarak dağıtılmıştı, üst üste dizilmiş ikincil silahlar ve ağır uçaksavar silahları vardı. Kalın zırh ve güçlü motorlar, filodaki diğer gemilere ayak uydurabilmek ve düşmanlarıyla etkili bir şekilde savaşabilmek için gereken hızı ve savunmayı sağlıyordu."
 VIC_battle_cruiser_1:0 "Durand-Viel Tasarımı"
 VIC_battle_cruiser_1_desc:0 "Durand-Viel muharebe kruvazörü tasarımı, I. Dünya Savaşı'na kadar uzanan bir dizi çalışma arasında bir öneriydi. Esasen Normandie ve Lyon sınıfı zırhlıların muharebe kruvazörü versiyonlarıydı, aynı dörtlü taretleri ve topları taşıyorlardı ancak sayıca daha azdı. Diğer donanmaların çağdaş muharebe kruvazörleri gibi, bir zırhlıya kıyasla daha hızlı ancak daha az zırhlı olacaklardı. I. Dünya Savaşı patlak vermeden önce iptal edildiler."
 VIC_battle_cruiser_2:0 "Dunkerque Sınıfı"
 VIC_battle_cruiser_2_desc:0 "Dunkerque'ler, Alman Deutschland sınıfı cep zırhlılarına karşı koymak için tasarlandı. 1920'lerin ortalarından 1930'ların başlarına kadar uzanan bir dizi tasarım çalışmasının zirvesiydi. 1931 ve 1934 deniz programlarında onaylandılar, İngiliz Nelson sınıfı zırhlılarına benziyorlardı, tüm ana taretleri önde toplanmıştı. Bu daha kısa bir zırh kemeriyle sonuçlandı ve böylece Deniz Antlaşmaları sınırlamalarına uyacak şekilde daha küçük bir gemi elde edildi."
 VIC_battleship_1:0 "Courbet Sınıfı"
 VIC_battleship_1_desc:0 "Courbet sınıfı zırhlılar, I. Dünya Savaşı öncesinde ve sırasında Fransız Donanması için inşa edilen ilk süper-dreadnoughtlardı. 1910 ve 1911 deniz programlarında onaylandılar, I. Dünya Savaşı sırasında sınırlı hizmet gördüler ancak II. Dünya Savaşı sırasında aktiflerdi. Önceki Dante sınıfı zırhlılara kıyasla daha kalın zırha ve daha güçlü toplara sahip olsalar da, çağdaş ABD ve İngiliz zırhlılarından hala gerideydiler. Sadece 22.000 tonun üzerinde deplasmana sahiptiler ve II. Dünya Savaşı öncesinde sadece geliştirilmiş uçaksavar silahları ve kazanlarla modernize edilmişlerdi."
 VIC_battleship_2:0 "Richelieu Sınıfı"
 VIC_battleship_2_desc:0 "Richelieu sınıfı zırhlılar, Fransız Donanması'na hizmete giren son zırhlılardı. Dunkerque'nin geliştirilmiş bir tasarımıydı ve 1935 ve 1938 deniz programlarında onaylandı. Mükemmel uçaksavar silahları, hız ve menzile sahiplerdi, bu da onları mükemmel bir ana gemi yapıyordu. Sipariş edilen dört gemiden sadece ikisi denize indirildi ve biri Fransa'nın Düşüşü'nden önce tamamlandı. Kalan gemileri farklı tasarımlarla tamamlamak için çok sayıda girişimde bulunuldu, uçaksavar zırhlısı, zırhlı-uçak gemisi melezi veya tam ölçekli uçak gemisi olarak kullanılmaları önerildi."
 VIC_battleship_3:0 "Gascogne Sınıfı"
 VIC_battleship_3_desc:0 "Gascogne sınıfı zırhlılar, Richelieu sınıfının bir alt sınıfıydı. 1940 deniz programında üç gemi sipariş edildi ancak hiçbiri başlatılmadı. Tasarım Richelieu'nun bir tekrarı olacaktı, ancak ana silah donanımı öne ve arkaya eşit olarak dağıtılacak, uçaksavar silahları geliştirilecek ve motorlar iyileştirilecekti, bu da genel olarak daha iyi bir gemiyle sonuçlanacaktı."
 VIC_battleship_4:0 "Alsace Sınıfı"
 VIC_battleship_4_desc:0 "Alsace sınıfı zırhlılar, Richelieu sınıfının halefi olarak planlanmıştı. Dört gemi sipariş edildi, tasarım çalışmaları 1939'da tamamlandı, 1940'ta onaylandı ve 1941'de kızağa konmaları bekleniyordu, ancak Fransa'nın Düşüşü bunun gerçekleşmesini engelledi. Richelieu tasarımından daha ağır ve sayıca daha fazla ana top, daha güçlü uçaksavar silahları, daha kalın zırhlı plakalar ve daha büyük motorlarla iyileştirilmişti."
 VIC_carrier_1:0 "Béarn Sınıfı"
 VIC_carrier_1_desc:0 "Béarn, orijinalde bir Normandie sınıfı zırhlı olarak kızağa konmuştu ancak daha sonra bir uçak gemisi olarak tamamlandı, 22.100 ton deplasmana sahipti ve iki savaş arası dönemde ve II. Dünya Savaşı'nda hizmet verdi. Dönüştürülmüş bir uçak gemisi olarak hızı yavaştı ve uçak kapasitesi sınırlıydı, ancak orta düzeyde zırh kemeri ve uzun menzil bu eksiklikleri telafi ediyordu. İnşası, DCAN (Direction des Constructions et Armes Navale) içindeki Fransız tasarımcılara önemli deneyim kazandırdı ve sonrasında bir dizi tasarım çalışmasına yol açtı."
 VIC_carrier_2:0 "Joffre Sınıfı"
 VIC_carrier_2_desc:0 "Joffre sınıfı uçak gemileri (Proje adı PA-16), Fransız Donanması için yeni nesil uçak gemileriydi. 1929'da başlayan ve 1937'de sona eren tasarım çalışmalarının sonuncusuydu. 1938 deniz programında iki gemi onaylandı, ancak artan çatışmalar inşaat sürecini yavaşlattı ve sonunda Fransa'nın Düşüşü bu gemilerin tamamlanmasını engelledi. Deplasmanları yaklaşık 20.000 ton olacaktı. İyi uçaksavar silahları, zırh ve hıza sahip olacaklardı, ancak ortalamanın altında bir uçak kapasitesine sahip olacaklardı. Genel olarak, Fransız Donanması için iyi dengelenmiş ve çok yönlü bir uçak gemisi olacaktı."
 VIC_carrier_3:0 "Jean Bart Sınıfı"
 VIC_carrier_3_desc:0 "Jean Bart uçak gemisi, tamamlanmamış Richelieu sınıfı zırhlısı Jean Bart'ın Japon IJN Shinano'ya benzer şekilde tam ölçekli bir uçak gemisine dönüştürülmesi için savaş ortasında yapılan bir öneriydi. Gövdenin büyük boyutu büyük bir uçak kapasitesiyle sonuçlanacaktı ve büyük motorlarla birlikte uzun menzilli ve hızlı bir uçak gemisi olacaktı. ABD menşeli ağır uçaksavar silahları, uçaklara ve daha küçük yüzey savaş gemilerine karşı iyi bir savunma sağlayacaktı."
 VIC_carrier_4:0 "Clémenceau Sınıfı"
 VIC_carrier_4_desc:0 "Clémenceau sınıfı uçak gemileri (Proje adı PA-28), Fransız Donanması'nın ilk savaş sonrası uçak gemisi tasarımıydı. Tasarım tamamlanmamış Joffre sınıfı uçak gemilerine benzer olacaktı, ancak takılan ekipman ve silahlar modern Fransız ürünleri olacaktı. ABD ve İngiliz eskort uçak gemilerinin edinilmesi ve savaş sonrası Fransa'nın ekonomik durumu bu gemilerin kızağa konmasını engelledi. 1955 ve 1957'de kızağa konan sonraki Clémenceau sınıfı uçak gemileriyle (Proje adı PA-54) karıştırılmamalıdır."
 VIC_destroyer_1:0 "Bourrasque Sınıfı"
 VIC_destroyer_1_desc:0 "Bourrasque sınıfı muhripler, 1.500 ton Serisi'nin bir parçasıydı ve 1920'lerin ortasında denize indirildi. Önceki Chacal ve sonraki L'Adroit sınıflarıyla birlikte, savaş sonrası modern Fransız filosunun belkemiğini oluşturdular. Dönemlerine göre hızlı ve iyi silahlandırılmışlardı, ancak torpido donanımları diğer donanmalardaki benzer gemilere kıyasla daha küçüktü."
 VIC_destroyer_2:0 "Le Fantasque Sınıfı"
 VIC_destroyer_2_desc:0 "Le Fantasque sınıfı muhripler, esasen 1930 deniz programı kapsamında inşa edilen önceki 2.400 ton Serisi (Guépard, Aigle, Vauquelin) süper muhriplerinin geliştirilmiş versiyonlarıydı. Büyük, ağır silahlı ve çok hızlı muhriplerdi, Fransız filosunun yeni yüksek hızlı birimlerine eskortluk yapmak için mükemmeldiler. Silah donanımları yeni geliştirilmiş toplar, yeterli uçaksavar ve torpido donanımından oluşuyordu."
 VIC_destroyer_3:0 "L'Intrépide Sınıfı"
 VIC_destroyer_3_desc:0 "L'Intrépide sınıfı muhripler, önceki Le Hardi sınıfı muhriplerin modifiye edilmiş bir versiyonuydu. 1938 ve 1939 deniz programlarında onaylanmışlardı ancak savaş ve Fransa'nın Düşüşü bu gemilerin iptal edilmesine yol açtı. Daha çok uçaksavar rolüne odaklanacaklardı, deplasmanları 2.800-2.900 tona çıkarılmış ve daha büyük motorlara sahip olacaklardı."
 VIC_destroyer_4:0 "Hoche Sınıfı"
 VIC_destroyer_4_desc:0 "Hoche ve Bayard sınıfları, Fransız Donanması'nın son süper muhrip tasarımıydı. Her iki sınıf da Mogador sınıfı temel alınarak tasarlanmıştı, 4.200 ton deplasmana sahiptiler ve benzer bir ana silah donanımına ancak geliştirilmiş uçaksavar topları ve daha güçlü motorlara sahiptiler. 1939-40 deniz programlarında onaylanmışlardı ancak savaşın başlaması ve Fransa'nın Düşüşü bu gemilerin iptal edilmesine yol açtı."
 VIC_heavy_cruiser_1:0 "Suffren Sınıfı"
 VIC_heavy_cruiser_1_desc:0 "Suffren sınıfı ağır kruvazörler, temelde önceki Duquesne sınıfının denizcilik yetenekleri açısından küçük iyileştirmeler içeren bir tekrarıydı. Her iki sınıf da Fransız donanmasının çağdaş kruvazör felsefesini yansıtıyordu: çok ince zırh ancak iyi hız ve menzil. Standart deplasmanları 10.000 tondu ve bir ağır kruvazör için standart olan silah donanımına sahiptiler."
 VIC_heavy_cruiser_2:0 "Algérie Sınıfı"
 VIC_heavy_cruiser_2_desc:0 "Algérie Sınıfı ağır kruvazör, önceki Suffren ve Duquesne sınıflarının daha da geliştirilmiş bir versiyonuydu ancak İtalyan Zara sınıfı yeni ağır kruvazörlerinin rakibi olarak tasarlanmıştı. Hem ana zırh kemeri hem de sualtı koruması önemli ölçüde artırılmıştı. Uçaksavar silahları dönemi için yeterliydi, ancak bu değişiklikler nedeniyle standart deplasman 10.000 tonun üzerindeydi."
 VIC_heavy_cruiser_3:0 "Saint Louis Sınıfı"
 VIC_heavy_cruiser_3_desc:0 "Saint Louis sınıfı ağır kruvazörler, Algérie Sınıfı temel alınarak tasarlanmıştı ancak genel görünümü Dunkerque ve Richelieu sınıfı ana gemilere daha yakındı. 1940 deniz programında üç gemi sipariş edildi, ancak Fransa'nın Düşüşü nedeniyle hiçbiri kızağa konulamadı. Yeni toplar ve geliştirilmiş uçaksavar silahları taşıyacaklardı ancak zırh koruması Algérie Sınıfıyla aynı olacaktı. Fransız Donanması'nın son ağır kruvazör tasarımıydı."
 VIC_heavy_cruiser_4:0 "Forbin Sınıfı"
 VIC_heavy_cruiser_4_desc:0 "Forbin sınıfı ağır kruvazörler, Saint Louis sınıfının devamı olarak varsayımsal bir tasarımdı. Ana Fransa ve koloniler arasındaki ticaret yollarını korumak için tasarlanmıştı, uzun menzil ve iyi hızın yanı sıra dört üçlü tarette ağır topçu ve yeterli sayıda uçaksavar silahına sahipti. Gemi düzeni ve genel görünümü, önceki Saint Louis sınıfının yanı sıra İngiliz Crown Colony sınıfından da etkilenmişti."
 VIC_light_cruiser_1:0 "Duguay-Trouin Sınıfı"
 VIC_light_cruiser_1_desc:0 "Duguay-Trouin hafif kruvazörleri, 1922 deniz programında I. Dünya Savaşı sonrasında inşa edilen ilk büyük Fransız savaş gemileriydi. Üst üste dizilmiş kapalı ana taretlere sahip ilk hafif kruvazörler oldular. Hafif kruvazörler arasında güçlü bir torpido donanımına sahiplerdi ancak neredeyse hiç zırhları yoktu."
 VIC_light_cruiser_2:0 "La Galissonnière Sınıfı"
 VIC_light_cruiser_2_desc:0 "La Galissonnière sınıfı hafif kruvazörler, İtalyan Condottieri tipi hafif kruvazörlere bir yanıttı ve önceki Emile Bertin sınıfı temel alınarak tasarlandı. 1931 ve 1932 deniz programlarında inşa edildiler, dönemin tipik ana silah donanımına ve yeterli uçaksavar silahlarına sahiptiler. 10.850 ton deplasmana sahiptiler, keşif uçakları sayısı artırılmıştı ve iyi hıza sahiptiler."
 VIC_light_cruiser_3:0 "De Grasse Sınıfı"
 VIC_light_cruiser_3_desc:0 "DeGrasse sınıfı kruvazörler, 1938 ve 1939 deniz programlarında onaylandı ve esasen geliştirilmiş La Galissonnière'lerdi. Daha güçlü uçaksavar silahlarına ve daha büyük motorlara sahiptiler. Fransa'nın Düşüşü son iki geminin iptal edilmesine ve baş geminin savaş sonrasında farklı bir tasarımla tamamlanmasına yol açtı. Almanlar onu hafif bir uçak gemisi olarak tamamlamayı planladılar ancak bu proje de gerçekleştirilemedi."
 VIC_light_cruiser_4:0 "Colbert Sınıfı"
 VIC_light_cruiser_4_desc:0 "Colbert, 1956'da denize indirilen bir uçaksavar hafif kruvazörüydü. Bu Colbert sınıfı kruvazör, savaş sonrası De Grasse'ye çok benzer şekilde inşa edilmişti, hem uzun hem de kısa menzilli ağır uçaksavar silahlarına sahipti. Colbert ile DeGrasse arasındaki fark, Colbert'in daha küçük motorlara, daha ince zırha ve biraz daha küçük boyutlara sahip olmasıydı."
 VIC_submarine_1:0 "600 Serisi"
 VIC_submarine_1_desc:0 "600 ton Serisi denizaltılar, Fransa'nın I. Dünya Savaşı sonrası ilk modern denizaltılarıydı. Yaklaşık 600 ton deplasmana sahip orta boy denizaltılardı ancak açık deniz görevleri için tasarlanmışlardı, sahil denizaltıları olarak sınıflandırılmışlardı ve çoğunlukla Akdeniz'in sıcak sularında kullanılmışlardı. Bu tipte her biri dört gemiden oluşan üç sınıf inşa edildi: Sirène, Ariane ve Circé sınıfları. Bunlar, daha büyük olan 630 ton Serisi Argonaute, Diane ve Orion sınıflarının temelini oluşturdular."
 VIC_submarine_2:0 "Minerve Sınıfı"
 VIC_submarine_2_desc:0 "Minerve sınıfı denizaltılar (Proje adı T2), 630 ton Serisi temel alınarak geliştirilmişti ancak daha iyi motorlara ve farklı torpido düzenine sahiplerdi. Bu denizaltılar, DCAN (Direction des Constructions et Armes Navale) tarafından merkezi olarak tasarlanan standartlaştırma programının ilk ürünleriydi, önceki sınıfların oldukça özgün bir tersane tasarımıydı."
 VIC_submarine_3:0 "Roland Morillot Sınıfı"
 VIC_submarine_3_desc:0 "Roland Morillot sınıfı denizaltılar (Proje adı Z2), önceki Redoutable sınıfı denizaltılar temel alınarak geliştirilen büyük okyanus aşırı denizaltılardı. 1.800-2.400 ton deplasmana sahip büyük denizaltılardı ve 10 torpido tüpünden oluşan etkileyici bir silah donanımı taşıyorlardı. Fransa'nın Düşüşü hiçbiri tamamlanamadan gerçekleşti."
 VIC_submarine_4:0 "Phénix Sınıfı"
 VIC_submarine_4_desc:0 "Phénix sınıfı denizaltılar, 1939-40 deniz programlarında onaylanan orta boy okyanus aşırı ve uzun menzilli denizaltılardı ancak savaşın başlaması ve Fransa'nın Düşüşü bu gemilerin iptal edilmesine yol açtı. Redoutable sınıfına benziyorlardı ancak daha küçüklerdi ve 1.200 ton deplasmana sahiptiler. Benzer şekilde ağır bir torpido silah donanımı taşıyorlardı."
 YUG_destroyer_1:0 "Dubrovnik Sınıfı"
 YUG_destroyer_1_desc:0 "Dubrovnik muhribi, satın alındığı sırada Yugoslav filosundaki en büyük gemidi. Gemi İngiltere'de inşa edildi ve 1932'de Yugoslavya'ya teslim edildi. Büyük bir muhripti, 1.880 ton deplasmana sahipti. Dört 140mm/53 Skoda topu, güçlü bir uçaksavar donanımı, altı 533mm torpido tüpü ve iyi denizaltı savunma ekipmanıyla donatılmıştı."
 YUG_destroyer_2:0 "Beograd Sınıfı"
 YUG_destroyer_2_desc:0 "Beograd sınıfı, Fransız yardımıyla inşa edilen üç muhripten oluşuyordu. Gemilerden ikisi Split'te inşa edilirken, üçüncüsü Fransa'da inşa edildi. Üçü de Fransız L'Adroit sınıfı muhripleri temel alınarak tasarlandı ve 1939'da hizmete girdi. 1.210 ton deplasmana sahiptiler ve dört 120mm/43 Skoda topu ve altı 533mm torpido tüpüyle donatılmışlardı. Mükemmel hıza ancak ortalamanın altında menzile sahiptiler."
 YUG_destroyer_4:0 "Split Sınıfı"
 YUG_destroyer_4_desc:0 "Split, Yugoslavya'da denize indirilen ve tamamlanan ağır bir muhripti. 1943'te denize indirildi ancak 1958 yılına kadar modifiye edilmiş bir tasarımla tamamlanamadı. Orijinal tasarımı 2.400 ton deplasmana sahipti ve ana silahı beş 140/56 Skoda topundan oluşuyordu. Boyutuna rağmen mükemmel hıza sahipti."
 YUG_light_cruiser_1:0 "Dalmacija Sınıfı"
 YUG_light_cruiser_1_desc:0 "Eski Alman kruvazörü SMS Niobe, 1925'te genç Yugoslav Kraliyet Donanması'na satıldı ve kapsamlı bir şekilde yeniden inşa edildi. Modern uçaksavar ve Donanma'daki en ağır toplarla donatılan Dalmacija, esas olarak bir topçu eğitim gemisi olarak hizmet verdi."
 YUG_submarine_1:0 "Hrabri Sınıfı"
 YUG_submarine_1_desc:0 "İki Hrabri sınıfı denizaltı, orijinalde Kraliyet Donanması için İngiliz L sınıfı denizaltılar olarak kızağa konmuştu ancak modifiye edilmiş bir tasarımla 1928'de Yugoslavya için satıldı ve tamamlandı. Büyük denizaltılardı, 975 ton deplasmana sahiptiler ve altı 533mm torpido tüpüyle donatılmışlardı."
 YUG_submarine_2:0 "Osvetnik Sınıfı"
 YUG_submarine_2_desc:0 "İki Osvetnik sınıfı denizaltı, Fransa'da Circe sınıfı denizaltıların tasarımı temel alınarak tasarlandı ve inşa edildi. Önceki Hrabri sınıfı denizaltılardan biraz daha küçüktüler. Altı 533mm torpido tüpüyle donatılmışlardı, yine de karşılaştırılabilir bir darbeye sahiptiler."
 advanced_ship_hull_submarine:0 "$ship_hull_submarine_4$"
 basic_ship_hull_submarine:0 "$ship_hull_submarine_2$"
 battle_cruiser_1:0 "Muharebe Kruvazörü I"
 battle_cruiser_1_desc:0 "Savaş sonrası muharebe kruvazörü silahlanma yarışı, zırhı savaş gemilerine kıyasla hız uğruna feda eden birkaç ağır silahlı tasarımla sonuçlandı."
 battle_cruiser_2:0 "Muharebe Kruvazörü II"
 battle_cruiser_2_desc:0 "Yeniden inşa edilmiş ve yeniden tasarlanmış muharebe kruvazörleri, daha hafif korumayla modern savaş gemisi tasarımlarını bile geride bırakmaya devam ediyor, ancak ateş kontrolü, tespit ve hava savunması için daha iyi sistemler geliştirdi."
 battle_cruiser_3:0 "Muharebe Kruvazörü III"
 battle_cruiser_4:0 "Muharebe Kruvazörü IV"
 battleship_1:0 "Savaş Gemisi I"
 battleship_1_desc:0 "Bazıları tarafından geçmiş bir deniz savaşı döneminin kalıntısı, diğerleri tarafından şimdiye kadar inşa edilmiş en etkileyici gemiler olarak kabul edilen bu savaş gemisi silahlanma yarışı kalıntılarının, şimdiye kadar inşa edilmiş en ağır silahlı ve zırhlı gemilerden bazılarını oluşturduğu inkar edilemez."
 battleship_2:0 "Savaş Gemisi II"
 battleship_2_desc:0 "Geliştirilmiş stabilite ve menzille, yeni nesil savaş gemileri, deniz anlaşmalarının belirlediği sınırlar içinde kalarak önceki tasarımları geliştiriyor."
 battleship_3:0 "Savaş Gemisi III"
 battleship_3_desc:0 "Daha kalın zırh, daha güçlü motorlar, yüksek kalibreli toplardan oluşan bir batarya ve geliştirilmiş uçaksavar yetenekleri, deniz savaşının giderek daha fazla hava desteğiyle domine edildiği bir dünyada, savaş gemilerinin doğru şekilde kullanılırsa geçerli kalmasını sağlayabilir."
 battleship_4:0 "Savaş Gemisi IV"
 battleship_4_desc:0 "Dünya, muhtemelen son büyük savaş gemisi çatışmalarını görürken, ağır silahların ve uçaksavar taretlerinin önemi hiç olmadığı kadar büyük."
 battleship_5:0 "Savaş Gemisi V"
 battleship_6:0 "Savaş Gemisi VI"
 capital_ship:0 " Ana Gemiler"
 carrier_1:0 "Uçak Gemisi I"
 carrier_1_desc:0 "Birçok askeri teorisyen, deniz havacılığının gelecek olduğuna inanıyor. Eski savaş gemilerinin ve okyanus gemilerinin uçak taşımak üzere dönüştürülmesi, bu yeni doktrinleri kullanmaya yönelik ilk adım olacaktır."
 carrier_2:0 "Uçak Gemisi II"
 carrier_2_desc:0 "İlk gövdeden uçak gemisi tasarımları üzerinde çalışmalar başlarken, bu gemilerin donanmamızın geri kalanına yetişebilecek menzil ve hıza sahip olmasını sağlamalıyız, aynı zamanda savaş sonrası deniz anlaşmalarına saygı göstererek."
 carrier_3:0 "Uçak Gemisi III"
 carrier_3_desc:0 "Geliştirilmiş inşaat yöntemleri ve güverte kenarı asansörleri gibi daha özelleşmiş sistemler, bu uçak gemilerinin daha fazla uçağı daha verimli bir şekilde taşımasına olanak tanır."
 carrier_4:0 "Uçak Gemisi IV"
 carrier_4_desc:0 "Birçok deniz anlaşması artık giderek daha fazla göz ardı edilirken, hava üstünlüğü sağlamak için şimdiye kadarkinden daha fazla uçak taşıyabilen uçak gemileri inşa etmeye devam edebiliriz."
 carrier_5:0 "Uçak Gemisi V"
 carrier_6:0 "Uçak Gemisi VI"
 cruiser_submarine:0 "$ship_hull_cruiser_submarine$"
 cruiser_submarine_desc:0 "$ship_hull_cruiser_submarine_desc$"
 destroyer_1:0 "Muhrip I"
 destroyer_1_desc:0 "Konvoyların güvenliğini sağlamak için, Büyük Savaş'ın muhripleri yeniden tasarlanmalı ve geliştirilmelidir. Gemilere daha fazla torpido yerleştirilmesi, daha fazla angajman fırsatı sağlayacaktır."
 destroyer_2:0 "Muhrip II"
 destroyer_2_desc:0 "Daha uzun torpido menzili ve daha hızlı yeniden doldurma hızları, anti-havya taretleri gibi yeni silah türleriyle birlikte, muhriplerimizin verimli ve çok yönlü kalmasını sağlayacaktır."
 destroyer_3:0 "Muhrip III"
 destroyer_3_desc:0 "Yukarıdan ve aşağıdan gelen tehditlerle daha iyi başa çıkabilmek için yeni muhripler radar ve modern anti-havya/denizaltı silahlarıyla donatılmalıdır."
 destroyer_4:0 "Muhrip IV"
 destroyer_4_desc:0 "Modern muhrip, çeşitli farklı tespit teknolojileri, yeni su bombası fırlatma sistemleri ile donatılmalı ve öncüllerinden daha büyük ölçekte inşa edilmelidir."
 early_ship_hull_submarine:0 "$ship_hull_submarine_1$"
 escort_carrier:0 "Refakatçi Uçak Gemisi"
 escort_carrier_desc:0 "Doğrudan filo harekatı yerine genellikle konvoy eskortu ve denizaltı savunma harbi için kullanılan daha küçük, daha ucuz bir uçak gemisi. Küçük ama kullanışlı bir hava grubu taşır."
 fleet_submarine:0 "$ship_hull_fleet_submarine$"
 fleet_submarine_desc:0 "$ship_hull_fleet_submarine_desc$"
 heavy_cruiser_1:0 "Ağır Kruvazör I"
 heavy_cruiser_1_desc:0 "Washington Denizcilik Antlaşması, kruvazörler de dahil olmak üzere bir silahlanma yarışını önlemek için kuruldu, ancak bu kaçınılmaz görünüyor. Zırhı hafif tutarak silah yükü artırılabilir."
 heavy_cruiser_2:0 "Ağır Kruvazör II"
 heavy_cruiser_2_desc:0 "Yeni anlaşma çabalarına rağmen, daha hafif kruvazörleri daha ağır silahlarla yeniden donatmak hala verimlidir, ancak zırh hala sınırlıdır."
 heavy_cruiser_3:0 "Ağır Kruvazör III"
 heavy_cruiser_3_desc:0 "Dünya çapında kısıtlamalar giderek daha fazla göz ardı edilirken, zırha daha fazla öncelik veren daha dengeli ağır kruvazör tasarımları inşa edilebilir. Daha iyi uçaksavar topları, bu gemilerin deniz hava savaşında işbirliği yapmasına olanak tanır."
 heavy_cruiser_4:0 "Ağır Kruvazör IV"
 heavy_cruiser_4_desc:0 "Hızlı ateş eden silahlara sahip, daha büyük, daha uzun ve daha ağır tasarımlar, ağır kruvazör gelişiminin bu son aşamalarının özellikleridir."
 improved_ship_hull_submarine:0 "$ship_hull_submarine_3$"
 light_cruiser_1:0 "Hafif Kruvazör I"
 light_cruiser_1_desc:0 "Yüksek hızını koruyabilen manevra kabiliyetine sahip hafif kruvazörler, keşif görevleri için kullanışlı olmaya devam edecektir."
 light_cruiser_2:0 "Hafif Kruvazör II"
 light_cruiser_2_desc:0 "Savaş sonrası anlaşmalar kruvazörlere kısıtlamalar getirdi, ancak bu sınırlar içinde kalarak iyi silahlandırılmış hafif gemiler geliştirilebilir."
 light_cruiser_3:0 "Hafif Kruvazör III"
 light_cruiser_3_desc:0 "Artık anlaşma sınırlarını zorlayan, daha büyük ve daha ağır zırhlı kruvazörler, hala hafif kruvazör olarak sınıflandırılabilecek kadar hafif silahlarla inşa edilebilir."
 light_cruiser_4:0 "Hafif Kruvazör IV"
 light_cruiser_4_desc:0 "Daha büyük gemileri korumak için taktiksel olarak konuşlandırılan modern nesil hafif kruvazörler, geçmiş kısıtlamaların çoğundan kurtulabilir ve hava saldırılarıyla başa çıkmak için daha iyi silahlandırılabilir."
