 naval_equipment:0 " Gemiler"
 nuclear_missile_submarine:0 "Nükleer Füze Denizaltısı"
 nuclear_missile_submarine_desc:0 "Hedeflerimize karşı nükleer füzeler taşıyıp fırlatabilen denizaltılar. Gerçek anlamda dünyaları yok eden ölüm makineleri olabilirler - ve bunu asla göremeyiz bile."
 nuclear_submarine:0 "$ship_hull_nuclear_submarine$"
 nuclear_submarine_desc:0 "$ship_hull_nuclear_submarine_desc$"
 repair_ship:0 "Onarım Gemisi"
 repair_ship_1:0 "Onarım Gemisi"
 repair_ship_1_desc:0 "Onarım gemileri, ağır hasar almış bir geminin limana geri dönmesi ile batması arasındaki farkı yaratabilecek ağır hizmet tipi kurtarma teçhizatı taşır."
 repair_ship_2:0 "Gelişmiş Onarım Gemisi"
 repair_ship_2_desc:0 "Dost savaş gemilerini en kritik hasarlar dışındaki her şeyden kurtarabilecek son teknoloji teçhizata sahip, daha da yetenekli bir onarım gemisi."
 repair_ship_hull:0 "Onarım Gemisi"
 rocket_submarine:0 "Füze Fırlatmalı Denizaltı"
 rocket_submarine_desc:0 "Füze ve fırlatma sistemleriyle donatılmış yeni nesil denizaltılar, düşmanlarımızın stratejik hedeflerine beklenmedik saldırılar yapma fırsatı sunuyor"
 screen_ship:0 " Perdeleme Gemileri"
 ship_hull_carrier:0 " Uçak Gemisi"
 ship_hull_carrier_0:0 "İlkel Uçak Gemisi"
 ship_hull_carrier_1:0 "Temel Uçak Gemisi"
 ship_hull_carrier_1_desc:0 "Birçok askeri teorisyen, deniz havacılığının gelecek olduğuna inanıyor. Eski savaş gemilerinin ve okyanus gemilerinin uçak taşımak üzere dönüştürülmesi, bu yeni doktrinleri kullanmaya yönelik ilk adım olacaktır."
 ship_hull_carrier_2:0 "Gelişmiş Uçak Gemisi"
 ship_hull_carrier_2_desc:0 "İlk gövdeden uçak gemisi tasarımları üzerinde çalışmalar başlarken, bu gemilerin donanmamızın geri kalanına yetişebilecek menzil ve hıza sahip olmasını sağlamalıyız, aynı zamanda savaş sonrası deniz anlaşmalarına saygı göstererek."
 ship_hull_carrier_3:0 "İleri Uçak Gemisi"
 ship_hull_carrier_3_desc:0 "Geliştirilmiş inşaat yöntemleri ve güverte kenarı asansörleri gibi daha özelleşmiş sistemler, bu uçak gemilerinin daha fazla uçağı daha verimli bir şekilde taşımasına olanak tanır."
 ship_hull_carrier_conversion_bb:0 "Dönüştürülmüş Savaş Gemisi"
 ship_hull_carrier_conversion_bb_desc:0 "Yıllarca süren deneylerden sonra, uçak gemisi yavaş yavaş kendi gemisi sınıfına dönüştü. Giderek daha güçlü hale gelen daha fazla sayıda uçağı destekleyebilen uçak gemisi, deniz gücü projeksiyonunda son söz olmaya hazır duruyor."
 ship_hull_carrier_conversion_ca:0 "Dönüştürülmüş Kruvazör"
 ship_hull_carrier_conversion_ca_desc:0 "Yıllarca süren deneylerden sonra, uçak gemisi yavaş yavaş kendi gemisi sınıfına dönüştü. Giderek daha güçlü hale gelen daha fazla sayıda uçağı destekleyebilen uçak gemisi, deniz gücü projeksiyonunda son söz olmaya hazır duruyor."
 ship_hull_carrier_desc:0 "Yıllarca süren deneylerden sonra, uçak gemisi yavaş yavaş kendi gemisi sınıfına dönüştü. Giderek daha güçlü hale gelen daha fazla sayıda uçağı destekleyebilen uçak gemisi, deniz gücü projeksiyonunda son söz olmaya hazır duruyor."
 ship_hull_carrier_modern:0 "Modern Uçak Gemisi"
 ship_hull_carrier_modern_desc:0 "En büyük ve en gelişmiş uçak gemileri, en yeni teknolojileri, ekipmanları ve gelişmeleri kullanabilir. 'Son teknoloji' silahların somut örneğidir."
 ship_hull_carrier_submarine:0 "Denizaltı Uçak Gemisi"
 ship_hull_carrier_submarine_desc:0 "Çeşitli hava görevlerini yerine getirebilecek uçakları barındırabilen ve fırlatabilen büyük bir denizaltı gövdesi."
 ship_hull_cruiser:0 " Kruvazör"
 ship_hull_cruiser_1:0 "İlkel Kruvazör"
 ship_hull_cruiser_1_desc:0 "Washington Denizcilik Antlaşması'nın şartlarına tabi olsa da, kruvazör hala en esnek savaş gemisidir. Bu gövde, perdeleme ve keşif için bir hafif kruvazör veya savaş hattını desteklemek için bir ağır kruvazör inşasına olanak tanır."
 ship_hull_cruiser_2:0 "Temel Kruvazör"
 ship_hull_cruiser_2_desc:0 "Yeni nesil kruvazörler, hayatta kalma şansını artıran yeni motor düzenlemelerinin yanı sıra özel uçak tesisleri için alana sahiptir."
 ship_hull_cruiser_3:0 "Gelişmiş Kruvazör"
 ship_hull_cruiser_3_desc:0 "Dünya çapındaki kruvazörler daha güçlü ve yetenekli hale geldikçe, gerekli tüm ek ekipmanı barındırmak için yeni ve daha büyük gövdeler gereklidir."
 ship_hull_cruiser_4:0 "İleri Kruvazör"
 ship_hull_cruiser_4_desc:0 "Savaş deneyimlerinden etkilenen en yeni kruvazör nesli, uçaksavar silahları için daha geniş ateş alanları sağlamak üzere yeniden düzenlenmiş bir üst yapıya ve radar kullanımını desteklemek için yeni iç düzenlere sahiptir."
 ship_hull_cruiser_coastal_defense_ship:0 "Sahil Savunma Gemisi"
 ship_hull_cruiser_coastal_defense_ship_desc:0 "Gerçek okyanus savaşları için çok küçük olan bu nispeten ucuz gemi, menzili ağır silahlar ve zırh uğruna feda eder."
 ship_hull_cruiser_desc:0 "Filonun beygiri olan kruvazörler, hafif kruvazörler için keşif ve perdelemeden ağır kruvazörler için savaş hattını desteklemeye kadar birçok önemli görevi üstlenir."
 ship_hull_cruiser_panzerschiff:0 "Panzerschiff"
 ship_hull_cruiser_panzerschiff_desc:0 "İmkansızı başarmaya çalışan Alman mühendisler, neredeyse savaş gemisi seviyesinde silahları bir kruvazör gövdesiyle birleştirmeyi başardı. Sonuç, bilinen diğer tüm kruvazörlerden daha güçlü silahlara sahip, ancak aynı zamanda pahalı, nispeten yavaş ve görece zayıf zırhlı bir gemidir."
 ship_hull_cruiser_submarine:0 "Kruvazör Denizaltı"
 ship_hull_cruiser_submarine_desc:0 "Daha uzun menzil için optimize edilmiş daha büyük bir denizaltı gövdesi. Daha da fazla menzil için ek yakıt tankları veya küçük bir keşif uçağı ile donatılabilir."
 ship_hull_escort_carrier:0 "Refakatçi Uçak Gemisi"
 ship_hull_escort_carrier_desc:0 "Doğrudan filo harekatı yerine genellikle konvoy eskortu ve denizaltı savunma harbi için kullanılan daha küçük, daha ucuz bir uçak gemisi. Küçük ama kullanışlı bir hava grubu taşır."
 ship_hull_fleet_submarine:0 " Filo Denizaltısı"
 ship_hull_fleet_submarine_desc:0 "Uzun operasyonel menzilleri sayesinde yüzey filosu eskortları olarak hareket edebilen ve destek sağlayabilen denizaltılar."
 ship_hull_heavy:0 " Ağır Gemi"
 ship_hull_heavy_1:0 "İlkel Ağır Gemi"
 ship_hull_heavy_1_desc:0 "Bazıları tarafından geçmiş bir deniz savaşı döneminin kalıntısı, diğerleri tarafından şimdiye kadar inşa edilmiş en etkileyici gemiler olarak kabul edilen bu savaş gemisi silahlanma yarışı kalıntılarının, şimdiye kadar inşa edilmiş en ağır silahlı ve zırhlı gemilerden bazılarını oluşturduğu inkar edilemez."
 ship_hull_heavy_2:0 "Temel Ağır Gemi"
 ship_hull_heavy_2_desc:0 "Geliştirilmiş stabilite ve menzille, yeni nesil savaş gemileri, deniz anlaşmalarının belirlediği sınırlar içinde kalarak önceki tasarımları geliştiriyor."
 ship_hull_heavy_3:0 "Gelişmiş Ağır Gemi"
 ship_hull_heavy_3_desc:0 "Daha kalın zırh, daha güçlü motorlar, yüksek kalibreli toplardan oluşan bir batarya ve geliştirilmiş uçaksavar yetenekleri, deniz savaşının giderek daha fazla hava desteğiyle domine edildiği bir dünyada, savaş gemilerinin doğru şekilde kullanılırsa geçerli kalmasını sağlayabilir."
 ship_hull_heavy_4:0 "İleri Ağır Gemi"
 ship_hull_heavy_4_desc:0 "Dünya, muhtemelen son büyük savaş gemisi çatışmalarını görürken, ağır silahların ve uçaksavar taretlerinin önemi hiç olmadığı kadar büyük."
 ship_hull_heavy_desc:0 "Deniz gücünün nihai sembolü olan bu devasa, ağır zırhlı behemothlar, bazı uzmanların uçak ve denizaltı çağındaki rollerini sorgulamasına rağmen, hala açık denizlerde saygı uyandırıyor."
 ship_hull_heavy_modern:0 "Modern Savaş Gemisi"
 ship_hull_light_1:0 "İlkel Muhrip"
 ship_hull_light_1_desc:0 "Konvoyların güvenliğini sağlamak için, Büyük Savaş'ın muhripleri yeniden tasarlanmalı ve geliştirilmelidir. Gemilere daha fazla torpido yerleştirilmesi, daha fazla angajman fırsatı sağlayacaktır."
 ship_hull_light_2:0 "Temel Muhrip"
 ship_hull_light_2_desc:0 "Daha uzun torpido menzili ve daha hızlı yeniden doldurma hızları, anti-havya taretleri gibi yeni silah türleriyle birlikte, muhriplerimizin verimli ve çok yönlü kalmasını sağlayacaktır."
 ship_hull_light_3:0 "Gelişmiş Muhrip"
 ship_hull_light_3_desc:0 "Yukarıdan ve aşağıdan gelen tehditlerle daha iyi başa çıkabilmek için yeni muhripler radar ve modern anti-havya/denizaltı silahlarıyla donatılmalıdır."
 ship_hull_light_4:0 "İleri Muhrip"
 ship_hull_light_4_desc:0 "Modern muhrip, çeşitli farklı tespit teknolojileri, yeni su bombası fırlatma sistemleri ile donatılmalı ve öncüllerinden daha büyük ölçekte inşa edilmelidir."
 ship_hull_mega_carrier:0 "Buz Uçak Gemisi"
 ship_hull_mega_carrier_desc:0 "Pykrete gibi deneysel buz kompozitlerinden yapılmış devasa uçak gemisi, düzenli uçakların ondan havalanmasına izin vererek deniz havacılığımızın menzilini artırır."
 ship_hull_midget_submarine:0 "Cüce Denizaltı"
 ship_hull_midget_submarine_desc:0 "Küçük bir mürettebat tarafından işletilen küçük boyutlu bir denizaltı. Azaltılmış menzili ve silah kapasitesi, yüksek üretim hızıyla dengelenir."
 ship_hull_nuclear_submarine:0 "Nükleer Denizaltı"
 ship_hull_nuclear_submarine_desc:0 "Nükleer reaktörlerle denizaltılarımız, yüksek hızı korurken su altında çok uzun süre çalışabilir, bu da onları cephaneliğimizdeki son derece ölümcül bir araç haline getirir."
 ship_hull_pre_dreadnought:0 "Ön Dretnot"
 ship_hull_pre_dreadnought_desc:0 "Büyük Savaş'a yol açan dretnought yarışından bile önceki bir dönemin hayatta kalanı olan Dretnought Öncesi, bu gün ve çağda çok sınırlı bir savaş değerine sahiptir."
 ship_hull_submarine:0 " Denizaltı"
 ship_hull_submarine_1:0 "İlkel Denizaltı"
 ship_hull_submarine_1_desc:0 "Denizaltılar, savunmasız konvoyları imha etmek için tasarlanmış gizli gemilerdir. Büyük Savaş'ın erken modelleri, deniz savaşında yeni yöntemlerin önünü açmıştır."
 ship_hull_submarine_2:0 "Temel Denizaltı"
 ship_hull_submarine_2_desc:0 "Daha iyi silahlandırılmış ve daha stabil olan yeni denizaltı tasarımları, deniz taktiklerindeki gelişmelerden faydalanmak üzere yapılmış olup daha uzun menzile sahiptir ve uzak konvoy rotalarına saldırabilir."
 ship_hull_submarine_3:0 "Gelişmiş Denizaltı"
 ship_hull_submarine_3_desc:0 "Denizaltının filodaki rolü, konvoy saldırıları dışında hala tartışma konusudur. Hız, menzil ve silahların kombinasyonu arasında bir denge sağlamak, gerekli modelin anahtarı olacaktır."
 ship_hull_submarine_4:0 "İleri Denizaltı"
 ship_hull_submarine_4_desc:0 "Artan test derinliği ve verimli düzenler, modern denizaltıların özellikleri olacak ve saha deneyiminden yararlanarak uygun silah ve motorlar seçilecektir."
 ship_hull_submarine_desc:0 "Büyük Savaş'ın ilkel teknelerinden çok uzakta olan modern denizaltı, şimdiye kadarkinden daha yeteneklidir ve çok makul bir maliyetle en büyük gemiyi bile tehdit edebilir."
 ship_hull_super_heavy_1:0 "Süper Ağır Savaş Gemisi"
 ship_hull_super_heavy_1_desc:0 "Dünyanın mevcut durumu, deniz anlaşmalarına uymak için artık hiçbir yer bırakmıyor. Bu sınırlamalar olmadan, tamamen şimdiye kadarki en ağır, en iyi silahlandırılmış savaş gemilerini yaratmaya odaklanabiliriz, birden fazla daha küçük gemiyi etkisiz hale getirebilen."
 ship_hull_torpedo_cruiser:0 "Torpido Kruvazörü"
 ship_hull_torpedo_cruiser_desc:0 "Daha küçük bir ana batarya ve daha az uçaksavar topu pahasına çok sayıda torpido tüpüyle donatılmış hafif kruvazörler."
 submarine_1:0 "Denizaltı I"
 submarine_1_desc:0 "Denizaltılar, savunmasız konvoyları imha etmek için tasarlanmış gizli gemilerdir. Büyük Savaş'ın erken modelleri, deniz savaşında yeni yöntemlerin önünü açmıştır."
 submarine_2:0 "Denizaltı II"
 submarine_2_desc:0 "Daha iyi silahlandırılmış ve daha stabil olan yeni denizaltı tasarımları, deniz taktiklerindeki gelişmelerden faydalanmak üzere yapılmış olup daha uzun menzile sahiptir ve uzak konvoy rotalarına saldırabilir."
 submarine_3:0 "Denizaltı III"
 submarine_3_desc:0 "Denizaltının filodaki rolü, konvoy saldırıları dışında hala tartışma konusudur. Hız, menzil ve silahların kombinasyonu arasında bir denge sağlamak, gerekli modelin anahtarı olacaktır."
 submarine_4:0 "Denizaltı IV"
 submarine_4_desc:0 "Artan test derinliği ve verimli düzenler, modern denizaltıların özellikleri olacak ve saha deneyiminden yararlanarak uygun silah ve motorlar seçilecektir."
 support_ship:0 "Destek Gemisi"
 support_ship_1:0 "Destek Gemisi"
 support_ship_1_desc:0 "Destek gemileri, savaş filosunun lojistik desteğine odaklanan, yedek yakıt ve malzeme stoklarıyla operasyonel dayanıklılığı artıran muharip olmayan gemilerdir."
 support_ship_2:0 "Gelişmiş Destek Gemisi"
 support_ship_2_desc:0 "Savaş filosunu daha da büyük mesafelerde destekleyebilen, daha gelişmiş ve yetenekli bir destek gemisi."
 support_ship_hull:0 "Destek Gemisi"
 torpedo_cruiser:0 "Torpido Kruvazörü"
 torpedo_cruiser_desc:0 "Çok sayıda torpido tüpüyle donatılmış hafif kruvazörler, daha küçük bir ana batarya ve daha az uçaksavar topu pahasına."
