 sp_centrifugal_jet_tech:0 "Santrifüj Jet"
 sp_centrifugal_jet_tech_desc:0 "Santrifüj jetler, emme havasını sıkıştırmak için tek aşamalı bir kompresör kullanır, ardından itki yaratmak için dışarı püskürtür. Bu, daha küçük, daha kolay bakımı yapılan motorlarla sonuçlanır."
