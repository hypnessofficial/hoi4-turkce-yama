 non_strategic_materials_medium_desc:0 "$non_strategic_materials_small_desc$"
 non_strategic_materials_small:0 "Stratejik Olmayan Malzeme Kullanımı"
 non_strategic_materials_small_desc:0 "Mümkün olan her yerde alüminyum yerine özel işlem görmüş ahşap veya kumaş kullanarak, stratejik malzeme kullanımını önemli ölçüde azaltabiliriz. Ancak, ahşap ve kumaş modern silahlara karşı pek iyi dayanmaz."
 photo_reconnaisance:0 "Fotoğrafik Keşif"
 photo_reconnaisance_desc:0 "Uçağın ilk açık askeri amacı düşmanı bulmak ve yerini yerdeki Generallere bildirmekti. Bu hala askeri havacılığın en yaygın görevlerinden biri olmaya devam ediyor."
 plane_modules_tech:0 "Uçak Modülleri"
 radio_navigation_1:0 "Radyo Navigasyonu I"
 radio_navigation_1_desc:0 "İki oldukça basit radyo-navigasyon ışınının kesişimini dinleyen bir radyo alıcısı, zifiri karanlıkta bile bir hedef bulmayı mümkün kılar."
 radio_navigation_2:0 "Radyo Navigasyonu II"
 radio_navigation_2_desc:0 "Hedefi göremese bile bombacıya bombaların bırakılması gereken tam anı söyleyen bir dizi mesafe ölçüm yardımcısı da içeren bir radyo alıcısı."
 range_improvements:0 "Menzil Geliştirmeleri"
 range_improvements_desc:0 "Daha fazla yakıt kapasitesi eklemenin bir uçağın menzilini artıracağı açık görünse de, bu kapasiteyi bir uçağa uçuş performansını çok fazla etkilemeden eklemek hiç de kolay değildir."
 recon_camera:0 "Keşif Kamerası"
 recon_camera_desc:0 "Özel lensli bir dizi kamera, uçağın yüksek irtifadan bile düşman oluşumlarının ve tesislerinin doğru resimlerini çekmesini sağlar."
 rocket_engine_1:0 "Roket Motoru I"
 rocket_engine_1_desc:0 "Çok uçucu yakıtlar ve benzer şekilde kararsız bir oksitleyici kullanan bu motor, menzil pahasına bir uçağı yüksek hızlara çıkarmak için çok büyük miktarda itki üretebilir."
 rocket_engine_2:0 "Roket Motoru II"
 rocket_engine_2_desc:0 "Yanma odasındaki iyileştirmeler ve yakıt karışımındaki küçük değişiklikler, menzilde buna karşılık gelen bir düşüşle daha da yüksek performansa izin verir."
 rocket_engine_3:0 "Roket Motoru III"
 rocket_engine_3_desc:0 ""
 rocket_propelled_bombs:0 "Roket Tahrikli Bombalar"
 rocket_propelled_bombs_desc:0 "Roket tahrikli güdümsüz bombalar, gemilere ve benzeri zırhlı büyük hedeflere önemli hasar verebilir."
 rocket_rails:0 "Roket Rayları"
 rocket_rails_desc:0 "Kanatların altına asılan güdümsüz mermiler. Saldıran uçağın önünden ateşlendikleri için, pilotun bombalara kıyasla hedefe nişan alması çok daha kolaydır."
