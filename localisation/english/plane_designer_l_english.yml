 engine_2_6x:0 "6x Motor II"
 engine_2_6x_desc:0 "$engine_1_6x_desc$"
 engine_3_1x:0 "1x Motor III"
 engine_3_1x_desc:0 "Metanol enjeksiyonu ve otomatik karışım gibi gelişmiş özellikleri bünyesinde barındıran bu motor, önemli ölçüde daha fazla güç üretebilmektedir."
