 self_sealing_fuel_tanks_small:0 "Kendinden Sızdırmaz Yakıt Tankları"
 self_sealing_fuel_tanks_small_desc:0 "Yakıt tanklarının etrafına özel işlem görmüş bir kauçuk tabakası ekleyerek, yakıt tankına isabet eden bir darbe uçağı sakat bırakmaz, çünkü tank zamanla kendini kapatarak yakıt kaybını önler."
 small_bomb_bay:0 "Küçük Bomba Yuvası"
 small_bomb_bay_desc:0 "Bomba taşımak için küçük bir yuva. Gövde içinde olması sürtünmeyi azaltır, ancak bunun için gerekli yapısal değişiklikler uçağın hava muharebesinde radikal manevralar yapamayacağı anlamına gelir."
 small_plane_airframe:0 "$fighter_equipment$"
 small_plane_airframe_0:0 "Savaşlar Arası Dönem Küçük Uçak Gövdesi"
 small_plane_airframe_0_desc:0 "Büyük Savaş'ın ilk günlerinden bu yana havacılık büyük bir hızla ilerledi. Bu uçak gövdesi bu gelişmelerin bir sonucunu temsil etse de büyüme potansiyelinin sınırlı olduğu açıktır."
 small_plane_airframe_1:0 "Temel Küçük Uçak Gövdesi"
 small_plane_airframe_1_desc:0 "Son yıllarda, çok yetenekli ancak küçük uçakların yapımına olanak tanıyan bir dizi yeni teknoloji ortaya çıktı. Bu uçak gövdesi, bu yoldaki sadece ilk adımı temsil ediyor."
 small_plane_airframe_2:0 "Geliştirilmiş Küçük Uçak Gövdesi"
 small_plane_airframe_2_desc:0 "Geliştirilmiş aerodinamik ve daha sağlam yapısıyla bu uçak gövdesi, temel modele kıyasla açık bir ilerlemeyi temsil eder."
 small_plane_airframe_3:0 "Gelişmiş Küçük Uçak Gövdesi"
 small_plane_airframe_3_desc:0 "Performans için tamamen optimize edilmiş olan bu uçak gövdesi, pistonlu bir uçakla yapılabileceklerin mutlak maksimumunu temsil eder."
 small_plane_airframe_4:0 "Modern Küçük Uçak Gövdesi"
 small_plane_airframe_4_desc:0 "Bu uçak gövdesi, modern motorların sunduğu yüksek hızlardan yararlanmak ve yüksek ses altı hızlarda uçmanın getirdiği bazı yapısal sorunları çözmek için tasarlanmıştır."
 small_plane_airframe_5:0 "Süpersonik Küçük Uçak Gövdesi"
 small_plane_airframe_5_desc:0 "Mach 1 süpersonik uçuşa yetenekli bu gelişmiş uçak gövdesi, insan mühendisliğinin zirvesini temsil eder."
 small_plane_airframe_desc:0 "Bu küçük, tek veya çift motorlu uçağın yük kapasitesindeki eksiğini, hız ve manevra kabiliyeti ile telafi eder."
