 fuel_tanks_medium_desc:0 "$fuel_tanks_small_desc$"
 fuel_tanks_small:0 "Ek Yakıt Tankları"
 fuel_tanks_small_desc:0 "Uçak gövdesinin daha fazla iç alanını yakıta ayırmak uçağın menzilini artırır, ancak aynı zamanda uçağı çok daha yanıcı hale getirir."
 guided_anti_ship_missile:0 "Güdümlü Gemi Savar Füzesi"
 guided_anti_ship_missile_desc:0 "Aslında roket motorlu ve radyo güdümlü bir gemi savar bombası olan bu yeni savaş silahı, şu anda denizde olan tüm gemiler için ciddi bir tehdittir."
 heavy_bomb_locks:0 "Ağır Bomba Kilitleri"
 heavy_bomb_locks_desc:0 "Kanatların veya gövdenin altına büyük bombalar için yapılan bağlantılar, uçağın yer hedeflerine büyük bir etkiyle saldırmasına olanak tanır."
 heavy_bombs:0 "Ağır Bombalar"
 heavy_bombs_desc:0 "Modern Savaş, uçakların düşman hedeflerine giderek daha büyük bombalar atmasını gerektirir. Zamanla bu, hava savaşının temel bir yönü haline gelmiştir."
 heavy_mg_2x:0 "2x Ağır Makineli Tüfek"
 heavy_mg_2x_desc:0 "Bir çift ağır makineli tüfek, modern uçakların sertleştirilmiş dış kaplamasına nüfuz etmeye olanak tanır."
 heavy_mg_4x:0 "4x Ağır Makineli Tüfek"
 heavy_mg_4x_desc:0 "Dört ağır makineli tüfek, hem bireysel performansta hem de sırf atış hacminde korkunç bir ateş gücü sunar."
 hmg_defense_turret:0 "Ağır MT Savunma Tareti"
 hmg_defense_turret_2x:0 "Ağır MT Savunma Tareti x2"
 hmg_defense_turret_2x_desc:0 "Ağır makineli tüfekli iki güçlü taret seti, saldıran herhangi bir avcı için tehlikeli bir hedef oluşturur."
 hmg_defense_turret_desc:0 "Döner bir taretteki ağır makineli tüfek, savunmacının benzer silahlarla donanmış bir avcıya karşı bir miktar başarı umuduyla karşılık vermesini sağlar."
