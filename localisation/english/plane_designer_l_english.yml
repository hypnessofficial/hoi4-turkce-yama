 aa_cannon_1:0 "Toplar I"
 aa_cannon_1_desc:0 "Bir top mermisi en zorlu uçağı bile delebilirken, potansiyel olarak isabet ettiğinde ölümcül hasar verecek kadar patlayıcı taşıyabilir."
 aa_cannon_2:0 "Büyük Toplar"
 aa_cannon_2_desc:0 "Daha yüksek bir kalibre ve daha büyük bir mermi ile bu toplar, tek bir vuruşta büyük uçakları bile düşürebilir."
 aa_cannon_3:0 "Toplar II"
 aa_cannon_3_desc:0 "Yüksek hızda büyük bir mermi ateşleyen modern bir topla, en zorlu uçağı bile düşürebiliriz."
 aa_hmg:0 "Ağır MT"
 aa_hmg_desc:0 "Modern uçaklar, eski modellere göre önemli ölçüde daha fazla cezaya dayanabilirken, aynı zamanda isabet kaydetmek için daha az fırsat sunar. Bu nedenle her isabetin maksimum hasarı vermesi gerekir, bu da daha büyük bir fişek gerektirir."
 aa_lmg:0 "Hafif MT"
 aa_lmg_desc:0 "Tüfek kalibreli makineli tüfekler, Büyük Savaş günlerinden beri hava-hava silahlarının temelini oluşturmuştur."
