 improved_rocket_propelled_bombs:0 "Ağır Roket Tahrikli Bombalar"
 improved_rocket_propelled_bombs_desc:0 "Daha da büyük roket tahrikli güdümsüz bombalar, daha ağır bir yük taşıyarak hedeflerine daha da etkili bir şekilde nüfuz edebilir."
