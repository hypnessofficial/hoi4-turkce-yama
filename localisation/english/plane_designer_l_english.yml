 jet_engine_axial_6x_desc:0 "$engine_1_6x_desc$"
 large_aircraft_cannon_1x:0 "1x Büyük Top"
 large_aircraft_cannon_1x_desc:0 "Önceki otomatik top versiyonlarından daha büyük ve daha güçlü bir mermiyi daha yavaş hızlarda ateşleyen bu silah, tek bir vuruşta büyük bir uçak gövdesini bile düşürebilir."
 large_aircraft_cannon_2x:0 "2x Büyük Top"
 large_aircraft_cannon_2x_desc:0 "Çift top, uçağa önemli miktarda vuruş gücü verirken, artan atış hacmi, ölümcül isabetler kaydetmeyi daha da kolaylaştırır."
 large_bomb_bay:0 "Büyük Bomba Yuvası"
 large_bomb_bay_desc:0 "Geniş fabrikalar ve diğer sert hedefler gibi yerleri bile hasara uğratmak veya yok etmek için yeterli mühimmat taşımaya yarayan büyük bir yuva."
 large_plane_airframe:0 "$strat_bomber_equipment$"
 large_plane_airframe_0:0 "Savaşlar Arası Dönem Büyük Uçak Gövdesi"
 large_plane_airframe_0_desc:0 "Bu çok büyük uçak gövdesi, bomba veya yakıt tankları taşımak için bolca alana sahiptir. Ancak, geliştirme potansiyelinin ciddi şekilde sınırlı olduğu açıktır. Yeni nesil stratejik bombardıman uçakları zaten ufukta."
 large_plane_airframe_1:0 "Temel Büyük Uçak Gövdesi"
 large_plane_airframe_1_desc:0 "Bu uçak gövdesi, düşman topraklarının derinliklerindeki endüstriyel hedeflere saldırabilen ve mürettebatını canlı geri getirebilen gerçek bir stratejik bombardıman uçağının potansiyelini test etmek için tasarlandı."
 large_plane_airframe_2:0 "Geliştirilmiş Büyük Uçak Gövdesi"
 large_plane_airframe_2_desc:0 "Stratejik bir bombardıman uçağı kavramı artık kanıtlandığına göre, bu uçak gövdesi gelecekteki büyüme için yeterli potansiyele sahipken yük ve menzili iyileştirmek için tasarlandı."
 large_plane_airframe_3:0 "Gelişmiş Büyük Uçak Gövdesi"
 large_plane_airframe_3_desc:0 "Çok yüksek irtifada çok uzun menzilli uçuş için optimize edilen bu uçak gövdesi, düşman topraklarının kalbine kadar önemli bir yük taşıyabilir."
 large_plane_airframe_4:0 "Modern Büyük Uçak Gövdesi"
 large_plane_airframe_4_desc:0 "Jet tahriki, performansta dev bir sıçrama sunuyor. Bu uçak gövdesi bundan yararlanmak için tasarlandı."
 large_plane_airframe_desc:0 "Bol alana sahip, altı motora kadar monte edilebilen ve uzun mesafelere büyük yükler taşıyabilen büyük bir uçak gövdesi."
 large_plane_maritime_patrol_plane_airframe:0 " Deniz Devriye Bombardıman Uçağı"
 large_plane_maritime_patrol_plane_airframe_0:0 "Savaşlar Arası Dönem Deniz Devriye Uçağı"
 large_plane_maritime_patrol_plane_airframe_0_desc:0 "Filonun düşmanlarını kıyıdan uzakta bulmak için uzun menzilli uçaklara ihtiyacı var. Biraz modası geçmiş olsa da, bu uçak gövdesi geniş okyanus alanlarını kapsamak için gerekli menzili sunuyor."
 large_plane_maritime_patrol_plane_airframe_1:0 "Temel Deniz Devriye Uçağı"
 large_plane_maritime_patrol_plane_airframe_1_desc:0 "Daha güçlü uçak gemisi uçaklarının ortaya çıkması, düşman filolarını kıyıdan uzakta bulup yok etmeyi gerekli kılıyor. Bunun için ilk adım, onları okyanusun derinliklerinde bulmaktır, bu da yeni bir uçak tipini gerektirir."
 large_plane_maritime_patrol_plane_airframe_2:0 "Geliştirilmiş Deniz Devriye Uçağı"
 large_plane_maritime_patrol_plane_airframe_2_desc:0 "Denizaltıların ve akıncı kruvazörlerin ikili tehdidi, geniş okyanus alanlarında devriye gezmeyi gerektirir. Bu uçak gövdesi bunun için optimize edilmiştir."
 large_plane_maritime_patrol_plane_airframe_3:0 "Gelişmiş Deniz Devriye Uçağı"
 large_plane_maritime_patrol_plane_airframe_3_desc:0 "Radar ve diğer sensörler, kötü hava koşullarında veya karanlık gecelerde bile düşman filolarını bulmayı mümkün kılar, ancak tüm yeni teçhizatın taşınması için daha büyük bir uçak gövdesi gerekir."
 large_plane_maritime_patrol_plane_airframe_4:0 "Modern Deniz Devriye Uçağı Gövdesi"
 large_plane_maritime_patrol_plane_airframe_4_desc:0 "Füze çağının şafağıyla birlikte, deniz devriye uçakları kıyıdan daha da uzakta ve daha uzun süreler boyunca faaliyet gösterebilmelidir."
 large_plane_maritime_patrol_plane_airframe_desc:0 "$large_plane_airframe_desc$"
 light_mg_2x:0 "2x Hafif Makineli Tüfek"
 light_mg_2x_desc:0 "İki adet tüfek kalibreli makineli tüfek seti, çok makul bir maliyetle hava hedeflerine karşı biraz daha fazla ateş gücü sağlar."
 light_mg_4x:0 "4x Hafif Makineli Tüfek"
 light_mg_4x_desc:0 "Bu dörtlü tüfek kalibreli silah seti, yıkıcılık konusundaki eksikliğini muazzam atış hacmiyle telafi ediyor."
 lmg_defense_turret:0 "Hafif MT Savunma Tareti"
 lmg_defense_turret_2x:0 "Hafif MT Savunma Tareti x2"
 lmg_defense_turret_2x_desc:0 "Elektrikle çalışan taretlerdeki iki hafif makineli tüfek seti daha fazla açıyı kapsar ve uçağı saldırması çok daha zor bir hedef haline getirir."
 lmg_defense_turret_desc:0 "Hava-hava muharebesi için biraz güçsüz olsa da, bir taretteki hafif makineli tüfek, bu uçağa karşı yapılacak herhangi bir saldırıyı daha tehlikeli bir girişim haline getirecektir."
 medium_bomb_bay:0 "Orta Bomba Yuvası"
 medium_bomb_bay_desc:0 "Orta büyüklükte bir bomba yuvası, çok çeşitli hedeflere saldırmak için yeterli mühimmat taşımaya olanak tanır."
 medium_plane_airframe:0 "$tac_bomber_equipment$"
 medium_plane_airframe_0:0 "Savaşlar Arası Dönem Orta Uçak Gövdesi"
 medium_plane_airframe_0_desc:0 "Önemli bir yükü uzun bir mesafeye taşıyabilse de, bu uçak gövdesinin büyüme potansiyeli ciddi şekilde sınırlıdır."
 medium_plane_airframe_1:0 "Temel Orta Uçak Gövdesi"
 medium_plane_airframe_1_desc:0 "Son zamanlarda geliştirilen bir dizi yeni teknolojiyi bünyesinde barındıran bu uçak gövdesi, benzer büyüklükteki önceki uçaklara göre önemli ölçüde daha yeteneklidir."
 medium_plane_airframe_2:0 "Geliştirilmiş Orta Uçak Gövdesi"
 medium_plane_airframe_2_desc:0 "Modern üretim teknolojilerinden yararlanan bu uçak gövdesi, uçağın daha uzun bir mesafeye daha büyük bir yük taşımasına olanak tanır."
 medium_plane_airframe_3:0 "Gelişmiş Orta Uçak Gövdesi"
 medium_plane_airframe_3_desc:0 "Performansı ve yük kapasitesini en üst düzeye çıkarmak için tasarlanan bu uçak gövdesi, geleneksel güçle çalışan uçakların zirvesini temsil eder."
 medium_plane_airframe_4:0 "Modern Orta Uçak Gövdesi"
 medium_plane_airframe_4_desc:0 "Jet motorlu uçakların baskın hale gelmesi muhtemel olduğundan, mühendisler jet tahrikini göz önünde bulundurarak uçak gövdeleri inşa etmenin yollarını bulmaya başlıyor."
 medium_plane_airframe_desc:0 "İki ila dört motorlu ve yük, yakıt tankları veya savunma teçhizatı için bol miktarda iç alana sahip orta boyutlu bir uçak gövdesi."
