 jet_engine_axial_1x:0 "1x Eksenel Jet Motoru"
 jet_engine_axial_1x_desc:0 "Birden fazla kompresörü birbiri ardına monte eden Eksenel Motor, basit bir tek aşamalı jet motoru tarafından üretilen itki miktarını katlayabilir."
 jet_engine_axial_2x:0 "2x Eksenel Jet Motoru"
