 engines_1:0 "Motorlar I"
 engines_1_desc:0 "Uçak motorları güçlü, ancak hafif ve güvenilir olmalıdır. Bu motor tipi bir uçağı havaya kaldıracak kadar güç sağlar, ancak tam potansiyeline ulaşmasını bir şekilde sınırlar."
 engines_2:0 "Motorlar II"
 engines_2_desc:0 "Uçakların hızlı büyümesi, motor gücünde buna karşılık gelen bir büyüme gerektirir."
