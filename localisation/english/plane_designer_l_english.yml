 supersonic_small_airframe_desc:0 "$small_plane_airframe_5_desc$"
 survivability_studies:0 "Hayatta Kalma Kabiliyeti Çalışmaları"
 survivability_studies_desc:0 "Geri dönen uçaklardaki savaş hasarını dikkatlice analiz ederek, bir uçağın hangi kısımlarının gerçekten hayati olduğunu doğru bir şekilde belirleyebiliriz."
 tank_buster_1:0 "Tanksavar Topu I"
 tank_buster_1_desc:0 "Ordunun kullandığı bir tanksavar topundan uyarlanan bu silah, iyi yerleştirilmiş atışlarla modern tankları bile yok edebilir. Ancak ağır ağırlığı ve hantal yapısı uçağın performansını ciddi şekilde sınırlar."
 tank_buster_2:0 "Tanksavar Topu II"
 tank_buster_2_desc:0 "Şu anda hizmette olan daha ağır tanklarla mücadele etmek için çok daha büyük bir top gerekmektedir. Son derece ağır ve kullanışsız olmasına rağmen, düşman mevzilerine karşı saldırılar için çok yetenekli bir silahtır."
 torpedo_mounting:0 "Hafif Torpido Bağlantıları"
 torpedo_mounting_2:0 "Orta Torpido Bağlantıları"
 torpedo_mounting_2_desc:0 "Orta ağırlıkta bir torpidonun gövde altına monte edilmesine izin veren bağlantı noktaları. Bu, uçağa düşman gemilerine karşı kullanabileceği güçlü bir silah verir."
 torpedo_mounting_3:0 "Ağır Torpido Bağlantıları"
 torpedo_mounting_3_desc:0 "Ağır bir torpidonun gövde altına monte edilmesine izin veren bağlantı noktaları. Bu, uçağa düşman gemilerine karşı kullanabileceği güçlü bir silah verir."
 torpedo_mounting_desc:0 "Hafif bir torpidonun gövde altına monte edilmesine izin veren bağlantı noktaları. Bu, uçağa düşman gemilerine karşı kullanabileceği güçlü bir silah verir."
