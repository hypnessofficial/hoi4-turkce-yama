 bba_air_techs_folder_desc:0 "$air_techs_folder_desc$"
 bomb_locks:0 "Bomba Kilitleri"
 bomb_locks_desc:0 "Kanatların veya gövdenin altına küçük bombalar için yapılan bağlantılar, uçağın yer hedeflerine bir miktar başarı umuduyla saldırmasına olanak tanır."
 bomb_sights_1:0 "Bomba Nişangahı I"
 bomb_sights_1_desc:0 "Rüzgar sapmasını, terminal hızı ve irtifayı hesaba katan karmaşık bir mekanik bilgisayar, bombacının bombaları yüksek bir doğruluk derecesiyle atmasını sağlar."
 bomb_sights_2:0 "Bomba Nişangahı II"
 bomb_sights_2_desc:0 "Önceki nesil bomba nişangahlarının hedefleme çözümlerine ulaşmadan önce genellikle uzun bir kurulum süreci gerektirdiği yerlerde, bu tam stabilize bomba nişangahı sadece birkaç saniye sürer ve sığ dalışları bile telafi edebilir."
 bouncing_bomb_release:0 "Sekerek İlerleyen Bomba Bırakma Mekanizması"
 bouncing_bomb_release_desc:0 "Hedeflerine çarpana kadar su üzerinde seken özel sekerek ilerleyen bombaları taşımak ve bırakmak için bir bomba rafı. Mekanizma, bombanın serbest bırakılması sırasında geriye doğru dönmesini sağlayarak, amaçlanan yapısal hedefine ulaşma olasılığını artırır."
 cannon_defense_turret:0 "Toplu Savunma Tareti"
 cannon_defense_turret_2x:0 "Toplu Savunma Tareti x2"
 cannon_defense_turret_2x_desc:0 "Otomatik toplarla donatılmış iki taret, uçağa korkunç bir savunma vuruş gücü verir ki bu da ona yapılacak herhangi bir avcı saldırısını gerçekten çok tehlikeli bir olasılık haline getirir."
 cannon_defense_turret_desc:0 "Dönebilen bir taretteki modern bir top, hava muharebesinde savunmacı ile saldırgan arasındaki güç dengesini önemli ölçüde değiştirir. Çok az avcı uçağı modern bir toptan doğrudan bir isabete dayanıp savaşmaya devam edebilir."
 cv_small_plane_airframe:0 "$cv_fighter_equipment$"
 cv_small_plane_airframe_0:0 "Savaşlar Arası Dönem Uçak Gemisi Gövdesi"
 cv_small_plane_airframe_0_desc:0 "Bir tutucu kanca ve güçlendirilmiş iniş takımı ile donatılmış bu uçak gövdesi, bir uçak gemisinden faaliyet gösterebilir."
 cv_small_plane_airframe_1:0 "Temel Uçak Gemisi Gövdesi"
 cv_small_plane_airframe_1_desc:0 "Kara tabanlı uçaklar için geliştirilen yeni teknolojileri bünyesinde barındıran bu uçak gövdesi, aynı derecede yeteneklidir, ancak bir geminin güvertesinden fırlatılabilir."
 cv_small_plane_airframe_2:0 "Geliştirilmiş Uçak Gemisi Gövdesi"
 cv_small_plane_airframe_2_desc:0 "Kara tabanlı havacılıktaki gelişmelere ayak uydurmak için bu uçak gövdesi, menzili ve performansı artırmak için yeni teknolojilerle tasarlandı."
 cv_small_plane_airframe_3:0 "Gelişmiş Uçak Gemisi Gövdesi"
 cv_small_plane_airframe_3_desc:0 "Uçak gemisi havacılığının zorlu doğası, bir uçak gövdesinin ne kadar büyük ve yetenekli olabileceğini sınırlar. Bu uçak gövdesi, geleneksel olarak güçlendirilmiş bir uçak gövdesi ile elde edilebilecek mutlak maksimumu temsil eder."
 cv_small_plane_airframe_4:0 "Modern Uçak Gemisi Gövdesi"
 cv_small_plane_airframe_4_desc:0 "Bu uçak gövdesi, jet motorlarının ürettiği artan itkiden yararlanmak ve onları deniz havacılığına getirmek için tasarlandı."
 cv_small_plane_airframe_desc:0 "Bir tutucu kanca ve güçlendirilmiş bir iniş takımı ile donatılmış bu küçük uçak gövdesi, uçak gemilerinden faaliyet gösterebilir."
