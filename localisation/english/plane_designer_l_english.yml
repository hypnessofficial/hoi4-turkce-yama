 demining_coil:0 "Mayın Temizleme Bobini"
 demining_coil_desc:0 "Uçak gövdesine monte edilmiş büyük bir bobin, uçağın güçlü bir manyetik alan yansıtmasını sağlar, bu da uçuş yolundaki manyetik mayınların patlamasına neden olur."
 dive_brakes_small:0 "Dalış Frenleri"
 dive_brakes_small_desc:0 "Kanadın arka kenarı boyunca uzanan bir dizi spoyler, uçak bir dalışa girdiğinde açılarak genel hızı düşürür ve uçağın kanatlarını koparmadan dik dalışlardan çıkmasını sağlar. Bu da, uçağın neredeyse dikey bir dalıştan saldırmasına olanak tanıyarak doğruluğu önemli ölçüde artırır."
 drop_tanks:0 "Bırakılabilir Yakıt Tankları"
 drop_tanks_desc:0 "Ekstra yakıt tutan küçük, tek kullanımlık tanklar, saldırı görevlerindeyken avcı uçaklarımıza biraz daha fazla menzil kazandırır. Savaştan önce bırakıldıkları için savaş performansını engellemezler."
 early_bombs:0 "Bombalar"
 early_bombs_desc:0 "Büyük Savaş'ın ilk günlerinden beri, uçaklar düşman hedeflerine patlayıcı atmak için giderek daha fazla kullanılmıştır. Zamanla bu, hava savaşının temel bir yönü haline gelmiştir."
 earthshaker_bomb_release:0 "Yer Sarsan Bomba Bırakma Mekanizması"
 earthshaker_bomb_release_desc:0 "Çarpma anında yere nüfuz etmek ve yeraltında patlayarak hedeflerine büyük yapısal hasar vermek üzere tasarlanmış devasa yer sarsan bombalar için bir bomba rafı ve bırakma mekanizması."
 engine_1_1x:0 "1x Motor I"
 engine_1_1x_desc:0 "Bu temel motor güvenilir ve ucuzdur, ancak pek güçlü değildir."
 engine_1_2x:0 "2x Motor I"
 engine_1_2x_desc:0 "Çift motor, uçağa önemli ölçüde itki artışı sağlar, ancak bir bedeli vardır."
 engine_1_3x:0 "3x Motor I"
 engine_1_3x_desc:0 "Üç motor, dördüncü bir motorun ek maliyeti olmadan bir çiftten daha fazla itki sağlar."
 engine_1_4x:0 "4x Motor I"
 engine_1_4x_desc:0 "Dörtlü bir motor seti, ağır bir uçağı kaldırmak ve önemli bir yük taşımasına izin vermek için yeterli itki sağlar."
 engine_1_6x:0 "6x Motor I"
 engine_1_6x_desc:0 "Altı motorla, herhangi bir uçağın önemli bir yükü uzun bir menzilde, makul bir hızda taşıması sağlanabilir."
 engine_2_1x:0 "1x Motor II"
 engine_2_1x_desc:0 "Daha büyük ve daha güçlü bir motor, daha yüksek hız ve daha fazla yük kapasitesi sağlar."
 engine_2_2x:0 "2x Motor II"
 engine_2_2x_desc:0 "$engine_1_2x_desc$"
 engine_2_3x:0 "3x Motor II"
 engine_2_3x_desc:0 "$engine_1_3x_desc$"
 engine_2_4x:0 "4x Motor II"
