 air_air_radar_1:0 "Hava-Hava Radarı I"
 air_air_radar_1_desc:0 "Uçaktaki bir dizi radar anteni, eğitimli bir operatörün karanlıkta bile bir hava hedefini bulmasını sağlar."
 air_air_radar_2:0 "Hava-Hava Radarı II"
 air_air_radar_2_desc:0 "Daha güçlü bir verici ile bu radar seti, hedefleri daha uzun bir mesafeden tespit edebilir."
 air_ground_radar_1:0 "Hava-Yer Radarı I"
 air_ground_radar_1_desc:0 "Navigatöre uçağın altındaki yüzeyin doğru bir resmini veren, karanlıkta veya kötü havada bile hassas navigasyona olanak tanıyan bir havadan radar seti."
 air_ground_radar_2:0 "Hava-Yer Radarı II"
 air_ground_radar_2_desc:0 "Önceki modellere göre daha yüksek bir çözünürlüğe sahip olan bu radar seti, bulut örtüsünün içinden bile hassas bombardımana olanak tanır."
 air_torpedoe_1:0 "Havadan Fırlatılan Torpidolar"
 air_torpedoe_1_desc:0 "Hafif torpidolar, denizdeki vuruş kabiliyetimizi genişletmek için herhangi bir yetenekli uçak tarafından taşınabilir."
 air_torpedoe_2:0 "Geliştirilmiş Havadan Fırlatılan Torpidolar"
 air_torpedoe_2_desc:0 "Standartlaştırılmış bağlantılar ve derecelendirmeler, daha büyük, daha güçlü torpidoların geliştirilmesine ve genel kullanışlılıklarının artırılmasına olanak tanır."
 air_torpedoe_3:0 "Gelişmiş Havadan Fırlatılan Torpidolar"
 air_torpedoe_3_desc:0 "Suya girerken atılmak üzere tasarlanmış hafif bağlantıların geliştirilmesi, hava torpidolarına önemli ölçüde daha fazla doğruluk ve atış yapan uçak için gelişmiş güvenlik sağlar."
 aircraft_cannon_1_1x:0 "1x Top I"
 aircraft_cannon_1_1x_desc:0 "Otomatik bir top, hava hedeflerine karşı önemli miktarda ateş gücü sunar, ancak eklenen ağırlık uçağı hem daha yavaş hem de daha az manevra kabiliyetine sahip yapar."
 aircraft_cannon_1_2x:0 "2x Top I"
 aircraft_cannon_1_2x_desc:0 "İki otomatik top, uçağa hava ve yumuşak yer hedeflerine karşı korkunç bir ileri ateş gücü sağlar, ancak ağırlık ve çeviklik açısından önemli bir maliyeti vardır."
 aircraft_cannon_2_1x:0 "1x Top II"
 aircraft_cannon_2_1x_desc:0 "Yüksek hızda büyük bir mermi ateşleyen modern bir top olan bu silah, hem avcı uçaklarını hem de stratejik bombardıman uçaklarını aynı şekilde düşürebilir."
 aircraft_cannon_2_2x:0 "2x Top II"
 aircraft_cannon_2_2x_desc:0 "Çift top, uçağa önemli miktarda vuruş gücü verirken, artan atış hacmi, ölümcül isabetler kaydetmeyi daha da kolaylaştırır."
 aircraft_construction:0 "Uçak İnşaatı"
 aircraft_construction_desc:0 "Uçak imalatında kontrplak ve kumaş günlerinden bu yana çok yol kat ettik. Yeni teknolojiler, belirli rollere daha uygun uçaklara olanak tanıyor."
 airdropped_mines:0 "Havadan Bırakılan Mayınlar"
 airdropped_mines_desc:0 "Paraşütle donatılmış bir dizi deniz mayını, bir uçaktan atılmalarını sağlar."
 armor_piercing_bomb_locks:0 "Zırh Delici Bomba Kilitleri"
 armor_piercing_bomb_locks_desc:0 "Kanatların veya gövdenin altına büyük zırh delici bombalar için yapılan bağlantılar, uçağın Deniz hedeflerine büyük bir etkiyle saldırmasına olanak tanır."
 armor_piercing_bombs:0 "Zırh Delici Bombalar"
 armor_piercing_bombs_desc:0 "Savaş gemileri güverte zırhlarını sürekli artırmıştır, bu zırhı delmek için özel bombalar geliştirilmelidir."
 armor_plate_large:0 "$armor_plate_small$"
 armor_plate_large_desc:0 "Kapsamlı çelik kaplama motorları, yakıt tanklarını ve mürettebat bölmesini koruyarak uçağın uçaksavar ateşinden doğrudan bir isabet dışında her şeyi savuşturmasını sağlar ve avcı uçaklarının düşürmesi için çok zorlu bir hedef haline getirir."
 armor_plate_medium:0 "$armor_plate_small$"
 armor_plate_medium_desc:0 "Motorların ve gövdenin daha hassas kısımlarının etrafındaki zırh, menzil pahasına uçağa önemli ölçüde daha iyi hayatta kalma kabiliyeti sağlar."
 armor_plate_small:0 "Zırh Plakaları"
 armor_plate_small_desc:0 "Pilot koltuğunun arkasındaki ve motorun etrafındaki çelik kaplama, uçağın yerden açılan ateşe ve arkadan gelen saldırılara karşı hayatta kalma kabiliyetini artırır."
