 fixed_explosive_charge:0 "Sabit Patlayıcı Yükü"
 fixed_explosive_charge_desc:0 "Sabit bir oyuk imla hakkı, uçağı uçan bir bombaya dönüştürür. Uçak bir düşman gemisine yönlendirilirse, dramatik bir yıkıma neden olur, ancak hem uçağın hem de mürettebatın kaybı pahasına."
 floats:0 "Şamandıralar"
 floats_desc:0 "Uçak gövdesinin altına monte edilmiş bir dizi yüzdürme cihazı, uçağın suya inmesini sağlar. Bu, düşman deniz unsurları için keşif görevlerini kolaylaştırır, ancak aynı zamanda çevikliği de önemli ölçüde azaltır."
 flying_boat_large:0 "$flying_boat_medium$"
 flying_boat_large_desc:0 "$flying_boat_medium_desc$"
 flying_boat_medium:0 "Uçan Bot"
 flying_boat_medium_desc:0 "Bir iniş takımı monte etmek yerine, uçağın alt kısmı suya inebilecek şekilde şekillendirilebilir. Bu, su üzerindeki keşif görevlerini çok daha kolay hale getirir."
