l_english:
 90_days_tt:0 "Bunu uygulamak yaklaşık 90 gün sürecektir.\n"
 CHI_50_cheaper_force_attack:0 "§YZorunlu Saldırı§! maliyeti §G-%50§!\n"
 CHI_60_divisions_plan:0 "60 Tümen Planı"
 CHI_60_divisions_plan_desc:0 "Sorunu ceset yığınlarıyla çözmek yerine, yabancı danışmanlarımız radikal olarak yeni bir plan öneriyor: düşmanla eşleşecek yüksek eğitimli tümenlerden oluşan daha küçük bir kuvvet. Bir pilot proje şimdiden başladı."
 CHI_anti_communism:0 "Anti-Komünizm"
 CHI_anti_communism_desc:0 "Komünizm, ulusumuza yönelik en büyük tehdidi temsil etmektedir. Acımasızca yok edilmelidir."
 CHI_anti_imperialism:0 "Anti-Emperyalizm"
 CHI_anti_imperialism_desc:0 "Bugün, sömürgeciliğin prangalarından kurtulmuş ilk uluslardan biri olarak duruyoruz. Asya'daki diğer halkların da kendi kaderlerini belirleyebilmelerini sağlamak bizim kutsal görevimizdir."
 CHI_anti_opposition_campaigns:0 "Muhalefet Karşıtı Harekâtlar"
 CHI_anti_opposition_campaigns_desc:0 "Düşmanlarımız sınırlarımızın hemen ötesinde toplanıyor. Orada kontrolsüz kalmalarına izin veremeyiz. Bir dizi küçük taarruz onları geri püskürtecek ve bize daha fazla alan kazandıracaktır."
 CHI_anti_opposition_campaigns_effect_tooltip:0 "Bizimle aynı tarafta işbirliği yapmayan Savaş Lordları ile §HSınır Çatışmaları§! başlatmak için £decision_icon_small §HKararların§! kilidini açar.\n"
 CHI_anti_opposition_campaigns_effect_tooltip_no_communists:0 "§RHenüz hiçbir Savaş Lordu Komünistlerin yanında yer almadı.§!\n"
 CHI_anti_opposition_campaigns_effect_tooltip_no_nationalists:0 "§RHenüz hiçbir Savaş Lordu Milliyetçilerin yanında yer almadı.§!\n"
 CHI_army_reform:0 "Ordu Reformu"
 CHI_army_reform_desc:0 "Ordumuzun her komuta kademesinde yolsuzluk, yetersizlik ve korkaklık yaygındır. Bunu çözmek uzun bir süreç olacaktır."
 CHI_british_cooperation:0 "İngiliz İşbirliği"
 CHI_british_cooperation_desc:0 "Baş emperyalistler olsalar da, İngilizlerle çalışmak hava kuvvetlerimizi modernize etme ve istikrarlı bir ikmal akışı sağlama konusunda en iyi şansı sunuyor."
 CHI_bureau_of_investigation_and_statistics:0 "Soruşturma ve İstatistik Bürosu"
 CHI_bureau_of_investigation_and_statistics_desc:0 "Ulusumuzun geleceği için bir savaş verirken ülkemizde hainlerin ve casusların cirit atmasına izin veremeyiz. Bu yeni ajansın kullandığı yöntemler hoş olmayabilir, ancak işin yine de yapılması gerekiyor."
 CHI_burma_road:0 "Burma Yolu"
 CHI_burma_road_desc:0 "Burma Yolu, batı ile olan can damarımızı oluşturur. Ne pahasına olursa olsun korunmalı ve sorunsuz bir tedarik akışı sağlamak için genişletilmelidir."
 CHI_camco:0 "CAMCO"
 CHI_camco_desc:0 "Eğer bağımsız bir havacılık endüstrisi yaratmak istiyorsak, önce sahip olduğumuz uçakları monte etme ve bakımını yapma tekniklerini ve yöntemlerini öğrenmeliyiz."
 CHI_carrier_air_wing:0 "Uçak Gemisi Hava Filosu"
 CHI_carrier_air_wing_desc:0 "Bir uçak gemisi, ancak üzerinden kalkan uçaklar kadar iyidir. Bunların mevcut en yetenekli ve en modern tipler olduğundan emin olmalıyız."
 CHI_chemical_research_institute:0 "Kimyasal Araştırma Enstitüsü"
 CHI_chemical_research_institute_desc:0 "Kimyasal silahları ilk kullanan biz olmayacak olsak da, bir saldırı durumunda onlara karşı savunmaya hazır olmalıyız. Gerekli yöntemleri ve teknolojileri geliştirmek için yeni bir araştırma enstitüsü finanse etmeliyiz."
 CHI_chinese_expeditionary_force:0 "Çin Seferi Kuvveti"
 CHI_chinese_expeditionary_force_desc:0 "Müttefiklerimizle daha iyi koordine olmak için, Amerikalılar ortak bir kuvveti yönetmek üzere Generallerden birini gönderdi."
 CHI_chinese_general_staff:0 "Çin Genelkurmayı"
 CHI_chinese_general_staff_desc:0 "İyi organize edilmiş bir Genelkurmay, karmaşık operasyonları planlamanın anahtarıdır. Alman örneğinden öğrenmeli ve benzer bir organizasyon oluşturmalıyız."
 CHI_chinese_panzers:0 "Çin Panzerleri"
 CHI_chinese_panzers_desc:0 "Alman tankları, şüphesiz, dünyanın en iyileridir. Onların örneğinden öğrenmeli ve kendi tanklarımızı onların desenleri üzerinde geliştirmeliyiz."
 CHI_closer_ties_with_germany:0 "Almanya ile Daha Yakın İlişkiler"
 CHI_closer_ties_with_germany_desc:0 "Almanya'ya olan misyonumuz, daha fazla endüstriyel gelişmeyi finanse etmek için bir kredi de dahil olmak üzere daha da büyük bir işbirliği olasılığını açtı."
 CHI_coastal_patrol_planes:0 "Kıyı Devriye Uçakları"
 CHI_coastal_patrol_planes_desc:0 "Uzun sahil şeritlerimiz ancak havadan etkili bir şekilde devriye edilebilir. Modern deniz bombardıman uçakları, çok fazla kaynak harcamadan kıyılarımızı savunmamızı sağlayacaktır."
 CHI_collaboration_with_the_japanese:0 "Japonlarla İşbirliği"
 CHI_collaboration_with_the_japanese_desc:0 "Çin üzerindeki tasarımları ne olursa olsun, Japonlar yeterli saygı gösterirsek bizimle çalışmaya istekli olduklarını açıkça belirttiler."
 CHI_combined_arms_warfare:0 "Birleşik Silahlar Harbi"
 CHI_combined_arms_warfare_desc:0 "Kamyonlar modern mekanize savaşta ilk deneyler için yeterli olsa da, zayıf arazi performansı ve zırh eksikliği onları ön cephe işleri için uygunsuz kılıyor."
 CHI_commit_to_korean_independence:0 "Kore Bağımsızlığına Bağlılık"
 CHI_commit_to_korean_independence_desc:0 "Koreliler, Japon işgalinin ilk kurbanlarıydı. Bir kez daha dünya ulusları arasında özgür bir halk olarak duracaklar."
 CHI_communist_administrators:0 "Komünist Yöneticiler"
 CHI_communist_administrators_desc:0 "Eski yönetici kadrosu, bizim düşünce tarzımıza ikna edilemeyecek kadar kökleşmiş durumda. Onları tamamen yeni, daha radikal fikirlere sahip daha genç yöneticilerle değiştirmeliyiz."
 CHI_conquer_tibet:0 "Tibet'i Fethet"
 CHI_conquer_tibet_desc:0 "Tibet, bizimle Hindistan arasında stratejik olarak kritik bir araziyi işgal ediyor. Kendilerini savunmak için çok zayıflar. Güney kanadımızı korumak için müdahale etmeliyiz."
 CHI_constitutional_reform:0 "Anayasa Reformu"
 CHI_constitutional_reform_desc:0 "Bugün karşılaştığımız sorunlar, kısmen, Çin'deki gerçekleri yansıtan bir anayasa eksikliğinden kaynaklanmaktadır. Bunu düzeltmeliyiz."
 CHI_construction_battalions:0 "İnşaat Taburları"
 CHI_construction_battalions_desc:0 "Eğer ülkemizin bolca sahip olduğu bir şey varsa, o da insandır. Temel askeri mühendislik işlerini yapmak için kürekten biraz daha fazlasını gerektiren özel birimler oluşturabiliriz."
 CHI_control_yuan:0 "Kontrol Yuanı"
 CHI_control_yuan_desc:0 "Yolsuzluk her hükûmette kaçınılmazdır. Etkili bir hükûmet, onu kontrol altında tutma çabası gerektirir. Yasama, yürütme ve yargı organlarına eşit, ayrı bir hükûmet organı oluşturacağız."
 CHI_cooperation_with_the_communists:0 "Komünistlerle İşbirliği"
 CHI_cooperation_with_the_communists_desc:0 "KMT, modern bir ulus inşa etmeye çalıştı ve başarısız oldu. Ülke her zamankinden daha bölünmüş durumda, köylüler hükûmet korkusuyla yaşıyor, hükûmetin her kademesinde yolsuzluk yaygın ve Japon Emperyalistleri sınırların hemen arkasında oturuyor. Belki de Komünizm gelecek için daha iyi bir vizyondur."
 CHI_cooperation_with_the_communists_effect_tooltip:0 "Milliyetçilerin yanında yer alan Savaş Lordları, buna yanıt olarak bizimle §HSınır Çatışmaları§! başlatabilir.\n"
 CHI_cooperation_with_the_nationalists:0 "Milliyetçilerle İşbirliği"
 CHI_cooperation_with_the_nationalists_desc:0 "Milliyetçiler, ülkeyi birleştirme ve Japonları yenme konusunda en iyi şansı sunuyor. Bizi bir tehdit olarak görmediklerinden emin olmalıyız."
 CHI_cooperation_with_the_nationalists_effect_tooltip:0 "[WTT_communist_china.GetNameDefCap] ve Komünistlerin yanında yer alan Savaş Lordları, buna yanıt olarak bizimle §HSınır Çatışmaları§! başlatabilir."
 CHI_cult_of_personality:0 "Kişilik Kültü"
 CHI_cult_of_personality_desc:0 "Halk, bu karanlık günlerden ötesindeki aydınlık geleceğe onları kimin götürdüğünü ve o adamın sahip olduğu birçok üstün niteliği bilmelidir."
 CHI_dare_to_die_corps:0 "Ölüme Meydan Okuyan Birlikler"
 CHI_dare_to_die_corps_desc:0 "Cumhuriyet mücadelesi şimdiden birçok şehit yarattı. Bitmeden önce daha da fazlası olacak. Onların fedakarlıkları gelecek nesiller tarafından hatırlanacak."
 CHI_defensive_posture:0 "Savunma Duruşu"
 CHI_defensive_posture_desc:0 "Bu çatışma bir maraton, bir sprint değil. Diğer hiziplere çok erken meydan okumak felakete davetiye çıkarır. Şimdilik savunmada kalacağız."
 CHI_demand_mongolia:0 "Moğolistan'ı Talep Et"
 CHI_demand_mongolia_desc:0 "Bizimle Rusya arasında sıkışmış olan Moğolistan, her an onlara düşebilir. Önce biz saldırmalıyız."
 CHI_democracy:0 "Demokrasi"
 CHI_democracy_desc:0 "Dr. Sun Yat-Sen tarafından başlatılan yolculuk, eninde sonunda bir cumhuriyete yol açmalıdır. Şüphesiz uzun bir yolculuk olacak, ama adım adım ilerliyoruz."
 CHI_develop_the_hanyan_arsenal:0 "Hanyang Cephaneliğini Geliştir"
 CHI_develop_the_hanyan_arsenal_desc:0 "Hanyang Cephaneliği uzun zamandır Çin ordularına silah sağlıyor. Bunu genişletmek gelecekte de böyle kalmasını sağlayacaktır."
 CHI_dominate_japan:0 "Japonya'ya Hükmet"
 CHI_dominate_japan_desc:0 "Onlarca yıldır Japonya, bağımsızlığımıza yönelik en büyük tehdidi oluşturdu. Daha önce bizi boyunduruk altına almak için Batı Güçleriyle ittifak kurdular. Başka bir girişimde bulunmalarına izin veremeyiz. Önce biz saldırmalıyız."
 CHI_elite_mountaineers:0 "Elit Dağcılar"
 CHI_elite_mountaineers_desc:0 "Alp Harbi, ovalardaki savaştan tamamen farklı bir canavardır. Arazimizden en iyi şekilde yararlanmak için bu sanatta özel tümenler eğitmeliyiz."
 CHI_embrace_the_opium_trade:0 "Afyon Ticaretini Benimse"
 CHI_embrace_the_opium_trade_desc:0 "Bir ülkenin işlemesi için paraya ihtiyacı vardır. Mevcut durumumuzda, kaynaklar konusunda çok seçici olamayız."
 CHI_examination_yuan:0 "Sınav Yuanı"
 CHI_examination_yuan_desc:0 "Binlerce yıldır, Çinli bürokratlar sıkı sınavlarda seçildi. Gerekli metinler değişmiş olsa da, ilke aynı kalır."
 CHI_executive_yuan:0 "Yürütme Yuanı"
 CHI_executive_yuan_desc:0 "Hükûmetin çekirdeği, yasaları yürüten Yürütme'dir. İşleyen bir cumhuriyetçi hükûmet yaratmanın ilk adımının onu yaratmak olması mantıklıdır."
 CHI_expand_the_academica_sinica:0 "Academica Sinica'yı Genişlet"
 CHI_expand_the_academica_sinica_desc:0 "Binlerce yıldır, Çin sanat ve bilimlerin gelişiminde dünyaya liderlik etmiştir. Üniversitelerimize artan fon, bu konumu geri almak için sadece ilk adımdır."
 CHI_experimental_mechanised_unit:0 "Deneysel Mekanize Birim"
 CHI_experimental_mechanised_unit_desc:0 "Avrupa'daki teorisyenler, tankları kullanmanın en iyi yolunu uzun süredir tartıştılar. Mobil piyadeyi hızlı tanklarla birleştiren bir birimin en iyi yaklaşım olduğu anlaşılıyor. Böyle bir birim kuracağız."
 CHI_experimental_mechanised_unit_effect:0 "2 §YHafif Tank§! ve 4 §YMotorlu§! taburuna sahip bir Tümen kazan\n"
 CHI_fighter_purchases:0 "Avcı Uçağı Alımları"
 CHI_fighter_purchases_desc:0 "Hava Kuvvetlerimizin yabancı tehditlere ayak uydurabilmesi için modern avcı uçaklarına ihtiyacı var. Sanayimiz henüz onları üretemiyor, bu yüzden onları yurtdışından satın almalıyız."
 CHI_financial_policy:0 "Mali Politika"
 CHI_financial_policy_desc:0 "Devletin maliyesi pek sağlam değil ve iddialı hükûmet programları kontrolden çıkmış bir hiperenflasyon hayaletini ortaya çıkarıyor. Mali reform ilk önceliklerimizden biri olmalı."
 CHI_forced_conscription:0 "Zorunlu Askerlik"
 CHI_forced_conscription_desc:0 "Mevcut asker alım yöntemlerimiz taleplerimizi karşılayacak kadar asker üretmiyor. Bu savaşta yenilgi yok olmak demektir, bu yüzden halkımızdan daha da fazlasını istemeliyiz."
 CHI_forced_loans:0 "Zorunlu Borçlanma"
 CHI_forced_loans_desc:0 "Tüccarlar ve sanayiciler, göreceli barış döneminde inanılmaz zenginlikler biriktirdiler. Bu çaresiz zamanlarda onlardan bu servetin bir kısmını hükûmetin kullanımına sunmalarını istemek kesinlikle çok fazla bir şey değil, durum izin verir vermez hızlı bir geri ödeme sözüyle."
 CHI_foreign_threats:0 "Yabancı Tehditler"
 CHI_foreign_threats_desc:0 "Birkaç yıl önce, Japonlar Mançurya'yı bizden kopardı ve bir kukla devlet yarattı. Tüm Çin'i boyunduruk altına alana kadar durmayacaklar. Yerel zorbalarla anlaşmalar yapmak anlamına gelse bile, onlarla yüzleşmeye hazır olmalıyız."
 CHI_fortify_shanghai:0 "Şanghay'ı Tahkim Et"
 CHI_fortify_shanghai_desc:0 "Eğer Japonya saldırırsa, ilk darbe Şanghay'a düşecektir. Hazırlıklı olmalıyız."
 CHI_free_hospitals:0 "Ücretsiz Hastaneler"
 CHI_free_hospitals_desc:0 "Büyük bir ulus, vatandaşlarını hastalık zamanlarında yalnız bırakmaz. Kapsamlı bir sağlık sistemi oluşturarak, nüfusumuzun genel sağlığında bir iyileşme sağlayacağız. Onu savunmak için toplanacaklar."
 CHI_free_mountain_template_tt:0 "§Y7 Dağcı§! ve §Y2 Topçu§! taburuna sahip bir şablon kazan.\n"
 CHI_french_drill:0 "Fransız Talimi"
 CHI_french_drill_desc:0 "Büyük Savaş'taki Fransız deneyimi, savunmada mükemmelleşen bir ordu yarattı. Eğitim yöntemlerini ve standartlarını benimseyerek, kendi savunma yeteneklerimizi geliştirebiliriz."
 CHI_french_military_mission:0 "Fransız Askeri Misyonu"
 CHI_french_military_mission_desc:0 "Fransız Ordusu, Avrupa'nın en iyi eğitimli ordularından biridir. Onlardan çok şey öğrenebiliriz."
 CHI_give_falkenhausen_citizenship:0 "Falkenhausen'a Vatandaşlık Ver"
 CHI_give_falkenhausen_citizenship_desc:0 "Alman danışmanlar, ordumuzu yeniden inşa etme ve modernleştirme konusunda olağanüstü hizmet verdiler. Siyasi durum nasıl değişirse değişsin, burada kalabilmelerini sağlamalıyız."
 CHI_grain_tax:0 "Tahıl Vergisi"
 CHI_grain_tax_desc:0 "Hükûmet tarafından basılan paraların alım gücü giderek azalıyor. Yakında ordularımızı besleyemeyeceğiz. Köylülerin vergilerini piyasayı baypas ederek tahıl olarak ödemeleri gereken yeni bir yasa çıkarabiliriz. Bunu sevmeyecekler ve bunun tam bir kıtlığa yol açma tehlikesi var."
 CHI_guarantee_the_hanoi_route:0 "Hanoi Rotasını Garanti Et"
 CHI_guarantee_the_hanoi_route_desc:0 "Hanoi üzerinden ve kuzeye sınırlarımıza uzanan Rota, Japonya ile bir savaş çıkması durumunda dış dünyadan mümkün olan en yüksek miktarda desteği sunar."
 CHI_guidance_and_support:0 "Rehberlik ve Destek"
 CHI_guidance_and_support_desc:0 "Çinhindi halkları, kendi uluslarını inşa etme konusunda hala yardıma ihtiyaç duyacaklardır. Dış baskıya tekrar yenik düşmediklerinden emin olacağız."
 CHI_heavy_cruiser_project:0 "Ağır Kruvazör Projesi"
 CHI_heavy_cruiser_project_desc:0 "Önceki kruvazör tasarımının başarısıyla, onu büyütebilir ve performansını artırabilir, filolarımızı savunmak için daha yetenekli bir gemi yaratabiliriz."
 CHI_heavy_weapons:0 "Ağır Silahlar"
 CHI_heavy_weapons_desc:0 "Destek topçusu olmayan bir ordu, ciddi bir saldırıya karşı duramaz. Ordumuzun bunun için yeterince donanımlı olduğundan emin olmalıyız."
 CHI_heavy_weapons_development:0 "Ağır Silah Geliştirme"
 CHI_heavy_weapons_development_desc:0 "Kaynaklar kıtken, sahip olduğumuz az miktardaki ağır ateş gücünden maksimum düzeyde faydalanmalıyız. Geliştirilmesi için yeni topçu silahları sipariş etmeliyiz."
 CHI_hire_chennault:0 "Chennault'u İşe Al"
 CHI_hire_chennault_desc:0 "Claire Chennault, bizim için çalışmaya ilgi gösteren Amerikalı bir hava harp teorisyenidir. Hava kuvvetlerimizi yeniden inşa etmesi için onu işe almalıyız."
 CHI_hire_soviet_designer:0 "Sovyet Tasarımcı İşe Al"
 CHI_hire_soviet_designer_desc:0 "Sovyetler uzun süredir tanklarla deneyler yapıyor ve dünyanın en iyi tank tasarımcılarından bazılarına sahipler. Bizim için zırhlı savaş araçları tasarlamaları için onlardan birini kiralayabiliriz."
 CHI_ideological_education:0 "İdeolojik Eğitim"
 CHI_ideological_education_desc:0 "Gelecekteki başarımızın temeli bugün atılıyor. Gelecek nesillere, tüm tarihin bir sınıf mücadelesi tarihi olduğu temel gerçeği ve bunun içindeki rolleri öğretilmelidir."
 CHI_imperial_legacy:0 "İmparatorluk Mirası"
 CHI_imperial_legacy_desc:0 "Çin, binlerce yıldır Doğu'daki baskın güç olarak durmuş, bölgede barış ve istikrarı garanti etmiştir. Eski konumumuzu geri alma zamanı geldi."
 CHI_indian_cooperation:0 "Hint İşbirliği"
 CHI_indian_cooperation_desc:0 "Hindistan halkları, sömürgeci baskının son prangalarından kurtulmak için mücadele ediyor. Onlara ulaşmalı, mücadelelerini desteklemeli ve her iki ulusumuz için daha parlak bir gelecek için birlikte çalışmalıyız."
 CHI_industrial_evacuations:0 "Sanayi Tahliyeleri"
 CHI_industrial_evacuations_desc:0 "Modern bir savaş fabrikalarda kazanılır. Silahsız bir ordu, aptal şapkalı bir grup insandan başka bir şey değildir."
 CHI_industrial_investment:0 "Sanayi Yatırımı"
 CHI_industrial_investment_desc:0 "Kaynaklarımız sınırlı olsa da, sahip olduğumuz sermayeyi ekonomimizi geliştirmek için yönlendirmeliyiz."
 CHI_inflation_down_tt:0 "Enflasyonu §Gazaltır§!.\n"
 CHI_inflation_up_tt:0 "Enflasyonu §Rartırır§!.\n"
 CHI_influence_mongolia:0 "Moğolistan'ı Etkile"
 CHI_influence_mongolia_desc:0 "Moğolistan'ı bizimle Rusya arasında bir tampon devlet olarak tutmak kuzey kanadımızı güvence altına alacaktır. Sadece kendilerine bakabildiklerinden emin olmalıyız."
 CHI_institute_cross_border_raids:0 "Sınır Ötesi Baskınlar Düzenle"
 CHI_institute_cross_border_raids_desc:0 "Çin liderliği mücadelesinde bağımsız bir yarışmacı olarak ciddiye alınmadıkça, dünyaya topraklarımız için savaşmaya muktedir ve istekli olduğumuzu göstermeliyiz. Birkaç küçük saldırı kararlılığımızı gösterecek ve belki de bazı savunmasız toprakları ele geçirmemizi sağlayacaktır."
 CHI_institute_cross_border_raids_effect_tooltip:0 "Savaş Lordları ve [WTT_communist_china.GetNameDef] ile §HSınır Çatışmaları§! başlatmak için £decision_icon_small §HKararların§! kilidini açar\n"
 CHI_integrate_tibet:0 "Tibet'i Entegre Et"
 CHI_integrate_tibet_desc:0 "Tibet bağımsızlığı deneyi sona erdi. Askeri bir işgal bir seçenektir, ancak onları barışçıl yollarla tekrar katımıza getirmeyi denemeliyiz."
 CHI_inter_party_coordination_council:0 "Partiler Arası Koordinasyon Konseyi"
 CHI_inter_party_coordination_council_desc:0 "Ülkemizi işleyen çok partili bir demokrasiye dönüştürmenin ve halkın gerekli vesayetini sona erdirmenin ilk adımı, diğer ilgili tarafların politika yapımında söz sahibi olmalarını sağlayacak bir örgüt olacaktır."
 CHI_investment_into_shipbuilding:0 "Gemi İnşaatına Yatırım"
 CHI_investment_into_shipbuilding_desc:0 "Büyük bir filo, onu desteklemek için büyük bir endüstriyel taban gerektirir. Tersanelerimizi inşa etmemize yardımcı olmaları için yabancı yatırımcıları davet etmeliyiz."
 CHI_invite_foreign_investors:0 "Yabancı Yatırımcıları Davet Et"
 CHI_invite_foreign_investors_desc:0 "Aşağılayıcı olsa da, ulusumuzu sanayileştirmenin en iyi yolu, bizi sömüren insanlara yaklaşmaktır."
 CHI_invite_soviet_advisers:0 "Sovyet Danışmanları Davet Et"
 CHI_invite_soviet_advisers_desc:0 "Sovyetler, ordumuzu yeniden inşa etmemize yardımcı olmak için bir askeri misyon göndermeyi teklif etti."
 CHI_invite_the_flying_tigers:0 "Uçan Kaplanları Davet Et"
 CHI_invite_the_flying_tigers_desc:0 "Amerika'daki dostlarımız, bizi desteklemek için bir gönüllü pilot grubu organize etti ve bir dizi modern uçak satın aldı. Sadece söylememiz yeterli."
 CHI_join_the_chinese_soviet:0 "Çin Sovyeti'ne Katıl"
 CHI_join_the_chinese_soviet_desc:0 "Devrim ancak Komünistler bir arada durursa başarılı olabilir. Elbette, parti içindeki hiçbir karşı-devrimci unsurun devrimi daha başlamadan rayından çıkarmaya çalışmadığından emin olmalıyız."
 CHI_join_the_republican_government:0 "Cumhuriyetçi Hükûmete Katıl"
 CHI_join_the_republican_government_desc:0 "Topraklarımız güçlendirilmiş ve hükûmetimiz reforme edilmişken, Merkezi Hükûmete yaklaşıp masada bir yer talep etme zamanı geldi. Hükûmette tanınan bir parti olduğumuzda, bu yeni bulunan meşruiyeti güç tabanımızı büyütmek için diğer eyaletlerde destek oluşturmak için kullanabiliriz."
 CHI_joint_tank_development:0 "Ortak Tank Geliştirme"
 CHI_joint_tank_development_desc:0 "Sovyet tasarımcılarla çalışmaktan edinilen deneyimden sonra, işi daha iyi koordine etmek ve birbirimizden öğrenmek için ortak tasarım ekipleri oluşturmalıyız."
 CHI_judicial_yuan:0 "Yargı Yuanı"
 CHI_judicial_yuan_desc:0 "Dr. Sun Yat-Sen, güçler ayrılığına sahip modern bir cumhuriyet tasavvur etti. Yargımız dış etkiden bağımsız olmalı ve davalara yasaya ve sadece yasaya göre karar vermelidir."
 CHI_judiciary_reforms:0 "Yargı Reformları"
 CHI_judiciary_reforms_desc:0 "Eğer yönetimimiz bir fark yaratacaksa, tüm yargıçların yasalarımızı doğru bir şekilde uygulayacak kadar yeterince eğitildiğinden emin olmalıyız."
 CHI_labor_reform:0 "İşgücü Reformu"
 CHI_labor_reform_desc:0 "Çin'deki çalışma yöntemleri ve gelenekleri binlerce yıldır gelişti. Onları modern çağa taşıma zamanı geldi."
 CHI_land_redistribution:0 "Toprak Yeniden Dağıtımı"
 CHI_land_redistribution_desc:0 "Köylüler, ekonomimizin temelini oluşturmalarına rağmen toprak ağaları tarafından acımasızca sömürülüyor. Toprağı işleyen insanları aslında toprağın sahibi olan insanlar yapmak, çok daha adil ve daha üretken bir topluma yol açacaktır."
 CHI_land_reform:0 "Toprak Reformu"
 CHI_land_reform_desc:0 "Komünistler, köylüler arasında birçok destekçi kazandıran agresif bir toprak yeniden dağıtım programı izliyor. Nüfusu kendi tarafımıza çekmek için daha az radikal bir program uygulamalıyız."
 CHI_land_tax_reform:0 "Arazi Vergisi Reformu"
 CHI_land_tax_reform_desc:0 "Mali durumumuzun acilen reforma ihtiyacı var. Bunun bir parçası da vergi tabanımızı genişletme ihtiyacıdır."
 CHI_land_value_tax:0 "Arazi Değer Vergisi"
 CHI_land_value_tax_desc:0 "Doğrudan araziyi vergilendirmek, bize en çok ayıracak parası olanlardan para alan çok daha istikrarlı ve adil bir vergilendirme sistemi sunar."
 CHI_ledo_road:0 "Ledo Yolu"
 CHI_ledo_road_desc:0 "Burma Yolu tek başına bizi ayakta tutamaz. Savaşta kalmamızı sağlayacak malzemeleri getirmek için yeni yollar bulmalıyız."
 CHI_legislative_yuan:0 "Yasama Yuanı"
 CHI_legislative_yuan_desc:0 "Halkın kendilerini yöneten yasaları yapacak bir organ seçme yeteneği, modern cumhuriyetin kalbinde yer alır. Ulusumuzun bu konuda eksik bulunmaması gerekir."
 CHI_lessons_of_war_completed:0 "§YOrdu Reformu§! ve §YSavaş Dersleri§!'nin tüm adımlarını tamamladı!\n"
 CHI_light_cruiser_project:0 "Hafif Kruvazör Projesi"
 CHI_light_cruiser_project_desc:0 "İnandırıcı bir açık deniz donanması yaratmanın ilk adımı, kruvazör filomuzu modernize etmektir. İlk projemiz çok iddialı olmamalıdır."
 CHI_local_arms_development:0 "Yerel Silah Geliştirme"
 CHI_local_arms_development_desc:0 "Yabancı silahların kaba kopyalarını üretmek yeterli değil. Çin'in geri kalanıyla aynı hızda ilerlemek istiyorsak, yeni silahlar geliştirmeliyiz."
 CHI_local_arms_production:0 "Yerel Silah Üretimi"
 CHI_local_arms_production_desc:0 "Savaşta sadece önemsiz küçük bir hizip olarak görüldüğümüz sürece, dışarıdan silah teslimatlarına güvenemeyiz. Silah yapmak için kendi cephaneliklerimizi geliştirmek zorunda kalacağız."
 CHI_local_bomber_production:0 "Yerel Bombardıman Uçağı Üretimi"
 CHI_local_bomber_production_desc:0 "Tek motorlu uçaklar için üretim teknolojilerinde ustalaştıktan sonra, yer desteği için daha ağır, çok motorlu modeller geliştirmeye ve üretmeye çalışabiliriz."
 CHI_local_fighter_production:0 "Yerel Avcı Uçağı Üretimi"
 CHI_local_fighter_production_desc:0 "İşgücü artık temel bakım görevlerine aşina olduğuna göre, modern bir avcı uçağı için tüm bileşenleri üretmeye devam edebiliriz."
 CHI_long_term_economic_planning:0 "Uzun Vadeli Ekonomik Planlama"
 CHI_long_term_economic_planning_desc:0 "Bürokratik aygıtımız Merkezi Hükûmetinki kadar büyük değil. Bu, ekonomik kalkınmayı engelleyen bürokrasinin çoğunu kesmemize ve mütevazı çabalarımızı mümkün olan en yüksek getiriyi elde etmek için odaklamamıza olanak tanır."
 CHI_military_affairs_commission:0 "Askeri İşler Komisyonu"
 CHI_military_affairs_commission_desc:0 "Ordumuz şok edici bir yetersizlik göstermiştir. Yüksek komutanlığın reformu, sorunu düzeltmek için sadece ilk adımdır."
 CHI_mining_commission:0 "Madencilik Komisyonu"
 CHI_mining_commission_desc:0 "Kaynaklar savaş çabası için kritik öneme sahiptir. İhtiyacımız olanı ürettiğinden emin olmak için madencilik endüstrimizin sorumluluğunu üstlenmeliyiz."
 CHI_mission_to_germany:0 "Almanya'ya Misyon"
 CHI_mission_to_germany_desc:0 "Avrupa'nın parya devletleri, ülkelerini reforme etme ve eski ihtişamlarına geri dönme konusunda büyük adımlar attılar. Onlardan çok şey öğrenebiliriz."
 CHI_mission_to_the_soviet_union:0 "Sovyetler Birliği'ne Misyon"
 CHI_mission_to_the_soviet_union_desc:0 "Sovyetler Birliği, esas olarak Japon yayılmacılığına karşı bir denge oluşturmak için Çin'e ilgi duyduğunu ifade etti. Hedeflerimizin uyuşup uyuşmadığını görmek için Moskova'ya bir misyon göndermeliyiz."
 CHI_mission_to_the_us:0 "ABD'ye Misyon"
 CHI_mission_to_the_us_desc:0 "Çin'in uzun zamandır ABD'de güçlü müttefikleri olmuştur. İhtiyacımız olan desteği almak için en iyi şansı temsil ediyorlar."
 CHI_mission_to_the_us_soong_us_decision:0 "§YSoong Mei-Ling§! bir §YSiyasi Danışman§! olduğu sürece, ABD §YJaponya§!'ya karşı savaşımızı destekleyebilecektir!\n"
 CHI_modern_logistics:0 "Modern Lojistik"
 CHI_modern_logistics_desc:0 "İşleyen bir lojistik sistemi olmadan, sahada bir orduyu idame ettiremeyiz."
 CHI_modern_submarines:0 "Modern Denizaltılar"
 CHI_modern_submarines_desc:0 "Japonlar, filolarına açık denizde meydan okuyacak teknik bilgiyi bize sağlamaya isteksizler, ancak denizaltı savaşını yardımcı bir kol olarak görüyorlar. Biz, elbette, bu görüşü paylaşmak zorunda değiliz."
 CHI_nationalism:0 "Milliyetçilik"
 CHI_nationalism_desc:0 "Bir kabileye veya bir dine değil de bir ulusa ait olma fikri, bir grup insanı bir devlete dönüştüren şeydir."
 CHI_naval_aviation:0 "Donanma Havacılığı"
 CHI_naval_aviation_desc:0 "Deniz savaşının geleceği uçak gemisidir. Kendi uçak gemilerimize sahip olmadıkça asla gerçek bir deniz gücü olarak kabul edilmeyeceğiz."
 CHI_new_life_movement:0 "Yeni Hayat Hareketi"
 CHI_new_life_movement_desc:0 "Ahlak, Dürüstlük, Adalet ve Sadakat'in dört erdemi bundan böyle vatandaşlarımızı daha iyi ve daha üretken bir hayata yönlendirecektir."
 CHI_new_model_province:0 "Yeni Model İl"
 CHI_new_model_province_desc:0 "Merkezi Hükûmet ülkeyi modern çağa sürüklemek için mücadele ederken, biz çok daha küçük ölçekte reformlar uygulayacak ve ulusun geri kalanının geri kalmışlığına karşın parlayan ilerleme meşaleleri olarak kabul edileceğiz."
 CHI_one_china_policy:0 "Tek Çin Politikası"
 CHI_one_china_policy_desc:0 "Devrimi takip eden kargaşada, bir dizi bölge ayrıldı ve kendi devletlerini kurmaya çalıştı. Bazıları sadece merkezi hükûmeti dinlemeyi bıraktı, diğerleri yeniden egemen devletlermiş gibi davrandı. Şimdi güçlendiğimize göre, yüzyıllardır var olan eski Çin sınırları üzerinde hak iddia ettiğimizi alenen ilan edeceğiz."
 CHI_opposition:0 "Muhalefet"
 CHI_opposition_desc:0 "Merkezi Hükûmet yozlaşmış ve zayıf. Komünistler 5000 yıllık Çin tarihini yok etmek istiyor. Bu durum, zor seçimleri yapmaya ve ülkeyi birleştirmeye istekli -ne pahasına olursa olsun- Büyük bir lider gerektiriyor."
 CHI_opposition_effect_tooltip:0 "§H[WTT_current_china_leader.GetNameDef]§!, buna yanıt olarak bizimle bir sınır savaşı başlatabilir."
 CHI_order_destroyers:0 "Muhrip Sipariş Et"
 CHI_order_destroyers_desc:0 "Donanmanın yeniden silahlandırılmasına yönelik ilk adım olarak, küçük bir grup muhrip üretilmelidir."
 CHI_overlordship_over_indochina:0 "Çinhindi Üzerinde Hakimiyet"
 CHI_overlordship_over_indochina_desc:0 "Çinhindi, eski zamanlardan beri Çin korumasına bağımlı olmuştur. Bölgenin Fransızlara düşmesi, kendilerini koruyamadıklarını gösteriyor."
 CHI_personal_leadership:0 "Kişisel Liderlik"
 CHI_personal_leadership_custom_tt:0 "[ROOT.GetLeader] rastgele şu özelliklerden birini kazanır: §Y$brilliant_strategist$§!, §Y$career_officer$§!, §Y$cavalry_officer$§!, §Y$infantry_officer$§!, §Y$old_guard$§!, §Y$politically_connected$§!, §Y$war_hero$§!."
 CHI_personal_leadership_desc:0 "Ordunun komutasını bölmek, rütbesinin üstünde fikirlere sahip bir subayın iktidarı gasp etmeye çalışma riskini taşır. Askerlerimizin her zaman hükûmete sadık olmasını sağlamalıyız."
 CHI_personal_leadership_tt:0 "§YChen Jitang§!, seviye §Y3§! Mareşal olarak kullanılabilir hale gelir"
 CHI_pick_a_fight_with_japan:0 "Japonya ile Kavga Çıkar"
 CHI_pick_a_fight_with_japan_desc:0 "Yıllardır Japonlar bize talep üstüne talep yığdı. O günler bitti. Bir dahaki sefere bizden en ufak bir talepte bulunduklarında, bir santim bile taviz vermeyeceğiz."
 CHI_power_struggle:0 "Güç Mücadelesi"
 CHI_power_struggle_desc:0 "Devlet işleri üzerindeki siyasi nüfuzumuz önemli ölçüde arttı. Artık diğer ülkelere eşit olarak yaklaşmayı deneyebiliriz."
 CHI_price_controls:0 "Fiyat Kontrolleri"
 CHI_price_controls_desc:0 "Enflasyonu kontrol altında tutmanın ilk adımı, kilit malların sabit fiyatlarla satılmasını sağlamaktır. Bu, tüccar sınıfı arasında popüler olmayacaktır."
 CHI_prioritize_the_interior:0 "İç Bölgelere Öncelik Ver"
 CHI_prioritize_the_interior_desc:0 "Japonların bizden çaldığı toprakları geri alma düşüncesini bile aklımızdan geçirmeden önce, iç bölgelerimizi güvence altına almalıyız. Birbirine karşı savaşan bir dizi bölgeye bölünmüş olarak, hiçbir şansımız olmayacak."
 CHI_proclaim_rival_government:0 "Rakip Hükûmet İlan Et"
 CHI_proclaim_rival_government_desc:0 "Hırslarımızı resmileştirme zamanı geldi. Çin üzerinde tam kontrolden daha azını talep etmiyoruz ve dünyanın geri kalanıyla eşit şartlarda müzakere edeceğiz."
 CHI_provoke_border_clashes:0 "Milliyetçilerle Sınır Çatışmaları"
 CHI_provoke_border_clashes_desc:0 "Henüz topyekûn bir savaşı riske atamayız. Küçük, kontrollü bir çatışma, düpedüz ezilmeden değerli bir zemin kazanmamızı sağlar. İdeal olarak, rakibimiz kuvvetlerini başka bir yere kaydırdığı anda saldıracağız."
 CHI_provoke_border_clashes_effect_tooltip:0 "[WTT_current_china_leader.GetNameDef] ile bir §HSınır Çatışması§! başlatmak için £decision_icon_small §HKararların§! kilidini açar\n"
 CHI_public_education_reform:0 "Halk Eğitimi Reformu"
 CHI_public_education_reform_desc:0 "Modern bir ulusun temeli bilgi ve bilimdir. Önce bu temeli geliştirmeli ve güçlendirmeliyiz."
 CHI_public_works:0 "Kamu İşleri"
 CHI_public_works_desc:0 "Nüfus, kendi iyilikleri için çalıştığımızı görebilmelidir. Birkaç yüksek profilli proje, faydalı propaganda malzemesi olarak hizmet edecek ve onlara tüm Çin'in bizi daha fazla desteklerse nasıl görünebileceğine dair bir tat verecektir."
 CHI_purchase_fighters_tt:0 "Destekçimizden 50 eski avcı uçağı alacağız. Hem Britanya'nın hem de ABD'nin desteğini sağlamak, her ikisinden de avcı uçağı satışını güvence altına alacaktır."
 CHI_purchase_tanks:0 "Tank Satın Al"
 CHI_purchase_tanks_desc:0 "Zırhlı araçlar, modern savaşın mızrak ucu olacaktır. Çin ordusunun ilk zırhlı birimlerini oluşturmaya hazırlık olarak mütevazı bir tank alımı yapmalıyız."
 CHI_purchase_tanks_tt:0 "Destekçimizden 100 eski hafif tank alacağız."
 CHI_rapid_mobilization:0 "Hızlı Seferberlik"
 CHI_rapid_mobilization_desc:0 "Çin'in liderliği için geçerli bir yarışmacı olmak için ordumuzun büyüklüğünü artırmalıyız. Eğitimi kolaylaştırmak ve her türlü zorluğa göğüs gerebilecek bir ordu yaratmak için yeni yöntemler geliştireceğiz."
 CHI_rapprochement_with_soviet_union:0 "Sovyetler Birliği ile Yakınlaşma"
 CHI_rapprochement_with_soviet_union_desc:0 "Sovyetler Birliği ile bazı ideolojik farklılıklarımız olsa da, bizimle aynı çıkarlara sahip oldukları açıktır. Yeni ilişkimizi resmileştirmeli ve dünyaya birlikte durduğumuzu göstermek için karşılıklı bir saldırmazlık paktı imzalamalıyız."
 CHI_reach_out_to_france:0 "Fransa ile Temas Kur"
 CHI_reach_out_to_france_desc:0 "Fransızlar bizi defalarca aşağılamış ve bize yeni tavizler dayatmış olsalar da, mevcut durumda onların yardımına pekala ihtiyaç duyabiliriz."
 CHI_reform_the_administration:0 "Yönetimi Reforme Et"
 CHI_reform_the_administration_desc:0 "Hükûmet düzeyindeki tüm çabalarımız, yerel düzeyde uygulanmazsa boşa gider. Mevcut yetkililerin emirlerimizi uygulayabilecek ve uygulamaya istekli olduğundan emin olmalıyız."
 CHI_reform_the_national_bank:0 "Ulusal Bankayı Reforme Et"
 CHI_reform_the_national_bank_desc:0 "Yeni bir Ulusal Banka, hükûmetin tüm mali faaliyetlerini koordine edecek ve gerekli fonları sağlayacaktır."
 CHI_refugee_relief_agency:0 "Mülteci Yardım Ajansı"
 CHI_refugee_relief_agency_desc:0 "Savaşın kargaşasıyla milyonlarca insan evsiz kaldı. Onlara kalacak yeni bir yer bulmalarında yardımcı olmak için bir ajans kuracağız."
 CHI_refugee_resettlement:0 "Mülteci Yeniden Yerleşimi"
 CHI_refugee_resettlement_desc:0 "Savaşın yarattığı milyonlarca umutsuz ve evsiz mültecinin bir yere yerleştirilmesi gerekiyor. Onlara topraklarımızda barınak vermek, onları ordumuz ve ekonomimiz için bir askerlik havuzu olarak tutabileceğimiz anlamına gelir."
 CHI_renegotiate_the_unequal_treaties:0 "Eşitsiz Antlaşmaları Yeniden Müzakere Et"
 CHI_renegotiate_the_unequal_treaties_desc:0 "Çok uzun zamandır, Batılılar kendi sınırlarımız içinde nasıl iş yapmamız gerektiğini dikte ettiler. Vatandaşları bizim yasalarımızdan korunuyor ve şehirlerimizde nasıl iş yaptıklarına dair hiçbir söz hakkımız yok. Bu sona ermeli. Onlarla bir kez daha eşit olarak duracağız."
 CHI_renounce_the_mcmahon_line:0 "McMahon Hattını Reddet"
 CHI_renounce_the_mcmahon_line_desc:0 "İmparatorluk Hükûmeti ile İngilizler arasında çizilen eski sınır, İngilizler ona saygı duyuyormuş gibi davrandığında bile hiçbir zaman doğru değildi. Onlarca yıldır, buna itiraz edemeyecek kadar zayıftık. Artık değil."
 CHI_republicanism:0 "Cumhuriyetçilik"
 CHI_republicanism_desc:0 "Batı'daki birçok kişi, batı modelinden sonra bir cumhuriyet olma konusunda samimi olup olmadığımızı merak ediyor. Niyetlerimiz hakkında kamuoyuna bir açıklama yapmalıyız."
 CHI_root_out_corruption:0 "Yolsuzluğun Kökünü Kazı"
 CHI_root_out_corruption_desc:0 "Onlarca yıldır, hükûmet yetkilileri kendi ceplerini doldurmak ve nüfusu taciz etmek için konumlarını kötüye kullandılar, ceplerini dolduran suçlulara göz yumdular. Bu artık sona eriyor."
 CHI_rural_militias:0 "Kırsal Milisler"
 CHI_rural_militias_desc:0 "Geniş kırsal kesimde, askeri destek genellikle bir saldırı mahalline ulaşmak için uzun zaman alır. Yerel milisler kurarak, herhangi bir işgalcinin kırsal kesimimizde hareket etmesinin zor olmasını sağlayabiliriz."
 CHI_rural_reconstruction_movement:0 "Kırsal Yeniden Yapılanma Hareketi"
 CHI_rural_reconstruction_movement_desc:0 "Kentsel nüfusumuzun yaşamını iyileştirmede büyük ilerleme kaydetmiş olsak da, onları ortaçağ koşullarında yaşayan köylülerden sadece birkaç kilometre ayırıyor. Her bir vatandaşımızın emeğimizin meyvelerinden yararlanabilmesini sağlayacağız."
 CHI_rural_schooling:0 "Kırsal Eğitim"
 CHI_rural_schooling_desc:0 "İyi eğitimli bir nüfus, bir ulusu modernleştirmenin anahtarıdır. Küçük bir avuç eğitimli yöneticiye güvenemeyiz, bilgi ve bilim ruhunu her köye taşımalıyız."
 CHI_scorched_earth_tactics:0 "Yakıp Yıkma Taktikleri"
 CHI_scorched_earth_tactics_desc:0 "Ulusal bir hayatta kalma mücadelesinde, hiçbir şey düşünülemez değildir ve her seçenek düşünülmelidir."
 CHI_secure_internal_politics:0 "İç Siyaseti Güvence Altına Al"
 CHI_secure_internal_politics_desc:0 "Eğer hükûmetimiz Çin siyasetinin kafa karıştırıcı karmaşasında ayakta kalacaksa, iç çekişmelerle dikkatimizin dağılmaması gerekir. Her türlü iç muhalefetin kökü kazınmalıdır."
 CHI_secure_the_peninsula:0 "Yarımadayı Güvence Altına Al"
 CHI_secure_the_peninsula_desc:0 "Kore yarımadasının bir daha asla düşman bir güç tarafından işgal edilmemesini sağlamak bizim çıkarımızadır."
 CHI_seek_japanese_support:0 "Japon Desteği Ara"
 CHI_seek_japanese_support_desc:0 "Hem Merkezi Hükûmetin hem de komünistlerin güçlü müttefikleri var. Bunun sonunda üstün gelmek istiyorsak, kendimize bir koruyucu bulmak zorunda kalacağız."
 CHI_sino_american_cooperative_organization:0 "Çin-Amerikan İşbirliği Örgütü"
 CHI_sino_american_cooperative_organization_desc:0 "Amerikan istihbaratı, düşman hatlarının gerisinde özel operasyonlar düzenlemek için bizimle çalışmaya istekli. Bu, bu alandaki kendi yeteneklerimizi geliştirmemize yardımcı olabilir."
 CHI_small_arms_expertise:0 "Hafif Silah Uzmanlığı"
 CHI_small_arms_expertise_desc:0 "Bireysel tüfek hala ordumuzdaki belirleyici silahtır. Bu alanda mümkün olduğunca modern kalmak için mütevazı kaynaklarımızı odaklamalıyız."
 CHI_strenghten_warlord_authority:0 "Savaş Lordu Otoritesini Güçlendir"
 CHI_strenghten_warlord_authority_desc:0 "Kontrol sahamızı güvence altına almak ve Kuomintang, komünistler ve Japonlar tarafından zayıflatılmadığımızdan emin olmak için, [ROOT.GetLeader]'in otoritesini güçlendirmeliyiz."
 CHI_subjugate_the_warlords:0 "Savaş Lordlarını Boyunduruk Altına Al"
 CHI_subjugate_the_warlords_desc:0 "Zayıf anımızda, yerel askeri liderler ülkenin büyük bir bölümünü kontrol altına aldı. Onlara bize cevap verdiklerini hatırlatma zamanı geldi - öyle ya da böyle."
 CHI_taiyuan_arsenal:0 "Taiyuan Cephaneliği"
 CHI_taiyuan_arsenal_desc:0 "Taiyuan Cephaneliği, Çin'de ağır silah üretebilen az sayıdaki yerden biridir. Birliklerimize topçu ve diğer silahları tedarik etmek için onu genişletmeliyiz."
 CHI_tank_plant:0 "Tank Tesisi"
 CHI_tank_plant_desc:0 "Yeni tanklar üzerine araştırmalar ilerlerken, şimdi onları inşa etmek için özel bir tesise yatırım yapabiliriz."
 CHI_technological_cooperation:0 "Teknolojik İşbirliği"
 CHI_technological_cooperation_desc:0 "Merkezi Hükûmet ile olan işbirliğimiz, geliştirdikleri her yeni teknolojiye erişimimizi sağlayacaktır."
 CHI_the_chinese_hindenburg_line:0 "Çin Hindenburg Hattı"
 CHI_the_chinese_hindenburg_line_desc:0 "Alman danışmanlarımız, Büyük Savaş'tan öğrenilen tahkimatların nasıl inşa edileceği konusunda bize birçok faydalı ipucu verdi. Düşmanın Şanghay'dan çıkma girişimleri bu tahkimatlarda paramparça olacaktır."
 CHI_the_chu_x_po:0 "Chu X-PO"
 CHI_the_chu_x_po_desc:0 "Chu X-PO, Çin'deki gelişimin zirvesini temsil ediyor - ilk yerel olarak geliştirilen ve üretilen, herhangi bir düşmana karşı kendi başına ayakta durabilen bir avcı uçağı."
 CHI_the_hump:0 "Hump"
 CHI_the_hump_desc:0 "Himalayalar üzerinden yapılan hava ikmal operasyonu, diğer taşıma yollarına göre zayıf bir alternatiftir, ancak bozulması çok daha zordur."
 CHI_the_soviet_volunteer_group_focus:0 "Sovyet Gönüllü Grubu"
 CHI_the_soviet_volunteer_group_focus_desc:0 "Hava kuvvetlerimiz bölgedeki diğer güçlere kıyasla acınası derecede yetersiz kalıyor. Sovyetler bir gönüllü grubu gönderme olasılığına açık görünüyor."
 CHI_the_yanan_incident:0 "Yan'an Olayı"
 CHI_the_yanan_incident_desc:0 "Partinin mevcut lideri, Sovyetler Birliği'ndeki sosyalist kardeşlerine sırtını döndü. Devrimi tüm Çin'e yayma konusunda desteklerini güvence altına almak için Sovyetlere yaklaşmalıyız."
 CHI_the_yanan_incident_effect_tt:0 "§H[WTT_communist_china.GetNameDef]§!'i komünist lider olarak değiştirmek için §H[SOU.GetNameDef]§!'den destek iste.\nBu, reddederlerse §H[WTT_communist_china.GetNameDef]§! ile bir savaşa yol açacaktır.\n§H[SOU.GetNameDef]§! ile yapılan bu anlaşma, bizi [SOU.GetLeader]'in taleplerine açık hale getirecektir\n"
 CHI_three_principles_of_the_people:0 "Halkın Üç İlkesi"
 CHI_three_principles_of_the_people_desc:0 "Cumhuriyetin kurucusu Dr. Sun Yat-Sen, onu şekillendirmesi gereken üç temel ilke belirledi: Minzu, Minquan ve Minsheng - Milliyetçilik, Demokrasi ve Sosyal Refah."
 CHI_train_marines:0 "Deniz Piyadeleri Eğit"
 CHI_train_marines_desc:0 "Uzun sahil şeridimiz düşman çıkarmalarına karşı savunmasızdır, ancak aynı zamanda bir düşman karadan işgal ederse beklenmedik bir yönden saldırma fırsatı da sunar."
 CHI_unemployment_assistance:0 "İşsizlik Yardımı"
 CHI_unemployment_assistance_desc:0 "İşsizlik, bir vatandaşı asla yoksulluğa ve kimsesizliğe düşürmemelidir. Açlık, Komünistlerin en iyi müttefikidir."
 CHI_unified_industrial_planning:0 "Birleşik Sanayi Planlaması"
 CHI_unified_industrial_planning_desc:0 "Agresif sanayileşme programımız geciktirilmemelidir."
 CHI_united_front:0 "Birleşik Cephe"
 CHI_united_front_desc:0 "Japonlar ensemizdeyken, yardım alabileceğimiz her yerden yardım kabul etmeye istekli olmalıyız - komünistlerden bile."
 CHI_uplift_the_cavalry_regiments:0 "Süvari Alaylarını Yücelt"
 CHI_uplift_the_cavalry_regiments_desc:0 "Bölgemizin uzun ve gururlu bir atçılık ve binicilik geleneği vardır. Bu gelenekleri onurlandırmalı ve süvarilerimizin en yüksek saygıyı görmesini ve silahlı kuvvetlerimizin ön saflarına getirilmesini sağlamalıyız."
 CHI_uplift_the_mountain_brigades:0 "Dağ Tugaylarını Geliştir"
 CHI_uplift_the_mountain_brigades_desc:0 "Çin'in iç bölgelerinin arazileri sert ve geçilmesi zordur. Bu nedenle, topraklarımızı düzgün bir şekilde koruyabilmek için engebeli ve dağlık arazide savaşmak amacıyla özel tugaylar eğitmeliyiz."
 CHI_war_of_anti_imperialism:0 "Anti-Emperyalizm Savaşı"
 CHI_war_of_anti_imperialism_desc:0 "Topraklarımız baskıdan kurtulduğunda, artık gözlerimizi düşman hatlarına çevirebilir ve bir daha asla oradan bir işgalin başlatılmayacağından emin olabiliriz."
 CHI_war_of_national_liberation:0 "Ulusal Kurtuluş Savaşı"
 CHI_war_of_national_liberation_desc:0 "Japon saldırısı püskürtüldüğünde, taarruza geçebilir ve tüm topraklarımızı kurtarabiliriz."
 CHI_war_of_resistance:0 "Direniş Savaşı"
 CHI_war_of_resistance_desc:0 "Henüz savaşı Japonlara taşıyacak kadar güçlü değiliz. Yeniden saldırıya geçebileceğimiz zamana kadar işgalcilere direnmek zorundayız."
 CHI_war_taxes:0 "Savaş Vergileri"
 CHI_war_taxes_desc:0 "Umutsuz zamanlar umutsuz önlemler gerektirir. Savaş devam ederken, nüfusun ekonomik kaynaklarını mümkün olan en üst düzeyde seferber etmeliyiz."
 CHI_wargaming_division:0 "Savaş Oyunu Tümeni"
 CHI_wargaming_division_desc:0 "Genelkurmay'da gelecekteki savaşları tahmin etmeye ve düşmanlarımızı nasıl yeneceğimize dair yeni taktikler ve stratejiler geliştirmeye odaklanan özel bir departman oluşturmalıyız. Belki de bir dünya savaşını simüle etmek için bir tür hesaplama cihazı kullanabilirler..."
 CHI_welfare:0 "Refah"
 CHI_welfare_desc:0 "Modern bir devlet vatandaşlarına bakar, böylece ihtiyaç anında vatandaşlar onu savunabilir ve savunmaya istekli olur."
 CHI_whampoa_military_academy:0 "Whampoa Askeri Akademisi"
 CHI_whampoa_military_academy_desc:0 "Düzgün bir liderlik olmadan bir ordu işe yaramaz. Ordumuzu birinci sınıf bir güce dönüştürmek istiyorsak, onu yönetecek iyi eğitimli subaylara sahip olmalıyız."
 JAP_agility_focus:0 "Çeviklik Odağı"
 JAP_agility_focus_desc:0 "Sadece menzil, modellerimiz vardıklarında düşmanla rekabet edemezse bize bir fayda sağlamaz. Üstün çevikliğe sahip araçlar üretmeliyiz ki asla manevra dışı bırakılamasınlar."
 JAP_alliance_with_siam:0 "Siyam ile İttifak"
 JAP_alliance_with_siam_desc:0 "Siyam, Batılı güçlerle yapacağımız savaşta bize yardım etmek için birinci sınıf bir konumda yer alıyor. Onları yanımıza alarak, kaçınılmaz Malaya ve dolayısıyla Doğu Hint Adaları işgalini büyük ölçüde kolaylaştıracağız."
 JAP_ally_with_the_zaibatsus:0 "Zaibatsu'larla İttifak Kur"
 JAP_ally_with_the_zaibatsus_desc:0 "Ulusumuzun en büyük şirketleri uzun zamandır eşi görülmemiş bir siyasi ve ekonomik güce sahipti. Onlar, özgürlüğün ve bireyselliğin sunduğu tüm fırsatların bir kanıtıdır ve ulusun iyiliği için onlarla birlikte çalışmaya çalışmalıyız."
 JAP_anti_communist_bulwark:0 "Anti-Komünist Kale"
 JAP_anti_communist_bulwark_desc:0 "Demokrasi ilkeleri komünizmle bağdaşmaz. Bu ideolojiye karşı sıkı durmalı ve böylece hem kendimizi hem de bize güvenenleri korumalıyız."
 JAP_anti_communist_volunteers:0 "Anti-Komünist Gönüllüler"
 JAP_anti_communist_volunteers_desc:0 "Resmi olarak bir çatışmaya dahil olmasak bile, komünizmi nerede bulursak orada savaşmalıyız. Bu durumlarda davamızı savunmak için gönüllüler göndereceğiz."
 JAP_approach_the_young_officers:0 "Genç Subaylara Yaklaş"
 JAP_approach_the_young_officers_desc:0 "Eski nesiller, yeni düşünce tarzına kolayca ikna edilemeyecek kadar kendi yollarına saplanmış durumdalar. Bunun yerine genç nesillerle başlayacağız."
 JAP_approach_the_young_officers_tt:0 "§G3§! komünist general kazanır.\n"
 JAP_armored_divisions:0 "Zırhlı Tümenler"
 JAP_armored_divisions_desc:0 "Diğer uluslar zırhlı tümenin gücünü zaten öğrendi. Geride kalmamalı ve düşmana hem sert hem de hızlı bir şekilde saldırmamızı sağlayacak daha gelişmiş ve daha güçlü zırh modelleri geliştirmeliyiz."
 JAP_army_expansion:0 "Ordu Genişlemesi"
 JAP_army_expansion_desc:0 "Orduyu genişletme amacımıza ulaşmak için, savaş sanatında insanları eğitme konusunda kanıtlanmış yeteneğe sahip subayların becerilerini kullanmalıyız."
 JAP_army_expansion_law:0 "Ordu Genişletme Yasası"
 JAP_army_expansion_law_desc:0 "Hükûmetimizin temel ilkelerinden biri, askeri kuvvetlerimizin derhal ve büyük ölçüde artırılması olmalıdır."
 JAP_asian_communist_solidarity:0 "Asya Komünist Dayanışması"
 JAP_asian_communist_solidarity_desc:0 "Asyalı kardeşlerimizle birlikte durmalıyız. Batı tipi komünizmin burada yeri yok, ancak komşularımızla birlikte Asya'nın ihtiyaçlarına uygun bir versiyonunu yayabiliriz."
 JAP_asian_communist_solidarity_tt:0 "§H[WTT_communist_china.GetNameWithFlag]§!'i ittifakımıza davet et."
 JAP_bicycle_battalions:0 "Bisikletli Taburlar"
 JAP_bicycle_battalions_desc:0 "Hareket kabiliyeti anahtardır. Kuvvetlerimiz bisikletlerle donatılacak, bu da tümenleri manevra yaptırma yeteneğimizi büyük ölçüde artıracak."
 JAP_bomber_modernization:0 "Bombardıman Uçağı Modernizasyonu"
 JAP_bomber_modernization_desc:0 "Modernize edilmiş bir taktik bombardıman uçağı gücü, savaş alanında ordumuzu desteklemenin anahtarıdır."
 JAP_build_up_the_manchurian_army:0 "Mançurya Ordusunu Güçlendir"
 JAP_build_up_the_manchurian_army_desc:0 "[MAN.GetNameDefCap] herhangi bir kuzey savaşının ön saflarında olacaktır. Potansiyel düşman saldırılarına karşı koyabilecek kadar güçlü olduklarından emin olmalıyız."
 JAP_bypass_the_philippines:0 "Filipinler'i Es Geç"
 JAP_bypass_the_philippines_desc:0 "Filipinler, gerçek hedefimize giden yolda istenmeyen bir dikkat dağıtıcıdır. Şimdilik onu görmezden geleceğiz."
 JAP_carrier_warfare_experiments:0 "Uçak Gemisi Harbi Deneyleri"
 JAP_carrier_warfare_experiments_desc:0 "Zırhlılar geçmiş bir çağın kalıntılarıdır. Geleceğe bakmalıyız ve gelecek havacılıktır. Uçak gemileri, bu hava gücünü Pasifik boyunca yansıtmamızı sağlayacaktır."
 JAP_cast_the_die:0 "Zarları At"
 JAP_cast_the_die_desc:0 "Siyasi ve askeri üssümüz yeterince güvende. Kaderimizi ele geçirme zamanı geldi!"
 JAP_challenge_the_zaibatsus:0 "Zaibatsu'lara Meydan Oku"
 JAP_challenge_the_zaibatsus_desc:0 "Ulusumuzun en büyük şirketleri uzun zamandır eşi görülmemiş bir siyasi ve ekonomik güce sahipti. Onlara hala İmparator'un isteklerine tabi olduklarını hatırlatmalıyız."
 JAP_cleaning_up_our_own_mess:0 "Başladığımızı Bitirmek"
 JAP_coal_liquification:0 "Kömür Sıvılaştırma"
 JAP_coal_liquification_desc:0 "[JAP.GetNameDefCap] petrol sıkıntısı çekiyor ve bu yüzden sentetik petrol alanındaki çabalarımızı iki katına çıkarmalıyız."
 JAP_communist_volunteers:0 "Komünist Gönüllüler"
 JAP_communist_volunteers_desc:0 "Mücadelemiz burada bitmiyor. Diğer ulusları da yükseltmeliyiz. En iyilerimiz ve en parlaklarımız, devrimi benimsemiş olan bu uluslarda davamızı savunmak için ileri gönderilecek!"
 JAP_create_a_manchurian_imperial_air_force:0 "Bir Mançurya İmparatorluk Hava Kuvveti Oluştur"
 JAP_create_a_manchurian_imperial_air_force_desc:0 "Hava üstünlüğü savaşı kazanmanın anahtarı olacaktır. Eğer [MAN.GetNameDef]'in kendi hava kuvvetleri olsaydı, bu hava durumumuzu iyileştirmede büyük bir yol kat ederdi."
 JAP_cruiser_modernization:0 "Kruvazör Modernizasyonu"
 JAP_cruiser_modernization_desc:0 "Kruvazörler Pasifik boyunca görev güçlerimizin temel dayanağı olacak ve bu yüzden inşa edebileceğimizin en iyisine ihtiyacımız var."
 JAP_develop_aluminum_sources:0 "Alüminyum Kaynaklarını Geliştir"
 JAP_develop_aluminum_sources_desc:0 "Havacılık programlarımız bol miktarda alüminyum gerektiriyor ve bu nedenle Mançurya kaynakları kapsamlı bir şekilde geliştirilmelidir."
 JAP_develop_chinese_resources:0 "Çin Kaynaklarını Geliştir"
 JAP_develop_chinese_resources_desc:0 "Elimize geçen zengin Çin kaynaklarını, bir sonraki savaş için faydalı olabilmeleri için geliştirmeliyiz."
 JAP_establish_the_northern_resource_area:0 "Kuzey Kaynak Sahasını Kur"
 JAP_establish_the_northern_resource_area_desc:0 "Zengin Sibirya toprakları, sürekli büyüyen savaş makinemiz için sömürülmelidir."
 JAP_exchange_the_exiles:0 "Sürgünleri Değiştir"
 JAP_exchange_the_exiles_desc:0 "Daha önce sol eğilimli subaylarımızı ve memurlarımızı Mançurya'ya gayriresmi sürgüne göndermişken, şimdi onları daha sağ eğilimli olanlarımızla değiştireceğiz."
 JAP_expand_manchurian_railways:0 "Mançurya Demiryollarını Genişlet"
 JAP_expand_manchurian_railways_desc:0 "Mançurya altyapısının, artan sanayileşmenin yükünü taşıması için büyük ölçüde genişletilmesi gerekiyor."
 JAP_expand_the_showa_steel_works:0 "Showa Çelik Fabrikalarını Genişlet"
 JAP_expand_the_showa_steel_works_desc:0 "Showa Çelik Fabrikalarını, büyük ölçekli sanayileşmenin hayati bir önkoşulu olarak üretimini büyük ölçüde artırmak için genişletmeliyiz."
 JAP_expand_the_snlf:0 "SNLF'yi Genişlet"
 JAP_expand_the_snlf_desc:0 "Pasifik'teki bir savaş büyük ölçüde deniz çıkarmalarını içerecektir. Özel Deniz Çıkarma Kuvvetleri, göreve hazır olmaları için genişletilmelidir. "
 JAP_exploit_the_southern_resource_area:0 "Güney Kaynak Sahasını Sömür"
 JAP_exploit_the_southern_resource_area_desc:0 "Savaşımızda kuvvetlerimizi beslemek için Doğu Hint Adaları'nın bol kaynaklarının sömürülmesini büyük ölçüde genişletmeliyiz."
 JAP_fighter_modernization:0 "Avcı Uçağı Modernizasyonu"
 JAP_fighter_modernization_desc:0 "Hava savaşı da dahil olmak üzere her alanda düşmanlarımıza karşı üstünlüğümüzü korumalıyız. Modernize edilmiş avcı uçakları bunu başarmak için gereklidir."
 JAP_finish_the_fight:0 "Mücadeleyi Bitir"
 JAP_finish_the_fight_desc:0 "Mücadeleyi eski sömürgemize taşımalı ve Japon ideolojik hasımlarımızın son kalesini ortadan kaldırmalıyız."
 JAP_first_air_fleet:0 "Birinci Hava Filosu"
 JAP_first_air_fleet_desc:0 "Saldırı gücünü en üst düzeye çıkarmak için, dünyanın şimdiye kadar gördüğü en büyük uçak gemisi yoğunluğunu tek bir savaş grubunda birleştireceğiz. Bu formda ortak saldırı operasyonlarını mümkün kılmak için gereken doktrinleri geliştirerek, düşmanlarımızın donanma havacılığındaki üstünlüğümüze karşı hiçbir şansı olmayacak."
 JAP_fortify_the_border:0 "Sınırı Tahkim Et"
 JAP_fortify_the_border_desc:0 "Kuzey sınırı neredeyse savunmasız. Kuzey savunmamızı bu yönden gelebilecek olası bir saldırıya karşı hazırlamalıyız."
 JAP_full_sovereignty_for_the_philippines:0 "Filipinler için Tam Egemenlik"
 JAP_full_sovereignty_for_the_philippines_desc:0 "Kendi kaderini tayin etme hakkı Asya genelinde daha da yayılmalıdır. [USA.GetNameDefCap] hala Filipinler'i kontrol ediyor ve Filipin halkının demokratik haklarına saygı duymaya zorlanmalıdır."
 JAP_german_rocketry:0 "Alman Roketçiliği"
 JAP_german_rocketry_desc:0 "Daha fazla Alman teknolojik gelişmesi savaş çabamız için son derece faydalı olacaktır. Bu şemaları ne pahasına olursa olsun elde etmeliyiz."
 JAP_greater_east_asian_co_prosperity_sphere:0 "Büyük Doğu Asya Ortak Refah Sahası"
 JAP_greater_east_asian_co_prosperity_sphere_desc:0 "Batı emperyalizminin zamanı sona erdi. Asya halkları bir araya gelmeli ve liderliğimiz altında güçlü, birleşik bir kıta olarak durmalıdır. Asya Asyalılarındır!"
 JAP_guide_the_zaibatsus:0 "Zaibatsu'lara Rehberlik Et"
 JAP_guide_the_zaibatsus_desc:0 "Ulusumuzun en büyük şirketleri uzun zamandır eşi görülmemiş bir siyasi ve ekonomik güce sahipti. Biraz ustalıkla, onların çabalarını lehimize yönlendirebiliriz."
 JAP_heavy_industry_development:0 "Ağır Sanayi Gelişimi"
 JAP_heavy_industry_development_desc:0 "Ağır askeri sanayi, bir ordunun gelişmiş ihtiyaçları için hayati öneme sahiptir ve bu nedenle genişletilmelidir."
 JAP_if_man_accepts:0 "Eğer §HMançukuo§! kabul ederse şunlar olacak:\n"
 JAP_imperial_arsenals:0 "İmparatorluk Cephanelikleri"
 JAP_imperial_arsenals_desc:0 "Savaş sanayimiz üzerindeki imparatorluk kontrolünü artırmak, verimliliği ve dolayısıyla çıktıyı artırmada uzun bir yol kat edecektir."
 JAP_intervene_in_china:0 "Marco Polo Köprüsü Olayı"
 JAP_intervene_in_china_desc:0 "[Root.GetNameDefCap] kaynak bakımından fakir, ancak komşularımız değil. Eksik olduğumuz şeyi onlardan almalıyız ve bunu yapmaya başlamak için sadece bir bahaneye ihtiyacımız var. Böyle bir bahane, birkaç girişimci asker tarafından sağlanabilir, ardından İmparator, ne kadar hazırlıksız olursa olsun, bir savaşa rıza göstermekten başka seçeneği kalmayacaktır..."
 JAP_japanese_settlement:0 "Japon Yerleşimi"
 JAP_japanese_settlement_desc:0 "Kendi halkımızı Mançurya'ya yerleştirerek, işgücünü artırabilir ve böylece fabrikalar için daha uygun yerler yaratabiliriz."
 JAP_jet_prototypes:0 "Jet Prototipleri"
 JAP_jet_prototypes_desc:0 "Havacılığın geleceği pervanelerde yatmıyor. Uçaklarımız için geliştirilmiş yetenekler için jet itiş gücüne bakmalıyız."
 JAP_join_comintern:0 "Komintern'e Katıl"
 JAP_join_comintern_desc:0 "Dünyaya karşı tek başımıza duramayız. Devrimi korumak için komünizmin doğduğu yerle birlikte durmalıyız!"
 JAP_join_the_london_naval_treaty:0 "Londra Deniz Antlaşması'na Katıl"
 JAP_join_the_london_naval_treaty_desc:0 "Ayıya karşı koyacaksak kanatlarımızı korumalıyız. Donanma yığınağımızı düzenleyen bir kağıt parçası imzalamak bize barış getirecekse, öyle olsun."
 JAP_liaison_conference:0 "İrtibat Konferansı"
 JAP_liaison_conference_desc:0 "Hükûmetin ve ordunun tüm kollarından irtibat görevlilerini merkezi bir konferansa göndererek, karar alma hızımızı büyük ölçüde artırabiliriz."
 JAP_liberate_manchuria:0 "Mançurya'yı Özgürleştir"
 JAP_liberate_manchuria_desc:0 "Mançurya otoriter yönetim altında varlığını sürdürüyor; sömürgeci yönetimimizin çirkin bir kalıntısı. Bu durumu düzeltmeli ve bölgenin haklı Çin kontrolüne geri dönmesini sağlamalıyız."
 JAP_liberate_manchuria_tt:0 "Karar, Mançurya'nın fethinden sonra alınabilir.\n"
 JAP_light_industry_development:0 "Hafif Sanayi Gelişimi"
 JAP_light_industry_development_desc:0 "Hafif askeri sanayi, bir ordunun temel ihtiyaçları için hayati öneme sahiptir ve bu nedenle genişletilmelidir."
 JAP_long_lance_torpedoes:0 "Uzun Mızrak Torpidoları"
 JAP_long_lance_torpedoes_desc:0 "Küresel kaynak dağılımının acımasızlıkları donanmamızı düşmana karşı sayıca az bıraktı. Bu nedenle, dünyanın henüz en gelişmiş torpidosunu geliştireceğiz: sıkıştırılmış hava yerine sıkıştırılmış oksijenle çalışan, çok uzun menzilli ve güçlü bir silah, bu da daha küçük yüzey gemilerimizin kendi ağırlıklarının çok üzerinde vurmasına olanak tanıyacak."
 JAP_modern_artillery:0 "Modern Topçu"
 JAP_modern_artillery_desc:0 "Askerlerimiz cesur ve şiddetli olsa da, ilerlemelerine yardımcı olmak için üstün topçuya ihtiyaçları var."
 JAP_modern_escorts:0 "Modern Eskortlar"
 JAP_modern_escorts_desc:0 "Filolarımızın, düşman denizaltıları ve torpido botları tarafından engellenmeden faaliyet gösterebilmesi için en modern eskortlara ihtiyacı var."
 JAP_modern_shogunate:0 "Modern Şogunluk"
 JAP_modern_shogunate_desc:0 "İmparator daha törensel bir rolde kalmalı, onun adına hareket eden güçlü aracılar olmalıdır. Bu, İmparator'un sözünün kesinlikle daha uzağa ve daha geniş bir alana yayılmasını sağlayacaktır."
 JAP_national_defense_state:0 "Ulusal Savunma Devleti"
 JAP_national_defense_state_desc:0 "Her vatandaşın, ulusumuzu herhangi bir saldırıya dayanabilecek bir kaleye dönüştürmenin aciliyetini görmesi sağlanmalıdır."
 JAP_national_mobilization_law:0 "Ulusal Seferberlik Yasası"
 JAP_national_mobilization_law_desc:0 "Yeni mevzuat, askerlik hizmetini daha yaygın hale getirecek, böylece halka bir görev duygusu aşılayacak ve savaşın gerekliliğini onlara açıkça gösterecektir."
 JAP_national_research_policy:0 "Ulusal Araştırma Politikası"
 JAP_national_research_policy_desc:0 "Araştırma kurumlarımızın hükûmet desteği ve kontrolü, Ar-Ge programlarımızda bize daha fazla esneklik ve üretkenlik sağlayacaktır."
 JAP_nationalize_the_zaibatsus:0 "Zaibatsu'ları Millileştir"
 JAP_nationalize_the_zaibatsus_desc:0 "Ulusumuzun en büyük şirketleri uzun zamandır eşi görülmemiş bir siyasi ve ekonomik güce sahipti. Bu burada bitiyor. Devletin kontrolüne meydan okunmayacak."
 JAP_nationalize_war_industry:0 "Savaş Sanayisini Millileştir"
 JAP_nationalize_war_industry_desc:0 "Savaş sanayimiz üzerindeki devlet kontrolünü artırmak, verimliliği ve dolayısıyla çıktıyı artırmada uzun bir yol kat edecektir."
 JAP_new_naval_estimates:0 "Yeni Donanma Tahminleri"
 JAP_new_naval_estimates_desc:0 "Donanmamızın büyüklüğündeki artış için yeni tahminler yayınlamalı ve dolayısıyla bu artışı sağlamak için gereken tersane tesislerini belirlemeliyiz."
 JAP_non_aggression_pact_with_china:0 "Çin ile Saldırmazlık Paktı"
 JAP_non_aggression_pact_with_china_desc:0 "Çin ile ilişkilerimiz tarihsel olarak en hafif tabirle gergin olsa da, şimdi kuzey ilerlememiz için birlikleri serbest bırakmak için onlarla bir saldırmazlık paktına ihtiyacımız var."
 JAP_non_aggression_pact_with_the_soviet_union:0 "[SOV.GetNameDef] ile Saldırmazlık Paktı"
 JAP_non_aggression_pact_with_the_soviet_union_desc:0 "Güneye saldırma özgürlüğüne sahip olmak istiyorsak kuzey sınırımız güvence altına alınmalıdır. [SOV.GetNameDef] ile derhal müzakerelere başlayacağız."
 JAP_open_up_the_universities:0 "Üniversitelerin Kapılarını Aç"
 JAP_open_up_the_universities_desc:0 "Mirasları veya sosyal statüleri ne olursa olsun, herkesin eğitim almasına izin verilmelidir."
 JAP_pacific_guardian:0 "Pasifik Koruyucusu"
 JAP_pacific_guardian_desc:0 "Pasifik içindeki ve çevresindeki tüm Asya devletlerinin koruyucusu rolünü üstleneceğiz. Batı emperyalizminden kurtulduktan sonra, onları tam teşekküllü demokrasiler olarak yükseltmek için yol gösterici bir ele ihtiyaçları olacak."
 JAP_people_owned_mines:0 "Halkın Sahip Olduğu Madenler"
 JAP_people_owned_mines_desc:0 "Halkın, çalıştıkları madenlerde bir paya sahip olmasına izin verilecek, bu da işçi motivasyonunu ve verimliliğini artıracaktır."
 JAP_pre_emptive_coup:0 "Önleyici Darbe"
 JAP_pre_emptive_coup_desc:0 "İdeallerimiz otoriter bir hükûmet tarafından ezilmeden önce, önce biz saldırmalı ve çocuklarımız için ulusumuzun geleceğini güvence altına almalıyız."
 JAP_preemptive_war:0 "Önleyici Savaş"
 JAP_preemptive_war_desc:0 "Kuzey sınırlarımızda artan [SOV.GetAdjective] saldırganlığına dair raporlar uydurarak, kuzey tehdidini ortadan kaldırmak için önleyici bir saldırı gerekliliği bahanesini kendimize verebiliriz."
 JAP_prepare_for_war_with_the_soviet_union:0 "[SOV.GetNameDef] ile Savaşa Hazırlan"
 JAP_prepare_for_war_with_the_soviet_union_desc:0 "Kuzey sınırlarımızdaki [SOV.GetSovietThreatName] tehdidiyle başa çıkılmalıdır. [SOV.GetNameDef] ile bir savaşa hazırlanmaya başlamalıyız."
 JAP_public_works:0 "Kamu İşleri"
 JAP_public_works_desc:0 "Yeni bir dizi kamu işi, herkes için iş güvencesi sağlamanın yanı sıra ülke çapında altyapıda iyileştirmeler de sağlayacaktır."
 JAP_purge_the_kodoha_faction:0 "Kodoha Hizbini Tasfiye Et"
 JAP_purge_the_kodoha_faction_desc:0 "Hükûmetin kontrolünü ele geçirmeye ve Sovyetler Birliği'ne kuzeyden saldırmaya niyetli yeni bir hizip ortaya çıktı. Çok fazla zarar vermeden önce onları ortadan kaldırmalıyız."
 JAP_purge_the_militarists:0 "Militaristleri Tasfiye Et"
 JAP_purge_the_militarists_desc:0 "Askeri gücün her şeyin cevabı olduğuna inananlar, daha mantıklı düşünmeye yer açmak istiyorsak adalarımızdan tasfiye edilmelidir. Kendi yollarını sınırlarımızın dışında bulabilirler."
 JAP_range_focus:0 "Menzil Odağı"
 JAP_range_focus_desc:0 "Pasifik harekât alanındaki savaşta mesafeler çok büyük ve bu yüzden bu mesafeleri kapatabilecek modellere ihtiyacımız var."
 JAP_rebuild_the_civil_service:0 "Memuriyeti Yeniden İnşa Et"
 JAP_rebuild_the_civil_service_desc:0 "Ulusumuzu düzgün bir şekilde yönetmek için, memuriyeti en yetenekli insanlarla yeniden inşa edeceğiz."
 JAP_red_brigades:0 "Kızıl Tugaylar"
 JAP_red_brigades_desc:0 "Her erkek ve kadın devleti korumak için görevini yapmalıdır. Bunu yapma fırsatına sahip olmalarını sağlayacağız."
 JAP_reeducation_campaign:0 "Yeniden Eğitim Kampanyası"
 JAP_reeducation_campaign_desc:0 "Büyük devrimimizin ardından huzursuzluk yaygın. En uygun bulduğumuz davranışı pekiştirmek için halkı yeniden eğitmeliyiz."
 JAP_rekindle_the_old_alliance:0 "Eski İttifakı Yeniden Canlandır"
 JAP_rekindle_the_old_alliance_desc:0 "En iyi şansımız, Büyük Savaş'taki eski müttefikimizle yatmaktadır. Eski ittifakı yeniden etkinleştirecek ve demokrasiyi savunmada [ENG.GetNameDef] ile birlikte duracağız."
 JAP_research_spending:0 "Araştırma Harcamaları"
 JAP_research_spending_desc:0 "Ulusumuzun en iyilerinden ve en parlaklarından tam olarak yararlanmak istiyorsak, Ar-Ge'ye uygun büyüklükte bir bütçe ayrılmalıdır."
 JAP_secure_china:0 "Çin'i Güvence Altına Al"
 JAP_secure_china_desc:0 "Çin direnişi inatçı ve kesintisiz olduğunu kanıtlıyor. Anakara'yı tüm hızıyla pasifize etme çabalarımızı iki katına çıkarmalıyız."
 JAP_secure_the_philippines:0 "Filipinler'i Güvence Altına Al"
 JAP_secure_the_philippines_desc:0 "Filipinler, gerçek hedefimize giden yolda gerekli bir üs. Gelecekteki askeri operasyonlar için onu güvence altına almalıyız."
 JAP_showa_restoration:0 "Şova Restorasyonu"
 JAP_showa_restoration_desc:0 "Göstermelik liderlerin zamanı çoktan geçti ve İmparator'un kendisi devletin doğrudan kontrolünü ele almalıdır. Ancak o zaman İmparatorluğumuz Batılı emperyalistlere karşı durabilecektir."
 JAP_sign_tripartite_pact:0 "Üçlü Pakt'ı İmzala"
 JAP_sign_tripartite_pact_bypass_tt:0 "Ya Almanya ya da İtalya'nın faşist bir hükûmeti yok ya da onlardan biriyle savaştayız."
 JAP_sign_tripartite_pact_desc:0 "Önümüzde uzanan görev, yeteneklerimiz için bir meydan okuma olabilir. Bir miktar işbirliği yapmak için benzer hedeflere sahip diğer hükûmetlere ulaşmalıyız."
 JAP_small_arms_modernization:0 "Hafif Silah Modernizasyonu"
 JAP_small_arms_modernization_desc:0 "Askeri kuvvetlerimizin, potansiyel düşmanlarımızla rekabet edebilmesi için modernize edilmiş silahlara ihtiyacı var."
 JAP_spiritual_mobilization:0 "Ruhani Seferberlik"
 JAP_spiritual_mobilization_desc:0 "Şinto'nun halkın askeri görev duygusuna hitap eden ilkelerini geliştirerek, yeni acemi asker miktarını artırabiliriz."
 JAP_strategic_bomber_effort:0 "Stratejik Bombardıman Uçağı Çabası"
 JAP_strategic_bomber_effort_desc:0 "Ne kadar istesek de, savaşlar sadece doğrudan askeri çatışmalarla kolayca kazanılamaz. Endüstriyel kapasite savaşların sonucunu büyük ölçüde etkiler ve bu yüzden düşmanın sanayisini hatların gerisinde yok edebilecek yeni stratejik bombardıman uçağı modellerine yatırım yapmalıyız."
 JAP_strengthen_civilian_government:0 "Sivil Hükûmeti Güçlendir"
 JAP_strengthen_civilian_government_desc:0 "Liberalizm ve demokrasinin artan değerleri, ulusumuza bir tehdit olmaktan çok, en büyük güçleri olabilir. Bu idealleri koruyabilmesi için hükûmetimizin güçlendirilmesini sağlamalıyız."
 JAP_strengthen_the_divine_wind:0 "İlahi Rüzgarı Güçlendir"
 JAP_strengthen_the_divine_wind_desc:0 "Kamikaze, Özel Saldırı Birimi'nin taktikleri, intihar saldırılarını doğaçlama bir son çareden yerleşik bir doktrine dönüştürdü. Yeni uçaklarla, esasen insanlı füzelerle, bu saldırılar durdurulamaz olacak."
 JAP_strengthen_the_divine_wind_effect:0 "§HYokosuka MXY7 Ohka§! üretimine olanak tanır!"
 JAP_strengthen_the_divine_wind_effect_bba:0 "§HSabit Patlayıcı Şarj§! modülünü etkinleştirir"
 JAP_strike_on_the_southern_resource_area:0 "Güney Kaynak Sahasına Saldırı"
 JAP_strike_on_the_southern_resource_area_desc:0 "Planımızı harekete geçirme zamanı geldi. Güneye saldıracak ve kaynak zengini Batı sömürgelerini kendimiz için alacağız."
 JAP_strike_south_doctrine:0 "Güneye Saldırı Doktrini"
 JAP_strike_south_doctrine_desc:0 "Zengin olmasına rağmen, Çin ihtiyaç duyduğumuz tüm kaynaklara sahip değil. Ancak güneyde çok da uzak olmayan Hollanda Doğu Hint Adaları ve Malaya ile Borneo'nun İngiliz sömürgeleri yatıyor. Gerçek kendi kendine yeterlilik için bu bölgelerin kontrolünü Avrupalı emperyalistlerden söküp almalıyız."
 JAP_support_the_kodoha_faction:0 "Kodoha Hizbini Destekle"
 JAP_support_the_kodoha_faction_desc:0 "Hükûmetin kontrolünü ele geçirmeye ve Sovyetler Birliği'ne kuzeyden saldırmaya niyetli yeni bir hizip ortaya çıktı. İmparator ve İmparatorluğun geleceği uğruna, bu hizbin galip gelmesini sağlamalıyız!"
 JAP_supremacy_of_technology:0 "Teknoloji Üstünlüğü"
 JAP_supremacy_of_technology_desc:0 "Bize zaferi getirecek olan teknolojidir. Tüm çabalar, silah ve teçhizat açısından düşmanlarımızı geride bırakmayı amaçlayan çabalara yönlendirilmelidir."
 JAP_supremacy_of_the_battlefleet:0 "Savaş Filosu Üstünlüğü"
 JAP_supremacy_of_the_battlefleet_desc:0 "Üstün zırhlı tasarımlarımızla, deniz savaşını karara bağlamak için sadece bir belirleyici çatışmaya ihtiyacımız var. Savaş filomuzu böyle bir çatışmayı zorlamasına ve kazanmasına olanak tanıyacak şekilde optimize etmeliyiz."
 JAP_supremacy_of_will:0 "İrade Üstünlüğü"
 JAP_supremacy_of_will_desc:0 "En gelişmiş teçhizat, onu kullanacak şiddetli bir adam olmadan işe yaramaz ve şiddet en basit bir taşı en ölümcül silahlara dönüştürebilir."
 JAP_technological_exchange:0 "Teknolojik Değişim"
 JAP_technological_exchange_desc:0 "Ayıya karşı koymak için müttefiklere ihtiyacımız var. Almanya sadece iyi bir aday değil, aynı zamanda mücadelemizde bize yardımcı olabilecek bol miktarda teknolojik gelişmelere de sahip."
 JAP_the_fate_of_the_imperial_family:0 "İmparatorluk Ailesinin Kaderi"
 JAP_the_fate_of_the_imperial_family_desc:0 "Japonya'daki kalıtsal yönetimin son kalıntılarıyla ilgilenme zamanı geldi. İmparator ve ailesinin kaderinin ne olacağına karar vermeliyiz."
 JAP_the_korean_question:0 "Kore Sorunu"
 JAP_the_korean_question_desc:0 "Kore yarımadasını bir süredir kontrol ediyoruz, ancak Kore'nin kendi kaderini tayin etme sorunu giderek daha acil hale geliyor. Komşularımızın kendi kendilerini yönetme hakkını inkâr ederken gerçekten de demokratik ideallere bağlı olduğumuzu iddia edebilir miyiz?"
 JAP_the_manchurian_project:0 "Mançurya Projesi"
 JAP_the_manchurian_project_desc:0 "Adalarımız kullanılabilir arazi açısından kıtken, anakara mülklerimiz değil. Kendimiz inşa edemediğimiz şeyi, anakarada inşa edebiliriz. [MAN.GetNameDef] için büyük ölçekli bir sanayileşme programı başlatacağız."
 JAP_the_showa_constitution:0 "Şova Anayasası"
 JAP_the_showa_constitution_desc:0 "Ulusumuzun imparatorluk geçmişini kabul ediyor ve saygı duyuyoruz. Ancak, otoriterliğin inşa etmek istediğimiz Japonya'da yeri yok. İmparator'u göstermelik bir lider olarak koruyacağız, ancak anayasada gücünü sınırlayacağız, tıpkı birçok Batı ülkesinde olduğu gibi."
 JAP_the_ultimate_battleship:0 "Nihai Savaş Gemisi"
 JAP_the_ultimate_battleship_desc:0 "Kaynak açısından zengin olmadığımız için, onu en iyi şekilde kullandığımızdan emin olmalıyız. Gezegenin yüzeyine konmuş en güçlü zırhlıları inşa edeceğiz, herhangi bir düşmanı kafa kafaya bir çatışmada yenebilecek kapasitede."
 JAP_the_unthinkable_option:0 "Düşünülemez Seçenek"
 JAP_the_unthinkable_option_desc:0 "Ulusumuzun geleceği, liderlerimiz tarafından daha önce hiç düşünülmemiş bir yol gerektiriyor. Bu seçenek şimdi ciddiyetle düşünülmelidir."
 JAP_the_zero:0 "Zero"
 JAP_the_zero_desc:0 "Mitsubishi'nin yeni bir tasarımı, bugüne kadar tasarlanmış en yetenekli uçak gemisi tabanlı avcı uçağı olabilir. Eşsiz manevra kabiliyeti, iyi bir menzille birleştiğinde, tasarımın muhtemelen yıllarca bize yeteceği anlamına geliyor. Derhal prototip ve üretime başlamalıyız."
 JAP_the_zero_tt:0 "§HMitsubishi A6M Zero-sen§! üretimine olanak tanır!"
 JAP_tokyo_aluminum_plant:0 "Tokyo Alüminyum Tesisi"
 JAP_tokyo_aluminum_plant_desc:0 "Ulusun kendi kendine yeterliliğini artırmak için işçilerimizin gücünden yararlanacağız."
 JAP_tora_tora_tora_idea:0 "Tora! Tora! Tora!"
 JAP_tora_tora_tora_idea_desc:0 "İlk darbelerinden sonra Japonlar, uçak gemisi kuvvetleriyle agresif bir yıldırım harekâtına girişiyor."
 JAP_torpedo_cruisers:0 "Torpido Kruvazörleri"
 JAP_torpedo_cruisers_desc:0 "Bütün bir gemi sınıfını yeni torpidolarımızdan çok sayıda taşımaya adayacağız, bu da onların düşman filosuna büyük zarar vermelerini sağlayacak."
 JAP_ultimate_deterrence:0 "Nihai Caydırıcılık"
 JAP_ultimate_deterrence_desc:0 "Vatandaşlarımızı korumanın en iyi yolu, onların asla bir savaşta savaşmamalarını sağlamaktır. Korkunç güce sahip yeni silahların geliştirilmesi, bunu asla yapmak zorunda kalmamalarını sağlayabilir."
 JAP_unified_fighter_development:0 "Birleşik Avcı Uçağı Geliştirme"
 JAP_unified_fighter_development_desc:0 "Çok uzun zamandır ordu ile donanma arasındaki ayrı havacılık gelişimiyle uğraştık. Hem silahlanma tekdüzeliğini sağlamak hem de sınırlı araştırma kaynaklarımızı daha iyi kullanmak için bu programları birleştirmeliyiz."
 JAP_warrior_spirit:0 "Savaşçı Ruhu"
 JAP_warrior_spirit_desc:0 "Devlet Şintosu, halka devletin ve İmparatorluk ailesinin iyiliği için kendini feda etme ihtiyacını aşılamamızı sağlar."
 JAP_west_pacific_treaty_organization:0 "Batı Pasifik Antlaşması Örgütü"
 JAP_west_pacific_treaty_organization_desc:0 "Diğer Asya uluslarıyla kendi ittifakımız, yeni bulduğumuz yaşam tarzımıza yönelik potansiyel tehditlere karşı sıkı bir şekilde durmamızı sağlayacaktır."
 JAP_yamato_tt:0 "Sırasıyla %75 ve %50 tamamlanmış iki §YYamato Sınıfı§! Süper Ağır Zırhlı üretim hattı ekler."
 MAN_alliance_with_the_kwantung_army:0 "Kwantung Ordusu ile İttifak"
 MAN_alliance_with_the_kwantung_army_desc:0 "Ülkedeki Japon kuvvetleri genellikle fikirlerimizle çelişir. Mümkün olduğunca az çatışmayla birlikte çalışmamızı sağlamak için onlarla daha yakın bir bağlantı kurmalıyız."
 MAN_army_modernization:0 "Ordu Modernizasyonu"
 MAN_army_modernization_desc:0 "Ordumuz hem küçük hem de modası geçmiş. Mevcut kaynaklarımız göz önüne alındığında, bu kabul edilemez. Kendi yükümüzü çekebilmeliyiz."
 MAN_assert_our_authority:0 "Otoritemizi Kur"
 MAN_assert_our_authority_desc:0 "Ülkenin geri kalanı kendi içinde bölünmüş durumda. Kendilerine savaş lordu ve Başkan diyen gaspçıların ve haydutların hiçbiri yönetmeye uygun değil. Hizaya getirilecekler ve aydınlanmış yönetimimiz tüm Çin'e yayılacak."
 MAN_assertiveness:0 "İddialılık"
 MAN_assertiveness_desc:0 "Japonlar, sinir bozucu bir kibirle üzerimizde hüküm sürmeye devam ediyor. Onlara bizim de saygıya layık bir İmparatorluk olduğumuzu hatırlatmalıyız."
 MAN_bolster_nationalism:0 "Milliyetçiliği Güçlendir"
 MAN_bolster_nationalism_desc:0 "Çok uzun zamandır insanlar Mançukuo'yu Japonlar tarafından oluşturulmuş yapay bir yapı olarak görüyorlar. Ama her ulus bir zamanlar sadece bir fikirdi. Halkta bir Mançu kimliği duygusu oluşturmalı ve fikri gerçeğe dönüştürmeliyiz."
 MAN_chinese_leadership:0 "Çin Liderliği"
 MAN_chinese_leadership_desc:0 "Çin halkının bir Çinli lidere ihtiyacı var. Tüm Çin üzerinde İmparatorluk Yönetiminin tam restorasyonundan daha azını hedeflemediğimizi alenen ilan etmeliyiz."
 MAN_claim_the_mandate_of_heaven:0 "Göklerin Vekaletini Talep Et"
 MAN_claim_the_mandate_of_heaven_desc:0 "Savaştaki zaferlerimiz, göklerin kendisinin İmparator'u adil ve Göksel Taht'a layık gördüğünü açıkça ortaya koydu. Tüm Çin'in meşru hükümdarı olmadığına dair her türlü şüphe, bu ezici kanıt karşısında yok olmalıdır."
 MAN_collective_farms:0 "Kolektif Çiftlikler"
 MAN_collective_farms_desc:0 "Tek bir aile tarafından sahip olunan ve işletilen bireysel çiftlikler sistemi hem geri kalmış hem de verimsizdir. Bir köyün tüm insan gücünü ve arazisini tek bir varlıkta birleştirmek, çok daha verimli bir kalkınmaya olanak tanır."
 MAN_develop_aluminum_sources:0 "Alüminyum Kaynaklarını Geliştir"
 MAN_develop_aluminum_sources_desc:0 "Liaoning'de sömürülmeye hazır geniş Boksit yataklarımız var. Havacılık endüstrimize hayati bir destek sağlayacaklar."
 MAN_empower_the_legislative_council:0 "Yasama Konseyini Güçlendir"
 MAN_empower_the_legislative_council_desc:0 "Yasama Konseyi şu anda Japon efendilerimizin önüne koyduğu her şeyi kabul eden törensel bir organdan biraz daha fazlası. Gerçek bir egemen ulus olmak istiyorsak, önce yasama konularında tam özerkliğe sahip olmalıyız."
 MAN_expand_showa_steel_works:0 "Showa Çelik Fabrikalarını Genişlet"
 MAN_expand_showa_steel_works_desc:0 "Showa Çelik Fabrikaları, ağır sanayimizin bel kemiğini oluşturur. Onlara yatırım yapmak, ileride faydalarını görmemizi sağlayacaktır."
 MAN_expand_the_imperial_guards:0 "İmparatorluk Muhafızlarını Genişlet"
 MAN_expand_the_imperial_guards_desc:0 "İmparatorluk Muhafızları yeni ordumuzun seçkinlerini oluşturacak ve tüm askerlerimizin gıpta edeceği bir örnek olacaktır."
 MAN_expand_the_imperial_guards_tt:0 "§Y7 Piyade§! ve §Y2 Topçu§! taburuna sahip 4 birim kazan.\n"
 MAN_expand_the_railways:0 "Demiryollarını Genişlet"
 MAN_expand_the_railways_desc:0 "Modern bir demiryolu sistemi, ulusumuzun tüm parçalarını birbirine bağlamak ve onu tek bir çatı altında bir araya getirmek için anahtardır."
 MAN_expand_the_textile_industry:0 "Tekstil Sanayisini Genişlet"
 MAN_expand_the_textile_industry_desc:0 "Tekstil işletmelerimiz uzun zamandır sanayimizin temel direği olmuştur ve sanayi tabanımızı genişletmek için daha fazla yabancı sermaye edinmenin en kolay yolu olacaktır."
 MAN_first_five_year_plan:0 "Birinci Beş Yıllık Plan"
 MAN_first_five_year_plan_desc:0 "Komünizmle olan ilişkisiyle lekelenmiş olsa da, beş yıllık plan bir ülkenin ekonomik kalkınmasını planlamada değerli bir araçtır. Sanayimizin genişlemesini yönlendirmek için böyle bir plan uygulamalıyız."
 MAN_five_equal_peoples:0 "Beş Eşit Halk"
 MAN_five_equal_peoples_desc:0 "Bir halkın diğerleri üzerinde üstün olduğu günler sona erdi. Mançukuo, Ruslar, Japonlar, Moğollar, Koreliler ve Mançular olmak üzere beş halkın uyum içinde birlikte yaşayacağı yeni bir ulus tipi olacak."
 MAN_five_people_armies:0 "Beş Halk Ordusu"
 MAN_five_people_armies_desc:0 "Eğer her vatandaş eşitse, o zaman her vatandaş onu yabancı zalimlere karşı eşit derecede savunmaya hazır ve istekli olmalıdır."
 MAN_five_people_armies_tt:0 "§Y3 piyade§! taburuna sahip 7 birim kazan.\n"
 MAN_hoankyoku:0 "Hoankyoku"
 MAN_hoankyoku_desc:0 "Hükûmetimiz, Çin'in parlak bir gelecek için sahip olduğu en iyi umuttur. Açıkçası, birçok insanın onun yok olmasını sağlamak için bir çıkarı var. Bu insanları avlayacak ve devletimizi koruyacak bir organizasyona sahip olmalıyız."
 MAN_imperial_divinity:0 "İmparatorluk Kutsallığı"
 MAN_imperial_divinity_desc:0 "Geçmiş zamanlarda, Çin İmparatorları yaşayan tanrılar olarak saygı görürdü. Mevcut İmparator'u bu kadim geleneğe yeniden bağlamalıyız."
 MAN_imperial_university:0 "İmparatorluk Üniversitesi"
 MAN_imperial_university_desc:0 "İmparatorluk, davasını ilerletmek için parlak insanlara ihtiyaç duyar. Halkımızın en iyilerinin ve en parlaklarının birbirlerine öğretmek ve birbirinden öğrenmek için bir araya geldiği bir yer yaratmalıyız."
 MAN_independence_war:0 "Bağımsızlık Savaşı"
 MAN_independence_war_desc:0 "Baskının prangalarını kırma ve kadim özgürlüklerimiz için savaşma zamanı geldi. Mançukuo, tüm yabancı baskılardan arınmış olarak özgürce nefes alan ilk Çin parçası olacak."
 MAN_invite_japanese_investors:0 "Japon Yatırımcıları Davet Et"
 MAN_invite_japanese_investors_desc:0 "Ülkemizi geliştirmek dış yardım gerektirecektir. Japonya'daki bir dizi şirket, ulusumuza yatırım yapmaya istekli olduklarını belirtti."
 MAN_invite_japanese_settlers:0 "Japon Yerleşimcileri Davet Et"
 MAN_invite_japanese_settlers_desc:0 "İnsanımızdan çok daha fazla alanımız var. Ülkenin geniş alanları esasen vahşi doğa olarak kalıyor. Yeni topluluklar oluşturmak ve daha fazla ekonomik kalkınmaya olanak sağlamak için bu alanlara insanları yerleştirmeliyiz."
 MAN_law_university:0 "Hukuk Üniversitesi"
 MAN_law_university_desc:0 "Ülkemiz hala genç. Hükûmetin en modern anlayışına dayalı tamamen yeni bir hukuk sistemi yaratmak için gerçek bir fırsatımız var. Bunu yapmak için, Asya'nın en parlak zihinlerinden bazılarını bir araya getirmek için özel bir tesis oluşturmalıyız."
 MAN_local_arms_procurement:0 "Yerel Silah Tedariki"
 MAN_local_arms_procurement_desc:0 "Bize sonsuza kadar silah tedarik etmeleri için Japonlara güvenemeyiz. Kendi başımıza ayakta durmak istiyorsak, kontrol ettiğimiz bir silah kaynağına ihtiyacımız var."
 MAN_mamc:0 "MAMC"
 MAN_mamc_desc:0 "Mançurya Uçak İmalat Şirketi'ni kurmak, bize herhangi birine karşı durabilecek modern bir hava kuvveti inşa etme imkanı verecektir."
 MAN_move_capitals:0 "Başkenti Taşı"
 MAN_move_capitals_desc:0 "Tüm Çin'in kadim başkenti her zaman Pekin olmuştur. Şimdi geri alındığına göre, İmparator'u zaferle eski evine geri döndürebiliriz."
 MAN_mukden_arsenal:0 "Mukden Cephaneliği"
 MAN_mukden_arsenal_desc:0 "Eski İmparatorluk Cephaneliği, ordumuzu modern silahlarla donatacak yeni bir askeri-endüstriyel kompleksin çekirdeğini oluşturacaktır."
 MAN_mukden_military_academy:0 "Mukden Askeri Akademisi"
 MAN_mukden_military_academy_desc:0 "Eğer hedeflerimize ulaşmak için sadece kitleye güvenmekten daha fazlasını istiyorsak, ordumuzun onu yönetecek iyi ve sadık subaylara ihtiyacı var."
 MAN_national_cooperation_government:0 "Ulusal İşbirliği Hükûmeti"
 MAN_national_cooperation_government_desc:0 "Japonların, bir işbirliği hükûmeti kurmak için diğer Çinli politikacıları -sıradan halktan- düşündüklerine dair rahatsız edici söylentiler aldık. Bu kabul edilemez. Birleşik kuvvetlerimiz tarafından alınan her Çin toprağının bizim tarafımızdan yönetildiğinden emin olmalıyız."
 MAN_national_defense_state:0 "Ulusal Savunma Devleti"
 MAN_national_defense_state_desc:0 "Savaş kazanılana ve tüm Çin'i yönetmeye geri dönene kadar, her türlü çabayı göstermeli, her fedakarlığı yapmaya istekli olmalı ve savaşı yürütmek için mevcut her kaynağı kullanmalıyız."
 MAN_obedience:0 "İtaat"
 MAN_obedience_desc:0 "Bazıları bize sadece bir Japon kuklası diyor, ama bizim yakın ve eşit ilişkimizi temelden yanlış anlıyorlar. Velinimetlerimize karşı çıkmak, bir çocuğun ebeveynlerine karşı çıkmasıyla aynı şeydir."
 MAN_offer_vassalization:0 "Vassallık Teklif Et"
 MAN_offer_vassalization_desc:0 "Savaş ülkeyi paramparça etti. Şimdiye kadar taraf tutmayı reddedenlere sarayımızda bir yer teklif edersek, bunu sona erdirebiliriz."
 MAN_pacify_the_countryside:0 "Kırsal Bölgeyi Sakinleştir"
 MAN_pacify_the_countryside_desc:0 "İktidara geldiğimizden beri, haydutlar ve isyancılar ülkenin daha uzak bölgelerinde yönetimimize meydan okumaya çalıştılar. Eğer bir hükûmet olarak ciddiye alınmak istiyorsak, bu teröristlerin kökünü kazımalı ve halka yönetimimizi uygulayabildiğimizi göstermeliyiz."
 MAN_pacify_the_countryside_effect_tooltip:0 "Kırsaldaki haydutları etkisiz hale getirmek için belirli eyaletlerde birlik bulundurun.\n"
 MAN_purge_the_general_affairs_council:0 "Genel İşler Konseyini Tasfiye Et"
 MAN_purge_the_general_affairs_council_desc:0 "Genel İşler Konseyi, hükûmetimiz üzerinde tam kontrole sahip olduklarından emin olmak için Japonlar tarafından kuruldu. Bu böyle devam edemez. Hükûmetimize sadakati biraz bile şüpheli olan herkesi ortadan kaldırmalıyız."
 MAN_reclaim_the_empire:0 "İmparatorluğu Geri Al"
 MAN_reclaim_the_empire_desc:0 "Şimdi özgürlüğümüzü kazandığımıza göre, Çin'in geri kalanındaki hainlere ve isyancılara karşı savaşı sürdürme zamanı geldi. Bu ülkeyi yöneteceğiz ya da bu girişimde yok olacağız."
 MAN_reform_the_civil_service:0 "Memuriyeti Reforme Et"
 MAN_reform_the_civil_service_desc:0 "Genel İşler Konseyi sadece buzdağının görünen kısmıydı. Japonlar, Memuriyetin büyük bir bölümünü tamamen bizim kontrolümüz dışında yönetiyorlardı. Kendi yöneticilerimizi yerine koymalıyız."
 MAN_request_control_of_the_railways:0 "Demiryollarının Kontrolünü Talep Et"
 MAN_request_control_of_the_railways_desc:0 "Bizimki kadar büyük bir ülkede, demiryollarını kontrol etmek ülkeyi kontrol etmek demektir. \n\nVe demiryollarını Japonlar kontrol ediyor.\n\n Bu değişmeli."
 MAN_research_and_education_department:0 "Araştırma ve Eğitim Departmanı"
 MAN_research_and_education_department_desc:0 "Ulusumuz büyüdükçe, eğitim ve araştırma tesislerimizin de ona uygun şekilde büyümesini sağlamalıyız. Araştırma çabalarımızın en çok ihtiyaç duyulan yerlere odaklandığından emin olmak için daha büyük çabalar gösterilmelidir."
 MAN_second_five_year_plan:0 "İkinci Beş Yıllık Plan"
 MAN_second_five_year_plan_desc:0 "Birinci Beş Yıllık Plan'ın başarısıyla, onu başka bir ekonomik kalkınma planıyla tekrarlamamız mantıklıdır."
 MAN_social_research_unit:0 "Sosyal Araştırma Birimi"
 MAN_social_research_unit_desc:0 "Halkımızın yollarını ve geleneklerini araştırmak için özel bir birim kurmalıyız, böylece onları ulusun üretken vatandaşları olmaları için daha iyi yönlendirebiliriz."
 MAN_staff_the_court_with_manchus:0 "Saray Personelini Mançularla Donat"
 MAN_staff_the_court_with_manchus_desc:0 "Qing hanedanı yüzyıllardır Çin'i yönetti. Eski ihtişamımızı geri kazanmak istiyorsak, onların örneğini mümkün olduğunca yakından takip ettiğimizden emin olmalıyız."
 MAN_the_two_emperors:0 "İki İmparator"
 MAN_the_two_emperors_desc:0 "Japonların tamamen eşit ortaklarından başka bir şey olmadığımız saçma düşüncesini ortadan kaldırma zamanı geldi. İki İmparatorumuz kardeş gibidir!"
 MAN_trade_delegation:0 "Ticaret Heyeti"
 MAN_trade_delegation_desc:0 "Dünyanın geri kalanı endüstriyel yöntemlerde bizden daha ileride. Kendi yöntemlerimizi geliştirmek için onların tekniklerini incelemek üzere bir heyet göndermeliyiz."
 MAN_vassalize_mengukuo:0 "Mengkukuo'yu Vassallaştır"
 MAN_vassalize_mengukuo_desc:0 "Mengkukuo Prensi, Mançukuo İmparatoru ile yan yana durmaya uygun değil. Bu aptalca deneyi sona erdirme ve onu hak ettiği yere koyma zamanı geldi."
 MAN_white_russian_advisers:0 "Beyaz Rus Danışmanlar"
 MAN_white_russian_advisers_desc:0 "Rus iç savaşından sonra, bir dizi Rus, Sovyetlerin yenilmiş düşmanları için planladığı kader yerine sürgünü tercih etti. Ordumuzu yeniden inşa etmek ve eğitmek için bu insanları kullanabiliriz."
 PRC_100_regiments_campaign:0 "100 Alay Harekâtı"
 PRC_100_regiments_campaign_desc:0 "Şimdilik küçük muharebelere ve çatışmalara odaklandık. Düşmanlarımız bizi zayıf ve sadece bir baş belası sanıyor. Bir güvenlik duygusuna kapılmış olarak, büyük bir taarruza hazırlıksız olacaklardır."
 PRC_abolish_the_land_rent:0 "Toprak Kirasını Kaldır"
 PRC_abolish_the_land_rent_desc:0 "Toprağın özel mülkiyeti saçma bir kavramdır. Toprak, onu işleyene aittir. Köylülerin kendi kendilerini örgütlemelerine izin vermek, onların desteğini sağlayacaktır."
 PRC_agrarian_socialism:0 "Tarımsal Sosyalizm"
 PRC_agrarian_socialism_desc:0 "Çin, dünyanın sanayileşmiş ulusları gibi değil. Marx'ın hayal ettiği gibi bir komünist devrim beklemek, ülkemizin içinde bulunduğu durumu yanlış anlamaktır."
 PRC_anti_japanese_expedition:0 "Japon Karşıtı Sefer"
 PRC_anti_japanese_expedition_desc:0 "Mevcut konumumuzda Japonlarla açık muharebede yüzleşmek cesaretten çok aptallık olur. Önce üs sahaları oluşturmak için düşman topraklarına küçük gruplar göndererek zemini hazırlamalıyız. Zamanı geldiğinde, ayaklanma çağrısı yapacağız."
 PRC_ban_the_opium_trade:0 "Afyon Ticaretini Yasakla"
 PRC_ban_the_opium_trade_desc:0 "Afyon, batılı güçlerin bizi dizlerimizin üzerine çökerttiği araç olmuştur. Bu kötülüğün yayılmasına izin veremeyiz."
 PRC_central_military_commission:0 "Merkez Askeri Komisyonu"
 PRC_central_military_commission_desc:0 "Konumumuz daha güvenli hale geldiğinde, hayatta kalma için devrimci mücadeleden ulusal liderlik mücadelesine geçebiliriz."
 PRC_central_security_bureau:0 "Merkezi Güvenlik Bürosu"
 PRC_central_security_bureau_desc:0 "Karşı-devrimin en küçük bir köyde bile kök salmasına izin veremeyiz. Amacımız, her bir haini herhangi bir zarar veremeden önce bulmak olmalıdır."
 PRC_china_medical_university:0 "Çin Tıp Üniversitesi"
 PRC_china_medical_university_desc:0 "Hijyen ve tıbbi bakım, ordumuzu sahada tutacak ve vatandaşlarımızın durumunu iyileştirmemizi sağlayacaktır. Bu alanlarda yeni yöntemler geliştireceğimizi ve bunları halkımıza öğreteceğimizi garanti edeceğiz."
 PRC_coalition_government:0 "Koalisyon Hükûmeti"
 PRC_coalition_government_desc:0 "Ülkemizin birleşmesi açıkça hala çok uzakta olsa da, Milliyetçilerle ortak bir hükûmet kurmak yolu düzleştirecektir."
 PRC_confrontation_with_the_warlords:0 "Savaş Lordlarıyla Yüzleşme"
 PRC_confrontation_with_the_warlords_desc:0 "Çin'deki bazı unsurlar merkezi hükûmeti görmezden geliyor, mücadelede taraf tutmayı reddediyor. Bazıları gizlice ülkeyi ele geçirme veya Japonlarla işbirliği yapma tasarıları bile barındırabilir. Hizaya getirilmeleri gerekiyor."
 PRC_enforce_the_three_rules:0 "Üç Kuralı Uygula"
 PRC_enforce_the_three_rules_desc:0 "1: Emirlere Uy.\n 2: Köylülerden çalma.\n 3: Düşmandan ele geçirilen her şeyi teslim et.\n Bu basit kurallarla halka onların yanında olduğumuzu göstereceğiz."
 PRC_exploit_the_weak_neighbours:0 "Zayıf Komşuları Sömür"
 PRC_exploit_the_weak_neighbours_desc:0 "Komşularımız yolsuzluk ve iç çekişmelerle zayıflamış durumda. Bu, topraklarımızı genişletmek için mükemmel bir fırsat sunuyor."
 PRC_focus_on_china:0 "Çin'e Odaklan"
 PRC_focus_on_china_desc:0 "Hala Milliyetçiler ve savaş lordlarıyla savaşırken Japonlara karşı durmayı umamayız. Japonları alt etmeden önce onları yenmeliyiz."
 PRC_form_the_academy_of_sciences:0 "Bilimler Akademisi'ni Kur"
 PRC_form_the_academy_of_sciences_desc:0 "Tüm çeşitli araştırma tesislerimizi ve üniversitelerimizi birleştireceğiz ve onları daha verimli yönetmek için yeni bir organizasyon oluşturacağız."
 PRC_government_of_national_defense:0 "Ulusal Savunma Hükûmeti"
 PRC_government_of_national_defense_desc:0 "Bölünmüş bir ülke, yenilgiye davetiye çıkaran bir ülkedir. Savunmamızı koordine etmek için Milliyetçilerle güçlerimizi birleştirmeliyiz."
 PRC_infiltration:0 "Sızma"
 PRC_infiltration_desc:0 "Milliyetçiler onlarla açık alanda savaşmamızı istiyor. Bu tuzağa düşmemeliyiz. Düşman topraklarına üs bölgeleri oluşturmak için küçük asker grupları göndereceğiz. Zamanı geldiğinde bir ayaklanma başlatacak ve Milliyetçileri hazırlıksız yakalayacağız."
 PRC_internationalism:0 "Enternasyonalizm"
 PRC_internationalism_desc:0 "Dünyanın işçileri ve köylüleri, zincirlerinden kurtulmak için birleşmelidir. Omuz omuza, daha iyi bir gelecek inşa edeceğiz."
 PRC_land_redistribution:0 "Toprak Yeniden Dağıtımı"
 PRC_land_redistribution_desc:0 "Yüzyıllardır, toprağı işleyen insanlar, aslında ona sahip olan insanlara kira ödemek zorunda kaldılar. Bunu değiştireceğiz."
 PRC_literacy_programs:0 "Okuryazarlık Programları"
 PRC_literacy_programs_desc:0 "Modern bir toplum yaratmanın ilk adımı, tüm vatandaşlarının eldeki meseleleri anlayabilmesini ve çözülmesine yardımcı olabilmesini sağlamaktır."
 PRC_maoism:0 "Maoizm"
 PRC_maoism_desc:0 "Büyük Başkan, siyasi teorilerini ülkemizi ileriye taşıyacak tutarlı bir ideolojiye dönüştürmek için uzun aylar harcadı."
 PRC_marxist_orthodoxy:0 "Marksist Ortodoksluk"
 PRC_marxist_orthodoxy_desc:0 "Gerçek komünizme ulaşmanın anahtarı, Marx'ın öğretilerini mümkün olan en büyük ölçüde uygulamaktır."
 PRC_military_intelligence_department:0 "Askeri İstihbarat Departmanı"
 PRC_military_intelligence_department_desc:0 "Genel halk arasında bize değerli bilgiler sağlayan birçok dostumuz var. Daha da fazla düşmanımız var. Birini diğerinden ayırmak için bir örgüt kurmalıyız."
 PRC_mobile_warfare:0 "Mobil Savaş"
 PRC_mobile_warfare_desc:0 "Sonsuza kadar dağlarda ve ormanlarda saklanamayız. Savaşı düşmana taşıma ve dünyaya onlarla açık alanda savaşmaktan korkmadığımızı gösterme zamanı geldi."
 PRC_national_leadership:0 "Ulusal Liderlik"
 PRC_national_leadership_desc:0 "Kay-şek gittiğine göre, yeniden birleşmeye yönelik son muhalefet de ortadan kalktı. Bu birleşik hükûmette liderliği üstlenmemiz doğaldır."
 PRC_peoples_liberation_army:0 "Halk Kurtuluş Ordusu"
 PRC_peoples_liberation_army_desc:0 "Çin Kızıl Ordusu büyük işler başardı. Gelecekte, halkımızı kurtarmak için savaşırken daha da büyük onurlar kazanacak."
 PRC_peoples_volunteer_army:0 "Halk Gönüllü Ordusu"
 PRC_peoples_volunteer_army_desc:0 "Dünyanın işçilerini ve köylülerini kurtarma mücadelesi birçok ülkede veriliyor. Bu çatışmalara doğrudan müdahale etmek her zaman akıllıca değildir. Bazen, güç dengesini değiştirmek için küçük bir kuvvet yeterlidir."
 PRC_peoples_war:0 "Halk Savaşı"
 PRC_peoples_war_desc:0 "Diğer ülkeler savaşları teknoloji ve ateş gücünün kazandığına inanabilir. Biz daha iyisini biliyoruz. Fedakarlık yapmaya istekli kararlı bir halkın karşısında durabilecek hiçbir teknoloji yoktur."
 PRC_permit_opium_trade:0 "Afyon Ticaretine İzin Ver"
 PRC_permit_opium_trade_desc:0 "Talihsiz yan etkilerine rağmen, köylülerin haşhaş ekmesine izin vermek, ordularımızı tedarik etmek için gereken parayı bize sağlayacaktır."
 PRC_prepare_for_war_with_japan:0 "Japonya ile Savaşa Hazırlan"
 PRC_prepare_for_war_with_japan_desc:0 "Japon militaristleri ulusumuza yönelik en büyük tehdidi oluşturuyor. Onu parçalamak ve hiçbir Çin hükûmetinin hayal bile edemeyeceği şekillerde sömürmek istiyorlar. Milliyetçilere karşı mücadele bunun yanında sönük kalır."
 PRC_proclaim_the_peoples_republic:0 "Halk Cumhuriyetini İlan Et"
 PRC_proclaim_the_peoples_republic_desc:0 "Milliyetçiler üzerindeki zaferle, Çin'in meşru hükûmeti olarak hak ettiğimiz yeri alma zamanı geldi. Hala yapılması gereken çok iş var, ama gelecek her zamankinden daha parlak görünüyor."
 PRC_protracted_warfare:0 "Uzun Süreli Savaş"
 PRC_protracted_warfare_desc:0 "Savaşı kendi şartlarımıza göre yürütmeliyiz. Çin'in bolca insanı ve bolca zamanı var. Düşmanla açık muharebede yüzleşmek intihar olur."
 PRC_provoke_japan:0 "Japonya'yı Kışkırt"
 PRC_provoke_japan_desc:0 "Üç nesildir, Japon tehdidinin gölgesinde yaşadık. Japon yayılmacılığına karşı muhalefet, bizi Çin halkının gözünde kahraman yapacak. Ve eğer Japonlar bize ihtiyacımız olan savaşı vermek istemezlerse, o zaman onları biz mecbur bırakacağız."
 PRC_purge_the_radicals:0 "Radikalleri Tasfiye Et"
 PRC_purge_the_radicals_desc:0 "Partimizdeki bazı unsurlar hala sınıf mücadelesi ve sözde sömürücü sınıfa karşı muhalefet doktrinine inanıyor. Gitmek zorunda kalacaklar."
 PRC_rectification_campaign:0 "Düzeltme Kampanyası"
 PRC_rectification_campaign_desc:0 "Mücadelemizin hangi yönde ilerlemesi gerektiği konusunda bir dizi yanlış anlama olmuştur. Yanılgı içindeki yoldaşlara yollarının yanlışlığını kabul etme şansı vermeliyiz."
 PRC_remove_chiang_kai_shek:0 "Çan Kay-şek'i Ortadan Kaldır"
 PRC_remove_chiang_kai_shek_desc:0 "Çabalarımıza rağmen, Generalissimo bizi hala kalpten komünist olarak görüyor. Şiddetli muhalefeti bir sorun haline geldi. Önlemler alınması gerekecek."
 PRC_revolutionary_military_commission:0 "Devrimci Askeri Komisyon"
 PRC_revolutionary_military_commission_desc:0 "Düşmanlarımıza karşı devrimci mücadele, özel olarak oluşturulmuş bir organ aracılığıyla koordine edilmelidir."
 PRC_social_democracy_focus:0 "Sosyal Demokrasi"
 PRC_social_democracy_focus_desc:0 "Partinin radikal politikaları işleri daha iyi değil, daha kötü hale getirdi. Milliyetçiler, tüm kusurlarına rağmen, daha iyi bir gelecek inşa etme mücadelesinde müttefiklerimizdir. Siyasi alanda onlara doğru hareket etmeliyiz."
 PRC_socialism_with_chinese_characteristics:0 "Çin Özelliklerine Sahip Marksizm"
 PRC_socialism_with_chinese_characteristics_desc:0 "Şüphesiz parlak olsa da, Marx özellikle Avrupalı bir perspektiften yazdı. Çin'in özel durumu, sosyalist politikaları uygulamamızda yansıtılacaktır."
 PRC_socialist_market_economy:0 "Sosyalist Piyasa Ekonomisi"
 PRC_socialist_market_economy_desc:0 "Sosyalizme ve komünizme giden yol, tanım gereği, kapitalizmden geçmelidir. Çin hiçbir zaman uygun bir kapitalist piyasa ekonomisi geliştirmedi, bu da sosyalizme doğru ilerlemeyi neredeyse imkansız kılıyor. Daha ileri gitmeden önce önce kapitalist üretim tarzlarını geliştirmeliyiz."
 PRC_soviet_economic_aid:0 "Sovyet Ekonomik Yardımı"
 PRC_soviet_economic_aid_desc:0 "Uzun Yürüyüş'ün yıkımını dış yardım olmadan aşmak nesiller sürerdi. Ekonomik yardım istemek için Sovyetlere yaklaşmalıyız. "
 PRC_soviet_leadership:0 "Sovyet Liderliği"
 PRC_soviet_leadership_desc:0 "Sovyetler Birliği, tam komünizme giden yolda önde gelen ülkedir. Bunu kabul etmeli ve onların örneğinden öğrenmeliyiz."
 PRC_strengthen_the_central_secretariat:0 "Merkez Sekreteryasını Güçlendir"
 PRC_strengthen_the_central_secretariat_desc:0 "Uzun Yürüyüş'ün ardından, Milliyetçilerle rekabet edebilecek bir devlet yaratmak için siyasi örgütümüzü yeniden düzenlemeliyiz."
 PRC_strengthen_the_left_wing_of_the_kmt:0 "KMT'nin Sol Kanadını Güçlendir"
 PRC_strengthen_the_left_wing_of_the_kmt_desc:0 "Milliyetçilerin, rejimlerimiz arasında bir anlaşmaya varma çabalarını sabote etmeye çalışan iç hiziplerle kendi sorunları var. KMT'deki müttefiklerimizin bu güç mücadelesini kazanmasını sağlamak için elimizden gelen her şeyi yapmalıyız."
 PRC_the_yanan_base_area:0 "Yan'an Üs Sahası"
 PRC_the_yanan_base_area_desc:0 "Devrimimizin temeli Yan'an'daki sahadır. Yaklaşan mücadelede galip gelmek istiyorsak, genişletilmeli ve geliştirilmelidir."
