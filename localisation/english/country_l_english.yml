 ARMY_EXPERIENCE:0 " Kara Ordusu Deneyimi"
 ARMY_EXPERIENCE_DESC:0 "Teçhizatınız çatışmada kullanıldıkça Ordu Deneyimi kazanırsınız. Bu, §HTümenleriniz§! savaşa girdiğinde veya Müttefiklerinizin savaşlarına teçhizat §HÖdünç Ver-Kirala§! desteği sağladıysanız Ordu Deneyimi kazanabileceğiniz anlamına gelir.\nAyrıca, en az $UNIT_TRAINING_LEVEL|Y$ seviyesindeki birliklerle §HOrdu Tatbikatları§! yürüterek ve belirli §HMilli Hedeflerden§! deneyim kazanırsınız. Bazı §HBakanlar§! kazanılan deneyimi artırabilir.\n\nOrdu Deneyimi, §HTümen Şablonlarınızı§! oluşturmak ve değiştirmek ve §HDoktrinlerin§! kilidini açmak için gereklidir."
