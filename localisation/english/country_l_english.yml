 AIR_EXPERIENCE:0 " Hava Kuvvetleri Deneyimi"
 AIR_EXPERIENCE_DESC:0 "Uçaklarınız görevlerde düşmanla çatıştığında veya §HPilot Egzersizlerinde§! pratik yaptığında Hava Deneyimi kazanırsınız. Bu, §HHava Kanatlarınız§! savaşa girdiğinde veya Müttefiklerinizin savaşlarına teçhizat ile §HÖdünç Ver-Kirala§! desteği sağladıysanız Hava Deneyimi kazanabileceğiniz anlamına gelir.\nBelirli §HMilli Hedefler§! ek deneyim sağlar ve bazı §HBakanlar§! kazanılan deneyimi artırabilir.\n\nHava Deneyimi, mevcut uçakların daha iyi varyantlarını geliştirmek, yenilerini tasarlamak ve §HDoktrinlerin§! kilidini açmak için kullanılır."
